answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Espagnol A1
  description: 'Espagnol débutant pour parler des animaux de compagnie et des animaux courants : les nommer, s’en occuper simplement (les promener, leur donner à manger, jouer avec eux), dire quels animaux tu adores même si tu n’en as pas et former le pluriel régulier en espagnol.'
units:
  es.a1.unit53.animals:
    title: Les animaux et les animaux de compagnie
lessons:
  es.a1.unit53.lesson01.perro_gato_pez_y:
    title: Le chien, le chat, le poisson et l’oiseau
  es.a1.unit53.lesson02.cuidar_de_una_mascota:
    title: S’occuper d’un animal de compagnie
  es.a1.unit53.lesson03.amar_a_los_animales:
    title: Adorer les animaux
  es.a1.unit53.lesson04.mateo_pregunta_por_el:
    title: Mateo pose des questions sur le chien d’Elena
  es.a1.unit53.lesson05.mateo_lucia_y_diego:
    title: Mateo, Lucía et Diego parlent des animaux
  es.a1.unit53.lesson06.el_pajaro_de_nina:
    title: L’oiseau de Nina
teaching:
  es.a1.unit53.lesson01.teach.el_animal_la:
    title: Un animal, un animal de compagnie
    gloss: l’animal / un animal de compagnie
    note: '*Animal* est le terme général, tandis que *mascota* désigne précisément un animal de compagnie ; *mascota* est féminin, même s’il s’agit d’un mâle.'
    example_gloss:
    - Un chien est un animal.
    - Un chien est aussi un animal de compagnie.
  es.a1.unit53.lesson01.teach.el_perro_el:
    title: Le chien et le chat
    gloss: le chien / le chat
    example_gloss:
    - Elena a un chien.
    - Diego a un chat.
  es.a1.unit53.lesson01.teach.el_pez_el:
    title: Le poisson et l’oiseau
    gloss: le poisson / l’oiseau
    example_gloss:
    - Grand-père a un poisson.
    - Nina a un oiseau.
  es.a1.unit53.lesson01.teach.tienes_mascota:
    title: As-tu un animal de compagnie ?
    gloss: As-tu un animal de compagnie ?
    note: C’est la même structure interrogative *¿Tienes ...?* que tu connais déjà grâce aux unités précédentes.
  es.a1.unit53.lesson01.teach.si_tengo_un:
    title: Oui, j’ai un chien
    gloss: Oui, j’ai un chien.
    note: Une réponse affirmative simple qui utilise le nouveau vocabulaire de cette unité.
  es.a1.unit53.lesson01.teach.no_no_tengo:
    title: Non, je n’ai pas d’animal de compagnie
    gloss: Non, je n’ai pas d’animal de compagnie.
    note: Dans *No tengo mascota*, il suffit de placer *no* avant le verbe ; consulte la remarque grammaticale.
  es.a1.unit53.lesson01.teach.para_decir_que:
    title: 'No tengo : dire que l’on n’a pas quelque chose'
    gloss: 'Pour dire que tu n’as pas quelque chose, place no avant tengo : No tengo tiempo, no tengo mascota.'
    note: On réutilise la structure *no tengo*, déjà étudiée avec *No tengo tiempo* ; seul le nom est nouveau.
  es.a1.unit53.lesson02.teach.sacar_a_pasear:
    title: Promener un animal
    gloss: promener un animal
    note: '*Sacar a pasear* est une expression figée : *sacar* (« sortir ») + *a pasear* (« pour se promener »).'
    example_gloss: Je promène le chien tous les jours.
  es.a1.unit53.lesson02.teach.cuando_el_objeto:
    title: Sacar a pasear et le a personnel
    gloss: 'Quand le complément est un animal ou une personne, on place a devant : saco al perro a pasear.'
    note: On réutilise *saco al perro* de la carte précédente ; le *a* personnel s’emploie devant les animaux ou les personnes auxquels on est attaché.
  es.a1.unit53.lesson02.teach.dar_de_comer:
    title: Donner à manger
    gloss: donner à manger
    example_gloss: Je donne à manger au chat tous les jours.
  es.a1.unit53.lesson02.teach.jugar_con:
    title: Jouer avec
    gloss: jouer avec
    example_gloss: Diego joue avec son chat.
  es.a1.unit53.lesson02.teach.saco_al_perro:
    title: Je promène le chien tous les jours
    gloss: Je promène le chien tous les jours.
    note: '*Sacar a pasear* s’emploie ici avec *todos los días* (« tous les jours »), déjà vu dans une unité précédente ; *a* + *el* devient *al*.'
  es.a1.unit53.lesson02.teach.le_doy_de:
    title: Je donne à manger au chat tous les jours
    gloss: Je donne à manger au chat tous les jours.
    note: '*Dar de comer* (« donner à manger ») signifie nourrir ; *le* représente l’animal : *le doy de comer al gato*.'
  es.a1.unit53.lesson03.teach.el_plural_termina:
    title: 'Plural: perro → perros'
    gloss: 'Le pluriel se termine par -s : perro → perros, gato → gatos. Après une consonne, on ajoute -es : animal → animales.'
    note: La règle du pluriel régulier espagnol est présentée ici pour la première fois à l’aide de noms d’animaux.
  es.a1.unit53.lesson03.teach.perros_gatos:
    title: Les chiens et les chats
    gloss: chiens / chats
    example_gloss:
    - Mateo adore les chiens.
    - Lucía adore les chats.
  es.a1.unit53.lesson03.teach.peces_pajaros:
    title: Les poissons et les oiseaux
    gloss: poissons / oiseaux
    example_gloss:
    - J’adore les poissons.
    - Grand-père adore les oiseaux.
  es.a1.unit53.lesson03.teach.me_encantan_los:
    title: J’adore les animaux
    gloss: J’adore les animaux.
    note: '*Me encantan* est au pluriel parce que *los animales* est pluriel : le verbe s’accorde avec ce que tu adores.'
  es.a1.unit53.lesson03.teach.a_lucia_le:
    title: Lucía adore les chats, mais n’a pas d’animal de compagnie
    gloss: Lucía adore les chats, mais elle n’a pas d’animal de compagnie.
    note: Cette phrase souligne la différence entre adorer un animal et en avoir un.
  es.a1.unit53.lesson04.teach.mateo_tienes_mascota:
    title: Mateo pose une question sur les animaux de compagnie
    gloss: 'Mateo : As-tu un animal de compagnie, Elena ?'
  es.a1.unit53.lesson04.teach.elena_si_tengo:
    title: Elena a un chien
    gloss: 'Elena : Oui, j’ai un chien.'
  es.a1.unit53.lesson04.teach.mateo_como_es:
    title: Mateo demande à quoi il ressemble
    gloss: 'Mateo : À quoi ressemble-t-il ?'
    note: On réutilise *¿Cómo es?*, vu précédemment pour décrire l’apparence, mais cette fois à propos d’un animal.
  es.a1.unit53.lesson04.teach.elena_tiene_el:
    title: Elena décrit son chien
    gloss: 'Elena : Il a le poil châtain et il est petit.'
    note: On réutilise le vocabulaire de la couleur des cheveux et de la taille, étudié pour décrire l’apparence, mais cette fois pour parler du pelage d’un animal.
  es.a1.unit53.lesson04.teach.el_y_lo:
    title: Él et lo pour les animaux
    gloss: Él et lo peuvent aussi désigner un animal, et pas seulement une personne.
    note: Jusqu’ici, chaque emploi de *él* dans ce cours désignait une personne ; il peut aussi désigner un animal, tout comme *lo* (« le, lui ») lorsqu’il est complément.
  es.a1.unit53.lesson04.teach.mateo_lo_sacas:
    title: Mateo pose une question sur les promenades
    gloss: 'Mateo : Le promènes-tu tous les jours ?'
  es.a1.unit53.lesson04.teach.elena_si_lo:
    title: Elena décrit ses habitudes
    gloss: 'Elena : Oui, je le promène tous les jours et je lui donne à manger.'
  es.a1.unit53.lesson05.teach.a_mateo_y:
    title: Mateo, Lucía et Diego parlent des animaux
    gloss: 'Mateo et Lucía adorent tous les deux les animaux, mais aucun d’eux n’a d’animal de compagnie. Mateo adore les chiens et Lucía adore les chats. Diego, lui, a bien un animal de compagnie : un chat. Il joue souvent avec son chat et lui donne à manger tous les jours. Et toi, as-tu un animal de compagnie ?'
    note: Ce texte met en contraste le fait d’adorer un animal et celui d’en avoir réellement un.
    glosses:
      encantan: adorer
      dos: tous les deux
      animales: animaux
      ninguno: tous les deux
      mascota: animal de compagnie
      perros: chiens
      gatos: chats
      gato: chat
      juega: joue
      da: donne
      todos: chaque
      comer: nourriture
  es.a1.unit53.lesson05.teach.diego_juega_a:
    title: Diego joue souvent avec son chat
    gloss: Diego joue souvent avec son chat.
    note: Réutilise *a menudo* (souvent), déjà vu dans les unités précédentes.
  es.a1.unit53.lesson05.teach.me_encantan_los:
    title: J’adore les chiens. Je n’ai pas d’animal de compagnie.
    gloss: J’adore les chiens. Je n’ai pas d’animal de compagnie.
    note: Un modèle de réponse en deux phrases, prêt à être réutilisé pour l’exercice d’expression écrite de cette unité.
  es.a1.unit53.lesson06.teach.elena_nina_tu:
    title: Elena pose une question à Nina
    gloss: 'Elena : Nina, toi aussi, tu as un animal de compagnie ?'
  es.a1.unit53.lesson06.teach.nina_si_tengo:
    title: Nina a un oiseau qui s’appelle Pico
    gloss: 'Nina : Oui, j’ai un oiseau. Il s’appelle Pico.'
    note: '*Se llama* (« s’appelle ») reprend l’expression utilisée pour donner un nom dès la toute première unité.'
  es.a1.unit53.lesson06.teach.mateo_que_bien:
    title: Mateo réagit
    gloss: 'Mateo : Super ! Qu’est-ce que tu fais avec lui tous les jours ?'
  es.a1.unit53.lesson06.teach.nina_le_doy:
    title: Nina le nourrit tous les jours
    gloss: 'Nina : Je le nourris tous les jours.'
  es.a1.unit53.lesson06.teach.mateo_a_mi:
    title: Mateo adore lui aussi les oiseaux
    gloss: 'Mateo : Moi aussi, j’adore les oiseaux.'
  es.a1.unit53.lesson06.teach.elena_que_bien:
    title: Elena conclut la conversation
    gloss: 'Elena : C’est super que nous adorions tous les trois les animaux !'
    note: Cette phrase réunit ce que les trois personnages ont dit sur les animaux dans cette unité.
