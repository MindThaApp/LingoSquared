teaching:
  es.a1.unit08.lesson01.teach.banco_farmacia:
    title: Banque, pharmacie
    gloss: banque, pharmacie
    note: '*Banco* est masculin ; *farmacia* est féminin.'
    example_gloss:
    - Je vais à la banque.
    - La pharmacie ouvre à neuf heures.
  es.a1.unit08.lesson01.teach.parque_restaurante:
    title: Parc, restaurant
    gloss: parc, restaurant
    note: Les deux noms sont masculins.
    example_gloss:
    - Le parc est très joli.
    - Nous mangeons au restaurant.
  es.a1.unit08.lesson01.teach.biblioteca:
    title: Bibliothèque
    gloss: bibliothèque
    note: '*Biblioteca* est féminin.'
    example_gloss: J’étudie à la bibliothèque.
  es.a1.unit08.lesson02.teach.cerca_de:
    title: Près de
    gloss: Le restaurant est près du marché.
    note: '*Cerca de* (près de) est toujours suivi de *de* avant le lieu de référence.'
  es.a1.unit08.lesson02.teach.lejos_de:
    title: Loin de
    gloss: Le parc est loin du marché.
    note: '*Lejos de* (loin de) est le contraire de *cerca de*.'
  es.a1.unit08.lesson02.teach.al_lado_de:
    title: À côté de
    gloss: La banque est à côté du marché.
    note: '*Al lado de* (à côté de) est une expression figée (*al* = *a* + *el lado*). Devant un nom masculin comme *mercado*, *de* + *el* se contracte en *del* : *al lado del mercado*.'
  es.a1.unit08.lesson02.teach.enfrente_de:
    title: En face de
    gloss: La pharmacie est en face du marché.
    note: '*Enfrente de* (en face de) décrit deux lieux qui se font face, par exemple de part et d’autre d’une rue.'
  es.a1.unit08.lesson02.teach.entre:
    title: Entre
    gloss: La bibliothèque est entre la banque et le parc.
    note: '*Entre* (entre) nécessite deux points de référence, reliés ici par *y* (et).'
  es.a1.unit08.lesson03.teach.donde_esta_el_banco:
    title: Demander où se trouve la banque
    gloss: Où se trouve la banque ?
    note: '*Dónde está* (où se trouve) est la tournure interrogative habituelle pour demander où se trouve un lieu.'
  es.a1.unit08.lesson03.teach.esta_al_lado_del_mercado:
    title: Répondre en indiquant un lieu
    gloss: C’est à côté du marché.
    note: '*Del* est la contraction de *de* + *el*, obligatoire devant le nom masculin *mercado*.'
  es.a1.unit08.lesson03.teach.donde_esta_la_farmacia:
    title: Demander où se trouve la pharmacie
    gloss: Où se trouve la pharmacie ?
    note: 'La même tournure interrogative s’emploie avec un nom précédé d’un article féminin : la question ne change pas selon le genre.'
  es.a1.unit08.lesson03.teach.esta_enfrente_del_mercado:
    title: 'Répondre : en face de'
    gloss: C’est en face du marché.
    note: '*Enfrente de* + *el mercado* devient *enfrente del mercado*, avec la même contraction en *del* que dans *al lado del mercado*.'
  es.a1.unit08.lesson04.teach.esta_lejos:
    title: Demander si c’est loin
    gloss: Est-ce loin ?
    note: C’est une brève question complémentaire dans laquelle le sujet est omis puisqu’il est déjà clair grâce au contexte.
  es.a1.unit08.lesson04.teach.no_esta_cerca:
    title: 'Répondre : non, c’est près'
    gloss: Non, c’est près.
    note: '*Cerca* peut s’employer seul, sans *de*, dans une réponse courte, contrairement à l’expression complète *cerca de*, utilisée lorsqu’un lieu précis est nommé.'
  es.a1.unit08.lesson04.teach.si_esta_lejos:
    title: 'Répondre : oui, c’est assez loin'
    gloss: Oui, c’est assez loin.
    note: '*Bastante* (assez, plutôt) renforce *lejos*, mais moins que *muy* (très).'
  es.a1.unit08.lesson05.teach.barrio_reading:
    title: Lire un texte sur le quartier
    gloss: Dans ce quartier, il y a beaucoup de lieux utiles. La banque est à côté du marché. La pharmacie est en face du marché. Le parc est loin, mais la bibliothèque est entre la banque et le parc. Le restaurant est tout près du marché.
    note: Ce court texte réunit les expressions de lieu de cette unité dans une même description du quartier.
    glosses:
      barrio: quartier
      hay: il y a (du verbe haber)
      muchos: beaucoup de
      lugares: lieux
      útiles: utiles
      banco: banque
      está: se trouve (du verbe estar)
      lado: côté
      mercado: marché
      farmacia: pharmacie
      enfrente: en face de
      parque: parc
      lejos: loin
      biblioteca: bibliothèque
      entre: entre
      restaurante: restaurant
      cerca: près
  es.a1.unit08.lesson05.teach.hay_note:
    title: Hay (il y a)
    gloss: Pourquoi hay ne change jamais au singulier ou au pluriel.
    note: Consulte le texte de la carte.
    target_text: '*Hay* (il y a) ne change pas au singulier ou au pluriel : *hay un banco* et *hay muchos lugares* emploient tous deux le même mot.'
  es.a1.unit08.lesson06.teach.line01:
    title: Demander où se trouve la banque
    gloss: Mateo demande à Elena où se trouve la banque.
    note: Il s’agit de la même question avec *¿Dónde está...?* que précédemment dans cette unité, précédée du prénom d’Elena pour attirer son attention.
  es.a1.unit08.lesson06.teach.line02:
    title: Répondre et faire référence au marché
    gloss: Elena dit que la banque est à côté du marché, où ils ont acheté les œufs.
    note: '*Donde compramos los huevos* (où nous avons acheté les œufs) renvoie à leurs courses de l’unité 7.'
  es.a1.unit08.lesson06.teach.line03:
    title: Poser une question sur la pharmacie
    gloss: Mateo montre qu’il a compris, puis pose une question sur la pharmacie.
    note: '*Ah, sí* (ah, oui) est une réaction brève et naturelle avant de poser la question suivante.'
  es.a1.unit08.lesson06.teach.line04:
    title: 'Répondre : en face de'
    gloss: Elena dit que la pharmacie est en face du marché.
    note: 'C’est une réponse courte : le sujet (*la farmacia*) est omis, car la question permet de le comprendre.'
  es.a1.unit08.lesson06.teach.line05:
    title: Poser une question sur le parc
    gloss: Mateo pose une question sur le parc et demande s’il est près.
    note: Deux questions sont réunies dans une même réplique, comme cela se fait naturellement dans une conversation informelle.
  es.a1.unit08.lesson06.teach.line06:
    title: 'Répondre : loin, puis mentionner la bibliothèque'
    gloss: Elena dit que le parc est loin, mais que la bibliothèque est entre la banque et le parc.
    note: '*Pero* (mais) marque le contraste entre l’éloignement du parc et l’emplacement plus pratique de la bibliothèque.'
  es.a1.unit08.lesson06.teach.line07:
    title: Remercier et poser une question sur le restaurant
    gloss: Mateo remercie Elena et l’interroge sur le restaurant où ils ont mangé.
    note: '*El restaurante donde comimos* (le restaurant où nous avons mangé) renvoie à leur déjeuner de l’unité 6.'
  es.a1.unit08.lesson06.teach.line08:
    title: Confirmer que c’est tout près
    gloss: Elena confirme que le restaurant est tout près du marché.
    note: '*Muy cerca* (tout près, très près) : *muy* (très) est plus fort que *bastante* (assez), comme dans *bastante lejos* (assez loin).'
