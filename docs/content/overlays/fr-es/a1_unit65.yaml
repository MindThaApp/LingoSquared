  es.a1.unit65.lesson05.teach.ahora_es_primavera:
    title: Une conversation sur les saisons
    gloss: 'Nous sommes maintenant au printemps. Les tulipes sont belles. Nina demande : Quelle saison aimes-tu ? Mateo dit : J’aime l’été. En été, nous nageons. Elena dit : J’aime l’hiver. En hiver, nous patinons.'
