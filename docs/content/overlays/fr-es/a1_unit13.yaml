teaching:
  es.a1.unit13.lesson01.teach.el_trabajo:
    title: Le travail / l’emploi
    gloss: le travail / l’emploi
    note: '*Trabajo* est masculin et correspond aussi à la forme verbale « je travaille ».'
    example_gloss: J’aime mon travail.
  es.a1.unit13.lesson01.teach.la_oficina:
    title: Le bureau
    gloss: le bureau
    note: '*Oficina* est féminin.'
    example_gloss: Je travaille dans un bureau.
  es.a1.unit13.lesson01.teach.el_escritorio:
    title: Le bureau
    gloss: le bureau
    note: '*Escritorio* est masculin.'
    example_gloss: Voici mon bureau.
  es.a1.unit13.lesson01.teach.la_escuela:
    title: L’école
    gloss: l’école
    note: '*Escuela* est féminin.'
    example_gloss: J’enseigne dans une école.
  es.a1.unit13.lesson01.teach.los_estudiantes:
    title: Les élèves
    gloss: les élèves
    note: '*Estudiante* a la même forme pour un homme et une femme ; le pluriel *los estudiantes* désigne aussi un groupe mixte.'
    example_gloss: J’ai vingt élèves.
  es.a1.unit13.lesson02.teach.trabajar:
    title: Travailler
    gloss: travailler
    note: L’infinitif du verbe, employé dans des constructions comme *me gusta trabajar* (j’aime travailler).
  es.a1.unit13.lesson02.teach.soy_contador:
    title: Dis que tu es comptable
    gloss: Je suis comptable.
    note: Pour indiquer un métier, on emploie *ser* + le nom du métier, sans article — voir la note de grammaire ci-dessous.
  es.a1.unit13.lesson02.teach.soy_profesora:
    title: Dis que tu es enseignante
    gloss: Je suis enseignante.
    note: '*Profesora* est la forme féminine de *profesor*.'
  es.a1.unit13.lesson02.teach.enseno_en_una_escuela:
    title: Dis où tu enseignes
    gloss: J’enseigne dans une école.
    note: '*Enseño* (j’enseigne) est la forme à la première personne de *enseñar*, avec *escuela* (école).'
  es.a1.unit13.lesson02.teach.contador_vs_profesora_note:
    title: Les noms de métiers avec ser
    gloss: Comment indiquer un métier en espagnol sans article.
    note: Consulte le texte de la fiche.
    target_text: 'Les noms de métiers s’emploient avec *ser* sans article : *soy contador* (je suis comptable), et non *soy un contador*. *Contador* possède la forme féminine correspondante *contadora* ; *profesor/profesora* forme le même type de paire masculin/féminin pour « professeur » (on ajoute *-a* pour une femme).'
  es.a1.unit13.lesson03.teach.en_que_trabajas:
    title: Demande à quelqu’un quel est son métier
    gloss: Quel métier fais-tu ?
    note: '*¿En qué trabajas?* (littéralement « dans quoi travailles-tu ? ») est la manière habituelle de demander à quelqu’un quel est son métier.'
  es.a1.unit13.lesson03.teach.trabajo_en_una_oficina_soy_contador:
    title: Réponds en indiquant ton métier
    gloss: Je travaille dans un bureau. Je suis comptable.
    note: Cette réponse naturelle en deux phrases associe *oficina* à *soy contador*.
  es.a1.unit13.lesson04.teach.me_gusta_mi_trabajo:
    title: Dis que tu aimes ton travail
    gloss: J’aime mon travail.
    note: On réutilise ici la construction avec *gustar* et *mi trabajo* (mon travail).
  es.a1.unit13.lesson04.teach.pero_prefiero_cocinar:
    title: Exprime une préférence
    gloss: Mais je préfère cuisiner.
    note: '*Prefiero* (je préfère) est une forme que tu as déjà vue ; *cocinar* (cuisiner) est l’infinitif de l’activité au cœur de toute cette histoire.'
  es.a1.unit13.lesson04.teach.los_dos_preferimos_esto:
    title: Dis que vous préférez tous les deux ceci
    gloss: Nous préférons tous les deux ceci.
    note: '*Preferimos* est la forme de *preferir* avec *nosotros*, employée quand Elena et Mateo sont du même avis.'
  es.a1.unit13.lesson05.teach.trabajos_reading:
    title: Lecture sur leurs métiers
    gloss: Mateo travaille dans un bureau à Londres. Il est comptable. Elena enseigne dans une école. Elle est enseignante et a vingt élèves. Ils aiment tous les deux leur travail, mais préfèrent cuisiner ensemble le mardi.
    note: Un bref résumé des métiers exercés par Mateo et Elena.
    glosses:
      trabaja: travaille (de trabajar)
      oficina: bureau
      contador: comptable
      enseña: enseigne (de enseñar)
      escuela: école
      profesora: enseignante
      tiene: a (de tener)
      veinte: vingt
      estudiantes: élèves
      gusta: plaît / est apprécié (de gustar)
      trabajo: travail
      prefieren: préfèrent (de preferir)
      cocinar: cuisiner
      juntos: ensemble
      martes: les mardis
  es.a1.unit13.lesson05.teach.a_los_dos_les_gusta_note:
    title: A los dos les gusta
    gloss: Comment employer gustar avec un complément indirect pluriel.
    note: Consulte le texte de la fiche.
    target_text: '*A los dos les gusta* (tous les deux aiment) étend la construction avec *gustar*, que tu connais déjà, à un complément d’objet indirect pluriel : *les* (à eux) au lieu de *me/te* (à moi/à toi).'
  es.a1.unit13.lesson06.teach.line01:
    title: Demande quel est le métier de Mateo
    gloss: Elena demande à Mateo quel métier il exerce.
    note: La question apprise précédemment s’adresse maintenant à Mateo, appelé par son prénom.
  es.a1.unit13.lesson06.teach.line02:
    title: Il répond en indiquant son métier
    gloss: Mateo dit qu’il travaille dans un bureau comme comptable.
    note: 'La réponse complète apprise précédemment : d’abord son lieu de travail, puis son métier.'
  es.a1.unit13.lesson06.teach.line03:
    title: Elle réagit et parle de son propre métier
    gloss: Elena trouve cela intéressant et explique qu’elle est enseignante.
    note: '*Interesante* (intéressant) est un nouveau mot transparent ; le reste reprend *soy profesora* et *enseño en una escuela*, que tu connais déjà.'
  es.a1.unit13.lesson06.teach.line04:
    title: Demande-lui si elle aime enseigner
    gloss: Mateo demande à Elena si elle aime enseigner.
    note: '*¿Te gusta enseñar?* associe la structure interrogative déjà connue avec *gustar* à l’infinitif *enseñar*.'
  es.a1.unit13.lesson06.teach.line05:
    title: Elle confirme et ajoute une préférence
    gloss: Elena dit qu’elle aime beaucoup cela, mais préfère cuisiner avec lui le mardi.
    note: '*Contigo* (avec toi) est une nouvelle forme contractée associant une préposition et un pronom ; *los martes* (le mardi) emploie l’article pluriel pour indiquer une habitude hebdomadaire.'
  es.a1.unit13.lesson06.teach.line06:
    title: Il exprime la même préférence
    gloss: Mateo dit qu’il aime lui aussi son travail, mais préfère cuisiner.
    note: '*A mí también* (moi aussi) est la tournure d’accord emphatique avec *gustar* : *a mí* souligne la personne qui apprécie quelque chose.'
  es.a1.unit13.lesson06.teach.line07:
    title: Tire la conclusion
    gloss: Elena conclut qu’ils préfèrent tous les deux ceci, c’est-à-dire cuisiner ensemble.
    note: '*Entonces* (donc/alors) est un nouveau connecteur logique ; le reste est *los dos preferimos esto* (nous préférons tous les deux ceci).'
  es.a1.unit13.lesson06.teach.line08:
    title: Confirme avec enthousiasme
    gloss: 'Mateo confirme : absolument.'
    note: '*Definitivamente* (absolument) est un nouvel adverbe transparent qui clôt la scène.'
