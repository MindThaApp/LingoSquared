answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Espagnol A1
  description: Apprends à demander et à indiquer l’heure, à parler des moments de la journée et à fixer un rendez-vous, dans la suite de l’histoire de l’atelier de cuisine d’Elena et Mateo commencée dans les unités 01 à 04. Des explications présentent l’emploi singulier ou pluriel de es et son pour donner l’heure, ainsi que les mots cuarto, media et menos.
units:
  es.a1.unit05.time:
    title: Les horaires de l’atelier
lessons:
  es.a1.unit05.lesson01.decir_la_hora_en_punto:
    title: Donner une heure juste
  es.a1.unit05.lesson02.cuarto_y_media:
    title: Le quart d’heure et la demi-heure
  es.a1.unit05.lesson03.partes_del_dia:
    title: Les moments de la journée et le début de l’atelier
  es.a1.unit05.lesson04.proponer_una_hora_para_verse:
    title: Proposer une heure de rendez-vous
  es.a1.unit05.lesson05.leer_el_horario_del_dia:
    title: Lire le programme de la journée
  es.a1.unit05.lesson06.planear_el_almuerzo_dialogue:
    title: Elena et Mateo organisent un déjeuner
teaching:
  es.a1.unit05.lesson01.teach.que_hora_es:
    title: Demander l’heure
    gloss: Quelle heure est-il ?
    note: '*Qué hora* (« quelle heure ») sert à demander l’heure, contrairement à *qué fecha* (« quelle date »), qui sert à demander une date du calendrier.'
  es.a1.unit05.lesson01.teach.es_la_una:
    title: Il est une heure
    gloss: Il est une heure.
    note: Consulte la note de grammaire suivante pour comprendre pourquoi seul une heure s’emploie avec *es* et non *son*.
  es.a1.unit05.lesson01.teach.es_vs_son_note:
    title: Es ou son pour indiquer l’heure
    gloss: Pourquoi une heure se construit différemment des autres heures.
    note: '*Es la una* au singulier, mais *son las dos, son las tres...* au pluriel.'
    target_text: Pour une heure, on emploie le verbe au singulier *es* (Es la una), mais pour toutes les autres heures, on emploie le pluriel *son* (Son las dos, Son las tres...), car *la una* est au singulier (« l’heure »), tandis que *las dos*, *las tres*, etc. sont au pluriel.
  es.a1.unit05.lesson01.teach.son_las_horas:
    title: Deux, quatre, cinq et sept heures
    gloss: Il est deux heures, quatre heures, cinq heures, sept heures.
    note: On emploie *Son las...* au pluriel pour toutes les heures sauf une heure, conformément à la note de grammaire précédente.
    example_gloss:
    - Il est deux heures.
    - Il est quatre heures.
    - Il est cinq heures.
    - Il est sept heures.
  es.a1.unit05.lesson02.teach.y_cuarto:
    title: Et quart
    gloss: Il est quatre heures et quart.
    note: '*Y cuarto* (et quart) ajoute quinze minutes à l’heure indiquée.'
  es.a1.unit05.lesson02.teach.y_media:
    title: Et demie
    gloss: Il est sept heures et demie.
    note: '*Y media* (et demie) ajoute trente minutes à l’heure indiquée.'
  es.a1.unit05.lesson02.teach.menos_cuarto:
    title: Moins le quart
    gloss: Il est cinq heures moins le quart (4 h 45).
    note: Consulte la note de grammaire suivante pour comprendre comment *menos* décompte les minutes avant l’heure suivante.
  es.a1.unit05.lesson02.teach.menos_note:
    title: Menos (avant l’heure)
    gloss: Comment l’espagnol décompte les minutes avant l’heure suivante.
    note: '*Las cinco menos cuarto* = cinq heures moins le quart (4 h 45).'
    target_text: '*Menos* (moins, avant) décompte le temps restant JUSQU’À l’heure suivante : *las cinco menos cuarto* correspond à 4 h 45, c’est-à-dire « cinq heures moins le quart », comme en français.'
  es.a1.unit05.lesson03.teach.partes_del_dia:
    title: Matin, après-midi, soir
    gloss: du matin, de l’après-midi, du soir/de la nuit
    note: '*De la mañana/tarde/noche* précise le moment de la journée, comme « du matin », « de l’après-midi » ou « du soir » en français après une heure.'
    example_gloss:
    - Il est huit heures du matin.
    - L’atelier commence à quatre heures de l’après-midi.
    - Il est dix heures du soir.
  es.a1.unit05.lesson03.teach.taller_empieza_cuatro_tarde:
    title: L’atelier commence à quatre heures
    gloss: L’atelier commence à quatre heures de l’après-midi.
    note: '*Empieza* (commence) est la forme à la troisième personne de *empezar*, un nouveau verbe de cette unité.'
  es.a1.unit05.lesson03.teach.a_que_hora_empieza:
    title: Demander à quelle heure quelque chose commence
    gloss: À quelle heure commence l’atelier ?
    note: '*A qué hora* (à quelle heure) est la façon habituelle de demander quand un événement précis a lieu, contrairement à *qué hora es* (quelle heure est-il maintenant ?).'
  es.a1.unit05.lesson04.teach.nos_vemos_a_que_hora:
    title: Demander à quelle heure se retrouver
    gloss: À quelle heure est-ce qu’on se retrouve ?
    note: '*Nos vemos* (on se voit/on se retrouve) est une construction pronominale employée pour convenir d’un rendez-vous avec quelqu’un.'
  es.a1.unit05.lesson04.teach.nos_vemos_tres_y_media:
    title: Proposer une heure de rendez-vous
    gloss: On se retrouve à trois heures et demie ?
    note: Cette phrase associe *y media* à *nos vemos* pour proposer une heure précise.
  es.a1.unit05.lesson04.teach.antes_del_taller:
    title: Avant l’atelier
    gloss: C’est avant l’atelier.
    note: '*Antes de* (avant) est le contraire de *después* (après).'
  es.a1.unit05.lesson04.teach.de_acuerdo:
    title: D’accord
    gloss: D’accord
    note: '*De acuerdo* est une façon naturelle et concise de confirmer un projet, avec une fonction proche de *Muy bien*.'
    example_gloss: D’accord, on se retrouve à trois heures et demie.
  es.a1.unit05.lesson05.teach.horario_dia_reading:
    title: Lire le programme de la journée
    gloss: L’atelier commence à quatre heures de l’après-midi. Avant cela, Elena et Mateo se retrouvent à trois heures et demie. L’atelier se termine à six heures. Le lendemain, ils se retrouvent à une heure pour déjeuner.
    note: 'Un programme succinct : un rendez-vous, un atelier, puis un déjeuner le lendemain.'
    glosses:
      taller: atelier
      empieza: commence (verbe empezar)
      cuatro: quatre
      tarde: après-midi
      Antes: avant
      ven: se retrouvent (verbe verse)
      tres: trois
      media: demie
      termina: se termine (verbe terminar)
      seis: six
      día: jour
      siguiente: suivant
      almorzar: déjeuner
  es.a1.unit05.lesson05.teach.al_dia_siguiente:
    title: Le lendemain
    gloss: le lendemain/le jour suivant
    note: '*Al día siguiente* (le lendemain) est une expression courante pour faire avancer un récit jusqu’au jour suivant. Elle se distingue de *la próxima clase* (le prochain cours), qui désigne un événement précis plutôt qu’un jour du calendrier.'
  es.a1.unit05.lesson06.teach.line01:
    title: Demander si quelqu’un veut manger après l’atelier
    gloss: Mateo dit que l’atelier se termine à six heures et demande à Elena si elle a faim après.
    note: '*Tienes hambre* (tu as faim) est une nouvelle expression qui emploie le verbe « avoir », comme *tener ... años* et *tener hermanos*.'
  es.a1.unit05.lesson06.teach.line02:
    title: Accepter et proposer le lendemain
    gloss: Elena répond que oui, un peu, et propose plutôt de manger le lendemain.
    note: '*¿Comemos mañana?* propose de manger demain plutôt que juste après l’atelier, ce qui amène l’échange suivant sur l’heure précise.'
  es.a1.unit05.lesson06.teach.line03:
    title: Accepter et demander l’heure
    gloss: Mateo trouve que c’est une bonne idée et demande à quelle heure.
    note: '*Buena idea* (bonne idée) est une façon naturelle et concise d’accepter une suggestion.'
  es.a1.unit05.lesson06.teach.line04:
    title: Proposer une heure
    gloss: Elena propose de se retrouver à une heure.
    note: '*A la una* (à une heure) emploie le singulier *la una*, comme dans *Es la una*.'
  es.a1.unit05.lesson06.teach.line05:
    title: Confirmer et mentionner un restaurant
    gloss: Mateo confirme que l’heure lui convient et mentionne un restaurant à proximité.
    note: '*Hay un restaurante cerca de aquí* : *cerca de* (près de), comme dans *cerca de tus padres*, s’applique ici à un lieu.'
  es.a1.unit05.lesson06.teach.line06:
    title: Conclure chaleureusement
    gloss: Elena réagit avec enthousiasme et dit à demain.
    note: '*¡Genial!* (génial !) conclut l’échange sur une note enthousiaste, avec une fonction proche de *¡Qué bien!*.'
