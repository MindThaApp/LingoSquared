answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Espagnol A1
  description: Espagnol débutant pour proposer, accepter ou refuser une activité, fixer un rendez-vous, et lire et écrire des projets simples.
units:
  es.a1.unit50.plans:
    title: Organiser des projets simples
lessons:
  es.a1.unit50.lesson01.proponer_una_actividad:
    title: Proposer une activité
  es.a1.unit50.lesson02.aceptar_o_rechazar_un:
    title: Accepter ou refuser une proposition
  es.a1.unit50.lesson03.quedar_un_dia_y:
    title: Se mettre d’accord sur un jour et une heure
  es.a1.unit50.lesson04.leer_una_invitacion:
    title: Lire une invitation
  es.a1.unit50.lesson05.escribir_y_confirmar_un:
    title: Écrire et confirmer un projet
  es.a1.unit50.lesson06.elena_y_mateo_hacen:
    title: Elena et Mateo organisent une sortie
teaching:
  es.a1.unit50.lesson01.teach.juntos:
    title: Ensemble
    gloss: ensemble
    note: '*Juntos* précise que plusieurs personnes font l’activité ensemble ; il s’accorde avec ces personnes (*juntas* si ce sont uniquement des femmes).'
    example_gloss: On prend un café ensemble ?
  es.a1.unit50.lesson01.teach.tomar_un_cafe:
    title: Prendre un café
    gloss: prendre un café
    note: En espagnol, on dit *tomar un café*, comme en français « prendre un café ».
  es.a1.unit50.lesson01.teach.ir_al_cine:
    title: Aller voir un film
    gloss: aller voir un film
    note: '*Ir al cine* (« aller au cinéma ») est la tournure habituelle pour dire qu’on va voir un film ; *al* est la contraction de *a* et *el*.'
  es.a1.unit50.lesson01.teach.tomamos_un_cafe:
    title: On prend un café ?
    gloss: On prend un café ?
    note: '*¿Tomamos ...?* emploie le présent à la première personne du pluriel, *nosotros*, pour proposer de faire quelque chose ensemble.'
  es.a1.unit50.lesson01.teach.tomamos_algo_es:
    title: Employer ¿Tomamos ...?
    gloss: ¿Tomamos + quelque chose ? est une tournure courante pour proposer de faire quelque chose ensemble.
    note: 'La forme *nosotros* (*tomamos*) permet de faire une proposition collective : *¿Tomamos un café?*'
  es.a1.unit50.lesson01.teach.tienes_ganas_de:
    title: Ça te dit d’aller voir un film ?
    gloss: Ça te dit d’aller voir un film ?
    note: '*¿Tienes ganas de ...?* sert à demander de manière informelle si quelqu’un a envie de faire quelque chose ; *de* est suivi d’un infinitif.'
  es.a1.unit50.lesson02.teach.si_que_bien:
    title: Oui, super !
    gloss: Oui, super !
    note: '*¡Sí, qué bien!* est une réponse affirmative courte et enthousiaste.'
  es.a1.unit50.lesson02.teach.buena_idea:
    title: Bonne idée
    gloss: Bonne idée !
    note: '*¡Buena idea!* permet d’accepter la proposition en soulignant que c’est une bonne idée.'
  es.a1.unit50.lesson02.teach.es_un_buen:
    title: C’est un bon plan
    gloss: C’est un bon plan.
    note: C’est une réponse positive un peu plus développée.
  es.a1.unit50.lesson02.teach.lo_siento_no:
    title: Refuser en donnant une raison
    gloss: Désolé, je ne peux pas parce que je travaille.
    note: '*Lo siento* adoucit le refus et *porque* introduit une courte explication.'
  es.a1.unit50.lesson02.teach.no_tengo_tiempo:
    title: Je n’ai pas le temps
    gloss: Je n’ai pas le temps.
    note: '*No tengo tiempo* est une raison directe mais courante de refuser ; *no* se place avant le verbe.'
  es.a1.unit50.lesson02.teach.lo_siento_no_2:
    title: Refuser aimablement
    gloss: Lo siento + no puedo + une courte explication permet de refuser aimablement.
    note: Dans une conversation, il n’est pas obligatoire de donner une raison, mais cela rend cette formule pratique et polie.
  es.a1.unit50.lesson03.teach.quedar:
    title: Fixer un rendez-vous
    gloss: convenir de se retrouver
    note: '*Quedar* signifie convenir de se retrouver : *¿Quedamos el viernes?* Beaucoup de Latino-Américains disent plutôt *¿Nos vemos el viernes?*.'
    example_gloss: On se retrouve vendredi à 2 h 30 ?
  es.a1.unit50.lesson03.teach.quedamos_el_viernes:
    title: Se retrouver vendredi à deux heures et demie
    gloss: On se retrouve vendredi à 2 h 30 ?
    note: Cette phrase associe le jour de la semaine *el viernes* à *a las*, suivi de l’heure.
  es.a1.unit50.lesson03.teach.las_dos_y:
    title: Y media signifie et demie
    gloss: las dos y media = 2 h 30 ; a las dos y media indique l’heure du rendez-vous.
    note: 'Comme en français, l’espagnol compte à partir de l’heure qui vient de sonner : *las dos y media* signifie 2 h 30, littéralement « deux heures et demie ».'
  es.a1.unit50.lesson03.teach.el_viernes_17:
    title: Une date et une heure
    gloss: le vendredi 17 avril à 3 h 15
    note: 'Comme en français, les jours de la semaine et les mois s’écrivent avec une minuscule en espagnol ; les dates emploient *de* : *el viernes 17 de abril*.'
  es.a1.unit50.lesson03.teach.si_el_viernes:
    title: Confirmer l’heure
    gloss: Oui, vendredi à 2 h 30, ça me va.
    note: '*Me viene bien* (« ça me convient ») permet de confirmer que l’heure proposée convient.'
  es.a1.unit50.lesson04.teach.el_mensaje_la:
    title: Message, invitation, café des langues
    gloss: le message, l’invitation, le café des langues
    note: '*Un mensaje* est un court message écrit ou numérique, *una invitación* propose à quelqu’un de participer à une activité et *el café de idiomas* est le lieu où le groupe se retrouve.'
    example_gloss:
    - J’ai un message d’Elena.
    - C’est une invitation au café des langues.
    - Nous prenons un café au café des langues.
  es.a1.unit50.lesson04.teach.hola_mateo_tienes:
    title: L’invitation d’Elena
    gloss: Salut Mateo, ça te dit de prendre un café au café des langues le samedi 18 avril à 2 h 30 ? Amitiés, Elena.
    note: 'Repère quatre informations : l’activité, la date, l’heure et le lieu.'
    glosses:
      Hola: salut
      ganas: envie (tener ganas de = avoir envie de)
      sábado: samedi
      abril: avril
      media: et demie (y media = et demie)
      dos: deux
      café: café
      tomar: boire / prendre
      idiomas: café des langues
      saludo: amitiés
  es.a1.unit50.lesson05.teach.hola_mateo_vamos:
    title: Un message pour faire une proposition
    gloss: Salut Mateo, on prend un café vendredi à 2 h 30 ? Amitiés, Elena.
    note: Le message comprend une salutation, une activité, un jour, une heure et une formule de fin.
    glosses:
      Hola: salut
      vamos: on… ?
      viernes: vendredi
      media: et demie (y media = et demie)
      dos: deux
      café: café
      tomar: boire / prendre
      saludo: amitiés
  es.a1.unit50.lesson05.teach.hola_elena_si:
    title: Un message de confirmation
    gloss: Salut Elena, oui, super ! Vendredi à 2 h 30, ça me va. À vendredi ! Mateo.
    note: La réponse accepte l’activité et répète l’horaire pour le confirmer.
    glosses:
      Hola: salut
      bien: super / très bien
      viernes: vendredi
      media: et demie (y media = et demie)
      dos: deux
      viene: bien / convient
      Hasta: jusqu’à / à bientôt
  es.a1.unit50.lesson05.teach.un_mensaje_corto:
    title: Le contenu d’un message
    gloss: Un court message indique l’activité, le jour ou la date et l’heure.
    note: Une salutation et une formule de fin sont utiles, mais les informations essentielles sont l’activité et le moment où elle a lieu.
  es.a1.unit50.lesson06.teach.elena_tomamos_un:
    title: Elena propose de prendre un café
    gloss: 'Elena : On prend un café vendredi ? Mateo : Oui, super ! À quelle heure ?'
    note: Mateo accepte l’activité avant de demander l’heure.
  es.a1.unit50.lesson06.teach.elena_a_las:
    title: La première heure proposée par Elena
    gloss: 'Elena : À 2 h 30.'
    note: '*Las dos y media* signifie 2 h 30, comme dans la leçon sur l’heure.'
  es.a1.unit50.lesson06.teach.mateo_lo_siento:
    title: Mateo propose une autre heure
    gloss: 'Mateo : Désolé, je ne peux pas à 2 h 30. Est-ce que 3 h 15 vous irait ?'
    note: '*¿Puede ser a ...?* est une manière concise de demander si une autre heure convient.'
  es.a1.unit50.lesson06.teach.elena_si_a:
    title: Ils confirment le rendez-vous
    gloss: 'Elena : Oui, 3 h 15, ça me va. Mateo : Bon plan. Alors, on se retrouve vendredi à 3 h 15.'
    note: Ici, *quedamos* est de nouveau à la forme *nosotros* et sert cette fois à confirmer le rendez-vous.
