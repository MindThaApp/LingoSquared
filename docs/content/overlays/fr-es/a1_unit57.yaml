  es.a1.unit57.lesson05.teach.diego_no_solo:
    title: Qui étudie quoi ?
    gloss: Diego ne fait pas que travailler, il étudie aussi. Il suit un cours d’espagnol au centre de formation pour adultes. Il apprend de nouveaux mots chaque semaine. Lucía suit une formation dans une école supérieure. Elle y étudie les sciences de la santé. Tous les deux aiment étudier. Qu’est-ce que tu étudies, ou qu’aimerais-tu apprendre ?
    note: Compare les études de Diego et de Lucía en reprenant la structure du texte comparatif de l’unité sur la technologie.
    glosses:
      trabaja: travaille
      solo: seulement
      estudia: étudie
      sigue: suit
      curso: cours
      español: espagnol
      escuela: école (escuela de idiomas = école de langues)
      aprende: apprend
      cada: chaque
      semana: semaine
      nuevas: nouveau
      palabras: mots
      hace: fait
      formación: formation diplômante
      superior: école supérieure (escuela superior)
      salud: santé (ciencias de la salud = sciences de la santé)
      dos: tous les deux
      gusta: aiment
      estudiar: étudier
      aprender: apprendre
  es.a1.unit57.lesson05.teach.lucia_estudia_ciencias:
    title: Lucía étudie les sciences de la santé
    gloss: Lucía étudie les sciences de la santé dans une école supérieure.
  es.a1.unit57.lesson05.teach.a_los_dos:
    title: Tous les deux aiment étudier
    gloss: Tous les deux aiment étudier.
  es.a1.unit57.lesson06.teach.lucia_yo_tambien:
    title: Lucía parle de ses propres études
    gloss: 'Lucía : Moi aussi, j’étudie, tu sais. Je suis une formation dans une école supérieure.'
  es.a1.unit57.lesson06.teach.diego_que_estudias:
    title: Diego pose une question
    gloss: 'Diego : Qu’est-ce que tu étudies ?'
  es.a1.unit57.lesson06.teach.lucia_alli_estudio:
    title: Lucía répond
    gloss: 'Lucía : J’y étudie les sciences de la santé.'
