teaching:
  es.a1.unit11.lesson01.teach.la_camisa:
    title: シャツ
    gloss: シャツ
    note: '*Camisa* は女性名詞です。'
    example_gloss: このシャツが好きです。
  es.a1.unit11.lesson01.teach.el_pantalon:
    title: ズボン
    gloss: ズボン
    note: '*Pantalón* はスペイン語では単数形の名詞で、1本のズボンを指します。'
    example_gloss: そのズボンは20です。
  es.a1.unit11.lesson01.teach.la_chaqueta:
    title: ジャケット
    gloss: ジャケット
    note: '*Chaqueta* は女性名詞です。'
    example_gloss: 冬のためにジャケットが必要です。
  es.a1.unit11.lesson01.teach.los_zapatos:
    title: 靴
    gloss: 靴
    note: '*Zapatos* は複数形です。日本語の「靴」は単数でも複数でも同じ形ですが、スペイン語では「靴(一足)」でも複数形の zapatos を使うのが普通です。'
    example_gloss: この靴は履き心地がいいです。
  es.a1.unit11.lesson01.teach.el_delantal:
    title: エプロン
    gloss: エプロン
    note: '*Delantal* は男性名詞です。エレナとマテオがワークショップのために必要としている、特定の品物です。'
    example_gloss: ワークショップのためにエプロンが必要です。
  es.a1.unit11.lesson02.teach.que_talla_usas:
    title: サイズをたずねる
    gloss: サイズはいくつですか？
    note: '*¿Qué talla usas?* は、服のサイズをたずねるときの標準的な言い方です。'
  es.a1.unit11.lesson02.teach.uso_la_talla_mediana:
    title: サイズを伝える
    gloss: 私はMサイズです。
    note: '*Uso*(私は使う・着る)+ *la talla*(サイズ)+ サイズを表す語、という形です。'
  es.a1.unit11.lesson02.teach.me_queda_bien:
    title: ぴったりだと言う
    gloss: 私にぴったりです。
    note: '*Me queda bien* は *quedar*(合う・似合う)を使います。次の文法ノートを見てください。'
  es.a1.unit11.lesson02.teach.me_queda_mal:
    title: 合わないと言う
    gloss: 私には合いません。
    note: '*me queda bien* の反対で、*bien* を *mal* に替えた言い方です。'
  es.a1.unit11.lesson02.teach.queda_note:
    title: Quedar bien/mal
    gloss: quedar が品質ではなくサイズや着心地の合い具合を表すこと。
    note: カード本文を見てください。
    target_text: '*Me queda bien*(私にぴったりです)は、*ser* や *estar* とは別の動詞 *quedar*(合う、似合う)を使います。直訳すると「私の身につけた状態でよく収まる」という感じです。ここでの *bien* と *mal* は、品質ではなくサイズや似合い具合を表します。'
  es.a1.unit11.lesson03.teach.cuanto_cuesta_este_delantal:
    title: エプロンの値段をたずねる
    gloss: このエプロンはいくらですか？
    note: '*¿Cuánto cuesta?* の型を使い、*este*(この)で特定の品物を示しています。'
  es.a1.unit11.lesson03.teach.cuesta_doce:
    title: 値段を伝える
    gloss: 12です。
    note: '*Cuesta* + 数字で値段を言います。'
  es.a1.unit11.lesson03.teach.este_vs_esta_note:
    title: Este と esta
    gloss: 指示詞が名詞の性に合わせて変わること。
    note: カード本文を見てください。
    target_text: '*Este*(この、男性形)は *el delantal* に合わせて使い、*esta*(この、女性形)は *esta camisa* のように女性名詞に使います。指示詞は名詞の性によって形が変わり、これは他の形容詞と同じ仕組みです。'
  es.a1.unit11.lesson04.teach.me_gusta_este:
    title: これが気に入ったと言う
    gloss: これが好きです。
    note: ここでの *Este* は単独で代名詞(「これ」)として使われ、直前に話題に出た品物を指します。
  es.a1.unit11.lesson04.teach.voy_a_comprarlo:
    title: 買うと言う
    gloss: 私はそれを買うつもりです。
    note: '*Voy a* + 不定詞で近い未来を表します。*comprarlo* は目的語代名詞 *lo*(それ)が不定詞 *comprar* の後ろについた形です。'
  es.a1.unit11.lesson04.teach.compramos_dos:
    title: 2つ買うと言う
    gloss: 私たちは2つ買います。
    note: '*Compramos*(私たちは買う)は *nosotros* の形で、エレナとマテオが一緒に決めるときに使います。'
  es.a1.unit11.lesson05.teach.precios_reading:
    title: 値段表を読む
    gloss: この店では、シャツは15、ズボンは20、ジャケットは30、靴は25です。エプロンがいちばん安く、たったの12です。
    note: お店の値段表です。1つの品物には *cuesta*(値段が〜だ)、*los zapatos* のような複数の品物には *cuestan* を使います。
    glosses:
      tienda: 店
      camisa: シャツ
      cuesta: 値段が〜である(costar の活用形)
      quince: '15'
      pantalón: ズボン
      veinte: '20'
      chaqueta: ジャケット
      treinta: '30'
      zapatos: 靴
      cuestan: 値段が〜である(costar の活用形)
      veinticinco: '25'
      delantal: エプロン
      barato: 安い
      solo: ～だけ
      doce: '12'
  es.a1.unit11.lesson05.teach.el_mas_barato_note:
    title: El más barato(いちばん安い)
    gloss: el/la + más + 形容詞で最上級を作ること。
    note: カード本文を見てください。
    target_text: '*El más barato*(いちばん安いもの)は最上級で、*el/la* + *más* + 形容詞の形です。比べる範囲は *de/en* で示します。この単元では比較表現の全体はまだ扱わず、買い物でよく使うこの言い方だけを学びます。'
  es.a1.unit11.lesson06.teach.line01:
    title: 必要なものを伝える
    gloss: エレナは、ワークショップ用にエプロンが必要だと言います。
    note: '*Delantales* は *el delantal* の複数形です。'
  es.a1.unit11.lesson06.teach.line02:
    title: 同意して店を提案する
    gloss: マテオは同意して、その店に行こうと提案します。
    note: '*Tienes razón* は「あなたの言うとおり」、*esa tienda* は「その店」という意味です。'
  es.a1.unit11.lesson06.teach.line03:
    title: 店員があいさつする
    gloss: 店員があいさつして、手伝いを申し出ます。
    note: '*¿Los ayudo?*(お手伝いしましょうか？)は店員の決まったあいさつで、エレナとマテオの2人に呼びかけています。'
  es.a1.unit11.lesson06.teach.line04:
    title: 探しているものを伝える
    gloss: エレナは、はい、エプロンを探していますと答えます。
    note: '*Buscamos*(私たちは探している)は *buscar* の *nosotros* の形です。'
  es.a1.unit11.lesson06.teach.line05:
    title: 店員が商品を見せてサイズをたずねる
    gloss: 店員がいくつかエプロンを見せて、サイズをたずねます。
    note: '*¿Qué talla usan?* は複数形の *usan*(あなたたちは着る)で、2人に話しかけています。単数の *usas* とは違います。'
  es.a1.unit11.lesson06.teach.line06:
    title: サイズを伝える
    gloss: マテオは、Mサイズですと言います。
    note: '*Uso la talla mediana* は、*¿Qué talla usan?* に対する自分の答えです。'
  es.a1.unit11.lesson06.teach.line06b:
    title: エレナも同意する
    gloss: エレナは、自分も同じサイズだと言います。
    note: '*Yo también* は「私もです」という意味です。'
  es.a1.unit11.lesson06.teach.line07:
    title: 値段をたずねる
    gloss: マテオは、エプロンがいくらかたずねます。
    note: '*Este*(この)は、目の前にあるエプロンを指しています。'
  es.a1.unit11.lesson06.teach.line07b:
    title: 値段を伝える
    gloss: 店員は、12だと答えます。
    note: '*Cuesta* + 数字で値段を言います。'
  es.a1.unit11.lesson06.teach.line08:
    title: サイズを確かめて買うことにする
    gloss: エレナは、ちょうどよくて気に入ったので買うと言います。
    note: '*me queda bien*、*me gusta este*、*voy a comprarlo* を順に組み合わせています。'
  es.a1.unit11.lesson06.teach.line09:
    title: 同意して2つ買う
    gloss: マテオも自分にちょうどいいと言い、2人で2つ買います。
    note: '*A mí también*(私も、強調)は、*también* で同意する型に強調の代名詞を加えた形です。*compramos dos* で場面が締めくくられます。'
