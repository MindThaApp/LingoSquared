teaching:
  es.a1.unit46.lesson01.teach.no_me_siento:
    title: 気分が悪いとき
    gloss: 気分がよくありません。
    note: '*Sentirse* は再帰動詞です(*me siento*、*te sientes*)。*no me siento bien* は、なんとなく調子が悪いときに使う一般的で軽めの言い方です。'
  es.a1.unit46.lesson01.teach.enfermo:
    title: 病気の
    gloss: 病気の
    note: 基本的な形容詞で、状態を表す *estar* と一緒に使います:*estoy enfermo*。
    example_gloss: 私は病気です。
  es.a1.unit46.lesson01.teach.estoy_enfermo:
    title: 病気であること
    gloss: 私は病気です。
    note: '*Enfermo* は *no me siento bien* よりも広く、強い状態を表します。話す人の性別によって形が変わります(*enferma*)。'
  es.a1.unit46.lesson01.teach.dolor_de_cabeza:
    title: 頭痛
    gloss: 頭痛
    note: '*dolor de cabeza* は *tener* と一緒に、冠詞をつけずに使います:*tengo dolor de cabeza*。'
    example_gloss: 頭が痛いです。
  es.a1.unit46.lesson01.teach.tengo_dolor_de:
    title: 頭が痛いとき
    gloss: 頭が痛いです。
    note: 症状を言うときは *tener*(持つ)を使います:*tengo dolor de cabeza*。日本語の「頭が痛い」にあたります。
  es.a1.unit46.lesson01.teach.dolor_de_estomago:
    title: 腹痛
    gloss: 腹痛
    note: '*dolor de cabeza* と同じく冠詞をつけません:*dolor de estómago*。'
    example_gloss: お腹が痛いです。
  es.a1.unit46.lesson01.teach.tengo_dolor_de_2:
    title: お腹が痛いとき
    gloss: お腹が痛いです。
    note: '*dolor de cabeza* と同じ *tener* の型です。'
  es.a1.unit46.lesson02.teach.que_pasa:
    title: 広く尋ねる
    gloss: どうしたの?
    note: 何かあったのかを尋ねるときに使える、万能な言い方です。
  es.a1.unit46.lesson02.teach.que_te_pasa:
    title: よく使われる慣用表現
    gloss: どうしたの?
    note: '*¿Qué te pasa?* は、どうしたのかを尋ねる自然な言い方です(直訳は「あなたに何が起こるの?」)。一語ずつ訳さないようにしましょう。'
  es.a1.unit46.lesson02.teach.dolor_de_garganta:
    title: のどの痛み
    gloss: のどの痛み
    note: '*dolor de cabeza* や *dolor de estómago* と同じ型です:*dolor de garganta*。'
    example_gloss: のどが痛いです。
  es.a1.unit46.lesson02.teach.tengo_dolor_de:
    title: のどが痛いとき
    gloss: のどが痛いです。
    note: ほかの症状と同じ *tener* の型です。
  es.a1.unit46.lesson02.teach.estas_bien_no:
    title: 相手の様子を尋ねる
    gloss: 大丈夫ですか?いいえ、気分がよくありません。
    note: '*¿Estás bien?* は、友達同士でよく使う気軽な声かけです。*usted* で話す相手には *¿Está bien?* になります。'
  es.a1.unit46.lesson03.teach.fiebre:
    title: 熱
    gloss: 熱
    note: ほかの症状と同じく、*tener* の後に冠詞をつけずに使います:*tengo fiebre*。
    example_gloss: 熱があります。
  es.a1.unit46.lesson03.teach.tengo_fiebre:
    title: 熱があるとき
    gloss: 熱があります。
    note: '*tener* の型です。'
  es.a1.unit46.lesson03.teach.resfriado:
    title: 風邪をひいている
    gloss: 風邪をひいている
    note: '*Resfriado* は *estar* と使う形容詞です。名詞の *resfriado* を使って *tengo un resfriado* と言うこともできます。'
    example_gloss: 風邪をひいています。
  es.a1.unit46.lesson03.teach.estoy_resfriado:
    title: 風邪をひいたと伝える
    gloss: 風邪をひいています。
    note: 日本語では「風邪をひいている」と言う場面で、スペイン語では形容詞を使って *estoy resfriado* と言えます。この形容詞は話す人の性別によって形が変わります(*resfriada*)。
  es.a1.unit46.lesson03.teach.enfermo_y_resfriado:
    title: estar と tener は単語の種類で使い分けます
    gloss: 形容詞の「病気の」「風邪をひいている」は estar を使い、名詞の「熱」「頭痛」は tener を使います。病気です、風邪をひいています/熱があります、頭が痛いです。
    note: '*estar* と *tener* の選び方は単語の種類で決まります。形容詞(*enfermo*、*resfriado*)には *estar*、症状を表す名詞(*fiebre*、*dolor de cabeza*)には *tener* を使います。'
  es.a1.unit46.lesson04.teach.la_farmacia:
    title: 薬局
    gloss: 薬局
    note: 女性名詞です:*la farmacia*。
    example_gloss: 薬局に行きます。
  es.a1.unit46.lesson04.teach.en_que_puedo:
    title: 薬剤師のあいさつ
    gloss: どうされましたか?
    note: '*¿En qué puedo ayudarle?* は、接客で使われる決まった丁寧な質問です。*ayudarle* には、丁寧な *usted* にあたる目的語の代名詞 *le* が使われています。'
  es.a1.unit46.lesson04.teach.tiene_algo_para:
    title: 症状に合うものを頼む
    gloss: 頭痛に効くものはありますか?
    note: 薬を頼むときは、*algo para* + 症状が自然な言い方です:*algo para el dolor de cabeza*。
  es.a1.unit46.lesson04.teach.una_pastilla:
    title: 錠剤
    gloss: 錠剤
    note: 女性名詞です:*la pastilla*。*una pastilla* は錠剤のことです。
    example_gloss: 錠剤を1錠飲みます。
  es.a1.unit46.lesson04.teach.toma_una_pastilla:
    title: 服用の指示
    gloss: 錠剤を1日2回、1錠飲んでください。
    note: '*Toma* は *tomar*(飲む、取る)の親しい相手向けの命令形で、指示を出すときに使います。'
  es.a1.unit46.lesson04.teach.en_la_farmacia:
    title: 薬局での話し方
    gloss: 薬局では、丁寧な形の usted を使います。
    note: 薬剤師は接客をしている初対面の大人なので、*usted* を使います。*¿Tienes algo...?* ではなく *¿Tiene algo...?* と言います。
  es.a1.unit46.lesson05.teach.consejo_toma_una:
    title: 薬局のアドバイスのメモを読む
    gloss: アドバイス:錠剤を1日2回、水と一緒に飲んでください。よく休んで、水をたくさん飲んでください。3日たってもまだ気分がよくありませんか?それなら医者に行ってください。
    note: 服用の回数、薬以外の2つのすすめ、そして医者に行くタイミングに注目しましょう。
    glosses:
      Consejo: アドバイス
      toma: 飲む
      veces: 回
      día: 日
      pastilla: 錠剤
      Descansa: 休む
      bebe: 飲む
      sentirte: 感じる
      sigues: まだ
      bien: 上手に
      médico: 医者・かかりつけ医
  es.a1.unit46.lesson06.teach.elena_hola_mateo:
    title: エレナが様子をたずねる
    gloss: エレナ:こんにちは、マテオ。調子はどう?もう具合はよくなった?
    note: '*Ya*(もう、すでに)は、前に話したときからマテオの具合がよくなったかをエレナが確かめていることを表します。*te sientes* は *sentirse* の親しい相手に使う *tú* の形です。'
  es.a1.unit46.lesson06.teach.mateo_todavia_no:
    title: マテオはまだ具合が悪い
    gloss: マテオ:まだあまりよくないよ。頭痛がまだ続いていて、疲れているんだ。
    note: '*Sigo con*(まだ~がある)は、頭痛が治っていないことを表します。*cansado*(疲れた)は新しい便利な形容詞で、性によって形が変わります(*cansada*)。'
  es.a1.unit46.lesson06.teach.elena_has_tomado:
    title: エレナが薬について聞く
    gloss: エレナ:薬は飲んだ?
    note: '*Has tomado* は現在完了です。*has* + 過去分詞 *tomado* の形で、*me has ayudado* と同じパターンです。'
  es.a1.unit46.lesson06.teach.mateo_si_he:
    title: マテオが答える
    gloss: マテオ:うん、薬を飲んだよ。今から休むつもりだよ。
    note: '*Voy a descansar*(これから休む)は、近い未来を表す *ir a* + 不定詞の形です。'
  es.a1.unit46.lesson06.teach.elena_buena_idea:
    title: エレナが気づかう
    gloss: エレナ:それがいいね。しっかり休んでね。お大事に!
    note: '*¡Que te mejores!* は、早い回復を願うときの決まった表現です。接続法の *mejores* を使います。'
  es.a1.unit46.lesson06.teach.mateo_gracias_hasta:
    title: マテオが別れのあいさつをする
    gloss: マテオ:ありがとう、また明日!
    note: '*Hasta mañana* は、*hasta luego* のように *hasta* + 時を表す語で作る別れのあいさつの型です。'
