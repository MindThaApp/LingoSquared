teaching:
  es.a1.unit14.lesson01.teach.el_apartamento:
    title: アパート
    gloss: アパート
    note: '*Apartamento* は男性名詞です。'
    example_gloss: 私は小さなアパートに住んでいます。
  es.a1.unit14.lesson01.teach.la_cocina:
    title: 台所
    gloss: 台所
    note: 「料理」という、この単語のもう一つの意味については、下の文法ノートを見てください。
    example_gloss: 私の台所はとても狭いです。
  es.a1.unit14.lesson01.teach.el_dormitorio:
    title: 寝室
    gloss: 寝室
    note: '*Dormitorio* は男性名詞で、*dormir*(眠る)から来ています。'
    example_gloss: 寝室には大きなベッドがあります。
  es.a1.unit14.lesson01.teach.el_bano:
    title: 浴室
    gloss: 浴室
    note: '*Baño* は男性名詞です。'
    example_gloss: そのアパートには浴室が1つあります。
  es.a1.unit14.lesson01.teach.la_sala:
    title: 居間
    gloss: 居間
    note: '*Sala* は女性名詞です。'
    example_gloss: 私たちは居間でテレビを見ます。
  es.a1.unit14.lesson01.teach.cocina_ambiguity_note:
    title: cocina：部屋と料理
    gloss: 部屋の「台所」と「料理」「料理する」の違いを学びます。
    note: カード本文を見てください。
    target_text: ここでの *La cocina* は、部屋の「キッチン」を意味します。このストーリー全体で使ってきた、料理教室そのものを指す *cocina*/*cocinar*(料理/料理する)とは別の意味です。文脈で区別できます。*taller de cocina* では「料理」の意味です。家やアパートの *la cocina* は部屋のことです。*cocinar* は動詞の「料理する」です。
  es.a1.unit14.lesson02.teach.alquilar:
    title: 借りる
    gloss: 賃貸で借りる、貸す
    note: 不定詞の動詞で、*quiero alquilar*(借りたい)の形で使います。
  es.a1.unit14.lesson02.teach.el_edificio:
    title: 建物
    gloss: 建物
    note: '*Edificio* は男性名詞です。'
    example_gloss: その建物は公園の近くにあります。
  es.a1.unit14.lesson02.teach.desocupado:
    title: 空いている
    gloss: 空いている
    note: '*Desocupado* は、今空いていて入居できる賃貸物件に使います。'
  es.a1.unit14.lesson02.teach.grande:
    title: 大きい
    gloss: 大きい
    note: '*Grande* は、-o/-a で終わる形容詞と違い、性によって形が変わりません。'
  es.a1.unit14.lesson02.teach.pequeno:
    title: 小さい
    gloss: 小さい
    note: '*Pequeño/pequeña* は *grande* の反対の意味です。'
  es.a1.unit14.lesson03.teach.cuantos_dormitorios_tiene:
    title: 寝室の数をたずねる
    gloss: 寝室はいくつありますか。
    note: '*¿Cuántos...tiene?*(いくつ…ありますか)は、場所の特徴をたずねるときの基本の言い方です。'
  es.a1.unit14.lesson03.teach.tiene_dos_dormitorios_y_una_cocina_grande:
    title: 寝室と台所を説明する
    gloss: 寝室が2つと、大きな台所があります。
    note: '*Tiene*(〜がある)+数+名詞の形です。ここでは *dormitorio*、*cocina*、*grande* を使っています。'
  es.a1.unit14.lesson04.teach.quiero_alquilar_un_apartamento_con_una_cocina_grande:
    title: 住まいの希望を伝える
    gloss: 大きなキッチンのあるアパートを借りたいです。
    note: '*Quiero*(〜したい)+不定詞 *alquilar* の形で、*con*(〜のある)で希望する特徴を加えています。'
  es.a1.unit14.lesson04.teach.asi_puedes_cocinar_en_casa:
    title: 利点を説明する
    gloss: そうすれば、家でも料理ができます。
    note: '*Así*(そうすれば)+ *puedes*(できる)+不定詞の形で、住まいの希望を、物語全体の料理というテーマにつなげています。'
  es.a1.unit14.lesson05.teach.anuncio_reading:
    title: アパートの広告を読む
    gloss: 公園の近くの建物にある、空きのアパートです。寝室が2つ、浴室、居間、大きな台所があります。家で料理をしたい方にぴったりです。
    note: 実際の新聞の案内広告のような文章です。
    glosses:
      desocupado: 空いている
      edificio: 建物
      cerca: 近くの
      parque: 公園
      Tiene: ある(tener の活用形)
      dormitorios: 寝室(複数)
      baño: 浴室
      sala: リビング
      grande: 大きい
      perfecto: 完璧な
      quiere: 〜したい(querer の活用形)
      cocinar: 料理する
  es.a1.unit14.lesson05.teach.para_alguien_que_note:
    title: Para alguien que...
    gloss: 関係節で理想の入居者を説明する方法を学びます。
    note: カード本文を見てください。
    target_text: '*Para alguien que quiere*(〜したい人のために)は、*alguien*(誰か)+ *que*(〜する)で関係節を作ります。理想の入居者を説明する賃貸広告でよく使われる型です。'
  es.a1.unit14.lesson06.teach.line01:
    title: 問題と希望を伝える
    gloss: マテオは、自分の台所がとても狭いので、大きな台所のあるアパートを借りたいと言います。
    note: '*mi cocina es muy pequeña*(私の台所はとても狭い)と、希望を表す *quiero alquilar un apartamento con una cocina grande* を組み合わせています。'
  es.a1.unit14.lesson06.teach.line02:
    title: 広告を見ようと提案する
    gloss: エレナは、新聞を見ようと提案します。広告がたくさんあります。
    note: '*El periódico*(新聞)と *anuncios*(広告)は、案内広告に出てくる新しい単語です。'
  es.a1.unit14.lesson06.teach.line03:
    title: 広告を見つける
    gloss: マテオは、空きのアパートがある建物を見つけます。
    note: '*Este edificio*(この建物)と *desocupado*(空いている)です。'
  es.a1.unit14.lesson06.teach.line04:
    title: 寝室についてたずねる
    gloss: エレナは、寝室がいくつあるかたずねます。
    note: 場所の特徴をたずねるときの基本の質問です。
  es.a1.unit14.lesson06.teach.line05:
    title: 詳細を答える
    gloss: マテオは、寝室が2つと大きな台所があると答えます。
    note: '*Tiene*(〜がある)+数+名詞の形です。'
  es.a1.unit14.lesson06.teach.line06:
    title: ほかの特徴を確かめる
    gloss: エレナは喜んで、浴室と居間もあることを確かめます。
    note: '*Baño*(浴室)と *sala*(居間)で部屋の一覧がそろいます。*también*(〜も)は文末に置きます。'
  es.a1.unit14.lesson06.teach.line07:
    title: 電話することにする
    gloss: マテオは、今日中に不動産会社に電話することにします。
    note: '*Voy a llamar*(電話するつもりだ)+ *hoy mismo*(まさに今日)です。*la agencia* は賃貸の不動産会社のことです。'
  es.a1.unit14.lesson06.teach.line08:
    title: 賛成して話を締めくくる
    gloss: エレナは賛成して、家でも料理ができると言います。
    note: '*Así puedes cocinar en casa también*(そうすれば家でも料理ができる)で、この場面が終わります。'
