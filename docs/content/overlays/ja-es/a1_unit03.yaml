  es.a1.unit03.lesson01.immediate_family:
    title: 身近な家族
  es.a1.unit03.lesson02.possessives_and_asking:
    title: 所有形容詞:mi, tu, su
  es.a1.unit03.lesson03.extended_family:
    title: 親戚
  es.a1.unit03.lesson04.describing_family_size:
    title: 家にいる人数
  es.a1.unit03.lesson05.reading_a_family_profile:
    title: 家族のプロフィールを読む
  es.a1.unit03.lesson06.family_photos_dialogue:
    title: エレナとマテオと見る家族写真
teaching:
  es.a1.unit03.lesson01.teach.madre:
    title: 母
    gloss: 母
    note: '*Madre* は女性名詞です。家族の間では日常的に *mamá* のほうがよく使われますが、*madre* は中立的な語で、このコースの語彙リストではこちらを使います。'
  es.a1.unit03.lesson01.teach.padre:
    title: 父
    gloss: 父
    note: '*Padre* は男性名詞です。日常的には *papá* を使い、*madre* と *mamá* の関係と同じです。'
  es.a1.unit03.lesson01.teach.hermano:
    title: 兄・弟
    gloss: 兄／弟
    note: '*Hermano* は男性名詞の単数形です。'
  es.a1.unit03.lesson01.teach.hermana:
    title: 姉・妹
    gloss: 姉／妹
    note: '*Hermana* は女性名詞の単数形です。'
  es.a1.unit03.lesson01.teach.hijo:
    title: 息子
    gloss: 息子
    note: '*Hijo* は男性名詞の単数形です。'
  es.a1.unit03.lesson01.teach.hija:
    title: 娘
    gloss: 娘
    note: '*Hija* は女性名詞の単数形です。'
  es.a1.unit03.lesson01.teach.padres:
    title: 両親
    gloss: 両親
    note: '*Padres*(男性複数形)は、母と父をあわせた男女の組も表します。集団に男性が一人でもいれば男性形を使うという、スペイン語の一般的なパターンです。'
  es.a1.unit03.lesson01.teach.hermanos:
    title: きょうだい
    gloss: きょうだい、兄弟
    note: '*Hermanos* は「兄弟」(全員男性)にも「きょうだい」(男女混合)にもなります。*padres* と同じく、男性複数形が男女混合の集団を表すルールです。'
  es.a1.unit03.lesson02.teach.mi_familia:
    title: 私の家族
    gloss: 私の家族
    note: '*Mi*(アクセント記号なし)は「私の」を表す所有形容詞です。名詞の性では変わらず、数だけで変わります(複数名詞には *mis*)。'
  es.a1.unit03.lesson02.teach.tu_familia:
    title: あなたの家族(親しい相手に)
    gloss: あなたの家族
    note: '*Tu*(アクセント記号なし。代名詞の *tú* とは別)は、親しい相手に使う所有形容詞で、ユニット1で学んだ *tú* の話し方に対応します。'
  es.a1.unit03.lesson02.teach.su_familia:
    title: あなたの/彼の/彼女の家族(丁寧な言い方または三人称)
    gloss: 彼の/彼女の/あなたの家族
    note: '*Su* は「彼の」「彼女の」、そして丁寧な言い方の「あなたの」(*usted*)のすべてを表します。所有形容詞だけでは区別せず、文脈から意味がわかります。'
  es.a1.unit03.lesson02.teach.tienes_hermanos:
    title: きょうだいについて尋ねる
    gloss: きょうだいはいますか?
    note: '*Tienes* は *tener* の *tú* に対する形で、ユニット2で年齢を言うときに使った動詞と同じです。'
  es.a1.unit03.lesson02.teach.tengo_dos_hermanas:
    title: きょうだいの数を言う
    gloss: 私には姉妹が2人います。
    note: '*Tengo*(私は持っている)に数と家族を表す名詞を続けるのが、きょうだいを説明する基本の言い方です。'
  es.a1.unit03.lesson02.teach.tu_familia_es_grande:
    title: 家族が大きいかどうか尋ねる
    gloss: あなたの家族は大家族ですか?
    note: '*Grande*(大きい)は性では変わらず、数だけで変わります(*grandes*)。'
  es.a1.unit03.lesson02.teach.mi_familia_es_pequena:
    title: 小さな家族を説明する
    gloss: 私の家族は少人数です。
    note: '*Pequeña* は女性名詞 *familia* に合わせた形です。男性名詞なら、男性形の *pequeño* になります。'
  es.a1.unit03.lesson03.teach.abuelo:
    title: 祖父
    gloss: 祖父
    note: '*Abuelo* は男性名詞の単数形です。'
  es.a1.unit03.lesson03.teach.abuela:
    title: 祖母
    gloss: 祖母
    note: '*Abuela* は女性名詞の単数形です。'
  es.a1.unit03.lesson03.teach.abuelos:
    title: 祖父母
    gloss: 祖父母
    note: '*Abuelos*(男性複数形)は男女の組も表します。*padres* や *hermanos* と同じパターンです。'
  es.a1.unit03.lesson03.teach.tio:
    title: おじ
    gloss: おじ
    note: '*Tío* はアクセント記号が付きます。強勢が *í* にあり、二重母音にならないことを示すためです。'
  es.a1.unit03.lesson03.teach.tia:
    title: おば
    gloss: おば
    note: '*Tía* も *tío* と同じ理由で、同じようにアクセント記号が付きます。'
  es.a1.unit03.lesson03.teach.primo:
    title: いとこ(男性)
    gloss: いとこ(男性)
    note: '*Primo* は男性名詞の単数形です。日本語の「いとこ」は性別を区別しませんが、スペイン語ではいとこの性別を区別して表します。'
  es.a1.unit03.lesson03.teach.prima:
    title: いとこ(女性)
    gloss: いとこ(女性)
    note: '*Prima* は女性名詞の単数形です。'
  es.a1.unit03.lesson03.teach.mis_abuelos:
    title: 私の祖父母
    gloss: 私の祖父母
    note: '*Mis* は *mi* の複数形で、修飾する名詞が複数なら、名詞の性に関係なく必ず使います。'
  es.a1.unit03.lesson04.teach.cuantos_hermanos_tienes:
    title: きょうだいの数を尋ねる
    gloss: きょうだいは何人いますか?
    note: '*Cuántos*(男性複数形。*hermanos* は男女混合も表すため)は、尋ねる名詞に合わせた形です。'
  es.a1.unit03.lesson04.teach.somos_cinco:
    title: 家にいる人数を言う
    gloss: 家には私たち5人がいます。
    note: スペイン語では、世帯の人数を言うときに「いる」にあたる語を直訳せず、*Somos*(私たちは~人です)を使うのが自然です。
  es.a1.unit03.lesson04.teach.mi_familia_es_grande:
    title: 大家族について話す
    gloss: 私の家族は大家族です。
    note: ここでは *Grande* が *familia*(女性名詞)を修飾していますが、*grande* のように -e で終わる形容詞は性によって形が変わらないので、男性名詞に付く場合も同じ *grande* の形です。
  es.a1.unit03.lesson04.teach.tengo_muchos_primos:
    title: いとこがたくさんいると伝える
    gloss: 私にはいとこがたくさんいます。
    note: '*primos* は *hermanos* や *padres* と同じく、男女混合のグループを指せるので、男性複数形の *muchos* を使います。'
  es.a1.unit03.lesson04.teach.vives_cerca_de_tus_padres:
    title: 両親の近くに住んでいるかをたずねる
    gloss: ご両親の近くに住んでいますか?
    note: '*Tus* は *tu* の複数形です。*padres* が複数なので必要になります。'
  es.a1.unit03.lesson04.teach.vivo_con_mis_abuelos:
    title: 誰と住んでいるかを伝える
    gloss: 私は祖父母と住んでいます。
    note: '*Con*(~と一緒に)は、一緒に住む相手を表します。*vivo* は *vivir* の *yo* の形で、ユニット1の *vivo en Londres* でも出てきました。'
  es.a1.unit03.lesson05.teach.profile_reading:
    title: エレナの家族紹介
    gloss: 私の名前はエレナです。31歳で、スペインで祖父母と住んでいます。母と父はバルセロナに住んでいます。姉妹が1人と兄弟が1人いて、家には私たち5人がいます。妹の名前はソフィアで、20歳です。
    note: このプロフィールは、レッスン1~4の語彙や表現を、ばらばらの文ではなくひとまとまりの短い文章で使っています。このユニットの読解テストで扱う「誰が誰か」を読み取る力と同じです。
    glosses:
      llamo: ~という名前です(llamarse より)
      Tengo: 私は~です/私は~を持っています(tener より)
      treinta: '30'
      años: ~歳
      vivo: 住んでいる(vivir より)
      abuelos: 祖父母
      madre: 母
      padre: 父
      viven: 住んでいる(vivir より)
      hermana: 姉妹
      hermano: 兄弟
      somos: 私たちは~です(ser より)
      cinco: '5'
      casa: 家
      menor: 年下の
      tiene: ~です/持っている(tener より)
      veinte: '20'
  es.a1.unit03.lesson05.teach.hermana_menor:
    title: 妹
    gloss: 妹
    note: '*Menor*(年下の)は、説明する名詞の後ろに置かれ、性による形の変化はありません。'
  es.a1.unit03.lesson05.teach.vive_third_person:
    title: 住んでいる(三人称)
    gloss: 住んでいる
    note: '*Vive* は *vivir* の三人称単数の形で、自分のこと(*vivo*)ではなく、誰かについて話すとき(*Elena vive*...)に使います。vivo はユニット1のレッスン4と、このユニットのレッスン4に出てきました。'
  es.a1.unit03.lesson05.teach.sus_third_person_plural:
    title: 彼女の/彼の/彼らの(複数名詞)
    gloss: 彼女の/彼の/彼らの
    note: '*Sus* は *su* の複数形です。単数名詞に *su* が「彼の・彼女の・あなたの(丁寧)」を表すのと同じように使います。エレナについて話すとき、*sus abuelos* は「彼女の祖父母」の意味です。'
  es.a1.unit03.lesson06.teach.line01:
    title: 家族の写真を見せる
    gloss: エレナがマテオに写真を見せ、両親と妹を紹介します。
    note: '*Estos son*(こちらは~です、男性または男女混合の複数)で両親を紹介し、*esta es*(こちらは~です、女性単数)で妹を紹介しています。'
  es.a1.unit03.lesson06.teach.line02:
    title: 感想を言い、兄弟姉妹についてたずねる
    gloss: マテオは温かく反応し、ほかにも兄弟姉妹がいるかをたずねます。
    note: '*Qué bonito* は、写真を見たときの自然で温かい反応です。ユニット1の *Qué bien* に似た働きをします。'
  es.a1.unit03.lesson06.teach.line03:
    title: 家族の人数を答え、同じ質問を返す
    gloss: エレナは姉妹が1人と兄弟が1人いて、家には5人いると答え、次にマテオの家族についてたずねます。
    note: '*Somos cinco en casa* は家族全体の人数を言う表現で、レッスン4のパターンの続きです。'
  es.a1.unit03.lesson06.teach.line04:
    title: もっと小さな家族について話す
    gloss: マテオは、自分の家族はもっと小さく、両親と自分の3人だけだけれど、いとこはたくさんいると話します。
    note: '*Pero*(でも)は、少人数の家族と大勢の親戚との対比を示します。'
  es.a1.unit03.lesson06.teach.line05:
    title: 両親との距離をたずねる
    gloss: エレナは、マテオが両親の近くに住んでいるかをたずねます。
    note: '*Cerca de*(~の近く)は、距離が近いことを表すよく使う言い方です。'
  es.a1.unit03.lesson06.teach.line06:
    title: 距離と連絡の取り方を説明する
    gloss: マテオは、両親はコロンビアに住んでいて、毎週電話で話していると答えます。
    note: ユニット1で、マテオがコロンビア出身でロンドンに住んでいるとわかりました。その続きで、両親はコロンビアに残っています。
  es.a1.unit03.lesson06.teach.line07:
    title: 共感し、自分の状況を話す
    gloss: エレナは、わかると言い、自分はここスペインで祖父母と住んでいると話します。
    note: '*Entiendo*(わかります)は、相手の話に短く応えてから、自分の関連する話を付け加えるときの自然な言い方です。'
  es.a1.unit03.lesson06.teach.line08:
    title: 温かい一言で締めくくる
    gloss: マテオは、家族が近くにいるのはいいことだと言います。
    note: '*Qué bien tener a la familia cerca* は、温かくしみじみとした一言で会話を締めくくります。この会話全体の *qué bien*/*qué bonito* の形にも重なります。'
