    example_gloss: これは私の机です。
  es.a1.unit13.lesson01.teach.la_escuela:
    title: 学校
    gloss: 学校
    note: '*Escuela* は女性名詞です。'
    example_gloss: 私は学校で教えています。
  es.a1.unit13.lesson01.teach.los_estudiantes:
    title: 生徒たち
    gloss: 生徒たち
    note: '*Estudiante* は男性でも女性でも同じ形です。複数形の *los estudiantes* は、男女混合のグループも表します。'
    example_gloss: 私には生徒が二十人います。
  es.a1.unit13.lesson02.teach.trabajar:
    title: 働く
    gloss: 働く
    note: 動詞の不定詞の形で、*me gusta trabajar*(働くのが好きです)のような表現で使います。
  es.a1.unit13.lesson02.teach.soy_contador:
    title: 会計士だと言う
    gloss: 私は会計士です。
    note: 職業を言うときは、冠詞をつけずに *ser* + 職業を使います。下の文法ノートを見てください。
  es.a1.unit13.lesson02.teach.soy_profesora:
    title: 教師だと言う(女性)
    gloss: 私は教師です。
    note: '*Profesora* は *profesor* の女性形です。'
  es.a1.unit13.lesson02.teach.enseno_en_una_escuela:
    title: どこで教えているかを言う
    gloss: 私は学校で教えています。
    note: '*Enseño*(私は教える)は *enseñar* の一人称の形で、*escuela*(学校)と一緒に使っています。'
  es.a1.unit13.lesson02.teach.contador_vs_profesora_note:
    title: ser を使った職業の言い方
    gloss: スペイン語では、職業を言うときに冠詞をつけません。
    note: カード本文を見てください。
    target_text: 職業を言うときは、冠詞をつけずに *ser* + 職業を使います：*soy contador*(私は会計士です)であり、*soy un contador* とは言いません。*Contador* には対応する女性形 *contadora* があります。*profesor/profesora*(教師)も同じような男性形・女性形のペアです(女性なら *-a* をつけます)。
  es.a1.unit13.lesson03.teach.en_que_trabajas:
    title: 相手の仕事をたずねる
    gloss: お仕事は何をされていますか？
    note: '*¿En qué trabajas?*(直訳は「何で働いていますか？」)は、相手の職業をたずねる標準的な言い方です。'
  es.a1.unit13.lesson03.teach.trabajo_en_una_oficina_soy_contador:
    title: 自分の仕事で答える
    gloss: 私はオフィスで働いています。会計士です。
    note: '*oficina* と *soy contador* を組み合わせた、自然な二文の答えです。'
  es.a1.unit13.lesson04.teach.me_gusta_mi_trabajo:
    title: 仕事が好きだと言う
    gloss: 私は自分の仕事が好きです。
    note: '*gustar* の構文を *mi trabajo*(私の仕事)で再び使っています。'
  es.a1.unit13.lesson04.teach.pero_prefiero_cocinar:
    title: 好みを述べる
    gloss: でも、私は料理のほうが好きです。
    note: '*Prefiero*(私は~のほうが好きだ)はすでに出てきた形です。*cocinar*(料理する)は、この物語の中心となる活動を表す不定詞です。'
  es.a1.unit13.lesson04.teach.los_dos_preferimos_esto:
    title: 二人ともこちらが好きだと言う
    gloss: 私たち二人ともこちらのほうが好きです。
    note: '*Preferimos* は *preferir* の *nosotros* の形で、エレナとマテオが意見を合わせるときに使います。'
  es.a1.unit13.lesson05.teach.trabajos_reading:
    title: 二人の仕事についての読み物
    gloss: マテオはロンドンのオフィスで働いています。会計士です。エレナは学校で教えています。教師で、生徒が二十人います。二人とも自分の仕事が好きですが、火曜日は一緒に料理するほうが好きです。
    note: マテオとエレナの本業についての短いまとめです。
    glosses:
      trabaja: 働く(trabajar の活用形)
      oficina: オフィス
      contador: 会計士
      enseña: 教える(enseñar の活用形)
      escuela: 学校
      profesora: 教師
      tiene: 持っている(tener の活用形)
      veinte: '20'
      estudiantes: 生徒たち
      gusta: 好まれる・気に入られる(gustar の活用形)
      trabajo: 仕事
      prefieren: 〜のほうを好む
      cocinar: 料理する
      juntos: 一緒に
      martes: 毎週火曜日
  es.a1.unit13.lesson05.teach.a_los_dos_les_gusta_note:
    title: A los dos les gusta
    gloss: 二人以上の人が「好き」と言うときの言い方です。
    note: カード本文を見てください。
    target_text: '*A los dos les gusta*(二人とも好きだ)は、すでに学んだ *gustar* の構文を、複数の間接目的語に広げたものです。*me/te*(私に/あなたに)の代わりに *les*(彼らに)を使います。'
  es.a1.unit13.lesson06.teach.line01:
    title: マテオの仕事をたずねる
    gloss: エレナがマテオにどんな仕事をしているかたずねます。
    note: 前に習った質問を、今度はマテオの名前を呼びかけて使います。
  es.a1.unit13.lesson06.teach.line02:
    title: 仕事を答える
    gloss: マテオは、オフィスで会計士として働いていると言います。
    note: 前に習った完全な答え方です。働く場所を言って、そのあと職業を言います。
  es.a1.unit13.lesson06.teach.line03:
    title: 反応して、自分の仕事も話す
    gloss: エレナは興味深いと言って、自分は教師だと話します。
    note: '*Interesante*(おもしろい、興味深い)は意味を推測しやすい新しい語です。ほかの部分は、すでに知っている *soy profesora* と *enseño en una escuela* です。'
  es.a1.unit13.lesson06.teach.line04:
    title: 教えるのが好きかたずねる
    gloss: マテオは、エレナに教えるのが好きかたずねます。
    note: '*¿Te gusta enseñar?* は、すでに学んだ *gustar* の疑問文の型に、不定詞 *enseñar* を組み合わせた文です。'
  es.a1.unit13.lesson06.teach.line05:
    title: 肯定して、好みを付け加える
    gloss: エレナは、とても好きだけれど、毎週火曜日はマテオと一緒に料理するほうが好きだと言います。
    note: '*Contigo*(あなたと一緒に)は、前置詞と代名詞が一語になった新しい形です。*los martes*(毎週火曜日に)は、毎週決まった曜日を表すときに複数形の冠詞を使います。'
  es.a1.unit13.lesson06.teach.line06:
    title: 同じ好みに賛成する
    gloss: マテオは、自分も仕事は好きだけれど、料理するほうが好きだと言います。
    note: '*A mí también*(私も)は、*gustar* で「同感」を強調して伝える型です。*a mí* は「誰が好きなのか」を強調します。'
  es.a1.unit13.lesson06.teach.line07:
    title: 結論を出す
    gloss: エレナは、二人ともこれ(一緒に料理すること)のほうが好きだと結論づけます。
    note: '*Entonces*(それなら、だから)は、新しい論理をつなぐ語です。ほかの部分は *los dos preferimos esto*(私たち二人ともこれのほうが好きです)です。'
  es.a1.unit13.lesson06.teach.line08:
    title: 熱心に同意する
    gloss: マテオは、まったくその通りだと同意します。
    note: '*Definitivamente*(間違いなく)は、意味を推測しやすい新しい副詞で、場面を締めくくります。'
