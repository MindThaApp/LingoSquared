    title: 市場
  es.a1.unit07.lesson02.preguntar_el_precio:
    title: 値段を尋ねる
  es.a1.unit07.lesson03.cantidades:
    title: 量:ダース、キロ、少し
  es.a1.unit07.lesson04.una_compra_sencilla:
    title: かんたんな買い物
  es.a1.unit07.lesson05.leer_las_etiquetas_de_precio:
    title: 値札を読む
  es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue:
    title: エレナとマテオ、市場へ行く
teaching:
  es.a1.unit07.lesson01.teach.el_mercado:
    title: 市場
    gloss: 市場
    note: '*Mercado* は男性名詞です。'
    example_gloss: 市場へ行きましょう。
  es.a1.unit07.lesson01.teach.fruta_verdura:
    title: 果物、野菜
    gloss: 果物、野菜
    note: '*Verdura* は野菜全般(緑の野菜を指すことが多い)を意味します。女性単数名詞で、まとめて野菜を指すときにも使います。'
    example_gloss:
    - 果物を買いたいです。
    - 野菜は新鮮です。
  es.a1.unit07.lesson01.teach.huevos_pan:
    title: 卵、パン
    gloss: 卵、パン
    note: '*Huevos* はすでに複数形です(単数形は *huevo*)。*pan*(パン)は数えない名詞で、日常的な意味では自然な複数形がありません。'
    example_gloss:
    - 卵が必要です。
    - このパンは今朝のものです。
  es.a1.unit07.lesson02.teach.cuanto_cuesta:
    title: 値段をたずねる
    gloss: いくらですか?
    note: '*Cuesta* は *costar*(値段が〜である)の三人称の形で、この単元で初めて出てくる動詞です。'
  es.a1.unit07.lesson02.teach.cuanto_es:
    title: 値段をたずねる(別の言い方)
    gloss: おいくらですか?
    note: '*¿Cuánto cuesta?* との違いは、次の文法ノートを見てください。'
  es.a1.unit07.lesson02.teach.cuesta_dos:
    title: 値段を答える
    gloss: 2です。
    note: 値段を短く言い切る答え方です。通貨の単位は場面からわかるので、日本語でも買い物のときに数字だけで答えることがあるのと同じです。
  es.a1.unit07.lesson02.teach.cuanto_cuesta_vs_es_note:
    title: Cuánto cuesta と Cuánto es
    gloss: 値段をたずねる、どちらも自然な言い方です。
    note: カード本文を見てください。
    target_text: '*¿Cuánto cuesta?*(それはいくらしますか?)と *¿Cuánto es?*(それはいくらですか?)は、どちらも値段を尋ねる自然な言い方で、この日常の買い物の場面では入れ替えて使えます。'
  es.a1.unit07.lesson03.teach.una_docena_de_huevos:
    title: 卵1ダースを頼む
    gloss: 卵を1ダースください。
    note: スペイン語の *docena*(ダース)は名詞なので、後ろに必ず *de* と品物が続きます。日本語の「卵1ダース」のように「の」でつなぐ感覚に近い形です。
  es.a1.unit07.lesson03.teach.un_kilo_de_tomates:
    title: トマト1キロを頼む
    gloss: トマトを1キロください。
    note: '*Kilo* も *docena* と同じく、*de* と品物を続ける形になります。'
  es.a1.unit07.lesson03.teach.medio_kilo:
    title: 半キロ
    gloss: 半キロ
    note: '*Medio*(半分の)は修飾する名詞の前に置かれ、性が一致します(*medio kilo* は男性形、*media docena* は女性形)。'
    example_gloss: パンを半キロください。
  es.a1.unit07.lesson03.teach.un_poco_de:
    title: 少しの〜
    gloss: 少しの〜
    note: '*Un poco de* は、正確な量が必要ないときに、はっきりしない少量を表すのに使います。'
    example_gloss: 果物を少しほしいです。
  es.a1.unit07.lesson04.teach.necesita_algo_mas:
    title: ほかに必要なものをたずねる
    gloss: ほかに何か必要ですか?
    note: '*Necesita* は *necesitar* の *usted* の形で、店の人がお客さんに使う丁寧な言い方です。'
  es.a1.unit07.lesson04.teach.no_creo_que_ya_tenemos_todo:
    title: 全部そろっていると伝える
    gloss: いいえ、もう全部そろっていると思います。
    note: '*Creo que*(〜と思う)は言い方をやわらげる表現で、ここでは買い物リストが全部そろったことを伝えています。'
  es.a1.unit07.lesson04.teach.gracias_vendedor:
    title: 店の人にお礼を言う
    gloss: けっこうです、ありがとう。
    note: 買い物のやりとりを締めくくる、短くて自然な言い方です。
  es.a1.unit07.lesson05.teach.etiquetas_reading:
    title: 値札を読む
    gloss: ロサの屋台:トマトは1キロ2。卵は1ダース4。パンは6。新鮮な果物が毎日あります。
    note: 市場の屋台によくある値札です。品物、値段、そして値段の単位(*el kilo*、*la docena*)の順に書きます。*Puesto* は市場の屋台のことで、ここはロサの店です。
    glosses:
      Puesto: 屋台
      tomates: トマト
      kilo: キロ
      Huevos: 卵
      docena: ダース
      Pan: パン
      Fruta: 果物
      fresca: 新鮮な
      todos: 毎～
      días: 日
  es.a1.unit07.lesson05.teach.el_kilo_note:
    title: El kilo は「1キロあたり」
    gloss: 値段の後ろに単位を表す語が来ると、「その単位あたり」を表します。
    note: カード本文を見てください。
    target_text: 値段のあとの *El kilo*("tomates, dos el kilo")は「1キロあたり」という意味で、その値段は買う1キロごとにかかります。
  es.a1.unit07.lesson06.teach.line01:
    title: 市場に行こうと提案する
    gloss: エレナが、次の授業の材料を買いに市場へ行こうと言っています。
    note: '*Para la próxima clase* は「次の授業のために」という意味で、料理ワークショップの次回のことです。'
  es.a1.unit07.lesson06.teach.line02:
    title: 賛成して、何が必要かたずねる
    gloss: マテオが賛成して、何が必要かたずねています。
    note: '*¿Qué necesitamos?* は *necesitar* の *nosotros* の形で、「私たちは何が必要か」と一緒に考える言い方です。'
  es.a1.unit07.lesson06.teach.line03:
    title: 新鮮なトマトを指さす
    gloss: エレナがまず野菜と言い、トマトがとても新鮮だと指さしています。
    note: '*¡Qué tomates tan frescos!*(なんて新鮮なトマト!)は *qué* を使った感嘆文です。3課の *¡Qué bonito!* と似ていますが、名詞を使って *qué* + 名詞 + *tan* + 形容詞の形になります。'
  es.a1.unit07.lesson06.teach.line04:
    title: 店の人が量をたずねる
    gloss: 店の人が、エレナにどれくらいほしいかたずねています。
    note: '*Señorita* は若い女性への丁寧な呼びかけで、店の人がお客さんに使う *usted* の丁寧さに合っています(最近では少し古い感じがすると思う人もいます)。'
  es.a1.unit07.lesson06.teach.line05:
    title: 1キロ頼んで値段をたずねる
    gloss: エレナが1キロ頼んで、値段をたずねています。
    note: この単元で学んだ *un kilo* と *¿Cuánto cuesta?* を、ひとつの自然なやりとりにまとめています。
  es.a1.unit07.lesson06.teach.line06:
    title: 値段を伝える
    gloss: 店の人が、2だと答えています。
    note: '*Cuesta dos* は短い値段の答え方で、通貨は場面からわかります。'
  es.a1.unit07.lesson06.teach.line07:
    title: マテオが卵とパンを頼む
    gloss: マテオが、卵を1ダースとパンが必要だと言っています。
    note: この単元の *huevos*・*pan* と *una docena de* を組み合わせています。*yo* は省略でき、「私は〜」と少し強調する言い方になります。
  es.a1.unit07.lesson06.teach.line08:
    title: 店の人が両方の値段を言う
    gloss: 店の人が、卵は4、パンは6だと言っています。
    note: '*Cuestan*(複数形、「値段が〜である」)は複数の主語 *los huevos* に合わせた形で、トマトのときの単数形 *cuesta* とは違います。'
  es.a1.unit07.lesson06.teach.line09:
    title: 店の人にお礼を言う
    gloss: マテオが、けっこうです、ありがとうと言っています。
    note: この単元の前のほうに出てきたのと同じ、短い締めくくりの言い方です。
  es.a1.unit07.lesson06.teach.line10:
    title: 友だちにほかに必要なものをたずねる
    gloss: エレナが、マテオにほかに何か必要かたずねています。
    note: '*¿Necesitas...?* は友だちに使う *tú* の形で、店の人の *¿Necesita...?* は *usted* の形です。'
  es.a1.unit07.lesson06.teach.line11:
    title: 全部そろっていると伝える
    gloss: マテオが、いいえ、もう全部そろっていると思うと答えています。
    note: '*Creo que*(〜と思う)は答えをやわらげます。*ya* は「もう、すでに」という意味です。'
