teaching:
  es.a1.unit47.lesson01.teach.llamar:
    title: 電話する
    gloss: 電話する
    note: 電話をかけることを表す動詞の不定詞です。
    example_gloss: あなたに電話しなければなりません。
  es.a1.unit47.lesson01.teach.te_llamo:
    title: 電話すると伝える
    gloss: あなたに電話します。
    note: '*Llamo* は *llamar* の *yo* の形で、*te* と一緒に使うと「あなたに電話する」という意味になります。スペイン語ではこれから電話する場合にも現在形を使い、日本語の「電話します」にあたる意味で使えます。'
  es.a1.unit47.lesson01.teach.hola_soy_elena:
    title: 電話に出る
    gloss: もしもし、エレナです。
    note: スペイン語では電話で名乗るとき、*soy* + 名前(直訳は「私は~です」)を使います。日本語の「~です」と近い言い方です。
  es.a1.unit47.lesson01.teach.hola_soy_mateo:
    title: マテオも同じように応答する
    gloss: もしもし、マテオです。
    note: '*Hola, soy Elena* と同じ、*soy* + 名前のパターンです。'
  es.a1.unit47.lesson02.teach.con_quien_hablo:
    title: 誰からの電話か尋ねる
    gloss: どちら様ですか?
    note: '*¿Con quién hablo?* は、電話の相手が誰か分からないときの決まった言い方です。'
  es.a1.unit47.lesson02.teach.habla_con_elena:
    title: 丁寧に名乗る
    gloss: エレナです。
    note: '*Habla con* + 名前は、*hablar* の敬称 *usted* の形を使った言い方で、*soy* + 名前の丁寧な表現です。'
  es.a1.unit47.lesson03.teach.puedes_repetir_eso:
    title: もう一度言ってもらう
    gloss: それをもう一度言ってもらえますか?
    note: '*¿Puedes...?*(~してくれますか?)+ *repetir*(繰り返す)+ *eso*(それ)。'
  es.a1.unit47.lesson03.teach.no_hables_tan:
    title: ゆっくり話してもらう
    gloss: そんなに速く話さないでください。
    note: '*No hables* は *hablar* の親しい相手への否定の命令形で、*tan rápido*(そんなに速く)が程度を表します。'
  es.a1.unit47.lesson03.teach.no_te_oigo:
    title: よく聞こえないと伝える
    gloss: よく聞こえません。
    note: '*Oír*(聞こえる)と *no ... bien*(よく~ない)で、聞こえにくいことを表します。*entender*(理解する)とは別で、*te oigo* は「あなたの声が聞こえる」という意味です。'
  es.a1.unit47.lesson04.teach.el_mensaje:
    title: メッセージ
    gloss: メッセージ
    note: 男性名詞で、*el mensaje* と言います。*el SMS* や *el texto* とも言いますが、*mensaje* が最も一般的です。
    example_gloss: そのメッセージはエレナからです。
  es.a1.unit47.lesson04.teach.te_envio_un:
    title: メッセージを送ると伝える
    gloss: あなたにメッセージを送ります。
    note: '*Enviar*(送る)は、代名詞 *te*(あなたに)の後に置きます:*te envío un mensaje*。'
  es.a1.unit47.lesson04.teach.te_llamo_mas:
    title: かけ直すと伝える
    gloss: 後でかけ直します。
    note: '*Más tarde*(後で)は文の最後に置きます:*te llamo más tarde*。'
  es.a1.unit47.lesson05.teach.mateo_hola_elena:
    title: メッセージのやり取りを読む
    gloss: マテオ:やあエレナ、電話してくれる?話したいことがあるんだ。 エレナ:うん、もちろん。5分後にかけ直すね。
    note: マテオが何を頼んでいるか、その理由、エレナがいつかけ直すと言っているかを読み取りましょう。
    glosses:
      Hola: やあ
      puedes: できる
      llamarme: 電話する
      Tengo: ~しなければならない
      algo: 何か
      contarte: 伝える
      claro: もちろん
      llamada: 電話する
      cinco: '5'
      minutos: 分
      devuelvo: 折り返す
  es.a1.unit47.lesson06.teach.mateo_hola_soy:
    title: マテオが電話に出る
    gloss: マテオ:もしもし、マテオです。
    note: 最初のレッスンと同じ *soy* + 名前の型を、今度は実際の電話で使います。電話に出た人が先に話し、名前を名乗ります。
  es.a1.unit47.lesson06.teach.elena_hola_mateo:
    title: エレナが名乗る
    gloss: エレナ:こんにちは、マテオ。エレナだよ。マテオ:電話してくれてありがとう!
    note: '*Gracias por llamar*(電話してくれてありがとう)は *gracias por* + 不定詞の形です。'
  es.a1.unit47.lesson06.teach.elena_como_ha:
    title: エレナが仕事の様子を尋ねる
    gloss: エレナ:初めてのシフトはどうだった?
    note: '*Ha ido* は *ir* の現在完了形です(ここでは「~という結果になる」の意味)。*ha* + 過去分詞 *ido* の形です。'
  es.a1.unit47.lesson06.teach.mateo_ha_ido:
    title: マテオがいい知らせを伝える
    gloss: マテオ:とてもうまくいったよ。思っていたよりずっといい感じだった。
    note: '*Ha ido muy bien* は質問と同じ現在完了形を使っています。*mejor de lo esperado*(予想よりよく)は *de lo* を使った比較の言い方です。'
  es.a1.unit47.lesson06.teach.ha_ido_ir:
    title: Ha ido、es、esperado を不定詞とともに示します
    gloss: ha ido → ir(行く)、es → ser(である)、esperado → esperar(期待する)
    note: '*Ha ido*、*es*、*esperado* の不定詞は、それぞれ *ir*、*ser*、*esperar* です。今のところ *ha ido muy bien* は決まった言い回しとして覚えてください。現在完了は後でしっかり練習します。'
  es.a1.unit47.lesson06.teach.elena_que_bien:
    title: エレナが誇りに思う
    gloss: エレナ:それを聞けてうれしいな!あなたを誇りに思うよ。
    note: '*Orgulloso/a de*(~を誇りに思う)は *de* と結びつく決まった形です。形容詞は話し手に合わせて変わります(エレナなら *orgullosa*)。'
  es.a1.unit47.lesson06.teach.mateo_muchas_gracias:
    title: マテオが感激する
    gloss: マテオ:ありがとう。そう言ってもらえて、とてもうれしいよ。
    note: '*Significa* は *significar*(意味する)の三人称の形です。*para mí*(私にとって)で、誰にとって大切かを表します。'
  es.a1.unit47.lesson06.teach.su_primer_turno:
    title: 彼の
    gloss: 彼の初めてのシフトはとてもうまくいきました。
    note: ここでの *Su* は「彼の」を表す所有詞です(*usted* に対しては「あなたの」、「彼女の」の意味にもなります)。誰のものかは文脈で判断します。
