    title: より多く、より少なく、同じくらい
  es.a1.unit15.lesson02.comparar_los_apartamentos:
    title: 新しいほうが古いほうより大きい
  es.a1.unit15.lesson03.cual_es_mas_grande:
    title: どちらのアパートのほうが大きいですか？
  es.a1.unit15.lesson04.tan_bien_como:
    title: マテオはエレナと同じくらい料理が上手
  es.a1.unit15.lesson05.leer_la_comparacion:
    title: 二つのアパートを比べる
  es.a1.unit15.lesson06.comparar_apartamentos_dialogue:
    title: エレナとマテオがアパートを比べる
teaching:
  es.a1.unit15.lesson01.teach.mas_que:
    title: 〜より…
    gloss: 〜より…
    note: '*Más...que* は異なる二つの量やものを比べます。下の文法ノートを見てください。'
    example_gloss: 新しいアパートは古いアパートより大きいです。
  es.a1.unit15.lesson01.teach.menos_que:
    title: 〜より少なく…
    gloss: 〜より少なく…
    note: '*Menos...que* は *más...que* の反対です。'
    example_gloss: 古いアパートは新しいアパートほど大きくありません。
  es.a1.unit15.lesson01.teach.tan_como:
    title: 〜と同じくらい…
    gloss: 〜と同じくらい…
    note: '*Tan...como* は等しい二つのものを比べます。*más/menos* とは別の構文で、同じ内容の言い換えではありません。'
    example_gloss: マテオはエレナと同じくらい料理が上手です。
  es.a1.unit15.lesson01.teach.mas_menos_tan_note:
    title: 差のある比較と同等の比較
    gloss: más/menos...que と tan...como の違いです。
    note: カード本文を見てください。
    target_text: '*Más...que*(〜より…)と *menos...que*(〜より少なく…)は、異なる二つのものや量を比べます。*Tan...como*(〜と同じくらい…)は等しい二つのものを比べる別の構文で、*más/menos* の言い換えではありません。'
  es.a1.unit15.lesson02.teach.el_nuevo_es_mas_grande:
    title: 新しいアパートを比べる
    gloss: 新しいアパートは古いアパートより大きいです。
    note: '*Más grande que*(〜より大きい)は、*más...que* の型に *grande*(大きい)を入れた形です。'
  es.a1.unit15.lesson02.teach.el_viejo_es_mas_pequeno:
    title: 古いアパートを比べる
    gloss: 古いアパートは新しいアパートより小さいです。
    note: '*Más pequeño que*(〜より小さい)は *pequeño*(小さい)を使い、反対の側から比較を述べています。'
  es.a1.unit15.lesson03.teach.cual_apartamento_es_mas_grande:
    title: どちらが大きいかたずねる
    gloss: どちらのアパートのほうが大きいですか？
    note: '*¿Cuál...?*(どちら…?)に比較級の形容詞を続けると、二つを比べて尋ねる基本の言い方になります。'
  es.a1.unit15.lesson03.teach.el_nuevo_es_mas_grande_reply:
    title: どちらが大きいか答える
    gloss: 新しいほうが古いほうより大きいです。
    note: 同じ比較を、*¿cuál...?* の質問への直接の答えとして使っています。*el nuevo*(新しいほう)は、繰り返しになる名詞を省いた形です。
  es.a1.unit15.lesson04.teach.mateo_cocina_tan_bien_como_elena:
    title: 料理の腕前を同等に比べる
    gloss: マテオはエレナと同じくらい料理が上手です。
    note: '*Tan bien como*(~と同じくらい上手に)は、*tan* + 副詞 + *como* の形で、同等を表す型を名詞の大きさではなく動詞の様子に使ったものです。'
  es.a1.unit15.lesson04.teach.somos_un_buen_equipo:
    title: いいチームだと言う
    gloss: 私たちはいいチームです。
    note: '*Somos*(私たちは~です)+ *un buen equipo*(いいチーム)は、同等の比較のあとの締めくくりとして自然な一言です。'
  es.a1.unit15.lesson05.teach.comparacion_reading:
    title: 二つのアパートを比べる
    gloss: マテオの古いアパートは台所が狭いです。新しいアパートはもっと大きく、台所も広いです。古いほうは新しいほうより小さいので、マテオは引っ越したいと思っています。新しいほうは料理をするスペースがもっとあります。
    note: 二つのアパートを比べた、実際にありそうな要約です。
    glosses:
      viejo: 古い
      tiene: 持っている(tenerの活用形)
      pequeña: 小さい
      nuevo: 新しい
      grande: 大きい
      también: ~も
      pequeño: 小さい
      eso: ~より
      quiere: ~したい(quererの活用形)
      mudarse: 引っ越す
      espacio: スペース
      cocinar: 料理する
  es.a1.unit15.lesson05.teach.por_eso_note:
    title: Por eso(だから)
    gloss: por eso が理由と結果をつなぐしくみ。
    note: カード本文を見てください。
    target_text: '*Por eso*(だから/そのために)は理由と結果をつなぎます。小さいキッチンがマテオが引っ越したい理由です。*porque* で学んだ原因と結果の関係と同じ考え方です。'
  es.a1.unit15.lesson06.teach.line01:
    title: もう見たかどうか尋ねる
    gloss: エレナは、マテオがもう新しいアパートを見たか尋ねています。
    note: '*¿Ya viste...?*(もう~を見た？)は、新しい過去形の疑問文です。'
  es.a1.unit15.lesson06.teach.line02:
    title: 大きいと答える
    gloss: マテオは、新しいほうが古いほうより大きく、台所も広いと答えています。
    note: '*más...que* の比較に、*la cocina también*(台所も)を加えた文です。'
  es.a1.unit15.lesson06.teach.line03:
    title: どちらが小さいか尋ねる
    gloss: エレナは、それならどちらのアパートが小さいのか尋ねています。
    note: '*Entonces*(それなら)は、すでに出てきた論理をつなぐ言葉です。質問は *¿Cuál...?* の型で、*grande* の代わりに *pequeño* を使っています。'
  es.a1.unit15.lesson06.teach.line04:
    title: 答えて理由を言う
    gloss: マテオは、古いほうが小さいので引っ越したいのだと言っています。
    note: '*El viejo es más pequeño que el nuevo* に、*por eso quiero mudarme*(だから引っ越したい)が続いています。'
  es.a1.unit15.lesson06.teach.line05:
    title: もっともだと同意する
    gloss: エレナは、新しいほうが料理するスペースが広いのだからもっともだと言っています。
    note: '*Tiene mucho sentido*(とても筋が通っている)は、新しい同意の表現です。*más espacio para cocinar* は「料理をするためのもっと広いスペース」という意味です。'
  es.a1.unit15.lesson06.teach.line06:
    title: 理由をさらに広げる
    gloss: マテオは同意し、エレナも自分と同じくらい料理が上手なので、二人分のスペースが必要だと付け加えています。
    note: '*Tan bien como*(~と同じくらい上手に)を、*tú cocinas*(あなたは料理する)を使った会話の中で用いています。'
  es.a1.unit15.lesson06.teach.line07:
    title: ほめ返す
    gloss: エレナは大喜びで同意し、マテオも自分と同じくらい料理が上手だと言っています。
    note: '*¡Es verdad!*(その通り！)+ *tú cocinas tan bien como yo*(あなたも私と同じくらい上手に料理する)。同じ *tan bien como* の比較を、マテオに向け返しています。'
  es.a1.unit15.lesson06.teach.line08:
    title: チームワークで締めくくる
    gloss: マテオは、二人はいいチームだと締めくくっています。
    note: '*Somos un buen equipo*(私たちはいいチームだ)が、会話の締めくくりです。'
