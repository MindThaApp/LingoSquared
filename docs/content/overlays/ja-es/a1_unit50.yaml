teaching:
  es.a1.unit50.lesson01.teach.juntos:
    title: いっしょに
    gloss: いっしょに
    note: '*Juntos* は、みんなでいっしょにすることをはっきり示します。人に合わせて形が変わり、全員女性なら *juntas* になります。'
    example_gloss: いっしょにコーヒーを飲みましょうか。
  es.a1.unit50.lesson01.teach.tomar_un_cafe:
    title: コーヒーを飲む
    gloss: コーヒーを飲む
    note: スペイン語では、コーヒーを飲むことを *tomar un café*(直訳は「コーヒーを取る」)と言い、beber はあまり使いません。
  es.a1.unit50.lesson01.teach.ir_al_cine:
    title: 映画を見に行く
    gloss: 映画を見に行く
    note: '*Ir al cine*(直訳は「映画館に行く」)は、映画を見に行くときの普通の言い方です。*al* は *a* + *el* です。'
  es.a1.unit50.lesson01.teach.tomamos_un_cafe:
    title: コーヒーを飲みましょうか。
    gloss: コーヒーを飲みましょうか。
    note: '*¿Tomamos ...?* は、*nosotros* の現在形を使って、いっしょにすることを提案する言い方です。'
  es.a1.unit50.lesson01.teach.tomamos_algo_es:
    title: ¿Tomamos ...? の使い方
    gloss: ¿Tomamos + 何か? は、いっしょに何かをしようと提案するときの普通の言い方です。
    note: '*nosotros* の形(*tomamos*)をそのまま疑問文にすると、「〜しましょうか」という提案になります。*¿Tomamos un café?*'
  es.a1.unit50.lesson01.teach.tienes_ganas_de:
    title: 映画を見に行きたい気分ですか。
    gloss: 映画を見に行きたい気分ですか。
    note: '*¿Tienes ganas de ...?* は、何かをしたい気分かどうかをくだけてたずねる表現です。*de* の後ろには不定詞が来ます。'
  es.a1.unit50.lesson02.teach.si_que_bien:
    title: うん、いいね!
    gloss: うん、いいね!
    note: '*¡Sí, qué bien!* は、喜んで誘いを受けるときの短い返事です。'
  es.a1.unit50.lesson02.teach.buena_idea:
    title: いい考え
    gloss: いい考えだね!
    note: '*¡Buena idea!* は、提案をほめることで受け入れる言い方です。'
  es.a1.unit50.lesson02.teach.es_un_buen:
    title: それはいい計画だ
    gloss: それはいい計画ですね。
    note: これは、もう少し丁寧に前向きな気持ちを伝える返事です。
  es.a1.unit50.lesson02.teach.lo_siento_no:
    title: 理由を添えて断る
    gloss: ごめんなさい、仕事をしているので行けません。
    note: '*Lo siento* で断りをやわらげ、*porque* で短い理由を述べます。'
  es.a1.unit50.lesson02.teach.no_tengo_tiempo:
    title: 時間がない
    gloss: 時間がありません。
    note: '*No tengo tiempo* は、率直ですが普通の断り方です。*no* は動詞の前に置きます。'
  es.a1.unit50.lesson02.teach.lo_siento_no_2:
    title: 感じのよい断り方
    gloss: Lo siento + no puedo + 短い理由で、感じのよい断り方になります。
    note: 会話では理由は省いてもかまいませんが、添えるとこの型が使いやすく、丁寧になります。
  es.a1.unit50.lesson03.teach.quedar:
    title: 会う約束をする
    gloss: 会う約束をする
    note: '*Quedar* は会う約束をするという意味です:*¿Quedamos el viernes?* ラテンアメリカでは、代わりに *¿Nos vemos el viernes?* と言う人も多いです。'
    example_gloss: 金曜日の2時半に会いませんか?
  es.a1.unit50.lesson03.teach.quedamos_el_viernes:
    title: 金曜の2時半に会う
    gloss: 金曜の2時半に会いましょうか?
    note: 曜日の *el viernes* と、*a las* に時刻を続ける形を組み合わせています。
  es.a1.unit50.lesson03.teach.las_dos_y:
    title: Y media は「半」
    gloss: las dos y media = 2時半。a las dos y media は会う時刻を表します。
    note: スペイン語は過ぎたばかりの時を基準に数えます。*las dos y media* は2時半で、直訳すると「2時と半分」です。日本語の「2時半」も「2時」+「半」なので、似た発想です。
  es.a1.unit50.lesson03.teach.el_viernes_17:
    title: 日付と時刻
    gloss: 4月17日金曜日の3時15分に
    note: スペイン語では曜日や月名は小文字で書き、日付には *de* を使います:*el viernes 17 de abril*。日本語の「4月17日」とは語順も異なります。
  es.a1.unit50.lesson03.teach.si_el_viernes:
    title: 時間を確認する
    gloss: はい、金曜の2時半で大丈夫です。
    note: '*Me viene bien*(「私に都合がいい」)は、提案された時間でよいと確認する言い方です。'
  es.a1.unit50.lesson04.teach.el_mensaje_la:
    title: メッセージ、招待、言語カフェ
    gloss: メッセージ、招待、言語カフェ
    note: '*Un mensaje* は短い文章やデジタルのメッセージ、*una invitación* は活動に誘うこと、*el café de idiomas* はグループの集まる場所です。'
    example_gloss:
    - エレナからメッセージが届いています。
    - これは言語カフェへの招待です。
    - 言語カフェでコーヒーを飲みます。
  es.a1.unit50.lesson04.teach.hola_mateo_tienes:
    title: エレナからの招待
    gloss: こんにちは、マテオ。4月18日土曜日の2時半に、言語カフェでコーヒーを飲まない?エレナより。
    note: 活動、日付、時刻、場所の4点に注意して読みましょう。
    glosses:
      Hola: やあ、こんにちは
      ganas: 願望(tener ganas de = ~したい気分だ)
      sábado: 土曜日
      abril: 4月
      media: 半(y media = ~時半)
      dos: '2'
      café: コーヒー
      tomar: 飲む
      idiomas: 語学カフェ
      saludo: よろしく(手紙の結び)
  es.a1.unit50.lesson05.teach.hola_mateo_vamos:
    title: 誘いのメッセージ
    gloss: こんにちは、マテオ。金曜の2時半にコーヒーを飲みに行かない?エレナより。
    note: このメッセージには、あいさつ、活動、曜日、時刻、結びの言葉が入っています。
    glosses:
      Hola: やあ、こんにちは
      vamos: ~しませんか
      viernes: 金曜日
      media: 半(y media = ~時半)
      dos: '2'
      café: コーヒー
      tomar: 飲む
      saludo: よろしく(手紙の結び)
  es.a1.unit50.lesson05.teach.hola_elena_si:
    title: 承諾のメッセージ
    gloss: こんにちは、エレナ。うん、いいね!金曜の2時半で大丈夫だよ。金曜に会おうね!マテオより。
    note: この返事は、活動を受け入れ、さらに日時を繰り返して確認しています。
    glosses:
      Hola: やあ、こんにちは
      bien: いいね、すてき
      viernes: 金曜日
      media: 半(y media = ~時半)
      dos: '2'
      viene: よい、都合がつく
      Hasta: ~まで、また会おう
  es.a1.unit50.lesson05.teach.un_mensaje_corto:
    title: メッセージに入れる内容
    gloss: 短いメッセージには、活動、曜日または日付、時刻を入れます。
    note: あいさつと結びもあると便利ですが、大事なのは活動と、それがいつあるかという点です。
  es.a1.unit50.lesson06.teach.elena_tomamos_un:
    title: エレナがコーヒーに誘う
    gloss: エレナ:金曜にコーヒーを飲まない?マテオ:うん、いいね!何時に?
    note: マテオは時間を尋ねる前に、まず誘いを受け入れています。
  es.a1.unit50.lesson06.teach.elena_a_las:
    title: エレナが最初に出した時間
    gloss: エレナ:2時半に。
    note: '*Las dos y media* は、時刻のレッスンで学んだとおり2時半です。'
  es.a1.unit50.lesson06.teach.mateo_lo_siento:
    title: マテオが別の時間を提案する
    gloss: マテオ:ごめん、2時半は行けないんだ。3時15分はどう?
    note: '*¿Puede ser a ...?* は、別の時間でもよいか尋ねる簡潔な言い方です。'
  es.a1.unit50.lesson06.teach.elena_si_a:
    title: 最終的な予定を確認する
    gloss: エレナ:うん、3時15分で大丈夫。マテオ:いい予定だね。じゃあ金曜の3時15分に会おう。
    note: ここでの *quedamos* は再び *nosotros* の形で、予定を確認しています。
