  es.a1.unit05.lesson06.planear_el_almuerzo_dialogue:
    title: エレナとマテオの昼食の計画
teaching:
  es.a1.unit05.lesson01.teach.que_hora_es:
    title: 時刻をたずねる
    gloss: 何時ですか？
    note: '*Qué hora*(何時)は時刻をたずねる表現で、*qué fecha*(何月何日)とは違います。'
  es.a1.unit05.lesson01.teach.es_la_una:
    title: 1時です
    gloss: 1時です。
    note: 1時のときだけ *son* ではなく *es* を使う理由は、次の文法ノートを見てください。
  es.a1.unit05.lesson01.teach.es_vs_son_note:
    title: 時刻の es と son
    gloss: 1時だけがほかの時刻と違う理由。
    note: '*Es la una*(単数)ですが、*son las dos, son las tres...*(複数)です。'
    target_text: 1時だけは単数の動詞 *es*(Es la una)を使い、ほかの時刻は複数の *son*(Son las dos, Son las tres...)を使います。*la una* は単数(「1番目の時間」)で、*las dos*、*las tres* などは複数だからです。
  es.a1.unit05.lesson01.teach.son_las_horas:
    title: 2時、4時、5時、7時
    gloss: 2時です、4時です、5時です、7時です。
    note: 1時以外のすべての時刻に *Son las...*(複数)を使います。前の文法ノートのとおりです。
    example_gloss:
    - 2時です。
    - 4時です。
    - 5時です。
    - 7時です。
  es.a1.unit05.lesson02.teach.y_cuarto:
    title: 〜時15分
    gloss: 4時15分です(4時を15分過ぎ)。
    note: '*Y cuarto*(と4分の1)は、その時刻に15分を足します。'
  es.a1.unit05.lesson02.teach.y_media:
    title: 〜時半
    gloss: 7時半です。
    note: '*Y media*(と半分)は、その時刻に30分を足します。'
  es.a1.unit05.lesson02.teach.menos_cuarto:
    title: 〜時15分前
    gloss: 5時15分前です(4時45分)。
    note: '*menos* が次の時刻に向かって数える仕組みは、次の文法ノートを見てください。'
  es.a1.unit05.lesson02.teach.menos_note:
    title: Menos(〜前)
    gloss: 次の時刻まであと何分かを表す、スペイン語の言い方。
    note: '*Las cinco menos cuarto* = 5時15分前(4時45分)。'
    target_text: '*Menos*(引く、〜前)は、次の時刻に向かって数えます。*las cinco menos cuarto* は4時45分で、「5時15分前」と読みます。'
  es.a1.unit05.lesson03.teach.partes_del_dia:
    title: 朝・午後・夜
    gloss: 朝の、午後の、夜の
    note: '*De la mañana/tarde/noche* は時刻のあとに付けて、午前か午後かをはっきりさせます。日本語で「朝の8時」「夜の10時」と言うのに近い働きです。'
    example_gloss:
    - 朝の8時です。
    - ワークショップは午後4時に始まります。
    - 夜の10時です。
  es.a1.unit05.lesson03.teach.taller_empieza_cuatro_tarde:
    title: ワークショップは4時に始まる
    gloss: ワークショップは午後4時に始まります。
    note: '*Empieza*(始まる)は *empezar* の3人称の形で、この単元の新しい動詞です。'
  es.a1.unit05.lesson03.teach.a_que_hora_empieza:
    title: 何時に始まるかをたずねる
    gloss: ワークショップは何時に始まりますか。
    note: '*A qué hora*(何時に)は、特定の出来事がいつかをたずねる基本の言い方です。今の時刻をたずねる *qué hora es* とは違います。'
  es.a1.unit05.lesson04.teach.nos_vemos_a_que_hora:
    title: 会う時間をたずねる
    gloss: 何時に会いましょうか。
    note: '*Nos vemos*(お互いに会う/会いましょう)は、会う約束をするときに使う再帰的な形です。'
  es.a1.unit05.lesson04.teach.nos_vemos_tres_y_media:
    title: 会う時間を提案する
    gloss: 3時半に会いましょうか。
    note: '*y media* と *nos vemos* を組み合わせて、具体的な時刻を提案します。'
  es.a1.unit05.lesson04.teach.antes_del_taller:
    title: ワークショップの前
    gloss: それはワークショップの前です。
    note: '*Antes de*(~の前に)は *después*(あとで)の反対です。'
  es.a1.unit05.lesson04.teach.de_acuerdo:
    title: 了解です/いいですよ
    gloss: 了解です/いいですよ
    note: '*De acuerdo* は、予定を確認するときの自然で短い言い方で、働きは *Muy bien* に近いです。'
    example_gloss: 了解です、3時半に会いましょう。
  es.a1.unit05.lesson05.teach.horario_dia_reading:
    title: 一日の予定を読む
    gloss: ワークショップは午後4時に始まります。その前に、エレナとマテオは3時半に会います。ワークショップは6時に終わります。翌日は、1時に会って昼食をとります。
    note: 一日の短い予定です。待ち合わせ、ワークショップ、そして翌日の昼食が出てきます。
    glosses:
      taller: ワークショップ
      empieza: 始まる
      cuatro: '4'
      tarde: 午後
      Antes: 前に
      ven: 会う
      tres: '3'
      media: 半
      termina: 終わる
      seis: '6'
      día: 日
      siguiente: 次の
      almorzar: 昼食をとる
  es.a1.unit05.lesson05.teach.al_dia_siguiente:
    title: 翌日
    gloss: 翌日/その次の日
    note: '*Al día siguiente*(その次の日に)は、話を新しい日へ進めるときによく使う言い方です。*la próxima clase*(次の授業。暦の上の日ではなく特定の出来事を指します)とは異なります。'
  es.a1.unit05.lesson06.teach.line01:
    title: ワークショップのあとの食事について尋ねる
    gloss: マテオは、ワークショップが6時に終わると言い、そのあとエレナがお腹が空いているか尋ねます。
    note: '*Tienes hambre*(お腹が空いていますか)は新しい慣用表現です。直訳は「空腹を持っている」で、*tener ... años* や *tener hermanos* と同じ「持つ」を使う構文です。'
  es.a1.unit05.lesson06.teach.line02:
    title: 同意して、翌日を提案する
    gloss: エレナは「はい、少し」と答え、代わりに翌日に食べようと提案します。
    note: '*¿Comemos mañana?* は、ワークショップの直後ではなく明日を提案する表現で、次の具体的な時間のやり取りにつながります。'
  es.a1.unit05.lesson06.teach.line03:
    title: 同意して、時間を尋ねる
    gloss: マテオはいい考えだと賛成し、何時にするか尋ねます。
    note: '*Buena idea*(いい考え)は、提案に賛成するときの自然で短い言い方です。'
  es.a1.unit05.lesson06.teach.line04:
    title: 1時を提案する
    gloss: エレナは1時に会うことを提案します。
    note: '*A la una*(1時に)は、*Es la una* と同じく単数の *la una* を使います。'
  es.a1.unit05.lesson06.teach.line05:
    title: 了承して、レストランの話をする
    gloss: マテオは1時で大丈夫だと答え、近くにあるレストランのことを話します。
    note: '*Hay un restaurante cerca de aquí*:*cerca de*(~の近く)は *cerca de tus padres* のように人にも使えますが、ここでは場所に使っています。'
  es.a1.unit05.lesson06.teach.line06:
    title: 明るく締めくくる
    gloss: エレナは喜んで、また明日と言います。
    note: '*¡Genial!*(すごい!)は、やり取りを熱のこもった調子で締めくくる表現で、働きは *¡Qué bien!* に近いです。'
