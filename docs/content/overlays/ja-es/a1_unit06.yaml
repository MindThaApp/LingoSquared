teaching:
  es.a1.unit06.lesson01.teach.sandwich_ensalada:
    title: サンドイッチ、サラダ
    gloss: サンドイッチ、サラダ
    note: '*sándwich* は外来語で、日本語の「サンドイッチ」と同じように、よその言語から入ってきた語です。強勢のある音節を示すためにアクセント記号を付けて書きます。'
    example_gloss:
    - サンドイッチがほしいです。
    - サラダにはトマトが入っています。
  es.a1.unit06.lesson01.teach.sopa:
    title: スープ
    gloss: スープ
    note: '*Sopa* は女性名詞で、-a で終わるスペイン語の名詞の大半と同じです。'
    example_gloss: スープはとてもおいしいです。
  es.a1.unit06.lesson01.teach.agua_cafe:
    title: 水、コーヒー
    gloss: 水、コーヒー
    note: '*Agua* は文法上は女性名詞ですが、強勢のある *a* の音で始まるため、単数では *la* ではなく男性形の冠詞 *el* を使います。書き間違いではなく、スペイン語の本当の例外です。'
    example_gloss:
    - お水をお願いします。
    - 私はコーヒーにします。
  es.a1.unit06.lesson02.teach.quiero_un_sandwich:
    title: サンドイッチが欲しいです
    gloss: サンドイッチがほしいです。
    note: '*Quiero*(欲しいです)は動詞 *querer* の一人称の形で、このユニットで初めて出てくる動詞です。'
  es.a1.unit06.lesson02.teach.para_mi_un_cafe:
    title: 私はコーヒーにします
    gloss: 私はコーヒーにします。
    note: '*Para mí*(私には)は、動詞を繰り返さずに品物だけを言う、注文のもう一つのよく使う言い方です。次の文法ノートも見てください。'
  es.a1.unit06.lesson02.teach.que_quieres_comer:
    title: 相手に何を食べたいか尋ねる
    gloss: 何を食べたいですか？
    note: '*Quieres* は動詞 *querer* の *tú* の形で、友達に使うくだけた言い方です。'
  es.a1.unit06.lesson02.teach.quiero_vs_para_mi_note:
    title: Quiero と Para mí
    gloss: 同じくらい自然な、2通りの注文の仕方。
    note: 注文するときは、*Quiero un café* も *Para mí, un café* もどちらも使えます。
    target_text: '*Quiero*(「欲しいです」)と *Para mí*(「私には」。品物を言う前に使います)は、くだけた場面での注文として、どちらも自然で同じくらい丁寧な言い方です。どちらかのほうが正しいということはありません。'
  es.a1.unit06.lesson03.teach.el_menu:
    title: メニュー
    gloss: メニュー
    note: '*Menú* は最後の音節に強勢があるため、アクセント記号を付けて書きます。'
    example_gloss: メニューを見てもいいですか？
  es.a1.unit06.lesson03.teach.podemos_ver_el_menu:
    title: メニューを見せてもらう
    gloss: メニューを見てもいいですか？
    note: '*Podemos*(私たちは〜できる)は動詞 *poder* の一人称複数の形で、このユニットで初めて出てくる動詞です。'
  es.a1.unit06.lesson03.teach.aqui_tiene:
    title: はい、どうぞ
    gloss: はい、どうぞ。
    note: '*Aquí tiene* は、店員がお客に物を渡すときの決まった言い方です。くだけたやりとりの中でも丁寧な *usted* の動詞の形を使いますが、これは決まった礼儀表現であり、丁寧さの切り替えではありません。'
  es.a1.unit06.lesson03.teach.buen_provecho:
    title: どうぞ召し上がれ
    gloss: どうぞ召し上がれ
    note: '*Buen provecho* は、食べ始める人にかける決まり文句で、日本語の「どうぞ召し上がれ」に近い働きをします。'
    example_gloss: はい、どうぞ。召し上がれ。
  es.a1.unit06.lesson04.teach.el_postre:
    title: デザート
    gloss: デザート
    note: '*Postre* は男性名詞です。'
    example_gloss: デザートにケーキをください。
  es.a1.unit06.lesson04.teach.de_postre_quiero_pastel:
    title: デザートを注文する
    gloss: デザートにケーキをください。
    note: '*De postre*(デザートに)は、最後のコースとして何を頼むかを言い出す表現で、*para mí* がメインの注文を言い出すのと同じ型です。'
  es.a1.unit06.lesson04.teach.la_cuenta_por_favor:
    title: お会計をお願いする
    gloss: お会計をお願いします。
    note: '*La cuenta*(お会計)は、食事の最後に支払いをしたいときの標準的な言い方です。'
  es.a1.unit06.lesson05.teach.menu_reading:
    title: メニューを読む
    gloss: メニュー：サンドイッチ、5。サラダ、8。スープ、3。コーヒーか水、込み。デザート：ケーキ。
    note: 実際の印刷メニューのような書式で、このユニットの食べ物の語彙に値段が付いています。
    glosses:
      Menú: メニュー
      sándwich: サンドイッチ
      Ensalada: サラダ
      Sopa: スープ
      Café: コーヒー
      agua: 水
      incluido: 含まれている
      Postre: デザート
      pastel: ケーキ
  es.a1.unit06.lesson05.teach.incluido_note:
    title: Incluido(含まれている)
    gloss: 飲み物に「含まれている」と書いてあるときの意味。
    note: '*Incluido* = 含まれている、追加料金なし。'
    target_text: '*Incluido*(含まれている)は、食事に飲み物が付いていて、追加料金がかからないことを表します。'
  es.a1.unit06.lesson06.teach.line01:
    title: あいさつと注文の確認
    gloss: 店員がエレナとマテオにあいさつして、何を食べたいか尋ねます。
    note: '*Buenas tardes*(こんにちは)は正午ごろから使うので、ランチの時間にぴったりです。'
  es.a1.unit06.lesson06.teach.line02:
    title: エレナが注文する
    gloss: エレナはサラダと水をお願いします。
    note: '*Una ensalada y agua* = サラダと水。'
  es.a1.unit06.lesson06.teach.line03:
    title: マテオが注文する
    gloss: マテオは自分用にサンドイッチとコーヒーを注文します。
    note: '*Quiero* を繰り返さず、*Para mí* を使っています。'
  es.a1.unit06.lesson06.teach.line04:
    title: デザートを尋ねる
    gloss: 店員は了解して、デザートはいかがですかと尋ねます。
    note: '*¿Algo de postre?*(デザートは何かいかがですか？)は、デザートを勧める自然で短い言い方です。'
  es.a1.unit06.lesson06.teach.line05:
    title: デザートを分け合って注文する
    gloss: エレナは「はい」と答えて、二人でケーキを一つ頼みます。
    note: '*Para los dos*(二人で)は、一つのデザートを二人で分け合うという意味で、実際によくある選び方です。'
  es.a1.unit06.lesson06.teach.line06:
    title: 同意してお会計を頼む
    gloss: マテオは賛成して、お会計を頼みます。
    note: '*La cuenta, por favor* = お会計をお願いします。'
  es.a1.unit06.lesson06.teach.line07:
    title: お会計を渡す
    gloss: 店員が伝票を渡します。
    note: '*Aquí tiene* は、何かを手渡すときに言います。'
  es.a1.unit06.lesson06.teach.line08:
    title: 温かく締めくくる
    gloss: エレナはウェイターにお礼を言って、おいしい料理だったと伝えます。
    note: '*¡Qué buena comida!* は、*¡Qué bien!* や *¡Qué bonito!* と同じ *¡Qué ...!* の感嘆表現です。'
