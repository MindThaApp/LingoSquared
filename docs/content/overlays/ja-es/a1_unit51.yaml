teaching:
  es.a1.unit51.lesson01.teach.el_billete:
    title: 入場券
    gloss: その入場券
    note: '*El billete* は男性名詞なので、*una* ではなく *un billete* となります。'
    example_gloss: トレドまでの切符を1枚お願いしたいのですが。
  es.a1.unit51.lesson01.teach.quisiera_un_billete:
    title: 切符を頼む
    gloss: トレドまでの切符を1枚お願いしたいのですが。
    note: '*Quisiera*(「~したいのですが」)は依頼をやわらげ、*quiero* よりも丁寧な言い方です。'
  es.a1.unit51.lesson01.teach.quiere_un_billete:
    title: 窓口の人が種類をたずねる
    gloss: 片道切符になさいますか、それとも往復ですか？
    note: '*Quiere* は *querer* の *usted* に対する形で、ここでは初対面の駅員さんに対して使われています。'
  es.a1.unit51.lesson01.teach.ida_y_vuelta:
    title: 丁寧に答える
    gloss: 往復でお願いします。
    note: '*Por favor* は「お願いします」にあたる表現で、短くても丁寧な依頼になります。'
  es.a1.unit51.lesson01.teach.en_la_taquilla:
    title: 窓口での言葉づかい
    gloss: 窓口では、ふつう丁寧な形の usted を使います。
    note: サービス業の知らない人には、*tú* ではなく *usted* で話しかけます。
  es.a1.unit51.lesson02.teach.el_anden:
    title: ホーム
    gloss: ホーム
    note: '*El andén* は男性名詞です。*un andén*、*el andén* となります。'
    example_gloss: トレド行きの電車は何番線から出ますか。
  es.a1.unit51.lesson02.teach.de_que_anden:
    title: ホームをたずねる
    gloss: トレド行きの電車は何番線から出ますか。
    note: '*¿De qué andén ...?* は、漠然とした場所ではなく、ホームをはっきりたずねる表現です。'
  es.a1.unit51.lesson02.teach.el_tren_sale:
    title: 出発の情報を伝える
    gloss: 電車は10時15分前に5番ホームから出ます。
    note: '*Las diez menos cuarto* は、時刻のレッスンで学んだ「~分前」の言い方をもう一度使っています。'
  es.a1.unit51.lesson02.teach.a_que_hora:
    title: 到着時刻をたずねる
    gloss: 電車は何時に到着しますか？
    note: '*¿A qué hora llega ...?* は到着時刻をたずねる表現です。*llegar* は規則動詞で、時刻の前に *a las* を付けます。'
  es.a1.unit51.lesson02.teach.el_tren_llega:
    title: 到着時刻を伝える
    gloss: 電車は11時に到着します。
    note: '*Llega a las once* では、*llegar*(到着する)を使い、時刻の前に *a las* を付けています。'
  es.a1.unit51.lesson03.teach.a_tiempo_el:
    title: 定刻に/遅れ
    gloss: 定刻に；遅れ
    note: '*A tiempo* は、予定どおりに物事が起こることを表す決まった言い方です。*El retraso*(遅れ)は男性名詞です。'
    example_gloss:
    - 電車は定刻に出発しません。
    - お知らせします。トレド行きの電車は遅れています。
  es.a1.unit51.lesson03.teach.atencion_el_tren:
    title: アナウンス
    gloss: お知らせします。トレド行きの電車は遅れています。
    note: '*Atención* は、駅のアナウンスの冒頭に使われ、日本語の「お知らせいたします」にあたります。'
  es.a1.unit51.lesson03.teach.el_tren_no:
    title: 「定刻に」を否定する
    gloss: 電車は定刻に出発しません。
    note: '*No* は動詞の直前に置かれ、文全体を否定します。*no sale a tiempo* となります。'
  es.a1.unit51.lesson03.teach.el_tren_sale:
    title: ホームの変更
    gloss: 電車は5番ホームではなく3番ホームから出ます。
    note: '*En lugar de* は「~の代わりに、~ではなく」という意味です。'
  es.a1.unit51.lesson03.teach.el_tren_lleva:
    title: 遅れの長さを伝える
    gloss: 電車は10分遅れています。
    note: '*Lleva retraso*(直訳は「遅れを運んでいる」)は、遅れていることを言う自然な表現です。'
  es.a1.unit51.lesson04.teach.la_entrada_la:
    title: 入口、出口、待合室
    gloss: 入口；出口；待合室
    note: '*La entrada*、*la salida*、*la sala de espera* はどれも女性名詞です。'
    example_gloss:
    - 入口はどこですか？
    - 出口はどこですか？
    - 待合室はどこですか？
  es.a1.unit51.lesson04.teach.donde_esta_el:
    title: ホームの場所をたずねる
    gloss: 7番線はどこですか。
    note: 道案内のレッスンで学んだ *¿Dónde está ...?* の型をもう一度使っています。
  es.a1.unit51.lesson04.teach.todo_recto_y:
    title: 道を教える
    gloss: まっすぐ行って、それから右です。
    note: '*Todo recto* と *a la derecha* は道案内のレッスンで学んだ方向の表現で、ここでは駅で使われています。'
  es.a1.unit51.lesson04.teach.donde_esta_la:
    title: 待合室についてたずねる
    gloss: 待合室はどこですか？
    note: 同じ質問の型を、新しい場所に使っています。
  es.a1.unit51.lesson05.teach.billete_madrid_atocha:
    title: 印刷された切符を読む
    gloss: 切符：マドリード・アトーチャ発トレド行き。出発：10時10分、7番ホーム。到着：11時10分前。往復。料金：12ユーロ40。
    note: 出発時刻とホーム、到着時刻、切符の種類、料金を読み取りましょう。
    glosses:
      Billete: 入場券
      Salida: 出発
      diez: '10'
      andén: ホーム
      siete: '7'
      Llegada: 到着
      once: '11'
      vuelta: 往復切符
      Precio: 料金
      doce: '12'
      euros: ユーロ
      cuarenta: '40'
  es.a1.unit51.lesson06.teach.mateo_tenemos_que:
    title: マテオが予定を話す
    gloss: マテオ：7番ホームに行かなきゃ。電車は10時10分に出るよ。
    note: '*Tenemos que* + 不定詞(「~しなければならない」)は、実際に必要なことを表します。'
  es.a1.unit51.lesson06.teach.elena_mira_ahi:
    title: エレナが掲示を読む
    gloss: エレナ：見て、あそこに案内板があるよ。遅れ、10分だって。
    note: '*Ahí está*(「あそこにある」)で掲示を指しています。*El panel* は案内板のことです。'
  es.a1.unit51.lesson06.teach.mateo_no_hay:
    title: マテオは落ち着いている
    gloss: マテオ：問題ないよ。まだコーヒーを飲む時間はあるし。
    note: '*No hay problema* は、気軽に相手を安心させるときによく使う言い方です。'
  es.a1.unit51.lesson06.teach.elena_buena_idea:
    title: 電車が到着する
    gloss: エレナ：いいね。あ、もう電車が来てる！ちょうど7番ホームだ！
    note: '*Ya*(「もう」)は、遅れが告げられたばかりなのに、電車が思ったより早く来たことを表します。'
  es.a1.unit51.lesson06.teach.mateo_vamos_que:
    title: 電車に乗る
    gloss: マテオ：行こう、みんな乗ってるよ！トレドへ、出発！
    note: '*Suben*(「乗り込む」)は、乗車することを意味する *subir* の形です。*¡Allá vamos!* は「さあ、行くぞ」にあたる自然な言い方です。'
