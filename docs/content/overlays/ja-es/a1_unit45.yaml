teaching:
  es.a1.unit45.lesson01.teach.cuanto_cuesta_en:
    title: 合計金額をたずねる
    gloss: 合計でいくらですか？
    note: '*En total* を付けると、1つ分の値段ではなく、全部を合わせた金額をたずねていることがはっきりします。'
  es.a1.unit45.lesson01.teach.cuesta_veinticinco_euros:
    title: 合計金額を伝える
    gloss: 合計で25ユーロです。
    note: '*Cuesta* は *costar*(値段が~である)の三人称単数形です。アクセントが置かれるとき、語幹の *o* が *ue* に変わります。'
  es.a1.unit45.lesson02.teach.pagar_con_tarjeta:
    title: カードや現金で支払う
    gloss: カードで支払う、現金で支払う
    note: '*Pagar con tarjeta*(カードで支払う)と *pagar en efectivo*(現金で支払う)では前置詞が違います。道具には *con*、お金の形には *en* を使います。'
    example_gloss:
    - ここでカードで支払えますか？
    - 現金で支払います。
  es.a1.unit45.lesson02.teach.puedo_pagar_con:
    title: カードが使えるかたずねる
    gloss: ここでカードで支払えますか？
    note: '*Puedo*(私は~できる)は *poder* の *yo* の形です。*aquí*(ここ)で、今いる場所について聞いていることを表します。'
  es.a1.unit45.lesson02.teach.quiere_pagar_en:
    title: 支払い方法の希望をたずねる
    gloss: 現金とカード、どちらでお支払いですか？
    note: '*Quiere* は *querer* の丁寧な *usted* の形で、ここでは初対面のレジ係が使っています。親しい相手には *¿quieres pagar...?* と言います。'
  es.a1.unit45.lesson03.teach.la_cuenta:
    title: お会計
    gloss: そのお会計
    note: 女性名詞で、*la cuenta* といいます。レストランでは「お会計」、銀行では「口座」の意味になります。
    example_gloss: 割り勘にしましょうか？
  es.a1.unit45.lesson03.teach.dividimos_la_cuenta:
    title: 割り勘を提案する
    gloss: 割り勘にしましょうか？
    note: '*¿Dividimos...?* は *nosotros* の形を使って「~しましょうか」と提案する言い方です。日本語の「~しましょうか」に近い表現です。'
  es.a1.unit45.lesson03.teach.puedo_pagar_por:
    title: 別々に支払いたいとたずねる
    gloss: 別々に支払ってもいいですか？
    note: '*Por separado*(別々に)は支払い方を表し、*pagar*(支払う)はそのための日常的な動詞です。'
  es.a1.unit45.lesson04.teach.el_cambio:
    title: おつり
    gloss: おつり
    note: 男性名詞で、*el cambio* といいます。*un cambio de planes*(計画の変更)のように、何かの「変化」の意味もあります。
    example_gloss: こちらがおつりです。
  es.a1.unit45.lesson04.teach.aqui_tiene_su:
    title: おつりを渡す
    gloss: こちらがおつりです。
    note: '*Su* は丁寧な *usted* に対応する所有詞(「あなたの」)です。*Aquí tiene* は、何かを渡すときの一般的な丁寧な言い方です。'
  es.a1.unit45.lesson04.teach.no_necesito_cambio:
    title: おつりを断る
    gloss: おつりはいりません。
    note: '*Necesitar*(必要とする)は前置詞なしで目的語を直接取ります：*necesito cambio*。*no* は動詞を否定します。'
  es.a1.unit45.lesson05.teach.treinta_y_cinco:
    title: '35'
    gloss: '35'
    note: '*Treinta y cinco*(35)：スペイン語では31から99まで、十の位と一の位を *y* でつなぎ、別々の単語として書きます。'
    example_gloss: 35ユーロです。
  es.a1.unit45.lesson05.teach.cuenta_dos_platos:
    title: レストランのお会計を読む
    gloss: お会計：メインディッシュ2つとコーヒー2つ。合計：35ユーロ。カードで支払い済み。
    note: 注文した物、合計金額、支払い方法に注目しましょう。
    glosses:
      Cuenta: お会計
      dos: '2'
      platos: メインディッシュ
      cafés: コーヒー
      Total: 合計
      treinta: '35'
      euros: ユーロ
      Pagado: 支払い済み
      tarjeta: カード
  es.a1.unit45.lesson06.teach.elena_pedimos_la:
    title: エレナがお会計を頼む
    gloss: エレナ：お会計をお願いしましょうか？
    note: '*Pedir*(頼む、注文する)は *la cuenta* を直接目的語に取ります：*pedimos la cuenta*(お会計を頼む)。'
  es.a1.unit45.lesson06.teach.mateo_si_buena:
    title: マテオが合計をたずねる
    gloss: マテオ：うん、いいね。合計でいくらかな？
    note: lesson01 の質問 *¿cuánto cuesta en total?* をもう一度使っています。
  es.a1.unit45.lesson06.teach.elena_son_treinta:
    title: エレナが合計を伝える
    gloss: エレナ：35ユーロだよ。割り勘にする？
    note: 金額には *son* を使います。*son treinta y cinco euros* は、金額が複数なので複数形の動詞になります。
  es.a1.unit45.lesson06.teach.mateo_no_deja:
    title: マテオが払うと言い張る
    gloss: マテオ：ううん、今日は僕に払わせて。いつも助けてもらっているから。
    note: '*Deja que pague yo*(私に払わせて)は *que* の後で接続法の *pague* を使っています。今はひとまず決まった申し出の表現として覚えましょう。*Me has ayudado* は現在完了形(あなたは私を助けてくれた)です。'
  es.a1.unit45.lesson06.teach.elena_que_amable:
    title: エレナが感激する
    gloss: エレナ：なんて優しいの！ありがとう。
    note: '*¡Qué amable eres!*(なんて親切なの！)は、*qué* + 形容詞の形で、相手の気前のよい行為に温かく反応する表現です。*muchas gracias* は *gracias* より強い感謝を表します。'
  es.a1.unit45.lesson06.teach.mateo_puedo_pagar:
    title: マテオがカード払いについてたずねる
    gloss: マテオ：ここでカードで支払えますか？
    note: lesson02 の質問 *¿puedo pagar con tarjeta aquí?* を、今度は実際のレストランで使っています。
  es.a1.unit45.lesson06.teach.mateo_paga_la:
    title: Paga：三人称単数の形
    gloss: マテオがお会計を払います。
    note: '*Paga* は *pagar*(支払う)の三人称単数形です：*Mateo paga la cuenta*。'
