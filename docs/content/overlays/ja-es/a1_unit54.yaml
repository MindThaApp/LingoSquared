  es.a1.unit54.lesson02.teach.ya_conoces_todos:
    title: Veces por semana と todos los días / a menudo の違い
    gloss: todos los días(毎日)と a menudo(よく)はもう知っていますね。Dos veces por semana(週に2回)は、頻度をもっと具体的に言う新しい表現です。
