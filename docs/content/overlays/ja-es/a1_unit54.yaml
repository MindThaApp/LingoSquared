    title: エレナとルシアのスポーツの話
    gloss: エレナは週に2回ヨガをします。ゆったり体を動かすのが大好きです。ルシアはヨガはしませんが、泳ぐのが大好きです。ルシアはよく、ほぼ毎週泳ぎます。あなたはどんなスポーツをしますか?
    note: 2つの異なるスポーツと2つの頻度表現を対比していて、前の動物についての読み物と同じ構成です。
    glosses:
      hace: する
      dos: '2'
      veces: 回
      semana: 週
      yoga: ヨガ
      encanta: 大好きである
      calma: 穏やかに
      moverse: 動く
      nadar: 泳ぐこと
      nada: 泳ぐ
      menudo: よく
      casi: ほとんど
      Qué: どの
      deporte: スポーツ
