  es.a1.unit54.lesson01.teach.con_el_futbol:
    title: スポーツに使う jugar a と hacer
    gloss: サッカーのようなスポーツには jugar a、ヨガのようなスポーツには hacer を使います:juego al fútbol, hago yoga。
    note: サッカーには *jugar a*、ヨガには *hacer* を使います。ランニングと水泳にはそれぞれ専用の動詞 *correr* と *nadar* があります。
