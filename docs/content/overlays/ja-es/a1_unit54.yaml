  es.a1.unit54.lesson03.teach.ya_conoces_hacer:
    title: Hacer deporte と特定のスポーツの言い方の違い
    gloss: 趣味のレッスンで hacer deporte はもう学びましたね(Hago deporte los sábados:土曜日に運動します)。Jugar al fútbol や hacer yoga は、具体的なスポーツ名を表します:Juego al fútbol。
    note: '*Hacer deporte* は趣味のレッスンで学んだ、運動全般を表す言い方です。*jugar al fútbol* や *hacer yoga* は特定のスポーツを表します。'
