    title: 誰がどのように移動する？
    gloss: エレナは毎日電車で通勤しています。マテオはふだん自転車で行きますが、雨の日は電車にも乗ります。ディエゴは車を運転するほうが好きです。ルシアは近くに住んでいて、歩いて通勤しています。あなたはどうやって通勤していますか?
    note: 四つの通勤手段と一つの条件(雨)を対比した文章で、前のスポーツの読み物と同じ構成になっています。
