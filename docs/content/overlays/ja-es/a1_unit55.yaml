      viaja: 通勤する
      todos: 毎～
      días: 日
      tren: 電車
      Trabajo: 仕事
      bici: 自転車(va en bici =自転車で行く)
      normalmente: たいてい
      llueve: 雨が降る
      va: 乗る
      conducir: 運転する
      prefiere: 〜のほうを好む
      coche: 車
      vive: 住んでいる
      cerca: 近くに
      camina: 歩いて行く
      viajas: 行く
