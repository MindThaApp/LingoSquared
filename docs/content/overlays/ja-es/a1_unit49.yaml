teaching:
  es.a1.unit49.lesson01.teach.levantarse_me_levanto:
    title: 起きる
    gloss: 起きる → 私は起きます
    note: '*Levantarse* は再帰動詞で、代名詞 *me* が動詞の前に来ます： *Me levanto*。'
  es.a1.unit49.lesson01.teach.vestirse_me_visto:
    title: 服を着る
    gloss: 服を着る → 私は服を着ます
    note: '*Vestirse* も再帰動詞です： *Me visto*。ここでの *me* は「自分自身を」という意味です。'
  es.a1.unit49.lesson01.teach.desayunar_desayuno:
    title: 朝食をとる
    gloss: 朝食をとる → 私は朝食をとります
    note: '*Desayunar* は再帰動詞ではありません： *Desayuno*、*me* は付きません。'
  es.a1.unit49.lesson01.teach.trabajar_trabajo:
    title: 仕事
    gloss: 働く → 私は働きます
    note: '*Trabajar* は規則動詞(-ar動詞)で、*yo* の形は語尾が -o になり、*trabajo* です。'
  es.a1.unit49.lesson01.teach.comer_como:
    title: 食べる
    gloss: 食べる → 食べます
    note: '*Comer* は規則動詞(-er動詞)で、*yo* の形は語尾が -o になり、*como* です。'
  es.a1.unit49.lesson01.teach.lavar_los_platos:
    title: 皿洗いをする
    gloss: 皿を洗う → 皿を洗います
    note: '*Lavar los platos* は再帰動詞ではありません。*Lavo los platos* となり、目的語の *los platos* は動詞の後ろに置きます。'
  es.a1.unit49.lesson01.teach.dormir_duermo:
    title: 寝る
    gloss: 寝る → 寝ます
    note: '*Dormir* は *yo* の形で語幹の母音が変わり、*duermo* になります(o が ue に変わります)。'
  es.a1.unit49.lesson02.teach.con_levantarse_y:
    title: 再帰動詞のパターン
    gloss: levantarse と vestirse では、代名詞が動詞の前に来ます：levantarse → Me levanto.
    note: 再帰動詞では、活用した動詞の前に *me* を置きます。*Levanto me* ではなく *Me levanto* と言います。
  es.a1.unit49.lesson02.teach.levantarse_me_levanto:
    title: 文の中の Levantarse
    gloss: 起きる：7時に起きます。
    note: 時刻を表す表現は動詞の後ろに来ます：*Me levanto a las siete*。
  es.a1.unit49.lesson02.teach.vestirse_me_visto:
    title: 文の中の Vestirse
    gloss: 服を着る：服を着ます。
    note: 型は *me* + *visto* です。代名詞は動詞のすぐ前に置きます。
  es.a1.unit49.lesson02.teach.lavar_los_platos:
    title: 文の中の Lavar los platos
    gloss: 皿洗いをする：食べた後に皿を洗います。
    note: '*Después de comer*(「食べた後で」)は *de* + 不定詞の形で、文末に置くこともできます。'
  es.a1.unit49.lesson02.teach.sin_pronombre_desayuno:
    title: me のない動詞
    gloss: 代名詞なし：朝食を食べます。働きます。寝ます。これらの動詞は再帰動詞ではありません。
    note: '*Desayuno*、*trabajo*、*duermo* には *me* がありません。これらの動詞は再帰動詞ではないからです。'
  es.a1.unit49.lesson03.teach.me_levanto_a:
    title: 7時半に起きる
    gloss: 7時30分に起きます。
    note: スペイン語では「半」を *y media* で表します。*las siete y media* は7時30分です。時刻の前には *a las* を使います。
  es.a1.unit49.lesson03.teach.me_visto_a:
    title: 8時15分前に服を着る
    gloss: 7時45分に服を着ます。
    note: '*Las ocho menos cuarto* は次の時刻から15分戻って数えます。7時45分です。'
  es.a1.unit49.lesson03.teach.desayuno_a_las:
    title: 8時に朝食を食べる
    gloss: 8時に朝食を食べます。
    note: 時刻の前には *a las* を使います：*a las ocho*。1時は *a la una* です。
  es.a1.unit49.lesson03.teach.trabajo_de_nueve:
    title: 9時から5時まで働く
    gloss: 9時から5時まで働きます。
    note: '*De ... a ...* で開始時刻と終了時刻を表します：*de nueve a cinco*。'
  es.a1.unit49.lesson03.teach.como_a_las:
    title: 6時半に食事をする
    gloss: 午後6時30分に食事をします。
    note: '*De la tarde* で夕方・午後だとはっきり示すので、ここでは *las seis y media* は18:30です。'
  es.a1.unit49.lesson03.teach.duermo_a_las:
    title: 11時に寝る
    gloss: 11時に寝ます。
    note: 時刻の前には *a las* を使います：*a las once*。
  es.a1.unit49.lesson04.teach.primero_luego_despues:
    title: まず、次に、その後
    gloss: まず、次に、その後
    note: '*Primero* は最初の行動、*luego* は次の行動、*después* はそれに続く行動を表します。'
    example_gloss:
    - まず起きます。
    - 次に服を着ます。
    - その後、朝食を食べます。
  es.a1.unit49.lesson04.teach.primero_me_levanto:
    title: 朝の3ステップ
    gloss: まず起きます。次に服を着ます。その後、朝食を食べます。
    note: 再帰動詞は動詞の前に *me* を置いたままです：*me levanto*、*me visto*。
  es.a1.unit49.lesson04.teach.primero_luego_y:
    title: 順序を表す言葉
    gloss: Primero、luego、después は行動の順番を表します。動詞の形は変わりません：Después desayuno.
    note: 順序を表す言葉は文頭に置き、動詞の形は変わりません：*Después desayuno*。
  es.a1.unit49.lesson05.teach.mi_dia_me:
    title: 私の一日
    gloss: 私の一日 — 7時30分に起きます。その後、服を着て、8時に朝食を食べます。9時から5時まで働きます。午後6時30分に食事をします。その後、皿を洗います。11時に寝ます。
    note: 行動の順番と時刻の両方に注意して読みましょう。*me levanto* と *me visto* の *me* にも注目してください。
    glosses:
      Mi: 私の
      día: 日
      levanto: 起きる(me levanto)
      media: 半(y media =半)
      ocho: '8'
      Después: その後
      visto: 服を着る(me visto)
      las: 定冠詞(時刻の前で使う：las ocho)
      desayuno: 朝食をとる
      Trabajo: 働く
      nueve: '9'
      cinco: '5'
      siete: '7'
      tarde: 夕方に
      como: 食べる
      lavo: 皿を洗う(lavo los platos)
      once: '11'
      duermo: 眠る
  es.a1.unit49.lesson06.teach.elena_como_es:
    title: 一日について尋ねる
    gloss: エレナ：マテオ、あなたの一日はどんな感じ？
    note: '*¿Cómo es tu día?* は、相手に一日の様子を話してもらうくだけた尋ね方です。*tu* は親しい相手に使う「あなたの」です。'
  es.a1.unit49.lesson06.teach.mateo_me_levanto:
    title: マテオの朝
    gloss: マテオ：7時30分に起きます。その後、服を着て、8時に朝食を食べます。
    note: マテオは *después* と *y* で3つの朝の行動をつなげています。
  es.a1.unit49.lesson06.teach.elena_cuando_trabajas:
    title: マテオの仕事の日
    gloss: エレナ：いつ働いているの？マテオ：9時から5時まで働いています。
    note: エレナとマテオはお互いに親しい間柄の *tú* の形を使っています：*¿Cuándo trabajas?*
  es.a1.unit49.lesson06.teach.mateo_a_las:
    title: マテオの夜
    gloss: マテオ：午後6時30分に食事をします。その後、皿を洗います。11時に寝ます。
    note: '*Después* は文頭に来ますが、動詞の形は変わりません：*después lavo*。'
  es.a1.unit49.lesson06.teach.elena_me_levanto:
    title: エレナの朝
    gloss: エレナ：6時に起きますが、6時30分まで朝食は食べません。
    note: '*No ... hasta* は「〜までしない」という意味です。エレナは起きる時間と朝食の時間を対比しています。'
