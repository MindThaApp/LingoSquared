    - 私たちはレストランで食事をします。
  es.a1.unit08.lesson01.teach.biblioteca:
    title: 図書館
    gloss: 図書館
    note: '*Biblioteca* は女性名詞です。'
    example_gloss: 図書館で勉強します。
  es.a1.unit08.lesson02.teach.cerca_de:
    title: 近く
    gloss: レストランは市場の近くにあります。
    note: '*Cerca de*(〜の近く)は、基準になる場所の前に必ず *de* を置きます。'
  es.a1.unit08.lesson02.teach.lejos_de:
    title: 〜から遠く
    gloss: 公園は市場から遠いです。
    note: '*Lejos de*(〜から遠く)は *cerca de* の反対です。'
  es.a1.unit08.lesson02.teach.al_lado_de:
    title: 〜の隣
    gloss: 銀行は市場の隣にあります。
    note: '*Al lado de*(〜の隣)は決まった言い回しです(*al* = *a* + *el lado*)。*mercado* のような男性名詞の前では *de* + *el* が縮まって *del* になります:*al lado del mercado*。'
  es.a1.unit08.lesson02.teach.enfrente_de:
    title: 〜の向かい
    gloss: 薬局は市場の向かいにあります。
    note: '*Enfrente de*(〜の向かい)は、道路などをはさんで反対側にある2つの場所の関係を表します。'
  es.a1.unit08.lesson02.teach.entre:
    title: 〜の間
    gloss: 図書館は銀行と公園の間にあります。
    note: '*Entre*(〜の間)には基準点が2つ必要で、ここでは *y*(と)でつないでいます。'
  es.a1.unit08.lesson03.teach.donde_esta_el_banco:
    title: 銀行の場所をたずねる
    gloss: 銀行はどこですか。
    note: '*Dónde está*(〜はどこですか)は、場所をたずねるときの基本の言い方です。'
  es.a1.unit08.lesson03.teach.esta_al_lado_del_mercado:
    title: 場所を答える
    gloss: 市場の隣にあります。
    note: '*Del* は *de* + *el* が縮まった形で、男性名詞の *mercado* の前では必ずこの形になります。'
  es.a1.unit08.lesson03.teach.donde_esta_la_farmacia:
    title: 薬局の場所をたずねる
    gloss: 薬局はどこにありますか。
    note: 同じ質問の形を女性名詞に使った例です。性が変わっても、質問そのものは変わりません。
  es.a1.unit08.lesson03.teach.esta_enfrente_del_mercado:
    title: 答え:〜の向かい
    gloss: 市場の向かいです。
    note: '*Enfrente de* + *el mercado* は *enfrente del mercado* になります。*al lado del mercado* と同じ *del* の縮約です。'
  es.a1.unit08.lesson04.teach.esta_lejos:
    title: 遠いかどうかを尋ねる
    gloss: 遠いですか。
    note: 文脈から主語が明らかなので、主語を省いた短い追加の質問です。
  es.a1.unit08.lesson04.teach.no_esta_cerca:
    title: 答え:いいえ、近い
    gloss: いいえ、近いです。
    note: '*Cerca* だけ(*de* なし)でも短い答えになります。場所名を続ける *cerca de* の形とは違います。'
  es.a1.unit08.lesson04.teach.si_esta_lejos:
    title: 答え:はい、かなり遠い
    gloss: はい、かなり遠いです。
    note: '*Bastante*(かなり)は *lejos* を強めますが、*muy*(とても)ほど強くはありません。'
  es.a1.unit08.lesson05.teach.barrio_reading:
    title: 近所についての文章を読む
    gloss: この近所には便利な場所がたくさんあります。銀行は市場の隣にあります。薬局は市場の向かいにあります。公園は遠いですが、図書館は銀行と公園の間にあります。レストランは市場のすぐ近くです。
    note: この短い文章は、このユニットで学んだ位置を表す表現を、近所の説明の中にまとめています。
    glosses:
      barrio: 地区
      hay: 〜がある(haber の形)
      muchos: たくさんの
      lugares: 場所
      útiles: 便利な
      banco: 銀行
      está: ある・位置する(estar の形)
      lado: そば・横
      mercado: 市場
      farmacia: 薬局
      enfrente: 向かい
      parque: 公園
      lejos: 遠い
      biblioteca: 図書館
      entre: 〜の間
      restaurante: レストラン
      cerca: 近く
  es.a1.unit08.lesson05.teach.hay_note:
    title: Hay(〜がある)
    gloss: hay が単数でも複数でも変わらない理由。
    note: カードの本文をご覧ください。
    target_text: '*Hay*(〜がある・いる)は、単数でも複数でも形が変わりません。*hay un banco* も *hay muchos lugares* も同じ語を使います。'
  es.a1.unit08.lesson06.teach.line01:
    title: 銀行の場所をたずねる
    gloss: マテオがエレナに銀行はどこか尋ねます。
    note: このユニットで学んだ *¿Dónde está...?* の質問です。エレナの名前を先に呼んで注意を引いています。
  es.a1.unit08.lesson06.teach.line02:
    title: 答えて市場に触れる
    gloss: エレナは、卵を買った市場の隣だと答えます。
    note: '*Donde compramos los huevos*(卵を買った所)は、ユニット7の買い物を思い出させる表現です。'
  es.a1.unit08.lesson06.teach.line03:
    title: 薬局について尋ねる
    gloss: マテオは相づちを打ち、薬局について尋ねます。
    note: '*Ah, sí*(ああ、そうか)は、次の質問の前に入れる自然な短い相づちです。'
  es.a1.unit08.lesson06.teach.line04:
    title: 答え:〜の向かい
    gloss: エレナは、市場の向かいだと答えます。
    note: 短い答えです。質問から明らかなので、主語(*la farmacia*)は省かれています。
  es.a1.unit08.lesson06.teach.line05:
    title: 公園について尋ねる
    gloss: マテオは公園について、近いかどうか尋ねます。
    note: 一度に二つの質問をしています。くだけた会話ではよくあることです。
  es.a1.unit08.lesson06.teach.line06:
    title: 答え:遠い、そして図書館のことを話す
    gloss: エレナは、公園は遠いけれど、図書館は銀行と公園の間にあると答えます。
    note: '*Pero*(しかし)は、公園の遠さと、図書館の便利な位置を対比させています。'
  es.a1.unit08.lesson06.teach.line07:
    title: お礼を言ってレストランについて尋ねる
    gloss: マテオはエレナにお礼を言い、食事をしたレストランについて尋ねます。
    note: '*El restaurante donde comimos*(食事をしたレストラン)は、ユニット6の昼食を思い出させる表現です。'
  es.a1.unit08.lesson06.teach.line08:
    title: とても近いと確認する
    gloss: エレナは、市場のすぐ近くだと答えます。
    note: '*Muy cerca*(とても近い)の *muy*(とても)は、*bastante lejos*(かなり遠い)の *bastante*(かなり)より強い言い方です。'
