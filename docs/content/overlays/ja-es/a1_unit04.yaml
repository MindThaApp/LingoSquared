    title: 曜日
  es.a1.unit04.lesson02.los_meses_del_ano:
    title: 月の名前
  es.a1.unit04.lesson03.preguntar_y_decir_la_fecha:
    title: 日付の尋ね方と答え方
  es.a1.unit04.lesson04.el_cumpleanos:
    title: エレナとマテオの誕生日
  es.a1.unit04.lesson05.leer_el_horario_del_taller:
    title: ワークショップの予定表を読む
  es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue:
    title: エレナとマテオが次のクラスを計画する
teaching:
  es.a1.unit04.lesson01.teach.dias_entre_semana:
    title: 月曜日~金曜日
    gloss: 月曜日、火曜日、水曜日、木曜日、金曜日
    note: スペイン語の曜日名は、文頭以外では小文字で書きます。日本語には大文字・小文字の区別がないので、特に注意しましょう。
    example_gloss:
    - 料理ワークショップは毎週火曜日です。
    - 毎週木曜日にスペイン語を勉強しています。
  es.a1.unit04.lesson01.teach.fin_de_semana:
    title: 土曜日、日曜日
    gloss: 土曜日、日曜日
    note: '*sábado* と *domingo* は、複数形で -s がつく曜日です(*los sábados*、*los domingos*)。ほかの曜日は単数形と複数形が同じ形です。'
    example_gloss:
    - 土曜日には市場に行きます。
    - 日曜日には休みます。
  es.a1.unit04.lesson01.teach.hoy_es_viernes:
    title: 今日は金曜日
    gloss: 今日は金曜日です。
    note: '*Hoy*(今日)+ *es*(~です)+ 曜日名で、今日の曜日をそのまま言えます。冠詞は要りません。'
  es.a1.unit04.lesson01.teach.el_taller_es_los_martes:
    title: ワークショップは毎週火曜日
    gloss: 料理ワークショップは毎週火曜日です。
    note: 複数の冠詞 *los* をつけた *los martes* は、特定の1回の火曜日ではなく、「毎週火曜日に」という定期的な予定を表します。
  es.a1.unit04.lesson02.teach.meses_primer_semestre:
    title: 1月~6月
    gloss: 1月、2月、3月、4月、5月、6月
    note: 曜日名と同じく、スペイン語の月の名前も文頭以外では小文字で書きます。
    example_gloss:
    - 私の誕生日は3月です。
    - 6月は暑いです。
  es.a1.unit04.lesson02.teach.meses_segundo_semestre:
    title: 7月~12月
    gloss: 7月、8月、9月、10月、11月、12月
    note: '*septiembre* のように、スペイン語の月の名前の多くは、ラテン語由来で形がよく似ています。語尾の形に慣れると覚えやすくなります。'
    example_gloss:
    - 料理ワークショップは7月に始まります。
    - 12月には家族に会いに行きます。
  es.a1.unit04.lesson02.teach.mi_cumpleanos_es_en_marzo:
    title: 私の誕生日は3月
    gloss: 私の誕生日は3月です。
    note: 日付を言わず月の名前だけを言うときは、*en*(~に)を使います。
  es.a1.unit04.lesson03.teach.que_fecha_es_hoy:
    title: 今日の日付を尋ねる
    gloss: 今日は何月何日ですか。
    note: '*Qué fecha*(どの日付)は、日付を尋ねる標準的な言い方です。時刻を尋ねる *qué hora* とは別で、後のユニットで学びます。'
  es.a1.unit04.lesson03.teach.hoy_es_el_veintidos_de_julio:
    title: 日付を言う
    gloss: 今日は7月22日です。
    note: '*El veintidós de julio* は、直訳すると「7月の22」です。スペイン語は日付に、序数ではなく普通の基数を使います。'
  es.a1.unit04.lesson03.teach.formato_fecha_note:
    title: スペイン語の日付の言い方
    gloss: スペイン語で日付を言う方法です。
    note: 「基数 + de + 月名」の形です。月の1日は、*el primero* がよく使われ(特に中南米)、*el uno* も使われます(特にスペイン)。
    target_text: スペイン語の日付は「基数+de+月」で表し、日本語の「日」のような数え方ではなく、el veintidós de julio のように言います。直訳すると「7月の22」です。月の1日は、中南米を中心に *el primero*(1日目)と言う人が多く、*el uno* もよく使われ、特にスペインで一般的です。
  es.a1.unit04.lesson03.teach.cuando_es_el_taller:
    title: ワークショップがいつか尋ねる
    gloss: ワークショップはいつですか?
    note: '*Cuándo*(いつ)は時期を広く尋ねます。このレッスンのもう一つの質問 *qué fecha* は日付をはっきり尋ねます。ここではどちらも自然です。'
  es.a1.unit04.lesson03.teach.el_taller_es_el_veintidos_de_julio:
    title: ワークショップの日付を言う
    gloss: ワークショップは7月22日です。
    note: '*hoy es el veintidós de julio* と同じ日付の言い方で、主語だけが *el taller* に変わっています。'
  es.a1.unit04.lesson04.teach.cuando_es_tu_cumpleanos:
    title: 誰かの誕生日を尋ねる
    gloss: 誕生日はいつですか？
    note: '*Tu cumpleaños*(あなたの誕生日)は、友達に使う *tú* の形(くだけた言い方)です。'
  es.a1.unit04.lesson04.teach.mi_cumpleanos_es_el_diez_de_marzo:
    title: 自分の誕生日を言う
    gloss: 私の誕生日は3月10日です。
    note: 月だけを言う *en marzo*(3月に)と違い、誕生日の日付全体を言うときは *el* + 日の数字を使います。*el veintidós de julio* と同じ形です。
  es.a1.unit04.lesson04.teach.el_de_mateo_es_el_veintidos_de_agosto:
    title: 第三者の誕生日を言う
    gloss: マテオの誕生日は8月22日です。
    note: '*El cumpleaños de Mateo*(マテオの誕生日)は、所有を表す *de* を使います。*la familia de Elena* と同じ作り方です。'
  es.a1.unit04.lesson04.teach.felicidades:
    title: おめでとう!
    gloss: おめでとう!/ 誕生日おめでとう!
    note: '*¡Felicidades!* は幅広く使えるお祝いの言葉で、誕生日にも、その他のうれしい知らせにもよく使われます。'
    example_gloss: エレナ、おめでとう!今日はあなたの誕生日だね。
  es.a1.unit04.lesson05.teach.horario_reading:
    title: ワークショップの予定を読む
    gloss: 料理ワークショップは毎週火曜日です。次のクラスは7月22日です。その後、7月29日にもクラスがあります。ワークショップは8月12日に終わります。
    note: この短い予定表には、これまでに学んだ曜日名と日付の言い方が、一つのまとまった文章の中で使われています。
    glosses:
      taller: ワークショップ
      cocina: 料理
      martes: 毎週火曜日
      próxima: 次の
      clase: クラス
      veintidós: '22'
      julio: 7月
      Después: その後
      hay: ある(haber の活用形)
      veintinueve: '29'
      termina: 終わる(terminar の活用形)
      doce: '12'
      agosto: 8月
  es.a1.unit04.lesson05.teach.la_proxima_clase:
    title: 次のクラス
    gloss: 次のクラス
    note: '*Próxima*(次の)は女性名詞 *clase* に合わせた形です。男性名詞には *próximo* を使います。'
  es.a1.unit04.lesson05.teach.despues_note:
    title: Después(その後)
    gloss: '*después* が出来事を順番につなぐ働き。'
    note: '*Después* = その後、あとで。'
    target_text: '*Después*(あとで、その後)は、2つの出来事を順番につなぎます。まず1つ目、次に2つ目という流れです。'
  es.a1.unit04.lesson06.teach.line01:
    title: 次のクラスについて尋ねる
    gloss: マテオがエレナに、ワークショップの次のクラスはいつか尋ねています。
    note: '*La próxima clase del taller* = ワークショップの次のクラス。'
  es.a1.unit04.lesson06.teach.line02:
    title: 日付を答える
    gloss: エレナは、7月22日の火曜日だと答えています。
    note: エレナは日付のあとに *un martes*(火曜日)と付け加えて、クラスがワークショップのいつもの曜日である火曜日だと確認しています。
  es.a1.unit04.lesson06.teach.line03:
    title: ワークショップがいつ終わるか尋ねる
    gloss: マテオが、ワークショップはいつ終わるのか尋ねています。
    note: '*Perfecto*(完璧)は、続けて質問する前の短い自然な相づちです。'
  es.a1.unit04.lesson06.teach.line04:
    title: 終了日を答える
    gloss: エレナは、8月12日に終わると言っています。
    note: 印刷された予定表と同じ終了日です。
  es.a1.unit04.lesson06.teach.line05:
    title: 会話の途中で誕生日を尋ねる
    gloss: マテオは「ところで」と言って、エレナの誕生日はいつか尋ねています。
    note: '*Por cierto*(ところで)は、会話の途中で自然に話題を変えるときに使います。'
  es.a1.unit04.lesson06.teach.line06:
    title: 日付を答えて、同じ質問を返す
    gloss: エレナは3月10日と答え、「あなたのは?」と聞き返しています。
    note: '*¿Y el tuyo?*(あなたのは?)は所有代名詞 *tuyo* を使った新しい短い形で、すでに話に出たもの(男性名詞の *cumpleaños*。だから *tuya* ではなく *tuyo*)について質問を返すときに使います。'
  es.a1.unit04.lesson06.teach.line07:
    title: マテオの誕生日を言う
    gloss: マテオは8月22日だと言っています。
    note: mi cumpleaños es を繰り返さずに日付の形だけで答える短い完結した返事で、素早い会話では自然です。
  es.a1.unit04.lesson06.teach.line08:
    title: 反応して時期に触れる
    gloss: エレナは喜んで反応し、彼の誕生日がワークショップの終わったあとだと言っています。
    note: '*Es después del taller*(ワークショップのあとだね):8月22日は、8月12日のワークショップ終了後です。'
