  es.a1.unit02.lesson01.numbers_zero_to_ten:
    title: 0から10までの数
  es.a1.unit02.lesson02.numbers_eleven_to_hundred:
    title: 11から100まで
  es.a1.unit02.lesson03.asking_age:
    title: 年齢をたずねる
  es.a1.unit02.lesson04.phone_numbers:
    title: 電話番号
  es.a1.unit02.lesson05.recipe_quantities:
    title: レシピの分量
  es.a1.unit02.lesson06.recipe_count_dialogue:
    title: エレナとマテオと材料を数えよう
teaching:
  es.a1.unit02.lesson01.teach.cero:
    title: ゼロ
    gloss: ゼロ
    note: '*Cero* は数そのものとしても、数字を1桁ずつ読み上げるときの数字としても使います。'
  es.a1.unit02.lesson01.teach.uno:
    title: 一
    gloss: 一
    note: '*Uno* は男性単数名詞の前では *un* になり(*un huevo*:卵1個)、女性名詞の前では *una* になります(*una taza*:カップ1杯)。単独で数えるときは *uno* のままです。'
  es.a1.unit02.lesson01.teach.dos:
    title: 二
    gloss: 二
    note: '*Dos* は名詞の性にかかわらず、形が変わりません。'
  es.a1.unit02.lesson01.teach.tres:
    title: 三
    gloss: 三
    note: '*Tres* も *dos* と同じく、形が変わりません。'
  es.a1.unit02.lesson01.teach.cuatro:
    title: 四
    gloss: 四
    note: '*Cuatro* は形が変わりません。'
  es.a1.unit02.lesson01.teach.cinco:
    title: 五
    gloss: 五
    note: '*Cinco* は形が変わりません。'
  es.a1.unit02.lesson01.teach.seis:
    title: 六
    gloss: 六
    note: '*Seis* は形が変わりません。'
  es.a1.unit02.lesson01.teach.siete:
    title: 七
    gloss: 七
    note: '*Siete* は形が変わりません。'
  es.a1.unit02.lesson01.teach.ocho:
    title: 八
    gloss: 八
    note: '*Ocho* は形が変わりません。'
  es.a1.unit02.lesson01.teach.nueve:
    title: 九
    gloss: 九
    note: '*Nueve* は形が変わりません。'
  es.a1.unit02.lesson01.teach.diez:
    title: 十
    gloss: 十
    note: '*Diez* は形が変わりません。'
  es.a1.unit02.lesson02.teach.once:
    title: 十一
    gloss: 十一
    note: '*Once* から *quince*(11〜15)はそれぞれ独立した1語で、セットで覚えます。16から19は *diez* を土台に作られます(*dieciséis*、*diecisiete*…)。'
  es.a1.unit02.lesson02.teach.doce:
    title: 十二
    gloss: 十二
    note: '*Doce* は独立した1語です。*dos* に似ていますが、独自の綴りの形です。'
  es.a1.unit02.lesson02.teach.trece:
    title: 十三
    gloss: 十三
    note: '*Trece* は独立した1語です。*tres* に似ていますが、独自の綴りの形です。'
  es.a1.unit02.lesson02.teach.catorce:
    title: 十四
    gloss: 十四
    note: '*Catorce* は独立した1語です。*cuatro* に似ていますが、独自の綴りの形です。'
  es.a1.unit02.lesson02.teach.quince:
    title: 十五
    gloss: 十五
    note: '*Quince* は、16から作り方が変わる前の、1語で表す最後の数です。'
  es.a1.unit02.lesson02.teach.veinte:
    title: 二十
    gloss: 二十
    note: '*Veinte* は独立した語です。*veintiuno*(21)から29までは、十の位と一の位が1語につながって書かれます。この形は lesson03 の *veintiocho* で再び出てきます。'
  es.a1.unit02.lesson02.teach.treinta:
    title: 三十
    gloss: 三十
    note: 30以降は、十の位と一の位を *y*(と)でつなぎ、3語に分けて書きます。20台のように1語にはなりません。
  es.a1.unit02.lesson02.teach.treinta_y_cuatro:
    title: 三十四
    gloss: 三十四
    note: '*Treinta y cuatro* は、十の位、*y*、一の位の3語に分けて書きます。'
  es.a1.unit02.lesson02.teach.cien:
    title: 百
    gloss: '100'
    note: '*Cien* はちょうど100のときに単独で使う形です。100を超えて続くときは *ciento*(*ciento uno*:101)になりますが、このユニットではまだ扱いません。'
  es.a1.unit02.lesson03.teach.cuantos_anos_tienes:
    title: くだけた言い方で年齢をたずねる
    gloss: 何歳ですか。
    note: スペイン語では直訳すると「いくつの年を持っていますか」とたずね、*tener*(持つ)を使います。*ser* や *estar* は使いません。
  es.a1.unit02.lesson03.teach.tengo_veintiocho:
    title: 年齢を答える
    gloss: 28歳です。
    note: '*Tengo* は *tener* の yo の形です。完全な答えでは普通 *años*(歳)を入れますが、年齢がすでに話題になっていれば *Tengo treinta y uno* のように省けます。'
  es.a1.unit02.lesson03.teach.cuantos_anos_tiene_usted:
    title: 丁寧に年齢をたずねる
    gloss: 何歳ですか。
    note: '*Tiene* は *tener* の *usted* の形で、ユニット1 で出てきた丁寧な言い方に合わせています。'
  es.a1.unit02.lesson03.teach.tengo_treinta_y_uno:
    title: 2けたの数で年齢を答える
    gloss: 31歳です。
    note: ここでは直後に名詞が来ないので、*treinta y uno* は *un* ではなく *uno* のままです。
  es.a1.unit02.lesson03.teach.y_tu_cuantos:
    title: 年齢の質問を返す
    gloss: あなたは何歳ですか。
    note: 話題がすでに年齢だと分かっているときは、*años* を繰り返さずに *tienes* だけで言うのが自然で、よく使われる省略です。
  es.a1.unit02.lesson04.teach.cual_es_tu_numero:
    title: 電話番号をたずねる
    gloss: 電話番号は何番ですか。
    note: 電話番号のように、いくつかの選択肢の中から特定の1つを尋ねたり答えたりするときは、*qué* ではなく *cuál* を使うのが自然です。
  es.a1.unit02.lesson04.teach.numero_elena:
    title: 1桁ずつ読む数字
    gloss: 6、1、5、0、2、9、7、3
    note: 電話番号は、ここのように1桁ずつ読むことができます。スペイン語では2桁ずつ区切って読む人も多いので、どちらの読み方も聞き取れるようにしましょう。
  es.a1.unit02.lesson04.teach.es_el:
    title: 番号を切り出す
    gloss: ~です
    note: '*número* は男性名詞なので、男性形の定冠詞 *el* を使います。'
  es.a1.unit02.lesson04.teach.puedes_repetir:
    title: 繰り返しをお願いする
    gloss: もう一度言っていただけますか?
    note: '*Puedes* は *poder*(~できる)の *tú* に対する形です。相手が数字を早口で言って聞き取れなかったときに役立ちます。'
  es.a1.unit02.lesson04.teach.claro:
    title: 快く承諾する
    gloss: もちろん;いいですよ
    note: '*Claro* は、頼まれごとに親しみを込めて応じるときによく使う表現です。'
  es.a1.unit02.lesson05.teach.necesito_tres_huevos:
    title: 必要な数量を伝える
    gloss: 卵が3個必要です。
    note: '*Necesito* は *necesitar*(必要とする)の yo の形です。*huevos*(卵)は、2以上の数のあとでは常に複数形のままです。'
  es.a1.unit02.lesson05.teach.cuantos_huevos_necesitas:
    title: 必要な数を尋ねる
    gloss: 卵はいくつ必要ですか?
    note: '*Cuántos* は、尋ねる名詞の性と数に一致します。*huevos* は男性複数なので、*cuántas* ではなく *cuántos* を使います。'
  es.a1.unit02.lesson05.teach.dos_tazas_harina:
    title: 計量した分量を伝える
    gloss: 小麦粉2カップ
    note: '*de* は、計量の単位(*tazas*、カップ)と量る対象(*harina*、小麦粉)をつなぎます。日本語の「の」にあたる働きです。'
  es.a1.unit02.lesson05.teach.media_taza:
    title: 半分の量を伝える
    gloss: 砂糖半カップ
    note: '*Media* は女性名詞 *taza* に合わせた形です。男性名詞には男性形の *medio* を使います。'
  es.a1.unit02.lesson05.teach.tengo_cuatro_huevos:
    title: 手元にあるものを伝える
    gloss: テーブルの上に卵が4個あります。
    note: '*Tengo*(持っている)はすでにあるものを表し、まだ足りないものを表す *necesito*(必要だ)とは区別されます。'
  es.a1.unit02.lesson06.teach.line01:
    title: 卵の数を尋ねる
    gloss: エレナがマテオに、レシピに卵がいくつ必要か尋ねます。
    note: ユニット1に続き、同年代の2人は *tú* で話します。
  es.a1.unit02.lesson06.teach.line02:
    title: 材料を伝える
    gloss: マテオは、卵が3個と小麦粉が2カップ必要だと言います。
    note: '*Necesito* は、レシピのためにまだ必要なものを表します。'
  es.a1.unit02.lesson06.teach.line03:
    title: 手元にあるものを伝える
    gloss: エレナは、テーブルの上に卵が4個あると言い、砂糖も必要か尋ねます。
    note: '*Tengo* は、エレナがすでに持っているものを表し、マテオが必要だと言ったものとは別です。'
  es.a1.unit02.lesson06.teach.line04:
    title: 少量だと答える
    gloss: マテオは、はい、少しだけ、半カップくらいと答えます。
    note: ここでの *Como* は、よく使われる「~のように」という意味ではなく、「約」「だいたい」という意味です。
  es.a1.unit02.lesson06.teach.line05:
    title: 電話番号をたずねる
    gloss: エレナは「完璧」と言い、次の授業の連絡をするためにマテオの電話番号を尋ねます。
    note: '*Así te escribo*(「連絡できるように」)は、尋ねる理由を説明しています。連絡先を聞く前にこう添えるのは、会話での自然な習慣です。'
  es.a1.unit02.lesson06.teach.line06:
    title: 電話番号を伝える
    gloss: マテオは自分の番号を1桁ずつ読みます。
    note: '*Es el* は番号を切り出す表現で、男性名詞 *número* に合わせています。'
  es.a1.unit02.lesson06.teach.line07:
    title: お礼を言って年齢を尋ねる
    gloss: エレナはお礼を言い、もう1つ、何歳か尋ねます。
    note: '*Una pregunta más*(「もう1つ質問です」)は、同じ会話の中で話題を自然に変える合図です。'
  es.a1.unit02.lesson06.teach.line08:
    title: 年齢を答える
    gloss: マテオは28歳だと答え、エレナにも同じ質問を返します。
    note: '*Tengo veintiocho años* では、20番台の1語につながった形が使われています。'
  es.a1.unit02.lesson06.teach.line09:
    title: 彼女の年齢を答える
    gloss: エレナは31歳だと答えます。
    note: '*Tengo treinta y uno* では、年齢の話だと文脈から分かっているので *años* を省略しています。質問を返すときにも *años* を繰り返さないのと同じで、話題が決まったあとの自然な短縮です。'
