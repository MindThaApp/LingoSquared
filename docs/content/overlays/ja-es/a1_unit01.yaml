answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: スペイン語 A1
  description: 国や地域を問わず通じる、あいさつ・自己紹介・初対面で使える実用的な雑談を学びます。スペイン語の丁寧さの使い分け、性・数の一致、主語の省略、動詞の形に注目して学べます。
units:
  es.a1.unit01.greetings:
    title: あいさつと初対面
lessons:
  es.a1.unit01.lesson01.tu_and_usted:
    title: tú と usted の使い分け
  es.a1.unit01.lesson02.greetings_by_time:
    title: 一日のあいさつと別れのあいさつ
  es.a1.unit01.lesson03.names_and_introductions:
    title: 名前と自己紹介
  es.a1.unit01.lesson04.origin_and_language:
    title: 出身・居住地・言語
  es.a1.unit01.lesson05.shared_activity_small_talk:
    title: 同じ活動の場での雑談
  es.a1.unit01.lesson06.cooking_workshop_dialogue:
    title: 料理教室での初対面
teaching:
  es.a1.unit01.lesson01.teach.usted:
    title: 敬意を表す「あなた」
    gloss: あなた(丁寧・敬意を込めた言い方)
    note: 日本語では相手との関係に応じて「あなた」「きみ」や名前、敬語などを使い分けますが、スペイン語では「あなた」にあたる代名詞そのものを使い分けます。usted は初対面の大人や、敬意を表したい相手に使えます。「あなた」の意味ですが、動詞の形は él や ella と同じです。
  es.a1.unit01.lesson01.teach.tu:
    title: 親しい「きみ・あなた」
    gloss: きみ・あなた(親しい相手一人に)
    note: tú は、友人や同年代の人、子どもなど、親しい間柄の相手に使います。アクセントのある tú は代名詞で、アクセントのない tu は「あなたの」を表す所有詞です。区別しましょう。
  es.a1.unit01.lesson01.teach.como_esta_usted:
    title: 丁寧な体調のたずね方
    gloss: お元気ですか。
    note: está は estar の usted に対する形です。ここでは相手の今の状態を表すため estar を使います。cómo は疑問詞なので、アクセント記号がつきます。
  es.a1.unit01.lesson01.teach.como_estas:
    title: 親しい相手への体調のたずね方
    gloss: お元気ですか。
    note: estás は estar の tú に対する形です。日本語では「お元気ですか」「元気?」のように文体で丁寧さを変えますが、スペイン語では動詞の形そのものが está から estás に変わり、話しかける相手に合わせます。
  es.a1.unit01.lesson01.teach.bien_gracias:
    title: 簡潔な返事
    gloss: 元気です、ありがとう。
    note: 日本語でも主語を言わないことが多いように、スペイン語も主語や動詞をくり返さず、bien だけで答えられます。
  es.a1.unit01.lesson01.teach.muy_bien:
    title: 前向きな返事
    gloss: とても元気です、ありがとう。
    note: muy は bien を強める語で、形は変わりません。
  es.a1.unit01.lesson01.teach.and_usted:
    title: 丁寧に聞き返す
    gloss: あなたは?
    note: 敬意をもって話している相手に聞き返すときも、usted のままにします。
  es.a1.unit01.lesson01.teach.and_tu:
    title: 親しい相手に聞き返す
    gloss: あなたは?
    note: くだけたやりとりでは tú を使います。アクセントのない tu は「あなたの」の意味なので、アクセントを忘れないようにしましょう。
  es.a1.unit01.lesson02.teach.hola:
    title: どんな場面でも使えるあいさつ
    gloss: こんにちは;やあ
    note: Hola は一日のどの時間帯でも、丁寧な場面でも親しい場面でも使えます。
  es.a1.unit01.lesson02.teach.buenos_dias:
    title: 朝のあいさつ
    gloss: おはようございます
    note: スペイン語の名詞には文法上の性があります。días は男性複数形なので、形容詞も buenos になります。
  es.a1.unit01.lesson02.teach.buenas_tardes:
    title: 午後のあいさつ
    gloss: こんにちは(午後)
    note: tardes は女性複数形なので、buenas になります。buenos から buenas への変化は文法上の一致であり、丁寧さの違いではありません。
  es.a1.unit01.lesson02.teach.buenas_noches:
    title: 夕方や夜のあいさつ
    gloss: こんばんは;おやすみなさい
    note: noches は女性複数形なので buenas がつきます。夜に会ったときのあいさつにも、寝る前の別れのあいさつにも使えます。
  es.a1.unit01.lesson02.teach.adios:
    title: はっきりした別れのあいさつ
    gloss: さようなら
    note: Adiós は中立的な表現ですが、「また後で」のような表現に比べると、最後の別れのように聞こえることがあります。
  es.a1.unit01.lesson02.teach.hasta_luego:
    title: また後で
    gloss: またあとで
    note: Hasta luego は決まった別れのあいさつで、一語ずつ直訳して考える必要はありません。
  es.a1.unit01.lesson02.teach.nos_vemos:
    title: 親しい別れのあいさつ
    gloss: じゃあね;また会おう
    note: nos vemos を直訳すると「私たちは互いに会う」に近い意味です。
  es.a1.unit01.lesson02.teach.good_day:
    title: 丁寧な別れの願いの言葉
    gloss: 良い一日をお過ごしください。
    note: tenga は、この丁寧な言い方で使われる usted の形です。buen は、día の前で bueno が短くなった男性単数形です。
  es.a1.unit01.lesson03.teach.formal_name_question:
    title: 丁寧に名前をたずねる
    gloss: お名前は何ですか。
    note: スペイン語では、おおよそ「あなたは自分を何と呼びますか」という言い方をします。se は usted に対する形 llama と組み合わさります。日本語は「お名前は」「名前は?」のように文体で丁寧さを変えますが、スペイン語では動詞の形が変わります。
  es.a1.unit01.lesson03.teach.my_name_lucia:
    title: 自分の名前を言う
    gloss: 私の名前はルシアです。
    note: Me llamo は直訳すると「私は自分を~と呼ぶ」です。動詞の語尾で話し手がわかるので、日本語と同じように、スペイン語でもふつうは yo を言いません。
  es.a1.unit01.lesson03.teach.informal_name_question:
    title: 親しい相手に名前をたずねる
    gloss: お名前は何ですか。
    note: te は親しい tú に対応し、llamas には tú の語尾 -as がついています。丁寧な se llama と親しい te llamas を比べてみましょう。
  es.a1.unit01.lesson03.teach.i_am_diego:
    title: ser を使った自己紹介
    gloss: 私はディエゴです。
    note: soy は ser の一人称単数形です。ser は「~である」という身元や属性を表すときに使います。スペイン語では、状態や場所を表す estar と使い分けます。
  es.a1.unit01.lesson03.teach.mucho_gusto:
    title: 会えてうれしいという気持ち
    gloss: はじめまして。
    note: Mucho gusto は広く通じる決まり文句です。encantado や encantada のような形容詞と違って、話し手の性別によって形は変わりません。
  es.a1.unit01.lesson03.teach.igualmente:
    title: 同じ気持ちを返す
    gloss: こちらこそ。
    note: Igualmente は、Mucho gusto に対する簡潔な返事です。
  es.a1.unit01.lesson03.teach.este_carlos:
    title: 男性を紹介する
    gloss: こちらはカルロスです。
    note: 日本語の「こちら」には文法上の性がありませんが、スペイン語では指し示す人や物が文法上の男性なら este を使います。
  es.a1.unit01.lesson03.teach.esta_ana:
    title: 女性を紹介する
    gloss: こちらはアナです。
    note: 女性を指すときは esta を使います。ここでの esta にアクセントはありません。アクセントのある está は estar の形で、「いる・ある」などを表します。
  es.a1.unit01.lesson04.teach.formal_origin_question:
    title: 丁寧に出身をたずねる
    gloss: どちらのご出身ですか。
    note: es は ser の usted に対する形です。出身を言うときは estar ではなく ser を使います。dónde は直接疑問文ではアクセント記号がつきます。
  es.a1.unit01.lesson04.teach.from_mexico:
    title: 出身を伝える
    gloss: 私はメキシコの出身です。
    note: soy は ser の yo に対する形です。soy だけで話し手がわかるので、主語の yo は不要です。
  es.a1.unit01.lesson04.teach.informal_origin_question:
    title: 親しい相手に出身をたずねる
    gloss: どちらのご出身ですか。
    note: eres は ser の tú に対する形です。丁寧な es usted と親しい eres を比べてみましょう。日本語で「ご出身は」「出身は?」と文体を変えるように、スペイン語では動詞の形が変わります。
  es.a1.unit01.lesson04.teach.from_colombia:
    title: もう一つの出身の言い方
    gloss: 私はコロンビアの出身です。
    note: 出身を言うときは、soy de のあとに場所を続けます。
  es.a1.unit01.lesson04.teach.live_london:
    title: 住んでいる場所を言う
    gloss: 私はロンドンに住んでいます。
    note: vivo は vivir の yo に対する形です。語尾の -o で話し手がわかるので、yo は不要です。
  es.a1.unit01.lesson04.teach.speak_spanish:
    title: 丁寧にスペイン語を話すかたずねる
    gloss: スペイン語を話しますか。
    note: スペイン語の「はい・いいえ」で答える疑問文は、語順を変えたり特別な語を足したりせず、文末の「か」にあたる語もありません。habla は usted に対する形で、イントネーションと疑問符で疑問文だとわかります。
  es.a1.unit01.lesson04.teach.yes_a_little:
    title: 限られた能力
    gloss: はい、少しだけ。
    note: アクセントのある sí は「はい」の意味です。アクセントのない si は「もし」の意味ですが、ここでは A1 の入力ではアクセントなしの綴りも許容されます。
  es.a1.unit01.lesson04.teach.still_learning:
    title: 進行中の状況を説明する
    gloss: まだ勉強中です。
    note: estoy は estar の yo に対する形です。ここでは estar が進行中の動作を表します。一方、Soy de Colombia の soy は出身や身元を表します。スペイン語では、この二つを ser と estar で使い分けます。
  es.a1.unit01.lesson05.teach.formal_first_time:
    title: 丁寧に初めての訪問かたずねる
    gloss: ここは初めてですか。
    note: su は、usted で呼びかける相手に対する「あなたの」です。日本語の「あなたの」「きみの」は、人称代名詞を選ぶ必要があります。スペイン語は su と tu で、丁寧か親しいかの区別が保たれます。
  es.a1.unit01.lesson05.teach.informal_first_time:
    title: 親しい相手に初めての訪問かたずねる
    gloss: ここは初めてですか。
    note: アクセントのない tu は、親しい相手に対する所有詞「きみの」です。アクセントのある代名詞 tú と比べてみましょう。
  es.a1.unit01.lesson05.teach.first_time_answer:
    title: 初めての訪問だと答える
    gloss: はい、初めてです。
    note: primera は vez に合わせて女性形になっています。スペイン語の形容詞は、名詞の性に合わせて形が変わります。
  es.a1.unit01.lesson05.teach.cooking_workshop:
    title: 行き先を伝える
    gloss: 料理教室に来ました。
    note: vengo は venir の yo に対する形で、「来る」「来ている」という意味です。al は a と el が必ず縮まった形です。
  es.a1.unit01.lesson05.teach.me_too:
    title: 同じ状況を共有する
    gloss: 私もです。
    note: Yo también は、相手の話が自分にも当てはまるときに使える便利な表現です。
  es.a1.unit01.lesson05.teach.like_cooking:
    title: 興味についてたずねる
    gloss: 料理は好き?
    note: gustar は、日本語の「~が好き」とは語順の組み立てが違います。te は好きだと感じる人を表し、cocinar は気に入られる対象です。活動は単数として扱われるので、動詞は gusta のままです。
  es.a1.unit01.lesson05.teach.yes_very_much:
    title: 強い関心を示す
    gloss: はい、とても好きです。
    note: Mucho は程度をたずねる質問に答える語で、ここでは形が変わりません。
  es.a1.unit01.lesson05.teach.thats_good:
    title: 前向きな反応
    gloss: それはいいですね。
    note: この感嘆表現では Qué にアクセント記号が付きます。質問ではなく、前向きな反応を表します。
  es.a1.unit01.lesson06.teach.line01:
    title: 出会いのきっかけ
    gloss: Elena が Mateo にあいさつして、ここに来るのは初めてかどうかをたずねます。
    note: 同じ活動に参加する対等な立場なので、二人とも親しい間柄で使う tú の形を使っています。
  es.a1.unit01.lesson06.teach.line02:
    title: 出会いのきっかけ(返事)
    gloss: Mateo は、初めてであること、料理ワークショップに来たことを答えます。
    note: Vengo al taller は、ここに来た理由を現在形で述べています。
  es.a1.unit01.lesson06.teach.line03:
    title: 名前を言い合う
    gloss: Elena も初めてだと言い、自分の名前を伝えて、Mateo の名前をたずねます。
    note: Me llamo は名前を言う自然な言い方です。日本語と同じように、スペイン語でも動詞の形で誰のことか分かるので、ふつう yo は省略します。
  es.a1.unit01.lesson06.teach.line04:
    title: 名前を言い合う(返事)
    gloss: Mateo は自分の名前を言って、会えてうれしいと伝えます。
    note: Soy も名前を言う自然な言い方で、再帰動詞の llamarse ではなく ser を使います。
  es.a1.unit01.lesson06.teach.line05:
    title: 出身をたずねる
    gloss: Elena は「こちらこそ」と返して、Mateo の出身をたずねます。
    note: De dónde eres は、親しい間柄で使う tú の形で出身をたずねています。
  es.a1.unit01.lesson06.teach.line06:
    title: 出身をたずねる(返事)
    gloss: Mateo はコロンビア出身で、今はロンドンに住んでいると答え、Elena にも同じ質問をします。
    note: Soy de は出身を、vivo en は今住んでいる場所を表します。Pero がその二つの事実を対比してつないでいます。
  es.a1.unit01.lesson06.teach.line07:
    title: 興味について話す
    gloss: Elena はスペイン出身だと言い、Mateo に料理が好きかどうかをたずねます。
    note: Soy は出身を表します。Mateo が今使ったのと同じ型です。
  es.a1.unit01.lesson06.teach.line08:
    title: 興味について話す(返事)
    gloss: Mateo は料理がとても好きだが、まだ勉強中だと答えます。
    note: Estoy aprendiendo は、今まさに進行中の活動を表します。スペイン語では estar と動詞の現在分詞を組み合わせて作ります。
  es.a1.unit01.lesson06.teach.line09:
    title: 会話を終える
    gloss: Elena も自分も勉強中だと言い、あとで中で会いましょうと伝えます。
    note: Nos vemos は、このあとまた会うことを表し、dentro が場所を示します。
  es.a1.unit01.lesson06.teach.line10:
    title: 会話を終える(返事)
    gloss: Mateo は同意して、また会いましょうと確認します。
    note: Sí は Elena の提案に同意する返事で、そのあと nos vemos を繰り返しています。
exercises:
  es.a1.unit01.lesson01.exercise01.select_formal_pronoun:
    instruction: 「あなた」を表す形のうち、敬意のある改まった言い方はどれですか。
    correct_option: usted
    distractors:
    - tú
    - tu
    accepted_answers:
    - usted
    feedback: Usted は敬意を表す単数の形で、動詞は三人称の形を使います。
  es.a1.unit01.lesson01.exercise02.select_informal_pronoun:
    instruction: 友達や同じ立場の一人に、くだけた言い方で話しかけるときの形はどれですか。
    correct_option: tú
    distractors:
    - usted
    - tu
    accepted_answers:
    - tú
    feedback: 代名詞はアクセント記号を付けて tú と書きます。アクセントのない tu は「あなたの」という意味です。
  es.a1.unit01.lesson01.exercise03.listen_formal_question:
    instruction: 音声を聞いて、聞こえた文を選んでください。
    correct_option: ¿Cómo está usted?
    distractors:
    - ¿Cómo estás?
    - ¿Y usted?
    accepted_answers:
    - ¿Cómo está usted?
    - Como esta usted
  es.a1.unit01.lesson01.exercise04.listen_informal_question:
    instruction: 聞こえた親しい言い方の質問を入力しましょう。
    accepted_answers:
    - ¿Cómo estás?
    - Cómo estás
    - Como estas
  es.a1.unit01.lesson01.exercise05.order_formal_question:
    instruction: 丁寧な質問を正しい順序に並べましょう。
    correct_response:
    - Cómo
    - está
    - usted
  es.a1.unit01.lesson01.exercise06_choose_formal_return:
    instruction: 敬意のある言い方を保った聞き返しの質問を選びましょう。
    correct_option: ¿Y usted?
    distractors:
    - ¿Y tú?
    - ¿Cómo estás?
    accepted_answers:
    - ¿Y usted?
    - Y usted
  es.a1.unit01.lesson01.exercise07_choose_informal_return:
    instruction: 友達や同じ立場の相手への聞き返しの質問を選びましょう。
    correct_option: ¿Y tú?
    distractors:
    - ¿Y usted?
    - ¿Cómo está usted?
    accepted_answers:
    - ¿Y tú?
    - Y tú
    - Y tu
  es.a1.unit01.lesson01.exercise08.check_informal_agreement:
    instruction: 親しい言い方の質問を正しく直しましょう。
    accepted_answers:
    - ¿Cómo estás?
    - Cómo estás
    - Como estas
    - ¿Cómo estás tú?
    - Como estas tu
    feedback: tú には estás を使います。está は usted と一緒に使います。
  es.a1.unit01.lesson01.exercise09.reply_formally:
    instruction: 質問に丁寧に答えましょう。
    accepted_answers:
    - Bien, gracias.
    - Bien, gracias
    - Muy bien, gracias.
    - Muy bien, gracias
    - Bien, gracias. ¿Y usted?
    - Muy bien, gracias. ¿Y usted?
  es.a1.unit01.lesson01.exercise10.speak_informally:
    instruction: くだけた言い方で答え、お礼を言って、相手に同じ質問を返しましょう。
    accepted_answers:
    - Muy bien, gracias. ¿Y tú?
    - Muy bien, gracias. Y tú?
    - Muy bien, gracias. Y tu?
    - Muy bien, gracias, ¿y tú?
    - Bien, gracias. ¿Y tú?
    - Bien, gracias. Y tu?
    - Bien, gracias, ¿y tú?
  es.a1.unit01.lesson02.exercise01.listen_hola:
    instruction: 聞いて、あいさつの言葉を選びましょう。
    correct_option: Hola
    distractors:
    - Adiós
    - Hasta luego
    accepted_answers:
