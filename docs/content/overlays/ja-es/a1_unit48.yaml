teaching:
  es.a1.unit48.lesson01.teach.leer_hacer_deporte:
    title: 読書、運動、料理
    gloss: 読む、運動する／スポーツをする、料理する
    note: よく使う3つの趣味の動詞：*leer*（読む）、*hacer deporte*（運動する、スポーツをする）、*cocinar*（料理する）。
    example_gloss:
    - 私は本を読むのが好きです。
    - 私は土曜日に運動します。
    - 私は友達のために料理するのが好きです。
  es.a1.unit48.lesson01.teach.el_tiempo_libre:
    title: 自由時間
    gloss: 空いている時間
    note: '*El tiempo libre* は男性名詞の句で、趣味について話すときのキーフレーズです。'
    example_gloss: 私は自由時間に読書をするのが好きです。
  es.a1.unit48.lesson01.teach.en_mi_tiempo:
    title: 自由時間にすることを伝える
    gloss: 私は自由時間に読書をするのが好きです。
    note: '*Me gusta leer*（私は読むのが好きです）は *gustar* + 不定詞の形です。どんな活動でも *me gusta* の形は変わりません。'
  es.a1.unit48.lesson02.teach.escuchar_musica_dibujar:
    title: 音楽、絵、ゲーム
    gloss: 音楽を聴く、絵を描く、ゲームをする
    note: 趣味の動詞がさらに3つ：*escuchar música*（音楽を聞く）、*dibujar*（絵を描く）、*jugar videojuegos*（ビデオゲームをする）。
    example_gloss:
    - 私は音楽を聴くのが好きです。
    - 私はよく絵を描きます。
    - 私は友達とゲームをするのが好きです。
  es.a1.unit48.lesson02.teach.me_gusta_escuchar:
    title: 音楽を聴くのが好きだと伝える
    gloss: 私は音楽を聴くのが好きです。
    note: '*Escuchar* は前置詞を付けず、目的語をそのまま続けます：*escuchar música*。'
  es.a1.unit48.lesson02.teach.me_gusta_jugar:
    title: 友達とゲームをするのが好きだと伝える
    gloss: 私は友達とゲームをするのが好きです。
    note: '*Con amigos*（友達と）は、これまでのレッスンで出てきた前置詞 *con* をもう一度使っています。'
  es.a1.unit48.lesson03.teach.siempre_a_menudo:
    title: いつも、よく、ときどき、決して～ない
    gloss: いつも、よく、ときどき、決して～ない
    note: 頻度を表す基本の4つの副詞：*siempre*（いつも）、*a menudo*（よく）、*a veces*（時々）、*nunca*（決して〜ない）。たいてい動詞の前か文頭に置きます。
    example_gloss:
    - 私は毎週土曜日に運動します。
    - 私はよく本を読みます。
    - 私はときどき絵を描きます。
    - 私はゲームをまったくしません。
  es.a1.unit48.lesson03.teach.cada_semana_cada:
    title: 毎週、毎週末
    gloss: 毎週、毎週末
    note: '*Cada semana* も *cada fin de semana* も「毎〜」の意味です。*cada* は形が変わりません。'
    example_gloss:
    - 私は毎週、友達のために料理をします。
    - 私は毎週末、運動します。
  es.a1.unit48.lesson03.teach.con_palabras_femeninas:
    title: Cada は形が変わらない
    gloss: Cada は形が変わりません：cada semana、cada fin de semana。
    note: '*Cada* は形が変わりません。女性名詞（*semana*）の前でも男性名詞（*fin de semana*）の前でも同じです。'
  es.a1.unit48.lesson03.teach.que_haces_en:
    title: 余暇の過ごし方を尋ねる
    gloss: 自由時間には何をしますか？
    note: これはこのユニットの中心となる質問です。相手の趣味を尋ねるときに使ってみましょう。
  es.a1.unit48.lesson04.teach.elena_a_menudo:
    title: エレナが趣味の話を切り出す
    gloss: エレナ：私たちはよく一緒に散歩しますよね。でもマテオ、自由な時間にほかに何をしていますか？
    note: '*A menudo paseamos juntos*（私たちはよく一緒に散歩します）：*paseamos* は *pasear* の *nosotros* の形です。'
  es.a1.unit48.lesson04.teach.mateo_me_gusta:
    title: マテオの趣味
    gloss: マテオ：料理が好きです。家でもします。それに、よく運動します。
    note: '*También en casa*（家でも）は、マテオが仕事だけでなく楽しみとしても料理していることを示しています。'
  es.a1.unit48.lesson04.teach.elena_cocinas_tambien:
    title: エレナが驚く
    gloss: エレナ：家でも料理するんですか？ 仕事でもう一日中料理しているのに！
    note: '*Todo el día*（一日中）は、マテオが職場ですでにたくさん料理していることを強調しています。'
  es.a1.unit48.lesson04.teach.mateo_si_pero:
    title: マテオが説明する
    gloss: マテオ：はい、でも料理は気持ちが落ち着くんです。あなたは何をするのが好きですか？
    note: '*Cocinar me parece relajante* は直訳すると「料理は私にはリラックスできるように思える」です。*me parece* + 形容詞は、意見を言うときの自然な言い方です。'
  es.a1.unit48.lesson04.teach.elena_me_gusta:
    title: エレナの趣味
    gloss: エレナ：読書が好きで、よく音楽を聞きます。
    note: これまでのレッスンに出てきた2つの趣味の動詞を、*y*（と）で1つの文にまとめています。
  es.a1.unit48.lesson04.teach.mateo_tu_tambien:
    title: マテオがゲームについて尋ねる
    gloss: マテオ：あなたもゲームをしますか？
    note: レッスン2の *jugar videojuegos* を使った、はい・いいえで答える短い質問です。*tú también*（あなたも）では、親しい相手に使う *tú* を使います。
  es.a1.unit48.lesson04.teach.elena_no_nunca:
    title: エレナが答える
    gloss: エレナ：いいえ、ゲームは全然しません。でも時々絵を描きます！
    note: レッスン3の *nunca*（決して〜ない）と *a veces*（時々）を、1つの答えの中で対比させています。
  es.a1.unit48.lesson05.teach.mateo_y_yo:
    title: 趣味を比べる
    gloss: マテオと私はよく一緒に散歩します。でも、ほかにも趣味があります。マテオは料理が好きで、家でもしますし、よく運動もします。私は読書が好きで、よく音楽を聞きます。時々絵を描きますが、ゲームは全然しません。あなたは自由な時間に何をするのが好きですか？
    note: エレナのメッセージはレッスン4の内容をまとめ、最後に読み手へこのユニットの中心となる質問を投げかけています。
    glosses:
      paseamos: 散歩する
      menudo: よく
      juntos: 一緒に
      otras: ほかの
      cocinar: 料理する
      gusta: ～するのが好き
      casa: 家で
      deporte: 運動する
      leer: 読む
      escucho: 聴く
      música: 音楽
      dibujo: 絵を描く
      veces: 時々
      videojuegos: ビデオゲームをする
      nunca: 決して〜ない
      libre: 自由な
      tiempo: 時間
  es.a1.unit48.lesson06.teach.mateo_que_haces:
    title: マテオが週末の予定を尋ねる
    gloss: マテオ：今週末は何をしますか？
    note: '*Este fin de semana*（今週末）では、男性名詞 *fin de semana* に *este* を使います。'
  es.a1.unit48.lesson06.teach.elena_todavia_no:
    title: エレナはまだ決めていない
    gloss: エレナ：まだわかりません。読書が好きですが、出かけたい気持ちもあります。
    note: '*Quiero salir*（出かけたい）は、外出したいときによく使う言い方です。'
  es.a1.unit48.lesson06.teach.mateo_paseamos_juntos:
    title: マテオが計画を提案する
    gloss: マテオ：一緒に散歩しませんか？ そのあと、二人分の料理を作りますよ。
    note: '*Después*（そのあと）は順序を表す言葉です：*primero*、*luego*、*después*。'
  es.a1.unit48.lesson06.teach.elena_buena_idea:
    title: エレナが賛成する
    gloss: エレナ：いい考えですね！ 散歩も料理も、どちらも好きです。
    note: '*Las dos cosas*（両方とも）は、エレナがどちらか一方ではなく、2つとも同じくらい好きだということを表しています。'
  es.a1.unit48.lesson06.teach.mateo_perfecto_entonces:
    title: マテオが約束を確認する
    gloss: マテオ：完璧です！ では、土曜日に会いましょう！
    note: 予定を確認する親しみのこもった締めくくりの一言です。*el sábado*（土曜日）のように、スペイン語では特定の曜日の前に *el* を付けます。
