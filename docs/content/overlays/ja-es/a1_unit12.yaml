  es.a1.unit12.lesson05.leer_la_reflexion:
    title: 授業をふりかえって
  es.a1.unit12.lesson06.el_pastel_se_quema_dialogue:
    title: ケーキが焦げそう
teaching:
  es.a1.unit12.lesson01.teach.nervioso:
    title: 緊張している
    gloss: 緊張している
    note: '*Nervioso*(男性)/ *nerviosa*(女性)-- 標準的な -o/-a 型の形容詞のペアです。'
    example_gloss:
    - マテオは緊張しています。
    - エレナは緊張しています。
  es.a1.unit12.lesson01.teach.contento:
    title: うれしい
    gloss: うれしい/満足している
    note: '*Contento/contenta* は、うれしい、満足しているという気持ちを表し、恒久的な特徴ではありません。'
    example_gloss:
    - マテオはうれしいです。
    - エレナはうれしいです。
  es.a1.unit12.lesson01.teach.cansado:
    title: 疲れた
    gloss: 疲れた
    note: '*Cansado/cansada* は、*cansar*(疲れさせる)からできた形です。'
    example_gloss:
    - ワークショップのあと、私は疲れています。(男性)
    - ワークショップのあと、私は疲れています。(女性)
  es.a1.unit12.lesson01.teach.preocupado:
    title: 心配している
    gloss: 心配している
    note: '*Preocupado/preocupada* は、*preocupar*(心配させる)からできた形です。'
    example_gloss:
    - マテオは心配しています。
    - エレナは心配しています。
  es.a1.unit12.lesson01.teach.orgulloso:
    title: 誇らしい
    gloss: 誇らしい
    note: '*Orgulloso/orgullosa* -- *estoy orgulloso/a de...*(~を誇りに思います)では、誇りに思う対象の前に *de* を置きます。'
    example_gloss:
    - あなたを誇りに思います。(男性)
    - あなたを誇りに思います。(女性)
  es.a1.unit12.lesson02.teach.estoy_nervioso:
    title: 緊張しています(男性)
    gloss: 緊張しています。
    note: '*Estoy*(私は~です。*estar* の活用形)+ 形容詞の男性形。'
  es.a1.unit12.lesson02.teach.estoy_nerviosa:
    title: 緊張しています(女性)
    gloss: 緊張しています。
    note: 同じ構文で、形容詞は女性形を使います。
  es.a1.unit12.lesson02.teach.estoy_contento:
    title: うれしいです(男性)
    gloss: うれしいです。
    note: '*Estoy contento* -- 同じ *estar* + 形容詞の型です。'
  es.a1.unit12.lesson02.teach.estar_vs_ser_note:
    title: 気持ちを表すときの estar と ser
    gloss: 気持ちには、ふつう ser ではなく estar を使う理由。
    note: カード本文を参照してください。
    target_text: '*Estar* + 形容詞は、一時的な状態や感情を表します(estoy nervioso -- 今、緊張しています)。恒久的な特徴を表す *ser* + 形容詞とは違います。感情には、ふつう *estar* を使います。'
  es.a1.unit12.lesson03.teach.como_te_sientes:
    title: 相手の気持ちをたずねる
    gloss: 気分はどうですか。
    note: '*¿Cómo te sientes?* は、再帰動詞 *sentirse*(感じる)を使った表現で、*estar* + 形容詞とは別の言い方です。'
  es.a1.unit12.lesson03.teach.me_siento_nervioso_pero_contento:
    title: 複雑な気持ちを言う
    gloss: 少し緊張していますが、うれしいです。
    note: '*Me siento*(私は~と感じます)+ 形容詞で、*pero*(しかし)が二つの気持ちを対比させています -- *¿Cómo te sientes?* への自然な答えです。'
  es.a1.unit12.lesson04.teach.algo_se_quema:
    title: 何かが焦げている
    gloss: 何かが焦げています！
    note: '*Se quema* は *quemar*(焼く、焦がす)の再帰形で、「それ自身が焦げる」という意味です。誰がしているかに触れずに「何かが焦げている」と言う自然な表現です。'
  es.a1.unit12.lesson04.teach.estoy_preocupado:
    title: 心配だ(男性が言う場合)
    gloss: 心配しています。
    note: '*estoy* + 形容詞の型で使われる *preocupado*。'
  es.a1.unit12.lesson04.teach.no_te_preocupes:
    title: 心配しないで
    gloss: 心配しないで。
    note: 次の文法ノートを見てください。
  es.a1.unit12.lesson04.teach.podemos_empezar_de_nuevo:
    title: やり直しを提案する
    gloss: もう一度始められます。
    note: '*Podemos*(私たちはできる)+ 不定詞の形です。*de nuevo*(もう一度、新たに)はやり直すときによく使う表現です。'
  es.a1.unit12.lesson04.teach.no_te_preocupes_note:
    title: No te preocupes
    gloss: 「心配しないで」の裏にある否定命令の型。
    note: カード本文を参照してください。
    target_text: '*No te preocupes*(心配しないで)は、親しい相手への否定命令で、*no* + 再帰代名詞(*te*)+ 動詞の形でできています。'
  es.a1.unit12.lesson05.teach.reflexion_reading:
    title: 授業をふりかえって
    gloss: 授業の前、エレナとマテオは少し緊張していました。授業中に何かが焦げて、二人とも心配になりました。でも最初からやり直して、最後にはケーキが完璧に仕上がりました。今、二人はとても誇らしく、うれしい気持ちです。
    note: '*Estaban*(〜だった)はそのときの気持ちを、*están*(〜である)は今の気持ちを表します。'
    glosses:
      Antes: 前
      clase: 授業
      estaban: 〜だった(estarの活用形)
      poco: 少し
      nerviosos: 緊張している
      Durante: 〜の間
      algo: 何か
      quemó: 焦げた(quemarseの活用形)
      dos: 二人とも
      preocupados: 心配している
      Pero: でも
      empezaron: 始めた(empezarの活用形)
      nuevo: もう一度、新たに
      final: 終わり
      pastel: ケーキ
      salió: 仕上がった(salirの活用形)
      perfecto: 完璧な
      Ahora: 今
      están: 〜である(estarの活用形)
      orgullosos: 誇らしい
      contentos: うれしい
  es.a1.unit12.lesson05.teach.plural_adjective_note:
    title: 形容詞の複数形の一致
    gloss: 男女混合のグループに男性複数形の形容詞を使う理由。
    note: カード本文を参照してください。
    target_text: エレナとマテオの二人をまとめて言うときは、形容詞は男性複数形(nerviosos, preocupados, orgullosos, contentos)になります -- 集団に男性が一人でも含まれていれば男性複数形を使うのが、スペイン語の標準的な規則です。
  es.a1.unit12.lesson06.teach.line01:
    title: マテオの気持ちをたずねる
    gloss: エレナがマテオに、授業の前の気持ちをたずねます。
    note: '*¿Cómo te sientes?* は、相手の気持ちをたずねる表現です。'
  es.a1.unit12.lesson06.teach.line02:
    title: 複雑な気持ちを答える
    gloss: マテオは、少し緊張しているけれどうれしいと言います。
    note: マテオは男性形の *nervioso* と *contento* を使っています。
  es.a1.unit12.lesson06.teach.line03:
    title: トラブルに反応する
    gloss: エレナは同意し、そのあと何かが焦げていることに気づきます。
    note: '*¡Ay, no!*(あっ、大変！)は、驚きや焦りを表すよく使う感嘆表現です。'
  es.a1.unit12.lesson06.teach.line04:
    title: 不安を伝える
    gloss: マテオは心配だと言い、どうしようかとたずねます。
    note: '*¿Qué hacemos?*(私たちはどうする？)は、実際の場面で使える質問です。'
  es.a1.unit12.lesson06.teach.line05:
    title: 安心させて解決策を提案する
    gloss: エレナは、心配しないで、もう一度やり直せると言います。
    note: '*no te preocupes* と *podemos empezar de nuevo* を組み合わせた表現です。'
  es.a1.unit12.lesson06.teach.line06:
    title: 同意してもう一度試す
    gloss: マテオは同意し、もう一度やってみようと提案します。
    note: '*Vamos a intentarlo otra vez*(もう一度やってみよう)は、これまでのユニットで出てきた *vamos a* + 不定詞の形に、目的語の代名詞 *lo* が加わったものです。'
  es.a1.unit12.lesson06.teach.line07:
    title: 成功を知らせる
    gloss: エレナは、ケーキが今度は完璧だと知らせます。
    note: '*¡Mira!*(見て！)は注意を引く呼びかけです。*el pastel*(ケーキ)は、今回のトラブルの中心にある料理です。'
  es.a1.unit12.lesson06.teach.line08:
    title: 喜んで誇りを伝える
    gloss: マテオは喜び、二人のことを誇りに思うと言います。
    note: '*¡Qué bien!*(すごい！)は、*¡Qué calor!* と同じ *¡Qué...!* の感嘆表現です。*de nosotros*(私たちのことを)は、*estoy orgulloso de ti* を複数の人に広げた形です。'
  es.a1.unit12.lesson06.teach.line09:
    title: 誇りを分かち合う
    gloss: エレナも誇らしいと言い、二人でやり遂げたと伝えます。
    note: '*Lo logramos juntos*(私たちは一緒にやり遂げた)は、締めくくりにぴったりの自然な一言です。*lograr*(成し遂げる)が初めて出てきます。'
