    title: エレナが日課を話す
    gloss: エレナ：はい、毎日散歩に連れて行って、えさもやっています。
  es.a1.unit53.lesson05.teach.a_mateo_y:
    title: マテオ、ルシア、ディエゴと動物
    gloss: マテオとルシアは二人とも動物が大好きですが、どちらもペットは飼っていません。マテオは犬が、ルシアは猫が大好きです。ディエゴはペットを飼っています。猫です。よく猫と遊び、毎日えさをやっています。あなたはペットを飼っていますか？
    note: 動物が好きなことと、実際に飼っていることの違いを対比しています。これがこの学習目標で伝えたいポイントです。
    glosses:
      encantan: 愛する
      dos: '2'
      animales: 動物
      ninguno: どちらも〜ない
      mascota: ペット
      perros: 犬たち
      gatos: 猫たち
      gato: 猫
      juega: 遊ぶ
      da: 与える
      todos: 毎～
      comer: 餌
