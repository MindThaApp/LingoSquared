    - おじいさんは鳥が大好きです。
  es.a1.unit53.lesson03.teach.me_encantan_los:
    title: 私は動物が大好きです
    gloss: 私は動物が大好きです。
    note: '*Me encantan* は、*los animales* が複数なので複数形です。動詞は、好きな対象に合わせて変わります。'
