teaching:
  es.a1.unit53.lesson01.teach.el_animal_la:
    title: 動物、ペット
    gloss: 動物／ペット
    note: '*Animal* は動物全般を指す語で、*mascota* は特にペットを指します。*mascota* はオスの動物でも女性名詞です。'
    example_gloss:
    - 犬は動物です。
    - 犬はペットでもあります。
  es.a1.unit53.lesson01.teach.el_perro_el:
    title: 犬と猫
    gloss: 犬／猫
    example_gloss:
    - エレナは犬を飼っています。
    - ディエゴは猫を飼っています。
  es.a1.unit53.lesson01.teach.el_pez_el:
    title: 魚と鳥
    gloss: 魚／鳥
    example_gloss:
    - おじいさんは魚を飼っています。
    - Ninaは鳥を飼っています。
  es.a1.unit53.lesson01.teach.tienes_mascota:
    title: ペットを飼っていますか？
    gloss: ペットを飼っていますか？
    note: これまでの単元で学んだ *¿Tienes ...?* の疑問文と同じ型です。
  es.a1.unit53.lesson01.teach.si_tengo_un:
    title: はい、犬を飼っています
    gloss: はい、犬を飼っています。
    note: このユニットの新しい語彙を使った、簡単な肯定の答えです。
  es.a1.unit53.lesson01.teach.no_no_tengo:
    title: いいえ、ペットは飼っていません
    gloss: いいえ、ペットは飼っていません。
    note: '*No tengo mascota* は、動詞の前に *no* を置くだけです。文法ノートを見てください。'
  es.a1.unit53.lesson01.teach.para_decir_que:
    title: No tengo：持っていないと言う
    gloss: 何かを持っていないと言うときは、tengo の前に no を置きます：No tengo tiempo, no tengo mascota.
    note: '*No tengo tiempo* で学んだ *no tengo* の型をもう一度使います。新しいのは名詞だけです。'
  es.a1.unit53.lesson02.teach.sacar_a_pasear:
    title: （動物を）散歩させる
    gloss: （動物を）散歩させる
    note: '*Sacar a pasear* は決まった言い方です：*sacar*(「連れ出す」)+ *a pasear*(「散歩に」)。'
    example_gloss: 私は毎日犬を散歩させます。
  es.a1.unit53.lesson02.teach.cuando_el_objeto:
    title: Sacar a pasear と人称の a
    gloss: 目的語が動物や人のときは、前に a を置きます：saco al perro a pasear.
    note: 前のカードの *saco al perro* をもう一度使います。人称の *a* は、大切な動物や人の前に付きます。
  es.a1.unit53.lesson02.teach.dar_de_comer:
    title: 餌を与える
    gloss: 餌をあげる
    example_gloss: 私は毎日猫に餌をあげます。
  es.a1.unit53.lesson02.teach.jugar_con:
    title: ～と遊ぶ
    gloss: ～と遊ぶ
    example_gloss: ディエゴは自分の猫と遊びます。
  es.a1.unit53.lesson02.teach.saco_al_perro:
    title: 私は毎日犬を散歩させます
    gloss: 私は毎日犬を散歩させます。
    note: '*Sacar a pasear* は、以前の単元で学んだ *todos los días*(毎日)と一緒に使えます。*a* + *el* は *al* になります。'
  es.a1.unit53.lesson02.teach.le_doy_de:
    title: 私は毎日猫に餌を与えます
    gloss: 私は毎日猫に餌をあげます。
    note: '*Dar de comer*(直訳は「食べるために与える」)は「えさをやる」という意味です。*le* は動物を指します：*le doy de comer al gato*。'
  es.a1.unit53.lesson03.teach.el_plural_termina:
    title: 'Plural: perro → perros'
    gloss: 複数形は -s で終わります：perro → perros, gato → gatos。子音で終わる語は -es を付けます：animal → animales。
    note: 動物の名詞を例に、スペイン語の規則的な複数形の作り方を初めて学びます。
  es.a1.unit53.lesson03.teach.perros_gatos:
