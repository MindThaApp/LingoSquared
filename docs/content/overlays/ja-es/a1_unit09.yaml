  es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue:
    title: エレナがマテオに道を説明する
teaching:
  es.a1.unit09.lesson01.teach.la_calle:
    title: 通り
    gloss: 通り
    note: '*Calle* は女性名詞です。'
    example_gloss: 私はこの通りに住んでいます。
  es.a1.unit09.lesson01.teach.la_esquina:
    title: 角
    gloss: 角
    note: '*Esquina* は女性名詞です。'
    example_gloss: 銀行は角にあります。
  es.a1.unit09.lesson02.teach.seguir_derecho:
    title: まっすぐ行く
    gloss: まっすぐ行ってください。
    note: '*Sigue* は *seguir*(続ける、進む)の親しい相手への命令形で、このユニットの道案内で何度も使われます。'
  es.a1.unit09.lesson02.teach.doblar_izquierda:
    title: 左に曲がる
    gloss: 左に曲がってください。
    note: '*Dobla* は *doblar*(曲がる、折る)の親しい相手への命令形です。*doblar* と *girar* の違いは次の文法ノートを見てください。'
  es.a1.unit09.lesson02.teach.girar_derecha:
    title: 右に曲がる
    gloss: 右に曲がってください。
    note: '*Gira* は *girar*(曲がる、回る)の親しい相手への命令形で、*doblar* と完全に入れ替えられます。'
  es.a1.unit09.lesson02.teach.cruzar_la_calle:
    title: 通りを渡る
    gloss: 通りを渡ってください。
    note: '*Cruza* は *cruzar*(渡る)の親しい相手への命令形です。'
  es.a1.unit09.lesson02.teach.doblar_vs_girar_note:
    title: Doblar と girar
    gloss: 「曲がる」を表す、どちらも自然な二つの言葉。
    note: カード本文を見てください。
    target_text: '*Doblar* も *girar* も「曲がる」という意味で、ここでは完全に入れ替えて使えます。地域による好みの違いで、丁寧さや意味の違いではありません。このユニットでは両方使います。'
  es.a1.unit09.lesson03.teach.como_llego_a_la_biblioteca:
    title: 行き方を尋ねる
    gloss: 図書館へはどう行けばいいですか。
    note: '*Cómo llego a*(〜へはどう行けばいいか)は、特定の場所への行き方を尋ねる標準的な言い方です。'
  es.a1.unit09.lesson03.teach.es_facil:
    title: 簡単だと伝える
    gloss: 簡単ですよ。
    note: 道案内の前に、相手を安心させるためによく言うひとことです。
  es.a1.unit09.lesson03.teach.sigue_derecho_por_esta_calle:
    title: この通りをまっすぐ行く
    gloss: この通りをまっすぐ行ってください。
    note: '*Por esta calle*(この通りに沿って)は、どの通りを進むかを示します。'
  es.a1.unit09.lesson03.teach.dobla_a_la_izquierda_en_la_esquina:
    title: 角を左に曲がる
    gloss: 角を左に曲がってください。
    note: '*En la esquina*(角で)は、どこで曲がるかを示します。'
  es.a1.unit09.lesson04.teach.esta_bien_asi:
    title: 確認を求める
    gloss: これで合っていますか。
    note: '*¿Está bien así?*(こういう感じで大丈夫ですか)は、道順を復唱したあとに理解を確かめる表現で、道を教えてもらったあとの自然な流れです。'
  es.a1.unit09.lesson04.teach.si_asi_es:
    title: 肯定する
    gloss: はい、そのとおりです。
    note: '*Así es*(そのとおり)は、短く自然な肯定の返事です。'
  es.a1.unit09.lesson04.teach.no_te_pierdas:
    title: 迷わないでね
    gloss: 迷わないでね!
    note: '*No te pierdas* は *perderse*(迷う)の親しい相手への否定命令形で、温かくくだけた見送りのひとことです。'
  es.a1.unit09.lesson05.teach.direcciones_reading:
    title: 書かれた道案内を読む
    gloss: 市場から図書館へ行くには、この通りをまっすぐ行ってください。角を左に曲がります。それから、通りを渡ってください。図書館は右側にあります。
    note: 書かれた道案内は、手順を順番に並べます。*Para llegar a...*(〜に着くには)で目的地を示し、その後に *tú* の命令形(*sigue*、*dobla*、*cruza*)が続き、*después*(それから)が手順をつなぎます。
    glosses:
      llegar: 着く、到着する
      biblioteca: 図書館
      desde: 〜から
      mercado: 市場
      sigue: 続ける、進む(seguir の活用形)
      derecho: まっすぐ
      calle: 通り
      Dobla: 曲がる(doblar の活用形)
      izquierda: 左
      esquina: 角
      Después: それから、そのあと
      cruza: 渡る(cruzar の活用形)
      está: ある、位置する(estar の活用形)
      derecha: 右
  es.a1.unit09.lesson05.teach.desde_note:
    title: Desde(〜から)
    gloss: desde が道のりの出発点を示す仕組み。
    note: カード本文を見てください。
    target_text: '*Desde*(〜から)は道のりの出発点を示し、目的地を示す *a*(〜へ)と組み合わせて使います。*desde el mercado* ... *a la biblioteca*。'
  es.a1.unit09.lesson06.teach.line01:
    title: 道を尋ねる
    gloss: マテオがエレナに、市場から図書館への行き方を尋ねます。
    note: このユニットの前半に出てきた *¿Cómo llego a...?* の質問に、出発点 *desde el mercado*(市場から)が加わっています。
  es.a1.unit09.lesson06.teach.line02:
    title: 最初の道順を教える
    gloss: エレナは簡単だと言って、最初の道順を教えます。
    note: '*Es fácil*(簡単だよ)は、最初の道順を言う前に相手を安心させる言葉です。'
  es.a1.unit09.lesson06.teach.line03:
    title: 復唱して続きを尋ねる
    gloss: マテオは道順を復唱して、次は何かを尋ねます。
    note: '*Sigo derecho*(まっすぐ進みます)は *seguir* の一人称の形で、マテオが聞きながら自分で確認していることを表します。'
  es.a1.unit09.lesson06.teach.line04:
    title: 二番目の道順を教える
    gloss: エレナは、角を左に曲がるよう言います。
    note: '*Dobla*(曲がる)――ここでは *gira* も同じ意味です。'
  es.a1.unit09.lesson06.teach.line05:
    title: 復唱して確認する
    gloss: マテオは曲がる道順を復唱して、合っているかを尋ねます。
    note: '*Doblo*(私は曲がります)は先ほどの *Sigo derecho* と同じように、マテオが各ステップを *yo* の形で復唱して確かめています。'
  es.a1.unit09.lesson06.teach.line06:
    title: 肯定して最後の道順を教える
    gloss: エレナは合っていると答え、通りを渡るよう言います。図書館は右側にあります。
    note: '*Sí, así es*(はい、そのとおりです)で確認し、*después*(そのあと)で道順の最後の手順を続けます。'
  es.a1.unit09.lesson06.teach.line07:
    title: エレナにお礼を言う
    gloss: マテオはエレナに心からお礼を言います。
    note: '*Muchas gracias*(本当にありがとう)は、簡単な*gracias*よりも気持ちのこもった言い方です。'
  es.a1.unit09.lesson06.teach.line08:
    title: お礼に答えて見送る
    gloss: エレナは「どういたしまして」と言い、道に迷わないようにと声をかけます。
    note: '*De nada*(どういたしまして)は、*gracias*に対する決まった返事です。'
