teaching:
  es.a1.unit10.lesson01.teach.el_tiempo:
    title: 天気
    gloss: 天気
    note: '*Tiempo* には「時間」という意味もあります。どちらの意味かは文脈で判断します。'
    example_gloss: 今日はどんな天気ですか?
  es.a1.unit10.lesson01.teach.el_sol:
    title: 太陽
    gloss: 太陽
    note: '*Sol* は男性名詞です。'
    example_gloss: 今日はとてもよく晴れています。
  es.a1.unit10.lesson01.teach.la_lluvia:
    title: 雨
    gloss: 雨
    note: '*Lluvia* は女性名詞です。'
    example_gloss: 私は雨が好きではありません。
  es.a1.unit10.lesson01.teach.el_viento:
    title: 風
    gloss: 風
    note: '*Viento* は男性名詞です。'
    example_gloss: 今日はとても風が強いです。
  es.a1.unit10.lesson01.teach.la_nube:
    title: 雲
    gloss: 雲
    note: '*Nube* は女性名詞です。'
    example_gloss: 雲ひとつありません。
  es.a1.unit10.lesson02.teach.hace_calor:
    title: 暑い
    gloss: 暑いです。
    note: '*Hace calor*(直訳は「暑さを作る」)は、暑い天気を表す決まった言い方です。'
    example_gloss: 7月はとても暑いです。
  es.a1.unit10.lesson02.teach.hace_frio:
    title: 寒い
    gloss: 寒いです。
    note: '*Hace frío* も *hace calor* と同じ、*hace* + 名詞の型です。'
    example_gloss: 12月は寒いです。
  es.a1.unit10.lesson02.teach.hace_sol:
    title: 晴れている
    gloss: 晴れています。
    note: '*Hace sol* は、同じ型の中で *el sol*(太陽)を使っています。'
  es.a1.unit10.lesson02.teach.llueve:
    title: 雨が降っている
    gloss: 雨が降っています。
    note: '*Llueve* は(*llover*「雨が降る」の)独立した動詞の形で、*hace* の型ではありません。次の文法ノートを見てください。'
  es.a1.unit10.lesson02.teach.esta_nublado:
    title: 曇っている
    gloss: 曇っています。
    note: '*Está nublado* は *estar* + 形容詞を使う、3つ目の別の天気の表現型です。'
  es.a1.unit10.lesson02.teach.hace_vs_esta_note:
    title: Hace, llueve, está:3つの型
    gloss: 天気を表す3つの異なる文法パターン。
    note: カード本文を参照してください。
    target_text: '*hace*を使う天気の表現(hace calor、hace frío、hace sol)は決まった言い回しで、直訳すると「熱/寒さ/太陽をつくる」となります。*Llueve*(雨が降る)はそれ自体が動詞の形で、*está nublado*(曇っている)は*estar*+形容詞を使います。同じ天気を表すのに、3つの異なる型があります。'
  es.a1.unit10.lesson03.teach.que_tiempo_hace_hoy:
    title: 天気をたずねる
    gloss: 今日はどんな天気ですか?
    note: '*¿Qué tiempo hace hoy?* は、今の天気をたずねる標準的な言い方で、*el tiempo*(天気)を使います。'
  es.a1.unit10.lesson03.teach.hace_mucho_calor_y_sol:
    title: 暑くて晴れた天気を言う
    gloss: とても暑くて、晴れています。
    note: 2つの *hace* の表現を *y*(〜と、そして)でつないでいます。
  es.a1.unit10.lesson03.teach.hace_calor_pero_hay_viento:
    title: 暑くて風のある天気を言う
    gloss: 暑いですが、風があります。
    note: '*Pero*(しかし)で2つの天気の事実を対比しています。暑さと風で、*hay mucho viento* のように *hay* + 名詞を使います。'
  es.a1.unit10.lesson04.teach.en_invierno_hace_frio_en_madrid:
    title: マドリードの冬について話す
    gloss: マドリードの冬はとても寒いです。
    note: '*En invierno*(冬に)は季節を表す言葉で、後に出てくる *en julio* と対比されます。'
  es.a1.unit10.lesson04.teach.en_julio_hace_demasiado_calor:
    title: 7月の暑さについて話す
    gloss: 7月は暑すぎます。
    note: '*Demasiado*(〜すぎる)は、単なる *mucho*(とても)よりも *calor* の程度が強いことを表します。'
  es.a1.unit10.lesson04.teach.necesitamos_agua:
    title: なぜ水が必要か説明する
    gloss: 暑いので、私たちは水が必要です。
    note: '*Porque*(なぜなら)で必要なことと天気という理由をつなぎます。ワークショップに役立つ実用的な文です。'
  es.a1.unit10.lesson05.teach.pronostico_reading:
    title: 天気予報を読む
    gloss: 今日、7月22日は、とても暑くて晴れています。雲ひとつありません。風も少しあります。料理ワークショップに行くにはいい日ですが、水を持っていくことが大切です。
    note: 料理教室がある7月22日の短い天気予報です。
    glosses:
      Hoy: 今日
      veintidós: 22番目の
      julio: 7月
      hace: 〜である/天気が〜だ(hacerの形)
      calor: 暑さ
      sol: 晴れ/太陽
      hay: 〜がある(haberの形)
      nube: 雲
      También: 〜も
      poco: 少し
      viento: 風
      buen: よい
      día: 日
      ir: 行く
      taller: ワークショップ
      cocina: 料理
      importante: 大切な
      llevar: 持っていく
      agua: 水
  es.a1.unit10.lesson05.teach.un_poco_de_note:
    title: Un poco de(少しの〜)
    gloss: un poco de が少量を表すしくみ。
    note: カード本文を参照してください。
    target_text: '*Un poco de*(少しの〜)は食べ物の量にも使えますが、ここでは少しの風を表しています。名詞が変わるだけで、同じ型です。'
  es.a1.unit10.lesson06.teach.line01:
    title: 暑さについて話す
    gloss: エレナが今日はなんて暑いのかと言います。
    note: '*¡Qué calor hace hoy!*(今日はなんて暑いんだ)は、*hace calor* という表現を使った感嘆文です。'
  es.a1.unit10.lesson06.teach.line02:
    title: 同意して付け加える
    gloss: マテオは同意し、雲ひとつないと言います。
    note: '*hace mucho calor y hace sol* と *no hay ni una nube* を組み合わせています。'
  es.a1.unit10.lesson06.teach.line03:
    title: 水を持っていこうと提案する
    gloss: エレナは、道中に水が必要だと言います。
    note: '*El camino*(道)は、ワークショップまでの道のりを指します。'
  es.a1.unit10.lesson06.teach.line04:
    title: 同意して店を教える
    gloss: マテオは同意し、近くに店があると言います。
    note: '*Cerca de aquí*(この近く)は、場所を表す *cerca de*(〜の近く)を使っています。'
  es.a1.unit10.lesson06.teach.line05:
    title: 冬と夏を比べる
    gloss: エレナは、マドリードの冬は寒いけれど、7月の今日は暑すぎると比べます。
    note: 季節を表す2つの文 *en invierno hace mucho frío* と *en julio hace demasiado calor* を組み合わせています。
  es.a1.unit10.lesson06.teach.line06:
    title: 好みを話す
    gloss: マテオは暑いほうが好きだと言います。ロンドンではほぼ毎日雨が降るからです。
    note: '*Prefiero*(私は〜のほうが好きだ)は新しい一人称の動詞の形です。*casi todos los días*(ほぼ毎日)は頻度を表す便利な言い方です。'
  es.a1.unit10.lesson06.teach.line07:
    title: 同意して急ぐ
    gloss: エレナは同意し、行かないと授業に遅れると言います。
    note: '*Es verdad* は「その通り」という意味です。ここでの *o*(または)は「さもないと」という結果を示します。'
  es.a1.unit10.lesson06.teach.line08:
    title: 同意して出発する
    gloss: マテオは彼女の言う通りだと同意し、二人は出発します。
    note: '*Tienes razón*(君の言う通りだ)はよく使う同意の表現です。'
