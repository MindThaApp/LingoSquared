  es.a1.unit52.lesson01.alto_bajo_mayor_y:
    title: 背が高い、背が低い、年を取った、若い
  es.a1.unit52.lesson02.describir_el_pelo:
    title: 髪について説明する
  es.a1.unit52.lesson03.los_ojos_y_como:
    title: 目と人の外見の尋ね方
  es.a1.unit52.lesson04.elena_describe_a_nina:
    title: エレナがニナを説明する
  es.a1.unit52.lesson05.comparar_a_diego_y:
    title: ディエゴとルシアを比べる
  es.a1.unit52.lesson06.mateo_reconoce_a_nina:
    title: マテオがニナに気づく
teaching:
  es.a1.unit52.lesson01.teach.alto_bajo:
    title: 背が高い、背が低い
    gloss: 背が高い／背が低い
    note: '*Alto* は背が高い人、*bajo* は背が低い人を表します。どちらも人に合わせて形が変わります:*alta*、*baja*。'
    example_gloss:
    - ルシアは背が高いです。
    - ディエゴは背が低いです。
  es.a1.unit52.lesson01.teach.mayor_joven:
    title: 年を取った、若い
    gloss: 年を取った／若い
    note: '*Mayor* と *joven* は、正確な年数ではなく、年齢の大まかな印象を表します。'
    example_gloss:
    - おじいさんは年を取っています。
    - マテオは若いです。
  es.a1.unit52.lesson01.teach.para_dar_la:
    title: Mayor:数ではなく印象
    gloss: 正確な年齢は tener años を使って ¿Cuántos años tienes? のように言います。mayor は数を言わずに、El abuelo es mayor. のように大まかな印象を表します。
    note: 正確な年齢は *tener años* で言います:*¿Cuántos años tienes?* *Mayor* は数を使わず、大まかな印象だけを表します。
  es.a1.unit52.lesson01.teach.lucia_es_alta:
    title: ルシアは背が高く、ディエゴは背が低いです
    gloss: ルシアは背が高く、ディエゴは背が低いです。
    note: '*y*(「そして」)でつないだ簡単な文です。後のレッスンでの直接の比較につながります。'
  es.a1.unit52.lesson02.teach.el_pelo:
    title: 髪
    gloss: 髪
    note: '*El pelo* は男性名詞で、髪全体を指すときは単数形のままです。'
    example_gloss: マテオは短い黒髪です。
  es.a1.unit52.lesson02.teach.rubio_castano_gris:
    title: 金色、茶色、灰色
    gloss: 金色の／茶色の／灰色の
    note: 髪の色を表す3つの語:*rubio*(金髪の)、*castaño*(茶色の)、*gris*(灰色の)。*Rubio* は名詞に合わせて変化します:*pelo rubio*、*melena rubia*。
    example_gloss:
    - エレナは金髪です。
    - ディエゴは茶色の髪です。
    - おじいさんは白髪です。
  es.a1.unit52.lesson02.teach.largo_corto:
    title: 長い髪と短い髪
    gloss: 長い／短い（髪）
    note: '*Largo*(長い)は身長のレッスンで出てきた語で、ここでは髪の長さに使います。*corto*(短い)は新しい語です:*el pelo largo*、*el pelo corto*。'
    example_gloss:
    - ルシアは長い髪です。
    - ディエゴは短い髪です。
  es.a1.unit52.lesson02.teach.el_adjetivo_va:
    title: 形容詞は名詞のあとに置く
    gloss: 形容詞は名詞のあとに来ます:el pelo corto、el pelo largo、el pelo rubio、el pelo castaño、el pelo gris、el pelo negro。
    note: スペイン語では、形容詞は名詞のあとに置かれ、名詞に合わせて形が変わります:*el pelo corto*、*el pelo rubio*。日本語では形容詞が名詞の前に来る点が異なります。
  es.a1.unit52.lesson02.teach.pelo_y_cabello:
    title: Pelo と cabello
    gloss: Pelo と cabello は同じ意味です。このコースでは pelo を使います:el pelo largo。
    note: 日常のスペイン語では *pelo* も *cabello* も「髪」を意味します。このコースでは *pelo* を使います。
  es.a1.unit52.lesson02.teach.mateo_tiene_el:
    title: マテオは短い黒髪です
    gloss: マテオは短い黒髪です。
    note: 服の単元で出てきた *negro*(黒い)をもう一度使っています。
  es.a1.unit52.lesson02.teach.elena_tiene_el:
    title: エレナは長い金髪です
    gloss: エレナは長い金髪です。
    note: このレッスンで学ぶ長さと色の語彙を、自然な1つの文に組み合わせています。
  es.a1.unit52.lesson03.teach.los_ojos:
    title: 目
    gloss: 目
    note: '*Los ojos* は *el ojo* の複数形で、どちらも男性名詞です。'
    example_gloss: マテオは茶色い目をしています。
  es.a1.unit52.lesson03.teach.azul_marron_verde:
    title: 青、茶色、緑
    gloss: 青い／茶色い／緑色の
    note: '*Azul*(青い)と *verde*(緑の)は男性形も女性形も同じ形です。*marrón*(茶色の)は目の色に普通使う語で、髪は *castaño* と言います。'
    example_gloss:
    - エレナは青い目をしています。
    - ディエゴは茶色い目をしています。
    - ルシアは緑の目をしています。
  es.a1.unit52.lesson03.teach.con_ojos_plural:
    title: Ojos には複数形の形容詞
    gloss: ojos(複数形)といっしょに使う形容詞も複数形になります:ojos azules、ojos marrones、ojos verdes。
    note: 形容詞は数も名詞に合わせます。*ojos* は複数形なので、*azules*、*marrones*、*verdes* となります。
  es.a1.unit52.lesson03.teach.como_es_elena:
    title: エレナはどんな人ですか。
    gloss: エレナはどんな人ですか。
    note: '*¿Cómo es ...?* はこの単元の中心となる質問です。誰の外見をたずねるときにも使えます。'
  es.a1.unit52.lesson03.teach.elena_tiene_el:
    title: エレナは長い金髪で青い目をしています
    gloss: エレナは長い金髪で青い目をしています。
    note: 髪と目を *y* でつないで一文にした答えの例です。
  es.a1.unit52.lesson04.teach.elena_viene_una:
    title: エレナがニナを紹介する
    gloss: エレナ:言語カフェに新しい女の子が来るの。名前はニナよ。
    note: '*Viene*(「来る」)は新しい人を紹介するときに使います。*se llama* は「〜という名前です」という意味です。'
  es.a1.unit52.lesson04.teach.mateo_genial_como:
    title: マテオが外見をたずねる
    gloss: マテオ:いいね!どんな子?
    note: この単元の中心の質問を、名前なしで使っています:*¿Cómo es?*
  es.a1.unit52.lesson04.teach.elena_es_baja:
    title: エレナがニナの背と髪を説明する
    gloss: エレナ:背が低くて、短い金髪よ。
    note: 最初のレッスンの *baja* と髪の語彙を組み合わせています。ニナは女の子なので、*baja* は女性形です。
  es.a1.unit52.lesson04.teach.mateo_y_los:
    title: マテオが目についてたずねる
    gloss: マテオ:目は?
    note: '*¿Y los ojos?* は定冠詞で話題を受けています。スペイン語では、日本語の「彼女の」にあたる *sus* は、ここでは必要ありません。'
  es.a1.unit52.lesson04.teach.elena_tiene_los:
    title: エレナがニナの目を説明する
    gloss: エレナ:緑の目をしているわ。
    note: 目のレッスンで出てきた *los ojos verdes* をもう一度使っています。
  es.a1.unit52.lesson04.teach.mateo_gracias_entonces:
    title: マテオは彼女に気づくはず
    gloss: マテオ:ありがとう!それなら見つけられるよ。
    note: '*La reconoceré*(「彼女だと分かるだろう」)は未来形です。*la* は「彼女を」の意味で、動詞の前に置きます。'
  es.a1.unit52.lesson05.teach.diego_es_el:
    title: ディエゴとルシアを比べる
    gloss: ディエゴとルシアは兄妹ですが、似ていません。ディエゴは背が低く、短い茶色の髪で、茶色い目をしています。ルシアはディエゴより背が高く、長い茶色の髪で、緑の目をしています。あなたはどんな外見ですか。
    note: これまでに学んだ色や長さを表す語を使って人の見た目を比べ、最後に自分の見た目について答えます。
    glosses:
      hermano: 兄弟
      hermana: 姉妹
      eres: ～に見える
      diferentes: 異なる
      bajo: 背が低い
      corto: 背が低い
      castaño: 茶色の
      pelo: 髪
      marrones: 茶色の
      ojos: 目
      alta: より背が高い
      largo: 長い
      verdes: 緑色の
      cómo: (「cómo es」=「〜はどんな様子か」の一部)
  es.a1.unit52.lesson05.teach.ya_conoces_el:
    title: 比較の型をもう一度使う
    gloss: 比較の型 más + 形容詞 + que はもう知っていますね。ここでは人に使います:Lucía es más alta que Diego(ルシアはディエゴより背が高い)。
    note: 比較の単元で学んだ *más + adjective + que* のパターンを、今度は物ではなく人に使います。
  es.a1.unit52.lesson05.teach.lucia_tiene_el:
    title: ルシアはディエゴより髪が長い
    gloss: ルシアはディエゴより髪が長いです。
    note: '*Más largo que* で二つを比べます:*el pelo más largo que Diego*。*pelo* が男性名詞なので、*largo* は男性形のままです。'
  es.a1.unit52.lesson05.teach.tengo_el_pelo:
    title: 私は短い茶色の髪をしています
    gloss: 私は短い茶色の髪をしています。
    note: '*tengo* を使った一人称の例文です。自分の外見を話すときにそのまま使えます。'
  es.a1.unit52.lesson06.teach.mateo_mira_es:
    title: マテオがニナを見つける
    gloss: マテオ:見て、あれがニナ?短い金髪で、緑の目をしているね。
    note: '*Mira*(「見て」)は *mirar* のくだけた命令形で、ここでは何かを指し示すために使われています。'
  es.a1.unit52.lesson06.teach.elena_si_esa:
    title: エレナが認める
    gloss: エレナ:ええ、あれがニナよ!
    note: 短く自然に、そうだと伝える表現です。
  es.a1.unit52.lesson06.teach.nina_hola_eres:
    title: ニナがマテオにあいさつする
    gloss: ニナ:こんにちは、マテオ?
    note: くだけたあいさつの簡単な質問です:*¿Eres ...?*
  es.a1.unit52.lesson06.teach.mateo_si_encantado:
    title: マテオもあいさつを返す
    gloss: マテオ:うん!はじめまして、ニナ。
    note: '*Encantado de conocerte* は初対面での決まった言い方です。女性は *Encantada* と言います。'
  es.a1.unit52.lesson06.teach.nina_encantada_de:
    title: Ninaもあいさつを返します
    gloss: Nina：こちらこそ、はじめまして！
    note: 対話の締めくくりです。マテオはエレナの説明のおかげでニナに気づくことができました。
