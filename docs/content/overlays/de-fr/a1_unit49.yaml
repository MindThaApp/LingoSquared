teaching:
  fr.a1.unit49.lesson01.teach.content_triste_en:
    title: Froh, traurig und wütend
    gloss: froh, traurig, wütend
    note: 'Drei grundlegende Gefühlswörter mit *être* (sein): *content* hat die weibliche Form *contente*, *triste* und *en colère* bleiben unverändert.'
    example_gloss:
    - Ich bin froh.
    - Ich bin traurig.
    - Ich bin wütend.
  fr.a1.unit49.lesson01.teach.je_suis_content:
    title: Sagen, dass man froh ist
    gloss: Ich bin glücklich.
    note: '*Être* (sein) + Adjektiv für ein Gefühl ist das Grundmuster, genau wie im Deutschen: „Ich bin ...“.'
  fr.a1.unit49.lesson01.teach.je_ne_suis:
    title: Gefühle gegenüberstellen
    gloss: Ich bin nicht wütend, ich bin traurig.
    note: '*Ne ... pas* umschließt das Verb; der zweite Satz nennt dann das tatsächliche Gefühl.'
  fr.a1.unit49.lesson02.teach.pourquoi_es_tu:
    title: Nach dem Grund fragen
    gloss: Warum bist du froh?
    note: '*Pourquoi* (warum) ist das übliche Fragewort für einen Grund.'
  fr.a1.unit49.lesson02.teach.je_suis_content:
    title: Einen Grund nennen
    gloss: Ich bin froh, weil ich eine neue Wohnung habe.
    note: '*Parce que* (weil) leitet den Grund ein; vor *il* wird es zu *parce qu''* verkürzt.'
  fr.a1.unit49.lesson02.teach.je_suis_triste:
    title: Ein negativer Grund
    gloss: Ich bin traurig, weil es regnet.
    note: '*Il pleut* (es regnet) aus der Wettereinheit wird hier als Begründung wiederverwendet.'
  fr.a1.unit49.lesson03.teach.nerveux:
    title: Nervös
    gloss: nervös
    note: Das gebräuchliche Wort für Nervosität.
    example_gloss: Ich bin nervös vor meiner ersten Schicht.
  fr.a1.unit49.lesson03.teach.je_suis_nerveux:
    title: Sagen, wovor man nervös ist
    gloss: Ich bin nervös vor meiner ersten Schicht.
    note: '*Avant* (wörtlich „vor“) nennt, worauf sich die Nervosität bezieht – ähnlich wie das deutsche „vor“ in „nervös vor ...“.'
  fr.a1.unit49.lesson03.teach.ne_t_inquiete:
    title: Jemanden beruhigen
    gloss: Mach dir keine Sorgen.
    note: '*Ne t''inquiète pas* (wörtlich „beunruhige dich nicht“) ist die feststehende Beruhigungsformel; *s''inquiéter* ist reflexiv.'
  fr.a1.unit49.lesson04.teach.comment_se_sent:
    title: Fragen, wie sich jemand fühlt
    gloss: Wie fühlt sich Mathieu?
    note: '*Se sentir* (sich fühlen, reflexiv) ist die übliche Art, nach einem Gefühlszustand zu fragen oder ihn zu beschreiben; es kommt auch in der Gesundheitseinheit vor.'
  fr.a1.unit49.lesson04.teach.il_se_sent:
    title: Beschreiben, wie sich jemand fühlt
    gloss: Er fühlt sich nervös.
    note: '*Se* (sich) ist das Reflexivpronomen der 3. Person und steht zusammen mit *sent*.'
  fr.a1.unit49.lesson04.teach.pourquoi_se_sent:
    title: Fragen, warum sich jemand so fühlt
    gloss: Warum fühlt er sich nervös?
    note: Verbindet *pourquoi* mit *se sentir* aus *Il se sent nerveux*; *sent-il* wird mit Bindestrich geschrieben.
  fr.a1.unit49.lesson05.teach.salut_camille_je:
    title: Eine Nachricht über Gefühle lesen
    gloss: Hallo Camille, ich bin ein bisschen nervös vor meiner ersten Schicht allein. Aber ich bin auch froh, denn ich habe einen neuen Job und eine neue Wohnung. Ich glaube, es wird gut gehen.
    note: Achten Sie darauf, wovor der Schreiber nervös ist, was ihn froh macht und wie er insgesamt die Lage sieht.
    glosses:
      peu: ein bisschen
      nerveux: nervös
      premier: erste
      service: Schicht
      seul: allein
      content: glücklich
      car: denn, weil
      nouveau: neu
      travail: Arbeit
      nouvel: neu
      appartement: Wohnung
      pense: denken, glauben
      aller: 'klappt (hier: wird gut gehen)'
  fr.a1.unit49.lesson06.teach.camille_salut_mathieu:
    title: Camille fragt, wie sich Mathieu fühlt
    gloss: 'Camille: Hallo Mathieu, wie fühlst du dich vor deiner ersten Schicht?'
    note: '*Avant ton premier service* (vor deiner ersten Schicht) verwendet wieder das Muster *avant* + Nomen aus Lektion 3.'
  fr.a1.unit49.lesson06.teach.mathieu_je_suis:
    title: Mathieu gibt zu, dass er nervös ist
    gloss: 'Mathieu: Ich bin ehrlich gesagt ein bisschen nervös.'
    note: '*Honnêtement* (ehrlich) macht das Eingeständnis weicher.'
  fr.a1.unit49.lesson06.teach.camille_ne_t:
    title: Camille beruhigt ihn
    gloss: 'Camille: Keine Sorge, du schaffst das!'
    note: '*Tu vas y arriver* (wörtlich „du wirst dort ankommen“) ist eine ermutigende feste Wendung; *aller* + Infinitiv bildet das nahe Futur.'
  fr.a1.unit49.lesson06.teach.mathieu_merci_ca:
    title: Mathieu bedankt sich
    gloss: 'Mathieu: Danke, das hilft mir wirklich.'
    note: '*Aide* ist die *il/elle*-Form von *aider* (helfen); *m''* steht für *me* (mir).'
  fr.a1.unit49.lesson06.teach.camille_et_apres:
    title: Camille sagt den Ausgang voraus
    gloss: 'Camille: Und danach wirst du bestimmt sehr froh und stolz sein.'
    note: '*Sûrement* (bestimmt) drückt eine zuversichtliche Vorhersage aus; *fier* (stolz) ist ein neues, nützliches Adjektiv.'
  fr.a1.unit49.lesson06.teach.mathieu_oui_je:
    title: Mathieu stimmt zu
    gloss: 'Mathieu: Ja, das glaube ich auch.'
    note: '*Je pense aussi* ist die natürliche Art, der Meinung eines anderen zuzustimmen.'
  fr.a1.unit49.lesson06.teach.il_remplace_mathieu:
    title: Zusammenfassen mit il, elle und l'
    gloss: Mathieu ist nervös vor seiner ersten Schicht. Camille hilft ihm.
    note: '*Il* ersetzt den Namen eines Mannes (*il est nerveux*), *elle* den Namen einer Frau, und *l''* (*elle l''aide*) bedeutet „ihn“: drei kleine, aber wichtige Wörter, um über andere zu sprechen.'
