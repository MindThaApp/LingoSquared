course:
  title: Französisch A1
  description: 'Wortschatz zur engeren und weiteren Familie, das System der Possessivbegleiter mon/ma/mes und die Beschreibung eines Haushalts – die Geschichte von Inès und Mathieus Kochworkshop aus den Einheiten 01–02 wird fortgesetzt. Besonders wichtig: Französische Possessivbegleiter richten sich nach dem Genus des Nomens, nicht nach dem Besitzer.'
units:
  fr.a1.unit03.family:
    title: Die Familien von Inès und Mathieu
