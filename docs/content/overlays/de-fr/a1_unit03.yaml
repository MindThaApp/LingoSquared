  fr.a1.unit03.lesson01.immediate_family:
    title: Die engere Familie
  fr.a1.unit03.lesson02.possessives_mon_ma_mes:
    title: 'Possessivbegleiter: mon, ma, mes'
  fr.a1.unit03.lesson03.extended_family:
    title: Die erweiterte Familie
  fr.a1.unit03.lesson04.describing_family_size:
    title: Wie viele Personen leben zu Hause?
  fr.a1.unit03.lesson05.reading_a_family_profile:
    title: Ein Familienprofil lesen
  fr.a1.unit03.lesson06.family_photos_dialogue:
    title: Familienfotos mit Inès und Mathieu
teaching:
  fr.a1.unit03.lesson01.teach.mere:
    title: Mutter
    gloss: Mutter
    note: '*Mère* ist feminin. *Maman* ist im Alltag in der Familie üblicher, während *mère* neutral ist und in den Wortschatzlisten dieses Kurses verwendet wird.'
  fr.a1.unit03.lesson01.teach.pere:
    title: Vater
    gloss: Vater
    note: '*Père* ist maskulin. *Papa* ist das alltägliche Pendant, parallel zu *mère*/*maman*.'
  fr.a1.unit03.lesson01.teach.frere:
    title: Bruder
    gloss: Bruder
    note: '*Frère* ist maskulin Singular.'
  fr.a1.unit03.lesson01.teach.soeur:
    title: Schwester
    gloss: Schwester
    note: '*Sœur* ist feminin Singular. Das œ ist in der französischen Schreibung ein einzelner Buchstabe (eine Ligatur), nicht zwei getrennte Buchstaben.'
  fr.a1.unit03.lesson01.teach.fils:
    title: Sohn
    gloss: Sohn
    note: '*Fils* ist maskulin; das End-s wird hier ausnahmsweise ausgesprochen, während das l stumm ist.'
  fr.a1.unit03.lesson01.teach.fille:
    title: Tochter
    gloss: Tochter
    note: '*Fille* ist feminin Singular; dasselbe Wort bedeutet in anderen Zusammenhängen auch „Mädchen“.'
  fr.a1.unit03.lesson01.teach.parents:
    title: Parents
    gloss: Eltern
    note: '*Parents* ist maskulin Plural und bezeichnet Mutter und Vater zusammen.'
  fr.a1.unit03.lesson01.teach.freres_et_soeurs:
    title: Geschwister
    gloss: Brüder und Schwestern; Geschwister
    note: Das Französische hat kein einzelnes Wort für „Geschwister“; *frères et sœurs* nennt beide ausdrücklich.
  fr.a1.unit03.lesson02.teach.ma_mere:
    title: Meine Mutter
    gloss: meine Mutter
    note: '*Ma* ist die feminine Singularform von „mein“ (meine) und steht, weil *mère* feminin ist.'
  fr.a1.unit03.lesson02.teach.mon_pere:
    title: Mein Vater
    gloss: mein Vater
    note: '*Mon* ist die maskuline Singularform von „mein“ und steht, weil *père* maskulin ist.'
  fr.a1.unit03.lesson02.teach.mes_freres_et_soeurs:
    title: Meine Geschwister
    gloss: meine Geschwister
    note: '*Mes* ist die Pluralform von „mein“ und steht bei jedem Nomen im Plural, unabhängig vom Geschlecht – dasselbe Prinzip wie bei *ma*/*mon*, nur richtet es sich nach der Zahl statt nach dem Geschlecht.'
  fr.a1.unit03.lesson02.teach.as_tu_des_freres_et_soeurs:
    title: Nach Geschwistern fragen
    gloss: Hast du Geschwister?
    note: '*As-tu* ist die Frageform mit Inversion von *tu as* (du hast) – ein häufiges Fragemuster auf A1.'
  fr.a1.unit03.lesson02.teach.jai_deux_soeurs:
    title: Die Anzahl der Geschwister angeben
    gloss: Ich habe zwei Schwestern.
    note: '*J''ai* (ich habe) mit einer Zahl und dem Verwandtschaftswort ist die übliche Art, Geschwister zu beschreiben.'
  fr.a1.unit03.lesson02.teach.ta_famille_est_grande:
    title: Fragen, ob eine Familie groß ist
    gloss: Ist deine Familie groß?
    note: '*Ta* ist die feminine Singularform von „dein“ (informell) und passt zum femininen Nomen *famille*.'
  fr.a1.unit03.lesson02.teach.ma_famille_est_petite:
    title: Eine kleine Familie beschreiben
    gloss: Meine Familie ist klein.
    note: '*Petite* richtet sich nach dem femininen Nomen *famille*; bei einem maskulinen Nomen steht stattdessen *petit*. Das ist eine andere Art der Angleichung als bei *mon*/*ma*/*mes*: Diese richten sich zwar auch nach dem Nomen, drücken aber den Besitz aus, statt eine Eigenschaft zu beschreiben.'
  fr.a1.unit03.lesson03.teach.grand_pere:
    title: Großvater
    gloss: Großvater
    note: '*Grand-père* ist ein Kompositum mit Bindestrich und maskulin.'
  fr.a1.unit03.lesson03.teach.grand_mere:
    title: Großmutter
    gloss: Großmutter
    note: '*Grand-mère* ist ein Kompositum mit Bindestrich und feminin. Beachten Sie: *grand-* bleibt hier unverändert und wird nicht zu *grande-mère*.'
  fr.a1.unit03.lesson03.teach.grands_parents:
    title: Großeltern
    gloss: Großeltern
    note: '*Grands-parents* setzt beide Teile in den Plural (*grands*, nicht *grand-*); bei *grand-mère*/*grand-père* bleibt *grand-* im Singular dagegen unverändert.'
  fr.a1.unit03.lesson03.teach.oncle:
    title: Onkel
    gloss: Onkel
    note: '*Oncle* ist maskulin.'
  fr.a1.unit03.lesson03.teach.tante:
    title: Tante
    gloss: Tante
    note: '*Tante* ist feminin.'
  fr.a1.unit03.lesson03.teach.cousin:
    title: Cousin
    gloss: Cousin
    note: '*Cousin* ist maskulin im Singular; wie im Deutschen (Cousin/Cousine) unterscheidet auch das Französische das Geschlecht.'
  fr.a1.unit03.lesson03.teach.cousine:
    title: Cousine
    gloss: Cousine
    note: '*Cousine* ist feminin im Singular und entsteht, indem man ein -e an *cousin* hängt.'
  fr.a1.unit03.lesson03.teach.mes_grands_parents:
    title: Meine Großeltern
    gloss: meine Großeltern
    note: '*Mes* steht, weil *grands-parents* im Plural steht – auch wenn der Begriff Männer und Frauen einschließt.'
  fr.a1.unit03.lesson04.teach.combien_de_freres_et_soeurs:
    title: Nach der Anzahl der Geschwister fragen
    gloss: Wie viele Geschwister hast du?
    note: '*Combien de* (wie viele) steht im Französischen direkt vor dem Nomen, ohne ein zusätzliches Hilfsverb wie im deutschen „Wie viele … hast du?“ nötig zu haben; die Frage wird einfach mit dem Verb nach dem Nomen gebildet.'
  fr.a1.unit03.lesson04.teach.on_est_cinq:
    title: Die Haushaltsgröße angeben
    gloss: Wir sind zu sechst zu Hause.
    note: '*On est* (wörtlich „man ist“, aber im Alltag „wir sind“) ist im gesprochenen Französisch die natürliche und sehr gebräuchliche Art, die Zahl der Personen im Haushalt zu nennen – *nous sommes* ist formeller bzw. schriftsprachlich.'
  fr.a1.unit03.lesson04.teach.ma_famille_est_grande:
    title: Eine große Familie beschreiben
    gloss: Meine Familie ist groß.
    note: '*Grande* richtet sich nach dem femininen Nomen *famille*; bei einem maskulinen Nomen steht stattdessen *grand*.'
  fr.a1.unit03.lesson04.teach.jai_beaucoup_de_cousins:
    title: Sagen, dass man viele Cousins und Cousinen hat
    gloss: Ich habe viele Cousins und Cousinen.
    note: '*Beaucoup de* (viel/viele) steht vor dem Nomen; *de* wird hier nicht zu *du*/*des*, weil *beaucoup* die Menge bereits angibt.'
  fr.a1.unit03.lesson04.teach.tu_habites_pres_de_tes_parents:
    title: Fragen, ob jemand in der Nähe seiner Eltern wohnt
    gloss: Wohnst du in der Nähe deiner Eltern?
    note: '*Tes* ist die Pluralform von „dein“ (informell) und steht, weil *parents* im Plural steht.'
  fr.a1.unit03.lesson04.teach.jhabite_avec_mes_grands_parents:
    title: Sagen, mit wem man zusammenlebt
    gloss: Ich lebe bei meinen Großeltern.
    note: '*Avec* (mit) nennt die Personen, mit denen jemand wohnt; *j''habite* ist die *je*-Form von *habiter*, die Sie schon aus Einheit 1 kennen (*j''habite à Montreuil*).'
  fr.a1.unit03.lesson05.teach.profile_reading:
    title: Inès’ Familienprofil
    gloss: 'Ich heiße Inès. Ich bin einunddreißig und wohne mit meinen Großeltern in Paris. Meine Mutter und mein Vater wohnen in Lille. Ich habe zwei Schwestern und einen Bruder: Wir sind zu sechst zu Hause. Meine jüngere Schwester heißt Camille und ist zwanzig.'
    note: Dieses Profil greift Wortschatz und Strukturen aus den Lektionen 1–4 in einem zusammenhängenden Kurztext auf, statt in einzelnen Sätzen – genau die Lesefähigkeit „Wer ist wer?“, auf die sich auch die Leseaufgabe dieser Einheit konzentriert.
    glosses:
      trente: dreißig
      ans: Jahre alt
      grands-parents: Großeltern
      mère: Mutter
      père: Vater
      habitent: wohnen (von habiter)
      deux: zwei
      sœurs: Schwestern
      frère: Bruder
      six: sechs
      maison: Zuhause
      petite: jünger / klein
      sœur: Schwester
      vingt: zwanzig
  fr.a1.unit03.lesson05.teach.petite_soeur:
    title: Jüngere/kleine Schwester
    gloss: jüngere Schwester; kleine Schwester
    note: '*Petite* (feminin von *petit*) steht hier vor dem Nomen, wie die meisten kurzen, gebräuchlichen Adjektive im Französischen; die meisten anderen Adjektive stehen dagegen nach dem Nomen.'
  fr.a1.unit03.lesson05.teach.habite_third_person:
    title: Lebt (dritte Person)
    gloss: lebt
    note: '*Habite* ist die Form der 3. Person Singular von *habiter*. Sie dient dazu, ÜBER jemanden zu sprechen (*Inès habite...*), nicht als die Person selbst (*j''habite*, aus Einheit 1 und Lektion 4 dieser Einheit).'
  fr.a1.unit03.lesson05.teach.ses_third_person_plural:
    title: Ihr/sein/Ihr (vor einem Substantiv im Plural)
    gloss: ihre/seine/Ihre
    note: '*Ses* ist der Plural von *sa*/*son*. So wie *sa*/*son* bei einem Nomen im Singular „sein/ihr“ bedeutet, heißt *ses grands-parents* „ihre Großeltern“, wenn man in der 3. Person über Inès spricht.'
  fr.a1.unit03.lesson05.teach.a_third_person_avoir:
    title: Hat (3. Person)
    gloss: hat
    note: '*A* ist die Form der 3. Person Singular von *avoir*. Sie dient dazu, ÜBER jemanden zu sprechen (*elle a vingt ans*), nicht als die Person selbst (*j''ai* / *as-tu*, in den Lektionen 2–4 dieser Einheit durchgehend zu sehen).'
  fr.a1.unit03.lesson06.teach.line01:
    title: Familienfotos zeigen
    gloss: Inès zeigt Mathieu ein Foto und stellt ihre Eltern und ihre jüngere Schwester vor.
    note: '*Voici* (hier ist/sind) leitet etwas ein, auf das man zeigt – eine natürliche Wendung, um ein Foto zu zeigen.'
  fr.a1.unit03.lesson06.teach.line02:
    title: Herzlich reagieren und nach Geschwistern fragen
    gloss: Mathieu reagiert herzlich und fragt, ob sie noch weitere Geschwister hat.
    note: '*C''est adorable* ist eine natürliche, herzliche Reaktion auf das Foto eines kleinen Geschwisterkindes.'
  fr.a1.unit03.lesson06.teach.line03:
    title: Die Haushaltsgröße nennen und die Frage zurückgeben
    gloss: Inès sagt, dass sie zwei Schwestern und einen Bruder hat – zu Hause sind sie zu sechst – und fragt dann nach Mathieus Familie.
    note: '*On est six à la maison* nennt die Gesamtzahl der Personen im Haushalt und setzt das Muster aus Lektion 4 fort.'
  fr.a1.unit03.lesson06.teach.line04:
    title: Eine kleinere Familie beschreiben
    gloss: 'Mathieu sagt, seine Familie sei kleiner – nur drei Personen: seine Eltern und er –, aber er habe viele Cousins und Cousinen.'
    note: '*Mais* (aber) kennzeichnet den Gegensatz zwischen der kleinen engeren Familie und den vielen weiteren Verwandten.'
  fr.a1.unit03.lesson06.teach.line05:
    title: Fragen, ob jemand in der Nähe seiner Eltern wohnt
    gloss: Inès fragt, ob Mathieu in der Nähe seiner Eltern wohnt.
    note: '*Près de* (in der Nähe von) ist eine gebräuchliche Art, räumliche Nähe auszudrücken.'
  fr.a1.unit03.lesson06.teach.line06:
    title: Die Entfernung erklären und vom Kontakt erzählen
    gloss: 'Mathieu verneint: Seine Eltern wohnen in Lyon, und sie telefonieren jede Woche miteinander.'
    note: Knüpft an die in Einheit 1 genannte Tatsache an, dass Mathieu aus Lyon kommt – seine Eltern bleiben dort, während er in Saint-Ouen wohnt.
  fr.a1.unit03.lesson06.teach.line07:
    title: Verständnis zeigen und von der eigenen Situation erzählen
    gloss: Inès sagt, dass sie das versteht und dass sie hier in Paris bei ihren Großeltern wohnt.
    note: '*Je comprends* (ich verstehe) ist eine kurze, natürliche Art, auf das Gesagte zu reagieren, bevor man eine eigene, dazu passende Information ergänzt.'
  fr.a1.unit03.lesson06.teach.line08:
    title: Mit einer herzlichen Bemerkung abschließen
    gloss: Mathieu sagt, es sei schön, die Familie in der Nähe zu haben.
    note: '*C''est bien d''avoir sa famille près de soi* beschließt das Gespräch mit einem warmen, nachdenklichen Ton und greift das Muster *près de* aus Lektion 4 wieder auf.'
