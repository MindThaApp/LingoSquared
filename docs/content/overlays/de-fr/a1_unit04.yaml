answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Französisch A1
  description: 'Wortschatz für den Markt, nach Preisen und Mengen fragen mit combien/kilo/litre sowie der Unterschied zwischen du/de la und schlichtem de nach Mengenangaben. Die Geschichte vom Kochworkshop von Inès und Mathieu geht hier auf dem Markt weiter. Besonders wichtig: Nach einer ausdrücklichen Mengenangabe steht im Französischen kein Teilungsartikel (un kilo de tomates, nicht un kilo des tomates).'
units:
  fr.a1.unit04.shopping:
    title: Einkaufen mit Inès
