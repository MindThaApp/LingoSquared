  fr.a1.unit04.lesson01.au_marche:
    title: Auf dem Markt
  fr.a1.unit04.lesson02.combien_ca_coute:
    title: Wie viel kostet das?
  fr.a1.unit04.lesson03.dialogue_marche:
    title: Auf dem Markt mit Inès und Mathieu
teaching:
  fr.a1.unit04.lesson01.teach.marche:
    title: Der Markt
    gloss: der Markt
    note: '*Marché* ist maskulin.'
    example_gloss: Der Markt ist samstags geöffnet.
  fr.a1.unit04.lesson01.teach.boulangerie:
    title: Die Bäckerei
    gloss: die Bäckerei
    note: '*Boulangerie* ist feminin; das ist das Geschäft speziell für Brot, im Unterschied zur *pâtisserie* (Konditorei).'
    example_gloss: Es gibt eine gute Bäckerei in der Nähe.
  fr.a1.unit04.lesson01.teach.legumes:
    title: Das Gemüse
    gloss: Gemüse
    note: '*Légumes* ist maskulin im Plural.'
    example_gloss: Ich kaufe frisches Gemüse für den Workshop.
  fr.a1.unit04.lesson01.teach.fruits:
    title: Das Obst
    gloss: Obst
    note: '*Fruits* ist maskulin im Plural. Im Französischen steht oft der Plural (*les fruits*), wo das Deutsche das Sammelwort „Obst“ verwendet.'
    example_gloss: Obst ist diesen Monat teuer.
  fr.a1.unit04.lesson01.teach.prix:
    title: Der Preis
    gloss: der Preis
    note: '*Prix* ist maskulin und unveränderlich – Singular und Plural werden gleich geschrieben.'
    example_gloss: Was kostet das Brot?
  fr.a1.unit04.lesson01.teach.cher:
    title: Teuer
    gloss: teuer
    note: '*Cher* ist die maskuline Form; *chère* ist feminin, *chers*/*chères* sind die Pluralformen. Das Adjektiv richtet sich nach dem Nomen, das es beschreibt.'
    example_gloss: Dieser Käse ist zu teuer.
  fr.a1.unit04.lesson01.teach.pas_cher:
    title: Heute nicht teuer
    gloss: Das Gemüse ist heute nicht teuer.
    note: '*Pas cher(s)* (ohne *ne*) ist die übliche gesprochene Art zu sagen, dass etwas günstig ist; die vollständige geschriebene Form lautet *ne sont pas chers*.'
  fr.a1.unit04.lesson02.teach.un_kilo_de:
    title: Ein Kilo
    gloss: ein Kilo
    note: '*De* folgt direkt auf die Mengenangabe, ohne Artikel – siehe die Grammatikanmerkung *de nach Mengenangabe* unten.'
    example_gloss: Ich hätte gern ein Kilo Tomaten.
  fr.a1.unit04.lesson02.teach.un_litre_de:
    title: Ein Liter
    gloss: ein Liter
    note: '*Litre* ist maskulin und wird für Flüssigkeiten verwendet, so wie *kilo* für feste Waren.'
    example_gloss: Einen Liter Milch, bitte.
  fr.a1.unit04.lesson02.teach.euro:
    title: Ein Euro
    gloss: ein Euro
    note: '*Euro* bildet den Plural regelmäßig mit -s: *deux euros*, *cinq euros*.'
    example_gloss: Das kostet fünf Euro.
  fr.a1.unit04.lesson02.teach.de_after_quantity:
    title: De nach einer Mengenangabe
    gloss: von
    note: Nach einer ausdrücklichen Mengenangabe (*un kilo*, *un litre*, *beaucoup*, etwa in *beaucoup de cousins*) steht im Französischen nur *de*; *du*/*de la*/*des* entfallen ganz – *un kilo de tomates*, niemals *un kilo des tomates*.
  fr.a1.unit04.lesson02.teach.combien_ca_coute:
    title: Nach dem Preis fragen
    gloss: Wie viel kostet es?
    note: '*Combien* (wie viel) plus *ça coûte* (es kostet) ist die allgemeine Standardfrage nach dem Preis.'
  fr.a1.unit04.lesson02.teach.cest_combien_pain:
    title: Nach dem Preis eines bestimmten Artikels fragen
    gloss: Was kostet das Brot?
    note: '*C''est combien, [item] ?* nennt den Artikel, nach dessen Preis man fragt. Das ist eine häufige Alternative zu *Combien ça coûte ?*.'
  fr.a1.unit04.lesson02.teach.ca_fait_combien:
    title: Nach dem Gesamtbetrag fragen
    gloss: Wie viel macht das insgesamt?
    note: '*Ça fait combien ?* fragt nach dem Gesamtbetrag, typischerweise am Ende des Einkaufs und nicht für einen einzelnen Artikel.'
  fr.a1.unit04.lesson03.teach.line01:
    title: Tomaten bestellen
    gloss: Inès begrüßt den Verkäufer und bittet um ein Kilo Tomaten.
    note: Verbindet *Bonjour* mit dem Muster *je voudrais* + Menge.
  fr.a1.unit04.lesson03.teach.line02:
    title: Fragen, ob noch etwas benötigt wird
    gloss: Der Verkäufer bestätigt und fragt, ob sie noch etwas braucht.
    note: '*Autre chose ?* (Sonst noch etwas?) ist die übliche Nachfrage von Verkäufern.'
  fr.a1.unit04.lesson03.teach.line03:
    title: Käse dazunehmen und nach dem Preis fragen
    gloss: Inès nimmt noch ein wenig Käse und fragt nach dem Preis.
    note: '*Un peu de fromage* (ein wenig Käse) folgt demselben Muster mit einfachem *de* wie *un kilo de*.'
  fr.a1.unit04.lesson03.teach.line04:
    title: Einen Kilopreis nennen
    gloss: Der Verkäufer sagt, dass es acht Euro pro Kilo kostet.
    note: '*X euros le kilo* ist die natürliche französische Art, einen Preis pro Einheit anzugeben; *le* bedeutet hier „pro“ und nicht „der/die/das“.'
  fr.a1.unit04.lesson03.teach.line05:
    title: Erklären, warum er hier Brot braucht
    gloss: Mathieu sagt, dass er auch Brot möchte, aber die Bäckerei heute geschlossen ist.
    note: '*Fermée* (geschlossen) ist die feminine Form und richtet sich nach *la boulangerie*.'
  fr.a1.unit04.lesson03.teach.line06:
    title: Eine Alternative vorschlagen
    gloss: 'Inès beruhigt ihn: Brot kann man auch hier kaufen.'
    note: '*On peut* (man kann / wir können) + Infinitiv ist eine gängige umgangssprachliche Art, eine Möglichkeit auszudrücken.'
  fr.a1.unit04.lesson03.teach.line07:
    title: Bestätigen und den Gesamtbetrag nennen
    gloss: Der Verkäufer bestätigt, dass er frisches Brot hat, fragt sich, wie viel es insgesamt macht, und nennt dreizehn Euro fünfzig.
    note: '*Ça fait combien en tout ?* denkt der Verkäufer hier laut nach, bevor er den Gesamtbetrag nennt; er fragt nicht wirklich Inès.'
  fr.a1.unit04.lesson03.teach.line08:
    title: Sich beim Verkäufer bedanken
    gloss: Inès bedankt sich herzlich, während sie bezahlt.
    note: '*Voilà* begleitet hier das Überreichen des Geldes; ein typisches Wort zur Geste.'
