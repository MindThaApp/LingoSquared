answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Französisch A1
  description: 'Einen einfachen Plan vorschlagen, annehmen, ablehnen und terminieren – die Geschichte um Inès und Mathieu aus dem Kochworkshop geht weiter: Sie verabreden sich, um vor der Samstagsstunde gemeinsam die Zutaten einzukaufen. Besonders wichtig: *se retrouver* (sich treffen, reflexiv/reziprok) wird im Deutschen mit „sich treffen“ wiedergegeben, und *vers* + Uhrzeit drückt eine ungefähre, keine genaue Uhrzeit aus.'
units:
  fr.a1.unit11.plans:
    title: Wann treffen wir uns?
lessons:
  fr.a1.unit11.lesson01.vocabulaire_projets:
    title: Eine Uhrzeit vorschlagen
  fr.a1.unit11.lesson02.accepter_refuser:
    title: Zusagen oder absagen
  fr.a1.unit11.lesson03.dialogue_projet_courses:
    title: Den Einkauf planen
teaching:
  fr.a1.unit11.lesson01.teach.libre:
    title: Frei / verfügbar
    gloss: frei / verfügbar
    note: '*Libre* beschreibt hier die Verfügbarkeit einer Person; für etwas, das nichts kostet, sagt man im Französischen *gratuit*.'
    example_gloss: Hast du am Samstag Zeit?
  fr.a1.unit11.lesson01.teach.occupe:
    title: Beschäftigt
    gloss: beschäftigt
    note: 'Das direkte Gegenteil von *libre*. Es richtet sich im Geschlecht nach der Person: *occupé* / *occupée*.'
    example_gloss: Am Freitagabend bin ich beschäftigt.
  fr.a1.unit11.lesson01.teach.se_retrouver:
    title: Sich treffen
    gloss: sich treffen
    note: In dieser Bedeutung ist *se retrouver* reziprok – zwei oder mehr Personen treffen einander – anders als *trouver* (finden).
    example_gloss: Wo treffen wir uns heute Abend?
  fr.a1.unit11.lesson01.teach.vers:
    title: Gegen (eine Uhrzeit)
    gloss: gegen / um (eine Uhrzeit)
    note: '*Vers* + Uhrzeit drückt eine ungefähre Zeit aus, weicher als die Nennung einer genauen Stunde.'
    example_gloss: Ich komme gegen sieben Uhr vorbei.
  fr.a1.unit11.lesson01.teach.ca_te_dit_de:
    title: Wie wäre es mit ...?
    gloss: Wie wäre es, wenn wir zusammen einkaufen gehen?
    note: '*Ça te dit de... ?* + Infinitiv ist eine gängige, lockere Art, etwas vorzuschlagen – entspannter als *Voulez-vous... ?*'
  fr.a1.unit11.lesson01.teach.venir_chercher:
    title: Jemanden abholen
    gloss: Holst du mich gegen 18 Uhr ab?
    note: '*Venir chercher quelqu''un* bedeutet, jemanden abzuholen, nicht nur „suchen“.'
  fr.a1.unit11.lesson01.teach.daccord_a_tout_a_lheure:
    title: Einverstanden, bis gleich
    gloss: Okay, bis gleich!
    note: '*D''accord* (einverstanden/okay) bestätigt einen Plan; *à tout à l''heure* sagt man, wenn man jemanden später am selben Tag wiedersieht.'
  fr.a1.unit11.lesson02.teach.je_ne_peux_pas:
    title: Einen Plan absagen
    gloss: Ich kann nicht, ich bin beschäftigt.
    note: '*Je ne peux pas* (ich kann nicht) + ein Grund ist eine einfache, höfliche Art abzusagen.'
  fr.a1.unit11.lesson02.teach.avec_plaisir:
    title: Gern zusagen
    gloss: Sehr gern!
    note: '*Avec plaisir* (wörtlich „mit Vergnügen“) ist eine herzliche, begeisterte Art, eine Einladung anzunehmen.'
  fr.a1.unit11.lesson02.teach.a_quelle_heure_on_se_voit:
    title: Nach der Uhrzeit fragen
    gloss: Um wie viel Uhr treffen wir uns?
    note: '*On se voit* (umgangssprachlich „wir sehen uns“) ist eine gängige, lockere Alternative zu *se retrouver*, um sich zu verabreden.'
  fr.a1.unit11.lesson02.teach.devant_le_marche:
    title: Einen Ort vorschlagen
    gloss: Vor dem Markt, passt dir das?
    note: Mit *Ça te va ?* (passt dir das?) fragt man, ob ein vorgeschlagenes Detail für den anderen in Ordnung ist.
  fr.a1.unit11.lesson02.teach.parfait_alors:
    title: Den Plan bestätigen
    gloss: Perfekt, dann bis Freitag!
    note: '*Alors* bedeutet hier „dann“ im Sinne einer Bestätigung des Ergebnisses und schließt die Planung ab.'
  fr.a1.unit11.lesson03.teach.line01:
    title: Gemeinsames Einkaufen vorschlagen
    gloss: Inès fragt Mathieu, ob er vor dem Workshop gemeinsam mit ihr einkaufen gehen möchte.
    note: '*Ça te dit de... ?* eröffnet das Gespräch mit einem lockeren Vorschlag.'
  fr.a1.unit11.lesson03.teach.line02:
    title: Zusagen und nach dem Ort fragen
    gloss: Mathieu sagt „sehr gern“ und fragt, wo sie sich treffen.
    note: Verbindet *Avec plaisir* (sehr gern) mit *se retrouver* (sich treffen).
  fr.a1.unit11.lesson03.teach.line03:
    title: Ort und Tag vorschlagen
    gloss: 'Inès schlägt vor: vor dem Markt, am Freitagabend.'
    note: Ein kurzer Vorschlag mit Ort (*devant le marché*) und Tag (*vendredi soir*).
  fr.a1.unit11.lesson03.teach.line04:
    title: Zusagen und nach der Uhrzeit fragen
    gloss: Mathieu ist einverstanden und fragt nach der Uhrzeit.
    note: '*D''accord* bestätigt Ort und Tag; die Nachfrage klärt die genaue Uhrzeit.'
  fr.a1.unit11.lesson03.teach.line05:
    title: Eine genaue Uhrzeit vorschlagen
    gloss: Inès fragt, ob Mathieu sie gegen 18 Uhr abholt.
    note: Verwendet *venir chercher* + *vers* mit einer bestimmten Uhrzeit.
  fr.a1.unit11.lesson03.teach.line06:
    title: Alles bestätigen
    gloss: 'Mathieu sagt: perfekt, dann bis Freitag, 18 Uhr vor dem Markt.'
    note: Wiederholt alle drei Details des Plans (Tag, Uhrzeit, Ort), um das Gespräch klar abzuschließen.
