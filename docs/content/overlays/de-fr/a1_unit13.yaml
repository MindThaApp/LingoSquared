course:
  title: Französisch A1
  description: 'Vorlieben und Abneigungen ausdrücken und erfragen, weiter mit der Geschichte von Inès und Mathieu im Kochworkshop, in der sie für Samstag zwischen zwei Rezepten wählen. Besonders wichtig: *préférer X à Y* („X Y vorziehen“) wird mit *à* gebildet, nicht mit *que*.'
units:
  fr.a1.unit13.preferences:
    title: Was bevorzugst du?
lessons:
  fr.a1.unit13.lesson01.vocabulaire_preferences:
    title: Mögen, bevorzugen, hassen
  fr.a1.unit13.lesson02.demander_les_preferences:
    title: Nach Vorlieben fragen
  fr.a1.unit13.lesson03.dialogue_choisir_la_recette:
    title: Das Rezept für Samstag auswählen
teaching:
  fr.a1.unit13.lesson01.teach.preferer:
    title: Vorziehen
    gloss: vorziehen
    note: '*Préférer* ist ein -ER-Verb mit Akzentwechsel: *je préfère*, aber *nous préférons* (in den Formen *nous/vous* ändert sich der Akzent nicht).'
    example_gloss: Ich ziehe die Schokoladentorte vor.
  fr.a1.unit13.lesson01.teach.aimer_mieux:
    title: Lieber mögen
    gloss: lieber mögen
    note: '*Aimer mieux* ist eine gängige Alternative zu *préférer*, vergleicht aber mit *que* (*aimer mieux X que Y*), während *préférer* mit *à* steht (*préférer X à Y*).'
    example_gloss: Ich mag herzhafte Gerichte lieber als süße Gerichte.
  fr.a1.unit13.lesson01.teach.detester:
    title: Hassen
    gloss: hassen
    note: '*Détester* drückt eine starke Abneigung aus, stärker als *ne pas aimer* (nicht mögen).'
    example_gloss: Mathieu hasst zu scharfe Gewürze; er bevorzugt milde Gerichte.
  fr.a1.unit13.lesson01.teach.plutot:
    title: Eher
    gloss: eher
    note: '*Plutôt* schwächt eine Vorliebe ab – „eher“ dies, ohne die Alternative ganz auszuschließen.'
    example_gloss: Ich nehme lieber Käse.
  fr.a1.unit13.lesson01.teach.sucre:
    title: Süß
    gloss: süß
    note: '*Sucré* beschreibt Essen als „süß“; *doux* dagegen bedeutet „sanft, mild“ – die beiden Wörter sollte man nicht verwechseln.'
    example_gloss: Dieses Dessert ist sehr süß.
  fr.a1.unit13.lesson01.teach.sale:
    title: Herzhaft / salzig
    gloss: herzhaft / salzig
    note: '*Salé* ist im französischen Essensvokabular der übliche Gegensatz zu *sucré* und deckt „herzhaft“ ebenso ab wie „salzig“.'
    example_gloss: Der Käse ist salzig.
  fr.a1.unit13.lesson01.teach.la_recette:
    title: Das Rezept
    gloss: das Rezept
    note: '*La recette* ist immer feminin.'
    example_gloss: Dieses Rezept ist einfach.
  fr.a1.unit13.lesson02.teach.quest_ce_que_tu_preferes:
    title: Nach einer Vorliebe fragen
    gloss: Was bevorzugst du?
    note: '*Qu''est-ce que...* ist in der gesprochenen Sprache die übliche Form, eine offene Frage mit „was“ zu bilden.'
  fr.a1.unit13.lesson02.teach.je_prefere_x_a_y:
    title: Eine Vorliebe zwischen zwei Dingen ausdrücken
    gloss: Ich ziehe die Torte der Quiche vor.
    note: Bei *préférer X à Y* steht *à* vor dem weniger bevorzugten Element – nicht *que*, wie man es von „lieber als“ erwarten könnte.
  fr.a1.unit13.lesson02.teach.tu_aimes_plutot:
    title: Nach einer allgemeinen Tendenz fragen
    gloss: Magst du eher Süßes oder Herzhaftes?
    note: Verbindet *plutôt* (Lektion 1) mit einer Auswahlfrage mit *ou* (oder).
  fr.a1.unit13.lesson02.teach.moi_aussi_moi_non:
    title: Zustimmen oder widersprechen
    gloss: Ich auch. / Ich nicht.
    note: '*Moi aussi* stimmt einer bejahten Aussage zu; *moi non* widerspricht oder nennt die gegenteilige Vorliebe.'
  fr.a1.unit13.lesson02.teach.ca_ne_me_derange_pas:
    title: Sagen, dass es einem egal ist
    gloss: Es macht mir nichts aus.
    note: '*Ça ne me dérange pas* ist eine nützliche, neutrale Antwort, wenn man zwischen zwei Möglichkeiten wählen soll und beide recht sind.'
  fr.a1.unit13.lesson02.teach.on_pourrait_faire:
    title: Eine Möglichkeit vorschlagen
    gloss: Wir könnten eine Quiche machen, oder?
    note: '*On pourrait* (wir könnten) + Infinitiv schlägt behutsam eine Möglichkeit vor; mit *non ?* am Ende bittet man um Zustimmung.'
  fr.a1.unit13.lesson03.teach.line01:
    title: Fragen, was gemacht wird
    gloss: Mathieu fragt, was sie am Samstag machen – eine Torte oder eine Quiche?
    note: '*Qu''est-ce qu''on prépare... ?* (was machen wir) verwendet *on* für „wir“, wie in der Umgangssprache üblich.'
  fr.a1.unit13.lesson03.teach.line02:
    title: Eine Vorliebe nennen und zurückfragen
    gloss: Inès sagt, dass sie die Torte bevorzugt, eher süß, und fragt Mathieu.
    note: '*Et toi ?* (und du?) ist die einfachste Art, eine Aussage in eine Frage an das Gegenüber zu verwandeln.'
  fr.a1.unit13.lesson03.teach.line03:
    title: Die gegenteilige Vorliebe nennen
    gloss: Mathieu sagt, dass er Herzhaftes lieber mag und die Quiche der Torte vorzieht.
    note: Verwendet direkt das Muster *préférer X à Y* aus Lektion 2 wieder.
  fr.a1.unit13.lesson03.teach.line04:
    title: Einen Kompromiss vorschlagen
    gloss: Inès schlägt vor, dass sie beides machen könnten, oder?
    note: '*Les deux* (beide) löst die Meinungsverschiedenheit, indem beide Rezepte gemacht werden.'
  fr.a1.unit13.lesson03.teach.line05:
    title: Den Kompromiss annehmen
    gloss: Mathieu sagt, das sei eine gute Idee, es mache ihm überhaupt nichts aus.
    note: '*Ça ne me dérange pas du tout* verstärkt den Satz aus Lektion 2 mit *du tout* (überhaupt).'
  fr.a1.unit13.lesson03.teach.line06:
    title: Die Entscheidung bestätigen
    gloss: Inès sagt, perfekt, eine süße Torte und eine herzhafte Quiche für Samstag.
    note: Fasst die endgültige Entscheidung klar zusammen und beendet das Gespräch.
