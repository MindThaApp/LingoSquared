    gloss: 'Mathieu: Dann nehme ich den Zug, zusammen mit Camille.'
  fr.a1.unit56.lesson05.teach.camille_voyage_tous:
    title: Wer fährt wie?
    gloss: Camille fährt jeden Tag mit dem Zug zur Arbeit. Mathieu fährt meistens mit dem Rad, aber wenn es regnet, nimmt er auch den Zug. Thomas fährt lieber mit dem Auto. Léa wohnt ganz in der Nähe und geht zu Fuß zur Arbeit. Wie kommen Sie zur Arbeit?
    note: Der Text stellt vier verschiedene Arten gegenüber, zur Arbeit zu kommen, und eine Bedingung (Regen), ähnlich wie der Text zum Sportvergleich in der vorigen Einheit.
    glosses:
      voyage: reist, fährt
      tous: jeder
      jours: Tag
      train: der Zug
      travail: arbeiten
      vélo: fährt Rad
      surtout: normalerweise
      pleut: regnet
      prend: nimmt
      aller: fährt Auto
      préfère: bevorzugt, zieht vor
      voiture: das Auto
      habite: wohnt
      près: in der Nähe
      marche: geht zu Fuß
      vas: reist, fährst
  fr.a1.unit56.lesson05.teach.lea_habite_tout:
    title: Léa wohnt in der Nähe und geht zu Fuß zur Arbeit
    gloss: Léa wohnt in der Nähe und geht zu Fuß zur Arbeit.
  fr.a1.unit56.lesson06.teach.camille_on_va:
    title: Camille schlägt vor
    gloss: 'Camille: Fahren wir zusammen mit dem Rad zum Sprachencafé?'
  fr.a1.unit56.lesson06.teach.thomas_je_prefere:
    title: Thomas fährt lieber Auto
