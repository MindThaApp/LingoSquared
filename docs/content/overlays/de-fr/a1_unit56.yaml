  fr.a1.unit56.lesson04.teach.pour_les_transports:
    title: À vélo, en train
    gloss: Das Französische verwendet *à* bei Fortbewegungsmitteln, auf denen man sitzt oder die man selbst bewegt (*à vélo*, *à pied*), und *en* bei Verkehrsmitteln, in denen man sitzt (*en train*, *en voiture*).
    note: Lernende sagen manchmal fälschlich *par vélo* oder *dans le train*. Behandeln Sie *à vélo*, *à pied*, *en train* und *en voiture* als feste Wendungen.
  fr.a1.unit56.lesson04.teach.mathieu_alors_je:
