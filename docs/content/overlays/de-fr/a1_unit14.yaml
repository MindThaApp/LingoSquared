course:
  title: Französisch A1
  description: 'Einfache Vergleiche (plus/moins/aussi … que) und Superlative (le/la plus …); die Kochworkshop-Geschichte von Inès und Mathieu geht weiter: Beim Einkaufen vergleichen sie zwei Käsesorten. Besonders wird hervorgehoben, dass *meilleur* (besser) und *le meilleur* (der beste) unregelmäßig sind, anders als das regelmäßige Muster *plus … que* bei den meisten anderen Adjektiven. Das ist wie im Deutschen: „gut – besser – am besten“ ist ebenfalls unregelmäßig.'
units:
  fr.a1.unit14.comparisons:
    title: Mehr oder weniger?
lessons:
  fr.a1.unit14.lesson01.vocabulaire_comparaisons:
    title: Mehr, weniger, genauso
  fr.a1.unit14.lesson02.superlatifs:
    title: Am meisten, am wenigsten
  fr.a1.unit14.lesson03.dialogue_comparer_fromages:
    title: Zwei Käsesorten auf dem Markt vergleichen
teaching:
  fr.a1.unit14.lesson01.teach.plus_que:
    title: Mehr … als
    gloss: mehr … als
    note: '*Plus + Adjektiv + que* ist der übliche Komparativ im Französischen. Das Adjektiv selbst verändert sich dabei nicht, es gibt keine Endung wie deutsch „-er“ in „billiger“.'
    example_gloss: Dieser Käse ist teurer als der andere.
  fr.a1.unit14.lesson01.teach.moins_que:
    title: Weniger … als
    gloss: weniger … als
    note: '*Moins* ist das direkte Gegenteil von *plus* im selben Vergleichsmuster.'
    example_gloss: Dieses Rezept ist weniger schwierig als das andere.
  fr.a1.unit14.lesson01.teach.aussi_que:
    title: So … wie
    gloss: so … wie
    note: '*Aussi + adjective + que* drückt aus, dass zwei Dinge gleich sind (Gleichheit): „genauso … wie“.'
    example_gloss: Die Tarte ist so gut wie die Quiche.
  fr.a1.unit14.lesson01.teach.meilleur_que:
    title: Besser als
    gloss: besser als
    note: '*Meilleur* ist der unregelmäßige Komparativ von *bon* (gut). Man sagt im Französischen nicht *plus bon*.'
    example_gloss: Dieser Kuchen ist besser als der erste.
  fr.a1.unit14.lesson01.teach.cher_bon_marche:
    title: Teuer, billig
    gloss: teuer, billig / preiswert
    note: '*Bon marché* ist unveränderlich (es ändert nie seine Form), auch wenn es aussieht, als müsste es sich wie andere Adjektive angleichen.'
    example_gloss:
    - Der Käse ist teuer.
    - Das Gemüse ist billig.
  fr.a1.unit14.lesson01.teach.facile_difficile:
    title: Einfach, schwierig
    gloss: einfach, schwierig
    note: Ein häufiges Adjektivpaar, um Rezepte zu beschreiben. Beide haben im Maskulinum und Femininum dieselbe Form; im Plural kommt ein -s dazu (*faciles*, *difficiles*).
    example_gloss:
    - Dieses Rezept ist einfach.
    - Die Quiche ist ein bisschen schwierig.
  fr.a1.unit14.lesson02.teach.le_plus_cher:
    title: Der/die/das teuerste
    gloss: der/die/das teuerste
    note: '*Le/la plus + Adjektiv* bildet den Superlativ. Der bestimmte Artikel ist hier zwingend, beim Komparativ steht er nicht.'
    example_gloss: Das ist der teuerste Käse auf dem Markt.
  fr.a1.unit14.lesson02.teach.la_moins_chere:
    title: Der/die/das günstigste
    gloss: der/die/das günstigste
    note: '*La moins chère* richtet sich nach dem femininen *recette*. Die maskuline Form ist *le moins cher*.'
    example_gloss: Das ist das günstigste Rezept.
  fr.a1.unit14.lesson02.teach.le_meilleur:
    title: Der/die/das beste
    gloss: der/die/das beste
    note: '*Le meilleur* ist der unregelmäßige Superlativ von *bon* und passt zum unregelmäßigen Komparativ *meilleur* aus der ersten Lektion.'
    example_gloss: Das ist der beste Kuchen im Workshop!
  fr.a1.unit14.lesson02.teach.la_plus_facile:
    title: Der/die/das einfachste
    gloss: der/die/das einfachste
    note: Ein regelmäßiger Superlativ, der direkt dem Muster *le/la plus + Adjektiv* folgt.
    example_gloss: Das ist das einfachste Rezept.
  fr.a1.unit14.lesson02.teach.grammar_superlative_note:
    title: Superlativ-Muster
    gloss: le/la plus + Adjektiv; meilleur ist unregelmäßig
    note: Die meisten französischen Superlative sind regelmäßig (*le/la plus + Adjektiv*), aber *bon* → *meilleur* → *le meilleur* ist eine Ausnahme, die man auswendig lernen muss. Ähnlich ist es im Deutschen bei „gut – besser – am besten“.
  fr.a1.unit14.lesson02.teach.comparer_les_prix:
    title: Vorschlagen, Preise zu vergleichen
    gloss: Vergleichen wir die Preise, bevor wir kaufen.
    note: '*Comparons* ist der Imperativ der *nous*-Form von *comparer*, also „Vergleichen wir“, eine natürliche Wendung beim Einkaufen.'
  fr.a1.unit14.lesson03.teach.line01:
    title: Zwei Möglichkeiten bemerken
    gloss: Inès sagt, schau, es gibt zwei Käsesorten – welche nehmen sie?
    note: '*Lequel* (welcher) bittet das Gegenüber, zwischen zwei bereits genannten Möglichkeiten zu wählen.'
  fr.a1.unit14.lesson03.teach.line02:
    title: Vergleichen und die Qualität einschätzen
    gloss: Mathieu sagt, dieser sei teurer als der andere, sehe aber besser aus.
    note: '*Avoir l''air* + Adjektiv („aussehen“, „wirken“) schwächt eine Aussage über die Qualität ab, wenn man noch nicht probiert hat.'
  fr.a1.unit14.lesson03.teach.line03:
    title: Einem Vergleich widersprechen
    gloss: Inès fragt, ob er sich sicher ist, und sagt, sie finde den anderen genauso gut und billiger.
    note: Hier stehen *aussi* und *moins* aus der ersten Lektion in einer Antwort, um höflich zu widersprechen. *Que* entfällt, weil aus dem Zusammenhang klar ist, mit welchem Käse (dem von Mathieu) verglichen wird.
  fr.a1.unit14.lesson03.teach.line04:
    title: Den Preis zugeben
    gloss: Mathieu stimmt zu, das stimmt – es ist das günstigere von beiden.
    note: '*Des deux* (von beiden) beschränkt den Superlativ auf dieses Paar statt auf den ganzen Markt.'
  fr.a1.unit14.lesson03.teach.line05:
    title: Die endgültige Entscheidung treffen
    gloss: Inès sagt, dann nehmen wir den da, das sei die beste Option für den Workshop.
    note: '*Celui-là* (der da) bezieht sich auf den eben besprochenen günstigeren Käse.'
  fr.a1.unit14.lesson03.teach.line06:
    title: Den Vorteil festhalten
    gloss: Mathieu stimmt zu und sagt, dass ihnen mehr Geld für den Nachtisch übrig bleibt!
    note: '*Il nous reste* (wörtlich: „es bleibt uns“) ist eine gängige Art zu sagen: „Wir haben noch … übrig.“'
