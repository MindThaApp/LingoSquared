teaching:
  fr.a1.unit53.lesson01.teach.grand_petit:
    title: Groß und klein
    gloss: groß / klein
    note: '*Grand* beschreibt eine große Person, *petit* eine kleine. Beide richten sich nach der Person: *grand/grande*, *petit/petite*.'
    example_gloss:
    - Léa ist groß.
    - Thomas ist klein.
  fr.a1.unit53.lesson01.teach.vieux_jeune:
    title: Alt und jung
    gloss: alt / jung
    note: '*Vieux* und *jeune* geben hier einen allgemeinen Eindruck vom Alter wieder, keine genaue Zahl von Jahren.'
    example_gloss:
    - Opa ist alt.
    - Mathieu ist jung.
  fr.a1.unit53.lesson01.teach.pour_un_age:
    title: 'Alter: eine Zahl oder ein Eindruck'
    gloss: Für ein genaues Alter verwendet das Französische *avoir* (*Il a vingt ans*), aber *être vieux* drückt einen allgemeinen Eindruck aus (*Mon grand-père est vieux*).
    note: Sie kennen schon *Quel âge as-tu ?* für ein genaues Alter. Hier beschreibt *vieux*, wie alt jemand AUSSIEHT, ganz ohne Zahl.
  fr.a1.unit53.lesson01.teach.lea_est_grande:
    title: Léa ist groß und Thomas ist klein
    gloss: Léa ist groß und Thomas ist klein.
    note: Ein einfacher Satz mit *et* (und), der den direkten Vergleich in Lektion 5 vorbereitet.
  fr.a1.unit53.lesson02.teach.les_cheveux:
    title: Haare
    gloss: die Haare
    note: '*Les cheveux* steht immer im Plural und ist maskulin. Im Deutschen sagt man dagegen „die Haare“ oder auch „das Haar“ im Singular.'
    example_gloss: Mathieu hat kurze schwarze Haare.
  fr.a1.unit53.lesson02.teach.blonds_bruns_gris:
    title: Blond, braun und grau
    gloss: blond / braun / grau
    note: 'Drei Haarfarben. Bei *cheveux* erhält die Farbe ein Plural-*s*: *blonds*, *bruns*. *Gris* endet schon auf *s*, und *noirs* (schwarz) kennen Sie aus der Kleidungseinheit.'
    example_gloss:
    - Camille hat blonde Haare.
    - Thomas hat braune Haare.
    - Opa hat graue Haare.
  fr.a1.unit53.lesson02.teach.longs_courts:
    title: Lang und kurz (Haare)
    gloss: lang / kurz (Haare)
    note: '*Longs* (lang) greift den Größengedanken aus Lektion 1 auf und beschreibt nun die Haarlänge. *Courts* (kurz) ist neu, und beide erhalten bei *cheveux* ein Plural-*s*.'
    example_gloss:
    - Léa hat lange Haare.
    - Thomas hat kurze Haare.
  fr.a1.unit53.lesson02.teach.cheveux_est_toujours:
    title: Cheveux mit Adjektiv im Plural
    gloss: '*Cheveux* steht immer im Plural, deshalb erhält das Adjektiv ein *s*: *longs*, *courts*, *blonds*, *bruns*, *noirs*. *Gris* endet schon auf *s*.'
    note: 'Farben und Längen richten sich im Plural nach *cheveux*: *les cheveux longs*. Vergleichen Sie *yeux* in Lektion 3, wo sich *marron* nicht verändert.'
  fr.a1.unit53.lesson02.teach.ses_est_le:
    title: 'Ses: sein oder ihr'
    gloss: '*Ses* bedeutet „sein“ oder „ihr“ vor einem Nomen im Plural: *ses cheveux*, *ses yeux*. Es richtet sich nach dem Besitztum, nicht nach dem Besitzer.'
    note: 'Anders als im Deutschen („seine“ und „ihre“) gibt es hier im Französischen kein eigenes Wort für „sein“ und „ihr“: *ses yeux* kann „seine Augen“ oder „ihre Augen“ heißen, der Kontext zeigt, was gemeint ist.'
  fr.a1.unit53.lesson02.teach.mathieu_a_les:
    title: Mathieu hat kurze schwarze Haare
    gloss: Mathieu hat kurze schwarze Haare.
    note: Greift *noirs* (schwarz) aus der Kleidungseinheit wieder auf.
  fr.a1.unit53.lesson02.teach.camille_a_les:
    title: Camille hat lange blonde Haare
    gloss: Camille hat lange blonde Haare.
    note: Verbindet Länge und Farbe aus dieser Lektion in einem natürlichen Satz.
  fr.a1.unit53.lesson03.teach.les_yeux:
    title: Augen
    gloss: die Augen
    note: '*Les yeux* ist der Plural von *l''œil* (das Auge); *yeux* endet auf *x*, nicht auf *s*.'
    example_gloss: Mathieu hat braune Augen.
  fr.a1.unit53.lesson03.teach.bleus_marron_verts:
    title: Blau, braun und grün
    gloss: blau / braun / grün
    note: '*Bleus* (blau) kennen Sie schon von der Kleidung; *marron* (braun) verändert sich nie; *verts* (grün) ist neu.'
    example_gloss:
    - Camille hat blaue Augen.
    - Thomas hat braune Augen.
    - Léa hat grüne Augen.
  fr.a1.unit53.lesson03.teach.avec_yeux_pluriel:
    title: Yeux mit -s, marron bleibt gleich
    gloss: 'Bei *yeux* (Plural) erhält das Adjektiv ein *s*: *yeux bleus*, *yeux verts*. *Marron* verändert sich nie: *yeux marron*.'
    note: 'Vergleichen Sie *cheveux* aus Lektion 2: Ein Nomen im Plural verlangt ein Adjektiv im Plural, außer bei Farben wie *marron*, die von einem Nomen stammen.'
  fr.a1.unit53.lesson03.teach.comment_est_camille:
    title: Wie sieht Camille aus?
    gloss: Wie sieht Camille aus?
    note: '*Comment est ... ?* ist die Kernfrage dieser Einheit; mit ihr fragen Sie nach dem Aussehen jeder beliebigen Person.'
  fr.a1.unit53.lesson03.teach.camille_a_les:
    title: Camille hat lange blonde Haare und blaue Augen
    gloss: Camille hat lange blonde Haare und blaue Augen.
    note: Eine Musterantwort, die Haare und Augen mit *et* in einem Satz verbindet.
  fr.a1.unit53.lesson04.teach.camille_une_nouvelle:
    title: Camille stellt Nina vor
    gloss: 'Camille: Ein neues Mädchen kommt ins Sprachcafé. Sie heißt Nina.'
    note: '*Une nouvelle fille vient* führt jemand Neues in die Szene ein; *vient* kommt von *venir* (kommen).'
  fr.a1.unit53.lesson04.teach.mathieu_d_accord:
    title: Mathieu fragt, wie sie aussieht
    gloss: 'Mathieu: Alles klar! Wie sieht sie aus?'
    note: 'Die Kernfrage mit *elle* (sie) statt eines Namens: *Comment est-elle ?* Der Bindestrich verbindet Verb und Pronomen.'
  fr.a1.unit53.lesson04.teach.camille_elle_est:
    title: Camille beschreibt Ninas Größe und Haare
    gloss: 'Camille: Sie ist klein und hat kurze blonde Haare.'
    note: Verbindet *petite* aus Lektion 1 mit dem Haarwortschatz aus Lektion 2; *petite* erhält für ein Mädchen ein *e*.
  fr.a1.unit53.lesson04.teach.mathieu_et_ses:
    title: Mathieu fragt nach ihren Augen
    gloss: 'Mathieu: Und ihre Augen?'
    note: '*Ses yeux* bedeutet hier „ihre Augen“: *ses* richtet sich nach *yeux*, nicht nach dem Mädchen.'
  fr.a1.unit53.lesson04.teach.camille_elle_a:
    title: Camille beschreibt Ninas Augen
    gloss: 'Camille: Sie hat grüne Augen.'
    note: Greift *yeux verts* aus Lektion 3 wieder auf.
  fr.a1.unit53.lesson04.teach.mathieu_merci_alors:
    title: Mathieu wird sie erkennen
    gloss: 'Mathieu: Danke! Dann werde ich sie erkennen.'
    note: '*Je vais la reconnaître* verwendet *aller* + Infinitiv für die nahe Zukunft, und *la* bedeutet „sie“.'
  fr.a1.unit53.lesson05.teach.thomas_et_lea:
    title: Thomas und Léa im Vergleich
    gloss: Thomas und Léa sind Bruder und Schwester, aber sie sehen sich nicht ähnlich. Thomas ist klein und hat kurze braune Haare und braune Augen. Léa ist größer als Thomas und hat lange braune Haare und grüne Augen. Und wie sehen Sie aus?
    note: Ein kurzer Vergleich mit allen bisher gelernten Farb- und Längenwörtern; am Ende steht die Kernfrage der Einheit an die Leserin bzw. den Leser.
    glosses:
      frère: Bruder
      sœur: Schwester
      ressemblent: ist ... (vom Aussehen her)
      différents: verschieden
      petit: klein
      courts: klein
      bruns: braun
      cheveux: Haare
      marron: braun
      yeux: Augen
      grande: größer
      longs: lang
      verts: grün
      se: (Teil von „se ressemblent“ = sich ähnlich sehen)
  fr.a1.unit53.lesson05.teach.tu_connais_deja:
    title: Plus ... que bei Personen
    gloss: 'Sie kennen schon das Muster *plus* + Adjektiv + *que*. Hier verwenden Sie es für Personen: Léa ist größer als Thomas.'
    note: Dasselbe Muster *plus ... que* wie in der Einkaufseinheit, nun auf Personen statt auf Gegenstände angewendet. *Grande* richtet sich nach *Léa*, die weiblich ist.
  fr.a1.unit53.lesson05.teach.lea_a_les:
    title: Léa hat längere Haare als Thomas
    gloss: Léa hat längere Haare als Thomas.
    note: '*Plus longs que* richtet sich nach *cheveux* (Plural): *les cheveux plus longs que Thomas*.'
  fr.a1.unit53.lesson05.teach.j_ai_les:
    title: Ich habe kurze braune Haare
    gloss: Ich habe kurze braune Haare.
    note: Ein Mustersatz in der ersten Person mit *J'ai ...*, den Sie wiederverwenden können, wenn Sie Ihr eigenes Aussehen beschreiben.
  fr.a1.unit53.lesson06.teach.mathieu_regarde_c:
    title: Mathieu entdeckt Nina
    gloss: 'Mathieu: Schau, ist das Nina? Sie hat kurze blonde Haare und grüne Augen.'
    note: '*Regarde* (schau) ist die *tu*-Befehlsform von *regarder* und kam in einem früheren Dialog schon genauso vor.'
  fr.a1.unit53.lesson06.teach.camille_oui_c:
    title: Camille bestätigt
    gloss: 'Camille: Ja, das ist Nina!'
    note: Eine kurze, natürliche Bestätigung.
  fr.a1.unit53.lesson06.teach.nina_salut_tu:
    title: Nina begrüßt Mathieu
    gloss: 'Nina: Hallo, bist du Mathieu?'
    note: 'Eine einfache, informelle Begrüßungsfrage: *Tu es ... ?*'
  fr.a1.unit53.lesson06.teach.mathieu_oui_ravi:
    title: Mathieu begrüßt Nina zurück
    gloss: 'Mathieu: Ja! Freut mich, dich kennenzulernen, Nina.'
    note: '*Ravi de te rencontrer* ist die übliche Formel für ein echtes erstes Kennenlernen (*ravi* für einen Mann, *ravie* für eine Frau), nicht *content de te revoir*, das man für jemanden sagt, den man schon kennt.'
  fr.a1.unit53.lesson06.teach.nina_ravie_de:
    title: Nina erwidert die Begrüßung
    gloss: 'Nina: Freut mich auch, dich kennenzulernen!'
    note: Beschließt den Dialog – Mathieu hat Nina anhand von Camilles Beschreibung erfolgreich erkannt.
