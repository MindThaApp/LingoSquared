teaching:
  fr.a1.unit47.lesson01.teach.le_temps:
    title: Wetter
    gloss: das Wetter
    note: '*Le temps* bedeutet sowohl „Wetter“ als auch „Zeit“; das Wort ist maskulin.'
    example_gloss: Wie ist das Wetter?
  fr.a1.unit47.lesson01.teach.quel_temps_fait:
    title: Nach dem Wetter fragen
    gloss: Wie ist das Wetter?
    note: '*Quel temps fait-il ?* ist die übliche Frage nach dem Wetter; *quel* richtet sich nach dem maskulinen Nomen *temps*.'
  fr.a1.unit47.lesson01.teach.le_temps_est:
    title: Sonnig
    gloss: Es ist sonnig.
    note: '*Le temps est* + Adjektiv ist ein gängiges Muster; das Adjektiv richtet sich nach dem maskulinen Nomen *temps*.'
  fr.a1.unit47.lesson01.teach.il_pleut:
    title: Regen
    gloss: Es regnet.
    note: '*Pleuvoir* (regnen) wird unpersönlich gebraucht: *il pleut*, ganz ohne Adjektiv.'
  fr.a1.unit47.lesson01.teach.le_temps_est_2:
    title: Bewölkt
    gloss: Es ist bewölkt.
    note: Es folgt demselben Muster *le temps est* + Adjektiv wie *ensoleillé*.
  fr.a1.unit47.lesson02.teach.il_fait_froid:
    title: Kalt
    gloss: Heute ist es kalt.
    note: '*Aujourd''hui* (heute) ordnet das Wetter zeitlich ein; *il fait froid* wird mit *faire* gebildet, nicht mit *être*.'
  fr.a1.unit47.lesson02.teach.il_fait_chaud:
    title: Warm
    gloss: Heute ist es warm.
    note: '*Il fait chaud* deckt im Alltag sowohl „warm“ als auch „heiß“ ab.'
  fr.a1.unit47.lesson02.teach.il_ne_fait:
    title: Temperaturen gegenüberstellen
    gloss: Es ist nicht kalt, es ist warm.
    note: '*Ne ... pas* umschließt das Verb: *il ne fait pas froid*.'
  fr.a1.unit47.lesson03.teach.la_meteo:
    title: Der Wetterbericht
    gloss: der Wetterbericht
    note: '*La météo* ist feminin und die Kurzform von *la météorologie*.'
    example_gloss: Wie ist der Wetterbericht?
  fr.a1.unit47.lesson03.teach.demain_le_temps:
    title: Das Wetter von morgen
    gloss: Morgen ist es sonnig.
    note: '*Demain* steht am Satzanfang, gefolgt von einem Komma; der Rest behält die normale Wortstellung.'
  fr.a1.unit47.lesson03.teach.samedi_le_temps:
    title: Eine Vorhersage für zwei Tage
    gloss: Am Samstag ist es sonnig und warm, aber am Sonntag regnet es den ganzen Tag.
    note: '*Toute la journée* (den ganzen Tag) betont, wie lange der Regen dauert.'
  fr.a1.unit47.lesson04.teach.la_promenade:
    title: Der Spaziergang
    gloss: der Spaziergang
    note: '*Promenade* ist feminin: *la promenade*.'
    example_gloss: Wollen wir spazieren gehen?
  fr.a1.unit47.lesson04.teach.on_fait_une:
    title: Einen Spaziergang vorschlagen
    gloss: Wollen wir spazieren gehen?
    note: '*On fait une promenade ?* ist eine freundliche Art, etwas vorzuschlagen; *faire une promenade* ist die feste Wendung für „spazieren gehen“.'
  fr.a1.unit47.lesson04.teach.s_il_pleut:
    title: Ein Plan mit Bedingung
    gloss: Wenn es regnet, bleiben wir drinnen.
    note: '*S''il pleut* (wenn es regnet): *si* + *il* wird zu *s''il*; danach sagt *on reste à l''intérieur*, was man tut.'
  fr.a1.unit47.lesson04.teach.bonne_idee_faisons:
    title: Zustimmen und vorschlagen
    gloss: Gute Idee! Lass uns spazieren gehen.
    note: '*Faisons ...* („lass uns ...“) ist neben *On ... ?* eine weitere gängige Art, etwas vorzuschlagen.'
  fr.a1.unit47.lesson05.teach.meteo_samedi_le:
    title: Eine Zwei-Tage-Vorhersage lesen
    gloss: 'Wetterbericht: Am Samstag ist es sonnig und warm. Am Sonntag regnet es den ganzen Tag.'
    note: Achten Sie darauf, welcher Tag welches Wetter hat.
    glosses:
      Météo: Wettervorhersage
      samedi: Samstag
      ensoleillé: sonnig
      chaud: warm
      Dimanche: Sonntag
      pleut: regnet
      toute: ganz
      journée: Tag
  fr.a1.unit47.lesson06.teach.camille_quel_temps:
    title: Camille fragt nach dem Wochenende
    gloss: 'Camille: Wie ist das Wetter dieses Wochenende?'
    note: '*Ce week-end* (dieses Wochenende) verweist in die nahe Zukunft.'
  fr.a1.unit47.lesson06.teach.mathieu_samedi_le:
    title: Mathieu nennt die Vorhersage
    gloss: 'Mathieu: Am Samstag ist es sonnig und warm, aber am Sonntag regnet es den ganzen Tag.'
    note: Entspricht genau der Vorhersage aus der Leseübung.
  fr.a1.unit47.lesson06.teach.camille_alors_on:
    title: Camille macht einen Vorschlag
    gloss: 'Camille: Gehen wir dann am Samstag spazieren?'
    note: '*Alors* (dann) verknüpft den Vorschlag mit dem schönen Wetter, das Mathieu gerade beschrieben hat.'
  fr.a1.unit47.lesson06.teach.mathieu_bonne_idee:
    title: Mathieu stimmt zu und plant den Sonntag
    gloss: 'Mathieu: Gute Idee. Und am Sonntag bleiben wir gemütlich drinnen.'
    note: '*Tranquillement* bedeutet hier „gemütlich, ohne Eile“ und lässt das Drinnenbleiben angenehm klingen.'
  fr.a1.unit47.lesson06.teach.camille_parfait_alors:
    title: Camille legt den Plan fest
    gloss: 'Camille: Perfekt, dann schauen wir einen Film.'
    note: '*Regarder* (anschauen) passt natürlich zu *un film* (ein Film).'
