  fr.a1.unit57.lesson02.teach.tu_connais_deja:
    title: La météo und le message
    gloss: Sie kennen *la météo* (die Wettervorhersage) schon. Ein *message* kann man senden (*j'envoie*, *tu envoies*) oder lesen (*je lis*, *tu lis*).
    note: Verbindet das neue Wort mit dem bereits gelernten zusammengesetzten Nomen aus der Wetter-Lektion.
