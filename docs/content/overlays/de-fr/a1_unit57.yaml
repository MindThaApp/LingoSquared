    gloss: 'Mathieu: Gute Idee! Ich schaue die Wettervorhersage nach.'
    note: Greift *Bonne idée !* wieder auf, das schon in den Einheiten zu Plänen und Vorlieben vorkam.
  fr.a1.unit57.lesson04.teach.mathieu_samedi_il:
