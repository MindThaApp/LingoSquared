    title: Chercher ist ein regelmäßiges -er-Verb
    gloss: '*Chercher* ist ein regelmäßiges *-er*-Verb, genau wie *utiliser*: *je cherche, tu cherches*; *j''utilise, tu utilises*.'
    note: 'Wie bei den Verben der Tagesabläufe steht das Objekt bei *chercher* direkt dahinter: *Je cherche la météo.*'
  fr.a1.unit57.lesson03.teach.thomas_cherche_la:
