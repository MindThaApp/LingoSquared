  fr.a1.unit57.lesson06.teach.lea_je_prefere:
    title: Léas Plan
    gloss: 'Léa: Ich schwimme lieber, aber ich komme auch in den Park.'
    note: '*Je préfère* (ich bevorzuge, ich mag lieber) greift *préférer* wieder auf, das schon in den Einheiten zu Vorlieben und Sport vorkam.'
