    title: Thomas sieht die Nachricht
    gloss: 'Thomas: Ich sehe die Nachricht. Bis Samstag!'
  fr.a1.unit57.lesson04.teach.tu_connais_deja:
    title: Au revoir und À + Tag
    gloss: 'Sie kennen schon *Au revoir !* Sie können auch einen Tag nennen: *À samedi !*, *À demain !*'
    note: Überträgt das Verabschiedungsmuster aus der Begrüßungs-Lektion auf einen bestimmten Tag.
  fr.a1.unit57.lesson05.teach.camille_appelle_mathieu:
    title: Wer nutzt was?
    gloss: Camille ruft Mathieu jeden Tag an. Sie benutzt ihr Handy, keine App. Mathieu hat zu Hause keinen Computer, aber er nutzt das Internet auf seinem Handy. Thomas schaut jeden Morgen die Wettervorhersage nach. Danach geht er joggen. Léa schickt Camille oft eine Nachricht. Und du, benutzt du dein Handy auch jeden Tag?
    note: Vergleicht die Gewohnheiten aller vier Figuren mit Geräten, ähnlich wie der Vergleichstext in der Sport-Lektion.
