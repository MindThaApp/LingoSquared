answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Französisch A1
  description: 'Tageszeiten und Uhrzeiten (heure(s), et quart, et demie, moins le quart). Die Geschichte von Inès und Mathieu aus dem Kochworkshop wird fortgesetzt: Sie planen ihren nächsten Termin. Außerdem lernen Sie, dass im Französischen bei Terminen und offiziellen Angaben die 24-Stunden-Zählung üblich ist (dix-huit heures trente), neben den umgangssprachlichen Formen, die zuvor in der Lektion vorkommen.'
