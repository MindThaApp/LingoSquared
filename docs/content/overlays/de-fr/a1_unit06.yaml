teaching:
  fr.a1.unit06.lesson01.teach.heure:
    title: Die Stunde; die Uhrzeit
    gloss: die Stunde; die Uhrzeit
    note: '*Heure* ist feminin; das Wort dient auch zur Angabe der Uhrzeit (*dix heures* = zehn Uhr).'
    example_gloss: Wie spät ist es?
  fr.a1.unit06.lesson01.teach.matin:
    title: Der Morgen
    gloss: der Morgen
    note: '*Matin* ist maskulin.'
    example_gloss: Der Markt ist morgens geöffnet.
  fr.a1.unit06.lesson01.teach.apres_midi:
    title: Der Nachmittag
    gloss: der Nachmittag
    note: '*Après-midi* kann maskulin oder feminin sein (maskulin ist häufiger); *l''* wird vor dem Vokal elidiert.'
    example_gloss: Ich arbeite nachmittags.
  fr.a1.unit06.lesson01.teach.soir:
    title: Der Abend
    gloss: der Abend
    note: '*Soir* ist maskulin.'
    example_gloss: Der Kochworkshop findet abends statt.
  fr.a1.unit06.lesson01.teach.midi:
    title: Mittag
    gloss: Mittag
    note: '*Midi* steht als Zeitangabe ohne Artikel (*à midi*, nicht *au midi*).'
    example_gloss: Wir essen mittags.
  fr.a1.unit06.lesson01.teach.minuit:
    title: Mitternacht
    gloss: Mitternacht
    note: '*Minuit* steht wie *midi* ohne Artikel.'
    example_gloss: Der Workshop dauert nie länger als bis Mitternacht.
  fr.a1.unit06.lesson01.teach.latelier_commence_le_soir:
    title: Sagen, wann der Workshop ist
    gloss: Der Workshop beginnt abends, nicht morgens.
    note: Stellt *le soir* und *le matin* direkt gegenüber und verwendet beide Nomen aus dem Wortschatz dieser Lektion.
  fr.a1.unit06.lesson02.teach.quelle_heure_est_il:
    title: Nach der Uhrzeit fragen
    gloss: Wie spät ist es?
    note: '*Quelle heure est-il ?* ist die übliche, universell einsetzbare Frage nach der Uhrzeit; *-il* wird als Fragezeichen mit dem Verb invertiert.'
  fr.a1.unit06.lesson02.teach.il_est_dix_heures:
    title: Die volle Stunde sagen
    gloss: Es ist zehn Uhr.
    note: '*Il est* + Zahl + *heures* ist das Grundmuster für jede volle Stunde; *heures* bleibt im Plural, außer bei *une heure* (ein Uhr).'
  fr.a1.unit06.lesson02.teach.et_quart:
    title: Viertel nach sagen
    gloss: Es ist Viertel nach zehn.
    note: '*Et quart* (und ein Viertel) fügt der genannten Stunde fünfzehn Minuten hinzu.'
  fr.a1.unit06.lesson02.teach.et_demie:
    title: Die halbe Stunde sagen
    gloss: Es ist halb elf.
    note: '*Et demie* (und eine halbe) fügt dreißig Minuten hinzu; *demie* hat das feminine -e und richtet sich nach *heure*.'
  fr.a1.unit06.lesson02.teach.moins_le_quart:
    title: Viertel vor sagen
    gloss: Es ist Viertel vor elf.
    note: '*Moins le quart* (minus das Viertel) zählt von der NÄCHSTEN Stunde zurück, nicht von der aktuellen – ähnlich wie bei „Viertel vor elf“ im Deutschen.'
  fr.a1.unit06.lesson02.teach.a_quelle_heure:
    title: Nach der Anfangszeit fragen
    gloss: Um wie viel Uhr beginnt der Workshop?
    note: '*À quelle heure ?* (um wie viel Uhr) wird verwendet, wenn man nach einem geplanten Termin fragt; sie unterscheidet sich von der allgemeinen Frage *Quelle heure est-il ?*.'
  fr.a1.unit06.lesson03.teach.line01:
    title: Nach der Startzeit der nächsten Woche fragen
    gloss: Inès fragt, um wie viel Uhr der Workshop nächste Woche ist.
    note: '*La semaine prochaine* (nächste Woche) lässt sich mit dem Fragemuster *à quelle heure* aus dieser Lektion verbinden.'
  fr.a1.unit06.lesson03.teach.line02:
    title: Die Startzeit nennen
    gloss: Mathieu sagt, er beginnt um achtzehn Uhr dreißig (18:30 Uhr), glaubt er.
    note: '*Dix-huit heures trente* folgt der 24-Stunden-Zählung, die bei Terminen im Französischen üblich ist, im Gegensatz zu den umgangssprachlichen Formen mit *et demie*.'
  fr.a1.unit06.lesson03.teach.line03:
    title: Bestätigen, dass es abends ist
    gloss: 'Inès fragt nach: abends, nicht morgens?'
    note: Eine kurze Rückfrage, die *le soir* und *le matin* gegenüberstellt.
  fr.a1.unit06.lesson03.teach.line04:
    title: Bestätigen und den Grund nennen
    gloss: Mathieu bestätigt, dass es abends ist, weil das nach der Arbeit praktischer ist.
    note: '*Après le travail* (nach der Arbeit) liefert einen einfachen, praktischen Grund.'
  fr.a1.unit06.lesson03.teach.line05:
    title: Nach der Endzeit fragen
    gloss: Inès fragt, um wie viel Uhr es endet.
    note: '*Finit* (endet) steht im direkten Gegensatz zu *commence* (beginnt) aus der zweiten Zeile.'
  fr.a1.unit06.lesson03.teach.line06:
    title: Die Endzeit nennen
    gloss: Mathieu sagt, gegen zwanzig Uhr fünfzehn (20:15 Uhr), wie immer.
    note: '*Vers* (gegen, ungefähr) kennzeichnet eine ungefähre Uhrzeit und ist weicher als das genaue *à*.'
  fr.a1.unit06.lesson03.teach.line07:
    title: Den Plan bestätigen
    gloss: 'Inès bestätigt: bis nächste Woche, um achtzehn Uhr dreißig!'
    note: Beschließt das Gespräch, indem die vereinbarte Uhrzeit wiederholt wird – im Französischen eine natürliche Art, einen Plan zu bestätigen.
