answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Französisch A1
  description: Häufige Orte im Viertel; nach dem Weg fragen und einfache Wegbeschreibungen geben (en face de, à côté de, près de, loin de). Mathieu sucht weiter eine Apotheke in der Nähe der Werkstatt. Diese Ortsangaben enden alle auf de; vor einem maskulinen Nomen oder einem Plural verschmilzt de zu du/des (du café, des arbres).
units:
  fr.a1.unit07.places:
    title: Wo ist …?
lessons:
  fr.a1.unit07.lesson01.lieux_du_quartier:
    title: Orte im Viertel
  fr.a1.unit07.lesson02.demander_son_chemin:
    title: Nach dem Weg fragen
  fr.a1.unit07.lesson03.dialogue_chercher_pharmacie:
    title: Auf der Suche nach der Apotheke
teaching:
  fr.a1.unit07.lesson01.teach.gare:
    title: Der Bahnhof
    gloss: der Bahnhof
    note: '*Gare* ist feminin.'
    example_gloss: Der Bahnhof ist groß.
  fr.a1.unit07.lesson01.teach.pharmacie:
    title: Die Apotheke
    gloss: die Apotheke
    note: '*Pharmacie* ist feminin.'
    example_gloss: Die Apotheke öffnet um neun.
  fr.a1.unit07.lesson01.teach.banque:
    title: Die Bank
    gloss: die Bank
    note: '*Banque* ist feminin.'
    example_gloss: Die Bank ist sonntags geschlossen.
  fr.a1.unit07.lesson01.teach.ecole:
    title: Die Schule
    gloss: die Schule
    note: '*École* ist feminin; *l''* wird vor dem Vokal elidiert.'
    example_gloss: Die Schule ist neben dem Park.
  fr.a1.unit07.lesson01.teach.cafe:
    title: Das Café
    gloss: das Café
    note: '*Café* ist maskulin; in anderen Zusammenhängen bedeutet es auch „Kaffee“.'
    example_gloss: Das Café ist den ganzen Tag geöffnet.
  fr.a1.unit07.lesson01.teach.poste:
    title: Die Post
    gloss: die Post
    note: '*Poste* (feminin) bedeutet hier „Postamt“; *le poste* (maskulin, andere Bedeutung) kann „die Stelle“ bedeuten – das Genus verändert die Bedeutung.'
    example_gloss: Die Post schließt um sechs Uhr.
  fr.a1.unit07.lesson01.teach.la_gare_est_grande:
    title: Zwei Orte vergleichen
    gloss: Der Bahnhof ist groß und die Apotheke ist klein.
    note: '*Grande* und *petite* stehen hier beide in der femininen Form, weil *la gare* und *la pharmacie* feminin sind.'
  fr.a1.unit07.lesson02.teach.ou_est_la_gare:
    title: Fragen, wo ein Ort ist
    gloss: Wo ist der Bahnhof, bitte?
    note: '*Où est... ?* ist die gängige Standardfrage, um nach dem Ort von etwas zu fragen.'
  fr.a1.unit07.lesson02.teach.en_face_de:
    title: Sagen, dass etwas gegenüber liegt
    gloss: Die Bank ist gegenüber vom Bahnhof.
    note: '*En face de* („gegenüber von“) endet auf *de*, danach folgt der Bezugsort: *en face de la banque*. Vor einem maskulinen Nomen verschmilzt es: *en face du café*.'
  fr.a1.unit07.lesson02.teach.a_cote_de:
    title: Sagen, dass etwas daneben liegt
    gloss: Die Apotheke ist neben der Bank.
    note: '*À côté de* („neben“) wird mit *de* angeschlossen wie *en face de*.'
  fr.a1.unit07.lesson02.teach.pres_de:
    title: Sagen, dass etwas in der Nähe ist
    gloss: Die Schule ist hier in der Nähe.
    note: '*Près de* („nahe bei“) wird vor einem Vokal zu *près d''*, wie in *près d''ici* („in der Nähe von hier“).'
  fr.a1.unit07.lesson02.teach.loin_de:
    title: Sagen, dass etwas weit weg ist
    gloss: Die Post ist weit von hier.
    note: '*Loin de* („weit von“) ist das genaue Gegenteil von *près de*.'
  fr.a1.unit07.lesson02.teach.cest_loin:
    title: Fragen, ob etwas weit ist
    gloss: Ist es weit von hier? – Nein, es ist nicht weit.
    note: '*C''est loin d''ici ?* ist die natürliche Anschlussfrage, nachdem man eine Wegbeschreibung bekommen hat. Zum Verneinen setzt man *ne... pas* um das Verb: *ce n''est pas loin* (es ist nicht weit).'
  fr.a1.unit07.lesson03.teach.line01:
    title: Einen Fremden nach dem Weg fragen
    gloss: Mathieu fragt einen Passanten höflich, wo die Apotheke ist.
    note: '*Excusez-moi* („Entschuldigung“) ist die übliche höfliche Einleitung, wenn man einen Fremden anspricht; dazu gehört das *vous*.'
  fr.a1.unit07.lesson03.teach.line02:
    title: Den Ort angeben
    gloss: Sie sagt, sie sei gegenüber der Bank, neben dem Café.
    note: '*En face de* und *à côté de* werden in einem Satz kombiniert, um den Ort genau anzugeben. *De* + *le café* verschmilzt zu *du café*.'
  fr.a1.unit07.lesson03.teach.line03:
    title: Fragen, ob es weit ist
    gloss: Mathieu fragt, ob es weit von hier ist.
    note: Dieselbe Frage *C'est loin d'ici ?*, die Sie schon für die Frage nach der Entfernung kennen.
  fr.a1.unit07.lesson03.teach.line04:
    title: Beruhigen, dass es nah ist
    gloss: Sie sagt, nein, es sei ganz nah – fünf Minuten zu Fuß.
    note: '*À pied* („zu Fuß“) ist die übliche Angabe, wenn man zu Fuß geht.'
  fr.a1.unit07.lesson03.teach.line05:
    title: Sich bei ihr bedanken
    gloss: Mathieu bedankt sich herzlich bei ihr.
    note: '*Merci beaucoup* verstärkt das schon bekannte *merci* aus früheren Lektionen.'
  fr.a1.unit07.lesson03.teach.line06:
    title: Auf einen Dank antworten
    gloss: 'Sie antwortet: Gern geschehen.'
    note: '*Je vous en prie* ist ein eher förmliches „Gern geschehen“ und passt zum *vous* gegenüber einem Fremden; *De rien* ist die weniger förmliche Alltagsvariante.'
