  fr.a1.unit52.lesson06.planifier_un_week_end:
    title: Ein gemeinsames Wochenende planen
teaching:
  fr.a1.unit52.lesson01.teach.lire_faire_du:
    title: Lesen, Sport, Kochen
    gloss: lesen, Sport treiben, kochen
    note: 'Drei häufige Hobby-Verben: *lire* (lesen), *faire du sport* (Sport treiben) und *cuisiner* (kochen).'
    example_gloss:
    - Ich lese gern ein Buch.
    - Ich treibe samstags Sport.
    - Ich koche gern für Freunde.
  fr.a1.unit52.lesson01.teach.le_temps_libre:
    title: Freizeit
    gloss: Freizeit
    note: '*Temps libre* ist männlich: *le temps libre*. Es ist der Schlüsselausdruck, wenn man über Hobbys spricht.'
    example_gloss: In meiner Freizeit lese ich gern.
  fr.a1.unit52.lesson01.teach.pendant_mon_temps:
    title: Sagen, was man in der Freizeit macht
    gloss: In meiner Freizeit lese ich gern.
    note: '*Lis* ist die *je*-Form von *lire* (lesen); das letzte *s* bleibt stumm.'
  fr.a1.unit52.lesson02.teach.ecouter_de_la:
    title: Musik, Zeichnen, Gaming
    gloss: Musik hören, zeichnen, Videospiele spielen
    note: 'Drei weitere Hobbys: *écouter de la musique*, *dessiner* und *jouer aux jeux vidéo*. Bei Spielen wird *jouer à* + *les* zu *jouer aux*.'
    example_gloss:
    - Ich höre gern Musik.
    - Ich zeichne oft.
    - Ich spiele gern mit Freunden Videospiele.
  fr.a1.unit52.lesson02.teach.j_aime_ecouter:
    title: Sagen, dass man gern Musik hört
    gloss: Ich höre gern Musik.
    note: '*Écouter* wird direkt mit seinem Objekt verbunden, ohne zusätzliches Wort: *écouter de la musique*.'
  fr.a1.unit52.lesson02.teach.j_aime_jouer:
    title: Sagen, dass man gern mit Freunden Videospiele spielt
    gloss: Ich spiele gern mit Freunden Videospiele.
    note: '*Avec des amis* (mit Freunden) greift *amis* aus Lektion 1 wieder auf; *des* ist der Plural „einige“.'
  fr.a1.unit52.lesson03.teach.toujours_souvent_parfois:
    title: Immer, oft, manchmal, nie
    gloss: immer, oft, manchmal, nie
    note: Die vier wichtigsten Häufigkeitsadverbien. *Souvent* kennen Sie vielleicht schon; *toujours*, *parfois* und *jamais* sind neu. *Jamais* braucht *ne* vor dem Verb.
    example_gloss:
    - Ich treibe immer samstags Sport.
    - Ich lese oft ein Buch.
    - Ich zeichne manchmal.
    - Ich spiele nie Videospiele.
  fr.a1.unit52.lesson03.teach.chaque_semaine_chaque:
    title: Jede Woche, jedes Wochenende
    gloss: jede Woche, jedes Wochenende
    note: '*Chaque semaine* und *chaque week-end* bedeuten „jede Woche“ und „jedes Wochenende“. *Chaque* bleibt immer gleich, egal welches Geschlecht das Nomen hat.'
    example_gloss:
    - Ich koche jede Woche für Freunde.
    - Ich treibe jedes Wochenende Sport.
  fr.a1.unit52.lesson03.teach.chaque_ne_change:
    title: Chaque ändert sich nie
    gloss: '*Chaque* bleibt vor männlichen und weiblichen Nomen gleich: *chaque semaine*, *chaque week-end*.'
    note: '*Semaine* ist weiblich und *week-end* ist männlich, doch *chaque* ist bei beiden identisch. Vergleichen Sie *tous les* / *toutes les*, das sich dagegen verändert.'
  fr.a1.unit52.lesson03.teach.qu_est_ce:
    title: Nach der Freizeit fragen
    gloss: Was machst du in deiner Freizeit?
    note: Das ist die Kernfrage dieser Lektion – mit ihr können Sie jeden nach seinen Hobbys fragen.
  fr.a1.unit52.lesson04.teach.camille_on_se:
    title: Camille spricht über Hobbys
    gloss: 'Camille: Wir gehen oft zusammen spazieren. Aber was machst du sonst noch in deiner Freizeit, Mathieu?'
    note: '*On se promène souvent* verwendet *on* für „wir“, und *souvent* steht direkt nach dem Verb.'
  fr.a1.unit52.lesson04.teach.mathieu_j_aime:
    title: Mathieus Hobbys
    gloss: 'Mathieu: Ich koche gern, auch zu Hause. Und ich mache oft Sport.'
    note: '*Même à la maison* (sogar zu Hause) zeigt, dass Mathieu zum Vergnügen kocht, nicht nur bei der Arbeit.'
  fr.a1.unit52.lesson04.teach.camille_tu_cuisines:
    title: Camille ist überrascht
    gloss: 'Camille: Du kochst auch zu Hause? Du kochst doch schon den ganzen Tag bei der Arbeit!'
    note: '*Toute la journée* (den ganzen Tag) betont, wie viel Mathieu schon bei der Arbeit kocht.'
  fr.a1.unit52.lesson04.teach.mathieu_oui_mais:
    title: Mathieu erklärt
    gloss: 'Mathieu: Ja, aber Kochen finde ich entspannend. Und du, was machst du gern?'
    note: '*Cuisiner, je trouve ça relaxant* stellt *cuisiner* zur Betonung voran: wörtlich „Kochen, das finde ich entspannend“.'
  fr.a1.unit52.lesson04.teach.camille_j_aime:
    title: Camilles Hobbys
    gloss: 'Camille: Ich lese gern und höre oft Musik.'
    note: Verbindet zwei Hobbys aus Lektion 1 und 2 in einem Satz mit *et* (und).
  fr.a1.unit52.lesson04.teach.mathieu_tu_joues:
    title: Mathieu fragt nach Videospielen
    gloss: 'Mathieu: Spielst du auch Videospiele?'
    note: 'Eine kurze Ja/Nein-Frage: *Tu joues aussi aux jeux vidéo ?* Die steigende Intonation macht daraus eine Frage.'
  fr.a1.unit52.lesson04.teach.camille_non_je:
    title: Camille antwortet
    gloss: 'Camille: Nein, ich spiele nie Videospiele. Aber ich zeichne manchmal!'
    note: '*Jamais* (nie) und *parfois* (manchmal) aus Lektion 3, in einer Antwort gegenübergestellt.'
  fr.a1.unit52.lesson05.teach.mathieu_et_moi:
    title: Hobbys im Vergleich
    gloss: Mathieu und ich gehen oft zusammen spazieren. Aber wir haben auch andere Hobbys. Mathieu kocht gern, auch zu Hause, und er macht oft Sport. Ich lese gern und höre oft Musik. Ich zeichne manchmal, aber ich spiele nie Videospiele. Was machst du gern in deiner Freizeit?
    note: Camilles Nachricht fasst Inhalte aus Lektion 4 zusammen und endet mit der Kernfrage der Einheit an die Leserin bzw. den Leser.
    glosses:
      promène: spazieren gehen
      souvent: oft
      ensemble: zusammen
      d'autres: andere
      cuisiner: kocht
      aime: mag
      maison: zu Hause
      sport: macht Sport
      lire: lesen
      j'écoute: hören
      musique: Musik
      dessine: zeichne
      parfois: manchmal
      jeux: Videospiele spielen
      jamais: nie
      libre: frei
      temps: Zeit
  fr.a1.unit52.lesson06.teach.mathieu_qu_est:
    title: Mathieu fragt nach dem Wochenende
    gloss: 'Mathieu: Was machst du dieses Wochenende?'
    note: '*Ce week-end* (dieses Wochenende) steht mit *ce*, weil *week-end* männlich ist.'
  fr.a1.unit52.lesson06.teach.camille_je_ne:
    title: Camille ist unentschlossen
    gloss: 'Camille: Ich weiß es noch nicht. Ich lese gern, aber ich möchte auch rausgehen.'
    note: '*Sortir* (ausgehen) ist eine gängige Art zu sagen, dass man aus dem Haus will.'
  fr.a1.unit52.lesson06.teach.mathieu_on_se:
    title: Mathieu macht einen Vorschlag
    gloss: 'Mathieu: Gehen wir zusammen spazieren? Danach koche ich für uns.'
    note: '*Après* (danach) reiht zwei Pläne aneinander, wie *d''abord* und *ensuite*.'
  fr.a1.unit52.lesson06.teach.camille_bonne_idee:
    title: Camille stimmt zu
    gloss: 'Camille: Gute Idee! Ich gehe genauso gern spazieren, wie ich koche.'
    note: '*Autant ... que* (genauso viel ... wie) zeigt, dass Camille zwei Dinge gleich gern mag.'
  fr.a1.unit52.lesson06.teach.mathieu_parfait_alors:
    title: Mathieu bestätigt
    gloss: 'Mathieu: Perfekt. Dann sehe ich dich am Samstag!'
    note: Ein freundlicher Schlusssatz, der den Plan für *samedi* (Samstag) bestätigt.
