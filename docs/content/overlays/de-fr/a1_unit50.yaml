teaching:
  fr.a1.unit50.lesson01.teach.appeler:
    title: Anrufen
    gloss: anrufen
    note: Der Infinitiv des Verbs für „telefonisch anrufen“.
    example_gloss: Ich muss dich anrufen.
  fr.a1.unit50.lesson01.teach.je_t_appelle:
    title: Sagen, dass man anruft
    gloss: Ich rufe dich an.
    note: '*Appelle* ist die *je*-Form von *appeler*; Das Französische verwendet hier das Präsens, wie auch das Deutsche für „Ich rufe dich an“.'
  fr.a1.unit50.lesson01.teach.allo_c_est:
    title: Ans Telefon gehen
    gloss: Hallo, hier ist Camille.
    note: '*C''est* + Name ist im Französischen die übliche Art, sich am Telefon zu melden; im Deutschen sagt man dafür „Hier ist …“ oder nennt einfach den Namen.'
  fr.a1.unit50.lesson01.teach.allo_c_est_2:
    title: Mathieu meldet sich genauso
    gloss: Hallo, hier ist Mathieu.
    note: Dasselbe Muster *c'est* + Name wie in *Allô, c'est Camille*.
  fr.a1.unit50.lesson02.teach.qui_est_a:
    title: Fragen, wer anruft
    gloss: Mit wem spreche ich?
    note: '*Qui est à l''appareil ?* ist die übliche Frage, um einen unbekannten Anrufer nach seinem Namen zu fragen.'
  fr.a1.unit50.lesson02.teach.vous_parlez_avec:
    title: Sich förmlich melden
    gloss: Sie sprechen mit Camille.
    note: '*Vous parlez avec* + Name ist das förmliche Gegenstück zu *c''est* + Name.'
  fr.a1.unit50.lesson03.teach.tu_peux_repeter:
    title: Um Wiederholung bitten
    gloss: Kannst du das wiederholen?
    note: '*Tu peux ...* (Kannst du ...?) plus Infinitiv *répéter* (wiederholen).'
  fr.a1.unit50.lesson03.teach.ne_parle_pas:
    title: Jemanden bitten, langsamer zu sprechen
    gloss: Sprich nicht so schnell, bitte.
    note: '*Ne parle pas si vite* verneint das Verb: *ne ... pas* umschließt *parle*, und *si* bedeutet „so“.'
  fr.a1.unit50.lesson03.teach.je_ne_t:
    title: Sagen, dass man schlecht hört
    gloss: Ich kann dich nicht gut hören.
    note: '*Entendre* (hören) mit *ne ... pas bien* beschreibt ein Hörproblem – etwas anderes als *comprendre* (verstehen).'
  fr.a1.unit50.lesson04.teach.le_sms:
    title: Textnachricht
    gloss: die Textnachricht
    note: '*SMS* ist im Französischen maskulin: *un SMS*; im Deutschen heißt es dagegen „die SMS“.'
    example_gloss: Die SMS ist von Camille.
  fr.a1.unit50.lesson04.teach.je_t_envoie:
    title: Sagen, dass man eine Nachricht schickt
    gloss: Ich schicke dir eine Nachricht.
    note: '*Envoyer* (schicken) steht mit dem Pronomen *te* (hier *t''*) vor dem Verb; danach folgt *un SMS*.'
  fr.a1.unit50.lesson04.teach.je_te_rappelle:
    title: Sagen, dass man zurückruft
    gloss: Ich rufe dich später zurück.
    note: '*Rappeler* (zurückrufen) enthält mit *re-* schon den Gedanken „zurück“; *plus tard* bedeutet „später“.'
  fr.a1.unit50.lesson05.teach.mathieu_salut_camille:
    title: Einen Nachrichtenaustausch lesen
    gloss: 'Mathieu: Hallo Camille, kannst du mich anrufen? Ich muss dir etwas sagen. Camille: Ja, klar, ich rufe dich in fünf Minuten zurück.'
    note: Achten Sie darauf, worum Mathieu bittet, warum und wann Camille zurückruft.
    glosses:
      Salut: hallo
      peux: kannst
      m'appeler: anrufen
      dois: müssen
      truc: etwas
      dire: erzählen
      évidemment: natürlich
      rappelle: zurück
      cinq: fünf
      minutes: Minuten
  fr.a1.unit50.lesson06.teach.mathieu_allo_c:
    title: Mathieu nimmt den Anruf an
    gloss: 'Mathieu: Hallo, hier ist Mathieu.'
    note: 'Dasselbe Muster *c''est* + Name wie in Lektion 1, jetzt im echten Telefonat: Wer abnimmt, spricht zuerst und nennt seinen Namen.'
  fr.a1.unit50.lesson06.teach.camille_salut_mathieu:
    title: Camille nennt ihren Namen
    gloss: 'Camille: Hallo Mathieu, hier ist Camille. Mathieu: Schön, dass du anrufst!'
    note: '*C''est sympa que* ... (schön, dass ...) drückt eine positive Reaktion auf ein Ereignis aus; *appelles* ist hier eine Sonderform, die Sie sich einfach merken können.'
  fr.a1.unit50.lesson06.teach.camille_comment_s:
    title: Camille fragt nach der Schicht
    gloss: 'Camille: Wie war dein erster Dienst?'
    note: '*Comment s''est passé ... ?* steht im passé composé von *se passer* (ablaufen, geschehen), gebildet mit *être*, und fragt, wie etwas gelaufen ist.'
  fr.a1.unit50.lesson06.teach.mathieu_ca_s:
    title: Mathieu berichtet Gutes
    gloss: 'Mathieu: Es lief sehr gut, besser, als ich dachte.'
    note: '*Ça s''est très bien passé* und *je pensais* sind hier feste Wendungen; *je pensais* ist das Imparfait von *penser* (denken).'
  fr.a1.unit50.lesson06.teach.au_passe_compose:
    title: Passé composé mit avoir und être
    gloss: s'est passé → geschehen, j'ai pensé → denken, je suis allé → gehen
    note: 'Das passé composé wird mit *avoir* oder *être* + Partizip gebildet: *j''ai pensé*, *je suis allé*. *Ça s''est passé* ist eine feste Wendung für „es lief“; merken Sie sich sie vorerst einfach in den Zusammenhängen dieser Lektion.'
  fr.a1.unit50.lesson06.teach.camille_ca_fait:
    title: Camille ist stolz
    gloss: 'Camille: Das freut mich zu hören! Ich bin stolz auf dich.'
    note: '*Fière de* (stolz auf) ist eine feste Verbindung; es heißt *de*, nicht *pour*; *fière* ist hier feminin.'
  fr.a1.unit50.lesson06.teach.mathieu_merci_beaucoup:
    title: Mathieu ist gerührt
    gloss: 'Mathieu: Vielen Dank, das bedeutet mir viel.'
    note: '*Compter* bedeutet hier „wichtig sein“: *ça compte pour moi* (es ist mir wichtig); *pour moi* sagt, für wen es wichtig ist.'
  fr.a1.unit50.lesson06.teach.son_premier_service:
    title: Sein
    gloss: Seine erste Schicht ist sehr gut gelaufen.
    note: '*Son* ist hier das Possessivum „sein“, kein Verb: *son premier service* (sein erster Dienst); *son* passt zum maskulinen *service*.'
