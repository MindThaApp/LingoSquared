teaching:
  fr.a1.unit45.lesson01.teach.tu_fais_quoi:
    title: Nach dem Beruf fragen
    gloss: Was machst du beruflich?
    note: Eine übliche, lockere Art, nach jemandes Beruf zu fragen.
  fr.a1.unit45.lesson01.teach.le_metier_cuisinier:
    title: Beruf / Koch
    gloss: der Beruf; Koch
    note: '*Métier* (Beruf) ist maskulin: *le métier*. *Cuisinier* hat eine weibliche Form: *un cuisinier*, *une cuisinière*.'
    example_gloss:
    - Was machen Sie beruflich?
    - Ich arbeite als Koch.
  fr.a1.unit45.lesson01.teach.je_travaille_comme:
    title: Sagen, dass man Koch ist
    gloss: Ich arbeite als Koch.
    note: '*Travailler comme* + Beruf ist das übliche Muster, um einen Beruf zu nennen; vor dem Berufsnomen steht kein Artikel.'
  fr.a1.unit45.lesson01.teach.infirmiere:
    title: Krankenschwester
    gloss: Krankenschwester
    note: Die moderne, geschlechtsneutrale Bezeichnung für diesen Beruf, die für alle Geschlechter verwendet wird.
    example_gloss: Ich arbeite als Krankenpfleger.
  fr.a1.unit45.lesson01.teach.je_travaille_comme_2:
    title: Sagen, dass man Krankenpfleger ist
    gloss: Ich arbeite als Krankenpfleger.
    note: Folgt demselben Muster *travailler comme* wie *cuisinier*; die weibliche Form ist *infirmière*.
  fr.a1.unit45.lesson02.teach.ou_travailles_tu:
    title: Nach dem Arbeitsort fragen
    gloss: Wo arbeitest du?
    note: Eine direkte Anschlussfrage zu *Tu fais quoi dans la vie ?*
  fr.a1.unit45.lesson02.teach.je_travaille_dans:
    title: In einem Restaurant arbeiten
    gloss: Ich arbeite in einem Restaurant.
    note: '*Un restaurant* steht hier mit dem unbestimmten Artikel, denn es ist eines von vielen Restaurants.'
  fr.a1.unit45.lesson02.teach.l_hopital:
    title: Das Krankenhaus
    gloss: das Krankenhaus
    note: '*Hôpital* ist maskulin und beginnt mit einem Vokallaut: *l''hôpital*.'
    example_gloss: Ich arbeite im Krankenhaus.
  fr.a1.unit45.lesson02.teach.je_travaille_a:
    title: Im Krankenhaus arbeiten
    gloss: Ich arbeite im Krankenhaus.
    note: '*À l''hôpital* steht mit dem bestimmten Artikel, weil es um einen bestimmten, bekannten Ort geht; *le* wird vor dem Vokallaut zu *l''*.'
  fr.a1.unit45.lesson02.teach.certaines_personnes_travaillent:
    title: In einem Büro arbeiten
    gloss: Manche Leute arbeiten in einem Büro.
    note: '*Dans un bureau* (in einem Büro) steht mit Artikel, genau wie *dans un restaurant*.'
  fr.a1.unit45.lesson03.teach.je_commence_a:
    title: Arbeitsbeginn
    gloss: Ich fange um neun Uhr an.
    note: '*Commence* ist die *je*-Form von *commencer* (anfangen, beginnen); *à neuf heures* gibt die Uhrzeit an.'
  fr.a1.unit45.lesson03.teach.je_travaille_du:
    title: Arbeitstage
    gloss: Ich arbeite von Montag bis Freitag.
    note: '*Du lundi au vendredi* bedeutet „von Montag bis Freitag“; *du* ist *de* + *le* und *au* ist *à* + *le*.'
  fr.a1.unit45.lesson03.teach.la_pause:
    title: Die Pause
    gloss: die Pause
    note: '*Pause* ist feminin: *la pause*.'
    example_gloss: Ich habe um zwölf Uhr Pause.
  fr.a1.unit45.lesson03.teach.j_ai_une:
    title: Pause haben
    gloss: Ich habe um zwölf Uhr Pause.
    note: '*Avoir une pause* (Pause haben) ist die übliche feste Wendung.'
  fr.a1.unit45.lesson03.teach.je_finis_a:
    title: Arbeitsende
    gloss: Ich höre um fünf Uhr auf.
    note: '*Finis* ist die *je*-Form von *finir* (beenden, aufhören).'
  fr.a1.unit45.lesson03.teach.je_commence_a_2:
    title: Ein ganzer Arbeitstag
    gloss: Ich fange um neun Uhr an und höre um fünf Uhr auf.
    note: Verbindet *je commence* und *je finis* mit *et* zu einem Satz, der einen ganzen Arbeitstag beschreibt.
  fr.a1.unit45.lesson04.teach.avec_il_ou:
    title: Verbendungen bei il und elle
    gloss: 'Bei er oder sie behalten regelmäßige Verben auf -er die Form von ich: je travaille, il travaille, elle travaille.'
    note: '*Travaille* bleibt bei *je*, *il* und *elle* gleich: Regelmäßige Verben auf *-er* bekommen in der dritten Person keine eigene Endung.'
  fr.a1.unit45.lesson04.teach.camille_travaille_comme:
    title: Camilles Beruf
    gloss: Camille arbeitet als Krankenschwester.
    note: '*Travaille* gehört zu *je*, *il* und *elle*: Die Endung ist stumm, deshalb klingen alle drei Formen gleich.'
  fr.a1.unit45.lesson04.teach.mathieu_travaille_comme:
    title: Mathieus Beruf
    gloss: Mathieu arbeitet als Koch.
    note: Dieselbe Endung wie in *Camille travaille comme infirmière*.
  fr.a1.unit45.lesson04.teach.elle_travaille_a:
    title: Pronomen verwenden
    gloss: Sie arbeitet im Krankenhaus. Er arbeitet in einem Restaurant.
    note: '*Elle* und *il* ersetzen die Namen Camille und Mathieu, die Verbform bleibt aber gleich.'
  fr.a1.unit45.lesson05.teach.camille_travaille_comme:
    title: Zwei Berufsprofile lesen
    gloss: Camille arbeitet als Krankenschwester im Krankenhaus. Sie fängt um sieben Uhr an und arbeitet von Montag bis Freitag. Mathieu arbeitet als Koch in einem Restaurant. Er fängt um elf Uhr an und macht um vier Uhr Pause.
    note: Achten Sie bei jeder Person getrennt auf Beruf, Arbeitsort und Arbeitszeiten.
    glosses:
      travaille: arbeitet
      infirmière: Krankenschwester
      l'hôpital: Krankenhaus
      commence: beginnt
      sept: sieben
      lundi: Montag
      vendredi: Freitag
      cuisinier: Koch / Küchenchef
      restaurant: Restaurant
      onze: elf
      pause: Pause
  fr.a1.unit45.lesson06.teach.camille_salut_mathieu:
    title: Camille fragt nach der Arbeit
    gloss: 'Camille: Hallo Mathieu! Ich bin neugierig: Was machst du eigentlich beruflich?'
    note: '*Au fait* (übrigens) macht die Frage freundlich-neugierig statt wie ein Verhör.'
  fr.a1.unit45.lesson06.teach.mathieu_je_travaille:
    title: Mathieu antwortet
    gloss: 'Mathieu: Ich arbeite als Koch in einem Restaurant. Und du?'
    note: '*Et toi ?* ist die übliche Art, die Frage an das Gegenüber zurückzugeben.'
  fr.a1.unit45.lesson06.teach.camille_je_travaille:
    title: Camille antwortet
    gloss: 'Camille: Ich arbeite als Krankenschwester im Krankenhaus.'
    note: Entspricht dem Beruf und Arbeitsort, die schon zuvor in dieser Einheit vorkamen.
  fr.a1.unit45.lesson06.teach.mathieu_tu_fais:
    title: Mathieu fragt nach den Arbeitszeiten
    gloss: 'Mathieu: Welche Arbeitszeiten hast du?'
    note: '*Tu fais quels horaires ?* ist eine natürliche Art, nach den Arbeitszeiten zu fragen; *quels* richtet sich nach dem Plural *horaires*.'
  fr.a1.unit45.lesson06.teach.camille_je_commence:
    title: Camille nennt ihre Arbeitszeiten
    gloss: 'Camille: Ich fange um sieben Uhr an und arbeite von Montag bis Freitag.'
    note: Entspricht dem Zeitplan, der schon im Leseprofil dieser Einheit vorkam.
  fr.a1.unit45.lesson06.teach.mathieu_c_est:
    title: Mathieu reagiert
    gloss: 'Mathieu: Das ist früh! Ich fange später an, um elf Uhr.'
    note: Entspricht Mathieus Arbeitsbeginn, der schon zuvor in dieser Einheit vorkam.
  fr.a1.unit45.lesson06.teach.camille_chaque_metier:
    title: Camille beschließt das Thema
    gloss: 'Camille: Jeder Beruf hat seinen eigenen Rhythmus, glaube ich.'
    note: Ein natürlicher, nachdenklicher Schlusssatz – Sie müssen ihn nur verstehen, nicht genau wiedergeben können.
