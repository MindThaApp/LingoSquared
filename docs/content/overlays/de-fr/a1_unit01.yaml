teaching:
  fr.a1.unit01.lesson01.teach.bonjour:
    title: Neutrale Begrüßung
    gloss: Hallo; guten Tag
    note: Bonjour passt tagsüber bei Fremden, Kollegen und Freunden. Es entspricht dem deutschen „Guten Tag“ und ist nicht auf eine bestimmte Tageszeit festgelegt wie „Guten Morgen“.
  fr.a1.unit01.lesson01.teach.salut:
    title: Informelle Begrüßung
    gloss: hallo; tschüss
    note: Salut verwendet man in einer vertrauten Beziehung. Es kann ein Gespräch eröffnen oder beenden, ist aber bei unbekannten Erwachsenen nicht die sicherste Wahl.
  fr.a1.unit01.lesson01.teach.au_revoir:
    title: Neutraler Abschied
    gloss: auf Wiedersehen
    note: Au revoir passt sowohl in höflichen als auch in informellen Situationen.
  fr.a1.unit01.lesson01.teach.tu:
    title: Informelles „du“ (Singular)
    gloss: du
    note: Tu verwendet man für einen Freund, ein Kind oder eine Person, mit der man ausdrücklich per du ist. Es verlangt eigene Verbformen.
  fr.a1.unit01.lesson01.teach.vous:
    title: Höfliches „Sie“ oder „ihr“
    gloss: Sie (höflich); ihr (Plural)
    note: Vous ist die sichere Wahl für einen unbekannten Erwachsenen und zugleich die Form für jede Gruppe. Anders als das deutsche „Sie“ dient vous auch als „ihr“, die Bedeutung ergibt sich also aus dem Zusammenhang.
  fr.a1.unit01.lesson01.teach.comment_allez_vous:
    title: Förmlich nach dem Befinden fragen
    gloss: Wie geht es Ihnen?
    note: Allez ist die vous-Form von aller. Verb und Pronomen sind umgestellt und durch einen Bindestrich verbunden. Es ist eine feste höfliche Frage und keine wörtliche Erkundigung danach, wohin jemand geht.
  fr.a1.unit01.lesson01.teach.comment_vas_tu:
    title: Vertraut nach dem Befinden fragen
    gloss: Wie geht es Ihnen?
    note: 'Vas ist die tu-Form von aller. Wie im Deutschen („Wie geht es Ihnen?“ – „Wie geht’s dir?“) ändert sich die Formulierung, wenn die Beziehung informell wird: aus allez-vous wird vas-tu.'
  fr.a1.unit01.lesson01.teach.register_choice:
    title: Begrüßung und Beziehung zuordnen
    gloss: Bonjour mit vous; salut mit tu
    note: Diese Paarungen sind nützliche Grundregeln, keine absoluten Gesetze. Bonjour kann man auch bei Freunden sagen, aber salut zusammen mit vous sendet meist widersprüchliche soziale Signale.
  fr.a1.unit01.lesson02.teach.je_mappelle:
    title: Den eigenen Namen nennen
    gloss: Ich heiße Camille.
    note: Je m’appelle bedeutet wörtlich „ich nenne mich“. Das Subjekt je ist im Französischen normalerweise Pflicht. Das e von me entfällt vor appelle, so entsteht m’appelle.
  fr.a1.unit01.lesson02.teach.comment_appelez_vous:
    title: Höflich nach dem Namen fragen
    gloss: Wie heißen Sie?
    note: 'Appelez ist die vous-Form von appeler. Das zweite vous steht nach dem Verb, weil die Frage mit Inversion gebildet wird: vous appelez-vous.'
  fr.a1.unit01.lesson02.teach.tu_tappelles:
    title: Vertraut nach dem Namen fragen
    gloss: Wie heißen Sie?
    note: T’appelles ist die tu-Form, wobei das Reflexivpronomen te vor einem Vokal verkürzt wird. Diese alltägliche Frage behält tu vor dem Verb und stellt comment ans Ende.
  fr.a1.unit01.lesson02.teach.moi_cest:
    title: Sich umgangssprachlich vorstellen
    gloss: Ich bin Noé.
    note: Moi, c’est ist eine idiomatische Vorstellung in der gesprochenen Sprache. Sie klingt gesprächiger als eine wörtliche Übersetzung von „ich bin“.
  fr.a1.unit01.lesson02.teach.enchante:
    title: Männliche Angleichung
    gloss: Freut mich, Sie kennenzulernen.
    note: Ein männlicher Sprecher schreibt normalerweise enchanté. Wie im Deutschen bei „Ich bin begeistert / Ich bin begeisterte“ gibt es hier keine Entsprechung im Satzbau, doch dieses französische Adjektiv richtet sich nach dem Geschlecht der sprechenden Person.
  fr.a1.unit01.lesson02.teach.enchantee:
    title: Weibliche Angleichung
    gloss: Freut mich, Sie kennenzulernen.
    note: Eine weibliche Sprecherin schreibt normalerweise enchantée, mit einem End-e. Enchanté und enchantée werden in der Regel gleich ausgesprochen; der Unterschied zeigt sich daher deutlicher in der Schrift als in der Sprache.
  fr.a1.unit01.lesson02.teach.et_vous:
    title: Eine höfliche Frage zurückgeben
    gloss: Und Sie?
    note: Verwenden Sie vous, um die höfliche Anrede beizubehalten oder um eine Gruppe anzusprechen.
  fr.a1.unit01.lesson02.teach.et_toi:
    title: Eine informelle Frage zurückgeben
    gloss: Und Sie?
    note: Toi ist die betonte Form, die zu tu gehört. Nach et steht im Französischen toi, nicht tu.
  fr.a1.unit01.lesson03.teach.elision_jhabite:
    title: Elision vor einem Vokal
    gloss: ich wohne
    note: 'Je verliert vor habite seinen Vokal, und der Apostroph zeigt diese Elision an: j’habite. Das h in habiter verhindert die Elision nicht.'
  fr.a1.unit01.lesson03.teach.liaison_vous_etes:
    title: Liaison nach vous
    gloss: Sie sind; ihr seid
    note: 'Das End-s von vous ist normalerweise stumm, wird aber vor dem Vokal in êtes als stimmhaftes s (wie in „Sonne“) angebunden: vous êtes klingt ungefähr wie „wu-SÄT“. Die Liaison gehört zur gesprochenen Wortgruppe, nicht zur Schreibweise.'
  fr.a1.unit01.lesson03.teach.liaison_un_atelier:
    title: Liaison nach un
    gloss: eine Werkstatt; ein Workshop
    note: Das End-n von un wird an atelier angebunden. Vermeiden Sie, zwischen den beiden Wörtern eine harte Pause oder einen Knacklaut einzufügen.
  fr.a1.unit01.lesson03.teach.final_e_enchante:
    title: Männliche Schreibweise
    gloss: erfreut (männlich)
    note: Enchanté endet bei einem männlichen Sprecher auf é. Das -an- ist ein nasaler Vokal; sprechen Sie also kein eigenes n wie im Deutschen.
  fr.a1.unit01.lesson03.teach.final_e_enchantee:
    title: Weibliche Schreibweise
    gloss: erfreut (weiblich)
    note: Enchantée fügt für die weibliche Angleichung ein e an, doch dieses zusätzliche e erzeugt normalerweise keine weitere gesprochene Silbe.
  fr.a1.unit01.lesson03.teach.question_liaison:
    title: Eine Inversionsfrage lesen
    gloss: Wie geht es Ihnen?
    note: Sprechen Sie allez-vous als eine zusammenhängende Frageeinheit. Das geschriebene z in allez wird hier nicht als zusätzliches z gesprochen; die Standardaussprache ist ungefähr „a-LEH wu“.
  fr.a1.unit01.lesson04.teach.ca_va:
    title: Alltägliche Frage nach dem Befinden
    gloss: Wie geht’s?; Alles in Ordnung?
    note: Ça enthält eine Cedille, die das c vor a wie ein stimmloses s klingen lässt. Derselbe Ausdruck kann je nach Intonation eine Frage oder eine Antwort sein.
  fr.a1.unit01.lesson04.teach.tres_bien:
    title: Sehr positive Antwort
    gloss: Sehr gut, danke.
    note: Très verstärkt bien. Das End-s ist stumm.
  fr.a1.unit01.lesson04.teach.ca_va_bien:
    title: Positive Antwort
    gloss: Mir geht es gut.
    note: In dieser festen Antwort braucht das Französische kein Wort, das „ich“ entspricht; wie im Deutschen („Geht gut.“) kann das Subjekt entfallen.
  fr.a1.unit01.lesson04.teach.pas_mal:
    title: Mäßig positive Antwort
    gloss: Nicht schlecht.
    note: Pas mal ist oft leicht positiv, ähnlich wie das deutsche „nicht schlecht“.
  fr.a1.unit01.lesson04.teach.fatigue:
    title: Männliche Angleichung des Adjektivs
    gloss: Ich bin ein bisschen müde.
    note: Suis ist die je-Form von être. Ein männlicher Sprecher schreibt fatigué. Anders als das deutsche „müde“ verändert sich das französische Adjektiv je nach Geschlecht der sprechenden Person.
  fr.a1.unit01.lesson04.teach.fatiguee:
    title: Weibliche Angleichung des Adjektivs
    gloss: Ich bin ein bisschen müde.
    note: Eine weibliche Sprecherin schreibt fatiguée mit einem End-e. Die männliche und die weibliche Form werden normalerweise gleich ausgesprochen.
  fr.a1.unit01.lesson04.teach.et_vous:
    title: Die Frage höflich zurückgeben
    gloss: Und Sie?
    note: Vous wahrt die respektvolle Anrede, die man bei einem unbekannten Erwachsenen verwendet.
  fr.a1.unit01.lesson04.teach.et_toi:
    title: Die Frage informell zurückgeben
    gloss: Und Sie?
    note: Verwenden Sie toi nach et, wenn Sie informell mit einem Freund oder Gleichaltrigen sprechen.
  fr.a1.unit01.lesson05.teach.here_for_workshop:
    title: Den Anlass einer Person bestätigen
    gloss: Sind Sie wegen des Workshops hier?
    note: Êtes ist die vous-Form von être. Das Französische braucht hier kein Hilfsverb; die steigende Intonation macht den Satz zur Frage.
  fr.a1.unit01.lesson05.teach.yes_thats_it:
    title: Eine Vermutung bestätigen
    gloss: Ja, das ist richtig.
    note: C’est ça ist eine natürliche Bestätigung, ähnlich wie „Genau“ oder „Stimmt“, und keine wörtliche Entsprechung von „es ist das“.
  fr.a1.unit01.lesson05.teach.live_neighborhood:
    title: Fragen, wo jemand wohnt
    gloss: Wohnen Sie in der Nachbarschaft?
    note: Habitez ist die vous-Form von habiter. Wie im Deutschen kann die Frage mit der Satzstellung einer Aussage und fragender Intonation gebildet werden.
  fr.a1.unit01.lesson05.teach.i_live:
    title: Den Wohnort nennen
    gloss: Ich wohne in Montreuil.
    note: J’habite ist die je-Form von habiter mit Elision. À steht bei einer Stadt als Ortsangabe und darf nicht mit a verwechselt werden, der Verbform von „hat“.
  fr.a1.unit01.lesson05.teach.from_here:
    title: Nach der örtlichen Herkunft fragen
    gloss: Sind Sie von hier?
    note: D’ici verbindet de und ici durch Elision. Êtes bleibt die vous-Form von être.
  fr.a1.unit01.lesson05.teach.from_lille:
    title: Die eigene Herkunft nennen
    gloss: Ich komme aus Lille.
    note: Suis ist die je-Form von être. Zur Angabe der Herkunft steht vor einer Stadt de.
  fr.a1.unit01.lesson05.teach.workshop_starts:
    title: Die Aktivität beginnt
    gloss: Der Workshop beginnt.
    note: Atelier ist maskulin, daher lautet der Artikel im Singular le. Vor einem Vokal wird le zu l’. Commence ist die Form der dritten Person Singular.
  fr.a1.unit01.lesson05.teach.see_you_shortly:
    title: Abschied für kurze Zeit
    gloss: Bis gleich; bis später am heutigen Tag
    note: À tout à l’heure deutet ein weiteres Treffen später am selben Tag an, anders als ein allgemeiner Abschied ohne erwarteten Zeitpunkt.
  fr.a1.unit01.lesson06.teach.line01:
    title: Die Begegnung eröffnen
    gloss: Inès begrüßt Mathieu und vergewissert sich, dass er wegen des Kochworkshops hier ist.
    note: Die Sprechenden beginnen mit vous, weil sie einander als Erwachsene nicht kennen.
  fr.a1.unit01.lesson06.teach.line02:
    title: Die Begegnung eröffnen, Antwort
    gloss: Mathieu bestätigt und nennt seinen Namen, dann fragt er sie nach ihrem.
    note: Je m’appelle ist die übliche Art, den eigenen Namen zu nennen.
  fr.a1.unit01.lesson06.teach.line03:
    title: Namen austauschen
    gloss: Inès nennt ihren Namen und sagt, dass sie sich freut, ihn kennenzulernen.
    note: Enchantée richtet sich nach Inès (weiblich); die Endung -e wird geschrieben, aber normalerweise nicht gehört.
  fr.a1.unit01.lesson06.teach.line04:
    title: 'Namen austauschen: Antwort'
    gloss: Mathieu erwidert die Freude und fragt, ob sie in der Nähe wohnt.
    note: Enchanté richtet sich nach Mathieu (männlich); es ist dasselbe Wort, das Inès gerade benutzt hat, nur ohne das stumme -e.
  fr.a1.unit01.lesson06.teach.line05:
    title: Informationen zur Nachbarschaft austauschen
    gloss: Inès bestätigt und nennt ihre Straße, dann stellt sie Mathieu dieselbe Frage.
    note: Bei J’habite plus Straßenname steht vor rue keine Präposition.
  fr.a1.unit01.lesson06.teach.line06:
    title: Informationen zur Nachbarschaft austauschen, Antwort
    gloss: Mathieu sagt, dass er in Saint-Ouen wohnt, und fragt, ob sie ursprünglich von hier ist.
    note: J’habite à verwendet à vor einem Ortsnamen, anders als der Ausdruck mit der Straße, den Inès gerade benutzt hat.
  fr.a1.unit01.lesson06.teach.line07:
    title: Herkunft austauschen
    gloss: Inès sagt, dass sie nicht von hier ist, sondern aus Lille kommt, und fragt dann Mathieu.
    note: Je suis de plus Stadt gibt an, woher jemand kommt.
  fr.a1.unit01.lesson06.teach.line08:
    title: Herkunft austauschen, Antwort
    gloss: Mathieu sagt, dass er aus Lyon kommt.
    note: Dasselbe Muster je suis de, das Inès gerade benutzt hat.
  fr.a1.unit01.lesson06.teach.line09:
    title: Das Gespräch unterbrechen
    gloss: Inès merkt, dass der Workshop beginnt, und sagt, dass sie ihn gleich wiedersieht.
    note: À tout à l’heure passt, weil beide auf derselben Veranstaltung bleiben.
  fr.a1.unit01.lesson06.teach.line10:
    title: Das Gespräch unterbrechen, Antwort
    gloss: Mathieu wiederholt denselben Abschiedsgruß.
    note: Mit à tout à l’heure zu antworten ist die natürliche Art, den Gruß zu bestätigen.
