teaching:
  fr.a1.unit43.lesson01.teach.le_billet:
    title: Die Fahrkarte
    gloss: die Fahrkarte
    note: '*Billet* ist maskulin: *le billet*, *un billet*.'
    example_gloss: Ich möchte eine Fahrkarte nach Lyon.
  fr.a1.unit43.lesson01.teach.je_voudrais_un:
    title: Eine Fahrkarte verlangen
    gloss: Ich möchte eine Fahrkarte nach Lyon.
    note: '*Je voudrais* macht eine Bitte höflicher; es ist höflicher als *je veux*.'
  fr.a1.unit43.lesson01.teach.voulez_vous_un:
    title: Der Schalterbeamte fragt nach der Art
    gloss: Möchten Sie eine einfache Fahrkarte oder eine Hin- und Rückfahrkarte?
    note: '*Voulez-vous* ist die förmliche *vous*-Form von *vouloir*, hier für einen fremden Bahnangestellten.'
  fr.a1.unit43.lesson01.teach.un_aller_retour:
    title: Höflich antworten
    gloss: Hin und zurück, bitte.
    note: '*S''il vous plaît* ist das förmliche „bitte“ und passt zur *vous*-Anrede des Gesprächs.'
  fr.a1.unit43.lesson01.teach.au_guichet_on:
    title: Die Anredeform am Schalter
    gloss: Am Schalter benutzt man in der Regel die Höflichkeitsform *vous*.
    note: Fremde in einer Dienstleistungsrolle spricht man mit *vous* an; Freunde und Familie mit *tu*.
  fr.a1.unit43.lesson02.teach.le_quai:
    title: Der Bahnsteig
    gloss: der Bahnsteig
    note: '*Quai* ist maskulin: *le quai*.'
    example_gloss: Von welchem Gleis fährt der Zug nach Lyon ab?
  fr.a1.unit43.lesson02.teach.de_quel_quai:
    title: Nach dem Bahnsteig fragen
    gloss: Von welchem Gleis fährt der Zug nach Lyon ab?
    note: '*De quel quai* fragt gezielt nach dem Gleis; *quel* richtet sich nach dem maskulinen Nomen *quai*.'
  fr.a1.unit43.lesson02.teach.le_train_part:
    title: Abfahrtsdetails nennen
    gloss: Der Zug fährt um Viertel vor zehn von Bahnsteig fünf ab.
    note: '*Dix heures moins le quart* bedeutet Viertel vor zehn: Für Zeiten vor der vollen Stunde sagt das Französische *moins* (minus), ähnlich wie das Deutsche „Viertel vor“.'
  fr.a1.unit43.lesson02.teach.a_quelle_heure:
    title: Nach der Ankunftszeit fragen
    gloss: Um wie viel Uhr kommt der Zug an?
    note: '*À quelle heure arrive ... ?* fragt nach der Uhrzeit; *arriver* ist ein regelmäßiges Verb auf *-er*: *le train arrive*.'
  fr.a1.unit43.lesson02.teach.le_train_arrive:
    title: Die Ankunftszeit nennen
    gloss: Der Zug kommt um elf Uhr an.
    note: '*Arrive* ist die *il/elle*-Form von *arriver*; Verben auf *-er* enden bei *il* und *elle* auf *-e*.'
  fr.a1.unit43.lesson03.teach.a_l_heure:
    title: Pünktlich / die Verspätung
    gloss: pünktlich; die Verspätung
    note: '*À l''heure* ist eine feste Wendung für „pünktlich“. *Le retard* (die Verspätung) ist maskulin.'
    example_gloss:
    - Der Zug fährt nicht pünktlich ab.
    - 'Achtung: Der Zug nach Lyon hat Verspätung.'
  fr.a1.unit43.lesson03.teach.attention_le_train:
    title: Eine Durchsage
    gloss: 'Achtung: Der Zug nach Lyon hat Verspätung.'
    note: '*Attention* leitet eine Bahnhofsdurchsage ein, ähnlich wie das deutsche „Achtung, liebe Fahrgäste“.'
  fr.a1.unit43.lesson03.teach.le_train_ne:
    title: 'Verneinung: pünktlich'
    gloss: Der Zug fährt nicht pünktlich ab.
    note: '*Ne ... pas* umschließt das Verb: *ne part pas à l''heure*.'
  fr.a1.unit43.lesson03.teach.le_train_part:
    title: Eine Gleisänderung
    gloss: Der Zug fährt von Gleis drei statt von Gleis fünf ab.
    note: '*Au lieu du* bedeutet „anstelle des/der“; *de* + *le* verschmilzt zu *du*.'
  fr.a1.unit43.lesson03.teach.le_train_a:
    title: Die Dauer der Verspätung nennen
    gloss: Der Zug hat zehn Minuten Verspätung.
    note: '*A ... de retard* (wörtlich „hat ... an Verspätung“) ist die natürliche Art zu sagen, dass etwas verspätet ist; es verwendet *avoir*.'
  fr.a1.unit43.lesson04.teach.l_entree_la:
    title: Eingang, Ausgang, Wartesaal
    gloss: der Eingang; der Ausgang; der Wartesaal
    note: '*L''entrée* verliert vor einem Vokal das *e* und wird zu *l''*; *la sortie* und *la salle d''attente* sind feminin.'
    example_gloss:
    - Wo ist der Eingang?
    - Wo ist der Ausgang?
    - Wo ist der Wartesaal?
  fr.a1.unit43.lesson04.teach.ou_est_le:
    title: Fragen, wo ein Gleis ist
    gloss: Wo ist Bahnsteig sieben?
    note: '*Où est ... ?* fragt, wo etwas ist; *le quai sept* ist maskulin.'
  fr.a1.unit43.lesson04.teach.tout_droit_puis:
    title: Den Weg beschreiben
    gloss: Geradeaus und dann rechts.
    note: '*Tout droit* und *à droite* sind Richtungsangaben; *à* steht vor *droite*.'
  fr.a1.unit43.lesson04.teach.ou_est_la:
    title: Nach dem Wartesaal fragen
    gloss: Wo ist der Wartesaal?
    note: Dasselbe Fragemuster, auf einen neuen Ort angewendet.
  fr.a1.unit43.lesson05.teach.billet_paris_gare:
    title: Eine Fahrkarte lesen
    gloss: 'Fahrkarte: Paris Gare de Lyon nach Lyon Part-Dieu. Abfahrt: zehn Uhr zehn, Gleis sieben. Ankunft: zehn vor elf. Hin- und Rückfahrt. Preis: zwölf Euro vierzig.'
    note: Achten Sie auf Abfahrtszeit und Gleis, Ankunftszeit, Art der Fahrkarte und Preis.
    glosses:
      Billet: die Fahrkarte
      Départ: die Abfahrt
      dix: zehn
      quai: das Gleis
      sept: sieben
      Arrivée: die Ankunft
      onze: elf
      Aller-retour: Hin- und Rückfahrkarte
      Prix: der Preis
      douze: zwölf
      euros: Euro
      quarante: vierzig
  fr.a1.unit43.lesson06.teach.mathieu_on_doit:
    title: Mathieu nennt den Plan
    gloss: 'Mathieu: Wir müssen zu Gleis sieben. Der Zug fährt um zehn nach zehn ab.'
    note: '*On doit* (von *devoir*) drückt hier eine praktische Notwendigkeit aus, keine strenge Pflicht.'
  fr.a1.unit43.lesson06.teach.camille_regarde_voila:
    title: Camille liest die Anzeige
    gloss: 'Camille: Schau, da ist die Anzeigetafel: Verspätung, zehn Minuten.'
    note: '*Voilà* weist auf etwas hin, das da ist: *voilà le panneau*.'
  fr.a1.unit43.lesson06.teach.mathieu_pas_de:
    title: Mathieu bleibt gelassen
    gloss: 'Mathieu: Kein Problem, wir haben noch Zeit für einen Kaffee.'
    note: '*Pas de problème* ist eine gängige, lockere Beruhigung.'
  fr.a1.unit43.lesson06.teach.camille_bonne_idee:
    title: Der Zug kommt an
    gloss: 'Camille: Gute Idee. Oh, da ist schon der Zug. Gleis sieben, auf die Minute!'
    note: '*Déjà* (schon) zeigt, dass der Zug trotz der eben angesagten Verspätung früher kam als erwartet.'
  fr.a1.unit43.lesson06.teach.mathieu_allez_on:
    title: Sie steigen in den Zug
    gloss: 'Mathieu: Los, steigen wir ein. Lyon, wir kommen!'
    note: '*On* ist ein alltägliches *wir* und steht mit der *il*-Form des Verbs: *on monte*. *On arrive !* ist die natürliche Art zu sagen „Gleich sind wir da!“; eine wörtliche Übersetzung klänge merkwürdig.'
