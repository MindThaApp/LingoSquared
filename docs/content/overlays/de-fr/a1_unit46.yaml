teaching:
  fr.a1.unit46.lesson01.teach.l_appartement_le:
    title: Wohnung, Wohnzimmer, Schlafzimmer
    gloss: die Wohnung, das Wohnzimmer, das Schlafzimmer
    note: '*L''appartement* ist maskulin und verliert das *e* von *le* (Apostroph); *le salon* ist maskulin, *la chambre* ist feminin.'
    example_gloss:
    - Ich habe eine Wohnung.
    - Ich habe ein Wohnzimmer.
    - Ich habe ein Schlafzimmer.
  fr.a1.unit46.lesson01.teach.la_cuisine_la:
    title: Küche, Badezimmer
    gloss: die Küche, das Badezimmer
    note: '*La cuisine* und *la salle de bains* sind beide feminin.'
    example_gloss:
    - Ich habe eine Küche.
    - Ich habe ein Badezimmer.
  fr.a1.unit46.lesson01.teach.j_ai_un:
    title: Sagen, dass man eine Wohnung hat
    gloss: Ich habe eine Wohnung.
    note: '*Avoir* (haben) ist wie im Deutschen das natürliche Verb, um zu sagen, was für eine Wohnung man hat. Dies ist ein allgemeines Beispiel; Mathieus eigene Wohnung (in Lyon) folgt später in dieser Lektion.'
  fr.a1.unit46.lesson01.teach.j_ai_un_2:
    title: Alle Zimmer aufzählen
    gloss: Ich habe ein Wohnzimmer, ein Schlafzimmer, eine Küche und ein Badezimmer.
    note: Alle vier Zimmer aus dem Wortschatz dieser Lektion in einem Satz, durch Kommas getrennt und mit *et* vor dem letzten.
  fr.a1.unit46.lesson02.teach.tu_as_combien:
    title: Nach der Zimmeranzahl fragen
    gloss: Wie viele Zimmer hast du?
    note: 'Nach *combien de* (wie viele) steht ein Nomen im Plural: *combien de pièces*.'
  fr.a1.unit46.lesson02.teach.j_ai_deux:
    title: Die Zahl der Zimmer nennen
    gloss: Ich habe zwei Schlafzimmer.
    note: '*Chambres* ist der Plural von *chambre*, regelmäßig mit einem stummen *-s* gebildet.'
  fr.a1.unit46.lesson02.teach.l_appartement_a:
    title: Die Gesamtzahl der Zimmer nennen
    gloss: Die Wohnung hat drei Zimmer.
    note: '*Pièces* ist ein allgemeines Wort für Zimmer und nicht auf Schlafzimmer beschränkt.'
  fr.a1.unit46.lesson03.teach.le_balcon_le:
    title: Balkon, Garten
    gloss: der Balkon, der Garten
    note: '*Le balcon* und *le jardin* sind beide maskulin.'
    example_gloss:
    - Es gibt einen Balkon.
    - Es gibt keinen Garten.
  fr.a1.unit46.lesson03.teach.il_y_a:
    title: Sagen, dass es etwas gibt
    gloss: Es gibt einen Balkon.
    note: '*Il y a* ist die übliche Konstruktion für „es gibt“. Anders als im Deutschen bleibt sie unveränderlich: Es gibt keinen Kasus, der sich ändert.'
  fr.a1.unit46.lesson03.teach.il_n_y:
    title: Sagen, dass es etwas nicht gibt
    gloss: Es gibt keinen Garten.
    note: '*Pas de* verneint ein unbestimmtes Nomen: *pas de jardin*, nicht *pas un jardin*.'
  fr.a1.unit46.lesson04.teach.cosy:
    title: Gemütlich
    gloss: gemütlich
    note: Ein sehr gebräuchliches, typisch französisches Adjektiv für eine warme, angenehme Atmosphäre.
    example_gloss: Die Wohnung ist klein, aber gemütlich.
  fr.a1.unit46.lesson04.teach.l_appartement_est:
    title: Ein häufiges Beschreibungsmuster
    gloss: Die Wohnung ist klein, aber gemütlich.
    note: '*Petit mais cosy* ist eine sehr natürliche Art, wie Französischsprachige eine kleine Wohnung positiv beschreiben.'
  fr.a1.unit46.lesson04.teach.le_salon_est:
    title: Die Größe eines Zimmers beschreiben
    gloss: Das Wohnzimmer ist groß.
    note: '*Grand* beschreibt ein bestimmtes Zimmer, nicht die ganze Wohnung; es richtet sich nach *le salon*, das maskulin ist.'
  fr.a1.unit46.lesson04.teach.la_cuisine_est:
    title: Die Größe eines anderen Zimmers beschreiben
    gloss: Die Küche ist klein.
    note: 'Dasselbe Muster wie bei *grand* auf der vorigen Karte, mit einem anderen Zimmer: *la cuisine* ist feminin, daher *petite*.'
  fr.a1.unit46.lesson05.teach.appartement_a_lyon:
    title: Eine Wohnungsanzeige lesen
    gloss: 'Wohnung in Lyon: ein Schlafzimmer, ein Wohnzimmer, eine Küche und ein Badezimmer. Es gibt einen Balkon, aber keinen Garten. Die Wohnung ist klein, aber gemütlich.'
    note: Achten Sie auf die Zimmeranzahl, auf vorhandene und fehlende Ausstattung und auf den Gesamteindruck.
    glosses:
      Appartement: Wohnung
      chambre: Schlafzimmer
      salon: Wohnzimmer
      cuisine: die Küche
      bains: Badezimmer
      balcon: Balkon
      jardin: Garten
      petit: klein
      cosy: gemütlich
  fr.a1.unit46.lesson06.teach.camille_salut_mathieu:
    title: Camille fragt nach der Wohnung
    gloss: 'Camille: Hallo Mathieu, wie ist deine neue Wohnung in Lyon?'
    note: '*Nouvel* ist die Form von *nouveau* (neu) vor einem maskulinen Nomen, das mit einem Vokal beginnt: *un nouvel appartement*.'
  fr.a1.unit46.lesson06.teach.mathieu_il_est:
    title: Mathieu beschreibt sie
    gloss: 'Mathieu: Sie ist klein, aber gemütlich. Ich habe ein Schlafzimmer, ein Wohnzimmer, eine Küche und ein Badezimmer.'
    note: Entspricht genau der Wohnungsanzeige aus Lektion 5 – das ist Mathieus tatsächliche Wohnung.
  fr.a1.unit46.lesson06.teach.camille_tu_as:
    title: Camille fragt nach dem Balkon
    gloss: 'Camille: Hast du einen Balkon?'
    note: Eine direkte Ja-Nein-Frage mit *Tu as ... ?*
  fr.a1.unit46.lesson06.teach.mathieu_oui_j:
    title: Mathieu antwortet
    gloss: 'Mathieu: Ja, ich habe einen Balkon, aber keinen Garten.'
    note: Entspricht den Angaben zu Balkon und fehlendem Garten aus der Anzeige in Lektion 5.
  fr.a1.unit46.lesson06.teach.balcon_est_masculin:
    title: Das Genus von balcon
    gloss: '*Balcon* ist maskulin: ein Balkon, er ist klein.'
    note: '*Il* (er, es) ersetzt ein maskulines Nomen wie *balcon*, daher ist auch das Adjektiv maskulin: *il est petit*.'
  fr.a1.unit46.lesson06.teach.camille_ca_a:
    title: Camille reagiert herzlich
    gloss: 'Camille: Das klingt nett! Ich komme bald mal vorbei.'
    note: '*Je passerai te voir* (ich komme vorbei) besteht aus dem Futur *passerai* und *te voir*, „dich sehen“.'
  fr.a1.unit46.lesson06.teach.mathieu_super_tu:
    title: Mathieu heißt sie willkommen
    gloss: 'Mathieu: Super, du bist immer willkommen.'
    note: '*Toujours la bienvenue* (immer willkommen) ist eine herzliche Art, jemanden wieder einzuladen; *bienvenue* ist hier feminin, weil es sich auf Camille bezieht.'
