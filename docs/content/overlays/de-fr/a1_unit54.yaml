teaching:
  fr.a1.unit54.lesson01.teach.l_animal_un:
    title: Tier, Haustier
    gloss: das Tier / ein Haustier
    note: '*Un animal* ist das allgemeine Wort; *un animal de compagnie* (wörtlich „ein Tier der Gesellschaft“) bedeutet speziell ein Haustier.'
    example_gloss:
    - Ein Hund ist ein Tier.
    - Ein Hund ist auch ein Haustier.
  fr.a1.unit54.lesson01.teach.le_chien_le:
    title: Hund und Katze
    gloss: der Hund / die Katze
    example_gloss:
    - Camille hat einen Hund.
    - Thomas hat eine Katze.
  fr.a1.unit54.lesson01.teach.le_poisson_l:
    title: Fisch und Vogel
    gloss: der Fisch / der Vogel
    example_gloss:
    - Opa hat einen Fisch.
    - Nina hat einen Vogel.
  fr.a1.unit54.lesson01.teach.tu_as_un:
    title: Hast du ein Haustier?
    gloss: Hast du ein Haustier?
    note: Dasselbe Fragemuster *Tu as ... ?* kennen Sie schon aus früheren Lektionen.
  fr.a1.unit54.lesson01.teach.oui_j_ai:
    title: Ja, ich habe einen Hund
    gloss: Ja, ich habe einen Hund.
    note: Eine einfache bejahende Antwort mit dem neuen Wortschatz dieser Lektion.
  fr.a1.unit54.lesson01.teach.non_je_n:
    title: Nein, ich habe kein Haustier
    gloss: Nein, ich habe kein Haustier.
    note: '*Pas d''* ersetzt *un* nach einer Verneinung: *Je n''ai pas d''animal de compagnie.* Siehe die Grammatikregel.'
  fr.a1.unit54.lesson01.teach.apres_ne_pas:
    title: 'Pas de: un/une/des verneinen'
    gloss: Nach *ne ... pas* werden *un*, *une* und *des* zu *de* oder *d'*, wie in *Je n'ai pas de temps* (das kennen Sie schon) und hier *Je n'ai pas d'animal de compagnie*.
    note: 'Hier gilt dasselbe Muster wie bei *Je n''ai pas de temps*: keine neue Grammatik, nur ein neues Nomen dazu.'
  fr.a1.unit54.lesson02.teach.promener:
    title: (Ein Tier) ausführen
    gloss: (ein Tier) ausführen, mit dem Hund rausgehen
    note: '*Promener* (spazieren führen) ist ein regelmäßiges Verb auf *-er*; siehe die Grammatikregel.'
    example_gloss: Ich gehe jeden Tag mit dem Hund spazieren.
  fr.a1.unit54.lesson02.teach.promener_est_un:
    title: Promener ist ein regelmäßiges Verb auf -er
    gloss: '*Promener* ist ein regelmäßiges Verb auf *-er*, wie *cuisiner*: *je promène, tu promènes, il promène le chien*. Der Akzent auf dem *e* zeigt, dass es ausgesprochen wird.'
    note: Das Verb bleibt immer in einem Stück, wie die anderen Verben auf *-er*, die Sie schon kennen.
  fr.a1.unit54.lesson02.teach.donner_a_manger:
    title: Füttern
    gloss: füttern
    example_gloss: Ich füttere jeden Tag die Katze.
  fr.a1.unit54.lesson02.teach.jouer_avec:
    title: Spielen mit
    gloss: spielen mit
    example_gloss: Thomas spielt mit seiner Katze.
  fr.a1.unit54.lesson02.teach.je_promene_le:
    title: Ich gehe jeden Tag mit dem Hund spazieren
    gloss: Ich gehe jeden Tag mit dem Hund spazieren.
    note: Verbindet *promener* mit *tous les jours* (jeden Tag), das Sie schon aus einer früheren Lektion kennen.
  fr.a1.unit54.lesson02.teach.je_donne_a:
    title: Ich füttere jeden Tag die Katze
    gloss: Ich füttere jeden Tag die Katze.
    note: Verbindet *donner à manger* (wörtlich „zu essen geben“) mit *tous les jours*.
  fr.a1.unit54.lesson03.teach.au_pluriel_on:
    title: 'Plural: chien -> chiens'
    gloss: 'Im Plural wird meist ein *s* angehängt, das man nicht hört: *chien -> chiens*, *chat -> chats*. Nomen auf *-al* bilden den Plural auf *-aux*: *animal -> animaux*.'
    note: Die regelmäßige französische Pluralbildung wird hier zum ersten Mal vorgestellt, mit Tiernamen als Beispielen.
  fr.a1.unit54.lesson03.teach.chiens_chats:
    title: Hunde und Katzen
    gloss: Hunde / Katzen
    example_gloss:
    - Mathieu liebt Hunde.
    - Léa liebt Katzen.
  fr.a1.unit54.lesson03.teach.poissons_oiseaux:
    title: Fische und Vögel (Plural)
    gloss: Fische / Vögel
    example_gloss:
    - Ich liebe Fische.
    - Opa liebt Vögel.
  fr.a1.unit54.lesson03.teach.j_adore_les:
    title: Ich liebe Tiere
    gloss: Ich liebe Tiere.
    note: 'Auf *adorer* (lieben, sehr mögen) folgt direkt das Nomen, und eine allgemeine Vorliebe steht mit *les*: *J''adore les animaux.*'
  fr.a1.unit54.lesson03.teach.lea_adore_les:
    title: Léa liebt Katzen, hat aber kein Haustier
    gloss: Léa liebt Katzen, aber sie hat kein Haustier.
    note: Bereitet den Gegensatz vor, um den sich der Lesetext der Lektion dreht.
  fr.a1.unit54.lesson04.teach.mathieu_tu_as:
    title: Mathieu fragt nach einem Haustier
    gloss: 'Mathieu: Hast du ein Haustier, Camille?'
  fr.a1.unit54.lesson04.teach.camille_oui_j:
    title: Camille hat einen Hund
    gloss: 'Camille: Ja, ich habe einen Hund.'
  fr.a1.unit54.lesson04.teach.mathieu_comment_est:
    title: Mathieu fragt nach dem Aussehen
    gloss: 'Mathieu: Wie ist er?'
    note: Hier wird *Comment est-il ?* aus der Lektion über das Aussehen wiederverwendet, jetzt mit Bezug auf ein Tier.
  fr.a1.unit54.lesson04.teach.camille_il_a:
    title: Camille beschreibt ihren Hund
    gloss: 'Camille: Er hat braunes Fell und ist klein.'
    note: Greift Wortschatz zu Haarfarbe und Größe aus der Lektion zum Aussehen wieder auf, hier für das Fell eines Tieres statt für die Haare eines Menschen.
  fr.a1.unit54.lesson04.teach.il_et_le:
    title: Il/le bei Tieren
    gloss: '*Il* (er) und *le* (ihn) verwendet man auch für ein männliches Tier, nicht nur für eine Person.'
    note: Bisher bezogen sich *il* und *le* in diesem Kurs immer auf Personen; hier wird ausdrücklich gezeigt, dass sie auch für Tiere gelten.
  fr.a1.unit54.lesson04.teach.mathieu_tu_le:
    title: Mathieu fragt nach dem Gassigehen
    gloss: 'Mathieu: Gehst du jeden Tag mit ihm spazieren?'
  fr.a1.unit54.lesson04.teach.camille_oui_je:
    title: Camille beschreibt ihren Alltag
    gloss: 'Camille: Ja, ich gehe jeden Tag mit ihm spazieren und gebe ihm zu fressen.'
  fr.a1.unit54.lesson05.teach.mathieu_et_lea:
    title: Mathieu, Léa und Thomas über Tiere
    gloss: 'Mathieu und Léa lieben beide Tiere, aber keiner von beiden hat ein Haustier. Mathieu liebt Hunde und Léa liebt Katzen. Thomas dagegen hat ein Haustier: eine Katze. Er spielt oft mit seiner Katze und gibt ihr jeden Tag zu fressen. Und du, hast du ein Haustier?'
    note: Stellt gegenüber, ein Tier zu lieben und es wirklich zu besitzen – das ist der kommunikative Kern dieser Lektion.
    glosses:
      adorent: lieben
      tous: beide
      animaux: Tiere
      deux: beide
      compagnie: Haustier
      chiens: Hunde
      chats: Katzen
      chat: Katze
      joue: spielt
      donne: gibt
      chaque: jeder
      manger: Futter
  fr.a1.unit54.lesson05.teach.thomas_joue_souvent:
    title: Thomas spielt oft mit seiner Katze
    gloss: Thomas spielt oft mit seiner Katze.
    note: '*Souvent* (oft) steht direkt nach dem Verb, wie in den früheren Alltagssätzen.'
  fr.a1.unit54.lesson05.teach.j_adore_les:
    title: Ich liebe Hunde. Ich habe kein Haustier.
    gloss: Ich liebe Hunde. Ich habe kein Haustier.
    note: Eine Muster-Antwort in zwei Sätzen, die Sie für die Schreibaufgabe der Lektion übernehmen können.
  fr.a1.unit54.lesson06.teach.camille_nina_tu:
    title: Camille fragt Nina
    gloss: 'Camille: Nina, hast du auch ein Haustier?'
  fr.a1.unit54.lesson06.teach.nina_oui_j:
    title: Nina hat einen Vogel namens Pico
    gloss: 'Nina: Ja, ich habe einen Vogel. Er heißt Pico.'
    note: '*Il s''appelle* (er heißt) verwendet das Vorstellungsverb aus der allerersten Lektion wieder.'
  fr.a1.unit54.lesson06.teach.mathieu_comme_c:
    title: Mathieu reagiert
    gloss: 'Mathieu: Wie schön! Was machst du jeden Tag mit ihm?'
  fr.a1.unit54.lesson06.teach.nina_je_lui:
    title: Nina füttert ihn jeden Tag
    gloss: 'Nina: Ich füttere ihn jeden Tag.'
  fr.a1.unit54.lesson06.teach.mathieu_j_adore:
    title: Mathieu liebt auch Vögel
    gloss: 'Mathieu: Ich liebe Vögel auch.'
  fr.a1.unit54.lesson06.teach.camille_c_est:
    title: Camille beendet das Gespräch
    gloss: 'Camille: Schön, dass wir drei Tiere lieben!'
    note: Schließt den Kreis um alle Aussagen der drei Personen zu Tieren in dieser Lektion.
