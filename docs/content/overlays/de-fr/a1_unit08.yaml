  fr.a1.unit08.lesson03.dialogue_derniere_seance:
    title: Die letzte Sitzung des Workshops
teaching:
  fr.a1.unit08.lesson01.teach.lundi:
    title: Montag
    gloss: Montag
    note: Die Wochentage sind im Französischen maskulin und werden kleingeschrieben – anders als im Deutschen.
    example_gloss: Der Workshop findet montags nie statt.
  fr.a1.unit08.lesson01.teach.samedi:
    title: Samstag
    gloss: Samstag
    note: '*Le samedi* (mit Artikel) bedeutet „samstags“, also gewohnheitsmäßig; *samedi* allein meint einen bestimmten Samstag – den nächsten oder den gerade vergangenen, je nach Zeitform des Verbs.'
    example_gloss: Der Workshop findet samstags statt.
  fr.a1.unit08.lesson01.teach.dimanche:
    title: Sonntag
    gloss: Sonntag
    note: 'Gleiches Muster wie bei den anderen Wochentagen: maskulin und kleingeschrieben.'
    example_gloss: Die Bäckerei ist sonntags geschlossen.
  fr.a1.unit08.lesson01.teach.aujourdhui:
    title: Heute
    gloss: heute
    note: '*Aujourd''hui* ist ein einziges, feststehendes Wort, auch wenn es historisch aus mehreren Teilen entstanden ist.'
    example_gloss: Heute ist Samstag.
  fr.a1.unit08.lesson01.teach.demain:
    title: Morgen
    gloss: morgen
    note: '*Demain* ist unveränderlich und wird in jedem Zusammenhang gleich verwendet.'
    example_gloss: Die Apotheke öffnet morgen.
  fr.a1.unit08.lesson01.teach.hier:
    title: Gestern
    gloss: gestern
    note: '*Hier* ist das direkte Gegenstück zu *demain*.'
    example_gloss: Ich habe gestern Fisch gegessen.
  fr.a1.unit08.lesson01.teach.quel_jour_sommes_nous:
    title: Nach dem Tag fragen
    gloss: Welcher Tag ist heute?
    note: '*Quel jour sommes-nous ?* (wörtlich „Welchen Tag sind wir“) ist die übliche Frage nach dem Wochentag.'
  fr.a1.unit08.lesson02.teach.mars:
    title: März
    gloss: März
    note: Monatsnamen sind im Französischen wie die Wochentage maskulin und werden kleingeschrieben – anders als im Deutschen.
    example_gloss: Der Workshop endet im März.
  fr.a1.unit08.lesson02.teach.quelle_est_la_date:
    title: Nach dem Datum fragen
    gloss: Welches Datum ist heute?
    note: '*Quelle est la date... ?* ist die übliche Frage nach dem vollständigen Datum, anders als *Quel jour sommes-nous ?*, das nur nach dem Wochentag fragt.'
  fr.a1.unit08.lesson02.teach.cest_le_quinze_mars:
    title: Ein Datum nennen
    gloss: Es ist der fünfzehnte März.
    note: 'Das übliche Muster für Datumsangaben im Französischen ist *le* + Grundzahl + Monat: *quinze* (fünfzehn) statt einer Ordnungszahl wie „fünfzehnte“.'
  fr.a1.unit08.lesson02.teach.nous_sommes_le:
    title: Das heutige Datum nennen
    gloss: Heute ist der fünfzehnte März.
    note: '*Nous sommes le...* ist eine ebenso gebräuchliche Alternative zu *C''est le...*, um das heutige Datum zu nennen.'
  fr.a1.unit08.lesson02.teach.le_premier:
    title: Der Erste (des Monats)
    gloss: der Erste
    note: '*Le premier* ist die EINZIGE Ausnahme von der Regel mit den Grundzahlen: Alle anderen Tage des Monats stehen mit einer einfachen Grundzahl (*le deux*, *le trois* …), nur der Erste verwendet die Ordnungszahl *premier*.'
  fr.a1.unit08.lesson02.teach.le_vingt_deux:
    title: Ein Enddatum nennen
    gloss: Der Workshop endet am zweiundzwanzigsten März.
    note: '*Se termine* (endet) ist ein reflexives Verb; *vingt-deux* ist eine einfache Grundzahl – es gilt dieselbe Regel wie bei *le quinze mars*.'
  fr.a1.unit08.lesson03.teach.line01:
    title: Fragen, wann die letzte Sitzung ist
    gloss: Inès fragt, wann die letzte Sitzung des Workshops ist.
    note: '*C''est quand... ?* (wann ist es) ist eine natürliche, einfache Art, nach einem Zeitpunkt zu fragen.'
  fr.a1.unit08.lesson03.teach.line02:
    title: Datum und Wochentag nennen
    gloss: Mathieu sagt, es sei der 22. März, glaubt er – ein Samstag.
    note: '*Un samedi* (ein Samstag, ohne *le*) nennt einfach den Wochentag, auf den dieses Datum fällt.'
  fr.a1.unit08.lesson03.teach.line03:
    title: Nach dem heutigen Datum fragen
    gloss: Inès fragt, welches Datum heute ist.
    note: Es ist dieselbe Frage *Quelle est la date aujourd'hui ?*, die Sie schon für die Frage nach dem Datum kennen.
  fr.a1.unit08.lesson03.teach.line04:
    title: Das heutige Datum und den Abstand nennen
    gloss: Mathieu sagt, heute sei der 15. März, also in einer Woche.
    note: '*Dans une semaine* (in einer Woche) drückt einen zeitlichen Abstand von heute aus.'
  fr.a1.unit08.lesson03.teach.line05:
    title: Mit einem Plan reagieren
    gloss: Inès sagt, prima, sie habe Zeit, zu diesem Anlass ein Dessert zuzubereiten.
    note: '*J''ai le temps de* + Infinitiv (ich habe Zeit, zu …) ist eine gängige Wendung, um zu sagen, dass die Zeit für etwas reicht.'
  fr.a1.unit08.lesson03.teach.line06:
    title: Den Plan bestätigen
    gloss: Mathieu sagt, gute Idee, dann sehen sie sich also nächsten Samstag, am Zweiundzwanzigsten.
    note: '*Samedi prochain* (nächsten Samstag) bestätigt Wochentag und Datum zugleich und schließt das Gespräch ab.'
