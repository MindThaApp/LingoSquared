course:
  title: Französisch A1
  description: Wochentage und Kalenderdaten nennen (le + Grundzahl + Monat, mit le premier als einziger Ausnahme), während die Geschichte von Inès und Mathieu aus dem Kochworkshop weitergeht und die letzte Sitzung geplant wird. Im Französischen stehen Daten durchgehend mit Grundzahlen (le quinze mars, nicht „der fünfzehnte März“ Wort für Wort); nur der Erste des Monats bildet eine Ausnahme.
