answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Französisch A1
  description: 'Einen einfachen Tagesablauf mit reflexiven Verben (se réveiller, se lever, se coucher) und Reihenfolgewörtern (d''abord, ensuite) beschreiben. Die Erzählung vom Kochworkshop von Inès und Mathieu wird fortgesetzt: Inès fragt nach Mathieus Samstag. Besonders wichtig: Reflexive Verben im Französischen brauchen ein Reflexivpronomen (je ME réveille), das im Deutschen ähnlich wie bei „ich wecke mich“ zu verstehen ist, aber nicht immer wörtlich übereinstimmt (z. B. „aufwachen“ ohne „mich“).'
units:
  fr.a1.unit10.routines:
    title: Der Samstagsablauf
lessons:
  fr.a1.unit10.lesson01.vocabulaire_routine:
    title: Aktivitäten am Morgen
  fr.a1.unit10.lesson02.la_journee_complete:
