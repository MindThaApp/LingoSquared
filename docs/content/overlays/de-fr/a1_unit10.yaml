  fr.a1.unit10.lesson03.dialogue_routine_samedi:
    title: Mathieus Samstagsablauf
teaching:
  fr.a1.unit10.lesson01.teach.se_reveiller:
    title: Aufwachen
    gloss: aufwachen
    note: 'Reflexives Verb: *je me réveille*, *tu te réveilles*. Das Pronomen *me/te/se* richtet sich immer nach dem Subjekt.'
    example_gloss: Ich wache um sieben Uhr auf.
  fr.a1.unit10.lesson01.teach.se_lever:
    title: Aufstehen
    gloss: aufstehen
    note: Nicht dasselbe wie *se réveiller* (wach werden) – *se lever* bedeutet, tatsächlich aus dem Bett zu steigen.
    example_gloss: Ich stehe gleich danach auf.
  fr.a1.unit10.lesson01.teach.prendre_une_douche:
    title: Duschen
    gloss: duschen
    note: '*Prendre une douche* (wörtlich „eine Dusche nehmen“) verwendet *prendre*, dasselbe Verb wie bei Mahlzeiten und Verkehrsmitteln.'
    example_gloss: Ich dusche am Morgen.
  fr.a1.unit10.lesson01.teach.shabiller:
    title: Sich anziehen
    gloss: sich anziehen
    note: 'Noch ein reflexives Verb: *je m''habille*, wobei *m''* vor dem Vokal elidiert wird.'
    example_gloss: Ich ziehe mich vor dem Frühstück an.
  fr.a1.unit10.lesson01.teach.le_petit_dejeuner:
    title: Das Frühstück
    gloss: Frühstück
    note: '*Prendre le petit-déjeuner* (frühstücken) folgt demselben *prendre*-Muster wie *prendre une douche*.'
    example_gloss: Ich frühstücke um acht Uhr.
  fr.a1.unit10.lesson01.teach.quitter_la_maison:
    title: Das Haus verlassen
    gloss: das Haus verlassen
    note: '*Quitter* bedeutet hier „(einen Ort) verlassen“ und wird direkt mit dem Objekt verbunden – anders als *partir*, das kein direktes Objekt hat.'
    example_gloss: Ich verlasse das Haus um neun Uhr.
  fr.a1.unit10.lesson01.teach.dabord_ensuite:
    title: Zuerst … dann …
    gloss: Zuerst stehe ich auf, dann ziehe ich mich an.
    note: '*D''abord* (zuerst) und *ensuite* (dann) sind die grundlegenden Wörter, um einen Ablauf Schritt für Schritt zu beschreiben.'
  fr.a1.unit10.lesson02.teach.rentrer:
    title: Nach Hause gehen
    gloss: nach Hause gehen
    note: '*Rentrer* bedeutet, in das eigene Zuhause zurückzukehren, im Unterschied zum allgemeineren *retourner* (irgendwohin zurückgehen).'
    example_gloss: Ich gehe nach der Arbeit nach Hause.
  fr.a1.unit10.lesson02.teach.diner:
    title: Zu Abend essen
    gloss: zu Abend essen
    note: '*Dîner* kann ein Verb sein (zu Abend essen) oder ein Nomen (*le dîner*, das Abendessen) – der Kontext zeigt, was gemeint ist.'
    example_gloss: Wir essen samstagabends zusammen zu Abend.
  fr.a1.unit10.lesson02.teach.se_coucher:
    title: Ins Bett gehen
    gloss: ins Bett gehen
    note: Der natürliche Abschluss des Tagesablaufs, das Gegenstück zu *se lever* am Anfang.
    example_gloss: Ich gehe gegen dreiundzwanzig Uhr ins Bett.
  fr.a1.unit10.lesson02.teach.le_weekend:
    title: Das Wochenende
    gloss: das Wochenende
    note: '*Le week-end* ist ein gebräuchliches Lehnwort aus dem Englischen im Französischen und wird mit Bindestrich geschrieben.'
    example_gloss: Der Workshop findet am Wochenende statt.
  fr.a1.unit10.lesson02.teach.dhabitude:
    title: Normalerweise
    gloss: normalerweise
    note: '*D''habitude* leitet eine regelmäßige Gewohnheit ein, im Unterschied zu *aujourd''hui* (heute) für ein einmaliges Ereignis.'
    example_gloss: Normalerweise stehe ich um sieben Uhr auf.
  fr.a1.unit10.lesson02.teach.ma_routine_du_samedi:
    title: Einen Samstag beschreiben
    gloss: Samstags stehe ich spät auf, dann gehe ich vor dem Workshop auf den Markt.
    note: Verbindet Reihenfolgewörter wie *d'abord/ensuite* – hier mit *puis* („dann“) –, um einen Samstag zu beschreiben.
  fr.a1.unit10.lesson02.teach.quest_ce_que_tu_fais:
    title: Was machst du?
    gloss: Was machst du samstags?
    note: '*Qu''est-ce que tu fais... ?* ist die übliche informelle Art zu fragen, was jemand macht.'
  fr.a1.unit10.lesson03.teach.line01:
    title: Nach dem Samstag fragen
    gloss: Inès fragt Mathieu, was er samstags vor dem Workshop macht.
    note: '*Tu fais quoi... ?* ist die natürliche, informelle Art zu fragen „Was machst du …?“ und klingt lockerer als *Qu''est-ce que tu fais ?*'
  fr.a1.unit10.lesson03.teach.line02:
    title: Das Aufwachen beschreiben
    gloss: Mathieu sagt, dass er zuerst spät aufwacht, gegen neun Uhr.
    note: '*Vers neuf heures* (gegen neun Uhr) verwendet wieder das Muster *vers* + Uhrzeit für eine ungefähre Zeitangabe.'
  fr.a1.unit10.lesson03.teach.line03:
    title: Fragen, wie es weitergeht
    gloss: Inès fragt, was danach passiert.
    note: Eine kurze, natürliche Nachfrage, damit die Beschreibung des Tagesablaufs weitergeht.
  fr.a1.unit10.lesson03.teach.line04:
    title: Frühstück und Markt beschreiben
    gloss: Mathieu sagt, dass er danach frühstückt und auf den Markt geht.
    note: Zwei zusammenhängende Handlungen, mit *et* verbunden; sie setzen die mit *d'abord* begonnene Reihenfolge fort.
  fr.a1.unit10.lesson03.teach.line05:
    title: Nach der Heimkehr fragen
    gloss: Inès fragt, um wie viel Uhr Mathieu nach Hause kommt.
    note: '*Tu rentres à quelle heure ?* verwendet *rentrer* aus dieser Lektion in einer direkten Frage.'
  fr.a1.unit10.lesson03.teach.line06:
    title: Den Nachmittag beschreiben
    gloss: Mathieu sagt, dass er gegen Mittag nach Hause kommt und sich nachmittags vor dem Abendworkshop ausruht.
    note: '*Se reposer* (sich ausruhen) ist ein weiteres reflexives Verb: *je me repose*.'
