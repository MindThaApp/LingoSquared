teaching:
  fr.a1.unit44.lesson01.teach.je_ne_me:
    title: Sich unwohl fühlen
    gloss: Ich fühle mich nicht gut.
    note: '*Se sentir* ist reflexiv (*je me sens*); *ne ... pas bien* ist die allgemeine, milde Art zu sagen, dass etwas nicht stimmt.'
  fr.a1.unit44.lesson01.teach.malade:
    title: Krank
    gloss: krank
    note: 'Das Grundadjektiv, mit *être* verwendet: *je suis malade*.'
    example_gloss: Ich bin krank.
  fr.a1.unit44.lesson01.teach.je_suis_malade:
    title: Krank sein
    gloss: Ich bin krank.
    note: '*Malade* beschreibt einen allgemeineren, stärkeren Zustand als *pas bien*.'
  fr.a1.unit44.lesson01.teach.mal_a_la:
    title: Kopfschmerzen
    gloss: Kopfschmerzen
    note: '*Mal à la tête* steht mit *avoir*: *j''ai mal à la tête*; *à la*, weil *tête* feminin ist.'
    example_gloss: Ich habe Kopfschmerzen.
  fr.a1.unit44.lesson01.teach.j_ai_mal:
    title: Kopfschmerzen haben
    gloss: Ich habe Kopfschmerzen.
    note: 'Beschwerden stehen mit *avoir* (haben): *j''ai mal*.'
  fr.a1.unit44.lesson01.teach.mal_au_ventre:
    title: Bauchschmerzen
    gloss: Bauchschmerzen
    note: '*Mal au ventre*: *au* ist die Verschmelzung von *à* + *le*, weil *ventre* maskulin ist.'
    example_gloss: Ich habe Bauchschmerzen.
  fr.a1.unit44.lesson01.teach.j_ai_mal_2:
    title: Bauchschmerzen haben
    gloss: Ich habe Bauchschmerzen.
    note: Dasselbe *avoir*-Muster wie bei *mal à la tête*, nur mit *au* statt *à la*.
  fr.a1.unit44.lesson02.teach.qu_est_ce:
    title: Allgemein nachfragen
    gloss: Was ist los?
    note: Eine allgemeine Frage für alle Fälle, um zu fragen, ob etwas nicht stimmt.
  fr.a1.unit44.lesson02.teach.qu_est_ce_2:
    title: Eine feste Wendung
    gloss: Was hast du?
    note: '*Qu''est-ce qui ne va pas ?* ist eine feste Frage, wörtlich „was geht nicht gut“; nicht Wort für Wort übersetzen.'
  fr.a1.unit44.lesson02.teach.mal_a_la:
    title: Halsschmerzen
    gloss: Halsschmerzen
    note: '*Mal à la gorge* folgt dem Muster von *mal à la tête*: *gorge* ist feminin, also *à la*.'
    example_gloss: Ich habe Halsschmerzen.
  fr.a1.unit44.lesson02.teach.j_ai_mal:
    title: Halsschmerzen haben
    gloss: Ich habe Halsschmerzen.
    note: Folgt demselben *avoir*-Muster wie die anderen Beschwerden.
  fr.a1.unit44.lesson02.teach.ca_va_non:
    title: Bei jemandem nachfragen
    gloss: Geht es dir gut? Nein, ich fühle mich nicht gut.
    note: '*Ça va ?* ist eine sehr gebräuchliche, lockere Nachfrage unter Freunden.'
  fr.a1.unit44.lesson03.teach.la_fievre:
    title: Fieber
    gloss: Fieber
    note: '*La fièvre* ist feminin; nach *avoir* steht *de la*: *j''ai de la fièvre*.'
    example_gloss: Ich habe Fieber.
  fr.a1.unit44.lesson03.teach.j_ai_de:
    title: Fieber haben
    gloss: Ich habe Fieber.
    note: Folgt dem *avoir*-Muster, mit dem Teilungsartikel *de la*.
  fr.a1.unit44.lesson03.teach.le_rhume:
    title: Erkältet sein
    gloss: erkältet / erkältet sein
    note: '*Le rhume* ist ein maskulines Nomen, das mit *avoir* steht, nicht ein Adjektiv mit *être*.'
    example_gloss: Ich bin erkältet.
  fr.a1.unit44.lesson03.teach.j_ai_un:
    title: Sagen, dass man erkältet ist
    gloss: Ich bin erkältet.
    note: Das Französische sagt *j'ai un rhume* („ich habe einen Schnupfen“); nicht *je suis rhume*.
  fr.a1.unit44.lesson03.teach.malade_se_dit:
    title: Être oder avoir?
    gloss: '*Malade* ist ein Adjektiv und steht mit *être*: Ich bin krank. *Mal*, *fièvre* und *rhume* sind Nomen und stehen mit *avoir*: Ich habe einen Schnupfen.'
    note: 'Die Wahl zwischen *être* und *avoir* richtet sich nach der Wortart: Ein Adjektiv wie *malade* steht mit *être*, ein Nomen wie *fièvre* mit *avoir* – egal, wie harmlos die Krankheit ist.'
  fr.a1.unit44.lesson04.teach.la_pharmacie:
    title: Die Apotheke
    gloss: die Apotheke
    note: '*Pharmacie* ist feminin: *la pharmacie*.'
    example_gloss: Ich gehe in die Apotheke.
  fr.a1.unit44.lesson04.teach.je_peux_vous:
    title: Die Begrüßung in der Apotheke
    gloss: Wie kann ich Ihnen helfen?
    note: '*Je peux vous aider ?* ist eine übliche höfliche Begrüßung im Service; *vous* ist die Höflichkeitsform.'
  fr.a1.unit44.lesson04.teach.avez_vous_quelque:
    title: Nach etwas gegen ein Symptom fragen
    gloss: Haben Sie etwas gegen Kopfschmerzen?
    note: '*Quelque chose contre* + Beschwerde ist die natürliche Art, nach einem Mittel zu fragen.'
  fr.a1.unit44.lesson04.teach.un_comprime:
    title: Eine Tablette
    gloss: eine Tablette
    note: '*Comprimé* ist maskulin: *un comprimé*.'
    example_gloss: Ich nehme eine Tablette.
  fr.a1.unit44.lesson04.teach.prenez_un_comprime:
    title: Einnahmehinweis
    gloss: Nimm zweimal täglich eine Tablette.
    note: '*Prenez* ist der Imperativ von *prendre* (nehmen) in der *vous*-Form, verwendet für Anweisungen.'
  fr.a1.unit44.lesson04.teach.a_la_pharmacie:
    title: Sprachebene in der Apotheke
    gloss: In der Apotheke verwendet man die Höflichkeitsform *vous*.
    note: Die Apothekerin oder der Apotheker ist eine unbekannte erwachsene Person im Dienstleistungsberuf, deshalb sagt man *vous*, genau wie am Fahrkartenschalter.
  fr.a1.unit44.lesson05.teach.conseil_prends_un:
    title: Einen Apothekenratschlag lesen
    gloss: 'Rat: Nimm zweimal täglich eine Tablette mit Wasser. Ruh dich gut aus und trink viel Wasser. Fühlst du dich nach drei Tagen immer noch nicht gut? Dann geh zum Arzt.'
    note: Achten Sie auf die Dosierung, die zwei Empfehlungen ohne Medikament und darauf, wann man zum Arzt gehen soll.
    glosses:
      Conseil: Rat
      prends: nimm
      fois: Mal
      jour: Tag
      comprimé: Tablette
      Repose-toi: ruh dich aus
      bois: trink
      sens: fühlen
      toujours: immer noch
      bien: gut
      médecin: Arzt / Hausarzt
  fr.a1.unit44.lesson06.teach.camille_salut_mathieu:
    title: Camille fragt nach
    gloss: 'Camille: Hallo Mathieu, wie geht''s? Fühlst du dich schon besser?'
    note: '*Déjà* (schon) zeigt, dass Camille nachfragt, ob es Mathieu seit dem letzten Gespräch besser geht.'
  fr.a1.unit44.lesson06.teach.mathieu_pas_encore:
    title: Mathieu geht es noch nicht gut
    gloss: 'Mathieu: Noch nicht so gut. Ich habe immer noch Kopfschmerzen und bin müde.'
    note: '*Toujours* (immer noch) zeigt, dass die Kopfschmerzen nicht weg sind; *fatigué* (müde) ist ein neues, nützliches Adjektiv.'
  fr.a1.unit44.lesson06.teach.camille_tu_as:
    title: Camille fragt nach der Medizin
    gloss: 'Camille: Hast du eine Tablette genommen?'
    note: '*Pris* ist das Partizip Perfekt von *prendre* und steht mit *as* von *avoir*: *tu as pris*.'
  fr.a1.unit44.lesson06.teach.mathieu_oui_j:
    title: Mathieu bestätigt
    gloss: 'Mathieu: Ja, ich habe eine Tablette genommen. Ich werde mich jetzt ausruhen.'
    note: '*Je vais me reposer* („ich werde mich ausruhen“) bildet mit *aller* + Infinitiv die nahe Zukunft.'
  fr.a1.unit44.lesson06.teach.camille_bonne_idee:
    title: Camille wünscht ihm gute Besserung
    gloss: 'Camille: Gute Idee. Ruh dich gut aus. Gute Besserung!'
    note: '*Bon rétablissement !* ist die feste Wendung, um jemandem baldige Genesung zu wünschen.'
  fr.a1.unit44.lesson06.teach.mathieu_merci_a:
    title: Mathieu verabschiedet sich
    gloss: 'Mathieu: Danke, bis morgen!'
    note: '*À demain !* bildet Abschiedsgrüße mit *à* + Zeitangabe: *à demain*, *à bientôt*.'
