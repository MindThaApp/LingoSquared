teaching:
  fr.a1.unit02.lesson01.teach.zero:
    title: 'Null'
    gloss: 'null'
    note: '*Zéro* steht sowohl für die Zahl selbst als auch für die Ziffer, wenn man eine Ziffernfolge laut vorliest.'
  fr.a1.unit02.lesson01.teach.un:
    title: Eins
    gloss: eins
    note: '*Un* ist maskulin; vor einem femininen Nomen steht die Form *une* (*une tasse*, eine Tasse). Allein, etwa beim Zählen, bleibt es *un*.'
  fr.a1.unit02.lesson01.teach.deux:
    title: Zwei
    gloss: zwei
    note: '*Deux* bleibt unabhängig vom Geschlecht des Nomens unverändert.'
  fr.a1.unit02.lesson01.teach.trois:
    title: Drei
    gloss: drei
    note: '*Trois* ist unveränderlich.'
  fr.a1.unit02.lesson01.teach.quatre:
    title: Vier
    gloss: vier
    note: '*Quatre* ist unveränderlich.'
  fr.a1.unit02.lesson01.teach.cinq:
    title: Fünf
    gloss: fünf
    note: '*Cinq* ist unveränderlich. Das End-q wird normalerweise ausgesprochen, anders als die stummen Endkonsonanten mehrerer anderer französischer Zahlen.'
  fr.a1.unit02.lesson01.teach.six:
    title: Six
    gloss: sechs
    note: '*Six* wird allein mit einem /s/ am Ende gesprochen; vor einem Nomen, das mit Konsonant beginnt, entfällt dieser Endkonsonant (*six livres* klingt wie „si livres“).'
  fr.a1.unit02.lesson01.teach.sept:
    title: Sieben
    gloss: sieben
    note: '*Sept* ist unveränderlich; das p ist stumm, nur das End-t wird gesprochen.'
  fr.a1.unit02.lesson01.teach.huit:
    title: Acht
    gloss: acht
    note: '*Huit* ist unveränderlich. Das h ist stumm, wie in fast allen französischen Wörtern.'
  fr.a1.unit02.lesson01.teach.neuf:
    title: Neun
    gloss: neun
    note: '*Neuf* ist unveränderlich.'
  fr.a1.unit02.lesson01.teach.dix:
    title: Zehn
    gloss: zehn
    note: '*Dix* wird allein mit einem /s/ am Ende gesprochen; es folgt demselben Muster wie *six*: Vor einem Konsonanten entfällt der Endkonsonant.'
  fr.a1.unit02.lesson02.teach.onze:
    title: Elf
    gloss: elf
    note: '*Onze* bis *seize* (11–16) sind jeweils eigene Wörter und nicht aus *dix* gebildet, so wie ab einundzwanzig *vingt* wiederverwendet wird.'
  fr.a1.unit02.lesson02.teach.douze:
    title: Zwölf
    gloss: zwölf
    note: '*Douze* ist ein einzelnes Wort. Es erinnert am Anfang an *deux*, enthält aber kein sichtbares *dix*.'
  fr.a1.unit02.lesson02.teach.treize:
    title: Dreizehn
    gloss: dreizehn
    note: '*Treize* ist ein einzelnes Wort. Es erinnert am Anfang an *trois*, enthält aber kein sichtbares *dix*.'
  fr.a1.unit02.lesson02.teach.quatorze:
    title: Vierzehn
    gloss: vierzehn
    note: '*Quatorze* ist ein einziges Wort. Es erinnert am Anfang an *quatre*, aber *dix* ist darin nicht zu erkennen.'
  fr.a1.unit02.lesson02.teach.quinze:
    title: Fünfzehn
    gloss: fünfzehn
    note: '*Quinze* ist ein einziges Wort. Es ist entfernt mit *cinq* verwandt, aber *dix* ist darin nicht zu erkennen.'
  fr.a1.unit02.lesson02.teach.seize:
    title: Sechzehn
    gloss: sechzehn
    note: '*Seize* ist das letzte der verschmolzenen Wörter dieser Art; ab *dix-sept* (17) wird *dix* wieder sichtbar mit der Einerzahl verbunden.'
  fr.a1.unit02.lesson02.teach.vingt:
    title: Zwanzig
    gloss: zwanzig
    note: '*Vingt* ist ein eigenes Wort. Ab einundzwanzig werden Zehner und Einer kombiniert (*vingt et un*, *vingt-deux*); dieses Muster wiederholt der Kurs weiter unten.'
  fr.a1.unit02.lesson02.teach.trente:
    title: Dreißig
    gloss: dreißig
    note: '*Trente* wird mit einer folgenden Einerzahl durch einen Bindestrich verbunden (*trente-quatre*); nur bei „eins“ steht stattdessen *et* (*trente et un*).'
  fr.a1.unit02.lesson02.teach.trente_quatre:
    title: Vierunddreißig
    gloss: vierunddreißig
    note: '*Trente-quatre* wird mit Bindestrich geschrieben. Im Deutschen schreibt man „vierunddreißig“ dagegen in einem Wort.'
  fr.a1.unit02.lesson02.teach.soixante:
    title: Sechzig
    gloss: sechzig
    note: '*Soixante* verhält sich bis neunundsechzig wie ein normaler Zehner (*soixante-quatre*, 64). Das Unregelmäßige beginnt erst bei siebzig, das als Nächstes folgt.'
  fr.a1.unit02.lesson02.teach.soixante_dix:
    title: Siebzig
    gloss: siebzig
    note: 'Das ist die größte Überraschung bei den französischen Zahlen: Für siebzig gibt es kein eigenes Wort. *Soixante-dix* bedeutet wörtlich „sechzig-zehn“ (60 + 10). Bis *soixante-dix-neuf* (79, „sechzig-neunzehn“) wird so weitergezählt, erst dann beginnt mit *quatre-vingts* bei achtzig eine neue Basis.'
  fr.a1.unit02.lesson02.teach.quatre_vingts:
    title: Achtzig
    gloss: achtzig
    note: '*Quatre-vingts* bedeutet wörtlich „vier Zwanziger“ (4 x 20), ein Überbleibsel eines alten Zwanzigersystems. Das End-s steht nur, wenn die Zahl allein steht oder die Zahl abschließt (*quatre-vingts*, 80); folgt eine Einerzahl, fällt das s weg (*quatre-vingt-un*, 81).'
  fr.a1.unit02.lesson02.teach.quatre_vingt_dix:
    title: Neunzig
    gloss: neunzig
    note: '*Quatre-vingt-dix* bedeutet wörtlich „vier Zwanziger plus zehn“ (4x20 + 10). Dasselbe Zwanzigermuster wie bei siebzig setzt sich bis *quatre-vingt-dix-neuf* (99) fort.'
  fr.a1.unit02.lesson02.teach.cent:
    title: Einhundert
    gloss: einhundert
    note: '*Cent* ist die Form für genau 100 allein, ohne Artikel (nicht „*un cent*“).'
  fr.a1.unit02.lesson03.teach.quel_age_as_tu:
    title: Informell nach dem Alter fragen
    gloss: Wie alt bist du?
    note: Auf Französisch fragt man wörtlich, welches Alter du hast, mit *avoir* (haben) – und nicht mit *être* („sein“) wie im Deutschen.
  fr.a1.unit02.lesson03.teach.jai_vingt_huit_ans:
    title: Das Alter angeben
    gloss: Ich bin achtundzwanzig.
    note: '*Ai* ist die je-Form von *avoir*. *Ans* (Jahre) muss im Französischen immer stehen, während man im Deutschen auch einfach „Ich bin 28“ sagen kann.'
  fr.a1.unit02.lesson03.teach.quel_age_avez_vous:
    title: Formell nach dem Alter fragen
    gloss: Wie alt bist du?
    note: '*Avez-vous* ist die *vous*-Form von *avoir* und passt zum formellen Register aus Einheit 1.'
  fr.a1.unit02.lesson03.teach.jai_trente_et_un_ans:
    title: Ein zusammengesetztes Alter angeben
    gloss: Ich bin einunddreißig.
    note: '*Trente et un* steht mit *et* (und) statt mit Bindestrich, und zwar bei den „-eins“-Formen von dreißig, vierzig, fünfzig und sechzig (*trente et un*, *quarante et un*, *cinquante et un*, *soixante et un*). Einundsiebzig bricht das Muster: Es heißt *soixante et onze* (sechzig + elf), nicht *soixante et un*, denn die Siebziger zählen mit den *dix*-Formen bis *soixante-dix-neuf* (79) weiter.'
  fr.a1.unit02.lesson03.teach.et_toi_quel_age:
    title: Die Frage nach dem Alter zurückgeben
    gloss: Und du, wie alt bist du?
    note: '*Et toi* leitet die Gegenfrage ein; nach *et* steht zur Betonung *toi* (nicht *tu*), das betonte Pronomen.'
  fr.a1.unit02.lesson04.teach.quel_est_ton_numero:
    title: Nach einer Telefonnummer fragen
    gloss: Wie lautet deine Telefonnummer?
    note: '*Quel* richtet sich nach dem maskulinen Nomen *numéro*; bei einem femininen Nomen stünde *quelle*.'
  fr.a1.unit02.lesson04.teach.numero_ines:
    title: Eine Ziffernfolge einzeln vorlesen
    gloss: Null, sechs, eins, fünf, null, zwei, neun, sieben, vier, drei
    note: Echte französische Telefonnummern haben zehn Ziffern und werden meist paarweise gelesen (*zéro six*, *quinze*, *zéro deux* ...). Die Nummern in dieser Einheit haben das echte zehnstellige Format (06 15 02 97 43), werden aber Ziffer für Ziffer gelesen, damit Sie zuerst die einzelnen Ziffern üben.
  fr.a1.unit02.lesson04.teach.cest_le:
    title: Die Nummer einleiten
    gloss: Sie lautet …
    note: '*Le* (maskulin „der“) steht, weil *numéro* ein maskulines Nomen ist.'
  fr.a1.unit02.lesson04.teach.tu_peux_repeter:
    title: Um Wiederholung bitten
    gloss: Kannst du das bitte wiederholen?
    note: '*Peux* ist die *tu*-Form von *pouvoir* (können) und nützlich, wenn eine Nummer zu schnell genannt wurde.'
  fr.a1.unit02.lesson04.teach.bien_sur:
    title: Bereitwillig zustimmen
    gloss: Natürlich; klar
    note: '*Bien sûr* ist eine gängige, freundliche Art, auf eine Bitte zuzusagen.'
  fr.a1.unit02.lesson05.teach.jai_besoin_trois_oeufs:
    title: Eine benötigte Menge angeben
    gloss: Ich brauche drei Eier.
    note: '*J''ai besoin de* (wörtlich „ich habe Bedarf an“) drückt im Französischen „brauchen“ aus, und zwar mit *avoir* statt mit einem eigenen Verb.'
  fr.a1.unit02.lesson05.teach.combien_oeufs:
    title: Nach der benötigten Anzahl fragen
    gloss: Wie viele Eier brauchst du?
    note: '*De combien d''œufs* stellt *de combien* (von wie vielen) vor das Nomen; im Deutschen steht dagegen „wie viele Eier“ ohne „von“.'
  fr.a1.unit02.lesson05.teach.deux_tasses_farine:
    title: Eine abgemessene Menge angeben
    gloss: Zwei Tassen Mehl
    note: '*De* verbindet die Maßeinheit (*tasses*, Tassen) mit dem Gemessenen (*farine*, Mehl); im Deutschen steht dort keine Präposition: „zwei Tassen Mehl“.'
  fr.a1.unit02.lesson05.teach.demi_tasse:
    title: Eine halbe Menge angeben
    gloss: Eine halbe Tasse Zucker
    note: '*Demi-* bleibt als Präfix vor dem Nomen unveränderlich (*une demi-tasse*), anders als das nachgestellte Adjektiv *demi*, das sich angleicht (*une heure et demie*).'
  fr.a1.unit02.lesson05.teach.jai_quatre_oeufs:
    title: Angeben, was vorhanden ist
    gloss: Ich habe vier Eier auf dem Tisch.
    note: '*J''ai* (ich habe) sagt, was schon vorhanden ist, im Unterschied zu *j''ai besoin de* (ich brauche), das sagt, was noch fehlt.'
  fr.a1.unit02.lesson06.teach.line01:
    title: Nach der Anzahl der Eier fragen
    gloss: Inès fragt Mathieu, wie viele Eier er für das Rezept braucht.
    note: 'Inès und Mathieu duzen sich jetzt (*tu*) statt wie in Einheit 1 mit *vous*: Als Kursteilnehmer sind sie schnell zum informellen Register übergegangen.'
  fr.a1.unit02.lesson06.teach.line02:
    title: Die Zutaten nennen
    gloss: Mathieu sagt, dass er drei Eier und zwei Tassen Mehl braucht.
    note: '*J''ai besoin de* nennt, was für das Rezept noch gebraucht wird.'
  fr.a1.unit02.lesson06.teach.line03:
    title: Vorhandene Zutaten anbieten
    gloss: Inès sagt, dass sie vier Eier auf dem Tisch hat, und fragt, ob er auch Zucker braucht.
    note: '*J''ai* nennt, was Inès schon hat, getrennt von dem, was Mathieu braucht.'
  fr.a1.unit02.lesson06.teach.line04:
    title: Eine kleine Menge bestätigen
    gloss: Mathieu sagt ja, ein bisschen – ungefähr eine halbe Tasse.
    note: '*Environ* bedeutet hier „ungefähr“ oder „etwa“ und macht die Mengenangabe weicher.'
  fr.a1.unit02.lesson06.teach.line05:
    title: Nach einer Telefonnummer fragen
    gloss: Inès sagt, perfekt, und fragt dann nach Mathieus Telefonnummer, um ihm wegen des nächsten Kurses zu schreiben.
    note: '*Comme ça je t''écris* („dann schreibe ich dir“) erklärt, warum sie fragt – eine natürliche Gewohnheit, bevor man nach Kontaktdaten fragt.'
  fr.a1.unit02.lesson06.teach.line06:
    title: Die Telefonnummer nennen
    gloss: Mathieu liest seine Nummer Ziffer für Ziffer vor.
    note: '*C''est le* leitet die Nummer ein und passt zum maskulinen Nomen *numéro*.'
  fr.a1.unit02.lesson06.teach.line07:
    title: Sich bedanken und nach dem Alter fragen
    gloss: 'Inès bedankt sich und stellt dann noch eine Frage: wie alt er ist.'
    note: '*Une dernière question* („eine letzte Frage“) zeigt einen natürlichen Themenwechsel im selben Gespräch an.'
  fr.a1.unit02.lesson06.teach.line08:
    title: Sein Alter angeben
    gloss: Mathieu sagt, dass er achtundzwanzig ist, und stellt Inès dieselbe Frage.
    note: '*J''ai vingt-huit ans* verwendet die Form mit Bindestrich, wie in dieser Lektion gelernt.'
  fr.a1.unit02.lesson06.teach.line09:
    title: Ihr Alter angeben
    gloss: Inès sagt, dass sie einunddreißig ist.
    note: '*J''ai trente et un ans* steht mit *et* (und) statt mit Bindestrich, da einunddreißig zu den „-eins“-Formen gehört, die in der Lektion behandelt wurden.'
