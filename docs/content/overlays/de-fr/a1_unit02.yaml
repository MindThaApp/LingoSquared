  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Französisch A1
  description: Zahlen von 0 bis 100 (einschließlich der Formen soixante-dix, quatre-vingts und quatre-vingt-dix), Alter, Telefonnummern und Rezeptmengen – in Fortsetzung von Einheit 1 mit Inès und Mathieu beim Kochworkshop. Besondere Aufmerksamkeit gilt den Altersangaben mit avoir, den Resten des Zwanzigersystems in den französischen Zahlen und der Angleichung in Mengenangaben.
