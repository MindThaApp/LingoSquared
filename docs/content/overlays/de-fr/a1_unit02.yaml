  fr.a1.unit02.lesson02.numbers_eleven_to_hundred:
    title: 'Besondere Formen: elf bis hundert'
  fr.a1.unit02.lesson03.asking_age:
    title: Nach dem Alter fragen
  fr.a1.unit02.lesson04.phone_numbers:
    title: Telefonnummern
  fr.a1.unit02.lesson05.recipe_quantities:
