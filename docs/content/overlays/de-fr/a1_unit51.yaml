teaching:
  fr.a1.unit51.lesson01.teach.combien_ca_coute:
    title: Nach dem Gesamtpreis fragen
    gloss: Wie viel kostet es insgesamt?
    note: '*En tout* (insgesamt) macht deutlich, dass Sie den gesamten Preis wissen möchten, nicht den eines einzelnen Artikels.'
  fr.a1.unit51.lesson01.teach.ca_coute_vingt:
    title: Den Gesamtpreis nennen
    gloss: Es kostet insgesamt fünfundzwanzig Euro.
    note: '*Ça coûte* verwendet *ça* (es) mit *coûte*, der Form von *coûter* (kosten) für eine einzelne Sache.'
  fr.a1.unit51.lesson02.teach.payer_par_carte:
    title: Mit Karte oder bar bezahlen
    gloss: mit Karte bezahlen, bar bezahlen
    note: '*Payer par carte* ist die übliche Wendung für „mit Karte zahlen“, *payer en espèces* bedeutet „bar zahlen“. Man verwendet *par* mit *carte* und *en* mit *espèces*.'
    example_gloss:
    - Kann ich hier mit Karte zahlen?
    - Ich zahle bar.
  fr.a1.unit51.lesson02.teach.je_peux_payer:
    title: Fragen, ob Kartenzahlung möglich ist
    gloss: Kann ich hier mit Karte zahlen?
    note: '*Ici* (hier) verortet die Frage an der Kasse, an der Sie gerade stehen.'
  fr.a1.unit51.lesson02.teach.vous_voulez_payer:
    title: Nach der Zahlungsart fragen
    gloss: Möchten Sie bar oder mit Karte zahlen?
    note: '*Vous voulez ... ?* ist die höfliche Frageform, wie sie eine Kassiererin oder ein Kassierer benutzt, den bzw. die man nicht kennt; Freunde würden *tu veux ... ?* sagen.'
  fr.a1.unit51.lesson03.teach.l_addition:
    title: Die Rechnung
    gloss: die Rechnung
    note: '*Addition* ist weiblich: *l''addition*. *La* wird vor einem Vokal zu *l''* verkürzt.'
    example_gloss: Teilen wir die Rechnung?
  fr.a1.unit51.lesson03.teach.on_partage_l:
    title: Vorschlagen, die Rechnung zu teilen
    gloss: Teilen wir die Rechnung?
    note: '*On ... ?* schlägt vor, etwas gemeinsam zu tun, wie in *On partage ?*. *Partager* (teilen) passt zu *l''addition*.'
  fr.a1.unit51.lesson03.teach.je_peux_payer:
    title: Bitten, getrennt zu zahlen
    gloss: Darf ich getrennt bezahlen?
    note: '*Séparément* (getrennt) steht direkt nach *payer*; so bittet man höflich darum, nur den eigenen Teil der Rechnung zu zahlen.'
  fr.a1.unit51.lesson04.teach.la_monnaie:
    title: Das Wechselgeld
    gloss: das Wechselgeld
    note: '*Monnaie* ist weiblich: *la monnaie*. Gemeint sind die Münzen und Scheine, die man als Wechselgeld zurückbekommt.'
    example_gloss: Hier ist Ihr Wechselgeld.
  fr.a1.unit51.lesson04.teach.voici_votre_monnaie:
    title: Wechselgeld zurückgeben
    gloss: Hier ist Ihr Wechselgeld.
    note: '*Votre* ist das höfliche „Ihr“ und passt zum *vous* an der Kasse.'
  fr.a1.unit51.lesson04.teach.je_n_ai:
    title: Wechselgeld ablehnen
    gloss: Ich brauche kein Wechselgeld.
    note: '*Avoir besoin de* (brauchen) wird von einem Nomen gefolgt: *Je n''ai pas besoin de monnaie.* Nach *ne ... pas* steht *de* statt *de la*.'
  fr.a1.unit51.lesson05.teach.trente_cinq:
    title: Fünfunddreißig
    gloss: fünfunddreißig
    note: '*Trente-cinq* wird mit Bindestrich geschrieben und nennt anders als im Deutschen zuerst die Zehner: dreißig + fünf.'
    example_gloss: Es kostet fünfunddreißig Euro.
  fr.a1.unit51.lesson05.teach.addition_deux_plats:
    title: Eine Restaurantrechnung lesen
    gloss: 'Rechnung: zwei Hauptgerichte und zwei Kaffee. Gesamtbetrag: fünfunddreißig Euro. Mit Karte bezahlt.'
    note: Achten Sie darauf, was bestellt wurde, wie hoch der Gesamtbetrag ist und wie bezahlt wurde.
    glosses:
      Addition: Rechnung
      deux: zwei
      plats: Hauptgerichte
      cafés: Kaffee
      Total: Gesamtbetrag
      trente-cinq: fünfunddreißig
      euros: Euro
      Payé: bezahlt
      carte: Karte
  fr.a1.unit51.lesson06.teach.camille_on_demande:
    title: Camille bittet um die Rechnung
    gloss: 'Camille: Sollen wir um die Rechnung bitten?'
    note: '*Demander* (verlangen, um etwas bitten) hat *l''addition* als direktes Objekt, ohne zusätzliches Wort.'
  fr.a1.unit51.lesson06.teach.mathieu_oui_bonne:
    title: Mathieu fragt nach dem Gesamtbetrag
    gloss: 'Mathieu: Ja, gute Idee. Wie viel kostet es insgesamt?'
    note: Greift die Frage *Combien ça coûte en tout ?* aus Lektion 1 wieder auf.
  fr.a1.unit51.lesson06.teach.camille_ca_fait:
    title: Camille nennt den Gesamtbetrag
    gloss: 'Camille: Das macht fünfunddreißig Euro. Teilen wir?'
    note: '*Ça fait* + Betrag nennt die Gesamtsumme, und *partager* bezieht sich auf die Rechnung.'
  fr.a1.unit51.lesson06.teach.mathieu_non_laisse:
    title: Mathieu besteht darauf zu zahlen
    gloss: 'Mathieu: Nein, lass mich heute zahlen. Du hast mir so sehr geholfen.'
    note: '*Laisse-moi* + Infinitiv bietet an, etwas zu tun, und *aidé* ist das Partizip Perfekt von *aider* (helfen).'
  fr.a1.unit51.lesson06.teach.camille_c_est:
    title: Camille ist gerührt
    gloss: 'Camille: Das ist nett von dir! Danke.'
    note: '*C''est gentil de ta part* (das ist nett von dir) ist ein herzliches, häufiges Kompliment für eine großzügige Geste.'
  fr.a1.unit51.lesson06.teach.mathieu_je_peux:
    title: Mathieu fragt nach der Kartenzahlung
    gloss: 'Mathieu: Kann ich hier mit Karte zahlen?'
    note: Greift *Je peux payer par carte ici ?* aus Lektion 2 wieder auf, jetzt im Restaurant selbst.
  fr.a1.unit51.lesson06.teach.mathieu_paie_l:
    title: 'Paie: die Form für er/sie'
    gloss: Mathieu zahlt die Rechnung.
    note: '*Paie* ist die *il/elle*-Form von *payer* (zahlen): *je paie, tu paies, il paie*.'
