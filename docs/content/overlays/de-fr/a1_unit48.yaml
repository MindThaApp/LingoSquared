teaching:
  fr.a1.unit48.lesson01.teach.le_manteau_le:
    title: Mantel, Pullover
    gloss: der Mantel, der Pullover
    note: '*Le manteau* und *le pull* sind beide maskulin.'
    example_gloss:
    - Ich suche einen Mantel.
    - Ich habe einen Pullover.
  fr.a1.unit48.lesson01.teach.le_pantalon_les:
    title: Hose, Schuhe
    gloss: die Hose, die Schuhe
    note: '*Pantalon* steht im Französischen im Singular, genau wie „Hose“ im Deutschen: *un pantalon* für eine Hose. *Chaussures* ist der Plural von *chaussure*; von Schuhen spricht man meist im Plural.'
    example_gloss:
    - Ich suche eine Hose.
    - Ich suche Schuhe.
  fr.a1.unit48.lesson01.teach.je_cherche_un:
    title: Sagen, was man sucht
    gloss: Ich suche einen Mantel.
    note: '*Chercher* (suchen) steht wie im Deutschen mit direktem Objekt und ohne Präposition: *je cherche un manteau*.'
  fr.a1.unit48.lesson02.teach.la_taille:
    title: Größe
    gloss: die Größe
    note: '*Taille* ist feminin: *la taille*.'
    example_gloss: Welche Größe haben Sie?
  fr.a1.unit48.lesson02.teach.quelle_taille_faites:
    title: Nach der Größe fragen
    gloss: Welche Größe hast du?
    note: '*Quelle taille ?* steht mit *quelle* (welche), weil *taille* feminin ist und es nur wenige mögliche Antworten gibt (S, M, L oder eine Zahl).'
  fr.a1.unit48.lesson02.teach.je_fais_du:
    title: Die eigene Größe nennen
    gloss: Ich habe Größe M.
    note: '*Faire du M* bedeutet „Größe M haben“: Im Französischen steht dafür das Verb *faire* (machen).'
  fr.a1.unit48.lesson03.teach.noir_bleu:
    title: Schwarz, Blau
    gloss: schwarz, blau
    note: Die beiden Grundfarben-Adjektive in dieser Lektion.
    example_gloss:
    - Ich möchte den Mantel in Schwarz.
    - Haben Sie diesen auch in Blau?
  fr.a1.unit48.lesson03.teach.je_veux_le:
    title: Eine Farbe wünschen
    gloss: Ich möchte den Mantel in Schwarz.
    note: '*En* + Farbe ist die übliche Wendung, um die Farbe eines Kleidungsstücks anzugeben, wenn man es bestellt oder verlangt.'
  fr.a1.unit48.lesson03.teach.avez_vous_aussi:
    title: Nach einer anderen Farbe fragen
    gloss: Haben Sie diesen auch in Blau?
    note: Mit *aussi* (auch) fragt man, ob es eine weitere Farbe gibt; hier in der höflichen Form mit *vous*.
  fr.a1.unit48.lesson04.teach.est_ce_que:
    title: Nach der Passform fragen
    gloss: Passt dir dieser Mantel?
    note: '*Aller* (gehen) ist das übliche Verb für die Passform von Kleidung: *il me va bien*, wörtlich „er geht mir gut“.'
  fr.a1.unit48.lesson04.teach.il_me_va:
    title: Gute Passform bestätigen
    gloss: Er passt gut.
    note: '*Bien* (gut) beschreibt, wie das Kleidungsstück sitzt.'
  fr.a1.unit48.lesson04.teach.c_est_trop:
    title: Zu klein
    gloss: Er ist zu klein.
    note: '*Trop* (zu) steht vor dem Adjektiv, um ein Übermaß auszudrücken.'
  fr.a1.unit48.lesson04.teach.c_est_trop_2:
    title: Zu groß
    gloss: Er ist zu groß.
    note: Dasselbe Muster *trop* + Adjektiv wie bei *trop petit* auf der vorigen Karte.
  fr.a1.unit48.lesson05.teach.quatre_vingt_dix:
    title: Neunzig
    gloss: neunzig
    note: '*Quatre-vingt-dix* ist die Zahl 90 (wörtlich „vier Zwanziger zehn“); hier im Preis des Mantels.'
    example_gloss: Der Mantel kostet neunzig Euro.
  fr.a1.unit48.lesson05.teach.le_manteau_coute:
    title: Einen Preis nennen
    gloss: Der Mantel kostet neunzig Euro.
    note: '*Coûte* ist die *il*-Form von *coûter* (kosten).'
  fr.a1.unit48.lesson05.teach.parka_taille_m:
    title: Einen Kassenbon lesen
    gloss: 'Wintermantel: Größe M, Farbe Schwarz. Preis: neunzig Euro. Dieser Mantel passt gut und ist warm.'
    note: Achten Sie auf Größe, Farbe, Preis und die zwei Eigenschaften, die zum Mantel genannt werden.
    glosses:
      Parka: Wintermantel
      taille: Größe
      couleur: Farbe
      noire: schwarz
      Prix: der Preis
      quatre-vingt-dix: neunzig
      euros: Euro
      manteau: Mantel
      va: passt
      chaud: warm
  fr.a1.unit48.lesson06.teach.camille_ce_manteau:
    title: Camille entdeckt den Mantel
    gloss: 'Camille: Dieser Mantel ist schön! Welche Größe hast du?'
    note: '*Joli* (schön, hübsch) ist eine allgemeine positive Reaktion; hier steht es im Maskulinum, passend zu *manteau*.'
  fr.a1.unit48.lesson06.teach.mathieu_je_fais:
    title: Mathieu fragt, ob er ihn anprobieren darf
    gloss: 'Mathieu: Ich habe Größe M. Kann ich ihn anprobieren?'
    note: '*Je peux ... ?* ist die übliche Form, um um Erlaubnis zu bitten; *l''essayer* heißt „ihn anprobieren“, *l''* steht für den Mantel.'
  fr.a1.unit48.lesson06.teach.camille_bien_sur:
    title: Camille fragt nach der Passform
    gloss: 'Camille: Klar. Passt er dir gut?'
    note: '*Il* (er, es) bezieht sich auf *le manteau*, ein maskulines Nomen.'
  fr.a1.unit48.lesson06.teach.mathieu_oui_il:
    title: Mathieu bestätigt
    gloss: 'Mathieu: Ja, er passt mir gut und ist warm.'
    note: Entspricht genau dem Kassenbon aus Lektion 5 – es ist derselbe Mantel.
  fr.a1.unit48.lesson06.teach.camille_super_tu:
    title: Camille fragt nach der Farbe
    gloss: 'Camille: Super! Willst du ihn in Schwarz oder in Blau?'
    note: '*Tu le veux en ... ou en ... ?* bietet eine Auswahl an; *le* steht für den Mantel.'
  fr.a1.unit48.lesson06.teach.mathieu_je_le:
    title: Mathieu entscheidet sich
    gloss: 'Mathieu: Ich nehme ihn in Schwarz.'
    note: '*Prendre* (nehmen) ist das übliche Verb, um eine Kaufentscheidung abzuschließen; die Farbe entspricht dem Kassenbon.'
  fr.a1.unit48.lesson06.teach.on_ecrit_prends:
    title: Prends oder prend
    gloss: '*Prends* ist die Form für ich und du von *prendre* (nehmen); *prend* ist die Form für er/sie.'
    note: 'Das Muster von *prendre*: *je prends, tu prends, il/elle prend*.'
