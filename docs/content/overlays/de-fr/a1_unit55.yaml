  fr.a1.unit55.lesson01.teach.quel_sport_fais:
    title: Welchen Sport machst du?
    gloss: Welchen Sport machst du?
  fr.a1.unit55.lesson01.teach.je_joue_au:
    title: Ich spiele Fußball
    gloss: Ich spiele Fußball.
    note: '*Jouer au* + Ballspiel ist die übliche Art zu sagen, dass man Fußball spielt. Für andere Sportarten verwenden Sie *faire du* oder *faire de la*; siehe Grammatikhinweis.'
  fr.a1.unit55.lesson01.teach.faire_du_de:
    title: Faire du / de la + sport
    gloss: '*Faire du*, *de la* oder *de l''* + Sportart sagt, welchen Sport man macht: *faire du yoga*, *faire de la natation*, *faire de la course à pied*. Beim Fußball sagt man *jouer au football*.'
    note: Eine einzige Konstruktion deckt alle Sportarten ab – auf diesem Niveau muss man nicht für jede Sportart ein eigenes Verb lernen.
  fr.a1.unit55.lesson02.teach.fois_par_semaine:
    title: Mal pro Woche
    gloss: Mal pro Woche
    example_gloss: Ich mache zweimal pro Woche Yoga.
  fr.a1.unit55.lesson02.teach.tu_connais_deja:
    title: Fois par semaine im Vergleich zu tous les jours/souvent
    gloss: Sie kennen bereits *tous les jours* (jeden Tag) und *souvent* (oft). *Deux fois par semaine* (zweimal pro Woche) ist eine neue, genauere Art zu sagen, wie oft man etwas tut.
    note: Erweitert den Wortschatz zur Häufigkeit, der in der Hobby-Lektion schon eingeführt wurde.
  fr.a1.unit55.lesson02.teach.je_fais_du:
    title: Ich mache zweimal pro Woche Yoga
    gloss: Ich mache zweimal pro Woche Yoga.
  fr.a1.unit55.lesson02.teach.mathieu_joue_souvent:
    title: Mathieu spielt oft Fußball
    gloss: Mathieu spielt oft Fußball.
    note: Greift *souvent* (oft) wieder auf, das bereits in einer früheren Lektion für Alltagsroutinen eingeführt wurde.
  fr.a1.unit55.lesson03.teach.tu_connais_deja:
    title: Faire du sport im Vergleich zu faire de la + Sportart
    gloss: 'Sie kennen *faire du sport* bereits aus der Lektion über Hobbys (*Je fais du sport le samedi*). *Faire de la* + Sportart nennt die bestimmte Sportart: *Je fais de la natation*. Beide Formen sind korrektes Französisch.'
    note: '*Faire du sport* wird aus der Hobby-Lektion wiederholt und ist nicht neu. Hier wird es der Nennung einer bestimmten Sportart gegenübergestellt: eine allgemeine und eine genaue Art, über Sport zu sprechen.'
  fr.a1.unit55.lesson03.teach.faire_du_sport:
    title: Sport treiben
