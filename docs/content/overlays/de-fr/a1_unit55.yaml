    gloss: 'Thomas: Im Park, ganz in der Nähe von meinem Zuhause.'
  fr.a1.unit55.lesson04.teach.courir_est_un:
    title: Courir ist unregelmäßig
    gloss: '*Courir* (laufen) ist unregelmäßig: *je cours, tu cours, il court*. Das letzte *s* und das letzte *t* sind stumm.'
    note: '*Courir* folgt nicht dem regelmäßigen *-er*-Muster; deshalb lohnt es sich, die Formen auswendig zu lernen: *je cours*, *tu cours*, *il court*.'
  fr.a1.unit55.lesson04.teach.mathieu_super_j:
    title: Mathieu reagiert
    gloss: 'Mathieu: Super, ich spiele dort oft Fußball.'
  fr.a1.unit55.lesson05.teach.camille_fait_du:
    title: Camille und Léa über Sport
    gloss: Camille macht zweimal pro Woche Yoga. Sie liebt sanfte Bewegung. Léa macht kein Yoga, aber sie liebt es zu schwimmen. Léa schwimmt oft, fast jede Woche. Welchen Sport machst du?
    note: Stellt zwei verschiedene Sportarten und zwei verschiedene Häufigkeitsangaben gegenüber, ähnlich wie der Lesetext zum Tiervergleich in der vorherigen Lektion.
    glosses:
      fait: macht
      deux: zwei
      fois: Mal
      semaine: Woche
      yoga: Yoga
      adore: liebt
      doucement: ruhig
      bouger: bewegen
      nager: schwimmen
      nage: schwimmt
      souvent: oft
      presque: fast
      Quel: welchen
      sport: Sport
  fr.a1.unit55.lesson05.teach.lea_nage_souvent:
    title: Léa schwimmt oft, fast jede Woche
    gloss: Léa schwimmt oft, fast jede Woche.
