    gloss: 'Camille: Sollen wir zusammen Sport machen?'
  fr.a1.unit55.lesson06.teach.tu_connais_deja:
    title: On ... ?
    gloss: '*On ... ?* kennen Sie bereits aus einer früheren Lektion, um etwas gemeinsam vorzuschlagen.'
    note: Verwendet genau die Konstruktion für Vorschläge aus der Lektion über Pläne.
  fr.a1.unit55.lesson06.teach.lea_oui_super:
    title: Léa stimmt zu
    gloss: 'Léa: Ja, super! Ich liebe es zu schwimmen.'
  fr.a1.unit55.lesson06.teach.mathieu_je_prefere:
