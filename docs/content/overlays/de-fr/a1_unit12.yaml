answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Französisch A1
  description: Einen kurzen Bericht über ein kürzlich abgeschlossenes Ereignis im passé composé geben, mit den Hilfsverben avoir und être, und die Koch-Workshop-Geschichte von Inès und Mathieu fortsetzen, in der Mathieu ein Missgeschick vom Workshop am letzten Samstag erzählt. Im Französischen gibt es zwei Hilfsverben (avoir für die meisten Verben, être für eine kleine Gruppe wie aller, arriver, rester); wie im Deutschen mit haben und sein hängt die Wahl vom Verb ab, aber die Gruppen stimmen nicht immer überein. Außerdem richten sich die Partizipien mit être nach dem Subjekt in Geschlecht und Zahl (arrivé/arrivée).
units:
  fr.a1.unit12.past_events:
    title: Was ist passiert?
lessons:
  fr.a1.unit12.lesson01.passe_compose_avoir:
    title: Das passé composé mit avoir
  fr.a1.unit12.lesson02.passe_compose_etre:
    title: Das passé composé mit être
  fr.a1.unit12.lesson03.dialogue_atelier_dernier:
    title: Der Workshop vom letzten Samstag
teaching:
  fr.a1.unit12.lesson01.teach.jai_prepare:
    title: Ich habe zubereitet
    gloss: ich habe zubereitet / ich habe gemacht
    note: 'Regelmäßige Verben auf -ER bilden das Partizip des passé composé auf *-é*: *préparer* → *préparé*, mit *avoir*.'
    example_gloss: Ich habe einen Kuchen für den Workshop gemacht.
  fr.a1.unit12.lesson01.teach.jai_achete:
    title: Ich habe gekauft
    gloss: ich habe gekauft
    note: '*Acheter* folgt demselben Muster *avoir* + *-é* wie *préparer*.'
    example_gloss: Ich habe auf dem Markt Gemüse gekauft.
  fr.a1.unit12.lesson01.teach.jai_oublie:
    title: Ich habe vergessen
    gloss: ich habe vergessen
    note: '*Oublier* → *oublié*, wieder dasselbe regelmäßige Muster.'
    example_gloss: Ich habe die Butter zu Hause vergessen!
  fr.a1.unit12.lesson01.teach.tu_as_aime:
    title: Du hast gemocht
    gloss: du hast gemocht
    note: '*Tu as* + Partizip ist die *tu*-Form derselben Konstruktion mit *avoir*.'
    example_gloss: Hat dir der Kuchen geschmeckt?
  fr.a1.unit12.lesson01.teach.il_a_goute:
    title: Er hat probiert
    gloss: er hat probiert
    note: '*Il a* + Partizip ist die *il*-Form: Das Hilfsverb *avoir* ändert sich mit dem Subjekt, das Partizip bleibt gleich.'
    example_gloss: Mathieu hat die Soße probiert.
  fr.a1.unit12.lesson01.teach.grammar_avoir_participe:
    title: Avoir + Partizip Perfekt
    gloss: avoir + Partizip Perfekt (-é)
    note: Die meisten französischen Verben bilden das passé composé mit *avoir* als Hilfsverb und einem Partizip auf *-é* bei regelmäßigen Verben auf -ER. Das entspricht dem deutschen Perfekt mit „haben“, etwa „ich habe gekauft“.
  fr.a1.unit12.lesson01.teach.la_semaine_derniere:
    title: Letzte Woche
    gloss: letzte Woche
    note: '*Dernière* (letzte) richtet sich nach dem femininen *semaine*; die maskuline Form ist *dernier*, wie in *samedi dernier* (letzten Samstag).'
    example_gloss: Letzte Woche habe ich einen Kuchen gemacht.
  fr.a1.unit12.lesson02.teach.je_suis_arrive:
    title: Ich bin angekommen
    gloss: ich bin angekommen
    note: '*Arriver* gehört zu einer kleinen Gruppe von Verben (meist der Bewegung), die *être* statt *avoir* als Hilfsverb verwenden.'
    example_gloss: Ich bin zu spät zum Workshop gekommen.
  fr.a1.unit12.lesson02.teach.je_suis_alle:
    title: Ich bin gegangen
    gloss: ich bin gegangen
    note: 'Auch *aller* wird mit *être* gebildet. Das Partizip richtet sich nach dem Subjekt: *allé* (maskulin) oder *allée* (feminin, wie Inès es sagen würde).'
    example_gloss: Ich bin vor dem Workshop auf den Markt gegangen.
  fr.a1.unit12.lesson02.teach.il_est_reste:
    title: Er ist geblieben
    gloss: er ist geblieben
    note: '*Rester* (bleiben) ist ein weiteres Verb mit *être* und folgt demselben Angleichungsmuster.'
    example_gloss: Mathieu ist geblieben, um die Küche zu putzen.
  fr.a1.unit12.lesson02.teach.grammar_etre_accord:
    title: 'Être + Partizip: Angleichung'
    gloss: être + Partizip Perfekt (richtet sich nach dem Subjekt)
    note: Bei Verben mit *être* richtet sich das Partizip in Geschlecht und Zahl nach dem Subjekt; bei Verben mit *avoir* ist das nicht der Fall.
  fr.a1.unit12.lesson02.teach.en_retard:
    title: Zu spät
    gloss: zu spät
    note: '*En retard* beschreibt, dass man nach der erwarteten Zeit ankommt, und passt häufig zu *arriver*.'
    example_gloss: Der Bus ist zu spät gekommen.
  fr.a1.unit12.lesson02.teach.finalement:
    title: Schließlich / am Ende
    gloss: schließlich / am Ende
    note: '*Finalement* rundet eine kurze Geschichte ab und zeigt das Ergebnis nach vorherigen Komplikationen.'
    example_gloss: Am Ende war der Kuchen köstlich.
  fr.a1.unit12.lesson02.teach.quest_ce_qui_sest_passe:
    title: Was ist passiert?
    gloss: Was ist passiert?
    note: '*Qu''est-ce qui s''est passé ?* ist die übliche Art zu fragen, was passiert ist.'
    example_gloss: Was ist beim Workshop passiert?
  fr.a1.unit12.lesson03.teach.line01:
    title: Frag, was passiert ist
    gloss: Inès fragt, was beim Workshop am letzten Samstag passiert ist – sie konnte nicht kommen.
    note: '*Qu''est-ce qui s''est passé ?* (Was ist passiert?) ist die übliche Art, nach einem vergangenen Ereignis zu fragen.'
  fr.a1.unit12.lesson03.teach.line02:
    title: Das Missgeschick erzählen
    gloss: 'Mathieu sagt: Oje, er ist zu spät gekommen und hat die Butter zu Hause vergessen!'
    note: 'Zwei Formen des passé composé in einem Satz: mit *être* (*je suis arrivé*) und mit *avoir* (*j''ai oublié*).'
  fr.a1.unit12.lesson03.teach.line03:
    title: Frag, was er gemacht hat
    gloss: Inès fragt, was er dann gemacht hat.
    note: '*Qu''est-ce que tu as fait ?* (Was hast du gemacht?) verwendet das unregelmäßige Partizip von *faire*.'
  fr.a1.unit12.lesson03.teach.line04:
    title: Die Lösung beschreiben
    gloss: Mathieu sagt, er ist schnell zum Laden an der Ecke gegangen.
    note: '*L''épicerie du coin* (der Laden an der Ecke) verwendet *coin* wie in *au coin de la rue*.'
  fr.a1.unit12.lesson03.teach.line05:
    title: Frag, ob es geklappt hat
    gloss: Inès fragt, ob er dort Butter gefunden hat.
    note: '*Tu as trouvé... ?* (Hast du ... gefunden?) ist eine weitere regelmäßige Frage mit *avoir*.'
  fr.a1.unit12.lesson03.teach.line06:
    title: Das Happy End erzählen
    gloss: 'Mathieu sagt: Ja, und am Ende war der Kuchen köstlich!'
    note: Mit *finalement* endet die Geschichte positiv und das frühere Missgeschick ist gelöst.
