teaching:
  fr.a1.unit05.lesson01.teach.poulet:
    title: Hähnchen
    gloss: das Hähnchen
    note: '*Poulet* ist maskulin.'
    example_gloss: Ich hätte gern etwas Hähnchen.
  fr.a1.unit05.lesson01.teach.poisson:
    title: Fisch
    gloss: der Fisch
    note: '*Poisson* ist maskulin.'
    example_gloss: Der Fisch ist heute frisch.
  fr.a1.unit05.lesson01.teach.salade:
    title: Salat
    gloss: der Salat
    note: '*Salade* ist feminin.'
    example_gloss: Sie isst einen Salat.
  fr.a1.unit05.lesson01.teach.riz:
    title: Reis
    gloss: der Reis
    note: '*Riz* ist maskulin und unveränderlich (Singular und Plural werden gleich geschrieben, wie bei *prix*).'
    example_gloss: Reis passt gut zu Hähnchen.
  fr.a1.unit05.lesson01.teach.eau:
    title: Wasser
    gloss: das Wasser
    note: '*Eau* ist feminin; *l''* wird vor dem Vokal apostrophiert, genau wie bei *l''addition* später in dieser Lektion.'
    example_gloss: Ich hätte gern Wasser, bitte.
  fr.a1.unit05.lesson01.teach.vin:
    title: Wein
    gloss: der Wein
    note: '*Vin* ist maskulin.'
    example_gloss: Der Rotwein ist köstlich.
  fr.a1.unit05.lesson01.teach.je_voudrais_poulet_salade:
    title: Hähnchen und Salat bestellen
    gloss: Ich hätte gern Hähnchen und Salat.
    note: '*Du poulet* (maskulin) und *de la salade* (feminin) sind Teilungsartikel („etwas“), die sich nach dem Genus des Nomens richten – anders als nach einer Mengenangabe (*un kilo de*), wo nur *de* steht.'
  fr.a1.unit05.lesson02.teach.dessert:
    title: Dessert
    gloss: Nachspeise
    note: '*Dessert* ist maskulin.'
    example_gloss: Das Dessert geht heute aufs Haus.
  fr.a1.unit05.lesson02.teach.addition:
    title: Die Rechnung
    gloss: die Rechnung
    note: '*Addition* ist feminin; *l''* wird vor dem Vokal apostrophiert. Das ist der übliche französische Begriff im Restaurant, nicht *facture* (eine förmliche Rechnung im Geschäftsverkehr).'
    example_gloss: Die Rechnung, bitte.
  fr.a1.unit05.lesson02.teach.vous_avez_choisi:
    title: Fragen, ob man bestellen möchte
    gloss: Haben Sie schon gewählt?
    note: Die übliche Frage des Kellners, wenn er an den Tisch kommt, um die Bestellung aufzunehmen. Sie steht im passé composé von *choisir* (wählen).
  fr.a1.unit05.lesson02.teach.je_voudrais_un_cafe:
    title: Einen Kaffee bestellen
    gloss: Ich hätte gern einen Kaffee, bitte.
    note: '*Je voudrais* + Gegenstand: dasselbe Muster wie beim Einkaufen, jetzt für Essen und Getränke.'
  fr.a1.unit05.lesson02.teach.qcq_comme_dessert:
    title: Fragen, was es gibt
    gloss: Was haben Sie als Dessert?
    note: '*Qu''est-ce que vous avez comme...?* ist eine natürliche, gebräuchliche Art zu fragen, welche Auswahl es innerhalb einer Kategorie gibt.'
  fr.a1.unit05.lesson02.teach.cest_delicieux:
    title: Sagen, dass etwas köstlich ist
    gloss: Das ist köstlich!
    note: Eine übliche, begeisterte Reaktion aufs Essen; *délicieux* bleibt hier unverändert, da *c'est* sich auf kein Nomen mit Genus bezieht.
  fr.a1.unit05.lesson03.teach.line01:
    title: Begrüßen und fragen, ob man bestellen möchte
    gloss: Der Kellner begrüßt die beiden und fragt, ob sie schon gewählt haben.
    note: Der Satz beginnt mit *Bonjour*, der höflichen Form im Umgang mit Servicepersonal.
  fr.a1.unit05.lesson03.teach.line02:
    title: Salat und Wasser bestellen
    gloss: Inès bestellt einen Salat und Wasser.
    note: '*Je voudrais* wird mit *et* verbunden, um zwei Bestellungen in einem Satz zu nennen.'
  fr.a1.unit05.lesson03.teach.line03:
    title: Hähnchen mit Reis bestellen
    gloss: Mathieu bestellt Hähnchen mit Reis.
    note: '*Avec* (mit) verbindet das Hauptgericht mit der Beilage – eine einfache, gängige Bestellkonstruktion.'
  fr.a1.unit05.lesson03.teach.line04:
    title: Bestätigen und nach Getränken fragen
    gloss: Der Kellner bestätigt die Bestellung und fragt nach den Getränken.
    note: '*Et comme boisson pour vous ?* greift das Muster mit *comme* aus *Qu''est-ce que vous avez comme dessert ?* auf, jetzt für Getränke.'
  fr.a1.unit05.lesson03.teach.line05:
    title: Ein Glas Wein bestellen
    gloss: Mathieu bestellt ein Glas Rotwein.
    note: '*Un verre de* (ein Glas) ist die übliche Art, Wein glasweise zu bestellen.'
  fr.a1.unit05.lesson03.teach.line06:
    title: Auf das Essen reagieren
    gloss: Inès sagt, dass der Salat köstlich ist.
    note: Greift *C'est délicieux !* wieder auf, jetzt für ein bestimmtes Gericht (*cette salade*). *Délicieux* bleibt nach *c'est* maskulin, obwohl *salade* feminin ist; *Elle est délicieuse, cette salade !* ist die Variante mit Angleichung.
  fr.a1.unit05.lesson03.teach.line07:
    title: Den Hunger erklären und die Rechnung erbitten
    gloss: Mathieu sagt, dass der Workshop sie hungrig gemacht hat, und bittet um die Rechnung.
    note: '*Nous a donné faim* (wörtlich „hat uns Hunger gegeben“) ist die natürliche französische Art zu sagen, dass etwas hungrig gemacht hat.'
  fr.a1.unit05.lesson03.teach.line08:
    title: Bestätigen, dass die Rechnung kommt
    gloss: Der Kellner bestätigt, dass er sie sofort bringt.
    note: '*Tout de suite* (sofort) ist eine gängige, beruhigende Wendung im Service.'
