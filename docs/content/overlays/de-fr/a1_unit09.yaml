course:
  title: Französisch A1
  description: 'Nach dem Weg fragen und einfache Wegbeschreibungen geben (à gauche/à droite, tout droit, au coin de la rue, traverser). Die Geschichte um Inès und Mathieu und ihren Kochworkshop geht weiter: Inès sucht ein Geschäft für Küchenbedarf. Im Französischen kann man den Weg mit dem Imperativ in der Höflichkeitsform ("Tournez à gauche") oder im Präsens ("Tu tournes à gauche") beschreiben.'
units:
  fr.a1.unit09.directions:
    title: Wie komme ich dorthin?
lessons:
  fr.a1.unit09.lesson01.vocabulaire_directions:
    title: Wörter für den Weg
  fr.a1.unit09.lesson02.donner_des_indications:
    title: Den Weg beschreiben
  fr.a1.unit09.lesson03.dialogue_chercher_la_boutique:
    title: Auf der Suche nach dem Laden
teaching:
  fr.a1.unit09.lesson01.teach.a_gauche:
    title: Links
    gloss: links / nach links
    note: '*À gauche* steht sowohl für den Ort („es ist links") als auch für die Richtung („links abbiegen").'
    example_gloss: Biegen Sie nach der Bäckerei links ab.
  fr.a1.unit09.lesson01.teach.a_droite:
    title: Rechts
    gloss: rechts / nach rechts
    note: Das genaue Gegenteil von *à gauche*, es wird genauso verwendet.
    example_gloss: Die Apotheke ist rechts vom Café.
  fr.a1.unit09.lesson01.teach.tout_droit:
    title: Geradeaus
    gloss: geradeaus
    note: '*Tout droit* bedeutet „geradeaus". Verwechseln Sie es nicht mit *à droite* („rechts"), das ähnlich aussieht, aber etwas anderes bedeutet.'
    example_gloss: Gehen Sie geradeaus bis zum Markt.
  fr.a1.unit09.lesson01.teach.au_coin_de_la_rue:
    title: An der Straßenecke
    gloss: an der Straßenecke
    note: '*Au coin de* bedeutet „an der Ecke von"; *au coin de la rue* (an der Straßenecke) ist eine sehr häufige Orientierungsangabe.'
    example_gloss: Der Laden ist an der Straßenecke.
  fr.a1.unit09.lesson01.teach.traverser:
    title: Überqueren
    gloss: überqueren
    note: '*Traverser* ist ein regelmäßiges Verb auf -ER: *je traverse*, *tu traverses* usw.'
    example_gloss: Man muss die Straße überqueren, um zum Laden zu kommen.
  fr.a1.unit09.lesson01.teach.la_boutique:
    title: Der Laden
    gloss: der Laden
    note: '*La boutique* bezeichnet meist ein kleines Fachgeschäft, im Unterschied zu einem großen Kaufhaus.'
    example_gloss: Der Laden ist an der Straßenecke, rechts.
  fr.a1.unit09.lesson01.teach.le_carrefour:
    title: Die Kreuzung
    gloss: die Kreuzung
    note: '*Le carrefour* ist die Stelle, an der sich zwei Straßen kreuzen – eine häufige Orientierungsmarke in mündlichen Wegbeschreibungen.'
    example_gloss: Biegen Sie an der Kreuzung links ab.
  fr.a1.unit09.lesson02.teach.pour_aller_a:
    title: Nach dem Weg fragen
    gloss: Entschuldigung, wie komme ich bitte zum Laden?
    note: '*Pour aller à... ?* (wörtlich „um zu ... zu gehen") ist die übliche höfliche Art, nach dem Weg zu einem Ort zu fragen.'
  fr.a1.unit09.lesson02.teach.tournez_a_gauche:
    title: Links abbiegen
    gloss: Biegen Sie nach der Apotheke links ab.
    note: '*Tournez* ist der Imperativ in der *vous*-Form von *tourner* (abbiegen) – die übliche Form, um jemandem, den man nicht gut kennt, den Weg zu beschreiben.'
  fr.a1.unit09.lesson02.teach.continuez_tout_droit:
    title: Weiter geradeaus gehen
    gloss: Gehen Sie geradeaus bis zur Kreuzung.
    note: '*Continuez* (weitergehen) + *tout droit* (geradeaus) ist die übliche Art zu sagen, dass man ohne Abbiegen weitergehen soll.'
  fr.a1.unit09.lesson02.teach.cest_au_coin:
    title: Den Ort angeben
    gloss: Er ist an der Straßenecke, rechts.
    note: Verbindet *au coin de la rue* mit *à droite*, um den Ort genau anzugeben.
  fr.a1.unit09.lesson02.teach.cest_loin:
    title: Sagen, dass es nicht weit ist
    gloss: Es ist nicht weit, nur fünf Minuten zu Fuß.
    note: '*À cinq minutes à pied* (fünf Minuten zu Fuß) ist dasselbe Muster für Gehzeiten, das Sie schon kennen, als Mathieu nach der Apotheke gefragt hat.'
  fr.a1.unit09.lesson03.teach.line01:
    title: Nach einem Laden fragen
    gloss: Inès fragt Mathieu, ob er ein Geschäft kennt, in dem man Küchenutensilien kaufen kann.
    note: '*Tu connais... ?* (Kennst du ...?) ist die übliche informelle Art zu fragen, ob jemand einen Ort kennt.'
  fr.a1.unit09.lesson03.teach.line02:
    title: Den ersten Schritt erklären
    gloss: Mathieu sagt ja, es gebe einen ganz in der Nähe – du biegst an der Kreuzung links ab.
    note: '*Il y en a une* (es gibt einen) benutzt *en*, um die Wiederholung von *boutique* zu vermeiden – eine häufige Abkürzung in der gesprochenen Sprache.'
  fr.a1.unit09.lesson03.teach.line03:
    title: Bestätigen und nachfragen
    gloss: Inès bestätigt „links an der Kreuzung" und fragt, wie es weitergeht.
    note: '*Et ensuite ?* (Und dann?) ist eine einfache, natürliche Art, nach dem nächsten Schritt des Wegs zu fragen.'
  fr.a1.unit09.lesson03.teach.line04:
    title: Den zweiten Schritt erklären
    gloss: Mathieu sagt, danach gehst du geradeaus weiter und überquerst die Straße.
    note: Zwei Verben der Fortbewegung, mit *et* verbunden – eine natürliche Art, eine kurze Route zu beschreiben.
  fr.a1.unit09.lesson03.teach.line05:
    title: Genau nachfragen
    gloss: Inès fragt, wo genau der Laden ist.
    note: '*Exactement* (genau) verlangt eine präzisere Antwort als eine allgemeine Richtungsangabe.'
  fr.a1.unit09.lesson03.teach.line06:
    title: Den genauen Ort angeben
    gloss: Mathieu sagt, er sei an der Straßenecke, direkt gegenüber der Bäckerei.
    note: '*En face de* (gegenüber von) gibt den Ort anhand einer Orientierungsmarke an – ein natürlicher Abschluss einer Wegbeschreibung.'
