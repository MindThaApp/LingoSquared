teaching:
  pl.a1.unit14.lesson01.teach.mlody:
    title: Tânăr
    gloss: tânăr
    note: Un adjectiv descriptiv de bază -- punctul de plecare pentru formele de comparativ din această unitate.
    example_gloss: Marek este tânăr.
  pl.a1.unit14.lesson01.teach.stary:
    title: Bătrân
    gloss: bătrân
    note: Opusul lui młody -- un alt adjectiv pe care această unitate îl transformă în comparativ.
    example_gloss: Bunicul este bătrân.
  pl.a1.unit14.lesson01.teach.comparative_formation_note:
    title: 'Formarea comparativului: adaugă -szy'
    gloss: 'La adjectivele scurte precum stary și młody, schimbi terminația -y în -szy: stary devine starszy, młody devine młodszy. Nu toate adjectivele funcționează așa.'
    note: 'Un tipar simplu pentru aceste două cuvinte: elimini *-y* final și adaugi *-szy* pentru a obține forma de comparativ. Multe alte adjective au altă terminație, așa că nu aplica regula peste tot.'
  pl.a1.unit14.lesson01.teach.starszy_starsza:
    title: Mai în vârstă
    gloss: mai în vârstă
    note: Starszy se folosește pentru un bărbat (sau on); starsza pentru o femeie (sau ona) -- comparativul lui stary.
    example_gloss:
    - Bunicul este mai în vârstă decât tata.
    - Bunica este mai în vârstă decât mama.
  pl.a1.unit14.lesson01.teach.mlodszy_mlodsza:
    title: Mai tânăr
    gloss: mai tânăr
    note: Młodszy pentru un bărbat, młodsza pentru o femeie -- comparativul lui młody.
    example_gloss:
    - Tata este mai tânăr decât bunicul.
    - Mama este mai tânără decât bunica.
  pl.a1.unit14.lesson01.teach.niz:
    title: Decât
    gloss: decât
    note: Niż leagă cele două lucruri comparate -- cuvântul de după niż rămâne în forma sa simplă, de bază.
    example_gloss: Fiul este mai tânăr decât tatăl.
  pl.a1.unit14.lesson01.teach.gender_agreement_note:
    title: Comparativul se acordă cu genul
    gloss: Starszy/starsza și młodszy/młodsza se schimbă în funcție de gen, la fel ca byłem/byłam. Starszy, młodszy pentru un bărbat (on); starsza, młodsza pentru o femeie (ona).
    note: Același tipar ca la *byłem*/*byłam* -- terminația se schimbă după cum vorbești despre un bărbat sau despre o femeie.
  pl.a1.unit14.lesson01.teach.ewa_starsza:
    title: Ewa este mai în vârstă decât Marek
    gloss: Ewa este mai în vârstă decât Marek.
    note: Un fapt real despre cele două personaje ale noastre -- Ewa are 32 de ani, Marek are 28.
  pl.a1.unit14.lesson01.teach.marek_mlodszy:
    title: Marek este mai tânăr decât Ewa
    gloss: Marek este mai tânăr decât Ewa.
    note: Același fapt, spus invers.
  pl.a1.unit14.lesson02.teach.dobry_recap:
    title: Din nou „bun”
    gloss: Dobry (bun) -- îl știi deja din Dzień dobry.
    note: Același adjectiv pe care îl întâlnești încă din prima unitate, acum folosit pentru a forma un comparativ.
  pl.a1.unit14.lesson02.teach.zly:
    title: Rău
    gloss: rău
    note: Opusul lui dobry -- un cuvânt complet nou în această unitate.
    example_gloss: Aceasta este o zi proastă.
  pl.a1.unit14.lesson02.teach.irregular_comparative_note:
    title: Dobry și zły sunt neregulate
    gloss: 'Dobry și zły sunt neregulate: dobry devine lepszy, zły devine gorszy -- nu se adaugă -szy.'
    note: Spre deosebire de *stary*/*młody*, aceste două nu urmează tiparul regulat cu *-szy* -- formele lor de comparativ trebuie pur și simplu învățate.
  pl.a1.unit14.lesson02.teach.lepszy_lepsza:
    title: Mai bine
    gloss: mai bine
    note: Lepszy pentru un bărbat, lepsza pentru o femeie (sau pentru un cuvânt feminin, ca kawa) -- comparativul neregulat al lui dobry.
    example_gloss:
    - El este mai bun decât mine.
    - Cafeaua este mai bună decât ceaiul.
  pl.a1.unit14.lesson02.teach.gorszy_gorsza:
    title: Mai rău
    gloss: mai rău
    note: Gorszy/gorsza -- comparativul neregulat al lui zły.
    example_gloss:
    - El este mai rău decât mine.
    - Ceaiul este mai rău decât cafeaua.
  pl.a1.unit14.lesson02.teach.kawa_herbata_recap:
    title: Din nou cafeaua și ceaiul
    gloss: Kawa și herbata -- cunoști deja aceste cuvinte din lecția de mai devreme despre băuturi.
    note: O scurtă reamintire înainte ca această lecție să le pună într-o comparație.
  pl.a1.unit14.lesson02.teach.gender_note_recap:
    title: Același tipar ca înainte
    gloss: Lepszy/lepsza și gorszy/gorsza se schimbă după gen la fel ca starszy/starsza în lecția trecută.
    note: Aceeași diferență masculin/feminin pe care ai învățat-o adineauri, aplicată unei noi perechi de cuvinte.
  pl.a1.unit14.lesson03.teach.pronouns_recap:
    title: Eu, eu sunt, tu
    gloss: Ja, jestem, ty -- cunoști deja aceste cuvinte din lecțiile anterioare.
    note: O scurtă reamintire înainte de dialogul din această lecție.
  pl.a1.unit14.lesson03.teach.tak_nie_dobrze_recap:
    title: Da, nu, bine
    gloss: Tak, nie și dobrze -- îți sunt deja cunoscute și ele.
    note: Încă o scurtă reamintire înainte de dialog.
  pl.a1.unit14.lesson03.teach.ale_recap:
    title: Din nou „dar”
    gloss: Ale (dar) -- îl știi deja din lecțiile anterioare. Leagă două propoziții care se contrazic.
    note: Un scurt cuvânt de legătură care introduce un contrast, ca și „dar” în română.
  pl.a1.unit14.lesson03.teach.dialogue.line01:
    title: Marek spune că ceaiul e mai bun
    gloss: Ceaiul este mai bun decât cafeaua!
    note: Marek începe cu propria părere, în acord cu ce ne-a spus deja în lecția despre preferințe.
  pl.a1.unit14.lesson03.teach.dialogue.line02:
    title: Ewa nu este de acord
    gloss: Nu, nu! Cafeaua este mai bună decât ceaiul!
    note: Ewa răspunde cu propria părere -- tot în acord cu ce a spus înainte.
  pl.a1.unit14.lesson03.teach.dialogue.line03:
    title: Marek trece la subiectul vârstei
    gloss: Bine, bine. Dar eu sunt mai tânăr decât tine!
    note: Marek renunță la disputa despre băuturi și aduce în discuție ceva de care e sigur.
  pl.a1.unit14.lesson03.teach.dialogue.line04:
    title: Ewa e de acord și își repetă părerea
    gloss: Da, sunt mai în vârstă. Dar cafeaua e mai bună!
    note: Ewa confirmă faptul legat de vârstă, apoi revine la propria părere despre cafea.
