teaching:
  pl.a1.unit06.lesson01.teach.chleb:
    title: Pâine
    gloss: pâine
    note: Un aliment de bază – apare mereu la orice masă.
    example_gloss: Aceasta este pâine.
  pl.a1.unit06.lesson01.teach.maslo_ser:
    title: Unt, brânză
    gloss: unt; brânză
    note: Primul este neutru, al doilea masculin neanimat – niciunul nu își schimbă terminația după proszę o, așa cum explică nota de gramatică a lecției.
    example_gloss:
    - Acesta este unt.
    - Aceasta este brânză.
  pl.a1.unit06.lesson01.teach.woda_mleko:
    title: Apă, lapte
    gloss: apă; lapte
    note: Woda este feminin (forma de acuzativ wodę apare în nota de gramatică a lecției); mleko este neutru și nu se schimbă.
    example_gloss:
    - Aceasta este apă.
    - Acesta este lapte.
  pl.a1.unit06.lesson01.teach.kawa_herbata:
    title: Cafea, ceai
    gloss: cafea; ceai
    note: Ambele sunt feminine – formele de acuzativ kawę/herbatę sunt cele pe care le spui efectiv când comanzi, explicate în nota de gramatică a lecției.
    example_gloss:
    - Aceasta este cafea.
    - Acesta este ceai.
  pl.a1.unit06.lesson01.teach.prosze_o_note:
    title: 'Comanda: proszę o + acuzativ'
    gloss: 'Vă rog să-mi dați + acuzativ: cafea -> kawę, ceai -> herbatę, apă -> wodę. Pâinea, brânza și laptele nu se schimbă.'
    note: După *Proszę o* („vă rog să-mi dați”, literal „cer”) urmează acuzativul. Substantivele feminine precum *kawa*, *herbata* și *woda* înlocuiesc finala *-a* cu *-ę*. Substantivele masculine neanimate precum *chleb* și *ser*, precum și cele neutre precum *mleko*, păstrează exact forma din dicționar.
  pl.a1.unit06.lesson01.teach.prosze_o_kawe:
    title: O cafea, vă rog
    gloss: O cafea, vă rog.
    note: Modul politicos și obișnuit de a comanda un singur lucru – aplică modelul din nota de gramatică într-o cerere completă.
  pl.a1.unit06.lesson02.teach.zupa:
    title: Supă
    gloss: supă
    note: Un fel de mâncare obișnuit la prânz sau la cină, adesea felul zilei, ca în scena de restaurant din această unitate.
    example_gloss: Aceasta este supă.
  pl.a1.unit06.lesson02.teach.sok:
    title: Suc
    gloss: suc
    note: Masculin neanimat, ca chleb și ser – nu își schimbă terminația când îl comanzi.
    example_gloss: Acesta este suc.
  pl.a1.unit06.lesson02.teach.cukier:
    title: Zahăr
    gloss: zahăr
    note: Util pentru cafea sau ceai – tot masculin neanimat, fără schimbare de terminație.
    example_gloss: Acesta este zahăr.
  pl.a1.unit06.lesson02.teach.rachunek:
    title: Nota de plată
    gloss: nota de plată
    note: Ceea ce ceri la sfârșitul mesei – proszę o rachunek este modul standard și politicos de a o cere.
    example_gloss: Nota de plată, vă rog.
  pl.a1.unit06.lesson02.teach.lubic_note:
    title: 'A-i plăcea: lubię, lubi'
    gloss: 'a plăcea / a iubi: îmi place, îi place – Îmi place cafeaua. Lui îi place supa.'
    note: '*Lubić* înseamnă „a-i plăcea”. Aici se învață doar formele de persoana I (*lubię*) și persoana a III-a (*lubi*). *Lubić* cere și el acuzativul, ca *proszę o* – *lubię kawę*, nu *lubię kawa*.'
  pl.a1.unit06.lesson02.teach.lubie_zupe:
    title: Îmi place supa
    gloss: Îmi place supa.
    note: Zupa devine zupę la acuzativ, aceeași trecere feminină -a -> -ę din nota de gramatică din prima lecție.
  pl.a1.unit06.lesson03.teach.danie_dnia:
    title: Felul zilei
    gloss: Felul zilei este supa.
    note: '*Dnia* este genitivul lui *dzień* („zi”) – *danie dnia* înseamnă literal „felul zilei”, exact cum ar scrie un meniu.'
  pl.a1.unit06.lesson03.teach.polecac_note:
    title: 'A recomanda: polecam, poleca'
    gloss: 'a recomanda: recomand, el/ea recomandă – Recomand cafeaua. El recomandă supa.'
    note: '*Polecać* înseamnă „a recomanda” – ospătarul îl folosește ca să sugereze un fel de mâncare, iar clientul același verb ca să ceară o sugestie. Cere și el acuzativul, ca *proszę o* și *lubić*.'
  pl.a1.unit06.lesson03.teach.co_pan_poleca:
    title: Ce recomandați?
    gloss: Ce recomandați?
    note: '*Co* („ce”) plus *pan* de politețe – întrebarea firească pentru un ospătar, cu aceeași formulă de adresare politicoasă din unitatea 1.'
  pl.a1.unit06.lesson03.teach.prosze_bardzo:
    title: Poftiți / Cu plăcere
    gloss: Poftiți.
    note: O expresie flexibilă, de zi cu zi – se spune când servești ceva și la fel de firesc ca răspuns la dziękuję („mulțumesc”).
  pl.a1.unit06.lesson03.teach.juz_podaje:
    title: Imediat
    gloss: Imediat vă servesc.
    note: Literal „servesc deja” – răspunsul obișnuit al ospătarului care confirmă că a auzit comanda.
  pl.a1.unit06.lesson03.teach.dialogue.line01:
    title: Ospătarul anunță felul zilei
    gloss: Ospătarul salută și anunță că felul zilei este supa.
    note: Dzień dobry, reluat din salutările unității 1.
  pl.a1.unit06.lesson03.teach.dialogue.line02:
    title: Ewa cere o recomandare
    gloss: Ewa îl întreabă pe ospătar ce recomandă.
    note: O întrebare politicoasă, formală – pan se adresează respectuos ospătarului.
  pl.a1.unit06.lesson03.teach.dialogue.line03:
    title: Ospătarul recomandă cafeaua
    gloss: Ospătarul recomandă cafeaua.
    note: Polecam – forma de persoana I din nota de gramatică a lecției.
  pl.a1.unit06.lesson03.teach.dialogue.line04:
    title: Ewa își face comanda
    gloss: Ewa spune „bine” și comandă o cafea și o supă.
    note: Îmbină proszę o cu legătura i („și”) din unitatea despre familie, reluând modelul de comandă din prima lecție și vocabularul supei din a doua.
  pl.a1.unit06.lesson03.teach.dialogue.line05:
    title: Ospătarul confirmă
    gloss: Ospătarul spune că aduce imediat comanda.
    note: O confirmare scurtă și firească înainte de a sosi mâncarea.
  pl.a1.unit06.lesson03.teach.dialogue.line06:
    title: Ewa cere nota de plată
    gloss: Ewa mulțumește și cere nota de plată.
    note: Reia dziękuję din unitatea 1 și proszę o + rachunek din lecția 2.
  pl.a1.unit06.lesson03.teach.dialogue.line07:
    title: Ospătarul o înmânează
    gloss: 'Ospătarul spune: poftiți.'
    note: Același proszę bardzo învățat mai devreme în această lecție, folosit acum la înmânarea notei de plată.
