    title: Pasărea Ninei
teaching:
  pl.a1.unit26.lesson01.teach.zwierze_zwierzak:
    title: Animal, un animal de companie
    gloss: animalul / un animal de companie
    note: '*Zwierzę* este cuvântul general pentru animal; *zwierzak* este cuvântul de zi cu zi pentru animal de companie.'
    example_gloss:
    - Câinele este un animal.
    - Câinele este și un animal de companie.
  pl.a1.unit26.lesson01.teach.pies_kot:
    title: Câinele și pisica
    gloss: câinele / pisica
    example_gloss:
    - Ewa are un câine.
    - Tomek are o pisică.
  pl.a1.unit26.lesson01.teach.ryba_ptak:
    title: Peștele și pasărea
    gloss: peștele / pasărea
    example_gloss:
    - Bunicul are un pește.
    - Nina are o pasăre.
  pl.a1.unit26.lesson01.teach.masz_zwierzaka:
    title: Ai un animal de companie?
    gloss: Ai un animal de companie?
    note: Același tipar de întrebare *Masz ...?* pe care îl știi din unitățile anterioare; *masz* este forma pentru *ty* a verbului *mieć*.
  pl.a1.unit26.lesson01.teach.tak_mam_psa:
    title: Da, am un câine
    gloss: Da, am un câine.
    note: Un răspuns afirmativ simplu, cu vocabularul nou al acestei unități.
  pl.a1.unit26.lesson01.teach.nie_nie_mam:
    title: Nu, nu am niciun animal de companie
    gloss: Nu, nu am niciun animal de companie.
    note: '*Nie mam* + genitiv neagă lucrul pe care nu îl ai: *zwierzaka*. Vezi nota de gramatică.'
  pl.a1.unit26.lesson01.teach.nie_mam_czasu:
    title: Nie mam + genitiv
    gloss: 'După *nie mam*, complementul se pune la genitiv: *Nie mam czasu* (N-am timp) și aici *Nie mam zwierzaka* (Nu am un animal de companie).'
    note: Refolosește tiparul *Nie mam czasu*; doar substantivul este nou. Substantivele masculine animate, precum *zwierzak*, arată la fel la acuzativ și la genitiv, în timp ce cele feminine arată schimbarea (*Mam rybę* devine *Nie mam ryby*).
  pl.a1.unit26.lesson02.teach.wyprowadzac_na_spacer:
    title: A scoate la plimbare (un animal)
    gloss: a scoate la plimbare (un animal)
    note: '*Wyprowadzać na spacer* este expresia fixă pentru a scoate un animal la plimbare; verbul este imperfectiv pentru că vorbim despre un obicei. Vezi nota de gramatică.'
    example_gloss: Scot câinele la plimbare în fiecare zi.
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa:
    title: Imperfectivul pentru obiceiuri
    gloss: '*Wyprowadzać* (imperfectiv) descrie un obicei: *Codziennie wyprowadzam psa.* Perfectivul *wyprowadzić* se folosește pentru o singură plimbare încheiată.'
    note: 'Perechi de aspect: imperfectivul (*wyprowadzać*) este pentru ceva repetat, perfectivul (*wyprowadzić*) pentru o acțiune unică și încheiată.'
  pl.a1.unit26.lesson02.teach.karmic:
    title: A da de mâncare
    gloss: a da de mâncare
    example_gloss: Dau de mâncare pisicii în fiecare zi.
  pl.a1.unit26.lesson02.teach.bawic_sie_z:
    title: A se juca cu
    gloss: a se juca cu
    example_gloss: Tomek se joacă cu pisica lui.
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa_2:
    title: Scot câinele la plimbare în fiecare zi
    gloss: Scot câinele la plimbare în fiecare zi.
    note: Combină *wyprowadzać na spacer* cu *codziennie* (în fiecare zi); complementul *psa* este la acuzativ.
  pl.a1.unit26.lesson02.teach.codziennie_karmie_kota:
    title: Dau de mâncare pisicii în fiecare zi
    gloss: Dau de mâncare pisicii în fiecare zi.
    note: '*Karmić* (a hrăni) cere acuzativul animalului: *karmię kota*. Aici este combinat cu *codziennie*.'
  pl.a1.unit26.lesson03.teach.liczba_mnoga_pies:
    title: 'Pluralul: pies, psy'
    gloss: 'Plural: *pies* devine *psy*, *kot* devine *koty*, *ryba* devine *ryby*, *ptak* devine *ptaki*. Cele mai multe pluraluri se termină în *-y*, sau în *-i* după k și g.'
    note: Tiparul regulat al pluralului polonez, prezentat aici pentru prima dată cu substantive care denumesc animale.
  pl.a1.unit26.lesson03.teach.psy_koty:
    title: Câini și pisici
    gloss: câini / pisici
    example_gloss:
    - Marek iubește câinii.
    - Kasia iubește pisicile.
  pl.a1.unit26.lesson03.teach.ryby_ptaki:
    title: Pești și păsări (plural)
    gloss: pești / păsări
    example_gloss:
    - Iubesc peștii.
    - Bunicul iubește păsările.
  pl.a1.unit26.lesson03.teach.kocham_zwierzeta:
    title: Iubesc animalele
    gloss: Iubesc animalele.
    note: '*Kocham* este forma pentru *ja* a verbului *kochać*; complementul său *zwierzęta* este la acuzativ plural.'
  pl.a1.unit26.lesson03.teach.kasia_kocha_koty:
    title: Kasia iubește pisicile, dar nu are un animal de companie
    gloss: Kasia iubește pisicile, dar nu are un animal de companie.
    note: Pregătește contrastul pe care se construiește textul de citit al lecției.
  pl.a1.unit26.lesson04.teach.marek_masz_zwierzaka:
    title: Marek întreabă despre un animal de companie
    gloss: 'Marek: Ai un animal de companie, Ewa?'
  pl.a1.unit26.lesson04.teach.ewa_tak_mam:
    title: Ewa are un câine
    gloss: 'Ewa: Da, am un câine.'
  pl.a1.unit26.lesson04.teach.marek_jak_on:
    title: Marek întreabă cum arată
    gloss: 'Marek: Cum arată?'
    note: Refolosește întrebarea *Jak wygląda ...?* dintr-o lecție anterioară, acum despre un animal; *on* se poate referi la un câine.
  pl.a1.unit26.lesson04.teach.ewa_ma_brazowa:
    title: Ewa își descrie câinele
    gloss: 'Ewa: Are blana maronie și e mic.'
    note: Reia vocabularul culorilor și al mărimii din unitatea despre aspect, acum pentru blana unui animal, nu pentru părul unei persoane.
  pl.a1.unit26.lesson04.teach.zwierzeta_maja_rodzaj:
    title: On și ona pentru animale
    gloss: 'Animalele au gen gramatical: *on* pentru *pies* și *kot*, *ona* pentru *ryba*. Aceste pronume se pot referi la un animal, nu doar la o persoană.'
    note: 'Pronumele urmează genul substantivului: *pies* și *ptak* cer *on*, *ryba* cere *ona*, iar *zwierzę* cere *ono*.'
  pl.a1.unit26.lesson04.teach.marek_codziennie_wyprowadzasz:
    title: Marek întreabă despre plimbări
    gloss: 'Marek: Îl scoți la plimbare în fiecare zi?'
  pl.a1.unit26.lesson04.teach.ewa_tak_codziennie:
    title: Ewa își descrie programul zilnic
    gloss: 'Ewa: Da, îl scot la plimbare în fiecare zi și îl hrănesc.'
  pl.a1.unit26.lesson05.teach.marek_i_kasia:
    title: Marek, Kasia și Tomek despre animale
    gloss: 'Marek și Kasia iubesc amândoi animalele, dar niciunul dintre ei nu are un animal de companie. Marek iubește câinii, iar Kasia iubește pisicile. Tomek are un animal de companie: o pisică. Se joacă des cu pisica lui și o hrănește în fiecare zi. Tu ai un animal de companie?'
    note: Contrastează a iubi un animal cu a avea cu adevărat unul -- chiar scopul comunicativ al unității.
    glosses:
      kochają: iubesc
      oboje: amândoi
      zwierzęta: animale
      zwierzaka: animal de companie
      psy: câini
      koty: pisici
      kota: pisică
      bawi: se joacă
      daje: dă
      co: fiecare
      jeść: mâncare
  pl.a1.unit26.lesson05.teach.tomek_czesto_bawi:
    title: Tomek se joacă des cu pisica lui
    gloss: Tomek se joacă des cu pisica lui.
    note: '*Bawić się z* (a se juca cu) cere instrumentalul: *z kotem*. *Często* este adverbul de frecvență pentru „des”.'
  pl.a1.unit26.lesson05.teach.kocham_psy_nie:
    title: Iubesc câinii. Nu am animal de companie.
    gloss: Iubesc câinii. Nu am animal de companie.
    note: Un răspuns model din două propoziții, bun de reutilizat la sarcina de scriere a unității.
  pl.a1.unit26.lesson06.teach.ewa_nino_ty:
    title: Ewa o întreabă pe Nina
    gloss: 'Ewa: Nina, și tu ai un animal de companie?'
  pl.a1.unit26.lesson06.teach.nina_tak_mam:
    title: Nina are o pasăre pe nume Pico
    gloss: 'Nina: Da, am o pasăre. Se numește Pico.'
    note: '*Ma na imię* (se numește) este aceeași expresie folosită mai înainte pentru a spune un nume.'
  pl.a1.unit26.lesson06.teach.marek_jak_milo:
    title: Reacția lui Marek
    gloss: 'Marek: Ce frumos! Ce faci cu el în fiecare zi?'
  pl.a1.unit26.lesson06.teach.nina_codziennie_go:
    title: Nina îi dă de mâncare în fiecare zi
    gloss: 'Nina: Îi dau de mâncare în fiecare zi.'
  pl.a1.unit26.lesson06.teach.marek_ja_tez:
    title: Și Marek iubește păsările
    gloss: 'Marek: Și eu iubesc păsările.'
  pl.a1.unit26.lesson06.teach.ewa_fajnie_ze:
    title: Ewa încheie conversația
    gloss: 'Ewa: Ce bine că toți trei iubim animalele!'
    note: Închide cercul faptelor despre animale ale celor trei personaje din această unitate.
