teaching:
  pl.a1.unit17.lesson01.teach.jestem_zawod_note:
    title: Sunt inginer / profesoară
    gloss: Sunt inginer. Sunt profesoară. -- „inżynier” și „nauczycielka” își schimbă terminația după „Jestem”.
    note: Este prima dată în acest curs când terminația unui cuvânt se schimbă pentru a arăta profesia -- deocamdată se aplică doar acestor două cuvinte pentru profesii.
  pl.a1.unit17.lesson01.teach.inzynier:
    title: Inginer
    gloss: inginer
    note: În poloneza de zi cu zi, acest cuvânt rămâne de obicei *inżynier* și pentru o femeie.
    example_gloss: Marek este inginer.
  pl.a1.unit17.lesson01.teach.nauczyciel_nauczycielka:
    title: Profesor
    gloss: profesor / profesoară
    note: Spre deosebire de *inżynier*, acest cuvânt pentru o profesie se schimbă după gen -- *nauczyciel* pentru un bărbat, *nauczycielka* pentru o femeie.
    example_gloss:
    - El este profesor.
    - Ewa este profesoară.
  pl.a1.unit17.lesson01.teach.marek_ewa_recap:
    title: Marek și Ewa, din nou
    gloss: Marek, Ewa -- cunoști deja aceste nume din lecțiile anterioare.
    note: O scurtă reamintire înainte ca această lecție să le folosească pe amândouă.
  pl.a1.unit17.lesson01.teach.jest_recap:
    title: Este – din nou
    gloss: Jest -- cunoști deja acest cuvânt din lecțiile anterioare, de ex. „Dom jest tam” (casa este acolo).
    note: O scurtă reamintire înainte ca lecția să-l folosească pentru a vorbi despre meseria cuiva.
  pl.a1.unit17.lesson01.teach.marek_jest_inzynierem:
    title: Meseria lui Marek
    gloss: Marek este inginer.
    note: Faptul pe care se construiește toată unitatea despre Marek.
  pl.a1.unit17.lesson01.teach.ewa_jest_nauczycielka:
    title: Meseria Ewei
    gloss: Ewa este profesoară.
    note: Faptul pe care se construiește toată unitatea despre Ewa.
  pl.a1.unit17.lesson02.teach.pracowac_recap_pracujesz:
    title: A lucra – tu lucrezi
    gloss: 'Pracować (cunoști deja pracuję din lecțiile anterioare): pracuję (eu), pracujesz (tu). Unde lucrezi?'
    note: 'Deocamdată doar două forme: *pracuję* pentru tine însuți, *pracujesz* când întrebi pe altcineva, ca în cazul lui *czuć się* din unitatea trecută.'
  pl.a1.unit17.lesson02.teach.szkola:
    title: Școala
    gloss: școală
    note: Locul unde lucrează o profesoară ca Ewa.
    example_gloss: Lucrez la o școală.
  pl.a1.unit17.lesson02.teach.biuro:
    title: Biroul
    gloss: birou
    note: Locul unde lucrează un inginer ca Marek.
    example_gloss: Lucrez la un birou.
  pl.a1.unit17.lesson02.teach.w_miejsce_pracy_note:
    title: La școală, la birou
    gloss: 'W + locul de muncă: w szkole, w biurze -- același tipar ca în w Warszawie sau w Krakowie.'
    note: Aceeași idee ca la numele de orașe pe care le știi deja (*w Warszawie*, *w Krakowie*) -- terminația se schimbă puțin pentru a spune *în/la* acel loc.
  pl.a1.unit17.lesson02.teach.gdzie_pracujesz_phrase:
    title: Unde lucrezi?
    gloss: Unde lucrezi?
    note: Întrebarea firească despre locul de muncă al cuiva.
  pl.a1.unit17.lesson03.teach.a_ty_recap:
    title: Și tu – din nou
    gloss: A ty -- cunoști deja această expresie din lecțiile anterioare.
    note: O scurtă reamintire înainte de dialogul din această lecție.
  pl.a1.unit17.lesson03.teach.dialogue.line01:
    title: Marek o întreabă pe Ewa despre serviciu
    gloss: Unde lucrezi, Ewa?
    note: Marek începe conversația cu o întrebare directă.
  pl.a1.unit17.lesson03.teach.dialogue.line02:
    title: Ewa răspunde
    gloss: Lucrez la o școală. Sunt profesoară.
    note: Ewa spune și locul de muncă, și meseria -- aceleași fapte învățate mai devreme în această unitate.
  pl.a1.unit17.lesson03.teach.dialogue.line03:
    title: Ewa îl întreabă și ea pe Marek
    gloss: Și tu, Marek? Unde lucrezi?
    note: Ewa îi întoarce întrebarea lui Marek.
  pl.a1.unit17.lesson03.teach.dialogue.line04:
    title: Marek răspunde
    gloss: Lucrez la un birou. Sunt inginer.
    note: Marek spune și locul de muncă, și meseria -- aceleași fapte învățate mai devreme în această unitate.
