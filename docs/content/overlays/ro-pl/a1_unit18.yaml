teaching:
  pl.a1.unit18.lesson01.teach.dom_jest_ma_recap:
    title: Casă, este, are – din nou
    gloss: Dom, jest, ma, Marek, Ewa -- cunoști deja aceste cuvinte din lecțiile anterioare, de ex. „Dom jest tam” (casa este acolo).
    note: O scurtă reamintire înainte ca lecția să le folosească pentru a vorbi despre locuința ta.
  pl.a1.unit18.lesson01.teach.mieszkanie:
    title: Apartamentul
    gloss: apartament
    note: O locuință într-un bloc, nu o casă întreagă.
    example_gloss: Ewa are un apartament.
  pl.a1.unit18.lesson01.teach.duzy_note:
    title: Mare
    gloss: Casa este mare. -- '*duży*' se potrivește cu substantivele masculine, ca '*dom*'.
    note: Este prima dată în acest curs când un cuvânt descrie dimensiunea – deocamdată se folosește doar cu „*dom*”.
  pl.a1.unit18.lesson01.teach.marek_ma_dom_duzy:
    title: Casa lui Marek
    gloss: Marek are o casă. Casa este mare.
    note: Faptul pe care se construiește toată această unitate pentru Marek.
  pl.a1.unit18.lesson01.teach.ewa_ma_mieszkanie:
    title: Locuința Ewei
    gloss: Ewa are un apartament.
    note: Faptul pe care se construiește toată această unitate pentru Ewa.
  pl.a1.unit18.lesson01.teach.pokoj:
    title: Cameră
    gloss: cameră
    note: Un cuvânt general pentru orice cameră dintr-o locuință.
    example_gloss: Unde este camera?
  pl.a1.unit18.lesson01.teach.ile_pokoi_note:
    title: Câte camere?
    gloss: Câte camere ai? Am două camere. -- ai învățat deja „Ile”, numerele și „mam”/„masz” în lecțiile anterioare; „*pokoi*” și „*pokoje*” sunt forme ale cuvântului „*pokój*”.
    note: „*Pokoi*” se folosește imediat după „*Ile*”; „*pokoje*” se folosește imediat după „*dwa*”, „*trzy*” sau „*cztery*” (doi, trei, patru).
  pl.a1.unit18.lesson01.teach.ile_pokoi_masz_phrase:
    title: Câte camere ai?
    gloss: Câte camere ai?
    note: O întrebare firească despre locuința cuiva.
  pl.a1.unit18.lesson01.teach.mam_dwa_pokoje_phrase:
    title: Am două camere
    gloss: Am două camere.
    note: Un răspuns firesc la întrebarea de mai sus.
  pl.a1.unit18.lesson02.teach.kuchnia:
    title: Bucătărie
    gloss: bucătărie
    note: Una dintre cele mai obișnuite camere dintr-o locuință.
    example_gloss: Bucătăria este mică.
  pl.a1.unit18.lesson02.teach.mala_note:
    title: Mic
    gloss: Bucătăria este mică. -- „*mała*” se potrivește cu substantivele feminine, de exemplu „*kuchnia*”.
    note: Este un cuvânt diferit de „*duży*” (mare) – deocamdată se folosește doar cu „*kuchnia*”.
  pl.a1.unit18.lesson02.teach.sypialnia:
    title: Dormitor
    gloss: dormitor
    note: Camera în care dormi.
    example_gloss: Unde este dormitorul?
  pl.a1.unit18.lesson02.teach.lazienka:
    title: Baie
    gloss: baie
    note: Camera cu duș și toaletă.
    example_gloss: Unde este baia?
  pl.a1.unit18.lesson02.teach.gdzie_tam_recap:
    title: Unde, acolo – din nou
    gloss: Gdzie, tam -- ai învățat deja aceste cuvinte în lecțiile anterioare, de exemplu „Bank jest tam” (banca este acolo).
    note: O scurtă reamintire înainte ca lecția să le folosească pentru a vorbi despre camere.
  pl.a1.unit18.lesson02.teach.w_pokoje_locative_note:
    title: În cameră, în bucătărie...
    gloss: 'W + cameră, bucătărie, dormitor, baie: w pokoju, w kuchni, w sypialni, w łazience -- același model ca în w szkole (la școală) sau w biurze (la birou).'
    note: Aceeași idee ca la cuvintele despre locul de muncă pe care le-ai învățat deja – terminația se schimbă puțin pentru a spune „în” acea cameră.
  pl.a1.unit18.lesson02.teach.gdzie_jest_lazienka_phrase:
    title: Unde este baia?
    gloss: Unde este baia? Baia este acolo.
    note: Un schimb firesc de replici pentru a găsi o cameră în casa cuiva.
  pl.a1.unit18.lesson02.teach.kuchnia_jest_mala_phrase:
    title: Bucătăria este mică
    gloss: Bucătăria este mică.
    note: Refolosim cuvântul pentru dimensiune învățat mai devreme în această lecție.
  pl.a1.unit18.lesson03.teach.recap_words:
    title: Da, și, sunt – din nou
    gloss: Tak, i, są, A, ja, jeden -- ai învățat deja aceste cuvinte în lecțiile anterioare.
    note: O scurtă reamintire înainte de dialogul din această lecție.
  pl.a1.unit18.lesson03.teach.lodowka:
    title: Frigider
    gloss: frigider
    note: Un aparat obișnuit din bucătărie.
    example_gloss: În bucătărie este un frigider.
  pl.a1.unit18.lesson03.teach.piekarnik:
    title: Cuptor
    gloss: cuptor
    note: Un alt aparat obișnuit din bucătărie.
    example_gloss: În bucătărie este un cuptor.
  pl.a1.unit18.lesson03.teach.dialogue.line01:
    title: Marek își descrie casa
    gloss: Am o casă. Casa este mare.
    note: Marek începe conversația descriindu-și locuința.
  pl.a1.unit18.lesson03.teach.dialogue.line02:
    title: Ewa întreabă despre camere
    gloss: Câte camere ai?
    note: Ewa pune o întrebare firească în continuare.
  pl.a1.unit18.lesson03.teach.dialogue.line03:
    title: Marek răspunde
    gloss: Am două camere. În casă sunt o bucătărie, un dormitor și o baie.
    note: Marek spune câte camere are și enumeră camerele din casa lui.
  pl.a1.unit18.lesson03.teach.dialogue.line04:
    title: Ewa își descrie locuința
    gloss: Iar eu am un apartament. Am o cameră.
    note: Ewa trece la descrierea propriei locuințe, mai mici.
  pl.a1.unit18.lesson03.teach.dialogue.line05:
    title: Ewa întreabă despre bucătărie
    gloss: Bucătăria este mică?
    note: Ewa îi pune lui Marek o întrebare în continuare despre bucătăria lui.
  pl.a1.unit18.lesson03.teach.dialogue.line06:
    title: Marek răspunde
    gloss: Da, bucătăria este mică. În bucătărie sunt un frigider și un cuptor.
    note: Marek confirmă dimensiunea bucătăriei și numește două obiecte din ea.
