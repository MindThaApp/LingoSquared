teaching:
  pl.a1.unit13.lesson01.teach.muzyka:
    title: Muzică
    gloss: muzică
    note: Un subiect obișnuit când vorbești despre ce îți place și ce nu -- un cuvânt ușor de recunoscut, pentru că seamănă mult cu românescul „muzică”.
    example_gloss: Îmi place muzica.
  pl.a1.unit13.lesson01.teach.muzyke_accusative_note:
    title: Muzyka -> muzykę
    gloss: După lubić (a-i plăcea) + complement, muzyka devine muzykę, la fel cum kawa devine kawę. Lubię muzykę, nu Lubię muzyka.
    note: 'Același tipar pe care îl știi deja: *muzyka* devine *muzykę* ca obiect al verbului *lubię*, la fel cum *kawa* devine *kawę*.'
  pl.a1.unit13.lesson01.teach.lubisz:
    title: Îți place
    gloss: îți place (informal, ty)
    note: Forma „ty” a verbului lubić -- cea de care ai nevoie ca să întrebi direct un prieten dacă îi place ceva.
    example_gloss: Îți place muzica?
  pl.a1.unit13.lesson01.teach.lubic_paradigm_note:
    title: 'Lubić: lubię, lubisz, lubi'
    gloss: 'Lubić (a-i plăcea): lubię (eu), lubisz (tu), lubi (el/ea). Lubię și lubi le știi deja -- lubisz este forma nouă, pentru persoana cu care vorbești.'
    note: '*Lubię* și *lubi* îți sunt deja familiare -- *lubisz* completează forma lipsă, „tu”, a aceluiași verb.'
  pl.a1.unit13.lesson01.teach.czy_lubisz_muzyke:
    title: Îți place muzica?
    gloss: Îți place muzica?
    note: Czy deschide o întrebare cu răspuns da/nu -- modul firesc de a întreba un prieten despre o preferință.
  pl.a1.unit13.lesson01.teach.tak_lubie:
    title: Da, îmi place.
    gloss: Da, îmi place.
    note: Un răspuns scurt și firesc – nu e nevoie să repeți cuvântul muzykę.
  pl.a1.unit13.lesson01.teach.nie_nie_lubie:
    title: Nu, nu-mi place.
    gloss: Nu, nu-mi place.
    note: 'Nie nie lubię pare dublat, dar nu e o greșeală: primul nie răspunde la întrebare, al doilea nie neagă verbul lubię.'
  pl.a1.unit13.lesson01.teach.ellipsis_note:
    title: Răspunsuri scurte
    gloss: 'Răspuns scurt: Tak, lubię. / Nie, nie lubię. – nu e nevoie să repeți cuvântul muzykę, deoarece din întrebare se înțelege deja despre ce e vorba.'
    note: Așa cum *Pyszny?* poate sta singur, nici *Tak, lubię.* nu trebuie să repete despre ce vorbești – contextul spune deja totul.
  pl.a1.unit13.lesson01.teach.bardzo_lubie_muzyke:
    title: Îmi place foarte mult muzica
    gloss: Îmi place foarte mult muzica.
    note: Bardzo (foarte / mult) întărește o simplă preferință – cuvântul bardzo îl cunoști încă din prima unitate.
  pl.a1.unit13.lesson02.teach.wole:
    title: Prefer
    gloss: prefer
    note: Un verb nou în această unitate, woleć (a prefera) – aici înveți doar forma pentru „eu”, ca la lubię.
    example_gloss: Prefer ceaiul.
  pl.a1.unit13.lesson02.teach.wolec_scope_note:
    title: 'Woleć: în această unitate doar wolę'
    gloss: 'Woleć (a prefera): wolę (eu) – în această lecție înveți doar forma pentru „eu”, ca la lubię. Wolę kawę. = Prefer cafeaua.'
    note: Deocamdată doar forma *ja* (eu) a verbului *woleć*, exact ca la *lubię* când a fost introdus.
  pl.a1.unit13.lesson02.teach.kawa_herbata_recap:
    title: Din nou cafea și ceai
    gloss: 'Wolę + complement: kawa devine kawę, herbata devine herbatę – același tipar pe care îl știi deja.'
    note: 'Același tipar de acuzativ ca înainte, doar cu un verb nou: *wolę kawę*, *wolę herbatę*.'
  pl.a1.unit13.lesson02.teach.wole_kawe:
    title: Prefer cafeaua
    gloss: Prefer cafeaua.
    note: O simplă afirmare a preferinței cu wolę.
  pl.a1.unit13.lesson02.teach.wole_herbate:
    title: Prefer ceaiul
    gloss: Prefer ceaiul.
    note: Același tipar, cu herbatę în loc de kawę.
  pl.a1.unit13.lesson02.teach.czy_or_note:
    title: Czy ca „sau”
    gloss: Czy din Kawa czy herbata? nu este același czy care deschide o întrebare cu da/nu – aici leagă două variante, ca „sau” în română. Kawa czy herbata? = Cafea sau ceai?
    note: 'Atenție: *czy* deschide de obicei o întrebare cu da/nu, dar între două substantive ca aici înseamnă pur și simplu „sau”.'
  pl.a1.unit13.lesson02.teach.kawa_czy_herbata:
    title: Cafea sau ceai?
    gloss: Cafea sau ceai?
    note: O modalitate scurtă și firească de a-i oferi cuiva de ales.
  pl.a1.unit13.lesson03.teach.ja_tez:
    title: Și eu
    gloss: și eu / eu de asemenea
    note: O modalitate scurtă de a fi de acord cu ce tocmai a spus cineva.
  pl.a1.unit13.lesson03.teach.ja_tez_note:
    title: Ja też, din nou
    gloss: Ja też înseamnă „și eu” / „eu de asemenea” – îl știi deja din lecția despre rutină (Ja też wstaję o siódmej, „și eu mă trezesc la șapte”).
    note: 'O mică reamintire: această expresie a mai apărut.'
  pl.a1.unit13.lesson03.teach.elliptical_reminder_note:
    title: Kawa czy herbata? nu are nevoie de verb
    gloss: Ca și Pyszny? din unitatea anterioară, întrebarea scurtă Kawa czy herbata? nu are nevoie de verb – contextul este suficient.
    note: Același tipar ca la *Pyszny?* – o întrebare scurtă, fără verb, pe care contextul o face perfect clară.
  pl.a1.unit13.lesson03.teach.dialogue.line01:
    title: Marek o întreabă pe Ewa dacă îi place muzica
    gloss: Îți place muzica?
    note: Marek începe conversația cu întrebarea predată în această unitate.
  pl.a1.unit13.lesson03.teach.dialogue.line02:
    title: Ewa spune că îi place și întreabă la rândul ei
    gloss: Da, îmi place foarte mult! Și ție?
    note: A ty? (și ție?) îi întoarce întrebarea lui Marek, același tipar văzut în unitățile anterioare.
  pl.a1.unit13.lesson03.teach.dialogue.line03:
    title: Marek este de acord și întreabă despre băuturi
    gloss: Și mie. Cafea sau ceai?
    note: Ja też lubię confirmă răspunsul lui Marek însuși, înainte să schimbe subiectul cu o nouă întrebare cu alegere.
  pl.a1.unit13.lesson03.teach.dialogue.line04:
    title: Ewa preferă cafeaua
    gloss: Prefer cafeaua.
    note: Preferința proprie a Ewei, exprimată cu wolę – aceeași iubitoare de cafea pe care am întâlnit-o în unitatea despre rutină.
  pl.a1.unit13.lesson03.teach.dialogue.line05:
    title: Marek preferă ceaiul
    gloss: Eu prefer ceaiul.
    note: Preferința proprie a lui Marek – alegerea opusă celei a Ewei.
