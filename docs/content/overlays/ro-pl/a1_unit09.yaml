teaching:
  pl.a1.unit09.lesson01.teach.isc_dojsc:
    title: A merge, a ajunge
    gloss: a merge; a ajunge
    note: 'Două verbe de mișcare strâns legate: iść este „a merge” în general, iar dojść este mai precis „a ajunge” la o destinație, folosit în modelul de întrebare predat în această lecție.'
    example_gloss:
    - Vă rog, mergeți drept înainte.
    - Cum ajung la bancă?
  pl.a1.unit09.lesson01.teach.prosto:
    title: Înainte
    gloss: drept înainte
    note: Cel mai simplu cuvânt pentru direcție; se folosește imediat după iść pentru a spune „mergi drept”.
    example_gloss: Vă rog, mergeți drept până la parc.
  pl.a1.unit09.lesson01.teach.tam_potem:
    title: Acolo, apoi
    gloss: acolo; apoi
    note: Tam indică un loc; potem leagă pașii într-o succesiune („mai întâi asta, apoi aia”). Ambele sunt esențiale pentru a înlănțui indicațiile de drum.
    example_gloss:
    - Banca este acolo.
    - Apoi, vă rog, mergeți drept înainte.
  pl.a1.unit09.lesson01.teach.prosze_bezokolicznik:
    title: Please + infinitive
    gloss: 'Proszę + infinitiv – Proszę (vă rog) plus un verb la infinitiv este modul politicos obișnuit de a indica un drum, fără o formă separată de imperativ: Vă rog, mergeți drept înainte.'
    note: '*Proszę* plus un verb la infinitiv este modul în care polonezii cer politicos cuiva să facă ceva – *Proszę iść prosto* („Vă rog, mergeți drept înainte”). Este alegerea sigură și politicoasă cu un străin, așa că nu ai nevoie de imperativ ca să dai sau să înțelegi indicații de drum. (Între prieteni, polonezii folosesc de obicei imperativul – îl vei întâlni mai târziu.)'
  pl.a1.unit09.lesson01.teach.jak_dojsc_note:
    title: Cum ajung la + [loc]?
    gloss: 'Cum ajung la + [loc]? – Jak (cum) plus dojść (a ajunge la) întreabă drumul spre un loc: Cum ajung la bancă? Cum ajung la hotel? Cum ajung la parc? Substantivul de după do primește aceeași terminație de genitiv -u ca după obok/naprzeciwko în lecția anterioară: bank -> banku, hotel -> hotelu, park -> parku.'
    note: '*Jak dojść do...?* este întrebarea obișnuită pentru a afla cum ajungi într-un loc. Numele locului de după *do* primește aceeași terminație de genitiv *-u* pe care ai învățat-o deja după *obok*/*naprzeciwko* – *bank* devine *banku*, *hotel* devine *hotelu*, *park* devine *parku*, exact același model, doar după o prepoziție nouă.'
  pl.a1.unit09.lesson01.teach.jak_dojsc_do_banku:
    title: Cum ajung la bancă?
    gloss: Cum ajung la bancă?
    note: Modelul din nota de gramatică, aplicat primei destinații din această lecție.
  pl.a1.unit09.lesson02.teach.prawo_lewo:
    title: Dreapta, stânga
    gloss: dreapta; stânga
    note: Se folosește după na pentru a spune unde se află ceva sau încotro să cotești – na prawo (la dreapta), na lewo (la stânga).
    example_gloss:
    - Banca este în dreapta.
    - Parcul este în stânga.
  pl.a1.unit09.lesson02.teach.skrecic:
    title: A coti
    gloss: a coti
    note: Verbul pentru schimbarea direcției – împreună cu na prawo/na lewo înseamnă „cotește la dreapta”/„cotește la stânga”.
    example_gloss: Vă rog, cotiți la dreapta.
  pl.a1.unit09.lesson02.teach.skrecic_na_lewo:
    title: Vă rog, cotiți la stânga
    gloss: Vă rog, cotiți la stânga.
    note: Același model Proszę + infinitiv, de data aceasta cu skręcić și na lewo.
  pl.a1.unit09.lesson02.teach.ulica:
    title: Stradă
    gloss: stradă
    note: Un cuvânt obișnuit pentru orice stradă – util ori de câte ori indicațiile menționează una anume pe nume.
    example_gloss: Strada este acolo.
  pl.a1.unit09.lesson02.teach.multi_step_note:
    title: Înlănțuirea indicațiilor cu potem
    gloss: 'Vă rog, mergeți drept înainte, apoi cotiți la dreapta. – Mai multe indicații se pot lega printr-o virgulă și cuvântul potem (apoi): mai întâi o acțiune, apoi următoarea.'
    note: 'Pentru a da mai multe indicații una după alta, le legi printr-o virgulă și *potem*: *Proszę iść prosto, potem skręcić na prawo* („Vă rog, mergeți drept înainte, apoi cotiți la dreapta”). Indicațiile reale, în mai mulți pași, se construiesc exact așa.'
  pl.a1.unit09.lesson03.teach.rozumiem:
    title: Înțeleg
    gloss: înțeleg
    note: O formulă utilă pentru a confirma că ai urmărit indicațiile, înainte de a pune o altă întrebare.
    example_gloss: Înțeleg, mulțumesc.
  pl.a1.unit09.lesson03.teach.dialogue.line01:
    title: Ewa întreabă cum ajunge la parc
    gloss: Ewa cere scuze și întreabă cum ajunge la parc.
    note: Przepraszam deschide întrebarea, la fel ca obiceiul politicos din dialogul despre locuri din lecția anterioară.
  pl.a1.unit09.lesson03.teach.dialogue.line02:
    title: Un trecător indică drumul spre parc
    gloss: Trecătorul spune să meargă drept înainte, apoi să cotească la stânga. Parcul este acolo.
    note: Două indicații înlănțuite cu potem, exact așa cum descrie nota de gramatică a acestei lecții.
  pl.a1.unit09.lesson03.teach.dialogue.line03:
    title: Ewa confirmă și întreabă despre bancă
    gloss: Ewa spune că înțelege și întreabă cum ajunge la bancă.
    note: Rozumiem confirmă că a urmărit primele indicații, înainte de a pune o nouă întrebare.
  pl.a1.unit09.lesson03.teach.dialogue.line04:
    title: Trecătorul indică drumul spre bancă
    gloss: Trecătorul spune să cotească la dreapta, apoi să meargă drept înainte. Banca este în dreapta.
    note: Un traseu în doi pași, diferit de cel spre parc, care reia același model Proszę + infinitiv.
  pl.a1.unit09.lesson03.teach.dialogue.line05:
    title: Ewa mulțumește
    gloss: Ewa spune mulțumesc frumos.
    note: Dziękuję bardzo, reluat din lecțiile despre cumpărături și locuri.
  pl.a1.unit09.lesson03.teach.dialogue.line06:
    title: Trecătorul răspunde
    gloss: Trecătorul spune „cu plăcere”.
    note: Proszę bardzo, răspunsul obișnuit la mulțumiri, reluat din lecțiile anterioare.
