answer_policy:
  diacritics: 'Same standing policy as unit01: display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Poloneză A1
units:
  pl.a1.unit02.numbers:
    title: Numerele
lessons:
  pl.a1.unit02.lesson01.numbers_zero_to_ten:
    title: Numerele de la zero la zece
  pl.a1.unit02.lesson02.numbers_and_prices:
    title: Numerele de la unsprezece la o sută și prețurile
  pl.a1.unit02.lesson03.phone_and_age:
    title: Numărul de telefon și vârsta
teaching:
  pl.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: zero
    note: Punctul de plecare pentru toate numerele care urmează în această unitate.
    example_gloss: Azi sunt zero grade.
  pl.a1.unit02.lesson01.teach.jeden:
    title: Unu
    gloss: unu
    note: După *jeden* urmează un substantiv obișnuit la singular, spre deosebire de toate celelalte numere din această lecție.
    example_gloss: Am un telefon.
  pl.a1.unit02.lesson01.teach.dwa:
    title: Doi
    gloss: doi
    note: După *dwa*, *trzy* și *cztery* substantivul ia o formă specială de plural (ca *psy*, „câini”), diferită de pluralul folosit după *pięć* și mai departe.
    example_gloss: Am doi câini.
  pl.a1.unit02.lesson01.teach.trzy:
    title: Trei
    gloss: trei
    note: 'Același model de plural ca la *dwa*: *trzy złote* (trei zloți), nu *trzy złotych*.'
    example_gloss: Cafeaua costă trei zloți.
  pl.a1.unit02.lesson01.teach.cztery:
    title: Patru
    gloss: patru
    note: Ultimul dintre cele trei numere (*dwa*, *trzy*, *cztery*) care au acest model de plural.
    example_gloss: Am patru cărți.
  pl.a1.unit02.lesson01.teach.piec:
    title: Cinci
    gloss: cinci
    note: De la *pięć* încolo, numerele cer o altă formă de plural a substantivului (genitivul plural, de ex. *minut* în loc de *minuty*) – vei vedea acest model în tot restul unității.
    example_gloss: Am cinci minute.
  pl.a1.unit02.lesson01.teach.szesc:
    title: Șase
    gloss: șase
    note: 'Același model de genitiv plural ca la *pięć*: *sześć jabłek* (șase mere).'
    example_gloss: Am șase mere.
  pl.a1.unit02.lesson01.teach.siedem:
    title: Șapte
    gloss: șapte
    note: Un număr util când vorbești despre zilele săptămânii.
    example_gloss: O săptămână are șapte zile.
  pl.a1.unit02.lesson01.teach.osiem:
    title: Opt
    gloss: opt
    note: '*Mam osiem lat* înseamnă literal „am opt ani” – ca și în română, vârsta se exprimă cu verbul *mieć* („a avea”). Vei exersa acest model pe deplin în lecția 3.'
    example_gloss: Am opt ani.
  pl.a1.unit02.lesson01.teach.dziewiec:
    title: Nouă
    gloss: nouă
    note: 'Din nou genitiv plural: *dziewięć osób* (nouă persoane).'
    example_gloss: Nouă persoane așteaptă la coadă.
  pl.a1.unit02.lesson01.teach.dziesiec:
    title: Zece
    gloss: zece
    note: Ultimul dintre numerele de o cifră – lecția 2 continuă cu numerele de la 11 în sus și cu zecile.
    example_gloss: Am zece degete.
  pl.a1.unit02.lesson02.teach.jedenascie:
    title: Unsprezece
    gloss: unsprezece
    note: 'Numerele de la 11 la 19 se termină în *-naście*, asemănător cu terminația -sprezece din română. Ca *pięć* și următoarele, cer genitivul plural: *jedenaście osób*.'
    example_gloss: Clasa are unsprezece persoane.
  pl.a1.unit02.lesson02.teach.dwanascie:
    title: Doisprezece
    gloss: doisprezece
    note: Același model *-naście* ca la *jedenaście*.
    example_gloss: Un an are douăsprezece luni.
  pl.a1.unit02.lesson02.teach.pietnascie:
    title: Cincisprezece
    gloss: cincisprezece
    note: 'Tot modelul *-naście*: *piętnaście minut* (cincisprezece minute).'
    example_gloss: Am o pauză de cincisprezece minute.
  pl.a1.unit02.lesson02.teach.dwadziescia:
    title: Douăzeci
    gloss: douăzeci
    note: Numerele de la 20 la 40 se termină în *-dzieści* – un model diferit de cel al numerelor în *-naście*. *Dwadzieścia* cere în continuare genitivul plural (*dwadzieścia lat*), dar urmărește lecția 3 pentru ce se întâmplă când adaugi o cifră a unităților.
    example_gloss: Am douăzeci de ani.
  pl.a1.unit02.lesson02.teach.dwadziescia_jeden:
    title: Douăzeci și unu
    gloss: douăzeci și unu
    note: 'Numerele compuse se formează așa: mai întâi zecea, apoi unitatea, fără niciun cuvânt de legătură. În română, în schimb, se adaugă „și” (douăzeci și unu).'
  pl.a1.unit02.lesson02.teach.trzydziesci:
    title: Treizeci
    gloss: treizeci
    note: Tot modelul *-dzieści*, ca la *dwadzieścia*.
    example_gloss: Biletul costă treizeci de zloți.
  pl.a1.unit02.lesson02.teach.piecdziesiat:
    title: Cincizeci
    gloss: cincizeci
    note: Numerele de la 50 la 90 trec la un al treilea model, *-dziesiąt*, în loc de *-dzieści*.
    example_gloss: Am cincizeci de zloți.
  pl.a1.unit02.lesson02.teach.sto:
    title: O sută
    gloss: o sută
    note: Un număr rotund simplu, fără terminații compuse de care să ții cont.
    example_gloss: Asta costă o sută de zloți.
  pl.a1.unit02.lesson02.teach.ile:
    title: Cât / câți
    gloss: cât; câți
    note: Cuvântul interogativ pentru orice cantitate sau preț.
    example_gloss: Cât costă asta?
  pl.a1.unit02.lesson02.teach.ile_to_kosztuje:
    title: Întrebarea despre preț
    gloss: Cât costă asta?
    note: '*Kosztować* („a costa”) este verbul, iar *to* („asta”) este subiectul. Întreaga întrebare este un tipar fix, foarte frecvent.'
  pl.a1.unit02.lesson02.teach.to_kosztuje_dwadziescia:
    title: Spui un preț
    gloss: Asta costă douăzeci de zloți.
    note: '*Złotych* este genitivul plural de la *złoty* (moneda poloneză) – același plural pe care îl cere și *dwadzieścia*.'
  pl.a1.unit02.lesson03.teach.jaki_jest_pana_numer:
    title: Întrebi numărul de telefon al unui bărbat
    gloss: Care este numărul dumneavoastră de telefon? (unui bărbat, formal)
    note: 'Literal: „care este numărul de telefon al domnului”. *Pana* este forma posesivă (genitiv) de la *pan* – „al domnului”, adică „al dumneavoastră”.'
  pl.a1.unit02.lesson03.teach.jaki_jest_pani_numer:
    title: Întrebi numărul de telefon al unei femei
    gloss: Care este numărul dumneavoastră de telefon? (unei femei, formal)
    note: Înlocuiești *pana* cu *pani* ca să te adresezi formal unei femei, la fel ca în modelul din unitatea 1.
  pl.a1.unit02.lesson03.teach.jaki_jest_twoj_numer:
    title: Întrebi numărul de telefon, informal
    gloss: Care este numărul tău de telefon? (informal)
    note: '*Twój* („al tău”) înlocuiește *pana*/*pani* când vorbești cu un prieten sau cu un cunoscut de aceeași vârstă.'
  pl.a1.unit02.lesson03.teach.numer_to:
    title: Cum anunți un număr
    gloss: Numărul este...
    note: O formulă scurtă și firească înainte de a citi cifrele pe rând – așa spun polonezii în mod obișnuit un număr de telefon.
  pl.a1.unit02.lesson03.teach.przykladowy_numer:
    title: Un exemplu de număr de telefon
    gloss: Șase, unu, cinci, zero, doi.
    note: Numerele de telefon poloneze se citesc cifră cu cifră, la fel ca de multe ori în română – fiecare cifră de aici a fost deja învățată în această unitate.
  pl.a1.unit02.lesson03.teach.ile_masz_lat:
    title: Întrebi vârsta cuiva, informal
    gloss: Câți ani ai? (informal)
    note: Literal „câți ani ai” – ca și în română, vârsta se exprimă cu *mieć* („a avea”), tiparul văzut deja la cardul *osiem* din lecția 1.
  pl.a1.unit02.lesson03.teach.ile_pan_ma_lat:
    title: Întrebi vârsta cuiva, formal
    gloss: Câți ani aveți? (unui bărbat, formal)
    note: '*Ma* este aceeași formă de persoana a treia pe care ai văzut-o în unitatea 1 la *pan jest*/*pan ma* – *pan* se comportă gramatical ca „domnul”, deci ca un subiect de persoana a treia.'
  pl.a1.unit02.lesson03.teach.mam_dwadziescia_osiem_lat:
    title: Spui câți ani ai
    gloss: Am douăzeci și opt de ani.
    note: '*Mam* este forma de persoana întâi a verbului *mieć* („a avea”). *Dwadzieścia osiem* se termină în *osiem* (opt), deci, ca orice număr care se termină în 5–9, cere *lat* – urmărește dialogul din lecția 3 pentru un număr care se termină altfel.'
  pl.a1.unit02.lesson03.teach.dialogue.line01:
    title: Ewa îi cere lui Marek numărul de telefon
    gloss: Ewa îi cere lui Marek numărul de telefon, în mod formal.
    note: Reia întocmai întrebarea formală despre numărul de telefon din această lecție.
  pl.a1.unit02.lesson03.teach.dialogue.line02:
    title: Marek spune numărul său
    gloss: Marek citește numărul de telefon, cifră cu cifră.
    note: Toate cifrele de aici au fost deja învățate în lecțiile 1–2 ale acestei unități.
  pl.a1.unit02.lesson03.teach.dialogue.line03:
    title: Ewa îl întreabă pe Marek câți ani are
    gloss: Ewa îi mulțumește și îl întreabă formal câți ani are.
    note: '*Dziękuję* („mulțumesc”) și *A* („și”) nu se schimbă în funcție de registru, ca în cardul *dziękuję* din unitatea 1.'
  pl.a1.unit02.lesson03.teach.dialogue.line04:
    title: Marek spune câți ani are și întoarce întrebarea
    gloss: Marek spune că are douăzeci și opt de ani și o întreabă formal pe Ewa câți ani are.
    note: '*A pani?* întoarce întrebarea, formal, către o femeie – același tipar scurt pe care unitatea 1 l-a introdus cu *A pan?*.'
  pl.a1.unit02.lesson03.teach.dialogue.line05:
    title: Ewa spune câți ani are
    gloss: Ewa spune că are treizeci și doi de ani.
    note: '*Trzydzieści dwa* se termină în *dwa* (doi), deci, spre deosebire de *dwadzieścia osiem* (care se termină în opt și cere *lat*), acest număr cere *lata* – numerele care se termină în 2, 3 sau 4 (cu excepția celor de la 12 la 14) folosesc această altă formă de plural. *Lat* și *lata* nu sunt interschimbabile: forma corectă depinde de ultima cifră a numărului.'
  pl.a1.unit02.lesson03.teach.dialogue.line06:
    title: Marek încheie conversația
    gloss: Marek spune că i-a părut bine să vorbească cu ea și își ia rămas-bun.
    note: '*Do zobaczenia* reia formula de rămas-bun „pe curând” din unitatea 1.'
