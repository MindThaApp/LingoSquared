answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Poloneză A1
  description: Învață să saluți, să întrebi cum se simte cineva, să te prezinți și să schimbi informații personale de bază în poloneză. Cursul pune accent pe sistemul de politețe pan/pani/ty (o distincție gramaticală reală, marcată în poloneză, asemănătoare cu tu/dumneavoastră din română), pe acordul terminațiilor verbale și pe alegerea naturală a registrului.
units:
  pl.a1.unit01.greetings:
    title: Saluturi și prime întâlniri
lessons:
  pl.a1.unit01.lesson01.address_and_wellbeing:
    title: 'Pan, pani și ty: cum întrebi ce mai face cineva'
  pl.a1.unit01.lesson02.greetings_by_time:
    title: Saluturi și formule de rămas-bun în diferite momente ale zilei
  pl.a1.unit01.lesson03.names_origin_and_smalltalk:
    title: Prenume, nume de familie și de unde ești
teaching:
  pl.a1.unit01.lesson01.teach.pan:
    title: Adresare formală, către un bărbat
    gloss: domnul; domnule (adresare formală către un bărbat)
    note: 'Ca în română (tu/dumneavoastră), și în poloneză alegi între registre. *Pan* se folosește pentru un bărbat necunoscut sau respectat profesional. Gramatical, *pan* se comportă ca un subiect la persoana a treia: „pan jest” înseamnă literal „domnul este”, nu o formă adevărată de persoana a doua, deși are sensul „dumneavoastră”.'
  pl.a1.unit01.lesson01.teach.pani:
    title: Adresare formală, către o femeie
    gloss: doamna; doamnă (adresare formală către o femeie)
    note: Corespondentul feminin al lui *pan*. Folosește *pani* pentru o femeie necunoscută sau respectată profesional. Orice femeie adultă se numește *pani*, indiferent de starea civilă; în poloneză nu există distincția doamnă/domnișoară în adresarea de zi cu zi.
  pl.a1.unit01.lesson01.teach.ty:
    title: Forma informală
    gloss: tu (informal, singular)
    note: '*Ty* se folosește cu un prieten, coleg, membru al familiei, copil sau oricine cu care relația este informală. Spre deosebire de *pan*/*pani*, *ty* cere terminații verbale reale de persoana a doua, de ex. *masz* („ai”), nu cele de persoana a treia.'
  pl.a1.unit01.lesson01.teach.jak_sie_pan_ma:
    title: Întrebare formală despre starea cuiva, către un bărbat
    gloss: Ce mai faceți? (către un bărbat, formal)
    note: 'Literal: „cum se simte domnul”. *Ma* este forma de persoana a treia a verbului (acordat cu *pan* ca subiect gramatical), aceeași terminație ca pentru *on* („el”).'
  pl.a1.unit01.lesson01.teach.jak_sie_pani_ma:
    title: Ce mai faceți? (către o femeie, formal)
    gloss: Ce mai faceți? (către o femeie, formal)
    note: 'Același tipar ca *Jak się pan ma?*, cu *pani* în loc de *pan*. Forma verbală *ma* nu se schimbă: este aceeași terminație de persoana a treia, indiferent de genul persoanei căreia i te adresezi.'
  pl.a1.unit01.lesson01.teach.jak_sie_masz:
    title: Întrebare informală despre starea cuiva
    gloss: Ce mai faci? (informal)
    note: 'Cu *ty*, verbul primește terminația reală de persoana a doua, *masz*, nu *ma*. Compară formalul *Jak się pan/pani ma?* cu informalul *Jak się masz?*: este cea mai utilă pereche minimă pentru a auzi în verb diferența dintre pan/pani și ty.'
  pl.a1.unit01.lesson01.teach.dobrze_dziekuje:
    title: Un răspuns standard
    gloss: Bine, mulțumesc.
    note: '*Dziękuję* („mulțumesc”) nu se schimbă în funcție de registru: este același cuvânt fie că răspunzi lui *pan*, *pani* sau *ty*. Doar întrebarea marchează gradul de politețe.'
  pl.a1.unit01.lesson01.teach.a_pan:
    title: Întoarce întrebarea formală
    gloss: Și dumneavoastră? (către un bărbat, formal)
    note: O modalitate scurtă de a returna întrebarea unui bărbat căruia i te adresezi formal. Înlocuiește *pan* cu *pani* („A pani?”) când returnezi întrebarea unei femei.
  pl.a1.unit01.lesson01.teach.a_ty:
    title: Întoarce întrebarea informală
    gloss: Dar tu? (informal)
    note: Folosește *ty* pentru a returna întrebarea unui prieten sau coleg.
  pl.a1.unit01.lesson02.teach.czesc:
    title: Salut și la revedere informal
    gloss: salut; pa (informal, în ambele sensuri)
    note: '*Cześć* este neobișnuit printre saluturile poloneze: funcționează și ca „salut”, și ca „pa”, în același registru informal, la fel ca „ciao” în română. Se folosește doar în relațiile cu *ty*, niciodată cu *pan*/*pani*.'
    example_gloss: Salut, ce mai faci?
  pl.a1.unit01.lesson02.teach.dzien_dobry:
    title: Salut pentru toată ziua
    gloss: bună dimineața; bună ziua
    note: '*Dzień dobry* se folosește oricând înainte de seară și, spre deosebire de *cześć*, este neutru ca registru: îl poți folosi cu *pan*, *pani* sau *ty*. Este salutul cel mai sigur pentru cineva pe care nu-l cunoști bine.'
  pl.a1.unit01.lesson02.teach.dobry_wieczor:
    title: Salut de seară
    gloss: bună seara
    note: Înlocuiește *dzień dobry* când se face seară. Are aceeași utilizare neutră ca registru.
  pl.a1.unit01.lesson02.teach.dobranoc:
    title: Urare de noapte bună
    gloss: noapte bună
    note: 'Spre deosebire de *dzień dobry*/*dobry wieczór*, *dobranoc* este o formulă de rămas-bun, nu de salut: se spune când cineva pleacă pentru noapte sau merge la culcare, niciodată la începutul unei conversații.'
    example_gloss: Noapte bună, Piotr!
  pl.a1.unit01.lesson02.teach.do_widzenia:
    title: Rămas-bun standard
    gloss: la revedere
    note: 'Modul neutru și sigur de a spune la revedere: merge cu *pan*, *pani* sau *ty*. Sună mai definitiv decât *do zobaczenia*.'
  pl.a1.unit01.lesson02.teach.do_zobaczenia:
    title: Rămas-bun cu „pe curând”
    gloss: ne vedem
    note: 'Literal: „până ne vedem”. Sugerează că vă așteptați să vă întâlniți din nou, spre deosebire de mai neutrul *do widzenia*.'
  pl.a1.unit01.lesson02.teach.milego_dnia:
    title: Urare politicoasă de încheiere
    gloss: O zi bună!
    note: '*Miłego dnia* folosește genitivul într-o urare, același tipar ca *smacznego* („poftă bună”): o construcție fixă, pe care merită s-o înveți ca expresie întreagă, nu s-o analizezi pe cazuri în această etapă.'
  pl.a1.unit01.lesson03.teach.jak_sie_pan_nazywa:
    title: Întrebi numele, formal
    gloss: Cum vă numiți? (către un bărbat, formal)
    note: 'Literal: „cum se numește domnul”. *Nazywać się* este un verb reflexiv cu sensul „a se numi”. Înlocuiește *pan* cu *pani* când te adresezi formal unei femei.'
  pl.a1.unit01.lesson03.teach.jak_masz_na_imie:
    title: Întrebi prenumele, informal
    gloss: Cum te cheamă? (prenumele)
    note: Folosește o altă expresie, *mieć na imię* („a avea ca prenume”), și cere în mod specific prenumele, nu numele complet sau numele de familie. Este modul informal firesc de a întreba numele unui coleg.
  pl.a1.unit01.lesson03.teach.nazywam_sie:
    title: Îți spui numele complet
    gloss: Mă numesc Anna Kowalska.
    note: 'Forma de persoana întâi a verbului *nazywać się*, urmată în mod firesc de prenume și nume de familie împreună: modul mai formal sau mai complet de a te prezenta.'
  pl.a1.unit01.lesson03.teach.mam_na_imie:
    title: Îți spui prenumele
    gloss: Mă numesc Anna.
    note: 'Forma de persoana întâi a expresiei *mieć na imię*, urmată în mod firesc doar de prenume: varianta casual a lui *Nazywam się...*.'
  pl.a1.unit01.lesson03.teach.bardzo_mi_milo:
    title: Plăcere la cunoaștere
    gloss: Îmi pare foarte bine.
    note: Expresie fixă, foarte folosită la prima întâlnire, potrivită atât în context formal, cât și informal.
  pl.a1.unit01.lesson03.teach.skad_jestes:
    title: Întrebi de unde e cineva, informal
    gloss: De unde sunteți?
    note: '*Skąd* înseamnă „de unde”. Aici apare forma informală, cu *ty*; corespondentul formal *Skąd pan/pani jest?* apare în dialogul de încheiere al lecției.'
  pl.a1.unit01.lesson03.teach.jestem_z:
    title: Spune de unde ești
    gloss: Sunt din Canada.
    note: '*Z* („din”) cere genitivul, deci *Kanada* devine *Kanady*. Majoritatea numelor de țări urmează același tipar după *z*.'
  pl.a1.unit01.lesson03.teach.mieszkam_w:
    title: Spune unde locuiești
    gloss: Locuiesc în Varșovia.
    note: '*W* („în”) cere aici locativul, deci *Warszawa* devine *Warszawie*. Originea (cu *z*) și locul de reședință actual (cu *w*) folosesc cazuri diferite pentru numele locului: merită observat ca tipar, nu memorat ca excepție.'
  pl.a1.unit01.lesson03.teach.dialogue.line01:
    title: Începutul întâlnirii
    gloss: Ewa îl salută pe Marek și îl întreabă formal cum se numește.
    note: Ewa folosește registrul formal cu *pan* față de cineva pe care tocmai îl cunoaște, alegerea sigură la o primă întâlnire profesională sau cu un necunoscut.
  pl.a1.unit01.lesson03.teach.dialogue.line02:
    title: Începutul întâlnirii, răspuns
    gloss: Marek își spune numele complet și spune că îi pare bine.
    note: '*Nazywam się* urmat de numele complet este răspunsul firesc și complet la o întrebare formală despre nume.'
  pl.a1.unit01.lesson03.teach.dialogue.line03:
    title: Întrebare despre origine
    gloss: Ewa răspunde la fel de politicos și îl întreabă formal de unde este Marek.
    note: '*Skąd pan jest?*, corespondentul formal al lui *Skąd jesteś?* din această lecție, folosește *jest*, același tipar de persoana a treia întâlnit deja în *pan jest*/*pan ma*.'
  pl.a1.unit01.lesson03.teach.dialogue.line04:
    title: Întrebare despre origine, răspuns
    gloss: Marek spune că este din Canada, dar locuiește în Varșovia.
    note: '*Ale* („dar”) leagă contrastul dintre locul de origine al lui Marek și locul unde locuiește acum, aceeași distincție pe care o fac *jestem z*/*mieszkam w*.'
  pl.a1.unit01.lesson03.teach.dialogue.line05:
    title: Întrebi despre cunoașterea unei limbi
    gloss: Ewa îl întreabă formal pe Marek dacă vorbește poloneza.
    note: '*Czy* deschide o întrebare cu răspuns da/nu. Ca în română, unde întrebarea poate începe cu „oare” sau doar prin intonație, în poloneză *czy* singur anunță că urmează o întrebare, fără verb auxiliar.'
  pl.a1.unit01.lesson03.teach.dialogue.line06:
    title: Întrebi despre limbă, răspunzi și închei
    gloss: Marek spune că vorbește puțin și că încă învață, apoi își ia rămas-bun.
    note: '*Jeszcze się uczę* („încă învăț”) este o modalitate firească și modestă de a descrie un efort în desfășurare; e util să o poți spune și tu despre tine.'
