teaching:
  pl.a1.unit20.lesson01.teach.recap_jest_sa_to_poprosze:
    title: Este, sunt, acesta, aș dori -- din nou
    gloss: Jest, są, To, Poproszę, Ile, kosztuje, złotych, chcę, do -- cunoști deja aceste cuvinte din lecțiile anterioare.
    note: O scurtă reamintire înainte ca această lecție să le folosească pentru cumpărăturile de haine.
  pl.a1.unit20.lesson01.teach.sklep:
    title: Magazin
    gloss: magazin
    note: Cuvântul general pentru un magazin.
    example_gloss: Merg la magazin.
  pl.a1.unit20.lesson01.teach.koszula:
    title: Cămașă
    gloss: cămașă
    note: Substantiv feminin -- va avea forme de adjectiv feminine.
    example_gloss: Aceasta este o cămașă.
  pl.a1.unit20.lesson01.teach.spodnie:
    title: Pantaloni
    gloss: pantaloni
    note: În poloneză este mereu la plural, chiar și pentru o singură pereche -- nu există formă de singular.
    example_gloss: Aceștia sunt pantaloni.
  pl.a1.unit20.lesson01.teach.kupic:
    title: A cumpăra
    gloss: a cumpăra
    note: 'Se folosește după „*chcę*” (vreau), la fel ca „*iść*” (a merge) într-o lecție anterioară: „*chcę kupić*” -- vreau să cumpăr.'
    example_gloss: Vreau să cumpăr o cămașă.
  pl.a1.unit20.lesson01.teach.chce_kupic_spodnie_phrase:
    title: Vreau să cumpăr pantaloni
    gloss: Vreau să cumpăr pantaloni.
    note: Aceeași structură chcę + infinitiv, aplicată la pantaloni.
  pl.a1.unit20.lesson01.teach.ile_kosztuje_koszula_phrase:
    title: Cât costă cămașa?
    gloss: Cât costă cămașa?
    note: Un mod firesc de a întreba prețul unui anumit articol, refolosind „*Ile kosztuje*” din lecția despre cumpărături.
  pl.a1.unit20.lesson02.teach.jaki_note:
    title: Ce fel de -- forma masculină
    gloss: Jaki, Jaka -- „*Jaki*” se referă la substantive masculine, „*Jaka*” la substantive feminine (cunoști deja „*Jaka*” din lecția despre vreme).
    note: „*Kolor*” (culoare) este masculin, deci se folosește cu „*Jaki*”, nu cu „*Jaka*”.
  pl.a1.unit20.lesson02.teach.kolor:
    title: Culoare
    gloss: culoare
    note: Substantiv masculin.
    example_gloss: Ce culoare?
  pl.a1.unit20.lesson02.teach.sukienka:
    title: Rochie
    gloss: rochie
    note: Încă un substantiv feminin, ca „*koszula*”.
    example_gloss: Asta este o rochie.
  pl.a1.unit20.lesson02.teach.niebieska_note:
    title: Albastră
    gloss: Koszula jest niebieska. -- „*niebieska*” se acordă cu substantivele feminine, ca „*koszula*”.
    note: Doar această formă -- în acest curs este legată deocamdată de „*koszula*”.
  pl.a1.unit20.lesson02.teach.czerwona_note:
    title: Roșu
    gloss: Sukienka jest czerwona. -- „*czerwona*” se acordă și ea cu substantivele feminine, la fel ca „*niebieska*”.
    note: Această formă este legată aici de „*sukienka*”, la fel cum „*niebieska*” este legată de „*koszula*”.
  pl.a1.unit20.lesson02.teach.koszula_niebieska_phrase:
    title: Cămașa este albastră
    gloss: Cămașa este albastră.
    note: Informația pe care lecția o va reutiliza mai târziu, când Marek își caută o cămașă.
  pl.a1.unit20.lesson02.teach.sukienka_czerwona_phrase:
    title: Rochia este roșie
    gloss: Rochia este roșie.
    note: Aceeași structură jest + culoare, pentru alt articol.
  pl.a1.unit20.lesson03.teach.recap_words:
    title: Bună ziua, vă rog, foarte -- din nou
    gloss: Dzień, dobry, Proszę, bardzo, i, Dobrze, Co -- cunoști deja aceste cuvinte din lecțiile anterioare.
    note: O scurtă reamintire înainte de dialogul din magazin al acestei lecții.
  pl.a1.unit20.lesson03.teach.rozmiar:
    title: Mărimea
    gloss: mărime
    note: În Polonia, mărimile hainelor sunt de obicei doar literele S, M și L, ca în România.
    example_gloss: Ce mărime?
  pl.a1.unit20.lesson03.teach.pan_chce_note:
    title: Domnule, vrea
    gloss: Co pan chce kupić? -- „*pan*” este forma politicoasă de adresare pentru un bărbat, la fel ca „*pani*” pentru o femeie (cunoști deja „*pani*” din lecția despre cumpărături).
    note: „*chce*” este forma de persoana a III-a a verbului „*chcieć*” -- cunoști deja „*chcę*” (vreau) și „*chcesz*” (vrei).
  pl.a1.unit20.lesson03.teach.co_pan_chce_kupic_phrase:
    title: Ce doriți să cumpărați, domnule?
    gloss: Ce doriți să cumpărați, domnule?
    note: Felul în care o vânzătoare începe politicos conversația cu un client bărbat.
  pl.a1.unit20.lesson03.teach.dialogue.line01:
    title: Vânzătorul îl salută pe Marek
    gloss: Bună ziua! Ce doriți să cumpărați, domnule?
    note: Sprzedawca (vânzătorul) începe în același registru politicos folosit de negustorul din piață în unitatea anterioară despre cumpărături.
  pl.a1.unit20.lesson03.teach.dialogue.line02:
    title: Marek spune ce vrea
    gloss: Vreau să cumpăr o cămașă și pantaloni.
    note: Marek spune ambele articole pe care vrea să le cumpere.
  pl.a1.unit20.lesson03.teach.dialogue.line03:
    title: Vânzătorul întreabă mărimea
    gloss: Ce mărime?
    note: O întrebare scurtă și firească, ca urmare.
  pl.a1.unit20.lesson03.teach.dialogue.line04:
    title: Marek spune mărimea sa
    gloss: Mărimea M.
    note: Marek răspunde doar cu litera mărimii, așa cum e firesc.
  pl.a1.unit20.lesson03.teach.dialogue.line05:
    title: Vânzătorul confirmă stocul și prețul
    gloss: Avem o cămașă albastră și pantaloni. În total, o sută de zloți.
    note: „*Mamy*” înseamnă „avem” (ca „*mam*”/„*masz*”). După el, „*koszula*” devine „*koszulę*”, iar „*niebieska*” devine „*niebieską*” -- aceeași schimbare pe care ai văzut-o în „*Chcę kupić koszulę*”. Culoarea corespunde cu cea a cămășii albastre din Lecția 2.
  pl.a1.unit20.lesson03.teach.dialogue.line06:
    title: Marek acceptă
    gloss: Bine, le iau.
    note: Marek confirmă cumpărătura, încheind schimbul de replici.
