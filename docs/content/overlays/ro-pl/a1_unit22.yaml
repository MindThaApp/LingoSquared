teaching:
  pl.a1.unit22.lesson01.teach.dzwonic:
    title: A suna
    gloss: a suna
    note: Infinitivul verbului folosit pentru a da un telefon.
    example_gloss: Trebuie să te sun.
  pl.a1.unit22.lesson01.teach.zadzwonie_do_ciebie:
    title: Spui că suni
    gloss: Te sun.
    note: '*Zadzwonię* este viitorul perfectiv al verbului *zadzwonić* (a suna, o singură dată). În poloneză se folosește pentru o promisiune sau o hotărâre de moment: „Te sun eu”.'
  pl.a1.unit22.lesson01.teach.halo_tu_ewa:
    title: Răspunsul la telefon
    gloss: Alo, aici Ewa.
    note: '*Tu* + nume (literal „aici ...”) este formula obișnuită de prezentare la telefon; în română spunem „Sunt Ewa” sau „Aici Ewa”.'
  pl.a1.unit22.lesson01.teach.halo_tu_marek:
    title: Marek răspunde la fel
    gloss: Alo, aici Marek.
    note: Același model *tu* + nume ca în *Halo, tu Ewa*.
  pl.a1.unit22.lesson02.teach.z_kim_rozmawiam:
    title: Întrebi cine sună
    gloss: Cu cine vorbesc?
    note: '*Z kim rozmawiam?* (literal „cu cine vorbesc?”) este formula obișnuită pentru un apelant necunoscut; *kim* este instrumentalul după *z*.'
  pl.a1.unit22.lesson02.teach.rozmawia_pan_z:
    title: Te prezinți formal
    gloss: Vorbiți cu Ewa.
    note: '*Rozmawia pan z Ewą* este varianta formală: *pan* (către un bărbat) sau *pani* (către o femeie) cu verbul la persoana a III-a, iar după *z* urmează instrumentalul.'
  pl.a1.unit22.lesson03.teach.mozesz_to_powtorzyc:
    title: Ceri să repete
    gloss: Poți repeta asta?
    note: '*Możesz* (poți, de la *móc*) + infinitivul *powtórzyć* (a repeta) + *to* (asta).'
  pl.a1.unit22.lesson03.teach.nie_mow_tak:
    title: Ceri cuiva să vorbească mai rar
    gloss: Nu vorbi atât de repede, te rog.
    note: '*Nie mów* este imperativul negativ (nu vorbi); *tak szybko* înseamnă „atât de repede”.'
  pl.a1.unit22.lesson03.teach.nie_slysze_cie:
    title: Spui că nu auzi bine
    gloss: Nu te aud bine.
    note: '*Nie słyszę cię dobrze* arată o problemă de auz; *cię* este acuzativul lui *ty*, iar *dobrze* înseamnă „bine”.'
  pl.a1.unit22.lesson04.teach.sms:
    title: Mesajul text
    gloss: mesajul text
    note: 'În poloneză, *SMS* este un substantiv masculin: *ten SMS*.'
    example_gloss: Mesajul este de la Ewa.
  pl.a1.unit22.lesson04.teach.wysle_ci_sms:
    title: Cum spui că trimiți un mesaj
    gloss: Îți trimit un mesaj.
    note: '*Wysłać* (a trimite) cere dativul *ci* (ție) pentru persoană și acuzativul pentru lucrul trimis: *Wyślę ci SMS*.'
  pl.a1.unit22.lesson04.teach.oddzwonie_pozniej:
    title: Cum spui că suni înapoi
    gloss: Te sun mai târziu.
    note: '*Oddzwonić* (a suna înapoi) este un singur verb în poloneză: *oddzwonię później*.'
  pl.a1.unit22.lesson05.teach.marek_czesc_ewo:
    title: Citește o conversație prin mesaje
    gloss: 'Marek: Salut, Ewa, mă poți suna? Trebuie să-ți spun ceva. Ewa: Da, sigur, te sun înapoi în cinci minute.'
    note: Urmărește ce cere Marek, de ce și când spune Ewa că va suna înapoi.
    glosses:
      Cześć: salut
      możesz: a putea
      zadzwonić: a suna
      Muszę: a trebui / a fi nevoit să
      coś: în timpul
      powiedzieć: a povesti / a spune
      oczywiście: sigur / desigur
      oddzwonię: a suna
      pięć: cinci
      minut: minute
      za: înapoi
  pl.a1.unit22.lesson06.teach.marek_halo_tu:
    title: Marek răspunde la telefon
    gloss: 'Marek: Alo, aici Marek.'
    note: 'Același model *tu* + nume din lecția 1, folosit acum într-o convorbire reală: cel care răspunde vorbește primul și își spune numele.'
  pl.a1.unit22.lesson06.teach.ewa_czesc_marku:
    title: Ewa se prezintă
    gloss: 'Ewa: Salut, Marek, aici Ewa. Marek: Ce bine că suni!'
    note: '*Fajnie, że* ... (ce bine că ...) exprimă o reacție pozitivă la un eveniment; *że* introduce propoziția.'
  pl.a1.unit22.lesson06.teach.ewa_jak_ci:
    title: Ewa întreabă despre tură
    gloss: 'Ewa: Cum ți-a mers prima tură?'
    note: '*Jak ci poszła ...?* (literal „cum ți-a mers ...?”) întreabă despre ceva ce s-a întâmplat deja. *Ci* este dativul lui *ty*, iar *poszła* se acordă cu substantivul feminin *zmiana*.'
  pl.a1.unit22.lesson06.teach.marek_poszlo_bardzo:
    title: Marek dă vești bune
    gloss: 'Marek: A mers foarte bine, mai bine decât credeam.'
    note: '*Poszło* este forma de trecut a verbului *iść* cu terminația *-o* (neutru; aici cu sensul „a ieși, a merge”); *myślałem* este trecutul verbului *myśleć* (a gândi, a crede), cu terminația pentru un vorbitor bărbat.'
  pl.a1.unit22.lesson06.teach.czas_przeszly_bylo:
    title: 'Timpul trecut: było, poszło, myślałem'
    gloss: 'Timpul trecut: *było* (a fost) de la *być* (a fi), *poszło* (a mers) de la *iść* (a merge), *myślałem* (credeam, am crezut) de la *myśleć* (a gândi).'
    note: 'Trecutul polonez se formează cu *-ł-* plus o terminație de gen: *myślał* (el), *myślała* (ea), *było* (neutru). Deocamdată învață *było*, *poszło* și *myślałem* ca forme fixe, în contextele din această lecție.'
  pl.a1.unit22.lesson06.teach.ewa_jak_milo:
    title: Ewa este mândră
    gloss: 'Ewa: Ce frumos să aud asta! Sunt mândră de tine.'
    note: '*Dumny z* (mândru de) este o combinație fixă: *z* + genitiv, deci *z ciebie*. Ewa este femeie, de aceea spune *dumna*.'
  pl.a1.unit22.lesson06.teach.marek_dziekuje_ci:
    title: Marek este emoționat
    gloss: 'Marek: Mulțumesc mult, înseamnă foarte mult pentru mine.'
    note: '*Znaczy* este forma *on/ona/ono* a verbului *znaczyć* (a însemna); *dla mnie* (pentru mine) arată cui îi este important.'
  pl.a1.unit22.lesson06.teach.jego_pierwsza_zmiana:
    title: Posesivul „său”
    gloss: Prima lui tură a mers foarte bine.
    note: '*Jego* (al lui) nu se schimbă niciodată și stă înaintea substantivului: *jego pierwsza zmiana*; substantivul feminin nu îl influențează.'
