teaching:
  pl.a1.unit07.lesson01.teach.banan:
    title: Banană
    gloss: banană
    note: Un fruct foarte comun, vândut cu bucata sau la kilogram în orice piață sau magazin.
    example_gloss: Aceasta este o banană.
  pl.a1.unit07.lesson01.teach.pomidor_ogorek:
    title: Roșie, castravete
    gloss: roșie; castravete
    note: Ambele sunt substantive masculine neanimate -- formele lor de genitiv plural (pomidorów, ogórków) vor conta când le cumperi la kilogram, mai târziu în această unitate.
    example_gloss:
    - Aceasta este o roșie.
    - Acesta este un castravete.
  pl.a1.unit07.lesson01.teach.ziemniak_cebula:
    title: Cartof, ceapă
    gloss: cartof; ceapă
    note: Ziemniak este masculin neanimat (aceeași familie cu genitiv plural în -ów ca banan și pomidor); cebula este feminin.
    example_gloss:
    - Acesta este un cartof.
    - Aceasta este o ceapă.
  pl.a1.unit07.lesson01.teach.tanio_drogo:
    title: Ieftin, scump
    gloss: ieftin; scump
    note: '*Tanio* și *drogo* sunt adverbe, iar în poloneză se leagă direct de *kosztować* („a costa”) -- *To kosztuje drogo* înseamnă literal „asta costă scump”, adică „este scump”. În română am spune „costă mult”, cu alt cuvânt.'
    example_gloss:
    - Foarte ieftin!
    - Foarte scump!
  pl.a1.unit07.lesson01.teach.kosztuje_kosztuja_note:
    title: 'A costa: kosztuje, kosztują'
    gloss: 'a costa: costă (un singur lucru), costă (mai multe lucruri) -- Banana este ieftină. Bananele sunt ieftine.'
    note: '*Kosztować* este verbul „a costa”. Folosește *kosztuje* pentru un singur produs și *kosztują* pentru mai multe -- exact ca *jest*/*są* („este”/„sunt”), dar pentru prețuri. Acordul contează: un vânzător din piață te va înțelege oricum, dar *banany kosztują* este ce spune de fapt un vorbitor nativ.'
  pl.a1.unit07.lesson01.teach.ile_kosztuje_banan:
    title: Cât costă o banană?
    gloss: Cât costă o banană?
    note: Întrebarea obișnuită cu care începi negocierea prețului -- *Ile* (cât) plus *kosztuje* la singular, deoarece se întreabă despre o singură banană.
  pl.a1.unit07.lesson02.teach.grejpfrut:
    title: Grapefruit
    gloss: grapefruit
    note: Masculin neanimat, ca pomidor și ziemniak -- nu își schimbă terminația după proszę o.
    example_gloss: Acesta este un grapefruit.
  pl.a1.unit07.lesson02.teach.mandarynka_pomarancza:
    title: Mandarină, portocală
    gloss: mandarină; portocală
    note: Ambele sunt feminine, ca kawa și herbata din unitatea despre mâncare -- la acuzativ își schimbă -a în -ę, dar această lecție are nevoie doar de forma din dicționar.
    example_gloss:
    - Aceasta este o mandarină.
    - Aceasta este o portocală.
  pl.a1.unit07.lesson02.teach.kilo_pol_kilo:
    title: Un kilogram, jumătate de kilogram
    gloss: un kilogram; jumătate de kilogram
    note: '*Kilo* nu își schimbă niciodată terminația, indiferent ce cântărești sau câte kilograme ceri -- substantivul care urmează după *kilo* se schimbă, după cum explică nota de gramatică a lecției.'
    example_gloss:
    - Un kilogram de roșii, vă rog.
    - Jumătate de kilogram de banane, vă rog.
  pl.a1.unit07.lesson02.teach.poprosze:
    title: Aș dori (vă rog)
    gloss: aș dori / dați-mi, vă rog
    note: '*Poproszę* este o alternativă ceva mai îngrijită și foarte uzuală la *proszę o* din unitatea despre mâncare -- ambele înseamnă aproximativ „aș dori”, iar vorbitorii de poloneză le folosesc pe rând. După *Poproszę* urmează direct ce vrei, fără *o*.'
    example_gloss: Aș dori un grapefruit, vă rog.
  pl.a1.unit07.lesson02.teach.genitive_ow_note:
    title: 'După „kilo”: terminația -ów'
    gloss: 'Genitiv plural după „kilo”: banană -> de banane, roșie -> de roșii, cartof -> de cartofi.'
    note: 'Când indici o cantitate la greutate -- *kilo*, *pół kilo* -- substantivul următor trece la o altă formă, genitivul plural. Pentru aceste trei substantive masculine regulate, înseamnă doar adăugarea lui *-ów*: *banan* devine *bananów*, *pomidor* devine *pomidorów*, *ziemniak* devine *ziemniaków*.'
  pl.a1.unit07.lesson02.teach.poprosze_kilo_pomidorow:
    title: Un kilogram de roșii, vă rog
    gloss: Un kilogram de roșii, vă rog.
    note: Aplică în practică modelul cu -ów din nota de gramatică, într-o cerere reală -- pomidor devine pomidorów după kilo.
  pl.a1.unit07.lesson03.teach.dla:
    title: Pentru
    gloss: pentru
    note: O prepoziție simplă cu sensul „pentru” -- vânzătorul o folosește în *Co dla pani?* (literal „ce pentru dumneavoastră?”) ca să întrebe politicos clienta ce dorește.
    example_gloss: Aceasta este pentru tine.
  pl.a1.unit07.lesson03.teach.swieze_bardzo:
    title: Proaspăt, foarte
    gloss: proaspăt; foarte
    note: Două cuvinte pe care vânzătorul din piață le folosește mereu -- ca să laude prospețimea unui produs sau cât de ieftin ori scump este.
    example_gloss:
    - Roșiile sunt proaspete.
    - Foarte ieftin!
  pl.a1.unit07.lesson03.teach.trochę:
    title: Puțin
    gloss: puțin / un pic
    note: 'Atenuează politicos o reclamație: trochę drogo („puțin cam scump”) sună mult mai firesc într-o tocmeală prietenoasă decât un simplu drogo.'
    example_gloss: Puțin cam scump.
  pl.a1.unit07.lesson03.teach.razem:
    title: Total / împreună
    gloss: în total / împreună
    note: Ce spune vânzătorul chiar înainte de a anunța suma finală pe care o datorezi.
    example_gloss: Zece zloți în total.
  pl.a1.unit07.lesson03.teach.co_dla_pani:
    title: Ce doriți?
    gloss: Ce doriți?
    note: 'Literal: „ce pentru dumneavoastră (formal)”. Este întrebarea firească cu care vânzătorul începe discuția cu clientul.'
  pl.a1.unit07.lesson03.teach.dialogue.line01:
    title: Vânzătorul o salută pe Ewa
    gloss: Vânzătorul o salută și o întreabă pe Ewa ce dorește.
    note: Dzień dobry, reluat din salutările din unitatea 1.
  pl.a1.unit07.lesson03.teach.dialogue.line02:
    title: Ewa întreabă de banane
    gloss: Ewa întreabă cât costă bananele.
    note: Kosztują este forma de plural din nota de gramatică a acestei unități, fiindcă se întreabă de banane ca grup.
  pl.a1.unit07.lesson03.teach.dialogue.line03:
    title: Vânzătorul spune prețul
    gloss: Vânzătorul spune că un kilogram costă cinci zloți și că bananele sunt foarte proaspete.
    note: 'O formulă eliptică firească pentru preț: „[preț] kilo” este felul în care un vânzător polonez spune prețul pe kilogram, fără un cuvânt în plus pentru „pe”.'
  pl.a1.unit07.lesson03.teach.dialogue.line04:
    title: Ewa comandă banane
    gloss: Ewa spune că e bine și cere un kilogram de banane.
    note: Îmbină poproszę cu kilo + bananów, exact modelul din nota de gramatică a lecției 2.
  pl.a1.unit07.lesson03.teach.dialogue.line05:
    title: Vânzătorul aduce vorba de roșii
    gloss: Vânzătorul o întreabă și de roșii și spune că un kilogram costă opt zloți.
    note: Aceeași formulă eliptică de preț ca în replica 3, acum pentru un alt produs.
  pl.a1.unit07.lesson03.teach.dialogue.line06:
    title: Ewa se tocmește blând și comandă
    gloss: Ewa spune că e puțin cam scump, dar că ia o jumătate de kilogram.
    note: 'Trochę drogo atenuează reclamația: Ewa tot cumpără, doar că o cantitate mai mică.'
  pl.a1.unit07.lesson03.teach.dialogue.line07:
    title: Vânzătorul spune totalul
    gloss: Vânzătorul spune „poftiți” și că totalul este nouă zloți.
    note: 5 złotych pentru banane plus 4 złotych pentru jumătatea de kilogram de roșii fac nouă złotych în total, în acord cu toate prețurile spuse mai devreme în scenă.
