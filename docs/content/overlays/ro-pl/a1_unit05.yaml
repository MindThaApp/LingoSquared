teaching:
  pl.a1.unit05.lesson01.teach.rodzina:
    title: Familia
    gloss: familie
    note: Cuvântul general pentru familie – se folosește pentru întreaga familie, nu doar pentru o singură relație de rudenie.
    example_gloss: Aceasta este familia mea.
  pl.a1.unit05.lesson01.teach.matka_ojciec:
    title: Mamă, tată
    gloss: mamă; tată
    note: Cele două cuvinte de bază pentru părinți – în vorbirea de zi cu zi vei auzi și formele afectuoase mama și tata, dar matka și ojciec sunt formele neutre, standard, predate aici.
    example_gloss:
    - Aceasta este mama mea.
    - Acesta este tatăl meu.
  pl.a1.unit05.lesson01.teach.brat_siostra:
    title: Frate, soră
    gloss: frate; soră
    note: Ambele sunt substantive obișnuite – brat este masculin, siostra este feminin, lucru important pentru acordul mój/moja din nota de gramatică a acestei lecții.
    example_gloss:
    - Acesta este fratele meu.
    - Aceasta este sora mea.
  pl.a1.unit05.lesson01.teach.rodzice:
    title: Părinții
    gloss: părinți
    note: Rodzice este un substantiv la plural masculin personal – are propria formă de posesiv, moi (nu mój/moja), pe care o vei vedea în exemplul și în nota de gramatică a acestei lecții.
    example_gloss: Părinții mei locuiesc la Varșovia.
  pl.a1.unit05.lesson01.teach.moj_moja_note:
    title: 'Al meu: mój, moja, moi'
    gloss: tatăl meu, fratele meu – mama mea, sora mea – părinții mei.
    note: 'Posesivele polone se acordă cu genul substantivului pe care îl determină: *mój* înaintea unui substantiv masculin (*mój ojciec*, *mój brat*), *moja* înaintea unui substantiv feminin (*moja matka*, *moja siostra*), iar forma separată, neregulată *moi* se folosește special înaintea pluralului masculin personal *rodzice*.'
  pl.a1.unit05.lesson01.teach.to_jest_moj_ojciec:
    title: Acesta este tatăl meu
    gloss: Acesta este tatăl meu.
    note: '*To jest* (acesta este / aceasta este) rămâne la fel indiferent de genul substantivului – se schimbă doar posesivul mój/moja.'
  pl.a1.unit05.lesson02.teach.dziadek_babcia:
    title: Bunic, bunică
    gloss: bunic; bunică
    note: Cuvintele standard, de zi cu zi, pentru bunic și bunică, folosite deopotrivă de copii și de adulți.
    example_gloss:
    - Acesta este bunicul meu.
    - Aceasta este bunica mea.
  pl.a1.unit05.lesson02.teach.wujek_ciotka:
    title: Unchi, mătușă
    gloss: unchi; mătușă
    note: Se folosesc atât pentru fratele/sora unui părinte, cât și pentru soțul/soția fratelui sau a surorii unui părinte, la fel ca „unchi”/„mătușă” în română.
    example_gloss:
    - Acesta este unchiul meu.
    - Aceasta este mătușa mea.
  pl.a1.unit05.lesson02.teach.syn_corka:
    title: Fiu, fiică
    gloss: fiu; fiică
    note: 'Exemplele arată forma de acuzativ necesară după *mieć* (a avea): *syn* devine *syna*, *córka* devine *córkę*. Notele de gramatică următoare explică de ce se schimbă terminația.'
    example_gloss:
    - Am un fiu.
    - Am o fiică.
  pl.a1.unit05.lesson02.teach.miec_note:
    title: 'A avea: mam, masz, ma'
    gloss: 'a avea: eu am, tu ai, el/ea are – am un frate, ai o soră, el/ea are un fiu.'
    note: '*Mieć* este verbul „a avea”. *Mam* (eu am) și *ma* (el/ea are) sunt principalele forme noi ale acestei lecții; *masz* (tu ai) l-ai întâlnit deja în unitatea 2, când ai întrebat cuiva vârsta.'
  pl.a1.unit05.lesson02.teach.accusative_note:
    title: Cum spunem ce avem
    gloss: 'După „a avea”, substantivul își schimbă terminația: brat -> brata, siostra -> siostrę, syn -> syna, córka -> córkę.'
    note: Acesta este cazul acuzativ – forma pe care o ia substantivul când este complement direct al unui verb ca *mieć*. Substantivele masculine care denumesc persoane (și animale), precum *brat* și *syn*, primesc *-a*; substantivele feminine precum *siostra* și *córka* schimbă *-a* final în *-ę*.
  pl.a1.unit05.lesson02.teach.mam_brata_siostre:
    title: Am un frate și o soră
    gloss: Am un frate și o soră.
    note: Aplică într-o propoziție întreagă terminațiile de acuzativ din nota de gramatică, plus noua conjuncție *i* (și).
  pl.a1.unit05.lesson03.teach.lub:
    title: Sau
    gloss: sau
    note: Se folosește ca și „sau” în română, într-o întrebare cu răspuns da/nu care propune două variante.
    example_gloss: Ai un frate sau o soră?
  pl.a1.unit05.lesson03.teach.tylko:
    title: Doar
    gloss: doar
    note: Se așază chiar înaintea cuvântului pe care îl limitează, la fel ca „doar” în română.
    example_gloss: Am doar o soră.
  pl.a1.unit05.lesson03.teach.gdzie:
    title: Unde
    gloss: unde
    note: Un cuvânt interogativ de bază – se îmbină firesc cu mieszkać (a locui), ca în dialogul acestei lecții.
    example_gloss: Unde locuiește fratele tău?
  pl.a1.unit05.lesson03.teach.on_ona_mieszka_note:
    title: El, ea – și „a locui”
    gloss: 'el, ea – a locui: eu locuiesc, el/ea locuiește. El locuiește la Gdańsk. Ea locuiește la Cracovia.'
    note: '*On* (el) și *ona* (ea) sunt pronumele de persoana a treia. *Mieszkać* (a locui) urmează același tipar pentru persoana I și a III-a ca *mieć*: *mieszkam* (eu locuiesc, din unitatea 1, *Mieszkam w Warszawie*) și *mieszka* (el/ea locuiește). Numele de localități primesc după *w* cazul locativ – *Gdańsk* devine *w Gdańsku*, *Kraków* devine *w Krakowie*, același tipar w + locativ ca în *Mieszkam w Warszawie* din unitatea 1.'
  pl.a1.unit05.lesson03.teach.dialogue.line01:
    title: Marek întreabă despre frați
    gloss: Marek o întreabă pe Ewa dacă are un frate sau o soră.
    note: O întrebare cu răspuns da/nu, formată cu *Czy*, același marcator interogativ din unitatea 1. Ewa și Marek se cunosc acum bine, așa că au trecut de la formalul *pan*/*pani* la *ty*, forma familiară (*masz*, *A ty?*, *twój*).
  pl.a1.unit05.lesson03.teach.dialogue.line02:
    title: Ewa răspunde și întreabă la rândul ei
    gloss: Ewa spune că are un frate și o soră, apoi îi pune lui Marek aceeași întrebare.
    note: '*A ty?* („Și tu?”) este o modalitate scurtă și firească de a întoarce întrebarea către cel care a pus-o.'
  pl.a1.unit05.lesson03.teach.dialogue.line03:
    title: Marek răspunde
    gloss: Marek spune că are doar o soră, care locuiește la Cracovia, apoi o întreabă pe Ewa despre fratele ei.
    note: Marek nu are frate – are doar o soră (*tylko siostrę*). Poate întreba despre fratele Ewei, pentru că ea a spus deja că are unul.
  pl.a1.unit05.lesson03.teach.dialogue.line04:
    title: Ewa răspunde
    gloss: Ewa spune că fratele ei locuiește la Gdańsk și are un fiu și o fiică.
    note: Reia tiparul de acuzativ syn/córka din lecția 2 a acestei unități.
  pl.a1.unit05.lesson03.teach.dialogue.line05:
    title: Reacția lui Marek
    gloss: 'Marek spune: ce familie frumoasă!'
    note: '*Fajna* este un cuvânt informal, de zi cu zi, pentru „drăguț”/„misto” – o reacție firească de încheiere, în același registru cu *Świetnie!* din unitatea 4.'
