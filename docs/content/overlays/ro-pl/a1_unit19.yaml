teaching:
  pl.a1.unit19.lesson01.teach.recap_jaka_jest_dzis_nie:
    title: Care, este, azi, nu -- din nou
    gloss: Jaka, jest, Dziś, nie -- cunoști deja aceste cuvinte din lecțiile anterioare.
    note: O scurtă reamintire înainte ca lecția să le folosească pentru a vorbi despre vreme.
  pl.a1.unit19.lesson01.teach.pogoda:
    title: Vremea
    gloss: vremea
    note: Cuvântul general pentru vreme sau condiții meteorologice.
    example_gloss: Ce vreme este afară?
  pl.a1.unit19.lesson01.teach.zimno:
    title: Frig
    gloss: frig, rece
    note: Descrie temperatura -- nu își schimbă forma după gen.
    example_gloss: E frig.
  pl.a1.unit19.lesson01.teach.goraco:
    title: Cald
    gloss: cald
    note: Opusul lui „*zimno*” -- nici el nu își schimbă forma după gen.
    example_gloss: E cald.
  pl.a1.unit19.lesson01.teach.jest_pogoda_note:
    title: E frig, e cald
    gloss: 'Jest zimno. Jest gorąco. -- așa descriem vremea în poloneză: „*jest*” plus un cuvânt despre vreme, fără acord în gen.'
    note: Același tipar simplu funcționează pentru toate cuvintele despre vreme din această unitate.
  pl.a1.unit19.lesson01.teach.jaka_jest_pogoda_phrase:
    title: Ce vreme este afară?
    gloss: Ce vreme este afară?
    note: O modalitate firească de a întreba cum e vremea acum.
  pl.a1.unit19.lesson01.teach.dzis_jest_zimno_phrase:
    title: Azi e frig
    gloss: Azi e frig.
    note: Fraza pe care se construiește toată această unitate, pentru vremea de azi.
  pl.a1.unit19.lesson02.teach.pada:
    title: Plouă
    gloss: plouă
    note: Se folosește singur, fără subiect -- așa se spune în mod normal „plouă” în poloneză.
    example_gloss: Astăzi plouă.
  pl.a1.unit19.lesson02.teach.snieg:
    title: Zăpadă
    gloss: zăpadă
    note: Cuvântul pentru zăpadă -- împreună cu „*pada*” înseamnă „ninge”.
    example_gloss: Ninge.
  pl.a1.unit19.lesson02.teach.mgla:
    title: Ceață
    gloss: ceață
    note: Un alt fenomen meteo frecvent.
    example_gloss: E ceață.
  pl.a1.unit19.lesson02.teach.dobra_note:
    title: Bun, bună
    gloss: Pogoda jest dobra. -- „*dobra*” se potrivește cu substantivele feminine, ca „*pogoda*”.
    note: Forma de feminin a lui „*dobry*” (ca în „*Dzień dobry*”) -- același tipar -y/-a ca în *chory/chora*.
  pl.a1.unit19.lesson02.teach.straszna_note:
    title: Groaznic, groaznică
    gloss: Jaka straszna pogoda! -- „*straszna*” se potrivește și ea cu „*pogoda*”, la fel ca „*dobra*”.
    note: Un cuvânt puternic -- folosește-l pentru vreme cu adevărat proastă.
  pl.a1.unit19.lesson02.teach.jaka_straszna_pogoda_phrase:
    title: Ce vreme groaznică!
    gloss: Ce vreme groaznică!
    note: O exclamație firească despre vremea urâtă.
  pl.a1.unit19.lesson02.teach.pogoda_dobra_phrase:
    title: Vremea este bună
    gloss: Vremea este bună.
    note: Reia cuvântul despre vreme din începutul acestei lecții.
  pl.a1.unit19.lesson03.teach.recap_words:
    title: Da, și, eu, de asemenea -- din nou
    gloss: Tak, A, ja, też, chcę, iść, idę, do, parku, tam, bardzo -- cunoști deja aceste cuvinte din lecțiile anterioare.
    note: O scurtă reamintire înainte de dialogul din această lecție.
  pl.a1.unit19.lesson03.teach.bo:
    title: Pentru că
    gloss: pentru că
    note: Leagă un plan de motivul legat de vreme.
    example_gloss: Nu merg în parc, pentru că plouă.
  pl.a1.unit19.lesson03.teach.nie_chce_isc_bo_pada_phrase:
    title: Nu vreau să merg, pentru că plouă
    gloss: Nu vreau să merg în parc, pentru că plouă.
    note: O descriere a vremii legată de un plan real -- exact spre asta duce această unitate.
  pl.a1.unit19.lesson03.teach.w_krakowie_recap:
    title: La Cracovia -- din nou
    gloss: W Krakowie -- cunoști deja aceasta din lecțiile anterioare, de ex. „Ona mieszka w Krakowie” (Ea locuiește la Cracovia).
    note: O scurtă reamintire înainte ca dialogul din această lecție să compare vremea din două locuri.
  pl.a1.unit19.lesson03.teach.dialogue.line01:
    title: Marek întreabă despre vreme
    gloss: Cum e vremea astăzi?
    note: Marek începe conversația întrebând despre vremea de azi.
  pl.a1.unit19.lesson03.teach.dialogue.line02:
    title: Ewa răspunde
    gloss: Plouă. E frig.
    note: Ewa descrie vremea reală de azi.
  pl.a1.unit19.lesson03.teach.dialogue.line03:
    title: Marek reacționează și face un plan
    gloss: Ce vreme groaznică! Nu vreau să merg în parc, pentru că plouă.
    note: Marek reacționează la vreme și spune ce plan are din cauza ei.
  pl.a1.unit19.lesson03.teach.dialogue.line04:
    title: Ewa este de acord
    gloss: Nici eu nu merg în parc.
    note: Ewa face același plan ca Marek.
  pl.a1.unit19.lesson03.teach.dialogue.line05:
    title: Marek întreabă despre Cracovia
    gloss: Și la Cracovia? Cum e vremea acolo?
    note: Marek mută conversația la vremea din alt oraș.
  pl.a1.unit19.lesson03.teach.dialogue.line06:
    title: Ewa răspunde
    gloss: La Cracovia ninge. Acolo e foarte frig.
    note: Ewa descrie un alt fenomen, mai rece, din Cracovia.
