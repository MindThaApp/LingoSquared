  pl.a1.unit28.lesson05.teach.ewa_co_dzien:
    title: Cine merge cum?
    gloss: Ewa merge cu trenul la serviciu în fiecare zi. Marek merge de obicei cu bicicleta, dar când plouă merge și el cu trenul. Tomek preferă să meargă cu mașina. Kasia locuiește aproape și merge pe jos la serviciu. Tu cum mergi la serviciu?
