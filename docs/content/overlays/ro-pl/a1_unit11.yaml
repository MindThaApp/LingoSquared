teaching:
  pl.a1.unit11.lesson01.teach.chciec_chce:
    title: A vrea, eu vreau
    gloss: a vrea; vreau
    note: Chcieć este infinitivul; chcę este forma de persoana I singular, pe care o folosești zilnic ca să spui ce vrei.
    example_gloss: Vreau să merg la cinema.
  pl.a1.unit11.lesson01.teach.chcesz:
    title: Tu vrei
    gloss: vrei (informal)
    note: Chcesz este forma informală pentru „tu”, folosită la fel ca masz și jesteś -- exact ce folosești ca să-l întrebi pe un prieten ce vrea.
    example_gloss: Vrei cafea?
  pl.a1.unit11.lesson01.teach.chciec_osoba_note:
    title: Vreau, vrei
    gloss: 'Chcę, chcesz -- același tipar ca masz (a avea) și jesteś (a fi): chcesz este forma pentru „tu” (persoana a doua), folosită când întrebi pe cineva ce vrea.'
    note: În această unitate ai nevoie de ceva mai mult decât de „eu” -- *chcę* (vreau) și *chcesz* (vrei) urmează exact același tipar de persoană pe care îl știi deja de la *masz* și *jesteś*, doar că la un verb nou.
  pl.a1.unit11.lesson01.teach.kino:
    title: Cinema
    gloss: cinema
    note: Cuvântul uzual pentru cinema -- apare mereu când faci planuri.
    example_gloss: Acesta este cinematograful.
  pl.a1.unit11.lesson01.teach.razem:
    title: Împreună
    gloss: împreună
    note: Razem înseamnă și „total” în contextul cumpărăturilor (poate îți amintești din unitatea despre cumpărături) -- aici este folosit în celălalt sens uzual, „împreună”.
    example_gloss: Vrei să mergem împreună?
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_do_kina:
    title: Vrei să mergi la cinema?
    gloss: Vrei să mergi la cinema?
    note: Czy începe o întrebare cu răspuns da/nu; chcesz iść do kina întreabă ce vrea să facă celălalt -- modul de bază de a propune un plan.
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_razem_do_kina_w_piatek:
    title: Vrei să mergem împreună la cinema vineri?
    gloss: Vrei să mergem împreună la cinema vineri?
    note: 'Propunerea completă: razem (împreună) și w piątek (vineri) adăugate la întrebarea pe care tocmai ai învățat-o.'
  pl.a1.unit11.lesson02.teach.moc_moge:
    title: A putea, eu pot
    gloss: a putea; pot
    note: Móc este infinitivul; mogę este forma de persoana I singular -- poate îți amintești możemy („putem”) din unitățile despre dată și oră; este același verb, la singular.
    example_gloss: Pot veni vineri.
  pl.a1.unit11.lesson02.teach.mozesz:
    title: Tu poți
    gloss: poți (informal)
    note: Możesz este forma informală pentru „tu”, același tipar de persoana a doua ca la chcesz -- folosită ca să întrebi dacă altcineva poate face ceva.
    example_gloss: Poți sâmbătă?
  pl.a1.unit11.lesson02.teach.przyjsc:
    title: A veni
    gloss: a veni
    note: Verbul pentru a veni la o întâlnire -- se potrivește firesc cu mogę/możesz ca să spui cine poate sau nu poate veni.
    example_gloss: Vreau să vin vineri.
  pl.a1.unit11.lesson02.teach.moc_note:
    title: Pot, poți
    gloss: 'Móc: mogę, możesz -- aceeași persoană a doua (tu) ca la chcesz. Mogę plus un infinitiv spune ce poți face: mogę przyjść (pot veni), mogę iść (pot merge).'
    note: '*Mogę* + un verb la infinitiv spune ce poți face -- *mogę przyjść* („pot veni”) și *mogę iść* („pot merge”) urmează același tipar simplu.'
  pl.a1.unit11.lesson02.teach.chetnie:
    title: Cu plăcere
    gloss: cu plăcere
    note: Un mod călduros și entuziast de a accepta un plan -- adesea însoțit de tak (da) sau bardzo (foarte) pentru mai multă căldură.
    example_gloss: Da, cu foarte mare plăcere!
  pl.a1.unit11.lesson02.teach.niestety:
    title: Din păcate
    gloss: din păcate
    note: Formula firească de a refuza politicos un plan -- aproape întotdeauna urmată de nie mogę (nu pot).
    example_gloss: Din păcate, nu pot.
  pl.a1.unit11.lesson02.teach.w_sobote_note:
    title: Sâmbăta
    gloss: 'W + zi a săptămânii: zilele de genul masculin (piątek, poniedziałek, czwartek) nu își schimbă terminația -- w piątek. Zilele de genul feminin (sobota, środa, niedziela) primesc terminația de acuzativ -ę, ca kawa -> kawę -- w sobotę.'
    note: Nu toate zilele funcționează la fel după *w* -- numele feminine de zile, ca *sobota*, devin *sobotę*, exact aceeași terminație *-a* -> *-ę* pe care ai învățat-o la *kawa* -> *kawę* și *herbata* -> *herbatę*. Zilele masculine, ca *piątek*, rămân neschimbate.
  pl.a1.unit11.lesson02.teach.czy_mozesz_przyjsc_w_sobote:
    title: Poți veni sâmbătă?
    gloss: Poți veni sâmbătă?
    note: Reunește możesz, przyjść și noua formă w sobotę -- un mod complet de a întreba despre o zi alternativă.
  pl.a1.unit11.lesson03.teach.moze:
    title: Poate, ce-ar fi
    gloss: poate / ce-ar fi
    note: Cuvântul pentru a propune o alternativă -- apare ori de câte ori primul plan nu merge și vrei să sugerezi altceva.
    example_gloss: Ce-ar fi sâmbătă?
  pl.a1.unit11.lesson03.teach.moze_vs_moge_note:
    title: Może față de mogę
    gloss: 'Może și mogę arată asemănător, dar înseamnă lucruri diferite: może („poate”) propune ceva nou; mogę (forma „eu” a verbului, „pot”) spune ce poți face.'
    note: 'Se confundă ușor în scris: *może* („poate”, folosit aici pentru a sugera ceva) și *mogę* („pot”, verbul la persoana I) au roluri diferite în propoziție, chiar dacă au aceeași rădăcină -- fii atent la ultima literă.'
  pl.a1.unit11.lesson03.teach.o_ktorej_godzinie:
    title: La ce oră?
    gloss: La ce oră?
    note: Modul standard de a cere o oră precisă după ce ziua a fost stabilită -- poate îți amintești o której din unitatea despre oră.
  pl.a1.unit11.lesson03.teach.dialogue.line01:
    title: Ewa propune cinema
    gloss: Ewa îl întreabă pe Marek dacă vrea să meargă vineri la cinema.
    note: Reia prima întrebare învățată în această unitate, acum într-o conversație reală.
  pl.a1.unit11.lesson03.teach.dialogue.line02:
    title: Marek nu poate vineri
    gloss: Marek spune că, din păcate, nu poate vineri.
    note: Niestety atenuează refuzul, înainte ca nie mogę să-l spună direct.
  pl.a1.unit11.lesson03.teach.dialogue.line03:
    title: Marek propune sâmbăta
    gloss: 'Marek întreabă: ce-ar fi sâmbătă?'
    note: Może oferă o alternativă, în loc să încheie conversația doar cu un refuz.
  pl.a1.unit11.lesson03.teach.dialogue.line04:
    title: Ewa acceptă cu plăcere
    gloss: 'Ewa spune: Sâmbătă? Cu mare plăcere!'
    note: Repetă ziua propusă (păstrând forma w sobotę) înainte de a accepta cu chętnie.
  pl.a1.unit11.lesson03.teach.dialogue.line05:
    title: Ewa întreabă ora
    gloss: 'Ewa întreabă: La ce oră?'
    note: Odată stabilită ziua, ultimul detaliu de fixat este ora.
  pl.a1.unit11.lesson03.teach.dialogue.line06:
    title: Marek confirmă ora
    gloss: 'Marek spune: La patru după-amiaza.'
    note: Încheie negocierea cu o oră precisă, stabilită de comun acord, reluând tiparul orelor din unitățile despre oră și rutină.
