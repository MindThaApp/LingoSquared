answer_policy:
  diacritics: 'Same standing policy as unit01-14: display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek) and place names (Kraków, Krakowa, Warszawa, Warszawy).
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or diacritics.
course:
  title: Poloneză A1
units:
  pl.a1.unit15.podroz:
    title: Călătorie
lessons:
  pl.a1.unit15.lesson01.na_dworcu:
    title: În gară
  pl.a1.unit15.lesson02.kiedy_odjezdza_autobus:
    title: Când pleacă autobuzul?
  pl.a1.unit15.lesson03.rozmowa_na_dworcu:
    title: O conversație în gară
teaching:
  pl.a1.unit15.lesson01.teach.dworzec:
    title: Gara
    gloss: gară
    note: 'Locul unde sosesc și pleacă trenurile și autobuzele: punctul de plecare al acestei unități.'
    example_gloss: Gara este aproape de hotel.
  pl.a1.unit15.lesson01.teach.bilet:
    title: Biletul
    gloss: bilet
    note: Ai nevoie de unul înainte să urci în tren sau în autobuz.
    example_gloss: Biletul costă douăzeci de zloți.
  pl.a1.unit15.lesson01.teach.peron:
    title: Peronul
    gloss: peron
    note: Locul unde stai și aștepți trenul.
    example_gloss: Peronul numărul unu este acolo.
  pl.a1.unit15.lesson01.teach.peron_numer_note:
    title: Peronul numărul unu, doi...
    gloss: 'Ca să spui numărul unui peron, poți spune Peron numer + număr: Peron numer jeden, Peron numer dwa.'
    note: 'Mai simplu decât pare: doar *peron* + *numer* + un număr obișnuit pe care îl știi deja. (În anunțurile din gară se folosesc adesea numerale ordinale, ca în *peron pierwszy* — „peronul unu” — dar *peron numer jeden* este întotdeauna înțeles.)'
  pl.a1.unit15.lesson01.teach.pociag_recap:
    title: Trenul, din nou
    gloss: Pociąg odjeżdża o czwartej po południu — cunoști deja această propoziție din lecția despre oră.
    note: Aceeași informație din unitatea despre oră, folosită acum într-o scenă de călătorie.
  pl.a1.unit15.lesson01.teach.krakow:
    title: Cracovia
    gloss: Cracovia
    note: 'Un oraș real din Polonia: prima destinație a acestei unități.'
    example_gloss: Cracovia este departe.
  pl.a1.unit15.lesson01.teach.do_krakowa_note:
    title: Spre Cracovia
    gloss: 'Când mergem undeva, spunem do + altă formă a numelui orașului: do Krakowa (nu do Kraków). Memorează această formă ca un tot.'
    note: 'Nu încerca să deduci *Krakowa* dintr-o regulă: învață deocamdată *do Krakowa* ca expresie fixă.'
  pl.a1.unit15.lesson01.teach.bilet_do_krakowa:
    title: Un bilet la Cracovia, vă rog
    gloss: Un bilet la Cracovia, vă rog.
    note: Exact fraza pe care o spui la ghișeul de bilete.
  pl.a1.unit15.lesson01.teach.jechac_note:
    title: To go (by vehicle)
    gloss: 'Jechać (a merge cu un vehicul): jadę (eu merg), jedzie (el/ea merge). Mâine merg la Cracovia. Marek merge la Cracovia.'
    note: 'Deocamdată doar două forme: *jadę* pentru tine, *jedzie* pentru altcineva.'
  pl.a1.unit15.lesson01.teach.marek_jedzie:
    title: Marek merge la Cracovia
    gloss: Marek merge mâine la Cracovia.
    note: 'Călătoria lui Marek: povestea lui continuă în dialogul acestei unități.'
  pl.a1.unit15.lesson02.teach.autobus:
    title: Autobuzul
    gloss: autobuz
    note: Cealaltă modalitate obișnuită de a călători între orașe.
    example_gloss: Autobuzul este în gară.
  pl.a1.unit15.lesson02.teach.warszawa:
    title: Varșovia
    gloss: Varșovia
    note: 'Capitala Poloniei: a doua destinație a acestei unități.'
    example_gloss: Varșovia este departe.
  pl.a1.unit15.lesson02.teach.do_warszawy_note:
    title: Spre Varșovia
    gloss: 'Warszawa se schimbă altfel decât Kraków: do Warszawy (nu do Warszawa). Fiecare oraș are propria formă: memorează-le separat.'
    note: '*Krakowa* și *Warszawy* nu urmează același model; de aceea fiecare se memorează separat, nu după o regulă comună.'
  pl.a1.unit15.lesson02.teach.dokad:
    title: Încotro
    gloss: încotro
    note: 'Întreabă despre o destinație, nu despre un loc: diferit de întrebarea „unde” se află ceva.'
    example_gloss: Încotro merge autobuzul?
  pl.a1.unit15.lesson02.teach.godzina_recap:
    title: La șapte, din nou
    gloss: Siódmej — cunoști deja această formă a orei din lecția despre oră (o siódmej = la ora șapte).
    note: Același model de formă pentru oră, folosit acum pentru o oră de plecare.
  pl.a1.unit15.lesson02.teach.autobus_odjezdza:
    title: Autobuzul spre Varșovia pleacă la șapte
    gloss: Autobuzul spre Varșovia pleacă la șapte.
    note: Îmbină modelele de destinație și de oră din această lecție într-o propoziție reală.
  pl.a1.unit15.lesson02.teach.kiedy_recap:
    title: Când, din nou
    gloss: Kiedy — cunoști deja acest cuvânt din lecția despre date. Când pleacă autobuzul?
    note: Întrebarea firească înainte de o călătorie.
  pl.a1.unit15.lesson02.teach.ewa_jedzie:
    title: Ewa merge la Varșovia
    gloss: Ewa merge mâine la Varșovia.
    note: 'Călătoria Ewei: povestea ei continuă în dialogul acestei unități, alături de cea a lui Marek.'
  pl.a1.unit15.lesson03.teach.ja_recap:
    title: Eu, din nou
    gloss: Ja — cunoști deja acest cuvânt din lecțiile anterioare.
    note: O scurtă reamintire înainte de dialogul acestei lecții.
  pl.a1.unit15.lesson03.teach.moj_recap:
    title: Al meu, din nou
    gloss: Mój — cunoști deja acest cuvânt din lecția despre familie.
    note: O scurtă reamintire înainte de dialogul acestei lecții.
  pl.a1.unit15.lesson03.teach.dziesiatej_rano_note:
    title: La zece dimineața, din nou
    gloss: Dziesiątej și rano — cunoști deja ambele forme din lecția despre oră (o dziesiątej rano = la zece dimineața).
    note: O scurtă reamintire înainte de dialogul acestei lecții.
  pl.a1.unit15.lesson03.teach.dziekuje_recap:
    title: Mulțumesc și la revedere
    gloss: Dziękuję și Do zobaczenia — le cunoști deja din lecțiile anterioare.
    note: O scurtă reamintire înainte de dialogul acestei lecții.
  pl.a1.unit15.lesson03.teach.mila_podrozy_note:
    title: Drum bun!
    gloss: 'Miłej podróży! este modul de a ura cuiva o călătorie plăcută: o folosim ca expresie întreagă, nu o traducem cuvânt cu cuvânt.'
    note: 'O formulă fixă de rămas-bun: învat-o ca pe un singur bloc, la fel cum ai învățat *Dzień dobry*.'
  pl.a1.unit15.lesson03.teach.dialogue.line01:
    title: Marek merge mâine la Cracovia
    gloss: Mâine merg la Cracovia. Trenul meu pleacă la patru după-amiaza.
    note: 'Marek începe cu propriul plan de călătorie: aceeași informație pe care ne-a dat-o deja prima lecție despre el.'
  pl.a1.unit15.lesson03.teach.dialogue.line02:
    title: Ewa merge mâine la Varșovia
    gloss: Eu merg la Varșovia. Autobuzul meu pleacă la zece dimineața.
    note: 'Ewa își spune planul: aceeași informație pe care ne-a dat-o deja a doua lecție despre ea.'
  pl.a1.unit15.lesson03.teach.dialogue.line03:
    title: Marek îi urează Ewei drum bun
    gloss: Drum bun!
    note: Marek folosește expresia nouă din această lecție ca să-i ureze Ewei bine.
  pl.a1.unit15.lesson03.teach.dialogue.line04:
    title: Ewa îi mulțumește lui Marek și își ia rămas-bun
    gloss: Mulțumesc! Pe curând!
    note: O încheiere simplă și familiară a conversației.
