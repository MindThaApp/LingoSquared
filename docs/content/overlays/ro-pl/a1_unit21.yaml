answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Poloneză A1
  description: 'Poloneză pentru începători: cum să exprimi și să întrebi despre sentimentele de bază și despre cauza lor imediată.'
units:
  pl.a1.unit21.emocje:
    title: Exprimarea sentimentelor
lessons:
  pl.a1.unit21.lesson01.szczesliwy_smutny_czy_zly:
    title: Fericit, trist sau furios?
  pl.a1.unit21.lesson02.dlaczego_jestes_szczesliwy:
    title: De ce ești fericit?
  pl.a1.unit21.lesson03.zdenerwowany_przed_czyms:
    title: Emoționat din cauza a ceva
  pl.a1.unit21.lesson04.pytanie_o_uczucia:
    title: Întrebări despre sentimente
  pl.a1.unit21.lesson05.czytanie_wiadomosci_o_uczuciach:
    title: Citirea unui mesaj despre sentimente
  pl.a1.unit21.lesson06.ewa_uspokaja_marka:
    title: Ewa îl liniștește pe Marek
teaching:
  pl.a1.unit21.lesson01.teach.szczesliwy_smutny_zly:
    title: Fericit, trist și furios
    gloss: fericit, trist, furios
    note: Trei cuvinte de bază pentru sentimente, folosite cu *jestem* (sunt). Sunt forme masculine; o femeie spune *szczęśliwa, smutna, zła*.
    example_gloss:
    - Sunt fericit.
    - Sunt trist.
    - Sunt furios.
  pl.a1.unit21.lesson01.teach.jestem_szczesliwy:
    title: Spui că ești fericit
    gloss: Sunt fericit.
    note: '*Jestem* (sunt, de la *być*) + adjectiv este tiparul de bază, ca în română „sunt ...”. Adjectivul se acordă cu vorbitorul: *szczęśliwy* (bărbat), *szczęśliwa* (femeie).'
  pl.a1.unit21.lesson01.teach.nie_jestem_zly:
    title: Sentimente în contrast
    gloss: Nu sunt furios, sunt trist.
    note: '*Nie* stă chiar înaintea verbului: *Nie jestem zły*. A doua propoziție spune apoi sentimentul real.'
  pl.a1.unit21.lesson02.teach.dlaczego_jestes_szczesliwy:
    title: Întrebarea „de ce”
    gloss: De ce ești fericit?
    note: '*Dlaczego* (de ce) este cuvântul obișnuit pentru a întreba despre un motiv.'
  pl.a1.unit21.lesson02.teach.jestem_szczesliwy_bo:
    title: Spui motivul
    gloss: Sunt fericit pentru că am un apartament nou.
    note: '*Bo* (pentru că) introduce motivul; după *mam* (am) substantivul este la acuzativ: *nowe mieszkanie*.'
  pl.a1.unit21.lesson02.teach.jestem_smutny_bo:
    title: Un motiv negativ
    gloss: Sunt trist pentru că plouă.
    note: '*Pada deszcz* (plouă, literal „ploaia cade”) este expresia obișnuită pentru vreme, folosită aici ca motiv.'
  pl.a1.unit21.lesson03.teach.zdenerwowany:
    title: Nervos
    gloss: nervos
    note: Cuvântul obișnuit pentru nervozitate.
    example_gloss: Sunt nervos înainte de prima mea tură.
  pl.a1.unit21.lesson03.teach.jestem_zdenerwowany_przed:
    title: Spui de ce ești nervos
    gloss: Sunt nervos înainte de prima mea tură.
    note: '*Przed* (literal „înainte de”) + instrumental arată pricina emoției, acolo unde româna spune „înainte de” sau „în fața”: *przed pierwszą zmianą*.'
  pl.a1.unit21.lesson03.teach.nie_martw_sie:
    title: Liniștești pe cineva
    gloss: Nu-ți face griji.
    note: '*Nie martw się* (literal „nu te îngrijora”) este expresia obișnuită de liniștire; *się* este pronumele reflexiv.'
  pl.a1.unit21.lesson04.teach.jak_czuje_sie:
    title: Întrebi cum se simte cineva
    gloss: Cum se simte Marek?
    note: '*Czuć się* (a se simți, reflexiv) este modul obișnuit de a întreba despre o stare emoțională sau de a o descrie: *Jak czuje się Marek?*'
  pl.a1.unit21.lesson04.teach.on_czuje_sie:
    title: Descrii cum se simte cineva
    gloss: El se simte nervos.
    note: '*Się* rămâne lângă verb: *on czuje się*. Adjectivul este masculin, acordat cu *on*: *zdenerwowany*.'
  pl.a1.unit21.lesson04.teach.dlaczego_on_czuje:
    title: Întrebi de ce se simte cineva într-un anumit fel
    gloss: De ce se simte nervos?
    note: Combină *dlaczego* (de ce) cu tiparul *czuje się* din *On czuje się zdenerwowany*.
  pl.a1.unit21.lesson05.teach.czesc_ewo_jestem:
    title: Citește un mesaj despre sentimente
    gloss: Salut, Ewa, sunt puțin emoționat înainte de prima mea tură pe cont propriu. Dar sunt și fericit, pentru că am o slujbă nouă și un apartament nou. Cred că va fi bine.
    note: Urmărește de ce este nervos autorul, ce îl face fericit și cum vede el lucrurile în ansamblu.
    glosses:
      trochę: puțin
      zdenerwowany: nervos
      pierwszą: primul
      zmianą: tură
      samodzielną: singur
      szczęśliwy: se bucură
      bo: pentru că
      nową: noi
      pracę: slujbă
      nowe: noi
      mieszkanie: apartament
      myślę: a crede
      będzie: va merge (bine)
  pl.a1.unit21.lesson06.teach.ewa_czesc_marku:
    title: Ewa îl întreabă pe Marek cum se simte
    gloss: 'Ewa: Salut, Marek, cum te simți înainte de prima tură?'
    note: '*Przed pierwszą zmianą* (înainte de prima tură) reia tiparul *przed* + instrumental din lecția 3. *Czujesz się* este forma pentru *ty*.'
  pl.a1.unit21.lesson06.teach.marek_szczerze_mowiac:
    title: Marek recunoaște că e emoționat
    gloss: 'Marek: Sincer să fiu, sunt puțin emoționat.'
    note: '*Szczerze mówiąc* (sincer vorbind, literal „vorbind sincer”) atenuează recunoașterea.'
  pl.a1.unit21.lesson06.teach.ewa_nie_martw:
    title: Ewa îl liniștește
    gloss: 'Ewa: Nu-ți face griji, te vei descurca bine!'
    note: '*Dobrze sobie poradzisz* (literal „te vei descurca bine”) este o expresie fixă de încurajare; *poradzisz* este viitorul pentru *ty* al lui *poradzić sobie*.'
  pl.a1.unit21.lesson06.teach.marek_dzieki_to:
    title: Marek îi mulțumește
    gloss: 'Marek: Mersi, chiar mă ajută.'
    note: '*Pomaga* este forma pentru *on/ona/ono* a verbului *pomagać* (a ajuta); *dzięki* este „mersi”, informal.'
  pl.a1.unit21.lesson06.teach.ewa_a_potem:
    title: Ewa prezice rezultatul
    gloss: 'Ewa: Iar după aceea vei fi sigur foarte fericit și mândru.'
    note: '*Na pewno* (sigur, cu siguranță) exprimă o predicție făcută cu încredere; *dumny* (mândru) este un adjectiv nou și util. *Będziesz* este viitorul lui *być*.'
  pl.a1.unit21.lesson06.teach.marek_tak_ja:
    title: Marek este de acord
    gloss: 'Marek: Da, și eu cred asta.'
    note: '*Ja też tak myślę* (literal „și eu așa gândesc”) este modul firesc de a fi de acord; *ja* este adăugat aici pentru contrast.'
  pl.a1.unit21.lesson06.teach.marek_jest_zdenerwowany:
    title: Rezumat cu jest și mu
    gloss: Marek este emoționat înainte de prima tură. Ewa îl ajută.
    note: '*Jest* este forma pentru *on/ona* a verbului *być* (a fi); *mu* înseamnă „lui” (dativ, pentru că *pomagać* cere dativul). Cuvinte mici, dar esențiale când vorbești despre altcineva.'
