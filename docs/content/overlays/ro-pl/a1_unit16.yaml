teaching:
  pl.a1.unit16.lesson01.teach.boli_note:
    title: Doare
    gloss: 'Boleć (a durea), timpul prezent: boli (el/ea/ono) și bolą (ei/ele). Głowa mnie boli înseamnă „mă doare capul” -- literal „capul mă doare pe mine”.'
    note: Pentru dureri, prezentul verbului *boleć* se folosește doar în aceste două forme -- partea corpului este subiectul, iar *mnie* arată a cui este, deci nu trebuie să înveți o formă pentru „eu dor”.
  pl.a1.unit16.lesson01.teach.glowa:
    title: Capul
    gloss: cap
    note: Cel mai des spui că te doare capul.
    example_gloss: Mă doare capul.
  pl.a1.unit16.lesson01.teach.gardlo:
    title: Gâtul
    gloss: gât
    note: Util pentru a descrie o răceală sau o durere în gât.
    example_gloss: Mă doare gâtul.
  pl.a1.unit16.lesson01.teach.brzuch:
    title: Stomacul
    gloss: stomac
    note: Util după o masă copioasă sau când ceva nu ți-a priit.
    example_gloss: Mă doare burta.
  pl.a1.unit16.lesson01.teach.zeby:
    title: Dinții
    gloss: dinți
    note: Aici se folosește mereu pluralul, așa cum ar spune un vorbitor nativ de polonă -- de aceea se folosește *bolą* (nu *boli*).
    example_gloss: Mă dor dinții.
  pl.a1.unit16.lesson01.teach.co_cie_boli:
    title: Ce te doare?
    gloss: Ce te doare?
    note: Întrebarea firească pentru cineva care nu se simte bine.
  pl.a1.unit16.lesson02.teach.czuc_sie_note:
    title: Cum te simți?
    gloss: 'Czuć się (a se simți): czuję się (eu), czujesz się (tu). Cum te simți?'
    note: Deocamdată doar două forme -- *czuję* pentru tine, *czujesz* pentru a întreba pe altcineva.
  pl.a1.unit16.lesson02.teach.dobrze_zle_contrast:
    title: Bine și rău
    gloss: Mă simt bine. Mă simt rău. -- dobrze îl știi deja; źle este opusul lui.
    note: Același *dobrze* pe care îl folosești încă de la prima lecție, acum alături de opusul lui.
  pl.a1.unit16.lesson02.teach.zle:
    title: Rău
    gloss: rău
    note: Cuvântul de care ai nevoie ca să spui că nu te simți bine.
    example_gloss: Mă simt rău.
  pl.a1.unit16.lesson02.teach.goraczka:
    title: Febră
    gloss: febră
    note: Un simptom de bază, des întâlnit.
    example_gloss: Am febră.
  pl.a1.unit16.lesson02.teach.ewa_ma_recap:
    title: Ewa, ma -- din nou
    gloss: Ewa, ma -- cunoști deja acest nume și această formă a verbului mieć (a avea) din lecțiile anterioare (Mam, masz, ma).
    note: O scurtă reamintire înainte ca această lecție să le folosească pe amândouă.
  pl.a1.unit16.lesson02.teach.chory_chora:
    title: Bolnav
    gloss: bolnav / bolnavă
    note: Același tipar -y/-a pe care l-ai învățat deja cu *młodszy/starsza* -- *chory* pentru un bărbat, *chora* pentru o femeie.
    example_gloss:
    - El este bolnav.
    - Ea este bolnavă.
  pl.a1.unit16.lesson02.teach.ewa_line_preview:
    title: Ewa nu se simte bine
    gloss: Mă simt rău. Am febră.
    note: Ewa își descrie propriile simptome -- același lucru pe care îl spune din nou în dialogul acestei unități.
  pl.a1.unit16.lesson03.teach.marek_recap:
    title: Marek, din nou
    gloss: Marek -- cunoști deja acest nume din lecțiile anterioare.
    note: O scurtă reamintire înainte de dialogul din această lecție.
  pl.a1.unit16.lesson03.teach.i_recap:
    title: „Și”, din nou
    gloss: I (și) -- cunoști deja acest cuvânt din lecțiile anterioare.
    note: O scurtă reamintire înainte de dialogul din această lecție.
  pl.a1.unit16.lesson03.teach.prosze_wode_recap:
    title: „Vă rog” și „apă”, din nou
    gloss: Proszę (vă rog) și wodę (apă) -- cunoști deja ambele cuvinte din lecțiile anterioare.
    note: O scurtă reamintire înainte de dialogul din această lecție.
  pl.a1.unit16.lesson03.teach.dziekuje_recap:
    title: „Mulțumesc”, din nou
    gloss: Dziękuję (mulțumesc) -- cunoști deja acest cuvânt din lecțiile anterioare.
    note: O scurtă reamintire înainte de dialogul din această lecție.
  pl.a1.unit16.lesson03.teach.odpoczac:
    title: A se odihni
    gloss: a se odihni
    note: 'Se folosește cu *Proszę* la fel ca atunci când ceri cuiva să meargă drept înainte sau să o ia într-o direcție: *Proszę* + infinitiv, fără imperativ.'
    example_gloss: Vă rog să vă odihniți.
  pl.a1.unit16.lesson03.teach.pic:
    title: A bea
    gloss: a bea
    note: Încă un infinitiv care urmează după *Proszę* în același fel.
    example_gloss: Vă rog să beți apă.
  pl.a1.unit16.lesson03.teach.dialogue.line01:
    title: Marek o întreabă pe Ewa cum se simte
    gloss: Ewa, cum te simți?
    note: Marek observă că ceva nu e în regulă și întreabă direct.
  pl.a1.unit16.lesson03.teach.dialogue.line02:
    title: Ewa își descrie simptomele
    gloss: Mă simt rău. Mă doare gâtul și am febră.
    note: Ewa spune clar două simptome -- aceleași pe care le-am aflat deja mai devreme în această unitate.
  pl.a1.unit16.lesson03.teach.dialogue.line03:
    title: Marek dă un sfat simplu
    gloss: Vă rog să vă odihniți și să beți apă.
    note: Un sfat simplu, fără diagnostic -- nu e o indicație medicală, ci doar bun-simț.
  pl.a1.unit16.lesson03.teach.dialogue.line04:
    title: Ewa îi mulțumește lui Marek
    gloss: Bine, mulțumesc, Marek.
    note: O încheiere simplă și familiară a conversației.
