  pl.a1.unit38.lesson05.teach.teraz_jest_wiosna:
    title: O conversație despre anotimpuri
    gloss: 'Acum este primăvară. Lalelele sunt frumoase. Nina întreabă: Pe care anotimp îl găsești frumos? Marek spune: Îmi place vara. Vara înotăm. Ewa spune: Îmi place iarna. Iarna patinăm.'
    note: Recapitulează conversația din cafeneaua de limbi străine, prin povestire cu citate directe, ca textele de recapitulare din celelalte unități.
    glosses:
      wiosna: primăvara
      Tulipany: lalele
      ładne: frumos
      pyta: întreabă
      porę: anotimp
      uważasz: a găsi / a considera
      mówi: spune
      lato: vara
      Lubię: grozav / frumos
      pływamy: înotăm
      zimę: iarna
      łyżwach: a patina
