  pl.a1.unit38.lesson03.teach.lubie_pora_roku:
    title: Construcția cu Lubię
    gloss: '*Lubię* + anotimp spune ce anotimp îți place: *Lubię lato.* Anotimpul stă la acuzativ: *wiosnę*, *zimę*.'
    note: '*Lubię* („îmi place”) cere acuzativul: substantivele feminine în *-a* trec la *-ę* (*zima* -> *zimę*, *wiosna* -> *wiosnę*), iar *jesień* și *lato* (substantiv în *-o*) arată la fel. Ca să spui ce părere ai despre un anotimp, folosește *Uważam* + acuzativ + *za* + adjectiv: *Uważam jesień za ładną*.'
