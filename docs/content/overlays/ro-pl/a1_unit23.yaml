teaching:
  pl.a1.unit23.lesson01.teach.ile_to_kosztuje:
    title: Cum afli prețul total
    gloss: Cât costă în total?
    note: '*W sumie* (în total) arată că vrei prețul complet, nu prețul unui singur articol.'
  pl.a1.unit23.lesson01.teach.w_sumie_to:
    title: Cum spui prețul total
    gloss: În total costă o sută de zloți.
    note: '*Kosztuje* este forma de *on/ona/ono* a verbului *kosztować* (a costa). Numerele de la 5 în sus cer genitivul plural: *sto złotych*.'
  pl.a1.unit23.lesson02.teach.placic_karta_placic:
    title: Plata cu cardul sau în numerar
    gloss: a plăti cu cardul, a plăti în numerar
    note: '*Płacić kartą* (a plăti cu cardul) și *płacić gotówką* (a plăti cash) folosesc instrumentalul după *płacić*: *kartą*, *gotówką*.'
    example_gloss:
    - Pot plăti cu cardul aici?
    - Plătesc în numerar.
  pl.a1.unit23.lesson02.teach.czy_moge_tu:
    title: Cum întrebi dacă se poate plăti cu cardul
    gloss: Pot plăti cu cardul aici?
    note: '*Tu* (aici) leagă întrebarea de locul în care te afli; *czy* introduce o întrebare cu da/nu, iar *mogę* înseamnă „pot”.'
  pl.a1.unit23.lesson02.teach.czy_chce_pan:
    title: Cum întrebi cum preferă cineva să plătească
    gloss: Doriți să plătiți în numerar sau cu cardul?
    note: '*Czy chce pan ...?* este forma politicoasă a lui *Czy chcesz ...?*, folosită aici de o casieră necunoscută (*pan* pentru bărbat, *pani* pentru femeie).'
  pl.a1.unit23.lesson03.teach.rachunek:
    title: Nota de plată
    gloss: nota de plată
    note: 'Substantiv masculin: *rachunek* (genitiv *rachunku*).'
    example_gloss: Împărțim nota de plată?
  pl.a1.unit23.lesson03.teach.moze_podzielimy_rachunek:
    title: Cum propui să împărțiți nota de plată
    gloss: Împărțim nota de plată?
    note: '*Może podzielimy ...?* este o modalitate politicoasă de a propune ceva împreună; *podzielimy* este forma pentru *my* a verbului *podzielić*.'
  pl.a1.unit23.lesson03.teach.czy_moge_zaplacic:
    title: Cum ceri să plătești separat
    gloss: Pot plăti separat?
    note: '*Osobno* (separat) se leagă de *zapłacić* (a plăti, perfectiv: o plată încheiată).'
  pl.a1.unit23.lesson04.teach.reszta:
    title: Restul
    gloss: restul
    note: 'Substantiv feminin: *reszta* (genitiv *reszty*, ca în *nie potrzebuję reszty*).'
    example_gloss: Poftiți restul.
  pl.a1.unit23.lesson04.teach.oto_pana_reszta:
    title: Cum dai restul
    gloss: Poftiți restul.
    note: '*Pana* este „dumneavoastră” formal (către un bărbat; *pani* pentru o femeie), potrivit registrului formal de la casă.'
  pl.a1.unit23.lesson04.teach.nie_potrzebuje_reszty:
    title: Cum refuzi restul
    gloss: Nu am nevoie de rest.
    note: '*Nie potrzebuję* + genitiv: negația pune complementul la genitiv, deci *reszty*.'
  pl.a1.unit23.lesson05.teach.trzydziesci_piec:
    title: Treizeci și cinci
    gloss: treizeci și cinci
    note: '*Trzydzieści pięć* se scrie în două cuvinte: întâi zecile, apoi unitățile (30 + 5).'
    example_gloss: Costă o sută patruzeci de zloți.
  pl.a1.unit23.lesson05.teach.rachunek_dwa_dania:
    title: Citește o notă de plată de la restaurant
    gloss: 'Nota: două feluri principale și două cafele. Total: o sută patruzeci de zloți. Plătit cu cardul.'
    note: Urmărește ce s-a comandat, totalul și cum s-a plătit.
    glosses:
      Rachunek: nota de plată
      dwa: două
      dania: feluri principale (dania główne)
      kawy: cafele
      Razem: totalul
      złotych: zloți
      Zapłacono: plătit
      kartą: card
      sto: o sută
      czterdzieści: patruzeci
  pl.a1.unit23.lesson06.teach.ewa_moze_poprosimy:
    title: Ewa cere nota
    gloss: 'Ewa: Cerem nota?'
    note: 'După *poprosić o* (a cere) urmează acuzativul: *o rachunek*. *Poprosimy* este viitorul perfectiv.'
  pl.a1.unit23.lesson06.teach.marek_tak_dobry:
    title: Marek întreabă totalul
    gloss: 'Marek: Da, bună idee. Cât costă în total?'
    note: Reia întrebarea *Ile to kosztuje w sumie?* din lecția 1.
  pl.a1.unit23.lesson06.teach.ewa_to_trzydziesci:
    title: Ewa spune totalul
    gloss: 'Ewa: Face o sută patruzeci de zloți. Împărțim?'
    note: '*Podzielimy się?* (literal „ne împărțim?”) folosește reflexivul *się* pentru a însemna împărțirea notei.'
  pl.a1.unit23.lesson06.teach.marek_nie_dzisiaj:
    title: Marek insistă să plătească
    gloss: 'Marek: Nu, azi plătesc eu. M-ai ajutat atât de mult!'
    note: '*Dzisiaj ja płacę* (literal „azi eu plătesc”) este formula obișnuită prin care te oferi să plătești; *pomogłaś* este trecutul feminin al lui *pomóc* (a ajuta), pentru că Marek vorbește cu Ewa.'
  pl.a1.unit23.lesson06.teach.ewa_jak_milo:
    title: Ewa este impresionată
    gloss: 'Ewa: Ce drăguț din partea ta! Mulțumesc.'
    note: '*Miło z twojej strony* (drăguț din partea ta) este un compliment călduros și frecvent pentru un gest generos; *z* + genitiv: *z twojej strony*.'
  pl.a1.unit23.lesson06.teach.marek_czy_moge:
    title: Marek întreabă dacă poate plăti cu cardul
    gloss: 'Marek: Pot plăti aici cu cardul?'
    note: Reia întrebarea *Czy mogę tu zapłacić kartą?* din lecția 2, acum în restaurantul propriu-zis.
  pl.a1.unit23.lesson06.teach.marek_placi_rachunek:
    title: 'Płaci: forma pentru el/ea'
    gloss: Marek plătește nota.
    note: '*Płaci* este forma de *on/ona/ono* a verbului *płacić* (a plăti).'
