teaching:
  pl.a1.unit10.lesson01.teach.wstawac_wstaje:
    title: A se trezi, mă trezesc
    gloss: a se trezi; mă trezesc
    note: Wstawać este infinitivul; wstaję este forma persoanei întâi, pe care o folosești de zi cu zi când vorbești despre propria rutină.
    example_gloss: Mă trezesc la șapte dimineața.
  pl.a1.unit10.lesson01.teach.jesc_jem:
    title: A mânca, mănânc
    gloss: a mânca; mănânc
    note: 'Jeść este puțin neregulat, dar jem („mănânc”) este forma pe care o vei folosi cel mai des: așa spune un polonez „mănânc” despre orice masă.'
    example_gloss: Dimineața mănânc micul dejun.
  pl.a1.unit10.lesson01.teach.sniadanie:
    title: Micul dejun
    gloss: micul dejun
    note: 'Śniadanie nu se schimbă după jem: „mănânc micul dejun” este pur și simplu jem śniadanie, fără nicio terminație în plus de învățat.'
    example_gloss: Dimineața mănânc micul dejun.
  pl.a1.unit10.lesson01.teach.pic_pije:
    title: A bea, beau
    gloss: a bea; beau
    note: Pić este infinitivul; piję este forma persoanei întâi, folosită la fel ca jem și wstaję.
    example_gloss: Dimineața beau cafea.
  pl.a1.unit10.lesson01.teach.pierwsza_osoba_note:
    title: Despre tine
    gloss: Wstaję, jem, piję -- în acest capitol vorbim doar despre noi înșine, la persoana întâi (eu), la fel cum îți descrii propria zi.
    note: Tot acest capitol rămâne intenționat la forma de persoana întâi a fiecărui verb -- *wstaję* (mă trezesc), *jem* (mănânc), *piję* (beau) -- ca să te poți concentra pe descrierea propriei rutine, fără să înveți în același timp cum se schimbă fiecare verb pentru „tu”, „el” sau „ea”.
  pl.a1.unit10.lesson01.teach.o_siodmej_rano:
    title: Mă trezesc la șapte dimineața
    gloss: Mă trezesc la șapte dimineața.
    note: 'Tiparul din nota de gramatică în acțiune: o + forma de locativ a orei (siódmej) înseamnă „la” ora respectivă, exact ca în unitatea anterioară despre oră.'
  pl.a1.unit10.lesson01.teach.sniadanie_kawa:
    title: Mănânc micul dejun și beau cafea
    gloss: Mănânc micul dejun și beau cafea.
    note: Două verbe la persoana întâi unite prin i („și”) -- un mod firesc de a enumera ce faci dimineața.
  pl.a1.unit10.lesson02.teach.obiad:
    title: Prânzul
    gloss: prânz / masa de la mijlocul zilei
    note: 'Ca și śniadanie, obiad nu se schimbă după jem: jem obiad înseamnă pur și simplu „mănânc prânzul”.'
    example_gloss: La amiază mănânc prânzul.
  pl.a1.unit10.lesson02.teach.pracowac_pracuje:
    title: A munci, muncesc
    gloss: a munci; muncesc
    note: Pracować urmează același tipar -ować -> -uję ca kosztować -> kosztuje din unitatea despre cumpărături, doar că acum la persoana întâi.
    example_gloss: Lucrez după-amiaza.
  pl.a1.unit10.lesson02.teach.dom:
    title: Acasă
    gloss: acasă / casă
    note: Cuvântul de zi cu zi pentru „acasă” -- apare mereu în expresia „merg/vin acasă”.
    example_gloss: Casa este acolo.
  pl.a1.unit10.lesson02.teach.do_domu_note:
    title: Acasă
    gloss: 'Acasă -- do cere genitivul, iar genitivul lui dom se termină în -u: domu, exact ca bank -> banku, park -> parku, hotel -> hotelu.'
    note: '*Do domu* („acasă”, ca în „merg acasă”) reia aceeași terminație de genitiv *-u* pe care ai învățat-o după *do* la bank, hotel și park -- încă un substantiv care urmează același tipar.'
  pl.a1.unit10.lesson02.teach.wracac_wracam:
    title: A se întoarce, mă întorc
    gloss: a se întoarce / a se reîntoarce; mă întorc
    note: Se folosește cu do domu pentru a spune „merg acasă” sau „mă întorc acasă” -- una dintre cele mai frecvente expresii din poloneza de zi cu zi.
    example_gloss: Seara mă întorc acasă.
  pl.a1.unit10.lesson02.teach.pory_dnia:
    title: La amiază, după-amiaza, seara
    gloss: la amiază; după-amiaza; seara
    note: 'Recapitulare din unitatea despre timp: împreună cu rano și w nocy, aceste expresii acoperă toată ziua.'
    example_gloss:
    - La amiază mănânc prânzul.
    - Lucrez după-amiaza.
    - Seara mă întorc acasă.
  pl.a1.unit10.lesson02.teach.praca_dom_phrase:
    title: Muncesc după-amiaza, apoi mă întorc acasă
    gloss: Muncesc după-amiaza, apoi mă întorc acasă.
    note: Același tipar cu virgulă + potem din unitatea despre direcții, folosit acum pentru a lega două părți ale rutinei zilnice.
  pl.a1.unit10.lesson03.teach.spac_spie:
    title: A dormi, dorm
    gloss: a dormi; dorm
    note: Śpię are o schimbare de vocală aparent neregulată față de infinitivul spać, dar este un verb foarte comun, care merită memorizat ca atare.
    example_gloss: Noaptea dorm.
  pl.a1.unit10.lesson03.teach.a_ty_ja_tez:
    title: Și tu? Și eu.
    gloss: Și tu? / Și eu.
    note: A ty? este modul simplu de a-i da cuvântul celeilalte persoane; ja też înseamnă „și eu” -- ambele apar mereu în conversațiile de zi cu zi.
    example_gloss: Și eu mănânc micul dejun dimineața.
  pl.a1.unit10.lesson03.teach.ale_nie_herbata:
    title: Dar, ceai, nu
    gloss: dar; ceai (complement direct); nu
    note: Ale introduce o opoziție; nie înaintea unui cuvânt (nu înaintea unui verb) înseamnă „nu [acel lucru]” -- piję herbatę, nie kawę înseamnă „beau ceai, nu cafea”.
    example_gloss: Beau ceai, dar nu cafea.
  pl.a1.unit10.lesson03.teach.dziesiatej_wczesnie_note:
    title: Devreme, la zece
    gloss: devreme; la ora zece -- aceeași terminație -ej la orele de după „o” ca în czwartej, siódmej din lecția anterioară.
    note: '*O dziesiątej* („la zece”) reia exact tiparul orelor pe care îl cunoști deja -- *dziesiąta* devine *dziesiątej* după *o*, ca *czwarta* -> *czwartej* și *siódma* -> *siódmej*.'
  pl.a1.unit10.lesson03.teach.dialogue.line01:
    title: Ewa își descrie dimineața
    gloss: Ewa spune că se trezește la șapte dimineața și bea cafea.
    note: Reia chiar prima structură învățată în această unitate, acum într-o conversație reală.
  pl.a1.unit10.lesson03.teach.dialogue.line02:
    title: Ewa își continuă ziua
    gloss: Ewa spune că mănâncă micul dejun, apoi muncește după-amiaza.
    note: Leagă două activități la persoana întâi cu potem, același tipar din Lecția 2.
  pl.a1.unit10.lesson03.teach.dialogue.line03:
    title: Ewa termină și îl întreabă pe Marek
    gloss: Ewa spune că seara se întoarce acasă. Și tu?
    note: A ty? îi dă cuvântul lui Marek fără nicio gramatică nouă de întrebare.
  pl.a1.unit10.lesson03.teach.dialogue.line04:
    title: Marek își povestește dimineața
    gloss: Marek spune că și el se trezește la șapte! Dar bea ceai, nu cafea.
    note: Ja też confirmă un detaliu comun (ora trezirii) înainte de contrastul cu ale...nie pentru băutură.
  pl.a1.unit10.lesson03.teach.dialogue.line05:
    title: Marek își descrie ziua
    gloss: Marek spune că muncește dimineața, apoi mănâncă prânzul la amiază.
    note: O ordine diferită a zilei față de cea a Ewei -- întâi munca, apoi masa de la mijlocul zilei.
  pl.a1.unit10.lesson03.teach.dialogue.line06:
    title: Marek vorbește despre somn
    gloss: Marek spune că se culcă devreme, la zece seara.
    note: Încheie conversația cu noul verb spać/śpię și cu tiparul orelor reluat în această lecție.
