teaching:
  pl.a1.unit03.lesson01.teach.poniedzialek:
    title: luni
    gloss: luni
    note: Prima zi a săptămânii în poloneză, la fel ca în calendarul din România.
    example_gloss: Astăzi este luni.
  pl.a1.unit03.lesson01.teach.wtorek:
    title: Marți
    gloss: marți
    note: 'Atenție: cu *wtorek* se folosește prepoziția *we*, nu *w*, când spui „marți”. Mai multe despre asta, mai târziu în această lecție.'
    example_gloss: Astăzi este marți.
  pl.a1.unit03.lesson01.teach.sroda:
    title: Miercuri
    gloss: miercuri
    note: Substantiv feminin, spre deosebire de majoritatea celorlalte zile ale săptămânii.
    example_gloss: Astăzi este miercuri.
  pl.a1.unit03.lesson01.teach.czwartek:
    title: Joi
    gloss: joi
    note: Același tipar masculin ca *poniedziałek*, *wtorek* și *piątek*.
    example_gloss: Astăzi este joi.
  pl.a1.unit03.lesson01.teach.piatek:
    title: Vineri
    gloss: vineri
    note: Vei mai întâlni această zi în unitate – este ziua în care Ewa și Marek plănuiesc să se întâlnească din nou.
    example_gloss: Astăzi este vineri.
  pl.a1.unit03.lesson01.teach.sobota:
    title: sâmbătă
    gloss: sâmbătă
    note: 'Face parte din weekend – un cuvânt pe care îl folosesc și mulți polonezi: *weekend*.'
    example_gloss: Astăzi este sâmbătă.
  pl.a1.unit03.lesson01.teach.niedziela:
    title: duminică
    gloss: duminică
    note: Ultima dintre cele șapte zile ale săptămânii învățate în această lecție.
    example_gloss: Astăzi este duminică.
  pl.a1.unit03.lesson01.teach.jaki_dzien:
    title: Întrebăm ce zi este
    gloss: Ce zi a săptămânii este azi?
    note: O formă directă de întrebare – *dzień tygodnia* înseamnă literal „ziua săptămânii”.
  pl.a1.unit03.lesson01.teach.we_wtorek_note:
    title: Excepția w/we
    gloss: Luni, joi, vineri – dar marți (pentru o pronunție mai ușoară).
    note: 'Majoritatea zilelor urmează tiparul „*w* + [zi]” pentru „în/la [zi]”. *Wtorek* este singura excepție reală: polonezii spun *we wtorek*, nu *w wtorek*, doar pentru că e mai ușor de pronunțat – o neregularitate autentică, nu o greșeală de scriere.'
  pl.a1.unit03.lesson01.teach.w_piatek_kino:
    title: Vineri merg la cinema
    gloss: Vineri merg la cinema.
    note: '*Piątek* nu se schimbă după *w* – doar *środa*, *sobota* și *niedziela* ar avea altă formă (nu sunt tratate în această lecție, pentru ca lucrurile să rămână simple la nivelul A1).'
  pl.a1.unit03.lesson02.teach.styczen_luty_marzec:
    title: Ianuarie, februarie, martie
    gloss: ianuarie; februarie; martie
    note: '*Luty* este cazul aparte din punct de vedere gramatical – se comportă ca un adjectiv, nu ca un substantiv obișnuit (îl vei vedea din nou în forma „în februarie”, mai târziu în unitate).'
    example_gloss:
    - Ziua mea de naștere este în ianuarie.
    - Merg la Varșovia în februarie.
    - Ziua mea de naștere este în martie.
  pl.a1.unit03.lesson02.teach.kwiecien_maj_czerwiec:
    title: Aprilie, mai, iunie
    gloss: aprilie; mai; iunie
    note: '*Maj* este luna pe care o vei vedea în ambele date din povestea acestei unități.'
    example_gloss:
    - Merg la Varșovia în aprilie.
    - Ziua mea de naștere este în mai.
    - Merg la Varșovia în iunie.
  pl.a1.unit03.lesson02.teach.lipiec_sierpien_wrzesien:
    title: Iulie, august, septembrie
    gloss: iulie; august; septembrie
    note: 'Încă o neregularitate reală: „în septembrie” este *we wrześniu*, nu *w wrześniu* – aceeași alternanță *we*, mai ușor de pronunțat, pe care ai văzut-o deja la *wtorek*.'
    example_gloss:
    - Sunt în concediu în iulie.
    - Merg la Varșovia în august.
    - Ziua mea de naștere este în septembrie.
  pl.a1.unit03.lesson02.teach.pazdziernik_listopad_grudzien:
    title: Octombrie, noiembrie, decembrie
    gloss: octombrie; noiembrie; decembrie
    note: Ultimele trei luni ale anului, care completează setul de douăsprezece.
    example_gloss:
    - Merg la Varșovia în octombrie.
    - Ziua mea de naștere este în noiembrie.
    - Sunt în concediu în decembrie.
  pl.a1.unit03.lesson02.teach.urodziny:
    title: Ziua de naștere
    gloss: ziua de naștere
    note: '*Urodziny* este mereu la plural în poloneză, chiar și pentru ziua de naștere a unei singure persoane – se asociază cu *są* („sunt”), niciodată cu *jest* („este”). Vei exersa exact acest punct într-un exercițiu mai târziu în lecție.'
    example_gloss: Ziua mea de naștere este în mai.
  pl.a1.unit03.lesson02.teach.kiedy:
    title: Când
    gloss: când
    note: Cuvântul interogativ pentru orice moment în timp.
    example_gloss: Când este întâlnirea?
  pl.a1.unit03.lesson02.teach.kiedy_sa_twoje_urodziny:
    title: Întrebăm când este ziua cuiva
    gloss: Când e ziua ta?
    note: '*Są*, nu *jest*, în acord cu pluralul *urodziny* – tiparul semnalat la cardul *urodziny*.'
  pl.a1.unit03.lesson02.teach.moje_urodziny_sa_dziesiatego_maja:
    title: Spunem data zilei de naștere
    gloss: Ziua mea de naștere este pe 10 mai.
    note: '*Dziesiątego maja* – ziua se termină în *-ego*, iar luna în *-a*, fără nicio prepoziție. Așa se spune în poloneză o dată anume; vezi nota de gramatică de mai târziu din lecție pentru tiparul complet.'
  pl.a1.unit03.lesson02.teach.kiedy_jest_spotkanie:
    title: Întrebăm când are loc întâlnirea
    gloss: Când este întâlnirea?
    note: '*Spotkanie* (întâlnire) – un cuvânt pe care îl vei revedea în dialogul din lecția 3.'
  pl.a1.unit03.lesson02.teach.spotkanie_jest_pietnastego_maja:
    title: Spunem data întâlnirii
    gloss: Întâlnirea este pe 15 mai.
    note: Același tipar de dată *-ego* + *-a* ca la *dziesiątego maja*, doar cu alt număr de zi.
  pl.a1.unit03.lesson02.teach.date_pattern_note:
    title: Cum se spune data în poloneză
    gloss: 'Data: ziua se termină în -ego, luna în -a (dar februarie este lutego), fără prepoziție – 10 mai, 15 mai.'
    note: Compară cu „vineri” (*w piątek*, cu prepoziția *w*) – data calendaristică precisă funcționează altfel și nu primește niciodată prepoziție.
  pl.a1.unit03.lesson03.teach.kiedy_mozemy_sie_spotkac:
    title: Propunem să ne întâlnim din nou
    gloss: Când ne putem întâlni din nou?
    note: '*Znowu* înseamnă „din nou” – un mod firesc de a începe o discuție despre programarea unei noi întâlniri.'
  pl.a1.unit03.lesson03.teach.czy_piatek_panu:
    title: Îl întrebăm formal pe un bărbat dacă îi convine vinerea
    gloss: Vă convine vineri? (către un bărbat, formal)
    note: '*Panu* este forma de dativ a lui *pan*. Verbul *odpowiadać* („a conveni”, „a se potrivi”) cere complementul la dativ, ca în română: „Vinerea *îmi* convine”.'
  pl.a1.unit03.lesson03.teach.czy_piatek_pani:
    title: Întrebi formal o femeie dacă vinerea i se potrivește
    gloss: Vă convine vinerea? (către o femeie, formal)
    note: Înlocuiește *panu* cu *pani* ca să te adresezi formal unei femei. *Pani* rămâne la fel atât la nominativ, cât și la dativ, spre deosebire de *pan*/*panu*.
  pl.a1.unit03.lesson03.teach.czy_piatek_ci:
    title: Întrebi un prieten dacă vinerea i se potrivește, informal
    gloss: Îți convine vinerea? (informal)
    note: '*Ci* înlocuiește *panu*/*pani* când vorbești cu un prieten sau cu un cunoscut de aceeași vârstă. Este dativul informal al lui „tu”.'
  pl.a1.unit03.lesson03.teach.piatek_mi_odpowiada:
    title: Spui că ție îți convine vinerea
    gloss: Vinerea îmi convine.
    note: '*Mi* este dativul persoanei I, același tipar de caz ca *panu*/*pani*/*ci*, doar că pentru „eu” în loc de „tu”.'
  pl.a1.unit03.lesson03.teach.data:
    title: Data
    gloss: dată (data din calendar)
    note: Seamănă cu cuvântul românesc „dată”, deci îl recunoști ușor.
    example_gloss: Ce dată va fi?
  pl.a1.unit03.lesson03.teach.jaka_to_bedzie_data:
    title: Întrebi ce dată va fi
    gloss: Ce dată va fi?
    note: O continuare firească după ce doi oameni au stabilit ziua săptămânii, dar nu și data exactă.
  pl.a1.unit03.lesson03.teach.dialogue.line01:
    title: Ewa propune să se întâlnească din nou
    gloss: Ewa îl întreabă pe Marek când se pot întâlni din nou.
    note: Reia întocmai întrebarea de la începutul lecției.
  pl.a1.unit03.lesson03.teach.dialogue.line02:
    title: Marek propune vinerea, formal
    gloss: Marek o întreabă pe Ewa, formal, dacă îi convine vinerea.
    note: O abordează pe Ewa cu *pani*, păstrând registrul formal folosit din prima unitate.
  pl.a1.unit03.lesson03.teach.dialogue.line03:
    title: Ewa acceptă și întreabă data
    gloss: Ewa spune că vinerea îi convine, apoi întreabă care va fi data exactă.
    note: '*Tak* („da”), întâlnit în unitatea 1, deschide răspunsul afirmativ al Ewei, înainte să ceară data exactă.'
  pl.a1.unit03.lesson03.teach.dialogue.line04:
    title: Marek spune data
    gloss: Marek spune 15 mai.
    note: Ambele cuvinte au fost deja învățate în lecția 2 din această unitate.
  pl.a1.unit03.lesson03.teach.dialogue.line05:
    title: Ewa confirmă și își ia rămas-bun
    gloss: Ewa spune „grozav” și „ne vedem pe 15 mai”.
    note: '*Do zobaczenia* reia formula de rămas-bun din prima unitate, acum împreună cu o dată precisă.'
  pl.a1.unit03.lesson03.teach.dialogue.line06:
    title: Marek încheie conversația
    gloss: Marek își ia și el rămas-bun.
    note: 'Cea mai scurtă încheiere posibilă: doar formula de rămas-bun.'
