teaching:
  pl.a1.unit04.lesson01.teach.pierwsza_druga_trzecia:
    title: Ora unu, două, trei
    gloss: ora unu; ora două; ora trei
    note: Poloneza spune ora cu numerale ordinale feminine, acordate cu substantivul feminin subînțeles *godzina* („oră”). *Pierwsza* înseamnă literal „prima (oră)”.
    example_gloss:
    - Este ora unu.
    - Este ora două.
    - Este ora trei.
  pl.a1.unit04.lesson01.teach.czwarta_piata_szosta:
    title: Ora patru, cinci, șase
    gloss: ora patru; ora cinci; ora șase
    note: Același tipar de ordinal feminin ca *pierwsza*, *druga*, *trzecia*.
    example_gloss:
    - Este ora patru.
    - Este ora cinci.
    - Este ora șase.
  pl.a1.unit04.lesson01.teach.siodma_osma_dziewiata:
    title: Ora șapte, opt, nouă
    gloss: ora șapte; ora opt; ora nouă
    note: Cele trei ore din mijlocul celor douăsprezece, același tipar.
    example_gloss:
    - Este ora șapte.
    - Este ora opt.
    - Este ora nouă.
  pl.a1.unit04.lesson01.teach.dziesiata_jedenasta_dwunasta:
    title: Ora zece, unsprezece, douăsprezece
    gloss: ora zece; ora unsprezece; ora douăsprezece
    note: Ultimele trei ore, care completează seria întreagă de la 1 la 12.
    example_gloss:
    - Este ora zece.
    - Este ora unsprezece.
    - Este ora douăsprezece.
  pl.a1.unit04.lesson01.teach.ktora_jest_godzina:
    title: Cum întrebi cât este ceasul
    gloss: Cât este ceasul?
    note: 'Literal: „care este ora?” – *która* se acordă cu substantivul feminin *godzina*, același tip de acord pe care îl vei întâlni în toată unitatea.'
  pl.a1.unit04.lesson01.teach.godzina_note:
    title: Godzina este de genul feminin
    gloss: Spunem pierwsza, druga, trzecia, nu pierwszy, drugi, trzeci.
    note: '*Pierwszy*, *drugi*, *trzeci* sunt formele de masculin ale acelorași numerale ordinale, folosite în poloneză pentru substantivele masculine, dar niciodată pentru a spune ora, deoarece *godzina* este feminin.'
  pl.a1.unit04.lesson02.teach.rano_poludnie_popoludniu:
    title: Dimineața, la amiază, după-amiaza
    gloss: dimineața; la amiază; după-amiaza
    note: '*Rano* se folosește singur (fără prepoziție); *w południe* și *po południu* își păstrează fiecare prepoziția fixă. Merită să înveți aceste trei expresii ca atare, nu printr-o regulă generală.'
    example_gloss:
    - Dimineața beau cafea.
    - Prânzesc la amiază.
    - Lucrez după-amiaza.
  pl.a1.unit04.lesson02.teach.wieczorem_w_nocy:
    title: Seara, noaptea
    gloss: seara; noaptea
    note: '*Wieczorem* este o formă adverbială fixă (nu cere prepoziție); *w nocy* îîmbină *w* cu locativul lui *noc* (noapte).'
    example_gloss:
    - Seara mă uit la televizor.
    - Noaptea dorm.
  pl.a1.unit04.lesson02.teach.o_ktorej_godzinie:
    title: Cum întrebăm la ce oră
    gloss: La ce oră?
    note: Folosește această întrebare în loc de *Która jest godzina?* când vrei să afli când va avea loc ceva, nu cât este ceasul acum.
  pl.a1.unit04.lesson02.teach.locative_hour_note:
    title: Cum spunem „la” o anumită oră
    gloss: Ora patru, ora șapte, ora zece – dar la ora patru, la ora șapte, la ora zece.
    note: 'După *o* („la”), terminația *-a* a numelui orei devine *-ej*: *czwarta* → *o czwartej*, *siódma* → *o siódmej*, *dziesiąta* → *o dziesiątej*. Toate orele urmează același tipar; singura particularitate de scriere este *druga* → *o drugiej*, care adaugă un *i* după *g*.'
  pl.a1.unit04.lesson02.teach.ewa_wstaje:
    title: Ewa se trezește devreme
    gloss: Ewa se trezește la 7 dimineața.
    note: '*Wstaje* este persoana a III-a singular a verbului *wstawać* (a se trezi, a se ridica).'
  pl.a1.unit04.lesson02.teach.pociag_odjezdza:
    title: Ora plecării trenului
    gloss: Trenul pleacă la 4 după-amiaza.
    note: '*Odjeżdża* este persoana a III-a singular a verbului *odjeżdżać* (a pleca, a porni).'
  pl.a1.unit04.lesson03.teach.spotkanie:
    title: Întâlnire
    gloss: întâlnire
    note: Același cuvânt pe care l-ai întâlnit în unitatea 3 (*Kiedy jest spotkanie?*), când Ewa și Marek au stabilit ziua și data următoarei întâlniri.
    example_gloss: Întâlnirea este vineri.
  pl.a1.unit04.lesson03.teach.o_ktorej_mozemy_sie_spotkac:
    title: Cum întrebăm la ce oră ne întâlnim
    gloss: La ce oră ne putem întâlni vineri, 15 mai?
    note: 'Îmbină *o której godzinie* din această unitate cu ziua și data din unitatea 3: Ewa și Marek au stabilit deja vineri, 15 mai, și acum trebuie să fixeze ora exactă.'
  pl.a1.unit04.lesson03.teach.moze_o_czwartej:
    title: Propunerea unei ore
    gloss: Poate la 4 după-amiaza?
    note: '*Może*, singur, înseamnă „poate” – o modalitate naturală și blândă de a propune o oră.'
  pl.a1.unit04.lesson03.teach.czwarta_mi_odpowiada:
    title: Confirmăm că ora ne convine
    gloss: Ora 4 după-amiaza îmi convine.
    note: 'Același tipar *[time] + mi + odpowiada* ca *Piątek mi odpowiada* din unitatea 3: ora în sine este subiectul gramatical, iar *odpowiadać* cere întotdeauna persoana la dativ (*mi*, „mie”).'
  pl.a1.unit04.lesson03.teach.do_zobaczenia_o_czwartej:
    title: Confirmăm planul complet
    gloss: Ne vedem pe 15 mai la ora 4!
    note: Reia formula de rămas-bun *Do zobaczenia* din unitatea 1, acum împreună cu o dată și o oră.
  pl.a1.unit04.lesson03.teach.dialogue.line01:
    title: Ewa întreabă ora
    gloss: Ewa îl întreabă pe Marek la ce oră se pot întâlni vineri, 15 mai.
    note: Reia exact întrebarea de la începutul lecției.
  pl.a1.unit04.lesson03.teach.dialogue.line02:
    title: Marek propune ora 4 după-amiaza
    gloss: Marek propune ora 4 după-amiaza.
    note: O propunere blândă, nu o afirmație fermă – asta semnalizează *może*.
  pl.a1.unit04.lesson03.teach.dialogue.line03:
    title: Ewa confirmă
    gloss: Ewa spune că ora 4 după-amiaza îi convine.
    note: Aceeași construcție cu dativ ca în schimbul din unitatea 3, cu „vinerea îmi convine”.
  pl.a1.unit04.lesson03.teach.dialogue.line04:
    title: Marek încheie planul
    gloss: Marek spune „excelent” și „ne vedem pe 15 mai la ora 4!”
    note: '*Świetnie* reia exclamația de entuziasm din unitatea 3.'
  pl.a1.unit04.lesson03.teach.dialogue.line05:
    title: Ewa își ia rămas-bun
    gloss: Ewa îi răspunde cu același rămas-bun.
    note: 'Cea mai scurtă încheiere posibilă: doar formula de rămas-bun.'
