  pl.a1.unit29.lesson02.teach.znasz_juz_prognoze:
    title: 'Verbe pentru mesaje: a trimite și a citi'
    gloss: Știi deja *prognoza pogody* (prognoza meteo). *Wiadomość* este un mesaj pe care îl poți trimite (*wysyłam*, *wysyłasz*) sau citi (*czytam*, *czytasz*).
    note: Leagă cuvântul nou de substantivul compus învățat deja în unitatea despre vreme.
  pl.a1.unit29.lesson02.teach.ewa_wysyla_wiadomosc:
    title: Ewa trimite un mesaj prin aplicație
    gloss: Ewa trimite un mesaj prin aplicație.
    note: '*Wysyłać* (a trimite) folosește *przez* + acuzativ pentru canal: *przez aplikację*.'
  pl.a1.unit29.lesson02.teach.marek_czyta_wiadomosc:
