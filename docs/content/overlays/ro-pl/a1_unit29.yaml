    example_gloss: Verific prognoza meteo.
  pl.a1.unit29.lesson03.teach.po_sprawdzam_stoi:
    title: Două verbe, două cazuri
    gloss: '*Sprawdzam* cere acuzativul: *prognozę pogody*. *Używam* cere genitivul: *telefonu*.'
    note: Majoritatea verbelor cer acuzativul, dar *używać* este o excepție și cere genitivul.
  pl.a1.unit29.lesson03.teach.tomek_sprawdza_prognoze:
    title: Tomek verifică prognoza meteo
    gloss: Tomek verifică prognoza meteo.
  pl.a1.unit29.lesson03.teach.potem_idzie_biegac:
    title: Apoi merge la alergat
    gloss: Apoi merge la alergat.
    note: '*Idzie biegać* înseamnă „se duce să alerge”: *iść* + infinitiv.'
  pl.a1.unit29.lesson04.teach.ewa_pocwiczymy_w:
    title: Ewa propune
    gloss: 'Ewa: Facem mișcare sâmbătă la zece?'
  pl.a1.unit29.lesson04.teach.marek_dobry_pomysl:
    title: Marek e de acord
    gloss: 'Marek: Bună idee! Verific prognoza meteo.'
    note: '*Dobry pomysł!* este un răspuns scurt la o sugestie; adjectivul *dobry* se acordă cu substantivul masculin *pomysł*.'
  pl.a1.unit29.lesson04.teach.marek_w_sobote:
    title: Marek verifică vremea
    gloss: 'Marek: Sâmbătă e senin!'
    note: '*Słonecznie* este un adverb: *jest słonecznie* înseamnă „e senin, e soare” și nu are nevoie de subiect.'
  pl.a1.unit29.lesson04.teach.tomek_widze_wiadomosc:
    title: Tomek vede mesajul
    gloss: 'Tomek: Văd mesajul. Pe sâmbătă!'
  pl.a1.unit29.lesson04.teach.znasz_juz_do:
    title: Do widzenia și do + o zi
    gloss: 'Știi deja *Do widzenia!* Poți numi și o zi: *Do soboty!*, *Do jutra!* (după *do* urmează genitivul).'
    note: Extinde formula de rămas-bun din unitatea despre saluturi la o zi anume.
  pl.a1.unit29.lesson05.teach.ewa_dzwoni_do:
    title: Cine ce folosește?
    gloss: Ewa îl sună pe Marek în fiecare zi. Folosește telefonul, nu o aplicație. Marek nu are computer acasă, dar folosește internetul pe telefon. Tomek verifică prognoza meteo în fiecare dimineață. Apoi se duce să alerge. Kasia îi trimite des mesaje Ewei. Folosești și tu telefonul în fiecare zi?
    note: Compară obiceiurile celor patru personaje legate de dispozitive, la fel ca textul comparativ din unitatea despre sport.
    glosses:
      dzwoni: sună
      każdego: fiecare
      dnia: zi
      używa: folosește
      telefonu: telefon
      aplikacji: aplicație
      komputera: computer
      domu: acasă
      internetu: internet
      sprawdza: verifică
      ranka: dimineață
      prognozę: prognoza meteo
      idzie: merge
      biegać: la alergat
      wysyła: trimite
      często: des
      wiadomość: mesaj
      używasz: folosești
  pl.a1.unit29.lesson05.teach.tomek_kazdego_ranka:
    title: Tomek verifică prognoza în fiecare dimineață
    gloss: Tomek verifică prognoza meteo în fiecare dimineață.
  pl.a1.unit29.lesson05.teach.kasia_czesto_wysyla:
    title: Kasia îi scrie des Ewei
    gloss: Kasia îi trimite des Ewei mesaje.
  pl.a1.unit29.lesson06.teach.ewa_widze_wiadomosc:
    title: Ewa confirmă planul
    gloss: 'Ewa: Am văzut mesajul. Facem mișcare sâmbătă la zece în parc?'
  pl.a1.unit29.lesson06.teach.marek_tak_a:
    title: Marek confirmă vremea
    gloss: 'Marek: Da, și sâmbătă e senin!'
  pl.a1.unit29.lesson06.teach.tomek_wtedy_pobiegam:
    title: Planul lui Tomek
    gloss: 'Tomek: Atunci voi alerga. Apoi voi juca și fotbal.'
    note: '*Wtedy* („atunci”) și *potem* („apoi”) marchează ordinea evenimentelor; *pobiegam* și *zagram* sunt perfective, de aceea sună a planuri.'
  pl.a1.unit29.lesson06.teach.kasia_wole_plywac:
    title: Planul Kasiei
    gloss: 'Kasia: Prefer să înot, dar vin și eu în parc.'
    note: '*Wolę* înseamnă „prefer” și este urmat de infinitiv: *wolę pływać*.'
  pl.a1.unit29.lesson06.teach.ewa_super_do:
    title: Ewa încheie conversația
    gloss: 'Ewa: Super! Ne vedem sâmbătă în parc!'
    note: Încheie într-o singură replică atât firul de mesaje din această unitate, cât și planul din unitatea despre sport.
