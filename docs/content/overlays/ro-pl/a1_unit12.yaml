teaching:
  pl.a1.unit12.lesson01.teach.wczoraj:
    title: Ieri
    gloss: ieri
    note: Cuvântul de bază pentru a vorbi despre o zi recentă, încheiată -- se potrivește firesc cu formele de trecut din această unitate.
    example_gloss: Ieri am fost la cinema.
  pl.a1.unit12.lesson01.teach.co_bylo_wczoraj:
    title: Ce s-a întâmplat ieri?
    gloss: Ce s-a întâmplat ieri?
    note: Modul firesc de a ruga pe cineva să povestească un eveniment recent -- było nu se schimbă după cine răspunde, deci întrebarea merge oricui i-ai pune-o.
  pl.a1.unit12.lesson01.teach.bylo_note:
    title: Było
    gloss: 'Było este forma de trecut pentru „el/ea” (neutru) a verbului być (a fi) -- se acordă cu co (ce), deci se folosește când întrebăm în general ce s-a întâmplat: Co było wczoraj? Același cuvânt, indiferent cine răspunde.'
    note: '*Było* este forma de neutru „a fost” -- se acordă cu *co* (ce), nu cu persoana întrebată, deci într-o întrebare deschisă precum *Co było wczoraj?* se traduce „ce s-a întâmplat”.'
  pl.a1.unit12.lesson01.teach.bylem_bylam:
    title: Eu am fost (bărbat / femeie)
    gloss: eu am fost (spune un bărbat) / eu am fost (spune o femeie)
    note: 'Trecutul polonez marchează genul vorbitorului: byłem dacă vorbește un bărbat, byłam dacă vorbește o femeie. Ambele înseamnă „eu am fost”.'
    example_gloss:
    - Ieri am fost la cinema.
    - Ieri am fost la cinema.
  pl.a1.unit12.lesson01.teach.gender_past_note:
    title: 'Trecutul: -em față de -am'
    gloss: 'Verbele la trecut se termină diferit după genul vorbitorului: -em când vorbește un bărbat (byłem), -am când vorbește o femeie (byłam). Asta se aplică fiecărui verb la trecut, nu doar lui być.'
    note: 'Fii atent la ultimele litere: *-em* arată că vorbește un bărbat, *-am* că vorbește o femeie. Vei vedea același tipar la fiecare verb de trecut din această unitate.'
  pl.a1.unit12.lesson01.teach.w_kinie_locative_note:
    title: La cinema
    gloss: 'Kino își schimbă terminația după w: idę do kina (încotro?) folosește o altă formă decât jestem w kinie (unde?). W kinie este locativul -- spune UNDE se petrece ceva, nu încotro merge cineva.'
    note: 'Două terminații diferite, două întrebări diferite: *do kina* răspunde la „încotro?” (ai învățat asta în unitatea despre planuri), iar *w kinie* răspunde la „unde?” -- nu le confunda.'
  pl.a1.unit12.lesson01.teach.bylem_w_kinie:
    title: Ieri am fost la cinema (bărbat)
    gloss: Ieri am fost la cinema.
    note: Îmbină byłem, wczoraj și w kinie -- așa spune un bărbat unde a fost.
  pl.a1.unit12.lesson01.teach.bylam_w_kinie:
    title: Ieri am fost la cinema (femeie)
    gloss: Ieri am fost la cinema.
    note: Aceeași propoziție cu byłam -- așa spune o femeie unde a fost.
  pl.a1.unit12.lesson02.teach.film:
    title: Film
    gloss: film
    note: Un cuvânt de zi cu zi pentru ce ai vizionat -- apare mereu când povestești o ieșire la cinema.
    example_gloss: Am văzut un film bun.
  pl.a1.unit12.lesson02.teach.dobry:
    title: Bun
    gloss: bun
    note: 'Ai întâlnit dobry în dzień dobry (bună ziua) -- aici este folosit singur, ca adjectiv obișnuit: „bun”.'
    example_gloss: Un film foarte bun!
  pl.a1.unit12.lesson02.teach.zobaczylem_zobaczylam:
    title: Eu am văzut (bărbat / femeie)
    gloss: eu am văzut (spune un bărbat) / eu am văzut (spune o femeie)
    note: Zobaczyć descrie un singur act încheiat de a vedea (spre deosebire de widzieć, a vedea în desfășurare) -- zobaczyłem dacă vorbește un bărbat, zobaczyłam dacă vorbește o femeie, același tipar -em/-am ca la byłem/byłam.
    example_gloss:
    - Am văzut un film bun.
    - Am văzut un film bun.
  pl.a1.unit12.lesson02.teach.zobaczyc_pattern_note:
    title: Același tipar ca byłem/byłam
    gloss: 'Același tipar ca byłem/byłam: zobaczyłem spune un bărbat, zobaczyłam o femeie. Zobaczyć este un verb perfectiv -- descrie un eveniment încheiat.'
    note: 'Aceeași terminație, alt verb: *zobaczyłem/zobaczyłam* urmează exact tiparul pe care tocmai l-ai învățat la *byłem/byłam*.'
  pl.a1.unit12.lesson02.teach.zrobilem_zrobilam:
    title: Eu am făcut (bărbat / femeie)
    gloss: eu am făcut (spune un bărbat) / eu am făcut (spune o femeie)
    note: Zrobić acoperă atât „a face” cât și „a realiza” pentru o acțiune singulară, încheiată -- zrobiłem pentru un bărbat, zrobiłam pentru o femeie, același tipar din nou.
    example_gloss:
    - Am făcut prânzul.
    - Am făcut prânzul.
  pl.a1.unit12.lesson02.teach.obiad:
    title: Prânz
    gloss: prânz / masa de la mijlocul zilei
    note: Poate îți amintești obiad din unitatea despre rutină -- aici este masa principală a zilei, pe care o pregătește Marek.
    example_gloss: Acesta este un prânz delicios.
  pl.a1.unit12.lesson02.teach.pyszny:
    title: Gustos
    gloss: gustos / delicios
    note: O modalitate caldă și cotidiană de a lăuda mâncarea; apare firesc imediat după obiad.
    example_gloss: Acesta este un prânz delicios.
  pl.a1.unit12.lesson03.teach.jaki:
    title: Ce fel de / care
    gloss: ce fel de / care
    note: 'Ai mai întâlnit jaki când ai întrebat despre numere de telefon și zilele săptămânii; aici se folosește la fel, pentru a cere un detaliu precis: ce film?'
    example_gloss: Ce film este acesta?
  pl.a1.unit12.lesson03.teach.elliptical_note:
    title: Întrebări scurte dintr-un singur cuvânt
    gloss: În conversație poți pune o întrebare scurtă, dintr-un singur cuvânt, de exemplu Pyszny? în loc de întrebarea completă Czy obiad był pyszny? -- sună firesc și rapid, ca în vorbirea de zi cu zi.
    note: În conversația reală se renunță la propoziția completă când contextul e clar -- *Pyszny?* spus singur înseamnă „A fost gustos?”
  pl.a1.unit12.lesson03.teach.dialogue.line01:
    title: Marek întreabă ce s-a întâmplat
    gloss: Salut, Ewa! Ce s-a întâmplat ieri?
    note: Reia prima întrebare învățată în această unitate, acum la începutul unei conversații reale.
  pl.a1.unit12.lesson03.teach.dialogue.line02:
    title: Ewa a fost la cinema
    gloss: Am fost la cinema! Am văzut un film bun.
    note: Byłam (feminin) și zobaczyłam (feminin) arată că vorbitoarea este Ewa.
  pl.a1.unit12.lesson03.teach.dialogue.line03:
    title: Marek întreabă ce film
    gloss: Ce film?
    note: O întrebare scurtă și firească de continuare, cu jaki.
  pl.a1.unit12.lesson03.teach.dialogue.line04:
    title: Ewa răspunde și întreabă la rândul ei
    gloss: Foarte bun! Și tu?
    note: A ty? (și tu?) dă cuvântul înapoi lui Marek, fără nicio gramatică nouă.
  pl.a1.unit12.lesson03.teach.dialogue.line05:
    title: Marek a făcut prânzul
    gloss: Am făcut prânzul!
    note: Zrobiłem (masculin) arată că vorbitorul este Marek -- propriul lui eveniment încheiat al zilei.
  pl.a1.unit12.lesson03.teach.dialogue.line06:
    title: Ewa întreabă dacă a fost gustos
    gloss: Gustos?
    note: O întrebare dintr-un singur cuvânt, exact modelul din nota de gramatică a acestei lecții.
