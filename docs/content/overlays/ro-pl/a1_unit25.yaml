answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Poloneză A1
  description: 'Poloneză pentru începători: descrierea aspectului fizic de bază al unei persoane — impresii despre înălțime și vârstă, culoarea părului și a ochilor, întrebarea de bază Jak wygląda ...? și compararea aspectului a două persoane.'
units:
  pl.a1.unit25.wyglad:
    title: Descrierea înfățișării
lessons:
  pl.a1.unit25.lesson01.wysoki_niski_stary_i:
    title: Înalt, scund, bătrân și tânăr
  pl.a1.unit25.lesson02.opisywanie_wlosow:
    title: Descrierea părului
  pl.a1.unit25.lesson03.oczy_i_jak_ktos:
    title: Ochii și cum arată cineva?
  pl.a1.unit25.lesson04.ewa_opisuje_nine:
    title: Ewa o descrie pe Nina
  pl.a1.unit25.lesson05.porownanie_tomka_i_kasi:
    title: Comparându-i pe Tomek și Kasia
  pl.a1.unit25.lesson06.marek_rozpoznaje_nine:
    title: Marek o recunoaște pe Nina
teaching:
  pl.a1.unit25.lesson01.teach.wysoki_niski:
    title: Înalt și scund
    gloss: înalt / scund
    note: '*Wysoki* descrie o persoană înaltă, iar *niski* una scundă. O femeie este *wysoka* sau *niska*.'
    example_gloss:
    - Kasia este înaltă.
    - Tomek este scund.
  pl.a1.unit25.lesson01.teach.stary_mlody:
    title: Bătrân și tânăr
    gloss: bătrân / tânăr
    note: Aici *stary* și *młody* descriu o impresie generală, nu un număr exact de ani.
    example_gloss:
    - Bunicul este bătrân.
    - Marek este tânăr.
  pl.a1.unit25.lesson01.teach.dziadek_jest_stary:
    title: 'Stary: impresie sau vârstă'
    gloss: '*Stary* descrie o impresie generală, ca în *Dziadek jest stary*. Pentru a spune vârsta exactă, poloneza folosește o altă structură: *Ile masz lat?*'
    note: Cât de în vârstă pare cineva descrii cu *stary* sau *młody*; pentru vârsta exactă întrebi *Ile masz lat?* și răspunzi cu *mam ... lat* (am ... ani).
  pl.a1.unit25.lesson01.teach.kasia_jest_wysoka:
    title: Kasia este înaltă, iar Tomek este scund
    gloss: Kasia este înaltă, iar Tomek este scund.
    note: O propoziție simplă, legată prin *a* (iar, cu valoare de contrast). *Wysoka* și *niski* se acordă cu un subiect feminin și, respectiv, unul masculin, pregătind comparația din lecția 5.
  pl.a1.unit25.lesson02.teach.wlosy:
    title: Părul
    gloss: părul
    note: '*Włosy* este mereu la plural în poloneză: *długie włosy* (păr lung).'
    example_gloss: Marek are păr scurt și negru.
  pl.a1.unit25.lesson02.teach.blond_brazowe_siwe:
    title: Blond, șaten și cărunt
    gloss: blond / șaten / cărunt
    note: Trei culori de păr. *Blond* nu se schimbă; *brązowe* și *siwe* sunt forme de plural care se acordă cu *włosy*.
    example_gloss:
    - Ewa are păr blond.
    - Tomek are păr șaten.
    - Bunicul are părul cărunt.
  pl.a1.unit25.lesson02.teach.dlugie_krotkie:
    title: Lung și scurt (părul)
    gloss: lung / scurt (părul)
    note: '*Długie* (lung) și *krótkie* (scurt) sunt forme de plural care se acordă cu *włosy*.'
    example_gloss:
    - Kasia are păr lung.
    - Tomek are păr scurt.
  pl.a1.unit25.lesson02.teach.wlosy_sa_w:
    title: Włosy cere adjectiv la plural
    gloss: '*Włosy* este la plural, deci și adjectivul este la plural: păr lung, păr scurt, păr șaten, păr negru.'
    note: 'Substantivele la plural care nu sunt masculine personale primesc adjective terminate în *-e*: *długie włosy*. *Blond* este excepția: nu se schimbă (*blond włosy*).'
  pl.a1.unit25.lesson02.teach.wlosy_maja_tylko:
    title: 'Włosy: mereu la plural'
    gloss: '*Włosy* (părul) este mereu la plural: *jej włosy są długie* (părul ei este lung, literal „părurile ei sunt lungi”). *Jej* înseamnă „al ei”.'
    note: În poloneză „părul” este un substantiv la plural, așa că verbele și adjectivele se acordă la plural. *Jej* („al ei”) nu se schimbă, indiferent câte lucruri îi aparțin.
  pl.a1.unit25.lesson02.teach.marek_ma_krotkie:
    title: Marek are păr scurt și negru
    gloss: Marek are păr scurt și negru.
    note: '*Czarne* (negru) este forma de plural care se acordă cu *włosy*.'
  pl.a1.unit25.lesson02.teach.ewa_ma_dlugie:
    title: Ewa are păr lung și blond
    gloss: Ewa are păr lung și blond.
    note: Combină într-o propoziție naturală vocabularul lecției despre lungime și culoare.
  pl.a1.unit25.lesson03.teach.oczy:
    title: Ochii
    gloss: ochii
    note: '*Oczy* este pluralul lui *oko*; în poloneză, de obicei se vorbește despre ambii ochi la plural.'
    example_gloss: Marek are ochi căprui.
  pl.a1.unit25.lesson03.teach.niebieski_brazowy_zielony:
    title: Albastru, căprui și verde
    gloss: albastru / căprui / verde
    note: 'Trei culori de ochi, la plural pentru a se acorda cu *oczy*: *niebieskie*, *brązowe*, *zielone*.'
    example_gloss:
    - Ewa are ochi albaștri.
    - Tomek are ochi căprui.
    - Kasia are ochi verzi.
  pl.a1.unit25.lesson03.teach.oczy_sa_w:
    title: Oczy cere terminația -e
    gloss: '*Oczy* este la plural, deci adjectivul se termină în *-e*: ochi albaștri, ochi căprui, ochi verzi.'
    note: 'Aceeași terminație de plural ca la *włosy* în lecția 2: *niebieskie oczy*, *brązowe oczy*, *zielone oczy*.'
  pl.a1.unit25.lesson03.teach.jak_wyglada_ewa:
    title: Cum arată Ewa?
    gloss: Cum arată Ewa?
    note: '*Jak wygląda ...?* este întrebarea de bază a acestei unități; o poți folosi pentru a întreba cum arată oricine.'
  pl.a1.unit25.lesson03.teach.ewa_ma_dlugie:
    title: Ewa are părul lung și blond și ochi albaștri
    gloss: Ewa are părul lung și blond și ochi albaștri.
    note: Un răspuns model care îmbină părul și ochii într-o singură propoziție cu *i* (și).
  pl.a1.unit25.lesson04.teach.ewa_do_kawiarni:
    title: Ewa o prezintă pe Nina
    gloss: 'Ewa: La cafeneaua de limbi străine vine o fată nouă. O cheamă Nina.'
    note: '*Przychodzi* (vine) introduce în scenă pe cineva nou; *do kawiarni językowej* folosește *do* + genitiv.'
  pl.a1.unit25.lesson04.teach.marek_okej_jak:
    title: Marek întreabă cum arată ea
    gloss: 'Marek: Bine! Cum arată?'
    note: Reia întrebarea de bază a unității, acum cu *ona* (ea) în loc de un nume.
  pl.a1.unit25.lesson04.teach.ewa_jest_niska:
    title: Ewa descrie înălțimea și părul Ninei
    gloss: 'Ewa: E scundă și are părul scurt și blond.'
    note: Îmbină *niska* (feminin de la *niski*) din lecția 1 cu vocabularul pentru păr din lecția 2.
  pl.a1.unit25.lesson04.teach.marek_a_jej:
    title: Marek întreabă despre ochii ei
    gloss: 'Marek: Și ochii ei?'
    note: '*Jej* este aici posesivul „ei”, deci *jej oczy* înseamnă „ochii ei”; *jej* nu se schimbă niciodată.'
  pl.a1.unit25.lesson04.teach.ewa_ma_zielone:
    title: Ewa descrie ochii Ninei
    gloss: 'Ewa: Are ochi verzi.'
    note: Reia *zielone oczy* din lecția 3.
  pl.a1.unit25.lesson04.teach.marek_dzieki_wtedy:
    title: Marek o va recunoaște
    gloss: 'Marek: Mulțumesc! Atunci o voi recunoaște.'
    note: '*Rozpoznam* este viitorul perfectiv („voi recunoaște”); *ją* este acuzativul lui *ona* („o”).'
  pl.a1.unit25.lesson05.teach.tomek_i_kasia:
    title: Comparație între Tomek și Kasia
    gloss: Tomek și Kasia sunt frate și soră, dar arată diferit. Tomek este scund, are părul scurt și șaten și ochi căprui. Kasia este mai înaltă decât Tomek și are părul lung și șaten și ochi verzi. Tu cum arăți?
    note: O scurtă comparație care reia toate cuvintele pentru culori și lungime învățate până acum și se încheie cu întrebarea centrală a unității, adresată cititorului.
    glosses:
      brat: frate
      siostra: soră
      wyglądają: a arăta
      inaczej: diferit
      niski: scund
      krótkie: scund
      brązowe: castaniu
      włosy: păr
      oczy: ochi
      wyższa: mai înalt
      długie: lung
      zielone: verde
      wyglądasz: arăți (tu), în sensul de cum arată cineva
  pl.a1.unit25.lesson05.teach.stopien_wyzszy_wysoki:
    title: Refolosirea comparativului
    gloss: 'Comparativul: *wysoki* (înalt) devine *wyższy* (mai înalt), iar a doua persoană comparată vine după *niż* (decât): Kasia este mai înaltă decât Tomek.'
    note: 'În poloneză comparativul se formează schimbând terminația adjectivului, iar acesta se acordă în continuare în gen: *wyższa* pentru Kasia (feminin).'
  pl.a1.unit25.lesson05.teach.kasia_ma_dluzsze:
    title: Kasia are părul mai lung decât Tomek
    gloss: Kasia are părul mai lung decât Tomek.
    note: '*Dłuższe* (mai lung) este la plural, ca să se acorde cu *włosy*, iar *niż* (decât) introduce comparația.'
  pl.a1.unit25.lesson05.teach.mam_krotkie_brazowe:
    title: Am părul scurt și castaniu
    gloss: Am părul scurt și castaniu.
    note: O propoziție model la persoana I cu *Mam ...*, utilă când te descrii pe tine.
  pl.a1.unit25.lesson06.teach.marek_patrz_czy:
    title: Marek o zărește pe Nina
    gloss: 'Marek: Uite, aceea e Nina? Are părul scurt și blond și ochi verzi.'
    note: '*Patrz* (uite) este imperativul lui *patrzeć*. *Czy to Nina?* înseamnă „aceea e Nina?”.'
  pl.a1.unit25.lesson06.teach.ewa_tak_to:
    title: Ewa confirmă
    gloss: 'Ewa: Da, e Nina!'
    note: O confirmare scurtă și naturală.
  pl.a1.unit25.lesson06.teach.nina_czesc_jestes:
    title: Nina îl salută pe Marek
    gloss: 'Nina: Salut, tu ești Marek?'
    note: 'O întrebare simplă de salut informal. După *być*, un nume se pune la instrumental: *jesteś Markiem?*'
  pl.a1.unit25.lesson06.teach.marek_tak_milo:
    title: Marek o salută la rândul lui pe Nina
    gloss: 'Marek: Da! Îmi pare bine să te cunosc, Nina.'
    note: '*Miło cię poznać* este formula obișnuită la prima întâlnire („îmi pare bine să te cunosc”; *poznać* înseamnă „a cunoaște pe cineva”). Nina este la vocativ: *Nino*.'
  pl.a1.unit25.lesson06.teach.nina_ciebie_tez:
    title: Nina răspunde la salut
    gloss: 'Nina: Și mie îmi pare bine!'
    note: 'Încheie dialogul: Marek a recunoscut-o pe Nina după descrierea făcută mai devreme de Ewa.'
