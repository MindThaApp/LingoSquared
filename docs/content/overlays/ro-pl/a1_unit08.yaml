teaching:
  pl.a1.unit08.lesson01.teach.bank_poczta:
    title: Bancă, poștă
    gloss: bancă; poștă
    note: 'Două treburi obișnuite de zi cu zi: bank seamănă cu cuvântul românesc, iar poczta este locul unde mergi să trimiți o scrisoare sau un colet.'
    example_gloss:
    - Aceasta este o bancă.
    - Aceasta este o poștă.
  pl.a1.unit08.lesson01.teach.apteka_restauracja:
    title: Farmacie, restaurant
    gloss: farmacie; restaurant
    note: Apteka este locul unde cumperi medicamente (nu un magazin general); restauracja seamănă mult cu cuvântul „restaurant”.
    example_gloss:
    - Aceasta este o farmacie.
    - Acesta este un restaurant.
  pl.a1.unit08.lesson01.teach.hotel_park:
    title: Hotel, park
    gloss: hotel; parc
    note: Ambele seamănă cu cuvintele românești, deci sunt ușor de recunoscut în scris și în vorbire.
    example_gloss:
    - Acesta este un hotel.
    - Acesta este un parc.
  pl.a1.unit08.lesson01.teach.gdzie_jest_note:
    title: Unde este + [loc]?
    gloss: 'Unde este + [loc]? Gdzie („unde”) plus jest („este”) întreabă despre locul în care se află ceva: Unde este banca? Unde este farmacia?'
    note: '*Gdzie* înseamnă „unde”, iar *jest* înseamnă „este”. Împreună, *Gdzie jest...?* este structura obișnuită pentru a întreba unde se află un loc. Folosește-o ca atare când întrebi despre un singur loc; pentru mai multe locuri, polona folosește *są* („sunt”).'
  pl.a1.unit08.lesson01.teach.gdzie_jest_bank:
    title: Unde este banca?
    gloss: Unde este banca?
    note: Structura din nota de gramatică, folosită cu primul cuvânt pentru un loc din această lecție.
  pl.a1.unit08.lesson02.teach.blisko_daleko:
    title: Aproape, departe
    gloss: aproape; departe
    note: O pereche simplă de contrarii, folosită direct după jest pentru a spune cât de aproape sau de departe se află un loc.
    example_gloss:
    - Parcul este aproape.
    - Hotelul este departe.
  pl.a1.unit08.lesson02.teach.niedaleko:
    title: Nu departe
    gloss: nu departe
    note: Literal *nie* (nu) plus *daleko* (departe), contopite într-un singur cuvânt. Este o modalitate mai blândă și foarte des folosită de a liniști pe cineva că locul este ușor de ajuns.
    example_gloss: Farmacia nu este departe.
  pl.a1.unit08.lesson02.teach.obok_naprzeciwko:
    title: Lângă, vizavi de
    gloss: lângă; vizavi de
    note: Ambele cuvinte arată poziția unui loc față de un punct de reper, nu doar cât de aproape este. Ambele cer ca substantivul următor să fie la genitiv; vezi nota de gramatică a acestei lecții.
    example_gloss:
    - Farmacia este lângă bancă.
    - Restaurantul este vizavi de hotel.
  pl.a1.unit08.lesson02.teach.genitive_note:
    title: 'După „obok”/„naprzeciwko”/„blisko + substantiv”: genitivul'
    gloss: 'După „lângă”/„vizavi de”/„aproape de + un loc”: genitiv – bank -> al băncii, hotel -> al hotelului, park -> al parcului. Farmacia este lângă bancă. Restaurantul este vizavi de hotel. Restaurantul este aproape de parc.'
    note: '*Obok*, *naprzeciwko* și *blisko* (când este urmat de un loc, nu când stă singur) cer genitivul, deci substantivul următor își schimbă terminația. Pentru aceste trei substantive masculine regulate, se adaugă *-u*: *bank* devine *banku*, *hotel* devine *hotelu*, *park* devine *parku*. Folosit singur, *blisko* nu cere deloc genitiv: *To jest blisko* („Este aproape”) este la fel de corect ca *blisko parku* („aproape de parc”).'
  pl.a1.unit08.lesson02.teach.apteka_obok_banku:
    title: Farmacia este lângă bancă
    gloss: Farmacia este lângă bancă.
    note: 'Aplică în o propoziție reală modelul cu -u din nota de gramatică: bank devine banku după obok.'
  pl.a1.unit08.lesson03.teach.przepraszam:
    title: Scuzați-mă
    gloss: scuzați-mă / scuze
    note: Modul obișnuit de a atrage atenția unui necunoscut înainte de a pune o întrebare; se spune înaintea întrebării, nu după ea.
    example_gloss: Scuzați-mă, unde este banca?
  pl.a1.unit08.lesson03.teach.dialogue.line01:
    title: Ewa întreabă de farmacie
    gloss: Ewa spune „scuzați-mă” și întreabă unde este farmacia.
    note: Przepraszam deschide întrebarea, așa cum arată nota de vocabular a acestei lecții; chiar și cu cineva cunoscut, ca Marek, este modul politicos de a întrerupe înainte de a întreba ceva.
  pl.a1.unit08.lesson03.teach.dialogue.line02:
    title: Marek spune unde este farmacia
    gloss: Marek spune că farmacia nu este departe, lângă bancă.
    note: Combină niedaleko și obok + banku, ambele din nota de gramatică a lecției 2.
  pl.a1.unit08.lesson03.teach.dialogue.line03:
    title: Ewa îi mulțumește lui Marek și întreabă de restaurant
    gloss: Ewa spune mulțumesc și întreabă unde este restaurantul.
    note: Dziękuję, reluat din unitățile anterioare; A („și”) leagă noua întrebare de cea de dinainte.
  pl.a1.unit08.lesson03.teach.dialogue.line04:
    title: Marek spune unde este restaurantul
    gloss: Marek spune că restaurantul este vizavi de hotel, aproape de parc.
    note: Naprzeciwko + hotelu (genitiv, același model ca banku) plus blisko pentru un al doilea punct de reper.
  pl.a1.unit08.lesson03.teach.dialogue.line05:
    title: Ewa îi mulțumește din nou lui Marek
    gloss: Ewa spune mulțumesc mult.
    note: Bardzo („mult”) întărește dziękuję, la fel ca în proszę bardzo.
  pl.a1.unit08.lesson03.teach.dialogue.line06:
    title: Marek răspunde
    gloss: Marek spune „cu plăcere”.
    note: Proszę bardzo, răspunsul obișnuit la mulțumiri, reluat din unitatea despre cumpărături.
