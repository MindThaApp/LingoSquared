  pl.a1.unit24.lesson01.czytanie_sport_i_gotowanie:
    title: Citit, sport și gătit
  pl.a1.unit24.lesson02.muzyka_rysowanie_i_gry:
    title: Muzică, desen și jocuri video
  pl.a1.unit24.lesson03.co_robisz_w_wolnym:
    title: Ce faci în timpul liber?
  pl.a1.unit24.lesson04.ewa_i_marek_rozmawiaja:
    title: Ewa și Marek vorbesc despre hobby-uri
  pl.a1.unit24.lesson05.marek_i_ewa_porownuja:
    title: Marek și Ewa își compară hobby-urile
  pl.a1.unit24.lesson06.wspolne_planowanie_weekendu:
    title: Planuri pentru un weekend împreună
teaching:
  pl.a1.unit24.lesson01.teach.czytac_uprawiac_sport:
    title: Citit, sport, gătit
    gloss: a citi, a face sport, a găti
    note: 'Trei verbe frecvente pentru hobby-uri: *czytać* (a citi), *uprawiać sport* (a face sport) și *gotować* (a găti).'
    example_gloss:
    - Îmi place să citesc o carte.
    - Fac sport sâmbăta.
    - Îmi place să gătesc pentru prieteni.
  pl.a1.unit24.lesson01.teach.wolny_czas:
    title: Timpul liber
    gloss: timpul liber
    note: '*Wolny czas* este expresia-cheie pentru a vorbi despre hobby-uri. Adjectivul *wolny* („liber”) se acordă cu substantivul masculin *czas*; în *w wolnym czasie* ambele sunt la locativ.'
    example_gloss: În timpul liber, îmi place să citesc.
  pl.a1.unit24.lesson01.teach.w_wolnym_czasie:
    title: Spui ce faci în timpul liber
    gloss: În timpul liber, îmi place să citesc.
    note: 'După *lubię* („îmi place”) urmează un infinitiv: *lubię czytać*. *W wolnym czasie* se formează cu *w* + locativ.'
  pl.a1.unit24.lesson02.teach.sluchac_muzyki_rysowac:
    title: Muzică, desen, jocuri video
    gloss: a asculta muzică, a desena, a juca jocuri video
    note: 'Încă trei hobby-uri: *słuchać muzyki* (a asculta muzică), *rysować* (a desena) și *grać w gry* (a juca jocuri).'
    example_gloss:
    - Îmi place să ascult muzică.
    - Desenez des.
    - Îmi place să joc jocuri video cu prietenii.
  pl.a1.unit24.lesson02.teach.lubie_sluchac_muzyki:
    title: Spui că îți place să asculți muzică
    gloss: Îmi place să ascult muzică.
    note: '*Słuchać* cere întotdeauna genitivul: *słucham muzyki*, nu *muzyka*.'
  pl.a1.unit24.lesson02.teach.lubie_grac_w:
    title: Spui că îți place să joci jocuri video cu prietenii
    gloss: Îmi place să joc jocuri video cu prietenii.
    note: '*Z przyjaciółmi* („cu prietenii”) se formează cu *z* + instrumental plural.'
  pl.a1.unit24.lesson03.teach.zawsze_czesto_czasami:
    title: Mereu, des, uneori, niciodată
    gloss: mereu, des, uneori, niciodată
    note: 'Cele patru adverbe de frecvență de bază: *zawsze*, *często*, *czasami*, *nigdy*. Ele nu se schimbă niciodată, iar *nigdy* cere *nie* înaintea verbului: *Nigdy nie gram.*'
    example_gloss:
    - Fac mereu sport sâmbăta.
    - Citesc des o carte.
    - Desenez uneori.
    - Nu joc niciodată jocuri video.
  pl.a1.unit24.lesson03.teach.co_tydzien_co:
    title: În fiecare săptămână, în fiecare weekend
    gloss: în fiecare săptămână, în fiecare weekend
    note: '*Co tydzień* și *co weekend* înseamnă amândouă „în fiecare ...”; după *co* urmează acuzativul, iar co nu se schimbă – vezi cardul următor.'
    example_gloss:
    - Gătesc pentru prieteni în fiecare săptămână.
    - Fac sport în fiecare weekend.
  pl.a1.unit24.lesson03.teach.co_biernik_co:
    title: Co + acuzativ
    gloss: '*Co* + acuzativ înseamnă „în fiecare”: în fiecare săptămână, în fiecare weekend, în fiecare lună.'
    note: '*Co* este un cuvânt invariabil pentru „în fiecare”, indiferent de substantiv. Substantivele masculine neanimate precum *tydzień*, *weekend* și *miesiąc* arată la fel la nominativ și la acuzativ.'
  pl.a1.unit24.lesson03.teach.co_robisz_w:
    title: Întrebi despre timpul liber
    gloss: Ce faci în timpul liber?
    note: Aceasta este întrebarea de bază a unității -- folosește-o ca să întrebi pe oricine despre hobby-uri.
  pl.a1.unit24.lesson04.teach.ewa_czesto_razem:
    title: Ewa aduce vorba despre hobby-uri
    gloss: 'Ewa: Ne plimbăm des împreună. Dar ce mai faci în timpul liber, Marek?'
    note: '*Spacerujemy* este forma de persoana I plural (*my*) a verbului *spacerować*; *Marku* este vocativul, folosit când te adresezi direct cuiva.'
  pl.a1.unit24.lesson04.teach.marek_lubie_gotowac:
    title: Hobby-urile lui Marek
    gloss: 'Marek: Îmi place să gătesc, și acasă. Și fac des sport.'
    note: '*Także w domu* („și acasă”) arată că Marek gătește și din plăcere, nu doar la locul de muncă din restaurant; *w domu* este la locativ.'
  pl.a1.unit24.lesson04.teach.ewa_gotujesz_tez:
    title: Ewa este surprinsă
    gloss: 'Ewa: Gătești și acasă? Doar gătești toată ziua la muncă!'
    note: '*Cały dzień* („toată ziua”) subliniază cât gătește Marek deja la serviciu; *przecież* adaugă nuanța „doar”, „totuși”.'
  pl.a1.unit24.lesson04.teach.marek_tak_ale:
    title: Marek explică
    gloss: 'Marek: Da, dar gătitul mă relaxează. Și tu, ce îți place să faci?'
    note: '*Gotowanie mnie odpręża* înseamnă literal „gătitul mă relaxează”: în poloneză activitatea devine adesea subiectul propoziției, iar *mnie* („pe mine”) stă la acuzativ.'
  pl.a1.unit24.lesson04.teach.ewa_lubie_czytac:
    title: Hobby-urile Ewei
    gloss: 'Ewa: Îmi place să citesc și ascult des muzică.'
    note: Combină într-o singură propoziție, cu *i* („și”), două verbe de hobby din lecțiile 1 și 2.
  pl.a1.unit24.lesson04.teach.marek_grasz_tez:
    title: Marek întreabă despre jocuri
    gloss: 'Marek: Joci și tu jocuri?'
    note: O întrebare scurtă cu da/nu, cu *grać w gry* din lecția 2; *też* înseamnă „și”, „de asemenea”.
  pl.a1.unit24.lesson04.teach.ewa_nie_nigdy:
    title: Ewa răspunde
    gloss: 'Ewa: Nu, nu joc niciodată jocuri. Dar uneori desenez!'
    note: '*Nigdy* („niciodată”) și *czasami* („uneori”) din lecția 3, puse în contrast într-un singur răspuns. Observă dubla negație: *nigdy nie gram*; și româna o are: „nu joc niciodată”.'
  pl.a1.unit24.lesson05.teach.marek_i_ja:
    title: Comparăm hobby-urile
    gloss: Marek și cu mine ne plimbăm des împreună. Dar avem și alte hobby-uri. Lui Marek îi place să gătească, și acasă, și face des sport. Mie îmi place să citesc și ascult des muzică. Uneori desenez, dar nu joc niciodată jocuri video. Ție ce îți place să faci în timpul liber?
    note: Mesajul Ewei reia faptele din lecția 4 și se încheie cu întrebarea centrală a unității, adresată cititorului.
    glosses:
      spacerujemy: a se plimba
      często: des
      razem: împreună
      inne: alte
      gotować: gătește
      lubi: cu plăcere
      domu: acasă
      uprawia: face sport
      czytać: citesc
      słucham: ascult
      muzyki: muzică
      rysuję: desenez
      czasami: uneori
      gram: joc jocuri video
      nigdy: niciodată
      wolnym: liber
      czasie: timp
  pl.a1.unit24.lesson06.teach.marek_co_robisz:
    title: Marek întreabă despre weekend
    gloss: 'Marek: Ce faci în weekendul acesta?'
    note: '*W ten weekend* („în weekendul acesta”) se formează cu *w* + acuzativ pentru o expresie de timp.'
  pl.a1.unit24.lesson06.teach.ewa_jeszcze_nie:
    title: Ewa nu s-a hotărât
    gloss: 'Ewa: Încă nu știu. Îmi place să citesc, dar vreau și să ies afară.'
    note: '*Wyjść na dwór* („a ieși afară”) este o expresie obișnuită pentru a spune că vrei să ieși din casă; *chcę* + infinitiv înseamnă „vreau să”.'
  pl.a1.unit24.lesson06.teach.marek_pojdziemy_razem:
    title: Marek propune un plan
    gloss: 'Marek: Mergem împreună la plimbare? După aceea gătesc ceva pentru noi.'
    note: '*Potem* („după aceea”) este cuvântul care marchează succesiunea; *ugotuję* este perfectiv, pentru că gătitul este un rezultat încheiat.'
  pl.a1.unit24.lesson06.teach.ewa_dobry_pomysl:
    title: Ewa e de acord
    gloss: 'Ewa: Bună idee! Îmi place și să mă plimb, și să gătesc.'
    note: '*Lubię i ..., i ...* („și ..., și ...”) arată că Ewei îi plac în egală măsură două lucruri, nu unul mai mult decât celălalt.'
  pl.a1.unit24.lesson06.teach.marek_swietnie_to:
    title: Marek confirmă
    gloss: 'Marek: Super. Atunci ne vedem sâmbătă!'
    note: O replică prietenoasă de încheiere care confirmă planul pentru sâmbătă; *w sobotę* este *w* + acuzativ pentru o zi a săptămânii.
