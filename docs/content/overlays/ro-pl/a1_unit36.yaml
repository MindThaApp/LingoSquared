    title: Nina află despre toți
    gloss: Nina este nouă la cafeneaua de limbi. Îl întreabă pe Marek cum sunt ceilalți. Marek îi povestește. Ewa este amabilă și răbdătoare; lucrează ca asistentă medicală. Tomek este haios și urmează un curs de spaniolă. Kasia este curioasă; îi place să învețe lucruri noi. Marek însuși este calm.
    note: Recapitulează trăsăturile de personalitate ale membrilor grupului.
