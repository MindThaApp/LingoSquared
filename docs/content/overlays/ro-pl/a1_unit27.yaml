    note: '*Często* (des) este adverbul de frecvență și stă înaintea verbului: *Marek często gra w piłkę nożną.*'
  pl.a1.unit27.lesson03.teach.uprawiam_sport_tak:
    title: Uprawiać sport vs gram w
    gloss: '*Uprawiam sport* spune în general că faci sport. Un verb ca *gram w piłkę nożną* numește sportul concret. Ambele sunt corecte în poloneză.'
    note: '*Uprawiać sport* este verbul general din lecția despre hobby-uri; verbe precum *grać w* numesc sportul concret. Unul este general, celălalt concret.'
