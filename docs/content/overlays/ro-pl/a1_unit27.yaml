    title: Ewa și Kasia despre sport
    gloss: Ewa face yoga de două ori pe săptămână. Adoră mișcarea liniștită. Kasia nu face yoga, dar adoră să înoate. Kasia înoată des, aproape în fiecare săptămână. Ce sport practici tu?
    note: Pune în contrast două sporturi diferite și două expresii de frecvență diferite într-un text scurt.
    glosses:
      ćwiczy: face
      dwa: două
      razy: ori
      tygodniu: săptămână
      jogę: yoga
      uwielbia: iubește
      spokojny: liniștit
      ruch: mișcare
      pływać: înot
      pływa: înoată
      często: des
      prawie: aproape
      jaki: ce fel de
      sport: sport
