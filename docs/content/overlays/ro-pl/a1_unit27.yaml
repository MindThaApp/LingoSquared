    gloss: Ce sport practici?
  pl.a1.unit27.lesson01.teach.gram_w_pilke:
    title: Joc fotbal
    gloss: Joc fotbal.
    note: '*Gram w piłkę nożną* (literal „joc în fotbal”) folosește *grać w* + acuzativ; alte sporturi folosesc alte verbe. Vezi nota de gramatică.'
  pl.a1.unit27.lesson01.teach.kazdy_sport_ma:
    title: Un verb pentru fiecare sport
    gloss: 'Fiecare sport are propriul verb: *gram w piłkę nożną*, *biegam*, *pływam*, *ćwiczę jogę*.'
    note: O singură construcție acoperă toate sporturile -- la acest nivel nu trebuie să înveți un verb separat pentru fiecare sport.
  pl.a1.unit27.lesson02.teach.razy_w_tygodniu:
    title: Ori pe săptămână
    gloss: ori pe săptămână
    example_gloss: Fac yoga de două ori pe săptămână.
  pl.a1.unit27.lesson02.teach.dwa_razy_w:
    title: Razy w tygodniu
    gloss: Știi deja *codziennie* (în fiecare zi) și *często* (des). *Dwa razy w tygodniu* (de două ori pe săptămână) este o modalitate nouă, mai precisă, de a spune cât de des.
    note: Completează vocabularul de frecvență învățat deja în unitatea despre hobby-uri.
  pl.a1.unit27.lesson02.teach.dwa_razy_w_2:
    title: Fac yoga de două ori pe săptămână
