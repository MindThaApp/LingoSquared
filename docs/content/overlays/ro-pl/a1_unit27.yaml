  pl.a1.unit27.lesson06.teach.ewa_moze_pocwiczymy:
    title: Ewa propune
    gloss: 'Ewa: Facem sport împreună?'
  pl.a1.unit27.lesson06.teach.moze_pocwiczymy_razem:
