  pl.a1.unit27.lesson04.teach.biegac_biegam_biegasz:
    title: Biegać se schimbă după persoană
    gloss: '*Biegać* (a alerga) își schimbă terminația după persoană: *biegam* (alerg), *biegasz* (alergi), *biega* (aleargă).'
    note: 'În poloneză verbul are o terminație diferită pentru fiecare persoană, deci pronumele subiect se omite de obicei, ca și în română: *biegam*, *biegasz*, *biega*.'
  pl.a1.unit27.lesson04.teach.marek_fajnie_czesto:
