course:
  title: फ़्रेंच A1
  description: 'बाज़ार की शब्दावली; combien/kilo/litre से दाम और मात्रा पूछना; और मात्रा-सूचक शब्दों के बाद du/de la तथा सादे de का अंतर। Inès और Mathieu की रसोई-कार्यशाला की कहानी यहाँ बाज़ार में खरीदारी के दृश्य तक पहुँचती है। ध्यान रखने की बात: फ़्रेंच में स्पष्ट मात्रा के बाद अंशवाचक आर्टिकल पूरी तरह हट जाता है (un kilo de tomates, न कि un kilo des tomates)।'
