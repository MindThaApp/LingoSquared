teaching:
  fr.a1.unit04.lesson01.teach.marche:
    title: बाज़ार
    gloss: बाज़ार
    note: '*Marché* पुल्लिंग है।'
    example_gloss: बाज़ार शनिवार को खुला रहता है।
  fr.a1.unit04.lesson01.teach.boulangerie:
    title: बेकरी
    gloss: वह बेकरी
    note: '*Boulangerie* स्त्रीलिंग है; यह खास तौर पर ब्रेड की दुकान है, जो *pâtisserie* (पेस्ट्री की दुकान) से अलग होती है।'
    example_gloss: यहाँ पास में एक अच्छी बेकरी है।
  fr.a1.unit04.lesson01.teach.legumes:
    title: सब्ज़ियाँ
    gloss: सब्ज़ियाँ
    note: '*Légumes* पुल्लिंग बहुवचन है।'
    example_gloss: मैं कार्यशाला के लिए ताज़ी सब्ज़ियाँ खरीद रहा हूँ।
  fr.a1.unit04.lesson01.teach.fruits:
    title: फल
    gloss: फल
    note: '*Fruits* पुल्लिंग बहुवचन है। फ़्रेंच में "फल" कहने के लिए अक्सर बहुवचन (*les fruits*) ही इस्तेमाल होता है।'
    example_gloss: इस महीने फल महँगे हैं।
  fr.a1.unit04.lesson01.teach.prix:
    title: कीमत
    gloss: कीमत
    note: '*Prix* पुल्लिंग है और अपरिवर्तित रहता है — एकवचन और बहुवचन में इसकी वर्तनी एक ही रहती है।'
    example_gloss: ब्रेड की कीमत क्या है?
  fr.a1.unit04.lesson01.teach.cher:
    title: महँगा
    gloss: महँगा
    note: '*Cher* पुल्लिंग रूप है; *chère* स्त्रीलिंग है, और *chers*/*chères* बहुवचन हैं। यह उस संज्ञा के अनुसार बदलता है जिसका वर्णन करता है।'
    example_gloss: यह पनीर बहुत महँगा है।
  fr.a1.unit04.lesson01.teach.pas_cher:
    title: आज महँगे नहीं
    gloss: आज सब्ज़ियाँ महँगी नहीं हैं।
    note: '*Pas cher(s)* (*ne* छोड़कर) बोलचाल में किसी चीज़ को सस्ता बताने का आम तरीका है; पूरा लिखित रूप *ne sont pas chers* है।'
  fr.a1.unit04.lesson02.teach.un_kilo_de:
    title: एक किलो
    gloss: एक किलो
    note: '*De* मात्रा के तुरंत बाद आता है, बीच में कोई आर्टिकल नहीं आता — नीचे *de* वाला व्याकरण नोट देखें।'
    example_gloss: मुझे एक किलो टमाटर चाहिए।
  fr.a1.unit04.lesson02.teach.un_litre_de:
    title: एक लीटर
    gloss: एक लीटर
    note: '*Litre* पुल्लिंग है; तरल चीज़ों के लिए इसका वैसे ही उपयोग होता है जैसे ठोस चीज़ों के लिए *kilo* का।'
    example_gloss: एक लीटर दूध, कृपया।
  fr.a1.unit04.lesson02.teach.euro:
    title: एक यूरो
    gloss: एक यूरो
    note: '*Euro* का बहुवचन नियमित रूप से बनता है: *deux euros*, *cinq euros*।'
    example_gloss: इसकी कीमत पाँच यूरो है।
  fr.a1.unit04.lesson02.teach.de_after_quantity:
    title: मात्रा के बाद de
    gloss: का / की / के
    note: स्पष्ट मात्रा बताने वाले शब्द (*un kilo*, *un litre*, *beaucoup*, जैसे *beaucoup de cousins*) के बाद फ़्रेंच में केवल *de* आता है और *du*/*de la*/*des* बिल्कुल नहीं आते — *un kilo de tomates*, कभी *un kilo des tomates* नहीं।
  fr.a1.unit04.lesson02.teach.combien_ca_coute:
    title: कीमत पूछिए
    gloss: इसकी कीमत कितनी है?
    note: '*Combien* (कितना) और *ça coûte* (यह कितने का है) मिलकर दाम पूछने का सामान्य, हर जगह चलने वाला तरीका है।'
  fr.a1.unit04.lesson02.teach.cest_combien_pain:
    title: किसी खास चीज़ का दाम पूछें
    gloss: ब्रेड कितने की है?
    note: '*C''est combien, [item] ?* में उस खास चीज़ का नाम लिया जाता है जिसका दाम पूछना है; यह *Combien ça coûte ?* का आम विकल्प है।'
  fr.a1.unit04.lesson02.teach.ca_fait_combien:
    title: कुल कीमत पूछें
    gloss: सब मिलाकर कितना हुआ?
    note: '*Ça fait combien ?* कुल जोड़ पूछता है, आमतौर पर खरीदारी के अंत में, किसी एक चीज़ के बारे में नहीं।'
  fr.a1.unit04.lesson03.teach.line01:
    title: टमाटर मँगवाएँ
    gloss: इनेस विक्रेता को नमस्ते कहती है और एक किलो टमाटर माँगती है।
    note: इसमें *Bonjour* के साथ *je voudrais* + मात्रा वाला ढाँचा जुड़ा है।
  fr.a1.unit04.lesson03.teach.line02:
    title: पूछिए कि और कुछ चाहिए या नहीं
    gloss: विक्रेता हामी भरता है और पूछता है कि क्या उसे और कुछ चाहिए।
    note: '*Autre chose ?* (और कुछ?) दुकानदार का आम अगला सवाल है।'
  fr.a1.unit04.lesson03.teach.line03:
    title: पनीर जोड़ें और उसका दाम पूछें
    gloss: इनेस थोड़ा पनीर और लेती है और उसका दाम पूछती है।
    note: '*Un peu de fromage* (थोड़ा पनीर) में भी *un kilo de* की तरह केवल *de* आता है।'
  fr.a1.unit04.lesson03.teach.line04:
    title: प्रति किलो दाम बताएँ
    gloss: विक्रेता कहता है कि यह आठ यूरो प्रति किलो है।
    note: '*X euros le kilo* प्रति इकाई दाम बताने का स्वाभाविक फ़्रेंच तरीका है; यहाँ *le* का अर्थ "प्रति" है, "वह" नहीं।'
  fr.a1.unit04.lesson03.teach.line05:
    title: समझाएँ कि उसे यहाँ ब्रेड क्यों चाहिए
    gloss: मैथ्यू कहता है कि उसे भी ब्रेड चाहिए, पर बेकरी आज बंद है।
    note: '*Fermée* (बंद) स्त्रीलिंग रूप है, जो *la boulangerie* के अनुसार बना है।'
  fr.a1.unit04.lesson03.teach.line06:
    title: दूसरा उपाय सुझाएँ
    gloss: इनेस उसे भरोसा दिलाती है कि ब्रेड यहाँ भी मिल सकती है।
    note: '*On peut* (हम कर सकते हैं) + क्रिया का मूल रूप, संभावना बताने का आम बोलचाल का तरीका है।'
  fr.a1.unit04.lesson03.teach.line07:
    title: हामी भरें और कुल रकम बताएँ
    gloss: 'विक्रेता कहता है कि उसके पास ताज़ी ब्रेड है, फिर कुल जोड़ सोचता है और बताता है: साढ़े तेरह यूरो।'
    note: यहाँ *Ça fait combien en tout ?* विक्रेता खुद से सोचते हुए कहता है, इनेस से नहीं पूछ रहा।
  fr.a1.unit04.lesson03.teach.line08:
    title: दुकानदार को धन्यवाद कहिए
    gloss: पैसे देते समय इनेस उसे दिल से धन्यवाद देती है।
    note: यहाँ *Voilà* पैसे थमाते समय बोला जाने वाला शब्द है, जो हाव-भाव के साथ चलता है।
