teaching:
  fr.a1.unit03.lesson01.teach.mere:
    title: माँ
    gloss: माँ
    note: '*Mère* स्त्रीलिंग है। परिवार में *maman* रोज़मर्रा का ज़्यादा आम शब्द है, जबकि *mère* तटस्थ है और इस कोर्स की शब्द-सूचियों में प्रयोग होता है।'
  fr.a1.unit03.lesson01.teach.pere:
    title: पिता
    gloss: पिता
    note: '*Père* पुल्लिंग है। *Papa* उसका रोज़मर्रा का रूप है, ठीक *mère*/*maman* की जोड़ी की तरह।'
  fr.a1.unit03.lesson01.teach.frere:
    title: भाई
    gloss: भाई
    note: '*Frère* पुल्लिंग एकवचन है।'
  fr.a1.unit03.lesson01.teach.soeur:
    title: बहन
    gloss: बहन
    note: '*Sœur* स्त्रीलिंग एकवचन है। œ फ़्रेंच वर्तनी में एक ही अक्षर माना जाता है, दो अलग अक्षर नहीं।'
  fr.a1.unit03.lesson01.teach.fils:
    title: बेटा
    gloss: बेटा
    note: '*Fils* पुल्लिंग है; ध्यान दीजिए कि यहाँ अंत का s बोला जाता है (यह अपवाद है), जबकि l मौन रहता है।'
  fr.a1.unit03.lesson01.teach.fille:
    title: बेटी
    gloss: बेटी
    note: '*Fille* स्त्रीलिंग एकवचन है; दूसरे संदर्भों में यही शब्द "लड़की" के लिए भी आता है।'
  fr.a1.unit03.lesson01.teach.parents:
    title: Parents
    gloss: माता-पिता
    note: '*Parents* पुल्लिंग बहुवचन है, जो माँ और पिता दोनों को साथ में बताता है।'
  fr.a1.unit03.lesson01.teach.freres_et_soeurs:
    title: भाई-बहन
    gloss: भाई और बहनें; भाई-बहन
    note: फ़्रेंच में "भाई-बहन" के लिए कोई एक लिंग-निरपेक्ष शब्द नहीं है; *frères et sœurs* दोनों को साफ़-साफ़ बताता है।
  fr.a1.unit03.lesson02.teach.ma_mere:
    title: मेरी माँ
    gloss: मेरी माँ
    note: '*Ma* स्त्रीलिंग एकवचन अधिकारवाचक "मेरी" है; इसका प्रयोग इसलिए हुआ है क्योंकि *mère* स्त्रीलिंग है।'
  fr.a1.unit03.lesson02.teach.mon_pere:
    title: मेरे पिता
    gloss: मेरे पिता
    note: '*Mon* पुल्लिंग एकवचन अधिकारवाचक "मेरा" है; इसका प्रयोग इसलिए हुआ है क्योंकि *père* पुल्लिंग है।'
  fr.a1.unit03.lesson02.teach.mes_freres_et_soeurs:
    title: मेरे भाई-बहन
    gloss: मेरे भाई-बहन
    note: '*Mes* बहुवचन अधिकारवाचक "मेरे/मेरी" है, जो लिंग की परवाह किए बिना हर बहुवचन संज्ञा के साथ आता है। यह *ma*/*mon* की तरह संज्ञा के अनुसार बदलता है, पर लिंग के बजाय वचन के अनुसार।'
  fr.a1.unit03.lesson02.teach.as_tu_des_freres_et_soeurs:
    title: भाई-बहनों के बारे में पूछिए
    gloss: क्या तुम्हारे भाई-बहन हैं?
    note: '*As-tu*, *tu as* (तुम्हारे पास है) का उलटा प्रश्न-रूप है; A1 स्तर पर यह एक आम प्रश्न-रचना है।'
  fr.a1.unit03.lesson02.teach.jai_deux_soeurs:
    title: भाई-बहनों की संख्या बताइए
    gloss: मेरी दो बहनें हैं।
    note: '*J''ai* (मेरे पास है) के साथ संख्या और परिवार-सूचक संज्ञा जोड़ना भाई-बहनों के बारे में बताने का सामान्य तरीका है।'
  fr.a1.unit03.lesson02.teach.ta_famille_est_grande:
    title: पूछिए कि परिवार बड़ा है या नहीं
    gloss: क्या तुम्हारा परिवार बड़ा है?
    note: '*Ta* स्त्रीलिंग एकवचन अनौपचारिक अधिकारवाचक "तुम्हारी" है, जो स्त्रीलिंग संज्ञा *famille* के अनुसार आया है।'
  fr.a1.unit03.lesson02.teach.ma_famille_est_petite:
    title: छोटे परिवार का वर्णन कीजिए
    gloss: मेरा परिवार छोटा है।
    note: '*Petite* स्त्रीलिंग संज्ञा *famille* के अनुसार रूप लेता है; पुल्लिंग संज्ञा के साथ पुल्लिंग रूप *petit* आता। यह *mon*/*ma*/*mes* से अलग बात है: वे स्वामित्व बताते हैं, जबकि petite किसी गुण का वर्णन करता है।'
  fr.a1.unit03.lesson03.teach.grand_pere:
    title: दादा / नाना
    gloss: दादा / नाना
    note: '*Grand-père* योजक-चिह्न वाला यौगिक शब्द है, पुल्लिंग।'
  fr.a1.unit03.lesson03.teach.grand_mere:
    title: दादी / नानी
    gloss: दादी / नानी
    note: '*Grand-mère* योजक-चिह्न वाला यौगिक शब्द है, स्त्रीलिंग। ध्यान दें कि यहाँ *grand-* अपरिवर्तित रहता है; *grande-mère* नहीं बनता।'
  fr.a1.unit03.lesson03.teach.grands_parents:
    title: दादा-दादी / नाना-नानी
    gloss: दादा-दादी / नाना-नानी
    note: '*Grands-parents* में यौगिक के दोनों भाग बहुवचन होते हैं (*grands*, *grand-* नहीं), जबकि एकवचन रूपों *grand-mère*/*grand-père* में *grand-* नहीं बदलता।'
  fr.a1.unit03.lesson03.teach.oncle:
    title: चाचा / मामा
    gloss: चाचा / मामा
    note: '*Oncle* पुल्लिंग है।'
  fr.a1.unit03.lesson03.teach.tante:
    title: चाची / मौसी / बुआ
    gloss: चाची / मौसी / बुआ
    note: '*Tante* स्त्रीलिंग है।'
  fr.a1.unit03.lesson03.teach.cousin:
    title: चचेरा भाई (ममेरा/फुफेरा/मौसेरा भाई)
    gloss: चचेरा भाई
    note: '*Cousin* पुल्लिंग एकवचन है; फ़्रेंच में चचेरे/ममेरे भाई या बहन का लिंग शब्द के रूप में ही दिखता है (cousin / cousine)।'
  fr.a1.unit03.lesson03.teach.cousine:
    title: चचेरी बहन (ममेरी/फुफेरी/मौसेरी बहन)
    gloss: चचेरी बहन
    note: '*Cousine* स्त्रीलिंग एकवचन है, जो *cousin* में -e जोड़ने से बनता है।'
  fr.a1.unit03.lesson03.teach.mes_grands_parents:
    title: मेरे दादा-दादी
    gloss: मेरे दादा-दादी
    note: '*Mes* का प्रयोग इसलिए हुआ है क्योंकि *grands-parents* बहुवचन है, भले ही इसमें पुल्लिंग और (अप्रत्यक्ष रूप से) स्त्रीलिंग, दोनों सदस्य शामिल हों।'
  fr.a1.unit03.lesson04.teach.combien_de_freres_et_soeurs:
    title: भाई-बहनों की संख्या पूछना
    gloss: आपके कितने भाई-बहन हैं?
    note: '*Combien de* (कितने) फ़्रेंच में सीधे संज्ञा से पहले आता है; इसमें किसी अलग सहायक क्रिया की ज़रूरत नहीं होती।'
  fr.a1.unit03.lesson04.teach.on_est_cinq:
    title: घर के सदस्यों की संख्या बताना
    gloss: घर में हम छह लोग हैं।
    note: '*On est* (शाब्दिक अर्थ "कोई है", पर बोलचाल में "हम हैं") बोलचाल की फ़्रेंच में घर के कुल सदस्यों की संख्या बताने का स्वाभाविक और बहुत आम तरीका है; *nous sommes* अधिक औपचारिक/लिखित रूप है।'
  fr.a1.unit03.lesson04.teach.ma_famille_est_grande:
    title: बड़े परिवार का वर्णन करना
    gloss: मेरा परिवार बड़ा है।
    note: '*Grande* स्त्रीलिंग संज्ञा *famille* के अनुसार रूप लेता है; पुल्लिंग संज्ञा के साथ पुल्लिंग रूप *grand* आता।'
  fr.a1.unit03.lesson04.teach.jai_beaucoup_de_cousins:
    title: बताना कि आपके बहुत से चचेरे-ममेरे भाई-बहन हैं
    gloss: मेरे बहुत से चचेरे-ममेरे भाई-बहन हैं।
    note: '*Beaucoup de* (बहुत सारे) संज्ञा से पहले आता है; यहाँ *de*, *du*/*des* नहीं बनता क्योंकि *beaucoup* पहले ही मात्रा बता देता है।'
  fr.a1.unit03.lesson04.teach.tu_habites_pres_de_tes_parents:
    title: माता-पिता के पास रहने के बारे में पूछना
    gloss: क्या आप अपने माता-पिता के पास रहते हैं?
    note: '*Tes* बहुवचन अनौपचारिक अधिकारवाचक "तुम्हारे" है, जो इसलिए आया है क्योंकि *parents* बहुवचन है।'
  fr.a1.unit03.lesson04.teach.jhabite_avec_mes_grands_parents:
    title: बताना कि आप किसके साथ रहते हैं
    gloss: मैं अपने दादा-दादी के साथ रहता/रहती हूँ।
    note: '*Avec* (के साथ) बताता है कि कोई किन लोगों के साथ रहता है; *j''habite*, *habiter* का *je* वाला रूप है, जो इकाई 1 के *j''habite à Montreuil* में पहले आ चुका है।'
  fr.a1.unit03.lesson05.teach.profile_reading:
    title: Inès के परिवार का परिचय
    gloss: 'मेरा नाम Inès है। मैं इकतीस साल की हूँ और पेरिस में अपने दादा-दादी के साथ रहती हूँ। मेरी माँ और मेरे पिता Lille में रहते हैं। मेरी दो बहनें और एक भाई हैं: घर में हम छह लोग हैं। मेरी छोटी बहन का नाम Camille है और वह बीस साल की है।'
    note: 'यह परिचय पाठ 1 से 4 की शब्दावली और संरचनाओं को अलग-अलग वाक्यों के बजाय एक जुड़े हुए छोटे पाठ में दोहराता है। इस इकाई के पठन-आकलन में भी यही कौशल परखा जाता है: कौन किससे जुड़ा है, यह पहचानना।'
    glosses:
      trente: तीस
      ans: वर्ष (उम्र)
      grands-parents: दादा-दादी
      mère: माँ
      père: पिता
      habitent: रहती है / रहते हैं
      deux: दो
      sœurs: बहनें
      frère: भाई
      six: छह
      maison: घर
      petite: छोटी
      sœur: बहन
      vingt: बीस
  fr.a1.unit03.lesson05.teach.petite_soeur:
    title: छोटी बहन
    gloss: छोटी बहन
    note: '*Petite* (*petit* का स्त्रीलिंग) यहाँ संज्ञा से पहले आता है, जैसे कई छोटे और आम फ़्रेंच विशेषण आते हैं; ज़्यादातर दूसरे विशेषण संज्ञा के बाद आते हैं।'
  fr.a1.unit03.lesson05.teach.habite_third_person:
    title: रहता/रहती है (अन्य पुरुष)
    gloss: रहता/रहती है
    note: '*Habite*, *habiter* का अन्य पुरुष एकवचन रूप है, जो किसी और के बारे में बात करते समय आता है (*Inès habite...*), स्वयं के बारे में नहीं (*j''habite*, जो पहले आ चुका है)।'
  fr.a1.unit03.lesson05.teach.ses_third_person_plural:
    title: उसका/उनका (बहुवचन संज्ञा के साथ)
    gloss: उसके/उनके
    note: '*Ses*, *sa*/*son* का बहुवचन है। जैसे *sa*/*son* एकवचन संज्ञा के साथ "उसका/उसकी" का काम करते हैं, वैसे ही *ses grands-parents* का अर्थ है "उसके दादा-दादी", जब तीसरे व्यक्ति Inès के बारे में बात हो रही हो।'
  fr.a1.unit03.lesson05.teach.a_third_person_avoir:
    title: है (अन्य पुरुष)
    gloss: (उसके) पास है
    note: '*A*, *avoir* का अन्य पुरुष एकवचन रूप है, जो किसी और के बारे में बात करते समय आता है (*elle a vingt ans*), स्वयं के बारे में नहीं (*j''ai* / *as-tu*, जो इस इकाई के पाठ 2 से 4 में बार-बार आए हैं)।'
  fr.a1.unit03.lesson06.teach.line01:
    title: परिवार की तस्वीरें दिखाना
    gloss: Inès, Mathieu को एक तस्वीर दिखाती है और अपने माता-पिता तथा छोटी बहन से मिलवाती है।
    note: '*Voici* (यह रहा/ये रहे) किसी चीज़ की ओर इशारा करके दिखाने के लिए आता है; तस्वीर दिखाते समय यह स्वाभाविक वाक्यांश है।'
  fr.a1.unit03.lesson06.teach.line02:
    title: प्रतिक्रिया देना और भाई-बहनों के बारे में पूछना
    gloss: Mathieu खुशी से प्रतिक्रिया देता है और पूछता है कि क्या उसके और भाई-बहन हैं।
    note: '*C''est adorable* छोटे भाई या बहन की तस्वीर देखकर दी जाने वाली स्वाभाविक, स्नेह भरी प्रतिक्रिया है।'
  fr.a1.unit03.lesson06.teach.line03:
    title: घर के सदस्यों की संख्या बताना और वही सवाल लौटाना
    gloss: Inès बताती है कि उसकी दो बहनें और एक भाई हैं, घर में छह लोग हैं, फिर Mathieu के परिवार के बारे में पूछती है।
    note: '*On est six à la maison* घर के कुल सदस्यों की संख्या बताता है, और पाठ 4 में आई रचना को आगे बढ़ाता है।'
  fr.a1.unit03.lesson06.teach.line04:
    title: छोटे परिवार का वर्णन करना
    gloss: 'Mathieu कहता है कि उसका परिवार छोटा है, सिर्फ़ तीन लोग: उसके माता-पिता और वह; पर उसके बहुत सारे चचेरे-ममेरे भाई-बहन हैं।'
    note: '*Mais* (लेकिन) छोटे निकट परिवार और बड़े विस्तृत परिवार के बीच का अंतर दिखाता है।'
  fr.a1.unit03.lesson06.teach.line05:
    title: माता-पिता से दूरी के बारे में पूछना
    gloss: Inès पूछती है कि क्या Mathieu अपने माता-पिता के पास रहता है।
    note: '*Près de* (के पास) दूरी की निकटता बताने का आम तरीका है।'
  fr.a1.unit03.lesson06.teach.line06:
    title: दूरी समझाना और संपर्क में रहना बताना
    gloss: Mathieu कहता है कि नहीं, वे Lyon में रहते हैं, और वे हर हफ़्ते फ़ोन पर बात करते हैं।
    note: 'यह इकाई 1 की उस बात को आगे बढ़ाता है कि Mathieu Lyon का है: उसके माता-पिता वहीं रहते हैं, जबकि वह Saint-Ouen में रहता है।'
  fr.a1.unit03.lesson06.teach.line07:
    title: सहानुभूति जताना और अपनी स्थिति बताना
    gloss: Inès कहती है कि वह समझती है, और बताती है कि वह यहाँ पेरिस में अपने दादा-दादी के साथ रहती है।
    note: '*Je comprends* (मैं समझता/समझती हूँ) किसी की बताई बात को स्वीकार करने का स्वाभाविक, छोटा तरीका है, उसके बाद आप अपनी बात जोड़ सकते हैं।'
  fr.a1.unit03.lesson06.teach.line08:
    title: आत्मीय टिप्पणी के साथ समापन
    gloss: Mathieu कहता है कि परिवार का पास होना अच्छी बात है।
    note: '*C''est bien d''avoir sa famille près de soi* बातचीत को एक आत्मीय, विचारशील मोड़ पर समाप्त करता है, और पाठ 4 की *près de* रचना को दोहराता है।'
