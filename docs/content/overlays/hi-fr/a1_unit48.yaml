teaching:
  fr.a1.unit48.lesson01.teach.le_manteau_le:
    title: कोट, स्वेटर
    gloss: कोट, स्वेटर
    note: '*Le manteau* और *le pull* दोनों पुल्लिंग हैं।'
    example_gloss:
    - मैं एक कोट ढूँढ रहा हूँ।
    - मेरे पास एक स्वेटर है।
  fr.a1.unit48.lesson01.teach.le_pantalon_les:
    title: पैंट, जूते
    gloss: पैंट, जूते
    note: 'फ़्रेंच में *pantalon* एकवचन है: एक पैंट के लिए *un pantalon*। *Chaussures*, *chaussure* का बहुवचन है; जूतों की बात अक्सर बहुवचन में ही की जाती है।'
    example_gloss:
    - मैं एक पतलून ढूँढ रहा/रही हूँ।
    - मैं जूते ढूँढ रहा हूँ।
  fr.a1.unit48.lesson01.teach.je_cherche_un:
    title: बताना कि आप क्या ढूँढ रहे हैं
    gloss: मैं एक कोट ढूँढ रहा हूँ।
    note: '*Chercher* (ढूँढना) के बाद कोई पूर्वसर्ग नहीं आता; वस्तु सीधे आती है: *je cherche un manteau*।'
  fr.a1.unit48.lesson02.teach.la_taille:
    title: साइज़
    gloss: साइज़
    note: '*Taille* स्त्रीलिंग है: *la taille*।'
    example_gloss: आप किस साइज़ के हैं?
  fr.a1.unit48.lesson02.teach.quelle_taille_faites:
    title: साइज़ पूछना
    gloss: आप कौन-सा साइज़ पहनते हैं?
    note: '*Quelle taille ?* में *quelle* (कौन-सी) इसलिए आता है क्योंकि *taille* स्त्रीलिंग है और उसके संभावित उत्तर गिने-चुने होते हैं (S, M, L या कोई संख्या)।'
  fr.a1.unit48.lesson02.teach.je_fais_du:
    title: अपना साइज़ बताना
    gloss: मेरा साइज़ M है।
    note: '*Faire du M* का अर्थ है M साइज़ का होना: हिंदी में हम "साइज़ M है" कहते हैं, पर फ़्रेंच में यहाँ *faire* (करना/बनाना) क्रिया आती है।'
  fr.a1.unit48.lesson03.teach.noir_bleu:
    title: काला, नीला
    gloss: काला, नीला
    note: इस पाठ के दो मूल रंग-विशेषण।
    example_gloss:
    - मुझे काले रंग में कोट चाहिए।
    - क्या आपके पास यह नीले रंग में भी है?
  fr.a1.unit48.lesson03.teach.je_veux_le:
    title: रंग बताना
    gloss: मुझे काले रंग में कोट चाहिए।
    note: कपड़े का रंग बताने या माँगने का सामान्य तरीका *en* + रंग है।
  fr.a1.unit48.lesson03.teach.avez_vous_aussi:
    title: दूसरे रंग के बारे में पूछना
    gloss: क्या आपके पास यह नीले रंग में भी है?
    note: '*Aussi* (भी) से पूछा जाता है कि दूसरा रंग उपलब्ध है या नहीं; यहाँ आदरसूचक *vous* का प्रयोग हुआ है।'
  fr.a1.unit48.lesson04.teach.est_ce_que:
    title: फ़िटिंग के बारे में पूछना
    gloss: क्या यह कोट तुम्हें ठीक आता है?
    note: 'कपड़ा ठीक आने के लिए *aller* (जाना) स्वाभाविक क्रिया है: *il me va bien*, यानी शाब्दिक रूप से "यह मुझ पर अच्छा जाता है"।'
  fr.a1.unit48.lesson04.teach.il_me_va:
    title: ठीक फ़िट होना बताना
    gloss: यह अच्छी तरह फ़िट आता है।
    note: '*Bien* (अच्छी तरह) बताता है कि चीज़ कैसी फ़िट आती है।'
  fr.a1.unit48.lesson04.teach.c_est_trop:
    title: बहुत छोटा
    gloss: यह बहुत छोटा है।
    note: अधिकता बताने के लिए *trop* (बहुत ज़्यादा) विशेषण से पहले आता है।
  fr.a1.unit48.lesson04.teach.c_est_trop_2:
    title: बहुत बड़ा
    gloss: यह बहुत बड़ा है।
    note: यहाँ भी वही *trop* + विशेषण का ढाँचा है, जो पिछले कार्ड के *trop petit* में था।
  fr.a1.unit48.lesson05.teach.quatre_vingt_dix:
    title: नब्बे
    gloss: नब्बे
    note: '*Quatre-vingt-dix* संख्या 90 है (शाब्दिक रूप से "चार बीस दस"); यहाँ यह कोट की क़ीमत में आई है।'
    example_gloss: कोट की क़ीमत नब्बे यूरो है।
  fr.a1.unit48.lesson05.teach.le_manteau_coute:
    title: क़ीमत बताना
    gloss: कोट की क़ीमत नब्बे यूरो है।
    note: '*Coûte*, *coûter* (क़ीमत होना) का *il* वाला रूप है।'
  fr.a1.unit48.lesson05.teach.parka_taille_m:
    title: दुकान की रसीद पढ़िए
    gloss: 'सर्दियों का कोट: साइज़ M, रंग काला। क़ीमत: नब्बे यूरो। यह कोट अच्छी तरह फ़िट आता है और गर्म है।'
    note: साइज़, रंग, क़ीमत और कोट के बारे में बताई गई दो ख़ूबियों पर ध्यान दीजिए।
    glosses:
      Parka: सर्दियों का कोट
      taille: साइज़
      couleur: रंग
      noire: काला
      Prix: कीमत
      quatre-vingt-dix: नब्बे
      euros: यूरो
      manteau: कोट
      va: फ़िट आता है
      chaud: गर्म
  fr.a1.unit48.lesson06.teach.camille_ce_manteau:
    title: Camille की नज़र कोट पर पड़ती है
    gloss: 'Camille: यह कोट कितना सुंदर है! तुम किस साइज़ के हो?'
    note: '*Joli* (सुंदर) एक सामान्य सकारात्मक प्रतिक्रिया है; यहाँ यह *manteau* के अनुसार पुल्लिंग रूप में है।'
  fr.a1.unit48.lesson06.teach.mathieu_je_fais:
    title: Mathieu कोट पहनकर देखना चाहता है
    gloss: 'Mathieu: मेरा साइज़ M है। क्या मैं इसे पहनकर देख सकता हूँ?'
    note: '*Je peux ... ?* अनुमति माँगने का सामान्य तरीका है; *l''essayer* का अर्थ है "इसे पहनकर देखना", और *l''* कोट की जगह आया है।'
  fr.a1.unit48.lesson06.teach.camille_bien_sur:
    title: Camille फ़िटिंग के बारे में पूछती है
    gloss: 'Camille: ज़रूर। क्या यह तुम्हें ठीक आ रहा है?'
    note: '*Il* (वह/यह) पुल्लिंग संज्ञा *le manteau* की ओर संकेत करता है।'
  fr.a1.unit48.lesson06.teach.mathieu_oui_il:
    title: Mathieu पुष्टि करता है
    gloss: 'Mathieu: हाँ, यह अच्छी तरह फ़िट आता है और गर्म है।'
    note: यह वही कोट है जिसकी रसीद आपने पढ़ी थी; बातें बिल्कुल वही हैं।
  fr.a1.unit48.lesson06.teach.camille_super_tu:
    title: Camille रंग के बारे में पूछती है
    gloss: 'Camille: बढ़िया! तुम इसे काले रंग में चाहते हो या नीले में?'
    note: '*Tu le veux en ... ou en ... ?* दो विकल्पों में से चुनने को कहता है; *le* कोट की जगह आया है।'
  fr.a1.unit48.lesson06.teach.mathieu_je_le:
    title: Mathieu तय करता है
    gloss: 'Mathieu: मैं इसे काले रंग में ले लूँगा।'
    note: ख़रीदारी का फ़ैसला पक्का करने के लिए *prendre* (लेना) स्वाभाविक क्रिया है; यहाँ रंग वही है जो रसीद में लिखा है।
  fr.a1.unit48.lesson06.teach.on_ecrit_prends:
    title: Prends या prend
    gloss: '*Prends*, *prendre* (लेना) का je और tu वाला रूप है; *prend* il/elle वाला रूप है।'
    note: '*prendre* का ढाँचा: *je prends, tu prends, il/elle prend*।'
