teaching:
  fr.a1.unit13.lesson01.teach.preferer:
    title: तरजीह देना
    gloss: तरजीह देना
    note: '*Préférer* स्वर बदलने वाली -er क्रिया है: *je préfère*, लेकिन *nous préférons* (*nous/vous* रूपों में उच्चारण-चिह्न नहीं बदलता)।'
    example_gloss: मुझे चॉकलेट टार्ट ज़्यादा पसंद है।
  fr.a1.unit13.lesson01.teach.aimer_mieux:
    title: ज़्यादा पसंद करना
    gloss: ज़्यादा पसंद करना
    note: '*Aimer mieux*, *préférer* का आम विकल्प है, पर इसमें तुलना *que* से होती है (*aimer mieux X que Y*), जबकि *préférer* में *à* आता है (*préférer X à Y*)।'
    example_gloss: मुझे मीठे व्यंजनों से ज़्यादा नमकीन व्यंजन पसंद हैं।
  fr.a1.unit13.lesson01.teach.detester:
    title: नफ़रत करना
    gloss: नफ़रत करना
    note: '*Détester* बहुत तीखी नापसंदगी है, *ne pas aimer* (पसंद न करना) से कहीं ज़्यादा।'
    example_gloss: Mathieu को बहुत तेज़ मसालों से नफ़रत है; उसे हल्के व्यंजन ज़्यादा पसंद हैं।
  fr.a1.unit13.lesson01.teach.plutot:
    title: बल्कि
    gloss: बल्कि
    note: '*Plutôt* पसंद को नरम बनाता है -- "इसके बजाय यह वाला", दूसरे विकल्प को पूरी तरह नकारे बिना।'
    example_gloss: मैं इसके बजाय चीज़ लूँगा।
  fr.a1.unit13.lesson01.teach.sucre:
    title: मीठा
    gloss: मीठा
    note: '*Sucré* खाने के मीठे स्वाद के लिए है, *doux* (नरम/हल्का) से अलग; इन दोनों को अक्सर आपस में मिला दिया जाता है।'
    example_gloss: यह मिठाई बहुत मीठी है।
  fr.a1.unit13.lesson01.teach.sale:
    title: नमकीन
    gloss: नमकीन
    note: फ्रेंच खान-पान की शब्दावली में *salé*, *sucré* का सामान्य विलोम है; इसमें नमकीन और खारा, दोनों अर्थ आ जाते हैं।
    example_gloss: चीज़ नमकीन है।
  fr.a1.unit13.lesson01.teach.la_recette:
    title: व्यंजन-विधि
    gloss: व्यंजन-विधि
    note: '*La recette* हमेशा स्त्रीलिंग होता है।'
    example_gloss: यह व्यंजन-विधि आसान है।
  fr.a1.unit13.lesson02.teach.quest_ce_que_tu_preferes:
    title: पसंद पूछना
    gloss: तुम्हें क्या ज़्यादा पसंद है?
    note: बोलचाल की फ्रेंच में "क्या" वाला खुला प्रश्न बनाने का सामान्य तरीक़ा *Qu'est-ce que...* है।
  fr.a1.unit13.lesson02.teach.je_prefere_x_a_y:
    title: दो चीज़ों में से पसंद बताना
    gloss: मुझे क्विश से ज़्यादा टार्ट पसंद है।
    note: '*Préférer X à Y* में कम पसंद वाले विकल्प से पहले *à* आता है, *que* नहीं। हिंदी में हम "Y से" कहते हैं, पर फ्रेंच में que लगा देना आम ग़लती है।'
  fr.a1.unit13.lesson02.teach.tu_aimes_plutot:
    title: सामान्य झुकाव पूछना
    gloss: तुम्हें मीठा ज़्यादा पसंद है या नमकीन?
    note: इसमें *plutôt* (पहले पाठ से) को *ou* (या) वाले चुनाव-प्रश्न के साथ जोड़ा गया है।
  fr.a1.unit13.lesson02.teach.moi_aussi_moi_non:
    title: सहमति या असहमति जताना
    gloss: मैं भी। / मैं नहीं।
    note: '*Moi aussi* सकारात्मक कथन से सहमति जताता है; *moi non* असहमति जताता है, या उलटी पसंद बताता है।'
  fr.a1.unit13.lesson02.teach.ca_ne_me_derange_pas:
    title: बताना कि आपको एतराज़ नहीं
    gloss: मुझे कोई एतराज़ नहीं है।
    note: '*Ça ne me dérange pas* चुनाव के लिए पूछे जाने पर कोई भी विकल्प मान लेने का उपयोगी और तटस्थ तरीक़ा है।'
  fr.a1.unit13.lesson02.teach.on_pourrait_faire:
    title: विकल्प सुझाना
    gloss: हम क्विश बना सकते हैं, है न?
    note: '*On pourrait* (हम... सकते हैं) + क्रिया का मूल रूप नरमी से कोई विकल्प सुझाता है, और अंत का *non ?* सामने वाले से सहमति माँगता है।'
  fr.a1.unit13.lesson03.teach.line01:
    title: पूछना कि क्या बनाना है
    gloss: Mathieu पूछता है कि शनिवार को क्या बनाएँगे -- टार्ट या क्विश?
    note: '*Qu''est-ce qu''on prépare... ?* (हम क्या बना रहे हैं) में "हम" के लिए *on* आता है, जो बोलचाल में आम है।'
  fr.a1.unit13.lesson03.teach.line02:
    title: अपनी पसंद बताकर सामने वाले से पूछना
    gloss: Inès कहती है कि उसे टार्ट ज़्यादा पसंद है, कुछ ज़्यादा मीठी, और Mathieu से उसकी पसंद पूछती है।
    note: '*Et toi ?* (और तुम?) किसी कथन को सामने वाले के लिए प्रश्न बनाने का सबसे सरल तरीक़ा है।'
  fr.a1.unit13.lesson03.teach.line03:
    title: उलटी पसंद बताना
    gloss: Mathieu कहता है कि उसे नमकीन ज़्यादा पसंद है, और टार्ट से ज़्यादा क्विश।
    note: पिछले पाठ के *préférer X à Y* ढाँचे का सीधा दोबारा प्रयोग।
  fr.a1.unit13.lesson03.teach.line04:
    title: बीच का रास्ता सुझाना
    gloss: Inès सुझाती है कि दोनों बनाए जा सकते हैं, है न?
    note: '*Les deux* (दोनों) दोनों व्यंजन बनाने का प्रस्ताव रखकर मतभेद सुलझा देता है।'
  fr.a1.unit13.lesson03.teach.line05:
    title: बीच का रास्ता मान लेना
    gloss: Mathieu कहता है कि अच्छा विचार है, उसे बिल्कुल एतराज़ नहीं।
    note: '*Ça ne me dérange pas du tout* में *du tout* (बिल्कुल) जोड़कर पिछले पाठ के वाक्यांश को और ज़ोरदार बनाया गया है।'
  fr.a1.unit13.lesson03.teach.line06:
    title: फ़ैसला पक्का करना
    gloss: 'Inès कहती है: बिल्कुल ठीक, शनिवार के लिए एक मीठी टार्ट और एक नमकीन क्विश।'
    note: अंतिम फ़ैसले को साफ़ दोहराकर बातचीत समाप्त की जाती है।
