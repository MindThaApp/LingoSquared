course:
  title: फ़्रेंच A1
  description: बुनियादी पसंद, नापसंद और प्राथमिकताएँ बताना और पूछना। शनिवार के लिए दो व्यंजनों में से एक चुनते हुए Inès और Mathieu की पाक-कार्यशाला की कहानी आगे बढ़ती है। ध्यान रखें कि *préférer X à Y* (X को Y से ज़्यादा पसंद करना) में *à* आता है, *que* नहीं।
