teaching:
  fr.a1.unit06.lesson01.teach.heure:
    title: घंटा; समय
    gloss: घंटा; समय
    note: '*Heure* स्त्रीलिंग है; घड़ी का समय बताने की इकाई भी यही है (*dix heures* = दस बजे)।'
    example_gloss: कितने बजे हैं?
  fr.a1.unit06.lesson01.teach.matin:
    title: सुबह
    gloss: सुबह
    note: '*Matin* पुल्लिंग है।'
    example_gloss: बाज़ार सुबह खुला रहता है।
  fr.a1.unit06.lesson01.teach.apres_midi:
    title: दोपहर के बाद
    gloss: दोपहर के बाद का समय
    note: '*Après-midi* पुल्लिंग या स्त्रीलिंग हो सकता है (पुल्लिंग ज़्यादा आम है); स्वर ध्वनि से पहले *l''* बन जाता है।'
    example_gloss: मैं दोपहर बाद काम करता/करती हूँ।
  fr.a1.unit06.lesson01.teach.soir:
    title: शाम
    gloss: शाम
    note: '*Soir* पुल्लिंग है।'
    example_gloss: खाना पकाने की कार्यशाला शाम को होती है।
  fr.a1.unit06.lesson01.teach.midi:
    title: दोपहर बारह बजे
    gloss: दोपहर (12 बजे)
    note: समय बताते हुए *midi* के साथ आर्टिकल नहीं आता (*à midi*, *au midi* नहीं)।
    example_gloss: हम दोपहर बारह बजे खाना खाते हैं।
  fr.a1.unit06.lesson01.teach.minuit:
    title: आधी रात
    gloss: आधी रात
    note: '*Minuit* भी *midi* की तरह बिना आर्टिकल के आता है।'
    example_gloss: कार्यशाला कभी आधी रात के बाद तक नहीं चलती।
  fr.a1.unit06.lesson01.teach.latelier_commence_le_soir:
    title: बताइए कि कार्यशाला कब होती है
    gloss: कार्यशाला सुबह नहीं, शाम को शुरू होती है।
    note: इसमें *le soir* और *le matin* की सीधी तुलना है, और दोनों संज्ञाएँ इसी पाठ की शब्दावली से हैं।
  fr.a1.unit06.lesson02.teach.quelle_heure_est_il:
    title: समय पूछना
    gloss: समय क्या हुआ है?
    note: '*Quelle heure est-il ?* समय पूछने का मानक, हर जगह चलने वाला तरीका है; *-il* क्रिया के साथ उलटकर प्रश्न का चिह्न बनता है।'
  fr.a1.unit06.lesson02.teach.il_est_dix_heures:
    title: घंटा बताइए
    gloss: दस बजे हैं।
    note: किसी भी पूरे घंटे को बताने का मूल ढाँचा है *Il est* + संख्या + *heures*; *heures* बहुवचन ही रहता है, सिर्फ़ *une heure* (एक बजे) को छोड़कर।
  fr.a1.unit06.lesson02.teach.et_quart:
    title: सवा बजे बताइए
    gloss: सवा दस बजे हैं।
    note: '*Et quart* (और चौथाई) बताए गए घंटे में पंद्रह मिनट जोड़ता है।'
  fr.a1.unit06.lesson02.teach.et_demie:
    title: साढ़े बजे बताइए
    gloss: साढ़े दस बजे हैं।
    note: '*Et demie* (और आधा) तीस मिनट जोड़ता है; *demie* में स्त्रीलिंग का -e *heure* के अनुसार लगता है।'
  fr.a1.unit06.lesson02.teach.moins_le_quart:
    title: पौने बजे बताइए
    gloss: पौने ग्यारह बजे हैं।
    note: '*Moins le quart* (चौथाई कम) हिंदी के «पौने» की तरह अगले घंटे से पीछे गिनता है, मौजूदा घंटे से नहीं: onze heures moins le quart यानी पौने ग्यारह।'
  fr.a1.unit06.lesson02.teach.a_quelle_heure:
    title: पूछें कि कुछ कितने बजे शुरू होता है
    gloss: वर्कशॉप कितने बजे शुरू होती है?
    note: किसी तय कार्यक्रम के बारे में पूछते समय *À quelle heure ?* (किस समय) इस्तेमाल होता है; यह आम सवाल *Quelle heure est-il ?* से अलग है।
  fr.a1.unit06.lesson03.teach.line01:
    title: अगले हफ़्ते के शुरू होने का समय पूछिए
    gloss: इनेस पूछती है कि अगले हफ़्ते की कार्यशाला कितने बजे है।
    note: '*La semaine prochaine* (अगले हफ़्ते) इस पाठ के *à quelle heure* वाले सवाल के ढाँचे के साथ जुड़ता है।'
  fr.a1.unit06.lesson03.teach.line02:
    title: शुरू होने का समय बताइए
    gloss: माथ्यू कहता है कि उसे लगता है यह अठारह तीस (शाम 6:30 बजे) शुरू होती है।
    note: '*Dix-huit heures trente* में 24 घंटे वाला तरीका है, जो फ्रेंच में कार्यक्रम तय करने की बातचीत में आम है और *et demie* जैसे अनौपचारिक रूपों से अलग है।'
  fr.a1.unit06.lesson03.teach.line03:
    title: पुष्टि कीजिए कि शाम है
    gloss: 'इनेस पक्का करती है: शाम को, सुबह नहीं?'
    note: '*le soir* और *le matin* की तुलना करने वाला एक छोटा पुष्टि का सवाल।'
  fr.a1.unit06.lesson03.teach.line04:
    title: पुष्टि कीजिए और कारण बताइए
    gloss: माथ्यू पुष्टि करता है कि शाम को, क्योंकि काम के बाद यह ज़्यादा सुविधाजनक है।
    note: '*Après le travail* (काम के बाद) एक सरल, व्यावहारिक कारण देता है।'
  fr.a1.unit06.lesson03.teach.line05:
    title: समाप्ति का समय पूछिए
    gloss: इनेस पूछती है कि यह कितने बजे ख़त्म होती है।
    note: '*Finit* (ख़त्म होता है) पहले वाली पंक्ति के *commence* (शुरू होता है) का उलटा है।'
  fr.a1.unit06.lesson03.teach.line06:
    title: समाप्ति का समय बताइए
    gloss: माथ्यू कहता है कि हमेशा की तरह लगभग बीस पंद्रह (रात 8:15 बजे)।
    note: '*Vers* (लगभग) अनुमानित समय बताता है, जो सटीक *à* से हल्का है।'
  fr.a1.unit06.lesson03.teach.line07:
    title: योजना की पुष्टि कीजिए
    gloss: 'इनेस पक्का करती है: अगले हफ़्ते अठारह तीस पर मिलते हैं!'
    note: तय किया गया समय दोहराकर बातचीत ख़त्म की जाती है; फ्रेंच में योजना पक्की करने का यह स्वाभाविक तरीका है।
