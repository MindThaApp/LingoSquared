course:
  title: फ़्रेंच A1
  description: दिन के हिस्से और घड़ी का समय बताना (heure(s), et quart, et demie, moins le quart)। इनेस और माथ्यू की खाना पकाने की कार्यशाला की कहानी आगे बढ़ती है और वे अपने अगले सत्र का समय तय करते हैं। फ्रेंच में औपचारिक और कार्यक्रम तय करने वाली बातचीत में 24 घंटे वाला तरीका चलता है (dix-huit heures trente), जो इस इकाई में पहले सीखे गए अनौपचारिक रूपों के साथ इस्तेमाल होता है।
