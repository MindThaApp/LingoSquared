teaching:
  fr.a1.unit53.lesson01.teach.grand_petit:
    title: लंबा और नाटा
    gloss: लंबा / नाटा
    note: '*Grand* लंबे व्यक्ति के लिए और *petit* छोटे क़द वाले के लिए आता है। ये व्यक्ति के अनुसार बदलते हैं: *grand/grande*, *petit/petite*।'
    example_gloss:
    - लेआ लंबी है।
    - थॉमस छोटे क़द का है।
  fr.a1.unit53.lesson01.teach.vieux_jeune:
    title: बुज़ुर्ग और जवान
    gloss: बुज़ुर्ग / जवान
    note: यहाँ *vieux* और *jeune* उम्र का सामान्य अंदाज़ा देते हैं, सालों की सही संख्या नहीं।
    example_gloss:
    - दादाजी बुज़ुर्ग हैं।
    - मथियू जवान है।
  fr.a1.unit53.lesson01.teach.pour_un_age:
    title: 'उम्र: संख्या या अंदाज़ा'
    gloss: सही उम्र बताने के लिए फ़्रेंच में *avoir* आता है (*Il a vingt ans*), पर *être vieux* सामान्य अंदाज़ा देता है (*Mon grand-père est vieux*)।
    note: सही उम्र पूछने के लिए आप *Quel âge as-tu ?* पहले से जानते हैं। यहाँ *vieux* बताता है कि कोई कितना बूढ़ा दिखता है, किसी संख्या के बिना।
  fr.a1.unit53.lesson01.teach.lea_est_grande:
    title: लेआ लंबी है और थॉमस छोटा है
    gloss: लेआ लंबी है और थॉमस छोटा है।
    note: '*et* (और) से जुड़ा एक सरल वाक्य, जो पाठ 5 की सीधी तुलना की तैयारी कराता है।'
  fr.a1.unit53.lesson02.teach.les_cheveux:
    title: बाल
    gloss: बाल
    note: '*Les cheveux* हमेशा बहुवचन और पुल्लिंग होता है, जबकि हिंदी में "बाल" का प्रयोग भी बहुवचन में होता है, पर फ़्रेंच में यह रूप हमेशा les के साथ ही आता है।'
    example_gloss: मथियू के बाल छोटे और काले हैं।
  fr.a1.unit53.lesson02.teach.blonds_bruns_gris:
    title: सुनहरा, भूरा और स्लेटी
    gloss: सुनहरा / भूरा / स्लेटी
    note: 'बालों के तीन रंग। *cheveux* के साथ रंग बहुवचन का *s* लेता है: *blonds*, *bruns*। *Gris* पहले से *s* पर खत्म होता है, और *noirs* (काला) कपड़ों वाली इकाई से दोहराया गया है।'
    example_gloss:
    - कैमिल के बाल सुनहरे हैं।
    - थॉमस के बाल भूरे हैं।
    - दादाजी के बाल स्लेटी हैं।
  fr.a1.unit53.lesson02.teach.longs_courts:
    title: लंबे और छोटे (बाल)
    gloss: लंबे / छोटे (बाल)
    note: '*Longs* (लंबे) में पाठ 1 का ऊँचाई वाला विचार है, जो अब बालों की लंबाई बताता है। *Courts* (छोटे) यहाँ नया है, और दोनों *cheveux* के साथ बहुवचन का *s* लेते हैं।'
    example_gloss:
    - लेआ के बाल लंबे हैं।
    - थॉमस के बाल छोटे हैं।
  fr.a1.unit53.lesson02.teach.cheveux_est_toujours:
    title: Cheveux के साथ विशेषण बहुवचन में
    gloss: '*Cheveux* हमेशा बहुवचन होता है, इसलिए विशेषण में *s* लगता है: *longs*, *courts*, *blonds*, *bruns*, *noirs*। *Gris* में पहले से *s* है।'
    note: 'रंग और लंबाई बहुवचन में *cheveux* के अनुसार बदलते हैं: *les cheveux longs*। पाठ 3 के *yeux* से तुलना कीजिए, जहाँ *marron* नहीं बदलता।'
  fr.a1.unit53.lesson02.teach.ses_est_le:
    title: 'Ses: उसका / उसकी / उसके'
    gloss: 'बहुवचन संज्ञा से पहले *ses* का अर्थ "उसके" है: *ses cheveux*, *ses yeux*। यह वस्तु के अनुसार बदलता है, मालिक के अनुसार नहीं।'
    note: 'हिंदी में "उसके" लड़के और लड़की दोनों के लिए चलता है, फ़्रेंच के ses की तरह: *ses yeux* का मतलब "उसकी आँखें" है, चाहे लड़के की हों या लड़की की; कौन है, यह संदर्भ से पता चलता है।'
  fr.a1.unit53.lesson02.teach.mathieu_a_les:
    title: मथियू के बाल छोटे और काले हैं
    gloss: मथियू के बाल छोटे और काले हैं।
    note: कपड़ों वाली इकाई का *noirs* (काला) फिर आया है।
  fr.a1.unit53.lesson02.teach.camille_a_les:
    title: कैमिल के बाल लंबे और सुनहरे हैं
    gloss: कैमिल के बाल लंबे और सुनहरे हैं।
    note: इस पाठ की लंबाई और रंग की शब्दावली एक स्वाभाविक वाक्य में एक साथ आई है।
  fr.a1.unit53.lesson03.teach.les_yeux:
    title: आँखें
    gloss: आँखें
    note: '*Les yeux*, *l''œil* (आँख) का बहुवचन है; *yeux* के अंत में *s* नहीं, *x* आता है।'
    example_gloss: मथियू की आँखें भूरी हैं।
  fr.a1.unit53.lesson03.teach.bleus_marron_verts:
    title: नीला, भूरा और हरा
    gloss: नीला / भूरा / हरा
    note: '*Bleus* (नीला) कपड़ों में पहले आ चुका है; *marron* (भूरा) कभी नहीं बदलता; *verts* (हरा) नया है।'
    example_gloss:
    - कैमिल की आँखें नीली हैं।
    - थॉमस की आँखें भूरी हैं।
    - लेआ की आँखें हरी हैं।
  fr.a1.unit53.lesson03.teach.avec_yeux_pluriel:
    title: Yeux के साथ -s, marron वैसा ही
    gloss: '*yeux* (बहुवचन) के साथ विशेषण में *s* लगता है: *yeux bleus*, *yeux verts*। *Marron* कभी नहीं बदलता: *yeux marron*।'
    note: 'पाठ 2 के *cheveux* से तुलना कीजिए: बहुवचन संज्ञा के साथ विशेषण भी बहुवचन होता है, सिवाय *marron* जैसे रंगों के, जो किसी संज्ञा से लिए गए हैं।'
  fr.a1.unit53.lesson03.teach.comment_est_camille:
    title: कैमिल कैसी दिखती है?
    gloss: कैमिल कैसी दिखती है?
    note: '*Comment est ... ?* इस इकाई का मुख्य प्रश्न है; किसी का भी रूप-रंग पूछने के लिए इसका प्रयोग कीजिए।'
  fr.a1.unit53.lesson03.teach.camille_a_les:
    title: कैमिल के बाल लंबे और सुनहरे हैं और आँखें नीली हैं
    gloss: कैमिल के बाल लंबे और सुनहरे हैं और आँखें नीली हैं।
    note: '*et* की मदद से बाल और आँखें एक ही वाक्य में बताने का आदर्श उत्तर।'
  fr.a1.unit53.lesson04.teach.camille_une_nouvelle:
    title: कैमिल निना का परिचय देती है
    gloss: 'कैमिल: भाषा-कैफ़े में एक नई लड़की आ रही है। उसका नाम निना है।'
    note: '*Une nouvelle fille vient* दृश्य में किसी नए व्यक्ति का परिचय देता है; *vient*, *venir* (आना) से बना है।'
  fr.a1.unit53.lesson04.teach.mathieu_d_accord:
    title: मथियू पूछता है कि वह कैसी दिखती है
    gloss: 'मथियू: ठीक है! वह कैसी दिखती है?'
    note: 'मुख्य प्रश्न नाम की जगह *elle* (वह) के साथ फिर आया है: *Comment est-elle ?* हाइफ़न क्रिया और सर्वनाम को जोड़ता है।'
  fr.a1.unit53.lesson04.teach.camille_elle_est:
    title: कैमिल निना का क़द और बाल बताती है
    gloss: 'कैमिल: वह छोटे क़द की है और उसके बाल छोटे और सुनहरे हैं।'
    note: पाठ 1 का *petite* और पाठ 2 के बालों की शब्दावली एक साथ आए हैं; लड़की के लिए *petite* में *e* लगता है।
  fr.a1.unit53.lesson04.teach.mathieu_et_ses:
    title: मथियू उसकी आँखों के बारे में पूछता है
    gloss: 'मथियू: और उसकी आँखें?'
    note: 'यहाँ *ses yeux* का अर्थ "उसकी आँखें" है: *ses*, *yeux* के अनुसार चलता है, लड़की के अनुसार नहीं।'
  fr.a1.unit53.lesson04.teach.camille_elle_a:
    title: कैमिल निना की आँखें बताती है
    gloss: 'कैमिल: उसकी आँखें हरी हैं।'
    note: पाठ 3 का *yeux verts* फिर आया है।
  fr.a1.unit53.lesson04.teach.mathieu_merci_alors:
    title: मथियू उसे पहचान लेगा
    gloss: 'मथियू: शुक्रिया! तब तो मैं उसे पहचान लूँगा।'
    note: '*Je vais la reconnaître* में निकट भविष्य के लिए *aller* के साथ क्रिया का मूल रूप आया है, और *la* का अर्थ "उसे" है।'
  fr.a1.unit53.lesson05.teach.thomas_et_lea:
    title: थॉमस और लेआ की तुलना
    gloss: थॉमस और लेआ भाई-बहन हैं, पर वे एक जैसे नहीं दिखते। थॉमस छोटे क़द का है, उसके बाल छोटे और भूरे हैं और आँखें भूरी हैं। लेआ थॉमस से लंबी है, उसके बाल लंबे और भूरे हैं और आँखें हरी हैं। और आप कैसे दिखते हैं?
    note: अब तक सिखाए गए हर रंग और लंबाई के शब्द इस्तेमाल करने वाली छोटी तुलना, जो अंत में पाठक से इकाई का मुख्य सवाल पूछती है।
    glosses:
      frère: भाई
      sœur: बहन
      ressemblent: दिखना
      différents: अलग
      petit: छोटा
      courts: छोटा
      bruns: भूरा
      cheveux: बाल
      marron: भूरा
      yeux: आँखें
      grande: ज़्यादा लंबा
      longs: लंबा
      verts: हरा
      se: (se ressemblent का हिस्सा = एक जैसे दिखना)
  fr.a1.unit53.lesson05.teach.tu_connais_deja:
    title: लोगों के साथ Plus ... que
    gloss: 'आप *plus* + विशेषण + *que* का ढाँचा पहले से जानते हैं। यहाँ इसे लोगों के लिए प्रयोग कीजिए: लेआ थॉमस से लंबी है।'
    note: वही *plus ... que* ढाँचा जो ख़रीदारी वाली इकाई में था, अब वस्तुओं की जगह लोगों के लिए। *Grande*, *Léa* के अनुसार बदलता है, क्योंकि वह लड़की है।
  fr.a1.unit53.lesson05.teach.lea_a_les:
    title: लेआ के बाल थॉमस से लंबे हैं
    gloss: लेआ के बाल थॉमस से लंबे हैं।
    note: '*Plus longs que*, *cheveux* (बहुवचन) के अनुसार बदलता है: *les cheveux plus longs que Thomas*।'
  fr.a1.unit53.lesson05.teach.j_ai_les:
    title: मेरे बाल छोटे और भूरे हैं
    gloss: मेरे बाल छोटे और भूरे हैं।
    note: '*J''ai ...* से बना उत्तम पुरुष का आदर्श वाक्य, जो अपना रूप-रंग बताते समय काम आएगा।'
  fr.a1.unit53.lesson06.teach.mathieu_regarde_c:
    title: मथियू को निना दिखती है
    gloss: 'मथियू: देखो, क्या वह निना है? उसके बाल छोटे और सुनहरे हैं और आँखें हरी हैं।'
    note: '*Regarde* (देखो), *regarder* का *tu* वाला आज्ञार्थ रूप है, जो पहले के एक संवाद में भी इसी तरह आया था।'
  fr.a1.unit53.lesson06.teach.camille_oui_c:
    title: कैमिल पुष्टि करती है
    gloss: 'कैमिल: हाँ, वह निना है!'
    note: एक छोटी, स्वाभाविक पुष्टि।
  fr.a1.unit53.lesson06.teach.nina_salut_tu:
    title: निना मथियू का अभिवादन करती है
    gloss: 'निना: नमस्ते, क्या तुम मथियू हो?'
    note: 'अनौपचारिक अभिवादन का एक सरल प्रश्न: *Tu es ... ?*'
  fr.a1.unit53.lesson06.teach.mathieu_oui_ravi:
    title: मथियू भी अभिवादन का उत्तर देता है
    gloss: 'मथियू: हाँ! तुमसे मिलकर खुशी हुई, निना।'
    note: '*Ravi de te rencontrer* पहली बार मिलने पर कहा जाने वाला सामान्य वाक्यांश है (पुरुष के लिए *ravi*, स्त्री के लिए *ravie*); *content de te revoir* नहीं, जो पहले से जान-पहचान वाले के लिए होता है।'
  fr.a1.unit53.lesson06.teach.nina_ravie_de:
    title: Nina भी अभिवादन लौटाती है
    gloss: 'Nina: तुमसे मिलकर मुझे भी खुशी हुई!'
    note: 'संवाद यहाँ पूरा होता है: मथियू ने कैमिल के वर्णन से निना को सफलतापूर्वक पहचान लिया।'
exercises:
  fr.a1.unit53.lesson01.exercise01.choose_lea_est_grande:
    instruction: '"Léa est grande." का हिंदी अर्थ चुनिए।'
    correct_option: लेआ लंबी है।
