course:
  title: फ़्रेंच A1
  description: बुनियादी तुलना (plus/moins/aussi... que) और अतिशयवाचक रूप (le/la plus...) सीखना। Inès और Mathieu की पाक-कला कार्यशाला की कहानी आगे बढ़ती है, जब वे ख़रीदारी करते हुए दो पनीरों की तुलना करते हैं। ध्यान रखें कि *meilleur* (बेहतर) और *le meilleur* (सबसे अच्छा) अनियमित रूप हैं, जबकि बाकी ज़्यादातर विशेषणों के लिए नियमित ढाँचा *plus... que* चलता है।
