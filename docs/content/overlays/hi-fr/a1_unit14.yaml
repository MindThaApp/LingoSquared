teaching:
  fr.a1.unit14.lesson01.teach.plus_que:
    title: '...से ज़्यादा'
    gloss: '...से ज़्यादा'
    note: फ़्रेंच में तुलना का सामान्य ढाँचा *plus + विशेषण + que* है; विशेषण के साथ कोई अलग प्रत्यय नहीं जुड़ता।
    example_gloss: यह पनीर दूसरे वाले से महँगा है।
  fr.a1.unit14.lesson01.teach.moins_que:
    title: '...से कम'
    gloss: '...से कम'
    note: इसी तुलना वाले ढाँचे में *moins*, *plus* का सीधा उलटा है।
    example_gloss: यह रेसिपी दूसरी वाली से कम मुश्किल है।
  fr.a1.unit14.lesson01.teach.aussi_que:
    title: उतना... जितना
    gloss: उतना... जितना
    note: '*Aussi + adjective + que* दो चीज़ों के बीच बराबरी दिखाता है।'
    example_gloss: टार्ट quiche जितना ही अच्छा है।
  fr.a1.unit14.lesson01.teach.meilleur_que:
    title: '...से बेहतर'
    gloss: '...से बेहतर'
    note: '*Meilleur*, *bon* (अच्छा) का अनियमित तुलनात्मक रूप है; फ़्रेंच में *plus bon* नहीं कहा जाता।'
    example_gloss: यह केक पहले वाले से बेहतर है।
  fr.a1.unit14.lesson01.teach.cher_bon_marche:
    title: महँगा, सस्ता
    gloss: महँगा, सस्ता / किफ़ायती
    note: '*Bon marché* अपरिवर्तनीय है, यानी इसका रूप कभी नहीं बदलता, चाहे यह दूसरे विशेषणों की तरह बदलने वाला लगे।'
    example_gloss:
    - यह पनीर महँगा है।
    - सब्ज़ियाँ सस्ती हैं।
  fr.a1.unit14.lesson01.teach.facile_difficile:
    title: आसान, मुश्किल
    gloss: आसान, मुश्किल
    note: रेसिपी बताने के लिए विशेषणों की एक आम जोड़ी; दोनों का पुल्लिंग और स्त्रीलिंग रूप एक ही है, और बहुवचन में -s जुड़ता है (*faciles*, *difficiles*)।
    example_gloss:
    - यह रेसिपी आसान है।
    - यह quiche थोड़ी मुश्किल है।
  fr.a1.unit14.lesson02.teach.le_plus_cher:
    title: सबसे महँगा
    gloss: सबसे महँगा
    note: '*Le/la plus + विशेषण* से अतिशयवाचक रूप बनता है; तुलनात्मक रूप के उलट इसमें निश्चित उपपद ज़रूरी है।'
    example_gloss: यह बाज़ार का सबसे महँगा पनीर है।
  fr.a1.unit14.lesson02.teach.la_moins_chere:
    title: सबसे सस्ती
    gloss: सबसे सस्ती
    note: '*La moins chère* स्त्रीलिंग *recette* के अनुसार बना है; पुल्लिंग रूप *le moins cher* है।'
    example_gloss: यह सबसे सस्ती रेसिपी है।
  fr.a1.unit14.lesson02.teach.le_meilleur:
    title: सबसे अच्छा
    gloss: सबसे अच्छा
    note: '*Le meilleur*, *bon* का अनियमित अतिशयवाचक रूप है, जो पिछले पाठ के अनियमित तुलनात्मक रूप *meilleur* से जुड़ा है।'
    example_gloss: यह कार्यशाला का सबसे बढ़िया केक है!
  fr.a1.unit14.lesson02.teach.la_plus_facile:
    title: सबसे आसान
    gloss: सबसे आसान
    note: नियमित अतिशयवाचक रूप, जो सीधे *le/la plus + विशेषण* ढाँचे पर चलता है।
    example_gloss: यह बनाने में सबसे आसान रेसिपी है।
  fr.a1.unit14.lesson02.teach.grammar_superlative_note:
    title: अतिशयवाचक रूप का ढाँचा
    gloss: le/la plus + विशेषण; meilleur अनियमित है
    note: फ़्रेंच के ज़्यादातर अतिशयवाचक रूप नियमित हैं (*le/la plus + विशेषण*), पर *bon* → *meilleur* → *le meilleur* याद रखने वाला अपवाद है।
  fr.a1.unit14.lesson02.teach.comparer_les_prix:
    title: दामों की तुलना का सुझाव देना
    gloss: आइए ख़रीदने से पहले दामों की तुलना करें।
    note: '*Comparons*, *comparer* का *nous* वाला आज्ञार्थ रूप है, यानी ''आइए तुलना करें''; ख़रीदारी में बोला जाने वाला स्वाभाविक वाक्यांश।'
  fr.a1.unit14.lesson03.teach.line01:
    title: दो विकल्प देखना
    gloss: 'Inès कहती है: देखो, पनीर की दो किस्में हैं; कौन-सा लें?'
    note: '*Lequel* (कौन-सा) सामने रखे दो विकल्पों में से एक चुनने के लिए कहता है।'
  fr.a1.unit14.lesson03.teach.line02:
    title: तुलना करना और गुणवत्ता बताना
    gloss: Mathieu कहता है कि यह वाला दूसरे से महँगा है, पर बेहतर लगता है।
    note: '*Avoir l''air* + विशेषण (लगना) गुणवत्ता के बारे में ऐसी बात को नरम करता है जिसे अभी चखा नहीं गया है।'
  fr.a1.unit14.lesson03.teach.line03:
    title: तुलना से असहमति जताना
    gloss: Inès पूछती है कि क्या उसे ऐसा सच में लगता है, और कहती है कि उसे दूसरा वाला उतना ही अच्छा और सस्ता लगता है।
    note: एक ही जवाब में पिछले पाठ के *aussi* और *moins* से विनम्र असहमति जताई गई है; *que* छोड़ दिया गया है क्योंकि संदर्भ से साफ़ है कि तुलना Mathieu वाले पनीर से हो रही है।
  fr.a1.unit14.lesson03.teach.line04:
    title: क़ीमत वाली बात मान लेना
    gloss: 'Mathieu सहमत होता है: सही है, दोनों में यही सबसे सस्ता है।'
    note: '*Des deux* (दोनों में से) अतिशयवाचक रूप को सिर्फ़ इसी जोड़ी तक सीमित करता है, पूरे बाज़ार तक नहीं।'
  fr.a1.unit14.lesson03.teach.line05:
    title: अंतिम फ़ैसला लेना
    gloss: 'Inès कहती है: तो वही वाला लेते हैं, कार्यशाला के लिए यही सबसे अच्छा विकल्प है।'
    note: '*Celui-là* (वह वाला) अभी-अभी चर्चा किए गए सस्ते पनीर की ओर इशारा करता है।'
  fr.a1.unit14.lesson03.teach.line06:
    title: फ़ायदे की बात कहना
    gloss: Mathieu सहमत है और कहता है कि मिठाई के लिए उनके पास ज़्यादा पैसे बचेंगे!
    note: '*Il nous reste* (शब्दशः: हमारे लिए बचा है) ''हमारे पास... बचा है'' कहने का आम तरीक़ा है।'
