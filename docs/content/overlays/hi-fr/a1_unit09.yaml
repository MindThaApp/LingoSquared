teaching:
  fr.a1.unit09.lesson01.teach.a_gauche:
    title: बाईं ओर
    gloss: बाईं ओर / बाएँ
    note: '*À gauche* का प्रयोग स्थिति ("यह बाईं ओर है") और दिशा ("बाएँ मुड़िए") दोनों के लिए होता है।'
    example_gloss: बेकरी के बाद बाएँ मुड़िए।
  fr.a1.unit09.lesson01.teach.a_droite:
    title: दाईं ओर
    gloss: दाईं ओर / दाएँ
    note: यह *à gauche* का सीधा उलटा है और उसी तरह प्रयोग होता है।
    example_gloss: दवाखाना कैफ़े के दाईं ओर है।
  fr.a1.unit09.lesson01.teach.tout_droit:
    title: सीधे आगे
    gloss: सीधे आगे
    note: '*Tout droit* का अर्थ "सीधे आगे" है। इसे *à droite* ("दाईं ओर") से न मिलाइए; दोनों देखने में मिलते-जुलते हैं, पर अर्थ अलग हैं।'
    example_gloss: बाज़ार तक सीधे चलते रहिए।
  fr.a1.unit09.lesson01.teach.au_coin_de_la_rue:
    title: गली के कोने पर
    gloss: गली के कोने पर
    note: '*Au coin de* का अर्थ "…के कोने पर" है; *au coin de la rue* (गली के कोने पर) पहचान-स्थल बताने वाला बहुत आम वाक्यांश है।'
    example_gloss: दुकान गली के कोने पर है।
  fr.a1.unit09.lesson01.teach.traverser:
    title: पार करना
    gloss: पार करना
    note: '*Traverser* एक नियमित -ER क्रिया है: *je traverse*, *tu traverses*, और इसी तरह आगे।'
    example_gloss: दुकान तक पहुँचने के लिए आपको सड़क पार करनी होगी।
  fr.a1.unit09.lesson01.teach.la_boutique:
    title: दुकान
    gloss: दुकान
    note: '*La boutique* आम तौर पर किसी खास सामान की छोटी दुकान को कहते हैं, बड़े स्टोर को नहीं।'
    example_gloss: दुकान गली के कोने पर, दाईं ओर है।
  fr.a1.unit09.lesson01.teach.le_carrefour:
    title: चौराहा
    gloss: चौराहा
    note: '*Le carrefour* वह जगह है जहाँ दो सड़कें एक-दूसरे को काटती हैं; बोलचाल में रास्ता बताते समय यह आम पहचान-स्थल है।'
    example_gloss: चौराहे पर बाएँ मुड़िए।
  fr.a1.unit09.lesson02.teach.pour_aller_a:
    title: कहीं पहुँचने का रास्ता पूछें
    gloss: माफ़ कीजिए, दुकान तक कैसे पहुँचूँ, कृपया?
    note: '*Pour aller à... ?* (शाब्दिक अर्थ: "…तक जाने के लिए") किसी जगह का रास्ता पूछने का सामान्य विनम्र तरीका है।'
  fr.a1.unit09.lesson02.teach.tournez_a_gauche:
    title: बाएँ मुड़ें
    gloss: दवाखाने के बाद बाएँ मुड़िए।
    note: '*Tournez*, *tourner* (मुड़ना) का *vous* वाला आज्ञार्थ रूप है; जिसे आप अच्छी तरह नहीं जानते, उसे रास्ता बताते समय यही सामान्य शैली है।'
  fr.a1.unit09.lesson02.teach.continuez_tout_droit:
    title: सीधे चलते रहिए
    gloss: चौराहे तक सीधे चलते रहिए।
    note: '*Continuez* (चलते रहिए) + *tout droit* (सीधे आगे) बिना मुड़े चलते रहने को कहने का सामान्य तरीका है।'
  fr.a1.unit09.lesson02.teach.cest_au_coin:
    title: जगह बताइए
    gloss: यह गली के कोने पर, दाईं ओर है।
    note: यहाँ *au coin de la rue* और *à droite* को जोड़कर ठीक-ठीक जगह बताई गई है।
  fr.a1.unit09.lesson02.teach.cest_loin:
    title: बताइए कि यह दूर नहीं है
    gloss: यह दूर नहीं है, पैदल पाँच मिनट का रास्ता है।
    note: '*À cinq minutes à pied* (पैदल पाँच मिनट) पैदल दूरी बताने का वही ढंग है जो आपने तब देखा था जब माथ्यू ने दवाखाने के बारे में पूछा था।'
  fr.a1.unit09.lesson03.teach.line01:
    title: दुकान के बारे में पूछिए
    gloss: इनेस माथ्यू से पूछती है कि क्या वह रसोई के बर्तन खरीदने की कोई दुकान जानता है।
    note: '*Tu connais... ?* (क्या तुम जानते हो) किसी से यह पूछने का अनौपचारिक तरीका है कि वह कोई जगह जानता है या नहीं।'
  fr.a1.unit09.lesson03.teach.line02:
    title: पहला चरण बताएँ
    gloss: माथ्यू कहता है कि हाँ, यहाँ से पास ही एक है; चौराहे पर बाएँ मुड़ना होगा।
    note: '*Il y en a une* (एक है) में *en*, *boutique* को दोहराने से बचाता है; बोलचाल की फ़्रेंच में यह बहुत आम तरीका है।'
  fr.a1.unit09.lesson03.teach.line03:
    title: पुष्टि करें और आगे पूछें
    gloss: इनेस पुष्टि करती है कि चौराहे पर बाएँ मुड़ना है, और पूछती है कि आगे क्या करना है।
    note: '*Et ensuite ?* (और फिर?) अगला कदम पूछने का सीधा और स्वाभाविक तरीका है।'
  fr.a1.unit09.lesson03.teach.line04:
    title: दूसरा चरण बताएँ
    gloss: माथ्यू कहता है कि फिर सीधे चलते रहो और सड़क पार करो।
    note: दो दिशा-क्रियाएँ *et* से जुड़ी हैं; छोटा-सा रास्ता बताने का यह स्वाभाविक ढंग है।
  fr.a1.unit09.lesson03.teach.line05:
    title: ठीक-ठीक जगह पूछिए
    gloss: इनेस पूछती है कि दुकान ठीक-ठीक कहाँ है।
    note: '*Exactement* (ठीक-ठीक) सामान्य दिशा से ज़्यादा सटीक उत्तर माँगता है।'
  fr.a1.unit09.lesson03.teach.line06:
    title: सटीक जगह बताइए
    gloss: माथ्यू कहता है कि वह गली के कोने पर, बेकरी के ठीक सामने है।
    note: '*En face de* (…के सामने) किसी पहचान-स्थल के सहारे जगह बताता है; रास्ता बताना पूरा करने का यह स्वाभाविक तरीका है।'
