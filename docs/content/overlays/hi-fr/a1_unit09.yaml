course:
  title: फ़्रेंच A1
  description: रास्ता पूछना और बताना सीखना (à gauche/à droite, tout droit, au coin de la rue, traverser)। इनेस और माथ्यू की कुकिंग वर्कशॉप की कहानी आगे बढ़ती है, जब इनेस रसोई के सामान की दुकान ढूँढ़ती है। फ़्रेंच में रास्ता vous वाली आज्ञार्थ क्रिया ("Tournez à gauche") से भी बताया जा सकता है और वर्तमान काल ("Tu tournes à gauche") से भी।
