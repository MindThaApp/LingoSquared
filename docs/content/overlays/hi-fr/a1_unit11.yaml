course:
  title: फ़्रेंच A1
  description: 'एक सरल योजना का प्रस्ताव रखना, स्वीकार करना, मना करना और समय तय करना। Inès और Mathieu की कुकिंग-वर्कशॉप की कहानी आगे बढ़ती है, जब वे शनिवार के सत्र से पहले साथ मिलकर सामान ख़रीदने की योजना बनाते हैं। यहाँ ख़ास ध्यान इन पर है: *se retrouver* (मिलना, पारस्परिक आत्मवाचक क्रिया) और *vers* + समय, जो अनुमानित समय बताता है, ठीक समय नहीं।'
