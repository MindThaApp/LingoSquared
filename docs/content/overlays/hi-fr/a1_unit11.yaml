teaching:
  fr.a1.unit11.lesson01.teach.libre:
    title: खाली / उपलब्ध
    gloss: खाली / उपलब्ध
    note: यहाँ *libre* किसी व्यक्ति के खाली होने को बताता है; जिस चीज़ के पैसे न लगें, उसके लिए फ़्रेंच में *gratuit* कहते हैं।
    example_gloss: क्या तुम शनिवार को खाली हो?
  fr.a1.unit11.lesson01.teach.occupe:
    title: व्यस्त
    gloss: व्यस्त
    note: '*libre* का सीधा उलटा। लिंग के अनुसार बदलता है: *occupé* / *occupée*।'
    example_gloss: मैं शुक्रवार शाम को व्यस्त हूँ।
  fr.a1.unit11.lesson01.teach.se_retrouver:
    title: मिलना
    gloss: मिलना
    note: इस अर्थ में *se retrouver* पारस्परिक है, यानी दो या अधिक लोग एक-दूसरे से मिलते हैं। यह *trouver* (ढूँढ़ना, पाना) से अलग है।
    example_gloss: हम आज शाम कहाँ मिल रहे हैं?
  fr.a1.unit11.lesson01.teach.vers:
    title: लगभग (समय के लिए)
    gloss: लगभग / के आसपास (समय के लिए)
    note: '*Vers* + समय अनुमानित समय बताता है, जो ठीक घंटा बताने से नरम लगता है।'
    example_gloss: मैं सात बजे के आसपास आऊँगा।
  fr.a1.unit11.lesson01.teach.ca_te_dit_de:
    title: क्यों न... ?
    gloss: साथ मिलकर ख़रीदारी करने चलें?
    note: '*Ça te dit de... ?* + क्रिया का मूल रूप, कुछ करने का प्रस्ताव रखने का आम और अनौपचारिक तरीक़ा है। यह *Voulez-vous... ?* से ज़्यादा सहज है।'
  fr.a1.unit11.lesson01.teach.venir_chercher:
    title: किसी को लेने आना
    gloss: क्या तुम मुझे लगभग शाम छह बजे लेने आ रहे हो?
    note: '*Venir chercher quelqu''un* का अर्थ है किसी को लेने आना, सिर्फ़ "खोजना" नहीं।'
  fr.a1.unit11.lesson01.teach.daccord_a_tout_a_lheure:
    title: ठीक है, जल्द मिलते हैं
    gloss: ठीक है, थोड़ी देर में मिलते हैं!
    note: '*D''accord* (ठीक है) योजना पक्की करता है; *à tout à l''heure* उसी दिन किसी से दोबारा मिलने पर कहा जाता है।'
  fr.a1.unit11.lesson02.teach.je_ne_peux_pas:
    title: योजना के लिए मना करना
    gloss: मैं नहीं आ सकता, मैं व्यस्त हूँ।
    note: '*Je ne peux pas* (मैं नहीं कर सकता) + कारण, विनम्रता से मना करने का सरल तरीक़ा है।'
  fr.a1.unit11.lesson02.teach.avec_plaisir:
    title: ख़ुशी से स्वीकार करना
    gloss: ख़ुशी से!
    note: '*Avec plaisir* (शाब्दिक अर्थ "ख़ुशी के साथ") निमंत्रण को गर्मजोशी और उत्साह से स्वीकार करने का तरीक़ा है।'
  fr.a1.unit11.lesson02.teach.a_quelle_heure_on_se_voit:
    title: समय पूछना
    gloss: हम कितने बजे मिल रहे हैं?
    note: '*On se voit* (अनौपचारिक, "हम एक-दूसरे को देखते हैं") मिलने की योजना बनाने के लिए *se retrouver* का आम और सहज विकल्प है।'
  fr.a1.unit11.lesson02.teach.devant_le_marche:
    title: जगह सुझाना
    gloss: बाज़ार के सामने, चलेगा?
    note: '*Ça te va ?* (क्या यह तुम्हें ठीक लगता है?) पूछता है कि सुझाई गई बात दूसरे को मंज़ूर है या नहीं।'
  fr.a1.unit11.lesson02.teach.parfait_alors:
    title: योजना पक्की करना
    gloss: बढ़िया, तो शुक्रवार को मिलते हैं!
    note: यहाँ *alors* का अर्थ "तो" है, जो तय बात को पक्का करता है और योजना की बातचीत को समाप्त करता है।
  fr.a1.unit11.lesson03.teach.line01:
    title: साथ ख़रीदारी का प्रस्ताव
    gloss: Inès, Mathieu से पूछती है कि क्या वह वर्कशॉप से पहले साथ ख़रीदारी करना चाहेगा।
    note: '*Ça te dit de... ?* एक सहज सुझाव के साथ बातचीत शुरू करता है।'
  fr.a1.unit11.lesson03.teach.line02:
    title: हामी भरना और जगह पूछना
    gloss: Mathieu ख़ुशी से हाँ कहता है और पूछता है कि कहाँ मिलना है।
    note: यह *Avec plaisir* (ख़ुशी से) और *se retrouver* (मिलना) को जोड़ता है।
  fr.a1.unit11.lesson03.teach.line03:
    title: जगह और दिन सुझाना
    gloss: Inès शुक्रवार शाम को बाज़ार के सामने मिलने का सुझाव देती है।
    note: जगह (*devant le marché*) और दिन (*vendredi soir*) को जोड़ने वाला एक छोटा प्रस्ताव।
  fr.a1.unit11.lesson03.teach.line04:
    title: हामी भरना और समय पूछना
    gloss: Mathieu सहमत होता है और समय पूछता है।
    note: '*D''accord* जगह और दिन को पक्का करता है; अगला सवाल ठीक समय तय करता है।'
  fr.a1.unit11.lesson03.teach.line05:
    title: ख़ास समय सुझाना
    gloss: Inès पूछती है कि क्या Mathieu उसे लगभग शाम छह बजे लेने आएगा।
    note: यहाँ एक ख़ास घंटे के साथ *venir chercher* + *vers* का प्रयोग हुआ है।
  fr.a1.unit11.lesson03.teach.line06:
    title: सब कुछ पक्का करना
    gloss: Mathieu कहता है कि बढ़िया, तो शुक्रवार को मिलते हैं, शाम छह बजे बाज़ार के सामने।
    note: योजना की तीनों बातें (दिन, समय, जगह) एक साथ दोहराकर बातचीत साफ़ तरीक़े से समाप्त की जाती है।
