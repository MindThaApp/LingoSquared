teaching:
  fr.a1.unit08.lesson01.teach.lundi:
    title: सोमवार
    gloss: सोमवार
    note: फ़्रेंच में सप्ताह के दिन पुल्लिंग होते हैं और उन्हें बड़े अक्षर से नहीं लिखा जाता।
    example_gloss: कार्यशाला कभी सोमवार को नहीं लगती।
  fr.a1.unit08.lesson01.teach.samedi:
    title: शनिवार
    gloss: शनिवार
    note: '*Le samedi* (उपपद के साथ) का अर्थ है "हर शनिवार", यानी आदत या नियम की तरह; अकेला *samedi* किसी एक ख़ास शनिवार को बताता है, यानी सबसे नज़दीकी शनिवार, जो क्रिया के काल के अनुसार आने वाला या बीता हुआ हो सकता है।'
    example_gloss: कार्यशाला हर शनिवार को होती है।
  fr.a1.unit08.lesson01.teach.dimanche:
    title: रविवार
    gloss: रविवार
    note: दूसरे दिनों की तरह यह भी पुल्लिंग है और बड़े अक्षर से नहीं लिखा जाता।
    example_gloss: बेकरी रविवार को बंद रहती है।
  fr.a1.unit08.lesson01.teach.aujourdhui:
    title: आज
    gloss: आज
    note: '*Aujourd''hui* एक ही अखंड शब्द है, हालाँकि इतिहास में यह कई हिस्सों को जोड़कर बना है।'
    example_gloss: आज शनिवार है।
  fr.a1.unit08.lesson01.teach.demain:
    title: कल (आने वाला)
    gloss: कल
    note: '*Demain* अपरिवर्तनीय है; हर संदर्भ में एक ही रूप में इस्तेमाल होता है।'
    example_gloss: दवाखाना कल खुलेगा।
  fr.a1.unit08.lesson01.teach.hier:
    title: कल (बीता हुआ)
    gloss: बीता हुआ कल
    note: '*Hier* का अर्थ *demain* के ठीक उलट है।'
    example_gloss: मैंने कल मछली खाई।
  fr.a1.unit08.lesson01.teach.quel_jour_sommes_nous:
    title: दिन पूछना
    gloss: आज कौन-सा दिन है?
    note: '*Quel jour sommes-nous ?* (शब्दशः "हम कौन-से दिन में हैं") सप्ताह का दिन पूछने का सामान्य तरीक़ा है।'
  fr.a1.unit08.lesson02.teach.mars:
    title: मार्च
    gloss: मार्च
    note: फ़्रेंच में महीने भी दिनों की तरह पुल्लिंग होते हैं और बड़े अक्षर से नहीं लिखे जाते।
    example_gloss: कार्यशाला मार्च में समाप्त होती है।
  fr.a1.unit08.lesson02.teach.quelle_est_la_date:
    title: तारीख़ पूछना
    gloss: आज की तारीख़ क्या है?
    note: '*Quelle est la date... ?* पूरी तारीख़ पूछने का सामान्य तरीक़ा है, जबकि *Quel jour sommes-nous ?* केवल सप्ताह का दिन पूछता है।'
  fr.a1.unit08.lesson02.teach.cest_le_quinze_mars:
    title: तारीख़ बताना
    gloss: पंद्रह मार्च है।
    note: '*Le* + गणनावाचक संख्या + महीना फ़्रेंच में तारीख़ कहने का सामान्य ढाँचा है; यहाँ *quinze* (पंद्रह) है, क्रमसूचक संख्या "पंद्रहवाँ" नहीं।'
  fr.a1.unit08.lesson02.teach.nous_sommes_le:
    title: आज की तारीख़ बताना
    gloss: आज पंद्रह मार्च है।
    note: आज की तारीख़ बताने के लिए *Nous sommes le...* भी *C'est le...* जितना ही प्रचलित विकल्प है।
  fr.a1.unit08.lesson02.teach.le_premier:
    title: महीने की पहली तारीख़
    gloss: पहला
    note: '*Le premier* गणनावाचक संख्या के नियम का इकलौता अपवाद है; महीने के बाक़ी हर दिन में सादी गणनावाचक संख्या आती है (*le deux*, *le trois*...), पर पहली तारीख़ के लिए क्रमसूचक *premier* आता है।'
  fr.a1.unit08.lesson02.teach.le_vingt_deux:
    title: समाप्ति की तारीख़ बताना
    gloss: कार्यशाला बाईस मार्च को समाप्त होती है।
    note: '*Se termine* (समाप्त होती है) एक आत्मवाचक क्रिया है; *vingt-deux* सादी गणनावाचक संख्या है और यहाँ भी वही नियम लागू है जो *le quinze mars* में है।'
  fr.a1.unit08.lesson03.teach.line01:
    title: पूछना कि आख़िरी सत्र कब है
    gloss: इनेस पूछती है कि कार्यशाला का आख़िरी सत्र कब है।
    note: '*C''est quand... ?* (यह कब है) समय के बारे में पूछने का सहज और सरल तरीक़ा है।'
  fr.a1.unit08.lesson03.teach.line02:
    title: तारीख़ और दिन बताना
    gloss: माथ्यू कहता है कि उसके ख़्याल से बाईस मार्च है, और वह शनिवार है।
    note: '*Un samedi* (*le* के बिना) बस यह बताता है कि वह तारीख़ सप्ताह के किस दिन पड़ती है।'
  fr.a1.unit08.lesson03.teach.line03:
    title: आज की तारीख़ पूछना
    gloss: इनेस पूछती है कि आज की तारीख़ क्या है।
    note: यह वही *Quelle est la date aujourd'hui ?* है जो आपने तारीख़ पूछने के लिए सीखा था।
  fr.a1.unit08.lesson03.teach.line04:
    title: आज की तारीख़ और बीच का अंतर बताना
    gloss: माथ्यू कहता है कि आज पंद्रह मार्च है, यानी सत्र एक हफ़्ते बाद है।
    note: '*Dans une semaine* (एक हफ़्ते में) आज से कितनी दूरी पर समय है, यह बताता है।'
  fr.a1.unit08.lesson03.teach.line05:
    title: योजना के साथ प्रतिक्रिया देना
    gloss: इनेस कहती है कि बहुत बढ़िया, उसके पास इस मौक़े के लिए मिठाई बनाने का समय है।
    note: '*J''ai le temps de* + क्रिया का मूल रूप (मेरे पास ... का समय है) यह कहने का आम तरीक़ा है कि किसी काम के लिए पर्याप्त समय है।'
  fr.a1.unit08.lesson03.teach.line06:
    title: योजना पक्की करना
    gloss: माथ्यू कहता है कि अच्छा विचार है, तो अगले शनिवार, बाईस तारीख़ को मिलते हैं।
    note: '*Samedi prochain* (अगला शनिवार) दिन का नाम और तारीख़, दोनों को साथ पक्का करके बातचीत समाप्त करता है।'
