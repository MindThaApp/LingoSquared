course:
  title: फ़्रेंच A1
  description: सप्ताह के दिन और कैलेंडर की तारीख़ बताना (le + गणनावाचक संख्या + महीना; केवल le premier क्रमसूचक संख्या का अपवाद है)। इनेस और माथ्यू की कुकिंग कार्यशाला की कहानी आगे बढ़ती है और वे उसके आख़िरी सत्र की योजना बनाते हैं। फ़्रेंच में महीने की हर तारीख़ गणनावाचक संख्या से कही जाती है, जैसे le quinze mars; केवल पहली तारीख़ इसका अपवाद है।
