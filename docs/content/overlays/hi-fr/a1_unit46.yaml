    - मेरे पास एक बैठक है।
    - मेरे पास एक शयनकक्ष है।
  fr.a1.unit46.lesson01.teach.la_cuisine_la:
    title: रसोई, स्नानघर
    gloss: रसोई, स्नानघर
    note: '*La cuisine* और *la salle de bains* दोनों स्त्रीलिंग हैं।'
    example_gloss:
    - मेरे पास एक रसोई है।
    - मेरे पास एक स्नानघर है।
  fr.a1.unit46.lesson01.teach.j_ai_un:
    title: अपार्टमेंट होने की बात कहना
    gloss: मेरे पास एक अपार्टमेंट है।
    note: यह बताने के लिए कि आपके पास कैसा घर है, *avoir* (के पास होना) स्वाभाविक क्रिया है। यह एक सामान्य उदाहरण है; Mathieu का अपना अपार्टमेंट (Lyon में) इसी यूनिट में आगे आएगा।
  fr.a1.unit46.lesson01.teach.j_ai_un_2:
    title: सभी कमरों की सूची बताना
    gloss: मेरे पास एक बैठक, एक शयनकक्ष, एक रसोई और एक स्नानघर है।
    note: इस पाठ की शब्दावली के चारों कमरे एक ही वाक्य में हैं। इन्हें अल्पविराम से जोड़ा गया है और अंत में *et* आता है।
  fr.a1.unit46.lesson02.teach.tu_as_combien:
    title: कमरों की संख्या पूछना
    gloss: आपके पास कितने कमरे हैं?
    note: '*Combien de* (कितने) के बाद बहुवचन संज्ञा आती है: *combien de pièces*।'
  fr.a1.unit46.lesson02.teach.j_ai_deux:
    title: कमरों की संख्या बताना
    gloss: मेरे पास दो शयनकक्ष हैं।
    note: '*Chambres*, *chambre* का बहुवचन है। यह नियमित रूप से अंत में मौन *-s* जोड़कर बनता है।'
  fr.a1.unit46.lesson02.teach.l_appartement_a:
    title: कुल कमरों की संख्या बताना
    gloss: अपार्टमेंट में तीन कमरे हैं।
    note: '*Pièces* कमरों के लिए सामान्य शब्द है। यह केवल शयनकक्षों तक सीमित नहीं है।'
  fr.a1.unit46.lesson03.teach.le_balcon_le:
    title: बालकनी, बगीचा
    gloss: बालकनी, बगीचा
    note: '*Le balcon* और *le jardin* दोनों पुल्लिंग हैं।'
    example_gloss:
    - एक बालकनी है।
    - कोई बगीचा नहीं है।
  fr.a1.unit46.lesson03.teach.il_y_a:
    title: किसी चीज़ के होने की बात कहना
    gloss: एक बालकनी है।
    note: '*Il y a* किसी चीज़ के होने को बताने का सामान्य ढाँचा है, हिंदी के "...है" की तरह।'
  fr.a1.unit46.lesson03.teach.il_n_y:
    title: किसी चीज़ के न होने की बात कहना
    gloss: कोई बगीचा नहीं है।
    note: '*Pas de* अनिश्चित संज्ञा का निषेध करता है: *pas de jardin*, *pas un jardin* नहीं।'
  fr.a1.unit46.lesson04.teach.cosy:
    title: आरामदायक
    gloss: आरामदायक
    note: यह गर्मजोशी भरे, सुखद माहौल के लिए इस्तेमाल होने वाला बहुत आम और खास फ़्रेंच विशेषण है।
    example_gloss: अपार्टमेंट छोटा है, लेकिन आरामदायक है।
  fr.a1.unit46.lesson04.teach.l_appartement_est:
    title: वर्णन का एक आम ढंग
    gloss: अपार्टमेंट छोटा है, लेकिन आरामदायक है।
    note: छोटे घर का सकारात्मक वर्णन करने के लिए फ़्रेंच बोलने वाले *petit mais cosy* बहुत स्वाभाविक ढंग से कहते हैं।
  fr.a1.unit46.lesson04.teach.le_salon_est:
    title: कमरे का आकार बताना
    gloss: बैठक बड़ी है।
    note: '*Grand* पूरे घर का नहीं, किसी एक कमरे का वर्णन करता है। यह *le salon* के अनुसार पुल्लिंग रूप में है।'
  fr.a1.unit46.lesson04.teach.la_cuisine_est:
    title: दूसरे कमरे का आकार बताना
    gloss: रसोई छोटी है।
    note: 'ढाँचा पिछले कार्ड के *grand* जैसा ही है, बस कमरा दूसरा है: *la cuisine* स्त्रीलिंग है, इसलिए *petite*।'
  fr.a1.unit46.lesson05.teach.appartement_a_lyon:
    title: मकान का विज्ञापन पढ़ना
    gloss: 'Lyon में अपार्टमेंट: एक शयनकक्ष, एक बैठक, एक रसोई और एक स्नानघर। एक बालकनी है, लेकिन बगीचा नहीं है। अपार्टमेंट छोटा है, लेकिन आरामदायक है।'
    note: 'ध्यान दीजिए: कितने कमरे हैं, कौन-सी सुविधाएँ हैं और कौन-सी नहीं, और कुल मिलाकर कैसा प्रभाव दिया गया है।'
    glosses:
      Appartement: अपार्टमेंट
      chambre: शयनकक्ष
      salon: बैठक
      cuisine: रसोई
      bains: स्नानघर
      balcon: बालकनी
      jardin: बगीचा
      petit: छोटा
      cosy: आरामदायक
  fr.a1.unit46.lesson06.teach.camille_salut_mathieu:
    title: Camille अपार्टमेंट के बारे में पूछती है
    gloss: 'Camille: नमस्ते Mathieu, Lyon में तुम्हारा नया अपार्टमेंट कैसा है?'
    note: '*Nouvel*, *nouveau* (नया) का वह रूप है जो स्वर से शुरू होने वाली पुल्लिंग संज्ञा से पहले आता है: *un nouvel appartement*।'
  fr.a1.unit46.lesson06.teach.mathieu_il_est:
    title: Mathieu उसका वर्णन करता है
    gloss: 'Mathieu: वह छोटा है, लेकिन आरामदायक है। मेरे पास एक शयनकक्ष, एक बैठक, एक रसोई और एक स्नानघर है।'
    note: यह पहले पढ़े गए मकान के विज्ञापन से बिल्कुल मेल खाता है। यही Mathieu का असली अपार्टमेंट है।
  fr.a1.unit46.lesson06.teach.camille_tu_as:
    title: Camille बालकनी के बारे में पूछती है
    gloss: 'Camille: क्या तुम्हारे पास बालकनी है?'
    note: '*Tu as ... ?* से बना सीधा हाँ/नहीं वाला प्रश्न।'
  fr.a1.unit46.lesson06.teach.mathieu_oui_j:
    title: Mathieu जवाब देता है
    gloss: 'Mathieu: हाँ, मेरे पास बालकनी है, लेकिन बगीचा नहीं है।'
    note: 'यह विज्ञापन में बताई गई बात से मेल खाता है: बालकनी है, बगीचा नहीं।'
  fr.a1.unit46.lesson06.teach.balcon_est_masculin:
    title: balcon का लिंग
    gloss: '*Balcon* पुल्लिंग है: एक बालकनी, वह छोटी है।'
    note: '*Il* (वह) *balcon* जैसी पुल्लिंग संज्ञा की जगह आता है, इसलिए विशेषण भी पुल्लिंग होता है: *il est petit*।'
  fr.a1.unit46.lesson06.teach.camille_ca_a:
    title: Camille गर्मजोशी से प्रतिक्रिया देती है
    gloss: 'Camille: लगता है बहुत अच्छा है! मैं जल्दी ही तुमसे मिलने आऊँगी।'
    note: '*Je passerai te voir* (मैं मिलने आऊँगी) में भविष्यकाल का *passerai* और *te voir* (तुम्हें देखने) आए हैं।'
  fr.a1.unit46.lesson06.teach.mathieu_super_tu:
    title: Mathieu उसका स्वागत करता है
    gloss: 'Mathieu: बहुत बढ़िया, तुम्हारा हमेशा स्वागत है।'
    note: '*Toujours la bienvenue* (हमेशा स्वागत है) किसी को दोबारा बुलाने का आत्मीय ढंग है। यहाँ *bienvenue* स्त्रीलिंग है, क्योंकि वह Camille के बारे में है।'
