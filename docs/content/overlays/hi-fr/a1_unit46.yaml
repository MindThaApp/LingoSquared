teaching:
  fr.a1.unit46.lesson01.teach.l_appartement_le:
    title: अपार्टमेंट, बैठक, शयनकक्ष
    gloss: अपार्टमेंट, बैठक, शयनकक्ष
    note: '*L''appartement* पुल्लिंग है और *le* का *e* हट जाता है; *le salon* पुल्लिंग है और *la chambre* स्त्रीलिंग है।'
