teaching:
  fr.a1.unit49.lesson01.teach.content_triste_en:
    title: खुश, उदास और नाराज़
    gloss: खुश, उदास, नाराज़
    note: भावनाओं के तीन बुनियादी शब्द, जो *être* (होना) के साथ आते हैं; *content* का स्त्रीलिंग रूप *contente* है, जबकि *triste* और *en colère* नहीं बदलते।
    example_gloss:
    - मैं खुश हूँ।
    - मैं उदास हूँ।
    - मैं नाराज़ हूँ।
  fr.a1.unit49.lesson01.teach.je_suis_content:
    title: खुश होने की बात कहना
    gloss: मैं खुश हूँ।
    note: '*Être* (होना) + भावना बताने वाला विशेषण बुनियादी ढाँचा है, जैसे हिंदी में "मैं ... हूँ"।'
  fr.a1.unit49.lesson01.teach.je_ne_suis:
    title: भावनाओं की तुलना करना
    gloss: मैं नाराज़ नहीं हूँ, मैं उदास हूँ।
    note: '*Ne ... pas* क्रिया को घेरकर आता है; फिर दूसरा वाक्यांश असली भावना बताता है।'
  fr.a1.unit49.lesson02.teach.pourquoi_es_tu:
    title: कारण पूछना
    gloss: तुम खुश क्यों हो?
    note: '*Pourquoi* (क्यों) कारण पूछने का सामान्य प्रश्नवाचक शब्द है।'
  fr.a1.unit49.lesson02.teach.je_suis_content:
    title: कारण बताना
    gloss: मैं खुश हूँ क्योंकि मेरे पास नया अपार्टमेंट है।
    note: '*Parce que* (क्योंकि) कारण वाला वाक्यांश शुरू करता है; *il* से पहले यह छोटा होकर *parce qu''* बन जाता है।'
  fr.a1.unit49.lesson02.teach.je_suis_triste:
    title: नकारात्मक कारण
    gloss: मैं उदास हूँ क्योंकि बारिश हो रही है।
    note: मौसम वाले पाठ का *il pleut* (बारिश होती है) यहाँ कारण वाले वाक्यांश के रूप में दोबारा आया है।
  fr.a1.unit49.lesson03.teach.nerveux:
    title: घबराया हुआ
    gloss: घबराया हुआ
    note: घबराहट के लिए सामान्य शब्द।
    example_gloss: मैं अपनी पहली शिफ़्ट को लेकर घबराया हुआ हूँ।
  fr.a1.unit49.lesson03.teach.je_suis_nerveux:
    title: बताना कि किस बात से घबराहट है
    gloss: मैं अपनी पहली शिफ़्ट को लेकर घबराया हुआ हूँ।
    note: '*Avant* (शाब्दिक अर्थ "से पहले") बताता है कि घबराहट किस बात की है; हिंदी में इसके लिए "को लेकर" कहा जाता है।'
  fr.a1.unit49.lesson03.teach.ne_t_inquiete:
    title: किसी को तसल्ली देना
    gloss: चिंता मत करो।
    note: '*Ne t''inquiète pas* (शाब्दिक अर्थ "खुद को परेशान मत करो") तसल्ली देने का तयशुदा वाक्यांश है; *s''inquiéter* आत्मवाचक क्रिया है।'
  fr.a1.unit49.lesson04.teach.comment_se_sent:
    title: पूछना कि कोई कैसा महसूस करता है
    gloss: मैथ्यू कैसा महसूस कर रहा है?
    note: '*Se sentir* (महसूस करना, आत्मवाचक) भावनात्मक स्थिति पूछने या बताने का सामान्य तरीका है; यह स्वास्थ्य वाले पाठ में भी आता है।'
  fr.a1.unit49.lesson04.teach.il_se_sent:
    title: बताना कि कोई कैसा महसूस करता है
    gloss: वह घबराया हुआ महसूस कर रहा है।
    note: '*Se* (खुद को) अन्य पुरुष का आत्मवाचक सर्वनाम है, जो *sent* के साथ आता है।'
  fr.a1.unit49.lesson04.teach.pourquoi_se_sent:
    title: पूछना कि कोई ऐसा क्यों महसूस करता है
    gloss: वह घबराया हुआ क्यों महसूस कर रहा है?
    note: यह *pourquoi* को *Il se sent nerveux* के *se sentir* से जोड़ता है; *sent-il* हाइफ़न के साथ लिखा जाता है।
  fr.a1.unit49.lesson05.teach.salut_camille_je:
    title: भावनाओं के बारे में एक संदेश पढ़ें
    gloss: हाय कमिय, मैं अपनी पहली अकेली शिफ़्ट को लेकर थोड़ा घबराया हुआ हूँ। लेकिन मैं खुश भी हूँ, क्योंकि मेरे पास नई नौकरी और नया अपार्टमेंट है। मुझे लगता है सब ठीक हो जाएगा।
    note: ध्यान दें कि लिखने वाला किस बात से घबराया है, किस बात से खुश है, और कुल मिलाकर उसका नज़रिया क्या है।
    glosses:
      peu: थोड़ा
      nerveux: घबराया हुआ
      premier: पहली
      service: शिफ़्ट
      seul: अकेला
      content: खुश
      car: क्योंकि
      nouveau: नया
      travail: काम
      nouvel: नया
      appartement: अपार्टमेंट
      pense: सोचना, मानना
      aller: 'चल जाएगा (यहाँ: सब ठीक हो जाएगा)'
  fr.a1.unit49.lesson06.teach.camille_salut_mathieu:
    title: कमिय पूछती है कि मैथ्यू कैसा महसूस कर रहा है
    gloss: 'कमिय: हाय मैथ्यू, तुम अपनी पहली शिफ़्ट से पहले कैसा महसूस कर रहे हो?'
    note: '*Avant ton premier service* (तुम्हारी पहली शिफ़्ट से पहले) में तीसरे पाठ का *avant* + संज्ञा वाला ढाँचा दोबारा आया है।'
  fr.a1.unit49.lesson06.teach.mathieu_je_suis:
    title: मैथ्यू मानता है कि वह घबराया हुआ है
    gloss: 'मैथ्यू: सच कहूँ तो मैं थोड़ा घबराया हुआ हूँ।'
    note: '*Honnêtement* (सच कहूँ तो) इस स्वीकारोक्ति को नरम बना देता है।'
  fr.a1.unit49.lesson06.teach.camille_ne_t:
    title: कमिय उसे तसल्ली देती है
    gloss: 'कमिय: चिंता मत करो, तुम यह अच्छे से कर लोगे!'
    note: '*Tu vas y arriver* (शाब्दिक अर्थ "तुम वहाँ पहुँच जाओगे") हौसला बढ़ाने वाला तयशुदा वाक्यांश है; *aller* + क्रिया का मूल रूप निकट भविष्य बनाता है।'
  fr.a1.unit49.lesson06.teach.mathieu_merci_ca:
    title: मैथ्यू उसका शुक्रिया अदा करता है
    gloss: 'मैथ्यू: शुक्रिया, इससे सच में मदद मिलती है।'
    note: '*Aide* क्रिया *aider* (मदद करना) का *il/elle* वाला रूप है; *m''* का मतलब *me* है।'
  fr.a1.unit49.lesson06.teach.camille_et_apres:
    title: कमिय नतीजे का अनुमान लगाती है
    gloss: 'कमिय: और बाद में तुम यक़ीनन बहुत खुश और गर्वित होगे।'
    note: '*Sûrement* (यक़ीनन) भरोसे के साथ किया गया अनुमान बताता है; *fier* (गर्वित) एक नया और उपयोगी विशेषण है।'
  fr.a1.unit49.lesson06.teach.mathieu_oui_je:
    title: मैथ्यू सहमत होता है
    gloss: 'मैथ्यू: हाँ, मुझे भी ऐसा ही लगता है।'
    note: '*Je pense aussi* किसी की राय से सहमत होने का स्वाभाविक तरीका है।'
  fr.a1.unit49.lesson06.teach.il_remplace_mathieu:
    title: il, elle और l' से सारांश बताना
    gloss: मैथ्यू अपनी पहली शिफ़्ट को लेकर घबराया हुआ है। कमिय उसकी मदद करती है।
    note: '*Il* किसी पुरुष के नाम की जगह आता है (*il est nerveux*), *elle* किसी स्त्री के नाम की जगह आता है, और *l''* (*elle l''aide*) का मतलब "उसे" है: किसी और के बारे में बात करने के लिए ये तीन छोटे पर ज़रूरी शब्द हैं।'
