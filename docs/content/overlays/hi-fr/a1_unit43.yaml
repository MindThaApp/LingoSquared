teaching:
  fr.a1.unit43.lesson01.teach.le_billet:
    title: टिकट
    gloss: टिकट
    note: '*Billet* पुल्लिंग है: *le billet*, *un billet*।'
    example_gloss: मुझे Lyon का एक टिकट चाहिए।
  fr.a1.unit43.lesson01.teach.je_voudrais_un:
    title: टिकट माँगना
    gloss: मुझे Lyon का एक टिकट चाहिए।
    note: '*Je voudrais* अनुरोध को नरम बनाता है; यह *je veux* से ज़्यादा विनम्र है।'
  fr.a1.unit43.lesson01.teach.voulez_vous_un:
    title: कर्मचारी पूछता है कि कौन-सा टिकट
    gloss: आप एकतरफ़ा टिकट लेंगे या आने-जाने का?
    note: '*Voulez-vous*, *vouloir* का औपचारिक *vous* रूप है, जो यहाँ स्टेशन के अनजान कर्मचारी के लिए प्रयोग हुआ है।'
  fr.a1.unit43.lesson01.teach.un_aller_retour:
    title: विनम्रता से उत्तर देना
    gloss: आने-जाने का, कृपया।
    note: '*S''il vous plaît* औपचारिक “कृपया” है, जो बातचीत के *vous* वाले शिष्ट स्तर से मेल खाता है।'
  fr.a1.unit43.lesson01.teach.au_guichet_on:
    title: काउंटर पर संबोधन
    gloss: काउंटर पर आमतौर पर आदरसूचक रूप *vous* का प्रयोग होता है।
    note: सेवा देने वाले अनजान लोगों को *vous* कहा जाता है; दोस्तों और परिवार को *tu*।
  fr.a1.unit43.lesson02.teach.le_quai:
    title: प्लेटफ़ॉर्म
    gloss: प्लेटफ़ॉर्म
    note: '*Quai* पुल्लिंग है: *le quai*।'
    example_gloss: Lyon की ट्रेन किस प्लेटफ़ॉर्म से जाती है?
  fr.a1.unit43.lesson02.teach.de_quel_quai:
    title: प्लेटफ़ॉर्म पूछना
    gloss: Lyon की ट्रेन किस प्लेटफ़ॉर्म से जाती है?
    note: '*De quel quai* ख़ास तौर पर प्लेटफ़ॉर्म के बारे में पूछता है; *quel* पुल्लिंग संज्ञा *quai* के अनुसार है।'
  fr.a1.unit43.lesson02.teach.le_train_part:
    title: रवानगी की जानकारी देना
    gloss: ट्रेन पौने दस बजे प्लेटफ़ॉर्म पाँच से जाती है।
    note: '*Dix heures moins le quart* का अर्थ है पौने दस; फ़्रेंच में घंटे से पहले का समय *moins* (घटा) लगाकर कहा जाता है।'
  fr.a1.unit43.lesson02.teach.a_quelle_heure:
    title: पहुँचने का समय पूछना
    gloss: ट्रेन किस समय पहुँचती है?
    note: '*À quelle heure arrive ... ?* समय पूछता है; *arriver* नियमित *-er* क्रिया है: *le train arrive*।'
  fr.a1.unit43.lesson02.teach.le_train_arrive:
    title: पहुँचने का समय बताना
    gloss: ट्रेन ग्यारह बजे पहुँचती है।
    note: '*Arrive*, *arriver* का *il/elle* रूप है; *-er* क्रियाएँ *il* और *elle* के साथ *-e* पर समाप्त होती हैं।'
  fr.a1.unit43.lesson03.teach.a_l_heure:
    title: समय पर / देरी
    gloss: समय पर; देरी
    note: '*À l''heure* समय पर होने वाली बात के लिए एक स्थिर अभिव्यक्ति है। *Le retard* (देरी) पुल्लिंग है।'
    example_gloss:
    - ट्रेन समय पर नहीं जाती।
    - 'ध्यान दीजिए: Lyon की ट्रेन लेट है।'
  fr.a1.unit43.lesson03.teach.attention_le_train:
    title: एक घोषणा
    gloss: 'ध्यान दीजिए: Lyon की ट्रेन लेट है।'
    note: '*Attention* स्टेशन की घोषणा की शुरुआत में आता है, जैसे हिंदी में “यात्रीगण कृपया ध्यान दें।”'
  fr.a1.unit43.lesson03.teach.le_train_ne:
    title: '"समय पर" का निषेध'
    gloss: ट्रेन समय पर नहीं जाती।
    note: '*Ne ... pas* क्रिया को घेरता है: *ne part pas à l''heure*।'
  fr.a1.unit43.lesson03.teach.le_train_part:
    title: प्लेटफ़ॉर्म में बदलाव
    gloss: ट्रेन प्लेटफ़ॉर्म पाँच की जगह प्लेटफ़ॉर्म तीन से जाती है।
    note: '*Au lieu du* का अर्थ है “की जगह”; *de* + *le* मिलकर *du* बन जाता है।'
  fr.a1.unit43.lesson03.teach.le_train_a:
    title: देरी की अवधि बताना
    gloss: ट्रेन दस मिनट देरी से चल रही है।
    note: '*A ... de retard* (शाब्दिक अर्थ “के पास ... की देरी है”) किसी के लेट होने को कहने का स्वाभाविक तरीका है; इसमें *avoir* आता है।'
  fr.a1.unit43.lesson04.teach.l_entree_la:
    title: प्रवेश, निकास, प्रतीक्षालय
    gloss: प्रवेश; निकास; प्रतीक्षालय
    note: '*L''entrée* में स्वर से पहले *e* हटकर *l''* बन जाता है; *la sortie* और *la salle d''attente* स्त्रीलिंग हैं।'
    example_gloss:
    - प्रवेश द्वार कहाँ है?
    - निकास कहाँ है?
    - प्रतीक्षालय कहाँ है?
  fr.a1.unit43.lesson04.teach.ou_est_le:
    title: प्लेटफ़ॉर्म कहाँ है, पूछना
    gloss: प्लेटफ़ॉर्म सात कहाँ है?
    note: '*Où est ... ?* पूछता है कि कोई चीज़ कहाँ है; *le quai sept* पुल्लिंग है।'
  fr.a1.unit43.lesson04.teach.tout_droit_puis:
    title: रास्ता बताना
    gloss: सीधे जाइए और फिर दाएँ।
    note: '*Tout droit* और *à droite* दिशा बताने वाले शब्द हैं; *droite* से पहले *à* आता है।'
  fr.a1.unit43.lesson04.teach.ou_est_la:
    title: प्रतीक्षालय के बारे में पूछना
    gloss: प्रतीक्षालय कहाँ है?
    note: वही प्रश्न-पैटर्न, एक नई जगह के लिए।
  fr.a1.unit43.lesson05.teach.billet_paris_gare:
    title: छपा हुआ टिकट पढ़ना
    gloss: 'टिकट: Paris Gare de Lyon से Lyon Part-Dieu। प्रस्थान: दस बजकर दस मिनट, प्लेटफ़ॉर्म सात। आगमन: ग्यारह बजने में दस मिनट। आना-जाना। कीमत: बारह यूरो चालीस।'
    note: रवानगी का समय और प्लेटफ़ॉर्म, आगमन का समय, टिकट का प्रकार और कीमत पर ध्यान दीजिए।
    glosses:
      Billet: टिकट
      Départ: रवानगी
      dix: दस
      quai: प्लेटफ़ॉर्म
      sept: सात
      Arrivée: आगमन
      onze: ग्यारह
      Aller-retour: आने-जाने का टिकट
      Prix: कीमत
      douze: बारह
      euros: यूरो
      quarante: चालीस
  fr.a1.unit43.lesson06.teach.mathieu_on_doit:
    title: Mathieu योजना बताता है
    gloss: 'Mathieu: हमें प्लेटफ़ॉर्म सात पर जाना है। ट्रेन दस बजकर दस मिनट पर चलती है।'
    note: '*On doit* (*devoir* से) यहाँ व्यावहारिक ज़रूरत बताता है, कोई कड़ी बाध्यता नहीं।'
  fr.a1.unit43.lesson06.teach.camille_regarde_voila:
    title: Camille बोर्ड पढ़ती है
    gloss: 'Camille: देखो, यह रहा बोर्ड: देरी, दस मिनट।'
    note: '*Voilà* सामने मौजूद चीज़ की ओर इशारा करता है: *voilà le panneau*।'
  fr.a1.unit43.lesson06.teach.mathieu_pas_de:
    title: Mathieu शांत रहता है
    gloss: 'Mathieu: कोई बात नहीं, अभी हमारे पास कॉफ़ी पीने का समय है।'
    note: '*Pas de problème* तसल्ली देने का एक आम, अनौपचारिक तरीका है।'
  fr.a1.unit43.lesson06.teach.camille_bonne_idee:
    title: ट्रेन आ जाती है
    gloss: 'Camille: अच्छा विचार है। अरे, ट्रेन तो अभी से आ गई। प्लेटफ़ॉर्म सात, बिल्कुल सही!'
    note: '*Déjà* (पहले ही) बताता है कि अभी घोषित हुई देरी के बावजूद ट्रेन उम्मीद से जल्दी आ गई।'
  fr.a1.unit43.lesson06.teach.mathieu_allez_on:
    title: वे ट्रेन में चढ़ते हैं
    gloss: 'Mathieu: चलो, चढ़ते हैं। Lyon, हम पहुँच रहे हैं!'
    note: '*On* बोलचाल में ''हम'' के अर्थ में आम तौर पर *nous* की जगह आता है, और क्रिया *il* वाले रूप में रहती है: *on monte*। *On arrive !* का सही भाव है ''लो, पहुँच गए!''; शब्द-दर-शब्द अनुवाद अटपटा लगेगा।'
