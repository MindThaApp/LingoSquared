course:
  title: फ़्रेंच A1
  description: 0 से 100 तक की संख्याएँ (soixante-dix, quatre-vingts और quatre-vingt-dix वाले रूपों सहित), उम्र, फ़ोन नंबर और रेसिपी की मात्राएँ, पिछली इकाई में कार्यशाला में मिले Inès और Mathieu की कहानी को आगे बढ़ाते हुए। इसमें avoir से बनने वाली उम्र की अभिव्यक्तियों, फ़्रेंच संख्याओं में बीस-आधारित गिनती के अवशेषों और मात्रा वाले वाक्यांशों में लिंग-अनुकूलन पर विशेष ध्यान दिया गया है।
