teaching:
  fr.a1.unit02.lesson01.teach.zero:
    title: शून्य
    gloss: शून्य
    note: '*Zéro* स्वयं संख्या के रूप में भी इस्तेमाल होता है और अंकों की शृंखला ज़ोर से पढ़ते समय एक अंक के रूप में भी।'
  fr.a1.unit02.lesson01.teach.un:
    title: एक
    gloss: एक
    note: '*Un* पुल्लिंग है; स्त्रीलिंग संज्ञा से पहले स्त्रीलिंग रूप *une* आता है (*une tasse*, एक कप)। अकेले, जैसे गिनती में, यह *un* ही रहता है।'
  fr.a1.unit02.lesson01.teach.deux:
    title: दो
    gloss: दो
    note: संज्ञा का लिंग चाहे जो हो, *Deux* का रूप कभी नहीं बदलता।
  fr.a1.unit02.lesson01.teach.trois:
    title: तीन
    gloss: तीन
    note: '*Trois* का रूप नहीं बदलता।'
  fr.a1.unit02.lesson01.teach.quatre:
    title: चार
    gloss: चार
    note: '*Quatre* का रूप नहीं बदलता।'
  fr.a1.unit02.lesson01.teach.cinq:
    title: पाँच
    gloss: पाँच
    note: '*Cinq* का रूप नहीं बदलता। इसका अंतिम q आम तौर पर बोला जाता है, जबकि कई अन्य फ़्रेंच संख्याओं के अंतिम व्यंजन मौन रहते हैं।'
  fr.a1.unit02.lesson01.teach.six:
    title: Six
    gloss: छह
    note: '*Six* अकेले बोलने पर अंत में /s/ ध्वनि के साथ उच्चारित होता है, पर व्यंजन से शुरू होने वाली संज्ञा से पहले यह अंतिम व्यंजन छूट जाता है (*six livres* का उच्चारण "si livres" जैसा होता है)।'
  fr.a1.unit02.lesson01.teach.sept:
    title: सात
    gloss: सात
    note: '*Sept* का रूप नहीं बदलता; p मौन है, केवल अंतिम t बोला जाता है।'
  fr.a1.unit02.lesson01.teach.huit:
    title: आठ
    gloss: आठ
    note: '*Huit* का रूप नहीं बदलता। इसका h मौन है, जैसा लगभग सभी फ़्रेंच शब्दों में होता है।'
  fr.a1.unit02.lesson01.teach.neuf:
    title: नौ
    gloss: नौ
    note: '*Neuf* का रूप नहीं बदलता।'
  fr.a1.unit02.lesson01.teach.dix:
    title: दस
    gloss: दस
    note: '*Dix* अकेले बोलने पर अंत में /s/ ध्वनि के साथ उच्चारित होता है; यह *six* जैसा ही नियम है, यानी व्यंजन से पहले अंतिम व्यंजन छूट जाता है।'
  fr.a1.unit02.lesson02.teach.onze:
    title: ग्यारह
    gloss: ग्यारह
    note: '*Onze* से *seize* (11-16) तक हर संख्या अपना अलग शब्द है; ये *dix* से नहीं बनीं, जबकि इक्कीस से आगे की संख्याएँ *vingt* को दोहराती हैं।'
  fr.a1.unit02.lesson02.teach.douze:
    title: बारह
    gloss: बारह
    note: '*Douze* एक ही शब्द है। इसकी शुरुआत *deux* जैसी लगती है, पर इसमें *dix* कहीं दिखाई नहीं देता।'
  fr.a1.unit02.lesson02.teach.treize:
    title: तेरह
    gloss: तेरह
    note: '*Treize* एक ही शब्द है। शुरुआत में यह *trois* की याद दिलाता है, पर इसमें *dix* अलग से दिखाई नहीं देता।'
  fr.a1.unit02.lesson02.teach.quatorze:
    title: चौदह
    gloss: चौदह
    note: '*Quatorze* एक ही शब्द है। शुरुआत में यह *quatre* की याद दिलाता है, पर इसमें *dix* अलग से दिखाई नहीं देता।'
  fr.a1.unit02.lesson02.teach.quinze:
    title: पंद्रह
    gloss: पंद्रह
    note: '*Quinze* का *cinq* से दूर का संबंध है, पर इसमें *dix* अलग से दिखाई नहीं देता।'
  fr.a1.unit02.lesson02.teach.seize:
    title: सोलह
    gloss: सोलह
    note: '*Seize* जुड़े हुए रूपों वाले शब्दों में आख़िरी है; *dix-sept* (17) से आगे *dix* फिर से इकाई के साथ साफ़ जुड़ा दिखाई देता है।'
  fr.a1.unit02.lesson02.teach.vingt:
    title: बीस
    gloss: बीस
    note: '*Vingt* अपने आप में एक अलग शब्द है। इक्कीस से आगे दहाई और इकाई जुड़ती हैं (*vingt et un*, *vingt-deux*); इस नियम को यह कोर्स आगे फिर देखेगा।'
  fr.a1.unit02.lesson02.teach.trente:
    title: तीस
    gloss: तीस
    note: '*Trente* के बाद इकाई हाइफ़न से जुड़ती है (*trente-quatre*), सिर्फ़ एक को छोड़कर, जिसमें *et* आता है (*trente et un*)।'
  fr.a1.unit02.lesson02.teach.trente_quatre:
    title: चौंतीस
    gloss: चौंतीस
    note: '*Trente-quatre* हाइफ़न के साथ लिखा जाता है, यानी दोनों हिस्सों के बीच एक छोटी रेखा लगती है।'
  fr.a1.unit02.lesson02.teach.soixante:
    title: साठ
    gloss: साठ
    note: '*Soixante* उनहत्तर तक सामान्य दहाई की तरह चलता है (*soixante-quatre*, 64); अनियमित हिस्सा सत्तर से शुरू होता है, जो अगला पाठ है।'
  fr.a1.unit02.lesson02.teach.soixante_dix:
    title: सत्तर
    gloss: सत्तर
    note: 'फ़्रेंच संख्याओं में यह सबसे बड़ी हैरानी है: सत्तर के लिए कोई अलग शब्द नहीं है। *Soixante-dix* का शाब्दिक अर्थ "साठ-दस" (60 + 10) है। गिनती इसी तरह *soixante-dix-neuf* (79, "साठ-उन्नीस") तक चलती है, फिर *quatre-vingts* के साथ अस्सी पर नया आधार शुरू होता है।'
  fr.a1.unit02.lesson02.teach.quatre_vingts:
    title: अस्सी
    gloss: अस्सी
    note: '*Quatre-vingts* का शाब्दिक अर्थ "चार बीसियाँ" (4 x 20) है, जो बीस के आधार वाली पुरानी गिनती की निशानी है। अंत का s तभी लगता है जब यह अकेला हो या संख्या के अंत में आए (*quatre-vingts*, 80); इकाई जुड़ने पर s हट जाता है (*quatre-vingt-un*, 81)।'
  fr.a1.unit02.lesson02.teach.quatre_vingt_dix:
    title: नब्बे
    gloss: नब्बे
    note: '*Quatre-vingt-dix* का शाब्दिक अर्थ "चार बीसियाँ और दस" (4x20 + 10) है; सत्तर की तरह यही बीस के आधार वाला तरीका *quatre-vingt-dix-neuf* (99) तक चलता है।'
  fr.a1.unit02.lesson02.teach.cent:
    title: सौ
    gloss: सौ
    note: ठीक 100 के लिए अकेले *cent* का प्रयोग होता है, बिना किसी उपपद के ("*un cent*" नहीं)।
  fr.a1.unit02.lesson03.teach.quel_age_as_tu:
    title: अनौपचारिक रूप से उम्र पूछना
    gloss: तुम्हारी उम्र कितनी है?
    note: फ़्रेंच में शाब्दिक रूप से पूछा जाता है कि आपके पास कितनी उम्र है। इसमें *avoir* (रखना) आता है, *être* (होना) नहीं।
  fr.a1.unit02.lesson03.teach.jai_vingt_huit_ans:
    title: अपनी उम्र बताना
    gloss: मैं अट्ठाईस साल का/की हूँ।
    note: '*Ai*, *avoir* का je वाला रूप है। फ़्रेंच में *ans* (साल) कहना ज़रूरी है; इसे छोड़ा नहीं जाता।'
  fr.a1.unit02.lesson03.teach.quel_age_avez_vous:
    title: औपचारिक रूप से उम्र पूछना
    gloss: तुम्हारी उम्र कितनी है?
    note: '*Avez-vous* में *avoir* का *vous* वाला रूप है, जो पहली इकाई में बताए गए औपचारिक रूप से मेल खाता है।'
  fr.a1.unit02.lesson03.teach.jai_trente_et_un_ans:
    title: मिश्रित संख्या में उम्र बताना
    gloss: मैं इकतीस साल का/की हूँ।
    note: '*Trente et un* में हाइफ़न नहीं, *et* (और) आता है; यह तीस, चालीस, पचास और साठ के "एक" वाले रूपों में होता है (*trente et un*, *quarante et un*, *cinquante et un*, *soixante et un*)। इकहत्तर इस नियम से अलग है: वह *soixante et onze* (साठ + ग्यारह) है, *soixante et un* नहीं, क्योंकि सत्तर के दशक में *soixante-dix-neuf* (79) तक *dix* वाले रूपों से गिनती चलती है।'
  fr.a1.unit02.lesson03.teach.et_toi_quel_age:
    title: उम्र का सवाल लौटाना
    gloss: और आप/तुम, कितने साल के हो?
    note: '*Et toi* लौटाकर पूछे जाने वाले प्रश्न की शुरुआत करता है; *et* के बाद ज़ोर देने के लिए *tu* नहीं, *toi* आता है।'
  fr.a1.unit02.lesson04.teach.quel_est_ton_numero:
    title: फ़ोन नंबर पूछना
    gloss: तुम्हारा फ़ोन नंबर क्या है?
    note: '*Quel*, पुल्लिंग संज्ञा *numéro* से मेल खाता है; स्त्रीलिंग संज्ञा के साथ *quelle* आता।'
  fr.a1.unit02.lesson04.teach.numero_ines:
    title: अंक-दर-अंक पढ़ा गया नंबर
    gloss: शून्य, छह, एक, पाँच, शून्य, दो, नौ, सात, चार, तीन
    note: असली फ़्रेंच फ़ोन नंबर में दस अंक होते हैं और उन्हें आम तौर पर जोड़ियों में पढ़ा जाता है (*zéro six*, *quinze*, *zéro deux*...)। इस इकाई के नंबर असली दस अंकों वाले रूप में हैं (06 15 02 97 43), पर उन्हें एक-एक अंक करके पढ़ा गया है ताकि आप पहले अकेले अंकों का अभ्यास कर सकें।
  fr.a1.unit02.lesson04.teach.cest_le:
    title: नंबर की शुरुआत करना
    gloss: यह है...
    note: '*Le* (पुल्लिंग उपपद) इसलिए आता है क्योंकि *numéro* पुल्लिंग संज्ञा है।'
  fr.a1.unit02.lesson04.teach.tu_peux_repeter:
    title: दोहराने को कहना
    gloss: क्या आप/तुम दोहरा सकते हो, कृपया?
    note: '*Peux*, *pouvoir* (सकना) का *tu* वाला रूप है; जब बोला गया नंबर इतनी तेज़ी से निकल जाए कि सुन न पाएँ, तब यह काम आता है।'
  fr.a1.unit02.lesson04.teach.bien_sur:
    title: सहजता से हामी भरना
    gloss: बिल्कुल; ज़रूर
    note: '*Bien sûr* किसी अनुरोध पर हामी भरने का आम और दोस्ताना तरीका है।'
  fr.a1.unit02.lesson05.teach.jai_besoin_trois_oeufs:
    title: ज़रूरी मात्रा बताना
    gloss: मुझे तीन अंडे चाहिए।
    note: '*J''ai besoin de* (शाब्दिक अर्थ "मेरे पास ज़रूरत है") फ़्रेंच में किसी चीज़ की ज़रूरत बताने का तरीका है; इसमें अलग क्रिया नहीं, *avoir* आता है।'
  fr.a1.unit02.lesson05.teach.combien_oeufs:
    title: पूछना कि कितने चाहिए
    gloss: आपको कितने अंडे चाहिए?
    note: '*De combien d''œufs* में *de combien* (कितने का) वस्तु से पहले आता है; यानी शब्दक्रम "कितने अंडों की" जैसा बनता है।'
  fr.a1.unit02.lesson05.teach.deux_tasses_farine:
    title: मापी हुई मात्रा बताना
    gloss: दो कप आटा
    note: '*De* मापने की इकाई (*tasses*, कप) को उस चीज़ से जोड़ता है जिसे मापा जा रहा है (*farine*, आटा); हिंदी के "का/की" जैसा संबंध है, जैसे "दो कप आटा"।'
  fr.a1.unit02.lesson05.teach.demi_tasse:
    title: आधी मात्रा बताना
    gloss: आधा कप चीनी
    note: संज्ञा से पहले उपसर्ग के रूप में *demi-* नहीं बदलता (*une demi-tasse*), जबकि संज्ञा के बाद आने वाला विशेषण *demi* बदलता है (*une heure et demie*)।
  fr.a1.unit02.lesson05.teach.jai_quatre_oeufs:
    title: बताना कि पास में क्या है
    gloss: मेरे पास मेज़ पर चार अंडे हैं।
    note: '*J''ai* (मेरे पास है) बताता है कि क्या पहले से उपलब्ध है, जबकि *j''ai besoin de* (मुझे चाहिए) बताता है कि अभी क्या कम है।'
  fr.a1.unit02.lesson06.teach.line01:
    title: पूछना कि कितने अंडे चाहिए
    gloss: इनेस मथिउ से पूछती है कि रेसिपी के लिए उसे कितने अंडे चाहिए।
    note: 'इनेस और मथिउ अब पहली इकाई के *vous* की जगह *tu* का प्रयोग करते हैं: वर्कशॉप के साथी होने से वे जल्दी अनौपचारिक रूप पर आ गए हैं।'
  fr.a1.unit02.lesson06.teach.line02:
    title: सामग्री बताना
    gloss: मथिउ कहता है कि उसे तीन अंडे और दो कप आटा चाहिए।
    note: '*J''ai besoin de* बताता है कि रेसिपी के लिए अभी क्या चाहिए।'
  fr.a1.unit02.lesson06.teach.line03:
    title: जो पास है वह बताना
    gloss: इनेस कहती है कि उसके पास मेज़ पर चार अंडे हैं, और पूछती है कि क्या उसे चीनी भी चाहिए।
    note: '*J''ai* बताता है कि इनेस के पास पहले से क्या है, जो मथिउ की ज़रूरत से अलग बात है।'
  fr.a1.unit02.lesson06.teach.line04:
    title: थोड़ी मात्रा की पुष्टि करना
    gloss: मथिउ कहता है हाँ, थोड़ी सी, लगभग आधा कप।
    note: यहाँ *environ* का अर्थ "लगभग" है; यह सटीक मात्रा को थोड़ा नरम कर देता है।
  fr.a1.unit02.lesson06.teach.line05:
    title: फ़ोन नंबर पूछना
    gloss: इनेस कहती है बहुत बढ़िया, फिर मथिउ का फ़ोन नंबर पूछती है ताकि अगली क्लास के बारे में उसे मैसेज कर सके।
    note: '*Comme ça je t''écris* ("ताकि मैं तुम्हें मैसेज कर सकूँ") बताता है कि वह नंबर क्यों माँग रही है; संपर्क की जानकारी माँगने से पहले कारण बताना बातचीत की एक स्वाभाविक आदत है।'
  fr.a1.unit02.lesson06.teach.line06:
    title: फ़ोन नंबर बताना
    gloss: मथिउ अपना नंबर एक-एक अंक करके बोलता है।
    note: '*C''est le* नंबर बताना शुरू करता है, और पुल्लिंग संज्ञा *numéro* से मेल खाता है।'
  fr.a1.unit02.lesson06.teach.line07:
    title: धन्यवाद देकर उम्र पूछना
    gloss: 'इनेस उसे धन्यवाद देती है, फिर एक और सवाल पूछती है: उसकी उम्र कितनी है।'
    note: '*Une dernière question* ("एक आख़िरी सवाल") एक ही बातचीत में विषय बदलने का स्वाभाविक संकेत है।'
  fr.a1.unit02.lesson06.teach.line08:
    title: उसकी उम्र बताना
    gloss: मथिउ कहता है कि वह अट्ठाईस साल का है, और यही सवाल इनेस से पूछता है।
    note: '*J''ai vingt-huit ans* में हाइफ़न वाला जुड़ा हुआ रूप है, जो इसी पाठ के नियम से मेल खाता है।'
  fr.a1.unit02.lesson06.teach.line09:
    title: उसकी उम्र बताना
    gloss: इनेस कहती है कि वह इकतीस साल की है।
    note: '*J''ai trente et un ans* में हाइफ़न की जगह *et* (और) आता है, क्योंकि इकतीस उन "एक" वाले रूपों में है जो तीसरे पाठ में बताए गए थे।'
