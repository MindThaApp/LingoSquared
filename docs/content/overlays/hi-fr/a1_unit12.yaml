course:
  title: फ़्रेंच A1
  description: 'passé composé से हाल ही में पूरी हुई किसी घटना का छोटा-सा विवरण देना, जिसमें सहायक क्रिया avoir और être दोनों आती हैं। इनès और मथ्यू की कुकिंग वर्कशॉप की कहानी आगे बढ़ती है, जब मथ्यू पिछले शनिवार के सत्र की एक गड़बड़ी सुनाता है। ध्यान रखें: फ़्रेंच में दो अलग सहायक क्रियाएँ होती हैं, ज़्यादातर क्रियाओं के लिए avoir और aller, arriver, rester जैसी कुछ क्रियाओं के लिए être; और être वाली क्रियाओं में कृदंत कर्ता के लिंग के अनुसार बदलता है (arrivé / arrivée)।'
