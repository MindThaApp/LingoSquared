teaching:
  fr.a1.unit12.lesson01.teach.jai_prepare:
    title: मैंने तैयार किया
    gloss: मैंने तैयार किया / मैंने बनाया
    note: 'नियमित -ER क्रियाओं का passé composé कृदंत *-é* पर खत्म होता है: *préparer* → *préparé*, और साथ में *avoir* आता है।'
    example_gloss: मैंने वर्कशॉप के लिए एक केक बनाया।
  fr.a1.unit12.lesson01.teach.jai_achete:
    title: मैंने ख़रीदा
    gloss: मैंने ख़रीदा
    note: '*acheter* भी *préparer* की तरह *avoir* + *-é* वाले ढाँचे पर चलता है।'
    example_gloss: मैंने बाज़ार से सब्ज़ियाँ ख़रीदीं।
  fr.a1.unit12.lesson01.teach.jai_oublie:
    title: मैं भूल गया
    gloss: मैं भूल गया
    note: '*oublier* → *oublié*, फिर वही नियमित ढाँचा।'
    example_gloss: मैं मक्खन घर पर ही भूल गया!
  fr.a1.unit12.lesson01.teach.tu_as_aime:
    title: तुम्हें पसंद आया
    gloss: तुम्हें पसंद आया
    note: '*tu as* + कृदंत उसी *avoir* वाले ढाँचे का *tu* रूप है।'
    example_gloss: क्या तुम्हें केक पसंद आया?
  fr.a1.unit12.lesson01.teach.il_a_goute:
    title: उसने चखा
    gloss: उसने चखा
    note: '*il a* + कृदंत *il* रूप है; सहायक क्रिया *avoir* कर्ता के साथ बदलती है, कृदंत वही रहता है।'
    example_gloss: मथ्यू ने सॉस चखी।
  fr.a1.unit12.lesson01.teach.grammar_avoir_participe:
    title: avoir + भूतकालिक कृदंत
    gloss: avoir + भूतकालिक कृदंत (-é)
    note: ज़्यादातर फ़्रेंच क्रियाएँ passé composé में सहायक क्रिया *avoir* लेती हैं, और नियमित -ER क्रियाओं का भूतकालिक कृदंत *-é* पर खत्म होता है।
  fr.a1.unit12.lesson01.teach.la_semaine_derniere:
    title: पिछले हफ़्ते
    gloss: पिछले हफ़्ते
    note: '*dernière* (पिछली) स्त्रीलिंग *semaine* के साथ मेल खाता है; पुल्लिंग रूप *dernier* है, जैसे *samedi dernier* (पिछले शनिवार) में।'
    example_gloss: पिछले हफ़्ते मैंने एक केक बनाया।
  fr.a1.unit12.lesson02.teach.je_suis_arrive:
    title: मैं पहुँचा
    gloss: मैं पहुँचा
    note: '*arriver* उन थोड़ी-सी क्रियाओं में से है (ज़्यादातर गति की क्रियाएँ) जो सहायक क्रिया के रूप में *avoir* की जगह *être* लेती हैं।'
    example_gloss: मैं वर्कशॉप में देर से पहुँचा।
  fr.a1.unit12.lesson02.teach.je_suis_alle:
    title: मैं गया
    gloss: मैं गया
    note: '*aller* भी *être* लेता है। कृदंत कर्ता के अनुसार बदलता है: *allé* (पुल्लिंग) या *allée* (स्त्रीलिंग, जैसा इनès कहेगी)।'
    example_gloss: मैं वर्कशॉप से पहले बाज़ार गई।
  fr.a1.unit12.lesson02.teach.il_est_reste:
    title: वह रुका
    gloss: वह रुका
    note: '*rester* (रुकना) भी *être* लेने वाली क्रिया है, और उसमें भी वही मेल का नियम चलता है।'
    example_gloss: मथ्यू रसोई साफ़ करने के लिए रुक गया।
  fr.a1.unit12.lesson02.teach.grammar_etre_accord:
    title: être + भूतकालिक कृदंत का मेल
    gloss: être + भूतकालिक कृदंत (कर्ता के अनुसार बदलता है)
    note: '*être* लेने वाली क्रियाओं में भूतकालिक कृदंत कर्ता के लिंग और वचन के अनुसार बदलता है, जबकि *avoir* लेने वाली क्रियाओं में ऐसा नहीं होता।'
  fr.a1.unit12.lesson02.teach.en_retard:
    title: देर से
    gloss: देर से
    note: '*en retard* अपेक्षित समय के बाद पहुँचने को बताता है; यह *arriver* के साथ अक्सर आता है।'
    example_gloss: बस देर से पहुँची।
  fr.a1.unit12.lesson02.teach.finalement:
    title: आख़िरकार
    gloss: आख़िरकार
    note: '*finalement* छोटी कहानी को समेटता है और पहले की मुश्किलों के बाद अंतिम नतीजा बताता है।'
    example_gloss: आख़िरकार केक बहुत स्वादिष्ट निकला।
  fr.a1.unit12.lesson02.teach.quest_ce_qui_sest_passe:
    title: क्या हुआ?
    gloss: क्या हुआ?
    note: '*Qu''est-ce qui s''est passé ?* पूछने का सामान्य तरीका है कि क्या हुआ।'
    example_gloss: वर्कशॉप में क्या हुआ?
  fr.a1.unit12.lesson03.teach.line01:
    title: पूछें कि क्या हुआ
    gloss: इनès पूछती है कि पिछले शनिवार की वर्कशॉप में क्या हुआ; वह आ नहीं सकी थी।
    note: '*Qu''est-ce qui s''est passé ?* (क्या हुआ?) अतीत की किसी घटना के बारे में पूछने का सामान्य तरीका है।'
  fr.a1.unit12.lesson03.teach.line02:
    title: गड़बड़ी बताएँ
    gloss: मथ्यू कहता है, अरे नहीं! वह देर से पहुँचा और मक्खन घर पर ही भूल गया!
    note: 'एक ही वाक्य में passé composé के दो रूप: *être* के साथ (*je suis arrivé*) और *avoir* के साथ (*j''ai oublié*)।'
  fr.a1.unit12.lesson03.teach.line03:
    title: पूछें कि उसने क्या किया
    gloss: इनès पूछती है कि फिर उसने क्या किया।
    note: '*Qu''est-ce que tu as fait ?* (तुमने क्या किया?) में *faire* का अनियमित कृदंत fait आता है।'
  fr.a1.unit12.lesson03.teach.line04:
    title: हल बताएँ
    gloss: मथ्यू कहता है कि वह जल्दी से नुक्कड़ की किराने की दुकान गया।
    note: '*l''épicerie du coin* (नुक्कड़ की किराने की दुकान) में *coin* वही शब्द है जो *au coin de la rue* (सड़क के नुक्कड़ पर) में है।'
  fr.a1.unit12.lesson03.teach.line05:
    title: पूछें कि बात बनी या नहीं
    gloss: इनès पूछती है कि क्या उसे वहाँ मक्खन मिला।
    note: '*Tu as trouvé... ?* (क्या तुम्हें... मिला?) *avoir* वाला एक और नियमित प्रश्न है।'
  fr.a1.unit12.lesson03.teach.line06:
    title: सुखद अंत बताएँ
    gloss: मथ्यू कहता है हाँ, और आख़िरकार केक बहुत स्वादिष्ट निकला!
    note: '*finalement* के साथ कहानी सकारात्मक नोट पर खत्म होती है और पहले की गड़बड़ी सुलझ जाती है।'
