  fr.a1.unit54.lesson01.teach.tu_as_un:
    title: क्या आपके पास कोई पालतू जानवर है?
    gloss: क्या आपके पास कोई पालतू जानवर है?
    note: वही *Tu as ... ?* प्रश्न-ढाँचा, जो आप पिछली यूनिटों से जानते हैं।
  fr.a1.unit54.lesson01.teach.oui_j_ai:
    title: हाँ, मेरे पास एक कुत्ता है
    gloss: हाँ, मेरे पास एक कुत्ता है।
    note: इस यूनिट की नई शब्दावली के साथ एक सरल सकारात्मक उत्तर।
  fr.a1.unit54.lesson01.teach.non_je_n:
    title: नहीं, मेरे पास कोई पालतू जानवर नहीं है
    gloss: नहीं, मेरे पास कोई पालतू जानवर नहीं है।
    note: 'निषेध के बाद *un* की जगह *pas d''* आता है: *Je n''ai pas d''animal de compagnie.* व्याकरण नोट देखिए।'
  fr.a1.unit54.lesson01.teach.apres_ne_pas:
    title: 'Pas de: un/une/des का निषेध'
    gloss: '*ne ... pas* के बाद *un*, *une* और *des* बदलकर *de* या *d''* हो जाते हैं, जैसे *Je n''ai pas de temps* (जो आप पहले से जानते हैं) और यहाँ *Je n''ai pas d''animal de compagnie*।'
    note: 'यह वही ढाँचा है जो *Je n''ai pas de temps* में पहले सिखाया गया था: कोई नया व्याकरण नहीं, बस उसे लगाने के लिए एक नया संज्ञा शब्द।'
  fr.a1.unit54.lesson02.teach.promener:
    title: (जानवर को) टहलाने ले जाना
    gloss: (जानवर को) टहलाने ले जाना
    note: '*Promener* (घुमाने ले जाना) एक नियमित *-er* क्रिया है; व्याकरण नोट देखिए।'
    example_gloss: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ।
  fr.a1.unit54.lesson02.teach.promener_est_un:
    title: Promener एक नियमित -er क्रिया है
    gloss: '*Promener* एक नियमित *-er* क्रिया है, *cuisiner* की तरह: *je promène, tu promènes, il promène le chien*। *e* पर लगा चिह्न दिखाता है कि उसका उच्चारण होता है।'
    note: क्रिया हमेशा एक ही टुकड़े में रहती है, जैसा कि आपके जाने-पहचाने दूसरे *-er* क्रियाओं में होता है।
  fr.a1.unit54.lesson02.teach.donner_a_manger:
    title: खाना खिलाना
    gloss: खाना खिलाना
    example_gloss: मैं रोज़ बिल्ली को खाना खिलाता हूँ।
  fr.a1.unit54.lesson02.teach.jouer_avec:
    title: के साथ खेलना
    gloss: के साथ खेलना
    example_gloss: Thomas अपनी बिल्ली के साथ खेलता है।
  fr.a1.unit54.lesson02.teach.je_promene_le:
    title: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ
    gloss: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ।
    note: '*promener* को *tous les jours* (हर दिन) के साथ जोड़ता है, जो आप पहले की यूनिट से जानते हैं।'
  fr.a1.unit54.lesson02.teach.je_donne_a:
    title: मैं रोज़ बिल्ली को खाना खिलाता हूँ
    gloss: मैं रोज़ बिल्ली को खाना खिलाता हूँ।
    note: '*donner à manger* (शाब्दिक अर्थ ''खाने के लिए देना'') को *tous les jours* के साथ जोड़ता है।'
  fr.a1.unit54.lesson03.teach.au_pluriel_on:
    title: 'बहुवचन: chien -> chiens'
    gloss: 'बहुवचन में आमतौर पर एक *s* जुड़ता है जो सुनाई नहीं देता: *chien -> chiens*, *chat -> chats*। *-al* वाले संज्ञा *-aux* में बदल जाते हैं: *animal -> animaux*।'
    note: फ्रेंच में बहुवचन बनाने का नियमित ढाँचा, जो यहाँ पहली बार जानवरों के नामों के उदाहरणों के साथ सिखाया गया है।
  fr.a1.unit54.lesson03.teach.chiens_chats:
    title: कुत्ते और बिल्लियाँ
    gloss: कुत्ते / बिल्लियाँ
    example_gloss:
    - Mathieu को कुत्ते बहुत पसंद हैं।
    - Léa को बिल्लियाँ बहुत पसंद हैं।
  fr.a1.unit54.lesson03.teach.poissons_oiseaux:
    title: मछलियाँ और पक्षी (बहुवचन)
    gloss: मछलियाँ / पक्षी
    example_gloss:
    - मुझे मछलियाँ बहुत पसंद हैं।
    - दादाजी को पक्षी बहुत पसंद हैं।
  fr.a1.unit54.lesson03.teach.j_adore_les:
    title: मुझे जानवर बहुत पसंद हैं
    gloss: मुझे जानवर बहुत पसंद हैं।
    note: '*Adorer* (बहुत पसंद करना) के बाद सीधे संज्ञा आती है, और सामान्य पसंद के लिए *les* लगता है: *J''adore les animaux.*'
  fr.a1.unit54.lesson03.teach.lea_adore_les:
    title: Léa को बिल्लियाँ पसंद हैं, पर उसके पास पालतू जानवर नहीं है
    gloss: Léa को बिल्लियाँ बहुत पसंद हैं, लेकिन उसके पास कोई पालतू जानवर नहीं है।
    note: यह उस विरोधाभास की भूमिका बनाता है जिस पर इस यूनिट का पठन-अंश आधारित है।
  fr.a1.unit54.lesson04.teach.mathieu_tu_as:
    title: Mathieu पालतू जानवर के बारे में पूछता है
    gloss: 'Mathieu: क्या तुम्हारे पास कोई पालतू जानवर है, Camille?'
  fr.a1.unit54.lesson04.teach.camille_oui_j:
    title: Camille के पास एक कुत्ता है
    gloss: 'Camille: हाँ, मेरे पास एक कुत्ता है।'
  fr.a1.unit54.lesson04.teach.mathieu_comment_est:
    title: Mathieu पूछता है कि वह कैसा दिखता है
    gloss: 'Mathieu: वह कैसा दिखता है?'
    note: '*Comment est-il ?* रूप-रंग वाली इकाई में आ चुका है; यहाँ वही प्रश्न किसी जानवर के बारे में पूछा गया है।'
  fr.a1.unit54.lesson04.teach.camille_il_a:
    title: Camille अपने कुत्ते के बारे में बताती है
    gloss: 'Camille: उसके बाल भूरे हैं और वह छोटा है।'
    note: बालों के रंग और आकार की शब्दावली रूप-रंग वाली यूनिट से दोहराई गई है, अब किसी व्यक्ति के बालों की जगह जानवर के रोएँ के लिए।
  fr.a1.unit54.lesson04.teach.il_et_le:
    title: जानवरों के लिए Il/le
    gloss: '*Il* (वह) और *le* (उसे) का प्रयोग नर जानवर के लिए भी हो सकता है, केवल व्यक्ति के लिए नहीं।'
    note: इस कोर्स में *il* और *le* का अब तक हर प्रयोग किसी व्यक्ति के लिए था; यह नोट साफ़ बताता है कि इनका प्रयोग जानवरों के लिए भी होता है।
  fr.a1.unit54.lesson04.teach.mathieu_tu_le:
    title: Mathieu सैर के बारे में पूछता है
    gloss: 'Mathieu: क्या तुम उसे रोज़ घुमाने ले जाती हो?'
  fr.a1.unit54.lesson04.teach.camille_oui_je:
    title: Camille अपनी दिनचर्या बताती है
    gloss: 'Camille: हाँ, मैं उसे रोज़ घुमाने ले जाती हूँ और उसे खाना देती हूँ।'
  fr.a1.unit54.lesson05.teach.mathieu_et_lea:
    title: जानवरों के बारे में Mathieu, Léa और Thomas
    gloss: 'Mathieu और Léa दोनों को जानवर बहुत पसंद हैं, लेकिन दोनों में से किसी के पास पालतू जानवर नहीं है। Mathieu को कुत्ते बहुत पसंद हैं और Léa को बिल्लियाँ। Thomas के पास पालतू जानवर है: एक बिल्ली। वह अक्सर अपनी बिल्ली के साथ खेलता है और रोज़ उसे खाना देता है। और आपके पास कोई पालतू जानवर है?'
    note: किसी जानवर को पसंद करने और सच में उसे पालने का फ़र्क़ दिखाता है -- यही इस यूनिट के संवाद-लक्ष्य की मूल बात है।
    glosses:
      adorent: बहुत पसंद है
      tous: दोनों
      animaux: जानवर
      deux: दोनों
      compagnie: पालतू जानवर
      chiens: कुत्ते
      chats: बिल्लियाँ
      chat: बिल्ली
      joue: खेलता है
      donne: देता है
      chaque: हर
      manger: खाना
  fr.a1.unit54.lesson05.teach.thomas_joue_souvent:
    title: Thomas अक्सर अपनी बिल्ली के साथ खेलता है
    gloss: Thomas अक्सर अपनी बिल्ली के साथ खेलता है।
    note: '*Souvent* (अक्सर) क्रिया के ठीक बाद आता है, जैसा पहले की दिनचर्याओं में था।'
  fr.a1.unit54.lesson05.teach.j_adore_les:
    title: मुझे कुत्ते बहुत पसंद हैं। मेरे पास कोई पालतू जानवर नहीं है।
    gloss: मुझे कुत्ते बहुत पसंद हैं। मेरे पास कोई पालतू जानवर नहीं है।
    note: दो वाक्यों का एक आदर्श उत्तर, जिसे इस यूनिट के लेखन-अभ्यास में दोहराया जा सकता है।
  fr.a1.unit54.lesson06.teach.camille_nina_tu:
    title: Camille, Nina से पूछती है
    gloss: 'Camille: Nina, क्या तुम्हारे पास भी कोई पालतू जानवर है?'
  fr.a1.unit54.lesson06.teach.nina_oui_j:
    title: Nina के पास Pico नाम का पक्षी है
    gloss: 'Nina: हाँ, मेरे पास एक पक्षी है। उसका नाम Pico है।'
    note: '*Il s''appelle* (उसका नाम है) में वही क्रिया है जो बिल्कुल पहली इकाई में परिचय के लिए आई थी।'
  fr.a1.unit54.lesson06.teach.mathieu_comme_c:
    title: Mathieu प्रतिक्रिया देता है
    gloss: 'Mathieu: कितना अच्छा! तुम रोज़ उसके साथ क्या करती हो?'
  fr.a1.unit54.lesson06.teach.nina_je_lui:
    title: Nina रोज़ उसे खाना खिलाती है
    gloss: 'Nina: मैं रोज़ उसे खाना खिलाती हूँ।'
  fr.a1.unit54.lesson06.teach.mathieu_j_adore:
    title: Mathieu को भी पक्षी पसंद हैं
    gloss: 'Mathieu: मुझे भी पक्षी बहुत पसंद हैं।'
  fr.a1.unit54.lesson06.teach.camille_c_est:
    title: Camille बातचीत समाप्त करती है
    gloss: 'Camille: कितना अच्छा है कि हम तीनों को जानवर पसंद हैं!'
    note: इस यूनिट में तीनों पात्रों के जानवरों से जुड़े तथ्यों को एक साथ समेटता है।
