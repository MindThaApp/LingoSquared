teaching:
  fr.a1.unit54.lesson01.teach.l_animal_un:
    title: जानवर, पालतू जानवर
    gloss: जानवर / पालतू जानवर
    note: '*Un animal* सामान्य शब्द है; *un animal de compagnie* (शाब्दिक अर्थ ''साथ रहने वाला जानवर'') विशेष रूप से पालतू जानवर को कहते हैं।'
