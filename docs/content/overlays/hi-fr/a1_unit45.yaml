teaching:
  fr.a1.unit45.lesson01.teach.tu_fais_quoi:
    title: किसी का पेशा पूछना
    gloss: आप काम क्या करते हैं?
    note: किसी के पेशे के बारे में पूछने का सामान्य, अनौपचारिक तरीका।
  fr.a1.unit45.lesson01.teach.le_metier_cuisinier:
    title: पेशा / रसोइया
    gloss: पेशा; रसोइया
    note: '*Métier* (पेशा) पुल्लिंग है: *le métier*। *Cuisinier* स्त्री के लिए बदल जाता है: *un cuisinier*, *une cuisinière*।'
    example_gloss:
    - आपका पेशा क्या है?
    - मैं रसोइये का काम करता हूँ।
  fr.a1.unit45.lesson01.teach.je_travaille_comme:
    title: बताना कि आप रसोइया हैं
    gloss: मैं रसोइये का काम करता हूँ।
    note: '*Travailler comme* + पेशा नौकरी बताने का मानक ढाँचा है; पेशे वाली संज्ञा से पहले कोई आर्टिकल नहीं आता।'
  fr.a1.unit45.lesson01.teach.infirmiere:
    title: नर्स
    gloss: नर्स
    note: इस पेशे के लिए आधुनिक, लिंग-निरपेक्ष शब्द, जो किसी भी लिंग के लिए प्रयुक्त होता है।
    example_gloss: मैं नर्स का काम करता हूँ।
  fr.a1.unit45.lesson01.teach.je_travaille_comme_2:
    title: बताना कि आप नर्स हैं
    gloss: मैं नर्स का काम करता हूँ।
    note: यह *cuisinier* जैसा ही *travailler comme* ढाँचा है; स्त्रीलिंग रूप *infirmière* है।
  fr.a1.unit45.lesson02.teach.ou_travailles_tu:
    title: कार्यस्थल के बारे में पूछना
    gloss: आप कहाँ काम करते हैं?
    note: '*Tu fais quoi dans la vie ?* के बाद पूछा जाने वाला सीधा अगला प्रश्न।'
  fr.a1.unit45.lesson02.teach.je_travaille_dans:
    title: रेस्तराँ में काम करना
    gloss: मैं एक रेस्तराँ में काम करता हूँ।
    note: यहाँ *Un restaurant* में अनिश्चित आर्टिकल आता है, क्योंकि यह कई रेस्तराँओं में से एक है।
  fr.a1.unit45.lesson02.teach.l_hopital:
    title: अस्पताल
    gloss: अस्पताल
    note: '*Hôpital* पुल्लिंग है और स्वर ध्वनि से शुरू होता है: *l''hôpital*।'
    example_gloss: मैं अस्पताल में काम करता हूँ।
  fr.a1.unit45.lesson02.teach.je_travaille_a:
    title: अस्पताल में काम करना
    gloss: मैं अस्पताल में काम करता हूँ।
    note: '*À l''hôpital* में निश्चित आर्टिकल आता है, क्योंकि यह कोई ख़ास, जाना-पहचाना स्थान है; स्वर ध्वनि से पहले *le* का रूप *l''* हो जाता है।'
  fr.a1.unit45.lesson02.teach.certaines_personnes_travaillent:
    title: दफ़्तर में काम करना
    gloss: कुछ लोग दफ़्तर में काम करते हैं।
    note: '*Dans un bureau* (दफ़्तर में) में *dans un restaurant* की तरह आर्टिकल आता है।'
  fr.a1.unit45.lesson03.teach.je_commence_a:
    title: काम शुरू करने का समय
    gloss: मैं नौ बजे शुरू करता/करती हूँ।
    note: '*Commence*, *commencer* (शुरू करना) का *je* वाला रूप है; *à neuf heures* समय बताता है।'
  fr.a1.unit45.lesson03.teach.je_travaille_du:
    title: काम के दिन
    gloss: मैं सोमवार से शुक्रवार तक काम करता/करती हूँ।
    note: '*Du lundi au vendredi* का अर्थ है सोमवार से शुक्रवार तक; *du* यानी *de* + *le* और *au* यानी *à* + *le*।'
  fr.a1.unit45.lesson03.teach.la_pause:
    title: विराम
    gloss: विराम
    note: '*Pause* स्त्रीलिंग है: *la pause*।'
    example_gloss: मेरा बारह बजे विराम होता है।
  fr.a1.unit45.lesson03.teach.j_ai_une:
    title: विराम लेना
    gloss: मेरा बारह बजे विराम होता है।
    note: '*Avoir une pause* (विराम होना) इसके लिए स्वाभाविक और स्थिर प्रयोग है।'
  fr.a1.unit45.lesson03.teach.je_finis_a:
    title: काम खत्म करने का समय
    gloss: मैं पाँच बजे खत्म करता/करती हूँ।
    note: '*Finis*, *finir* (खत्म करना) का *je* वाला रूप है।'
  fr.a1.unit45.lesson03.teach.je_commence_a_2:
    title: पूरा कार्यदिवस
    gloss: मैं नौ बजे शुरू करता/करती हूँ और पाँच बजे खत्म करता/करती हूँ।
    note: '*Et* से *je commence* और *je finis* जुड़कर एक वाक्य में पूरे कार्यदिवस का वर्णन करते हैं।'
  fr.a1.unit45.lesson04.teach.avec_il_ou:
    title: il और elle के साथ क्रिया के अंत
    gloss: 'वह (पुरुष) या वह (स्त्री) के साथ नियमित -er क्रियाओं का रूप वही रहता है जो मैं के साथ होता है: je travaille, il travaille, elle travaille।'
    note: '*Travaille* रूप *je*, *il* और *elle* तीनों के साथ एक ही है: नियमित *-er* क्रियाएँ अन्य पुरुष एकवचन में कुछ नहीं जोड़तीं।'
  fr.a1.unit45.lesson04.teach.camille_travaille_comme:
    title: कैमिल का पेशा
    gloss: कैमिल नर्स के रूप में काम करती है।
    note: '*Travaille* *je*, *il* और *elle* के साथ आता है: अंत का उच्चारण नहीं होता, इसलिए तीनों रूप एक जैसे सुनाई देते हैं।'
  fr.a1.unit45.lesson04.teach.mathieu_travaille_comme:
    title: माथियू का पेशा
    gloss: माथियू रसोइये के रूप में काम करता है।
    note: अंत वही है जो *Camille travaille comme infirmière* में है।
  fr.a1.unit45.lesson04.teach.elle_travaille_a:
    title: सर्वनामों का प्रयोग
    gloss: वह अस्पताल में काम करती है। वह रेस्तराँ में काम करता है।
    note: '*Elle* और *il* कैमिल और माथियू के नामों की जगह आते हैं, पर क्रिया का रूप वही रहता है।'
  fr.a1.unit45.lesson05.teach.camille_travaille_comme:
    title: दो लोगों के कार्य-परिचय पढ़िए
    gloss: कैमिल अस्पताल में नर्स के रूप में काम करती है। वह सात बजे शुरू करती है और सोमवार से शुक्रवार तक काम करती है। माथियू रेस्तराँ में रसोइये के रूप में काम करता है। वह ग्यारह बजे शुरू करता है और चार बजे विराम लेता है।
    note: हर व्यक्ति का पेशा, कार्यस्थल और समय-सारणी अलग-अलग पहचानिए।
    glosses:
      travaille: काम करता है
      infirmière: नर्स
      l'hôpital: अस्पताल
      commence: शुरू होता है
      sept: सात
      lundi: सोमवार
      vendredi: शुक्रवार
      cuisinier: रसोइया / शेफ़
      restaurant: रेस्तराँ
      onze: ग्यारह
      pause: विराम
  fr.a1.unit45.lesson06.teach.camille_salut_mathieu:
    title: कैमिल काम के बारे में पूछती है
    gloss: 'कैमिल: नमस्ते माथियू! मुझे जिज्ञासा है, वैसे तुम काम क्या करते हो?'
    note: '*Au fait* (वैसे) सवाल को पूछताछ की जगह दोस्ताना जिज्ञासा जैसा बना देता है।'
  fr.a1.unit45.lesson06.teach.mathieu_je_travaille:
    title: माथियू जवाब देता है
    gloss: 'माथियू: मैं रेस्तराँ में रसोइये के रूप में काम करता हूँ। और तुम?'
    note: '*Et toi ?* सवाल को सामने वाले की ओर मोड़ने का सामान्य तरीका है।'
  fr.a1.unit45.lesson06.teach.camille_je_travaille:
    title: कैमिल जवाब देती है
    gloss: 'कैमिल: मैं अस्पताल में नर्स के रूप में काम करती हूँ।'
    note: यह वही पेशा और कार्यस्थल है जो पहले बताया जा चुका है।
  fr.a1.unit45.lesson06.teach.mathieu_tu_fais:
    title: माथियू समय के बारे में पूछता है
    gloss: 'माथियू: तुम्हारे काम के घंटे क्या हैं?'
    note: '*Tu fais quels horaires ?* किसी के काम के समय के बारे में पूछने का स्वाभाविक तरीका है; *quels* बहुवचन *horaires* के अनुसार बदला है।'
  fr.a1.unit45.lesson06.teach.camille_je_commence:
    title: कैमिल अपने काम के घंटे बताती है
    gloss: 'कैमिल: मैं सात बजे शुरू करती हूँ और सोमवार से शुक्रवार तक काम करती हूँ।'
    note: यह वही समय-सारणी है जो पढ़ने वाले परिचय में पहले आ चुकी है।
  fr.a1.unit45.lesson06.teach.mathieu_c_est:
    title: माथियू प्रतिक्रिया देता है
    gloss: 'माथियू: यह तो जल्दी है! मैं देर से शुरू करता हूँ, ग्यारह बजे।'
    note: यह माथियू का वही शुरू होने का समय है जो पहले बताया जा चुका है।
  fr.a1.unit45.lesson06.teach.camille_chaque_metier:
    title: कैमिल बात समाप्त करती है
    gloss: 'कैमिल: हर पेशे की अपनी अलग लय होती है, मुझे लगता है।'
    note: यह विचारपूर्ण और स्वाभाविक समापन-वाक्य है; इसे अर्थ से पहचानना काफ़ी है, हूबहू दोहराना ज़रूरी नहीं।
