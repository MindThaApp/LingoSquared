  fr.a1.unit07.lesson01.teach.banque:
    title: बैंक
    gloss: बैंक
    note: '*Banque* स्त्रीलिंग है।'
    example_gloss: बैंक रविवार को बंद रहता है।
  fr.a1.unit07.lesson01.teach.ecole:
    title: स्कूल
    gloss: स्कूल
    note: '*École* स्त्रीलिंग है; स्वर ध्वनि से पहले *l''* बन जाता है।'
    example_gloss: स्कूल पार्क के बगल में है।
  fr.a1.unit07.lesson01.teach.cafe:
    title: कैफ़े
    gloss: कैफ़े
    note: '*Café* पुल्लिंग है; दूसरे संदर्भों में इसका अर्थ "कॉफ़ी" भी होता है।'
    example_gloss: कैफ़े दिन भर खुला रहता है।
  fr.a1.unit07.lesson01.teach.poste:
    title: डाकघर
    gloss: डाकघर
    note: '*Poste* (स्त्रीलिंग) का यहाँ अर्थ "डाकघर" है; *le poste* (पुल्लिंग, अलग अर्थ) का मतलब "पद/नौकरी" हो सकता है -- लिंग बदलने से अर्थ बदल जाता है।'
    example_gloss: डाकघर छह बजे बंद होता है।
  fr.a1.unit07.lesson01.teach.la_gare_est_grande:
    title: दो जगहों की तुलना
    gloss: रेलवे स्टेशन बड़ा है और दवाखाना छोटा है।
    note: यहाँ *grande* और *petite* दोनों स्त्रीलिंग संज्ञाओं (*la gare*, *la pharmacie*) के अनुसार बदले हैं।
  fr.a1.unit07.lesson02.teach.ou_est_la_gare:
    title: किसी जगह के बारे में पूछना
    gloss: कृपया बताइए, रेलवे स्टेशन कहाँ है?
    note: '*Où est... ?* किसी जगह की स्थिति पूछने का सामान्य और हर जगह चलने वाला तरीका है।'
  fr.a1.unit07.lesson02.teach.en_face_de:
    title: '"के सामने" कहना'
    gloss: बैंक रेलवे स्टेशन के सामने है।
    note: '*En face de* (के सामने) के अंत में *de* आता है, फिर संदर्भ वाली जगह: *en face de la banque*। पुल्लिंग संज्ञा से पहले यह मिलकर बदल जाता है: *en face du café*।'
  fr.a1.unit07.lesson02.teach.a_cote_de:
    title: '"के बगल में" कहना'
    gloss: दवाखाना बैंक के बगल में है।
    note: '*À côté de* (के बगल में) में भी *en face de* की तरह *de* जुड़ता है।'
  fr.a1.unit07.lesson02.teach.pres_de:
    title: '"के पास" कहना'
    gloss: स्कूल यहाँ से पास है।
    note: '*Près de* (के पास) स्वर ध्वनि से पहले *près d''* हो जाता है, जैसे *près d''ici* (यहाँ के पास)।'
  fr.a1.unit07.lesson02.teach.loin_de:
    title: '"से दूर" कहना'
    gloss: डाकघर यहाँ से दूर है।
    note: '*Loin de* (से दूर) *près de* का सीधा उलटा है।'
  fr.a1.unit07.lesson02.teach.cest_loin:
    title: पूछना कि कोई जगह दूर है या नहीं
    gloss: क्या यह यहाँ से दूर है? — नहीं, दूर नहीं है।
    note: 'रास्ता बताए जाने के बाद *C''est loin d''ici ?* स्वाभाविक अगला सवाल है। "नहीं" कहने के लिए क्रिया को *ne... pas* से घेरिए: *ce n''est pas loin* (यह दूर नहीं है)।'
  fr.a1.unit07.lesson03.teach.line01:
    title: अजनबी से रास्ता पूछना
    gloss: Mathieu एक राहगीर से विनम्रता से पूछता है कि दवाखाना कहाँ है।
    note: किसी अजनबी के पास जाकर बात शुरू करने का सामान्य विनम्र तरीका *Excusez-moi* (माफ़ कीजिए) है, जो *vous* के साथ चलता है।
  fr.a1.unit07.lesson03.teach.line02:
    title: जगह बताना
    gloss: वह कहती है कि यह बैंक के सामने, कैफ़े के बगल में है।
    note: सटीक स्थान बताने के लिए एक ही वाक्य में *en face de* और *à côté de* साथ आए हैं। *De* + *le café* मिलकर *du café* बन जाता है।
  fr.a1.unit07.lesson03.teach.line03:
    title: पूछिए कि क्या यह दूर है
    gloss: Mathieu पूछता है कि क्या यह यहाँ से दूर है।
    note: दूरी पूछने के लिए आपने जो *C'est loin d'ici ?* सीखा था, यह वही है।
  fr.a1.unit07.lesson03.teach.line04:
    title: तसल्ली देना कि जगह पास है
    gloss: वह कहती है कि नहीं, बहुत पास है -- पैदल पाँच मिनट।
    note: '*À pied* (पैदल) चलकर जाने को बताने का सामान्य तरीका है।'
  fr.a1.unit07.lesson03.teach.line05:
    title: उसे धन्यवाद देना
    gloss: Mathieu गर्मजोशी से धन्यवाद देता है।
    note: '*Merci beaucoup* पहले की इकाइयों में सीखे *merci* को और ज़ोरदार बनाता है।'
  fr.a1.unit07.lesson03.teach.line06:
    title: धन्यवाद का जवाब देना
    gloss: वह जवाब देती है, कोई बात नहीं।
    note: '*Je vous en prie* "कोई बात नहीं / आपका स्वागत है" का अधिक औपचारिक रूप है, जो अजनबी के साथ इस्तेमाल होने वाले *vous* के स्तर से मेल खाता है; *De rien* कम औपचारिक, रोज़मर्रा का विकल्प है।'
