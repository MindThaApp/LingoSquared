course:
  title: फ़्रेंच A1
  description: आस-पड़ोस की आम जगहें और रास्ता पूछना-बताना (en face de, à côté de, près de, loin de); वर्कशॉप के पास दवाखाना ढूँढ़ने की Mathieu की तलाश जारी है। ये सभी स्थान-सूचक पद de पर समाप्त होते हैं, जो पुल्लिंग या बहुवचन संज्ञा से पहले du/des में बदल जाता है (du café, des arbres)।
