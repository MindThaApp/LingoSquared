teaching:
  fr.a1.unit52.lesson01.teach.lire_faire_du:
    title: पढ़ना, कसरत करना, खाना बनाना
    gloss: पढ़ना, कसरत/खेलकूद करना, खाना पकाना
    note: 'शौक़ों की तीन आम क्रियाएँ: *lire* (पढ़ना), *faire du sport* (व्यायाम करना या खेल खेलना) और *cuisiner* (खाना बनाना)।'
    example_gloss:
    - मुझे किताब पढ़ना पसंद है।
    - मैं शनिवार को कसरत करता हूँ।
    - मुझे दोस्तों के लिए खाना बनाना पसंद है।
  fr.a1.unit52.lesson01.teach.le_temps_libre:
    title: ख़ाली समय
    gloss: ख़ाली समय
    note: '*Temps libre* पुल्लिंग है: *le temps libre*। शौक़ों की बात करने के लिए यह मुख्य अभिव्यक्ति है।'
    example_gloss: ख़ाली समय में मुझे पढ़ना पसंद है।
  fr.a1.unit52.lesson01.teach.pendant_mon_temps:
    title: ख़ाली समय में क्या करते हैं, यह बताना
    gloss: ख़ाली समय में मुझे पढ़ना पसंद है।
    note: '*Lis*, *lire* (पढ़ना) का *je* वाला रूप है; अंत का *s* नहीं बोला जाता।'
  fr.a1.unit52.lesson02.teach.ecouter_de_la:
    title: संगीत, चित्रकारी, वीडियो गेम
    gloss: संगीत सुनना, चित्र बनाना, वीडियो गेम खेलना
    note: 'तीन और शौक़: *écouter de la musique*, *dessiner* और *jouer aux jeux vidéo*। खेलों के साथ *jouer à* + *les* मिलकर *jouer aux* बन जाता है।'
    example_gloss:
    - मुझे संगीत सुनना पसंद है।
    - मैं अक्सर चित्र बनाता/बनाती हूँ।
    - मुझे दोस्तों के साथ वीडियो गेम खेलना पसंद है।
  fr.a1.unit52.lesson02.teach.j_aime_ecouter:
    title: कहना कि आपको संगीत सुनना पसंद है
    gloss: मुझे संगीत सुनना पसंद है।
    note: '*Écouter* के साथ कर्म सीधे आता है, बीच में कोई शब्द नहीं लगता: *écouter de la musique*।'
  fr.a1.unit52.lesson02.teach.j_aime_jouer:
    title: कहना कि आपको दोस्तों के साथ वीडियो गेम खेलना पसंद है
    gloss: मुझे दोस्तों के साथ वीडियो गेम खेलना पसंद है।
    note: '*Avec des amis* (दोस्तों के साथ) में पाठ 1 का *amis* फिर आया है; *des* बहुवचन का "कुछ" है।'
  fr.a1.unit52.lesson03.teach.toujours_souvent_parfois:
    title: हमेशा, अक्सर, कभी-कभी, कभी नहीं
    gloss: हमेशा, अक्सर, कभी-कभी, कभी नहीं
    note: आवृत्ति बताने वाले चार मुख्य क्रियाविशेषण। *Souvent* शायद पहले से परिचित हो; *toujours*, *parfois* और *jamais* नए हैं। *Jamais* के लिए क्रिया से पहले *ne* ज़रूरी है।
    example_gloss:
    - मैं हर शनिवार हमेशा कसरत करता/करती हूँ।
    - मैं अक्सर कोई किताब पढ़ता/पढ़ती हूँ।
    - मैं कभी-कभी चित्र बनाता/बनाती हूँ।
    - मैं कभी वीडियो गेम नहीं खेलता/खेलती।
  fr.a1.unit52.lesson03.teach.chaque_semaine_chaque:
    title: हर हफ़्ते, हर सप्ताहांत
    gloss: हर हफ़्ते, हर सप्ताहांत
    note: '*Chaque semaine* और *chaque week-end* दोनों का अर्थ "हर" है। संज्ञा का लिंग कुछ भी हो, *chaque* कभी नहीं बदलता।'
    example_gloss:
    - मैं हर हफ़्ते दोस्तों के लिए खाना बनाता/बनाती हूँ।
    - मैं हर सप्ताहांत कसरत करता/करती हूँ।
  fr.a1.unit52.lesson03.teach.chaque_ne_change:
    title: Chaque कभी नहीं बदलता
    gloss: '*Chaque* पुल्लिंग और स्त्रीलिंग संज्ञाओं से पहले एक जैसा रहता है: *chaque semaine*, *chaque week-end*।'
    note: '*Semaine* स्त्रीलिंग है और *week-end* पुल्लिंग, फिर भी *chaque* दोनों के लिए एक ही है। *tous les* / *toutes les* से तुलना कीजिए, जो बदलते हैं।'
  fr.a1.unit52.lesson03.teach.qu_est_ce:
    title: खाली समय के बारे में पूछना
    gloss: आप अपने खाली समय में क्या करते हैं?
    note: यह इस इकाई का मुख्य प्रश्न है -- किसी से भी उसके शौक़ पूछने के लिए इसका इस्तेमाल कीजिए।
  fr.a1.unit52.lesson04.teach.camille_on_se:
    title: Camille शौक़ों की बात छेड़ती है
    gloss: 'Camille: हम अक्सर साथ टहलते हैं। पर Mathieu, तुम खाली समय में और क्या करते हो?'
    note: '*On se promène souvent* में "हम" के लिए *on* है, और *souvent* क्रिया के ठीक बाद आता है।'
  fr.a1.unit52.lesson04.teach.mathieu_j_aime:
    title: Mathieu के शौक़
    gloss: 'Mathieu: मुझे खाना बनाना पसंद है, घर पर भी। और मैं अक्सर व्यायाम करता हूँ।'
    note: '*Même à la maison* (घर पर भी) से साफ़ होता है कि Mathieu शौक़ से खाना बनाता है, सिर्फ़ नौकरी के लिए नहीं।'
  fr.a1.unit52.lesson04.teach.camille_tu_cuisines:
    title: Camille हैरान है
    gloss: 'Camille: तुम घर पर भी खाना बनाते हो? तुम तो पहले ही दिन भर काम पर खाना बनाते हो!'
    note: '*Toute la journée* (पूरे दिन) से ज़ोर मिलता है कि Mathieu काम पर पहले ही कितना खाना बनाता है।'
  fr.a1.unit52.lesson04.teach.mathieu_oui_mais:
    title: Mathieu समझाता है
    gloss: 'Mathieu: हाँ, पर मुझे खाना बनाना आरामदायक लगता है। और तुम्हें क्या करना पसंद है?'
    note: '*Cuisiner, je trouve ça relaxant* में ज़ोर देने के लिए *cuisiner* पहले आता है: शाब्दिक अर्थ "खाना बनाना, मुझे वह आरामदायक लगता है"।'
  fr.a1.unit52.lesson04.teach.camille_j_aime:
    title: Camille के शौक़
    gloss: 'कामिल: मुझे पढ़ना पसंद है और मैं अक्सर संगीत सुनती हूँ।'
    note: पाठ 1 और पाठ 2 के दो शौकों को *et* (और) से एक वाक्य में जोड़ता है।
  fr.a1.unit52.lesson04.teach.mathieu_tu_joues:
    title: माथ्यू वीडियो गेम के बारे में पूछता है
    gloss: 'माथ्यू: क्या तुम भी वीडियो गेम खेलते हो?'
    note: 'हाँ/नहीं वाला एक छोटा प्रश्न: *Tu joues aussi aux jeux vidéo ?* बढ़ते स्वर से यह प्रश्न बन जाता है।'
  fr.a1.unit52.lesson04.teach.camille_non_je:
    title: कामिल जवाब देती है
    gloss: 'कामिल: नहीं, मैं कभी वीडियो गेम नहीं खेलती। लेकिन कभी-कभी चित्र बनाती हूँ!'
    note: पाठ 3 के *jamais* (कभी नहीं) और *parfois* (कभी-कभी), एक ही उत्तर में आमने-सामने।
  fr.a1.unit52.lesson05.teach.mathieu_et_moi:
    title: शौक़ों की तुलना
    gloss: माथ्यू और मैं अक्सर साथ टहलते हैं। लेकिन हमारे और भी शौक हैं। माथ्यू को खाना बनाना पसंद है, घर पर भी, और वह अक्सर खेलकूद करता है। मुझे पढ़ना पसंद है और मैं अक्सर संगीत सुनती हूँ। मैं कभी-कभी चित्र बनाती हूँ, लेकिन कभी वीडियो गेम नहीं खेलती। तुम्हें खाली समय में क्या करना पसंद है?
    note: कामिल का संदेश पाठ 4 की बातें दोहराता है और अंत में पाठक से इस यूनिट का मुख्य प्रश्न पूछता है।
    glosses:
      promène: टहलना
      souvent: अक्सर
      ensemble: साथ में
      d'autres: दूसरे
      cuisiner: खाना बनाता है
      aime: पसंद है
      maison: घर पर
      sport: कसरत करता है
      lire: पढ़ना
      j'écoute: सुनना
      musique: संगीत
      dessine: चित्र बनाती हूँ
      parfois: कभी-कभी
      jeux: वीडियो गेम खेलना
      jamais: कभी नहीं
      libre: खाली
      temps: समय
  fr.a1.unit52.lesson06.teach.mathieu_qu_est:
    title: माथ्यू सप्ताहांत के बारे में पूछता है
    gloss: 'माथ्यू: तुम इस सप्ताहांत क्या कर रहे हो?'
    note: '*Ce week-end* (इस सप्ताहांत) में *ce* इसलिए आता है क्योंकि *week-end* पुल्लिंग है।'
  fr.a1.unit52.lesson06.teach.camille_je_ne:
    title: कामिल असमंजस में है
    gloss: 'कामिल: अभी पता नहीं। मुझे पढ़ना पसंद है, पर मैं बाहर भी जाना चाहती हूँ।'
    note: '*Sortir* (बाहर जाना) घर से निकलने की इच्छा बताने का आम तरीका है।'
  fr.a1.unit52.lesson06.teach.mathieu_on_se:
    title: माथ्यू एक योजना सुझाता है
    gloss: 'माथ्यू: साथ टहलें? उसके बाद मैं हम दोनों के लिए खाना बनाऊँगा।'
    note: '*Après* (उसके बाद) दो योजनाओं को क्रम में रखता है, जैसे *d''abord* और *ensuite*।'
  fr.a1.unit52.lesson06.teach.camille_bonne_idee:
    title: कामिल सहमत होती है
    gloss: 'कामिल: अच्छा विचार! मुझे टहलना और खाना बनाना, दोनों बराबर पसंद हैं।'
    note: '*Autant ... que* (उतना ... जितना) दिखाता है कि कामिल को दोनों चीज़ें बराबर पसंद हैं, एक को दूसरी से ज़्यादा नहीं।'
  fr.a1.unit52.lesson06.teach.mathieu_parfait_alors:
    title: माथ्यू पक्का करता है
    gloss: 'माथ्यू: बढ़िया। तो शनिवार को मिलते हैं!'
    note: '*samedi* (शनिवार) की योजना पक्की करने वाली एक दोस्ताना समापन पंक्ति।'
