teaching:
  fr.a1.unit51.lesson01.teach.combien_ca_coute:
    title: कुल कीमत पूछना
    gloss: कुल मिलाकर कितना होता है?
    note: '*En tout* (कुल मिलाकर) से साफ़ होता है कि आप सबकी जोड़ी हुई पूरी क़ीमत पूछ रहे हैं, किसी एक चीज़ की नहीं।'
  fr.a1.unit51.lesson01.teach.ca_coute_vingt:
    title: कुल कीमत बताना
    gloss: कुल मिलाकर पच्चीस यूरो होता है।
    note: '*Ça coûte* में *ça* (यह) के साथ *coûte* आता है, जो *coûter* (क़ीमत होना) का एक वस्तु के लिए प्रयुक्त रूप है।'
  fr.a1.unit51.lesson02.teach.payer_par_carte:
    title: कार्ड या नकद से भुगतान करना
    gloss: कार्ड से भुगतान करना, नकद भुगतान करना
    note: '*Payer par carte* कार्ड से भुगतान करने का सामान्य वाक्यांश है, और *payer en espèces* का अर्थ नक़द भुगतान है। *carte* के साथ *par* और *espèces* के साथ *en* आता है।'
    example_gloss:
    - क्या मैं यहाँ कार्ड से भुगतान कर सकता हूँ?
    - मैं नकद भुगतान कर रहा हूँ।
  fr.a1.unit51.lesson02.teach.je_peux_payer:
    title: कार्ड से भुगतान की संभावना पूछना
    gloss: क्या मैं यहाँ कार्ड से भुगतान कर सकता हूँ?
    note: '*Ici* (यहाँ) प्रश्न को उसी काउंटर से जोड़ता है जहाँ आप खड़े हैं।'
  fr.a1.unit51.lesson02.teach.vous_voulez_payer:
    title: भुगतान की पसंद पूछना
    gloss: आप नकद भुगतान करना चाहेंगे या कार्ड से?
    note: '*Vous voulez ... ?* पूछने का औपचारिक तरीक़ा है, जिसे कोई अनजान कैशियर इस्तेमाल करता है; दोस्त *tu veux ... ?* कहते हैं।'
  fr.a1.unit51.lesson03.teach.l_addition:
    title: बिल
    gloss: बिल
    note: '*Addition* स्त्रीलिंग है: *l''addition*। स्वर से पहले *La* छोटा होकर *l''* बन जाता है।'
    example_gloss: क्या हम बिल बाँट लें?
  fr.a1.unit51.lesson03.teach.on_partage_l:
    title: बिल बाँटने का सुझाव देना
    gloss: क्या हम बिल बाँट लें?
    note: '*On ... ?* साथ मिलकर कुछ करने का प्रस्ताव रखता है, जैसे *On partage ?*। *Partager* (बाँटना) *l''addition* के साथ प्रयुक्त होता है।'
  fr.a1.unit51.lesson03.teach.je_peux_payer:
    title: अलग-अलग भुगतान करने को कहना
    gloss: क्या मैं अलग से भुगतान कर सकता हूँ?
    note: '*Séparément* (अलग-अलग) *payer* के ठीक बाद आता है; बिल में अपना हिस्सा अलग चुकाने के लिए यह विनम्र तरीक़ा है।'
  fr.a1.unit51.lesson04.teach.la_monnaie:
    title: बाकी पैसे
    gloss: बाकी पैसे
    note: '*Monnaie* स्त्रीलिंग है: *la monnaie*। इसका अर्थ वे सिक्के और नोट हैं जो आपको वापस मिलते हैं।'
    example_gloss: ये रहे आपके बाकी पैसे।
  fr.a1.unit51.lesson04.teach.voici_votre_monnaie:
    title: बाकी पैसे लौटाना
    gloss: ये रहे आपके बाकी पैसे।
    note: '*Votre* ''आपका'' का औपचारिक रूप है, जो काउंटर पर *vous* वाले औपचारिक ढंग से मेल खाता है।'
  fr.a1.unit51.lesson04.teach.je_n_ai:
    title: बाकी पैसे लेने से मना करना
    gloss: मुझे बाकी पैसे नहीं चाहिए।
    note: '*Avoir besoin de* (ज़रूरत होना) के बाद संज्ञा आती है: *Je n''ai pas besoin de monnaie.* *ne ... pas* के बाद *de la* की जगह *de* आता है।'
  fr.a1.unit51.lesson05.teach.trente_cinq:
    title: पैंतीस
    gloss: पैंतीस
    note: '*Trente-cinq* हाइफ़न के साथ लिखा जाता है और इसमें दहाई पहले आती है: तीस + पाँच।'
    example_gloss: इसकी कीमत पैंतीस यूरो है।
  fr.a1.unit51.lesson05.teach.addition_deux_plats:
    title: रेस्तराँ का बिल पढ़िए
    gloss: 'बिल: दो मुख्य व्यंजन और दो कॉफ़ी। कुल: पैंतीस यूरो। कार्ड से भुगतान किया गया।'
    note: देखिए कि क्या मँगाया गया, कुल कितना हुआ और भुगतान कैसे किया गया।
    glosses:
      Addition: बिल
      deux: दो
      plats: मुख्य व्यंजन
      cafés: कॉफ़ी
      Total: कुल
      trente-cinq: पैंतीस
      euros: यूरो
      Payé: चुकाया गया
      carte: कार्ड
  fr.a1.unit51.lesson06.teach.camille_on_demande:
    title: Camille बिल माँगने को कहती है
    gloss: 'Camille: क्या हम बिल माँगें?'
    note: '*Demander* (माँगना) के साथ *l''addition* सीधे कर्म के रूप में आता है, बीच में कोई अतिरिक्त शब्द नहीं लगता।'
  fr.a1.unit51.lesson06.teach.mathieu_oui_bonne:
    title: Mathieu कुल रकम पूछता है
    gloss: 'Mathieu: हाँ, अच्छा विचार है। कुल मिलाकर कितना होता है?'
    note: पाठ 1 का सवाल *Combien ça coûte en tout ?* यहाँ फिर आया है।
  fr.a1.unit51.lesson06.teach.camille_ca_fait:
    title: Camille कुल रकम बताती है
    gloss: 'Camille: पैंतीस यूरो हुए। बाँट लें?'
    note: '*Ça fait* + रकम से कुल राशि बताई जाती है, और *partager* बिल की ओर इशारा करता है।'
  fr.a1.unit51.lesson06.teach.mathieu_non_laisse:
    title: Mathieu भुगतान करने की ज़िद करता है
    gloss: 'Mathieu: नहीं, आज मुझे भुगतान करने दो। तुमने मेरी बहुत मदद की है।'
    note: '*Laisse-moi* + क्रिया का मूल रूप कुछ करने की पेशकश करता है, और *aidé*, *aider* (मदद करना) का भूतकालिक कृदंत है।'
  fr.a1.unit51.lesson06.teach.camille_c_est:
    title: Camille भावुक हो जाती है
    gloss: 'Camille: यह तुम्हारी तरफ़ से बहुत अच्छी बात है! शुक्रिया।'
    note: '*C''est gentil de ta part* (यह तुम्हारी ओर से दयालुता है) उदार भाव के लिए कहा जाने वाला आत्मीय और आम वाक्य है।'
  fr.a1.unit51.lesson06.teach.mathieu_je_peux:
    title: Mathieu कार्ड से भुगतान के बारे में पूछता है
    gloss: 'Mathieu: क्या मैं यहाँ कार्ड से भुगतान कर सकता हूँ?'
    note: '*Je peux payer par carte ici ?* पाठ 2 से दोहराया गया है, अब असली रेस्तराँ में।'
  fr.a1.unit51.lesson06.teach.mathieu_paie_l:
    title: 'Paie: "वह" का रूप'
    gloss: Mathieu बिल का भुगतान करता है।
    note: '*Paie*, *payer* (भुगतान करना) का *il/elle* रूप है: *je paie, tu paies, il paie*।'
