teaching:
  fr.a1.unit05.lesson01.teach.poulet:
    title: चिकन
    gloss: चिकन
    note: '*Poulet* पुल्लिंग है।'
    example_gloss: मुझे थोड़ा चिकन चाहिए।
  fr.a1.unit05.lesson01.teach.poisson:
    title: मछली
    gloss: मछली
    note: '*Poisson* पुल्लिंग है।'
    example_gloss: मछली आज ताज़ी है।
  fr.a1.unit05.lesson01.teach.salade:
    title: सलाद
    gloss: सलाद
    note: '*Salade* स्त्रीलिंग है।'
    example_gloss: वह सलाद खा रही है।
  fr.a1.unit05.lesson01.teach.riz:
    title: चावल
    gloss: चावल
    note: '*Riz* पुल्लिंग है और अपरिवर्तित रहता है (एकवचन और बहुवचन में वर्तनी एक ही रहती है, जैसे *prix* में)।'
    example_gloss: चावल चिकन के साथ अच्छा लगता है।
  fr.a1.unit05.lesson01.teach.eau:
    title: पानी
    gloss: पानी
    note: '*Eau* स्त्रीलिंग है; स्वर-ध्वनि से पहले *l''* का रूप आता है, ठीक वैसे ही जैसे इसी यूनिट में आगे *l''addition* में।'
    example_gloss: मुझे थोड़ा पानी चाहिए, कृपया।
  fr.a1.unit05.lesson01.teach.vin:
    title: वाइन
    gloss: वाइन
    note: '*Vin* पुल्लिंग है।'
    example_gloss: रेड वाइन बहुत स्वादिष्ट है।
  fr.a1.unit05.lesson01.teach.je_voudrais_poulet_salade:
    title: चिकन और सलाद मँगवाना
    gloss: मुझे चिकन और सलाद चाहिए।
    note: '*Du poulet* (पुल्लिंग) और *de la salade* (स्त्रीलिंग) आंशिक आर्टिकल हैं ("कुछ/थोड़ा"), जो संज्ञा के लिंग के अनुसार बदलते हैं। मात्रा के बाद (*un kilo de*) केवल सादा *de* आता है।'
  fr.a1.unit05.lesson02.teach.dessert:
    title: Dessert
    gloss: मिठाई
    note: '*Dessert* पुल्लिंग है।'
    example_gloss: मिठाई आज मुफ़्त है।
  fr.a1.unit05.lesson02.teach.addition:
    title: बिल
    gloss: बिल
    note: '*Addition* स्त्रीलिंग है; स्वर-ध्वनि से पहले *l''* का रूप आता है। रेस्टोरेंट में बिल के लिए यही सामान्य फ़्रेंच शब्द है, *facture* नहीं (जो औपचारिक इनवॉइस होता है)।'
    example_gloss: बिल दीजिए, कृपया।
  fr.a1.unit05.lesson02.teach.vous_avez_choisi:
    title: पूछना कि ऑर्डर तैयार है या नहीं
    gloss: क्या आपने चुन लिया?
    note: ऑर्डर लेने के लिए मेज़ पर आते समय वेटर का सामान्य सवाल; इसमें *choisir* (चुनना) का passé composé रूप है।
  fr.a1.unit05.lesson02.teach.je_voudrais_un_cafe:
    title: कॉफ़ी मँगवाना
    gloss: मुझे एक कॉफ़ी चाहिए, कृपया।
    note: '*Je voudrais* + चीज़ का नाम, वही ढाँचा जो खरीदारी में इस्तेमाल हुआ था, अब खाने-पीने के लिए।'
  fr.a1.unit05.lesson02.teach.qcq_comme_dessert:
    title: पूछना कि क्या उपलब्ध है
    gloss: मिठाई में आपके पास क्या है?
    note: '*Qu''est-ce que vous avez comme...?* किसी श्रेणी में कौन-से विकल्प हैं, यह पूछने का स्वाभाविक और आम तरीका है।'
  fr.a1.unit05.lesson02.teach.cest_delicieux:
    title: कहना कि कुछ स्वादिष्ट है
    gloss: यह बहुत स्वादिष्ट है!
    note: खाने पर उत्साह भरी आम प्रतिक्रिया; *délicieux* यहाँ नहीं बदलता, क्योंकि *c'est* के साथ कोई लिंग वाली संज्ञा नहीं जुड़ी है।
  fr.a1.unit05.lesson03.teach.line01:
    title: अभिवादन और ऑर्डर के बारे में पूछना
    gloss: वेटर अभिवादन करता है और पूछता है कि क्या वे ऑर्डर देने के लिए तैयार हैं।
    note: शुरुआत *Bonjour* से होती है, जो सेवा-स्थलों पर शिष्ट संबोधन है।
  fr.a1.unit05.lesson03.teach.line02:
    title: सलाद और पानी मँगवाना
    gloss: Inès सलाद और पानी मँगवाती है।
    note: एक ही वाक्य में दो चीज़ें जोड़ने के लिए *je voudrais* के साथ *et* का प्रयोग।
  fr.a1.unit05.lesson03.teach.line03:
    title: चावल के साथ चिकन मँगवाना
    gloss: Mathieu चावल के साथ चिकन मँगवाता है।
    note: '*Avec* (के साथ) मुख्य व्यंजन को उसके साथ वाली चीज़ से जोड़ता है; ऑर्डर देने का सरल और आम ढाँचा।'
  fr.a1.unit05.lesson03.teach.line04:
    title: पुष्टि करना और पेय के बारे में पूछना
    gloss: वेटर ऑर्डर की पुष्टि करता है और पेय के बारे में पूछता है।
    note: '*Et comme boisson pour vous ?* में वही *comme* वाला ढाँचा है जो *Qu''est-ce que vous avez comme dessert ?* में था, अब पेय के लिए।'
  fr.a1.unit05.lesson03.teach.line05:
    title: एक गिलास वाइन मँगवाना
    gloss: Mathieu एक गिलास रेड वाइन मँगवाता है।
    note: '*Un verre de* (एक गिलास) गिलास के हिसाब से वाइन मँगवाने का सामान्य तरीका है।'
  fr.a1.unit05.lesson03.teach.line06:
    title: खाने पर प्रतिक्रिया देना
    gloss: Inès कहती है कि सलाद स्वादिष्ट है।
    note: '*C''est délicieux !* का फिर प्रयोग, अब किसी खास व्यंजन (*cette salade*) के लिए। *salade* स्त्रीलिंग होने पर भी *c''est* के बाद *délicieux* पुल्लिंग ही रहता है; *Elle est délicieuse, cette salade !* लिंग के अनुसार बदला हुआ दूसरा रूप है।'
  fr.a1.unit05.lesson03.teach.line07:
    title: भूख की वजह बताना और बिल माँगना
    gloss: Mathieu कहता है कि वर्कशॉप ने उन्हें भूखा कर दिया और बिल माँगता है।
    note: '*Nous a donné faim* (शाब्दिक अर्थ: "हमें भूख दी") फ़्रेंच में यह कहने का स्वाभाविक तरीका है कि किसी चीज़ से भूख लग आई।'
  fr.a1.unit05.lesson03.teach.line08:
    title: पुष्टि करना कि बिल आ रहा है
    gloss: वेटर पुष्टि करता है कि वह तुरंत बिल लाएगा।
    note: '*Tout de suite* (तुरंत) सेवा-स्थलों पर इस्तेमाल होने वाला आम, आश्वस्त करने वाला वाक्यांश है।'
