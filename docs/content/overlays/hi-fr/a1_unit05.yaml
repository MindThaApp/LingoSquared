course:
  title: फ़्रेंच A1
  description: खाने-पीने के आम शब्द और कैफ़े में ऑर्डर देने की बातचीत। Inès और Mathieu की कुकिंग वर्कशॉप की कहानी आगे बढ़ती है और क्लास के बाद दोनों साथ भोजन करते हैं। गिनी न जा सकने वाली खाने की चीज़ों के साथ आने वाले आंशिक आर्टिकल du/de la/de l' पर खास ध्यान दिया गया है।
