teaching:
  fr.a1.unit47.lesson01.teach.le_temps:
    title: मौसम
    gloss: मौसम
    note: '*Le temps* का अर्थ ''मौसम'' भी है और ''समय'' भी; यह पुल्लिंग शब्द है।'
    example_gloss: मौसम कैसा है?
  fr.a1.unit47.lesson01.teach.quel_temps_fait:
    title: मौसम के बारे में पूछना
    gloss: मौसम कैसा है?
    note: '*Quel temps fait-il ?* मौसम के बारे में पूछने का सामान्य प्रश्न है; *quel* पुल्लिंग संज्ञा *temps* के अनुसार रूप लेता है।'
  fr.a1.unit47.lesson01.teach.le_temps_est:
    title: धूप वाला
    gloss: मौसम धूप वाला है।
    note: '*Le temps est* + विशेषण एक सामान्य ढाँचा है; विशेषण पुल्लिंग संज्ञा *temps* के अनुसार चलता है।'
  fr.a1.unit47.lesson01.teach.il_pleut:
    title: बारिश
    gloss: बारिश हो रही है।
    note: '*Pleuvoir* (बारिश होना) का प्रयोग अव्यक्तिक रूप में होता है: *il pleut*, इसमें अलग से किसी विशेषण की ज़रूरत नहीं होती।'
  fr.a1.unit47.lesson01.teach.le_temps_est_2:
    title: बादलों वाला
    gloss: मौसम बादलों भरा है।
    note: यह भी *ensoleillé* की तरह *le temps est* + विशेषण वाला ढाँचा है।
  fr.a1.unit47.lesson02.teach.il_fait_froid:
    title: ठंड
    gloss: आज ठंड है।
    note: '*Aujourd''hui* (आज) मौसम को समय से जोड़ता है; *il fait froid* में *être* नहीं, *faire* क्रिया आती है।'
  fr.a1.unit47.lesson02.teach.il_fait_chaud:
    title: गर्मी
    gloss: आज गर्मी है।
    note: रोज़ की मौसम-बातचीत में *il fait chaud* 'गुनगुना' और 'तेज़ गर्मी' दोनों के लिए चलता है।
  fr.a1.unit47.lesson02.teach.il_ne_fait:
    title: तापमान की तुलना
    gloss: ठंड नहीं है, गर्मी है।
    note: '*Ne ... pas* क्रिया को घेर लेता है: *il ne fait pas froid*।'
  fr.a1.unit47.lesson03.teach.la_meteo:
    title: मौसम का पूर्वानुमान
    gloss: मौसम का पूर्वानुमान
    note: '*La météo* स्त्रीलिंग है और *la météorologie* का संक्षिप्त रूप है।'
    example_gloss: मौसम का पूर्वानुमान क्या है?
  fr.a1.unit47.lesson03.teach.demain_le_temps:
    title: कल का मौसम
    gloss: कल मौसम धूप वाला रहेगा।
    note: '*Demain* वाक्य की शुरुआत में आता है और उसके बाद अल्पविराम लगता है; बाकी वाक्य का क्रम सामान्य रहता है।'
  fr.a1.unit47.lesson03.teach.samedi_le_temps:
    title: दो दिन का पूर्वानुमान
    gloss: शनिवार को मौसम धूप वाला और गर्म रहेगा, लेकिन रविवार को पूरे दिन बारिश होगी।
    note: '*Toute la journée* (पूरे दिन) बताता है कि बारिश कितनी देर तक रहती है।'
  fr.a1.unit47.lesson04.teach.la_promenade:
    title: सैर
    gloss: सैर
    note: '*Promenade* स्त्रीलिंग है: *la promenade*।'
    example_gloss: क्या हम सैर पर चलें?
  fr.a1.unit47.lesson04.teach.on_fait_une:
    title: सैर का सुझाव देना
    gloss: क्या हम सैर पर चलें?
    note: '*On fait une promenade ?* योजना का दोस्ताना सुझाव देने का तरीका है; ''सैर पर जाना'' कहने के लिए *faire une promenade* निश्चित प्रयोग है।'
  fr.a1.unit47.lesson04.teach.s_il_pleut:
    title: शर्त वाली योजना
    gloss: अगर बारिश हुई, तो हम अंदर ही रहेंगे।
    note: '*S''il pleut* (अगर बारिश हो): *si* + *il* मिलकर *s''il* बन जाता है; फिर *on reste à l''intérieur* बताता है कि आप क्या करेंगे।'
  fr.a1.unit47.lesson04.teach.bonne_idee_faisons:
