    title: कैमिल सप्ताहांत के बारे में पूछती है
    gloss: 'कैमिल: इस सप्ताहांत मौसम कैसा रहेगा?'
    note: '*Ce week-end* (इस सप्ताहांत) प्रश्न को निकट भविष्य से जोड़ता है।'
  fr.a1.unit47.lesson06.teach.mathieu_samedi_le:
    title: माथ्यू पूर्वानुमान बताता है
    gloss: 'माथ्यू: शनिवार को मौसम धूप वाला और गर्म रहेगा, लेकिन रविवार को पूरे दिन बारिश होगी।'
    note: यह ठीक वही पूर्वानुमान है जो आपने अभी पढ़ा था।
  fr.a1.unit47.lesson06.teach.camille_alors_on:
