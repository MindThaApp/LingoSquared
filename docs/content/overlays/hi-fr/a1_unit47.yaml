    note: यहाँ *Tranquillement* का अर्थ है 'आराम से, बिना जल्दबाज़ी के', जिससे अंदर रहना सुखद लगता है।
  fr.a1.unit47.lesson06.teach.camille_parfait_alors:
    title: कैमिल योजना पक्की करती है
    gloss: 'कैमिल: बढ़िया, तो हम फ़िल्म देखेंगे।'
    note: '*Regarder* (देखना) स्वाभाविक रूप से *un film* (एक फ़िल्म) के साथ आता है।'
