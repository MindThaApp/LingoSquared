teaching:
  fr.a1.unit50.lesson01.teach.appeler:
    title: फ़ोन करना
    gloss: फ़ोन करना
    note: फ़ोन कॉल करने वाली क्रिया का मूल रूप।
    example_gloss: मुझे तुम्हें फ़ोन करना है।
  fr.a1.unit50.lesson01.teach.je_t_appelle:
    title: फ़ोन करने की बात कहना
    gloss: मैं तुम्हें फ़ोन करूँगा।
    note: '*Appelle*, *appeler* का *je* रूप है; फ्रेंच में यहाँ वर्तमान काल आता है, भले ही बात आगे की हो।'
  fr.a1.unit50.lesson01.teach.allo_c_est:
    title: फ़ोन उठाना
    gloss: हैलो, मैं Camille बोल रही हूँ।
    note: फ़ोन पर अपना परिचय देने का सामान्य फ्रेंच तरीका है *c'est* + नाम।
  fr.a1.unit50.lesson01.teach.allo_c_est_2:
    title: Mathieu भी उसी तरह जवाब देता है
    gloss: हैलो, मैं Mathieu बोल रहा हूँ।
    note: वही *c'est* + नाम वाला ढाँचा, जो *Allô, c'est Camille* में है।
  fr.a1.unit50.lesson02.teach.qui_est_a:
    title: पूछना कि फ़ोन किसका है
    gloss: मैं किससे बात कर रहा हूँ?
    note: अनजान फ़ोन करने वाले से उसका परिचय पूछने का सामान्य तरीका है *Qui est à l'appareil ?*।
  fr.a1.unit50.lesson02.teach.vous_parlez_avec:
    title: औपचारिक ढंग से अपना परिचय देना
    gloss: आप Camille से बात कर रहे हैं।
    note: '*Vous parlez avec* + नाम, *c''est* + नाम का औपचारिक रूप है।'
  fr.a1.unit50.lesson03.teach.tu_peux_repeter:
    title: बात दोहराने को कहना
    gloss: क्या तुम इसे दोहरा सकते हो?
    note: '*Tu peux ...* (क्या तुम ... सकते हो?) के बाद क्रिया का मूल रूप *répéter* (दोहराना) आता है।'
  fr.a1.unit50.lesson03.teach.ne_parle_pas:
    title: किसी से धीरे बोलने को कहना
    gloss: कृपया इतनी तेज़ मत बोलो।
    note: '*Ne parle pas si vite* में क्रिया का निषेध है: *ne ... pas*, *parle* को घेरता है, और *si* का अर्थ "इतना" है।'
  fr.a1.unit50.lesson03.teach.je_ne_t:
    title: कहना कि आवाज़ ठीक से नहीं आ रही
    gloss: मुझे तुम्हारी आवाज़ ठीक से नहीं आ रही।
    note: '*Entendre* (सुनाई देना) के साथ *ne ... pas bien* सुनने की परेशानी बताता है; यह *comprendre* (समझना) से अलग बात है।'
  fr.a1.unit50.lesson04.teach.le_sms:
    title: टेक्स्ट मैसेज
    gloss: टेक्स्ट मैसेज
    note: '*SMS* पुल्लिंग है: *un SMS*। यह संक्षिप्त नाम सीधे अंतरराष्ट्रीय प्रयोग से लिया गया है।'
    example_gloss: यह टेक्स्ट संदेश Camille का है।
  fr.a1.unit50.lesson04.teach.je_t_envoie:
    title: टेक्स्ट भेजने की बात कहना
    gloss: मैं तुम्हें मैसेज भेज दूँगा।
    note: '*Envoyer* (भेजना) में क्रिया से पहले सर्वनाम *te* (यहाँ *t''*) आता है, फिर *un SMS*।'
  fr.a1.unit50.lesson04.teach.je_te_rappelle:
    title: वापस कॉल करने की बात कहना
    gloss: मैं तुम्हें बाद में वापस कॉल करूँगा।
    note: '*Rappeler* (वापस फ़ोन करना) में *re-* पहले से ''वापस'' का भाव लिए हुए है; *plus tard* का अर्थ है ''बाद में''।'
  fr.a1.unit50.lesson05.teach.mathieu_salut_camille:
    title: टेक्स्ट बातचीत पढ़ें
    gloss: 'Mathieu: हाय Camille, क्या तुम मुझे फ़ोन कर सकती हो? मुझे तुम्हें कुछ बताना है। Camille: हाँ, बिल्कुल, मैं पाँच मिनट में तुम्हें वापस फ़ोन करती हूँ।'
    note: ध्यान दीजिए कि Mathieu क्या माँगता है, क्यों माँगता है, और Camille कब वापस फ़ोन करने को कहती है।
    glosses:
      Salut: हाय
      peux: सकते हो
      m'appeler: कॉल करना
      dois: करना होगा
      truc: कुछ
      dire: बताना
      évidemment: ज़रूर
      rappelle: वापस
      cinq: पाँच
      minutes: मिनट
  fr.a1.unit50.lesson06.teach.mathieu_allo_c:
    title: Mathieu फ़ोन उठाता है
    gloss: 'Mathieu: हैलो, मैं Mathieu बोल रहा हूँ।'
    note: 'पहले पाठ का *c''est* + नाम वाला ढाँचा अब असली फ़ोन कॉल में आया है: फ़ोन उठाने वाला पहले बोलता है और अपना नाम बताता है।'
  fr.a1.unit50.lesson06.teach.camille_salut_mathieu:
    title: Camille अपना परिचय देती है
    gloss: 'Camille: हाय Mathieu, मैं Camille बोल रही हूँ। Mathieu: अच्छा लगा कि तुमने फ़ोन किया!'
    note: '*C''est sympa que* ... (अच्छा लगा कि ...) किसी घटना पर सकारात्मक प्रतिक्रिया जताता है; *appelles* एक विशेष रूप है, जिसे यहाँ बस याद कर लीजिए।'
  fr.a1.unit50.lesson06.teach.camille_comment_s:
    title: Camille काम की पाली के बारे में पूछती है
    gloss: 'Camille: तुम्हारी पहली पाली कैसी रही?'
    note: '*Comment s''est passé ... ?* में *se passer* (घटित होना) का संयुक्त भूतकाल है, जो *être* से बनता है; इससे पूछा जाता है कि कोई बात कैसी रही।'
  fr.a1.unit50.lesson06.teach.mathieu_ca_s:
    title: Mathieu अच्छी ख़बर बताता है
    gloss: 'Mathieu: सब बहुत अच्छा रहा, मेरी सोच से भी बेहतर।'
    note: '*Ça s''est très bien passé* और *je pensais* यहाँ बँधे हुए वाक्यांश हैं; *je pensais* क्रिया *penser* (सोचना) का अपूर्ण भूतकाल है।'
  fr.a1.unit50.lesson06.teach.au_passe_compose:
    title: avoir और être के साथ संयुक्त भूतकाल
    gloss: s'est passé → घटित होना, j'ai pensé → सोचना, je suis allé → जाना
    note: 'संयुक्त भूतकाल *avoir* या *être* + कृदंत से बनता है: *j''ai pensé*, *je suis allé*। *Ça s''est passé* का अर्थ ''वह घटित हुआ/रहा'' है और यह एक बँधा हुआ वाक्यांश है; अभी इसे केवल इसी पाठ के संदर्भों में याद रखिए।'
  fr.a1.unit50.lesson06.teach.camille_ca_fait:
    title: Camille को गर्व है
    gloss: 'Camille: यह सुनकर बहुत अच्छा लगा! मुझे तुम पर गर्व है।'
    note: '*Fière de* (पर गर्व है) एक बँधा हुआ संयोजन है; यहाँ *de* ज़रूरी है, *pour* नहीं; *fière* यहाँ स्त्रीलिंग है।'
  fr.a1.unit50.lesson06.teach.mathieu_merci_beaucoup:
    title: Mathieu भावुक हो जाता है
    gloss: 'Mathieu: बहुत धन्यवाद, यह मेरे लिए बहुत मायने रखता है।'
    note: 'यहाँ *compter* का अर्थ ''मायने रखना'' है: *ça compte pour moi* (यह मेरे लिए मायने रखता है); *pour moi* बताता है कि किसके लिए।'
  fr.a1.unit50.lesson06.teach.son_premier_service:
    title: उसका
    gloss: उसकी पहली शिफ़्ट बहुत अच्छी रही।
    note: 'यहाँ *son* क्रिया नहीं, संबंधवाचक शब्द ''उसका'' है: *son premier service* (उसकी पहली पाली); *son* पुल्लिंग *service* के अनुसार है।'
