teaching:
  fr.a1.unit44.lesson01.teach.je_ne_me:
    title: तबीयत ठीक न होना
    gloss: मेरी तबीयत ठीक नहीं है।
    note: '*Se sentir* आत्मवाचक क्रिया है (*je me sens*); *ne ... pas bien* यह कहने का सामान्य, हल्का तरीका है कि कुछ ठीक नहीं है।'
  fr.a1.unit44.lesson01.teach.malade:
    title: बीमार
    gloss: बीमार
    note: 'मूल विशेषण, जो *être* के साथ आता है: *je suis malade*।'
    example_gloss: मैं बीमार हूँ।
  fr.a1.unit44.lesson01.teach.je_suis_malade:
    title: बीमार होना
    gloss: मैं बीमार हूँ।
    note: '*Malade* एक व्यापक और *pas bien* से ज़्यादा गंभीर स्थिति बताता है।'
  fr.a1.unit44.lesson01.teach.mal_a_la:
    title: सिरदर्द
    gloss: सिरदर्द
    note: '*Mal à la tête* *avoir* के साथ आता है: *j''ai mal à la tête*; *à la* इसलिए कि *tête* स्त्रीलिंग है।'
    example_gloss: मेरे सिर में दर्द है।
  fr.a1.unit44.lesson01.teach.j_ai_mal:
    title: सिरदर्द होना
    gloss: मेरे सिर में दर्द है।
    note: 'लक्षण *avoir* (होना) के साथ आते हैं: *j''ai mal*।'
  fr.a1.unit44.lesson01.teach.mal_au_ventre:
    title: पेट दर्द
    gloss: पेट दर्द
    note: '*Mal au ventre*: *au* यानी *à* + *le* मिलकर, क्योंकि *ventre* पुल्लिंग है।'
    example_gloss: मेरे पेट में दर्द है।
  fr.a1.unit44.lesson01.teach.j_ai_mal_2:
    title: पेट दर्द होना
    gloss: मेरे पेट में दर्द है।
    note: '*mal à la tête* जैसा ही *avoir* वाला ढाँचा, बस *à la* की जगह *au*।'
  fr.a1.unit44.lesson02.teach.qu_est_ce:
    title: सामान्य रूप से पूछना
    gloss: क्या हुआ?
    note: यह पूछने का एक सामान्य, हर जगह चलने वाला तरीका है कि कोई परेशानी तो नहीं है।
  fr.a1.unit44.lesson02.teach.qu_est_ce_2:
    title: एक प्रचलित मुहावरा
    gloss: तुम्हें क्या हुआ?
    note: '*Qu''est-ce qui ne va pas ?* एक स्थिर प्रश्न है, शाब्दिक अर्थ ''क्या ठीक नहीं चल रहा''; इसका शब्द-दर-शब्द अनुवाद न कीजिए।'
  fr.a1.unit44.lesson02.teach.mal_a_la:
    title: गले में दर्द
    gloss: गले में दर्द
    note: '*Mal à la gorge*, *mal à la tête* जैसा ही है: *gorge* स्त्रीलिंग है, इसलिए *à la*।'
    example_gloss: मेरे गले में दर्द है।
  fr.a1.unit44.lesson02.teach.j_ai_mal:
    title: गले में दर्द होना
    gloss: मेरे गले में दर्द है।
    note: दूसरे लक्षणों जैसा ही *avoir* वाला ढाँचा।
  fr.a1.unit44.lesson02.teach.ca_va_non:
    title: किसी का हालचाल पूछना
    gloss: क्या तुम ठीक हो? नहीं, मेरी तबीयत ठीक नहीं है।
    note: '*Ça va ?* दोस्तों के बीच हालचाल पूछने का बहुत आम, अनौपचारिक प्रश्न है।'
  fr.a1.unit44.lesson03.teach.la_fievre:
    title: बुखार
    gloss: बुखार
    note: '*La fièvre* स्त्रीलिंग है; *avoir* के बाद *de la* आता है: *j''ai de la fièvre*।'
    example_gloss: मुझे बुखार है।
  fr.a1.unit44.lesson03.teach.j_ai_de:
    title: बुखार होना
    gloss: मुझे बुखार है।
    note: '*avoir* वाला ढाँचा, अंशबोधक *de la* के साथ।'
  fr.a1.unit44.lesson03.teach.le_rhume:
    title: जुकाम होना
    gloss: जुकाम होना / जुकाम से पीड़ित
    note: '*Le rhume* पुल्लिंग संज्ञा है जो *avoir* के साथ आती है; यह *être* के साथ आने वाला विशेषण नहीं है।'
    example_gloss: मुझे जुकाम है।
  fr.a1.unit44.lesson03.teach.j_ai_un:
    title: जुकाम होने की बात कहना
    gloss: मुझे जुकाम है।
    note: फ़्रेंच में *j'ai un rhume* ('मुझे ज़ुकाम है') कहते हैं; *je suis rhume* नहीं कहा जाता।
  fr.a1.unit44.lesson03.teach.malade_se_dit:
    title: Être या avoir ?
    gloss: '*Malade* विशेषण है और *être* के साथ आता है: मैं बीमार हूँ। *Mal*, *fièvre* और *rhume* संज्ञाएँ हैं और *avoir* के साथ आती हैं: मुझे ज़ुकाम है।'
    note: '*être* और *avoir* का चुनाव शब्द के प्रकार से तय होता है: *malade* जैसा विशेषण *être* के साथ जाता है, *fièvre* जैसी संज्ञा *avoir* के साथ, बीमारी चाहे कितनी भी छोटी हो।'
  fr.a1.unit44.lesson04.teach.la_pharmacie:
    title: दवाखाना
    gloss: दवाखाना
    note: '*Pharmacie* स्त्रीलिंग है: *la pharmacie*।'
    example_gloss: मैं दवाखाने जा रहा हूँ।
  fr.a1.unit44.lesson04.teach.je_peux_vous:
    title: दवाखाने में स्वागत का सवाल
    gloss: मैं आपकी क्या मदद कर सकता हूँ?
    note: '*Je peux vous aider ?* सेवा देते समय कहा जाने वाला मानक औपचारिक अभिवादन है; *vous* आदरसूचक रूप है।'
  fr.a1.unit44.lesson04.teach.avez_vous_quelque:
    title: किसी लक्षण की दवा माँगना
    gloss: क्या आपके पास सिरदर्द की कोई दवा है?
    note: '*Quelque chose contre* + लक्षण, उपाय माँगने का स्वाभाविक तरीका है।'
  fr.a1.unit44.lesson04.teach.un_comprime:
    title: एक गोली
    gloss: एक गोली
    note: '*Comprimé* पुल्लिंग है: *un comprimé*।'
    example_gloss: मैं एक गोली लेता हूँ।
  fr.a1.unit44.lesson04.teach.prenez_un_comprime:
    title: दवा लेने के निर्देश
    gloss: दिन में दो बार एक गोली लो।
    note: '*Prenez*, *prendre* (लेना) का *vous* वाला आज्ञार्थक रूप है, जो निर्देश देने में आता है।'
  fr.a1.unit44.lesson04.teach.a_la_pharmacie:
    title: फ़ार्मेसी में बोलने का तरीक़ा
    gloss: दवाखाने में आदरसूचक रूप *vous* का प्रयोग करते हैं।
    note: फ़ार्मासिस्ट सेवा-भूमिका में एक अपरिचित वयस्क है, इसलिए आप *vous* कहते हैं, जैसे टिकट काउंटर पर।
  fr.a1.unit44.lesson05.teach.conseil_prends_un:
    title: दवा की सलाह का पर्चा पढ़िए
    gloss: 'सलाह: दिन में दो बार पानी के साथ एक गोली लें। अच्छी तरह आराम करें और खूब पानी पिएँ। क्या तीन दिन बाद भी आप ठीक महसूस नहीं कर रहे? तो डॉक्टर के पास जाएँ।'
    note: खुराक, दवा के अलावा दो सुझाव और डॉक्टर के पास कब जाना है, इन पर ध्यान दीजिए।
    glosses:
      Conseil: सलाह
      prends: लो / लीजिए
      fois: बार
      jour: दिन
      comprimé: गोली
      Repose-toi: आराम करो
      bois: पियो
      sens: महसूस करना
      toujours: अब भी
      bien: अच्छा / अच्छी तरह
      médecin: डॉक्टर
  fr.a1.unit44.lesson06.teach.camille_salut_mathieu:
    title: कैमिल हाल पूछती है
    gloss: 'कैमिल: हाय माथ्यू, कैसे हो? अब कुछ बेहतर महसूस कर रहे हो?'
    note: '*Déjà* (पहले ही) दिखाता है कि कैमिल पूछ रही है कि पिछली बातचीत के बाद माथ्यू बेहतर हुआ या नहीं।'
  fr.a1.unit44.lesson06.teach.mathieu_pas_encore:
    title: माथ्यू अब भी बीमार है
    gloss: 'माथ्यू: अभी बहुत ठीक नहीं हूँ। सिर में अब भी दर्द है और थकान है।'
    note: '*Toujours* (अब भी) बताता है कि सिरदर्द गया नहीं है; *fatigué* (थका हुआ) नया, उपयोगी विशेषण है।'
  fr.a1.unit44.lesson06.teach.camille_tu_as:
    title: कैमिल दवा के बारे में पूछती है
    gloss: 'कैमिल: तुमने गोली ली?'
    note: '*Pris*, *prendre* का भूतकालिक कृदंत है, जो *avoir* के रूप *as* के साथ आता है: *tu as pris*।'
  fr.a1.unit44.lesson06.teach.mathieu_oui_j:
    title: माथ्यू हामी भरता है
    gloss: 'माथ्यू: हाँ, मैंने गोली ली। अब मैं आराम करने जा रहा हूँ।'
    note: '*Je vais me reposer* (आराम करने जा रहा हूँ) निकट भविष्य के लिए *aller* + क्रिया का मूल रूप प्रयोग करता है।'
  fr.a1.unit44.lesson06.teach.camille_bonne_idee:
    title: कैमिल शुभकामना देती है
    gloss: 'कैमिल: अच्छा विचार है। अच्छे से आराम करो। जल्दी ठीक हो जाओ!'
    note: '*Bon rétablissement !* किसी के जल्दी स्वस्थ होने की कामना करने का मानक स्थिर वाक्यांश है।'
  fr.a1.unit44.lesson06.teach.mathieu_merci_a:
    title: माथ्यू विदा लेता है
    gloss: 'माथ्यू: शुक्रिया, कल मिलते हैं!'
    note: '*À demain !* विदा के लिए *à* + समय का प्रयोग करता है: *à demain*, *à bientôt*।'
