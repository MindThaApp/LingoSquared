teaching:
  fr.a1.unit01.lesson01.teach.bonjour:
    title: सामान्य अभिवादन
    gloss: नमस्ते; शुभ दिन
    note: Bonjour अजनबियों, सहकर्मियों और दोस्तों, सभी के साथ दिन में सुरक्षित रूप से बोला जा सकता है। इसमें "शुभ दिन" का भाव भी शामिल है।
  fr.a1.unit01.lesson01.teach.salut:
    title: अनौपचारिक अभिवादन
    gloss: हाय; बाय
    note: Salut अनौपचारिक संबंध के लिए है। इससे बातचीत शुरू भी हो सकती है और खत्म भी, पर किसी अपरिचित वयस्क के साथ यह सबसे सुरक्षित चुनाव नहीं है।
  fr.a1.unit01.lesson01.teach.au_revoir:
    title: सामान्य विदाई
    gloss: अलविदा
    note: Au revoir औपचारिक और अनौपचारिक, दोनों स्थितियों में चलता है।
  fr.a1.unit01.lesson01.teach.tu:
    title: अनौपचारिक एकवचन "तुम"
    gloss: तुम (अनौपचारिक, एकवचन)
    note: हिंदी में "तुम" और "आप" का भेद है, फ़्रेंच में भी tu और vous का ऐसा ही भेद है। tu एक दोस्त, बच्चे या स्पष्ट रूप से अनौपचारिक संबंध वाले व्यक्ति के लिए है, और इसके क्रिया-रूप भी अलग होते हैं।
  fr.a1.unit01.lesson01.teach.vous:
    title: सम्मानसूचक या बहुवचन "आप"
    gloss: आप (सम्मानसूचक एकवचन या बहुवचन)
    note: Vous एक अपरिचित वयस्क के लिए सुरक्षित चुनाव है, और किसी भी समूह के लिए भी यही रूप है। हिंदी के "आप" की तरह यह सम्मान दिखाता है, पर फ़्रेंच में बहुवचन के लिए भी इसी का प्रयोग होता है।
  fr.a1.unit01.lesson01.teach.comment_allez_vous:
    title: औपचारिक हालचाल पूछना
    gloss: आप कैसे हैं?
    note: Allez, aller का vous-रूप है। क्रिया और सर्वनाम का क्रम उलटा है और दोनों हाइफ़न से जुड़े हैं। यह एक रूढ़ शिष्ट प्रश्न है, कोई यह नहीं पूछ रहा कि आप कहाँ जा रहे हैं।
  fr.a1.unit01.lesson01.teach.comment_vas_tu:
    title: अनौपचारिक हालचाल पूछना
    gloss: आप कैसे हैं?
    note: Vas, aller का tu-रूप है। संबंध अनौपचारिक होने पर allez-vous बदलकर vas-tu हो जाता है, जैसे हिंदी में "आप कैसे हैं" से "तुम कैसे हो" हो जाता है।
  fr.a1.unit01.lesson01.teach.register_choice:
    title: अभिवादन और संबंध का मेल
    gloss: vous के साथ Bonjour; tu के साथ salut
    note: ये जोड़ियाँ काम की सामान्य पसंद हैं, कठोर नियम नहीं। Bonjour दोस्तों के साथ भी चल सकता है, पर salut के साथ vous आमतौर पर परस्पर-विरोधी सामाजिक संकेत देता है।
  fr.a1.unit01.lesson02.teach.je_mappelle:
    title: अपना नाम बताना
    gloss: मेरा नाम Camille है।
    note: Je m’appelle का शाब्दिक अर्थ "मैं अपने को ... कहता/कहती हूँ" है। फ़्रेंच में कर्ता je सामान्यतः ज़रूरी है, हिंदी की तरह छोड़ा नहीं जा सकता। me का स्वर appelle से पहले लुप्त हो जाता है, इसलिए m’appelle बनता है।
  fr.a1.unit01.lesson02.teach.comment_appelez_vous:
    title: शिष्टता से नाम पूछना
    gloss: आपका नाम क्या है?
    note: 'Appelez, appeler का vous-रूप है। प्रश्न में क्रम उलटा होता है, इसलिए दूसरा vous क्रिया के बाद आता है: vous appelez-vous।'
  fr.a1.unit01.lesson02.teach.tu_tappelles:
    title: अनौपचारिक रूप से नाम पूछना
    gloss: आपका नाम क्या है?
    note: T’appelles, tu-रूप है, जिसमें सर्वनाम te स्वर से पहले छोटा होकर t’ बन गया है। इस रोज़मर्रा के प्रश्न में tu क्रिया से पहले रहता है और comment अंत में आता है।
  fr.a1.unit01.lesson02.teach.moi_cest:
    title: बोलचाल में अपना परिचय
    gloss: मैं Noé हूँ।
    note: Moi, c’est बोलचाल की स्वाभाविक आत्म-परिचय शैली है। यह "मैं ... हूँ" का शब्दशः रूप बनाने से ज़्यादा सहज लगती है।
  fr.a1.unit01.lesson02.teach.enchante:
    title: पुल्लिंग सामंजस्य
    gloss: आपसे मिलकर खुशी हुई।
    note: पुरुष वक्ता सामान्यतः enchanté लिखता है। हिंदी के "थका/थकी" की तरह यह फ़्रेंच विशेषण भी वक्ता के लिंग के अनुसार बदलता है।
  fr.a1.unit01.lesson02.teach.enchantee:
    title: स्त्रीलिंग सामंजस्य
    gloss: आपसे मिलकर खुशी हुई।
    note: महिला वक्ता सामान्यतः अंत में e जोड़कर enchantée लिखती है। Enchanté और enchantée का उच्चारण प्रायः एक जैसा होता है, इसलिए यह भेद बोलने से ज़्यादा लिखने में दिखता है।
  fr.a1.unit01.lesson02.teach.et_vous:
    title: शिष्टता से प्रश्न लौटाना
    gloss: और आप?
    note: शिष्ट शैली बनाए रखने या किसी समूह से बात करने के लिए vous का प्रयोग करें।
  fr.a1.unit01.lesson02.teach.et_toi:
    title: अनौपचारिक रूप से प्रश्न लौटाना
    gloss: और आप?
    note: Toi, tu से जुड़ा बलाघात-रूप है। et के बाद फ़्रेंच में toi आता है, tu नहीं।
  fr.a1.unit01.lesson03.teach.elision_jhabite:
    title: स्वर से पहले स्वर-लोप
    gloss: मैं रहता/रहती हूँ
    note: 'Je का स्वर habite से पहले लुप्त हो जाता है, और अपोस्ट्रोफ़ इस लोप को दिखाता है: j’habite। habiter का h इस लोप को नहीं रोकता।'
  fr.a1.unit01.lesson03.teach.liaison_vous_etes:
    title: vous के बाद ध्वनि-जोड़
    gloss: आप हैं
    note: 'vous का अंतिम s सामान्यतः मौन रहता है, पर êtes की स्वर-ध्वनि से पहले वह z की ध्वनि बनकर जुड़ जाता है: vous êtes लगभग "वू-ज़ेत" जैसा सुनाई देता है। यह जोड़ बोले गए वाक्यांश का हिस्सा है, वर्तनी का नहीं।'
  fr.a1.unit01.lesson03.teach.liaison_un_atelier:
    title: un के बाद ध्वनि-जोड़
    gloss: एक वर्कशॉप
    note: un का अंतिम n, atelier में जुड़ जाता है। दोनों शब्दों के बीच रुकावट या ठहराव न डालें।
  fr.a1.unit01.lesson03.teach.final_e_enchante:
    title: पुल्लिंग वर्तनी
    gloss: आपसे मिलकर खुशी हुई (पुरुष वक्ता)
    note: पुरुष वक्ता के लिए enchanté अंत में é से समाप्त होता है। -an- नासिक्य स्वर है, इसलिए उसके बाद अलग से स्पष्ट n की ध्वनि न बोलें।
  fr.a1.unit01.lesson03.teach.final_e_enchantee:
    title: स्त्रीलिंग वर्तनी
    gloss: आपसे मिलकर खुशी हुई (महिला वक्ता)
    note: Enchantée स्त्रीलिंग सामंजस्य के लिए e जोड़ता है, पर यह अतिरिक्त e सामान्यतः कोई नया उच्चारित अक्षर नहीं बनाता।
  fr.a1.unit01.lesson03.teach.question_liaison:
    title: उलटे क्रम वाला प्रश्न पढ़ना
    gloss: आप कैसे हैं?
    note: allez-vous को एक ही प्रश्न-इकाई की तरह जोड़कर पढ़ें। allez में लिखा z यहाँ अलग z ध्वनि नहीं देता; मानक उच्चारण लगभग "अले वू" है।
  fr.a1.unit01.lesson04.teach.ca_va:
    title: रोज़मर्रा का हाल पूछना
    gloss: कैसे हैं?; सब ठीक है?
    note: Ça में सेदिया (नीचे की मात्रा) है, जिससे a से पहले c की ध्वनि s जैसी हो जाती है। स्वर के उतार-चढ़ाव से यही अभिव्यक्ति प्रश्न भी हो सकती है और उत्तर भी।
  fr.a1.unit01.lesson04.teach.tres_bien:
    title: बहुत अच्छा उत्तर
    gloss: बहुत अच्छा हूँ, धन्यवाद।
    note: Très, bien को और ज़ोरदार बनाता है। इसका अंतिम s मौन रहता है।
  fr.a1.unit01.lesson04.teach.ca_va_bien:
    title: सकारात्मक उत्तर
    gloss: मैं ठीक हूँ।
    note: इस निश्चित उत्तर में "मैं" के लिए फ़्रेंच में कोई शब्द नहीं लगता, जैसे हिंदी में "ठीक चल रहा है" कहा जाता है।
  fr.a1.unit01.lesson04.teach.pas_mal:
    title: मध्यम सकारात्मक उत्तर
    gloss: बुरा नहीं।
    note: Pas mal अक्सर हल्का सकारात्मक उत्तर होता है, जैसे हिंदी का "बुरा नहीं"।
  fr.a1.unit01.lesson04.teach.fatigue:
    title: पुल्लिंग विशेषण सामंजस्य
    gloss: मैं थोड़ा थका हुआ हूँ।
    note: Suis, être का je-रूप है। पुरुष वक्ता fatigué लिखता है। हिंदी के "थका/थकी" की तरह यह वक्ता के लिंग के अनुसार बदलता है।
  fr.a1.unit01.lesson04.teach.fatiguee:
    title: स्त्रीलिंग विशेषण सामंजस्य
    gloss: मैं थोड़ी थकी हुई हूँ।
    note: महिला वक्ता अंत में e के साथ fatiguée लिखती है। पुल्लिंग और स्त्रीलिंग रूपों का उच्चारण सामान्यतः एक जैसा होता है।
  fr.a1.unit01.lesson04.teach.et_vous:
    title: शिष्टता से प्रश्न लौटाना
    gloss: और आप?
    note: Vous उस सम्मानपूर्ण शैली को बनाए रखता है जो किसी अपरिचित वयस्क के साथ अपनाई जाती है।
  fr.a1.unit01.lesson04.teach.et_toi:
    title: अनौपचारिक रूप से प्रश्न लौटाना
    gloss: और आप?
    note: एक दोस्त या हमउम्र से अनौपचारिक रूप से बात करते समय et के बाद toi का प्रयोग करें।
  fr.a1.unit01.lesson05.teach.here_for_workshop:
    title: किसी के आने का कारण पक्का करना
    gloss: क्या आप वर्कशॉप के लिए यहाँ हैं?
    note: Êtes, être का vous-रूप है। फ़्रेंच में प्रश्न बनाने के लिए हिंदी के "क्या" जैसा कोई अलग शब्द ज़रूरी नहीं; स्वर का चढ़ाव इसे प्रश्न बना देता है।
  fr.a1.unit01.lesson05.teach.yes_thats_it:
    title: अनुमान की पुष्टि करना
    gloss: हाँ, सही है।
    note: C’est ça पुष्टि का स्वाभाविक तरीक़ा है, इसे शब्दशः "यह वही है" न समझें।
  fr.a1.unit01.lesson05.teach.live_neighborhood:
    title: पूछना कि कोई कहाँ रहता है
    gloss: क्या आप इसी मोहल्ले में रहते हैं?
    note: Habitez, habiter का vous-रूप है। फ़्रेंच में यह प्रश्न कथन के क्रम में ही, प्रश्न-सूचक स्वर के साथ पूछा जा सकता है।
  fr.a1.unit01.lesson05.teach.i_live:
    title: बताना कि आप कहाँ रहते हैं
    gloss: मैं Montreuil में रहता/रहती हूँ।
    note: J’habite, habiter का je-रूप है, जिसमें स्वर-लोप हुआ है। À शहर की जगह बताता है; इसे a से न मिलाएँ, जो क्रिया का रूप है और जिसका अर्थ "है/के पास है" होता है।
  fr.a1.unit01.lesson05.teach.from_here:
    title: स्थानीय मूल के बारे में पूछना
    gloss: क्या आप यहीं के हैं?
    note: D’ici में स्वर-लोप से de और ici जुड़े हैं। Êtes अब भी être का vous-रूप है।
  fr.a1.unit01.lesson05.teach.from_lille:
    title: अपना मूल स्थान बताना
    gloss: मैं Lille का/की हूँ।
    note: Suis, être का je-रूप है। मूल स्थान बताते समय शहर से पहले de आता है।
  fr.a1.unit01.lesson05.teach.workshop_starts:
    title: गतिविधि शुरू होती है
    gloss: वर्कशॉप शुरू हो रही है।
    note: Atelier पुल्लिंग है, इसलिए इसका एकवचन उपपद le है। स्वर से पहले le बदलकर l’ हो जाता है। Commence अन्य पुरुष एकवचन का रूप है।
  fr.a1.unit01.lesson05.teach.see_you_shortly:
    title: थोड़ी देर बाद की विदाई
    gloss: थोड़ी देर में मिलते हैं; आज ही बाद में मिलते हैं
    note: À tout à l’heure का अर्थ है कि उसी दिन बाद में फिर मुलाक़ात होगी, जबकि सामान्य विदाई में मिलने का कोई समय अपेक्षित नहीं होता।
  fr.a1.unit01.lesson06.teach.line01:
    title: मुलाक़ात की शुरुआत
    gloss: Inès, Mathieu का अभिवादन करती है और पूछती है कि क्या वह कुकिंग वर्कशॉप के लिए आया है।
    note: दोनों वक्ता vous से शुरू करते हैं क्योंकि वे एक-दूसरे के लिए अपरिचित वयस्क हैं।
  fr.a1.unit01.lesson06.teach.line02:
    title: मुलाक़ात की शुरुआत, उत्तर
    gloss: Mathieu पुष्टि करता है और अपना नाम बताता है, फिर उसका नाम पूछता है।
    note: Je m’appelle अपना नाम बताने का मानक तरीक़ा है।
  fr.a1.unit01.lesson06.teach.line03:
    title: नामों का आदान-प्रदान
    gloss: Inès अपना नाम बताती है और कहती है कि उससे मिलकर खुशी हुई।
    note: Enchantée, Inès (स्त्रीलिंग) के अनुसार है; अंत का -e लिखा जाता है, पर सामान्यतः सुनाई नहीं देता।
  fr.a1.unit01.lesson06.teach.line04:
    title: नामों का आदान-प्रदान, उत्तर
    gloss: Mathieu वही भाव लौटाता है और पूछता है कि क्या वह पास में रहती है।
    note: Enchanté, Mathieu (पुल्लिंग) के अनुसार है; यह वही शब्द है जो Inès ने कहा, बस मौन -e के बिना।
  fr.a1.unit01.lesson06.teach.line05:
    title: मोहल्ले की जानकारी का आदान-प्रदान
    gloss: Inès पुष्टि करती है और अपनी गली बताती है, फिर Mathieu से वही सवाल पूछती है।
    note: J’habite के साथ गली का नाम आए तो rue से पहले कोई पूर्वसर्ग नहीं लगता।
  fr.a1.unit01.lesson06.teach.line06:
    title: मोहल्ले की जानकारी का आदान-प्रदान, उत्तर
    gloss: Mathieu बताता है कि वह Saint-Ouen में रहता है और पूछता है कि क्या वह मूल रूप से यहीं की है।
    note: J’habite à में जगह के नाम से पहले à आता है, जबकि Inès ने गली के नाम के साथ ऐसा नहीं किया था।
  fr.a1.unit01.lesson06.teach.line07:
    title: मूल स्थान का आदान-प्रदान
    gloss: Inès कहती है कि वह यहाँ की नहीं है, वह Lille की है, फिर Mathieu से पूछती है।
    note: Je suis de + शहर का नाम बताता है कि कोई कहाँ का रहने वाला है।
  fr.a1.unit01.lesson06.teach.line08:
    title: मूल स्थान की बातचीत, जवाब
    gloss: मैथ्यू कहता है कि वह लियों का है।
    note: वही je suis de वाला ढाँचा, जो अभी Inès ने इस्तेमाल किया।
  fr.a1.unit01.lesson06.teach.line09:
    title: बातचीत को विराम देना
    gloss: इनेस देखती है कि कार्यशाला शुरू हो रही है और कहती है कि थोड़ी देर में मिलते हैं।
    note: À tout à l’heure इसलिए ठीक बैठता है क्योंकि दोनों लोग इसी आयोजन में रहेंगे।
  fr.a1.unit01.lesson06.teach.line10:
    title: बातचीत को विराम देना, जवाब
    gloss: मैथ्यू वही विदाई दोहराता है।
    note: À tout à l’heure को वापस दोहराना उसकी पुष्टि करने का स्वाभाविक तरीका है।
