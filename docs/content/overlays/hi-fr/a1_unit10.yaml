course:
  title: फ़्रेंच A1
  description: आत्मवाचक क्रियाओं (se réveiller, se lever, se coucher) और क्रम बताने वाले शब्दों (d'abord, ensuite) की मदद से सरल दिनचर्या बताना। इनेस और माथ्यू की कुकिंग-वर्कशॉप की कहानी आगे बढ़ती है, जब इनेस पूछती है कि माथ्यू का शनिवार कैसे बीतता है। फ़्रेंच की आत्मवाचक क्रियाओं के साथ एक आत्मवाचक सर्वनाम ज़रूर आता है (je ME réveille); हिंदी में इसका कोई सीधा एक-शब्द वाला समकक्ष नहीं है।
