teaching:
  fr.a1.unit10.lesson01.teach.se_reveiller:
    title: जागना
    gloss: जागना
    note: 'आत्मवाचक क्रिया: *je me réveille*, *tu te réveilles*। सर्वनाम *me/te/se* हमेशा कर्ता के अनुसार बदलता है।'
    example_gloss: मैं सात बजे जागता/जागती हूँ।
  fr.a1.unit10.lesson01.teach.se_lever:
    title: उठना
    gloss: उठना
    note: यह *se réveiller* (नींद से जागना) से अलग है -- *se lever* का मतलब बिस्तर से शारीरिक रूप से उठना है।
    example_gloss: मैं उसके तुरंत बाद उठ जाता/जाती हूँ।
  fr.a1.unit10.lesson01.teach.prendre_une_douche:
    title: नहाना
    gloss: नहाना
    note: '*Prendre une douche* (शाब्दिक अर्थ: "शावर लेना") में वही क्रिया *prendre* आती है जो भोजन और यातायात के साधनों के लिए इस्तेमाल होती है।'
    example_gloss: मैं सुबह नहाता/नहाती हूँ।
  fr.a1.unit10.lesson01.teach.shabiller:
    title: कपड़े पहनना
    gloss: कपड़े पहनना
    note: 'एक और आत्मवाचक क्रिया: *je m''habille*, जिसमें स्वर से पहले *m''* का लोप-संयोग हो जाता है।'
    example_gloss: मैं नाश्ते से पहले कपड़े पहनता/पहनती हूँ।
  fr.a1.unit10.lesson01.teach.le_petit_dejeuner:
    title: नाश्ता
    gloss: नाश्ता
    note: '*Prendre le petit-déjeuner* (नाश्ता करना) में वही *prendre* वाला ढाँचा है जो *prendre une douche* में है।'
    example_gloss: मैं आठ बजे नाश्ता करता/करती हूँ।
  fr.a1.unit10.lesson01.teach.quitter_la_maison:
    title: घर से निकलना
    gloss: घर से निकलना
    note: यहाँ *quitter* का अर्थ "(किसी जगह को) छोड़ना" है -- इसे *partir* से न मिलाएँ, जिसके साथ सीधा कर्म नहीं आता।
    example_gloss: मैं नौ बजे घर से निकलता/निकलती हूँ।
  fr.a1.unit10.lesson01.teach.dabord_ensuite:
    title: पहले... फिर...
    gloss: पहले मैं उठता/उठती हूँ, फिर कपड़े पहनता/पहनती हूँ।
    note: '*D''abord* (पहले) और *ensuite* (फिर) दिनचर्या को क्रम से बताने के बुनियादी शब्द हैं।'
  fr.a1.unit10.lesson02.teach.rentrer:
    title: घर लौटना
    gloss: घर लौटना
    note: '*Rentrer* का मतलब अपने घर वापस आना है; यह *retourner* (किसी जगह वापस जाना) से अलग है, जो ज़्यादा सामान्य है।'
    example_gloss: मैं काम के बाद घर लौटता/लौटती हूँ।
  fr.a1.unit10.lesson02.teach.diner:
    title: रात का खाना खाना
    gloss: रात का खाना खाना
    note: '*Dîner* क्रिया (रात का खाना खाना) भी हो सकता है और संज्ञा (*le dîner*, रात का खाना) भी -- संदर्भ से पता चलता है कि कौन-सा है।'
    example_gloss: हम शनिवार की शाम साथ में खाना खाते हैं।
  fr.a1.unit10.lesson02.teach.se_coucher:
    title: सोने जाना
    gloss: सोने जाना
    note: दिनचर्या के क्रम का स्वाभाविक अंत, जो शुरुआत के *se lever* के साथ जोड़ी बनाता है।
    example_gloss: मैं लगभग रात के ग्यारह बजे सोने जाता/जाती हूँ।
  fr.a1.unit10.lesson02.teach.le_weekend:
    title: सप्ताहांत
    gloss: सप्ताहांत
    note: '*Le week-end* पुल्लिंग शब्द है और इसे हाइफ़न के साथ लिखा जाता है।'
    example_gloss: वर्कशॉप सप्ताहांत में होती है।
  fr.a1.unit10.lesson02.teach.dhabitude:
    title: आमतौर पर
    gloss: आमतौर पर
    note: '*D''habitude* रोज़ की आदत या दिनचर्या बताने के लिए आता है; यह *aujourd''hui* (आज) से अलग है, जो एक बार की घटना के लिए है।'
    example_gloss: मैं आमतौर पर सात बजे उठता/उठती हूँ।
  fr.a1.unit10.lesson02.teach.ma_routine_du_samedi:
    title: शनिवार का वर्णन करें
    gloss: शनिवार को मैं देर से उठता/उठती हूँ, फिर वर्कशॉप से पहले बाज़ार जाता/जाती हूँ।
    note: यह *d'abord/ensuite* जैसे क्रम-सूचक शब्दों का ही रूप है (यहाँ *puis*, यानी "फिर"), जिससे शनिवार का वर्णन किया गया है।
  fr.a1.unit10.lesson02.teach.quest_ce_que_tu_fais:
    title: आप क्या करते हैं?
    gloss: तुम शनिवार को क्या करते हो?
    note: '*Qu''est-ce que tu fais... ?* किसी से यह पूछने का आम अनौपचारिक तरीका है कि वह क्या करता है।'
  fr.a1.unit10.lesson03.teach.line01:
    title: शनिवार के बारे में पूछना
    gloss: इनेस माथ्यू से पूछती है कि वह वर्कशॉप से पहले शनिवार को क्या करता है।
    note: '*Tu fais quoi... ?* "तुम क्या करते हो... ?" पूछने का स्वाभाविक अनौपचारिक तरीका है, जो *Qu''est-ce que tu fais ?* से भी ज़्यादा बोलचाल का है।'
  fr.a1.unit10.lesson03.teach.line02:
    title: जागने का वर्णन करें
    gloss: माथ्यू कहता है कि पहले वह देर से, लगभग नौ बजे जागता है।
    note: '*Vers neuf heures* (लगभग नौ बजे) में अनुमानित समय बताने के लिए *vers* + समय वाला ढाँचा फिर आया है।'
  fr.a1.unit10.lesson03.teach.line03:
    title: पूछें कि आगे क्या होता है
    gloss: इनेस पूछती है कि उसके बाद क्या होता है।
    note: दिनचर्या का वर्णन जारी रखने के लिए एक छोटा, स्वाभाविक अनुवर्ती प्रश्न।
  fr.a1.unit10.lesson03.teach.line04:
    title: नाश्ते और बाज़ार का वर्णन करें
    gloss: माथ्यू कहता है कि फिर वह नाश्ता करता है और बाज़ार जाता है।
    note: '*et* से जुड़ी दो क्रियाएँ, जो *d''abord* से शुरू हुए क्रम को आगे बढ़ाती हैं।'
  fr.a1.unit10.lesson03.teach.line05:
    title: घर लौटने के बारे में पूछना
    gloss: इनेस पूछती है कि माथ्यू कितने बजे घर लौटता है।
    note: '*Tu rentres à quelle heure ?* में इस पाठ की क्रिया *rentrer* सीधे प्रश्न में फिर आई है।'
  fr.a1.unit10.lesson03.teach.line06:
    title: दोपहर के बाद का वर्णन करें
    gloss: माथ्यू कहता है कि वह लगभग दोपहर बारह बजे लौटता है, और दोपहर में शाम की वर्कशॉप से पहले आराम करता है।
    note: '*Se reposer* (आराम करना) एक और आत्मवाचक क्रिया है: *je me repose*।'
