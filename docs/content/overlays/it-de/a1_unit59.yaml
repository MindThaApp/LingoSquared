    gloss: Jonas controlla le previsioni del tempo ogni mattina.
  de.a1.unit59.lesson05.teach.lena_schickt_anna:
    title: Lena scrive spesso ad Anna
    gloss: Lena manda spesso un messaggio ad Anna.
  de.a1.unit59.lesson06.teach.anna_ich_sehe:
    title: Anna conferma il programma
    gloss: 'Anna: Vedo il messaggio. Facciamo sport sabato alle dieci al parco?'
  de.a1.unit59.lesson06.teach.felix_ja_und:
    title: Felix conferma il tempo
    gloss: 'Felix: Sì, e sabato c''è il sole!'
  de.a1.unit59.lesson06.teach.jonas_dann_jogge:
    title: Il programma di Jonas
    gloss: 'Jonas: Allora io corro. Dopo gioco anche a calcio.'
    note: '*Danach* (dopo) sta al primo posto, quindi il verbo lo segue: danach spiele ich.'
  de.a1.unit59.lesson06.teach.lena_ich_schwimme:
    title: Il programma di Lena
    gloss: 'Lena: Preferisco nuotare, ma vengo anch''io al parco.'
    note: '*Lieber* (piuttosto, preferibilmente) viene subito dopo il verbo: ich schwimme lieber.'
  de.a1.unit59.lesson06.teach.anna_schoen_bis:
    title: Anna chiude la conversazione
    gloss: 'Anna: Bene! A sabato al parco!'
    note: Chiude in una sola battuta la conversazione di questa unità e il programma dell'unità sullo sport.
