  de.a1.unit59.lesson02.teach.du_kennst_schon:
    title: Wetterbericht e Nachricht
    gloss: Conosci già der Wetterbericht (Wetter + Bericht). Die Nachricht è un messaggio che puoi mandare (ich schicke, du schickst) o leggere (ich lese, du liest).
    note: Collega la parola nuova al sostantivo composto già visto nell'unità sul tempo atmosferico.
  de.a1.unit59.lesson02.teach.anna_schickt_eine:
    title: Anna manda un messaggio tramite l'app
    gloss: Anna manda un messaggio tramite l'app.
    note: '*Schicken* (mandare, inviare): ich schicke, sie schickt. Il messaggio è il complemento oggetto, quindi richiede l''accusativo: eine Nachricht.'
  de.a1.unit59.lesson02.teach.felix_liest_die:
    title: Felix legge il messaggio
    gloss: Felix legge il messaggio.
  de.a1.unit59.lesson03.teach.nachschauen:
    title: Cercare
    gloss: cercare (informazioni)
    example_gloss: Cerco le previsioni del tempo.
  de.a1.unit59.lesson03.teach.nachschauen_ist_trennbar:
    title: Nachschauen è separabile
    gloss: 'Nachschauen è separabile, proprio come aufstehen e ausführen: ich schaue nach, du schaust nach. Ma benutzen non è separabile: ich benutze es.'
    note: 'Si contrappone ai verbi separabili dell''unità sulle routine: benutzen (con il prefisso inseparabile be-) non si divide mai.'
  de.a1.unit59.lesson03.teach.jonas_schaut_im:
    title: Jonas controlla le previsioni del tempo
    gloss: Jonas controlla le previsioni del tempo.
  de.a1.unit59.lesson03.teach.dann_geht_er:
    title: Poi va a correre
    gloss: Poi va a correre.
    note: 'Riprende *joggen*, già visto nell''unità sullo sport. Dopo dann il verbo è in seconda posizione: dann geht er joggen.'
  de.a1.unit59.lesson04.teach.anna_wollen_wir:
    title: Anna fa una proposta
    gloss: 'Anna: Facciamo sport sabato alle dieci?'
  de.a1.unit59.lesson04.teach.felix_gute_idee:
    title: Felix accetta
    gloss: 'Felix: Buona idea! Controllo le previsioni del tempo.'
    note: Riprende *Gute Idee*, già visto nell'unità sui programmi.
  de.a1.unit59.lesson04.teach.felix_am_samstag:
    title: Felix controlla il tempo
    gloss: 'Felix: Sabato c''è il sole!'
    note: Riprende *sonnig*, già visto nell'unità sul tempo.
  de.a1.unit59.lesson04.teach.jonas_ich_sehe:
    title: Jonas vede il messaggio
    gloss: 'Jonas: Vedo il messaggio. A sabato!'
  de.a1.unit59.lesson04.teach.du_kennst_schon:
    title: Bis bald e Bis + un giorno
    gloss: 'Conosci già Bis bald! Puoi anche nominare un giorno: Bis Samstag!, Bis morgen!'
    note: Estende lo schema di saluto dell'unità sui saluti a un giorno preciso.
  de.a1.unit59.lesson05.teach.anna_ruft_felix:
    title: Chi usa cosa?
    gloss: Anna chiama Felix ogni giorno. Usa il cellulare, non un'app. Felix a casa non ha un computer, ma usa internet sul cellulare. Jonas controlla le previsioni del tempo ogni mattina. Poi va a correre. Lena manda spesso un messaggio ad Anna. Anche tu usi il cellulare ogni giorno?
    note: Confronta le abitudini dei quattro personaggi con i dispositivi, come la lettura di confronto dell'unità sullo sport.
