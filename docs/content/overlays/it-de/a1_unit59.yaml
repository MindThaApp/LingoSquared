course:
  title: Tedesco A1
  description: 'Tedesco per principianti per parlare di tecnologia: dare un nome a cellulari, computer e internet, mandare e leggere messaggi tramite un''app, cercare informazioni online e usare tutto questo per organizzare un vero programma con gli amici.'
