course:
  title: Tedesco A1
  description: 'Tedesco per principianti per parlare delle attività del tempo libero: vocabolario sugli hobby, espressioni di frequenza, chiedere e rispondere a che cosa si fa nel tempo libero e confrontare gli hobby di due persone.'
