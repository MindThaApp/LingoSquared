  de.a1.unit54.lesson06.ein_wochenende_zusammen_planen:
    title: Programmare un fine settimana insieme
teaching:
  de.a1.unit54.lesson01.teach.lesen_sport_treiben:
    title: Leggere, fare sport, cucinare
    gloss: leggere, fare sport, cucinare
    note: 'Tre verbi comuni per gli hobby: *lesen* (leggere), *Sport treiben* (fare sport) e *kochen* (cucinare). Sport è un sostantivo, quindi si scrive con la maiuscola.'
    example_gloss:
    - Mi piace leggere un libro.
    - Faccio sport il sabato.
    - Mi piace cucinare per gli amici.
  de.a1.unit54.lesson01.teach.die_freizeit:
    title: Tempo libero
    gloss: tempo libero
    note: '*Die Freizeit* è un sostantivo femminile: impara sempre la parola con l''articolo die. È la parola chiave per parlare degli hobby.'
    example_gloss: Nel mio tempo libero mi piace leggere.
  de.a1.unit54.lesson01.teach.in_meiner_freizeit:
    title: Dire che cosa fai nel tempo libero
    gloss: Nel mio tempo libero mi piace leggere.
    note: '*Lese* è la forma di ich di *lesen* (leggere). La frase inizia con un complemento di tempo, ma il verbo resta comunque al secondo posto: in meiner Freizeit lese ich gern.'
  de.a1.unit54.lesson02.teach.musik_hoeren_zeichnen:
    title: Musica, disegno, videogiochi
    gloss: ascoltare musica, disegnare, giocare ai videogiochi
    note: 'Altre tre espressioni sugli hobby: *Musik hören* (ascoltare musica), *zeichnen* (disegnare) e *Videospiele spielen* (giocare ai videogiochi). Musik e Videospiele sono sostantivi, quindi hanno la maiuscola.'
    example_gloss:
    - Mi piace ascoltare musica.
    - Disegno spesso.
    - Mi piace giocare ai videogiochi con gli amici.
  de.a1.unit54.lesson02.teach.ich_hoere_gern:
    title: Dire che ti piace ascoltare musica
    gloss: Mi piace ascoltare musica.
    note: In tedesco si dice *Musik hören* senza preposizione, mentre in italiano si dice «ascoltare musica» e il verbo regge direttamente il complemento, proprio come in tedesco.
  de.a1.unit54.lesson02.teach.ich_spiele_gern:
    title: Dire che ti piace giocare ai videogiochi con gli amici
    gloss: Mi piace giocare ai videogiochi con gli amici.
    note: '*Mit Freunden* (con gli amici): mit vuole sempre il dativo, quindi Freunde diventa Freunden.'
  de.a1.unit54.lesson03.teach.immer_oft_manchmal:
    title: Sempre, spesso, a volte, mai
    gloss: sempre, spesso, a volte, mai
    note: 'I quattro avverbi di frequenza fondamentali: immer, oft, manchmal, nie. Di solito stanno subito dopo il verbo: ich spiele nie.'
    example_gloss:
    - Faccio sempre sport il sabato.
    - Leggo spesso un libro.
    - A volte disegno.
    - Non gioco mai ai videogiochi.
  de.a1.unit54.lesson03.teach.jede_woche_jedes:
    title: Ogni settimana, ogni fine settimana
    gloss: ogni settimana, ogni fine settimana
    note: '*Jede Woche* e *jedes Wochenende* significano entrambi «ogni», ma la desinenza cambia secondo il genere del sostantivo: guarda la scheda successiva.'
    example_gloss:
    - Cucino per gli amici ogni settimana.
    - Faccio sport ogni fine settimana.
  de.a1.unit54.lesson03.teach.die_woche_jede:
    title: Jede o jedes
    gloss: Die Woche è femminile, quindi si dice jede Woche. Das Wochenende è neutro, quindi si dice jedes Wochenende.
    note: '*Woche* è femminile (*die Woche*), quindi vuole *jede*; *Wochenende* è neutro (*das Wochenende*), quindi vuole *jedes*. Impara ogni sostantivo con il suo articolo e saprai la desinenza.'
  de.a1.unit54.lesson03.teach.was_machst_du:
    title: Chiedere del tempo libero
    gloss: Che cosa fai nel tempo libero?
    note: 'Questa è la domanda chiave dell''unità: usala per chiedere a chiunque dei suoi hobby.'
  de.a1.unit54.lesson04.teach.anna_wir_gehen:
    title: Anna parla degli hobby
    gloss: 'Anna: Andiamo spesso a passeggio insieme. Ma che cos''altro fai nel tempo libero, Felix?'
    note: '*Wir gehen oft zusammen spazieren* usa gehen più un secondo verbo: il verbo coniugato gehen è al secondo posto, l''infinito spazieren va in fondo.'
  de.a1.unit54.lesson04.teach.felix_ich_koche:
    title: Gli hobby di Felix
    gloss: 'Felix: Mi piace cucinare, anche a casa. E faccio spesso sport.'
    note: '*Auch zu Hause* (anche a casa) chiarisce che Felix cucina per piacere, non solo per il suo lavoro al ristorante.'
  de.a1.unit54.lesson04.teach.anna_kochst_du:
    title: Anna è sorpresa
    gloss: 'Anna: Cucini anche a casa? Cucini già tutto il giorno al lavoro!'
    note: '*Den ganzen Tag* (tutto il giorno) è all''accusativo, per questo der Tag diventa den Tag. Le durate di tempo di questo tipo vogliono l''accusativo.'
  de.a1.unit54.lesson04.teach.felix_ja_aber:
    title: Felix spiega
    gloss: 'Felix: Sì, ma cucinare per me è rilassante. E tu, che cosa ti piace fare?'
    note: '*Kochen finde ich entspannend* mette Kochen all''inizio per dargli enfasi. Il verbo resta al secondo posto, quindi ich passa dopo.'
  de.a1.unit54.lesson04.teach.anna_ich_lese:
    title: Gli hobby di Anna
    gloss: 'Anna: Mi piace leggere e ascolto spesso musica.'
    note: Unisce in una sola frase, con *und* (e), due verbi sugli hobby delle lezioni 01-02.
  de.a1.unit54.lesson04.teach.felix_spielst_du:
    title: Felix chiede dei videogiochi
    gloss: 'Felix: Giochi anche ai videogiochi?'
    note: 'Una breve domanda sì/no: il verbo viene per primo, spielst du ...?'
  de.a1.unit54.lesson04.teach.anna_nein_ich:
    title: Anna risponde
    gloss: 'Anna: No, non gioco mai ai videogiochi. Ma ogni tanto disegno!'
    note: '*Nie* (mai) e *manchmal* (ogni tanto) della lezione 03, messi a confronto in una sola risposta. Entrambi stanno subito dopo il verbo.'
  de.a1.unit54.lesson05.teach.felix_und_ich:
    title: Confronto tra hobby
    gloss: Io e Felix andiamo spesso a passeggio insieme. Ma abbiamo anche altri hobby. A Felix piace cucinare, anche a casa, e fa spesso sport. A me piace leggere e ascolto spesso musica. Ogni tanto disegno, ma non gioco mai ai videogiochi. Che cosa ti piace fare nel tempo libero?
    note: Il messaggio di Anna riassume quanto visto nella lezione 04 e finisce chiedendo al lettore la domanda centrale dell'unità.
    glosses:
      spazieren: passeggiamo
      oft: spesso
      zusammen: insieme
      andere: altri
      kocht: cucina
      gern: piace
      Hause: a casa
      Sport: fa sport
      lese: leggere
      höre: ascolto
      Musik: musica
      zeichne: disegno
      manchmal: a volte
      spiele: gioco ai videogiochi
      nie: mai
      freien: libero
      Zeit: tempo
  de.a1.unit54.lesson06.teach.felix_was_machst:
    title: Felix chiede del fine settimana
    gloss: 'Felix: Che cosa fai questo fine settimana?'
    note: '*Dieses Wochenende* (questo fine settimana) ha la desinenza neutra -es, perché das Wochenende è neutro.'
  de.a1.unit54.lesson06.teach.anna_ich_weiss:
    title: Anna è indecisa
    gloss: 'Anna: Non lo so ancora. Mi piace leggere, ma voglio anche uscire.'
    note: '*Nach draußen* (fuori, letteralmente «verso fuori») è un modo comune per dire che si vuole uscire di casa.'
  de.a1.unit54.lesson06.teach.felix_gehen_wir:
    title: Felix propone un programma
    gloss: 'Felix: Andiamo a passeggio insieme? Dopo cucino io per noi.'
    note: '*Danach* (dopo) sta all''inizio, quindi segue il verbo e poi il soggetto: danach koche ich.'
  de.a1.unit54.lesson06.teach.anna_gute_idee:
    title: Anna accetta
    gloss: 'Anna: Bella idea! Mi piace sia andare a passeggio sia cucinare.'
    note: '*Gern* dopo il verbo indica che qualcosa ti piace: ich gehe gern spazieren, ich koche gern. Funziona con quasi tutti i verbi.'
  de.a1.unit54.lesson06.teach.felix_perfekt_dann:
    title: Felix conferma
    gloss: 'Felix: Perfetto. Allora ci vediamo sabato!'
    note: 'Una battuta finale cordiale che conferma il programma per *Samstag* (sabato). I giorni della settimana vogliono *am*: am Samstag.'
