course:
  title: Tedesco A1
  description: 'Tedesco per principianti per descrivere l''aspetto fisico di una persona: impressioni su altezza ed età, colore di capelli e occhi, la domanda fondamentale Wie sieht ... aus? e il confronto tra l''aspetto di due persone.'
units:
  de.a1.unit55.aussehen:
    title: Descrivere l'aspetto
lessons:
  de.a1.unit55.lesson01.gross_klein_alt_und:
    title: Alto, basso, anziano e giovane
  de.a1.unit55.lesson02.haare_beschreiben:
    title: Descrivere i capelli
  de.a1.unit55.lesson03.augen_und_wie_jemand:
    title: Gli occhi e «Com'è?»
  de.a1.unit55.lesson04.anna_beschreibt_nina:
    title: Anna descrive Nina
  de.a1.unit55.lesson05.jonas_und_lena_im:
    title: Confrontiamo Jonas e Lena
  de.a1.unit55.lesson06.felix_erkennt_nina:
    title: Felix riconosce Nina
teaching:
  de.a1.unit55.lesson01.teach.gross_klein:
    title: Alto e basso
    gloss: alto / basso
    note: '*Groß* descrive una persona alta e *klein* una persona bassa. Per le persone il tedesco usa groß (grande), non lang (lungo).'
    example_gloss:
    - Lena è alta.
    - Jonas è basso.
  de.a1.unit55.lesson01.teach.alt_jung:
    title: Anziano e giovane
    gloss: anziano / giovane
    note: '*Alt* e *jung* qui descrivono un''impressione generale dell''età, non un numero esatto di anni.'
    example_gloss:
    - Il nonno è anziano.
    - Felix è giovane.
  de.a1.unit55.lesson01.teach.alt_kann_eine:
    title: 'Alt: un numero o un''impressione'
    gloss: Alt può accompagnarsi a un numero di anni, come in Ich bin dreißig Jahre alt, oppure dare un'impressione generale, come in Opa ist alt.
    note: Per chiedere l'età esatta di qualcuno si dice *Wie alt bist du?* Qui invece *alt* descrive quanti anni qualcuno DIMOSTRA, senza alcun numero.
  de.a1.unit55.lesson01.teach.lena_ist_gross:
    title: Lena è alta e Jonas è basso
    gloss: Lena è alta e Jonas è basso.
    note: Una semplice frase composta con *und* (e), che prepara il confronto diretto della lezione 05.
  de.a1.unit55.lesson02.teach.die_haare:
    title: I capelli
    gloss: i capelli
    note: '*Haare* è un sostantivo plurale: *die Haare*. Il tedesco ha anche il singolare das Haar, ma per i capelli della testa di solito si dice Haare.'
    example_gloss: Felix ha i capelli neri corti.
  de.a1.unit55.lesson02.teach.blond_braun_grau:
    title: Biondo, castano e grigio
    gloss: biondo / castano / grigio
    note: 'Tre colori dei capelli: blond, braun, grau. Davanti a un sostantivo plurale senza articolo prendono la desinenza -e: blonde, braune, graue Haare.'
    example_gloss:
    - Anna ha i capelli biondi.
    - Jonas ha i capelli castani.
    - Il nonno ha i capelli grigi.
  de.a1.unit55.lesson02.teach.lang_kurz:
    title: Lunghi e corti (capelli)
    gloss: lungo / corto (capelli)
    note: '*Kurz* (corto) e *lang* (lungo) descrivono la lunghezza dei capelli. Di nuovo la desinenza -e: kurze Haare, lange Haare.'
    example_gloss:
    - Lena ha i capelli lunghi.
    - Jonas ha i capelli corti.
  de.a1.unit55.lesson02.teach.haare_ist_plural:
    title: Haare vuole la desinenza -e
    gloss: 'Haare è plurale e non ha articolo, quindi l''aggettivo termina in -e: kurze Haare, lange Haare, blonde Haare, braune Haare, graue Haare, schwarze Haare.'
    note: Senza articolo, un aggettivo davanti a un sostantivo plurale prende -e. È lo stesso schema di *Augen* nella lezione 03.
  de.a1.unit55.lesson02.teach.anna_hat_lange:
    title: 'Ihre: suo (di lei)'
    gloss: 'Qui ihre significa «suoi»: ihre Haare = i suoi capelli. Anna ha i capelli lunghi e i suoi capelli sono biondi.'
    note: '*Ihre* (con la i minuscola) è il possessivo «suo/suoi» e concorda con il plurale Haare. Con la I maiuscola, *Ihre* significa «Suo/Suoi» (forma di cortesia).'
  de.a1.unit55.lesson02.teach.felix_hat_kurze:
    title: Felix ha i capelli neri corti
    gloss: Felix ha i capelli neri corti.
    note: 'Riprende *schwarz* (nero), ora per i capelli: schwarze Haare.'
  de.a1.unit55.lesson02.teach.anna_hat_lange_2:
    title: Anna ha i capelli biondi lunghi
    gloss: Anna ha i capelli biondi lunghi.
    note: Unisce in un'unica frase naturale il lessico di lunghezza e colore di questa lezione.
  de.a1.unit55.lesson03.teach.die_augen:
    title: Gli occhi
    gloss: gli occhi
    note: '*Augen* è il plurale di *das Auge*. Il tedesco usa di solito il plurale, perché abbiamo due occhi.'
    example_gloss: Felix ha gli occhi castani.
  de.a1.unit55.lesson03.teach.blau_braun_gruen:
    title: Azzurro, marrone e verde
    gloss: azzurro / marrone / verde
    note: 'I colori: blau (blu), braun (marrone) e grün (verde).'
    example_gloss:
    - Anna ha gli occhi azzurri.
    - Jonas ha gli occhi castani.
    - Lena ha gli occhi verdi.
  de.a1.unit55.lesson03.teach.augen_ist_plural:
    title: Augen vuole -e
    gloss: 'Augen è plurale, quindi l''aggettivo termina in -e: blaue Augen, braune Augen, grüne Augen.'
    note: 'Stessa regola di Haare: nessun articolo più un sostantivo plurale dà la desinenza -e.'
  de.a1.unit55.lesson03.teach.wie_sieht_anna:
    title: Com'è Anna?
    gloss: Com'è Anna?
    note: '*Wie sieht ... aus?* è la domanda centrale di questa unità. *Aussehen* è un verbo separabile: sieht ... aus.'
  de.a1.unit55.lesson03.teach.anna_hat_lange:
    title: Anna ha i capelli biondi lunghi e gli occhi azzurri
    gloss: Anna ha i capelli biondi lunghi e gli occhi azzurri.
    note: Una risposta modello che unisce capelli e occhi in una sola frase con *und*.
  de.a1.unit55.lesson04.teach.anna_ein_neues:
    title: Anna presenta Nina
    gloss: 'Anna: Una ragazza nuova viene al caffè linguistico. Si chiama Nina.'
    note: '*Ein neues Mädchen kommt* introduce una persona nuova. Dopo *kommt*, la direzione *ins* (in das) Sprachcafé richiede l''accusativo.'
  de.a1.unit55.lesson04.teach.felix_okay_wie:
    title: Felix chiede com'è
    gloss: 'Felix: Okay! Com''è?'
    note: 'Riprende la domanda centrale di questa unità, ora con *sie* (lei) al posto di un nome: wie sieht sie aus?'
  de.a1.unit55.lesson04.teach.anna_sie_ist:
    title: Anna descrive l'altezza e i capelli di Nina
    gloss: 'Anna: È bassa e ha i capelli biondi corti.'
    note: 'Unisce *klein* al lessico dei capelli della lezione 02. Il secondo *sie* viene omesso: sie ist klein und hat ...'
  de.a1.unit55.lesson04.teach.felix_und_ihre:
    title: Felix chiede degli occhi
    gloss: 'Felix: E i suoi occhi?'
    note: Qui *Ihre* significa «suoi» (possessivo), non è una forma di cortesia. Concorda con il plurale Augen.
  de.a1.unit55.lesson04.teach.anna_sie_hat:
    title: Anna descrive gli occhi di Nina
    gloss: 'Anna: Ha gli occhi verdi.'
    note: Riprende *grüne Augen* dalla lezione 03.
  de.a1.unit55.lesson04.teach.felix_danke_dann:
    title: Felix la riconoscerà
    gloss: 'Felix: Grazie! Allora la riconoscerò di sicuro.'
    note: '*Dann erkenne ich sie bestimmt* significa «allora la riconoscerò di sicuro». Dopo *dann* il verbo sta al secondo posto: dann erkenne ich sie.'
  de.a1.unit55.lesson05.teach.jonas_und_lena:
    title: Jonas e Lena a confronto
    gloss: Jonas e Lena sono fratello e sorella, ma hanno un aspetto diverso. Jonas è basso e ha i capelli corti castani e gli occhi marroni. Lena è più alta di Jonas e ha i capelli lunghi castani e gli occhi verdi. Tu come sei fisicamente?
    note: Un breve confronto che riprende tutte le parole di colore e lunghezza viste finora e termina con la domanda chiave dell'unità rivolta a chi legge.
    glosses:
      Bruder: fratello
      Schwester: sorella
      sehen: essere (di aspetto)
      unterschiedlich: diverso
      klein: basso
      kurze: basso
      braune: castano
      Haare: i capelli
      Augen: gli occhi
      größer: più alto
      lange: lungo
      grüne: verde
      aus: (parte di 'aussehen' = avere un certo aspetto)
  de.a1.unit55.lesson05.teach.das_muster_kennst:
    title: Di nuovo il comparativo
    gloss: 'Conosci già lo schema aggettivo + -er + als (di/che). Qui lo usi per le persone: Lena è più alta di Jonas.'
    note: 'Lo stesso schema *-er + als* dell''unità sui confronti. Groß diventa größer: la vocale prende la dieresi (Umlaut).'
  de.a1.unit55.lesson05.teach.lena_hat_laengere:
    title: Lena ha i capelli più lunghi di Jonas
    gloss: Lena ha i capelli più lunghi di Jonas.
    note: '*Längere Haare*: länger prende la desinenza -e davanti a un sostantivo plurale senza articolo, e lang nel comparativo prende l''Umlaut.'
  de.a1.unit55.lesson05.teach.ich_habe_kurze:
    title: Ho i capelli corti e castani
    gloss: Ho i capelli corti e castani.
    note: Una frase modello in prima persona con *Ich habe ...*, da riutilizzare per descrivere il tuo aspetto.
  de.a1.unit55.lesson06.teach.felix_schau_mal:
    title: Felix nota Nina
    gloss: 'Felix: Guarda, è Nina? Ha i capelli corti biondi e gli occhi verdi.'
    note: '*Schau mal* (dai un''occhiata) è un modo amichevole per indicare qualcosa. È l''imperativo della forma du.'
  de.a1.unit55.lesson06.teach.anna_ja_das:
    title: Anna conferma
    gloss: 'Anna: Sì, è Nina!'
    note: Una conferma breve e naturale.
  de.a1.unit55.lesson06.teach.nina_hallo_bist:
    title: Nina saluta Felix
    gloss: 'Nina: Ciao, sei Felix?'
    note: 'Una semplice domanda informale: *bist du ...?* (sei ...?). Bist è la forma di sein per du.'
  de.a1.unit55.lesson06.teach.felix_ja_freut:
    title: Felix risponde al saluto di Nina
    gloss: 'Felix: Sì! Piacere, Nina.'
    note: '*Freut mich* è la formula standard per una prima presentazione, come nell''unità 2. Per qualcuno che già conosci diresti *Schön, dich zu sehen*.'
  de.a1.unit55.lesson06.teach.nina_freut_mich:
    title: Nina ricambia il saluto
    gloss: 'Nina: Piacere di conoscerti anch''io!'
    note: 'Chiude il dialogo: Felix ha riconosciuto Nina grazie alla descrizione di Anna.'
