teaching:
  de.a1.unit20.lesson01.teach.wetter:
    title: Wetter
    gloss: tempo (meteorologico)
    note: '*Wetter* è neutro: *das Wetter*.'
    example_gloss: Che tempo fa?
  de.a1.unit20.lesson01.teach.sonnig:
    title: sonnig
    gloss: soleggiato
    note: Per dire «C'è il sole» si usa *Es ist sonnig*.
    example_gloss: C'è il sole.
  de.a1.unit20.lesson01.teach.kalt:
    title: kalt
    gloss: freddo
    note: '*kalt* descrive la temperatura.'
    example_gloss: Fa freddo.
  de.a1.unit20.lesson01.teach.warm:
    title: warm
    gloss: caldo
    note: In *warm* la a è breve e la r in fondo alla sillaba si pronuncia in modo molto debole, quasi come una vocale.
    example_gloss: Fa caldo.
  de.a1.unit20.lesson01.teach.regnet:
    title: Es regnet.
    gloss: Piove.
    note: 'In tedesco *Es* è obbligatorio: a differenza dell''italiano, il soggetto non si può omettere.'
  de.a1.unit20.lesson02.teach.dann:
    title: dann
    gloss: poi, allora
    note: '*dann* collega il tempo a un programma.'
    example_gloss: Allora andiamo al bar.
  de.a1.unit20.lesson02.teach.ins_cafe:
    title: Wir gehen ins Cafe.
    gloss: Andiamo al bar.
    note: '*ins* significa «nel/al» e si usa con i luoghi neutri come *das Cafe*.'
    example_gloss: 'Nel contesto: allora andiamo al bar.'
  de.a1.unit20.lesson02.teach.morgen:
    title: morgen
    gloss: domani
    note: '*morgen* in minuscolo significa «domani».'
    example_gloss: Domani c'è il sole.
  de.a1.unit20.lesson02.teach.forecast:
    title: Bollettino meteo
    gloss: bollettino meteo
    note: Le previsioni mettono a confronto oggi e domani.
    example_gloss: Domani c'è il sole.
  de.a1.unit20.lesson02.teach.line01:
    title: Anna chiede del tempo
    gloss: 'Anna: Che tempo fa oggi?'
    note: Una domanda diretta sul tempo.
  de.a1.unit20.lesson02.teach.line02:
    title: Felix descrive il tempo di oggi
    gloss: 'Felix: Fa freddo e piove.'
    note: La risposta unisce temperatura e pioggia.
  de.a1.unit20.lesson02.teach.line03:
    title: Anna fa un programma
    gloss: 'Anna: Allora andiamo al bar.'
    note: Il programma nasce dal tempo piovoso.
  de.a1.unit20.lesson02.teach.line04:
    title: Felix parla di domani
    gloss: 'Felix: Buona idea. Domani ci sarà il sole.'
    note: Felix aggiunge il tempo di domani.
