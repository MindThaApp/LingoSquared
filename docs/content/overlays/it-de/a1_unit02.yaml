teaching:
  de.a1.unit02.lesson01.teach.wie_heissen_sie:
    title: Wie heißen Sie?
    gloss: Come si chiama? (formale)
    note: '*Wie heißen Sie?* significa letteralmente «come si chiama?», con la forma di cortesia *Sie* dell''Unità 1.'
  de.a1.unit02.lesson01.teach.ich_heisse_anna:
    title: Ich heiße Anna.
    gloss: Mi chiamo Anna.
    note: '*heißen* significa «chiamarsi»: è il modo normale per dire il proprio nome.'
  de.a1.unit02.lesson01.teach.wie_heisst_du:
    title: Wie heißt du?
    gloss: Come ti chiami? (informale)
    note: La versione informale, con *du* dell'Unità 1.
  de.a1.unit02.lesson01.teach.ich_heisse_felix:
    title: Ich heiße Felix.
    gloss: Mi chiamo Felix.
    note: Stessa costruzione di *Ich heiße Anna*, con un nome diverso.
  de.a1.unit02.lesson01.teach.freut_mich:
    title: Freut mich.
    gloss: Piacere.
    note: Un modo breve e comune per dire che ti fa piacere conoscere qualcuno, valido in entrambi i registri.
  de.a1.unit02.lesson01.teach.ganz_meinerseits:
    title: Ganz meinerseits.
    gloss: Altrettanto. / Il piacere è mio.
    note: 'La risposta naturale a *Freut mich*: letteralmente «completamente da parte mia».'
  de.a1.unit02.lesson02.teach.ich:
    title: ich
    gloss: io
    note: '*ich* si scrive con la minuscola, tranne a inizio frase (come in *Ich bin Anna.*): in questo è come «io» in italiano.'
  de.a1.unit02.lesson02.teach.du:
    title: du
    gloss: tu (informale)
    note: Già visto nell'Unità 1; qui lo ripassiamo come soggetto di una frase completa.
  de.a1.unit02.lesson02.teach.ich_bin_anna:
    title: Ich bin Anna.
    gloss: Io sono Anna.
    note: '*bin* è la forma di *sein* (essere) per *ich*.'
  de.a1.unit02.lesson02.teach.du_bist_felix:
    title: Du bist Felix.
    gloss: Tu sei Felix.
    note: '*bist* è la forma di *sein* per *du*.'
  de.a1.unit02.lesson03.teach.deutschland:
    title: Deutschland
    gloss: Germania
    note: 'In tedesco i nomi dei paesi di solito non hanno l''articolo: si dice *Deutschland*, non *das Deutschland*. In italiano invece spesso c''è («la Germania»).'
    example_gloss: Vengo dalla Germania.
  de.a1.unit02.lesson03.teach.england:
    title: England
    gloss: Inghilterra
    note: 'In italiano il paese si chiama «Inghilterra»: in tedesco invece il nome è England e si pronuncia con i suoni tedeschi.'
    example_gloss: Vengo dall'Inghilterra.
  de.a1.unit02.lesson03.teach.frankreich:
    title: Frankreich
    gloss: Francia
    note: 'Attenzione: in tedesco la grafia è diversa da quella del nome francese *France* e anche dall''italiano «Francia».'
    example_gloss: Vengo dalla Francia.
  de.a1.unit02.lesson03.teach.italien:
    title: Italien
    gloss: Italia
    note: Si pronuncia più o meno «i-TÀ-li-en».
    example_gloss: Vengo dall'Italia.
  de.a1.unit02.lesson03.teach.spanien:
    title: Spanien
    gloss: Spagna
    note: Si pronuncia più o meno «SCPÀ-ni-en».
    example_gloss: Vengo dalla Spagna.
  de.a1.unit02.lesson03.teach.russland:
    title: Russland
    gloss: Russia
    note: Formato da *Russ-* + *-land* («terra»), come *Deutschland*.
    example_gloss: Vengo dalla Russia.
  de.a1.unit02.lesson04.teach.woher_kommen_sie:
    title: Woher kommen Sie?
    gloss: Di dove è? (formale)
    note: '*Woher* significa «da dove» ed è una sola parola, che include già il senso di «da».'
  de.a1.unit02.lesson04.teach.ich_komme_aus_deutschland:
    title: Ich komme aus Deutschland.
    gloss: Vengo dalla Germania.
    note: '*aus* + nome del paese indica la provenienza: a questo livello non serve ancora l''aggettivo di nazionalità.'
  de.a1.unit02.lesson04.teach.woher_kommst_du:
    title: Woher kommst du?
    gloss: Di dove sei? (informale)
    note: La versione informale, con *du*.
