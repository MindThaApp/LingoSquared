    gloss: Vengo dall'Inghilterra.
    note: Stessa costruzione di *Ich komme aus Deutschland*, con un paese diverso.
  de.a1.unit02.lesson04.teach.und_sie:
    title: Und Sie?
    gloss: E Lei? (formale)
    note: Un modo breve per restituire la domanda, nello stesso registro formale di *Sie*.
  de.a1.unit02.lesson05.teach.line01:
    title: Felix saluta Anna
    gloss: 'Felix dice: Buongiorno!'
    note: 'Felix e Anna sono vicini di casa che si sono già incontrati una volta (Unità 1) ma non si erano detti i nomi: si rivedono ora alla fermata dell''autobus.'
  de.a1.unit02.lesson05.teach.line02:
    title: Anna risponde al saluto e chiede il suo nome
    gloss: 'Anna dice: Buongiorno! Come si chiama?'
    note: Anna usa il *Sie* formale, proseguendo il registro stabilito tra estranei nell'Unità 1.
  de.a1.unit02.lesson05.teach.line03:
    title: Felix dice il suo nome e ricambia la domanda
    gloss: 'Felix dice: Mi chiamo Felix. E Lei?'
    note: Felix risponde e ricambia la domanda in forma formale.
  de.a1.unit02.lesson05.teach.line04:
    title: Anna dice il suo nome
    gloss: 'Anna dice: Mi chiamo Anna. Piacere.'
    note: Anna risponde allo stesso modo e aggiunge la formula di cortesia.
  de.a1.unit02.lesson05.teach.line05:
    title: Felix risponde e chiede di dov'è lei
    gloss: 'Felix dice: Altrettanto. Di dov''è Lei?'
    note: Felix ricambia la cortesia e sposta la conversazione sulla provenienza.
  de.a1.unit02.lesson05.teach.line06:
    title: Anna risponde e ricambia la domanda
    gloss: 'Anna dice: Vengo dalla Germania. E Lei?'
    note: Questo conferma che Anna è tedesca, coerentemente con il fatto che i due sono vicini di casa in una città di lingua tedesca.
  de.a1.unit02.lesson05.teach.line07:
    title: Felix risponde
    gloss: 'Felix dice: Vengo dall''Inghilterra.'
    note: 'Ora scopriamo che Felix viene dall''Inghilterra: un vicino inglese che vive in Germania.'
  de.a1.unit02.lesson05.teach.line08:
    title: Anna saluta
    gloss: 'Anna dice: Arrivederci!'
    note: Il saluto di congedo formale dell'Unità 1, coerente con il loro registro in *Sie*.
  de.a1.unit02.lesson05.teach.line09:
    title: Felix saluta
    gloss: 'Felix dice: Arrivederci!'
    note: Felix chiude allo stesso modo, mantenendo lo stesso registro per tutto l'incontro.
  de.a1.unit02.lesson05.teach.steckbrief:
    title: Un breve profilo scritto
    gloss: 'Nome: Felix. Paese: Inghilterra.'
    note: 'Una semplice scheda di profilo con un nome e un dato di identità: le stesse informazioni che Felix ha dato a voce nel dialogo.'
