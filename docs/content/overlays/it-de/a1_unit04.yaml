teaching:
  de.a1.unit04.lesson01.teach.montag:
    title: Montag
    gloss: lunedì
    note: Nei paesi di lingua tedesca *Montag* è il primo giorno della settimana, proprio come in Italia.
    example_gloss: Lunedì ho tempo.
  de.a1.unit04.lesson01.teach.dienstag:
    title: Dienstag
    gloss: martedì
    note: '*Dienstag* è il secondo giorno della settimana.'
    example_gloss: Martedì ho tempo.
  de.a1.unit04.lesson01.teach.mittwoch:
    title: Mittwoch
    gloss: mercoledì
    note: '*Mittwoch* significa letteralmente «metà settimana»: è davvero il giorno centrale della settimana lavorativa tedesca.'
    example_gloss: Mercoledì ho tempo.
  de.a1.unit04.lesson01.teach.donnerstag:
    title: Donnerstag
    gloss: giovedì
    note: '*Donnerstag* prende il nome dal dio germanico Donar (Thor).'
    example_gloss: Giovedì ho tempo.
  de.a1.unit04.lesson01.teach.freitag:
    title: Freitag
    gloss: venerdì
    note: '*Freitag* prende il nome dalla dea germanica Frigg.'
    example_gloss: Venerdì ho tempo.
  de.a1.unit04.lesson01.teach.samstag:
    title: Samstag
    gloss: sabato
    note: '*Samstag* è la parola usata per «sabato» nella maggior parte della Germania; *Sonnabend* è un''alternativa regionale (Germania settentrionale e orientale).'
    example_gloss: Sabato ho tempo.
  de.a1.unit04.lesson01.teach.sonntag:
    title: Sonntag
    gloss: domenica
    note: '*Sonntag* significa letteralmente «giorno del sole».'
    example_gloss: Domenica ho tempo.
  de.a1.unit04.lesson01.teach.welcher_tag:
    title: Welcher Tag ist heute?
    gloss: Che giorno è oggi?
    note: '*heute* significa «oggi»; *Welcher Tag* = «quale giorno».'
  de.a1.unit04.lesson02.teach.januar:
    title: Januar
    gloss: gennaio
    note: '*Januar* è il primo mese dell''anno.'
    example_gloss: Il mio compleanno è a gennaio.
  de.a1.unit04.lesson02.teach.maerz:
    title: März
    gloss: marzo
    note: '*März* è il terzo mese dell''anno.'
    example_gloss: Il mio compleanno è a marzo.
  de.a1.unit04.lesson02.teach.mai:
    title: Mai
    gloss: maggio
    note: '*Mai* è corto e facile da ricordare: la sua forma è molto simile all''italiano «maggio».'
    example_gloss: Il mio compleanno è a maggio.
  de.a1.unit04.lesson02.teach.juli:
    title: Juli
    gloss: luglio
    note: '*Juli* è il settimo mese dell''anno.'
    example_gloss: Il mio compleanno è a luglio.
  de.a1.unit04.lesson02.teach.september:
    title: September
    gloss: settembre
    note: In italiano si scrive «settembre», in tedesco *September*, con l'iniziale maiuscola e la p.
    example_gloss: Il mio compleanno è a settembre.
  de.a1.unit04.lesson02.teach.dezember:
    title: Dezember
    gloss: dicembre
    note: '*Dezember* è l''ultimo mese dell''anno.'
    example_gloss: Il mio compleanno è a dicembre.
  de.a1.unit04.lesson02.teach.welcher_monat:
    title: Welcher Monat ist es?
    gloss: Che mese è?
    note: '*Monat* significa «mese»; *es* = «è/esso».'
  de.a1.unit04.lesson03.teach.wievielte:
    title: Der Wievielte ist heute?
    gloss: Quanti ne abbiamo oggi?
    note: 'Letteralmente «il quantesimo è oggi?»: è il modo abituale di chiedere la data in tedesco.'
  de.a1.unit04.lesson03.teach.siebte_juli:
    title: Heute ist der siebte Juli.
    gloss: Oggi è il 7 luglio.
    note: 'Come in italiano, il tedesco dice prima il giorno e poi il mese, ma usa il numero ordinale: *der siebte Juli* = «il settimo luglio». Impara *der siebte Juli* come espressione intera.'
  de.a1.unit04.lesson03.teach.dienstag_siebte_juli:
    title: Heute ist Dienstag, der siebte Juli.
    gloss: Oggi è martedì 7 luglio.
    note: Si aggiunge il giorno della settimana prima della data, separato da una virgola.
  de.a1.unit04.lesson03.teach.numerische_form:
    title: Man kann es auch als 7.7. schreiben.
    gloss: Si può scrivere anche 7.7.
    note: 'Le date numeriche tedesche mettono prima il giorno e poi il mese, ciascuno seguito da un punto: 7.7. = 7 luglio. Come in italiano, ma con il punto al posto della barra.'
  de.a1.unit04.lesson03.teach.geburtstag_frage:
    title: Wann haben Sie Geburtstag?
    gloss: Quando compie gli anni? (formale)
    note: 'Letteralmente «Quando ha compleanno?»: in tedesco si *ha* il compleanno.'
  de.a1.unit04.lesson03.teach.geburtstag_antwort:
    title: Mein Geburtstag ist der dritte März.
    gloss: Il mio compleanno è il 3 marzo.
    note: '*Mein Geburtstag* = «il mio compleanno»; *der dritte März* = «il 3 marzo» (prima il giorno, poi il mese).'
  de.a1.unit04.lesson04.teach.oeffnet:
    title: öffnet
    gloss: apre
    note: '*öffnet* è la terza persona singolare di *öffnen* («aprire»): si usa per dire che qualcosa apre, per esempio un negozio o una biblioteca.'
    example_gloss: Il negozio apre lunedì.
  de.a1.unit04.lesson04.teach.wieder:
    title: wieder
    gloss: di nuovo
    note: '*wieder* significa «di nuovo»: qui si usa per chiedere quando qualcosa riapre.'
    example_gloss: La biblioteca riapre lunedì.
  de.a1.unit04.lesson04.teach.die:
    title: die
    gloss: la / le
    note: '*die* è l''articolo determinativo del femminile singolare e di tutti i plurali; qui si usa con il sostantivo femminile *Bibliothek*.'
    example_gloss: La biblioteca è grande.
  de.a1.unit04.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: biblioteca
    note: '*Bibliothek* è un sostantivo femminile (*die Bibliothek*).'
    example_gloss: Vado in biblioteca.
  de.a1.unit04.lesson04.teach.am:
    title: am
    gloss: il / di (con i giorni)
    note: '*am* è la contrazione di *an dem* e si usa con i giorni della settimana e le date (*am Montag* = «lunedì», «di lunedì»).'
    example_gloss: Il lunedì lavoro.
  de.a1.unit04.lesson04.teach.den:
    title: den
    gloss: il (maschile, accusativo)
    note: '*den* è la forma accusativa maschile di *der*. Compare nelle date complete dopo il giorno della settimana, come in *am Donnerstag, den neunten Juli*: impara questa struttura come formula fissa, senza analizzare il caso a questo livello. (Troverai anche *dem* dopo *am*, ugualmente corretto.)'
    example_gloss: Ci vediamo giovedì 9 luglio.
  de.a1.unit04.lesson04.teach.neunten:
    title: neunten
    gloss: nono
    note: '*neunten* è la forma declinata dell''ordinale derivato da *neun* («nove»), usata nelle date: *der neunte Juli* (nominativo) diventa *den neunten Juli* in questa costruzione di data completa.'
    example_gloss: Il mio compleanno è il 9 luglio.
  de.a1.unit04.lesson04.teach.line01:
    title: Felix chiede la data
    gloss: 'Felix dice: Quanti ne abbiamo oggi?'
  de.a1.unit04.lesson04.teach.line02:
    title: Anna dice la data
    gloss: 'Anna dice: Oggi è martedì 7 luglio.'
  de.a1.unit04.lesson04.teach.line03:
    title: Felix chiede della biblioteca
    gloss: 'Felix dice: Quando riapre la biblioteca?'
  de.a1.unit04.lesson04.teach.line04:
    title: Anna risponde
    gloss: 'Anna dice: Riapre giovedì 9 luglio.'
    note: '*Sie* qui significa «essa»: si riferisce a *die Bibliothek* (un sostantivo femminile).'
  de.a1.unit04.lesson04.teach.line05:
    title: Felix saluta
    gloss: 'Felix dice: Bene, a giovedì.'
    note: '*bis Donnerstag* = «fino a giovedì»: è un modo comune per dire «a giovedì».'
  de.a1.unit04.lesson04.teach.notiz:
    title: Un avviso sulla porta
    gloss: Chiuso fino a giovedì 9 luglio.
    note: '*Geschlossen* significa «chiuso».'
