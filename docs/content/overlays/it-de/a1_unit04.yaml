course:
  title: Tedesco A1
  description: Impara il tedesco di livello A1 per i saluti di ogni giorno e i brevi scambi sociali, con spiegazioni dettagliate in italiano.
units:
  de.a1.unit04.daten:
    title: Giorni, mesi e data
lessons:
  de.a1.unit04.lesson01.wochentage:
    title: I giorni della settimana
  de.a1.unit04.lesson02.monate:
    title: I mesi
  de.a1.unit04.lesson03.das_datum:
    title: Dire la data
  de.a1.unit04.lesson04.im_gespraech_ueber_das_datum:
