  description: Impara il tedesco di livello A1 per i saluti di ogni giorno e i brevi scambi sociali, con spiegazioni dettagliate in italiano.
units:
  de.a1.unit08.einkaufen:
    title: 'Fare la spesa: prezzi e quantità'
teaching:
  de.a1.unit08.lesson01.teach.ein_pfund:
    title: ein Pfund Äpfel
    gloss: una libbra di mele
    note: In Germania *Pfund* si usa ancora comunemente nel parlato; un *Pfund* tedesco corrisponde esattamente a 500 g (mezzo chilo), anche se il paese usa ufficialmente il sistema metrico. In italiano si dice più spesso «mezzo chilo» o «5 etti».
  de.a1.unit08.lesson01.teach.ein_dutzend:
    title: ein Dutzend Eier
    gloss: una dozzina di uova
    note: '*Dutzend* significa dozzina (dodici).'
  de.a1.unit08.lesson01.teach.eine_flasche:
    title: eine Flasche Wasser
    gloss: una bottiglia d'acqua
    note: '*Flasche* significa bottiglia.'
  de.a1.unit08.lesson01.teach.eine_tuete:
    title: eine Tüte Reis
    gloss: un sacchetto di riso
    note: '*Tüte* significa sacchetto.'
  de.a1.unit08.lesson01.teach.ein_kilo:
    title: ein Kilo Tomaten
    gloss: un chilo di pomodori
    note: '*Kilo* è l''unità di peso metrica standard, usata molto più di *Pfund* per tutto ciò che va oltre le quantità informali di tutti i giorni.'
  de.a1.unit08.lesson02.teach.was_kosten_die_aepfel:
    title: Was kosten die Äpfel?
    gloss: Quanto costano le mele?
    note: '*kosten* significa «costare»; alla lettera: «Che cosa costano le mele?»'
  de.a1.unit08.lesson02.teach.sie_kosten_zwei_euro:
    title: Sie kosten zwei Euro das Pfund.
    gloss: Costano due euro la libbra.
    note: 'Qui *Sie* significa «loro» (riferito alle mele), non il «Lei» di cortesia. Il *Sie* di cortesia e il *sie* plurale («loro») hanno la stessa forma verbale (*kosten*) e a inizio frase sono entrambi maiuscoli: solo il contesto li distingue. Qui il soggetto sono le mele, non una persona.'
  de.a1.unit08.lesson02.teach.kann_ich_zwei_pfund:
    title: Kann ich zwei Pfund haben, bitte?
    gloss: Posso avere due libbre, per favore?
    note: Una formula di richiesta cortese, simile a *Ich möchte..., bitte* dell'Unità 7.
  de.a1.unit08.lesson02.teach.ist_es_frisch:
    title: Ist es frisch?
    gloss: È fresco?
    note: '*frisch* significa fresco. Qui *es* si riferisce a un sostantivo neutro (come das Brot); per un prodotto maschile si dice *Ist er frisch?* (der Reis) e per uno femminile *Ist sie frisch?* (die Milch): il pronome cambia con il genere del sostantivo e non resta sempre *es*.'
  de.a1.unit08.lesson03.teach.pro_pfund:
    title: pro Pfund
    gloss: per libbra
    note: '*pro* significa «per» (a ogni): si usa sia sui cartellini dei prezzi sia nei prezzi detti a voce.'
    example_gloss: Le mele costano due euro per libbra.
  de.a1.unit08.lesson03.teach.preisschild_text:
    title: Markt-Preisschild
    gloss: Cartellino dei prezzi del mercato
    note: Un semplice cartellino dei prezzi con tre prodotti e il prezzo per unità.
  de.a1.unit08.lesson04.teach.das_macht_acht_euro:
    title: Das macht acht Euro.
    gloss: Fa otto euro.
    note: '*Das macht...* è il modo standard per dire il totale da pagare, già visto nell''Unità 7.'
  de.a1.unit08.lesson04.teach.line01:
    title: Felix chiede il prezzo
    gloss: 'Felix dice: Quanto costano le mele?'
    note: La stessa domanda della lezione 2, ora in una conversazione vera.
  de.a1.unit08.lesson04.teach.line02:
    title: Anna dice il prezzo
    gloss: 'Anna dice: Costano due euro la libbra.'
    note: Una risposta completa indica il prezzo per unità.
  de.a1.unit08.lesson04.teach.line03:
    title: Felix ordina
    gloss: 'Felix dice: Va bene, posso avere due libbre, per favore?'
    note: 'Qui *Gut* significa «va bene/bene»: accetta il prezzo prima di ordinare.'
  de.a1.unit08.lesson04.teach.line04:
    title: Anna chiede se serve altro
    gloss: 'Anna dice: Certo. Altro?'
    note: '*Natürlich* significa «certo/naturalmente».'
  de.a1.unit08.lesson04.teach.line05:
    title: Felix ordina dell'altro
    gloss: 'Felix dice: Sì, anche una dozzina di uova.'
    note: '*auch* significa «anche».'
  de.a1.unit08.lesson04.teach.line06:
    title: Anna dice il totale
    gloss: 'Anna dice: Fa otto euro.'
    note: Due libbre di mele (4 €) più una dozzina di uova (4 €) fanno un totale di otto euro.
