    title: Eventi passati
teaching:
  de.a1.unit13.lesson01.teach.gestern:
    title: gestern
    gloss: ieri
    note: '*gestern* colloca l''evento nel passato recente.'
    example_gloss: Ieri ero al parco.
  de.a1.unit13.lesson01.teach.gemacht:
    title: Was haben Sie gestern gemacht?
    gloss: Che cosa ha fatto ieri?
    note: Per gli eventi recenti già conclusi il tedesco usa spesso *haben* più il participio passato, un po' come l'italiano con «avere» (ho comprato), ma qui il participio va in fondo alla frase.
  de.a1.unit13.lesson01.teach.gekauft:
    title: Ich habe Brot gekauft.
    gloss: Ho comprato il pane.
    note: Il participio *gekauft* va alla fine.
  de.a1.unit13.lesson01.teach.gegessen:
    title: Ich habe Suppe gegessen.
    gloss: Ho mangiato la minestra.
    note: '*gegessen* è il participio passato di *essen*.'
    example_gloss: 'Nel contesto: Ho comprato il pane e mangiato la minestra.'
  de.a1.unit13.lesson01.teach.gegangen:
    title: Ich bin zum Markt gegangen.
    gloss: Sono andato/a al mercato.
    note: Il movimento verso un luogo si esprime con *bin ... gegangen*, non con *habe ... gegangen*.
  de.a1.unit13.lesson02.teach.war:
    title: Es war sehr gut.
    gloss: Era molto buono.
    note: '*war* è il passato semplice di *sein* (essere): *es ist* (è) diventa *es war* (era).'
  de.a1.unit13.lesson02.teach.bericht_text:
    title: Kurzer Bericht
    gloss: breve resoconto
    note: Il resoconto presenta in successione varie azioni concluse.
    example_gloss: Ieri sono andato/a al mercato.
  de.a1.unit13.lesson02.teach.line01:
    title: Felix chiede di ieri
    gloss: 'Felix: Che cosa ha fatto ieri?'
    note: Un modo standard per chiedere di ieri.
  de.a1.unit13.lesson02.teach.line02:
    title: Anna racconta la sua giornata
    gloss: 'Anna: Sono andata al mercato. Ho comprato il pane e mangiato la minestra.'
    note: Anna usa *bin* per l'andare e *habe* per il comprare e il mangiare.
    example_gloss: 'Nel contesto: Ho comprato il pane.'
  de.a1.unit13.lesson02.teach.line03:
    title: Felix chiede com'era
    gloss: 'Felix: Era buono?'
    note: '*War es gut?* chiede com''era l''evento.'
  de.a1.unit13.lesson02.teach.line04:
    title: Anna dice che era buono
    gloss: 'Anna: Sì, era molto buono.'
    note: Una semplice valutazione finale.
