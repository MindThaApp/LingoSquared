    title: Chiedere e seguire le indicazioni stradali
teaching:
  de.a1.unit10.lesson01.teach.links_abbiegen:
    title: Biegen Sie links ab.
    gloss: Gira a sinistra.
    note: '*abbiegen* (svoltare) è un verbo separabile: il prefisso *ab* va in fondo alla frase: *Biegen Sie... ab*, non *Sie biegen ab* né *Abbiegen Sie*.'
  de.a1.unit10.lesson01.teach.rechts_abbiegen:
    title: Biegen Sie rechts ab.
    gloss: Gira a destra.
    note: Stesso schema del verbo separabile di *links abbiegen*, solo con *rechts* (a destra).
  de.a1.unit10.lesson01.teach.geradeaus_gehen:
    title: Gehen Sie geradeaus.
    gloss: Vai dritto.
    note: '*geradeaus* significa «sempre dritto»: qui non c''è nessun prefisso separabile, è un imperativo di cortesia più semplice.'
  de.a1.unit10.lesson01.teach.hier_anhalten:
    title: Halten Sie hier an.
    gloss: Si fermi qui.
    note: 'Anche *anhalten* (fermarsi) è separabile: *an* va in fondo, come in *abbiegen*.'
  de.a1.unit10.lesson01.teach.ecke:
    title: Ecke
    gloss: angolo
    note: '*Ecke* significa angolo: è un sostantivo femminile, *die Ecke*.'
    example_gloss: Giri a sinistra all'angolo.
  de.a1.unit10.lesson02.teach.wie_komme_ich_zur_bank:
    title: Wie komme ich zur Bank?
    gloss: Come arrivo in banca?
    note: '*zur* è la contrazione di *zu der* (dativo femminile, die Bank): lo stesso tipo di contrazione di *vom* (von + dem) dell''Unità 9.'
  de.a1.unit10.lesson02.teach.geradeaus_dann_links:
    title: Gehen Sie geradeaus, dann biegen Sie an der Ecke links ab.
    gloss: Vada dritto, poi giri a sinistra all'angolo.
    note: '*dann* (poi) collega due indicazioni di percorso; *an der Ecke* (all''angolo) usa l''articolo femminile al dativo, come nello schema delle preposizioni di luogo dell''Unità 9.'
  de.a1.unit10.lesson02.teach.ist_es_weit:
    title: Ist es weit?
    gloss: È lontano?
    note: '*weit* significa lontano.'
  de.a1.unit10.lesson02.teach.zwei_minuten:
    title: Es ist nur zwei Minuten von hier.
    gloss: Dista solo due minuti da qui.
    note: '*nur* significa «solo» o «soltanto».'
  de.a1.unit10.lesson02.teach.nicht_verfehlen:
    title: Das können Sie nicht verfehlen.
    gloss: Non può sbagliarsi.
    note: '*verfehlen* significa «mancare» (non trovare): alla lettera «Questo può Lei non mancare».'
  de.a1.unit10.lesson03.teach.erste_strasse:
    title: Nehmen Sie die erste Straße links.
    gloss: Prenda la prima strada a sinistra.
    note: '*erste* significa «primo»: è un numero ordinale e, davanti a un sostantivo, prende una desinenza.'
  de.a1.unit10.lesson03.teach.zweite_strasse:
    title: Nehmen Sie die zweite Straße rechts.
    gloss: Prenda la seconda strada a destra.
    note: '*zweite* significa «seconda».'
  de.a1.unit10.lesson03.teach.route_text:
    title: Wegbeschreibung zur Apotheke
    gloss: Indicazioni per la farmacia
    note: Una breve serie di indicazioni scritte che combina diverse espressioni già imparate.
  de.a1.unit10.lesson04.teach.line01:
    title: Felix chiede la strada
    gloss: 'Felix: Scusi, come arrivo in banca?'
    note: Lo stesso modo cortese di cominciare dell'Unità 9, ora per chiedere un percorso e non solo un luogo.
  de.a1.unit10.lesson04.teach.line02:
    title: Anna indica il percorso
    gloss: 'Anna: Vada dritto, poi giri a sinistra all''angolo.'
    note: Una risposta completa unisce due indicazioni con *dann*.
  de.a1.unit10.lesson04.teach.line03:
    title: Felix conferma e chiede ancora
    gloss: 'Felix: A sinistra all''angolo, bene. È lontano?'
    note: Felix ripete l'indicazione per confermare di aver capito, poi fa una domanda naturale.
  de.a1.unit10.lesson04.teach.line04:
    title: Anna risponde sulla distanza
    gloss: 'Anna: No, è a soli due minuti da qui. Non può sbagliarsi.'
    note: Una risposta completa e rassicurante.
