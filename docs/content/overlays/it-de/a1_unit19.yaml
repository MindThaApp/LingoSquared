  de.a1.unit19.lesson01.teach.zimmer:
    title: Zimmer
    gloss: stanza
    note: '*Zimmer* può indicare una stanza di una casa o una camera d''albergo.'
    example_gloss: L'appartamento ha due stanze.
  de.a1.unit19.lesson01.teach.kueche:
    title: Küche
    gloss: cucina
    note: '*Küche* è la stanza dove si cucina.'
    example_gloss: La cucina è luminosa.
  de.a1.unit19.lesson01.teach.bad:
    title: Bad
    gloss: bagno
    note: '*Bad* è la parola breve e comune per «bagno».'
    example_gloss: Il bagno è piccolo.
  de.a1.unit19.lesson01.teach.hell:
    title: hell
    gloss: luminoso
    note: '*hell* descrive una stanza con buona luce.'
    example_gloss: Il mio appartamento è luminoso.
  de.a1.unit19.lesson02.teach.wohnzimmer:
    title: Wohnzimmer
    gloss: soggiorno
    note: '*Wohnzimmer* significa letteralmente «stanza in cui si vive».'
    example_gloss: Il tavolo è in soggiorno.
  de.a1.unit19.lesson02.teach.tisch:
    title: Tisch
    gloss: tavolo
    note: '*Tisch* è maschile: *der Tisch*.'
    example_gloss: C'è un tavolo.
  de.a1.unit19.lesson02.teach.stuhl:
    title: Stuhl
    gloss: sedia
    note: '*Stuhl* è la sedia.'
    example_gloss: C'è una sedia.
  de.a1.unit19.lesson02.teach.es_gibt:
    title: Es gibt einen Tisch.
    gloss: C'è un tavolo.
    note: '*Es gibt* è l''espressione di base per «c''è / ci sono».'
    example_gloss: In soggiorno c'è un tavolo.
  de.a1.unit19.lesson02.teach.steht:
    title: Der Tisch steht im Wohnzimmer.
    gloss: Il tavolo è in soggiorno.
    note: Per dire dove si trova un mobile, il tedesco usa spesso *steht* (letteralmente «sta in piedi»), mentre l'italiano usa di solito «è».
  de.a1.unit19.lesson02.teach.home_text:
    title: Wohnung in Berlin
    gloss: appartamento a Berlino
    note: La breve descrizione indica dove si trova l'appartamento, le stanze e i mobili.
    example_gloss: Il mio appartamento è a Berlino.
  de.a1.unit19.lesson02.teach.line01:
    title: Felix chiede dell'appartamento
    gloss: 'Felix: Com''è il Suo appartamento, Anna?'
    note: La forma di cortesia *Ihre* corrisponde a *Sie*.
    example_gloss: Com'è il Suo appartamento?
  de.a1.unit19.lesson02.teach.line02:
    title: Anna descrive le stanze
    gloss: 'Anna: Il mio appartamento è piccolo ma luminoso. Ha due stanze, una cucina e un bagno.'
    note: 'Anna indica la grandezza, la luminosità e il numero di stanze. Qui *Sie hat* significa «ha»: *Sie* si riferisce a *die Wohnung*.'
    example_gloss: Ha due stanze.
  de.a1.unit19.lesson02.teach.line03:
    title: Felix chiede dei mobili
    gloss: 'Felix: C''è un tavolo?'
    note: '*Gibt es...?* serve a chiedere se qualcosa esiste.'
  de.a1.unit19.lesson02.teach.line04:
    title: Anna dice dove si trova il tavolo
    gloss: 'Anna: Sì, il tavolo è in soggiorno.'
    note: La risposta indica dove si trova il mobile.
    example_gloss: Il tavolo è in soggiorno.
