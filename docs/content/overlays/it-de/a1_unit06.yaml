    gloss: Ho due sorelle.
    note: '*Schwestern* è il plurale di *Schwester*.'
  de.a1.unit06.lesson03.teach.haben_sie_geschwister:
    title: Haben Sie Geschwister?
    gloss: Ha fratelli o sorelle? (formale)
    note: '*Geschwister* indica fratelli e sorelle insieme: il tedesco ha un''unica parola di uso comune per dirlo.'
  de.a1.unit06.lesson03.teach.nein_einzelkind:
    title: Nein, ich habe keine Geschwister. Ich bin Einzelkind.
    gloss: No, non ho fratelli né sorelle. Sono figlio unico / figlia unica.
    note: '*keine* = ''nessuno/a''. *Einzelkind* = ''figlio unico / figlia unica'': qui il tedesco non usa l''articolo: *Ich bin Einzelkind*.'
