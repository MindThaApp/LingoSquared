  de.a1.unit06.lesson04.teach.line02:
    title: Anna presenta i suoi genitori
    gloss: 'Anna dice: Sì. Questa è mia madre e questo è mio padre.'
  de.a1.unit06.lesson04.teach.line03:
    title: Felix chiede chi sia una persona
    gloss: 'Felix dice: Chi è?'
  de.a1.unit06.lesson04.teach.line04:
    title: Anna presenta sua sorella
    gloss: 'Anna dice: Questa è mia sorella. Mia sorella è insegnante.'
    note: 'Davanti a un mestiere il tedesco non usa l''articolo: *Meine Schwester ist Lehrerin* = ''Mia sorella è insegnante.'' *Lehrerin* è la forma femminile di *Lehrer*.'
  de.a1.unit06.lesson04.teach.line05:
    title: Felix chiede dei fratelli
    gloss: 'Felix dice: Ha dei fratelli?'
    note: '*Brüder* è il plurale di *Bruder*.'
  de.a1.unit06.lesson04.teach.line06:
    title: Anna risponde
