  de.a1.unit06.lesson02.teach.meine_mutter:
    title: meine Mutter
    gloss: mia madre
    note: '*Mutter* è femminile, quindi «mia» diventa *meine*. Il possessivo si accorda con il genere del sostantivo posseduto, non con quello del possessore.'
  de.a1.unit06.lesson02.teach.sein_bruder:
    title: sein Bruder
    gloss: suo fratello
    note: '*sein* = «suo» (di lui). Stessa regola: un sostantivo maschile vuole *sein* (*sein Bruder*), uno femminile vuole *seine* (*seine Schwester*).'
  de.a1.unit06.lesson02.teach.ihr_vater_formal:
    title: Ihr Vater
    gloss: suo padre (forma di cortesia)
    note: '*Ihr* con la maiuscola = «Suo» di cortesia, in accordo con *Sie*. I sostantivi maschili vogliono *Ihr* (*Ihr Vater*); quelli femminili vogliono *Ihre* (*Ihre Mutter*).'
  de.a1.unit06.lesson02.teach.wer_ist_ihr_vater:
    title: Wer ist Ihr Vater?
    gloss: Chi è Suo padre? (forma di cortesia)
    note: '*Wer* = «chi».'
  de.a1.unit06.lesson03.teach.das_ist_mein_bruder:
    title: Das ist mein Bruder.
    gloss: Questo è mio fratello.
    note: '*Das ist...* = «Questo è...» o «Quello è...»: il modo più semplice per presentare qualcuno.'
  de.a1.unit06.lesson03.teach.er_ist_zwanzig:
    title: Er ist zwanzig Jahre alt.
    gloss: Ha vent'anni.
    note: '*Er* = «lui». Per l''età si usa lo stesso schema visto nell''Unità 3: numero + *Jahre alt*.'
