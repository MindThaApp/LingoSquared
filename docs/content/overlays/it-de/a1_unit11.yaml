    gloss: andare a dormire / andare a letto
    note: '*schlafen gehen* indica l''andare a letto per la notte.'
    example_gloss: 'Nel contesto: Vado a letto alle dieci.'
  de.a1.unit11.lesson01.teach.dann:
    title: Dann frühstücke ich.
    gloss: Poi faccio colazione.
    note: 'Dopo *dann* il verbo viene subito dopo, prima del soggetto: *Dann frühstücke ich*, non *Dann ich frühstücke*. In italiano invece si può dire «Poi io faccio colazione».'
  de.a1.unit11.lesson02.teach.wann_stehen_sie_auf:
    title: Wann stehen Sie auf?
    gloss: A che ora si alza?
    note: Domanda formale con *Sie*; il prefisso separabile *auf* resta alla fine.
