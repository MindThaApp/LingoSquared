teaching:
  de.a1.unit21.lesson01.teach.kleidung:
    title: Kleidung
    gloss: abbigliamento
    note: '*Kleidung* è una parola generale per i vestiti.'
    example_gloss: Compro dei vestiti.
  de.a1.unit21.lesson01.teach.hemd:
    title: Hemd
    gloss: camicia
    note: '*Hemd* è una camicia, spesso con i bottoni.'
    example_gloss: Cerco una camicia.
  de.a1.unit21.lesson01.teach.hose:
    title: Hose
    gloss: pantaloni
    note: In italiano «pantaloni» è plurale, mentre *Hose* in tedesco è singolare e indica un paio di pantaloni.
    example_gloss: Cerco dei pantaloni.
  de.a1.unit21.lesson01.teach.jacke:
    title: Jacke
    gloss: giacca
    note: 'In *Jacke* la j si pronuncia come la i di «ieri»: la parola suona più o meno «iàcke».'
    example_gloss: La giacca è calda.
  de.a1.unit21.lesson01.teach.suche:
    title: Ich suche ein Hemd.
    gloss: Cerco una camicia.
    note: '*suche* è utile nei negozi: cerco.'
    example_gloss: Cerco una giacca.
  de.a1.unit21.lesson02.teach.groesse:
    title: Größe
    gloss: taglia
    note: '*Größe* indica la taglia dei vestiti.'
    example_gloss: Taglia M, per favore.
  de.a1.unit21.lesson02.teach.blau:
    title: blau
    gloss: blu
    note: Per chiedere un colore, in tedesco si può dire *in Blau* (letteralmente «in blu»), come in italiano «in blu».
    example_gloss: Cerco una camicia blu.
  de.a1.unit21.lesson02.teach.rot:
    title: rot
    gloss: rosso
    note: '*rot* significa rosso.'
    example_gloss: La giacca è rossa.
  de.a1.unit21.lesson02.teach.passt:
    title: Das Hemd passt.
    gloss: La camicia va bene.
    note: '*passt* significa «sta bene / calza» quando si parla di vestiti.'
    example_gloss: 'Nel contesto: Sì, la camicia va bene.'
  de.a1.unit21.lesson02.teach.request:
    title: Ich suche ein Hemd in Blau, Größe M.
    gloss: Cerco una camicia blu, taglia M.
    note: La richiesta indica capo, colore e taglia.
  de.a1.unit21.lesson02.teach.label:
    title: Kleidungsetikett
    gloss: etichetta del capo
    note: Un'etichetta può indicare colore, taglia e prezzo.
    example_gloss: 'Colore: blu. Taglia: M.'
  de.a1.unit21.lesson02.teach.line01:
    title: Il commesso chiede
    gloss: 'Commesso: Buongiorno. Che cosa cerca?'
    note: Un commesso chiede al cliente che cosa cerca.
    example_gloss: Che cosa cerca?
  de.a1.unit21.lesson02.teach.line02:
    title: Felix indica capo, colore e taglia
    gloss: 'Felix: Cerco una camicia blu, taglia M.'
    note: Felix dà tutte e tre le informazioni richieste.
  de.a1.unit21.lesson02.teach.line03:
    title: Il commesso la propone
    gloss: 'Commesso: Ecco a Lei. Desidera comprarla?'
    note: Il *Sie* di cortesia mantiene educato lo scambio in negozio.
    example_gloss: Desidera comprarla?
  de.a1.unit21.lesson02.teach.line04:
    title: Felix controlla la taglia e chiede il prezzo
    gloss: 'Felix: Sì, la camicia va bene. Quanto costa?'
    note: Felix dice che la camicia gli va bene e chiede il prezzo.
    example_gloss: 'Nel contesto: Sì, la camicia va bene.'
