  de.a1.unit56.lesson06.ninas_vogel:
    title: L'uccellino di Nina
teaching:
  de.a1.unit56.lesson01.teach.das_tier_das:
    title: Animale, animale domestico
    gloss: l'animale / un animale domestico
    note: '*Tier* è la parola generica per «animale»; *Haustier* (letteralmente «animale di casa») indica in particolare un animale domestico.'
    example_gloss:
    - Il cane è un animale.
    - Il cane è anche un animale domestico.
  de.a1.unit56.lesson01.teach.der_hund_die:
    title: Cane e gatto
    gloss: il cane / il gatto
    example_gloss:
    - Anna ha un cane.
    - Jonas ha un gatto.
  de.a1.unit56.lesson01.teach.der_fisch_der:
    title: Pesce e uccello
    gloss: il pesce / l'uccello
    example_gloss:
    - Il nonno ha un pesce.
    - Nina ha un uccellino.
  de.a1.unit56.lesson01.teach.hast_du_ein:
    title: Hai un animale domestico?
    gloss: Hai un animale domestico?
    note: 'È lo stesso schema di domanda *Hast du ...?* già visto nelle unità precedenti: il verbo viene per primo.'
  de.a1.unit56.lesson01.teach.ja_ich_habe:
    title: Sì, ho un cane
    gloss: Sì, ho un cane.
    note: Una semplice risposta affermativa con il lessico nuovo di questa unità.
  de.a1.unit56.lesson01.teach.nein_ich_habe:
    title: No, non ho un animale domestico
    gloss: No, non ho un animale domestico.
    note: '*Kein* nega il nome *ein Haustier*: vedi la nota di grammatica.'
  de.a1.unit56.lesson01.teach.kein_sagt_nein:
    title: 'Kein: negare un nome'
    gloss: 'Kein dice «no» a un nome che avrebbe ein-: Ich habe einen Hund, ma Ich habe kein Haustier.'
    note: '*Kein* sostituisce *ein* nella frase negativa e prende le stesse desinenze: ein Haustier diventa kein Haustier, einen Hund diventa keinen Hund. Per verbi e aggettivi si usa invece *nicht*.'
  de.a1.unit56.lesson02.teach.ausfuehren:
    title: Portare a spasso (un animale)
    gloss: portare a spasso (un animale)
    note: 'Un verbo separabile: vedi la nota di grammatica.'
    example_gloss: Porto a spasso il cane ogni giorno.
  de.a1.unit56.lesson02.teach.ausfuehren_ist_trennbar:
    title: Ausführen è separabile
    gloss: 'Ausführen è separabile, proprio come aufstehen: ich führe den Hund aus.'
    note: È lo stesso schema dei verbi separabili (radice + ... + prefisso alla fine) già visto con i verbi della routine quotidiana.
  de.a1.unit56.lesson02.teach.futter_geben:
    title: Dare da mangiare
    gloss: dare da mangiare
    example_gloss: Do da mangiare al gatto ogni giorno.
  de.a1.unit56.lesson02.teach.spielen_mit:
    title: Giocare con
    gloss: giocare con
    example_gloss: Jonas gioca con il suo gatto.
  de.a1.unit56.lesson02.teach.ich_fuehre_den:
    title: Porto a spasso il cane ogni giorno
    gloss: Porto a spasso il cane ogni giorno.
    note: Unisce *ausführen* a *jeden Tag* (ogni giorno). *Jeden* termina in -en perché Tag è maschile e si trova all'accusativo.
  de.a1.unit56.lesson02.teach.ich_gebe_der:
    title: Do da mangiare al gatto ogni giorno
    gloss: Do da mangiare al gatto ogni giorno.
    note: 'Unisce *Futter geben* a *jeden Tag*. L''animale è al dativo: der Katze (al gatto).'
  de.a1.unit56.lesson03.teach.den_plural_lernst:
    title: 'Plural: Hund -> Hunde'
    gloss: 'I plurali tedeschi variano: der Hund -> die Hunde, die Katze -> die Katzen, der Vogel -> die Vögel. Impara il plurale insieme a ogni nome.'
    note: I plurali tedeschi seguono schemi diversi; qui compaiono per la prima volta, con i nomi di animali come esempi.
  de.a1.unit56.lesson03.teach.hunde_katzen:
    title: Cani e gatti
    gloss: cani / gatti
    example_gloss:
    - Felix ama i cani.
    - Lena ama i gatti.
  de.a1.unit56.lesson03.teach.fische_voegel:
    title: Pesci e uccelli (plurale)
    gloss: pesci / uccelli
    example_gloss:
    - Adoro i pesci.
    - Il nonno adora gli uccelli.
  de.a1.unit56.lesson03.teach.ich_liebe_tiere:
    title: Adoro gli animali
    gloss: Adoro gli animali.
    note: '*Lieben* (amare) prende il complemento direttamente, senza preposizione: ich liebe Tiere.'
  de.a1.unit56.lesson03.teach.lena_liebt_katzen:
    title: Lena ama i gatti, ma non ha un animale domestico
    gloss: Lena ama i gatti, ma non ha un animale domestico.
    note: Prepara il contrasto su cui è costruita la lettura della lezione 5.
  de.a1.unit56.lesson04.teach.felix_hast_du:
    title: Felix chiede se ha un animale domestico
    gloss: 'Felix: Hai un animale domestico, Anna?'
  de.a1.unit56.lesson04.teach.anna_ja_ich:
    title: Anna ha un cane
    gloss: 'Anna: Sì, ho un cane.'
  de.a1.unit56.lesson04.teach.felix_wie_sieht:
    title: Felix chiede com'è
    gloss: 'Felix: Com''è?'
    note: 'Riprende la domanda *Wie sieht ... aus?* dell''unità sull''aspetto, ora riferita a un animale: wie sieht er aus?'
  de.a1.unit56.lesson04.teach.anna_er_hat:
    title: Anna descrive il suo cane
    gloss: 'Anna: Ha il pelo marrone ed è piccolo.'
    note: Riprende il lessico dei colori dei capelli e delle dimensioni dell'unità sull'aspetto fisico, ora per descrivere il pelo di un animale invece dei capelli di una persona.
  de.a1.unit56.lesson04.teach.bei_tieren_zaehlt:
    title: Er/ihn per gli animali
    gloss: 'Per gli animali conta il genere della parola: der Hund è er (lui), die Katze è sie (lei).'
    note: 'In tedesco i pronomi seguono il genere grammaticale del nome: der Hund -> er (accusativo: ihn), die Katze -> sie, das Tier -> es.'
  de.a1.unit56.lesson04.teach.felix_fuehrst_du:
    title: Felix chiede delle passeggiate
    gloss: 'Felix: Lo porti fuori ogni giorno?'
  de.a1.unit56.lesson04.teach.anna_ja_ich_2:
    title: Anna descrive la sua routine
    gloss: 'Anna: Sì, lo porto fuori ogni giorno e gli do da mangiare.'
  de.a1.unit56.lesson05.teach.felix_und_lena:
    title: Felix, Lena e Jonas parlano di animali
    gloss: 'Felix e Lena amano entrambi gli animali, ma nessuno dei due ha un animale domestico. Felix ama i cani e Lena ama i gatti. Jonas invece ha un animale domestico: un gatto. Gioca spesso con il suo gatto e gli dà da mangiare ogni giorno. Hai un animale domestico?'
    note: 'Contrappone l''amare gli animali all''averne davvero uno: è lo scopo comunicativo dell''obiettivo.'
    glosses:
      lieben: adorare / piacere molto
      beide: entrambi
      Tiere: animali
      beiden: entrambi
      Haustier: animale domestico
      Hunde: cani
      Katzen: gatti
      Katze: gatto
      spielt: gioca
      gibt: dà
      jeden: ogni / tutti
      Futter: cibo
  de.a1.unit56.lesson05.teach.jonas_spielt_oft:
    title: Jonas gioca spesso con il suo gatto
    gloss: Jonas gioca spesso con il suo gatto.
    note: '*Oft* di solito sta subito dopo il verbo: Jonas spielt oft mit seiner Katze.'
  de.a1.unit56.lesson05.teach.ich_liebe_hunde:
    title: Adoro i cani. Non ho un animale domestico.
    gloss: Adoro i cani. Non ho un animale domestico.
    note: Una risposta modello di due frasi, da riutilizzare per l'esercizio di scrittura dell'unità.
  de.a1.unit56.lesson06.teach.anna_nina_hast:
    title: Anna chiede a Nina
    gloss: 'Anna: Nina, hai anche tu un animale domestico?'
  de.a1.unit56.lesson06.teach.nina_ja_ich:
    title: Nina ha un uccellino di nome Pico
    gloss: 'Nina: Sì, ho un uccellino. Si chiama Pico.'
    note: '*Er heißt Pico* riprende il verbo *heißen* della primissima unità. Er si riferisce a der Vogel.'
  de.a1.unit56.lesson06.teach.felix_wie_schoen:
    title: Felix reagisce
    gloss: 'Felix: Che bello! Che cosa fai con lui ogni giorno?'
  de.a1.unit56.lesson06.teach.nina_ich_gebe:
    title: Nina gli dà da mangiare ogni giorno
    gloss: 'Nina: Gli do da mangiare ogni giorno.'
  de.a1.unit56.lesson06.teach.felix_ich_liebe:
    title: Anche Felix ama gli uccelli
    gloss: 'Felix: Anch''io amo gli uccelli.'
  de.a1.unit56.lesson06.teach.anna_schoen_dass:
    title: Anna conclude la conversazione
    gloss: 'Anna: Che bello che tutti e tre amiamo gli animali!'
    note: Chiude il cerchio sulle informazioni sugli animali dei tre personaggi di questa unità.
