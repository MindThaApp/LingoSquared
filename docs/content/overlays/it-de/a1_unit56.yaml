course:
  title: Tedesco A1
  description: 'Tedesco per principianti per parlare di animali domestici e animali comuni: nominarli, le cure di base (portare fuori, dare da mangiare, giocare), dire quali animali ami anche senza averne uno, e il plurale regolare tedesco.'
units:
