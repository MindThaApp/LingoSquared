teaching:
  de.a1.unit17.lesson01.teach.kopfschmerzen:
    title: Kopfschmerzen
    gloss: mal di testa
    note: '*Kopfschmerzen* è plurale nella forma, ma si usa per dire «un mal di testa».'
    example_gloss: Ho mal di testa.
  de.a1.unit17.lesson01.teach.bauchschmerzen:
    title: Bauchschmerzen
    gloss: mal di pancia
    note: '*Bauch* è la pancia; *Schmerzen* significa «dolori».'
    example_gloss: Ho mal di pancia.
  de.a1.unit17.lesson01.teach.hals:
    title: Hals
    gloss: gola / collo
    note: '*Hals* significa «gola» o «collo» a seconda del contesto.'
    example_gloss: Mi fa male la gola.
  de.a1.unit17.lesson01.teach.weh:
    title: Mein Kopf tut weh.
    gloss: Mi fa male la testa.
    note: 'In tedesco si dice che la parte del corpo «fa male» con un verbo separabile: *tut weh*.'
    example_gloss: Mi fa male la pancia.
  de.a1.unit17.lesson01.teach.mir_ist_schlecht:
    title: Mir ist schlecht.
    gloss: Mi sento male.
    note: 'Non tradurre parola per parola: *Mir ist schlecht* è l''espressione naturale per dire che si ha la nausea.'
    example_gloss: Mi sento male; ho mal di pancia.
  de.a1.unit17.lesson02.teach.brauchen_sie_hilfe:
    title: Brauchen Sie Hilfe?
    gloss: Ha bisogno di aiuto?
    note: Il *Sie* di cortesia rende la domanda formale.
  de.a1.unit17.lesson02.teach.ich_brauche:
    title: Ich brauche Wasser.
    gloss: Ho bisogno di acqua.
    note: '*brauche* significa «ho bisogno di», non «uso».'
    example_gloss: 'Nel contesto: Ho bisogno di acqua e di una pausa.'
  de.a1.unit17.lesson02.teach.pause:
    title: Pause
    gloss: pausa
    note: '*eine Pause* è un breve riposo o una breve interruzione.'
    example_gloss: Ho bisogno di una pausa.
  de.a1.unit17.lesson02.teach.health_instruction:
    title: Trinken Sie Wasser.
    gloss: Beva dell'acqua. Faccia una pausa.
    note: Il *Sie* di cortesia rende l'invito formale.
    example_gloss: Faccia una pausa.
  de.a1.unit17.lesson02.teach.gesundheit_text:
    title: Il problema di Anna
    gloss: il problema di Anna
    note: Il breve testo indica il sintomo e il bisogno immediato.
    example_gloss: Ha bisogno di acqua.
  de.a1.unit17.lesson02.teach.line01:
    title: Felix chiede come sta Anna
    gloss: 'Felix: Anna, sta bene?'
    note: Felix usa con Anna la forma di cortesia *Ihnen*.
  de.a1.unit17.lesson02.teach.line02:
    title: Anna dice qual è il problema
    gloss: 'Anna: No, ho mal di testa.'
    note: La risposta indica il sintomo in modo semplice.
  de.a1.unit17.lesson02.teach.line03:
    title: Felix offre aiuto
    gloss: 'Felix: Ha bisogno di aiuto?'
    note: Una semplice offerta di aiuto.
  de.a1.unit17.lesson02.teach.line04:
    title: Anna dice di cosa ha bisogno
    gloss: 'Anna: Sì, grazie. Ho bisogno di acqua e di una pausa.'
    note: La risposta dice *Ja, bitte* e indica i bisogni immediati.
    example_gloss: 'Nel contesto: Ho bisogno di acqua e di una pausa.'
