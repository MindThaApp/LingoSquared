teaching:
  de.a1.unit09.lesson01.teach.bank:
    title: Bank
    gloss: banca
    note: '*Bank* significa banca: è un sostantivo femminile, *die Bank*.'
    example_gloss: Devo andare in banca.
  de.a1.unit09.lesson01.teach.krankenhaus:
    title: Krankenhaus
    gloss: ospedale
    note: '*Krankenhaus* significa letteralmente «casa dei malati» -- sostantivo neutro, *das Krankenhaus*.'
    example_gloss: Il mio amico è in ospedale.
  de.a1.unit09.lesson01.teach.apotheke:
    title: Apotheke
    gloss: farmacia
    note: '*Apotheke* significa farmacia -- sostantivo femminile, *die Apotheke*.'
    example_gloss: Oggi la farmacia è aperta.
  de.a1.unit09.lesson01.teach.park:
    title: Park
    gloss: parco
    note: '*Park* significa parco -- sostantivo maschile, *der Park*.'
    example_gloss: Ci piace passeggiare nel parco.
  de.a1.unit09.lesson01.teach.restaurant:
    title: Restaurant
    gloss: ristorante
    note: '*Restaurant* significa ristorante -- sostantivo neutro, *das Restaurant*.'
    example_gloss: Questo ristorante ha un buon cibo.
  de.a1.unit09.lesson02.teach.neben:
    title: Die Apotheke ist neben dem Park.
    gloss: La farmacia è accanto al parco.
    note: '*neben* significa «accanto a». È una preposizione che può reggere due casi: per un luogo fisso (come qui) vuole il dativo, quindi *der Park* (maschile) diventa *dem Park*.'
  de.a1.unit09.lesson02.teach.gegenueber_von:
    title: Die Apotheke ist gegenüber vom Krankenhaus.
    gloss: La farmacia è di fronte all'ospedale.
    note: '*gegenüber von* significa «di fronte a». *vom* è la contrazione abituale di *von dem* (dativo neutro, *das Krankenhaus*), usata sia nel parlato sia nello scritto.'
  de.a1.unit09.lesson02.teach.zwischen:
    title: Die Apotheke ist zwischen der Bank und dem Park.
    gloss: La farmacia è tra la banca e il parco.
    note: '*zwischen* significa «tra». Nota le due forme di dativo: *der Bank* (femminile) e *dem Park* (maschile).'
  de.a1.unit09.lesson02.teach.hinter:
    title: Das Restaurant ist hinter der Bank.
    gloss: Il ristorante è dietro la banca.
    note: '*hinter* significa «dietro» -- *der Bank* è la forma del dativo femminile.'
  de.a1.unit09.lesson02.teach.vor:
    title: Der Park ist vor dem Krankenhaus.
    gloss: Il parco è davanti all'ospedale.
    note: '*vor* significa «davanti a» -- *dem Krankenhaus* è la forma del dativo neutro.'
  de.a1.unit09.lesson03.teach.wo_ist_die_bank:
    title: Wo ist die Bank?
    gloss: Dov'è la banca?
    note: '*Wo ist...?* è il modo standard per chiedere dove si trova qualcosa.'
  de.a1.unit09.lesson03.teach.sie_ist_neben:
    title: Sie ist neben dem Park.
    gloss: È accanto al parco.
    note: Qui *Sie* significa «lei/essa» (riferito a *die Bank*, femminile). Ha la maiuscola solo perché inizia la frase. Il verbo *ist* mostra che non è il «Lei» di cortesia, che richiederebbe *Sie sind*.
  de.a1.unit09.lesson03.teach.ist_es_weit:
    title: Ist es weit von hier?
    gloss: È lontano da qui?
    note: '*weit* significa lontano. Qui *es* è un soggetto generico che si riferisce alla situazione e non dipende dal genere di un sostantivo preciso.'
  de.a1.unit09.lesson03.teach.nicht_weit:
    title: Nein, es ist nicht weit.
    gloss: No, non è lontano.
    note: '*nicht* nega l''aggettivo *weit*.'
  de.a1.unit09.lesson04.teach.entschuldigung_wo:
    title: Entschuldigung, wo ist die Apotheke?
    gloss: Scusi, dov'è la farmacia?
    note: '*Entschuldigung* è già comparso nel senso di «scusi / scusa» -- qui apre educatamente una domanda.'
  de.a1.unit09.lesson04.teach.line01:
    title: Felix chiede la strada
    gloss: 'Felix dice: Scusi, dov''è la farmacia?'
    note: La stessa formula di apertura cortese della frase isolata qui sopra, ora in una vera conversazione.
  de.a1.unit09.lesson04.teach.line02:
    title: Anna indica dove si trova
    gloss: 'Anna dice: È di fronte all''ospedale.'
    note: Una risposta completa indica la posizione della farmacia rispetto a un punto di riferimento conosciuto.
  de.a1.unit09.lesson04.teach.line03:
    title: Felix chiede quanto è lontano
    gloss: 'Felix dice: È lontano da qui?'
    note: Una domanda successiva naturale, quando si conosce già la direzione generale.
  de.a1.unit09.lesson04.teach.line04:
    title: Anna risponde sulla distanza
    gloss: 'Anna dice: No, non è lontano. È tra la banca e il parco.'
    note: Una risposta completa rassicura sulla distanza, poi dà un secondo punto di riferimento più preciso.
