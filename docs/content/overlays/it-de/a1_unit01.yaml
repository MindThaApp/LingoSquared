teaching:
  de.a1.unit01.lesson01.teach.hallo:
    title: Hallo
    gloss: ciao
    note: '*Hallo* è un saluto informale e adatto a ogni momento della giornata, come l''italiano «ciao».'
    example_gloss: Ciao, Felix!
  de.a1.unit01.lesson01.teach.guten_morgen:
    title: Guten Morgen
    gloss: buongiorno
    note: '*Guten Morgen* si usa al mattino, più o meno fino a tarda mattinata.'
  de.a1.unit01.lesson01.teach.guten_tag:
    title: Guten Tag
    gloss: buongiorno
    note: '*Guten Tag* è il saluto standard, un po'' più formale, che si usa dalla tarda mattinata al pomeriggio.'
  de.a1.unit01.lesson01.teach.guten_abend:
    title: Guten Abend
    gloss: buonasera
    note: '*Guten Abend* si usa quando si arriva da qualche parte la sera: è un saluto di incontro, non di congedo.'
  de.a1.unit01.lesson02.teach.tschuss:
    title: Tschüss
    gloss: ciao (congedo)
    note: '*Tschüss* è un modo informale e molto comune di dire arrivederci tra amici e conoscenti.'
    example_gloss: Ciao, a presto!
  de.a1.unit01.lesson02.teach.auf_wiedersehen:
    title: Auf Wiedersehen
    gloss: arrivederci (formale)
    note: '*Auf Wiedersehen* significa letteralmente «finché ci rivedremo»: è il congedo standard e più formale, adatto con sconosciuti o in contesti professionali.'
  de.a1.unit01.lesson02.teach.bis_bald:
    title: Bis bald
    gloss: a presto
    note: '*Bis bald* è un modo cordiale di salutare quando si pensa di rivedere presto la persona.'
  de.a1.unit01.lesson02.teach.bis_spater:
    title: Bis später
    gloss: a dopo; a più tardi
    note: '*Bis später* si usa quando si rivedrà la persona più tardi nella stessa giornata.'
  de.a1.unit01.lesson02.teach.gute_nacht:
    title: Gute Nacht
    gloss: buonanotte
    note: '*Gute Nacht* si dice quando qualcuno va a dormire o finisce la giornata: a differenza di *Guten Abend*, è un congedo, non un saluto di incontro.'
  de.a1.unit01.lesson03.teach.sie:
    title: Sie
    gloss: Lei (forma di cortesia)
    note: '*Sie* è la forma di cortesia, simile al «Lei» italiano: si scrive sempre con l''iniziale maiuscola, anche in mezzo alla frase, e si usa con sconosciuti, persone più anziane o in situazioni formali e professionali.'
  de.a1.unit01.lesson03.teach.du:
    title: du
    gloss: tu
    note: '*du* è il «tu» informale, che si usa con amici, familiari e bambini. Dare del *du* a uno sconosciuto può sembrare troppo confidenziale o persino scortese.'
  de.a1.unit01.lesson03.teach.wie_geht_es_ihnen:
    title: Wie geht es Ihnen?
    gloss: Come sta? (formale)
    note: 'Il modo formale di chiedere come sta qualcuno: *Ihnen* è il dativo di cortesia e corrisponde al registro di *Sie*.'
  de.a1.unit01.lesson03.teach.wie_gehts:
    title: Wie geht's?
    gloss: Come va? (informale)
    note: '*Wie geht''s* è la forma contratta di *Wie geht es*: il modo informale di tutti i giorni per chiedere come sta qualcuno.'
  de.a1.unit01.lesson03.teach.gut_danke:
    title: Gut, danke.
    gloss: Bene, grazie.
    note: Una risposta semplice e neutra, adatta a entrambi i registri.
  de.a1.unit01.lesson03.teach.sehr_gut_danke:
    title: Sehr gut, danke.
    gloss: Molto bene, grazie.
    note: Una risposta più entusiasta di *Gut, danke.*
  de.a1.unit01.lesson03.teach.und_ihnen:
    title: Und Ihnen?
    gloss: E Lei? (formale)
    note: Il modo formale di rilanciare la domanda, in linea con il registro di *Sie*.
  de.a1.unit01.lesson03.teach.und_dir:
    title: Und dir?
    gloss: E tu? (informale)
    note: 'Il modo informale di rilanciare la domanda: *dir* è il dativo di *du* e corrisponde al registro del «tu».'
  de.a1.unit01.lesson04.teach.danke:
    title: Danke
    gloss: grazie
    note: '*Danke* è già comparso nelle risposte precedenti: qui è la parola da sola.'
    example_gloss: Grazie mille!
  de.a1.unit01.lesson04.teach.bitte:
    title: Bitte
    gloss: per favore / prego
    note: '*Bitte* ha davvero due significati comuni a seconda del contesto: «per favore» quando si chiede qualcosa, «prego» quando si risponde a un ringraziamento. Il contesto chiarisce quale dei due si intende: non è un caso né un errore, entrambi gli usi sono del tutto normali.'
    example_gloss:
    - Un caffè, per favore.
    - Prego, si figuri!
  de.a1.unit01.lesson04.teach.entschuldigung:
    title: Entschuldigung
    gloss: scusi / scusa
    note: '*Entschuldigung* si usa sia per attirare educatamente l''attenzione di qualcuno sia per scusarsi brevemente.'
    example_gloss: Scusi, dov'è il bagno?
  de.a1.unit01.lesson04.teach.kein_problem:
    title: Kein Problem
    gloss: nessun problema
    note: Una risposta informale e cordiale, simile nel tono all'italiano «nessun problema».
  de.a1.unit01.lesson04.teach.gern_geschehen:
    title: Gern geschehen
    gloss: prego / di nulla
    note: Un modo più completo ed esplicito di dire «prego» rispetto al più breve *Bitte*.
  de.a1.unit01.lesson05.teach.line01:
    title: Anna saluta Felix
    gloss: 'Anna dice: Buongiorno!'
    note: Anna e Felix si incontrano per la prima volta come vicini nel loro condominio.
  de.a1.unit01.lesson05.teach.line02:
    title: Felix ricambia il saluto e le chiede come sta
    gloss: 'Felix dice: Buongiorno! Come sta?'
    note: Felix usa il registro formale di *Sie* perché si sono appena conosciuti.
  de.a1.unit01.lesson05.teach.line03:
    title: Anna risponde e rilancia la domanda
    gloss: 'Anna dice: Bene, grazie. E Lei?'
    note: Anna risponde e rilancia la domanda in modo formale, in linea con il registro di Felix.
  de.a1.unit01.lesson05.teach.line04:
    title: Felix risponde
    gloss: 'Felix dice: Molto bene, grazie.'
    note: Una risposta un po' più entusiasta di un semplice *Gut, danke.*
  de.a1.unit01.lesson05.teach.line05:
    title: Anna saluta prima di andare
    gloss: 'Anna dice: Arrivederci!'
    note: Anna usa il congedo più formale, coerente con il registro di *Sie* usato finora.
  de.a1.unit01.lesson05.teach.line06:
    title: Felix saluta e dice a presto
    gloss: 'Felix dice: Arrivederci, a presto!'
    note: Felix unisce il congedo formale a «a presto», restando coerente con il registro di *Sie* usato da entrambi in questo primo incontro.
