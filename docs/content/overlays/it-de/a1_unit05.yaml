teaching:
  de.a1.unit05.lesson01.teach.wie_spaet:
    title: Wie spät ist es?
    gloss: Che ore sono?
    note: Letteralmente «Quanto tardi è?» -- il modo standard per chiedere l'ora.
  de.a1.unit05.lesson01.teach.drei_uhr:
    title: Es ist drei Uhr.
    gloss: Sono le tre.
    note: '*Uhr* = «ore». Le ore intere si dicono con il numero + *Uhr*.'
  de.a1.unit05.lesson01.teach.halb_vier:
    title: halb vier = 3:30
    gloss: Sono le tre e mezza (3:30).
    note: 'Il tedesco indica la mezz''ora con l''ora verso cui si va: *halb vier* = «mezza (verso le) quattro» = 3:30, non 4:30. In italiano invece si dice «le tre e mezza», cioè con l''ora appena passata.'
  de.a1.unit05.lesson01.teach.fuenf_uhr:
    title: Es ist fünf Uhr.
    gloss: Sono le cinque.
  de.a1.unit05.lesson02.teach.viertel_nach:
    title: Es ist Viertel nach drei.
    gloss: Sono le tre e un quarto (3:15).
    note: '*Viertel* = «quarto»; *nach* = «dopo».'
  de.a1.unit05.lesson02.teach.viertel_vor:
    title: Es ist Viertel vor vier.
    gloss: Sono le quattro meno un quarto (3:45).
    note: '*vor* = «prima di / meno».'
  de.a1.unit05.lesson02.teach.zehn_nach:
    title: Es ist zehn nach vier.
    gloss: Sono le quattro e dieci (4:10).
    note: Minuti + *nach* + ora, come in italiano «le quattro e dieci»; in tedesco però si dice letteralmente «dieci dopo quattro».
  de.a1.unit05.lesson02.teach.zehn_vor:
    title: Es ist zehn vor fünf.
    gloss: Sono le cinque meno dieci (4:50).
    note: Minuti + *vor* + l'ora successiva, come in italiano «le cinque meno dieci»; in tedesco si dice letteralmente «dieci prima di cinque».
  de.a1.unit05.lesson03.teach.morgen:
    title: Morgen
    gloss: mattina
    note: '*Morgen* è il sostantivo per «mattina», all''incirca dalle 6 alle 12.'
    example_gloss: Buongiorno, Felix!
  de.a1.unit05.lesson03.teach.mittag:
    title: Mittag
    gloss: mezzogiorno
    note: '*Mittag* è proprio il mezzogiorno, il punto di mezzo tra Morgen e Nachmittag.'
    example_gloss: È mezzogiorno.
  de.a1.unit05.lesson03.teach.nachmittag:
    title: Nachmittag
    gloss: pomeriggio
    note: '*Nachmittag* copre all''incirca dalle 12 alle 18.'
    example_gloss: Lavoro il pomeriggio.
  de.a1.unit05.lesson03.teach.abend:
    title: Abend
    gloss: sera
    note: '*Abend* copre all''incirca dalle 18 alle 22.'
    example_gloss: Buonasera, Anna!
  de.a1.unit05.lesson03.teach.nacht:
    title: Nacht
    gloss: notte
    note: '*Nacht* copre all''incirca dalle 22 alle 6.'
    example_gloss: Buonanotte, Felix!
  de.a1.unit05.lesson03.teach.mitternacht:
    title: Mitternacht
    gloss: mezzanotte
    note: '*Mitternacht* corrisponde esattamente alle 0 Uhr, cioè alle 24:00.'
    example_gloss: La festa finisce a mezzanotte.
  de.a1.unit05.lesson03.teach.achtzehn:
    title: achtzehn
    gloss: diciotto
    note: '*achtzehn* = 18, usato qui con il formato 24 ore per gli orari ufficiali (achtzehn Uhr = le 18:00).'
    example_gloss: Il negozio chiude alle 18:00.
  de.a1.unit05.lesson03.teach.laden_oeffnet:
    title: Der Laden öffnet um neun Uhr morgens.
    gloss: Il negozio apre alle nove del mattino.
    note: '*um* + ora = «alle» una certa ora; *morgens* = «di mattina».'
  de.a1.unit05.lesson03.teach.laden_schliesst:
    title: Der Laden schließt um achtzehn Uhr.
    gloss: Il negozio chiude alle 18:00.
    note: '*schließt* = «chiude». Gli orari di apertura ufficiali usano il formato 24 ore.'
  de.a1.unit05.lesson04.teach.wann:
    title: Wann
    gloss: quando
    note: '*Wann* introduce una domanda sul tempo.'
    example_gloss: Quando viene?
  de.a1.unit05.lesson04.teach.oeffnet_die:
    title: öffnet die
    gloss: apre la
    note: '*öffnet* è la terza persona singolare di *öffnen* (aprire); *die* è l''articolo determinativo femminile/plurale, concordato con *die Bibliothek*.'
    example_gloss: Quando apre la biblioteca?
  de.a1.unit05.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: biblioteca
    note: '*Bibliothek* è un sostantivo femminile (*die Bibliothek*), lo stesso luogo già visto nell''Unità 4.'
    example_gloss: Vado in biblioteca.
  de.a1.unit05.lesson04.teach.sie_pronomen:
    title: sie
    gloss: lo / la / li / le / lei / loro (minuscolo)
    note: Qui *sie* è il pronome di terza persona che sostituisce il sostantivo femminile *die Bibliothek* -- «la», da non confondere con *Sie* maiuscolo (il «Lei» di cortesia), che Anna e Felix usano tra loro.
    example_gloss: Mi piace la biblioteca. La frequento spesso.
  de.a1.unit05.lesson04.teach.dann:
    title: dann
    gloss: poi
    note: '*dann* è usato qui nel saluto *Bis dann!* («a dopo!»).'
    example_gloss: A dopo!
  de.a1.unit05.lesson04.teach.line01:
    title: Felix chiede della biblioteca
    gloss: 'Felix dice: A che ora apre la biblioteca?'
  de.a1.unit05.lesson04.teach.line02:
    title: Anna risponde
    gloss: 'Anna dice: Apre alle nove del mattino.'
    note: '*Sie* qui significa «essa» e si riferisce a *die Bibliothek*; ha la maiuscola solo perché è all''inizio della frase.'
  de.a1.unit05.lesson04.teach.line03:
    title: Felix fa un'altra domanda
    gloss: 'Felix dice: E a che ora chiude?'
  de.a1.unit05.lesson04.teach.line04:
    title: Anna risponde di nuovo
    gloss: 'Anna dice: Chiude alle 18:00.'
  de.a1.unit05.lesson04.teach.line05:
    title: Felix saluta
    gloss: 'Felix dice: Bene, a dopo!'
  de.a1.unit05.lesson04.teach.schild:
    title: Un cartello sulla porta
    gloss: 'Orari di apertura: dalle 9:00 alle 18:00.'
    note: '*Öffnungszeiten* = «orari di apertura»; *bis* = «fino a».'
