teaching:
  de.a1.unit03.lesson01.teach.null_bis_vier:
    title: null, eins, zwei, drei, vier
    gloss: zero, uno, due, tre, quattro
    note: Le cifre tedesche da 0 a 4.
    example_gloss:
    - Ho zero mele.
    - Sono il numero uno!
    - Ho due mele.
    - Ho tre mele.
    - Ho quattro mele.
  de.a1.unit03.lesson01.teach.fuenf_bis_zehn:
    title: fünf, sechs, sieben, acht, neun, zehn
    gloss: cinque, sei, sette, otto, nove, dieci
    note: I numeri tedeschi da 5 a 10.
    example_gloss:
    - Ho cinque mele.
    - Ho sei mele.
    - Ho sette mele.
    - Ho otto mele.
    - Ho nove mele.
    - Ho dieci mele.
  de.a1.unit03.lesson02.teach.elf_zwoelf:
    title: elf, zwölf
    gloss: undici, dodici
    note: '*elf* e *zwölf* sono irregolari, come in italiano «undici» e «dodici»: non seguono lo schema dei numeri da 13 in poi.'
    example_gloss:
    - Il mio numero civico è l'undici.
    - Il mio numero civico è il dodici.
  de.a1.unit03.lesson02.teach.dreizehn_bis_sechzehn:
    title: dreizehn, vierzehn, fünfzehn, sechzehn
    gloss: tredici, quattordici, quindici, sedici
    note: 'Dal 13 in poi i numeri tedeschi si formano con la cifra di base + *-zehn* (come *-teen* in inglese e -dici in italiano). Attenzione: *sechzehn*, non *sechszehn*: la *s* cade.'
    example_gloss:
    - Il mio numero civico è il tredici.
    - Il mio numero civico è il quattordici.
    - Il mio numero civico è il quindici.
    - Il mio numero civico è il sedici.
  de.a1.unit03.lesson02.teach.siebzehn_bis_zwanzig:
    title: siebzehn, achtzehn, neunzehn, zwanzig
    gloss: diciassette, diciotto, diciannove, venti
    note: 'Attenzione: *siebzehn*, non *siebenzehn*: la desinenza *-en* di *sieben* cade prima di *-zehn*.'
    example_gloss:
    - Il mio numero civico è il diciassette.
    - Il mio numero civico è il diciotto.
    - Il mio numero civico è il diciannove.
    - Il mio numero civico è il venti.
  de.a1.unit03.lesson03.teach.dreissig_bis_fuenfzig:
    title: dreißig, vierzig, fünfzig
    gloss: trenta, quaranta, cinquanta
    note: 'Attenzione: *dreißig*, non *dreizig*: il 30 termina in *-ßig* invece che in *-zig* (anche 20, *zwanzig*, è irregolare).'
    example_gloss:
    - Costa trenta euro.
    - Costa quaranta euro.
    - Costa cinquanta euro.
  de.a1.unit03.lesson03.teach.sechzig_bis_neunzig:
    title: sechzig, siebzig, achtzig, neunzig
    gloss: sessanta, settanta, ottanta, novanta
    note: 'Da 40 in poi lo schema è regolare: cifra + *-zig* (con le stesse abbreviazioni *sech-* e *sieb-* dei numeri da 13 a 19).'
    example_gloss:
    - Costa sessanta euro.
    - Costa settanta euro.
    - Costa ottanta euro.
    - Costa novanta euro.
  de.a1.unit03.lesson03.teach.hundert:
    title: hundert
    gloss: cento
    note: '*hundert* da solo significa «cento»: non serve *ein* davanti (*einhundert* è possibile, ma meno comune nel parlato quotidiano).'
    example_gloss: Costa cento euro.
  de.a1.unit03.lesson03.teach.einundzwanzig:
    title: einundzwanzig
    gloss: ventuno
    note: 'In tedesco i numeri composti da 21 a 99 si formano al contrario rispetto all''italiano: unità + *und* («e») + decina, tutto in UNA parola. *einundzwanzig* = *ein* (uno) + *und* (e) + *zwanzig* (venti), cioè letteralmente «uno-e-venti».'
  de.a1.unit03.lesson03.teach.zweiunddreissig:
    title: zweiunddreißig
    gloss: trentadue
    note: 'Stesso schema: *zwei* (due) + *und* + *dreißig* (trenta) = «due-e-trenta» = 32.'
  de.a1.unit03.lesson04.teach.wie_alt_sind_sie:
    title: Wie alt sind Sie?
    gloss: Quanti anni ha? (formale)
    note: '*alt* significa «vecchio»: la domanda è letteralmente «quanto vecchio sei / è Lei?». In italiano invece si chiede «quanti anni hai?».'
  de.a1.unit03.lesson04.teach.wie_alt_bist_du:
    title: Wie alt bist du?
    gloss: Quanti anni hai? (informale)
    note: La versione informale, con *du*.
  de.a1.unit03.lesson04.teach.ich_bin_jahre_alt:
    title: Ich bin achtundzwanzig Jahre alt.
    gloss: Ho ventotto anni.
    note: '*Jahre alt* («anni») segue sempre il numero. In tedesco l''età si esprime con il verbo «essere» (letteralmente «sono 28 anni vecchio»), non con «avere» come in italiano.'
  de.a1.unit03.lesson05.teach.line01:
    title: Felix chiede l'età ad Anna
    gloss: 'Felix dice: Quanti anni ha, se posso chiederlo?'
    note: '*wenn ich fragen darf* («se posso chiedere») attenua una domanda che altrimenti potrebbe sembrare un po'' diretta: un tocco di cortesia adatto al loro registro formale con *Sie*.'
  de.a1.unit03.lesson05.teach.line02:
    title: Anna risponde e ricambia la domanda
    gloss: 'Anna dice: Ho ventotto anni. E Lei?'
    note: Anna dice la sua età e ricambia la domanda, seguendo lo schema dell'Unità 2.
  de.a1.unit03.lesson05.teach.line03:
    title: Felix risponde
    gloss: 'Felix dice: Ho trentun anni.'
    note: Questo conferma che Felix ha tre anni più di Anna.
