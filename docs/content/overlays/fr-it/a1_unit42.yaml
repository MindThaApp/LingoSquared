course:
  title: Italien A1
  description: 'Italien pour débutants afin de décrire l’apparence physique d’une personne : impressions de taille et d’âge, couleur des cheveux et des yeux, la question essentielle Com''è ? et la comparaison de l’apparence de deux personnes.'
units:
  it.a1.unit42.aspetto:
    title: Décrire l’apparence physique
lessons:
  it.a1.unit42.lesson01.alto_basso_anziano_e:
    title: Grand, petit, âgé et jeune
  it.a1.unit42.lesson02.descrivere_i_capelli:
    title: Décrire les cheveux
  it.a1.unit42.lesson03.gli_occhi_e_com:
    title: Les yeux et demander à quoi ressemble quelqu’un
  it.a1.unit42.lesson04.giulia_descrive_nina:
    title: Giulia décrit Nina
  it.a1.unit42.lesson05.luca_e_chiara_a:
    title: Comparer Luca et Chiara
  it.a1.unit42.lesson06.marco_riconosce_nina:
    title: Marco reconnaît Nina
teaching:
  it.a1.unit42.lesson01.teach.alto_basso:
    title: Grand et petit
    gloss: grand / petit
    note: '*Alto* décrit une personne grande et *basso* une personne petite. Les adjectifs italiens s’accordent avec la personne : *alto/alta*, *basso/bassa*.'
    example_gloss:
    - Chiara est grande.
    - Luca est petit.
  it.a1.unit42.lesson01.teach.anziano_giovane:
    title: Âgé et jeune
    gloss: âgé / jeune
    note: '*Anziano* (âgé) et *giovane* (jeune) donnent une impression générale, pas un nombre d’années exact. *Giovane* se termine par -e : il est identique au masculin et au féminin.'
    example_gloss:
    - Grand-père est âgé.
    - Marco est jeune.
  it.a1.unit42.lesson01.teach.per_l_eta:
    title: 'L’âge : avere anni ou anziano'
    gloss: 'Pour dire l’âge exact, l’italien utilise avere + anni : Quanti anni hai ? Pour une impression générale, il utilise un adjectif : Il nonno è anziano.'
    note: 'Comme en français, l’italien dit « j’ai 30 ans » avec avere : *ho trent''anni*. L’adjectif *anziano* sert à dire l’âge que paraît quelqu’un.'
  it.a1.unit42.lesson01.teach.chiara_e_alta:
    title: Chiara est grande et Luca est petit
    gloss: Chiara est grande et Luca est petit.
    note: 'Deux adjectifs reliés par *e* (et). Chacun s’accorde avec sa personne : *alta* (féminin) et *basso* (masculin).'
  it.a1.unit42.lesson02.teach.i_capelli:
    title: Les cheveux
    gloss: les cheveux
    note: '*I capelli* est un pluriel en italien : on parle des cheveux comme de « les cheveux » au sens de plusieurs poils. Le singulier *il capello* désigne un seul cheveu.'
    example_gloss: Marco a les cheveux courts et noirs.
  it.a1.unit42.lesson02.teach.biondi_castani_grigi:
    title: Blond, châtain et gris
    gloss: blond / châtain / gris
    note: 'Trois couleurs de cheveux au masculin pluriel pour s’accorder avec *capelli* : *biondi*, *castani*, *grigi*. *Neri* (noirs) s’emploie aussi pour les cheveux.'
    example_gloss:
    - Giulia a les cheveux blonds.
    - Luca a les cheveux châtains.
    - Grand-père a les cheveux gris.
  it.a1.unit42.lesson02.teach.lunghi_corti:
    title: Cheveux longs et courts
    gloss: long / court (cheveux)
    note: '*Lunghi* (longs) et *corti* (courts) sont au pluriel comme *capelli*. Le mot *alto* (grand) ne s’emploie que pour les personnes, pas pour les cheveux.'
    example_gloss:
    - Chiara a les cheveux longs.
    - Luca a les cheveux courts.
  it.a1.unit42.lesson02.teach.i_capelli_sono:
    title: Capelli est un pluriel
    gloss: 'Capelli est au pluriel, donc l’adjectif l’est aussi : i capelli biondi, castani, grigi, neri, lunghi, corti.'
    note: 'L’adjectif se place après le nom et s’accorde en genre et en nombre : *capelli lunghi* (masculin pluriel), *occhi azzurri*.'
  it.a1.unit42.lesson02.teach.per_descrivere_una:
    title: Cheveux et yeux se construisent avec avere
    gloss: 'Pour décrire une personne, l’italien utilise avere avec les cheveux et les yeux : Giulia ha i capelli biondi e gli occhi azzurri.'
    note: 'Comme en français, l’article est nécessaire : *i capelli*, *gli occhi*. On peut dire aussi *è bionda*, mais *avere* est la construction à retenir ici.'
  it.a1.unit42.lesson02.teach.marco_ha_i:
    title: Marco a les cheveux courts et noirs
    gloss: Marco a les cheveux courts et noirs.
    note: '*Neri* (noirs) est au masculin pluriel, accordé avec *capelli*.'
  it.a1.unit42.lesson02.teach.giulia_ha_i:
    title: Giulia a les cheveux longs et blonds
    gloss: Giulia a les cheveux longs et blonds.
    note: Combine le vocabulaire de la longueur et de la couleur de cette leçon dans une phrase naturelle.
  it.a1.unit42.lesson03.teach.gli_occhi:
    title: Les yeux
    gloss: les yeux
    note: '*Occhio* (œil) est masculin ; le pluriel est *occhi* et prend *gli* parce qu’il commence par une voyelle.'
    example_gloss: Marco a les yeux marron.
  it.a1.unit42.lesson03.teach.azzurri_marroni_verdi:
    title: Bleu, marron et vert
    gloss: bleu / marron / vert
    note: 'Couleurs des yeux : *azzurri* (bleus), *marroni* (marron), *verdi* (verts). Ces formes plurielles valent pour les deux genres.'
    example_gloss:
    - Giulia a les yeux bleus.
    - Luca a les yeux marron.
    - Chiara a les yeux verts.
  it.a1.unit42.lesson03.teach.anche_gli_occhi:
    title: Les couleurs s’accordent au pluriel
    gloss: 'Les couleurs des yeux se mettent au pluriel pour s’accorder avec occhi : occhi azzurri, marroni, verdi.'
    note: 'Les adjectifs qui se terminent par -e au singulier (*verde*, *marrone*) se terminent par -i au pluriel : *verdi*, *marroni*.'
  it.a1.unit42.lesson03.teach.com_e_giulia:
    title: Comment est Giulia ?
    gloss: Comment est Giulia ?
    note: '*Com''è?* est la question de base pour l’apparence. *Com''è* vient de *come è*, avec une apostrophe à la place du e supprimé.'
  it.a1.unit42.lesson03.teach.giulia_ha_i:
    title: Giulia a les cheveux longs et blonds et les yeux bleus
    gloss: Giulia a les cheveux longs et blonds et les yeux bleus.
    note: 'Une réponse modèle : *avere* + cheveux + *e* + yeux dans une seule phrase.'
  it.a1.unit42.lesson04.teach.giulia_al_caffe:
    title: Giulia présente Nina
    gloss: 'Giulia : Une nouvelle fille vient au café linguistique. Elle s’appelle Nina.'
    note: '*Viene* (vient) introduit une nouvelle personne. *Si chiama* signifie « elle s’appelle », littéralement « elle se nomme ».'
  it.a1.unit42.lesson04.teach.marco_va_bene:
    title: Marco demande à quoi elle ressemble
    gloss: 'Marco : D’accord ! Comment est-elle ?'
    note: 'La même question à nouveau, sans nom : le sujet est clair grâce au contexte.'
  it.a1.unit42.lesson04.teach.giulia_e_bassa:
    title: Giulia décrit la taille et les cheveux de Nina
    gloss: 'Giulia : Elle est petite et elle a les cheveux courts et blonds.'
    note: '*È bassa* (elle est petite) utilise le féminin *bassa* ; la description des cheveux suit avec *ha*.'
  it.a1.unit42.lesson04.teach.marco_e_gli:
    title: Marco demande comment sont ses yeux
    gloss: 'Marco : Et les yeux ?'
    note: '*E gli occhi?* omet le verbe. Comme en français, l’italien supprime souvent les mots que le contexte rend évidents.'
  it.a1.unit42.lesson04.teach.giulia_ha_gli:
    title: Giulia décrit les yeux de Nina
    gloss: 'Giulia : Elle a les yeux verts.'
    note: '*Ha gli occhi verdi* : aucun pronom sujet n’est nécessaire, car la terminaison du verbe indique déjà que c’est « elle ».'
  it.a1.unit42.lesson04.teach.marco_grazie_allora:
    title: Marco va la reconnaître
    gloss: 'Marco : Merci ! Comme ça, je la reconnaîtrai.'
    note: '*La riconosco* (je la reconnais) : le pronom objet *la* se place avant le verbe.'
  it.a1.unit42.lesson05.teach.luca_e_chiara:
    title: Comparer Luca et Chiara
    gloss: Luca et Chiara sont frère et sœur, mais ils ne se ressemblent pas. Luca est petit, il a les cheveux courts et châtains et les yeux marron. Chiara est plus grande que Luca, elle a les cheveux longs et châtains et les yeux verts. Et toi, comment es-tu ?
    note: Une courte comparaison qui réutilise tous les mots de couleur et de longueur appris jusqu’ici et se termine par la question essentielle de l’unité, adressée au lecteur.
    glosses:
      fratello: frère
      sorella: sœur
      sembrano: ils ont l'air / ils semblent
      diversi: différent
      basso: petit
      corti: petit
      castani: châtain
      capelli: cheveux
      marroni: châtain
      occhi: yeux
      alta: grand (più alta = plus grande)
      lunghi: long
      verdi: vert
      come: comment (Tu come sei? = Comment es-tu ?)
  it.a1.unit42.lesson05.teach.il_comparativo_si:
    title: 'Comparer : più ... di'
    gloss: 'L''italien compare avec più + adjectif + di, comme en français « plus + adjectif + que » : Chiara è più alta di Luca.'
    note: 'Place *più* avant l''adjectif et *di* avant la personne à qui tu compares. L''adjectif s''accorde en genre : *più alta*, *più alto*.'
  it.a1.unit42.lesson05.teach.chiara_ha_i:
    title: Chiara a les cheveux plus longs que Luca
    gloss: Chiara a les cheveux plus longs que Luca.
    note: '*I capelli più lunghi di Luca* : l''adjectif reste au pluriel pour s''accorder avec *capelli*.'
  it.a1.unit42.lesson05.teach.ho_i_capelli:
    title: J’ai les cheveux courts et châtains
    gloss: J’ai les cheveux courts et châtains.
    note: '*Ho i capelli corti e castani* : on utilise *avere* pour décrire son propre physique.'
  it.a1.unit42.lesson06.teach.marco_guarda_e:
    title: Marco repère Nina
    gloss: 'Marco : Regarde, c''est Nina, là-bas ? Elle a les cheveux courts et blonds et les yeux verts.'
    note: '*Guarda* (regarde) est l''impératif à la forme *tu*. *Quella* signifie « celle-là » pour une femme ou une fille.'
  it.a1.unit42.lesson06.teach.giulia_si_e:
    title: Giulia confirme
    gloss: 'Giulia : Oui, c''est Nina !'
    note: Une confirmation courte et naturelle.
  it.a1.unit42.lesson06.teach.nina_ciao_sei:
    title: Nina salue Marco
    gloss: 'Nina : Salut, tu es Marco ?'
    note: '*Sei Marco?* est la question informelle : *sei* est la forme *tu* de *essere*, donc on n''a pas besoin de dire *tu*.'
  it.a1.unit42.lesson06.teach.marco_si_piacere:
    title: Marco salue Nina à son tour
    gloss: 'Marco : Oui ! Enchanté de te rencontrer, Nina.'
    note: '*Piacere di conoscerti* est la formule pour rencontrer quelqu''un pour la première fois ; *-ti* signifie « te ».'
  it.a1.unit42.lesson06.teach.nina_piacere_mio:
    title: Nina lui répond
    gloss: 'Nina : Enchantée de faire ta connaissance, moi aussi !'
    note: 'Cela clôt le dialogue : Marco a bien reconnu Nina grâce à la description de Giulia.'
