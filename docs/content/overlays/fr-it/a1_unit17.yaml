teaching:
  it.a1.unit17.lesson01.teach.il_lavoro:
    title: il lavoro
    gloss: travail / métier
    note: '*il lavoro* est un nom masculin qui signifie à la fois « emploi, métier » et « travail » en général.'
    example_gloss:
    - Mon travail est intéressant.
  it.a1.unit17.lesson01.teach.insegnante_commesso:
    title: insegnante, commesso
    gloss: professeur, vendeur
    note: '*insegnante* (enseignant) a la même forme au masculin et au féminin ; *commesso* (vendeur) est masculin : le féminin est *commessa*.'
    example_gloss:
    - Je suis enseignant, pas vendeur.
  it.a1.unit17.lesson01.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: Quel métier fais-tu ?
    note: '*Che lavoro fai?* (littéralement « Quel travail fais-tu ? ») est la façon habituelle de demander la profession de quelqu''un.'
  it.a1.unit17.lesson01.teach.sono_insegnante:
    title: Sono insegnante.
    gloss: Je suis enseignante.
    note: 'En italien, on omet l''article devant une profession sans complément, comme en français : *Sono insegnante*, et non *Sono un insegnante*.'
  it.a1.unit17.lesson01.teach.sono_commesso:
    title: Sono commesso.
    gloss: Je suis vendeur.
    note: Même construction sans article que *Sono insegnante*.
  it.a1.unit17.lesson02.teach.ufficio_scuola:
    title: l'ufficio, la scuola
    gloss: bureau, école
    note: '*l''ufficio* (bureau) élide l''article devant une voyelle ; *la scuola* (école) est féminin.'
    example_gloss:
    - Je travaille dans un bureau.
    - Je travaille dans une école.
  it.a1.unit17.lesson02.teach.dove_lavori:
    title: Dove lavori?
    gloss: Où travailles-tu ?
    note: '*Dove* (où) plus *lavori* (tu travailles).'
  it.a1.unit17.lesson02.teach.lavoro_in_un_ufficio:
    title: Lavoro in un ufficio.
    gloss: Je travaille dans un bureau.
    note: '*Lavoro in* (je travaille dans) plus *un ufficio* (un bureau).'
  it.a1.unit17.lesson02.teach.lavoro_in_una_scuola:
    title: Lavoro in una scuola.
    gloss: Je travaille dans une école.
    note: Même construction avec *una scuola* (une école).
  it.a1.unit17.lesson03.teach.inizio_finisco:
    title: inizio, finisco
    gloss: je commence, je finis
    note: '*inizio* (je commence) et *finisco* (je finis) sont les formes de la première personne du présent de *iniziare* et *finire*.'
    example_gloss:
    - Je commence à neuf heures.
    - Je finis à cinq heures.
  it.a1.unit17.lesson03.teach.a_che_ora_inizi:
    title: A che ora inizi?
    gloss: À quelle heure commences-tu ?
    note: '*A che ora* (à quelle heure) plus *inizi* (tu commences).'
  it.a1.unit17.lesson03.teach.inizio_alle_nove_e_finisco_alle_cinque:
    title: Inizio alle nove e finisco alle cinque.
    gloss: Je commence à neuf heures et je finis à cinq heures.
    note: '*alle nove* / *alle cinque* (à neuf heures / à cinq heures) : on utilise *alle* devant l''heure, comme dans les expressions de l''heure de l''unité 5.'
