teaching:
  it.a1.unit15.lesson01.teach.piu_meno:
    title: più, meno
    gloss: plus, moins
    note: '*più* (plus) et *meno* (moins) sont les mots de base du comparatif ; on les place devant un adjectif ou on les utilise avec *di* pour comparer.'
    example_gloss:
    - Je veux plus de café, moins de thé.
  it.a1.unit15.lesson01.teach.di:
    title: di
    gloss: que / de
    note: 'Après *più*/*meno*, *di* (de) correspond à « que » (*più di due euro*) ; devant un article défini, il se contracte : *di* + *i* = *dei*, *di* + *le* = *delle*.'
    example_gloss:
    - Le café coûte plus de deux euros.
  it.a1.unit15.lesson01.teach.le_mele_costano_piu_dei_pomodori:
    title: Le mele costano più dei pomodori.
    gloss: Les pommes coûtent plus cher que les tomates.
    note: '*più dei pomodori* utilise *di* + *i* (contracté en *dei*) pour comparer avec *i pomodori*.'
  it.a1.unit15.lesson01.teach.i_pomodori_costano_meno_delle_mele:
    title: I pomodori costano meno delle mele.
    gloss: Les tomates coûtent moins cher que les pommes.
    note: '*meno delle mele* utilise *di* + *le* (contracté en *delle*) pour comparer avec *le mele*.'
  it.a1.unit15.lesson02.teach.quale_preferisci:
    title: Quale preferisci, le mele o i pomodori?
    gloss: Que préfères-tu, les pommes ou les tomates ?
    note: '*Quale* (lequel) demande à ton interlocuteur de choisir entre les deux choses qui viennent d’être nommées.'
  it.a1.unit15.lesson02.teach.preferisco_le_mele:
    title: Preferisco le mele.
    gloss: Je préfère les pommes.
    note: '*Preferisco* (je préfère) suivi de *le mele* (les pommes) répond à la question en faisant un choix.'
    example_gloss:
    - Je préfère les tomates.
  it.a1.unit15.lesson03.teach.come:
    title: come
    gloss: comme / aussi… que
    note: '*come* (comme, que) s’emploie avec *buono/a* pour comparer deux choses de valeur égale.'
    example_gloss:
    - Le thé est aussi bon que le café.
  it.a1.unit15.lesson03.teach.le_mele_sono_buone_come_i_pomodori:
    title: Le mele sono buone come i pomodori.
    gloss: Les pommes sont aussi bonnes que les tomates.
    note: '*sono buone* (sont bonnes, féminin pluriel) s’accorde avec *le mele* ; *come* introduit la comparaison d’égalité.'
