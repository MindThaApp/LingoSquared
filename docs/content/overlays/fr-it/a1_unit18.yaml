teaching:
  it.a1.unit18.lesson01.teach.la_cucina_il_soggiorno:
    title: la cucina, il soggiorno
    gloss: cuisine, salon
    note: '*la cucina* (cuisine) est féminin ; *il soggiorno* (salon) est masculin.'
    example_gloss:
    - La cuisine est grande.
    - Le salon est confortable.
  it.a1.unit18.lesson01.teach.la_camera_da_letto_il_bagno:
    title: la camera da letto, il bagno
    gloss: chambre, salle de bains
    note: '*la camera da letto* signifie littéralement « la pièce pour le lit » (*letto* = lit) ; *il bagno* est la salle de bains.'
    example_gloss:
    - La chambre est petite.
    - La salle de bains est propre.
  it.a1.unit18.lesson01.teach.questa_e_la_mia_casa:
    title: Questa è la mia casa.
    gloss: Voici ma maison.
    note: '*Questa* (ce/cette, au féminin) s’accorde avec *casa* (maison), qui est féminin.'
  it.a1.unit18.lesson01.teach.ci_sono_quattro_stanze:
    title: Ci sono quattro stanze.
    gloss: Il y a quatre pièces.
    note: '*Ci sono* (il y a, au pluriel) + un nombre + *stanze* (pièces) ; *quattro* (quatre) a été vu à l’unité 3.'
  it.a1.unit18.lesson02.teach.il_letto_il_tavolo:
    title: il letto, il tavolo
    gloss: lit, table
    note: '*il letto* (lit) et *il tavolo* (table) sont tous les deux masculins.'
    example_gloss:
    - Le lit est dans la chambre.
    - La table est dans la cuisine.
  it.a1.unit18.lesson02.teach.la_sedia_il_divano:
    title: la sedia, il divano
    gloss: chaise, canapé
    note: '*la sedia* (chaise) est féminin ; *il divano* (canapé) est masculin.'
    example_gloss:
    - La chaise est près de la table.
    - Le canapé est dans le salon.
  it.a1.unit18.lesson02.teach.il_letto_e_nella_camera_da_letto:
    title: Il letto è nella camera da letto.
    gloss: Le lit est dans la chambre.
    note: '*nella* réunit *in* + *la* pour dire « dans la ».'
  it.a1.unit18.lesson02.teach.il_divano_e_nel_soggiorno:
    title: Il divano è nel soggiorno.
    gloss: Le canapé est dans le salon.
    note: '*nel* réunit *in* + *il* (masculin) pour dire « dans le ».'
  it.a1.unit18.lesson03.teach.vicino_a_davanti:
    title: vicino a, davanti a
    gloss: près de, devant
    note: Ce sont deux prépositions de deux mots qui se terminent par *a*, lequel se contracte avec l’article qui suit (*al*, *alla*).
    example_gloss:
    - La chaise est près de la table.
    - Le lit est devant la fenêtre.
  it.a1.unit18.lesson03.teach.dietro_sopra_sotto:
    title: dietro, sopra, sotto
    gloss: derrière, au-dessus / sur, sous
    note: 'Trois autres mots de lieu : *dietro* (derrière), *sopra* (au-dessus / sur), *sotto* (sous) — aucun d’eux n’a besoin de *a* devant un article.'
    example_gloss:
    - Le canapé est derrière la table.
    - Le livre est sur la table.
    - Le chat est sous le lit.
  it.a1.unit18.lesson03.teach.dove_il_letto:
    title: Dov'è il letto?
    gloss: Où est le lit ?
    note: '*Dov''è* est la contraction de *dove* (où) + *è* (est).'
  it.a1.unit18.lesson03.teach.il_letto_e_vicino_alla_finestra:
    title: Il letto è vicino alla finestra.
    gloss: Le lit est près de la fenêtre.
    note: '*vicino alla finestra* utilise *vicino a* + *la finestra* (la fenêtre), contractés en *alla*.'
