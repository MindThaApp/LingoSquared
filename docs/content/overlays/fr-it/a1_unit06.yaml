teaching:
  it.a1.unit06.lesson01.teach.madre_padre:
    title: la madre, il padre
    gloss: la mère, le père
    note: 'En italien, les noms portent un article selon leur genre : *la* pour le féminin, *il* pour le masculin.'
    example_gloss:
    - C’est mon père.
    - C’est ma mère.
  it.a1.unit06.lesson01.teach.fratello_sorella:
    title: il fratello, la sorella
    gloss: le frère, la sœur
    note: '*fratello* est masculin (*il*) et *sorella* est féminin (*la*).'
    example_gloss:
    - J'ai un frère et une sœur.
  it.a1.unit06.lesson01.teach.questo_e_mio_padre:
    title: Questo è mio padre. Questa è mia madre.
    gloss: Voici mon père. Voici ma mère.
    note: '*Questo/Questa* (celui-ci / celle-ci) s''accorde en genre avec la personne désignée : *questo* pour un homme, *questa* pour une femme.'
  it.a1.unit06.lesson01.teach.nonno_nonna:
    title: il nonno, la nonna
    gloss: le grand-père, la grand-mère
    note: Même alternance d'articles masculin/féminin que pour *padre/madre*.
    example_gloss:
    - Mon grand-père habite à Rome.
    - Ma grand-mère cuisine très bien.
  it.a1.unit06.lesson02.teach.hai_fratelli_o_sorelle:
    title: Hai fratelli o sorelle?
    gloss: Tu as des frères ou des sœurs ?
    note: '*Hai* (tu as) + le mot de la famille + *o* (ou) est la façon habituelle de poser la question sur la fratrie.'
  it.a1.unit06.lesson02.teach.ho_un_fratello_e_una_sorella:
    title: Ho un fratello e una sorella.
    gloss: J'ai un frère et une sœur.
    note: '*Ho* (j''ai) sert à répondre, avec *un* (un, masculin) et *una* (une, féminin).'
  it.a1.unit06.lesson02.teach.moglie_marito:
    title: il marito, la moglie
    gloss: le mari, la femme
    note: Autre paire masculin/féminin, avec la même logique d'articles.
    example_gloss:
    - Sam a une femme.
  it.a1.unit06.lesson03.teach.hai_figli:
    title: Hai figli?
    gloss: Tu as des enfants ?
    note: '*figli* (enfants) est le pluriel employé pour une question générale, quel que soit leur nombre ou leur sexe.'
  it.a1.unit06.lesson03.teach.ho_due_figli:
    title: Sì, ho due figli. Un maschio e una femmina.
    gloss: Oui, j'ai deux enfants. Un garçon et une fille.
    note: '*maschio* (garçon) et *femmina* (fille) précisent le sexe des enfants après avoir donné le nombre total.'
  it.a1.unit06.lesson03.teach.figlio_figlia:
    title: il figlio, la figlia
    gloss: le fils, la fille
    note: Ce sont les formes du singulier de *figli*, avec l'alternance habituelle d'articles masculin/féminin.
    example_gloss:
    - Elena a un fils et une fille.
