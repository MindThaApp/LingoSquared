course:
  title: Italien A1
  description: Apprends l'italien de niveau A1 pour les salutations du quotidien et les courts échanges sociaux, avec des explications détaillées en français.
units:
  it.a1.unit02.origin_nationality_language:
    title: D'où tu viens, nationalité et langue
lessons:
  it.a1.unit02.lesson01.di_dove_sei:
    title: D'où viens-tu ? Demander et dire son origine
  it.a1.unit02.lesson02.parlare_italiano:
    title: 'Parler italien : niveau et langues'
  it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto:
    title: Travail et bienvenue à Milan
teaching:
  it.a1.unit02.lesson01.teach.di_dove:
    title: di dove
    gloss: d’où
    note: '*di dove* est la base pour demander ou dire son origine : il s’utilise avec *sei* (informel) ou *è* (formel).'
    example_gloss:
    - Sam, tu viens d’où ?
    - Elena, vous venez d’où ? (formel)
  it.a1.unit02.lesson01.teach.di_dove_sei:
    title: Di dove sei?
    gloss: D’où venez-vous ?
    note: La question informelle, posée à un pair ou à un ami, qui correspond à *tu* de l’unité 1.
  it.a1.unit02.lesson01.teach.di_dov_e_lei:
    title: Di dov'è, Lei?
    gloss: D’où venez-vous ? (forme de politesse)
    note: La question formelle, qui correspond à *Lei* de l’unité 1.
  it.a1.unit02.lesson01.teach.sono_americano_chicago:
    title: Sono americano, di Chicago.
    gloss: Je suis américain, de Chicago.
    note: Elle indique ensemble la nationalité et la ville d’origine.
  it.a1.unit02.lesson01.teach.sono_italiana_milano:
    title: Sono italiana, di Milano.
    gloss: Je suis italienne, de Milan.
    note: '*italiana* est le féminin de la nationalité, employé parce qu’Elena est une femme.'
  it.a1.unit02.lesson01.teach.nationalities:
    title: americano/americana, italiano/italiana
    gloss: américain/américaine, italien/italienne
    note: 'En italien, comme en français, les adjectifs de nationalité s’accordent avec la personne, mais avec des terminaisons différentes : *-o* pour un homme, *-a* pour une femme (*Sam è americano*, *Elena è italiana*).'
    example_gloss:
    - Sam est américain.
    - Elena est italienne.
  it.a1.unit02.lesson02.teach.parli_italiano:
    title: Parli italiano?
    gloss: Tu parles italien ?
    note: La question informelle, avec la forme en *tu* de *parlare* (parler).
  it.a1.unit02.lesson02.teach.parla_italiano:
    title: Parla italiano?
    gloss: Vous parlez italien ? (formel)
    note: La question formelle, avec la forme en *Lei* de *parlare*.
  it.a1.unit02.lesson02.teach.parlo_un_po:
    title: Parlo un po' d'italiano
    gloss: Je parle un peu italien
    note: 'Une façon modeste et courante de décrire son niveau : *un po''* signifie « un peu ».'
    example_gloss: Je parle un peu italien, j’étudie depuis un an.
  it.a1.unit02.lesson02.teach.parlo_inglese:
    title: Parlo inglese.
    gloss: Je parle anglais.
    note: La même construction avec *parlo* (je parle) et une autre langue.
  it.a1.unit02.lesson02.teach.studio_da_un_anno:
    title: Studio italiano da un anno.
    gloss: J’étudie l’italien depuis un an.
    note: '*da un anno* signifie « depuis un an » et décrit une action commencée dans le passé qui continue maintenant.'
  it.a1.unit02.lesson02.teach.da_quanto_studi:
    title: Da quanto studi?
    gloss: Depuis combien de temps tu étudies ?
    note: '*Da quanto* (depuis combien de temps) + le présent *studi* (tu étudies, informel) demande depuis quand une activité dure. Réponds avec la même structure : *Studio da un anno.*'
  it.a1.unit02.lesson02.teach.parla_bene:
    title: Parli italiano bene!
    gloss: Tu parles bien italien !
    note: Un compliment amical sur le niveau de langue de quelqu’un, avec la forme en *tu*.
  it.a1.unit02.lesson03.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: Quel métier fais-tu ?
    note: La question informelle, avec la forme en *tu* de *fare* (faire).
  it.a1.unit02.lesson03.teach.che_lavoro_fa:
    title: Che lavoro fa, Lei?
    gloss: Qu’est-ce que vous faites comme travail ? (formel)
    note: La question formelle, avec la forme en *Lei* de *fare*.
  it.a1.unit02.lesson03.teach.sono_ingegnere:
    title: Sono ingegnere
    gloss: Je suis ingénieur
    note: 'Comme en français, les noms de métier s’emploient en italien sans article : *sono ingegnere*, et non *sono un ingegnere*.'
    example_gloss: Je suis ingénieur, je travaille à Milan.
  it.a1.unit02.lesson03.teach.sono_qui_per_lavoro:
    title: Sono qui per lavoro.
    gloss: Je suis ici pour le travail.
    note: '*per lavoro* explique la raison de sa présence quelque part : le travail, et non le tourisme.'
  it.a1.unit02.lesson03.teach.per_due_anni:
    title: Sono qui per due anni.
    gloss: Je suis ici pour deux ans.
    note: Même construction que *per lavoro*, mais pour indiquer une durée et non une raison.
  it.a1.unit02.lesson03.teach.che_bello_benvenuto:
    title: Che bello, benvenuto a Milano!
    gloss: Comme c’est bien, bienvenue à Milan !
    note: '*Che bello* est une réaction enthousiaste courante qui signifie « comme c’est bien ! ».'
  it.a1.unit02.lesson03.teach.grazie_mille_reprise:
    title: Grazie mille!
    gloss: Merci beaucoup !
    note: Le même remerciement appuyé que dans l’unité 1, dit ici en réponse à un accueil chaleureux.
