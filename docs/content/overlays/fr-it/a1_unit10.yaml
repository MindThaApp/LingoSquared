teaching:
  it.a1.unit10.lesson01.teach.a_destra_a_sinistra:
    title: a destra, a sinistra
    gloss: à droite, à gauche
    note: '*a destra* (à droite) et *a sinistra* (à gauche) sont les deux directions de base pour tourner.'
    example_gloss:
    - Tournez à droite, s’il vous plaît.
  it.a1.unit10.lesson01.teach.sempre_dritto_incrocio:
    title: sempre dritto, all'incrocio
    gloss: tout droit, au carrefour
    note: '*sempre dritto* (tout droit) et *all''incrocio* (au carrefour) indiquent comment avancer et où tourner.'
    example_gloss:
    - Allez tout droit jusqu’au carrefour.
  it.a1.unit10.lesson01.teach.scusi_come_arrivo_al_museo:
    title: Scusi, come arrivo al museo?
    gloss: Excusez-moi, comment arriver au musée ?
    note: '*Scusi* (excusez-moi, forme de politesse) ouvre la question avant *come arrivo* (comment arriver) suivi de la destination.'
  it.a1.unit10.lesson01.teach.vada_sempre_dritto:
    title: Vada sempre dritto, poi giri a destra all'incrocio.
    gloss: Allez tout droit, puis tournez à droite au carrefour.
    note: '*Vada* et *giri* sont des impératifs de politesse (Lei), la manière polie dont un inconnu indique le chemin.'
  it.a1.unit10.lesson02.teach.e_lontano_da_qui:
    title: È lontano da qui?
    gloss: Est-ce que c’est loin d’ici ?
    note: '*È lontano* (est-ce loin) avec *da qui* (d’ici) sert à poser une question sur la distance.'
  it.a1.unit10.lesson02.teach.no_cinque_minuti:
    title: No, sono solo cinque minuti a piedi.
    gloss: Non, c’est à seulement cinq minutes à pied.
    note: '*a piedi* (à pied) précise comment on mesure la distance.'
  it.a1.unit10.lesson02.teach.molto_gentile:
    title: Grazie mille, molto gentile.
    gloss: Merci beaucoup, vous êtes très aimable.
    note: '*molto gentile* (très aimable) ajoute de la chaleur quand on remercie quelqu’un de son aide.'
    example_gloss:
    - Très aimable, encore merci.
  it.a1.unit10.lesson03.teach.vada_giri_continui:
    title: Vada, giri, continui.
    gloss: Allez, tournez, continuez.
    note: Trois verbes à l’impératif de politesse (Lei) que l’on emploie souvent ensemble pour indiquer un chemin.
  it.a1.unit10.lesson03.teach.dove_e_il_museo:
    title: Dov'è il museo?
    gloss: Où est le musée ?
    note: '*Dov’è* (où est) suivi d’un nom sert à demander où se trouve un lieu.'
    example_gloss:
    - Le musée est loin d’ici.
