teaching:
  it.a1.unit13.lesson01.teach.ieri_stamattina:
    title: ieri, stamattina
    gloss: hier, ce matin
    note: '*ieri* (hier) et *stamattina* (ce matin) sont les deux repères de temps utilisés pour parler d’événements récents.'
    example_gloss:
    - Hier, j’étais à la maison.
  it.a1.unit13.lesson01.teach.sono_andato:
    title: sono andato, sono andata
    gloss: je suis allé, je suis allée
    note: '*sono andato/andata* est le passato prossimo de *andare*, formé avec l’auxiliaire *essere* ; le participe passé s’accorde avec le genre du sujet.'
    example_gloss:
    - Ce matin, je suis allé au travail.
  it.a1.unit13.lesson01.teach.sono_andato_al_cinema_ieri:
    title: Sono andato al cinema ieri.
    gloss: Hier, je suis allé au cinéma.
    note: '*Sono andato* (un locuteur masculin) plus *al cinema* (au cinéma) plus *ieri* (hier) décrit un événement passé terminé.'
  it.a1.unit13.lesson01.teach.ho_visto_un_bel_film:
    title: Ho visto un bel film!
    gloss: J’ai vu un beau film !
    note: '*Ho visto* utilise l’auxiliaire *avere* avec le participe passé irrégulier *visto* (de *vedere*, voir).'
  it.a1.unit13.lesson02.teach.ho_mangiato_un_panino:
    title: Ho mangiato un panino a pranzo.
    gloss: J’ai mangé un sandwich à midi.
    note: '*Ho mangiato* utilise *avere* plus le participe passé régulier *mangiato* (de *mangiare*, manger) ; *a pranzo* signifie « à midi », « au déjeuner ».'
  it.a1.unit13.lesson02.teach.cosa_hai_fatto_ieri:
    title: Cosa hai fatto ieri?
    gloss: Qu’avez-vous fait hier ?
    note: '*hai fatto* est le passato prossimo de *fare* (faire), employé ici pour interroger sur un événement passé récent.'
    example_gloss:
    - Qu’est-ce que tu as fait ce matin ?
  it.a1.unit13.lesson02.teach.ieri_sera:
    title: ieri sera
    gloss: hier soir
    note: '*ieri sera* associe *ieri* (hier) à *sera* (soir) pour désigner un moment précis du passé.'
    example_gloss:
    - Hier soir, je suis allé au cinéma.
  it.a1.unit13.lesson03.teach.sono_andata_al_lavoro:
    title: Stamattina sono andata al lavoro, come sempre.
    gloss: Ce matin, je suis allée au travail, comme toujours.
    note: '*sono andata* (une locutrice) plus *come sempre* (comme toujours) décrit une action passée habituelle.'
  it.a1.unit13.lesson03.teach.e_tu_cosa_hai_fatto:
    title: E tu, cosa hai fatto stamattina?
    gloss: Et toi, qu’est-ce que tu as fait ce matin ?
    note: '*E tu* (et toi) renvoie la question à l’autre personne.'
    example_gloss:
    - Et toi, qu’est-ce que tu as fait hier soir ?
