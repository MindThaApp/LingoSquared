teaching:
  it.a1.unit14.lesson01.teach.preferire:
    title: preferire, preferisco
    gloss: préférer, je préfère
    note: '*preferire* (préférer) est un verbe en -ire avec un élément -isc- à la plupart des formes du présent ; *preferisco* signifie « je préfère ».'
    example_gloss:
    - Je préfère le thé au café.
  it.a1.unit14.lesson01.teach.preferisci_il_caffe_o_il_te:
    title: Preferisci il caffè o il tè?
    gloss: Tu préfères le café ou le thé ?
    note: '*Preferisci* (tu préfères) avec *o* (ou) propose un choix entre deux possibilités.'
  it.a1.unit14.lesson01.teach.preferisco_il_caffe:
    title: Preferisco il caffè.
    gloss: Je préfère le café.
    note: '*Preferisco* (je préfère) suivi de *il caffè* (le café) exprime une préférence.'
  it.a1.unit14.lesson02.teach.mi_piace_il_cornetto:
    title: Mi piace molto il cornetto.
    gloss: J’aime beaucoup le croissant.
    note: '*Mi piace* (cela me plaît / j’aime) avec *molto* (beaucoup) exprime un goût marqué.'
  it.a1.unit14.lesson02.teach.non_mi_piace:
    title: Non mi piace il tè la mattina.
    gloss: Je n’aime pas le thé le matin.
    note: '*Non mi piace* (je n’aime pas) met la construction du goût à la forme négative ; *la mattina* signifie « le matin ».'
    example_gloss:
    - Je n’aime pas le café le soir.
  it.a1.unit14.lesson02.teach.e_a_te:
    title: E a te?
    gloss: Et vous ?
    note: '*E a te?* (et à toi ?) demande à l’autre personne quelle est sa propre préférence.'
  it.a1.unit14.lesson03.teach.anch_io_preferisco_il_caffe:
    title: Anch'io preferisco il caffè!
    gloss: Moi aussi, je préfère le café !
    note: '*Anch''io* (moi aussi) approuve une préférence que quelqu’un vient d’exprimer avec *preferisco*. (Pour approuver une phrase avec *mi piace*, l’italien dit *Anche a me*.)'
  it.a1.unit14.lesson03.teach.a_me_no:
    title: A me no, preferisco il tè.
    gloss: Pas moi, je préfère le thé.
    note: '*A me no* (pas moi) exprime un désaccord avec une phrase en *mi piace* (il reprend le *a me* de la construction du goût) avant de donner sa propre préférence. Pour contredire une phrase avec *preferisco*, l’italien dit plutôt *Io no*.'
    example_gloss:
    - Pas moi, je préfère le café.
