teaching:
  it.a1.unit24.lesson01.teach_soldi_carta:
    title: i soldi, la carta
    gloss: l’argent, la carte
    note: '*Soldi* est toujours au pluriel en italien, alors qu’en français on dit « l’argent » au singulier ; *carta* est la forme courte usuelle pour une carte de paiement.'
    example_gloss:
    - J’ai de l’argent.
    - Je paie par carte.
  it.a1.unit24.lesson01.teach_contanti_scontrino:
    title: i contanti, lo scontrino
    gloss: les espèces, le ticket de caisse
    note: '*Contanti* est un pluriel ; *scontrino* est le ticket de caisse de tous les jours.'
    example_gloss:
    - Je paie en espèces.
    - Voici le ticket de caisse.
  it.a1.unit24.lesson01.teach_pago_con_la_carta:
    title: Pago con la carta.
    gloss: Je paie par carte.
    note: Pour payer par carte, on emploie *con la carta*.
    example_gloss:
    - Je paie par carte au café.
  it.a1.unit24.lesson01.teach_pago_in_contanti:
    title: Pago in contanti.
    gloss: Je paie en espèces.
    note: Pour payer en espèces, on emploie *in contanti*.
    example_gloss:
    - Aujourd’hui, je paie en espèces.
  it.a1.unit24.lesson02.teach_posso_pagare_carta:
    title: Posso pagare con la carta?
    gloss: Puis-je payer par carte ?
    note: '*Posso pagare...?* sert à demander si un moyen de paiement est accepté.'
    example_gloss:
    - Je peux payer par carte aujourd’hui ?
  it.a1.unit24.lesson02.teach_sono_dieci_euro:
    title: Sono dieci euro.
    gloss: Ça fait dix euros.
    note: Pour les prix, l’italien emploie souvent *sono* au pluriel, alors qu’en français on dit « ça fait » ou « c’est » au singulier.
    example_gloss:
    - Le T-shirt coûte dix euros.
  it.a1.unit24.lesson02.teach_si_certo:
    title: Sì, certo.
    gloss: Oui, bien sûr.
    note: Pour dire « oui », on écrit *Sì* avec un accent ; *si* sans accent a un autre sens.
    example_gloss:
    - Oui, bien sûr, je paie par carte.
  it.a1.unit24.lesson02.teach_ecco_scontrino:
    title: Ecco lo scontrino.
    gloss: Voici le ticket de caisse.
    note: '*Ecco* sert à présenter quelque chose : voici / voilà.'
    example_gloss:
    - Merci, voici le ticket de caisse.
