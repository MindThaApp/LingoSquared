teaching:
  it.a1.unit03.lesson01.teach.numeri_zero_cinque:
    title: zero, uno, due, tre, quattro, cinque
    gloss: zéro, un, deux, trois, quatre, cinq
    note: 'Les six premiers nombres : la base pour les prix, les âges et les numéros de téléphone tout au long de cette unité.'
    example_gloss:
    - J’ai deux frères.
    - Il est cinq heures.
  it.a1.unit03.lesson01.teach.numeri_sei_dieci:
    title: sei, sette, otto, nove, dieci
    gloss: six, sept, huit, neuf, dix
    note: Les nombres de six à dix, qui complètent la série de 0 à 10.
    example_gloss:
    - Je travaille huit heures par jour.
    - Le magasin ouvre à dix heures.
  it.a1.unit03.lesson01.teach.quanti_anni:
    title: Quanti anni hai?
    gloss: Quel âge as-tu ?
    note: 'Littéralement « combien d’années as-tu » : comme en français, l’italien demande l’âge avec *avere* (avoir).'
  it.a1.unit03.lesson01.teach.ho_trent_anni:
    title: Ho trent'anni.
    gloss: J’ai trente ans.
    note: 'Expression figée pour dire son âge avec *avere* (« j’ai trente ans », comme en français) ; « trente » n’est pas enseigné ici comme nombre à compter : dans cette unité, on reste de 0 à 10, avec 30 et 50 vus seulement dans cette expression et dans les prix.'
  it.a1.unit03.lesson02.teach.quanto_costa:
    title: Quanto costa un caffè?
    gloss: Combien coûte un café ?
    note: '*Quanto costa* est la façon habituelle de demander le prix d’un seul article.'
  it.a1.unit03.lesson02.teach.costa_un_euro:
    title: un euro, due euro
    gloss: un euro, deux euros
    note: 'En italien, *euro* ne change pas au pluriel, alors qu’en français on écrit « deux euros » : *un euro* et *due euro* gardent la même forme *euro*.'
    example_gloss:
    - Ça coûte un euro.
    - Ça fait deux euros cinquante.
  it.a1.unit03.lesson02.teach.un_cornetto:
    title: E un cornetto?
    gloss: Et un croissant ?
    note: Petite question de suite pour demander le prix d’un deuxième article, un *cornetto* (le croissant italien du petit-déjeuner).
  it.a1.unit03.lesson02.teach.due_euro_cinquanta:
    title: Sono due euro e cinquanta.
    gloss: Ça fait deux euros cinquante.
    note: '*e cinquanta* ajoute les centimes : littéralement « et cinquante », pour tout prix avec cinquante centimes.'
  it.a1.unit03.lesson02.teach.quanti_ne_vuole:
    title: Quanti ne vuole?
    gloss: Vous en voulez combien ?
    note: Façon polie dont un barista ou un commerçant demande combien d’exemplaires on veut ; *ne* remplace l’article déjà mentionné, un peu comme « en » en français.
  it.a1.unit03.lesson02.teach.ne_vorrei_tre:
    title: Ne vorrei tre, grazie.
    gloss: J’en voudrais trois, merci.
    note: '*Ne vorrei* + un nombre est la façon polie de demander une quantité ; *ne* reprend là aussi l’article déjà mentionné, comme « en » en français.'
  it.a1.unit03.lesson03.teach.qual_e_il_tuo_numero:
    title: Qual è il tuo numero di telefono?
    gloss: Quel est ton numéro de téléphone ?
    note: Façon informelle de demander le numéro de téléphone de quelqu’un, avec *tuo* (ton, au tutoiement).
  it.a1.unit03.lesson03.teach.ti_chiamo_domani:
    title: Ti chiamo domani!
    gloss: Je t’appelle demain !
    note: Une façon amicale de conclure un échange après avoir obtenu le numéro de quelqu’un.
  it.a1.unit03.lesson03.teach.il_mio_numero:
    title: il mio numero
    gloss: mon numéro
    note: En Italie, on énonce généralement un numéro de téléphone chiffre par chiffre, avec les nombres de la leçon 1, alors qu’en français on le dit souvent par groupes de deux chiffres.
    example_gloss: Mon numéro est zéro, trois, quatre, deux, un.
  it.a1.unit03.lesson03.teach.numero_sam:
    title: Il mio numero è zero, tre, quattro, due, uno.
    gloss: Mon numéro est zéro, trois, quatre, deux, un.
    note: Sam donne son numéro de téléphone chiffre par chiffre, comme on le fait normalement en italien, alors qu’en français on le dit souvent par groupes de deux chiffres.
  it.a1.unit03.lesson03.teach.perfetto_grazie:
    title: Perfetto, grazie!
    gloss: Parfait, merci !
    note: Une façon brève et enjouée de conclure un échange après avoir obtenu l’information voulue.
