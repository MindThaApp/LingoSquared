teaching:
  it.a1.unit04.lesson01.teach.giorni_lun_mer:
    title: lunedì, martedì, mercoledì
    gloss: lundi, mardi, mercredi
    note: Les trois premiers jours de la semaine italienne. Comme en français, elle commence le lundi, et les noms des jours s’écrivent sans majuscule.
    example_gloss:
    - Le lundi, je travaille au bureau.
  it.a1.unit04.lesson01.teach.giorni_gio_dom:
    title: giovedì, venerdì, sabato, domenica
    gloss: jeudi, vendredi, samedi, dimanche
    note: Les quatre autres jours de la semaine, qui complètent la liste.
    example_gloss:
    - Je ne travaille pas le dimanche.
  it.a1.unit04.lesson01.teach.che_giorno_e_oggi:
    title: Che giorno è oggi?
    gloss: Quel jour sommes-nous aujourd’hui ?
    note: La façon habituelle de demander quel jour de la semaine on est.
  it.a1.unit04.lesson01.teach.oggi_e_giovedi:
    title: Oggi è giovedì.
    gloss: Aujourd’hui, c’est jeudi.
    note: '*Oggi* (aujourd’hui) + *è* (est) + le nom du jour répond directement à la question.'
  it.a1.unit04.lesson01.teach.domani_e_venerdi:
    title: Domani è venerdì.
    gloss: Demain, c’est vendredi.
    note: '*Domani* (demain) suit le même schéma que *oggi* pour nommer un jour.'
  it.a1.unit04.lesson02.teach.che_data_e_oggi:
    title: Che data è oggi?
    gloss: Quelle est la date aujourd’hui ?
    note: On utilise *Che data* (quelle date) plutôt que *che giorno* pour demander la date du calendrier, et non le jour de la semaine.
  it.a1.unit04.lesson02.teach.mesi_gen_apr:
    title: gennaio, febbraio, marzo, aprile
    gloss: janvier, février, mars, avril
    note: Les quatre premiers mois de l’année en italien ; comme en français, les noms des mois s’écrivent sans majuscule.
    example_gloss:
    - Aujourd’hui, nous sommes le 5 janvier.
  it.a1.unit04.lesson02.teach.oggi_e_cinque_gennaio:
    title: Oggi è il cinque gennaio.
    gloss: Aujourd’hui, nous sommes le 5 janvier.
    note: 'Les dates italiennes se construisent avec *il* + le numéro du jour + le nom du mois, avec un simple nombre cardinal : *cinque*. Seule exception, le premier du mois, qui prend l’ordinal *primo* (*il primo gennaio*).'
  it.a1.unit04.lesson02.teach.il_giorno_del_mese:
    title: il quindici marzo
    gloss: le quinze mars
    note: 'Autre exemple de la structure jour + mois : elle fonctionne de la même façon pour n’importe quelle date.'
  it.a1.unit04.lesson03.teach.quando_arrivi:
    title: Quando arrivi a Roma?
    gloss: Quand arrives-tu à Rome ?
    note: '*Quando* (quand) + *arrivi* (tu arrives) permet de demander une arrivée à venir.'
  it.a1.unit04.lesson03.teach.arrivo_giovedi_pomeriggio:
    title: Arrivo giovedì pomeriggio.
    gloss: J’arrive jeudi après-midi.
    note: '*Arrivo* (j’arrive) + jour + moment de la journée donne une réponse complète sur ton heure d’arrivée.'
  it.a1.unit04.lesson03.teach.parti_di_domani:
    title: oggi, domani, dopodomani
    gloss: aujourd’hui, demain, après-demain
    note: '*Dopodomani* est un seul mot pour « après-demain » : littéralement *dopo* (après) + *domani* (demain).'
    example_gloss:
    - Après-demain, c’est samedi.
  it.a1.unit04.lesson03.teach.ci_vediamo_giovedi:
    title: Ci vediamo giovedì!
    gloss: À jeudi !
    note: Une façon amicale de conclure un échange après s’être mis d’accord sur un jour pour se voir.
