  it.a1.unit47.lesson05.teach.luca_non_lavora:
    title: Qui étudie quoi ?
    gloss: Luca ne fait pas que travailler, il étudie aussi. Il suit un cours d'espagnol au centre de formation pour adultes. Chaque semaine, il apprend des mots nouveaux. Chiara suit un cursus à la haute école. Là, elle étudie les soins de santé. Tous les deux aiment étudier. Et toi, qu'est-ce que tu étudies, ou qu'aimerais-tu apprendre ?
    note: Compare les études de Luca et celles de Chiara, sur le modèle du texte comparatif de l'unité sur la technologie.
    glosses:
      lavora: travaille
      soltanto: seulement
      studia: étudie
      segue: prend
      corso: cours
      spagnolo: espagnol
      adulti: adultes (scuola per adulti = centre de formation pour adultes)
      impara: apprend
      ogni: tous les
      settimana: semaine
      nuove: nouveau
      parole: mots
      fa: fait
      studi: études (corso di studi = cursus d'études)
      universitario: de niveau universitaire (istituto universitario = haute école)
      sanitaria: soins de santé (assistenza sanitaria)
      entrambi: tous les deux
      piace: plaît (a entrambi piace = ils aiment tous les deux)
      studiare: étudier
      imparare: apprendre
