course:
  title: Italien A1
  description: Apprends l'italien de niveau A1 pour les salutations du quotidien et les courts échanges sociaux, avec des explications détaillées en français.
units:
  it.a1.unit01.greetings_and_introductions:
    title: Salutations et présentations
lessons:
  it.a1.unit01.lesson01.tu_e_lei:
    title: 'Tu et Lei : saluer de façon informelle et formelle'
  it.a1.unit01.lesson02.stare_bene_e_salutarsi:
    title: Répondre et prendre congé
  it.a1.unit01.lesson03.presentarsi_in_ufficio:
    title: 'Se présenter : premier jour au bureau'
teaching:
  it.a1.unit01.lesson01.teach.ciao_buongiorno:
    title: Ciao, Buongiorno
    gloss: salut, bonjour
    note: '*Ciao* est une salutation décontractée, utilisable à toute heure du jour entre amis et camarades. *Buongiorno* est la salutation courante, plus formelle, qu''on emploie de la matinée jusqu''à l''après-midi.'
    example_gloss:
    - Salut, comment vas-tu ?
    - Bonjour, comment allez-vous ?
  it.a1.unit01.lesson01.teach.come_stai_sta:
    title: come stai, come sta
    gloss: comment vas-tu, comment allez-vous
    note: '*come stai* va avec *tu* (un ami, un camarade) ; *come sta* va avec *Lei* (un inconnu, un supérieur, une personne qu''on respecte). Même question, registre différent.'
    example_gloss:
    - Salut, comment vas-tu aujourd'hui ?
    - Bonjour, comment allez-vous aujourd'hui ?
  it.a1.unit01.lesson01.teach.ciao_come_stai:
    title: Ciao, come stai?
    gloss: Salut, comment vas-tu ?
    note: La salutation informelle suivie de la question, utilisée avec des amis, des camarades ou des personnes de ton âge.
  it.a1.unit01.lesson01.teach.buongiorno_come_sta:
    title: Buongiorno, come sta?
    gloss: Bonjour, comment allez-vous ?
    note: L'équivalent formel, utilisé avec une personne à qui l'on s'adresse avec respect, par exemple le responsable d'un nouveau collègue.
  it.a1.unit01.lesson01.teach.register_rule:
    title: 'tu: informale · Lei: formale o rispettoso'
    gloss: 'tu : informel · Lei : formel ou respectueux'
    note: '*tu* est le « tu » de tous les jours entre amis, camarades et personnes du même niveau. *Lei* est le « vous » de politesse pour les inconnus, la hiérarchie au travail ou une personne qu''on rencontre pour la première fois ; il a ses propres formes verbales (compare *tu stai* et *Lei sta*).'
  it.a1.unit01.lesson02.teach.bene_grazie:
    title: Bene, grazie
    gloss: Bien, merci
    note: Une réponse simple et neutre à « comment vas-tu ? », utilisable dans les deux registres en y ajoutant *e tu?* ou *e Lei?*
    example_gloss:
    - Bien, merci, et toi ?
    - Bien, merci, et vous ?
  it.a1.unit01.lesson02.teach.e_tu:
    title: E tu?
    gloss: Et toi ? (informel)
    note: La façon informelle de renvoyer la question à un ami ou à un camarade.
  it.a1.unit01.lesson02.teach.e_lei:
    title: E Lei?
    gloss: Et vous ? (formel)
    note: La façon formelle de renvoyer la question, en accord avec le registre du *Lei*.
  it.a1.unit01.lesson02.teach.bene_grazie_e_tu:
    title: Bene, grazie, e tu?
    gloss: Bien, merci, et toi ?
    note: La réponse complète, avec la question en retour, dite à un ami ou à un camarade.
  it.a1.unit01.lesson02.teach.bene_grazie_e_lei:
    title: Bene, grazie, e Lei?
    gloss: Bien, merci, et vous ?
    note: La réponse complète, avec la question en retour, dite à une personne à qui l'on s'adresse avec respect.
  it.a1.unit01.lesson02.teach.buonasera_buonanotte:
    title: Buonasera, Buonanotte
    gloss: bonsoir, bonne nuit
    note: '*Buonasera* est une salutation qu''on emploie en arrivant quelque part le soir. *Buonanotte* est une formule d''adieu qu''on dit quand quelqu''un va se coucher ou termine sa journée ; elle ne s''emploie jamais pour saluer à l''arrivée.'
    example_gloss:
    - Bonsoir, comment ça va ?
    - Bonne nuit, à demain.
  it.a1.unit01.lesson02.teach.arrivederla:
    title: Arrivederla, a domani.
    gloss: Au revoir, à demain.
    note: '*Arrivederla* est l''au revoir formel, employé avec *Lei*, adapté au monde du travail ou à un inconnu.'
  it.a1.unit01.lesson02.teach.ci_vediamo:
    title: Ciao, ci vediamo domani!
    gloss: Salut, à demain !
    note: L'au revoir décontracté, employé avec des amis et des camarades qu'on reverra le lendemain.
  it.a1.unit01.lesson03.teach.come_si_chiama:
    title: Come si chiama, scusi?
    gloss: Comment vous appelez-vous, excusez-moi ?
    note: '*Come si chiama?* demande littéralement « comment vous appelez-vous ? » au registre formel du *Lei* ; ajouter *scusi* (« excusez-moi ») est une marque de politesse naturelle quand on s''adresse à un inconnu.'
  it.a1.unit01.lesson03.teach.come_ti_chiami:
    title: Come ti chiami?
    gloss: Comment t'appelles-tu ?
    note: La version informelle, employée avec un ami, un camarade ou une personne de ton âge.
  it.a1.unit01.lesson03.teach.mi_chiamo_elena:
    title: Mi chiamo Elena.
    gloss: Je m'appelle Elena.
    note: '*chiamarsi* signifie « s''appeler » : c''est la façon habituelle de dire son nom, dans les deux registres.'
  it.a1.unit01.lesson03.teach.io_sono_sam:
    title: Io sono Sam.
    gloss: Je suis Sam.
    note: Une simple variante de *mi chiamo*, avec *essere* (être) suivi directement du prénom.
  it.a1.unit01.lesson03.teach.piacere:
    title: Piacere, Piacere di conoscerla
    gloss: enchanté, enchanté de faire votre connaissance
    note: '*Piacere* seul est une façon brève et courante de dire « enchanté » dans les deux registres. *Piacere di conoscerla* est la version plus complète et formelle, employée avec *Lei*.'
    example_gloss:
    - Enchanté, Sam !
    - Enchanté de faire votre connaissance, madame Elena.
  it.a1.unit01.lesson03.teach.benvenuto:
    title: Benvenuto in ufficio!
    gloss: Bienvenue au bureau !
    note: '*Benvenuto* est la forme masculine de « bienvenue » (pour un homme ; pour une femme, on dit *Benvenuta*).'
  it.a1.unit01.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: Merci beaucoup.
    note: Une façon plus forte et plus appuyée de remercier qu'un simple *Grazie*.
