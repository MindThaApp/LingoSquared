course:
  title: Italien A1
  description: 'Italien pour débutants pour parler des animaux de compagnie et des animaux courants : les nommer, les soins de base (promener, nourrir, jouer), dire quels animaux on aime même sans en avoir, et le pluriel italien.'
units:
  it.a1.unit43.animali:
    title: Les animaux et les animaux de compagnie
lessons:
  it.a1.unit43.lesson01.cane_gatto_pesce_e:
    title: Le chien, le chat, le poisson et l’oiseau
  it.a1.unit43.lesson02.prendersi_cura_di_un:
    title: S’occuper d’un animal de compagnie
  it.a1.unit43.lesson03.amare_gli_animali:
    title: Adorer les animaux
  it.a1.unit43.lesson04.marco_chiede_del_cane:
    title: Marco interroge Giulia sur son chien
  it.a1.unit43.lesson05.marco_chiara_e_luca:
    title: Marco, Chiara et Luca parlent des animaux
  it.a1.unit43.lesson06.l_uccello_di_nina:
    title: L’oiseau de Nina
teaching:
  it.a1.unit43.lesson01.teach.l_animale_un:
    title: Un animal, un animal de compagnie
    gloss: l’animal / un animal de compagnie
    note: '*Animale* est le mot général ; *animale domestico* signifie animal de compagnie (littéralement « animal domestique »).'
    example_gloss:
    - Un chien est un animal.
    - Un chien est aussi un animal de compagnie.
  it.a1.unit43.lesson01.teach.il_cane_il:
    title: Le chien et le chat
    gloss: le chien / le chat
    example_gloss:
    - Giulia a un chien.
    - Luca a un chat.
  it.a1.unit43.lesson01.teach.il_pesce_l:
    title: Le poisson et l’oiseau
    gloss: le poisson / l’oiseau
    example_gloss:
    - Grand-père a un poisson.
    - Nina a un oiseau.
  it.a1.unit43.lesson01.teach.hai_un_animale:
    title: As-tu un animal de compagnie ?
    gloss: As-tu un animal de compagnie ?
    note: '*Hai ...?* est la forme *tu* de *avere*. Seule l''intonation transforme l''affirmation en question.'
  it.a1.unit43.lesson01.teach.si_ho_un:
    title: Oui, j’ai un chien
    gloss: Oui, j’ai un chien.
    note: Une réponse affirmative simple qui utilise le nouveau vocabulaire de cette unité.
  it.a1.unit43.lesson01.teach.no_non_ho:
    title: Non, je n’ai pas d’animal de compagnie
    gloss: Non, je n’ai pas d’animal de compagnie.
    note: 'Pour dire que tu n''as pas quelque chose, place *non* devant le verbe : *non ho*. Voir la note de grammaire.'
  it.a1.unit43.lesson01.teach.per_dire_che:
    title: Non devant le verbe
    gloss: 'Pour dire que tu n''as pas quelque chose, place non devant le verbe : Non ho tempo, Non ho animali domestici.'
    note: 'Après *non ho*, le nom n''a généralement pas d''article : *non ho tempo*, *non ho animali*. Le français fait de même avec « pas de » : « je n''ai pas de temps ».'
  it.a1.unit43.lesson02.teach.portare_a_spasso:
    title: Promener un animal
    gloss: promener un animal
    note: '*Portare a spasso* est une expression figée pour promener un animal. Le pronom se place devant le verbe : *lo porto a spasso*.'
    example_gloss: Je promène le chien tous les jours.
  it.a1.unit43.lesson02.teach.il_pronome_lo:
    title: Les pronoms se placent devant le verbe
    gloss: 'Le pronom lo remplace le chien et se place devant le verbe : lo porto a spasso, gli do da mangiare.'
    note: 'Comme en français (« je le promène », « je lui donne à manger »), le pronom se place avant le verbe : *lo* et *gli* précèdent le verbe, *lo porto*, *gli do*.'
  it.a1.unit43.lesson02.teach.dare_da_mangiare:
    title: Donner à manger
    gloss: donner à manger
    example_gloss: Je donne à manger au chat tous les jours.
  it.a1.unit43.lesson02.teach.giocare_con:
    title: Jouer avec
    gloss: jouer avec
    example_gloss: Luca joue avec son chat.
  it.a1.unit43.lesson02.teach.porto_a_spasso:
    title: Je promène le chien tous les jours
    gloss: Je promène le chien tous les jours.
    note: '*Ogni giorno* (tous les jours) se place à la fin de la phrase, comme dans *porto a spasso il cane ogni giorno*.'
  it.a1.unit43.lesson02.teach.do_da_mangiare:
    title: Je donne à manger au chat tous les jours
    gloss: Je donne à manger au chat tous les jours.
    note: '*Dare da mangiare* (nourrir) signifie littéralement « donner à manger ». *Do* est la forme *io* de *dare*.'
  it.a1.unit43.lesson03.teach.il_plurale_cambia:
    title: 'Pluriel : il cane -> i cani'
    gloss: 'Le pluriel change la dernière voyelle et l''article : il cane -> i cani, il gatto -> i gatti, l''uccello -> gli uccelli, il pesce -> i pesci.'
    note: Le modèle régulier du pluriel italien, présenté ici pour la première fois avec des noms d'animaux comme exemples.
  it.a1.unit43.lesson03.teach.i_cani_i:
    title: Les chiens et les chats
    gloss: chiens / chats
    example_gloss:
    - Marco aime les chiens.
    - Chiara aime les chats.
  it.a1.unit43.lesson03.teach.i_pesci_gli:
    title: Les poissons et les oiseaux
    gloss: poissons / oiseaux
    example_gloss:
    - J’adore les poissons.
    - Grand-père adore les oiseaux.
  it.a1.unit43.lesson03.teach.amo_gli_animali:
    title: J’adore les animaux
    gloss: J’adore les animaux.
    note: '*Amare* (aimer) se construit avec un complément direct : *amo gli animali*. Le nom au pluriel demande l''article pluriel *gli*.'
  it.a1.unit43.lesson03.teach.chiara_ama_i:
    title: Chiara aime les chats, mais n'a pas d'animal de compagnie
    gloss: Chiara aime les chats, mais elle n'a pas d'animal de compagnie.
    note: Cette phrase souligne la différence entre adorer un animal et en avoir un.
  it.a1.unit43.lesson04.teach.marco_hai_un:
    title: Marco demande à Giulia si elle a un animal de compagnie
    gloss: 'Marco : Tu as un animal de compagnie, Giulia ?'
  it.a1.unit43.lesson04.teach.giulia_si_ho:
    title: Giulia a un chien
    gloss: 'Giulia : Oui, j''ai un chien.'
  it.a1.unit43.lesson04.teach.marco_com_e:
    title: Marco demande comment il est
    gloss: 'Marco : Comment est-il ?'
    note: '*Com''è?* s''emploie aussi pour les animaux. La réponse utilise *è* ou *ha* : *è piccolo*, *ha il pelo castano*.'
  it.a1.unit43.lesson04.teach.giulia_ha_il:
    title: Giulia décrit son chien
    gloss: 'Giulia : Il a le poil brun et il est petit.'
    note: On réutilise le vocabulaire de la couleur des cheveux et de la taille, étudié pour décrire l’apparence, mais cette fois pour parler du pelage d’un animal.
  it.a1.unit43.lesson04.teach.un_animale_e:
    title: Les animaux sont masculins ou féminins
    gloss: 'Un animal est masculin ou féminin comme une personne : il cane est lui, la gatta est lei.'
    note: 'Comme en français, chaque nom est masculin ou féminin : un chien est *lui*, un chat est *lei*, et les pronoms suivent (*lo*, *la*).'
  it.a1.unit43.lesson04.teach.marco_lo_porti:
    title: Marco demande si elle le promène
    gloss: 'Marco : Tu le promènes tous les jours ?'
  it.a1.unit43.lesson04.teach.giulia_si_lo:
    title: Giulia décrit sa routine
    gloss: 'Giulia : Oui, je le promène tous les jours et je lui donne à manger.'
  it.a1.unit43.lesson05.teach.marco_e_chiara:
    title: Marco, Chiara et Luca parlent des animaux
    gloss: 'Marco et Chiara aiment tous les deux les animaux, mais aucun des deux n''a d''animal de compagnie. Marco aime les chiens et Chiara aime les chats. Luca, lui, a un animal de compagnie : un chat. Il joue souvent avec son chat et lui donne à manger tous les jours. Et toi, as-tu un animal de compagnie ?'
    note: Ce texte met en contraste le fait d’adorer un animal et celui d’en avoir réellement un.
    glosses:
      amano: adorer
      entrambi: tous les deux
      animali: animaux
      due: deux (nessuno dei due = aucun des deux)
      domestico: domestique (animale domestico = animal de compagnie)
      cani: chiens
      gatti: chats
      gatto: chat
      gioca: joue
      dà: donne
      ogni: tous les
      mangiare: manger (dare da mangiare = donner à manger)
  it.a1.unit43.lesson05.teach.luca_gioca_spesso:
    title: Luca joue souvent avec son chat
    gloss: Luca joue souvent avec son chat.
    note: '*Spesso* (souvent) se place après le verbe : *gioca spesso*. *Giocare con* signifie jouer avec.'
  it.a1.unit43.lesson05.teach.amo_i_cani:
    title: J’adore les chiens. Je n’ai pas d’animal de compagnie.
    gloss: J’adore les chiens. Je n’ai pas d’animal de compagnie.
    note: Un modèle de réponse en deux phrases, prêt à être réutilisé pour l’exercice d’expression écrite de cette unité.
  it.a1.unit43.lesson06.teach.giulia_nina_hai:
    title: Giulia interroge Nina
    gloss: 'Giulia : Nina, tu as aussi un animal de compagnie ?'
  it.a1.unit43.lesson06.teach.nina_si_ho:
    title: Nina a un oiseau qui s’appelle Pico
    gloss: 'Nina : Oui, j’ai un oiseau. Il s’appelle Pico.'
    note: '*Si chiama Pico* signifie « il s''appelle Pico » ; comme en français, le verbe est réfléchi.'
  it.a1.unit43.lesson06.teach.marco_che_bello:
    title: Marco réagit
    gloss: 'Marco : Comme c''est bien ! Qu''est-ce que tu fais avec lui tous les jours ?'
  it.a1.unit43.lesson06.teach.nina_gli_do:
    title: Nina le nourrit tous les jours
    gloss: 'Nina : Je le nourris tous les jours.'
  it.a1.unit43.lesson06.teach.marco_anch_io:
    title: Marco aime aussi les oiseaux
    gloss: 'Marco : Moi aussi, j''aime les oiseaux.'
  it.a1.unit43.lesson06.teach.giulia_che_bello:
    title: Giulia conclut la conversation
    gloss: 'Giulia : Comme c''est bien que nous aimions tous les trois les animaux !'
    note: Une phrase de conclusion qui réunit ce que l'on sait des animaux des trois personnages.
