    gloss: 'Marco : L''employé dit : Allez à la sortie de secours ! Il y a un incendie !'
  it.a1.unit56.lesson06.teach.giulia_calma_luca:
    title: Giulia rassure Luca
    gloss: 'Giulia : Calme-toi, Luca. Tout le monde est dehors. C''est bien.'
