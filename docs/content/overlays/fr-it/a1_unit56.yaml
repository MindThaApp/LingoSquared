  it.a1.unit56.lesson05.teach.al_caffe_linguistico:
    title: Un texte sur l’incendie
    gloss: 'Au café linguistique de la bibliothèque, il y a un incendie. L''employé dit : Allez à la sortie de secours ! Nina a besoin d''aide. Giulia est avec Nina. Marco appelle les pompiers. Tout le monde est dehors. C''est bien !'
    note: Un résumé au présent de la scène de l'incendie, avec les paroles de l'employé en discours direct.
    glosses:
      caffè: café (caffè linguistico = café linguistique)
      biblioteca: bibliothèque
      incendio: feu
      dipendente: employé
      dice: dit
      Andate: aller (andate = allez, impératif pluriel)
      emergenza: urgence (uscita di emergenza = sortie de secours)
      aiuto: aide
      bisogno: besoin (ho bisogno di = j'ai besoin de)
      chiama: appelle
      vigili: pompiers (vigili del fuoco = pompiers)
      tutti: tout le monde
      fuori: dehors
      bene: bien, d'accord (va bene = c'est bien)
  it.a1.unit56.lesson05.teach.sono_tutti_fuori:
    title: Tout le monde est dehors
    gloss: Tout le monde est dehors. C’est bien.
