teaching:
  it.a1.unit07.lesson01.teach.caffe_cornetto:
    title: il caffè, il cornetto
    gloss: le café, le croissant
    note: 'Les deux noms sont masculins (*il*) : *caffè* est l’espresso italien de tous les jours, *cornetto* la viennoiserie typique du petit-déjeuner.'
    example_gloss:
    - Je voudrais un café, s’il vous plaît.
    - Je voudrais un croissant, s’il vous plaît.
  it.a1.unit07.lesson01.teach.panino_acqua:
    title: il panino, l'acqua
    gloss: le sandwich, l’eau
    note: '*panino* est masculin (*il*) ; *acqua* est féminin mais prend *l''* devant une voyelle.'
    example_gloss:
    - Je voudrais un sandwich, s’il vous plaît.
    - Je voudrais une eau, s’il vous plaît.
  it.a1.unit07.lesson01.teach.cosa_desidera:
    title: Cosa desidera?
    gloss: Que désirez-vous ?
    note: La question de politesse, à la forme *Lei*, que le barman pose à un client.
  it.a1.unit07.lesson01.teach.vorrei_un_caffe:
    title: Vorrei un caffè e un cornetto, per favore.
    gloss: Je voudrais un café et un croissant, s’il vous plaît.
    note: '*Vorrei* (« je voudrais ») est la façon polie de commander, suivi de *e* (« et ») pour ajouter un deuxième article.'
  it.a1.unit07.lesson02.teach.vorrei_due_caffe:
    title: Vorrei due caffè, per favore.
    gloss: Je voudrais deux cafés, s’il vous plaît.
    note: '*due* (« deux ») remplace l’article quand on commande plus d’un article.'
  it.a1.unit07.lesson02.teach.per_lei:
    title: E per Lei?
    gloss: Et pour vous ?
    note: '*E per Lei?* demande au deuxième client ce qu’il désire, avec le *Lei* de politesse.'
  it.a1.unit07.lesson02.teach.basta_cosi:
    title: Basta così, grazie.
    gloss: C’est tout, merci.
    note: La façon habituelle de terminer une commande quand on ne veut plus rien.
  it.a1.unit07.lesson03.teach.il_menu_il_conto:
    title: il menù, il conto
    gloss: la carte, l’addition
    note: Les deux noms sont masculins (*il*).
    example_gloss:
    - L’addition, s’il vous plaît.
  it.a1.unit07.lesson03.teach.panino_acqua_conto:
    title: Un panino e un'acqua, per favore.
    gloss: Un sandwich et une eau, s’il vous plaît.
    note: '*un''acqua* utilise la forme élidée de *una* devant *acqua*, qui commence par une voyelle.'
