teaching:
  it.a1.unit22.lesson01.teach_felice_triste:
    title: felice, triste
    gloss: heureux, triste
    note: '*Felice* et *triste* se terminent par *-e* : on utilise donc la même forme au masculin et au féminin (*Sam è felice*, *Elena è felice*).'
    example_gloss:
    - Je suis heureux aujourd’hui.
    - Je suis triste aujourd’hui.
  it.a1.unit22.lesson01.teach_stanco_nervoso:
    title: stanco, nervoso
    gloss: fatigué, nerveux
    note: Ces adjectifs changent de terminaison ; cette unité présente les formes masculines, celles du dictionnaire.
    example_gloss:
    - Sam est fatigué.
    - Je suis nerveux aujourd’hui.
  it.a1.unit22.lesson01.teach_come_ti_senti:
    title: Come ti senti?
    gloss: Comment te sens-tu ?
    note: '*Ti senti* est la forme familière (tu) de « tu te sens », utilisée avec un ami.'
    example_gloss:
    - Comment tu te sens aujourd’hui ?
  it.a1.unit22.lesson01.teach_sono_felice:
    title: Sono felice.
    gloss: Je suis heureux.
    note: On utilise *sono* suivi d’un adjectif qui exprime un sentiment.
    example_gloss:
    - Je suis heureux aujourd’hui.
  it.a1.unit22.lesson02.teach_perche:
    title: perché
    gloss: parce que / pourquoi
    note: Dans cette unité, *perché* donne la cause d’un sentiment.
    example_gloss:
    - Je suis heureux parce qu’il y a du soleil aujourd’hui.
  it.a1.unit22.lesson02.teach_sono_felice_perche:
    title: Sono felice perché oggi c'è il sole.
    gloss: Je suis heureux parce qu’il y a du soleil aujourd’hui.
    note: C’est une phrase complète avec un sentiment et sa cause.
    example_gloss:
    - À Milan, je suis heureux parce qu’il y a du soleil aujourd’hui.
  it.a1.unit22.lesson02.teach_sono_un_poco_stanca:
    title: Sono un po' stanca.
    gloss: Je suis un peu fatiguée.
    note: '*Stanca* est au féminin ici, car c’est Elena qui parle.'
    example_gloss:
    - Aujourd’hui, je suis un peu fatiguée.
  it.a1.unit22.lesson02.teach_ma_sto_bene:
    title: ma sto bene
    gloss: mais je vais bien
    note: '*Ma* oppose la fatigue au fait d’aller bien.'
    example_gloss:
    - Je suis fatigué, mais je vais bien.
