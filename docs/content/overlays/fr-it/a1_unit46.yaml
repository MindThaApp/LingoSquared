    title: J’utilise mon téléphone tous les jours
    gloss: J’utilise mon téléphone tous les jours.
    note: '*Ogni giorno* (tous les jours) est déjà connu et se place à la fin. *Uso* est la forme en *io* de *usare*.'
  it.a1.unit46.lesson02.teach.l_app:
    title: L’application
    gloss: l’application
    example_gloss: J’ai une application pour les prévisions météo.
  it.a1.unit46.lesson02.teach.il_messaggio:
    title: Le message
    gloss: le message
    example_gloss: Je vais envoyer un message via l’application.
  it.a1.unit46.lesson02.teach.conosci_gia_le:
    title: 'Messaggio : envoyer ou lire'
    gloss: Tu connais déjà le previsioni del tempo. Un message peut être envoyé (io mando, lui manda) ou lu (io leggo, lui legge).
    note: Associe le nouveau mot au nom composé déjà appris dans l’unité sur la météo.
  it.a1.unit46.lesson02.teach.giulia_manda_un:
    title: Giulia envoie un message avec l’appli
    gloss: Giulia envoie un message avec l’appli.
    note: '*Mandare* signifie envoyer ; *con l’app* (avec l’appli) : *con* est la préposition qui indique le moyen.'
  it.a1.unit46.lesson02.teach.marco_legge_il:
    title: Marco lit le message
    gloss: Marco lit le message.
  it.a1.unit46.lesson03.teach.cercare:
    title: Chercher
    gloss: chercher
    example_gloss: Je consulte les prévisions météo.
  it.a1.unit46.lesson03.teach.cercare_e_un:
    title: Cercare et usare sont réguliers
    gloss: 'Cercare et usare sont des verbes réguliers en -are : io cerco, tu cerchi ; io uso, tu usi. Cercare ajoute un h devant le i.'
    note: 'Le h de *cerchi* garde le son dur du c : compare *cerco* (io) et *cerchi* (tu).'
  it.a1.unit46.lesson03.teach.luca_cerca_le:
    title: Luca cherche la météo
    gloss: Luca cherche la météo.
  it.a1.unit46.lesson03.teach.poi_va_a:
    title: Ensuite, il va courir
    gloss: Ensuite, il va courir.
    note: '*Poi va a correre* : *andare a* + infinitif signifie aller faire quelque chose. *Va* vient de *andare*.'
  it.a1.unit46.lesson04.teach.giulia_facciamo_sport:
    title: Giulia fait une proposition
    gloss: 'Giulia : On fait du sport samedi à dix heures ?'
  it.a1.unit46.lesson04.teach.marco_buona_idea:
    title: Marco est d’accord
    gloss: 'Marco : Bonne idée ! Je regarde la météo.'
    note: '*Buona idea !* utilise le féminin *buona* parce que *idea* est féminin. *Cerco* est la forme en *io* de *cercare*.'
  it.a1.unit46.lesson04.teach.marco_sabato_c:
    title: Marco vérifie la météo
    gloss: 'Marco : Samedi, il y a du soleil !'
    note: '*C’è il sole* (il y a du soleil) signifie littéralement « il y a le soleil ». *C’è* est la contraction de *ci è*.'
  it.a1.unit46.lesson04.teach.luca_vedo_il:
    title: Luca voit le message
    gloss: 'Luca : Je vois le message. À samedi !'
  it.a1.unit46.lesson04.teach.conosci_gia_arrivederci:
    title: A + un jour
    gloss: 'Tu connais déjà Arrivederci ! Tu peux aussi nommer un jour : A sabato !, A domani !'
    note: Étend la formule d’au revoir de l’unité sur les salutations à un jour précis.
  it.a1.unit46.lesson05.teach.giulia_chiama_marco:
    title: Qui utilise quoi ?
    gloss: Giulia appelle Marco tous les jours. Elle utilise son téléphone, pas d’appli. Marco n’a pas d’ordinateur à la maison, mais il utilise internet sur son téléphone. Luca cherche la météo tous les matins. Ensuite, il va courir. Chiara envoie souvent un message à Giulia. Et toi, tu utilises ton téléphone tous les jours ?
    note: Compare les habitudes des quatre personnages en matière d’appareils, sur le modèle du texte comparatif de l’unité sur le sport.
    glosses:
      chiama: appelle
      ogni: tous les
      giorno: jour
      usa: utilise
      telefono: téléphone
      app: application
      computer: ordinateur
      casa: maison (a casa = à la maison)
      internet: Internet
      cerca: consulte
      mattina: matin
      previsioni: prévisions (previsioni del tempo = prévisions météo)
      va: va
      correre: courir
      manda: envoie
      spesso: souvent
      messaggio: message
      usi: tu utilises
  it.a1.unit46.lesson05.teach.luca_cerca_le:
    title: Luca cherche la météo tous les matins
    gloss: Luca cherche la météo tous les matins.
  it.a1.unit46.lesson05.teach.chiara_manda_spesso:
    title: Chiara écrit souvent à Giulia
    gloss: Chiara envoie souvent un message à Giulia.
  it.a1.unit46.lesson06.teach.giulia_vedo_il:
    title: Giulia confirme le plan
    gloss: 'Giulia : Je vois le message. On fait du sport samedi à dix heures au parc ?'
  it.a1.unit46.lesson06.teach.marco_si_e:
    title: Marco confirme la météo
    gloss: 'Marco : Oui, et samedi il y a du soleil !'
  it.a1.unit46.lesson06.teach.luca_io_corro:
    title: Le programme de Luca
    gloss: 'Luca : Moi, je cours. Ensuite, je joue aussi au foot.'
    note: '*Poi* (ensuite) met les actions dans l’ordre. *Gioco a calcio* : *giocare a* + sport.'
  it.a1.unit46.lesson06.teach.chiara_io_preferisco:
    title: Le programme de Chiara
    gloss: 'Chiara : Moi, je préfère nager, mais je viens aussi au parc.'
    note: '*Preferisco nuotare* (je préfère nager) est la façon directe d’exprimer une préférence. *Anch’io* (moi aussi) s’écrit en un seul mot avec une apostrophe.'
  it.a1.unit46.lesson06.teach.giulia_bello_a:
    title: Giulia conclut la conversation
    gloss: 'Giulia : Super ! À samedi au parc !'
    note: Conclut en une phrase l’échange de messages de cette unité et le programme de l’unité sur le sport.
