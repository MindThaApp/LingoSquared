course:
  title: Italien A1
  description: 'Italien pour débutants afin de parler de ses loisirs : vocabulaire des loisirs, expressions de fréquence, demander et dire ce que l’on fait pendant son temps libre, et comparer les loisirs de deux personnes.'
units:
  it.a1.unit41.hobby:
    title: Les loisirs et le temps libre
lessons:
  it.a1.unit41.lesson01.leggere_fare_sport_e:
    title: Lire, faire du sport et cuisiner
  it.a1.unit41.lesson02.musica_disegno_e_videogiochi:
    title: Musique, dessin et jeux vidéo
  it.a1.unit41.lesson03.cosa_fai_nel_tempo:
    title: Que fais-tu pendant ton temps libre ?
  it.a1.unit41.lesson04.giulia_e_marco_parlano:
