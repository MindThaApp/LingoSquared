  it.a1.unit41.lesson05.marco_e_giulia_confrontano:
    title: Marco et Giulia comparent leurs loisirs
  it.a1.unit41.lesson06.programmare_un_fine_settimana:
    title: Organiser un week-end ensemble
teaching:
  it.a1.unit41.lesson01.teach.leggere_fare_sport:
    title: Lire, faire du sport, cuisiner
    gloss: lire, faire de l’exercice / du sport, cuisiner
    note: 'Trois verbes de loisirs courants à l’infinitif : *leggere* (lire), *fare sport* (faire du sport) et *cucinare* (cuisiner). Les infinitifs italiens se terminent en -are, -ere ou -ire.'
    example_gloss:
    - J’aime lire un livre.
    - Je fais du sport le samedi.
    - J’aime cuisiner pour des amis.
  it.a1.unit41.lesson01.teach.il_tempo_libero:
    title: Le temps libre
    gloss: temps libre
    note: '*Il tempo libero* est un nom masculin, donc il prend *il*. C’est l’expression clé pour parler de ses loisirs.'
    example_gloss: Pendant mon temps libre, j’aime lire.
  it.a1.unit41.lesson01.teach.nel_mio_tempo:
    title: Dire ce que tu fais pendant ton temps libre
    gloss: Pendant mon temps libre, j’aime lire.
    note: '*Leggo* est la forme *io* de *leggere* (lire). Comme en espagnol, l’italien omet le plus souvent le pronom sujet : on dit *Leggo*, plutôt que *Io leggo*.'
  it.a1.unit41.lesson02.teach.ascoltare_musica_disegnare:
    title: Musique, dessin, jeux vidéo
    gloss: écouter de la musique, dessiner, jouer aux jeux vidéo
    note: 'Trois autres loisirs : *ascoltare musica* (écouter de la musique), *disegnare* (dessiner) et *giocare ai videogiochi* (jouer aux jeux vidéo).'
    example_gloss:
    - J’aime écouter de la musique.
    - Je dessine souvent.
    - J’aime jouer aux jeux vidéo avec des amis.
  it.a1.unit41.lesson02.teach.ascolto_volentieri_musica:
    title: Dire que tu aimes écouter de la musique
    gloss: J’aime écouter de la musique.
    note: '*Ascoltare* se construit avec un complément direct : *ascolto musica*, sans mot pour « à » entre les deux.'
  it.a1.unit41.lesson02.teach.gioco_volentieri_ai:
    title: Dire que tu aimes jouer aux jeux vidéo avec des amis
    gloss: J’aime jouer aux jeux vidéo avec des amis.
    note: '*Con gli amici* signifie avec des amis. *Gli* est l’article pluriel devant un nom masculin qui commence par une voyelle.'
  it.a1.unit41.lesson03.teach.sempre_spesso_a:
    title: Toujours, souvent, parfois, jamais
    gloss: toujours, souvent, parfois, jamais
    note: 'Quatre mots de fréquence. *Mai* (jamais) exige *non* devant le verbe : *non gioco mai*.'
    example_gloss:
    - Je fais toujours du sport le samedi.
    - Je lis souvent un livre.
    - Je dessine parfois.
    - Je ne joue jamais aux jeux vidéo.
  it.a1.unit41.lesson03.teach.ogni_settimana_ogni:
    title: Chaque semaine, chaque week-end
    gloss: chaque semaine, chaque week-end
    note: '*Ogni* (chaque, tous les) ne change jamais : *ogni settimana*, *ogni fine settimana*. Voir la fiche suivante.'
    example_gloss:
    - Je cuisine pour des amis chaque semaine.
    - Je fais du sport chaque week-end.
  it.a1.unit41.lesson03.teach.con_mai_il:
    title: Mai demande non ; ogni ne change jamais
    gloss: 'Avec mai, le verbe prend aussi non : Non gioco mai. Ogni reste identique devant tous les noms : ogni settimana, ogni fine settimana.'
    note: 'Comme en français (« je ne joue jamais »), l’italien emploie deux éléments : *non gioco mai*. Attention : *ogni* est toujours suivi d’un nom au singulier, alors que le français dit souvent « tous les » + pluriel.'
  it.a1.unit41.lesson03.teach.cosa_fai_nel:
    title: Poser une question sur le temps libre
    gloss: Que fais-tu pendant ton temps libre ?
    note: 'C’est la question centrale de cette unité : réutilise-la pour interroger quelqu’un sur ses loisirs.'
  it.a1.unit41.lesson04.teach.giulia_passeggiamo_spesso:
    title: Giulia parle des loisirs
    gloss: 'Giulia : Nous nous promenons souvent ensemble. Mais toi, que fais-tu d’autre pendant ton temps libre, Marco ?'
    note: '*Passeggiamo* est la forme *noi* (nous) de *passeggiare*. *Spesso* se place après le verbe.'
  it.a1.unit41.lesson04.teach.marco_cucino_volentieri:
    title: Les loisirs de Marco
    gloss: 'Marco : J’aime cuisiner, même à la maison. Et je fais souvent du sport.'
    note: '*Anche a casa* (aussi à la maison) montre que Marco cuisine par plaisir, pas seulement pour le travail. *A casa* signifie à la maison, sans article.'
  it.a1.unit41.lesson04.teach.giulia_cucini_anche:
    title: Giulia est surprise
    gloss: 'Giulia : Tu cuisines aussi à la maison ? Tu cuisines déjà toute la journée au travail !'
    note: '*Già* (déjà) et *tutto il giorno* (toute la journée) montrent combien Marco cuisine déjà au travail.'
  it.a1.unit41.lesson04.teach.marco_si_ma:
    title: Marco explique
    gloss: 'Marco : Oui, mais cuisiner me détend. Et toi, qu’est-ce que tu aimes faire ?'
    note: '*Cucinare mi rilassa* signifie littéralement « cuisiner me détend » : l’activité est le sujet et *mi* (me) est le complément.'
  it.a1.unit41.lesson04.teach.giulia_leggo_volentieri:
    title: Les loisirs de Giulia
    gloss: 'Giulia : J’aime lire et j’écoute souvent de la musique.'
    note: 'Deux loisirs reliés par *e* (et). Les deux verbes restent à la forme *io* : *leggo* et *ascolto*.'
  it.a1.unit41.lesson04.teach.marco_giochi_anche:
    title: Marco demande si elle joue aux jeux vidéo
    gloss: 'Marco : Tu joues aussi aux jeux vidéo ?'
    note: 'Une question fermée garde l’ordre de la phrase affirmative, seule l’intonation monte : *Giochi anche ai videogiochi?* *Anche* signifie aussi.'
  it.a1.unit41.lesson04.teach.giulia_no_non:
    title: Giulia répond
    gloss: 'Giulia : Non, je ne joue jamais aux jeux vidéo. Mais je dessine parfois !'
    note: '*Non ... mai* (jamais) et *a volte* (parfois) sont opposés dans une même réponse. *Ma* signifie mais.'
  it.a1.unit41.lesson05.teach.marco_e_io:
    title: Comparer des loisirs
    gloss: Marco et moi, nous nous promenons souvent ensemble. Mais nous avons aussi d’autres loisirs. Marco aime cuisiner, même à la maison, et il fait souvent du sport. J’aime lire et j’écoute souvent de la musique. Je dessine parfois, mais je ne joue jamais aux jeux vidéo. Et toi, qu’est-ce que tu aimes faire pendant ton temps libre ?
    note: Le message de Giulia résume ce qui a été dit et se termine par la question centrale de l’unité adressée au lecteur.
    glosses:
      passeggiamo: nous nous promenons
      spesso: souvent
      insieme: ensemble
      altri: autre
      cucina: cuisine
      volentieri: volontiers
      casa: maison (a casa = à la maison)
      sport: sport (fa sport = fait du sport)
      leggo: lire
      ascolto: écouter
      musica: musique
      disegno: dessiner
      volte: fois (a volte = parfois)
      videogiochi: jeux vidéo
      mai: jamais
      libero: libre
      tempo: temps
  it.a1.unit41.lesson06.teach.marco_cosa_fai:
    title: Marco demande ce que Giulia fait ce week-end
    gloss: 'Marco : Qu’est-ce que tu fais ce week-end ?'
    note: '*Fine settimana* est masculin, donc on dit *questo fine settimana* (ce week-end). *Fai* est la forme *tu* de *fare* (faire).'
  it.a1.unit41.lesson06.teach.giulia_non_lo:
    title: Giulia hésite
    gloss: 'Giulia : Je ne sais pas encore. J’aime lire, mais je veux aussi sortir.'
    note: '*Non lo so ancora* (je ne sais pas encore) : *lo* représente la chose qu’on ne sait pas et se place avant le verbe, comme « le » dans « je ne le sais pas ». *Uscire* signifie sortir.'
  it.a1.unit41.lesson06.teach.marco_facciamo_una:
    title: Marco propose un programme
    gloss: 'Marco : On se promène ensemble ? Ensuite, c’est moi qui cuisine pour nous.'
    note: '*Poi* (ensuite, après) met les projets dans l’ordre. *Cucino io* (avec *io* après le verbe) insiste sur « c’est moi qui cuisinerai ».'
  it.a1.unit41.lesson06.teach.giulia_buona_idea:
    title: Giulia est d’accord
    gloss: 'Giulia : Bonne idée ! J’aime autant me promener que cuisiner.'
    note: '*Sia ... sia ...* signifie aussi bien ... que ... : *mi piace sia passeggiare sia cucinare*.'
  it.a1.unit41.lesson06.teach.marco_perfetto_allora:
    title: Marco confirme
    gloss: 'Marco : Parfait. Alors on se voit samedi !'
    note: '*Ci vediamo sabato* (à samedi) : pas d’article devant le jour quand il s’agit du prochain, comme en français.'
