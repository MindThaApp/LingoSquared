teaching:
  it.a1.unit16.lesson01.teach.mi_fa_male:
    title: mi fa male
    gloss: ça fait mal / ... fait mal
    note: '*mi fa male* signifie littéralement « ça me fait mal » : ajoute une partie du corps après pour dire que cette partie te fait mal.'
    example_gloss:
    - J’ai mal à la tête.
  it.a1.unit16.lesson01.teach.la_testa_la_pancia_la_gola:
    title: la testa, la pancia, la gola
    gloss: la tête, le ventre, la gorge
    note: Trois parties du corps courantes, utilisées avec *mi fa male* pour exprimer une douleur.
    example_gloss:
    - J’ai mal au ventre.
    - J’ai mal à la gorge.
  it.a1.unit16.lesson01.teach.cosa_hai:
    title: Cosa hai?
    gloss: Qu’est-ce qui ne va pas ?
    note: '*Cosa hai?* (littéralement « Qu’est-ce que tu as ? ») sert à demander à quelqu’un ce qui ne va pas.'
  it.a1.unit16.lesson01.teach.mi_fa_male_la_testa:
    title: Mi fa male la testa.
    gloss: J’ai mal à la tête.
    note: '*la testa* (la tête) est féminin, donc il se construit avec *la*.'
  it.a1.unit16.lesson02.teach.non_mi_sento_bene:
    title: non mi sento bene
    gloss: je ne me sens pas bien
    note: '*mi sento* (je me sens) plus *bene* (bien) ; *non* met la phrase à la forme négative pour dire que tu ne te sens pas bien.'
    example_gloss:
    - Je ne me sens pas bien aujourd’hui.
  it.a1.unit16.lesson02.teach.la_febbre_la_tosse:
    title: la febbre, la tosse
    gloss: la fièvre, la toux
    note: 'Des symptômes courants, utilisés avec *avere* (avoir) : *Ho la febbre* (J’ai de la fièvre).'
    example_gloss:
    - J’ai de la fièvre.
    - Je tousse.
  it.a1.unit16.lesson02.teach.non_mi_sento_bene_phrase:
    title: Non mi sento bene.
    gloss: Je ne me sens pas bien.
    note: Une phrase générale pour dire que tu ne te sens pas bien, utile avant de nommer un symptôme précis.
  it.a1.unit16.lesson02.teach.ho_la_febbre_e_la_tosse:
    title: Ho la febbre e la tosse.
    gloss: J’ai de la fièvre et je tousse.
    note: '*Ho* (j’ai) plus deux symptômes reliés par *e* (et).'
  it.a1.unit16.lesson03.teach.il_dottore_la_dottoressa:
    title: il dottore, la dottoressa
    gloss: le médecin (homme), le médecin (femme)
    note: '*il dottore* et *la dottoressa* sont les formes masculine et féminine de « médecin ».'
    example_gloss:
    - Je dois aller chez le médecin.
    - Je dois aller chez la médecin.
  it.a1.unit16.lesson03.teach.riposa_la_medicina:
    title: riposa, la medicina
    gloss: repose-toi !, le médicament
    note: '*riposa* est l’impératif informel de *riposare* (se reposer) ; *la medicina* est le médicament.'
    example_gloss:
    - Repose-toi aujourd’hui.
    - Prends ce médicament.
  it.a1.unit16.lesson03.teach.devo_andare_dal_dottore:
    title: Devo andare dal dottore.
    gloss: Je dois aller chez le médecin.
    note: '*Devo* (je dois) plus *andare dal dottore* (aller chez le médecin) ; *dal* est la contraction de *da* + *il*.'
  it.a1.unit16.lesson03.teach.prendi_questa_medicina_e_riposa:
    title: Prendi questa medicina e riposa.
    gloss: Prends ce médicament et repose-toi.
    note: '*Prendi* (prends, impératif informel) plus *questa medicina* (ce médicament) et *riposa* (repose-toi).'
