teaching:
  it.a1.unit05.lesson01.teach.che_ore_sono:
    title: Che ore sono?
    gloss: Quelle heure est-il ?
    note: La façon habituelle de demander l’heure en italien ; littéralement « quelles heures sont-elles ? », avec un verbe au pluriel.
  it.a1.unit05.lesson01.teach.sono_le_tre:
    title: Sono le tre.
    gloss: Il est trois heures.
    note: '*Sono le* + un nombre indique l’heure, sauf pour une heure.'
  it.a1.unit05.lesson01.teach.ore_una_dodici:
    title: l'una, le due, le tre, le dodici
    gloss: une heure, deux heures, trois heures, douze heures
    note: Pour une heure, on dit exceptionnellement *è l’una* (singulier) au lieu de *sono le* (pluriel), car « une » est singulier.
    example_gloss:
    - Il est une heure.
    - Il est midi.
  it.a1.unit05.lesson01.teach.ore_quattro_sei:
    title: le quattro, le cinque, le sei
    gloss: quatre heures, cinq heures, six heures
    note: Elles suivent la même structure *sono le* + nombre que pour trois heures.
    example_gloss:
    - Il est quatre heures.
    - Il est six heures.
  it.a1.unit05.lesson02.teach.sono_le_tre_e_mezzo:
    title: Sono le tre e mezzo.
    gloss: Il est trois heures et demie.
    note: '*e mezzo* (et demie) ajoute trente minutes à l’heure.'
  it.a1.unit05.lesson02.teach.sono_le_tre_e_un_quarto:
    title: Sono le tre e un quarto.
    gloss: Il est trois heures et quart.
    note: '*e un quarto* (et un quart) ajoute quinze minutes à l’heure.'
  it.a1.unit05.lesson02.teach.sono_le_quattro_meno_un_quarto:
    title: Sono le quattro meno un quarto.
    gloss: Il est quatre heures moins le quart.
    note: '*meno un quarto* (moins le quart) se compte à rebours depuis l’heure SUIVANTE, comme en français avec « quatre heures moins le quart ».'
  it.a1.unit05.lesson03.teach.a_che_ora_ci_vediamo:
    title: A che ora ci vediamo?
    gloss: À quelle heure est-ce qu’on se retrouve ?
    note: '*A che ora* demande à quelle heure quelque chose a lieu ; *ci vediamo* signifie « on se voit ».'
  it.a1.unit05.lesson03.teach.ci_vediamo_alle_tre_e_mezzo:
    title: Ci vediamo alle tre e mezzo.
    gloss: On se retrouve à trois heures et demie.
    note: '*alle* (à les) s’emploie devant une heure précise, alors que *sono le* donne simplement l’heure.'
  it.a1.unit05.lesson03.teach.parti_del_giorno:
    title: di mattina, di pomeriggio, di sera
    gloss: le matin, l’après-midi, le soir
    note: Elles précisent à quel moment de la journée correspond une heure, car en italien on ne distingue pas toujours matin et après-midi avec les heures de 1 à 12.
    example_gloss:
    - C’est un rendez-vous du matin ou du soir ?
    - C’est l’après-midi, à trois heures et demie.
  it.a1.unit05.lesson03.teach.e_di_pomeriggio:
    title: È di pomeriggio, alle tre e mezzo.
    gloss: C’est l’après-midi, à trois heures et demie.
    note: Associe le moment de la journée à l’heure précise pour lever toute ambiguïté entre matin et après-midi.
