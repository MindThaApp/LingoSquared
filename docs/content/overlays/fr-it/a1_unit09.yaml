teaching:
  it.a1.unit09.lesson01.teach.farmacia_banca:
    title: la farmacia, la banca
    gloss: la pharmacie, la banque
    note: Les deux noms sont féminins (*la*).
    example_gloss:
    - Excusez-moi, où est la pharmacie ?
  it.a1.unit09.lesson01.teach.stazione_ufficio_postale:
    title: la stazione, l'ufficio postale
    gloss: la gare, la poste
    note: '*stazione* est féminin (*la*) ; *ufficio* est masculin mais prend *l''* devant une voyelle.'
    example_gloss:
    - La gare est tout près.
  it.a1.unit09.lesson01.teach.scusi_dove_la_farmacia:
    title: Scusi, dov'è la farmacia?
    gloss: Excusez-moi, où est la pharmacie ?
    note: '*Scusi* (excusez-moi, forme de politesse) ouvre la question avant *dov''è* (où est).'
  it.a1.unit09.lesson01.teach.e_qui_vicino:
    title: È qui vicino, in Via Roma.
    gloss: C’est tout près, dans la Via Roma.
    note: '*qui vicino* (tout près) peut être suivi d’un nom de rue pour donner un lieu plus précis.'
  it.a1.unit09.lesson02.teach.ce_una_banca_qui_vicino:
    title: C'è una banca qui vicino?
    gloss: Y a-t-il une banque près d’ici ?
    note: '*C''è* (il y a) sert à demander si quelque chose existe ; il est ici suivi de *qui vicino* (près d’ici).'
  it.a1.unit09.lesson02.teach.si_ce_ne_una:
    title: Sì, ce n'è una qui vicino.
    gloss: Oui, il y en a une près d’ici.
    note: '*ce n''è una* (il y en a une) répond aux questions en *c''è* et reprend le nom féminin *banca*.'
  it.a1.unit09.lesson02.teach.accanto_alla_stazione:
    title: Accanto alla stazione.
    gloss: À côté de la gare.
    note: '*accanto a* (à côté de) avec l’article permet de situer précisément un lieu par rapport à un repère.'
  it.a1.unit09.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: Merci beaucoup.
    note: 'Littéralement « mille mercis » : une façon plus forte de remercier que *grazie* seul.'
  it.a1.unit09.lesson03.teach.dove_e_la_stazione:
    title: Dov'è la stazione?
    gloss: Où est la gare ?
    note: '*Dov''è* (où est) suivi du nom sert à demander où se trouve un lieu précis.'
    example_gloss:
    - La gare est à côté de la banque.
