  it.a1.unit19.lesson01.teach.binario_biglietto:
    title: il binario, il biglietto
    gloss: quai, billet
    note: '*binario* désigne le quai (la voie) ; *biglietto* désigne le billet.'
    example_gloss:
    - Le billet est pour Rome.
  it.a1.unit19.lesson01.teach.parte_alle_otto:
    title: Parte alle otto.
    gloss: Il part à huit heures.
    note: '*parte* signifie « part » pour un moyen de transport.'
    example_gloss:
    - Le train part à huit heures.
  it.a1.unit19.lesson01.teach.dal_binario_tre:
    title: dal binario tre
    gloss: du quai trois
    note: '*dal* est la contraction de *da* + *il* : du.'
    example_gloss:
    - Il part du quai trois.
  it.a1.unit19.lesson02.teach.a_che_ora_parte:
    title: A che ora parte il treno?
    gloss: À quelle heure part le train ?
    note: Utilise *A che ora...?* pour demander un horaire de départ.
    example_gloss:
