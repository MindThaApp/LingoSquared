  it.a1.unit19.lesson02.teach.vorrei_un_biglietto:
    title: Vorrei un biglietto per Roma alle otto, per favore.
    gloss: Je voudrais un billet pour Rome à huit heures, s'il vous plaît.
    note: '*Vorrei* est une forme polie pour acheter ou demander quelque chose ; *alle otto* précise l''heure du voyage.'
    example_gloss:
    - Bonjour, je voudrais un billet pour Rome, s'il vous plaît.
  it.a1.unit19.lesson02.teach.il_treno_per_roma:
    title: il treno per Roma
    gloss: le train pour Rome
    note: Utilise *per* pour indiquer la destination d'un voyage.
    example_gloss:
    - Le train pour Rome part à huit heures.
  it.a1.unit19.lesson02.teach.hai_il_biglietto:
