  it.a1.unit55.lesson05.teach.adesso_e_primavera:
    title: Une conversation sur les saisons
    gloss: 'C''est maintenant le printemps. Les tulipes sont belles. Nina demande : Quelle saison trouves-tu la plus belle ? Marco dit : J''aime l''été. En été, on nage. Giulia dit : J''aime l''hiver. En hiver, on patine sur la glace.'
    note: Ce texte reprend la conversation du café des langues et présente directement ce que Nina, Mateo et Elena disent des saisons.
