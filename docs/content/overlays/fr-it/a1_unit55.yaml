      primavera: printemps
      tulipani: tulipes
      belli: belles
      chiede: demande
      stagione: saison
      trovi: tu trouves
      dice: dit
      estate: été
      piace: plaît (mi piace = j'aime)
      nuotiamo: nous nageons
      inverno: hiver
      pattiniamo: nous patinons (sul ghiaccio = sur la glace)
