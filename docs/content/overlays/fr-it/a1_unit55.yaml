  it.a1.unit55.lesson03.teach.mi_piace_stagione:
    title: Mi piace + saison
    gloss: 'Mi piace + saison dit ce que tu penses d''une saison : Mi piace l''estate. Pour deux saisons, on utilise mi piacciono : Mi piacciono l''estate e l''inverno.'
    note: 'En italien, ce qui te plaît est le sujet grammatical, donc le verbe s''accorde avec lui : mi piace l''estate (une saison), mi piacciono l''estate e l''inverno (deux). C''est comme en français avec « plaire » : « l''été me plaît », « l''été et l''hiver me plaisent ».'
