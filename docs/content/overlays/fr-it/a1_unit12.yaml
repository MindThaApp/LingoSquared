teaching:
  it.a1.unit12.lesson01.teach.stasera_domani:
    title: stasera, domani
    gloss: ce soir, demain
    note: '*stasera* (ce soir) et *domani* (demain) sont les deux moments qu’on utilise pour proposer un plan.'
    example_gloss:
    - Tu es libre ce soir ?
  it.a1.unit12.lesson01.teach.va_bene_andiamo:
    title: va bene, andiamo
    gloss: d’accord, allons-y
    note: '*va bene* (d’accord) accepte une proposition ; *andiamo* (allons-y) est la forme en « nous » de *andare*, employée comme invitation.'
    example_gloss:
    - D’accord, allons-y ensemble.
  it.a1.unit12.lesson01.teach.andiamo_al_cinema_stasera:
    title: Andiamo al cinema stasera?
    gloss: On va au cinéma ce soir ?
    note: '*Andiamo* employé comme question propose de faire quelque chose ensemble.'
  it.a1.unit12.lesson01.teach.va_bene_andiamo_phrase:
    title: Va bene, andiamo!
    gloss: D’accord, allons-y !
    note: '*Va bene* accepte la proposition, puis *andiamo* reprend l’invitation avec enthousiasme.'
  it.a1.unit12.lesson02.teach.a_che_ora_ci_vediamo:
    title: A che ora ci vediamo?
    gloss: À quelle heure est-ce qu’on se retrouve ?
    note: '*ci vediamo* (on se voit / on se retrouve) est la forme réciproque de *vedersi*.'
  it.a1.unit12.lesson02.teach.ci_vediamo_alle_otto:
    title: Ci vediamo alle otto, davanti al cinema.
    gloss: On se retrouve à huit heures, devant le cinéma.
    note: '*davanti a* (devant) suivi de l’article indique le lieu de rendez-vous.'
  it.a1.unit12.lesson02.teach.perfetto_a_stasera:
    title: Perfetto, a stasera allora!
    gloss: Parfait, à ce soir alors !
    note: '*a stasera* (à ce soir) est une formule d’au revoir qui rappelle le moment convenu.'
    example_gloss:
    - Parfait, à demain alors !
  it.a1.unit12.lesson03.teach.se_stasera_non_va_bene:
    title: Se stasera non va bene, andiamo domani.
    gloss: Si ce soir ne convient pas, on y va demain.
    note: '*Se* (si) introduit un autre plan au cas où le premier ne conviendrait pas.'
  it.a1.unit12.lesson03.teach.domani_va_bene:
    title: Sì, domani va bene.
    gloss: Oui, demain, ça convient.
    note: '*va bene* (ça convient / c’est bon) confirme que l’autre jour est acceptable.'
    example_gloss:
    - Oui, demain, ça me convient très bien.
