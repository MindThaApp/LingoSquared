teaching:
  it.a1.unit23.lesson01.teach_pronto_chi_parla:
    title: Pronto, chi parla?
    gloss: Allô ? Qui est à l’appareil ?
    note: '*Pronto* est la façon habituelle de répondre au téléphone en italien, plutôt que *ciao*.'
    example_gloss:
    - Allô, c’est Elena.
  it.a1.unit23.lesson01.teach_telefono_messaggio:
    title: il telefono, un messaggio
    gloss: le téléphone, un message
    note: '*Messaggio* est masculin ; on dit *un messaggio*.'
    example_gloss:
    - Je t’envoie un message.
  it.a1.unit23.lesson01.teach_sono_elena:
    title: Sono Elena.
    gloss: C’est Elena.
    note: Au téléphone, l’italien utilise couramment *sono* pour se présenter, là où le français dit « c’est ».
    example_gloss:
    - Allô, c’est Elena.
  it.a1.unit23.lesson01.teach_ciao_sam:
    title: Ciao Sam, sono Elena.
    gloss: Salut Sam, c’est Elena.
    note: '*Sono Elena* correspond naturellement à « c’est Elena » lors d’un appel.'
    example_gloss:
    - Salut Sam, c’est Elena au téléphone.
  it.a1.unit23.lesson02.teach_puoi_ripetere:
    title: Puoi ripetere, per favore?
    gloss: Tu peux répéter, s’il te plaît ?
    note: '*Puoi* est la forme familière (tu), adaptée entre Elena et Sam.'
    example_gloss:
    - Sam, tu peux répéter, s’il te plaît ?
  it.a1.unit23.lesson02.teach_piu_piano:
    title: Più piano, per favore.
    gloss: Plus lentement, s’il te plaît.
    note: '*Più piano* signifie « plus lentement » ; c’est la façon habituelle de demander à quelqu’un de ralentir.'
    example_gloss:
    - Parle plus lentement, s’il te plaît.
  it.a1.unit23.lesson02.teach_ti_mando_un_messaggio:
    title: Ti mando un messaggio.
    gloss: Je t’envoie un message.
    note: '*Ti mando* signifie « je t’envoie » dans la langue familière.'
    example_gloss:
    - Salut Sam, je t’envoie un message.
  it.a1.unit23.lesson02.teach_si_sono_elena:
    title: Sì, sono Elena.
    gloss: Oui, c’est Elena.
    note: '*Sì* porte un accent ; n’écris pas *si* sans accent pour dire « oui ».'
    example_gloss:
    - Oui, c’est Elena au téléphone.
