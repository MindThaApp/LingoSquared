    title: Qui fait quoi pour la fête ?
    gloss: Samedi, c'est l'anniversaire de Chiara. Nous le fêtons avec une fête. Marco invite Luca et Giulia à la fête. Luca fête volontiers avec ses amis. Giulia vient aussi à la fête. Tout le monde est content pour Chiara.
