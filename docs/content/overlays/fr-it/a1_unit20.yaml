teaching:
  it.a1.unit20.lesson01.teach.fa_caldo_freddo:
    title: fa caldo, fa freddo
    gloss: il fait chaud, il fait froid
    note: En italien, on dit *fa caldo/freddo* (littéralement « il fait chaud/froid ») pour la température, comme en français.
    example_gloss:
    - Aujourd'hui, il fait chaud.
    - Aujourd'hui, il fait froid.
  it.a1.unit20.lesson01.teach.piove_sole:
    title: piove, c'è il sole
    gloss: il pleut, il y a du soleil
    note: '*Piove* est une phrase météo d''un seul mot ; *c''è il sole* signifie littéralement « il y a le soleil ».'
    example_gloss:
    - Aujourd'hui, il pleut.
    - Aujourd'hui, il y a du soleil.
