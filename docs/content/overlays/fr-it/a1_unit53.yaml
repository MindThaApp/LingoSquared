    title: Nina découvre la personnalité de chacun
    gloss: Nina est nouvelle au café linguistique. Elle demande à Marco comment sont les autres. Marco raconte. Giulia est gentille et patiente ; elle travaille comme infirmière. Luca est drôle et suit un cours d'espagnol. Chiara est curieuse ; elle aime apprendre des choses nouvelles. Marco lui-même est calme.
    note: Ce texte récapitule les traits de caractère des membres du groupe en les comparant.
    glosses:
      nuova: nouvelle (féminin)
      caffè: café (caffè linguistico = café linguistique)
      Chiede: demande
      altri: les autres
      racconta: raconte
      gentile: sympathique / gentil
      paziente: patient
      lavora: travaille
      infermiera: infirmière
      divertente: drôle
      segue: suit / fréquente
      corso: cours
      spagnolo: espagnol
      curiosa: curieuse (féminin)
      imparare: apprendre
      piace: plaît (le piace = elle aime)
      nuove: nouvelles (pluriel)
      cose: choses
      stesso: lui-même (stesso)
      calmo: calme
