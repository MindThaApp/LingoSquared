teaching:
  it.a1.unit21.lesson01.teach_maglietta_pantaloni:
    title: la maglietta, i pantaloni
    gloss: T-shirt, pantalon
    note: '*Maglietta* est féminin singulier ; *pantaloni* est toujours pluriel en italien, alors qu’en français on dit « un pantalon » au singulier.'
    example_gloss:
    - Le T-shirt est bleu.
    - Le pantalon est pour Elena.
  it.a1.unit21.lesson01.teach_scarpe_giacca:
    title: le scarpe, la giacca
    gloss: chaussures, veste
    note: '*Scarpe* est pluriel ; *giacca* est féminin singulier.'
    example_gloss:
    - Les chaussures sont confortables.
    - La veste est grande.
  it.a1.unit21.lesson01.teach_blu_nero:
    title: blu
    gloss: bleu
    note: '*Blu* ne change pas selon le genre.'
    example_gloss:
    - Le T-shirt est bleu.
  it.a1.unit21.lesson01.teach_la_maglietta_e_blu:
    title: La maglietta è blu.
    gloss: Le T-shirt est bleu.
    note: On utilise *è* pour décrire la couleur d’un seul article.
    example_gloss:
    - Le T-shirt est bleu.
  it.a1.unit21.lesson02.teach_taglia_piccola_media_grande:
    title: taglia piccola, media, grande
    gloss: petite taille, moyenne, grande
    note: '*Taglia* désigne la taille d’un vêtement. Le mot est féminin, donc les adjectifs de taille s’accordent : *taglia piccola*, *taglia media* ; *grande* est identique au masculin et au féminin.'
    example_gloss:
    - Je voudrais une taille moyenne.
  it.a1.unit21.lesson02.teach_vorrei_maglietta_blu:
    title: Vorrei una maglietta blu, taglia media.
    gloss: Je voudrais un T-shirt bleu, taille moyenne.
    note: '*Vorrei* permet de formuler poliment une demande dans un magasin de vêtements.'
    example_gloss:
    - Je voudrais un T-shirt bleu, taille moyenne.
  it.a1.unit21.lesson02.teach_quanto_costa:
    title: Quanto costa?
    gloss: Combien ça coûte ?
    note: On utilise *costa* au singulier pour un seul article.
    example_gloss:
    - Combien ça coûte ?
  it.a1.unit21.lesson02.teach_costa_dieci_euro:
    title: Costa dieci euro.
    gloss: Ça coûte dix euros.
    note: '*Euro* reste généralement invariable après un nombre dans l’usage standard.'
    example_gloss:
    - Ça coûte dix euros.
