    title: In + moyen de transport, a piedi à pied
    gloss: 'Avec les moyens de transport, l’italien dit in : in treno, in bicicletta, in macchina. À pied se dit a piedi : vado a piedi.'
    note: 'En français on dit « en train » ou « à vélo » selon le moyen ; en italien, on emploie *in* sans article : *in treno*, et non *nel treno*.'
  it.a1.unit45.lesson04.teach.marco_allora_prendo:
    title: Marco répond
    gloss: 'Marco : Alors je prends le train, avec Giulia.'
  it.a1.unit45.lesson05.teach.giulia_viaggia_ogni:
    title: Qui se déplace comment ?
    gloss: Giulia voyage en train tous les jours pour aller au travail. Marco va d’habitude à vélo, mais quand il pleut, il prend aussi le train. Luca préfère y aller en voiture. Chiara habite tout près et va au travail à pied. Et toi, comment vas-tu au travail ?
    note: 'Le texte oppose quatre façons de se déplacer et une condition (*quando piove*, quand il pleut). *Andare* (aller) est irrégulier : *vado*, *va*.'
    glosses:
      viaggia: voyage
      ogni: tous les
      giorno: jour
      treno: train
      lavoro: travailler
      bicicletta: vélo (in bicicletta = à vélo)
      solito: habituel (di solito = d’habitude)
      piove: pleut
      prende: prend
      andare: aller (andare in macchina = aller en voiture)
      preferisce: préfère
      macchina: voiture
      abita: habite
      vicino: tout près
      piedi: pieds (a piedi = à pied)
      vai: tu vas
  it.a1.unit45.lesson05.teach.chiara_abita_vicino:
    title: Chiara habite tout près et va au travail à pied
    gloss: Chiara habite tout près et va au travail à pied.
  it.a1.unit45.lesson06.teach.giulia_andiamo_insieme:
    title: Giulia propose
    gloss: 'Giulia : On va ensemble à vélo au café linguistique ?'
  it.a1.unit45.lesson06.teach.luca_preferisco_andare:
    title: Luca préfère la voiture
    gloss: 'Luca : Je préfère y aller en voiture.'
  it.a1.unit45.lesson06.teach.chiara_io_vado:
    title: Chiara ira à pied
    gloss: 'Chiara : Moi j’y vais à pied, c’est près.'
