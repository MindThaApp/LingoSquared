    feedback: The speaker’s *دارم* (I have) becomes *داره* (he/she has).
  fa.a2.unit39.lesson04.exercise02.pass_on_question:
    instruction: 'Which sentence passes on a question: your friend asks whether you are at home tonight?'
    correct_option: می‌پرسه که امشب خونه هستی یا نه
    distractors:
    - می‌گه که امشب خونه هستی
    - می‌خواد که امشب بیای
    - می‌گه که امشب خونه هست
    accepted_answers:
    - value: می‌پرسه که امشب خونه هستی یا نه
