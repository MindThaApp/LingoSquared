teaching:
  fa.a2.unit39.lesson01.teach.basic_words:
    title: People, days, and small words
    gloss: I, you, he/she, they, Sara, Nima, today, tomorrow, late, a/one, and, or, no
    note: '*اون* means “he/she/that” and *اونا* means “they.” Persian has no separate word for “he” and “she.”'
    example_gloss:
    - You and I.
    - Sara and Nima.
    - Today or tomorrow.
  fa.a2.unit39.lesson01.teach.have_forms:
    title: Having work or time
    gloss: I have work, you have time, he/she has time
    note: '*کار دارم* means “I have work / I am busy.” The ending changes with the person: *دارم*, *داری*, *داره*.'
    example_gloss:
    - I have work today.
    - Do you have time tomorrow?
    - Sara has time tomorrow.
  fa.a2.unit39.lesson01.teach.message_words:
    title: Messages and notes
    gloss: message, note, phone, my colleague, my friend
    note: A phone message is a *پیغام*; a written one can be a *یادداشت*. *همکارم* and *دوستم* do not show whether the person is a man or a woman.
    example_gloss:
    - My friend has a message.
    - My colleague has a note.
    - Sara has a phone.
  fa.a2.unit39.lesson01.teach.home_forms:
    title: Being home
    gloss: home, is, is not, you are
    note: '*خونه هست* means “is at home.” *هستی* is the “you” form and *هست* the “he/she” form.'
    example_gloss:
    - Nima is at home.
    - Sara is not at home.
    - Are you at home?
  fa.a2.unit39.lesson01.teach.say_verbs:
    title: Verbs for passing on a message
    gloss: he/she says, they say, he/she asks, he/she wants
    note: Each verb is present tense, third person. Use *می‌گه* to pass on a statement, *می‌پرسه* a question, and *می‌خواد* a request.
    example_gloss:
    - My friend says.
    - They say.
    - My colleague asks.
    - Sara wants.
  fa.a2.unit39.lesson01.teach.arrive_forms:
    title: Arriving late
    gloss: I arrive late, he/she arrives late
    note: The same verb *می‌رسه* serves for “he” and “she.”
    example_gloss:
    - I arrive late today.
    - Sara arrives late.
  fa.a2.unit39.lesson01.teach.say_that:
    title: 'Passing on a statement: می‌گه که'
    gloss: I arrive late. Sara says that she arrives late.
    note: 'To pass on a statement, say who speaks, then *می‌گه که*, then what was said. The verb stays in the present. The person changes: *دیر می‌رسم* (I) becomes *دیر می‌رسه* (he/she). *که* (“that”) can be dropped in speech, but it makes the report clear.'
  fa.a2.unit39.lesson02.teach.object_pronouns:
    title: To me, to you, to him/her, for you
    gloss: to me, to you, to him/her, for you
    note: 'These short forms attach the person to the verb phrase: *بهم* (to me), *بهت* (to you), *بهش* (to him/her).'
    example_gloss:
    - I have a message for you.
    - Sara has a message for him/her.
    - Nima has a message for me.
  fa.a2.unit39.lesson02.teach.request_verbs:
    title: What the person wants you to do
    gloss: call, come, reply, read
    note: 'After *می‌خواد که* the second verb is a “you” form with *ب*: *بزنی*, *بیای*, *بدی*, *بخونی*.'
    example_gloss:
    - Sara wants you to call her/him.
    - Nima wants you to come tomorrow.
    - My colleague wants you to reply.
    - My friend wants you to read the note.
  fa.a2.unit39.lesson02.teach.call_forms:
    title: I call, he/she calls
    gloss: I call, he/she calls
    note: 'The present tense is also used for a plan: *فردا زنگ می‌زنم* can mean “I will call tomorrow.”'
    example_gloss:
    - I will call tomorrow.
    - Sara will call tomorrow.
  fa.a2.unit39.lesson02.teach.when_forms:
    title: When? You arrive
    gloss: when, you arrive
    note: '*کی* is a question word. In a reported question it stays the same: *می‌پرسه که کی می‌رسی*.'
    example_gloss:
    - When do you arrive tomorrow?
    - My colleague asks when you arrive.
    - When are you at home?
  fa.a2.unit39.lesson02.teach.asks_whether:
    title: 'Passing on a question: می‌پرسه'
    gloss: He/She asks whether you have time. He/She asks when you arrive.
    note: 'A yes/no question becomes *می‌پرسه که … یا نه*: *می‌پرسه که وقت داری یا نه*. A question word stays in place: *می‌پرسه که کی می‌رسی*. The question mark disappears and the verb stays in the present.'
  fa.a2.unit39.lesson02.teach.wants_you_to:
    title: 'Passing on a request: می‌خواد که + ب-form'
    gloss: He/She wants you to call him/her.
    note: 'To pass on a request, use *می‌خواد که* and a verb with *ب*: *می‌خواد که بهش زنگ بزنی*. This is not “wants to call”: the “you” ending *ـی* shows that you are the one who should act. The *که* can be dropped: *می‌خواد بهش زنگ بزنی*.'
  fa.a2.unit39.lesson03.teach.key_car:
    title: Key and car
    gloss: key, car, my key, his/her key, it is the car
    note: 'Add *ـم* for “my” and *ـش* for “his/her”: *کلیدم*, *کلیدش*. In *تو ماشینه*, *تو* means “in” and *ـه* means “is.”'
    example_gloss:
    - My key is in the car.
    - His/Her key is in the car.
    - Sara has a car.
  fa.a2.unit39.lesson03.teach.they_forms:
    title: They arrive, they have
    gloss: they arrive, they have
    note: 'The “they” ending is *ـن*: *می‌رسن*, *دارن*, *می‌گن*.'
    example_gloss:
    - They arrive late.
    - They have work tomorrow.
  fa.a2.unit39.lesson03.teach.three_verbs:
    title: Statement, question, or request?
    gloss: He/She says he/she has time tomorrow. He/She asks whether you have time tomorrow. He/She wants you to call.
    note: The verb tells you what kind of message it is. *می‌گه* is a statement and ends with a he/she verb (*داره*). *می‌پرسه* is a question and its verb is about “you” (*داری*). *می‌خواد* is a request and is followed by a *ب* verb (*بزنی*).
  fa.a2.unit39.lesson03.teach.person_shift:
    title: What changes when you pass it on
    gloss: I have work. He/She says he/she has work. My key. His/Her key.
    note: 'When you report, “I” in the original becomes “he/she.” The verb ending *ـم* becomes *ـه* (*دارم* to *داره*), and the possessive *ـم* becomes *ـش* (*کلیدم* to *کلیدش*). Persian does not mark gender, so *داره* means both “he has” and “she has.” The tense does not change: present stays present.'
  fa.a2.unit39.lesson03.teach.says_vs_they_say:
    title: 'One person or several: می‌گه and می‌گن'
    gloss: He/She says he/she arrives late. They say they arrive late.
    note: 'One letter separates one person from several: *می‌گه … می‌رسه* (he/she) and *می‌گن … می‌رسن* (they). Both verbs in the report must agree.'
  fa.a2.unit39.lesson04.teach.time_words:
    title: Now, tonight, meeting
    gloss: now, tonight, meeting
    note: '*جلسه* is a meeting, often at work.'
    example_gloss:
    - I have a meeting now.
    - Are you at home tonight?
    - My colleague has a meeting tonight.
  fa.a2.unit39.lesson04.teach.phone_phrases:
    title: Phone-message phrases
    gloss: What does your colleague say? What else? From whom? Yes.
    note: These short phrases keep a message conversation moving.
  fa.a2.unit39.lesson04.teach.note_pattern:
    title: A note with a statement and a question
    gloss: My colleague says that he/she arrives late today and asks whether you are at home.
    note: 'In a written note, join the two reports with *و* and repeat the verb for each one: *می‌گه که …* and *می‌پرسه که … یا نه*. The speaker comes first and is not repeated.'
  fa.a2.unit39.lesson05.teach.reading:
    title: A note for Nima
    gloss: Nima, I have a message for you. Your colleague says that he/she has a meeting today and arrives late. He/She asks whether you have time tomorrow and wants you to call him/her.
    note: Read once for who sends the message, then again to separate the statement, the question, and the request.
  fa.a2.unit39.lesson06.teach.turn01:
    title: Sara has a message
    gloss: Sara tells Nima she has a message for him.
    note: The opening names the message.
  fa.a2.unit39.lesson06.teach.turn02:
    title: Nima asks who it is from
    gloss: From whom?
    note: A short question asks for the sender.
  fa.a2.unit39.lesson06.teach.turn03:
    title: Sara gives the sender and the first statement
    gloss: From your colleague. He/She says that he/she arrives late today.
    note: Sara passes on a statement with *می‌گه که*.
  fa.a2.unit39.lesson06.teach.turn04:
    title: Nima asks for more
    gloss: What else does he/she say?
    note: '*دیگه چی* asks for the next part.'
  fa.a2.unit39.lesson06.teach.turn05:
    title: Sara passes on a question and a request
    gloss: He/She asks whether you have time tomorrow and wants you to call him/her.
    note: One report is a question; the other is a request.
  fa.a2.unit39.lesson06.teach.turn06:
    title: Nima answers
    gloss: Yes, I have time tomorrow. I will call him/her now.
    note: Nima answers in the first person, since he is speaking for himself.
exercises:
  fa.a2.unit39.lesson01.exercise01.recognize_says:
    instruction: What does this report mean?
    correct_option: He/She says that he/she arrives late.
    distractors:
    - He/She asks whether he/she arrives late.
    - He/She wants you to arrive late.
    - They say that they arrive late.
    accepted_answers:
    - value: He/She says that he/she arrives late.
      status: correct
    feedback: '*می‌گه که* passes on a statement; *می‌رسه* is “he/she arrives.”'
  fa.a2.unit39.lesson01.exercise02.recognize_asks:
    instruction: What does this report mean?
    correct_option: He/She asks whether Nima is at home.
    distractors:
    - He/She says that Nima is at home.
    - He/She wants Nima to be at home.
    - He/She asks where Nima is.
    accepted_answers:
    - value: He/She asks whether Nima is at home.
      status: correct
    feedback: '*می‌پرسه … هست یا نه* passes on a yes/no question.'
  fa.a2.unit39.lesson01.exercise03.match_report_words:
    instruction: Match each Farsi item with its distinct meaning.
    accepted_answers:
    - value:
        می‌گه که: he/she says that
        می‌پرسه که: he/she asks whether
        می‌خواد که: he/she wants that
        می‌گن که: they say that
        پیغام: message
        یادداشت: note
        گوشی: phone
        همکارم: my colleague
      status: correct
    feedback: These verbs and nouns are the basic tools for passing on a message.
  fa.a2.unit39.lesson01.exercise04.order_says_late:
    instruction: 'Arrange the words to say: Sara says that she arrives late.'
    accepted_answers:
    - value:
      - سارا
      - می‌گه
      - که
      - دیر
      - می‌رسه
      status: correct
    feedback: '*سارا می‌گه که دیر می‌رسه*: speaker, verb, *که*, then the message.'
  fa.a2.unit39.lesson01.exercise05.fill_says:
    instruction: 'Complete the report with the verb for a statement: Sara says that she has work today.'
    accepted_answers:
    - value: می‌گه
      status: correct
    feedback: The full report is *سارا می‌گه که امروز کار داره*.
  fa.a2.unit39.lesson01.exercise06.translate_colleague_time:
    instruction: 'Translate using the verb for a statement: My colleague says that he/she has time tomorrow.'
    accepted_answers:
    - value: همکارم می‌گه که فردا وقت داره
      status: correct
    - value: همکارم می‌گه فردا وقت داره
      status: correct
    - value: اون می‌گه که فردا وقت داره
      status: acceptable_with_note
      note: This is correct when the colleague is already known; the model names him/her.
    feedback: 'Model: *همکارم می‌گه که فردا وقت داره.*'
  fa.a2.unit39.lesson02.exercise01.recognize_wants:
    instruction: What does this report mean?
    correct_option: Sara wants you to call her.
    distractors:
    - Sara wants to call you.
    - Sara says that she calls you.
    - Sara asks whether you call her.
    accepted_answers:
    - value: Sara wants you to call her.
      status: correct
    feedback: The ending *ـی* in *بزنی* is “you,” so you are the one who should call.
  fa.a2.unit39.lesson02.exercise02.recognize_when:
    instruction: What does this report mean?
    correct_option: My colleague asks when you arrive.
    distractors:
    - My colleague says when he/she arrives.
    - My colleague asks whether you arrive.
    - My colleague wants you to arrive.
    accepted_answers:
    - value: My colleague asks when you arrive.
      status: correct
    feedback: '*کی* asks “when,” and *می‌رسی* is the “you” form.'
  fa.a2.unit39.lesson02.exercise03.match_requests_questions:
    instruction: Match each report with its distinct meaning.
    accepted_answers:
    - value:
        می‌خواد که بیای: he/she wants you to come
        می‌خواد که بهش زنگ بزنی: he/she wants you to call him/her
        می‌خواد که جواب بدی: he/she wants you to reply
        می‌خواد که یادداشت رو بخونی: he/she wants you to read the note
        می‌پرسه که وقت داری یا نه: he/she asks whether you have time
        می‌پرسه که کی می‌رسی: he/she asks when you arrive
        می‌پرسه که خونه هستی یا نه: he/she asks whether you are at home
        می‌گه که فردا زنگ می‌زنه: he/she says he/she will call tomorrow
      status: correct
    feedback: Requests use *ب* verbs, questions end in *یا نه* or use a question word, and statements use *می‌گه*.
  fa.a2.unit39.lesson02.exercise04.order_wants_call:
    instruction: 'Arrange the words to say: Sara wants you to call her.'
    accepted_answers:
    - value:
      - سارا
      - می‌خواد
      - که
      - بهش
      - زنگ
      - بزنی
      status: correct
    feedback: '*می‌خواد که* is followed by the *ب* verb phrase.'
  fa.a2.unit39.lesson02.exercise05.fill_wants_come:
    instruction: 'Complete the request: Nima wants you to come tomorrow.'
    accepted_answers:
    - value: بیای
      status: correct
    feedback: The full report is *نیما می‌خواد که فردا بیای*.
  fa.a2.unit39.lesson02.exercise06.translate_asks_time:
    instruction: 'Translate using the verb for a question: My friend asks whether you have time.'
    accepted_answers:
    - value: دوستم می‌پرسه که وقت داری یا نه
      status: correct
    - value: دوستم می‌پرسه وقت داری یا نه
      status: correct
    - value: اون می‌پرسه که وقت داری یا نه
      status: acceptable_with_note
      note: This is correct when the friend is already known; the model names him/her.
    feedback: 'Model: *دوستم می‌پرسه که وقت داری یا نه.*'
  fa.a2.unit39.lesson03.exercise01.contrast_statement:
    instruction: Which meaning does this report have?
    correct_option: He/She says that he/she has time tomorrow.
    distractors:
    - He/She asks whether you have time tomorrow.
    - He/She says that you have time tomorrow.
    - He/She wants you to have time tomorrow.
    accepted_answers:
    - value: He/She says that he/she has time tomorrow.
      status: correct
    feedback: '*می‌گه* plus the he/she verb *داره* is a statement about the speaker.'
  fa.a2.unit39.lesson03.exercise02.contrast_they_say:
    instruction: Which meaning does this report have?
    correct_option: They say that they arrive late.
    distractors:
    - He/She says that he/she arrives late.
    - They ask whether they arrive late.
    - They want you to arrive late.
    accepted_answers:
    - value: They say that they arrive late.
      status: correct
    feedback: The *ـن* endings show “they.”
  fa.a2.unit39.lesson03.exercise03.match_direct_reported:
    instruction: Match each direct sentence or report with its distinct meaning.
    accepted_answers:
    - value:
        دیر می‌رسم: I arrive late
        می‌گه که دیر می‌رسه: He/She says he/she arrives late
        فردا وقت دارم: I have time tomorrow
        می‌گه که فردا وقت داره: He/She says he/she has time tomorrow
        فردا وقت داری؟: Do you have time tomorrow?
        می‌پرسه که فردا وقت داری یا نه: He/She asks whether you have time tomorrow
        فردا زنگ می‌زنم: I will call tomorrow
        می‌گه که فردا زنگ می‌زنه: He/She says he/she will call tomorrow
      status: correct
    feedback: 'Compare each direct sentence with its report: only the person changes.'
  fa.a2.unit39.lesson03.exercise04.order_key_report:
    instruction: 'Your friend says «کلیدم تو ماشینه». Arrange the words to pass it on: My friend says that his/her key is in the car.'
    accepted_answers:
    - value:
      - دوستم
      - می‌گه
      - که
      - کلیدش
      - تو
      - ماشینه
      status: correct
    feedback: '*کلیدم* (my key) becomes *کلیدش* (his/her key) when you pass it on.'
  fa.a2.unit39.lesson03.exercise05.fill_person_shift:
    instruction: 'Your friend says «کار دارم». Complete the report: He/She says that he/she has work.'
    accepted_answers:
    - value: داره
      status: correct
    feedback: '*دارم* (I have) becomes *داره* (he/she has).'
  fa.a2.unit39.lesson03.exercise06.translate_not_home:
    instruction: 'Translate using the verb for a statement: He/She says that he/she is not at home.'
    accepted_answers:
    - value: می‌گه که خونه نیست
      status: correct
    - value: می‌گه خونه نیست
      status: correct
    - value: اون می‌گه که خونه نیست
      status: acceptable_with_note
      note: '*اون* is correct but normally dropped.'
    - value: اون می‌گه خونه نیست
      status: acceptable_with_note
      note: '*اون* is correct but normally dropped.'
    feedback: 'Model: *می‌گه که خونه نیست.*'
  fa.a2.unit39.lesson04.exercise01.pass_on_statement:
    instruction: Your friend leaves the note «الان جلسه دارم». Which report passes it on correctly?
    correct_option: می‌گه که الان جلسه داره
    distractors:
    - می‌گه که الان جلسه دارم
    - می‌پرسه که الان جلسه داره یا نه
