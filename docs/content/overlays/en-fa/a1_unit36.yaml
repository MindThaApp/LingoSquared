course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: describing a person's basic personality traits,
    asking what someone is like, and a dialogue about a mutual friend's
    character.

units:
  fa.a1.unit36.personality:
    title: Personality

lessons:
  fa.a1.unit36.lesson01.personality_words_one: {title: "Personality words 1"}
  fa.a1.unit36.lesson02.personality_words_two: {title: "Personality words 2"}
  fa.a1.unit36.lesson03.asking_about_personality: {title: "Asking about personality"}
  fa.a1.unit36.lesson04.personality_dialogue: {title: "Dialogue: What's Maryam like?"}
  fa.a1.unit36.lesson05.reading_personality: {title: "Reading about personality"}
  fa.a1.unit36.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit36.lesson01.teach.mehrabun:
    title: Kind
    gloss: kind / friendly
    note: "*مهربون* describes someone who is kind or warm-hearted."
    example_gloss: "Sara is very kind."
  fa.a1.unit36.lesson01.teach.bamaze:
    title: Funny
    gloss: funny
    note: "*بامزه* describes someone who is funny or amusing."
    example_gloss: "Nima is funny."
  fa.a1.unit36.lesson01.teach.khejalati:
    title: Shy
    gloss: shy
    note: "*خجالتی* describes someone who is shy."
    example_gloss: "He/she is a little shy."
  fa.a1.unit36.lesson01.teach.jeddi:
    title: Serious
    gloss: serious
    note: "*جدی* describes someone who is serious."
    example_gloss: "Our teacher is serious."
  fa.a1.unit36.lesson01.teach.review_copula_fusion:
    title: "How the fused 'is' attaches to personality words"
    gloss: "he/she is kind / funny / shy (fused copula)"
    note: "*مهربونه* fuses *مهربون* + *است* directly since *مهربون* ends in a consonant. *بامزه‌ست* uses a written ZWNJ before *ست* since *بامزه* already ends in the vowel *ه*. *خجالتیه* attaches *ه* directly onto a *ی*-ending word, the same pattern as *قهوه‌ایه* from the appearance unit."

  fa.a1.unit36.lesson02.teach.zerang:
    title: Smart
    gloss: smart / clever
    note: "*زرنگ* describes someone who is smart or clever, especially practically resourceful."
    example_gloss: "Maryam is very smart."
  fa.a1.unit36.lesson02.teach.tanbal:
    title: Lazy
    gloss: lazy
    note: "*تنبل* describes someone who is lazy."
    example_gloss: "I'm a little lazy today."
  fa.a1.unit36.lesson02.teach.zahmatkesh:
    title: Hardworking
    gloss: hardworking
    note: "*زحمت‌کش* describes someone who works hard and puts in real effort."
    example_gloss: "My father is very hardworking."
  fa.a1.unit36.lesson02.teach.sabur:
    title: Patient
    gloss: patient
    note: "*صبور* describes someone who is patient."
    example_gloss: "Our teacher is very patient."
  fa.a1.unit36.lesson02.teach.review_negation:
    title: "Negating a personality trait"
    gloss: "he/she is not lazy"
    note: "*نیست* negates the fused copula: *تنبل نیست* means 'he/she is not lazy,' the same *نیست* already taught for negating feelings."

  fa.a1.unit36.lesson03.teach.shakhsiat_word:
    title: Personality
    gloss: personality
    note: "*شخصیت* means 'personality' or 'character.'"
    example_gloss: "His/her personality is very good."
  fa.a1.unit36.lesson03.teach.ask_shakhsiat:
    title: "What's his/her personality like?"
    gloss: "What's his/her personality like?"
    note: "*چطوره؟* ('how is...?') is already taught from the greetings unit; *ش* is the possessive suffix 'his/her,' attached to *شخصیت* ('personality')."
  fa.a1.unit36.lesson03.teach.answer_mehrabun_zerang:
    title: "He/she is very kind and smart"
    gloss: "He/she is very kind and smart"
    note: "*و* means 'and,' joining two personality words."
  fa.a1.unit36.lesson03.teach.che_joriye:
    title: "What's he/she like?"
    gloss: "What's he/she like?"
    note: "*چه جوریه؟* is a common informal way to ask 'what's he/she like,' an alternative to *شخصیتش چطوره؟*."
  fa.a1.unit36.lesson03.teach.review_shakhsiat_words:
    title: "Personality / how is...? / what's...like?"
    gloss: "personality / how is...? / what's...like?"
    note: "These three phrases let you ask about and name someone's personality."

  fa.a1.unit36.lesson04.teach.review_dialogue_words:
    title: "Nima / Sara / Maryam / not at all / only / cool"
    gloss: "Nima / Sara / Maryam / not at all / only / cool"
    note: "*مریم* is *سارا*'s friend, already introduced in the appearance unit. *اصلاً* means 'not at all.' *فقط* means 'only.' *باحال* means 'cool/nice.'"
  fa.a1.unit36.lesson04.teach.get_to_know:
    title: "I'd like to get to know her more"
    gloss: "I'd like to get to know her more"
    note: "*بیشتر* means 'more.' *باهاش* means 'with him/her.' *آشنا بشم* means 'that I get acquainted/get to know.'"
  fa.a1.unit36.lesson04.teach.dialogue_line1:
    title: "Nima: Sara, what's Maryam like?"
    gloss: "Sara, what's Maryam like?"
  fa.a1.unit36.lesson04.teach.dialogue_line2:
    title: "Sara: She's very kind and smart."
    gloss: "She's very kind and smart."
  fa.a1.unit36.lesson04.teach.dialogue_line3:
    title: "Nima: Isn't she lazy?"
    gloss: "Isn't she lazy?"
  fa.a1.unit36.lesson04.teach.dialogue_line4:
    title: "Sara: No, not at all, she's very hardworking too. She's just a little shy."
    gloss: "No, not at all, she's very hardworking too. She's just a little shy."
  fa.a1.unit36.lesson04.teach.dialogue_line5:
    title: "Nima: That's cool, I'd like to get to know her more."
    gloss: "That's cool, I'd like to get to know her more."

  fa.a1.unit36.lesson05.teach.reading_text:
    title: "Reading: Maryam's personality"
    gloss: "Maryam is Sara's friend. She's very kind and smart. She's hardworking at her job too, and never lazy. She's just a little shy, that's why she doesn't talk much in big groups."
    note: "The reading describes Maryam's personality in the third person, the same traits used in the dialogue."
  fa.a1.unit36.lesson05.teach.reading_note:
    title: "Never (with a negative verb)"
    gloss: "never"
    note: "*هیچ‌وقت* pairs with a negative verb (*نیست*, *نمی‌زنه*) to mean 'never,' the same double-negative pattern as English 'doesn't ever.'"

  fa.a1.unit36.lesson06.teach.self_description:
    title: "I think I'm very hardworking, but I'm also a little lazy"
    gloss: "I think I'm very hardworking, but I'm also a little lazy"
    note: "*فکر می‌کنم* means 'I think.' *زحمت‌کشم* fuses *زحمت‌کش* + *هستم* ('I am'). *هستم* is the full, unfused form of 'I am,' used here after *هم* ('also/too') for emphasis."
  fa.a1.unit36.lesson06.teach.friend_request:
    title: "What's your personality like?"
    gloss: "What's your personality like?"
    note: "*شخصیتت* attaches the informal possessive suffix *ت* ('your') onto *شخصیت*, the *تو*-register version of *شخصیتش*."
  fa.a1.unit36.lesson06.teach.review_trait_words:
    title: "Kind / funny / shy / serious / smart / lazy / hardworking / patient"
    gloss: "kind / funny / shy / serious / smart / lazy / hardworking / patient"
    note: "These are the eight core personality words from this unit."

