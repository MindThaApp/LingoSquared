course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: naming the concept of a hobby/free time, four
    everyday activities (reading, listening to music, watching movies,
    sport/football), talking about how often you do them, asking someone
    what they do in their free time, a short reading passage about نیما's
    hobbies, and a closing dialogue between نیما and سارا.

units:
  fa.a1.unit24.hobbies:
    title: Hobbies

lessons:
  fa.a1.unit24.lesson01.basic_hobbies: {title: "My hobbies"}
  fa.a1.unit24.lesson02.music_and_movies: {title: "Music and movies"}
  fa.a1.unit24.lesson03.sport: {title: "Sport"}
  fa.a1.unit24.lesson04.how_often: {title: "How often"}
  fa.a1.unit24.lesson05.reading_about_a_hobby: {title: "Reading about a hobby"}
  fa.a1.unit24.lesson06.hobbies_dialogue: {title: "A hobbies dialogue"}

teaching:
  fa.a1.unit24.lesson01.teach.vaght_azad_phrase:
    title: "Free time"
    gloss: "free time"
    note: "*وقت آزاد* means free time -- literally 'free/open time.'"
  fa.a1.unit24.lesson01.teach.sargarmi_word:
    title: Hobby
    gloss: hobby
    note: "*سرگرمی* means hobby or pastime."
    example_gloss: "Reading is a hobby."
  fa.a1.unit24.lesson01.teach.ketab_khoondan_phrase:
    title: "Reading books"
    gloss: "reading books"
    note: "*کتاب خوندن* literally means 'book-reading' -- *کتاب* (book) was already taught back in unit03, *خوندن* (to read) is new here."
  fa.a1.unit24.lesson01.teach.doost_daram_review:
    title: "I ... like"
    gloss: "I like"
    note: "*دوست دارم*, already taught in unit14, works the same way with an activity as with a thing: *کتاب خوندن دوست دارم* means 'I like reading books.'"

  fa.a1.unit24.lesson02.teach.musiqi_review:
    title: Music
    gloss: music
    note: "*موسیقی*, already taught back in unit14, reappears here."
    example_gloss: "I listen to music."
  fa.a1.unit24.lesson02.teach.goosh_midam_phrase:
    title: "I listen"
    gloss: "I listen"
    note: "*گوش می‌دم* literally means 'I give ear' -- the natural way to say 'I listen' in Farsi."
  fa.a1.unit24.lesson02.teach.film_review:
    title: Movie
    gloss: movie
    note: "*فیلم*, already taught back in unit13, reappears here."
    example_gloss: "I watch movies."
  fa.a1.unit24.lesson02.teach.mibinam_word:
    title: "I watch / I see"
    gloss: "I watch / I see"
    note: "*می‌بینم* is the present-tense form of the verb whose past tense (*دیدم*, 'I saw') was already taught in unit13."

  fa.a1.unit24.lesson03.teach.varzesh_word:
    title: "Sport / exercise"
    gloss: "sport / exercise"
    note: "*ورزش* covers both 'sport' and 'exercise' generally."
    example_gloss: "I exercise."
  fa.a1.unit24.lesson03.teach.mikonam_review:
    title: "I do"
    gloss: "I do"
    note: "*می‌کنم*, already taught in unit08's *حساب می‌کنم*, is the general 'I do/make' verb used in compound verbs like *ورزش می‌کنم* (I exercise)."
  fa.a1.unit24.lesson03.teach.footbal_word:
    title: Football
    gloss: football
    note: "*فوتبال* means football (soccer)."
    example_gloss: "I like football."
  fa.a1.unit24.lesson03.teach.bazi_phrase:
    title: "I play football"
    gloss: "I play football"
    note: "*بازی* means play/game -- *فوتبال بازی می‌کنم* literally means 'I do football-play.'"

  fa.a1.unit24.lesson04.teach.hafte_word:
    title: Week
    gloss: week
    note: "*هفته* means week."
    example_gloss: "I exercise every week."
  fa.a1.unit24.lesson04.teach.har_hafte_phrase:
    title: "Every week"
    gloss: "every week"
    note: "*هر*, already taught in unit11's *هر روز* (every day), combines the same way with *هفته* to make *هر هفته* (every week)."
  fa.a1.unit24.lesson04.teach.gahi_word:
    title: Sometimes
    gloss: sometimes
    note: "*گاهی* means sometimes."
    example_gloss: "Sometimes I read books."
  fa.a1.unit24.lesson04.teach.free_time_question:
    title: "What do you do in your free time?"
    gloss: "What do you do in your free time?"
    note: "*چیکار می‌کنی* was already taught in unit11/unit13 -- this reuses it to ask about free time specifically."

  fa.a1.unit24.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: "*نیما*, established as a character back in unit11, reappears here."
    example_gloss: "Nima likes reading books."
  fa.a1.unit24.lesson05.teach.chand_ta_phrase:
    title: "A few / how many"
    gloss: "a few / how many"
    note: "*چند* (how many/several) combines with the counter *تا*, already taught in unit03, to mean 'a few' or 'how many' before a countable noun."
  fa.a1.unit24.lesson05.teach.mikhone_word:
    title: "He/she reads"
    gloss: "he/she reads"
    note: "*می‌خونه* is the 3rd-person colloquial form of *خوندن* (to read)."
  fa.a1.unit24.lesson05.teach.ham_word:
    title: "Also / too"
    gloss: "also / too"
    note: "*هم* means also/too, already used this way back in unit11."
    example_gloss: "Nima also plays football."
  fa.a1.unit24.lesson05.teach.mikone_word:
    title: "He/she does"
    gloss: "he/she does"
    note: "*می‌کنه* is the 3rd-person colloquial form of *می‌کنم* (I do)."
  fa.a1.unit24.lesson05.teach.reading_text:
    title: "Reading: Nima's free time"
    gloss: "Nima likes reading books. He reads a few books every week. Sometimes he also plays football."
    note: "*چند تا* before *کتاب* means 'a few books'; *می‌خونه* and *می‌کنه* are the 3rd-person colloquial forms used to talk about someone else."

  fa.a1.unit24.lesson06.teach.sara_review:
    title: Sara
    gloss: Sara
    note: "*سارا*, established as a character back in unit14, reappears here."
    example_gloss: "Sara likes watching movies."
  fa.a1.unit24.lesson06.teach.didan_word:
    title: "To watch / to see"
    gloss: "to watch / to see"
    note: "*دیدن* is the infinitive form of the verb whose present tense (*می‌بینم*) was taught in lesson02 and whose past tense (*دیدم*) was taught in unit13."
    example_gloss: "I like watching movies."
  fa.a1.unit24.lesson06.teach.sinama_miram_phrase:
    title: "I go to the cinema"
    gloss: "I go to the cinema"
    note: "*سینما* (cinema) was already taught in unit13; *می‌رم* (I go) was already taught in unit11's *می‌رم سر کار* (I go to work)."
  fa.a1.unit24.lesson06.teach.chi_word:
    title: What
    gloss: what
    note: "*چی* means 'what' -- already used this way in unit14's *تو چی؟* (What about you?)."
    example_gloss: "What about you?"
  fa.a1.unit24.lesson06.teach.va_word:
    title: And
    gloss: and
    note: "*و* means 'and' -- already used this way back in unit14."
    example_gloss: "I like reading and I like football."
  fa.a1.unit24.lesson06.teach.che_khoob_phrase:
    title: "How nice!"
    gloss: "how nice!"
    note: "*چه خوب!* was already taught in unit23 -- a common positive reaction, like 'that's great!'"
  fa.a1.unit24.lesson06.teach.dialogue_line1:
    title: "Nima: Sara, what do you do in your free time?"
    gloss: "Sara, what do you do in your free time?"
  fa.a1.unit24.lesson06.teach.dialogue_line2:
    title: "Sara: I like watching movies..."
    gloss: "I like watching movies. I go to the cinema every week. What about you?"
  fa.a1.unit24.lesson06.teach.dialogue_line3:
    title: "Nima: I like reading books..."
    gloss: "I like reading books. Sometimes I also play football."
  fa.a1.unit24.lesson06.teach.dialogue_line4:
    title: "Sara: How nice!"
    gloss: "How nice!"

exercises:
  fa.a1.unit24.lesson01.exercise01.recognize_sargarmi:
    instruction: "What does this word mean?"
    correct_option: hobby
    distractors: ["free time", "reading books", music]
    accepted_answers: [{value: hobby, status: correct}]
    feedback: "سرگرمی means hobby."
  fa.a1.unit24.lesson01.exercise02.recognize_ketab_khoondan:
    instruction: "What does this phrase mean?"
    correct_option: "reading books"
    distractors: [hobby, "free time", music]
    accepted_answers: [{value: "reading books", status: correct}]
    feedback: "کتاب خوندن means reading books."
  fa.a1.unit24.lesson01.exercise03.match_basic_hobbies_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"وقت آزاد": "free time", سرگرمی: hobby, "کتاب خوندن": "reading books", "دوست دارم": "I like"}
        status: correct
    feedback: "These cover the basics of talking about a hobby."
  fa.a1.unit24.lesson01.exercise04.translate_i_like_reading:
    instruction: "Translate into Farsi: I like reading books."
    accepted_answers: [{value: "من کتاب خوندن دوست دارم", status: correct}]
    feedback: "من کتاب خوندن دوست دارم means 'I like reading books.'"
  fa.a1.unit24.lesson01.exercise05.translate_free_time:
    instruction: "Translate into Farsi: free time."
    accepted_answers: [{value: "وقت آزاد", status: correct}]
    feedback: "وقت آزاد means free time."

  fa.a1.unit24.lesson02.exercise01.recognize_musiqi:
    instruction: "What does this word mean?"
    correct_option: music
    distractors: [movie, "free time", hobby]
    accepted_answers: [{value: music, status: correct}]
    feedback: "موسیقی means music."
  fa.a1.unit24.lesson02.exercise02.recognize_film:
    instruction: "What does this word mean?"
    correct_option: movie
    distractors: [music, hobby, football]
    accepted_answers: [{value: movie, status: correct}]
    feedback: "فیلم means movie."
  fa.a1.unit24.lesson02.exercise03.match_music_movies_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {موسیقی: music, "گوش می‌دم": "I listen", فیلم: movie, "می‌بینم": "I watch", "وقت آزاد": "free time", سرگرمی: hobby}
        status: correct
    feedback: "This reviews music and movie vocabulary alongside lesson01's basics."
  fa.a1.unit24.lesson02.exercise04.word_order_listen_to_music:
    instruction: "Put the words in order."
    accepted_answers: [{value: [موسیقی, گوش, "می‌دم"], status: correct}]
    feedback: "موسیقی گوش می‌دم means 'I listen to music.'"
  fa.a1.unit24.lesson02.exercise05.translate_i_watch_movies:
    instruction: "Translate into Farsi: I watch movies."
    accepted_answers: [{value: "فیلم می‌بینم", status: correct}]
    feedback: "فیلم می‌بینم means 'I watch movies.'"

  fa.a1.unit24.lesson03.exercise01.recognize_varzesh:
    instruction: "What does this word mean?"
    correct_option: "sport / exercise"
    distractors: [football, play, movie]
    accepted_answers: [{value: "sport / exercise", status: correct}]
    feedback: "ورزش means sport/exercise."
  fa.a1.unit24.lesson03.exercise02.recognize_footbal:
    instruction: "What does this word mean?"
    correct_option: football
    distractors: ["sport / exercise", music, movie]
    accepted_answers: [{value: football, status: correct}]
    feedback: "فوتبال means football."
  fa.a1.unit24.lesson03.exercise03.match_sport_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {ورزش: "sport / exercise", "می‌کنم": "I do", فوتبال: football, بازی: play, موسیقی: music, فیلم: movie, سرگرمی: hobby}
        status: correct
    feedback: "This reviews sport vocabulary alongside earlier lessons' hobby words."
  fa.a1.unit24.lesson03.exercise04.word_order_play_football:
    instruction: "Put the words in order."
    accepted_answers: [{value: [فوتبال, بازی, "می‌کنم"], status: correct}]
    feedback: "فوتبال بازی می‌کنم means 'I play football.'"
  fa.a1.unit24.lesson03.exercise05.translate_i_exercise:
    instruction: "Translate into Farsi: I exercise."
    accepted_answers: [{value: "ورزش می‌کنم", status: correct}]
    feedback: "ورزش می‌کنم means 'I exercise.'"

  fa.a1.unit24.lesson04.exercise01.recognize_har_hafte:
    instruction: "What does this phrase mean?"
    correct_option: "every week"
    distractors: [sometimes, week, "free time"]
    accepted_answers: [{value: "every week", status: correct}]
    feedback: "هر هفته means every week."
  fa.a1.unit24.lesson04.exercise02.recognize_gahi:
    instruction: "What does this word mean?"
    correct_option: sometimes
    distractors: ["every week", week, always]
    accepted_answers: [{value: sometimes, status: correct}]
    feedback: "گاهی means sometimes."
  fa.a1.unit24.lesson04.exercise03.match_frequency_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {هفته: week, "هر هفته": "every week", گاهی: sometimes, "چیکار می‌کنی": "what do you do", تو: you, ورزش: "sport / exercise", فوتبال: football}
        status: correct
    feedback: "This reviews frequency words alongside sport vocabulary from lesson03."
  fa.a1.unit24.lesson04.exercise04.word_order_every_week_exercise:
    instruction: "Put the words in order."
    accepted_answers: [{value: [هر, هفته, ورزش, "می‌کنم"], status: correct}]
    feedback: "هر هفته ورزش می‌کنم means 'Every week I exercise.'"
  fa.a1.unit24.lesson04.exercise05.translate_what_do_you_do:
    instruction: "Translate into Farsi: What do you do in your free time?"
    accepted_answers:
      - {value: "تو وقت آزاد چیکار می‌کنی؟", status: correct}
      - {value: "وقت آزاد چیکار می‌کنی؟", status: correct}
    feedback: "تو وقت آزاد چیکار می‌کنی؟ means 'What do you do in your free time?'"

  fa.a1.unit24.lesson05.exercise01.reading_comprehension_what_nima_likes:
    instruction: "What does Nima like doing?"
    correct_option: "Reading books"
    distractors: [Football, Music, "Watching movies"]
    accepted_answers: [{value: "Reading books", status: correct}]
    feedback: "نیما کتاب خوندن دوست داره -- Nima likes reading books."
  fa.a1.unit24.lesson05.exercise02.reading_comprehension_how_often:
    instruction: "How often does Nima read?"
    correct_option: "Every week"
    distractors: [Sometimes, Never, "Every day"]
    accepted_answers: [{value: "Every week", status: correct}]
    feedback: "هر هفته چند تا کتاب می‌خونه -- he reads a few books every week."
  fa.a1.unit24.lesson05.exercise03.match_reading_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"چند تا": "a few / how many", "می‌خونه": "he/she reads", "می‌کنه": "he/she does", هم: "also / too", نیما: Nima, کتاب: book, هفته: week}
        status: correct
    feedback: "These words all appear in the reading passage."
  fa.a1.unit24.lesson05.exercise04.translate_nima_likes_reading:
    instruction: "Translate into Farsi: Nima likes reading books."
    accepted_answers: [{value: "نیما کتاب خوندن دوست داره", status: correct}]
    feedback: "نیما کتاب خوندن دوست داره means 'Nima likes reading books.'"
  fa.a1.unit24.lesson05.exercise05.write_own_hobby:
    instruction: "Write a sentence about your own hobby."
    accepted_answers:
      - {value: "من کتاب خوندن دوست دارم", status: correct}
      - {value: "من موسیقی گوش می‌دم", status: correct}
      - {value: "من فیلم می‌بینم", status: correct}
      - {value: "من ورزش می‌کنم", status: correct}
      - {value: "من فوتبال بازی می‌کنم", status: correct}
    feedback: "Any true statement using a taught hobby word is accepted."

  fa.a1.unit24.lesson06.exercise01.dialogue_comprehension_context:
    instruction: "What happened in this conversation?"
    correct_option: "Sara likes watching movies and goes to the cinema every week; Nima likes reading books and sometimes plays football."
    distractors:
      - "Nima likes watching movies and goes to the cinema every week; Sara likes reading books and sometimes plays football."
      - "Both Nima and Sara only play football in their free time."
      - "Sara doesn't have any free time this week."
    accepted_answers: [{value: "Sara likes watching movies and goes to the cinema every week; Nima likes reading books and sometimes plays football.", status: correct}]
    feedback: "سارا فیلم دیدن دوست داره و هر هفته می‌ره سینما؛ نیما کتاب خوندن دوست داره و گاهی فوتبال بازی می‌کنه."
  fa.a1.unit24.lesson06.exercise02.match_dialogue_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {سینما: cinema, "می‌رم": "I go", فیلم: movie, دیدن: "to watch / to see", "چه خوب": "how nice", سارا: Sara, ورزش: "sport / exercise", فوتبال: football}
        status: correct
    feedback: "This reviews the whole dialogue's key vocabulary."
  fa.a1.unit24.lesson06.exercise03.reading_comprehension_who_likes_what:
    instruction: "Who likes watching movies, and who likes reading books?"
    correct_option: "Sara likes movies; Nima likes books"
    distractors: ["Nima likes movies; Sara likes books", "Both like movies", "Both like books"]
    accepted_answers: [{value: "Sara likes movies; Nima likes books", status: correct}]
    feedback: "من فیلم دیدن دوست دارم (سارا می‌گه)؛ من کتاب خوندن دوست دارم (نیما می‌گه)."
  fa.a1.unit24.lesson06.exercise04.dialogue_response_own_hobby:
    instruction: "Respond to وقت آزاد چیکار می‌کنی؟ by saying you exercise."
    accepted_answers:
      - {value: "من ورزش می‌کنم", status: correct}
      - {value: "ورزش می‌کنم", status: correct}
    feedback: "من ورزش می‌کنم means 'I exercise.'"
  fa.a1.unit24.lesson06.exercise05.write_comparison_hobbies:
    instruction: "Write a sentence comparing your hobby and Sara's hobby."
    accepted_answers:
      - {value: "من کتاب خوندن دوست دارم و سارا فیلم دیدن دوست داره", status: correct}
      - {value: "من ورزش می‌کنم و سارا فیلم دیدن دوست داره", status: correct}
    feedback: "من کتاب خوندن دوست دارم، سارا فیلم دیدن دوست داره -- I like reading, Sara likes watching movies."
