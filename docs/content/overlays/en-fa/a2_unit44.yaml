teaching:
  fa.a2.unit44.lesson01.teach.orders:
    title: Orders and bookings
    gloss: order, room, booking, ready
    note: '*سفارش دادن* is “to order”; *رزرو کردن* is “to book”.'
    example_gloss:
    - The order is here.
    - The room is here.
    - The booking is here.
    - The room is ready.
  fa.a2.unit44.lesson01.teach.neg:
    title: Not yet
    gloss: yet (with a negative verb), has not come, I did not give, I did not do
    note: '*هنوز* with a negative verb means “not yet”.'
    example_gloss:
    - My order has not come yet.
    - I have not ordered yet.
    - I have not booked yet.
    - The room is not ready yet.
  fa.a2.unit44.lesson01.teach.rule:
    title: هنوز + negative = not yet
    gloss: My order has not come yet; I have not ordered yet; the room is not ready yet
    note: 'Put *هنوز* before a negative verb to say that something has not happened yet. Both a perfect (*نیومده*) and a simple past (*ندادم*) work. With a positive verb *هنوز* means “still”: *اتاق هنوز اینجاست* (the room is still here).'
  fa.a2.unit44.lesson02.teach.appointments:
    title: Appointments
    gloss: appointment (time slot), doctor, free, work
    note: '*وقت* is an appointment or a free time slot.'
    example_gloss:
    - The doctor’s appointment is here.
    - The doctor is here.
    - This slot is free.
  fa.a2.unit44.lesson02.teach.dige:
    title: Not any more
    gloss: any more, I do not want, he/she does not (work)
    note: '*دیگه* with a negative verb means “not any more”.'
    example_gloss:
    - I do not want it any more.
    - The doctor does not work here any more.
    - This slot is not free any more.
  fa.a2.unit44.lesson02.teach.rule:
    title: دیگه + negative = not any more
    gloss: I do not want coffee any more; the doctor does not work here any more; this slot is not free any more
    note: Put *دیگه* before a negative verb to say that something was true before but is not true now. *دیگه* also means “another / other” in other sentences, but with a negative verb it means “not any more”.
  fa.a2.unit44.lesson03.teach.hich_words:
    title: Nothing, nobody, no ...
    gloss: nothing, nobody, no
    note: '*هیچ* with a negative verb means “no / none / nothing”.'
    example_gloss:
    - I want nothing.
    - Nobody is here.
    - No table is free.
    - The table is here.
  fa.a2.unit44.lesson03.teach.rule:
    title: هیچ + negative verb
    gloss: I want nothing; nobody came; no table is free; no room is ready
    note: 'Persian uses *هیچ* together with a negative verb: *هیچی نمی‌خوام*. With a noun, add *ی*: *هیچ میزی*, *هیچ اتاقی*. English has only one negative; Persian has two (*هیچ* and the verb).'
  fa.a2.unit44.lesson04.teach.answers:
    title: Short answers
    gloss: Have you ordered? No, not yet. Do you want coffee? No, not any more. Do you want anything? No, nothing.
    note: 'To correct a mistake quickly, start with *نه* and then one short word: *هنوز نه*, *دیگه نه*, *هیچی*. You can then add the full sentence.'
  fa.a2.unit44.lesson04.teach.phrases:
    title: Checking and correcting
    gloss: that is right, only, water
    note: '*درسته؟* asks “is that right?”.'
    example_gloss:
    - Two coffees, is that right?
    - I only want water.
  fa.a2.unit44.lesson05.teach.reading:
    title: A booking problem
    gloss: 'Nima booked a room for two nights. Today he went to the hotel, but the room was not ready yet. The clerk said: “No room is free.” Nima said: “Then I do not want this hotel any more.”'
    note: Read once for what happened, then again for *هنوز*, *هیچ* and *دیگه*.
  fa.a2.unit44.lesson06.teach.turn01:
    title: The waiter brings an order
    gloss: 'Waiter: Excuse me, your order is ready. Two coffees, right?'
    note: '*درسته؟* asks for confirmation.'
  fa.a2.unit44.lesson06.teach.turn02:
    title: 'Nima corrects: not yet'
    gloss: 'Nima: No, I have not ordered yet.'
    note: '*هنوز ... ندادم* means “not yet”.'
  fa.a2.unit44.lesson06.teach.turn03:
    title: The waiter understands
    gloss: 'Waiter: Then these coffees are not yours.'
    note: '*مال شما نیست* is the negative of *مال شماست*.'
  fa.a2.unit44.lesson06.teach.turn04:
    title: Nima corrects again
    gloss: 'Nima: I already had coffee today, so I do not want coffee any more. I do not want anything, just water.'
    note: '*دیگه* and *هیچی* both go with a negative verb.'
