  notes: 'Fresh-context review required before import. Review 2026-10-20: 8 fixes - البته gloss ''of course / however'' -> ''of course / admittedly'' (البته does not mean ''however''; card, match key); example_gloss ''Exactly this word is problematic'' -> ''This exact word is the problem''; removed accepted translation *بهتر است جمله را کمی نرم‌تر بنویسیم* (drops the hedge شاید, which is the point of the lesson); replaced accepted *در واقع همین نکته ...* (''in fact'') with *دقیقا همین نکته ما را نگران می‌کند* (true paraphrase of ''exactly this point worries us''); added comma variant *اگر لحن محترمانه بماند، متن ...*; three grammar notes rewritten with *asterisk*-wrapped Persian. Paired with fa/b2_unit03_nuance.yaml. Checked clean: Persian/English glosses, matching pairs, MC and listen_select keys and distractors, dialogue/audio text equality, ی/ک and ZWNJ usage, answer leakage. NATIVE FLAGS: see the paired realization file. Follow-up 2026-10-20: replaced the 27 template teaching-card notes ("Farsi form: X. Watch ezafe links...") with card-specific notes on usage, register, ezafe and government; ezafe claims hand-checked.'
course:
  title: Farsi B2
  description: Soften, qualify, or emphasize claims without changing their core meaning.
units:
  fa.b2.unit03.nuance:
    title: Nuance
    description: Soften, qualify, or emphasize claims without changing their core meaning.
lessons:
  fa.b2.unit03.nuance.lesson01.hedging:
    title: Hedging a claim
  fa.b2.unit03.nuance.lesson02.qualification:
    title: Qualification
  fa.b2.unit03.nuance.lesson03.emphasis:
    title: Clear emphasis
teaching:
  fa.b2.unit03.nuance.lesson01.hedging.teach.card01:
    title: perhaps it would be better
    gloss: perhaps it would be better
    note: 'Softens advice: *شاید* + *بهتر باشد* (subjunctive) is gentler than a direct instruction. Spoken: *شاید بهتر باشه*.'
    example_gloss: Perhaps it would be better to write this sentence again tomorrow.
  fa.b2.unit03.nuance.lesson01.hedging.teach.card02:
    title: it seems
    gloss: it seems
    note: 'Impersonal "it seems", usually followed by a *که* clause. It sounds more written than the spoken *انگار*.'
    example_gloss: It seems the text is a little harsh.
  fa.b2.unit03.nuance.lesson01.hedging.teach.card03:
    title: a little
    gloss: a little
    note: '"A little", used to soften a request or criticism. Spoken, you will hear *یه کم*; keep *کمی* in writing.'
    example_gloss: It is better if we wait a little.
  fa.b2.unit03.nuance.lesson01.hedging.teach.card04:
    title: softer
    gloss: softer
    note: 'Comparative with *-تر*, written with a ZWNJ: *نرم‌تر*. As an adjective it follows its noun with ezafe: *لحن نرم‌تر*.'
    example_gloss: A softer tone has more effect.
  fa.b2.unit03.nuance.lesson01.hedging.teach.card05:
    title: claim
    gloss: claim
    note: '"Claim" can sound accusatory when the claim is unproven. *نظر* ("opinion") is the milder choice.'
    example_gloss: This claim is harsh without documentation.
  fa.b2.unit03.nuance.lesson01.hedging.teach.card06:
    title: to some extent
    gloss: to some extent
    note: 'A formal hedge, "to some extent", literally "up to a limit". *تا حدودی* is an equally common variant.'
    example_gloss: I agree with your point to some extent.
  fa.b2.unit03.nuance.lesson01.hedging.teach.card07:
    title: tone
    gloss: tone
    note: '"Tone" of voice or writing. What it describes attaches with ezafe: *لحنِ نامه*.'
    example_gloss: The tone of the letter is respectful.
  fa.b2.unit03.nuance.lesson01.hedging.teach.card08:
    title: is debatable
    gloss: is debatable
    note: 'An idiom meaning "debatable", literally "has room for discussion". It lets you disagree politely without saying "wrong".'
    example_gloss: This conclusion is still debatable.
  fa.b2.unit03.nuance.lesson01.hedging.teach.card09:
    title: cautiously
    gloss: cautiously
    note: 'Adverb formed with *-انه*: *محتاط* + *انه*, "cautiously". The same form can also work as an adjective. Formal.'
    example_gloss: Answering cautiously is sometimes necessary.
  fa.b2.unit03.nuance.lesson01.hedging.teach.grammar:
    title: Nuance grammar
    gloss: Nuance grammar
    note: '*شاید بهتر باشد* and *به نظر می‌رسد* soften a claim. This is not weakness; it signals caution or politeness.'
  fa.b2.unit03.nuance.lesson02.qualification.teach.card01:
    title: of course / admittedly
    gloss: of course / admittedly
    note: '"Of course", but also used to concede or add a limit rather than simply agree. It often opens a qualifying clause.'
    example_gloss: Of course, not everyone disagrees with this sentence.
  fa.b2.unit03.nuance.lesson02.qualification.teach.card02:
    title: unless
    gloss: unless
    note: '"Unless", followed by the subjunctive: *مگر اینکه … شود*. The *اینکه* can also be written *این‌که*.'
    example_gloss: We will not delay the meeting unless the rain becomes heavy.
  fa.b2.unit03.nuance.lesson02.qualification.teach.card03:
    title: provided that
    gloss: provided that
    note: '"Provided that", followed by the subjunctive. *شرط* means "condition", and the *که* clause states what must hold.'
    example_gloss: Provided that the tone stays respectful, we will publish the text.
  fa.b2.unit03.nuance.lesson02.qualification.teach.card04:
    title: more precise
    gloss: more precise
    note: 'Comparative of *دقیق* with a ZWNJ before *تر*. It follows its noun with ezafe, as in *کلمه‌ی دقیق‌تر*.'
    example_gloss: A more precise word reduces misunderstanding.
  fa.b2.unit03.nuance.lesson02.qualification.teach.card05:
    title: absolute
    gloss: absolute
    note: '"Absolute", following its noun. *مطلقا* is the adverb, "at all", and it normally appears in negative sentences.'
    example_gloss: An absolute judgement is not always right.
  fa.b2.unit03.nuance.lesson02.qualification.teach.card06:
    title: not completely
    gloss: not completely
    note: 'A partial negation: "not entirely". Repeated, *نه کاملا … نه کاملا* gives "neither completely … nor completely".'
    example_gloss: I am neither completely opposed nor completely in favor.
  fa.b2.unit03.nuance.lesson02.qualification.teach.card07:
    title: exception
    gloss: exception
    note: '"Exception". A rule "has" exceptions, so use *استثنا دارد*. It is also written *استثناء*.'
    example_gloss: There is an exception to every rule.
  fa.b2.unit03.nuance.lesson02.qualification.teach.card08:
    title: in most cases
    gloss: in most cases
    note: '*موارد* is the plural of *مورد* ("case"). The phrase is formal; it softens a general statement.'
    example_gloss: In most cases, a short letter is better.
  fa.b2.unit03.nuance.lesson02.qualification.teach.card09:
    title: limited
    gloss: limited
    note: '"Limited", an adjective that follows its noun. The related verb is *محدود کردن*, "to limit".'
    example_gloss: This proposal is limited but practical.
  fa.b2.unit03.nuance.lesson02.qualification.teach.grammar:
    title: Nuance grammar
    gloss: Nuance grammar
    note: '*البته* and *مگر اینکه* qualify a statement. They narrow the claim so it is precise instead of absolute.'
  fa.b2.unit03.nuance.lesson03.emphasis.teach.card01:
    title: exactly
    gloss: exactly
    note: 'Written *دقیقاً*, "exactly". Put it right before the word you stress. Alone, it is also a common reply meaning "exactly".'
    example_gloss: This exact word is the problem.
  fa.b2.unit03.nuance.lesson03.emphasis.teach.card02:
    title: this very point
    gloss: this very point
    note: '*همین* + noun means "this very" (compare *همان*, "that very"). No ezafe links the two.'
    example_gloss: Repeat this very point at the end.
  fa.b2.unit03.nuance.lesson03.emphasis.teach.card03:
    title: is what worries us
    gloss: is what worries us
    note: '*باعثِ* + ezafe means "cause of". *ماست* is *ما است* contracted, "is ours", so the phrase reads "is the cause of our worry".'
    example_gloss: Uncertainty about the time is what worries us.
  fa.b2.unit03.nuance.lesson03.emphasis.teach.card04:
    title: emphasis
    gloss: emphasis
    note: '"Emphasis", often written *تأکید* with a hamza. The compound verb *تأکید کردن* takes *بر*.'
    example_gloss: Too much emphasis sometimes makes the text harsh.
  fa.b2.unit03.nuance.lesson03.emphasis.teach.card05:
    title: nothing else
    gloss: nothing else
    note: 'Literally "not another thing". It closes the sentence to rule out alternatives, like "and nothing more".'
    example_gloss: The problem is the timing, nothing else.
  fa.b2.unit03.nuance.lesson03.emphasis.teach.card06:
    title: clear
    gloss: clear
    note: '"Clear", but also "bright" or "on" for a light. For a clear answer it follows the noun: *پاسخ روشن*.'
    example_gloss: A clear answer is better than a long sentence.
  fa.b2.unit03.nuance.lesson03.emphasis.teach.card07:
    title: we must state clearly
    gloss: we must state clearly
    note: '*باید* + subjunctive expresses obligation. *مشخص* works as an adverb here, "clearly", so it takes no ending. Spoken: *مشخص بگیم*.'
    example_gloss: We must state clearly what change we want.
  fa.b2.unit03.nuance.lesson03.emphasis.teach.card08:
    title: serious
    gloss: serious
    note: '"Serious", and also an adverb, "seriously". *جدی گرفتن* ("to take seriously") is a common compound.'
    example_gloss: The residents’ concern is serious.
  fa.b2.unit03.nuance.lesson03.emphasis.teach.card09:
    title: in fact
    gloss: in fact
    note: '"In fact", often used to restate or sharpen the previous point. It is two words in Persian and neutral in register.'
    example_gloss: In fact, the previous text was very vague.
  fa.b2.unit03.nuance.lesson03.emphasis.teach.grammar:
    title: Nuance grammar
    gloss: Nuance grammar
    note: '*دقیقا* and *همین* focus attention. Do not overuse them; they strengthen one specific point.'
