course:
  title: Farsi A2
  description: >-
    Lower-intermediate Iranian Farsi: describing work experience and
    availability, reading a job posting, and following a basic job
    interview from question through answer.

units:
  fa.a2.unit14.job_interview:
    title: The job interview

lessons:
  fa.a2.unit14.lesson01.interview_vocabulary: {title: "Interview words"}
  fa.a2.unit14.lesson02.describing_experience_and_availability: {title: "Describing experience and availability"}
  fa.a2.unit14.lesson03.reading_a_job_posting: {title: "Reading a job posting"}
  fa.a2.unit14.lesson04.interview_dialogue: {title: "The interview"}

teaching:
  fa.a2.unit14.lesson01.teach.interview_word:
    title: "Interview"
    gloss: "interview"
    note: "*مصاحبه* is the general word for an interview."
    example_gloss: "I have an interview tomorrow."
  fa.a2.unit14.lesson01.teach.experience_word:
    title: "Experience"
    gloss: "experience"
    note: "*تجربه* is the general word for experience."
    example_gloss: "I have three years of work experience."
  fa.a2.unit14.lesson01.teach.skill_word:
    title: "Skill"
    gloss: "skill"
    note: "*مهارت* is the general word for a skill."
    example_gloss: "What skills do you have?"
  fa.a2.unit14.lesson01.teach.salary_word:
    title: "Salary"
    gloss: "salary"
    note: "*حقوق* means salary."
    example_gloss: "What is the salary for this job?"
  fa.a2.unit14.lesson01.teach.job_opportunity_word:
    title: "Job opportunity"
    gloss: "job opportunity"
    note: "*فرصت شغلی* means a job opportunity."
    example_gloss: "This is a good job opportunity."
  fa.a2.unit14.lesson01.teach.resume_word:
    title: "Résumé"
    gloss: "résumé / CV"
    note: "*رزومه* is the standard Persian word (from French/English) for a résumé."
    example_gloss: "I sent my résumé."
  fa.a2.unit14.lesson01.teach.va_word:
    title: "And"
    gloss: "and"
    note: "*و* is the common connecting word used throughout this unit."
  fa.a2.unit14.lesson01.teach.ra_note:
    title: "Object marker"
    gloss: "(marks a definite direct object)"
    note: "*رو* (colloquial for formal *را*) marks a definite direct object -- it comes right after the thing being acted on."

  fa.a2.unit14.lesson02.teach.three_years_experience:
    title: "State work experience with a duration"
    gloss: "I have three years of work experience."
    note: "*سه سال تجربه‌ی کار* states the duration of the experience, the A2-level step up from A1's bare job-naming."
  fa.a2.unit14.lesson02.teach.can_start_next_week:
    title: "State availability"
    gloss: "I can start from next week."
    note: "*از هفته‌ی دیگه* (from next week) states when you're available to start."
  fa.a2.unit14.lesson02.teach.clarifying_question:
    title: "Ask a clarifying question"
    gloss: "What are the working hours for this job?"
    note: "*ساعت کاری این شغل چطوره؟* is a natural clarifying question to ask an interviewer."

  fa.a2.unit14.lesson03.teach.salesperson_word:
    title: "Salesperson"
    gloss: "salesperson"
    note: "*فروشنده* is the general word for a salesperson."
    example_gloss: "The store needs a salesperson."
  fa.a2.unit14.lesson03.teach.at_least_word:
    title: "At least"
    gloss: "at least / minimum"
    note: "*حداقل* means at least or minimum."
    example_gloss: "At least one year of experience is needed."
  fa.a2.unit14.lesson03.teach.posting_text:
    title: "A job posting"
    gloss: "The store needs a salesperson with at least one year of experience. Good salary. Interviews are happening this week."
    note: "A short job posting, the written register this unit is teaching."

  fa.a2.unit14.lesson04.teach.tell_me_about_experience:
    title: "Tell me about your experience"
    gloss: "Please tell me about your work experience."
    note: "*لطفاً از تجربه‌ی کاریتون بگید.* is a standard interviewer opener."
  fa.a2.unit14.lesson04.teach.turn01:
    title: "مصاحبه‌کننده asks about experience"
    gloss: "The interviewer asks آرش to tell her about his work experience."
    note: "Reuses this lesson's own opener phrase."
  fa.a2.unit14.lesson04.teach.turn02:
    title: "آرش describes his experience"
    gloss: "آرش says he worked in an office for three years."
    note: "Reuses lesson02's duration-of-experience pattern in a slightly different form."
  fa.a2.unit14.lesson04.teach.turn03:
    title: "مصاحبه‌کننده asks about skills"
    gloss: "The interviewer asks what skills he has."
    note: "*چه مهارت‌هایی دارید؟* asks about skills specifically."
  fa.a2.unit14.lesson04.teach.turn04:
    title: "آرش describes his skills"
    gloss: "آرش says he's good at teamwork and problem-solving."
    note: "*تو ... خوبم* (I'm good at ...) states a skill."
  fa.a2.unit14.lesson04.teach.turn05:
    title: "مصاحبه‌کننده asks about availability"
    gloss: "The interviewer asks if he can start from next week."
    note: "Reuses lesson02's availability pattern as a question."
  fa.a2.unit14.lesson04.teach.turn06:
    title: "آرش confirms"
    gloss: "آرش says yes, he can."
    note: "A short, direct confirmation."

exercises:
  fa.a2.unit14.lesson01.exercise01.recognize_interview:
    instruction: "What does this word mean?"
    correct_option: "interview"
    distractors: ["experience", "skill", "salary"]
    accepted_answers: [{value: "interview", status: correct}]
    feedback: "*مصاحبه* means interview."
  fa.a2.unit14.lesson01.exercise02.recognize_salary:
    instruction: "What does this word mean?"
    correct_option: "salary"
    distractors: ["interview", "résumé", "skill"]
    accepted_answers: [{value: "salary", status: correct}]
    feedback: "*حقوق* means salary."
  fa.a2.unit14.lesson01.exercise03.match_interview_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {مصاحبه: interview, تجربه: experience, مهارت: skill, حقوق: salary, "فرصت شغلی": "job opportunity", رزومه: résumé}, status: correct}
    feedback: "These six words cover this unit's basic job-interview vocabulary."
  fa.a2.unit14.lesson01.exercise04.order_i_have_experience:
    instruction: "Arrange the words to say experience and skill."
    accepted_answers: [{value: [تجربه, و, مهارت], status: correct}]
    feedback: "*تجربه و مهارت* joins the two words with *و*."
  fa.a2.unit14.lesson01.exercise05.write_resume:
    instruction: "Write the Farsi word for résumé."
    accepted_answers:
      - {value: رزومه, status: correct}
    feedback: "*رزومه* means résumé."

  fa.a2.unit14.lesson02.exercise01.recognize_experience_sentence:
    instruction: "Which sentence states work experience with a duration?"
    correct_option: "I have three years of work experience."
    distractors: ["I can start from next week.", "What are the working hours for this job?", "I sent my résumé."]
    accepted_answers: [{value: "I have three years of work experience.", status: correct}]
    feedback: "*من سه سال تجربه‌ی کار دارم.* states three years of experience."
  fa.a2.unit14.lesson02.exercise02.order_can_start_next_week:
    instruction: "Arrange the words to say: I can start from next week."
    accepted_answers: [{value: [می‌تونم, از, "هفته‌ی", دیگه, شروع, کنم], status: correct}]
    feedback: "*می‌تونم از هفته‌ی دیگه شروع کنم.* states your availability."
  fa.a2.unit14.lesson02.exercise03.dialogue_response_availability:
    instruction: "The interviewer asks: 'When can you start?' Answer that you can start from next week."
    accepted_answers:
      - {value: "می‌تونم از هفته‌ی دیگه شروع کنم.", status: correct}
      - {value: "می‌تونم از هفته‌ی دیگه شروع کنم", status: correct}
    feedback: "*می‌تونم از هفته‌ی دیگه شروع کنم.* states when you can start."
  fa.a2.unit14.lesson02.exercise04.translate_experience_and_availability:
    instruction: "Translate into Farsi: I have three years of work experience, and I can start from next week."
    accepted_answers:
      - {value: "من سه سال تجربه‌ی کار دارم و می‌تونم از هفته‌ی دیگه شروع کنم.", status: correct}
      - {value: "من سه سال تجربه‌ی کار دارم، می‌تونم از هفته‌ی دیگه شروع کنم.", status: correct}
      - {value: "من سه سال تجربه‌ی کار دارم. می‌تونم از هفته‌ی دیگه شروع کنم.", status: correct}
    feedback: "Joining the two statements with *و*, a comma, or a period are equally natural here."
  fa.a2.unit14.lesson02.exercise05.write_clarifying_question:
    instruction: "Write: what are the working hours for this job?"
    accepted_answers:
      - {value: "ساعت کاری این شغل چطوره؟", status: correct}
      - {value: "ساعت کاری این شغل چطوره", status: correct}
    feedback: "*ساعت کاری این شغل چطوره؟* is a natural clarifying question."

  fa.a2.unit14.lesson03.exercise01.read_experience_required:
    instruction: "According to the posting, how much experience is needed?"
    correct_option: "At least one year."
    distractors: ["At least three years.", "No experience needed.", "The posting does not say."]
    accepted_answers: [{value: "At least one year.", status: correct}]
    feedback: "*حداقل یک سال تجربه نیاز داره* -- at least one year."
  fa.a2.unit14.lesson03.exercise02.read_interview_timing:
    instruction: "According to the posting, when are interviews happening?"
    correct_option: "This week."
    distractors: ["Next week.", "Next month.", "The posting does not say."]
    accepted_answers: [{value: "This week.", status: correct}]
    feedback: "*مصاحبه‌ها این هفته انجام می‌شه* -- interviews are happening this week."
  fa.a2.unit14.lesson03.exercise03.recognize_salesperson:
    instruction: "What does this word mean?"
    correct_option: "salesperson"
    distractors: ["interview", "experience", "at least"]
    accepted_answers: [{value: "salesperson", status: correct}]
    feedback: "*فروشنده* means salesperson."
  fa.a2.unit14.lesson03.exercise04.order_store_needs_salesperson:
    instruction: "Arrange the words to say: the store needs a salesperson."
    accepted_answers: [{value: [فروشگاه, به, یک, فروشنده, نیاز, داره], status: correct}]
    feedback: "*فروشگاه به یک فروشنده نیاز داره.* states what the store needs."
  fa.a2.unit14.lesson03.exercise05.write_experience_required:
    instruction: "Write that at least one year of experience is needed."
    accepted_answers:
      - {value: "حداقل یک سال تجربه لازمه.", status: correct}
      - {value: "حداقل یک سال تجربه لازمه", status: correct}
    feedback: "*حداقل یک سال تجربه لازمه.* states the requirement."

  fa.a2.unit14.lesson04.exercise01.comprehend_arash_experience:
    instruction: "What work experience does آرش describe?"
    correct_option: "Three years working in an office."
    distractors: ["One year working in a store.", "No previous work experience.", "Five years as a teacher."]
    accepted_answers: [{value: "Three years working in an office.", status: correct}]
    feedback: "*من سه سال تو یه دفتر کار کردم.* -- three years working in an office."
  fa.a2.unit14.lesson04.exercise02.comprehend_arash_skills:
    instruction: "What skills does آرش say he has?"
    correct_option: "Teamwork and problem-solving."
    distractors: ["Public speaking and writing.", "Sales and negotiation.", "He doesn't mention any skills."]
    accepted_answers: [{value: "Teamwork and problem-solving.", status: correct}]
    feedback: "*تو کار تیمی و حل مسئله خوبم* -- teamwork and problem-solving."
  fa.a2.unit14.lesson04.exercise03.recognize_skill_word_in_context:
    instruction: "In this question, what does مهارت‌هایی mean?"
    correct_option: "skills"
    distractors: ["experience", "salary", "interview"]
    accepted_answers: [{value: "skills", status: correct}]
    feedback: "*مهارت‌هایی* is *مهارت* (skill) with a plural/indefinite ending -- 'skills'."
  fa.a2.unit14.lesson04.exercise04.order_good_at_teamwork:
    instruction: "Arrange the words to say: I'm good at teamwork and problem-solving."
    accepted_answers: [{value: [تو, کار, "تیمی", و, حل, مسئله, خوبم], status: correct}]
    feedback: "*تو کار تیمی و حل مسئله خوبم.* states these two skills."
  fa.a2.unit14.lesson04.exercise05.dialogue_response_can_start:
    instruction: "The interviewer asks: 'Can you start from next week?' Answer yes, you can."
    accepted_answers:
      - {value: "بله، می‌تونم.", status: correct}
      - {value: "بله می‌تونم", status: correct}
    feedback: "*بله، می‌تونم.* confirms you can."
  fa.a2.unit14.lesson04.exercise06.write_interview_summary:
    instruction: "Write what آرش says about his experience: you worked in an office for three years."
    accepted_answers:
      - {value: "من سه سال تو یه دفتر کار کردم", status: correct}
      - {value: "من سه سال تو یه دفتر کار کردم.", status: correct}
    feedback: "*من سه سال تو یه دفتر کار کردم.* is what آرش says about his work experience."
