teaching:
  fa.a2.unit34.lesson01.teach.reason_nouns:
    title: Reason words
    gloss: rain, traffic, work, sick, yesterday, today
    note: '*بارون* is the spoken form of “rain”. These are the everyday reasons behind excuses and changes of plan.'
    example_gloss: [Yesterday it was rainy., Today there is traffic., Today I have work., Yesterday I had work., Yesterday I was sick.]
  fa.a2.unit34.lesson01.teach.past_actions:
    title: Results
    gloss: it rained, I did not come, I am not coming, I arrived late
    note: 'These short forms are the results you will link to a reason (past: *نیومدم*; present: *نمیام*). *نیومدم* is the negative of *اومدم* (I came).'
    example_gloss: [Yesterday it rained., I did not come yesterday., I am not coming today., I arrived late today.]
  fa.a2.unit34.lesson01.teach.connectors:
    title: Three connectors
    gloss: because, so / that is why, because of
    note: Three ways to link a reason and a result. *چون* and *به خاطر* mark the reason; *برای همین* marks the result.
    example_gloss: ['Because it rained, I did not come.', 'It rained, so I did not come.', I did not come because of the rain.]
  fa.a2.unit34.lesson01.teach.weather_causes:
    title: Weather causes
    gloss: heat, cold
    note: Use these weather nouns after *به خاطر* to give a reason.
    example_gloss: ['I was sick because of the heat.', 'I was sick because of the cold.']
  fa.a2.unit34.lesson01.teach.everyday_causes:
    title: Everyday causes
    gloss: tiredness, sleep, overtime, project
    note: These nouns give common reasons related to tiredness and work.
    example_gloss: ['I arrived late because of tiredness.', 'I arrived late because of sleep.', 'I had overtime because of the project.']
  fa.a2.unit34.lesson01.teach.chon: {title: چون introduces the reason, gloss: 'Because it rained, I did not come.', note: '*چون* + a full clause (with its own verb) gives the reason, and the result follows after the comma: *چون بارون اومد، نیومدم*.'}
  fa.a2.unit34.lesson01.teach.baraye_hamin: {title: برای همین introduces the result, gloss: 'It rained, so I did not come.', note: 'Say the reason first as its own clause, then *برای همین* + the result: *بارون اومد، برای همین نیومدم*. It means “that is why”.'}
  fa.a2.unit34.lesson02.teach.plan_changes:
    title: Excuses and changes of plan
    gloss: my car broke down, I did not go to work, I could not come, we changed our appointment
    note: '*قرار* is an appointment or arranged plan. *سر کار نرفتم* = “I did not go to work”. *نتونستم بیام* = “I could not come”.'
    example_gloss: [My car broke down., I did not go to work yesterday., I could not come today., We changed our appointment.]
  fa.a2.unit34.lesson02.teach.khater: {title: به خاطر + noun, gloss: I did not come because of the rain., note: '*به خاطر* is followed by a noun, with no verb of its own: *به خاطر بارون*, *به خاطر ترافیک*, *به خاطر کار*. The rest of the sentence gives the result: *به خاطر ترافیک دیر رسیدم*.'}
  fa.a2.unit34.lesson02.teach.khater_vs_chon: {title: 'Same meaning, two shapes', gloss: because of traffic = because there was traffic, note: '*به خاطر ترافیک* and *چون ترافیک بود* give the same reason. Use *به خاطر* when the reason is just a noun, and *چون* when you say a whole clause.'}
  fa.a2.unit34.lesson03.teach.order: {title: Reason first or result second, gloss: 'Because I had work, I did not come / I had work, so I did not come', note: 'With *چون*, the reason clause opens the sentence and the result closes it. With *برای همین*, the reason is a separate clause first and the result comes after *برای همین*. In both, the reason is said before the result.'}
  fa.a2.unit34.lesson03.teach.clause_vs_noun: {title: Clause or noun, gloss: 'چون + clause, به خاطر + noun', note: 'After *چون* you need a verb (*بارون اومد*, *ترافیک بود*). After *به خاطر* you use only a noun (*بارون*, *ترافیک*). Do not say *به خاطر بارون اومد* for “because it rained”.'}
  fa.a2.unit34.lesson03.teach.one_connector: {title: One connector for one link, gloss: Do not combine چون and برای همین in one link, note: Use either *چون ... ،* or *... ، برای همین ...* for a single reason and result. Saying both in the same link repeats the meaning and sounds wrong.}
  fa.a2.unit34.lesson04.teach.excuse_questions:
    title: Asking why
    gloss: why, sorry, you arrived, you did not come, and
    note: '*چرا* asks for a reason. *ببخشید* opens an apology. *و* joins two facts.'
    example_gloss: ['Why did you not come yesterday?', 'Why did you arrive late?', 'Sorry, I arrived late.', It rained and there was traffic.]
  fa.a2.unit34.lesson04.teach.answer_chon: {title: Answering چرا, gloss: An answer to چرا starts with چون, note: 'The natural answer to *چرا* starts with *چون* and gives only the reason: *چون ترافیک بود*. Add the result with a second clause if you want to.'}
  fa.a2.unit34.lesson05.teach.message: {title: A message about a missed appointment, gloss: 'Hi Sara. Yesterday I could not come, because my car broke down. Because of the rain there was traffic too. Today I am sick, so I changed our appointment.', note: 'Read once for the three reasons, then again for what followed from each.'}
  fa.a2.unit34.lesson06.teach.dialogue_words:
    title: Words for the conversation
    gloss: we, yes, well, no, we had an appointment, are you coming, I am coming, I am not coming
    note: '*آره* is the spoken form of “yes”. *میای؟* asks “are you coming?”; the answers are *میام* and *نمیام*.'
    example_gloss: [We had an appointment yesterday., 'Yes, I am coming.', 'Well, are you coming today?', 'No, I am not coming today.']
  fa.a2.unit34.lesson06.teach.turn01: {title: Sara asks why, gloss: 'Sara asks Nima: Nima, why did you not come yesterday?', note: The question *چرا* asks for a reason.}
  fa.a2.unit34.lesson06.teach.turn02: {title: Nima gives the reason, gloss: 'Nima: Because it rained.', note: A short answer to *چرا* starts with *چون*.}
  fa.a2.unit34.lesson06.teach.turn03: {title: Sara reminds him, gloss: 'Sara: But we had an appointment.', note: '*قرار داشتیم* means “we had an appointment”.'}
  fa.a2.unit34.lesson06.teach.turn04: {title: Nima explains the result, gloss: 'Nima: Yes, it rained and there was traffic, so I could not come.', note: 'Two reasons are joined with *و*, then *برای همین* gives the result.'}
  fa.a2.unit34.lesson06.teach.turn05: {title: Sara asks about today, gloss: 'Sara: Well, are you coming today?', note: A present question about the plan.}
  fa.a2.unit34.lesson06.teach.turn06: {title: Nima gives a present reason, gloss: 'Nima: No, because I have work today, I am not coming.', note: 'A present reason with *چون*, then the result.'}
exercises:
  fa.a2.unit34.lesson01.exercise01.recognize_chon:
    instruction: What does this sentence mean?
    correct_option: Because it rained, I did not come.
    distractors: ['It rained, so I came.', 'I did not come, so it rained.', 'If it rains, I will not come.']
    accepted_answers:
    - {value: 'Because it rained, I did not come.', status: correct}
    feedback: '*چون* marks the reason: it rained, so I did not come.'
  fa.a2.unit34.lesson01.exercise02.recognize_baraye_hamin:
    instruction: What does this sentence mean?
    correct_option: I had work, so I did not come.
    distractors: ['I did not come, so I had work.', 'I had work, but I came.', 'I have work, so I will not come.']
    accepted_answers:
    - {value: 'I had work, so I did not come.', status: correct}
    feedback: '*برای همین* introduces the result: I had work, so I did not come.'
  fa.a2.unit34.lesson01.exercise03.match_reason_words:
    instruction: Match each Farsi word or connector with its meaning.
    accepted_answers:
    - value: {چون: because (before a reason clause), برای همین: 'so, that is why (before the result)', به خاطر: because of (before a noun), بارون: rain, ترافیک: traffic, مریض: sick, کار: work, دیر: late, خستگی: tiredness, خواب: sleep, گرما: heat, سرما: cold}
      status: correct
    feedback: Learn the three connectors first, then the reason words.
  fa.a2.unit34.lesson01.exercise04.order_chon:
    instruction: 'Arrange the words to say: Because it rained, I did not come.'
    accepted_answers:
    - value: [چون, بارون, اومد, نیومدم]
      status: correct
    feedback: '*چون بارون اومد، نیومدم*: the reason comes first, after *چون*.'
  fa.a2.unit34.lesson01.exercise05.fill_baraye_hamin:
    instruction: 'Complete the sentence with the connector that marks the result: It rained, so I did not come.'
    accepted_answers:
    - {value: برای همین, status: correct}
    feedback: The full sentence is *بارون اومد، برای همین نیومدم*.
  fa.a2.unit34.lesson01.exercise06.translate_baraye_hamin:
    instruction: 'Translate using برای همین: I had work, so I did not come.'
    accepted_answers:
    - {value: کار داشتم، برای همین نیومدم, status: correct}
    - {value: کار داشتم برای همین نیومدم, status: correct}
    - {value: من کار داشتم برای همین نیومدم, status: acceptable_with_note, note: '*من* is correct but normally dropped.'}
    feedback: 'Model: *کار داشتم، برای همین نیومدم.*'
  fa.a2.unit34.lesson01.exercise07.recognize_project_overtime:
    instruction: What does this sentence mean?
