course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: naming ways to get around (bus, metro, car,
    bicycle, on foot, taxi), saying how you commute regularly (every day
    by bus to work), asking which transport is better (اتوبوس یا مترو،
    کدوم بهتره؟), asking a local ticket price and reading a short
    transit-schedule sentence, a reading passage about نیما's and
    سارا's regular commutes, and a closing dialogue between نیما and
    سارا comparing how they each get around.

units:
  fa.a1.unit28.transportation:
    title: Transportation

lessons:
  fa.a1.unit28.lesson01.bus_metro: {title: "Bus and metro"}
  fa.a1.unit28.lesson02.car_bicycle: {title: "Car and bicycle"}
  fa.a1.unit28.lesson03.foot_taxi: {title: "On foot and taxi"}
  fa.a1.unit28.lesson04.ticket_schedule: {title: "Bus ticket"}
  fa.a1.unit28.lesson05.reading_about_the_commute: {title: "Reading about Nima's and Sara's commutes"}
  fa.a1.unit28.lesson06.comparing_commutes_dialogue: {title: "Dialogue: Which is better?"}

teaching:
  fa.a1.unit28.lesson01.teach.man_review:
    title: I
    gloss: I
    note: "*من*, already well established, reappears here for talking about how you get around."
  fa.a1.unit28.lesson01.teach.ba_word:
    title: "By / with"
    gloss: "by / with"
    note: "*با* is the preposition used with a vehicle: *با* + vehicle name + *می‌رم* means 'I go by [vehicle].'"
  fa.a1.unit28.lesson01.teach.otobus_review:
    title: Bus
    gloss: bus
    note: "*اتوبوس*, already taught back in unit16's travel vocabulary, is the everyday word for 'bus.'"
    example_gloss: "I go by bus."
  fa.a1.unit28.lesson01.teach.ba_otobus_phrase:
    title: "I go by bus"
    gloss: "I go by bus"
    note: "*با اتوبوس می‌رم* combines *با* + *اتوبوس* + *می‌رم* ('I go')."
  fa.a1.unit28.lesson01.teach.metro_word:
    title: "Metro / subway"
    gloss: "metro / subway"
    note: "*مترو* is a direct, everyday loanword -- Tehran's subway system is genuinely called *مترو*."
    example_gloss: "I go by metro."
  fa.a1.unit28.lesson01.teach.ba_metro_phrase:
    title: "I go by metro"
    gloss: "I go by metro"
    note: "*با مترو می‌رم* follows the exact same *با* + vehicle + *می‌رم* pattern as the bus."

  fa.a1.unit28.lesson02.teach.mashin_word:
    title: Car
    gloss: car
    note: "*ماشین* is the everyday word for 'car.'"
    example_gloss: "I go by car."
  fa.a1.unit28.lesson02.teach.ba_mashin_phrase:
    title: "I go by car"
    gloss: "I go by car"
    note: "*با ماشین می‌رم* follows the same *با* + vehicle + *می‌رم* pattern."
  fa.a1.unit28.lesson02.teach.docharkhe_word:
    title: Bicycle
    gloss: bicycle
    note: "*دوچرخه* means 'bicycle' -- literally 'two-wheel.'"
    example_gloss: "I go by bicycle."
  fa.a1.unit28.lesson02.teach.ba_docharkhe_phrase:
    title: "I go by bicycle"
    gloss: "I go by bicycle"
    note: "*با دوچرخه می‌رم* keeps the same pattern one more time."
  fa.a1.unit28.lesson02.teach.har_rooz_review:
    title: Every day
    gloss: every day
    note: "*هر روز*, already taught back in unit11, reappears here for describing a regular commute."
  fa.a1.unit28.lesson02.teach.sarkar_review:
    title: To work
    gloss: to work
    note: "*سر کار*, already taught back in unit11's *میرم سر کار*, means 'to work' -- no preposition needed, just *می‌رم* + *سر کار*."
  fa.a1.unit28.lesson02.teach.har_rooz_sarkar_phrase:
    title: "Every day I go to work by car"
    gloss: "Every day I go to work by car"
    note: "*هر روز با ماشین می‌رم سر کار* strings together everything in this lesson: frequency, vehicle, and destination."

  fa.a1.unit28.lesson03.teach.piyade_word:
    title: "On foot"
    gloss: "on foot"
    note: "*پیاده* means 'on foot' -- unlike the vehicles so far, it needs NO *با*: you just say *پیاده می‌رم*, not *با پیاده می‌رم*."
    example_gloss: "I go on foot."
  fa.a1.unit28.lesson03.teach.piyade_phrase:
    title: "I go on foot (no با)"
    gloss: "I go on foot"
    note: "*پیاده می‌رم* -- *پیاده* works like an adverb here, the same way English 'I walk' needs no preposition either."
  fa.a1.unit28.lesson03.teach.taxi_word:
    title: Taxi
    gloss: taxi
    note: "*تاکسی* is a direct, everyday loanword for taxi, and DOES take *با* like the other vehicles."
    example_gloss: "I go by taxi."
  fa.a1.unit28.lesson03.teach.ba_taxi_phrase:
    title: "I go by taxi"
    gloss: "I go by taxi"
    note: "*با تاکسی می‌رم* follows the regular *با* + vehicle pattern."
  fa.a1.unit28.lesson03.teach.kodoom_word:
    title: Which
    gloss: which
    note: "*کدوم* means 'which (one)' -- used here to ask which transport is better."
  fa.a1.unit28.lesson03.teach.behtare_review:
    title: Better
    gloss: better
    note: "*بهتره*, already taught back in unit15's comparisons, is the word for 'is better.'"
  fa.a1.unit28.lesson03.teach.ya_review:
    title: Or
    gloss: or
    note: "*یا*, already taught back in units 06/07/14, joins the two transport choices here."
  fa.a1.unit28.lesson03.teach.kodoom_behtare_phrase:
    title: "Bus or metro, which is better?"
    gloss: "Bus or metro, which is better?"
    note: "*اتوبوس یا مترو، کدوم بهتره؟* combines *یا* to list the choices with *کدوم بهتره؟* to ask for a recommendation."

  fa.a1.unit28.lesson04.teach.belit_review:
    title: Ticket
    gloss: ticket
    note: "*بلیط*, already taught back in unit16's travel vocabulary, reappears here for an everyday local bus ticket."
    example_gloss: "Where is the bus ticket?"
  fa.a1.unit28.lesson04.teach.gheymat_review:
    title: Price
    gloss: price
    note: "*قیمت*, already taught back in units 03/08, means 'price.'"
  fa.a1.unit28.lesson04.teach.cheghadr_review:
    title: "How much"
    gloss: "how much"
    note: "*چقدر*, already taught back in unit21's money vocabulary, is used here to ask a ticket price."
  fa.a1.unit28.lesson04.teach.belit_cheghadr_phrase:
    title: "How much is a bus ticket?"
    gloss: "How much is a bus ticket?"
    note: "*بلیط اتوبوس چقدره؟* combines *بلیط اتوبوس* with *چقدره* ('how much is it')."
  fa.a1.unit28.lesson04.teach.daghighe_review:
    title: Minute
    gloss: minute
    note: "*دقیقه*, already taught back in unit09's time vocabulary, reappears here for a bus schedule."
  fa.a1.unit28.lesson04.teach.panzdah_review:
    title: Fifteen
    gloss: fifteen
    note: "*پانزده*, already taught back in unit03's numbers, is used here for a bus's frequency."
  fa.a1.unit28.lesson04.teach.miad_word:
    title: "It comes"
    gloss: "it comes"
    note: "*میاد* is the everyday colloquial form of 'it comes' (from *می‌آید*), used here for how often the bus arrives."
  fa.a1.unit28.lesson04.teach.sign_text:
    title: "Reading: a bus-stop sign"
    gloss: "How much is a bus ticket? The bus comes every fifteen minutes."
    note: "A short sign/schedule-style sentence combining this lesson's ticket-price question with a frequency statement."

  fa.a1.unit28.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: "*نیما*, established as a character back in unit11, reappears here."
    example_gloss: "Nima goes to work every day."
  fa.a1.unit28.lesson05.teach.mire_review:
    title: "He/she goes"
    gloss: "he/she goes"
    note: "*می‌ره*, already taught back in unit27, is the 3rd-person colloquial form of 'to go.'"
  fa.a1.unit28.lesson05.teach.gahi_review:
    title: Sometimes
    gloss: sometimes
    note: "*گاهی*, already taught back in unit24/27, reappears here."
  fa.a1.unit28.lesson05.teach.ham_review:
    title: Also / too
    gloss: also / too
    note: "*هم*, already taught back in unit24/27, means 'also' or 'too' -- used here for Nima's occasional walking."
  fa.a1.unit28.lesson05.teach.sara_review:
    title: Sara
    gloss: Sara
    note: "*سارا*, established as a character back in unit11, reappears here."
    example_gloss: "Sara goes to school every day."
  fa.a1.unit28.lesson05.teach.madrese_review:
    title: School
    gloss: school
    note: "*مدرسه*, already taught back in unit18's work vocabulary, is سارا's commute destination here."
    example_gloss: "Sara goes to school."
  fa.a1.unit28.lesson05.teach.reading_text:
    title: "Reading: Nima's and Sara's commutes"
    gloss: "Nima goes to work by bus every day. Sometimes he also walks. Sara goes to school by bicycle every day."
    note: "This reading reuses every construction from lessons 1-4 plus lesson05's own *می‌ره*/*مدرسه* -- almost no new vocabulary, just recognizing it in connected text."

  fa.a1.unit28.lesson06.teach.tochi_review:
    title: "What about you?"
    gloss: "what about you?"
    note: "*تو چی؟*, already taught back in unit24/27's dialogue, reappears here to ask the question back."
  fa.a1.unit28.lesson06.teach.choon_word:
    title: Because
    gloss: because
    note: "*چون* means 'because' -- a genuinely new connector, used here to give a reason for a recommendation."
  fa.a1.unit28.lesson06.teach.varzeshe_word:
    title: "It's exercise"
    gloss: "it's exercise"
    note: "*ورزشه* combines *ورزش* (already taught back in unit24/27) with the copula *-ه* ('is')."
  fa.a1.unit28.lesson06.teach.vali_review:
    title: But
    gloss: but
    note: "*ولی*, already taught back in unit15, reappears here."
  fa.a1.unit28.lesson06.teach.chekhoob_review:
    title: "How nice!"
    gloss: "how nice!"
    note: "*چه خوب!*, already taught back in unit24/27, is a natural closing reaction here too."
  fa.a1.unit28.lesson06.teach.are_review:
    title: Yeah
    gloss: yeah
    note: "*آره*, already taught back in unit04, is the everyday colloquial word for 'yes,' reappearing here."
  fa.a1.unit28.lesson06.teach.dialogue_line1:
    title: "Nima: I go to work by bus every day. What about you?"
    gloss: "I go to work by bus every day. What about you?"
  fa.a1.unit28.lesson06.teach.dialogue_line2:
    title: "Sara: I go to school by bicycle."
    gloss: "I go to school by bicycle."
  fa.a1.unit28.lesson06.teach.dialogue_line3:
    title: "Nima: Bus or bicycle, which is better?"
    gloss: "Bus or bicycle, which is better?"
  fa.a1.unit28.lesson06.teach.dialogue_line4:
    title: "Sara: Bicycle is better, because it's exercise."
    gloss: "Bicycle is better, because it's exercise."
  fa.a1.unit28.lesson06.teach.dialogue_line5:
    title: "Nima: Yeah, but sometimes I also go on foot."
    gloss: "Yeah, but sometimes I also go on foot."
  fa.a1.unit28.lesson06.teach.dialogue_line6:
    title: "Sara: How nice!"
    gloss: "How nice!"

exercises:
  fa.a1.unit28.lesson01.exercise01.recognize_metro:
    instruction: "What does this word mean?"
    correct_option: "metro / subway"
    distractors: [bus, "by / with", "I go"]
    accepted_answers: [{value: "metro / subway", status: correct}]
    feedback: "مترو means metro or subway."
  fa.a1.unit28.lesson01.exercise02.recognize_otobus:
    instruction: "What does this word mean?"
    correct_option: bus
    distractors: ["metro / subway", "by / with", "I go"]
    accepted_answers: [{value: bus, status: correct}]
    feedback: "اتوبوس means bus."
  fa.a1.unit28.lesson01.exercise03.match_bus_metro_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {با: "by / with", اتوبوس: bus, مترو: "metro / subway", "می‌رم": "I go"}
        status: correct
    feedback: "These cover the basics of naming how you get around."
  fa.a1.unit28.lesson01.exercise04.word_order_i_go_by_bus:
    instruction: "Put the words in order."
    accepted_answers: [{value: [من, با, اتوبوس, "می‌رم"], status: correct}]
    feedback: "من با اتوبوس می‌رم means 'I go by bus.'"
  fa.a1.unit28.lesson01.exercise05.translate_i_go_by_metro:
    instruction: "Translate into English: با مترو می‌رم"
    answer_language_code: en
    accepted_answers:
      - {value: "I go by metro", status: correct}
      - {value: "I go by metro.", status: correct}
      - {value: "I go by subway", status: correct}
      - {value: "I go by subway.", status: correct}
    feedback: "با مترو می‌رم means 'I go by metro.'"

  fa.a1.unit28.lesson02.exercise01.recognize_mashin:
    instruction: "What does this word mean?"
    correct_option: car
    distractors: [bicycle, bus, "metro / subway"]
    accepted_answers: [{value: car, status: correct}]
    feedback: "ماشین means car."
  fa.a1.unit28.lesson02.exercise02.recognize_docharkhe:
    instruction: "What does this word mean?"
    correct_option: bicycle
    distractors: [car, bus, "metro / subway"]
    accepted_answers: [{value: bicycle, status: correct}]
    feedback: "دوچرخه means bicycle."
  fa.a1.unit28.lesson02.exercise03.match_vehicle_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {با: "by / with", اتوبوس: bus, مترو: "metro / subway", ماشین: car, دوچرخه: bicycle, "می‌رم": "I go"}
        status: correct
    feedback: "This reviews the bus and metro alongside car and bicycle."
  fa.a1.unit28.lesson02.exercise04.word_order_every_day_by_car_to_work:
    instruction: "Put the words in order."
    accepted_answers: [{value: ["هر", روز, با, ماشین, "می‌رم", سر, کار], status: correct}]
    feedback: "هر روز با ماشین می‌رم سر کار means 'Every day I go to work by car.'"
  fa.a1.unit28.lesson02.exercise05.translate_i_go_by_bicycle:
    instruction: "Translate into English: با دوچرخه می‌رم"
    answer_language_code: en
    accepted_answers:
      - {value: "I go by bicycle", status: correct}
      - {value: "I go by bicycle.", status: correct}
      - {value: "I go by bike", status: correct}
      - {value: "I go by bike.", status: correct}
    feedback: "با دوچرخه می‌رم means 'I go by bicycle.'"

  fa.a1.unit28.lesson03.exercise01.recognize_piyade:
    instruction: "What does this word mean?"
    correct_option: "on foot"
    distractors: [taxi, car, bicycle]
    accepted_answers: [{value: "on foot", status: correct}]
    feedback: "پیاده means 'on foot.'"
  fa.a1.unit28.lesson03.exercise02.recognize_taxi:
    instruction: "What does this word mean?"
    correct_option: taxi
    distractors: ["on foot", car, bicycle]
    accepted_answers: [{value: taxi, status: correct}]
    feedback: "تاکسی means taxi."
  fa.a1.unit28.lesson03.exercise03.match_more_transport_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {پیاده: "on foot", تاکسی: taxi, ماشین: car, دوچرخه: bicycle, اتوبوس: bus, مترو: "metro / subway", کدوم: which}
        status: correct
    feedback: "This covers all six ways to get around taught so far, plus 'which.'"
  fa.a1.unit28.lesson03.exercise04.word_order_i_go_on_foot:
    instruction: "Put the words in order."
    accepted_answers: [{value: [پیاده, "می‌رم"], status: correct}]
    feedback: "پیاده می‌رم means 'I go on foot' -- no با needed."
  fa.a1.unit28.lesson03.exercise05.translate_which_is_better:
    instruction: "Translate into Farsi: Bus or metro, which is better?"
    accepted_answers:
      - {value: "اتوبوس یا مترو، کدوم بهتره؟", status: correct}
      - {value: "اتوبوس یا مترو کدوم بهتره؟", status: correct}
    feedback: "اتوبوس یا مترو، کدوم بهتره؟ means 'Bus or metro, which is better?'"

  fa.a1.unit28.lesson04.exercise01.recognize_belit:
    instruction: "What does this word mean?"
    correct_option: ticket
    distractors: [price, "how much", minute]
    accepted_answers: [{value: ticket, status: correct}]
    feedback: "بلیط means ticket."
  fa.a1.unit28.lesson04.exercise02.recognize_daghighe:
    instruction: "What does this word mean?"
    correct_option: minute
    distractors: [ticket, price, "how much"]
    accepted_answers: [{value: minute, status: correct}]
    feedback: "دقیقه means minute."
  fa.a1.unit28.lesson04.exercise03.match_ticket_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {پیاده: "on foot", تاکسی: taxi, اتوبوس: bus, مترو: "metro / subway", بلیط: ticket, قیمت: price, چقدر: "how much", دقیقه: minute}
        status: correct
    feedback: "These combine transport with buying and timing a ticket."
  fa.a1.unit28.lesson04.exercise04.reading_comprehension_bus_frequency:
    instruction: "How often does the bus come?"
    correct_option: "Every fifteen minutes"
    distractors: ["Every day", "Once an hour", "Never"]
    accepted_answers: [{value: "Every fifteen minutes", status: correct}]
    feedback: "اتوبوس هر پانزده دقیقه میاد -- the bus comes every fifteen minutes."
  fa.a1.unit28.lesson04.exercise05.translate_how_much_is_bus_ticket:
    instruction: "Translate into Farsi: How much is a bus ticket?"
    accepted_answers:
      - {value: "بلیط اتوبوس چقدره؟", status: correct}
      - {value: "بلیط اتوبوس چقدره", status: correct}
    feedback: "بلیط اتوبوس چقدره؟ means 'How much is a bus ticket?'"

  fa.a1.unit28.lesson05.exercise01.reading_comprehension_nima_commute:
    instruction: "How does Nima usually get to work?"
    correct_option: "By bus"
    distractors: ["By taxi", "By bicycle", "By metro"]
    accepted_answers: [{value: "By bus", status: correct}]
    feedback: "نیما هر روز با اتوبوس می‌ره سر کار -- Nima goes to work by bus every day."
  fa.a1.unit28.lesson05.exercise02.reading_comprehension_sara_commute:
    instruction: "How does Sara get to school?"
    correct_option: "By bicycle"
    distractors: ["By bus", "On foot", "By taxi"]
    accepted_answers: [{value: "By bicycle", status: correct}]
    feedback: "سارا هر روز با دوچرخه می‌ره مدرسه -- Sara goes to school by bicycle every day."
  fa.a1.unit28.lesson05.exercise03.match_reading_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {اتوبوس: bus, دوچرخه: bicycle, پیاده: "on foot", مدرسه: school, "سر کار": "to work", "هر روز": "every day", گاهی: sometimes, "می‌ره": "he/she goes"}
        status: correct
    feedback: "These words all appear in the reading passage."
  fa.a1.unit28.lesson05.exercise04.translate_sara_goes_to_school_by_bike:
    instruction: "Translate into English: سارا هر روز با دوچرخه می‌ره مدرسه"
    answer_language_code: en
    accepted_answers:
      - {value: "Sara goes to school by bicycle every day", status: correct}
      - {value: "Sara goes to school by bicycle every day.", status: correct}
      - {value: "Every day Sara goes to school by bicycle", status: correct}
      - {value: "Every day Sara goes to school by bicycle.", status: correct}
    feedback: "سارا هر روز با دوچرخه می‌ره مدرسه means 'Sara goes to school by bicycle every day.'"
  fa.a1.unit28.lesson05.exercise05.write_own_commute:
    instruction: "Write a true sentence about how you usually get to work or school."
    accepted_answers:
      - {value: "من هر روز با اتوبوس می‌رم سر کار", status: correct}
      - {value: "من با ماشین می‌رم سر کار", status: correct}
      - {value: "من با دوچرخه می‌رم مدرسه", status: correct}
      - {value: "من پیاده می‌رم مدرسه", status: correct}
      - {value: "من با مترو می‌رم سر کار", status: correct}
    feedback: "Any true statement combining a taught transport word with a destination is accepted."

  fa.a1.unit28.lesson06.exercise01.dialogue_comprehension_context:
    instruction: "What happened in this conversation?"
    correct_option: "Nima goes to work by bus every day and sometimes walks too; Sara goes to school by bicycle; they agree bicycle is better because it's exercise."
    distractors:
      - "Nima and Sara both go everywhere by taxi."
      - "Sara thinks the bus is better because it's faster."
      - "Neither Nima nor Sara has any way to get to work or school."
