course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: naming the four seasons, describing each one's
    typical weather, talking about seasonal activities (swimming, skiing),
    and a dialogue comparing two friends' favorite seasons.

units:
  fa.a1.unit38.seasons:
    title: Seasons

lessons:
  fa.a1.unit38.lesson01.new_seasons_one: {title: "New seasons 1"}
  fa.a1.unit38.lesson02.new_seasons_two: {title: "New seasons 2"}
  fa.a1.unit38.lesson03.seasonal_activities: {title: "Seasonal activities"}
  fa.a1.unit38.lesson04.season_dialogue: {title: "Dialogue: Favorite season"}
  fa.a1.unit38.lesson05.reading_seasons: {title: "Reading about seasons"}
  fa.a1.unit38.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit38.lesson01.teach.fasl:
    title: Season
    gloss: season
    note: "*فصل* means 'season.'"
    example_gloss: "We have four seasons."
  fa.a1.unit38.lesson01.teach.bahar:
    title: Spring
    gloss: spring
    note: "*بهار* means 'spring.'"
    example_gloss: "Spring is pretty."
  fa.a1.unit38.lesson01.teach.tabestan:
    title: Summer
    gloss: summer
    note: "*تابستان* means 'summer.'"
    example_gloss: "Summer is hot."
  fa.a1.unit38.lesson01.teach.review_weather:
    title: "Weather words already known"
    gloss: "weather / it's sunny / it's hot / pretty"
    note: "*هوا* ('weather'), *آفتابیه* ('it's sunny'), and *گرمه* ('it's hot') were already taught in unit07's weather lesson; *قشنگ* ('pretty') was already taught in unit20's clothing-shopping lesson."

  fa.a1.unit38.lesson02.teach.paeez:
    title: Autumn
    gloss: autumn
    note: "*پاییز* means 'autumn' or 'fall.'"
    example_gloss: "Autumn is rainy."
  fa.a1.unit38.lesson02.teach.zemestan:
    title: Winter
    gloss: winter
    note: "*زمستان* means 'winter.'"
    example_gloss: "Winter is cold and snowy."
  fa.a1.unit38.lesson02.teach.review_negation:
    title: "Summer isn't cold, it's hot"
    gloss: "Summer isn't cold, it's hot."
    note: "*نیست* negates the fused copula, already taught from unit23 -- the same pattern as *تنبل نیست* ('he/she is not lazy') from unit36."

  fa.a1.unit38.lesson03.teach.eski:
    title: Ski
    gloss: ski
    note: "*اسکی* means 'ski' or 'skiing.'"
    example_gloss: "In winter I ski."
  fa.a1.unit38.lesson03.teach.barf:
    title: Snow
    gloss: snow
    note: "*برف* means 'snow,' the noun form of the already-known adjective *برفی* ('snowy') from unit07."
    example_gloss: "In winter I see snow."
  fa.a1.unit38.lesson03.teach.review_shena:
    title: "In summer I swim"
    gloss: "In summer I swim."
    note: "*شنا* ('swim') and *می‌کنم* ('I do') were already taught in unit27's sports lesson."
  fa.a1.unit38.lesson03.teach.phrase_tabestan_shena:
    title: "In summer I swim"
    gloss: "In summer I swim."
    note: "*تو* here means 'in,' a new preposition for this unit."
  fa.a1.unit38.lesson03.teach.phrase_zemestan_eski:
    title: "In winter I ski"
    gloss: "In winter I ski."

  fa.a1.unit38.lesson04.teach.kodoom_fasl:
    title: "Which season do you like more?"
    gloss: "Which season do you like more?"
    note: "*کدوم* ('which'), *بیشتر* ('more'), and *دوست داری* ('you like') were all already taught in unit14's preferences lesson."
  fa.a1.unit38.lesson04.teach.review_kodoom_bishtar:
    title: "Review: which / more / like"
    gloss: "which / more / you like / I like / [object marker] / because"
    note: "All of these words were already taught in unit14 and are reused here without re-teaching."
  fa.a1.unit38.lesson04.teach.dialogue_line1:
    title: "Nima: Which season do you like more?"
    gloss: "Which season do you like more?"
  fa.a1.unit38.lesson04.teach.dialogue_line2:
    title: "Sara: I like autumn more because it's rainy and pretty. What about you?"
    gloss: "I like autumn more because it's rainy and pretty. What about you?"
  fa.a1.unit38.lesson04.teach.dialogue_line3:
    title: "Nima: I like summer because it's hot and I swim."
    gloss: "I like summer because it's hot and I swim."
  fa.a1.unit38.lesson04.teach.dialogue_line4:
    title: "Sara: Cool!"
    gloss: "Cool!"

  fa.a1.unit38.lesson05.teach.darim_word:
    title: "We have"
    gloss: "we have"
    note: "*داریم* ('we have') is derived from *دارم* ('I have,' unit19) and *داره* ('he/she has,' unit27), the same 'personal-ending' pattern those units already taught."
  fa.a1.unit38.lesson05.teach.reading_text:
    title: "Reading: The four seasons in Iran"
    gloss: "In Iran we have four seasons: spring, summer, autumn, and winter. Spring is pretty. Summer is hot. Autumn is rainy. Winter is cold and snowy."
    note: "The reading names and briefly describes each of the four seasons."
  fa.a1.unit38.lesson05.teach.reading_note:
    title: "Four"
    gloss: "four"
    note: "*چهار* ('four') was already taught in unit03's numbers lesson."

  fa.a1.unit38.lesson06.teach.self_season_preference:
    title: "I really like autumn"
    gloss: "I really like autumn."
    note: "A full review sentence reusing only already-known words from this unit and unit01's *خیلی* ('very')."
  fa.a1.unit38.lesson06.teach.ask_favorite_season:
    title: "Which season do you like?"
    gloss: "Which season do you like?"
  fa.a1.unit38.lesson06.teach.review_all_seasons:
    title: "Spring / summer / autumn / winter -- this unit's four seasons"
    gloss: "spring / summer / autumn / winter"
    note: "These are the four season words taught in this unit."

exercises:
  fa.a1.unit38.lesson01.exercise01.recognize_fasl:
    instruction: "What does this word mean?"
    correct_option: season
    distractors: [weather, month, year]
    accepted_answers: [{value: season, status: correct}]
    feedback: "فصل means season."
  fa.a1.unit38.lesson01.exercise02.recognize_bahar:
    instruction: "What does this word mean?"
    correct_option: spring
    distractors: [summer, autumn, winter]
    accepted_answers: [{value: spring, status: correct}]
    feedback: "بهار means spring."
  fa.a1.unit38.lesson01.exercise03.match_seasons_one:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {فصل: season, بهار: spring, تابستان: summer, "بهار قشنگه.": "Spring is pretty.", "تابستان گرمه.": "Summer is hot.", "چهار فصل داریم.": "We have four seasons."}
        status: correct
    feedback: "These are the first two new seasons for this unit, plus the review word for 'season.'"
  fa.a1.unit38.lesson01.exercise04.word_order_bahar_ghashange:
    instruction: "Put the words in order."
    accepted_answers: [{value: [بهار, قشنگه], status: correct}]
    feedback: "بهار قشنگه means 'Spring is pretty.'"
  fa.a1.unit38.lesson01.exercise05.translate_tabestan_garme:
    instruction: "Translate into English: تابستان گرمه."
    answer_language_code: en
    accepted_answers:
      - {value: "Summer is hot", status: correct}
      - {value: "Summer is hot.", status: correct}
    feedback: "تابستان گرمه means 'Summer is hot.'"

  fa.a1.unit38.lesson02.exercise01.recognize_paeez:
    instruction: "What does this word mean?"
    correct_option: autumn
    distractors: [spring, summer, winter]
    accepted_answers:
      - {value: autumn, status: correct}
      - {value: fall, status: correct}
    feedback: "پاییز means autumn (fall)."
  fa.a1.unit38.lesson02.exercise02.recognize_tabestan_sard_nist:
    instruction: "What does this sentence mean?"
    correct_option: "Summer isn't cold."
    distractors:
      - "Summer is cold."
      - "Summer is hot."
      - "Winter isn't cold."
    accepted_answers: [{value: "Summer isn't cold.", status: correct}]
    feedback: "تابستان سرد نیست means 'Summer isn't cold.'"
  fa.a1.unit38.lesson02.exercise03.match_seasons_two:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {پاییز: autumn, زمستان: winter, "پاییز بارونیه.": "Autumn is rainy.", "زمستان سرده و برفیه.": "Winter is cold and snowy.", "تابستان سرد نیست.": "Summer isn't cold.", نیست: "is not"}
        status: correct
    feedback: "These are the last two new seasons for this unit, plus review sentences."
  fa.a1.unit38.lesson02.exercise04.word_order_zemestan_sarde:
    instruction: "Put the words in order."
    accepted_answers: [{value: [زمستان, سرده, و, برفیه], status: correct}]
    feedback: "زمستان سرده و برفیه means 'Winter is cold and snowy.'"
  fa.a1.unit38.lesson02.exercise05.translate_paeez_barooniye:
    instruction: "Translate into English: پاییز بارونیه."
    answer_language_code: en
    accepted_answers:
      - {value: "Autumn is rainy", status: correct}
      - {value: "Autumn is rainy.", status: correct}
      - {value: "Fall is rainy", status: correct}
      - {value: "Fall is rainy.", status: correct}
    feedback: "پاییز بارونیه means 'Autumn is rainy.'"

  fa.a1.unit38.lesson03.exercise01.recognize_eski:
    instruction: "What does this word mean?"
    correct_option: ski
    distractors: [swim, snow, season]
    accepted_answers: [{value: ski, status: correct}]
    feedback: "اسکی means ski."
  fa.a1.unit38.lesson03.exercise02.recognize_barf:
    instruction: "What does this word mean?"
    correct_option: snow
    distractors: [rain, ski, weather]
    accepted_answers: [{value: snow, status: correct}]
    feedback: "برف means snow."
  fa.a1.unit38.lesson03.exercise03.match_activities:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {اسکی: ski, برف: snow, "تو تابستان شنا می‌کنم.": "In summer I swim.", "تو زمستان اسکی می‌کنم.": "In winter I ski.", "زمستان برف می‌بینم.": "In winter I see snow.", تو: "in"}
        status: correct
    feedback: "These words let you talk about seasonal activities."
  fa.a1.unit38.lesson03.exercise04.word_order_zemestan_eski:
    instruction: "Put the words in order."
    accepted_answers: [{value: [تو, زمستان, اسکی, "می‌کنم"], status: correct}]
    feedback: "تو زمستان اسکی می‌کنم means 'In winter I ski.'"
  fa.a1.unit38.lesson03.exercise05.translate_tabestan_shena:
    instruction: "Translate into English: تو تابستان شنا می‌کنم."
    answer_language_code: en
    accepted_answers:
      - {value: "In summer I swim", status: correct}
      - {value: "In summer I swim.", status: correct}
    feedback: "تو تابستان شنا می‌کنم means 'In summer I swim.'"

  fa.a1.unit38.lesson04.exercise01.dialogue_comprehension_seasons:
    instruction: "Which season does Sara like more?"
    correct_option: "Sara likes autumn more."
    distractors:
      - "Sara likes summer more."
      - "Nima likes autumn more."
      - "Sara likes winter more."
    accepted_answers: [{value: "Sara likes autumn more.", status: correct}]
    feedback: "سارا می‌گه پاییز رو بیشتر دوست داره."
  fa.a1.unit38.lesson04.exercise02.recognize_nima_tabestan:
    instruction: "What does this sentence mean?"
    correct_option: "I like summer because it's hot and I swim."
    distractors:
      - "I like autumn because it's rainy."
      - "I don't like summer."
      - "I like winter because I ski."
    accepted_answers: [{value: "I like summer because it's hot and I swim.", status: correct}]
    feedback: "من تابستان رو دوست دارم چون گرمه و شنا می‌کنم means 'I like summer because it's hot and I swim.'"
  fa.a1.unit38.lesson04.exercise03.match_dialogue_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {نیما: Nima, سارا: Sara, "کدوم فصل": "which season", بیشتر: more, چون: because, "تو چی؟": "what about you?", باحاله: cool}
        status: correct
    feedback: "These words appear in the dialogue about favorite seasons."
  fa.a1.unit38.lesson04.exercise04.dialogue_response_ask_favorite_season:
    instruction: "Respond to کدوم فصل رو بیشتر دوست داری؟ by saying you like autumn more because it's rainy and pretty."
    accepted_answers:
      - {value: "پاییز رو بیشتر دوست دارم چون بارونیه و قشنگه", status: correct}
      - {value: "پاییز رو بیشتر دوست دارم چون بارونیه و قشنگه.", status: correct}
    feedback: "پاییز رو بیشتر دوست دارم چون بارونیه و قشنگه means 'I like autumn more because it's rainy and pretty.'"
  fa.a1.unit38.lesson04.exercise05.translate_nima_tabestan:
    instruction: "Translate into English: من تابستان رو دوست دارم چون گرمه و شنا می‌کنم."
    answer_language_code: en
    accepted_answers:
      - {value: "I like summer because it's hot and I swim", status: correct}
      - {value: "I like summer because it's hot and I swim.", status: correct}
      - {value: "I like summer because it is hot and I swim", status: correct}
      - {value: "I like summer because it is hot and I swim.", status: correct}
    feedback: "من تابستان رو دوست دارم چون گرمه و شنا می‌کنم means 'I like summer because it's hot and I swim.'"

  fa.a1.unit38.lesson05.exercise01.reading_comprehension_how_many_seasons:
    instruction: "How many seasons does Iran have, according to the reading?"
    correct_option: "Iran has four seasons."
    distractors:
      - "Iran has three seasons."
      - "Iran has two seasons."
      - "The text doesn't say how many seasons Iran has."
    accepted_answers: [{value: "Iran has four seasons.", status: correct}]
    feedback: "تو ایران چهار فصل داریم."
  fa.a1.unit38.lesson05.exercise02.reading_comprehension_winter_weather:
    instruction: "What does the reading say about winter?"
    correct_option: "Winter is cold and snowy."
    distractors:
      - "Winter is hot and sunny."
      - "Winter is rainy."
      - "The text doesn't describe winter."
    accepted_answers: [{value: "Winter is cold and snowy.", status: correct}]
    feedback: "زمستان سرده و برفیه."
  fa.a1.unit38.lesson05.exercise03.match_reading_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {ایران: Iran, "چهار فصل": "four seasons", داریم: "we have", بهار: spring, تابستان: summer, پاییز: autumn, زمستان: winter}
        status: correct
    feedback: "These words let you understand the short reading about Iran's seasons."
  fa.a1.unit38.lesson05.exercise04.translate_iran_chahar_fasl:
    instruction: "Translate into English: تو ایران چهار فصل داریم."
    answer_language_code: en
    accepted_answers:
      - {value: "In Iran we have four seasons", status: correct}
      - {value: "In Iran we have four seasons.", status: correct}
      - {value: "We have four seasons in Iran", status: correct}
      - {value: "We have four seasons in Iran.", status: correct}
    feedback: "تو ایران چهار فصل داریم means 'In Iran we have four seasons.'"
  fa.a1.unit38.lesson05.exercise05.write_season_description:
    instruction: "Write a short sentence describing a season and its weather."
    accepted_answers:
      - {value: "زمستان سرده", status: correct}
      - {value: "زمستان سرده.", status: correct}
      - {value: "تابستان گرمه", status: correct}
      - {value: "بهار قشنگه", status: correct}
      - {value: "پاییز بارونیه", status: correct}
    feedback: "A short season description can name a season and its weather."

  fa.a1.unit38.lesson06.exercise01.recognize_self_season_preference:
    instruction: "What does this sentence mean?"
    correct_option: "I really like autumn."
    distractors:
      - "I don't like autumn."
      - "I really like summer."
      - "Autumn is rainy."
    accepted_answers: [{value: "I really like autumn.", status: correct}]
    feedback: "من پاییز رو خیلی دوست دارم means 'I really like autumn.'"
  fa.a1.unit38.lesson06.exercise02.recognize_ask_favorite_season:
    instruction: "What does this question mean?"
    correct_option: "Which season do you like?"
    distractors:
      - "What is your favorite weather?"
      - "Do you like this season?"
      - "What is your favorite food?"
    accepted_answers: [{value: "Which season do you like?", status: correct}]
    feedback: "کدوم فصل رو دوست داری؟ means 'Which season do you like?'"
  fa.a1.unit38.lesson06.exercise03.match_wrap_seasons:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {بهار: spring, تابستان: summer, پاییز: autumn, زمستان: winter, فصل: season, خیلی: "very / a lot"}
        status: correct
    feedback: "This reviews all four seasons from this unit."
  fa.a1.unit38.lesson06.exercise04.word_order_kodoom_fasl_dooset:
    instruction: "Put the words in order."
    accepted_answers: [{value: ["کدوم فصل", رو, دوست, داری], status: correct}]
    feedback: "کدوم فصل رو دوست داری؟ means 'Which season do you like?'"
  fa.a1.unit38.lesson06.exercise05.write_favorite_season_sentence:
    instruction: "Write a short sentence saying which season you like."
    accepted_answers:
      - {value: "بهار رو دوست دارم", status: correct}
      - {value: "بهار رو دوست دارم.", status: correct}
      - {value: "تابستان رو دوست دارم", status: correct}
      - {value: "زمستان رو دوست دارم", status: correct}
      - {value: "پاییز رو دوست دارم", status: correct}
    feedback: "A wrap-up sentence can say which season you like using فصل ... رو دوست دارم."
