    title: Narrative
    description: Recount complex events with background, interruption, and earlier past.
lessons:
  fa.b2.unit04.narrative.lesson01.background:
    title: Narrative background
  fa.b2.unit04.narrative.lesson02.prepast:
    title: Earlier past event
  fa.b2.unit04.narrative.lesson03.interruption:
    title: Interrupted action
teaching:
  fa.b2.unit04.narrative.lesson01.background.teach.card01:
    title: when it was raining
    gloss: when it was raining
    note: '*وقتی* + the *می-* past sets up an ongoing background: "when it was raining". The verb comes last in its clause.'
    example_gloss: When it was raining, the street was quiet.
  fa.b2.unit04.narrative.lesson01.background.teach.card02:
    title: exhibit
    gloss: exhibit
    note: '"Exhibition", a place and an event. It comes from *نمایش* ("display"), which can also mean "a play".'
    example_gloss: The photo exhibit opens in the evening.
  fa.b2.unit04.narrative.lesson01.background.teach.card03:
    title: had just opened
    gloss: had just opened
    note: '*تازه* before a past perfect (*شده بود*) means "had just". The past perfect is past participle + *بود*.'
    example_gloss: The cafe had just opened and was not crowded yet.
  fa.b2.unit04.narrative.lesson01.background.teach.card04:
    title: background
    gloss: background
    note: '"Background" or "context", and also "field". *زمینه‌ی داستان* with ezafe means "the background of the story".'
    example_gloss: She explained the background of the story calmly.
  fa.b2.unit04.narrative.lesson01.background.teach.card05:
    title: event
    gloss: event
    note: 'A fairly formal "event". *اتفاق* is the everyday word for something that happened.'
    example_gloss: The main event happened after the call.
  fa.b2.unit04.narrative.lesson01.background.teach.card06:
    title: at that same moment
    gloss: at that same moment
    note: '*همان* means "that very", so the phrase pins the moment: "at that very moment". It usually opens the clause before the past verb.'
    example_gloss: At that same moment, the lights went out.
  fa.b2.unit04.narrative.lesson01.background.teach.card07:
    title: rain
    gloss: rain
    note: 'Persian says *باران می‌بارد*, "the rain rains". There is no dummy "it" as in English "it is raining".'
    example_gloss: The rain reduced the sound of the street.
  fa.b2.unit04.narrative.lesson01.background.teach.card08:
    title: were still at the door
    gloss: were still at the door
    note: '*هنوز* + past means "were still". *بودند* is plural to agree with the plural subject. *پشت در* means "behind the door".'
    example_gloss: The guests were still at the door.
  fa.b2.unit04.narrative.lesson01.background.teach.card09:
    title: guests
    gloss: guests
    note: '"Guests", with the plural *ها* attached by a ZWNJ. The singular *مهمان* is "guest"; the formal plural is *مهمانان*.'
    example_gloss: The guests waited calmly.
  fa.b2.unit04.narrative.lesson01.background.teach.grammar:
    title: Narrative grammar
    gloss: Narrative grammar
    note: '*وقتی* plus imperfect forms like *می‌بارید* sets background. The foreground event can then carry the story forward.'
  fa.b2.unit04.narrative.lesson02.prepast.teach.card01:
    title: before we arrived
    gloss: before we arrived
    note: '*قبل از* + a verbal noun (*رسیدن*) + *ما* means "before our arriving". It is a noun phrase, not a full clause as in English.'
    example_gloss: Before we arrived, they had cleaned the hall.
  fa.b2.unit04.narrative.lesson02.prepast.teach.card02:
    title: guard
    gloss: guard
    note: '"Guard" or "watchman". The earlier action in the example uses the past perfect: participle + *بود*.'
    example_gloss: The guard had put the key on the table.
  fa.b2.unit04.narrative.lesson02.prepast.teach.card03:
    title: electricity
    gloss: electricity
    note: 'Both "electricity" and "lightning". A power cut can be said *برق رفت* or *برق قطع شد*.'
    example_gloss: The hall’s electricity suddenly went out.
  fa.b2.unit04.narrative.lesson02.prepast.teach.card04:
    title: had turned off
    gloss: had turned off
    note: '*قطع کردن* ("to cut off") has a doer, and with *بود* it becomes a past perfect, an earlier action. Contrast *قطع شدن*, "to be cut off".'
    example_gloss: Someone had turned off the corridor electricity.
  fa.b2.unit04.narrative.lesson02.prepast.teach.card05:
    title: earlier
    gloss: earlier
    note: 'A slightly formal "earlier"; *قبلا* is the everyday word. It places an action before the main past event.'
    example_gloss: Earlier, we had talked about this problem.
  fa.b2.unit04.narrative.lesson02.prepast.teach.card06:
    title: we had not arrived yet
    gloss: we had not arrived yet
    note: '*هنوز* + negative past perfect: *نرسیده بودیم*, "we had not yet arrived". The *ن-* attaches to the participle, not to *بودیم*.'
    example_gloss: We had not arrived yet when they called.
  fa.b2.unit04.narrative.lesson02.prepast.teach.card07:
    title: hall
    gloss: hall
    note: '"Hall" for events, exhibitions or lectures. It also appears in *سالن زیبایی*, "beauty salon".'
    example_gloss: The hall was small for the exhibit.
  fa.b2.unit04.narrative.lesson02.prepast.teach.card08:
    title: had become wet
    gloss: had become wet
    note: '*خیس شدن* means "to get wet" (a change of state). With *بود*, "had become wet". Compare *خیس بود*, plain "was wet".'
    example_gloss: The hall floor had become wet.
  fa.b2.unit04.narrative.lesson02.prepast.teach.card09:
    title: key / switch
    gloss: key / switch
    note: '"Key", and also "switch", as in a light switch. Context decides; *کلید برق* is a light or power switch.'
    example_gloss: The light switch is beside the door.
  fa.b2.unit04.narrative.lesson02.prepast.teach.grammar:
    title: Narrative grammar
    gloss: Narrative grammar
    note: '*کرده بود* marks an event completed before another past moment. English past perfect maps well here, but Persian word order stays natural.'
  fa.b2.unit04.narrative.lesson03.interruption.teach.card01:
    title: we were installing the photos
    gloss: we were installing the photos
    note: '*داشتیم* + the *می-* past forms the past progressive, "we were doing". The object with *را* comes before the verb, which stays last.'
    example_gloss: We were installing the photos when the rain became heavy.
  fa.b2.unit04.narrative.lesson03.interruption.teach.card02:
    title: suddenly
    gloss: suddenly
    note: '"Suddenly". In speech *یهو* is common. It usually comes before the simple-past verb that interrupts.'
    example_gloss: Suddenly a loud sound came from the corridor.
  fa.b2.unit04.narrative.lesson03.interruption.teach.card03:
    title: was interrupted / stopped
    gloss: was interrupted / stopped
    note: '*قطع شدن* means "to be cut off" or "interrupted", with no agent. Contrast *قطع کردن*, where someone does the cutting.'
    example_gloss: The conversation was interrupted by the phone ringing.
  fa.b2.unit04.narrative.lesson03.interruption.teach.card04:
    title: order
    gloss: order
    note: '"Order" as sequence or arrangement. It is not "order" as in command (*دستور*) or a purchase (*سفارش*).'
    example_gloss: I rewrote the order of events.
  fa.b2.unit04.narrative.lesson03.interruption.teach.card05:
    title: later we realized that
    gloss: later we realized that
    note: '*بعد* works as a link ("then, later"), followed by the simple past *فهمیدیم*. The *که* clause gives what was discovered.'
    example_gloss: Later we realized that the window had been left open.
  fa.b2.unit04.narrative.lesson03.interruption.teach.card06:
    title: window
    gloss: window
    note: '"Window"; plural *پنجره‌ها* with a ZWNJ. "The window is open" uses the adjective *باز*.'
    example_gloss: The hall window was open.
  fa.b2.unit04.narrative.lesson03.interruption.teach.card07:
    title: had been left open
    gloss: had been left open
    note: '*ماندن* + *باز* means "to stay open". With *بود*, "had been left open", with no doer named.'
    example_gloss: The back door had been left open.
  fa.b2.unit04.narrative.lesson03.interruption.teach.card08:
    title: photos
    gloss: photos
    note: '"Photos", with *ها* attached by a ZWNJ. *عکس* means "photo" or "picture". As a definite object it takes *را*.'
    example_gloss: The photos were ready on the wall.
  fa.b2.unit04.narrative.lesson03.interruption.teach.card09:
    title: started the story in the middle
    gloss: started the story in the middle
    note: '*را* marks the definite object *داستان*, and *شروع کرد* closes the sentence. *از وسط* means "from the middle".'
    example_gloss: Arash started the story in the middle.
  fa.b2.unit04.narrative.lesson03.interruption.teach.grammar:
    title: Narrative grammar
    gloss: Narrative grammar
    note: '*داشتیم ... که* is natural for an ongoing action interrupted by another event. It avoids a flat list of past verbs.'
