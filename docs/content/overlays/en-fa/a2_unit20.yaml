course:
  title: Farsi A2
  description: 'Lower-intermediate Iranian Farsi with a grammar spine: banking, opinions, appointments and more, now saying what you are going to do: near plans, intentions, maybe and certainly.'
units:
  fa.a2.unit20.holiday_plans:
    title: Holiday plans
lessons:
  fa.a2.unit20.lesson01.near_plans:
    title: 'Near plans: the present with می‌'
  fa.a2.unit20.lesson02.intentions:
    title: 'Intentions: می‌خوام and قصد دارم'
  fa.a2.unit20.lesson03.maybe_and_certain:
    title: Maybe, certainly, and saying no
  fa.a2.unit20.lesson04.asking_about_plans:
    title: Asking about plans
  fa.a2.unit20.lesson05.reading_and_listening:
    title: Reading and listening
  fa.a2.unit20.lesson06.holiday_conversation:
    title: A holiday conversation
teaching:
  fa.a2.unit20.lesson01.teach.holiday:
    title: Holiday, summer
    gloss: holiday(s), summer
    note: In speech *تابستون* is the usual form of *تابستان* (summer). *تعطیلات* looks plural but is the normal word for 'a holiday'.
    example_gloss:
    - In the summer I have a holiday.
    - The holiday is great.
  fa.a2.unit20.lesson01.teach.when:
    title: Next week, next year, August
    gloss: next week, next year, August (Mordad)
    note: '*بعد* after a time word means ''next'': *هفته‌ی بعد*, *سال بعد*. *مرداد* is the Iranian month that falls mostly in August.'
    example_gloss:
    - Next week I have an appointment.
    - Next year I'm going to Isfahan.
    - In Mordad I have a holiday.
  fa.a2.unit20.lesson01.teach.travel_verbs:
    title: To travel, to book
    gloss: to travel, to book
    note: 'Both are noun + *کردن*: *سفر* (a trip) + *کردن* = to travel; *رزرو* (a booking) + *کردن* = to book. In the present the *می‌* goes on *کردن*: *سفر می‌کنم*, *رزرو می‌کنم*.'
    example_gloss:
    - Next week I'm travelling.
    - I'm booking a hotel.
  fa.a2.unit20.lesson01.teach.north:
    title: The north, hotel
    gloss: the north (the Caspian coast), hotel
    note: '*شمال* (north) is also what Iranians call the Caspian coast, the classic summer-holiday region: *می‌رم شمال* = ''I''m going to the north (for a holiday)''.'
    example_gloss:
    - In the summer I'm going to the north.
    - In the north I'm booking a hotel.
  fa.a2.unit20.lesson01.teach.sister_mom:
    title: My sister, my mum, my brother
    gloss: my sister, my mum, my brother
    note: 'The ending *-م* means ''my'': *خواهر* (sister) becomes *خواهرم*, *مامان* becomes *مامانم*, *برادر* becomes *برادرم*.'
    example_gloss:
    - I'm going to the north with my sister.
    - I'm staying at my mum's house.
    - I'm travelling with my brother.
  fa.a2.unit20.lesson01.teach.question:
    title: What are you doing in the summer?
    gloss: What are you doing in the summer?
    note: 'The same question that asks ''what are you doing?'' also asks ''what are you going to do?'': the time word (*تابستون*) shows it is about the future.'
  fa.a2.unit20.lesson01.teach.present_for_plans:
    title: Near plans use the present
    gloss: In Mordad I'm going to the north, I'm booking a hotel.
    note: 'Persian has no everyday future tense. For plans that are fixed or near, use the present with *می‌* and add a time word: *مرداد می‌رم شمال* is literally ''in Mordad I go north'' and means ''I''m going north in Mordad''. The time word tells the listener it is the future.'
  fa.a2.unit20.lesson02.teach.course_money:
    title: Course, money
    gloss: course, money
    note: '*دوره* is a course or a class series: *یه دوره‌ی زبان* (a language course). *دوره‌ی* with *-ی* links it to the noun after it.'
    example_gloss:
    - I have a language course.
    - I don't have any money.
  fa.a2.unit20.lesson02.teach.later:
    title: Later, in a month
    gloss: later, in a month
    note: '*یه ماه دیگه* is literally ''one more month'' and means ''in a month''. *بعدا* is a general ''later''.'
    example_gloss:
    - Later I'm going to the north.
    - In a month I'm travelling.
  fa.a2.unit20.lesson02.teach.want_course:
    title: I want to take a course.
    gloss: I want to take a course. / I plan to take a course.
    note: '*می‌خوام* (I want) plus a second verb in its short *be-* form: *بگیرم* (from *گرفتن*, to take / get). Both verbs carry the *-م* ending: *می‌خوام بگیرم*. The same pattern with *رفتن* (to go) gives *می‌خوام برم*.'
  fa.a2.unit20.lesson02.teach.want_house:
    title: I want to move house.
    gloss: I want to move house. / I plan to move house.
    note: '*خونه عوض کردن* means to move house. In the *می‌خوام* pattern the verb becomes *کنم*: *می‌خوام خونه عوض کنم*.'
  fa.a2.unit20.lesson02.teach.want_save:
    title: I want to save money.
    gloss: I want to save money. / I plan to save money.
    note: '*پول جمع کردن* means to save money (literally ''to collect money''). Same pattern: *می‌خوام پول جمع کنم*.'
  fa.a2.unit20.lesson02.teach.qasd:
    title: I intend to take a course.
    gloss: I intend to take a course.
    note: '*قصد دارم* (I intend) is a little more formal than *می‌خوام* but is followed by the same short verb: *قصد دارم بگیرم*.'
  fa.a2.unit20.lesson02.teach.want_pattern:
    title: می‌خوام + a short verb
    gloss: I want to go, I want to take, I want to do
    note: 'For plans that are further ahead or that are wishes, use *می‌خوام* + a second verb in the short *be-* form: *برم* (go), *بگیرم* (take), *بخرم* (buy), and *کنم* (do). Both verbs have the same ending (*-م* for ''I''): *می‌خوام برم*. For near, fixed plans use the plain present instead: *فردا می‌رم*, but *سال بعد می‌خوام یه دوره بگیرم*.'
  fa.a2.unit20.lesson03.teach.maybe_certain:
    title: Maybe, certainly
    gloss: maybe, certainly
    note: '*شاید* and *حتما* go at the start of the clause and show how sure you are.'
    example_gloss:
    - Maybe I'll go to the cinema.
    - I'm definitely going.
  fa.a2.unit20.lesson03.teach.this_year:
    title: This year, this summer
    gloss: this year, this summer
    note: '*این* before a time word means ''this'': *این تابستون*. *امسال* is a single word for ''this year''.'
    example_gloss:
    - This year I'm staying home.
    - This summer I'm working.
  fa.a2.unit20.lesson03.teach.maybe_rule:
    title: Maybe takes the short verb
    gloss: Maybe I'll go, I'm definitely going
    note: '*شاید* is followed by the short *be-* form (*برم*), because the plan is only a possibility. *حتما* is followed by the normal present (*می‌رم*), because the plan is certain: *شاید برم سینما* but *حتما می‌رم سینما*.'
  fa.a2.unit20.lesson03.teach.not_want:
    title: I don't want to
    gloss: I don't want to
    note: 'Put *نـ* in front of *می‌خوام* to say you do not want to or do not plan to: *نمی‌خوام برم*. For a plain negative plan, negate the present: *می‌رم* becomes *نمی‌رم*.'
    example_gloss:
    - I don't want to move house.
    - This year I'm not going to the north.
    - This summer I'm not travelling.
  fa.a2.unit20.lesson03.teach.later_cinema:
    title: Maybe I'll go to the cinema later.
    gloss: Maybe I'll go to the cinema later.
    note: The time word *بعدا* can sit between *شاید* and the verb.
  fa.a2.unit20.lesson04.teach.q_words:
    title: Where, who with, how many weeks
    gloss: where, with whom, how many weeks
    note: '*با کی* is literally ''with who'': it asks who you are going with. *چند هفته* asks how long (how many weeks).'
    example_gloss:
    - Where are you going?
    - Who are you going with?
    - How many weeks are you staying?
  fa.a2.unit20.lesson04.teach.q_where:
    title: Where are you going?
    gloss: Where are you going?
    note: 'The question word comes first and the verb has the *-ی* (you) ending: *می‌ری* (you go).'
  fa.a2.unit20.lesson04.teach.q_who:
    title: Who are you going with?
    gloss: Who are you going with?
    note: 'Answer with *با* + the person + the verb: *با خواهرم می‌رم*.'
  fa.a2.unit20.lesson04.teach.q_howlong:
    title: How many weeks are you staying?
    gloss: How many weeks are you staying?
    note: '*می‌مونی* is the *you* form of *می‌مونم* (I stay).'
  fa.a2.unit20.lesson04.teach.durations:
    title: One week, two weeks, two days
    gloss: one week, two weeks, two days
    note: 'After a number the noun stays singular: *دو هفته*, *دو روز*. *یه هفته* is the spoken ''one week''.'
    example_gloss:
    - I'm staying a week.
    - I'm travelling for two weeks.
    - I'm staying there two days.
  fa.a2.unit20.lesson04.teach.you_forms:
    title: You want, you do (short form)
    gloss: you want, you do (short form)
    note: '*می‌خوای* is the *you* form of *می‌خوام*; the short verb after it also takes the *you* ending: *کنی* (from *کنم*), *بری* (from *برم*).'
    example_gloss:
    - What do you want to do?
    - Do you want to go?
  fa.a2.unit20.lesson04.teach.answer_pair:
    title: You go / I go
    gloss: Are you going? I'm going.
    note: Questions use the *you* ending *-ی* (*می‌ری*, *می‌مونی*, *می‌کنی*); your answer uses the *I* ending *-م* (*می‌رم*, *می‌مونم*, *می‌کنم*). The tense and the verb stay the same.
  fa.a2.unit20.lesson05.teach.spot_plans:
    title: Spot the kind of plan
    gloss: I'm going, I want to, maybe I'll go
    note: 'When you read, notice how sure each plan is: a plain present with *می‌* (*می‌رم*) is fixed, *می‌خوام* is an intention, and *شاید* is only a possibility.'
  fa.a2.unit20.lesson05.teach.reading_message:
    title: A message about the holiday
    gloss: Hi! In the summer I have a holiday. In Mordad I'm going to the north with my sister. We're staying in a hotel for a week. After that I'm going to my mum's house for two days. Next year I want to take a course. Maybe I'll also go to Isfahan.
    note: A short message about summer plans. Read it once for the plans, then again for how certain each one is.
  fa.a2.unit20.lesson06.teach.names:
    title: Sara, Nima
    gloss: Sara, Nima
    note: The two friends from earlier units.
    example_gloss:
    - Sara works in Tir.
    - Nima is going to Turkey in Mordad.
  fa.a2.unit20.lesson06.teach.dlg1:
    title: Sara asks about the holiday
    gloss: Sara asks Nima what he is doing for the summer holiday.
    note: The standard question about holiday plans.
  fa.a2.unit20.lesson06.teach.dlg2:
    title: Nima's plan
    gloss: Nima says he is going to Turkey in Mordad and booking a hotel.
    note: Two fixed plans, both in the present with *می‌*.
  fa.a2.unit20.lesson06.teach.dlg3:
    title: Sara asks who with
    gloss: Sara says how nice and asks who he is going with.
    note: '*با کی* asks who he is going with.'
  fa.a2.unit20.lesson06.teach.dlg4:
    title: Who and how long
    gloss: Nima says he is going with his brother and they are staying there a week.
    note: 'The answer can drop the verb: *با برادرم* is enough.'
  fa.a2.unit20.lesson06.teach.dlg5:
    title: Sara asks about next year
    gloss: 'Sara asks: what about next year? What do you want to do?'
    note: '*می‌خوای* is the *you* form of *می‌خوام*; *کنی* is the short verb with the *you* ending.'
  fa.a2.unit20.lesson06.teach.dlg6:
    title: Nima's intention
    gloss: 'Nima says he wants to take a course and asks Sara: what about you?'
    note: An intention with *می‌خوام* and a short verb.
  fa.a2.unit20.lesson06.teach.dlg7:
    title: Sara's plans
    gloss: Sara says she is working in Tir, and maybe she will go to her mum's afterwards.
    note: A fixed plan in the present and a possibility with *شاید*.
  fa.a2.unit20.lesson06.teach.third_person:
    title: He/she goes, stays, does, wants
    gloss: he/she goes, stays, does, wants
    note: 'To report someone else''s plan use the *he/she* ending *-ه* on the present (*می‌ره*, *می‌مونه*, *می‌کنه*). *می‌خواد* is the *he/she* form of *می‌خوام*, and the short verb after it also ends in *-ه*: *می‌خواد بره*, *می‌خواد بگیره*.'
    example_gloss:
    - Nima wants to take a course.
    - Sara wants to go to her mum's house.
