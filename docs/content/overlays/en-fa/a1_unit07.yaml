course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: describing weather conditions and temperature,
    asking how the weather is, and making a simple plan based on the
    weather.

units:
  fa.a1.unit07.weather:
    title: Weather and making plans

lessons:
  fa.a1.unit07.lesson01.weather_conditions: {title: "Basic weather conditions"}
  fa.a1.unit07.lesson02.temperature_words: {title: "Hot and cold"}
  fa.a1.unit07.lesson03.asking_about_weather: {title: "Ask about the weather"}
  fa.a1.unit07.lesson04.describing_todays_weather: {title: "Describe today's weather"}
  fa.a1.unit07.lesson05.weather_based_suggestions: {title: "Make a suggestion based on the weather"}
  fa.a1.unit07.lesson06.weather_plan_dialogue: {title: "Two friends plan around the weather"}

teaching:
  fa.a1.unit07.lesson01.teach.sunny:
    title: "Sunny"
    gloss: "sunny"
    note: "آفتابی describes sunny weather."
  fa.a1.unit07.lesson01.teach.rainy:
    title: "Rainy"
    gloss: "rainy"
    note: "بارونی is the everyday colloquial spelling/pronunciation of بارانی (rainy)."
  fa.a1.unit07.lesson01.teach.cloudy:
    title: "Cloudy"
    gloss: "cloudy"
    note: "ابری describes cloudy weather."
  fa.a1.unit07.lesson01.teach.snowy:
    title: "Snowy"
    gloss: "snowy"
    note: "برفی describes snowy weather."
  fa.a1.unit07.lesson01.teach.or_word:
    title: "Or"
    gloss: "or"
    note: "یا joins two alternative weather conditions."

  fa.a1.unit07.lesson02.teach.hot:
    title: "Hot"
    gloss: "hot"
    note: "گرم describes hot weather or temperature generally."
  fa.a1.unit07.lesson02.teach.cold:
    title: "Cold"
    gloss: "cold"
    note: "سرد describes cold weather or temperature generally."
  fa.a1.unit07.lesson02.teach.cool:
    title: "Cool"
    gloss: "cool"
    note: "خنک describes mild, cool weather, between گرم and سرد."

  fa.a1.unit07.lesson03.teach.weather_word:
    title: "Weather"
    gloss: "weather"
    note: "هوا is the general word for weather (also means air)."
  fa.a1.unit07.lesson03.teach.weather_question:
    title: "Ask how the weather is"
    gloss: "How's the weather?"
    note: "هوا چطوره؟ reuses چطوره, the same colloquial 'how is' question word already seen with حالتون چطوره؟ in unit01."
  fa.a1.unit07.lesson03.teach.today_word:
    title: "Today"
    gloss: "today"
    note: "امروز names the current day."
  fa.a1.unit07.lesson03.teach.tomorrow_word:
    title: "Tomorrow"
    gloss: "tomorrow"
    note: "فردا names the next day."

  fa.a1.unit07.lesson04.teach.today_sunny:
    title: "Say the weather is sunny today"
    gloss: "Today the weather is sunny."
    note: "امروز هوا آفتابیه uses the colloquial -e contraction (آفتابیه = آفتابی است) already established in this course."
  fa.a1.unit07.lesson04.teach.today_cold:
    title: "Say it's cold today"
    gloss: "Today it's cold."
    note: "امروز سرده follows the same contraction pattern."
  fa.a1.unit07.lesson04.teach.contraction_note:
    title: "The colloquial -e contraction"
    gloss: "آفتابیه is the everyday spoken contraction of آفتابی است."
    note: "This same pattern (adjective + ه) applies to any weather word: سرده، گرمه، بارونیه، ابریه، برفیه."
  fa.a1.unit07.lesson04.teach.today_rainy:
    title: "Say it's rainy today"
    gloss: "Today it's rainy."
    note: "امروز بارونیه applies the same -e contraction to بارونی."

  fa.a1.unit07.lesson05.teach.because_word:
    title: "Because / since"
    gloss: "because / since"
    note: "چون introduces a reason for a suggestion."
  fa.a1.unit07.lesson05.teach.better_to:
    title: "Suggest bringing an umbrella"
    gloss: "We'd better bring an umbrella."
    note: "بهتره چتر ببریم uses the colloquial بهتره (it's better) to make a soft suggestion."
  fa.a1.unit07.lesson05.teach.full_suggestion:
    title: "Combine a reason and a suggestion"
    gloss: "Since it's rainy, we'd better bring an umbrella."
    note: "چون بارونیه، بهتره چتر ببریم joins a weather-based reason with a suggestion."
  fa.a1.unit07.lesson05.teach.coat_suggestion:
    title: "Suggest wearing a coat"
    gloss: "Since it's cold, we'd better wear a coat."
    note: "چون سرده، بهتره کت بپوشیم follows the same reason-plus-suggestion pattern, applied to cold weather."

  fa.a1.unit07.lesson06.teach.coat_review:
    title: "Suggest wearing a coat"
    gloss: "we'd better wear a coat"
    note: "کت بپوشیم follows the same بهتره + verb pattern as چتر ببریم, applied to cold weather."
  fa.a1.unit07.lesson06.teach.turn01:
    title: "Sara asks about today's weather"
    gloss: "Sara asks how the weather is today."
    note: "هوا چطوره؟ reuses lesson03's question."
  fa.a1.unit07.lesson06.teach.turn02:
    title: "Reza says it's rainy"
    gloss: "Reza says he thinks it's rainy."
    note: "فکر کنم (I think) softens the statement, since he's guessing rather than certain."
  fa.a1.unit07.lesson06.teach.turn03:
    title: "Sara suggests bringing an umbrella"
    gloss: "Sara says they'd better bring an umbrella then."
    note: "پس (then/so) connects the weather fact to the suggestion."
  fa.a1.unit07.lesson06.teach.turn04:
    title: "Reza agrees and asks about tomorrow"
    gloss: "Reza agrees and asks what about tomorrow."
    note: "فردا چی؟ is a natural, economical way to ask about the next day."
  fa.a1.unit07.lesson06.teach.turn05:
    title: "Sara describes tomorrow's weather"
    gloss: "Sara says tomorrow will be sunny and hot."
    note: "آفتابیه و گرمه combines two weather contractions with و."
  fa.a1.unit07.lesson06.teach.turn06:
    title: "Reza suggests going to the park"
    gloss: "Reza says that's great, so let's go to the park."
    note: "عالیه (great) reacts positively before proposing the plan."
  fa.a1.unit07.lesson06.teach.turn07:
    title: "Sara agrees and says goodbye"
    gloss: "Sara agrees and says she'll see him tomorrow."
    note: "باشه (okay) is a common colloquial way to agree to a plan."

exercises:
  fa.a1.unit07.lesson01.exercise01.recognize_sunny:
    instruction: "What does this word mean?"
    correct_option: sunny
    distractors: [rainy, cloudy, snowy]
    accepted_answers: [{value: sunny, status: correct}]
    feedback: "آفتابی means sunny."
  fa.a1.unit07.lesson01.exercise02.recognize_rainy:
    instruction: "What does this word mean?"
    correct_option: rainy
    distractors: [sunny, cloudy, snowy]
