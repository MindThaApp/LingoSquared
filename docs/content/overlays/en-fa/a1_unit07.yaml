  fa.a1.unit07.lesson04.exercise07.translate_today_rainy:
    instruction: "Translate into Farsi: Today it's rainy."
    accepted_answers:
      - {value: "امروز بارونیه", status: correct}
    feedback: "امروز بارونیه follows the same -e contraction pattern."

  fa.a1.unit07.lesson05.exercise01.recognize_because:
