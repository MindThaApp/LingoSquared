      - {value: "آره، موافقم", status: correct}
      - {value: "آره موافقم", status: correct}
    feedback: "آره، موافقم agrees with the suggestion."
  fa.a1.unit07.lesson06.exercise07.write_weather_plan_summary:
    instruction: "Write a short summary: today's weather, tomorrow's weather, and the plan."
    accepted_answers:
      - {value: "امروز بارونیه. فردا آفتابیه و گرمه. بریم پارک.", status: correct}
      - {value: "امروز بارونیه و فردا آفتابیه و گرمه، پس بریم پارک", status: correct}
      - {value: "امروز بارونیه، فردا آفتابیه و گرمه، بریم پارک", status: correct}
    feedback: "Joining the three facts with periods, with و and پس, or with plain commas are all equally natural."
  fa.a1.unit07.lesson06.exercise08.speak_full_weather_exchange:
    instruction: "Ask a friend how the weather is, and suggest a plan based on their answer."
    accepted_answers:
