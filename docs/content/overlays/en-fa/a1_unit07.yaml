    accepted_answers: [{value: "Since it's rainy, we'd better bring an umbrella.", status: correct}]
    feedback: "چون بارونیه، بهتره چتر ببریم combines a reason and a suggestion."
  fa.a1.unit07.lesson05.exercise04.match_suggestion_parts:
