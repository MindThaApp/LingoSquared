    correct_option: rainy
    distractors: [sunny, cloudy, snowy]
    accepted_answers: [{value: rainy, status: correct}]
    feedback: "Reza says بارونیه، فکر کنم (I think it's rainy)."
  fa.a1.unit07.lesson06.exercise03.translate_tomorrow_weather:
    instruction: "Translate into Farsi: Tomorrow it's sunny and warm."
    accepted_answers:
      - {value: "فردا آفتابیه و گرمه", status: correct}
    feedback: "Sara says فردا آفتابیه و گرمه."
  fa.a1.unit07.lesson06.exercise04.match_dialogue_facts:
