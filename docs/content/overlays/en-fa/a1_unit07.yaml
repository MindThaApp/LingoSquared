      - {value: "هوا چطوره؟ آفتابیه، پس بهتره بریم پارک", status: correct}
      - {value: "هوا چطوره؟ آفتابیه، بهتره بریم پارک", status: correct}
      - {value: "هوا چطوره؟ آفتابیه. بهتره بریم پارک.", status: correct}
    feedback: "This combines the weather question from lesson03 with the reason-plus-suggestion pattern from lesson05 -- joining with چون, پس, a plain comma, or a period are all equally natural."
