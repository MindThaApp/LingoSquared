    accepted_answers:
      - {value: {"هوای امروز": بارونیه, "هوای فردا": "آفتابیه و گرمه", "برنامهٔ فردا": "بریم پارک", "فکر کنم": "I think", آره: yeah, موافقم: "I agree", عالیه: great, باشه: okay, می‌بینمت: "see you"}, status: correct}
