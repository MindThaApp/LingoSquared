course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: basic travel vocabulary, buying a ticket,
    asking about departure time and platform, reading a short schedule,
    and a dialogue at the ticket counter.

units:
  fa.a1.unit16.travel:
    title: Travel
    description: Handle basic transport information, tickets, destinations, and departure details.

lessons:
  fa.a1.unit16.lesson01.basic_travel_vocab:
    title: "Basic travel vocabulary"
  fa.a1.unit16.lesson02.buying_a_ticket:
    title: "Buying a ticket"
  fa.a1.unit16.lesson03.asking_departure_details:
    title: "Asking about departure time and platform"
  fa.a1.unit16.lesson04.reading_a_schedule:
    title: "Reading a departure schedule"
  fa.a1.unit16.lesson05.ticket_counter_dialogue:
    title: "A dialogue at the ticket counter"
  fa.a1.unit16.lesson06.confirming_travel_plans:
    title: "Confirming travel plans"

teaching:
  fa.a1.unit16.lesson01.teach.belit_word:
    title: Ticket
    gloss: ticket
    note: "بلیط means ticket."
  fa.a1.unit16.lesson01.teach.ghatar_word:
    title: Train
    gloss: train
    note: "قطار means train."
  fa.a1.unit16.lesson01.teach.otoboos_word:
    title: Bus
    gloss: bus
    note: "اتوبوس means bus."
  fa.a1.unit16.lesson01.teach.forodgah_word:
    title: Airport
    gloss: airport
    note: "فرودگاه means airport."
  fa.a1.unit16.lesson01.teach.yek_word:
    title: A/one
    gloss: "a / one"
    note: "یک means one, used here as an indefinite article (a ticket)."
  fa.a1.unit16.lesson01.teach.az_word:
    title: From
    gloss: from
    note: "از means from, marking origin (distinct from its other use as than in comparisons)."
  fa.a1.unit16.lesson01.teach.do_word:
    title: Two
    gloss: two
    note: "دو means two."
  fa.a1.unit16.lesson01.teach.sekooye_word:
    title: "Platform two"
    gloss: "platform two"
    note: "سکوی دو combines سکو (platform) with the ezafe connector -ی and دو (two)."
  fa.a1.unit16.lesson02.teach.tehran_word:
    title: Tehran
    gloss: Tehran
    note: "The capital of Iran."
  fa.a1.unit16.lesson02.teach.mikham_word:
    title: "I want"
    gloss: "I want"
    note: "می‌خوام is the colloquial contraction of می‌خواهم (I want)."
  fa.a1.unit16.lesson02.teach.be_word:
    title: To
    gloss: to
    note: "به marks the destination -- به تهران means to Tehran."
  fa.a1.unit16.lesson02.teach.belit_be_tehran_phrase:
    title: "I want a ticket to Tehran"
    gloss: "I want a ticket to Tehran"
    note: "یک بلیط به تهران می‌خوام combines this lesson's vocabulary into the standard way to request a ticket."
  fa.a1.unit16.lesson03.teach.sekoo_word:
    title: Platform
    gloss: platform
    note: "سکو means platform (at a train station)."
  fa.a1.unit16.lesson03.teach.harekat_mikone_phrase:
    title: "It departs"
    gloss: "it departs"
    note: "حرکت می‌کنه is the colloquial contraction of حرکت می‌کند (it departs/moves)."
  fa.a1.unit16.lesson03.teach.key_word:
    title: When
    gloss: when
    note: "کی means when, used to ask about time."
  fa.a1.unit16.lesson04.teach.sobh_word:
    title: Morning
    gloss: morning
    note: "صبح means morning."
  fa.a1.unit16.lesson04.teach.schedule_text:
    title: "Sample schedule text"
    gloss: "The Tehran train departs from platform two at eight in the morning."
    note: "A short factual announcement combining this unit's travel vocabulary -- since fa has no working audio, this written text stands in for a spoken station announcement."
  fa.a1.unit16.lesson05.teach.farda_word:
    title: Tomorrow
    gloss: tomorrow
    note: "فردا means tomorrow."
  fa.a1.unit16.lesson05.teach.bashe_word:
    title: Okay
    gloss: okay
    note: "باشه is the colloquial contraction of باشد (okay/agreed)."
  fa.a1.unit16.lesson05.teach.dialogue_line1:
    title: "The traveler says"
    gloss: "I want a ticket to Tehran."
  fa.a1.unit16.lesson05.teach.dialogue_line2:
    title: "The seller asks"
    gloss: "When do you want to go?"
  fa.a1.unit16.lesson05.teach.dialogue_line3:
    title: "The traveler answers"
    gloss: "Tomorrow morning."
  fa.a1.unit16.lesson05.teach.dialogue_line4:
    title: "The seller confirms"
    gloss: "Okay, the train departs from platform two at eight in the morning."
  fa.a1.unit16.lesson06.teach.mamnoon_word:
    title: Thanks
    gloss: thanks
    note: "ممنون means thanks/thank you."
  fa.a1.unit16.lesson06.teach.khahesh_mikonam_phrase:
    title: "You're welcome"
    gloss: "you're welcome"
    note: "خواهش می‌کنم is the standard polite reply to thanks."
  fa.a1.unit16.lesson06.teach.va_word:
    title: And
    gloss: and
    note: "و means and, joining two clauses or items."

exercises:
  fa.a1.unit16.lesson01.exercise01.recognize_belit:
    instruction: "What does this word mean?"
    correct_option: ticket
    distractors: [train, bus, airport]
    accepted_answers: [{value: ticket, status: correct}]
    feedback: "بلیط means ticket."
  fa.a1.unit16.lesson01.exercise02.recognize_ghatar:
    instruction: "What does this word mean?"
    correct_option: train
    distractors: [ticket, bus, airport]
    accepted_answers: [{value: train, status: correct}]
    feedback: "قطار means train."
  fa.a1.unit16.lesson01.exercise03.match_travel_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {بلیط: ticket, قطار: train, اتوبوس: bus, فرودگاه: airport}
        status: correct
    feedback: "These four are this lesson's core travel vocabulary."
  fa.a1.unit16.lesson01.exercise04.translate_a_train_ticket:
    instruction: "Translate into Farsi: a train ticket"
    accepted_answers:
      - {value: "یک بلیط قطار", status: correct}
      - {value: "بلیط قطار", status: correct}
    feedback: "بلیط قطار means train ticket."
  fa.a1.unit16.lesson01.exercise05.translate_the_airport:
    instruction: "Translate into Farsi: the airport"
    accepted_answers:
      - {value: فرودگاه, status: correct}
    feedback: "فرودگاه means the airport."
  fa.a1.unit16.lesson02.exercise01.recognize_tehran:
    instruction: "What does this word mean?"
    correct_option: Tehran
    distractors: [ticket, train, "I want"]
    accepted_answers: [{value: Tehran, status: correct}]
    feedback: "تهران means Tehran."
  fa.a1.unit16.lesson02.exercise02.recognize_mikham:
    instruction: "What does this word mean?"
    correct_option: "I want"
    distractors: [Tehran, to, ticket]
    accepted_answers: [{value: "I want", status: correct}]
    feedback: "می‌خوام means I want."
  fa.a1.unit16.lesson02.exercise03.match_ticket_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {بلیط: ticket, قطار: train, تهران: Tehran, "می‌خوام": "I want", به: to, اتوبوس: bus}
        status: correct
    feedback: "These combine lesson02's new words with lesson01's review vocabulary."
  fa.a1.unit16.lesson02.exercise04.word_order_belit_be_tehran:
    instruction: "Arrange the words to say I want a ticket to Tehran."
    accepted_answers:
      - {value: [یک, بلیط, به, تهران, "می‌خوام"], status: correct}
    feedback: "یک بلیط به تهران می‌خوام means I want a ticket to Tehran."
  fa.a1.unit16.lesson02.exercise05.translate_ticket_request:
    instruction: "Translate into Farsi: I want a ticket to Tehran."
    accepted_answers:
      - {value: "یک بلیط به تهران می‌خوام", status: correct}
      - {value: "بلیط به تهران می‌خوام", status: correct}
    feedback: "یک بلیط به تهران می‌خوام means I want a ticket to Tehran."
  fa.a1.unit16.lesson03.exercise01.recognize_sekoo:
    instruction: "What does this word mean?"
    correct_option: platform
    distractors: [ticket, train, "it departs"]
    accepted_answers: [{value: platform, status: correct}]
    feedback: "سکو means platform."
  fa.a1.unit16.lesson03.exercise02.recognize_harekat_mikone:
    instruction: "What does this phrase mean?"
    correct_option: "it departs"
    distractors: [platform, when, ticket]
    accepted_answers: [{value: "it departs", status: correct}]
    feedback: "حرکت می‌کنه means it departs."
  fa.a1.unit16.lesson03.exercise03.match_departure_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {سکو: platform, "حرکت می‌کنه": "it departs", کی: when, قطار: train, تهران: Tehran, بلیط: ticket}
        status: correct
    feedback: "These combine lesson03's new words with earlier review vocabulary."
  fa.a1.unit16.lesson03.exercise04.translate_when_does_it_depart:
    instruction: "Translate into Farsi: When does the train depart?"
    accepted_answers:
      - {value: "قطار کی حرکت می‌کنه", status: correct}
      - {value: "قطار کی حرکت می‌کنه؟", status: correct}
    feedback: "قطار کی حرکت می‌کنه؟ means when does the train depart?"
  fa.a1.unit16.lesson03.exercise05.translate_platform_two:
    instruction: "Translate into Farsi: The train departs from platform two."
    accepted_answers:
      - {value: "قطار از سکوی دو حرکت می‌کنه", status: correct}
    feedback: "قطار از سکوی دو حرکت می‌کنه means the train departs from platform two."
  fa.a1.unit16.lesson04.exercise01.reading_comprehension_departure_time:
    instruction: "Read the announcement. What time does the Tehran train depart?"
    correct_option: "Eight in the morning"
    distractors: ["Eight at night", "Two o'clock", "It isn't stated"]
    accepted_answers: [{value: "Eight in the morning", status: correct}]
    feedback: "The text says ساعت هشت صبح -- eight in the morning."
  fa.a1.unit16.lesson04.exercise02.reading_comprehension_platform:
    instruction: "Read the announcement. Which platform does it depart from?"
    correct_option: "Platform two"
    distractors: ["Platform eight", "Platform one", "It isn't stated"]
    accepted_answers: [{value: "Platform two", status: correct}]
    feedback: "The text says از سکوی دو -- from platform two."
  fa.a1.unit16.lesson04.exercise03.match_schedule_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {قطار: train, تهران: Tehran, "ساعت هشت": "eight o'clock", صبح: morning, سکو: platform, دو: two}
        status: correct
    feedback: "These are the schedule text's key words."
  fa.a1.unit16.lesson04.exercise04.translate_train_departs_eight:
    instruction: "Translate into Farsi: The train departs at eight in the morning."
    accepted_answers:
      - {value: "قطار ساعت هشت صبح حرکت می‌کنه", status: correct}
    feedback: "قطار ساعت هشت صبح حرکت می‌کنه means the train departs at eight in the morning."
  fa.a1.unit16.lesson04.exercise05.write_own_travel_detail:
    instruction: "Write one sentence in Farsi giving a travel detail (a departure time and/or platform)."
    accepted_answers:
      - {value: "قطار ساعت هشت صبح از سکوی دو حرکت می‌کنه", status: correct}
      - {value: "قطار ساعت هشت صبح حرکت می‌کنه", status: correct}
      - {value: "قطار از سکوی دو حرکت می‌کنه", status: correct}
      - {value: "قطار تهران ساعت هشت صبح حرکت می‌کنه", status: correct}
    feedback: "قطار ساعت هشت صبح از سکوی دو حرکت می‌کنه means the train departs from platform two at eight in the morning -- a good model answer. Any true detail using this unit's vocabulary is equally accepted."
  fa.a1.unit16.lesson05.exercise01.dialogue_comprehension_context:
    instruction: "Read the conversation. When does the traveler want to go?"
    correct_option: "Tomorrow morning"
    distractors: ["Today", "Tomorrow night", "It isn't stated"]
    accepted_answers: [{value: "Tomorrow morning", status: correct}]
    feedback: "مسافر says فردا صبح -- tomorrow morning."
  fa.a1.unit16.lesson05.exercise02.match_dialogue_facts:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {تهران: Tehran, "فردا صبح": "tomorrow morning", "ساعت هشت": "eight o'clock", "سکوی دو": "platform two", بلیط: ticket, باشه: okay}
        status: correct
    feedback: "These are the dialogue's key words and facts."
  fa.a1.unit16.lesson05.exercise03.reading_comprehension_when_traveling:
    instruction: "Read the line. When does the traveler want to go?"
    correct_option: "Tomorrow morning"
    distractors: ["Today", "Tomorrow night", "It isn't stated"]
    accepted_answers: [{value: "Tomorrow morning", status: correct}]
    feedback: "فردا صبح means tomorrow morning."
  fa.a1.unit16.lesson05.exercise04.dialogue_response_state_when:
    instruction: "The seller asks when you want to go. Say tomorrow morning."
    accepted_answers:
      - {value: "فردا صبح", status: correct}
    feedback: "فردا صبح means tomorrow morning."
  fa.a1.unit16.lesson05.exercise05.write_travel_request:
    instruction: "Write a short message in Farsi requesting a ticket to Tehran."
    accepted_answers:
      - {value: "یک بلیط به تهران می‌خوام", status: correct}
      - {value: "یک بلیط قطار به تهران می‌خوام", status: correct}
      - {value: "بلیط به تهران می‌خوام", status: correct}
    feedback: "یک بلیط به تهران می‌خوام means I want a ticket to Tehran."
  fa.a1.unit16.lesson06.exercise01.recognize_mamnoon:
    instruction: "What does this word mean?"
    correct_option: thanks
    distractors: ["you're welcome", train, platform]
    accepted_answers: [{value: thanks, status: correct}]
    feedback: "ممنون means thanks."
  fa.a1.unit16.lesson06.exercise02.match_final_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {ممنون: thanks, "خواهش می‌کنم": "you're welcome", قطار: train, سکو: platform, تهران: Tehran, فردا: tomorrow}
        status: correct
    feedback: "These review this unit's key travel vocabulary."
  fa.a1.unit16.lesson06.exercise03.translate_thanks_youre_welcome:
    instruction: "Translate into Farsi: Thanks. You're welcome."
    accepted_answers:
      - {value: "ممنون. خواهش می‌کنم", status: correct}
      - {value: "ممنون، خواهش می‌کنم", status: correct}
    feedback: "ممنون. خواهش می‌کنم means thanks -- you're welcome."
  fa.a1.unit16.lesson06.exercise04.dialogue_response_thank_seller:
    instruction: "The seller just told you the departure details. Thank them."
    accepted_answers:
      - {value: ممنون, status: correct}
    feedback: "ممنون means thanks."
  fa.a1.unit16.lesson06.exercise05.write_travel_summary:
    instruction: "Write one or two sentences in Farsi summarizing the travel plan: a train to Tehran, tomorrow morning at eight, from platform two."
    accepted_answers:
      - {value: "قطار به تهران فردا صبح ساعت هشت از سکوی دو حرکت می‌کنه", status: correct}
      - {value: "قطار به تهران، فردا صبح، ساعت هشت، از سکوی دو حرکت می‌کنه", status: correct}
      - {value: "قطار به تهران فردا صبح و ساعت هشت از سکوی دو حرکت می‌کنه", status: correct}
      - {value: "قطار به تهران فردا صبح حرکت می‌کنه. از سکوی دو حرکت می‌کنه", status: correct}
    feedback: "قطار به تهران فردا صبح ساعت هشت از سکوی دو حرکت می‌کنه means the train to Tehran departs tomorrow morning at eight from platform two."
