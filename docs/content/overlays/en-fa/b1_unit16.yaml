exercises:
  fa.b1.unit16.lesson01.exercise01.recognize_connector:
    instruction: What does this phrase do?
    correct_option: introduces a purpose
    distractors:
    - reports a question
    - marks a contrast
    - names a person
    accepted_answers:
    - value: introduces a purpose
      status: correct
    feedback: This connector introduces the goal behind the action.
  fa.b1.unit16.lesson01.exercise02.recognize_practice:
    instruction: What does this phrase mean?
    correct_option: I practice
    distractors:
    - I save money
    - I call
    - I arrive
    accepted_answers:
    - value: I practice
      status: correct
    feedback: '*تمرین می‌کنم* means I practice.'
  fa.b1.unit16.lesson01.exercise03.order_study_goal:
    instruction: 'Put the words in order: To be able to speak better, I practice with Sara.'
    accepted_answers:
    - value: تا بتونم بهتر صحبت کنم با سارا تمرین می‌کنم
      status: correct
    feedback: The purpose clause comes before the action here.
