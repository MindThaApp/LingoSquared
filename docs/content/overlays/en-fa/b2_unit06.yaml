    title: Abstraction
    description: Discuss abstract values with qualification and response to another view.
lessons:
  fa.b2.unit06.abstraction.lesson01.qualified_value:
    title: Qualified values
  fa.b2.unit06.abstraction.lesson02.opposing_view:
    title: Responding to another view
  fa.b2.unit06.abstraction.lesson03.cultural_difference:
    title: Cultural difference
teaching:
  fa.b2.unit06.abstraction.lesson01.qualified_value.teach.card01:
    title: freedom
    gloss: freedom
    note: 'Used for political and personal freedom. Here *بدون* is followed by a noun with no extra marking. *آسیب‌پذیر* means vulnerable or easily harmed.'
    example_gloss: Freedom without law is vulnerable.
  fa.b2.unit06.abstraction.lesson01.qualified_value.teach.card02:
    title: responsibility
    gloss: responsibility
    note: 'A noun for responsibility or duty. It often combines with *داشتن* or *پذیرفتن*. The sentence uses *فقط ... نیست* for "not only".'
    example_gloss: Responsibility is not only the government’s duty.
  fa.b2.unit06.abstraction.lesson01.qualified_value.teach.card03:
    title: does not remain stable
    gloss: does not remain stable
    note: '*نمی‌ماند* uses *ماندن* ("to stay") for lasting. *بدون* plus a noun states the condition. A short, general statement about trust.'
    example_gloss: Trust does not remain stable without transparency.
  fa.b2.unit06.abstraction.lesson01.qualified_value.teach.card04:
    title: value
    gloss: value
    note: 'The plural *ارزش‌ها* is common when discussing social values. The same word also means worth or price, so context decides.'
    example_gloss: Every society has several core values.
  fa.b2.unit06.abstraction.lesson01.qualified_value.teach.card05:
    title: on one hand
    gloss: on one hand
    note: 'Sets up a contrast with *از طرف دیگر*. *طرف* here means "side"; the phrase stands at the start of the sentence, followed by a comma or directly by the clause.'
    example_gloss: On one hand, freedom is important.
  fa.b2.unit06.abstraction.lesson01.qualified_value.teach.card06:
    title: on the other hand
    gloss: on the other hand
    note: 'The second half of the pair. *دیگر* follows the noun with ezafe: *طرفِ دیگر*. *هم* means "also".'
    example_gloss: On the other hand, safety is important too.
  fa.b2.unit06.abstraction.lesson01.qualified_value.teach.card07:
    title: culture
    gloss: culture
    note: 'Covers both culture and the habits of a group. It links to the next noun with ezafe, as in *فرهنگ گفت‌وگو*.'
    example_gloss: A culture of dialogue is built slowly.
  fa.b2.unit06.abstraction.lesson01.qualified_value.teach.card08:
    title: is not enough by itself
    gloss: is not enough by itself
    note: '*به تنهایی* means "alone, by itself". Put it after the subject: *قانون به تنهایی*. The adjective *کافی* then takes *نیست* for the negative.'
    example_gloss: Law is not enough by itself.
  fa.b2.unit06.abstraction.lesson01.qualified_value.teach.card09:
    title: stable
    gloss: stable
    note: 'Describes something lasting or steady. As an attributive adjective it follows its noun with ezafe: *راه‌حل پایدار*.'
    example_gloss: A stable solution takes time.
  fa.b2.unit06.abstraction.lesson01.qualified_value.teach.grammar:
    title: Abstraction grammar
    gloss: Abstraction grammar
    note: 'Farsi has no word for the, so abstract nouns like *آزادی* and *مسئولیت* stand bare in general statements. English speakers should avoid adding *این* unless they mean this specific freedom.'
  fa.b2.unit06.abstraction.lesson02.opposing_view.teach.card01:
    title: I understand your point
    gloss: I understand your point
    note: 'The *را* marks *حرفت* as the object. *حرف* here means "what you said", and *-ت* is the clitic "your". It is a casual, friendly phrase.'
    example_gloss: I understand your point, but I reach a different conclusion.
  fa.b2.unit06.abstraction.lesson02.opposing_view.teach.card02:
    title: trust
    gloss: trust
    note: 'Takes *به* for the object of trust: *اعتماد به دوستان*, like English "trust in". Without it, the word stands for the general idea.'
    example_gloss: Trust increases with transparency.
  fa.b2.unit06.abstraction.lesson02.opposing_view.teach.card03:
    title: privacy
    gloss: privacy
    note: 'A set phrase, usually linked by ezafe to a person or group: *حریم خصوصی کاربران*. It refers to personal space and data, not only physical privacy.'
    example_gloss: Privacy is important for users.
  fa.b2.unit06.abstraction.lesson02.opposing_view.teach.card04:
    title: the issue of trust
    gloss: the issue of trust
    note: 'A noun phrase linked by ezafe. *نمی‌شود ... گرفت* is an impersonal "cannot be taken", and *ساده گرفتن* means to treat as simple or take lightly.'
    example_gloss: The issue of trust cannot be taken lightly.
  fa.b2.unit06.abstraction.lesson02.opposing_view.teach.card05:
    title: I agree with this part
    gloss: I agree with this part
    note: 'Persian uses *با* for agreeing with something: *با ... موافقم*. English speakers sometimes want *به* here by mistake. *ولی* is the spoken equivalent of *اما*.'
    example_gloss: I agree with this part, but I have another question.
  fa.b2.unit06.abstraction.lesson02.opposing_view.teach.card06:
    title: viewpoint
    gloss: viewpoint
    note: 'A common word in discussion and essay writing. A possessive comes after it with ezafe: *دیدگاه شما*, *دیدگاه من*.'
    example_gloss: Your viewpoint shows personal experience.
  fa.b2.unit06.abstraction.lesson02.opposing_view.teach.card07:
    title: but it is not enough
    gloss: but it is not enough
    note: 'Put the concession first, then add the contrast with *اما*. *کافی نیست* is a simple negation and also fits *درست نیست* or *روشن نیست*.'
    example_gloss: This explanation is useful, but it is not enough.
  fa.b2.unit06.abstraction.lesson02.opposing_view.teach.card08:
    title: user
    gloss: user
    note: 'Means a user of a service or app. It takes a subjunctive with *باید*: *داشته باشد*. English "have a choice" becomes *انتخاب داشتن*.'
    example_gloss: The user must have a real choice.
  fa.b2.unit06.abstraction.lesson02.opposing_view.teach.card09:
    title: we should not pass over it lightly
    gloss: we should not pass over it lightly
    note: 'A negative modal *نباید* plus a verb. *از آن گذشتن* means to pass over it. The phrase warns without naming anyone.'
    example_gloss: People’s concern is serious, and we should not pass over it lightly.
  fa.b2.unit06.abstraction.lesson02.opposing_view.teach.grammar:
    title: Abstraction grammar
    gloss: Abstraction grammar
    note: '*حرفت را می‌فهمم* acknowledges the other person before disagreement. This direct response is essential for B2 abstract discussion.'
  fa.b2.unit06.abstraction.lesson03.cultural_difference.teach.card01:
    title: difference
    gloss: difference
    note: 'Often linked by ezafe: *تفاوت دیدگاه*. It is neutral, unlike *اختلاف*, which suggests a dispute.'
    example_gloss: A difference in viewpoint is not always a problem.
  fa.b2.unit06.abstraction.lesson03.cultural_difference.teach.card02:
    title: society
    gloss: society
    note: 'Means a society or community in the broad sense. The verb *بسته می‌شود* is passive-like: it becomes closed. *جامعه* can also refer to a smaller community.'
    example_gloss: A society without dialogue becomes closed.
  fa.b2.unit06.abstraction.lesson03.cultural_difference.teach.card03:
    title: for some people
    gloss: for some people
    note: '*برای* here means "in the view of" rather than "for the benefit of". *بعضی* is followed by a plural noun, as in the example.'
    example_gloss: For some people, speed of response is more important than a long explanation.
  fa.b2.unit06.abstraction.lesson03.cultural_difference.teach.card04:
    title: respect
    gloss: respect
    note: '*احترام* is a noun; the verbs that go with it include *گذاشتن* and *داشتن*. *همیشه ... نیست* gives "not always".'
    example_gloss: Respect does not always mean agreement.
  fa.b2.unit06.abstraction.lesson03.cultural_difference.teach.card05:
    title: we should not generalize
    gloss: we should not generalize
    note: '*تعمیم دادن* is a compound verb. The source takes *از*: *از یک تجربه*. *نباید* plus a subjunctive gives a mild warning.'
    example_gloss: We should not generalize from one experience.
  fa.b2.unit06.abstraction.lesson03.cultural_difference.teach.card06:
    title: identity
    gloss: identity
    note: 'It does not mean an identity card (that is *کارت شناسایی*). It is the abstract noun for who someone is, often *هویت ملی* or *هویت فرهنگی*.'
    example_gloss: Language is part of identity.
  fa.b2.unit06.abstraction.lesson03.cultural_difference.teach.card07:
    title: culturally
    gloss: culturally
    note: '*از نظر* plus an adjective frames a viewpoint, as in *از نظر فرهنگی*. The adverb-like *فرهنگی* needs no extra ending.'
    example_gloss: Culturally, this behavior has several meanings.
  fa.b2.unit06.abstraction.lesson03.cultural_difference.teach.card08:
    title: dialogue
    gloss: dialogue
    note: 'From *گفتن* and *گو*, with a ZWNJ in writing. It is more formal than *صحبت*, and also appears as *گفتگو*.'
    example_gloss: Dialogue reduces disagreement.
  fa.b2.unit06.abstraction.lesson03.cultural_difference.teach.card09:
    title: can be true at the same time
    gloss: can be true at the same time
    note: '*همزمان* means "at the same time". After it, *درست باشد* is subjunctive because it follows *می‌تواند*.'
    example_gloss: Two views can be true at the same time.
  fa.b2.unit06.abstraction.lesson03.cultural_difference.teach.grammar:
    title: Abstraction grammar
    gloss: Abstraction grammar
    note: 'When comparing cultures, *بعضی‌ها* and *برای بعضی افراد* avoid overgeneralizing. This keeps the claim qualified.'
