course:
  title: Farsi A2
  description: >-
    Lower-intermediate Iranian Farsi: handling a train delay -- understanding
    a disruption announcement, politely asking a station employee about an
    alternative route, and reading a written notice about the same delay.

units:
  fa.a2.unit15.travel_disruption:
    title: Travel problems

lessons:
  fa.a2.unit15.lesson01.travel_disruption_vocabulary: {title: "Delay words"}
  fa.a2.unit15.lesson02.asking_about_alternatives: {title: "Asking about an alternative route"}
  fa.a2.unit15.lesson03.reading_a_station_notice: {title: "Reading a station notice"}
  fa.a2.unit15.lesson04.station_counter_dialogue: {title: "At the station counter"}

teaching:
  fa.a2.unit15.lesson01.teach.train_word:
    title: "Train"
    gloss: "train"
    note: "*قطار* is the general word for a train."
    example_gloss: "My train leaves at nine."
  fa.a2.unit15.lesson01.teach.delay_word:
    title: "Delay"
    gloss: "delay"
    note: "*تاخیر* is the general word for a delay."
    example_gloss: "The train has a delay today."
  fa.a2.unit15.lesson01.teach.platform_word:
    title: "Platform"
    gloss: "platform"
    note: "*سکو* is the word for a train platform; *سکوی* is its ezafe form before a number, e.g. *سکوی سه* (platform three)."
    example_gloss: "The train departs from platform three."
  fa.a2.unit15.lesson01.teach.cancel_word:
    title: "Cancelled"
    gloss: "cancelled"
    note: "*لغو* is the word for cancelled; *لغو شدن* (to be cancelled) is the light-verb construction built from it."
    example_gloss: "The train ticket was cancelled."
  fa.a2.unit15.lesson01.teach.announcement_word:
    title: "Announcement"
    gloss: "announcement"
    note: "*اعلامیه* is the word for a written announcement or notice."
    example_gloss: "This announcement is very important."
  fa.a2.unit15.lesson01.teach.alternative_route_word:
    title: "Alternative route"
    gloss: "alternative route"
    note: "*مسیر جایگزین* combines *مسیر* (route) with *جایگزین* (alternative/substitute)."
    example_gloss: "The alternative route departs from platform five."
  fa.a2.unit15.lesson01.teach.recap_numbers_time:
    title: "Times and numbers for this unit"
    gloss: "nine o'clock, ten o'clock, three, five"
    note: "Recap of the numbers/times this unit's scenario needs."

  fa.a2.unit15.lesson02.teach.when_does_it_leave:
    title: "Excuse me, when does the train leave?"
    gloss: "Excuse me, when does the train leave?"
    note: "*ببخشید* politely opens a question to a stranger or staff member."
  fa.a2.unit15.lesson02.teach.is_there_an_alternative:
    title: "Is there an alternative route?"
    gloss: "Is there an alternative route?"
    note: "*هست؟* (is there?) is the basic existence question used to ask if something is available."
  fa.a2.unit15.lesson02.teach.full_alternative_question:
    title: "Politely ask about an earlier alternative"
    gloss: "Excuse me, is there an alternative route so I arrive earlier?"
    note: "*که زودتر برسم* (so that I arrive earlier) adds the purpose to the plain existence question."

  fa.a2.unit15.lesson03.teach.because_of_note:
    title: "Because of (+ noun)"
    gloss: "because of ..."
    note: "*به خاطر* takes a NOUN directly after it (*به خاطر مشکل فنی*, because of a technical problem) -- unlike *چون*, which takes a full clause."
  fa.a2.unit15.lesson03.teach.technical_problem_word:
    title: "Technical problem"
    gloss: "technical problem"
    note: "*مشکل فنی* is the standard phrase for a technical problem, common in travel announcements."
    example_gloss: "The train is delayed because of a technical problem."
  fa.a2.unit15.lesson03.teach.notice_text:
    title: "A station notice about a delay"
    gloss: "Attention: the nine o'clock train to Isfahan is delayed one hour because of a technical problem and departs at ten from platform three. The alternative bus departs at nine thirty from platform five."
    note: "A short official station notice, the written register this unit is teaching."

  fa.a2.unit15.lesson04.teach.i_will_wait:
    title: "I'll wait for the train"
    gloss: "I'll wait for the train."
    note: "*منتظر ... می‌مونم* (I'll stay waiting for ...) is the standard way to say you'll wait for something."
  fa.a2.unit15.lesson04.teach.turn01:
    title: "نیما asks when the train leaves"
    gloss: "نیما politely asks when the nine o'clock train to Isfahan leaves."
    note: "Reuses this lesson's own opener phrase."
  fa.a2.unit15.lesson04.teach.turn02:
    title: "کارمند explains the delay"
    gloss: "The employee says unfortunately, because of a technical problem, it's delayed an hour and now leaves at ten from platform three."
    note: "*متاسفانه* (unfortunately) softens delivering bad news."
  fa.a2.unit15.lesson04.teach.turn03:
    title: "نیما asks about an alternative"
    gloss: "نیما asks if there's an alternative route so he arrives earlier."
    note: "Reuses lesson02's full alternative-route question."
  fa.a2.unit15.lesson04.teach.turn04:
    title: "کارمند offers the alternative bus"
    gloss: "The employee says yes, a bus leaves at nine thirty from platform five, but he'd need to buy a new ticket."
    note: "*باید ... بخرید* (you would need to buy) states the real cost of the alternative."
  fa.a2.unit15.lesson04.teach.turn05:
    title: "نیما declines and waits"
    gloss: "نیما says no, that's fine -- he'll wait for the train."
    note: "*مشکلی نیست* (that's not a problem / that's fine) politely declines the offer."
  fa.a2.unit15.lesson04.teach.turn06:
    title: "کارمند confirms the plan"
    gloss: "The employee says okay, so wait at platform three at ten."
    note: "*پس* (so / then) draws the conclusion from what نیما just decided."

exercises:
  fa.a2.unit15.lesson01.exercise01.recognize_train:
    instruction: "What does this word mean?"
    correct_option: "train"
    distractors: ["platform", "announcement", "delay"]
    accepted_answers: [{value: "train", status: correct}]
    feedback: "*قطار* means train."
  fa.a2.unit15.lesson01.exercise02.recognize_delay:
    instruction: "What does this word mean?"
    correct_option: "delay"
    distractors: ["cancelled", "train", "alternative route"]
    accepted_answers: [{value: "delay", status: correct}]
    feedback: "*تاخیر* means delay."
  fa.a2.unit15.lesson01.exercise03.match_travel_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {قطار: train, تاخیر: delay, سکو: platform, لغو: cancelled, اعلامیه: announcement, "مسیر جایگزین": "alternative route"}, status: correct}
    feedback: "These six words cover this unit's basic travel-disruption vocabulary."
  fa.a2.unit15.lesson01.exercise04.order_train_delayed:
    instruction: "Arrange the words to say: the train has a one-hour delay."
    accepted_answers: [{value: [قطار, یک, ساعت, تاخیر, داره], status: correct}]
    feedback: "*قطار یک ساعت تاخیر داره.* states the train's delay."
  fa.a2.unit15.lesson01.exercise05.write_platform:
    instruction: "Write the Farsi word for platform."
    accepted_answers:
      - {value: سکو, status: correct}
    feedback: "*سکو* means platform."

  fa.a2.unit15.lesson02.exercise01.recognize_alternative_question:
    instruction: "Which question asks if there's an alternative route to arrive earlier?"
    correct_option: "Is there an alternative route so I arrive earlier?"
    distractors: ["The train has a one-hour delay.", "The alternative bus departs from platform five.", "I cancelled the train ticket."]
    accepted_answers: [{value: "Is there an alternative route so I arrive earlier?", status: correct}]
    feedback: "*مسیر جایگزینی هست که زودتر برسم؟* asks exactly this."
  fa.a2.unit15.lesson02.exercise02.order_alternative_question:
    instruction: "Arrange the words to ask: excuse me, is there an alternative route so I arrive earlier?"
    accepted_answers: [{value: [ببخشید, مسیر, جایگزینی, هست, که, زودتر, برسم], status: correct}]
    feedback: "*ببخشید، مسیر جایگزینی هست که زودتر برسم؟* politely asks about an earlier alternative."
  fa.a2.unit15.lesson02.exercise03.dialogue_response_ask_alternative:
    instruction: "The employee says: 'Unfortunately the train has a one-hour delay.' Politely ask if there's an alternative route so you arrive earlier."
    accepted_answers:
      - {value: "ببخشید، مسیر جایگزینی هست که زودتر برسم؟", status: correct}
      - {value: "ببخشید مسیر جایگزینی هست که زودتر برسم؟", status: correct}
    feedback: "*ببخشید، مسیر جایگزینی هست که زودتر برسم؟* is the polite way to ask."
  fa.a2.unit15.lesson02.exercise04.translate_alternative_question:
    instruction: "Translate into Farsi: excuse me, is there an alternative route so I arrive earlier?"
    accepted_answers:
      - {value: "ببخشید، مسیر جایگزینی هست که زودتر برسم؟", status: correct}
      - {value: "ببخشید مسیر جایگزینی هست که زودتر برسم؟", status: correct}
    feedback: "*ببخشید، مسیر جایگزینی هست که زودتر برسم؟* is the accepted translation."
  fa.a2.unit15.lesson02.exercise05.write_ask_alternative:
    instruction: "Write that there's an alternative route."
    accepted_answers:
      - {value: "مسیر جایگزینی هست.", status: correct}
      - {value: "مسیر جایگزینی هست", status: correct}
    feedback: "*مسیر جایگزینی هست.* states that an alternative route exists."

  fa.a2.unit15.lesson03.exercise01.read_delay_reason:
    instruction: "According to the notice, why is the train delayed?"
    correct_option: "Because of a technical problem."
    distractors: ["Because of bad weather.", "Because of a strike.", "The notice does not say."]
    accepted_answers: [{value: "Because of a technical problem.", status: correct}]
    feedback: "*به خاطر مشکل فنی* -- because of a technical problem."
  fa.a2.unit15.lesson03.exercise02.read_alternative_bus_platform:
    instruction: "According to the notice, which platform does the alternative bus depart from?"
    correct_option: "Platform five."
    distractors: ["Platform three.", "Platform one.", "The notice does not say."]
    accepted_answers: [{value: "Platform five.", status: correct}]
    feedback: "*اتوبوس جایگزین ساعت نُه و نیم از سکوی پنج حرکت می‌کنه* -- the alternative bus departs from platform five."
  fa.a2.unit15.lesson03.exercise03.recognize_technical_problem:
    instruction: "What does this phrase mean?"
    correct_option: "technical problem"
    distractors: ["alternative route", "announcement", "platform"]
    accepted_answers: [{value: "technical problem", status: correct}]
    feedback: "*مشکل فنی* means technical problem."
  fa.a2.unit15.lesson03.exercise04.order_delay_reason_sentence:
    instruction: "Arrange the words to say: the train has a delay because of a technical problem."
    accepted_answers: [{value: [قطار, "به خاطر", "مشکل فنی", تاخیر, داره], status: correct}]
    feedback: "*قطار به خاطر مشکل فنی تاخیر داره.* states the reason for the delay."
  fa.a2.unit15.lesson03.exercise05.write_delay_reason:
    instruction: "Write that the train has a delay because of a technical problem."
    accepted_answers:
      - {value: "قطار به خاطر مشکل فنی تاخیر داره.", status: correct}
      - {value: "قطار به خاطر مشکل فنی تاخیر داره", status: correct}
    feedback: "*قطار به خاطر مشکل فنی تاخیر داره.* states the reason for the delay."

  fa.a2.unit15.lesson04.exercise01.comprehend_delay_reason:
    instruction: "Why is نیما's train delayed?"
    correct_option: "Because of a technical problem."
    distractors: ["Because of bad weather.", "Because it was cancelled.", "Because of a strike."]
    accepted_answers: [{value: "Because of a technical problem.", status: correct}]
    feedback: "*متاسفانه به خاطر مشکل فنی، یک ساعت تاخیر داره* -- unfortunately, because of a technical problem, it has a one-hour delay."
  fa.a2.unit15.lesson04.exercise02.comprehend_nima_decision:
    instruction: "What does نیما decide to do?"
    correct_option: "Wait for the train."
    distractors: ["Take the alternative bus.", "Buy a new ticket for tomorrow.", "Cancel his trip."]
    accepted_answers: [{value: "Wait for the train.", status: correct}]
    feedback: "*منتظر قطار می‌مونم* -- نیما decides to wait for the train."
  fa.a2.unit15.lesson04.exercise03.recognize_wait:
    instruction: "What does this word mean?"
    correct_option: "waiting"
    distractors: ["cancelled", "delayed", "alternative"]
    accepted_answers: [{value: "waiting", status: correct}]
    feedback: "*منتظر* means waiting."
  fa.a2.unit15.lesson04.exercise04.order_i_will_wait:
    instruction: "Arrange the words to say: I'll wait for the train."
    accepted_answers: [{value: [منتظر, قطار, "می‌مونم"], status: correct}]
    feedback: "*منتظر قطار می‌مونم.* says you'll wait for the train."
  fa.a2.unit15.lesson04.exercise05.dialogue_response_decline_bus:
    instruction: "The employee offers an alternative bus but says you'd need a new ticket. Answer that no, that's fine, you'll wait for the train."
    accepted_answers:
      - {value: "نه، مشکلی نیست. منتظر قطار می‌مونم.", status: correct}
      - {value: "نه مشکلی نیست منتظر قطار می‌مونم", status: correct}
      - {value: "نه، مشکلی نیست، منتظر قطار می‌مونم.", status: correct}
    feedback: "*نه، مشکلی نیست. منتظر قطار می‌مونم.* politely declines and states his decision."
  fa.a2.unit15.lesson04.exercise06.write_will_be_late_message:
    instruction: "Write a short message saying your train has a one-hour delay."
    accepted_answers:
      - {value: "قطارم یک ساعت تاخیر داره.", status: correct}
      - {value: "قطارم یک ساعت تاخیر داره", status: correct}
    feedback: "*قطارم یک ساعت تاخیر داره.* explains the delay to whoever you're messaging."
