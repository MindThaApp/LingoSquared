course:
  title: Farsi A2
  description: >-
    Lower-intermediate Iranian Farsi: opening a bank account -- asking
    what documents are needed, making a polite conditional request, and
    following a bank-counter exchange from request through card pickup.

units:
  fa.a2.unit11.banking:
    title: Opening a bank account

lessons:
  fa.a2.unit11.lesson01.banking_vocabulary: {title: "Banking words"}
  fa.a2.unit11.lesson02.requesting_an_account: {title: "Requesting an account"}
  fa.a2.unit11.lesson03.reading_a_bank_notice: {title: "Reading a bank notice"}
  fa.a2.unit11.lesson04.bank_counter_dialogue: {title: "At the bank counter"}

teaching:
  fa.a2.unit11.lesson01.teach.bank_word:
    title: "Bank"
    gloss: "bank"
    note: "*بانک* is the general word for a bank."
    example_gloss: "The bank is near my new home."
  fa.a2.unit11.lesson01.teach.account_word:
    title: "Account"
    gloss: "account"
    note: "*حساب* is the general word for an account."
    example_gloss: "I want to open an account."
  fa.a2.unit11.lesson01.teach.bank_card_word:
    title: "Bank card"
    gloss: "bank card"
    note: "*کارت بانکی* is the standard debit/bank card issued when you open an account."
    example_gloss: "My bank card has a PIN code."
  fa.a2.unit11.lesson01.teach.pin_word:
    title: "PIN code"
    gloss: "PIN code / password"
    note: "*رمز* is the word for a PIN code or password."
    example_gloss: "Don't forget your card's PIN code."
  fa.a2.unit11.lesson01.teach.balance_word:
    title: "Balance"
    gloss: "balance"
    note: "*موجودی* is the word for an account balance."
    example_gloss: "My account balance is low."
  fa.a2.unit11.lesson01.teach.document_word:
    title: "Document"
    gloss: "document"
    note: "*مدرک* is the general word for a document, reused from the earlier registration unit."
    example_gloss: "You need a document to open an account."
  fa.a2.unit11.lesson01.teach.baz_kardan_note:
    title: "To open (light verb)"
    gloss: "to open"
    note: "*باز کردن* literally means 'open do' -- Persian builds many verbs this way, with a noun/adjective plus a light verb like *کردن*."
  fa.a2.unit11.lesson01.teach.ra_note:
    title: "Object marker"
    gloss: "(marks a definite direct object)"
    note: "*رو* (colloquial for formal *را*) marks a definite direct object -- it comes right after the thing being acted on."
  fa.a2.unit11.lesson01.teach.recap_registration_terms:
    title: "National ID and proof of address"
    gloss: "national ID card and proof-of-address document"
    note: "*کارت ملی* and *مدرک آدرس* are the two documents this unit's bank visit needs -- reused from the earlier registration unit."

  fa.a2.unit11.lesson02.teach.i_want_to_open_account:
    title: "Request to open an account"
    gloss: "I would like to open a bank account."
    note: "*می‌خواستم ...* is the same polite softened-request form from the earlier registration unit."
  fa.a2.unit11.lesson02.teach.if_bring_documents:
    title: "State a condition with اگر (if)"
    gloss: "If you bring your documents, you can open an account today."
    note: "*اگر ...، ...* is the A2-level conditional step up -- state the condition first, then the result."
  fa.a2.unit11.lesson02.teach.full_request_with_condition:
    title: "Combine the request and the condition"
    gloss: "I would like to open a bank account. If you bring your documents, it can be done today."
    note: "The full request-plus-condition pattern this lesson is built around."

  fa.a2.unit11.lesson03.teach.necessary_word:
    title: "Necessary"
    gloss: "necessary / needed"
    note: "*لازم* is the general word for necessary or needed."
    example_gloss: "You need a national ID card to open an account."
  fa.a2.unit11.lesson03.teach.working_hours_word:
    title: "Working hours"
    gloss: "working hours"
    note: "*ساعت کاری* is the standard phrase for a business's working hours."
    example_gloss: "The bank's working hours are from 8am to 2pm."
  fa.a2.unit11.lesson03.teach.notice_text:
    title: "A bank notice about opening an account"
    gloss: "To open an account, a national ID card and a proof-of-address document are needed. The bank's working hours are from 8am to 2pm."
    note: "A short official notice in a neutral written style, though it still uses the everyday spoken *لازمه*."

  fa.a2.unit11.lesson04.teach.how_can_i_help:
    title: "How can I help you?"
    gloss: "Please, how can I help you?"
    note: "*بفرمایید، چه کمکی می‌تونم بکنم؟* is the standard polite opener at a service counter."
  fa.a2.unit11.lesson04.teach.turn01:
    title: "کارمند greets سارا"
    gloss: "The employee says hello and asks how they can help."
    note: "Reuses this lesson's own opener phrase."
  fa.a2.unit11.lesson04.teach.turn02:
    title: "سارا states her request"
    gloss: "سارا says she would like to open a bank account."
    note: "Reuses lesson02's *می‌خواستم ...* pattern."
  fa.a2.unit11.lesson04.teach.turn03:
    title: "کارمند asks for documents"
    gloss: "The employee asks if she has her national ID and a proof-of-address document."
    note: "*کارت ملی* and *مدرک آدرس* were already established in the earlier registration unit."
  fa.a2.unit11.lesson04.teach.turn04:
    title: "سارا confirms what she brought"
    gloss: "سارا says yes, she brought her national ID and her new home's electricity bill."
    note: "*قبض برق* (electricity bill) reuses the earlier registration unit's *قبض* vocabulary."
  fa.a2.unit11.lesson04.teach.turn05:
    title: "کارمند confirms the timeline"
    gloss: "The employee says great -- her bank card will be ready within three days."
    note: "*تا سه روز دیگه* (within three days) states the turnaround time."
  fa.a2.unit11.lesson04.teach.turn06:
    title: "سارا asks about the PIN"
    gloss: "سارا asks when she'll get the PIN code."
    note: "*کی* means 'when' here; the same word also means 'who', and context tells them apart."
  fa.a2.unit11.lesson04.teach.turn07:
    title: "کارمند answers about the PIN"
    gloss: "The employee says the same day she picks up the card."
    note: "*همون روزی که ...* means 'the same day that ...'."

exercises:
  fa.a2.unit11.lesson01.exercise01.recognize_bank:
    instruction: "What does this word mean?"
    correct_option: "bank"
    distractors: ["account", "document", "balance"]
    accepted_answers: [{value: "bank", status: correct}]
    feedback: "*بانک* means bank."
  fa.a2.unit11.lesson01.exercise02.recognize_balance:
    instruction: "What does this word mean?"
    correct_option: "balance"
    distractors: ["bank", "PIN code", "document"]
    accepted_answers: [{value: "balance", status: correct}]
    feedback: "*موجودی* means balance."
  fa.a2.unit11.lesson01.exercise03.match_banking_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {بانک: bank, حساب: account, "کارت بانکی": "bank card", رمز: "PIN code", موجودی: balance, مدرک: document}, status: correct}
    feedback: "These six words cover this unit's basic banking vocabulary."
  fa.a2.unit11.lesson01.exercise04.order_open_account:
    instruction: "Arrange the words to say open an account."
    accepted_answers: [{value: [حساب, باز, کردن], status: correct}]
    feedback: "*حساب باز کردن* is the light-verb construction for opening an account."
  fa.a2.unit11.lesson01.exercise05.write_bank_card:
    instruction: "Write the Farsi word for bank card."
    accepted_answers:
      - {value: "کارت بانکی", status: correct}
    feedback: "*کارت بانکی* means bank card."

  fa.a2.unit11.lesson02.exercise01.recognize_request_phrase:
    instruction: "Which phrase politely requests to open an account?"
    correct_option: "I would like to open a bank account."
    distractors: ["If you bring your documents, it can be done today.", "My account balance is low.", "Don't forget your card's PIN code."]
    accepted_answers: [{value: "I would like to open a bank account.", status: correct}]
    feedback: "*می‌خواستم یک حساب بانکی باز کنم.* makes the request politely."
  fa.a2.unit11.lesson02.exercise02.order_if_bring_documents:
    instruction: "Arrange the words to say: if you bring your documents, you can open an account today."
    accepted_answers: [{value: [اگر, مدارکتون, رو, بیارید, می‌تونید, همین, امروز, حساب, باز, کنید], status: correct}]
    feedback: "*اگر مدارکتون رو بیارید، می‌تونید همین امروز حساب باز کنید.* states the condition, then the result."
  fa.a2.unit11.lesson02.exercise03.dialogue_response_what_do_you_want:
    instruction: "The bank employee says: 'Please, go ahead.' Answer that you would like to open a bank account."
    accepted_answers:
      - {value: "می‌خواستم یک حساب بانکی باز کنم.", status: correct}
      - {value: "می‌خواستم یک حساب بانکی باز کنم", status: correct}
    feedback: "*می‌خواستم یک حساب بانکی باز کنم.* politely states what you want."
  fa.a2.unit11.lesson02.exercise04.translate_request_with_condition:
    instruction: "Translate into Farsi: I would like to open a bank account. If you bring your documents, it can be done today."
    accepted_answers:
      - {value: "می‌خواستم یک حساب بانکی باز کنم. اگر مدارکتون رو بیارید، همین امروز می‌شه.", status: correct}
      - {value: "می‌خواستم یک حساب بانکی باز کنم، اگر مدارکتون رو بیارید همین امروز می‌شه.", status: correct}
      - {value: "می‌خواستم یک حساب بانکی باز کنم و اگر مدارکتون رو بیارید همین امروز می‌شه.", status: correct}
    feedback: "Joining the two sentences with a period, a comma, or *و* are equally natural here."
  fa.a2.unit11.lesson02.exercise05.write_want_to_open_account:
    instruction: "Write that you would like to open a bank account."
    accepted_answers:
      - {value: "می‌خواستم یک حساب بانکی باز کنم.", status: correct}
      - {value: "می‌خواستم یک حساب بانکی باز کنم", status: correct}
    feedback: "*می‌خواستم یک حساب بانکی باز کنم.* is the accepted polite request."

  fa.a2.unit11.lesson03.exercise01.read_required_documents:
    instruction: "According to the notice, what documents are needed to open an account?"
    correct_option: "A national ID card and a proof-of-address document."
    distractors: ["Only a national ID card.", "A passport and a photo.", "No documents are needed."]
    accepted_answers: [{value: "A national ID card and a proof-of-address document.", status: correct}]
    feedback: "*کارت ملی و یک مدرک آدرس لازمه* -- a national ID card and a proof-of-address document are needed."
  fa.a2.unit11.lesson03.exercise02.read_working_hours:
    instruction: "According to the notice, what are the bank's working hours?"
    correct_option: "From 8am to 2pm."
    distractors: ["From 9am to 5pm.", "From 10am to 6pm.", "The notice does not say."]
    accepted_answers: [{value: "From 8am to 2pm.", status: correct}]
    feedback: "*ساعت کاری بانک از ۸ صبح تا ۲ بعدازظهر است* -- the bank's working hours are from 8am to 2pm."
  fa.a2.unit11.lesson03.exercise03.recognize_necessary:
    instruction: "What does this word mean?"
    correct_option: "necessary / needed"
    distractors: ["working hours", "document", "bank"]
    accepted_answers: [{value: "necessary / needed", status: correct}]
    feedback: "*لازم* means necessary or needed."
  fa.a2.unit11.lesson03.exercise04.order_working_hours_sentence:
    instruction: "Arrange the words to say: the bank's working hours are from 8am to 2pm."
    accepted_answers: [{value: ["ساعت کاری", بانک, از, "۸", صبح, تا, "۲", بعدازظهر, است], status: correct}]
    feedback: "*ساعت کاری بانک از ۸ صبح تا ۲ بعدازظهر است.* states the working hours."
  fa.a2.unit11.lesson03.exercise05.write_documents_needed:
    instruction: "Write that a national ID card and a proof-of-address document are needed."
    accepted_answers:
      - {value: "کارت ملی و یک مدرک آدرس لازمه.", status: correct}
      - {value: "کارت ملی و یک مدرک آدرس لازمه", status: correct}
    feedback: "*کارت ملی و یک مدرک آدرس لازمه.* states what documents are needed."

  fa.a2.unit11.lesson04.exercise01.comprehend_what_sara_wants:
    instruction: "What does سارا want to do at the bank?"
    correct_option: "Open a bank account."
    distractors: ["Report a lost card.", "Ask about her balance.", "Close her account."]
    accepted_answers: [{value: "Open a bank account.", status: correct}]
    feedback: "*می‌خواستم یک حساب بانکی باز کنم.* -- سارا wants to open a bank account."
  fa.a2.unit11.lesson04.exercise02.comprehend_documents_brought:
    instruction: "What documents did سارا bring?"
    correct_option: "Her national ID card and her new home's electricity bill."
    distractors: ["Only her national ID card.", "A passport and a photo.", "Her old address's utility bill."]
    accepted_answers: [{value: "Her national ID card and her new home's electricity bill.", status: correct}]
    feedback: "*کارت ملیم و قبض برق خونه‌ی جدیدم رو آوردم* -- her national ID and her new home's electricity bill."
  fa.a2.unit11.lesson04.exercise03.recognize_ready:
    instruction: "What does this word mean?"
    correct_option: "ready"
    distractors: ["necessary", "again", "document"]
    accepted_answers: [{value: "ready", status: correct}]
    feedback: "*آماده* means ready."
  fa.a2.unit11.lesson04.exercise04.order_when_do_i_get_pin:
    instruction: "Arrange the words to ask: when do I get the PIN code?"
    accepted_answers: [{value: [رمزش, رو, کی, می‌گیرم], status: correct}]
    feedback: "*رمزش رو کی می‌گیرم؟* asks when you get the PIN code."
  fa.a2.unit11.lesson04.exercise05.dialogue_response_bring_documents:
    instruction: "The employee asks: 'Do you have your national ID and a proof-of-address document?' Answer that yes, you brought your national ID and your new home's electricity bill."
    accepted_answers:
      - {value: "بله، کارت ملیم و قبض برق خونه‌ی جدیدم رو آوردم.", status: correct}
      - {value: "بله کارت ملیم و قبض برق خونه‌ی جدیدم رو آوردم", status: correct}
    feedback: "*بله، کارت ملیم و قبض برق خونه‌ی جدیدم رو آوردم.* confirms what she brought."
  fa.a2.unit11.lesson04.exercise06.write_bank_visit_summary:
    instruction: "Write what the employee said about سارا's bank card: it will be ready within three days."
    accepted_answers:
      - {value: "کارت بانکی تا سه روز دیگه آماده می‌شه", status: correct}
      - {value: "کارت بانکی تا سه روز دیگه آماده می‌شه.", status: correct}
    feedback: "*کارت بانکی تا سه روز دیگه آماده می‌شه.* is what the employee said about the bank card."
