teaching:
  fa.b1.unit09.lesson01.teach.mishe_age:
    title: "would it be all right if"
    gloss: "would it be all right if"
    note: "*می‌شه اگه...؟* softens a request or suggestion into a question -- 'would it be all right if...?' rather than a direct statement. Register-neutral in tone but common in professional contexts precisely because it's polite."
    example_gloss: "Would it be all right if we came tomorrow?"
  fa.b1.unit09.lesson01.teach.jalase:
    title: meeting
    gloss: meeting
    example_gloss: "The meeting starts at ten."
  fa.b1.unit09.lesson01.teach.movakol_konim:
    title: "we postpone"
    gloss: "we postpone"
    example_gloss: "Would it be all right if we postponed the meeting?"
  fa.b1.unit09.lesson01.teach.be_farda:
    title: "to tomorrow"
    gloss: "to tomorrow"
    example_gloss: "Would it be all right if we postponed the meeting to tomorrow?"
  fa.b1.unit09.lesson01.teach.grammar_mishe_age:
    title: "Would it be all right if we postponed the meeting to tomorrow?"
    gloss: "Would it be all right if we postponed the meeting to tomorrow?"
    note: "*می‌شه اگه* + subjunctive verb + *؟* is the everyday softened-request pattern -- turning a direct request ('postpone the meeting') into a polite question. *رو* marks *جلسه* as the direct object being acted on."

  fa.b1.unit09.lesson02.teach.emkanesh_hast:
    title: "is it possible"
    gloss: "is it possible"
    note: "*امکانش هست که...؟* is a slightly more formal alternative to *می‌شه اگه...؟* -- both soften a request, and either is natural in a professional meeting."
    example_gloss: "Is it possible that you could help?"
  fa.b1.unit09.lesson02.teach.gozaresh:
    title: report
    gloss: report
    example_gloss: "The project report is ready."
  fa.b1.unit09.lesson02.teach.zudtar_beferestid:
    title: "you (formal) send earlier"
    gloss: "send earlier"
    note: "*بفرستید* is the formal/plural (شما) subjunctive of *فرستادن* (to send)."
    example_gloss: "Is it possible that you send the report earlier?"
  fa.b1.unit09.lesson02.teach.shoma:
    title: "you (formal/plural)"
    gloss: "you (formal/plural)"
    note: "*شما* marks the fully formal register this unit uses throughout -- a step up from unit05's mixed casual *تو* + formal-copula register."
    example_gloss: "Are you (formal) responsible for this project?"
  fa.b1.unit09.lesson02.teach.grammar_emkanesh_hast:
    title: "Is it possible that you send the report earlier?"
    gloss: "Is it possible that you send the report earlier?"
    note: "*امکانش هست که* + subjunctive + *؟* -- the *که* here introduces the actual request, similar in shape to unit04's reported-thought *که* and unit06's reported-speech *که*, but here softening a REQUEST rather than reporting a thought or an utterance."

  fa.b1.unit09.lesson03.teach.pishnahad_mikonam:
    title: "I suggest"
    gloss: "I suggest"
    note: "*پیشنهاد می‌کنم که...* -- a formal suggestion verb followed by a که-clause, distinct from unit04's *فکر می‌کنم که* (reporting a thought) and unit06's *گفت که* (reporting an utterance): this reports a SUGGESTION, the genuine target of this outcome."
    example_gloss: "I suggest that we decide earlier."
  fa.b1.unit09.lesson03.teach.in_hafte:
    title: "this week"
    gloss: "this week"
    example_gloss: "I suggest that we decide this week."
  fa.b1.unit09.lesson03.teach.tasmim_begirim:
    title: "we decide"
    gloss: "we decide"
    example_gloss: "I suggest that we decide this week."
  fa.b1.unit09.lesson03.teach.budje:
    title: budget
    gloss: budget
    example_gloss: "I suggest that we decide about the budget."
  fa.b1.unit09.lesson03.teach.grammar_formal_register_contrast:
    title: "I suggest that we decide this week. Are you (formal) responsible for this project?"
    gloss: "I suggest that we decide this week. Are you (formal) responsible for this project?"
    note: "This unit's شما-register throughout is the fully formal version of unit05's mixed register (تو + formal copula هستم/هستی, appropriate there for a casual status check between colleagues) -- a real workplace conversation shifts between these registers depending on how formal the setting is; this unit's meeting/written-message setting calls for the fuller شما form consistently."

  fa.b1.unit09.lesson04.teach.hossein:
    title: "Hossein (name)"
    gloss: "Hossein"
    example_gloss: "Hossein participated in the meeting."
