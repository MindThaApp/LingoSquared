    title: "you (formal) participated"
    gloss: "you (formal) participated"
    example_gloss: "Thank you for participating in the meeting."
  fa.b1.unit09.lesson04.teach.mamnun_ke:
    title: "thank you for"
    gloss: "thank you for"
    example_gloss: "Thank you for participating in the meeting."
  fa.b1.unit09.lesson04.teach.moshkeli_nist:
    title: "no problem"
    gloss: "no problem"
    example_gloss: "Yes, no problem."
  fa.b1.unit09.lesson04.teach.amade_mikonam:
    title: "I prepare"
    gloss: "I prepare"
    example_gloss: "I'll have the report ready by tomorrow."
  fa.b1.unit09.lesson04.teach.dialogue_sara_thanks:
    title: "Sara: Hossein, thank you for participating in the meeting. Is it possible that you send the project report earlier?"
    gloss: "Sara: Hossein, thank you for participating in the meeting. Is it possible that you send the project report earlier?"
  fa.b1.unit09.lesson04.teach.dialogue_hossein_agree:
    title: "Hossein: Yes, certainly. Would it be all right if we postponed the next meeting to Tuesday?"
    gloss: "Hossein: Yes, certainly. Would it be all right if we postponed the next meeting to Tuesday?"
  fa.b1.unit09.lesson04.teach.dialogue_sara_ok:
    title: "Sara: Yes, no problem. I suggest that we also decide about the budget this week."
    gloss: "Sara: Yes, no problem. I suggest that we also decide about the budget this week."
  fa.b1.unit09.lesson04.teach.dialogue_hossein_close:
    title: "Hossein: I agree. I'll have the report ready by tomorrow."
    gloss: "Hossein: I agree. I'll have the report ready by tomorrow."

  fa.b1.unit09.lesson05.teach.ba_salam:
    title: "greetings (formal opening)"
    gloss: "greetings (formal opening)"
    note: "*با سلام* opens a formal written message -- the standard professional-email equivalent of 'Dear...' or 'Hello,'."
    example_gloss: "Greetings, the meeting will be held tomorrow."
  fa.b1.unit09.lesson05.teach.bargozar_mishe:
    title: "is/will be held"
    gloss: "is/will be held"
    example_gloss: "The meeting will be held tomorrow."
  fa.b1.unit09.lesson05.teach.ba_tashakor:
    title: "with thanks (formal closing)"
    gloss: "with thanks (formal closing)"
    note: "*با تشکر* closes a formal written message -- the standard professional-email equivalent of 'Best regards,'."
    example_gloss: "With thanks, Sara."
  fa.b1.unit09.lesson05.teach.che_ruzie:
    title: "what day is it?"
    gloss: "what day is it?"
    example_gloss: "What day is the next meeting?"
  fa.b1.unit09.lesson05.teach.reading_passage:
    title: "Reading: A formal message"
    gloss: "Greetings. This week's meeting about the project was held. Hossein agreed to send the report earlier. We also decided that the next meeting will be Tuesday. If you have any questions, please say so. With thanks, Sara."

  fa.b1.unit09.lesson06.teach.grammar_review:
    title: "Would it be all right if we postponed the meeting to tomorrow? Is it possible that you send the report earlier? I suggest that we decide this week."
    gloss: "Would it be all right if we postponed the meeting to tomorrow? Is it possible that you send the report earlier? I suggest that we decide this week."
    note: "Review: two softened-request forms (*می‌شه اگه...؟*, *امکانش هست که...؟*) and one formal suggestion verb (*پیشنهاد می‌کنم که...*), all in this unit's consistent شما-register, plus the written با سلام/با تشکر message frame -- the three real skills this outcome asks for: soften a request, hold a meeting exchange, write a professional message."
  fa.b1.unit09.lesson06.teach.emruz:
    title: today
    gloss: today
    example_gloss: "We have a meeting today."

