teaching:
  fa.a2.unit31.lesson01.teach.polite_words:
    title: Polite opening words
    gloss: hello, excuse me, can/could (it be possible), please, thank you
    note: '*ببخشید* gets attention politely, and *لطفا* means “please.” *می‌شه* literally asks “is it possible?”'
    example_gloss: ['Hello, excuse me.', 'Thank you, please.']
  fa.a2.unit31.lesson01.teach.things:
    title: Things you ask for
    gloss: door, window, water, glass, bread, (object marker), a
    note: '*رو* marks a definite spoken object: *در رو*, *پنجره رو*. *یه* is the spoken “a”.'
    example_gloss: [A glass of water., A loaf of bread., The door and the window.]
  fa.a2.unit31.lesson01.teach.request_verbs:
    title: Polite request verbs
    gloss: close, open, bring, give, help
    note: 'These are polite plural forms ending in *-ید*. They are the forms you use with neighbours, shopkeepers, and other strangers.'
    example_gloss: [Close the door., Open the window., Bring a glass of water., Help me.]
  fa.a2.unit31.lesson01.teach.mishe_subjunctive:
    title: 'می‌شه + subjunctive'
    gloss: Could you close the door? Could you help me?
    note: 'To ask politely, say *می‌شه* and then a subjunctive verb with *ب-*: *می‌شه در رو ببندید؟* With a compound verb the light verb changes: *می‌شه کمکم کنید؟*, *می‌شه پنجره رو باز کنید؟* The object comes before the verb.'
  fa.a2.unit31.lesson02.teach.offer_words:
    title: Offering help
    gloss: Do you want help? Let me ...
    note: '*کمک می‌خواید؟* asks whether someone wants help. *بذارید من ...* means “let me ...” and is followed by an *I* verb: *بیارم*, *بخرم*, *ببندم*, *کنم*.'
    example_gloss: ['Do you want help?', 'Let me bring water.', 'Let me buy bread.', 'Let me close the door.', 'Let me help you.', 'Could you buy bread?']
  fa.a2.unit31.lesson02.teach.reply_words:
    title: Accepting and declining
    gloss: yes, no, of course, myself, I do (it), you are welcome
    note: '*بله، لطفا* accepts an offer. *نه، ممنون* declines it, and *خودم انجام می‌دم* adds “I will do it myself.” *خواهش می‌کنم* answers thanks.'
    example_gloss: ['Yes, please.', 'No, thank you, I will do it myself.', 'You are welcome.']
  fa.a2.unit31.lesson02.teach.offer_pattern:
    title: 'Request versus offer: you or I'
    gloss: Let me close the door.
    note: 'A request with *می‌شه* uses the *you* ending (*ببندید*) because you ask the other person. An offer with *بذارید من* uses the *I* ending (*ببندم*) because you will do the action. Compare *می‌شه در رو ببندید؟* with *بذارید من در رو ببندم*.'
  fa.a2.unit31.lesson02.teach.reply_pattern:
    title: A polite reply has two parts
    gloss: Yes, please. No, thank you, I will do it myself.
    note: 'Accept with *بله* plus *لطفا*. Decline with *نه، ممنون*, and add *خودم انجام می‌دم* when you want to say that you will manage it yourself.'
  fa.a2.unit31.lesson03.teach.positive_imperatives:
    title: Positive commands
    gloss: go, come, do; go (polite), do (polite)
    note: 'A friend gets the short form: *برو*, *بیا*, *بکن*. Strangers and groups get the *-ید* form: *برید*, *بکنید*.'
    example_gloss: [Go there., Come here., Do this., Go there (polite).]
  fa.a2.unit31.lesson03.teach.negative_imperatives:
    title: Negative commands
    gloss: do not go, do not come, do not do; do not go, do not do (polite); do not touch (polite)
    note: 'Replace the *ب-* with *نـ*: *برو* becomes *نرو*, *بکن* becomes *نکن*, *بیا* becomes *نیا*. Polite forms are *نرید*, *نکنید*, and the set phrase *دست نزنید* (do not touch).'
    example_gloss: [Do not go there., Do not come here., Do not do this., Do not go there (polite)., Do not do this (polite)., Do not touch (polite).]
  fa.a2.unit31.lesson03.teach.negative_rule:
    title: نـ replaces ب-
    gloss: go / do not go, come / do not come, do / do not do
    note: 'The positive command starts with *ب-* and the negative command starts with *نـ*. *بیا* and *نیا* work the same way: they differ only in the first letter. Only the negative changes the meaning to “do not”.'
  fa.a2.unit31.lesson03.teach.polite_plural:
    title: Friend or polite plural
    gloss: do not go (friend / polite), do not do (friend / polite), do not touch (polite)
    note: 'Add *-ید* for a stranger or for more than one person: *نرو* becomes *نرید*, and *نکن* becomes *نکنید*. Signs and shopkeepers use the *-ید* forms: *لطفا دست نزنید*.'
  fa.a2.unit31.lesson04.teach.places_people:
    title: Neighbours and shops
    gloss: neighbour, shop, shopkeeper, bag, tea
    note: '*کیفم* means “my bag”; the ending *-م* means “my”. *تو مغازه* means “in the shop”.'
    example_gloss: ['Excuse me, could you give me a tea?', 'Excuse me, could you give me my bag?', 'Hello, neighbour, do you want help?', 'Do not touch anything in the shop.']
  fa.a2.unit31.lesson04.teach.shop_request:
    title: A polite request in a shop
    gloss: Excuse me, could you give me a tea? Thank you.
    note: 'Open with *ببخشید*, ask with *می‌شه* and a polite verb, and close with *ممنون*.'
  fa.a2.unit31.lesson05.teach.reading:
    title: A note for a neighbour
    gloss: Hello, excuse me. Could you buy a loaf of bread today? I am not at home. Please close the door and do not touch my bag. Thank you.
    note: 'Read once for the request, then again for the instruction not to touch the bag.'
  fa.a2.unit31.lesson06.teach.turn01: {title: Sara asks for help, gloss: 'Sara: Excuse me, could you help me?', note: A polite request with *می‌شه* and the *you* ending.}
  fa.a2.unit31.lesson06.teach.turn02: {title: The neighbour agrees, gloss: 'Neighbour: Yes, of course. What shall I do?', note: '*چیکار کنم؟* asks what to do.'}
  fa.a2.unit31.lesson06.teach.turn03: {title: A specific request, gloss: 'Sara: Could you open the door?', note: 'The object *در رو* comes before the polite verb.'}
  fa.a2.unit31.lesson06.teach.turn04: {title: The neighbour offers more, gloss: 'Neighbour: Yes. Let me carry your bag.', note: '*بذارید من ... ببرم* uses the *I* ending.'}
  fa.a2.unit31.lesson06.teach.turn05: {title: Sara declines, gloss: 'Sara: No, thank you, I will do it myself.', note: 'A polite decline: thanks, and she will do it herself.'}
  fa.a2.unit31.lesson06.teach.turn06: {title: The neighbour answers, gloss: 'Neighbour: You are welcome.', note: '*خواهش می‌کنم* is the standard reply to thanks.'}
exercises:
  fa.a2.unit31.lesson01.exercise01.recognize_close_door:
    instruction: What does this polite question mean?
    correct_option: Could you close the door?
    distractors: ['Could you open the door?', 'I closed the door.', 'Let me close the door.']
    accepted_answers: [{value: 'Could you close the door?', status: correct}]
