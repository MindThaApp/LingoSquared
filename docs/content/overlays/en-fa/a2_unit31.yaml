  fa.a2.unit31.lesson01.exercise03.match_request_words:
    instruction: Match each Farsi item with its distinct meaning.
    accepted_answers:
    - value: {ببندید: close (polite), باز کنید: open (polite), بیارید: bring (polite), بدید: give (polite), کمک کنید: help (polite), در: door, پنجره: window, آب: water}
      status: correct
    feedback: These are the polite request verbs and the objects they go with.
  fa.a2.unit31.lesson01.exercise04.order_close_door:
    instruction: 'Arrange the words to say: Could you close the door?'
    accepted_answers: [{value: [می‌شه, در, رو, ببندید], status: correct}]
    feedback: '*می‌شه در رو ببندید* puts the object before the verb.'
