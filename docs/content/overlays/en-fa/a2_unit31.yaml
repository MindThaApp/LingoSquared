    - {value: می‌شه پنجره رو باز کنید, status: correct}
    - {value: 'ببخشید، می‌شه پنجره رو باز کنید؟', status: acceptable_with_note, note: '*ببخشید* is a natural polite opener but was not asked for here.'}
    feedback: 'Model: *می‌شه پنجره رو باز کنید؟*'
