teaching:
  fa.a2.unit29.lesson01.teach.places:
    title: Rules and places
    gloss: rules, house rules, library, pool, gym
    note: '*قانون* is a rule. A house, a library, a pool and a gym all have *قانون‌ها* (rules).'
    example_gloss:
    - The library has rules.
    - The pool and the gym have rules too.
    - A house has rules too.
  fa.a2.unit29.lesson01.teach.must:
    title: 'باید: something is required'
    gloss: you must go; you must take a shower; you must bring a card
    note: '*باید* + subjunctive = “must / have to.” The verb comes after *باید* in its subjunctive form (*بری*, *بگیری*, *بیاری*), with no *می‌*.'
  fa.a2.unit29.lesson01.teach.must_not:
    title: 'نباید: something is forbidden'
    gloss: you must not eat food; you must not shout
    note: '*نباید* + subjunctive = “must not.” It says the action is forbidden. The verb after it is positive: *بخوری*, *بزنی*.'
  fa.a2.unit29.lesson01.teach.not_needed:
    title: 'لازم نیست: it is not necessary'
    gloss: you do not need to come; you do not need to pay
    note: '*لازم نیست* + subjunctive = “you do not need to.” The action is optional, not forbidden.'
  fa.a2.unit29.lesson02.teach.rule_phrases:
    title: Rule phrases
    gloss: be quiet, return the book, bring a towel, wear sports shoes, run
    note: Each phrase is a subjunctive ending in *-ی* for a friend (“you”). Use it after *باید* or *نباید*.
    example_gloss:
    - You must be quiet.
    - You must return the book.
    - You must wear sports shoes.
  fa.a2.unit29.lesson02.teach.where:
    title: Where and when a rule applies
    gloss: in the library, in the pool, in the gym, before the pool
    note: '*توی* means “in” and *قبل از* means “before.” They usually come at the start of the rule.'
    example_gloss:
    - In the library you must be quiet.
    - Before the pool you must take a shower.
    - In the gym you must wear sports shoes.
  fa.a2.unit29.lesson02.teach.polite:
    title: 'Strangers and notices: the شما ending'
    gloss: you must be quiet (polite or plural); you must shower (polite or plural)
    note: 'To strangers, officials, or several people, the ending changes from *-ی* to *-ید*: *باشی* becomes *باشید*, *بگیری* becomes *بگیرید*. Notices use this form.'
  fa.a2.unit29.lesson02.teach.no_mi:
    title: No می‌ after باید
    gloss: you must go; you must not go
    note: After *باید*, *نباید* and *لازم نیست* the verb is the plain subjunctive (*بری*), not the present form with *می‌*.
  fa.a2.unit29.lesson03.teach.contrast:
    title: نباید is not لازم نیست
    gloss: you must not come; you do not need to come
    note: English “do not have to” and “must not” are different. *نباید بیای* = coming is forbidden. *لازم نیست بیای* = you may come, but you do not have to.
  fa.a2.unit29.lesson03.teach.notice_form:
    title: 'Notices: ممنوعه'
    gloss: eating is forbidden; running is forbidden
    note: 'Signs and notices often name the action and add *ممنوعه* (“forbidden”): *غذا خوردن ممنوعه*. To a friend you say *نباید غذا بخوری*.'
  fa.a2.unit29.lesson03.teach.extra_rules:
    title: Two more rules
    gloss: buy a ticket, wash the dishes
    note: 'These phrases follow *لازم نیست* in the exercises: you may do it, but it is not required.'
    example_gloss:
    - You do not need to buy a ticket.
    - You do not need to wash the dishes.
    - You must not eat in the pool.
  fa.a2.unit29.lesson04.teach.permission:
    title: Asking permission
    gloss: Can I come in? Is it OK if I sit here?
    note: '*می‌تونم* + subjunctive asks “Can I?” (*می‌تونم بیام؟*). *مشکلی نداره* + subjunctive asks “Is it OK if…?” (*مشکلی نداره بشینم؟*).'
  fa.a2.unit29.lesson04.teach.answers:
    title: Answering a permission question
    gloss: Yes, you can. No, you cannot. Yes, no problem. No, it is forbidden.
    note: Say yes with *آره، می‌تونی* or *آره، مشکلی نداره*. Say no with *نه، نمی‌تونی* or *نه، ممنوعه*.
  fa.a2.unit29.lesson04.teach.ejaze:
    title: Another polite question
    gloss: May I come in?
    note: '*اجازه هست؟* is a polite way to ask whether you may do something. In this unit you only need to recognize it.'
  fa.a2.unit29.lesson04.teach.house:
    title: 'House rules: sorting waste'
    gloss: sort the waste, throw the plastic in the paper bin
    note: '*زباله رو جدا کردن* is to sort waste. The rule says plastic does not go in the paper bin.'
    example_gloss:
    - You must sort the waste.
    - You must not throw the plastic in the paper bin.
  fa.a2.unit29.lesson04.teach.night:
    title: A quiet-hours rule
    gloss: At night you must not talk loudly
    note: '*بلند حرف زدن* is to talk loudly. *شب* (at night) comes first.'
    example_gloss:
    - At night you must not talk loudly.
  fa.a2.unit29.lesson05.teach.notice:
    title: A notice of rules
    gloss: Rules. In the library you must be quiet. Eating is forbidden. Before the pool you must take a shower. Running in the pool is forbidden. In the gym you must wear sports shoes, but you do not need to bring a towel. You must sort the waste.
    note: A notice speaks to strangers, so it uses the *-ید* ending. Read once for what is required, forbidden, and optional.
  fa.a2.unit29.lesson06.teach.turn01:
    title: Sara asks permission
    gloss: Sara asks whether she may come to the pool too.
    note: '*مشکلی نداره* + subjunctive asks permission.'
  fa.a2.unit29.lesson06.teach.turn02:
    title: Permission and a requirement
    gloss: Nima says yes, and that she must shower first.
    note: The answer allows it, then adds an obligation.
  fa.a2.unit29.lesson06.teach.turn03:
    title: Sara asks what is required
    gloss: Sara asks whether she must bring a towel.
    note: '*باید* + *بیارم* asks about an obligation.'
  fa.a2.unit29.lesson06.teach.turn04:
    title: Optional and forbidden
    gloss: Nima says she need not bring a towel, but must not run in the pool.
    note: '*لازم نیست* is optional; *نباید* is forbidden.'
  fa.a2.unit29.lesson06.teach.turn05:
    title: A second question
    gloss: Sara asks whether she can come to the gym afterwards.
    note: '*می‌تونم* + subjunctive asks “Can I?”'
  fa.a2.unit29.lesson06.teach.turn06:
    title: A final rule
    gloss: Nima says yes, but she must wear sports shoes.
    note: 'Again: permission first, then the rule.'
