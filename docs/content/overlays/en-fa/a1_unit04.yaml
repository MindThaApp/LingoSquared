  description: >-
    Beginner Iranian Farsi focused on reading the script, understanding
    everyday speech, and handling practical conversations politely.

units:
  fa.a1.unit04.family:
    title: Family

lessons:
  fa.a1.unit04.lesson01.immediate_family: {title: "Immediate family"}
  fa.a1.unit04.lesson02.describing_own_family: {title: "Describe your own family"}
  fa.a1.unit04.lesson03.extended_family: {title: "Extended family"}
  fa.a1.unit04.lesson04.asking_about_family: {title: "Ask about someone's family"}
  fa.a1.unit04.lesson05.marriage_and_inlaws: {title: "Marriage and grandchildren"}
  fa.a1.unit04.lesson06.family_photo_dialogue: {title: "A family photo"}

teaching:
  fa.a1.unit04.lesson01.teach.madar:
    title: "Mother"
    gloss: "mother"
    note: "مادر is the neutral written/formal word for mother."
    example_gloss: "My mother is kind."
  fa.a1.unit04.lesson01.teach.maman:
    title: "Mom"
    gloss: "mom"
    note: "مامان is the everyday spoken word most families actually use."
    example_gloss: "Mom, I'm hungry."
  fa.a1.unit04.lesson01.teach.pedar:
    title: "Father"
    gloss: "father"
    note: "پدر is the neutral written/formal word for father."
    example_gloss: "My father is a doctor."
  fa.a1.unit04.lesson01.teach.baba:
    title: "Dad"
    gloss: "dad"
    note: "بابا is the everyday spoken word most families actually use."
    example_gloss: "Dad, where are you?"
  fa.a1.unit04.lesson01.teach.baradar:
    title: "Brother"
    gloss: "brother"
    note: "برادر; the spoken/affectionate form داداش appears later in this unit."
    example_gloss: "I have one brother."
  fa.a1.unit04.lesson01.teach.khahar:
    title: "Sister"
    gloss: "sister"
    note: "خواهر, the standard word for sister."
    example_gloss: "My sister is a student."
  fa.a1.unit04.lesson01.teach.register_note:
    title: "Formal vs. everyday words"
    gloss: "Mom and dad are like mother and father, but more casual."
    note: "Persian has two real registers for parents, not a strict formal/informal split -- مامان/بابا are what most people actually call their own parents, even in polite company."

  fa.a1.unit04.lesson02.teach.daram:
    title: "I have"
    gloss: "I have"
    note: "*دارم* is the first-person form of *داشتن* ('to have') -- the core verb for describing family."
  fa.a1.unit04.lesson02.teach.yek:
    title: "One"
    gloss: "one"
    note: "یک, used before a counted noun, e.g. یک برادر (one brother)."
    example_gloss: "I have one sister."
  fa.a1.unit04.lesson02.teach.one_brother:
    title: "I have one brother."
    gloss: "I have one brother."
    note: "Word order: subject, quantity+noun, verb -- typical Persian SOV order."
  fa.a1.unit04.lesson02.teach.no_sister:
    title: "I don't have a sister."
    gloss: "I don't have a sister."
    note: "ندارم is the negative of دارم; no separate word for 'a' is needed."
  fa.a1.unit04.lesson02.teach.family_big:
    title: "My family is big."
    gloss: "My family is big."
    note: "بزرگه is spoken-register 'بزرگ است' (is big) contracted."
  fa.a1.unit04.lesson02.teach.family_small:
    title: "Our family is small."
    gloss: "Our family is small."
    note: "کوچیکه is spoken-register 'کوچک است' (is small) contracted, with the colloquial pronunciation کوچیک instead of written کوچک."

  fa.a1.unit04.lesson03.teach.pedarbozorg:
    title: "Grandfather"
    gloss: "grandfather"
    note: "پدربزرگ, literally 'big father' -- used for either side of the family."
    example_gloss: "My grandfather is old."
  fa.a1.unit04.lesson03.teach.madarbozorg:
    title: "Grandmother"
    gloss: "grandmother"
    note: "مادربزرگ, literally 'big mother' -- used for either side of the family."
    example_gloss: "My grandmother is kind."
  fa.a1.unit04.lesson03.teach.amoo:
    title: "Paternal uncle"
    gloss: "uncle (father's brother)"
    note: "عمو specifically means father's brother, not a general 'uncle' word."
    example_gloss: "My uncle lives in Tehran."
  fa.a1.unit04.lesson03.teach.amme:
    title: "Paternal aunt"
    gloss: "aunt (father's sister)"
    note: "عمه specifically means father's sister."
    example_gloss: "My aunt is a teacher."
  fa.a1.unit04.lesson03.teach.dayi:
    title: "Maternal uncle"
    gloss: "uncle (mother's brother)"
    note: "دایی specifically means mother's brother -- Persian distinguishes which side of the family every aunt/uncle is from, unlike English."
    example_gloss: "My (maternal) uncle is an engineer."
  fa.a1.unit04.lesson03.teach.khale:
    title: "Maternal aunt"
    gloss: "aunt (mother's sister)"
    note: "خاله specifically means mother's sister."
    example_gloss: "My (maternal) aunt lives in Isfahan."
  fa.a1.unit04.lesson03.teach.register_note:
    title: "Father's side vs. mother's side"
    gloss: "Uncle and aunt (paternal) are on the father's side; uncle and aunt (maternal) are on the mother's side."
    note: "This four-way split (عمو/عمه vs. دایی/خاله) has no single-word English equivalent -- English just says 'uncle'/'aunt' for both sides."

  fa.a1.unit04.lesson04.teach.chand_ta:
    title: "How many"
    gloss: "how many"
    note: "چند تا, used before counting people or things informally."
    example_gloss: "How many sisters do you have?"
  fa.a1.unit04.lesson04.teach.polite_question:
    title: "How many siblings do you have? (polite)"
    gloss: "How many siblings do you have?"
    note: "دارید is the polite/plural form of 'to have', matching شما."
  fa.a1.unit04.lesson04.teach.spoken_question:
    title: "How many siblings do you have? (informal)"
    gloss: "How many siblings do you have?"
    note: "داری is the informal singular form, used with a peer or someone younger."
  fa.a1.unit04.lesson04.teach.family_size_question:
    title: "How many people are in your family?"
    gloss: "How many people are in your family?"
    note: "نفر is the counter word for people; نفرن is spoken-register 'نفر هستند' (are ... people) contracted."
  fa.a1.unit04.lesson04.teach.answer_example:
    title: "We're four: me, my mom, my dad, and my brother."
    gloss: "We're four: me, my mom, my dad, and my brother."
    note: "نفریم = 'نفر هستیم' (we are ... people) contracted, spoken register."

  fa.a1.unit04.lesson05.teach.showhar:
    title: "Husband"
    gloss: "husband"
    note: "شوهر, the standard word for husband."
    example_gloss: "My husband is an engineer."
  fa.a1.unit04.lesson05.teach.zan:
    title: "Wife"
    gloss: "wife"
    note: "زن also means 'woman' generally; context makes the meaning clear."
    example_gloss: "My wife is a teacher."
  fa.a1.unit04.lesson05.teach.motahel:
    title: "Married"
    gloss: "married"
    note: "متأهل, a neutral, commonly used adjective for marital status."
    example_gloss: "He/she is married."
  fa.a1.unit04.lesson05.teach.mojarad:
    title: "Single"
    gloss: "single (unmarried)"
    note: "مجرد, the standard word for unmarried."
    example_gloss: "I am single."
  fa.a1.unit04.lesson05.teach.i_am_single:
    title: "I'm single."
    gloss: "I'm single."
    note: "مجردم = مجرد + م ('I am'), the same first-person suffix pattern as خوبم ('I'm good')."
  fa.a1.unit04.lesson05.teach.i_am_married:
    title: "I'm married."
    gloss: "I'm married."
    note: "متأهلم = متأهل + م ('I am'), same pattern as مجردم."
  fa.a1.unit04.lesson05.teach.nave:
    title: "Grandchild"
    gloss: "grandchild"
    note: "نوه covers grandson or granddaughter -- Persian doesn't require specifying gender here."
    example_gloss: "He/she has one grandchild."
  fa.a1.unit04.lesson05.teach.example:
    title: "My brother is married; he has one son."
    gloss: "My brother is married; he has one son."
    note: "متأهله = 'متأهل است' (is married) contracted, spoken register; داره = 'دارد' (has) spoken register."

  fa.a1.unit04.lesson06.teach.in_photo:
    title: "Is this your family photo?"
    gloss: "Is this your family photo?"
    note: "خانواده‌ته = 'خانواده‌ی تو است' (is your family['s]) contracted -- very common spoken pattern."
  fa.a1.unit04.lesson06.teach.yes_mom_dad:
    title: "Yeah. This is my mom, this is my dad."
    gloss: "Yeah. This is my mom, this is my dad."
    note: "*آره* is spoken 'yes' (vs. formal *بله*). *مامانمه* is *مامانم* ('my mom') plus the spoken 'is' ending."
  fa.a1.unit04.lesson06.teach.who_is_he:
    title: "Who's this man?"
    gloss: "Who's this man?"
    note: "کیه = 'کی است' (who is) contracted, spoken register."
  fa.a1.unit04.lesson06.teach.brother_answer:
    title: "That's my brother. I have one brother, no sister."
    gloss: "That's my brother. I have one brother, no sister."
    note: "داداش is the affectionate/everyday word for brother, used here instead of the more neutral برادر from lesson 1."
  fa.a1.unit04.lesson06.teach.opposite_family:
    title: "My family's the opposite; I have two sisters, no brother."
    gloss: "My family's the opposite; I have two sisters, no brother."
    note: "برعکسه = 'برعکس است' (is the opposite) contracted."
  fa.a1.unit04.lesson06.teach.closing:
    title: "So your family's lively too!"
    gloss: "So your family's lively too!"
    note: "شلوغه = 'شلوغ است' (is crowded/lively) contracted -- a warm, common way to describe a family with several kids."
  fa.a1.unit04.lesson06.teach.formal_register_note:
    title: "Formal register: has / doesn't have / is"
    gloss: "Spoken: has, doesn't have. Formal written: has, doesn't have; he is my brother."
    note: "دارد/ندارد/است are the formal-written counterparts of the spoken داره/نداره forms used throughout this dialogue -- note that formal writing also swaps the affectionate داداش for the neutral برادر."

exercises:
  fa.a1.unit04.lesson01.exercise01.recognize_madar:
    instruction: "Choose the meaning of the word."
    correct_option: "mother"
    distractors: ["father", "brother", "sister"]
    accepted_answers: [{value: "mother", status: correct}]
    feedback: "مادر means mother."
  fa.a1.unit04.lesson01.exercise02.recognize_pedar:
    instruction: "Choose the meaning of the word."
    correct_option: "father"
    distractors: ["mother", "brother", "sister"]
    accepted_answers: [{value: "father", status: correct}]
    feedback: "پدر means father."
  fa.a1.unit04.lesson01.exercise03.recognize_baradar:
    instruction: "Choose the meaning of the word."
    correct_option: "brother"
    distractors: ["sister", "mother", "father"]
    accepted_answers: [{value: "brother", status: correct}]
    feedback: "برادر means brother."
  fa.a1.unit04.lesson01.exercise04.match_formal_informal:
    instruction: "Match each formal word to its everyday equivalent."
    accepted_answers:
      - value: {مادر: مامان, پدر: بابا}
        status: correct
    feedback: "مادر/مامان both mean mother; پدر/بابا both mean father."
  fa.a1.unit04.lesson01.exercise05.recognize_madar_pedar_reading:
    instruction: "What does this pair of words mean?"
    correct_option: "mother, father"
    distractors: ["brother, sister", "yes, no", "big, small"]
    accepted_answers: [{value: "mother, father", status: correct}]
    feedback: "مادر، پدر means mother, father."
  fa.a1.unit04.lesson01.exercise05b.recognize_khahar:
    instruction: "Choose the meaning of the word."
    correct_option: "sister"
    distractors: ["brother", "mother", "father"]
    accepted_answers: [{value: "sister", status: correct}]
    feedback: "خواهر means sister."
  fa.a1.unit04.lesson01.exercise06.order_khahar:
    instruction: "Put the words in order: sister, brother."
    accepted_answers: [{value: [خواهر, برادر], status: correct}]
    feedback: "خواهر برادر."
  fa.a1.unit04.lesson01.exercise07.translate_baradar_khahar:
    instruction: "Translate into Farsi: brother, sister."
    accepted_answers:
      - {value: "برادر خواهر", status: correct}
      - {value: "برادر، خواهر", status: correct}
      - {value: "برادر و خواهر", status: correct}
  fa.a1.unit04.lesson01.exercise08.write_khahar:
    instruction: "Copy this word."
    accepted_answers: [{value: "خواهر", status: correct}]
    feedback: "خواهر means sister."

  fa.a1.unit04.lesson02.exercise01.daram_meaning:
    instruction: "Choose the meaning of the word."
    correct_option: "I have"
    distractors: ["I don't have", "I am", "I want"]
    accepted_answers: [{value: "I have", status: correct}]
    feedback: "دارم means I have."
  fa.a1.unit04.lesson02.exercise02.choose_one_brother:
    instruction: "Which sentence says 'I have one brother'?"
    correct_option: "من یک برادر دارم."
    distractors: ["خواهر ندارم.", "خانواده‌ی من بزرگه.", "من یک خواهر دارم."]
    accepted_answers: [{value: "من یک برادر دارم.", status: correct}]
    feedback: "من یک برادر دارم means 'I have one brother.'"
  fa.a1.unit04.lesson02.exercise03.order_one_brother:
    instruction: "Put the words in order."
    accepted_answers: [{value: [من, یک, برادر, دارم], status: correct}]
    feedback: "Word order: من یک برادر دارم."
  fa.a1.unit04.lesson02.exercise04.translate_one_brother:
    instruction: "Translate into Farsi: I have one brother."
    accepted_answers:
      - {value: "من یک برادر دارم", status: correct}
      - {value: "من یک برادر دارم.", status: correct}
  fa.a1.unit04.lesson02.exercise05.order_no_sister:
    instruction: "Put the words in order: 'I don't have a sister.'"
    accepted_answers: [{value: [خواهر, ندارم], status: correct}]
    feedback: "خواهر ندارم."
  fa.a1.unit04.lesson02.exercise06.family_big_meaning:
    instruction: "Choose the meaning of the sentence."
    correct_option: "My family is big."
    distractors: ["My family is small.", "I have one brother.", "My mom and dad are here."]
    accepted_answers: [{value: "My family is big.", status: correct}]
    feedback: "خانواده‌ی من بزرگه means 'My family is big.'"
  fa.a1.unit04.lesson02.exercise07.speak_own_family:
    instruction: "Answer in Farsi: say you have one sister and no brother."
    accepted_answers:
      - {value: "یک خواهر دارم", status: correct}
      - {value: "یک خواهر دارم برادر ندارم", status: correct}
      - {value: "من یک خواهر دارم، برادر ندارم.", status: correct}
      - {value: "من یک خواهر دارم برادر ندارم", status: correct}
      - {value: "من یک خواهر دارم، برادر ندارم", status: correct}
      - {value: "یک خواهر دارم، برادر ندارم", status: correct}
      - {value: "یک خواهر دارم، برادر ندارم.", status: correct}
      - {value: "من یک خواهر دارم و برادر ندارم", status: correct}
      - {value: "یک خواهر دارم و برادر ندارم", status: correct}
    feedback: "یک خواهر دارم، برادر ندارم is a complete, natural answer."
  fa.a1.unit04.lesson02.exercise08.write_own_family:
    instruction: "Describe whether your family is big or small in Farsi."
    accepted_answers:
      - {value: "خانواده‌ی من بزرگه", status: correct}
      - {value: "خانواده‌ی من بزرگه.", status: correct}
      - {value: "خانواده‌ی ما کوچیکه", status: correct}
      - {value: "خانواده‌ی ما کوچیکه.", status: correct}
      - {value: "خانواده‌ی ما بزرگه", status: correct}
      - {value: "خانواده‌ی ما بزرگه.", status: correct}
      - {value: "خانواده‌ی من کوچیکه", status: correct}
      - {value: "خانواده‌ی من کوچیکه.", status: correct}
    feedback: "Both خانواده‌ی من بزرگه and خانواده‌ی ما کوچیکه are natural answers."

  fa.a1.unit04.lesson03.exercise01.recognize_pedarbozorg:
    instruction: "Choose the meaning of the word."
    correct_option: "grandfather"
    distractors: ["grandmother", "father", "uncle"]
    accepted_answers: [{value: "grandfather", status: correct}]
    feedback: "پدربزرگ means grandfather."
  fa.a1.unit04.lesson03.exercise02.recognize_madarbozorg:
    instruction: "Choose the meaning of the word."
    correct_option: "grandmother"
    distractors: ["grandfather", "mother", "aunt"]
    accepted_answers: [{value: "grandmother", status: correct}]
    feedback: "مادربزرگ means grandmother."
  fa.a1.unit04.lesson03.exercise02b.recognize_aunts_uncles_reading:
    instruction: "What does this set of words mean?"
    correct_option: "paternal uncle, paternal aunt, maternal uncle, maternal aunt"
    distractors: ["grandfather, grandmother", "husband, wife", "brother, sister"]
    accepted_answers: [{value: "paternal uncle, paternal aunt, maternal uncle, maternal aunt", status: correct}]
    feedback: "عمو، عمه، دایی، خاله means paternal uncle, paternal aunt, maternal uncle, maternal aunt."
  fa.a1.unit04.lesson03.exercise03.match_paternal:
    instruction: "Match each word to its meaning."
    accepted_answers:
      - value: {عمو: "paternal uncle", عمه: "paternal aunt", دایی: "maternal uncle", خاله: "maternal aunt", پدربزرگ: grandfather, مادربزرگ: grandmother}
        status: correct
    feedback: "عمو/عمه are your father's side; دایی/خاله are your mother's side; پدربزرگ/مادربزرگ are your grandparents."
  fa.a1.unit04.lesson03.exercise05.recognize_grandparents_reading:
    instruction: "What does this pair of words mean?"
    correct_option: "grandfather, grandmother"
    distractors: ["uncle, aunt", "brother, sister", "husband, wife"]
    accepted_answers: [{value: "grandfather, grandmother", status: correct}]
    feedback: "پدربزرگ، مادربزرگ means grandfather, grandmother."
  fa.a1.unit04.lesson03.exercise06.order_aunts_uncles:
    instruction: "Put the words in order: paternal uncle, paternal aunt, maternal uncle, maternal aunt."
    accepted_answers: [{value: [عمو, عمه, دایی, خاله], status: correct}]
    feedback: "عمو، عمه، دایی، خاله."
  fa.a1.unit04.lesson03.exercise07.translate_aunts_uncles:
    instruction: "Translate into Farsi: paternal uncle, paternal aunt, maternal uncle, maternal aunt."
    accepted_answers:
      - {value: "عمو عمه دایی خاله", status: correct}
      - {value: "عمو، عمه، دایی، خاله", status: correct}
  fa.a1.unit04.lesson03.exercise08.side_check:
    instruction: "Which side of the family are عمو and عمه on?"
    accepted_answers:
      - {value: "پدر", status: correct}
      - {value: "طرف پدر", status: correct}
      - {value: "پدرن", status: acceptable_with_note, note: "Correct, using the spoken contraction of 'طرف پدر هستند'."}
      - {value: "طرف پدرن", status: correct}
      - {value: "عمو و عمه طرف پدرن", status: correct}
    feedback: "عمو and عمه are on your father's side; دایی and خاله are on your mother's side."

  fa.a1.unit04.lesson04.exercise01.recognize_polite_question_reading:
    instruction: "What is this question asking?"
    correct_option: "How many siblings do you have? (polite)"
    distractors: ["What's your name?", "How are you?", "Where are you from?"]
    accepted_answers: [{value: "How many siblings do you have? (polite)", status: correct}]
