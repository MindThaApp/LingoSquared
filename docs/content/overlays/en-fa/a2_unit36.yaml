    instruction: What does this sentence mean?
    correct_option: I went to the bank in order to get money.
    distractors: [I went to the bank because I had money., I went to the post office to send money., I will go to the bank to get money.]
    accepted_answers: [{value: I went to the bank in order to get money., status: correct}]
    feedback: '*برای اینکه پول بگیرم* gives the goal of going to the bank.'
  fa.a2.unit36.lesson01.exercise02.recognize_post_purpose:
    instruction: What does this sentence mean?
    correct_option: I went to the post office to send a parcel.
    distractors: [I went to the bank to send a parcel., I went to the post office to get a parcel., I went to the market to buy a parcel.]
    accepted_answers: [{value: I went to the post office to send a parcel., status: correct}]
    feedback: '*تا یه بسته بفرستم* is the goal: to send a parcel.'
