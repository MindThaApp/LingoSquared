    distractors: [The speaker goes to class because English is easy., The speaker learned English at the bank., The speaker goes to the market to buy a book.]
    accepted_answers: [{value: The speaker goes to class to learn English., status: correct}]
    feedback: 'The audio says *کلاس می‌رم برای اینکه انگلیسی یاد بگیرم*.'
  fa.a2.unit36.lesson05.exercise06.listen_saving_purpose:
    instruction: Listen without a transcript. What does the speaker say?
    correct_option: The speaker saves money to buy a car.
    distractors: [The speaker saved money because a car was cheap., The speaker bought a car with money from the bank., The speaker goes to the market for shopping.]
    accepted_answers: [{value: The speaker saves money to buy a car., status: correct}]
    feedback: 'The audio says *پول جمع می‌کنم تا ماشین بخرم*.'
  fa.a2.unit36.lesson05.exercise07.dictation_post_noun:
    instruction: Listen and type the Farsi sentence exactly.
    correct_response: رفتم پست برای فرستادن یه نامه
    orthography_strict: true
    feedback: 'After *برای*, the verbal noun *فرستادن* gives the purpose.'
  fa.a2.unit36.lesson06.exercise01.comprehend_late_reason:
    instruction: Why was Nima late?
    correct_option: The bank was crowded.
    distractors: [He went to the market., He forgot the parcel., He was learning English.]
    accepted_answers: [{value: The bank was crowded., status: correct}]
    feedback: 'Nima gives a reason with *چون*: *چون بانک شلوغ بود*.'
  fa.a2.unit36.lesson06.exercise02.comprehend_bank_purpose:
    instruction: What did Nima go to the bank for?
    correct_option: To get money.
    distractors: [To send a parcel., To meet Sara., To learn English.]
    accepted_answers: [{value: To get money., status: correct}]
    feedback: 'Nima says *رفتم بانک تا پول بگیرم*.'
  fa.a2.unit36.lesson06.exercise03.match_dialogue_lines:
    instruction: Match each Farsi item with its meaning.
    accepted_answers:
    - value: {چرا دیر اومدی: Why did you come late, چون بانک شلوغ بود: because the bank was crowded, برای چی رفتی بانک: What did you go to the bank for, رفتم بانک تا پول بگیرم: I went to the bank to get money, برای فرستادن یه بسته: for sending a parcel, پول جمع می‌کنم تا ماشین بخرم: I save money to buy a car}
      status: correct
    feedback: A question about the reason gets چون; a question about the goal gets a purpose.
  fa.a2.unit36.lesson06.exercise04.order_post_noun:
    instruction: 'Arrange the words to say: I went to the post office for sending a parcel (برای plus a verbal noun).'
    accepted_answers:
    - {value: [رفتم, پست, برای, فرستادن, یه, بسته], status: correct}
    - {value: [برای, فرستادن, یه, بسته, رفتم, پست], status: correct}
    feedback: '*رفتم پست برای فرستادن یه بسته*: no subjunctive after a verbal noun.'
  fa.a2.unit36.lesson06.exercise05.respond_why_class:
    instruction: 'Answer in Farsi using تا and a subjunctive: you go to class to learn English.'
    accepted_answers:
    - {value: کلاس می‌رم تا انگلیسی یاد بگیرم, status: correct}
    - {value: تا انگلیسی یاد بگیرم, status: correct}
    - {value: من کلاس می‌رم تا انگلیسی یاد بگیرم, status: acceptable_with_note, note: '*من* is correct but normally omitted.'}
    feedback: 'Model: *کلاس می‌رم تا انگلیسی یاد بگیرم.*'
  fa.a2.unit36.lesson06.exercise06.write_three_purposes:
    instruction: 'Write three short sentences in Farsi, in this order: (1) with تا, you went to the bank to get money; (2) with برای اینکه, you save money to buy a car; (3) with برای plus the noun خرید, you went to the market for shopping.'
    accepted_answers:
    - {value: 'رفتم بانک تا پول بگیرم. پول جمع می‌کنم برای اینکه ماشین بخرم. رفتم بازار برای خرید.', status: correct}
    - {value: رفتم بانک تا پول بگیرم پول جمع می‌کنم برای اینکه ماشین بخرم رفتم بازار برای خرید, status: correct}
    - {value: 'رفتم بانک تا پول بگیرم، پول جمع می‌کنم برای اینکه ماشین بخرم، رفتم بازار برای خرید', status: correct}
    - {value: 'من رفتم بانک تا پول بگیرم. من پول جمع می‌کنم برای اینکه ماشین بخرم. من رفتم بازار برای خرید.', status: acceptable_with_note, note: '*من* is correct but normally omitted.'}
    feedback: 'Model: *رفتم بانک تا پول بگیرم. پول جمع می‌کنم برای اینکه ماشین بخرم. رفتم بازار برای خرید.*'
