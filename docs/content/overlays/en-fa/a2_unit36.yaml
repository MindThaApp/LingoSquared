teaching:
  fa.a2.unit36.lesson01.teach.going:
    title: Going places
    gloss: I went, I go, yesterday, today
    note: '*رفتم* is the simple past (I went); *می‌رم* is the spoken present (I go / I am going).'
    example_gloss: [Yesterday I went to the market., Today I am going to the bank.]
  fa.a2.unit36.lesson01.teach.places:
    title: Errand places
    gloss: bank, post office, market
    note: Spoken Persian says *رفتم بانک* with no word for “to”.
    example_gloss: [Yesterday I went to the bank., Today I am going to the post office., Yesterday I went to the market.]
  fa.a2.unit36.lesson01.teach.things:
    title: Things for errands
    gloss: money, parcel, letter, book, a / one
    note: '*یه* is the normal spoken form of “a / one”.'
    example_gloss: [I have money., I have a parcel., I have a letter., I have a book.]
  fa.a2.unit36.lesson01.teach.connectors:
    title: Two ways to say “in order to”
    gloss: in order to / so that, to / so that (short, spoken)
    note: '*برای اینکه* is the full connector; *تا* is the shorter, very common spoken one. Both are followed by the same verb form.'
    example_gloss: [I went to the bank in order to get money., I went to the bank to get money.]
  fa.a2.unit36.lesson01.teach.purpose_verbs:
    title: Verbs of the purpose
    gloss: (that) I get, (that) I buy, (that) I send
    note: 'These endings (*بـ* + stem + *م*) are the subjunctive. They name the goal that has not happened yet.'
    example_gloss: [I went to the bank to get money., I went to the market to buy a book., I went to the post office to send a letter.]
  fa.a2.unit36.lesson01.teach.purpose_clause:
    title: برای اینکه + subjunctive
    gloss: I went to the bank in order to get money
    note: 'Say what you did, then *برای اینکه*, then the goal in the subjunctive: *رفتم بانک برای اینکه پول بگیرم*. The goal verb does not say “past”: it points forward to the goal.'
  fa.a2.unit36.lesson02.teach.learning_words:
    title: Learning words
    gloss: class, English, (that) I learn, (that) I speak
    note: '*یاد بگیرم* and *حرف بزنم* are two-part verbs; the subjunctive *بـ* sits on the verb part (*بگیرم*, *بزنم*).'
    example_gloss: [I go to class in order to learn English., I read books in order to speak English.]
  fa.a2.unit36.lesson02.teach.saving_words:
    title: Saving and reading words
    gloss: I save money, car, (that) I read
    note: '*پول جمع می‌کنم* is the everyday phrase for saving money. *جمع کنم* is its subjunctive.'
    example_gloss: [I save money in order to buy a car., I read books in order to learn English.]
  fa.a2.unit36.lesson02.teach.subjunctive_shape:
    title: Building the subjunctive
    gloss: I get, so that I get; I buy, so that I buy
    note: 'Drop *می‌* and put *بـ* before the stem: *می‌گیرم* becomes *بگیرم*, *می‌خرم* becomes *بخرم*. With *کردن* the *بـ* is normally left out: *جمع می‌کنم* becomes *جمع کنم*. The endings stay the same (*-م* for “I”).'
  fa.a2.unit36.lesson02.teach.ta_connector:
    title: تا + subjunctive (and تا بتونم)
    gloss: to get money; so that I can speak English
    note: '*تا* works like *برای اینکه*: *رفتم بانک تا پول بگیرم*. Use *تا بتونم* (“so that I can”) when the goal is being able to do something; *بتونم* is itself a subjunctive and the next verb is too.'
  fa.a2.unit36.lesson02.teach.baraye_noun:
    title: برای + noun or verbal noun
    gloss: for shopping; for sending a letter
    note: 'After *برای* you can put a plain noun (*خرید*, shopping) or an *-ن* verbal noun (*فرستادن*, sending). Then there is no subjunctive and no *اینکه*.'
  fa.a2.unit36.lesson03.teach.reason_words:
    title: Reason words
    gloss: because, why, what, I needed, I like
    note: '*چون* gives a reason. *لازم داشتم* (“I needed”) and *دوست دارم* (“I like”) are ordinary verbs, not subjunctives.'
    example_gloss: [I went to the bank because I needed money., I go to class because I like English.]
  fa.a2.unit36.lesson03.teach.reason_vs_purpose:
    title: Reason (چون) versus purpose (تا)
    gloss: because I needed money / to get money
    note: '*چون* looks back at the cause and uses an ordinary verb: *چون پول لازم داشتم*. *تا* and *برای اینکه* look forward at the goal and use the subjunctive: *تا پول بگیرم*.'
  fa.a2.unit36.lesson03.teach.which_verb_form:
    title: Check the verb to tell them apart
    gloss: because I needed money / in order to get money
    note: 'If the clause has a normal tense (*داشتم*, *دارم*), the connector is *چون*. If it has a subjunctive (*بگیرم*, *بخرم*), the connector is *برای اینکه* or *تا*.'
  fa.a2.unit36.lesson04.teach.purpose_questions:
    title: Asking what for
    gloss: What did you go to the bank for? What do you want money for? What do you go to class for?
    note: '*برای چی؟* asks about the goal. The answer is a purpose with *تا* or *برای اینکه*.'
  fa.a2.unit36.lesson04.teach.answer_pattern:
    title: Question and answer
    gloss: What did you go to the bank for? I went to get money.
    note: 'Answer *برای چی؟* with the action plus *تا* or *برای اینکه* plus the subjunctive. A short answer, just *تا پول بگیرم*, is also natural.'
  fa.a2.unit36.lesson05.teach.reading:
    title: A day of errands
    gloss: Today I had things to do. First I went to the bank to get money. Then I went to the post office to send a letter. In the end I went to the market for shopping. I save money in order to buy a car.
    note: Read once for the three errands, then again for the goal behind each one.
  fa.a2.unit36.lesson06.teach.turn01: {title: Sara asks why Nima is late, gloss: 'Sara asks: Nima, why are you late?', note: '*چرا* asks for a reason.'}
  fa.a2.unit36.lesson06.teach.turn02: {title: Nima gives a reason, gloss: 'Nima: Because the bank was crowded.', note: '*چون* plus an ordinary past verb gives a reason.'}
  fa.a2.unit36.lesson06.teach.turn03: {title: Sara asks what for, gloss: 'Sara: What did you go to the bank for?', note: '*برای چی* now asks about the goal.'}
  fa.a2.unit36.lesson06.teach.turn04: {title: Two errands with their goals, gloss: 'Nima: I went to the bank to get money. Then I went to the post office to send a parcel.', note: 'One goal uses *تا* plus a subjunctive; the other uses *برای* plus a verbal noun.'}
  fa.a2.unit36.lesson06.teach.turn05: {title: Sara asks about the money, gloss: 'Sara: What do you want money for?', note: 'Another *برای چی* question about a goal.'}
  fa.a2.unit36.lesson06.teach.turn06: {title: Nima gives the goal, gloss: 'Nima: I save money to buy a car.', note: '*تا ماشین بخرم* names the goal.'}
exercises:
