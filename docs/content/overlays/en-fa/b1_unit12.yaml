course:
  title: Farsi B1
  description: Express real and likely conditions with if-clauses, including negative conditions, while Nima and Sara make a backup plan.
units:
  fa.b1.unit12.real_conditions:
    title: Real Conditions
    description: Express real and likely conditions with if-clauses, including negative conditions, while Nima and Sara make a backup plan.
