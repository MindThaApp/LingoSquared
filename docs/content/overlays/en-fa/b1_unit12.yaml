teaching:
  fa.b1.unit12.lesson01.teach.age:
    title: if
    gloss: if
    note: '*اگه* introduces a real, likely condition in everyday speech.'
    example_gloss: If it rains, we will change the plan.
  fa.b1.unit12.lesson01.teach.barun_biad:
    title: it rains
    gloss: it rains
    note: The verb after *اگه* is usually subjunctive for a future/likely condition.
    example_gloss: If it rains, we will change the plan.
  fa.b1.unit12.lesson01.teach.barname:
    title: plan
    gloss: plan
    example_gloss: We will change the plan.
  fa.b1.unit12.lesson01.teach.avaz_mikonim:
    title: we change
    gloss: we change
    example_gloss: We will change the plan.
  fa.b1.unit12.lesson01.teach.grammar_real_if:
    title: If it rains, we will change the plan.
    gloss: If it rains, we will change the plan.
    note: '*اگه* + subjunctive condition, then a present/future result clause.'
  fa.b1.unit12.lesson02.teach.vaght_dashti:
    title: you have time
    gloss: you have time
    example_gloss: If you have time, send me a message.
  fa.b1.unit12.lesson02.teach.payam_bede:
    title: send a message
    gloss: send a message
    example_gloss: If you have time, send me a message.
  fa.b1.unit12.lesson02.teach.behem:
    title: to me
    gloss: to me
    example_gloss: Send me a message.
  fa.b1.unit12.lesson02.teach.age_vaght_dashti:
    title: If you have time, send me a message.
    gloss: If you have time, send me a message.
  fa.b1.unit12.lesson02.teach.grammar_second_person:
    title: If you have time, send me a message.
    gloss: If you have time, send me a message.
    note: In a real condition Persian often uses the simple past (*داشتی*, *نتونستی*) where English uses the present ('if you have time', 'if you can't'). *اگه وقت داشته باشی* is an equally natural alternative.
  fa.b1.unit12.lesson03.teach.natunesi:
    title: you cannot / you could not
    gloss: you cannot / you could not
    example_gloss: If you cannot come, let me know.
  fa.b1.unit12.lesson03.teach.biay:
    title: come
    gloss: come
    example_gloss: If you cannot come, let me know.
  fa.b1.unit12.lesson03.teach.khabar_bede:
    title: let someone know
    gloss: let someone know
    example_gloss: Let me know.
  fa.b1.unit12.lesson03.teach.be_man:
    title: to me
    gloss: to me
  fa.b1.unit12.lesson03.teach.grammar_negative_condition:
    title: If you cannot come, let me know.
    gloss: If you cannot come, let me know.
    note: Negating the condition with *نتونستی* ('you couldn't', here 'you can't') gives the 'if you can't...' meaning; *نتونی* (subjunctive) is also possible.
  fa.b1.unit12.lesson04.teach.nima:
    title: Nima
    gloss: Nima
    example_gloss: Nima changes the plan.
  fa.b1.unit12.lesson04.teach.sara:
    title: Sara
    gloss: Sara
    example_gloss: Sara sends Nima a message.
  fa.b1.unit12.lesson04.teach.park:
    title: park
    gloss: park
    example_gloss: If the weather is good, we will go to the park.
  fa.b1.unit12.lesson04.teach.hava_khub_bashe:
    title: the weather is good
    gloss: the weather is good
    example_gloss: If the weather is good, we will go to the park.
  fa.b1.unit12.lesson04.teach.kafe:
    title: cafe
    gloss: cafe
    example_gloss: If it rains, we will go to a cafe.
  fa.b1.unit12.lesson04.teach.dialogue_nima_plan:
    title: 'Nima: Sara, if the weather is good, we will go to the park.'
    gloss: 'Nima: Sara, if the weather is good, we will go to the park.'
  fa.b1.unit12.lesson04.teach.dialogue_sara_rain:
    title: 'Sara: What if it rains?'
    gloss: 'Sara: What if it rains?'
  fa.b1.unit12.lesson04.teach.dialogue_nima_cafe:
    title: 'Nima: If it rains, we will change the plan and go to a cafe.'
    gloss: 'Nima: If it rains, we will change the plan and go to a cafe.'
  fa.b1.unit12.lesson04.teach.dialogue_sara_message:
    title: 'Sara: Okay. If I cannot come, I will message you.'
    gloss: 'Sara: Okay. If I cannot come, I will message you.'
  fa.b1.unit12.lesson04.teach.dialogue_nima_reply:
    title: 'Nima: Good, then I will wait for your message.'
    gloss: 'Nima: Good, then I will wait for your message.'
  fa.b1.unit12.lesson05.teach.asr:
    title: evening
    gloss: evening
    example_gloss: Nima and Sara have plans for the evening.
  fa.b1.unit12.lesson05.teach.daran:
    title: they have
    gloss: they have
    example_gloss: They have plans for the evening.
  fa.b1.unit12.lesson05.teach.natune:
    title: he/she cannot
    gloss: he/she cannot
    example_gloss: If she cannot come, she will send a message.
  fa.b1.unit12.lesson05.teach.reading_passage:
    title: 'Reading: The evening plan'
    gloss: Nima and Sara have plans for the evening. If the weather is good, they will go to the park. If it rains, they will change the plan and go to a cafe. Sara said that if she cannot come, she will message Nima. Nima will wait for her message.
  fa.b1.unit12.lesson06.teach.grammar_review:
    title: If it rains... If you have time... If you cannot...
    gloss: If it rains... If you have time... If you cannot...
    note: 'Review: real conditions use *اگه* plus a condition and a separate result clause.'
  fa.b1.unit12.lesson06.teach.zang_bezan:
    title: call
    gloss: call
    example_gloss: If you need anything, call.
  fa.b1.unit12.lesson06.teach.kari_dashti:
    title: you need anything / have something
    gloss: you need anything / have something
    example_gloss: If you need anything, call.
exercises:
  fa.b1.unit12.lesson01.exercise01.recognize_age:
    instruction: What does this word mean?
    correct_option: if
    distractors:
    - when
    - because
    - although
    accepted_answers:
    - value: if
      status: correct
    feedback: '*اگه* means if.'
  fa.b1.unit12.lesson01.exercise02.recognize_barun_biad:
    instruction: What does this phrase mean?
    correct_option: it rains
    distractors:
    - it was raining
    - it is sunny
    - the plan changes
    accepted_answers:
    - value: it rains
      status: correct
    feedback: '*بارون بیاد* means it rains in an if-clause.'
  fa.b1.unit12.lesson01.exercise03.order_age_barun_biad_barname:
    instruction: 'Put the words in order: If it rains, we will change the plan.'
    accepted_answers:
    - value: اگه بارون بیاد برنامه رو عوض می‌کنیم
      status: correct
    feedback: The condition comes first, followed by the result.
  fa.b1.unit12.lesson01.exercise04.match_condition_words:
    instruction: Match each phrase with its meaning.
    accepted_answers:
    - value:
        اگه: if
        بارون بیاد: it rains
        برنامه: plan
        عوض می‌کنیم: we change
        بارون: rain
        رو: object marker
      status: correct
    feedback: These are the core real-condition words.
  fa.b1.unit12.lesson01.exercise05.translate_if_rains_change_plan:
    instruction: 'Translate into Farsi: If it rains, we will change the plan.'
    accepted_answers:
    - value: اگه بارون بیاد، برنامه رو عوض می‌کنیم
      status: correct
    - value: اگه بارون بیاد برنامه رو عوض می‌کنیم
      status: correct
    feedback: A natural real condition uses *اگه* plus *بیاد*.
  fa.b1.unit12.lesson01.exercise06.speak_if_rains:
    instruction: 'Say aloud in Farsi: If it rains, we will change the plan.'
    accepted_answers:
    - value: اگه بارون بیاد، برنامه رو عوض می‌کنیم
      status: correct
    - value: اگه بارون بیاد برنامه رو عوض می‌کنیم
      status: correct
    feedback: Keep the condition and result as two clauses.
  fa.b1.unit12.lesson01.exercise07.write_if_rains:
    instruction: 'Write in Farsi: If it rains, we will change the plan.'
    accepted_answers:
    - value: اگه بارون بیاد، برنامه رو عوض می‌کنیم
      status: correct
    - value: اگه بارون بیاد برنامه رو عوض می‌کنیم
