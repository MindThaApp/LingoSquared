    feedback: "*آشپزی* means cooking."
  fa.a1.unit35.lesson01.exercise02.recognize_piaz:
    instruction: "What does this word mean?"
    correct_option: onion
    distractors: [cooking, salt, oil]
    accepted_answers: [{value: onion, status: correct}]
    feedback: "*پیاز* means onion."
  fa.a1.unit35.lesson01.exercise03.match_cooking_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {آشپزی: cooking, پیاز: onion, نمک: salt, روغن: oil, "می‌خوام": "I want", آشپزخانه: kitchen, یه: "a/one", "می‌خوام آشپزی کنم.": "I want to cook."}
        status: correct
    feedback: "These are the core cooking words."
  fa.a1.unit35.lesson01.exercise04.word_order_want_cook:
    instruction: "Put the words in order."
    accepted_answers:
      - {value: ["می‌خوام", آشپزی, کنم], status: correct}
    feedback: "*می‌خوام آشپزی کنم* means 'I want to cook.'"
  fa.a1.unit35.lesson01.exercise05.translate_want_onion:
    instruction: "Translate into English: یه پیاز می‌خوام."
    answer_language_code: en
    accepted_answers:
      - {value: "I want an onion", status: correct}
