course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: cooking words, describing cooking actions,
    giving simple step-by-step cooking instructions, and a kitchen
    dialogue.

units:
  fa.a1.unit35.cooking:
    title: Cooking

lessons:
  fa.a1.unit35.lesson01.cooking_words: {title: "Cooking words"}
  fa.a1.unit35.lesson02.cooking_actions: {title: "Cooking actions"}
  fa.a1.unit35.lesson03.cooking_steps: {title: "Cooking steps"}
  fa.a1.unit35.lesson04.cooking_dialogue: {title: "Dialogue: In the kitchen"}
  fa.a1.unit35.lesson05.reading_cooking: {title: "Reading about cooking"}
  fa.a1.unit35.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit35.lesson01.teach.ashpazi:
    title: Cooking
    gloss: cooking
    note: "*آشپزی* means 'cooking' as an activity."
    example_gloss: "I like cooking."
  fa.a1.unit35.lesson01.teach.piaz:
    title: Onion
    gloss: onion
    note: "*پیاز* means 'onion.'"
    example_gloss: "I want an onion."
  fa.a1.unit35.lesson01.teach.namak:
    title: Salt
    gloss: salt
    note: "*نمک* means 'salt.'"
    example_gloss: "Pass the salt."
  fa.a1.unit35.lesson01.teach.roghan:
    title: Oil
    gloss: oil
    note: "*روغن* means 'cooking oil.'"
    example_gloss: "The oil is in the pan."
  fa.a1.unit35.lesson01.teach.review_want_kitchen:
    title: "I want / kitchen / a, one"
    gloss: "I want / kitchen / a, one"
    note: "*می‌خوام* is colloquial for 'I want.' *آشپزخانه* means 'kitchen.' *یه* is the colloquial form of *یک* ('a/one')."
  fa.a1.unit35.lesson01.teach.want_cook:
    title: "I want to cook"
    gloss: "I want to cook"
    note: "*کنم* is the subjunctive 'I do,' used after *می‌خوام* with *آشپزی* to mean 'cook.'"

  fa.a1.unit35.lesson02.teach.chop_onion:
    title: "I chop the onion"
    gloss: "I chop the onion"
    note: "*رو* marks the object here (colloquial for *را*). *خرد می‌کنم* means 'I chop.'"
  fa.a1.unit35.lesson02.teach.pour_oil:
    title: "I pour the oil"
    gloss: "I pour the oil"
    note: "*می‌ریزم* means 'I pour.'"
  fa.a1.unit35.lesson02.teach.fry_onion:
    title: "I fry the onion"
    gloss: "I fry the onion"
    note: "*سرخ می‌کنم* means 'I fry.'"
  fa.a1.unit35.lesson02.teach.review_chop_fry:
    title: "To chop / to fry / to pour"
    gloss: "to chop / to fry / to pour"
    note: "*خرد کردن* is the infinitive 'to chop'; *سرخ کردن* is 'to fry'; *ریختن* is 'to pour.'"
  fa.a1.unit35.lesson02.teach.add_salt:
    title: "I add salt"
    gloss: "I add salt"
    note: "*نمک می‌ریزم* literally 'I pour salt' -- the natural way to say 'I add salt.'"

  fa.a1.unit35.lesson03.teach.review_first_then:
    title: "First / then"
    gloss: "first / then"
    note: "*اول* means 'first'; *بعد* means 'then.'"
  fa.a1.unit35.lesson03.teach.first_chop:
    title: "First I chop the onion"
    gloss: "First I chop the onion"
  fa.a1.unit35.lesson03.teach.then_fry:
    title: "Then I fry it in oil"
    gloss: "Then I fry it in oil"
    note: "*تو* means 'in.' *سرخش می‌کنم* attaches the object clitic *-ش* ('it') onto *سرخ می‌کنم*, meaning 'I fry it.'"
  fa.a1.unit35.lesson03.teach.review_slow_ready:
    title: "Slowly / ready"
    gloss: "slowly / ready"
    note: "*آروم* means 'slowly'; *آماده* means 'ready.'"
  fa.a1.unit35.lesson03.teach.slow_cook:
    title: "The food cooks slowly"
    gloss: "The food cooks slowly"
    note: "*غذا* means 'food'; *می‌پزه* is colloquial for 'it cooks.'"
  fa.a1.unit35.lesson03.teach.almost_ready:
    title: "It's almost ready"
    gloss: "It's almost ready"
    note: "*تقریباً* means 'almost.' *آماده‌ست* combines *آماده* with the colloquial -s contraction of *است* ('is')."

  fa.a1.unit35.lesson04.teach.review_dialogue_words:
    title: "Nima / Sara / hello / okay / thanks"
    gloss: "Nima / Sara / hello / okay / thanks"
    note: "*نیما* and *سارا* are the recurring names. *سلام* means 'hello.' *باشه* means 'okay.' *مرسی* means 'thanks.'"
  fa.a1.unit35.lesson04.teach.dish_name:
    title: Ghormeh sabzi
    gloss: "ghormeh sabzi (a Persian herb stew)"
    note: "*قرمه‌سبزی* is a well-known Iranian herb-and-bean stew, a common everyday home-cooked dish."
    example_gloss: "I'm cooking ghormeh sabzi."
  fa.a1.unit35.lesson04.teach.dialogue_line1:
    title: "Nima: Hello, what are you cooking?"
    gloss: "Hello, what are you cooking?"
  fa.a1.unit35.lesson04.teach.dialogue_line2:
    title: "Sara: I'm cooking ghormeh sabzi."
    gloss: "I'm cooking ghormeh sabzi."
  fa.a1.unit35.lesson04.teach.dialogue_line3:
    title: "Nima: Do you want help?"
    gloss: "Do you want help?"
  fa.a1.unit35.lesson04.teach.dialogue_line4:
    title: "Sara: Yeah, please chop the onion."
    gloss: "Yeah, please chop the onion."
  fa.a1.unit35.lesson04.teach.dialogue_line5:
    title: "Nima: Okay."
    gloss: "Okay."
  fa.a1.unit35.lesson04.teach.dialogue_line6:
    title: "Sara: Thanks, the food will be very delicious."
    gloss: "Thanks, the food will be very delicious."

  fa.a1.unit35.lesson05.teach.reading_text:
    title: "Reading: Sara cooks ghormeh sabzi"
    gloss: "Sara is in the kitchen. She's cooking ghormeh sabzi. First Nima chops the onion, then Sara fries it in oil. She also adds salt. The food cooks slowly and turns out very delicious."
    note: "The reading retells the dialogue's actions using third-person verb forms; as in the dialogue, Nima is the one who chops the onion."
  fa.a1.unit35.lesson05.teach.reading_note:
    title: "He/she cooks / does / pours / becomes"
    gloss: "he/she cooks / does / pours / becomes"
    note: "*می‌پزه*, *می‌کنه*, *می‌ریزه*, and *می‌شه* are the third-person colloquial forms of the verbs used earlier in first person."

  fa.a1.unit35.lesson06.teach.like_but_time:
    title: "I like cooking, but I don't have time"
    gloss: "I like cooking, but I don't have time"
    note: "*دوست دارم* means 'I like.' *ولی* means 'but.' *وقت ندارم* means 'I don't have time.'"
  fa.a1.unit35.lesson06.teach.service_request:
    title: "Please cook the food"
    gloss: "Please cook the food"
    note: "*بپز* is the informal imperative 'cook!'"
  fa.a1.unit35.lesson06.teach.review_cook_words:
    title: "Cooking / onion / salt / oil / it cooks"
    gloss: "cooking / onion / salt / oil / it cooks"
    note: "*آشپزی*, *پیاز*, *نمک*, *روغن*, and *می‌پزه* are the core words of this topic."

exercises:
