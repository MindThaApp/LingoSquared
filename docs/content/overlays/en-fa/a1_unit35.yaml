    correct_option: "I fry the onion."
    distractors:
      - "I chop the onion."
      - "I add salt."
      - "I cook the onion slowly."
    accepted_answers: [{value: "I fry the onion.", status: correct}]
    feedback: "*پیاز رو سرخ می‌کنم* means 'I fry the onion.'"
  fa.a1.unit35.lesson02.exercise03.match_action_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"خرد می‌کنم": "I chop", "می‌ریزم": "I pour", "سرخ می‌کنم": "I fry", "خرد کردن": "to chop", "سرخ کردن": "to fry", ریختن: "to pour", "نمک می‌ریزم.": "I add salt."}
        status: correct
