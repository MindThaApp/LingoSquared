review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Draft overlay paired with the fa.a1.unit54.park realization. See that
    file's generation_provenance for the honest source-access result: tried
    `firecrawl search "FSI Persian Basic Course park پارک picnic پیک‌نیک
    walk stroll"` first, per the standing instruction to re-check Firecrawl
    quota fresh even though it has been reported exhausted in every earlier
    round this session -- it returned `Error: Request failed with status
    code 402` (payment required), confirming the account genuinely remains
    at 0 credits. Fell back to this worker's own cached local
    `pdftotext -layout` extraction of the same Live Lingua-hosted FSI
    Spoken Persian PDF (`fsi_persian_livelingua.txt`, ~66,700 words).
    Grepped case-insensitively for park/picnic/stroll/walk (leisure
    sense): zero genuine hits. FSI Persian's own course does not cover a
    leisure park visit at all -- disclosing honestly that nothing usable
    was found, same as the museum/concert units before it. All vocabulary
    and the full dialogue are authored fresh from this project's own
    established conventions.

    Scenario note, a deliberate departure from units 41-53's own
    service-counter convention: universal.a1.park.enjoy_a_park_outing's
    own can_do (make a park plan, describe what you see, suggest a walk or
    picnic, talk about it afterward) is a friends'-plan scene, not a
    transaction, so this unit does not introduce a new named service
    clerk the way units 41-53 each did. It instead reuses the established
    سارا/نیما friend pair (already paired together in unit11/unit33/
    unit38), continuing their existing informal register, matching how
    unit07 (weather) and unit38 (seasons) -- this course's other
    non-transactional, friends-chatting units -- were built.

    Reuse chain: بریم (unit07/12), می‌خوای (unit12), پارک (unit07/27/33),
    باشه (unit03), عالیه (unit07), امروز/هوا/چطوره/آفتابیه/گرمه (unit07),
    خوبه (established), یا (unit06), داره (unit26), چطور (unit01), بود
    (unit06), باحال (unit36), سارا (unit02, recurring character), ملت
    (used only as one component of a real, well-known Tehran park name,
    پارک ملت -- Mellat Park -- matching the real-place-name authenticity
    precedent unit05 already set with میدان آزادی/هتل آزادی; confirmed
    collision-free via a corpus-wide grep), از/ساعت/هفت/صبح/تا/ده/شب (all
    corpus-established time/number words reused for lesson05's
    opening-hours reading line). New vocabulary genuinely introduced for
    the first time in the whole corpus: پیک‌نیک (picnic, a direct
    loanword), قدم (step, combined with the already-known root زدن --
    unit22's زنگ زدن/بزن already established this verb -- into قدم
    بزنیم, "let's walk/stroll"), and درخت (tree) -- exactly 3 new words,
    not counting the one exempt proper noun ملت. No new verb-conjugation
    PATTERN is introduced -- بزنیم extends the already-known زدن root the
    same way می‌ری/می‌رم/بریم already coexist in this corpus as
    related-but-distinct surface forms of رفتن. This unit states no price
    or money figure anywhere (a genuine, deliberate difference from every
    one of units 41-53's paid-service scenes -- a park visit is free, and
    the spine outcome's own assessment_requirements never mention price).
    The park's name (پارک ملت), its hours (7am-10pm), and that it has
    trees are kept identical across the dialogue and the park-sign
    reading text, per AUTHORING_GUIDE.md #11.

    Every "Translate into English" exercise below explicitly sets
    answer_language_code: en. No exercise in this unit tests a genuine
    two-clause sentence joined by "and"/comma (§12) -- every multi-sentence
    line is authored as two separate short sentences in both languages,
    matching how units 44-53 already treat their own two-sentence notes.
    No listen_type/listen_select/listen_order exercise is used anywhere in
    this unit (continuing the established text-based corpus-consistency
    pattern from units 19-53, even though fa now has real Azure TTS per
    §14) -- the spine outcome's "listening" assessment requirement is
    covered via the dialogue_comprehension exercise's comprehension-of-the-
    exchange task, the same interpretation units 41-53 already established.
    Checked the same-speaker/same-audio distractor-collision bug class
    (fixed 2026-07-09 in the nl corpus, commit 148240e) anyway, per the
    standing instruction to list every line each speaker says before
    writing distractors: نیما says "سارا، می‌خوای بریم پارک؟"/"آفتابیه و
    گرمه."/"قدم بزنیم. پارک درخت داره."; سارا says "باشه، عالیه! امروز
    هوا چطوره؟"/"خوبه! قدم بزنیم یا پیک‌نیک بریم؟"/"باشه، می‌بینمت." --
    lesson04's dialogue_comprehension distractors ("She asks what time it
    is."/"She asks how much the picnic costs."/"She asks if Nima wants to
    go home.") are plausible-fact alternatives, not lines either speaker
    actually says or facts either speaker actually states anywhere in this
    unit's dialogue -- the time, a cost, and going home are never
    mentioned by either character. The dialogue_response exercise
    (lesson04) accepts نیما's own actual next line, not a distractor set,
    so this check doesn't apply to it. Boolean-coercion check: ran a
    recursive scan over title/gloss/note/example_gloss/answer/
    matching-pair value fields (including matching_pairs right: values
    specifically) across both this overlay and the paired realization for
    bare yes/no/true/false/on/off string values or coerced booleans, plus
    a full yaml.safe_load parse of both files confirming every loaded
    value is a str/list/dict rather than a Python bool -- zero hits.
    Persian-vs-Arabic codepoint scan (Arabic kaf U+0643/yeh U+064A) across
    both files -- zero hits. Compiler validation, both standalone and
    against the full 54-unit en-fa A1 corpus with position-matched
    realization/overlay lists, confirmed 0 errors/0 warnings (see this
    task's final report for the exact command and output).

course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: making a plan with a friend to visit the park,
    checking the weather, deciding between a walk or a picnic, and briefly
    saying how the park visit was afterward, plus reading/writing a short
    park sign naming the park, its opening hours, and what it has.

units:
  fa.a1.unit54.park: {title: Park}

lessons:
  fa.a1.unit54.lesson01.new_park_one: {title: "New words 1"}
  fa.a1.unit54.lesson02.new_park_two: {title: "New words 2"}
  fa.a1.unit54.lesson03.suggest_activity: {title: "Suggesting an activity"}
  fa.a1.unit54.lesson04.park_dialogue: {title: "Dialogue: at the park"}
  fa.a1.unit54.lesson05.reading_park_sign: {title: "Reading a park sign"}
  fa.a1.unit54.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit54.lesson01.teach.review_beriim_mikhaay:
    title: "Review: let's go / do you want"
    gloss: "let's go / do you want"
    note: "*بریم* ('let's go') was already taught in unit07/12; *می‌خوای* ('do you want') was already taught in unit12."
  fa.a1.unit54.lesson01.teach.review_park_bashe:
    title: "Review: park / okay"
    gloss: "park / okay"
    note: "*پارک* ('park') was already taught in unit07/27/33; *باشه* ('okay') was already taught in unit03."
  fa.a1.unit54.lesson01.teach.review_aaleeye:
    title: "Review: great"
    gloss: great
    note: "*عالیه* ('great') was already taught in unit07."
  fa.a1.unit54.lesson01.teach.picnic:
    title: Picnic
    gloss: picnic
    note: "*پیک‌نیک* is a direct loanword for 'picnic.'"
    example_gloss: "Shall we have a picnic?"

  fa.a1.unit54.lesson02.teach.review_weather_words:
    title: "Review: weather / how is it / sunny / warm"
    gloss: "weather / how is it / it's sunny / it's warm"
    note: "*هوا*, *چطوره*, *آفتابیه*, and *گرمه* were already taught in unit07."
  fa.a1.unit54.lesson02.teach.review_khoobe_ya_dare:
    title: "Review: good / or / has"
    gloss: "good / or / it has"
    note: "*خوبه* ('good') was already taught in unit01/05/06/07/10/12; *یا* ('or') was already taught in unit06; *داره* ('it has') was already taught in unit26."
  fa.a1.unit54.lesson02.teach.qadam_bezanim:
    title: "Let's walk"
    gloss: "let's walk / let's stroll"
    note: "*قدم* ('step') combines with the already-known verb root *زدن* (unit22's *زنگ زدن*, 'to call') to form this walking idiom."
    example_gloss: "Shall we walk in the park?"
  fa.a1.unit54.lesson02.teach.derakht:
    title: Tree
    gloss: tree
    note: "*درخت* means 'tree.'"
    example_gloss: "The park has trees."

  fa.a1.unit54.lesson03.teach.qadam_ya_picnic:
    title: "Should we walk or have a picnic?"
    gloss: "Should we walk or have a picnic?"
    note: "Combines this unit's two activity words with *یا* ('or')."
  fa.a1.unit54.lesson03.teach.picnic_havaa_khoobe:
    title: "Let's have a picnic. The weather's good."
    gloss: "Let's have a picnic. The weather's good."
    note: "Gives a reason for the suggestion using already-known words."

  fa.a1.unit54.lesson04.teach.dialogue_line1:
    title: "Nima: Sara, do you want to go to the park?"
    gloss: "Sara, do you want to go to the park?"
  fa.a1.unit54.lesson04.teach.dialogue_line2:
    title: "Sara: Okay, great! How's the weather today?"
    gloss: "Okay, great! How's the weather today?"
  fa.a1.unit54.lesson04.teach.dialogue_line3:
    title: "Nima: It's sunny and warm."
    gloss: "It's sunny and warm."
  fa.a1.unit54.lesson04.teach.dialogue_line4:
    title: "Sara: Good! Should we walk or have a picnic?"
    gloss: "Good! Should we walk or have a picnic?"
  fa.a1.unit54.lesson04.teach.dialogue_line5:
    title: "Nima: Let's walk. The park has trees."
    gloss: "Let's walk. The park has trees."
  fa.a1.unit54.lesson04.teach.dialogue_line6:
    title: "Sara: Okay, see you."
    gloss: "Okay, see you."

  fa.a1.unit54.lesson05.teach.reading_text:
    title: "Reading: a park sign"
    gloss: "Mellat Park: from seven in the morning to ten at night. Has trees."
    note: "A short park sign naming the park, its opening hours, and that it has trees."

  fa.a1.unit54.lesson06.teach.review_beriim_park:
    title: "Shall we go to the park?"
    gloss: "Shall we go to the park?"
  fa.a1.unit54.lesson06.teach.review_qadam_ya_picnic:
    title: "Should we walk or have a picnic?"
    gloss: "Should we walk or have a picnic?"
  fa.a1.unit54.lesson06.teach.review_afterward:
    title: "How was the park? It was cool!"
    gloss: "How was the park? It was cool!"
    note: "*چطور* ('how'), *بود* ('was'), and *باحال* ('cool') were each already taught (unit01, unit06, unit36) -- this combines them fresh to talk briefly about the park afterward."
  fa.a1.unit54.lesson06.teach.summary_words:
    title: "Park / picnic / let's walk / tree"
    gloss: "park / picnic / let's walk / tree"
    note: "These are the key words and phrases taught in this unit."

exercises:
  fa.a1.unit54.lesson01.exercise01.recognize_picnic:
    instruction: "What does this word mean?"
    correct_option: picnic
    distractors: [park, walk, tree]
    accepted_answers: [{value: picnic, status: correct}]
    feedback: "پیک‌نیک means 'picnic.'"
  fa.a1.unit54.lesson01.exercise02.recognize_picnic_beriim:
    instruction: "What does this sentence mean?"
    correct_option: "Shall we have a picnic?"
    distractors: ["I don't want a picnic.", "We had a picnic.", "Is the picnic good?"]
    accepted_answers: [{value: "Shall we have a picnic?", status: correct}]
    feedback: "پیک‌نیک بریم؟ means 'Shall we have a picnic?'"
  fa.a1.unit54.lesson01.exercise03.match_park_one:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {بریم: "let's go", "می‌خوای": "do you want", پارک: park, باشه: okay, عالیه: great, "پیک‌نیک": picnic}
        status: correct
    feedback: "These are the first new park words for this unit."
  fa.a1.unit54.lesson01.exercise04.word_order_picnic_beriim:
    instruction: "Put the words in order."
    accepted_answers: [{value: ["پیک‌نیک", بریم], status: correct}]
    feedback: "پیک‌نیک بریم means 'Let's have a picnic.'"
  fa.a1.unit54.lesson01.exercise05.translate_park_beriim:
    instruction: "Translate into English: پارک بریم؟"
    answer_language_code: en
    accepted_answers:
      - {value: "Shall we go to the park?", status: correct}
      - {value: "shall we go to the park", status: correct}
      - {value: "Let's go to the park?", status: correct}
    feedback: "پارک بریم؟ means 'Shall we go to the park?'"

  fa.a1.unit54.lesson02.exercise01.recognize_qadam_bezanim:
    instruction: "What does this phrase mean?"
    correct_option: "Let's walk"
    distractors: ["Let's have a picnic", "Let's go home", "Let's sit down"]
    accepted_answers: [{value: "Let's walk", status: correct}]
    feedback: "قدم بزنیم means 'Let's walk.'"
  fa.a1.unit54.lesson02.exercise02.recognize_derakht:
    instruction: "What does this word mean?"
    correct_option: tree
    distractors: [flower, bench, park]
    accepted_answers: [{value: tree, status: correct}]
    feedback: "درخت means 'tree.'"
  fa.a1.unit54.lesson02.exercise03.match_park_two:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {هوا: weather, چطوره: "how is it", آفتابیه: "it's sunny", گرمه: "it's warm", خوبه: good, "قدم بزنیم": "let's walk", درخت: tree}
        status: correct
    feedback: "These words let you talk about the weather and suggest a walk."
  fa.a1.unit54.lesson02.exercise04.word_order_park_derakht_dare:
    instruction: "Put the words in order."
    accepted_answers: [{value: [پارک, درخت, داره], status: correct}]
    feedback: "پارک درخت داره means 'The park has trees.'"
  fa.a1.unit54.lesson02.exercise05.translate_qadam_bezanim:
    instruction: "Translate into English: قدم بزنیم؟"
    answer_language_code: en
    accepted_answers:
      - {value: "Shall we walk?", status: correct}
      - {value: "shall we walk", status: correct}
      - {value: "Should we walk?", status: correct}
    feedback: "قدم بزنیم؟ means 'Shall we walk?'"

  fa.a1.unit54.lesson03.exercise01.recognize_qadam_ya_picnic:
    instruction: "What does this sentence mean?"
    correct_option: "Should we walk or have a picnic?"
    distractors: ["Should we walk or go home?", "Do you want a picnic?", "Is the park far?"]
    accepted_answers: [{value: "Should we walk or have a picnic?", status: correct}]
    feedback: "قدم بزنیم یا پیک‌نیک بریم؟ means 'Should we walk or have a picnic?'"
  fa.a1.unit54.lesson03.exercise02.recognize_picnic_havaa_khoobe:
    instruction: "What does this sentence mean?"
    correct_option: "Let's have a picnic. The weather's good."
    distractors: ["Let's not have a picnic. The weather's bad.", "We had a picnic yesterday.", "The picnic is at the park."]
    accepted_answers: [{value: "Let's have a picnic. The weather's good.", status: correct}]
    feedback: "پیک‌نیک بریم. هوا خوبه means 'Let's have a picnic. The weather's good.'"
  fa.a1.unit54.lesson03.exercise03.match_suggest_activity:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"قدم بزنیم": "let's walk", "پیک‌نیک بریم": "let's have a picnic", "هوا خوبه": "the weather's good", درخت: tree, آفتابیه: sunny, گرمه: warm}
        status: correct
    feedback: "These words let you suggest a park activity and give a reason."
  fa.a1.unit54.lesson03.exercise04.word_order_havaa_khoobe:
    instruction: "Put the words in order."
    accepted_answers: [{value: [هوا, خوبه], status: correct}]
    feedback: "هوا خوبه means 'The weather's good.'"
  fa.a1.unit54.lesson03.exercise05.translate_qadam_ya_picnic:
    instruction: "Translate into English: قدم بزنیم یا پیک‌نیک بریم؟"
    answer_language_code: en
    accepted_answers:
      - {value: "Should we walk or have a picnic?", status: correct}
      - {value: "should we walk or have a picnic", status: correct}
      - {value: "Walk or have a picnic?", status: correct}
    feedback: "قدم بزنیم یا پیک‌نیک بریم؟ means 'Should we walk or have a picnic?'"

  fa.a1.unit54.lesson04.exercise01.dialogue_comprehension_walk_or_picnic:
    instruction: "Sara asks Nima something. What does she suggest?"
    correct_option: "She asks if they should walk or have a picnic."
    distractors:
      - "She asks what time it is."
      - "She asks how much the picnic costs."
      - "She asks if Nima wants to go home."
    accepted_answers: [{value: "She asks if they should walk or have a picnic.", status: correct}]
    feedback: "قدم بزنیم یا پیک‌نیک بریم؟ means 'Should we walk or have a picnic?'"
  fa.a1.unit54.lesson04.exercise02.recognize_dialogue_line5:
    instruction: "What does this sentence mean?"
    correct_option: "Let's walk. The park has trees."
    distractors:
      - "Let's have a picnic. The park has flowers."
      - "Let's go home. The park is closed."
      - "Let's walk. The park has no trees."
    accepted_answers: [{value: "Let's walk. The park has trees.", status: correct}]
    feedback: "قدم بزنیم. پارک درخت داره means 'Let's walk. The park has trees.'"
  fa.a1.unit54.lesson04.exercise03.match_dialogue_park:
    instruction: "Match each line with its meaning."
    accepted_answers:
      - value: {"سارا، می‌خوای بریم پارک؟": "Sara, do you want to go to the park?", "باشه، عالیه! امروز هوا چطوره؟": "Okay, great! How's the weather today?", "آفتابیه و گرمه.": "It's sunny and warm.", "خوبه! قدم بزنیم یا پیک‌نیک بریم؟": "Good! Should we walk or have a picnic?", "قدم بزنیم. پارک درخت داره.": "Let's walk. The park has trees.", "باشه، می‌بینمت.": "Okay, see you."}
        status: correct
    feedback: "These lines appear in the park conversation between Nima and Sara."
  fa.a1.unit54.lesson04.exercise04.dialogue_response_walk:
    instruction: "Respond to خوبه! قدم بزنیم یا پیک‌نیک بریم؟ by suggesting a walk and saying the park has trees."
    accepted_answers:
      - {value: "قدم بزنیم. پارک درخت داره.", status: correct}
      - {value: "قدم بزنیم. پارک درخت داره", status: correct}
      - {value: "قدم بزنیم", status: acceptable_with_note, note: "This answers only the first part of the question."}
    feedback: "قدم بزنیم. پارک درخت داره means 'Let's walk. The park has trees.'"
  fa.a1.unit54.lesson04.exercise05.translate_dialogue_line1:
    instruction: "Translate into English: سارا، می‌خوای بریم پارک؟"
    answer_language_code: en
    accepted_answers:
      - {value: "Sara, do you want to go to the park?", status: correct}
      - {value: "Sara, do you want to go to the park", status: correct}
    feedback: "سارا، می‌خوای بریم پارک؟ means 'Sara, do you want to go to the park?'"

  fa.a1.unit54.lesson05.exercise01.reading_comprehension_place:
    instruction: "According to the sign, what place is this?"
    correct_option: "Park."
    distractors:
      - "Restaurant."
      - "Cinema."
      - "Museum."
    accepted_answers: [{value: "Park.", status: correct}]
    feedback: "پارک means 'park' -- the sign is for a park."
  fa.a1.unit54.lesson05.exercise02.reading_comprehension_closing_time:
    instruction: "According to the sign, what time does the park close?"
    correct_option: "10 at night."
    distractors:
      - "7 in the morning."
      - "10 in the morning."
      - "7 at night."
    accepted_answers: [{value: "10 at night.", status: correct}]
    feedback: "از ساعت هفت صبح تا ده شب means 'from seven in the morning to ten at night' -- it closes at ten at night."
  fa.a1.unit54.lesson05.exercise03.match_reading_park_sign:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {پارک: park, ملت: Mellat, ساعت: "o'clock / hour", هفت: seven, صبح: morning, ده: ten, شب: night, درخت: tree}
        status: correct
    feedback: "These words let you understand the park sign."
  fa.a1.unit54.lesson05.exercise04.translate_reading_park_sign:
    instruction: "Translate into English: پارک ملت: از ساعت هفت صبح تا ده شب. درخت داره."
    answer_language_code: en
    accepted_answers:
      - {value: "Mellat Park: from seven in the morning to ten at night. Has trees.", status: correct}
      - {value: "Mellat Park, from seven in the morning to ten at night, has trees.", status: correct}
    feedback: "پارک ملت: از ساعت هفت صبح تا ده شب. درخت داره means 'Mellat Park: from seven in the morning to ten at night. Has trees.'"
  fa.a1.unit54.lesson05.exercise05.write_park_message:
    instruction: "Write a short message proposing a park visit, using this unit's pattern."
    accepted_answers:
      - {value: "بریم پارک", status: correct}
      - {value: "بریم پارک؟", status: correct}
      - {value: "پیک‌نیک بریم؟", status: correct}
      - {value: "قدم بزنیم؟", status: correct}
    feedback: "You can say بریم پارک؟ (Shall we go to the park?) to propose a park visit."

  fa.a1.unit54.lesson06.exercise01.recognize_review_beriim_park:
    instruction: "What does this sentence mean?"
    correct_option: "Shall we go to the park?"
    distractors:
      - "Shall we go home?"
      - "Shall we go to the museum?"
      - "Did we go to the park?"
    accepted_answers: [{value: "Shall we go to the park?", status: correct}]
    feedback: "بریم پارک؟ means 'Shall we go to the park?'"
  fa.a1.unit54.lesson06.exercise02.recognize_review_afterward:
    instruction: "What does this sentence mean?"
    correct_option: "How was the park? It was cool!"
    distractors:
      - "How far is the park? It was close!"
      - "How much was the picnic? It was cheap!"
      - "When was the walk? It was early!"
    accepted_answers: [{value: "How was the park? It was cool!", status: correct}]
    feedback: "پارک چطور بود؟ باحال بود! means 'How was the park? It was cool!'"
  fa.a1.unit54.lesson06.exercise03.match_wrap_park:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
