teaching:
  fa.a2.unit47.lesson01.teach.now:
    title: Right now
    gloss: now, this very (moment), book, what (are you) doing
    note: '*الان* is “now”; *همین الان* is “right now, this very moment”.'
    example_gloss:
    - Now I am reading a book.
    - Right now I am reading a book.
    - What are you doing now?
  fa.a2.unit47.lesson01.teach.persons:
    title: Being in the middle of it
    gloss: I am (doing), you are, he / she is, we are, you (pl.) are, they are
    note: Put *دارم* (or *داری, داره …*) before the present verb. It says you are in the middle of the action right now.
    example_gloss:
    - I am reading a book.
    - You are reading a book.
    - He / she is reading a book.
    - We are reading a book.
    - You (pl.) are reading a book.
    - They are reading a book.
  fa.a2.unit47.lesson01.teach.verbs:
    title: Present of خوندن
    gloss: I read, you read, he / she reads, we read, you (pl.) read, they read
    note: 'Both parts of the progressive take the same person: *دارم … می‌خونم*, *داری … می‌خونی*.'
    example_gloss:
    - I read every day.
    - You read every day.
    - He / she reads every day.
    - We read every day.
    - You (pl.) read every day.
    - They read every day.
  fa.a2.unit47.lesson01.teach.shape:
    title: دارم plus the present
    gloss: I am reading a book; he is reading a book
    note: 'Take the spoken present (*می‌خونم*) and put *دارم* in front. Change both for the person: *دارم … می‌خونم*, *داره … می‌خونه*. The object stays between them.'
  fa.a2.unit47.lesson02.teach.habit:
    title: Words for habits
    gloss: every, day, at night, work
    note: '*هر روز* and *شب‌ها* tell you the action is a habit, not something happening right now.'
    example_gloss:
    - I work every day.
    - At night I read books.
  fa.a2.unit47.lesson02.teach.work:
    title: Working
    gloss: I work, I am working
    note: '*کار می‌کنم* can be a habit (“I work”); *دارم کار می‌کنم* says you are working at this moment.'
    example_gloss:
    - Right now I am working.
    - I work every day.
  fa.a2.unit47.lesson02.teach.contrast:
    title: Habit or right now
    gloss: I work every day; right now I am working
    note: The plain present (*کار می‌کنم*) is for habits and facts. With *دارم* the same verb says you are in the middle of it now. In speech the plain present can also be used for now, but *دارم* makes it clear.
  fa.a2.unit47.lesson02.teach.negative:
    title: Saying you are not
    gloss: I am not reading a book now
    note: 'For a negative, do not use *دارم*. Use the plain negative present: *الان کتاب نمی‌خونم*.'
    example_gloss:
    - I am not reading a book now.
  fa.a2.unit47.lesson03.teach.things:
    title: Housework words
    gloss: the clothes, the dishes, sweeping (broom), dinner
    note: '*لباس‌ها* and *ظرف‌ها* are plural nouns; with *رو* they are the things being washed.'
    example_gloss:
    - Now I am washing the clothes.
    - Now I am washing the dishes.
    - Now I am sweeping.
    - Now I am cooking dinner.
  fa.a2.unit47.lesson03.teach.verbs:
    title: Housework verbs
    gloss: I wash, I sweep, I make
    note: '*شستن* gives *می‌شورم*; *جارو کردن* and *درست کردن* are noun-plus-verb pairs.'
    example_gloss:
    - I am washing the clothes.
    - I am sweeping.
    - I am making dinner.
  fa.a2.unit47.lesson03.teach.others:
    title: Someone else
    gloss: Nima, he washes, he does
    note: 'For another person, change both *دارم* and the verb: *داره … می‌شوره*.'
    example_gloss:
    - Nima is washing the dishes.
    - Nima is sweeping.
  fa.a2.unit47.lesson03.teach.rule:
    title: Object between the two parts
    gloss: I am washing the dishes; Nima is washing the dishes
    note: The object with *رو* goes between *دارم* and the verb. With a noun-plus-verb pair such as *جارو می‌کنم*, *دارم* goes before the whole phrase.
  fa.a2.unit47.lesson04.teach.calls:
    title: Starting a call
    gloss: hello (on the phone), where are you, what (are you) doing
    note: '*الو* is how you answer or start a phone call.'
    example_gloss:
    - Hello, where are you?
    - Hello, what are you doing now?
  fa.a2.unit47.lesson04.teach.arrive:
    title: On my way
    gloss: I am coming, I am arriving
    note: '*دارم میام* means “I am on my way”; *دارم می‌رسم* means “I am just arriving”.'
    example_gloss:
    - I am coming.
    - I am arriving.
  fa.a2.unit47.lesson04.teach.talk:
    title: Talking and calling
    gloss: with, my mother, talk, I speak, call, he / she calls
    note: '*حرف زدن* is “to talk” and *زنگ زدن* is “to phone”.'
    example_gloss:
    - I am talking with my mother.
    - My mother is calling.
  fa.a2.unit47.lesson04.teach.rule:
    title: Progressive on the phone
    gloss: I am coming; I am talking with my mother
    note: 'Phone talk is full of the progressive: it tells the other person what you are in the middle of. *میام* is the normal spoken form of “I come”; *دارم میام* says you are on your way.'
  fa.a2.unit47.lesson05.teach.words:
    title: Words for the text
    gloss: it is night, everyone, we are at home, the children, TV, they watch, also
    note: '*شبه* is “it is night”; *خونه‌ایم* is “we are at home”.'
    example_gloss:
    - It is night now and we are all at home.
    - The children are watching TV.
    - My mother is also calling.
  fa.a2.unit47.lesson05.teach.reading:
    title: An evening at home
    gloss: It is night now and we are all at home. I am making dinner. Nima is washing the dishes. The children are watching TV. My mother is also calling.
    note: Read once for who is doing what, then again for the verb forms with *دارم, داره, دارن*.
  fa.a2.unit47.lesson06.teach.turn01:
    title: Sara calls Nima
    gloss: 'Sara: Hello Nima, where are you?'
    note: '*کجایی؟* asks where you are.'
  fa.a2.unit47.lesson06.teach.turn02:
    title: Nima is on his way
    gloss: 'Nima: I am on my way. What are you doing?'
    note: '*دارم میام* says he is on his way.'
  fa.a2.unit47.lesson06.teach.turn03:
    title: Sara is cooking
    gloss: 'Sara: I am making dinner.'
    note: '*دارم … درست می‌کنم* is the progressive.'
  fa.a2.unit47.lesson06.teach.turn04:
    title: Nima asks about the children
    gloss: 'Nima: And the children?'
    note: A short question that picks up the topic.
  fa.a2.unit47.lesson06.teach.turn05:
    title: Sara answers
    gloss: 'Sara: They are watching TV.'
    note: '*دارن … می‌بینن* is the “they” form.'
  fa.a2.unit47.lesson06.teach.turn06:
    title: Nima is arriving
    gloss: 'Nima: Good. I am just arriving.'
    note: '*دارم می‌رسم* says he is nearly there.'
