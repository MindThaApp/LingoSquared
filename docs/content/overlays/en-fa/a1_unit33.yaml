course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: describing your neighborhood, naming nearby
    places, saying where someone lives, and giving a simple neighbor detail.

units:
  fa.a1.unit33.neighborhood:
    title: Neighborhoods and Neighbors

lessons:
  fa.a1.unit33.lesson01.neighborhood_words: {title: "Neighborhood words"}
  fa.a1.unit33.lesson02.describe_neighborhood: {title: "How is my neighborhood?"}
  fa.a1.unit33.lesson03.nearby_places: {title: "Nearby places"}
  fa.a1.unit33.lesson04.neighborhood_dialogue: {title: "Dialogue: The neighborhood"}
  fa.a1.unit33.lesson05.reading_neighborhood: {title: "Reading about a neighborhood"}
  fa.a1.unit33.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit33.lesson01.teach.mahale:
    title: Neighborhood
    gloss: neighborhood
    note: "*محله* means 'neighborhood.' With *-ام*, *محله‌ام* means 'my neighborhood.'"
    example_gloss: "My neighborhood is quiet."
  fa.a1.unit33.lesson01.teach.hamsaye:
    title: Neighbor
    gloss: neighbor
    note: "*همسایه* means 'neighbor.'"
    example_gloss: "My neighbor is good."
  fa.a1.unit33.lesson01.teach.khiaban:
    title: Street
    gloss: street
    note: "*خیابان* is the standard word for 'street.'"
    example_gloss: "The street is near our house."
  fa.a1.unit33.lesson01.teach.near_words:
    title: "Near / next to / there is"
    gloss: "near / next to / there is"
    note: "*نزدیک* means 'near,' *کنار* means 'next to,' and *هست* means 'there is' or 'exists.'"
  fa.a1.unit33.lesson01.teach.review_places:
    title: "Home / park / school / shop"
    gloss: "home / park / school / shop"
    note: "*خونه*, *پارک*, *مدرسه*, and *مغازه* are review place words."
  fa.a1.unit33.lesson01.teach.near_park:
    title: "There is a park near our house"
    gloss: "There is a park near our house"
    note: "*نزدیک خونه ما پارک هست* names a nearby place."

  fa.a1.unit33.lesson02.teach.my_neighborhood:
    title: "My neighborhood is quiet"
    gloss: "My neighborhood is quiet"
    note: "*آرومه* is colloquial for 'it is quiet' or 'it is calm.'"
  fa.a1.unit33.lesson02.teach.busy_neighborhood:
    title: "My neighborhood is busy"
    gloss: "My neighborhood is busy"
    note: "*شلوغه* can mean busy, crowded, or messy depending on context; here it describes a busy neighborhood."
  fa.a1.unit33.lesson02.teach.question_how:
    title: "How is it?"
    gloss: "How is it?"
    note: "*چطوره؟* asks 'How is it?'"
  fa.a1.unit33.lesson02.teach.ask_neighborhood:
    title: "How is your neighborhood?"
    gloss: "How is your neighborhood?"
    note: "*محله‌ات* means 'your neighborhood' in informal speech."
  fa.a1.unit33.lesson02.teach.review_good:
    title: "Good / very / and"
    gloss: "good / very / and"
    note: "*خوبه*, *خیلی*, and *و* are review words for short descriptions."

  fa.a1.unit33.lesson03.teach.near_school:
    title: "The school is near our house"
    gloss: "The school is near our house"
    note: "*ماست* here is the contracted form of *ما است*, 'is our.'"
  fa.a1.unit33.lesson03.teach.shop_next_to_park:
    title: "The shop is next to the park"
    gloss: "The shop is next to the park"
    note: "*پارکه* is colloquial for 'it is the park' or 'is by the park' in this sentence."
  fa.a1.unit33.lesson03.teach.where_live:
    title: "I live"
    gloss: "I live"
    note: "*زندگی می‌کنم* means 'I live.'"
  fa.a1.unit33.lesson03.teach.live_here:
    title: "I live here"
    gloss: "I live here"
    note: "*من اینجا زندگی می‌کنم* is a direct way to say where you live."
  fa.a1.unit33.lesson03.teach.review_where:
    title: "Where / here / there"
    gloss: "where / here / there"
    note: "*کجا*, *اینجا*, and *اونجا* locate places in a conversation."

  fa.a1.unit33.lesson04.teach.review_names:
    title: "Nima / Sara / yeah / no"
    gloss: "Nima / Sara / yeah / no"
    note: "*نیما* and *سارا* are the recurring names. *آره* means 'yeah' and *نه* means 'no.'"
  fa.a1.unit33.lesson04.teach.dialogue_line1:
    title: "Sara: Nima, how is your neighborhood?"
    gloss: "Nima, how is your neighborhood?"
  fa.a1.unit33.lesson04.teach.dialogue_line2:
    title: "Nima: My neighborhood is quiet. There is a park near our house."
    gloss: "My neighborhood is quiet. There is a park near our house."
  fa.a1.unit33.lesson04.teach.dialogue_line3:
    title: "Sara: How is your neighbor?"
    gloss: "How is your neighbor?"
  fa.a1.unit33.lesson04.teach.dialogue_line4:
    title: "Nima: My neighbor is good. He lives next to our house."
    gloss: "My neighbor is good. He lives next to our house."

  fa.a1.unit33.lesson05.teach.reading_text:
    title: "Reading: Nima's neighborhood"
    gloss: "Nima's neighborhood is quiet. There is a park near his house. The school is also nearby. Nima's neighbor is good."
    note: "The reading repeats the dialogue facts and adds one nearby place."
  fa.a1.unit33.lesson05.teach.reading_note:
    title: "Also / his house"
    gloss: "also / his house"
    note: "*هم* means 'also'; *خونه‌اش* means 'his house' or 'her house.'"

  fa.a1.unit33.lesson06.teach.short_message:
    title: "Hello, my neighborhood is quiet"
    gloss: "Hello, my neighborhood is quiet. There is a park near our house."
    note: "This is a short written neighborhood message."
  fa.a1.unit33.lesson06.teach.neighbor_message:
    title: "My neighbor is good"
    gloss: "My neighbor is good and lives next to our house."
    note: "This sentence adds a basic neighbor detail."
  fa.a1.unit33.lesson06.teach.review_message_words:
    title: "Hello / here / near / next to"
    gloss: "hello / here / near / next to"
    note: "*سلام*, *اینجا*, *نزدیک*, and *کنار* are useful in short messages."

exercises:
  fa.a1.unit33.lesson01.exercise01.recognize_mahale:
    instruction: "What does this word mean?"
    correct_option: neighborhood
    distractors: [neighbor, street, school]
    accepted_answers: [{value: neighborhood, status: correct}]
    feedback: "محله means neighborhood."
  fa.a1.unit33.lesson01.exercise02.recognize_hamsaye:
    instruction: "What does this word mean?"
    correct_option: neighbor
    distractors: [neighborhood, street, shop]
    accepted_answers: [{value: neighbor, status: correct}]
    feedback: "همسایه means neighbor."
  fa.a1.unit33.lesson01.exercise03.match_neighborhood_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {محله: neighborhood, همسایه: neighbor, خیابان: street, نزدیک: near, کنار: "next to", هست: "there is", خونه: home, پارک: park}
        status: correct
    feedback: "These are the core neighborhood words for this unit."
  fa.a1.unit33.lesson01.exercise04.word_order_near_park:
    instruction: "Put the words in order."
    accepted_answers: [{value: [نزدیک, خونه, ما, پارک, هست], status: correct}]
    feedback: "نزدیک خونه ما پارک هست means 'There is a park near our house.'"
  fa.a1.unit33.lesson01.exercise05.translate_near_park:
    instruction: "Translate into English: نزدیک خونه ما پارک هست."
    answer_language_code: en
    accepted_answers:
      - {value: "There is a park near our house", status: correct}
      - {value: "There is a park near our house.", status: correct}
      - {value: "A park is near our house", status: correct}
      - {value: "A park is near our house.", status: correct}
    feedback: "نزدیک خونه ما پارک هست names a nearby place."

  fa.a1.unit33.lesson02.exercise01.recognize_arome:
    instruction: "What does this word mean?"
    correct_option: "it's quiet"
    distractors: ["it's busy", "it's expensive", "it's old"]
    accepted_answers: [{value: "it's quiet", status: correct}]
    feedback: "آرومه means 'it's quiet' or 'it's calm.'"
  fa.a1.unit33.lesson02.exercise02.recognize_question:
    instruction: "What does this question mean?"
    correct_option: "How is your neighborhood?"
    distractors:
      - "Where is the shop?"
      - "Who is your neighbor?"
      - "When is school?"
    accepted_answers: [{value: "How is your neighborhood?", status: correct}]
    feedback: "محله‌ات چطوره؟ asks how your neighborhood is."
  fa.a1.unit33.lesson02.exercise03.match_descriptions:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"محله‌ام": "my neighborhood", آرومه: "it's quiet", شلوغه: "it's busy", چطوره: "how is it", "محله‌ات": "your neighborhood", خوبه: "it's good", "محله‌ام آرومه.": "My neighborhood is quiet.", "محله‌ام شلوغه.": "My neighborhood is busy."}
        status: correct
    feedback: "These words describe a neighborhood simply."
  fa.a1.unit33.lesson02.exercise04.word_order_quiet:
    instruction: "Put the words in order."
    accepted_answers: [{value: ["محله‌ام", خیلی, آرومه], status: correct}]
    feedback: "محله‌ام خیلی آرومه means 'My neighborhood is very quiet.'"
  fa.a1.unit33.lesson02.exercise05.translate_neighborhood_quiet:
    instruction: "Translate into English: محله‌ام آرومه."
    answer_language_code: en
    accepted_answers:
      - {value: "My neighborhood is quiet", status: correct}
      - {value: "My neighborhood is quiet.", status: correct}
      - {value: "My neighborhood is calm", status: correct}
      - {value: "My neighborhood is calm.", status: correct}
    feedback: "محله‌ام آرومه describes your own neighborhood."

  fa.a1.unit33.lesson03.exercise01.recognize_live:
    instruction: "What does this phrase mean?"
    correct_option: "I live"
    distractors: ["I work", "I study", "I shop"]
    accepted_answers: [{value: "I live", status: correct}]
    feedback: "زندگی می‌کنم means 'I live.'"
  fa.a1.unit33.lesson03.exercise02.recognize_next_to:
    instruction: "What does this word mean?"
    correct_option: "next to"
    distractors: [near, where, there]
    accepted_answers: [{value: "next to", status: correct}]
    feedback: "کنار means 'next to.'"
  fa.a1.unit33.lesson03.exercise03.match_nearby_places:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {مدرسه: school, مغازه: shop, نزدیک: near, کنار: "next to", "زندگی می‌کنم": "I live", اینجا: here, کجا: where, اونجا: there}
        status: correct
    feedback: "These words let you name nearby places and say where you live."
  fa.a1.unit33.lesson03.exercise04.word_order_live_here:
    instruction: "Put the words in order."
    accepted_answers: [{value: [من, اینجا, زندگی, "می‌کنم"], status: correct}]
    feedback: "من اینجا زندگی می‌کنم means 'I live here.'"
  fa.a1.unit33.lesson03.exercise05.translate_shop_park:
    instruction: "Translate into English: مغازه کنار پارکه."
    answer_language_code: en
    accepted_answers:
      - {value: "The shop is next to the park", status: correct}
      - {value: "The shop is next to the park.", status: correct}
      - {value: "The store is next to the park", status: correct}
      - {value: "The store is next to the park.", status: correct}
    feedback: "مغازه کنار پارکه means 'The shop is next to the park.'"

  fa.a1.unit33.lesson04.exercise01.dialogue_comprehension_place:
    instruction: "What is near Nima's house?"
    correct_option: "There is a park near Nima's house."
    distractors:
      - "There is a school next to Nima's house."
      - "Nima says his neighborhood is very expensive."
      - "Sara says Nima's neighbor lives far away."
    accepted_answers: [{value: "There is a park near Nima's house.", status: correct}]
    feedback: "نیما says نزدیک خونه ما پارک هست."
  fa.a1.unit33.lesson04.exercise02.recognize_neighbor_question:
    instruction: "What does this question mean?"
    correct_option: "How is your neighbor?"
    distractors:
      - "How is your neighborhood?"
      - "Where do you live?"
      - "Is there a park nearby?"
    accepted_answers: [{value: "How is your neighbor?", status: correct}]
    feedback: "همسایه‌ات چطوره؟ asks how your neighbor is."
  fa.a1.unit33.lesson04.exercise03.match_dialogue_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {نیما: Nima, سارا: Sara, "محله‌ات": "your neighborhood", "محله‌ام": "my neighborhood", "همسایه‌ات": "your neighbor", "همسایه‌ام": "my neighbor", "می‌کنه": "he/she does", آره: yeah}
        status: correct
    feedback: "These words appear in the neighborhood dialogue."
  fa.a1.unit33.lesson04.exercise04.dialogue_response_neighbor:
    instruction: "Respond to همسایه‌ات چطوره؟ by saying your neighbor is good."
    accepted_answers:
      - {value: "همسایه‌ام خوبه", status: correct}
      - {value: "همسایه‌ام خوبه.", status: correct}
    feedback: "همسایه‌ام خوبه means 'My neighbor is good.'"
  fa.a1.unit33.lesson04.exercise05.translate_neighbor_line:
    instruction: "Translate into English: همسایه‌ام خوبه."
    answer_language_code: en
    accepted_answers:
      - {value: "My neighbor is good", status: correct}
      - {value: "My neighbor is good.", status: correct}
      - {value: "My neighbor is nice", status: correct}
      - {value: "My neighbor is nice.", status: correct}
    feedback: "همسایه‌ام خوبه gives a basic neighbor detail."

  fa.a1.unit33.lesson05.exercise01.reading_comprehension_place:
    instruction: "What place is near Nima's house?"
    correct_option: "A park is near Nima's house."
    distractors:
      - "The post office is next to Nima's school."
      - "Nima's neighborhood is noisy and far away."
      - "Sara lives in Nima's house."
    accepted_answers: [{value: "A park is near Nima's house.", status: correct}]
    feedback: "The reading says نزدیک خونه‌اش پارک هست."
  fa.a1.unit33.lesson05.exercise02.reading_comprehension_extra:
    instruction: "What additional detail does the reading give?"
    correct_option: "The school is also nearby."
    distractors:
      - "The shop is closed today."
      - "The neighbor is busy at work."
      - "The house is messy."
    accepted_answers: [{value: "The school is also nearby.", status: correct}]
    feedback: "مدرسه هم نزدیکه means the school is also nearby."
  fa.a1.unit33.lesson05.exercise03.match_reading_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {محله: neighborhood, نیما: Nima, آرومه: "it's quiet", "خونه‌اش": "his house", هم: also, نزدیکه: "it's nearby", همسایه: neighbor, خوبه: "it's good"}
        status: correct
    feedback: "These words let you understand the short reading."
  fa.a1.unit33.lesson05.exercise04.translate_school_nearby:
    instruction: "Translate into English: مدرسه هم نزدیکه."
    answer_language_code: en
    accepted_answers:
      - {value: "The school is also nearby", status: correct}
      - {value: "The school is also nearby.", status: correct}
      - {value: "The school is near too", status: correct}
      - {value: "The school is near too.", status: correct}
    feedback: "مدرسه هم نزدیکه means 'The school is also nearby.'"
  fa.a1.unit33.lesson05.exercise05.write_neighborhood_sentence:
    instruction: "Write a short sentence describing your neighborhood."
    accepted_answers:
      - {value: "محله‌ام آرومه", status: correct}
      - {value: "محله‌ام آرومه.", status: correct}
      - {value: "محله‌ام شلوغه", status: correct}
      - {value: "محله‌ام خوبه", status: correct}
    feedback: "A short neighborhood sentence can describe it as quiet, busy, or good."

  fa.a1.unit33.lesson06.exercise01.recognize_short_message:
    instruction: "What does this short message say?"
    correct_option: "My neighborhood is quiet, and there is a park near our house."
    distractors:
      - "My house is messy, and I need help."
      - "My birthday party is tomorrow."
      - "My school is far from the station."
    accepted_answers: [{value: "My neighborhood is quiet, and there is a park near our house.", status: correct}]
    feedback: "سلام، محله‌ام آرومه. نزدیک خونه ما پارک هست gives a short neighborhood description."
  fa.a1.unit33.lesson06.exercise02.recognize_neighbor_message:
    instruction: "What does this sentence say about the neighbor?"
    correct_option: "The neighbor is good and lives next to our house."
    distractors:
      - "The neighbor is at work today."
      - "The neighbor washes the dishes."
      - "The neighbor lives near the airport."
    accepted_answers: [{value: "The neighbor is good and lives next to our house.", status: correct}]
    feedback: "همسایه‌ام خوبه و کنار خونه ما زندگی می‌کنه gives a neighbor detail."
  fa.a1.unit33.lesson06.exercise03.match_wrap_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {محله: neighborhood, همسایه: neighbor, خیابان: street, نزدیک: near, کنار: "next to", پارک: park, مدرسه: school, مغازه: shop}
        status: correct
    feedback: "This reviews the neighborhood vocabulary."
  fa.a1.unit33.lesson06.exercise04.word_order_wrap:
    instruction: "Put the words in order."
    accepted_answers: [{value: ["همسایه‌ام", کنار, خونه, ما, زندگی, "می‌کنه"], status: correct}]
    feedback: "همسایه‌ام کنار خونه ما زندگی می‌کنه means 'My neighbor lives next to our house.'"
  fa.a1.unit33.lesson06.exercise05.write_neighborhood_message:
    instruction: "Write a short message describing your neighborhood or a neighbor."
    accepted_answers:
      - {value: "سلام، محله‌ام آرومه", status: correct}
      - {value: "سلام، محله‌ام آرومه.", status: correct}
      - {value: "نزدیک خونه ما پارک هست", status: correct}
      - {value: "همسایه‌ام خوبه", status: correct}
      - {value: "همسایه‌ام کنار خونه ما زندگی می‌کنه", status: correct}
    feedback: "A neighborhood message can describe the place nearby or a neighbor."
