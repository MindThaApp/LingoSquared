teaching:
  fa.a2.unit26.lesson04.teach.arrived:
    {title: 'He or she arrived', gloss: 'he/she arrived', note: '*رسید* is the third-person past of *رسیدن*: *نیما رسید* = Nima arrived. Compare *رسیدم* = I arrived.', example_gloss: ['By the time Nima arrived, the shop had closed.']}
  fa.a2.unit26.lesson01.teach.time_words:
    {title: 'Time markers', gloss: 'when, by the time, before/already, no longer/already, still/yet, just', note: '*قبلا* and *دیگه* often reinforce that the event was already complete; *هنوز* with a negative verb means not yet.', example_gloss: ['When I arrived, the train had left.', 'By the time I arrived, the shop had closed.', 'I had already bought a ticket.', 'The train had already left.', 'I had not eaten yet.', 'I had just arrived.']}
  fa.a2.unit26.lesson01.teach.travel:
    {title: 'Travel words', gloss: 'train, ticket, station, I arrived, late', note: 'Core words for missed trains and late arrivals.', example_gloss: ['The train had left.', 'I had bought a ticket.', 'I arrived at the station.', 'I arrived late.']}
  fa.a2.unit26.lesson01.teach.places_items:
    {title: 'Places and lost items', gloss: 'shop, home, keys, food', note: 'Core words for the unit scenarios.', example_gloss: ['The shop had closed.', 'I went back home.', 'I had left the keys at home.', 'I had eaten.']}
  fa.a2.unit26.lesson01.teach.grammar_shape: {title: 'Past-perfect shape', gloss: 'past participle + past of بودن', note: '*رفته بودم* is literally the participle *رفته* plus *بودم*. It places the going before another past point.'}
  fa.a2.unit26.lesson02.teach.actions:
    {title: 'Useful participles', gloss: 'bought, eaten, closed, left behind, I returned', note: 'These forms combine with *بودم / بود / بودن*.', example_gloss: ['I had bought a ticket.', 'I had eaten.', 'The shop had closed.', 'I had left the keys at home.', 'I went back home.']}
  fa.a2.unit26.lesson02.teach.people_forms:
    {title: 'People and connectors', gloss: 'I, you, they, Nima, Sara, object marker, to, and, but, also', note: 'Nima and Sara are established friends.', example_gloss: ['I arrived late.', 'You had bought a ticket.', 'They had eaten.', 'Nima arrived at the station.', 'Sara was home.']}
  fa.a2.unit26.lesson02.teach.grammar_endings: {title: 'Spoken endings', gloss: 'I/you/he or she/we/you all/they had gone', note: 'Casual spoken plural forms use *بودین* and *بودن*.'}
  fa.a2.unit26.lesson03.teach.contrast_note: {title: 'Sequence versus earlier event', gloss: 'simple past versus past perfect', note: '*رسیدم و قطار رفت* narrates two events in sequence. *وقتی رسیدم، قطار رفته بود* marks the train departure as earlier.'}
  fa.a2.unit26.lesson03.teach.perfect_contrast: {title: 'Present perfect versus past perfect', gloss: 'رفته‌م versus رفته بودم', note: '*رفته‌م* connects a past event to now; *رفته بودم* places it before another past point.'}
  fa.a2.unit26.lesson05.teach.reading: {title: 'Nima missed the train', gloss: 'Nima arrived late at the station. When he arrived, the train had left. He had already bought a ticket, but he had left the keys at home and had gone back.', note: 'Track which events happened before the station arrival.'}
  fa.a2.unit26.lesson06.teach.line1: {title: 'Sara asks why', gloss: 'Why were you late?', note: 'Sara asks for an explanation.'}
  fa.a2.unit26.lesson06.teach.line2: {title: 'Nima explains', gloss: 'When I arrived, the train had left.', note: 'The train departure is earlier.'}
  fa.a2.unit26.lesson06.teach.line3: {title: 'Sara asks about the ticket', gloss: 'Had you bought a ticket?', note: 'A past-perfect question.'}
  fa.a2.unit26.lesson06.teach.line4: {title: 'Nima explains the delay', gloss: 'Yes, but I had left the keys at home and went back.', note: 'The keys were left before his return.'}
  fa.a2.unit26.lesson06.teach.line5: {title: 'Sara asks what followed', gloss: 'What happened next?', note: 'A natural casual follow-up.'}
  fa.a2.unit26.lesson06.teach.line6: {title: 'The shop was closed', gloss: 'By the time I arrived, the shop had closed too.', note: 'The closing happened before arrival.'}
