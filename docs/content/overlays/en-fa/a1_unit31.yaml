course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: naming celebration/birthday words (birthday,
    party, cake, gift), asking and stating when your birthday is (تولدت
    کِیه؟) using already-taught month/ordinal vocabulary, inviting someone
    to a party and accepting an invitation (میای به مهمونی؟ / آره، حتماً
    میام), a Nima/Sara birthday dialogue introducing تولدت مبارک ("happy
    birthday"), a reading passage about Nima's birthday, and a closing
    wrap-up naming celebrations you like and writing your own invitation
    or congratulation message.

units:
  fa.a1.unit31.celebrations:
    title: Celebrations

lessons:
  fa.a1.unit31.lesson01.celebration_vocabulary: {title: "Celebration & birthday words"}
  fa.a1.unit31.lesson02.birthday_date: {title: "When's your birthday?"}
  fa.a1.unit31.lesson03.invitation: {title: "Inviting someone to a party"}
  fa.a1.unit31.lesson04.birthday_dialogue: {title: "Dialogue: Birthday"}
  fa.a1.unit31.lesson05.reading_celebration: {title: "Reading about Nima's birthday"}
  fa.a1.unit31.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit31.lesson01.teach.tavallod_word:
    title: Birthday
    gloss: birthday
    note: "*تولد* is the standard word for 'birthday.'"
    example_gloss: "Today is my birthday."
  fa.a1.unit31.lesson01.teach.mehmooni_word:
    title: Party
    gloss: party
    note: "*مهمونی* is the everyday colloquial word for 'party' or 'gathering' -- adapted from the FSI source's formal *مهمانی* to this course's own established colloquial ا->و spelling (the same shift as *خواندن*->*خوندن*)."
    example_gloss: "The party is today."
  fa.a1.unit31.lesson01.teach.keik_word:
    title: Cake
    gloss: cake
    note: "*کیک* is the standard word for 'cake.'"
    example_gloss: "This cake is delicious."
  fa.a1.unit31.lesson01.teach.hedye_word:
    title: Gift
    gloss: gift
    note: "*هدیه* means 'gift' or 'present.'"
    example_gloss: "I like the gift."
  fa.a1.unit31.lesson01.teach.review_words:
    title: "Today / year / I have / and"
    gloss: "today / year / I have / and"
    note: "*امروز*, *سال* (already taught back in unit03), *دارم*, and *و*, all already established, reappear here for talking about celebrations."
  fa.a1.unit31.lesson01.teach.tavallodam_pattern:
    title: "Birthday + my + is = it's my birthday"
    gloss: "birthday + my + is = it's my birthday"
    note: "*تولد* takes the same possessive *-م* + colloquial copula *-ه* pattern already established by unit03's *سالمه*, forming *تولدمه*, 'it's my birthday.'"
  fa.a1.unit31.lesson01.teach.combined_sentence:
    title: "Today is my birthday and I have a party"
    gloss: "Today is my birthday and I have a party"
    note: "*امروز تولدمه و مهمونی دارم* combines *امروز* + *تولدمه* + *و* + *مهمونی* + *دارم*."

  fa.a1.unit31.lesson02.teach.key_word:
    title: When
    gloss: when
    note: "*کِی* means 'when' -- note the kasre mark distinguishing it from *کی* ('who')."
    example_gloss: "When's the party?"
  fa.a1.unit31.lesson02.teach.question_when_birthday:
    title: "When's your birthday?"
    gloss: "When's your birthday?"
    note: "*تولدت کِیه؟* combines *تولد* + the informal possessive *-ت* (the same suffix already established by unit03's *چند سالته؟*) + *کِیه* (*کِی* + colloquial copula *-ه*)."
  fa.a1.unit31.lesson02.teach.review_dahom_ordibehesht:
    title: "10th / Ordibehesht"
    gloss: "10th / Ordibehesht (2nd Iranian month)"
    note: "*دهم* and *اردیبهشت*, already taught back in unit10, reappear here to give a real date."
  fa.a1.unit31.lesson02.teach.answer_birthday_date:
    title: "My birthday is the 10th of Ordibehesht"
    gloss: "My birthday is the 10th of Ordibehesht"
    note: "*تولدم دهم اردیبهشته* reuses unit10's own *...اردیبهشته* contraction pattern exactly."

  fa.a1.unit31.lesson03.teach.review_davat_hatman_miam:
    title: "Invitation / definitely / I come"
    gloss: "invitation / definitely / I come"
    note: "*دعوت* (already taught back in unit12) and *حتماً*/*میام* (already taught back in unit22) reappear here for talking about parties."
  fa.a1.unit31.lesson03.teach.miai_pattern:
    title: "I come -> you come (informal)"
    gloss: "I come -> you come (informal)"
    note: "*میای* is the informal 2nd-person form of *میام*, the same kind of person-family extension unit30 already applied to *می‌خونم*/*می‌خونی*."
  fa.a1.unit31.lesson03.teach.review_be:
    title: To
    gloss: to
    note: "*به*, already taught back in unit13, reappears here for 'to the party.'"
  fa.a1.unit31.lesson03.teach.question_invite:
    title: "Will you come to my birthday party?"
    gloss: "Will you come to my birthday party?"
    note: "*میای به مهمونی تولدم؟* strings together every piece from this lesson."
  fa.a1.unit31.lesson03.teach.review_are:
    title: Yeah
    gloss: yeah
    note: "*آره*, already taught back in unit04, reappears here."
  fa.a1.unit31.lesson03.teach.answer_accept_invite:
    title: "Yeah, I'll definitely come!"
    gloss: "Yeah, I'll definitely come!"
    note: "*آره، حتماً میام!* accepts the invitation."

  fa.a1.unit31.lesson04.teach.mobarak_word:
    title: "Congratulations / happy"
    gloss: "congratulations / happy"
    note: "*مبارک* is used in phrases like *تولدت مبارک* ('happy birthday')."
    example_gloss: "Happy day! (a general well-wishing phrase)"
  fa.a1.unit31.lesson04.teach.review_dialogue_words:
    title: "Tomorrow / thanks / how nice"
    gloss: "tomorrow / thanks / how nice"
    note: "*فردا* (unit12/22), *ممنون* (established broadly), and *چه خوب* (unit30) all reappear here."
  fa.a1.unit31.lesson04.teach.dialogue_line1:
    title: "Nima: Sara, tomorrow is my birthday!"
    gloss: "Sara, tomorrow is my birthday!"
  fa.a1.unit31.lesson04.teach.dialogue_line2:
    title: "Sara: Happy birthday, Nima!"
    gloss: "Happy birthday, Nima!"
  fa.a1.unit31.lesson04.teach.dialogue_line3:
    title: "Nima: Thanks! Will you come to the party?"
    gloss: "Thanks! Will you come to the party?"
  fa.a1.unit31.lesson04.teach.dialogue_line4:
    title: "Sara: Yeah, I'll definitely come. I'll get you a gift."
    gloss: "Yeah, I'll definitely come. I'll get you a gift."
  fa.a1.unit31.lesson04.teach.dialogue_line5:
    title: "Nima: How nice! Thanks, Sara."
    gloss: "How nice! Thanks, Sara."

  fa.a1.unit31.lesson05.teach.review_migire:
    title: "I get -> he/she gets"
    gloss: "I get -> he/she gets"
    note: "*می‌گیره* is the 3rd-person colloquial form of *می‌گیرم* (already taught back in unit29/30), the same extension pattern as unit30's own *می‌خونه*."
  fa.a1.unit31.lesson05.teach.review_barash:
    title: "For you -> for him/her"
    gloss: "for you -> for him/her"
    note: "*براش* extends unit08's already-taught *برات* ('for you') to the 3rd-person object suffix."
  fa.a1.unit31.lesson05.teach.review_reading_words:
    title: "He/she / it's Nima's / he/she comes"
    gloss: "he/she / it's Nima's / he/she comes"
    note: "*او*, already well established since unit01, and *میاد*, already established back in unit12's own dialogue, are needed for talking about نیما in the 3rd person; *نیماست* combines *نیما* + *است*."
  fa.a1.unit31.lesson05.teach.reading_text:
    title: "Reading: Nima's birthday"
    gloss: "Tomorrow is Nima's birthday. Sara gets him a gift and comes to the party."
    note: "This reading reuses every fact already established in lesson04's dialogue, just told in the 3rd person."

  fa.a1.unit31.lesson06.teach.jashn_word:
    title: Celebration
    gloss: celebration
    note: "*جشن* is the general word for 'celebration,' distinct from the more specific *مهمونی* ('party')."
    example_gloss: "It's my birthday celebration."
  fa.a1.unit31.lesson06.teach.review_ha_plural:
    title: "Celebrations / birthdays"
    gloss: "celebrations / birthdays"
    note: "*جشن‌ها* and *تولدها* add the plural suffix *-ها* directly onto *جشن*/*تولد*."
  fa.a1.unit31.lesson06.teach.review_man_ro_doost:
    title: "I / object marker / I like"
    gloss: "I / object marker / I like"
    note: "*من*, *رو*, and *دوست* (all already well established) combine here for a real preference sentence about celebrations."
  fa.a1.unit31.lesson06.teach.wrap_summary:
    title: "I like celebrations and birthdays"
    gloss: "I like celebrations and birthdays"
    note: "*من جشن‌ها و تولدها رو دوست دارم* reuses the established *دوست دارم*/*رو* construction from units 14/26/28/29/30's own wrap-up lessons."

exercises:
  fa.a1.unit31.lesson01.exercise01.recognize_tavallod:
    instruction: "What does this word mean?"
    correct_option: birthday
    distractors: [party, cake, gift]
    accepted_answers: [{value: birthday, status: correct}]
    feedback: "تولد means birthday."
  fa.a1.unit31.lesson01.exercise02.recognize_mehmooni:
    instruction: "What does this word mean?"
    correct_option: party
    distractors: [birthday, cake, gift]
    accepted_answers: [{value: party, status: correct}]
    feedback: "مهمونی means party."
  fa.a1.unit31.lesson01.exercise03.match_celebration_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {تولد: birthday, مهمونی: party, کیک: cake, هدیه: gift, سال: year, "تولدمه": "it's my birthday", "امروز تولدمه و مهمونی دارم.": "Today is my birthday and I have a party."}
        status: correct
    feedback: "These cover the basics of talking about a birthday celebration."
  fa.a1.unit31.lesson01.exercise04.word_order_combined_sentence:
    instruction: "Put the words in order."
    accepted_answers: [{value: [امروز, "تولدمه", و, مهمونی, دارم], status: correct}]
    feedback: "امروز تولدمه و مهمونی دارم means 'Today is my birthday and I have a party.'"
  fa.a1.unit31.lesson01.exercise05.translate_combined_sentence:
    instruction: "Translate into English: امروز تولدمه و مهمونی دارم"
    answer_language_code: en
    accepted_answers:
      - {value: "Today is my birthday and I have a party", status: correct}
      - {value: "Today is my birthday and I have a party.", status: correct}
      - {value: "Today is my birthday, and I have a party.", status: correct}
      - {value: "Today is my birthday. I have a party.", status: correct}
    feedback: "امروز تولدمه و مهمونی دارم means 'Today is my birthday and I have a party.'"

  fa.a1.unit31.lesson02.exercise01.recognize_key:
    instruction: "What does this word mean?"
    correct_option: when
    distractors: ["10th", "Ordibehesht (2nd Iranian month)", "my birthday"]
    accepted_answers: [{value: when, status: correct}]
    feedback: "کِی means when."
  fa.a1.unit31.lesson02.exercise02.recognize_dahom:
    instruction: "What does this word mean?"
    correct_option: "10th"
    distractors: [when, "my birthday", "Ordibehesht (2nd Iranian month)"]
    accepted_answers: [{value: "10th", status: correct}]
    feedback: "دهم means 10th."
  fa.a1.unit31.lesson02.exercise03.match_date_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {کِی: when, دهم: "10th", اردیبهشت: "Ordibehesht (2nd Iranian month)", "تولدم": "my birthday", "تولدت کِیه؟": "When's your birthday?", "تولدم دهم اردیبهشته.": "My birthday is the 10th of Ordibehesht."}
        status: correct
    feedback: "These combine to ask and answer when your birthday is."
  fa.a1.unit31.lesson02.exercise04.word_order_birthday_date:
    instruction: "Put the words in order."
    accepted_answers: [{value: ["تولدم", دهم, "اردیبهشته"], status: correct}]
    feedback: "تولدم دهم اردیبهشته means 'My birthday is the 10th of Ordibehesht.'"
  fa.a1.unit31.lesson02.exercise05.translate_when_birthday:
    instruction: "Translate into English: تولدت کِیه؟"
    answer_language_code: en
    accepted_answers:
      - {value: "When's your birthday?", status: correct}
      - {value: "When is your birthday?", status: correct}
    feedback: "تولدت کِیه؟ means 'When's your birthday?'"

  fa.a1.unit31.lesson03.exercise01.recognize_miai:
    instruction: "What does this word mean?"
    correct_option: "you come (informal)"
    distractors: [invitation, definitely, to]
    accepted_answers: [{value: "you come (informal)", status: correct}]
    feedback: "میای means 'you come.'"
  fa.a1.unit31.lesson03.exercise02.recognize_davat:
    instruction: "What does this word mean?"
    correct_option: invitation
    distractors: ["you come (informal)", definitely, yeah]
    accepted_answers: [{value: invitation, status: correct}]
    feedback: "دعوت means invitation."
  fa.a1.unit31.lesson03.exercise03.match_invitation_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {دعوت: invitation, حتماً: definitely, میای: "you come (informal)", به: to, آره: yeah, "میای به مهمونی تولدم؟": "Will you come to my birthday party?", "آره، حتماً میام!": "Yeah, I'll definitely come!"}
        status: correct
    feedback: "These combine to invite someone and accept the invitation."
  fa.a1.unit31.lesson03.exercise04.word_order_invite:
    instruction: "Put the words in order."
    accepted_answers: [{value: [میای, به, مهمونی, "تولدم"], status: correct}]
    feedback: "میای به مهمونی تولدم؟ means 'Will you come to my birthday party?'"
  fa.a1.unit31.lesson03.exercise05.translate_accept_invite:
    instruction: "Translate into English: آره، حتماً میام!"
    answer_language_code: en
    accepted_answers:
      - {value: "Yeah, I'll definitely come!", status: correct}
      - {value: "Yeah, I'll definitely come.", status: correct}
    feedback: "آره، حتماً میام means 'Yeah, I'll definitely come!'"

  fa.a1.unit31.lesson04.exercise01.dialogue_comprehension_context:
    instruction: "What happened in this conversation?"
    correct_option: "It's Nima's birthday tomorrow; Sara will come to the party and bring him a gift."
    distractors:
      - "It's Sara's birthday tomorrow, and Nima can't come to the party."
      - "Neither Nima nor Sara is having a party."
      - "Nima forgot to invite Sara to the party."
    accepted_answers: [{value: "It's Nima's birthday tomorrow; Sara will come to the party and bring him a gift.", status: correct}]
    feedback: "فردا تولد نیماست -- سارا میاد و براش هدیه می‌گیره."
  fa.a1.unit31.lesson04.exercise02.recognize_mobarak:
    instruction: "What does this word mean?"
    correct_option: "congratulations / happy"
    distractors: [tomorrow, thanks, "how nice"]
    accepted_answers: [{value: "congratulations / happy", status: correct}]
    feedback: "مبارک means 'congratulations' or 'happy,' as in تولدت مبارک."
  fa.a1.unit31.lesson04.exercise03.match_dialogue_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {مبارک: "congratulations / happy", فردا: tomorrow, ممنون: thanks, برات: "for you", "می‌گیرم": "I get / I take", "تولدت مبارک، نیما!": "Happy birthday, Nima!", "میای به مهمونی؟": "Will you come to the party?"}
        status: correct
    feedback: "This reviews the whole dialogue's key vocabulary."
  fa.a1.unit31.lesson04.exercise04.dialogue_response_accept_party:
    instruction: "Respond to میای به مهمونی؟ by saying yes, you'll definitely come."
    accepted_answers:
      - {value: "آره حتماً میام", status: correct}
      - {value: "آره، حتماً میام", status: correct}
      - {value: "آره، حتماً میام.", status: correct}
      - {value: "حتماً میام", status: correct}
    feedback: "آره، حتماً میام means 'Yeah, I'll definitely come.'"
  fa.a1.unit31.lesson04.exercise05.translate_gift_line:
    instruction: "Translate into English: برات هدیه می‌گیرم."
    answer_language_code: en
    accepted_answers:
      - {value: "I'll get you a gift", status: correct}
      - {value: "I'll get you a gift.", status: correct}
      - {value: "I'm getting you a gift", status: correct}
      - {value: "I'm getting you a gift.", status: correct}
    feedback: "برات هدیه می‌گیرم means 'I'll get you a gift.'"

  fa.a1.unit31.lesson05.exercise01.reading_comprehension_whose_birthday:
    instruction: "Whose birthday is tomorrow?"
    correct_option: Nima
    distractors: [Sara, "Nima's friend", "Sara's brother"]
    accepted_answers: [{value: Nima, status: correct}]
    feedback: "فردا تولد نیماست -- tomorrow is Nima's birthday."
  fa.a1.unit31.lesson05.exercise02.reading_comprehension_what_sara_does:
    instruction: "What does Sara do for Nima's birthday?"
    correct_option: "Gets him a gift and comes to the party"
    distractors:
      - "Bakes him a cake"
      - "Can't come to the party"
      - "Forgets his birthday"
    accepted_answers: [{value: "Gets him a gift and comes to the party", status: correct}]
    feedback: "سارا براش هدیه می‌گیره و به مهمونی میاد -- Sara gets him a gift and comes to the party."
  fa.a1.unit31.lesson05.exercise03.match_reading_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"می‌گیره": "he/she gets", براش: "for him/her", او: "he/she", میاد: "he/she comes", "فردا تولد نیماست.": "Tomorrow is Nima's birthday.", "سارا براش هدیه می‌گیره و به مهمونی میاد.": "Sara gets him a gift and comes to the party."}
        status: correct
    feedback: "These words all appear in the reading passage."
  fa.a1.unit31.lesson05.exercise04.translate_tomorrow_nima:
    instruction: "Translate into English: فردا تولد نیماست"
    answer_language_code: en
    accepted_answers:
      - {value: "Tomorrow is Nima's birthday", status: correct}
      - {value: "Tomorrow is Nima's birthday.", status: correct}
    feedback: "فردا تولد نیماست means 'Tomorrow is Nima's birthday.'"
  fa.a1.unit31.lesson05.exercise05.write_own_birthday:
    instruction: "Write a true sentence about when your birthday is."
    accepted_answers:
      - {value: "تولدم دهم اردیبهشته", status: correct}
      - {value: "تولدم دهم اردیبهشته.", status: correct}
      - {value: "تولدم فردا نیست", status: correct}
    feedback: "Any true statement giving your birthday's date is accepted."

  fa.a1.unit31.lesson06.exercise01.recognize_wrap_summary:
    instruction: "What does this sentence mean?"
    correct_option: "I like celebrations and birthdays."
    distractors:
      - "I don't like celebrations at all."
      - "I never celebrate my birthday."
      - "I only like cake, not parties."
    accepted_answers: [{value: "I like celebrations and birthdays.", status: correct}]
    feedback: "من جشن‌ها و تولدها رو دوست دارم means 'I like celebrations and birthdays.'"
  fa.a1.unit31.lesson06.exercise02.recognize_jashn:
    instruction: "What does this word mean?"
    correct_option: celebration
    distractors: [birthday, party, gift]
    accepted_answers: [{value: celebration, status: correct}]
    feedback: "جشن means celebration."
  fa.a1.unit31.lesson06.exercise03.match_wrap_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {تولد: birthday, مهمونی: party, کیک: cake, هدیه: gift, مبارک: "congratulations / happy", جشن: celebration}
        status: correct
    feedback: "This reviews the whole unit's key vocabulary."
  fa.a1.unit31.lesson06.exercise04.word_order_wrap_summary:
    instruction: "Put the words in order."
    accepted_answers: [{value: [من, "جشن‌ها", و, "تولدها", رو, دوست, دارم], status: correct}]
    feedback: "من جشن‌ها و تولدها رو دوست دارم means 'I like celebrations and birthdays.'"
  fa.a1.unit31.lesson06.exercise05.write_invitation_or_congratulation:
    instruction: "Write a short message inviting someone to a celebration, or congratulating them on their birthday."
    accepted_answers:
      - {value: "تولدت مبارک", status: correct}
      - {value: "تولدت مبارک!", status: correct}
      - {value: "میای به مهمونی من؟", status: correct}
      - {value: "میای به مهمونی من؟!", status: correct}
      - {value: "جشن تولدمه، بیا", status: correct}
      - {value: "جشن تولدمه، بیا!", status: correct}
    feedback: "Any true invitation (میای به مهمونی...؟) or congratulation (تولدت مبارک) is accepted."
