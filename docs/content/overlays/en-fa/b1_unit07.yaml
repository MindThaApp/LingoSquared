    feedback: "اگر زودتر رفته بودم، حتماً رضا رو می‌دیدم means if I had gone earlier, I definitely would have seen Reza."
  fa.b1.unit07.lesson03.exercise07.write_own_counterfactual:
    instruction: "Write in Farsi: If I had gone earlier, I would have seen Reza."
    accepted_answers:
      - {value: "اگر زودتر رفته بودم، رضا رو می‌دیدم", status: correct}
      - {value: "اگر زودتر رفته بودم رضا رو می‌دیدم", status: correct}
    feedback: "اگر زودتر رفته بودم، رضا رو می‌دیدم means if I had gone earlier, I would have seen Reza."

  fa.b1.unit07.lesson04.exercise01.comprehend_why_apologizes:
    instruction: "Listen/read: Why didn't Nima come last night?"
    correct_option: "He didn't come to Reza's birthday party because he had work."
    distractors: ["He forgot Reza's birthday.", "He was rude to Reza.", "He broke a promise about money."]
