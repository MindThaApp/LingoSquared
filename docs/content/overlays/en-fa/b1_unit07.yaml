course:
  title: Farsi B1
  description: >-
    Intermediate Iranian Farsi: expressing unreal wishes with کاش, a deeper
    past-counterfactual condition with the pluperfect, and softening a
    request or preference with a bare conditional-imperfect opener, in an
    everyday between-friends scene.

units:
  fa.b1.unit07.wishes_and_regret:
    title: Wishes and Regret
    description: Express an unreal wish with کاش, a deeper past-counterfactual condition, and a softened personal request, continuing Nima and Reza's story.

lessons:
  fa.b1.unit07.lesson01.wish_present_1st2nd:
    title: "I wish I were there"
  fa.b1.unit07.lesson02.wish_present_all_persons:
    title: "All the persons"
  fa.b1.unit07.lesson03.past_counterfactual_and_negation:
    title: "If I had gone earlier"
  fa.b1.unit07.lesson04.dialogue_missed_party:
    title: "Reza's birthday party"
  fa.b1.unit07.lesson05.reading_the_missed_party:
    title: "The party that got away"
  fa.b1.unit07.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  fa.b1.unit07.lesson01.teach.kash:
    title: "if only / I wish"
    gloss: "if only / I wish"
    note: "*کاش* opens an unreal wish about the present or past, with NO separate result clause -- unlike *اگه* (unit03), which always needs a second clause stating what would happen. *کاش اونجا بودم* stands alone as a complete wish."
    example_gloss: "I wish I had time."
  fa.b1.unit07.lesson01.teach.unja_budam:
    title: "I wish I were there"
    gloss: "I wish I were there"
    note: "*اونجا بودم* -- imperfect of *بودن* (to be), matching 'I,' after *کاش*."
    example_gloss: "I wish I had been there last night."
  fa.b1.unit07.lesson01.teach.unja_budi:
    title: "you wish you were there"
    gloss: "you wish you were there"
    note: "Same imperfect form, matching 'you.'"
    example_gloss: "I wish you had been there too."
  fa.b1.unit07.lesson01.teach.grammar_kash_wish:
    title: "I wish I were there. Do you wish you were there?"
    gloss: "I wish I were there. Do you wish you were there?"
    note: "*کاش* + imperfect *بودن* (*بودم*, *بودی*...) expresses a wish that reality were otherwise, right now or about the recent past -- there is no separate 'then' clause the way *اگه* requires one. English 'I wish I were there' is the closest equivalent register."
  fa.b1.unit07.lesson01.teach.dishab:
    title: "last night"
    gloss: "last night"
    example_gloss: "I had work last night."
  fa.b1.unit07.lesson01.teach.reza:
    title: "Reza (name)"
    gloss: "Reza"
    example_gloss: "Last night was Reza's birthday party."
  fa.b1.unit07.lesson01.teach.jashne_tavallod:
    title: "birthday party"
    gloss: "birthday party"
    example_gloss: "Last night was Reza's birthday party."
  fa.b1.unit07.lesson01.teach.to:
    title: you
    gloss: you
    example_gloss: "I wish you had been there too."
  fa.b1.unit07.lesson01.teach.ham:
    title: "too / also"
    gloss: "too / also"
    example_gloss: "I wish you had been there too."

  fa.b1.unit07.lesson02.teach.unja_bud:
    title: "he/she wishes they were there"
    gloss: "he/she wishes they were there"
    example_gloss: "I wish Reza had been there too."
  fa.b1.unit07.lesson02.teach.unja_budim:
    title: "we wish we were there"
    gloss: "we wish we were there"
    example_gloss: "I wish we had been there too."
  fa.b1.unit07.lesson02.teach.unja_budid:
    title: "you (pl.) wish you were there"
    gloss: "you (pl.) wish you were there"
    example_gloss: "I wish you (pl.) had been there too."
  fa.b1.unit07.lesson02.teach.unja_budan:
    title: "they wish they were there"
    gloss: "they wish they were there"
    example_gloss: "I wish they had been there too."
  fa.b1.unit07.lesson02.teach.grammar_agreement:
    title: "I wish I were there. You wish you were there. He/she wishes they were there. We wish we were there. You (pl.) wish you were there. They wish they were there."
    gloss: "I wish I were there. You wish you were there. He/she wishes they were there. We wish we were there. You (pl.) wish you were there. They wish they were there."
    note: "*کاش* stays fixed; only *بودن*'s imperfect ending changes with the subject: *بودم* (I), *بودی* (you), *بود* (he/she), *بودیم* (we), *بودید* (you pl.), *بودن* (they) -- the same six-way agreement pattern already familiar from earlier B1 units, just on a new governing verb."
  fa.b1.unit07.lesson02.teach.reza:
    title: "Reza (name)"
    gloss: "Reza"
    example_gloss: "I wish Reza had been there."
  fa.b1.unit07.lesson02.teach.una:
    title: "they"
    gloss: "they"
    example_gloss: "I wish they had been there."
  fa.b1.unit07.lesson02.teach.ma:
    title: we
    gloss: we
    example_gloss: "I wish we had been there too."

  fa.b1.unit07.lesson03.teach.zudtar:
    title: earlier
    gloss: earlier
    example_gloss: "I wish I had come earlier."
  fa.b1.unit07.lesson03.teach.rafte_budam:
    title: "I had gone"
    gloss: "I had gone"
    note: "Pluperfect (*گذشته نقلی*) of *رفتن* -- 'had gone,' one step further back than the simple past. Used here as the if-clause of a deeper past-counterfactual condition."
    example_gloss: "If I had gone earlier, I would have seen Reza."
  fa.b1.unit07.lesson03.teach.midid:
    title: "I would have seen"
    gloss: "I would have seen"
    note: "Imperfect of *دیدن* (to see) doing double duty as the counterfactual result -- the same pattern unit03 already established for *می‌خریدم* (would buy), now on a new verb."
    example_gloss: "If I had gone earlier, I would have seen Reza."
  fa.b1.unit07.lesson03.teach.grammar_past_counterfactual:
    title: "If I had gone earlier, I would have seen Reza. If I hadn't gone, I wouldn't have seen Reza."
    gloss: "If I had gone earlier, I would have seen Reza. If I hadn't gone, I wouldn't have seen Reza."
    note: "*اگر* + PLUPERFECT (*رفته بودم*, 'I had gone') + imperfect result (*می‌دیدم*, 'I would have seen') is a deeper past-counterfactual than *اگه* + simple imperfect (unit03's *اگه پول داشتم*) -- it explicitly marks the condition as further back in the past, closer to English 'if I had gone' than 'if I went.'"
  fa.b1.unit07.lesson03.teach.narafte_budam:
    title: "I hadn't gone"
    gloss: "I hadn't gone"
    note: "Negated pluperfect: *ن* prefix on *رفته بودم*."
    example_gloss: "If I hadn't gone, I wouldn't have seen Reza."
  fa.b1.unit07.lesson03.teach.nemidid:
    title: "I wouldn't have seen"
    gloss: "I wouldn't have seen"
    example_gloss: "If I hadn't seen Reza, I would have been upset."
  fa.b1.unit07.lesson03.teach.age_agar:
    title: if
    gloss: if
    note: "*اگر* is the same word as *اگه* (unit03), just the fuller/less-contracted form -- both mean 'if' and are used interchangeably in speech."
    example_gloss: "If I had gone earlier, it would have been better."
  fa.b1.unit07.lesson03.teach.hatman:
    title: definitely
    gloss: definitely
    example_gloss: "If I had gone earlier, I definitely would have seen Reza."
  fa.b1.unit07.lesson03.teach.ro:
    title: "(object marker)"
    gloss: "(marks the direct object -- colloquial را)"
    note: "*رو* marks the direct object in casual spoken Farsi -- the same job as *را* in more formal writing. *رضا رو* = 'Reza' (as the person being seen)."
    example_gloss: "I would have seen Reza."

  fa.b1.unit07.lesson04.teach.nima:
    title: "Nima (name)"
    gloss: "Nima"
    example_gloss: "Nima had work last night."
  fa.b1.unit07.lesson04.teach.chera:
    title: why
    gloss: why
    example_gloss: "Why didn't Nima come last night?"
  fa.b1.unit07.lesson04.teach.neyumad:
    title: "(he/she) didn't come"
    gloss: "(he/she) didn't come"
    example_gloss: "Nima didn't come to Reza's birthday party last night."
  fa.b1.unit07.lesson04.teach.bebakhshid:
    title: "sorry / excuse me"
    gloss: "sorry / excuse me"
    example_gloss: "Sorry that I'm late."
  fa.b1.unit07.lesson04.teach.neyumadam:
    title: "I didn't come"
    gloss: "I didn't come"
    example_gloss: "I didn't come last night because I had work."
  fa.b1.unit07.lesson04.teach.eshkali_nadare:
    title: "it's okay / no problem"
    gloss: "it's okay / no problem"
    example_gloss: "It's okay, don't worry."
  fa.b1.unit07.lesson04.teach.jat_khali_bud:
    title: "we missed you"
    gloss: "we missed you (lit. your place was empty)"
    note: "Idiomatic -- literally 'your place was empty,' a warm, common way to tell someone they were missed."
    example_gloss: "We missed you last night."
  fa.b1.unit07.lesson04.teach.mikhastam_bepors:
    title: "I wanted to ask"
    gloss: "I wanted to ask"
    note: "*می‌خواستم* -- imperfect of the already-familiar *می‌خوام* (I want) -- used ALONE, with no *اگه*-clause at all, as a softened request/preference opener: 'I wanted to ask...' / 'I would like to ask...'. This is the outcome's 'conditional alone, no if-clause' softening use, in a casual between-friends register."
    example_gloss: "I wanted to ask if you're free tomorrow."
  fa.b1.unit07.lesson04.teach.hamdige:
    title: "see each other"
    gloss: "see each other"
    example_gloss: "Shall we see each other this weekend?"
  fa.b1.unit07.lesson04.teach.dialogue_nima_apology:
    title: "Nima: Reza, sorry I didn't come to your birthday party last night. I wish I had been there."
    gloss: "Nima: Reza, sorry I didn't come to your birthday party last night. I wish I had been there."
  fa.b1.unit07.lesson04.teach.dialogue_reza_forgive:
    title: "Reza: It's okay, but we missed you."
    gloss: "Reza: It's okay, but we missed you."
  fa.b1.unit07.lesson04.teach.dialogue_nima_counterfactual:
    title: "Nima: If I had left work earlier, I definitely would have come and seen you, but I couldn't."
    gloss: "Nima: If I had left work earlier, I definitely would have come and seen you, but I couldn't."
  fa.b1.unit07.lesson04.teach.dialogue_reza_understand:
    title: "Reza: I know, you had a lot of work."
    gloss: "Reza: I know, you had a lot of work."
  fa.b1.unit07.lesson04.teach.dialogue_nima_request:
    title: "Nima: I wanted to ask, could we see each other this weekend?"
    gloss: "Nima: I wanted to ask, could we see each other this weekend?"
  fa.b1.unit07.lesson04.teach.dialogue_reza_agree:
    title: "Reza: Yeah, definitely. I'd be happy to."
    gloss: "Reza: Yeah, definitely. I'd be happy to."

  fa.b1.unit07.lesson05.teach.az_dast_raft:
    title: "got away / was missed"
    gloss: "got away / was missed"
    note: "Idiomatic -- literally 'went out of hand,' meaning an opportunity was missed."
    example_gloss: "Last night's party got away (was missed)."
  fa.b1.unit07.lesson05.teach.hala:
    title: now
    gloss: now
    example_gloss: "Nima is upset now."
  fa.b1.unit07.lesson05.teach.narahat:
    title: "upset / sad"
    gloss: "upset / sad"
    example_gloss: "Nima was a little upset."
  fa.b1.unit07.lesson05.teach.kami:
    title: "a little"
    gloss: "a little"
    example_gloss: "He arrived a little late."
  fa.b1.unit07.lesson05.teach.gharar_gozashtan:
    title: "to make plans"
    gloss: "to make plans"
    example_gloss: "They made plans for the weekend."
  fa.b1.unit07.lesson05.teach.che_vaght:
    title: "what time / when"
    gloss: "what time / when"
    example_gloss: "What time did they make plans for?"
  fa.b1.unit07.lesson05.teach.reading_passage:
    title: "Reading: The party that got away"
    gloss: "Nima had work last night and didn't go to Reza's birthday party. If he had left work earlier, he definitely would have come and seen Reza, but he couldn't. Today he told Reza that he wished he had been there. Reza wasn't upset; he just said he had missed Nima a little. Now the two of them have made plans to see each other this weekend."

  fa.b1.unit07.lesson06.teach.grammar_review:
    title: "I wish I had been there. If I had gone earlier, I would have seen Reza. I wanted to ask, could we see each other?"
    gloss: "I wish I had been there. If I had gone earlier, I would have seen Reza. I wanted to ask, could we see each other?"
    note: "Review: unreal wish = *کاش* + imperfect *بودن* (*کاش اونجا بودم*). Deeper past-counterfactual = *اگر* + pluperfect (*رفته بودم*) + imperfect result (*می‌دیدم*), negated as *نرفته بودم*/*نمی‌دیدم*. Softened request with no if-clause at all = bare *می‌خواستم* + verb (*می‌خواستم بپرسم*). All three constructions share the same underlying idea -- softening or distancing a statement from plain present-tense fact -- in a personal, between-friends register; the professional-meetings unit later in this course applies the same softening idea in formal workplace register."
  fa.b1.unit07.lesson06.teach.emshab:
    title: tonight
    gloss: tonight
    example_gloss: "I wish I had time tonight."
  fa.b1.unit07.lesson06.teach.sara:
    title: "Sara (name)"
    gloss: "Sara"
    example_gloss: "I wish Sara had been there too."
  fa.b1.unit07.lesson06.teach.dashtam:
    title: "(I) had"
    gloss: "(I) had"
    note: "*داشتم* -- imperfect of *داشتن* (to have), matching 'I,' after *کاش* -- same wish pattern as *بودم* in lesson01, just on a different governing verb."
    example_gloss: "I wish I had time tonight."

exercises:
  fa.b1.unit07.lesson01.exercise01.recognize_kash:
    instruction: "What does this word mean?"
    correct_option: "if only / I wish"
    distractors: ["if", "maybe", "definitely"]
    accepted_answers: [{value: "if only / I wish", status: correct}]
    feedback: "کاش means if only / I wish."
  fa.b1.unit07.lesson01.exercise02.recognize_unja_budam:
    instruction: "What does this mean?"
    correct_option: "I wish I were there"
    distractors: ["I went there", "I am there", "I wish you were there"]
    accepted_answers: [{value: "I wish I were there", status: correct}]
    feedback: "اونجا بودم (after کاش) means I wish I were there."
  fa.b1.unit07.lesson01.exercise03.order_kash_dishab_unja_budam:
    instruction: "Put the words in order: I wish I had been there last night."
    accepted_answers:
      - {value: "کاش دیشب اونجا بودم", status: correct}
    feedback: "کاش دیشب اونجا بودم means I wish I had been there last night."
  fa.b1.unit07.lesson01.exercise04.match_wish_words_l1:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {کاش: "if only / I wish", "اونجا بودم": "I wish I were there", "اونجا بودی": "you wish you were there", دیشب: "last night", "جشن تولد": "birthday party", "باید می‌رفتم": "I should have gone (past regret)", چون: because, دیروز: yesterday, امیدوارم: "I hope", پارسال: "last year"}
        status: correct
    feedback: "These are this lesson's core wish words."
  fa.b1.unit07.lesson01.exercise05.translate_wish_i_were_there:
    instruction: "Translate into Farsi: I wish I had been there last night."
    accepted_answers:
      - {value: "کاش دیشب اونجا بودم", status: correct}
    feedback: "کاش دیشب اونجا بودم means I wish I had been there last night."
  fa.b1.unit07.lesson01.exercise06.speak_wish_you_were_there:
    instruction: "Say aloud in Farsi: I wish you had been there too."
    accepted_answers:
      - {value: "کاش تو هم اونجا بودی", status: correct}
    feedback: "کاش تو هم اونجا بودی means I wish you had been there too."
  fa.b1.unit07.lesson01.exercise07.write_own_wish:
    instruction: "Write in Farsi: I wish I had been at Reza's birthday party last night."
    accepted_answers:
      - {value: "کاش دیشب جشن تولد رضا اونجا بودم", status: correct}
    feedback: "This is a natural wish sentence using this lesson's vocabulary."

  fa.b1.unit07.lesson02.exercise01.recognize_unja_bud:
    instruction: "What does this mean?"
    correct_option: "he/she wishes they were there"
    distractors: ["they wish they were there", "we wish we were there", "you wish you were there"]
    accepted_answers: [{value: "he/she wishes they were there", status: correct}]
    feedback: "اونجا بود (after کاش) means he/she wishes they were there."
  fa.b1.unit07.lesson02.exercise02.recognize_unja_budan:
    instruction: "What does this mean?"
    correct_option: "they wish they were there"
    distractors: ["you (pl.) wish you were there", "we wish we were there", "he/she wishes they were there"]
    accepted_answers: [{value: "they wish they were there", status: correct}]
    feedback: "اونجا بودن (after کاش) means they wish they were there."
  fa.b1.unit07.lesson02.exercise03.order_kash_reza_unja_bud:
    instruction: "Put the words in order: I wish Reza had been there."
    accepted_answers:
      - {value: "کاش رضا اونجا بود", status: correct}
    feedback: "کاش رضا اونجا بود means I wish Reza had been there."
  fa.b1.unit07.lesson02.exercise04.match_person_forms:
    instruction: "Match each form with its meaning."
    accepted_answers:
      - value: {بودم: "I wish I were", بودی: "you wish you were", بود: "he/she wishes they were", بودیم: "we wish we were", بودید: "you pl. wish you were", بودن: "they wish they were"}
        status: correct
    feedback: "These are the six person-forms of بودن used after کاش."
  fa.b1.unit07.lesson02.exercise05.translate_wish_they_were_there:
    instruction: "Translate into Farsi: I wish they had been there."
    accepted_answers:
      - {value: "کاش اونا اونجا بودن", status: correct}
    feedback: "کاش اونا اونجا بودن means I wish they had been there."
  fa.b1.unit07.lesson02.exercise06.speak_wish_we_were_there:
    instruction: "Say aloud in Farsi: I wish we had been there too."
    accepted_answers:
      - {value: "کاش ما هم اونجا بودیم", status: correct}
    feedback: "کاش ما هم اونجا بودیم means I wish we had been there too."
  fa.b1.unit07.lesson02.exercise07.write_wish_reza_was_there:
    instruction: "Write in Farsi: I wish Reza had been there."
    accepted_answers:
      - {value: "کاش رضا اونجا بود", status: correct}
    feedback: "کاش رضا اونجا بود means I wish Reza had been there."

  fa.b1.unit07.lesson03.exercise01.recognize_rafte_budam:
    instruction: "What does this mean?"
    correct_option: "I had gone"
    distractors: ["I have gone", "I would go", "I go"]
    accepted_answers: [{value: "I had gone", status: correct}]
    feedback: "رفته بودم means I had gone (pluperfect)."
  fa.b1.unit07.lesson03.exercise02.recognize_narafte_budam:
    instruction: "What does this mean?"
    correct_option: "I hadn't gone"
    distractors: ["I haven't gone yet", "I wouldn't go", "I didn't go"]
    accepted_answers: [{value: "I hadn't gone", status: correct}]
    feedback: "نرفته بودم means I hadn't gone (negated pluperfect)."
  fa.b1.unit07.lesson03.exercise03.order_agar_zudtar_rafte_budam:
    instruction: "Put the words in order: If I had gone earlier, I would have seen Reza."
    accepted_answers:
      - {value: "اگر زودتر رفته بودم رضا رو می‌دیدم", status: correct}
    feedback: "اگر زودتر رفته بودم، رضا رو می‌دیدم means if I had gone earlier, I would have seen Reza."
  fa.b1.unit07.lesson03.exercise04.match_counterfactual_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {زودتر: earlier, "رفته بودم": "I had gone", می‌دیدم: "I would have seen", "نرفته بودم": "I hadn't gone", نمی‌دیدم: "I wouldn't have seen", حتماً: definitely}
