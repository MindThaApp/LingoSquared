exercises:
  fa.b1.unit13.lesson01.exercise01.recognize_vaghti:
    instruction: What does this word mean?
    correct_option: when
    distractors:
    - if
    - because
    - although
    accepted_answers:
    - value: when
      status: correct
    feedback: '*وقتی* means when.'
  fa.b1.unit13.lesson01.exercise02.recognize_tamum_beshe:
    instruction: What does this phrase mean?
    correct_option: it is done / finishes
    distractors:
    - it starts
    - it rains
    - it changes
    accepted_answers:
    - value: it is done / finishes
      status: correct
    feedback: '*تموم بشه* means it is done or finishes.'
  fa.b1.unit13.lesson01.exercise03.order_future_time:
    instruction: 'Put the words in order: When my work is done, I will call you.'
    accepted_answers:
    - value: وقتی کارم تموم بشه بهت زنگ می‌زنم
      status: correct
    feedback: The وقتی-clause comes first here.
  fa.b1.unit13.lesson01.exercise04.match_future_time:
    instruction: Match each phrase with its meaning.
    accepted_answers:
    - value:
        وقتی: when
        کارم: my work
        تموم بشه: is done
        زنگ می‌زنم: I will call
        کارم تموم بشه: my work is done
        بهت زنگ می‌زنم: I will call you
      status: correct
    feedback: These phrases build the future time clause.
  fa.b1.unit13.lesson01.exercise05.translate_when_done_call:
    instruction: 'Translate into Farsi: When my work is done, I will call you.'
    accepted_answers:
    - value: وقتی کارم تموم بشه، بهت زنگ می‌زنم
      status: correct
    - value: وقتی کارم تموم بشه بهت زنگ می‌زنم
      status: correct
    feedback: Use *وقتی* plus *بشه*.
  fa.b1.unit13.lesson01.exercise06.speak_when_done:
    instruction: 'Say aloud in Farsi: When my work is done, I will call you.'
    accepted_answers:
    - value: وقتی کارم تموم بشه، بهت زنگ می‌زنم
      status: correct
    - value: وقتی کارم تموم بشه بهت زنگ می‌زنم
