course:
  title: "Farsi A1"
  description: "Beginner Farsi for finding common places and understanding basic directions."

units:
  fa.a1.unit05.places_and_directions: {title: "Places and giving directions"}

lessons:
  fa.a1.unit05.lesson01.hotel_restaurant: {title: "Hotel and restaurant"}
  fa.a1.unit05.lesson02.samt_rast_chap: {title: "Right side and left side"}
  fa.a1.unit05.lesson03.mostaghim_va_narahi: {title: "Going straight and asking directions"}
  fa.a1.unit05.lesson04.dialogue_narahi: {title: "Finding the hotel"}

teaching:
  fa.a1.unit05.lesson01.teach.hotel: {title: "Hotel", gloss: hotel, note: "هتل is the ordinary Persian word for a hotel.", example_gloss: "Our hotel is close."}
  fa.a1.unit05.lesson01.teach.restoran: {title: "Restaurant", gloss: restaurant, note: "رستوران is a common loanword used for a restaurant.", example_gloss: "This restaurant is good."}
  fa.a1.unit05.lesson01.teach.dastshooyi: {title: "Restroom", gloss: restroom, note: "دستشویی is the everyday word for restroom/washroom.", example_gloss: "Where is the restroom?"}
  fa.a1.unit05.lesson01.teach.inja_oonja: {title: "Here, there", gloss: "here, there", note: "اینجا (here) and اونجا (there, colloquial spoken form of آنجا) are the everyday spoken forms."}
  fa.a1.unit05.lesson01.teach.kojast: {title: "Where is the hotel?", gloss: "Where is the hotel?", note: "کجاست combines کجا (where) with است (is)."}
  fa.a1.unit05.lesson01.teach.bebakhshid: {title: "Excuse me, where is the hotel?", gloss: "Excuse me, where is the hotel?", note: "ببخشید (excuse me) is the standard polite way to open a question to a stranger."}

  fa.a1.unit05.lesson02.teach.samt: {title: "Side, direction", gloss: "side, direction", note: "سمت is used with راست/چپ to mean 'the right/left side'.", example_gloss: "The hotel is this way."}
  fa.a1.unit05.lesson02.teach.rast: {title: "Right", gloss: right, note: "راست also means 'true/correct' in other contexts, but here it means the direction.", example_gloss: "Go right."}
  fa.a1.unit05.lesson02.teach.chap: {title: "Left", gloss: left, note: "چپ, the direction.", example_gloss: "Go left."}
  fa.a1.unit05.lesson02.teach.samte_rast: {title: "It's on the right", gloss: "It's on the right.", note: "In everyday speech, سمت راست است becomes سمت راسته."}
  fa.a1.unit05.lesson02.teach.samte_chap: {title: "It's on the left", gloss: "It's on the left.", note: "In everyday speech, سمت چپ است becomes سمت چپه."}
  fa.a1.unit05.lesson02.teach.restoran_samte_rast: {title: "The restaurant is on the right", gloss: "The restaurant is on the right.", note: "Combines رستوران with the location phrase from this lesson."}

  fa.a1.unit05.lesson03.teach.mostaghim: {title: "Straight ahead", gloss: "straight ahead", note: "مستقیم, the everyday word for going straight.", example_gloss: "Go straight."}
  fa.a1.unit05.lesson03.teach.berid: {title: "Go (polite)", gloss: "go (polite)", note: "برید is the respectful form to use when telling a stranger to go somewhere.", example_gloss: "Go to the right."}
  fa.a1.unit05.lesson03.teach.mostaghim_berid: {title: "Go straight ahead", gloss: "Go straight ahead.", note: "مستقیم برید — the standard polite instruction."}
  fa.a1.unit05.lesson03.teach.bad: {title: "After that, then", gloss: "after that, then", note: "بعد links two direction steps together.", example_gloss: "Then go to the left."}
  fa.a1.unit05.lesson03.teach.mostaghim_bad_samte_rast: {title: "Go straight; there's a restaurant on the right", gloss: "Go straight ahead. Then there's a restaurant on the right.", note: "This reuses سمت راست (on the right) from the previous lesson and completes it with a landmark."}
  fa.a1.unit05.lesson03.teach.mamnoon: {title: "Thank you. You're welcome.", gloss: "Thank you. You're welcome.", note: "ممنون / خواهش می‌کنم is the standard polite exchange, already seen in unit01."}

  fa.a1.unit05.lesson04.teach.kenar: {title: "Next to", gloss: "next to, beside", note: "کنار places one thing next to another: هتل کنار رستورانه means 'the hotel is next to the restaurant.'", example_gloss: "The hotel is next to the restaurant."}
  fa.a1.unit05.lesson04.teach.azadi: {title: "Azadi (name)", gloss: "Azadi (freedom)", note: "آزادی is widely used in Iranian place and business names, so هتل آزادی sounds like a natural hotel name.", example_gloss: "Azadi Square is famous."}
  fa.a1.unit05.lesson04.teach.hamoon: {title: "That same one", gloss: "that same one", note: "همون is the everyday spoken form of همان and points back to the restaurant just mentioned.", example_gloss: "That same restaurant is good."}
  fa.a1.unit05.lesson04.teach.dialogue_line1: {title: "Excuse me, where is the Azadi hotel?", gloss: "Sara: Excuse me, where is the Azadi hotel?", note: "Sara is the established character from unit02."}
  fa.a1.unit05.lesson04.teach.dialogue_line2: {title: "Go straight; the hotel is next to the restaurant", gloss: "Passer-by: Go straight ahead. Then there's a restaurant on the right. The hotel is next to that restaurant.", note: "کنار means 'next to'; همون رستورانه points back to the restaurant just mentioned."}
  fa.a1.unit05.lesson04.teach.dialogue_line3: {title: "Thank you", gloss: "Sara: Thank you.", note: "Sara thanks the passer-by."}
  fa.a1.unit05.lesson04.teach.dialogue_line4: {title: "You're welcome", gloss: "Passer-by: You're welcome.", note: "The passer-by closes the exchange politely."}

exercises:
  fa.a1.unit05.lesson01.exercise01.choose_hotel:
    instruction: "Choose the Farsi word for 'hotel'."
    correct_option: هتل
    distractors: [رستوران, دستشویی, اینجا]
    accepted_answers: [{value: هتل, status: correct}]
    feedback: "هتل means hotel."
  fa.a1.unit05.lesson01.exercise02.choose_restoran:
    instruction: "Choose the Farsi word for 'restaurant'."
    correct_option: رستوران
    distractors: [هتل, دستشویی, اونجا]
    accepted_answers: [{value: رستوران, status: correct}]
    feedback: "رستوران means restaurant."
  fa.a1.unit05.lesson01.exercise03.match_places:
    instruction: "Match each Farsi word to its English meaning."
    accepted_answers:
      - value: [{left: هتل, right: hotel}, {left: رستوران, right: restaurant}, {left: دستشویی, right: restroom}, {left: اینجا, right: here}, {left: اونجا, right: there}, {left: "هتل کجاست؟", right: "Where is the hotel?"}]
        status: correct
    feedback: "هتل/رستوران/دستشویی are hotel/restaurant/restroom; اینجا/اونجا are here/there; هتل کجاست؟ asks where the hotel is."
  fa.a1.unit05.lesson01.exercise04.order_bebakhshid:
    instruction: "Put the words in order to say 'Excuse me, where is the hotel?'"
    correct_option: ببخشید هتل کجاست
    accepted_answers: [{value: "ببخشید هتل کجاست", status: correct}]
    feedback: "ببخشید، هتل کجاست؟"
  fa.a1.unit05.lesson01.exercise05.translate_restroom:
    instruction: "Translate into Farsi: restroom."
    accepted_answers: [{value: دستشویی, status: correct}]
    feedback: "دستشویی means restroom."
  fa.a1.unit05.lesson01.exercise06.fill_kojast:
    instruction: "Fill in the missing word to ask 'Where is the hotel?'"
    accepted_answers: [{value: کجاست, status: correct}, {value: "کجاست؟", status: correct}]
    feedback: "هتل کجاست؟ — where is the hotel?"

  fa.a1.unit05.lesson02.exercise01.choose_rast:
    instruction: "Choose the Farsi word for 'right'."
    correct_option: راست
    distractors: [چپ, سمت, رستوران]
    accepted_answers: [{value: راست, status: correct}]
    feedback: "راست means right."
  fa.a1.unit05.lesson02.exercise02.choose_chap:
    instruction: "Choose the Farsi word for 'left'."
    correct_option: چپ
    distractors: [راست, سمت, هتل]
    accepted_answers: [{value: چپ, status: correct}]
    feedback: "چپ means left."
  fa.a1.unit05.lesson02.exercise03.match_sides:
    instruction: "Match each word or phrase to its English meaning."
    accepted_answers:
      - value: [{left: راست, right: right}, {left: چپ, right: left}, {left: "سمت راسته", right: "it's on the right"}, {left: "سمت چپه", right: "it's on the left"}, {left: هتل, right: hotel}, {left: رستوران, right: restaurant}, {left: دستشویی, right: restroom}]
        status: correct
    feedback: "راست/چپ are right/left; سمت راسته/سمت چپه mean it's on the right/left; the last three review lesson01's places."
  fa.a1.unit05.lesson02.exercise04.order_restoran_samte_rast:
    instruction: "Put the words in order to say 'The restaurant is on the right.'"
    correct_option: "رستوران سمت راسته"
    accepted_answers: [{value: "رستوران سمت راسته", status: correct}]
    feedback: "رستوران سمت راسته."
  fa.a1.unit05.lesson02.exercise05.translate_left:
    instruction: "Translate into Farsi: left."
    accepted_answers: [{value: چپ, status: correct}]
    feedback: "چپ means left."
  fa.a1.unit05.lesson02.exercise06.fill_samte:
    instruction: "Fill in the missing word to say 'The restaurant is on the right.'"
    accepted_answers: [{value: سمت, status: correct}]
    feedback: "رستوران سمت راسته — the restaurant is on the right."

  fa.a1.unit05.lesson03.exercise01.choose_mostaghim:
    instruction: "Choose the meaning of 'مستقیم'."
    correct_option: "straight ahead"
    distractors: ["to the right", "to the left", "after that"]
    accepted_answers: [{value: "straight ahead", status: correct}]
    feedback: "مستقیم means straight ahead."
  fa.a1.unit05.lesson03.exercise02.choose_bad:
    instruction: "Choose the meaning of 'بعد'."
    correct_option: "after that"
    distractors: ["straight ahead", "right", "left"]
    accepted_answers: [{value: "after that", status: correct}]
    feedback: "بعد means after that / then."
  fa.a1.unit05.lesson03.exercise03.match_direction_words:
    instruction: "Match each word to its English meaning."
    accepted_answers:
      - value: [{left: مستقیم, right: "straight ahead"}, {left: برید, right: "go"}, {left: بعد, right: "after that"}, {left: سمت, right: side}, {left: راست, right: right}, {left: چپ, right: left}]
        status: correct
    feedback: "مستقیم/برید/بعد are straight ahead/go/after that; سمت/راست/چپ are side/right/left."
  fa.a1.unit05.lesson03.exercise04.order_mostaghim_berid:
    instruction: "Put the words in order to say 'Go straight ahead.'"
    correct_option: "مستقیم برید"
    accepted_answers: [{value: "مستقیم برید", status: correct}]
    feedback: "مستقیم برید."
  fa.a1.unit05.lesson03.exercise05.translate_after_that:
    instruction: "Translate into Farsi: after that."
    accepted_answers:
      - {value: بعد, status: correct}
      - {value: بعدش, status: acceptable_with_note, note: "Natural colloquial alternative meaning 'after that'; the lesson models بعد."}
    feedback: "بعد means after that."
  fa.a1.unit05.lesson03.exercise06.writing_directions:
    instruction: "Write one short direction instruction using مستقیم."
    accepted_answers:
      - {value: "مستقیم برید", status: correct}
      - {value: "مستقیم برید.", status: correct}
      - {value: "برید مستقیم", status: correct}
      - {value: "برید مستقیم.", status: correct}
      - {value: "مستقیم برین", status: correct}
      - {value: "مستقیم برین.", status: correct}
      - {value: "مستقیم برو.", status: acceptable_with_note, note: "Correct informal form; the lesson models the polite برید."}
      - {value: "مستقیم بروید.", status: acceptable_with_note, note: "Correct careful-written form; the lesson models everyday spoken برید."}
      - {value: "مستقیم برو", status: acceptable_with_note, note: "Correct informal form; the lesson models the polite برید."}
      - {value: "مستقیم بروید", status: acceptable_with_note, note: "Correct careful-written form; the lesson models everyday spoken برید."}
    feedback: "مستقیم برید is the model answer; the informal مستقیم برو is also correct."

  fa.a1.unit05.lesson04.exercise01.comprehend_destination:
    instruction: "Read the conversation. What place is Sara looking for?"
    answer_language_code: en
    correct_option: "The Azadi hotel"
    distractors: ["A restaurant", "A restroom", "A taxi"]
    accepted_answers: [{value: "The Azadi hotel", status: correct}]
    feedback: "Sara asks ببخشید، هتل آزادی کجاست؟ — she's looking for the Azadi hotel."
  fa.a1.unit05.lesson04.exercise02.comprehend_landmark:
    instruction: "Read the conversation. What is the hotel located next to?"
    answer_language_code: en
    correct_option: "A restaurant"
    distractors: ["A bank", "A hospital", "A bus stop"]
    accepted_answers: [{value: "A restaurant", status: correct}]
    feedback: "هتل کنار همون رستورانه — the hotel is next to that restaurant."
  fa.a1.unit05.lesson04.exercise03.match_dialogue_lines:
    instruction: "Match each word or line to its English meaning."
    accepted_answers:
      - value: [{left: "ببخشید، هتل آزادی کجاست؟", right: "Excuse me, where is the Azadi hotel?"}, {left: "مستقیم برید", right: "Go straight ahead"}, {left: "ممنون", right: "Thank you"}, {left: "خواهش می‌کنم", right: "You're welcome"}, {left: کنار, right: "next to"}, {left: همون, right: "that same"}]
        status: correct
    feedback: "Each phrase matches its meaning from the dialogue; کنار/همون are the two new words this lesson adds."
  fa.a1.unit05.lesson04.exercise04.order_full_direction:
    instruction: "Put the words in order to say 'Go straight ahead. Then there's a restaurant on the right.'"
    correct_option: "مستقیم برید بعد سمت راست یه رستوران هست"
    accepted_answers:
      - {value: "مستقیم برید بعد سمت راست یه رستوران هست", status: correct}
      - {value: "مستقیم برید بعد یه رستوران سمت راست هست", status: correct}
      - {value: "مستقیم برید بعد یه رستوران هست سمت راست", status: correct}
    feedback: "مستقیم برید. بعد سمت راست یه رستوران هست."
  fa.a1.unit05.lesson04.exercise05.speak_ask_directions:
    instruction: "Ask a stranger where the Azadi hotel is."
    accepted_answers:
      - {value: "ببخشید، هتل آزادی کجاست؟", status: correct}
      - {value: "ببخشید، هتل آزادی کجاست", status: correct}
      - {value: "ببخشید هتل آزادی کجاست", status: correct}
      - {value: "ببخشید هتل آزادی کجاست؟", status: correct}
      - {value: "هتل آزادی کجاست؟", status: acceptable_with_note, note: "Correct and understood, but omits the polite ببخشید opener the lesson models."}
    feedback: "ببخشید، هتل آزادی کجاست؟ is the modeled polite question."
  fa.a1.unit05.lesson04.exercise06.writing_full_directions:
    instruction: "Write the directions Sara is given, from 'go straight' to the restaurant on the right."
    accepted_answers:
      - {value: "مستقیم برید، بعد سمت راست یه رستوران هست", status: correct}
      - {value: "مستقیم برید. بعد سمت راست یه رستوران هست.", status: correct}
      - {value: "مستقیم برید بعد سمت راست یه رستوران هست", status: correct}
      - {value: "مستقیم برید، بعد سمت راست یه رستوران هست.", status: correct}
      - {value: "مستقیم برید. بعد سمت راست یه رستوران هست", status: correct}
      - {value: "مستقیم برید بعد سمت راست یه رستوران هست.", status: correct}
    feedback: "مستقیم برید. بعد سمت راست یه رستوران هست. — Go straight ahead. Then there's a restaurant on the right."
