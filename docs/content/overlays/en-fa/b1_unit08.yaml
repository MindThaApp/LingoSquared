course:
  title: Farsi B1
  description: >-
    Intermediate Iranian Farsi: conceding a valid point on the other side
    of an argument with هرچند/با اینکه before restating your own position
    with a stronger contrastive connector than a plain "but," continuing
    Reza and Nargess's remote-work debate.

units:
  fa.b1.unit08.nuanced_debate:
    title: Debating with Nuance
    description: Concede a point on the other side of an argument, then restate your own position using a stronger contrastive connector, continuing Reza and Nargess's debate about remote work.

lessons:
  fa.b1.unit08.lesson01.harchand_concession:
    title: "Although it's good, but..."
  fa.b1.unit08.lesson02.ba_inke_concession:
    title: "Even though... nevertheless..."
  fa.b1.unit08.lesson03.stronger_contrast_and_review:
    title: "Still / however"
  fa.b1.unit08.lesson04.dialogue_nuanced_debate:
    title: "Nargess and Reza's debate"
  fa.b1.unit08.lesson05.reading_the_nuanced_debate:
    title: "A debate with nuance"
  fa.b1.unit08.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  fa.b1.unit08.lesson01.teach.harchand:
    title: although
    gloss: although
    note: "*هرچند* opens a concessive clause -- conceding a point before the main clause, usually paired with *اما* or *ولی* in the result clause."
    example_gloss: "Although I'm tired, I work."
  fa.b1.unit08.lesson01.teach.durkari:
    title: "remote work"
    gloss: "remote work"
    example_gloss: "Remote work is good."
  fa.b1.unit08.lesson01.teach.khoobe:
    title: "it's good"
    gloss: "it's good"
    example_gloss: "Remote work is good."
  fa.b1.unit08.lesson01.teach.khastam:
    title: "I'm tired"
    gloss: "I'm tired"
    example_gloss: "Although I'm tired, I work."
  fa.b1.unit08.lesson01.teach.kar_mikonam:
    title: "I work"
    gloss: "I work"
    example_gloss: "Although I'm tired, I work."
  fa.b1.unit08.lesson01.teach.ama:
    title: "but (contrastive)"
    gloss: "but (contrastive)"
    note: "*اما* is a slightly more formal/written contrastive connector than the everyday *ولی* -- both mean 'but,' and *اما* pairs naturally with a preceding *هرچند* clause."
    example_gloss: "Although remote work is good, sometimes it's hard."
  fa.b1.unit08.lesson01.teach.gahi:
    title: sometimes
    gloss: sometimes
    example_gloss: "Sometimes I get tired."
  fa.b1.unit08.lesson01.teach.sakhte:
    title: "it's hard"
    gloss: "it's hard"
    example_gloss: "Sometimes remote work is hard."
  fa.b1.unit08.lesson01.teach.grammar_harchand:
    title: "Although remote work is good, sometimes it's hard."
    gloss: "Although remote work is good, sometimes it's hard."
    note: "*هرچند [concession], اما [main point]* -- concede a real point on the other side, then state your actual view. This is real B1 nuance, distinct from a flat opinion statement: it shows you've considered the counterargument rather than ignoring it."

  fa.b1.unit08.lesson02.teach.ba_inke:
    title: "even though"
    gloss: "even though"
    note: "*با اینکه* is a close synonym of *هرچند* -- both open a concessive clause. *با اینکه* is slightly more common in everyday speech."
    example_gloss: "Even though I'm sometimes alone, I like my work."
  fa.b1.unit08.lesson02.teach.tanha_mimunam:
    title: "I stay/remain alone"
    gloss: "I stay/remain alone"
    example_gloss: "Sometimes I stay alone."
  fa.b1.unit08.lesson02.teach.dar_eyne_hal:
    title: "nevertheless / at the same time"
    gloss: "nevertheless / at the same time"
    note: "*در عین حال* is a STRONGER contrastive connector than plain *ولی* -- it links two independent clauses (not subordinating one to the other), useful for a multi-point argument where you want the second point to stand on its own."
    example_gloss: "Nevertheless, I do my work better."
  fa.b1.unit08.lesson02.teach.anjam_midam:
    title: "I do (a task)"
    gloss: "I do (a task)"
    example_gloss: "I do my work better."
  fa.b1.unit08.lesson02.teach.behtar:
    title: better
    gloss: better
    example_gloss: "I do my work better."
  fa.b1.unit08.lesson02.teach.karam_ro:
    title: "my work"
    gloss: "my work"
    example_gloss: "I do my work better."
  fa.b1.unit08.lesson02.teach.doost_daram:
    title: "I like"
    gloss: "I like"
    example_gloss: "I like my work."
  fa.b1.unit08.lesson02.teach.grammar_ba_inke:
    title: "Even though I sometimes stay alone, nevertheless I do my work better."
    gloss: "Even though I sometimes stay alone, nevertheless I do my work better."
    note: "*با اینکه [concession], در عین حال [main point]* -- the same concession-then-restatement shape as *هرچند...اما*, but with *در عین حال* linking two independent clauses instead of subordinating the second to the first. Both patterns are correct; native speakers mix them freely within the same argument."

  fa.b1.unit08.lesson03.teach.ba_in_hal:
    title: "still / however"
    gloss: "still / however"
    note: "*با این حال* stands alone at the start of a new sentence (unlike *در عین حال*, which links two clauses within one sentence) -- 'still' / 'however,' introducing a restated or independent point after a concession already made."
    example_gloss: "Still, I think it's better to go to the office."
  fa.b1.unit08.lesson03.teach.ertebat:
    title: communication
    gloss: communication
    example_gloss: "Communication with the team gets harder."
  fa.b1.unit08.lesson03.teach.tim:
    title: team
    gloss: team
    example_gloss: "Communication with the team matters."
  fa.b1.unit08.lesson03.teach.sakhtar_mishe:
    title: "becomes harder"
    gloss: "becomes harder"
    example_gloss: "Communication with the team becomes harder."
  fa.b1.unit08.lesson03.teach.hadeaghal:
    title: "at least"
    gloss: "at least"
    example_gloss: "At least let's go to the office some days."
  fa.b1.unit08.lesson03.teach.bazi_ruza:
    title: "some days"
    gloss: "some days"
    example_gloss: "At least let's go to the office some days."
  fa.b1.unit08.lesson03.teach.daftar:
    title: office
    gloss: "office / let's go"
    note: "*بریم* -- subjunctive 'let's go' -- is bundled with *دفتر* (office) here since they always occur together in this unit's examples."
    example_gloss: "It's better if we go to the office."
  fa.b1.unit08.lesson03.teach.grammar_stronger_contrast:
    title: "Although remote work is good, sometimes it's hard. Still, I think remote work is better after all."
    gloss: "Although remote work is good, sometimes it's hard. Still, I think remote work is better after all."
    note: "*با این حال* opens a fresh sentence restating a position after a concession, distinct from *در عین حال* (which links two clauses within one sentence) -- both are stronger than plain *ولی*, useful for structuring a multi-point argument."

  fa.b1.unit08.lesson04.teach.reza:
    title: "Reza (name)"
    gloss: "Reza"
    example_gloss: "Reza likes remote work."
  fa.b1.unit08.lesson04.teach.nargess:
    title: "Nargess (name)"
    gloss: "Nargess"
    example_gloss: "Nargess has doubts about remote work."
  fa.b1.unit08.lesson04.teach.che_fekri_mikone:
    title: "what does he/she think?"
    gloss: "what does he/she think?"
    example_gloss: "What does Reza think about remote work?"
  fa.b1.unit08.lesson04.teach.bazam_behtare:
    title: "it's still better"
    gloss: "it's still better"
    example_gloss: "I think it's still better."
  fa.b1.unit08.lesson04.teach.harfet_ro_ghabul_daram:
    title: "I accept your point"
    gloss: "I accept your point"
    example_gloss: "Even though I accept your point, my opinion is different."
  fa.b1.unit08.lesson04.teach.doroste:
    title: "that's true"
    gloss: "that's true"
    example_gloss: "That's true, but I still think it's better to go to the office."
  fa.b1.unit08.lesson04.teach.hanuz:
    title: still
    gloss: still
    example_gloss: "I still think it's better to go to the office."
  fa.b1.unit08.lesson04.teach.dialogue_reza_position:
    title: "Reza: Although remote work is hard sometimes, I still think it's better after all."
    gloss: "Reza: Although remote work is hard sometimes, I still think it's better after all."
  fa.b1.unit08.lesson04.teach.dialogue_nargess_concede:
    title: "Nargess: Even though I accept your point, nevertheless I think communication with the team gets harder."
    gloss: "Nargess: Even though I accept your point, nevertheless I think communication with the team gets harder."
  fa.b1.unit08.lesson04.teach.dialogue_reza_concede:
    title: "Reza: That's true, but even though I sometimes stay alone, nevertheless I do my work better."
    gloss: "Reza: That's true, but even though I sometimes stay alone, nevertheless I do my work better."
  fa.b1.unit08.lesson04.teach.dialogue_nargess_restate:
    title: "Nargess: Still, I still think it's better if we go to the office at least some days."
    gloss: "Nargess: Still, I still think it's better if we go to the office at least some days."

  fa.b1.unit08.lesson05.teach.hardo:
    title: both
    gloss: both
    example_gloss: "Both people have their own opinion."
  fa.b1.unit08.lesson05.teach.nazar:
    title: opinion
    gloss: opinion
    example_gloss: "Reza's opinion differs from Nargess's opinion."
  fa.b1.unit08.lesson05.teach.farq_dare:
    title: "is different"
    gloss: "is different"
    example_gloss: "Their opinions are different from each other."
  fa.b1.unit08.lesson05.teach.hich_kodum:
    title: "neither one"
    gloss: "neither one"
    example_gloss: "Neither one changed their opinion."
  fa.b1.unit08.lesson05.teach.che_chizi:
    title: what
    gloss: what
    example_gloss: "What does Nargess accept from Reza's argument?"
  fa.b1.unit08.lesson05.teach.aya_shod:
    title: "did it change?"
    gloss: "did it change?"
    example_gloss: "Did their opinion change?"
  fa.b1.unit08.lesson05.teach.reading_passage:
    title: "Reading: A debate with nuance"
    gloss: "Reza and Nargess are debating remote work. Reza thinks that although remote work is hard sometimes, it's still better after all. Nargess says that even though she accepts Reza's point, nevertheless she thinks communication with the team gets harder. Reza also admits that even though he's sometimes alone, nevertheless he does his work better. Still, Nargess still thinks it's better to go to the office at least some days. Both of them stated their opinions respectfully, but neither one changed their mind."

  fa.b1.unit08.lesson06.teach.grammar_review:
    title: "Although remote work is good, sometimes it's hard. Even though I'm sometimes alone, nevertheless I do my work better. Still, I think it's better to go to the office."
    gloss: "Although remote work is good, sometimes it's hard. Even though I'm sometimes alone, nevertheless I do my work better. Still, I think it's better to go to the office."
    note: "Review: *هرچند*/*با اینکه* + concession, *اما*/*در عین حال* + main point (within one sentence); *با این حال* opens a fresh restating sentence after the concession. All three constructions concede a valid point before restating your own position -- the real B1 skill this unit teaches."
  fa.b1.unit08.lesson06.teach.emruz:
    title: today
    gloss: today
    example_gloss: "Today I must work."

