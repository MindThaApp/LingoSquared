course:
  title: Farsi B1
  description: >-
    Intermediate Iranian Farsi: reporting what someone said or asked --
    yes/no and wh-questions, and the pronoun shift a first-person original
    statement needs when someone else reports it -- continuing Nima,
    Reza, and Sara's story.

units:
  fa.b1.unit11.reported_speech:
    title: Reported Speech
    description: Report what someone said or asked, including yes/no and wh-questions, and shift pronouns correctly when reporting someone else's own statement.

lessons:
  fa.b1.unit11.lesson01.reported_yes_no_question:
    title: "She asked whether..."
  fa.b1.unit11.lesson02.reported_wh_question:
    title: "She asked when..."
  fa.b1.unit11.lesson03.pronoun_shift_and_plural_goftan:
    title: "She said she herself..."
  fa.b1.unit11.lesson04.dialogue_reporting_sara:
    title: "What did Sara say?"
  fa.b1.unit11.lesson05.reading_the_reported_conversation:
    title: "Recounting a conversation"
  fa.b1.unit11.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  fa.b1.unit11.lesson01.teach.porsid:
    title: "he/she asked"
    gloss: "he/she asked"
    example_gloss: "Sara asked whether you have time."
  fa.b1.unit11.lesson01.teach.aya:
    title: whether
    gloss: whether
    note: "*آیا* introduces a reported YES/NO question -- unit06's reported speech only covered statements (*گفت که...*); this is the first reported QUESTION construction this course teaches."
    example_gloss: "She asked whether you have time."
  fa.b1.unit11.lesson01.teach.vaght_dari:
    title: "you have time"
    gloss: "you have time"
    example_gloss: "Sara asked whether you have time."
  fa.b1.unit11.lesson01.teach.grammar_reported_yes_no:
    title: "Sara asked whether you have time."
    gloss: "Sara asked whether you have time."
    note: "*پرسید که آیا [statement]* reports a yes/no question -- the embedded clause keeps normal statement word order (no question inversion), with *آیا* marking it as originally a yes/no question."
  fa.b1.unit11.lesson01.teach.sara:
    title: "Sara (name)"
    gloss: "Sara"
    example_gloss: "Sara asked whether you have time."

  fa.b1.unit11.lesson02.teach.key:
    title: when
    gloss: when
    note: "*کِی* ('when') stays in place inside the reported clause, same word order as the original direct question -- Persian doesn't invert word order for embedded questions the way English sometimes does."
    example_gloss: "Sara asked when you're coming."
  fa.b1.unit11.lesson02.teach.miay:
    title: "you're coming"
    gloss: "you're coming"
    example_gloss: "Sara asked when you're coming."
  fa.b1.unit11.lesson02.teach.grammar_reported_wh:
    title: "Sara asked when you're coming."
    gloss: "Sara asked when you're coming."
    note: "*پرسید که کِی میای* -- reporting a WH-question keeps the original question word (*کِی*, *کجا*, ...) right where it was, embedded after *که*."
  fa.b1.unit11.lesson02.teach.koja_miri:
    title: "where you're going"
    gloss: "where you're going"
    example_gloss: "She asked where you're going."
  fa.b1.unit11.lesson02.teach.bad:
    title: "after that"
    gloss: "after that"
    example_gloss: "After that, she asked when you're coming."

  fa.b1.unit11.lesson03.teach.khodesh:
    title: "he/she himself/herself"
    gloss: "he/she himself/herself"
    note: "*خودش* marks the PRONOUN SHIFT reported speech needs: Sara's own words were *من می‌رم* ('I'm going,' first person), but when Nima reports them, the pronoun shifts to third person -- *خودش می‌ره* ('she herself is going'). This is a separate feature from unit06's tense-retention finding -- tense stays the same, but the pronoun must shift to match who's speaking now."
    example_gloss: "Sara said she herself is going."
  fa.b1.unit11.lesson03.teach.mire:
    title: "he/she goes"
    gloss: "he/she goes"
    example_gloss: "Sara said she herself is going."
  fa.b1.unit11.lesson03.teach.grammar_pronoun_shift:
    title: "I'm going. Sara said she herself is going."
    gloss: "I'm going. Sara said she herself is going."
    note: "The original direct quote uses 'I' (*من می‌رم*); the reported version must shift to third person (*خودش می‌ره*) since Nima is no longer the one speaking -- a genuinely separate feature from tense retention, which unit06 already established doesn't change."
  fa.b1.unit11.lesson03.teach.goftim:
    title: "we said"
    gloss: "we said"
    note: "*گفتیم* -- completes the گفتن paradigm unit06 deliberately left unfinished: 1st/2nd person plural preterite forms are unambiguous with the infinitive (unlike the 3rd-person plural, still not taught for that reason)."
    example_gloss: "We said we have time."
  fa.b1.unit11.lesson03.teach.goftid:
    title: "you (pl.) said"
    gloss: "you (pl.) said"
    example_gloss: "You (pl.) said you're coming."
  fa.b1.unit11.lesson03.teach.ma_shoma:
    title: "we and you (pl.)"
    gloss: "we and you (pl.)"
    example_gloss: "We said we have time. You (pl.) said you're coming."

  fa.b1.unit11.lesson04.teach.reza:
    title: "Reza (name)"
    gloss: "Reza"
    example_gloss: "Reza asks Nima a question."
  fa.b1.unit11.lesson04.teach.nima:
    title: "Nima (name)"
    gloss: "Nima"
    example_gloss: "Nima talked with Sara yesterday."
  fa.b1.unit11.lesson04.teach.zang_zad:
    title: "called (on the phone)"
    gloss: "called (on the phone)"
    example_gloss: "Sara called me yesterday."
  fa.b1.unit11.lesson04.teach.chi_goft:
    title: "what did he/she say?"
    gloss: "what did he/she say?"
  fa.b1.unit11.lesson04.teach.komakesh_konam:
    title: "that I help him/her"
    gloss: "that I help him/her"
    example_gloss: "She asked whether I have time tomorrow to help her."
  fa.b1.unit11.lesson04.teach.goftam_are:
    title: "I said yes"
    gloss: "I said yes"
    example_gloss: "Reza asked and I said yes."
  fa.b1.unit11.lesson04.teach.man_o_maryam:
    title: "Maryam and I"
    gloss: "Maryam and I"
    example_gloss: "Maryam and I also talked with her yesterday."
  fa.b1.unit11.lesson04.teach.dialogue_nima_call:
    title: "Nima: Reza, Sara called me yesterday."
    gloss: "Nima: Reza, Sara called me yesterday."
  fa.b1.unit11.lesson04.teach.dialogue_reza_ask:
    title: "Reza: What did she say?"
    gloss: "Reza: What did she say?"
  fa.b1.unit11.lesson04.teach.dialogue_nima_report:
    title: "Nima: She asked whether I have time tomorrow to help her."
    gloss: "Nima: She asked whether I have time tomorrow to help her."
  fa.b1.unit11.lesson04.teach.dialogue_reza_ask2:
    title: "Reza: What did you say?"
    gloss: "Reza: What did you say?"
  fa.b1.unit11.lesson04.teach.dialogue_nima_answer:
    title: "Nima: I said yes. After that, she asked when I'm coming."
    gloss: "Nima: I said yes. After that, she asked when I'm coming."
  fa.b1.unit11.lesson04.teach.dialogue_reza_interesting:
    title: "Reza: Interesting. Maryam and I also talked with her yesterday; she said she herself is also going there tomorrow."
    gloss: "Reza: Interesting. Maryam and I also talked with her yesterday; she said she herself is also going there tomorrow."

  fa.b1.unit11.lesson05.teach.tarif_kard:
    title: "recounted / told about"
    gloss: "recounted / told about"
    example_gloss: "Nima recounted it to Reza."
  fa.b1.unit11.lesson05.teach.baraye:
    title: "for / to"
    gloss: "for / to"
    example_gloss: "Nima recounted it to Reza."
  fa.b1.unit11.lesson05.teach.movafeghat_kard:
    title: agreed
    gloss: agreed
    example_gloss: "Nima agreed to help."
  fa.b1.unit11.lesson05.teach.kia_dige:
    title: "who else"
    gloss: "who else"
    example_gloss: "Who else talked with Sara?"

  fa.b1.unit11.lesson05.teach.reading_passage:
    title: "Reading: Recounting a conversation"
    gloss: "Yesterday Sara called Nima and asked whether he had time tomorrow to help her. Nima agreed. Then Sara asked when he was coming. Nima also told Reza what had happened. Reza said that he and Maryam had also talked with Sara yesterday, and Sara had told them too that she herself was going there tomorrow."

  fa.b1.unit11.lesson06.teach.grammar_review:
    title: "Sara asked whether you have time. Sara asked when you're coming. Sara said she herself is going."
    gloss: "Sara asked whether you have time. Sara asked when you're coming. Sara said she herself is going."
    note: "Review: reported yes/no question (*پرسید که آیا...*), reported wh-question (*پرسید که کِی/کجا...*), and the pronoun shift a reported first-person original needs (*خودش*) -- plus the completed گفتن paradigm (*گفتیم*/*گفتید*). All three are real, separate features of reporting what someone said, beyond unit06's tense-retention finding."
  fa.b1.unit11.lesson06.teach.emruz:
    title: today
    gloss: today
    example_gloss: "Today I must work."

