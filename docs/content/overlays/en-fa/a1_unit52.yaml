    yes/no/true/false/on/off string values or coerced booleans, plus a full
    yaml.safe_load parse of both files confirming every loaded value is a
    str/list/dict rather than a Python bool -- zero hits. Persian-vs-Arabic
    codepoint scan (Arabic kaf U+0643/yeh U+064A) across both files -- zero
