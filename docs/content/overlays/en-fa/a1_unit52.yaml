  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) found no bugs requiring a fix
    in this overlay's own content. This overlay's own notes had already
    flagged (correctly, as an out-of-scope sibling-file issue at the time)
    unit51's real citation error about بله; that flag was independently
    re-confirmed and fixed directly in unit51's own files as part of this
    same review batch, since unit51 was also in scope for this review (see
    unit51's own review notes). Everything in this overlay checked clean:
    no same-speaker distractor collisions in the dialogue_comprehension
    exercise, no stray unquoted yes/no/true/false/on/off YAML booleans, no
    Arabic-range kaf/yeh codepoints, every exercise type used is
    registered, every "Translate into English" exercise correctly sets
    answer_language_code: en, and every accepted_answers entry
    (matching_pairs, word_order, translation) matches the paired
    realization's own data shape and order. Compiler validation clean
    both standalone and as part of the combined unit51-54 run: 0 errors/0
    warnings.

    Prior draft-authoring provenance notes, kept for the record below.

    Draft overlay paired with the fa.a1.unit52.museum realization. See that
    file's generation_provenance for the honest source-access result:
    tried `firecrawl search "FSI Persian Basic Course museum موزه exhibition
    ticket"` first, per the standing instruction to re-check Firecrawl quota
    fresh even though it was reported exhausted in every earlier round this
    session -- it returned `Error: Request failed with status code 402`
    (payment required), confirming the account genuinely remains at 0
    credits. Fell back to this session's own cached local `pdftotext
    -layout` extraction of the same Live Lingua-hosted FSI Spoken Persian
    PDF (`fsi_persian_livelingua.txt`, ~66,700 words) found already present
    in this worker's scratchpad. Grepped case-insensitively for
    museum/exhibit: genuinely zero hits anywhere in the document -- FSI
    Persian's own course does not cover a museum scene at all, unlike the
    cinema unit's partial hit. Disclosing honestly that nothing usable was
    found rather than stretching an unrelated passage. All vocabulary and
    the full dialogue are authored fresh from this project's own
    established conventions.

    Scenario/register note: نیما (the established recurring customer
    character) buys the museum ticket, continuing his established role from
    units 17/41/44/45/46/47/48/49/50/51. A NEW named museum-clerk character,
    آقای فرهادی, is introduced -- distinct from unit40/42/44's آقای کریمی,
    unit41's خانم احمدی, unit42's آقای صادقی, unit45's خانم رضایی, unit46's
    آقای نوری, unit47's آقای مرادی, unit48's خانم کاظمی, unit49's آقای
    جعفری, unit50's خانم رحیمی, and unit51's خانم موسوی (confirmed via a
    real scan of every آقای/خانم name already used across the fa corpus,
    plus a scan for فرهادی anywhere in existing realizations/overlays --
    zero collision). This brings the corpus-wide named-service-character
    balance to 6 male vs 5 female -- a normal fluctuation, not a policy
    change, after unit51 brought it to genuine 5/5 parity. The museum is
    named موزه فرهادی ("Farhadi Museum") after its own clerk, the same
    self-naming convention unit51 used for سینما موسوی.

    Reuse chain: بلیط (unit16), دارید (unit01), می‌خوام (unit03), این
    (unit02), چقدر (unit21), می‌شه (unit11), بله (unit02 -- see correction
    note below), داریم (unit38), یه (unit02), از (unit01), تا (unit03),
    ساعت (unit09), باز/بازه (unit24/unit49), چقدره (unit28), شصت/هزار/
    تومن/تومنه (unit03), سلام/ممنون (unit01), باشه (unit03), آقای
    (unit40), دیدم (unit13), چطور (unit01), بود (unit06), باحال (unit36),
    نه/پنج (unit03). New vocabulary genuinely introduced for the first
    time in the whole corpus: موزه (museum), نمایشگاه (exhibition), and
    قدیمی (old, historic) -- exactly 3 new words. No new verb-conjugation
    pattern is introduced. The ticket price (شصت هزار تومن), opening hours
    (از ساعت نه تا پنج), and exhibition description (یه نمایشگاه قدیمی)
    are kept identical across the dialogue, the museum-sign reading text,
    and the wrap-up review, per AUTHORING_GUIDE.md #11.

    CORRECTION TO A PRE-EXISTING INACCURACY (found while verifying this
    unit's own reuse chain by real grep, not by eye): unit51's own review
    notes claimed بله was "New vocabulary genuinely introduced for the
    first time in the whole corpus" in unit51. A direct grep of every fa
    a1_unit*.yaml file's introduced_tokens shows بله was actually already
    introduced in unit02, not unit51. This is a pre-existing citation error
    in unit51's own already-drafted, unreviewed file -- out of scope to fix
    here (a sibling file this task wasn't asked to touch), flagged so a
    future reviewer or audit pass catches it. This unit does not reuse بله
    from unit51's claim, so the error does not propagate into this file's
    own content.

    Every "Translate into English" exercise below explicitly sets
    answer_language_code: en. No exercise in this unit tests a genuine
    two-clause sentence joined by "and"/comma (§12) -- every multi-sentence
    line is authored as two separate short sentences in both languages,
    matching how units 44-51 already treat their own two-sentence notes.
    No listen_type/listen_select/listen_order exercise is used anywhere in
    this unit (continuing the established text-based corpus-consistency
    pattern from units 19-51, even though fa now has real Azure TTS per
    §14) -- the spine outcome's "listening" assessment requirement is
    covered via the dialogue_comprehension exercise's comprehension-of-the-
    exchange task, the same interpretation units 41/42/44/45/46/47/48/49/
    50/51 already established. Checked the same-speaker/same-audio
    distractor-collision bug class (fixed 2026-07-09 in the nl corpus,
    commit 148240e) anyway, per the standing instruction to list every
    line each speaker says before writing distractors: نیما says "سلام
    آقای فرهادی. یه بلیط موزه می‌خوام."/"باشه، می‌خوام. نمایشگاه دارید؟"/
    "موزه بازه؟"/"ممنون!"; آقای فرهادی says "سلام نیما. بلیط شصت هزار
    تومنه."/"بله، یه نمایشگاه قدیمی داریم."/"بله، از ساعت نه تا پنج بازه."
    -- lesson04's dialogue_comprehension distractors ("He asks how many
    tickets he wants."/"He asks if he needs a guide."/"He asks for a
    discount.") are plausible-fact alternatives, not lines either speaker
