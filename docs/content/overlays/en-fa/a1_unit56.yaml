  notes: >-
    2026-07-10 fresh-context review (Claude), performed cold alongside the
    paired realization file -- see that file's review notes for the full
    independent-verification detail. Compiler validation, both standalone
    and as part of a 3-unit en-fa A1 batch with a1_unit55/a1_unit57,
    confirmed 0 errors/0 warnings. Found no real bugs to fix in this
    overlay. Original authoring-session provenance/reasoning preserved
    below for context.

    Draft overlay paired with the fa.a1.unit56.beach realization. See that
    file's generation_provenance for the honest source-access result: tried
    `firecrawl search "FSI Persian Basic Course beach ساحل دریا sea sand
    swim"` first, per the standing instruction to re-check Firecrawl quota
    fresh even though it has been reported exhausted in every earlier round
    this session -- it returned `Error: Request failed with status code
    402` (payment required), confirming the account genuinely remains at 0
    credits. This worker session had no cached local pdftotext extraction
    inherited from any prior session (scratchpad directories are
    session-isolated), so it freshly fetched the same public-domain Live
    Lingua-hosted FSI Spoken Persian PDF directly via curl (8,753,270
    bytes, the same size prior units report) and ran pdftotext -layout
    locally (17,130 lines, 66,717 words -- also matching prior units'
    counts). Grepped case-insensitively for beach/sea/seaside/sand/wave/
    waves/swim/caspian/coast: found exactly 3 hits, none a real beach
    scenario -- an isolated "waves" vocabulary item inside a pure
    phonology/pronunciation drill table (not a scenario), and an unrelated
    "around the Caspian" mention in a background paragraph about regional
    dialects, with zero connection to a beach outing. FSI Persian's own
    course does not cover a leisure beach visit at all -- disclosing
    honestly that nothing usable was found, same as the park/museum/
    concert/gym units before it. All vocabulary and the full dialogue are
    authored fresh from this project's own established conventions.

    Scenario note: like unit54/park (whose prerequisite pair -- weather +
    plans -- is identical to this outcome's own prerequisite pair), this
    unit is a friends'-plan scene reusing the established سارا/نیما friend
    pair (already paired together in unit07/unit11/unit33/unit38/unit54)
    rather than introducing a new named service clerk -- there is no
    transaction in the dialogue itself. Unlike unit54, though, the
    outcome's own read_beach_sign requirement explicitly names "a rental
    price," so lesson05's reading sign states a beach-umbrella rental
    price (reusing the already-taught چتر from unit40 in its original
    "umbrella" sense) alongside opening hours, matching units 41-53's
    sign convention on that one axis while keeping the dialogue itself
    transaction-free like unit54's own park sign.

    Reuse chain: بریم (unit07/12/54), می‌خوای (unit12), هوا/چطوره/آفتابیه/
    گرمه (unit07), باشه (unit03), عالیه (unit07), خوبه (established), یا
    (unit06), داره (unit26), شنا/بازی (unit27, شنا there taught for the
    sports outcome as swimming-as-a-hobby -- reused here for beach
    swimming, same core sense, no new sense given), کنیم (unit03's own
    "تمرین کنیم" -- an already-established corpus word, confirmed by grep
    before assuming it needed introducing as a new inflection the way
    park's بزنیم/gym's داریم did), امروز (unit06/07), و (unit26), می‌بینمت
    (unit54), چطور (unit01), بود (unit06), باحال (unit36), چتر (unit40,
    reused with no new sense), سی/هزار/تومن (unit03), از (unit16), ساعت
    (unit09), هشت (unit03), صبح/شب (unit01/09), تا (unit42). New
    vocabulary genuinely introduced for the first time in the whole
    corpus: ساحل (beach -- this unit's own topic word), دریا (sea), and
    ماسه (sand) -- exactly 3 new words, within this course's 2-4
    new-word range (unit53: 2, unit54: 3, unit55: 2). "Waves," named in
    the outcome's own can_do text, is deliberately not given its own
    vocabulary card -- the can_do is a descriptive list of things a
    learner should be able to discuss, not a literal five-item vocabulary
    checklist, and the other four named concepts (sea, sand, swimming, a
    beach umbrella) are each covered by a genuine taught or reused word.
    No new verb-conjugation pattern or inflection is introduced -- every
    verb form used is an already-established corpus form reused as-is.
    The beach-umbrella rental price (30,000 toman) and opening hours
    (8am-8pm) are stated exactly once, in lesson05's reading sign only --
    the friends'-plan dialogue itself never states a price or hours, so
    there is a single authoritative statement of each fact per AUTHORING_
    GUIDE.md #11 rather than a multi-statement cross-check.

    Every "Translate into English" exercise below explicitly sets
    answer_language_code: en. No exercise in this unit tests a genuine
    two-clause sentence joined by "and"/comma (§12) -- the only
    "and"-joined construction (دریا و ماسه داره, "has a sea and sand") is
    a simple noun conjunction inside one clause, not two independent
    clauses; every genuinely multi-sentence line is authored as separate
    short sentences in both languages, matching units 44-55's own
    convention. No listen_type/listen_select/listen_order exercise is
    used anywhere in this unit (continuing the established text-based
    corpus-consistency pattern from units 19-55, even though fa now has
    real Azure TTS per §14) -- the spine outcome's "listening" assessment
    requirement is covered via the dialogue_comprehension exercise's
    comprehension-of-the-exchange task, the same interpretation units
    41-55 already established. Checked the same-speaker/same-audio
    distractor-collision bug class (fixed 2026-07-09 in the nl corpus,
    commit 148240e) anyway, per the standing instruction to list every
    line each speaker says before writing distractors: نیما says "سارا،
    می‌خوای بریم ساحل؟"/"آفتابیه و گرمه."/"شنا کنیم. دریا خوبه."; سارا
    says "باشه، عالیه! امروز هوا چطوره؟"/"خوبه! شنا کنیم یا ماسه بازی
    کنیم؟"/"باشه، می‌بینمت." -- lesson04's dialogue_comprehension
    distractors ("She asks what time it is."/"She asks how much the beach
    costs."/"She asks if Nima wants to go home.") are plausible-fact
    alternatives, not lines either speaker actually says or facts either
    speaker actually states anywhere in this unit's dialogue audio (the
    price/hours live in a separate lesson05 reading sign, not the
    dialogue) -- the time, a beach cost, and going home are never
    mentioned by either character in the dialogue. The dialogue_response
    exercise (lesson04) accepts نیما's own actual next line, not a
    distractor set, so this check doesn't apply to it. Boolean-coercion
    check: ran a recursive scan over title/gloss/note/example_gloss/
    answer/matching-pair value fields (including matching_pairs right:
    values specifically) across both this overlay and the paired
    realization for bare yes/no/true/false/on/off string values or
    coerced booleans, plus a full yaml.safe_load parse of both files
    confirming every loaded value is a str/list/dict rather than a Python
    bool -- zero hits. Persian-vs-Arabic codepoint scan (Arabic kaf
    U+0643/yeh U+064A) across both files -- zero hits. Compiler
