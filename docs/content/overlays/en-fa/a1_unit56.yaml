    feedback: "سارا، می‌خوای بریم ساحل؟ means 'Sara, do you want to go to the beach?'"

  fa.a1.unit56.lesson05.exercise01.reading_comprehension_place:
    instruction: "According to the sign, what kind of place is this?"
    correct_option: "Beach."
    distractors:
      - "Park."
      - "Gym."
      - "Restaurant."
    accepted_answers: [{value: "Beach.", status: correct}]
    feedback: "ساحل means 'beach' -- the sign is for a beach."
  fa.a1.unit56.lesson05.exercise02.reading_comprehension_price:
    instruction: "According to the sign, how much is the umbrella?"
    correct_option: "30,000 toman."
    distractors:
      - "3,000 toman."
      - "300,000 toman."
      - "It's free."
    accepted_answers: [{value: "30,000 toman.", status: correct}]
    feedback: "چتر سی هزار تومن means 'umbrella 30,000 toman.'"
