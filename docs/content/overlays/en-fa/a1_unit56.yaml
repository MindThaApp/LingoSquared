    note: "*بریم* ('let's go') was covered earlier; *می‌خوای* ('do you want') was covered earlier."
  fa.a1.unit56.lesson01.teach.review_havaa_chetore:
    title: "Review: weather / how is it"
    gloss: "weather / how is it"
    note: "*هوا* ('weather') was covered earlier; *چطوره* ('how is it') was covered earlier."
  fa.a1.unit56.lesson01.teach.review_bashe_aaliye:
    title: "Review: okay / great"
    gloss: "okay / great"
    note: "*باشه* ('okay') was covered earlier; *عالیه* ('great') was covered earlier."
  fa.a1.unit56.lesson01.teach.sahel:
    title: Beach
    gloss: beach
    note: "*ساحل* means 'beach.'"
    example_gloss: "Shall we go to the beach?"

  fa.a1.unit56.lesson02.teach.review_khoobe_ya_dare:
    title: "Review: good / or / it has"
    gloss: "good / or / it has"
    note: "*خوبه* ('good') was already established from Units 06/10/12; *یا* ('or') was covered earlier; *داره* ('it has') was covered earlier."
  fa.a1.unit56.lesson02.teach.daryaa:
    title: Sea
    gloss: sea
    note: "*دریا* means 'sea.'"
    example_gloss: "The beach has a sea."
  fa.a1.unit56.lesson02.teach.maase:
    title: Sand
    gloss: sand
    note: "*ماسه* means 'sand.'"
    example_gloss: "The beach has sand."

  fa.a1.unit56.lesson03.teach.review_shena_bazi_konim:
    title: "Review: swimming / play / let's ..."
    gloss: "swimming / play / let's ..., we ..."
    note: "*شنا* ('swimming') and *بازی* ('play') were covered earlier; *کنیم* ('let's..., we...') was covered earlier."
  fa.a1.unit56.lesson03.teach.phrase_shena_ya_maase_bazi:
    title: "Shall we swim or play in the sand?"
    gloss: "Shall we swim or play in the sand?"
    note: "Combines this unit's *دریا*/*ماسه* concepts with the already-known *شنا*, *بازی*, and *کنیم*."
  fa.a1.unit56.lesson03.teach.phrase_shena_daryaa_khoobe:
    title: "Let's swim. The sea is nice."
    gloss: "Let's swim. The sea is nice."
    note: "Combines *شنا کنیم* with this unit's *دریا* and the already-known *خوبه*."

  fa.a1.unit56.lesson04.teach.dialogue_line1:
    title: "Nima: Sara, do you want to go to the beach?"
    gloss: "Sara, do you want to go to the beach?"
  fa.a1.unit56.lesson04.teach.dialogue_line2:
    title: "Sara: Okay, great! How's the weather today?"
    gloss: "Okay, great! How's the weather today?"
  fa.a1.unit56.lesson04.teach.dialogue_line3:
    title: "Nima: It's sunny and warm."
    gloss: "It's sunny and warm."
  fa.a1.unit56.lesson04.teach.dialogue_line4:
    title: "Sara: Good! Should we swim or play in the sand?"
    gloss: "Good! Should we swim or play in the sand?"
  fa.a1.unit56.lesson04.teach.dialogue_line5:
