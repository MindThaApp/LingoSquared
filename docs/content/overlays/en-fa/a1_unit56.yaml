    Review 2026-10-21 (en-fa A1 pass): 6 fixes - learner-facing 'unitNN' wording in notes changed to 'Unit NN' (english), sign-writing instruction now matches its single copy answer and the message instruction now matches both accepted ideas (answer-mismatch), accepted the natural word order بریم ساحل in the message items (alt-answers). NATIVE FLAGS: ساحل دریا داره ('the beach has a sea') is an odd sentence; ساحل بریم؟ vs the more usual بریم ساحل؟.

course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: proposing a day at the beach, discussing the
    weather, suggesting swimming or playing in the sand, and briefly
    saying how the beach was afterward, plus reading/writing a short
    beach sign naming the beach, its umbrella rental price, and its
    opening hours.

units:
  fa.a1.unit56.beach: {title: Beach}

lessons:
  fa.a1.unit56.lesson01.new_beach_one: {title: "New words 1"}
  fa.a1.unit56.lesson02.new_beach_two: {title: "New words 2"}
  fa.a1.unit56.lesson03.suggest_activity: {title: "Suggest an activity"}
  fa.a1.unit56.lesson04.beach_dialogue: {title: "Dialogue: at the beach"}
  fa.a1.unit56.lesson05.reading_beach_sign: {title: "Reading a beach sign"}
  fa.a1.unit56.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit56.lesson01.teach.review_beriim_mikhaay:
    title: "Review: let's go / do you want"
