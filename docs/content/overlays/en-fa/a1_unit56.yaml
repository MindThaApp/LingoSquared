    gloss: "Shall we swim or play in the sand?"
  fa.a1.unit56.lesson06.teach.review_afterward:
    title: "How was the beach? It was fun!"
    gloss: "How was the beach? It was fun!"
  fa.a1.unit56.lesson06.teach.summary_words:
    title: "Beach / sea / sand / let's swim / umbrella"
    gloss: "beach / sea / sand / let's swim / umbrella"
    note: "These are the key words and phrases taught in this unit."

exercises:
  fa.a1.unit56.lesson01.exercise01.recognize_sahel:
    instruction: "What does this word mean?"
    correct_option: beach
    distractors: [park, sea, sand]
    accepted_answers: [{value: beach, status: correct}]
    feedback: "ساحل means 'beach.'"
  fa.a1.unit56.lesson01.exercise02.recognize_sahel_beriim:
    instruction: "What does this sentence mean?"
    correct_option: "Shall we go to the beach?"
    distractors: ["Is the beach open?", "The beach is far.", "I don't want to go to the beach."]
    accepted_answers: [{value: "Shall we go to the beach?", status: correct}]
    feedback: "ساحل بریم؟ means 'Shall we go to the beach?'"
  fa.a1.unit56.lesson01.exercise03.match_beach_one:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {بریم: "let's go", "می‌خوای": "do you want", هوا: weather, چطوره: "how is it", باشه: okay, ساحل: beach}
        status: correct
    feedback: "These are the first new beach words for this unit."
  fa.a1.unit56.lesson01.exercise04.word_order_sahel_beriim:
    instruction: "Put the words in order."
    accepted_answers: [{value: [ساحل, بریم], status: correct}]
    feedback: "ساحل بریم means 'Let's go to the beach.'"
  fa.a1.unit56.lesson01.exercise05.translate_sahel_chetore:
    instruction: "Translate into English: ساحل چطوره؟"
    answer_language_code: en
    accepted_answers:
      - {value: "How's the beach?", status: correct}
      - {value: "What's the beach like?", status: correct}
      - {value: "How is the beach?", status: correct}
    feedback: "ساحل چطوره؟ means 'How's the beach?'"

  fa.a1.unit56.lesson02.exercise01.recognize_daryaa:
    instruction: "What does this word mean?"
    correct_option: sea
    distractors: [sand, beach, umbrella]
    accepted_answers: [{value: sea, status: correct}]
    feedback: "دریا means 'sea.'"
  fa.a1.unit56.lesson02.exercise02.recognize_maase:
    instruction: "What does this word mean?"
    correct_option: sand
    distractors: [sea, weather, beach]
    accepted_answers: [{value: sand, status: correct}]
    feedback: "ماسه means 'sand.'"
  fa.a1.unit56.lesson02.exercise03.match_beach_two:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {خوبه: good, یا: or, داره: "it has", دریا: sea, ماسه: sand, ساحل: beach}
        status: correct
    feedback: "These words let you describe what the beach has."
  fa.a1.unit56.lesson02.exercise04.word_order_sahel_daryaa_dare:
    instruction: "Put the words in order."
    accepted_answers: [{value: [ساحل, دریا, داره], status: correct}]
    feedback: "ساحل دریا داره means 'The beach has a sea.'"
  fa.a1.unit56.lesson02.exercise05.translate_maase_khoobe:
    instruction: "Translate into English: ماسه خوبه"
    answer_language_code: en
    accepted_answers:
      - {value: "The sand is good.", status: correct}
      - {value: "The sand is nice.", status: correct}
      - {value: "The sand is good", status: correct}
      - {value: "The sand is nice", status: correct}
    feedback: "ماسه خوبه means 'The sand is good.'"

  fa.a1.unit56.lesson03.exercise01.recognize_shena_ya_maase_bazi:
    instruction: "What does this sentence mean?"
    correct_option: "Shall we swim or play in the sand?"
    distractors: ["Shall we walk or have a picnic?", "Do you want to swim in the pool?", "Is the sand hot?"]
    accepted_answers: [{value: "Shall we swim or play in the sand?", status: correct}]
    feedback: "شنا کنیم یا ماسه بازی کنیم؟ means 'Shall we swim or play in the sand?'"
  fa.a1.unit56.lesson03.exercise02.recognize_shena_daryaa_khoobe:
    instruction: "What does this sentence mean?"
    correct_option: "Let's swim. The sea is nice."
    distractors: ["Let's walk. The sand is nice.", "I don't want to swim.", "The sea is cold."]
    accepted_answers: [{value: "Let's swim. The sea is nice.", status: correct}]
    feedback: "شنا کنیم. دریا خوبه means 'Let's swim. The sea is nice.'"
  fa.a1.unit56.lesson03.exercise03.match_suggest_activity:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {شنا: swimming, بازی: play, "کنیم": "let's ...", ماسه: sand, دریا: sea, خوبه: good}
        status: correct
    feedback: "These words let you suggest a beach activity."
  fa.a1.unit56.lesson03.exercise04.word_order_shena_konim:
    instruction: "Put the words in order."
    accepted_answers: [{value: [شنا, "کنیم"], status: correct}]
    feedback: "شنا کنیم means 'Let's swim.'"
  fa.a1.unit56.lesson03.exercise05.translate_shena_ya_maase_bazi:
    instruction: "Translate into English: شنا کنیم یا ماسه بازی کنیم؟"
    answer_language_code: en
    accepted_answers:
      - {value: "Shall we swim or play in the sand?", status: correct}
      - {value: "Should we swim or play in the sand?", status: correct}
      - {value: "Shall we swim or play in the sand", status: correct}
    feedback: "شنا کنیم یا ماسه بازی کنیم؟ means 'Shall we swim or play in the sand?'"

  fa.a1.unit56.lesson04.exercise01.dialogue_comprehension_swim_or_sand:
    instruction: "Sara asks Nima something. What does she propose?"
    correct_option: "She asks if they should swim or play in the sand."
    distractors:
      - "She asks what time it is."
      - "She asks how much the beach costs."
      - "She asks if Nima wants to go home."
    accepted_answers: [{value: "She asks if they should swim or play in the sand.", status: correct}]
    feedback: "شنا کنیم یا ماسه بازی کنیم؟ means 'Shall we swim or play in the sand?'"
  fa.a1.unit56.lesson04.exercise02.recognize_dialogue_line5:
    instruction: "What does this sentence mean?"
    correct_option: "Let's swim. The sea is nice."
    distractors:
      - "Let's walk. The park is nice."
      - "I don't want to swim today."
      - "The sea is far from here."
    accepted_answers: [{value: "Let's swim. The sea is nice.", status: correct}]
    feedback: "شنا کنیم. دریا خوبه means 'Let's swim. The sea is nice.'"
  fa.a1.unit56.lesson04.exercise03.match_dialogue_beach:
    instruction: "Match each line with its meaning."
    accepted_answers:
      - value: {"سارا، می‌خوای بریم ساحل؟": "Sara, do you want to go to the beach?", "باشه، عالیه! امروز هوا چطوره؟": "Okay, great! How's the weather today?", "آفتابیه و گرمه.": "It's sunny and warm.", "خوبه! شنا کنیم یا ماسه بازی کنیم؟": "Good! Should we swim or play in the sand?", "شنا کنیم. دریا خوبه.": "Let's swim. The sea is nice.", "باشه، می‌بینمت.": "Okay, see you."}
        status: correct
    feedback: "These lines appear in the beach conversation between Nima and Sara."
  fa.a1.unit56.lesson04.exercise04.dialogue_response_swim:
    instruction: "Respond to خوبه! شنا کنیم یا ماسه بازی کنیم؟ by saying let's swim, the sea is nice."
    accepted_answers:
      - {value: "شنا کنیم. دریا خوبه.", status: correct}
      - {value: "شنا کنیم. دریا خوبه", status: correct}
      - {value: "شنا کنیم، دریا خوبه.", status: correct}
      - {value: "شنا کنیم، دریا خوبه", status: correct}
    feedback: "شنا کنیم. دریا خوبه means 'Let's swim. The sea is nice.'"
  fa.a1.unit56.lesson04.exercise05.translate_dialogue_line1:
    instruction: "Translate into English: سارا، می‌خوای بریم ساحل؟"
    answer_language_code: en
    accepted_answers:
      - {value: "Sara, do you want to go to the beach?", status: correct}
      - {value: "Sara, do you want to go to the beach", status: correct}
