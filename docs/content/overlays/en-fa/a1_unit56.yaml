        status: correct
    feedback: "These words let you understand the beach sign."
  fa.a1.unit56.lesson05.exercise04.translate_reading_beach_sign:
    instruction: "Translate into English: ساحل نور: چتر سی هزار تومن. از ساعت هشت صبح تا هشت شب. دریا و ماسه داره."
    answer_language_code: en
    accepted_answers:
      - {value: "Noor Beach: umbrella 30,000 toman. From eight in the morning to eight at night. Has a sea and sand.", status: correct}
