course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi focused on reading the script, understanding
    everyday speech, and handling practical conversations politely.

units:
  fa.a1.unit03.numbers:
    title: Numbers

lessons:
  fa.a1.unit03.lesson01.zero_to_ten: {title: "Zero to ten"}
  fa.a1.unit03.lesson02.eleven_to_ninety_nine: {title: "Eleven to ninety-nine"}
  fa.a1.unit03.lesson03.phone_numbers: {title: "Phone numbers"}
  fa.a1.unit03.lesson04.ages_and_quantities: {title: "Ages and quantities"}
  fa.a1.unit03.lesson05.prices: {title: "Prices in toman"}
  fa.a1.unit03.lesson06.dialogue_phone_numbers: {title: "Exchanging phone numbers"}

teaching:
  fa.a1.unit03.lesson01.teach.adad:
    title: "Number"
    gloss: "number"
    note: "عدد is the general word for a number."
  fa.a1.unit03.lesson01.teach.zero:
    title: "Zero"
    gloss: "0 — zero"
    note: "صفر is used for zero, including as a digit inside a longer number like a phone number."
  fa.a1.unit03.lesson01.teach.one:
    title: "One"
    gloss: "1 — one"
    note: "یک is one."
  fa.a1.unit03.lesson01.teach.two:
    title: "Two"
    gloss: "2 — two"
    note: "دو is two."
  fa.a1.unit03.lesson01.teach.three:
    title: "Three"
    gloss: "3 — three"
    note: "سه is three."
  fa.a1.unit03.lesson01.teach.four:
    title: "Four"
    gloss: "4 — four"
    note: "چهار is four."
  fa.a1.unit03.lesson01.teach.five:
    title: "Five"
    gloss: "5 — five"
    note: "پنج is five."
  fa.a1.unit03.lesson01.teach.six:
    title: "Six"
    gloss: "6 — six"
    note: "شش is six."
  fa.a1.unit03.lesson01.teach.seven:
    title: "Seven"
    gloss: "7 — seven"
    note: "هفت is seven."
  fa.a1.unit03.lesson01.teach.eight:
    title: "Eight"
    gloss: "8 — eight"
    note: "هشت is eight."
  fa.a1.unit03.lesson01.teach.nine:
    title: "Nine"
    gloss: "9 — nine"
    note: "نه is nine. It is also the ordinary word for 'no' — context (hearing it inside a count or a number) resolves which meaning is intended."
  fa.a1.unit03.lesson01.teach.ten:
    title: "Ten"
    gloss: "10 — ten"
    note: "ده is ten."

  fa.a1.unit03.lesson02.teach.eleven:
    title: "Eleven"
    gloss: "11 — eleven"
    note: "یازده is eleven."
  fa.a1.unit03.lesson02.teach.twelve:
    title: "Twelve"
    gloss: "12 — twelve"
    note: "دوازده is twelve."
  fa.a1.unit03.lesson02.teach.thirteen:
    title: "Thirteen"
    gloss: "13 — thirteen"
    note: "سیزده is thirteen."
  fa.a1.unit03.lesson02.teach.fourteen:
    title: "Fourteen"
    gloss: "14 — fourteen"
    note: "چهارده is fourteen."
  fa.a1.unit03.lesson02.teach.fifteen:
    title: "Fifteen"
    gloss: "15 — fifteen"
    note: "پانزده is fifteen."
  fa.a1.unit03.lesson02.teach.sixteen:
    title: "Sixteen"
    gloss: "16 — sixteen"
    note: "شانزده is sixteen — not predictable from شش (six) + ده (ten), so it's worth learning as its own word."
  fa.a1.unit03.lesson02.teach.seventeen:
    title: "Seventeen"
    gloss: "17 — seventeen"
    note: "هفده is seventeen."
  fa.a1.unit03.lesson02.teach.eighteen:
    title: "Eighteen"
    gloss: "18 — eighteen"
    note: "هجده is eighteen."
  fa.a1.unit03.lesson02.teach.nineteen:
    title: "Nineteen"
    gloss: "19 — nineteen"
    note: "نوزده is nineteen."
  fa.a1.unit03.lesson02.teach.twenty:
    title: "Twenty"
    gloss: "20 — twenty"
    note: "بیست is twenty."
  fa.a1.unit03.lesson02.teach.thirty:
    title: "Thirty"
    gloss: "30 — thirty"
    note: "سی is thirty."
  fa.a1.unit03.lesson02.teach.forty_to_ninety:
    title: "Forty to ninety"
    gloss: "40, 50, 60, 70, 80, 90"
    note: "چهل، پنجاه، شصت، هفتاد، هشتاد، نود are the remaining tens."
  fa.a1.unit03.lesson02.teach.combining:
    title: "Combining tens and units"
    gloss: "twenty-five"
    note: "بیست و پنج is literally 'twenty and five' — tens word, و, units word."

  fa.a1.unit03.lesson03.teach.shomare:
    title: "Number (of something)"
    gloss: "number"
    note: "شماره is used for an identifying number such as a phone or house number, distinct from عدد's general sense of 'a number'."
  fa.a1.unit03.lesson03.teach.telefon:
    title: "Telephone"
    gloss: "telephone / phone"
    note: "تلفن covers phones in general, including mobile phones."
  fa.a1.unit03.lesson03.teach.digit_by_digit:
    title: "Ask for a phone number"
    gloss: "What's your phone number?"
    note: >-
      شماره تلفنتون چنده؟ is the ordinary polite way to ask for a phone
      number. Reading a number one digit at a time is always understood
      and is the safest beginner approach; grouping digits together is
      also normal in real speech, but this lesson practices the simpler
      digit-by-digit form first.
  fa.a1.unit03.lesson03.teach.chande:
    title: "How much / what is it?"
    gloss: "what is it? / how much is it?"
    note: "چنده؟ contracts چند است and asks for a number, amount, or price depending on context."
  fa.a1.unit03.lesson03.teach.read_number:
    title: "Read a number digit by digit"
    gloss: "zero, nine, one, two, three, four, five, six, seven, eight, eight"
    note: >-
      This lesson practices reading numbers one digit at a time. A real
      Iranian mobile number has 11 digits and starts with 0, e.g.
      0912 345 6788.

  fa.a1.unit03.lesson04.teach.sal:
    title: "Year"
    gloss: "year"
    note: "سال is used both for calendar years and for counting someone's age."
  fa.a1.unit03.lesson04.teach.man_recap:
    title: "I (recap)"
    gloss: "I"
    note: "A quick reminder of من, needed here to say your own age in a full sentence."
  fa.a1.unit03.lesson04.teach.chand_saale:
    title: "Ask someone's age (informal)"
    gloss: "How old are you?"
    note: "چند سالته؟ is informal singular; چند سالتونه؟ is the polite equivalent."
  fa.a1.unit03.lesson04.teach.salame:
    title: "State your age"
    gloss: "I'm 25 years old."
    note: >-
      سالمه attaches the possessive ending ـم (my) directly onto سال,
      then adds the colloquial copula ـه (is) — literally
      "my-year-is."
  fa.a1.unit03.lesson04.teach.ta:
    title: "Counting classifier"
    gloss: "(counting word, no direct English equivalent)"
    note: "تا is the general-purpose classifier used when counting most objects: number + تا + noun."
  fa.a1.unit03.lesson04.teach.sib:
    title: "Apple"
    gloss: "apple"
    note: "سیب is apple."
  fa.a1.unit03.lesson04.teach.ketab:
    title: "Book"
    gloss: "book"
    note: "کتاب is book."
  fa.a1.unit03.lesson04.teach.do_ta_sib:
    title: "Request a quantity"
    gloss: "I'd like two apples."
    note: "دو تا سیب می‌خوام puts the counted quantity before the noun, as usual with تا."

  fa.a1.unit03.lesson05.teach.gheymat:
    title: "Price"
    gloss: "price"
    note: "قیمت is the general word for price."
  fa.a1.unit03.lesson05.teach.toman:
    title: "Toman"
    gloss: "toman (Iranian currency, everyday use)"
    note: "Iran's official currency is the rial, but everyday spoken prices are almost always given in toman (1 toman = 10 rials)."
  fa.a1.unit03.lesson05.teach.hezar:
    title: "Thousand"
    gloss: "thousand"
    note: "هزار is thousand; prices are usually said in thousands of toman."
  fa.a1.unit03.lesson05.teach.ask_price:
    title: "Ask a price"
    gloss: "How much is this?"
    note: "این چنده؟ is the ordinary way to ask the price of something in front of you."
  fa.a1.unit03.lesson05.teach.price_answer:
    title: "State a price"
    gloss: "It's 30,000 toman."
    note: "تومنه contracts تومن است; the full pattern is number + هزار + تومنه."

  fa.a1.unit03.lesson06.teach.practice_together:
    title: "Sara suggests practicing together"
    gloss: "Sara says she wants them to practice Farsi together and asks for Mina's phone number."
    note: "باهم means 'together'; می‌خوام ... تمرین کنیم means 'I want us to practice' — تمرین کنیم alone, as a question, can also mean 'shall we practice?'"
  fa.a1.unit03.lesson06.teach.mina_gives_number:
    title: "Mina gives her number"
    gloss: "Mina agrees and reads her 11-digit number one digit at a time."
    note: "شماره‌ام contracts شماره من; هشته contracts هشت است, closing the count."
  fa.a1.unit03.lesson06.teach.sara_confirms:
    title: "Sara checks she wrote it down correctly"
    gloss: "Sara asks Mina to wait while she writes the number, then reads it back to confirm."
    note: "درسته؟ ('is that right?') is a common way to check a number or fact you just heard."
  fa.a1.unit03.lesson06.teach.mina_confirms_asks:
    title: "Mina confirms and asks in return"
    gloss: "Mina confirms it's correct and asks for Sara's number."
    note: "آره is an informal 'yes', more casual than بله."
  fa.a1.unit03.lesson06.teach.sara_gives_number:
    title: "Sara gives her number"
    gloss: "Sara reads her own 11-digit number, one digit at a time."
    note: "یکه contracts یک است, ending the count the same way هشته ended Mina's number."
  fa.a1.unit03.lesson06.teach.mina_will_call:
    title: "Mina agrees to call"
    gloss: "Mina says she'll call Sara tomorrow."
    note: "زنگ می‌زنم بهت means 'I'll call you' — literally 'I hit the bell to you'."

exercises:
  fa.a1.unit03.lesson01.exercise01.recognize_yek:
    instruction: "Select the meaning of یک."
    correct_option: one
    distractors: [two, five, ten]
    accepted_answers: [{value: one, status: correct}]
    feedback: "یک means one."
  fa.a1.unit03.lesson01.exercise02.recognize_panj:
    instruction: "Select the meaning of پنج."
    correct_option: five
    distractors: [one, eight, three]
    accepted_answers: [{value: five, status: correct}]
    feedback: "پنج means five."
  fa.a1.unit03.lesson01.exercise03.recognize_zero_to_five_reading:
    instruction: "Which numbers are these, in order?"
    correct_option: "0, 1, 2, 3, 4, 5"
    distractors: ["1, 2, 3, 4, 5, 6", "0, 2, 4, 6, 8, 10", "5, 4, 3, 2, 1, 0"]
    accepted_answers: [{value: "0, 1, 2, 3, 4, 5", status: correct}]
    feedback: "صفر، یک، دو، سه، چهار، پنج counts 0 through 5 in order."
  fa.a1.unit03.lesson01.exercise04.match_low:
    instruction: "Match each number word to its digit."
    accepted_answers:
      - value: {صفر: "0", یک: "1", دو: "2", سه: "3", چهار: "4", پنج: "5", شش: "6"}
        status: correct
    feedback: "صفر through شش are 0 through 6."
  fa.a1.unit03.lesson01.exercise05.match_high:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {هفت: "7", هشت: "8", نه: "9", ده: "10", عدد: number}
        status: correct
    feedback: "هفت، هشت، نه، ده are 7 through 10; عدد is the word for number."
  fa.a1.unit03.lesson01.exercise06.order_ascending:
    instruction: "Arrange these from smallest to largest."
    accepted_answers: [{value: [یک, دو, سه], status: correct}]
    feedback: "یک، دو، سه is the correct ascending order."
  fa.a1.unit03.lesson01.exercise07.fill_seven:
    instruction: "Listen and fill in the Persian word for 7."
    accepted_answers:
      - {value: هفت, status: correct}
    feedback: "۷ is هفت."
  fa.a1.unit03.lesson01.exercise08.translate_nine:
    instruction: "Translate into Farsi: nine."
    accepted_answers:
      - {value: نه, status: correct}
    feedback: "نه means nine."

  fa.a1.unit03.lesson02.exercise01.recognize_bist:
    instruction: "Select the meaning of بیست."
    correct_option: twenty
    distractors: [twelve, ten, two]
    accepted_answers: [{value: twenty, status: correct}]
    feedback: "بیست means twenty."
  fa.a1.unit03.lesson02.exercise02.recognize_hejdah:
    instruction: "Select the meaning of هجده."
    correct_option: eighteen
    distractors: [eight, eighty, eighth]
    accepted_answers: [{value: eighteen, status: correct}]
    feedback: "هجده means eighteen."
  fa.a1.unit03.lesson02.exercise03.recognize_teens_reading:
    instruction: "Which numbers are these, in order?"
    correct_option: "11, 12, 13, 14, 15"
    distractors: ["10, 11, 12, 13, 14", "15, 14, 13, 12, 11", "11, 13, 12, 14, 15"]
    accepted_answers: [{value: "11, 12, 13, 14, 15", status: correct}]
    feedback: "یازده، دوازده، سیزده، چهارده، پانزده counts them in order."
  fa.a1.unit03.lesson02.exercise04.match_teens_low:
    instruction: "Match each number word to its digit."
    accepted_answers:
      - value: {یازده: "11", دوازده: "12", سیزده: "13", چهارده: "14", صفر: "0", هفت: "7", ده: "10"}
        status: correct
    feedback: "یازده، دوازده، سیزده، چهارده are 11 through 14; the last three review lesson01's numbers."
  fa.a1.unit03.lesson02.exercise05.match_teens_high:
    instruction: "Match each number word to its digit."
    accepted_answers:
      - value: {پانزده: "15", شانزده: "16", هفده: "17", هجده: "18", نوزده: "19", بیست: "20"}
        status: correct
    feedback: "پانزده through بیست are 15 through 20."
  fa.a1.unit03.lesson02.exercise06.match_tens:
    instruction: "Match each number word to its digit."
    accepted_answers:
      - value: {سی: "30", چهل: "40", پنجاه: "50", شصت: "60", هفتاد: "70", هشتاد: "80", نود: "90"}
        status: correct
    feedback: "سی through نود are 30 through 90."
  fa.a1.unit03.lesson02.exercise07.order_combining:
    instruction: "Arrange the words for 25."
    accepted_answers: [{value: [بیست, و, پنج], status: correct}]
    feedback: "بیست و پنج is twenty-five: tens, و, units."
  fa.a1.unit03.lesson02.exercise08.order_tens:
    instruction: "Arrange the tens from smallest to largest: twenty, thirty, forty, fifty, sixty, seventy, eighty, ninety."
    accepted_answers:
      - {value: [بیست, سی, چهل, پنجاه, شصت, هفتاد, هشتاد, نود], status: correct}
    feedback: "This lists the tens in ascending order: 20 through 90."
  fa.a1.unit03.lesson02.exercise09.translate_25:
    instruction: "Translate into Farsi: twenty-five."
    accepted_answers:
      - {value: "بیست و پنج", status: correct}
      - {value: "بیست‌و‌پنج", status: acceptable_with_note, note: "Accepted spacing variant."}
    feedback: "بیست و پنج means twenty-five (25)."

  fa.a1.unit03.lesson03.exercise01.shomare_meaning:
    instruction: "Select the meaning of شماره."
    correct_option: "number (identifying, e.g. phone/house)"
    distractors: [price, age, quantity]
    accepted_answers: [{value: "number (identifying, e.g. phone/house)", status: correct}]
    feedback: "شماره is used for an identifying number, like a phone or house number."
  fa.a1.unit03.lesson03.exercise02.telefon_meaning:
    instruction: "Select the meaning of تلفن."
    correct_option: telephone
    distractors: [number, address, message]
    accepted_answers: [{value: telephone, status: correct}]
    feedback: "تلفن means telephone."
  fa.a1.unit03.lesson03.exercise03.recognize_ask_reading:
    instruction: "What is this question asking?"
    correct_option: "the listener's phone number"
    distractors: ["the listener's age", "the price of a phone", "the listener's name"]
    accepted_answers: [{value: "the listener's phone number", status: correct}]
    feedback: "شماره تلفنتون چنده؟ asks for the listener's phone number."
  fa.a1.unit03.lesson03.exercise04.order_ask:
    instruction: "Arrange: what's your phone number?"
    accepted_answers: [{value: [شماره, تلفنتون, چنده], status: correct}]
    feedback: "شماره تلفنتون چنده؟ is the polite question order."
  fa.a1.unit03.lesson03.exercise05.order_digits:
    instruction: "Arrange the digits to spell: 0, 9, 1, 2, 3, 4, 5, 6, 7, 8, 8."
    accepted_answers:
      - {value: [صفر, نه, یک, دو, سه, چهار, پنج, شش, هفت, هشت, هشت], status: correct}
    feedback: "صفر، نه، یک، دو، سه، چهار، پنج، شش، هفت، هشت، هشت reads the digits one at a time."
  fa.a1.unit03.lesson03.exercise06.dialogue_give_number:
    instruction: "Reply by giving this phone number, digit by digit: 09123456788."
    accepted_answers:
      - {value: "صفر نه یک دو سه چهار پنج شش هفت هشت هشت", status: correct}
      - {value: "شماره‌ام صفر نه یک دو سه چهار پنج شش هفت هشت هشته", status: correct}
    feedback: "Phone numbers are read digit by digit: صفر نه یک دو سه چهار پنج شش هفت هشت هشت."
  fa.a1.unit03.lesson03.exercise07.write_digits:
    instruction: "Type the Persian word for each digit you hear, in order."
    accepted_answers:
      - {value: "صفر نه یک دو سه چهار پنج شش هفت هشت هشت", status: correct}
    feedback: "The audio says صفر نه یک دو سه چهار پنج شش هفت هشت هشت."
  fa.a1.unit03.lesson03.exercise08.speak_number:
    instruction: "Say this phone number aloud, digit by digit: 09123456788."
    accepted_answers:
      - {value: "صفر نه یک دو سه چهار پنج شش هفت هشت هشت", status: correct}
    feedback: "Read each digit separately: صفر نه یک دو سه چهار پنج شش هفت هشت هشت."

  fa.a1.unit03.lesson04.exercise01.sal_meaning:
    instruction: "Select the meaning of سال."
    correct_option: year
    distractors: [age, number, month]
    accepted_answers: [{value: year, status: correct}]
    feedback: "سال means year; it's also used to count someone's age."
  fa.a1.unit03.lesson04.exercise02.ta_meaning:
    instruction: "What does تا do in دو تا سیب؟"
    correct_option: "it's a counting word placed between the number and the noun"
    distractors: ["it means 'apple'", "it means 'two'", "it makes the noun plural on its own"]
    accepted_answers: [{value: "it's a counting word placed between the number and the noun", status: correct}]
    feedback: "تا is the general classifier used when counting most objects."
  fa.a1.unit03.lesson04.exercise03.recognize_ask_age_reading:
    instruction: "What is this question asking?"
    correct_option: "the listener's age"
    distractors: ["the listener's phone number", "the price of something", "the time"]
    accepted_answers: [{value: "the listener's age", status: correct}]
    feedback: "چند سالته؟ asks how old you are."
  fa.a1.unit03.lesson04.exercise04.order_age_answer:
    instruction: "Arrange: I am 25 years old."
    accepted_answers: [{value: [من, بیست, و, پنج, سالمه], status: correct}]
    feedback: "من بیست و پنج سالمه states the age with the number before سالمه."
  fa.a1.unit03.lesson04.exercise05.match_quantities:
    instruction: "Match each Persian quantity to its English meaning."
    accepted_answers:
      - value: {"یک تا سیب": "one apple", "دو تا سیب": "two apples", "سه تا کتاب": "three books", "چهار تا سیب": "four apples", "پنج تا کتاب": "five books", "شش تا سیب": "six apples", "هفت تا کتاب": "seven books", "هشت تا سیب": "eight apples"}
        status: correct
    feedback: "تا sits between the number and the noun in every phrase."
  fa.a1.unit03.lesson04.exercise06.order_want:
    instruction: "Arrange the words to say I'd like two apples."
    accepted_answers:
      - {value: [دو, تا, سیب, می‌خوام], status: correct}
    feedback: "دو تا سیب می‌خوام means I'd like two apples."
  fa.a1.unit03.lesson04.exercise07.translate_age_answer:
    instruction: "Translate into Farsi: I'm 25 years old."
    accepted_answers:
      - {value: "من بیست و پنج سالمه", status: correct}
      - {value: "بیست و پنج سالمه", status: correct}
    feedback: "من بیست و پنج سالمه means I'm 25 years old."
  fa.a1.unit03.lesson04.exercise08.dialogue_answer_age:
    instruction: "Reply by saying you are 30 years old."
    accepted_answers:
      - {value: "سی سالمه", status: correct}
      - {value: "من سی سالمه", status: correct}
    feedback: "Give a number followed by سالمه to state your age."

