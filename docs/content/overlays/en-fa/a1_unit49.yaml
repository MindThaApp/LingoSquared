  fa.a1.unit49.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit49.lesson01.teach.review_kojast_in:
    title: "Review: where is / this"
    gloss: "where is / this"
    note: "*کجاست* ('where is') was already taught in unit05; *این* ('this') was already taught in unit03/04/08."
  fa.a1.unit49.lesson01.teach.review_yek_mikhaam:
    title: "Review: one, a / I want"
    gloss: "one, a / I want"
    note: "*یک* ('one, a') was already taught in unit03; *می‌خوام* ('I want') was already taught in unit03."
  fa.a1.unit49.lesson01.teach.estakhr:
    title: "Swimming pool"
    gloss: "swimming pool"
    note: "*استخر* is a public swimming pool."
    example_gloss: "Where is the swimming pool?"

  fa.a1.unit49.lesson02.teach.review_cheghadr_mishe:
    title: "Review: how much / it comes to"
    gloss: "how much / it comes to"
    note: "*چقدر* ('how much') was already taught in unit21/28; *می‌شه* ('it comes to, costs') was already taught in unit11/35."
  fa.a1.unit49.lesson02.teach.review_panj_hezar_toman:
    title: "Review: five / thousand / toman"
    gloss: "five / thousand / toman"
    note: "*پنج* ('five') was already taught in unit03; *هزار* ('thousand') and *تومن* ('toman') were already taught in unit03/unit21."
  fa.a1.unit49.lesson02.teach.belit:
    title: Ticket
    gloss: ticket
    note: "*بلیط* is a ticket, used here for the swimming-pool entry ticket."
    example_gloss: "How much does the ticket come to?"

  fa.a1.unit49.lesson03.teach.review_darid:
    title: "Review: do you have"
    gloss: "do you have"
    note: "*دارید* ('do you have,' formal) was already taught in units 01/04/06/08/21/42/44/45."
  fa.a1.unit49.lesson03.teach.review_az_ta_saat:
    title: "Review: from / until / hour"
    gloss: "from / until / hour"
    note: "*از* ('from') was already taught in unit16; *تا* ('until, to') was already taught in unit42; *ساعت* ('hour, o'clock') was already taught in unit09."
  fa.a1.unit49.lesson03.teach.review_shesh_noh:
    title: "Review: six / nine"
    gloss: "six / nine"
    note: "*شش* ('six') and *نه* ('nine') were already taught in unit03."
  fa.a1.unit49.lesson03.teach.review_baz_baze:
    title: "Review: open / it's open"
    gloss: "open / it's open"
    note: "*باز* ('open') was already taught in unit08/24/27/43; *بازه* ('it's open') is the everyday colloquial contraction of *باز* + *است*, the same pattern as *خوبه* and *چنده*."
  fa.a1.unit49.lesson03.teach.komod:
    title: Locker
    gloss: locker
    note: "*کمد* is a locker or cabinet, used here for storing your things at the pool."
    example_gloss: "Do you have a locker?"
  fa.a1.unit49.lesson03.teach.estakhr_baze:
    title: "Is the pool open?"
    gloss: "Is the pool open?"
    note: "A question about the pool's opening hours, using only already-known words plus the new *بازه* contraction."

  fa.a1.unit49.lesson04.teach.review_salam_mamnoon:
    title: "Review: hi / thanks"
    gloss: "hi / thanks"
    note: "*سلام* and *ممنون* were already taught in units 01/17/22/45/46/47/48."
  fa.a1.unit49.lesson04.teach.review_bashe_baleh_khoobe:
    title: "Review: okay / yes / good"
    gloss: "okay / yes / good"
    note: "*باشه* ('okay') was already taught in units 01/02/06/17/22/45/46/47/48; *بله* ('yes') was already taught in unit20/21; *خوبه* ('good, that's fine') was already taught in unit06/10/12/19/48."
  fa.a1.unit49.lesson04.teach.review_aghaye_hast:
    title: "Review: Mr. / there is"
    gloss: "Mr. / there is"
    note: "*آقای* ('Mr.') was already taught in unit40/42/44/46/47; *هست* ('there is') was already taught in unit01/04/05/12."
  fa.a1.unit49.lesson04.teach.character_jafari:
    title: "Mr. Jafari"
    gloss: "Mr. Jafari"
    note: "*آقای جعفری* is the pool attendant in this unit's conversation. *آقای* ('Mr.') goes before his surname."
    example_gloss: "Hi Mr. Jafari!"
  fa.a1.unit49.lesson04.teach.dialogue_line1:
    title: "Nima: Hi Mr. Jafari. I want a swimming-pool ticket."
    gloss: "Hi Mr. Jafari. I want a swimming-pool ticket."
  fa.a1.unit49.lesson04.teach.dialogue_line2:
    title: "Mr. Jafari: Hi Nima. The ticket is 5,000 toman."
    gloss: "Hi Nima. The ticket is 5,000 toman."
  fa.a1.unit49.lesson04.teach.dialogue_line3:
    title: "Nima: Okay. Do you have a locker?"
    gloss: "Okay. Do you have a locker?"
  fa.a1.unit49.lesson04.teach.dialogue_line4:
    title: "Mr. Jafari: Yes, there's a locker."
    gloss: "Yes, there's a locker."
  fa.a1.unit49.lesson04.teach.dialogue_line5:
    title: "Nima: Is the pool open?"
    gloss: "Is the pool open?"
  fa.a1.unit49.lesson04.teach.dialogue_line6:
    title: "Mr. Jafari: Yes, it's open from six to nine."
    gloss: "Yes, it's open from six to nine."
  fa.a1.unit49.lesson04.teach.dialogue_line7:
    title: "Nima: Good. Thanks!"
    gloss: "Good. Thanks!"

  fa.a1.unit49.lesson05.teach.reading_text:
    title: "Reading: a swimming-pool sign"
    gloss: "Jafari Pool: ticket 5,000 toman. Six to nine o'clock."
    note: "A short pool sign naming the price and the opening hours."

  fa.a1.unit49.lesson06.teach.review_request:
    title: "I want a swimming-pool ticket."
    gloss: "I want a swimming-pool ticket."
    note: "A full review sentence reusing only already-known words from this unit."
  fa.a1.unit49.lesson06.teach.review_price_hours:
    title: "The ticket is 5,000 toman. It's open from six to nine."
    gloss: "The ticket is 5,000 toman. It's open from six to nine."
  fa.a1.unit49.lesson06.teach.summary_words:
    title: "Swimming pool / ticket / locker / Do you have a locker? / Is the pool open?"
    gloss: "swimming pool / ticket / locker / do you have a locker? / is the pool open?"
    note: "These are the key words and phrases taught in this unit."

exercises:
  fa.a1.unit49.lesson01.exercise01.recognize_estakhr:
    instruction: "What does this word mean?"
    correct_option: "swimming pool"
    distractors: [locker, ticket, bank]
    accepted_answers: [{value: "swimming pool", status: correct}]
    feedback: "استخر means 'swimming pool.'"
  fa.a1.unit49.lesson01.exercise02.recognize_estakhr_kojast:
    instruction: "What does this sentence mean?"
    correct_option: "Where is the swimming pool?"
    distractors: ["Where is the bank?", "Where is the pharmacy?", "I have a swimming pool."]
    accepted_answers: [{value: "Where is the swimming pool?", status: correct}]
    feedback: "استخر کجاست means 'Where is the swimming pool?'"
  fa.a1.unit49.lesson01.exercise03.match_pool_one:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {استخر: "swimming pool", کجاست: "where is", این: this, یک: "one, a", "می‌خوام": "I want", "استخر کجاست؟": "Where is the swimming pool?"}
        status: correct
    feedback: "These are the first new swimming-pool words for this unit."
  fa.a1.unit49.lesson01.exercise04.word_order_estakhr_kojast:
    instruction: "Put the words in order."
    accepted_answers: [{value: [استخر, کجاست], status: correct}]
    feedback: "استخر کجاست means 'Where is the swimming pool?'"
  fa.a1.unit49.lesson01.exercise05.translate_in_estakhr:
    instruction: "Translate into English: این استخر"
    answer_language_code: en
    accepted_answers:
      - {value: "This swimming pool.", status: correct}
      - {value: "this swimming pool", status: correct}
      - {value: "This pool.", status: correct}
      - {value: "this pool", status: correct}
    feedback: "این استخر means 'this swimming pool.'"

  fa.a1.unit49.lesson02.exercise01.recognize_belit:
    instruction: "What does this word mean?"
    correct_option: ticket
    distractors: [locker, price, key]
    accepted_answers: [{value: ticket, status: correct}]
    feedback: "بلیط means 'ticket.'"
  fa.a1.unit49.lesson02.exercise02.recognize_belit_cheghadr_mishe:
    instruction: "What does this sentence mean?"
    correct_option: "How much does the ticket come to?"
    distractors: ["Where is the ticket?", "Do you have a ticket?", "I don't want a ticket."]
    accepted_answers: [{value: "How much does the ticket come to?", status: correct}]
    feedback: "بلیط چقدر می‌شه؟ means 'How much does the ticket come to?'"
  fa.a1.unit49.lesson02.exercise03.match_pool_two:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {بلیط: ticket, چقدر: "how much", "می‌شه": "it comes to", پنج: five, هزار: thousand, تومن: toman, "بلیط چقدر می‌شه؟": "How much does the ticket come to?"}
        status: correct
    feedback: "These words let you ask about the ticket price."
  fa.a1.unit49.lesson02.exercise04.word_order_belit_panj_hezar_tomane:
    instruction: "Put the words in order."
    accepted_answers: [{value: [بلیط, پنج, هزار, "تومنه"], status: correct}]
    feedback: "بلیط پنج هزار تومنه means 'The ticket is 5,000 toman.'"
  fa.a1.unit49.lesson02.exercise05.translate_panj_hezar_toman:
    instruction: "Translate into English: پنج هزار تومن"
    answer_language_code: en
    accepted_answers:
      - {value: "5,000 toman.", status: correct}
      - {value: "5,000 toman", status: correct}
      - {value: "Five thousand toman.", status: correct}
      - {value: "Five thousand toman", status: correct}
    feedback: "پنج هزار تومن means '5,000 toman.'"

  fa.a1.unit49.lesson03.exercise01.recognize_komod_darid:
    instruction: "What does this sentence mean?"
    correct_option: "Do you have a locker?"
    distractors: ["Do you have a ticket?", "Do you have a towel?", "Do you have the price?"]
    accepted_answers: [{value: "Do you have a locker?", status: correct}]
    feedback: "کمد دارید؟ means 'Do you have a locker?'"
  fa.a1.unit49.lesson03.exercise02.recognize_estakhr_baze:
    instruction: "What does this sentence mean?"
    correct_option: "Is the pool open?"
    distractors: ["Is the pool closed?", "Is the pool far?", "Is the pool expensive?"]
    accepted_answers: [{value: "Is the pool open?", status: correct}]
    feedback: "استخر بازه؟ means 'Is the pool open?'"
  fa.a1.unit49.lesson03.exercise03.match_locker_and_hours:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {کمد: locker, دارید: "do you have", از: from, تا: to, ساعت: "hour, o'clock", شش: six, نه: nine, بازه: "it's open"}
        status: correct
    feedback: "These words let you ask about a locker and the opening hours."
  fa.a1.unit49.lesson03.exercise04.word_order_az_saat_shesh_ta_noh_baze:
    instruction: "Put the words in order."
    accepted_answers: [{value: [از, ساعت, شش, تا, نه, بازه], status: correct}]
    feedback: "از ساعت شش تا نه بازه means 'It's open from six to nine.'"
  fa.a1.unit49.lesson03.exercise05.translate_az_saat_shesh_ta_noh:
    instruction: "Translate into English: از ساعت شش تا نه"
    answer_language_code: en
    accepted_answers:
      - {value: "From six to nine.", status: correct}
      - {value: "From six to nine o'clock.", status: correct}
      - {value: "From six to nine", status: correct}
      - {value: "From 6 to 9.", status: correct}
    feedback: "از ساعت شش تا نه means 'from six to nine.'"

  fa.a1.unit49.lesson04.exercise01.dialogue_comprehension_hours:
    instruction: "Nima asks Mr. Jafari something. What does he want to know?"
    correct_option: "He wants to know if the pool is open."
    distractors:
      - "He wants to know if they sell swimsuits."
      - "He wants to know if there's a café."
      - "He wants to know how many lanes the pool has."
    accepted_answers: [{value: "He wants to know if the pool is open.", status: correct}]
    feedback: "استخر بازه؟ means 'Is the pool open?'"
  fa.a1.unit49.lesson04.exercise02.recognize_dialogue_line4:
    instruction: "What does this sentence mean?"
    correct_option: "Yes, there's a locker."
    distractors:
      - "No, there's no locker."
      - "The locker costs extra."
      - "The locker is broken."
    accepted_answers: [{value: "Yes, there's a locker.", status: correct}]
    feedback: "بله، کمد هست means 'Yes, there's a locker.'"
  fa.a1.unit49.lesson04.exercise03.match_dialogue_pool:
    instruction: "Match each line with its meaning."
    accepted_answers:
      - value: {"سلام آقای جعفری. یک بلیط استخر می‌خوام.": "Hi Mr. Jafari. I want a swimming-pool ticket.", "سلام نیما. بلیط پنج هزار تومنه.": "Hi Nima. The ticket is 5,000 toman.", "باشه. کمد دارید؟": "Okay. Do you have a locker?", "بله، کمد هست.": "Yes, there's a locker.", "استخر بازه؟": "Is the pool open?", "بله، از ساعت شش تا نه بازه.": "Yes, it's open from six to nine.", "خوبه. ممنون!": "Good. Thanks!"}
        status: correct
    feedback: "These lines appear in the swimming-pool conversation between Nima and Mr. Jafari."
  fa.a1.unit49.lesson04.exercise04.dialogue_response_confirm:
    instruction: "Respond to بله، از ساعت شش تا نه بازه by saying good, thanks."
    accepted_answers:
      - {value: "خوبه. ممنون!", status: correct}
      - {value: "خوبه. ممنون", status: correct}
      - {value: "خوبه، ممنون!", status: correct}
      - {value: "خوبه، ممنون", status: correct}
    feedback: "خوبه. ممنون! means 'Good. Thanks!'"
  fa.a1.unit49.lesson04.exercise05.translate_dialogue_line3:
    instruction: "Translate into English: باشه. کمد دارید؟"
    answer_language_code: en
    accepted_answers:
      - {value: "Okay. Do you have a locker?", status: correct}
      - {value: "Okay, do you have a locker?", status: correct}
      - {value: "Okay. Do you have a locker", status: correct}
