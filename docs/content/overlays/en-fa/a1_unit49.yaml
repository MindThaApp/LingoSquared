course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: buying a ticket at a public swimming pool,
    asking about a locker, understanding the opening hours, a full
    customer-to-attendant exchange, and reading/writing a short
    swimming-pool sign naming the ticket price and hours.

units:
  fa.a1.unit49.swimming_pool: {title: "Swimming Pool"}

lessons:
  fa.a1.unit49.lesson01.new_pool_one: {title: "New words 1"}
  fa.a1.unit49.lesson02.new_pool_two: {title: "New words 2"}
  fa.a1.unit49.lesson03.locker_and_hours: {title: "Locker and opening hours"}
  fa.a1.unit49.lesson04.pool_dialogue: {title: "Dialogue: at the swimming pool"}
