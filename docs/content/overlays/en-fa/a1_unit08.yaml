    accepted_answers: [{value: [باشه, برات, بیست, و, هشت, تومن, حساب, می‌کنم], status: correct}]
    feedback: "باشه، برات بیست و هشت تومن حساب می‌کنم agrees to the discounted price."
  fa.a1.unit08.lesson06.exercise05.translate_final_price:
    instruction: "Translate into Farsi: I'll charge you 28 toman."
    accepted_answers:
      - {value: "بیست و هشت تومن حساب می‌کنم", status: correct}
    feedback: "The shopkeeper says بیست و هشت تومن حساب می‌کنم."
  fa.a1.unit08.lesson06.exercise06.dialogue_response_pay:
