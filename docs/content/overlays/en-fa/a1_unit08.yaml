course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: shop vocabulary, asking the price, quantities
    when shopping, asking for a discount, and paying.

units:
  fa.a1.unit08.shopping:
    title: Shopping

lessons:
  fa.a1.unit08.lesson01.shop_vocabulary: {title: "Shop vocabulary"}
  fa.a1.unit08.lesson02.asking_the_price: {title: "Ask the price"}
  fa.a1.unit08.lesson03.quantities_in_shopping: {title: "Quantities when shopping"}
  fa.a1.unit08.lesson04.asking_for_a_discount: {title: "Ask for a discount"}
  fa.a1.unit08.lesson05.paying: {title: "Pay for your purchase"}
  fa.a1.unit08.lesson06.market_dialogue: {title: "A full market conversation"}

teaching:
  fa.a1.unit08.lesson01.teach.shop_word:
    title: "Shop"
    gloss: "shop"
    note: "مغازه is the general word for a small shop or store."
    example_gloss: "This shop is big."
  fa.a1.unit08.lesson01.teach.price_word:
    title: "Price"
    gloss: "price"
    note: "قیمت is the general word for price."
    example_gloss: "What is the price of this?"
  fa.a1.unit08.lesson01.teach.discount_word:
    title: "Discount"
    gloss: "discount"
    note: "تخفیف means discount, a common word in everyday Iranian shopping and bargaining."
    example_gloss: "Do you have a discount?"
  fa.a1.unit08.lesson01.teach.apple_word:
    title: "Apple"
    gloss: "apple"
    note: "سیب is a common example item for practicing prices and quantities."
    example_gloss: "I want an apple."
  fa.a1.unit08.lesson01.teach.va_word:
    title: "And"
    gloss: "and"
    note: "و is the common connecting word used throughout this unit."

  fa.a1.unit08.lesson02.teach.how_much_this:
    title: "Ask how much something costs"
    gloss: "How much is this?"
    note: "این چنده؟ is the everyday colloquial way to ask a price, a contraction of این چند است."
  fa.a1.unit08.lesson02.teach.per_kilo_price:
    title: "State a per-kilo price"
    gloss: "It's 30 toman per kilo."
    note: "کیلویی سی تومنه states a price per kilo using the colloquial -e contraction (تومنه = تومن است)."
  fa.a1.unit08.lesson02.teach.contraction_note:
    title: "The colloquial -e contraction (review)"
    gloss: "تومنه is the everyday spoken contraction of تومن است."
    note: "This is the same contraction pattern already seen with weather words like آفتابیه."

  fa.a1.unit08.lesson03.teach.one_kilo:
    title: "Ask for a kilo of apples"
    gloss: "I want a kilo of apples."
    note: "یک کیلو سیب می‌خوام uses کیلو (kilo) as the counting unit."
  fa.a1.unit08.lesson03.teach.half_kilo:
    title: "Ask for half a kilo"
    gloss: "I want half a kilo."
    note: "نصف کیلو می‌خوام substitutes نصف (half) for a full kilo."

  fa.a1.unit08.lesson04.teach.discount_question:
    title: "Ask for a discount"
    gloss: "Do you give a discount?"
    note: "تخفیف می‌دید؟ is a natural, common question in Iranian bazaars and shops -- bargaining is a normal, expected part of shopping culture, not rude or unusual."
  fa.a1.unit08.lesson04.teach.discount_offer:
    title: "The shopkeeper offers a lower price"
    gloss: "I'll charge you 28 toman."
    note: "برات بیست و هشت تومن حساب می‌کنم offers a small discount from the original 30 toman price."

  fa.a1.unit08.lesson05.teach.pay_cash:
    title: "Say you'll pay cash"
    gloss: "I'll pay in cash."
    note: "نقدی حساب می‌کنم states payment method using نقدی (in cash)."
  fa.a1.unit08.lesson05.teach.card_question:
    title: "Ask about paying by card"
    gloss: "Do you take card?"
    note: "کارت می‌گیرید؟ asks whether card payment is accepted."

  fa.a1.unit08.lesson06.teach.please_review:
    title: "Please / go ahead (review)"
    gloss: "please / go ahead"
    note: "بفرمایید was introduced in the greetings unit; here the shopkeeper uses it to invite the customer in."
  fa.a1.unit08.lesson06.teach.thanks_review:
    title: "Thank you (review)"
    gloss: "thank you"
    note: "ممنون was introduced in the greetings unit."
  fa.a1.unit08.lesson06.teach.no_worries_review:
    title: "No trouble at all (review)"
    gloss: "no trouble at all / you're welcome"
    note: "قابلی نداره is a modest, common way to deflect thanks, already seen in an earlier unit."
  fa.a1.unit08.lesson06.teach.turn01:
    title: "The shopkeeper greets the customer"
    gloss: "The shopkeeper greets the customer and invites them in."
    note: "بفرمایید invites the customer to look around or ask something."
  fa.a1.unit08.lesson06.teach.turn02:
    title: "The customer asks the price"
    gloss: "The customer greets the shopkeeper and asks the price of the apples."
    note: "این چنده؟ from lesson02, applied to سیب‌ها (the apples)."
  fa.a1.unit08.lesson06.teach.turn03:
    title: "The shopkeeper states the price"
    gloss: "The shopkeeper says it's 30 toman per kilo."
    note: "کیلویی سی تومنه from lesson02."
  fa.a1.unit08.lesson06.teach.turn04:
    title: "The customer orders and asks for a discount"
    gloss: "The customer says they want a kilo and asks for a discount."
    note: "This combines lesson03's quantity pattern with lesson04's discount question."
  fa.a1.unit08.lesson06.teach.turn05:
    title: "The shopkeeper agrees to a lower price"
    gloss: "The shopkeeper agrees and offers 28 toman."
    note: "باشه (okay) signals agreement before stating the discounted price."
  fa.a1.unit08.lesson06.teach.turn06:
    title: "The customer thanks and pays"
    gloss: "The customer thanks the shopkeeper and says they'll pay cash."
    note: "This combines lesson05's payment vocabulary with a simple thanks."
  fa.a1.unit08.lesson06.teach.turn07:
    title: "The shopkeeper closes the exchange"
    gloss: "The shopkeeper deflects the thanks and invites them to go ahead."
    note: "قابلی نداره، بفرمایید closes the transaction politely."

exercises:
  fa.a1.unit08.lesson01.exercise01.recognize_shop:
    instruction: "What does this word mean?"
    correct_option: shop
    distractors: [price, discount, apple]
    accepted_answers: [{value: shop, status: correct}]
    feedback: "مغازه means shop."
  fa.a1.unit08.lesson01.exercise02.recognize_price:
    instruction: "What does this word mean?"
    correct_option: price
    distractors: [shop, discount, apple]
    accepted_answers: [{value: price, status: correct}]
    feedback: "قیمت means price."
  fa.a1.unit08.lesson01.exercise03.recognize_takhfif_reading:
    instruction: "What does this word mean?"
    correct_option: discount
    distractors: [shop, price, apple]
    accepted_answers: [{value: discount, status: correct}]
    feedback: "تخفیف means discount."
  fa.a1.unit08.lesson01.exercise04.match_shop_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {مغازه: shop, قیمت: price, تخفیف: discount, سیب: apple, و: and, "این چنده؟": "How much is this?", تومن: toman, می‌خوام: "I want"}, status: correct}
    feedback: "These words cover basic shopping vocabulary, including تومن (the everyday currency unit) and این چنده؟ (the standard way to ask a price)."
  fa.a1.unit08.lesson01.exercise05.order_shop_words:
    instruction: "Arrange the words to say price and discount."
    accepted_answers: [{value: [قیمت, و, تخفیف], status: correct}]
    feedback: "قیمت و تخفیف joins the two words with و."
  fa.a1.unit08.lesson01.exercise06.translate_discount:
    instruction: "Translate into Farsi: discount."
    accepted_answers:
      - {value: تخفیف, status: correct}
    feedback: "تخفیف means discount."
  fa.a1.unit08.lesson01.exercise07.write_apple:
    instruction: "Write the Farsi word for apple."
    accepted_answers:
      - {value: سیب, status: correct}
    feedback: "سیب means apple."

  fa.a1.unit08.lesson02.exercise01.recognize_how_much:
    instruction: "Which phrase asks how much something costs?"
    correct_option: "How much is this?"
    distractors: ["It's 30 toman per kilo.", "Do you give a discount?", "I'll pay in cash."]
    accepted_answers: [{value: "How much is this?", status: correct}]
    feedback: "این چنده؟ asks the price of something."
  fa.a1.unit08.lesson02.exercise02.recognize_per_kilo:
    instruction: "Which phrase states a price per kilo?"
    correct_option: "It's 30 toman per kilo."
    distractors: ["How much is this?", "Do you give a discount?", "Do you take card?"]
    accepted_answers: [{value: "It's 30 toman per kilo.", status: correct}]
    feedback: "کیلویی سی تومنه states the price per kilo."
  fa.a1.unit08.lesson02.exercise03.recognize_how_much_reading:
    instruction: "What does this question ask?"
    correct_option: "How much is this?"
    distractors: ["It's 30 toman per kilo.", "Do you give a discount?", "Do you take cards?"]
    accepted_answers: [{value: "How much is this?", status: correct}]
    feedback: "این چنده؟ asks how much something is."
  fa.a1.unit08.lesson02.exercise04.match_price_phrases:
    instruction: "Match each phrase or word with its meaning."
    accepted_answers:
      - {value: {"این چنده؟": "How much is this?", "کیلویی سی تومنه": "It's 30 toman per kilo.", این: this, چنده: "how much is it", کیلویی: "per kilo", سی: thirty, تومن: toman}, status: correct}
    feedback: "These cover asking and stating a price, plus the individual words that build it."
  fa.a1.unit08.lesson02.exercise05.order_how_much:
    instruction: "Arrange the words to ask how much this is."
    accepted_answers: [{value: [این, چنده], status: correct}]
    feedback: "این چنده؟ asks the price."
  fa.a1.unit08.lesson02.exercise06.translate_price_question:
    instruction: "Translate into Farsi: How much is this?"
    accepted_answers:
      - {value: "این چنده؟", status: correct}
      - {value: "این چنده", status: correct}
    feedback: "این چنده؟ means how much is this?"
  fa.a1.unit08.lesson02.exercise07.speak_ask_price:
    instruction: "You'd like to know the price of an item. Ask the shopkeeper."
    accepted_answers:
      - {value: "این چنده؟", status: correct}
      - {value: "این چنده", status: correct}
    feedback: "این چنده؟ correctly asks the question."

  fa.a1.unit08.lesson03.exercise01.recognize_one_kilo:
    instruction: "What does this phrase mean?"
    correct_option: "I want a kilo of apples."
    distractors: ["I want half a kilo.", "How much is this?", "Do you give a discount?"]
    accepted_answers: [{value: "I want a kilo of apples.", status: correct}]
    feedback: "یک کیلو سیب می‌خوام asks for a kilo of apples."
  fa.a1.unit08.lesson03.exercise02.recognize_half_kilo:
    instruction: "What does this phrase mean?"
    correct_option: "I want half a kilo."
    distractors: ["I want a kilo of apples.", "It's 30 toman per kilo.", "I'll pay in cash."]
    accepted_answers: [{value: "I want half a kilo.", status: correct}]
    feedback: "نصف کیلو می‌خوام asks for half a kilo."
  fa.a1.unit08.lesson03.exercise03.recognize_quantity_reading:
    instruction: "What does this phrase mean?"
    correct_option: "I want a kilo of apples."
    distractors: ["I want half a kilo.", "How much is this?", "Do you give a discount?"]
    accepted_answers: [{value: "I want a kilo of apples.", status: correct}]
    feedback: "یک کیلو سیب می‌خوام means I want a kilo of apples."
  fa.a1.unit08.lesson03.exercise04.match_quantity_phrases:
    instruction: "Match each phrase or word with its meaning."
    accepted_answers:
      - {value: {"یک کیلو سیب می‌خوام": "I want a kilo of apples.", "نصف کیلو می‌خوام": "I want half a kilo.", یک: one, کیلو: kilo, سیب: apple, می‌خوام: "I want", نصف: half}, status: correct}
    feedback: "Both phrases use the same می‌خوام pattern for wanting a quantity, built from these words."
  fa.a1.unit08.lesson03.exercise05.order_one_kilo:
    instruction: "Arrange the words to say I want a kilo of apples."
    accepted_answers: [{value: [یک, کیلو, سیب, می‌خوام], status: correct}]
    feedback: "یک کیلو سیب می‌خوام asks for a kilo of apples."
  fa.a1.unit08.lesson03.exercise06.translate_half_kilo:
    instruction: "Translate into Farsi: I want half a kilo."
    accepted_answers:
      - {value: "نصف کیلو می‌خوام", status: correct}
    feedback: "نصف کیلو می‌خوام means I want half a kilo."
  fa.a1.unit08.lesson03.exercise07.translate_quantity:
    instruction: "Translate into Farsi: I want half a kilo of apples."
    accepted_answers:
      - {value: "نصف کیلو سیب می‌خوام", status: correct}
    feedback: "نصف کیلو سیب می‌خوام follows the same pattern with نصف."

  fa.a1.unit08.lesson04.exercise01.recognize_discount_question:
    instruction: "Which phrase asks for a discount?"
    correct_option: "Do you give a discount?"
    distractors: ["How much is this?", "I'll pay in cash.", "Do you take card?"]
    accepted_answers: [{value: "Do you give a discount?", status: correct}]
    feedback: "تخفیف می‌دید؟ asks whether the shopkeeper gives a discount."
  fa.a1.unit08.lesson04.exercise02.recognize_discount_offer:
    instruction: "Which phrase offers a discounted price?"
    correct_option: "I'll charge you 28 toman."
    distractors: ["Do you give a discount?", "It's 30 toman per kilo.", "I'll pay in cash."]
    accepted_answers: [{value: "I'll charge you 28 toman.", status: correct}]
    feedback: "برات بیست و هشت تومن حساب می‌کنم offers a lower price."
  fa.a1.unit08.lesson04.exercise03.recognize_discount_question_reading:
    instruction: "What does this question ask?"
    correct_option: "Do you give a discount?"
    distractors: ["How much is this?", "Do you take cards?", "I'll pay cash."]
    accepted_answers: [{value: "Do you give a discount?", status: correct}]
    feedback: "تخفیف می‌دید؟ asks do you give a discount?"
  fa.a1.unit08.lesson04.exercise04.match_discount_phrases:
    instruction: "Match each phrase or word with its meaning."
    accepted_answers:
      - {value: {"تخفیف می‌دید؟": "Do you give a discount?", "برات بیست و هشت تومن حساب می‌کنم": "I'll charge you 28 toman.", تخفیف: discount, می‌دید: "do you give", برات: "for you", بیست: twenty, هشت: eight, "می‌کنم": "I do / make"}, status: correct}
    feedback: "Bargaining for a small discount is a normal, expected part of everyday Iranian shopping."
  fa.a1.unit08.lesson04.exercise05.order_discount_question:
    instruction: "Arrange the words to ask for a discount."
    accepted_answers: [{value: [تخفیف, می‌دید], status: correct}]
    feedback: "تخفیف می‌دید؟ asks for a discount."
  fa.a1.unit08.lesson04.exercise06.translate_discount_question:
    instruction: "Translate into Farsi: Do you give a discount?"
    accepted_answers:
      - {value: "تخفیف می‌دید؟", status: correct}
      - {value: "تخفیف می‌دید", status: correct}
    feedback: "تخفیف می‌دید؟ means do you give a discount?"
  fa.a1.unit08.lesson04.exercise07.speak_ask_discount:
    instruction: "Ask the shopkeeper if they give a discount."
    accepted_answers:
      - {value: "تخفیف می‌دید؟", status: correct}
      - {value: "تخفیف می‌دید", status: correct}
    feedback: "تخفیف می‌دید؟ correctly asks the question."

  fa.a1.unit08.lesson05.exercise01.recognize_pay_cash:
    instruction: "What does this phrase mean?"
    correct_option: "I'll pay in cash."
    distractors: ["Do you take card?", "Do you give a discount?", "How much is this?"]
    accepted_answers: [{value: "I'll pay in cash.", status: correct}]
    feedback: "نقدی حساب می‌کنم says you'll pay in cash."
  fa.a1.unit08.lesson05.exercise02.recognize_card_question:
    instruction: "Which phrase asks whether they take card?"
    correct_option: "Do you take card?"
    distractors: ["I'll pay in cash.", "How much is this?", "Do you give a discount?"]
    accepted_answers: [{value: "Do you take card?", status: correct}]
    feedback: "کارت می‌گیرید؟ asks about card payment."
  fa.a1.unit08.lesson05.exercise03.recognize_pay_cash_reading:
    instruction: "What does this phrase mean?"
    correct_option: "I'll pay cash."
    distractors: ["Do you take cards?", "Do you give a discount?", "How much is this?"]
    accepted_answers: [{value: "I'll pay cash.", status: correct}]
    feedback: "نقدی حساب می‌کنم means I'll pay cash."
  fa.a1.unit08.lesson05.exercise04.match_payment_phrases:
    instruction: "Match each phrase or word with its meaning."
    accepted_answers:
      - {value: {"نقدی حساب می‌کنم": "I'll pay in cash.", "کارت می‌گیرید؟": "Do you take card?", نقدی: "in cash", کارت: card, "می‌گیرید": "do you take / accept", تخفیف: discount, تومن: toman}, status: correct}
    feedback: "These cover the two common payment options, plus a review of discount and currency words."
  fa.a1.unit08.lesson05.exercise05.order_pay_cash:
    instruction: "Arrange the words to say I'll pay in cash."
    accepted_answers: [{value: [نقدی, حساب, می‌کنم], status: correct}]
    feedback: "نقدی حساب می‌کنم says you'll pay in cash."
  fa.a1.unit08.lesson05.exercise06.translate_card_question:
    instruction: "Translate into Farsi: Do you take cards?"
    accepted_answers:
      - {value: "کارت می‌گیرید؟", status: correct}
      - {value: "کارت می‌گیرید", status: correct}
    feedback: "کارت می‌گیرید؟ means do you take cards?"
  fa.a1.unit08.lesson05.exercise07.translate_pay_cash:
    instruction: "Translate into Farsi: I'll pay in cash."
    accepted_answers:
      - {value: "نقدی حساب می‌کنم", status: correct}
    feedback: "نقدی حساب می‌کنم says you'll pay in cash."

  fa.a1.unit08.lesson06.exercise01.listen_context:
    instruction: "Read the conversation. What is the customer buying?"
    correct_option: apples
    distractors: [bread, tea, rice]
    accepted_answers: [{value: apples, status: correct}]
    feedback: "The customer asks the price of سیب‌ها (the apples)."
  fa.a1.unit08.lesson06.exercise02.recognize_original_price:
    instruction: "What was the original price per kilo, before the discount?"
    correct_option: "30 toman"
    distractors: ["28 toman", "20 toman", "35 toman"]
    accepted_answers: [{value: "30 toman", status: correct}]
    feedback: "The shopkeeper first says کیلویی سی تومنه (30 toman per kilo)."
  fa.a1.unit08.lesson06.exercise03.match_dialogue_facts:
    instruction: "Match each cue or word with its meaning in the dialogue."
    accepted_answers:
      - {value: {کیلویی: "سی تومن", تخفیف: "بیست و هشت تومن", بفرمایید: "please / go ahead", ممنون: "thank you", "قابلی نداره": "you're welcome / don't mention it", فروشنده: seller, مشتری: customer, باشه: okay}, status: correct}
    feedback: "The original per-kilo price was 30 toman, the discounted price is 28 toman, and these are the dialogue's other key expressions."
  fa.a1.unit08.lesson06.exercise04.order_discount_agreement:
