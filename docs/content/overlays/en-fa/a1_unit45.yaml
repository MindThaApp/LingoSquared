review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), paired with the
    fa.a1.unit45.pharmacy realization's own review note (see that file
    for full detail on the bug found and fixed): the pharmacist's name
    was changed from خانم رضایی to خانم صالحی (Ms. Rezaei -> Ms. Salehi
    in every English title/gloss/instruction/feedback string below, and
    the teaching content_key renamed from ...teach.character_rezaei to
    ...teach.character_salehi) after a corpus-wide grep found the
    original name collided with unit41's already-mentioned دکتر رضایی
    (Dr. Rezaei, the dentist) -- a collision the original authoring's
    آقای/خانم-only regex scan structurally could not have caught. On this
    overlay's own side: re-verified every English string reflects the
    corrected name and content_key consistently; re-confirmed a real
    yaml.safe_load boolean-type walk found zero stray
    yes/no/true/false/on/off coercions; re-confirmed every "Translate
    into English" exercise explicitly sets answer_language_code: en (5
    of 5); no jargon leaks. Standalone and 4-unit-combined compiler
    validation: 0 errors/0 warnings.

    Draft overlay paired with the fa.a1.unit45.pharmacy realization. See
    that file's generation_provenance for the honest source-access result:
    with Firecrawl at 0 credits this session, tried WebFetch directly
    against the Live Lingua-hosted FSI Persian Basic Course PDF first (per
    this task's explicit instruction), which returned only a binary-
    content notice with no usable text; fell back to a local `pdftotext
    -layout` extraction of the same file (66,717 words, matching every
    prior fetch of this file across units 36-44). A grep for pharmac/
    medicine/drug/prescription/dosage/headache/fever/pill/tablet/
    drugstore/chemist found zero hits -- a genuine dead end, unlike
    unit44's hotel search. A broader grep for sick/illness/doctor/
    hospital/health found only scattered vocabulary-list entries, no
    structured pharmacy or dosage-instruction content anywhere in the
    extracted text. All pharmacy vocabulary and the full dialogue are
    authored fresh from this project's own established conventions. Reuse
    chain: سردرد/دارو (unit17), دارم (unit12), می‌خوام (unit03), کجاست
    (unit05), این (unit08), خوب (unit13), بعد (unit05), غذا (unit26), از
    (unit16/unit42), چند/تا/دو/نه (unit03/unit04), فقط (unit23), می‌تونم
    (unit20), هم (unit01), باشه/ممنون/خداحافظ/سلام (units01/02/05/06/16/
    17/22), خانم (unit41). New vocabulary genuinely introduced for the
    first time in the whole corpus: داروخانه (pharmacy), قرص (pill/
    tablet), قبل (before), and روزی (per day/daily) -- 4 new words, no new
    verb conjugation pattern introduced. Register note: نیما (established
    from unit17's own health dialogue) is the pharmacy customer; a new
    formal-register character, خانم صالحی, is the pharmacist, distinct
    from unit41's خانم احمدی, unit42's آقای صادقی, and unit44's آقای
    کریمی (confirmed via a real regex scan of every آقای/خانم name already
    used across the fa corpus, zero collision). The dosage fact (two
    pills a day, after food, not before) is kept identical across the
    dialogue, the reading note, and the wrap-up review, per
    AUTHORING_GUIDE.md #11 -- the dialogue itself actively reinforces the
    "after food only" fact by having نیما ask about taking it before food
    and be told no, rather than asserting it just once. Every "Translate
    into English" exercise below explicitly sets answer_language_code:
    en. No exercise in this unit tests a genuine two-clause sentence
    (§12) -- every translated sentence is a single clause or a
    colon-separated label-style note (lesson05's reading text, matching
    unit43/unit44's own treatment of their colon-separated notes with
    paraphrase-variant accepted answers). No listen_type/listen_select/
    listen_order exercise is used anywhere in this unit (continuing the
    established text-based corpus-consistency pattern from units 19-44),
    so the same-speaker/same-audio distractor-collision bug class fixed
    2026-07-09 in the nl corpus (commit 148240e) cannot directly apply
    here -- verified anyway that lesson04's dialogue_comprehension
    distractors ("He wants to know if the medicine is expensive."/"He
    wants to know where the pharmacy is."/"He wants to know if he needs
    to see a doctor.") are plausible-fact alternatives, not lines either
    dialogue speaker (نیما or خانم صالحی) actually says or facts they
    actually state anywhere in this unit's dialogue -- price, the
    pharmacy's location, and seeing a doctor are never mentioned by
    either speaker; a "does he want to know if he can take it before
    food" distractor was deliberately avoided since نیما DOES ask about
    that later in this same dialogue ("قبل از غذا هم می‌تونم؟"), which
    would have been a real content collision of the same shape as the
    documented same-speaker-audio footgun even though this exercise
    isn't audio-based. Boolean-coercion check: ran a recursive
    yaml.safe_load scan over title/gloss/note/example_gloss/answer/
    matching-pair value fields (including matching_pairs right: values
    specifically) across both this overlay and the paired realization
    for bare yes/no/true/false/on/off string values or coerced booleans
    -- zero hits. Compiler validation, both standalone and against the
    full 45-unit en-fa A1 corpus with position-matched realization/
    overlay lists, confirmed 0 errors.

    Review 2026-10-21 (en-fa A1 pass): 7 fix groups - the ungrammatical
    gloss 'Can I also before food?' replaced with 'Can I take it before food
    too?' (titles, gloss, matching pair, feedback; realization matching-pair
    English updated to match); internal 'unitNN' wording in teaching notes
    rewritten as 'unit N'; Persian words in notes/feedback wrapped in
    asterisks (section 15); meta wording about the pharmacist character and
    the review pair rewritten; extra accepted answers (no-comma and 'دوتا'
    dosage variants, medicine/pill/meal English variants). NATIVE FLAGS:
    whether a printed label would say 'روزی دو تا' or a more written form
    like 'روزی دو عدد'; naturalness of the elliptical 'قبل از غذا هم
    می‌تونم؟'.

course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: asking a pharmacist for a basic medicine,
    describing a symptom (a headache), understanding dosage instructions
    (how many a day, before or after food), a full customer-to-pharmacist
    exchange, and reading/writing a short medicine dosage note.

units:
  fa.a1.unit45.pharmacy:
    title: The pharmacy

lessons:
  fa.a1.unit45.lesson01.new_pharmacy_one: {title: "New words 1"}
  fa.a1.unit45.lesson02.new_pharmacy_two: {title: "New words 2"}
  fa.a1.unit45.lesson03.dosage_timing: {title: "When to take medicine"}
  fa.a1.unit45.lesson04.pharmacy_dialogue: {title: "Dialogue: at the pharmacy"}
  fa.a1.unit45.lesson05.reading_dosage_note: {title: "Reading a medicine label"}
  fa.a1.unit45.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit45.lesson01.teach.review_sardard_daram:
    title: "Review: headache / I have"
    gloss: "headache / I have"
    note: "*سردرد* ('headache') was already taught in unit 17; *دارم* ('I have') was already taught in unit 12."
  fa.a1.unit45.lesson01.teach.review_daroo_mikhaam:
    title: "Review: medicine / I want"
    gloss: "medicine / I want"
    note: "*دارو* ('medicine') was already taught in unit 17; *می‌خوام* ('I want') was already taught in unit 3."
  fa.a1.unit45.lesson01.teach.review_kojast:
    title: "Review: where is"
    gloss: "where is"
    note: "*کجاست* ('where is') was already taught in unit 5."
  fa.a1.unit45.lesson01.teach.daroukhane:
    title: Pharmacy
    gloss: pharmacy
    note: "*داروخانه* means 'pharmacy.'"
    example_gloss: "Where is the pharmacy?"

  fa.a1.unit45.lesson02.teach.review_in:
    title: "Review: this"
    gloss: this
    note: "*این* ('this') was already taught in unit 8."
  fa.a1.unit45.lesson02.teach.review_khoob:
    title: "Review: good / is good"
    gloss: "good / is good"
    note: "*خوب* ('good') was already taught in unit 13; *خوبه* is its colloquial contraction of '*خوب است*' ('is good')."
  fa.a1.unit45.lesson02.teach.gors:
    title: "Pill / tablet"
    gloss: "pill / tablet"
    note: "*قرص* means 'pill' or 'tablet.'"
    example_gloss: "This pill is good."

  fa.a1.unit45.lesson03.teach.review_bad_ghaza:
    title: "Review: after / food"
    gloss: "after / food, meal"
    note: "*بعد* ('after') was already taught in unit 5; *غذا* ('food, meal') was already taught in unit 26."
  fa.a1.unit45.lesson03.teach.review_az:
    title: "Review: from"
    gloss: from
    note: "*از* ('from') was already taught in units 16 and 42."
  fa.a1.unit45.lesson03.teach.review_chand_ta_do:
    title: "Review: how many / counter word / two"
    gloss: "how many / (counter word) / two"
    note: "*چند* ('how many') was already taught in units 3 and 4; *تا* (a counter word) and *دو* ('two') were already taught in unit 3."
  fa.a1.unit45.lesson03.teach.review_na_faghat:
    title: "Review: no / only"
    gloss: "no / only"
    note: "*نه* ('no') was already taught in unit 3; *فقط* ('only') was already taught in unit 23."
  fa.a1.unit45.lesson03.teach.ghabl:
    title: Before
    gloss: before
    note: "*قبل* means 'before.'"
    example_gloss: "Before food."
  fa.a1.unit45.lesson03.teach.roozi:
    title: "Per day"
    gloss: "per day, daily"
    note: "*روزی* means 'per day' or 'daily.'"
    example_gloss: "Two a day."

  fa.a1.unit45.lesson04.teach.review_salam_mamnoon:
    title: "Review: hi / thanks"
    gloss: "hi / thanks"
    note: "*سلام* and *ممنون* were already taught in units 1, 17, and 22."
  fa.a1.unit45.lesson04.teach.review_bashe:
    title: "Review: okay"
    gloss: okay
    note: "*باشه* ('okay') was already taught in units 1, 2, 6, 17, and 22."
  fa.a1.unit45.lesson04.teach.review_khodahafez:
    title: "Review: goodbye"
    gloss: goodbye
    note: "*خداحافظ* was already taught in units 1, 5, and 16."
  fa.a1.unit45.lesson04.teach.review_mitoonam_ham:
    title: "Review: I can / also"
    gloss: "I can / also, too"
    note: "*می‌تونم* ('I can') was already taught in unit 20; *هم* ('also, too') was already taught in unit 1."
  fa.a1.unit45.lesson04.teach.review_khanoom:
    title: "Review: Ms. / madam / has"
    gloss: "Ms., madam / has"
    note: "*خانم* was already taught in unit 41; *داره* ('has,' colloquial 3rd person) was already taught in unit 4."
  fa.a1.unit45.lesson04.teach.character_salehi:
    title: "Ms. Salehi"
    gloss: "Ms. Salehi"
    note: "*خانم صالحی* is the pharmacist in this unit's dialogue."
    example_gloss: "Ms. Salehi has a pharmacy."
  fa.a1.unit45.lesson04.teach.dialogue_line1:
    title: "Nima: Hi. I have a headache. I want medicine."
    gloss: "Hi. I have a headache. I want medicine."
  fa.a1.unit45.lesson04.teach.dialogue_line2:
    title: "Ms. Salehi: Hi. This pill is good."
    gloss: "Hi. This pill is good."
  fa.a1.unit45.lesson04.teach.dialogue_line3:
    title: "Nima: How many a day?"
    gloss: "How many a day?"
  fa.a1.unit45.lesson04.teach.dialogue_line4:
    title: "Ms. Salehi: Two a day, after food."
    gloss: "Two a day, after food."
  fa.a1.unit45.lesson04.teach.dialogue_line5:
    title: "Nima: Can I take it before food too?"
    gloss: "Can I take it before food too?"
  fa.a1.unit45.lesson04.teach.dialogue_line6:
    title: "Ms. Salehi: No, only after food."
    gloss: "No, only after food."
  fa.a1.unit45.lesson04.teach.dialogue_line7:
    title: "Nima: Okay, thanks. Goodbye!"
    gloss: "Okay, thanks. Goodbye!"

  fa.a1.unit45.lesson05.teach.reading_text:
    title: "Reading: a medicine label"
    gloss: "Headache pill: two a day, after food."
    note: "A short medicine label naming what it's for and the dosage."

  fa.a1.unit45.lesson06.teach.review_request:
    title: "I want medicine. I have a headache."
    gloss: "I want medicine. I have a headache."
    note: "A review pair of sentences using words you have already met in this unit."
  fa.a1.unit45.lesson06.teach.review_dosage:
    title: "Two a day, after food."
    gloss: "Two a day, after food."
  fa.a1.unit45.lesson06.teach.summary_words:
    title: "Pharmacy / pill / before / after / food / per day"
    gloss: "pharmacy / pill / before / after / food / per day"
    note: "These are the key words taught in this unit."

exercises:
  fa.a1.unit45.lesson01.exercise01.recognize_daroukhane:
    instruction: "What does this word mean?"
    correct_option: pharmacy
    distractors: [medicine, headache, doctor]
    accepted_answers: [{value: pharmacy, status: correct}]
    feedback: "*داروخانه* means pharmacy."
  fa.a1.unit45.lesson01.exercise02.recognize_daroukhane_kojast:
    instruction: "What does this sentence mean?"
    correct_option: "Where is the pharmacy?"
    distractors: ["Where is the doctor?", "Do you have medicine?", "I have a headache."]
    accepted_answers: [{value: "Where is the pharmacy?", status: correct}]
    feedback: "*داروخانه کجاست؟* means 'Where is the pharmacy?'"
  fa.a1.unit45.lesson01.exercise03.match_pharmacy_one:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {داروخانه: pharmacy, دارو: medicine, سردرد: headache, دارم: "I have", کجاست: "where is", "می‌خوام": "I want"}
        status: correct
    feedback: "These are the first new pharmacy words for this unit."
  fa.a1.unit45.lesson01.exercise04.word_order_daroukhane_kojast:
    instruction: "Put the words in order."
    accepted_answers: [{value: [داروخانه, کجاست], status: correct}]
    feedback: "*داروخانه کجاست؟* means 'Where is the pharmacy?'"
  fa.a1.unit45.lesson01.exercise05.translate_daroo_mikhaam:
    instruction: "Translate into English: دارو می‌خوام."
    answer_language_code: en
    accepted_answers:
      - {value: "I want medicine.", status: correct}
      - {value: "I want medicine", status: correct}
      - {value: "I want some medicine.", status: correct}
      - {value: "I want the medicine.", status: correct}
      - {value: "I'd like some medicine.", status: correct}
      - {value: "I'd like medicine.", status: correct}
      - {value: "I would like some medicine.", status: correct}
    feedback: "*دارو می‌خوام* means 'I want medicine.'"

  fa.a1.unit45.lesson02.exercise01.recognize_gors:
    instruction: "What does this word mean?"
    correct_option: "pill / tablet"
    distractors: [pharmacy, medicine, headache]
    accepted_answers: [{value: "pill / tablet", status: correct}]
    feedback: "*قرص* means pill or tablet."
  fa.a1.unit45.lesson02.exercise02.recognize_in_gors_khoobe:
    instruction: "What does this sentence mean?"
    correct_option: "This pill is good."
    distractors: ["This medicine is bad.", "This is the pharmacy.", "I want this pill."]
    accepted_answers: [{value: "This pill is good.", status: correct}]
    feedback: "*این قرص خوبه* means 'This pill is good.'"
  fa.a1.unit45.lesson02.exercise03.match_pharmacy_two:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {قرص: "pill / tablet", این: this, خوب: good, خوبه: "is good", داروخانه: pharmacy, دارو: medicine}
        status: correct
    feedback: "These words let you talk about the pill and say it's good."
  fa.a1.unit45.lesson02.exercise04.word_order_in_gors_khoobe:
    instruction: "Put the words in order."
    accepted_answers: [{value: [این, قرص, خوبه], status: correct}]
    feedback: "*این قرص خوبه* means 'This pill is good.'"
  fa.a1.unit45.lesson02.exercise05.translate_gors_mikhaam:
    instruction: "Translate into English: قرص می‌خوام."
    answer_language_code: en
    accepted_answers:
      - {value: "I want a pill.", status: correct}
      - {value: "I want a pill", status: correct}
      - {value: "I want the pill.", status: correct}
      - {value: "I want a tablet.", status: correct}
      - {value: "I want a tablet", status: correct}
      - {value: "I want the tablet.", status: correct}
      - {value: "I'd like a pill.", status: correct}
      - {value: "I'd like a pill", status: correct}
    feedback: "*قرص می‌خوام* means 'I want a pill.'"

  fa.a1.unit45.lesson03.exercise01.recognize_ghabl:
    instruction: "What does this word mean?"
    correct_option: before
    distractors: [after, only, food]
    accepted_answers: [{value: before, status: correct}]
    feedback: "*قبل* means 'before.'"
  fa.a1.unit45.lesson03.exercise02.recognize_roozi_do_ta:
    instruction: "What does this phrase mean?"
    correct_option: "Two a day."
    distractors: ["Once a day.", "Two before food.", "Three a day."]
    accepted_answers: [{value: "Two a day.", status: correct}]
    feedback: "*روزی دو تا* means 'Two a day.'"
  fa.a1.unit45.lesson03.exercise03.match_dosage_timing:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {قبل: before, بعد: after, غذا: "food, meal", روزی: "per day, daily", "روزی دو تا": "two a day", "قبل از غذا": "before food", "بعد از غذا": "after food"}
        status: correct
    feedback: "These words let you talk about when and how often to take medicine."
  fa.a1.unit45.lesson03.exercise04.word_order_roozi_do_ta:
    instruction: "Put the words in order."
    accepted_answers: [{value: [روزی, دو, تا], status: correct}]
    feedback: "*روزی دو تا* means 'Two a day.'"
  fa.a1.unit45.lesson03.exercise05.translate_bad_az_ghaza:
    instruction: "Translate into English: بعد از غذا."
    answer_language_code: en
    accepted_answers:
      - {value: "After food.", status: correct}
      - {value: "After food", status: correct}
      - {value: "After the meal.", status: correct}
      - {value: "After a meal.", status: correct}
      - {value: "After meals.", status: correct}
      - {value: "After eating.", status: correct}
      - {value: "After the food.", status: correct}
      - {value: "After the meal", status: correct}
      - {value: "After meals", status: correct}
    feedback: "*بعد از غذا* means 'After food.'"

  fa.a1.unit45.lesson04.exercise01.dialogue_comprehension_dosage:
    instruction: "Nima asks Ms. Salehi something. What does he want to know?"
    correct_option: "He wants to know how many pills to take per day."
    distractors:
      - "He wants to know if the medicine is expensive."
      - "He wants to know where the pharmacy is."
      - "He wants to know if he needs to see a doctor."
    accepted_answers: [{value: "He wants to know how many pills to take per day.", status: correct}]
    feedback: "*روزی چند تا؟* means 'How many a day?'"
  fa.a1.unit45.lesson04.exercise02.recognize_dialogue_line6:
    instruction: "What does this sentence mean?"
    correct_option: "No, only after food."
    distractors:
      - "No, only before food."
      - "Yes, before food too."
      - "No, not with food."
    accepted_answers: [{value: "No, only after food.", status: correct}]
    feedback: "*نه، فقط بعد از غذا* means 'No, only after food.'"
  fa.a1.unit45.lesson04.exercise03.match_dialogue_pharmacy:
    instruction: "Match each line with its meaning."
    accepted_answers:
      - value: {"سلام. سردرد دارم. دارو می‌خوام.": "Hi. I have a headache. I want medicine.", "سلام. این قرص خوبه.": "Hi. This pill is good.", "روزی چند تا؟": "How many a day?", "روزی دو تا، بعد از غذا.": "Two a day, after food.", "قبل از غذا هم می‌تونم؟": "Can I take it before food too?", "نه، فقط بعد از غذا.": "No, only after food.", "باشه، ممنون. خداحافظ!": "Okay, thanks. Goodbye!"}
        status: correct
    feedback: "These lines appear in the pharmacy conversation between Nima and Ms. Salehi."
  fa.a1.unit45.lesson04.exercise04.dialogue_response_dosage:
    instruction: "Respond to روزی چند تا؟ by saying two a day, after food."
    accepted_answers:
      - {value: "روزی دو تا، بعد از غذا.", status: correct}
      - {value: "روزی دو تا، بعد از غذا", status: correct}
      - {value: "روزی دو تا بعد از غذا.", status: correct}
      - {value: "روزی دو تا بعد از غذا", status: correct}
      - {value: "روزی دوتا، بعد از غذا.", status: correct}
      - {value: "روزی دوتا، بعد از غذا", status: correct}
      - {value: "روزی دوتا بعد از غذا", status: correct}
    feedback: "روزی دو تا، بعد از غذا means 'Two a day, after food.'"
  fa.a1.unit45.lesson04.exercise05.translate_ghabl_az_ghaza_ham:
    instruction: "Translate into English: قبل از غذا هم می‌تونم؟"
    answer_language_code: en
    accepted_answers:
      - {value: "Can I take it before food too?", status: correct}
      - {value: "Can I also take it before food?", status: correct}
      - {value: "Can I also do it before food?", status: correct}
      - {value: "Can I take it before food as well?", status: correct}
      - {value: "Can I take it before meals too?", status: correct}
      - {value: "Can I also take it before meals?", status: correct}
      - {value: "Can I take it before food too", status: correct}
      - {value: "Can I also before food?", status: correct}
    feedback: "*قبل از غذا هم می‌تونم؟* means 'Can I take it before food too?'"

  fa.a1.unit45.lesson05.exercise01.reading_comprehension_what_for:
    instruction: "According to the label, what is this pill for?"
    correct_option: "A headache."
    distractors:
      - "A fever."
      - "A stomachache."
      - "Tiredness."
    accepted_answers: [{value: "A headache.", status: correct}]
    feedback: "*قرص سردرد* means 'headache pill.'"
  fa.a1.unit45.lesson05.exercise02.reading_comprehension_how_many:
    instruction: "According to the label, how many should you take and when?"
    correct_option: "Two, after food."
    distractors:
      - "One, before food."
      - "Three, before food."
      - "Two, before food."
    accepted_answers: [{value: "Two, after food.", status: correct}]
    feedback: "*روزی دو تا، بعد از غذا* means 'Two a day, after food.'"
  fa.a1.unit45.lesson05.exercise03.match_reading_dosage:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {قرص: pill, سردرد: headache, روزی: "per day", "دو تا": "two (of them)", بعد: after, غذا: food}
        status: correct
