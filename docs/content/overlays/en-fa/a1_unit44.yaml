generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Draft overlay paired with the fa.a1.unit44.accommodation realization.
    See that file's generation_provenance for the honest source-access
    result: with Firecrawl at 0 credits this session, tried the Live
    Lingua-hosted FSI Persian Basic Course mirror via direct pdftotext (same
    method as units 36-43), which re-confirmed its real OCR text layer
    (66,717 extractable words this fetch, consistent with every prior
    fetch). A grep for hotel/room/checkin/reservation/lodging/guesthouse/
    hostel/breakfast/passport/wifi/receptionist found 137 hits -- a real,
    substantive positive result, unlike units 39-43's dead ends. FSI's Unit
    3 grammar notes (around a printed "Hotel" section header) genuinely
    attest مهمانخانه ("hotel/guesthouse") in real sentences ("این نزدیکیا
    مهمانخانه خوب کجاست؟," "این مهمانخانه رستوران هم داره؟"), but the
    material is a grammar lecture (pronoun suffixes, the plural suffix, the
    verb 'to be') using hotel-themed examples, not a structured check-in/
    booking/room-service dialogue -- no room type, breakfast, wifi, key, or
    checkout-time content exists anywhere in the extracted text. Credited
    honestly: مهمانخانه is FSI's real attested word for hotel, but this
    unit deliberately teaches the everyday colloquial loanword هتل instead
    (a disclosed dialect-authenticity choice, not an oversight); all
    check-in/booking vocabulary and the full dialogue are authored fresh
    from this project's own established conventions. Reuse chain: کجاست
    (unit05), اتاق (unit19), کلید (unit40), من (unit02), دارم (unit12),
    دارید (unit06/42), چند (units03/04), شب (unit09), این (unit08), ساعت
    (unit09), هفت/ده/دو/دوازده (unit03), می‌تونم/کنم (unit20), خوش/اومدید
    (unit06), چنده (unit09), سلام/ممنون (units01/17/22), باشه (units01/02/
    06/17/22), بله (unit06), اسمم/نیما (unit02, نیما already this course's
    recurring traveler from units16/20), شما (unit01), از/تا (unit16/42),
    هم (unit01), ظهر (unit09), خداحافظ (units01/05/16), تخت (unit19),
    تاریخ/دوشنبه/چهارشنبه (unit10). New vocabulary genuinely introduced for
    the first time in the whole corpus: هتل (hotel), رزرو (reservation/
    booking), صبحانه (breakfast), وای‌فای (wifi), خروج (checkout/
    departure), آماده (ready), and مهمان (guest) -- 7 new words, no new verb
    conjugation pattern introduced. Register note: نیما (the established
    traveler) is the guest; a new formal-register character, آقای کریمی,
    is the hotel receptionist, distinct from unit41's خانم احمدی and
    unit42's آقای صادقی. Facts (breakfast seven-to-ten, checkout twelve
    noon) are kept identical across the dialogue and every exercise
    referencing them, per AUTHORING_GUIDE.md #11; lesson05's reading note
    (guest Nima, a double room, Monday-to-Wednesday) is an independent
    example booking, not implying it is literally the same stay as the
    dialogue's. Every "Translate into English" exercise below explicitly
    sets answer_language_code: en. The one genuine two-clause sentence
    tested for translation (lesson04.exercise05, "بله. ساعت خروج هم دوازده
    ظهره.") carries period-joined, comma-joined, and and-joined English
    variants per §12; lesson05's reading-note translation and lesson06's
    review sentences are single label-style/paraphrase sentences with
    paraphrase-variant accepted answers, matching unit43's own treatment of
    its colon-separated waste-sorting notice. No listen_type/listen_select/
    listen_order exercise is used anywhere in this unit (continuing the
    established text-based corpus-consistency pattern from units 19-43), so
    the same-speaker/same-audio distractor-collision bug class fixed
    2026-07-09 in the nl corpus (commit 148240e) cannot directly apply here
    -- verified anyway that lesson04's dialogue_comprehension distractors
    ("He wants to know if the hotel has a restaurant."/"He wants to know
    where the key is."/"He wants to know the room price.") are
    plausible-fact alternatives, not lines either dialogue speaker (نیما or
    آقای کریمی) actually says or facts they actually state anywhere in this
    unit's dialogue -- a restaurant, the key, and a price are never
    mentioned by either speaker; a "does he want to know about wifi"
    distractor was deliberately avoided since نیما DOES ask about wifi
    later in this same dialogue ("وای‌فای دارید؟"), which would have been a
    real content collision of the same shape as the documented
    same-speaker-audio footgun even though this exercise isn't audio-based.
    Boolean-coercion check: ran a recursive yaml.safe_load scan over
    title/gloss/note/example_gloss/answer/matching-pair value fields
    (including matching_pairs right: values specifically) across both this
    overlay and the paired realization for bare yes/no/true/false/on/off
    string values or coerced booleans -- zero hits. Compiler validation,
    both standalone and against the full 44-unit en-fa A1 corpus with
    position-matched realization/overlay lists, confirmed 0 errors.

course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: checking into a hotel -- naming the room, key,
    breakfast, and wifi, asking to book a room and about the checkout time,
    a full guest-to-receptionist check-in dialogue, and reading/writing a
    short hotel booking confirmation note.

units:
  fa.a1.unit44.accommodation:
    title: "Staying at a hotel"

lessons:
  fa.a1.unit44.lesson01.new_hotel_one: {title: "New words 1"}
  fa.a1.unit44.lesson02.new_hotel_two: {title: "New words 2"}
  fa.a1.unit44.lesson03.booking_checkout: {title: "Booking and checkout time"}
  fa.a1.unit44.lesson04.checkin_dialogue: {title: "Dialogue: checking into the hotel"}
  fa.a1.unit44.lesson05.reading_booking_note: {title: "Reading a hotel booking note"}
  fa.a1.unit44.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit44.lesson01.teach.review_kojast:
    title: "Review: where is"
    gloss: "where is"
    note: "*کجاست* ('where is') was already taught in unit05."
  fa.a1.unit44.lesson01.teach.review_otagh_kelid:
    title: "Review: room / key"
    gloss: "room / key"
    note: "*اتاق* ('room') was already taught in unit19; *کلید* ('key') was already taught in unit40."
  fa.a1.unit44.lesson01.teach.review_daram_darid:
    title: "Review: I / I have / you have"
    gloss: "I / I have / you have (formal)"
    note: "*من* ('I') was already taught in unit02; *دارم* ('I have') was already taught in unit12; *دارید* ('you have,' formal) was already taught in unit06."
  fa.a1.unit44.lesson01.teach.hotel:
    title: Hotel
    gloss: hotel
    note: "*هتل* means 'hotel.'"
    example_gloss: "Where is the hotel?"
  fa.a1.unit44.lesson01.teach.rezerv:
    title: Reservation
    gloss: "reservation / booking"
    note: "*رزرو* means 'reservation' or 'booking.'"
    example_gloss: "I have a reservation."

  fa.a1.unit44.lesson02.teach.review_in_chand:
    title: "Review: this / how many"
    gloss: "this / how many"
    note: "*این* ('this') was already taught in unit08; *چند* ('how many') was already taught in unit03/unit04."
  fa.a1.unit44.lesson02.teach.review_shab:
    title: "Review: night"
    gloss: night
    note: "*شب* ('night') was already taught in unit09."
  fa.a1.unit44.lesson02.teach.review_saat_haft:
    title: "Review: o'clock / seven"
    gloss: "o'clock, time / seven"
    note: "*ساعت* ('o'clock, time') was already taught in unit09; *هفت* ('seven') was already taught in unit03."
  fa.a1.unit44.lesson02.teach.sobhane:
    title: Breakfast
    gloss: breakfast
    note: "*صبحانه* means 'breakfast.'"
    example_gloss: "This is breakfast."
  fa.a1.unit44.lesson02.teach.wifi:
    title: Wifi
    gloss: wifi
    note: "*وای‌فای* means 'wifi.'"
    example_gloss: "This is the wifi."
  fa.a1.unit44.lesson02.teach.chand_shab:
    title: "How many nights"
    gloss: "how many nights"

  fa.a1.unit44.lesson03.teach.review_mitoonam_konam:
    title: "Review: I can / do"
    gloss: "I can / do, make"
    note: "*می‌تونم* ('I can') and *کنم* ('do/make,' subjunctive) were already taught in unit20."
  fa.a1.unit44.lesson03.teach.review_khosh_oomadid:
    title: "Review: welcome"
    gloss: welcome
    note: "*خوش اومدید* ('welcome') was already taught in unit06."
  fa.a1.unit44.lesson03.teach.review_chande:
    title: "Review: what/how much is it"
    gloss: "what is it / how much is it"
    note: "*چنده* was already taught in unit09."
  fa.a1.unit44.lesson03.teach.amade:
    title: Ready
    gloss: ready
    note: "*آماده* means 'ready.'"
    example_gloss: "The room is ready."
  fa.a1.unit44.lesson03.teach.khoruj:
    title: "Checkout / departure"
    gloss: "checkout / departure"
    note: "*خروج* means 'checkout' or 'departure.'"
    example_gloss: "What time is checkout?"
  fa.a1.unit44.lesson03.teach.mitoonam_rezerv_konam:
    title: "Can I book a room?"
    gloss: "Can I book a room?"

  fa.a1.unit44.lesson04.teach.review_salam_mamnoon:
    title: "Review: hi / thanks"
    gloss: "hi / thanks"
    note: "*سلام* and *ممنون* were already taught in units 01/17/22."
  fa.a1.unit44.lesson04.teach.review_bashe_bale:
    title: "Review: okay / yes"
    gloss: "okay / yes"
    note: "*باشه* ('okay') was already taught in units 01/02/06/17/22; *بله* ('yes') was already taught in unit06."
  fa.a1.unit44.lesson04.teach.review_esmam_nima_shoma:
    title: "Review: my name / Nima / you (formal)"
    gloss: "my name / Nima / you (formal)"
    note: "*اسمم* ('my name') was already taught in unit02. *نیما* is this course's established traveler character. *شما* ('you,' formal) was already taught in unit01."
  fa.a1.unit44.lesson04.teach.review_az_ta_dah:
    title: "Review: from / until / ten"
    gloss: "from / until, to / ten"
    note: "*از* ('from') was already taught in unit16; *تا* ('until, to') was already taught in unit42; *ده* ('ten') was already taught in unit03."
  fa.a1.unit44.lesson04.teach.review_ham_zohr_davazdah:
    title: "Review: also / noon / twelve"
    gloss: "also, too / noon / twelve"
    note: "*هم* ('also, too') was already taught in unit01; *ظهر* ('noon') was already taught in unit09; *دوازده* ('twelve') was already taught in unit03."
  fa.a1.unit44.lesson04.teach.review_khodahafez:
    title: "Review: goodbye"
    gloss: goodbye
    note: "*خداحافظ* was already taught in units 01/05/16."
  fa.a1.unit44.lesson04.teach.dialogue_line1:
    title: "Nima: Hi, I have a reservation. My name is Nima."
    gloss: "Hi, I have a reservation. My name is Nima."
  fa.a1.unit44.lesson04.teach.dialogue_line2:
    title: "Mr. Karimi: Hello, welcome. Your room is ready."
    gloss: "Hello, welcome. Your room is ready."
  fa.a1.unit44.lesson04.teach.dialogue_line3:
    title: "Nima: Thanks. What time is breakfast?"
    gloss: "Thanks. What time is breakfast?"
  fa.a1.unit44.lesson04.teach.dialogue_line4:
    title: "Mr. Karimi: From seven to ten o'clock."
    gloss: "From seven to ten o'clock."
  fa.a1.unit44.lesson04.teach.dialogue_line5:
    title: "Nima: Okay. Do you have wifi?"
    gloss: "Okay. Do you have wifi?"
  fa.a1.unit44.lesson04.teach.dialogue_line6:
    title: "Mr. Karimi: Yes. Checkout time is also twelve noon."
    gloss: "Yes. Checkout time is also twelve noon."
  fa.a1.unit44.lesson04.teach.dialogue_line7:
    title: "Nima: Thanks, goodbye!"
    gloss: "Thanks, goodbye!"

  fa.a1.unit44.lesson05.teach.mehman:
    title: Guest
    gloss: guest
    note: "*مهمان* means 'guest.'"
    example_gloss: "This is a guest."
  fa.a1.unit44.lesson05.teach.review_takht:
    title: "Review: bed"
    gloss: bed
    note: "*تخت* ('bed') and its contracted form *تخته* were already taught in unit19."
  fa.a1.unit44.lesson05.teach.review_tarikh_days:
    title: "Review: date / Monday / Wednesday / two"
    gloss: "date / Monday / Wednesday / two"
    note: "*تاریخ*, *دوشنبه*, and *چهارشنبه* were already taught in unit10; *دو* ('two') was already taught in unit03."
  fa.a1.unit44.lesson05.teach.reading_text:
    title: "Reading: a hotel booking note"
    gloss: "Guest: Nima. Room: double. Date: from Monday to Wednesday."
    note: "A short booking confirmation note naming the guest, the room type, and the dates."

  fa.a1.unit44.lesson06.teach.review_booking_question:
    title: "Can I book a room? The room is ready."
    gloss: "Can I book a room? The room is ready."
    note: "A full review sentence pair reusing only already-known words from this unit."
  fa.a1.unit44.lesson06.teach.review_breakfast_hours:
    title: "What time is breakfast? From seven to ten."
    gloss: "What time is breakfast? From seven to ten."
  fa.a1.unit44.lesson06.teach.summary_words:
    title: "Hotel / reservation / breakfast / wifi / checkout / ready / guest"
    gloss: "hotel / reservation / breakfast / wifi / checkout / ready / guest"
    note: "These are the key words taught in this unit."

exercises:
  fa.a1.unit44.lesson01.exercise01.recognize_hotel:
    instruction: "What does this word mean?"
    correct_option: hotel
    distractors: [room, key, reservation]
    accepted_answers: [{value: hotel, status: correct}]
    feedback: "هتل means hotel."
  fa.a1.unit44.lesson01.exercise02.recognize_rezerv:
    instruction: "What does this word mean?"
    correct_option: reservation
    distractors: [hotel, room, key]
    accepted_answers: [{value: reservation, status: correct}]
    feedback: "رزرو means reservation or booking."
  fa.a1.unit44.lesson01.exercise03.match_hotel_one:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {هتل: hotel, رزرو: reservation, اتاق: room, کلید: key, کجاست: "where is", دارم: "I have"}
        status: correct
    feedback: "These are the first new hotel words for this unit."
  fa.a1.unit44.lesson01.exercise04.word_order_hotel_kojast:
    instruction: "Put the words in order."
    accepted_answers: [{value: [هتل, کجاست], status: correct}]
    feedback: "هتل کجاست؟ means 'Where is the hotel?'"
  fa.a1.unit44.lesson01.exercise05.translate_man_rezerv_daram:
    instruction: "Translate into English: من رزرو دارم."
    answer_language_code: en
    accepted_answers:
      - {value: "I have a reservation.", status: correct}
      - {value: "I have a reservation", status: correct}
      - {value: "I have a booking.", status: correct}
    feedback: "من رزرو دارم means 'I have a reservation.'"

  fa.a1.unit44.lesson02.exercise01.recognize_sobhane:
    instruction: "What does this word mean?"
    correct_option: breakfast
    distractors: [wifi, night, hotel]
    accepted_answers: [{value: breakfast, status: correct}]
    feedback: "صبحانه means breakfast."
  fa.a1.unit44.lesson02.exercise02.recognize_wifi:
    instruction: "What does this word mean?"
    correct_option: wifi
    distractors: [breakfast, key, room]
    accepted_answers: [{value: wifi, status: correct}]
    feedback: "وای‌فای means wifi."
  fa.a1.unit44.lesson02.exercise03.match_hotel_two:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {صبحانه: breakfast, "وای‌فای": wifi, چند: "how many", شب: night, "چند شب": "how many nights", "این صبحانه‌ست.": "This is breakfast."}
        status: correct
    feedback: "These words let you talk about breakfast, wifi, and how many nights you're staying."
  fa.a1.unit44.lesson02.exercise04.word_order_chand_shab:
    instruction: "Put the words in order."
    accepted_answers: [{value: [چند, شب], status: correct}]
    feedback: "چند شب؟ means 'How many nights?'"
  fa.a1.unit44.lesson02.exercise05.translate_in_wifi_e:
    instruction: "Translate into English: این وای‌فایه."
    answer_language_code: en
    accepted_answers:
      - {value: "This is the wifi.", status: correct}
      - {value: "This is wifi.", status: correct}
      - {value: "This is the wifi", status: correct}
    feedback: "این وای‌فایه means 'This is the wifi.'"

  fa.a1.unit44.lesson03.exercise01.recognize_mitoonam_rezerv_konam:
    instruction: "What does this sentence mean?"
    correct_option: "Can I book a room?"
    distractors: ["Can I see a room?", "Is the room ready?", "Do you have a room?"]
    accepted_answers: [{value: "Can I book a room?", status: correct}]
    feedback: "می‌تونم اتاق رزرو کنم؟ means 'Can I book a room?'"
  fa.a1.unit44.lesson03.exercise02.recognize_sa_at_khoruj_chande:
    instruction: "What does this sentence mean?"
    correct_option: "What time is checkout?"
    distractors: ["What time is breakfast?", "What time do you arrive?", "Where is the checkout?"]
    accepted_answers: [{value: "What time is checkout?", status: correct}]
    feedback: "ساعت خروج چنده؟ means 'What time is checkout?'"
  fa.a1.unit44.lesson03.exercise03.match_booking_checkout:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"می‌تونم": "I can", آماده: ready, خروج: "checkout / departure", چنده: "what is / how much is", "می‌تونم اتاق رزرو کنم؟": "Can I book a room?", "ساعت خروج چنده؟": "What time is checkout?"}
        status: correct
    feedback: "These words let you ask about booking a room and the checkout time."
  fa.a1.unit44.lesson03.exercise04.word_order_mitoonam_rezerv_konam:
    instruction: "Put the words in order."
    accepted_answers: [{value: ["می‌تونم", اتاق, رزرو, کنم], status: correct}]
    feedback: "می‌تونم اتاق رزرو کنم؟ means 'Can I book a room?'"
  fa.a1.unit44.lesson03.exercise05.translate_otagh_amade_ast:
    instruction: "Translate into English: اتاق آماده‌ست."
    answer_language_code: en
    accepted_answers:
      - {value: "The room is ready.", status: correct}
      - {value: "The room is ready", status: correct}
    feedback: "اتاق آماده‌ست means 'The room is ready.'"

  fa.a1.unit44.lesson04.exercise01.dialogue_comprehension_breakfast_time:
    instruction: "Nima asks Mr. Karimi something. What does he want to know?"
    correct_option: "He wants to know what time breakfast is."
    distractors:
      - "He wants to know if the hotel has a restaurant."
      - "He wants to know where the key is."
      - "He wants to know the room price."
    accepted_answers: [{value: "He wants to know what time breakfast is.", status: correct}]
    feedback: "ممنون. صبحانه ساعت چنده؟ means 'Thanks. What time is breakfast?'"
  fa.a1.unit44.lesson04.exercise02.recognize_dialogue_line6:
    instruction: "What does this sentence mean?"
    correct_option: "Yes. Checkout time is also twelve noon."
    distractors:
      - "Yes. Breakfast is also at twelve noon."
      - "No, checkout is at ten."
      - "Yes, the room is also ready."
    accepted_answers: [{value: "Yes. Checkout time is also twelve noon.", status: correct}]
    feedback: "بله. ساعت خروج هم دوازده ظهره means 'Yes. Checkout time is also twelve noon.'"
  fa.a1.unit44.lesson04.exercise03.match_dialogue_hotel:
    instruction: "Match each line with its meaning."
    accepted_answers:
      - value: {"سلام، رزرو دارم. اسمم نیماست.": "Hi, I have a reservation. My name is Nima.", "سلام، خوش اومدید. اتاق شما آماده‌ست.": "Hello, welcome. Your room is ready.", "ممنون. صبحانه ساعت چنده؟": "Thanks. What time is breakfast?", "از ساعت هفت تا ده.": "From seven to ten o'clock.", "باشه. وای‌فای دارید؟": "Okay. Do you have wifi?", "بله. ساعت خروج هم دوازده ظهره.": "Yes. Checkout time is also twelve noon.", خداحافظ: goodbye}
        status: correct
    feedback: "These lines appear in the check-in conversation between Nima and Mr. Karimi."
  fa.a1.unit44.lesson04.exercise04.dialogue_response_breakfast_hours:
    instruction: "Respond to صبحانه ساعت چنده؟ by saying it's from seven to ten."
    accepted_answers:
      - {value: "از ساعت هفت تا ده.", status: correct}
      - {value: "از ساعت هفت تا ده", status: correct}
    feedback: "از ساعت هفت تا ده means 'From seven to ten o'clock.'"
  fa.a1.unit44.lesson04.exercise05.translate_bale_khoruj_zohre:
    instruction: "Translate into English: بله. ساعت خروج هم دوازده ظهره."
    answer_language_code: en
    accepted_answers:
      - {value: "Yes. Checkout time is also twelve noon.", status: correct}
      - {value: "Yes, checkout time is also twelve noon.", status: correct}
      - {value: "Yes, and checkout time is also twelve noon.", status: correct}
      - {value: "Yes. The checkout time is also twelve noon.", status: correct}
    feedback: "بله. ساعت خروج هم دوازده ظهره. means 'Yes. Checkout time is also twelve noon.'"

  fa.a1.unit44.lesson05.exercise01.reading_comprehension_guest_name:
    instruction: "According to the note, what is the guest's name?"
    correct_option: "Nima."
    distractors:
      - "Sara."
      - "Omar."
      - "Mina."
    accepted_answers: [{value: "Nima.", status: correct}]
    feedback: "مهمان: نیما means the guest is Nima."
  fa.a1.unit44.lesson05.exercise02.reading_comprehension_room_type:
    instruction: "According to the note, what type of room is it?"
    correct_option: "A double room (two beds)."
    distractors:
      - "A single room (one bed)."
      - "A room with no bed."
      - "Three rooms."
    accepted_answers: [{value: "A double room (two beds).", status: correct}]
    feedback: "اتاق: دو تخته means the room is a double (two-bed) room."
  fa.a1.unit44.lesson05.exercise03.match_reading_booking:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {مهمان: guest, "دو تخته": "double (two-bed)", تاریخ: date, دوشنبه: Monday, چهارشنبه: Wednesday, اتاق: room}
        status: correct
    feedback: "These words let you understand the hotel booking note."
