course:
  title: Farsi B1
  description: >-
    Intermediate Iranian Farsi: combining two facts about a person, place,
    or thing into one sentence using a که relative clause, including the
    case where the relative pronoun must attach to a preposition,
    continuing Nima's narrator voice describing his friend Sara and his
    hometown.

units:
  fa.b1.unit10.relative_clauses:
    title: Relative Clauses
    description: Combine two facts about a person, place, or thing using a که relative clause -- subject, object, and prepositional/oblique -- describing Nima's friend Sara and his hometown.

lessons:
  fa.b1.unit10.lesson01.subject_relative:
    title: "The person who..."
  fa.b1.unit10.lesson02.object_relative:
    title: "The book that I bought"
  fa.b1.unit10.lesson03.oblique_relative:
    title: "The friend that I... with"
  fa.b1.unit10.lesson04.dialogue_describing_sara:
    title: "About Sara"
  fa.b1.unit10.lesson05.reading_my_hometown:
    title: "The city I grew up in"
  fa.b1.unit10.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  fa.b1.unit10.lesson01.teach.kasi_ke:
    title: "the person who"
    gloss: "the person who"
    note: "*کسی که* opens a SUBJECT relative clause -- no resumptive pronoun needed, since the verb after که already agrees with the antecedent as its own subject."
    example_gloss: "The person who works here is Sara."
  fa.b1.unit10.lesson01.teach.injaa_kar_mikone:
    title: "works here"
    gloss: "works here"
    example_gloss: "The person who works here is Sara."
  fa.b1.unit10.lesson01.teach.saraset:
    title: "is Sara"
    gloss: "is Sara"
    example_gloss: "The person who works here is Sara."
  fa.b1.unit10.lesson01.teach.grammar_subject_relative:
    title: "The person who works here is Sara."
    gloss: "The person who works here is Sara."
    note: "*کسی که [verb agreeing with کسی]* -- a subject relative clause needs no extra pronoun; که alone links the clause to its antecedent, and the following verb's own subject agreement does the rest."
  fa.b1.unit10.lesson01.teach.dusti_ke:
    title: "the friend who"
    gloss: "the friend who"
    example_gloss: "The friend who studies at university is Sara."
  fa.b1.unit10.lesson01.teach.daneshgah:
    title: "studies at university"
    gloss: "studies at university"
    example_gloss: "The friend who studies at university is Sara."

  fa.b1.unit10.lesson02.teach.ketabi_ke:
    title: "the book that"
    gloss: "the book that"
    example_gloss: "The book that I bought is really good."
  fa.b1.unit10.lesson02.teach.kharidamesh:
    title: "I bought (it)"
    gloss: "I bought (it)"
    note: "*خریدمش* -- the object clitic *ش* ('it') stays ON THE VERB, referring back to *کتابی*. Unlike English (which fronts 'that' and leaves a gap), Persian OBJECT relative clauses require this resumptive pronoun -- 'the book that I bought it,' literally."
    example_gloss: "The book that I bought is really good."
  fa.b1.unit10.lesson02.teach.grammar_object_relative:
    title: "The book that I bought is really good."
    gloss: "The book that I bought is really good."
    note: "*کتابی که خریدمش* -- object relative clauses need the resumptive clitic *ش* on the verb; a subject relative clause (lesson01) needs no such pronoun at all."
  fa.b1.unit10.lesson02.teach.chizi_ke:
    title: "the thing that"
    gloss: "the thing that"
    example_gloss: "The thing that I bought is interesting."
  fa.b1.unit10.lesson02.teach.jalebe:
    title: "it's interesting"
    gloss: "it's interesting"
    example_gloss: "The work he/she does is interesting."
  fa.b1.unit10.lesson02.teach.kari_ke_mikone:
    title: "the work he/she does"
    gloss: "the work he/she does"
    example_gloss: "The work he/she does is really interesting."
  fa.b1.unit10.lesson02.teach.vagheaan:
    title: really
    gloss: really
    example_gloss: "The work he/she does is really interesting."

  fa.b1.unit10.lesson03.teach.bahash_harf_zadam:
    title: "I talked with (him/her)"
    gloss: "I talked with (him/her)"
    note: "*باهاش* = *با* (with) + *ش* (resumptive clitic 'him/her'), with a linking *ها* inserted for pronunciation. This is the OBLIQUE/PREPOSITIONAL case: the resumptive pronoun attaches to the PREPOSITION, not the verb -- 'the friend that with-him I talked,' the hardest of the three relative-clause shapes."
    example_gloss: "The friend that I talked with is Sara."
  fa.b1.unit10.lesson03.teach.grammar_oblique_relative:
    title: "The friend that I talked with is Sara."
    gloss: "The friend that I talked with is Sara."
    note: "*دوستی که باهاش حرف زدم* -- when the relative clause's role involves a preposition ('with,' 'in,' 'about'), Persian keeps the preposition IN the clause and attaches the resumptive pronoun to IT, rather than fronting a preposition + relative pronoun the way English does ('with whom')."
  fa.b1.unit10.lesson03.teach.shahri_ke:
    title: "the city that"
    gloss: "the city that"
    example_gloss: "The city that I grew up in is pretty."
  fa.b1.unit10.lesson03.teach.tosh_bozorg_shodam:
    title: "I grew up in (it)"
    gloss: "I grew up in (it)"
    note: "*توش* = *تو* (in) + *ش* (resumptive clitic 'it') -- the same oblique pattern as *باهاش*, this time with the preposition *تو* (in)."
    example_gloss: "The city that I grew up in is pretty."
  fa.b1.unit10.lesson03.teach.ghashange:
    title: "it's pretty"
    gloss: "it's pretty"
    example_gloss: "The city that I grew up in is pretty."
  fa.b1.unit10.lesson03.teach.samimi:
    title: "close/intimate"
    gloss: "close/intimate"
    example_gloss: "Who's the friend that you're close with?"

  fa.b1.unit10.lesson04.teach.nima:
    title: "Nima (name)"
    gloss: "Nima"
    example_gloss: "Nima talks about his friend."
  fa.b1.unit10.lesson04.teach.maryam:
    title: "Maryam (name)"
    gloss: "Maryam"
    example_gloss: "Maryam asks Nima a question."
  fa.b1.unit10.lesson04.teach.mikham_begam:
    title: "I want to tell you"
    gloss: "I want to tell you"
    example_gloss: "I want to tell you about my friend."
  fa.b1.unit10.lesson04.teach.darbareye:
    title: "about my friend"
    gloss: "about my friend"
    example_gloss: "I want to tell you about my friend."
  fa.b1.unit10.lesson04.teach.chizi_ke_darbaresh_jalebe:
    title: "What's the interesting thing about them?"
    gloss: "What's the interesting thing about them?"
  fa.b1.unit10.lesson04.teach.hamoone:
    title: "that's the one"
    gloss: "that's the one"
    example_gloss: "Yeah, that's the one."
  fa.b1.unit10.lesson04.teach.dialogue_nima_intro:
    title: "Nima: I want to tell you about my friend. The friend we used to go to university together with is Sara."
    gloss: "Nima: I want to tell you about my friend. The friend we used to go to university together with is Sara."
  fa.b1.unit10.lesson04.teach.dialogue_maryam_ask:
    title: "Maryam: What's the interesting thing about her?"
    gloss: "Maryam: What's the interesting thing about her?"
  fa.b1.unit10.lesson04.teach.dialogue_nima_describe:
    title: "Nima: The work she does is really interesting. The city she grew up in is different from my city."
    gloss: "Nima: The work she does is really interesting. The city she grew up in is different from my city."
  fa.b1.unit10.lesson04.teach.dialogue_maryam_confirm:
    title: "Maryam: So the friend you're close with is the same Sara?"
    gloss: "Maryam: So the friend you're close with is the same Sara?"
  fa.b1.unit10.lesson04.teach.dialogue_nima_confirm:
    title: "Nima: Yeah, that's the one."
    gloss: "Nima: Yeah, that's the one."

  fa.b1.unit10.lesson05.teach.hamishe:
    title: always
    gloss: always
    example_gloss: "I always want to go back there."
  fa.b1.unit10.lesson05.teach.bargardam:
    title: "I go back"
    gloss: "I go back"
    example_gloss: "I want to go back there."
  fa.b1.unit10.lesson05.teach.khiyabani_ke:
    title: "the street that"
    gloss: "the street that"
    example_gloss: "The street that I lived on was pretty."
  fa.b1.unit10.lesson05.teach.zendegi_mikardam:
    title: "I used to live"
    gloss: "I used to live"
    example_gloss: "The street that I lived on was pretty."
  fa.b1.unit10.lesson05.teach.hamsayeha:
    title: neighbors
    gloss: neighbors
    example_gloss: "The neighbors that I was close with were kind."

  fa.b1.unit10.lesson05.teach.reading_passage:
    title: "Reading: The city I grew up in"
    gloss: "Nima was born in a small city. The city that he grew up in was very different from Tehran. The street that Nima lived on was pretty and quiet. The neighbors that he was close with always helped him. Now that he lives in Tehran, he always wants to go back to the city that he grew up in."

  fa.b1.unit10.lesson06.teach.grammar_review:
    title: "The person who works here is Sara. The book that I bought is really good. The friend that I talked with is Sara."
    gloss: "The person who works here is Sara. The book that I bought is really good. The friend that I talked with is Sara."
    note: "Review: subject relative needs no resumptive pronoun (*کسی که*); object relative needs a resumptive object clitic on the verb (*خریدمش*); oblique/prepositional relative needs the resumptive pronoun attached to the preposition (*باهاش*, *توش*) -- the hardest of the three, and the genuine new B1 skill this unit teaches."
  fa.b1.unit10.lesson06.teach.emruz:
    title: today
    gloss: today
    example_gloss: "Today I must work."

