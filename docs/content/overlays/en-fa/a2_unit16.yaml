course:
  title: Farsi A2
  description: >-
    Lower-intermediate Iranian Farsi: describing your daily technology and
    social media habits, and giving a simple opinion about them with a
    reason.

units:
  fa.a2.unit16.online_habits:
    title: Online habits

lessons:
  fa.a2.unit16.lesson01.online_habits_vocabulary: {title: "Internet and social media words"}
  fa.a2.unit16.lesson02.describing_your_habit: {title: "Describing your own habit"}
  fa.a2.unit16.lesson03.reading_a_message_about_habits: {title: "Reading a message about habits"}
  fa.a2.unit16.lesson04.habits_conversation: {title: "Talking about online habits"}

teaching:
  fa.a2.unit16.lesson01.teach.social_media_word:
    title: "Social media"
    gloss: "social media"
    note: "*شبکه‌ی اجتماعی* is the standard phrase for social media."
    example_gloss: "I use social media every day."
  fa.a2.unit16.lesson01.teach.app_word:
    title: "App"
    gloss: "app"
    note: "*اپلیکیشن* is the common loanword for a phone/computer app."
    example_gloss: "My favorite app is Instagram."
  fa.a2.unit16.lesson01.teach.screen_word:
    title: "Screen"
    gloss: "screen"
    note: "*صفحه* is the word for a screen, e.g. a phone or computer screen."
    example_gloss: "My phone's screen is big."
  fa.a2.unit16.lesson01.teach.useful_word:
    title: "Useful"
    gloss: "useful"
    note: "*مفید* is the word for useful; *مفیده* is its colloquial spoken form (مفید + است)."
    example_gloss: "Reading the news is useful."
  fa.a2.unit16.lesson01.teach.news_word:
    title: "News"
    gloss: "news"
    note: "*خبر* is the general word for news."
    example_gloss: "I read the news every day."
  fa.a2.unit16.lesson01.teach.entertaining_word:
    title: "Entertaining"
    gloss: "entertaining / fun"
    note: "*سرگرم‌کننده* describes something entertaining or fun to use."
    example_gloss: "This app is very entertaining."
  fa.a2.unit16.lesson01.teach.waste_time_note:
    title: "To waste time (light verb)"
    gloss: "to waste time"
    note: "*وقت تلف کردن* literally means 'time waste do' -- another light-verb construction, like *باز کردن* from the earlier banking unit."
  fa.a2.unit16.lesson01.teach.recap_opinion_pattern:
    title: "In my opinion ... because ..."
    gloss: "in my opinion ... because ..."
    note: "Recap of the *به نظر من ... چون ...* pattern from the earlier opinions unit, reused here for a habit-plus-opinion statement."

  fa.a2.unit16.lesson02.teach.about_word:
    title: "About / approximately"
    gloss: "about / approximately"
    note: "*حدود* precedes a quantity to mean 'about' or 'approximately'."
    example_gloss: "I had about two hours."
  fa.a2.unit16.lesson02.teach.how_much_word:
    title: "How much do you use social media every day?"
    gloss: "How much do you use social media every day?"
    note: "*چقدر* asks 'how much', here about time spent on an activity."
  fa.a2.unit16.lesson02.teach.my_habit_sentence:
    title: "State your own habit with a frequency"
    gloss: "I use social media for about two hours every day."
    note: "Combines *هر روز* (every day) with *حدود دو ساعت* (about two hours) to state a habit with duration."

  fa.a2.unit16.lesson03.teach.world_word:
    title: "World"
    gloss: "world"
    note: "*دنیا* is the general word for the world."
    example_gloss: "I like to know what's happening in the world."
  fa.a2.unit16.lesson03.teach.message_text:
    title: "A message about reading news online"
    gloss: "Hi! I read the news for about one hour every day. In my opinion reading the news is useful, because I know what's happening in the world."
    note: "A short written message using the *به نظر من ... چون ...* opinion pattern, the written register this lesson is teaching."

  fa.a2.unit16.lesson04.teach.favorite_word:
    title: "Favorite"
    gloss: "favorite"
    note: "*مورد علاقه* means favorite; *علاقه‌ام* attaches the 'my' possessive suffix."
    example_gloss: "My favorite color is blue."
  fa.a2.unit16.lesson04.teach.turn01:
    title: "نیما asks about سارا's social media use"
    gloss: "نیما asks سارا how much she uses social media every day."
    note: "Reuses lesson02's own how-much question."
  fa.a2.unit16.lesson04.teach.turn02:
    title: "سارا states her habit"
    gloss: "سارا says about two hours -- her favorite app is Instagram."
    note: "Reuses lesson02's *حدود* (about) pattern."
  fa.a2.unit16.lesson04.teach.turn03:
    title: "نیما asks her opinion"
    gloss: "نیما asks if she thinks it's useful."
    note: "*به نظرت* (in your opinion) is the second-person form of *به نظر من*."
  fa.a2.unit16.lesson04.teach.turn04:
    title: "سارا gives her opinion"
    gloss: "سارا says in her opinion it's both entertaining and sometimes a waste of time."
    note: "*هم ... هم ...* (both ... and ...) links two contrasting qualities."
  fa.a2.unit16.lesson04.teach.turn05:
    title: "نیما contrasts his own habit"
    gloss: "نیما says he mostly reads news, not social media."
    note: "*بیشتر ..., نه ...* (mostly ..., not ...) states a preference by contrast."
  fa.a2.unit16.lesson04.teach.turn06:
    title: "سارا reacts"
    gloss: "سارا says: how nice!"
    note: "Reuses سارا's own reaction line from the earlier a1 technology conversation."

exercises:
  fa.a2.unit16.lesson01.exercise01.recognize_social_media:
    instruction: "What does this phrase mean?"
    correct_option: "social media"
    distractors: ["app", "news", "screen"]
    accepted_answers: [{value: "social media", status: correct}]
    feedback: "*شبکه‌ی اجتماعی* means social media."
  fa.a2.unit16.lesson01.exercise02.recognize_useful:
    instruction: "What does this word mean?"
    correct_option: "useful"
    distractors: ["entertaining", "app", "screen"]
    accepted_answers: [{value: "useful", status: correct}]
    feedback: "*مفید* means useful."
  fa.a2.unit16.lesson01.exercise03.match_online_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {"شبکه‌ی اجتماعی": "social media", اپلیکیشن: app, صفحه: screen, مفید: useful, خبر: news, "سرگرم‌کننده": entertaining}, status: correct}
    feedback: "These six words cover this unit's basic online-habits vocabulary."
  fa.a2.unit16.lesson01.exercise04.order_reading_news_useful:
    instruction: "Arrange the words to say: reading the news is useful."
    accepted_answers: [{value: [خوندن, خبر, مفیده], status: correct}]
    feedback: "*خوندن خبر مفیده.* states that reading the news is useful."
  fa.a2.unit16.lesson01.exercise05.write_useful:
    instruction: "Write the Farsi word for useful."
    accepted_answers:
      - {value: مفید, status: correct}
    feedback: "*مفید* means useful."

  fa.a2.unit16.lesson02.exercise01.recognize_habit_sentence:
    instruction: "Which sentence describes a daily social-media habit with a duration?"
    correct_option: "I use social media for about two hours every day."
    distractors: ["Reading the news is useful.", "My favorite app is Instagram.", "My phone's screen is big."]
    accepted_answers: [{value: "I use social media for about two hours every day.", status: correct}]
    feedback: "*من هر روز حدود دو ساعت از شبکه‌ی اجتماعی استفاده می‌کنم.* states a daily habit with a duration."
  fa.a2.unit16.lesson02.exercise02.order_how_much_question:
    instruction: "Arrange the words to ask: how much do you use social media every day?"
    accepted_answers: [{value: [هر, روز, چقدر, از, "شبکه‌ی اجتماعی", استفاده, می‌کنی], status: correct}]
    feedback: "*هر روز چقدر از شبکه‌ی اجتماعی استفاده می‌کنی؟* asks about a daily habit's amount."
  fa.a2.unit16.lesson02.exercise03.dialogue_response_describe_habit:
    instruction: "Someone asks: 'How much do you use social media every day?' Answer that you use it for about two hours every day."
    accepted_answers:
      - {value: "من هر روز حدود دو ساعت از شبکه‌ی اجتماعی استفاده می‌کنم.", status: correct}
      - {value: "من هر روز حدود دو ساعت از شبکه‌ی اجتماعی استفاده می‌کنم", status: correct}
    feedback: "*من هر روز حدود دو ساعت از شبکه‌ی اجتماعی استفاده می‌کنم.* states the habit clearly."
  fa.a2.unit16.lesson02.exercise04.translate_habit_sentence:
    instruction: "Translate into Farsi: I use social media for about two hours every day."
    accepted_answers:
      - {value: "من هر روز حدود دو ساعت از شبکه‌ی اجتماعی استفاده می‌کنم.", status: correct}
      - {value: "من هر روز حدود دو ساعت از شبکه‌ی اجتماعی استفاده می‌کنم", status: correct}
    feedback: "*من هر روز حدود دو ساعت از شبکه‌ی اجتماعی استفاده می‌کنم.* is the accepted translation."
  fa.a2.unit16.lesson02.exercise05.write_habit_sentence:
    instruction: "Write that you use social media for about two hours every day."
    accepted_answers:
      - {value: "من هر روز حدود دو ساعت از شبکه‌ی اجتماعی استفاده می‌کنم.", status: correct}
      - {value: "من هر روز حدود دو ساعت از شبکه‌ی اجتماعی استفاده می‌کنم", status: correct}
    feedback: "*من هر روز حدود دو ساعت از شبکه‌ی اجتماعی استفاده می‌کنم.* states your own habit."

  fa.a2.unit16.lesson03.exercise01.read_how_much_time:
    instruction: "According to the message, how much time does the writer spend on news every day?"
    correct_option: "About one hour."
    distractors: ["About two hours.", "About thirty minutes.", "The message does not say."]
    accepted_answers: [{value: "About one hour.", status: correct}]
    feedback: "*هر روز حدود یک ساعت خبر می‌خونم* -- about one hour every day."
  fa.a2.unit16.lesson03.exercise02.read_opinion_reason:
    instruction: "According to the message, why is reading the news useful?"
    correct_option: "Because it keeps you informed about the world."
    distractors: ["Because it's entertaining.", "Because it's required for work.", "The message does not say."]
    accepted_answers: [{value: "Because it keeps you informed about the world.", status: correct}]
    feedback: "*چون از دنیا خبر دارم* -- because I know what's happening in the world."
  fa.a2.unit16.lesson03.exercise03.recognize_world:
    instruction: "What does this word mean?"
    correct_option: "world"
    distractors: ["news", "app", "screen"]
    accepted_answers: [{value: "world", status: correct}]
    feedback: "*دنیا* means world."
  fa.a2.unit16.lesson03.exercise04.order_reading_useful_because:
    instruction: "Arrange the words to say: in my opinion reading the news is useful, because I know what's happening in the world."
    accepted_answers: [{value: [به, نظر, من, خوندن, خبر, مفیده, چون, از, دنیا, دارم], status: correct}]
    feedback: "*به نظر من خوندن خبر مفیده، چون از دنیا خبر دارم.* gives the opinion and its reason."
  fa.a2.unit16.lesson03.exercise05.write_read_news_daily:
    instruction: "Write that you read the news every day."
    accepted_answers:
      - {value: "من هر روز خبر می‌خونم.", status: correct}
      - {value: "من هر روز خبر می‌خونم", status: correct}
    feedback: "*من هر روز خبر می‌خونم.* states a daily news-reading habit."

  fa.a2.unit16.lesson04.exercise01.comprehend_sara_app:
    instruction: "How much does سارا use social media, and what's her favorite app?"
    correct_option: "About two hours a day; her favorite app is Instagram."
    distractors: ["About one hour a day; her favorite app is a news app.", "She doesn't use social media at all.", "About two hours a day; her favorite app is a game."]
    accepted_answers: [{value: "About two hours a day; her favorite app is Instagram.", status: correct}]
    feedback: "*حدود دو ساعت. اپلیکیشن مورد علاقه‌ام اینستاگرامه.* -- about two hours; her favorite app is Instagram."
  fa.a2.unit16.lesson04.exercise02.comprehend_sara_opinion:
    instruction: "What is سارا's opinion about social media?"
    correct_option: "It's both entertaining and sometimes a waste of time."
    distractors: ["It's completely useless.", "It's only useful for news.", "She has no opinion about it."]
    accepted_answers: [{value: "It's both entertaining and sometimes a waste of time.", status: correct}]
    feedback: "*به نظر من هم سرگرم‌کننده هست هم گاهی وقت تلف می‌کنم* -- it's both entertaining and sometimes I waste time."
  fa.a2.unit16.lesson04.exercise03.recognize_favorite:
    instruction: "What does this phrase mean?"
    correct_option: "favorite"
    distractors: ["entertaining", "useful", "world"]
    accepted_answers: [{value: "favorite", status: correct}]
    feedback: "*مورد علاقه* means favorite."
  fa.a2.unit16.lesson04.exercise04.order_nima_reads_news:
    instruction: "Arrange the words to say: I mostly read news, not social media."
    accepted_answers: [{value: [من, بیشتر, خبر, "می‌خونم", نه, "شبکه‌ی اجتماعی"], status: correct}]
    feedback: "*من بیشتر خبر می‌خونم، نه شبکه‌ی اجتماعی.* states نیما's own contrasting habit."
  fa.a2.unit16.lesson04.exercise05.dialogue_response_give_opinion:
    instruction: "نیما asks: 'Do you think it's useful?' Answer that in your opinion it's both entertaining and sometimes a waste of time."
    accepted_answers:
      - {value: "به نظر من هم سرگرم‌کننده هست هم گاهی وقت تلف می‌کنم.", status: correct}
      - {value: "به نظر من هم سرگرم‌کننده هست هم گاهی وقت تلف می‌کنم", status: correct}
    feedback: "*به نظر من هم سرگرم‌کننده هست هم گاهی وقت تلف می‌کنم.* gives a balanced opinion."
  fa.a2.unit16.lesson04.exercise06.write_habit_summary:
    instruction: "Write what سارا says about her habit: you use social media for about two hours every day."
    accepted_answers:
      - {value: "من هر روز حدود دو ساعت از شبکه‌ی اجتماعی استفاده می‌کنم", status: correct}
      - {value: "من هر روز حدود دو ساعت از شبکه‌ی اجتماعی استفاده می‌کنم.", status: correct}
    feedback: "*من هر روز حدود دو ساعت از شبکه‌ی اجتماعی استفاده می‌کنم.* is what سارا says about her social media habit."
