teaching:
  fa.a2.unit24.lesson01.teach.incident_words: {title: Yesterday, when, an incident, gloss: 'yesterday, when, an incident', note: '*وقتی* introduces the time when something happened; *که* can link an ongoing action to the event that interrupted it.', example_gloss: ['Yesterday an incident happened.', 'When I arrived, it started raining.']}
  fa.a2.unit24.lesson01.teach.weather_traffic: {title: Rain, traffic, bus, power, gloss: 'rain, traffic, bus, electricity / power', note: 'These are the small-incident words for this unit.', example_gloss: ['It started raining.', 'The bus stopped in traffic.', 'The power went out.']}
  fa.a2.unit24.lesson01.teach.actions: {title: Home and background activities, gloss: 'home, book, dinner, to go, to read, to make', note: 'These activities can be shown as already in progress.', example_gloss: ['I was going home.', 'I was reading a book.', 'I was making dinner.']}
  fa.a2.unit24.lesson01.teach.past_events: {title: Single past events, gloss: 'started, stopped, went out, I arrived, happened', note: 'These simple-past forms name the one event that happened in the middle of an activity.', example_gloss: ['It started raining.', 'The bus stopped.', 'When I arrived, the power went out.']}
  fa.a2.unit24.lesson01.teach.progressive_form: {title: The past progressive, gloss: 'I was going, I was reading, I was making', note: 'Use past *داشتن* plus the matching *می‌* past form for an action in progress: *داشتم می‌رفتم*. Both verbs agree with the same person.'}
  fa.a2.unit24.lesson02.teach.people_forms: {title: I, you, he/she, we, they, gloss: 'I, you, he/she, we, they', note: 'Persian often drops these pronouns because both verb endings show the person.', example_gloss: ['I was going.', 'You were going.', 'He/she was going.', 'We were going.', 'They were going.']}
  fa.a2.unit24.lesson02.teach.form_agreement: {title: Match both verb endings, gloss: 'I was going, you were going, he/she was going, we were going, they were going', note: 'The two verbs carry matching endings: *داشتم می‌رفتم*, *داشتی می‌رفتی*, *داشت می‌رفت*, *داشتیم می‌رفتیم*, *داشتن می‌رفتن*.'}
  fa.a2.unit24.lesson02.teach.linkers: {title: Two ways to link the event, gloss: 'I was going when it started raining. When I arrived, they were leaving.', note: 'Put *که* after the background activity, or begin with *وقتی* plus the event. In both patterns, one clause is ongoing and the other is a single event.'}
  fa.a2.unit24.lesson03.teach.time_contrast: {title: Every day, at that moment, usually, gloss: 'every day, at that moment, usually', note: 'These time phrases distinguish a repeated past habit from one scene in progress.', example_gloss: ['I used to go home every day.', 'At that moment I was going home.', 'I usually read books.']}
  fa.a2.unit24.lesson03.teach.habit_contrast: {title: Habit versus progress, gloss: 'I used to go every day. At that moment I was going.', note: 'Plain *می‌رفتم* can describe a repeated past habit. *داشتم می‌رفتم* zooms in on an action in progress at one past moment.'}
  fa.a2.unit24.lesson04.teach.more_incidents: {title: Street, car, I waited, then, gloss: 'street, car, I waited, then', note: 'Use these words to finish a short incident account.', example_gloss: ['I was crossing the street.', 'The car stopped.', 'Then I waited.']}
  fa.a2.unit24.lesson04.teach.crossing: {title: Crossing the street, gloss: 'to cross the street', note: '*از خیابون رد شدن* means to cross the street.', example_gloss: 'I was crossing the street when the car stopped.'}
  fa.a2.unit24.lesson04.teach.incident_pattern: {title: Background plus interruption, gloss: 'I was ... when ... happened', note: 'Use the past progressive for the background and one simple-past verb after *که* for the interruption.'}
  fa.a2.unit24.lesson05.teach.reading: {title: A bus incident, gloss: 'Yesterday I was going home by bus. In traffic I was reading a book when the bus stopped. I waited a few minutes. Then the bus started moving again.', note: 'Read once for the background actions and again for the single interruption.'}
  fa.a2.unit24.lesson06.teach.question: {title: 'What were you doing?', gloss: 'What were you doing?', note: '*داشتی چیکار می‌کردی؟* asks one friend what activity was in progress.'}
  fa.a2.unit24.lesson06.teach.turn01: {title: Sara asks about the rain, gloss: 'Yesterday, when it started raining, what were you doing?', note: 'Sara asks for an ongoing background action.'}
  fa.a2.unit24.lesson06.teach.turn02: {title: Nima answers, gloss: 'I was going home. What about you?', note: 'Nima answers with the first-person past progressive.'}
  fa.a2.unit24.lesson06.teach.turn03: {title: Sara describes the power cut, gloss: 'I was making dinner when the power went out.', note: 'Sara links her background activity to one event.'}
  fa.a2.unit24.lesson06.teach.turn04: {title: Nima asks what happened next, gloss: 'What happened next?', note: 'A short question moves the story forward.'}
  fa.a2.unit24.lesson06.teach.turn05: {title: Sara finishes the account, gloss: 'I waited a few minutes. Then the power came back.', note: 'Two simple-past events finish the incident.'}
exercises:
  fa.a2.unit24.lesson01.exercise01.recognize_progressive: {instruction: 'What does this form mean?', correct_option: 'I was going', distractors: ['I used to go every day', 'I went once', 'I am going now'], accepted_answers: [{value: 'I was going', status: correct}], feedback: '*داشتم می‌رفتم* presents an action in progress in the past.'}
  fa.a2.unit24.lesson01.exercise02.recognize_interrupt: {instruction: 'Which meaning matches the Persian sentence?', correct_option: 'I was going home when it started raining.', distractors: ['I went home after the rain stopped.', 'I used to go home whenever it rained.', 'I was home before it started raining.'], accepted_answers: [{value: 'I was going home when it started raining.', status: correct}], feedback: '*داشتم می‌رفتم* is the background; *شروع شد* is the interruption.'}
  fa.a2.unit24.lesson01.exercise03.match_forms: {instruction: 'Match each Persian form with its meaning.', accepted_answers: [{value: {'داشتم می‌رفتم': 'I was going', 'داشتم می‌خوندم': 'I was reading', 'داشتم درست می‌کردم': 'I was making', 'بارون شروع شد': 'it started raining', 'اتوبوس وایساد': 'the bus stopped', 'برق رفت': 'the power went out'}, status: correct}], feedback: 'The first three are background activities; the last three are single events.'}
  fa.a2.unit24.lesson01.exercise04.order_rain: {instruction: 'Arrange the words to say: I was going home when it started raining.', accepted_answers: [{value: [داشتم, می‌رفتم, خونه, که, بارون, شروع, شد], status: correct}], feedback: '*داشتم می‌رفتم خونه که بارون شروع شد.*'}
  fa.a2.unit24.lesson01.exercise05.fill_progressive: {instruction: 'Complete the sentence with the taught first-person *می‌* past form of *رفتن*.', accepted_answers: [{value: می‌رفتم, status: correct}], feedback: '*داشتم می‌رفتم خونه.*'}
  fa.a2.unit24.lesson01.exercise06.translate_rain: {instruction: 'Translate into Farsi using *داشتم + می‌* past and *که*: I was going home when it started raining.', accepted_answers: [{value: 'داشتم می‌رفتم خونه که بارون شروع شد', status: correct}, {value: 'من داشتم می‌رفتم خونه که بارون شروع شد', status: correct}], feedback: '*داشتم می‌رفتم خونه که بارون شروع شد.*'}
  fa.a2.unit24.lesson02.exercise01.recognize_they: {instruction: 'What does this sentence mean?', correct_option: 'They were leaving.', distractors: ['We were leaving.', 'They left once.', 'They used to leave every day.'], accepted_answers: [{value: 'They were leaving.', status: correct}], feedback: '*داشتن* and *می‌رفتن* both carry the spoken third-person plural ending.'}
  fa.a2.unit24.lesson02.exercise02.recognize_you: {instruction: 'What does this form mean when speaking to one friend?', correct_option: 'you were going', distractors: ['I was going', 'he/she was going', 'you went once'], accepted_answers: [{value: 'you were going', status: correct}], feedback: 'Both verbs have the singular *you* ending: *داشتی می‌رفتی*.'}
  fa.a2.unit24.lesson02.exercise03.match_people: {instruction: 'Match each form with its subject.', accepted_answers: [{value: {'داشتم می‌رفتم': من, 'داشتی می‌رفتی': تو, 'داشت می‌رفت': اون, 'داشتیم می‌رفتیم': ما, 'داشتن می‌رفتن': اونا}, status: correct}], feedback: 'Both verb endings agree with the same subject.'}
  fa.a2.unit24.lesson02.exercise04.order_they: {instruction: 'Arrange the words to say: When I arrived, they were leaving.', accepted_answers: [{value: [وقتی, رسیدم, اونا, داشتن, می‌رفتن], status: correct}], feedback: '*وقتی رسیدم، اونا داشتن می‌رفتن.*'}
  fa.a2.unit24.lesson02.exercise05.fill_they: {instruction: 'Complete the sentence with the taught spoken third-person plural of the helper verb that makes the past progressive.', accepted_answers: [{value: داشتن, status: correct}], feedback: '*اونا داشتن می‌رفتن.*'}
  fa.a2.unit24.lesson02.exercise06.write_you: {instruction: 'Write in Farsi using the singular-friend past progressive form: You were going home.', accepted_answers: [{value: 'داشتی می‌رفتی خونه', status: correct}, {value: 'تو داشتی می‌رفتی خونه', status: correct}], feedback: '*داشتی می‌رفتی خونه.*'}
  fa.a2.unit24.lesson03.exercise01.recognize_habit: {instruction: 'What does the sentence describe?', correct_option: 'a repeated past habit', distractors: ['one action in progress at a particular moment', 'one completed trip home', 'a future plan'], accepted_answers: [{value: 'a repeated past habit', status: correct}], feedback: '*هر روز* plus plain *می‌رفتم* marks a repeated past habit.'}
  fa.a2.unit24.lesson03.exercise02.recognize_moment: {instruction: 'What does the sentence describe?', correct_option: 'an action in progress at that moment', distractors: ['a repeated daily habit', 'one completed arrival', 'a present routine'], accepted_answers: [{value: 'an action in progress at that moment', status: correct}], feedback: '*اون لحظه* and *داشتم می‌رفتم* zoom in on one scene.'}
  fa.a2.unit24.lesson03.exercise03.match_contrast: {instruction: 'Match each form with its use or meaning.', accepted_answers: [{value: {'هر روز می‌رفتم': 'past habit', 'اون لحظه داشتم می‌رفتم': 'action in progress', 'معمولاً می‌خوندم': 'usual past activity', 'داشتم می‌خوندم': 'reading at that moment', 'داشتیم می‌رفتیم': 'we were going', 'داشتن می‌رفتن': 'they were going'}, status: correct}], feedback: 'The extra *داشتن* marks a scene in progress; plain *می‌* past can mark a habit.'}
  fa.a2.unit24.lesson03.exercise04.order_habit: {instruction: 'Arrange the words to describe a past habit: I used to read a book every day.', accepted_answers: [{value: [هر, روز, کتاب, می‌خوندم], status: correct}], feedback: '*هر روز کتاب می‌خوندم.*'}
  fa.a2.unit24.lesson03.exercise05.fill_moment: {instruction: 'Complete the sentence with the first-person *می‌* past form of *رفتن* after *داشتم*.', accepted_answers: [{value: می‌رفتم, status: correct}], feedback: '*اون لحظه داشتم می‌رفتم خونه.*'}
  fa.a2.unit24.lesson03.exercise06.translate_contrast: {instruction: 'Translate into Farsi, using plain *می‌* past for the habit and *داشتم + می‌* past for the specific moment: I used to go home every day, but at that moment I was reading a book.', accepted_answers: [{value: 'هر روز می‌رفتم خونه ولی اون لحظه داشتم کتاب می‌خوندم', status: correct}, {value: 'من هر روز می‌رفتم خونه ولی اون لحظه داشتم کتاب می‌خوندم', status: correct}], feedback: '*هر روز می‌رفتم خونه ولی اون لحظه داشتم کتاب می‌خوندم.*'}
  fa.a2.unit24.lesson04.exercise01.recognize_crossing: {instruction: 'Which meaning matches the Persian sentence?', correct_option: 'I was crossing the street when the car stopped.', distractors: ['I crossed after the car left.', 'The car was crossing the street.', 'I used to wait for cars every day.'], accepted_answers: [{value: 'I was crossing the street when the car stopped.', status: correct}], feedback: 'The crossing is in progress; the car stopping is the single event.'}
  fa.a2.unit24.lesson04.exercise02.recognize_power: {instruction: 'Which meaning matches the Persian sentence?', correct_option: 'I was making dinner when the power went out.', distractors: ['I made dinner after the power came back.', 'I was eating dinner when it started raining.', 'I usually made dinner without power.'], accepted_answers: [{value: 'I was making dinner when the power went out.', status: correct}], feedback: '*داشتم ... می‌کردم* frames the cooking as ongoing.'}
  fa.a2.unit24.lesson04.exercise03.match_incidents: {instruction: 'Match each phrase with its role in an incident.', accepted_answers: [{value: {'داشتم می‌رفتم خونه': 'background journey', 'بارون شروع شد': 'weather interruption', 'داشتم کتاب می‌خوندم': 'background reading', 'اتوبوس وایساد': 'traffic interruption', 'داشتم شام درست می‌کردم': 'background cooking', 'برق رفت': 'power interruption'}, status: correct}], feedback: 'Each pair contrasts an ongoing background with one interrupting event.'}
  fa.a2.unit24.lesson04.exercise04.order_power: {instruction: 'Arrange the words to say: I was making dinner when the power went out.', accepted_answers: [{value: [داشتم, شام, درست, می‌کردم, که, برق, رفت], status: correct}], feedback: '*داشتم شام درست می‌کردم که برق رفت.*'}
  fa.a2.unit24.lesson04.exercise05.respond_bus: {instruction: 'A friend asks what was happening when the bus stopped. Answer with the first-person past progressive and *که*: I was reading a book when the bus stopped.', accepted_answers: [{value: 'داشتم کتاب می‌خوندم که اتوبوس وایساد', status: correct}, {value: 'من داشتم کتاب می‌خوندم که اتوبوس وایساد', status: correct}], feedback: '*داشتم کتاب می‌خوندم که اتوبوس وایساد.*'}
  fa.a2.unit24.lesson04.exercise06.write_incident: {instruction: 'Write the taught incident in Farsi using first-person past progressive plus *که*: I was crossing the street when the car stopped.', accepted_answers: [{value: 'داشتم از خیابون رد می‌شدم که ماشین وایساد', status: correct}, {value: 'من داشتم از خیابون رد می‌شدم که ماشین وایساد', status: correct}], feedback: '*داشتم از خیابون رد می‌شدم که ماشین وایساد.*'}
  fa.a2.unit24.lesson05.exercise01.read_background: {instruction: 'Read the account. What was the speaker doing in traffic?', correct_option: 'Reading a book.', distractors: ['Making dinner.', 'Crossing the street.', 'Waiting at home.'], accepted_answers: [{value: 'Reading a book.', status: correct}], feedback: 'The account says *تو ترافیک داشتم کتاب می‌خوندم*.'}
  fa.a2.unit24.lesson05.exercise02.read_interrupt: {instruction: 'Read the account. What interrupted the reading?', correct_option: 'The bus stopped.', distractors: ['It started raining.', 'The power went out.', 'A car started moving.'], accepted_answers: [{value: 'The bus stopped.', status: correct}], feedback: 'The interruption is *اتوبوس وایساد*.'}
  fa.a2.unit24.lesson05.exercise03.match_reading: {instruction: 'Match each phrase from the reading with its meaning.', accepted_answers: [{value: {'داشتم با اتوبوس می‌رفتم': 'I was going by bus', خونه: 'home', 'تو ترافیک': 'in traffic', 'داشتم کتاب می‌خوندم': 'I was reading a book', 'اتوبوس وایساد': 'the bus stopped', 'دوباره راه افتاد': 'it started moving again'}, status: correct}], feedback: 'These phrases reconstruct the complete bus incident.'}
  fa.a2.unit24.lesson05.exercise04.order_reading: {instruction: 'Arrange the words to say: In traffic I was reading a book.', accepted_answers: [{value: [تو, ترافیک, داشتم, کتاب, می‌خوندم], status: correct}], feedback: '*تو ترافیک داشتم کتاب می‌خوندم.*'}
  fa.a2.unit24.lesson05.exercise05.listen_rain: {instruction: 'Listen without a transcript. What was happening, and what interrupted it?', correct_option: 'The speaker was going home; then it started raining.', distractors: ['The speaker was reading; then the bus stopped.', 'The speaker was cooking; then the power went out.', 'The speaker was crossing the street; then a car stopped.'], accepted_answers: [{value: 'The speaker was going home; then it started raining.', status: correct}], feedback: 'You heard *داشتم می‌رفتم خونه که بارون شروع شد*.'}
  fa.a2.unit24.lesson05.exercise06.dictation_power: {instruction: 'Listen and type the Persian sentence exactly.', correct_response: 'داشتم شام درست می‌کردم که برق رفت', orthography_strict: true, feedback: 'The sentence links ongoing cooking to the power cut.'}
  fa.a2.unit24.lesson06.exercise01.comprehend_nima: {instruction: 'Read the dialogue. What was Nima doing when it started raining?', correct_option: 'He was going home.', distractors: ['He was making dinner.', 'He was waiting for the power.', 'He was reading on a bus.'], accepted_answers: [{value: 'He was going home.', status: correct}], feedback: 'Nima says *داشتم می‌رفتم خونه*.'}
  fa.a2.unit24.lesson06.exercise02.comprehend_sara: {instruction: 'Read the dialogue. What happened while Sara was making dinner?', correct_option: 'The power went out.', distractors: ['It started raining.', 'The bus stopped.', 'A car stopped.'], accepted_answers: [{value: 'The power went out.', status: correct}], feedback: 'Sara says *داشتم شام درست می‌کردم که برق رفت*.'}
  fa.a2.unit24.lesson06.exercise03.match_dialogue: {instruction: 'Match each dialogue detail with its role.', accepted_answers: [{value: {سارا: 'asks the first question', نیما: 'was going home', 'بارون شروع شد': "interrupts Nima's journey", 'داشتم شام درست می‌کردم': "Sara's background action", 'برق رفت': "interrupts Sara's cooking", 'چند دقیقه صبر کردم': 'Sara waited'}, status: correct}], feedback: 'The two accounts each link one background action to one event.'}
  fa.a2.unit24.lesson06.exercise04.order_question: {instruction: 'Arrange the words to ask one friend: What were you doing?', accepted_answers: [{value: [داشتی, چیکار, می‌کردی], status: correct}], feedback: '*داشتی چیکار می‌کردی؟*'}
  fa.a2.unit24.lesson06.exercise05.respond_question: {instruction: 'Sara asks *داشتی چیکار می‌کردی؟* Answer with the first-person past progressive plus *که*: I was going home when it started raining.', accepted_answers: [{value: 'داشتم می‌رفتم خونه که بارون شروع شد', status: correct}, {value: 'من داشتم می‌رفتم خونه که بارون شروع شد', status: correct}], feedback: '*داشتم می‌رفتم خونه که بارون شروع شد.*'}
  fa.a2.unit24.lesson06.exercise06.write_full_incident: {instruction: 'Write a short complete incident account in Farsi using first-person past progressive plus *که*: I was making dinner when the power went out.', accepted_answers: [{value: 'داشتم شام درست می‌کردم که برق رفت', status: correct}, {value: 'من داشتم شام درست می‌کردم که برق رفت', status: correct}], feedback: '*داشتم شام درست می‌کردم که برق رفت.*'}
