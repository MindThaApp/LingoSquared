teaching:
  fa.a2.unit51.short_story.lesson01.teach.place_words:
    title: Places and treats for a day out
    gloss: zoo, boat, amusement park, ice cream
    note: '*سوار قایق شدن* is “to get on a boat / to take a boat trip.”'
    example_gloss:
    - Yesterday we went to the zoo.
    - We took a boat.
    - Tomorrow we are going to the amusement park.
    - We ate ice cream.
  fa.a2.unit51.short_story.lesson01.teach.we_past_verbs:
    title: 'What we did: past with ـیم'
    gloss: we went, we saw, we bought, we ate, we took / got, we became / got on
    note: The “we” ending of the past is *ـیم*. The verb usually comes at the end of the sentence.
    example_gloss:
    - We saw lions and elephants.
    - We bought tickets.
    - We took photos.
    - We got on a boat.
  fa.a2.unit51.short_story.lesson01.teach.order_words:
    title: Words that put events in order
    gloss: first, then / afterwards, after that, finally
    note: '*بعدش* and *بعد* both mean “then, after that.” *آخرش* is “in the end, finally” and begins the last event.'
    example_gloss:
    - First we bought tickets.
    - Then we saw a lion.
    - After that we took photos.
    - Finally we ate ice cream.
  fa.a2.unit51.short_story.lesson01.teach.tell_in_order:
    title: Telling a day in order
    gloss: First we went to the zoo, then we took a boat, finally we went to the amusement park.
    note: A story follows the order of events. Put *اول*, *بعدش* or *بعد*, and *آخرش* at the start of each part, with a past verb in each. You can drop *ما* because the ending *ـیم* already says “we.”
  fa.a2.unit51.short_story.lesson02.teach.they_past_verbs:
    title: 'What they did: past with ـن'
    gloss: they went, they saw, they bought, they ate, they arrived, they came back
    note: In the past, “they” ends in *ـن* (*رفتن*) and “we” ends in *ـیم* (*رفتیم*). The spoken *ـن* is the same shape as the dictionary form, so the sentence tells you who it is.
    example_gloss:
    - Sara and Nima went to the zoo yesterday.
    - They saw a lion.
    - They bought tickets.
    - In the end they went back home.
  fa.a2.unit51.short_story.lesson02.teach.feeling_verbs:
    title: Was afraid, laughed
    gloss: he/she was afraid, he/she laughed, they were afraid, they laughed
    note: '*ترسید* and *خندید* are he/she forms; *ترسیدن* and *خندیدن* are the “they” forms.'
    example_gloss:
    - Nima was afraid.
    - Sara laughed.
    - Sara and Nima laughed a lot.
    - They were afraid.
  fa.a2.unit51.short_story.lesson02.teach.when_past:
    title: وقتی in a story
    gloss: When they arrived, they bought tickets. When they got on the boat, Nima was afraid.
    note: In a story, *وقتی* is followed by a past verb and then the main past verb. The *وقتی* part names the moment and the main clause tells what happened then.
  fa.a2.unit51.short_story.lesson02.teach.people_events:
    title: Starting a story
    gloss: Sara and Nima went to the zoo yesterday.
    note: A story usually begins with who, when, and where.
  fa.a2.unit51.short_story.lesson03.teach.progressive_forms:
    title: What was in progress
    gloss: we were going, he/she/it was going, they were eating, he/she was taking photos
    note: '*داشت* plus a *می‌* verb shows an action that was in progress. Use it for what was going on while something else happened.'
    example_gloss:
    - We were going to the zoo.
    - Sara was taking photos.
    - They were eating ice cream.
    - I was taking photos.
    - The boat was going.
  fa.a2.unit51.short_story.lesson03.teach.progressive_note:
    title: Two things happening together
    gloss: While the boat was moving, Sara was taking photos.
    note: The first part sets the scene (*قایق داشت می‌رفت*); the second says what else was happening (*سارا داشت عکس می‌گرفت*). Use this form for statements only, not for negatives.
  fa.a2.unit51.short_story.lesson03.teach.past_perfect_forms:
    title: What had already happened
    gloss: he/she had bought, we had gone, they had arrived, I had seen
    note: '*بود/بودیم/بودن/بودم* after the *ـه* form of the verb means “had.”'
    example_gloss:
    - Nima had bought the tickets.
    - We had gone before.
    - They had arrived.
    - I had seen a lion before.
  fa.a2.unit51.short_story.lesson03.teach.past_perfect_note:
    title: Something that happened earlier
    gloss: When we arrived, Nima had already bought the tickets.
    note: The past perfect shows that one past event happened before another. The two events are *رسیدیم* (later) and *خریده بود* (earlier).
  fa.a2.unit51.short_story.lesson04.teach.habit_words:
    title: Every year, when I was a child
    gloss: every year, I was a child, my mom
    note: '*هر سال* and *وقتی بچه بودم* tell you that something happened again and again in the past.'
    example_gloss:
    - Every year we went to the amusement park.
    - When I was a child, we went with my mom.
    - My mom likes amusement parks.
  fa.a2.unit51.short_story.lesson04.teach.perfect_forms:
    title: Have you ever?
    gloss: so far / ever, I have been, I have not been, we have been, you have become / got on
    note: '*تا حالا* asks or says whether something has happened up to now. In speech you can also use the simple past: *تا حالا سوار قایق شدی؟*'
    example_gloss:
    - I have never been to an amusement park.
    - Have you ever been on a boat?
    - We have been to the zoo.
  fa.a2.unit51.short_story.lesson04.teach.tense_choice:
    title: Which past for which story?
    gloss: We went yesterday; we used to go every year; we had gone; we have been so far.
    note: Use the simple past for one finished event, the *می‌ـ* past for a habit, *بود* for “had,” and *تا حالا* with the *ـه* form for experience up to now.
  fa.a2.unit51.short_story.lesson04.teach.ever_phrase:
    title: Asking about experience
    gloss: Have you ever been on a boat? Yes, once.
    note: 'A short question and a short answer: *یه بار* means “once.”'
  fa.a2.unit51.short_story.lesson05.teach.reading:
    title: A day out
    gloss: Yesterday Sara and Nima went to the zoo. When they arrived, Nima had already bought the tickets. First they saw lions and elephants. Then they took a boat. While the boat was moving, Nima was afraid but Sara was taking photos. After that they went to the amusement park and laughed a lot. In the end they ate ice cream and went back home.
    note: Read once for the order of places, then again for who did what.
  fa.a2.unit51.short_story.lesson06.teach.turn01:
    title: Nima starts
    gloss: Sara, we had a very nice time yesterday!
    note: Nima opens with how the day was.
  fa.a2.unit51.short_story.lesson06.teach.turn02:
    title: Sara starts the story
    gloss: Yes! First we went to the zoo and saw lions and elephants.
    note: '*اول* begins the retelling.'
  fa.a2.unit51.short_story.lesson06.teach.turn03:
    title: Nima continues
    gloss: Then we took a boat. When the boat was moving, I was afraid.
    note: '*بعدش* continues the order; *داشت می‌رفت* is the background.'
  fa.a2.unit51.short_story.lesson06.teach.turn04:
    title: Sara adds
    gloss: But I laughed and took photos! After that we went to the amusement park.
    note: '*بعد* moves the story on.'
  fa.a2.unit51.short_story.lesson06.teach.turn05:
    title: Nima finishes
    gloss: Finally we ate ice cream. I had never been to an amusement park before.
    note: '*نرفته بودم* looks back to something earlier.'
  fa.a2.unit51.short_story.lesson06.teach.turn06:
    title: Sara plans another trip
    gloss: So we will go again next week!
    note: A plan with the plain present.
exercises:
