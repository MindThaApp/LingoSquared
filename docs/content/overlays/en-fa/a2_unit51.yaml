    instruction: What did we do last?
    correct_option: We ate ice cream.
    distractors:
    - We bought tickets.
    - We saw a lion and an elephant.
    - We took photos.
    accepted_answers:
    - value: We ate ice cream.
      status: correct
    feedback: '*آخرش* begins the last event: *بستنی خوردیم*.'
  fa.a2.unit51.short_story.lesson01.exercise02.recognize_order:
    instruction: Which sentence says we took the boat first and went to the amusement park afterwards?
    correct_option: اول سوار قایق شدیم، بعدش رفتیم شهربازی.
    distractors:
    - اول رفتیم شهربازی، بعدش سوار قایق شدیم.
    - اول بستنی خوردیم، آخرش سوار قایق شدیم.
    - اول رفتیم باغ‌وحش، بعدش بستنی خوردیم.
    accepted_answers:
    - value: اول سوار قایق شدیم، بعدش رفتیم شهربازی.
      status: correct
    feedback: '*اول* marks the first event and *بعدش* the next one.'
  fa.a2.unit51.short_story.lesson01.exercise03.match_story_words:
