course:
  title: Farsi B2
  description: Defend a position with reasons, evidence, concession, and rebuttal.
units:
  fa.b2.unit01.argumentation:
    title: Argumentation
    description: Defend a position with reasons, evidence, concession, and rebuttal.
lessons:
  fa.b2.unit01.argumentation.lesson01.claim:
    title: Stating a claim
  fa.b2.unit01.argumentation.lesson02.support:
    title: Reasons and examples
  fa.b2.unit01.argumentation.lesson03.concede_rebut:
    title: Conceding and rebutting
teaching:
  fa.b2.unit01.argumentation.lesson01.claim.teach.card01:
    title: in my opinion
    gloss: in my opinion
    note: 'A neutral opener for giving your view, fine in both speech and writing. It is a fixed phrase, so keep *به نظر* and do not translate "mind" or "view" word by word.'
    example_gloss: In my opinion, because we have clear evidence, we should continue the plan.
  fa.b2.unit01.argumentation.lesson01.claim.teach.card02:
    title: I believe that
    gloss: I believe that
    note: 'More formal than *به نظر من*. The verb *معتقدم* already carries "I", so *من* is optional, and the *که* clause that follows keeps its own verb at the end.'
    example_gloss: I believe that this decision is not rushed.
  fa.b2.unit01.argumentation.lesson01.claim.teach.card03:
    title: claim
    gloss: claim
    note: 'Noun for an assertion. The compound verb is *ادعا کردن*, and *ادعا* can suggest something not yet proven, so it is a little stronger than neutral "say".'
    example_gloss: Every claim needs a clear reason.
  fa.b2.unit01.argumentation.lesson01.claim.teach.card04:
    title: plan
    gloss: plan
    note: 'A plan or proposal laid out for approval. For a personal intention or schedule, everyday Persian more often says *برنامه*.'
    example_gloss: This plan is useful for the neighborhood.
  fa.b2.unit01.argumentation.lesson01.claim.teach.card05:
    title: is defensible
    gloss: is defensible
    note: 'A formal adjective built from *قابل* plus a noun, linked by ezafe: *قابلِ دفاع* "defensible" (compare *قابلِ قبول* "acceptable"). In speech *قابل دفاعه* means "it is defensible".'
    example_gloss: Your proposal is defensible if its cost is clear.
  fa.b2.unit01.argumentation.lesson01.claim.teach.card06:
    title: evidence
    gloss: evidence
    note: 'An Arabic plural used as the word for "evidence" in formal argument. In speech *مدرک* or *دلیل* is more common.'
    example_gloss: We do not have enough evidence to change the plan.
  fa.b2.unit01.argumentation.lesson01.claim.teach.card07:
    title: shows
    gloss: shows
    note: 'Present tense of *نشان دادن*, "to show". Written *می‌دهد* is *می‌ده* in speech. What is shown follows, often in a *که* clause.'
    example_gloss: This statistic shows that the study room is heavily used.
  fa.b2.unit01.argumentation.lesson01.claim.teach.card08:
    title: useful
    gloss: useful
    note: 'Adjective meaning "useful". The beneficiary takes *برای*, as in "useful for students".'
    example_gloss: A quiet space is useful for students.
  fa.b2.unit01.argumentation.lesson01.claim.teach.card09:
    title: my main reason
    gloss: my main reason
    note: 'An ezafe chain: *دلیل* + *-ِ اصلی* + *من*, literally "reason-of main-of me". The adjective comes before the possessor.'
    example_gloss: My main reason is nighttime safety.
  fa.b2.unit01.argumentation.lesson01.claim.teach.grammar:
    title: Argumentation grammar
    gloss: Argumentation grammar
    note: 'A Farsi argument often opens with *به نظر من* or *من معتقدم که*. After *که* the clause keeps normal Farsi order with the verb at the end (*این طرح قابل دفاع است*), so do not copy the English subject-verb rhythm.'
  fa.b2.unit01.argumentation.lesson02.support.teach.card01:
    title: for example
    gloss: for example
    note: 'Fixed phrase for introducing an example. The lighter, more spoken equivalent is *مثلا*.'
    example_gloss: For example, we can split the guard cost.
  fa.b2.unit01.argumentation.lesson02.support.teach.card02:
    title: on the one hand / moreover
    gloss: on the one hand / moreover
    note: 'Literally "from one side". It adds a further point and is often paired with *از طرف دیگر* ("on the other hand") when contrasting.'
    example_gloss: Moreover, the library is needed after work too.
  fa.b2.unit01.argumentation.lesson02.support.teach.card03:
    title: cost
    gloss: cost
    note: 'Noun for cost or expense. The compound verb *هزینه کردن* means "to spend", and *هزینه داشتن* is "to cost".'
    example_gloss: The electricity cost has gone up this year.
  fa.b2.unit01.argumentation.lesson02.support.teach.card04:
    title: guard
    gloss: guard
    note: 'A guard or watchman. A time or place attaches with ezafe, as in *نگهبانِ شب*.'
    example_gloss: The night guard stays at the entrance.
  fa.b2.unit01.argumentation.lesson02.support.teach.card05:
    title: is less than the harm of closing
    gloss: is less than the harm of closing
    note: 'Comparison uses *از*: *کمتر از* means "less than". The noun pair *ضرر تعطیلی* is linked by an unwritten ezafe, "harm of closing".'
    example_gloss: The guard cost is less than the harm of closing.
  fa.b2.unit01.argumentation.lesson02.support.teach.card06:
    title: harm / loss
    gloss: harm / loss
    note: '"Harm" or "loss". The compound verb *ضرر زدن* means "to harm" and takes *به* for the one harmed.'
    example_gloss: Early closing harms students.
  fa.b2.unit01.argumentation.lesson02.support.teach.card07:
    title: for this reason
    gloss: for this reason
    note: 'Fixed phrase meaning "for this reason". *به همین دلیل* ("for that very reason") is a common variant. It opens the clause, and the verb stays last.'
    example_gloss: For this reason, I agree with continuing the plan.
  fa.b2.unit01.argumentation.lesson02.support.teach.card08:
    title: access
    gloss: access
    note: 'Noun for "access". The thing you can reach takes *به*, so English "access to" maps onto *دسترسی به*.'
    example_gloss: Night access is important for some families.
  fa.b2.unit01.argumentation.lesson02.support.teach.card09:
    title: specifically
    gloss: specifically
    note: 'An adverbial phrase, "specifically", built as *به طور* + adjective (compare *به طور کلی*). Formal; it usually opens the clause.'
    example_gloss: Specifically, working students use this hour.
  fa.b2.unit01.argumentation.lesson02.support.teach.grammar:
    title: Argumentation grammar
    gloss: Argumentation grammar
    note: '*برای مثال* and *از طرفی* are discourse signposts. In Farsi, the evidence can come before the final judgement, but the verb still closes each clause naturally.'
  fa.b2.unit01.argumentation.lesson03.concede_rebut.teach.card01:
    title: it is true that
    gloss: it is true that
    note: 'A concession opener. The *که* clause follows, and the rebuttal comes after with *اما* or *ولی*. Spoken: *درسته که*.'
    example_gloss: It is true that the cost is high, but it is still possible to find a solution.
  fa.b2.unit01.argumentation.lesson03.concede_rebut.teach.card02:
    title: however / still
    gloss: however / still
    note: 'A formal "even so" that opens a rebuttal after a concession. In speech *ولی* does similar work.'
    example_gloss: Still, we can control the cost.
  fa.b2.unit01.argumentation.lesson03.concede_rebut.teach.card03:
    title: objection
    gloss: objection
    note: 'Noun for an objection or protest. The compound verb *اعتراض کردن* takes *به* for what you object to.'
    example_gloss: Your objection about safety is serious.
  fa.b2.unit01.argumentation.lesson03.concede_rebut.teach.card04:
    title: response
    gloss: response
    note: 'A formal word for "answer"; *جواب* is the everyday equivalent. The compound verb is *پاسخ دادن*.'
    example_gloss: A short response is not always enough.
  fa.b2.unit01.argumentation.lesson03.concede_rebut.teach.card05:
    title: the result is worth it
    gloss: the result is worth it
    note: '*ارزش داشتن* is "to be worth", a compound with *داشتن*, so no separate English "it is" is needed. Spoken: *ارزش داره*.'
    example_gloss: If the children have a place to study, the result is worth it.
  fa.b2.unit01.argumentation.lesson03.concede_rebut.teach.card06:
    title: safety
    gloss: safety
    note: 'Abstract noun for "security" or "safety". Do not confuse it with *ایمنی*, which is safety from accidents and hazards.'
    example_gloss: Entrance safety must improve.
  fa.b2.unit01.argumentation.lesson03.concede_rebut.teach.card07:
    title: we cannot ignore
    gloss: we cannot ignore
    note: '*نادیده گرفتن* is "to ignore". After *توانستن* the second verb goes in the subjunctive (*بگیریم*), and the negation sits on *توانستن*.'
    example_gloss: We cannot ignore the students’ need.
  fa.b2.unit01.argumentation.lesson03.concede_rebut.teach.card08:
    title: neighborhood
    gloss: neighborhood
    note: 'A residential neighborhood. Possessives attach by ezafe, so "our neighborhood" is *محله‌ی ما*.'
    example_gloss: The neighborhood needs a quiet space.
  fa.b2.unit01.argumentation.lesson03.concede_rebut.teach.card09:
    title: overall
    gloss: overall
    note: 'A formal summing-up phrase, "overall". Use it at the start of the clause that closes an argument.'
    example_gloss: Overall, I defend keeping the library open.
  fa.b2.unit01.argumentation.lesson03.concede_rebut.teach.grammar:
    title: Argumentation grammar
    gloss: Argumentation grammar
    note: '*درست است که* concedes a point without giving up your claim. *اما* is the usual written and neutral "but", and *ولی* is its everyday spoken equivalent; either way, keep the rebuttal clause short and clear.'
