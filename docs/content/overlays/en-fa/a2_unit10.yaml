course:
  title: Farsi A2
  description: >-
    Lower-intermediate Iranian Farsi: giving an opinion with a reason,
    reading a written opinion, and responding to someone else's
    contrasting opinion -- a workplace debate about remote work.

units:
  fa.a2.unit10.opinions:
    title: Sharing opinions

lessons:
  fa.a2.unit10.lesson01.opinions_vocabulary: {title: "Words for sharing an opinion"}
  fa.a2.unit10.lesson02.giving_an_opinion: {title: "Giving an opinion with a reason"}
  fa.a2.unit10.lesson03.reading_an_opinion_message: {title: "Reading a written opinion"}
  fa.a2.unit10.lesson04.office_debate_dialogue: {title: "Responding to a different opinion"}

teaching:
  fa.a2.unit10.lesson01.teach.nazar_word:
    title: "Opinion"
    gloss: "opinion"
    note: "*نظر* is the general word for an opinion or view."
  fa.a2.unit10.lesson01.teach.dalil_word:
    title: "Reason"
    gloss: "reason"
    note: "*دلیل* is the general word for a reason."
  fa.a2.unit10.lesson01.teach.remote_work_word:
    title: "Remote work"
    gloss: "remote work / working from home"
    note: "*دورکاری* is the common modern Persian word for remote work."
  fa.a2.unit10.lesson01.teach.traffic_word:
    title: "Traffic"
    gloss: "traffic"
    note: "*ترافیک* is the everyday word for traffic, a well-known daily topic in Tehran."
  fa.a2.unit10.lesson01.teach.focus_word:
    title: "Concentration"
    gloss: "concentration / focus"
    note: "*تمرکز* is the general word for concentration or focus."
  fa.a2.unit10.lesson01.teach.office_word:
    title: "Office"
    gloss: "office"
    note: "*دفتر* is the general word for an office, the alternative to *دورکاری* this unit debates."
  fa.a2.unit10.lesson01.teach.va_word:
    title: "And"
    gloss: "and"
    note: "*و* is the common connecting word used throughout this unit."

  fa.a2.unit10.lesson02.teach.in_my_opinion_better:
    title: "State an opinion"
    gloss: "In my opinion, remote work is better."
    note: "*به نظر من ...* (in my opinion...) is the standard way to introduce an opinion in Persian."
  fa.a2.unit10.lesson02.teach.because_traffic_wastes_time:
    title: "Give a reason with چون (because)"
    gloss: "Because a lot of time is wasted in Tehran traffic."
    note: "*چون* introduces the supporting reason, the A2-level step up from A1's plain statements."
  fa.a2.unit10.lesson02.teach.full_opinion_with_reason:
    title: "Combine the opinion and the reason"
    gloss: "In my opinion, remote work is better, because a lot of time is wasted in Tehran traffic."
    note: "This is the full به نظر من ... چون ... pattern this unit is built around."

  fa.a2.unit10.lesson03.teach.message_word:
    title: "Message"
    gloss: "message"
    note: "*پیام* is the general word for a message, spoken or written."
  fa.a2.unit10.lesson03.teach.family_word:
    title: "Family"
    gloss: "family"
    note: "*خانواده* is the general word for family."
  fa.a2.unit10.lesson03.teach.message_text:
    title: "A written message giving an opinion"
    gloss: "In my opinion, remote work is much better, because a lot of time is wasted in Tehran traffic, and I can be with my family more."
    note: "A short written opinion with two reasons joined by *و* (and), the reading_writing register this unit is teaching."

  fa.a2.unit10.lesson04.teach.i_dont_agree:
    title: "Disagree politely"
    gloss: "I don't agree."
    note: "*من موافق نیستم* is a plain, polite way to disagree -- not rude, just direct."
  fa.a2.unit10.lesson04.teach.turn01:
    title: "نگار states her opinion"
    gloss: "نگار says in her opinion, remote work is better."
    note: "Reuses lesson02's *به نظر من ... بهتره* pattern."
  fa.a2.unit10.lesson04.teach.turn02:
    title: "آرش disagrees"
    gloss: "آرش says he doesn't agree."
    note: "*من موافق نیستم* from earlier in this lesson."
  fa.a2.unit10.lesson04.teach.turn03:
    title: "نگار asks why"
    gloss: "نگار asks why."
    note: "*چرا؟* is the everyday word for 'why?'."
  fa.a2.unit10.lesson04.teach.turn04:
    title: "آرش gives his reasons"
    gloss: "آرش says he doesn't have concentration at home, and he likes seeing his colleagues."
    note: "Two reasons joined with *و* (and)."
  fa.a2.unit10.lesson04.teach.turn05:
    title: "نگار concedes but restates her reason"
    gloss: "نگار says okay, but in her opinion traffic takes a lot of time."
    note: "*باشه، ولی...* (okay, but...) politely concedes a point before restating your own."
  fa.a2.unit10.lesson04.teach.turn06:
    title: "آرش agrees but explains"
    gloss: "آرش agrees that's true, but says he's used to it."
    note: "*درسته، ولی...* (that's true, but...) acknowledges the other person's point."

exercises:
  fa.a2.unit10.lesson01.exercise01.recognize_nazar:
    instruction: "Which word means opinion?"
    correct_option: "opinion"
    distractors: ["reason", "remote work", "traffic"]
    accepted_answers: [{value: "opinion", status: correct}]
    feedback: "*نظر* means opinion."
  fa.a2.unit10.lesson01.exercise02.recognize_traffic:
    instruction: "Which word means traffic?"
    correct_option: "traffic"
    distractors: ["opinion", "reason", "concentration"]
    accepted_answers: [{value: "traffic", status: correct}]
    feedback: "*ترافیک* means traffic."
  fa.a2.unit10.lesson01.exercise03.match_opinions_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {نظر: opinion, دلیل: reason, دورکاری: "remote work", ترافیک: traffic, تمرکز: concentration, دفتر: office}, status: correct}
    feedback: "These six words cover this unit's basic opinions vocabulary."
  fa.a2.unit10.lesson01.exercise04.order_nazar_dalil:
    instruction: "Arrange the words to say opinion and reason."
    accepted_answers: [{value: [نظر, و, دلیل], status: correct}]
    feedback: "*نظر و دلیل* joins the two words with *و*."
  fa.a2.unit10.lesson01.exercise05.write_remote_work:
    instruction: "Write the Farsi word for remote work."
    accepted_answers:
      - {value: دورکاری, status: correct}
    feedback: "*دورکاری* means remote work."

  fa.a2.unit10.lesson02.exercise01.recognize_opinion_phrase:
    instruction: "Which phrase states an opinion?"
    correct_option: "In my opinion, remote work is better."
    distractors: ["Because a lot of time is wasted in Tehran traffic.", "I don't agree.", "I can be with my family more."]
    accepted_answers: [{value: "In my opinion, remote work is better.", status: correct}]
    feedback: "*به نظر من دورکاری بهتره.* states the opinion."
  fa.a2.unit10.lesson02.exercise02.order_because_traffic:
    instruction: "Arrange the words to give the reason: because a lot of time is wasted in Tehran traffic."
    accepted_answers: [{value: [چون, تو, ترافیک, تهران, وقت, زیادی, تلف, می‌شه], status: correct}]
    feedback: "*چون تو ترافیک تهران وقت زیادی تلف می‌شه.* gives the reason."
  fa.a2.unit10.lesson02.exercise03.dialogue_response_which_better:
    instruction: "Someone asks: 'In your opinion, is remote work better, or going into the office?' Answer with your opinion and your reason."
    accepted_answers:
      - {value: "به نظر من دورکاری بهتره، چون تو ترافیک تهران وقت زیادی تلف می‌شه.", status: correct}
      - {value: "به نظر من دورکاری بهتره چون تو ترافیک تهران وقت زیادی تلف می‌شه", status: correct}
    feedback: "Joining the opinion and the reason with a comma, or with no punctuation at all, are equally natural -- *چون* already does the joining work, so it never takes an *و* in front of it."
  fa.a2.unit10.lesson02.exercise04.translate_opinion_with_reason:
    instruction: "Translate into Farsi: In my opinion, remote work is better, because a lot of time is wasted in Tehran traffic."
    accepted_answers:
      - {value: "به نظر من دورکاری بهتره، چون تو ترافیک تهران وقت زیادی تلف می‌شه.", status: correct}
      - {value: "به نظر من دورکاری بهتره چون تو ترافیک تهران وقت زیادی تلف می‌شه", status: correct}
    feedback: "*به نظر من دورکاری بهتره، چون تو ترافیک تهران وقت زیادی تلف می‌شه.* is the full opinion-plus-reason sentence."
  fa.a2.unit10.lesson02.exercise05.write_opinion_with_reason:
    instruction: "Write that in your opinion remote work is better, because a lot of time is wasted in Tehran traffic."
    accepted_answers:
      - {value: "به نظر من دورکاری بهتره، چون تو ترافیک تهران وقت زیادی تلف می‌شه.", status: correct}
      - {value: "به نظر من دورکاری بهتره چون تو ترافیک تهران وقت زیادی تلف می‌شه", status: correct}
    feedback: "*به نظر من دورکاری بهتره، چون تو ترافیک تهران وقت زیادی تلف می‌شه.* is the accepted opinion-plus-reason sentence."

  fa.a2.unit10.lesson03.exercise01.read_her_opinion:
    instruction: "What is the message writer's opinion about remote work?"
    correct_option: "Remote work is much better."
    distractors: ["Remote work is a little worse.", "She has no opinion.", "The office is much better."]
    accepted_answers: [{value: "Remote work is much better.", status: correct}]
    feedback: "*به نظر من دورکاری خیلی بهتره* -- in her opinion, remote work is much better."
  fa.a2.unit10.lesson03.exercise02.read_her_second_reason:
    instruction: "Besides the traffic, what is the writer's second reason for preferring remote work?"
    correct_option: "She can be with her family more."
    distractors: ["She dislikes her colleagues.", "She gets more sleep.", "She has a bigger office at home."]
    accepted_answers: [{value: "She can be with her family more.", status: correct}]
    feedback: "*می‌تونم بیشتر پیش خانواده‌م باشم* -- she can be with her family more."
  fa.a2.unit10.lesson03.exercise03.recognize_message_word:
    instruction: "Which word means message?"
    correct_option: "message"
    distractors: ["family", "traffic", "opinion"]
    accepted_answers: [{value: "message", status: correct}]
    feedback: "*پیام* means message."
  fa.a2.unit10.lesson03.exercise04.order_more_time_with_family:
    instruction: "Arrange the words to say I can be with my family more."
    accepted_answers: [{value: [می‌تونم, بیشتر, پیش, خانواده‌م, باشم], status: correct}]
    feedback: "*می‌تونم بیشتر پیش خانواده‌م باشم* says you can be with your family more."
  fa.a2.unit10.lesson03.exercise05.write_own_reply:
    instruction: "Write your own opinion: in your opinion, remote work is better."
    accepted_answers:
      - {value: "به نظر من دورکاری بهتره.", status: correct}
      - {value: "به نظر من دورکاری بهتره", status: correct}
    feedback: "*به نظر من دورکاری بهتره.* states this opinion."

  fa.a2.unit10.lesson04.exercise01.comprehend_arash_opinion:
    instruction: "Does آرش agree with نگار's opinion about remote work?"
    correct_option: "No, he disagrees."
    distractors: ["Yes, he agrees completely.", "He has no opinion.", "He agrees, but only about the traffic."]
    accepted_answers: [{value: "No, he disagrees.", status: correct}]
    feedback: "*من موافق نیستم.* -- آرش says he doesn't agree."
  fa.a2.unit10.lesson04.exercise02.comprehend_arash_reason:
    instruction: "What reasons does آرش give for preferring the office?"
    correct_option: "He doesn't concentrate well at home, and he likes seeing his colleagues."
    distractors: ["He dislikes traffic.", "He wants more time with family.", "His home has no internet."]
    accepted_answers: [{value: "He doesn't concentrate well at home, and he likes seeing his colleagues.", status: correct}]
    feedback: "*چون تو خونه تمرکز ندارم و دوست دارم همکارامو ببینم* -- no concentration at home, and he likes seeing his colleagues."
  fa.a2.unit10.lesson04.exercise03.recognize_who_prefers_what:
    instruction: "Who prefers remote work, and who prefers the office?"
    correct_option: "نگار prefers remote work; آرش prefers the office."
    distractors: ["آرش prefers remote work; نگار prefers the office.", "Both prefer remote work.", "Both prefer the office."]
    accepted_answers: [{value: "نگار prefers remote work; آرش prefers the office.", status: correct}]
    feedback: "نگار opens with *به نظر من دورکاری بهتره*; آرش disagrees and explains why he prefers the office."
  fa.a2.unit10.lesson04.exercise04.order_i_dont_agree:
    instruction: "Arrange the words to say I don't agree."
    accepted_answers: [{value: [من, موافق, نیستم], status: correct}]
    feedback: "*من موافق نیستم.* says you don't agree."
  fa.a2.unit10.lesson04.exercise05.dialogue_response_as_negar:
    instruction: "آرش just explained his reasons: 'Because I don't concentrate well at home, and I like seeing my colleagues.' Respond as نگار: concede the point, but restate that in your opinion traffic takes a lot of time."
    accepted_answers:
      - {value: "باشه، ولی به نظر من ترافیک وقت زیادی می‌گیره.", status: correct}
      - {value: "باشه ولی به نظر من ترافیک وقت زیادی می‌گیره", status: correct}
    feedback: "*باشه، ولی...* politely concedes before restating your own point -- the comma is a light pause, not a hard requirement."
  fa.a2.unit10.lesson04.exercise06.write_debate_summary:
    instruction: "Write down what نگار said, then what آرش said, in their own words."
    accepted_answers:
      - {value: "به نظر من دورکاری بهتره. من موافق نیستم.", status: correct}
      - {value: "به نظر من دورکاری بهتره، من موافق نیستم", status: correct}
      - {value: "به نظر من دورکاری بهتره و من موافق نیستم", status: correct}
    feedback: "نگار's own opinion (*به نظر من دورکاری بهتره.*) followed by آرش's own disagreement (*من موافق نیستم.*), quoted directly -- joining them with a period, a comma, or *و* are equally natural."
