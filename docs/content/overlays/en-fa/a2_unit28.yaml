teaching:
  fa.a2.unit28.lesson01.teach.weather_words:
    title: Weather words for a forecast
    gloss: tomorrow, weather, rain, snow, cold, warm, sunny
    note: '*بارون* is the everyday spoken form of “rain”; careful writing uses *باران*. *آفتابیه* means “it is sunny.”'
    example_gloss: [Tomorrow it will be sunny., Tomorrow it will rain., Tomorrow it will snow.]
  fa.a2.unit28.lesson01.teach.forecast_verbs:
    title: Two forecast verbs
    gloss: it rains, it becomes
    note: '*می‌باره* is “it rains/snows.” *می‌شه* is “it becomes” and goes with an adjective: *سرد می‌شه* = “it will get cold.”'
    example_gloss: [Tomorrow the weather will get cold., Tomorrow the weather will get warm.]
  fa.a2.unit28.lesson01.teach.present_for_future:
    title: The spoken present for the future
    gloss: Tomorrow it will rain. Tomorrow it will get cold.
    note: 'Persian speakers predict with the ordinary present tense plus a time word. *فردا بارون می‌باره* is “Tomorrow it will rain.” There is no separate spoken future tense: *فردا* tells you it is about the future.'
  fa.a2.unit28.lesson02.teach.possibility_words:
    title: Maybe and probably
    gloss: maybe, probably, Nima, Sara
    note: '*شاید* means “maybe” and *احتمالا* means “probably.” Nima and Sara are the established friends of the course.'
    example_gloss: [Maybe Nima will come., It will probably rain.]
  fa.a2.unit28.lesson02.teach.subjunctive_verbs:
    title: Verbs after شاید
    gloss: he/she/it comes, he/she/it does not come, it becomes
    note: 'After *شاید* the verb takes the subjunctive: *بیاد* (comes), *نیاد* (does not come), *بشه* (becomes). The subjunctive has *ب-* and no *می‌*.'
    example_gloss: [Maybe it will rain., Maybe it will not rain., Maybe the weather will get cold.]
  fa.a2.unit28.lesson02.teach.shayad_note:
    title: شاید + subjunctive
    gloss: Maybe it will rain. Maybe it will get cold. Maybe it will not rain.
    note: 'Use *شاید* when something is only possible. The verb is subjunctive, with no *می‌*: *شاید بارون بیاد*. Negative: *شاید بارون نیاد*. Compare the plain prediction *بارون می‌باره*, which has *می‌*.'
  fa.a2.unit28.lesson02.teach.ehtemalan_note:
    title: احتمالا + present
    gloss: It will probably rain. It will probably get cold.
    note: 'Use *احتمالا* when something is likely. The verb stays in the ordinary present, exactly as in a plain prediction: *احتمالا بارون می‌باره*. The word *احتمالا* alone changes the certainty.'
  fa.a2.unit28.lesson03.teach.negative_forecast:
    title: Negative forecast
    gloss: it does not rain
    note: '*نمی‌باره* is the negative of *می‌باره*: *فردا بارون نمی‌باره* = “Tomorrow it will not rain.”'
    example_gloss: [Tomorrow it will not rain., It will probably not rain tomorrow.]
  fa.a2.unit28.lesson03.teach.certainty_contrast:
    title: Certain, likely, or possible?
    gloss: It will rain. It will probably rain. Maybe it will rain.
    note: 'Three levels. Plain prediction: *بارون می‌باره* (present, *می‌*). Likely: *احتمالا بارون می‌باره* (present, *می‌*). Only possible: *شاید بارون بیاد* (subjunctive, no *می‌*). Do not use *شاید* with a plain *می‌باره* here.'
  fa.a2.unit28.lesson03.teach.negative_contrast:
    title: Negatives side by side
    gloss: It will not rain. Maybe it will not rain.
    note: 'Plain negative: *نمی‌باره* (present, *نمی‌*). Possible negative: *شاید بارون نیاد* (subjunctive *نیاد*). Both use *ن-*, but only the second has no *می‌*.'
  fa.a2.unit28.lesson04.teach.promise_words:
    title: Promise words
    gloss: I promise, definitely, late, phone call, help you, so, you will not (be)
    note: '*قول می‌دم* = “I promise.” *حتما* = “definitely.” *زنگ* with *زدن* is “to call.” *کمکت* is *کمک* + *ت*, “help you.” *دیر* = “late.”'
    example_gloss: [I will definitely call., I promise to help you.]
  fa.a2.unit28.lesson04.teach.promise_verbs:
    title: Verbs for promises
    gloss: I do not do, I call (subjunctive), I do (subjunctive), I come (subjunctive), I call, you call
    note: 'After *قول می‌دم* the verb is subjunctive: *نکنم*, *بزنم*, *کنم*, *بیام*. The plain present *می‌زنم* is used with *حتما*.'
    example_gloss: [I promise I will not be late., I promise to call., I promise to come.]
  fa.a2.unit28.lesson04.teach.promise_note:
    title: قول می‌دم + subjunctive
    gloss: I promise I will not be late. I promise to call. I promise to come.
    note: 'A promise is *قول می‌دم* followed by a subjunctive verb (no *می‌*): *قول می‌دم دیر نکنم*. The negative *ن-* goes on the subjunctive. Persian does not use a future tense here; the subjunctive says what you commit to do.'
  fa.a2.unit28.lesson04.teach.hatman_note:
    title: حتما + present, شاید + subjunctive
    gloss: I will definitely call. Maybe I will call.
    note: 'For a firm promise you can say *حتما زنگ می‌زنم* (present with *می‌*). For something you are not sure of, *شاید زنگ بزنم* (subjunctive, no *می‌*). The same contrast as with the weather.'
  fa.a2.unit28.lesson05.teach.message_words:
    title: Words for a message
    gloss: hello, after, from, work, appointment, we have, last, week, to you, and, but, hour, ten, also, how is
    note: '*قرار داریم* means “we have a meeting arranged.” *بعد از کار* is “after work.” *آخر هفته* is “the weekend.” *بهت* is spoken “to you.”'
    example_gloss: [We have a meeting arranged after work tomorrow., It will be sunny at the weekend., I will definitely call you.]
  fa.a2.unit28.lesson05.teach.bulletin_words:
    title: Words from bulletins and notices
    gloss: meteorology, rain (written), cloudy, notice, office, closed, will, was/be, rained, became
    note: 'These words belong to written weather bulletins and notices. *باران* is the written form of spoken *بارون*. *خواهد* is the written “will,” in *خواهد بود* and *خواهد شد*.'
    example_gloss: [Weather notice, The office will be closed tomorrow.]
  fa.a2.unit28.lesson05.teach.formal_future_note:
    title: Written future with خواهد (recognition only)
    gloss: It will become cloudy. It will rain. The office will be closed.
    note: 'Written/formal only. Weather bulletins and notices use a written future: *خواهد* + a short verb form, as in *خواهد شد* (will become), *خواهد بارید* (will rain), *خواهد بود* (will be). You only need to RECOGNISE it when you read. In speech and in messages to friends, say *می‌شه*, *می‌باره*, *هست*; do not produce *خواهد* yourself.'
  fa.a2.unit28.lesson05.teach.reading_message:
    title: A message from Sara
    gloss: Hello Nima! We have a meeting arranged after work tomorrow. Tomorrow the weather will get cold and it will probably rain. Maybe it will snow at the weekend. I promise I will not be late and I will definitely call you.
    note: Read once for the plain prediction, then for what is only likely or possible, then for the promise.
  fa.a2.unit28.lesson05.teach.reading_bulletin:
    title: A weather bulletin
    gloss: 'Weather bulletin: Tomorrow the weather will become cloudy and it will rain. At the weekend the weather will be cold.'
    note: This is a written bulletin. The *خواهد* forms are for recognition only.
  fa.a2.unit28.lesson06.teach.turn01: {title: Sara asks about tomorrow, gloss: 'Sara asks Nima: How will the weather be tomorrow?', note: The question asks for a prediction.}
  fa.a2.unit28.lesson06.teach.turn02: {title: Nima predicts, gloss: 'Nima: It will probably rain. Maybe it will snow too.', note: '*احتمالا* is likely; *شاید* is only possible.'}
  fa.a2.unit28.lesson06.teach.turn03: {title: Sara checks the plan, gloss: 'Sara: We have a meeting arranged at ten tomorrow. You will not be late?', note: 'Sara asks for a commitment with *دیر نمی‌کنی؟*'}
  fa.a2.unit28.lesson06.teach.turn04: {title: Nima promises, gloss: 'Nima: I promise I will not be late.', note: '*قول می‌دم* + subjunctive.'}
  fa.a2.unit28.lesson06.teach.turn05: {title: Sara asks about a call, gloss: 'Sara: So will you call?', note: The present with *می‌* asks about a firm plan.}
  fa.a2.unit28.lesson06.teach.turn06: {title: Nima commits, gloss: 'Nima: I will definitely call.', note: '*حتما* + present gives a firm promise.'}
exercises:
  fa.a2.unit28.lesson01.exercise01.recognize_rain:
    instruction: What does this prediction mean?
    correct_option: Tomorrow it will rain.
    distractors: [Yesterday it rained., Tomorrow it will snow., Tomorrow it will be sunny.]
    accepted_answers: [{value: Tomorrow it will rain., status: correct}]
    feedback: 'The present *می‌باره* plus *فردا* gives “Tomorrow it will rain.”'
  fa.a2.unit28.lesson01.exercise02.recognize_cold:
    instruction: What does this prediction mean?
    correct_option: Tomorrow the weather will get cold.
    distractors: [Tomorrow the weather will get warm., Yesterday the weather got cold., Tomorrow it will rain.]
    accepted_answers: [{value: Tomorrow the weather will get cold., status: correct}]
    feedback: '*سرد می‌شه* means “gets/will get cold.”'
  fa.a2.unit28.lesson01.exercise03.match_forecasts:
    instruction: Match each Farsi item with its meaning.
    accepted_answers:
    - value: {فردا بارون می‌باره: Tomorrow it will rain, فردا برف می‌باره: Tomorrow it will snow, فردا هوا سرد می‌شه: Tomorrow the weather will get cold, فردا هوا گرم می‌شه: Tomorrow the weather will get warm, فردا هوا آفتابیه: Tomorrow it will be sunny, فردا: tomorrow, بارون: rain, برف: snow}
      status: correct
    feedback: Each forecast is a time word plus a present-tense verb.
  fa.a2.unit28.lesson01.exercise04.order_cold:
    instruction: 'Arrange the words to say: Tomorrow the weather will get cold.'
    accepted_answers:
    - {value: [فردا, هوا, سرد, می‌شه], status: correct}
    - {value: [هوا, فردا, سرد, می‌شه], status: correct}
    feedback: '*فردا هوا سرد می‌شه* puts the time word first.'
  fa.a2.unit28.lesson01.exercise05.fill_rain:
    instruction: 'Complete the spoken-present prediction: Tomorrow it will rain.'
    accepted_answers: [{value: می‌باره, status: correct}]
    feedback: The full sentence is *فردا بارون می‌باره*.
  fa.a2.unit28.lesson01.exercise06.translate_snow:
    instruction: 'Translate using فردا and the spoken present: Tomorrow it will snow.'
    accepted_answers:
    - {value: فردا برف می‌باره, status: correct}
    - {value: برف فردا می‌باره, status: acceptable_with_note, note: 'Possible, but the time word usually comes first.'}
    feedback: '*فردا برف می‌باره* is the taught model.'
  fa.a2.unit28.lesson02.exercise01.recognize_maybe_rain:
    instruction: What does this sentence mean?
    correct_option: Maybe it will rain.
    distractors: [It will definitely rain., Maybe it will snow., It did not rain.]
    accepted_answers: [{value: Maybe it will rain., status: correct}]
    feedback: '*شاید* + *بیاد* means “maybe it will rain.”'
  fa.a2.unit28.lesson02.exercise02.recognize_probably_rain:
    instruction: What does this sentence mean?
    correct_option: It will probably rain.
    distractors: [It will not rain., Maybe it will snow., It rained yesterday.]
    accepted_answers: [{value: It will probably rain., status: correct}]
    feedback: '*احتمالا* means “probably.”'
  fa.a2.unit28.lesson02.exercise03.match_maybe_probably:
    instruction: Match each Farsi item with its meaning.
    accepted_answers:
    - value: {شاید بارون بیاد: Maybe it will rain, شاید برف بیاد: Maybe it will snow, شاید هوا سرد بشه: Maybe the weather will get cold, شاید نیما بیاد: Maybe Nima will come, شاید بارون نیاد: Maybe it will not rain, احتمالا بارون می‌باره: It will probably rain, احتمالا هوا سرد می‌شه: The weather will probably get cold, احتمالا: probably}
      status: correct
    feedback: '*شاید* takes a subjunctive verb; *احتمالا* keeps the present with *می‌*.'
  fa.a2.unit28.lesson02.exercise04.order_maybe_tomorrow:
    instruction: 'Arrange the words to say: Maybe it will rain tomorrow.'
    accepted_answers:
    - {value: [شاید, فردا, بارون, بیاد], status: correct}
    - {value: [فردا, شاید, بارون, بیاد], status: correct}
    - {value: [شاید, بارون, فردا, بیاد], status: correct}
    feedback: '*شاید فردا بارون بیاد* has the subjunctive verb at the end.'
  fa.a2.unit28.lesson02.exercise05.fill_maybe_come:
    instruction: 'Complete with the subjunctive of “come”: Maybe it will rain.'
    accepted_answers: [{value: بیاد, status: correct}]
    feedback: The full sentence is *شاید بارون بیاد*.
  fa.a2.unit28.lesson02.exercise06.translate_maybe_nima:
    instruction: 'Translate using شاید: Maybe Nima will come.'
    accepted_answers:
    - {value: شاید نیما بیاد, status: correct}
    - {value: نیما شاید بیاد, status: acceptable_with_note, note: 'Possible, but *شاید* usually comes first.'}
    feedback: '*شاید نیما بیاد* is the taught model.'
  fa.a2.unit28.lesson03.exercise01.recognize_possible:
    instruction: How sure is the speaker?
    correct_option: Rain is only possible.
    distractors: [Rain is certain., Rain is probable., There will be no rain.]
    accepted_answers: [{value: Rain is only possible., status: correct}]
    feedback: '*شاید* + subjunctive marks a mere possibility.'
  fa.a2.unit28.lesson03.exercise02.recognize_plain_prediction:
    instruction: What does this plain prediction say?
    correct_option: It will rain tomorrow, stated as a fact.
    distractors: [It might rain tomorrow., It will not rain tomorrow., It rained yesterday.]
    accepted_answers: [{value: 'It will rain tomorrow, stated as a fact.', status: correct}]
    feedback: 'No *شاید* or *احتمالا*, so this is a plain prediction.'
  fa.a2.unit28.lesson03.exercise03.match_certainty:
    instruction: Match each sentence with how sure it is.
    accepted_answers:
    - value: {فردا بارون می‌باره: A plain prediction - it will rain tomorrow, شاید فردا بارون بیاد: Only possible - it might rain tomorrow, احتمالا فردا بارون می‌باره: Likely - it will probably rain tomorrow, فردا بارون نمی‌باره: A plain prediction - it will not rain tomorrow, شاید فردا بارون نیاد: Only possible - it might not rain tomorrow, احتمالا فردا بارون نمی‌باره: Likely - it will probably not rain tomorrow}
      status: correct
    feedback: Plain and likely use the present; only-possible uses the subjunctive.
  fa.a2.unit28.lesson03.exercise04.order_probably_cold:
    instruction: 'Arrange the words to say: The weather will probably get cold tomorrow.'
    accepted_answers:
    - {value: [احتمالا, فردا, هوا, سرد, می‌شه], status: correct}
    - {value: [فردا, احتمالا, هوا, سرد, می‌شه], status: correct}
    - {value: [فردا, هوا, احتمالا, سرد, می‌شه], status: correct}
    feedback: '*احتمالا* can stand before or after *فردا*; the verb is at the end.'
  fa.a2.unit28.lesson03.exercise05.fill_maybe_not:
    instruction: 'Complete with the negative subjunctive of “come”: Maybe it will not rain.'
    accepted_answers: [{value: نیاد, status: correct}]
    feedback: The full sentence is *شاید بارون نیاد*.
  fa.a2.unit28.lesson03.exercise06.translate_probably_rain:
    instruction: 'Translate using احتمالا and the spoken present: It will probably rain tomorrow.'
    accepted_answers:
    - {value: احتمالا فردا بارون می‌باره, status: correct}
    - {value: فردا احتمالا بارون می‌باره, status: correct}
    - {value: فردا بارون احتمالا می‌باره, status: acceptable_with_note, note: 'Possible, but *احتمالا* normally comes before the subject.'}
    feedback: 'Model: *احتمالا فردا بارون می‌باره.*'
  fa.a2.unit28.lesson04.exercise01.recognize_promise_late:
    instruction: What does the speaker say?
    correct_option: I promise I will not be late.
    distractors: [I promise I will be late., I think I will be late., I was late.]
    accepted_answers: [{value: I promise I will not be late., status: correct}]
    feedback: '*قول می‌دم* + *دیر نکنم* is “I promise I will not be late.”'
  fa.a2.unit28.lesson04.exercise02.recognize_definite_call:
    instruction: What does the speaker say?
    correct_option: I will definitely call.
    distractors: [Maybe I will call., I did not call., I called yesterday.]
    accepted_answers: [{value: I will definitely call., status: correct}]
    feedback: '*حتما* means “definitely.”'
  fa.a2.unit28.lesson04.exercise03.match_promises:
    instruction: Match each promise or possibility with its meaning.
    accepted_answers:
    - value: {قول می‌دم دیر نکنم: I promise I will not be late, قول می‌دم زنگ بزنم: I promise to call, قول می‌دم کمکت کنم: I promise to help you, قول می‌دم بیام: I promise to come, حتما زنگ می‌زنم: I will definitely call, شاید زنگ بزنم: Maybe I will call, شاید بیام: Maybe I will come, قول می‌دم: I promise}
      status: correct
    feedback: A promise uses a subjunctive verb after *قول می‌دم*.
  fa.a2.unit28.lesson04.exercise04.order_promise_tomorrow:
    instruction: 'Arrange the words to say: I promise I will not be late tomorrow.'
    accepted_answers:
    - {value: [قول, می‌دم, فردا, دیر, نکنم], status: correct}
    - {value: [فردا, قول, می‌دم, دیر, نکنم], status: correct}
    feedback: '*قول می‌دم فردا دیر نکنم*: the verb is at the end.'
  fa.a2.unit28.lesson04.exercise05.respond_promise:
    instruction: 'Sara asks if you will be late tomorrow. Answer in Farsi with a promise, using قول می‌دم: I promise I will not be late.'
    accepted_answers:
    - {value: 'قول می‌دم دیر نکنم', status: correct}
    - {value: 'قول می‌دم فردا دیر نکنم', status: correct}
    - {value: 'قول می‌دم، دیر نکنم', status: correct}
    feedback: 'Model: *قول می‌دم دیر نکنم.*'
  fa.a2.unit28.lesson04.exercise06.write_two_promises:
    instruction: 'Write in Farsi two short commitments, in this order: you will definitely call (use حتما and the present), then you promise you will not be late (use قول می‌دم).'
    accepted_answers:
    - {value: 'حتما زنگ می‌زنم، قول می‌دم دیر نکنم', status: correct}
    - {value: حتما زنگ می‌زنم قول می‌دم دیر نکنم, status: correct}
    - {value: حتما زنگ می‌زنم و قول می‌دم دیر نکنم, status: correct}
    feedback: 'Model: *حتما زنگ می‌زنم، قول می‌دم دیر نکنم.*'
  fa.a2.unit28.lesson05.exercise01.read_plain_prediction:
    instruction: In Sara's message, which prediction is stated as a plain fact, without maybe or probably?
    correct_option: The weather will get cold tomorrow.
    distractors: [It will rain tomorrow., It will snow at the weekend., Sara will be late.]
    accepted_answers: [{value: The weather will get cold tomorrow., status: correct}]
    feedback: 'The message says *فردا هوا سرد می‌شه*; rain is only *احتمالا* and snow is only *شاید*.'
  fa.a2.unit28.lesson05.exercise02.read_bulletin:
    instruction: According to the bulletin, what will happen to the weather tomorrow?
    correct_option: It will become cloudy.
    distractors: [It will become hot., It will snow., It was cloudy yesterday.]
    accepted_answers: [{value: It will become cloudy., status: correct}]
    feedback: '*خواهد شد* is the written future: “will become.” The bulletin says *ابری خواهد شد*.'
  fa.a2.unit28.lesson05.exercise03.match_texts:
    instruction: Match each line with its meaning.
    accepted_answers:
    - value: {فردا هوا سرد خواهد بود: The bulletin says tomorrow will be cold, باران خواهد بارید: The bulletin says it will rain, فردا اداره تعطیل خواهد بود: The notice says the office will be closed tomorrow, شاید آخر هفته برف بیاد: Maybe it will snow at the weekend, احتمالا بارون می‌باره: It will probably rain, قول می‌دم دیر نکنم: I promise I will not be late}
      status: correct
    feedback: The first three lines are written forms for recognition; the last three are spoken.
  fa.a2.unit28.lesson05.exercise04.listen_weather:
    instruction: Listen without a transcript. What is the forecast?
    correct_option: Rain tomorrow, and the weekend may be sunny.
    distractors: [Sun tomorrow, and the weekend will definitely be rainy., Snow tomorrow, and the weekend will be cold., Rain at the weekend, and tomorrow will be warm.]
    accepted_answers: [{value: 'Rain tomorrow, and the weekend may be sunny.', status: correct}]
    feedback: 'The audio gives a plain prediction for tomorrow and a possibility with *شاید* for the weekend.'
  fa.a2.unit28.lesson05.exercise05.listen_promise:
    instruction: Listen without a transcript. What does the speaker say?
    correct_option: The speaker will definitely call and promises not to be late.
    distractors: [The speaker may call and will probably be late., The speaker will not call but promises to help., The speaker called yesterday and was late.]
    accepted_answers: [{value: The speaker will definitely call and promises not to be late., status: correct}]
    feedback: 'The audio has *حتما زنگ می‌زنم* and *قول می‌دم دیر نکنم*.'
  fa.a2.unit28.lesson05.exercise06.dictation_maybe_rain:
    instruction: Listen and type the Farsi sentence exactly.
    correct_response: شاید فردا بارون بیاد
    orthography_strict: true
    feedback: 'The verb after *شاید* is the subjunctive *بیاد*.'
  fa.a2.unit28.lesson06.exercise01.comprehend_prediction:
    instruction: What does Nima say about the rain?
    correct_option: It will probably rain.
    distractors: [It will definitely rain., It will not rain., It rained yesterday.]
    accepted_answers: [{value: It will probably rain., status: correct}]
