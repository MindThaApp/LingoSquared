  fa.b1.unit03.lesson06.teach.grammar_review:
    title: "If I have money, I'll buy it. If I had money, I would buy it. If I don't have money, I won't buy it."
    gloss: "If I have money, I'll buy it. If I had money, I would buy it. If I don't have money, I won't buy it."
    note: "Review: real/possible condition = *اگه* + perfect subjunctive (*داشته باشم*) + present result (*می‌خرم*). Unreal/counterfactual condition = *اگه* + past (*داشتم*) + imperfect result, doing double duty as 'would' (*می‌خریدم*). Negate either half for a negative condition or a negative result. All six lessons in this unit use *داشتن* (have) as the if-clause verb and *خریدن* (buy) as the result-clause verb, across different persons and framings."
  fa.b1.unit03.lesson06.teach.vaght:
