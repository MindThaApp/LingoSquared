    gloss: "they buy"
    example_gloss: "If they have money, they'll buy it."
  fa.b1.unit03.lesson02.teach.grammar_agreement:
    title: "Double verb agreement"
    gloss: "If I have money I'll buy it. If you have money you'll buy it. If he/she has money he'll buy it. If we have money we'll buy it. If you (pl.) have money you'll buy it. If they have money they'll buy it."
    note: "Unlike *باید* (unit01, invariant) but LIKE *می‌تونم* (unit02, fully conjugating), BOTH the if-clause verb (*داشته باشم/باشی/باشه/باشیم/باشید/باشن*) AND the result-clause verb (*می‌خرم/می‌خری/می‌خره/می‌خریم/می‌خرید/می‌خرن*) agree with the subject here -- a genuine double-agreement construction across two separate clauses, not just one conjugating element."

  fa.b1.unit03.lesson03.teach.dashtam:
    title: I had
    gloss: I had
    example_gloss: "Last year I had money."
  fa.b1.unit03.lesson03.teach.nadashtam:
    title: I didn't have
    gloss: I didn't have
    example_gloss: "Last year I didn't have money."
  fa.b1.unit03.lesson03.teach.mikharidam:
    title: "I would buy / I would have bought"
    gloss: "I would buy / I would have bought"
    note: "The IMPERFECT of *خریدن* (buy) doubles as the conditional 'would buy' when paired with an *اگه* + past if-clause -- the same surface form as a literal past-imperfect ('I was buying'), disambiguated by context, exactly the way English 'would' itself does double duty for both hypothetical and habitual-past meaning in some dialects."
    example_gloss: "If I had money, I would buy it."
  fa.b1.unit03.lesson03.teach.grammar_real_vs_unreal:
    title: "If I have money, I'll buy it. If I had money, I would buy it. If I don't have money, I won't buy it."
    gloss: "If I have money, I'll buy it. If I had money, I would buy it. If I don't have money, I won't buy it."
    note: "Contrast the REAL/POSSIBLE condition (*اگه پول داشته باشم* -- perfect subjunctive, genuinely might happen) with the UNREAL/COUNTERFACTUAL one (*اگه پول داشتم* -- plain past, doesn't actually hold right now). Both if-clauses look similar to an English speaker (just 'if I have' vs 'if I had'), but Persian marks the distinction with the SUBJUNCTIVE (*داشته باشم*) vs the PAST (*داشتم*), not with an extra auxiliary the way English sometimes adds 'were' for unreal conditions."
  fa.b1.unit03.lesson03.teach.nadashte_basham:
    title: "(if) I don't have"
    gloss: "(if) I don't have"
    note: "Negate the SUBJUNCTIVE for a real/possible negative condition -- *ن-* prefixes onto *داشته*, same negation pattern as elsewhere in this course."
    example_gloss: "If I don't have money, I won't buy it."
  fa.b1.unit03.lesson03.teach.nemikharam:
    title: "I won't buy"
    gloss: "I won't buy"
    example_gloss: "If I don't have money, I won't buy it."
  fa.b1.unit03.lesson03.teach.parsal:
    title: last year
    gloss: last year
    example_gloss: "Last year I didn't have money."
  fa.b1.unit03.lesson03.teach.dasht:
    title: "he/she had"
    gloss: "he/she had"
    example_gloss: "Last year Nima had money."
  fa.b1.unit03.lesson03.teach.nadasht:
    title: "he/she didn't have"
    gloss: "he/she didn't have"
    example_gloss: "Last year Nima didn't have money."

