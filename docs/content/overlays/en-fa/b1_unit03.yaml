    gloss: "(if) you (pl.) have"
    example_gloss: "If you (pl.) have money, you'll buy it."
  fa.b1.unit03.lesson02.teach.dashte_bashan:
    title: "(if) they have"
    gloss: "(if) they have"
    example_gloss: "If they have money, they'll buy it."
  fa.b1.unit03.lesson02.teach.mikhare:
    title: "he/she buys"
    gloss: "he/she buys"
    example_gloss: "If he/she has money, he/she'll buy it."
  fa.b1.unit03.lesson02.teach.mikharim:
    title: "we buy"
    gloss: "we buy"
    example_gloss: "If we have money, we'll buy it."
  fa.b1.unit03.lesson02.teach.mikharid:
    title: "you (pl.) buy"
    gloss: "you (pl.) buy"
    example_gloss: "If you (pl.) have money, you'll buy it."
  fa.b1.unit03.lesson02.teach.mikharan:
