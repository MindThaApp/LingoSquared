course:
  title: Farsi B1
  description: >-
    Intermediate Iranian Farsi: expressing real/possible future conditions
    and unreal/counterfactual present-or-past conditions with اگه (if),
    contrasting both with negation, across everyday money and shopping
    decisions.

units:
  fa.b1.unit03.hypotheticals:
    title: Conditionals
    description: Express what you will do if a real condition is met, and what you would do (or would have done) if it weren't, using اگه (if) plus a matching result clause.

lessons:
  fa.b1.unit03.lesson01.real_condition_1st2nd:
    title: "If I have / if you have"
  fa.b1.unit03.lesson02.real_condition_all_persons:
    title: "All the persons"
  fa.b1.unit03.lesson03.counterfactual_and_negation:
    title: "If I had / if I don't have"
  fa.b1.unit03.lesson04.dialogue_weekend_shopping:
    title: "Weekend shopping"
  fa.b1.unit03.lesson05.reading_two_shoppers:
    title: "Money and shopping"
  fa.b1.unit03.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  fa.b1.unit03.lesson01.teach.age:
    title: if
    gloss: if
    note: "*اگه* is the colloquial contraction of literary *اگر* -- both mean 'if,' but this course consistently uses the spoken form, matching *باید*/*می‌تونم*'s own colloquial contractions elsewhere in this course."
    example_gloss: "If you have time, come."
  fa.b1.unit03.lesson01.teach.dashte_basham:
    title: "(if) I have"
    gloss: "(if) I have"
    note: "The PERFECT SUBJUNCTIVE of *داشتن* (to have) -- literally 'having' (*داشته*) plus subjunctive *باشم* (that I be). Persian doesn't use a simple present subjunctive for *داشتن* in real speech; this compound form is the genuine, standard way to say 'if I have' for a real/possible future condition."
    example_gloss: "If I have money, I'm happy."
  fa.b1.unit03.lesson01.teach.dashte_bashi:
    title: "(if) you have"
    gloss: "(if) you have"
    note: "Same perfect-subjunctive pattern, 'you' form."
    example_gloss: "If you have time, call."
  fa.b1.unit03.lesson01.teach.grammar_real_condition:
    title: "If I have money, I'll buy it. If you have money, will you buy it?"
    gloss: "If I have money, I'll buy it. If you have money, will you buy it?"
    note: "A REAL/POSSIBLE condition: *اگه* + perfect subjunctive (*داشته باشم*) in the if-clause, ordinary present tense (*می‌خرم*) in the result clause. English 'if I have money, I'll buy it' uses a plain present tense in the if-clause and 'will' in the result -- Persian instead marks the if-clause itself with the subjunctive, and the result clause stays in plain present (no separate future marker needed, same as elsewhere in this course)."
  fa.b1.unit03.lesson01.teach.pool:
    title: money
    gloss: money
    example_gloss: "I have enough money."
  fa.b1.unit03.lesson01.teach.mikharam:
    title: "I buy / I'll buy"
    gloss: "I buy / I'll buy"
    example_gloss: "If I have money, I'll buy it."
  fa.b1.unit03.lesson01.teach.mikhari:
    title: "you buy / you'll buy"
    gloss: "you buy / you'll buy"
    example_gloss: "If you have money, what will you buy?"

  fa.b1.unit03.lesson02.teach.dashte_bashe:
    title: "(if) he/she has"
    gloss: "(if) he/she has"
    example_gloss: "If he/she has money, he/she'll buy it."
  fa.b1.unit03.lesson02.teach.dashte_bashim:
    title: "(if) we have"
    gloss: "(if) we have"
    example_gloss: "If we have money, we'll buy it."
  fa.b1.unit03.lesson02.teach.dashte_bashid:
