    instruction: "What does this phrase mean?"
    correct_option: "Hello, go ahead."
    distractors: ["Hi, it's me.", "Can you repeat that?", "Bye, we'll talk later."]
    accepted_answers: [{value: "Hello, go ahead.", status: correct}]
