  fa.a1.unit22.lesson05.exercise03.recognize_goodbye_call_reading:
    instruction: "What does this sentence mean?"
    correct_option: "Bye, we'll talk later."
    distractors: ["Is it better now?", "Can you repeat that?", "Hello, go ahead."]
