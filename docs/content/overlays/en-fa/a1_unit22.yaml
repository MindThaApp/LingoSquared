course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: phone vocabulary, answering a call, asking
    someone to repeat or speak slowly, reading a short message, and
    ending a call politely.

units:
  fa.a1.unit22.phone:
    title: Phone Conversation

lessons:
  fa.a1.unit22.lesson01.phone_vocabulary: {title: "Phone vocabulary"}
  fa.a1.unit22.lesson02.answering_the_phone: {title: "Answering the phone"}
  fa.a1.unit22.lesson03.asking_to_repeat: {title: "Asking someone to repeat"}
  fa.a1.unit22.lesson04.reading_a_text_message: {title: "Reading a text message"}
  fa.a1.unit22.lesson05.ending_a_call: {title: "Ending a call"}
  fa.a1.unit22.lesson06.phone_dialogue: {title: "A full phone conversation"}

teaching:
  fa.a1.unit22.lesson01.teach.phone_word:
    title: "Phone"
    gloss: "phone"
    note: "تلفن is the general word for telephone/phone."
    example_gloss: "Where is my phone?"
  fa.a1.unit22.lesson01.teach.message_word:
    title: "Message"
    gloss: "message"
    note: "پیام is a written/text message."
    example_gloss: "I have a message."
  fa.a1.unit22.lesson01.teach.call_word:
    title: "To call"
    gloss: "to call"
    note: "زنگ زدن (literally 'to ring') is the everyday verb for calling someone."
    example_gloss: "Call me."
  fa.a1.unit22.lesson01.teach.voice_word:
    title: "Voice"
    gloss: "voice"
    note: "صدا means voice, used to describe how someone sounds on a call."
    example_gloss: "Your voice is good."

  fa.a1.unit22.lesson02.teach.hello_phone:
    title: "Hello (on the phone)"
    gloss: "hello, go ahead"
    note: "الو is the phone-specific greeting (not used face-to-face); بفرمایید here means something like 'go ahead, I'm listening.'"
  fa.a1.unit22.lesson02.teach.its_me:
    title: "It's me, Narges"
    gloss: "hi, it's me, Narges"
    note: "منم contracts من (I) + هم/است into 'it's me' -- a very common colloquial self-identification on a call."

  fa.a1.unit22.lesson03.teach.can_you_repeat:
    title: "Can you repeat that?"
    gloss: "can you repeat that?"
    note: "میشه (colloquial for می‌شود, 'is it possible') + تکرار کنید (repeat) is the standard polite request form."
  fa.a1.unit22.lesson03.teach.speak_slower:
    title: "Please speak more slowly"
    gloss: "please speak more slowly"
    note: "آهسته‌تر is the comparative of آهسته (slowly) -- 'more slowly.'"

  fa.a1.unit22.lesson04.teach.message_for_you:
    title: "I have a message for you"
    gloss: "I have a message for you"
    note: "برات contracts برای (for) + ت (informal 'you')."
  fa.a1.unit22.lesson04.teach.tomorrow_four:
    title: "Come to the cafe tomorrow at four"
    gloss: "come to the cafe tomorrow at four"
    note: "بیا is the bare-stem informal imperative of آمدن (to come), same pattern already established for other A1 imperatives."

  fa.a1.unit22.lesson05.teach.goodbye_call:
    title: "Bye, we'll talk later"
    gloss: "bye, we'll talk later"
    note: "بعداً means later; صحبت می‌کنیم is the present/future 'we talk/will talk.'"
  fa.a1.unit22.lesson05.teach.better_now:
    title: "Is it better now?"
    gloss: "is it better now?"
    note: "الان means now; بهتر شد literally 'became better,' the natural past-tense phrasing Farsi uses for this check-in even though English uses present tense."

  fa.a1.unit22.lesson06.teach.how_are_you:
    title: "Hi Narges, how are you?"
    gloss: "hi Narges, how are you?"
    note: "چطوری is the informal 'how are you,' appropriate here since Ali and Narges already know each other (established unit01)."
  fa.a1.unit22.lesson06.teach.cutting_out:
    title: "Your voice is cutting out"
    gloss: "your voice is cutting out"
    note: "قطع و وصل میشه literally 'is cutting and connecting' -- the natural Farsi idiom for a breaking-up phone connection."
  fa.a1.unit22.lesson06.teach.turn01: {title: "Ali answers", gloss: "Ali: Hello, go ahead."}
  fa.a1.unit22.lesson06.teach.turn02: {title: "Narges identifies herself", gloss: "Narges: Hi Ali, it's me, Narges."}
  fa.a1.unit22.lesson06.teach.turn03: {title: "Ali greets back", gloss: "Ali: Hi Narges, how are you?"}
  fa.a1.unit22.lesson06.teach.turn04: {title: "Narges asks him to slow down", gloss: "Narges: I'm good, thanks. Could you please speak more slowly? Your voice is cutting out."}
  fa.a1.unit22.lesson06.teach.turn05: {title: "Ali checks", gloss: "Ali: Okay, is it better now?"}
  fa.a1.unit22.lesson06.teach.turn06: {title: "Narges gives the message", gloss: "Narges: Yeah, better. I have a message for you, come to the cafe tomorrow at four."}
  fa.a1.unit22.lesson06.teach.turn07: {title: "Ali confirms", gloss: "Ali: Okay, I'll definitely come."}
  fa.a1.unit22.lesson06.teach.turn08: {title: "Narges ends the call", gloss: "Narges: Bye, we'll talk later."}
  fa.a1.unit22.lesson06.teach.turn09: {title: "Ali says goodbye", gloss: "Ali: Bye."}

exercises:
  fa.a1.unit22.lesson01.exercise01.recognize_phone:
    instruction: "What does this word mean?"
    correct_option: phone
    distractors: [message, call, voice]
    accepted_answers: [{value: phone, status: correct}]
    feedback: "تلفن means phone."
  fa.a1.unit22.lesson01.exercise02.recognize_message:
    instruction: "What does this word mean?"
    correct_option: message
    distractors: [phone, call, voice]
    accepted_answers: [{value: message, status: correct}]
    feedback: "پیام means message."
  fa.a1.unit22.lesson01.exercise03.recognize_call_reading:
    instruction: "What does this phrase mean?"
    correct_option: "to call"
    distractors: [phone, message, voice]
    accepted_answers: [{value: "to call", status: correct}]
    feedback: "زنگ زدن means 'to call.'"
  fa.a1.unit22.lesson01.exercise04.match_phone_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {تلفن: phone, پیام: message, "زنگ زدن": "to call", صدا: voice}
        status: correct
    feedback: "These four words cover the basic phone vocabulary for this unit."
  fa.a1.unit22.lesson01.exercise05.order_phone_words:
    instruction: "Arrange the words to say phone and message."
    accepted_answers: [{value: [تلفن, و, پیام], status: correct}]
    feedback: "تلفن و پیام joins the two words with و."
  fa.a1.unit22.lesson01.exercise06.translate_message:
    instruction: "Translate into Farsi: message."
    accepted_answers: [{value: پیام, status: correct}]
    feedback: "پیام means message."
  fa.a1.unit22.lesson01.exercise07.write_phone:
    instruction: "Write the Farsi word for phone."
    accepted_answers: [{value: تلفن, status: correct}]
    feedback: "تلفن means phone."

