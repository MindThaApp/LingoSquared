course:
  title: Farsi B1
  description: >-
    Intermediate Iranian Farsi: describing job responsibilities with the
    full formal copula of بودن (to be) -- هستم/هستی/هست/هستیم/هستید/هستن
    -- and giving a status update on a work task, in appropriately
    professional register.

units:
  fa.b1.unit05.workplace:
    title: "Work Responsibilities"
    description: Say what you're responsible for and give a colleague a status update on a task, using the formal copula and status-update vocabulary.

