course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: naming common pets and animals (dog, cat,
    bird, fish), asking "Do you have a pet?", giving a pet's name and
    feeding it, describing a pet's color and size, a short reading
    passage about سارا's cat پشمک, and a closing dialogue between سارا and
    نیما admiring پشمک.

units:
  fa.a1.unit26.animals:
    title: Animals

lessons:
  fa.a1.unit26.lesson01.pets: {title: "Pets: dog and cat"}
  fa.a1.unit26.lesson02.bird_fish: {title: "Bird and fish"}
  fa.a1.unit26.lesson03.name_and_food: {title: "What's its name?"}
  fa.a1.unit26.lesson04.color_size: {title: "Color and size"}
  fa.a1.unit26.lesson05.reading_about_saras_cat: {title: "Reading about Sara's cat"}
  fa.a1.unit26.lesson06.admiring_pashmak_dialogue: {title: "Dialogue: Sara's cat"}

teaching:
  fa.a1.unit26.lesson01.teach.man_review:
    title: I
    gloss: I
    note: "*من*, already well established, reappears here for talking about your own pet."
  fa.a1.unit26.lesson01.teach.oo_review:
    title: "He / she"
    gloss: "he / she"
    note: "*او*, already taught back in unit02, reappears here."
  fa.a1.unit26.lesson01.teach.daram_family_review:
    title: "I have / he-she has / I don't have"
    gloss: "I have / he-she has / I don't have"
    note: "*دارم*/*داره*, already taught back in unit04's family vocabulary, work the same way with a pet. *ندارم* (I don't have) and *نداره* (he/she doesn't have) are the matching negative forms -- both already used together in unit04's own family dialogue."
  fa.a1.unit26.lesson01.teach.heyvan_word:
    title: Animal
    gloss: animal
    note: "*حیوان* means animal."
    example_gloss: "A cat is an animal."
  fa.a1.unit26.lesson01.teach.heyvane_khoonegi_phrase:
    title: Pet
    gloss: pet
    note: "*حیوان خونگی* literally means 'home animal' -- the standard way to say 'pet.'"
  fa.a1.unit26.lesson01.teach.sag_word:
    title: Dog
    gloss: dog
    note: "*سگ* means dog."
    example_gloss: "I have a dog."
  fa.a1.unit26.lesson01.teach.gorbe_word:
    title: Cat
    gloss: cat
    note: "*گربه* means cat."
    example_gloss: "He has a cat."

  fa.a1.unit26.lesson02.teach.parande_word:
    title: Bird
    gloss: bird
    note: "*پرنده* means bird."
    example_gloss: "She has a bird."
  fa.a1.unit26.lesson02.teach.mahi_word:
    title: Fish
    gloss: fish
    note: "*ماهی* means fish."
    example_gloss: "I have a fish."
  fa.a1.unit26.lesson02.teach.dari_review:
    title: "You have"
    gloss: "you have"
    note: "*داری*, already taught back in unit14's *دوست داری؟*, reappears here in the same 2nd-person informal form."
  fa.a1.unit26.lesson02.teach.have_a_pet_question:
    title: "Do you have a pet?"
    gloss: "do you have a pet?"
    note: "*حیوان خونگی داری؟* combines unit01's *حیوان خونگی* with *داری* -- the natural way to ask someone if they have a pet."
  fa.a1.unit26.lesson02.teach.are_review:
    title: Yeah
    gloss: yeah
    note: "*آره*, already taught back in unit04, is the everyday colloquial word for 'yes.'"

  fa.a1.unit26.lesson03.teach.esm_review:
    title: Name
    gloss: name
    note: "*اسم*, already taught back in unit02 for people's names, works the same way for a pet's name."
  fa.a1.unit26.lesson03.teach.esmesh_chiye_phrase:
    title: "What's its name?"
    gloss: "what's its name?"
    note: "*اسمش چیه؟* combines the *-ش* possessive suffix (already seen on *قدش*/*موهاش* in unit25) with unit02's *چیه؟* -- 'what's his/her/its name?'"
  fa.a1.unit26.lesson03.teach.ghaza_word:
    title: Food
    gloss: food
    note: "*غذا*, already taught back in unit06 for ordering meals, is the same word used for pet food."
    example_gloss: "I like food."
  fa.a1.unit26.lesson03.teach.midam_word:
    title: "I give / feed"
    gloss: "I give / feed"
    note: "*می‌دم* (literally 'I give'), already glimpsed in unit24's *گوش می‌دم*, is the natural verb for feeding a pet when paired with *غذا*."
  fa.a1.unit26.lesson03.teach.sagam_word:
    title: My dog
    gloss: my dog
    note: "*سگم* combines *سگ* with the *-م* possessive suffix -- 'my dog,' the same fused pattern as unit02's *اسمم*."
  fa.a1.unit26.lesson03.teach.feed_my_dog_phrase:
    title: "I feed my dog."
    gloss: "I feed my dog."
    note: "*سگم رو غذا می‌دم* uses *رو* (the object marker, already seen in unit14's *قهوه رو بیشتر دوست دارم*) to mark *سگم* as the thing being fed."

  fa.a1.unit26.lesson04.teach.che_rangiye_review:
    title: "What color is it?"
    gloss: "what color is it?"
    note: "*چه رنگیه؟*, already taught back in unit25 for eye color, works the same way for describing a pet's color."
  fa.a1.unit26.lesson04.teach.sefid_word:
    title: White
    gloss: white
    note: "*سفید*, already taught back in unit20 for clothing, reappears here for a pet's color. *گربه‌ی* is the ezafe form of *گربه* used before a possessor, as in *گربه‌ی من* (my cat) -- the same pattern as unit19's *خونه‌ی من*, used for vowel-final nouns instead of a fused suffix."
    example_gloss: "My cat is white."
  fa.a1.unit26.lesson04.teach.koochik_word:
    title: Small
    gloss: small
    note: "*کوچیک*, already taught back in unit19 for describing a home, reappears here for a pet's size."
    example_gloss: "My fish is small."
  fa.a1.unit26.lesson04.teach.bozorg_word:
    title: Big
    gloss: big
    note: "*بزرگ*, already taught back in unit19, reappears here for a pet's size."
    example_gloss: "My dog is big."

  fa.a1.unit26.lesson05.teach.sara_review:
    title: Sara
    gloss: Sara
    note: "*سارا*, established as a character back in unit02, reappears here."
    example_gloss: "Sara has a cat."
  fa.a1.unit26.lesson05.teach.yek_review:
    title: "One / a"
    gloss: "one / a"
    note: "*یک*, already taught back in unit03's numbers, is used here as the indefinite article 'a.'"
  fa.a1.unit26.lesson05.teach.va_review:
    title: And
    gloss: and
    note: "*و* means 'and' -- already used this way back in unit14/unit24/unit25."
  fa.a1.unit26.lesson05.teach.pashmak_name:
    title: Pashmak
    gloss: Pashmak
    note: "*پشمک* (literally 'cotton candy') is a common real pet name in Iran -- Sara's cat's name."
    example_gloss: "Sara's cat's name is Pashmak."
  fa.a1.unit26.lesson05.teach.har_rooz_review:
    title: Every day
    gloss: every day
    note: "*هر روز*, already taught back in unit11 for daily routines, works the same way here for feeding a pet."
  fa.a1.unit26.lesson05.teach.mide_word:
    title: "He/she gives / feeds"
    gloss: "he/she gives / feeds"
    note: "*می‌ده* is the 3rd-person colloquial form of the same verb as lesson03's *می‌دم* (I give/feed)."
  fa.a1.unit26.lesson05.teach.reading_text:
    title: "Reading: Sara's cat"
    gloss: "Sara has a cat. Her name is Pashmak. Pashmak is white and small. Sara feeds Pashmak every day."
    note: "This reading reuses every construction from lessons 1-4 -- almost no new vocabulary, just recognizing it in connected text."

  fa.a1.unit26.lesson06.teach.in_word:
    title: This
    gloss: this
    note: "*این* means 'this.'"
  fa.a1.unit26.lesson06.teach.kiye_review:
    title: "Whose is it?"
    gloss: "whose is it?"
    note: "*کیه*, already taught back in unit04, is used here to ask whose pet something is."
  fa.a1.unit26.lesson06.teach.mane_word:
    title: "It's mine"
    gloss: "it's mine"
    note: "*منه* is the colloquial contraction of *من است* -- 'it is mine.' *گربه‌ی منه* means 'it's my cat.'"
  fa.a1.unit26.lesson06.teach.sagame_word:
    title: "It's my dog"
    gloss: "it's my dog"
    note: "*سگمه* combines lesson03's *سگم* (my dog) with the same *-ه* 'is' ending as *منه* -- 'it's my dog.'"
  fa.a1.unit26.lesson06.teach.khoshgel_word:
    title: Cute
    gloss: cute
    note: "*خوشگل* means cute or pretty. *خیلی*, already taught back in unit06, means 'very.'"
    example_gloss: "Sara's cat is very cute."
  fa.a1.unit26.lesson06.teach.mamnoon_review:
    title: Thanks
    gloss: thanks
    note: "*ممنون*, already taught back in unit06/unit20, reappears here as a natural closing line."
  fa.a1.unit26.lesson06.teach.dialogue_line1:
    title: "Nima: Whose cat is this?"
    gloss: "Whose cat is this?"
  fa.a1.unit26.lesson06.teach.dialogue_line2:
    title: "Sara: It's my cat. Her name is Pashmak."
    gloss: "It's my cat. Her name is Pashmak."
  fa.a1.unit26.lesson06.teach.dialogue_line3:
    title: "Nima: What color is it?"
    gloss: "What color is it?"
  fa.a1.unit26.lesson06.teach.dialogue_line4:
    title: "Sara: White and small."
    gloss: "White and small."
  fa.a1.unit26.lesson06.teach.dialogue_line5:
    title: "Nima: Very cute!"
    gloss: "Very cute!"
  fa.a1.unit26.lesson06.teach.dialogue_line6:
    title: "Sara: Thanks!"
    gloss: "Thanks!"

exercises:
  fa.a1.unit26.lesson01.exercise01.recognize_sag:
    instruction: "What does this word mean?"
    correct_option: dog
    distractors: [cat, animal, pet]
    accepted_answers: [{value: dog, status: correct}]
    feedback: "سگ means dog."
  fa.a1.unit26.lesson01.exercise02.recognize_gorbe:
    instruction: "What does this word mean?"
    correct_option: cat
    distractors: [dog, animal, pet]
    accepted_answers: [{value: cat, status: correct}]
    feedback: "گربه means cat."
  fa.a1.unit26.lesson01.exercise03.match_pets_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {حیوان: animal, "حیوان خونگی": pet, سگ: dog, گربه: cat, اسم: name, کوچیک: small, بزرگ: big}
        status: correct
    feedback: "These cover the basics of naming pets."
  fa.a1.unit26.lesson01.exercise04.word_order_i_have_a_dog:
    instruction: "Put the words in order."
    accepted_answers: [{value: [من, سگ, دارم], status: correct}]
    feedback: "من سگ دارم means 'I have a dog.'"
  fa.a1.unit26.lesson01.exercise05.translate_he_has_a_cat:
    instruction: "Translate into Farsi: He has a cat."
    accepted_answers:
      - {value: "او گربه داره", status: correct}
      - {value: "گربه داره", status: correct}
    feedback: "او گربه داره means 'He has a cat.'"

  fa.a1.unit26.lesson02.exercise01.recognize_parande:
    instruction: "What does this word mean?"
    correct_option: bird
    distractors: [fish, dog, cat]
    accepted_answers: [{value: bird, status: correct}]
    feedback: "پرنده means bird."
  fa.a1.unit26.lesson02.exercise02.recognize_mahi:
    instruction: "What does this word mean?"
    correct_option: fish
    distractors: [bird, dog, cat]
    accepted_answers: [{value: fish, status: correct}]
    feedback: "ماهی means fish."
  fa.a1.unit26.lesson02.exercise03.match_more_animals:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {"حیوان خونگی": pet, سگ: dog, گربه: cat, پرنده: bird, ماهی: fish, داری: "you have"}
        status: correct
    feedback: "This reviews the basic pet words alongside the new ones."
  fa.a1.unit26.lesson02.exercise04.word_order_she_has_a_bird:
    instruction: "Put the words in order."
    accepted_answers: [{value: [او, پرنده, داره], status: correct}]
    feedback: "او پرنده داره means 'She has a bird.'"
  fa.a1.unit26.lesson02.exercise05.translate_yes_i_have_a_fish:
    instruction: "Translate into Farsi: Yes, I have a fish."
    accepted_answers:
      - {value: "آره، من ماهی دارم", status: correct}
      - {value: "آره من ماهی دارم", status: correct}
    feedback: "آره، من ماهی دارم means 'Yes, I have a fish.'"

  fa.a1.unit26.lesson03.exercise01.recognize_esmesh_chiye:
    instruction: "What does this phrase mean?"
    correct_option: "What's its name?"
    distractors: ["Do you have a pet?", "What color is it?", "How old is it?"]
    accepted_answers: [{value: "What's its name?", status: correct}]
    feedback: "اسمش چیه؟ means 'What's its name?'"
  fa.a1.unit26.lesson03.exercise02.recognize_ghaza:
    instruction: "What does this word mean?"
    correct_option: food
    distractors: [name, pet, water]
    accepted_answers: [{value: food, status: correct}]
    feedback: "غذا means food."
  fa.a1.unit26.lesson03.exercise03.match_name_food_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"حیوان خونگی": pet, سگ: dog, گربه: cat, "اسمش چیه؟": "what's his/her/its name?", غذا: food, "می‌دم": "I give / feed", سگم: "my dog"}
        status: correct
    feedback: "These combine to build sentences about a pet's name and food."
  fa.a1.unit26.lesson03.exercise04.word_order_whats_its_name:
    instruction: "Put the words in order."
    accepted_answers: [{value: [اسمش, چیه], status: correct}]
    feedback: "اسمش چیه؟ means 'What's its name?'"
  fa.a1.unit26.lesson03.exercise05.translate_i_feed_my_dog:
    instruction: "Translate into Farsi: I feed my dog."
    accepted_answers:
      - {value: "سگم رو غذا می‌دم", status: correct}
    feedback: "سگم رو غذا می‌دم means 'I feed my dog.'"

  fa.a1.unit26.lesson04.exercise01.recognize_sefid:
    instruction: "What does this word mean?"
    correct_option: white
    distractors: [small, big, cute]
    accepted_answers: [{value: white, status: correct}]
    feedback: "سفید means white."
  fa.a1.unit26.lesson04.exercise02.recognize_koochik:
    instruction: "What does this word mean?"
    correct_option: small
    distractors: [big, white, cute]
    accepted_answers: [{value: small, status: correct}]
    feedback: "کوچیک means small."
  fa.a1.unit26.lesson04.exercise03.match_color_size_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {سگ: dog, گربه: cat, پرنده: bird, ماهی: fish, "چه رنگیه؟": "what color is it?", سفید: white, کوچیک: small, بزرگ: big}
        status: correct
    feedback: "This reviews the whole unit's animal words alongside color and size."
  fa.a1.unit26.lesson04.exercise04.word_order_my_cat_is_white:
    instruction: "Put the words in order."
    accepted_answers: [{value: ["گربه‌ی", من, سفیده], status: correct}]
    feedback: "گربه‌ی من سفیده means 'My cat is white.'"
  fa.a1.unit26.lesson04.exercise05.translate_my_dog_is_big:
    instruction: "Translate into Farsi: My dog is big."
    accepted_answers:
      - {value: "سگم بزرگه", status: correct}
    feedback: "سگم بزرگه means 'My dog is big.'"

  fa.a1.unit26.lesson05.exercise01.reading_comprehension_cat_color:
    instruction: "What color is Sara's cat?"
    correct_option: White
    distractors: [Black, Brown, Green]
    accepted_answers: [{value: White, status: correct}]
    feedback: "پشمک سفیده -- Pashmak is white."
  fa.a1.unit26.lesson05.exercise02.reading_comprehension_feeding_frequency:
    instruction: "How often does Sara feed Pashmak?"
    correct_option: "Every day"
    distractors: ["Once a week", "Never", "Twice a day"]
    accepted_answers: [{value: "Every day", status: correct}]
    feedback: "سارا هر روز پشمک رو غذا می‌ده -- Sara feeds Pashmak every day."
  fa.a1.unit26.lesson05.exercise03.match_reading_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {سگ: dog, گربه: cat, پرنده: bird, ماهی: fish, سفید: white, کوچیک: small, بزرگ: big, "هر روز": "every day"}
        status: correct
    feedback: "These words all appear in the reading passage."
  fa.a1.unit26.lesson05.exercise04.translate_sara_has_a_cat:
    instruction: "Translate into Farsi: Sara has a cat."
    accepted_answers:
      - {value: "سارا یک گربه داره", status: correct}
    feedback: "سارا یک گربه داره means 'Sara has a cat.'"
  fa.a1.unit26.lesson05.exercise05.write_own_pet:
    instruction: "Write a true sentence about a pet you have (or don't have)."
    accepted_answers:
      - {value: "من سگ دارم", status: correct}
      - {value: "من گربه دارم", status: correct}
      - {value: "من ماهی دارم", status: correct}
      - {value: "من پرنده دارم", status: correct}
      - {value: "من حیوان خونگی ندارم", status: correct}
    feedback: "Any true statement using a taught animal word is accepted."

  fa.a1.unit26.lesson06.exercise01.dialogue_comprehension_context:
    instruction: "What happened in this conversation?"
    correct_option: "Sara's cat Pashmak is white, small, and cute."
    distractors:
      - "Sara's cat is black and big."
      - "Nima already has a cat named Pashmak."
      - "Sara doesn't have any pets."
    accepted_answers: [{value: "Sara's cat Pashmak is white, small, and cute.", status: correct}]
    feedback: "سفیده و کوچیکه، خیلی خوشگله -- Pashmak is white, small, and very cute."
  fa.a1.unit26.lesson06.exercise02.match_dialogue_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {سگ: dog, گربه: cat, پرنده: bird, ماهی: fish, سفید: white, کوچیک: small, بزرگ: big, خوشگل: cute}
        status: correct
    feedback: "This reviews the whole unit's key vocabulary."
  fa.a1.unit26.lesson06.exercise03.reading_comprehension_cat_color:
    instruction: "What color is Sara's cat?"
    correct_option: White
    distractors: [Black, Brown, Blond]
    accepted_answers: [{value: White, status: correct}]
    feedback: "سفیده -- it's white."
  fa.a1.unit26.lesson06.exercise04.dialogue_response_whose_dog:
    instruction: "Respond to این حیوان خونگی کیه؟ by saying it's your dog."
    accepted_answers:
      - {value: سگمه, status: correct}
      - {value: "این سگمه", status: correct}
    feedback: "سگمه means 'it's my dog.'"
  fa.a1.unit26.lesson06.exercise05.write_pet_color:
    instruction: "Write a true sentence describing a pet's color (yours or an animal you like)."
    accepted_answers:
      - {value: "سگم سفیده", status: correct}
      - {value: "سگم سیاهه", status: correct}
      - {value: "گربه‌ی من قهوه‌ایه", status: correct}
      - {value: "ماهی من آبیه", status: correct}
      - {value: "پرنده‌ی من سبزه", status: correct}
    feedback: "Any true statement using a taught color is accepted."
