course:
  title: Farsi B2
  description: Adapt the same request across friend, colleague, and institution registers.
units:
  fa.b2.unit05.register:
    title: Register
    description: Adapt the same request across friend, colleague, and institution registers.
lessons:
  fa.b2.unit05.register.lesson01.informal:
    title: Informal request
  fa.b2.unit05.register.lesson02.colleague:
    title: Collegial register
  fa.b2.unit05.register.lesson03.formal:
    title: Formal institutional request
teaching:
  fa.b2.unit05.register.lesson01.informal.teach.card01:
    title: Raha
    gloss: Raha
    note: 'A first name needs no article or title. At work you would add *خانم* or *آقا* before it; between friends the bare name is normal.'
    example_gloss: Raha is coming earlier today.
  fa.b2.unit05.register.lesson01.informal.teach.card02:
    title: can you
    gloss: can you
    note: 'Spoken form of written *می‌توانی*. Fine with friends and in messages, but use *می‌توانید* in formal writing. The main verb stays subjunctive: *صبر کنی*.'
    example_gloss: Can you wait one minute?
  fa.b2.unit05.register.lesson01.informal.teach.card03:
    title: our appointment
    gloss: our appointment
    note: 'The clitic *-مان* (our) attaches directly to *قرار*. *سر جایش است* is an idiom for a plan that still holds, not a literal location.'
    example_gloss: Our appointment still stands.
  fa.b2.unit05.register.lesson01.informal.teach.card04:
    title: move back / postpone
    gloss: move back / postpone
    note: '*عقب انداختن* is a compound verb, so the thing postponed takes *را*. Here it follows *می‌تونی* in the subjunctive. The formal equivalent is *به تعویق انداختن*.'
    example_gloss: Can you move the call back a little?
  fa.b2.unit05.register.lesson01.informal.teach.card05:
    title: informal / familiar
    gloss: informal / familiar
    note: 'A colloquial-leaning word built on *خود*; it describes relaxed, familiar speech or writing. Pair it with *زیادی* to say something is too casual for the setting.'
    example_gloss: This message is too informal for the office.
  fa.b2.unit05.register.lesson01.informal.teach.card06:
    title: if it is possible for you
    gloss: if it is possible for you
    note: 'Spoken for written *اگر برایت ممکن است*. The *-ت* clitic (you) merges with *برا* into *برات*. Use it with friends only; it would sound too casual in an email.'
    example_gloss: If it works for you, let me know as soon as you can.
  fa.b2.unit05.register.lesson01.informal.teach.card07:
    title: friend
    gloss: friend
    note: 'Means a friend, not just an acquaintance. Add *نزدیک* to stress closeness. *با* is the usual preposition for talking with someone: *با دوست حرف زدن*.'
    example_gloss: We speak more comfortably with a close friend.
  fa.b2.unit05.register.lesson01.informal.teach.card08:
    title: one hour
    gloss: one hour
    note: '*یه* is the spoken form of *یک*. After a number, Persian nouns stay singular, so *ساعت* is not plural here, unlike English "hours".'
    example_gloss: I will arrive one hour later.
  fa.b2.unit05.register.lesson01.informal.teach.card09:
    title: please
    gloss: please
    note: 'Written *لطفا* is said "lotfan". It softens a request but does not make an imperative fully polite; with colleagues, pair it with a polite verb form.'
    example_gloss: Please see my message.
  fa.b2.unit05.register.lesson01.informal.teach.grammar:
    title: Register grammar
    gloss: Register grammar
    note: '*تو* and *می‌تونی* are appropriate with a close friend. English speakers should not use this form with an office or institution.'
  fa.b2.unit05.register.lesson02.colleague.teach.card01:
    title: is it possible
    gloss: is it possible
    note: 'A polite, neutral way to ask. The clitic *-ش* points to the request itself. The polite plural *بفرستید* is subjunctive, matching English "to send".'
    example_gloss: Is it possible to send the report today?
  fa.b2.unit05.register.lesson02.colleague.teach.card02:
    title: colleague
    gloss: colleague
    note: 'Means a coworker, not a classmate (that is *همکلاسی*). The clitic *-م* (my) attaches directly, and *محترمانه‌ای* uses *-ای* for an indefinite "a respectful response".'
    example_gloss: My colleague wrote a respectful response.
  fa.b2.unit05.register.lesson02.colleague.teach.card03:
    title: if it suits you
    gloss: if it suits you
    note: 'A formal conditional using *شما*. It keeps the conditional clause with the present *است*, then continues with a subjunctive *بگیریم* ("let us call").'
    example_gloss: If it suits you, let’s call at three.
  fa.b2.unit05.register.lesson02.colleague.teach.card04:
    title: respectful
    gloss: respectful
    note: 'An adjective built from *محترم* plus *-انه*; the same pattern gives *دوستانه* and *صمیمانه*. Here it describes the tone, linked to *لحن* by ezafe.'
    example_gloss: A respectful tone makes cooperation easier.
  fa.b2.unit05.register.lesson02.colleague.teach.card05:
    title: move the meeting
    gloss: move the meeting
    note: '*می‌شود* asks if something is possible, not "becomes"; the spoken form is *می‌شه*. *جلسه* takes *را*, and *کنیم* is subjunctive, like "shall we".'
    example_gloss: Can we move the meeting?
  fa.b2.unit05.register.lesson02.colleague.teach.card06:
    title: suitable
    gloss: suitable
    note: 'Takes *برای* for the person it suits: *برای همه مناسب*. For the negative, place *نیست* after the adjective, as in the example.'
    example_gloss: This time is not suitable for everyone.
  fa.b2.unit05.register.lesson02.colleague.teach.card07:
    title: instead of an order
    gloss: instead of an order
    note: '*به جای* links to the following noun with ezafe: *به جایِ دستور*. A polite plural imperative like *بنویسید* fits a request that is clear but still respectful.'
    example_gloss: Instead of an order, write a clear request.
  fa.b2.unit05.register.lesson02.colleague.teach.card08:
    title: tone
    gloss: tone
    note: '*لحن* often appears with ezafe: *لحن پیام*, *لحن صدا*. It names how something is said, not what it says.'
    example_gloss: The tone of the message is neither cold nor informal.
  fa.b2.unit05.register.lesson02.colleague.teach.card09:
    title: I appreciate it
    gloss: I appreciate it
    note: 'A formal thank-you, more written than *ممنونم*. *از* introduces what you are thankful for, so *از پیگیری شما* means "for your follow-up".'
    example_gloss: I appreciate your follow-up.
  fa.b2.unit05.register.lesson02.colleague.teach.grammar:
    title: Register grammar
    gloss: Register grammar
    note: With colleagues, *می‌شود* or *امکانش هست* is often safer than bare *می‌تونی*. It is polite without sounding bureaucratic.
  fa.b2.unit05.register.lesson03.formal.teach.card01:
    title: would it be possible
    gloss: would it be possible
    note: '*آیا* marks a formal yes/no question and is usually dropped in speech. *امکان داشتن* is the standard way to say "to be possible", followed by a subjunctive.'
    example_gloss: Would it be possible to submit the documents tomorrow?
  fa.b2.unit05.register.lesson03.formal.teach.card02:
    title: appointment time
    gloss: appointment time
    note: 'Here *وقت* means an appointment slot, not generic "time". The phrase is typical of clinics, offices and booking systems.'
    example_gloss: The appointment time is registered in the system.
  fa.b2.unit05.register.lesson03.formal.teach.card03:
    title: postpone
    gloss: postpone
    note: '*به تعویق انداختن* is the formal, written way to say "postpone". The *ن-* before *بیندازید* makes the polite imperative negative.'
    example_gloss: Please do not postpone reviewing the file.
  fa.b2.unit05.register.lesson03.formal.teach.card04:
    title: formal
    gloss: formal
    note: 'Add *-تر* for a comparative, as in *رسمی‌تر*. It also means "official". A formal text uses *رسمی*; casual speech uses *خودمانی*.'
    example_gloss: This text is more formal for the office.
  fa.b2.unit05.register.lesson03.formal.teach.card05:
    title: I respectfully request
    gloss: I respectfully request
    note: 'A very formal request, found in letters and official emails. It is followed by a polite imperative and is not used in conversation.'
    example_gloss: I respectfully request that you announce the new time.
  fa.b2.unit05.register.lesson03.formal.teach.card06:
    title: documents
    gloss: documents
    note: 'Used for official papers such as forms or records. It takes *را* when definite, and the plural noun can take a singular verb *نیست*.'
    example_gloss: The documents are not complete yet.
  fa.b2.unit05.register.lesson03.formal.teach.card07:
    title: if possible
    gloss: if possible
    note: 'A fixed written phrase. *در صورت* links to the following noun with ezafe (*در صورتِ امکان*), like English "in case of".'
    example_gloss: If possible, email the response.
  fa.b2.unit05.register.lesson03.formal.teach.card08:
    title: office / administration
    gloss: office / administration
    note: 'Means an office or government department, not just a room. Its associations are bureaucratic, so *دفتر* is more neutral for a small office.'
    example_gloss: The office is busy today.
  fa.b2.unit05.register.lesson03.formal.teach.card09:
    title: respectfully
    gloss: respectfully
    note: 'A formal opening or closing in letters. *با* plus an abstract noun makes an adverbial phrase, like English "with respect".'
    example_gloss: Respectfully, I am sending my request again.
  fa.b2.unit05.register.lesson03.formal.teach.grammar:
    title: Register grammar
    gloss: Register grammar
    note: '*شما* and *بیندازید* signal formal address. For institutions, *آیا امکان دارد* and *خواهشمندم* are appropriate; avoid *تو* forms.'
