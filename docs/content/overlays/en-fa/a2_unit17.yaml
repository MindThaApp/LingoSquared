course:
  title: Farsi A2
  description: >-
    Lower-intermediate Iranian Farsi: describing a typical week, sequencing
    activities with اول/بعد/در آخر, and contrasting weekdays with the
    real Iranian شنبه-چهارشنبه work-week and پنجشنبه/جمعه weekend.

units:
  fa.a2.unit17.weekly_schedule:
    title: Weekly schedule

lessons:
  fa.a2.unit17.lesson01.weekly_schedule_vocabulary: {title: "Weekly schedule words"}
  fa.a2.unit17.lesson02.sequencing_your_week: {title: "Sequencing your week"}
  fa.a2.unit17.lesson03.reading_a_weekly_schedule: {title: "Reading a weekly schedule"}
  fa.a2.unit17.lesson04.weekly_schedule_conversation: {title: "Talking about your week"}

teaching:
  fa.a2.unit17.lesson01.teach.week_word:
    title: "Week"
    gloss: "week"
    note: "*هفته* is the general word for a week."
    example_gloss: "This week is very busy."
  fa.a2.unit17.lesson01.teach.weekend_word:
    title: "Weekend"
    gloss: "weekend"
    note: "*آخر هفته* literally means 'end of the week' -- in Iran this is پنجشنبه/جمعه (Thursday/Friday), not Saturday/Sunday."
    example_gloss: "I don't work on the weekend."
  fa.a2.unit17.lesson01.teach.rest_word:
    title: "Rest"
    gloss: "rest"
    note: "*استراحت کردن* (to rest) is a light-verb construction, like *باز کردن* from the earlier banking unit."
    example_gloss: "I rest on Fridays."
  fa.a2.unit17.lesson01.teach.first_word:
    title: "First"
    gloss: "first"
    note: "*اول* opens a sequence of activities."
    example_gloss: "First I eat breakfast."
  fa.a2.unit17.lesson01.teach.then_word:
    title: "Then"
    gloss: "then"
    note: "*بعد* continues a sequence; *بعدش* (then/after that) is its common colloquial follow-up form."
    example_gloss: "Then I go to work."
  fa.a2.unit17.lesson01.teach.finally_word:
    title: "Finally"
    gloss: "finally / at the end"
    note: "*در آخر* closes a sequence of activities."
    example_gloss: "Finally I rest."
  fa.a2.unit17.lesson01.teach.recap_weekdays:
    title: "Days of the week"
    gloss: "Saturday, Sunday, Monday, Tuesday, Wednesday, Thursday, Friday"
    note: "Recap of the weekday names from the earlier dates unit, reused here for a weekly schedule."

  fa.a2.unit17.lesson02.teach.until_word:
    title: "Until / to (a day range)"
    gloss: "until / to"
    note: "*تا* links two days into a range, e.g. *شنبه تا چهارشنبه* (Saturday to Wednesday)."
  fa.a2.unit17.lesson02.teach.work_days_sentence:
    title: "State your work days as a range"
    gloss: "I work Saturday to Wednesday."
    note: "This is the real Iranian work-week, not the Western Monday-Friday pattern."
  fa.a2.unit17.lesson02.teach.thursdays_habitual_note:
    title: "The habitual -ها suffix on a day name"
    gloss: "on Thursdays (every week)"
    note: "*پنجشنبه‌ها* (Thursday + -ها) means 'on Thursdays' as a repeating habit, not one specific Thursday."
  fa.a2.unit17.lesson02.teach.during_vs_weekend_sentence:
    title: "Contrast the week with the weekend"
    gloss: "During the week I work, but on the weekend I rest."
    note: "*در طول هفته* (during the week) contrasts with *آخر هفته* (the weekend), joined by *ولی* (but)."

  fa.a2.unit17.lesson03.teach.clean_word:
    title: "To clean"
    gloss: "to clean"
    note: "*تمیز کردن* is another light-verb construction: *تمیز* (clean) + *کردن* (to do)."
    example_gloss: "On Thursdays I clean the house."
  fa.a2.unit17.lesson03.teach.schedule_note_text:
    title: "سارا's written weekly schedule"
    gloss: "My weekly schedule: I work Saturday to Wednesday. On Thursdays I go shopping and clean the house. On Fridays, the weekend, I see my friends and rest."
    note: "A short written weekly-planner note, the written register this lesson is teaching."

  fa.a2.unit17.lesson04.teach.good_week_phrase:
    title: "You have a good week!"
    gloss: "You have a good week!"
    note: "A friendly closing remark after hearing someone's weekly schedule."
  fa.a2.unit17.lesson04.teach.turn01:
    title: "نیما asks about سارا's week"
    gloss: "نیما asks سارا how her week is, and what her schedule is."
    note: "*چطوره* and *چیه* are the established colloquial contracted forms of 'is how' and 'is what'."
  fa.a2.unit17.lesson04.teach.turn02:
    title: "سارا starts with her work days"
    gloss: "سارا says first, she goes to work Saturday to Wednesday."
    note: "*سر کار می‌رم* (I go to work) reuses the established 'go to work' phrase."
  fa.a2.unit17.lesson04.teach.turn03:
    title: "نیما asks what's next"
    gloss: "نیما asks: then what?"
    note: "*بعدش چی؟* is a short, natural way to ask what comes next."
  fa.a2.unit17.lesson04.teach.turn04:
    title: "سارا describes Thursdays"
    gloss: "سارا says then, on Thursdays she shops and cleans the house."
    note: "Reuses lesson03's own Thursday sentence."
  fa.a2.unit17.lesson04.teach.turn05:
    title: "سارا describes Fridays"
    gloss: "سارا says finally, on Fridays she rests and sees her friends."
    note: "Closes the sequence with *در آخر* (finally)."
  fa.a2.unit17.lesson04.teach.turn06:
    title: "نیما closes the conversation"
    gloss: "نیما says: you have a good week!"
    note: "Reuses this lesson's own closing phrase."

exercises:
  fa.a2.unit17.lesson01.exercise01.recognize_week:
    instruction: "What does this word mean?"
    correct_option: "week"
    distractors: ["weekend", "rest", "first"]
    accepted_answers: [{value: "week", status: correct}]
    feedback: "*هفته* means week."
  fa.a2.unit17.lesson01.exercise02.recognize_weekend:
    instruction: "What does this phrase mean?"
    correct_option: "weekend"
    distractors: ["week", "then", "finally"]
    accepted_answers: [{value: "weekend", status: correct}]
    feedback: "*آخر هفته* means weekend."
  fa.a2.unit17.lesson01.exercise03.match_schedule_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {هفته: week, "آخر هفته": weekend, استراحت: rest, اول: first, بعد: then, "در آخر": finally}, status: correct}
    feedback: "These six words cover this unit's basic weekly-schedule vocabulary."
  fa.a2.unit17.lesson01.exercise04.order_i_rest_on_fridays:
    instruction: "Arrange the words to say: I rest on Fridays."
    accepted_answers: [{value: ["جمعه‌ها", استراحت, "می‌کنم"], status: correct}]
    feedback: "*جمعه‌ها استراحت می‌کنم.* says you rest on Fridays."
  fa.a2.unit17.lesson01.exercise05.write_weekend:
    instruction: "Write the Farsi word for weekend."
    accepted_answers:
      - {value: "آخر هفته", status: correct}
    feedback: "*آخر هفته* means weekend."

  fa.a2.unit17.lesson02.exercise01.recognize_work_days_sentence:
    instruction: "Which sentence states a range of work days?"
    correct_option: "I work Saturday to Wednesday."
    distractors: ["I rest on Fridays.", "This week is very busy.", "I don't work on the weekend."]
    accepted_answers: [{value: "I work Saturday to Wednesday.", status: correct}]
    feedback: "*شنبه تا چهارشنبه کار می‌کنم.* states a day range with *تا*."
  fa.a2.unit17.lesson02.exercise02.order_during_vs_weekend:
    instruction: "Arrange the words to say: during the week I work, but on the weekend I rest."
    accepted_answers: [{value: ["در طول هفته", کار, "می‌کنم", ولی, "آخر هفته", استراحت, "می‌کنم"], status: correct}]
    feedback: "*در طول هفته کار می‌کنم، ولی آخر هفته استراحت می‌کنم.* contrasts the week and the weekend."
  fa.a2.unit17.lesson02.exercise03.dialogue_response_when_do_you_work:
    instruction: "Someone asks: 'Which days do you work?' Answer that you work Saturday to Wednesday."
    accepted_answers:
      - {value: "شنبه تا چهارشنبه کار می‌کنم.", status: correct}
      - {value: "شنبه تا چهارشنبه کار می‌کنم", status: correct}
    feedback: "*شنبه تا چهارشنبه کار می‌کنم.* states your work days."
  fa.a2.unit17.lesson02.exercise04.translate_during_vs_weekend:
    instruction: "Translate into Farsi: during the week I work, but on the weekend I rest."
    accepted_answers:
      - {value: "در طول هفته کار می‌کنم، ولی آخر هفته استراحت می‌کنم.", status: correct}
      - {value: "در طول هفته کار می‌کنم ولی آخر هفته استراحت می‌کنم.", status: correct}
    feedback: "*در طول هفته کار می‌کنم، ولی آخر هفته استراحت می‌کنم.* is the accepted translation."
  fa.a2.unit17.lesson02.exercise05.write_work_days:
    instruction: "Write that you work Saturday to Wednesday."
    accepted_answers:
      - {value: "شنبه تا چهارشنبه کار می‌کنم.", status: correct}
      - {value: "شنبه تا چهارشنبه کار می‌کنم", status: correct}
    feedback: "*شنبه تا چهارشنبه کار می‌کنم.* states your work days."

  fa.a2.unit17.lesson03.exercise01.read_thursday_activities:
    instruction: "According to the schedule, what does سارا do on Thursdays?"
    correct_option: "She goes shopping and cleans the house."
    distractors: ["She rests all day.", "She goes to work.", "She sees her friends."]
    accepted_answers: [{value: "She goes shopping and cleans the house.", status: correct}]
    feedback: "*پنجشنبه‌ها خرید می‌کنم و خونه رو تمیز می‌کنم* -- she shops and cleans the house."
  fa.a2.unit17.lesson03.exercise02.read_friday_activities:
    instruction: "According to the schedule, what does سارا do on Fridays?"
    correct_option: "She sees her friends and rests."
    distractors: ["She goes to work.", "She cleans the house.", "She goes shopping."]
    accepted_answers: [{value: "She sees her friends and rests.", status: correct}]
    feedback: "*جمعه‌ها، آخر هفته، دوستامو می‌بینم و استراحت می‌کنم* -- she sees her friends and rests."
  fa.a2.unit17.lesson03.exercise03.recognize_clean:
    instruction: "What does this phrase mean?"
    correct_option: "to clean"
    distractors: ["to rest", "to shop", "to work"]
    accepted_answers: [{value: "to clean", status: correct}]
    feedback: "*تمیز کردن* means to clean."
  fa.a2.unit17.lesson03.exercise04.order_thursday_sentence:
    instruction: "Arrange the words to say: on Thursdays I go shopping and clean the house."
    accepted_answers: [{value: ["پنجشنبه‌ها", خرید, "می‌کنم", و, خونه, رو, تمیز, "می‌کنم"], status: correct}]
    feedback: "*پنجشنبه‌ها خرید می‌کنم و خونه رو تمیز می‌کنم.* describes her Thursday activities."
  fa.a2.unit17.lesson03.exercise05.write_thursday_sentence:
    instruction: "Write that you go shopping on Thursdays."
    accepted_answers:
      - {value: "پنجشنبه‌ها خرید می‌کنم.", status: correct}
      - {value: "پنجشنبه‌ها خرید می‌کنم", status: correct}
    feedback: "*پنجشنبه‌ها خرید می‌کنم.* states a repeating Thursday habit."

  fa.a2.unit17.lesson04.exercise01.comprehend_work_days:
    instruction: "What does سارا do first in her week?"
    correct_option: "She goes to work Saturday to Wednesday."
    distractors: ["She rests all week.", "She goes shopping.", "She sees her friends."]
    accepted_answers: [{value: "She goes to work Saturday to Wednesday.", status: correct}]
    feedback: "*اول، شنبه تا چهارشنبه سر کار می‌رم* -- first, she goes to work Saturday to Wednesday."
  fa.a2.unit17.lesson04.exercise02.comprehend_friday_activities:
    instruction: "What does سارا finally do on Fridays?"
    correct_option: "She rests and sees her friends."
    distractors: ["She goes to work.", "She cleans the house.", "She goes shopping."]
    accepted_answers: [{value: "She rests and sees her friends.", status: correct}]
    feedback: "*در آخر، جمعه‌ها استراحت می‌کنم و دوستامو می‌بینم* -- finally, on Fridays she rests and sees her friends."
  fa.a2.unit17.lesson04.exercise03.recognize_good_week_phrase:
    instruction: "What does this phrase mean?"
    correct_option: "You have a good week!"
    distractors: ["What's your schedule?", "I work Saturday to Wednesday.", "Then what?"]
    accepted_answers: [{value: "You have a good week!", status: correct}]
    feedback: "*هفته‌ی خوبی داری!* means 'you have a good week!'"
  fa.a2.unit17.lesson04.exercise04.order_first_work_days:
    instruction: "Arrange the words to say: first, I go to work Saturday to Wednesday."
    accepted_answers: [{value: [اول, شنبه, تا, چهارشنبه, "سر کار", "می‌رم"], status: correct}]
    feedback: "*اول، شنبه تا چهارشنبه سر کار می‌رم.* opens the weekly account with *اول*."
  fa.a2.unit17.lesson04.exercise05.dialogue_response_describe_full_week:
    instruction: "Someone asks: 'How's your week? What's your schedule?' Describe your full week: first you work Saturday to Wednesday, then on Thursdays you shop and clean the house, finally on Fridays you rest and see your friends."
    accepted_answers:
      - {value: "اول، شنبه تا چهارشنبه سر کار می‌رم. بعد، پنجشنبه‌ها خرید می‌کنم و خونه رو تمیز می‌کنم. در آخر، جمعه‌ها استراحت می‌کنم و دوستامو می‌بینم.", status: correct}
      - {value: "اول شنبه تا چهارشنبه سر کار می‌رم، بعد پنجشنبه‌ها خرید می‌کنم و خونه رو تمیز می‌کنم، در آخر جمعه‌ها استراحت می‌کنم و دوستامو می‌بینم.", status: correct}
    feedback: "The three-part اول/بعد/در آخر sequence describes the full week, day by day."
  fa.a2.unit17.lesson04.exercise06.write_full_week_summary:
    instruction: "Write that سارا works Saturday to Wednesday."
    accepted_answers:
      - {value: "سارا شنبه تا چهارشنبه کار می‌کند.", status: correct}
      - {value: "سارا شنبه تا چهارشنبه کار می‌کند", status: correct}
      - {value: "سارا شنبه تا چهارشنبه کار می‌کنه.", status: correct}
      - {value: "سارا شنبه تا چهارشنبه کار می‌کنه", status: correct}
    feedback: "*سارا شنبه تا چهارشنبه کار می‌کند.* summarizes her work days in the written third-person register; the colloquial *می‌کنه* is equally correct."
