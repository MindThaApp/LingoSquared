course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: describing a person's height (tall/short),
    hair (length and color: black, blond), eye color (brown, green,
    blue), and whether they wear glasses, asking "What does he/she look
    like?", a short reading passage about نیما's own appearance, and a
    closing dialogue between نیما and سارا about recognizing سارا's
    friend مریم.

units:
  fa.a1.unit25.appearance:
    title: Appearance

lessons:
  fa.a1.unit25.lesson01.height: {title: "Tall and short"}
  fa.a1.unit25.lesson02.hair: {title: "Black and blond hair"}
  fa.a1.unit25.lesson03.eyes: {title: "Eye color"}
  fa.a1.unit25.lesson04.what_does_he_look_like: {title: "What does he look like?"}
  fa.a1.unit25.lesson05.reading_about_nima: {title: "Reading about Nima's appearance"}
  fa.a1.unit25.lesson06.new_friend_dialogue: {title: "Dialogue: a new friend"}

teaching:
  fa.a1.unit25.lesson01.teach.oo_review:
    title: "He / she"
    gloss: "he / she"
    note: "*او*, already taught back in unit02, reappears here as the subject of appearance descriptions."
  fa.a1.unit25.lesson01.teach.ghad_review:
    title: Height
    gloss: height
    note: "*قد*, already taught in unit15's comparative *قد بلند‌تره* (taller), reappears here on its own. *قدش* adds the *-ش* possessive suffix (his/her height), the same pattern as unit20's *امتحانش*."
    example_gloss: "Nima is tall."
  fa.a1.unit25.lesson01.teach.boland_word:
    title: Tall
    gloss: tall
    note: "*بلند* means tall (or long). *قدش بلنده* literally means 'his/her height is tall' -- the natural colloquial way to say someone is tall."
    example_gloss: "His height is tall."
  fa.a1.unit25.lesson01.teach.kotah_word:
    title: Short
    gloss: short
    note: "*کوتاه* means short."
    example_gloss: "His height is short."

  fa.a1.unit25.lesson02.teach.mo_word:
    title: Hair
    gloss: hair
    note: "*مو* means hair. *موی* is the ezafe (connecting) form used before an adjective, as in *موی بلند* (long hair)."
    example_gloss: "He has long hair."
  fa.a1.unit25.lesson02.teach.moohash_word:
    title: "His / her hair"
    gloss: "his / her hair"
    note: "*موهاش* combines the plural *موها* (hairs) with the *-ش* possessive suffix -- 'his/her hair.'"
  fa.a1.unit25.lesson02.teach.meshki_word:
    title: Black
    gloss: black
    note: "*مشکی* is the everyday colloquial word for black hair/eyes -- more natural here than unit20's *سیاه*, which fits clothing better than hair."
    example_gloss: "Her hair is black."
  fa.a1.unit25.lesson02.teach.bolond_word:
    title: Blond
    gloss: blond
    note: "*بلوند* (a loanword) means blond."
    example_gloss: "Her hair is blond."

  fa.a1.unit25.lesson03.teach.cheshm_word:
    title: Eye
    gloss: eye
    note: "*چشم* means eye. *چشمای* is the colloquial plural + ezafe form (eyes of...), as in *چشمای آبی* (blue eyes)."
    example_gloss: "He has brown eyes."
  fa.a1.unit25.lesson03.teach.cheshmash_word:
    title: "His / her eyes"
    gloss: "his / her eyes"
    note: "*چشماش* combines the colloquial plural *چشما* with the *-ش* possessive suffix -- 'his/her eyes.' Note *چشماش آبیه* uses the SINGULAR copula *-ه* even though *چشما* is plural -- correct in Persian, since inanimate plural subjects take singular verb agreement."
  fa.a1.unit25.lesson03.teach.ghahveei_word:
    title: Brown
    gloss: brown
    note: "*قهوه‌ای* (literally 'coffee-colored') means brown."
    example_gloss: "Her eyes are brown."
  fa.a1.unit25.lesson03.teach.sabz_word:
    title: Green
    gloss: green
    note: "*سبز* means green."
    example_gloss: "Her eyes are green."
  fa.a1.unit25.lesson03.teach.abi_review:
    title: Blue
    gloss: blue
    note: "*آبی*, already taught back in unit20 for clothing, reappears here for eye color."
    example_gloss: "Her eyes are blue."

  fa.a1.unit25.lesson04.teach.man_review:
    title: I
    gloss: I
    note: "*من*, already well established, reappears here for self-description."
    example_gloss: "I have brown hair."
  fa.a1.unit25.lesson04.teach.daram_review:
    title: "I have / he-she has"
    gloss: "I have / he-she has"
    note: "*دارم*/*داره*, already taught back in unit04's family vocabulary, work the same way with a physical trait: *موی مشکی دارم* means 'I have black hair.'"
  fa.a1.unit25.lesson04.teach.eynak_word:
    title: Glasses
    gloss: glasses
    note: "*عینک* means (eye)glasses."
    example_gloss: "He wears glasses."
  fa.a1.unit25.lesson04.teach.mizane_word:
    title: "He/she wears"
    gloss: "he/she wears"
    note: "*می‌زنه* (literally 'hits/strikes') is the natural verb for wearing glasses -- *عینک می‌زنه* means 'wears glasses,' a different verb from unit08/unit24's *می‌کنم* (do/make)."
  fa.a1.unit25.lesson04.teach.che_shekliye_phrase:
    title: "What does he/she look like?"
    gloss: "what does he/she look like?"
    note: "*چه شکلیه؟* literally means 'what shape is it?' -- the standard colloquial way to ask what someone looks like."
  fa.a1.unit25.lesson04.teach.va_review:
    title: And
    gloss: and
    note: "*و* means 'and' -- already used this way back in unit14/unit24."
    example_gloss: "His height is tall and his hair is black."

  fa.a1.unit25.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: "*نیما*, established as a character back in unit11, reappears here."
    example_gloss: "Nima is Sara's friend."
  fa.a1.unit25.lesson05.teach.reading_text:
    title: "Reading: Nima's appearance"
    gloss: "Nima is tall. His hair is black and his eyes are brown. He wears glasses."
    note: "This reading reuses every construction from lessons 1-4 -- almost no new vocabulary, just recognizing it in connected text."

  fa.a1.unit25.lesson06.teach.maryam_name:
    title: Maryam
    gloss: Maryam
    note: "*مریم* is a new character -- a friend of سارا's that نیما hasn't met yet."
    example_gloss: "Maryam is Sara's friend."
  fa.a1.unit25.lesson06.teach.alan_review:
    title: Now
    gloss: now
    note: "*الان*, already taught back in unit06, reappears here."
    example_gloss: "Maryam is coming now."
  fa.a1.unit25.lesson06.teach.miad_word:
    title: "Is coming"
    gloss: "is coming"
    note: "*میاد* is the colloquial present-tense form of *آمدن* (to come)."
    example_gloss: "Maryam is coming now."
  fa.a1.unit25.lesson06.teach.rangiye_phrase:
    title: "What color is it?"
    gloss: "what color is it?"
    note: "*چه رنگیه؟* combines *چه* (what, from lesson04) with *رنگی* (colored, from *رنگ* + *-ی*) + *-ه* (is) -- 'what color is it?'"
  fa.a1.unit25.lesson06.teach.bashe_mamnoon_review:
    title: "Okay, thanks"
    gloss: "okay, thanks"
    note: "*باشه* and *ممنون*, both already taught back in unit20, combine here as a natural closing line."
  fa.a1.unit25.lesson06.teach.dialogue_line1:
    title: "Sara: Maryam is coming now."
    gloss: "Maryam is coming now."
  fa.a1.unit25.lesson06.teach.dialogue_line2:
    title: "Nima: What does Maryam look like?"
    gloss: "What does Maryam look like?"
  fa.a1.unit25.lesson06.teach.dialogue_line3:
    title: "Sara: She's tall and her hair is black."
    gloss: "Her height is tall and her hair is black."
  fa.a1.unit25.lesson06.teach.dialogue_line4:
    title: "Nima: What color are her eyes?"
    gloss: "What color are her eyes?"
  fa.a1.unit25.lesson06.teach.dialogue_line5:
    title: "Sara: Her eyes are brown."
    gloss: "Her eyes are brown."
  fa.a1.unit25.lesson06.teach.dialogue_line6:
    title: "Nima: Okay, thanks."
    gloss: "Okay, thanks."

exercises:
  fa.a1.unit25.lesson01.exercise01.recognize_boland:
    instruction: "What does this word mean?"
    correct_option: tall
    distractors: [short, height, "he / she"]
    accepted_answers: [{value: tall, status: correct}]
    feedback: "بلند means tall."
  fa.a1.unit25.lesson01.exercise02.recognize_kotah:
    instruction: "What does this word mean?"
    correct_option: short
    distractors: [tall, height, "he / she"]
    accepted_answers: [{value: short, status: correct}]
    feedback: "کوتاه means short."
  fa.a1.unit25.lesson01.exercise03.match_height_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {او: "he / she", قد: height, بلند: tall, کوتاه: short}
        status: correct
    feedback: "These cover the basics of describing height."
  fa.a1.unit25.lesson01.exercise04.word_order_he_is_tall:
    instruction: "Put the words in order."
    accepted_answers: [{value: [او, قدش, بلنده], status: correct}]
    feedback: "او قدش بلنده means 'He is tall.'"
  fa.a1.unit25.lesson01.exercise05.translate_she_is_short:
    instruction: "Translate into Farsi: She is short."
    accepted_answers:
      - {value: "او قدش کوتاهه", status: correct}
      - {value: "قدش کوتاهه", status: correct}
    feedback: "او قدش کوتاهه means 'She is short.'"

  fa.a1.unit25.lesson02.exercise01.recognize_mo:
    instruction: "What does this word mean?"
    correct_option: hair
    distractors: [black, blond, height]
    accepted_answers: [{value: hair, status: correct}]
    feedback: "مو means hair."
  fa.a1.unit25.lesson02.exercise02.recognize_meshki:
    instruction: "What does this word mean?"
    correct_option: black
    distractors: [blond, hair, tall]
    accepted_answers: [{value: black, status: correct}]
    feedback: "مشکی means black."
  fa.a1.unit25.lesson02.exercise03.match_hair_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {او: "he / she", قد: height, بلند: tall, کوتاه: short, مو: hair, مشکی: black, بلوند: blond}
        status: correct
    feedback: "This reviews height vocabulary alongside the new hair words."
  fa.a1.unit25.lesson02.exercise04.word_order_her_hair_is_black:
    instruction: "Put the words in order."
    accepted_answers: [{value: [او, موهاش, مشکیه], status: correct}]
    feedback: "او موهاش مشکیه means 'Her hair is black.'"
  fa.a1.unit25.lesson02.exercise05.translate_her_hair_is_blond:
    instruction: "Translate into Farsi: Her hair is blond."
    accepted_answers: [{value: "موهاش بلونده", status: correct}]
    feedback: "موهاش بلونده means 'Her hair is blond.'"

  fa.a1.unit25.lesson03.exercise01.recognize_cheshm:
    instruction: "What does this word mean?"
    correct_option: eye
    distractors: [hair, height, glasses]
    accepted_answers: [{value: eye, status: correct}]
    feedback: "چشم means eye."
  fa.a1.unit25.lesson03.exercise02.recognize_ghahveei:
    instruction: "What does this word mean?"
    correct_option: brown
    distractors: [green, blue, black]
    accepted_answers: [{value: brown, status: correct}]
    feedback: "قهوه‌ای means brown."
  fa.a1.unit25.lesson03.exercise03.match_eye_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {قد: height, بلند: tall, کوتاه: short, مو: hair, مشکی: black, چشم: eye, "قهوه‌ای": brown, سبز: green}
        status: correct
    feedback: "This reviews height and hair vocabulary alongside the new eye words."
  fa.a1.unit25.lesson03.exercise04.word_order_his_eyes_are_green:
    instruction: "Put the words in order."
    accepted_answers: [{value: [او, چشماش, سبزه], status: correct}]
    feedback: "او چشماش سبزه means 'His eyes are green.'"
  fa.a1.unit25.lesson03.exercise05.translate_his_eyes_are_blue:
    instruction: "Translate into Farsi: His eyes are blue."
    accepted_answers: [{value: "چشماش آبیه", status: correct}]
    feedback: "چشماش آبیه means 'His eyes are blue.'"

  fa.a1.unit25.lesson04.exercise01.recognize_eynak:
    instruction: "What does this word mean?"
    correct_option: glasses
    distractors: [eye, hair, height]
    accepted_answers: [{value: glasses, status: correct}]
    feedback: "عینک means glasses."
  fa.a1.unit25.lesson04.exercise02.recognize_che_shekliye:
    instruction: "What does this phrase mean?"
    correct_option: "What does he/she look like?"
    distractors: ["What is his/her name?", "How old is he/she?", "Where does he/she live?"]
    accepted_answers: [{value: "What does he/she look like?", status: correct}]
    feedback: "چه شکلیه؟ means 'What does he/she look like?'"
  fa.a1.unit25.lesson04.exercise03.match_appearance_grammar:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {عینک: glasses, "می‌زنه": "he/she wears", "چه شکلیه": "what does he/she look like", و: and, من: I, دارم: "I have", داره: "he/she has"}
        status: correct
    feedback: "These combine to build full appearance descriptions."
  fa.a1.unit25.lesson04.exercise04.word_order_he_wears_glasses:
    instruction: "Put the words in order."
    accepted_answers: [{value: [او, عینک, "می‌زنه"], status: correct}]
    feedback: "او عینک می‌زنه means 'He wears glasses.'"
  fa.a1.unit25.lesson04.exercise05.translate_what_does_he_look_like:
    instruction: "Translate into Farsi: What does he look like?"
    accepted_answers:
      - {value: "او چه شکلیه؟", status: correct}
      - {value: "چه شکلیه؟", status: correct}
    feedback: "او چه شکلیه؟ means 'What does he look like?'"

  fa.a1.unit25.lesson05.exercise01.reading_comprehension_nima_hair:
    instruction: "What color is Nima's hair?"
    correct_option: Black
    distractors: [Brown, Blond, Green]
    accepted_answers: [{value: Black, status: correct}]
    feedback: "موهاش مشکیه -- his hair is black."
  fa.a1.unit25.lesson05.exercise02.reading_comprehension_nima_glasses:
    instruction: "Does Nima wear glasses?"
    correct_option: "Yes"
    distractors: ["No"]
    accepted_answers: [{value: "Yes", status: correct}]
    feedback: "عینک می‌زنه -- he wears glasses."
  fa.a1.unit25.lesson05.exercise03.match_reading_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {قد: height, بلند: tall, کوتاه: short, مو: hair, مشکی: black, چشم: eye, "قهوه‌ای": brown, عینک: glasses}
        status: correct
    feedback: "These words all appear in the reading passage."
  fa.a1.unit25.lesson05.exercise04.translate_nima_is_tall:
    instruction: "Translate into Farsi: Nima is tall."
    accepted_answers: [{value: "نیما قدش بلنده", status: correct}]
    feedback: "نیما قدش بلنده means 'Nima is tall.'"
  fa.a1.unit25.lesson05.exercise05.write_own_hair_color:
    instruction: "Write a sentence about your own hair color."
    accepted_answers:
      - {value: "من موی مشکی دارم", status: correct}
      - {value: "من موی قهوه‌ای دارم", status: correct}
      - {value: "من موی بلوند دارم", status: correct}
    feedback: "Any true statement using a taught hair color is accepted."

  fa.a1.unit25.lesson06.exercise01.dialogue_comprehension_context:
    instruction: "What happened in this conversation?"
    correct_option: "Maryam is tall with black hair and brown eyes."
    distractors:
      - "Maryam is short with blond hair and blue eyes."
      - "Maryam is tall with blond hair and green eyes."
      - "Nima already knows what Maryam looks like."
    accepted_answers: [{value: "Maryam is tall with black hair and brown eyes.", status: correct}]
    feedback: "قدش بلنده، موهاش مشکیه، چشماش قهوه‌ایه -- Maryam is tall, with black hair and brown eyes."
  fa.a1.unit25.lesson06.exercise02.match_dialogue_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {مریم: Maryam, الان: now, میاد: "is coming", "چه رنگیه": "what color is it", باشه: okay, ممنون: thanks, "قهوه‌ای": brown, مشکی: black}
        status: correct
    feedback: "This reviews the whole dialogue's key vocabulary."
  fa.a1.unit25.lesson06.exercise03.reading_comprehension_maryam_eyes:
    instruction: "What color are Maryam's eyes?"
    correct_option: Brown
    distractors: [Blue, Green, Black]
    accepted_answers: [{value: Brown, status: correct}]
    feedback: "چشماش قهوه‌ایه -- her eyes are brown."
  fa.a1.unit25.lesson06.exercise04.dialogue_response_describe_someone:
    instruction: "Respond to مریم چه شکلیه؟ by saying she is short."
    accepted_answers:
      - {value: "قدش کوتاهه", status: correct}
      - {value: "او قدش کوتاهه", status: correct}
    feedback: "قدش کوتاهه means 'She is short.'"
  fa.a1.unit25.lesson06.exercise05.write_comparison_appearance:
    instruction: "Write a sentence comparing your hair color and Maryam's hair color."
    accepted_answers:
      - {value: "من موی مشکی دارم و مریم موی قهوه‌ای داره", status: correct}
      - {value: "من موی بلوند دارم و مریم موی مشکی داره", status: correct}
    feedback: "من موی مشکی دارم، مریم موی قهوه‌ای داره -- I have black hair, Maryam has brown hair."
