review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) found and fixed the same real
    bug found in the paired realization file: this overlay's own reuse-
    chain notes claimed بله ("yes," formal) was new vocabulary "genuinely
    introduced for the first time in the whole corpus," counted among 3
    new words. A real introduced_tokens grep across every fa
    a1_unit*.yaml file shows بله was already introduced in unit02 and
    reused since (unit06/20/21/42/44/48/49) -- corrected the count to 2
    new words (سانس, شروع) and explained why the teach.bale card's overlay
    entry is still kept as authored (first place this course contrasts
    بله with the already-taught informal آره as the formal-register
    choice). Everything else checked clean: no same-speaker distractor
    collisions in the dialogue_comprehension exercise, no stray unquoted
    yes/no/true/false/on/off YAML booleans, no Arabic-range kaf/yeh
    codepoints, every exercise type used is registered, every "Translate
    into English" exercise correctly sets answer_language_code: en, and
    every accepted_answers entry (matching_pairs, word_order, translation)
    matches the paired realization's own data shape and order. Compiler
    validation clean both standalone and as part of the combined
    unit51-54 run: 0 errors/0 warnings.

    Prior draft-authoring provenance notes, kept for the record below.

    Draft overlay paired with the fa.a1.unit51.cinema realization. See that
    file's generation_provenance for the honest source-access result:
    tried `firecrawl search "FSI Persian Basic Course cinema سینما movie
    ticket theater"` first, per the standing instruction to re-check
    Firecrawl quota fresh even though it was reported exhausted in every
    earlier round this session -- it returned `Error: Request failed with
    status code 402` (payment required), confirming the account genuinely
    remains at 0 credits. Fell back to this session's own cached local
    `pdftotext -layout` extraction of the same Live Lingua-hosted FSI
    Spoken Persian PDF (`fsi_persian_livelingua.txt`, ~66,700 words) found
    already present in this worker's scratchpad. Found a real hit: FSI
    Unit 4's Basic Sentences contain a genuine "would you like to go to
    the movies with me" social invitation (Alborz inviting Parviz to
    dinner before the movies) plus grammar notes explicitly covering "When
    will the movies start?" as a worked example of the /mise/
    ("becomes/starts") construction. Read closely but deliberately NOT
    adapted: it is a two-friends social-invitation scene with no ticket
    price, showtime-request, or film-title vocabulary anywhere in it, a
    structurally different shape than this course's established two-party
    customer-plus-named-service-character box-office scene (units
    41/44/45/46/47/48/49/50). Used only as confirmation that "going to the
    movies" is a genuine FSI A1-level social topic and that the /-e mise/
    "it starts" grammar pattern this unit independently needed (شروع
    می‌شه) is authentic colloquial Persian, not a source of any adapted
    sentence -- all vocabulary and the full dialogue are authored fresh
    from this project's own established conventions.

    Relationship to unit12 (plans): unit12 already realizes
    universal.a1.plans.make_simple_plans with its own dialogue proposing
    "می‌خوای پنجشنبه بریم سینما؟" (do you want to go to the movies on
    Thursday). This unit realizes the distinct, later
    universal.a1.cinema.go_to_the_cinema outcome, which specifically
    layers the actual box-office transaction (buy a ticket, confirm a
    showtime, learn the price, briefly discuss the film afterward) onto
    that existing plan-making skill -- it deliberately reuses unit12's own
    سینما (re-declared in this file's own introduced_tokens per the
    compiler's per-file-only check) plus بلیط from unit16 (travel) and
    فیلم from unit13 (past events), rather than inventing parallel
    vocabulary, and adds the new showtime/price/box-office layer: a real
    ticket-counter exchange with a stated showtime and price, a new NAMED
    box-office character, and a reading exercise on a priced cinema sign.

    Scenario/register note: an Iranian cinema box office is a genuinely
    gender-neutral service role with no authenticity concern either way,
    so this unit's new service character is authored female (خانم موسوی)
    specifically to bring the corpus-wide named-service-character balance
    to genuine parity for the first time this session -- unit50 left the
    corpus at 5 male vs 4 female; this unit brings it to 5 male vs 5
    female. خانم موسوی is distinct from unit40/42/44's آقای کریمی,
    unit41's خانم احمدی, unit42's آقای صادقی, unit45's خانم رضایی,
    unit46's آقای نوری, unit47's آقای مرادی, unit48's خانم کاظمی,
    unit49's آقای جعفری, and unit50's خانم رحیمی (confirmed via a real
    scan of every آقای/خانم name already used across the fa corpus, plus a
    scan for موسوی anywhere in existing realizations/overlays -- zero
    collision). Reuse chain: سینما (unit12), بلیط (unit16), فیلم (unit13),
    می‌خوام (unit03), این (unit03), چقدر/می‌شه (unit21/28/49/50,
    unit11/35/49/50), چقدره (unit03/28's own "بلیط اتوبوس چقدره؟"), کدوم
    (unit10/14/28/43), ساعت/عصر (unit09), هفت/هشتاد/هزار/تومن/تومنه
    (unit03/21/50), سلام/ممنون (units01/17/22/45/46/47/48/49/50), باشه
    (units01/02/06/17/22/45/46/47/48/49/50), چطور (unit01), بود (unit06),
    باحال/باحاله (unit36/37/38). New vocabulary genuinely introduced for
    the first time in the whole corpus: سانس (showtime/session), شروع
    (start/begin -- combined with the already-taught cost-sense verb
    می‌شه to form "شروع می‌شه," the same authentic /mise/ "becomes/starts"
    construction FSI's own Unit 4 grammar notes independently confirm) --
    exactly 2 new words. No new verb-conjugation pattern is introduced.
    CORRECTED DURING FRESH-CONTEXT REVIEW (2026-07-10): this overlay
    originally also counted بله (formal "yes," chosen over the already-
    taught informal آره to match خانم موسوی's neutral-polite service
    register) as a third genuinely new word. A real grep of every fa
    a1_unit*.yaml file's introduced_tokens (run during review) shows بله
    was actually already introduced in unit02 ("بله. من مینا هستم.") and
    reused since (unit06/20/21/42/44/48/49) -- corrected from 3 new words
    to 2. The teach.bale card is kept as authored: it's still the first
    place this course explicitly contrasts بله with the already-taught
    informal آره as a formal-register choice, a nuance unit02 never
    called out on its own. The showtime (ساعت هفت عصر) and ticket price
    (هشتاد هزار تومن) are kept identical across the dialogue, the
    cinema-sign reading text, and the wrap-up review, per
    AUTHORING_GUIDE.md #11.
    Every "Translate into English" exercise below explicitly sets
    answer_language_code: en. No exercise in this unit tests a genuine
    two-clause sentence joined by "and"/comma (§12) -- every multi-
    sentence line is authored as two separate short sentences in both
    languages, matching how units 44-50 already treat their own two-
    sentence notes. No listen_type/listen_select/listen_order exercise is
    used anywhere in this unit (continuing the established text-based
    corpus-consistency pattern from units 19-50, even though fa now has
    real Azure TTS per §14) -- the spine outcome's "listening" assessment
    requirement is covered via the dialogue_comprehension exercise's
    comprehension-of-the-exchange task, the same interpretation units
    41/42/44/45/46/47/48/49/50 already established. This also means the
    same-speaker/same-audio distractor-collision bug class fixed
    2026-07-09 in the nl corpus (commit 148240e) cannot directly apply
    here -- verified anyway, per the standing instruction to list every
    line each speaker says before writing distractors: نیما says "سلام
    خانم موسوی. یه بلیط می‌خوام."/"سانس ساعت هفت عصر."/"باشه، می‌خوام.
    فیلم ساعت هفت شروع می‌شه؟"/"ممنون!"; خانم موسوی says "سلام نیما.
    برای کدوم سانس؟"/"باشه. بلیط هشتاد هزار تومنه."/"بله، ساعت هفت شروع
    می‌شه." -- lesson04's dialogue_comprehension distractors ("She asks
    how many tickets he wants."/"She asks if he wants popcorn."/"She asks
    for his phone number.") are plausible-fact alternatives, not lines
    either speaker actually says or facts either speaker actually states
    anywhere in this unit's dialogue -- ticket quantity, popcorn, and a
    phone number are never mentioned by either character. The
    dialogue_response exercise (lesson04) accepts نیما's own actual next
    line, not a distractor set, so this check doesn't apply to it.
    Boolean-coercion check: ran a recursive scan over title/gloss/note/
    example_gloss/answer/matching-pair value fields (including
    matching_pairs right: values specifically) across both this overlay
    and the paired realization for bare yes/no/true/false/on/off string
    values or coerced booleans, plus a full yaml.safe_load parse of both
    files confirming every loaded value is a str/list/dict rather than a
    Python bool -- zero hits. Persian-vs-Arabic codepoint scan (Arabic
    kaf U+0643/yeh U+064A) across both files -- zero hits. Compiler
    validation, both standalone and against the full 51-unit en-fa A1
    corpus with position-matched realization/overlay lists, confirmed 0
    errors (see this task's final report for the exact command and
    output).

course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: buying a cinema ticket from a box-office clerk,
    asking which showtime and confirming the price, asking whether the
    film starts at a stated time, briefly saying how the film was
    afterward, and reading/writing a short cinema sign naming a showtime
    and its ticket price.

units:
  fa.a1.unit51.cinema: {title: Cinema}

lessons:
  fa.a1.unit51.lesson01.new_cinema_one: {title: "New words 1"}
  fa.a1.unit51.lesson02.new_cinema_two: {title: "New words 2"}
  fa.a1.unit51.lesson03.ticket_price: {title: "Ticket price"}
  fa.a1.unit51.lesson04.cinema_dialogue: {title: "Dialogue: at the cinema"}
  fa.a1.unit51.lesson05.reading_cinema_sign: {title: "Reading a cinema sign"}
  fa.a1.unit51.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit51.lesson01.teach.review_sinema_belit:
    title: "Review: cinema / ticket"
    gloss: "cinema / ticket"
    note: "*سینما* ('cinema, movies') was already taught in unit12; *بلیط* ('ticket') was already taught in unit16."
  fa.a1.unit51.lesson01.teach.review_mikhaam_in:
    title: "Review: I want / this"
    gloss: "I want / this"
    note: "*می‌خوام* ('I want') was already taught in unit03; *این* ('this') was already taught in unit03/04/08/15/20/26/49/50."
  fa.a1.unit51.lesson01.teach.review_cheghadr_mishe:
    title: "Review: how much / it comes to"
    gloss: "how much / it comes to"
    note: "*چقدر* ('how much') was already taught in unit21/28/49/50; *می‌شه* ('it comes to, it becomes') was already taught in unit11/35/49/50."
  fa.a1.unit51.lesson01.teach.sans:
    title: Showtime
    gloss: showtime
    note: "*سانس* is a specific screening time at the cinema."
    example_gloss: "I want a showtime ticket."

  fa.a1.unit51.lesson02.teach.review_kodum:
    title: "Review: which"
    gloss: which
    note: "*کدوم* ('which') was already taught in unit10/14/28/43."
  fa.a1.unit51.lesson02.teach.review_saat_haft:
    title: "Review: o'clock / seven"
    gloss: "o'clock / seven"
    note: "*ساعت* ('o'clock, hour') was already taught in unit09; *هفت* ('seven') was already taught in unit03."
  fa.a1.unit51.lesson02.teach.review_asr:
    title: "Review: afternoon / pm"
    gloss: "afternoon / pm"
    note: "*عصر* ('afternoon, evening / pm') was already taught in unit09."
  fa.a1.unit51.lesson02.teach.shoru:
    title: "Start, begin"
    gloss: "start, begin"
    note: "*شروع* combines with *می‌شه* ('it becomes') to mean 'it starts' -- the same verb of becoming already taught for the cost sense (*چقدر می‌شه*), used here in its equally authentic 'starts' sense."
    example_gloss: "It starts at seven o'clock."

  fa.a1.unit51.lesson03.teach.review_cheghadre:
    title: "Review: how much is it"
    gloss: "how much is it"
    note: "*چقدره* ('how much is it') was already taught in unit03/28's own \"بلیط اتوبوس چقدره؟\" ('How much is the bus ticket?')."
  fa.a1.unit51.lesson03.teach.review_hashtad_hezar_toman:
    title: "Review: eighty / thousand / toman"
    gloss: "eighty / thousand / toman"
    note: "*هشتاد* ('eighty') was already taught in unit03; *هزار* ('thousand') and *تومن* ('toman') were already taught in unit03/unit21; *تومنه* ('it's ... toman') was already taught in unit03/unit50."
  fa.a1.unit51.lesson03.teach.belit_cheghadre:
    title: "How much is a cinema ticket?"
    gloss: "How much is a cinema ticket?"
    note: "A direct reuse of *چقدره* to ask the price of the cinema ticket."
  fa.a1.unit51.lesson03.teach.belit_price:
    title: "The ticket is 80,000 toman."
    gloss: "The ticket is 80,000 toman."
    note: "States the price using already-known numbers and *تومنه*."

  fa.a1.unit51.lesson04.teach.review_salam_mamnoon:
    title: "Review: hi / thanks"
    gloss: "hi / thanks"
    note: "*سلام* and *ممنون* were already taught in units 01/17/22/45/46/47/48/49/50."
  fa.a1.unit51.lesson04.teach.review_bashe:
    title: "Review: okay"
    gloss: okay
    note: "*باشه* ('okay') was already taught in units 01/02/06/17/22/45/46/47/48/49/50."
  fa.a1.unit51.lesson04.teach.review_khanom:
    title: "Review: Ms."
    gloss: "Ms."
    note: "*خانم* ('Ms.') was already taught in unit41/45/48/50."
  fa.a1.unit51.lesson04.teach.bale:
    title: "Yes"
    gloss: "Yes"
    note: "*بله* is the formal 'yes,' used here by the polite box-office clerk instead of the informal *آره*."
    example_gloss: "Yes, okay."
  fa.a1.unit51.lesson04.teach.character_mousavi:
    title: "Ms. Mousavi"
    gloss: "Ms. Mousavi"
    note: "*خانم موسوی* is this unit's new cinema box-office character, distinct from every other named service-encounter character already in this course."
    example_gloss: "Hi Ms. Mousavi!"
  fa.a1.unit51.lesson04.teach.dialogue_line1:
    title: "Nima: Hi Ms. Mousavi. I want a ticket."
    gloss: "Hi Ms. Mousavi. I want a ticket."
  fa.a1.unit51.lesson04.teach.dialogue_line2:
    title: "Ms. Mousavi: Hi Nima. For which showing?"
    gloss: "Hi Nima. For which showing?"
  fa.a1.unit51.lesson04.teach.dialogue_line3:
    title: "Nima: The seven o'clock showing."
    gloss: "The seven o'clock showing."
  fa.a1.unit51.lesson04.teach.dialogue_line4:
    title: "Ms. Mousavi: Okay. The ticket is 80,000 toman."
    gloss: "Okay. The ticket is 80,000 toman."
  fa.a1.unit51.lesson04.teach.dialogue_line5:
    title: "Nima: Okay, I want it. Does the movie start at seven?"
    gloss: "Okay, I want it. Does the movie start at seven?"
  fa.a1.unit51.lesson04.teach.dialogue_line6:
    title: "Ms. Mousavi: Yes, it starts at seven."
    gloss: "Yes, it starts at seven."
  fa.a1.unit51.lesson04.teach.dialogue_line7:
    title: "Nima: Thanks!"
    gloss: "Thanks!"

  fa.a1.unit51.lesson05.teach.reading_text:
    title: "Reading: a cinema sign"
    gloss: "Mousavi Cinema: film, seven pm showing. Ticket 80,000 toman."
    note: "A short cinema sign naming a showtime and its ticket price."

  fa.a1.unit51.lesson06.teach.review_request:
    title: "I want a ticket for the seven o'clock showing."
    gloss: "I want a ticket for the seven o'clock showing."
    note: "A full review sentence reusing only already-known words from this unit."
  fa.a1.unit51.lesson06.teach.review_price:
    title: "The ticket is 80,000 toman."
    gloss: "The ticket is 80,000 toman."
  fa.a1.unit51.lesson06.teach.review_afterward:
    title: "How was the movie? It was cool!"
    gloss: "How was the movie? It was cool!"
    note: "*چطور* ('how'), *بود* ('was'), and *باحال* ('cool') were each already taught (unit01, unit06, unit36) -- this combines them fresh to talk briefly about the film afterward, as the spine outcome requires."
  fa.a1.unit51.lesson06.teach.summary_words:
    title: "Cinema / ticket / showtime / start / How much is the ticket?"
    gloss: "cinema / ticket / showtime / start / how much is the ticket?"
    note: "These are the key words and phrases taught in this unit."

exercises:
  fa.a1.unit51.lesson01.exercise01.recognize_sans:
    instruction: "What does this word mean?"
    correct_option: showtime
    distractors: [ticket, price, seat]
    accepted_answers: [{value: showtime, status: correct}]
    feedback: "سانس means 'showtime.'"
  fa.a1.unit51.lesson01.exercise02.recognize_belit_sans_mikhaam:
    instruction: "What does this sentence mean?"
    correct_option: "I want a showtime ticket."
    distractors: ["I don't want a ticket.", "I have a ticket.", "I want the price."]
    accepted_answers: [{value: "I want a showtime ticket.", status: correct}]
    feedback: "بلیط سانس می‌خوام means 'I want a showtime ticket.'"
  fa.a1.unit51.lesson01.exercise03.match_cinema_one:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {سینما: "cinema / movies", بلیط: ticket, "می‌خوام": "I want", چقدر: "how much", "می‌شه": "it comes to", سانس: showtime}
        status: correct
    feedback: "These are the first new cinema words for this unit."
  fa.a1.unit51.lesson01.exercise04.word_order_belit_sans_mikhaam:
    instruction: "Put the words in order."
    accepted_answers: [{value: [بلیط, سانس, "می‌خوام"], status: correct}]
    feedback: "بلیط سانس می‌خوام means 'I want a showtime ticket.'"
  fa.a1.unit51.lesson01.exercise05.translate_in_belit:
    instruction: "Translate into English: این بلیط"
    answer_language_code: en
    accepted_answers:
      - {value: "This ticket.", status: correct}
      - {value: "This, ticket", status: correct}
      - {value: "this ticket", status: correct}
      - {value: "This, ticket.", status: correct}
    feedback: "این بلیط means 'this, ticket.'"

  fa.a1.unit51.lesson02.exercise01.recognize_shoru:
    instruction: "What does this word mean?"
    correct_option: "start, begin"
    distractors: [end, "ticket", "price"]
    accepted_answers: [{value: "start, begin", status: correct}]
    feedback: "شروع means 'start, begin.'"
  fa.a1.unit51.lesson02.exercise02.recognize_saat_haft_shoru_mishe:
    instruction: "What does this sentence mean?"
    correct_option: "It starts at seven o'clock."
    distractors: ["It ends at seven o'clock.", "It's seven tickets.", "It's seven toman."]
    accepted_answers: [{value: "It starts at seven o'clock.", status: correct}]
    feedback: "ساعت هفت شروع می‌شه means 'It starts at seven o'clock.'"
  fa.a1.unit51.lesson02.exercise03.match_cinema_two:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {کدوم: which, ساعت: "o'clock / hour", هفت: seven, عصر: "afternoon / pm", شروع: "start / begin", "ساعت هفت شروع می‌شه.": "It starts at seven o'clock."}
        status: correct
    feedback: "These words let you ask about and confirm a showtime."
  fa.a1.unit51.lesson02.exercise04.word_order_saat_haft_shoru_mishe:
    instruction: "Put the words in order."
    accepted_answers: [{value: [ساعت, هفت, شروع, "می‌شه"], status: correct}]
    feedback: "ساعت هفت شروع می‌شه means 'It starts at seven o'clock.'"
  fa.a1.unit51.lesson02.exercise05.translate_kodum_sans:
    instruction: "Translate into English: کدوم سانس؟"
    answer_language_code: en
    accepted_answers:
      - {value: "Which showing?", status: correct}
      - {value: "Which showtime?", status: correct}
      - {value: "which showing", status: correct}
    feedback: "کدوم سانس؟ means 'Which showing?'"

  fa.a1.unit51.lesson03.exercise01.recognize_belit_cheghadre:
    instruction: "What does this sentence mean?"
    correct_option: "How much is a cinema ticket?"
    distractors: ["Where is a cinema ticket?", "Do you have a cinema ticket?", "I want a cinema ticket."]
    accepted_answers: [{value: "How much is a cinema ticket?", status: correct}]
    feedback: "بلیط سینما چقدره؟ means 'How much is a cinema ticket?'"
  fa.a1.unit51.lesson03.exercise02.recognize_belit_price:
    instruction: "What does this sentence mean?"
    correct_option: "The ticket is 80,000 toman."
    distractors: ["The ticket is free.", "There are no tickets.", "The ticket is 800,000 toman."]
    accepted_answers: [{value: "The ticket is 80,000 toman.", status: correct}]
    feedback: "بلیط هشتاد هزار تومنه means 'The ticket is 80,000 toman.'"
  fa.a1.unit51.lesson03.exercise03.match_ticket_price:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"چقدره": "how much is it", هشتاد: eighty, هزار: thousand, تومن: toman, "بلیط سینما چقدره؟": "How much is a cinema ticket?", "بلیط هشتاد هزار تومنه.": "The ticket is 80,000 toman."}
        status: correct
    feedback: "These words let you ask and state the price of a cinema ticket."
  fa.a1.unit51.lesson03.exercise04.word_order_belit_price:
    instruction: "Put the words in order."
    accepted_answers: [{value: [بلیط, هشتاد, هزار, "تومنه"], status: correct}]
    feedback: "بلیط هشتاد هزار تومنه means 'The ticket is 80,000 toman.'"
  fa.a1.unit51.lesson03.exercise05.translate_in_belit_cheghadre:
    instruction: "Translate into English: این بلیط چقدره؟"
    answer_language_code: en
    accepted_answers:
      - {value: "How much is this ticket?", status: correct}
      - {value: "how much is this ticket", status: correct}
    feedback: "این بلیط چقدره؟ means 'How much is this ticket?'"

  fa.a1.unit51.lesson04.exercise01.dialogue_comprehension_which_showing:
    instruction: "Ms. Mousavi asks Nima something. What does she want to know?"
    correct_option: "She asks which showing he wants."
    distractors:
      - "She asks how many tickets he wants."
      - "She asks if he wants popcorn."
      - "She asks for his phone number."
    accepted_answers: [{value: "She asks which showing he wants.", status: correct}]
    feedback: "برای کدوم سانس؟ means 'For which showing?'"
  fa.a1.unit51.lesson04.exercise02.recognize_dialogue_line4:
    instruction: "What does this sentence mean?"
    correct_option: "Okay. The ticket is 80,000 toman."
    distractors:
      - "Okay. The ticket is free."
      - "Sorry, there are no tickets."
      - "Okay. The ticket is 800,000 toman."
