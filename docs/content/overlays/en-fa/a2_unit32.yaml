teaching:
  fa.a2.unit32.lesson01.teach.problems:
    title: Small problems
    gloss: My head hurts, I feel bad, I have an exam, I have no money
    note: 'These are the problems the unit gives advice about: health, study and money. *سرم درد می‌کنه* literally says “my head hurts.”'
    example_gloss: [My head hurts today., I have an exam tomorrow., I feel bad and I have no money.]
  fa.a2.unit32.lesson01.teach.helpers:
    title: Health, study and money words
    gloss: rest, doctor, pharmacy, medicine, water, coffee, lesson/study, spending
    note: '*داروخونه* is the ordinary spoken form of “pharmacy.” *درس* is “lesson” and also the object of “study”: *درس بخونی*.'
    example_gloss: [I have water and coffee., I have a lesson tonight., The doctor and the pharmacy.]
  fa.a2.unit32.lesson01.teach.advice_verbs:
    title: Verb forms for advice
    gloss: you rest, you go, you drink, you study, you sleep, you spend; early, more, less
    note: 'These are the *تو* forms ending in *-ی*: *کنی، بری، بخوری، بخونی، بخوابی*. They are the subjunctive and follow *بهتره*.'
    example_gloss: [(that) you go to bed early., (that) you study more., (that) you spend less.]
  fa.a2.unit32.lesson01.teach.bahtare: {title: بهتره + subjunctive, gloss: It is better that you go to the doctor; it is better that you rest, note: '*بهتره* means “it is better (that)…” and gives soft advice. The verb after it is in the subjunctive, here with the *تو* ending *-ی*: *بهتره بری*, *بهتره استراحت کنی*. There is no extra word between *بهتره* and the verb.'}
  fa.a2.unit32.lesson02.teach.my_opinion:
    title: In my opinion
    gloss: I think, in my opinion
    note: '*به نظرم* literally says “to my view” and is the usual way to soften advice.'
    example_gloss: [I think you’d better drink water., I think you’d better see a doctor.]
  fa.a2.unit32.lesson02.teach.opinion_rule: {title: به نظرم before بهتره, gloss: I think you’d better study more, note: 'Put *به نظرم* first and keep the same structure after it: *به نظرم بهتره + subjunctive*. It makes the advice sound like your opinion, not an order.'}
  fa.a2.unit32.lesson03.teach.negative_verbs:
    title: Negative verb forms
    gloss: (that) you not drink, not go, not sleep, not do; late, a lot, very
    note: 'The negative of each *تو* subjunctive form adds *نـ* in front: *بخوری → نخوری*, *بری → نری*, *بخوابی → نخوابی*, *کنی → نکنی*.'
    example_gloss: [(that) you not drink coffee., (that) you not go to bed late., (that) you not spend a lot.]
  fa.a2.unit32.lesson03.teach.must:
    title: Must
    gloss: must, have to
    note: '*باید* is strong obligation: *باید بری دکتر* = “you must see a doctor.”'
    example_gloss: [Tomorrow you must study more., Today you must see a doctor.]
  fa.a2.unit32.lesson03.teach.negative_rule: {title: Negative advice, gloss: You’d better not drink coffee; you’d better not sleep late, note: 'For “you’d better not,” keep *بهتره* and put *نـ* on the verb: *بهتره قهوه نخوری*. Do not put a negative on *بهتره* itself.'}
  fa.a2.unit32.lesson03.teach.must_vs_better: {title: باید is stronger than بهتره, gloss: You must see a doctor; you’d better see a doctor, note: Use *بهتره* for friendly advice you can ignore and *باید* when something is really necessary. Both are followed by the same *بری*-type verb form.}
  fa.a2.unit32.lesson04.teach.question: {title: 'What should I do?', gloss: 'What should I do?', note: '*چیکار کنم؟* is the usual spoken way to ask for advice. The verb *کنم* is the *من* subjunctive form.'}
  fa.a2.unit32.lesson04.teach.responses:
    title: Answering advice
    gloss: yes, you are right, that is a good idea, I do not know, maybe, no
    note: '*حق با توئه* literally says “the right is with you.” These are friendly ways to accept advice, hesitate, or refuse.'
    example_gloss: ['Yes, you are right.', That is a good idea., 'I do not know, maybe.']
  fa.a2.unit32.lesson04.teach.respond_rule: {title: Three ways to answer advice, gloss: 'Yes, good idea; I do not know, maybe', note: 'Agree with *آره، حق با توئه* or *فکر خوبیه*. If you are not sure, say *نمی‌دونم، شاید*. A plain *نه* is possible but sounds blunt.'}
  fa.a2.unit32.lesson05.teach.reading: {title: A message and a reply, gloss: 'Hello Sara. Tomorrow I have an exam, but my head hurts and I feel bad. What should I do? Hello Nima. I think you''d better rest and drink water tonight. You''d better not drink coffee and go to bed early.', note: 'The first three sentences are Nima’s message; the rest is Sara’s reply. Find the problem first, then the three pieces of advice.'}
  fa.a2.unit32.lesson06.teach.turn01: {title: Turn 1, gloss: Nima describes his problem and asks what to do., note: 'He gives two facts, then asks for advice.'}
  fa.a2.unit32.lesson06.teach.turn02: {title: Turn 2, gloss: Sara gives two pieces of advice., note: '*به نظرم* softens the advice.'}
  fa.a2.unit32.lesson06.teach.turn03: {title: Turn 3, gloss: Nima accepts the advice but says he must study., note: '*باید* here is Nima’s own strong obligation.'}
  fa.a2.unit32.lesson06.teach.turn04: {title: Turn 4, gloss: Sara advises him not to study tonight and to sleep early., note: 'Negative advice, then positive advice.'}
  fa.a2.unit32.lesson06.teach.turn05: {title: Turn 5, gloss: Nima is unsure but admits she may be right., note: A hesitant answer to advice.}
  fa.a2.unit32.lesson06.teach.turn06: {title: Turn 6, gloss: 'Sara adds: so you’d better see a doctor tomorrow.', note: '*پس* means “so, then.”'}
