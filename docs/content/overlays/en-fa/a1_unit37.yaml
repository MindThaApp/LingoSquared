course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: naming and describing the colors of everyday
    objects (fruit, furniture, a pet, a book, a house), asking what color
    something is, and a dialogue comparing two friends' favorite colors.

units:
  fa.a1.unit37.colors:
    title: Colors

lessons:
  fa.a1.unit37.lesson01.new_colors_one: {title: "New colors 1"}
  fa.a1.unit37.lesson02.new_colors_two: {title: "New colors 2"}
  fa.a1.unit37.lesson03.asking_about_color: {title: "Asking about color"}
  fa.a1.unit37.lesson04.color_dialogue: {title: "Dialogue: What color is it?"}
  fa.a1.unit37.lesson05.reading_colors: {title: "Reading about colors"}
  fa.a1.unit37.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit37.lesson01.teach.zard:
    title: Yellow
    gloss: yellow
    note: "*زرد* describes something yellow, like a banana."
    example_gloss: "The banana is yellow."
  fa.a1.unit37.lesson01.teach.narenji:
    title: Orange
    gloss: orange (color)
    note: "*نارنجی* describes something orange-colored."
    example_gloss: "My cat is orange."
  fa.a1.unit37.lesson01.teach.soorati:
    title: Pink
    gloss: pink
    note: "*صورتی* describes something pink."
    example_gloss: "My shirt is pink."
  fa.a1.unit37.lesson01.teach.review_known_colors:
    title: "Colors already known: white / black / red / blue / green / brown"
    gloss: "color / white / black / red / blue / green / brown"
    note: "*رنگ* ('color'), *سفید*, *سیاه*, *قرمز*, and *آبی* were already taught in the clothing unit; *سبز* and *قهوه‌ای* were already taught in the appearance unit. This unit reuses all of them without re-teaching."

  fa.a1.unit37.lesson02.teach.banafsh:
    title: Purple
    gloss: purple
    note: "*بنفش* describes something purple."
    example_gloss: "My book is purple."
  fa.a1.unit37.lesson02.teach.khakestari:
    title: Gray
    gloss: gray
    note: "*خاکستری* describes something gray."
    example_gloss: "The table is gray."
  fa.a1.unit37.lesson02.teach.review_negation:
    title: "The car isn't black, it's white"
    gloss: "The car isn't black, it's white."
    note: "*نیست* negates the fused copula, already taught in the emotions unit, the same pattern as *تنبل نیست* ('he/she is not lazy') from the personality unit."

  fa.a1.unit37.lesson03.teach.rangesh_chiye:
    title: "What color is it?"
    gloss: "What color is it?"
    note: "*رنگش* attaches the possessive suffix *ش* ('its') onto *رنگ* ('color'), the same pattern as *شخصیتش*/*موهاش*/*چشماش*. *چیه؟* ('what is it?') was already taught in the introductions unit (*اسم شما چیه؟*)."
  fa.a1.unit37.lesson03.teach.che_rangiye:
    title: "What color is it? (alternative)"
    gloss: "What color is it?"
    note: "*چه رنگیه؟* is an alternative, equally common way to ask the same question, the same pattern as *چه جوریه؟* from the personality unit."
  fa.a1.unit37.lesson03.teach.answer_rang_mashinam:
    title: "My car's color is blue"
    gloss: "My car's color is blue."
    note: "*ماشینم* attaches the possessive suffix *م* ('my') onto *ماشین* ('car'), the same pattern as *اسمم*/*پدرم*."
  fa.a1.unit37.lesson03.teach.review_ask_color:
    title: "Two ways to ask what color something is"
    gloss: "what color is it? / what color is it?"
    note: "*رنگش چیه؟* and *چه رنگیه؟* both ask the same question and are interchangeable in casual speech."

  fa.a1.unit37.lesson04.teach.ketabet:
    title: "What color is your book?"
    gloss: "What color is your book?"
    note: "*کتابت* attaches the informal possessive suffix *ت* ('your') onto *کتاب* ('book'), the same *تو*-register pattern as *شخصیتت* from the personality unit."
  fa.a1.unit37.lesson04.teach.mashinet:
    title: "What color is your car?"
    gloss: "What color is your car?"
    note: "*ماشینت* attaches the same informal possessive suffix *ت* onto *ماشین* ('car')."
  fa.a1.unit37.lesson04.teach.review_dislike_like:
    title: "I like the color blue"
    gloss: "I like the color blue."
    note: "*دوست دارم* ('I like') and *رو* (object marker) were already taught in the preferences unit."
  fa.a1.unit37.lesson04.teach.dialogue_line1:
    title: "Nima: Sara, what color is your book?"
    gloss: "Sara, what color is your book?"
  fa.a1.unit37.lesson04.teach.dialogue_line2:
    title: "Sara: It's purple. What color is your car?"
    gloss: "It's purple. What color is your car?"
  fa.a1.unit37.lesson04.teach.dialogue_line3:
    title: "Nima: It's blue. I really like the color blue."
    gloss: "It's blue. I really like the color blue."
  fa.a1.unit37.lesson04.teach.dialogue_line4:
    title: "Sara: I like the color purple too."
    gloss: "I like the color purple too."
  fa.a1.unit37.lesson04.teach.dialogue_line5:
    title: "Nima: Cool!"
    gloss: "Cool!"

  fa.a1.unit37.lesson05.teach.roo_word:
    title: "On / on top of"
    gloss: "on / on top of"
    note: "*روی* means 'on' or 'on top of,' a new preposition for this unit."
  fa.a1.unit37.lesson05.teach.reading_text:
    title: "Reading: My house"
    gloss: "My house is white. In the house there's a gray table. On the table there's a red book and a yellow book. My cat is also there, it's orange."
    note: "The reading describes the colors of several everyday objects in a house."
  fa.a1.unit37.lesson05.teach.reading_note:
    title: "There is / there exists"
    gloss: "there is"
    note: "*هست* means 'there is/there exists,' already taught in the places unit's directions dialogue (*یه رستوران هست*, 'there's a restaurant')."

  fa.a1.unit37.lesson06.teach.self_color_preference:
    title: "I really like the color blue"
    gloss: "I really like the color blue."
    note: "A full review sentence reusing only already-known words from earlier units."
  fa.a1.unit37.lesson06.teach.ask_favorite_color:
    title: "What color do you like?"
    gloss: "What color do you like?"
    note: "*چه رنگی* ('what color') + *دوست داری* (2nd-person 'you like,' already taught in the preferences unit's *کدوم رو بیشتر دوست داری؟*)."
  fa.a1.unit37.lesson06.teach.review_all_colors:
    title: "Yellow / orange / pink / purple / gray -- this unit's five new colors"
    gloss: "yellow / orange / pink / purple / gray"
    note: "These are the five new color words taught in this unit."

exercises:
  fa.a1.unit37.lesson01.exercise01.recognize_zard:
    instruction: "What does this word mean?"
    correct_option: yellow
    distractors: [orange, pink, white]
    accepted_answers: [{value: yellow, status: correct}]
    feedback: "زرد means yellow."
  fa.a1.unit37.lesson01.exercise02.recognize_narenji:
    instruction: "What does this word mean?"
    correct_option: orange
    distractors: [yellow, pink, purple]
    accepted_answers: [{value: orange, status: correct}]
    feedback: "نارنجی means orange."
  fa.a1.unit37.lesson01.exercise03.match_colors_one:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {زرد: yellow, نارنجی: orange, صورتی: pink, سفید: white, سیاه: black, قرمز: red, آبی: blue, سبز: green}
        status: correct
    feedback: "These are the three new colors in this unit, plus five colors you already know."
  fa.a1.unit37.lesson01.exercise04.word_order_moz_zarde:
    instruction: "Put the words in order."
    accepted_answers: [{value: [موز, زرده], status: correct}]
    feedback: "موز زرده means 'The banana is yellow.'"
  fa.a1.unit37.lesson01.exercise05.translate_pirahanam_soorati:
    instruction: "Translate into English: پیراهنم صورتیه."
    answer_language_code: en
    accepted_answers:
      - {value: "My shirt is pink", status: correct}
      - {value: "My shirt is pink.", status: correct}
      - {value: "My shirt's pink", status: correct}
      - {value: "My shirt's pink.", status: correct}
      - {value: "My top is pink", status: correct}
      - {value: "My top is pink.", status: correct}
    feedback: "پیراهنم صورتیه means 'My shirt is pink.'"

  fa.a1.unit37.lesson02.exercise01.recognize_banafsh:
    instruction: "What does this word mean?"
    correct_option: purple
    distractors: [gray, yellow, orange]
    accepted_answers: [{value: purple, status: correct}]
    feedback: "بنفش means purple."
  fa.a1.unit37.lesson02.exercise02.recognize_mashin_siyah_nist:
    instruction: "What does this sentence mean?"
    correct_option: "The car isn't black."
    distractors:
      - "The car is black."
      - "The car is white."
      - "The car is purple."
    accepted_answers: [{value: "The car isn't black.", status: correct}]
    feedback: "ماشین سیاه نیست means 'The car isn't black.'"
  fa.a1.unit37.lesson02.exercise03.match_colors_two:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {بنفش: purple, خاکستری: gray, "کتابم بنفشه.": "My book is purple.", "میز خاکستریه.": "The table is gray.", "ماشین سیاه نیست.": "The car isn't black.", سفیده: "it's white", نیست: "is not"}
        status: correct
    feedback: "These are two more new colors in this unit, plus some short sentences."
  fa.a1.unit37.lesson02.exercise04.word_order_miz_khakestari:
    instruction: "Put the words in order."
    accepted_answers: [{value: [میز, خاکستریه], status: correct}]
    feedback: "میز خاکستریه means 'The table is gray.'"
  fa.a1.unit37.lesson02.exercise05.translate_ketabam_banafsh:
    instruction: "Translate into English: کتابم بنفشه."
    answer_language_code: en
    accepted_answers:
      - {value: "My book is purple", status: correct}
      - {value: "My book is purple.", status: correct}
      - {value: "My book's purple", status: correct}
      - {value: "My book's purple.", status: correct}
    feedback: "کتابم بنفشه means 'My book is purple.'"

  fa.a1.unit37.lesson03.exercise01.recognize_rangesh_chiye:
    instruction: "What does this question mean?"
    correct_option: "What color is it?"
    distractors:
      - "What is it?"
      - "How much is it?"
      - "Where is it?"
    accepted_answers: [{value: "What color is it?", status: correct}]
    feedback: "رنگش چیه؟ means 'What color is it?'"
  fa.a1.unit37.lesson03.exercise02.recognize_che_rangiye:
    instruction: "What does this question mean?"
    correct_option: "What color is it?"
    distractors:
      - "What is this?"
      - "How is it?"
      - "What size is it?"
    accepted_answers: [{value: "What color is it?", status: correct}]
    feedback: "چه رنگیه؟ means 'What color is it?'"
  fa.a1.unit37.lesson03.exercise03.match_asking_color_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"رنگش چیه؟": "What color is it?", "رنگ ماشینم آبیه.": "My car's color is blue.", چیه: "is what", زرد: yellow, نارنجی: orange, صورتی: pink}
        status: correct
    feedback: "These phrases let you ask about and answer what color something is, plus three more color words."
  fa.a1.unit37.lesson03.exercise04.word_order_rangesh_chiye:
    instruction: "Put the words in order."
    accepted_answers: [{value: ["رنگش", چیه], status: correct}]
    feedback: "رنگش چیه؟ means 'What color is it?'"
  fa.a1.unit37.lesson03.exercise05.translate_rang_mashinam:
    instruction: "Translate into English: رنگ ماشینم آبیه."
    answer_language_code: en
    accepted_answers:
      - {value: "My car's color is blue", status: correct}
      - {value: "My car's color is blue.", status: correct}
      - {value: "The color of my car is blue", status: correct}
      - {value: "The color of my car is blue.", status: correct}
      - {value: "My car is blue", status: correct}
      - {value: "My car is blue.", status: correct}
      - {value: "My car's blue", status: correct}
      - {value: "My car's blue.", status: correct}
    feedback: "رنگ ماشینم آبیه means 'My car's color is blue.'"

  fa.a1.unit37.lesson04.exercise01.dialogue_comprehension_colors:
    instruction: "What color is Sara's book?"
    correct_option: "Sara's book is purple."
    distractors:
      - "Sara's book is blue."
      - "Sara's car is purple."
      - "Nima's book is yellow."
    accepted_answers: [{value: "Sara's book is purple.", status: correct}]
    feedback: "سارا می‌گه کتابش بنفشه."
  fa.a1.unit37.lesson04.exercise02.recognize_rang_mashinet:
    instruction: "What does this question mean?"
    correct_option: "What color is your car?"
    distractors:
      - "What color is your book?"
      - "Where is your car?"
      - "Do you have a car?"
    accepted_answers: [{value: "What color is your car?", status: correct}]
    feedback: "رنگ ماشینت چیه؟ means 'What color is your car?'"
  fa.a1.unit37.lesson04.exercise03.match_dialogue_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {نیما: Nima, سارا: Sara, "کتابت": "your book", "ماشینت": "your car", بنفشه: "it's purple", آبیه: "it's blue", هم: also, باحاله: cool}
        status: correct
    feedback: "These words appear in the dialogue about book and car colors."
