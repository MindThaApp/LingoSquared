teaching:
  fa.a2.unit41.lesson01.teach.phones:
    title: Phone words
    gloss: phone, camera, battery
    note: '*گوشی* is the ordinary word for a mobile phone.'
    example_gloss:
    - My phone has a camera.
    - This phone has a battery.
    - This is the phone.
  fa.a2.unit41.lesson01.teach.adjs:
    title: Cheap, expensive, good, bad
    gloss: cheap, expensive, good, bad
    note: '*ارزون* and *گرون* are the usual spoken forms.'
    example_gloss:
    - This phone is cheap.
    - That phone is expensive.
    - This phone is good.
    - That phone is bad.
  fa.a2.unit41.lesson01.teach.comparative:
    title: 'Comparative recap: -تر'
    gloss: cheaper, more expensive, better, worse
    note: 'You already know *-تر* for “more”: *ارزون‌تر*. *بهتر* and *بدتر* are the forms of “good” and “bad”.'
  fa.a2.unit41.lesson01.teach.superlative:
    title: 'The superlative: -ترین before the noun'
    gloss: the cheapest phone, the most expensive phone, the best phone, the worst phone
    note: 'Add *-ین* to the comparative and put it before the noun: *ارزون‌تر* becomes *ارزون‌ترین گوشی*. There is no ezafe (*ـِ*) between the two words.'
  fa.a2.unit41.lesson02.teach.housing:
    title: Housing words
    gloss: apartment, room, house, station
    note: '*خونه* is the spoken form of *خانه*.'
    example_gloss:
    - The apartment is here.
    - The room is over there.
    - The house is here.
    - The station is over there.
  fa.a2.unit41.lesson02.teach.size:
    title: Big, small, near, far, pretty
    gloss: big, small, near, far, pretty
    note: '*کوچیک* is the usual spoken form of *کوچک*.'
    example_gloss:
    - The apartment is big.
    - The room is small.
    - The station is near.
    - The house is far.
    - The house is pretty.
  fa.a2.unit41.lesson02.teach.forms:
    title: Any adjective + ترین
    gloss: the biggest apartment; the smallest room; the nearest station; the prettiest house
    note: 'The pattern is the same for every adjective: adjective + *‌ترین* (with a small gap, written with a half-space) in front of the noun.'
  fa.a2.unit41.lesson02.teach.spoken:
    title: 'In speech: از همه + comparative'
    gloss: This apartment is the biggest (bigger than all); this room is the smallest
    note: 'When the superlative is the predicate, speech often says “bigger than all”: *از همه بزرگ‌تره*. It means “the biggest”. A superlative can also be the predicate: *این بزرگ‌ترینه* (“this is the biggest”).'
  fa.a2.unit41.lesson03.teach.holiday:
    title: Holiday words
    gloss: hotel, trip, sea, mountain
    note: '*سفر* is a trip or journey.'
    example_gloss:
    - The hotel is here.
    - The trip is lovely.
    - The sea is over there.
    - The mountain is far.
  fa.a2.unit41.lesson03.teach.opinion:
    title: In my opinion, which
    gloss: in my opinion, which, which one is it
    note: '*به نظر من* introduces your opinion. *کدومه؟* asks “which one is it?”.'
    example_gloss:
    - In my opinion this hotel is good.
    - Which hotel?
  fa.a2.unit41.lesson03.teach.choose:
    title: Asking which is the best
    gloss: Which hotel is the cheapest? The mountain hotel is the cheapest.
    note: To pick one from three options, ask *کدوم ... از همه ...؟* and answer with the same pattern.
  fa.a2.unit41.lesson04.teach.asas:
    title: As ... as
    gloss: as much as, is not
    note: '*به اندازه‌ی* is followed by the thing you compare with.'
    example_gloss:
    - This phone is as cheap as that phone.
    - That phone is not as good as this phone.
  fa.a2.unit41.lesson04.teach.asas_rule:
    title: Equal and not equal
    gloss: This house is as big as that house; this room is not as big as that room
    note: '*به اندازه‌ی* + noun + adjective says two things are equal. For “not as ... as”, end with *نیست*. In the positive the adjective takes the spoken copula (*بزرگه* = *بزرگ* + *است*). In the negative the copula is replaced by *نیست*, so you say *بزرگ نیست*, not *بزرگه نیست*.'
  fa.a2.unit41.lesson05.teach.reading:
    title: Three apartments
    gloss: I want to get an apartment. I saw three apartments. The first apartment was the cheapest, but it was the smallest. The second apartment was the biggest, but it was very far. The third apartment was not as big as the second, but it was the nearest. In my opinion the third apartment is the best.
    note: Read once for the three apartments, then again for the words ending in *-ترین*.
  fa.a2.unit41.lesson06.teach.turn01:
    title: Sara asks which phone is better
    gloss: 'Sara: Nima, which phone is better?'
    note: '*بهتره* is the comparative “better”.'
  fa.a2.unit41.lesson06.teach.turn02:
    title: Nima gives his opinion
    gloss: 'Nima: In my opinion this phone is the best phone.'
    note: '*بهترین گوشی* uses the superlative before the noun.'
  fa.a2.unit41.lesson06.teach.turn03:
    title: Sara notes the price
    gloss: 'Sara: But this phone is the most expensive.'
    note: '*از همه گرون‌تره* is the spoken “the most expensive”.'
  fa.a2.unit41.lesson06.teach.turn04:
    title: Nima compares
    gloss: 'Nima: Yes. That phone is the cheapest, but it is not as good as this phone.'
    note: '*ارزون‌ترینه* is the superlative used as the predicate.'
  fa.a2.unit41.lesson06.teach.turn05:
    title: Sara decides
    gloss: 'Sara: Then I will buy this one.'
    note: '*می‌خرم* in speech also means “I will buy”.'
exercises:
