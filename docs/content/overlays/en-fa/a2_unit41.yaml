    instruction: What does this phrase mean?
    correct_option: The cheapest phone.
    distractors:
    - The cheaper phone.
    - The cheap phone.
    - The most expensive phone.
    accepted_answers:
    - value: The cheapest phone.
      status: correct
    feedback: '*-ترین* gives the superlative: *ارزون‌ترین گوشی* is “the cheapest phone”.'
  fa.a2.unit41.lesson01.exercise02.recognize_best:
