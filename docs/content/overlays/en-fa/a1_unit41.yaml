    Draft overlay paired with the fa.a1.unit41.appointments realization. See
    that file's generation_provenance for the honest source-access result:
    with Firecrawl at 0 credits this session, tried both known FSI Persian
    Basic Course mirrors via direct pdftotext, same as units 36-40. The
    DigitalOcean-mirror copy re-confirmed 0 extractable words (JBIG2-only
    scan, same as every prior unit's finding). The Live Lingua-hosted copy
    has a real OCR text layer (66,717 extractable words this fetch,
    consistent with every prior unit's fetch of the same file) and a
    thorough grep for appointment/vaqt/vaght/waqt/qarar/doctor/dentist/
    clinic/reserve/reservation/schedule/randevu found exactly one genuine
    hit -- an isolated glossary-table entry ("promise, appointment, date")
    with no surrounding scheduling scenario, embedded in an unrelated
    tailor/shopping dialogue -- and one genuine but unrelated "to reserve"
    dialogue about a hotel-room reservation, not a service appointment. No
    appointment-making, phone-booking, or clinic-scheduling scenario exists
    anywhere in the extracted text. All vocabulary and dialogue in this
    unit is authored fresh from this project's own established colloquial
    Iranian Farsi conventions and already-shipped vocabulary. Reuse chain:
    وقت/آزاد extend unit24's "free time" sense to "appointment slot" /
    "available"; روز/کدوم/خوبه reused from unit10; گرفتن reused from
    unit34 (there "to receive," referenced only in the unit title's
    idiomatic sense, never conjugated beyond the bare infinitive in this
    unit's actual content); می‌خوام reused from units 03/08 (object +
    می‌خوام, verb-final, the same pattern as "دو تا سیب می‌خوام"); دکتر
    reused from unit17; کجاست reused from unit05; یا reused from units
    07/09/14/28. New vocabulary genuinely introduced for the first time in
    the whole corpus: دندانپزشک (dentist), مطب (doctor's/dentist's office),
    and two new minor characters, خانم احمدی (a dentist's-office
    receptionist) and دکتر رضایی (the dentist, referenced by name, never
    speaks) -- both kept separate from the established نیما/سارا friend
    pair. آزادید (formal "are you free?") is flagged as a new but
    transparent extension of the already-established formal -ید ending
    (هستید/بفرمایید/unit40's دیدید). Register note: the phone call to the
    dentist's office uses the same polite/neutral service-call register
    unit22's phone lesson already established, while نیما's own lines stay
    register-neutral. Day/time/place facts (Thursday, 4pm, Dr. Rezaei's
    office) are kept identical across the dialogue, the reading
    confirmation notice, and every exercise that references them, per
    AUTHORING_GUIDE.md #11. Every "Translate into English" exercise below
    explicitly sets answer_language_code: en. Every multi-clause
    translate/writing_prompt exercise (lesson04.exercise05,
    lesson05.exercise04/05, lesson06.exercise05) carries period-joined and
    no-period/comma-joined accepted variants per §12. No listen_type/
    listen_select/listen_order exercise is used anywhere in this unit
    (continuing the established text-based corpus-consistency pattern from
    units 19-40), so the same-speaker/same-audio distractor-collision bug
    class fixed 2026-07-09 in the nl corpus (commit 148240e) cannot apply
    here -- verified anyway that lesson04's dialogue_comprehension
    distractors ("He wants a doctor's appointment."/"He wants to cancel
    his appointment."/"He wants directions to the clinic.") are plausible-
    fact alternatives, not lines either dialogue speaker (نیما or خانم
    احمدی) actually says anywhere in this unit's dialogue audio -- نیما
    never asks for a "doctor" (only دندانپزشک is ever requested), and
    neither speaker mentions canceling or directions. Boolean-coercion
    check: ran a recursive yaml.safe_load scan over title/gloss/note/
    example_gloss/answer/matching-pair value fields (including
    matching_pairs right: values specifically) across both this overlay
    and the paired realization for bare yes/no/true/false/on/off string
    values or coerced booleans -- zero hits. Compiler validation, both
    standalone and against the full 41-unit en-fa A1 corpus with
    position-matched realization/overlay lists, confirmed 0 errors.

course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: making a simple appointment -- naming a
    service (dentist), asking which day and time work, a phone call to a
    dentist's office to book an appointment, and reading/writing a short
    appointment confirmation notice.

units:
  fa.a1.unit41.appointments:
    title: "Making an appointment"

