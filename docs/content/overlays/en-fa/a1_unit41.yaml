exercises:
  fa.a1.unit41.lesson01.exercise01.recognize_dandanpezeshk:
    instruction: "What does this word mean?"
    correct_option: dentist
    distractors: [doctor, office, appointment]
    accepted_answers: [{value: dentist, status: correct}]
    feedback: "دندانپزشک means dentist."
  fa.a1.unit41.lesson01.exercise02.recognize_matb:
    instruction: "What does this word mean?"
    correct_option: "doctor's office"
    distractors: [dentist, appointment, pharmacy]
    accepted_answers: [{value: "doctor's office", status: correct}]
    feedback: "مطب means doctor's office (or clinic)."
  fa.a1.unit41.lesson01.exercise03.match_appointments_one:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {دندانپزشک: dentist, مطب: "doctor's office", "دکتر یا دندانپزشک؟": "doctor or dentist?", "دندانپزشک می‌خوام.": "I want a dentist.", "مطب دندانپزشک کجاست؟": "Where is the dentist's office?", "می‌خوام": "I want"}
        status: correct
    feedback: "These are the first new appointment-related words for this unit."
  fa.a1.unit41.lesson01.exercise04.word_order_dandanpezeshk_mikham:
    instruction: "Put the words in order."
    accepted_answers: [{value: [دندانپزشک, "می‌خوام"], status: correct}]
    feedback: "دندانپزشک می‌خوام means 'I want a dentist.'"
  fa.a1.unit41.lesson01.exercise05.translate_matb_dandanpezeshk_kojast:
    instruction: "Translate into English: مطب دندانپزشک کجاست؟"
    answer_language_code: en
    accepted_answers:
      - {value: "Where is the dentist's office?", status: correct}
      - {value: "Where is the dentist's office", status: correct}
      - {value: "Where's the dentist's office?", status: correct}
    feedback: "مطب دندانپزشک کجاست؟ means 'Where is the dentist's office?'"

  fa.a1.unit41.lesson02.exercise01.recognize_vaght:
    instruction: "What does this word mean?"
    correct_option: appointment
    distractors: [dentist, office, day]
    accepted_answers: [{value: appointment, status: correct}]
    feedback: "وقت means appointment (or time slot)."
  fa.a1.unit41.lesson02.exercise02.recognize_azad:
    instruction: "What does this word mean?"
    correct_option: "free / available"
    distractors: [busy, tomorrow, appointment]
    accepted_answers: [{value: "free / available", status: correct}]
    feedback: "آزاد means free or available."
  fa.a1.unit41.lesson02.exercise03.match_appointments_two:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {وقت: appointment, آزاد: "free / available", آزادم: "I'm free", "آزادید؟": "Are you free? (formal)", "وقت می‌خوام": "I want an appointment", "وقت دندانپزشک می‌خوام.": "I want a dentist appointment."}
        status: correct
    feedback: "These words let you say you want an appointment and whether you're free."
  fa.a1.unit41.lesson02.exercise04.word_order_panjshanbe_azadam:
    instruction: "Put the words in order."
    accepted_answers: [{value: [پنجشنبه, آزادم], status: correct}]
    feedback: "پنجشنبه آزادم means 'Thursday I'm free.'"
  fa.a1.unit41.lesson02.exercise05.translate_vaght_dandanpezeshk_mikham:
    instruction: "Translate into English: وقت دندانپزشک می‌خوام."
    answer_language_code: en
    accepted_answers:
      - {value: "I want a dentist appointment", status: correct}
      - {value: "I want a dentist appointment.", status: correct}
      - {value: "I want an appointment with the dentist", status: correct}
      - {value: "I want an appointment with the dentist.", status: correct}
    feedback: "وقت دندانپزشک می‌خوام means 'I want a dentist appointment.'"

  fa.a1.unit41.lesson03.exercise01.recognize_kodum_ruz_khube:
    instruction: "What does this phrase mean?"
    correct_option: "Which day works?"
    distractors: ["What time works?", "Which day is today?", "Is today free?"]
    accepted_answers: [{value: "Which day works?", status: correct}]
    feedback: "کدوم روز خوبه؟ means 'Which day works?'"
  fa.a1.unit41.lesson03.exercise02.recognize_saat_chand_khube:
    instruction: "What does this phrase mean?"
