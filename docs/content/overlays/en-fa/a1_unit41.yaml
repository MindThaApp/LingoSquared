    accepted_answers:
      - {value: "Does Thursday at four work?", status: correct}
      - {value: "Does Thursday at four work", status: correct}
      - {value: "Is Thursday at four good?", status: correct}
      - {value: "Is Thursday at four good", status: correct}
    feedback: "پنجشنبه ساعت چهار خوبه؟ means 'Does Thursday at four work?'"

  fa.a1.unit41.lesson04.exercise01.dialogue_comprehension_dentist_request:
    instruction: "Nima calls a dentist's office. What does he want?"
    correct_option: "He wants a dentist's appointment."
    distractors:
      - "He wants a doctor's appointment."
      - "He wants to cancel his appointment."
      - "He wants directions to the clinic."
    accepted_answers: [{value: "He wants a dentist's appointment.", status: correct}]
    feedback: "سلام، وقت دندانپزشک می‌خوام means 'Hi, I want a dentist appointment.'"
  fa.a1.unit41.lesson04.exercise02.recognize_panjshanbe_azadam:
    instruction: "What does this sentence mean?"
    correct_option: "Thursday I'm free."
    distractors:
      - "Thursday I'm busy."
      - "Friday I'm free."
      - "Thursday I have work."
    accepted_answers: [{value: "Thursday I'm free.", status: correct}]
    feedback: "پنجشنبه آزادم means 'Thursday I'm free.'"
  fa.a1.unit41.lesson04.exercise03.match_dialogue_appointment:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"سلام، وقت دندانپزشک می‌خوام.": "Hi, I want a dentist appointment.", "کدوم روز خوبه؟": "Which day works?", "پنجشنبه آزادم.": "Thursday I'm free.", "ساعت چند؟": "What time?", "ساعت چهار عصر.": "Four in the afternoon.", "مطب دکتر رضایی": "Dr. Rezaei's office", ممنون: thanks}
        status: correct
    feedback: "These words appear in the dentist-appointment phone call."
  fa.a1.unit41.lesson04.exercise04.dialogue_response_which_day:
    instruction: "Respond to باشه. کدوم روز خوبه؟ by saying you're free on Thursday."
    accepted_answers:
      - {value: "پنجشنبه آزادم.", status: correct}
      - {value: "پنجشنبه آزادم", status: correct}
    feedback: "پنجشنبه آزادم means 'Thursday I'm free.'"
  fa.a1.unit41.lesson04.exercise05.translate_khube_panjshanbe_matb:
    instruction: "Translate into English: خوبه. پنجشنبه ساعت چهار عصر، مطب دکتر رضایی."
    answer_language_code: en
    accepted_answers:
      - {value: "Good. Thursday at four in the afternoon, Dr. Rezaei's office.", status: correct}
      - {value: "Good, Thursday at four in the afternoon, Dr. Rezaei's office.", status: correct}
      - {value: "Good. Thursday at four in the afternoon, at Dr. Rezaei's office.", status: correct}
      - {value: "Good, Thursday at four in the afternoon and Dr. Rezaei's office.", status: correct}
    feedback: "خوبه. پنجشنبه ساعت چهار عصر، مطب دکتر رضایی means 'Good. Thursday at four in the afternoon, Dr. Rezaei's office.'"

  fa.a1.unit41.lesson05.exercise01.reading_comprehension_which_day:
    instruction: "According to the note, what day is the appointment?"
    correct_option: "Thursday."
    distractors:
      - "Friday."
      - "Wednesday."
      - "Saturday."
    accepted_answers: [{value: "Thursday.", status: correct}]
    feedback: "وقت دندانپزشک: پنجشنبه means the dentist appointment is on Thursday."
  fa.a1.unit41.lesson05.exercise02.reading_comprehension_time_and_place:
