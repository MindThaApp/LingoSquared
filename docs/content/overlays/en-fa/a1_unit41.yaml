  fa.a1.unit41.lesson04.teach.dialogue_line1:
    title: "Nima: Hi, I want a dentist appointment."
    gloss: "Hi, I want a dentist appointment."
  fa.a1.unit41.lesson04.teach.dialogue_line2:
    title: "Mrs. Ahmadi: Okay. Which day works?"
    gloss: "Okay. Which day works?"
  fa.a1.unit41.lesson04.teach.dialogue_line3:
