    distractors: ["Which day works?", "What time is it?", "Are you free now?"]
    accepted_answers: [{value: "What time works?", status: correct}]
    feedback: "ساعت چند خوبه؟ means 'What time works?'"
  fa.a1.unit41.lesson03.exercise03.match_day_time:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {روز: day, کدوم: which, ساعت: "hour / time", چند: "what / how many", خوبه: "that works / that's good", "کدوم روز خوبه؟": "Which day works?", "پنجشنبه ساعت چهار خوبه؟": "Does Thursday at four work?"}
        status: correct
    feedback: "These words let you ask which day and time work for an appointment."
  fa.a1.unit41.lesson03.exercise04.word_order_kodum_ruz_khube:
    instruction: "Put the words in order."
    accepted_answers: [{value: [کدوم, روز, خوبه], status: correct}]
    feedback: "کدوم روز خوبه؟ means 'Which day works?'"
  fa.a1.unit41.lesson03.exercise05.translate_panjshanbe_saat_chahar_khube:
    instruction: "Translate into English: پنجشنبه ساعت چهار خوبه؟"
