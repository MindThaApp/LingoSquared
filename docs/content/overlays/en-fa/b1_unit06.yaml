course:
  title: Farsi B1
  description: >-
    Intermediate Iranian Farsi: recounting a past experience as a sequence
    of events -- contrasting an imperfect background clause (وقتی که
    می‌رفتم, "when I was going") against a preterite main-line event
    (دیدم, "I saw") -- and reporting what someone else said with گفت که
    ("said that").

units:
  fa.b1.unit06.narrative:
    title: "Telling a Story"
    description: Recount a real past experience as a sequence of events, contrasting background action with the main event, and report what someone said.

lessons:
  fa.b1.unit06.lesson01.background_and_event:
    title: "When I was going..."
  fa.b1.unit06.lesson02.reported_speech:
    title: "He said that..."
  fa.b1.unit06.lesson03.combined_and_negation:
    title: "I saw and he said"
  fa.b1.unit06.lesson04.dialogue_retelling:
    title: "Retelling the story"
  fa.b1.unit06.lesson05.reading_the_story:
    title: "Reza's story"
  fa.b1.unit06.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  fa.b1.unit06.lesson01.teach.vaghti_ke:
    title: when
    gloss: when
    note: "*وقتی که* introduces a BACKGROUND clause -- literally 'at the time that.' It sets the scene for a main event, the way English 'when' does in 'when I was going home, it started to rain.'"
    example_gloss: "When I was going home, it started to rain."
  fa.b1.unit06.lesson01.teach.miraftam:
    title: "I was going"
    gloss: "I was going"
    note: "The IMPERFECT of *رفتن* (go) -- an ongoing background action, not a single completed event. Pairs with *وقتی که* to set the scene."
    example_gloss: "When I was going, I saw Reza."
  fa.b1.unit06.lesson01.teach.didam:
    title: "I saw"
    gloss: "I saw"
    note: "The PRETERITE (simple past) of *دیدن* (see) -- a single completed MAIN event, contrasted with the ongoing imperfect background clause before it. This imperfect-vs-preterite contrast is exactly how Persian marks background against foreground in a narrative, similar to English's 'was going' vs. 'saw.'"
    example_gloss: "I saw Reza."
  fa.b1.unit06.lesson01.teach.ro:
    title: "(object marker)"
    gloss: "(object marker)"
    note: "*را/رو* marks a definite direct object -- *رضا رو دیدم* is literally 'Reza [object-marker] I-saw,' i.e. 'I saw Reza' (a specific, known Reza, not just any person)."
    example_gloss: "I saw Reza."
  fa.b1.unit06.lesson01.teach.reza:
    title: "Reza (name)"
    gloss: Reza
    example_gloss: "I saw Reza."
  fa.b1.unit06.lesson01.teach.grammar_background_event:
    title: "When I was going, I saw Reza."
    gloss: "When I was going, I saw Reza."
    note: "The core narrative-sequencing sentence: *وقتی که* + IMPERFECT (*می‌رفتم*, background, ongoing) + comma + PRETERITE (*دیدم*, foreground, a single completed event). This is the standard Persian shape for 'while X was happening, Y happened' -- the tense contrast alone signals which action is the backdrop and which is the main event."

  fa.b1.unit06.lesson02.teach.goftam:
    title: "I said"
    gloss: "I said"
    example_gloss: "I said that I'd be late."
  fa.b1.unit06.lesson02.teach.gofti:
    title: "you said"
    gloss: "you said"
    example_gloss: "What did you say?"
  fa.b1.unit06.lesson02.teach.goft:
    title: "he/she said"
    gloss: "he/she said"
    example_gloss: "Reza said that he'd be late."
  fa.b1.unit06.lesson02.teach.mirasam:
    title: "I'll arrive"
    gloss: "I'll arrive"
    example_gloss: "I said that I'd be late."
  fa.b1.unit06.lesson02.teach.mirase:
    title: "he/she'll arrive"
    gloss: "he/she'll arrive"
    example_gloss: "He said that he'd be late."
  fa.b1.unit06.lesson02.teach.grammar_reported_speech:
    title: "I said that I'd be late. He said that he'd be late."
    gloss: "I said that I'd be late. He said that he'd be late."
    note: "*گفت که...* (he/she said that...) introduces genuine REPORTED SPEECH, a quoted utterance -- distinct from *فکر می‌کنم که...* (elsewhere in this course), which reports a THOUGHT rather than something someone actually said aloud. Note this unit only teaches the 1st/2nd/3rd SINGULAR of the preterite of *گفتن* (to say) (*گفتم/گفتی/گفت*) -- the colloquial 3rd-person-plural form happens to look identical to the bare infinitive *گفتن*, a genuine ambiguity best introduced later."

  fa.b1.unit06.lesson03.teach.nagoft:
    title: "he/she didn't say"
    gloss: "he/she didn't say"
    example_gloss: "Reza didn't say anything."
  fa.b1.unit06.lesson03.teach.hichi:
    title: "anything / nothing"
    gloss: "anything / nothing"
    example_gloss: "He didn't say anything."
  fa.b1.unit06.lesson03.teach.grammar_combined_sentence:
    title: "When I saw Reza, he said that he'd be late."
    gloss: "When I saw Reza, he said that he'd be late."
    note: "Combines lesson01's background-plus-event sentence with lesson02's reported speech into one compound narrative sentence -- real B1 sentence-building, stacking a background clause, a main event, and a reported statement together."

  fa.b1.unit06.lesson04.teach.nima:
    title: "Nima (name)"
