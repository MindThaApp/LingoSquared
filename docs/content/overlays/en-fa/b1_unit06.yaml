    example_gloss: "When I was going to university, I saw Reza."
  fa.b1.unit06.lesson04.teach.chi:
    title: what
    gloss: what
    example_gloss: "What did Reza say?"
  fa.b1.unit06.lesson04.teach.chera:
    title: why
    gloss: why
    example_gloss: "Why will he be late?"
  fa.b1.unit06.lesson04.teach.dialogue_nima_recount:
    title: "Nima: When I was going to university, I saw Reza."
    gloss: "Nima: When I was going to university, I saw Reza."
  fa.b1.unit06.lesson04.teach.dialogue_sara_ask_what:
    title: "Sara: What did Reza say?"
    gloss: "Sara: What did Reza say?"
  fa.b1.unit06.lesson04.teach.dialogue_nima_answer:
    title: "Nima: He said that he'd be late."
    gloss: "Nima: He said that he'd be late."
  fa.b1.unit06.lesson04.teach.dialogue_sara_ask_why:
    title: "Sara: Why will he be late?"
    gloss: "Sara: Why will he be late?"

  fa.b1.unit06.lesson05.teach.miraft:
    title: "he/she was going"
    gloss: "he/she was going"
    example_gloss: "When Nima was going to university, he saw Reza."
  fa.b1.unit06.lesson05.teach.did:
    title: "he/she saw"
    gloss: "he/she saw"
    example_gloss: "Nima saw Reza."
  fa.b1.unit06.lesson05.teach.mashinesh:
    title: "his/her car"
    gloss: "his/her car"
    note: "*ماشین* (car) + *-ش* (his/her), the same possessive-pronoun-suffix family as the enclitics used elsewhere in this course."
    example_gloss: "His car was broken."
  fa.b1.unit06.lesson05.teach.kharab:
    title: broken
    gloss: broken
    example_gloss: "His car was broken."
  fa.b1.unit06.lesson05.teach.bud:
    title: was
    gloss: was
    example_gloss: "His car was broken."
  fa.b1.unit06.lesson05.teach.reading_passage:
    title: "Reading: Reza's story"
    gloss: "When Nima was going to university, he saw Reza. Reza said that he'd be late, because his car was broken."

  fa.b1.unit06.lesson06.teach.grammar_review:
    title: "When I was going, I saw Reza. He said that he'd be late. He didn't say anything."
    gloss: "When I was going, I saw Reza. He said that he'd be late. He didn't say anything."
    note: "Review: *وقتی که* + imperfect sets a background scene; a preterite verb marks the main event; *گفت که...* reports what someone actually said. Negate the preterite of *گفتن* (*نگفت*) for 'didn't say.'"
  fa.b1.unit06.lesson06.teach.kaja:
    title: where
    gloss: where
    example_gloss: "Where was Nima going?"

