course:
  title: Farsi A2
  description: >-
    Lower-intermediate Iranian Farsi: reporting a leaking pipe to a
    building superintendent, reading a maintenance-request confirmation,
    and following the phone call that arranges the repair.

units:
  fa.a2.unit13.maintenance:
    title: Reporting a household problem

lessons:
  fa.a2.unit13.lesson01.maintenance_vocabulary: {title: "Household-problem words"}
  fa.a2.unit13.lesson02.reporting_the_problem: {title: "Reporting the problem"}
  fa.a2.unit13.lesson03.reading_a_maintenance_notice: {title: "Reading a maintenance notice"}
  fa.a2.unit13.lesson04.maintenance_call_dialogue: {title: "The phone call"}

teaching:
  fa.a2.unit13.lesson01.teach.pipe_word:
    title: "Pipe"
    gloss: "pipe"
    note: "*لوله* is the general word for a pipe."
    example_gloss: "The bathroom pipe is leaking."
  fa.a2.unit13.lesson01.teach.leak_word:
    title: "Leak"
    gloss: "leak / drip"
    note: "*چکه* means a leak or drip, used with *کردن* as *چکه کردن* (to leak)."
    example_gloss: "The pipe is leaking."
  fa.a2.unit13.lesson01.teach.radiator_word:
    title: "Radiator"
    gloss: "radiator / heater"
    note: "*شوفاژ* is the common Persian word for a radiator or heater."
    example_gloss: "The radiator is broken."
  fa.a2.unit13.lesson01.teach.broken_word:
    title: "Broken"
    gloss: "broken"
    note: "*خراب* means broken, used with *شدن* as *خراب شدن* (to break/become broken)."
    example_gloss: "The radiator is broken."
  fa.a2.unit13.lesson01.teach.super_word:
    title: "Building superintendent"
    gloss: "building superintendent / custodian"
    note: "*سرایدار* is the person who manages and maintains an apartment building."
    example_gloss: "I called the building superintendent."
  fa.a2.unit13.lesson01.teach.repair_word:
    title: "Repair"
    gloss: "repair"
    note: "*تعمیر* is the general word for a repair."
    example_gloss: "When is the repair coming?"
  fa.a2.unit13.lesson01.teach.va_word:
    title: "And"
    gloss: "and"
    note: "*و* is the common connecting word used throughout this unit."
  fa.a2.unit13.lesson01.teach.ra_note:
    title: "Object marker"
    gloss: "(marks a definite direct object)"
    note: "*رو* (colloquial for formal *را*) marks a definite direct object -- it comes right after the thing being acted on."

  fa.a2.unit13.lesson02.teach.pipe_leaking:
    title: "State the problem"
    gloss: "The bathroom pipe is leaking."
    note: "*داره چکه می‌کنه* uses the present-progressive *داره + verb* to describe an ongoing problem, not a one-time fact."
  fa.a2.unit13.lesson02.teach.when_can_repair:
    title: "Ask about repair timing"
    gloss: "When can you come repair it?"
    note: "*کی می‌تونید ...؟* politely asks when someone can do something."
  fa.a2.unit13.lesson02.teach.full_report_and_question:
    title: "Combine the report and the question"
    gloss: "The bathroom pipe is leaking. When can you come repair it?"
    note: "The full report-plus-question pattern this lesson is built around."

  fa.a2.unit13.lesson03.teach.request_word:
    title: "Request"
    gloss: "request"
    note: "*درخواست* is the general word for a request, used here with *ثبت شد* (was registered/logged)."
    example_gloss: "Your repair request has been logged."
  fa.a2.unit13.lesson03.teach.repairman_word:
    title: "Repairman"
    gloss: "repairman"
    note: "*تعمیرکار* is the person who comes to do a repair."
    example_gloss: "The repairman is coming tomorrow."
  fa.a2.unit13.lesson03.teach.notice_text:
    title: "A maintenance-request confirmation"
    gloss: "Your repair request has been logged. The repairman will come tomorrow at 10am. Please be home."
    note: "A short official confirmation, the written register this unit is teaching."

  fa.a2.unit13.lesson04.teach.since_when:
    title: "Ask since when"
    gloss: "Since when has it been like this?"
    note: "*از کی این‌طوریه؟* asks how long a problem has been happening."
  fa.a2.unit13.lesson04.teach.turn01:
    title: "سارا reports the problem"
    gloss: "سارا says hello, my bathroom pipe is leaking."
    note: "Reuses lesson02's present-progressive pattern."
  fa.a2.unit13.lesson04.teach.turn02:
    title: "سرایدار asks since when"
    gloss: "The superintendent asks since when it's been like this."
    note: "Reuses this lesson's own opener question."
  fa.a2.unit13.lesson04.teach.turn03:
    title: "سارا gives the duration and more detail"
    gloss: "سارا says since yesterday. Water is going onto the floor."
    note: "*از دیروز* (since yesterday) states the duration; a second sentence adds detail."
  fa.a2.unit13.lesson04.teach.turn04:
    title: "سرایدار agrees to come"
    gloss: "The superintendent says okay, he'll come tomorrow morning and repair it."
    note: "*میام* (colloquial for *می‌آیم*, I come) states his own plan."
  fa.a2.unit13.lesson04.teach.turn05:
    title: "سارا confirms she'll be home"
    gloss: "سارا says thanks, she's home until 11 o'clock."
    note: "*خونه‌ام* (colloquial for *خانه هستم*, I'm home) states her own availability."
  fa.a2.unit13.lesson04.teach.turn06:
    title: "سرایدار confirms"
    gloss: "The superintendent says great, see you then."
    note: "*می‌بینمتون* (I'll see you) politely closes the call."

exercises:
  fa.a2.unit13.lesson01.exercise01.recognize_pipe:
    instruction: "What does this word mean?"
    correct_option: "pipe"
    distractors: ["leak", "radiator", "repair"]
    accepted_answers: [{value: "pipe", status: correct}]
    feedback: "*لوله* means pipe."
  fa.a2.unit13.lesson01.exercise02.recognize_super:
    instruction: "What does this word mean?"
    correct_option: "building superintendent"
    distractors: ["repairman", "pipe", "broken"]
    accepted_answers: [{value: "building superintendent", status: correct}]
    feedback: "*سرایدار* means building superintendent."
  fa.a2.unit13.lesson01.exercise03.match_maintenance_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {لوله: pipe, چکه: leak, شوفاژ: radiator, خراب: broken, سرایدار: "building superintendent", تعمیر: repair}, status: correct}
    feedback: "These six words cover this unit's basic household-problem vocabulary."
  fa.a2.unit13.lesson01.exercise04.order_pipe_is_leaking:
    instruction: "Arrange the words to say: the pipe is leaking."
    accepted_answers: [{value: [لوله, داره, چکه, می‌کنه], status: correct}]
    feedback: "*لوله داره چکه می‌کنه.* describes the ongoing leak."
  fa.a2.unit13.lesson01.exercise05.write_radiator:
    instruction: "Write the Farsi word for radiator."
    accepted_answers:
      - {value: شوفاژ, status: correct}
    feedback: "*شوفاژ* means radiator."

  fa.a2.unit13.lesson02.exercise01.recognize_pipe_leaking:
    instruction: "Which sentence reports a leaking pipe?"
    correct_option: "The bathroom pipe is leaking."
    distractors: ["When can you come repair it?", "The radiator is broken.", "I called the building superintendent."]
    accepted_answers: [{value: "The bathroom pipe is leaking.", status: correct}]
    feedback: "*لوله‌ی حمام داره چکه می‌کنه.* reports the leak."
  fa.a2.unit13.lesson02.exercise02.order_when_can_repair:
    instruction: "Arrange the words to ask: when can you come repair it?"
    accepted_answers: [{value: [کی, می‌تونید, بیاید, تعمیرش, کنید], status: correct}]
    feedback: "*کی می‌تونید بیاید تعمیرش کنید؟* asks about repair timing."
  fa.a2.unit13.lesson02.exercise03.dialogue_response_whats_wrong:
    instruction: "Someone asks: 'What's the problem?' Answer that the bathroom pipe is leaking."
    accepted_answers:
      - {value: "لوله‌ی حمام داره چکه می‌کنه.", status: correct}
      - {value: "لوله‌ی حمام داره چکه می‌کنه", status: correct}
    feedback: "*لوله‌ی حمام داره چکه می‌کنه.* reports the problem."
  fa.a2.unit13.lesson02.exercise04.translate_report_and_question:
    instruction: "Translate into Farsi: The bathroom pipe is leaking. When can you come repair it?"
    accepted_answers:
      - {value: "لوله‌ی حمام داره چکه می‌کنه. کی می‌تونید بیاید تعمیرش کنید؟", status: correct}
      - {value: "لوله‌ی حمام داره چکه می‌کنه، کی می‌تونید بیاید تعمیرش کنید؟", status: correct}
      - {value: "لوله‌ی حمام داره چکه می‌کنه و کی می‌تونید بیاید تعمیرش کنید؟", status: correct}
    feedback: "Joining the report and the question with a period, a comma, or *و* are equally natural here."
  fa.a2.unit13.lesson02.exercise05.write_pipe_leaking:
    instruction: "Write that the bathroom pipe is leaking."
    accepted_answers:
      - {value: "لوله‌ی حمام داره چکه می‌کنه.", status: correct}
      - {value: "لوله‌ی حمام داره چکه می‌کنه", status: correct}
    feedback: "*لوله‌ی حمام داره چکه می‌کنه.* is the accepted report."

  fa.a2.unit13.lesson03.exercise01.read_repairman_time:
    instruction: "According to the notice, when is the repairman coming?"
    correct_option: "Tomorrow at 10am."
    distractors: ["Today at 2pm.", "Tomorrow at 3pm.", "The notice does not say."]
    accepted_answers: [{value: "Tomorrow at 10am.", status: correct}]
    feedback: "*تعمیرکار فردا ساعت ۱۰ صبح میاد.* -- tomorrow at 10am."
  fa.a2.unit13.lesson03.exercise02.read_what_to_do:
    instruction: "According to the notice, what should you do?"
    correct_option: "Be home."
    distractors: ["Call to confirm.", "Leave the door unlocked.", "Nothing is mentioned."]
    accepted_answers: [{value: "Be home.", status: correct}]
    feedback: "*لطفاً در خونه باشید* -- please be home."
  fa.a2.unit13.lesson03.exercise03.recognize_request:
    instruction: "What does this word mean?"
    correct_option: "request"
    distractors: ["repairman", "pipe", "broken"]
    accepted_answers: [{value: "request", status: correct}]
    feedback: "*درخواست* means request."
  fa.a2.unit13.lesson03.exercise04.order_repairman_arrival:
    instruction: "Arrange the words to say: the repairman is coming tomorrow at 10am."
    accepted_answers: [{value: [تعمیرکار, فردا, ساعت, "۱۰", صبح, میاد], status: correct}]
    feedback: "*تعمیرکار فردا ساعت ۱۰ صبح میاد.* states when the repairman is coming."
  fa.a2.unit13.lesson03.exercise05.write_request_registered:
    instruction: "Write that your repair request has been logged."
    accepted_answers:
      - {value: "درخواست تعمیر شما ثبت شد.", status: correct}
      - {value: "درخواست تعمیر شما ثبت شد", status: correct}
    feedback: "*درخواست تعمیر شما ثبت شد.* confirms the request was logged."

  fa.a2.unit13.lesson04.exercise01.comprehend_sara_problem:
    instruction: "What problem does سارا report?"
    correct_option: "Her bathroom pipe is leaking."
    distractors: ["Her radiator is broken.", "Her door is stuck.", "There's no hot water."]
    accepted_answers: [{value: "Her bathroom pipe is leaking.", status: correct}]
    feedback: "*لوله‌ی حمام من داره چکه می‌کنه.* -- her bathroom pipe is leaking."
  fa.a2.unit13.lesson04.exercise02.comprehend_since_yesterday:
    instruction: "Since when has the pipe been leaking, and what else does سارا mention?"
    correct_option: "Since yesterday, and water is going onto the floor."
    distractors: ["Since this morning, and it's very loud.", "Since last week, and it smells bad.", "She doesn't say how long."]
    accepted_answers: [{value: "Since yesterday, and water is going onto the floor.", status: correct}]
    feedback: "*از دیروز. آب داره میره روی زمین.* -- since yesterday, and water is going onto the floor."
  fa.a2.unit13.lesson04.exercise03.recognize_tomorrow:
    instruction: "What does this word mean?"
    correct_option: "tomorrow"
    distractors: ["yesterday", "today", "request"]
    accepted_answers: [{value: "tomorrow", status: correct}]
    feedback: "*فردا* means tomorrow."
  fa.a2.unit13.lesson04.exercise04.order_ill_come_tomorrow:
    instruction: "Arrange the words to say: I'll come tomorrow morning and repair it."
    accepted_answers: [{value: [فردا, صبح, میام, تعمیرش, می‌کنم], status: correct}]
    feedback: "*فردا صبح میام تعمیرش می‌کنم.* states the repair plan."
  fa.a2.unit13.lesson04.exercise05.dialogue_response_since_when:
    instruction: "The superintendent asks: 'Since when has it been like this?' Answer that since yesterday, water is going onto the floor."
    accepted_answers:
      - {value: "از دیروز. آب داره میره روی زمین.", status: correct}
      - {value: "از دیروز آب داره میره روی زمین", status: correct}
    feedback: "*از دیروز. آب داره میره روی زمین.* answers the question."
  fa.a2.unit13.lesson04.exercise06.write_call_summary:
    instruction: "Write that the bathroom pipe is leaking."
    accepted_answers:
      - {value: "لوله‌ی حمام داره چکه می‌کنه", status: correct}
      - {value: "لوله‌ی حمام داره چکه می‌کنه.", status: correct}
    feedback: "*لوله‌ی حمام داره چکه می‌کنه.* describes the problem سارا called about."
