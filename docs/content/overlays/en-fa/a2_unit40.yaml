teaching:
  fa.a2.unit40.lesson01.teach.things:
    title: Everyday things
    gloss: book, bag, key, phone, watch
    note: '*ساعت* means both “watch” and “o’clock”; the sentence tells you which.'
    example_gloss:
    - I have a book.
    - I have a bag.
    - I have a key.
    - I have a phone.
    - I have a watch.
  fa.a2.unit40.lesson01.teach.verbs:
    title: Bought, lost, found
    gloss: I bought, I lost, I found
    note: 'All three are simple past, first person. *گم کردم* and *پیدا کردم* are two-word verbs: the noun comes first.'
    example_gloss:
    - Yesterday I bought a book.
    - Yesterday I lost a key.
    - Yesterday I found a phone.
  fa.a2.unit40.lesson01.teach.rel1:
    title: 'Noun + ی + که: “the ... that ...”'
    gloss: the book that I bought; the bag that I lost; the key that I found
    note: 'To say which thing you mean, add *ی* to the noun and then *که* and a short clause: *کتاب* + *ی* + *که خریدم*. The whole group works like one noun. Unlike English, the clause has no extra “it”: *کتابی که خریدم*, not “the book that I bought it”.'
  fa.a2.unit40.lesson01.teach.rel2:
    title: The group is the subject of the sentence
    gloss: The book that I bought is good; the bag that I lost was small
    note: 'The group *کتابی که خریدم* can stand at the start of a sentence like any noun, and then the verb or adjective follows: *کتابی که خریدم خوبه*.'
  fa.a2.unit40.lesson02.teach.people:
    title: People at work
    gloss: colleague, manager, customer, man, lady
    note: '*همکارم* is “my colleague”. *خانم* is also the polite word for “Ms”.'
    example_gloss:
    - My colleague is here.
    - The manager is over there.
    - The customer is here.
    - That man is over there.
    - That lady is here.
  fa.a2.unit40.lesson02.teach.verbs:
    title: Works, is sitting, called
    gloss: he/she works, is sitting, called
    note: '*نشسته* means “is sitting” (a state). *زنگ زد* is “called (on the phone)”.'
    example_gloss:
    - My colleague works in a bank.
    - The manager is sitting over there.
    - The customer called yesterday.
  fa.a2.unit40.lesson02.teach.rel_subject:
    title: 'Who: the same pattern for people'
    gloss: the man who is sitting there; the colleague who works at the bank; the customer who called
    note: For people, Persian uses the same *که* as for things; there is no separate word for “who”. The person is the doer of the verb in the clause.
  fa.a2.unit40.lesson02.teach.rel_spelling:
    title: Spelling of ی after ه and ی
    gloss: 'after a consonant: ی; after a silent ه or a final ی: ‌ای'
    note: 'After a consonant the ending is *ی* (*کتابی*). After a silent *ه* or after *ی* it is written *ای* with a small gap: *خونه‌ای*, *مشتری‌ای*. In speech you hear the same “i” sound.'
  fa.a2.unit40.lesson03.teach.which:
    title: Which, that, the same
    gloss: which, that, that very one
    note: '*کدوم؟* asks “which?”. *اون* points at something; *همون* means “that very one”.'
    example_gloss:
    - Which book?
    - That book is good.
    - That very book is here.
  fa.a2.unit40.lesson03.teach.answer:
    title: Answer “which?” with a relative group
    gloss: Which bag? The bag that I lost.
    note: 'The easiest answer to *کدوم؟* is a relative group. You can add *اون* or *همون* in front: *همون کیفی که گم کردم* (that very bag that I lost).'
  fa.a2.unit40.lesson03.teach.time:
    title: More words inside the group
    gloss: the book that I bought yesterday; the watch that I found today
    note: 'The clause can hold more words (a time word, a place) before the verb. The verb still comes last: *کتابی که دیروز خریدم*.'
  fa.a2.unit40.lesson04.teach.lost_things:
    title: Things people lose
    gloss: glasses, wallet, colour
    note: '*کیف پول* is “wallet”: *کیف* (bag) + *پول* (money).'
    example_gloss:
    - My glasses are here.
    - My wallet is over there.
    - This colour is pretty.
  fa.a2.unit40.lesson04.teach.colours:
    title: Colours and “what colour?”
    gloss: black, red, blue, what
    note: '*چه رنگیه؟* asks “what colour is it?”.'
    example_gloss:
    - My bag is black.
    - My glasses are red.
    - My phone is blue.
    - What colour is your bag?
  fa.a2.unit40.lesson04.teach.describe:
    title: Describing what you lost
    gloss: What colour is the bag that you lost? The bag that I lost is black.
    note: 'At a lost-property office a clerk asks about the thing with a relative group, and you answer with another one or just the colour: *سیاهه*. The clerk uses *شما* (*گم کردید*).'
  fa.a2.unit40.lesson05.teach.reading:
    title: A lost bag
    gloss: 'Yesterday Sara lost her bag. The bag that she lost was black. In the bag there was a phone and a key. Today Sara went to the lost-property office. The clerk who works there said: “The bag that we found is black.” Sara was happy.'
    note: Read once for what happened, then again for the groups with *که*.
  fa.a2.unit40.lesson06.teach.turn01:
    title: Nima reports a lost bag
    gloss: 'Nima: Excuse me, I lost a bag.'
    note: '*گم کردم* is “I lost”.'
  fa.a2.unit40.lesson06.teach.turn02:
    title: The clerk asks for a description
    gloss: 'Clerk: What colour is the bag that you lost?'
    note: 'The clerk uses *شما*: *گم کردید*.'
  fa.a2.unit40.lesson06.teach.turn03:
    title: Nima answers
    gloss: 'Nima: It is black.'
    note: A short answer is enough.
  fa.a2.unit40.lesson06.teach.turn04:
    title: The clerk asks which one
    gloss: 'Clerk: Which bag? The one that is small?'
    note: '*اونی که کوچیکه* is “the one that is small”: *اونی* replaces the noun.'
  fa.a2.unit40.lesson06.teach.turn05:
    title: Nima confirms
    gloss: 'Nima: Yes, that very bag that is small.'
    note: '*همون کیفی که کوچیکه* repeats the description.'
  fa.a2.unit40.lesson06.teach.turn06:
    title: The clerk points to a colleague
    gloss: 'Clerk: The colleague who is sitting over there has found the bag. The bag that he found is black.'
    note: '*پیدا کرده* is the present perfect “has found”.'
exercises:
  fa.a2.unit40.lesson01.exercise01.recognize_book:
    instruction: What does this sentence mean?
    correct_option: The book that I bought is good.
    distractors:
    - I bought a good book yesterday.
    - The book is good, so I will buy it.
    - The good book is on the table.
    accepted_answers:
    - value: The book that I bought is good.
      status: correct
    feedback: '*کتابی که خریدم* is “the book that I bought”; *خوبه* says it is good.'
  fa.a2.unit40.lesson01.exercise02.recognize_bag:
    instruction: What does this sentence mean?
    correct_option: The bag that I lost was small.
    distractors:
    - The bag that I found was small.
    - I lost a small bag yesterday and bought a new one.
    - The small bag is mine.
    accepted_answers:
    - value: The bag that I lost was small.
      status: correct
    feedback: '*گم کردم* is “I lost”, so *کیفی که گم کردم* is “the bag that I lost”.'
  fa.a2.unit40.lesson01.exercise03.match_groups:
    instruction: Match each Farsi item with its meaning.
    accepted_answers:
    - value:
        کتابی که خریدم: the book that I bought
        کیفی که گم کردم: the bag that I lost
        کلیدی که پیدا کردم: the key that I found
        ساعتی که خریدم: the watch that I bought
        کتابی که گم کردم: the book that I lost
        ساعتی که پیدا کردم: the watch that I found
        خریدم: I bought
        گم کردم: I lost
        پیدا کردم: I found
      status: correct
    feedback: Each group is noun + ی + که + a past verb.
  fa.a2.unit40.lesson01.exercise04.order_bag:
