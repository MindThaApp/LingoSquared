    accepted_answers: [{value: I used to go to school every day., status: correct}]
    feedback: '*هر روز می‌رفتم مدرسه* means ''I used to go to school every day.'''
  fa.a2.unit23.lesson01.exercise02.match_first_habits:
    instruction: Match each habitual-past form or time phrase with its meaning.
    accepted_answers: [{value: {می‌رفتم: I used to go, می‌خوندم: I used to read, می‌کردم: I used to do, می‌ساختن: they used to build, قبلا: formerly, هر روز: every day, هر تابستون: every summer}, status: correct}]
    feedback: '*می‌* marks the repeated past forms; the time phrases reinforce repetition.'
  fa.a2.unit23.lesson01.exercise03.order_daily_school:
    instruction: 'Arrange the words to say with the habitual past: I used to walk to school every day.'
    accepted_answers:
    - {value: [هر, روز, پیاده, می‌رفتم, مدرسه], status: correct}
    - {value: [هر, روز, پیاده, مدرسه, می‌رفتم], status: correct}
    feedback: '*هر روز پیاده می‌رفتم مدرسه* is a natural spoken order.'
  fa.a2.unit23.lesson01.exercise04.fill_used_to_go:
    instruction: Complete the sentence with the taught first-person habitual past of رفتن.
    accepted_answers: [{value: می‌رفتم, status: correct}]
