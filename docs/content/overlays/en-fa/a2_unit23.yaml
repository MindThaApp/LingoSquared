teaching:
  fa.a2.unit23.lesson01.teach.time_words:
    title: Childhood time words
    gloss: formerly, back then, when I was a child, every day, every summer
    note: '*قبلا* and *اون موقع* set a past scene. *هر روز* and *هر تابستون* signal repetition, so they naturally pair with the habitual *می‌* past.'
    example_gloss: [I used to walk to school every day., I was a child back then., Every summer we used to play in the park.]
  fa.a2.unit23.lesson01.teach.places:
    title: Home and neighbourhood places
    gloss: home, yard, neighbourhood, school, park
    note: '*توی* is the usual spoken form of ''in''. With *رفتن*, speakers may keep or drop *به*: *به مدرسه می‌رفتم* and *می‌رفتم مدرسه*.'
    example_gloss: [Our home had a yard., Our neighbourhood was quiet., I used to walk to school., We used to play in the park.]
  fa.a2.unit23.lesson01.teach.descriptions:
    title: Describing places
    gloss: quiet, busy, big, near, far
    note: Use these with past *بود* to describe how a place was. In spoken Persian *دوره* means 'it is far'.
    example_gloss: [The neighbourhood was quiet., The school was busy., The yard was big., The school was nearby., Now the park is far away.]
  fa.a2.unit23.lesson01.teach.activities:
    title: Childhood activities
    gloss: on foot, book, football, to play, to read, to build
    note: '*بازی کردن* is a compound verb. In the habitual past, *می‌* goes on *کردن*: *بازی می‌کردم*.'
    example_gloss: [I used to walk to school., I used to read books., I used to play football., They used to build something in the yard.]
  fa.a2.unit23.lesson01.teach.habit_shape:
    title: The habitual past shape
    gloss: I used to go, I used to read, I used to do, they used to build
    note: 'For a repeated past habit, put *می‌* before the past stem and add the person ending: *می‌رفت + م* → *می‌رفتم*. Keep the ZWNJ after *می‌*.'
  fa.a2.unit23.lesson02.teach.people_and_links:
    title: People and useful links
    gloss: I, we, they, with, a, something, in the afternoons
    note: Spoken Persian often drops subject pronouns; these words make the person or setting explicit when needed.
    example_gloss: [I used to read a book every day., We used to play in the park., They used to build something., I used to play football with Nima., We had a big yard., We used to play in the afternoons.]
  fa.a2.unit23.lesson02.teach.now_words:
    title: Now and no longer
    gloss: now, no longer, no, there, how
    note: '*دیگه* with a negative verb means ''no longer / not any more'': *دیگه بازی نمی‌کنم*.'
    example_gloss: ['Now the neighbourhood is busy.', 'I do not play there any more.', 'No, the school was not far away.', 'What was your neighbourhood like?']
  fa.a2.unit23.lesson02.teach.full_forms:
    title: Person endings with می‌رفت
    gloss: I, you, he/she, we, they used to go
    note: 'The past endings stay the same: *-م، -ی،* no ending, *-یم، -ن*. The spoken third-person plural is *می‌رفتن*.'
  fa.a2.unit23.lesson02.teach.other_habits:
    title: Reading and playing habits
    gloss: you/he/we used to read; I/we used to play
    note: 'The same pattern works with other past stems. A compound verb keeps its noun separate: *بازی می‌کردیم*.'
  fa.a2.unit23.lesson02.teach.past_states:
    title: Past states with بودن and داشتن
    gloss: I was a child; the neighbourhood was quiet; we had a big yard
    note: 'Use past *بودن* and *داشتن* for background descriptions. These are states, so the natural forms here are *بودم، بود، داشتیم*, without habitual *می‌*.'
  fa.a2.unit23.lesson03.teach.simple_contrast:
    title: Habit versus one event
    gloss: I used to go to school every day. I went to school yesterday.
    note: '*هر روز می‌رفتم* is repeated past. *دیروز رفتم* is one finished trip. The time phrase and the presence or absence of *می‌* work together.'
  fa.a2.unit23.lesson03.teach.negative_habit:
    title: Negative habitual past
    gloss: I did not use to go; I did not use to read; I did not use to play
    note: 'Put *نـ* before *می‌*: *نمی‌رفتم، نمی‌خوندم، بازی نمی‌کردم*. Keep *نمی‌* joined with a ZWNJ before the stem.'
  fa.a2.unit23.lesson04.teach.then_now:
    title: Then versus now
    gloss: Our neighbourhood used to be quiet; now it is busy.
    note: Pair *قبلا* or *اون موقع* with the past description, then *حالا* with the present contrast.
  fa.a2.unit23.lesson05.teach.reading:
    title: A childhood neighbourhood
    gloss: 'When I was a child, our neighbourhood was quiet. We had a house with a big yard. I used to walk to school every day. In the afternoons I used to play football in the yard. Now the neighbourhood is busy and I no longer play there.'
    note: The passage combines a past state, repeated habits, and a present-day contrast.
  fa.a2.unit23.lesson06.teach.names:
    title: Sara and Nima
    gloss: Sara, Nima
    note: Sara and Nima are the established friends in this conversation.
    example_gloss: [Sara talks about her childhood., Nima talks about his neighbourhood.]
  fa.a2.unit23.lesson06.teach.turn01: {title: 'Sara asks about the old neighbourhood', gloss: 'When you were a child, what was your neighbourhood like?', note: 'Sara asks about a past state with a past form of the verb to be.'}
  fa.a2.unit23.lesson06.teach.turn02: {title: 'Nima describes his childhood', gloss: 'Our neighbourhood was quiet. We had a house with a big yard. Every day I used to walk to school and in the afternoons I used to play football in the yard. What about you?', note: 'Nima mixes past states (was, had) with repeated habits (used to walk, used to play).'}
  fa.a2.unit23.lesson06.teach.turn03: {title: 'Sara adds a then-versus-now contrast', gloss: 'Our school was close. Every summer we used to play in the park. Now the park is far away and I do not play there any more.', note: 'Sara ends with *حالا ... دیگه ... نمی‌کنم* to contrast the present with the past.'}
exercises:
