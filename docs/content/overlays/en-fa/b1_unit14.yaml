exercises:
  fa.b1.unit14.lesson01.exercise01.recognize_goft_ke:
    instruction: What does this phrase mean?
    correct_option: said that
    distractors:
    - asked whether
    - went because
    - changed when
    accepted_answers:
    - value: said that
      status: correct
    feedback: '*گفت که* means said that.'
  fa.b1.unit14.lesson01.exercise02.recognize_aghab_oftade:
    instruction: What does this phrase mean?
    correct_option: has been delayed
    distractors:
    - is ready
    - is expensive
    - has started
    accepted_answers:
    - value: has been delayed
      status: correct
    feedback: '*عقب افتاده* means has been delayed.'
  fa.b1.unit14.lesson01.exercise03.order_sara_said_delayed:
    instruction: 'Put the words in order: Sara said that the meeting was delayed.'
    accepted_answers:
    - value: سارا گفت که جلسه عقب افتاده
      status: correct
    feedback: Reported message with *گفت که*.
  fa.b1.unit14.lesson01.exercise04.match_reported_message:
    instruction: Match each phrase with its meaning.
    accepted_answers:
    - value:
        گفت که: said that
        جلسه: meeting
        عقب افتاده: has been delayed
        سارا: Sara
        که: that
        گفت: said
      status: correct
    feedback: These phrases report Sara's message.
  fa.b1.unit14.lesson01.exercise05.translate_sara_said_delayed:
    instruction: 'Translate into Farsi: Sara said that the meeting was delayed.'
    accepted_answers:
    - value: سارا گفت که جلسه عقب افتاده
      status: correct
    feedback: Use *گفت که*.
  fa.b1.unit14.lesson01.exercise06.speak_sara_said_delayed:
    instruction: 'Say aloud in Farsi: Sara said that the meeting was delayed.'
    accepted_answers:
