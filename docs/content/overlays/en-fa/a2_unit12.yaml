course:
  title: Farsi A2
  description: >-
    Lower-intermediate Iranian Farsi: describing a symptom with duration
    and severity, reading an appointment confirmation, and following a
    doctor's-office visit through diagnosis and treatment instructions.

units:
  fa.a2.unit12.doctor:
    title: Going to the doctor

lessons:
  fa.a2.unit12.lesson01.doctor_vocabulary: {title: "Doctor's-office words"}
  fa.a2.unit12.lesson02.describing_a_symptom: {title: "Describing a symptom"}
  fa.a2.unit12.lesson03.reading_an_appointment_confirmation: {title: "Reading an appointment confirmation"}
  fa.a2.unit12.lesson04.doctor_visit_dialogue: {title: "The doctor's visit"}

teaching:
  fa.a2.unit12.lesson01.teach.doctor_word:
    title: "Doctor"
    gloss: "doctor"
    note: "*دکتر* is the general word for a doctor."
    example_gloss: "نیما went to the doctor."
  fa.a2.unit12.lesson01.teach.headache_word:
    title: "Headache"
    gloss: "headache"
    note: "*سردرد* means headache."
    example_gloss: "I have a severe headache."
  fa.a2.unit12.lesson01.teach.symptoms_word:
    title: "Symptoms"
    gloss: "symptoms"
    note: "*علائم* is the general word for symptoms."
    example_gloss: "The doctor asked about my symptoms."
  fa.a2.unit12.lesson01.teach.duration_word:
    title: "Duration"
    gloss: "duration / length of time"
    note: "*مدت* is the general word for a duration or length of time."
    example_gloss: "How long have you been like this?"
  fa.a2.unit12.lesson01.teach.prescription_word:
    title: "Prescription"
    gloss: "prescription"
    note: "*نسخه* means a prescription."
    example_gloss: "The doctor gave a prescription."
  fa.a2.unit12.lesson01.teach.rest_word:
    title: "Rest"
    gloss: "rest"
    note: "*استراحت* means rest."
    example_gloss: "I should rest for a few days."
  fa.a2.unit12.lesson01.teach.bayad_note:
    title: "Must / should"
    gloss: "must / should"
    note: "*باید* expresses obligation or advice -- 'must' or 'should', the A2-level grammar this unit's doctor instructions use."

  fa.a2.unit12.lesson02.teach.headache_three_days_severe:
    title: "State a symptom with duration and severity"
    gloss: "I've had a severe headache since three days ago."
    note: "*از ... پیش* (since ... ago) states the duration; *شدید* (severe) states the severity -- the A2-level step up from A1's plain symptom-naming."
  fa.a2.unit12.lesson02.teach.doctor_instruction:
    title: "A doctor's instruction"
    gloss: "The doctor said I should rest and drink a lot of water."
    note: "*باید* here reports the doctor's instruction as advice."
  fa.a2.unit12.lesson02.teach.full_symptom_and_instruction:
    title: "Combine the symptom and the instruction"
    gloss: "I've had a severe headache since three days ago. The doctor said I should rest."
    note: "The full symptom-plus-instruction pattern this lesson is built around."

  fa.a2.unit12.lesson03.teach.appointment_word:
    title: "Appointment"
    gloss: "appointment"
    note: "*نوبت* is the general word for an appointment or turn."
    example_gloss: "My appointment is Tuesday at 11am."
  fa.a2.unit12.lesson03.teach.earlier_word:
    title: "Earlier"
    gloss: "earlier"
    note: "*زودتر* means earlier or sooner."
    example_gloss: "Please arrive 15 minutes earlier."
  fa.a2.unit12.lesson03.teach.confirmation_text:
    title: "An appointment confirmation"
    gloss: "Your appointment with Dr. Rezaei is Tuesday at 11am. Please arrive 15 minutes early. If symptoms don't improve after a week, call again."
    note: "A short official appointment confirmation, the written register this unit is teaching."

  fa.a2.unit12.lesson04.teach.whats_wrong:
    title: "What's wrong?"
    gloss: "Please, what's wrong?"
    note: "*بفرمایید، چی شده؟* is a standard polite doctor's-office opener."
  fa.a2.unit12.lesson04.teach.turn01:
    title: "دکتر رضایی asks what's wrong"
    gloss: "Dr. Rezaei asks, please, what's wrong?"
    note: "Reuses this lesson's own opener phrase."
  fa.a2.unit12.lesson04.teach.turn02:
    title: "نیما describes his symptom"
    gloss: "نیما says he's had a severe headache since three days ago."
    note: "Reuses lesson02's symptom-with-duration-and-severity pattern."
  fa.a2.unit12.lesson04.teach.turn03:
    title: "دکتر رضایی asks about fever"
    gloss: "Dr. Rezaei asks if he also has a fever."
    note: "*تب هم دارید؟* asks about an additional symptom."
  fa.a2.unit12.lesson04.teach.turn04:
    title: "نیما answers about fever"
    gloss: "نیما says no, it's just a headache, but it's severe."
    note: "*فقط ... ولی ...* (just ... but ...) narrows down and contrasts."
  fa.a2.unit12.lesson04.teach.turn05:
    title: "دکتر رضایی gives instructions"
    gloss: "Dr. Rezaei says okay, take this prescription and rest for a few days."
    note: "The doctor's treatment instruction, combining a prescription and rest."
  fa.a2.unit12.lesson04.teach.turn06:
    title: "نیما thanks the doctor"
    gloss: "نیما says of course, thank you doctor."
    note: "*چشم* is a polite, deferential way to say 'of course' or 'will do' to someone in authority."

exercises:
  fa.a2.unit12.lesson01.exercise01.recognize_doctor:
    instruction: "What does this word mean?"
    correct_option: "doctor"
    distractors: ["headache", "prescription", "rest"]
    accepted_answers: [{value: "doctor", status: correct}]
    feedback: "*دکتر* means doctor."
  fa.a2.unit12.lesson01.exercise02.recognize_prescription:
    instruction: "What does this word mean?"
    correct_option: "prescription"
    distractors: ["doctor", "symptoms", "duration"]
    accepted_answers: [{value: "prescription", status: correct}]
    feedback: "*نسخه* means prescription."
  fa.a2.unit12.lesson01.exercise03.match_doctor_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {دکتر: doctor, سردرد: headache, علائم: symptoms, مدت: duration, نسخه: prescription, استراحت: rest}, status: correct}
    feedback: "These six words cover this unit's basic doctor's-office vocabulary."
  fa.a2.unit12.lesson01.exercise04.order_rest_a_few_days:
    instruction: "Arrange the words to say: I should rest for a few days."
    accepted_answers: [{value: [باید, چند, روز, استراحت, کنم], status: correct}]
    feedback: "*باید چند روز استراحت کنم.* expresses the obligation to rest."
  fa.a2.unit12.lesson01.exercise05.write_prescription:
    instruction: "Write the Farsi word for prescription."
    accepted_answers:
      - {value: نسخه, status: correct}
    feedback: "*نسخه* means prescription."

  fa.a2.unit12.lesson02.exercise01.recognize_symptom_sentence:
    instruction: "Which sentence describes a symptom with its duration and severity?"
    correct_option: "I've had a severe headache since three days ago."
    distractors: ["The doctor said I should rest and drink a lot of water.", "My appointment is Tuesday at 11am.", "Please arrive 15 minutes earlier."]
    accepted_answers: [{value: "I've had a severe headache since three days ago.", status: correct}]
    feedback: "*از سه روز پیش سردرد شدیدی دارم.* states both the duration and the severity."
  fa.a2.unit12.lesson02.exercise02.order_doctor_instruction:
    instruction: "Arrange the words to say: the doctor said I should rest and drink a lot of water."
    accepted_answers: [{value: [دکتر, گفت, باید, استراحت, کنم, و, آب, زیاد, بخورم], status: correct}]
    feedback: "*دکتر گفت باید استراحت کنم و آب زیاد بخورم.* reports the doctor's instruction."
  fa.a2.unit12.lesson02.exercise03.dialogue_response_how_long:
    instruction: "The doctor asks: 'How long have you been like this?' Answer that you've had a severe headache since three days ago."
    accepted_answers:
      - {value: "از سه روز پیش سردرد شدیدی دارم.", status: correct}
      - {value: "از سه روز پیش سردرد شدیدی دارم", status: correct}
    feedback: "*از سه روز پیش سردرد شدیدی دارم.* states the duration and severity."
  fa.a2.unit12.lesson02.exercise04.translate_symptom_and_instruction:
    instruction: "Translate into Farsi: I've had a severe headache since three days ago. The doctor said I should rest."
    accepted_answers:
      - {value: "از سه روز پیش سردرد شدیدی دارم. دکتر گفت باید استراحت کنم.", status: correct}
      - {value: "از سه روز پیش سردرد شدیدی دارم، دکتر گفت باید استراحت کنم.", status: correct}
      - {value: "از سه روز پیش سردرد شدیدی دارم و دکتر گفت باید استراحت کنم.", status: correct}
    feedback: "Joining the two sentences with a period, a comma, or *و* are equally natural here."
  fa.a2.unit12.lesson02.exercise05.write_symptom_sentence:
    instruction: "Write that you've had a severe headache since three days ago."
    accepted_answers:
      - {value: "از سه روز پیش سردرد شدیدی دارم.", status: correct}
      - {value: "از سه روز پیش سردرد شدیدی دارم", status: correct}
    feedback: "*از سه روز پیش سردرد شدیدی دارم.* is the accepted symptom sentence."

  fa.a2.unit12.lesson03.exercise01.read_appointment_time:
    instruction: "According to the confirmation, what day and time is the appointment with Dr. Rezaei?"
    correct_option: "Tuesday at 11am."
    distractors: ["Tuesday at 3pm.", "Wednesday at 11am.", "The confirmation does not say."]
    accepted_answers: [{value: "Tuesday at 11am.", status: correct}]
    feedback: "*نوبت شما با دکتر رضایی، سه‌شنبه ساعت ۱۱ صبح است.* -- Tuesday at 11am."
  fa.a2.unit12.lesson03.exercise02.read_if_not_better:
    instruction: "According to the confirmation, what should you do if symptoms don't improve after a week?"
    correct_option: "Call again."
    distractors: ["Come in without calling.", "Wait another week.", "Nothing is mentioned."]
    accepted_answers: [{value: "Call again.", status: correct}]
    feedback: "*اگر علائم بعد از یک هفته بهتر نشد، دوباره تماس بگیرید.* -- call again."
  fa.a2.unit12.lesson03.exercise03.recognize_appointment:
    instruction: "What does this word mean?"
    correct_option: "appointment"
    distractors: ["earlier", "symptoms", "doctor"]
    accepted_answers: [{value: "appointment", status: correct}]
    feedback: "*نوبت* means appointment."
  fa.a2.unit12.lesson03.exercise04.order_come_earlier:
    instruction: "Arrange the words to say: please arrive 15 minutes earlier."
    accepted_answers: [{value: [لطفاً, "۱۵", دقیقه, زودتر, بیایید], status: correct}]
    feedback: "*لطفاً ۱۵ دقیقه زودتر بیایید.* asks you to arrive early."
  fa.a2.unit12.lesson03.exercise05.write_appointment_time:
    instruction: "Write that your appointment is Tuesday at 11am."
    accepted_answers:
      - {value: "نوبتم سه‌شنبه ساعت ۱۱ صبحه.", status: correct}
      - {value: "نوبتم سه‌شنبه ساعت ۱۱ صبحه", status: correct}
    feedback: "*نوبتم سه‌شنبه ساعت ۱۱ صبحه.* states the appointment time."

  fa.a2.unit12.lesson04.exercise01.comprehend_nima_symptom:
    instruction: "What symptom does نیما describe?"
    correct_option: "A severe headache for three days."
    distractors: ["A mild fever for one day.", "A stomachache for a week.", "No symptom at all."]
    accepted_answers: [{value: "A severe headache for three days.", status: correct}]
    feedback: "*از سه روز پیش سردرد شدیدی دارم.* -- a severe headache for three days."
  fa.a2.unit12.lesson04.exercise02.comprehend_doctor_instruction:
    instruction: "What does the doctor tell نیما to do?"
    correct_option: "Take the prescription and rest for a few days."
    distractors: ["Come back tomorrow.", "Drink only water.", "See a specialist."]
    accepted_answers: [{value: "Take the prescription and rest for a few days.", status: correct}]
    feedback: "*این نسخه رو بگیرید و چند روز استراحت کنید.* -- take the prescription and rest."
  fa.a2.unit12.lesson04.exercise03.recognize_fever:
    instruction: "What does this word mean?"
    correct_option: "fever"
    distractors: ["headache", "rest", "prescription"]
    accepted_answers: [{value: "fever", status: correct}]
    feedback: "*تب* means fever."
  fa.a2.unit12.lesson04.exercise04.order_get_prescription_and_rest:
    instruction: "Arrange the words to say: take this prescription and rest for a few days."
    accepted_answers: [{value: [این, نسخه, رو, بگیرید, و, چند, روز, استراحت, کنید], status: correct}]
    feedback: "*این نسخه رو بگیرید و چند روز استراحت کنید.* is the doctor's instruction."
  fa.a2.unit12.lesson04.exercise05.dialogue_response_no_fever:
    instruction: "The doctor asks: 'Do you also have a fever?' Answer that no, it's just a headache, but it's severe."
    accepted_answers:
      - {value: "نه، فقط سردرده، ولی شدیده.", status: correct}
      - {value: "نه فقط سردرده ولی شدیده", status: correct}
    feedback: "*نه، فقط سردرده، ولی شدیده.* answers no and describes the severity."
  fa.a2.unit12.lesson04.exercise06.write_visit_summary:
    instruction: "Write what نیما says about his visit: he's had a severe headache since three days ago and the doctor said he should rest."
    accepted_answers:
      - {value: "از سه روز پیش سردرد شدیدی دارم دکتر گفت باید استراحت کنم", status: correct}
      - {value: "از سه روز پیش سردرد شدیدی دارم دکتر گفت باید استراحت کنم.", status: correct}
      - {value: "از سه روز پیش سردرد شدیدی دارم، دکتر گفت باید استراحت کنم.", status: correct}
      - {value: "از سه روز پیش سردرد شدیدی دارم و دکتر گفت باید استراحت کنم.", status: correct}
      - {value: "از سه روز پیش سردرد شدیدی دارم. دکتر گفت باید استراحت کنم.", status: correct}
    feedback: "*از سه روز پیش سردرد شدیدی دارم، دکتر گفت باید استراحت کنم.* is what نیما says about his visit."
