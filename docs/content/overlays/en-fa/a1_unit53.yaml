    lesson02 teaching entry's "note" field claimed خوبه ("good") was
    "already taught in unit01/05/06/07/10/12." A real introduced_tokens
    grep shows unit01/05/07 never actually declared خوبه as taught
    vocabulary (only used it in an example or prose) -- its real first
    introduction is unit06. Corrected to "unit06/10/12." Everything else
    checked clean: no same-speaker distractor collisions in the
    dialogue_comprehension exercise, no stray unquoted
    yes/no/true/false/on/off YAML booleans, no Arabic-range kaf/yeh
    codepoints, every exercise type used is registered, every "Translate
