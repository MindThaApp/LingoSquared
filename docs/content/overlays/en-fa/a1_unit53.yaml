    Prior draft-authoring provenance notes, kept for the record below.

    Draft overlay paired with the fa.a1.unit53.concert realization. See that
    file's generation_provenance for the honest source-access result: tried
    `firecrawl search "FSI Persian Basic Course concert کنسرت singer خواننده
    music"` first, per the standing instruction to re-check Firecrawl quota
    fresh even though it has been reported exhausted in every earlier round
    this session -- it returned `Error: Request failed with status code 402`
    (payment required), confirming the account genuinely remains at 0
    credits. Fell back to this worker's own cached local `pdftotext -layout`
    extraction of the same Live Lingua-hosted FSI Spoken Persian PDF
    (`fsi_persian_livelingua.txt`, ~66,700 words). Grepped case-insensitively
    for concert/singer/music/band: zero genuine hits (one incidental match
    for بند~ used in an unrelated grammar example, not the English word
    "band" in a musical sense). FSI Persian's own course does not cover a
    concert/music scene at all -- disclosing honestly that nothing usable
    was found, same as the museum unit before it. All vocabulary and the
    full dialogue are authored fresh from this project's own established
    conventions.

    Scenario/register note: نیما (the established recurring customer
    character) buys the concert ticket, continuing his established role
    from units 17/41/44/45/46/47/48/49/50/51/52. A NEW named box-office
    clerk, خانم حسینی, is introduced -- distinct from unit40/42/44's آقای
    کریمی, unit41's خانم احمدی, unit42's آقای صادقی, unit45's خانم رضایی,
    unit46's آقای نوری, unit47's آقای مرادی, unit48's خانم کاظمی, unit49's
    آقای جعفری, unit50's خانم رحیمی, unit51's خانم موسوی, and unit52's آقای
    فرهادی (confirmed via a real scan of every آقای/خانم surname already
    used across the fa corpus, plus a scan for حسینی anywhere in existing
    realizations/overlays -- zero collision). This brings the corpus-wide
    named-service-character balance to 6 male vs 6 female -- genuine parity
    for the second time this session (unit51 first reached 5/5), continuing
    the long-run-balance goal, not a fixed every-unit ratio. A second new
    proper noun, شاهین, names the singer whose concert نیما is attending --
    also confirmed collision-free. Unlike خانم حسینی (a speaking dialogue
    participant, given her own vocabulary card matching the موسوی/فرهادی
    precedent), شاهین is declared inline on the dialogue line where he's
    first named (matching unit51's own precedent for برای, declared inline
    with no separate card) rather than given a dedicated vocabulary card,
    since he never speaks and needs no example sentence of his own. The
    concert is named کنسرت شاهین ("Shahin Concert," after the performing
    singer) rather than after خانم حسینی the clerk -- a deliberate,
    reasoned deviation from unit51/52's clerk-naming convention (سینما
    موسوی, موزه فرهادی), since concerts are naturally named after the
    performing artist, not the ticket seller.

    Reuse chain: بلیط (unit16), می‌خوام (unit03), این (unit02), چقدر
    (unit21), می‌شه (unit11), کدوم (unit10), شروع (unit51), ساعت/شب
    (unit09), چه ساعتی؟ (unit12), چقدره (unit03), صد (unit21), هزار/تومن/
    تومنه (unit03), سلام/ممنون (unit01), باشه (unit03), خانم (unit41), یه
    (unit02), برای (unit51), ده (unit03), چطور (unit01), بود (unit06),
    باحال (unit36). New vocabulary genuinely introduced for the first time
    in the whole corpus: کنسرت (concert) and خواننده (singer) -- exactly 2
    new words, not counting the exempt proper nouns حسینی/شاهین (same
    precedent as unit51/52's موسوی/فرهادی). No new verb-conjugation pattern
    is introduced -- شروع می‌شه directly reuses unit51's own "starts"
    construction. The singer's name (شاهین), the ticket price (صد هزار
    تومن), and the start time (ساعت ده شب) are kept identical across the
    dialogue, the concert-poster reading text, and the wrap-up review, per
    AUTHORING_GUIDE.md #11.

    Every "Translate into English" exercise below explicitly sets
    answer_language_code: en. No exercise in this unit tests a genuine
    two-clause sentence joined by "and"/comma (§12) -- every multi-sentence
    line is authored as two separate short sentences in both languages,
    matching how units 44-52 already treat their own two-sentence notes.
    No listen_type/listen_select/listen_order exercise is used anywhere in
