course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: expressing likes and dislikes, asking about
    preferences, choosing between options, giving simple reasons, and
    a short reading/dialogue about two people's preferences.

units:
  fa.a1.unit14.preferences:
    title: Preferences
    description: Express and ask about basic likes, dislikes, and simple reasons.

lessons:
  fa.a1.unit14.lesson01.basic_likes:
    title: "Simple likes and dislikes"
  fa.a1.unit14.lesson02.asking_preferences:
    title: "Asking about preferences"
  fa.a1.unit14.lesson03.choosing_between_options:
    title: "Choosing between two things"
  fa.a1.unit14.lesson04.giving_reasons:
    title: "Giving a reason"
  fa.a1.unit14.lesson05.reading_about_preferences:
    title: "Reading about preferences"
  fa.a1.unit14.lesson06.preferences_dialogue:
    title: "A dialogue about preferences"

teaching:
  fa.a1.unit14.lesson01.teach.doost_daram_phrase:
    title: "I like"
    gloss: "I like"
    note: "دوست دارم literally means 'I have friendship (with it)' -- the standard way to say I like."
  fa.a1.unit14.lesson01.teach.ghahve_word:
    title: Coffee
    gloss: coffee
    note: "قهوه means coffee."
    example_gloss: "I like coffee."
  fa.a1.unit14.lesson01.teach.chay_word:
    title: Tea
    gloss: tea
    note: "چای means tea."
    example_gloss: "I don't like tea."
  fa.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: "I don't like"
    gloss: "I don't like"
    note: "دوست ندارم is the negative of دوست دارم."
  fa.a1.unit14.lesson01.teach.man_word:
    title: I
    gloss: I
    note: "من means I -- often optional since the verb ending already shows the subject, but can be added for emphasis."
    example_gloss: "I like music."
  fa.a1.unit14.lesson02.teach.kodum_word:
    title: Which
    gloss: which
    note: "کدوم means which (one)."
    example_gloss: "Which one do you like?"
  fa.a1.unit14.lesson02.teach.moosighi_word:
    title: Music
    gloss: music
    note: "موسیقی means music."
    example_gloss: "I like music."
  fa.a1.unit14.lesson02.teach.mikhay_word:
    title: "You want"
    gloss: "you want"
    note: "می‌خوای is the colloquial informal second-person form of می‌خواهی (you want)."
  fa.a1.unit14.lesson02.teach.kodum_ro_question:
    title: "Which one do you like?"
    gloss: "Which one do you like?"
    note: "کدوم رو دوست داری؟ -- رو marks the object (colloquial را), داری is the second-person of داشتن (to have)."
  fa.a1.unit14.lesson03.teach.bishtar_word:
    title: More
    gloss: more
    note: "بیشتر means more."
    example_gloss: "I like coffee more."
  fa.a1.unit14.lesson03.teach.ya_word:
    title: Or
    gloss: or
    note: "یا means or, used to offer a choice between two things."
  fa.a1.unit14.lesson03.teach.ghahve_ya_chay_question:
    title: "Coffee or tea?"
    gloss: "Coffee or tea?"
    note: "قهوه یا چای؟ offers a choice between the two drinks taught in lesson01."
  fa.a1.unit14.lesson04.teach.choon_word:
    title: Because
    gloss: because
    note: "چون introduces a reason."
  fa.a1.unit14.lesson04.teach.khoshmaze_word:
    title: "It's delicious"
    gloss: "it's delicious"
    note: "خوشمزه‌ست is the colloquial contraction of خوشمزه است (it is delicious)."
    example_gloss: "Coffee is delicious."
  fa.a1.unit14.lesson04.teach.jaleb_word:
    title: "It's interesting"
    gloss: "it's interesting"
    note: "جالبه is the colloquial contraction of جالب است (it is interesting)."
    example_gloss: "This music is interesting."
  fa.a1.unit14.lesson04.teach.va_word:
    title: And
    gloss: and
    note: "*و* means 'and' and can link two short statements, such as liking something and describing it. It is looser than *چون* (because), which gives the reason directly."
  fa.a1.unit14.lesson05.teach.sara_name:
    title: Sara
    gloss: Sara
    note: "A common Iranian female name."
    example_gloss: "Sara likes tea."
  fa.a1.unit14.lesson05.teach.dareh_grammar:
    title: "He/she likes"
    gloss: "he/she likes"
    note: "داره is the colloquial third-person form of دارد (has) -- دوست داره means he/she likes, matching the دوست دارم pattern in the first person."
  fa.a1.unit14.lesson05.teach.nadareh_grammar:
    title: "He/she doesn't like"
    gloss: "he/she doesn't like"
    note: "نداره is the colloquial third-person negative -- دوست نداره means he/she doesn't like."
  fa.a1.unit14.lesson05.teach.garme_word:
    title: "It's warm"
    gloss: "it's warm"
    note: "گرمه is the colloquial contraction of گرم است (it is warm)."
    example_gloss: "The tea is warm."
  fa.a1.unit14.lesson05.teach.reading_text:
    title: "Sample preference text"
    gloss: "Sara likes tea because it's warm. Sara doesn't like music."
    note: "A short third-person account combining this unit's preference vocabulary."
  fa.a1.unit14.lesson06.teach.names:
    title: "Nima and Sara"
    gloss: "Nima, Sara"
    note: "Common Iranian names used throughout this course."
    example_gloss: ["Nima likes tea.", "Sara likes coffee."]
  fa.a1.unit14.lesson06.teach.to_chi_phrase:
    title: "What about you?"
    gloss: "What about you?"
    note: "تو چی؟ is a short, common way to turn a question back to the other person."
  fa.a1.unit14.lesson06.teach.aalie_word:
    title: "That's great"
    gloss: "that's great"
    note: "عالیه is the colloquial contraction of عالی است (it is great)."
    example_gloss: "This is great."
  fa.a1.unit14.lesson06.teach.dialogue_line1:
    title: "Nima asks"
    gloss: "Tea or coffee, which do you like more?"
  fa.a1.unit14.lesson06.teach.dialogue_line2:
    title: "Sara answers"
    gloss: "I like coffee more because it's delicious. What about you?"
  fa.a1.unit14.lesson06.teach.dialogue_line3:
    title: "Nima answers"
    gloss: "I like tea because it's warm."
  fa.a1.unit14.lesson06.teach.dialogue_line4:
    title: "Sara reacts"
    gloss: "That's great!"

exercises:
  fa.a1.unit14.lesson01.exercise01.recognize_doost_daram:
    instruction: "What does this phrase mean?"
    correct_option: "I like"
    distractors: ["I don't like", coffee, tea]
    accepted_answers: [{value: "I like", status: correct}]
    feedback: "دوست دارم means I like."
  fa.a1.unit14.lesson01.exercise02.recognize_ghahve:
    instruction: "What does this word mean?"
    correct_option: coffee
    distractors: [tea, "I like", "I don't like"]
    accepted_answers: [{value: coffee, status: correct}]
    feedback: "قهوه means coffee."
  fa.a1.unit14.lesson01.exercise03.match_likes_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"دوست دارم": "I like", "دوست ندارم": "I don't like", قهوه: coffee, چای: tea, من: I}
        status: correct
    feedback: "These are this lesson's core preference vocabulary, plus the subject pronoun من (I) used in these phrases."
  fa.a1.unit14.lesson01.exercise04.translate_i_like_coffee:
    instruction: "Translate into Farsi: I like coffee."
    accepted_answers:
      - {value: "قهوه دوست دارم", status: correct}
      - {value: "من قهوه دوست دارم", status: correct}
      - {value: "قهوه رو دوست دارم", status: correct}
      - {value: "من قهوه رو دوست دارم", status: correct}
    feedback: "قهوه دوست دارم means I like coffee."
  fa.a1.unit14.lesson01.exercise05.translate_i_dont_like_tea:
    instruction: "Translate into Farsi: I don't like tea."
    accepted_answers:
      - {value: "چای دوست ندارم", status: correct}
      - {value: "من چای دوست ندارم", status: correct}
      - {value: "چای رو دوست ندارم", status: correct}
      - {value: "من چای رو دوست ندارم", status: correct}
    feedback: "چای دوست ندارم means I don't like tea."
  fa.a1.unit14.lesson02.exercise01.recognize_kodum:
    instruction: "What does this word mean?"
    correct_option: which
    distractors: [more, or, because]
    accepted_answers: [{value: which, status: correct}]
    feedback: "کدوم means which."
  fa.a1.unit14.lesson02.exercise02.recognize_moosighi:
    instruction: "What does this word mean?"
    correct_option: music
    distractors: [coffee, tea, "you want"]
    accepted_answers: [{value: music, status: correct}]
    feedback: "موسیقی means music."
  fa.a1.unit14.lesson02.exercise03.match_asking_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {کدوم: which, موسیقی: music, "می‌خوای": "you want", "دوست دارم": "I like", قهوه: coffee, چای: tea}
        status: correct
    feedback: "These combine lesson02's new words with lesson01's review vocabulary."
  fa.a1.unit14.lesson02.exercise04.word_order_kodum_question:
    instruction: "Arrange the words to ask Which one do you like?"
    accepted_answers:
      - {value: [کدوم, رو, دوست, داری], status: correct}
    feedback: "کدوم رو دوست داری؟ means which one do you like?"
  fa.a1.unit14.lesson02.exercise05.translate_ask_which_one:
    instruction: "Translate into Farsi: Which one do you like?"
    accepted_answers:
      - {value: "کدوم رو دوست داری", status: correct}
      - {value: "کدوم رو دوست داری؟", status: correct}
      - {value: "تو کدوم رو دوست داری", status: correct}
      - {value: "تو کدوم رو دوست داری؟", status: correct}
    feedback: "کدوم رو دوست داری؟ means which one do you like?"
  fa.a1.unit14.lesson03.exercise01.recognize_bishtar:
    instruction: "What does this word mean?"
    correct_option: more
    distractors: [or, which, because]
    accepted_answers: [{value: more, status: correct}]
    feedback: "بیشتر means more."
  fa.a1.unit14.lesson03.exercise02.recognize_ya:
    instruction: "What does this word mean?"
    correct_option: or
    distractors: [more, which, because]
    accepted_answers: [{value: or, status: correct}]
    feedback: "یا means or."
  fa.a1.unit14.lesson03.exercise03.match_choosing_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {بیشتر: more, یا: or, قهوه: coffee, چای: tea, "دوست دارم": "I like", کدوم: which}
        status: correct
    feedback: "These combine lesson03's new words with earlier review vocabulary."
  fa.a1.unit14.lesson03.exercise04.translate_i_like_coffee_more:
    instruction: "Translate into Farsi: I like coffee more."
    accepted_answers:
      - {value: "قهوه رو بیشتر دوست دارم", status: correct}
      - {value: "من قهوه رو بیشتر دوست دارم", status: correct}
      - {value: "قهوه بیشتر دوست دارم", status: correct}
      - {value: "من قهوه بیشتر دوست دارم", status: correct}
      - {value: "بیشتر قهوه رو دوست دارم", status: correct}
      - {value: "من بیشتر قهوه رو دوست دارم", status: correct}
    feedback: "قهوه رو بیشتر دوست دارم means I like coffee more."
  fa.a1.unit14.lesson03.exercise05.dialogue_response_choose_coffee:
    instruction: "Someone asks: coffee or tea? Say you like coffee more."
    accepted_answers:
      - {value: "قهوه رو بیشتر دوست دارم", status: correct}
      - {value: "من قهوه رو بیشتر دوست دارم", status: correct}
      - {value: "قهوه بیشتر دوست دارم", status: correct}
      - {value: "من قهوه بیشتر دوست دارم", status: correct}
      - {value: "بیشتر قهوه رو دوست دارم", status: correct}
      - {value: "من بیشتر قهوه رو دوست دارم", status: correct}
    feedback: "قهوه رو بیشتر دوست دارم means I like coffee more."
  fa.a1.unit14.lesson04.exercise01.recognize_choon:
    instruction: "What does this word mean?"
    correct_option: because
    distractors: [more, or, which]
    accepted_answers: [{value: because, status: correct}]
    feedback: "چون means because."
  fa.a1.unit14.lesson04.exercise02.recognize_khoshmaze:
    instruction: "What does this phrase mean?"
    correct_option: "it's delicious"
    distractors: ["it's interesting", "it's warm", because]
    accepted_answers: [{value: "it's delicious", status: correct}]
    feedback: "خوشمزه‌ست means it's delicious."
  fa.a1.unit14.lesson04.exercise03.match_reasons_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {چون: because, "خوشمزه‌ست": "it's delicious", جالبه: "it's interesting", "دوست دارم": "I like", قهوه: coffee, موسیقی: music}
        status: correct
    feedback: "These combine lesson04's new words with earlier review vocabulary."
  fa.a1.unit14.lesson04.exercise04.translate_like_coffee_because_delicious:
    instruction: "Translate into Farsi: I like coffee because it's delicious."
    accepted_answers:
      - {value: "قهوه رو دوست دارم چون خوشمزه‌ست", status: correct}
      - {value: "قهوه رو دوست دارم، چون خوشمزه‌ست", status: correct}
      - {value: "قهوه رو دوست دارم و خوشمزه‌ست", status: correct}
      - {value: "قهوه دوست دارم چون خوشمزه‌ست", status: correct}
      - {value: "قهوه دوست دارم، چون خوشمزه‌ست", status: correct}
      - {value: "قهوه دوست دارم و خوشمزه‌ست", status: correct}
      - {value: "من قهوه رو دوست دارم چون خوشمزه‌ست", status: correct}
      - {value: "من قهوه رو دوست دارم، چون خوشمزه‌ست", status: correct}
      - {value: "من قهوه رو دوست دارم و خوشمزه‌ست", status: correct}
      - {value: "من قهوه دوست دارم چون خوشمزه‌ست", status: correct}
      - {value: "من قهوه دوست دارم، چون خوشمزه‌ست", status: correct}
      - {value: "من قهوه دوست دارم و خوشمزه‌ست", status: correct}
    feedback: "قهوه رو دوست دارم چون خوشمزه‌ست means I like coffee because it's delicious."
  fa.a1.unit14.lesson04.exercise05.translate_like_music_because_interesting:
    instruction: "Translate into Farsi: I like music because it's interesting."
    accepted_answers:
      - {value: "موسیقی رو دوست دارم چون جالبه", status: correct}
      - {value: "موسیقی رو دوست دارم، چون جالبه", status: correct}
      - {value: "موسیقی رو دوست دارم و جالبه", status: correct}
      - {value: "موسیقی دوست دارم چون جالبه", status: correct}
      - {value: "موسیقی دوست دارم، چون جالبه", status: correct}
      - {value: "موسیقی دوست دارم و جالبه", status: correct}
      - {value: "من موسیقی رو دوست دارم چون جالبه", status: correct}
      - {value: "من موسیقی رو دوست دارم، چون جالبه", status: correct}
      - {value: "من موسیقی رو دوست دارم و جالبه", status: correct}
      - {value: "من موسیقی دوست دارم چون جالبه", status: correct}
      - {value: "من موسیقی دوست دارم، چون جالبه", status: correct}
      - {value: "من موسیقی دوست دارم و جالبه", status: correct}
    feedback: "موسیقی رو دوست دارم چون جالبه means I like music because it's interesting."
  fa.a1.unit14.lesson05.exercise01.reading_comprehension_what_sara_likes:
    instruction: "Read the text. What does Sara like?"
    correct_option: Tea
    distractors: [Coffee, Music, "It isn't stated"]
    accepted_answers: [{value: Tea, status: correct}]
    feedback: "The text says سارا چای دوست داره -- Sara likes tea."
  fa.a1.unit14.lesson05.exercise02.reading_comprehension_why:
    instruction: "Read the text. Why does Sara like tea?"
    correct_option: "Because it's warm"
    distractors: ["Because it's delicious", "Because it's interesting", "It isn't stated"]
    accepted_answers: [{value: "Because it's warm", status: correct}]
    feedback: "The text says چون گرمه -- because it's warm."
  fa.a1.unit14.lesson05.exercise03.match_reading_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {سارا: Sara, "دوست داره": "she likes", گرمه: "it's warm", چای: tea, چون: because, "دوست نداره": "she doesn't like"}
