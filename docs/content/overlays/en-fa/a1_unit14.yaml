      - {value: "من قهوه رو دوست دارم و خوشمزه‌ست", status: correct}
      - {value: "من قهوه دوست دارم چون خوشمزه‌ست", status: correct}
      - {value: "من قهوه دوست دارم، چون خوشمزه‌ست", status: correct}
      - {value: "من قهوه دوست دارم و خوشمزه‌ست", status: correct}
