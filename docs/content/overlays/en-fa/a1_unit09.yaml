course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: basic time vocabulary, asking and telling the
    time, parts of the day, and arranging a specific meeting time.

units:
  fa.a1.unit09.time:
    title: Time

lessons:
  fa.a1.unit09.lesson01.basic_time_vocabulary: {title: "Basic time vocabulary"}
  fa.a1.unit09.lesson02.asking_the_time: {title: "Ask the time"}
  fa.a1.unit09.lesson03.telling_the_time: {title: "Tell the time"}
  fa.a1.unit09.lesson04.parts_of_the_day: {title: "Parts of the day"}
  fa.a1.unit09.lesson05.asking_about_an_appointment: {title: "Ask about an appointment time"}
  fa.a1.unit09.lesson06.meeting_time_dialogue: {title: "Arrange a meeting time"}

teaching:
  fa.a1.unit09.lesson01.teach.hour_word:
    title: "Hour / clock"
    gloss: "hour / clock"
    note: "ساعت means both 'hour' and 'clock,' and is the base word for telling time."
    example_gloss: "What time is it?"
  fa.a1.unit09.lesson01.teach.minute_word:
    title: "Minute"
    gloss: "minute"
    note: "دقیقه is the word for minute."
    example_gloss: "Wait five minutes."
  fa.a1.unit09.lesson01.teach.half_word:
    title: "Half"
    gloss: "half"
    note: "نیم means half, used for the half-hour."
    example_gloss: "It's half past seven."
  fa.a1.unit09.lesson01.teach.quarter_word:
    title: "Quarter"
    gloss: "quarter"
    note: "ربع means quarter, used for the quarter-hour."
    example_gloss: "It's a quarter to eight."
  fa.a1.unit09.lesson01.teach.va_word:
    title: "And"
    gloss: "and"
    note: "و is the common connecting word used throughout this unit."

  fa.a1.unit09.lesson02.teach.what_time_question:
    title: "Ask what time it is"
    gloss: "What time is it?"
    note: "ساعت چنده؟ is the everyday colloquial way to ask the time."
  fa.a1.unit09.lesson02.teach.contraction_note:
    title: "The colloquial -e contraction (review)"
    gloss: "چنده is the everyday spoken contraction of چند است."
    note: "This is the same contraction pattern already seen with weather and shopping words like آفتابیه and تومنه."

  fa.a1.unit09.lesson03.teach.three_oclock_half:
    title: "Say it's three-thirty"
    gloss: "It's three-thirty."
    note: "ساعت سه و نیمه combines the hour, و (and), and the contracted نیمه (half)."
  fa.a1.unit09.lesson03.teach.contraction_note2:
    title: "The colloquial -e contraction, applied to نیم"
    gloss: "نیمه is the everyday spoken contraction of نیم است."
    note: "Same pattern as چنده, applied to نیم instead of چند."

  fa.a1.unit09.lesson04.teach.sobh:
    title: "Morning"
    gloss: "morning"
    note: "صبح names the morning part of the day."
    example_gloss: "I wake up early in the morning."
  fa.a1.unit09.lesson04.teach.zohr:
    title: "Noon"
    gloss: "noon"
    note: "ظهر names midday."
    example_gloss: "I eat lunch at noon."
  fa.a1.unit09.lesson04.teach.asr:
    title: "Afternoon"
    gloss: "afternoon"
    note: "عصر names the afternoon/early evening part of the day."
    example_gloss: "I work in the afternoon."
  fa.a1.unit09.lesson04.teach.shab:
    title: "Night"
    gloss: "night"
    note: "شب names the night."
    example_gloss: "I go to sleep early at night."

  fa.a1.unit09.lesson05.teach.appointment_word:
    title: "Appointment"
    gloss: "appointment"
    note: "قرار is the general word for an appointment or arranged meeting."
    example_gloss: "I have an appointment."
  fa.a1.unit09.lesson05.teach.appointment_question:
    title: "Ask what time an appointment is"
    gloss: "What time is the appointment?"
    note: "قرار ساعت چنده؟ applies lesson02's time question to a specific appointment."
  fa.a1.unit09.lesson05.teach.four_oclock:
    title: "State a time with a part of day"
    gloss: "four o'clock in the afternoon"
    note: "ساعت چهار عصر combines the hour with عصر to disambiguate morning from afternoon."

  fa.a1.unit09.lesson06.teach.tomorrow_review:
    title: "Tomorrow (review)"
    gloss: "tomorrow"
    note: "فردا was introduced in an earlier unit; it's used here to set up the appointment."
    example_gloss: "I have an appointment tomorrow."
  fa.a1.unit09.lesson06.teach.late_word:
    title: "Say you'll be a bit late"
    gloss: "I'll be a little late."
    note: "یکم دیر میشه uses the colloquial یکم (a little) and دیر (late)."
  fa.a1.unit09.lesson06.teach.turn01:
    title: "Negar asks about tomorrow's appointment time"
    gloss: "Negar asks what time tomorrow's appointment is."
    note: "قرار فردا ساعت چنده؟ combines lesson05's appointment question with فردا (tomorrow)."
  fa.a1.unit09.lesson06.teach.turn02:
    title: "Arash answers, uncertain"
    gloss: "Arash says he thinks it's four o'clock."
    note: "فکر کنم (I think) softens the answer since he isn't fully certain."
  fa.a1.unit09.lesson06.teach.turn03:
    title: "Negar asks to disambiguate morning or afternoon"
    gloss: "Negar asks if four o'clock is in the afternoon or morning."
    note: "This clarifies potential ambiguity, since ساعت چهار alone doesn't specify which four o'clock."
  fa.a1.unit09.lesson06.teach.turn04:
    title: "Arash clarifies"
    gloss: "Arash says afternoon."
    note: "A single-word answer is natural once the question has established the context."
  fa.a1.unit09.lesson06.teach.turn05:
    title: "Negar agrees and adjusts her arrival time"
    gloss: "Negar agrees and says she'll come at four-fifteen."
    note: "ساعت چهار و ربع combines the hour with ربع (quarter)."
  fa.a1.unit09.lesson06.teach.turn06:
    title: "Arash asks why the extra quarter hour"
    gloss: "Arash asks why the quarter hour."
    note: "چرا ربع؟ economically asks for an explanation."
  fa.a1.unit09.lesson06.teach.turn07:
    title: "Negar explains she'll be running a bit late"
    gloss: "Negar explains that she'll be running a little late from work."
    note: "چون (because) introduces the reason, reusing lesson06's own یکم دیر میشه (I'll be a little late)."
  fa.a1.unit09.lesson06.teach.turn08:
    title: "Arash reassures her"
    gloss: "Arash says okay, no problem."
    note: "مشکلی نیست (no problem) reassures Negar that the slight delay is fine."

exercises:
  fa.a1.unit09.lesson01.exercise01.recognize_hour:
    instruction: "What does this word mean?"
    correct_option: "hour / clock"
    distractors: [minute, half, quarter]
    accepted_answers: [{value: "hour / clock", status: correct}]
    feedback: "ساعت means hour or clock."
  fa.a1.unit09.lesson01.exercise02.recognize_half:
    instruction: "What does this word mean?"
    correct_option: half
    distractors: ["hour / clock", minute, quarter]
    accepted_answers: [{value: half, status: correct}]
    feedback: "نیم means half."
  fa.a1.unit09.lesson01.exercise03.recognize_rob_reading:
    instruction: "Which word does ربع mean?"
    correct_option: quarter
    distractors: ["hour / clock", minute, half]
    accepted_answers: [{value: quarter, status: correct}]
    feedback: "ربع means quarter."
  fa.a1.unit09.lesson01.exercise04.match_time_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {ساعت: "hour / clock", دقیقه: minute, نیم: half, ربع: quarter}, status: correct}
    feedback: "These four words are the basic building blocks for telling time."
  fa.a1.unit09.lesson01.exercise05.order_time_words:
    instruction: "Arrange the words to say half and quarter."
    accepted_answers: [{value: [نیم, و, ربع], status: correct}]
    feedback: "نیم و ربع joins the two words with و."
  fa.a1.unit09.lesson01.exercise06.translate_quarter:
    instruction: "Translate into Farsi: quarter."
    accepted_answers:
      - {value: ربع, status: correct}
    feedback: "ربع means quarter."
  fa.a1.unit09.lesson01.exercise07.write_minute:
    instruction: "Write the Farsi word for minute."
    accepted_answers:
      - {value: دقیقه, status: correct}
    feedback: "دقیقه means minute."

  fa.a1.unit09.lesson02.exercise01.recognize_what_time:
    instruction: "What does this phrase mean?"
    correct_option: "What time is it?"
    distractors: ["It's three-thirty.", "What time is the appointment?", "Why the extra quarter hour?"]
    accepted_answers: [{value: "What time is it?", status: correct}]
    feedback: "*ساعت چنده؟* asks what time it is."
  fa.a1.unit09.lesson02.exercise02.recognize_chande_meaning:
    instruction: "What does چنده mean in this question?"
    correct_option: "is what"
    distractors: ["is late", "is early", "is fine"]
    accepted_answers: [{value: "is what", status: correct}]
    feedback: "چنده contracts چند است, the colloquial way to ask 'is what number/how much.'"
  fa.a1.unit09.lesson02.exercise03.recognize_what_time_reading:
    instruction: "What does this question ask?"
    correct_option: "What time is it?"
    distractors: ["What time is the appointment?", "It's three-thirty.", "Why the extra quarter hour?"]
    accepted_answers: [{value: "What time is it?", status: correct}]
    feedback: "ساعت چنده؟ asks what time it is."
  fa.a1.unit09.lesson02.exercise04.match_time_question:
    instruction: "Match each phrase or word with its meaning."
    accepted_answers:
      - {value: {"ساعت چنده؟": "What time is it?", ساعت: "hour / clock", دقیقه: minute, نیم: half, ربع: quarter, و: and, چند: "how much / how many"}, status: correct}
    feedback: "ساعت چنده؟ is the everyday way to ask the time; چنده contracts چند (how much/many) + است, and the rest review lesson01's time vocabulary."
  fa.a1.unit09.lesson02.exercise05.order_what_time:
    instruction: "Arrange the words to ask what time it is."
    accepted_answers: [{value: [ساعت, چنده], status: correct}]
    feedback: "ساعت چنده؟ asks the time."
  fa.a1.unit09.lesson02.exercise06.translate_what_time:
    instruction: "Translate into Farsi: What time is it?"
    accepted_answers:
      - {value: "ساعت چنده؟", status: correct}
      - {value: "ساعت چنده", status: correct}
    feedback: "ساعت چنده؟ is the natural colloquial question."
  fa.a1.unit09.lesson02.exercise07.speak_ask_time:
    instruction: "Ask a friend what time it is."
    accepted_answers:
      - {value: "ساعت چنده؟", status: correct}
      - {value: "ساعت چنده", status: correct}
    feedback: "ساعت چنده؟ correctly asks the question."

  fa.a1.unit09.lesson03.exercise01.recognize_three_half:
    instruction: "What does this sentence mean?"
    correct_option: "It's three-thirty."
    distractors: ["What time is it?", "Four o'clock in the afternoon.", "What time is the appointment?"]
    accepted_answers: [{value: "It's three-thirty.", status: correct}]
    feedback: "*ساعت سه و نیمه* says it's three-thirty."
  fa.a1.unit09.lesson03.exercise02.recognize_half_meaning:
    instruction: "What does نیمه mean here?"
    correct_option: "is half"
    distractors: ["is late", "is quarter", "is early"]
    accepted_answers: [{value: "is half", status: correct}]
    feedback: "نیمه contracts نیم است, following the same pattern as چنده."
  fa.a1.unit09.lesson03.exercise03.recognize_time_telling_reading:
    instruction: "What time does this sentence give?"
    correct_option: "three-thirty"
    distractors: ["What time is it?", "four o'clock in the afternoon", "morning"]
    accepted_answers: [{value: "three-thirty", status: correct}]
    feedback: "ساعت سه و نیمه says it's three-thirty."
  fa.a1.unit09.lesson03.exercise04.match_time_telling:
    instruction: "Match each phrase or word with its meaning."
    accepted_answers:
      - {value: {"ساعت سه و نیمه": "It's three-thirty.", "ساعت چنده؟": "What time is it?", ساعت: "hour / clock", دقیقه: minute, نیم: half, ربع: quarter}, status: correct}
    feedback: "ساعت سه و نیمه tells the time using the -e contraction; the rest review earlier vocabulary, including نیم/ربع (half/quarter)."
  fa.a1.unit09.lesson03.exercise05.order_three_half:
    instruction: "Arrange the words to say it's three-thirty."
    accepted_answers: [{value: [ساعت, سه, و, نیمه], status: correct}]
    feedback: "ساعت سه و نیمه says it's three-thirty."
  fa.a1.unit09.lesson03.exercise06.translate_three_half:
    instruction: "Translate: It's three-thirty."
    accepted_answers:
      - {value: "ساعت سه و نیمه", status: correct}
    feedback: "*ساعت سه و نیمه* says it's three-thirty."
  fa.a1.unit09.lesson03.exercise07.speak_tell_time:
    instruction: "ساعت چنده؟ Answer as if it's three-thirty."
    accepted_answers:
      - {value: "ساعت سه و نیمه", status: correct}
    feedback: "ساعت سه و نیمه correctly tells the time."

  fa.a1.unit09.lesson04.exercise01.recognize_sobh:
    instruction: "What does this word mean?"
    correct_option: morning
    distractors: [noon, afternoon, night]
    accepted_answers: [{value: morning, status: correct}]
    feedback: "صبح means morning."
  fa.a1.unit09.lesson04.exercise02.recognize_asr:
    instruction: "What does this word mean?"
    correct_option: afternoon
    distractors: [morning, noon, night]
    accepted_answers: [{value: afternoon, status: correct}]
    feedback: "عصر means afternoon."
  fa.a1.unit09.lesson04.exercise03.recognize_zohr_reading:
    instruction: "Which part of the day does ظهر mean?"
    correct_option: noon
    distractors: [morning, afternoon, night]
    accepted_answers: [{value: noon, status: correct}]
    feedback: "ظهر means noon."
  fa.a1.unit09.lesson04.exercise04.match_parts_of_day:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {صبح: morning, ظهر: noon, عصر: afternoon, شب: night}, status: correct}
    feedback: "These four words cover the basic parts of the day."
  fa.a1.unit09.lesson04.exercise05.order_parts_of_day:
    instruction: "Arrange the parts of the day in order: morning, noon, afternoon, night."
    accepted_answers: [{value: [صبح, ظهر, عصر, شب], status: correct}]
    feedback: "صبح، ظهر، عصر، شب follows the natural order of a day."
  fa.a1.unit09.lesson04.exercise06.translate_night:
    instruction: "Translate into Farsi: night."
    accepted_answers:
      - {value: شب, status: correct}
    feedback: "شب means night."
  fa.a1.unit09.lesson04.exercise07.write_afternoon:
    instruction: "Write the Farsi word for afternoon."
    accepted_answers:
      - {value: عصر, status: correct}
    feedback: "عصر means afternoon."

  fa.a1.unit09.lesson05.exercise01.recognize_appointment_question:
    instruction: "What does this phrase mean?"
    correct_option: "What time is the appointment?"
    distractors: ["What time is it?", "Four o'clock in the afternoon.", "It's three-thirty."]
    accepted_answers: [{value: "What time is the appointment?", status: correct}]
    feedback: "*قرار ساعت چنده؟* asks the time of a specific appointment."
  fa.a1.unit09.lesson05.exercise02.recognize_four_afternoon:
    instruction: "What does this phrase mean?"
    correct_option: "Four o'clock in the afternoon."
    distractors: ["It's three-thirty.", "What time is the appointment?", "What time is it?"]
    accepted_answers: [{value: "Four o'clock in the afternoon.", status: correct}]
    feedback: "*ساعت چهار عصر* disambiguates the time with *عصر* (afternoon)."
  fa.a1.unit09.lesson05.exercise03.recognize_appointment_question_reading:
    instruction: "What does this question ask?"
    correct_option: "What time is the appointment?"
    distractors: ["What time is it?", "four o'clock in the afternoon", "Why the extra quarter hour?"]
    accepted_answers: [{value: "What time is the appointment?", status: correct}]
    feedback: "قرار ساعت چنده؟ asks what time the appointment is."
  fa.a1.unit09.lesson05.exercise04.match_appointment_phrases:
    instruction: "Match each phrase or word with its meaning."
    accepted_answers:
      - {value: {"قرار ساعت چنده؟": "What time is the appointment?", "ساعت چهار عصر": "four o'clock in the afternoon", قرار: appointment, صبح: morning, ظهر: noon, شب: night}, status: correct}
    feedback: "These cover asking about and stating an appointment time; the last three review lesson04's parts of the day."
  fa.a1.unit09.lesson05.exercise05.order_appointment_question:
    instruction: "Arrange the words to ask what time the appointment is."
    accepted_answers: [{value: [قرار, ساعت, چنده], status: correct}]
    feedback: "قرار ساعت چنده؟ asks about the appointment time."
  fa.a1.unit09.lesson05.exercise06.translate_appointment_question:
    instruction: "Translate into Farsi: What time is the appointment?"
    accepted_answers:
      - {value: "قرار ساعت چنده؟", status: correct}
      - {value: "قرار ساعت چنده", status: correct}
    feedback: "قرار ساعت چنده؟ is the natural way to ask."
  fa.a1.unit09.lesson05.exercise07.speak_ask_appointment:
    instruction: "Ask what time the appointment is."
    accepted_answers:
      - {value: "قرار ساعت چنده؟", status: correct}
      - {value: "قرار ساعت چنده", status: correct}
    feedback: "قرار ساعت چنده؟ correctly asks the question."

  fa.a1.unit09.lesson06.exercise01.listen_context:
    instruction: "Read the conversation. What are Negar and Arash arranging?"
    correct_option: "the exact time of tomorrow's appointment"
    distractors: ["a restaurant order", "a phone number", "a place to meet"]
    accepted_answers: [{value: "the exact time of tomorrow's appointment", status: correct}]
    feedback: "Negar and Arash confirm the exact time of an appointment tomorrow."
  fa.a1.unit09.lesson06.exercise02.recognize_meeting_time:
    instruction: "What time is the appointment?"
    correct_option: "four o'clock in the afternoon"
    distractors: ["four o'clock in the morning", "three-thirty", "noon"]
    accepted_answers: [{value: "four o'clock in the afternoon", status: correct}]
    feedback: "Arash confirms ساعت چهار عصر (four in the afternoon)."
  fa.a1.unit09.lesson06.exercise03.match_dialogue_facts:
    instruction: "Match each word from the dialogue with its English meaning."
    accepted_answers:
      - value: {قرار: appointment, فردا: tomorrow, نگار: Negar, آرش: Arash, چرا: why, دیر: late, باشه: okay, "مشکلی نیست": "it's not a problem"}
        status: correct
    feedback: "These words all appear in Negar and Arash's conversation about tomorrow's appointment time."
  fa.a1.unit09.lesson06.exercise04.order_late_reason:
    instruction: "Arrange the words: because I'll be running a little late from work."
    accepted_answers: [{value: [چون, از, سر, کار, یکم, دیر, میشه], status: correct}]
    feedback: "چون از سر کار یکم دیر میشه explains Negar's reason for arriving a bit later."
  fa.a1.unit09.lesson06.exercise05.translate_arrival_time:
    instruction: "Translate: I'll come at four-fifteen."
    accepted_answers:
      - {value: "ساعت چهار و ربع میام", status: correct}
    feedback: "*ساعت چهار و ربع میام* says I'll come at four-fifteen."
  fa.a1.unit09.lesson06.exercise06.dialogue_response_confirm:
    instruction: "Negar just explained she'll be a bit late. Reassure her that it's no problem."
    accepted_answers:
      - {value: "باشه، مشکلی نیست", status: correct}
      - {value: "باشه مشکلی نیست", status: correct}
    feedback: "باشه، مشکلی نیست reassures her."
  fa.a1.unit09.lesson06.exercise07.write_meeting_time_summary:
    instruction: "Write a short summary, quoting Negar's own words: what time is the appointment, and what time will she arrive?"
    accepted_answers:
      - {value: "قرار ساعت چهار عصر است. من ساعت چهار و ربع میام.", status: correct}
