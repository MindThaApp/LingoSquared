teaching:
  fa.a2.unit25.lesson01.teach.time_words:
    {title: 'Ever, never, yet, before, once', gloss: 'ever / up to now; never; still / yet; before; once', note: '*تا حالا* frames life experience. Use *هیچ‌وقت* with a negative verb for never, and *هنوز* with a negative verb for not yet.', example_gloss: ['Have you ever been to Shiraz?', 'I have never eaten Indian food.', 'I have not been to Isfahan yet.', 'I have seen this film before.', 'I have ridden a horse once.']}
  fa.a2.unit25.lesson01.teach.people_places:
    {title: 'People and places', gloss: 'I, you, Sara, Nima, Shiraz, Isfahan', note: 'Persian often drops *من* and *تو* because the verb ending identifies the person. Sara and Nima are established friends.', example_gloss: ['I have been to Shiraz.', 'Have you been to Isfahan?', 'Sara has been to Shiraz before.', 'Nima has not been to Isfahan yet.', 'I have been to Shiraz.', 'I have not been to Isfahan.']}
  fa.a2.unit25.lesson01.teach.experiences:
    {title: 'Food, films, and riding', gloss: 'Indian food, Korean food, film, on horseback', note: '*رو* is the spoken object marker in *این فیلم رو دیده‌م*. The expression *سوار اسب شدن* means to ride a horse.', example_gloss: ['I have eaten Indian food.', 'I have not eaten Korean food.', 'I have seen this film.', 'I have ridden a horse.']}
  fa.a2.unit25.lesson01.teach.perfect_shape:
    {title: 'The spoken present perfect', gloss: 'I have gone, eaten, seen, become / ridden', note: 'Build the present perfect from the past participle in *-ه* plus a short person ending. For “I,” spoken Persian attaches *-م*: *رفت + ه + م* → *رفته‌م*.'}
  fa.a2.unit25.lesson01.teach.negative_shape:
    {title: 'Negative present perfect', gloss: 'I have not gone, eaten, seen, become / ridden', note: 'Put *نـ* at the start of the participle: *رفته‌م* → *نرفته‌م*. With *هیچ‌وقت*, the verb must stay negative.'}
  fa.a2.unit25.lesson01.teach.written_recognition:
    {title: 'Written form: recognition only', gloss: 'رفته‌ام is the written equivalent of spoken رفته‌م', note: 'In careful writing you may see *رفته‌ام*. Recognize it, but use colloquial *رفته‌م* in this unit’s production.'}
  fa.a2.unit25.lesson02.teach.verbs:
    {title: 'Four experience verbs', gloss: 'to go, to eat, to see, to become', note: 'Their participles are *رفته، خورده، دیده، شده*. With *سوار اسب*, *شدن* forms the experience “to ride a horse.”', example_gloss: ['Going to Shiraz is nice.', 'Eating Indian food is nice.', 'Seeing this film is nice.', 'Riding a horse is nice.']}
  fa.a2.unit25.lesson02.teach.pronouns:
    {title: 'He/she, we, you, they', gloss: 'he/she, we, you (plural/polite), they', note: 'These pronouns make the person endings visible. In normal conversation, omit the pronoun when the context is already clear.', example_gloss: ['He/she has been to Shiraz.', 'We have been to Shiraz.', 'Have you been to Shiraz?', 'They have been to Shiraz.']}
  fa.a2.unit25.lesson02.teach.clitics:
    {title: 'Person endings', gloss: 'I, you, he/she, we, you plural, they have gone', note: 'The spoken set is *-م، -ای،* no ending, *-ایم، -این، -ن*. This unit drills only forms shown here.'}
  fa.a2.unit25.lesson02.teach.other_participles:
    {title: 'The same endings on other participles', gloss: 'you/he/she have eaten, seen, ridden', note: 'The person ending attaches to each participle in the same way: *خورده‌ای، دیده‌ای، شده‌ای*.'}
  fa.a2.unit25.lesson03.teach.specific_time:
    {title: 'Last year, yesterday', gloss: 'last year, yesterday', note: 'These name a finished time, so use the simple past rather than the experience present perfect.', example_gloss: ['I went to Shiraz last year.', 'I ate Indian food yesterday.']}
  fa.a2.unit25.lesson03.teach.simple_past:
    {title: 'Finished event versus experience', gloss: 'I went to Shiraz last year. I have been to Shiraz.', note: '*پارسال* names when it happened, so use *رفتم*. With *تا حالا* and no finished time, use *رفته‌م* for life experience.'}
  fa.a2.unit25.lesson04.teach.responses:
    {title: 'Yes; me too', gloss: 'yes; me too', note: 'Answer an experience question with the same present-perfect form. *منم* means “me too.”', example_gloss: ['Yes, I have been once.', 'I have not eaten it yet either.']}
  fa.a2.unit25.lesson04.teach.question_pattern:
    {title: 'Have you ever been to Shiraz?', gloss: 'Have you ever been to Shiraz?', note: 'Use *تا حالا* plus the second-person present perfect *رفته‌ای؟* to ask about experience. In everyday speech people often use the simple past with *تا حالا* instead: *تا حالا رفتی؟*. Both are fine.'}
  fa.a2.unit25.lesson05.teach.reading:
    {title: 'An experience message', gloss: 'I have been to Shiraz and have eaten Indian food before. I have never ridden a horse and have not eaten Korean food yet. Have you ever been to Shiraz?', note: 'Read once for experiences that happened, then again for experiences that have never happened or have not happened yet.'}
  fa.a2.unit25.lesson06.teach.turn01: {title: 'Sara asks Nima', gloss: 'Nima, have you ever been to Shiraz?', note: 'Sara asks an experience question with *تا حالا*.'}
  fa.a2.unit25.lesson06.teach.turn02: {title: 'Nima answers and asks', gloss: 'Yes, I have been once. Have you ever eaten Indian food?', note: 'Nima gives one experience and returns a new experience question.'}
  fa.a2.unit25.lesson06.teach.turn03: {title: 'Sara contrasts two foods', gloss: 'Yes, I have eaten it before, but I have never eaten Korean food.', note: '*ولی* contrasts a positive experience with something Sara has never done.'}
  fa.a2.unit25.lesson06.teach.turn04: {title: 'Nima agrees', gloss: 'I have not eaten it yet either.', note: '*هنوز نخورده‌م* means it has not happened up to now.'}
