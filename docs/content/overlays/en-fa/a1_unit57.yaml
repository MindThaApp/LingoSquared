review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Draft overlay paired with the fa.a1.unit57.zoo realization. See that
    file's generation_provenance for the honest source-access result: tried
    `firecrawl search "FSI Persian Basic Course zoo باغ‌وحش animals lion
    elephant"` first, per the standing instruction to re-check Firecrawl
    quota fresh even though it has been reported exhausted in every earlier
    round this session -- it returned `Error: Request failed with status
    code 402` (payment required), confirming the account genuinely remains
    at 0 credits. This worker session had no cached local pdftotext
    extraction inherited from any prior session (scratchpad directories are
    session-isolated), so it freshly fetched the same public-domain Live
    Lingua-hosted FSI Spoken Persian PDF directly via curl (8,753,270
    bytes, the same size prior units report) and ran pdftotext -layout
    locally (17,130 lines, 66,717 words -- also matching prior units'
    counts). Grepped case-insensitively for zoo/elephant/lion/monkey/"wild
    animal"/"animal cage": found exactly 2 hits, neither a real zoo
    scenario -- "meymun" (monkey) inside a pure diphthong-illustration
    phonology table (not a scenario), and "sir" glossed as a "milk; lion;
    faucet" homograph note inside an unrelated hotel-plumbing dialogue
    (the "faucet" sense is the one actually used there). FSI Persian's own
    course does not cover a zoo visit at all -- disclosing honestly that
    nothing usable was found, same as the park/museum/concert/gym/beach
    units before it. All vocabulary and the full dialogue are authored
    fresh from this project's own established conventions.

    Scenario note: universal.a1.zoo.visit_the_zoo's prerequisite pair
    (animals + plans) does not include money, unlike museum/cinema/concert
    -- so, per the same judgment call units 54/56 already made for their
    own non-money prerequisite pair, this unit is a friends'-plan scene
    reusing the established سارا/نیما friend pair rather than introducing a
    new named service clerk; there is no transaction in the dialogue
    itself. The outcome's own read_zoo_sign requirement names "a ticket
    price, or a feeding time" (an "or," not both), so lesson05's reading
    sign states a ticket price and opening hours only -- feeding time was
    deliberately left off rather than inventing new "time"/"feeding"
    vocabulary the outcome doesn't actually require, since ticket price
    alone satisfies the requirement. The zoo is named ارم (Eram, after
    Tehran's real well-known city zoo) rather than reusing نور (beach,
    two units ago) or ملت (park) for an unrelated place.

    Reuse chain: بریم (unit07/12/54/56), می‌خوای (unit12), چطوره
    (unit01/07/12/54/56), باشه (unit03), عالیه (unit07), کدوم (unit10),
    رو (unit06), یا (unit06), داره/بزرگه (unit26), دوست/داری/دارم
    (unit14's own "کدوم رو دوست داری؟" phrase reused verbatim as a
    callback, dارم from unit14/24), و (unit26), تو/چی (unit07's "فردا
    چی؟"), من (unit03), می‌بینمت (unit54/56), بلیط (unit16), پنجاه/هزار/
    تومنه (unit03), از (unit01), ساعت (unit09), نه/پنج (unit03), تا
    (unit03), بازه (unit24), چطور (unit01), بود (unit06), باحال
    (unit36). New vocabulary genuinely introduced for the first time in
    the whole corpus: باغ‌وحش (zoo -- this unit's own topic word), شیر
    (lion), and فیل (elephant) -- exactly 3 new words, within this
    course's 2-4 new-word range (unit54: 3, unit55: 2, unit56: 3). Both
    confirmed genuinely unclaimed via a real grep excluding false-positive
    substring hits (شیر never appears standalone anywhere in the corpus;
    فیل only ever appears inside فیلم, "film/movie," never as its own
    token). One new inflected verb surface form, not new vocabulary:
    ببینیم ("let's see," 1st-person-plural subjunctive of the
    already-taught دیدن, unit24) -- the same kind of single-unit
    inflection extension unit54's بزنیم and unit55's داریم already
    established. The ticket price (50,000 toman) and opening hours (9-5)
    are stated exactly once, in lesson05's reading sign only -- the
    friends'-plan dialogue itself never states a price or hours, so there
    is a single authoritative statement of each fact per AUTHORING_
    GUIDE.md #11 rather than a multi-statement cross-check.

    Every "Translate into English" exercise below explicitly sets
    answer_language_code: en. No exercise in this unit tests a genuine
    two-clause sentence joined by "and"/comma (§12) -- every genuinely
    multi-sentence line (dialogue lines 3/4, the reading sign, the
    wrap-up review) is authored as separate short sentences in both
    languages, matching units 44-56's own convention. No fill_in_blank
    exercise is used anywhere in this unit, matching units 54-56's own
    choice, so no §17 ambiguity-check exposure. No listen_type/
    listen_select/listen_order exercise is used anywhere in this unit
    (continuing the established text-based corpus-consistency pattern
    from units 19-56, even though fa now has real Azure TTS per §14) --
    the spine outcome's "listening" assessment requirement is covered via
    the dialogue_comprehension exercise's comprehension-of-the-exchange
    task, the same interpretation units 41-56 already established.
    Checked the same-speaker/same-audio distractor-collision bug class
    (fixed 2026-07-09 in the nl corpus, commit 148240e) anyway, per the
    standing instruction to list every line each speaker says before
    writing distractors: نیما says "سارا، می‌خوای بریم باغ‌وحش؟"/"فیل رو
    دوست دارم. تو چی؟"/"باشه، بریم!"; سارا says "باشه، عالیه! کدوم رو
    دوست داری، شیر یا فیل؟"/"من شیر رو دوست دارم. بریم شیر و فیل
    ببینیم!"/"می‌بینمت." -- lesson04's dialogue_comprehension distractors
    ("She asks what time the zoo opens."/"She asks how much the ticket
    costs."/"She asks if Nima wants to go home.") are plausible-fact
    alternatives, not lines either speaker actually says or facts either
    speaker actually states anywhere in this unit's dialogue audio (the
    price/hours live in a separate lesson05 reading sign, not the
    dialogue) -- the zoo's opening time, the ticket cost, and going home
    are never mentioned by either character in the dialogue. The
    dialogue_response exercise (lesson04) accepts نیما's own actual next
    line, not a distractor set, so this check doesn't apply to it.
    Boolean-coercion check: ran a recursive scan over title/gloss/note/
    example_gloss/answer/matching-pair value fields (including
    matching_pairs right: values specifically) across both this overlay
    and the paired realization for bare yes/no/true/false/on/off string
    values or coerced booleans, plus a full yaml.safe_load parse of both
    files confirming every loaded value is a str/list/dict rather than a
    Python bool -- zero hits. Persian-vs-Arabic codepoint scan (Arabic
    kaf U+0643/yeh U+064A) across both files -- zero hits. Compiler
    validation, both standalone and against the full 57-unit en-fa A1
    corpus with position-matched realization/overlay lists, confirmed 0
    errors/0 warnings (see this task's final report for the exact command
    and output).

course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: proposing a trip to the zoo, saying which
    animal (a lion or an elephant) you like, suggesting going to see them,
    and briefly saying how the zoo was afterward, plus reading/writing a
    short zoo sign naming the zoo, its ticket price, and its opening
    hours.

units:
  fa.a1.unit57.zoo: {title: Zoo}

lessons:
  fa.a1.unit57.lesson01.new_zoo_one: {title: "New words 1"}
  fa.a1.unit57.lesson02.new_zoo_two: {title: "New words 2"}
  fa.a1.unit57.lesson03.suggest_animal: {title: "Suggest an animal"}
  fa.a1.unit57.lesson04.zoo_dialogue: {title: "Dialogue: at the zoo"}
  fa.a1.unit57.lesson05.reading_zoo_sign: {title: "Reading a zoo sign"}
  fa.a1.unit57.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit57.lesson01.teach.review_beriim_mikhaay:
    title: "Review: let's go / do you want"
    gloss: "let's go / do you want"
    note: "*بریم* ('let's go') was already taught in unit07/12/54/56; *می‌خوای* ('do you want') was already taught in unit12."
  fa.a1.unit57.lesson01.teach.review_chetore:
    title: "Review: how is it"
    gloss: "how is it"
    note: "*چطوره* ('how is it') was already taught in unit01/07/12/54/56."
  fa.a1.unit57.lesson01.teach.review_bashe_aaliye:
    title: "Review: okay / great"
    gloss: "okay / great"
    note: "*باشه* ('okay') was already taught in unit03; *عالیه* ('great') was already taught in unit07."
  fa.a1.unit57.lesson01.teach.baghvahsh:
    title: Zoo
    gloss: zoo
    note: "*باغ‌وحش* means 'zoo.'"
    example_gloss: "Shall we go to the zoo?"

  fa.a1.unit57.lesson02.teach.review_kodum_ro_ya:
    title: "Review: which / (object marker) / or"
    gloss: "which / (object marker) / or"
    note: "*کدوم* ('which') was already taught in unit10; *رو* (object marker) was already taught in unit06; *یا* ('or') was already taught in unit06."
  fa.a1.unit57.lesson02.teach.review_dare_bozorge:
    title: "Review: it has / it's big"
    gloss: "it has / it's big"
    note: "*داره* ('it has') and *بزرگه* ('it's big') were already taught in unit26."
  fa.a1.unit57.lesson02.teach.shir:
    title: Lion
    gloss: lion
    note: "*شیر* means 'lion.'"
    example_gloss: "The zoo has a lion."
  fa.a1.unit57.lesson02.teach.fil:
    title: Elephant
    gloss: elephant
    note: "*فیل* means 'elephant.'"
    example_gloss: "The zoo has an elephant."

  fa.a1.unit57.lesson03.teach.review_doost_daari_daram:
    title: "Review: do you like / I like"
    gloss: "do you like / I like"
    note: "*دوست داری* ('do you like') was already taught in unit14; *دوست دارم* ('I like') was already taught in unit14/24."
  fa.a1.unit57.lesson03.teach.review_va:
    title: "Review: and"
    gloss: and
    note: "*و* ('and') was already taught in unit26."
  fa.a1.unit57.lesson03.teach.phrase_kodum_shir_ya_fil:
    title: "Which do you like, the lion or the elephant?"
    gloss: "Which do you like, the lion or the elephant?"
    note: "Combines the already-known *کدوم رو دوست داری* (unit14) with this unit's *شیر* and *فیل*."
  fa.a1.unit57.lesson03.teach.phrase_beriim_shir_fil_bebinim:
    title: "Let's go see the lion and the elephant!"
    gloss: "Let's go see the lion and the elephant!"
    note: "*ببینیم* ('let's see') is the 1st-person-plural form of *دیدن* ('to see'), already taught in unit24 -- a new inflected form of an already-known verb, not a new word."

  fa.a1.unit57.lesson04.teach.dialogue_line1:
    title: "Nima: Sara, do you want to go to the zoo?"
    gloss: "Sara, do you want to go to the zoo?"
  fa.a1.unit57.lesson04.teach.dialogue_line2:
    title: "Sara: Okay, great! Which do you like, the lion or the elephant?"
    gloss: "Okay, great! Which do you like, the lion or the elephant?"
  fa.a1.unit57.lesson04.teach.dialogue_line3:
    title: "Nima: I like the elephant. What about you?"
    gloss: "I like the elephant. What about you?"
  fa.a1.unit57.lesson04.teach.dialogue_line4:
    title: "Sara: I like the lion. Let's go see the lion and the elephant!"
    gloss: "I like the lion. Let's go see the lion and the elephant!"
  fa.a1.unit57.lesson04.teach.dialogue_line5:
    title: "Nima: Okay, let's go!"
    gloss: "Okay, let's go!"
  fa.a1.unit57.lesson04.teach.dialogue_line6:
    title: "Sara: See you."
    gloss: "See you."

  fa.a1.unit57.lesson05.teach.reading_text:
    title: "Reading: a zoo sign"
    gloss: "Eram Zoo: ticket 50,000 toman. Open from nine to five. Has a lion and an elephant."
    note: "A short zoo sign naming the zoo, the ticket price, its opening hours, and that it has a lion and an elephant."

  fa.a1.unit57.lesson06.teach.review_beriim_baghvahsh:
    title: "Shall we go to the zoo?"
    gloss: "Shall we go to the zoo?"
  fa.a1.unit57.lesson06.teach.review_kodum_shir_ya_fil:
    title: "Which do you like, the lion or the elephant?"
    gloss: "Which do you like, the lion or the elephant?"
  fa.a1.unit57.lesson06.teach.review_afterward:
    title: "How was the zoo? It was fun!"
    gloss: "How was the zoo? It was fun!"
  fa.a1.unit57.lesson06.teach.summary_words:
    title: "Zoo / lion / elephant / let's go see"
    gloss: "zoo / lion / elephant / let's go see"
    note: "These are the key words and phrases taught in this unit."

exercises:
  fa.a1.unit57.lesson01.exercise01.recognize_baghvahsh:
    instruction: "What does this word mean?"
    correct_option: zoo
    distractors: [park, beach, gym]
    accepted_answers: [{value: zoo, status: correct}]
    feedback: "باغ‌وحش means 'zoo.'"
  fa.a1.unit57.lesson01.exercise02.recognize_baghvahsh_beriim:
    instruction: "What does this sentence mean?"
    correct_option: "Shall we go to the zoo?"
    distractors: ["Is the zoo open?", "The zoo is far.", "I don't want to go to the zoo."]
    accepted_answers: [{value: "Shall we go to the zoo?", status: correct}]
    feedback: "باغ‌وحش بریم؟ means 'Shall we go to the zoo?'"
  fa.a1.unit57.lesson01.exercise03.match_zoo_one:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {بریم: "let's go", "می‌خوای": "do you want", چطوره: "how is it", باشه: okay, عالیه: great, "باغ‌وحش": zoo}
        status: correct
    feedback: "These are the first new zoo words for this unit."
  fa.a1.unit57.lesson01.exercise04.word_order_baghvahsh_beriim:
    instruction: "Put the words in order."
    accepted_answers: [{value: ["باغ‌وحش", بریم], status: correct}]
    feedback: "باغ‌وحش بریم means 'Let's go to the zoo.'"
  fa.a1.unit57.lesson01.exercise05.translate_baghvahsh_chetore:
    instruction: "Translate into English: باغ‌وحش چطوره؟"
    answer_language_code: en
    accepted_answers:
      - {value: "How's the zoo?", status: correct}
      - {value: "What's the zoo like?", status: correct}
    feedback: "باغ‌وحش چطوره؟ means 'How's the zoo?'"

  fa.a1.unit57.lesson02.exercise01.recognize_shir:
    instruction: "What does this word mean?"
    correct_option: lion
    distractors: [elephant, monkey, bird]
    accepted_answers: [{value: lion, status: correct}]
    feedback: "شیر means 'lion.'"
  fa.a1.unit57.lesson02.exercise02.recognize_fil:
    instruction: "What does this word mean?"
    correct_option: elephant
    distractors: [lion, zoo, bear]
    accepted_answers: [{value: elephant, status: correct}]
    feedback: "فیل means 'elephant.'"
  fa.a1.unit57.lesson02.exercise03.match_zoo_two:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {کدوم: which, رو: "(object marker)", یا: or, داره: "it has", شیر: lion, فیل: elephant}
        status: correct
    feedback: "These words let you talk about the zoo's animals."
  fa.a1.unit57.lesson02.exercise04.word_order_baghvahsh_shir_dare:
    instruction: "Put the words in order."
    accepted_answers: [{value: ["باغ‌وحش", شیر, داره], status: correct}]
    feedback: "باغ‌وحش شیر داره means 'The zoo has a lion.'"
  fa.a1.unit57.lesson02.exercise05.translate_fil_bozorge:
    instruction: "Translate into English: فیل بزرگه"
    answer_language_code: en
    accepted_answers:
      - {value: "The elephant is big.", status: correct}
      - {value: "The elephant is big", status: correct}
    feedback: "فیل بزرگه means 'The elephant is big.'"

  fa.a1.unit57.lesson03.exercise01.recognize_kodum_shir_ya_fil:
    instruction: "What does this sentence mean?"
    correct_option: "Which do you like, the lion or the elephant?"
    distractors: ["Which do you like, the park or the beach?", "Do you like the zoo?", "Is the lion big?"]
    accepted_answers: [{value: "Which do you like, the lion or the elephant?", status: correct}]
    feedback: "کدوم رو دوست داری، شیر یا فیل؟ means 'Which do you like, the lion or the elephant?'"
  fa.a1.unit57.lesson03.exercise02.recognize_beriim_shir_fil_bebinim:
    instruction: "What does this sentence mean?"
    correct_option: "Let's go see the lion and the elephant!"
    distractors: ["Let's go see the park!", "I don't want to see the elephant.", "The lion is far."]
    accepted_answers: [{value: "Let's go see the lion and the elephant!", status: correct}]
    feedback: "بریم شیر و فیل ببینیم! means 'Let's go see the lion and the elephant!'"
  fa.a1.unit57.lesson03.exercise03.match_suggest_animal:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {دوست: like, داری: "(you) like", شیر: lion, فیل: elephant, یا: or, ببینیم: "let's see"}
        status: correct
    feedback: "These words let you suggest going to see an animal."
  fa.a1.unit57.lesson03.exercise04.word_order_shir_bebinim:
    instruction: "Put the words in order."
    accepted_answers: [{value: [شیر, ببینیم], status: correct}]
    feedback: "شیر ببینیم means 'Let's see the lion.'"
  fa.a1.unit57.lesson03.exercise05.translate_fil_ro_doost_daram:
    instruction: "Translate into English: فیل رو دوست دارم"
    answer_language_code: en
    accepted_answers:
      - {value: "I like the elephant.", status: correct}
      - {value: "I like the elephant", status: correct}
    feedback: "فیل رو دوست دارم means 'I like the elephant.'"

  fa.a1.unit57.lesson04.exercise01.dialogue_comprehension_which_animal:
    instruction: "Sara asks Nima something. What does she ask?"
    correct_option: "She asks which animal he likes, the lion or the elephant."
    distractors:
      - "She asks what time the zoo opens."
      - "She asks how much the ticket costs."
      - "She asks if Nima wants to go home."
    accepted_answers: [{value: "She asks which animal he likes, the lion or the elephant.", status: correct}]
    feedback: "کدوم رو دوست داری، شیر یا فیل؟ means 'Which do you like, the lion or the elephant?'"
  fa.a1.unit57.lesson04.exercise02.recognize_dialogue_line4:
    instruction: "What does this sentence mean?"
    correct_option: "I like the lion. Let's go see the lion and the elephant!"
    distractors:
      - "I like the elephant. Let's go home."
      - "I don't like the zoo today."
      - "The lion is far from here."
    accepted_answers: [{value: "I like the lion. Let's go see the lion and the elephant!", status: correct}]
    feedback: "من شیر رو دوست دارم. بریم شیر و فیل ببینیم means 'I like the lion. Let's go see the lion and the elephant!'"
  fa.a1.unit57.lesson04.exercise03.match_dialogue_zoo:
    instruction: "Match each line with its meaning."
    accepted_answers:
      - value: {"سارا، می‌خوای بریم باغ‌وحش؟": "Sara, do you want to go to the zoo?", "باشه، عالیه! کدوم رو دوست داری، شیر یا فیل؟": "Okay, great! Which do you like, the lion or the elephant?", "فیل رو دوست دارم. تو چی؟": "I like the elephant. What about you?", "من شیر رو دوست دارم. بریم شیر و فیل ببینیم!": "I like the lion. Let's go see the lion and the elephant!", "باشه، بریم!": "Okay, let's go!", "می‌بینمت.": "See you."}
        status: correct
    feedback: "These lines appear in the zoo conversation between Nima and Sara."
  fa.a1.unit57.lesson04.exercise04.dialogue_response_okay_lets_go:
    instruction: "Respond to من شیر رو دوست دارم. بریم شیر و فیل ببینیم! by saying okay, let's go."
    accepted_answers:
      - {value: "باشه، بریم!", status: correct}
      - {value: "باشه، بریم", status: correct}
      - {value: "باشه بریم!", status: correct}
      - {value: "باشه بریم", status: correct}
    feedback: "باشه، بریم! means 'Okay, let's go!'"
  fa.a1.unit57.lesson04.exercise05.translate_dialogue_line1:
    instruction: "Translate into English: سارا، می‌خوای بریم باغ‌وحش؟"
    answer_language_code: en
    accepted_answers:
      - {value: "Sara, do you want to go to the zoo?", status: correct}
      - {value: "Sara, do you want to go to the zoo", status: correct}
    feedback: "سارا، می‌خوای بریم باغ‌وحش؟ means 'Sara, do you want to go to the zoo?'"

  fa.a1.unit57.lesson05.exercise01.reading_comprehension_place:
    instruction: "According to the sign, what kind of place is this?"
    correct_option: "Zoo."
    distractors:
      - "Park."
      - "Gym."
      - "Beach."
    accepted_answers: [{value: "Zoo.", status: correct}]
    feedback: "باغ‌وحش means 'zoo' -- the sign is for a zoo."
  fa.a1.unit57.lesson05.exercise02.reading_comprehension_price:
    instruction: "According to the sign, how much is the ticket?"
    correct_option: "50,000 toman."
    distractors:
      - "5,000 toman."
      - "500,000 toman."
      - "It's free."
    accepted_answers: [{value: "50,000 toman.", status: correct}]
    feedback: "بلیط پنجاه هزار تومنه means 'ticket 50,000 toman.'"
  fa.a1.unit57.lesson05.exercise03.match_reading_zoo_sign:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {"باغ‌وحش": zoo, ارم: Eram, بلیط: ticket, پنجاه: fifty, هزار: thousand, تومنه: "it's toman", شیر: lion, فیل: elephant}
        status: correct
    feedback: "These words let you understand the zoo sign."
  fa.a1.unit57.lesson05.exercise04.translate_reading_zoo_sign:
    instruction: "Translate into English: باغ‌وحش ارم: بلیط پنجاه هزار تومنه. از ساعت نه تا پنج بازه. شیر و فیل داره."
    answer_language_code: en
    accepted_answers:
      - {value: "Eram Zoo: ticket 50,000 toman. Open from nine to five. Has a lion and an elephant.", status: correct}
      - {value: "Eram Zoo, ticket 50,000 toman, open from nine to five, has a lion and an elephant.", status: correct}
    feedback: "باغ‌وحش ارم: بلیط پنجاه هزار تومنه. از ساعت نه تا پنج بازه. شیر و فیل داره means 'Eram Zoo: ticket 50,000 toman. Open from nine to five. Has a lion and an elephant.'"
  fa.a1.unit57.lesson05.exercise05.write_zoo_sign:
    instruction: "Write a short zoo sign naming the ticket price, the opening hours, and what animals it has, using this sign's pattern."
