    می‌خوای (unit12/14/16/20/35), پس/می‌دم (unit42, reused grammatical
    pattern with a new item, not verbatim content), کی (unit34/42), تا
    (unit42), فردا/ظهر (unit09), سلام/ممنون (units01/17/22/45/46), آقای
    (units40/42/44/46), لطفاً (unit21), باشه (units01/02/06/17/22/45/46).
    New vocabulary genuinely introduced for the first time in the whole
    corpus: کرایه (rent/rental fee) and ودیعه (deposit) -- exactly 2 new
    words, no new verb-conjugation pattern introduced. Register note: نیما
    (the established recurring character) is the bike-rental customer; a
    new formal-register character, آقای مرادی, is the bike shop owner,
    distinct from unit40's آقای کریمی, unit41's خانم احمدی, unit42's آقای
