course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: renting a bicycle, asking for a size (small or
    big), understanding the daily rental price and deposit, agreeing on a
    return time, a full customer-to-shop-owner exchange, and reading/
    writing a short bicycle-rental sign naming the price and deposit.

units:
  fa.a1.unit47.bike_rental:
    title: Bicycle rental

lessons:
  fa.a1.unit47.lesson01.new_bike_rental_one: {title: "New words 1"}
  fa.a1.unit47.lesson02.new_bike_rental_two: {title: "New words 2"}
  fa.a1.unit47.lesson03.size_and_return: {title: "Size and returning it"}
  fa.a1.unit47.lesson04.bike_rental_dialogue: {title: "Dialogue: renting a bicycle"}
  fa.a1.unit47.lesson05.reading_rental_sign: {title: "Reading a bicycle-rental sign"}
  fa.a1.unit47.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit47.lesson01.teach.review_docharkhe:
    title: "Review: bicycle"
    gloss: bicycle
    note: "*دوچرخه* ('bicycle') was covered earlier."
  fa.a1.unit47.lesson01.teach.review_mikhaam_ye:
    title: "Review: I want / a"
    gloss: "I want / a"
    note: "*می‌خوام* ('I want') was covered earlier; *یه* ('a, an') was covered earlier."
  fa.a1.unit47.lesson01.teach.review_kardan_konam:
    title: "Review: to do / that I do"
    gloss: "to do / that I do"
    note: "*کردن* ('to do') was covered earlier; *کنم* ('that I do') was covered earlier's *می‌خوام... کنم* pattern."
  fa.a1.unit47.lesson01.teach.keraye:
    title: Rent
    gloss: "rent, rental fee"
    note: "*کرایه* means 'rent' or 'rental fee.'"
    example_gloss: "I want to rent a bicycle."

  fa.a1.unit47.lesson02.teach.review_roozi_price:
    title: "Review: per day / five / thousand / toman"
    gloss: "per day / five / thousand / toman"
    note: "*روزی* ('per day') was covered earlier; *پنج* ('five'), *هزار* ('thousand'), and *تومن* ('toman') were covered earlier."
  fa.a1.unit47.lesson02.teach.review_ham_mikhaad:
    title: "Review: also / it needs / ten"
    gloss: "also / it needs / ten"
    note: "*هم* ('also') was covered earlier; *می‌خواد* ('it needs/wants') was covered earlier; *ده* ('ten') was covered earlier."
  fa.a1.unit47.lesson02.teach.vadiye:
    title: Deposit
    gloss: deposit
    note: "*ودیعه* means 'deposit.'"
    example_gloss: "It needs a 10,000 toman deposit."

  fa.a1.unit47.lesson03.teach.review_koochik_bozorg_ya:
    title: "Review: small / big / or"
    gloss: "small / big / or"
    note: "*کوچیک* ('small') and *بزرگ* ('big') were covered earlier; *یا* ('or') was covered earlier."
  fa.a1.unit47.lesson03.teach.review_mikhaay:
    title: "Review: you want"
    gloss: "you want"
    note: "*می‌خوای* ('you want') was covered earlier."
  fa.a1.unit47.lesson03.teach.koochik_ya_bozorg:
    title: "Small or big?"
    gloss: "Do you want small or big?"
    note: "A question asking which size you want, using only already-known words."
  fa.a1.unit47.lesson03.teach.review_pas_midam_key:
    title: "Review: back / I give / when"
    gloss: "back / I give / when"
    note: "*پس* ('back') and *می‌دم* ('I give') were covered earlier; *کی* ('when') was covered earlier."
  fa.a1.unit47.lesson03.teach.key_pas_midam:
    title: "When do I give it back?"
    gloss: "When do I give it back?"
    note: "The same *کی پس می‌دم؟* pattern Unit 42 used for returning a library book, reused here for returning a rented bicycle."
  fa.a1.unit47.lesson03.teach.review_ta_farda_zohr:
    title: "Review: until / tomorrow / noon"
    gloss: "until / tomorrow / noon"
    note: "*تا* ('until') was covered earlier; *فردا* ('tomorrow') and *ظهر* ('noon') were covered earlier."

  fa.a1.unit47.lesson04.teach.review_salam_mamnoon:
    title: "Review: hi / thanks"
    gloss: "hi / thanks"
    note: "*سلام* and *ممنون* were covered earlier."
  fa.a1.unit47.lesson04.teach.review_aghaye_lotfan_bashe:
    title: "Review: Mr. / please / okay"
    gloss: "Mr. / please / okay"
    note: "*آقای* ('Mr.') was covered earlier; *لطفاً* ('please') was covered earlier; *باشه* ('okay') was covered earlier."
  fa.a1.unit47.lesson04.teach.character_moradi:
    title: "Mr. Moradi"
    gloss: "Mr. Moradi"
    note: "*آقای مرادی* ('Mr. Moradi') is the bicycle-shop owner in this unit's dialogue."
    example_gloss: "Mr. Moradi rents out bicycles."
  fa.a1.unit47.lesson04.teach.dialogue_line1:
    title: "Nima: Hi Mr. Moradi. I want to rent a bicycle."
    gloss: "Hi Mr. Moradi. I want to rent a bicycle."
  fa.a1.unit47.lesson04.teach.dialogue_line2:
    title: "Mr. Moradi: Hi Nima. Do you want small or big?"
    gloss: "Hi Nima. Do you want small or big?"
  fa.a1.unit47.lesson04.teach.dialogue_line3:
    title: "Nima: Big, please."
    gloss: "Big, please."
  fa.a1.unit47.lesson04.teach.dialogue_line4:
    title: "Mr. Moradi: Okay. It's 5,000 toman a day. It also needs a 10,000 toman deposit."
    gloss: "Okay. It's 5,000 toman a day. It also needs a 10,000 toman deposit."
  fa.a1.unit47.lesson04.teach.dialogue_line5:
    title: "Nima: Okay. When do I give it back?"
    gloss: "Okay. When do I give it back?"
  fa.a1.unit47.lesson04.teach.dialogue_line6:
    title: "Mr. Moradi: Until tomorrow noon."
    gloss: "Until tomorrow noon."
  fa.a1.unit47.lesson04.teach.dialogue_line7:
    title: "Nima: Thanks!"
    gloss: "Thanks!"

  fa.a1.unit47.lesson05.teach.review_docharkheye:
    title: "Review: bicycle of"
    gloss: "bicycle of"
    note: "*دوچرخه‌ی* is the ezafe form of *دوچرخه* ('bicycle'), covered earlier."
  fa.a1.unit47.lesson05.teach.reading_text:
    title: "Reading: a bicycle-rental sign"
    gloss: "Moradi's bicycles: rent, 5,000 toman a day. It also needs a 10,000 toman deposit."
    note: "A short shop sign naming the service, the price, and the deposit."

  fa.a1.unit47.lesson06.teach.review_request:
    title: "I want to rent a bicycle."
    gloss: "I want to rent a bicycle."
    note: "A full review sentence reusing only already-known words from this unit."
  fa.a1.unit47.lesson06.teach.review_price_deposit:
    title: "It's 5,000 toman a day. It also needs a 10,000 toman deposit."
    gloss: "It's 5,000 toman a day. It also needs a 10,000 toman deposit."
  fa.a1.unit47.lesson06.teach.summary_words:
    title: "Rent / deposit / bicycle / small / big / When do I give it back?"
    gloss: "rent / deposit / bicycle / small / big / when do I give it back?"
    note: "These are the key words and phrase taught in this unit."

exercises:
  fa.a1.unit47.lesson01.exercise01.recognize_keraye:
    instruction: "What does this word mean?"
    correct_option: rent
    distractors: [bicycle, deposit, price]
    accepted_answers: [{value: rent, status: correct}]
    feedback: "*کرایه* means rent (rental fee)."
  fa.a1.unit47.lesson01.exercise02.recognize_mikhaam_ye_docharkhe_keraye_konam:
    instruction: "What does this sentence mean?"
    correct_option: "I want to rent a bicycle."
    distractors: ["I want to buy a bicycle.", "I want to fix a bicycle.", "I have a bicycle."]
    accepted_answers: [{value: "I want to rent a bicycle.", status: correct}]
    feedback: "*می‌خوام یه دوچرخه کرایه کنم* means 'I want to rent a bicycle.'"
  fa.a1.unit47.lesson01.exercise03.match_bike_rental_one:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {کرایه: rent, دوچرخه: bicycle, "می‌خوام": "I want", یه: a, کنم: "(that) I do", "می‌خوام یه دوچرخه کرایه کنم.": "I want to rent a bicycle."}
        status: correct
    feedback: "These are the first new bicycle-rental words for this unit."
  fa.a1.unit47.lesson01.exercise04.word_order_mikhaam_ye_docharkhe_keraye_konam:
    instruction: "Put the words in order."
    accepted_answers: [{value: ["می‌خوام", یه, دوچرخه, کرایه, کنم], status: correct}]
    feedback: "*می‌خوام یه دوچرخه کرایه کنم* means 'I want to rent a bicycle.'"
  fa.a1.unit47.lesson01.exercise05.translate_docharkhe_keraye:
    instruction: "Translate into English: کرایه دوچرخه"
    answer_language_code: en
    accepted_answers:
      - {value: "Bicycle rental.", status: correct}
      - {value: "Bicycle rental", status: correct}
      - {value: "bicycle rental", status: correct}
      - {value: "Bicycle rent.", status: correct}
      - {value: "Bike rental.", status: correct}
      - {value: "Bike rental", status: correct}
      - {value: "Rental of a bicycle", status: correct}
    feedback: "*کرایه‌ی دوچرخه* means 'bicycle rental.'"

  fa.a1.unit47.lesson02.exercise01.recognize_vadiye:
    instruction: "What does this word mean?"
    correct_option: deposit
    distractors: [rent, price, change]
    accepted_answers: [{value: deposit, status: correct}]
    feedback: "*ودیعه* means 'deposit.'"
  fa.a1.unit47.lesson02.exercise02.recognize_roozi_panj_hezar_tomane:
    instruction: "What does this sentence mean?"
    correct_option: "It's 5,000 toman a day."
    distractors: ["It's 500 toman a day.", "It's 5,000 toman total.", "It's free."]
    accepted_answers: [{value: "It's 5,000 toman a day.", status: correct}]
    feedback: "*روزی پنج هزار تومنه* means 'It's 5,000 toman a day.'"
  fa.a1.unit47.lesson02.exercise03.match_bike_rental_two:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {ودیعه: deposit, روزی: "per day", پنج: five, هزار: thousand, تومن: toman, ده: ten, "می‌خواد": "it needs"}
        status: correct
    feedback: "These words let you understand the rental price and deposit."
  fa.a1.unit47.lesson02.exercise04.word_order_dah_hezar_toman_vadiye_mikhaad:
    instruction: "Put the words in order."
    accepted_answers: [{value: [ده, هزار, تومن, ودیعه, "می‌خواد"], status: correct}]
    feedback: "*ده هزار تومن ودیعه می‌خواد* means 'It needs a 10,000 toman deposit.'"
  fa.a1.unit47.lesson02.exercise05.translate_roozi_panj_hezar_tomane:
    instruction: "Translate into English: روزی پنج هزار تومنه."
    answer_language_code: en
    accepted_answers:
      - {value: "It's 5,000 toman a day.", status: correct}
      - {value: "It's 5,000 toman a day", status: correct}
      - {value: "It's 5,000 toman per day.", status: correct}
      - {value: "It costs 5,000 toman a day.", status: correct}
      - {value: "5,000 toman a day.", status: correct}
    feedback: "*روزی پنج هزار تومنه* means 'It's 5,000 toman a day.'"

  fa.a1.unit47.lesson03.exercise01.recognize_koochik_ya_bozorg:
    instruction: "What does this sentence mean?"
    correct_option: "Do you want small or big?"
    distractors: ["Do you want one or two?", "Is it small or big?", "Do you want cheap or expensive?"]
    accepted_answers: [{value: "Do you want small or big?", status: correct}]
    feedback: "*کوچیک می‌خوای یا بزرگ؟* means 'Do you want small or big?'"
  fa.a1.unit47.lesson03.exercise02.recognize_ta_farda_zohr:
    instruction: "What does this sentence mean?"
    correct_option: "Until tomorrow noon."
    distractors: ["Until tomorrow evening.", "Until today noon.", "Until next week."]
    accepted_answers: [{value: "Until tomorrow noon.", status: correct}]
    feedback: "*تا فردا ظهر* means 'Until tomorrow noon.'"
  fa.a1.unit47.lesson03.exercise03.match_size_and_return:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {کوچیک: small, بزرگ: big, یا: or, "کی پس می‌دم؟": "When do I give it back?", تا: until, فردا: tomorrow, ظهر: noon}
        status: correct
    feedback: "These words let you ask about size and agree on a return time."
  fa.a1.unit47.lesson03.exercise04.word_order_koochik_ya_bozorg:
    instruction: "Put the words in order."
    accepted_answers: [{value: [کوچیک, "می‌خوای", یا, بزرگ], status: correct}]
    feedback: "*کوچیک می‌خوای یا بزرگ* means 'Do you want small or big?'"
  fa.a1.unit47.lesson03.exercise05.translate_ta_farda_zohr:
    instruction: "Translate into English: تا فردا ظهر."
    answer_language_code: en
    accepted_answers:
      - {value: "Until tomorrow noon.", status: correct}
      - {value: "Until tomorrow noon", status: correct}
      - {value: "By tomorrow noon.", status: correct}
      - {value: "Till tomorrow noon.", status: correct}
    feedback: "*تا فردا ظهر* means 'Until tomorrow noon.'"

  fa.a1.unit47.lesson04.exercise01.dialogue_comprehension_size:
    instruction: "Mr. Moradi asks Nima something. What does he want to know?"
    correct_option: "He wants to know what size bike Nima wants."
    distractors:
      - "He wants to know the price of the rental."
      - "He wants to know if Nima already has a bicycle."
      - "He wants to know if Nima needs a helmet."
    accepted_answers: [{value: "He wants to know what size bike Nima wants.", status: correct}]
    feedback: "*کوچیک می‌خوای یا بزرگ؟* means 'Do you want small or big?'"
  fa.a1.unit47.lesson04.exercise02.recognize_dialogue_line4:
    instruction: "What does this sentence mean?"
    correct_option: "Okay. It's 5,000 toman a day. It also needs a 10,000 toman deposit."
    distractors:
      - "Okay. It's 5,000 toman total. No deposit needed."
      - "Okay. It's 10,000 toman a day. It also needs a 5,000 toman deposit."
      - "Sorry, no bicycles are available today."
    accepted_answers: [{value: "Okay. It's 5,000 toman a day. It also needs a 10,000 toman deposit.", status: correct}]
    feedback: "*روزی پنج هزار تومنه. ده هزار تومن هم ودیعه می‌خواد* means 'It's 5,000 toman a day. It also needs a 10,000 toman deposit.'"
  fa.a1.unit47.lesson04.exercise03.match_dialogue_bike_rental:
    instruction: "Match each line with its meaning."
    accepted_answers:
      - value: {"سلام آقای مرادی. می‌خوام یه دوچرخه کرایه کنم.": "Hi Mr. Moradi. I want to rent a bicycle.", "سلام نیما. کوچیک می‌خوای یا بزرگ؟": "Hi Nima. Do you want small or big?", "بزرگ، لطفاً.": "Big, please.", "باشه. روزی پنج هزار تومنه. ده هزار تومن هم ودیعه می‌خواد.": "Okay. It's 5,000 toman a day. It also needs a 10,000 toman deposit.", "باشه. کی پس می‌دم؟": "Okay. When do I give it back?", "تا فردا ظهر.": "Until tomorrow noon.", "ممنون!": "Thanks!"}
        status: correct
    feedback: "These lines appear in the bicycle-rental conversation between Nima and Mr. Moradi."
  fa.a1.unit47.lesson04.exercise04.dialogue_response_size:
    instruction: "Respond to کوچیک می‌خوای یا بزرگ؟ by saying you want the big one, please."
    accepted_answers:
      - {value: "بزرگ، لطفاً.", status: correct}
      - {value: "بزرگ، لطفاً", status: correct}
      - {value: بزرگ, status: correct}
      - {value: "لطفاً بزرگ", status: correct}
      - {value: "بزرگ، لطفا", status: correct}
      - {value: "بزرگ لطفاً", status: correct}
    feedback: "بزرگ، لطفاً means 'Big, please.'"
  fa.a1.unit47.lesson04.exercise05.translate_dialogue_line5:
    instruction: "Translate into English: باشه. کی پس می‌دم؟"
    answer_language_code: en
    accepted_answers:
      - {value: "Okay. When do I give it back?", status: correct}
      - {value: "Okay, when do I give it back?", status: correct}
      - {value: "Okay. When should I return it?", status: correct}
    feedback: "*باشه. کی پس می‌دم؟* means 'Okay. When do I give it back?'"

  fa.a1.unit47.lesson05.exercise01.reading_comprehension_service:
    instruction: "According to the sign, what service is offered?"
    correct_option: "Renting a bicycle."
