course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: basic occupation vocabulary, asking someone's
    job, workplace vocabulary, describing a work routine, reading a
    short work profile, and a dialogue where two people discuss jobs.

units:
  fa.a1.unit18.work:
    title: Work
    description: State a basic occupation, workplace, and simple work activity.

lessons:
  fa.a1.unit18.lesson01.basic_job_vocab:
    title: "Basic job vocabulary"
  fa.a1.unit18.lesson02.asking_about_job:
    title: "Asking about someone's job"
  fa.a1.unit18.lesson03.workplace_vocab:
    title: "Workplace vocabulary"
  fa.a1.unit18.lesson04.describing_work_routine:
    title: "Describing a work routine"
  fa.a1.unit18.lesson05.reading_a_work_profile:
    title: "Reading a work profile"
  fa.a1.unit18.lesson06.jobs_dialogue:
    title: "A dialogue about jobs"

teaching:
  fa.a1.unit18.lesson01.teach.shoghl_word:
    title: Job
    gloss: job
    note: "شغل means job/occupation."
    example_gloss: "What's your job?"
  fa.a1.unit18.lesson01.teach.mohandesam_word:
    title: "I'm an engineer"
    gloss: "I'm an engineer"
    note: "مهندسم is the colloquial contraction of مهندس هستم (I am an engineer)."
    example_gloss: "I'm an engineer."
  fa.a1.unit18.lesson01.teach.moallemam_word:
    title: "I'm a teacher"
    gloss: "I'm a teacher"
    note: "معلمم is the colloquial contraction of معلم هستم (I am a teacher)."
    example_gloss: "I'm a teacher."
  fa.a1.unit18.lesson01.teach.doctoram_word:
    title: "I'm a doctor"
    gloss: "I'm a doctor"
    note: "دکترم is the colloquial contraction of دکتر هستم (I am a doctor)."
    example_gloss: "I'm a doctor."
  fa.a1.unit18.lesson01.teach.man_word:
    title: I
    gloss: I
    note: "*من* means I (review). You can put it before *مهندسم*, *معلمم* or *دکترم* for a fuller sentence: *من مهندسم*."
    example_gloss: "I'm fine."
  fa.a1.unit18.lesson02.teach.shoghlet_word:
    title: "Your job"
    gloss: "your job"
    note: "شغلت combines شغل (job) with the informal possessive suffix -ت (your)."
  fa.a1.unit18.lesson02.teach.chie_word:
    title: "What is"
    gloss: "what is"
    note: "چیه is the colloquial contraction of چی است (what is)."
  fa.a1.unit18.lesson02.teach.shoghlet_chie_question:
    title: "What's your job?"
    gloss: "What's your job?"
    note: "شغلت چیه؟ combines this lesson's two new words into the standard casual way to ask someone's job."
  fa.a1.unit18.lesson03.teach.sherkat_word:
    title: Company
    gloss: company
    note: "شرکت means company."
    example_gloss: "I work at a company."
  fa.a1.unit18.lesson03.teach.madrese_word:
    title: School
    gloss: school
    note: "مدرسه means school."
    example_gloss: "I work at a school."
  fa.a1.unit18.lesson03.teach.bimarestan_word:
    title: Hospital
    gloss: hospital
    note: "بیمارستان means hospital."
    example_gloss: "I work at a hospital."
  fa.a1.unit18.lesson03.teach.dar_word:
    title: In/at
    gloss: "in / at"
    note: "*در* means in/at and marks a place: *در یک شرکت* = at a company. In everyday speech people often say *توی* or *تو* instead."
  fa.a1.unit18.lesson03.teach.yek_word:
    title: A/one
    gloss: "a / one"
    note: "یک means one, used here as an indefinite article (a company)."
  fa.a1.unit18.lesson03.teach.kar_mikoni_phrase:
    title: "You work"
    gloss: "you work"
    note: "کار می‌کنی is the colloquial second-person form of کار کردن (to work)."
  fa.a1.unit18.lesson03.teach.koja_word:
    title: Where
    gloss: where
    note: "کجا means where."
  fa.a1.unit18.lesson03.teach.kar_mikonam_word:
    title: "I work"
    gloss: "I work"
    note: "کار می‌کنم is the colloquial first-person form of کار کردن (to work)."
  fa.a1.unit18.lesson04.teach.har_rooz_word:
    title: "Every day"
    gloss: "every day"
    note: "هر روز means every day."
  fa.a1.unit18.lesson05.teach.mohandese_grammar:
    title: "He/she is an engineer"
    gloss: "he's/she's an engineer"
    note: "مهندسه is the colloquial third-person form -- مهندس است contracted -- matching the مهندسم pattern in the first person."
  fa.a1.unit18.lesson05.teach.mikone_grammar:
    title: "He/she works"
    gloss: "he/she works"
    note: "کار می‌کنه is the colloquial third-person form of کار کردن (to work)."
  fa.a1.unit18.lesson05.teach.reading_text:
    title: "Sample work profile"
    gloss: "Nima is an engineer. He works at a company."
    note: "A short third-person profile combining this unit's work vocabulary."
  fa.a1.unit18.lesson06.teach.names:
    title: "Nima and Sara"
    gloss: "Nima, Sara"
    note: "Common Iranian names used throughout this course."
    example_gloss: ["Nima is an engineer.", "Sara is a teacher."]
  fa.a1.unit18.lesson06.teach.to_chi_phrase:
    title: "What about you?"
    gloss: "What about you?"
    note: "تو چی؟ is a short, common way to turn a question back to the other person."
  fa.a1.unit18.lesson06.teach.aalie_word:
    title: "That's great"
    gloss: "that's great"
    note: "عالیه is the colloquial contraction of عالی است (it is great)."
    example_gloss: "This is great."
  fa.a1.unit18.lesson06.teach.va_word:
    title: And
    gloss: and
    note: "و means and, joining two clauses or items."
  fa.a1.unit18.lesson06.teach.moalleme_grammar:
    title: "He/she is a teacher"
    gloss: "he's/she's a teacher"
    note: "معلمه is the colloquial third-person form -- معلم است contracted -- matching the معلمم pattern in the first person."
  fa.a1.unit18.lesson06.teach.dialogue_line1:
    title: "Sara asks"
    gloss: "What's your job?"
  fa.a1.unit18.lesson06.teach.dialogue_line2:
    title: "Nima answers"
    gloss: "I'm an engineer. I work at a company. What about you?"
  fa.a1.unit18.lesson06.teach.dialogue_line3:
    title: "Sara answers"
    gloss: "I'm a teacher. I work at a school."
  fa.a1.unit18.lesson06.teach.dialogue_line4:
    title: "Nima reacts"
    gloss: "That's great!"

