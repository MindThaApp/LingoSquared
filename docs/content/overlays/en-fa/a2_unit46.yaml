teaching:
  fa.a2.unit46.lesson01.teach.things:
    title: Things to talk about
    gloss: book, gift, bag
    note: '*یه* is the spoken “a / one”.'
    example_gloss:
    - I have a book.
    - I have a gift.
    - I have a bag.
  fa.a2.unit46.lesson01.teach.verbs:
    title: Past verbs
    gloss: I bought, I saw, I read, I got, (object marker)
    note: '*رو* comes after the thing the verb acts on. The past endings are *-م* (I), *-ی* (you) and nothing (he / she).'
    example_gloss:
    - I bought the book.
    - I saw the gift.
    - I read the book.
    - I got the bag.
  fa.a2.unit46.lesson01.teach.clitic:
    title: Verb plus ش
    gloss: I bought it, I saw it, I read it, I got it
    note: 'The ending *-ش* stands for the thing or person already mentioned: “it”, “him” or “her”. It is added at the very end of the verb.'
    example_gloss:
    - Yesterday I bought it.
    - Yesterday I saw it.
    - Yesterday I read it.
    - Yesterday I got it.
  fa.a2.unit46.lesson01.teach.you:
    title: Asking “did you see it?”
    gloss: you saw, you saw it, you got
    note: '*دیدی* is “you saw”; add *-ش* and you have “you saw it”.'
    example_gloss:
    - Did you see the gift?
    - Where did you see it?
    - Did you get the bag?
  fa.a2.unit46.lesson01.teach.rule:
    title: Say it once, then use ش
    gloss: I bought the book; I bought it
    note: 'Name the thing the first time, with *رو*. After that, drop the noun and *رو* and add *-ش* to the verb: *کتاب رو خریدم*, then *خریدمش*.'
  fa.a2.unit46.lesson02.teach.people:
    title: People
    gloss: my friend, my friends, the children
    note: '*دوستم* is “my friend” and *دوستام* is “my friends”.'
    example_gloss:
    - I saw my friend.
    - I saw my friends.
    - I saw the children.
  fa.a2.unit46.lesson02.teach.them:
    title: Saying “them” and “you”
    gloss: I saw them, I saw you
    note: The ending *-شون* means “them”; *-ت* means “you”. Both are added to the verb, as *-ش* is.
    example_gloss:
    - Yesterday I saw them.
    - Yesterday I saw you.
  fa.a2.unit46.lesson02.teach.when:
    title: Yesterday and where
    gloss: yesterday, where
    note: '*دیروز* is “yesterday”; *کجا* is “where”.'
    example_gloss:
    - Yesterday I saw you.
    - Where did you see it?
  fa.a2.unit46.lesson02.teach.three:
    title: Three endings
    gloss: I saw him / her / it; I saw them; I saw you
    note: '*-ش* is one person or thing, *-شون* is more than one, and *-ت* is “you”. Use *-شون* for more than one person or thing.'
  fa.a2.unit46.lesson03.teach.actions:
    title: Giving, returning, borrowing
    gloss: I gave, back, borrowed
    note: '*پس دادم* is “I gave back” (returned); *قرض گرفتم* is “I borrowed”.'
    example_gloss:
    - I gave the book.
    - I gave the book back.
    - I borrowed the book.
  fa.a2.unit46.lesson03.teach.fused:
    title: Preposition plus ش
    gloss: to him / her, from him / her, for him / her, with him / her
    note: 'In speech *به، از، برای، با* join the person ending: *بهش, ازش, براش, باهاش*. They refer back to a person already named.'
    example_gloss:
    - I gave the book to him / her.
    - I borrowed it from him / her.
    - I bought the gift for him / her.
    - I went with him / her.
  fa.a2.unit46.lesson03.teach.me:
    title: To me, for me
    gloss: to me, for me
    note: With *-م* the same words mean “to me” and “for me”.
    example_gloss:
    - He / she gave it to me.
    - He / she bought it for me.
  fa.a2.unit46.lesson03.teach.names:
    title: Naming the person first
    gloss: Nima, Sara, I went
    note: 'First name the person, then refer back to them: *از نیما قرض گرفتم*, then *ازش*.'
    example_gloss:
    - I borrowed it from Nima.
    - I went with Sara.
  fa.a2.unit46.lesson03.teach.rule:
    title: Preposition clitics
    gloss: I borrowed from Nima; I borrowed from him
    note: Replace *از نیما* by *ازش*, *با سارا* by *باهاش*, *برای مینا* by *براش*. The person is already known, so no name is needed.
  fa.a2.unit46.lesson04.teach.questions:
    title: Asking about it
    gloss: did you buy it, did you read it, did you get it
    note: 'For “you” the past ending is *-ی* and then *-ش*: *خریدی* becomes *خریدیش*.'
    example_gloss:
    - Did you buy the gift?
    - Did you buy it yesterday?
    - Did you read it yesterday?
    - Did you get it yesterday?
  fa.a2.unit46.lesson04.teach.negative:
    title: Saying no
    gloss: I did not see it, I did not buy it, I did not read it, I did not get it
    note: 'Put *ن* before the past verb: *دیدم* becomes *ندیدم*, and *-ش* still goes at the end: *ندیدمش*.'
    example_gloss:
    - Yesterday I did not see it.
    - Yesterday I did not buy it.
    - Yesterday I did not read it.
    - Yesterday I did not get it.
  fa.a2.unit46.lesson04.teach.answers:
    title: Yes and no
    gloss: yes, no
    note: '*آره* is the spoken “yes”.'
    example_gloss:
    - Yes, I saw it.
    - No, I did not see it.
  fa.a2.unit46.lesson04.teach.rule:
    title: Short answers
    gloss: Did you read the book? Yes, I read it. No, I did not read it.
    note: 'A short answer needs no noun. Repeat the verb with *-ش*: *آره، خوندمش* or *نه، نخوندمش*.'
  fa.a2.unit46.lesson05.teach.words:
    title: Words for the text
    gloss: birthday, was, shop, in, then, happy, became, also, gave
    note: '*خوشحال شد* is “became happy”. *هم* means “also”.'
    example_gloss:
    - Yesterday was Nima’s birthday.
    - In the shop I saw a book.
    - Then I gave him the book.
    - He became very happy.
    - Nima also gave a bag.
  fa.a2.unit46.lesson05.teach.reading:
    title: Nima’s birthday
    gloss: Yesterday was Nima’s birthday. In the shop I saw a book and bought it. Then I gave him the book. He was very happy. Nima also gave me a bag.
    note: Read once for what happened, then again to find what each ش points to.
  fa.a2.unit46.lesson06.teach.turn01:
    title: Sara asks about the book
    gloss: 'Sara: Nima, did you read the book?'
    note: The noun *کتاب* is named once, with *رو*.
  fa.a2.unit46.lesson06.teach.turn02:
    title: Nima answers
    gloss: 'Nima: Yes, I read it. It was very good.'
    note: '*خوندمش* refers back to the book.'
  fa.a2.unit46.lesson06.teach.turn03:
    title: Sara asks about the gift
    gloss: 'Sara: Did you buy the gift for Mina?'
    note: '*مینا* is a name; the gift is named once.'
  fa.a2.unit46.lesson06.teach.turn04:
    title: Nima answers
    gloss: 'Nima: Yes, I bought it and yesterday I gave it to her.'
    note: '*خریدمش* refers to the gift and *بهش* refers to Mina.'
  fa.a2.unit46.lesson06.teach.turn05:
    title: Sara asks about Mina
    gloss: 'Sara: Was she happy?'
    note: The subject is understood from the conversation.
  fa.a2.unit46.lesson06.teach.turn06:
    title: Nima answers
    gloss: 'Nima: Yes, she was very happy.'
    note: A short, natural reply.
