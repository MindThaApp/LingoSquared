  fa.a2.unit46.lesson06.exercise01.comprehend_book:
    instruction: What does Nima say about the book?
    correct_option: He read it and it was very good.
    distractors:
    - He has not read it yet.
    - He lost it.
    - He gave it back to Sara.
    accepted_answers:
    - value: He read it and it was very good.
      status: correct
    feedback: Nima says *خوندمش. خیلی خوب بود*.
  fa.a2.unit46.lesson06.exercise02.comprehend_gift:
    instruction: What did Nima do with the gift?
    correct_option: He bought it and gave it to Mina yesterday.
    distractors:
    - He kept it for himself.
    - He is going to buy it tomorrow.
    - Mina gave it to him.
    accepted_answers:
    - value: He bought it and gave it to Mina yesterday.
      status: correct
    feedback: Nima says *خریدمش و دیروز بهش دادم*.
  fa.a2.unit46.lesson06.exercise03.match_dialogue:
    instruction: Match each Farsi item with its meaning.
    accepted_answers:
    - value:
        کتاب رو خوندی: Did you read the book
        خوندمش: I read it
        هدیه رو خریدی: Did you buy the gift
        خریدمش: I bought it
        بهش دادم: I gave it to her
        خوشحال شد: she was happy
      status: correct
    feedback: Each line comes from the conversation between Sara and Nima.
  fa.a2.unit46.lesson06.exercise04.order_bought_gave:
    instruction: 'Arrange the words to say: I bought it and yesterday I gave it to her.'
    accepted_answers:
    - value:
      - خریدمش
      - و
      - دیروز
      - بهش
      - دادم
      status: correct
    feedback: '*خریدمش* and *بهش* both refer back.'
  fa.a2.unit46.lesson06.exercise05.answer_read:
    instruction: 'Answer in Farsi: yes, you read it.'
    accepted_answers:
    - value: آره خوندمش
      status: correct
    - value: آره، خوندمش
      status: correct
    - value: خوندمش
      status: correct
    feedback: 'Model: *آره، خوندمش.*'
  fa.a2.unit46.lesson06.exercise06.write_borrow:
    instruction: 'Write three short sentences in Farsi, in this order: (1) you borrowed the book from her (use ازش); (2) you read it (use ش on the verb); (3) you gave it back to her (use بهش).'
    accepted_answers:
    - value: کتاب رو ازش قرض گرفتم. خوندمش. بهش پس دادم.
      status: correct
    - value: کتاب رو ازش قرض گرفتم خوندمش بهش پس دادم
      status: correct
    - value: کتاب رو ازش قرض گرفتم، خوندمش، بهش پس دادم
      status: correct
    - value: کتاب رو ازش قرض گرفتم. خوندمش. بهش پس دادمش.
      status: acceptable_with_note
      note: Adding ش after پس دادم is also possible, though the model keeps بهش only.
    feedback: 'Model: *کتاب رو ازش قرض گرفتم. خوندمش. بهش پس دادم.*'
