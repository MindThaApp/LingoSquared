teaching:
  fa.a2.unit50.changing_arrangement.lesson01.teach.arrangement_words:
    title: An arrangement and changing it
    gloss: arrangement, our arrangement, to change, tomorrow
    note: '*قرار* is an arrangement to meet. *قرارمون* is “our arrangement” (*ـمون* means “our”). *عوض کردن* means “to change” and is used with *رو*.'
    example_gloss:
    - I have an arrangement with Nima tomorrow.
    - We are changing our arrangement.
    - We changed our arrangement today.
  fa.a2.unit50.changing_arrangement.lesson01.teach.sorry_words:
    title: Sorry, unfortunately, I cannot
    gloss: excuse me / sorry, unfortunately, I cannot, we cannot
    note: '*ببخشید* and *متأسفانه* soften bad news. *نمی‌تونم* is “I cannot” and *نمی‌تونیم* is “we cannot.”'
    example_gloss:
    - Sorry, I cannot come tomorrow.
    - Unfortunately I have work tomorrow.
    - Unfortunately Nima cannot come tomorrow.
  fa.a2.unit50.changing_arrangement.lesson01.teach.delay_words:
    title: Delays and being unavailable
    gloss: delay, I am tied up, urgent
    note: '*تأخیر دارم* says you are delayed. *گرفتارم* means you are tied up, and *فوری* describes something urgent.'
    example_gloss:
    - I am delayed.
    - I am tied up; I cannot come.
    - I have urgent work.
  fa.a2.unit50.changing_arrangement.lesson01.teach.polite_change:
    title: A polite request to change
    gloss: Excuse me, can we change our arrangement?
    note: '*می‌شه … ؟* asks politely whether something is possible. The verb ends in *ـیم* (“we”) because the request uses “we”.'
  fa.a2.unit50.changing_arrangement.lesson01.teach.ask_to_change:
    title: 'Two ways to ask: می‌شه and می‌تونیم'
    gloss: Is it possible to change our arrangement? Can we change our arrangement?
    note: Both questions are polite. *می‌شه* is the usual spoken form; *می‌تونیم* sounds a little more direct. After either one, the verb is the *کنیم* form, not *می‌کنیم*.
  fa.a2.unit50.changing_arrangement.lesson02.teach.reason_words:
    title: Giving a reason
    gloss: because, must, work, I am sick
    note: '*چون* introduces the reason and can come first or second. *باید کار کنم* is “I have to work.”'
    example_gloss:
    - I cannot come because I am sick.
    - Because I have to work, I arrive late.
    - Because I have work, I cannot.
  fa.a2.unit50.changing_arrangement.lesson02.teach.so_phrase:
    title: 'Reason first, result after: برای همین'
    gloss: I am sick, so I cannot come.
    note: '*برای همین* means “that is why.” Use it after the reason instead of *چون*; do not put both in one sentence.'
  fa.a2.unit50.changing_arrangement.lesson02.teach.new_time:
    title: Days and hours for a new time
    gloss: Thursday, Friday, four o’clock, six o’clock
    note: Say the day first and then *ساعت* plus the number.
    example_gloss:
    - I have time on Friday at four.
    - I can come on Thursday at six.
    - I have work tomorrow at six.
  fa.a2.unit50.changing_arrangement.lesson02.teach.is_it_good:
    title: Proposing a time
    gloss: Is Friday at four good for you? Can you come?
    note: '*برات خوبه؟* asks whether a time suits one person you know well. For someone you call *شما*, say *براتون خوبه؟*.'
  fa.a2.unit50.changing_arrangement.lesson02.teach.reason_then_time:
    title: Move an appointment in three steps
    gloss: I cannot come tomorrow because I have to work. Is Friday at four good for you?
    note: First say you cannot come, then give the reason with *چون*, then propose a new day and hour. A reason makes the request sound polite.
  fa.a2.unit50.changing_arrangement.lesson03.teach.finish_words:
    title: Finishing and calling
    gloss: it finished, it finishes / is finished, I will call you, call me
    note: '*تموم شد* is past (“finished”); *تموم بشه* is the form used after *وقتی* when talking about the future.'
    example_gloss:
    - My work finished.
    - My work finishes at six.
    - I will call you tomorrow.
    - Please call me.
  fa.a2.unit50.changing_arrangement.lesson03.teach.confirm_or_postpone:
    title: Confirming or postponing
    gloss: confirmed, back / later, let us put
    note: '*قطعی* says an arrangement is confirmed. *عقب بندازیم* is the natural spoken way to say “let us postpone it.”'
    example_gloss:
    - Our arrangement was confirmed.
    - Let us postpone our arrangement.
  fa.a2.unit50.changing_arrangement.lesson03.teach.when_clause:
    title: وقتی with the future and the past
    gloss: When my work is finished, I will call you. When my work finished, I called you.
    note: For the future, the clause after *وقتی* uses the *ب* form (*تموم بشه*) and the main verb is plain present (*زنگ می‌زنم*). For the past, both verbs are past.
  fa.a2.unit50.changing_arrangement.lesson03.teach.before_after:
    title: قبل از اینکه and بعد از اینکه
    gloss: Before I leave, I will call you. After I arrive, I will call you.
    note: '*قبل از اینکه* (“before”) and *بعد از اینکه* (“after”) are followed by a *ب* verb when the plan is in the future: *برم*, *برسم*.'
  fa.a2.unit50.changing_arrangement.lesson03.teach.time_phrases:
    title: The same pattern in the past
    gloss: When I arrived, I called you. After I arrived, I called you.
    note: 'In the past, the clause uses an ordinary past verb: *رسیدم*. Compare it with the future, *برسم*.'
  fa.a2.unit50.changing_arrangement.lesson04.teach.if_words:
    title: If, suitable, how about, hairdresser, bike
    gloss: if, is not suitable, how about?, hairdresser, bicycle
    note: '*چطوره؟* suggests an alternative: *دوشنبه چطوره؟* means “How about Monday?”'
    example_gloss:
    - How about Monday?
    - Is Saturday not good for you?
    - I have an appointment at the hairdresser on Thursday.
    - I want a bike.
  fa.a2.unit50.changing_arrangement.lesson04.teach.if_clause:
    title: اگه for a possible situation
    gloss: If you have time, we can go on Saturday. If it rains, we will change our arrangement.
    note: After *اگه* the verb is often the *ب* form (*بیاد*) or *داشته باشی*; for a situation that may already be true, the plain present is also normal (*اگه نمی‌تونی بیای*, *اگه وقت دارید*). The main clause is plain present. Put the *اگه* part first and a comma after it.
  fa.a2.unit50.changing_arrangement.lesson04.teach.if_cant:
    title: Plan B with اگه
    gloss: If you cannot come, call me. If Saturday is not good for you, how about Monday?
    note: '*اگه … نمی‌تونی* gives the other person a way out, and *چطوره؟* offers a new day.'
  fa.a2.unit50.changing_arrangement.lesson04.teach.polite_please:
    title: Polite requests to a business
    gloss: Please give me another appointment. Can I change my appointment?
    note: Use *لطفا* and the *شما* verb (*بدید*) with a hairdresser, shop, or hire place. *می‌شه … ؟* works with *شما* and *تو* alike.
  fa.a2.unit50.changing_arrangement.lesson05.teach.reading:
    title: A note to move a meeting
    gloss: Sara, hello! Unfortunately I cannot come tomorrow, because I have to work. Can we change our arrangement? Is Friday at four good for you? If you cannot on Friday, I can do Saturday at ten. When my work is finished, I will call you.
    note: Read once for the reason, then again for the two proposed times.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn01:
    title: Sara reminds Nima
    gloss: Nima, we have our arrangement tomorrow at ten.
    note: Sara mentions the arrangement.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn02:
    title: Nima asks to change
    gloss: Sorry, Sara, unfortunately I cannot come tomorrow, because I have to work. Can we change our arrangement?
    note: Nima apologizes, gives the reason, and asks politely.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn03:
    title: Sara agrees and proposes Friday
    gloss: Yes, no problem. Is Friday at ten good for you?
    note: Sara accepts and offers a new time.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn04:
    title: Nima declines and suggests Saturday
    gloss: I cannot on Friday, because I have a doctor’s appointment. How about Saturday?
    note: Nima gives a reason and an alternative.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn05:
    title: Sara agrees on Saturday
    gloss: Saturday at ten is fine. I will get the bikes for Saturday.
    note: The bikes move to the new day too.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn06:
    title: Nima thanks Sara
    gloss: Great, thank you! When my work is finished, I will call you.
    note: Nima closes with a time clause.
