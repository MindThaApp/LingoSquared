teaching:
  fa.a2.unit38.lesson01.teach.polite_words:
    title: Polite openers
    gloss: excuse me, do you know (polite), I do not know
    note: '*ببخشید* opens a polite question to a stranger. *می‌دونید* is the polite *شما* form of "do you know".'
    example_gloss:
    - Excuse me, do you know what time it is?
    - I do not know, sorry.
  fa.a2.unit38.lesson01.teach.places:
    title: Places and a ticket
    gloss: station, office, museum, library, ticket
    note: '*کتابخونه* is the ordinary spoken form of "library"; careful writing uses *کتابخانه*.'
    example_gloss:
    - The station is over there.
    - The office is here.
    - The museum is over there.
    - The library is here.
    - The ticket is here.
  fa.a2.unit38.lesson01.teach.where_time:
    title: Where is it? What time is it?
    gloss: where is it, what time is it, it is here, it is over there
    note: '*ساعت چنده* asks the time. *اینجاست* and *اونجاست* are typical short answers about a place.'
    example_gloss:
    - Where is the office?
    - What time is it?
    - The library is here.
  fa.a2.unit38.lesson01.teach.frame:
    title: 'The polite frame: می‌دونید + question'
    gloss: Excuse me, do you know where the station is? Excuse me, do you know what time it is?
    note: 'To ask a stranger politely, put *ببخشید، می‌دونید* in front of the ordinary question. The question itself does not change: *ایستگاه کجاست؟* becomes *ببخشید، می‌دونید ایستگاه کجاست؟*.'
  fa.a2.unit38.lesson02.teach.open_closed:
    title: Open, closed, today, tomorrow
    gloss: open, closed, today, tomorrow
    note: '*باز* means "open" and *بسته* means "closed". *هست* says that something is the case.'
    example_gloss:
    - The museum is open today.
    - The office is closed today.
    - The museum is open tomorrow.
    - The library is closed tomorrow.
  fa.a2.unit38.lesson02.teach.when_or_not:
    title: When, or, not, yes
    gloss: when, it becomes / it happens, or, no / not, yes
    note: '*باز می‌شه* means "it opens"; *بسته می‌شه* means "it closes". *نه* is "no" and also ends the pair *یا نه* ("or not").'
    example_gloss:
    - When does the museum open?
    - Is it open or not?
    - Yes, it is open.
  fa.a2.unit38.lesson02.teach.when_pattern:
    title: 'Embedded "when": the question word stays in place'
    gloss: Do you know when the museum opens?
    note: 'In English the word order changes ("when the museum opens"). In Persian nothing moves: *موزه کی باز می‌شه؟* simply follows *می‌دونید*. The question word *کی* stays right where it is in the direct question.'
  fa.a2.unit38.lesson02.teach.whether_pattern:
    title: 'Embedded yes/no: ... یا نه'
    gloss: Do you know whether the museum is open (or not)?
    note: For "whether", take the plain statement *موزه باز هست* and close it with *یا نه*. English adds "whether" or "if"; Persian adds *یا نه* at the end.
  fa.a2.unit38.lesson03.teach.you_forms:
    title: You to a friend, you to a stranger
    gloss: you (friend), you (polite), do you know (friend)
    note: Sara and Nima are friends, so they say *تو* and *می‌دونی*. To a stranger use *شما* and *می‌دونید*.
    example_gloss:
    - Sara, do you know where the office is?
    - Do you know where the office is? (to a stranger)
  fa.a2.unit38.lesson03.teach.same_order:
    title: The word order does not change
    gloss: Where is the station? Do you know where the station is?
    note: 'The direct question and the embedded question have exactly the same words in the same order: *ایستگاه کجاست؟* / *می‌دونید ایستگاه کجاست؟*. Only the polite frame is added. Persian never rearranges the question the way English does ("where the station is").'
  fa.a2.unit38.lesson03.teach.friend_stranger:
    title: می‌دونی or می‌دونید?
    gloss: do you know (friend); do you know (stranger)
    note: Use *می‌دونی* with a friend and *می‌دونید* with a stranger, a clerk, or anyone you address politely. A polite question to a stranger also starts with *ببخشید*.
  fa.a2.unit38.lesson03.teach.dont_know:
    title: 'I do not know ...: a statement, not a question'
    gloss: I do not know where the station is; I do not know where the station is
    note: '*نمی‌دونم* takes the same embedded question: *نمی‌دونم موزه کی باز می‌شه*. It is a statement, so it has no question mark. You may add *که* after it (*نمی‌دونم که ...*), but spoken Persian usually leaves it out.'
  fa.a2.unit38.lesson03.teach.ke:
    title: که (optional link word)
    gloss: that (optional link word)
    note: Here *که* just links *نمی‌دونم* to the question. It adds nothing to the meaning and is usually dropped.
    example_gloss:
    - I do not know where the office is.
  fa.a2.unit38.lesson04.teach.directions:
    title: Directions you might hear
    gloss: straight, go (polite), side/direction, right, left, then, and
    note: 'A stranger answers with polite commands: *مستقیم برید* "go straight". *سمت راست* is "on the right" and *سمت چپ* "on the left".'
    example_gloss:
    - Go straight.
    - Go to the right.
    - Go straight and then to the left.
  fa.a2.unit38.lesson04.teach.times_thanks:
    title: Hours and thanks
    gloss: eight o'clock, five o'clock, thank you
    note: '*ساعت هشت* is "at eight o''clock". Say *ممنون* after any answer.'
    example_gloss:
    - The museum opens at eight.
    - The office closes at five.
    - Thank you!
  fa.a2.unit38.lesson04.teach.package:
    title: One polite package
    gloss: Excuse me, do you know when the office closes?
    note: 'Build every polite enquiry in three steps: *ببخشید*, then *می‌دونید*, then the ordinary question with its own question word (*کجاست*, *کی ... می‌شه*, *... هست یا نه*). Nothing inside the question moves.'
  fa.a2.unit38.lesson05.teach.greeting:
    title: Hello and I
    gloss: hello, I
    note: '*من* is rarely needed because the verb ending already means "I". It is added for contrast.'
    example_gloss:
    - Hello, I do not know.
    - Tomorrow I am going to the museum.
  fa.a2.unit38.lesson05.teach.reading:
    title: A short note to ask for information
    gloss: Hello. Excuse me, do you know where the office is? Do you know whether it is open tomorrow? I do not know. Thank you. Nima
    note: Read once to find the two questions, then again to see the polite frame in each.
  fa.a2.unit38.lesson06.teach.passerby:
    title: Passer-by
    gloss: passer-by (a stranger on the street)
    note: 'Note that the embedded question follows *می‌دونه* ("he/she knows") in exactly the same way: nothing moves.'
    example_gloss:
    - The passer-by knows where the office is.
  fa.a2.unit38.lesson06.teach.turn01:
    title: Sara asks her friend
    gloss: 'Sara asks Nima, using the friend form: Do you know where the office is?'
    note: She uses *می‌دونی* because they are friends.
  fa.a2.unit38.lesson06.teach.turn02:
    title: Nima asks a stranger
    gloss: Nima does not know, so he asks a passer-by with the polite frame.
    note: He switches to *می‌دونید* for the stranger.
  fa.a2.unit38.lesson06.teach.turn03:
    title: The passer-by directs him
    gloss: 'Yes: go straight. The office is on the right.'
    note: The answer uses polite commands.
  fa.a2.unit38.lesson06.teach.turn04:
    title: Nima asks whether it is open
    gloss: Thank you. Do you know whether the office is open?
    note: The second question uses *یا نه*.
  fa.a2.unit38.lesson06.teach.turn05:
    title: It is open and closes at five
    gloss: Yes, it is open. It closes at five.
    note: 'Two facts: open now, closes at five.'
  fa.a2.unit38.lesson06.teach.turn06:
    title: Nima thanks him and tells Sara
    gloss: Thank you. Sara, the office is over there.
    note: He thanks the stranger and tells his friend.
