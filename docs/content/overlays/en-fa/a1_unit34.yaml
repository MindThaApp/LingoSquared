course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: post-office words, asking for a stamp, saying
    whether you're sending a letter or a package, and asking when mail
    will arrive.

units:
  fa.a1.unit34.post:
    title: The Post Office and Mail

lessons:
  fa.a1.unit34.lesson01.post_words: {title: "Post office words"}
  fa.a1.unit34.lesson02.send_or_receive: {title: "I want to send it"}
  fa.a1.unit34.lesson03.when_arrives: {title: "When does it arrive?"}
  fa.a1.unit34.lesson04.post_dialogue: {title: "Dialogue: At the post office"}
  fa.a1.unit34.lesson05.reading_post: {title: "Reading about the post office"}
  fa.a1.unit34.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit34.lesson01.teach.postkhane:
    title: Post office
    gloss: "post office"
    note: "*پستخانه* means 'post office' -- a single word built from *پست* (post/mail) and *خانه* (house)."
    example_gloss: "The post office is nearby."
  fa.a1.unit34.lesson01.teach.stamp:
    title: Stamp
    gloss: stamp
    note: "*تمبر* is the standard word for a postage stamp."
    example_gloss: "I want a stamp."
  fa.a1.unit34.lesson01.teach.letter:
    title: Letter
    gloss: letter
    note: "*نامه* means 'letter.'"
    example_gloss: "I have a letter."
  fa.a1.unit34.lesson01.teach.package:
    title: Package
    gloss: package
    note: "*بسته* means 'package' or 'parcel.'"
    example_gloss: "This package is heavy."
  fa.a1.unit34.lesson01.teach.review_want_for:
    title: "I want / for / this"
    gloss: "I want / for / this"
    note: "*می‌خوام* is colloquial for 'I want.' *برای* means 'for.' *این* means 'this.'"
  fa.a1.unit34.lesson01.teach.want_stamp:
    title: "I want a stamp"
    gloss: "I want a stamp"
    note: "*یه* is the colloquial form of *یک* ('a/one'), used before a noun."

  fa.a1.unit34.lesson02.teach.send_letter:
    title: "I want to send this letter"
    gloss: "I want to send this letter"
    note: "*بفرستم* is the subjunctive 'I send,' used after *می‌خوام*. *رو* marks the object here (colloquial for *را*)."
  fa.a1.unit34.lesson02.teach.send_package:
    title: "I'm sending this package"
    gloss: "I'm sending this package"
    note: "*می‌فرستم* means 'I send' or 'I'm sending' (present indicative, not subjunctive)."
  fa.a1.unit34.lesson02.teach.letter_or_package:
    title: "For a letter or a package?"
    gloss: "For a letter or a package?"
    note: "*یا* means 'or.'"
  fa.a1.unit34.lesson02.teach.review_send_receive:
    title: "To send / to receive"
    gloss: "to send / to receive"
    note: "*فرستادن* is the infinitive 'to send'; *گرفتن* is the infinitive 'to receive' or 'to get.'"
  fa.a1.unit34.lesson02.teach.send_it_today:
    title: "I'm sending it today"
    gloss: "I'm sending it today"
    note: "*می‌فرستمش* attaches the object clitic *-ش* ('it') directly onto the verb. *امروز* means 'today.'"

  fa.a1.unit34.lesson03.teach.when_letter_arrives:
    title: "When does the letter arrive?"
    gloss: "When does the letter arrive?"
    note: "*کی* means 'when.' *می‌رسه* is colloquial for 'it arrives.'"
  fa.a1.unit34.lesson03.teach.package_three_days:
    title: "The package arrives in three days"
    gloss: "The package arrives in three days"
    note: "*سه روزه می‌رسه* literally 'three-day-ish it arrives' -- a natural colloquial way to say something takes three days to arrive."
  fa.a1.unit34.lesson03.teach.review_day_words:
    title: "Day / tomorrow"
    gloss: "day / tomorrow"
    note: "*روز* means 'day'; *فردا* means 'tomorrow.'"
  fa.a1.unit34.lesson03.teach.review_late_early:
    title: "Late / early"
    gloss: "late / early"
    note: "*دیر* means 'late'; *زود* means 'early.'"
  fa.a1.unit34.lesson03.teach.arrives_tomorrow:
    title: "It arrives tomorrow"
    gloss: "It arrives tomorrow"
    note: "*فردا می‌رسه* combines both review words from this lesson."

  fa.a1.unit34.lesson04.teach.review_names:
    title: "Nima / Sara / hello / okay"
    gloss: "Nima / Sara / hello / okay"
    note: "*نیما* and *سارا* are the recurring names. *سلام* means 'hello.' *باشه* means 'okay' or 'alright.'"
  fa.a1.unit34.lesson04.teach.dialogue_line1:
    title: "Nima: Hello, I want a stamp."
    gloss: "Hello, I want a stamp."
  fa.a1.unit34.lesson04.teach.dialogue_line2:
    title: "Sara: For a letter or a package?"
    gloss: "For a letter or a package?"
  fa.a1.unit34.lesson04.teach.dialogue_line3:
    title: "Nima: For this letter."
    gloss: "For this letter."
  fa.a1.unit34.lesson04.teach.dialogue_line4:
    title: "Sara: Okay, it arrives in three days."
    gloss: "Okay, it arrives in three days."

  fa.a1.unit34.lesson05.teach.reading_text:
    title: "Reading: Nima at the post office"
    gloss: "Nima goes to the post office. He wants a stamp for this letter. He buys the stamp and sends the letter. The letter arrives in three days."
    note: "The reading repeats the dialogue facts using third-person verb forms."
  fa.a1.unit34.lesson05.teach.reading_note:
    title: "He/she goes / wants / buys / sends"
    gloss: "he/she goes / wants / buys / sends"
    note: "*می‌ره*, *می‌خواد*, *می‌خره*, and *می‌فرسته* are the third-person colloquial forms of the verbs used earlier in first person."

  fa.a1.unit34.lesson06.teach.short_message:
    title: "Hello, I want a stamp for this letter"
    gloss: "Hello, I want a stamp for this letter."
    note: "This is a short written post-office request."
  fa.a1.unit34.lesson06.teach.package_message:
    title: "I'm sending the package. It arrives in three days."
    gloss: "I'm sending the package. It arrives in three days."
    note: "This sentence adds a delivery-time detail."
  fa.a1.unit34.lesson06.teach.review_post_words:
    title: "Post office / stamp / letter / package / it arrives"
    gloss: "post office / stamp / letter / package / it arrives"
    note: "*پستخانه*, *تمبر*, *نامه*, *بسته*, and *می‌رسه* are the core words for this unit."

exercises:
  fa.a1.unit34.lesson01.exercise01.recognize_postkhane:
    instruction: "What does this word mean?"
    correct_option: "post office"
    distractors: [stamp, letter, package]
    accepted_answers: [{value: "post office", status: correct}]
    feedback: "پستخانه means post office."
  fa.a1.unit34.lesson01.exercise02.recognize_stamp:
    instruction: "What does this word mean?"
    correct_option: stamp
    distractors: [letter, package, "post office"]
    accepted_answers: [{value: stamp, status: correct}]
    feedback: "تمبر means stamp."
  fa.a1.unit34.lesson01.exercise03.match_post_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {پستخانه: "post office", تمبر: stamp, نامه: letter, بسته: package, "می‌خوام": "I want", برای: for, این: this, یه: "a/one"}
        status: correct
    feedback: "These are the core post-office words for this unit."
  fa.a1.unit34.lesson01.exercise04.word_order_want_stamp:
    instruction: "Put the words in order."
    accepted_answers: [{value: [یه, تمبر, "می‌خوام"], status: correct}]
    feedback: "یه تمبر می‌خوام means 'I want a stamp.'"
  fa.a1.unit34.lesson01.exercise05.translate_want_stamp:
    instruction: "Translate into English: یه تمبر می‌خوام."
    answer_language_code: en
    accepted_answers:
      - {value: "I want a stamp", status: correct}
      - {value: "I want a stamp.", status: correct}
    feedback: "یه تمبر می‌خوام is a basic counter request."

  fa.a1.unit34.lesson02.exercise01.recognize_send_letter:
    instruction: "What does this sentence mean?"
    correct_option: "I want to send this letter."
    distractors:
      - "I want to receive this letter."
      - "I have this letter."
      - "I want to buy this letter."
    accepted_answers: [{value: "I want to send this letter.", status: correct}]
    feedback: "می‌خوام این نامه رو بفرستم means 'I want to send this letter.'"
  fa.a1.unit34.lesson02.exercise02.recognize_letter_or_package:
    instruction: "What does this question mean?"
    correct_option: "For a letter or a package?"
    distractors:
      - "When does it arrive?"
      - "How much is a stamp?"
      - "Where is the post office?"
    accepted_answers: [{value: "For a letter or a package?", status: correct}]
    feedback: "برای نامه یا بسته؟ asks whether it's for a letter or a package."
  fa.a1.unit34.lesson02.exercise03.match_send_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {بفرستم: "(I) send", "می‌فرستم": "I'm sending", یا: or, فرستادن: "to send", گرفتن: "to receive", امروز: today, "می‌فرستمش": "I'm sending it"}
        status: correct
    feedback: "These words let you talk about sending mail."
  fa.a1.unit34.lesson02.exercise04.word_order_send_package:
    instruction: "Put the words in order."
    accepted_answers: [{value: [این, بسته, رو, "می‌فرستم"], status: correct}]
    feedback: "این بسته رو می‌فرستم means 'I'm sending this package.'"
  fa.a1.unit34.lesson02.exercise05.translate_send_today:
    instruction: "Translate into English: امروز می‌فرستمش."
    answer_language_code: en
    accepted_answers:
      - {value: "I'm sending it today", status: correct}
      - {value: "I'm sending it today.", status: correct}
      - {value: "I send it today", status: correct}
      - {value: "I send it today.", status: correct}
    feedback: "امروز می‌فرستمش means 'I'm sending it today.'"

  fa.a1.unit34.lesson03.exercise01.recognize_when_letter:
    instruction: "What does this question mean?"
    correct_option: "When does the letter arrive?"
    distractors:
      - "Where is the letter?"
      - "Who sent the letter?"
      - "Why is the letter late?"
    accepted_answers: [{value: "When does the letter arrive?", status: correct}]
    feedback: "نامه کی می‌رسه؟ asks when the letter arrives."
  fa.a1.unit34.lesson03.exercise02.recognize_package_three_days:
    instruction: "What does this sentence mean?"
    correct_option: "The package arrives in three days."
    distractors:
      - "The package arrived three days ago."
      - "The package is very heavy."
      - "The package needs three stamps."
    accepted_answers: [{value: "The package arrives in three days.", status: correct}]
    feedback: "بسته سه روزه می‌رسه means 'The package arrives in three days.'"
  fa.a1.unit34.lesson03.exercise03.match_when_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {کی: when, "می‌رسه": "it arrives", روز: day, فردا: tomorrow, دیر: late, زود: early, سه: three}
        status: correct
    feedback: "These words let you ask and answer about arrival time."
  fa.a1.unit34.lesson03.exercise04.word_order_package_arrives:
    instruction: "Put the words in order."
    accepted_answers: [{value: [بسته, سه, روزه, "می‌رسه"], status: correct}]
    feedback: "بسته سه روزه می‌رسه means 'The package arrives in three days.'"
  fa.a1.unit34.lesson03.exercise05.translate_arrives_tomorrow:
    instruction: "Translate into English: فردا می‌رسه."
    answer_language_code: en
    accepted_answers:
      - {value: "It arrives tomorrow", status: correct}
      - {value: "It arrives tomorrow.", status: correct}
    feedback: "فردا می‌رسه means 'It arrives tomorrow.'"

  fa.a1.unit34.lesson04.exercise01.dialogue_comprehension_post:
    instruction: "When does Nima's letter arrive?"
    correct_option: "The letter arrives in three days."
    distractors:
      - "The package arrives tomorrow."
      - "Sara wants to send a letter."
      - "Nima is buying two stamps."
    accepted_answers: [{value: "The letter arrives in three days.", status: correct}]
    feedback: "سارا says باشه، سه روزه می‌رسه."
  fa.a1.unit34.lesson04.exercise02.recognize_for_this_letter:
    instruction: "What does this phrase mean?"
    correct_option: "For this letter."
    distractors:
      - "For this package."
      - "For tomorrow."
      - "For Sara."
    accepted_answers: [{value: "For this letter.", status: correct}]
    feedback: "برای این نامه means 'For this letter.'"
  fa.a1.unit34.lesson04.exercise03.match_dialogue_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {نیما: Nima, سارا: Sara, سلام: hello, باشه: okay, تمبر: stamp, نامه: letter, بسته: package}
        status: correct
    feedback: "These words appear in the post-office dialogue."
  fa.a1.unit34.lesson04.exercise04.dialogue_response_letter_or_package:
    instruction: "Respond to برای نامه یا بسته؟ by saying it's for this letter."
    accepted_answers:
      - {value: "برای این نامه", status: correct}
      - {value: "برای این نامه.", status: correct}
    feedback: "برای این نامه means 'For this letter.'"
  fa.a1.unit34.lesson04.exercise05.translate_okay_three_days:
    instruction: "Translate into English: باشه، سه روزه می‌رسه."
    answer_language_code: en
    accepted_answers:
      - {value: "Okay, it arrives in three days", status: correct}
      - {value: "Okay, it arrives in three days.", status: correct}
    feedback: "باشه، سه روزه می‌رسه confirms the delivery time."

  fa.a1.unit34.lesson05.exercise01.reading_comprehension_action:
    instruction: "What does Nima do at the post office?"
    correct_option: "Nima buys a stamp and sends the letter."
    distractors:
      - "Nima buys a package for Sara."
      - "The letter arrives today."
      - "Nima sends the letter tomorrow."
    accepted_answers: [{value: "Nima buys a stamp and sends the letter.", status: correct}]
    feedback: "The reading says تمبر رو می‌خره و نامه رو می‌فرسته."
  fa.a1.unit34.lesson05.exercise02.reading_comprehension_arrival:
    instruction: "When does the letter arrive?"
    correct_option: "The letter arrives in three days."
    distractors:
      - "The package is heavy."
      - "Nima works at the post office."
      - "Sara sends the package."
    accepted_answers: [{value: "The letter arrives in three days.", status: correct}]
    feedback: "نامه سه روزه می‌رسه gives the delivery time."
  fa.a1.unit34.lesson05.exercise03.match_reading_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {"می‌ره": "he/she goes", اون: "he/she", "می‌خواد": "he/she wants", "می‌خره": "he/she buys", "می‌فرسته": "he/she sends", به: to, و: and}
        status: correct
    feedback: "These words let you understand the short reading."
  fa.a1.unit34.lesson05.exercise04.translate_buys_sends:
    instruction: "Translate into English: تمبر رو می‌خره و نامه رو می‌فرسته."
    answer_language_code: en
    accepted_answers:
      - {value: "He buys the stamp and sends the letter", status: correct}
      - {value: "He buys the stamp and sends the letter.", status: correct}
      - {value: "She buys the stamp and sends the letter", status: correct}
      - {value: "She buys the stamp and sends the letter.", status: correct}
    feedback: "تمبر رو می‌خره و نامه رو می‌فرسته describes Nima's actions."
  fa.a1.unit34.lesson05.exercise05.write_post_sentence:
    instruction: "Write a short sentence about wanting a stamp or sending mail."
    accepted_answers:
      - {value: "یه تمبر می‌خوام", status: correct}
      - {value: "یه تمبر می‌خوام.", status: correct}
      - {value: "این بسته رو می‌فرستم", status: correct}
      - {value: "امروز می‌فرستمش", status: correct}
    feedback: "A short post-office sentence can ask for a stamp or say what you're sending."

  fa.a1.unit34.lesson06.exercise01.recognize_short_message:
    instruction: "What does this short message say?"
    correct_option: "Hello, I want a stamp for this letter."
    distractors:
      - "Hello, my package is late."
      - "Hello, my neighborhood is quiet."
      - "Hello, the post office is closed."
    accepted_answers: [{value: "Hello, I want a stamp for this letter.", status: correct}]
    feedback: "سلام، یه تمبر برای این نامه می‌خوام is a short post-office request."
  fa.a1.unit34.lesson06.exercise02.recognize_package_message:
    instruction: "What does this sentence say?"
    correct_option: "I'm sending the package. It arrives in three days."
    distractors:
      - "I'm buying a package tomorrow."
      - "The package already arrived."
      - "The package needs a stamp."
    accepted_answers: [{value: "I'm sending the package. It arrives in three days.", status: correct}]
    feedback: "بسته رو می‌فرستم. سه روزه می‌رسه gives a delivery detail."
  fa.a1.unit34.lesson06.exercise03.match_wrap_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {پستخانه: "post office", تمبر: stamp, نامه: letter, بسته: package, "می‌رسه": "it arrives", فرستادن: "to send", گرفتن: "to receive", امروز: today}
        status: correct
    feedback: "This reviews the post-office vocabulary."
  fa.a1.unit34.lesson06.exercise04.word_order_wrap:
    instruction: "Put the words in order."
    accepted_answers: [{value: [بسته, رو, "می‌فرستم"], status: correct}]
    feedback: "بسته رو می‌فرستم means 'I'm sending the package.'"
  fa.a1.unit34.lesson06.exercise05.write_post_message:
    instruction: "Write a short message about buying a stamp or sending mail."
    accepted_answers:
      - {value: "یه تمبر می‌خوام", status: correct}
      - {value: "یه تمبر می‌خوام.", status: correct}
      - {value: "این نامه رو می‌فرستم", status: correct}
      - {value: "بسته رو می‌فرستم", status: correct}
      - {value: "سه روزه می‌رسه", status: correct}
    feedback: "A post-office message can ask for a stamp or say what you're sending and when it arrives."
