course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: basic room vocabulary, describing a home
    with numbers, household objects, location within the home, reading
    a short housing description, and a dialogue about someone's home.

units:
  fa.a1.unit19.housing:
    title: Housing
    description: Describe a basic home, rooms, household objects, and location.

lessons:
  fa.a1.unit19.lesson01.basic_room_vocab:
    title: "Basic room vocabulary"
  fa.a1.unit19.lesson02.describing_with_numbers:
    title: "Describing a home with numbers"
  fa.a1.unit19.lesson03.household_objects:
    title: "Household objects"
  fa.a1.unit19.lesson04.location_in_home:
    title: "Location within the home"
  fa.a1.unit19.lesson05.reading_a_housing_description:
    title: "Reading a housing description"
  fa.a1.unit19.lesson06.housing_dialogue:
    title: "A dialogue about a home"

teaching:
  fa.a1.unit19.lesson01.teach.khoone_word:
    title: House
    gloss: house
    note: "خونه means house/home (colloquial form of خانه)."
  fa.a1.unit19.lesson01.teach.otagh_khab_word:
    title: Bedroom
    gloss: bedroom
    note: "اتاق خواب literally means 'sleep room' -- bedroom."
  fa.a1.unit19.lesson01.teach.ashpazkhone_word:
    title: Kitchen
    gloss: kitchen
    note: "آشپزخانه means kitchen."
  fa.a1.unit19.lesson01.teach.hamoom_word:
    title: Bathroom
    gloss: bathroom
    note: "حموم means bathroom (colloquial form of حمام)."
  fa.a1.unit19.lesson02.teach.chand_ta_word:
    title: "How many"
    gloss: "how many"
    note: "چند تا means how many, used with countable nouns."
  fa.a1.unit19.lesson02.teach.do_ta_word:
    title: Two
    gloss: two
    note: "دو تا means two (of something countable)."
  fa.a1.unit19.lesson02.teach.dare_word:
    title: "It has"
    gloss: "it has"
    note: "داره is the colloquial contraction of دارد (has), used for describing a home's contents."
  fa.a1.unit19.lesson03.teach.takht_word:
    title: Bed
    gloss: bed
    note: "تخت means bed."
  fa.a1.unit19.lesson03.teach.miz_word:
    title: Table
    gloss: table
    note: "میز means table."
  fa.a1.unit19.lesson03.teach.sandali_word:
    title: Chair
    gloss: chair
    note: "صندلی means chair."
  fa.a1.unit19.lesson03.teach.ye_word:
    title: A/one
    gloss: "a / one"
    note: "یه is the colloquial contraction of یک (a/one)."
  fa.a1.unit19.lesson03.teach.va_word:
    title: And
    gloss: and
    note: "و means and, joining two clauses or items."
  fa.a1.unit19.lesson04.teach.too_word:
    title: "In/inside"
    gloss: "in / inside"
    note: "تو means in/inside, marking location within a room."
  fa.a1.unit19.lesson04.teach.kenar_word:
    title: "Next to"
    gloss: "next to"
    note: "کنار means next to."
  fa.a1.unit19.lesson04.teach.balaye_word:
    title: "Above/on top of"
    gloss: "above / on top of"
    note: "بالای means above/on top of."
  fa.a1.unit19.lesson04.teach.takhte_word:
    title: "It's the bed"
    gloss: "it's the bed"
    note: "تخته is the colloquial contraction of تخت است (it is the bed)."
  fa.a1.unit19.lesson04.teach.ashpazkhones_word:
    title: "It's the kitchen"
    gloss: "it's the kitchen"
    note: "آشپزخانه‌س is the colloquial contraction of آشپزخانه است (it is the kitchen)."
  fa.a1.unit19.lesson05.teach.ham_word:
    title: "Also/too"
    gloss: "also / too"
    note: "هم means also or too, placed after the word it modifies."
  fa.a1.unit19.lesson05.teach.man_word:
    title: I
    gloss: I
    note: "من means I."
  fa.a1.unit19.lesson05.teach.khoonye_word:
    title: "House of / my house"
    gloss: "house of / my house"
    note: "خونه‌ی is the ezafe form of خونه, used before a possessor (خونه‌ی من = my house)."
  fa.a1.unit19.lesson05.teach.reading_text:
    title: "Sample housing description"
    gloss: "My house has two bedrooms. It also has a kitchen and a bathroom."
    note: "A short first-person description combining this unit's housing vocabulary."
  fa.a1.unit19.lesson06.teach.names:
    title: "Nima and Sara"
    gloss: "Nima, Sara"
    note: "Common Iranian names used throughout this course."
  fa.a1.unit19.lesson06.teach.khoonet_chetore_phrase:
    title: "How's your house?"
    gloss: "How's your house?"
    note: "خونه‌ت چطوره؟ combines خونه‌ت (your house) with چطوره؟ (how is it?)."
  fa.a1.unit19.lesson06.teach.khoobe_word:
    title: "It's good"
    gloss: "it's good"
    note: "خوبه is the colloquial contraction of خوب است (it is good)."
  fa.a1.unit19.lesson06.teach.aare_word:
    title: Yeah
    gloss: yeah
    note: "آره is the colloquial form of بله (yes)."
  fa.a1.unit19.lesson06.teach.dialogue_line1:
    title: "Nima asks"
    gloss: "How's your house?"
  fa.a1.unit19.lesson06.teach.dialogue_line2:
    title: "Sara answers"
    gloss: "It's good. It has two bedrooms and a kitchen."
  fa.a1.unit19.lesson06.teach.dialogue_line3:
    title: "Nima asks"
    gloss: "Does it have a bathroom too?"
  fa.a1.unit19.lesson06.teach.dialogue_line4:
    title: "Sara answers"
    gloss: "Yeah, it has a bathroom too."

exercises:
  fa.a1.unit19.lesson01.exercise01.recognize_otagh_khab:
    instruction: "What does this phrase mean?"
    correct_option: bedroom
    distractors: [kitchen, bathroom, house]
    accepted_answers: [{value: bedroom, status: correct}]
    feedback: "اتاق خواب means bedroom."
  fa.a1.unit19.lesson01.exercise02.recognize_ashpazkhone:
    instruction: "What does this word mean?"
    correct_option: kitchen
    distractors: [bedroom, bathroom, house]
    accepted_answers: [{value: kitchen, status: correct}]
    feedback: "آشپزخانه means kitchen."
  fa.a1.unit19.lesson01.exercise03.match_room_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {خونه: house, "اتاق خواب": bedroom, آشپزخانه: kitchen, حموم: bathroom}
        status: correct
    feedback: "These four are this lesson's core housing vocabulary."
  fa.a1.unit19.lesson01.exercise04.translate_house:
    instruction: "Translate into Farsi: house"
    accepted_answers:
      - {value: خونه, status: correct}
    feedback: "خونه means house."
  fa.a1.unit19.lesson01.exercise05.translate_bedroom:
    instruction: "Translate into Farsi: bedroom"
    accepted_answers:
      - {value: "اتاق خواب", status: correct}
    feedback: "اتاق خواب means bedroom."
  fa.a1.unit19.lesson02.exercise01.recognize_chand_ta:
    instruction: "What does this phrase mean?"
    correct_option: "how many"
    distractors: [two, "it has", house]
    accepted_answers: [{value: "how many", status: correct}]
    feedback: "چند تا means how many."
  fa.a1.unit19.lesson02.exercise02.recognize_dare:
    instruction: "What does this word mean?"
    correct_option: "it has"
    distractors: ["how many", two, house]
    accepted_answers: [{value: "it has", status: correct}]
    feedback: "داره means it has."
  fa.a1.unit19.lesson02.exercise03.match_number_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"چند تا": "how many", "دو تا": two, داره: "it has", "اتاق خواب": bedroom, آشپزخانه: kitchen, حموم: bathroom}
        status: correct
    feedback: "These combine lesson02's new words with lesson01's review vocabulary."
  fa.a1.unit19.lesson02.exercise04.translate_how_many_bedrooms:
    instruction: "Translate into Farsi: How many bedrooms does it have?"
    accepted_answers:
      - {value: "چند تا اتاق خواب داره", status: correct}
      - {value: "چند تا اتاق خواب داره؟", status: correct}
    feedback: "چند تا اتاق خواب داره؟ means how many bedrooms does it have?"
  fa.a1.unit19.lesson02.exercise05.translate_two_bedrooms:
    instruction: "Translate into Farsi: It has two bedrooms."
    accepted_answers:
      - {value: "دو تا اتاق خواب داره", status: correct}
    feedback: "دو تا اتاق خواب داره means it has two bedrooms."
  fa.a1.unit19.lesson03.exercise01.recognize_takht:
    instruction: "What does this word mean?"
    correct_option: bed
    distractors: [table, chair, house]
    accepted_answers: [{value: bed, status: correct}]
    feedback: "تخت means bed."
  fa.a1.unit19.lesson03.exercise02.recognize_miz:
    instruction: "What does this word mean?"
    correct_option: table
    distractors: [bed, chair, house]
    accepted_answers: [{value: table, status: correct}]
    feedback: "میز means table."
  fa.a1.unit19.lesson03.exercise03.match_object_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {تخت: bed, میز: table, صندلی: chair, "اتاق خواب": bedroom, داره: "it has", "چند تا": "how many"}
        status: correct
    feedback: "These combine lesson03's new words with earlier review vocabulary."
  fa.a1.unit19.lesson03.exercise04.translate_a_table_and_chair:
    instruction: "Translate into Farsi: a table and a chair"
    accepted_answers:
      - {value: "یه میز و یه صندلی", status: correct}
      - {value: "میز و صندلی", status: correct}
    feedback: "یه میز و یه صندلی means a table and a chair."
  fa.a1.unit19.lesson03.exercise05.translate_bedroom_has_bed:
    instruction: "Translate into Farsi: The bedroom has a bed."
    accepted_answers:
      - {value: "اتاق خواب یه تخت داره", status: correct}
    feedback: "اتاق خواب یه تخت داره means the bedroom has a bed."
  fa.a1.unit19.lesson04.exercise01.recognize_too:
    instruction: "What does this word mean?"
    correct_option: "in/inside"
    distractors: ["next to", "above/on top of", bed]
    accepted_answers: [{value: "in/inside", status: correct}]
    feedback: "تو means in/inside."
  fa.a1.unit19.lesson04.exercise02.recognize_kenar:
    instruction: "What does this word mean?"
    correct_option: "next to"
    distractors: ["in/inside", "above/on top of", table]
    accepted_answers: [{value: "next to", status: correct}]
    feedback: "کنار means next to."
  fa.a1.unit19.lesson04.exercise03.match_location_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {تو: "in/inside", کنار: "next to", "بالای": "above/on top of", تخت: bed, میز: table, صندلی: chair}
        status: correct
    feedback: "These combine lesson04's new words with earlier review vocabulary."
  fa.a1.unit19.lesson04.exercise04.translate_table_next_to_bed:
    instruction: "Translate into Farsi: The table is next to the bed."
    accepted_answers:
      - {value: "میز کنار تخته", status: correct}
    feedback: "میز کنار تخته means the table is next to the bed."
  fa.a1.unit19.lesson04.exercise05.translate_chair_in_kitchen:
    instruction: "Translate into Farsi: The chair is in the kitchen."
    accepted_answers:
      - {value: "صندلی تو آشپزخانه‌س", status: correct}
    feedback: "صندلی تو آشپزخانه‌س means the chair is in the kitchen."
  fa.a1.unit19.lesson05.exercise01.reading_comprehension_how_many_bedrooms:
    instruction: "Read the text. How many bedrooms does the house have?"
    correct_option: Two
    distractors: [One, Three, "It isn't stated"]
    accepted_answers: [{value: Two, status: correct}]
    feedback: "The text says دو تا اتاق خواب داره -- it has two bedrooms."
  fa.a1.unit19.lesson05.exercise02.reading_comprehension_what_else:
    instruction: "Read the text. What else does the house have?"
    correct_option: "A kitchen and a bathroom"
    distractors: ["A table and a chair", "A bed", "It isn't stated"]
    accepted_answers: [{value: "A kitchen and a bathroom", status: correct}]
    feedback: "The text says یه آشپزخانه و یه حموم هم داره -- it also has a kitchen and a bathroom."
  fa.a1.unit19.lesson05.exercise03.match_reading_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {خونه: house, "دو تا": two, "اتاق خواب": bedroom, آشپزخانه: kitchen, حموم: bathroom, یه: "a/one"}
        status: correct
    feedback: "These are the reading text's key words."
  fa.a1.unit19.lesson05.exercise04.translate_house_has_two_bedrooms:
    instruction: "Translate into Farsi: My house has two bedrooms."
    accepted_answers:
      - {value: "خونه‌ی من دو تا اتاق خواب داره", status: correct}
    feedback: "خونه‌ی من دو تا اتاق خواب داره means my house has two bedrooms."
  fa.a1.unit19.lesson05.exercise05.write_own_home_description:
    instruction: "Write one sentence in Farsi describing your home (mention a room, an object, or how many of something it has)."
    accepted_answers:
      - {value: "خونه‌ی من یه اتاق خواب داره", status: correct}
      - {value: "خونه‌ی من دو تا اتاق خواب داره", status: correct}
      - {value: "خونه‌ی من یه آشپزخانه داره", status: correct}
      - {value: "خونه‌ی من یه حموم داره", status: correct}
      - {value: "اتاق خواب یه تخت داره", status: correct}
    feedback: "خونه‌ی من یه اتاق خواب داره means my house has one bedroom -- a good model answer. Any true description using this unit's vocabulary is equally accepted."
  fa.a1.unit19.lesson06.exercise01.dialogue_comprehension_context:
    instruction: "Read the conversation. How many bedrooms does Sara's house have?"
    correct_option: Two
    distractors: [One, Three, "It isn't stated"]
    accepted_answers: [{value: Two, status: correct}]
    feedback: "سارا says دو تا اتاق خواب -- two bedrooms."
  fa.a1.unit19.lesson06.exercise02.match_dialogue_facts:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {نیما: Nima, سارا: Sara, "اتاق خواب": bedroom, آشپزخانه: kitchen, حموم: bathroom, خوبه: "it's good"}
        status: correct
    feedback: "These are the dialogue's key words and names."
  fa.a1.unit19.lesson06.exercise03.reading_comprehension_does_it_have_bathroom:
    instruction: "Read the lines. Does the house have a bathroom?"
    correct_option: "Yes"
    distractors: ["No", "It isn't stated", "Maybe"]
    accepted_answers: [{value: "Yes", status: correct}]
    feedback: "سارا says آره، یه حموم هم داره -- yeah, it also has a bathroom."
  fa.a1.unit19.lesson06.exercise04.dialogue_response_describe_home:
    instruction: "Someone asks how your house is. Say it has two bedrooms."
    accepted_answers:
      - {value: "دو تا اتاق خواب داره", status: correct}
    feedback: "دو تا اتاق خواب داره means it has two bedrooms."
  fa.a1.unit19.lesson06.exercise05.write_home_summary:
    instruction: "Write one or two sentences in Farsi summarizing Sara's house: it has two bedrooms and a kitchen."
    accepted_answers:
      - {value: "خونه‌ی سارا دو تا اتاق خواب داره. یه آشپزخانه هم داره", status: correct}
      - {value: "خونه‌ی سارا دو تا اتاق خواب داره، یه آشپزخانه هم داره", status: correct}
      - {value: "خونه‌ی سارا دو تا اتاق خواب داره و یه آشپزخانه داره", status: correct}
    feedback: "خونه‌ی سارا دو تا اتاق خواب داره و یه آشپزخانه داره means Sara's house has two bedrooms and a kitchen."
