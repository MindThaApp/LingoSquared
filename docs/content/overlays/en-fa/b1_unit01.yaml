course:
  title: Farsi B1
  description: >-
    Intermediate Iranian Farsi: expressing present necessity and past
    regret about an unfulfilled obligation using باید (invariant) plus
    a conjugated subordinate verb, across everyday work/life situations.

units:
  fa.b1.unit01.necessity:
    title: Necessity and Obligation
    description: Express what you must, should, or should have done, using a fixed modal plus a conjugated verb, in present and past tense.

lessons:
  fa.b1.unit01.lesson01.present_necessity_1st2nd:
    title: "I must / you must"
  fa.b1.unit01.lesson02.present_necessity_all_persons:
    title: "All the persons"
  fa.b1.unit01.lesson03.past_necessity_and_negation:
    title: "I should have / must not"
  fa.b1.unit01.lesson04.dialogue_deadline:
    title: "Tomorrow's report"
  fa.b1.unit01.lesson05.reading_two_obligations:
    title: "Two reports"
  fa.b1.unit01.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  fa.b1.unit01.lesson01.teach.bayad:
    title: must / should
    gloss: must / should
    note: "*باید* is invariant -- never conjugates for person. English 'must' is also invariant, so this part is intuitive; the trap is the verb AFTER *باید*, which Persian conjugates but English doesn't (English just uses the bare infinitive: 'I must go,' not a special go-form)."
    example_gloss: "I must go home."
  fa.b1.unit01.lesson01.teach.beram:
    title: "(that) I go"
    gloss: "(that) I go"
    note: "Subjunctive 'go,' matching 'I.' This is the part that changes with person -- English speakers instinctively look for person-marking on *باید* itself (like an English modal would, if English modals conjugated) and need to redirect that instinct to the verb instead."
    example_gloss: "I must go to university."
  fa.b1.unit01.lesson01.teach.beri:
    title: "(that) you go"
    gloss: "(that) you go"
    note: "Subjunctive 'go,' matching 'you.'"
    example_gloss: "Must you go to the doctor?"
  fa.b1.unit01.lesson01.teach.grammar_bayad_invariant:
    title: "I must go. Must you go?"
    gloss: "I must go. Must you go?"
    note: "*باید* never conjugates for person -- it's the same word whether you say I must, you must, or they must. Instead, the VERB after it changes: *باید برم* (I must go), *باید بری* (you must go). This is the opposite of *می‌تونم* (I can), which itself conjugates -- *باید* stays fixed, and the subjunctive verb after it carries the person. Don't try to mark 'I' on *باید* itself -- that never happens; the marking always goes on the verb after it."
  fa.b1.unit01.lesson01.teach.chera:
    title: why
    gloss: why
    note: "*چرا* means 'why' -- a reviewed/reinforced question word."
    example_gloss: "Why must you go?"
  fa.b1.unit01.lesson01.teach.emruz:
    title: today
    gloss: today
    note: "*امروز* means 'today.'"
    example_gloss: "Today I must work."
  fa.b1.unit01.lesson01.teach.kar_konam:
    title: "(that I) work"
    gloss: "(that I) work"
    note: "*کار کنم* -- subjunctive of *کار کردن* (to work), matching 'I.'"
    example_gloss: "I must work."

  fa.b1.unit01.lesson02.teach.bere:
    title: "(that) he/she go"
    gloss: "(that) he/she go"
    example_gloss: "Nargess must go home."
  fa.b1.unit01.lesson02.teach.berim:
    title: "(that) we go"
    gloss: "(that) we go"
    example_gloss: "We must go to university."
  fa.b1.unit01.lesson02.teach.berid:
    title: "(that) you (pl.) go"
    gloss: "(that) you (pl.) go"
    example_gloss: "You (pl.) must go to the doctor."
  fa.b1.unit01.lesson02.teach.beran:
    title: "(that) they go"
    gloss: "(that) they go"
    example_gloss: "They must go home."
  fa.b1.unit01.lesson02.teach.grammar_agreement:
    title: "I must go, you must go, he/she must go, we must go, you (pl.) must go, they must go."
    gloss: "I must go, you must go, he/she must go, we must go, you (pl.) must go, they must go."
    note: "*باید* stays the same in every sentence -- only the subjunctive verb after it agrees with the subject: *برم* (I), *بری* (you), *بره* (he/she), *بریم* (we), *برید* (you pl.), *برن* (they). Compare with *می‌تونم* (I can), which itself changes for every person -- *باید* never does. Useful checkpoint: if you find yourself conjugating *باید*, stop -- conjugate the verb after it instead."
  fa.b1.unit01.lesson02.teach.nargess:
    title: "Nargess (name)"
    gloss: "Nargess"
    example_gloss: "Nargess has work today."
  fa.b1.unit01.lesson02.teach.una:
    title: they
    gloss: they
    example_gloss: "They must go."
  fa.b1.unit01.lesson02.teach.shoma:
    title: "you (plural/formal)"
    gloss: "you (plural/formal)"
    example_gloss: "You (pl.) must go."

  fa.b1.unit01.lesson03.teach.bayad_miraftam:
    title: I should have gone
    gloss: I should have gone
    note: "A genuine, common regret construction -- something you were supposed to do but didn't. Uses the past/imperfect stem, not the subjunctive from lessons 1-2."
    example_gloss: "Yesterday I should have gone to the doctor."
  fa.b1.unit01.lesson03.teach.nabayad:
    title: must not
    gloss: must not
    note: "Negate *باید* itself (ن‌ prefix) for prohibition -- different from negating the verb after it."
    example_gloss: "You must not go there."
  fa.b1.unit01.lesson03.teach.grammar_past_regret:
    title: "I must go. I should have gone. You must not go."
    gloss: "I must go. I should have gone. You must not go."
    note: "*باید می‌رفتم* = I should have gone (but didn't) -- a real regret about an unfulfilled past obligation. This uses *باید* + the PAST/IMPERFECT stem (*می‌رفتم*, *می‌کردم*), not the subjunctive used for present necessity. English 'should have gone' is the closest equivalent -- both languages mark this as a distinct past-regret form, not just present necessity moved to the past. Don't confuse *باید* + subjunctive (present necessity, *باید برم*) with *باید* + past stem (past regret, *باید می‌رفتم*) -- they look similar but mean different things."
  fa.b1.unit01.lesson03.teach.diruz:
    title: yesterday
    gloss: yesterday
    example_gloss: "Yesterday I should have gone to university."
  fa.b1.unit01.lesson03.teach.chon:
    title: because
    gloss: because
    example_gloss: "I didn't go because I was swamped."
  fa.b1.unit01.lesson03.teach.sar_sholough:
    title: "(my) head was busy / I was swamped"
    gloss: "(my) head was busy / I was swamped"
    note: "Idiomatic -- literally 'my head was crowded,' meaning 'I was too busy.'"
    example_gloss: "Yesterday I was swamped."
  fa.b1.unit01.lesson03.teach.naraftam:
    title: I didn't go
    gloss: I didn't go
    example_gloss: "Yesterday I didn't go to the doctor."

  fa.b1.unit01.lesson04.teach.gozaresh:
    title: report
    gloss: report
    example_gloss: "I must finish the report."
  fa.b1.unit01.lesson04.teach.tamum_konam:
    title: "(that I) finish"
    gloss: "(that I) finish"
    example_gloss: "I must finish this task."
  fa.b1.unit01.lesson04.teach.vaght_nadaram:
    title: I don't have time
    gloss: I don't have time
    example_gloss: "I don't have time today."
  fa.b1.unit01.lesson04.teach.komak:
    title: help
    gloss: help
    example_gloss: "I can help you."
  fa.b1.unit01.lesson04.teach.dialogue_sara_deadline:
    title: "Sara: Nargess, tomorrow I have to finish this report, but I don't have time."
    gloss: "Sara: Nargess, tomorrow I have to finish this report, but I don't have time."
  fa.b1.unit01.lesson04.teach.dialogue_nargess_ask:
    title: "Nargess: Do you have to work tonight?"
    gloss: "Nargess: Do you have to work tonight?"
  fa.b1.unit01.lesson04.teach.dialogue_sara_confirm:
    title: "Sara: Yeah, I think I have to stay and work."
    gloss: "Sara: Yeah, I think I have to stay and work."
  fa.b1.unit01.lesson04.teach.dialogue_nargess_offer:
    title: "Nargess: I can help you. Yesterday I should have gone to the doctor, but I didn't because I was swamped. Today I have time."
    gloss: "Nargess: I can help you. Yesterday I should have gone to the doctor, but I didn't because I was swamped. Today I have time."
  fa.b1.unit01.lesson04.teach.dialogue_sara_thanks:
    title: "Sara: Thanks Nargess, that helps a lot."
    gloss: "Sara: Thanks Nargess, that helps a lot."

  fa.b1.unit01.lesson05.teach.emsal:
    title: this year
    gloss: this year
    example_gloss: "This year I must work more."
  fa.b1.unit01.lesson05.teach.parsal:
    title: last year
    gloss: last year
    example_gloss: "Last year I should have gone to university."
  fa.b1.unit01.lesson05.teach.bishtar:
    title: more
    gloss: more
    example_gloss: "I should rest more."
  fa.b1.unit01.lesson05.teach.esterahat:
    title: "(that I) rest"
    gloss: "(that I) rest"
    example_gloss: "I must rest."
  fa.b1.unit01.lesson05.teach.reading_passage:
    title: "Reading: Sara's two reports"
    gloss: "Sara has an important report this year that she has to finish. Last year she also had a report, but she couldn't finish it on time because she had too much work. Now she thinks that last year she should have accepted less and rested more. This year Nargess is helping her, so she thinks this year will be better."

  fa.b1.unit01.lesson06.teach.grammar_review:
    title: "I must go, you must go, he/she must go, we must go, you (pl.) must go, they must go. I should have gone. You must not go."
    gloss: "I must go, you must go, he/she must go, we must go, you (pl.) must go, they must go. I should have gone. You must not go."
    note: "Review: present necessity = *باید* (invariant) + subjunctive verb matching the subject (*باید برم، باید بری، باید بره، باید بریم، باید برید، باید برن*). Past regret/unfulfilled obligation = *باید* + past/imperfect stem (*باید می‌رفتم* = I should have gone). Negate *باید* itself for *نباید* (must not). All six lessons in this unit use this same fixed-*باید*-plus-changing-verb pattern across different persons, tenses, and situations."
  fa.b1.unit01.lesson06.teach.bokonam:
    title: "(that I) do"
    gloss: "(that I) do"
    example_gloss: "I must do this task."
  fa.b1.unit01.lesson06.teach.in_kar:
    title: this task/thing
    gloss: this task/thing
    example_gloss: "I must do this task."

exercises:
  fa.b1.unit01.lesson01.exercise01.recognize_bayad:
    instruction: "What does this word mean?"
    correct_option: "must / should"
    distractors: ["can", "want", "have"]
    accepted_answers: [{value: "must / should", status: correct}]
    feedback: "باید means must/should."
  fa.b1.unit01.lesson01.exercise02.recognize_beram:
    instruction: "What does this word mean?"
    correct_option: "(that) I go"
    distractors: ["(that) you go", "I went", "I want to go"]
    accepted_answers: [{value: "(that) I go", status: correct}]
    feedback: "برم is the subjunctive 'I go.'"
  fa.b1.unit01.lesson01.exercise03.order_bayad_beram_khone:
    instruction: "Put the words in order: I must go home."
    accepted_answers:
      - {value: "باید برم خونه", status: correct}
    feedback: "باید برم خونه means I must go home."
  fa.b1.unit01.lesson01.exercise04.match_necessity_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {باید: "must/should", برم: "I go (subjunctive)", بری: "you go (subjunctive)", خونه: home, دانشگاه: university, دکتر: doctor}
        status: correct
    feedback: "These are this lesson's core necessity words."
  fa.b1.unit01.lesson01.exercise05.translate_must_go_university:
    instruction: "Translate into Farsi: I must go to university."
    accepted_answers:
      - {value: "باید برم دانشگاه", status: correct}
    feedback: "باید برم دانشگاه means I must go to university."
  fa.b1.unit01.lesson01.exercise06.speak_must_go_doctor:
    instruction: "Say aloud in Farsi: You must go to the doctor."
    accepted_answers:
      - {value: "باید بری دکتر", status: correct}
    feedback: "باید بری دکتر means you must go to the doctor."
  fa.b1.unit01.lesson01.exercise07.write_necessity_sentence:
    instruction: "Write in Farsi: Today I must work."
    accepted_answers:
      - {value: "امروز باید کار کنم", status: correct}
    feedback: "امروز باید کار کنم means today I must work."

  fa.b1.unit01.lesson02.exercise01.recognize_bere:
    instruction: "What does this word mean?"
    correct_option: "(that) he/she go"
    distractors: ["(that) they go", "(that) we go", "he/she went"]
    accepted_answers: [{value: "(that) he/she go", status: correct}]
    feedback: "بره is the subjunctive 'he/she go.'"
  fa.b1.unit01.lesson02.exercise02.recognize_berim:
    instruction: "What does this word mean?"
    correct_option: "(that) we go"
    distractors: ["(that) you (pl.) go", "(that) they go", "we went"]
    accepted_answers: [{value: "(that) we go", status: correct}]
    feedback: "بریم is the subjunctive 'we go.'"
  fa.b1.unit01.lesson02.exercise03.order_nargess_bayad_bere:
    instruction: "Put the words in order: Nargess must go home."
    accepted_answers:
      - {value: "نرگس باید بره خونه", status: correct}
    feedback: "نرگس باید بره خونه means Nargess must go home."
  fa.b1.unit01.lesson02.exercise04.match_person_forms:
    instruction: "Match each form with its meaning."
    accepted_answers:
      - value: {برم: "I (should) go", بری: "you (should) go", بره: "he/she (should) go", بریم: "we (should) go", برید: "you pl. (should) go", برن: "they (should) go"}
        status: correct
    feedback: "These are the six subjunctive person-forms of رفتن (to go) used after باید."
  fa.b1.unit01.lesson02.exercise05.translate_they_must_go_home:
    instruction: "Translate into Farsi: They must go home."
    accepted_answers:
      - {value: "اونا باید برن خونه", status: correct}
    feedback: "اونا باید برن خونه means they must go home."
  fa.b1.unit01.lesson02.exercise06.speak_we_must_go:
    instruction: "Say aloud in Farsi: We must go to university."
    accepted_answers:
      - {value: "باید بریم دانشگاه", status: correct}
    feedback: "باید بریم دانشگاه means we must go to university."
  fa.b1.unit01.lesson02.exercise07.write_nargess_necessity:
    instruction: "Write in Farsi: Nargess must go home."
    accepted_answers:
      - {value: "نرگس باید بره خونه", status: correct}
    feedback: "نرگس باید بره خونه means Nargess must go home."

  fa.b1.unit01.lesson03.exercise01.recognize_bayad_miraftam:
    instruction: "What does this mean?"
    correct_option: "I should have gone"
    distractors: ["I must go", "I went", "I can go"]
    accepted_answers: [{value: "I should have gone", status: correct}]
    feedback: "باید می‌رفتم means I should have gone (but didn't)."
  fa.b1.unit01.lesson03.exercise02.recognize_nabayad:
    instruction: "What does this word mean?"
    correct_option: "must not"
    distractors: ["must", "should have", "cannot"]
    accepted_answers: [{value: "must not", status: correct}]
    feedback: "نباید means must not."
  fa.b1.unit01.lesson03.exercise03.order_diruz_bayad_miraftam:
    instruction: "Put the words in order: Yesterday I should have gone to the doctor."
    accepted_answers:
      - {value: "دیروز باید می‌رفتم دکتر", status: correct}
    feedback: "دیروز باید می‌رفتم دکتر means yesterday I should have gone to the doctor."
  fa.b1.unit01.lesson03.exercise04.match_past_present_necessity:
    instruction: "Match each phrase with its meaning."
    accepted_answers:
      - value: {"باید برم": "I must go (now)", "باید می‌رفتم": "I should have gone (past regret)", نباید: "must not", دیروز: yesterday, چون: because, نرفتم: "I didn't go"}
        status: correct
    feedback: "These contrast present necessity with past regret."
  fa.b1.unit01.lesson03.exercise05.translate_should_not_go:
    instruction: "Translate into Farsi: You must not go there."
    accepted_answers:
      - {value: "نباید بری اونجا", status: correct}
    feedback: "نباید بری اونجا means you must not go there."
  fa.b1.unit01.lesson03.exercise06.speak_should_have_gone:
    instruction: "Say aloud in Farsi: Yesterday I should have gone to the doctor."
    accepted_answers:
      - {value: "دیروز باید می‌رفتم دکتر", status: correct}
    feedback: "دیروز باید می‌رفتم دکتر means yesterday I should have gone to the doctor."
  fa.b1.unit01.lesson03.exercise07.write_past_regret:
    instruction: "Write in Farsi: Yesterday I didn't go because I was busy."
    accepted_answers:
      - {value: "دیروز نرفتم چون سرم شلوغ بود", status: correct}
    feedback: "دیروز نرفتم چون سرم شلوغ بود means yesterday I didn't go because I was busy."

  fa.b1.unit01.lesson04.exercise01.comprehend_why_sara_stays:
    instruction: "Listen/read: Why must Sara work tonight?"
    correct_option: "She has to finish a report tomorrow and doesn't have enough time."
    distractors: ["She wants extra money.", "Nargess asked her to.", "She has a doctor's appointment."]
    accepted_answers: [{value: "She has to finish a report tomorrow and doesn't have enough time.", status: correct}]
    feedback: "Sara says she has to finish tomorrow's report but doesn't have time."
  fa.b1.unit01.lesson04.exercise02.recognize_gozaresh:
    instruction: "What does this word mean?"
    correct_option: report
    distractors: [letter, meeting, deadline]
    accepted_answers: [{value: report, status: correct}]
    feedback: "گزارش means report."
  fa.b1.unit01.lesson04.exercise03.order_bayad_gozaresh_tamum:
    instruction: "Put the words in order: I must finish this report."
    accepted_answers:
      - {value: "باید این گزارش رو تموم کنم", status: correct}
    feedback: "باید این گزارش رو تموم کنم means I must finish this report."
  fa.b1.unit01.lesson04.exercise04.match_dialogue_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
