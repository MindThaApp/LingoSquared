  fa.a2.unit48.lesson05.exercise05.listen_tired:
    instruction: Listen without a transcript. What does the speaker say?
    correct_option: I was tired yesterday, so I didn't come. I'll come tomorrow.
    distractors:
    - I was busy yesterday, so I didn't come. I'll come tomorrow.
    - I was tired yesterday, so I came. I'll call tomorrow.
    - I'm tired today, so I'm not coming. I'll come tomorrow.
    accepted_answers:
    - value: I was tired yesterday, so I didn't come. I'll come tomorrow.
      status: correct
    feedback: The audio gives a reason (*خسته بودم*), the result (*برای همین نیومدم*) and a plan (*فردا میام*).
