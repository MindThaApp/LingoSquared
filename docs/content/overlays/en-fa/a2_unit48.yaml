    feedback: The message says *جمعه رفتم تولد دوستم و کادو خریدم*.
  fa.a2.unit48.lesson05.exercise03.match_message_parts:
    instruction: Match each line of the message with the job it does.
    accepted_answers:
    - value:
        سلام سارا، خوبی؟: greeting
        ببخش که زنگ نزدم: apology
        جمعه رفتم تولد دوستم: what happened
        چون آخر هفته خیلی کار داشتم: reason
        برای همین شنبه نرفتم کلاس: result
        فردا می‌خوام برم سینما: plan
