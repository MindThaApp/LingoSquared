teaching:
  fa.a2.unit48.lesson01.teach.greet_words:
    title: Opening and closing words
    gloss: hi, how are you, what's new, sorry, bye for now
    note: A friendly message starts with *سلام* and the name, then often *خوبی؟* or *چه خبر؟*. *ببخش که ...* is a short apology. *فعلا* closes a message like “bye for now.”
    example_gloss:
    - Hi Nima, how are you?
    - What's new?
    - Sorry I didn't call.
    - Bye for now, Sara
  fa.a2.unit48.lesson01.teach.time_words:
    title: Time words for a message
    gloss: yesterday, the weekend, Friday, Saturday, tomorrow, later
    note: 'Put the time word first: it tells your friend whether you are talking about what happened or what comes next.'
    example_gloss:
    - I was tired yesterday.
    - I had work at the weekend.
    - On Friday I went to the park.
    - I'll call you tomorrow.
    - I'll come on Saturday.
    - I'll call you later.
  fa.a2.unit48.lesson01.teach.message_shape:
    title: The shape of a friendly message
    gloss: Hi Sara, how are you? On Friday I went to the park. Tomorrow I want to go to the cinema. Bye for now, Nima
    note: 'An informal message has four parts: greeting, what happened (past), what is next (future), and a sign-off. Short sentences and the spoken forms *می‌خوام* and *بهت* are normal; you do not need a formal letter opening.'
  fa.a2.unit48.lesson02.teach.birthday_gift:
    title: Birthday and gift
    gloss: birthday (party), gift
    note: '*تولد* is a birthday, and in speech *رفتم تولد دوستم* also means “I went to my friend''s birthday party.”'
    example_gloss:
    - On Friday I went to my friend's birthday.
    - I bought a gift for my friend.
    - Sara has a gift.
  fa.a2.unit48.lesson02.teach.celebration_words:
    title: Celebrations and congratulations
    gloss: celebration, wedding, congratulations, happy
    note: '*جشن* is a celebration, *عروسی* is a wedding, and *مبارک* follows the occasion in short friendly congratulations.'
    example_gloss:
    - On Friday I went to a celebration.
    - The wedding was on Friday.
    - Happy birthday, congratulations!
  fa.a2.unit48.lesson02.teach.message_news:
    title: Sharing news in a message
    gloss: I sent, I heard, success, thanks
    note: Use these words to say what you sent or heard and to react to a friend's success.
    example_gloss:
    - I sent a message.
    - I heard the news.
    - Congratulations on your success!
  fa.a2.unit48.lesson02.teach.past_verbs:
    title: Past verbs for telling what happened
    gloss: I went, I saw, I ate, I came, I stayed, I bought, I wrote, we went
    note: 'The past ending is *ـم* for “I” and *ـیم* for “we.” The negative adds *ن*: *نرفتم*, *نیومدم*, *نزدم*.'
    example_gloss:
    - I went to the cinema yesterday.
    - I saw a film.
    - I ate dinner and came home.
    - On Saturday I stayed home.
    - I wrote you a message.
    - Sara and I went to the park.
  fa.a2.unit48.lesson02.teach.past_story:
    title: Telling events in order
    gloss: On Friday I went to my friend's birthday and bought a gift; we went to the cinema and then had dinner
    note: Say the time first, then the events in the order they happened. Join them with *و*, and use *بعدش* (“after that”) to mark the next step. Every verb stays in the simple past.
  fa.a2.unit48.lesson03.teach.want_to:
    title: Saying what you are going to do
    gloss: I want to go, I want to come, I want to buy, I want to eat
    note: '*می‌خوام* plus a short verb (*برم*, *بیام*, *بخرم*, *بخورم*) is the usual way to say what you are going to do. In a message it reads as a plan, not only a wish.'
    example_gloss:
    - Tomorrow I want to go to the cinema.
    - On Saturday I want to come.
    - I want to buy a gift.
    - After the cinema I want to have dinner.
  fa.a2.unit48.lesson03.teach.feelings_and_memories:
    title: Feelings and memories
    gloss: memory, upset, missing someone, interesting
    note: '*ناراحت* says you are upset, while *دلتنگ* says you miss someone. *جالب* describes something interesting.'
    example_gloss:
    - The memory was interesting.
    - I was upset yesterday.
    - I was missing you.
  fa.a2.unit48.lesson03.teach.plain_present:
    title: The plain present for plans
    gloss: I'll come, I'll go, I'll buy, I'll call you
    note: With a time word such as *فردا* or *بعدا*, the plain present also means the future. Both *می‌خوام برم* and *می‌رم* are fine in a message.
    example_gloss:
    - I'll come on Saturday.
    - Tomorrow I'm going to the park.
    - Later I'll buy a gift.
    - I'll call you tomorrow.
  fa.a2.unit48.lesson03.teach.next_pattern:
    title: What's next
    gloss: Tomorrow I want to go to the cinema; after the cinema I'll call you
    note: Put the time word first, then the plan. Use *بعد از* with a place or event (*بعد از سینما*) and *بعدش* when the earlier step is already clear.
  fa.a2.unit48.lesson04.teach.reasons:
    title: Reasons in the past
    gloss: I was tired, I had work, I was sick, the weather was nice
    note: 'Reasons about the past use the past: *بودم*, *داشتم*. The weather is third person: *هوا خوب بود*.'
    example_gloss:
    - I was tired yesterday.
    - I had work at the weekend.
    - I was sick on Saturday.
    - The weather was nice on Friday.
  fa.a2.unit48.lesson04.teach.because_so:
    title: Because and so
    gloss: Because I was tired, I didn't come; I was tired, so I didn't come
    note: '*چون* introduces the reason: *چون خسته بودم، نیومدم* or *نیومدم، چون خسته بودم*. *برای همین* introduces the result and comes after the reason: *خسته بودم، برای همین نیومدم*. Do not put both in one sentence.'
  fa.a2.unit48.lesson05.teach.reading:
    title: A message from Nima
    gloss: Hi Sara, how are you? Sorry I didn't call, because I had a lot of work at the weekend. On Friday I went to my friend's birthday and bought a gift. The birthday was very good, but I came home late and I was tired. So on Saturday I didn't go to class. Tomorrow I want to go to the cinema, and after the cinema I'll call you. Bye for now, Nima
    note: Read once for the four parts (greeting, what happened, what's next, sign-off), then again for the reasons.
  fa.a2.unit48.lesson06.teach.turn01:
    title: Sara asks for news
    gloss: Hi Nima! What's new? What did you do at the weekend?
    note: Sara greets Nima and asks what he did.
  fa.a2.unit48.lesson06.teach.turn02:
    title: Nima tells what happened
    gloss: Hi Sara! On Friday I went to my friend's birthday. I bought a gift and it was very good.
    note: Nima uses the simple past for the events.
  fa.a2.unit48.lesson06.teach.turn03:
    title: Sara asks about Saturday
    gloss: Great! And Saturday?
    note: A short follow-up question.
  fa.a2.unit48.lesson06.teach.turn04:
    title: Nima gives a reason
    gloss: On Saturday I stayed home, because I was tired.
    note: '*چون* gives the reason.'
  fa.a2.unit48.lesson06.teach.turn05:
    title: Sara asks about tomorrow
    gloss: What do you want to do tomorrow?
    note: Sara asks about the plan.
  fa.a2.unit48.lesson06.teach.turn06:
    title: Nima says what's next
    gloss: Tomorrow I want to go to the cinema. After the cinema I'll call you.
    note: Plans use *می‌خوام* and the plain present.
  fa.a2.unit48.lesson06.teach.turn07:
    title: Sara signs off
    gloss: OK. Bye for now!
    note: The conversation ends with *فعلا*.
