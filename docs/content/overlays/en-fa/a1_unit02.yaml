course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi focused on reading the script, understanding
    everyday speech, and handling practical conversations politely.

units:
  fa.a1.unit02.introductions:
    title: Names, origins, and introductions

lessons:
  fa.a1.unit02.lesson01.script_ramp: {title: "Read the letters used in introductions"}
  fa.a1.unit02.lesson02.names: {title: "Ask and say a name"}
  fa.a1.unit02.lesson03.pronouns_and_boodan: {title: "Singular pronouns and to be"}
  fa.a1.unit02.lesson04.countries_nationalities: {title: "Countries and nationalities"}
  fa.a1.unit02.lesson05.origin: {title: "Ask where someone is from"}
  fa.a1.unit02.lesson06.language_class_dialogue: {title: "Meeting at a Farsi class"}

teaching:
  fa.a1.unit02.lesson01.teach.noon_te:
    title: "The letters ن and ت"
    gloss: "n and t"
    note: "ن represents n. ت represents t; both connect on either side."
  fa.a1.unit02.lesson01.teach.sheen_che:
    title: "The letters ش and چ"
    gloss: "sh and ch"
    note: "ش represents sh and چ represents ch."
  fa.a1.unit02.lesson01.teach.ye_he:
    title: "The letters ی and ه"
    gloss: "y/long i and h"
    note: "Persian ی is U+06CC; ه changes shape when connected."
  fa.a1.unit02.lesson01.teach.ke_gaf:
    title: "The letters ک and گ"
    gloss: "k and g"
    note: "Persian ک is U+06A9. گ adds an extra stroke and represents g."
  fa.a1.unit02.lesson01.teach.jim_dal:
    title: "The letters ج and د"
    gloss: "j and d"
    note: "ج represents j. د represents d and does not connect onward to the left."
  fa.a1.unit02.lesson01.teach.re_fe:
    title: "The letters ر and ف"
    gloss: "r and f"
    note: "ر represents r and does not connect onward; ف represents f."
  fa.a1.unit02.lesson01.teach.vav_be:
    title: "The letters و and ب"
    gloss: "v/o/u and b"
    note: "و can represent v or a vowel and does not connect onward. ب represents b."
  fa.a1.unit02.lesson01.teach.khe_ze:
    title: "The letters خ and ز"
    gloss: "kh and z"
    note: "خ is the sound commonly written kh; ز represents z."

  fa.a1.unit02.lesson02.teach.esm:
    title: "Name"
    gloss: "name"
    note: "اسم is read esm in ordinary Iranian Persian."
  fa.a1.unit02.lesson02.teach.man:
    title: "I"
    gloss: "I"
    note: "من is the first-person singular pronoun."
  fa.a1.unit02.lesson02.teach.sara:
    title: "Sara"
    gloss: "Sara"
    note: "سارا is a common Iranian given name."
  fa.a1.unit02.lesson02.teach.formal_name:
    title: "Formal or written self-introduction"
    gloss: "My name is Sara."
    note: "اسم من سارا است is grammatical but deliberately formal and written in register."
  fa.a1.unit02.lesson02.teach.spoken_name:
    title: "Natural spoken self-introduction"
    gloss: "My name is Sara."
    note: "اسمم contracts اسم من, while ساراست joins سارا and است."
  fa.a1.unit02.lesson02.teach.polite_question:
    title: "Ask a name politely"
    gloss: "What's your name?"
    note: "اسم شما چیه؟ is ordinary neutral-polite spoken Iranian Farsi."
  fa.a1.unit02.lesson02.teach.informal_question:
    title: "Ask a name informally"
    gloss: "What's your name?"
    note: "اسمت چیه؟ is singular and informal; use it only when the relationship permits."

  fa.a1.unit02.lesson03.teach.man:
    title: "I"
    gloss: "I"
    note: "من has no grammatical gender."
  fa.a1.unit02.lesson03.teach.to:
    title: "You, informal singular"
    gloss: "you"
    note: "تو is informal singular; polite address normally uses شما."
  fa.a1.unit02.lesson03.teach.oo:
    title: "He or she"
    gloss: "he / she"
    note: "او is gender-neutral and can refer to either he or she."
  fa.a1.unit02.lesson03.teach.man_hastam:
    title: "I am"
    gloss: "I am"
    note: "هستم is the first-person singular full form of بودن."
  fa.a1.unit02.lesson03.teach.to_hasti:
    title: "You are"
    gloss: "you are"
    note: "هستی agrees with informal singular تو."
  fa.a1.unit02.lesson03.teach.oo_hast:
    title: "He or she is"
    gloss: "he/she is; he/she is present"
    note: "هست is the third-person singular full form and often carries existence or emphasis."
  fa.a1.unit02.lesson03.teach.oo_ast:
    title: "Formal identity predicate"
    gloss: "He or she is Iranian."
    note: "In a neutral formal-written identity sentence, است is the ordinary third-person copula."
  fa.a1.unit02.lesson03.teach.spoken_copula:
    title: "Spoken identity predicate"
    gloss: "He or she is Iranian."
    note: "ایرانیه is the natural spoken contraction of ایرانی است."

  fa.a1.unit02.lesson04.teach.iran:
    title: "Iran"
    gloss: "Iran"
    note: "ایران is a country name."
  fa.a1.unit02.lesson04.teach.iranian:
    title: "Iranian"
    gloss: "Iranian"
    note: "ایرانی can describe nationality or origin."
  fa.a1.unit02.lesson04.teach.england:
    title: "England"
    gloss: "England"
    note: "انگلیس ordinarily refers to England in Iranian Persian."
  fa.a1.unit02.lesson04.teach.english:
    title: "English"
    gloss: "English"
    note: "انگلیسی can describe nationality, language, or something associated with England; context resolves the meaning."
  fa.a1.unit02.lesson04.teach.france:
    title: "France"
    gloss: "France"
    note: "فرانسه is the country name France."
  fa.a1.unit02.lesson04.teach.french:
    title: "French"
    gloss: "French"
    note: "فرانسوی can describe nationality or something associated with France."
  fa.a1.unit02.lesson04.teach.country:
    title: "Country"
    gloss: "country"
    note: "کشور is the general word for country."
  fa.a1.unit02.lesson04.teach.nationality:
    title: "Nationality"
    gloss: "nationality"
    note: "ملیت is the formal noun nationality."

  fa.a1.unit02.lesson05.teach.ahl:
    title: "From or originally of"
    gloss: "from / originally of"
    note: "اهل links a person to a place of origin; it does not simply mean currently living in a place."
  fa.a1.unit02.lesson05.teach.koja:
    title: "Where"
    gloss: "where"
    note: "کجا asks about a place."
  fa.a1.unit02.lesson05.teach.formal_question:
    title: "Formal standard question"
    gloss: "Where are you from?"
    note: "اهل کجا هستید؟ is polite standard Persian and fits formal speech or careful reading."
  fa.a1.unit02.lesson05.teach.polite_spoken_question:
    title: "Neutral-polite spoken question"
    gloss: "Where are you from?"
    note: "اهل کجا هستین؟ is the ordinary polite spoken form in Iranian Farsi."
  fa.a1.unit02.lesson05.teach.informal_question:
    title: "Informal question"
    gloss: "Where are you from?"
    note: "اهل کجایی؟ is informal singular."
  fa.a1.unit02.lesson05.teach.origin_answer:
    title: "State a place of origin"
    gloss: "I'm from Iran."
    note: "من اهل ایران هستم states origin rather than current residence."
  fa.a1.unit02.lesson05.teach.nationality_answer:
    title: "Short nationality answer"
    gloss: "I'm Iranian."
    note: "ایرانی‌ام joins ایرانی to the first-person copula ـام with a ZWNJ."

  fa.a1.unit02.lesson06.teach.arrival:
    title: "Check the location"
    gloss: "Sara asks whether this is the Farsi class."
    note: "ببخشید politely gets attention before a practical question."
  fa.a1.unit02.lesson06.teach.yes:
    title: "Yes"
    gloss: "yes"
    note: "بله is the neutral-polite word for yes."
  fa.a1.unit02.lesson06.teach.meet_mina:
    title: "Mina introduces herself"
    gloss: "Mina confirms the location, introduces herself, and asks Sara's name."
    note: "The spoken polite question fits two adults meeting at a class."
  fa.a1.unit02.lesson06.teach.sara_name:
    title: "Sara gives her name"
    gloss: "My name is Sara."
    note: "Sara uses the compact spoken pattern taught earlier."
  fa.a1.unit02.lesson06.teach.ask_origin:
    title: "Mina asks about origin"
    gloss: "Where are you from?"
    note: "هستین keeps the exchange polite but conversational."
  fa.a1.unit02.lesson06.teach.exchange_origins_sara:
    title: "Exchange origins"
    gloss: "Sara says she is from England and asks if Mina is from Iran."
    note: "The two speakers retain polite forms because they have just met."
  fa.a1.unit02.lesson06.teach.exchange_origins_mina:
    title: "Exchange origins, reply"
    gloss: "Mina confirms she is Iranian."
    note: "ایرانی‌ام contracts ایرانی هستم (\"I am Iranian\")."
  fa.a1.unit02.lesson06.teach.pleased:
    title: "Acknowledge the introduction"
    gloss: "Sara says she is pleased to meet Mina."
    note: "از آشنایی با شما خوشوقتم provides a natural close to their exchange."
  fa.a1.unit02.lesson06.teach.pleased_and_enter:
    title: "Return the greeting and enter the class"
    gloss: "Mina says she is pleased too and invites Sara inside."
    note: "من هم همین‌طور returns Sara's polite greeting before بفرمایید داخل moves the class scenario forward."

exercises:
  fa.a1.unit02.lesson01.exercise01.recognize_noon:
    instruction: "Which letter represents n?"
    correct_option: ن
    distractors: [ت, ر, و]
    accepted_answers: [{value: ن, status: correct}]
    feedback: "ن represents n."
  fa.a1.unit02.lesson01.exercise02.recognize_che:
    instruction: "Which letter represents ch?"
    correct_option: چ
    distractors: [ش, ج, خ]
    accepted_answers: [{value: چ, status: correct}]
    feedback: "چ represents ch."
  fa.a1.unit02.lesson01.exercise03.match_ye_he:
    instruction: "Match each letter with its approximate sound."
    accepted_answers:
      - value: {ی: y, ه: h}
        status: correct
    feedback: "ی can represent y or long i; ه represents h."
  fa.a1.unit02.lesson01.exercise04.choose_persian_ke:
    instruction: "Select the Persian letter k."
    correct_option: ک
    distractors: [گ, ج, ف]
    accepted_answers: [{value: ک, status: correct}]
    feedback: "Persian ک represents k."
  fa.a1.unit02.lesson01.exercise05.match_ke_gaf:
    instruction: "Match ک and گ with their sounds."
    accepted_answers:
      - value: {ک: k, گ: g}
        status: correct
    feedback: "ک is k and گ is g."
  fa.a1.unit02.lesson01.exercise06.recognize_fe:
    instruction: "Which letter represents f?"
    correct_option: ف
    distractors: [و, ب, ت]
    accepted_answers: [{value: ف, status: correct}]
    feedback: "ف represents f."
  fa.a1.unit02.lesson01.exercise07.match_vav_be:
    instruction: "Match the two letters with their approximate sound values."
    accepted_answers:
      - value: {و: v_or_o, ب: b}
        status: correct
    feedback: "و can represent v or a vowel; ب represents b."
  fa.a1.unit02.lesson01.exercise08.match_khe_ze:
    instruction: "Match the two letters with their approximate sounds."
    accepted_answers:
      - value: {خ: kh, ز: z}
        status: correct
    feedback: "خ is commonly romanized kh and ز represents z."

  fa.a1.unit02.lesson02.exercise01.listen_esme_shoma:
    instruction: "Listen and select what information the speaker requests."
    correct_option: "the listener's name"
    distractors: ["the listener's country", "the time", "the speaker's job"]
    accepted_answers: [{value: "the listener's name", status: correct}]
    feedback: "اسم شما چیه؟ asks the listener's name."
  fa.a1.unit02.lesson02.exercise02.name_meaning:
    instruction: "Select the meaning of اسم."
    correct_option: name
    distractors: [country, class, language]
    accepted_answers: [{value: name, status: correct}]
    feedback: "اسم means name."
  fa.a1.unit02.lesson02.exercise03.formal_name:
    instruction: "Arrange the formal-written self-introduction."
    accepted_answers: [{value: [اسم, من, سارا, است], status: correct}]
    feedback: "اسم من سارا است is the deliberately formal-written pattern."
  fa.a1.unit02.lesson02.exercise04.listen_spoken_name:
    instruction: "Listen and type the spoken self-introduction."
    accepted_answers:
      - {value: "اسمم ساراست", status: correct}
      - {value: "اسمم ساراست.", status: correct}
      - {value: "اسمم سارا است", status: acceptable_with_note, note: "Understandable spelling with the copula separated."}
    feedback: "The audio says اسمم ساراست."
  fa.a1.unit02.lesson02.exercise05.choose_spoken:
    instruction: "Which register best describes اسمم ساراست؟"
    correct_option: spoken_neutral
    distractors: [formal_written, ceremonial, plural_only]
    accepted_answers: [{value: spoken_neutral, status: correct}]
    feedback: "اسمم ساراست is a natural compact spoken introduction."
  fa.a1.unit02.lesson02.exercise06.reply_name:
    instruction: "Reply as Sara."
    accepted_answers:
      - {value: "اسمم ساراست", status: correct}
      - {value: "من سارا هستم", status: correct}
      - {value: "سارا هستم", status: correct}
      - {value: "اسم من ساراست", status: correct}
      - {value: "اسمم سارا است", status: acceptable_with_note, note: "Understandable spelling with the copula separated."}
      - {value: "اسم من سارا است", status: acceptable_with_note, note: "Correct but more formal than the prompt."}
    feedback: "A natural spoken reply is اسمم ساراست."
  fa.a1.unit02.lesson02.exercise07.choose_informal:
    instruction: "Which register best describes اسمت چیه؟"
    correct_option: informal_singular
    distractors: [formal_written, polite_plural, ceremonial]
    accepted_answers: [{value: informal_singular, status: correct}]
    feedback: "The attached ـت marks informal singular your."
  fa.a1.unit02.lesson02.exercise08.speak_name:
    instruction: "Say that your name is Sara."
    accepted_answers:
      - {value: "اسمم ساراست", status: correct}
      - {value: "من سارا هستم", status: correct}
      - {value: "سارا هستم", status: correct}
      - {value: "اسم من ساراست", status: correct}
      - {value: "اسمم سارا است", status: acceptable_with_note, note: "Understandable spelling with the copula separated."}
    feedback: "Any of these forms gives Sara's name naturally."

  fa.a1.unit02.lesson03.exercise01.pronoun_i:
    instruction: "Select the Persian pronoun meaning I."
    correct_option: من
    distractors: [تو, او, شما]
    accepted_answers: [{value: من, status: correct}]
    feedback: "من means I."
  fa.a1.unit02.lesson03.exercise02.pronoun_you:
    instruction: "Select informal singular you."
    correct_option: تو
    distractors: [من, او, شما]
    accepted_answers: [{value: تو, status: correct}]
    feedback: "تو is informal singular you."
  fa.a1.unit02.lesson03.exercise03.pronoun_gender:
    instruction: "Can او refer to either a man or a woman?"
    options: ["Yes", "No"]
    accepted_answers: [{value: "Yes", status: correct}]
    feedback: "Persian third-person singular pronouns do not mark grammatical gender."
  fa.a1.unit02.lesson03.exercise04.order_i_am:
    instruction: "Arrange the words for I am."
    accepted_answers: [{value: [من, هستم], status: correct}]
    feedback: "من هستم means I am."
  fa.a1.unit02.lesson03.exercise05.order_you_are:
    instruction: "Arrange the words for informal singular you are."
    accepted_answers: [{value: [تو, هستی], status: correct}]
    feedback: "تو هستی uses the informal singular form."
  fa.a1.unit02.lesson03.exercise06.listen_forms:
    instruction: "Order the three forms you hear."
    accepted_answers:
      - {value: [من, هستم, تو, هستی, او, هست], status: correct}
    feedback: "The audio gives the three singular full forms in person order."
  fa.a1.unit02.lesson03.exercise07.formal_third_person:
    instruction: "Which register best describes او ایرانی است؟"
    correct_option: formal_or_written
    distractors: [informal_spoken, plural_only, ungrammatical]
    accepted_answers: [{value: formal_or_written, status: correct}]
    feedback: "است is the ordinary formal-written third-person copula here."
  fa.a1.unit02.lesson03.exercise08.spoken_third_person:
    instruction: "Select the meaning of او ایرانیه."
    correct_option: "He or she is Iranian."
    distractors: ["I am Iranian.", "You are Iranian.", "He or she is in Iran."]
    accepted_answers: [{value: "He or she is Iranian.", status: correct}]
    feedback: "او is gender-neutral and ایرانیه is the spoken predicate."

  fa.a1.unit02.lesson04.exercise01.iran_pair:
    instruction: "Match the country to the nationality."
    accepted_answers:
      - value: {ایران: ایرانی}
        status: correct
    feedback: "ایران is the country and ایرانی is the corresponding nationality."
  fa.a1.unit02.lesson04.exercise02.england_pair:
    instruction: "Match the country to the nationality."
    accepted_answers:
      - value: {انگلیس: انگلیسی}
        status: correct
    feedback: "انگلیس pairs with انگلیسی."
  fa.a1.unit02.lesson04.exercise03.france_pair:
    instruction: "Match the country to the nationality."
    accepted_answers:
      - value: {فرانسه: فرانسوی}
        status: correct
    feedback: "فرانسه pairs with فرانسوی."
  fa.a1.unit02.lesson04.exercise04.listen_countries:
    instruction: "Order the country names you hear."
    accepted_answers:
      - {value: [ایران, انگلیس, فرانسه], status: correct}
    feedback: "The audio order is ایران، انگلیس، فرانسه."
  fa.a1.unit02.lesson04.exercise05.listen_nationalities:
    instruction: "Listen and select all three nationality words."
    correct_option: "ایرانی / انگلیسی / فرانسوی"
    distractors: ["ایران / انگلیس / فرانسه", "کشور / ملیت / ایران", "من / تو / او"]
    accepted_answers: [{value: "ایرانی / انگلیسی / فرانسوی", status: correct}]
    feedback: "The audio contains three nationality adjectives."
  fa.a1.unit02.lesson04.exercise06.country_meaning:
    instruction: "Select the meaning of کشور."
    correct_option: country
    distractors: [nationality, name, class]
    accepted_answers: [{value: country, status: correct}]
    feedback: "کشور means country."
  fa.a1.unit02.lesson04.exercise07.nationality_meaning:
    instruction: "Select the meaning of ملیت."
    correct_option: nationality
    distractors: [country, language_class, surname]
    accepted_answers: [{value: nationality, status: correct}]
    feedback: "ملیت means nationality."
  fa.a1.unit02.lesson04.exercise08.choose_iranian:
    instruction: "Select the nationality corresponding to ایران."
    correct_option: ایرانی
    distractors: [انگلیسی, فرانسوی, فرانسه]
    accepted_answers: [{value: ایرانی, status: correct}]
    feedback: "ایرانی means Iranian."

  fa.a1.unit02.lesson05.exercise01.listen_formal:
    instruction: "Listen and select the register."
    correct_option: formal_standard
    distractors: [informal_singular, slang, child_directed]
    accepted_answers: [{value: formal_standard, status: correct}]
    feedback: "هستید marks the formal-standard polite form."
  fa.a1.unit02.lesson05.exercise02.listen_polite_spoken:
    instruction: "Listen and type the neutral-polite spoken question."
    accepted_answers:
      - {value: "اهل کجا هستین؟", status: correct}
      - {value: "اهل کجا هستین", status: correct}
    feedback: "The audio says اهل کجا هستین؟"
  fa.a1.unit02.lesson05.exercise03.choose_informal:
    instruction: "Which register best describes اهل کجایی؟"
    correct_option: informal_singular
    distractors: [formal_written, polite_plural, ceremonial]
    accepted_answers: [{value: informal_singular, status: correct}]
    feedback: "کجایی uses informal singular agreement."
  fa.a1.unit02.lesson05.exercise04.order_formal:
    instruction: "Arrange the formal-standard origin question."
    accepted_answers: [{value: [اهل, کجا, هستید], status: correct}]
    feedback: "اهل کجا هستید؟ is the formal-standard order."
  fa.a1.unit02.lesson05.exercise05.reply_origin:
    instruction: "Reply that you are from Iran or that you are Iranian."
    accepted_answers:
      - {value: "من اهل ایران هستم", status: correct}
      - {value: "اهل ایران هستم", status: correct}
      - {value: "من اهل ایرانم", status: correct}
      - {value: "اهل ایرانم", status: correct}
      - {value: "ایرانی‌ام", status: correct}
      - {value: "من ایرانی هستم", status: correct}
    feedback: "Both a place-of-origin answer and a nationality answer are suitable here."
  fa.a1.unit02.lesson05.exercise06.listen_origin:
    instruction: "Order the words you hear."
    accepted_answers:
      - {value: [من, اهل, ایران, هستم], status: correct}
    feedback: "The audio says من اهل ایران هستم."
  fa.a1.unit02.lesson05.exercise07.short_answer:
    instruction: "Translate into Persian: I'm Iranian."
    accepted_answers:
      - {value: "ایرانی‌ام", status: correct}
      - {value: "ایرانی ام", status: acceptable_with_note, note: "Accepted keyboard variant; standard spelling uses a ZWNJ."}
      - {value: "من ایرانی هستم", status: correct}
      - {value: "ایرانی هستم", status: correct}
      - {value: "من ایرانی‌ام", status: correct}
      - {value: "من ایرانی ام", status: acceptable_with_note, note: "Accepted keyboard variant; standard spelling uses a ZWNJ."}
    feedback: "ایرانی‌ام is the compact answer."
  fa.a1.unit02.lesson05.exercise08.register_check:
    instruction: "Match each origin question to its register."
    accepted_answers:
      - value:
          "اهل کجا هستید؟": formal_standard
          "اهل کجا هستین؟": neutral_polite_spoken
          "اهل کجایی؟": informal_singular
        status: correct
    feedback: "The three questions differ in register, not basic meaning."

  fa.a1.unit02.lesson06.exercise01.listen_place:
    instruction: "Listen and select where Sara has arrived."
    correct_option: "a Farsi class"
    distractors: ["a French class", "a shop", "Mina's home"]
    accepted_answers: [{value: "a Farsi class", status: correct}]
