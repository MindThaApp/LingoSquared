course:
  title: Farsi B2
  description: Speculate about causes and consequences with graded certainty.
units:
  fa.b2.unit02.speculation:
    title: Speculation
    description: Speculate about causes and consequences with graded certainty.
lessons:
  fa.b2.unit02.speculation.lesson01.certainty_scale:
    title: Degrees of certainty
  fa.b2.unit02.speculation.lesson02.deduction:
    title: Deduction from evidence
  fa.b2.unit02.speculation.lesson03.consequence:
    title: Possible consequences
teaching:
  fa.b2.unit02.speculation.lesson01.certainty_scale.teach.card01:
    title: perhaps
    gloss: perhaps
    note: 'Placed at the start. When real doubt is expressed it takes the subjunctive, as in *شاید خراب شده باشد*.'
    example_gloss: Perhaps the pump has broken because of wear.
  fa.b2.unit02.speculation.lesson01.certainty_scale.teach.card02:
    title: probably
    gloss: probably
    note: 'Adverb ending in Arabic *-اً*, often written without the marks and pronounced *احتمالن* in speech. It is weaker than *حتما*, and the verb after it is normally indicative.'
    example_gloss: The building manager probably knows.
  fa.b2.unit02.speculation.lesson01.certainty_scale.teach.card03:
    title: most likely
    gloss: most likely
    note: 'Means "with high probability". It is more formal and a bit stronger than *شاید*, and it works as a fixed phrase.'
    example_gloss: Most likely, the problem started on the lower floor.
  fa.b2.unit02.speculation.lesson01.certainty_scale.teach.card04:
    title: surely / definitely
    gloss: surely / definitely
    note: 'Certainty adverb, "surely". In requests it means "be sure to", for example *حتما بیایید*.'
    example_gloss: Surely there is a technical reason.
  fa.b2.unit02.speculation.lesson01.certainty_scale.teach.card05:
    title: cause
    gloss: cause
    note: 'Formal "cause". *دلیل* is the everyday word for both reason and cause. What it explains attaches with ezafe, as in *علتِ بو*.'
    example_gloss: The cause of the smell is still not clear.
  fa.b2.unit02.speculation.lesson01.certainty_scale.teach.card06:
    title: sign
    gloss: sign
    note: '"Sign" or "symptom", an indicator of something else. What it points to attaches by ezafe: *نشانه‌ی خرابی*.'
    example_gloss: This sound is a sign of pump failure.
  fa.b2.unit02.speculation.lesson01.certainty_scale.teach.card07:
    title: I think / I guess
    gloss: I think / I guess
    note: 'A spoken-style hedge, short for *فکر می‌کنم*, with the verb in the subjunctive. In careful writing use *به نظر می‌رسد* or *فکر می‌کنم*.'
    example_gloss: I think the water pressure has decreased.
  fa.b2.unit02.speculation.lesson01.certainty_scale.teach.card08:
    title: pressure
    gloss: pressure
    note: '"Pressure". Water pressure is *فشار آب* with ezafe, blood pressure is *فشار خون*, and *فشار آوردن* means "to put pressure".'
    example_gloss: The water pressure drops in the mornings.
  fa.b2.unit02.speculation.lesson01.certainty_scale.teach.card09:
    title: I am not sure
    gloss: I am not sure
    note: 'The negative is *نیستم*, not *نمی‌هستم*. The clause that follows usually takes the subjunctive.'
    example_gloss: I am not sure the repair will finish today.
  fa.b2.unit02.speculation.lesson01.certainty_scale.teach.grammar:
    title: Speculation grammar
    gloss: Speculation grammar
    note: '*شاید*, *احتمالا*, and *حتما* mark increasing certainty. English speakers should not translate "must" mechanically; *حتما* or *باید* depends on evidence and register.'
  fa.b2.unit02.speculation.lesson02.deduction.teach.card01:
    title: must have broken
    gloss: must have broken
    note: '*باید* + a perfect subjunctive expresses a deduction about the past, "must have". It is not an obligation here.'
    example_gloss: This elevator must have broken.
  fa.b2.unit02.speculation.lesson02.deduction.teach.card02:
    title: cannot be accidental
    gloss: cannot be accidental
    note: 'A negative deduction: "cannot be". *تصادفی* means "accidental", while *تصادف* alone is "accident" or "crash".'
    example_gloss: These outages cannot be accidental.
  fa.b2.unit02.speculation.lesson02.deduction.teach.card03:
    title: evidence
    gloss: evidence
    note: 'An Arabic plural used as "evidence" in formal contexts. In speech *مدرک* is common.'
    example_gloss: The evidence is visible on the wall.
  fa.b2.unit02.speculation.lesson02.deduction.teach.card04:
    title: leak
    gloss: leak
    note: '"Leak", from *نشت*. A pipe "leaks" with *نشتی داشتن*, using *داشتن*.'
    example_gloss: Even a small leak can be dangerous.
  fa.b2.unit02.speculation.lesson02.deduction.teach.card05:
    title: because so much / since
    gloss: because so much / since
    note: 'Gives a cause so extreme that it produces the result: "so much that". Stronger than plain *چون*, and the result clause follows.'
    example_gloss: Because the pressure was so high, the pipe was damaged.
  fa.b2.unit02.speculation.lesson02.deduction.teach.card06:
    title: pipe
    gloss: pipe
    note: '"Pipe" or "tube". Plural *لوله‌ها*; as a definite object it takes *را*, as in *لوله را عوض کردند*.'
    example_gloss: The old pipe must be replaced.
  fa.b2.unit02.speculation.lesson02.deduction.teach.card07:
    title: it is unlikely
    gloss: it is unlikely
    note: '*بعید* literally means "far". It takes the subjunctive: *بعید است که … باشد*. Spoken: *بعیده*.'
    example_gloss: It is unlikely that the problem is from the faucet.
  fa.b2.unit02.speculation.lesson02.deduction.teach.card08:
    title: technical
    gloss: technical
    note: '"Technical". The adjective follows its noun with ezafe: *متخصص فنی*.'
    example_gloss: A technical specialist should come.
  fa.b2.unit02.speculation.lesson02.deduction.teach.card09:
    title: from the sound
    gloss: from the sound
    note: '*از روی* + noun means "judging by" or "based on". It is common for inferences from something seen or heard.'
    example_gloss: One can guess from the sound.
  fa.b2.unit02.speculation.lesson02.deduction.teach.grammar:
    title: Speculation grammar
    gloss: Speculation grammar
    note: '*باید* here means logical deduction, not obligation. In Persian the evidence phrase often follows with *چون* or *از بس که*.'
  fa.b2.unit02.speculation.lesson03.consequence.teach.card01:
    title: may / might
    gloss: may / might
    note: '"It is possible that", followed by the subjunctive. *است* stays the same for every subject. Spoken: *ممکنه*.'
    example_gloss: The water pressure may be low tonight.
  fa.b2.unit02.speculation.lesson03.consequence.teach.card02:
    title: consequence
    gloss: consequence
    note: 'A formal, written word for "consequence", often plural, *پیامدها*. *نتیجه* is more general ("result").'
    example_gloss: The consequence of delay is clear for everyone.
  fa.b2.unit02.speculation.lesson03.consequence.teach.card03:
    title: repair
    gloss: repair
    note: '"Repair". The compound verb *تعمیر کردن* means "to repair", and *تعمیر شدن* means "to get repaired". The object attaches by ezafe: *تعمیر پمپ*.'
    example_gloss: The pump repair takes two hours.
  fa.b2.unit02.speculation.lesson03.consequence.teach.card04:
    title: be off (cut off)
    gloss: be off (cut off)
    note: '*قطع باشد* describes a state ("be off"), while *قطع شود* names the event of being cut off. Choose *باشد* for how things currently stand.'
    example_gloss: If the main valve is closed, the water is off.
  fa.b2.unit02.speculation.lesson03.consequence.teach.card05:
    title: neighbors
    gloss: neighbors
    note: '"Neighbors". Plural *ـها* attaches with a ZWNJ and is the usual spoken plural for people; the formal plural is *همسایگان*.'
    example_gloss: The neighbors are unhappy about the noise.
  fa.b2.unit02.speculation.lesson03.consequence.teach.card06:
    title: if the repair is late
    gloss: if the repair is late
    note: '*اگر* + the subjunctive *شود* makes a conditional about something that may happen. *دیر شدن* ("to be late") is a compound with *شدن*.'
    example_gloss: If the repair is late, the schedule changes.
  fa.b2.unit02.speculation.lesson03.consequence.teach.card07:
    title: possibility / chance
    gloss: possibility / chance
    note: '"Probability" or "chance". *احتمال دارد* means "it is possible" and takes the subjunctive; *احتمال کم* and *احتمال زیاد* give low and high.'
    example_gloss: The chance of a power outage is low.
  fa.b2.unit02.speculation.lesson03.consequence.teach.card08:
    title: we had better be prepared
    gloss: we had better be prepared
    note: '*بهتر است* + subjunctive gives soft advice, like "we had better". Spoken: *بهتره*.'
    example_gloss: We had better be prepared; the water may be cut off.
  fa.b2.unit02.speculation.lesson03.consequence.teach.card09:
    title: temporary
    gloss: temporary
    note: '"Temporary"; the opposite is *دائمی*. It follows its noun like any adjective.'
    example_gloss: This problem is temporary.
  fa.b2.unit02.speculation.lesson03.consequence.teach.grammar:
    title: Speculation grammar
    gloss: Speculation grammar
    note: '*ممکن است* introduces a possible result. Keep the condition with *اگر* clear; Persian does not require English-style "will" in the result clause.'
