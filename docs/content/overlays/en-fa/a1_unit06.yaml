course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: food and drink vocabulary, ordering politely at a
    restaurant, asking about the menu and recommendations, quantities, and
    restaurant etiquette including asking for the bill.

units:
  fa.a1.unit06.food:
    title: Food and ordering a meal

lessons:
  fa.a1.unit06.lesson01.food_and_drink_vocabulary: {title: "Food and drink"}
  fa.a1.unit06.lesson02.polite_ordering_register: {title: "Order politely"}
  fa.a1.unit06.lesson03.menu_and_recommendation: {title: "Ask about the menu and get a recommendation"}
  fa.a1.unit06.lesson04.quantities: {title: "Order specific quantities"}
  fa.a1.unit06.lesson05.restaurant_etiquette: {title: "Restaurant etiquette and the bill"}
  fa.a1.unit06.lesson06.restaurant_dialogue: {title: "A full restaurant conversation"}

teaching:
  fa.a1.unit06.lesson01.teach.naan:
    title: "Bread"
    gloss: "bread"
    note: "نان is a staple of every Iranian meal, often flat bread served with almost anything."
    example_gloss: "I like bread."
  fa.a1.unit06.lesson01.teach.berenj:
    title: "Rice"
    gloss: "rice"
    note: "برنج is a central part of most Iranian main dishes."
    example_gloss: "Rice with chicken is delicious."
  fa.a1.unit06.lesson01.teach.morgh:
    title: "Chicken"
    gloss: "chicken"
    note: "مرغ means both the bird and the meat."
    example_gloss: "I eat chicken."
  fa.a1.unit06.lesson01.teach.ab:
    title: "Water"
    gloss: "water"
    note: "آب is the ordinary word for water."
    example_gloss: "I want water."
  fa.a1.unit06.lesson01.teach.chai:
    title: "Tea"
    gloss: "tea"
    note: "چای is the default drink offered almost anywhere in Iran, already seen in unit01's taarof lesson."
    example_gloss: "One tea, please."
  fa.a1.unit06.lesson01.teach.ghahve:
    title: "Coffee"
    gloss: "coffee"
    note: "قهوه is increasingly common in Iranian cities alongside tea."
    example_gloss: "The coffee is hot."
  fa.a1.unit06.lesson01.teach.mive:
    title: "Fruit"
    gloss: "fruit"
    note: "میوه is a general word covering any fruit."
    example_gloss: "I like fruit."
  fa.a1.unit06.lesson01.teach.va_ya:
    title: "And / or"
    gloss: "و (and), یا (or)"
    note: "Both are common connecting words used to join foods and drinks in an order."

  fa.a1.unit06.lesson02.teach.mikhastam_chai:
    title: "Politely order tea"
    gloss: "I'd like a tea."
    note: "می‌خواستم is literally a past-tense form of 'to want,' but functions as a polite, slightly softened request -- the natural register for a waiter or shopkeeper you don't know."
  fa.a1.unit06.lesson02.teach.lotfan:
    title: "Please"
    gloss: "please"
    note: "لطفاً can be added to soften almost any request."
    example_gloss: "Please help me."
  fa.a1.unit06.lesson02.teach.mikham_informal:
    title: "Order tea informally"
    gloss: "I want a tea."
    note: "یه چای می‌خوام uses the informal colloquial یه (a/one) and می‌خوام (I want) -- reserve this for a close friend or family member, not a waiter you've just met."
  fa.a1.unit06.lesson02.teach.register_note:
    title: "Choosing the right ordering verb"
    gloss: "Use می‌خواستم with a stranger or waiter; use می‌خوام only with a close friend."
    note: "This is the ordering-specific version of the register split already established for greetings in unit01."
  fa.a1.unit06.lesson02.teach.mikhastam_naan:
    title: "Politely order bread"
    gloss: "I'd like a bread."
    note: "The same می‌خواستم pattern applies to any food or drink noun."

  fa.a1.unit06.lesson03.teach.menu_word:
    title: "Menu"
    gloss: "menu"
    note: "منو is a loanword, used the same way as in English."
    example_gloss: "I want the menu."
  fa.a1.unit06.lesson03.teach.menu_question:
    title: "Ask for a menu"
    gloss: "Do you have a menu?"
    note: "منو دارید؟ literally asks 'do you have a menu,' the ordinary way to request one."
  fa.a1.unit06.lesson03.teach.recommend_question:
    title: "Ask for a recommendation"
    gloss: "What do you recommend?"
    note: "چی توصیه می‌کنید؟ is a natural, common question to a waiter."
  fa.a1.unit06.lesson03.teach.waiter_question:
    title: "What the waiter asks you"
    gloss: "What would you like?"
    note: "چی میل دارید؟ is a polite, standard way a waiter opens the ordering exchange."
  fa.a1.unit06.lesson03.teach.jooje_kabab:
    title: "Chicken kebab"
    gloss: "chicken kebab"
    note: "جوجه‌کباب (marinated grilled chicken) is one of the most common dishes on an Iranian menu."
    example_gloss: "I'll order chicken kabab."
  fa.a1.unit06.lesson03.teach.khoobe:
    title: "The waiter recommends the dish"
    gloss: "The chicken kebab is very good today."
    note: "خوبه is the informal spoken contraction of خوب است, natural in a waiter's casual recommendation."
  fa.a1.unit06.lesson03.teach.bale_befarmaeed:
    title: "Yes, here you are"
    gloss: "Yes, here you are."
    note: "بله means yes; بفرمایید (already seen in unit01's taarof lesson) is used again here while handing something, such as a menu, to someone."

  fa.a1.unit06.lesson04.teach.yek_livan:
    title: "A glass of tea"
    gloss: "a glass of tea"
    note: "لیوان (glass) is the counting word used for drinks served in a glass."
  fa.a1.unit06.lesson04.teach.do_ta_naan:
    title: "Two breads"
    gloss: "two breads"
    note: "تا is a counter word placed after a number when counting most ordinary countable items, here two pieces of bread."
  fa.a1.unit06.lesson04.teach.yek_boshghab:
    title: "A plate of rice"
    gloss: "a plate of rice"
    note: "بشقاب (plate) is the counting word for food served on a plate."
  fa.a1.unit06.lesson04.teach.combined_order:
    title: "Combine a full order"
    gloss: "A plate of rice and two breads, please."
    note: "Multiple quantity phrases can be joined with و (and) in a single order."
  fa.a1.unit06.lesson04.teach.se_ta:
    title: "The counter تا"
    gloss: "تا attaches after a number for countable items: دو تا (two), سه تا (three)."
    note: "This is the same general counting pattern taught with numbers in unit03, applied here to ordering food."

  fa.a1.unit06.lesson05.teach.hesab_word:
    title: "The bill"
    gloss: "the bill / check"
    note: "صورت‌حساب is the standard word for a restaurant bill."
    example_gloss: "The bill, please."
  fa.a1.unit06.lesson05.teach.bill_request:
    title: "Ask for the bill"
    gloss: "Could you bring the bill, please?"
    note: "صورت‌حساب رو لطف می‌کنید؟ is a polite, natural way to ask for the check in a restaurant."
  fa.a1.unit06.lesson05.teach.khoshmaze:
    title: "Say the food was delicious"
    gloss: "It was very delicious."
    note: "خیلی خوشمزه بود is a natural compliment to say to a waiter or host after a meal."
  fa.a1.unit06.lesson05.teach.nooshe_jan:
    title: "Bon appetit"
    gloss: "Enjoy your meal / bon appetit"
    note: "نوش جان is said to someone who is eating or about to eat, roughly equivalent to bon appétit; it is not said by the person eating about their own food."
  fa.a1.unit06.lesson05.teach.chashm:
    title: "A waiter's polite acknowledgment"
    gloss: "Right away."
    note: "چشم، الان میارم is a respectful way staff acknowledge a request and say they'll bring it immediately."

  fa.a1.unit06.lesson06.teach.restaurant_word:
    title: "Restaurant"
    gloss: "restaurant"
    note: "رستوران is the ordinary word for restaurant, the setting for this unit's dialogue."
    example_gloss: "This restaurant is good."
  fa.a1.unit06.lesson06.teach.turn01:
    title: "The waiter greets the customer"
    gloss: "The waiter welcomes the customer and asks what they'd like."
    note: "چی میل دارید؟ is the same polite opening question from lesson03."
  fa.a1.unit06.lesson06.teach.turn02:
    title: "The customer asks for a menu"
    gloss: "The customer greets the waiter and asks for a menu."
    note: "منو دارید؟ opens the ordering exchange."
  fa.a1.unit06.lesson06.teach.turn03:
    title: "The waiter provides the menu"
    gloss: "The waiter confirms and hands over the menu."
    note: "بفرمایید is the same polite offering word from unit01, here used while handing something to someone."
  fa.a1.unit06.lesson06.teach.turn04:
    title: "The customer asks for a recommendation"
    gloss: "The customer asks what the waiter recommends."
    note: "چی توصیه می‌کنید؟ from lesson03."
  fa.a1.unit06.lesson06.teach.turn05:
    title: "The waiter recommends a dish"
    gloss: "The waiter says the chicken kebab is very good today."
    note: "جوجه‌کباب امروز خیلی خوبه uses the informal خوبه natural in spoken recommendations."
  fa.a1.unit06.lesson06.teach.turn06:
    title: "The customer places a full order"
    gloss: "The customer agrees and orders chicken kebab with rice, plus a tea."
    note: "می‌خواستم is used here, appropriate for a waiter the customer doesn't know personally."
  fa.a1.unit06.lesson06.teach.turn07:
    title: "The waiter acknowledges the order"
    gloss: "The waiter says they'll bring it right away."
    note: "چشم، الان میارم from lesson05."
  fa.a1.unit06.lesson06.teach.turn08:
    title: "The customer compliments the food and asks for the bill"
    gloss: "The customer says it was delicious and asks for the bill."
    note: "Both phrases directly reuse lesson05's vocabulary."
  fa.a1.unit06.lesson06.teach.turn09:
    title: "The waiter brings the bill"
    gloss: "The waiter agrees and says they'll bring it right away."
    note: "البته (of course) is a natural polite affirmative here."

exercises:
  fa.a1.unit06.lesson01.exercise01.recognize_naan:
    instruction: "Which word means bread?"
    correct_option: نان
    distractors: [برنج, مرغ, میوه]
    accepted_answers: [{value: نان, status: correct}]
    feedback: "نان means bread."
  fa.a1.unit06.lesson01.exercise02.recognize_drinks:
    instruction: "Which of these is a drink, not a food?"
    correct_option: چای
    distractors: [نان, برنج, مرغ]
    accepted_answers: [{value: چای, status: correct}]
    feedback: "چای (tea) is a drink; the others are foods."
  fa.a1.unit06.lesson01.exercise03.recognize_naan_reading:
    instruction: "What does this word mean?"
    correct_option: bread
    distractors: [coffee, tea, water]
    accepted_answers: [{value: bread, status: correct}]
    feedback: "نان means bread."
  fa.a1.unit06.lesson01.exercise04.match_food_words:
    instruction: "Match each word with its English meaning."
    accepted_answers:
      - {value: {نان: bread, برنج: rice, مرغ: chicken, آب: water, چای: tea, قهوه: coffee, میوه: fruit}, status: correct}
    feedback: "These seven words cover the basic food and drink vocabulary for this unit."
  fa.a1.unit06.lesson01.exercise05.order_food_word:
    instruction: "Arrange the words to say bread and rice and chicken."
    accepted_answers: [{value: [نان, و, برنج, و, مرغ], status: correct}]
    feedback: "نان و برنج و مرغ lists three foods joined with و."
  fa.a1.unit06.lesson01.exercise06.translate_fruit:
    instruction: "Translate into Farsi: fruit."
    accepted_answers:
      - {value: میوه, status: correct}
    feedback: "میوه means fruit."
  fa.a1.unit06.lesson01.exercise07.write_own_drink:
    instruction: "Write the Farsi word for a drink you like: tea or coffee."
    accepted_answers:
      - {value: چای, status: correct}
      - {value: قهوه, status: correct}
    feedback: "Both چای and قهوه are accepted."

  fa.a1.unit06.lesson02.exercise01.recognize_polite_order:
    instruction: "Which phrase politely orders tea from a waiter?"
    correct_option: "یک چای می‌خواستم"
    distractors: ["یه چای می‌خوام", "چای دارید؟", "چای خوبه"]
    accepted_answers: [{value: "یک چای می‌خواستم", status: correct}]
    feedback: "می‌خواستم is the polite ordering form for someone you don't know well."
  fa.a1.unit06.lesson02.exercise02.recognize_informal_order:
    instruction: "یه چای می‌خوام is appropriate to say to..."
    correct_option: "a close friend making tea at home"
    distractors: ["a waiter you've just met", "a shopkeeper you don't know", "an elder at a formal dinner"]
    accepted_answers: [{value: "a close friend making tea at home", status: correct}]
    feedback: "می‌خوام is informal and colloquial, reserved for close, familiar contexts."
  fa.a1.unit06.lesson02.exercise03.recognize_polite_order_reading:
    instruction: "What does this phrase mean?"
    correct_option: "I would like a tea, please. (polite)"
    distractors: ["I want a tea. (informal)", "Do you have a menu?", "What do you recommend?"]
    accepted_answers: [{value: "I would like a tea, please. (polite)", status: correct}]
    feedback: "یک چای می‌خواستم، لطفاً means I would like a tea, please (polite)."
  fa.a1.unit06.lesson02.exercise04.match_register:
    instruction: "Match each ordering verb with when to use it."
    accepted_answers:
      - {value: {می‌خواستم: "I'd like (polite, waiter or stranger)", می‌خوام: "I want (informal, close friend)"}, status: correct}
    feedback: "The two forms differ only in register, not in what they order."
  fa.a1.unit06.lesson02.exercise05.order_polite_naan:
    instruction: "Arrange the words to politely order bread."
    accepted_answers: [{value: [یک, نان, می‌خواستم], status: correct}]
    feedback: "یک نان می‌خواستم politely orders bread."
  fa.a1.unit06.lesson02.exercise06.translate_informal_order:
    instruction: "Translate into Farsi: I want a tea. (informal)"
    accepted_answers:
      - {value: "یه چای می‌خوام", status: correct}
    feedback: "یه چای می‌خوام means I want a tea (informal)."
  fa.a1.unit06.lesson02.exercise07.translate_polite_water:
    instruction: "Translate into Farsi: I'd like a water, please."
    accepted_answers:
      - {value: "یک آب می‌خواستم لطفاً", status: correct}
      - {value: "یک آب می‌خواستم، لطفاً", status: correct}
    feedback: "یک آب می‌خواستم لطفاً politely orders water."
  fa.a1.unit06.lesson02.exercise08.speak_order:
    instruction: "You are ordering from a waiter you've never met. Politely ask for a coffee."
    accepted_answers:
      - {value: "یک قهوه می‌خواستم لطفاً", status: correct}
      - {value: "یک قهوه می‌خواستم", status: correct}
    feedback: "می‌خواستم is the correct register for a waiter you don't know."

  fa.a1.unit06.lesson03.exercise01.recognize_menu_question:
    instruction: "Which phrase asks whether there's a menu?"
    correct_option: "منو دارید؟"
    distractors: ["چی توصیه می‌کنید؟", "چی میل دارید؟", "صورت‌حساب رو لطف می‌کنید؟"]
    accepted_answers: [{value: "منو دارید؟", status: correct}]
    feedback: "منو دارید؟ literally asks 'do you have a menu.'"
  fa.a1.unit06.lesson03.exercise02.recognize_recommend_question:
    instruction: "Which phrase asks for a recommendation?"
    correct_option: "چی توصیه می‌کنید؟"
    distractors: ["منو دارید؟", "چی میل دارید؟", "خیلی خوشمزه بود"]
    accepted_answers: [{value: "چی توصیه می‌کنید؟", status: correct}]
    feedback: "چی توصیه می‌کنید؟ asks what the waiter suggests."
  fa.a1.unit06.lesson03.exercise03.recognize_menu_question_reading:
    instruction: "What does this question ask?"
    correct_option: "Do you have a menu?"
    distractors: ["What do you recommend?", "Could you bring the bill?", "What would you like?"]
    accepted_answers: [{value: "Do you have a menu?", status: correct}]
    feedback: "منو دارید؟ asks do you have a menu."
  fa.a1.unit06.lesson03.exercise04.match_restaurant_questions:
    instruction: "Match each restaurant question or phrase with its meaning."
    accepted_answers:
      - {value: {"منو دارید؟": "Do you have a menu?", "چی توصیه می‌کنید؟": "What do you recommend?", "چی میل دارید؟": "What would you like? (waiter asking)", "جوجه‌کباب امروز خیلی خوبه": "The kabob is really good today", "بله، بفرمایید": "Yes, here you are"}, status: correct}
    feedback: "These cover asking for a menu, a recommendation, the waiter's opening question, the waiter's suggestion, and an affirmative reply."
  fa.a1.unit06.lesson03.exercise05.order_recommend_question:
    instruction: "Arrange the words to ask what the waiter recommends."
    accepted_answers: [{value: [چی, توصیه, می‌کنید], status: correct}]
    feedback: "چی توصیه می‌کنید؟ asks for a recommendation."
  fa.a1.unit06.lesson03.exercise06.translate_recommendation:
    instruction: "Translate into Farsi: What do you recommend?"
    accepted_answers:
      - {value: "چی توصیه می‌کنید؟", status: correct}
      - {value: "چی توصیه می‌کنید", status: correct}
    feedback: "چی توصیه می‌کنید؟ means what do you recommend?"
  fa.a1.unit06.lesson03.exercise07.dialogue_response_waiter:
    instruction: "A waiter asks چی میل دارید؟ You'd first like to see the menu. Respond appropriately."
    accepted_answers:
      - {value: "منو دارید؟", status: correct}
    feedback: "منو دارید؟ appropriately asks to see the menu first."
  fa.a1.unit06.lesson03.exercise08.write_recommend_question:
    instruction: "Write the question you'd ask a waiter to get a recommendation."
    accepted_answers:
      - {value: "چی توصیه می‌کنید؟", status: correct}
      - {value: "چی توصیه می‌کنید", status: correct}
    feedback: "چی توصیه می‌کنید؟ correctly asks for a recommendation."

  fa.a1.unit06.lesson04.exercise01.recognize_glass_of_tea:
    instruction: "Which phrase means a glass of tea?"
    correct_option: "یک لیوان چای"
    distractors: ["دو تا نان", "یک بشقاب برنج", "یک چای می‌خواستم"]
    accepted_answers: [{value: "یک لیوان چای", status: correct}]
    feedback: "لیوان (glass) is the counting word for tea served in a glass."
  fa.a1.unit06.lesson04.exercise02.recognize_two_breads:
    instruction: "Which phrase means two breads?"
    correct_option: "دو تا نان"
    distractors: ["یک لیوان چای", "یک بشقاب برنج", "سه تا نان"]
    accepted_answers: [{value: "دو تا نان", status: correct}]
    feedback: "دو تا نان uses the counter تا after the number two."
  fa.a1.unit06.lesson04.exercise03.recognize_quantity_order_reading:
    instruction: "What does this order mean?"
    correct_option: "a plate of rice and two breads"
    distractors: ["a glass of tea", "two breads", "a plate of rice"]
    accepted_answers: [{value: "a plate of rice and two breads", status: correct}]
    feedback: "یک بشقاب برنج و دو تا نان means a plate of rice and two breads."
  fa.a1.unit06.lesson04.exercise04.match_quantities:
    instruction: "Match each quantity phrase with its meaning."
    accepted_answers:
      - {value: {"یک لیوان چای": "a glass of tea", "دو تا نان": "two breads", "یک بشقاب برنج": "a plate of rice", "یک لیوان آب": "a glass of water", "سه تا نان": "three breads", "دو تا مرغ": "two chickens"}, status: correct}
    feedback: "لیوان and بشقاب are counting words tied to how the item is served; تا is the general counter for pieces."
  fa.a1.unit06.lesson04.exercise05.order_combined_order:
    instruction: "Arrange the words for a plate of rice and two breads, please."
    accepted_answers: [{value: [یک, بشقاب, برنج, و, دو, تا, نان, لطفاً], status: correct}]
    feedback: "یک بشقاب برنج و دو تا نان لطفاً combines two quantities in one order."
  fa.a1.unit06.lesson04.exercise06.translate_three_breads:
    instruction: "Translate into Farsi: three breads."
    accepted_answers:
      - {value: "سه تا نان", status: correct}
    feedback: "سه تا نان means three breads."
