      - {value: "من ماشین دارم", status: correct}
      - {value: "یه ماشین دارم", status: correct}
      - {value: "من یه ماشین دارم", status: correct}
    feedback: "*ماشین دارم* means I have a car."

  fa.b1.unit02.lesson02.exercise01.recognize_mitune:
    instruction: "What does this word mean?"
    correct_option: "he/she can"
    distractors: ["they can", "we can", "he/she went"]
    accepted_answers: [{value: "he/she can", status: correct}]
    feedback: "*می‌تونه* means he/she can."
  fa.b1.unit02.lesson02.exercise02.recognize_mitunan:
    instruction: "What does this word mean?"
    correct_option: "they can"
    distractors: ["you (pl.) can", "we can", "they went"]
    accepted_answers: [{value: "they can", status: correct}]
    feedback: "*می‌تونن* means they can."
  fa.b1.unit02.lesson02.exercise03.order_baradaram_mitune_ranandegi_kone:
    instruction: "Put the words in order: My brother can drive."
    accepted_answers:
      - {value: "برادرم می‌تونه رانندگی کنه", status: correct}
