course:
  title: Farsi B1
  description: >-
    Intermediate Iranian Farsi: expressing present and past ability using
    توانستن (to be able) plus an embedded subjunctive verb that
    independently agrees with the subject, across a car-repair and
    driver's-license errand scenario.

units:
  fa.b1.unit02.abilities:
    title: "Ability: I can / I could"
    description: Express what you can, could, or couldn't do, in present and past tense, using a modal that itself conjugates for person and tense.

lessons:
  fa.b1.unit02.lesson01.present_ability_1st2nd:
    title: "I can drive"
  fa.b1.unit02.lesson02.present_ability_all_persons:
    title: "All the persons"
  fa.b1.unit02.lesson03.past_ability_and_negation:
    title: "I could / I couldn't"
  fa.b1.unit02.lesson04.dialogue_workshop:
    title: "At the Workshop"
  fa.b1.unit02.lesson05.reading_before_and_now:
    title: "Before and Now"
  fa.b1.unit02.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  fa.b1.unit02.lesson01.teach.mitunam:
    title: I can
    gloss: I can
    note: "*می‌تونم* is the colloquial contraction of the literary *می‌توانم* -- unlike *باید* (Unit 1), which never changes for person, *می‌تونم* itself fully conjugates: *می‌تونم* (I), *می‌تونی* (you), *می‌تونه* (he/she)..."
    example_gloss: "I can drive."
  fa.b1.unit02.lesson01.teach.mituni:
    title: "you can (informal)"
    gloss: "you can (informal)"
    example_gloss: "Can you drive?"
  fa.b1.unit02.lesson01.teach.ranandegi_konam:
    title: "(that I) drive"
    gloss: "(that I) drive"
    note: "*رانندگی کنم* is the subjunctive complement after *می‌تونم* -- the embedded clause the modal governs. Note that BOTH words carry 'I' here: *می‌تونم* and *کنم* -- English only marks it once, if at all ('I can drive,' not 'I can driveI')."
    example_gloss: "I can drive."
  fa.b1.unit02.lesson01.teach.ranandegi_koni:
    title: "(that) you drive"
    gloss: "(that) you drive"
    example_gloss: "Can you drive?"
  fa.b1.unit02.lesson01.teach.mashin:
    title: car
    gloss: car
    example_gloss: "I have a car."
  fa.b1.unit02.lesson01.teach.daram:
    title: I have
    gloss: I have
    example_gloss: "I have a car."
  fa.b1.unit02.lesson01.teach.grammar_mitunam_conjugates:
    title: "I can drive. Can you drive?"
    gloss: "I can drive. Can you drive?"
    note: "Unlike *باید* (Unit 1), which is invariant, *می‌تونم* conjugates for person just like an ordinary verb: *می‌تونم* (I can), *می‌تونی* (you can). AND the embedded verb after it (*رانندگی کنم/کنی*) also agrees with the subject independently -- a double-agreement pattern with no direct English equivalent, since English 'can' barely conjugates and the verb after it ('drive') never does."
    example_gloss: null

  fa.b1.unit02.lesson02.teach.mitune_ranandegi_kone:
    title: "he/she can drive"
    gloss: "he/she can drive"
    example_gloss: "My brother can drive."
  fa.b1.unit02.lesson02.teach.mitunim_ranandegi_konim:
    title: "we can drive"
    gloss: "we can drive"
    example_gloss: "We can drive."
  fa.b1.unit02.lesson02.teach.mitunid_ranandegi_konid:
    title: "you (pl.) can drive"
    gloss: "you (pl.) can drive"
    example_gloss: "Can you (pl.) drive?"
  fa.b1.unit02.lesson02.teach.mitunan_ranandegi_konan:
    title: "they can drive"
    gloss: "they can drive"
    example_gloss: "They can drive."
  fa.b1.unit02.lesson02.teach.baradaram:
    title: "my brother"
    gloss: "my brother"
    example_gloss: "My brother can drive."
  fa.b1.unit02.lesson02.teach.una:
    title: they
    gloss: they
    example_gloss: "They can drive."
  fa.b1.unit02.lesson02.teach.grammar_full_paradigm:
    title: "I can drive, you can drive, he/she can drive, we can drive, you (pl.) can drive, they can drive."
    gloss: "I can drive, you can drive, he/she can drive, we can drive, you (pl.) can drive, they can drive."
    note: "Both halves of the construction agree with the subject in every person: *می‌تونم/کنم* (I), *می‌تونی/کنی* (you), *می‌تونه/کنه* (he/she), *می‌تونیم/کنیم* (we), *می‌تونید/کنید* (you pl.), *می‌تونن/کنن* (they). Compare with Unit 1's *باید*, which stayed fixed while only the complement verb changed -- here BOTH words change together."
    example_gloss: null

  fa.b1.unit02.lesson03.teach.mitunestam:
    title: "I could / was able to"
    gloss: "I could / was able to"
    note: "The past form of *می‌تونم*: 'could' or 'was able to'. For one completed success, speakers often drop the *می‌* and say *تونستم* (*امسال تونستم گواهینامه بگیرم*, 'this year I managed to get a license'); both are accepted in the exercises."
    example_gloss: "This year I was able to get a driver's license."
  fa.b1.unit02.lesson03.teach.nemitunestam:
    title: "I couldn't / wasn't able to"
    gloss: "I couldn't / wasn't able to"
    example_gloss: "Last year I couldn't drive."
  fa.b1.unit02.lesson03.teach.parsal:
    title: "last year"
    gloss: "last year"
    example_gloss: "Last year I couldn't drive."
  fa.b1.unit02.lesson03.teach.emsal:
    title: "this year"
    gloss: "this year"
    example_gloss: "This year I can drive."
  fa.b1.unit02.lesson03.teach.govahiname:
    title: "driver's license"
    gloss: "driver's license"
    example_gloss: "This year I was able to get a driver's license."
  fa.b1.unit02.lesson03.teach.begiram:
    title: "(that I) get"
    gloss: "(that I) get"
    example_gloss: "Can I get a driver's license?"
  fa.b1.unit02.lesson03.teach.emruz:
    title: today
    gloss: today
    example_gloss: "Today I can't drive."
  fa.b1.unit02.lesson03.teach.nemitunam:
    title: "I can't"
    gloss: "I can't"
    example_gloss: "Today I can't drive."
  fa.b1.unit02.lesson03.teach.vali:
    title: but
    gloss: but
    example_gloss: "Last year I couldn't drive, but this year I can."
  fa.b1.unit02.lesson03.teach.grammar_past_present_contrast:
    title: "I can drive. I could drive. I couldn't drive."
    gloss: "I can drive. I could drive. I couldn't drive."
    note: "*توانستن* itself carries the tense (*می‌تونم* present, *می‌تونستم* past), while the embedded verb after it (*رانندگی کنم*) stays in the SAME subjunctive form regardless of tense -- unlike Unit 1's *باید*, where the tense contrast showed up on the complement verb instead (*باید برم* vs *باید می‌رفتم*). Here the tense marking is squarely on the modal, not the complement."
    example_gloss: null

  fa.b1.unit02.lesson04.teach.kharabe:
    title: "is broken"
    gloss: "is broken"
    example_gloss: "My car is broken."
  fa.b1.unit02.lesson04.teach.dorastesh_koni:
    title: "(that) you fix it"
    gloss: "(that) you fix it"
    note: "*درستش* = *درست* (right/fixed) + the clitic *-ش* (it) -- 'fix it,' attaching the object pronoun directly rather than a separate word."
    example_gloss: "Can you fix it?"
  fa.b1.unit02.lesson04.teach.ghete:
    title: "part"
    gloss: "part (mechanical)"
    example_gloss: "I have to buy a part."
  fa.b1.unit02.lesson04.teach.bekharam:
    title: "(that I) buy"
    gloss: "(that I) buy"
    example_gloss: "I have to buy a part."
  fa.b1.unit02.lesson04.teach.ye:
    title: "a / one"
    gloss: "a / one"
    note: "*یه* is the colloquial contraction of *یک* (one), used as an indefinite article."
    example_gloss: "I have to buy a part."
  fa.b1.unit02.lesson04.teach.biam:
    title: "(that I) come"
    gloss: "(that I) come"
    example_gloss: "Can I come tomorrow?"
  fa.b1.unit02.lesson04.teach.farda:
    title: tomorrow
    gloss: tomorrow
    example_gloss: "It's ready tomorrow."
  fa.b1.unit02.lesson04.teach.hazere:
    title: "is ready"
    gloss: "is ready"
    example_gloss: "It's ready tomorrow."
  fa.b1.unit02.lesson04.teach.reza:
    title: "Reza (name)"
    gloss: "Reza"
    example_gloss: "Reza can fix it."
  fa.b1.unit02.lesson04.teach.dialogue_nima_kharabe:
    title: "Nima: Reza, my car is broken. Can you fix it today?"
    gloss: "Nima: Reza, my car is broken. Can you fix it today?"
  fa.b1.unit02.lesson04.teach.dialogue_reza_ghete:
    title: "Reza: Yes, I can, but I have to buy a part."
    gloss: "Reza: Yes, I can, but I have to buy a part."
    note: "New words here: *بله* (yes), *ولی* (but), and *باید* (must -- Unit 1's invariant modal, reintroduced here as a deliberate callback: notice *باید یه قطعه بخرم* keeps *باید* fixed while *بخرم* carries the person, exactly like Unit 1's pattern, right next to *می‌تونم*, which conjugates itself)."
  fa.b1.unit02.lesson04.teach.dialogue_nima_farda:
    title: "Nima: Can I come tomorrow?"
    gloss: "Nima: Can I come tomorrow?"
  fa.b1.unit02.lesson04.teach.dialogue_reza_hazere:
    title: "Reza: Yes, it's ready tomorrow."
    gloss: "Reza: Yes, it's ready tomorrow."

  fa.b1.unit02.lesson05.teach.hala:
    title: now
    gloss: now
    example_gloss: "Now I can drive."
  fa.b1.unit02.lesson05.teach.diruz:
    title: yesterday
    gloss: yesterday
    note: "This card also introduces *شد* (became), the simple past of *شدن* -- 'broke' in the sense of 'became broken,' *خراب شد*."
    example_gloss: "Yesterday my car broke down."
  fa.b1.unit02.lesson05.teach.behtare:
    title: "is better"
    gloss: "is better"
    example_gloss: "This year is better."
  fa.b1.unit02.lesson05.teach.ki:
    title: who
    gloss: who
    example_gloss: "Who can fix it?"
  fa.b1.unit02.lesson05.teach.chera:
    title: why
    gloss: why
    example_gloss: "Why can't I come?"
  fa.b1.unit02.lesson05.teach.reading_passage:
    title: "Reading: Nima's car"
    gloss: "Last year Nima couldn't drive, because he didn't have a driver's license. This year he got a license and now he can drive. Yesterday his car broke down, but Reza is fixing it tomorrow. Nima thinks this year is better."

  fa.b1.unit02.lesson06.teach.grammar_review:
    title: "I can drive, I could drive, I couldn't drive. I have to buy a part."
    gloss: "I can drive, I could drive, I couldn't drive. I have to buy a part."
    note: "Review: present ability = *می‌تونم* (conjugates) + subjunctive complement that ALSO agrees with the subject (*می‌تونم/تونی/تونه/تونیم/تونید/تونن رانندگی کنم/کنی/کنه/کنیم/کنید/کنن*). Past ability = *می‌تونستم* (same double agreement, past tense on the modal only). Compare with Unit 1's *باید*, which never conjugates at all -- *توانستن* is the opposite case, a modal that behaves like a fully ordinary verb."
    example_gloss: null
  fa.b1.unit02.lesson06.teach.emtehan:
    title: "test / exam"
    gloss: "test / exam"
    example_gloss: "I have a test tomorrow."
  fa.b1.unit02.lesson06.teach.va:
    title: and
    gloss: and
    example_gloss: "I have a test and I can come."

exercises:
  fa.b1.unit02.lesson01.exercise01.recognize_mitunam:
    instruction: "What does this word mean?"
    correct_option: "I can"
    distractors: ["I must", "I want", "I have"]
    accepted_answers: [{value: "I can", status: correct}]
    feedback: "*می‌تونم* means I can."
  fa.b1.unit02.lesson01.exercise02.recognize_ranandegi:
    instruction: "What does this word mean?"
    correct_option: driving
    distractors: [walking, working, cooking]
    accepted_answers: [{value: driving, status: correct}]
    feedback: "*رانندگی* means driving."
  fa.b1.unit02.lesson01.exercise03.order_mitunam_ranandegi_konam:
    instruction: "Put the words in order: I can drive."
    accepted_answers:
      - {value: "می‌تونم رانندگی کنم", status: correct}
    feedback: "*می‌تونم رانندگی کنم* means I can drive."
  fa.b1.unit02.lesson01.exercise04.match_ability_words_l1:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {می‌تونم: "I can", می‌تونی: "you can", رانندگی: driving, کنم: "(that I) do", ماشین: car, دارم: "I have"}
        status: correct
    feedback: "These are this lesson's core ability words."
  fa.b1.unit02.lesson01.exercise05.translate_i_can_drive:
    instruction: "Translate into Farsi: I can drive."
    accepted_answers:
      - {value: "می‌تونم رانندگی کنم", status: correct}
      - {value: "من می‌تونم رانندگی کنم", status: correct}
    feedback: "*می‌تونم رانندگی کنم* means I can drive."
  fa.b1.unit02.lesson01.exercise06.speak_can_you_drive:
    instruction: "Say aloud in Farsi: Can you drive?"
    accepted_answers:
      - {value: "می‌تونی رانندگی کنی؟", status: correct}
      - {value: "تو می‌تونی رانندگی کنی؟", status: correct}
    feedback: "*می‌تونی رانندگی کنی؟* means can you drive?"
  fa.b1.unit02.lesson01.exercise07.write_have_car:
    instruction: "Write in Farsi: I have a car."
    accepted_answers:
