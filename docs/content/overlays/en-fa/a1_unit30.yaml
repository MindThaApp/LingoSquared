course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: naming university/study words (university,
    student, lesson/subject, language), talking about what subject you
    study or are learning (math, a major/field of study, English as a
    subject), asking and answering where you study (کجا درس می‌خونی؟) and
    how often you go, a reading passage about نیما's and سارا's studies,
    and a closing dialogue between نیما and سارا about their subjects and
    how they feel about them (hard but interesting).

units:
  fa.a1.unit30.education:
    title: Education

lessons:
  fa.a1.unit30.lesson01.study_vocabulary: {title: "Study & university words"}
  fa.a1.unit30.lesson02.subjects: {title: "What do you study?"}
  fa.a1.unit30.lesson03.where_and_frequency: {title: "Where do you study?"}
  fa.a1.unit30.lesson04.study_dialogue: {title: "Dialogue: Studies"}
  fa.a1.unit30.lesson05.reading_education: {title: "Reading about Nima's and Sara's studies"}
  fa.a1.unit30.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit30.lesson01.teach.daneshgah_word:
    title: University
    gloss: university
    note: "*دانشگاه* is the standard, everyday word for 'university.'"
    example_gloss: "This university is good."
  fa.a1.unit30.lesson01.teach.daneshjoo_word:
    title: Student
    gloss: student
    note: "*دانشجو* means 'university student' -- the colloquial 1st-person form *دانشجویم* ('I'm a student') parallels the already-established 3rd-person *دانشجویه* from unit04."
    example_gloss: "I'm a student."
  fa.a1.unit30.lesson01.teach.dars_word:
    title: "Lesson / subject"
    gloss: "lesson / subject"
    note: "*درس* means both 'a lesson' and, more broadly, 'a subject of study.'"
    example_gloss: "This subject is interesting."
  fa.a1.unit30.lesson01.teach.zaban_word:
    title: Language
    gloss: language
    note: "*زبان* is the standard word for 'language.'"
    example_gloss: "Persian is a language."
  fa.a1.unit30.lesson01.teach.review_man_in:
    title: "I / this"
    gloss: "I / this"
    note: "*من* and *این*, both already well established, reappear here for talking about your studies."
  fa.a1.unit30.lesson01.teach.review_dar:
    title: "In / at"
    gloss: "in / at"
    note: "*در*, already taught back in unit18 (to avoid a homograph with *تو* meaning 'you'), reappears here for 'at university.'"
  fa.a1.unit30.lesson01.teach.mikhonam_pattern:
    title: "Study/read + I = I study/read"
    gloss: "study/read + I = I study/read"
    note: "*خوندن* (already taught back in unit24's *کتاب خوندن*/*کتاب خوندم*) takes the same present-tense *-م* pattern as *می‌کنم* to form *می‌خونم*, 'I study' or 'I read.'"
  fa.a1.unit30.lesson01.teach.combined_sentence:
    title: "I study at university"
    gloss: "I study at university"
    note: "*من در دانشگاه درس می‌خونم* combines *من* + *در* + *دانشگاه* + *درس* + *می‌خونم*."

  fa.a1.unit30.lesson02.teach.riazi_word:
    title: Math
    gloss: math
    note: "*ریاضی* is the standard word for 'math' or 'mathematics.'"
    example_gloss: "Math is interesting."
  fa.a1.unit30.lesson02.teach.reshte_word:
    title: "Major / field of study"
    gloss: "major / field of study"
    note: "*رشته* means a university 'major' or 'field of study.' *رشته‌ی من* ('my major') uses the same written-ی ezafe pattern already established by unit04's *خانواده‌ته*."
    example_gloss: "My major is language."
  fa.a1.unit30.lesson02.teach.review_engelisi:
    title: English
    gloss: English
    note: "*انگلیسی*, already taught back in unit02, reappears here to name a subject you might study."
  fa.a1.unit30.lesson02.teach.yad_migiram_pattern:
    title: "Learn + I = I'm learning"
    gloss: "learn + I = I'm learning"
    note: "*یاد گرفتن* means 'to learn.' Its present-tense form *یاد می‌گیرم* reuses unit29's already-taught *می‌گیرم* ('I take/get'), the same verb in a different, equally natural everyday sense."
  fa.a1.unit30.lesson02.teach.mikhoni_pattern:
    title: "You study/read (informal)"
    gloss: "you study/read (informal)"
    note: "*می‌خونی* is the informal 2nd-person form of *می‌خونم*, used to ask someone directly."
  fa.a1.unit30.lesson02.teach.review_chi:
    title: What
    gloss: what
    note: "*چی* ('what'), already established across earlier units, reappears here."
  fa.a1.unit30.lesson02.teach.question_what_study:
    title: "What do you study?"
    gloss: "What do you study?"
    note: "*چی درس می‌خونی؟* strings together every piece from this lesson."
  fa.a1.unit30.lesson02.teach.answer_major:
    title: "My major is math. I'm also learning English."
    gloss: "My major is math. I'm also learning English."
    note: "*رشته‌ی من ریاضیه. زبان انگلیسی رو هم یاد می‌گیرم* answers with your major and an extra subject, using the already-established *رو* object marker (unit26) and *هم* ('also,' units 24-29)."

  fa.a1.unit30.lesson03.teach.review_koja:
    title: Where
    gloss: where
    note: "*کجا* ('where'), already established via the *کجاست* question family (unit05), reappears here as a standalone question word."
  fa.a1.unit30.lesson03.teach.question_where_study:
    title: "Where do you study?"
    gloss: "Where do you study?"
    note: "*کجا درس می‌خونی؟* asks where someone studies."
  fa.a1.unit30.lesson03.teach.review_be:
    title: To
    gloss: to
    note: "*به*, already taught back in unit13, reappears here for 'to university.'"
  fa.a1.unit30.lesson03.teach.review_miram:
    title: "I go"
    gloss: "I go"
    note: "*می‌رم*, already taught back in unit28, reappears here for going to university."
  fa.a1.unit30.lesson03.teach.review_har_ruz:
    title: "Every day"
    gloss: "every day"
    note: "*هر روز*, already taught back in unit11, reappears here."
  fa.a1.unit30.lesson03.teach.answer_frequency:
    title: "I go to university every day"
    gloss: "I go to university every day"
    note: "*هر روز به دانشگاه می‌رم* combines every piece from this lesson."

  fa.a1.unit30.lesson04.teach.sakhte_word:
    title: "It's hard"
    gloss: "it's hard"
    note: "*سخته* (*سخت* + the colloquial copula *-ه*) describes something difficult."
    example_gloss: "Math is hard."
  fa.a1.unit30.lesson04.teach.review_jalebe:
    title: "It's interesting"
    gloss: "it's interesting"
    note: "*جالبه*, already taught back in unit14, reappears here."
  fa.a1.unit30.lesson04.teach.review_vali:
    title: But
    gloss: but
    note: "*ولی*, already taught back in unit15, reappears here."
  fa.a1.unit30.lesson04.teach.review_are:
    title: Yeah
    gloss: yeah
    note: "*آره*, already taught back in unit04, reappears here."
  fa.a1.unit30.lesson04.teach.dialogue_line1:
    title: "Nima: Sara, what do you study?"
    gloss: "Sara, what do you study?"
  fa.a1.unit30.lesson04.teach.dialogue_line2:
    title: "Sara: I study English. Where do you study?"
    gloss: "I study English. Where do you study?"
  fa.a1.unit30.lesson04.teach.dialogue_line3:
    title: "Nima: I study math at university."
    gloss: "I study math at university."
  fa.a1.unit30.lesson04.teach.dialogue_line4:
    title: "Sara: Math is hard, right?"
    gloss: "Math is hard, right?"
  fa.a1.unit30.lesson04.teach.dialogue_line5:
    title: "Nima: Yeah, it's hard, but it's interesting."
    gloss: "Yeah, it's hard, but it's interesting."
  fa.a1.unit30.lesson04.teach.dialogue_line6:
    title: "Sara: How nice!"
    gloss: "How nice!"

  fa.a1.unit30.lesson05.teach.review_mikhone:
    title: "He/she studies/reads"
    gloss: "he/she studies/reads"
    note: "*می‌خونه* is the 3rd-person colloquial form of *می‌خونم*, needed for talking about نیما and سارا in this reading."
  fa.a1.unit30.lesson05.teach.review_mire:
    title: "He/she goes"
    gloss: "he/she goes"
    note: "*می‌ره*, already taught back in unit28, is the 3rd-person colloquial form of *می‌رم* ('I go')."
  fa.a1.unit30.lesson05.teach.review_oo:
    title: "He / she"
    gloss: "he / she"
    note: "*او*, already well established since unit01, is the 3rd-person pronoun."
  fa.a1.unit30.lesson05.teach.review_nima:
    title: Nima
    gloss: Nima
    note: "نیما, this course's recurring character."
  fa.a1.unit30.lesson05.teach.reading_text:
    title: "Reading: Nima's and Sara's studies"
    gloss: "Nima studies math at university. Math is hard but interesting. Sara studies English. She goes to university every day."
    note: "This reading reuses every fact already established in lesson04's dialogue, just told in the 3rd person -- almost no new vocabulary, just recognizing it in connected text."

  fa.a1.unit30.lesson06.teach.review_dooset_daram_vaght:
    title: "I like / time / I don't have"
    gloss: "I like / time / I don't have"
    note: "*دوست دارم*, *وقت* (already taught back in unit24), and *ندارم* (already taught back in unit04) combine here for a real, natural preference-plus-constraint sentence about studying."
  fa.a1.unit30.lesson06.teach.review_gahi:
    title: Sometimes
    gloss: sometimes
    note: "*گاهی*, already taught back in units 24/27/28/29, reappears here."
  fa.a1.unit30.lesson06.teach.wrap_summary:
    title: "I like studying, but sometimes it's hard"
    gloss: "I like studying, but sometimes it's hard"
    note: "*درس رو دوست دارم ولی گاهی سخته* combines a preference with a constraint using *ولی*."

