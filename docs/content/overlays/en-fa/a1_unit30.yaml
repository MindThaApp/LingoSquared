  fa.a1.unit30.lesson05.exercise03.match_reading_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"می‌خونه": "he/she studies/reads", "می‌ره": "he/she goes", او: "he/she", نیما: Nima, "نیما در دانشگاه ریاضی می‌خونه.": "Nima studies math at university.", "سارا زبان انگلیسی می‌خونه.": "Sara studies English.", "او هر روز به دانشگاه می‌ره.": "She goes to university every day."}
