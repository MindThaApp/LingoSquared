teaching:
  fa.a2.unit42.lesson01.teach.clothes:
    title: Clothes and bags
    gloss: shirt, shoes, bag, trousers, coat
    note: '*کفش* is “shoes” (one word for the pair).'
    example_gloss:
    - I have a shirt.
    - I have a pair of shoes.
    - I have a bag.
    - I have a pair of trousers.
    - I have a coat.
  fa.a2.unit42.lesson01.teach.colours:
    title: Colours
    gloss: white, black, red, blue, green
    note: Colours are adjectives and come after the noun.
    example_gloss:
    - My shirt is white.
    - My bag is black.
    - My shoes are red.
    - My trousers are blue.
    - My coat is green.
  fa.a2.unit42.lesson01.teach.size_age:
    title: Big, small, new, old
    gloss: big, small, new, old
    note: '*نو* and *قدیمی* describe how new or old something is.'
    example_gloss:
    - My bag is big.
    - My shoes are small.
    - My coat is not new.
    - My shirt is old.
  fa.a2.unit42.lesson01.teach.ezafe:
    title: 'Noun + adjective: the linking sound'
    gloss: a red bag; a white shirt; new shoes
    note: 'In Persian the adjective comes after the noun. A short linking vowel *-e* (the ezafe) joins them when you speak: *کیف قرمز* is said “kif-e qermez”. After a consonant this vowel is not written.'
  fa.a2.unit42.lesson02.teach.owners:
    title: Owners
    gloss: Sara, Nima, who, whose is it
    note: '*کیه؟* asks “who is it?” or “whose is it?”.'
    example_gloss:
    - Whose bag is this?
    - Whose shoes are these?
  fa.a2.unit42.lesson02.teach.owner_rule:
    title: Noun + owner
    gloss: Sara’s bag; Nima’s shoes; the manager’s shirt
    note: 'The owner comes after the thing, joined by the same linking *-e*: *کیف سارا* is “kif-e Sara”. In English the owner comes first (“Sara’s bag”); in Persian it comes second.'
  fa.a2.unit42.lesson02.teach.whose:
    title: Whose is it?
    gloss: Whose bag is this? Sara’s bag.
    note: 'Ask *این ... کیه؟* and answer with the thing and its owner. To say “it is Nima’s”, attach *است* to the name: *این کفش نیماست*.'
  fa.a2.unit42.lesson03.teach.things:
    title: Home and clothing
    gloss: house, coat, chair, table
    note: '*خونه* ends in a silent *ه*; *پالتو* ends in the vowel *و*; *صندلی* ends in *ی*.'
    example_gloss:
    - The house is big.
    - The coat is black.
    - The chair is here.
    - The table is over there.
  fa.a2.unit42.lesson03.teach.rule_h:
    title: 'After a silent ه: ه‌ی'
    gloss: the big house; Nima’s house
    note: 'After a silent *ه* the linking vowel is written *ی* with a half-space: *خونه‌ی بزرگ*, *خونه‌ی نیما*.'
  fa.a2.unit42.lesson03.teach.rule_v:
    title: After و and ی
    gloss: the black coat; Sara’s coat; Nima’s chair
    note: 'After *و* the linking vowel is written *ی*: *پالتوی سیاه*. After *ی* you say “-ye” but nothing extra is written: *صندلی نیما*.'
  fa.a2.unit42.lesson04.teach.materials:
    title: Materials and a sofa
    gloss: leather (adj.), wooden, sofa
    note: '*چرمی* means “made of leather”, *چوبی* “made of wood”.'
    example_gloss:
    - My bag is leather.
    - The table is wooden.
    - The sofa is here.
  fa.a2.unit42.lesson04.teach.chain1:
    title: Noun + adjective + owner
    gloss: Sara’s red bag; Nima’s black coat; Nima’s big house
    note: 'You can keep adding words after the noun, each joined by the linking vowel. The owner comes last: *کیف قرمز سارا* (kif-e qermez-e Sara). The owner is the last link.'
  fa.a2.unit42.lesson04.teach.chain2:
    title: Noun + two adjectives
    gloss: a black leather bag; a big wooden table; a new red sofa
    note: 'Two adjectives follow the same pattern. Both orders occur; material before colour or size is slightly more common: *کیف چرمی سیاه*, *میز چوبی بزرگ*.'
  fa.a2.unit42.lesson05.teach.reading:
    title: A lost bag
    gloss: I lost my bag. My bag is red and leather and small. In the bag there is a black phone. My black phone is old. In the bag there is also a pair of blue glasses. The blue glasses belong to Nima.
    note: Read once for the bag, then again for the things inside it.
  fa.a2.unit42.lesson06.teach.turn01:
    title: The clerk shows a coat
    gloss: 'Clerk: Excuse me, does this black coat belong to you?'
    note: '*مال شماست* is the polite “belongs to you”.'
  fa.a2.unit42.lesson06.teach.turn02:
    title: Nima describes his own coat
    gloss: 'Nima: No, my coat is blue. My blue coat is big.'
    note: '*پالتوی آبی من*: noun + adjective + owner.'
  fa.a2.unit42.lesson06.teach.turn03:
    title: The clerk offers a bag
    gloss: 'Clerk: I do not have a big blue coat. What about this red leather bag?'
    note: '*کیف قرمز چرمی*: noun + colour + material (*کیف چرمی قرمز* is also correct).'
  fa.a2.unit42.lesson06.teach.turn04:
    title: Nima names the owner
    gloss: 'Nima: That is Sara’s bag. Sara’s bag is red.'
    note: '*ساراست* is the spoken *سارا است*.'
