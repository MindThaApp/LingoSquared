course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: naming everyday devices (phone, computer,
    internet, app), phone actions (sending a message, calling, taking a
    photo, downloading an app), asking and answering how often you use
    your phone (*هر روز چند بار از گوشیت استفاده می‌کنی؟*), a reading
    passage about *نیما*'s and *سارا*'s device habits, and a closing dialogue
    between *نیما* and *سارا* about how they each use technology.

units:
  fa.a1.unit29.technology:
    title: Technology

lessons:
  fa.a1.unit29.lesson01.device_vocabulary: {title: "Technology words"}
  fa.a1.unit29.lesson02.phone_actions: {title: "Phone actions"}
  fa.a1.unit29.lesson03.frequency_question: {title: "How many times a day?"}
  fa.a1.unit29.lesson04.tech_dialogue: {title: "Dialogue: Technology"}
  fa.a1.unit29.lesson05.reading_technology: {title: "Reading about Nima's and Sara's tech use"}
  fa.a1.unit29.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit29.lesson01.teach.tech_word:
    title: Technology
    gloss: technology
    note: "*تکنولوژی* is the everyday Iranian word for 'technology.'"
    example_gloss: "Technology is good."
  fa.a1.unit29.lesson01.teach.goshi_word:
    title: "Phone / mobile phone"
    gloss: "phone / mobile phone"
    note: "*گوشی* (literally 'handset') is the everyday, colloquial Iranian word for 'mobile phone,' more common in casual speech than *موبایل*."
    example_gloss: "I have a phone."
  fa.a1.unit29.lesson01.teach.computer_word:
    title: Computer
    gloss: computer
    note: "*کامپیوتر* is the standard, everyday word for 'computer.'"
    example_gloss: "This computer is good."
  fa.a1.unit29.lesson01.teach.internet_word:
    title: Internet
    gloss: internet
    note: "*اینترنت* is the everyday loanword for 'internet.'"
    example_gloss: "The internet is good."
  fa.a1.unit29.lesson01.teach.app_word:
    title: App
    gloss: app
    note: "*اپلیکیشن* means 'app' or 'application' and is commonly used."
    example_gloss: "This app is good."
  fa.a1.unit29.lesson01.teach.review_man_in_daram:
    title: "I / this / I have"
    gloss: "I / this / I have"
    note: "*من*, *این*, and *دارم* are familiar words that come back here for talking about the devices you own."
  fa.a1.unit29.lesson01.teach.review_estefade_mikonam:
    title: "Use + I do = I use"
    gloss: "use + I do = I use"
    note: "*استفاده* combines with *می‌کنم* ('I do') to mean 'I use.' *از* marks what you use."
  fa.a1.unit29.lesson01.teach.combined_sentence:
    title: "I use the internet"
    gloss: "I use the internet"
    note: "*من از اینترنت استفاده می‌کنم* combines *من* + *از* + *اینترنت* + *استفاده می‌کنم*."

  fa.a1.unit29.lesson02.teach.review_peyam:
    title: Message
    gloss: message
    note: "*پیام* comes back here."
  fa.a1.unit29.lesson02.teach.mifrestam_phrase:
    title: "I send a message"
    gloss: "I send a message"
    note: "*پیام می‌فرستم* combines *پیام* with the new verb *می‌فرستم* ('I send')."
  fa.a1.unit29.lesson02.teach.review_zang_mizanam:
    title: "I call"
    gloss: "I call"
    note: "*زنگ می‌زنم* comes back here as one of the things you do with a *گوشی*."
  fa.a1.unit29.lesson02.teach.review_aks:
    title: Photo
    gloss: photo
    note: "*عکس* comes back here."
  fa.a1.unit29.lesson02.teach.akas_migiram_phrase:
    title: "I take a photo"
    gloss: "I take a photo"
    note: "*عکس می‌گیرم* combines *عکس* with the new verb *می‌گیرم* ('I take')."
  fa.a1.unit29.lesson02.teach.download_word:
    title: Download
    gloss: download
    note: "*دانلود* is an everyday loanword; *دانلود کردن* ('to download') is the standard colloquial construction."
    example_gloss: "I'm downloading this app."
  fa.a1.unit29.lesson02.teach.want_download_app_phrase:
    title: "I want to download an app"
    gloss: "I want to download an app"
    note: "*می‌خوام یک اپلیکیشن دانلود کنم* combines *می‌خوام* ('I want') with *دانلود کنم* ('I download'), the verb form used after 'want.'"

  fa.a1.unit29.lesson03.teach.review_har_ruz:
    title: "Every day"
    gloss: "every day"
    note: "*هر روز* comes back here for describing how often you use your phone."
  fa.a1.unit29.lesson03.teach.review_chand_baar:
    title: "How many / times"
    gloss: "how many / times"
    note: "*چند* and *بار* combine here to ask 'how many times.'"
  fa.a1.unit29.lesson03.teach.review_to_mikoni:
    title: "You / you use (informal)"
    gloss: "you / you use (informal)"
    note: "*تو* and *می‌کنی* come back here to ask someone directly."
  fa.a1.unit29.lesson03.teach.goshiat_word:
    title: "Your phone"
    gloss: "your phone"
    note: "*گوشیت* adds the ending *-ت* ('your') to *گوشی*, just like *خانواده‌ته* ('your family')."
  fa.a1.unit29.lesson03.teach.question_frequency:
    title: "How many times a day do you use your phone?"
    gloss: "How many times a day do you use your phone?"
    note: "*هر روز چند بار از گوشیت استفاده می‌کنی؟* strings together every piece from this lesson."
  fa.a1.unit29.lesson03.teach.answer_har_ruz:
    title: "I use the internet every day"
    gloss: "I use the internet every day"
    note: "*هر روز از اینترنت استفاده می‌کنم* answers with the first-person form you learned earlier in this unit."

  fa.a1.unit29.lesson04.teach.review_zyad:
    title: "A lot"
    gloss: "a lot"
    note: "*زیاد* comes back here."
  fa.a1.unit29.lesson04.teach.review_khoone:
    title: Home
    gloss: home
    note: "*خونه* comes back here."
  fa.a1.unit29.lesson04.teach.review_are:
    title: Yeah
    gloss: yeah
    note: "*آره* is the everyday colloquial word for 'yes.'"
  fa.a1.unit29.lesson04.teach.review_ham:
    title: "Also / too"
    gloss: "also / too"
    note: "*هم* comes back here."
  fa.a1.unit29.lesson04.teach.dialogue_line1:
    title: "Nima: Sara, how many times a day do you use your phone?"
    gloss: "Sara, how many times a day do you use your phone?"
  fa.a1.unit29.lesson04.teach.dialogue_line2:
    title: "Sara: I use my phone a lot. I take photos and send messages."
    gloss: "I use my phone a lot. I take photos and send messages."
  fa.a1.unit29.lesson04.teach.dialogue_line3:
    title: "Nima: Do you use a computer too?"
    gloss: "Do you use a computer too?"
  fa.a1.unit29.lesson04.teach.dialogue_line4:
    title: "Sara: Yeah, I use a computer at home."
    gloss: "Yeah, I use a computer at home."
  fa.a1.unit29.lesson04.teach.dialogue_line5:
    title: "Nima: I use the internet every day."
    gloss: "I use the internet every day."
  fa.a1.unit29.lesson04.teach.dialogue_line6:
    title: "Sara: How nice!"
    gloss: "How nice!"

  fa.a1.unit29.lesson05.teach.review_mikone:
    title: "He/she uses"
    gloss: "he/she uses"
    note: "*استفاده می‌کنه* is the 3rd-person colloquial form of *استفاده می‌کنم*, needed for talking about نیما and سارا in this reading."
  fa.a1.unit29.lesson05.teach.review_oo:
    title: "He / she"
    gloss: "he / she"
    note: "*او* is the 3rd-person pronoun."
  fa.a1.unit29.lesson05.teach.review_migire:
    title: "He/she takes"
    gloss: "he/she takes"
    note: "*می‌گیره* is the 3rd-person colloquial form of *می‌گیرم* ('I take')."
  fa.a1.unit29.lesson05.teach.review_mifreste:
    title: "He/she sends"
    gloss: "he/she sends"
    note: "*می‌فرسته* is the 3rd-person colloquial form of *می‌فرستم* ('I send')."
  fa.a1.unit29.lesson05.teach.reading_text:
    title: "Reading: Nima's and Sara's tech use"
    gloss: "Sara uses her phone a lot. She takes photos and sends messages. Sara also uses a computer at home. Nima uses the internet every day."
    note: "This reading retells the dialogue in the 3rd person. There is almost no new vocabulary, so it is practice in recognizing words in connected text."

  fa.a1.unit29.lesson06.teach.review_vali:
    title: But
    gloss: but
    note: "*ولی* comes back here."
  fa.a1.unit29.lesson06.teach.review_dooset_daram_vaght:
    title: "I like / time / I don't have"
    gloss: "I like / time / I don't have"
    note: "*دوست دارم*, *وقت*, and *ندارم* combine here for a natural preference-plus-constraint sentence."
  fa.a1.unit29.lesson06.teach.review_gahi:
    title: Sometimes
    gloss: sometimes
    note: "*گاهی* comes back here."
  fa.a1.unit29.lesson06.teach.wrap_summary:
    title: "I like technology, but sometimes I don't have time"
    gloss: "I like technology, but sometimes I don't have time"
    note: "*تکنولوژی رو دوست دارم ولی گاهی وقت ندارم* combines a preference with a constraint using *ولی*."

