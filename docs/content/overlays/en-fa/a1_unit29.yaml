      - value: {تکنولوژی: technology, گوشی: "phone / mobile phone", کامپیوتر: computer, اینترنت: internet, اپلیکیشن: app, من: I, این: this, دارم: "I have", "من از اینترنت استفاده می‌کنم.": "I use the internet."}
