teaching:
  fa.a2.unit19.lesson01.teach.weekend_phrase:
    title: Last weekend
    gloss: last weekend
    note: '*آخر هفته‌ی پیش* is literally ''the end of last week'', which is how Persian says ''last weekend''. In Iran the weekend is Thursday and Friday.'
    example_gloss: Last weekend I stayed home.
  fa.a2.unit19.lesson01.teach.days:
    title: Thursday, Friday
    gloss: Thursday, Friday
    note: These two days make up the Iranian weekend, so they are what a weekend account usually talks about.
    example_gloss:
    - On Thursday I went to the park.
    - On Friday I stayed home.
  fa.a2.unit19.lesson01.teach.parts_of_day:
    title: Morning, noon, late afternoon
    gloss: morning, noon, late afternoon
    note: '*عصر* covers the late afternoon and early evening. Put the time of day right after the day: *پنجشنبه صبح* ''on Thursday morning''.'
    example_gloss:
    - On Thursday morning I went shopping.
    - I slept until noon.
    - In the late afternoon I went to the park.
  fa.a2.unit19.lesson01.teach.places:
    title: Park, cinema, bank
    gloss: park, cinema, bank
    note: 'With *رفتن* (to go), *به* (''to'') is often dropped in speech: *به پارک رفتم* and *رفتم پارک* both mean ''I went to the park''.'
    example_gloss:
    - On Thursday I went to the park.
    - On Friday I went to the cinema.
    - On Thursday I went to the bank.
  fa.a2.unit19.lesson01.teach.errands:
    title: Shopping
    gloss: shopping
    note: '*رفتم خرید* means ''I went shopping''. The same word *خرید* is also the ''he/she'' past form of *خریدن*: ''he/she bought''.'
    example_gloss: On Thursday morning I went shopping.
  fa.a2.unit19.lesson01.teach.home_book_film:
    title: Home, book, film
    gloss: home, book, film
    note: '*خونه* is the spoken form of *خانه* (house, home). In speech *یه کتاب* (''a book'') is the usual form of *یک کتاب*; both are fine.'
    example_gloss:
    - On Friday I stayed home.
    - I read a book.
    - I watched a film.
  fa.a2.unit19.lesson01.teach.people:
    title: My friend, my grandmother
    gloss: my friend, my grandmother
    note: 'The ending *-م* on a noun means ''my'': *دوست* (friend) becomes *دوستم* (my friend).'
    example_gloss:
    - On Thursday my friend came.
    - On Friday my grandmother came.
  fa.a2.unit19.lesson01.teach.visit:
    title: Visiting
    gloss: visiting / seeing
    note: '*رفتن دیدن* plus a person means to go and visit them: *رفتم دیدن دوستم* ''I went to visit my friend''. The same word *دیدن* also means ''to see''.'
    example_gloss: I went to visit my grandmother.
  fa.a2.unit19.lesson01.teach.verbs_go_stay:
    title: I went, I came, I stayed
    gloss: I went, I came, I stayed
    note: These are *I*-forms of the simple past. Spoken Persian says *اومدم* and *موندم* where careful writing has *آمدم* and *ماندم*.
    example_gloss:
    - On Thursday I went to the park.
    - On Friday I came home.
    - Last weekend I stayed home.
  fa.a2.unit19.lesson01.teach.verbs_eat_see:
    title: I ate, I saw, I read, I slept
    gloss: I ate, I saw, I read, I slept
    note: Four more *I*-forms of the simple past. *خوندم* is the spoken form of *خواندم*.
    example_gloss:
    - I ate lunch.
    - I watched a film.
    - I read a book.
    - On Friday I slept.
  fa.a2.unit19.lesson02.teach.pronouns:
    title: I, you, he/she, we
    gloss: I, you (informal), he / she, we
    note: Spoken Persian usually drops the pronoun, because the verb ending already shows who is acting. Add it for emphasis or contrast. *اون* means 'he' or 'she'.
    example_gloss:
    - I went to the park on Thursday.
    - Did you stay home?
    - He came on Friday.
    - We went to the park on Thursday.
  fa.a2.unit19.lesson02.teach.stem_rule:
    title: The past stem
    gloss: 'Past stems: went, ate, saw, read, stayed, came, slept'
    note: 'The dictionary form (infinitive) of a verb ends in *-ن*. Drop it and you have the past stem: *رفتن* → *رفت*, *خوردن* → *خورد*, *دیدن* → *دید*, *خوندن* → *خوند*, *موندن* → *موند*, *اومدن* → *اومد*, *خوابیدن* → *خوابید*. Everything in the simple past is built on this stem.'
  fa.a2.unit19.lesson02.teach.endings:
    title: Endings on the past stem
    gloss: I went, you went, he/she went, we went, you (plural) went, they went
    note: 'Add the ending to the stem: *-م* (I), *-ی* (you), no ending (he/she), *-یم* (we), *-ین* (you plural or formal, as spoken: *رفتین*), *-ن* (they). Careful writing has *-ید* for ''you plural'' (*رفتید*) and *-ند* for ''they'' (*رفتند*). Note that *رفتن* also means ''to go'' -- context tells them apart. And do not mix up the two *-م*: on a noun it means ''my'' (*دوستم*), on a past verb it means ''I'' (*رفتم*).'
  fa.a2.unit19.lesson02.teach.eat_forms:
    title: The same endings on خورد
    gloss: I ate, you ate, he/she ate, we ate
    note: 'Same endings, different stem: *خورد* + *-م*, *-ی*, nothing, *-یم*.'
  fa.a2.unit19.lesson02.teach.stay_forms:
    title: The same endings on موند
    gloss: I stayed, you stayed, he/she stayed, we stayed
    note: 'The stem *موند* takes the same endings. In the ''he/she'' form there is nothing to add: *اون خونه موند*.'
  fa.a2.unit19.lesson03.teach.and_but:
    title: But, and
    gloss: but, and
    note: '*ولی* joins two contrasting clauses; *و* simply adds one more thing.'
    example_gloss:
    - I went to the park, but I didn't go to the cinema.
    - On Friday I stayed home and read a book.
  fa.a2.unit19.lesson03.teach.time_words:
    title: Yesterday, today, every day
    gloss: yesterday, today, every day
    note: 'Time words help you choose the tense: *دیروز* points to the past, *امروز* and *هر روز* to the present.'
    example_gloss:
    - Yesterday I went to the park.
    - Today I'm not going to the park.
    - Every day I go to the park.
  fa.a2.unit19.lesson03.teach.negative_rule:
    title: 'Negative past: نـ + verb'
    gloss: I didn't go, I didn't eat, I didn't see, I didn't read, I didn't stay
    note: 'To say you did NOT do something, put *نـ* directly in front of the past verb and change nothing else: *رفتم* → *نرفتم*, *خوردم* → *نخوردم*, *ندیدم*, *نخوندم*, *نموندم*. The endings stay the same: *نرفتم*, *نرفتی*, *نرفت*, *نرفتیم*. Write *نـ* joined to the verb -- it is not the separate word *نه* (''no''): *نه، نرفتم* means ''No, I didn''t go''.'
  fa.a2.unit19.lesson03.teach.neg_aamad:
    title: 'The exception: اومدن'
    gloss: I didn't come, you didn't come, he/she didn't come, we didn't come
    note: '*اومدن* (''to come'') begins with a vowel, so *نـ* + *ا* turns into *نی*: *اومدم* → *نیومدم* (never *ناومدم*). The rest of the endings follow the usual pattern: *نیومدی*, *نیومد*, *نیومدیم*. Careful writing has *آمدم* → *نیامدم*.'
  fa.a2.unit19.lesson03.teach.past_vs_present:
    title: Past or present?
    gloss: I go, I went, I don't go, I didn't go
    note: 'The simple past has no *می‌* and uses the past stem (*رفتم*); the present has *می‌* plus the present stem (*می‌رم*). Stem and *می‌* together tell you the tense. The negatives work the same way: *نرفتم* ''I didn''t go'' but *نمی‌رم* ''I don''t go / I''m not going''. Pronunciation: the past negative is *na-* (*نرفتم*, ''na-raftam''), while *نمی‌* is *ne-* (*نمی‌رم*, ''ne-miram'').'
  fa.a2.unit19.lesson04.teach.sequence_words:
    title: First, then, in the end
    gloss: first, then / afterwards, in the end
    note: '*اول* opens a sequence, *بعد* continues it (you can repeat it), and *آخرش* closes it.'
    example_gloss:
    - First I went to the bank.
    - Then I went shopping.
    - In the end I came home.
  fa.a2.unit19.lesson04.teach.sequence_note:
    title: Telling events in order
    gloss: First I went to the bank, then I went shopping, in the end I came home.
    note: 'Tell events in the order they happened. Each clause has its own past verb at the end. Join the clauses with a comma or with *و*: *اول رفتم بانک و بعد رفتم خرید*. Put the negative event where it belongs in the story: *بعد رفتم پارک، ولی سینما نرفتم* or *بعد رفتم خرید، ولی ورزش نکردم*. *اومدم خونه* (''I came home'') is a natural way to close a day out.'
  fa.a2.unit19.lesson04.teach.question:
    title: What did you do last weekend?
    gloss: What did you do last weekend?
    note: '*چیکار کردی؟* (literally ''what did you do?'') is the standard way to ask. You answer with past verbs, one clause per thing you did.'
  fa.a2.unit19.lesson04.teach.sport:
    title: Exercise
    gloss: exercise / sport
    note: '*ورزش کردن* means to exercise or to do sport.'
    example_gloss: On Thursday I exercised.
  fa.a2.unit19.lesson04.teach.compound_negative:
    title: Negating verbs like خرید کردن
    gloss: I did the shopping, I didn't do the shopping, I exercised, I didn't exercise
    note: 'Verbs like *خرید کردن* (''to shop'') and *ورزش کردن* are a noun plus *کردن* (''to do''). Put *نـ* on the verb, not on the noun: *خرید نکردم*, never *نخرید کردم*. The ''he/she'' form is *نکرد*: *ورزش نکرد*.'
  fa.a2.unit19.lesson04.teach.no_answer:
    title: Answering a yes/no question in the past
    gloss: Did you go to the cinema? No, I didn't.
    note: 'To say no to a question about the past, repeat the verb with *نـ*: *نرفتم*. Adding *نه* (''no'') in front is very common. To say yes, repeat the verb without it: *رفتم*.'
  fa.a2.unit19.lesson05.teach.spot_negative:
    title: Spot the negative
    gloss: I didn't do, I didn't go, I didn't see
    note: 'When you read or listen, check the very start of each verb. A small *نـ* flips the meaning completely: *رفتم* ''I went'' but *نرفتم* ''I didn''t go''. In a weekend account, the negatives tell you what did NOT happen, so note them as carefully as the activities.'
  fa.a2.unit19.lesson05.teach.reading_message:
    title: Sara's message to a friend
    gloss: Hi! Last weekend, on Thursday morning, I went shopping. Then I went to the park. In the late afternoon I went to visit my grandmother. On Friday I stayed home and read a book. But I didn't exercise and I didn't go to the cinema.
    note: A short written weekend account. Read it once for the activities and their order, then again for the two things she did NOT do.
  fa.a2.unit19.lesson06.teach.names:
    title: Sara, Nima
    gloss: Sara, Nima
    note: The two friends from earlier units.
    example_gloss:
    - Sara went to the park on Thursday.
    - Nima came on Friday.
  fa.a2.unit19.lesson06.teach.until:
    title: Until
    gloss: until
    note: '*تا* before a time or a day means ''until'': *تا ظهر* ''until noon''.'
    example_gloss: I slept until noon.
  fa.a2.unit19.lesson06.teach.what_about:
    title: What about...?
    gloss: What about Friday? What about you?
    note: '*چی؟* after a word asks ''and what about that?'' -- a quick way to move a conversation along.'
  fa.a2.unit19.lesson06.teach.how_nice:
    title: How nice!
    gloss: How nice!
    note: A friendly reaction to good news.
  fa.a2.unit19.lesson06.teach.turn01:
    title: Sara asks about last weekend
    gloss: Sara asks Nima what he did last weekend.
    note: The standard question for a past-weekend account.
  fa.a2.unit19.lesson06.teach.turn02:
    title: Nima's Thursday
    gloss: Nima says that on Thursday he first went to the bank, then went shopping.
    note: '*اول ... بعد ...* puts the two errands in order.'
  fa.a2.unit19.lesson06.teach.turn03:
    title: Sara asks about Friday
    gloss: 'Sara asks: what about Friday? Did you exercise?'
    note: '*ورزش کردی؟* is a yes/no question about a past action.'
  fa.a2.unit19.lesson06.teach.turn04:
    title: Nima's Friday
    gloss: 'Nima says no, he didn''t exercise. He slept until noon and in the late afternoon went to visit his friend. He asks Sara: what about you?'
    note: '*ورزش نکردم* -- the *نـ* goes on the verb. The rest of his Friday is affirmative.'
  fa.a2.unit19.lesson06.teach.turn05:
    title: Sara's weekend
    gloss: Sara says that on Thursday she went to the park, and on Friday she stayed home and read a book.
    note: Sara uses *من* to answer *تو چی؟* -- a case where the pronoun is natural.
  fa.a2.unit19.lesson06.teach.turn06:
    title: Nima reacts
    gloss: 'Nima says: how nice!'
    note: A short, friendly closing reaction.
  fa.a2.unit19.lesson06.teach.third_person:
    title: Talking about other people
    gloss: Nima went, Sara stayed, Nima didn't go, Sara didn't do
    note: 'When you report what someone else did, use the bare stem for ''he/she'': *نیما رفت بانک*, *سارا خونه موند*. The negative is still *نـ* + stem: *نیما نرفت*, *سارا ورزش نکرد*. No ending is added, so the name (or *اون*) is what tells you who acted.'
