  fa.a2.unit19.lesson04.exercise07.write_didnt_do_shopping:
    instruction: 'Write in Farsi, using the verb *کردن*: I didn''t do the shopping.'
    accepted_answers:
    - value: خرید نکردم
      status: correct
    - value: من خرید نکردم
      status: correct
    feedback: '*خرید نکردم.* -- *نـ* goes on *کردم*.'
  fa.a2.unit19.lesson05.exercise01.read_friday:
    instruction: Read the message. What did she do on Friday?
    correct_option: She stayed home and read a book.
    distractors:
    - She went to the park.
    - She visited her grandmother.
    - She went shopping.
    accepted_answers:
    - value: She stayed home and read a book.
      status: correct
    feedback: '*جمعه خونه موندم و کتاب خوندم* -- on Friday she stayed home and read a book.'
  fa.a2.unit19.lesson05.exercise02.read_didnt_do:
    instruction: Read the message. Which of these did she NOT do last weekend?
    correct_option: Go to the cinema
    distractors:
    - Go shopping
    - Read a book
    - Visit her grandmother
    accepted_answers:
    - value: Go to the cinema
      status: correct
    feedback: '*به سینما نرفتم* -- she didn''t go to the cinema.'
  fa.a2.unit19.lesson05.exercise03.listen_thursday_shopping:
    instruction: Listen and select what you hear.
    correct_option: Last weekend, on Thursday morning, I went shopping.
    distractors:
    - Last weekend, on Thursday morning, I went to the park.
    - Last weekend, on Friday morning, I went shopping.
    - Last weekend, on Thursday morning, I didn't go shopping.
    accepted_answers:
    - value: Last weekend, on Thursday morning, I went shopping.
      status: correct
    feedback: The audio says *آخر هفته‌ی پیش پنجشنبه صبح رفتم خرید.*
  fa.a2.unit19.lesson05.exercise04.listen_didnt_go_cinema:
    instruction: Listen and select what you hear.
    correct_option: On Friday I didn't go to the cinema; I stayed home.
    distractors:
    - On Friday I went to the cinema.
    - On Thursday I didn't go to the cinema; I stayed home.
    - On Friday I didn't stay home; I went to the park.
    accepted_answers:
    - value: On Friday I didn't go to the cinema; I stayed home.
      status: correct
    feedback: The audio says *جمعه به سینما نرفتم، خونه موندم.*
  fa.a2.unit19.lesson05.exercise05.listen_ordered_negated:
    instruction: Listen and select what you hear.
    correct_option: First I went to the bank, then I went shopping, but I didn't exercise.
    distractors:
    - First I went shopping, then I went to the bank, but I didn't exercise.
    - First I went to the bank, then I went shopping, and I exercised.
    - First I went to the bank, then I exercised, but I didn't go shopping.
    accepted_answers:
    - value: First I went to the bank, then I went shopping, but I didn't exercise.
      status: correct
    feedback: The audio says *اول رفتم بانک، بعد رفتم خرید، ولی ورزش نکردم.* -- bank first, shopping second, and the negative *ورزش نکردم* at the end.
  fa.a2.unit19.lesson05.exercise06.match_message_facts:
