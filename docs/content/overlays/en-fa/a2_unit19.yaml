  fa.a2.unit19.lesson01.exercise01.recognize_last_weekend:
    instruction: What does this phrase mean?
    correct_option: last weekend
    distractors:
    - next weekend
    - every weekend
    - yesterday morning
    accepted_answers:
    - value: last weekend
      status: correct
    feedback: '*آخر هفته‌ی پیش* means last weekend.'
  fa.a2.unit19.lesson01.exercise02.recognize_went:
    instruction: What does this verb mean?
    correct_option: I went
    distractors:
    - I came
    - I stayed
    - I ate
    accepted_answers:
    - value: I went
      status: correct
    feedback: '*رفتم* means ''I went''.'
  fa.a2.unit19.lesson01.exercise03.recognize_late_afternoon_park:
    instruction: Which sentence matches this Farsi?
    correct_option: In the late afternoon I went to the park.
    distractors:
    - In the morning I went to the park.
    - In the late afternoon I went to the cinema.
    - In the late afternoon I stayed at the park.
    accepted_answers:
    - value: In the late afternoon I went to the park.
      status: correct
    feedback: '*عصر رفتم پارک* -- late afternoon, went, park.'
  fa.a2.unit19.lesson01.exercise04.match_first_past_forms:
    instruction: Match each word with its meaning.
    accepted_answers:
    - value:
        رفتم: I went
        اومدم: I came
        موندم: I stayed
        خوردم: I ate
        دیدم: I saw
        خوندم: I read
        خوابیدم: I slept
        خرید: shopping
      status: correct
    feedback: The seven verbs are all *I*-forms of the simple past.
  fa.a2.unit19.lesson01.exercise05.order_thursday_morning_shopping:
    instruction: 'Arrange the words to say: On Thursday morning I went shopping.'
    accepted_answers:
    - value:
      - پنجشنبه
      - صبح
      - رفتم
      - خرید
      status: correct
    - value:
      - صبح
      - پنجشنبه
      - رفتم
      - خرید
      status: correct
    - value:
      - رفتم
      - خرید
      - پنجشنبه
      - صبح
      status: correct
    - value:
      - رفتم
      - خرید
      - صبح
      - پنجشنبه
      status: correct
    feedback: '*پنجشنبه صبح رفتم خرید* -- the time words come first; in speech the place often comes right after *رفتم*.'
  fa.a2.unit19.lesson01.exercise06.translate_went_to_park:
    instruction: 'Translate into Farsi: I went to the park.'
    accepted_answers:
    - value: به پارک رفتم
      status: correct
    - value: پارک رفتم
      status: correct
    - value: رفتم پارک
      status: correct
    - value: رفتم به پارک
      status: correct
    - value: من به پارک رفتم
      status: correct
    - value: من پارک رفتم
      status: correct
    - value: من رفتم پارک
      status: correct
    - value: من رفتم به پارک
      status: correct
    feedback: '*به پارک رفتم.* -- speakers also say *رفتم پارک*; both are accepted.'
  fa.a2.unit19.lesson02.exercise01.recognize_you_went:
    instruction: What does this verb mean?
    correct_option: you went
    distractors:
    - I went
    - he/she went
    - we went
    accepted_answers:
    - value: you went
      status: correct
    feedback: '*-ی* is the ''you'' ending: *رفتی* means ''you went''.'
  fa.a2.unit19.lesson02.exercise02.recognize_he_ate:
    instruction: What does this verb mean?
    correct_option: he/she ate
    distractors:
    - I ate
    - you ate
    - we ate
    accepted_answers:
    - value: he/she ate
      status: correct
    feedback: 'The bare stem *خورد* is the ''he/she'' form: he or she ate.'
  fa.a2.unit19.lesson02.exercise03.match_infinitive_stem:
    instruction: Match each infinitive with its past stem.
    accepted_answers:
    - value:
        رفتن: رفت
        خوردن: خورد
        دیدن: دید
        خوندن: خوند
        موندن: موند
        اومدن: اومد
      status: correct
    feedback: Drop the final *-ن* from the infinitive to get the past stem.
  fa.a2.unit19.lesson02.exercise04.match_person_endings:
    instruction: Match each verb form with its meaning.
    accepted_answers:
    - value:
        رفتم: I went
        رفتی: you went
        رفت: he/she went
        رفتیم: we went
        خوردم: I ate
        خوردی: you ate
        خورد: he/she ate
        خوردیم: we ate
      status: correct
    feedback: 'The ending tells you who did it: *-م* I, *-ی* you, nothing he/she, *-یم* we.'
  fa.a2.unit19.lesson02.exercise05.order_we_went_to_park:
    instruction: 'Arrange the words to say, starting with the day: On Thursday we went to the park.'
    accepted_answers:
    - value:
      - پنجشنبه
      - به
      - پارک
      - رفتیم
      status: correct
    - value:
      - پنجشنبه
      - رفتیم
      - به
      - پارک
      status: correct
    feedback: '*پنجشنبه به پارک رفتیم.* -- *-یم* on the verb already means ''we'', so no pronoun is needed.'
  fa.a2.unit19.lesson02.exercise06.translate_you_went_to_park:
    instruction: 'Translate into Farsi, talking to one friend (informal ''you''): You went to the park.'
    accepted_answers:
    - value: به پارک رفتی
      status: correct
    - value: پارک رفتی
      status: correct
    - value: رفتی پارک
      status: correct
    - value: رفتی به پارک
      status: correct
    - value: تو به پارک رفتی
      status: correct
    - value: تو پارک رفتی
      status: correct
    - value: تو رفتی پارک
      status: correct
    - value: تو رفتی به پارک
      status: correct
    feedback: '*تو به پارک رفتی.* -- the *-ی* ending marks ''you''; the pronoun *تو* is optional.'
  fa.a2.unit19.lesson02.exercise07.write_we_stayed_home:
    instruction: 'Write in Farsi, using the ''we'' past form of *موندن*: We stayed home.'
    accepted_answers:
    - value: خونه موندیم
      status: correct
    - value: موندیم خونه
      status: correct
    - value: ما خونه موندیم
      status: correct
    - value: ما موندیم خونه
      status: correct
    feedback: '*خونه موندیم.* -- stem *موند* plus *-یم*.'
  fa.a2.unit19.lesson03.exercise01.recognize_didnt_go:
    instruction: What does this verb mean?
    correct_option: I didn't go
    distractors:
    - I went
    - I don't go
    - he/she didn't go
    accepted_answers:
    - value: I didn't go
      status: correct
    feedback: '*نرفتم* is *نـ* + *رفتم*: ''I didn''t go''.'
  fa.a2.unit19.lesson03.exercise02.recognize_book_not_film:
    instruction: Which sentence matches this Farsi?
    correct_option: I read a book, but I didn't watch a film.
    distractors:
    - I watched a film, but I didn't read a book.
    - I read a book and I watched a film.
    - I didn't read a book, and I didn't watch a film.
    accepted_answers:
    - value: I read a book, but I didn't watch a film.
      status: correct
    feedback: '*خوندم* (I read) is affirmative and *ندیدم* (I didn''t see) is negative.'
  fa.a2.unit19.lesson03.exercise03.recognize_every_day_present:
    instruction: Which sentence matches this Farsi?
    correct_option: I go to the park every day.
    distractors:
    - I went to the park yesterday.
    - I didn't go to the park yesterday.
    - I'm not going to the park today.
    accepted_answers:
