course:
  title: Farsi A2
  description: 'Lower-intermediate Iranian Farsi with a grammar spine: banking, opinions, appointments and more, now starting the simple past as a system (stems, endings, and the negative past).'
units:
  fa.a2.unit19.last_weekend:
    title: Last weekend
lessons:
  fa.a2.unit19.lesson01.weekend_words:
    title: Weekend words and the first past forms
  fa.a2.unit19.lesson02.past_stem_and_endings:
    title: How the simple past is built
  fa.a2.unit19.lesson03.negative_past:
    title: The negative past, and past versus present
  fa.a2.unit19.lesson04.saying_what_you_did:
    title: Telling what you did, in order
