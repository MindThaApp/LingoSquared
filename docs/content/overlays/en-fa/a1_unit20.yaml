  required_next_reviewer: null
  notes: >-
    Paired with the fa realization's own draft notes (see that file for the full
    self-check list). STATUS: draft, review pending -- do not treat as ship-ready
    until the standing fresh-context Codex review has run.
    Review 2026-10-19: 6 fixes - corrected the false contraction_note (تومنه is the copula
    contraction, not the ان->ون shift; now cites تومن/تومان); narrowed the کت note (jacket,
    not coat); renamed both clothing-request prompts to name the size form ('a red shirt,
    size large' / 'a blue shirt, size medium') and added یه-prefixed and afterthought-size
    accepted variants to both (the dialogue models یه پیراهن آبی می‌خوام); added 'Size: big.
    Color: red.' (بزرگ is taught as 'big'); added written کوچک as acceptable_with_note on
    write_small. NATIVE FLAGS: (1) price سی هزار تومن for a shirt is far below 2026 Iranian
    retail prices -- confirm or raise to a realistic figure; (2) naturalness of the bare
    written-style order سایز بزرگ پیراهن قرمز می‌خوام (kept, accepted answers are never
    removed).

course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: clothing items, colors, sizes, trying on clothes,
    reading a clothing label, and a full store purchase.

units:
  fa.a1.unit20.clothing:
    title: Clothing

lessons:
  fa.a1.unit20.lesson01.clothing_vocabulary: {title: "Clothing vocabulary"}
  fa.a1.unit20.lesson02.colors: {title: "Colors"}
  fa.a1.unit20.lesson03.sizes: {title: "Sizes"}
  fa.a1.unit20.lesson04.trying_on: {title: "Trying on clothes"}
  fa.a1.unit20.lesson05.label_and_request: {title: "Clothing label and request"}
  fa.a1.unit20.lesson06.store_dialogue: {title: "A full store conversation"}

teaching:
  fa.a1.unit20.lesson01.teach.shirt_word:
    title: "Shirt"
    gloss: "shirt"
    note: "پیراهن is a general word for a shirt."
    example_gloss: "I want a shirt."
  fa.a1.unit20.lesson01.teach.pants_word:
    title: "Pants"
    gloss: "pants"
    note: "شلوار means pants/trousers."
    example_gloss: "How much are these pants?"
  fa.a1.unit20.lesson01.teach.shoes_word:
    title: "Shoes"
    gloss: "shoes"
    note: "کفش means shoes."
    example_gloss: "Do you have shoes?"
  fa.a1.unit20.lesson01.teach.jacket_word:
    title: "Jacket"
    gloss: "jacket"
    note: "کت means a jacket (such as a suit jacket or blazer); a heavy winter coat is usually called something else."
    example_gloss: "I want a jacket."
  fa.a1.unit20.lesson01.teach.nice_word:
    title: "Nice / pretty"
    gloss: "nice"
    note: "قشنگ is a common everyday word for nice/pretty, often used with the -e contraction (قشنگه)."
    example_gloss: "This jacket is nice."
  fa.a1.unit20.lesson01.teach.want_word:
    title: "I want (review)"
    gloss: "می‌خوام means 'I want,' the everyday spoken form of می‌خواهم."
    note: "Review from unit08, used throughout this unit to request clothing items."
  fa.a1.unit20.lesson01.teach.va_word:
    title: "And (review)"
    gloss: "and"
    note: "و is the common connecting word, review from unit08."

  fa.a1.unit20.lesson02.teach.color_word:
    title: "Color"
    gloss: "color"
    note: "رنگ is the general word for color."
    example_gloss: "What color do you want?"
  fa.a1.unit20.lesson02.teach.red_word:
    title: "Red"
    gloss: "red"
    note: "قرمز means red."
    example_gloss: "This shirt is red."
  fa.a1.unit20.lesson02.teach.blue_word:
    title: "Blue"
    gloss: "blue"
    note: "آبی means blue, using the -e contraction (آبیه) for 'is blue'."
    example_gloss: "My pants are blue."
  fa.a1.unit20.lesson02.teach.black_word:
    title: "Black"
    gloss: "black"
    note: "سیاه means black."
    example_gloss: "Black shoes are nice."
  fa.a1.unit20.lesson02.teach.white_word:
    title: "White"
    gloss: "white"
    note: "سفید means white."
    example_gloss: "I want a white jacket."

  fa.a1.unit20.lesson03.teach.size_word:
    title: "Size"
    gloss: "size"
    note: "سایز is the everyday word for clothing size."
    example_gloss: "What size do you want?"
  fa.a1.unit20.lesson03.teach.big_word:
    title: "Big"
    gloss: "big"
    note: "بزرگ means big/large."
    example_gloss: "I want a big size."
  fa.a1.unit20.lesson03.teach.small_word:
    title: "Small"
    gloss: "small"
    note: "کوچیک means small, using the -e contraction (کوچیکه) for 'is small'."
    example_gloss: "These shoes are small."
  fa.a1.unit20.lesson03.teach.medium_word:
    title: "Medium"
    gloss: "medium"
    note: "متوسط means medium/average size."
    example_gloss: "Do you have a medium size?"

  fa.a1.unit20.lesson04.teach.try_on_question:
    title: "Ask to try something on"
    gloss: "Can I try it on?"
    note: "می‌تونم امتحانش کنم؟ is the everyday colloquial way to ask to try on an item of clothing."
  fa.a1.unit20.lesson04.teach.yes_go_ahead:
    title: "Yes, go ahead"
    gloss: "Yes, go ahead."
    note: "بله، بفرمایید is a polite way for a shopkeeper to agree, reusing بفرمایید from unit08."
  fa.a1.unit20.lesson04.teach.contraction_note:
    title: "The colloquial می‌تونم contraction (review)"
    gloss: "می‌تونم is the everyday spoken contraction of می‌توانم (I can)."
    note: "In everyday speech the written -ان- often becomes -ون- (می‌توانم becomes می‌تونم). You have already seen the same change in تومن, the spoken form of تومان."

  fa.a1.unit20.lesson05.teach.label_text:
    title: "A clothing label"
    gloss: "Size: large. Color: red."
    note: "A short clothing label or tag, in the same format you'd see on real clothing."

  fa.a1.unit20.lesson06.teach.please_review:
    title: "Please / go ahead (review)"
    gloss: "please / go ahead"
    note: "Review from unit08."
  fa.a1.unit20.lesson06.teach.thanks_review:
    title: "Thank you (review)"
    gloss: "thank you"
    note: "Review from unit08."
  fa.a1.unit20.lesson06.teach.ok_review:
    title: "Okay (review)"
    gloss: "okay"
    note: "Review from unit08."
  fa.a1.unit20.lesson06.teach.turn01:
    title: "Shopkeeper greets the customer"
    gloss: "Hello, go ahead."
  fa.a1.unit20.lesson06.teach.turn02:
    title: "Nima asks for a blue shirt"
    gloss: "Hello. I want a blue shirt."
  fa.a1.unit20.lesson06.teach.turn03:
    title: "Shopkeeper asks the size"
    gloss: "What size do you want?"
  fa.a1.unit20.lesson06.teach.turn04:
    title: "Nima gives the size and asks to try it on"
    gloss: "Medium size. Can I try it on?"
  fa.a1.unit20.lesson06.teach.turn05:
    title: "Shopkeeper agrees"
    gloss: "Yes, go ahead."
  fa.a1.unit20.lesson06.teach.turn06:
    title: "Nima likes it and asks the price"
    gloss: "It's nice. How much is this?"
  fa.a1.unit20.lesson06.teach.turn07:
    title: "Shopkeeper states the price"
    gloss: "It's 30,000 toman."
  fa.a1.unit20.lesson06.teach.turn08:
    title: "Nima agrees to pay cash"
    gloss: "Okay, I'll pay in cash. Thank you."

exercises:
  fa.a1.unit20.lesson01.exercise01.recognize_shirt:
    instruction: "What does this word mean?"
    correct_option: shirt
    distractors: [pants, shoes, jacket]
    accepted_answers: [{value: shirt, status: correct}]
    feedback: "پیراهن means shirt."
  fa.a1.unit20.lesson01.exercise02.recognize_pants:
    instruction: "What does this word mean?"
    correct_option: pants
    distractors: [shirt, shoes, jacket]
    accepted_answers: [{value: pants, status: correct}]
    feedback: "شلوار means pants."
  fa.a1.unit20.lesson01.exercise03.recognize_shoes:
    instruction: "What does this word mean?"
    correct_option: shoes
    distractors: [shirt, pants, jacket]
    accepted_answers: [{value: shoes, status: correct}]
    feedback: "کفش means shoes."
  fa.a1.unit20.lesson01.exercise04.recognize_jacket:
    instruction: "What does this word mean?"
    correct_option: jacket
    distractors: [shirt, pants, shoes]
    accepted_answers: [{value: jacket, status: correct}]
    feedback: "کت means jacket."
  fa.a1.unit20.lesson01.exercise05.match_clothing_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {پیراهن: shirt, شلوار: pants, کفش: shoes, کت: jacket, قشنگ: nice}, status: correct}
    feedback: "These five words cover the basic clothing vocabulary for this unit."
  fa.a1.unit20.lesson01.exercise06.order_clothing_words:
    instruction: "Arrange the words to say shirt and pants."
    accepted_answers: [{value: [پیراهن, و, شلوار], status: correct}]
    feedback: "پیراهن و شلوار joins the two words with و."
  fa.a1.unit20.lesson01.exercise07.translate_jacket:
    instruction: "Translate into Farsi: jacket."
    accepted_answers:
      - {value: کت, status: correct}
    feedback: "کت means jacket."
  fa.a1.unit20.lesson01.exercise08.write_shoes:
    instruction: "Write the Farsi word for shoes."
    accepted_answers:
      - {value: کفش, status: correct}
    feedback: "کفش means shoes."

  fa.a1.unit20.lesson02.exercise01.recognize_red:
    instruction: "What does this word mean?"
    correct_option: red
    distractors: [blue, black, white]
    accepted_answers: [{value: red, status: correct}]
    feedback: "قرمز means red."
  fa.a1.unit20.lesson02.exercise02.recognize_blue:
    instruction: "What does this word mean?"
    correct_option: blue
    distractors: [red, black, white]
    accepted_answers: [{value: blue, status: correct}]
    feedback: "آبی means blue."
  fa.a1.unit20.lesson02.exercise03.recognize_black:
    instruction: "What does this word mean?"
    correct_option: black
    distractors: [red, blue, white]
    accepted_answers: [{value: black, status: correct}]
    feedback: "سیاه means black."
  fa.a1.unit20.lesson02.exercise04.recognize_white:
    instruction: "What does this word mean?"
    correct_option: white
    distractors: [red, blue, black]
    accepted_answers: [{value: white, status: correct}]
    feedback: "سفید means white."
  fa.a1.unit20.lesson02.exercise05.match_colors:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {رنگ: color, قرمز: red, آبی: blue, سیاه: black, سفید: white, قشنگ: "nice / pretty"}, status: correct}
    feedback: "These words cover color vocabulary for this unit, plus the descriptive word قشنگ (nice/pretty)."
  fa.a1.unit20.lesson02.exercise06.order_colors:
    instruction: "Arrange the words to say red and blue."
    accepted_answers: [{value: [قرمز, و, آبی], status: correct}]
    feedback: "قرمز و آبی joins the two words with و."
  fa.a1.unit20.lesson02.exercise07.translate_black:
    instruction: "Translate into Farsi: black."
    accepted_answers:
      - {value: سیاه, status: correct}
    feedback: "سیاه means black."
  fa.a1.unit20.lesson02.exercise08.write_white:
    instruction: "Write the Farsi word for white."
    accepted_answers:
      - {value: سفید, status: correct}
    feedback: "سفید means white."

  fa.a1.unit20.lesson03.exercise01.recognize_size:
    instruction: "What does this word mean?"
    correct_option: size
    distractors: [big, small, medium]
    accepted_answers: [{value: size, status: correct}]
    feedback: "سایز means size."
  fa.a1.unit20.lesson03.exercise02.recognize_big:
    instruction: "What does this word mean?"
    correct_option: big
    distractors: [size, small, medium]
    accepted_answers: [{value: big, status: correct}]
    feedback: "بزرگ means big."
  fa.a1.unit20.lesson03.exercise03.recognize_small:
    instruction: "What does this word mean?"
    correct_option: small
    distractors: [size, big, medium]
    accepted_answers: [{value: small, status: correct}]
    feedback: "کوچیک means small."
  fa.a1.unit20.lesson03.exercise04.match_sizes:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {سایز: size, بزرگ: big, کوچیک: small, متوسط: medium, پیراهن: shirt, شلوار: pants}, status: correct}
    feedback: "These words cover size vocabulary for this unit, plus two clothing items you might size."
  fa.a1.unit20.lesson03.exercise05.order_size_big:
    instruction: "Arrange the words to say big size."
    accepted_answers: [{value: [سایز, بزرگ], status: correct}]
    feedback: "سایز بزرگ means big size."
  fa.a1.unit20.lesson03.exercise06.translate_medium:
    instruction: "Translate into Farsi: medium."
    accepted_answers:
      - {value: متوسط, status: correct}
    feedback: "متوسط means medium."
  fa.a1.unit20.lesson03.exercise07.write_small:
    instruction: "Write the Farsi word for small."
    accepted_answers:
      - {value: کوچیک, status: correct}
      - {value: کوچک, status: acceptable_with_note, note: "Correct written form; the everyday spoken form taught here is کوچیک."}
    feedback: "کوچیک means small."

  fa.a1.unit20.lesson04.exercise01.recognize_try_on:
    instruction: "What does this mean?"
    correct_option: "Can I try it on?"
    distractors: ["Yes, go ahead.", "How much is this?", "Do you have a discount?"]
    accepted_answers: [{value: "Can I try it on?", status: correct}]
    feedback: "می‌تونم امتحانش کنم؟ means 'Can I try it on?'"
  fa.a1.unit20.lesson04.exercise02.recognize_yes_go_ahead:
    instruction: "What does this mean?"
    correct_option: "Yes, go ahead."
    distractors: ["Can I try it on?", "How much is this?", "I'll pay in cash."]
    accepted_answers: [{value: "Yes, go ahead.", status: correct}]
    feedback: "بله، بفرمایید means 'Yes, go ahead.'"
  fa.a1.unit20.lesson04.exercise03.recognize_try_on_reading:
    instruction: "What does this mean?"
    correct_option: "Can I try it on?"
    distractors: ["Yes, go ahead.", "Do you have a medium size?", "It's 30,000 toman."]
    accepted_answers: [{value: "Can I try it on?", status: correct}]
    feedback: "می‌تونم امتحانش کنم؟ means 'Can I try it on?'"
  fa.a1.unit20.lesson04.exercise04.match_trying_on_phrases:
    instruction: "Match each phrase with its meaning."
    accepted_answers:
      - value:
          "می‌تونم امتحانش کنم؟": "Can I try it on?"
          "بله، بفرمایید.": "Yes, go ahead."
          می‌تونم: "I can"
          بله: "yes"
          کت: jacket
          کفش: shoes
        status: correct
    feedback: "These phrases are used when trying on clothes in a store, plus two more clothing items."
  fa.a1.unit20.lesson04.exercise05.order_try_on:
    instruction: "Arrange the words to ask 'Can I try it on?'"
    accepted_answers: [{value: [می‌تونم, امتحانش, کنم], status: correct}]
    feedback: "می‌تونم امتحانش کنم؟ means 'Can I try it on?'"
  fa.a1.unit20.lesson04.exercise06.translate_yes_go_ahead:
    instruction: "Translate into Farsi: Yes, go ahead."
    accepted_answers:
      - {value: "بله، بفرمایید", status: correct}
      - {value: "بله بفرمایید", status: correct}
    feedback: "بله، بفرمایید means 'Yes, go ahead.'"
  fa.a1.unit20.lesson04.exercise07.speak_try_on:
    instruction: "Say: Can I try it on?"
    accepted_answers:
      - {value: "می‌تونم امتحانش کنم", status: correct}
      - {value: "می‌تونم امتحانش کنم؟", status: correct}
    feedback: "می‌تونم امتحانش کنم؟ means 'Can I try it on?'"

  fa.a1.unit20.lesson05.exercise01.reading_comprehension_size:
    instruction: "Read the label. What size is it?"
    correct_option: Large
    distractors: [Small, Medium, "It isn't stated"]
    accepted_answers: [{value: Large, status: correct}]
    feedback: "The label says سایز: بزرگ -- size: large."
  fa.a1.unit20.lesson05.exercise02.reading_comprehension_color:
    instruction: "Read the label. What color is it?"
    correct_option: Red
    distractors: [Blue, Black, White]
    accepted_answers: [{value: Red, status: correct}]
    feedback: "The label says رنگ: قرمز -- color: red."
  fa.a1.unit20.lesson05.exercise03.match_label_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {سایز: size, بزرگ: big, رنگ: color, قرمز: red, کوچیک: small, متوسط: medium}, status: correct}
    feedback: "These words appear on the clothing label, including the other two sizes."
  fa.a1.unit20.lesson05.exercise04.translate_label:
    instruction: "Translate into English: سایز: بزرگ. رنگ: قرمز."
    answer_language_code: en
    accepted_answers:
      - {value: "Size: large. Color: red.", status: correct}
      - {value: "Size: large, color: red.", status: correct}
      - {value: "Size: big. Color: red.", status: correct}
    feedback: "سایز: بزرگ. رنگ: قرمز. means 'Size: large. Color: red.'"
  fa.a1.unit20.lesson05.exercise05.write_clothing_request:
    instruction: "Write: I want a red shirt, size large."
    accepted_answers:
      - {value: "پیراهن قرمز سایز بزرگ می‌خوام", status: correct}
      - {value: "سایز بزرگ پیراهن قرمز می‌خوام", status: correct}
      - {value: "یه پیراهن قرمز سایز بزرگ می‌خوام", status: correct}
      - {value: "یه پیراهن قرمز می‌خوام سایز بزرگ", status: correct}
      - {value: "پیراهن قرمز می‌خوام سایز بزرگ", status: correct}
    feedback: "پیراهن قرمز سایز بزرگ می‌خوام means 'I want a red shirt, size large.' Adding یه ('a') in front, as in یه پیراهن قرمز, is also correct."

  fa.a1.unit20.lesson06.exercise01.reading_comprehension_what_wanted:
    instruction: "Read the lines. What did Nima ask for?"
    correct_option: "A blue shirt"
    distractors: ["A blue jacket", "A red shirt", "It isn't stated"]
    accepted_answers: [{value: "A blue shirt", status: correct}]
    feedback: "نیما says یه پیراهن آبی می‌خوام -- I want a blue shirt."
  fa.a1.unit20.lesson06.exercise02.reading_comprehension_what_size:
    instruction: "Read the lines. What size did Nima choose?"
    correct_option: Medium
    distractors: [Small, Large, "It isn't stated"]
    accepted_answers: [{value: Medium, status: correct}]
    feedback: "نیما says سایز متوسط -- medium size."
  fa.a1.unit20.lesson06.exercise03.match_dialogue_facts:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value:
          نیما: Nima
          فروشنده: shopkeeper
          پیراهن: shirt
          آبی: blue
          "سایز متوسط": "medium size"
          قشنگه: "it's nice"
          "سی هزار تومنه": "It's 30,000 toman."
        status: correct
    feedback: "These are the key facts from the store dialogue."
  fa.a1.unit20.lesson06.exercise04.order_final_payment:
    instruction: "Arrange the words: Okay, I'll pay in cash."
    accepted_answers: [{value: [باشه, نقدی, حساب, می‌کنم], status: correct}]
    feedback: "باشه، نقدی حساب می‌کنم means 'Okay, I'll pay in cash.'"
  fa.a1.unit20.lesson06.exercise05.dialogue_response_size:
    instruction: "The shopkeeper asks your size. Respond: Medium size."
    accepted_answers:
      - {value: "سایز متوسط", status: correct}
    feedback: "سایز متوسط means 'medium size.'"
  fa.a1.unit20.lesson06.exercise06.write_own_clothing_request:
    instruction: "Write: I want a blue shirt, size medium."
    accepted_answers:
      - {value: "پیراهن آبی سایز متوسط می‌خوام", status: correct}
      - {value: "سایز متوسط پیراهن آبی می‌خوام", status: correct}
      - {value: "یه پیراهن آبی سایز متوسط می‌خوام", status: correct}
      - {value: "یه پیراهن آبی می‌خوام سایز متوسط", status: correct}
      - {value: "پیراهن آبی می‌خوام سایز متوسط", status: correct}
    feedback: "پیراهن آبی سایز متوسط می‌خوام means 'I want a blue shirt, size medium.' Adding یه ('a'), as Nima does in the store (یه پیراهن آبی می‌خوام), is also correct."
