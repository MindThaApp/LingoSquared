  fa.b1.unit04.lesson06.teach.grammar_review:
    title: "I agree. Do you agree? He/she agrees. I disagree because I think that remote work is hard."
    gloss: "I agree. Do you agree? He/she agrees. I disagree because I think that remote work is hard."
    note: "Review: agreement/disagreement is marked by a short 'to be' ending attached directly to *موافق*/*مخالف* (no separate verb word), and a reason is added with *چون* (because) plus an optional که-clause reporting your thought (*فکر می‌کنم که...*)."
