    gloss: Nargess
    example_gloss: "Does Nargess agree?"
  fa.b1.unit04.lesson02.teach.grammar_agreement_paradigm:
    title: "I agree. Do you agree? He/she agrees. We agree. Do you (pl.) agree? They agree."
    gloss: "I agree. Do you agree? He/she agrees. We agree. Do you (pl.) agree? They agree."
    note: "All six persons of *موافق* + suffix: *موافقم/موافقی/موافقه/موافقیم/موافقید/موافقن*. These endings (*-م، -ی، -ه، -یم، -ید، -ن*) are the short spoken forms of 'to be', not possessive suffixes, even though *-م* happens to look like the 'my' ending on nouns. Once you know them, you can attach them to almost any adjective to mean 'I am / you are ADJ.'"

  fa.b1.unit04.lesson03.teach.mokhalefam:
    title: "I disagree"
    gloss: "I disagree"
    example_gloss: "I disagree."
  fa.b1.unit04.lesson03.teach.mokhalefe:
