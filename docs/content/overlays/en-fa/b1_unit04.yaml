course:
  title: Farsi B1
  description: >-
    Intermediate Iranian Farsi: stating agreement or disagreement with an
    opinion and giving a reason, using a short "to be" ending attached
    directly to a predicate adjective (موافق/مخالف) plus a که ("that")
    subordinate clause, across an everyday workplace debate.

units:
  fa.b1.unit04.debate:
    title: "Agree or Disagree?"
    description: State whether you agree or disagree with someone else's opinion and give a reason, using a predicate adjective with a short 'to be' ending, plus a that-clause.

