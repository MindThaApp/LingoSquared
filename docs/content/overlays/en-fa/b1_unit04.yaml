  fa.b1.unit04.lesson01.teach.movafeqam:
    title: "I agree"
    gloss: "I agree"
    note: "*موافقم* is the adjective *موافق* (agreeing) with the short 'to be' ending *-م* ('I am') attached directly -- there is no separate verb word. English needs a full verb ('I agree'); Persian just needs the adjective plus the right ending."
    example_gloss: "In my opinion, remote work is good. I agree."
  fa.b1.unit04.lesson01.teach.movafeqi:
    title: "you agree"
    gloss: "you agree"
    note: "Same pattern with the ending *-ی* ('you are')."
    example_gloss: "Do you agree too?"
  fa.b1.unit04.lesson01.teach.grammar_movafeq_suffix:
    title: "In my opinion, remote work is good. I agree. Do you agree?"
    gloss: "In my opinion, remote work is good. I agree. Do you agree?"
    note: "*موافق* (agreeing) takes a short 'to be' ENDING directly, with no separate verb word: *موافق* + *-م* = *موافقم* (I agree), *موافق* + *-ی* = *موافقی* (you agree). This is a different mechanism from *باید* (Unit 1, an invariant particle) and *می‌تونم* (Unit 2, a fully-conjugating verb) -- here the adjective plus its ending is already a complete sentence."
  fa.b1.unit04.lesson02.teach.movafeqe:
    title: "he/she agrees"
    gloss: "he/she agrees"
    example_gloss: "Reza agrees."
  fa.b1.unit04.lesson02.teach.movafeqim:
    title: "we agree"
    gloss: "we agree"
    example_gloss: "We agree."
  fa.b1.unit04.lesson02.teach.movafeqid:
    title: "you (pl.) agree"
