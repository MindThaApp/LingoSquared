  fa.b1.unit04.lesson03.teach.grammar_disagree_reason:
    title: "I disagree because I think that remote work is hard."
    gloss: "I disagree because I think that remote work is hard."
    note: "Combine the suffixed predicate adjective (*مخالفم*), a reason clause with *چون* (because), and a که-clause reporting the reason itself (*فکر می‌کنم که...*) -- three pieces stacked into one coherent opinion statement, real B1 sentence-building."

  fa.b1.unit04.lesson04.teach.na:
