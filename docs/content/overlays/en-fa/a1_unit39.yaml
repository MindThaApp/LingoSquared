course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: naming the three emergency services (police,
    ambulance, fire department), saying what is needed, asking for help
    with polite commands, a dialogue placing an emergency phone call, and
    reading a short emergency notice.

units:
  fa.a1.unit39.emergencies:
    title: Emergencies

lessons:
  fa.a1.unit39.lesson01.new_emergencies_one: {title: "New emergency words 1"}
  fa.a1.unit39.lesson02.new_emergencies_two: {title: "New emergency words 2"}
  fa.a1.unit39.lesson03.asking_for_help: {title: "Asking for help"}
  fa.a1.unit39.lesson04.emergency_call: {title: "Emergency phone call"}
  fa.a1.unit39.lesson05.reading_emergency_notice: {title: "Reading an emergency notice"}
  fa.a1.unit39.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit39.lesson01.teach.review_komak:
    title: "Review: help"
    gloss: help
    note: "*کمک* ('help') was introduced earlier."
  fa.a1.unit39.lesson01.teach.lazame:
    title: Needed
    gloss: "is needed"
    note: "*لازمه* is a single word meaning 'is needed,' built the same way as *قشنگه* ('is pretty') and *گرمه* ('is hot')."
    example_gloss: "Help is needed!"
  fa.a1.unit39.lesson01.teach.polis:
    title: Police
    gloss: police
    note: "*پلیس* means 'police,' a loanword used in everyday speech."
    example_gloss: "Police are needed!"
  fa.a1.unit39.lesson01.teach.ambulance:
    title: Ambulance
    gloss: ambulance
    note: "*آمبولانس* means 'ambulance.'"
    example_gloss: "An ambulance is needed!"

  fa.a1.unit39.lesson02.teach.atashneshani:
    title: "Fire department"
    gloss: "fire department"
    note: "*آتش‌نشانی* means 'fire department' or 'fire brigade.'"
    example_gloss: "The fire department is needed!"
  fa.a1.unit39.lesson02.teach.atash:
    title: Fire
    gloss: fire
    note: "*آتش* means 'fire,' the root of *آتش‌نشانی* ('fire department')."
    example_gloss: "Fire! The fire department is needed!"
  fa.a1.unit39.lesson02.teach.khatar:
    title: Danger
    gloss: danger
    note: "*خطر* means 'danger.'"
    example_gloss: "Danger! Police are needed!"

  fa.a1.unit39.lesson03.teach.review_ken_konid:
    title: "Review: formal and informal commands"
    gloss: "do! (formal) / do! (informal)"
    note: "*کنید* is the formal or plural command ending. The informal *کن*, which you used with friends in *استراحت کن* ('rest!'), is the version for one person you know well."
  fa.a1.unit39.lesson03.teach.komak_konid:
    title: "Help!"
    gloss: "Help!"
    note: "*کمک کنید!* is the polite way to call for help, suited to strangers and emergency responders."
  fa.a1.unit39.lesson03.teach.tasadof:
    title: Accident
    gloss: accident
    note: "*تصادف* means 'accident.'"
    example_gloss: "Accident! Help!"
  fa.a1.unit39.lesson03.teach.orjans:
    title: Emergency
    gloss: emergency
    note: "*اورژانس* means 'emergency,' the same word used for a hospital's emergency department."
    example_gloss: "It's an emergency! Help!"

  fa.a1.unit39.lesson04.teach.review_alo_bashe_mamnoon:
    title: "Review: hello / okay / thanks"
    gloss: "hello (on the phone) / okay / thanks"
    note: "*الو*, *باشه* and *ممنون* were introduced earlier."
  fa.a1.unit39.lesson04.teach.review_miad:
    title: "Is coming"
    gloss: "is coming"
    note: "*میاد* ('he/she/it is coming') follows the same personal-ending pattern as *میام* ('I'm coming'), which you learned earlier."
  fa.a1.unit39.lesson04.teach.zud_biayid:
    title: "Come quickly!"
    gloss: "Come quickly!"
    note: "*زود* means 'quickly'; *بیایید* is the polite command 'come!'"
  fa.a1.unit39.lesson04.teach.zang_bezanid:
    title: "Call!"
    gloss: "Call!"
    note: "*زنگ بزنید!* is the polite command from *زنگ زدن* ('to call'), which you learned earlier."
  fa.a1.unit39.lesson04.teach.dialogue_line1:
    title: "Nima: Hello! Help! Police are needed!"
    gloss: "Hello! Help! Police are needed!"
  fa.a1.unit39.lesson04.teach.dialogue_line2:
    title: "Sara: Okay. Police are coming."
    gloss: "Okay. Police are coming."
  fa.a1.unit39.lesson04.teach.dialogue_line3:
    title: "Nima: Thanks! Come quickly!"
    gloss: "Thanks! Come quickly!"
  fa.a1.unit39.lesson04.teach.dialogue_line4:
    title: "Sara: Okay!"
    gloss: "Okay!"

  fa.a1.unit39.lesson05.teach.reading_note:
    title: "About this notice"
    gloss: "Accident / danger / fire"
    note: "In the notice, each kind of emergency is followed by a question mark, as if asking 'In case of an accident?'. The service to call comes right after it."
  fa.a1.unit39.lesson05.teach.reading_text:
    title: "Reading: Emergency notice"
    gloss: "Accident? An ambulance is needed! Danger? Police are needed! Fire? The fire department is needed! Call quickly!"
    note: "A short notice naming which service to call for each type of emergency."

  fa.a1.unit39.lesson06.teach.review_polis_komak:
    title: "Police are needed! Help!"
    gloss: "Police are needed! Help!"
    note: "A review sentence made only of words from this unit."
  fa.a1.unit39.lesson06.teach.review_orjans_biayid:
    title: "It's an emergency! Come quickly!"
    gloss: "It's an emergency! Come quickly!"
  fa.a1.unit39.lesson06.teach.summary_services:
    title: "Police / ambulance / fire department"
    gloss: "police / ambulance / fire department"
    note: "These are the three emergency services from this unit."

