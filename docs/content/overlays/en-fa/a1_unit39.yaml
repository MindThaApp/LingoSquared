course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: naming the three emergency services (police,
    ambulance, fire department), the fused "is needed" construction, asking
    for help with a formal imperative, a dialogue placing an emergency
    phone call, and reading a short emergency notice.

units:
  fa.a1.unit39.emergencies:
    title: Emergencies

lessons:
  fa.a1.unit39.lesson01.new_emergencies_one: {title: "New emergency words 1"}
  fa.a1.unit39.lesson02.new_emergencies_two: {title: "New emergency words 2"}
  fa.a1.unit39.lesson03.asking_for_help: {title: "Asking for help"}
  fa.a1.unit39.lesson04.emergency_call: {title: "Emergency phone call"}
  fa.a1.unit39.lesson05.reading_emergency_notice: {title: "Reading an emergency notice"}
  fa.a1.unit39.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit39.lesson01.teach.review_komak:
    title: "Review: help"
    gloss: help
    note: "*کمک* ('help') was already taught in unit17's health lesson."
  fa.a1.unit39.lesson01.teach.lazame:
    title: Needed
    gloss: "is needed"
    note: "*لازمه* is a fused predicate ('is needed'), built the same way as *قشنگه* ('is pretty', unit20) and *گرمه* ('is hot', unit07)."
    example_gloss: "Help is needed!"
  fa.a1.unit39.lesson01.teach.polis:
    title: Police
    gloss: police
    note: "*پلیس* means 'police,' a borrowed word used the same way in colloquial Farsi."
    example_gloss: "Police is needed!"
  fa.a1.unit39.lesson01.teach.ambulance:
    title: Ambulance
    gloss: ambulance
    note: "*آمبولانس* means 'ambulance.'"
    example_gloss: "Ambulance is needed!"

  fa.a1.unit39.lesson02.teach.atashneshani:
    title: "Fire department"
    gloss: "fire department"
    note: "*آتش‌نشانی* means 'fire department' or 'fire brigade.'"
    example_gloss: "Fire department is needed!"
  fa.a1.unit39.lesson02.teach.atash:
    title: Fire
    gloss: fire
    note: "*آتش* means 'fire,' the root of *آتش‌نشانی* ('fire department')."
    example_gloss: "Fire! Fire department is needed!"
  fa.a1.unit39.lesson02.teach.khatar:
    title: Danger
    gloss: danger
    note: "*خطر* means 'danger.'"
    example_gloss: "Danger! Police is needed!"

  fa.a1.unit39.lesson03.teach.review_ken_konid:
    title: "Review: formal vs. informal 'you do'"
    gloss: "you do (formal) / you do (informal)"
    note: "*کنید* is the formal/plural imperative ending, contrasted with the informal *کن* already taught in unit17's 'استراحت کن' ('rest!')."
  fa.a1.unit39.lesson03.teach.komak_konid:
    title: "Help!"
    gloss: "Help!"
    note: "*کمک کنید!* is the formal way to shout for help, appropriate when addressing strangers or responders."
  fa.a1.unit39.lesson03.teach.tasadof:
    title: Accident
    gloss: accident
    note: "*تصادف* means 'accident.'"
    example_gloss: "Accident! Help!"
  fa.a1.unit39.lesson03.teach.orjans:
    title: Emergency
    gloss: emergency
    note: "*اورژانس* means 'emergency,' the same word used for a hospital's emergency department."
    example_gloss: "It's an emergency! Help!"

  fa.a1.unit39.lesson04.teach.review_alo_bashe_mamnoon:
    title: "Review: hello / okay / thanks"
    gloss: "hello (on the phone) / okay / thanks"
    note: "*الو* and *باشه* were already taught in unit22's phone lesson; *ممنون* was already taught in unit17."
  fa.a1.unit39.lesson04.teach.review_miad:
    title: "Is coming"
    gloss: "is coming"
    note: "*میاد* ('he/she/it is coming') follows the same personal-ending pattern as *میام* ('I'm coming'), already taught in unit22."
  fa.a1.unit39.lesson04.teach.zud_biayid:
    title: "Come quickly!"
    gloss: "Come quickly!"
    note: "*زود* means 'quickly'; *بیایید* is the formal imperative 'come!'"
  fa.a1.unit39.lesson04.teach.zang_bezanid:
    title: "Call!"
    gloss: "Call!"
    note: "*زنگ بزنید!* is the formal imperative of *زنگ زدن* ('to call'), already taught in unit22."
  fa.a1.unit39.lesson04.teach.dialogue_line1:
    title: "Nima: Hello! Help! Police is needed!"
    gloss: "Hello! Help! Police is needed!"
  fa.a1.unit39.lesson04.teach.dialogue_line2:
    title: "Sara: Okay. Police is coming."
    gloss: "Okay. Police is coming."
  fa.a1.unit39.lesson04.teach.dialogue_line3:
    title: "Nima: Thanks! Come quickly!"
    gloss: "Thanks! Come quickly!"
  fa.a1.unit39.lesson04.teach.dialogue_line4:
    title: "Sara: Okay!"
    gloss: "Okay!"

  fa.a1.unit39.lesson05.teach.reading_note:
    title: "About this notice"
    gloss: "This notice shows three types of emergency with a question mark: accident, danger, fire."
    note: "The reading maps each emergency type to the service that's needed for it."
  fa.a1.unit39.lesson05.teach.reading_text:
    title: "Reading: Emergency notice"
    gloss: "Accident? Ambulance is needed! Danger? Police is needed! Fire? Fire department is needed! Call quickly!"
    note: "A short notice naming which service to call for each type of emergency."

  fa.a1.unit39.lesson06.teach.review_polis_komak:
    title: "Police is needed! Help!"
    gloss: "Police is needed! Help!"
    note: "A full review sentence reusing only already-known words from this unit."
  fa.a1.unit39.lesson06.teach.review_orjans_biayid:
    title: "It's an emergency! Come quickly!"
    gloss: "It's an emergency! Come quickly!"
  fa.a1.unit39.lesson06.teach.summary_services:
    title: "Police / ambulance / fire department"
    gloss: "police / ambulance / fire department"
    note: "These are the three emergency services taught in this unit."

exercises:
  fa.a1.unit39.lesson01.exercise01.recognize_lazame:
    instruction: "What does this word mean?"
    correct_option: "is needed"
    distractors: ["is wanted", "is forbidden", "is free"]
    accepted_answers: [{value: "is needed", status: correct}]
    feedback: "لازمه means 'is needed.'"
  fa.a1.unit39.lesson01.exercise02.recognize_polis:
    instruction: "What does this word mean?"
    correct_option: police
    distractors: [ambulance, "fire department", doctor]
    accepted_answers: [{value: police, status: correct}]
    feedback: "پلیس means police."
  fa.a1.unit39.lesson01.exercise03.match_emergencies_one:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {لازمه: "is needed", پلیس: police, آمبولانس: ambulance, "کمک لازمه!": "Help is needed!", "پلیس لازمه!": "Police is needed!", "آمبولانس لازمه!": "Ambulance is needed!"}
        status: correct
    feedback: "These are the first new emergency words for this unit, plus the fused 'is needed' predicate."
  fa.a1.unit39.lesson01.exercise04.word_order_ambolans_lazame:
    instruction: "Put the words in order."
    accepted_answers: [{value: [آمبولانس, لازمه], status: correct}]
    feedback: "آمبولانس لازمه means 'Ambulance is needed!'"
  fa.a1.unit39.lesson01.exercise05.translate_polis_lazame:
    instruction: "Translate into English: پلیس لازمه."
    answer_language_code: en
    accepted_answers:
      - {value: "Police is needed", status: correct}
      - {value: "Police is needed.", status: correct}
      - {value: "The police is needed", status: correct}
      - {value: "The police is needed.", status: correct}
    feedback: "پلیس لازمه means 'Police is needed.'"

  fa.a1.unit39.lesson02.exercise01.recognize_atashneshani:
    instruction: "What does this word mean?"
    correct_option: "fire department"
    distractors: [police, ambulance, hospital]
    accepted_answers:
      - {value: "fire department", status: correct}
      - {value: "fire brigade", status: correct}
    feedback: "آتش‌نشانی means 'fire department' (fire brigade)."
  fa.a1.unit39.lesson02.exercise02.recognize_atash:
    instruction: "What does this word mean?"
    correct_option: fire
    distractors: [water, smoke, danger]
    accepted_answers: [{value: fire, status: correct}]
    feedback: "آتش means fire."
  fa.a1.unit39.lesson02.exercise03.match_emergencies_two:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"آتش‌نشانی": "fire department", آتش: fire, خطر: danger, "آتش! آتش‌نشانی لازمه!": "Fire! Fire department is needed!", "خطر! پلیس لازمه!": "Danger! Police is needed!", لازمه: "is needed"}
        status: correct
    feedback: "These are the last new emergency words for this unit, plus a review of لازمه."
  fa.a1.unit39.lesson02.exercise04.word_order_khatar_polis_lazame:
    instruction: "Put the words in order."
    accepted_answers: [{value: [خطر, پلیس, لازمه], status: correct}]
    feedback: "خطر پلیس لازمه means 'Danger! Police is needed!'"
  fa.a1.unit39.lesson02.exercise05.translate_atash_atashneshani:
    instruction: "Translate into English: آتش! آتش‌نشانی لازمه."
    answer_language_code: en
    accepted_answers:
      - {value: "Fire! Fire department is needed", status: correct}
      - {value: "Fire! Fire department is needed.", status: correct}
      - {value: "Fire, fire department is needed", status: correct}
      - {value: "Fire, fire department is needed.", status: correct}
    feedback: "آتش! آتش‌نشانی لازمه means 'Fire! Fire department is needed.'"

  fa.a1.unit39.lesson03.exercise01.recognize_komak_konid:
    instruction: "What does this phrase mean?"
    correct_option: "Help!"
    distractors: ["Wait!", "Come here!", "Call me!"]
    accepted_answers: [{value: "Help!", status: correct}]
    feedback: "کمک کنید means 'Help!' (formal)."
  fa.a1.unit39.lesson03.exercise02.recognize_tasadof:
    instruction: "What does this word mean?"
    correct_option: accident
    distractors: [danger, fire, emergency]
    accepted_answers: [{value: accident, status: correct}]
    feedback: "تصادف means accident."
  fa.a1.unit39.lesson03.exercise03.match_help_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"کمک کنید!": "Help!", تصادف: accident, اورژانس: emergency, "تصادف! کمک کنید!": "Accident! Help!", "اورژانسه!": "It's an emergency!", کنید: "you do (formal)"}
        status: correct
    feedback: "These words let you ask for help in an emergency."
  fa.a1.unit39.lesson03.exercise04.word_order_tasadof_komak_konid:
    instruction: "Put the words in order."
    accepted_answers: [{value: [تصادف, کمک, کنید], status: correct}]
    feedback: "تصادف! کمک کنید! means 'Accident! Help!'"
  fa.a1.unit39.lesson03.exercise05.translate_orjanse_komak_konid:
    instruction: "Translate into English: اورژانسه! کمک کنید."
    answer_language_code: en
    accepted_answers:
      - {value: "It's an emergency! Help!", status: correct}
      - {value: "It's an emergency, help!", status: correct}
      - {value: "It's an emergency. Help!", status: correct}
    feedback: "اورژانسه! کمک کنید means 'It's an emergency! Help!'"

  fa.a1.unit39.lesson04.exercise01.dialogue_comprehension_emergency:
    instruction: "Nima says this on the phone. What does he need?"
    correct_option: "He needs the police."
    distractors:
      - "He needs an ambulance."
      - "He needs the fire department."
      - "He needs a doctor."
    accepted_answers: [{value: "He needs the police.", status: correct}]
    feedback: "کمک کنید! پلیس لازمه! means 'Help! Police is needed!'"
  fa.a1.unit39.lesson04.exercise02.recognize_polis_miad:
    instruction: "What does this sentence mean?"
    correct_option: "The police is coming."
    distractors:
      - "The police is here."
      - "The police was needed."
      - "The ambulance is coming."
    accepted_answers: [{value: "The police is coming.", status: correct}]
    feedback: "پلیس میاد means 'The police is coming.'"
  fa.a1.unit39.lesson04.exercise03.match_dialogue_emergency_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {الو: "hello (on the phone)", "کمک کنید!": "Help!", پلیس: police, لازمه: "is needed", میاد: "is coming", زود: quickly, بیایید: "come!"}
        status: correct
    feedback: "These words appear in the emergency phone call dialogue."
  fa.a1.unit39.lesson04.exercise04.dialogue_response_confirm_police:
    instruction: "Respond to الو! کمک کنید! پلیس لازمه! by confirming okay, the police is coming."
    accepted_answers:
      - {value: "باشه. پلیس میاد.", status: correct}
      - {value: "باشه پلیس میاد", status: correct}
      - {value: "باشه، پلیس میاد.", status: correct}
    feedback: "باشه. پلیس میاد. means 'Okay. Police is coming.'"
  fa.a1.unit39.lesson04.exercise05.translate_mamnoon_zud_biayid:
    instruction: "Translate into English: ممنون! زود بیایید!"
    answer_language_code: en
    accepted_answers:
      - {value: "Thanks! Come quickly!", status: correct}
      - {value: "Thank you! Come quickly!", status: correct}
      - {value: "Thanks, come quickly!", status: correct}
      - {value: "Thanks. Come quickly!", status: correct}
    feedback: "ممنون! زود بیایید! means 'Thanks! Come quickly!'"

  fa.a1.unit39.lesson05.exercise01.reading_comprehension_fire_service:
    instruction: "According to the notice, what's needed for a fire?"
    correct_option: "The fire department is needed."
    distractors:
      - "The police is needed."
      - "The ambulance is needed."
      - "The notice doesn't mention fire."
    accepted_answers: [{value: "The fire department is needed.", status: correct}]
    feedback: "آتش؟ آتش‌نشانی لازمه!"
  fa.a1.unit39.lesson05.exercise02.reading_comprehension_what_to_do:
    instruction: "What does the notice say to do?"
    correct_option: "Call quickly."
    distractors:
      - "Wait for help."
      - "Go to the hospital."
      - "Call slowly."
    accepted_answers: [{value: "Call quickly.", status: correct}]
    feedback: "زود زنگ بزنید!"
  fa.a1.unit39.lesson05.exercise03.match_reading_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {تصادف: accident, آمبولانس: ambulance, خطر: danger, پلیس: police, آتش: fire, "آتش‌نشانی": "fire department", "زنگ بزنید!": "Call!"}
        status: correct
    feedback: "These words let you understand the emergency notice."
  fa.a1.unit39.lesson05.exercise04.translate_khatar_polis_lazame:
    instruction: "Translate into English: خطر؟ پلیس لازمه!"
    answer_language_code: en
    accepted_answers:
      - {value: "Danger? Police is needed", status: correct}
      - {value: "Danger? Police is needed!", status: correct}
      - {value: "Danger? The police is needed", status: correct}
      - {value: "Danger? The police is needed!", status: correct}
    feedback: "خطر؟ پلیس لازمه! means 'Danger? Police is needed!'"
  fa.a1.unit39.lesson05.exercise05.write_emergency_notice_line:
    instruction: "Write a short sentence saying what's needed for one type of emergency, using the notice's pattern."
    accepted_answers:
      - {value: "آتش؟ آتش‌نشانی لازمه!", status: correct}
      - {value: "آتش؟ آتش‌نشانی لازمه", status: correct}
      - {value: "تصادف؟ آمبولانس لازمه!", status: correct}
      - {value: "تصادف؟ آمبولانس لازمه", status: correct}
      - {value: "خطر؟ پلیس لازمه!", status: correct}
      - {value: "خطر؟ پلیس لازمه", status: correct}
    feedback: "A notice line can name the emergency type and the service needed for it, e.g. آتش؟ آتش‌نشانی لازمه!"

  fa.a1.unit39.lesson06.exercise01.recognize_polis_komak:
    instruction: "What does this sentence mean?"
    correct_option: "Police is needed! Help!"
    distractors:
      - "Ambulance is needed! Help!"
      - "Police is here! Thanks!"
      - "Police is needed! Wait!"
    accepted_answers: [{value: "Police is needed! Help!", status: correct}]
    feedback: "پلیس لازمه! کمک کنید! means 'Police is needed! Help!'"
  fa.a1.unit39.lesson06.exercise02.recognize_orjans_biayid:
    instruction: "What does this sentence mean?"
    correct_option: "It's an emergency! Come quickly!"
    distractors:
      - "It's an accident! Come quickly!"
      - "It's an emergency! Wait here!"
      - "It's dangerous! Come quickly!"
    accepted_answers: [{value: "It's an emergency! Come quickly!", status: correct}]
    feedback: "اورژانسه! زود بیایید! means 'It's an emergency! Come quickly!'"
  fa.a1.unit39.lesson06.exercise03.match_wrap_emergencies:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {پلیس: police, آمبولانس: ambulance, "آتش‌نشانی": "fire department", خطر: danger, تصادف: accident, لازمه: "is needed", کمک: help}
        status: correct
    feedback: "This reviews all three emergency services from this unit, plus the fused 'is needed' predicate."
  fa.a1.unit39.lesson06.exercise04.word_order_polis_lazame_komak_konid:
    instruction: "Put the words in order."
    accepted_answers: [{value: [پلیس, لازمه, کمک, کنید], status: correct}]
    feedback: "پلیس لازمه! کمک کنید! means 'Police is needed! Help!'"
  fa.a1.unit39.lesson06.exercise05.write_help_needed_sentence:
    instruction: "Write a short sentence saying what kind of emergency help is needed."
    accepted_answers:
      - {value: "پلیس لازمه", status: correct}
      - {value: "پلیس لازمه!", status: correct}
      - {value: "آمبولانس لازمه", status: correct}
      - {value: "آمبولانس لازمه!", status: correct}
      - {value: "آتش‌نشانی لازمه", status: correct}
      - {value: "آتش‌نشانی لازمه!", status: correct}
      - {value: "کمک کنید", status: correct}
      - {value: "کمک کنید!", status: correct}
    feedback: "A wrap-up sentence can name the service needed using ___ لازمه, or ask for help with کمک کنید."
