course:
  title: "Farsi A1"
  description: >-
    Beginner Iranian Persian: days of the week, the Iranian solar
    calendar's month names, asking and giving today's date, asking
    about a future date, and arranging a meeting date in conversation.

units:
  fa.a1.unit10.dates:
    title: "Days and dates"

lessons:
  fa.a1.unit10.lesson01.days_of_the_week: {title: "Days of the week"}
  fa.a1.unit10.lesson02.months: {title: "Months of the year"}
  fa.a1.unit10.lesson03.asking_todays_date: {title: "Asking today's date"}
  fa.a1.unit10.lesson04.giving_a_date: {title: "Giving a date"}
  fa.a1.unit10.lesson05.asking_about_a_future_date: {title: "Asking about a future date"}
  fa.a1.unit10.lesson06.meeting_date_dialogue: {title: "Arranging a meeting date"}

teaching:
  fa.a1.unit10.lesson01.teach.shanbe_yekshanbe:
    title: "Saturday, Sunday"
    gloss: "Saturday, Sunday"
    note: "شنبه and یکشنبه are the first two days of the Iranian week, which starts on Saturday."
    example_gloss: ["Today is Saturday.", "Tomorrow is Sunday."]
  fa.a1.unit10.lesson01.teach.doshanbe_seshanbe:
    title: "Monday, Tuesday"
    gloss: "Monday, Tuesday"
    note: "دوشنبه and سه‌شنبه follow شنبه and یکشنبه."
    example_gloss: ["I have class on Monday.", "I have an appointment on Tuesday."]
  fa.a1.unit10.lesson01.teach.chaharshanbe_panjshanbe:
    title: "Wednesday, Thursday"
    gloss: "Wednesday, Thursday"
    note: "چهارشنبه and پنجشنبه are the middle-to-late days of the week."
    example_gloss: ["I work on Wednesday.", "I'll see you on Thursday."]
  fa.a1.unit10.lesson01.teach.jome:
    title: "Friday"
    gloss: "Friday"
    note: "جمعه is the last day of the week and the traditional weekly day off in Iran."
    example_gloss: "Friday is a holiday."
  fa.a1.unit10.lesson01.teach.weekend_note:
    title: "The weekly day off"
    gloss: "Friday is the weekly day off."
    note: "جمعه (Friday) is Iran's traditional weekly rest day, though some modern workplaces now also close Thursday afternoon."

  fa.a1.unit10.lesson02.teach.farvardin:
    title: "Farvardin (1st month)"
    gloss: "Farvardin, the first month of the Iranian solar year"
    note: "فروردین begins the Iranian solar year, roughly late March (around the spring equinox/Nowruz)."
    example_gloss: "Farvardin is the first month of the year."
  fa.a1.unit10.lesson02.teach.ordibehesht:
    title: "Ordibehesht (2nd month)"
    gloss: "Ordibehesht, the second month"
    note: "اردیبهشت follows فروردین, roughly April-May."
    example_gloss: "The weather is nice in Ordibehesht."
  fa.a1.unit10.lesson02.teach.khordad:
    title: "Khordad (3rd month)"
    gloss: "Khordad, the third month"
    note: "خرداد follows اردیبهشت, roughly May-June."
    example_gloss: "I was born in Khordad."
  fa.a1.unit10.lesson02.teach.calendar_note:
    title: "The Iranian solar calendar"
    gloss: "Iran uses the Solar Hijri (Persian) calendar."
    note: "*ایران از تقویم هجری شمسی استفاده می‌کنه* states that Iran uses this calendar system for everyday dates -- the same calendar system Afghanistan uses, but with different Persian-origin month names rather than Afghanistan's Arabic-derived ones."

  fa.a1.unit10.lesson03.teach.what_day_today:
    title: "What day is today?"
    gloss: "What day is today?"
    note: "امروز چندشنبه‌ست؟ literally asks 'today, which day-of-week is it?' -- the colloquial -e contraction of چندشنبه است."
  fa.a1.unit10.lesson03.teach.today_word:
    title: "Today"
    gloss: "today"
    note: "امروز means today."
    example_gloss: "What's the date today?"

  fa.a1.unit10.lesson04.teach.give_full_date:
    title: "Today is Thursday, the 10th of Ordibehesht."
    gloss: "Today is Thursday, the 10th of Ordibehesht."
    note: "امروز پنجشنبه، دهم اردیبهشته combines the day name, ordinal date, and month name in one sentence, using the colloquial -e contraction (اردیبهشته = اردیبهشت است)."
  fa.a1.unit10.lesson04.teach.tarikh_word:
    title: "Date"
    gloss: "date"
    note: "*تاریخ* means 'date' -- the general word for a calendar date, as in *تاریخ جلسه* (the meeting's date)."
    example_gloss: "What is today's date?"

  fa.a1.unit10.lesson05.teach.which_day_meeting:
    title: "What day is the meeting?"
    gloss: "What day is the meeting?"
    note: "جلسه کدوم روزه؟ asks which day of the week an event will be."
  fa.a1.unit10.lesson05.teach.which_date:
    title: "What date is Tuesday in Ordibehesht?"
    gloss: "What date is Tuesday in Ordibehesht?"
    note: "سه‌شنبه چندم اردیبهشته؟ asks for the specific numeric date of a named day."

  fa.a1.unit10.lesson06.teach.hashtom:
    title: "8th"
    gloss: "8th"
    note: "*هشتم* means the 8th (of the month)."
    example_gloss: "Today is the 8th."
  fa.a1.unit10.lesson06.teach.turn01:
    title: "Reza, what day is the meeting?"
    gloss: "Reza, what day is the meeting?"
    note: "Maryam opens by asking Reza directly, using his name."
  fa.a1.unit10.lesson06.teach.turn02:
    title: "I think it's Tuesday."
    gloss: "I think it's Tuesday."
    note: "فکر کنم (I think) softens Reza's answer as not fully certain."
  fa.a1.unit10.lesson06.teach.turn03:
    title: "What date is Tuesday in Ordibehesht?"
    gloss: "What date is Tuesday in Ordibehesht?"
    note: "Maryam follows up asking for the specific numeric date."
  fa.a1.unit10.lesson06.teach.turn04:
    title: "Tuesday is the 8th of Ordibehesht."
    gloss: "Tuesday is the 8th of Ordibehesht."
    note: "Reza gives the specific date."
  fa.a1.unit10.lesson06.teach.turn05:
    title: "Okay, good. How about Friday, do you have time?"
    gloss: "Okay, good. How about Friday, do you have time?"
    note: "Maryam confirms the date and then asks about a different day."
  fa.a1.unit10.lesson06.teach.turn06:
    title: "No, I'm busy on Friday."
    gloss: "No, I'm busy on Friday."
    note: "سرم شلوغه (literally 'my head is busy/crowded') is the natural Iranian colloquial way to say you're busy."
  fa.a1.unit10.lesson06.teach.turn07:
    title: "No problem, I'll see you Tuesday."
    gloss: "No problem, I'll see you Tuesday."
    note: "مشکلی نیست (no problem) politely accepts Reza's decline, and می‌بینمت means 'I'll see you' -- confirming Tuesday as the meeting day, consistent with turns 02 and 04."
  fa.a1.unit10.lesson06.teach.va_and:
    title: "And"
    gloss: "and"
    note: "*و* means 'and'. It can join two days, as in *دوشنبه و سه‌شنبه*, or two related questions, as in *جلسه کدوم روزه و چندم اردیبهشته؟*"
    example_gloss: "I have class on Monday and Tuesday."

exercises:
  fa.a1.unit10.lesson01.exercise01.recognize_shanbe:
    instruction: "What does this word mean?"
    correct_option: "Saturday"
    distractors: ["Sunday", "Monday", "Friday"]
    accepted_answers: [{value: "Saturday", status: correct}]
    feedback: "شنبه means Saturday, the first day of the Iranian week."
  fa.a1.unit10.lesson01.exercise02.recognize_jome:
    instruction: "What does this word mean?"
    correct_option: "Friday"
    distractors: ["Saturday", "Sunday", "Wednesday"]
    accepted_answers: [{value: "Friday", status: correct}]
    feedback: "جمعه means Friday, the traditional weekly day off."
  fa.a1.unit10.lesson01.exercise03.recognize_doshanbe_reading:
    instruction: "What day does this word mean?"
    correct_option: "Monday"
    distractors: ["Saturday", "Friday", "Wednesday"]
    accepted_answers: [{value: "Monday", status: correct}]
    feedback: "دوشنبه means Monday."
  fa.a1.unit10.lesson01.exercise04.match_days:
    instruction: "Match each Farsi day with its English meaning."
    accepted_answers:
      - {value: {شنبه: Saturday, یکشنبه: Sunday, دوشنبه: Monday, سه‌شنبه: Tuesday, چهارشنبه: Wednesday, پنجشنبه: Thursday, جمعه: Friday}, status: correct}
    feedback: "These are the seven days of the week in order, starting from Saturday."
  fa.a1.unit10.lesson01.exercise05.order_days_sequence:
    instruction: "Arrange the first three days of the week in order."
    accepted_answers: [{value: [شنبه, یکشنبه, دوشنبه], status: correct}]
    feedback: "شنبه، یکشنبه، دوشنبه are the first three days, in order."
  fa.a1.unit10.lesson01.exercise06.translate_friday:
    instruction: "Translate into Farsi: Friday."
    accepted_answers: [{value: جمعه, status: correct}]
    feedback: "جمعه means Friday."
  fa.a1.unit10.lesson01.exercise07.write_wednesday:
    instruction: "Write the Farsi word for Wednesday."
    accepted_answers: [{value: چهارشنبه, status: correct}]
    feedback: "چهارشنبه means Wednesday."

  fa.a1.unit10.lesson02.exercise01.recognize_farvardin:
    instruction: "What does this word mean?"
    correct_option: "Farvardin (the first month)"
    distractors: ["Ordibehesht (the second month)", "Khordad (the third month)", "Tir (the fourth month)"]
    accepted_answers: [{value: "Farvardin (the first month)", status: correct}]
    feedback: "فروردین is the first month of the Iranian solar year."
  fa.a1.unit10.lesson02.exercise02.recognize_khordad:
    instruction: "What does this word mean?"
    correct_option: "Khordad (the third month)"
    distractors: ["Farvardin (the first month)", "Ordibehesht (the second month)", "Mehr (the seventh month)"]
    accepted_answers: [{value: "Khordad (the third month)", status: correct}]
    feedback: "خرداد is the third month."
  fa.a1.unit10.lesson02.exercise03.recognize_ordibehesht_reading:
    instruction: "Which month does this word mean?"
    correct_option: "Ordibehesht"
    distractors: ["Farvardin", "Khordad"]
    accepted_answers: [{value: "Ordibehesht", status: correct}]
    feedback: "اردیبهشت means Ordibehesht."
  fa.a1.unit10.lesson02.exercise04.match_months:
    instruction: "Match each Farsi word with its meaning."
    accepted_answers:
      - {value: {فروردین: "1st Persian solar month (~late March-April)", اردیبهشت: "2nd Persian solar month (~April-May)", خرداد: "3rd Persian solar month (~May-June)", شنبه: Saturday, یکشنبه: Sunday, دوشنبه: Monday, سه‌شنبه: Tuesday, چهارشنبه: Wednesday, پنجشنبه: Thursday, جمعه: Friday}, status: correct}
    feedback: "These are the first three months of the Iranian solar year, plus a review of the days of the week."
  fa.a1.unit10.lesson02.exercise05.order_months_sequence:
    instruction: "Arrange the first three months in order."
    accepted_answers: [{value: [فروردین, اردیبهشت, خرداد], status: correct}]
    feedback: "فروردین، اردیبهشت، خرداد are the first three months, in order."
  fa.a1.unit10.lesson02.exercise06.calendar_check:
    instruction: "Does this sentence say that Iran uses the Solar Hijri calendar?"
    correct_option: "Yes"
    distractors: ["No"]
    accepted_answers: [{value: "Yes", status: correct}]
    feedback: "Yes. *ایران از تقویم هجری شمسی استفاده می‌کنه* says that Iran uses the Solar Hijri calendar."
  fa.a1.unit10.lesson02.exercise07.write_farvardin:
    instruction: "Write the name of the first month of the Iranian solar calendar."
    accepted_answers: [{value: فروردین, status: correct}]
    feedback: "فروردین is the first month."

  fa.a1.unit10.lesson03.exercise01.recognize_what_day:
    instruction: "What does this phrase mean?"
    correct_option: "What day is today?"
    distractors: ["What is the date?", "What time is it?", "Is today a holiday?"]
    accepted_answers: [{value: "What day is today?", status: correct}]
    feedback: "امروز چندشنبه‌ست؟ asks what day of the week it is today."
  fa.a1.unit10.lesson03.exercise02.recognize_today_word:
    instruction: "What does this word mean?"
    correct_option: "today"
    distractors: ["tomorrow", "yesterday", "Friday"]
    accepted_answers: [{value: "today", status: correct}]
    feedback: "امروز means today."
  fa.a1.unit10.lesson03.exercise03.recognize_what_day_reading:
    instruction: "What does this question ask?"
    correct_option: "What day is today?"
    distractors: ["What day is the meeting?", "What date is Tuesday in Ordibehesht?"]
    accepted_answers: [{value: "What day is today?", status: correct}]
    feedback: "امروز چندشنبه‌ست؟ asks what day today is."
  fa.a1.unit10.lesson03.exercise04.match_today_phrases:
    instruction: "Match each phrase or word with its meaning."
    accepted_answers:
      - {value: {"امروز چندشنبه‌ست؟": "What day is today?", امروز: today, شنبه: Saturday, یکشنبه: Sunday, دوشنبه: Monday, سه‌شنبه: Tuesday, چهارشنبه: Wednesday, پنجشنبه: Thursday, جمعه: Friday}, status: correct}
    feedback: "These cover asking about today's day, plus a review of the days of the week."
  fa.a1.unit10.lesson03.exercise05.order_what_day:
    instruction: "Arrange the words to ask what day it is today."
    accepted_answers: [{value: [امروز, چندشنبه‌ست], status: correct}]
    feedback: "امروز چندشنبه‌ست؟ asks what day today is."
  fa.a1.unit10.lesson03.exercise06.translate_what_day:
    instruction: "Translate into Farsi: What day is today?"
    accepted_answers:
      - {value: "امروز چندشنبه‌ست؟", status: correct}
      - {value: "امروز چندشنبه‌ست", status: correct}
      - {value: "امروز چندشنبه است؟", status: correct}
      - {value: "امروز چندشنبه است", status: correct}
    feedback: "امروز چندشنبه‌ست؟ is the natural colloquial way to ask."
  fa.a1.unit10.lesson03.exercise07.speak_ask_day:
    instruction: "Ask a friend what day it is today."
    accepted_answers:
      - {value: "امروز چندشنبه‌ست؟", status: correct}
      - {value: "امروز چندشنبه‌ست", status: correct}
      - {value: "امروز چندشنبه است؟", status: correct}
      - {value: "امروز چندشنبه است", status: correct}
    feedback: "امروز چندشنبه‌ست؟ correctly asks the question."

  fa.a1.unit10.lesson04.exercise01.recognize_full_date:
    instruction: "What does this sentence mean?"
    correct_option: "Today is Thursday, the 10th of Ordibehesht."
    distractors: ["Today is Tuesday, the 7th of Ordibehesht.", "What day is today?", "The meeting is on Tuesday."]
    accepted_answers: [{value: "Today is Thursday, the 10th of Ordibehesht.", status: correct}]
    feedback: "امروز پنجشنبه، دهم اردیبهشته states today's full date."
  fa.a1.unit10.lesson04.exercise02.recognize_ordinal:
    instruction: "What does this word mean?"
    correct_option: "10th"
    distractors: ["7th", "5th", "1st"]
    accepted_answers: [{value: "10th", status: correct}]
    feedback: "دهم means 10th."
  fa.a1.unit10.lesson04.exercise03.recognize_full_date_reading:
    instruction: "What does this sentence mean?"
    correct_option: "Today is Thursday, the 10th of Ordibehesht."
    distractors: ["Tuesday is the 7th of Ordibehesht.", "What day is the meeting?"]
    accepted_answers: [{value: "Today is Thursday, the 10th of Ordibehesht.", status: correct}]
    feedback: "امروز پنجشنبه، دهم اردیبهشته means today is Thursday, the 10th of Ordibehesht."
  fa.a1.unit10.lesson04.exercise04.match_date_parts:
    instruction: "Match each Farsi word with its meaning."
    accepted_answers:
      - {value: {پنجشنبه: Thursday, دهم: "10th", اردیبهشت: Ordibehesht, فروردین: Farvardin, خرداد: Khordad, شنبه: Saturday, یکشنبه: Sunday, دوشنبه: Monday, سه‌شنبه: Tuesday, چهارشنبه: Wednesday, جمعه: Friday}, status: correct}
    feedback: "Together پنجشنبه، دهم، اردیبهشت state Thursday the 10th of Ordibehesht; the rest reviews the days and months taught so far."
  fa.a1.unit10.lesson04.exercise05.order_full_date:
    instruction: "Arrange the words to state today's full date."
    accepted_answers: [{value: [امروز, پنجشنبه, دهم, اردیبهشته], status: correct}]
    feedback: "امروز پنجشنبه، دهم اردیبهشته states the full date in order."
  fa.a1.unit10.lesson04.exercise06.translate_full_date:
    instruction: "Translate into Farsi: Today is Thursday, the 10th of Ordibehesht."
    accepted_answers:
      - {value: "امروز پنجشنبه دهم اردیبهشته", status: correct}
      - {value: "امروز پنجشنبه، دهم اردیبهشته", status: correct}
      - {value: "امروز پنجشنبه و دهم اردیبهشته", status: correct}
    feedback: "امروز پنجشنبه، دهم اردیبهشته means today is Thursday, the 10th of Ordibehesht."
  fa.a1.unit10.lesson04.exercise07.speak_give_date:
    instruction: "Someone asks the question below. Answer with the full date: Thursday, the 10th of Ordibehesht."
    accepted_answers:
      - {value: "امروز پنجشنبه، دهم اردیبهشته", status: correct}
      - {value: "امروز پنجشنبه و دهم اردیبهشته", status: correct}
      - {value: "امروز پنجشنبه دهم اردیبهشته", status: correct}
    feedback: "امروز پنجشنبه، دهم اردیبهشته correctly gives the full date."

  fa.a1.unit10.lesson05.exercise01.recognize_which_day_meeting:
    instruction: "What does this phrase mean?"
    correct_option: "What day is the meeting?"
    distractors: ["What day is today?", "What date is Tuesday in Ordibehesht?", "Do you have time on Friday?"]
    accepted_answers: [{value: "What day is the meeting?", status: correct}]
    feedback: "جلسه کدوم روزه؟ asks which day the meeting is."
  fa.a1.unit10.lesson05.exercise02.recognize_which_date:
    instruction: "What does this phrase mean?"
    correct_option: "What date is Tuesday in Ordibehesht?"
    distractors: ["What day is the meeting?", "Today is Thursday, the 10th.", "I'm busy on Friday."]
    accepted_answers: [{value: "What date is Tuesday in Ordibehesht?", status: correct}]
    feedback: "سه‌شنبه چندم اردیبهشته؟ asks for the specific date of Tuesday."
  fa.a1.unit10.lesson05.exercise03.recognize_which_day_reading:
    instruction: "What does this question ask?"
    correct_option: "What day is the meeting?"
    distractors: ["What day is today?", "What date is Tuesday in Ordibehesht?"]
    accepted_answers: [{value: "What day is the meeting?", status: correct}]
    feedback: "جلسه کدوم روزه؟ asks what day the meeting is."
  fa.a1.unit10.lesson05.exercise04.match_future_date_phrases:
    instruction: "Match each phrase or word with its meaning."
    accepted_answers:
