teaching:
  fa.a2.unit43.lesson01.teach.foods:
    title: At the market
    gloss: apple, orange, bread, pastry
    note: '*نون* is the spoken form of *نان*.'
    example_gloss:
    - The apple is cheap.
    - The orange is expensive.
    - The bread is here.
    - The pastry is over there.
  fa.a2.unit43.lesson01.teach.pointing:
    title: This, that, one, how much
    gloss: this, that, one (of them), how much is it
    note: '*این یکی* means “this one”, *اون یکی* “that one”.'
    example_gloss:
    - How much is this apple?
    - That orange is cheap.
    - This one is expensive.
    - That one is cheap.
  fa.a2.unit43.lesson01.teach.oneword:
    title: این and اون come before the noun
    gloss: this apple; that orange; this one; that one
    note: '*این* points to something near, *اون* to something far. They stand before the noun. To avoid repeating the noun, use *یکی*: *این یکی*, *اون یکی*.'
  fa.a2.unit43.lesson01.teach.want:
    title: 'Choosing: I want that one'
    gloss: I want that one; I want this one
    note: 'When you choose a particular thing, *رو* follows it: *اون یکی رو می‌خوام*.'
  fa.a2.unit43.lesson02.teach.flowers:
    title: Flowers and books
    gloss: flower, book, novel
    note: '*گل* is a flower.'
    example_gloss:
    - The flower is pretty.
    - The book is here.
    - The novel is over there.
  fa.a2.unit43.lesson02.teach.plural:
    title: این / اون + plural
    gloss: these apples; those flowers; these books; those oranges
    note: 'Add *‌ها* (with a half-space) to the noun and keep *این* or *اون* in front: *این سیب‌ها* is “these apples”. In speech *-ها* often becomes *-ا* (*سیبا*).'
  fa.a2.unit43.lesson02.teach.plural_use:
    title: Asking and choosing with plurals
    gloss: How much are these apples? I want those flowers.
    note: A plural thing you choose still takes *رو*. After *این* or *اون* + plural, a question with *چنده؟* is the usual way to ask the price.
  fa.a2.unit43.lesson03.teach.bookshop:
    title: In the bookshop
    gloss: I want, do you have, give (me)
    note: '*دارید؟* is the polite “do you have?” and *بدید* the polite “give me”.'
    example_gloss:
    - I want a book.
    - Do you have a novel?
    - Give me that book.
  fa.a2.unit43.lesson03.teach.indef:
    title: 'The ending -ی: a / some'
    gloss: I want a book (some book); do you have a novel?
    note: 'Add *ی* to the noun when you mean “a / some” and the exact item does not matter. There is usually no *رو*: *کتابی می‌خوام*.'
  fa.a2.unit43.lesson03.teach.indef_def:
    title: Indefinite or definite?
    gloss: I want a book. I want that book.
    note: 'Compare: *کتابی* is any book (no *رو*); *اون کتاب رو* is one particular book (with *رو*).'
  fa.a2.unit43.lesson04.teach.shopwords:
    title: Something, bakery, florist
    gloss: something, bakery, flower shop
    note: '*چیزی* is “something”; it already ends in the indefinite *ی*.'
    example_gloss:
    - I want something.
    - The bakery is over there.
    - The flower shop is here.
  fa.a2.unit43.lesson04.teach.yeh:
    title: 'یه ... ی: some, a certain'
    gloss: some bread; a flower; a pastry; something
    note: 'Speech often combines *یه* before the noun with *ی* after it: *یه نونی*, *یه گلی*. It sounds like “some / a ... or other”. After a final *ی* the ending is written *ای*: *یه شیرینی‌ای*.'
  fa.a2.unit43.lesson04.teach.yeh_use:
    title: Asking for something non-specific
    gloss: Give me some bread. I want a flower.
    note: Use *یه ... ی* when you ask for something and the exact one does not matter, for example in a bakery or a flower shop.
  fa.a2.unit43.lesson05.teach.reading:
    title: A trip to the market
    gloss: Today I went to the market. First I went to the bakery. I bought some bread. Then I went to the flower shop. I saw those red flowers. These flowers were cheap, but that one was expensive. I bought two flowers. Then I also bought a book.
    note: Read once for the shops, then again for *این*, *اون* and the endings *-ی*.
  fa.a2.unit43.lesson06.teach.turn01:
    title: The seller greets Sara
    gloss: 'Seller: Here you are. What would you like?'
    note: '*می‌خواید* is the polite “you want”.'
  fa.a2.unit43.lesson06.teach.turn02:
    title: Sara asks for a flower
    gloss: 'Sara: I would like a flower. How much are these flowers?'
    note: '*یه گلی* is non-specific; *این گل‌ها* points to these.'
  fa.a2.unit43.lesson06.teach.turn03:
    title: The seller compares
    gloss: 'Seller: Those red flowers are cheap. This one is expensive.'
    note: '*گل‌های قرمز*: plural noun + adjective, joined by the ezafe (the linking *-e* sound, written *ی* here after the vowel).'
  fa.a2.unit43.lesson06.teach.turn04:
    title: Sara chooses
    gloss: 'Sara: I want that one. Give me two.'
    note: '*دو تا* means “two (of them)”.'
  fa.a2.unit43.lesson06.teach.turn05:
    title: The seller hands them over
    gloss: 'Seller: Here you are.'
    note: '*بفرمایید* is said when you hand something over.'
