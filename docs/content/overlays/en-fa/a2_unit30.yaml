course:
  title: Farsi A2
  description: Lower-intermediate spoken Iranian Farsi with a grammar-led progression.
units:
  fa.a2.unit30.ability_possibility:
    title: What I can do, cannot do, and might do
lessons:
  fa.a2.unit30.lesson01.form_recognition:
    title: Can and cannot
  fa.a2.unit30.lesson02.persons_and_endings:
    title: You, he/she, and the verb that follows
  fa.a2.unit30.lesson03.can_must_might:
    title: Can, must, might
  fa.a2.unit30.lesson04.availability:
    title: Availability and ability
