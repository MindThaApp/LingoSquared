    accepted_answers:
    - value:
        می‌تونم: I can
        نمی‌تونم: I cannot
        می‌تونی: you can
        نمی‌تونی: you cannot
        می‌تونه: he or she can
        نمی‌تونه: he or she cannot
        گیتار: guitar
        رانندگی: driving
      status: correct
    feedback: The ending shows the person; نـ makes the verb negative.
