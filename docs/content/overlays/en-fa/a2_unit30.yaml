    feedback: '*می‌تونم گیتار بزنم*: ability verb first, subjunctive verb last.'
  fa.a2.unit30.lesson01.exercise05.fill_cannot_come:
    instruction: Complete the sentence meaning “I cannot come.”
    accepted_answers:
    - value: نمی‌تونم
