    correct_response: امشب وقت ندارم ولی فردا می‌تونم بیام
    orthography_strict: true
    feedback: The sentence contrasts tonight (no time) with tomorrow (can come).
  fa.a2.unit30.lesson06.exercise01.comp_why_not:
    instruction: Why can Nima not come tonight?
    correct_option: He has a meeting.
    distractors:
    - He cannot drive.
    - He does not want to come.
    - He is already at Sara’s place.
    accepted_answers:
    - value: He has a meeting.
      status: correct
    feedback: Nima says *جلسه دارم*.
  fa.a2.unit30.lesson06.exercise02.comp_photos:
    instruction: What does Sara ask Nima whether he can do?
    correct_option: Take photos with his phone.
    distractors:
    - Send an email.
    - Play the guitar.
    - Read a book.
    accepted_answers:
    - value: Take photos with his phone.
      status: correct
    feedback: Sara asks *می‌تونی با گوشی عکس بگیری؟*
  fa.a2.unit30.lesson06.exercise03.match_dialogue:
    instruction: Match each line from the conversation with its meaning.
    accepted_answers:
    - value:
        امشب نمی‌تونم بیام: I cannot come tonight
        جلسه دارم: I have a meeting
        فردا وقت داری؟: Do you have time tomorrow?
        فردا آزادم: I am free tomorrow
        ممکنه دیر برسم: I might arrive late
        اشکالی نداره: no problem
        می‌تونی عکس بگیری؟: Can you take photos?
        شاید بتونم زودتر بیام: maybe I will be able to come earlier
      status: correct
    feedback: The pairs cover the main ideas of the conversation.
