    instruction: What does this sentence mean?
    correct_option: I can come.
    distractors:
    - I must come.
    - I might come.
    - I cannot come.
    accepted_answers:
    - value: I can come.
      status: correct
    feedback: '*می‌تونم بیام* means “I can come.”'
  fa.a2.unit30.lesson01.exercise02.recognize_cannot_speak:
    instruction: What does this sentence mean?
    correct_option: I cannot speak.
    distractors:
    - I can speak.
    - I must speak.
    - I might speak.
    accepted_answers:
    - value: I cannot speak.
      status: correct
    feedback: '*نمی‌تونم* is the negative: “I cannot.”'
  fa.a2.unit30.lesson01.exercise03.match_can_forms:
