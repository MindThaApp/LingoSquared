teaching:
  fa.a2.unit30.lesson01.teach.people_time:
    title: People and time
    gloss: I, you, Sara, Nima, tonight, tomorrow
    note: '*امشب* means “tonight” and *فردا* means “tomorrow.” Persian usually drops *من* because the verb ending already shows the person.'
    example_gloss:
    - Tomorrow I can come.
    - Sara cannot come tonight.
  fa.a2.unit30.lesson01.teach.skills:
    title: Skills
    gloss: to play guitar, to drive, to cook, to swim, to speak English
    note: These are skills. Each is a noun plus a light verb, and the light verb changes with the person.
    example_gloss:
    - I can play the guitar.
    - I cannot drive.
    - Nima can speak English.
  fa.a2.unit30.lesson01.teach.verbs_after:
    title: Verbs after “can”
    gloss: that I come, that I go, that I play, that I read, that I do
    note: These are the “that I...” verb shapes (the subjunctive). Spoken Persian puts one of them after *می‌تونم*.
    example_gloss:
    - I can come.
    - I cannot go.
    - I can speak English.
  fa.a2.unit30.lesson01.teach.can_forms:
    title: Can and cannot
    gloss: I can, you can, he/she can; I cannot, you cannot, he/she cannot
    note: 'The spoken verb for “can” is *می‌تونم* (I can), *می‌تونی* (you can), *می‌تونه* (he/she can). Put *نـ* in front for “cannot”: *نمی‌تونم*.'
  fa.a2.unit30.lesson01.teach.can_plus_subjunctive:
    title: Can + the “that I...” verb
    gloss: I can come; I cannot speak
    note: 'After *می‌تونم* the second verb is the subjunctive, not the plain infinitive: *می‌تونم بیام*, *نمی‌تونم صحبت کنم*. The second verb carries the same person ending as *می‌تونم*.'
  fa.a2.unit30.lesson02.teach.person_word:
    title: You and he/she
    gloss: you, he or she
    note: '*اون* means “he” or “she” in spoken Persian; the verb ending shows who is meant.'
    example_gloss:
    - He or she can come.
    - You can go.
  fa.a2.unit30.lesson02.teach.endings:
    title: Three persons
    gloss: that I/you/he come, go, play
    note: 'The subjunctive ending follows the person: -م (I), -ی (you), -ه or -د (he/she). The same pattern appears on every verb.'
    example_gloss:
    - You can play the guitar.
    - He or she can go.
  fa.a2.unit30.lesson02.teach.work_tech:
    title: Work and technology skills
    gloss: to send an email, to take a photo, to read Persian, to work on a computer, with a phone
    note: These skills come from work and technology. *با* means “with” or “on.”
    example_gloss:
    - Nima can work on a computer.
    - I can send an email.
    - You can take photos with a phone.
  fa.a2.unit30.lesson02.teach.person_agreement:
    title: Both verbs agree
    gloss: I can come, you can come, he/she can come
    note: 'Change the person on both verbs together: *می‌تونم بیام*, *می‌تونی بیای*, *می‌تونه بیاد*. A mismatch such as *می‌تونی بیام* is wrong.'
  fa.a2.unit30.lesson03.teach.three_words:
    title: Must, might, maybe
    gloss: must, it is possible that, maybe
    note: '*باید* is necessity. *ممکنه* and *شاید* both express possibility. All three are followed by the subjunctive.'
    example_gloss:
    - I must go.
    - I might come.
    - Maybe I will go.
  fa.a2.unit30.lesson03.teach.late_rain:
    title: Late, rain, not coming
    gloss: late, that I arrive, rain, that I not go, that I not come, that he/she/it not come
    note: '*نیام* and *نرم* are negative subjunctives: *نـ* comes before the verb.'
    example_gloss:
    - I might arrive late.
    - It might rain.
    - I might not come.
  fa.a2.unit30.lesson03.teach.can_must_might:
    title: Can, must, might
    gloss: I can go; I must go; I might go
    note: 'The verb after is the same, but the first word changes the meaning: *می‌تونم برم* (I am able to or free to), *باید برم* (I have to), *ممکنه برم* (it is possible that I will).'
  fa.a2.unit30.lesson03.teach.possibility_rule:
    title: 'Possibility: ممکنه / شاید + subjunctive'
    gloss: I might arrive late; maybe it will rain; I might not come
    note: '*ممکنه* does not change for person; the following verb does: *ممکنه دیر برسم*, *ممکنه نیما نیاد*. *شاید* works the same way. To say “might not,” negate the second verb: *ممکنه نیام*.'
  fa.a2.unit30.lesson04.teach.availability:
    title: Availability
    gloss: I have time, I do not have time, I am free, I am busy, I have a meeting, the weekend
    note: '*وقت دارم* and *آزادم* say you are available; *وقت ندارم* and *مشغولم* say you are not.'
    example_gloss:
    - I have time tomorrow.
    - I am busy tonight.
    - I am free at the weekend.
  fa.a2.unit30.lesson04.teach.linkers:
    title: Because, but, no, and
    gloss: because, but, no, and
    note: '*چون* gives a reason and *ولی* adds a contrast.'
    example_gloss:
    - I cannot come tonight because I have a meeting.
    - I am free tomorrow, but I might be late.
  fa.a2.unit30.lesson04.teach.maybe_able:
    title: 'Maybe I will be able to: شاید بتونم'
    gloss: maybe I will be able to come
    note: 'To say “maybe I can,” put *شاید* before *بتونم* (the subjunctive of “can”) and then a second subjunctive verb: *شاید بتونم بیام*. This course teaches *شاید بتونم* as the model.'
  fa.a2.unit30.lesson04.teach.reason_for_no:
    title: Cannot + reason
    gloss: I cannot come tonight because I have a meeting
    note: 'A refusal sounds natural with a reason: *نمی‌تونم بیام، چون ...*. The reason is a plain present statement.'
  fa.a2.unit30.lesson05.teach.reading:
    title: A message from Nima
    gloss: Hi Sara! I cannot come tonight, because I have a meeting. I am free tomorrow and I can come, but I might be late. I can work on a computer, but I cannot play the guitar. Maybe I will be able to take photos too.
    note: Read once for what Nima can and cannot do, then again for what might happen.
  fa.a2.unit30.lesson06.teach.dialogue_words:
    title: Reply words
    gloss: yes, okay, no problem, earlier
    note: '*اشکالی نداره* is a friendly reply meaning “no problem.” *زودتر* means “earlier.”'
    example_gloss:
    - Okay, no problem.
    - Maybe I will be able to come earlier.
  fa.a2.unit30.lesson06.teach.turn01:
    title: Sara invites Nima
    gloss: 'Sara asks: Nima, can you come tonight?'
    note: The opening asks about ability and availability.
  fa.a2.unit30.lesson06.teach.turn02:
    title: Nima declines
    gloss: 'Nima: No, I cannot come tonight. I have a meeting.'
    note: A refusal with a reason.
  fa.a2.unit30.lesson06.teach.turn03:
    title: Sara asks about tomorrow
    gloss: 'Sara: What about tomorrow? Do you have time tomorrow?'
    note: '*فردا چی؟* moves the conversation to another time.'
  fa.a2.unit30.lesson06.teach.turn04:
    title: 'Nima: can, but might be late'
    gloss: 'Nima: Yes, I am free tomorrow. I can come, but I might be late.'
    note: Ability and possibility in one reply.
  fa.a2.unit30.lesson06.teach.turn05:
    title: Sara asks about photos
    gloss: 'Sara: Okay, no problem. Can you take photos with your phone?'
    note: A new question about ability.
  fa.a2.unit30.lesson06.teach.turn06:
    title: Nima ends the conversation
    gloss: 'Nima: Yes, I can. Maybe I will be able to come earlier.'
    note: Ability, then a hopeful possibility.
exercises:
