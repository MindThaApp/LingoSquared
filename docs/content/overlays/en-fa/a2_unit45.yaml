teaching:
  fa.a2.unit45.lesson01.teach.time:
    title: Today and degree
    gloss: today, very, a little
    note: امروز says when; *خیلی* and *یکم* say how much.
    example_gloss:
    - Today I am very happy.
    - Today I am a little tired.
  fa.a2.unit45.lesson01.teach.feel:
    title: Feelings
    gloss: I am happy, I am upset, I am tired, I am angry, I am worried
    note: 'The spoken ending *-م* means “I am”: *خسته‌م* is “I am tired”.'
    example_gloss:
    - Today I am happy.
    - Today I am upset.
    - Today I am tired.
    - Today I am angry.
    - Today I am worried.
  fa.a2.unit45.lesson01.teach.hal:
    title: How you feel
    gloss: my state, your state, it is good, it is bad, how is it
    note: '*حال* is the state you are in, so *حالم* is “how I feel” and *حالت* is “how you feel”. *حالم خوبه* means “I feel good”; *حالم بده* means “I feel bad”.'
    example_gloss:
    - I feel good.
    - I feel bad.
    - How do you feel?
  fa.a2.unit45.lesson01.teach.shape:
    title: Two ways to say how you are
    gloss: I am tired; I feel bad; how do you feel?
    note: 'Either put *-م* on the feeling word (*خسته‌م*, *نگرانم*), or say *حالم* plus *خوبه* or *بده*. To ask, change the ending: *حالت چطوره؟*'
  fa.a2.unit45.lesson02.teach.care:
    title: Care and from
    gloss: care, from
    note: '*مراقبت می‌کنم* means “I look after”. The person you look after comes after *از*.'
    example_gloss:
    - I look after my friend.
  fa.a2.unit45.lesson02.teach.verbs:
    title: Present of کردن
    gloss: I do, you do, he / she does, we do, you (pl.) do, they do
    note: 'These are the spoken present endings: *-م, -ی, -ه, -یم, -ین, -ن*.'
    example_gloss:
    - I look after.
    - You look after.
    - He / she looks after.
    - We look after.
    - You (pl.) look after.
    - They look after.
  fa.a2.unit45.lesson02.teach.self_sg:
    title: Myself, yourself, himself / herself
    gloss: myself, yourself, himself / herself
    note: '*خود* means “self”. It takes the same endings as other nouns: *-م* (my), *-ت* (your), *-ش* (his / her).'
    example_gloss:
    - I look after myself.
    - You look after yourself.
    - He / she looks after himself / herself.
  fa.a2.unit45.lesson02.teach.self_pl:
    title: Ourselves, yourselves, themselves
    gloss: ourselves, yourselves (or you, polite), themselves
    note: In speech the plural endings are *-مون, -تون, -شون*. *خودتون* is also the polite form for one person.
    example_gloss:
    - We look after ourselves.
    - You (pl.) look after yourselves.
    - They look after themselves.
  fa.a2.unit45.lesson02.teach.careful:
    title: Take care
    gloss: careful, be (to one friend), be (to several people, or polite)
    note: '*مواظب خودت باش* is what you say to a friend who is leaving or is unwell. For several people, or to be polite, say *مواظب خودتون باشین*.'
    example_gloss:
    - Take care of yourself.
    - Take care of yourselves.
  fa.a2.unit45.lesson02.teach.agree:
    title: خود agrees with the subject
    gloss: I look after myself; you look after yourself
    note: 'The ending of *خود* matches the subject, and so does the verb: *من* goes with *خودم* and *می‌کنم*; *تو* goes with *خودت* and *می‌کنی*; *ما* goes with *خودمون* and *می‌کنیم*.'
  fa.a2.unit45.lesson03.teach.when:
    title: When you do it
    gloss: in the mornings, at night, every day
    note: The ending *-ها* on *صبح* and *شب* gives “in the mornings” and “at night” as habits.
    example_gloss:
    - In the mornings I take a shower.
    - At night I brush my teeth.
    - Every day I exercise.
  fa.a2.unit45.lesson03.teach.body:
    title: Washing and cleaning
    gloss: shower, toothbrushing, my hands, my face
    note: '*دوش* is a shower and *مسواک* is a toothbrush; *دست‌هام* is “my hands” and *صورتم* is “my face”.'
    example_gloss:
    - I take a shower.
    - I brush my teeth.
    - I wash my hands.
    - I wash my face.
  fa.a2.unit45.lesson03.teach.verbs:
    title: Verbs of care
    gloss: I take, I hit (brush), I wash
    note: 'Persian uses a different verb for each: *دوش می‌گیرم* (take a shower), *مسواک می‌زنم* (brush my teeth), *می‌شورم* (wash).'
    example_gloss:
    - I take a shower.
    - I brush my teeth.
    - I wash my face.
  fa.a2.unit45.lesson03.teach.rest:
    title: Exercise and rest
    gloss: exercise, rest, I sleep, early
    note: '*ورزش* and *استراحت* go with *می‌کنم*: *ورزش می‌کنم* and *استراحت می‌کنم*.'
    example_gloss:
    - I exercise every day.
    - I rest a little.
    - I go to sleep early.
  fa.a2.unit45.lesson03.teach.light:
    title: Noun plus verb
    gloss: I take a shower; I brush my teeth; I exercise; I rest
    note: Most self-care actions are a noun plus a verb. The noun stays the same; only the verb changes with the person. The verb is fixed for each noun, so learn them as pairs.
  fa.a2.unit45.lesson03.teach.ask:
    title: Asking how
    gloss: How do you look after yourself?
    note: '*چطور* means “how”.'
  fa.a2.unit45.lesson03.teach.phrase:
    title: Looking after yourself
    gloss: I look after myself (my looks and my well-being)
    note: '*به خودم می‌رسم* is a fixed everyday phrase for taking time to look after yourself. Learn it as one piece.'
  fa.a2.unit45.lesson04.teach.state:
    title: Getting ready, getting tired
    gloss: ready, tired, (object marker), I made / I did
    note: '*آماده کردم* is “I made ready” and *خسته کردم* is “I made tired”; with *خودم رو* they become “I got myself ready” and “I tired myself out”. *رو* marks the thing the action is done to.'
    example_gloss:
    - I got myself ready.
    - I tired myself out.
  fa.a2.unit45.lesson04.teach.time:
    title: This week
    gloss: this, week
    note: '*این هفته* means “this week”.'
    example_gloss:
    - This week I tired myself out.
  fa.a2.unit45.lesson04.teach.make:
    title: Making dinner
    gloss: dinner, make, you did
    note: '*درست کردم* means “I made”: *شام درست کردم* is “I made dinner”.'
    example_gloss:
    - I made dinner myself.
    - Did you make it yourself?
  fa.a2.unit45.lesson04.teach.reflexive:
    title: خود as the object
    gloss: I got myself ready; I tired myself out
    note: 'When the action is done to yourself, *خود* with its ending takes *رو* and comes before the verb: *خودم رو آماده کردم*. In fast speech *خودم رو* is often said *خودمو*.'
  fa.a2.unit45.lesson04.teach.emphatic:
    title: خود for emphasis
    gloss: I made dinner myself; did you make it yourself?
    note: '*خود* before the verb, without *رو*, stresses that you did it, not someone else. The sentence is built exactly as it would be without *خودم*.'
  fa.a2.unit45.lesson05.teach.words:
    title: Words for the text
    gloss: work, I had, I was, it was, bad, Friday, first, afterwards, a / one, hour, now, and
    note: '*بودم* is “I was” and *بود* is “it was”; *داشتم* is “I had”.'
    example_gloss:
    - This week I had work.
    - I was tired and I felt bad.
    - On Friday I first took a shower.
    - Then I rested for an hour.
    - Now I am happy.
  fa.a2.unit45.lesson05.teach.reading:
    title: A week and a Friday
    gloss: This week I had a lot of work. I was tired and I felt bad. On Friday I looked after myself. First I took a shower. Then I rested for an hour. Now I am happy and I feel good.
    note: Read once for the feelings, then again for what the speaker did to feel better.
  fa.a2.unit45.lesson06.teach.turn01:
    title: Sara asks how Nima feels
    gloss: 'Sara: Nima, how do you feel?'
    note: '*حالت چطوره؟* asks how you feel.'
  fa.a2.unit45.lesson06.teach.turn02:
    title: Nima says he is tired
    gloss: 'Nima: I am very tired. This week I tired myself out.'
    note: '*خودم رو خسته کردم* shows the reflexive pattern.'
  fa.a2.unit45.lesson06.teach.turn03:
    title: Sara gives advice
    gloss: 'Sara: You should look after yourself.'
    note: '*باید* plus *کنی* says what someone should do.'
  fa.a2.unit45.lesson06.teach.turn04:
    title: Nima describes his routine
    gloss: 'Nima: Yes. In the mornings I take a shower, but I do not exercise.'
    note: '*ولی* means “but”; *نمی‌کنم* is the negative of *می‌کنم*.'
  fa.a2.unit45.lesson06.teach.turn05:
    title: Sara says take care
    gloss: 'Sara: Take care of yourself! Rest a little.'
    note: '*استراحت کن* is the friendly command: drop *می‌* and the ending.'
  fa.a2.unit45.lesson06.teach.turn06:
    title: Nima agrees
    gloss: 'Nima: OK. Tonight I will go to sleep early.'
    note: '*باشه* means “OK”.'
exercises:
  fa.a2.unit45.lesson01.exercise01.recognize_tired:
    instruction: What does this sentence mean?
    correct_option: Today I am very tired.
    distractors:
    - Today I was very tired.
    - Today I am a little tired.
    - Today I am very worried.
    accepted_answers:
    - value: Today I am very tired.
      status: correct
    feedback: '*خیلی* means “very” and *خسته‌م* means “I am tired”.'
  fa.a2.unit45.lesson01.exercise02.recognize_bad:
    instruction: What does this sentence mean?
    correct_option: I feel bad.
    distractors:
    - I feel good.
    - I am angry.
    - How do you feel?
    accepted_answers:
    - value: I feel bad.
      status: correct
    feedback: '*حالم بده* means “I feel bad”.'
  fa.a2.unit45.lesson01.exercise03.match_feelings:
    instruction: Match each Farsi item with its meaning.
    accepted_answers:
    - value:
        خوشحالم: I am happy
        ناراحتم: I am upset
        خسته‌م: I am tired
        عصبانیم: I am angry
        نگرانم: I am worried
        حالم خوبه: I feel good
        حالم بده: I feel bad
        خیلی: very
      status: correct
    feedback: Each feeling word ends in *-م*, “I am”.
  fa.a2.unit45.lesson01.exercise04.order_happy:
    instruction: 'Arrange the words to say: Today I am very happy.'
    accepted_answers:
    - value:
      - امروز
      - خیلی
      - خوشحالم
      status: correct
    - value:
      - خیلی
      - خوشحالم
      - امروز
      status: correct
    feedback: '*امروز خیلی خوشحالم*: time, degree, feeling.'
  fa.a2.unit45.lesson01.exercise05.fill_worried:
    instruction: 'Complete the sentence with the feeling word: Today I am very worried.'
    accepted_answers:
    - value: نگرانم
      status: correct
    feedback: The full sentence is *امروز خیلی نگرانم*.
  fa.a2.unit45.lesson01.exercise06.answer_feeling:
    instruction: 'Answer in Farsi: say that you feel bad today.'
    accepted_answers:
    - value: حالم بده
      status: correct
    - value: امروز حالم بده
      status: correct
    - value: من امروز حالم بده
      status: acceptable_with_note
      note: '*من* is correct but normally omitted.'
    feedback: 'Model: *امروز حالم بده.*'
  fa.a2.unit45.lesson01.exercise07.translate_worried:
    instruction: 'Translate into Farsi: Today I am a little worried.'
    accepted_answers:
    - value: امروز یکم نگرانم
      status: correct
    - value: یکم نگرانم امروز
      status: correct
    - value: من امروز یکم نگرانم
      status: acceptable_with_note
      note: '*من* is correct but normally omitted.'
    - value: امروز یکم نگران هستم
      status: acceptable_with_note
      note: This is correct but sounds more formal than the spoken ending.
    feedback: 'Model: *امروز یکم نگرانم.*'
  fa.a2.unit45.lesson02.exercise01.recognize_myself:
    instruction: What does this sentence mean?
    correct_option: I look after myself.
    distractors:
    - I look after you.
    - He looks after himself.
    - We look after ourselves.
    accepted_answers:
    - value: I look after myself.
      status: correct
    feedback: '*خودم* and *می‌کنم* both point to “I”.'
  fa.a2.unit45.lesson02.exercise02.recognize_take_care:
    instruction: What does this sentence mean?
    correct_option: Take care of yourself.
    distractors:
    - I take care of myself.
    - She takes care of herself.
    - Look after her.
    accepted_answers:
    - value: Take care of yourself.
      status: correct
    feedback: '*خودت* is “yourself”; *باش* is the friendly command.'
  fa.a2.unit45.lesson02.exercise03.match_selves:
    instruction: Match each Farsi item with its meaning.
    accepted_answers:
    - value:
        خودم: myself
        خودت: yourself
        خودش: himself / herself
        خودمون: ourselves
        خودتون: yourselves, or you (polite)
        خودشون: themselves
        مراقبت: care
      status: correct
    feedback: The endings on *خود* are the same endings you use on other nouns.
  fa.a2.unit45.lesson02.exercise04.order_care:
    instruction: 'Arrange the words to say: I look after myself.'
    accepted_answers:
    - value:
      - از
      - خودم
      - مراقبت
      - می‌کنم
      status: correct
    - value:
      - مراقبت
      - می‌کنم
      - از
      - خودم
      status: correct
    feedback: '*از خودم مراقبت می‌کنم*: the person you look after comes after *از*.'
  fa.a2.unit45.lesson02.exercise05.fill_yourself:
    instruction: 'Complete the phrase for one friend: Take care of yourself.'
    accepted_answers:
    - value: خودت
      status: correct
    feedback: The full phrase is *مواظب خودت باش*.
  fa.a2.unit45.lesson02.exercise06.fill_ourselves:
    instruction: 'Complete the sentence: We look after ourselves.'
    accepted_answers:
    - value: خودمون
      status: correct
    feedback: The full sentence is *از خودمون مراقبت می‌کنیم*.
  fa.a2.unit45.lesson02.exercise07.translate_herself:
    instruction: 'Translate into Farsi: She looks after herself.'
    accepted_answers:
    - value: از خودش مراقبت می‌کنه
      status: correct
    - value: اون از خودش مراقبت می‌کنه
      status: correct
    - value: از خودش مراقبت می‌کند
      status: acceptable_with_note
      note: This is correct but written style.
    feedback: 'Model: *از خودش مراقبت می‌کنه.*'
  fa.a2.unit45.lesson03.exercise01.recognize_shower:
    instruction: What does this sentence mean?
    correct_option: In the mornings I take a shower.
    distractors:
    - At night I take a shower.
    - In the mornings I brush my teeth.
    - Every day I exercise.
    accepted_answers:
    - value: In the mornings I take a shower.
      status: correct
    feedback: '*صبح‌ها* means “in the mornings” and *دوش می‌گیرم* means “I take a shower”.'
  fa.a2.unit45.lesson03.exercise02.recognize_teeth:
    instruction: What does this sentence mean?
    correct_option: At night I brush my teeth.
    distractors:
    - In the mornings I wash my face.
    - At night I wash my hands.
    - I never brush my teeth.
    accepted_answers:
    - value: At night I brush my teeth.
      status: correct
    feedback: '*مسواک می‌زنم* means “I brush my teeth”.'
  fa.a2.unit45.lesson03.exercise03.match_care:
    instruction: Match each Farsi item with its meaning.
    accepted_answers:
    - value:
        دوش: shower
        مسواک: toothbrush
        دست‌هام: my hands
        صورتم: my face
        ورزش: exercise
        استراحت: rest
        صبح‌ها: in the mornings
        شب‌ها: at night
        هر روز: every day
      status: correct
    feedback: These are the words of a daily care routine.
  fa.a2.unit45.lesson03.exercise04.order_exercise:
    instruction: 'Arrange the words to say: I exercise every day.'
    accepted_answers:
    - value:
      - هر
      - روز
      - ورزش
      - می‌کنم
      status: correct
    - value:
      - ورزش
      - می‌کنم
      - هر
      - روز
      status: correct
    feedback: '*هر روز ورزش می‌کنم*: when, noun, verb.'
  fa.a2.unit45.lesson03.exercise05.fill_brush:
    instruction: 'Complete the sentence with the right verb: At night I brush my teeth.'
    accepted_answers:
    - value: می‌زنم
      status: correct
    feedback: 'The verb for brushing teeth is *زدن*: *مسواک می‌زنم*.'
  fa.a2.unit45.lesson03.exercise06.fill_wash:
    instruction: 'Complete the sentence with the right verb: I wash my face.'
    accepted_answers:
    - value: می‌شورم
      status: correct
    feedback: 'The verb for washing is *شستن*: *می‌شورم*.'
  fa.a2.unit45.lesson03.exercise07.answer_exercise:
    instruction: 'Answer in Farsi: say that you exercise every day.'
    accepted_answers:
    - value: هر روز ورزش می‌کنم
      status: correct
    - value: ورزش می‌کنم هر روز
      status: correct
    - value: من هر روز ورزش می‌کنم
      status: acceptable_with_note
      note: '*من* is correct but normally omitted.'
    feedback: 'Model: *هر روز ورزش می‌کنم.*'
  fa.a2.unit45.lesson03.exercise08.translate_sleep:
    instruction: 'Translate into Farsi: At night I go to sleep early.'
    accepted_answers:
    - value: شب‌ها زود می‌خوابم
      status: correct
    - value: زود می‌خوابم شب‌ها
      status: correct
    - value: من شب‌ها زود می‌خوابم
      status: acceptable_with_note
      note: '*من* is correct but normally omitted.'
    feedback: 'Model: *شب‌ها زود می‌خوابم.*'
  fa.a2.unit45.lesson04.exercise01.recognize_tired_out:
    instruction: What does this sentence mean?
    correct_option: This week I tired myself out.
    distractors:
    - This week someone tired me out.
    - This week I took a rest.
    - This week I got myself ready.
    accepted_answers:
    - value: This week I tired myself out.
      status: correct
    feedback: '*خودم رو خسته کردم*: I did the tiring to myself.'
  fa.a2.unit45.lesson04.exercise02.recognize_myself_dinner:
    instruction: What does this sentence mean?
    correct_option: I made dinner myself.
    distractors:
    - Someone made me dinner.
    - I ate dinner alone.
    - I got myself ready for dinner.
    accepted_answers:
    - value: I made dinner myself.
      status: correct
    feedback: '*خودم* before the verb stresses that nobody helped.'
  fa.a2.unit45.lesson04.exercise03.match_reflexive:
    instruction: Match each Farsi item with its meaning.
    accepted_answers:
    - value:
        خودم رو آماده کردم: I got myself ready
        خودم رو خسته کردم: I tired myself out
        خودم شام درست کردم: I made dinner myself
        خودت درست کردی: you made it yourself
        آماده: ready
        خسته: tired
        شام: dinner
        این هفته: this week
      status: correct
    feedback: 'Compare the two patterns: *خودم رو …* (to myself) and *خودم …* (myself, with emphasis).'
  fa.a2.unit45.lesson04.exercise04.choose_emphatic:
    instruction: Which sentence stresses that you did it yourself, with nobody else’s help?
    correct_option: خودم شام درست کردم.
    distractors:
    - خودم رو آماده کردم.
    - خودم رو خسته کردم.
    - مواظب خودت باش.
    accepted_answers:
    - value: خودم شام درست کردم.
      status: correct
    feedback: '*خودم شام درست کردم* uses *خود* before the verb for emphasis.'
  fa.a2.unit45.lesson04.exercise05.order_ready:
    instruction: 'Arrange the words to say: I got myself ready.'
    accepted_answers:
    - value:
      - خودم
      - رو
      - آماده
      - کردم
      status: correct
    feedback: '*خودم رو آماده کردم*: *خودم رو* comes before the verb part.'
  fa.a2.unit45.lesson04.exercise06.fill_ready:
    instruction: 'Complete the sentence with a word for “ready”: I got myself ready.'
    accepted_answers:
    - value: آماده
      status: correct
    feedback: The full sentence is *خودم رو آماده کردم*.
  fa.a2.unit45.lesson04.exercise07.translate_dinner:
    instruction: 'Translate into Farsi, stressing that you did it yourself: I made dinner myself.'
    accepted_answers:
    - value: خودم شام درست کردم
      status: correct
    - value: شام رو خودم درست کردم
      status: correct
    - value: خودم شام رو درست کردم
      status: correct
    - value: من خودم شام درست کردم
      status: acceptable_with_note
      note: '*من* is correct but normally omitted.'
    feedback: 'Model: *خودم شام درست کردم.*'
  fa.a2.unit45.lesson04.exercise08.translate_tired:
    instruction: 'Translate into Farsi: This week I tired myself out.'
    accepted_answers:
    - value: این هفته خودم رو خسته کردم
      status: correct
    - value: خودم رو این هفته خسته کردم
      status: correct
