teaching:
  fa.a2.unit22.lesson01.teach.people_time:
    title: People and time
    gloss: I, you, Sara, Nima, today, morning, late
    note: '*امروز صبح* means “this morning.” Persian often leaves out *من* because the verb ending already means “I.”'
    example_gloss: [I woke up late this morning., Sara called Nima today.]
  fa.a2.unit22.lesson01.teach.morning_nouns:
    title: Morning and commute words
    gloss: home, shower, clothes, breakfast, key, door, car, bus
    note: '*صبحونه* is the ordinary spoken form of “breakfast”; careful writing uses *صبحانه*.'
    example_gloss: [I took a shower at home., I ate breakfast and got dressed., My key was in the car.]
  fa.a2.unit22.lesson01.teach.actions:
    title: Four morning actions
    gloss: I woke up, I took a shower, I got dressed, I ate breakfast
    note: Each expression ends in a simple-past light verb. Learn the whole expression as one action.
    example_gloss: [I woke up this morning., Then I took a shower., I got dressed and ate breakfast.]
  fa.a2.unit22.lesson01.teach.compound_shape:
    title: Compound verbs in the past
    gloss: I woke up, took a shower, got dressed
    note: 'Many Persian actions have two parts: a noun or adjective plus a light verb. The second part carries the past tense: *بیدار شدم*, *دوش گرفتم*, *لباس پوشیدم*.'
  fa.a2.unit22.lesson02.teach.more_actions:
    title: Doors, cars, calls, and letters
    gloss: I opened the door, closed the door, started the car, called, wrote a letter
    note: '*رو* marks a definite spoken object: *در رو* is “the door,” and *ماشین رو* is “the car.”'
    example_gloss: [I opened the door and then closed it., I started the car., I called Sara and wrote a letter.]
  fa.a2.unit22.lesson02.teach.small_words:
    title: Useful small words
    gloss: to, a, and, but, what, I arrived
    note: '*یه* is the normal spoken form of “a/one.” *رسیدم* closes a commute account: “I arrived.”'
    example_gloss: [I called Sara., I wrote a letter but arrived late.]
  fa.a2.unit22.lesson02.teach.sequence:
    title: Step-by-step words
    gloss: first, then, after that, in the end, by then
    note: "Use these words to make the order explicit. *تا اون موقع* means 'by then'. With it, the earlier event takes the past perfect (participle + بود): *اتوبوس رفته بود* = the bus had gone. You will drill this form in a later unit."
    example_gloss: [First I opened the door., After that I started the car., By then it was late; in the end I arrived.]
  fa.a2.unit22.lesson02.teach.light_verbs:
    title: The light verb carries the tense
    gloss: opened, turned on, called, woke up
    note: 'The first element names the action; the second element changes for tense and person: *باز کردم*, *روشن کردم*, *زنگ زدم*, *بیدار شدم*.'
  fa.a2.unit22.lesson02.teach.ro_rule:
    title: Definite رو, indefinite یه
    gloss: I opened the door; I wrote a letter
    note: 'Use spoken *رو* after a definite object: *در رو باز کردم*. An indefinite object with *یه* normally has no *رو*: *یه نامه نوشتم*.'
  fa.a2.unit22.lesson03.teach.negative_forms:
    title: Negative compound verbs
    gloss: I did not work, did not call, did not eat breakfast, did not open the door
    note: 'Put *نـ* on the conjugated light verb: *کار نکردم*, *زنگ نزدم*, *صبحونه نخوردم*. The noun stays unchanged.'
  fa.a2.unit22.lesson03.teach.negative_place:
    title: Negate the light verb—not the noun
    gloss: نـ attaches to the light verb
    note: 'Say *کار نکردم* and *زنگ نزدم*. Moving the negative onto the noun produces a wrong form.'
  fa.a2.unit22.lesson03.teach.definite_indefinite:
    title: رو present or absent
    gloss: I closed the door; I wrote a letter
    note: '*در* is a known, definite door, so it takes *رو*. *یه نامه* is indefinite, so it does not.'
  fa.a2.unit22.lesson04.teach.problem_actions:
    title: When the morning goes wrong
    gloss: I found it, did not find it, I forgot, I missed the bus
    note: '*از دستم رفت* literally says something “went out of my hand”; with a bus it means “I missed it.”'
    example_gloss: [I found my key., I did not find my key and missed the bus., I forgot the letter.]
  fa.a2.unit22.lesson04.teach.question:
    title: What happened next?
    gloss: What happened this morning? What happened after that?
    note: These questions invite an ordered account, so answer with sequencing words and past forms.
  fa.a2.unit22.lesson05.teach.reading:
    title: A morning that went wrong
    gloss: This morning I woke up late. First I showered and got dressed. I did not eat breakfast. After that I closed the door, but I could not find my key. By then the bus had gone. In the end I called Sara and arrived by car.
    note: Read once for the ordered actions, then again for the two steps that did not go as planned.
  fa.a2.unit22.lesson06.teach.turn01: {title: Sara asks what happened, gloss: 'Sara asks Nima: What happened this morning?', note: The opening asks for the whole sequence.}
  fa.a2.unit22.lesson06.teach.turn02: {title: Nima starts the account, gloss: Nima woke late, showered and dressed, but did not eat breakfast., note: The negative step contrasts with the completed steps.}
  fa.a2.unit22.lesson06.teach.turn03: {title: Sara asks for the next step, gloss: 'Sara asks: What happened after that?', note: '*بعدش* keeps the account moving.'}
  fa.a2.unit22.lesson06.teach.turn04: {title: The commute problem, gloss: Nima could not find his key and by then the bus had gone., note: The two facts explain where the morning went wrong.}
  fa.a2.unit22.lesson06.teach.turn05: {title: Sara asks for the ending, gloss: 'Sara asks: What did you do in the end?', note: '*آخرش* signals the final step.'}
  fa.a2.unit22.lesson06.teach.turn06: {title: Nima finishes the account, gloss: Nima called Sara, started the car, and finally arrived., note: The final two completed actions resolve the commute problem.}
