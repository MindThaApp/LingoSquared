  fa.a2.unit22.lesson02.exercise03.match_light_verbs:
    instruction: Match each complete past expression with its meaning.
    accepted_answers:
    - value: {باز کردم: I opened, بستم: I closed, روشن کردم: I turned on, زنگ زدم: I called, بیدار شدم: I woke up, دوش گرفتم: I took a shower, لباس پوشیدم: I got dressed, نامه نوشتم: I wrote a letter}
