course:
  title: Farsi A2
  description: >-
    Lower-intermediate Iranian Farsi: handling a formal appointment to
    update your address at a government-services office -- vocabulary,
    making the appointment, reading an official notice, and the
    appointment itself.

units:
  fa.a2.unit09.bureaucracy:
    title: Administrative errands

lessons:
  fa.a2.unit09.lesson01.bureaucracy_vocabulary: {title: "Words for dealing with an office"}
  fa.a2.unit09.lesson02.making_an_appointment: {title: "Making an appointment"}
  fa.a2.unit09.lesson03.reading_the_notice: {title: "Reading the notice"}
  fa.a2.unit09.lesson04.at_the_registry_office: {title: "At the government-services office"}

teaching:
  fa.a2.unit09.lesson01.teach.vaght_word:
    title: "Appointment"
    gloss: "appointment / time slot"
    note: "*وقت* literally means 'time'; *وقت گرفتن* (to take an appointment) is the everyday way to say 'make an appointment' in Persian."
  fa.a2.unit09.lesson01.teach.madrak_word:
    title: "Document"
    gloss: "document"
    note: "*مدرک* is the general word for an official document or ID paper."
  fa.a2.unit09.lesson01.teach.address_word:
    title: "Address"
    gloss: "address"
    note: "*آدرس* is the everyday word for a home or mailing address."
  fa.a2.unit09.lesson01.teach.ghabz_word:
    title: "Utility bill"
    gloss: "utility bill"
    note: "*قبض* refers to a bill (water, electricity, gas) -- commonly accepted as proof of residency."
  fa.a2.unit09.lesson01.teach.national_id_word:
    title: "National ID card"
    gloss: "national ID card"
    note: "*کارت ملی* is Iran's national identity card, the document being updated in this unit."
  fa.a2.unit09.lesson01.teach.va_word:
    title: "And"
    gloss: "and"
    note: "*و* is the common connecting word used throughout this unit."

  fa.a2.unit09.lesson02.teach.request_appointment:
    title: "Ask to make an appointment"
    gloss: "I'd like to make an appointment to change my address."
    note: "*می‌خواستم* (literally 'I was wanting') softens a request, the natural Persian equivalent of English's polite 'I was wondering whether...'."
  fa.a2.unit09.lesson02.teach.because_moved:
    title: "Explain why, with چون (because)"
    gloss: "Because I changed my home, I need to change my address."
    note: "*چون* introduces the reason -- an A2-level subordinate clause, a step up from A1's simple statements."
  fa.a2.unit09.lesson02.teach.what_should_i_bring:
    title: "Ask what to bring, politely"
    gloss: "Could you tell me what I should bring?"
    note: "*می‌شه...؟* ('would it be possible...?') is a polite indirect question form."

  fa.a2.unit09.lesson03.teach.lease_word:
    title: "Lease"
    gloss: "lease agreement"
    note: "*اجاره‌نامه* is a rental/lease contract, one possible proof-of-residency document."
  fa.a2.unit09.lesson03.teach.deadline_word:
    title: "Deadline"
    gloss: "deadline"
    note: "*مهلت* is the general word for a deadline or time limit."
  fa.a2.unit09.lesson03.teach.notice_text:
    title: "An office notice about updating your address"
    gloss: "To change your address, please bring your old national ID card and a water or electricity bill. The registration deadline is by the end of this month."
    note: "A short official notice in a neutral written style. It still uses the everyday spoken *بیارید* (instead of *بیاورید*), which is how such notices are often worded."
  fa.a2.unit09.lesson03.teach.i_will_bring_bill:
    title: "Say what you'll bring"
    gloss: "I'll bring the water bill."
    note: "*میارم* is the everyday spoken contraction of *می‌آورم* (I bring)."

  fa.a2.unit09.lesson04.teach.turn01:
    title: "The clerk greets سارا"
    gloss: "The clerk invites her in and asks how they can help."
    note: "*بفرمایید* invites her forward; *چه کمکی از دستم برمیاد؟* is a polite, ordinary way a clerk offers help."
  fa.a2.unit09.lesson04.teach.turn02:
    title: "سارا asks for an appointment"
    gloss: "سارا says she'd like to make an appointment to change her address."
    note: "Reuses lesson02's *می‌خواستم* request pattern."
  fa.a2.unit09.lesson04.teach.turn03:
    title: "The clerk asks since when"
    gloss: "The clerk asks since when she's lived at the new address."
    note: "*از کی...؟* asks 'since when'."
  fa.a2.unit09.lesson04.teach.turn04:
    title: "سارا answers and asks what to bring"
    gloss: "She says since last month, and asks what she should bring."
    note: "Combines the *از ماه پیش* fact with lesson02's *می‌شه بگید...؟* question."
  fa.a2.unit09.lesson04.teach.turn05:
    title: "The clerk lists the documents"
    gloss: "The clerk says the old national ID card and a water or electricity bill are enough."
    note: "*کافیه* (colloquial for *کافی است*) means 'is enough'."
  fa.a2.unit09.lesson04.teach.turn06:
    title: "سارا proposes a day"
    gloss: "She asks if she can come on Tuesday."
    note: "*می‌تونم...؟* asks about ability/permission, colloquial for *می‌توانم*."
  fa.a2.unit09.lesson04.teach.turn07:
    title: "The clerk confirms and gives a tracking code"
    gloss: "The clerk confirms Tuesday at ten o'clock and gives the tracking code 2214."
    note: "*کد پیگیری* is the tracking/reference code for the appointment."

exercises:
  fa.a2.unit09.lesson01.exercise01.recognize_vaght:
    instruction: "What does this word mean?"
    correct_option: "appointment"
    distractors: ["document", "address", "utility bill"]
    accepted_answers: [{value: "appointment", status: correct}]
    feedback: "*وقت* means appointment or time slot."
  fa.a2.unit09.lesson01.exercise02.recognize_madrak:
    instruction: "What does this word mean?"
    correct_option: "document"
    distractors: ["appointment", "address", "national ID card"]
    accepted_answers: [{value: "document", status: correct}]
    feedback: "*مدرک* means document."
  fa.a2.unit09.lesson01.exercise03.match_bureaucracy_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {وقت: appointment, مدرک: document, آدرس: address, قبض: "utility bill", "کارت ملی": "national ID card"}, status: correct}
    feedback: "These five words cover the basic vocabulary for this unit's office visit."
  fa.a2.unit09.lesson01.exercise04.order_madrak_address:
    instruction: "Arrange the words to say document and address."
    accepted_answers: [{value: [مدرک, و, آدرس], status: correct}]
    feedback: "*مدرک و آدرس* joins the two words with *و*."
  fa.a2.unit09.lesson01.exercise05.write_national_id:
    instruction: "Write the Farsi phrase for national ID card."
    accepted_answers:
      - {value: "کارت ملی", status: correct}
    feedback: "*کارت ملی* means national ID card."

  fa.a2.unit09.lesson02.exercise01.recognize_request_appointment:
    instruction: "Which phrase politely asks to make an appointment?"
    correct_option: "I'd like to make an appointment to change my address."
    distractors: ["Because I changed my home, I need to change my address.", "Could you tell me what I should bring?", "I'll bring the water bill."]
    accepted_answers: [{value: "I'd like to make an appointment to change my address.", status: correct}]
    feedback: "*می‌خواستم برای تغییر آدرس وقت بگیرم.* softly requests the appointment."
  fa.a2.unit09.lesson02.exercise02.recognize_because_clause:
    instruction: "Which sentence gives a reason using because?"
    correct_option: "Because I changed my home, I need to change my address."
    distractors: ["I'd like to make an appointment to change my address.", "Could you tell me what I should bring?", "The registration deadline is by the end of this month."]
    accepted_answers: [{value: "Because I changed my home, I need to change my address.", status: correct}]
    feedback: "*چون* introduces the reason clause."
  fa.a2.unit09.lesson02.exercise03.order_what_should_i_bring:
    instruction: "Arrange the words to politely ask what you should bring."
    accepted_answers: [{value: [می‌شه, بگید, چی, باید, بیارم], status: correct}]
    feedback: "*می‌شه بگید چی باید بیارم؟* politely asks what to bring."
  fa.a2.unit09.lesson02.exercise04.dialogue_response_why_change:
    instruction: "The clerk asks: 'Why do you need to change your address?' Answer with your reason."
    accepted_answers:
      - {value: "چون خونه‌مو عوض کردم، باید آدرسمو عوض کنم.", status: correct}
      - {value: "چون خونه‌مو عوض کردم. باید آدرسمو عوض کنم.", status: correct}
      - {value: "چون خونه‌مو عوض کردم و باید آدرسمو عوض کنم", status: correct}
    feedback: "Joining the reason and result with a comma, a period, or *و* are equally natural."
  fa.a2.unit09.lesson02.exercise05.write_appointment_request:
    instruction: "Write that you'd like to make an appointment to change your address."
    accepted_answers:
      - {value: "می‌خواستم برای تغییر آدرس وقت بگیرم.", status: correct}
      - {value: "می‌خواستم برای تغییر آدرس وقت بگیرم", status: correct}
    feedback: "*می‌خواستم برای تغییر آدرس وقت بگیرم.* is the polite request."

  fa.a2.unit09.lesson03.exercise01.read_required_documents:
    instruction: "According to the notice, what documents should you bring to register?"
    correct_option: "old national ID card and a water or electricity bill"
    distractors: ["a lease agreement only", "a passport and a photo", "nothing, just your name"]
    accepted_answers: [{value: "old national ID card and a water or electricity bill", status: correct}]
    feedback: "The notice asks for your old *کارت ملی* and one *قبض آب یا برق*."
  fa.a2.unit09.lesson03.exercise02.read_deadline:
    instruction: "According to the notice, when is the registration deadline?"
    correct_option: "by the end of this month"
    distractors: ["by the end of this week", "by the end of next month", "there is no deadline"]
    accepted_answers: [{value: "by the end of this month", status: correct}]
    feedback: "*مهلت ثبت‌نام تا آخر همین ماه است* -- the deadline is the end of this month."
  fa.a2.unit09.lesson03.exercise03.recognize_lease_word:
    instruction: "What does this word mean?"
    correct_option: "lease agreement"
    distractors: ["deadline", "utility bill", "national ID card"]
    accepted_answers: [{value: "lease agreement", status: correct}]
    feedback: "*اجاره‌نامه* means lease agreement."
  fa.a2.unit09.lesson03.exercise04.order_bring_documents:
    instruction: "Arrange the words to say bring the old national ID card and a water or electricity bill."
    accepted_answers: [{value: ["کارت", ملی, قدیم, و, یک, قبض, آب, یا, برق, بیارید], status: correct}]
    feedback: "*کارت ملی قدیم و یک قبض آب یا برق بیارید* is the required list, matching the notice exactly."
  fa.a2.unit09.lesson03.exercise05.write_will_bring_bill:
    instruction: "Write that you'll bring the water bill."
    accepted_answers:
      - {value: "قبض آب رو میارم.", status: correct}
      - {value: "قبض آب رو میارم", status: correct}
    feedback: "*قبض آب رو میارم.* says you'll bring the water bill."

  fa.a2.unit09.lesson04.exercise01.comprehend_since_when:
    instruction: "Since when has سارا lived at the new address?"
    correct_option: "since last month"
    distractors: ["since last week", "since last year", "since yesterday"]
    accepted_answers: [{value: "since last month", status: correct}]
    feedback: "*از ماه پیش* -- since last month."
  fa.a2.unit09.lesson04.exercise02.comprehend_required_documents:
    instruction: "What does the clerk say سارا needs to bring?"
    correct_option: "her old national ID card and a water or electricity bill"
    distractors: ["a passport only", "a lease agreement only", "nothing at all"]
    accepted_answers: [{value: "her old national ID card and a water or electricity bill", status: correct}]
    feedback: "*کارت ملی قدیم و یک قبض آب یا برق کافیه* -- the old national ID card and one utility bill are enough."
  fa.a2.unit09.lesson04.exercise03.recognize_appointment_day:
    instruction: "سارا's appointment is for which day and time?"
    correct_option: "Tuesday at ten o'clock"
    distractors: ["Wednesday at ten o'clock", "Tuesday at nine o'clock", "Thursday at eleven o'clock"]
    accepted_answers: [{value: "Tuesday at ten o'clock", status: correct}]
    feedback: "*سه‌شنبه ساعت ده خوبه* -- Tuesday at ten o'clock works."
  fa.a2.unit09.lesson04.exercise04.order_since_when_question:
    instruction: "Arrange the words to ask since when someone has lived at their new address."
    accepted_answers: [{value: [از, کی, تو, آدرس, جدید, زندگی, می‌کنید], status: correct}]
    feedback: "*از کی تو آدرس جدید زندگی می‌کنید؟* asks since when."
  fa.a2.unit09.lesson04.exercise05.dialogue_response_as_sara:
    instruction: "The clerk asks: 'Since when have you lived at the new address?' Answer as سارا, then ask what you should bring."
    accepted_answers:
      - {value: "از ماه پیش. می‌شه بگید چی باید بیارم؟", status: correct}
      - {value: "از ماه پیش، می‌شه بگید چی باید بیارم؟", status: correct}
      - {value: "از ماه پیش و می‌شه بگید چی باید بیارم؟", status: correct}
    feedback: "Joining the answer and the follow-up question with a period, a comma, or *و* are equally natural."
  fa.a2.unit09.lesson04.exercise06.write_registry_summary:
    instruction: "Write, quoting the clerk, what documents are enough to bring."
    accepted_answers:
      - {value: "کارت ملی قدیم و یک قبض آب یا برق کافیه.", status: correct}
      - {value: "کارت ملی قدیم و یک قبض آب یا برق کافیه", status: correct}
    feedback: "*کارت ملی قدیم و یک قبض آب یا برق کافیه.* is the clerk's own answer, quoted directly."
