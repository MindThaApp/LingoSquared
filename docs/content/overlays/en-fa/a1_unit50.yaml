review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), paired with the realization
    file's own review pass -- see that file's review notes for full
    detail (compiler validation 0/0 errors standalone and combined with
    units 47-49, boolean-coercion/Arabic-codepoint/jargon-leak scans all
    clean, same-speaker distractor check clean, character-name collision
    check clean, bill-total arithmetic verified correct, price
    consistency confirmed, matching_pairs shape consistent with
    established corpus convention). Nothing needed fixing on the overlay
    side either -- every gloss/title/note/feedback string read for
    accuracy against its paired realization text, every "Translate into
    English" exercise confirmed to set answer_language_code: en. Marking
    reviewed.

    Draft overlay paired with the fa.a1.unit50.restaurant realization. See
    that file's generation_provenance for the honest source-access result:
    tried `firecrawl search "FSI Persian Basic Course restaurant رستوران
    menu order food"` first, per the standing instruction to re-check
    Firecrawl quota fresh even though it was reported exhausted in every
    earlier round this session -- it returned `Error: Request failed with
    status code 402` (payment required), confirming the account genuinely
    remains at 0 credits. Fell back to this session's own cached local
    `pdftotext -layout` extraction of the same Live Lingua-hosted FSI
    Spoken Persian PDF every prior fa unit this session has used (~66,700
    words). Unlike most recent units' dead-end searches, this one found a
    real hit: pp.155-157 contain a genuine multi-turn restaurant
    "Conversation" scene with a labelled "Waiter:" speaker. Read closely
    but deliberately NOT adapted, for two concrete reasons: (1) it centers
    on ordering wine and beer by the bottle, inappropriate to adapt given
    public alcohol consumption is illegal in Iran today and every other fa
    unit in this corpus has used non-alcoholic staples instead; (2) it is a
    three-party formal business conversation well past this course's
    established A1 two-party (نیما + one service character) shape. Used
    only as confirmation that FSI Persian genuinely covers a restaurant
    scene structurally (menu inquiry -> order food -> order drink -> ask
    for/settle the bill), validating this unit's own already-planned beat
    sequence, not as a source of adapted sentences -- all vocabulary and
    the full dialogue are authored fresh from this project's own
    established conventions, substituting the non-alcoholic Iranian
    staples چلوکباب (chelo kabab) and دوغ (doogh) for the source's
    wine/beer order.

    Relationship to unit06 (food): unit06 already realizes
    universal.a1.food.order_simple_meal with its own restaurant scene
    (un-named گارسون/مشتری ordering جوجه‌کباب, plus منو/صورت‌حساب/توصیه
    می‌کنید/چی میل دارید/بفرمایید) but never states a single price or a
    bill total. This unit realizes the distinct, later
    universal.a1.restaurant.dine_at_restaurant outcome, which specifically
    layers "ask what something costs" and "ask for the bill" onto that
    existing food-ordering skill -- it deliberately reuses unit06's own
    established restaurant vocabulary (رستوران, منو, صورت‌حساب, and even
    unit06's own exact phrase صورت‌حساب رو لطف می‌کنید؟, all re-declared
    in this file's own introduced_tokens per the compiler's per-file-only
    check) rather than re-inventing parallel vocabulary, and adds the new
    price-and-bill layer: an itemized order with two stated prices and a
    summed total, a new NAMED waitress character (following this course's
    established units-40-49 نیما-plus-one-new-named-service-character
    convention, distinct from unit06's un-named گارسون/مشتری), and a
    reading exercise on a priced menu sign.

    Scenario/register note: unlike the swimming-pool unit's real
    gender-segregation constraint, Iranian restaurants and cafes commonly
    have female waitstaff with no authenticity concern either way, so this
    unit's new service character is authored female (خانم رحیمی)
    specifically to follow through on unit49's own review note that "a
    future unit should lean female to keep the corpus-wide balance
    reasonable" (unit49 left the corpus at 5 male vs 3 female named service
    characters; this unit brings it to 5 male vs 4 female). خانم رحیمی is
    distinct from unit40/42/44's آقای کریمی, unit41's خانم احمدی, unit42's
    آقای صادقی, unit45's خانم رضایی, unit46's آقای نوری, unit47's آقای
    مرادی, unit48's خانم کاظمی, and unit49's آقای جعفری (confirmed via a
    real scan of every آقای/خانم name already used across the fa corpus,
    zero collision). Reuse chain: رستوران (unit05/06), منو (unit06),
    چقدر/می‌شه (unit21/28/49, unit11/35/49), یه (unit05), می‌خوام
    (unit03), چهل/پنجاه/هزار/تومن (unit03/21, with تومنه reused directly
    from unit03's own "سی هزار تومنه" pattern), این/چنده (unit03), ده
    (unit03), هم/صورت‌حساب/لطف/می‌کنید (unit06), رو (unit30/32), سلام/
    ممنون (units01/17/22/45/46/47/48/49), باشه (units01/02/06/17/22/45/46/
    47/48/49), خوبه (unit06/10/12/19/48), خانم (unit41/45/48), هست (unit01/
    04/05/12). New vocabulary genuinely introduced for the first time in
    the whole corpus: چلوکباب (chelo kabab), دوغ (doogh), and سفارش
    (order) -- exactly 3 new words. No new verb-conjugation pattern is
    introduced -- سفارش می‌دم reuses the exact می‌دم present-tense
    colloquial form already established by unit24's گوش می‌دم ("I
    listen"). The chelo kabab price (چهل هزار تومن) and doogh price (ده
    هزار تومن) are kept identical across the dialogue, the restaurant-sign
    reading text, and the wrap-up review, and the dialogue's stated bill
    total (پنجاه هزار تومن) is the correct sum of the two item prices,
    per AUTHORING_GUIDE.md #11. Every "Translate into English" exercise
    below explicitly sets answer_language_code: en. No exercise in this
    unit tests a genuine two-clause sentence joined by "and"/comma (§12)
    -- every multi-sentence line is authored as two separate short
    sentences in both languages, matching how units 44/45/46/47/48/49
    already treat their own two-sentence notes. No listen_type/
    listen_select/listen_order exercise is used anywhere in this unit
    (continuing the established text-based corpus-consistency pattern
    from units 19-49, even though fa now has real Azure TTS per §14) --
    the spine outcome's "listening" assessment requirement is covered via
    the dialogue_comprehension exercise's comprehension-of-the-exchange
    task, the same interpretation units 41/42/44/45/46/47/48/49 already
    established. This also means the same-speaker/same-audio
    distractor-collision bug class fixed 2026-07-09 in the nl corpus
    (commit 148240e) cannot directly apply here -- verified anyway, per
    the standing instruction to list every line each speaker says before
    writing distractors: نیما says "سلام خانم رحیمی. چلوکباب
    می‌خوام."/"باشه. یه دوغ هم می‌خوام."/"خوبه. صورت‌حساب رو لطف
    می‌کنید؟"/"ممنون!"; خانم رحیمی says "سلام نیما. چلوکباب چهل هزار
    تومنه."/"دوغ ده هزار تومنه."/"پنجاه هزار تومن می‌شه." --
    lesson04's dialogue_comprehension distractors ("He wants more chelo
    kabab."/"He wants a table for two."/"He wants to see the menu.") are
    plausible-fact alternatives, not lines either speaker actually says
    or facts either speaker actually states anywhere in this unit's
    dialogue -- a second order, a table for two, and a menu request are
    never mentioned by either character. The dialogue_response exercise
    (lesson04) accepts نیما's own actual next line, not a distractor set,
    so this check doesn't apply to it. Boolean-coercion check: ran a
    recursive scan over title/gloss/note/example_gloss/answer/
    matching-pair value fields (including matching_pairs right: values
    specifically) across both this overlay and the paired realization for
    bare yes/no/true/false/on/off string values or coerced booleans, plus
    a full yaml.safe_load parse of both files confirming every loaded
    value is a str/list/dict rather than a Python bool -- zero hits.
    Persian-vs-Arabic codepoint scan (Arabic kaf U+0643/yeh U+064A) across
    both files -- zero hits. Compiler validation, both standalone and
    against the full 50-unit en-fa A1 corpus with position-matched
    realization/overlay lists, confirmed 0 errors (see this task's final
    report for the exact command and output).

course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: ordering food and a drink at a restaurant from
    a waitress, asking how much a dish costs, a full customer-to-waitress
    exchange that ends with asking for and settling the bill, and reading/
    writing a short restaurant sign naming a dish and its price.

units:
  fa.a1.unit50.restaurant: {title: Restaurant}

lessons:
  fa.a1.unit50.lesson01.new_restaurant_one: {title: "New words 1"}
  fa.a1.unit50.lesson02.new_restaurant_two: {title: "New words 2"}
  fa.a1.unit50.lesson03.doogh_and_bill: {title: "Doogh and the bill"}
  fa.a1.unit50.lesson04.restaurant_dialogue: {title: "Dialogue: at the restaurant"}
  fa.a1.unit50.lesson05.reading_restaurant_sign: {title: "Reading a restaurant sign"}
  fa.a1.unit50.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit50.lesson01.teach.review_resturan_menu:
    title: "Review: restaurant / menu"
    gloss: "restaurant / menu"
    note: "*رستوران* ('restaurant') was already taught in unit05/06; *منو* ('menu') was already taught in unit06."
  fa.a1.unit50.lesson01.teach.review_cheghadr_mishe:
    title: "Review: how much / it comes to"
    gloss: "how much / it comes to"
    note: "*چقدر* ('how much') was already taught in unit21/28/49; *می‌شه* ('it comes to, costs') was already taught in unit11/35/49."
  fa.a1.unit50.lesson01.teach.review_in:
    title: "Review: this"
    gloss: this
    note: "*این* ('this') was already taught in unit03/04/08/15/20/26/49."
  fa.a1.unit50.lesson01.teach.review_midam:
    title: "Review: I give / I'll order"
    gloss: "I give / I'll order"
    note: "*می‌دم* ('I give,' used idiomatically for 'I'll order') was already taught in unit24's *گوش می‌دم* ('I listen')."
  fa.a1.unit50.lesson01.teach.sefaresh:
    title: Order
    gloss: order
    note: "*سفارش* is a food or drink order at a restaurant."
    example_gloss: "I'll order."

  fa.a1.unit50.lesson02.teach.review_ye_mikhaam:
    title: "Review: a, an / I want"
    gloss: "a, an / I want"
    note: "*یه* ('a, an') was already taught in unit05; *می‌خوام* ('I want') was already taught in unit03."
  fa.a1.unit50.lesson02.teach.review_chehel_hezar_toman:
    title: "Review: forty / thousand / toman"
    gloss: "forty / thousand / toman"
    note: "*چهل* ('forty') was already taught in unit03; *هزار* ('thousand') and *تومن* ('toman') were already taught in unit03/unit21."
  fa.a1.unit50.lesson02.teach.chelokabab:
    title: "Chelo kabab"
    gloss: "chelo kabab"
    note: "*چلوکباب* is grilled kebab served with rice, one of Iran's most common restaurant dishes."
    example_gloss: "I want chelo kabab."

  fa.a1.unit50.lesson03.teach.review_in_chande:
    title: "Review: this / how much is it"
    gloss: "this / how much is it"
    note: "*این* ('this') was already taught in unit03/04/08/15/20/26/49; *چنده* ('how much is it') was already taught in unit03."
  fa.a1.unit50.lesson03.teach.review_dah_ham:
    title: "Review: ten / also"
    gloss: "ten / also"
    note: "*ده* ('ten') was already taught in unit03; *هم* ('also') was already taught in unit06."
  fa.a1.unit50.lesson03.teach.doogh:
    title: Doogh
    gloss: doogh
    note: "*دوغ* is a savory yogurt drink, a common accompaniment to a restaurant meal in Iran."
    example_gloss: "How much is the doogh?"
  fa.a1.unit50.lesson03.teach.hesab_lotf:
    title: "Could you get me the bill, please?"
    gloss: "Could you get me the bill, please?"
    note: "A polite request for the bill, reusing *صورت‌حساب* ('bill') already taught in unit06, plus already-known *رو*/*لطف*/*می‌کنید*."

  fa.a1.unit50.lesson04.teach.review_salam_mamnoon:
    title: "Review: hi / thanks"
    gloss: "hi / thanks"
    note: "*سلام* and *ممنون* were already taught in units 01/17/22/45/46/47/48/49."
  fa.a1.unit50.lesson04.teach.review_bashe_khoobe:
    title: "Review: okay / good"
    gloss: "okay / good"
    note: "*باشه* ('okay') was already taught in units 01/02/06/17/22/45/46/47/48/49; *خوبه* ('good, that's fine') was already taught in unit06/10/12/19/48."
  fa.a1.unit50.lesson04.teach.review_khanom_hast:
    title: "Review: Ms. / there is"
    gloss: "Ms. / there is"
    note: "*خانم* ('Ms.') was already taught in unit41/45/48; *هست* ('there is') was already taught in unit01/04/05/12."
  fa.a1.unit50.lesson04.teach.review_panjah:
    title: "Review: fifty"
    gloss: fifty
    note: "*پنجاه* ('fifty') was already taught in unit03."
  fa.a1.unit50.lesson04.teach.character_rahimi:
    title: "Ms. Rahimi"
    gloss: "Ms. Rahimi"
    note: "*خانم رحیمی* is this unit's new restaurant waitress character, distinct from every other named service-encounter character already in this course."
    example_gloss: "Hi Ms. Rahimi!"
  fa.a1.unit50.lesson04.teach.dialogue_line1:
    title: "Nima: Hi Ms. Rahimi. I want chelo kabab."
    gloss: "Hi Ms. Rahimi. I want chelo kabab."
  fa.a1.unit50.lesson04.teach.dialogue_line2:
    title: "Ms. Rahimi: Hi Nima. The chelo kabab is 40,000 toman."
    gloss: "Hi Nima. The chelo kabab is 40,000 toman."
  fa.a1.unit50.lesson04.teach.dialogue_line3:
    title: "Nima: Okay. I also want a doogh."
    gloss: "Okay. I also want a doogh."
  fa.a1.unit50.lesson04.teach.dialogue_line4:
    title: "Ms. Rahimi: Doogh is 10,000 toman."
    gloss: "Doogh is 10,000 toman."
  fa.a1.unit50.lesson04.teach.dialogue_line5:
    title: "Nima: Good. Could you get me the bill, please?"
    gloss: "Good. Could you get me the bill, please?"
  fa.a1.unit50.lesson04.teach.dialogue_line6:
    title: "Ms. Rahimi: That comes to 50,000 toman."
    gloss: "That comes to 50,000 toman."
  fa.a1.unit50.lesson04.teach.dialogue_line7:
    title: "Nima: Thanks!"
    gloss: "Thanks!"

  fa.a1.unit50.lesson05.teach.reading_text:
    title: "Reading: a restaurant sign"
    gloss: "Rahimi Restaurant: chelo kabab 40,000 toman. Doogh 10,000 toman."
    note: "A short restaurant sign naming a dish, a drink, and their prices."

  fa.a1.unit50.lesson06.teach.review_request:
    title: "I want chelo kabab. I also want a doogh."
    gloss: "I want chelo kabab. I also want a doogh."
    note: "A full review sentence reusing only already-known words from this unit."
  fa.a1.unit50.lesson06.teach.review_price:
    title: "The chelo kabab is 40,000 toman. The doogh is 10,000 toman."
    gloss: "The chelo kabab is 40,000 toman. The doogh is 10,000 toman."
  fa.a1.unit50.lesson06.teach.summary_words:
    title: "Restaurant / chelo kabab / doogh / order / Could you get me the bill, please?"
    gloss: "restaurant / chelo kabab / doogh / order / could you get me the bill, please?"
    note: "These are the key words and phrases taught in this unit."

exercises:
  fa.a1.unit50.lesson01.exercise01.recognize_sefaresh:
    instruction: "What does this word mean?"
    correct_option: order
    distractors: [menu, bill, waiter]
    accepted_answers: [{value: order, status: correct}]
    feedback: "سفارش means 'order.'"
  fa.a1.unit50.lesson01.exercise02.recognize_sefaresh_midam:
    instruction: "What does this sentence mean?"
    correct_option: "I'll order."
    distractors: ["I don't want anything.", "I have the menu.", "I want the bill."]
    accepted_answers: [{value: "I'll order.", status: correct}]
    feedback: "سفارش می‌دم means 'I'll order.'"
  fa.a1.unit50.lesson01.exercise03.match_restaurant_one:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {رستوران: restaurant, منو: menu, چقدر: "how much", "می‌شه": "it comes to", سفارش: order, "سفارش می‌دم.": "I'll order."}
        status: correct
    feedback: "These are the first new restaurant words for this unit."
  fa.a1.unit50.lesson01.exercise04.word_order_sefaresh_midam:
    instruction: "Put the words in order."
    accepted_answers: [{value: [سفارش, "می‌دم"], status: correct}]
    feedback: "سفارش می‌دم means 'I'll order.'"
  fa.a1.unit50.lesson01.exercise05.translate_in_menu:
    instruction: "Translate into English: این منو"
    answer_language_code: en
    accepted_answers:
      - {value: "This menu.", status: correct}
      - {value: "this menu", status: correct}
    feedback: "این منو means 'this menu.'"

  fa.a1.unit50.lesson02.exercise01.recognize_chelokabab:
    instruction: "What does this word mean?"
    correct_option: "chelo kabab"
    distractors: [rice, chicken, bread]
    accepted_answers: [{value: "chelo kabab", status: correct}]
    feedback: "چلوکباب means 'chelo kabab' -- grilled kebab served with rice."
  fa.a1.unit50.lesson02.exercise02.recognize_chelokabab_mikhaam:
    instruction: "What does this sentence mean?"
    correct_option: "I want chelo kabab."
    distractors: ["I don't want chelo kabab.", "I want tea.", "I want the menu."]
    accepted_answers: [{value: "I want chelo kabab.", status: correct}]
    feedback: "چلوکباب می‌خوام means 'I want chelo kabab.'"
  fa.a1.unit50.lesson02.exercise03.match_restaurant_two:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {چلوکباب: "chelo kabab", یه: a, "می‌خوام": "I want", چهل: forty, هزار: thousand, تومن: toman, "چلوکباب چهل هزار تومنه.": "The chelo kabab is 40,000 toman."}
        status: correct
    feedback: "These words let you order chelo kabab and hear its price."
  fa.a1.unit50.lesson02.exercise04.word_order_chelokabab_chehel_hezar_tomane:
    instruction: "Put the words in order."
    accepted_answers: [{value: [چلوکباب, چهل, هزار, "تومنه"], status: correct}]
    feedback: "چلوکباب چهل هزار تومنه means 'The chelo kabab is 40,000 toman.'"
  fa.a1.unit50.lesson02.exercise05.translate_ye_chelokabab:
    instruction: "Translate into English: یه چلوکباب"
    answer_language_code: en
    accepted_answers:
      - {value: "A chelo kabab.", status: correct}
      - {value: "One chelo kabab.", status: correct}
      - {value: "a chelo kabab", status: correct}
      - {value: "A chelo kabab", status: correct}
    feedback: "یه چلوکباب means 'a chelo kabab.'"

  fa.a1.unit50.lesson03.exercise01.recognize_doogh:
    instruction: "What does this word mean?"
    correct_option: doogh
    distractors: [water, tea, coffee]
    accepted_answers: [{value: doogh, status: correct}]
    feedback: "دوغ means 'doogh' -- a savory yogurt drink."
  fa.a1.unit50.lesson03.exercise02.recognize_doogh_chande:
    instruction: "What does this sentence mean?"
    correct_option: "How much is the doogh?"
    distractors: ["Where is the doogh?", "Do you have doogh?", "I want doogh."]
    accepted_answers: [{value: "How much is the doogh?", status: correct}]
    feedback: "دوغ چنده؟ means 'How much is the doogh?'"
  fa.a1.unit50.lesson03.exercise03.match_doogh_and_bill:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {دوغ: doogh, این: this, چنده: "how much is it", ده: ten, هم: also, "دوغ چنده؟": "How much is the doogh?", "صورت‌حساب رو لطف می‌کنید؟": "Could you get me the bill, please?"}
        status: correct
    feedback: "These words let you order a doogh and ask for the bill."
  fa.a1.unit50.lesson03.exercise04.word_order_doogh_chande:
    instruction: "Put the words in order."
    accepted_answers: [{value: [دوغ, چنده], status: correct}]
    feedback: "دوغ چنده means 'How much is the doogh?'"
  fa.a1.unit50.lesson03.exercise05.translate_in_doogh:
    instruction: "Translate into English: این دوغ"
    answer_language_code: en
    accepted_answers:
      - {value: "This doogh.", status: correct}
      - {value: "this doogh", status: correct}
    feedback: "این دوغ means 'this doogh.'"

  fa.a1.unit50.lesson04.exercise01.dialogue_comprehension_bill:
    instruction: "Nima asks Ms. Rahimi something. What does he want?"
    correct_option: "He wants the bill."
    distractors:
      - "He wants more chelo kabab."
      - "He wants a table for two."
      - "He wants to see the menu."
    accepted_answers: [{value: "He wants the bill.", status: correct}]
    feedback: "صورت‌حساب رو لطف می‌کنید؟ means 'Could you get me the bill, please?'"
  fa.a1.unit50.lesson04.exercise02.recognize_dialogue_line4:
    instruction: "What does this sentence mean?"
    correct_option: "Doogh is 10,000 toman."
    distractors:
      - "Doogh is free."
      - "There's no doogh."
      - "Doogh is 100,000 toman."
    accepted_answers: [{value: "Doogh is 10,000 toman.", status: correct}]
    feedback: "دوغ ده هزار تومنه means 'Doogh is 10,000 toman.'"
  fa.a1.unit50.lesson04.exercise03.match_dialogue_restaurant:
    instruction: "Match each line with its meaning."
    accepted_answers:
      - value: {"سلام خانم رحیمی. چلوکباب می‌خوام.": "Hi Ms. Rahimi. I want chelo kabab.", "سلام نیما. چلوکباب چهل هزار تومنه.": "Hi Nima. The chelo kabab is 40,000 toman.", "باشه. یه دوغ هم می‌خوام.": "Okay. I also want a doogh.", "دوغ ده هزار تومنه.": "Doogh is 10,000 toman.", "خوبه. صورت‌حساب رو لطف می‌کنید؟": "Good. Could you get me the bill, please?", "پنجاه هزار تومن می‌شه.": "That comes to 50,000 toman.", "ممنون!": "Thanks!"}
        status: correct
    feedback: "These lines appear in the restaurant conversation between Nima and Ms. Rahimi."
  fa.a1.unit50.lesson04.exercise04.dialogue_response_thanks:
    instruction: "Respond to پنجاه هزار تومن می‌شه by saying thanks."
    accepted_answers:
      - {value: "ممنون!", status: correct}
