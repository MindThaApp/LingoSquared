course:
  title: "Farsi A1"
  description: >-
    Beginner Iranian Persian: daily routine verbs, describing a routine
    with times, parts of the day, reading a short routine text,
    comparing routines, and a full dialogue about two people's daily
    schedules.

units:
  fa.a1.unit11.routines:
    title: "Describing a daily routine"

lessons:
  fa.a1.unit11.lesson01.routine_verbs: {title: "Daily routine verbs"}
  fa.a1.unit11.lesson02.routine_with_times: {title: "Routine with times"}
  fa.a1.unit11.lesson03.parts_of_the_day_review: {title: "Parts of the day (review)"}
  fa.a1.unit11.lesson04.reading_a_routine: {title: "Reading a daily routine"}
  fa.a1.unit11.lesson05.comparing_routines: {title: "Comparing routines"}
  fa.a1.unit11.lesson06.routine_dialogue: {title: "A conversation about daily routines"}

teaching:
  fa.a1.unit11.lesson01.teach.bidar_misham:
    title: "I wake up"
    gloss: "I wake up"
    note: "بیدار می‌شم is the colloquial Tehrani form of بیدار می‌شوم."
    example_gloss: "I wake up at seven every day."
  fa.a1.unit11.lesson01.teach.sobhune_mikhoram:
    title: "I eat breakfast"
    gloss: "I eat breakfast"
    note: "صبحونه می‌خورم uses the colloquial صبحونه (breakfast), rather than the more formal صبحانه."
    example_gloss: "I eat breakfast and go to work."
  fa.a1.unit11.lesson01.teach.miram_sarkar:
    title: "I go to work"
    gloss: "I go to work"
    note: "میرم سر کار is colloquial for می‌روم سر کار."
    example_gloss: "Then I go to work."
  fa.a1.unit11.lesson01.teach.mikhabam:
    title: "I go to sleep"
    gloss: "I go to sleep"
    note: "می‌خوابم means I sleep/go to sleep."
    example_gloss: "I go to sleep early at night."
  fa.a1.unit11.lesson01.teach.va_word:
    title: "And"
    gloss: "and"
    note: "*و* is the common connecting word used to join routine activities, as already introduced in Unit 9."
    example_gloss: "I wake up and eat breakfast."

  fa.a1.unit11.lesson02.teach.che_saat_bidar:
    title: "What time do you wake up?"
    gloss: "What time do you wake up?"
    note: "*ساعت چند بیدار می‌شی؟* reuses *ساعت چند* (what time) from Unit 9's time-telling lessons."
  fa.a1.unit11.lesson02.teach.saat_haft_bidar:
    title: "I wake up at seven."
    gloss: "I wake up at seven."
    note: "ساعت هفت بیدار می‌شم states a specific wake-up time."
  fa.a1.unit11.lesson02.teach.har_ruz:
    title: "Every day"
    gloss: "every day"
    note: "هر روز means every day, used to frame a routine as habitual."
    example_gloss: "I wake up at seven every day."

  fa.a1.unit11.lesson03.teach.bad:
    title: "After that"
    gloss: "after that"
    note: "بعدش means 'after that,' used to sequence routine activities."
    example_gloss: "I wake up, then I eat breakfast."
  fa.a1.unit11.lesson03.teach.parts_of_day:
    title: "Morning, noon, afternoon, night"
    gloss: "morning, noon, afternoon, night"
    note: "*صبح*, *ظهر*, *عصر* and *شب* are the four parts of the day, reviewed from Unit 9."
    example_gloss: ["I wake up in the morning.", "I eat lunch at noon.", "I work in the afternoon.", "I sleep at night."]
  fa.a1.unit11.lesson03.teach.night_routine:
    title: "At night I go to sleep at eleven."
    gloss: "At night I go to sleep at eleven."
    note: "*شب‌ها ساعت یازده می‌خوابم* builds on *شب* (night) from Unit 9's parts-of-the-day vocabulary; *شب‌ها* means 'at night' as a habit."

  fa.a1.unit11.lesson04.teach.routine_text:
    title: "Routine text"
    gloss: "Every day I wake up at seven. After that I eat breakfast and go to work."
    note: "This is a real connected description of a morning routine, using هر روز and بعدش to sequence the activities."

  fa.a1.unit11.lesson05.teach.tow_chi:
    title: "What about you?"
    gloss: "What about you?"
    note: "تو چی؟ is used to turn a question back to the other person."
  fa.a1.unit11.lesson05.teach.yekam_dirtar:
    title: "A little later"
    gloss: "a little later"
    note: "یه‌کم دیرتر means a little later, used to compare two routines."

  fa.a1.unit11.lesson06.teach.turn01:
    title: "What time do you wake up every day?"
    gloss: "What time do you wake up every day?"
    note: "Sara opens by asking Nima about his wake-up time."
  fa.a1.unit11.lesson06.teach.turn02:
    title: "I wake up at seven. What about you?"
    gloss: "I wake up at seven. What about you?"
    note: "Nima answers and turns the question back to Sara."
  fa.a1.unit11.lesson06.teach.turn03:
    title: "I'm a little later, at eight."
    gloss: "I'm a little later, at eight."
    note: "Sara compares her own wake-up time to Nima's."
  fa.a1.unit11.lesson06.teach.turn04:
    title: "What do you do after waking up?"
    gloss: "What do you do after waking up?"
    note: "Nima asks about the next step in Sara's routine."
  fa.a1.unit11.lesson06.teach.turn05:
    title: "I eat breakfast and go to work. At night I usually go to sleep at eleven."
    gloss: "I eat breakfast and go to work. At night I usually go to sleep at eleven."
    note: "Sara describes the rest of her routine in one connected answer, consistent with the same wake/sleep times used earlier in the unit."
  fa.a1.unit11.lesson06.teach.third_person_forms:
    title: "He/she wakes up, he/she goes to sleep"
    gloss: "he/she wakes up, he/she goes to sleep"
    note: "بیدار می‌شه and می‌خوابه are the third-person (او) forms, needed to summarize what Sara or Nima does, as opposed to the first-person forms (بیدار می‌شم، می‌خوابم) used elsewhere in this unit."

exercises:
  fa.a1.unit11.lesson01.exercise01.recognize_bidar_misham:
    instruction: "What does this phrase mean?"
    correct_option: "I wake up"
    distractors: ["I eat breakfast", "I go to work", "I go to sleep"]
    accepted_answers: [{value: "I wake up", status: correct}]
    feedback: "بیدار می‌شم means I wake up."
  fa.a1.unit11.lesson01.exercise02.recognize_mikhabam:
    instruction: "What does this phrase mean?"
    correct_option: "I go to sleep"
    distractors: ["I wake up", "I go to work", "I eat breakfast"]
    accepted_answers: [{value: "I go to sleep", status: correct}]
    feedback: "می‌خوابم means I go to sleep."
  fa.a1.unit11.lesson01.exercise03.recognize_miram_sarkar_reading:
    instruction: "What does this phrase mean?"
    correct_option: "I go to work"
    distractors: ["I wake up", "I eat breakfast", "I go to sleep"]
    accepted_answers: [{value: "I go to work", status: correct}]
    feedback: "میرم سر کار means I go to work."
  fa.a1.unit11.lesson01.exercise04.match_verbs:
    instruction: "Match each Persian phrase with its meaning."
    accepted_answers:
      - {value: {"بیدار می‌شم": "I wake up", "صبحونه می‌خورم": "I eat breakfast", "میرم سر کار": "I go to work", "می‌خوابم": "I go to sleep"}, status: correct}
    feedback: "These are the core routine verbs for this unit."
  fa.a1.unit11.lesson01.exercise05.order_routine_sequence:
    instruction: "Arrange the two phrases in the order they happen: wake up, then eat breakfast."
    accepted_answers: [{value: ["بیدار می‌شم", "صبحونه می‌خورم"], status: correct}]
    feedback: "You wake up first, then eat breakfast."
  fa.a1.unit11.lesson01.exercise06.translate_go_to_work:
    instruction: "Translate into Persian: I go to work."
    accepted_answers:
      - {value: "میرم سر کار", status: correct}
      - {value: "می‌رم سر کار", status: correct}
      - {value: "من میرم سر کار", status: correct}
      - {value: "من می‌رم سر کار", status: correct}
    feedback: "میرم سر کار means I go to work."
  fa.a1.unit11.lesson01.exercise07.write_sleep:
    instruction: "Write the Persian phrase for 'I go to sleep'."
    accepted_answers:
      - {value: می‌خوابم, status: correct}
      - {value: "من می‌خوابم", status: correct}
    feedback: "می‌خوابم means I go to sleep."

  fa.a1.unit11.lesson02.exercise01.recognize_wake_question_reading:
    instruction: "What does this question ask?"
    correct_option: "What time do you wake up?"
    distractors: ["I wake up at seven.", "Every day"]
    accepted_answers: [{value: "What time do you wake up?", status: correct}]
    feedback: "ساعت چند بیدار می‌شی؟ asks what time you wake up."
  fa.a1.unit11.lesson02.exercise02.recognize_answer:
    instruction: "Someone asks what time you wake up, and you wake up at seven. What do you say?"
    correct_option: "ساعت هفت بیدار می‌شم"
    distractors: ["ساعت چند بیدار می‌شی؟", "هر روز", "میرم سر کار"]
    accepted_answers: [{value: "ساعت هفت بیدار می‌شم", status: correct}]
    feedback: "ساعت هفت بیدار می‌شم means I wake up at seven."
  fa.a1.unit11.lesson02.exercise03.order_har_ruz_bidar:
    instruction: "Arrange the words to say 'Every day I wake up at seven.'"
    accepted_answers:
      - {value: [هر, روز, ساعت, هفت, بیدار, می‌شم], status: correct}
      - {value: [ساعت, هفت, هر, روز, بیدار, می‌شم], status: correct}
    feedback: "هر روز ساعت هفت بیدار می‌شم states a habitual wake-up time."
  fa.a1.unit11.lesson02.exercise04.translate_what_time_wake:
    instruction: "Translate into Persian: What time do you wake up?"
    accepted_answers:
      - {value: "ساعت چند بیدار می‌شی؟", status: correct}
      - {value: "ساعت چند بیدار می‌شی", status: correct}
      - {value: "تو ساعت چند بیدار می‌شی؟", status: correct}
      - {value: "تو ساعت چند بیدار می‌شی", status: correct}
    feedback: "*ساعت چند بیدار می‌شی؟* is the natural way to ask."
  fa.a1.unit11.lesson02.exercise05.speak_ask_wake_time:
    instruction: "Ask a friend what time they wake up every day."
    accepted_answers:
      - {value: "ساعت چند بیدار می‌شی؟", status: correct}
      - {value: "ساعت چند بیدار می‌شی", status: correct}
      - {value: "هر روز ساعت چند بیدار می‌شی؟", status: correct}
      - {value: "هر روز ساعت چند بیدار می‌شی", status: correct}
      - {value: "تو هر روز ساعت چند بیدار می‌شی؟", status: correct}
      - {value: "تو هر روز ساعت چند بیدار می‌شی", status: correct}
      - {value: "تو ساعت چند بیدار می‌شی؟", status: correct}
      - {value: "تو ساعت چند بیدار می‌شی", status: correct}
    feedback: "*ساعت چند بیدار می‌شی؟* asks the question; adding *هر روز* (every day) and *تو* (you) is also natural."
  fa.a1.unit11.lesson02.exercise06.write_own_wake_time:
    instruction: "Write that you wake up at seven every day."
    accepted_answers:
      - {value: "هر روز ساعت هفت بیدار می‌شم", status: correct}
      - {value: "من هر روز ساعت هفت بیدار می‌شم", status: correct}
      - {value: "ساعت هفت هر روز بیدار می‌شم", status: correct}
    feedback: "هر روز ساعت هفت بیدار می‌شم means every day I wake up at seven."

  fa.a1.unit11.lesson03.exercise01.recognize_bad:
    instruction: "What does this word mean?"
    correct_option: "after that"
    distractors: ["every day", "at night", "a little later"]
    accepted_answers: [{value: "after that", status: correct}]
    feedback: "بعدش means after that."
  fa.a1.unit11.lesson03.exercise02.recognize_night_routine:
    instruction: "What does this sentence mean?"
    correct_option: "At night I go to sleep at eleven."
    distractors: ["I wake up at seven.", "What time do you wake up?", "I eat breakfast."]
    accepted_answers: [{value: "At night I go to sleep at eleven.", status: correct}]
    feedback: "شب‌ها ساعت یازده می‌خوابم states a nighttime routine."
  fa.a1.unit11.lesson03.exercise03.match_day_parts:
    instruction: "Match each Persian word or phrase with its meaning."
    accepted_answers:
      - {value: {صبح: morning, ظهر: noon, عصر: afternoon, شب: night, بعدش: "after that", "بیدار می‌شم": "I wake up", "صبحونه می‌خورم": "I eat breakfast", "میرم سر کار": "I go to work", می‌خوابم: "I go to sleep", "هر روز": "every day"}, status: correct}
    feedback: "These are the parts of the day, reviewed from Unit 9, plus a review of this unit's routine verbs."
  fa.a1.unit11.lesson03.exercise04.order_night_sleep:
    instruction: "Arrange the words to say 'At night I go to sleep at eleven.'"
    accepted_answers: [{value: [شب‌ها, ساعت, یازده, می‌خوابم], status: correct}]
    feedback: "شب‌ها ساعت یازده می‌خوابم states the nighttime routine in order."
  fa.a1.unit11.lesson03.exercise05.translate_after_that:
    instruction: "Translate into Persian: after that."
    accepted_answers: [{value: بعدش, status: correct}]
    feedback: "بعدش means after that."
  fa.a1.unit11.lesson03.exercise06.write_night_routine:
    instruction: "Write that you go to sleep at eleven at night."
    accepted_answers:
      - {value: "شب‌ها ساعت یازده می‌خوابم", status: correct}
      - {value: "من شب‌ها ساعت یازده می‌خوابم", status: correct}
      - {value: "ساعت یازده شب می‌خوابم", status: correct}
      - {value: "شب ساعت یازده می‌خوابم", status: correct}
    feedback: "شب‌ها ساعت یازده می‌خوابم means at night I go to sleep at eleven."

  fa.a1.unit11.lesson04.exercise01.read_wake_time:
    instruction: "What time does the writer wake up?"
    correct_option: "seven"
    distractors: ["eight", "eleven", "six"]
    accepted_answers: [{value: "seven", status: correct}]
    feedback: "The text says هر روز ساعت هفت بیدار می‌شم (every day I wake up at seven)."
  fa.a1.unit11.lesson04.exercise02.read_first_activity_after_waking:
    instruction: "What does the writer do right after waking up?"
    correct_option: "eats breakfast"
    distractors: ["goes to work", "goes to sleep", "asks the time"]
    accepted_answers: [{value: "eats breakfast", status: correct}]
    feedback: "The text says بعدش صبحونه می‌خورم (after that I eat breakfast)."
  fa.a1.unit11.lesson04.exercise03.choose_second_activity:
    instruction: "What does the writer do after breakfast?"
    correct_option: "goes to work"
    distractors: ["wakes up", "goes to sleep", "eats breakfast again"]
    accepted_answers: [{value: "goes to work", status: correct}]
    feedback: "The text says و میرم سر کار (and I go to work)."
  fa.a1.unit11.lesson04.exercise04.order_reading_summary:
    instruction: "Arrange the words to say 'After that I eat breakfast and go to work.'"
    accepted_answers: [{value: [بعدش, صبحونه, می‌خورم, و, میرم, سر, کار], status: correct}]
    feedback: "بعدش صبحونه می‌خورم و میرم سر کار sequences the two activities."
  fa.a1.unit11.lesson04.exercise05.translate_routine_text:
    instruction: "Translate into Persian: Every day I wake up at seven."
    accepted_answers:
      - {value: "هر روز ساعت هفت بیدار می‌شم", status: correct}
      - {value: "من هر روز ساعت هفت بیدار می‌شم", status: correct}
      - {value: "ساعت هفت هر روز بیدار می‌شم", status: correct}
    feedback: "هر روز ساعت هفت بیدار می‌شم is the natural way to say this."
  fa.a1.unit11.lesson04.exercise06.write_own_routine_sentence:
    instruction: "Write two sentences about a morning routine, using هر روز and بعدش: you wake up at seven, then you eat breakfast and go to work."
    accepted_answers:
      - {value: "هر روز ساعت هفت بیدار می‌شم. بعدش صبحونه می‌خورم و میرم سر کار.", status: correct}
      - {value: "هر روز ساعت هفت بیدار می‌شم، بعدش صبحونه می‌خورم و میرم سر کار.", status: correct}
      - {value: "هر روز ساعت هفت بیدار می‌شم و بعدش صبحونه می‌خورم و میرم سر کار.", status: correct}
    feedback: "This connects a wake-up time with *بعدش* to sequence the following activities -- joining with a period, a comma, or with *و* are all equally natural."

  fa.a1.unit11.lesson05.exercise01.recognize_tow_chi:
    instruction: "What does this phrase mean?"
    correct_option: "What about you?"
    distractors: ["A little later", "Every day", "After that"]
    accepted_answers: [{value: "What about you?", status: correct}]
    feedback: "تو چی؟ turns a question back to the other person."
  fa.a1.unit11.lesson05.exercise02.recognize_yekam_dirtar:
    instruction: "What does this phrase mean?"
    correct_option: "a little later"
    distractors: ["What about you?", "every day", "after that"]
    accepted_answers: [{value: "a little later", status: correct}]
    feedback: "یه‌کم دیرتر means a little later."
  fa.a1.unit11.lesson05.exercise03.match_comparison_phrases:
    instruction: "Match each phrase or word with its meaning."
    accepted_answers:
      - {value: {"تو چی؟": "What about you?", "یه‌کم دیرتر": "A little later", "بیدار می‌شم": "I wake up", "صبحونه می‌خورم": "I eat breakfast", "میرم سر کار": "I go to work", می‌خوابم: "I go to sleep", صبح: morning, عصر: afternoon, شب: night}, status: correct}
    feedback: "تو چی؟ and یه‌کم دیرتر are used to compare one routine with another; the rest reviews this unit's verbs and parts of the day."
  fa.a1.unit11.lesson05.exercise04.order_tow_chi:
    instruction: "Arrange the words to say 'What about you?'"
    accepted_answers: [{value: [تو, چی], status: correct}]
    feedback: "تو چی؟ turns the question back."
  fa.a1.unit11.lesson05.exercise05.translate_a_little_later:
    instruction: "Translate into Persian: a little later."
    accepted_answers: [{value: "یه‌کم دیرتر", status: correct}]
    feedback: "یه‌کم دیرتر means a little later."
  fa.a1.unit11.lesson05.exercise06.speak_ask_what_about_you:
    instruction: "After answering what time you wake up, turn the question back to your friend with 'What about you?'"
    accepted_answers:
      - {value: "تو چی؟", status: correct}
      - {value: "تو چی", status: correct}
    feedback: "تو چی؟ correctly turns the question back."

  fa.a1.unit11.lesson06.exercise01.listen_context:
    instruction: "Read the conversation. What time does Sara wake up?"
