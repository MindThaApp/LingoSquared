course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: basic feelings vocabulary, asking how someone
    is, negating a feeling, giving a simple reason with چون, a short
    reading passage, and a closing dialogue between نیما and سارا.

units:
  fa.a1.unit23.emotions:
    title: Emotions

lessons:
  fa.a1.unit23.lesson01.basic_feelings: {title: "Basic feelings"}
  fa.a1.unit23.lesson02.asking_how_someone_is: {title: "Asking how someone is"}
  fa.a1.unit23.lesson03.more_feelings: {title: "More feelings"}
  fa.a1.unit23.lesson04.giving_a_reason: {title: "Giving a reason"}
  fa.a1.unit23.lesson05.reading_about_feelings: {title: "Reading about feelings"}
  fa.a1.unit23.lesson06.feelings_dialogue: {title: "A feelings dialogue"}

teaching:
  fa.a1.unit23.lesson01.teach.khoshhal_word:
    title: Happy
    gloss: happy
    note: "خوشحال means happy."
    example_gloss: "I am happy."
  fa.a1.unit23.lesson01.teach.narahat_word:
    title: Sad
    gloss: sad
    note: "ناراحت means sad."
    example_gloss: "I am sad."
  fa.a1.unit23.lesson01.teach.hastam_contraction:
    title: "I am (contracted)"
    gloss: "I am (contracted with an adjective)"
    note: "*خوشحالم* is *خوشحال* + *هستم* contracted to *-م*. After a silent *-ه* the same ending is written *-ام*, as in *خسته‌ام*."
  fa.a1.unit23.lesson01.teach.khaste_word:
    title: Tired
    gloss: tired
    note: "خسته means tired."
    example_gloss: "I am tired."

  fa.a1.unit23.lesson02.teach.khoob_nistam_phrase:
    title: "I'm not good"
    gloss: "I'm not good"
    note: "خوب نیستم negates the already-taught خوبم (I'm good) using نیستم, the negative of هستم."
  fa.a1.unit23.lesson02.teach.goshne_word:
    title: Hungry
    gloss: hungry
    note: "*گشنه* means hungry. It is the everyday spoken form of *گرسنه*, which you saw in Unit 4."
    example_gloss: "I am hungry."
  fa.a1.unit23.lesson02.teach.yekam_word:
    title: "A little"
    gloss: "a little"
    note: "یکم softens a feeling, like English 'a little' or 'a bit.'"
    example_gloss: "I'm a little tired."

  fa.a1.unit23.lesson03.teach.asabani_word:
    title: Angry
    gloss: angry
    note: "عصبانی means angry."
    example_gloss: "Why are you angry?"
  fa.a1.unit23.lesson03.teach.negaran_word:
    title: Worried
    gloss: worried
    note: "نگران means worried."
    example_gloss: "I am worried."
  fa.a1.unit23.lesson03.teach.chera_word:
    title: Why
    gloss: why
    note: "*چرا* means why; *هستی* is the informal 'you are' form, and it contracts to *-ی*: *نگران هستی* becomes *نگرانی*."

  fa.a1.unit23.lesson04.teach.kar_kardam_phrase:
    title: "I worked"
    gloss: "I worked"
    note: "کار کردم literally means 'work I-did.'"
  fa.a1.unit23.lesson04.teach.tatile_word:
    title: "It's a holiday"
    gloss: "it's a holiday"
    note: "تعطیله means it's a day off/holiday."
    example_gloss: "Today is a holiday."
  fa.a1.unit23.lesson04.teach.emrooz_word:
    title: Today
    gloss: today
    note: "امروز means today."
    example_gloss: "I'm tired today."
  fa.a1.unit23.lesson04.teach.ziad_word:
    title: "A lot"
    gloss: "a lot"
    note: "زیاد means a lot/too much."
    example_gloss: "I worked a lot."

  fa.a1.unit23.lesson05.teach.sara_name_review:
    title: Sara
    gloss: Sara
    note: "سارا, established as a character back in Unit 14, reappears here."
    example_gloss: "Sara is tired."
  fa.a1.unit23.lesson05.teach.reading_text:
    title: "Reading: Sara's day"
    gloss: "Sara is a little tired today because she worked a lot. Sara isn't sad, just tired."
    note: "*خسته‌ست* and *کرده* are the 3rd-person colloquial forms of *خسته‌ام* and *کردم*; *نیست* negates *هست*; *فقط* means 'only.'"

  fa.a1.unit23.lesson06.teach.che_khoob_phrase:
    title: "How nice!"
    gloss: "how nice!"
    note: "چه خوب! is a common positive reaction, like 'that's great!'"
  fa.a1.unit23.lesson06.teach.dialogue_line1:
    title: "Nima: Sara, how are you?"
    gloss: "Sara, how are you?"
  fa.a1.unit23.lesson06.teach.dialogue_line2:
    title: "Sara: I'm a little tired..."
    gloss: "I'm a little tired today because I worked a lot. How about you?"
  fa.a1.unit23.lesson06.teach.dialogue_line3:
    title: "Nima: I'm happy..."
    gloss: "I'm happy because today is a holiday."
  fa.a1.unit23.lesson06.teach.dialogue_line4:
    title: "Sara: How nice!"
    gloss: "How nice!"

exercises:
  fa.a1.unit23.lesson01.exercise01.recognize_khoshhal:
    instruction: "What does this word mean?"
    correct_option: happy
    distractors: [sad, tired, hungry]
    accepted_answers: [{value: happy, status: correct}]
    feedback: "خوشحال means happy."
  fa.a1.unit23.lesson01.exercise02.recognize_narahat:
    instruction: "What does this word mean?"
    correct_option: sad
    distractors: [happy, tired, hungry]
    accepted_answers: [{value: sad, status: correct}]
    feedback: "ناراحت means sad."
  fa.a1.unit23.lesson01.exercise03.match_feelings_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {خوشحال: happy, ناراحت: sad, خسته: tired, عالیه: great, متأسفم: "I'm sorry"}
        status: correct
    feedback: "These are the basic feelings in this lesson, plus عالیه/متأسفم (great/I'm sorry), covered earlier."
  fa.a1.unit23.lesson01.exercise04.translate_i_am_happy:
    instruction: "Translate into Farsi: I am happy."
    accepted_answers:
      - {value: "خوشحالم", status: correct}
      - {value: "من خوشحالم", status: correct}
    feedback: "خوشحالم is خوشحال + هستم contracted."
  fa.a1.unit23.lesson01.exercise05.translate_i_am_tired:
    instruction: "Translate into Farsi: I am tired."
    accepted_answers:
      - {value: "خسته‌ام", status: correct}
      - {value: "من خسته‌ام", status: correct}
    feedback: "خسته‌ام is خسته + هستم contracted."

  fa.a1.unit23.lesson02.exercise01.recognize_khoob_nistam:
    instruction: "What does this phrase mean?"
    correct_option: "I'm not good"
    distractors: ["I'm good", "I'm hungry", "I'm tired"]
    accepted_answers: [{value: "I'm not good", status: correct}]
    feedback: "خوب نیستم means I'm not good."
  fa.a1.unit23.lesson02.exercise02.recognize_goshne:
    instruction: "What does this word mean?"
    correct_option: hungry
    distractors: [tired, happy, sad]
    accepted_answers: [{value: hungry, status: correct}]
    feedback: "گشنه means hungry."
  fa.a1.unit23.lesson02.exercise03.match_asking_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {چطوری: "how are you (informal)", خوبم: "I'm good", "خوب نیستم": "I'm not good", گشنه: hungry, یکم: "a little", خوشحال: happy}
        status: correct
    feedback: "چطوری and خوبم were covered earlier -- this lesson builds on them, plus the feeling word خوشحال (happy)."
  fa.a1.unit23.lesson02.exercise04.word_order_not_good:
    instruction: "Put the words in order."
    accepted_answers: [{value: [من, خوب, نیستم], status: correct}]
    feedback: "من خوب نیستم means 'I'm not good.'"
  fa.a1.unit23.lesson02.exercise05.translate_a_little_hungry:
    instruction: "Translate into Farsi: a little hungry (I am)."
    accepted_answers:
      - {value: "یکم گشنه‌ام", status: correct}
      - {value: "من یکم گشنه‌ام", status: correct}
      - {value: "یه‌کم گشنه‌ام", status: correct}
      - {value: "من یه‌کم گشنه‌ام", status: correct}
    feedback: "یکم گشنه‌ام means 'I'm a little hungry.'"

  fa.a1.unit23.lesson03.exercise01.recognize_asabani:
    instruction: "What does this word mean?"
    correct_option: angry
    distractors: [worried, happy, sad]
    accepted_answers: [{value: angry, status: correct}]
    feedback: "عصبانی means angry."
  fa.a1.unit23.lesson03.exercise02.recognize_negaran:
    instruction: "What does this word mean?"
    correct_option: worried
    distractors: [angry, tired, hungry]
    accepted_answers: [{value: worried, status: correct}]
    feedback: "نگران means worried."
  fa.a1.unit23.lesson03.exercise03.match_more_feelings_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {عصبانی: angry, نگران: worried, چرا: why, خوشحال: happy, ناراحت: sad, خسته: tired}
        status: correct
    feedback: "This reviews all six feelings taught so far, plus چرا (why)."
  fa.a1.unit23.lesson03.exercise04.translate_why_worried:
    instruction: "Translate into Farsi: Why are you worried?"
    accepted_answers:
      - {value: "چرا نگرانی؟", status: correct}
      - {value: "چرا نگران هستی؟", status: correct}
      - {value: "تو چرا نگرانی؟", status: correct}
      - {value: "چرا تو نگرانی؟", status: correct}
    feedback: "چرا نگرانی؟ means 'Why are you worried?'"
  fa.a1.unit23.lesson03.exercise05.translate_i_am_angry:
    instruction: "Translate into Farsi: I am angry."
    accepted_answers:
      - {value: "عصبانی‌ام", status: correct}
      - {value: "من عصبانی‌ام", status: correct}
    feedback: "عصبانی‌ام is عصبانی + هستم contracted."

  fa.a1.unit23.lesson04.exercise01.recognize_tatile:
    instruction: "What does this word mean?"
    correct_option: "it's a holiday"
    distractors: ["I worked", today, "a lot"]
    accepted_answers: [{value: "it's a holiday", status: correct}]
    feedback: "تعطیله means it's a holiday."
  fa.a1.unit23.lesson04.exercise02.recognize_kar_kardam:
    instruction: "What does this phrase mean?"
    correct_option: "I worked"
    distractors: ["it's a holiday", today, hungry]
    accepted_answers: [{value: "I worked", status: correct}]
    feedback: "کار کردم means 'I worked.'"
  fa.a1.unit23.lesson04.exercise03.match_reason_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {امروز: today, تعطیله: "it's a holiday", "کار کردم": "I worked", چون: because, خسته: tired, خوشحال: happy}
        status: correct
    feedback: "چون was covered earlier -- this lesson reuses it to give reasons for feelings, including being خوشحال (happy)."
  fa.a1.unit23.lesson04.exercise04.translate_happy_because_holiday:
    instruction: "Translate into Farsi: I'm happy because today is a holiday."
    accepted_answers:
      - {value: "خوشحالم چون امروز تعطیله", status: correct}
      - {value: "من خوشحالم چون امروز تعطیله", status: correct}
      - {value: "خوشحالم، چون امروز تعطیله", status: correct}
      - {value: "من خوشحالم، چون امروز تعطیله", status: correct}
    feedback: "خوشحالم چون امروز تعطیله means 'I'm happy because today is a holiday.'"
  fa.a1.unit23.lesson04.exercise05.translate_tired_because_worked:
    instruction: "Translate into Farsi: I'm tired because I worked a lot."
    accepted_answers:
      - {value: "خسته‌ام چون زیاد کار کردم", status: correct}
      - {value: "من خسته‌ام چون زیاد کار کردم", status: correct}
      - {value: "خسته‌ام، چون زیاد کار کردم", status: correct}
      - {value: "من خسته‌ام، چون زیاد کار کردم", status: correct}
    feedback: "خسته‌ام چون زیاد کار کردم means 'I'm tired because I worked a lot.'"

  fa.a1.unit23.lesson05.exercise01.reading_comprehension_how_sara_feels:
    instruction: "How does Sara feel today?"
    correct_option: "A little tired"
    distractors: [Happy, Angry, Worried]
    accepted_answers: [{value: "A little tired", status: correct}]
    feedback: "سارا امروز یکم خسته‌ست -- Sara is a little tired today."
  fa.a1.unit23.lesson05.exercise02.reading_comprehension_why:
    instruction: "Why is Sara tired?"
    correct_option: "She worked a lot"
    distractors: ["She didn't sleep", "It's a holiday", "She's sad"]
    accepted_answers: [{value: "She worked a lot", status: correct}]
    feedback: "چون زیاد کار کرده -- because she worked a lot."
  fa.a1.unit23.lesson05.exercise03.match_reading_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {زیاد: "a lot", فقط: only, خسته: tired, نیست: "is not", خوشحال: happy, ناراحت: sad}
        status: correct
    feedback: "These words appear in the reading passage, plus this unit's other core feelings."
  fa.a1.unit23.lesson05.exercise04.translate_sara_is_tired:
    instruction: "Translate into Farsi: Sara is tired."
    accepted_answers: [{value: "سارا خسته‌ست", status: correct}]
    feedback: "سارا خسته‌ست means 'Sara is tired' (colloquial 3rd person)."
  fa.a1.unit23.lesson05.exercise05.write_own_feeling:
    instruction: "Write a sentence about how you feel today and why."
    accepted_answers:
      - {value: "خوشحالم چون امروز تعطیله", status: correct}
      - {value: "خسته‌ام چون زیاد کار کردم", status: correct}
      - {value: "یکم گشنه‌ام", status: correct}
      - {value: "من خوشحالم چون امروز تعطیله", status: correct}
      - {value: "خوشحالم، چون امروز تعطیله", status: correct}
      - {value: "من خسته‌ام چون زیاد کار کردم", status: correct}
      - {value: "خسته‌ام، چون زیاد کار کردم", status: correct}
      - {value: "من یکم گشنه‌ام", status: correct}
      - {value: "یه‌کم گشنه‌ام", status: correct}
      - {value: "خوشحالم", status: correct}
      - {value: "خسته‌ام", status: correct}
      - {value: "ناراحتم", status: correct}
      - {value: "عصبانی‌ام", status: correct}
      - {value: "نگرانم", status: correct}
    feedback: "Any true statement using a taught feeling word (and optionally چون + a reason) is accepted."

  fa.a1.unit23.lesson06.exercise01.dialogue_comprehension_context:
    instruction: "What happened in this conversation?"
    correct_option: "Nima is happy because today is a holiday; Sara is a little tired because she worked a lot."
    distractors:
      - "Nima is tired because he worked a lot; Sara is happy because today is a holiday."
      - "Both Nima and Sara are angry about work today."
      - "Sara is worried about Nima being tired."
    accepted_answers: [{value: "Nima is happy because today is a holiday; Sara is a little tired because she worked a lot.", status: correct}]
    feedback: "نیما خوشحاله چون امروز تعطیله؛ سارا یکم خسته‌ست چون زیاد کار کرده."
  fa.a1.unit23.lesson06.exercise02.match_dialogue_facts:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {نیما: Nima, سارا: Sara, خوشحال: happy, خسته: tired, تعطیله: "it's a holiday", "کار کردم": "I worked"}
        status: correct
    feedback: "This reviews the whole dialogue's key vocabulary."
  fa.a1.unit23.lesson06.exercise03.reading_comprehension_who_feels_what:
    instruction: "Who is happy, and why?"
    correct_option: "Nima, because today is a holiday"
    distractors: ["Sara, because today is a holiday", "Nima, because he worked", "Sara, because she is worried"]
    accepted_answers: [{value: "Nima, because today is a holiday", status: correct}]
    feedback: "من خوشحالم چون امروز تعطیله -- Nima says he's happy because today is a holiday."
  fa.a1.unit23.lesson06.exercise04.dialogue_response_own_feeling:
    instruction: "Respond to چطوری؟ by saying you're happy because today is a holiday."
    accepted_answers:
      - {value: "خوشحالم چون امروز تعطیله", status: correct}
      - {value: "من خوشحالم چون امروز تعطیله", status: correct}
      - {value: "خوشحالم، چون امروز تعطیله", status: correct}
      - {value: "من خوشحالم، چون امروز تعطیله", status: correct}
    feedback: "خوشحالم چون امروز تعطیله means 'I'm happy because today is a holiday.'"
  fa.a1.unit23.lesson06.exercise05.write_comparison_summary:
    instruction: "Write a sentence comparing how Sara and Nima feel."
    accepted_answers:
      - {value: "سارا خسته‌ست نیما خوشحاله", status: correct}
      - {value: "سارا خسته‌ست و نیما خوشحاله", status: correct}
      - {value: "سارا خسته‌ست، نیما خوشحاله", status: correct}
      - {value: "سارا خسته‌ست. نیما خوشحاله", status: correct}
      - {value: "نیما خوشحاله و سارا خسته‌ست", status: correct}
      - {value: "نیما خوشحاله، سارا خسته‌ست", status: correct}
      - {value: "نیما خوشحاله. سارا خسته‌ست", status: correct}
    feedback: "*سارا خسته‌ست، نیما خوشحاله* -- Sara is tired, Nima is happy."
