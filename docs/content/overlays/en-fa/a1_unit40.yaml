course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: reporting a lost bag, key, passport, or
    umbrella, asking a stranger whether it's been found, a lost-and-found
    dialogue with a clerk, and reading a short found/still-lost
    notice.

units:
  fa.a1.unit40.lost_items:
    title: "Lost belongings"

lessons:
  fa.a1.unit40.lesson01.new_lost_items_one: {title: "New words 1"}
  fa.a1.unit40.lesson02.new_lost_items_two: {title: "New words 2"}
  fa.a1.unit40.lesson03.asking_if_seen: {title: "Asking about lost items"}
  fa.a1.unit40.lesson04.lost_bag_dialogue: {title: "Dialogue: the lost bag"}
  fa.a1.unit40.lesson05.reading_lost_and_found_notice: {title: "Reading a lost-and-found notice"}
  fa.a1.unit40.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit40.lesson01.teach.review_in_maneh:
    title: "Review: this is mine"
    gloss: "this is mine"
    note: "*این ... منه* ('this is mine') was introduced earlier."
  fa.a1.unit40.lesson01.teach.review_ra:
    title: "Review: object marker"
    gloss: "(object marker)"
    note: "*رو* is the everyday object marker, which you met in the food lessons."
  fa.a1.unit40.lesson01.teach.review_man:
    title: "Review: I"
    gloss: I
    note: "*من* ('I') was introduced earlier."
  fa.a1.unit40.lesson01.teach.kif:
    title: Bag
    gloss: bag
    note: "*کیف* means 'bag' (a handbag, backpack, or similar)."
    example_gloss: "This bag is mine."
  fa.a1.unit40.lesson01.teach.kelid:
    title: Key
    gloss: key
    note: "*کلید* means 'key.'"
    example_gloss: "This key is mine."
  fa.a1.unit40.lesson01.teach.gom_kardam:
    title: "I lost (it)"
    gloss: "I lost (it)"
    note: "*گم کردم* ('I lost it') combines *گم* ('lost') with *کردم*, the past tense of *کردن* ('to do/make'). It takes the same -م ending as *رفتم*, *خوردم* and *دیدم*."

  fa.a1.unit40.lesson02.teach.gozarnameh:
    title: Passport
    gloss: passport
    note: "*گذرنامه* means 'passport.'"
    example_gloss: "This passport is mine."
  fa.a1.unit40.lesson02.teach.chatr:
    title: Umbrella
    gloss: umbrella
    note: "*چتر* means 'umbrella.'"
    example_gloss: "This umbrella is mine."
  fa.a1.unit40.lesson02.teach.peyda_kardam:
    title: "I found (it)"
    gloss: "I found (it)"
    note: "*پیدا کردم* ('I found it') goes with *گم کردم* ('I lost it') from the previous lesson and uses the same *کردم* ending."

  fa.a1.unit40.lesson03.teach.review_kojast_bebakhshid:
    title: "Review: where is / excuse me"
    gloss: "where is / excuse me"
    note: "*کجاست* ('where is') and *ببخشید* ('excuse me') were introduced earlier."
  fa.a1.unit40.lesson03.teach.review_didid_formal:
    title: "Did you see? (formal)"
    gloss: "did you see?"
    note: "*دیدید* ('did you see?') puts the formal -ید ending on *دیدم* ('I saw'), the same formal ending you have seen in *هستید* and *بفرمایید*."
  fa.a1.unit40.lesson03.teach.chatr_didid:
    title: "Have you seen the umbrella?"
    gloss: "Have you seen the umbrella?"
  fa.a1.unit40.lesson03.teach.gozarnameh_kojast:
    title: "Where is the passport?"
    gloss: "Where is the passport?"

  fa.a1.unit40.lesson04.teach.review_esm_shoma_chiye:
    title: "Review: what's your name? (formal)"
    gloss: "what's your name?"
    note: "*اسم شما چیه؟* ('what's your name?', polite) was introduced earlier."
  fa.a1.unit40.lesson04.teach.review_bashe_mamnoon:
    title: "Review: okay / thanks"
    gloss: "okay / thanks"
    note: "*باشه* and *ممنون* were introduced earlier."
  fa.a1.unit40.lesson04.teach.dialogue_line1:
    title: "Nima: Excuse me, I lost my bag."
    gloss: "Excuse me, I lost my bag."
  fa.a1.unit40.lesson04.teach.dialogue_line2:
    title: "Mr. Karimi: Okay. What's your name?"
    gloss: "Okay. What's your name?"
  fa.a1.unit40.lesson04.teach.dialogue_line3:
    title: "Nima: My name is Nima."
    gloss: "My name is Nima."
  fa.a1.unit40.lesson04.teach.dialogue_line4:
    title: "Mr. Karimi: I found this bag!"
    gloss: "I found this bag!"
  fa.a1.unit40.lesson04.teach.dialogue_line5:
    title: "Nima: Thanks!"
    gloss: "Thanks!"

  fa.a1.unit40.lesson05.teach.gomshodeh:
    title: Lost
    gloss: lost
    note: "*گمشده* ('lost') is the adjective form, built from the same *گم* root as *گم کردم* ('I lost it')."
    example_gloss: "The umbrella is lost."
  fa.a1.unit40.lesson05.teach.peydashodeh:
    title: Found
    gloss: found
    note: "*پیداشده* ('found') is the adjective form, built from the same *پیدا* root as *پیدا کردم* ('I found it')."
    example_gloss: "The bag was found."
  fa.a1.unit40.lesson05.teach.reading_text:
    title: "Reading: Found and lost items"
    gloss: "The bag was found. The key was found. The passport is lost. The umbrella is lost."
    note: "A short notice listing which items have been found and which are still lost."

  fa.a1.unit40.lesson06.teach.review_man_kif_gom_kelid_peyda:
    title: "I lost my bag. I found the key."
    gloss: "I lost my bag. I found the key."
    note: "A review sentence made only of words from this unit."
  fa.a1.unit40.lesson06.teach.review_chatr_didid:
    title: "Excuse me, have you seen the umbrella?"
    gloss: "Excuse me, have you seen the umbrella?"
  fa.a1.unit40.lesson06.teach.summary_items:
    title: "Bag / key / passport / umbrella"
    gloss: "bag / key / passport / umbrella"
    note: "These are the four lost-and-found items from this unit."

exercises:
  fa.a1.unit40.lesson01.exercise01.recognize_kif:
    instruction: "What does this word mean?"
    correct_option: bag
    distractors: [key, passport, umbrella]
    accepted_answers: [{value: bag, status: correct}]
    feedback: "*کیف* means bag."
  fa.a1.unit40.lesson01.exercise02.recognize_kelid:
    instruction: "What does this word mean?"
    correct_option: key
    distractors: [bag, umbrella, wallet]
    accepted_answers: [{value: key, status: correct}]
    feedback: "*کلید* means key."
  fa.a1.unit40.lesson01.exercise03.match_lost_items_one:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {کیف: bag, کلید: key, "گم کردم": "I lost (it)", "این کیف منه.": "This bag is mine.", "این کلید منه.": "This key is mine.", "من کیف رو گم کردم.": "I lost my bag."}
        status: correct
    feedback: "These are the first lost-item words in this unit, plus *گم کردم* ('I lost it')."
  fa.a1.unit40.lesson01.exercise04.word_order_man_kif_gom_kardam:
    instruction: "Put the words in order."
    accepted_answers: [{value: [من, کیف, رو, گم, کردم], status: correct}]
    feedback: "*من کیف رو گم کردم* means 'I lost my bag!'"
  fa.a1.unit40.lesson01.exercise05.translate_in_kelid_maneh:
    instruction: "Translate into English: این کلید منه."
    answer_language_code: en
    accepted_answers:
      - {value: "This key is mine", status: correct}
      - {value: "This key is mine.", status: correct}
      - {value: "This is my key", status: correct}
      - {value: "This is my key.", status: correct}
      - {value: "This key is mine!", status: correct}
      - {value: "This is my key!", status: correct}
      - {value: "This key's mine", status: correct}
      - {value: "This key's mine.", status: correct}
      - {value: "This key's mine!", status: correct}
    feedback: "*این کلید منه* means 'This key is mine.'"

  fa.a1.unit40.lesson02.exercise01.recognize_gozarnameh:
    instruction: "What does this word mean?"
    correct_option: passport
    distractors: [bag, key, umbrella]
    accepted_answers: [{value: passport, status: correct}]
    feedback: "*گذرنامه* means passport."
  fa.a1.unit40.lesson02.exercise02.recognize_chatr:
    instruction: "What does this word mean?"
    correct_option: umbrella
    distractors: [passport, key, bag]
    accepted_answers: [{value: umbrella, status: correct}]
    feedback: "*چتر* means umbrella."
  fa.a1.unit40.lesson02.exercise03.match_lost_items_two:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {گذرنامه: passport, چتر: umbrella, "پیدا کردم": "I found (it)", "این گذرنامه منه.": "This passport is mine.", "این چتر منه.": "This umbrella is mine.", "من کلید رو پیدا کردم!": "I found my key!"}
        status: correct
    feedback: "These are the next lost-item words in this unit, plus *پیدا کردم* ('I found it')."
  fa.a1.unit40.lesson02.exercise04.word_order_man_gozarnameh_gom_kardam:
    instruction: "Put the words in order."
    accepted_answers: [{value: [من, گذرنامه, رو, گم, کردم], status: correct}]
    feedback: "*من گذرنامه رو گم کردم* means 'I lost my passport!'"
  fa.a1.unit40.lesson02.exercise05.translate_man_chatr_gom_kardam:
    instruction: "Translate into English: من چتر رو گم کردم."
    answer_language_code: en
    accepted_answers:
      - {value: "I lost my umbrella", status: correct}
      - {value: "I lost my umbrella.", status: correct}
      - {value: "I lost the umbrella", status: correct}
      - {value: "I lost the umbrella.", status: correct}
      - {value: "I lost my umbrella!", status: correct}
      - {value: "I lost the umbrella!", status: correct}
      - {value: "I've lost my umbrella", status: correct}
      - {value: "I've lost my umbrella.", status: correct}
      - {value: "I've lost my umbrella!", status: correct}
      - {value: "I have lost my umbrella", status: correct}
      - {value: "I have lost my umbrella.", status: correct}
      - {value: "I have lost my umbrella!", status: correct}
      - {value: "I've lost the umbrella", status: correct}
      - {value: "I've lost the umbrella.", status: correct}
      - {value: "I've lost the umbrella!", status: correct}
    feedback: "*من چتر رو گم کردم* means 'I lost my umbrella.'"

  fa.a1.unit40.lesson03.exercise01.recognize_didid:
    instruction: "What does this word mean?"
    correct_option: "did you see?"
    distractors: ["did you find?", "did you go?", "did you say?"]
    accepted_answers: [{value: "did you see?", status: correct}]
    feedback: "*دیدید* means 'did you see?' (formal)."
  fa.a1.unit40.lesson03.exercise02.recognize_kojast:
    instruction: "What does this word mean?"
    correct_option: "where is"
    distractors: ["what is", "who is", "how is"]
    accepted_answers: [{value: "where is", status: correct}]
    feedback: "*کجاست* means 'where is.'"
  fa.a1.unit40.lesson03.exercise03.match_asking_seen:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"دیدید؟": "did you see?", کجاست: "where is", ببخشید: "excuse me", "چتر رو دیدید؟": "Have you seen the umbrella?", "گذرنامه کجاست؟": "Where is the passport?", "من گذرنامه رو گم کردم.": "I lost my passport."}
        status: correct
    feedback: "These words let you ask a stranger whether they've seen your lost item."
  fa.a1.unit40.lesson03.exercise04.word_order_chatr_didid:
    instruction: "Put the words in order."
    accepted_answers: [{value: [چتر, رو, دیدید], status: correct}]
    feedback: "*چتر رو دیدید؟* means 'Have you seen the umbrella?'"
