      - {value: "Excuse me. have you seen the bag?", status: correct}
      - {value: "Excuse me. have you seen the bag", status: correct}
      - {value: "Excuse me. did you see the bag?", status: correct}
      - {value: "Excuse me. did you see the bag", status: correct}
      - {value: "Excuse me. have you seen my bag?", status: correct}
      - {value: "Excuse me. have you seen my bag", status: correct}
      - {value: "Excuse me. did you see my bag?", status: correct}
      - {value: "Excuse me. did you see my bag", status: correct}
      - {value: "Excuse me. have you seen a bag?", status: correct}
      - {value: "Excuse me. have you seen a bag", status: correct}
    feedback: "*ببخشید، کیف رو دیدید؟* means 'Excuse me, have you seen the bag?'"

  fa.a1.unit40.lesson04.exercise01.dialogue_comprehension_lost_bag:
    instruction: "Nima says this to a lost-and-found clerk. What happened?"
    correct_option: "He lost his bag."
    distractors:
      - "He lost his key."
      - "He lost his passport."
      - "He lost his umbrella."
    accepted_answers: [{value: "He lost his bag.", status: correct}]
    feedback: "*ببخشید، کیف رو گم کردم* means 'Excuse me, I lost my bag.'"
  fa.a1.unit40.lesson04.exercise02.recognize_man_kif_peyda_kardam:
    instruction: "What does this sentence mean?"
    correct_option: "I found this bag!"
    distractors:
