      - "Is this your bag?"
      - "I found this key!"
    accepted_answers: [{value: "I found this bag!", status: correct}]
    feedback: "*من این کیف رو پیدا کردم* means 'I found this bag!'"
  fa.a1.unit40.lesson04.exercise03.match_dialogue_lost_bag:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {ببخشید: "excuse me", باشه: okay, "اسم شما چیه؟": "What's your name?", "اسمم نیماست.": "My name is Nima.", "پیدا کردم": "I found (it)", ممنون: thanks}
        status: correct
    feedback: "These words appear in the lost-and-found dialogue."
  fa.a1.unit40.lesson04.exercise04.dialogue_response_ask_name:
