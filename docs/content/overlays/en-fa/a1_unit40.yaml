      - {value: "I've found this bag.", status: correct}
      - {value: "I have found this bag", status: correct}
      - {value: "I have found this bag!", status: correct}
      - {value: "I have found this bag.", status: correct}
      - {value: "I've found the bag", status: correct}
      - {value: "I've found the bag!", status: correct}
      - {value: "I've found the bag.", status: correct}
    feedback: "*من این کیف رو پیدا کردم* means 'I found this bag!'"

  fa.a1.unit40.lesson05.exercise01.reading_comprehension_found_items:
    instruction: "According to the notice, which items were found?"
    correct_option: "The bag and key were found."
    distractors:
      - "The passport and key were found."
      - "The bag and umbrella were found."
      - "Nothing was found."
    accepted_answers: [{value: "The bag and key were found.", status: correct}]
