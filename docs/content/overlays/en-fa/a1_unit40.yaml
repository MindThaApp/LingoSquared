schema_version: "1.1"
overlay_version: "2026.1-draft.1"
overlay_key: en-fa.a1.unit40
source_language: en
target_language: fa
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Draft overlay paired with the fa.a1.unit40.lost_items realization. See
    that file's generation_provenance for the honest source-access result:
    with Firecrawl at 0 credits this session, tried both known FSI Persian
    Basic Course mirrors via direct pdftotext, same as units 36-39. The
    DigitalOcean-mirror copy re-confirmed 0 extractable words (JBIG2-only
    scan, same as every prior unit's finding). The Live Lingua-hosted copy
    has a real OCR text layer (66,717 extractable words this fetch,
    consistent with every prior unit's fetch of the same file) and a
    thorough grep for lost/missing/mislaid/found/key/wallet/purse/bag/
    suitcase/passport/umbrella/camera and their Persian transliterations
    found two genuine but narrow hits: "gom" ('lost', an isolated
    glossary-table entry with no surrounding scenario) and "kif"/"kelid"
    ('purse'/'key', from an unrelated taxi-luggage and hotel-check-in
    dialogue, not a lost-item report). No lost-and-found scenario or
    dialogue exists anywhere in the extracted text. Slightly more usable
    than unit38/39's pure dead ends, but still no real scenario to adapt --
    گم/کیف/کلید reflect those three narrow real hits; گذرنامه (passport),
    چتر (umbrella), پیدا (found), and the full dialogue/reading are authored
    fresh from this project's own established colloquial Iranian Farsi
    conventions and already-shipped vocabulary. Register note: reporting a
    lost item to a stranger (new minor character آقای کریمی, a lost-and-
    found clerk, kept separate from the established نیما/سارا friend pair)
    uses the polite/formal شما-register (اسم شما چیه, already established
    formal from unit02; دیدید, a new formal extension of unit13's دیدم
    paralleling the already-established هستید/بفرمایید formal -ید ending)
    while نیما's own 1st-person lines stay register-neutral -- the same
    stranger-vs-friend register split unit39 already established and
    justified, applied to a different public-service context. Every
    "Translate into English" exercise below explicitly sets
    answer_language_code: en. No listen_type/listen_select/listen_order
    exercise is used anywhere in this unit (continuing the established
    text-based corpus-consistency pattern from units 19-39), so the
    same-speaker/same-audio distractor-collision bug class fixed
    2026-07-09 in the nl corpus (commit 148240e) cannot apply here --
    verified anyway that lesson04's dialogue_comprehension distractors
    ("He lost his key."/"He lost his passport."/"He lost his umbrella.")
    are plausible-fact alternatives, not lines either dialogue speaker
    actually says in this unit's dialogue audio (only کیف/bag is ever
    mentioned as the lost item in the dialogue itself). Boolean-coercion
    check: ran a recursive yaml.safe_load scan over title/gloss/note/
    example_gloss/answer/matching-pair value fields (including
    matching_pairs right: values specifically) across both this overlay
    and the paired realization for bare yes/no/true/false/on/off string
    values or coerced booleans -- zero hits. Compiler validation, both
    standalone and against the full 40-unit en-fa A1 corpus with
    position-matched realization/overlay lists, confirmed 0 errors.

course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: reporting a lost bag, key, passport, or
    umbrella, asking a stranger whether it's been found, a lost-and-found
    dialogue with a new clerk character, and reading a short found/still-
    lost notice.

units:
  fa.a1.unit40.lost_items:
    title: "Lost belongings"

lessons:
  fa.a1.unit40.lesson01.new_lost_items_one: {title: "New words 1"}
  fa.a1.unit40.lesson02.new_lost_items_two: {title: "New words 2"}
  fa.a1.unit40.lesson03.asking_if_seen: {title: "Asking about lost items"}
  fa.a1.unit40.lesson04.lost_bag_dialogue: {title: "Dialogue: the lost bag"}
  fa.a1.unit40.lesson05.reading_lost_and_found_notice: {title: "Reading a lost-and-found notice"}
  fa.a1.unit40.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit40.lesson01.teach.review_in_maneh:
    title: "Review: this is mine"
    gloss: "this is mine"
    note: "*این ... منه* ('this is mine') was already taught in units 02/03."
  fa.a1.unit40.lesson01.teach.review_ra:
    title: "Review: object marker"
    gloss: "(object marker)"
    note: "*رو* is the colloquial object marker, already taught in unit06's food lesson."
  fa.a1.unit40.lesson01.teach.review_man:
    title: "Review: I"
    gloss: I
    note: "*من* ('I') was already taught in unit02."
  fa.a1.unit40.lesson01.teach.kif:
    title: Bag
    gloss: bag
    note: "*کیف* means 'bag' (a handbag, backpack, or similar)."
    example_gloss: "This bag is mine."
  fa.a1.unit40.lesson01.teach.kelid:
    title: Key
    gloss: key
    note: "*کلید* means 'key.'"
    example_gloss: "This key is mine."
  fa.a1.unit40.lesson01.teach.gom_kardam:
    title: "I lost (it)"
    gloss: "I lost (it)"
    note: "*گم کردم* ('I lost it') combines *گم* ('lost') with *کردم*, a new past-tense form extending unit13's -م past ending (رفتم/خوردم/دیدم) to the verb *کردن* ('to do/make')."

  fa.a1.unit40.lesson02.teach.gozarnameh:
    title: Passport
    gloss: passport
    note: "*گذرنامه* means 'passport.'"
    example_gloss: "This passport is mine."
  fa.a1.unit40.lesson02.teach.chatr:
    title: Umbrella
    gloss: umbrella
    note: "*چتر* means 'umbrella.'"
    example_gloss: "This umbrella is mine."
  fa.a1.unit40.lesson02.teach.peyda_kardam:
    title: "I found (it)"
    gloss: "I found (it)"
    note: "*پیدا کردم* ('I found it') pairs with *گم کردم* ('I lost it') from the previous lesson, reusing the same *کردم* past-tense ending."

  fa.a1.unit40.lesson03.teach.review_kojast_bebakhshid:
    title: "Review: where is / excuse me"
    gloss: "where is / excuse me"
    note: "*کجاست* ('where is') and *ببخشید* ('excuse me') were already taught in unit05."
  fa.a1.unit40.lesson03.teach.review_didid_formal:
    title: "Did you see? (formal)"
    gloss: "did you see?"
    note: "*دیدید* extends *دیدم* ('I saw,' unit13)'s -م past ending to the formal -ید ending, the same formal ending already seen in *هستید*/*بفرمایید*."
  fa.a1.unit40.lesson03.teach.chatr_didid:
    title: "Have you seen the umbrella?"
    gloss: "Have you seen the umbrella?"
  fa.a1.unit40.lesson03.teach.gozarnameh_kojast:
    title: "Where is the passport?"
    gloss: "Where is the passport?"

  fa.a1.unit40.lesson04.teach.review_esm_shoma_chiye:
    title: "Review: what's your name? (formal)"
    gloss: "what's your name?"
    note: "*اسم شما چیه؟* ('what's your name?', formal) was already taught in unit02."
  fa.a1.unit40.lesson04.teach.review_bashe_mamnoon:
    title: "Review: okay / thanks"
    gloss: "okay / thanks"
    note: "*باشه* and *ممنون* were already taught in units 17/22."
  fa.a1.unit40.lesson04.teach.dialogue_line1:
    title: "Nima: Excuse me, I lost my bag."
    gloss: "Excuse me, I lost my bag."
  fa.a1.unit40.lesson04.teach.dialogue_line2:
    title: "Mr. Karimi: Okay. What's your name?"
    gloss: "Okay. What's your name?"
  fa.a1.unit40.lesson04.teach.dialogue_line3:
    title: "Nima: My name is Nima."
    gloss: "My name is Nima."
  fa.a1.unit40.lesson04.teach.dialogue_line4:
    title: "Mr. Karimi: I found this bag!"
    gloss: "I found this bag!"
  fa.a1.unit40.lesson04.teach.dialogue_line5:
    title: "Nima: Thanks!"
    gloss: "Thanks!"

  fa.a1.unit40.lesson05.teach.gomshodeh:
    title: Lost
    gloss: lost
    note: "*گمشده* ('lost') is the adjective form, built from the same *گم* root as *گم کردم* ('I lost it')."
    example_gloss: "The umbrella is lost."
  fa.a1.unit40.lesson05.teach.peydashodeh:
    title: Found
    gloss: found
    note: "*پیداشده* ('found') is the adjective form, built from the same *پیدا* root as *پیدا کردم* ('I found it')."
    example_gloss: "The bag was found."
  fa.a1.unit40.lesson05.teach.reading_text:
    title: "Reading: Found and lost items"
    gloss: "The bag was found. The key was found. The passport is lost. The umbrella is lost."
    note: "A short notice listing which items have been found and which are still lost."

  fa.a1.unit40.lesson06.teach.review_man_kif_gom_kelid_peyda:
    title: "I lost my bag. I found the key."
    gloss: "I lost my bag. I found the key."
    note: "A full review sentence reusing only already-known words from this unit."
  fa.a1.unit40.lesson06.teach.review_chatr_didid:
    title: "Excuse me, have you seen the umbrella?"
    gloss: "Excuse me, have you seen the umbrella?"
  fa.a1.unit40.lesson06.teach.summary_items:
    title: "Bag / key / passport / umbrella"
    gloss: "bag / key / passport / umbrella"
    note: "These are the four lost-and-found items taught in this unit."

exercises:
  fa.a1.unit40.lesson01.exercise01.recognize_kif:
    instruction: "What does this word mean?"
    correct_option: bag
    distractors: [key, passport, umbrella]
    accepted_answers: [{value: bag, status: correct}]
    feedback: "کیف means bag."
  fa.a1.unit40.lesson01.exercise02.recognize_kelid:
    instruction: "What does this word mean?"
    correct_option: key
    distractors: [bag, umbrella, wallet]
    accepted_answers: [{value: key, status: correct}]
    feedback: "کلید means key."
  fa.a1.unit40.lesson01.exercise03.match_lost_items_one:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {کیف: bag, کلید: key, "گم کردم": "I lost (it)", "این کیف منه.": "This bag is mine.", "این کلید منه.": "This key is mine.", "من کیف رو گم کردم.": "I lost my bag."}
        status: correct
    feedback: "These are the first new lost-item words for this unit, plus the گم کردم ('I lost it') phrase."
  fa.a1.unit40.lesson01.exercise04.word_order_man_kif_gom_kardam:
    instruction: "Put the words in order."
    accepted_answers: [{value: [من, کیف, رو, گم, کردم], status: correct}]
    feedback: "من کیف رو گم کردم means 'I lost my bag!'"
  fa.a1.unit40.lesson01.exercise05.translate_in_kelid_maneh:
    instruction: "Translate into English: این کلید منه."
    answer_language_code: en
    accepted_answers:
      - {value: "This key is mine", status: correct}
      - {value: "This key is mine.", status: correct}
      - {value: "This is my key", status: correct}
      - {value: "This is my key.", status: correct}
    feedback: "این کلید منه means 'This key is mine.'"

  fa.a1.unit40.lesson02.exercise01.recognize_gozarnameh:
    instruction: "What does this word mean?"
    correct_option: passport
    distractors: [bag, key, umbrella]
    accepted_answers: [{value: passport, status: correct}]
    feedback: "گذرنامه means passport."
  fa.a1.unit40.lesson02.exercise02.recognize_chatr:
    instruction: "What does this word mean?"
    correct_option: umbrella
    distractors: [passport, key, bag]
    accepted_answers: [{value: umbrella, status: correct}]
    feedback: "چتر means umbrella."
  fa.a1.unit40.lesson02.exercise03.match_lost_items_two:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {گذرنامه: passport, چتر: umbrella, "پیدا کردم": "I found (it)", "این گذرنامه منه.": "This passport is mine.", "این چتر منه.": "This umbrella is mine.", "من کلید رو پیدا کردم!": "I found my key!"}
        status: correct
    feedback: "These are the last new lost-item words for this unit, plus پیدا کردم ('I found it')."
  fa.a1.unit40.lesson02.exercise04.word_order_man_gozarnameh_gom_kardam:
    instruction: "Put the words in order."
    accepted_answers: [{value: [من, گذرنامه, رو, گم, کردم], status: correct}]
    feedback: "من گذرنامه رو گم کردم means 'I lost my passport!'"
  fa.a1.unit40.lesson02.exercise05.translate_man_chatr_gom_kardam:
    instruction: "Translate into English: من چتر رو گم کردم."
    answer_language_code: en
    accepted_answers:
      - {value: "I lost my umbrella", status: correct}
      - {value: "I lost my umbrella.", status: correct}
      - {value: "I lost the umbrella", status: correct}
      - {value: "I lost the umbrella.", status: correct}
    feedback: "من چتر رو گم کردم means 'I lost my umbrella.'"

  fa.a1.unit40.lesson03.exercise01.recognize_didid:
    instruction: "What does this word mean?"
    correct_option: "did you see?"
    distractors: ["did you find?", "did you go?", "did you say?"]
    accepted_answers: [{value: "did you see?", status: correct}]
    feedback: "دیدید means 'did you see?' (formal)."
  fa.a1.unit40.lesson03.exercise02.recognize_kojast:
    instruction: "What does this word mean?"
    correct_option: "where is"
    distractors: ["what is", "who is", "how is"]
    accepted_answers: [{value: "where is", status: correct}]
    feedback: "کجاست means 'where is.'"
  fa.a1.unit40.lesson03.exercise03.match_asking_seen:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"دیدید؟": "did you see?", کجاست: "where is", ببخشید: "excuse me", "چتر رو دیدید؟": "Have you seen the umbrella?", "گذرنامه کجاست؟": "Where is the passport?", "من گذرنامه رو گم کردم.": "I lost my passport."}
        status: correct
    feedback: "These words let you ask a stranger whether they've seen your lost item."
  fa.a1.unit40.lesson03.exercise04.word_order_chatr_didid:
    instruction: "Put the words in order."
    accepted_answers: [{value: [چتر, رو, دیدید], status: correct}]
    feedback: "چتر رو دیدید؟ means 'Have you seen the umbrella?'"
  fa.a1.unit40.lesson03.exercise05.translate_bebakhshid_kif_didid:
    instruction: "Translate into English: ببخشید، کیف رو دیدید؟"
    answer_language_code: en
    accepted_answers:
      - {value: "Excuse me, have you seen the bag?", status: correct}
      - {value: "Excuse me, have you seen the bag", status: correct}
      - {value: "Excuse me, did you see the bag?", status: correct}
      - {value: "Excuse me, did you see the bag", status: correct}
    feedback: "ببخشید، کیف رو دیدید؟ means 'Excuse me, have you seen the bag?'"

  fa.a1.unit40.lesson04.exercise01.dialogue_comprehension_lost_bag:
    instruction: "Nima says this to a lost-and-found clerk. What happened?"
    correct_option: "He lost his bag."
    distractors:
      - "He lost his key."
      - "He lost his passport."
      - "He lost his umbrella."
    accepted_answers: [{value: "He lost his bag.", status: correct}]
    feedback: "ببخشید، کیف رو گم کردم means 'Excuse me, I lost my bag.'"
  fa.a1.unit40.lesson04.exercise02.recognize_man_kif_peyda_kardam:
    instruction: "What does this sentence mean?"
    correct_option: "I found this bag!"
    distractors:
      - "I lost this bag!"
      - "Is this your bag?"
      - "I found this key!"
    accepted_answers: [{value: "I found this bag!", status: correct}]
    feedback: "من این کیف رو پیدا کردم means 'I found this bag!'"
  fa.a1.unit40.lesson04.exercise03.match_dialogue_lost_bag:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {ببخشید: "excuse me", باشه: okay, "اسم شما چیه؟": "What's your name?", "اسمم نیماست.": "My name is Nima.", "پیدا کردم": "I found (it)", ممنون: thanks}
        status: correct
    feedback: "These words appear in the lost-and-found dialogue."
  fa.a1.unit40.lesson04.exercise04.dialogue_response_ask_name:
    instruction: "Respond to ببخشید، کیف رو گم کردم. by saying okay and asking for the person's name."
    accepted_answers:
      - {value: "باشه. اسم شما چیه؟", status: correct}
      - {value: "باشه اسم شما چیه", status: correct}
      - {value: "باشه، اسم شما چیه؟", status: correct}
    feedback: "باشه. اسم شما چیه؟ means 'Okay. What's your name?'"
  fa.a1.unit40.lesson04.exercise05.translate_man_in_kif_peyda_kardam:
    instruction: "Translate into English: من این کیف رو پیدا کردم!"
    answer_language_code: en
    accepted_answers:
      - {value: "I found this bag!", status: correct}
      - {value: "I found this bag", status: correct}
      - {value: "I found the bag!", status: correct}
      - {value: "I found the bag", status: correct}
    feedback: "من این کیف رو پیدا کردم means 'I found this bag!'"

  fa.a1.unit40.lesson05.exercise01.reading_comprehension_found_items:
    instruction: "According to the notice, which items were found?"
    correct_option: "The bag and key were found."
    distractors:
      - "The passport and key were found."
      - "The bag and umbrella were found."
      - "Nothing was found."
    accepted_answers: [{value: "The bag and key were found.", status: correct}]
    feedback: "کیف پیداشده. کلید پیداشده."
  fa.a1.unit40.lesson05.exercise02.reading_comprehension_still_lost_items:
    instruction: "According to the notice, which items are still lost?"
    correct_option: "The passport and umbrella are still lost."
    distractors:
      - "The bag and key are still lost."
      - "Only the passport is still lost."
      - "Nothing is still lost."
    accepted_answers: [{value: "The passport and umbrella are still lost.", status: correct}]
    feedback: "گذرنامه گمشده. چتر گمشده."
  fa.a1.unit40.lesson05.exercise03.match_reading_lost_found:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {گمشده: lost, پیداشده: found, "کیف پیداشده.": "The bag was found.", "کلید پیداشده.": "The key was found.", "گذرنامه گمشده.": "The passport is lost.", "چتر گمشده.": "The umbrella is lost."}
        status: correct
    feedback: "These words let you understand the found/still-lost notice."
  fa.a1.unit40.lesson05.exercise04.translate_chatr_gomshodeh:
    instruction: "Translate into English: چتر گمشده."
    answer_language_code: en
    accepted_answers:
      - {value: "The umbrella is lost", status: correct}
      - {value: "The umbrella is lost.", status: correct}
      - {value: "The umbrella is still lost", status: correct}
      - {value: "The umbrella is still lost.", status: correct}
    feedback: "چتر گمشده means 'The umbrella is lost.'"
  fa.a1.unit40.lesson05.exercise05.write_notice_line:
    instruction: "Write a short sentence saying an item was found or is lost, using this notice's pattern."
    accepted_answers:
      - {value: "کیف پیداشده.", status: correct}
      - {value: "کیف پیداشده", status: correct}
      - {value: "کلید پیداشده.", status: correct}
      - {value: "کلید پیداشده", status: correct}
      - {value: "گذرنامه گمشده.", status: correct}
      - {value: "گذرنامه گمشده", status: correct}
      - {value: "چتر گمشده.", status: correct}
      - {value: "چتر گمشده", status: correct}
    feedback: "A notice line can name an item and say پیداشده ('found') or گمشده ('lost'), e.g. کیف پیداشده."

  fa.a1.unit40.lesson06.exercise01.recognize_review_kif_kelid:
    instruction: "What does this sentence mean?"
    correct_option: "I lost my bag. I found the key."
    distractors:
      - "I found my bag. I lost the key."
      - "I lost my bag. I lost the key."
      - "I found my bag. I found the key."
    accepted_answers: [{value: "I lost my bag. I found the key.", status: correct}]
    feedback: "من کیف رو گم کردم. کلید رو پیدا کردم. means 'I lost my bag. I found the key.'"
  fa.a1.unit40.lesson06.exercise02.recognize_review_chatr_didid:
    instruction: "What does this sentence mean?"
    correct_option: "Excuse me, have you seen the umbrella?"
    distractors:
      - "Excuse me, where is the umbrella?"
      - "Excuse me, I lost the umbrella."
      - "Excuse me, is this your umbrella?"
    accepted_answers: [{value: "Excuse me, have you seen the umbrella?", status: correct}]
    feedback: "ببخشید، چتر رو دیدید؟ means 'Excuse me, have you seen the umbrella?'"
  fa.a1.unit40.lesson06.exercise03.match_wrap_lost_items:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {کیف: bag, کلید: key, گذرنامه: passport, چتر: umbrella, "گم کردم": "I lost (it)", "پیدا کردم": "I found (it)", "دیدید؟": "did you see?"}
        status: correct
    feedback: "This reviews all four lost-item words from this unit, plus گم کردم/پیدا کردم/دیدید."
  fa.a1.unit40.lesson06.exercise04.word_order_gozarnameh_didid:
    instruction: "Put the words in order."
    accepted_answers: [{value: [گذرنامه, رو, دیدید], status: correct}]
    feedback: "گذرنامه رو دیدید؟ means 'Have you seen the passport?'"
  fa.a1.unit40.lesson06.exercise05.write_lost_or_seen_sentence:
    instruction: "Write a short sentence reporting a lost item or asking if someone has seen it."
    accepted_answers:
      - {value: "چتر رو گم کردم", status: correct}
      - {value: "چتر رو گم کردم.", status: correct}
      - {value: "من چتر رو گم کردم", status: correct}
      - {value: "من چتر رو گم کردم.", status: correct}
      - {value: "گذرنامه رو دیدید؟", status: correct}
      - {value: "گذرنامه رو دیدید", status: correct}
      - {value: "کیف رو دیدید؟", status: correct}
      - {value: "کیف رو دیدید", status: correct}
    feedback: "A wrap-up sentence can report a lost item with گم کردم, or ask if someone's seen it with ___ رو دیدید؟"
