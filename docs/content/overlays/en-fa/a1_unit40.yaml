      - "Nothing is still lost."
    accepted_answers: [{value: "The passport and umbrella are still lost.", status: correct}]
    feedback: "The notice says *گذرنامه گمشده* ('the passport is lost') and *چتر گمشده* ('the umbrella is lost')."
  fa.a1.unit40.lesson05.exercise03.match_reading_lost_found:
