  fa.a2.unit35.lesson03.exercise01.pick_before_verb:
    instruction: Complete the sentence “Before I leave, I close the door.” Which verb fits after قبل از اینکه?
    correct_option: برم
    distractors:
    - رفتم
    - می‌رم
    - برو
    accepted_answers:
    - value: برم
      status: correct
    feedback: Use the subjunctive *برم* after *قبل از اینکه*, not the past *رفتم*.
  fa.a2.unit35.lesson03.exercise02.pick_after_verb:
    instruction: Complete the sentence “After I arrived, I called Sara.” Which verb fits after بعد از اینکه?
    correct_option: رسیدم
    distractors:
    - برسم
    - می‌رسم
    - رسیدی
    accepted_answers:
    - value: رسیدم
      status: correct
    feedback: Use the simple past *رسیدم* after *بعد از اینکه* when the event already happened.
  fa.a2.unit35.lesson03.exercise03.match_before_after:
    instruction: Match each clause with its meaning.
    accepted_answers:
    - value:
        قبل از اینکه برم: before I leave
        بعد از اینکه رفتم: after I left
        قبل از اینکه بخوابم: before I go to sleep
        بعد از اینکه خوابیدم: after I fell asleep
        قبل از اینکه بخرم: before I buy
        بعد از اینکه خریدم: after I bought
        قبل از اینکه برسم: before I arrive
        بعد از اینکه رسیدم: after I arrived
      status: correct
    feedback: Subjunctive (*برم، بخوابم، بخرم، برسم*) goes with *قبل*; simple past (*رفتم، خوابیدم، خریدم، رسیدم*) goes with *بعد*.
  fa.a2.unit35.lesson03.exercise04.order_before_call:
    instruction: 'Arrange the words to say: Before I arrive, I call Sara.'
    accepted_answers:
