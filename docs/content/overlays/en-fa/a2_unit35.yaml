  fa.a2.unit35.lesson02.exercise06.translate_after:
    instruction: 'Translate using بعد از اینکه and the simple past: After I arrived, I called Sara.'
    accepted_answers:
    - value: بعد از اینکه رسیدم، به سارا زنگ زدم
      status: correct
    - value: بعد از اینکه رسیدم به سارا زنگ زدم
