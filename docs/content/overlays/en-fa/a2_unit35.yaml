    feedback: '*قبل از اینکه برم، در رو بستم*: the verb after *قبل از اینکه* stays *برم*, even though the main verb is past.'
  fa.a2.unit35.lesson04.exercise01.recognize_when_past:
    instruction: What does this sentence mean?
    correct_option: When I arrived, I called Sara.
    distractors:
