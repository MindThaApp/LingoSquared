teaching:
  fa.a2.unit35.lesson01.teach.connectors:
    title: Three time links
    gloss: before, after, when
    note: '*قبل از اینکه* means “before,” *بعد از اینکه* means “after,” and *وقتی* means “when.” Each one starts a clause that says when something happens.'
    example_gloss:
    - Before I leave, I close the door.
    - After I arrived, I called Sara.
    - When I arrived, I called Sara.
  fa.a2.unit35.lesson01.teach.home_words:
    title: Home and daily words
    gloss: home, door, light, toothbrush, breakfast, food, tea
    note: '*رو* marks a definite object in speech: *در رو* is “the door.” *مسواک* names the brush and also the action in *مسواک می‌زنم*.'
    example_gloss:
    - I close the door.
    - I turn off the light.
    - I ate and had tea.
  fa.a2.unit35.lesson01.teach.subjunctive_verbs:
    title: Verbs after “before”
    gloss: I leave, I sleep, I arrive, I buy, I cook, I get on
    note: 'After *قبل از اینکه* the verb takes the subjunctive: *ب* + stem + ending (*برم، بخوابم، برسم*). There is no *می‌* in this verb. The main verb is the habit: *می‌بندم، می‌زنم*.'
    example_gloss:
    - Before I sleep, I brush my teeth.
    - Before I arrive, I call Sara.
    - Before I get on, I buy a ticket.
    - Before I cook, I wash the vegetables.
  fa.a2.unit35.lesson01.teach.past_verbs:
    title: Simple past verbs
    gloss: I arrived, I called, I ate
    note: These are ordinary simple-past verbs. After *بعد از اینکه* and *وقتی* in a story we use the simple past.
    example_gloss:
    - I arrived at the station.
    - I called Sara.
    - I ate.
  fa.a2.unit35.lesson01.teach.before_subjunctive:
    title: قبل از اینکه + subjunctive
    gloss: Before I leave, I close the door
    note: 'After *قبل از اینکه* the verb is subjunctive: *برم، بخوابم، برسم*. The action in the *قبل از اینکه* clause comes second; the action in the main clause comes first. In *قبل از اینکه برم، در رو می‌بندم* the door is closed first, then you leave.'
  fa.a2.unit35.lesson02.teach.travel_words:
    title: Travel words
    gloss: train, ticket, station, I got on, I bought
    note: '*سوار شدم* is the whole action “I got on” (a train, a bus). *بلیت* is a ticket.'
    example_gloss:
    - I bought a ticket.
    - I got on the train.
    - I arrived at the station.
  fa.a2.unit35.lesson02.teach.cook_and_day_verbs:
    title: More past verbs
    gloss: I washed, I cooked, I slept, I took
    note: These simple-past forms (*شستم، پختم، خوابیدم، گرفتم*) are the verbs we use after *بعد از اینکه*.
    example_gloss:
    - I washed the vegetables.
    - I cooked.
    - I took a shower.
    - I slept.
  fa.a2.unit35.lesson02.teach.after_past:
    title: بعد از اینکه + simple past
    gloss: After I arrived, I called
    note: 'After *بعد از اینکه* use the simple past: *رسیدم، خریدم، شستم*. The *بعد از اینکه* clause happened first. Example: *بعد از اینکه بلیت خریدم، سوار قطار شدم* means first you bought the ticket, then you got on. No subjunctive here.'
  fa.a2.unit35.lesson03.teach.contrast_verbs:
    title: Go and close, past and present
    gloss: I went, I closed, I go
    note: 'These are the forms we compare: *رفتم* (I went) and *می‌رم* (I go) against the subjunctive *برم*.'
    example_gloss:
    - I left home.
    - I closed the door.
    - I am going.
  fa.a2.unit35.lesson03.teach.contrast_forms:
    title: Subjunctive after قبل, past after بعد
    gloss: before I leave / after I left
    note: 'The two links need two different verb forms. *قبل از اینکه برم* (before I leave): subjunctive, the event has not happened yet. *بعد از اینکه رفتم* (after I left): simple past, the event is done. Compare *برم / رفتم*, *بخرم / خریدم*, *برسم / رسیدم*.'
  fa.a2.unit35.lesson03.teach.before_any_tense:
    title: The verb after قبل stays subjunctive
    gloss: Before I left, I closed the door
    note: 'The verb after *قبل از اینکه* is subjunctive even when the main verb is in the past: *قبل از اینکه برم، در رو بستم* means “Before I left, I closed the door.” Never put *رفتم* after *قبل از اینکه*.'
  fa.a2.unit35.lesson04.teach.when_words:
    title: Words for “when”
    gloss: music, listen, came, I arrive, I cook
    note: '*گوش می‌دم* is “I listen.” *اومد* is the spoken past of “came.” *رسیدی* is “you arrived,” and *چیکار کردی؟* is “what did you do?”'
    example_gloss:
    - When I cook, I listen to music.
    - When the train came, I got on.
    - When I arrive, I call Sara.
  fa.a2.unit35.lesson04.teach.when_forms:
    title: وقتی + past or present
    gloss: When I arrived, I called; when I arrive, I call
    note: '*وقتی* takes the verb form that matches the time. A finished event uses the simple past: *وقتی رسیدم، زنگ زدم* (when I arrived, I called). A habit or a plan uses the present with *می‌*: *وقتی می‌رسم، زنگ می‌زنم* (when I arrive, I call). *وقتی* does not say which comes first, so use *قبل از اینکه* or *بعد از اینکه* for a strict order.'
  fa.a2.unit35.lesson05.teach.yesterday_words:
    title: Words for the reading
    gloss: yesterday, morning, I turned off
    note: '*خاموش کردم* is the simple past of “I turned off.” *دیروز صبح* is “yesterday morning.”'
    example_gloss:
    - I took a shower yesterday morning.
    - I turned off the light.
  fa.a2.unit35.lesson05.teach.reading:
    title: A morning and a train
    gloss: Yesterday morning, after I took a shower, I ate breakfast. Before I left home, I turned off the light and closed the door. When I arrived at the station, I bought a ticket. After the train came, I got on.
    note: 'Read once for the order of events, then find the three links: *بعد از اینکه، قبل از اینکه، وقتی*.'
  fa.a2.unit35.lesson06.teach.dialogue_words:
    title: Words for the conversation
    gloss: tomorrow, to me, you arrive, we ate, we drink
    note: '*بهم* is “to me” and *بهت* is “to you.” *برسی* is the subjunctive “you arrive.” *خوردیم* is “we ate” and *می‌خوریم* is “we eat/drink.”'
    example_gloss:
    - Will you call me tomorrow?
    - Yes, I will call you.
    - We ate, and we will have tea.
  fa.a2.unit35.lesson06.teach.turn01:
    title: Sara asks about yesterday
    gloss: 'Sara asks Nima: After you arrived at the station yesterday, what did you do?'
    note: Sara uses *بعد از اینکه* with the past.
  fa.a2.unit35.lesson06.teach.turn02:
    title: Nima tells the sequence
    gloss: After I arrived, I bought a ticket. When the train came, I got on.
    note: Nima answers with *بعد از اینکه* and *وقتی*, both with past verbs.
  fa.a2.unit35.lesson06.teach.turn03:
    title: Sara asks about tomorrow
    gloss: Tomorrow, before you arrive, will you call me?
    note: Sara uses *قبل از اینکه* with the subjunctive *برسی*.
  fa.a2.unit35.lesson06.teach.turn04:
    title: Nima agrees
    gloss: Yes, before I arrive, I will call you.
    note: 'Nima repeats the subjunctive with his own ending: *برسم*.'
  fa.a2.unit35.lesson06.teach.turn05:
    title: Sara plans dinner
    gloss: Good. Before you arrive, I will cook.
    note: 'Both people have their own subject: *من* and *تو*.'
  fa.a2.unit35.lesson06.teach.turn06:
    title: Nima plans tea
    gloss: Great! After we eat, we will have tea.
    note: Here the *بعد از اینکه* clause is past and the main clause is the plan.
exercises:
  fa.a2.unit35.lesson01.exercise01.recognize_before:
    instruction: Which order of events does this sentence describe?
    correct_option: I close the door first, then I leave.
    distractors:
    - I leave first, then I close the door.
    - I close the door while I am leaving.
    - I do not close the door.
    accepted_answers:
    - value: I close the door first, then I leave.
      status: correct
    feedback: In *قبل از اینکه برم، در رو می‌بندم* the main action (closing the door) comes before the leaving.
  fa.a2.unit35.lesson01.exercise02.recognize_after:
    instruction: Which order of events does this sentence describe?
    correct_option: I arrived first, then I called Sara.
    distractors:
    - I called Sara first, then I arrived.
    - I called Sara while I was arriving.
    - I did not call Sara.
    accepted_answers:
    - value: I arrived first, then I called Sara.
      status: correct
    feedback: The *بعد از اینکه* clause (arriving) happens first; the call comes after it.
  fa.a2.unit35.lesson01.exercise03.match_clauses:
    instruction: Match each time clause with its meaning.
    accepted_answers:
    - value:
        قبل از اینکه برم: before I leave
        بعد از اینکه رسیدم: after I arrived
        وقتی رسیدم: when I arrived
        قبل از اینکه بخوابم: before I sleep
        بعد از اینکه غذا خوردم: after I ate
        قبل از اینکه برسم: before I arrive
        بعد از اینکه مسواک زدم: after I brushed my teeth
        قبل از اینکه بخرم: before I buy
      status: correct
    feedback: 'Look at the link word first, then at the verb form: subjunctive after *قبل از اینکه*, simple past after *بعد از اینکه*.'
  fa.a2.unit35.lesson01.exercise04.order_before:
    instruction: 'Arrange the words to say: Before I leave, I close the door.'
    accepted_answers:
    - value:
      - قبل
      - از
      - اینکه
      - برم
      - در
      - رو
      - می‌بندم
      status: correct
    feedback: '*قبل از اینکه برم، در رو می‌بندم* is the model.'
  fa.a2.unit35.lesson01.exercise05.fill_before_verb:
    instruction: 'Complete with the subjunctive verb for “I leave” (after قبل از اینکه): Before I leave, I close the door.'
    accepted_answers:
    - value: برم
      status: correct
    feedback: The full sentence is *قبل از اینکه برم، در رو می‌بندم*.
  fa.a2.unit35.lesson01.exercise06.translate_before:
    instruction: 'Translate using قبل از اینکه and the subjunctive: Before I sleep, I brush my teeth.'
    accepted_answers:
    - value: قبل از اینکه بخوابم، مسواک می‌زنم
      status: correct
    - value: قبل از اینکه بخوابم مسواک می‌زنم
      status: correct
    feedback: '*قبل از اینکه بخوابم، مسواک می‌زنم* is the model.'
  fa.a2.unit35.lesson02.exercise01.recognize_ate_tea:
    instruction: Which order of events does this sentence describe?
    correct_option: I ate first, then I had tea.
    distractors:
    - I had tea first, then I ate.
    - I ate and had tea at the same time.
    - I did not eat.
    accepted_answers:
    - value: I ate first, then I had tea.
      status: correct
    feedback: The *بعد از اینکه* clause (eating) is the earlier event.
  fa.a2.unit35.lesson02.exercise02.recognize_ticket_train:
    instruction: Which order of events does this sentence describe?
    correct_option: I bought a ticket first, then I got on the train.
    distractors:
    - I got on the train first, then I bought a ticket.
    - I got on the train without a ticket.
    - I did not get on the train.
    accepted_answers:
    - value: I bought a ticket first, then I got on the train.
      status: correct
    feedback: First *بلیت خریدم*, then *سوار قطار شدم*.
  fa.a2.unit35.lesson02.exercise03.match_past_verbs:
    instruction: Match each simple past verb with its meaning.
    accepted_answers:
    - value:
        خریدم: I bought
        رسیدم: I arrived
        خوردم: I ate
        شستم: I washed
        پختم: I cooked
        خوابیدم: I slept
        سوار شدم: I got on
        زنگ زدم: I called
      status: correct
    feedback: Each of these verbs can follow *بعد از اینکه*.
  fa.a2.unit35.lesson02.exercise04.order_washed_cooked:
