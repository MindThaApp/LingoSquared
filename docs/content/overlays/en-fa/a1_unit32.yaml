course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: talking about household chores, saying what
    needs doing, saying who does the dishes, laundry, sweeping, and room
    cleaning, and asking someone for help with a chore.

units:
  fa.a1.unit32.household:
    title: Household Chores

lessons:
  fa.a1.unit32.lesson01.chore_vocabulary: {title: "Chore words"}
  fa.a1.unit32.lesson02.doing_chores: {title: "What chore are you doing?"}
  fa.a1.unit32.lesson03.ask_for_help: {title: "Will you help?"}
  fa.a1.unit32.lesson04.household_dialogue: {title: "Dialogue: Household chores"}
  fa.a1.unit32.lesson05.reading_chores: {title: "Reading about chores"}
  fa.a1.unit32.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit32.lesson01.teach.zarf_shostan:
    title: Washing dishes
    gloss: washing dishes
    note: "*ظرف شستن* literally combines *ظرف* ('dish') + *شستن* ('washing')."
    example_gloss: "Washing dishes is my chore."
  fa.a1.unit32.lesson01.teach.lebas_shostan:
    title: Doing laundry
    gloss: doing laundry
    note: "*لباس شستن* literally means 'washing clothes,' the everyday way to talk about doing laundry."
    example_gloss: "Doing laundry is my chore today."
  fa.a1.unit32.lesson01.teach.tamiz_kardan:
    title: Cleaning
    gloss: cleaning
    note: "*تمیز کردن* means 'to clean.'"
    example_gloss: "I clean the room."
  fa.a1.unit32.lesson01.teach.jaru_zadan:
    title: Sweeping
    gloss: sweeping
    note: "*جارو زدن* means 'to sweep' or 'to vacuum,' depending on the home and tool."
    example_gloss: "I sweep the house."
  fa.a1.unit32.lesson01.teach.review_house_words:
    title: "Home / room / chore / my / and"
    gloss: "home / room / chore / my / and"
    note: "*خانه*, *اتاق*, *کار*, *من*, and *و* reappear here from earlier units."
  fa.a1.unit32.lesson01.teach.review_object_marker:
    title: "Object marker / I do / need to"
    gloss: "object marker / I do / need to"
    note: "*رو* marks the object; *می‌کنم* means 'I do'; *باید* means 'must' or 'need to.'"
  fa.a1.unit32.lesson01.teach.need_clean_room:
    title: "I need to clean the room"
    gloss: "I need to clean the room"
    note: "*باید اتاق رو تمیز کنم* is a direct, useful chore sentence."

  fa.a1.unit32.lesson02.teach.review_questions:
    title: "What / when / today"
    gloss: "what / when / today"
    note: "*چی*, *کِی*, and *امروز* are review question/time words."
  fa.a1.unit32.lesson02.teach.mikoni_pattern:
    title: "I do -> you do"
    gloss: "I do -> you do"
    note: "*می‌کنی* is the informal 'you do' form, parallel to *می‌کنم*."
  fa.a1.unit32.lesson02.teach.question_what_chore:
    title: "What chore are you doing today?"
    gloss: "What chore are you doing today?"
    note: "*امروز چه کاری می‌کنی؟* asks what task someone is doing today."
  fa.a1.unit32.lesson02.teach.mishuram_pattern:
    title: "I wash"
    gloss: "I wash"
    note: "*می‌شورم* means 'I wash.'"
  fa.a1.unit32.lesson02.teach.zarfha_answer:
    title: "I wash the dishes"
    gloss: "I wash the dishes"
    note: "*ظرف‌ها* is 'the dishes.'"
  fa.a1.unit32.lesson02.teach.lebasha_answer:
    title: "I do the laundry"
    gloss: "I do the laundry"
    note: "*لباس‌ها رو می‌شورم* literally means 'I wash the clothes.'"

  fa.a1.unit32.lesson03.teach.help_word:
    title: Help
    gloss: help
    note: "*کمک* means 'help.'"
    example_gloss: "Will you help?"
  fa.a1.unit32.lesson03.teach.help_question:
    title: "Will you help?"
    gloss: "Will you help?"
    note: "*کمک می‌کنی؟* is a simple informal request."
  fa.a1.unit32.lesson03.teach.review_please:
    title: "Please / then / definitely"
    gloss: "please / then / definitely"
    note: "*لطفاً*, *بعد*, and *حتماً* make the request and answer polite and natural."
  fa.a1.unit32.lesson03.teach.help_request_room:
    title: "Will you please help me clean the room?"
    gloss: "Will you please help me clean the room?"
    note: "*لطفاً کمک می‌کنی اتاق رو تمیز کنم؟* asks for help with a specific chore."
  fa.a1.unit32.lesson03.teach.accept_help:
    title: "Definitely. Then I'll sweep."
    gloss: "Definitely. Then I'll sweep."
    note: "*حتماً. بعد جارو می‌زنم* accepts and names the next chore."

  fa.a1.unit32.lesson04.teach.review_dialogue_words:
    title: "Messy / yeah / great / thanks"
    gloss: "messy / yeah / great / thanks"
    note: "*شلوغه* can mean a place is crowded, busy, or messy; here the home is messy."
  fa.a1.unit32.lesson04.teach.dialogue_line1:
    title: "Sara: Nima, the house is very messy today."
    gloss: "Nima, the house is very messy today."
  fa.a1.unit32.lesson04.teach.dialogue_line2:
    title: "Nima: Yeah, I'll wash the dishes."
    gloss: "Yeah, I'll wash the dishes."
  fa.a1.unit32.lesson04.teach.dialogue_line3:
    title: "Sara: I'll clean the room. Will you help later?"
    gloss: "I'll clean the room. Will you help later?"
  fa.a1.unit32.lesson04.teach.dialogue_line4:
    title: "Nima: Definitely. Then I'll do the laundry."
    gloss: "Definitely. Then I'll do the laundry."
  fa.a1.unit32.lesson04.teach.dialogue_line5:
    title: "Sara: Great, thanks!"
    gloss: "Great, thanks!"

  fa.a1.unit32.lesson05.teach.review_third_person:
    title: "He/she washes / he/she cleans"
    gloss: "he/she washes / he/she cleans"
    note: "*می‌شوره* and *می‌کنه* are 3rd-person colloquial forms for describing what someone else does."
  fa.a1.unit32.lesson05.teach.review_responsibility:
    title: "Responsible / chores"
    gloss: "responsible / chores"
    note: "*کارها* literally means 'the tasks' and works naturally here for household chores."
  fa.a1.unit32.lesson05.teach.reading_text:
    title: "Reading: Household chores"
    gloss: "Today the house is messy. Nima washes the dishes and does the laundry. Sara cleans the room. Both help."
    note: "This reading repeats the dialogue facts in the 3rd person."

  fa.a1.unit32.lesson06.teach.review_tonight:
    title: "Tonight / first / then"
    gloss: "tonight / first / then"
    note: "*امشب*, *اول*, and *بعد* let you order chores in a short message."
  fa.a1.unit32.lesson06.teach.wrap_summary:
    title: "Tonight first I wash the dishes, then I clean the room"
    gloss: "Tonight first I wash the dishes, then I clean the room"
    note: "*امشب اول ظرف‌ها رو می‌شورم، بعد اتاق رو تمیز می‌کنم* is a natural short chore plan."
  fa.a1.unit32.lesson06.teach.help_wrap:
    title: "Will you please help with the housework?"
    gloss: "Will you please help with the housework?"
    note: "*کارهای خانه* means 'housework' or 'household chores.'"

exercises:
  fa.a1.unit32.lesson01.exercise01.recognize_zarf_shostan:
    instruction: "What does this phrase mean?"
    correct_option: "washing dishes"
    distractors: ["doing laundry", cleaning, sweeping]
    accepted_answers: [{value: "washing dishes", status: correct}]
    feedback: "ظرف شستن means washing dishes."
  fa.a1.unit32.lesson01.exercise02.recognize_tamiz_kardan:
    instruction: "What does this phrase mean?"
    correct_option: cleaning
    distractors: ["washing dishes", "doing laundry", sweeping]
    accepted_answers: [{value: cleaning, status: correct}]
    feedback: "تمیز کردن means cleaning."
  fa.a1.unit32.lesson01.exercise03.match_chore_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"ظرف شستن": "washing dishes", "لباس شستن": "doing laundry", "تمیز کردن": cleaning, "جارو زدن": sweeping, خانه: home, اتاق: room, "باید اتاق رو تمیز کنم.": "I need to clean the room."}
        status: correct
    feedback: "These are the core chore words for this unit."
  fa.a1.unit32.lesson01.exercise04.word_order_need_clean:
    instruction: "Put the words in order."
    accepted_answers: [{value: [باید, اتاق, رو, تمیز, کنم], status: correct}]
    feedback: "باید اتاق رو تمیز کنم means 'I need to clean the room.'"
  fa.a1.unit32.lesson01.exercise05.translate_need_clean:
    instruction: "Translate into English: باید اتاق رو تمیز کنم."
    answer_language_code: en
    accepted_answers:
      - {value: "I need to clean the room", status: correct}
      - {value: "I need to clean the room.", status: correct}
      - {value: "I have to clean the room", status: correct}
      - {value: "I have to clean the room.", status: correct}
    feedback: "باید اتاق رو تمیز کنم means 'I need to clean the room.'"

  fa.a1.unit32.lesson02.exercise01.recognize_mishuram:
    instruction: "What does this word mean?"
    correct_option: "I wash"
    distractors: ["you do", today, what]
    accepted_answers: [{value: "I wash", status: correct}]
    feedback: "می‌شورم means 'I wash.'"
  fa.a1.unit32.lesson02.exercise02.recognize_question:
    instruction: "What does this question mean?"
    correct_option: "What chore are you doing today?"
    distractors:
      - "When is your birthday?"
      - "Where do you study?"
      - "Will you come to the party?"
    accepted_answers: [{value: "What chore are you doing today?", status: correct}]
    feedback: "امروز چه کاری می‌کنی؟ asks what task someone is doing today."
  fa.a1.unit32.lesson02.exercise03.match_doing_chores:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {چی: what, کِی: when, امروز: today, "می‌کنی": "you do", "می‌شورم": "I wash", "ظرف‌ها": dishes, "لباس‌ها": clothes, "من ظرف‌ها رو می‌شورم.": "I wash the dishes."}
        status: correct
    feedback: "These combine the question with a chore answer."
  fa.a1.unit32.lesson02.exercise04.word_order_wash_dishes:
    instruction: "Put the words in order."
    accepted_answers: [{value: [من, "ظرف‌ها", رو, "می‌شورم"], status: correct}]
    feedback: "من ظرف‌ها رو می‌شورم means 'I wash the dishes.'"
  fa.a1.unit32.lesson02.exercise05.translate_laundry:
    instruction: "Translate into English: لباس‌ها رو می‌شورم."
    answer_language_code: en
    accepted_answers:
      - {value: "I do the laundry", status: correct}
      - {value: "I do the laundry.", status: correct}
      - {value: "I wash the clothes", status: correct}
      - {value: "I wash the clothes.", status: correct}
    feedback: "لباس‌ها رو می‌شورم literally means 'I wash the clothes,' used here as 'I do the laundry.'"

  fa.a1.unit32.lesson03.exercise01.recognize_help:
    instruction: "What does this word mean?"
    correct_option: help
    distractors: [please, then, definitely]
    accepted_answers: [{value: help, status: correct}]
    feedback: "کمک means help."
  fa.a1.unit32.lesson03.exercise02.recognize_help_question:
    instruction: "What does this question mean?"
    correct_option: "Will you help?"
    distractors:
      - "Will you study?"
      - "Will you come to the party?"
      - "Are you washing clothes?"
    accepted_answers: [{value: "Will you help?", status: correct}]
    feedback: "کمک می‌کنی؟ means 'Will you help?'"
  fa.a1.unit32.lesson03.exercise03.match_help_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {کمک: help, لطفاً: please, بعد: then, حتماً: definitely, "می‌زنم": "I do / I hit", "کمک می‌کنی؟": "Will you help?", "لطفاً کمک می‌کنی اتاق رو تمیز کنم؟": "Will you please help me clean the room?", "حتماً. بعد جارو می‌زنم.": "Definitely. Then I'll sweep."}
        status: correct
    feedback: "These words let you ask for and accept help."
  fa.a1.unit32.lesson03.exercise04.dialogue_response_help:
    instruction: "Respond to لطفاً کمک می‌کنی؟ by saying you'll definitely help."
    accepted_answers:
      - {value: "حتماً کمک می‌کنم", status: correct}
      - {value: "حتماً کمک می‌کنم.", status: correct}
      - {value: "حتماً", status: correct}
    feedback: "حتماً کمک می‌کنم means 'I'll definitely help.'"
  fa.a1.unit32.lesson03.exercise05.translate_help_request:
    instruction: "Translate into English: لطفاً کمک می‌کنی اتاق رو تمیز کنم؟"
    answer_language_code: en
    accepted_answers:
      - {value: "Will you please help me clean the room?", status: correct}
      - {value: "Can you please help me clean the room?", status: correct}
      - {value: "Please will you help me clean the room?", status: correct}
    feedback: "لطفاً کمک می‌کنی اتاق رو تمیز کنم؟ asks for help with cleaning the room."

  fa.a1.unit32.lesson04.exercise01.dialogue_comprehension_context:
    instruction: "What chores do Nima and Sara do?"
    correct_option: "Nima washes the dishes and later does the laundry; Sara cleans the room."
    distractors:
      - "Sara does all the chores alone."
      - "Nima cleans the room and Sara does the laundry."
      - "They talk about a birthday party, not chores."
    accepted_answers: [{value: "Nima washes the dishes and later does the laundry; Sara cleans the room.", status: correct}]
    feedback: "نیما ظرف‌ها و لباس‌ها رو می‌شوره؛ سارا اتاق رو تمیز می‌کنه."
  fa.a1.unit32.lesson04.exercise02.recognize_shlooghe:
    instruction: "What does this word mean here?"
    correct_option: "it's messy"
    distractors: ["it's expensive", "it's early", "it's interesting"]
    accepted_answers: [{value: "it's messy", status: correct}]
    feedback: "شلوغه can mean crowded or busy; for a home here, it means messy."
  fa.a1.unit32.lesson04.exercise03.match_dialogue_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {شلوغه: "it's messy", آره: yeah, عالیه: great, ممنون: thanks, خیلی: very, "ظرف‌ها رو می‌شورم.": "I wash the dishes.", "اتاق رو تمیز می‌کنم.": "I clean the room.", "لباس‌ها رو می‌شورم.": "I do the laundry."}
        status: correct
    feedback: "This reviews the dialogue's chore plan."
  fa.a1.unit32.lesson04.exercise04.dialogue_response_accept_help:
    instruction: "Respond to بعد کمک می‌کنی؟ by accepting and saying you'll do the laundry later."
    accepted_answers:
      - {value: "حتماً بعد لباس‌ها رو می‌شورم", status: correct}
      - {value: "حتماً. بعد لباس‌ها رو می‌شورم.", status: correct}
      - {value: "حتماً، بعد لباس‌ها رو می‌شورم.", status: correct}
    feedback: "حتماً. بعد لباس‌ها رو می‌شورم accepts and names the later chore."
  fa.a1.unit32.lesson04.exercise05.translate_room_line:
    instruction: "Translate into English: من اتاق رو تمیز می‌کنم."
    answer_language_code: en
    accepted_answers:
      - {value: "I clean the room", status: correct}
      - {value: "I clean the room.", status: correct}
      - {value: "I'm cleaning the room", status: correct}
      - {value: "I'm cleaning the room.", status: correct}
    feedback: "من اتاق رو تمیز می‌کنم means 'I clean the room' or 'I'm cleaning the room.'"

  fa.a1.unit32.lesson05.exercise01.reading_comprehension_nima:
    instruction: "What does Nima do?"
    correct_option: "Nima washes the dishes and does the laundry."
    distractors:
      - "Nima cleans Sara's room."
      - "Nima goes to university."
      - "Nima buys a birthday cake."
    accepted_answers: [{value: "Nima washes the dishes and does the laundry.", status: correct}]
    feedback: "نیما ظرف‌ها رو می‌شوره و لباس‌ها رو می‌شوره."
  fa.a1.unit32.lesson05.exercise02.reading_comprehension_sara:
    instruction: "What does Sara do?"
    correct_option: "Sara cleans the room."
    distractors:
      - "Sara washes the dishes."
      - "Sara does nothing today."
      - "Sara sends a message."
    accepted_answers: [{value: "Sara cleans the room.", status: correct}]
    feedback: "سارا اتاق رو تمیز می‌کنه."
  fa.a1.unit32.lesson05.exercise03.match_reading_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"می‌شوره": "he/she washes", "می‌کنه": "he/she does", مسئول: responsible, کارها: chores, "هر دو": both, "می‌کنن": "they do", "نیما ظرف‌ها رو می‌شوره.": "Nima washes the dishes.", "سارا اتاق رو تمیز می‌کنه.": "Sara cleans the room."}
        status: correct
    feedback: "These words tell who does each chore."
  fa.a1.unit32.lesson05.exercise04.translate_reading_sentence:
    instruction: "Translate into English: هر دو کمک می‌کنن."
    answer_language_code: en
    accepted_answers:
      - {value: "Both help", status: correct}
      - {value: "Both help.", status: correct}
      - {value: "They both help", status: correct}
      - {value: "They both help.", status: correct}
    feedback: "هر دو کمک می‌کنن means 'They both help.'"
  fa.a1.unit32.lesson05.exercise05.write_chore_sentence:
    instruction: "Write a short sentence saying which chore you do."
    accepted_answers:
      - {value: "من ظرف‌ها رو می‌شورم", status: correct}
      - {value: "من ظرف‌ها رو می‌شورم.", status: correct}
      - {value: "لباس‌ها رو می‌شورم", status: correct}
      - {value: "اتاق رو تمیز می‌کنم", status: correct}
    feedback: "Any short sentence naming a real chore is accepted."

  fa.a1.unit32.lesson06.exercise01.recognize_wrap_summary:
    instruction: "What does this sentence mean?"
    correct_option: "Tonight first I wash the dishes, then I clean the room."
    distractors:
      - "Tonight I go to a birthday party."
      - "Tomorrow I study math at university."
      - "Every day I play football."
    accepted_answers: [{value: "Tonight first I wash the dishes, then I clean the room.", status: correct}]
    feedback: "امشب اول ظرف‌ها رو می‌شورم، بعد اتاق رو تمیز می‌کنم gives a two-step chore plan."
  fa.a1.unit32.lesson06.exercise02.recognize_tonight:
    instruction: "What does this word mean?"
    correct_option: tonight
    distractors: [today, tomorrow, first]
    accepted_answers: [{value: tonight, status: correct}]
    feedback: "امشب means tonight."
  fa.a1.unit32.lesson06.exercise03.match_wrap_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"ظرف شستن": "washing dishes", "لباس شستن": "doing laundry", "تمیز کردن": cleaning, "جارو زدن": sweeping, کمک: help, امشب: tonight, اول: first, بعد: then}
        status: correct
    feedback: "This reviews the household chore vocabulary."
  fa.a1.unit32.lesson06.exercise04.word_order_wrap_summary:
    instruction: "Put the words in order."
    accepted_answers: [{value: [امشب, اول, "ظرف‌ها", رو, "می‌شورم", بعد, اتاق, رو, تمیز, "می‌کنم"], status: correct}]
    feedback: "امشب اول ظرف‌ها رو می‌شورم، بعد اتاق رو تمیز می‌کنم means 'Tonight first I wash the dishes, then I clean the room.'"
  fa.a1.unit32.lesson06.exercise05.write_chore_message:
    instruction: "Write a short message saying which chore you will do or asking someone to help with one."
    accepted_answers:
      - {value: "امشب ظرف‌ها رو می‌شورم", status: correct}
      - {value: "امشب ظرف‌ها رو می‌شورم.", status: correct}
      - {value: "لطفاً کمک می‌کنی؟", status: correct}
      - {value: "لطفاً کمک می‌کنی اتاق رو تمیز کنم؟", status: correct}
      - {value: "اتاق رو تمیز می‌کنم", status: correct}
    feedback: "A chore message can say what you will do or ask someone for help."
