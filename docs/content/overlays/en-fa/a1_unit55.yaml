review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), performed cold alongside the
    paired realization file -- see that file's review notes for the full
    independent-verification detail (compiler run, script/boolean scans,
    same-speaker-distractor re-derivation, fact-consistency check,
    translation/register read). Compiler validation, both standalone and as
    part of a 3-unit en-fa A1 batch with a1_unit56/a1_unit57, confirmed 0
    errors/0 warnings. Found no real bugs to fix in this overlay. Original
    authoring-session provenance/reasoning preserved below for context.

    Draft overlay paired with the fa.a1.unit55.gym realization. See that
    file's generation_provenance for the honest source-access result: tried
    `firecrawl search "FSI Persian Basic Course gym باشگاه exercise
    workout"` first, per the standing instruction to re-check Firecrawl
    quota fresh even though it has been reported exhausted in every earlier
    round this session -- it returned `Error: Request failed with status
    code 402` (payment required), confirming the account genuinely remains
    at 0 credits. This worker session had no cached local pdftotext
    extraction inherited from any prior session (scratchpad directories are
    session-isolated), so it freshly fetched the same public-domain Live
    Lingua-hosted FSI Spoken Persian PDF directly via curl (8,753,270
    bytes) and ran pdftotext -layout locally (17,130 lines, 66,717 words --
    matching the same counts prior units' provenance notes reported for
    this identical document). Grepped case-insensitively for gym/gymnas/
    weight/barbell/dumbbell/membership/"day pass"/workout/exercise/
    fitness/"athletic club"/club: exactly 3 hits, all false positives (two
    pedagogical "this exercise"/"exercises necessary to gain fluency"
    grammar-drill references, one unrelated "fitness" = "suitability"
    grammatical explanation) -- zero genuine gym/fitness scenario material
    anywhere in the document. FSI Persian's own course does not cover a gym
    visit at all -- disclosing honestly that nothing usable was found, same
    as the park/swimming-pool/sports units before it. All vocabulary and
    the full dialogue are authored fresh from this project's own
    established conventions.

    Scenario note: returns to units 41-49's paid-service-counter convention
    (universal.a1.gym.join_a_gym's own can_do -- ask about joining a gym or
    buying a day pass, describe basic equipment and a class, talk about a
    workout -- is a transaction, unlike unit54/park's friends'-plan scene,
    which was itself flagged as a deliberate one-unit departure). نیما (the
    established recurring character) is the gym customer, continuing his
    established "visits a service provider and states a need" role from
    units 17/41/44/45/46/47/48/49. A NEW formal-register character, خانم
    شریفی, is introduced as the gym receptionist -- confirmed collision-free
    against every آقای/خانم surname already used across the fa corpus
    (کریمی، احمدی، صادقی، رضایی، نوری، مرادی، کاظمی، جعفری، رحیمی، موسوی،
    فرهادی، حسینی -- 6 male/6 female before this unit, balanced). Choosing
    her female keeps the course's service-clerk gender count close to
    balanced (6 male/7 female after this unit).

    Reuse chain: باشگاه (unit27 -- the gym word itself was already taught
    there for the sports outcome, so this unit's new vocabulary is limited
    to the transaction-specific words below), می‌خوام/یک (unit03), کارت
    (unit08, there a payment card -- reused here for a day-pass card, same
    core "card" sense, no new sense given), چقدر (unit21/28), می‌شه (unit11/
    35), چهل/هزار/تومن (unit03, چهل هزار تومن already used together in
    unit03's own price list), تومنه (established -ه contraction pattern),
    داره (unit26), دارید (established), کلاس (unit02, there "Persian
    class" -- reused here for a gym class, same core "class" sense), از/تا/
    ساعت (unit16/42/09), شش/یازده (unit03), صبح/شب (unit01/09), باز
    (unit08/24/27/43), بازه (unit49), و (unit26), سلام/ممنون/باشه/بله/آقای/
    خانم (established), عالیه (unit07), تمرین (unit03, from "تمرین کنیم" --
    reused here as می‌کنم's object), می‌کنم (established). New vocabulary
    genuinely introduced for the first time in the whole corpus: روزانه
    (daily, forming کارت روزانه "day pass") and وزنه (weight/weights) --
    exactly 2 new words, at the low end of this course's 2-4-new-word
    range, since باشگاه itself was already taught in unit27. One new
    INFLECTION (not a new lexeme): داریم ("we have," 1st-person-plural of
    the already-established دار- root), declared at its first use in the
    dialogue, the same treatment unit27 used for می‌رم/می‌ری/می‌ره and
    unit49 used for بازه. The day-pass price (40,000 toman) and opening
    hours (6am-11pm) are stated identically in the dialogue, the gym-sign
    reading text, and the wrap-up review, per AUTHORING_GUIDE.md #11.

    Every "Translate into English" exercise below explicitly sets
    answer_language_code: en. No exercise in this unit tests a genuine
    two-clause sentence joined by "and"/comma (§12) -- the only
    "and"-joined construction (کلاس و وزنه دارید؟/داریم) is a simple noun
    conjunction inside one clause, not two independent clauses; every
    genuinely multi-sentence line is authored as two separate short
    sentences in both languages, matching units 44-49's own convention. No
    listen_type/listen_select/listen_order exercise is used anywhere in
    this unit (continuing the established text-based corpus-consistency
    pattern from units 19-54, even though fa now has real Azure TTS per
    §14) -- the spine outcome's "listening" assessment requirement is
    covered via the dialogue_comprehension exercise's comprehension-of-the-
    exchange task, the same interpretation units 41-49 already established.
    Checked the same-speaker/same-audio distractor-collision bug class
    (fixed 2026-07-09 in the nl corpus, commit 148240e) anyway, per the
    standing instruction to list every line each speaker says before
    writing distractors: نیما says "سلام خانم شریفی. یک کارت روزانه
    می‌خوام."/"باشه. کلاس و وزنه دارید؟"/"باشگاه بازه؟"/"عالیه. تمرین
    می‌کنم. ممنون!"; خانم شریفی says "سلام نیما. کارت روزانه چهل هزار
    تومنه."/"بله، کلاس و وزنه داریم."/"بله، از ساعت شش صبح تا یازده شب
    بازه." -- lesson04's dialogue_comprehension distractors ("He asks if
    there's a swimming pool."/"He asks how much a class costs."/"He asks
    if they sell water bottles.") are plausible-fact alternatives, not
    lines either speaker actually says or facts either speaker actually
    states anywhere in this unit's dialogue -- a swimming pool, a class
    price, and water bottles are never mentioned by either character. The
    dialogue_response exercise (lesson04) accepts نیما's own actual next
    line, not a distractor set, so this check doesn't apply to it. Boolean-
    coercion check: ran a recursive scan over title/gloss/note/
    example_gloss/answer/matching-pair value fields (including
    matching_pairs right: values specifically) across both this overlay and
    the paired realization for bare yes/no/true/false/on/off string values
    or coerced booleans, plus a full yaml.safe_load parse of both files
    confirming every loaded value is a str/list/dict rather than a Python
    bool -- zero hits. Persian-vs-Arabic codepoint scan (Arabic kaf
    U+0643/yeh U+064A) across both files -- zero hits. Compiler validation,
    both standalone and against the full 55-unit en-fa A1 corpus with
    position-matched realization/overlay lists, confirmed 0 errors/0
    warnings (see this task's final report for the exact command and
    output).

    Review 2026-10-21 (en-fa A1 pass): 6 fixes - learner-facing 'unitNN' wording in notes changed to 'Unit NN' / 'earlier units' (english), unwrapped Persian in the toman-contraction note wrapped in asterisks (english), sign-writing instruction now matches its single copy answer (answer-mismatch), extra accepted answers for the toman translation, the dialogue reply, and the wrap-up message (alt-answers). NATIVE FLAGS: باشگاه می‌خوام ('I want a gym') as a bare phrase.

course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: asking about joining a gym or buying a day
    pass, asking about a class and weights, checking the opening hours,
    and briefly saying you'll work out, plus reading/writing a short gym
    sign naming the gym, its day-pass price, and its opening hours.

units:
  fa.a1.unit55.gym: {title: Gym}

lessons:
  fa.a1.unit55.lesson01.new_gym_one: {title: "New words 1"}
  fa.a1.unit55.lesson02.new_gym_two: {title: "New words 2"}
  fa.a1.unit55.lesson03.class_and_hours: {title: "Class and opening hours"}
  fa.a1.unit55.lesson04.gym_dialogue: {title: "Dialogue: at the gym"}
  fa.a1.unit55.lesson05.reading_gym_sign: {title: "Reading a gym sign"}
  fa.a1.unit55.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit55.lesson01.teach.review_bashgah_mikhaam:
    title: "Review: gym / I want"
    gloss: "gym / I want"
    note: "*باشگاه* ('gym') was already taught in Unit 27; *می‌خوام* ('I want') was already taught in Unit 03."
  fa.a1.unit55.lesson01.teach.review_yek_kart:
    title: "Review: one / card"
    gloss: "one, a / card"
    note: "*یک* ('one, a') was already taught in Unit 03; *کارت* ('card') was already taught in Unit 08."
  fa.a1.unit55.lesson01.teach.roozane:
    title: Daily
    gloss: daily
    note: "*روزانه* means 'daily' -- combined with *کارت* ('card'), *کارت روزانه* means 'day pass.'"
    example_gloss: "I want a day pass."

  fa.a1.unit55.lesson02.teach.review_cheghadr_mishe:
    title: "Review: how much / it comes to"
    gloss: "how much / it comes to"
    note: "*چقدر* ('how much') was already taught in Unit 21/28; *می‌شه* ('it comes to') was already taught in Unit 11/35."
  fa.a1.unit55.lesson02.teach.review_chehel_hezar_toman:
    title: "Review: forty / thousand / toman"
    gloss: "forty / thousand, toman"
    note: "*چهل*, *هزار*, and *تومن* were already taught in Unit 03; *تومنه* is the same colloquial contraction of *تومن* + *است* that Unit 03 already used in *سی هزار تومنه*."
  fa.a1.unit55.lesson02.teach.review_dare:
    title: "Review: it has"
    gloss: "it has"
    note: "*داره* ('it has') was already taught in Unit 04."
  fa.a1.unit55.lesson02.teach.vazne:
    title: Weight
    gloss: "weight, weights"
    note: "*وزنه* means 'weight(s)' -- gym equipment."
    example_gloss: "The gym has weights."

  fa.a1.unit55.lesson03.teach.review_darid_kelas:
    title: "Review: do you have / class"
    gloss: "do you have (formal) / class"
    note: "*دارید* ('do you have,' formal) was already taught in Units 01/04/06/08/21/42/44/45; *کلاس* ('class') was already taught in Unit 02."
  fa.a1.unit55.lesson03.teach.review_az_ta_saat_va:
    title: "Review: from / to / hour / and"
    gloss: "from / to / hour, o'clock / and"
    note: "*از* was already taught in Unit 16; *تا* in Unit 42; *ساعت* in Unit 09; *و* in Unit 26."
  fa.a1.unit55.lesson03.teach.review_shesh_yazdah_sobh_shab:
    title: "Review: six / eleven / morning / night"
    gloss: "six / eleven / morning / night"
    note: "*شش* and *یازده* were already taught in Unit 03; *صبح* and *شب* were already taught in Unit 01/09."
  fa.a1.unit55.lesson03.teach.review_baz_baze:
    title: "Review: open / it's open"
    gloss: "open / it's open"
    note: "*باز* ('open') was already taught in Unit 08/24/27/43; *بازه* ('it's open,' the same باز + است contraction) was already taught in Unit 49."
  fa.a1.unit55.lesson03.teach.phrase_kelas_vazne_darid:
    title: "Do you have a class and weights?"
    gloss: "Do you have a class and weights?"
    note: "Combines this unit's *کلاس* and *وزنه* with *و* ('and') and *دارید*."
  fa.a1.unit55.lesson03.teach.phrase_bashgah_baze:
    title: "Is the gym open?"
    gloss: "Is the gym open?"
    note: "Combines *باشگاه* with the already-known *بازه* contraction."

  fa.a1.unit55.lesson04.teach.review_salam_mamnoon:
    title: "Review: hello / thanks"
    gloss: "hello / thanks"
    note: "*سلام* and *ممنون* were already established from Units 01/17/22/45-49."
  fa.a1.unit55.lesson04.teach.review_bashe_baleh:
    title: "Review: okay / yes"
    gloss: "okay / yes"
    note: "*باشه* was already established from Units 01/02/06/17/22/45-49; *بله* ('yes') was already taught in Unit 20/21."
  fa.a1.unit55.lesson04.teach.review_aghaye_khanom:
    title: "Review: Mr. / Ms."
    gloss: "Mr. / Ms."
    note: "*آقای*/*خانم* were already established in earlier units."
  fa.a1.unit55.lesson04.teach.review_aaliye_tamrin_mikonam:
    title: "Review: great / workout / I do"
    gloss: "great / workout, practice / I do"
    note: "*عالیه* ('great') was already taught in Unit 07; *تمرین* ('workout, practice') was already taught in Unit 03; *می‌کنم* ('I do') was already established from many units."
  fa.a1.unit55.lesson04.teach.character_sharifi:
    title: "Ms. Sharifi"
    gloss: "Ms. Sharifi"
    note: "*خانم شریفی* is the gym receptionist -- a new character in this unit."
    example_gloss: "Hi Ms. Sharifi!"

  fa.a1.unit55.lesson04.teach.dialogue_line1:
    title: "Nima: Hi Ms. Sharifi. I want a day pass."
    gloss: "Hi Ms. Sharifi. I want a day pass."
  fa.a1.unit55.lesson04.teach.dialogue_line2:
    title: "Ms. Sharifi: Hi Nima. The day pass is 40,000 toman."
    gloss: "Hi Nima. The day pass is 40,000 toman."
  fa.a1.unit55.lesson04.teach.dialogue_line3:
    title: "Nima: Okay. Do you have a class and weights?"
    gloss: "Okay. Do you have a class and weights?"
  fa.a1.unit55.lesson04.teach.dialogue_line4:
    title: "Ms. Sharifi: Yes, we have a class and weights."
    gloss: "Yes, we have a class and weights."
    note: "*داریم* ('we have') is the first-person plural form of the same root as *دارید*/*داره*."
  fa.a1.unit55.lesson04.teach.dialogue_line5:
    title: "Nima: Is the gym open?"
    gloss: "Is the gym open?"
  fa.a1.unit55.lesson04.teach.dialogue_line6:
    title: "Ms. Sharifi: Yes, it's open from six in the morning to eleven at night."
    gloss: "Yes, it's open from six in the morning to eleven at night."
  fa.a1.unit55.lesson04.teach.dialogue_line7:
    title: "Nima: Great. I'll work out. Thanks!"
    gloss: "Great. I'll work out. Thanks!"

  fa.a1.unit55.lesson05.teach.reading_text:
    title: "Reading: a gym sign"
    gloss: "Sharifi Gym: day pass 40,000 toman. From six in the morning to eleven at night. Has a class and weights."
    note: "A short gym sign naming the gym, the day-pass price, its opening hours, and that it has a class and weights."

  fa.a1.unit55.lesson06.teach.review_request:
    title: "I want a day pass."
    gloss: "I want a day pass."
  fa.a1.unit55.lesson06.teach.review_price_hours:
    title: "The day pass is 40,000 toman. It's open from six in the morning to eleven at night."
    gloss: "The day pass is 40,000 toman. It's open from six in the morning to eleven at night."
  fa.a1.unit55.lesson06.teach.summary_words:
    title: "Gym / daily / weight / class and weights? / gym open?"
    gloss: "gym / daily / weight(s) / class and weights? / is the gym open?"
    note: "These are the key words and phrases taught in this unit."

exercises:
  fa.a1.unit55.lesson01.exercise01.recognize_roozane:
    instruction: "What does this word mean?"
    correct_option: daily
    distractors: [gym, card, weight]
    accepted_answers: [{value: daily, status: correct}]
    feedback: "روزانه means 'daily.'"
  fa.a1.unit55.lesson01.exercise02.recognize_kart_roozane_mikhaam:
    instruction: "What does this sentence mean?"
    correct_option: "I want a day pass."
    distractors: ["I don't want a card.", "Where is the day pass?", "Do you have a day pass?"]
    accepted_answers: [{value: "I want a day pass.", status: correct}]
    feedback: "کارت روزانه می‌خوام means 'I want a day pass.'"
  fa.a1.unit55.lesson01.exercise03.match_gym_one:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {باشگاه: gym, "می‌خوام": "I want", یک: "one, a", کارت: card, روزانه: daily, "کارت روزانه": "day pass"}
        status: correct
    feedback: "These are the first new gym words for this unit."
  fa.a1.unit55.lesson01.exercise04.word_order_kart_roozane_mikhaam:
    instruction: "Put the words in order."
    accepted_answers: [{value: [کارت, روزانه, "می‌خوام"], status: correct}]
    feedback: "کارت روزانه می‌خوام means 'I want a day pass.'"
  fa.a1.unit55.lesson01.exercise05.translate_bashgah_mikhaam:
    instruction: "Translate into English: باشگاه می‌خوام"
    answer_language_code: en
    accepted_answers:
      - {value: "I want the gym.", status: correct}
      - {value: "I want a gym.", status: correct}
      - {value: "I want to go to the gym.", status: correct}
    feedback: "باشگاه می‌خوام means 'I want the gym.'"

  fa.a1.unit55.lesson02.exercise01.recognize_vazne:
    instruction: "What does this word mean?"
    correct_option: "weight, weights"
    distractors: [card, class, gym]
    accepted_answers: [{value: "weight, weights", status: correct}]
    feedback: "وزنه means 'weight(s).'"
  fa.a1.unit55.lesson02.exercise02.recognize_bashgah_vazne_dare:
    instruction: "What does this sentence mean?"
    correct_option: "The gym has weights."
    distractors: ["The gym has a pool.", "The gym doesn't have weights.", "The gym is closed."]
    accepted_answers: [{value: "The gym has weights.", status: correct}]
    feedback: "باشگاه وزنه داره means 'The gym has weights.'"
  fa.a1.unit55.lesson02.exercise03.match_gym_two:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {چقدر: "how much", "می‌شه": "it comes to", چهل: forty, هزار: thousand, تومن: toman, داره: "it has", وزنه: weights}
        status: correct
    feedback: "These words let you ask about the gym's price and equipment."
  fa.a1.unit55.lesson02.exercise04.word_order_kart_roozane_chehel_hezar_tomane:
    instruction: "Put the words in order."
    accepted_answers: [{value: [کارت, روزانه, چهل, هزار, "تومنه"], status: correct}]
    feedback: "کارت روزانه چهل هزار تومنه means 'The day pass is 40,000 toman.'"
  fa.a1.unit55.lesson02.exercise05.translate_chehel_hezar_toman:
    instruction: "Translate into English: چهل هزار تومن"
    answer_language_code: en
    accepted_answers:
      - {value: "40,000 toman.", status: correct}
      - {value: "40,000 toman", status: correct}
      - {value: "Forty thousand toman.", status: correct}
      - {value: "Forty thousand toman", status: correct}
      - {value: "40,000 tomans", status: correct}
      - {value: "Forty thousand tomans", status: correct}
    feedback: "چهل هزار تومن means '40,000 toman.'"

  fa.a1.unit55.lesson03.exercise01.recognize_kelas_vazne_darid:
    instruction: "What does this sentence mean?"
    correct_option: "Do you have a class and weights?"
    distractors: ["Do you have a locker?", "Do you have a pool?", "Do you have a card?"]
    accepted_answers: [{value: "Do you have a class and weights?", status: correct}]
    feedback: "کلاس و وزنه دارید؟ means 'Do you have a class and weights?'"
  fa.a1.unit55.lesson03.exercise02.recognize_bashgah_baze:
    instruction: "What does this sentence mean?"
    correct_option: "Is the gym open?"
    distractors: ["Is the gym closed?", "Is the gym far?", "Is the gym expensive?"]
    accepted_answers: [{value: "Is the gym open?", status: correct}]
    feedback: "باشگاه بازه؟ means 'Is the gym open?'"
  fa.a1.unit55.lesson03.exercise03.match_class_and_hours:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {دارید: "do you have", کلاس: class, از: from, تا: to, ساعت: "hour, o'clock", شش: six, یازده: eleven, بازه: "it's open"}
        status: correct
    feedback: "These words let you ask about a class and the opening hours."
  fa.a1.unit55.lesson03.exercise04.word_order_hours:
    instruction: "Put the words in order."
    accepted_answers: [{value: [از, ساعت, شش, صبح, تا, یازده, شب, بازه], status: correct}]
    feedback: "از ساعت شش صبح تا یازده شب بازه means 'It's open from six in the morning to eleven at night.'"
  fa.a1.unit55.lesson03.exercise05.translate_kelas_darid:
    instruction: "Translate into English: کلاس دارید؟"
    answer_language_code: en
    accepted_answers:
      - {value: "Do you have a class?", status: correct}
      - {value: "Do you have a class", status: correct}
    feedback: "کلاس دارید؟ means 'Do you have a class?'"

  fa.a1.unit55.lesson04.exercise01.dialogue_comprehension_class_and_weights:
    instruction: "Nima asks Ms. Sharifi something. What does he want to know?"
    correct_option: "He asks if there's a class and weights."
    distractors:
      - "He asks if there's a swimming pool."
      - "He asks how much a class costs."
      - "He asks if they sell water bottles."
    accepted_answers: [{value: "He asks if there's a class and weights.", status: correct}]
    feedback: "کلاس و وزنه دارید؟ means 'Do you have a class and weights?'"
  fa.a1.unit55.lesson04.exercise02.recognize_dialogue_line2:
    instruction: "What does this sentence mean?"
    correct_option: "Hi Nima. The day pass is 40,000 toman."
    distractors:
      - "Hi Nima. The gym is closed today."
      - "Hi Nima. The class is 40,000 toman."
      - "Hi Nima. Do you want a day pass?"
    accepted_answers: [{value: "Hi Nima. The day pass is 40,000 toman.", status: correct}]
    feedback: "سلام نیما. کارت روزانه چهل هزار تومنه means 'Hi Nima. The day pass is 40,000 toman.'"
  fa.a1.unit55.lesson04.exercise03.match_dialogue_gym:
