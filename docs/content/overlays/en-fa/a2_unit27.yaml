  fa.a2.unit27.lesson03.exercise02.recognize_tomorrow_effect:
    instruction: In فردا می‌رم, what does the word فردا do to the present verb?
    correct_option: It makes the present form refer to a plan in the future.
    distractors:
    - It turns the verb into the past.
    - It turns the verb into a negative.
    - It turns the verb into a command.
    accepted_answers:
    - value: It makes the present form refer to a plan in the future.
      status: correct
    feedback: A future time word turns the ordinary present into a plan.
  fa.a2.unit27.lesson03.exercise03.match_habit_plan_intention:
    instruction: Match each sentence with its exact meaning.
    accepted_answers:
    - value:
        هر روز می‌رم کلاس: I go to class every day
        فردا می‌رم کلاس: Tomorrow I am going to class
        همیشه می‌رم کلاس: I always go to class
        هفته‌ی بعد می‌رم کلاس: Next week I am going to class
        می‌خوام برم کلاس: I want to go to class
        تصمیم گرفتم برم کلاس: I decided to go to class
