teaching:
  fa.a2.unit27.lesson01.teach.time_words:
    title: Time words for plans
    gloss: tomorrow, the weekend, next week, next month, next year, today, now
    note: '*هفته‌ی بعد*, *ماه دیگه* and *سال دیگه* are everyday ways to say “next week / next month / next year.” *آخر هفته* is “the weekend”; context shows which weekend.'
    example_gloss:
    - Tomorrow I have class.
    - Next month I am travelling.
    - Next year I will have a new house.
  fa.a2.unit27.lesson01.teach.course_house:
    title: Courses and moving house
    gloss: course, class, language, registration, home, box
    note: '*ثبت‌نام* means “registration / signing up.” You will use these words for Sara’s language course and Nima’s move.'
    example_gloss:
    - I have a language course.
    - I have a language class.
    - I have boxes.
  fa.a2.unit27.lesson01.teach.plan_verbs:
    title: Plan verbs
    gloss: I go, I start, I register, I move house, I buy boxes
    note: '*خونه عوض کردن* is the spoken way to say “move house” (literally “change house”).'
    example_gloss:
    - Tomorrow I am going to class.
    - Next week I start class.
    - Tomorrow I am registering.
    - Next month I am moving house.
    - Tomorrow I am buying boxes.
  fa.a2.unit27.lesson01.teach.things_to_buy:
    title: Things to buy
    gloss: rug, curtain, cake
    note: Use these everyday nouns when talking about errands and things you plan to buy.
    example_gloss:
    - Tomorrow I am buying a rug.
    - Tomorrow I am buying curtains.
    - Tomorrow I am buying a cake.
  fa.a2.unit27.lesson01.teach.places_and_events:
    title: Places and events
    gloss: restaurant, café, party
    note: '*مهمونی* is the usual spoken form of “party.”'
    example_gloss:
    - Tomorrow I am going to a restaurant.
    - Tomorrow I am going to a café.
    - I have a party at the weekend.
  fa.a2.unit27.lesson01.teach.present_for_future:
    title: The present can mean a plan
    gloss: Tomorrow I am going; next week I start
    note: Spoken Persian uses the ordinary present (*می‌رم*, *شروع می‌کنم*) for a plan. A time word such as *فردا* or *هفته‌ی بعد* shows that the action is in the future. There is no separate future verb in everyday speech.
  fa.a2.unit27.lesson02.teach.i_want:
    title: I want, you want
    gloss: I want, you want, a/one
    note: '*یه* is the normal spoken “a / one.” *تو چی می‌خوای؟* means “What do you want?”'
    example_gloss:
    - I want to buy a house.
    - What do you want?
  fa.a2.unit27.lesson02.teach.short_verbs:
    title: Short verb forms
    gloss: to go, to buy, to start, to register, to find, to learn
    note: 'These are the short verb forms that follow *می‌خوام*. For two-part verbs the second part changes: *شروع کنم*, *ثبت‌نام کنم*, *پیدا کنم*.'
    example_gloss:
    - I want to go to class.
    - I want to buy boxes.
    - I want to find a house.
    - I want to learn a language.
  fa.a2.unit27.lesson02.teach.want_plus_short:
    title: می‌خوام + short verb
    gloss: I want to go; I want to buy; I want to start
    note: 'To say what you want or intend to do, use *می‌خوام* plus a short verb form. The second verb has no *می‌*: say *می‌خوام برم*, never *می‌خوام می‌رم*. The ending of the second verb matches the person who wants.'
  fa.a2.unit27.lesson02.teach.person_endings:
    title: The second verb follows the person
    gloss: I want to go; you want to go; he/she wants to go
    note: 'The short verb changes with the person: *برم* (I), *بری* (you), *بره* (he/she). The same pattern works with *بخرم / بخری / بخره*. In this unit you mainly produce the *من* forms.'
  fa.a2.unit27.lesson03.teach.habit_words:
    title: Habit words
    gloss: every day, every week, always, usually
    note: These words show a repeated habit. The verb is the same present form as in a plan; the time word tells you which meaning you have.
    example_gloss:
    - I go to class every day.
    - I always go to class.
    - I usually stay at home.
    - I have class two days every week.
  fa.a2.unit27.lesson03.teach.habit_vs_plan:
    title: Same verb, different time word
    gloss: I go every day; I am going tomorrow
    note: '*می‌رم* can mean a habit or a plan. *هر روز* and *همیشه* make it a habit; *فردا*, *هفته‌ی بعد* and *ماه دیگه* make it a plan. Always look at the time word first.'
  fa.a2.unit27.lesson03.teach.plan_vs_want:
    title: Plan or intention?
    gloss: Tomorrow I am going; I want to go
    note: '*فردا می‌رم* announces a plan with a time word. *می‌خوام برم* says what you want or intend, and needs no time word. Remember: after *می‌خوام* the second verb loses *می‌*.'
  fa.a2.unit27.lesson03.teach.decided:
    title: Decided, intend
    gloss: I decided, I intend
    note: '*تصمیم گرفتم* and *قصد دارم* are two other ways to talk about an intention. Both are followed by a short verb form.'
    example_gloss:
    - I decided to move house.
    - I intend to learn a language.
  fa.a2.unit27.lesson03.teach.decided_plus_short:
    title: تصمیم گرفتم + short verb
    gloss: I decided to go; I decided to start
    note: '*گرفتم* is past because the deciding is finished, but the verb after it is the short form (*برم*, *شروع کنم*) because the action is still ahead. Do not put *می‌* on it.'
  fa.a2.unit27.lesson04.teach.plan_questions:
    title: Asking about plans
    gloss: What are you doing tomorrow? What do you want to do? And you?
    note: Ask about a plan with the present and a time word. Ask about an intention with *می‌خوای ... کنی؟*.
    example_gloss:
    - What are you doing at the weekend?
    - What do you want to do next year?
    - I am starting class; and you?
  fa.a2.unit27.lesson04.teach.answer_mirrors_question:
    title: The answer mirrors the question
    gloss: You do → I do; you want to do → I want to do
    note: 'Answer a present-plan question with the present and the same time word: *فردا جعبه می‌خرم*. Answer an intention question with *می‌خوام* and a short verb whose ending changes from you to me: *می‌خوای چیکار کنی؟* becomes *می‌خوام ... کنم*.'
  fa.a2.unit27.lesson05.teach.reading_words:
    title: Words for a message
    gloss: hello, work, I do not go, trip
    note: '*نمی‌رم* is the negative of *می‌رم*: “I am not going / I do not go.” *برم سفر* means “go on a trip.”'
    example_gloss:
    - Hello Sara!
    - I go to work every day.
    - Tomorrow I am not going to class.
    - Next year I am going on a trip.
  fa.a2.unit27.lesson05.teach.reading:
    title: A message from Nima
    gloss: Hello Sara! I go to work every day, but tomorrow I am not going. Tomorrow I am buying boxes. Next month I am moving house. I decided to go on a trip next year.
    note: Read once for the habit, the near plans, and the later intention.
  fa.a2.unit27.lesson06.teach.nice:
    title: What nice news!
    gloss: how nice
    note: '*چه خوب!* is a friendly reaction to someone’s plans.'
    example_gloss:
    - How nice! Are you registering tomorrow?
  fa.a2.unit27.lesson06.teach.turn01:
    title: Sara asks about tomorrow
    gloss: 'Sara asks Nima: What are you doing tomorrow?'
    note: The question uses the present and a time word.
  fa.a2.unit27.lesson06.teach.turn02:
    title: Nima gives two plans
    gloss: 'Nima: Tomorrow I buy boxes. Next month I move house. And you?'
    note: Two plans with two time words.
  fa.a2.unit27.lesson06.teach.turn03:
    title: Sara gives her plans
    gloss: 'Sara: Tomorrow I register. Next week I start language class.'
    note: '*من* is stated here to answer *تو چی؟*.'
  fa.a2.unit27.lesson06.teach.turn04:
    title: Nima asks about intentions
    gloss: 'Nima: How nice! What do you want to do next year?'
    note: The question uses *می‌خوای ... کنی؟*.
  fa.a2.unit27.lesson06.teach.turn05:
    title: Sara states a decision
    gloss: 'Sara: I decided to learn a language. And you?'
    note: '*تصمیم گرفتم* is followed by a short verb form.'
  fa.a2.unit27.lesson06.teach.turn06:
    title: Nima states an intention
    gloss: 'Nima: I want to go on a trip.'
    note: '*می‌خوام برم* gives the intention.'
exercises:
  fa.a2.unit27.lesson01.exercise01.recognize_next_week:
    instruction: What does this sentence say about the speaker’s plan?
    correct_option: Next week I am starting a class.
    distractors:
    - Last week I started a class.
    - I start a class every week.
    - I do not want to start a class.
    accepted_answers:
    - value: Next week I am starting a class.
      status: correct
    feedback: '*هفته‌ی بعد* puts the present verb in the future: next week I start.'
  fa.a2.unit27.lesson01.exercise02.recognize_next_month:
    instruction: What does this sentence mean?
    correct_option: Next month I am moving house.
    distractors:
    - I move house every month.
    - I moved house last month.
    - I am moving house tomorrow.
    accepted_answers:
    - value: Next month I am moving house.
      status: correct
    feedback: '*ماه دیگه* means “next month,” and *خونه عوض می‌کنم* is “I am moving house.”'
  fa.a2.unit27.lesson01.exercise03.match_time_words:
