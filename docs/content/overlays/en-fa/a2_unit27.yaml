  fa.a2.unit27.lesson03.exercise01.recognize_habit:
    instruction: What does this sentence mean?
    correct_option: I go to class every day.
    distractors:
    - I am going to class tomorrow.
    - I want to go to class.
    - I went to class yesterday.
    accepted_answers:
