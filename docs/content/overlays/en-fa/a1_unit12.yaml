    FRESH-CONTEXT REVIEW 2026-07-06 (§9): reviewed together with the fa realization -- confirmed flat top-level dicts (units/lessons/teaching/exercises all keyed directly by content_key) match the documented overlay schema correctly, with exact content_key parity in both directions (script-verified, before and after fixes). Confirmed every recognize_*/reading_comprehension/dialogue_comprehension exercise's correct_option/distractors are English glosses, never the same-script Farsi text visible in the prompt (no prompt-shows-answer bug). Confirmed every exercise has at least one status:correct accepted_answers/correct_response entry via the actual compiled JSON, not just validate. Found and fixed a real §12 multi-clause gap in two exercises the task flagged: lesson04.exercise06.dialogue_response_decline was missing a و-joined variant, and lesson06.exercise06.write_plan_summary was missing both a period-joined and a و-joined variant despite its own instruction inviting 'one or two sentences.' Added both. This introduced a genuine untaught-vocabulary bug (و was never taught in this file, tokens being file-scoped) -- fixed by adding a matching fa.a1.unit12.lesson04.teach.va_word teaching entry alongside the realization's new teaching card, restoring content_key parity, then re-verified via a tokenizer cross-check script and a clean validate+compile.

    2026-07-07: AUTHORING_GUIDE.md §19 retrofit -- added real example sentence(s) to all 14 kind:vocabulary teaching entries with example_gloss (the merged names card given a 2-item list), each a natural, comprehensible-from-gloss sentence using the card's own word(s). schema_version bumped to 1.1. Example sentences are Claude-authored and pending fresh-context review.

    2026-07-07: FRESH-CONTEXT REVIEW of the §19 retrofit examples specifically (paired with the same-dated review of the fa realization; zero prior access to the retrofit's own authoring reasoning; scoped narrowly to the new example_gloss fields). Spot-checked every example_gloss against its paired Farsi example for accurate translation -- all 15 (14 cards + 1 extra from the 2-item names list) glosses accurately convey their Farsi sentence's meaning; no changes needed on this file's side since the realization-side register fixes (این یک دعوت است -> این یه دعوته; کار دارد -> کار داره; می‌آید -> میاد) didn't change the English meaning. Re-ran validate+compile after the realization's fixes: 0 errors/0 warnings, valid JSON.

    Review 2026-10-21 (en-fa A1 language review r1): 14 fixes - added missing accepted variants (propose/ask word-order variants, punctuation and exclamation forms, reply and summary orderings); made the accept/decline/reply dialogue_response and writing prompts name the exact words wanted (previously underdetermined); fixed broken English in a note (\"this unit09's\"), replaced internal \"unit09\"/\"unit10\" with \"Unit 9\"/\"Unit 10\", dropped the jargon word \"subjunctive\", and wrapped inline Persian in asterisks in edited notes. NATIVE FLAGS: متأسفم is a fairly formal word beside the colloquial نمی‌تونم in a casual friend-to-friend refusal (a native speaker should confirm whether ببخشید or the like is more natural)."

course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: proposing, accepting, and declining a simple
    plan, reading a short invitation, and a dialogue negotiating a plan.

units:
  fa.a1.unit12.plans:
    title: Making Plans

lessons:
  fa.a1.unit12.lesson01.plan_vocabulary: {title: "Plan vocabulary"}
  fa.a1.unit12.lesson02.proposing_a_plan: {title: "Proposing a plan"}
  fa.a1.unit12.lesson03.accepting_a_plan: {title: "Accepting a plan"}
  fa.a1.unit12.lesson04.declining_a_plan: {title: "Declining a plan"}
  fa.a1.unit12.lesson05.reading_an_invitation: {title: "Reading an invitation"}
  fa.a1.unit12.lesson06.making_a_plan_dialogue: {title: "Making a plan (dialogue)"}

teaching:
  fa.a1.unit12.lesson01.teach.barname_word:
    title: Plan
    gloss: plan
    note: "برنامه means plan."
    example_gloss: "What plans do you have?"
  fa.a1.unit12.lesson01.teach.sinama_word:
    title: "Cinema / movies"
    gloss: "cinema / movies"
    note: "سینما means cinema or the movies."
    example_gloss: "Shall we go to the cinema?"
  fa.a1.unit12.lesson01.teach.berim_word:
    title: "Let's go"
    gloss: "let's go"
    note: "*بریم* (let's go) is the 'we go' form used to make suggestions."
    example_gloss: "Let's go to the cinema."
  fa.a1.unit12.lesson01.teach.chetorast_word:
    title: "How about it?"
    gloss: "How about it? / How's that?"
    note: "چطوره؟ uses the established -e contraction pattern (چطور است -> چطوره)."
    example_gloss: "How about Thursday?"
  fa.a1.unit12.lesson02.teach.mikhay_word:
    title: "Do you want"
    gloss: "do you want"
    note: "می‌خوای (do you want, informal) starts a proposal question."
    example_gloss: "Do you want to go to the cinema?"
  fa.a1.unit12.lesson02.teach.panjshanbe_review:
    title: "Thursday (review)"
    gloss: Thursday
    note: "*پنجشنبه* reviews the day name from Unit 10."
    example_gloss: "Are you free on Thursday?"
  fa.a1.unit12.lesson02.teach.propose_phrase:
    title: "Do you want to go to the movies on Thursday?"
    gloss: "Do you want to go to the movies on Thursday?"
    note: "می‌خوای پنجشنبه بریم سینما؟ combines this lesson's words into a full proposal."
  fa.a1.unit12.lesson03.teach.bashe_word:
    title: Okay
    gloss: okay
    note: "باشه means okay, a common informal agreement word."
    example_gloss: "Okay, see you."
  fa.a1.unit12.lesson03.teach.alie_word:
    title: Great
    gloss: great
    note: "عالیه (great) uses the established -e contraction pattern (عالی است -> عالیه)."
    example_gloss: "Great, see you then."
  fa.a1.unit12.lesson03.teach.ghabule_word:
    title: "It's a deal"
    gloss: "it's a deal / agreed"
    note: "قبوله (it's a deal) uses the established -e contraction pattern (قبول است -> قبوله)."
    example_gloss: "Deal, see you Thursday."
  fa.a1.unit12.lesson04.teach.motasefam_word:
    title: "I'm sorry"
    gloss: "I'm sorry"
    note: "متأسفم means I'm sorry."
    example_gloss: "I'm sorry, I can't come."
  fa.a1.unit12.lesson04.teach.nemitoonam_word:
    title: "I can't"
    gloss: "I can't"
    note: "نمی‌تونم means I can't (colloquial for نمی‌توانم)."
    example_gloss: "I can't come, I have work."
  fa.a1.unit12.lesson04.teach.kar_daram_word:
    title: "I have things to do"
    gloss: "I have things to do"
    note: "*کار دارم* literally means 'I have work/things,' a common polite excuse."
  fa.a1.unit12.lesson04.teach.va_word:
    title: "And"
    gloss: and
    note: "و means and, used to join two short phrases or clauses."
  fa.a1.unit12.lesson05.teach.davat_word:
    title: Invitation
    gloss: invitation
    note: "دعوت means invitation."
    example_gloss: "This is an invitation."
  fa.a1.unit12.lesson05.teach.saat_hasht_review:
    title: "Eight o'clock at night"
    gloss: "eight o'clock at night"
    note: "*ساعت هشت شب* combines the time pattern from Unit 9 with *شب* (night)."
  fa.a1.unit12.lesson05.teach.invitation_message:
    title: "Sample invitation message"
    gloss: "Hi! Do you want to go to the movies Thursday at eight at night? I'm waiting to hear from you."
    note: "A short written invitation message, the kind you might get by text."
  fa.a1.unit12.lesson05.teach.mibinamet_word:
    title: "I'll see you"
    gloss: "I'll see you"
    note: "می‌بینمت (I'll see you) is a common way to close off confirming a plan."
    example_gloss: "I'll see you Thursday."
  fa.a1.unit12.lesson06.teach.names:
    title: "Arash and Sara"
    gloss: "Arash, Sara"
    note: "آرش and سارا are the two speakers in this lesson's dialogue."
    example_gloss: ["Arash has work today.", "Sara is coming tomorrow."]
  fa.a1.unit12.lesson06.teach.che_saati_word:
    title: "What time?"
    gloss: "What time?"
    note: "چه ساعتی؟ literally asks 'what hour,' a natural way to ask for a specific time."
  fa.a1.unit12.lesson06.teach.dialogue_line1:
    title: "Sara, do you want to go to the movies on Thursday?"
    gloss: "Sara, do you want to go to the movies on Thursday?"
    note: "Arash opens by proposing the plan."
  fa.a1.unit12.lesson06.teach.dialogue_line2:
    title: "What time?"
    gloss: "What time?"
    note: "Sara asks for the specific time before deciding."
  fa.a1.unit12.lesson06.teach.dialogue_line3:
    title: "Eight o'clock at night."
    gloss: "Eight o'clock at night."
    note: "Arash states the time."
  fa.a1.unit12.lesson06.teach.dialogue_line4:
    title: "Okay, great! It's a deal."
    gloss: "Okay, great! It's a deal."
    note: "Sara accepts enthusiastically."
  fa.a1.unit12.lesson06.teach.dialogue_line5:
    title: "Good, I'll see you Thursday."
    gloss: "Good, I'll see you Thursday."
    note: "Arash confirms and closes the exchange. خوبه uses the established -e contraction (خوب است -> خوبه)."

exercises:
  fa.a1.unit12.lesson01.exercise01.recognize_barname_reading:
    instruction: "What does this word mean?"
    correct_option: plan
    distractors: ["cinema / movies", "let's go", "How about it?"]
    accepted_answers: [{value: plan, status: correct}]
    feedback: "برنامه means plan."
  fa.a1.unit12.lesson01.exercise02.recognize_sinama_reading:
    instruction: "What does this word mean?"
    correct_option: "cinema / movies"
    distractors: [plan, "let's go", "How about it?"]
    accepted_answers: [{value: "cinema / movies", status: correct}]
    feedback: "سینما means cinema / movies."
  fa.a1.unit12.lesson01.exercise03.match_plan_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {برنامه: plan, سینما: "cinema / movies", بریم: "let's go", "چطوره؟": "How about it? / How's that?"}
        status: correct
    feedback: "These four words/phrases cover this lesson's plan vocabulary."
  fa.a1.unit12.lesson01.exercise04.translate_plan:
    instruction: "Translate into Farsi: plan."
    accepted_answers:
      - {value: برنامه, status: correct}
    feedback: "برنامه means plan."
  fa.a1.unit12.lesson01.exercise05.translate_lets_go:
    instruction: "Translate into Farsi: let's go."
    accepted_answers:
      - {value: بریم, status: correct}
    feedback: "بریم means let's go."
  fa.a1.unit12.lesson02.exercise01.recognize_propose_reading:
    instruction: "What does this question ask?"
    correct_option: "Do you want to go to the movies on Thursday?"
    distractors: ["What time is it?", "Where is the cinema?", "I'm sorry, I can't."]
    accepted_answers: [{value: "Do you want to go to the movies on Thursday?", status: correct}]
    feedback: "می‌خوای پنجشنبه بریم سینما؟ proposes going to the movies on Thursday."
  fa.a1.unit12.lesson02.exercise02.match_propose_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"می‌خوای پنجشنبه بریم سینما؟": "Do you want to go to the movies on Thursday?", می‌خوای: "do you want", پنجشنبه: Thursday, بریم: "let's go", سینما: "cinema / movies", "چطوره؟": "How about it? / How's that?"}
        status: correct
    feedback: "می‌خوای پنجشنبه بریم سینما؟ combines this lesson's own new word with review vocabulary, including lesson01's چطوره؟"
  fa.a1.unit12.lesson02.exercise03.order_propose_plan:
    instruction: "Arrange the words to ask Do you want to go to the movies on Thursday?"
    accepted_answers:
      - {value: [می‌خوای, پنجشنبه, بریم, سینما], status: correct}
      - {value: [پنجشنبه, می‌خوای, بریم, سینما], status: correct}
      - {value: [می‌خوای, بریم, سینما, پنجشنبه], status: correct}
    feedback: "می‌خوای پنجشنبه بریم سینما؟ means do you want to go to the movies on Thursday?"
  fa.a1.unit12.lesson02.exercise04.translate_propose_plan:
    instruction: "Translate into Farsi: Do you want to go to the movies on Thursday?"
    accepted_answers:
      - {value: "می‌خوای پنجشنبه بریم سینما", status: correct}
      - {value: "می‌خوای پنجشنبه بریم سینما؟", status: correct}
      - {value: "پنجشنبه می‌خوای بریم سینما؟", status: correct}
      - {value: "پنجشنبه می‌خوای بریم سینما", status: correct}
      - {value: "می‌خوای بریم سینما پنجشنبه؟", status: correct}
      - {value: "می‌خوای بریم سینما پنجشنبه", status: correct}
    feedback: "می‌خوای پنجشنبه بریم سینما؟ means do you want to go to the movies on Thursday?"
  fa.a1.unit12.lesson02.exercise05.dialogue_response_propose:
    instruction: "Propose to a friend that you go to the movies on Thursday."
    accepted_answers:
      - {value: "می‌خوای پنجشنبه بریم سینما؟", status: correct}
      - {value: "می‌خوای پنجشنبه بریم سینما", status: correct}
      - {value: "پنجشنبه می‌خوای بریم سینما؟", status: correct}
      - {value: "پنجشنبه می‌خوای بریم سینما", status: correct}
      - {value: "می‌خوای بریم سینما پنجشنبه؟", status: correct}
      - {value: "می‌خوای بریم سینما پنجشنبه", status: correct}
    feedback: "می‌خوای پنجشنبه بریم سینما؟ proposes going to the movies on Thursday."
  fa.a1.unit12.lesson03.exercise01.recognize_bashe_reading:
    instruction: "What does this word mean?"
    correct_option: okay
    distractors: [great, "it's a deal / agreed", plan]
    accepted_answers: [{value: okay, status: correct}]
    feedback: "باشه means okay."
  fa.a1.unit12.lesson03.exercise02.recognize_ghabule_reading:
    instruction: "What does this word mean?"
    correct_option: "it's a deal / agreed"
    distractors: [okay, great, "cinema / movies"]
    accepted_answers: [{value: "it's a deal / agreed", status: correct}]
    feedback: "قبوله means it's a deal / agreed."
  fa.a1.unit12.lesson03.exercise03.match_accepting_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {باشه: okay, عالیه: great, قبوله: "it's a deal / agreed", برنامه: plan, سینما: "cinema / movies", بریم: "let's go"}
        status: correct
    feedback: "The first three are this lesson's own accepting words; the rest review lesson01."
  fa.a1.unit12.lesson03.exercise04.translate_okay_great:
    instruction: "Translate into Farsi: Okay, great!"
    accepted_answers:
      - {value: "باشه، عالیه", status: correct}
      - {value: "باشه عالیه", status: correct}
      - {value: "باشه، عالیه!", status: correct}
      - {value: "باشه عالیه!", status: correct}
    feedback: "باشه، عالیه means okay, great!"
  fa.a1.unit12.lesson03.exercise05.dialogue_response_accept:
    instruction: "A friend proposed going to the movies on Thursday. Accept enthusiastically, using all three words you have learned: okay, great, it's a deal."
    accepted_answers:
      - {value: "باشه، عالیه! قبوله", status: correct}
      - {value: "باشه عالیه قبوله", status: correct}
      - {value: "باشه، عالیه، قبوله", status: correct}
      - {value: "باشه، عالیه! قبوله!", status: correct}
      - {value: "باشه، عالیه. قبوله", status: correct}
    feedback: "باشه، عالیه! قبوله enthusiastically accepts and confirms."
  fa.a1.unit12.lesson04.exercise01.recognize_motasefam_reading:
    instruction: "What does this word mean?"
    correct_option: "I'm sorry"
    distractors: ["I can't", "I have things to do", okay]
    accepted_answers: [{value: "I'm sorry", status: correct}]
    feedback: "متأسفم means I'm sorry."
  fa.a1.unit12.lesson04.exercise02.recognize_nemitoonam_reading:
    instruction: "What does this word mean?"
    correct_option: "I can't"
    distractors: ["I'm sorry", "I have things to do", great]
    accepted_answers: [{value: "I can't", status: correct}]
    feedback: "نمی‌تونم means I can't."
  fa.a1.unit12.lesson04.exercise03.match_declining_phrases:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {متأسفم: "I'm sorry", نمی‌تونم: "I can't", "کار دارم": "I have things to do", کار: work, دارم: "I have", برنامه: plan}
        status: correct
    feedback: "These cover the key phrases for politely declining a plan; برنامه reviews lesson01."
  fa.a1.unit12.lesson04.exercise04.order_decline_plan:
    instruction: "Arrange the words to say I'm sorry, I can't, I have things to do."
    accepted_answers:
      - {value: [متأسفم, نمی‌تونم, کار, دارم], status: correct}
    feedback: "متأسفم، نمی‌تونم، کار دارم declines politely with a reason."
  fa.a1.unit12.lesson04.exercise05.translate_decline:
    instruction: "Translate into Farsi: I'm sorry, I can't."
    accepted_answers:
      - {value: "متأسفم، نمی‌تونم", status: correct}
      - {value: "متأسفم نمی‌تونم", status: correct}
      - {value: "متأسفم. نمی‌تونم.", status: correct}
    feedback: "متأسفم، نمی‌تونم means I'm sorry, I can't."
  fa.a1.unit12.lesson04.exercise06.dialogue_response_decline:
    instruction: "A friend proposed going to the movies on Thursday, but you're busy. Decline politely: say you're sorry, you can't, and you have things to do."
    accepted_answers:
      - {value: "متأسفم، نمی‌تونم. کار دارم", status: correct}
      - {value: "متأسفم، نمی‌تونم، کار دارم", status: correct}
      - {value: "متأسفم نمی‌تونم کار دارم", status: correct}
      - {value: "متأسفم، نمی‌تونم و کار دارم", status: correct}
      - {value: "متأسفم. نمی‌تونم. کار دارم.", status: correct}
    feedback: "متأسفم، نمی‌تونم. کار دارم politely declines and gives a reason -- a period, comma, و (and), or no punctuation are all natural here."
  fa.a1.unit12.lesson05.exercise01.recognize_davat_reading:
    instruction: "What does this word mean?"
    correct_option: invitation
    distractors: [plan, "cinema / movies", okay]
    accepted_answers: [{value: invitation, status: correct}]
    feedback: "دعوت means invitation."
  fa.a1.unit12.lesson05.exercise02.reading_comprehension_invitation:
    instruction: "Read the invitation message. When and where is the plan for?"
    correct_option: "Thursday at eight at night, at the movies"
    distractors: ["Thursday at nine in the morning, at the cinema", "Friday at eight at night, at home", "Thursday at eight at night, at a restaurant"]
    accepted_answers: [{value: "Thursday at eight at night, at the movies", status: correct}]
    feedback: "پنجشنبه ساعت هشت شب... بریم سینما؟ proposes Thursday at eight at night, at the movies."
  fa.a1.unit12.lesson05.exercise03.match_invitation_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {دعوت: invitation, "ساعت هشت شب": "eight o'clock at night", سلام: hello, منتظرم: "I'm waiting", پنجشنبه: Thursday, سینما: "cinema / movies"}
        status: correct
    feedback: "These cover the invitation message's key vocabulary."
  fa.a1.unit12.lesson05.exercise04.translate_waiting:
    instruction: "Translate into Farsi: I'm waiting."
    accepted_answers:
      - {value: منتظرم, status: correct}
    feedback: "منتظرم means I'm waiting."
  fa.a1.unit12.lesson05.exercise05.write_invitation_reply:
    instruction: "Write a short reply: say okay and great, then that you'll see them Thursday at eight at night."
    accepted_answers:
      - {value: "باشه، عالیه! پنجشنبه ساعت هشت شب می‌بینمت", status: correct}
      - {value: "باشه عالیه پنجشنبه ساعت هشت شب می‌بینمت", status: correct}
      - {value: "باشه، عالیه، پنجشنبه ساعت هشت شب می‌بینمت", status: correct}
      - {value: "باشه، عالیه. پنجشنبه ساعت هشت شب می‌بینمت", status: correct}
      - {value: "باشه، عالیه! پنجشنبه ساعت هشت شب می‌بینمت.", status: correct}
    feedback: "باشه، عالیه! پنجشنبه ساعت هشت شب می‌بینمت accepts and confirms when you'll see them."
  fa.a1.unit12.lesson06.exercise01.dialogue_comprehension_context:
    instruction: "Read the conversation. What time is the movie?"
    correct_option: "Eight at night"
    distractors: ["Eight in the morning", "Nine at night", "It isn't stated"]
    accepted_answers: [{value: "Eight at night", status: correct}]
    feedback: "آرش says ساعت هشت شب -- eight at night."
  fa.a1.unit12.lesson06.exercise02.match_dialogue_facts:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"چه ساعتی؟": "What time?", پنجشنبه: Thursday, "ساعت هشت شب": "eight o'clock at night", سینما: "cinema / movies", می‌بینمت: "I'll see you", خوبه: good}
        status: correct
    feedback: "The meeting is at the movies, Thursday at eight at night."
  fa.a1.unit12.lesson06.exercise03.order_what_time:
    instruction: "Arrange the words to ask What time?"
    accepted_answers:
      - {value: ["چه", "ساعتی؟"], status: correct}
    feedback: "چه ساعتی؟ means what time?"
  fa.a1.unit12.lesson06.exercise04.translate_see_you_thursday:
    instruction: "Translate into Farsi: I'll see you Thursday."
    accepted_answers:
      - {value: "پنجشنبه می‌بینمت", status: correct}
      - {value: "می‌بینمت پنجشنبه", status: correct}
