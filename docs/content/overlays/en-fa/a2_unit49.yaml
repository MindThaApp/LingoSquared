teaching:
  fa.a2.unit49.lesson01.teach.event_words:
    title: Places and events to invite someone to
    gloss: cinema, concert, theatre, birthday, ticket
    note: '*کنسرت* is a concert and *تئاتر* is a play or the theatre. *بلیت* is the ticket you may have for an event.'
    example_gloss:
    - I have two concert tickets.
    - The play was very good.
    - On Friday I'm going to the cinema.
    - I bought a gift for my friend's birthday.
  fa.a2.unit49.lesson01.teach.invite_words:
    title: Invitation and “shall we go”
    gloss: invitation, let's go / shall we go
    note: '*دعوت* is an invitation. *بریم* (“let''s go / shall we go”) ends a friendly suggestion, often with *با هم* (“together”).'
    example_gloss:
    - Thanks for the invitation.
    - Nima is inviting Sara.
    - Shall we go to the cinema together?
    - Shall we go to the park tonight?
  fa.a2.unit49.lesson01.teach.more_events:
    title: More kinds of get-togethers
    gloss: party, picnic, get-together, celebration
    note: '*مهمونی* is a party, *پیک‌نیک* is a picnic, *دورهمی* is a casual get-together, and *جشن* is a celebration.'
    example_gloss:
    - We're having a party tonight.
    - We're going on a picnic on Friday.
    - We're having a celebration and get-together on Saturday.
  fa.a2.unit49.lesson01.teach.invitation_extras:
    title: More invitation words
    gloss: lunch, outing, invitation card
    note: '*ناهار* is lunch, *گردش* is an outing, and *دعوتنامه* is an invitation card or written invitation.'
    example_gloss:
    - We're having lunch on Friday.
    - Shall we go on an outing together?
    - I have an invitation card.
  fa.a2.unit49.lesson01.teach.invite_forms:
    title: Three easy ways to invite
    gloss: Do you want to come to a concert? Will you come to the theatre with me? Shall we go to the cinema together?
    note: All three are questions. *می‌خوای بیای ...؟* asks if the other person wants to come. *با من میای ...؟* asks directly. *با هم بریم ...؟* suggests going together. Add a time word first (*فردا*, *جمعه شب*) so the invitation is clear.
  fa.a2.unit49.lesson02.teach.accept_words:
    title: Words for saying yes
    gloss: yes, definitely, how nice, great, OK, I'll come
    note: '*آره* and *باشه* say yes. *حتما* adds “definitely.” *چه خوب* and *عالیه* show you are pleased.'
    example_gloss:
    - Yes, I'll definitely come.
    - How nice! Thanks.
    - OK, eight o'clock is fine.
    - Great! I'll come on Saturday.
  fa.a2.unit49.lesson02.teach.detail_words:
    title: Asking for details
    gloss: what time, where, when
    note: 'After you accept, ask the detail you need: *ساعت چند؟* (what time), *کجا؟* (where), *کی؟* (when).'
    example_gloss:
    - What time are we going?
    - Where are we going?
    - When are we going?
  fa.a2.unit49.lesson02.teach.accept_forms:
    title: Saying yes, and saying maybe
    gloss: Thanks for the invitation! I'll definitely come; I can come; maybe I can come
    note: 'A definite yes is *حتما میام*. *می‌تونم بیام* says that you are able to come. *شاید بتونم بیام* is a careful “maybe”: it is not a promise. Start with *ممنون از دعوت* to be polite.'
  fa.a2.unit49.lesson03.teach.decline_words:
    title: Words for saying no politely
    gloss: unfortunately, sorry, I can't, but
    note: Soften a refusal with *متاسفانه* or *ببخشید* before *نمی‌تونم بیام*.
    example_gloss:
    - Unfortunately I can't come.
    - Sorry, I can't on Friday.
    - Thanks, but I can't.
  fa.a2.unit49.lesson03.teach.reason_words:
    title: Reasons for saying no
    gloss: I have work, I have an appointment, I have a meeting, I'm sick, I have to study, I have to go to class
    note: '*باید* (“have to”) comes before a short verb: *باید درس بخونم*, *باید برم کلاس*. Other reasons use *دارم*: *کار دارم*, *قرار دارم*.'
    example_gloss:
    - I have work on Friday.
    - I have an appointment tonight.
    - I have a meeting tomorrow.
    - I'm sick today.
    - I have to study.
    - I have to go to class.
  fa.a2.unit49.lesson03.teach.future_reasons:
    title: A reason about your plans
    gloss: because tomorrow I'm going to the north, because at the weekend I'm going to Tehran
    note: 'A reason can be a plan: *چون* plus *می‌خوام برم* and a place.'
    example_gloss:
    - Because tomorrow I'm going to the north.
    - Because at the weekend I'm going to Tehran.
  fa.a2.unit49.lesson03.teach.host_schedule:
    title: Hosting and your schedule
    gloss: host, guest, busy, free
    note: '*میزبان* is the host and *مهمون* is a guest. Use *مشغولم* when you are busy and *آزادم* when you are free.'
    example_gloss:
    - Sara is hosting the party.
    - I have a guest tonight.
    - I'm busy on Friday and free on Saturday.
  fa.a2.unit49.lesson03.teach.hosting_extras:
    title: Hosting and having time
    gloss: hosting, entertaining guests, opportunity / time
    note: '*میزبانی* is hosting. *پذیرایی* is entertaining or serving guests. *فرصت* means an opportunity or enough time to do something.'
    example_gloss:
    - Sara is hosting.
    - Sara is entertaining the guest.
    - I have time on Saturday.
  fa.a2.unit49.lesson03.teach.decline_pattern:
    title: Saying no with a reason
    gloss: Sorry, I can't come, because I have to study
    note: 'A polite refusal has three parts: an apology (*ببخشید* or *متاسفانه*), the refusal (*نمی‌تونم بیام*) and the reason with *چون*. The reason can also come first: *چون باید درس بخونم، نمی‌تونم بیام*.'
  fa.a2.unit49.lesson04.teach.alt_words:
    title: Suggesting another day
    gloss: but, how about Saturday, next week, another time
    note: '*ولی* (“but”) joins the refusal to the new idea. *شنبه چطوره؟* proposes a different day.'
    example_gloss:
    - I can't on Friday, but I can on Saturday.
    - How about Saturday?
    - Next week I can.
    - We'll go another time.
  fa.a2.unit49.lesson04.teach.if_plan:
    title: If you have time
    gloss: if you have time
    note: '*اگه* (“if”) plus the present is a friendly condition: *اگه وقت داری، با هم می‌ریم*.'
    example_gloss:
    - If you have time, we'll go together.
    - If you have time on Saturday, come.
  fa.a2.unit49.lesson04.teach.alt_pattern:
    title: No, with a reason and another idea
    gloss: I can't come, because I have work. But I can on Saturday
    note: 'A good refusal does not stop at no. Give the reason with *چون*, then offer another time with *ولی*: *ولی شنبه می‌تونم*. You can also ask *شنبه چطوره؟*'
  fa.a2.unit49.lesson05.teach.reading_invite:
    title: Sara's invitation
    gloss: Hi Nima! On Friday evening I have two concert tickets. Do you want to come with me? We're going at eight. Bye for now, Sara
    note: Find the event, the day and the time.
  fa.a2.unit49.lesson05.teach.reading_reply:
    title: Nima's reply
    gloss: Hi Sara! Thanks for the invitation. Unfortunately I can't come on Friday, because I have to study. But I can on Saturday. Shall we go to the theatre together on Saturday evening? Bye for now, Nima
    note: Find the thanks, the refusal, the reason and the new idea.
  fa.a2.unit49.lesson06.teach.turn01:
    title: Sara invites Nima
    gloss: Hi Nima! On Friday evening, do you want to come to a concert with me?
    note: Sara invites with *می‌خوای*.
  fa.a2.unit49.lesson06.teach.turn02:
    title: Nima thanks her and declines
    gloss: Thanks for the invitation! But unfortunately I can't on Friday, because I have to study.
    note: Thanks, refusal and reason in one turn.
  fa.a2.unit49.lesson06.teach.turn03:
    title: Sara suggests another day
    gloss: How about Saturday? Do you want to go to the theatre?
    note: A new day and a new event.
  fa.a2.unit49.lesson06.teach.turn04:
    title: Nima accepts and asks the time
    gloss: Yes, I can on Saturday. What time?
    note: Nima accepts and asks for a detail.
  fa.a2.unit49.lesson06.teach.turn05:
    title: Sara gives the time
    gloss: At eight.
    note: A short answer.
  fa.a2.unit49.lesson06.teach.turn06:
    title: Nima confirms
    gloss: Great! So I'll come on Saturday. Bye for now!
    note: '*پس* (“so”) confirms the plan.'
