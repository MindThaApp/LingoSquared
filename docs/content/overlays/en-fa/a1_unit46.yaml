review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Draft overlay paired with the fa.a1.unit46.personal_care realization.
    See that file's generation_provenance for the honest source-access
    result: with Firecrawl at 0 credits this session, tried WebFetch
    directly against the Live Lingua-hosted FSI Persian Basic Course PDF
    first (per this task's explicit instruction), which returned only a
    binary-content notice with no usable text; fell back to a local
    `pdftotext -layout` extraction of the same file (66,717 words,
    matching every prior fetch of this file across units 36-45). A grep
    for haircut/barber/hairdress/salon/comb/shave/trim/hair found only 3
    scattered hits, none of them structured barbershop content: "gis"
    ('hair') in an unrelated phonetic minimal-pair drill list, "tarasidan"
    ('to sharpen/shave/scrape') in a Classroom Expressions section about
    sharpening a PENCIL, and "rish-tarasi" ('shaving') as a passing
    mention inside an unrelated household-chores/laundry dialogue -- a
    genuine dead end, the same shape as unit45's pharmacy search. All
    personal-care vocabulary and the full dialogue are authored fresh
    from this project's own established conventions. Reuse chain: مو/
    کوتاه/موهاش (unit25), می‌رم (unit24), می‌خوام (unit03), باشه (units
    01/02/06/17/22/45), مثل (unit04), قبل (unit45), چطور (unit01),
    می‌خوای (unit12/14/16/20/35), آره (unit07), ولی (unit15), یکم (unit09/
    23/36), چشم (unit06, idiomatic "sure" sense reused, distinct from its
    unrelated "eye" sense in unit25), دو/سه (unit03), دقیقه (unit09/28),
    آقای (unit40/42/44), کردن (unit32/35), هزار/تومن (unit21). New
    vocabulary genuinely introduced for the first time in the whole
    corpus: سلمانی (barbershop), موهام (my hair -- a new 1st-person
    fused-possessive form extending the already-taught موهاش pattern),
    and کوتاه‌تر (shorter -- the -تر comparative suffix, already
    established since unit15, applied to the already-taught کوتاه) -- 3
    new words/forms, no new verb-conjugation pattern introduced. Register
    note: نیما (the established recurring character) is the barbershop
    customer; a new formal-register character, آقای نوری, is the barber,
    distinct from unit41's خانم احمدی, unit42's آقای صادقی, unit44's
    آقای کریمی, and unit45's خانم رضایی (confirmed via a real regex scan
    of every آقای/خانم name already used across the fa corpus, zero
    collision). The style request ("shorter," "like before") is kept
    identical across the dialogue and the wrap-up review, per
    AUTHORING_GUIDE.md #11; the price mentioned in lesson05's separate
    shop-sign reading text never contradicts anything the dialogue
    states, since the dialogue itself never mentions a price. Every
    "Translate into English" exercise below explicitly sets
    answer_language_code: en. No exercise in this unit tests a genuine
    two-clause sentence (§12) -- every translated sentence is a single
    clause or a colon-separated label-style note (lesson05's reading
    text, matching unit43/44/45's own treatment of their colon-separated
    notes with paraphrase-variant accepted answers). No listen_type/
    listen_select/listen_order exercise is used anywhere in this unit
    (continuing the established text-based corpus-consistency pattern
    from units 19-45, even though fa now has real Azure TTS per §14), so
    the same-speaker/same-audio distractor-collision bug class fixed
    2026-07-09 in the nl corpus (commit 148240e) cannot directly apply
    here -- verified anyway that lesson04's dialogue_comprehension
    distractors ("He wants to know the price of the haircut."/"He wants
    to know if Mr. Nouri is free today."/"He wants to know if he needs an
    appointment.") are plausible-fact alternatives, not lines either
    dialogue speaker (نیما or آقای نوری) actually says or facts they
    actually state anywhere in this unit's dialogue -- price, same-day
    availability, and needing an appointment are never mentioned by
    either speaker in the dialogue itself (the price only appears
    separately in lesson05's unrelated shop-sign reading text, so there
    is no cross-exercise collision either); the dialogue_response
    exercise (lesson04) carries no distractor set at all, so this
    check doesn't apply to it. Boolean-coercion check: ran a recursive
    scan over title/gloss/note/example_gloss/answer/matching-pair value
    fields (including matching_pairs right: values specifically) across
    both this overlay and the paired realization for bare yes/no/true/
    false/on/off string values or coerced booleans, plus a full
    yaml.safe_load parse of both files confirming every loaded value is a
    str/list/dict rather than a Python bool -- zero hits. Compiler
    validation, both standalone and against the full 46-unit en-fa A1
    corpus with position-matched realization/overlay lists, confirmed 0
    errors.

course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: going to the barbershop, describing a simple
    hair-length preference (shorter, the same style as before), a full
    customer-to-barber exchange, and reading/writing a short barbershop
    sign naming the service and price.

units:
  fa.a1.unit46.personal_care:
    title: The barbershop

lessons:
  fa.a1.unit46.lesson01.new_personal_care_one: {title: "New words 1"}
  fa.a1.unit46.lesson02.new_personal_care_two: {title: "New words 2"}
  fa.a1.unit46.lesson03.request_shorter: {title: "Asking for it shorter"}
  fa.a1.unit46.lesson04.personal_care_dialogue: {title: "Dialogue: at the barbershop"}
  fa.a1.unit46.lesson05.reading_salon_sign: {title: "Reading a barbershop sign"}
  fa.a1.unit46.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit46.lesson01.teach.review_mo_kootah:
    title: "Review: hair / short"
    gloss: "hair / short"
    note: "*مو* ('hair') and *کوتاه* ('short') were already taught in unit25."
  fa.a1.unit46.lesson01.teach.review_miram:
    title: "Review: I'm going"
    gloss: "I'm going"
    note: "*می‌رم* ('I'm going') was already taught in unit24."
  fa.a1.unit46.lesson01.teach.salmani:
    title: Barbershop
    gloss: barbershop
    note: "*سلمانی* means 'barbershop.'"
    example_gloss: "I'm going to the barbershop."

  fa.a1.unit46.lesson02.teach.review_mohash:
    title: "Review: his/her hair"
    gloss: "his/her hair"
    note: "*موهاش* ('his/her hair') was already taught in unit25."
  fa.a1.unit46.lesson02.teach.moham:
    title: "My hair"
    gloss: "my hair"
    note: "*موهام* means 'my hair,' the same fused-possessive pattern as *موهاش* ('his/her hair'), just for 'I.'"
    example_gloss: "My hair is short."
  fa.a1.unit46.lesson02.teach.review_bashe:
    title: "Review: okay"
    gloss: okay
    note: "*باشه* ('okay') was already taught in units 01/02/06/17/22/45."

  fa.a1.unit46.lesson03.teach.review_mikhaam:
    title: "Review: I want"
    gloss: "I want"
    note: "*می‌خوام* ('I want') was already taught in unit03."
  fa.a1.unit46.lesson03.teach.kootahtar:
    title: Shorter
    gloss: shorter
    note: "*کوتاه‌تر* means 'shorter' -- the *-تر* comparative ending (already taught in unit15) added to *کوتاه* ('short')."
    example_gloss: "I want my hair to be shorter."
  fa.a1.unit46.lesson03.teach.mesle_ghabl:
    title: "Like before"
    gloss: "like before"
    note: "*مثل* ('like') was already taught in unit04; *قبل* ('before') was already taught in unit45. Together, *مثل قبل* means 'like before,' i.e. the same style as usual."

  fa.a1.unit46.lesson04.teach.review_salam_mamnoon:
    title: "Review: hi / thanks"
    gloss: "hi / thanks"
    note: "*سلام* and *ممنون* were already taught in units 01/17/22/45."
  fa.a1.unit46.lesson04.teach.review_aghaye:
    title: "Review: Mr."
    gloss: "Mr."
    note: "*آقای* ('Mr.') was already taught in unit40/42/44."
  fa.a1.unit46.lesson04.teach.review_chetor_mikhaay:
    title: "Review: how / you want"
    gloss: "how / you want"
    note: "*چطور* ('how') was already taught in unit01; *می‌خوای* ('you want') was already taught in unit12/14/16/20/35."
  fa.a1.unit46.lesson04.teach.review_are_vali_yekam:
    title: "Review: yeah / but / a little"
    gloss: "yeah / but / a little"
    note: "*آره* ('yeah') was already taught in unit07; *ولی* ('but') was already taught in unit15; *یکم* ('a little') was already taught in unit09/23/36."
  fa.a1.unit46.lesson04.teach.review_cheshm_do_daghighe:
    title: "Review: sure / two minutes"
    gloss: "sure, got it / two minutes"
    note: "*چشم* ('sure, got it') was already taught in unit06; *دو دقیقه* ('two minutes') reuses *دو* (unit03) and *دقیقه* (unit09/28)."
  fa.a1.unit46.lesson04.teach.character_noori:
    title: "Mr. Nouri"
    gloss: "Mr. Nouri"
    note: "*آقای نوری* is this unit's new barber character, distinct from every other named service-encounter character already in this course."
    example_gloss: "Mr. Nouri has a barbershop."
  fa.a1.unit46.lesson04.teach.dialogue_line1:
    title: "Nima: Hi Mr. Nouri."
    gloss: "Hi Mr. Nouri."
  fa.a1.unit46.lesson04.teach.dialogue_line2:
    title: "Mr. Nouri: Hi Nima. How do you want it?"
    gloss: "Hi Nima. How do you want it?"
  fa.a1.unit46.lesson04.teach.dialogue_line3:
    title: "Nima: I want my hair to be shorter."
    gloss: "I want my hair to be shorter."
  fa.a1.unit46.lesson04.teach.dialogue_line4:
    title: "Mr. Nouri: Okay. Like before?"
    gloss: "Okay. Like before?"
  fa.a1.unit46.lesson04.teach.dialogue_line5:
    title: "Nima: Yeah, like before, but a little shorter."
    gloss: "Yeah, like before, but a little shorter."
  fa.a1.unit46.lesson04.teach.dialogue_line6:
    title: "Mr. Nouri: Sure. Two minutes."
    gloss: "Sure. Two minutes."
  fa.a1.unit46.lesson04.teach.dialogue_line7:
    title: "Nima: Thanks!"
    gloss: "Thanks!"

  fa.a1.unit46.lesson05.teach.reading_text:
    title: "Reading: a barbershop sign"
    gloss: "Nouri's barbershop: haircut, three thousand toman."
    note: "A short shop sign naming the service and the price."

  fa.a1.unit46.lesson06.teach.review_request:
    title: "I want my hair to be shorter."
    gloss: "I want my hair to be shorter."
    note: "A full review sentence reusing only already-known words from this unit."
  fa.a1.unit46.lesson06.teach.review_mesle_ghabl:
    title: "Like before, but a little shorter."
    gloss: "Like before, but a little shorter."
  fa.a1.unit46.lesson06.teach.summary_words:
    title: "Barbershop / hair / my hair / shorter / like before"
    gloss: "barbershop / hair / my hair / shorter / like before"
    note: "These are the key words taught in this unit."

exercises:
  fa.a1.unit46.lesson01.exercise01.recognize_salmani:
    instruction: "What does this word mean?"
    correct_option: barbershop
    distractors: [hair, appointment, medicine]
    accepted_answers: [{value: barbershop, status: correct}]
    feedback: "سلمانی means barbershop."
  fa.a1.unit46.lesson01.exercise02.recognize_miram_salmani:
    instruction: "What does this sentence mean?"
    correct_option: "I'm going to the barbershop."
    distractors: ["I'm going to the pharmacy.", "I have short hair.", "Where is the barbershop?"]
    accepted_answers: [{value: "I'm going to the barbershop.", status: correct}]
    feedback: "می‌رم سلمانی means 'I'm going to the barbershop.'"
  fa.a1.unit46.lesson01.exercise03.match_personal_care_one:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {سلمانی: barbershop, مو: hair, کوتاه: short, "می‌رم": "I'm going", "موی کوتاه": "short hair", "می‌رم سلمانی.": "I'm going to the barbershop."}
        status: correct
    feedback: "These are the first new barbershop words for this unit."
  fa.a1.unit46.lesson01.exercise04.word_order_miram_salmani:
    instruction: "Put the words in order."
    accepted_answers: [{value: ["می‌رم", سلمانی], status: correct}]
    feedback: "می‌رم سلمانی means 'I'm going to the barbershop.'"
  fa.a1.unit46.lesson01.exercise05.translate_moye_kootah:
    instruction: "Translate into English: موی کوتاه"
    answer_language_code: en
    accepted_answers:
      - {value: "Short hair.", status: correct}
      - {value: "Short hair", status: correct}
      - {value: "short hair", status: correct}
    feedback: "موی کوتاه means 'short hair.'"

  fa.a1.unit46.lesson02.exercise01.recognize_moham:
    instruction: "What does this word mean?"
    correct_option: "my hair"
    distractors: ["his hair", barbershop, short]
    accepted_answers: [{value: "my hair", status: correct}]
    feedback: "موهام means 'my hair.'"
  fa.a1.unit46.lesson02.exercise02.recognize_moham_kootahe:
    instruction: "What does this sentence mean?"
    correct_option: "My hair is short."
    distractors: ["His hair is short.", "My hair is long.", "I want short hair."]
    accepted_answers: [{value: "My hair is short.", status: correct}]
    feedback: "موهام کوتاهه means 'My hair is short.'"
  fa.a1.unit46.lesson02.exercise03.match_personal_care_two:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {موهام: "my hair", موهاش: "his/her hair", کوتاهه: "is short", باشه: okay, مو: hair, کوتاه: short}
        status: correct
    feedback: "These words let you talk about your own hair."
  fa.a1.unit46.lesson02.exercise04.word_order_moham_kootahe:
    instruction: "Put the words in order."
    accepted_answers: [{value: [موهام, کوتاهه], status: correct}]
    feedback: "موهام کوتاهه means 'My hair is short.'"
  fa.a1.unit46.lesson02.exercise05.translate_moham_kootahe:
    instruction: "Translate into English: موهام کوتاهه."
    answer_language_code: en
    accepted_answers:
      - {value: "My hair is short.", status: correct}
      - {value: "My hair is short", status: correct}
    feedback: "موهام کوتاهه means 'My hair is short.'"

  fa.a1.unit46.lesson03.exercise01.recognize_kootahtar:
    instruction: "What does this word mean?"
    correct_option: shorter
    distractors: [short, longer, thicker]
    accepted_answers: [{value: shorter, status: correct}]
    feedback: "کوتاه‌تر means 'shorter.'"
  fa.a1.unit46.lesson03.exercise02.recognize_mikhaam_moham_kootahtar_bashe:
    instruction: "What does this sentence mean?"
    correct_option: "I want my hair to be shorter."
    distractors: ["I want my hair to be longer.", "My hair is already shorter.", "I don't want my hair short."]
    accepted_answers: [{value: "I want my hair to be shorter.", status: correct}]
    feedback: "می‌خوام موهام کوتاه‌تر باشه means 'I want my hair to be shorter.'"
  fa.a1.unit46.lesson03.exercise03.match_request_shorter:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"کوتاه‌تر": shorter, "می‌خوام": "I want", باشه: "(to) be", موهام: "my hair", مثل: like, قبل: before, "مثل قبل": "like before"}
        status: correct
    feedback: "These words let you ask for a specific style at the barbershop."
  fa.a1.unit46.lesson03.exercise04.word_order_mikhaam_moham_kootahtar_bashe:
    instruction: "Put the words in order."
    accepted_answers: [{value: ["می‌خوام", موهام, "کوتاه‌تر", باشه], status: correct}]
    feedback: "می‌خوام موهام کوتاه‌تر باشه means 'I want my hair to be shorter.'"
  fa.a1.unit46.lesson03.exercise05.translate_mesle_ghabl_kootahtar:
    instruction: "Translate into English: مثل قبل، ولی کوتاه‌تر."
    answer_language_code: en
    accepted_answers:
      - {value: "Like before, but shorter.", status: correct}
      - {value: "Like before, but shorter", status: correct}
      - {value: "The same as before, but shorter.", status: correct}
    feedback: "مثل قبل، ولی کوتاه‌تر means 'Like before, but shorter.'"

  fa.a1.unit46.lesson04.exercise01.dialogue_comprehension_style:
    instruction: "Mr. Nouri asks Nima something. What does he want to know?"
    correct_option: "He wants to know what style Nima wants."
    distractors:
      - "He wants to know the price of the haircut."
      - "He wants to know if Mr. Nouri is free today."
      - "He wants to know if he needs an appointment."
    accepted_answers: [{value: "He wants to know what style Nima wants.", status: correct}]
    feedback: "چطور می‌خوای؟ means 'How do you want it?'"
  fa.a1.unit46.lesson04.exercise02.recognize_dialogue_line5:
    instruction: "What does this sentence mean?"
    correct_option: "Yeah, like before, but a little shorter."
    distractors:
      - "Yeah, like before, but a lot shorter."
      - "No, not like before."
      - "Yeah, like before, but longer."
    accepted_answers: [{value: "Yeah, like before, but a little shorter.", status: correct}]
    feedback: "آره، مثل قبل، ولی یکم کوتاه‌تر means 'Yeah, like before, but a little shorter.'"
  fa.a1.unit46.lesson04.exercise03.match_dialogue_personal_care:
    instruction: "Match each line with its meaning."
    accepted_answers:
      - value: {"سلام آقای نوری.": "Hi Mr. Nouri.", "سلام نیما. چطور می‌خوای؟": "Hi Nima. How do you want it?", "می‌خوام موهام کوتاه‌تر باشه.": "I want my hair to be shorter.", "باشه. مثل قبل؟": "Okay. Like before?", "آره، مثل قبل، ولی یکم کوتاه‌تر.": "Yeah, like before, but a little shorter.", "چشم. دو دقیقه.": "Sure. Two minutes.", "ممنون!": "Thanks!"}
        status: correct
    feedback: "These lines appear in the barbershop conversation between Nima and Mr. Nouri."
  fa.a1.unit46.lesson04.exercise04.dialogue_response_style:
    instruction: "Respond to چطور می‌خوای؟ by saying you want your hair to be shorter."
    accepted_answers:
      - {value: "می‌خوام موهام کوتاه‌تر باشه.", status: correct}
      - {value: "می‌خوام موهام کوتاه‌تر باشه", status: correct}
    feedback: "می‌خوام موهام کوتاه‌تر باشه means 'I want my hair to be shorter.'"
  fa.a1.unit46.lesson04.exercise05.translate_dialogue_line4:
    instruction: "Translate into English: باشه. مثل قبل؟"
    answer_language_code: en
    accepted_answers:
      - {value: "Okay. Like before?", status: correct}
      - {value: "Okay, like before?", status: correct}
      - {value: "Okay. The same as before?", status: correct}
    feedback: "باشه. مثل قبل؟ means 'Okay. Like before?'"

  fa.a1.unit46.lesson05.exercise01.reading_comprehension_service:
    instruction: "According to the sign, what service is offered?"
    correct_option: "A haircut."
    distractors:
      - "A shave."
      - "A hair wash."
      - "An appointment reminder."
    accepted_answers: [{value: "A haircut.", status: correct}]
    feedback: "کوتاه کردن مو means 'cutting the hair short' -- a haircut."
  fa.a1.unit46.lesson05.exercise02.reading_comprehension_price:
    instruction: "According to the sign, what is the price?"
    correct_option: "Three thousand toman."
    distractors:
      - "Three hundred toman."
      - "Thirty thousand toman."
      - "Two thousand toman."
    accepted_answers: [{value: "Three thousand toman.", status: correct}]
    feedback: "سه هزار تومن means 'three thousand toman.'"
  fa.a1.unit46.lesson05.exercise03.match_reading_salon:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {سلمانی: barbershop, نوری: Nouri, "کوتاه کردن": "cutting short", مو: hair, "سه هزار تومن": "three thousand toman", تومن: toman}
        status: correct
    feedback: "These words let you understand the barbershop sign."
  fa.a1.unit46.lesson05.exercise04.translate_reading_salon:
    instruction: "Translate into English: سلمانی نوری: کوتاه کردن مو، سه هزار تومن."
    answer_language_code: en
    accepted_answers:
      - {value: "Nouri's barbershop: haircut, three thousand toman.", status: correct}
      - {value: "Nouri's barbershop, haircut, three thousand toman.", status: correct}
      - {value: "Nouri barbershop: haircut, three thousand toman.", status: correct}
    feedback: "سلمانی نوری: کوتاه کردن مو، سه هزار تومن means 'Nouri's barbershop: haircut, three thousand toman.'"
  fa.a1.unit46.lesson05.exercise05.write_salon_sign:
    instruction: "Write a short barbershop sign naming the service and the price, using this sign's pattern."
    accepted_answers:
      - {value: "سلمانی نوری: کوتاه کردن مو، سه هزار تومن.", status: correct}
      - {value: "سلمانی نوری: کوتاه کردن مو، سه هزار تومن", status: correct}
    feedback: "A sign can name the service and the price, e.g. سلمانی نوری: کوتاه کردن مو، سه هزار تومن."

  fa.a1.unit46.lesson06.exercise01.recognize_review_request:
    instruction: "What does this sentence mean?"
    correct_option: "I want my hair to be shorter."
    distractors:
      - "I want my hair to be longer."
      - "I don't want a haircut."
      - "I want the same style, not shorter."
    accepted_answers: [{value: "I want my hair to be shorter.", status: correct}]
    feedback: "می‌خوام موهام کوتاه‌تر باشه means 'I want my hair to be shorter.'"
  fa.a1.unit46.lesson06.exercise02.recognize_review_mesle_ghabl:
    instruction: "What does this sentence mean?"
    correct_option: "Like before, but a little shorter."
    distractors:
      - "Like before, but a lot shorter."
      - "Not like before."
      - "Like before, but longer."
    accepted_answers: [{value: "Like before, but a little shorter.", status: correct}]
    feedback: "مثل قبل، ولی یکم کوتاه‌تر means 'Like before, but a little shorter.'"
  fa.a1.unit46.lesson06.exercise03.match_wrap_personal_care:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {سلمانی: barbershop, مو: hair, موهام: "my hair", "کوتاه‌تر": shorter, "مثل قبل": "like before", چشم: "sure, got it"}
        status: correct
    feedback: "This reviews all the key barbershop words from this unit."
  fa.a1.unit46.lesson06.exercise04.word_order_moham_kootahtar:
