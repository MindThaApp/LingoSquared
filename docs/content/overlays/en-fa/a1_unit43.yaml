course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: sorting household waste -- naming the trash bin
    and recycling materials (paper, plastic, glass), asking and stating
    which bin something goes in, a full friend-to-friend dialogue about
    sorting and the collection day, and reading/writing a short
    waste-sorting notice.

units:
  fa.a1.unit43.waste_disposal:
    title: "Sorting the waste"

lessons:
  fa.a1.unit43.lesson01.new_waste_one: {title: "New words 1"}
  fa.a1.unit43.lesson02.new_waste_two: {title: "New words 2"}
  fa.a1.unit43.lesson03.which_bin: {title: "Which bin?"}
  fa.a1.unit43.lesson04.sorting_dialogue: {title: "Dialogue: sorting the waste"}
  fa.a1.unit43.lesson05.reading_waste_notice: {title: "Reading a waste-sorting notice"}
  fa.a1.unit43.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit43.lesson01.teach.review_kojast:
    title: "Review: where is"
    gloss: "where is"
    note: "*کجاست* ('where is') was already taught in unit05."
  fa.a1.unit43.lesson01.teach.review_household_pattern:
    title: "Review: object marker / I do / must"
    gloss: "object marker / I do / must, need to"
    note: "*رو* (object marker), *می‌کنم* ('I do'), and *باید* ('must, need to') were already taught in unit32."
  fa.a1.unit43.lesson01.teach.zabale:
    title: Trash
    gloss: "trash / garbage"
    note: "*زباله* means 'trash' or 'garbage.'"
    example_gloss: "This is trash."
  fa.a1.unit43.lesson01.teach.satl:
    title: Bin
    gloss: "bin / bucket"
    note: "*سطل* means 'bin' or 'bucket.'"
    example_gloss: "Where is the bin?"
  fa.a1.unit43.lesson01.teach.satl_zabale:
    title: "Trash bin"
    gloss: "trash bin"

  fa.a1.unit43.lesson02.teach.review_colors:
    title: "Review: color / blue / green"
    gloss: "color / blue / green"
    note: "*رنگ* ('color'), *آبی* ('blue'), and *سبز* ('green') were already taught in units 20/25/37."
  fa.a1.unit43.lesson02.teach.review_in_baraye:
    title: "Review: this / for"
    gloss: "this / for"
    note: "*این* ('this') was already taught in unit08; *برای* ('for') was already taught in unit34."
  fa.a1.unit43.lesson02.teach.kaghaz:
    title: Paper
    gloss: paper
    note: "*کاغذ* means 'paper.'"
    example_gloss: "This is paper."
  fa.a1.unit43.lesson02.teach.pelastik:
    title: Plastic
    gloss: plastic
    note: "*پلاستیک* means 'plastic.'"
    example_gloss: "This is plastic."
  fa.a1.unit43.lesson02.teach.shishe:
    title: Glass
    gloss: glass
    note: "*شیشه* means 'glass.'"
    example_gloss: "This is glass."
  fa.a1.unit43.lesson02.teach.bazyaft:
    title: Recycling
    gloss: recycling
    note: "*بازیافت* means 'recycling.'"
    example_gloss: "Paper is for recycling."

  fa.a1.unit43.lesson03.teach.review_kodum:
    title: "Review: which"
    gloss: which
    note: "*کدوم* ('which') was already taught in units 10/14/28/38/41."
  fa.a1.unit43.lesson03.teach.review_dakhel:
    title: "Review: inside"
    gloss: inside
    note: "*داخل* ('inside') was already taught in unit02 ('بفرمایید داخل,' please come in) -- the same core sense applies here."
  fa.a1.unit43.lesson03.teach.mindazam:
    title: "I put / I throw"
    gloss: "I put / I throw"
    note: "*می‌ندازم* means 'I put' or 'I throw' (in a bin), from the verb انداختن."
    example_gloss: "I put the paper inside the bin."
  fa.a1.unit43.lesson03.teach.mindazi_pattern:
    title: "I put -> you put"
    gloss: "you put / you throw"
    note: "*می‌ندازم* ('I put/throw') becomes *می‌ندازی* ('you put/throw,' informal) -- the same pattern as می‌کنم -> می‌کنی from unit32."
  fa.a1.unit43.lesson03.teach.kodum_satl_question:
    title: "Which bin do I put the paper in?"
    gloss: "Which bin do I put the paper in?"
  fa.a1.unit43.lesson03.teach.dakhel_satl_abi:
    title: "You put it inside the blue bin"
    gloss: "You put it inside the blue bin."

  fa.a1.unit43.lesson04.teach.review_salam_mamnoon:
    title: "Review: hi / thanks"
    gloss: "hi / thanks"
    note: "*سلام* and *ممنون* were already taught in units 01/17/22."
  fa.a1.unit43.lesson04.teach.review_bashe_chi:
    title: "Review: okay / what"
    gloss: "okay / what"
    note: "*باشه* ('okay') and *چی* ('what') were already taught in units 01/32."
  fa.a1.unit43.lesson04.teach.review_ki:
    title: "Review: when"
    gloss: when
    note: "*کی* ('when') was already taught in units 16/32/34."
  fa.a1.unit43.lesson04.teach.review_ruz_shanbe:
    title: "Review: day / Saturday"
    gloss: "day / Saturday"
    note: "*روز* ('day') and *شنبه* ('Saturday') were already taught in unit10."
  fa.a1.unit43.lesson04.teach.jamavari:
    title: Collection
    gloss: collection
    note: "*جمع‌آوری* means 'collection.'"
    example_gloss: "Collection day is Saturday."
  fa.a1.unit43.lesson04.teach.dialogue_line1:
    title: "Nima: Hi Sara, which bin do I put paper in?"
    gloss: "Hi Sara, which bin do I put paper in?"
  fa.a1.unit43.lesson04.teach.dialogue_line2:
    title: "Sara: It's inside the blue bin. It's for recycling."
    gloss: "It's inside the blue bin. It's for recycling."
  fa.a1.unit43.lesson04.teach.dialogue_line3:
    title: "Nima: Okay, thanks. What about glass?"
    gloss: "Okay, thanks. What about glass?"
  fa.a1.unit43.lesson04.teach.dialogue_line4:
    title: "Sara: You put glass inside the blue bin too."
    gloss: "You put glass inside the blue bin too."
  fa.a1.unit43.lesson04.teach.dialogue_line5:
    title: "Nima: When is collection day?"
    gloss: "When is collection day?"
  fa.a1.unit43.lesson04.teach.dialogue_line6:
    title: "Sara: It's Saturday."
    gloss: "It's Saturday."
  fa.a1.unit43.lesson04.teach.dialogue_line7:
    title: "Nima: Thanks, goodbye!"
    gloss: "Thanks, goodbye!"

  fa.a1.unit43.lesson05.teach.reading_text:
    title: "Reading: a waste-sorting notice"
    gloss: "Trash: green bin. Recycling: blue bin. Collection day: Saturday."
    note: "A short household notice naming which bin each waste type goes in and the collection day."

  fa.a1.unit43.lesson06.teach.review_kodum_satl_question:
    title: "Which bin do I put the paper in? You put it inside the blue bin."
    gloss: "Which bin do I put the paper in? You put it inside the blue bin."
    note: "A full review sentence pair reusing only already-known words from this unit."
  fa.a1.unit43.lesson06.teach.review_jamavari_shanbe:
    title: "When is collection day? It's Saturday."
    gloss: "When is collection day? It's Saturday."
  fa.a1.unit43.lesson06.teach.summary_words:
    title: "Trash / bin / paper / plastic / glass / recycling"
    gloss: "trash / bin / paper / plastic / glass / recycling"
    note: "These are the key words taught in this unit."

exercises:
  fa.a1.unit43.lesson01.exercise01.recognize_zabale:
    instruction: "What does this word mean?"
    correct_option: trash
    distractors: [bin, paper, glass]
    accepted_answers: [{value: trash, status: correct}]
    feedback: "زباله means trash."
  fa.a1.unit43.lesson01.exercise02.recognize_satl:
    instruction: "What does this word mean?"
    correct_option: bin
    distractors: [trash, paper, plastic]
    accepted_answers: [{value: bin, status: correct}]
    feedback: "سطل means bin."
  fa.a1.unit43.lesson01.exercise03.match_waste_one:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {زباله: trash, سطل: bin, "سطل زباله": "trash bin", کجاست: "where is", باید: "must / need to", "می‌کنم": "I do"}
        status: correct
    feedback: "These are the first new waste-sorting words for this unit."
  fa.a1.unit43.lesson01.exercise04.word_order_satl_zabale_kojast:
    instruction: "Put the words in order."
    accepted_answers: [{value: ["سطل", زباله, کجاست], status: correct}]
    feedback: "سطل زباله کجاست؟ means 'Where is the trash bin?'"
  fa.a1.unit43.lesson01.exercise05.translate_satl_kojast:
    instruction: "Translate into English: سطل کجاست؟"
    answer_language_code: en
    accepted_answers:
      - {value: "Where is the bin?", status: correct}
      - {value: "Where is the bin", status: correct}
      - {value: "Where's the bin?", status: correct}
    feedback: "سطل کجاست؟ means 'Where is the bin?'"

  fa.a1.unit43.lesson02.exercise01.recognize_kaghaz:
    instruction: "What does this word mean?"
    correct_option: paper
    distractors: [plastic, glass, recycling]
    accepted_answers: [{value: paper, status: correct}]
    feedback: "کاغذ means paper."
  fa.a1.unit43.lesson02.exercise02.recognize_bazyaft:
    instruction: "What does this word mean?"
    correct_option: recycling
    distractors: [trash, bin, glass]
    accepted_answers: [{value: recycling, status: correct}]
    feedback: "بازیافت means recycling."
  fa.a1.unit43.lesson02.exercise03.match_waste_two:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {کاغذ: paper, پلاستیک: plastic, شیشه: glass, بازیافت: recycling, رنگ: color, آبی: blue, سبز: green}
        status: correct
    feedback: "These words let you name sortable materials and colors."
  fa.a1.unit43.lesson02.exercise04.word_order_kaghaz_baraye_bazyaft:
    instruction: "Put the words in order."
    accepted_answers: [{value: [کاغذ, برای, "بازیافته"], status: correct}]
    feedback: "کاغذ برای بازیافته means 'Paper is for recycling.'"
  fa.a1.unit43.lesson02.exercise05.translate_in_pelastike:
    instruction: "Translate into English: این پلاستیکه."
    answer_language_code: en
    accepted_answers:
      - {value: "This is plastic.", status: correct}
      - {value: "This is plastic", status: correct}
    feedback: "این پلاستیکه means 'This is plastic.'"

  fa.a1.unit43.lesson03.exercise01.recognize_mindazam:
    instruction: "What does this sentence mean?"
    correct_option: "I put the paper inside the bin."
    distractors: ["I want the paper.", "The bin is inside.", "I don't have paper."]
    accepted_answers: [{value: "I put the paper inside the bin.", status: correct}]
    feedback: "کاغذ رو داخل سطل می‌ندازم means 'I put the paper inside the bin.'"
  fa.a1.unit43.lesson03.exercise02.recognize_kodum_satl_question:
    instruction: "What does this phrase mean?"
    correct_option: "Which bin do I put the paper in?"
    distractors: ["Where is the paper?", "Which bin is empty?", "Do you have paper?"]
    accepted_answers: [{value: "Which bin do I put the paper in?", status: correct}]
    feedback: "کاغذ رو کدوم سطل می‌ندازم؟ means 'Which bin do I put the paper in?'"
  fa.a1.unit43.lesson03.exercise03.match_which_bin:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {کدوم: which, داخل: inside, برای: for, "می‌ندازم": "I put / I throw", "می‌ندازی": "you put / you throw", "کاغذ رو کدوم سطل می‌ندازم؟": "Which bin do I put the paper in?", "داخل سطل آبی می‌ندازی.": "You put it inside the blue bin."}
        status: correct
    feedback: "These words let you ask and say which bin something goes in."
  fa.a1.unit43.lesson03.exercise04.word_order_kaghaz_kodum_satl:
    instruction: "Put the words in order."
    accepted_answers: [{value: [کاغذ, رو, کدوم, "سطل", "می‌ندازم"], status: correct}]
    feedback: "کاغذ رو کدوم سطل می‌ندازم؟ means 'Which bin do I put the paper in?'"
  fa.a1.unit43.lesson03.exercise05.translate_dakhel_satl_abi:
    instruction: "Translate into English: داخل سطل آبی می‌ندازی."
    answer_language_code: en
    accepted_answers:
      - {value: "You put it inside the blue bin.", status: correct}
      - {value: "You put it inside the blue bin", status: correct}
      - {value: "You throw it inside the blue bin.", status: correct}
    feedback: "داخل سطل آبی می‌ندازی means 'You put it inside the blue bin.'"

  fa.a1.unit43.lesson04.exercise01.dialogue_comprehension_which_bin:
    instruction: "Nima asks Sara something. What does he want to know?"
    correct_option: "He wants to know which bin paper goes in."
    distractors:
      - "He wants to know which bin plastic goes in."
      - "He wants to know where the recycling bin is."
      - "He wants to know when the library is open."
    accepted_answers: [{value: "He wants to know which bin paper goes in.", status: correct}]
    feedback: "سلام سارا، کاغذ رو کدوم سطل می‌ندازم؟ means 'Hi Sara, which bin do I put paper in?'"
  fa.a1.unit43.lesson04.exercise02.recognize_dialogue_line4:
    instruction: "What does this sentence mean?"
    correct_option: "You put glass inside the blue bin too."
    distractors:
      - "You put paper inside the green bin."
      - "You put glass inside the green bin."
      - "You throw away the blue bin."
    accepted_answers: [{value: "You put glass inside the blue bin too.", status: correct}]
    feedback: "شیشه هم داخل سطل آبی می‌ندازی means 'You put glass inside the blue bin too.'"
  fa.a1.unit43.lesson04.exercise03.match_dialogue_waste:
    instruction: "Match each line with its meaning."
    accepted_answers:
      - value: {"سلام سارا، کاغذ رو کدوم سطل می‌ندازم؟": "Hi Sara, which bin do I put paper in?", "داخل سطل آبیه. برای بازیافته.": "It's inside the blue bin. It's for recycling.", "باشه، ممنون. شیشه چی؟": "Okay, thanks. What about glass?", "شیشه هم داخل سطل آبی می‌ندازی.": "You put glass inside the blue bin too.", "روز جمع‌آوری کیه؟": "When is collection day?", "شنبه‌ست.": "It's Saturday.", خداحافظ: goodbye}
        status: correct
    feedback: "These lines appear in the waste-sorting conversation between Nima and Sara."
  fa.a1.unit43.lesson04.exercise04.dialogue_response_collection_day:
    instruction: "Respond to روز جمع‌آوری کیه؟ by saying it's Saturday."
    accepted_answers:
      - {value: "شنبه‌ست.", status: correct}
      - {value: "شنبه‌ست", status: correct}
    feedback: "شنبه‌ست means 'It's Saturday.'"
  fa.a1.unit43.lesson04.exercise05.translate_dakhel_satl_abiye:
    instruction: "Translate into English: داخل سطل آبیه. برای بازیافته."
    answer_language_code: en
    accepted_answers:
      - {value: "It's inside the blue bin. It's for recycling.", status: correct}
      - {value: "It's inside the blue bin, it's for recycling.", status: correct}
      - {value: "It's inside the blue bin, and it's for recycling.", status: correct}
      - {value: "It's in the blue bin. It's for recycling.", status: correct}
      - {value: "It's in the blue bin, for recycling.", status: correct}
    feedback: "داخل سطل آبیه. برای بازیافته. means 'It's inside the blue bin. It's for recycling.'"

  fa.a1.unit43.lesson05.exercise01.reading_comprehension_which_bin_trash:
    instruction: "According to the note, which bin is for regular trash?"
    correct_option: "The green bin."
    distractors:
      - "The blue bin."
      - "The white bin."
      - "The black bin."
    accepted_answers: [{value: "The green bin.", status: correct}]
    feedback: "زباله: سطل سبز means regular trash goes in the green bin."
  fa.a1.unit43.lesson05.exercise02.reading_comprehension_collection_day:
    instruction: "According to the note, what day is collection?"
    correct_option: "Saturday."
    distractors:
      - "Friday."
      - "Sunday."
      - "Monday."
    accepted_answers: [{value: "Saturday.", status: correct}]
    feedback: "روز جمع‌آوری: شنبه means collection day is Saturday."
  fa.a1.unit43.lesson05.exercise03.match_reading_waste:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {زباله: trash, "سطل سبز": "green bin", بازیافت: recycling, "سطل آبی": "blue bin", "جمع‌آوری": collection, شنبه: Saturday}
        status: correct
    feedback: "These words let you understand the waste-sorting notice."
  fa.a1.unit43.lesson05.exercise04.translate_reading_text:
    instruction: "Translate into English: زباله: سطل سبز. بازیافت: سطل آبی. روز جمع‌آوری: شنبه."
    answer_language_code: en
    accepted_answers:
      - {value: "Trash: green bin. Recycling: blue bin. Collection day: Saturday.", status: correct}
      - {value: "Trash: the green bin. Recycling: the blue bin. Collection day: Saturday.", status: correct}
