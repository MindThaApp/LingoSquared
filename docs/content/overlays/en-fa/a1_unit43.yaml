    vocabulary. Reuse chain: کجاست (unit05), رو/می‌کنم/باید (unit32), رنگ/
    آبی/سبز (units20/25/37), کدوم (units10/14/28/38/41), داخل (unit02,
    "بفرمایید داخل," please come in -- same "inside" sense reused here, not
    flagged as new polysemy), برای (unit34), سلام/ممنون (units01/17/22),
    باشه (units01/02/06/17/22), چی (unit32), کی (units16/32/34), خداحافظ
    (unit01/05/16), روز/شنبه (unit10), این (unit08), هم (unit01). New
    vocabulary genuinely introduced for the first time in the whole corpus:
    زباله (trash/garbage), سطل (bin/bucket), کاغذ (paper), پلاستیک
    (plastic), شیشه (glass), بازیافت (recycling), جمع‌آوری (collection),
    and می‌ندازم/می‌ندازی (I put-throw / you put-throw, from انداختن --
