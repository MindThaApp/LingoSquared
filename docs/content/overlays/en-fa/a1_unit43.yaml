    Register note: نیما and سارا (the established friend pair, reused from
    unit37's own color dialogue) stay in the informal register already
    established for their exchanges. Facts (recycling -> blue bin, plain
    trash -> green bin, collection day -> Saturday) are kept identical
    across the dialogue, the reading confirmation note, and every exercise
    that references them, per AUTHORING_GUIDE.md #11. Every "Translate into
    English" exercise below explicitly sets answer_language_code: en. The
