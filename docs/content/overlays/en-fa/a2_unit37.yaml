teaching:
  fa.a2.unit37.lesson01.teach.weather_words:
    title: Weather words
    gloss: weather, rain, snow, sunny, cold, warm, tomorrow, today
    note: '*بارون* is the ordinary spoken form of “rain”; careful writing uses *باران*. Spoken *آفتابیه*, *سرده*, and *گرمه* end in *-ه* for “is.”'
    example_gloss: ['Tomorrow it is sunny.', 'Today the weather is cold.', 'The weather is warm.']
  fa.a2.unit37.lesson01.teach.plan_words:
    title: Places and plan verbs
    gloss: park, home, market, cinema, outside, in, we go, we do not go, we stay
    note: 'The present tense is used for plans: *می‌ریم* is “we go” or “we are going,” and *نمی‌ریم* is “we are not going.”'
    example_gloss: ['Tomorrow we are going to the park.', 'We stay at home.', 'Today we are not going out.']
  fa.a2.unit37.lesson01.teach.if_words:
    title: اگه and the condition verbs
    gloss: if, it comes (rain comes), it is, it comes (present)
    note: '*اگه* is the spoken form of *اگر* (“if”). *بارون بیاد* literally says “rain come,” which is how Persian says “it rains.”'
    example_gloss: ['If it snows, we are not going outside.', 'If the weather is cold, we are not going to the park.']
  fa.a2.unit37.lesson01.teach.subjunctive_condition:
    title: اگه plus the subjunctive
    gloss: If it rains, we are not going to the park.
    note: 'For a possible condition, put the verb after *اگه* in the subjunctive: *بیاد*, *باشه*. The result is in the ordinary present: *نمی‌ریم*. Put a comma between the two halves.'
  fa.a2.unit37.lesson01.teach.present_condition:
    title: اگه plus the present
    gloss: If it rains tomorrow, we will stay at home.
    note: 'You will also hear the present tense after *اگه*: *اگه بارون میاد*. It means the same real condition. In this unit you will produce the subjunctive form (*بیاد*); the present form is for recognizing what you hear.'
  fa.a2.unit37.lesson02.teach.time_tired:
    title: Time, tired, work
    gloss: time, tired, work, I, we
    note: '*وقت دارم* means “I have time.” It does not mean the clock time.'
    example_gloss: ['Tomorrow I have time.', 'Today I do not have time.', 'Today we have work.']
  fa.a2.unit37.lesson02.teach.come_forms:
    title: Come and have-time forms
    gloss: I come, you come, I am not coming, I have (subjunctive), you have (subjunctive), we are
    note: '*میام* is spoken “I come / I will come.” In a condition use *داشته باشم*, *داشته باشی*, *خسته باشیم*: these are the subjunctive forms.'
    example_gloss: ['Are you coming tomorrow?', 'I am not coming today.']
  fa.a2.unit37.lesson02.teach.person_endings:
    title: Match the ending to the person
    gloss: I have, you have, he or she has, we have
    note: 'The ending after *داشته* changes with the person: *باشم* (I), *باشی* (you), *باشه* (he/she), *باشیم* (we). Persian usually leaves out the pronoun because the ending shows the person.'
  fa.a2.unit37.lesson02.teach.result_tense:
    title: The result is in the present
    gloss: If I have time, I will come.
    note: 'Persian does not need a separate future form here. The present tense in the result, *میام*, already means “I will come.”'
  fa.a2.unit37.lesson03.teach.time_clause_words:
    title: When, arrive, work is done, shop
    gloss: when, I arrive, my work, finished, becomes, shop, open, to, I will call you
    note: '*وقتی* means “when.” *کارم تموم بشه* is “my work gets finished.” *بهت زنگ می‌زنم* is “I will call you.”'
    example_gloss: ['When my work is finished, I will come.', 'Tomorrow I will call you.']
  fa.a2.unit37.lesson03.teach.negative_forms:
    title: Negative condition forms and go/stay
    gloss: you do not come, it does not come, it is not, I do not have, alone, I go, I stay
    note: 'Put *نـ* on the subjunctive verb to make the condition negative: *نیای*, *نیاد*, *نباشه*, *نداشته باشم*.'
    example_gloss: ['I am going alone.', 'Today I am staying at home.']
  fa.a2.unit37.lesson03.teach.negative_condition:
    title: A negative condition
    gloss: If you do not come, I will go alone. If it does not rain, we will go to the park.
    note: 'A negative condition is still a possible condition. Make the subjunctive verb negative with *نـ*: *اگه نیای*, *اگه بارون نیاد*. The result can be positive or negative.'
  fa.a2.unit37.lesson03.teach.if_vs_when:
    title: اگه is maybe, وقتی is for sure
    gloss: When my work is finished, I will come. If I have time, I will come.
    note: 'Use *وقتی* when the event will certainly happen and you only say when. Use *اگه* when it might not happen. Both can be followed by a subjunctive verb and a present result.'
  fa.a2.unit37.lesson04.teach.shop_words:
    title: Shop words
    gloss: receipt, money, goods, faulty, discount, this, you have, it is open
    note: '*جنس* means the goods or item you buy. *رسید دارید؟* is a polite question to a customer.'
    example_gloss: ['This item is faulty.', 'Do you have the receipt?', 'The shop is open today.']
  fa.a2.unit37.lesson04.teach.policy_verbs:
    title: Shop-rule verbs
    gloss: we will exchange it, we give back, you buy, you get, you have, your money
    note: 'Shop staff speak to customers with polite *شما* endings: *داشته باشید*, *بخرید*, *می‌گیرید*, and *-تون* in *پولتون*. *رو* follows a definite object.'
    example_gloss: ['We exchange this item.', 'Today you get a discount.']
  fa.a2.unit37.lesson04.teach.shop_pattern:
    title: A shop rule with اگه
    gloss: If you have the receipt, we will give your money back.
    note: 'A shop rule has the same shape as a plan: *اگه* plus a subjunctive condition, then a present result. With customers use the polite endings *-ید* and *-تون*.'
  fa.a2.unit37.lesson04.teach.what_if_phrase:
    title: What if...?
    gloss: What if it rains? What if I do not have the receipt?
    note: 'Add *چی؟* after the condition to ask “what if...?”.'
  fa.a2.unit37.lesson04.teach.what_if_question:
    title: اگه ... چی؟
    gloss: What if it rains?
    note: 'The condition keeps its subjunctive verb and *چی؟* comes last, with no result clause. The other person answers with the result: *اگه بارون بیاد، می‌ریم سینما.*'
  fa.a2.unit37.lesson05.teach.reading_words:
    title: Message and notice words
    gloss: hello, good, come (command), you cannot, to come, to me, call (command), notice
    note: '*بیا* and *بزن* are friendly commands. *بهم زنگ بزن* means “call me.”'
    example_gloss: ['Hello! The weather is good.', 'If you cannot come, call me.']
  fa.a2.unit37.lesson05.teach.message:
    title: A message about tomorrow
    gloss: Hello Nima! Tomorrow, if the weather is sunny, we are going to the park. If it rains, we are going to the cinema. If you have time, come. If you cannot come, call me.
    note: Read for each condition and its result.
  fa.a2.unit37.lesson05.teach.notice:
    title: A shop notice
    gloss: 'Shop notice: If the item is faulty, we will exchange it. If you have the receipt, we will give your money back. If you do not have the receipt, we do not give money back. If you buy today, you get a discount.'
    note: Each sentence is one rule with a condition and a result.
  fa.a2.unit37.lesson06.teach.dialogue_words:
    title: Yes, good, after that
    gloss: yes, good, after that
    note: '*آره* is the usual spoken “yes.” *بعدش* means “after that.”'
    example_gloss: ['Yes, we are going tomorrow.', 'Good! After that we are going to the market.']
  fa.a2.unit37.lesson06.teach.turn01: {title: Sara suggests the park, gloss: 'Sara asks: Nima, are we going to the park tomorrow?', note: A present-tense question can ask about a plan.}
  fa.a2.unit37.lesson06.teach.turn02: {title: Nima states a condition, gloss: 'Nima answers: Yes, if it does not rain.', note: 'A negative condition can be the whole answer: *اگه بارون نیاد، آره.*'}
  fa.a2.unit37.lesson06.teach.turn03: {title: Sara asks what if, gloss: 'Sara asks: What if it rains?', note: '*اگه ... چی؟* asks about the other possibility.'}
  fa.a2.unit37.lesson06.teach.turn04: {title: Nima gives the other plan, gloss: 'Nima answers: If it rains, we will go to the cinema.', note: The answer is a condition plus a present result.}
  fa.a2.unit37.lesson06.teach.turn05: {title: Sara adds a second plan, gloss: 'Sara says: Good. If you have time, after that we will go to the market.', note: The second plan depends on a new condition.}
  fa.a2.unit37.lesson06.teach.turn06: {title: Nima separates if and when, gloss: 'Nima says: If I have time, I will come. When my work is finished, I will call you.', note: '*اگه* is a possibility; *وقتی* is something that will happen.'}
exercises:
  fa.a2.unit37.lesson01.exercise01.recognize_rain_condition:
    instruction: What does this sentence mean?
    correct_option: If it rains, we are not going to the park.
    distractors: ['When it rains, we always go to the park.', 'It is raining, so we are going to the park.', 'Whether it rains or not, we are going to the park.']
    accepted_answers: [{value: 'If it rains, we are not going to the park.', status: correct}]
    feedback: '*اگه بارون بیاد* is the condition “if it rains”; *نمی‌ریم پارک* is the result.'
  fa.a2.unit37.lesson01.exercise02.recognize_present_condition:
    instruction: What does this sentence mean? It uses the present tense after اگه.
    correct_option: If it rains tomorrow, we will stay at home.
    distractors: ['If it rained yesterday, we stayed at home.', 'It will rain tomorrow, and we will go out.', 'If we stay at home, it will rain.']
    accepted_answers: [{value: 'If it rains tomorrow, we will stay at home.', status: correct}]
    feedback: '*اگه بارون میاد* is the present-tense way to say the same real condition.'
  fa.a2.unit37.lesson01.exercise03.match_weather_plan_words:
    instruction: Match each Farsi word with its meaning.
    accepted_answers:
    - value: {بارون: rain, برف: snow, آفتابی: sunny, سرد: cold, گرم: warm, پارک: park, خونه: home, بیرون: outside, سینما: cinema, فردا: tomorrow}
      status: correct
    feedback: These are the weather and place words for making plans.
  fa.a2.unit37.lesson01.exercise04.order_snow_home:
    instruction: 'Arrange the words to say: If it snows, we stay at home.'
    accepted_answers:
    - {value: [اگه, برف, بیاد, تو, خونه, می‌مونیم], status: correct}
    - {value: [تو, خونه, می‌مونیم, اگه, برف, بیاد], status: correct}
    feedback: '*اگه برف بیاد، تو خونه می‌مونیم*: the condition comes first and the result second; the order can also be reversed.'
  fa.a2.unit37.lesson01.exercise05.fill_rain_verb:
    instruction: 'Complete the condition with the subjunctive verb for “it rains” (3rd person): If it rains, we stay at home.'
    accepted_answers: [{value: بیاد, status: correct}]
    feedback: The full sentence is *اگه بارون بیاد، تو خونه می‌مونیم*.
  fa.a2.unit37.lesson01.exercise06.translate_warm_outside:
    instruction: 'Translate using اگه and باشه: If the weather is warm, we are going outside.'
    accepted_answers:
    - {value: 'اگه هوا گرم باشه، می‌ریم بیرون', status: correct}
    - {value: اگه هوا گرم باشه می‌ریم بیرون, status: correct}
    - {value: می‌ریم بیرون اگه هوا گرم باشه, status: acceptable_with_note, note: 'The result can come first, but the usual order puts the condition first.'}
    feedback: 'Model: *اگه هوا گرم باشه، می‌ریم بیرون.*'
  fa.a2.unit37.lesson02.exercise01.recognize_time_condition:
    instruction: What does this sentence mean?
    correct_option: If I have time, I will come.
    distractors: ['If you have time, I will come.', 'I have time, so I came.', 'If I come, I will have time.']
    accepted_answers: [{value: 'If I have time, I will come.', status: correct}]
    feedback: '*باشم* is the “I” ending, and *میام* is the present result “I will come.”'
  fa.a2.unit37.lesson02.exercise02.recognize_tired_condition:
    instruction: What does this sentence mean?
    correct_option: If you are tired, we are not going out.
    distractors: ['If I am tired, we are not going out.', 'If we are tired, you are not going out.', 'You are tired, so we went out.']
    accepted_answers: [{value: 'If you are tired, we are not going out.', status: correct}]
    feedback: '*باشی* is the “you” ending in the condition.'
  fa.a2.unit37.lesson02.exercise03.match_condition_halves:
    instruction: Match each condition with its exact meaning.
    accepted_answers:
    - value: {اگه وقت داشته باشم: if I have time, اگه وقت داشته باشی: if you have time, اگه خسته باشیم: if we are tired, اگه خسته باشه: if he or she is tired, اگه بارون بیاد: if it rains, اگه برف بیاد: if it snows, اگه هوا سرد باشه: if the weather is cold, اگه هوا گرم باشه: if the weather is warm}
      status: correct
    feedback: The ending on the condition verb shows who or what the condition is about.
  fa.a2.unit37.lesson02.exercise04.order_time_come:
    instruction: 'Arrange the words to say: If I have time, I will come.'
    accepted_answers:
    - {value: [اگه, وقت, داشته, باشم, میام], status: correct}
    - {value: [میام, اگه, وقت, داشته, باشم], status: correct}
    feedback: '*اگه وقت داشته باشم، میام* is the taught model.'
  fa.a2.unit37.lesson02.exercise05.fill_i_ending:
    instruction: 'Complete the condition with the “I” ending: If I have time tomorrow, I will come.'
    accepted_answers: [{value: باشم, status: correct}]
    feedback: The full sentence is *اگه فردا وقت داشته باشم، میام*.
  fa.a2.unit37.lesson02.exercise06.translate_tired_not_come:
    instruction: 'Translate using اگه and the “I” ending باشم: If I am tired, I will not come.'
    accepted_answers:
    - {value: 'اگه خسته باشم، نمیام', status: correct}
    - {value: اگه خسته باشم نمیام, status: correct}
    - {value: نمیام اگه خسته باشم, status: acceptable_with_note, note: 'The result can come first, but the usual order puts the condition first.'}
    feedback: 'Model: *اگه خسته باشم، نمیام.*'
  fa.a2.unit37.lesson03.exercise01.recognize_negative_rain:
    instruction: What does this negative condition mean?
    correct_option: If it does not rain, we will go to the park.
    distractors: ['If it rains, we will go to the park.', 'It did not rain, so we went to the park.', 'If it rains, we will not go to the park.']
    accepted_answers: [{value: 'If it does not rain, we will go to the park.', status: correct}]
    feedback: '*بارون نیاد* is the negative condition “it does not rain.”'
  fa.a2.unit37.lesson03.exercise02.choose_when_or_if:
    instruction: 'Nima is certain his work will be finished tonight; only the time is open. Which word fits the gap: “___ my work is finished, I will come”?'
    correct_option: وقتی
    distractors: [اگه, ولی, چون]
    accepted_answers: [{value: وقتی, status: correct}]
    feedback: '*وقتی* is for something that will certainly happen. *اگه* would mean it might not.'
  fa.a2.unit37.lesson03.exercise03.match_if_when_clauses:
    instruction: Match each clause with its meaning.
    accepted_answers:
    - value: {وقتی برسم: when I arrive, اگه برسم: if I arrive, وقتی کارم تموم بشه: when my work is finished, اگه کارم تموم بشه: if my work gets finished, وقتی فروشگاه باز بشه: when the shop opens, اگه فروشگاه باز باشه: if the shop is open}
      status: correct
    feedback: '*وقتی* is sure timing; *اگه* is a possibility.'
  fa.a2.unit37.lesson03.exercise04.order_when_home_call:
    instruction: 'Arrange the words to say: When I get home, I will call you.'
    accepted_answers:
    - {value: [وقتی, به, خونه, برسم, بهت, زنگ, می‌زنم], status: correct}
    - {value: [بهت, زنگ, می‌زنم, وقتی, به, خونه, برسم], status: correct}
    feedback: '*وقتی به خونه برسم، بهت زنگ می‌زنم*: the time clause uses a subjunctive verb and the result is in the present.'
  fa.a2.unit37.lesson03.exercise05.fill_negative_come:
    instruction: 'Complete the negative condition with the “you” form: If you do not come, I will go alone.'
    accepted_answers: [{value: نیای, status: correct}]
    feedback: The full sentence is *اگه تو نیای، من تنها می‌رم*.
  fa.a2.unit37.lesson03.exercise06.translate_no_time:
    instruction: 'Translate using اگه and نداشته باشم: If I do not have time, I will not come.'
    accepted_answers:
    - {value: 'اگه وقت نداشته باشم، نمیام', status: correct}
    - {value: اگه وقت نداشته باشم نمیام, status: correct}
    - {value: نمیام اگه وقت نداشته باشم, status: acceptable_with_note, note: 'The result can come first, but the usual order puts the condition first.'}
    feedback: 'Model: *اگه وقت نداشته باشم، نمیام.*'
  fa.a2.unit37.lesson04.exercise01.recognize_refund_rule:
    instruction: What does this shop rule mean?
    correct_option: If you have the receipt, we will give your money back.
    distractors: ['If you give back the money, we will have the receipt.', 'If you do not have the receipt, we will give your money back.', 'We gave your money back because you had the receipt.']
    accepted_answers: [{value: 'If you have the receipt, we will give your money back.', status: correct}]
    feedback: '*رسید داشته باشید* is the condition, and *پولتون رو پس می‌دیم* is the result.'
  fa.a2.unit37.lesson04.exercise02.recognize_what_if_receipt:
    instruction: What does this question mean?
    correct_option: What if I do not have the receipt?
    distractors: ['Where is the receipt?', 'Do you have the receipt?', 'Why do I not have the receipt?']
    accepted_answers: [{value: 'What if I do not have the receipt?', status: correct}]
    feedback: '*اگه ... چی؟* asks “what if...?”'
  fa.a2.unit37.lesson04.exercise03.match_shop_words:
    instruction: Match each shop word with its meaning.
    accepted_answers:
    - value: {فروشگاه: shop, رسید: receipt, پول: money, جنس: goods or item, خراب: faulty, تخفیف: discount, عوضش می‌کنیم: we will exchange it, پس می‌دیم: we will give back}
      status: correct
    feedback: These words appear in shop rules.
  fa.a2.unit37.lesson04.exercise04.order_faulty_exchange:
    instruction: 'Arrange the words to say: If the item is faulty, we will exchange it.'
    accepted_answers:
    - {value: [اگه, جنس, خراب, باشه, عوضش, می‌کنیم], status: correct}
    - {value: [عوضش, می‌کنیم, اگه, جنس, خراب, باشه], status: correct}
    feedback: '*اگه جنس خراب باشه، عوضش می‌کنیم* is a shop-rule model.'
  fa.a2.unit37.lesson04.exercise05.ask_what_if_rain:
    instruction: 'Sara says tomorrow you are going to the park. Reply in Farsi with the question form اگه ... چی؟: What if it rains?'
    accepted_answers:
    - {value: 'اگه بارون بیاد چی؟', status: correct}
    - {value: اگه بارون بیاد چی, status: correct}
    - {value: 'اگه بارون بیاد، چی؟', status: correct}
    feedback: 'Model: *اگه بارون بیاد چی؟*'
  fa.a2.unit37.lesson04.exercise06.write_discount_rule:
    instruction: 'Write the shop rule in Farsi with اگه and the polite شما forms بخرید and می‌گیرید: If you buy today, you get a discount.'
    accepted_answers:
    - {value: 'اگه امروز بخرید، تخفیف می‌گیرید', status: correct}
    - {value: اگه امروز بخرید تخفیف می‌گیرید, status: correct}
    - {value: 'امروز اگه بخرید، تخفیف می‌گیرید', status: acceptable_with_note, note: 'امروز can come before اگه; the taught order puts اگه first.'}
    - {value: تخفیف می‌گیرید اگه امروز بخرید, status: acceptable_with_note, note: 'The result can come first, but the usual order puts the condition first.'}
    feedback: 'Model: *اگه امروز بخرید، تخفیف می‌گیرید.*'
  fa.a2.unit37.lesson05.exercise01.read_message_rain:
    instruction: According to the message, what do Sara and Nima do if it rains tomorrow?
    correct_option: They go to the cinema.
    distractors: ['They go to the park.', 'They stay at home.', 'They call each other.']
    accepted_answers: [{value: They go to the cinema., status: correct}]
    feedback: The message says *اگه بارون بیاد، می‌ریم سینما*.
  fa.a2.unit37.lesson05.exercise02.read_notice_no_receipt:
    instruction: According to the notice, what happens if you do not have the receipt?
    correct_option: The shop does not give your money back.
    distractors: ['The shop gives your money back.', 'The shop gives you a discount.', 'The shop closes.']
    accepted_answers: [{value: The shop does not give your money back., status: correct}]
    feedback: The notice says *اگه رسید نداشته باشید، پول پس نمی‌دیم*.
  fa.a2.unit37.lesson05.exercise03.match_condition_result:
    instruction: Match each condition from the message and the notice with its result.
    accepted_answers:
