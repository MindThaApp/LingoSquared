course:
  title: Farsi A2
  description: >-
    Lower-intermediate Iranian Farsi: returning a defective purchase --
    explaining what's wrong, reading a store's return-policy notice, and
    choosing between an exchange and a refund.

units:
  fa.a2.unit18.shopping_complaint:
    title: A shopping complaint

lessons:
  fa.a2.unit18.lesson01.shopping_complaint_vocabulary: {title: "Returning an item: words"}
  fa.a2.unit18.lesson02.explaining_the_problem: {title: "Explaining the problem"}
  fa.a2.unit18.lesson03.reading_a_return_policy: {title: "Reading a return policy"}
  fa.a2.unit18.lesson04.shop_return_counter_dialogue: {title: "At the returns counter"}

teaching:
  fa.a2.unit18.lesson01.teach.broken_word:
    title: "Broken"
    gloss: "broken"
    note: "*خراب* is the general word for broken or defective; *خرابه* is its colloquial spoken form (خراب + است)."
    example_gloss: "These headphones are broken."
  fa.a2.unit18.lesson01.teach.receipt_word:
    title: "Receipt"
    gloss: "receipt"
    note: "*رسید* is the word for a purchase receipt."
    example_gloss: "I lost my receipt."
  fa.a2.unit18.lesson01.teach.return_item_note:
    title: "To return an item (light verb)"
    gloss: "to return (an item)"
    note: "*پس دادن* literally means 'back give' -- another light-verb construction, like *باز کردن* from the earlier banking unit."
  fa.a2.unit18.lesson01.teach.exchange_word:
    title: "Exchange"
    gloss: "exchange"
    note: "*تعویض* is the word for an exchange; *تعویض کردن* (to exchange) is the light-verb form."
    example_gloss: "I want to exchange this item."
  fa.a2.unit18.lesson01.teach.refund_word:
    title: "Refund"
    gloss: "refund"
    note: "*بازپرداخت* is the standard word for a monetary refund."
    example_gloss: "The refund takes two days."
  fa.a2.unit18.lesson01.teach.deadline_word:
    title: "Deadline / window"
    gloss: "deadline / window"
    note: "*مهلت* is the general word for a deadline or allowed time window."
    example_gloss: "The return window is seven days."
  fa.a2.unit18.lesson01.teach.recap_headphones:
    title: "I bought these headphones"
    gloss: "I bought these headphones"
    note: "Recap phrase introducing *هدفون* (headphones), the item this unit's scenario is built around."

  fa.a2.unit18.lesson02.teach.no_sound_word:
    title: "Has no sound"
    gloss: "has no sound"
    note: "*صدا نداره* (literally 'sound doesn't have') describes a device with no audio output."
    example_gloss: "These headphones have no sound."
  fa.a2.unit18.lesson02.teach.i_want_to_exchange_or_refund:
    title: "I want to exchange this or get my money back"
    gloss: "I want to exchange these headphones or get my money back."
    note: "*یا* (or) offers the shop a choice between the two remedies this outcome covers."
  fa.a2.unit18.lesson02.teach.full_complaint_sentence:
    title: "State the problem and your request together"
    gloss: "I bought these headphones but they have no sound. I want to exchange them or get my money back."
    note: "The full complaint pattern this lesson is built around: state the problem, then the request."

  fa.a2.unit18.lesson03.teach.purchase_date_word:
    title: "Purchase date"
    gloss: "purchase date"
    note: "*تاریخ خرید* is the standard phrase for the date something was bought."
    example_gloss: "The purchase date is on the receipt."
  fa.a2.unit18.lesson03.teach.policy_notice_text:
    title: "A store's return-policy notice"
    gloss: "Return window for goods: seven days from the purchase date, with a receipt."
    note: "A short official store notice, the written register this lesson is teaching."

  fa.a2.unit18.lesson04.teach.please_word:
    title: "Please"
    gloss: "please"
    note: "*لطفاً* is a polite word placed at the end of a request."
    example_gloss: "Exchange it, please."
  fa.a2.unit18.lesson04.teach.turn01:
    title: "نیما states the problem"
    gloss: "نیما politely says he bought these headphones but they have no sound."
    note: "Combines lesson01's recap phrase with lesson02's *صدا نداره*."
  fa.a2.unit18.lesson04.teach.turn02:
    title: "فروشنده asks for the receipt and date"
    gloss: "The employee asks if he has the receipt, and what day he bought it."
    note: "*خریدینش* is the formal-polite past tense of 'you bought it'."
  fa.a2.unit18.lesson04.teach.turn03:
    title: "نیما confirms and gives the date"
    gloss: "نیما says yes, here you go -- he bought it three days ago."
    note: "*بفرمایید* here means 'here you go' while handing something over."
  fa.a2.unit18.lesson04.teach.turn04:
    title: "فروشنده confirms he's within the window and offers a choice"
    gloss: "The employee says no problem, he's within the seven-day window -- do they want to exchange it or refund the money?"
    note: "*تو مهلت هفت روزه هستید* (you're within the seven-day window) confirms he qualifies."
  fa.a2.unit18.lesson04.teach.turn05:
    title: "نیما requests the exchange"
    gloss: "نیما politely asks for the exchange."
    note: "*کنید* is the polite imperative form of *کردن* (to do)."
  fa.a2.unit18.lesson04.teach.turn06:
    title: "فروشنده completes the exchange"
    gloss: "The employee says okay, they'll give him a new pair of headphones right now."
    note: "*بهتون می‌دم* (I'll give to you) closes the exchange."

exercises:
  fa.a2.unit18.lesson01.exercise01.recognize_broken:
    instruction: "What does this word mean?"
    correct_option: "broken"
    distractors: ["receipt", "exchange", "refund"]
    accepted_answers: [{value: "broken", status: correct}]
    feedback: "*خراب* means broken."
  fa.a2.unit18.lesson01.exercise02.recognize_receipt:
    instruction: "What does this word mean?"
    correct_option: "receipt"
    distractors: ["deadline", "headphones", "broken"]
    accepted_answers: [{value: "receipt", status: correct}]
    feedback: "*رسید* means receipt."
  fa.a2.unit18.lesson01.exercise03.match_return_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {خراب: broken, رسید: receipt, تعویض: exchange, بازپرداخت: refund, مهلت: deadline, هدفون: headphones}, status: correct}
    feedback: "These six words cover this unit's basic returns vocabulary."
  fa.a2.unit18.lesson01.exercise04.order_headphones_broken:
    instruction: "Arrange the words to say: these headphones are broken."
    accepted_answers: [{value: [این, هدفون, خرابه], status: correct}]
    feedback: "*این هدفون خرابه.* states that the headphones are broken."
  fa.a2.unit18.lesson01.exercise05.write_receipt:
    instruction: "Write the Farsi word for receipt."
    accepted_answers:
      - {value: رسید, status: correct}
    feedback: "*رسید* means receipt."

  fa.a2.unit18.lesson02.exercise01.recognize_complaint_sentence:
    instruction: "Which sentence states a problem with a purchased item?"
    correct_option: "I bought these headphones but they have no sound."
    distractors: ["The refund takes two days.", "I lost my receipt.", "The return window is seven days."]
    accepted_answers: [{value: "I bought these headphones but they have no sound.", status: correct}]
    feedback: "*این هدفون رو خریدم ولی صدا نداره.* states the problem clearly."
  fa.a2.unit18.lesson02.exercise02.order_want_exchange_or_refund:
    instruction: "Arrange the words to say: I want to exchange these headphones or get my money back."
    accepted_answers: [{value: [می‌خوام, این, هدفون, رو, تعویض, کنم, یا, پولم, رو, "پس بگیرم"], status: correct}]
    feedback: "*می‌خوام این هدفون رو تعویض کنم یا پولم رو پس بگیرم.* offers the shop the choice."
  fa.a2.unit18.lesson02.exercise03.dialogue_response_state_the_problem:
    instruction: "The employee asks: 'Hi, how can I help you?' Explain that you bought these headphones but they have no sound."
    accepted_answers:
      - {value: "این هدفون رو خریدم ولی صدا نداره.", status: correct}
      - {value: "این هدفون رو خریدم ولی صدا نداره", status: correct}
    feedback: "*این هدفون رو خریدم ولی صدا نداره.* clearly states the problem."
  fa.a2.unit18.lesson02.exercise04.translate_want_exchange_or_refund:
    instruction: "Translate into Farsi: I want to exchange these headphones or get my money back."
    accepted_answers:
      - {value: "می‌خوام این هدفون رو تعویض کنم یا پولم رو پس بگیرم.", status: correct}
      - {value: "می‌خوام این هدفون رو تعویض کنم یا پولم رو پس بگیرم", status: correct}
    feedback: "*می‌خوام این هدفون رو تعویض کنم یا پولم رو پس بگیرم.* is the accepted translation."
  fa.a2.unit18.lesson02.exercise05.write_no_sound:
    instruction: "Write that these headphones have no sound."
    accepted_answers:
      - {value: "این هدفون صدا نداره.", status: correct}
      - {value: "این هدفون صدا نداره", status: correct}
    feedback: "*این هدفون صدا نداره.* describes the problem."

  fa.a2.unit18.lesson03.exercise01.read_return_window:
    instruction: "According to the notice, what is the return window for goods?"
    correct_option: "Seven days from the purchase date."
    distractors: ["Fourteen days from the purchase date.", "Thirty days from the purchase date.", "The notice does not say."]
    accepted_answers: [{value: "Seven days from the purchase date.", status: correct}]
    feedback: "*هفت روز از تاریخ خرید* -- seven days from the purchase date."
  fa.a2.unit18.lesson03.exercise02.read_return_condition:
    instruction: "According to the notice, what do you need to return an item?"
    correct_option: "The receipt."
    distractors: ["The original packaging.", "A photo ID.", "Nothing is needed."]
    accepted_answers: [{value: "The receipt.", status: correct}]
    feedback: "*با رسید* -- with a receipt."
  fa.a2.unit18.lesson03.exercise03.recognize_purchase_date:
    instruction: "What does this phrase mean?"
    correct_option: "purchase date"
    distractors: ["return window", "receipt", "refund"]
    accepted_answers: [{value: "purchase date", status: correct}]
    feedback: "*تاریخ خرید* means purchase date."
  fa.a2.unit18.lesson03.exercise04.order_return_policy_sentence:
    instruction: "Arrange the words to say: the return window for goods is seven days."
    accepted_answers: [{value: [مهلت, پس, دادن, کالا, هفت, روزه], status: correct}]
    feedback: "*مهلت پس دادن کالا هفت روزه.* states the return window."
  fa.a2.unit18.lesson03.exercise05.write_return_window:
    instruction: "Write that the return window for goods is seven days."
    accepted_answers:
      - {value: "مهلت پس دادن کالا هفت روزه.", status: correct}
      - {value: "مهلت پس دادن کالا هفت روزه", status: correct}
    feedback: "*مهلت پس دادن کالا هفت روزه.* states the return window."

  fa.a2.unit18.lesson04.exercise01.comprehend_nima_problem:
    instruction: "What problem does نیما report?"
    correct_option: "The headphones he bought have no sound."
    distractors: ["The headphones he bought are the wrong color.", "He lost his receipt.", "He wants a different model."]
    accepted_answers: [{value: "The headphones he bought have no sound.", status: correct}]
    feedback: "*این هدفون رو خریدم ولی صدا نداره* -- he bought these headphones but they have no sound."
  fa.a2.unit18.lesson04.exercise02.comprehend_shop_offer:
    instruction: "What two options does the employee offer نیما?"
    correct_option: "An exchange or a refund."
    distractors: ["A repair or a discount.", "Only a refund.", "Only an exchange."]
    accepted_answers: [{value: "An exchange or a refund.", status: correct}]
    feedback: "*می‌خواید تعویضش کنیم یا پولتون رو پس بدیم؟* -- do you want an exchange or a refund?"
  fa.a2.unit18.lesson04.exercise03.recognize_please:
    instruction: "What does this word mean?"
    correct_option: "please"
    distractors: ["broken", "receipt", "deadline"]
    accepted_answers: [{value: "please", status: correct}]
    feedback: "*لطفاً* means please."
  fa.a2.unit18.lesson04.exercise04.order_bought_three_days_ago:
    instruction: "Arrange the words to say: I bought it three days ago."
    accepted_answers: [{value: [سه, روز, پیش, خریدمش], status: correct}]
    feedback: "*سه روز پیش خریدمش.* states when it was bought."
  fa.a2.unit18.lesson04.exercise05.dialogue_response_request_exchange:
    instruction: "The employee asks: 'Do you want us to exchange it, or refund your money?' Answer that you want the exchange, please."
    accepted_answers:
      - {value: "تعویضش کنید، لطفاً.", status: correct}
      - {value: "تعویضش کنید لطفاً", status: correct}
    feedback: "*تعویضش کنید، لطفاً.* politely requests the exchange."
  fa.a2.unit18.lesson04.exercise06.write_complaint_summary:
    instruction: "Write what نیما says about his complaint: you bought these headphones but there's no sound."
    accepted_answers:
      - {value: "این هدفون رو خریدم ولی صدا نداره", status: correct}
      - {value: "این هدفون رو خریدم ولی صدا نداره.", status: correct}
      - {value: "این هدفون رو خریدم، ولی صدا نداره.", status: correct}
    feedback: "*این هدفون رو خریدم ولی صدا نداره.* is what نیما says about his headphones."
