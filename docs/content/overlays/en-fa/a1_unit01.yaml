course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi focused on reading the script, understanding
    everyday speech, and handling practical conversations politely.

units:
  fa.a1.unit01.greetings:
    title: "Greetings and first meetings"

lessons:
  fa.a1.unit01.lesson01.script_ramp: {title: "Read your first Persian word"}
  fa.a1.unit01.lesson02.everyday_greetings: {title: "Everyday greetings"}
  fa.a1.unit01.lesson03.time_and_farewells: {title: "Greetings and farewells through the day"}
  fa.a1.unit01.lesson04.formal_informal_wellbeing: {title: "Polite and informal small talk"}
  fa.a1.unit01.lesson05.taarof_basics: {title: "A first look at taarof"}
  fa.a1.unit01.lesson06.first_meeting_dialogue: {title: "First-meeting dialogue"}

teaching:
  fa.a1.unit01.lesson01.teach.rtl:
    title: "Persian runs right to left"
    gloss: "Persian is written from right to left."
    note: "Read Persian from the right edge toward the left."
  fa.a1.unit01.lesson01.teach.seen:
    title: "The letter س"
    gloss: "s"
    note: "س normally represents an s sound."
  fa.a1.unit01.lesson01.teach.lam:
    title: "The letter ل"
    gloss: "l"
    note: "ل represents an l sound and connects to surrounding letters."
  fa.a1.unit01.lesson01.teach.alef:
    title: "The letter ا"
    gloss: "ā / a"
    note: "ا often marks long ā and does not connect onward to the next letter."
  fa.a1.unit01.lesson01.teach.mim:
    title: "The letter م"
    gloss: "m"
    note: "م represents an m sound and changes shape when joined."
  fa.a1.unit01.lesson01.teach.salam_shape:
    title: "Build سلام"
    gloss: "hello"
    note: "سلام is read salâm. Short vowels are normally omitted in Persian writing."
    example_gloss: "Hello! I'm Nima."

  fa.a1.unit01.lesson02.teach.salam:
    title: "Hello"
    gloss: "hello"
    note: "سلام is suitable in formal and informal situations."
    example_gloss: "Hi, are you well?"
  fa.a1.unit01.lesson02.teach.sobh_bekheyr:
    title: "Good morning"
    gloss: "good morning"
    note: "صبح بخیر is a neutral-polite morning greeting."
  fa.a1.unit01.lesson02.teach.asr_bekheyr:
    title: "Good afternoon or evening"
    gloss: "good afternoon / good evening"
    note: "عصر بخیر is used from later afternoon into the evening."
  fa.a1.unit01.lesson02.teach.khodahafez:
    title: "Goodbye"
    gloss: "goodbye"
    note: "خداحافظ is read khodâhâfez and is the standard general farewell."
    example_gloss: "Goodbye, see you later!"
  fa.a1.unit01.lesson02.teach.mamnoon:
    title: "Thank you"
    gloss: "thank you"
    note: "ممنون is common and natural; متشکرم is somewhat more formal."
    example_gloss: "Thank you very much."
  fa.a1.unit01.lesson02.teach.khahesh_mikonam:
    title: "You're welcome"
    gloss: "you're welcome"
    note: "خواهش می‌کنم is the conventional response to thanks."
  fa.a1.unit01.lesson02.teach.hale_shoma:
    title: "How are you? Polite spoken form"
    gloss: "How are you?"
    note: "حالتون چطوره؟ is neutral-polite spoken Iranian Farsi. حال شما چطور است؟ is a more formal or written counterpart."
  fa.a1.unit01.lesson02.teach.khoobam:
    title: "I'm well"
    gloss: "I'm well"
    note: "خوبم combines خوب with the first-person ending ـم."

  fa.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: "Good day"
    gloss: "good day"
    note: "روز بخیر is polite but less frequent than سلام in casual speech."
  fa.a1.unit01.lesson03.teach.shab_bekheyr:
    title: "Good night"
    gloss: "good night"
    note: "شب بخیر is normally a farewell or bedtime wish, not an opening greeting."
  fa.a1.unit01.lesson03.teach.khosh_amadeed:
    title: "Welcome"
    gloss: "welcome"
    note: "خوش آمدید is the polite form used for one or more guests."
  fa.a1.unit01.lesson03.teach.be_omide_didar:
    title: "Hope to see you"
    gloss: "hope to see you / until we meet again"
    note: "به امید دیدار is a polished, neutral-polite farewell."
  fa.a1.unit01.lesson03.teach.fealan:
    title: "Bye for now"
    gloss: "bye for now"
    note: "فعلاً is conversational and less formal than خداحافظ."
  fa.a1.unit01.lesson03.teach.rooze_khoobi:
    title: "Have a good day"
    gloss: "have a good day"
    note: "باشید marks the polite form in this fixed farewell."

  fa.a1.unit01.lesson04.teach.formal_question:
    title: "Neutral-polite spoken form"
    gloss: "How are you?"
    note: "Use حالتون چطوره؟ with an unfamiliar adult or in an ordinary polite conversation. The explicitly formal or written form is حال شما چطور است؟"
  fa.a1.unit01.lesson04.teach.informal_question:
    title: "Informal"
    gloss: "How are you?"
    note: "چطوری؟ is conversational and appropriate with friends, family, and peers when the relationship permits it."
  fa.a1.unit01.lesson04.teach.to:
    title: "Informal you"
    gloss: "you"
    note: "تو is singular and informal; do not default to it with an unfamiliar adult."
  fa.a1.unit01.lesson04.teach.very_well:
    title: "Very well"
    gloss: "I'm very well"
    note: "خیلی strengthens خوبم."
  fa.a1.unit01.lesson04.teach.not_bad:
    title: "Not bad"
    gloss: "I'm not bad, thank you"
    note: "بد نیستم is a natural moderate response rather than a negative complaint."
  fa.a1.unit01.lesson04.teach.and_you_formal:
    title: "And you? Polite"
    gloss: "And you?"
    note: "Use شما چطور؟ to return the question politely."
  fa.a1.unit01.lesson04.teach.and_you_informal:
    title: "And you? Informal"
    gloss: "And you?"
    note: "تو چطور؟ matches an informal relationship."

  fa.a1.unit01.lesson05.teach.chai:
    title: "Tea"
    gloss: "tea"
    note: "*چای* is the drink. You will hear it in the offer *چای بفرمایید* (have some tea)."
    example_gloss: "Please, would you like some tea?"
  fa.a1.unit01.lesson05.teach.befarmaeed:
    title: "Please, go ahead"
    gloss: "please / go ahead / here you are"
    note: "*بفرمایید* changes with the situation: it can mean here you are (offering tea), please come in (at a door), or after you."
  fa.a1.unit01.lesson05.teach.lotf_dareed:
    title: "You're kind"
    gloss: "you're very kind"
    note: "لطف دارید politely returns a compliment."
  fa.a1.unit01.lesson05.teach.zahmat_nakeshid:
    title: "Please don't trouble yourself"
    gloss: "please don't go to the trouble"
    note: "زحمت نکشید may be a sincere refusal or a polite initial response to a concrete offer."
  fa.a1.unit01.lesson05.teach.mamnoon_lotf:
    title: "Thank you for your kindness"
    gloss: "thank you for your kindness"
    note: "This is warmer and more explicit than ممنون alone."
  fa.a1.unit01.lesson05.teach.cultural_pattern:
    title: "Taarof"
    gloss: "context-sensitive Iranian politeness conventions"
    note: >-
      Taarof refers to context-sensitive conventions of offering, declining,
      thanking, and showing regard. Practice varies by relationship,
      generation, region, and situation; no fixed number of refusals or
      repetitions determines whether an offer is sincere.

  fa.a1.unit01.lesson06.teach.line01:
    title: "Welcome"
    gloss: "Ali welcomes Narges."
    note: "The exchange begins with greeting before introductions."
  fa.a1.unit01.lesson06.teach.line02:
    title: "Welcome, reply"
    gloss: "Narges greets him back and thanks him."
    note: "ممنون (thanks) is a natural response to being welcomed."
  fa.a1.unit01.lesson06.teach.line03:
    title: "Exchange names"
    gloss: "Ali states who he is."
    note: "*من علی هستم* means I am Ali. *هستم* (am) comes at the end of the sentence."
  fa.a1.unit01.lesson06.teach.line04:
    title: "Exchange names, reply"
    gloss: "Narges states who she is."
    note: "Same *من ... هستم* pattern Ali just used."
  fa.a1.unit01.lesson06.teach.line05:
    title: "Pleased to meet you"
    gloss: "Ali says he is pleased to meet her."
    note: "*خوشوقتم* means I'm pleased. With *از آشنایی با شما* it is the standard polite phrase on meeting someone."
  fa.a1.unit01.lesson06.teach.line06:
    title: "Pleased to meet you, reply"
    gloss: "Narges returns the sentiment."
    note: "همین‌طور means similarly or likewise in this reply."
  fa.a1.unit01.lesson06.teach.line07:
    title: "Ask how someone is"
    gloss: "Ali asks politely how she is."
    note: "Ali uses the neutral-polite spoken ـتون form because this is a polite first meeting."
  fa.a1.unit01.lesson06.teach.line08:
    title: "Ask how someone is, reply"
    gloss: "Narges answers and returns the question."
    note: "شما چطور؟ reuses the question to ask it back, a common shortcut."
  fa.a1.unit01.lesson06.teach.line09:
    title: "Invitation"
    gloss: "Ali says he is well too and invites Narges inside."
    note: "*بفرمایید داخل* means please come in. *داخل* (inside) shows what is being offered."
  fa.a1.unit01.lesson06.teach.line10:
    title: "Polite refusal"
    gloss: "Narges thanks him but explains that she must leave."
    note: "A polite decline still opens with thanks before the refusal. *ولی باید برم* means but I have to go."
  fa.a1.unit01.lesson06.teach.line11:
    title: "Close the exchange"
    gloss: "Ali acknowledges her response and hopes to meet again."
    note: "The declined invitation now leads naturally into the farewell."
  fa.a1.unit01.lesson06.teach.line12:
    title: "Close the exchange, reply"
    gloss: "Narges says goodbye."
    note: "*خداحافظ* is the standard general goodbye."

exercises:
  fa.a1.unit01.lesson01.exercise01.recognize_salam:
    instruction: "Select the Persian word salâm."
    correct_option: سلام
    distractors: [سام, لام, ماس]
    accepted_answers: [{value: سلام, status: correct}]
    feedback: "سلام is the complete written word salâm."
  fa.a1.unit01.lesson01.exercise02.recognize_seen:
    instruction: "Which letter makes the s sound?"
    correct_option: س
    distractors: [ل, ا, م]
    accepted_answers: [{value: س, status: correct}]
    feedback: "س represents the s sound."
  fa.a1.unit01.lesson01.exercise03.recognize_lam:
    instruction: "Which letter makes the l sound?"
    correct_option: ل
    distractors: [س, ا, م]
    accepted_answers: [{value: ل, status: correct}]
    feedback: "ل represents the l sound."
  fa.a1.unit01.lesson01.exercise04.build_salam:
    instruction: "Arrange the letters to build سلام."
    accepted_answers: [{value: [س, ل, ا, م], status: correct}]
    feedback: "The ordered letters form سلام."
  fa.a1.unit01.lesson01.exercise05.select_missing_lam:
    instruction: "Select the missing Persian letter."
    correct_option: ل
    distractors: [س, ا, م]
    accepted_answers: [{value: ل, status: correct}]
    feedback: "The missing letter is ل."
  fa.a1.unit01.lesson01.exercise06.match_letters:
    instruction: "Match each Persian letter with its approximate Latin sound."
    accepted_answers:
      - value: {س: s, ل: l, ا: ā, م: m}
        status: correct
    feedback: "These four associations build سلام."
  fa.a1.unit01.lesson01.exercise07.rtl_direction:
    instruction: "Is this Persian word read starting from the right?"
    correct_option: "Yes"
    distractors: ["No"]
    accepted_answers: [{value: "Yes", status: correct}]
    feedback: "Persian is read from right to left."
  fa.a1.unit01.lesson01.exercise08.romanize_salam:
    instruction: "Type a common Latin-letter transliteration of سلام."
    answer_language_code: en
    accepted_answers:
      - {value: salam, status: correct}
      - {value: "salâm", status: correct}
      - {value: "salām", status: correct}
      - {value: salaam, status: acceptable_with_note, note: "Common English-oriented spelling."}
    feedback: "The course form is salâm; salam and salām are also accepted."

  fa.a1.unit01.lesson02.exercise01.recognize_salam_reading:
    instruction: "What does this word mean?"
    correct_option: hello
    distractors: [goodbye, "thank you", "good morning"]
    accepted_answers: [{value: hello, status: correct}]
    feedback: "سلام means hello."
  fa.a1.unit01.lesson02.exercise02.recognize_morning_reading:
    instruction: "What does this greeting mean?"
    correct_option: "good morning"
    distractors: ["good afternoon / good evening", goodbye, hello]
    accepted_answers: [{value: "good morning", status: correct}]
    feedback: "صبح بخیر is the neutral-polite morning greeting."
  fa.a1.unit01.lesson02.exercise03.goodbye_meaning:
    instruction: "Select the meaning of خداحافظ."
    correct_option: goodbye
    distractors: [hello, "thank you", "good evening"]
    accepted_answers: [{value: goodbye, status: correct}]
    feedback: "خداحافظ is the standard general farewell."
  fa.a1.unit01.lesson02.exercise04.recognize_evening_reading:
    instruction: "What does this greeting mean?"
    correct_option: "good afternoon / good evening"
    distractors: ["good morning", goodbye, hello]
    accepted_answers: [{value: "good afternoon / good evening", status: correct}]
    feedback: "عصر بخیر is used later in the day."
  fa.a1.unit01.lesson02.exercise05.order_youre_welcome:
    instruction: "Arrange the Persian words for you're welcome."
    accepted_answers: [{value: [خواهش, می‌کنم], status: correct}]
    feedback: "خواهش می‌کنم is the conventional response."
  fa.a1.unit01.lesson02.exercise06.reply_how_are_you:
    instruction: "Reply politely using the phrase you learned."
    accepted_answers:
      - {value: "خوبم، ممنون", status: correct}
      - {value: "خوبم ممنون", status: correct}
      - {value: "خوبم، ممنونم", status: correct}
      - {value: "من خوبم، ممنون", status: correct}
      - {value: "خوبم. ممنون", status: correct}
      - {value: "خوبم ممنونم", status: correct}
      - {value: "من خوبم ممنون", status: correct}
      - {value: "من خوبم، ممنونم", status: correct}
      - {value: "خوبم، مرسی", status: correct}
      - {value: "خوبم، متشکرم", status: correct}
      - {value: خوبم, status: acceptable_with_note, note: "Correct but less socially complete."}
    feedback: "خوبم، ممنون means I'm well, thank you."
  fa.a1.unit01.lesson02.exercise07.produce_thanks:
    instruction: "Translate into Farsi: Thank you."
    accepted_answers:
      - {value: ممنون, status: correct}
      - {value: ممنونم, status: correct}
      - {value: متشکرم, status: correct}
      - {value: مرسی, status: acceptable_with_note, note: "Very common colloquial borrowing."}
      - {value: "خیلی ممنون", status: acceptable_with_note, note: "Means thank you very much."}
      - {value: "ممنون از شما", status: acceptable_with_note, note: "A slightly fuller, polite way to say thank you."}
    feedback: "ممنون is the lesson target; the alternatives are also natural Iranian Persian."
  fa.a1.unit01.lesson02.exercise08.romanize_goodbye:
    instruction: "Type a common Latin-letter transliteration of خداحافظ."
    answer_language_code: en
    accepted_answers:
      - {value: khodahafez, status: correct}
      - {value: "khodâhâfez", status: correct}
      - {value: "khodāhāfez", status: correct}
      - {value: "khoda hafez", status: correct}
      - {value: "khodā hāfez", status: correct}
      - {value: khodafez, status: correct}
      - {value: "khodâ hâfez", status: correct}
    feedback: "The course form is khodâhâfez."

  fa.a1.unit01.lesson03.exercise01.night_meaning:
    instruction: "Select the normal use of شب بخیر."
    correct_option: "good night when leaving or going to bed"
    distractors: ["good morning", "welcome", "thank you"]
    accepted_answers: [{value: "good night when leaving or going to bed", status: correct}]
    feedback: "شب بخیر normally closes an evening interaction."
  fa.a1.unit01.lesson03.exercise02.translate_night:
    instruction: "Translate into Farsi: Good night."
    accepted_answers:
      - {value: "شب بخیر", status: correct}
      - {value: "شب به خیر", status: correct}
      - {value: "شب به‌خیر", status: correct}
    feedback: "شب بخیر means good night; the separated به spellings are also accepted."
  fa.a1.unit01.lesson03.exercise03.welcome_response:
    instruction: "Reply to خوش آمدید."
    accepted_answers:
      - {value: ممنون, status: correct}
      - {value: ممنونم, status: correct}
      - {value: متشکرم, status: correct}
      - {value: "خیلی ممنون", status: acceptable_with_note, note: "Natural, with extra emphasis."}
      - {value: مرسی, status: acceptable_with_note, note: "Very common colloquial borrowing."}
      - {value: "ممنون از شما", status: correct}
      - {value: "سلام، ممنون", status: correct}
      - {value: "سلام، ممنونم", status: correct}
    feedback: "ممنون and its alternatives are natural responses to a welcome."
  fa.a1.unit01.lesson03.exercise04.order_see_you:
    instruction: "Arrange the words for the polite farewell hope to see you."
    accepted_answers: [{value: [به, امید, دیدار], status: correct}]
    feedback: "به امید دیدار means hope to see you."
  fa.a1.unit01.lesson03.exercise05.informal_bye:
    instruction: "What does this phrase mean?"
    correct_option: "bye for now"
    distractors: [welcome, "good night", "good day"]
    accepted_answers: [{value: "bye for now", status: correct}]
    feedback: "فعلاً is conversational and relatively informal."
  fa.a1.unit01.lesson03.exercise06.recognize_see_you_reading:
    instruction: "What does this phrase mean?"
    correct_option: "hope to see you"
    distractors: ["good night", "welcome", "I'm well"]
    accepted_answers: [{value: "hope to see you", status: correct}]
    feedback: "به امید دیدار means hope to see you."
  fa.a1.unit01.lesson03.exercise07.build_good_day:
    instruction: "Arrange the polite farewell."
    accepted_answers: [{value: [روز, خوبی, داشته, باشید], status: correct}]
    feedback: "روز خوبی داشته باشید means have a good day."
  fa.a1.unit01.lesson03.exercise08.order_good_day:
    instruction: "Arrange the words to say Have a good day."
    accepted_answers: [{value: [روز, خوبی, داشته, باشید], status: correct}]
    feedback: "The complete phrase is روز خوبی داشته باشید."

  fa.a1.unit01.lesson04.exercise01.choose_formal:
    instruction: "Choose the appropriate spoken question for an unfamiliar adult."
    correct_option: "حالتون چطوره؟"
    distractors: ["چطوری؟", "تو چطور؟", "فعلاً"]
    accepted_answers: [{value: "حالتون چطوره؟", status: correct}]
    feedback: "The ـتون form is appropriate for an ordinary polite interaction."
  fa.a1.unit01.lesson04.exercise02.choose_informal:
    instruction: "Which register best describes چطوری؟"
    correct_option: informal
    distractors: [formal, "polite plural", "used only in writing"]
    accepted_answers: [{value: informal, status: correct}]
    feedback: "چطوری؟ is conversational and informal."
  fa.a1.unit01.lesson04.exercise03.recognize_formal_reading:
    instruction: "Which social setting fits this question?"
    correct_option: "speaking politely to an unfamiliar adult"
    distractors: ["speaking only to a child", "ending a phone call", "thanking a shopkeeper"]
    accepted_answers: [{value: "speaking politely to an unfamiliar adult", status: correct}]
    feedback: "حالتون چطوره؟ is neutral-polite spoken Iranian Farsi."
  fa.a1.unit01.lesson04.exercise04.translate_informal:
    instruction: "Translate into Farsi: How are you? (informal)"
    accepted_answers:
      - {value: "چطوری؟", status: correct}
      - {value: چطوری, status: correct}
      - {value: "تو چطوری؟", status: correct}
      - {value: "تو چطوری", status: correct}
      - {value: "حالت چطوره؟", status: correct}
      - {value: "حالت چطوره", status: correct}
    feedback: "چطوری؟ is the informal way to ask how someone is."
  fa.a1.unit01.lesson04.exercise05.reply_neutral:
    instruction: "Give the moderate polite response taught in this lesson."
    accepted_answers:
      - {value: "بد نیستم، ممنون", status: correct}
      - {value: "بد نیستم ممنون", status: correct}
