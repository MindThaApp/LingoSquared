course:
  title: Farsi B2
  description: Negotiate terms, refuse unacceptable points, and offer conditional concessions.
units:
  fa.b2.unit07.negotiation:
    title: Negotiation
    description: Negotiate terms, refuse unacceptable points, and offer conditional concessions.
lessons:
  fa.b2.unit07.negotiation.lesson01.proposal:
    title: Proposing terms
  fa.b2.unit07.negotiation.lesson02.pushback:
    title: Polite pushback
  fa.b2.unit07.negotiation.lesson03.concession:
    title: Conditional concession
teaching:
  fa.b2.unit07.negotiation.lesson01.proposal.teach.card01:
    title: my proposal is that
    gloss: my proposal is that
    note: 'A formal way to start a proposal. After *این است که* comes a clause with a subjunctive: *انجام دهیم*. In speech people say *پیشنهادم اینه که*.'
    example_gloss: My proposal is that we do the work in stages.
  fa.b2.unit07.negotiation.lesson01.proposal.teach.card02:
    title: rent
    gloss: rent
    note: 'Money paid for renting, usually housing or space. The same noun works for rent paid or charged, depending on the verb you use with it.'
    example_gloss: The rent for this studio is paid monthly.
  fa.b2.unit07.negotiation.lesson01.proposal.teach.card03:
    title: equally
    gloss: equally
    note: 'Used here as an adverb, "in equal parts". The same word is a noun in *دو برابر*, "twice as much".'
    example_gloss: Let’s split the lighting cost equally.
  fa.b2.unit07.negotiation.lesson01.proposal.teach.card04:
    title: we split
    gloss: we split
    note: '*تقسیم کردن* is a compound verb. The ending *-یم* with a subjunctive means "let us split". Its object takes *را* when specific.'
    example_gloss: We can split the shifts fairly.
  fa.b2.unit07.negotiation.lesson01.proposal.teach.card05:
    title: terms
    gloss: terms
    note: 'The plural *شرایط* is normal for "terms" or "conditions" and also means "circumstances". Its singular is *شرط*.'
    example_gloss: The contract terms must be clear.
  fa.b2.unit07.negotiation.lesson01.proposal.teach.card06:
    title: from my point of view
    gloss: from my point of view
    note: '*از نظر من* is the most common way to give an opinion. It stands at the start of the sentence, followed by a comma.'
    example_gloss: From my point of view, usage time is more important than size.
  fa.b2.unit07.negotiation.lesson01.proposal.teach.card07:
    title: share
    gloss: share
    note: 'Used for each person''s portion or part, as in *سهم هر نفر*. *نفر* counts people, and a singular noun follows *هر*.'
    example_gloss: Let’s write each person’s share separately.
  fa.b2.unit07.negotiation.lesson01.proposal.teach.card08:
    title: is fair
    gloss: is fair
    note: '*منصفانه* uses the *-انه* pattern. The related adjective is *منصف*. Here it stands before *است*, with *برای* naming the people affected.'
    example_gloss: This split is fair for both people.
  fa.b2.unit07.negotiation.lesson01.proposal.teach.card09:
    title: studio
    gloss: studio
    note: 'A loan word, used the same way as in English. Like any noun-adjective pair it takes ezafe: *نورِ طبیعی*.'
    example_gloss: The studio has good natural light.
  fa.b2.unit07.negotiation.lesson01.proposal.teach.grammar:
    title: Negotiation grammar
    gloss: Negotiation grammar
    note: '*پیشنهاد من این است که* frames a term without sounding like an order. The *که* clause states the proposed arrangement.'
  fa.b2.unit07.negotiation.lesson02.pushback.teach.card01:
    title: I do not agree with this part
    gloss: I do not agree with this part
    note: 'Persian uses *با* plus the adjective *موافق*; *نیستم* follows it. *چون* introduces the reason in a casual, direct way.'
    example_gloss: I do not agree with this part because its cost is unclear.
  fa.b2.unit07.negotiation.lesson02.pushback.teach.card02:
    title: amount
    gloss: amount
    note: 'Means an amount of money, typically in formal contexts. It takes ezafe with a noun, as in *مبلغ اجاره*. It is more formal than *پول*.'
    example_gloss: The advance payment is very high.
  fa.b2.unit07.negotiation.lesson02.pushback.teach.card03:
    title: advance payment
    gloss: advance payment
    note: 'A compound of *پیش* (before) and *پرداخت* (payment), written with a ZWNJ. *دو مرحله‌ای* is an adjective phrase meaning in two stages.'
    example_gloss: Let’s pay the advance payment in two installments.
  fa.b2.unit07.negotiation.lesson02.pushback.teach.card04:
    title: is not acceptable for me
    gloss: is not acceptable for me
    note: '*قابل قبول* is the standard "acceptable". The phrase *برای من* says whose standard it is, which keeps the refusal personal.'
    example_gloss: This condition is not acceptable for me.
  fa.b2.unit07.negotiation.lesson02.pushback.teach.card05:
    title: condition
    gloss: condition
    note: 'Means a condition or term. Its plural *شرایط* usually means "conditions" or "circumstances" in general. *نیاز به ... دارد* means "needs".'
    example_gloss: The second condition needs explanation.
  fa.b2.unit07.negotiation.lesson02.pushback.teach.card06:
    title: we can find another way
    gloss: we can find another way
    note: '*که* introduces a clause with a subjunctive. *راه* literally means road but is used for a solution or approach.'
    example_gloss: We can find another way so both of us are satisfied.
  fa.b2.unit07.negotiation.lesson02.pushback.teach.card07:
    title: disagreement
    gloss: disagreement
    note: 'Stronger than *تفاوت*: it suggests a real dispute. It usually takes *درباره* or *بر سر* for the topic.'
    example_gloss: Our disagreement is about usage time.
  fa.b2.unit07.negotiation.lesson02.pushback.teach.card08:
    title: working relationship
    gloss: working relationship
    note: '*رابطه کاری* means a professional relationship. The verb *خراب کردن* means to ruin and takes *را* for the object.'
    example_gloss: We should not damage the working relationship.
  fa.b2.unit07.negotiation.lesson02.pushback.teach.card09:
    title: clear
    gloss: clear
    note: 'As an adjective it follows its noun. It describes a light, a colour, or something clear and easy to understand, depending on context.'
    example_gloss: A clear answer makes negotiation shorter.
  fa.b2.unit07.negotiation.lesson02.pushback.teach.grammar:
    title: Negotiation grammar
    gloss: Negotiation grammar
    note: '*با این بخش موافق نیستم* is firm but relationship-preserving. In negotiation, name the exact term you reject.'
  fa.b2.unit07.negotiation.lesson03.concession.teach.card01:
    title: if the contract is shorter
    gloss: if the contract is shorter
    note: '*اگر* clauses can use *باشد* for a condition that is hypothetical. The result clause then states the outcome in a plain present.'
    example_gloss: If the contract is shorter, the risk is lower.
  fa.b2.unit07.negotiation.lesson03.concession.teach.card02:
    title: contract
    gloss: contract
    note: 'A word for a legal agreement, not just any promise. With *داشتن*, as in *تاریخ پایان داشتن*, it states a feature the contract has.'
    example_gloss: The contract must have an end date.
  fa.b2.unit07.negotiation.lesson03.concession.teach.card03:
    title: I agree to the higher amount
    gloss: I agree to the higher amount
    note: '*با* marks what you agree to. The condition follows with *اگر*, and *با مالک باشد* is a subjunctive meaning the repair is the owner''s job.'
    example_gloss: I agree to the higher amount if repairs are the owner’s responsibility.
  fa.b2.unit07.negotiation.lesson03.concession.teach.card04:
    title: concession
    gloss: concession
    note: 'Here it means a concession, something given or gained in negotiation. In other contexts it can also mean points, a score or a privilege.'
    example_gloss: Every concession must have a clear condition.
  fa.b2.unit07.negotiation.lesson03.concession.teach.card05:
    title: guarantee
    gloss: guarantee
    note: 'Used for guarantees on goods or for a personal assurance. *برای* names the items covered, and *می‌خواهم* states the demand.'
    example_gloss: I want a guarantee for expensive equipment.
  fa.b2.unit07.negotiation.lesson03.concession.teach.card06:
    title: provided that
    gloss: provided that
    note: '*به شرطی که* sets a firm condition and is stronger than *اگر*. The verb after it is in the subjunctive or present.'
    example_gloss: Provided that the hours are equal, I accept.
  fa.b2.unit07.negotiation.lesson03.concession.teach.card07:
    title: agreement
    gloss: agreement
    note: 'From Arabic, used in formal talks and contracts. It also appears as a verb phrase *توافق کردن*, "to reach an agreement".'
    example_gloss: An agreement without an exact date is vague.
  fa.b2.unit07.negotiation.lesson03.concession.teach.card08:
    title: I accept for now
    gloss: I accept for now
    note: '*فعلا* means "for now". As a parting word, in speech, it can also mean "see you later". Here it limits the acceptance.'
    example_gloss: I accept for now, but let’s review again next month.
  fa.b2.unit07.negotiation.lesson03.concession.teach.card09:
    title: owner
    gloss: owner
    note: 'Means an owner or landlord. In rental talks it refers to the person who owns the property, not to the one who rents it.'
    example_gloss: The owner must do the main repair.
  fa.b2.unit07.negotiation.lesson03.concession.teach.grammar:
    title: Negotiation grammar
    gloss: Negotiation grammar
    note: '*اگر ... باشد، موافقم* attaches a condition to a concession. The condition protects your position while moving the negotiation forward.'
