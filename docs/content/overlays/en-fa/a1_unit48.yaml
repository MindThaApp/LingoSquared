course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: dropping off clothes at a laundry/dry-cleaning
    shop, asking for express service, understanding the price and pickup
    time, a full customer-to-shop-owner exchange, and reading/writing a
    short laundry-shop sign naming the service and price.

units:
  fa.a1.unit48.laundry:
    title: Laundry

lessons:
  fa.a1.unit48.lesson01.new_laundry_one: {title: "New words 1"}
  fa.a1.unit48.lesson02.new_laundry_two: {title: "New words 2"}
  fa.a1.unit48.lesson03.ready_and_pickup: {title: "Ready and picking it up"}
  fa.a1.unit48.lesson04.laundry_dialogue: {title: "Dialogue: at the laundry shop"}
  fa.a1.unit48.lesson05.reading_laundry_sign: {title: "Reading a laundry-shop sign"}
  fa.a1.unit48.lesson06.wrap_up: {title: "Wrap-up"}

teaching:
  fa.a1.unit48.lesson01.teach.review_labasha_in:
    title: "Review: clothes / this"
    gloss: "clothes / this"
    note: "*لباس‌ها* ('clothes') was already taught in unit32; *این* ('this') was already taught in unit03/04/08."
  fa.a1.unit48.lesson01.teach.review_miram_be:
    title: "Review: I go / to"
    gloss: "I go / to"
    note: "*می‌رم* ('I go') was already taught in unit16/24; *به* ('to') was already taught in unit16/21."
  fa.a1.unit48.lesson01.teach.khoshkshuyi:
    title: "Laundry shop"
    gloss: "laundry shop, dry cleaner's"
    note: "*خشکشویی* is a shop where you drop off clothes for washing or dry cleaning."
    example_gloss: "I go to the laundry shop."

  fa.a1.unit48.lesson02.teach.review_ro_mikhaam:
    title: "Review: object marker / I want"
    gloss: "object marker / I want"
    note: "*رو* (the object marker) was already taught in unit32; *می‌خوام* ('I want') was already taught in unit03."
  fa.a1.unit48.lesson02.teach.review_cheghadr_mishe:
    title: "Review: how much / it comes to"
    gloss: "how much / it comes to"
    note: "*چقدر* ('how much') was already taught in unit21/28; *می‌شه* ('it comes to, costs') was already taught in unit11/35."
  fa.a1.unit48.lesson02.teach.review_dah_hezar_toman:
    title: "Review: ten / thousand / toman"
    gloss: "ten / thousand / toman"
    note: "*ده* ('ten') was already taught in unit03; *هزار* ('thousand') and *تومن* ('toman') were already taught in unit03/unit21."
  fa.a1.unit48.lesson02.teach.foori:
    title: Express
    gloss: "express, urgent"
    note: "*فوری* means 'express' or 'urgent' -- used here for fast laundry service."
    example_gloss: "I want these clothes express."

  fa.a1.unit48.lesson03.teach.review_key_farda_zohr:
    title: "Review: when / tomorrow / noon"
    gloss: "when / tomorrow / noon"
    note: "*کِی* ('when') was already taught in unit34/42; *فردا* ('tomorrow') and *ظهر* ('noon') were already taught in unit09."
  fa.a1.unit48.lesson03.teach.review_khoobe_baleh:
    title: "Review: good, that's fine / yes"
    gloss: "good, that's fine / yes"
    note: "*خوبه* ('good, that's fine') was already taught in unit06/10/12/19; *بله* ('yes') was already taught in unit20/21."
  fa.a1.unit48.lesson03.teach.review_migiram:
    title: "Review: I get it / I'll pick it up"
    gloss: "I get it / I'll pick it up"
    note: "*می‌گیرم* ('I get it / I'll pick it up') was already taught in unit29/34/41."
  fa.a1.unit48.lesson03.teach.farda_zohr_khoobe:
    title: "Is tomorrow noon good?"
    gloss: "Is tomorrow noon good?"
    note: "A question offering a pickup time, using only already-known words."
  fa.a1.unit48.lesson03.teach.key_migiram:
    title: "When do I pick it up?"
    gloss: "When do I pick it up?"
    note: "The same *می‌گیرم* verb used earlier for taking or receiving something, here asking about picking up finished laundry."

  fa.a1.unit48.lesson04.teach.review_salam_mamnoon:
    title: "Review: hi / thanks"
    gloss: "hi / thanks"
    note: "*سلام* and *ممنون* were already taught in units 01/17/22/45/46/47."
  fa.a1.unit48.lesson04.teach.review_khanoom_bashe:
    title: "Review: Ms. / okay"
    gloss: "Ms. / okay"
    note: "*خانم* ('Ms.') was already taught in unit41; *باشه* ('okay') was already taught in units 01/02/06/17/22/45/46/47."
  fa.a1.unit48.lesson04.teach.character_kazemi:
    title: "Ms. Kazemi"
    gloss: "Ms. Kazemi"
    note: "*خانم کاظمی* is this unit's new laundry-shop-owner character, distinct from every other named service-encounter character already in this course."
    example_gloss: "Ms. Kazemi has a laundry shop."
  fa.a1.unit48.lesson04.teach.dialogue_line1:
    title: "Nima: Hi Ms. Kazemi. I want these clothes express."
    gloss: "Hi Ms. Kazemi. I want these clothes express."
  fa.a1.unit48.lesson04.teach.dialogue_line2:
    title: "Ms. Kazemi: Hi Nima. Is tomorrow noon good?"
    gloss: "Hi Nima. Is tomorrow noon good?"
  fa.a1.unit48.lesson04.teach.dialogue_line3:
    title: "Nima: Yes, that's good. How much does it come to?"
    gloss: "Yes, that's good. How much does it come to?"
  fa.a1.unit48.lesson04.teach.dialogue_line4:
    title: "Ms. Kazemi: It comes to 10,000 toman."
    gloss: "It comes to 10,000 toman."
  fa.a1.unit48.lesson04.teach.dialogue_line5:
    title: "Nima: Okay. When do I pick it up?"
    gloss: "Okay. When do I pick it up?"
  fa.a1.unit48.lesson04.teach.dialogue_line6:
    title: "Ms. Kazemi: Tomorrow noon."
    gloss: "Tomorrow noon."
  fa.a1.unit48.lesson04.teach.dialogue_line7:
    title: "Nima: Thanks!"
    gloss: "Thanks!"

  fa.a1.unit48.lesson05.teach.reading_text:
    title: "Reading: a laundry-shop sign"
    gloss: "Kazemi Laundry: clothes express, 10,000 toman."
    note: "A short shop sign naming the service, the express option, and the price."

  fa.a1.unit48.lesson06.teach.review_request:
    title: "I want these clothes express."
    gloss: "I want these clothes express."
    note: "A full review sentence reusing only already-known words from this unit."
  fa.a1.unit48.lesson06.teach.review_price_pickup:
    title: "It comes to 10,000 toman. I'll pick it up tomorrow noon."
    gloss: "It comes to 10,000 toman. I'll pick it up tomorrow noon."
  fa.a1.unit48.lesson06.teach.summary_words:
    title: "Laundry shop / express / clothes / How much does it come to? / When do I pick it up?"
    gloss: "laundry shop / express / clothes / how much does it come to? / when do I pick it up?"
    note: "These are the key words and phrases taught in this unit."

exercises:
  fa.a1.unit48.lesson01.exercise01.recognize_khoshkshuyi:
    instruction: "What does this word mean?"
    correct_option: "laundry shop"
    distractors: [clothes, tailor, bank]
    accepted_answers: [{value: "laundry shop", status: correct}]
    feedback: "خشکشویی means 'laundry shop' or 'dry cleaner's.'"
  fa.a1.unit48.lesson01.exercise02.recognize_miram_be_khoshkshuyi:
    instruction: "What does this sentence mean?"
    correct_option: "I go to the laundry shop."
    distractors: ["I go to the bank.", "I go to the pharmacy.", "I have a laundry shop."]
    accepted_answers: [{value: "I go to the laundry shop.", status: correct}]
    feedback: "می‌رم به خشکشویی means 'I go to the laundry shop.'"
  fa.a1.unit48.lesson01.exercise03.match_laundry_one:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {خشکشویی: "laundry shop", "لباس‌ها": clothes, این: this, "می‌رم": "I go", به: to, "می‌رم به خشکشویی.": "I go to the laundry shop."}
        status: correct
    feedback: "These are the first new laundry words for this unit."
  fa.a1.unit48.lesson01.exercise04.word_order_miram_be_khoshkshuyi:
    instruction: "Put the words in order."
    accepted_answers: [{value: ["می‌رم", به, خشکشویی], status: correct}]
    feedback: "می‌رم به خشکشویی means 'I go to the laundry shop.'"
  fa.a1.unit48.lesson01.exercise05.translate_labasha_khoshkshuyi:
    instruction: "Translate into English: لباس‌ها خشکشویی"
    answer_language_code: en
    accepted_answers:
      - {value: "Clothes laundry shop.", status: correct}
      - {value: "Clothes, laundry shop", status: correct}
      - {value: "clothes laundry shop", status: correct}
      - {value: "Clothes, laundry shop.", status: correct}
    feedback: "لباس‌ها خشکشویی means 'clothes, laundry shop.'"

  fa.a1.unit48.lesson02.exercise01.recognize_foori:
    instruction: "What does this word mean?"
    correct_option: express
    distractors: [slow, cheap, closed]
    accepted_answers: [{value: express, status: correct}]
    feedback: "فوری means 'express' or 'urgent.'"
  fa.a1.unit48.lesson02.exercise02.recognize_in_labasha_ro_foori_mikhaam:
    instruction: "What does this sentence mean?"
    correct_option: "I want these clothes express."
    distractors: ["I want to buy these clothes.", "I want to wash these clothes myself.", "I don't need these clothes."]
    accepted_answers: [{value: "I want these clothes express.", status: correct}]
    feedback: "این لباس‌ها رو فوری می‌خوام means 'I want these clothes express.'"
  fa.a1.unit48.lesson02.exercise03.match_laundry_two:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {فوری: express, رو: "(object marker)", چقدر: "how much", "می‌شه": "it comes to", ده: ten, هزار: thousand, تومن: toman}
        status: correct
    feedback: "These words let you ask about express service and cost."
  fa.a1.unit48.lesson02.exercise04.word_order_in_labasha_ro_foori_mikhaam:
    instruction: "Put the words in order."
    accepted_answers: [{value: [این, "لباس‌ها", رو, فوری, "می‌خوام"], status: correct}]
    feedback: "این لباس‌ها رو فوری می‌خوام means 'I want these clothes express.'"
  fa.a1.unit48.lesson02.exercise05.translate_cheghadr_mishe:
    instruction: "Translate into English: چقدر می‌شه؟"
    answer_language_code: en
    accepted_answers:
      - {value: "How much does it come to?", status: correct}
      - {value: "How much does it come to", status: correct}
      - {value: "How much is it?", status: correct}
    feedback: "چقدر می‌شه؟ means 'How much does it come to?'"

  fa.a1.unit48.lesson03.exercise01.recognize_farda_zohr_khoobe:
    instruction: "What does this sentence mean?"
    correct_option: "Is tomorrow noon good?"
    distractors: ["Is tomorrow evening good?", "Is today noon good?", "Is next week good?"]
    accepted_answers: [{value: "Is tomorrow noon good?", status: correct}]
    feedback: "فردا ظهر خوبه؟ means 'Is tomorrow noon good?'"
  fa.a1.unit48.lesson03.exercise02.recognize_key_migiram:
    instruction: "What does this sentence mean?"
    correct_option: "When do I pick it up?"
    distractors: ["When do I pay?", "When do I bring it?", "When does it open?"]
    accepted_answers: [{value: "When do I pick it up?", status: correct}]
    feedback: "کِی می‌گیرم؟ means 'When do I pick it up?'"
  fa.a1.unit48.lesson03.exercise03.match_ready_and_pickup:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {کِی: when, فردا: tomorrow, ظهر: noon, خوبه: "good, that's fine", بله: "yes", "می‌گیرم": "I get it / I'll pick it up", "فردا ظهر خوبه؟": "Is tomorrow noon good?", "کِی می‌گیرم؟": "When do I pick it up?"}
        status: correct
    feedback: "These words let you agree on a pickup time and ask when to come back."
  fa.a1.unit48.lesson03.exercise04.word_order_key_migiram:
    instruction: "Put the words in order."
    accepted_answers: [{value: [کِی, "می‌گیرم"], status: correct}]
    feedback: "کِی می‌گیرم means 'When do I pick it up.'"
  fa.a1.unit48.lesson03.exercise05.translate_farda_zohr_khoobe:
    instruction: "Translate into English: فردا ظهر خوبه؟"
    answer_language_code: en
    accepted_answers:
      - {value: "Is tomorrow noon good?", status: correct}
      - {value: "Is tomorrow noon good", status: correct}
      - {value: "Is tomorrow at noon okay?", status: correct}
    feedback: "فردا ظهر خوبه؟ means 'Is tomorrow noon good?'"

  fa.a1.unit48.lesson04.exercise01.dialogue_comprehension_price:
    instruction: "Nima asks Ms. Kazemi something. What does he want to know?"
    correct_option: "He wants to know how much it costs."
    distractors:
      - "He wants to know if they also do dry cleaning."
      - "He wants to know if the shop is open on Fridays."
      - "He wants to know if he needs an appointment."
    accepted_answers: [{value: "He wants to know how much it costs.", status: correct}]
    feedback: "چقدر می‌شه؟ means 'How much does it come to?'"
  fa.a1.unit48.lesson04.exercise02.recognize_dialogue_line4:
    instruction: "What does this sentence mean?"
    correct_option: "It comes to 10,000 toman."
    distractors:
      - "It comes to 1,000 toman."
      - "It comes to 100,000 toman."
      - "It's free."
    accepted_answers: [{value: "It comes to 10,000 toman.", status: correct}]
    feedback: "ده هزار تومن می‌شه means 'It comes to 10,000 toman.'"
  fa.a1.unit48.lesson04.exercise03.match_dialogue_laundry:
    instruction: "Match each line with its meaning."
    accepted_answers:
      - value: {"سلام خانم کاظمی. این لباس‌ها رو فوری می‌خوام.": "Hi Ms. Kazemi. I want these clothes express.", "سلام نیما. فردا ظهر خوبه؟": "Hi Nima. Is tomorrow noon good?", "بله، خوبه. چقدر می‌شه؟": "Yes, that's good. How much does it come to?", "ده هزار تومن می‌شه.": "It comes to 10,000 toman.", "باشه. کِی می‌گیرم؟": "Okay. When do I pick it up?", "فردا ظهر.": "Tomorrow noon.", "ممنون!": "Thanks!"}
        status: correct
    feedback: "These lines appear in the laundry-shop conversation between Nima and Ms. Kazemi."
  fa.a1.unit48.lesson04.exercise04.dialogue_response_confirm:
    instruction: "Respond to فردا ظهر خوبه؟ by saying yes, that's good."
    accepted_answers:
      - {value: "بله، خوبه.", status: correct}
      - {value: "بله، خوبه", status: correct}
      - {value: "بله، خوبه. چقدر می‌شه؟", status: correct}
    feedback: "بله، خوبه means 'Yes, that's good.'"
  fa.a1.unit48.lesson04.exercise05.translate_dialogue_line5:
    instruction: "Translate into English: باشه. کِی می‌گیرم؟"
    answer_language_code: en
    accepted_answers:
      - {value: "Okay. When do I pick it up?", status: correct}
      - {value: "Okay, when do I pick it up?", status: correct}
      - {value: "Okay. When can I pick it up?", status: correct}
    feedback: "باشه. کِی می‌گیرم؟ means 'Okay. When do I pick it up?'"

  fa.a1.unit48.lesson05.exercise01.reading_comprehension_service:
    instruction: "According to the sign, what service is offered?"
    correct_option: "Laundry / dry-cleaning service."
    distractors:
      - "Furniture repair."
      - "House cleaning."
      - "Shoe repair."
    accepted_answers: [{value: "Laundry / dry-cleaning service.", status: correct}]
    feedback: "خشکشویی means 'laundry shop' -- the sign is for laundry / dry cleaning."
  fa.a1.unit48.lesson05.exercise02.reading_comprehension_price:
    instruction: "According to the sign, how much does express cleaning cost?"
    correct_option: "10,000 toman."
    distractors:
      - "1,000 toman."
      - "100,000 toman."
      - "It's free."
    accepted_answers: [{value: "10,000 toman.", status: correct}]
    feedback: "ده هزار تومن means '10,000 toman.'"
  fa.a1.unit48.lesson05.exercise03.match_reading_laundry_sign:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {خشکشویی: "laundry shop", کاظمی: Kazemi, "لباس‌ها": clothes, فوری: express, هزار: thousand, تومن: toman}
        status: correct
    feedback: "These words let you understand the laundry-shop sign."
  fa.a1.unit48.lesson05.exercise04.translate_reading_laundry_sign:
    instruction: "Translate into English: خشکشویی کاظمی: لباس‌ها فوری، ده هزار تومن."
    answer_language_code: en
