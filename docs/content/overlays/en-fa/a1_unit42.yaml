  fa.a1.unit42.lesson02.teach.ketab_amanat_mikham:
    title: "I want to borrow a book"
    gloss: "I want to borrow a book"
  fa.a1.unit42.lesson02.teach.kart_ketabkhune_darid:
    title: "Do you have a library card?"
    gloss: "Do you have a library card?"

  fa.a1.unit42.lesson03.teach.review_ki:
    title: "Review: when"
    gloss: when
    note: "*کی* ('when') was introduced earlier."
  fa.a1.unit42.lesson03.teach.review_midam:
