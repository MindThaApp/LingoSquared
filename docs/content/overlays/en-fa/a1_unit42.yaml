    title: "Nima: Yes, here you go."
    gloss: "Yes, here you go."
  fa.a1.unit42.lesson04.teach.dialogue_line4:
    title: "Mr. Sadeghi: Thanks. Until Tuesday."
    gloss: "Thanks. Until Tuesday."
  fa.a1.unit42.lesson04.teach.dialogue_line5:
    title: "Nima: Okay, I'll give it back."
    gloss: "Okay, I'll give it back."
  fa.a1.unit42.lesson04.teach.dialogue_line6:
