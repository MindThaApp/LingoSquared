      - value: {امانت: "loan / on loan", کارت: card, "کتاب امانت می‌خوام.": "I want to borrow a book.", "کارت کتابخونه دارید؟": "Do you have a library card?", کتابخونه: library, "دارید؟": "do you have? (formal)"}
        status: correct
    feedback: "These words let you ask to borrow a book and talk about a library card."
  fa.a1.unit42.lesson02.exercise04.word_order_ketab_amanat_mikham:
    instruction: "Put the words in order."
    accepted_answers: [{value: [کتاب, امانت, "می‌خوام"], status: correct}]
    feedback: "*کتاب امانت می‌خوام* means 'I want to borrow a book.'"
