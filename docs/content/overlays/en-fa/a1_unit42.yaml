    correct_option: "Do you have a library card?"
    distractors: ["Do you have a book?", "Where is the library card?", "Do you want a library card?"]
    accepted_answers: [{value: "Do you have a library card?", status: correct}]
    feedback: "*کارت کتابخونه دارید؟* means 'Do you have a library card?'"
  fa.a1.unit42.lesson02.exercise03.match_library_two:
    instruction: "Match each word or phrase with its meaning."
