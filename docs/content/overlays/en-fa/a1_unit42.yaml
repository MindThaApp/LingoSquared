exercises:
  fa.a1.unit42.lesson01.exercise01.recognize_ketabkhune:
    instruction: "What does this word mean?"
    correct_option: library
    distractors: [book, card, appointment]
    accepted_answers: [{value: library, status: correct}]
    feedback: "*کتابخونه* means library."
  fa.a1.unit42.lesson01.exercise02.recognize_ketabkhune_kojast:
    instruction: "What does this phrase mean?"
    correct_option: "Where is the library?"
    distractors: ["Where is the book?", "Where is the dentist?", "What is the library?"]
    accepted_answers: [{value: "Where is the library?", status: correct}]
    feedback: "*کتابخونه کجاست؟* means 'Where is the library?'"
  fa.a1.unit42.lesson01.exercise03.match_library_one:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {کتابخونه: library, کتاب: book, کجاست: "where is", "کتابخونه کجاست؟": "Where is the library?", "کتاب کجاست؟": "Where is the book?", "می‌خوام": "I want"}
        status: correct
    feedback: "These are the first library words in this unit."
  fa.a1.unit42.lesson01.exercise04.word_order_ketabkhune_kojast:
    instruction: "Put the words in order."
    accepted_answers: [{value: [کتابخونه, کجاست], status: correct}]
    feedback: "*کتابخونه کجاست؟* means 'Where is the library?'"
  fa.a1.unit42.lesson01.exercise05.translate_ketab_kojast:
    instruction: "Translate into English: کتاب کجاست؟"
    answer_language_code: en
    accepted_answers:
      - {value: "Where is the book?", status: correct}
      - {value: "Where is the book", status: correct}
      - {value: "Where's the book?", status: correct}
      - {value: "Where's the book", status: correct}
      - {value: "Where is that book?", status: correct}
      - {value: "Where is that book", status: correct}
    feedback: "*کتاب کجاست؟* means 'Where is the book?'"

  fa.a1.unit42.lesson02.exercise01.recognize_amanat:
