review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), paired with the
    fa.a1.unit42.library realization review. No real bugs found. A
    recursive yaml.safe_load scan over title/gloss/note/example_gloss/
    instruction/correct_option/distractors/accepted_answers/feedback
    fields in both this overlay and the paired realization found zero
    stray boolean coercions; every "Translate into English" exercise
    correctly sets answer_language_code: en; the matching_pairs flat-dict
    accepted_answers shape matches this fa corpus's established
    convention; lesson04's dialogue_comprehension distractors are invented
    plausible-fact paraphrases, not lines either dialogue speaker actually
    says; every instruction coheres with its own answer data; the loan's
    due date and place (Tuesday, the library) are identical across the
    dialogue, the reading notice, and every exercise referencing them
    (lesson05.exercise05's writing_prompt accepting an alternate day is
    correct, open-ended creative writing, not a fact contradiction); no
    jargon leaks; the Iranian Farsi register and script are correct
    throughout. Re-validated as part of the full 4-unit (39-42) group: 0
    errors/0 warnings.

    Draft overlay paired with the fa.a1.unit42.library realization. See that
    file's generation_provenance for the honest source-access result: with
    Firecrawl at 0 credits this session, tried the Live Lingua-hosted FSI
    Persian Basic Course mirror via direct pdftotext (same method as units
    36-41), which re-confirmed its real OCR text layer (66,717 extractable
    words this fetch, consistent with every prior fetch). A thorough grep
    for library/book/borrow/lend/return/librarian/due date/overdue/ketab/
    ketabkhane/qarz/amanat found two real but partial hits: an isolated
    Classroom Expressions glossary entry translating "library, bookstore"
    as /ketabxane/ with no surrounding scenario, and a genuine but
    unrelated classroom-drill dialogue teaching /pas dadan/ ("to give
    back") via a teacher asking a student to hand a book back in class --
    not a library checkout/due-date scenario. No borrowing transaction,
    library card, due date, or librarian exchange exists anywhere in the
    extracted text -- a real, honest dead end for this outcome, same
    conclusion as unit41's own search. All vocabulary and dialogue in this
    unit is authored fresh from this project's own established colloquial
    Iranian Farsi conventions and already-shipped vocabulary. Reuse chain:
    کجاست (unit05), کتاب (unit03/13/24/37), کارت (unit08, there "payment
    card," extended here to "library card"), دارید (units01/04/06/08/21),
    می‌خوام (units03/08), کی (units16/34), می‌دم (unit26, there "I feed"),
    سه‌شنبه (unit10), and the full greeting/politeness set (سلام/ممنون/
    باشه/بله/بفرمایید/خواهش می‌کنم/خداحافظ, units01/02/05/06/16/17/22).
    New vocabulary genuinely introduced for the first time in the whole
    corpus: کتابخونه (library), امانت (loan / on-loan), and one new minor
    character صادقی (آقای صادقی, a librarian, kept separate from unit40's
    own آقای کریمی). Two words are deliberately given a new sense beyond
    their existing corpus meaning: پس (already "so/then," units 04/07/12;
    used here in its equally common "back" sense, precedented by the FSI
    /pas dadan/ classroom-drill hit) and تا (already the counting
    classifier, units 03/04/06/19/24; used here in its equally common
    "until" sense) -- both flagged for reviewer attention, same class as
    unit41's own وقت polysemy extension. Deliberate grammar-simplicity
    choice matching unit41's own precedent: no new verb conjugation for
    "to borrow" (کتاب امانت می‌خوام reuses the existing می‌خوام + noun
    pattern rather than a new گرفتن conjugation), and این/رو (object
    marker) are avoided throughout for the same reason unit41 avoided
    them. Register note: the librarian-desk exchange uses the same
    polite/neutral service-call register unit22's phone lesson and
    unit41's dentist-office lesson already established, while نیما's own
    lines stay register-neutral. Day/place facts (Tuesday, the library)
    are kept identical across the dialogue, the reading confirmation
    note, and every exercise that references them, per
    AUTHORING_GUIDE.md #11. Every "Translate into English" exercise below
    explicitly sets answer_language_code: en. The one genuine two-clause
    sentence tested for translation (lesson04.exercise05, "ممنون. تا
    سه‌شنبه.") carries period-joined, comma-joined, and and-joined English
    variants per §12; lesson05's reading-note translation and lesson06's
    review sentence are single label-style sentences with paraphrase-
    variant accepted answers, matching unit41's own treatment of its
    comma-separated appointment note. No listen_type/listen_select/
    listen_order exercise is used anywhere in this unit (continuing the
    established text-based corpus-consistency pattern from units 19-41),
    so the same-speaker/same-audio distractor-collision bug class fixed
    2026-07-09 in the nl corpus (commit 148240e) cannot directly apply
    here -- verified anyway that lesson04's dialogue_comprehension
    distractors ("He wants to buy a book."/"He wants a library
    card."/"He wants directions to the library.") are plausible-fact
    alternatives, not lines either dialogue speaker (نیما or آقای صادقی)
    actually says anywhere in this unit's dialogue -- نیما's opening line
    is clearly a new-loan request (not a return of an already-held item),
    he never asks FOR a card (آقای صادقی asks him), and neither speaker
    ever asks for or gives directions to the library. Boolean-coercion
    check: ran a recursive yaml.safe_load scan over title/gloss/note/
    example_gloss/answer/matching-pair value fields (including
    matching_pairs right: values specifically) across both this overlay
    and the paired realization for bare yes/no/true/false/on/off string
    values or coerced booleans -- zero hits. Compiler validation, both
    standalone and against the full 42-unit en-fa A1 corpus with
    position-matched realization/overlay lists, confirmed 0 errors.

    Review 2026-10-21: 30 fixes (overlay 19, realization 11) - consistency 13 (internal unit references and English parentheticals removed from review-card targets and notes; realization dialogue_comprehension distractors synced to the overlay); english 6 (note wording for پس / تا / کارت / می‌دم, writing instructions reworded to say what to write, dialogue_response instruction, feedback wording); answer-mismatch 1 (wrap-up writing instruction did not cover 'کی پس می‌دم؟'; now worded to include asking); missing-variants 8 (translations accept 'should I return', 'by Tuesday', 'Have you got', clinic/at the library forms; dialogue_response gets all joins; wrap-up accepts every weekday); feedback asterisks added. No script/ZWNJ problems found. Audio unchanged (all media_assets already pending_generation). NATIVE FLAGS: (1) 'کتاب امانت می‌خوام' - confirm it is natural for 'I want to borrow a book' (vs 'امانت بگیرم'); (2) 'ممنون. تا سه‌شنبه.' as the librarian's due-date line - confirm it reads as a natural spoken line; (3) 'کارت کتابخونه' vs 'کارت عضویت'.

course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: using the library -- locating it, asking to
    borrow a book, confirming you have a library card, asking and stating
    when it's due back, a full librarian-desk dialogue, and reading/writing
    a short loan-confirmation note.

units:
  fa.a1.unit42.library:
    title: "The library"

lessons:
  fa.a1.unit42.lesson01.new_library_one: {title: "New words 1"}
  fa.a1.unit42.lesson02.new_library_two: {title: "New words 2"}
  fa.a1.unit42.lesson03.when_giving_back: {title: "When do I give it back?"}
  fa.a1.unit42.lesson04.library_desk_dialogue: {title: "Dialogue: borrowing a book"}
  fa.a1.unit42.lesson05.reading_library_note: {title: "Reading a library loan note"}
  fa.a1.unit42.lesson06.wrap_up: {title: "Wrap-up"}

