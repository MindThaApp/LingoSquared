  fa.a1.unit27.lesson01.football_basketball: {title: "Football and basketball"}
  fa.a1.unit27.lesson02.volleyball_swimming: {title: "Volleyball and swimming"}
  fa.a1.unit27.lesson03.places: {title: "Where do you exercise?"}
  fa.a1.unit27.lesson04.frequency: {title: "How many times a week?"}
  fa.a1.unit27.lesson05.reading_about_nimas_routine: {title: "Reading about Nima's sports"}
  fa.a1.unit27.lesson06.comparing_sports_dialogue: {title: "Dialogue: What sport do you like?"}

teaching:
  fa.a1.unit27.lesson01.teach.man_review:
    title: I
    gloss: I
    note: "*من*, already well established, reappears here for talking about your own sport."
  fa.a1.unit27.lesson01.teach.varzesh_review:
    title: Sport / exercise
    gloss: sport / exercise
    note: "*ورزش*, already taught back in unit24's hobbies vocabulary, is the general word for 'sport' or 'exercise' and anchors this whole unit."
    example_gloss: "Exercise is good."
  fa.a1.unit27.lesson01.teach.mikonam_review:
    title: I do
    gloss: I do
    note: "*می‌کنم*, already taught back in unit24, is the verb 'to do' -- used throughout this unit for playing/doing a sport."
  fa.a1.unit27.lesson01.teach.footbal_review:
    title: Football
    gloss: football
    note: "*فوتبال*, already taught back in unit24, reappears here as the unit's first named sport."
    example_gloss: "Football is a sport."
  fa.a1.unit27.lesson01.teach.bazi_mikonam_review:
    title: "I play football"
    gloss: "I play football"
    note: "*فوتبال بازی می‌کنم*, already taught back in unit24, means 'I play football' -- *بازی* means 'play/game.'"
  fa.a1.unit27.lesson01.teach.basketball_word:
    title: Basketball
    gloss: basketball
    note: "*بسکتبال* is a direct, everyday loanword for basketball."
    example_gloss: "I like basketball."
  fa.a1.unit27.lesson01.teach.basketball_bazi_mikonam_phrase:
    title: "I play basketball"
    gloss: "I play basketball"
    note: "*بسکتبال بازی می‌کنم* follows the exact same pattern as *فوتبال بازی می‌کنم* -- just swap the sport."

  fa.a1.unit27.lesson02.teach.volleyball_word:
    title: Volleyball
    gloss: volleyball
    note: "*والیبال* is a direct, everyday loanword for volleyball."
    example_gloss: "He/she likes volleyball."
  fa.a1.unit27.lesson02.teach.volleyball_bazi_mikonam_phrase:
    title: "I play volleyball"
    gloss: "I play volleyball"
    note: "*والیبال بازی می‌کنم* follows the same *بازی می‌کنم* pattern as football and basketball."
  fa.a1.unit27.lesson02.teach.shena_word:
    title: Swimming
    gloss: swimming
    note: "*شنا* means 'swimming' -- unlike football/basketball/volleyball, it pairs directly with *می‌کنم*, not *بازی می‌کنم*, since it isn't a ball game."
    example_gloss: "I like swimming."
  fa.a1.unit27.lesson02.teach.shena_mikonam_phrase:
    title: I swim
    gloss: I swim
    note: "*شنا می‌کنم* means 'I swim,' literally 'I do swimming.'"
  fa.a1.unit27.lesson02.teach.che_review:
    title: What
    gloss: what
    note: "*چه*, already taught back in unit24's *چه خوب!*, is used here in a new question pattern."
  fa.a1.unit27.lesson02.teach.doost_dari_review:
    title: "Do you like"
    gloss: "do you like"
    note: "*دوست داری*, already taught back in unit14, reappears here to ask about sports."
  fa.a1.unit27.lesson02.teach.che_varzeshi_phrase:
    title: "What sport do you like?"
    gloss: "what sport do you like?"
    note: "*چه ورزشی دوست داری؟* combines *چه* + *ورزش* + the attributive *-ی* ending (making 'which sport') with *دوست داری* -- the natural way to ask someone what sport they like."

  fa.a1.unit27.lesson03.teach.koja_review:
    title: Where
    gloss: where
    note: "*کجا*, already taught back in unit02, works the same way here to ask about a sport location."
  fa.a1.unit27.lesson03.teach.koja_varzesh_mikoni_phrase:
    title: "Where do you exercise?"
    gloss: "where do you exercise?"
    note: "*کجا ورزش می‌کنی؟* combines *کجا* with *ورزش* and the 2nd-person form of *می‌کنم*."
  fa.a1.unit27.lesson03.teach.mieram_review:
    title: I go
    gloss: I go
    note: "*می‌رم*, already taught back in unit24's *می‌رم سینما*, reappears here for going to a sports place."
  fa.a1.unit27.lesson03.teach.bashgah_word:
    title: Gym
    gloss: gym
    note: "*باشگاه* means 'gym' or 'club.' Following unit24's own *می‌رم سینما* pattern, no preposition is needed -- just *می‌رم* + the place."
    example_gloss: "I go to the gym."
  fa.a1.unit27.lesson03.teach.estakhr_word:
    title: Pool
    gloss: pool
    note: "*استخر* means 'swimming pool.'"
    example_gloss: "I go to the pool and swim."
  fa.a1.unit27.lesson03.teach.park_word:
    title: Park
    gloss: park
    note: "*پارک* is a direct loanword for 'park.'"
    example_gloss: "I go to the park and play football."

  fa.a1.unit27.lesson04.teach.har_rooz_review:
    title: Every day
    gloss: every day
    note: "*هر روز*, already taught back in unit11, reappears here for sport frequency."
  fa.a1.unit27.lesson04.teach.har_hafte_review:
    title: Every week
    gloss: every week
    note: "*هر هفته*, already taught back in unit24, reappears here."
  fa.a1.unit27.lesson04.teach.gahi_review:
    title: Sometimes
    gloss: sometimes
    note: "*گاهی*, already taught back in unit24, reappears here."
  fa.a1.unit27.lesson04.teach.baar_word:
    title: "Time(s) / occurrence"
    gloss: "time(s) / occurrence"
    note: "*بار* is a counter word for 'time(s)' or 'occurrence(s),' used with a number to say how often."
    example_gloss: "I exercise once."
  fa.a1.unit27.lesson04.teach.do_se_review:
    title: "Two / three"
    gloss: "two / three"
    note: "*دو* and *سه*, already taught back in unit03's numbers, are used here to count how many times."
  fa.a1.unit27.lesson04.teach.do_baar_phrase:
    title: Twice
    gloss: twice
    note: "*دو بار* combines *دو* (two) with *بار* -- 'twice' or 'two times.'"
  fa.a1.unit27.lesson04.teach.se_baar_phrase:
    title: "Three times"
    gloss: "three times"
    note: "*سه بار* combines *سه* (three) with *بار* -- 'three times.'"
  fa.a1.unit27.lesson04.teach.har_hafte_do_baar_phrase:
    title: "I exercise twice every week"
    gloss: "I exercise twice every week"
    note: "*هر هفته دو بار ورزش می‌کنم* strings together everything in this lesson: 'every week,' 'twice,' and 'I exercise.'"

  fa.a1.unit27.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: "*نیما*, established as a character back in unit11, reappears here."
    example_gloss: "Nima likes sports."
  fa.a1.unit27.lesson05.teach.dare_review:
    title: "He/she has / likes"
    gloss: "he/she has / likes"
    note: "*داره*, already taught back in unit04's family vocabulary (*دارم* 'I have'), is the he/she form; in *ورزش دوست داره* it means 'he/she likes sport.'"
  fa.a1.unit27.lesson05.teach.mikone_review:
    title: "He/she does"
    gloss: "he/she does"
    note: "*می‌کنه*, already glimpsed in unit24's reading passage, is the 3rd-person colloquial form of *می‌کنم*."
  fa.a1.unit27.lesson05.teach.mire_word:
    title: "He/she goes"
    gloss: "he/she goes"
    note: "*می‌ره* is the 3rd-person colloquial form of the same verb as lesson03's *می‌رم* (I go)."
  fa.a1.unit27.lesson05.teach.ham_review:
    title: Also / too
    gloss: also / too
    note: "*هم*, already taught back in unit24, means 'also' or 'too.'"
  fa.a1.unit27.lesson05.teach.va_review:
    title: And
    gloss: and
    note: "*و* means 'and' -- already used this way back in unit05/14/24/25/26."
  fa.a1.unit27.lesson05.teach.reading_text:
    title: "Reading: Nima's sports"
    gloss: "Nima likes sports. He plays football three times every week. He also sometimes goes to the pool and swims."
    note: "This reading reuses every construction from lessons 1-4 plus lesson05's own *می‌ره* -- almost no new vocabulary, just recognizing it in connected text."

  fa.a1.unit27.lesson06.teach.dam_review:
    title: "I have / like"
    gloss: "I have / like"
    note: "*دارم*, already taught back in unit04's family vocabulary and unit14's *دوست دارم*, reappears here."
  fa.a1.unit27.lesson06.teach.are_review:
    title: Yeah
    gloss: yeah
    note: "*آره*, already taught back in unit04, is the everyday colloquial word for 'yes.'"
  fa.a1.unit27.lesson06.teach.tochi_review:
    title: "What about you?"
    gloss: "what about you?"
    note: "*تو چی؟*, already taught back in unit24's dialogue, reappears here to ask the question back. *تو* on its own is the informal 'you.'"
  fa.a1.unit27.lesson06.teach.chekhoob_review:
    title: "How nice!"
    gloss: "how nice!"
    note: "*چه خوب!*, already taught back in unit24, is a natural reaction here too."
  fa.a1.unit27.lesson06.teach.miri_word:
    title: You go
    gloss: you go
    note: "*می‌ری* is the 2nd-person informal form of the same verb as lesson03's *می‌رم* (I go) and lesson05's *می‌ره* (he/she goes)."
  fa.a1.unit27.lesson06.teach.aaleeye_word:
    title: "Great / excellent"
    gloss: "great / excellent"
    note: "*عالیه* is a common colloquial way to say 'great' or 'excellent.'"
    example_gloss: "This gym is great."
  fa.a1.unit27.lesson06.teach.dialogue_line1:
    title: "Nima: What sport do you like?"
    gloss: "What sport do you like?"
  fa.a1.unit27.lesson06.teach.dialogue_line2:
    title: "Sara: I like swimming. I go to the pool three times every week. What about you?"
    gloss: "I like swimming. I go to the pool three times every week. What about you?"
  fa.a1.unit27.lesson06.teach.dialogue_line3:
    title: "Nima: I like football. I go to the park and play every day."
    gloss: "I like football. I go to the park and play every day."
  fa.a1.unit27.lesson06.teach.dialogue_line4:
    title: "Sara: How nice! Do you also go to the gym?"
    gloss: "How nice! Do you also go to the gym?"
  fa.a1.unit27.lesson06.teach.dialogue_line5:
    title: "Nima: Yeah, sometimes I go to the gym too."
    gloss: "Yeah, sometimes I go to the gym too."
  fa.a1.unit27.lesson06.teach.dialogue_line6:
    title: "Sara: Great!"
    gloss: "Great!"

exercises:
  fa.a1.unit27.lesson01.exercise01.recognize_basketball:
    instruction: "What does this word mean?"
    correct_option: basketball
    distractors: [football, "sport / exercise", "play / game"]
    accepted_answers: [{value: basketball, status: correct}]
    feedback: "بسکتبال means basketball."
  fa.a1.unit27.lesson01.exercise02.recognize_varzesh:
    instruction: "What does this word mean?"
    correct_option: "sport / exercise"
    distractors: [football, basketball, "play / game"]
    accepted_answers: [{value: "sport / exercise", status: correct}]
    feedback: "ورزش means 'sport' or 'exercise.'"
  fa.a1.unit27.lesson01.exercise03.match_ball_sports_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {ورزش: "sport / exercise", فوتبال: football, بسکتبال: basketball, بازی: "play / game", "فوتبال بازی می‌کنم": "I play football.", "بسکتبال بازی می‌کنم": "I play basketball."}
        status: correct
    feedback: "These cover the basics of naming sports, plus saying which one you play."
  fa.a1.unit27.lesson01.exercise04.word_order_i_play_basketball:
    instruction: "Put the words in order."
    accepted_answers: [{value: [من, بسکتبال, بازی, "می‌کنم"], status: correct}]
    feedback: "من بسکتبال بازی می‌کنم means 'I play basketball.'"
  fa.a1.unit27.lesson01.exercise05.translate_i_play_football:
    instruction: "Translate into English: فوتبال بازی می‌کنم"
    answer_language_code: en
    accepted_answers:
      - {value: "I play football", status: correct}
      - {value: "I play football.", status: correct}
      - {value: "I play soccer", status: correct}
      - {value: "I play soccer.", status: correct}
      - {value: "I am playing football", status: correct}
      - {value: "I'm playing football", status: correct}
    feedback: "فوتبال بازی می‌کنم means 'I play football.'"

  fa.a1.unit27.lesson02.exercise01.recognize_volleyball:
    instruction: "What does this word mean?"
    correct_option: volleyball
    distractors: [swimming, basketball, football]
    accepted_answers: [{value: volleyball, status: correct}]
    feedback: "والیبال means volleyball."
  fa.a1.unit27.lesson02.exercise02.recognize_shena:
    instruction: "What does this word mean?"
    correct_option: swimming
    distractors: [volleyball, basketball, football]
    accepted_answers: [{value: swimming, status: correct}]
    feedback: "شنا means swimming."
  fa.a1.unit27.lesson02.exercise03.match_more_sports_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {ورزش: "sport / exercise", فوتبال: football, بسکتبال: basketball, والیبال: volleyball, شنا: swimming, بازی: "play / game"}
        status: correct
    feedback: "This reviews the ball sports alongside swimming."
  fa.a1.unit27.lesson02.exercise04.word_order_i_play_volleyball:
    instruction: "Put the words in order."
    accepted_answers: [{value: [من, والیبال, بازی, "می‌کنم"], status: correct}]
    feedback: "من والیبال بازی می‌کنم means 'I play volleyball.'"
  fa.a1.unit27.lesson02.exercise05.translate_what_sport_do_you_like:
    instruction: "Translate into Farsi: What sport do you like?"
    accepted_answers:
      - {value: "چه ورزشی دوست داری؟", status: correct}
      - {value: "چه ورزشی دوست داری", status: correct}
      - {value: "تو چه ورزشی دوست داری؟", status: correct}
      - {value: "تو چه ورزشی دوست داری", status: correct}
    feedback: "چه ورزشی دوست داری؟ means 'What sport do you like?'"

  fa.a1.unit27.lesson03.exercise01.recognize_bashgah:
    instruction: "What does this word mean?"
    correct_option: gym
    distractors: [pool, park, football]
    accepted_answers: [{value: gym, status: correct}]
    feedback: "باشگاه means gym."
  fa.a1.unit27.lesson03.exercise02.recognize_estakhr:
    instruction: "What does this word mean?"
    correct_option: pool
    distractors: [gym, park, swimming]
    accepted_answers: [{value: pool, status: correct}]
    feedback: "استخر means pool."
  fa.a1.unit27.lesson03.exercise03.match_places_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {فوتبال: football, بسکتبال: basketball, والیبال: volleyball, شنا: swimming, باشگاه: gym, استخر: pool, پارک: park}
        status: correct
    feedback: "These combine sports with the places you do them."
  fa.a1.unit27.lesson03.exercise04.word_order_i_go_to_the_gym:
    instruction: "Put the words in order."
    accepted_answers: [{value: ["می‌رم", باشگاه], status: correct}]
    feedback: "می‌رم باشگاه means 'I go to the gym.'"
  fa.a1.unit27.lesson03.exercise05.translate_i_go_to_the_pool:
    instruction: "Translate into English: می‌رم استخر"
    answer_language_code: en
    accepted_answers:
      - {value: "I go to the pool", status: correct}
      - {value: "I go to the pool.", status: correct}
      - {value: "I am going to the pool", status: correct}
      - {value: "I'm going to the pool", status: correct}
      - {value: "I go to the swimming pool", status: correct}
    feedback: "می‌رم استخر means 'I go to the pool.'"

  fa.a1.unit27.lesson04.exercise01.recognize_baar:
    instruction: "What does this word mean?"
    correct_option: "time(s) / occurrence"
    distractors: ["every day", "every week", sometimes]
    accepted_answers: [{value: "time(s) / occurrence", status: correct}]
    feedback: "بار means 'time(s)' or 'occurrence(s),' used with a number."
  fa.a1.unit27.lesson04.exercise02.recognize_gahi:
    instruction: "What does this word mean?"
    correct_option: sometimes
    distractors: ["every day", "every week", "time(s) / occurrence"]
    accepted_answers: [{value: sometimes, status: correct}]
    feedback: "گاهی means sometimes."
  fa.a1.unit27.lesson04.exercise03.match_frequency_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"هر روز": "every day", "هر هفته": "every week", گاهی: sometimes, بار: "time(s)", "دو بار": twice, "سه بار": "three times", ورزش: "sport / exercise", "می‌کنم": "I do"}
        status: correct
    feedback: "These combine to describe how often you do a sport."
  fa.a1.unit27.lesson04.exercise04.word_order_twice_a_week:
    instruction: "Put the words in order."
    accepted_answers: [{value: ["هر", هفته, دو, بار, ورزش, "می‌کنم"], status: correct}]
    feedback: "هر هفته دو بار ورزش می‌کنم means 'I exercise twice every week.'"
  fa.a1.unit27.lesson04.exercise05.translate_sometimes_i_swim:
    instruction: "Translate into English: گاهی شنا می‌کنم"
    answer_language_code: en
    accepted_answers:
      - {value: "Sometimes I swim", status: correct}
      - {value: "Sometimes I swim.", status: correct}
      - {value: "I sometimes swim", status: correct}
      - {value: "I sometimes swim.", status: correct}
      - {value: "Sometimes I go swimming", status: correct}
      - {value: "Sometimes I go swimming.", status: correct}
    feedback: "گاهی شنا می‌کنم means 'Sometimes I swim.'"

  fa.a1.unit27.lesson05.exercise01.reading_comprehension_football_frequency:
    instruction: "How often does Nima play football?"
    correct_option: "Three times a week"
    distractors: ["Every day", "Once a week", "Never"]
    accepted_answers: [{value: "Three times a week", status: correct}]
    feedback: "هر هفته سه بار فوتبال بازی می‌کنه -- Nima plays football three times every week."
  fa.a1.unit27.lesson05.exercise02.reading_comprehension_where_swims:
    instruction: "Where does Nima sometimes go to swim?"
    correct_option: "The pool"
    distractors: ["The gym", "The park", "The beach"]
    accepted_answers: [{value: "The pool", status: correct}]
    feedback: "گاهی هم می‌ره استخر و شنا می‌کنه -- he sometimes goes to the pool and swims."
  fa.a1.unit27.lesson05.exercise03.match_reading_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {فوتبال: football, شنا: swimming, باشگاه: gym, استخر: pool, پارک: park, "هر هفته": "every week", "سه بار": "three times", "می‌ره": "he/she goes"}
        status: correct
    feedback: "These words all appear in the reading passage."
  fa.a1.unit27.lesson05.exercise04.translate_nima_plays_football:
    instruction: "Translate into Farsi: Nima plays football three times every week."
    accepted_answers:
      - {value: "نیما هر هفته سه بار فوتبال بازی می‌کنه", status: correct}
    feedback: "نیما هر هفته سه بار فوتبال بازی می‌کنه means 'Nima plays football three times every week.'"
  fa.a1.unit27.lesson05.exercise05.write_own_sport:
    instruction: "Write a true sentence about a sport you do."
    accepted_answers:
      - {value: "من فوتبال بازی می‌کنم", status: correct}
      - {value: "من بسکتبال بازی می‌کنم", status: correct}
      - {value: "من والیبال بازی می‌کنم", status: correct}
      - {value: "من شنا می‌کنم", status: correct}
