course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: naming sports (football, basketball,
    volleyball, swimming), asking "What sport do you like?", saying
    where you do a sport (gym, pool, park), talking about how often (every
    day, every week, sometimes, N times), a short reading passage about
    نیما's sports routine, and a closing dialogue between نیما and سارا
    comparing which sports they each do, how often, and where.

units:
  fa.a1.unit27.sports:
    title: Sports

