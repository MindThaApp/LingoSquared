course:
  title: Farsi A1
  description: >-
    Beginner Iranian Farsi: money vocabulary, exchanging currency,
    withdrawing cash from an ATM, asking for change, and asking an
    exchange rate.

units:
  fa.a1.unit21.money:
    title: Money and Banking

lessons:
  fa.a1.unit21.lesson01.money_vocabulary: {title: "Money vocabulary"}
  fa.a1.unit21.lesson02.exchanging_currency: {title: "Exchange currency"}
  fa.a1.unit21.lesson03.atm_withdrawal: {title: "Withdraw cash from an ATM"}
  fa.a1.unit21.lesson04.asking_for_change: {title: "Ask for change"}
  fa.a1.unit21.lesson05.asking_the_rate: {title: "Ask the exchange rate"}
  fa.a1.unit21.lesson06.bank_dialogue: {title: "A full bank conversation"}

teaching:
  fa.a1.unit21.lesson01.teach.money_word:
    title: "Money"
    gloss: "money"
    note: "پول is the general word for money."
    example_gloss: "Where is my money?"
  fa.a1.unit21.lesson01.teach.bank_word:
    title: "Bank"
    gloss: "bank"
    note: "بانک is the general word for bank."
    example_gloss: "The bank is nearby."
  fa.a1.unit21.lesson01.teach.dollar_word:
    title: "Dollar"
    gloss: "dollar"
    note: "دلار is the word for (US) dollar, the most common foreign currency referenced in everyday exchange conversations."
    example_gloss: "I have dollars."
  fa.a1.unit21.lesson01.teach.exchange_word:
    title: "Exchange"
    gloss: "exchange"
    note: "تبدیل means exchange/convert, used with کردن (to do) as تبدیل کردن."
    example_gloss: "I want to exchange (money)."
  fa.a1.unit21.lesson01.teach.va_word:
    title: "And"
    gloss: "and"
    note: "و is the common connecting word, review from earlier units."

  fa.a1.unit21.lesson02.teach.want_exchange:
    title: "Say you want to exchange currency"
    gloss: "I want to exchange dollars to toman."
    note: "می‌خوام دلار به تومن تبدیل کنم uses به (to) to mark the target currency."
  fa.a1.unit21.lesson02.teach.how_much_dollar:
    title: "Ask how many dollars"
    gloss: "How many dollars do you have?"
    note: "چقدر دلار دارید؟ uses چقدر (how much/many), a review word from earlier quantity contexts."

  fa.a1.unit21.lesson03.teach.atm_word:
    title: "ATM"
    gloss: "ATM"
    note: "خودپرداز literally means self-server/self-payer, the standard word for an ATM machine."
    example_gloss: "The ATM is over there."
  fa.a1.unit21.lesson03.teach.withdraw_phrase:
    title: "Say you want to withdraw money"
    gloss: "I want to withdraw money from the ATM."
    note: "می‌خوام از خودپرداز پول بردارم uses از (from) and بردارم (I withdraw/take out)."

  fa.a1.unit21.lesson04.teach.change_question:
    title: "Ask for change"
    gloss: "Do you have change?"
    note: "پول خرد دارید؟ uses خرد (small/change) after پول (money)."
  fa.a1.unit21.lesson04.teach.here_you_are:
    title: "Here you are (review)"
    gloss: "here you are / go ahead"
    note: "بفرمایید was introduced in the greetings unit; here it's used handing something over."

  fa.a1.unit21.lesson05.teach.rate_word:
    title: "Rate"
    gloss: "rate"
    note: "نرخ is the word for (exchange) rate."
    example_gloss: "What's today's rate?"
  fa.a1.unit21.lesson05.teach.per_dollar_rate:
    title: "State a per-dollar rate"
    gloss: "Each dollar is 30 toman."
    note: "هر دلار سی تومنه uses هر (each) and the colloquial -e contraction (تومنه = تومن است) already established in unit08."

  fa.a1.unit21.lesson06.teach.hundred_word:
    title: "Hundred"
    gloss: "hundred"
    note: "صد is the number 100."
    example_gloss: "I have a hundred dollars."
  fa.a1.unit21.lesson06.teach.please_do:
    title: "Please do (it)"
    gloss: "please exchange (it)"
    note: "لطفاً تبدیل کنید is the polite imperative form of تبدیل کردن."
  fa.a1.unit21.lesson06.teach.turn01:
    title: "Sara asks to exchange currency"
    gloss: "Sara greets the clerk and says she wants to exchange dollars to toman."
    note: "Reuses lesson02's می‌خوام دلار به تومن تبدیل کنم."
  fa.a1.unit21.lesson06.teach.turn02:
    title: "The clerk asks how many dollars"
    gloss: "The clerk greets Sara and asks how many dollars she has."
    note: "Reuses lesson02's چقدر دلار دارید؟"
  fa.a1.unit21.lesson06.teach.turn03:
    title: "Sara states the amount and asks the rate"
    gloss: "Sara says she has a hundred dollars and asks today's rate."
    note: "صد (hundred) is new; نرخ امروز چنده؟ reuses lesson05's rate question."
  fa.a1.unit21.lesson06.teach.turn04:
    title: "The clerk states the rate"
    gloss: "The clerk says each dollar is 30 toman."
    note: "Reuses lesson05's هر دلار سی تومنه."
  fa.a1.unit21.lesson06.teach.turn05:
    title: "Sara agrees and asks the clerk to proceed"
    gloss: "Sara agrees and asks the clerk to please exchange it."
    note: "لطفاً تبدیل کنید, taught earlier this lesson."
  fa.a1.unit21.lesson06.teach.turn06:
    title: "The clerk hands over the total"
    gloss: "Here you are, three thousand toman."
    note: "سه هزار تومن = 100 dollars x 30 toman/dollar. هزار (thousand) is new in this lesson."
  fa.a1.unit21.lesson06.teach.turn07:
    title: "Sara thanks the clerk and asks for change too"
    gloss: "Thank you. Do you also have change?"
    note: "Reuses lesson04's پول خرد دارید؟ with هم (also/too)."
  fa.a1.unit21.lesson06.teach.turn08:
    title: "The clerk confirms and hands it over"
    gloss: "Yes, here you are."
    note: "بله (yes) is a review word; بفرمایید closes the exchange."

exercises:
  fa.a1.unit21.lesson01.exercise01.recognize_money:
    instruction: "What does this word mean?"
    correct_option: money
    distractors: [bank, dollar, exchange]
    accepted_answers: [{value: money, status: correct}]
    feedback: "پول means money."
