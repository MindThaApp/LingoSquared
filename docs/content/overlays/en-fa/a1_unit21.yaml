    instruction: "What does this word mean?"
    correct_option: bank
    distractors: [money, dollar, exchange]
    accepted_answers: [{value: bank, status: correct}]
    feedback: "بانک means bank."
  fa.a1.unit21.lesson01.exercise03.recognize_dollar_reading:
    instruction: "What does this word mean?"
    correct_option: dollar
