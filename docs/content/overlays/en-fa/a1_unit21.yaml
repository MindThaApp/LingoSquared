    accepted_answers:
      - {value: {پول: money, بانک: bank, دلار: dollar, تبدیل: exchange, قیمت: price, تومن: toman, هزار: thousand}, status: correct}
    feedback: "These are this lesson's core money vocabulary, plus قیمت/تومن/هزار (price/toman/thousand), already taught in unit03."
  fa.a1.unit21.lesson01.exercise05.order_money_words:
    instruction: "Arrange the words to say money and bank."
    accepted_answers: [{value: [پول, و, بانک], status: correct}]
    feedback: "پول و بانک joins the two words with و."
