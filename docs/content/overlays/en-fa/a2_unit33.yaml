teaching:
  fa.a2.unit33.lesson01.teach.people:
    title: People
    gloss: I, Sara, Nima
    note: Sara and Nima are friends who talk about their habits. *من* is normally dropped because the verb ending already shows “I.”
    example_gloss:
    - I saw Nima.
    - Sara and Nima are friends.
  fa.a2.unit33.lesson01.teach.sport_words:
    title: Sport and hobby words
    gloss: running, swimming, exercising, reading books, gym, park
    note: 'Activities are named by a verbal noun ending in *-ن*: *دویدن* (running), *خوندن* (reading). Compounds use *کردن*: *شنا کردن*, *ورزش کردن*.'
    example_gloss:
    - I started running in the park.
    - I exercise at the gym.
  fa.a2.unit33.lesson01.teach.screen_food:
    title: Screen time and food words
    gloss: phone, television, soda, sweets, water, hour
    note: '*نگاه کردن* is the ordinary spoken verb for watching TV: *تلویزیون نگاه کردن*. The plural *شب‌ها* means “in the evenings, at night” as a habit.'
    example_gloss:
    - At night I watch TV for an hour.
    - I use my phone for an hour.
  fa.a2.unit33.lesson01.teach.time_words:
    title: Time and habit words
    gloss: every day, month, week, ago, from/since, any more, early, late, less
    note: '*از ماه پیش* means “since a month ago”; *پیش* after a time word means “ago.” *دیگه* with a negative verb means “any more.”'
    example_gloss:
    - Since a month ago I run every day.
    - Since last week I go to bed early at night.
  fa.a2.unit33.lesson01.teach.start_form:
    title: 'Starting: شروع کردم به + verbal noun'
    gloss: I started running; I started swimming
    note: 'To say you began a habit, use *شروع کردم به* followed by the verbal noun (the *-ن* form): *شروع کردم به دویدن*. Do not conjugate the second verb.'
  fa.a2.unit33.lesson01.teach.stop_form:
    title: 'Stopping: دیگه ... نمی‌کنم and ترک کردم'
    gloss: I no longer drink soda; I gave up sweets
    note: 'Two natural ways to stop: *دیگه* plus a negative present verb (*دیگه نمی‌دوم* = I no longer run), or *X رو ترک کردم* (I gave up X) with the definite object marker *رو*.'
  fa.a2.unit33.lesson02.teach.subjunctive_verbs:
    title: Verbs in the “wish” form
    gloss: that I sleep, wake up, run, eat/drink, call, go, do
    note: 'These endings (*-م*) follow *سعی* and *یادم رفت*. Compounds keep the noun and change the light verb: *ورزش کنم*, *زنگ بزنم*, *بیدار شم*.'
    example_gloss:
    - I want to run every day.
    - I have to wake up early.
  fa.a2.unit33.lesson02.teach.try_forget_words:
    title: Try and forget
    gloss: try, I forgot, that, yesterday, today
    note: '*یادم رفت* is built from *یاد* (memory) + *م* + *رفت*: “it went out of my memory.” The same frame works for any person: *یادش رفت*, *یادت رفت*.'
    example_gloss:
    - Yesterday I forgot to drink water.
    - Today I try to go to bed early.
  fa.a2.unit33.lesson02.teach.try_form:
    title: 'Trying: سعی می‌کنم / سعی کردم + subjunctive'
    gloss: I try to sleep early; I tried to wake up early
    note: '*سعی می‌کنم* is “I try / I am trying” and *سعی کردم* is “I tried.” The second verb is always in the *ب-* form with the same person ending, with no *به*: *سعی کردم زود بیدار شم*.'
  fa.a2.unit33.lesson02.teach.forget_form:
    title: 'Forgetting: یادم رفت (که) + subjunctive'
    gloss: I forgot to call; I forgot to drink water
    note: '*یادم رفت* plus the *ب-* form means “I forgot to do it.” The word *که* is optional in speech: *یادم رفت زنگ بزنم* = *یادم رفت که زنگ بزنم*.'
  fa.a2.unit33.lesson02.teach.subjunctive_shape:
    title: How the “wish” form is built
    gloss: ب + stem + personal ending
    note: 'Most verbs add *ب-* before the stem: *بدوم*, *بخورم*, *بخوابم*. Compound verbs put it on the light verb (*زنگ بزنم*) or use *کنم* and *شم*. In speech *بیدار بشم* is often shortened to *بیدار شم*.'
  fa.a2.unit33.lesson03.teach.four_frames:
    title: Four frames, four meanings
    gloss: started running / tried to run / forgot to run / no longer run
    note: 'The same activity changes meaning with the frame: *شروع کردم به دویدن* (I started), *سعی کردم بدوم* (I tried), *یادم رفت بدوم* (I forgot), *دیگه نمی‌دوم* (I no longer).'
  fa.a2.unit33.lesson03.teach.noun_or_subjunctive:
    title: Verbal noun or “wish” form?
    gloss: به + verbal noun vs. ب-form
    note: 'After *شروع کردم به* put the verbal noun (*شنا کردن*). After *سعی کردم* and *یادم رفت* put the personal *-م* form (*شنا کنم*). Do not mix them: *سعی کردم به شنا کردن* is wrong.'
  fa.a2.unit33.lesson03.teach.dige_negative:
    title: دیگه + negative means “not any more”
    gloss: I no longer watch TV at night
    note: '*دیگه* before a negative verb says that something used to happen and has stopped. Without *دیگه*, *نوشابه نمی‌خورم* is a general fact (“I don’t drink soda”), not a change.'
  fa.a2.unit33.lesson04.teach.questions:
    title: Questions about habits
    gloss: Since when did you start? What did you give up?
    note: 'The question ends in the *-ی* “you” form: *شروع کردی* = you started, *ترک کردی* = you gave up. Answer in the *-م* form.'
    example_gloss:
    - Since when did you start?
    - What did you give up?
  fa.a2.unit33.lesson04.teach.answer_since:
    title: Answering with a start time
    gloss: since a month ago I started running
    note: 'Put the time first: *از ماه پیش شروع کردم به دویدن*. For a stop, put the object first and use *رو*: *نوشابه رو ترک کردم*.'
  fa.a2.unit33.lesson05.teach.link_words:
    title: Linking words
    gloss: but, also, switched off
    note: '*هم* after a noun or verb phrase means “also.” *خاموش کردن* is “to switch off” and takes *رو* with a definite object.'
    example_gloss:
    - I switched the phone off.
    - I tried, but I forgot.
  fa.a2.unit33.lesson05.teach.reading_note:
    title: A changed-habits text
    gloss: ''
    note: Read once for the two changes (one started, two stopped), then again for what the speaker tries and what was forgotten.
  fa.a2.unit33.lesson06.teach.chat_words:
    title: Chat words
    gloss: how is it, it is good, well done, sorry, so, why, no, you drink, you did not call
    note: '*آفرین* praises a friend (“well done”). *ببخش* is the informal “sorry”; use *ببخشید* with strangers.'
    example_gloss:
    - How is the exercise going? Good!
    - So why did you not call?
  fa.a2.unit33.lesson06.teach.turn01:
    title: Sara asks about exercise
    gloss: 'Sara asks Nima: How is the exercise going?'
    note: The question opens the conversation about his new habits.
  fa.a2.unit33.lesson06.teach.turn02:
    title: Nima names what he started
    gloss: 'Nima: Good! A month ago I started running.'
    note: '*شروع کردم به* plus the verbal noun *دویدن*.'
  fa.a2.unit33.lesson06.teach.turn03:
    title: Sara praises and asks
    gloss: 'Sara: Well done! Do you drink soda too?'
    note: '*هم* means “also.”'
  fa.a2.unit33.lesson06.teach.turn04:
    title: Nima gave up soda
    gloss: 'Nima: No, I gave up soda. I also try to use my phone less.'
    note: One stop (*ترک کردم*) and one effort (*سعی می‌کنم*).
  fa.a2.unit33.lesson06.teach.turn05:
    title: Sara asks why no call
    gloss: 'Sara: So why did you not call yesterday?'
    note: The question uses the *-ی* “you” form.
  fa.a2.unit33.lesson06.teach.turn06:
    title: Nima admits he forgot
    gloss: 'Nima: Sorry, I forgot to call.'
    note: '*یادم رفت* plus the *ب-* form.'
