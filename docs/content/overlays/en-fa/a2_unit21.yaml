course:
  title: Farsi A2
  description: 'Lower-intermediate Iranian Farsi with a grammar spine: banking, opinions, appointments and more, now moving an appointment: saying you cannot come, proposing another day, giving a reason and agreeing a new time.'
units:
  fa.a2.unit21.reschedule_appointment:
    title: Rescheduling an appointment
lessons:
  fa.a2.unit21.lesson01.cant_come:
    title: I cannot come
  fa.a2.unit21.lesson02.another_day:
    title: Another day
  fa.a2.unit21.lesson03.giving_a_reason:
    title: Giving a reason
  fa.a2.unit21.lesson04.new_time:
    title: Agreeing a new time
  fa.a2.unit21.lesson05.reading_and_listening:
