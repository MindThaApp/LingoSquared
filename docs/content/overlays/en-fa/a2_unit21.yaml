teaching:
  fa.a2.unit21.lesson01.teach.appointment:
    title: Appointment, hairdresser's
    gloss: appointment, hairdresser's (salon)
    note: '*وقت* is both ''time'' and ''an appointment slot'': *وقت دارم* = ''I have an appointment'' (or ''I have time''). *آرایشگاه* is the hairdresser''s or beauty salon.'
    example_gloss:
    - On Thursday I have an appointment at the hairdresser's.
    - I have a doctor's appointment.
  fa.a2.unit21.lesson01.teach.change_cancel:
    title: To change, to cancel
    gloss: to change (an appointment), to cancel
    note: 'Both are verbs with *کردن*. The object *وقتم* takes *رو*: *وقتم رو عوض می‌کنم*. *کنسل کردن* is the everyday word for to cancel.'
    example_gloss:
    - I'm changing my appointment.
    - I'm cancelling my appointment.
  fa.a2.unit21.lesson01.teach.sorry:
    title: Unfortunately, sorry
    gloss: unfortunately, sorry
    note: '*متأسفانه* opens a polite refusal or bad news. *ببخشید* is the everyday ''excuse me / sorry''. *متأسفانه* is often typed *متاسفانه* without the hamza; both are accepted.'
    example_gloss:
    - Unfortunately I can't.
    - Sorry, can I come?
  fa.a2.unit21.lesson01.teach.cant_come_phrase:
    title: Unfortunately I can't come on Thursday.
    gloss: Unfortunately I can't come on Thursday.
    note: '*نمی‌تونم* (I can''t) takes the short verb *بیام* (from *اومدن*, to come). The day goes before the verb: *پنجشنبه نمی‌تونم بیام*.'
  fa.a2.unit21.lesson01.teach.can_change:
    title: Can I change my appointment?
    gloss: Can I change my appointment?
    note: '*می‌تونم* (I can) + the short verb *کنم*. This is the polite way to ask to move your appointment.'
  fa.a2.unit21.lesson01.teach.can_rule:
    title: Can and cannot + short verb
    gloss: I can come, I can't come, I can change
    note: '*می‌تونم* (I can) and *نمی‌تونم* (I can''t) are followed by the short *be-* form of the verb: *بیام* (come), *کنم* (do). Both verbs have the same ending (*-م*): *نمی‌تونم بیام*. For *you* (polite) both take *-ید*: *می‌تونید بیاید؟*'
  fa.a2.unit21.lesson02.teach.days:
    title: Another day, Saturday, Monday
    gloss: another day, Saturday, Monday
    note: '*دیگه* after a noun means ''another'' or ''more'': *یه روز دیگه* is ''another day''. Iranian weeks start on *شنبه* (Saturday).'
    example_gloss:
    - I have an appointment another day.
    - On Saturday I can't.
    - On Monday I have time.
  fa.a2.unit21.lesson02.teach.can_it_be:
    title: Can it be Monday?
    gloss: Can it be Monday?
    note: '*می‌شه* (is it possible) + the day + *باشه* (let it be). This is the usual way to propose another day: *می‌شه شنبه باشه؟*'
  fa.a2.unit21.lesson02.teach.suits_you:
    title: Does Saturday suit you?
    gloss: Does Saturday suit you? (polite)
    note: '*براتون مناسبه؟* asks whether something suits you. *براتون* is the polite *you*; with a friend you would say *برات مناسبه؟*'
  fa.a2.unit21.lesson02.teach.yes_fine:
    title: Yes, that's fine.
    gloss: Yes, that's fine.
    note: '*خوبه* (it''s good) is a short way to accept a time.'
  fa.a2.unit21.lesson02.teach.no_sorry:
    title: No, unfortunately not.
    gloss: No, unfortunately not.
    note: 'A polite way to refuse: *نه* plus *متأسفانه* softens the answer.'
  fa.a2.unit21.lesson02.teach.you_rule:
    title: Friendly and polite you
    gloss: Does it suit you? (friend / polite)
    note: 'With a friend the ending is *-ت*: *برات*. For a service desk or someone you do not know use *-تون*: *براتون*. In this unit the salon uses the polite form.'
  fa.a2.unit21.lesson03.teach.because:
    title: Because, I'm ill
    gloss: because, I'm ill
    note: '*چون* (because) joins the reason to the main clause: *نمی‌تونم بیام چون مریضم*. *مریضم* is *مریض* (ill) + *-م* (I am).'
    example_gloss:
    - I can't come because I'm ill.
    - Because I have work I can't.
  fa.a2.unit21.lesson03.teach.reason_work:
    title: Because I have to work.
    gloss: Because I have to work.
    note: '*باید* (must / have to) + the short verb *کنم*: *باید کار کنم*.'
  fa.a2.unit21.lesson03.teach.reason_other:
    title: Because I have another appointment.
    gloss: Because I have another appointment.
    note: '*یه وقت دیگه* is ''another appointment''.'
  fa.a2.unit21.lesson03.teach.reason_ill:
    title: Why can't you? Because I'm ill.
    gloss: Why can't you? Because I'm ill.
    note: '*چرا؟* asks why; a short reason starting with *چون* can stand alone as the answer. *نمی‌تونی* is the *you* form of *نمی‌تونم*.'
  fa.a2.unit21.lesson03.teach.sorry_trouble:
    title: Sorry for the trouble.
    gloss: Sorry for the trouble.
    note: '*بابت زحمت* means ''for the trouble''. Say it when you cause someone extra work, for example by moving an appointment.'
  fa.a2.unit21.lesson03.teach.reason_rule:
    title: Main clause, then the reason
    gloss: I can't come because I have to work.
    note: 'Put the refusal first and the reason after *چون*. A short answer can start with *چون*: *چرا نمی‌تونی؟* *چون مریضم.*'
  fa.a2.unit21.lesson04.teach.time_words:
    title: At ten o'clock, a day before
    gloss: ten o'clock, a day before
    note: 'Say the hour as *ساعت* + the number: *ساعت ده* (ten o''clock). *قبل* means ''before'': *یه روز قبل* is ''a day before''.'
    example_gloss:
    - Monday at ten is fine.
    - I'll call a day before.
  fa.a2.unit21.lesson04.teach.monday_ten:
    title: Monday at ten is fine.
    gloss: Monday at ten is fine.
    note: 'Day first, then the time: *دوشنبه ساعت ده*.'
  fa.a2.unit21.lesson04.teach.can_you_come:
    title: Can you come on Monday at ten?
    gloss: Can you come on Monday at ten? (polite)
    note: '*می‌تونید* and *بیاید* have the polite *you* ending *-ید*.'
  fa.a2.unit21.lesson04.teach.see_you:
    title: Then I'll see you on Monday.
    gloss: Then I'll see you on Monday. (polite)
    note: '*پس* (then) closes the arrangement; *می‌بینمتون* is ''I''ll see you'' (polite).'
  fa.a2.unit21.lesson04.teach.new_appointment:
    title: I'll make a new appointment.
    gloss: I'll make a new appointment.
    note: '*وقت گرفتن* (literally ''to take a time'') is the usual way to say you book an appointment.'
  fa.a2.unit21.lesson04.teach.time_rule:
    title: Day first, then the time
    gloss: Monday at ten
    note: 'Give the day first and then the hour, with no preposition: *دوشنبه ساعت ده*. If you add the verb it comes last: *دوشنبه ساعت ده بیاید*.'
  fa.a2.unit21.lesson05.teach.spot_time:
    title: Spot the day and the time
    gloss: Monday at ten, a day before
    note: When you read a message about an appointment, look for the day, the hour, and what you have to do if it does not suit you.
  fa.a2.unit21.lesson05.teach.reading_sms:
    title: A message from the salon
    gloss: Hello Mr Nima! Your appointment has been changed to Monday at ten. If this time does not suit you, please call a day before. We will make a new appointment.
    note: A short message from the salon. Read it once for the new time, then again for what to do if it does not suit.
  fa.a2.unit21.lesson06.teach.names:
    title: Nima, the salon
    gloss: Nima, the salon
    note: Nima, the friend from earlier units, phones the hairdresser's. The staff speaker is labelled *آرایشگاه*.
    example_gloss:
    - Nima phones the salon.
  fa.a2.unit21.lesson06.teach.please_great:
    title: Please go ahead, of course, you're welcome
    gloss: please go ahead, of course, you're welcome
    note: '*بفرمایید* is how someone answering the phone invites you to speak. *البته* means ''of course'', and *خواهش می‌کنم* answers ''thank you''.'
    example_gloss:
    - Salon, go ahead please.
    - Yes, of course.
    - Thank you. You're welcome.
  fa.a2.unit21.lesson06.teach.dlg1:
    title: The salon answers
    gloss: The salon answers the phone.
    note: 'A polite way to answer: the name of the place and *بفرمایید*.'
  fa.a2.unit21.lesson06.teach.dlg2:
    title: Nima explains and asks
    gloss: Nima says he has an appointment on Thursday but unfortunately cannot come, and asks whether he can change it.
    note: '*ولی* joins the appointment and the problem.'
  fa.a2.unit21.lesson06.teach.dlg3:
    title: The salon suggests Saturday
    gloss: The salon says yes, of course, and asks if Saturday suits him.
    note: The polite *براتون*.
  fa.a2.unit21.lesson06.teach.dlg4:
    title: Nima refuses and suggests Monday
    gloss: Nima says unfortunately not, because he has to work, and asks if it can be Monday.
    note: A refusal, a reason and a new proposal.
  fa.a2.unit21.lesson06.teach.dlg5:
    title: The salon agrees
    gloss: The salon says Monday at ten is fine.
    note: Day first, then time.
  fa.a2.unit21.lesson06.teach.dlg6:
    title: Nima thanks and apologises
    gloss: Nima says great, thank you, and sorry for the trouble.
    note: '*ببخشید بابت زحمت* is the polite closing apology.'
  fa.a2.unit21.lesson06.teach.dlg7:
    title: The salon closes
    gloss: The salon says you're welcome, and see you on Monday.
    note: '*خواهش می‌کنم* answers ''thank you''.'
  fa.a2.unit21.lesson06.teach.third_person:
    title: He can't come, she says
    gloss: he can't come, he/she says
    note: 'To report what someone else says or can do use the *he/she* endings: *نمی‌تونه* (he can''t), *می‌گه* (he/she says), and the short verb *بیاد* (come).'
    example_gloss:
    - Nima can't come on Thursday.
    - The salon says Monday at ten is fine.
