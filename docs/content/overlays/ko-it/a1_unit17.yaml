teaching:
  it.a1.unit17.lesson01.teach.il_lavoro:
    title: il lavoro
    gloss: 직업 / 일
    note: '*il lavoro*는 ''직업''과 일반적인 ''일''을 모두 뜻하는 남성 명사예요.'
    example_gloss:
    - 제 직업은 흥미로워요.
  it.a1.unit17.lesson01.teach.insegnante_commesso:
    title: insegnante, commesso
    gloss: 교사, 점원
    note: '*insegnante*(교사)는 남자와 여자에게 형태가 같아요. *commesso*(점원)는 남성형이고, 여성형은 *commessa*예요.'
    example_gloss:
    - 저는 점원이 아니라 교사예요.
  it.a1.unit17.lesson01.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: 무슨 일을 하세요?
    note: '*Che lavoro fai?*(직역하면 ''어떤 일을 해요?'')는 상대의 직업을 물을 때 쓰는 기본 표현이에요.'
  it.a1.unit17.lesson01.teach.sono_insegnante:
    title: Sono insegnante.
    gloss: 저는 교사예요.
    note: 이탈리아어는 수식어가 없는 직업 앞에는 관사를 쓰지 않아요. *Sono insegnante*라고 하고, *Sono un insegnante*라고는 하지 않아요.
  it.a1.unit17.lesson01.teach.sono_commesso:
    title: Sono commesso.
    gloss: 저는 점원이에요.
    note: '*Sono insegnante*와 마찬가지로 관사를 쓰지 않아요.'
  it.a1.unit17.lesson02.teach.ufficio_scuola:
    title: l'ufficio, la scuola
    gloss: 사무실, 학교
    note: '*l''ufficio*(사무실)는 모음 앞이라 관사가 축약돼요. *la scuola*(학교)는 여성명사예요.'
    example_gloss:
    - 저는 사무실에서 일해요.
    - 저는 학교에서 일해요.
  it.a1.unit17.lesson02.teach.dove_lavori:
    title: Dove lavori?
    gloss: 어디에서 일하세요?
    note: '*Dove*(어디)와 *lavori*(일해요, 친한 사이에 쓰는 ''너'' 형태)가 합쳐진 표현이에요.'
  it.a1.unit17.lesson02.teach.lavoro_in_un_ufficio:
    title: Lavoro in un ufficio.
    gloss: 저는 사무실에서 일해요.
    note: '*Lavoro in*(~에서 일해요)과 *un ufficio*(사무실)가 합쳐진 표현이에요.'
  it.a1.unit17.lesson02.teach.lavoro_in_una_scuola:
    title: Lavoro in una scuola.
    gloss: 저는 학교에서 일해요.
    note: '*una scuola*(학교)를 쓴 같은 패턴이에요.'
  it.a1.unit17.lesson03.teach.inizio_finisco:
    title: inizio, finisco
    gloss: 시작해요, 끝내요
    note: '*inizio*(시작해요)와 *finisco*(끝내요)는 *iniziare*와 *finire*의 1인칭 현재형이에요.'
    example_gloss:
    - 저는 9시에 시작해요.
    - 저는 5시에 끝내요.
  it.a1.unit17.lesson03.teach.a_che_ora_inizi:
    title: A che ora inizi?
    gloss: 몇 시에 시작하세요?
    note: '*A che ora*(몇 시에)와 *inizi*(시작해요, 친한 사이에 쓰는 ''너'' 형태)가 합쳐진 표현이에요.'
  it.a1.unit17.lesson03.teach.inizio_alle_nove_e_finisco_alle_cinque:
    title: Inizio alle nove e finisco alle cinque.
    gloss: 저는 9시에 시작해서 5시에 끝나요.
    note: '*alle nove* / *alle cinque*(9시에 / 5시에)처럼 시각 앞에는 *alle*를 써요. 5단원의 시각 표현에서 배운 것과 같아요.'
