teaching:
  it.a1.unit01.lesson01.teach.ciao_buongiorno:
    title: Ciao, Buongiorno
    gloss: 안녕, 좋은 아침
    note: '*Ciao*는 하루 중 언제든 친구나 또래끼리 쓰는 편한 만능 인사예요. *Buongiorno*는 아침부터 오후까지 쓸 수 있는, 좀 더 격식 있는 표준 낮 인사예요.'
    example_gloss:
    - 안녕, 잘 지내?
    - 좋은 아침이에요, 잘 지내세요?
  it.a1.unit01.lesson01.teach.come_stai_sta:
    title: come stai, come sta
    gloss: 잘 지내? (비격식), 잘 지내세요? (격식)
    note: '*come stai*는 *tu*(친구, 또래)와 함께 쓰고, *come sta*는 *Lei*(낯선 사람, 상사, 존중을 표해야 할 사람)와 함께 써요. 같은 질문이지만 말투가 달라요.'
    example_gloss:
    - 안녕, 오늘 어때?
    - 좋은 아침이에요, 오늘 어떠세요?
  it.a1.unit01.lesson01.teach.ciao_come_stai:
    title: Ciao, come stai?
    gloss: 안녕, 잘 지내?
    note: 친구, 반 친구, 또래에게 쓰는 편한 인사와 안부 질문이에요.
  it.a1.unit01.lesson01.teach.buongiorno_come_sta:
    title: Buongiorno, come sta?
    gloss: 좋은 아침이에요, 잘 지내세요?
    note: 격식 있는 표현으로, 새 동료의 상사처럼 존중해야 할 사람에게 써요.
  it.a1.unit01.lesson01.teach.register_rule:
    title: 'tu: informale · Lei: formale o rispettoso'
    gloss: 'tu: 비격식 · Lei: 격식 또는 존중'
    note: '*tu*는 친구, 반 친구, 또래 사이에서 쓰는 일상적인 ''너''예요. *Lei*는 낯선 사람, 직장의 위계, 처음 만나는 사람에게 쓰는 높임의 ''당신''이고, 동사 형태도 따로 있어요(*tu stai*와 *Lei sta*를 비교해 보세요).'
  it.a1.unit01.lesson02.teach.bene_grazie:
    title: Bene, grazie
    gloss: 잘 지내요, 고마워요
    note: 안부 질문에 대한 간단하고 중립적인 대답이에요. *e tu?*나 *e Lei?*를 붙이면 어느 말투에서든 쓸 수 있어요.
    example_gloss:
    - 잘 지내, 고마워. 너는?
    - 잘 지내요, 고맙습니다. 당신은요? (격식)
  it.a1.unit01.lesson02.teach.e_tu:
    title: E tu?
    gloss: 너는?
    note: 친구나 또래에게 같은 질문을 되묻는 편한 표현이에요.
  it.a1.unit01.lesson02.teach.e_lei:
    title: E Lei?
    gloss: 그쪽은요?
    note: '*Lei* 말투에 맞춰 격식 있게 되묻는 표현이에요.'
  it.a1.unit01.lesson02.teach.bene_grazie_e_tu:
    title: Bene, grazie, e tu?
    gloss: 잘 지내, 고마워. 너는?
    note: 친구나 또래에게 대답하고 되묻는 편한 표현이에요.
  it.a1.unit01.lesson02.teach.bene_grazie_e_lei:
    title: Bene, grazie, e Lei?
    gloss: 잘 지내요, 감사합니다. 당신은요?
    note: 존중해야 할 사람에게 대답하고 되묻는 격식 있는 표현이에요.
  it.a1.unit01.lesson02.teach.buonasera_buonanotte:
    title: Buonasera, Buonanotte
    gloss: 좋은 저녁, 잘 자요
    note: '*Buonasera*는 저녁에 어딘가에 도착했을 때 하는 인사예요. *Buonanotte*는 누군가 잠자리에 들거나 하루를 마칠 때 하는 작별 인사로, 만날 때 인사로는 절대 쓰지 않아요.'
    example_gloss:
    - 좋은 저녁이에요, 잘 지내세요?
    - 잘 자요, 내일 봐요.
  it.a1.unit01.lesson02.teach.arrivederla:
    title: Arrivederla, a domani.
    gloss: 안녕히 가세요, 내일 봐요.
    note: '*Arrivederla*는 *Lei*에게 쓰는 격식 있는 작별 인사로, 직장이나 낯선 사람에게 어울려요.'
  it.a1.unit01.lesson02.teach.ci_vediamo:
    title: Ciao, ci vediamo domani!
    gloss: 잘 가, 내일 보자!
    note: 다음 날 다시 볼 친구나 또래에게 쓰는 편한 작별 인사예요.
  it.a1.unit01.lesson03.teach.come_si_chiama:
    title: Come si chiama, scusi?
    gloss: 실례지만, 성함이 어떻게 되세요? (격식)
    note: '*Come si chiama?*는 직역하면 ''무엇이라고 불리세요?''라는 뜻으로, 격식 있는 *Lei* 말투예요. 낯선 사람에게 물을 때는 *scusi*(''실례합니다'')를 덧붙이면 자연스럽고 공손해요.'
  it.a1.unit01.lesson03.teach.come_ti_chiami:
    title: Come ti chiami?
    gloss: 이름이 뭐야? (비격식)
    note: 친구, 또래, 나이가 비슷한 사람에게 쓰는 편한 표현이에요.
  it.a1.unit01.lesson03.teach.mi_chiamo_elena:
    title: Mi chiamo Elena.
    gloss: 제 이름은 Elena예요.
    note: '*chiamarsi*는 ''~라고 불리다''라는 뜻이에요. 자기 이름을 말하는 기본 표현이고, 어느 말투에서든 쓸 수 있어요.'
  it.a1.unit01.lesson03.teach.io_sono_sam:
    title: Io sono Sam.
    gloss: 저는 Sam이에요.
    note: '*mi chiamo* 대신 쓸 수 있는 간단한 표현으로, *essere*(''이다'')에 이름을 바로 붙여요.'
  it.a1.unit01.lesson03.teach.piacere:
    title: Piacere, Piacere di conoscerla
    gloss: 반가워요, 만나서 반갑습니다 (격식)
    note: '*Piacere*만 말해도 어느 말투에서든 쓸 수 있는 짧고 흔한 ''만나서 반가워요''예요. *Piacere di conoscerla*는 *Lei*에게 쓰는 더 격식 있는 완전한 표현이에요.'
    example_gloss:
    - 반가워요, Sam!
    - 만나서 반갑습니다, Elena 씨.
  it.a1.unit01.lesson03.teach.benvenuto:
    title: Benvenuto in ufficio!
    gloss: 사무실에 오신 걸 환영해요!
    note: '*Benvenuto*는 ''환영''의 남성형이에요(남성에게 쓰고, 여성에게는 *Benvenuta*라고 해요).'
  it.a1.unit01.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: 정말 고마워요. / 대단히 감사합니다.
    note: 그냥 *Grazie*보다 더 강하고 힘주어 감사를 전하는 표현이에요.
