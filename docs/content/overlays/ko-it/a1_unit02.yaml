    note: 국적과 출신 도시를 함께 말해요.
  it.a1.unit02.lesson01.teach.sono_italiana_milano:
    title: Sono italiana, di Milano.
    gloss: 저는 이탈리아인이고, 밀라노 출신이에요.
    note: '*italiana*는 국적의 여성형이에요. 엘레나가 여성이라서 써요.'
  it.a1.unit02.lesson01.teach.nationalities:
    title: americano/americana, italiano/italiana
    gloss: 미국인(남/여), 이탈리아인(남/여)
    note: 이탈리아어에서 국적을 나타내는 단어는 설명하는 사람의 성별에 따라 어미가 바뀌어요. 남자는 *-o*, 여자는 *-a*예요 (*Sam è americano*, *Elena è italiana*). 한국어에는 없는 구분이에요.
    example_gloss:
    - 샘은 미국인이에요.
    - 엘레나는 이탈리아인이에요.
  it.a1.unit02.lesson02.teach.parli_italiano:
