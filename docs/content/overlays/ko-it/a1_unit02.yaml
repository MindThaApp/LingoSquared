    gloss: 이탈리아어 잘하네요!
    note: 상대방의 언어 실력을 칭찬하는 다정한 말로, 친근한 *tu* 형태를 써요.
  it.a1.unit02.lesson03.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: 무슨 일을 하세요?
    note: 편한 질문으로, *fare*(하다)의 *tu* 형태를 써요.
  it.a1.unit02.lesson03.teach.che_lavoro_fa:
