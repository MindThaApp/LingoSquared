teaching:
  it.a1.unit02.lesson01.teach.di_dove:
    title: di dove
    gloss: 어디 출신
    note: '*di dove*는 출신을 묻거나 말할 때 쓰는 기본 표현이에요. *sei*(친근한 말투) 또는 *è*(격식 있는 말투)와 함께 써요.'
    example_gloss:
    - 샘, 어디 출신이에요?
    - 엘레나 씨, 어디 출신이세요? (격식)
  it.a1.unit02.lesson01.teach.di_dove_sei:
    title: Di dove sei?
    gloss: 어디에서 오셨어요?
    note: 친구나 또래에게 쓰는 편한 질문으로, 1단원의 *tu*에 해당해요.
  it.a1.unit02.lesson01.teach.di_dov_e_lei:
    title: Di dov'è, Lei?
    gloss: 어디에서 오셨어요?
    note: 격식 있는 질문으로, 1단원의 *Lei*에 해당해요.
  it.a1.unit02.lesson01.teach.sono_americano_chicago:
    title: Sono americano, di Chicago.
