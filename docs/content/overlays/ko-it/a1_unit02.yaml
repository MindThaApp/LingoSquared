    gloss: 일 때문에 여기 왔어요.
    note: '*per lavoro*는 어딘가에 있는 이유를 설명해요. 관광이 아니라 일 때문이라는 뜻이에요.'
  it.a1.unit02.lesson03.teach.per_due_anni:
