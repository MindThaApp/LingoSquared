    gloss: 무슨 일을 하세요? (격식)
    note: 격식 있는 질문으로, *fare*의 *Lei* 형태를 써요.
  it.a1.unit02.lesson03.teach.sono_ingegnere:
    title: Sono ingegnere
    gloss: 저는 엔지니어예요
    note: 이탈리아어에서 직업을 말할 때는 보통 관사를 쓰지 않아요. *sono ingegnere*라고 하고, *sono un ingegnere*라고 하지 않아요.
    example_gloss: 저는 엔지니어예요. 밀라노에서 일해요.
  it.a1.unit02.lesson03.teach.sono_qui_per_lavoro:
