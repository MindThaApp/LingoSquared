    gloss: 잘됐네요, 밀라노에 온 걸 환영해요!
    note: '*Che bello*는 ''정말 좋다''라는 뜻으로, 기쁜 마음을 나타내는 흔한 반응이에요.'
  it.a1.unit02.lesson03.teach.grazie_mille_reprise:
