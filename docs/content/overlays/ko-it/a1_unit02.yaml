    gloss: 이탈리아어를 조금 해요
    note: 자신의 수준을 겸손하게 말하는 흔한 표현이에요. *un po'*는 '조금'이라는 뜻이에요.
    example_gloss: 이탈리아어를 조금 해요. 1년째 공부하고 있어요.
  it.a1.unit02.lesson02.teach.parlo_inglese:
