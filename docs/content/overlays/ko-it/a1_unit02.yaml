  it.a1.unit02.lesson02.teach.studio_da_un_anno:
    title: Studio italiano da un anno.
    gloss: 이탈리아어를 1년째 공부하고 있어요.
    note: '*da un anno*는 ''1년째''라는 뜻으로, 과거에 시작해서 지금도 계속되는 행동을 나타내요.'
  it.a1.unit02.lesson02.teach.da_quanto_studi:
    title: Da quanto studi?
    gloss: 얼마나 오래 공부했어요?
    note: '*Da quanto*(얼마 전부터) + 현재형 *studi*(공부해요, 친근한 말투)는 계속되는 활동이 얼마나 됐는지 물어요. 같은 구조로 대답해요: *Studio da un anno.*'
  it.a1.unit02.lesson02.teach.parla_bene:
