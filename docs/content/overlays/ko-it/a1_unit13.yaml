teaching:
  it.a1.unit13.lesson01.teach.ieri_stamattina:
    title: ieri, stamattina
    gloss: 어제, 오늘 아침
    note: '*ieri*(어제)와 *stamattina*(오늘 아침)는 최근에 일어난 일을 말할 때 쓰는 두 가지 시간 표현이에요.'
    example_gloss:
    - 어제 저는 집에 있었어요.
  it.a1.unit13.lesson01.teach.sono_andato:
    title: sono andato, sono andata
    gloss: 갔어요 (남성), 갔어요 (여성)
    note: '*sono andato/andata*는 *andare*의 passato prossimo(근과거)로, 조동사 *essere*를 쓰며 과거분사가 주어의 성에 따라 달라져요.'
    example_gloss:
    - 오늘 아침에 일하러 갔어요.
  it.a1.unit13.lesson01.teach.sono_andato_al_cinema_ieri:
    title: Sono andato al cinema ieri.
    gloss: 저는 어제 영화관에 갔어요.
    note: '*Sono andato*(남성 화자) + *al cinema*(영화관에) + *ieri*(어제)로 이미 끝난 과거의 일을 말해요.'
  it.a1.unit13.lesson01.teach.ho_visto_un_bel_film:
    title: Ho visto un bel film!
    gloss: 멋진 영화를 봤어요!
    note: '*Ho visto*는 조동사 *avere*와 불규칙 과거분사 *visto*(*vedere*, 보다)를 써요.'
  it.a1.unit13.lesson02.teach.ho_mangiato_un_panino:
    title: Ho mangiato un panino a pranzo.
    gloss: 점심에 샌드위치를 먹었어요.
    note: '*Ho mangiato*는 *avere*와 규칙 과거분사 *mangiato*(*mangiare*, 먹다)를 써요. *a pranzo*는 ''점심에''라는 뜻이에요.'
  it.a1.unit13.lesson02.teach.cosa_hai_fatto_ieri:
    title: Cosa hai fatto ieri?
    gloss: 어제 뭐 했어요?
    note: '*hai fatto*는 *fare*(하다)의 passato prossimo(근과거)로, 최근에 한 일을 물을 때 써요.'
    example_gloss:
    - 오늘 아침에 뭐 했어요?
  it.a1.unit13.lesson02.teach.ieri_sera:
    title: ieri sera
    gloss: 어제 저녁
    note: '*ieri sera*는 *ieri*(어제)와 *sera*(저녁)를 합쳐 특정한 과거 시점을 나타내요.'
    example_gloss:
    - 어제 저녁에 영화관에 갔어요.
  it.a1.unit13.lesson03.teach.sono_andata_al_lavoro:
    title: Stamattina sono andata al lavoro, come sempre.
    gloss: 오늘 아침에 늘 그렇듯이 일하러 갔어요.
    note: '*sono andata*(여성 화자) + *come sempre*(늘 그렇듯이)로 일상적인 과거의 행동을 말해요.'
  it.a1.unit13.lesson03.teach.e_tu_cosa_hai_fatto:
    title: E tu, cosa hai fatto stamattina?
    gloss: 당신은 오늘 아침에 뭐 했어요?
    note: '*E tu*(당신은요?)는 같은 질문을 상대방에게 되돌릴 때 써요.'
    example_gloss:
    - 당신은 어제 저녁에 뭐 했어요?
