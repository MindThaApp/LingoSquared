    - 이분은 제 어머니예요.
  it.a1.unit06.lesson01.teach.fratello_sorella:
    title: il fratello, la sorella
    gloss: 남자 형제, 여자 형제
    note: '*fratello*는 남성(*il*)이고 *sorella*는 여성(*la*)이에요.'
    example_gloss:
    - 남자 형제 한 명과 여자 형제 한 명이 있어요.
  it.a1.unit06.lesson01.teach.questo_e_mio_padre:
    title: Questo è mio padre. Questa è mia madre.
    gloss: 이분은 제 아버지예요. 이분은 제 어머니예요.
    note: '*Questo/Questa*(이)는 가리키는 사람의 성에 맞춰요. 남자에게는 *questo*, 여자에게는 *questa*를 써요.'
  it.a1.unit06.lesson01.teach.nonno_nonna:
    title: il nonno, la nonna
    gloss: 할아버지, 할머니
    note: '*padre/madre*와 같은 남성/여성 관사 규칙이에요.'
    example_gloss:
    - 우리 할아버지는 로마에 사세요.
    - 우리 할머니는 요리를 아주 잘하세요.
  it.a1.unit06.lesson02.teach.hai_fratelli_o_sorelle:
    title: Hai fratelli o sorelle?
    gloss: 형제자매가 있어요?
    note: '*Hai*(너는 가지고 있다) + 가족 단어 + *o*(또는)는 형제자매를 물을 때 쓰는 기본 표현이에요.'
  it.a1.unit06.lesson02.teach.ho_un_fratello_e_una_sorella:
    title: Ho un fratello e una sorella.
    gloss: 남자 형제 한 명과 여자 형제 한 명이 있어요.
    note: '*Ho*(나는 가지고 있다)로 대답하고, *un*(하나, 남성)과 *una*(하나, 여성)를 써요.'
  it.a1.unit06.lesson02.teach.moglie_marito:
    title: il marito, la moglie
    gloss: 남편, 아내
    note: 이것도 남성/여성 짝이고, 같은 관사 규칙을 따라요.
    example_gloss:
    - 샘에게는 아내가 있어요.
  it.a1.unit06.lesson03.teach.hai_figli:
    title: Hai figli?
    gloss: 자녀가 있어요?
    note: '*figli*(자녀)는 몇 명인지, 성별이 어떤지와 상관없이 일반적으로 물을 때 쓰는 복수형이에요.'
  it.a1.unit06.lesson03.teach.ho_due_figli:
    title: Sì, ho due figli. Un maschio e una femmina.
    gloss: 네, 아이가 둘 있어요. 아들 하나, 딸 하나예요.
    note: '*maschio*(남자아이)와 *femmina*(여자아이)는 전체 수를 말한 뒤 아이들의 성별을 알려 줘요.'
  it.a1.unit06.lesson03.teach.figlio_figlia:
    title: il figlio, la figlia
    gloss: 아들, 딸
    note: '*figli*의 단수형이고, 관사는 남성/여성 규칙을 똑같이 따라요.'
    example_gloss:
    - 엘레나에게는 아들 하나와 딸 하나가 있어요.
