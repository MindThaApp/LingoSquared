teaching:
  it.a1.unit06.lesson01.teach.madre_padre:
    title: la madre, il padre
    gloss: 어머니, 아버지
    note: 이탈리아어 명사에는 성에 따라 관사가 붙어요. 여성은 *la*, 남성은 *il*이에요. 한국어에는 이런 관사가 없어요.
    example_gloss:
