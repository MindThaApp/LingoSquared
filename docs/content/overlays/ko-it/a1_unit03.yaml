teaching:
  it.a1.unit03.lesson01.teach.numeri_zero_cinque:
    title: zero, uno, due, tre, quattro, cinque
    gloss: 영, 하나, 둘, 셋, 넷, 다섯
    note: 처음 여섯 개의 숫자예요. 이 단원 전체에서 가격, 나이, 전화번호를 말할 때 기본이 돼요.
    example_gloss:
    - 형제가 두 명 있어요.
    - 5시예요.
  it.a1.unit03.lesson01.teach.numeri_sei_dieci:
    title: sei, sette, otto, nove, dieci
    gloss: 여섯, 일곱, 여덟, 아홉, 열
    note: 6부터 10까지의 숫자로, 0~10 범위를 완성해요.
    example_gloss:
    - 하루에 여덟 시간 일해요.
    - 가게는 열 시에 문을 열어요.
  it.a1.unit03.lesson01.teach.quanti_anni:
    title: Quanti anni hai?
    gloss: 몇 살이에요?
    note: 직역하면 '몇 해를 가지고 있어요?'라는 뜻이에요. 이탈리아어는 나이를 물을 때 '이다'가 아니라 *avere*(가지다)를 써요.
  it.a1.unit03.lesson01.teach.ho_trent_anni:
    title: Ho trent'anni.
    gloss: 저는 서른 살이에요.
    note: '*avere*를 써서 나이를 말하는 고정 표현이에요(직역하면 ''서른 해를 가지고 있다''). ''trent''anni''의 30은 숫자로 배우는 것이 아니에요. 이 단원의 숫자 범위는 0~10이고, 30과 50은 이 고정 표현과 가격에서만 나와요.'
  it.a1.unit03.lesson02.teach.quanto_costa:
    title: Quanto costa un caffè?
    gloss: 커피 한 잔은 얼마예요?
    note: '*Quanto costa*는 물건 하나의 가격을 물을 때 쓰는 기본 표현이에요.'
  it.a1.unit03.lesson02.teach.costa_un_euro:
    title: un euro, due euro
    gloss: 1유로, 2유로
    note: 이탈리아어에서 *euro*는 복수형이 되어도 형태가 변하지 않아요. *un euro*와 *due euro* 모두 *euro*를 써요.
    example_gloss:
    - 1유로예요.
    - 2유로 50센트예요.
  it.a1.unit03.lesson02.teach.un_cornetto:
    title: E un cornetto?
    gloss: 크루아상은요?
    note: 두 번째 물건인 *cornetto*(이탈리아식 아침 식사용 크루아상)의 가격을 묻는 짧은 되묻기 표현이에요.
  it.a1.unit03.lesson02.teach.due_euro_cinquanta:
    title: Sono due euro e cinquanta.
    gloss: 2유로 50센트예요.
    note: '*e cinquanta*는 센트를 덧붙이는 말이에요. 직역하면 ''그리고 50''이고, 50센트가 붙는 어떤 가격에도 똑같이 써요.'
  it.a1.unit03.lesson02.teach.quanti_ne_vuole:
    title: Quanti ne vuole?
    gloss: 몇 개 드릴까요?
    note: 바리스타나 가게 주인이 원하는 개수를 물을 때 쓰는 격식 있는 표현이에요. *ne*는 이미 언급된 물건을 대신해요.
  it.a1.unit03.lesson02.teach.ne_vorrei_tre:
    title: Ne vorrei tre, grazie.
    gloss: 세 개 주세요, 감사합니다.
    note: '*Ne vorrei* + 숫자는 수량을 정중하게 요청하는 표현이에요. 여기서도 *ne*가 앞에서 나온 물건을 가리켜요.'
  it.a1.unit03.lesson03.teach.qual_e_il_tuo_numero:
    title: Qual è il tuo numero di telefono?
    gloss: 전화번호가 뭐예요?
    note: 친한 사이에서 전화번호를 물을 때 쓰는 표현으로, *tuo*(너의, 비격식)를 써요.
  it.a1.unit03.lesson03.teach.ti_chiamo_domani:
    title: Ti chiamo domani!
    gloss: 내일 전화할게요!
    note: 번호를 받은 뒤 친근하게 대화를 마무리하는 표현이에요.
  it.a1.unit03.lesson03.teach.il_mio_numero:
    title: il mio numero
    gloss: 제 번호
    note: 이탈리아에서는 전화번호를 보통 숫자 하나씩 끊어서 읽어요. 이때 1과에서 배운 숫자를 써요.
    example_gloss: 제 번호는 0, 3, 4, 2, 1이에요.
  it.a1.unit03.lesson03.teach.numero_sam:
    title: Il mio numero è zero, tre, quattro, due, uno.
    gloss: 제 번호는 0, 3, 4, 2, 1이에요.
    note: 샘이 전화번호를 한 자리씩 말해요. 이탈리아어에서 전화번호를 읽는 일반적인 방식이에요.
  it.a1.unit03.lesson03.teach.perfetto_grazie:
    title: Perfetto, grazie!
    gloss: 완벽해요, 감사합니다!
    note: 필요한 정보를 얻은 뒤 밝게 대화를 마무리하는 짧은 표현이에요.
