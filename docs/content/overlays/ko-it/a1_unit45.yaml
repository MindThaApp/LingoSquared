      lavoro: 일, 직장
      bicicletta: 자전거 (in bicicletta = 자전거로)
      solito: 보통의 (di solito = 보통)
      piove: 비가 와요
      prende: 타요
      andare: 가다 (andare in macchina = 차로 가다, 운전하다)
      preferisce: 더 좋아해요
      macchina: 자동차
      abita: 살아요
      vicino: 가까이에
      piedi: 발 (a piedi = 걸어서)
      vai: (너는) 가
