    title: 누가 어떻게 이동할까요?
    gloss: Giulia는 매일 기차로 출근해요. Marco는 보통 자전거를 타지만, 비가 오면 기차도 타요. Luca는 차로 가는 걸 더 좋아해요. Chiara는 가까이 살아서 걸어서 출근해요. 여러분은 어떻게 출근하세요?
    note: '네 가지 이동 방법과 한 가지 조건(*quando piove*, 비가 올 때)을 대비해서 보여 줘요. *Andare*(가다)는 불규칙 동사예요: *vado*, *va*.'
