teaching:
  it.a1.unit14.lesson01.teach.preferire:
    title: preferire, preferisco
    gloss: 선호하다, 나는 선호해요
    note: '*preferire*(선호하다)는 -ire 동사로, 현재형 대부분에 -isc-가 들어가요. *preferisco*는 ''나는 선호해요''라는 뜻이에요.'
    example_gloss:
    - 저는 커피보다 차를 더 좋아해요.
  it.a1.unit14.lesson01.teach.preferisci_il_caffe_o_il_te:
    title: Preferisci il caffè o il tè?
    gloss: 커피와 차 중 어느 쪽을 더 좋아해요?
    note: '*Preferisci*(너는 선호해)와 *o*(또는)를 함께 쓰면 두 가지 중에서 고르게 물어볼 수 있어요.'
  it.a1.unit14.lesson01.teach.preferisco_il_caffe:
    title: Preferisco il caffè.
    gloss: 저는 커피를 더 좋아해요.
    note: '*Preferisco*(나는 선호해요)와 *il caffè*(커피)를 함께 쓰면 취향을 말할 수 있어요.'
  it.a1.unit14.lesson02.teach.mi_piace_il_cornetto:
    title: Mi piace molto il cornetto.
    gloss: 크루아상이 정말 좋아요.
    note: '*Mi piace*(나는 ~이 좋아요)에 *molto*(많이)를 더하면 아주 좋아한다는 뜻이에요.'
  it.a1.unit14.lesson02.teach.non_mi_piace:
    title: Non mi piace il tè la mattina.
    gloss: 아침에는 차를 안 좋아해요.
    note: '*Non mi piace*(나는 ~이 좋지 않아요)는 좋아함을 나타내는 표현의 부정형이고, *la mattina*는 ''아침에''라는 뜻이에요.'
    example_gloss:
    - 저녁에는 커피를 안 좋아해요.
  it.a1.unit14.lesson02.teach.e_a_te:
    title: E a te?
    gloss: 당신은요?
    note: '*E a te?*(그럼 너에게는?)는 상대방의 취향을 되물을 때 써요.'
  it.a1.unit14.lesson03.teach.anch_io_preferisco_il_caffe:
    title: Anch'io preferisco il caffè!
    gloss: 저도 커피가 더 좋아요!
    note: '*Anch''io*(나도)는 상대가 *preferisco*로 말한 취향에 동의할 때 써요. (*mi piace* 문장에 동의할 때는 *Anche a me*라고 해요.)'
  it.a1.unit14.lesson03.teach.a_me_no:
    title: A me no, preferisco il tè.
    gloss: 저는 아니에요, 차가 더 좋아요.
    note: '*A me no*(나는 아니야)는 *mi piace* 문장에 반대할 때 쓰며, 자기 취향을 말하기 앞에 붙여요. *a me*는 좋아함을 나타내는 표현의 a me와 짝을 이뤄요. *preferisco* 문장에 반대할 때는 대신 *Io no*라고 해요.'
    example_gloss:
    - 저는 아니에요, 커피가 더 좋아요.
