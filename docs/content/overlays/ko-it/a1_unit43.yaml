      entrambi: 둘 다
      animali: 동물들
      due: 둘 (nessuno dei due = 둘 중 누구도 ~ 아니다)
      domestico: 집에서 기르는 (animale domestico = 반려동물)
      cani: 개들
      gatti: 고양이들
      gatto: 고양이
      gioca: 놀아요
      dà: 줘요
      ogni: 매
