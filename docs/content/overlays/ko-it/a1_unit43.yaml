    note: '*non ho* 뒤의 명사에는 보통 관사가 없습니다: *non ho tempo*, *non ho animali*. 한국어의 ''시간이 없어요'', ''동물이 없어요''처럼 관사 없이 말합니다.'
  it.a1.unit43.lesson02.teach.portare_a_spasso:
