  it.a1.unit43.lesson05.teach.marco_e_chiara:
    title: 동물에 대한 Marco, Chiara, Luca의 이야기
    gloss: Marco와 Chiara는 둘 다 동물을 좋아하지만, 둘 중 누구도 반려동물이 없어요. Marco는 개를 좋아하고 Chiara는 고양이를 좋아해요. 반면 Luca에게는 반려동물이 있어요. 바로 고양이예요. Luca는 자기 고양이와 자주 놀아 주고 매일 먹이를 줘요. 여러분은 반려동물이 있나요?
    note: 동물을 좋아하는 것과 실제로 키우는 것의 차이를 보여 줘요. 이 단원이 전하려는 핵심이에요.
    glosses:
