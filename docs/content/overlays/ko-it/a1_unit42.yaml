course:
  title: 이탈리아어 A1
  description: '사람의 기본적인 외모를 묘사하는 초급 이탈리아어: 키와 나이에 대한 인상, 머리카락과 눈 색깔, 핵심 질문 Com''è?, 두 사람의 외모 비교.'
units:
  it.a1.unit42.aspetto:
    title: 외모 묘사하기
lessons:
  it.a1.unit42.lesson01.alto_basso_anziano_e:
    title: 키가 큰, 키가 작은, 나이 든, 젊은
  it.a1.unit42.lesson02.descrivere_i_capelli:
    title: 머리카락 묘사하기
  it.a1.unit42.lesson03.gli_occhi_e_com:
    title: 눈, 그리고 어떻게 생겼는지 묻기
  it.a1.unit42.lesson04.giulia_descrive_nina:
    title: 줄리아가 니나를 설명해요
  it.a1.unit42.lesson05.luca_e_chiara_a:
    title: 루카와 키아라 비교하기
  it.a1.unit42.lesson06.marco_riconosce_nina:
    title: 마르코가 니나를 알아봐요
teaching:
  it.a1.unit42.lesson01.teach.alto_basso:
    title: 키가 큰, 키가 작은
    gloss: 키가 큰 / 키가 작은
    note: '*Alto*는 키가 큰 사람을, *basso*는 키가 작은 사람을 나타내요. 이탈리아어 형용사는 사람에 맞춰 형태가 바뀌어요: *alto/alta*, *basso/bassa*.'
    example_gloss:
    - 키아라는 키가 커요.
    - 루카는 키가 작아요.
  it.a1.unit42.lesson01.teach.anziano_giovane:
    title: 나이 든, 젊은
    gloss: 나이 든 / 젊은
    note: '*Anziano*(나이 든)와 *giovane*(젊은)는 정확한 나이가 아니라 전반적인 인상을 나타내요. *Giovane*는 -e로 끝나서 남자와 여자에게 똑같이 써요.'
    example_gloss:
    - 할아버지는 연세가 많으세요.
    - 마르코는 젊어요.
  it.a1.unit42.lesson01.teach.per_l_eta:
    title: '나이: avere anni 또는 anziano'
    gloss: '정확한 나이를 말할 때 이탈리아어는 avere + anni를 써요: Quanti anni hai? 전반적인 인상을 말할 때는 형용사를 써요: Il nonno è anziano.'
    note: 한국어로는 '서른 살이에요'라고 하지만, 이탈리아어로는 '서른 해를 가지고 있다'(*ho trent'anni*)라고 말해요. 형용사 *anziano*는 어떻게 나이 들어 보이는지를 나타낼 때 써요.
  it.a1.unit42.lesson01.teach.chiara_e_alta:
    title: 키아라는 키가 크고 루카는 키가 작아요
    gloss: 키아라는 키가 크고 루카는 키가 작아요.
    note: '형용사 두 개를 *e*(''그리고'')로 연결했어요. 각각 해당 인물에 맞춰져 있어요: *alta*(여성형)와 *basso*(남성형).'
  it.a1.unit42.lesson02.teach.i_capelli:
    title: 머리카락
    gloss: 머리카락
    note: '*I capelli*는 이탈리아어에서 복수형이에요. 이탈리아어는 머리카락을 ''여러 가닥''으로 보고 말해요. 한 가닥은 단수형 *il capello*예요.'
    example_gloss: 마르코는 짧은 검은 머리예요.
  it.a1.unit42.lesson02.teach.biondi_castani_grigi:
    title: 금발, 갈색, 회색
    gloss: 금발 / 갈색 / 회색
    note: '*capelli*에 맞춰 남성 복수형으로 쓴 머리 색 세 가지: *biondi*, *castani*, *grigi*. *Neri*(검은색)도 머리카락에 써요.'
    example_gloss:
    - 줄리아는 금발 머리예요.
    - 루카는 갈색 머리예요.
    - 할아버지는 백발이에요.
  it.a1.unit42.lesson02.teach.lunghi_corti:
    title: 긴 머리, 짧은 머리
    gloss: 긴 / 짧은 (머리)
    note: '*Lunghi*(긴)와 *corti*(짧은)는 *capelli*처럼 복수형이에요. *alto*(키가 큰)는 사람에게만 쓰고 머리카락에는 쓰지 않아요.'
    example_gloss:
    - 키아라는 머리가 길어요.
    - 루카는 머리가 짧아요.
  it.a1.unit42.lesson02.teach.i_capelli_sono:
    title: Capelli는 복수형이에요
    gloss: 'Capelli는 복수형이라서 형용사도 복수형이에요: i capelli biondi, castani, grigi, neri, lunghi, corti.'
    note: '형용사는 명사 뒤에 오고 성과 수가 일치해요: *capelli lunghi*(남성 복수형), *occhi azzurri*.'
  it.a1.unit42.lesson02.teach.per_descrivere_una:
    title: 머리카락과 눈에는 avere를 써요
    gloss: '사람을 묘사할 때 이탈리아어는 머리카락과 눈에 avere를 써요: Giulia ha i capelli biondi e gli occhi azzurri.'
    note: '한국어에는 관사가 없지만 이탈리아어에서는 머리카락과 눈 앞에 관사가 꼭 필요해요: *i capelli*, *gli occhi*. *è bionda*라고 말할 수도 있지만, 여기서 배울 패턴은 *avere*예요.'
  it.a1.unit42.lesson02.teach.marco_ha_i:
    title: 마르코는 짧은 검은 머리예요
    gloss: 마르코는 짧은 검은 머리예요.
    note: '*Neri*(검은색)는 *capelli*에 맞춘 남성 복수형이에요.'
  it.a1.unit42.lesson02.teach.giulia_ha_i:
    title: 줄리아는 긴 금발 머리예요
    gloss: 줄리아는 긴 금발 머리예요.
    note: 이번 과의 길이와 색 어휘를 자연스러운 한 문장에 모았어요.
  it.a1.unit42.lesson03.teach.gli_occhi:
    title: 눈
    gloss: 눈
    note: '*Occhio*(눈)는 남성명사예요. 복수형은 *occhi*이고, 모음으로 시작하기 때문에 *gli*가 붙어요.'
    example_gloss: 마르코는 갈색 눈이에요.
  it.a1.unit42.lesson03.teach.azzurri_marroni_verdi:
    title: 파란색, 갈색, 초록색
    gloss: 파란색 / 갈색 / 초록색
    note: '눈 색깔: *azzurri*(파란색), *marroni*(갈색), *verdi*(초록색). 이 복수형들은 남자와 여자 모두에게 쓸 수 있어요.'
    example_gloss:
    - 줄리아는 파란 눈이에요.
    - 루카는 갈색 눈이에요.
    - 키아라는 초록색 눈이에요.
  it.a1.unit42.lesson03.teach.anche_gli_occhi:
    title: 색깔도 복수형으로 맞춰요
    gloss: '눈 색깔은 occhi에 맞춰 복수형이 돼요: occhi azzurri, marroni, verdi.'
    note: '단수형이 -e로 끝나는 형용사(*verde*, *marrone*)는 복수형에서 -i로 끝나요: *verdi*, *marroni*.'
  it.a1.unit42.lesson03.teach.com_e_giulia:
    title: 줄리아는 어떻게 생겼어요?
    gloss: 줄리아는 어떻게 생겼어요?
    note: '*Com''è?*는 외모를 묻는 핵심 질문이에요. *Com''è*는 *come è*에서 e가 빠지고 아포스트로피가 붙은 형태예요.'
  it.a1.unit42.lesson03.teach.giulia_ha_i:
    title: 줄리아는 긴 금발 머리에 파란 눈이에요
    gloss: 줄리아는 긴 금발 머리에 파란 눈이에요.
    note: '모범 답안: *avere* + 머리카락 + *e* + 눈을 한 문장으로 말해요.'
  it.a1.unit42.lesson04.teach.giulia_al_caffe:
    title: 줄리아가 니나를 소개해요
    gloss: '줄리아: 언어 카페에 새로운 여자아이가 와요. 이름은 니나예요.'
    note: '*Viene*(온다)는 새로운 사람을 소개할 때 써요. *Si chiama*는 ''이름이 ~예요''라는 뜻이고, 직역하면 ''자신을 ~라고 부른다''예요.'
  it.a1.unit42.lesson04.teach.marco_va_bene:
    title: 마르코가 어떻게 생겼는지 물어봐요
    gloss: '마르코: 좋아요! 어떻게 생겼어요?'
    note: 이름 없이 같은 질문을 다시 해요. 누구인지는 문맥에서 분명해요.
  it.a1.unit42.lesson04.teach.giulia_e_bassa:
    title: 줄리아가 니나의 키와 머리카락을 설명해요
    gloss: '줄리아: 키가 작고 짧은 금발 머리예요.'
    note: '*È bassa*(그녀는 키가 작아요)에는 여성형 *bassa*를 써요. 이어서 머리카락 묘사는 *ha*로 해요.'
  it.a1.unit42.lesson04.teach.marco_e_gli:
    title: 마르코가 눈에 대해 물어봐요
    gloss: '마르코: 눈은요?'
    note: '*E gli occhi?*에는 동사가 없어요. 이탈리아어는 문맥상 분명한 말을 자주 생략해요.'
  it.a1.unit42.lesson04.teach.giulia_ha_gli:
    title: 줄리아가 니나의 눈을 설명해요
    gloss: '줄리아: 초록색 눈이에요.'
    note: '*Ha gli occhi verdi*: 동사 어미가 이미 ''그녀''임을 알려 주기 때문에 주어 대명사가 필요 없어요.'
  it.a1.unit42.lesson04.teach.marco_grazie_allora:
    title: 마르코가 그녀를 알아볼 거예요
    gloss: '마르코: 고마워요! 그럼 알아볼 수 있겠네요.'
    note: '*La riconosco*(나는 그녀를 알아봐요): 목적어 대명사 *la*는 동사 앞에 와요.'
  it.a1.unit42.lesson05.teach.luca_e_chiara:
    title: 루카와 키아라 비교하기
    gloss: 루카와 키아라는 남매이지만 서로 다르게 생겼어요. 루카는 키가 작고 짧은 갈색 머리에 갈색 눈이에요. 키아라는 루카보다 키가 크고 긴 갈색 머리에 초록색 눈이에요. 당신은 어떻게 생겼어요?
    note: 지금까지 배운 색과 길이 어휘를 모두 다시 쓴 짧은 비교 글이에요. 마지막에는 이번 단원의 핵심 질문을 읽는 사람에게 던져요.
    glosses:
      fratello: 남자 형제
      sorella: 여자 형제
      sembrano: 그들은 ~처럼 보여요 / ~인 것 같아요
      diversi: 다른
      basso: 짧은
      corti: 짧은
      castani: 갈색
      capelli: 머리카락
      marroni: 갈색
      occhi: 눈
      alta: 키가 큰 (più alta = 더 키가 큰)
      lunghi: 긴
      verdi: 초록색
      come: 어떻게 (Tu come sei? = 당신은 어떻게 생겼어요?)
  it.a1.unit42.lesson05.teach.il_comparativo_si:
    title: '비교하기: più ... di'
    gloss: '이탈리아어는 più + 형용사 + di로 비교해요: Chiara è più alta di Luca.'
    note: '*più*는 형용사 앞에, *di*는 비교 대상인 사람 앞에 놓아요. 형용사는 성에 맞춰 형태가 바뀌어요: *più alta*, *più alto*.'
  it.a1.unit42.lesson05.teach.chiara_ha_i:
    title: 키아라는 루카보다 머리가 길어요
    gloss: 키아라는 루카보다 머리가 길어요.
    note: '*I capelli più lunghi di Luca*: 형용사는 *capelli*에 맞춰 복수형으로 남아요.'
  it.a1.unit42.lesson05.teach.ho_i_capelli:
    title: 저는 짧은 갈색 머리예요
    gloss: 저는 짧은 갈색 머리예요.
    note: '*Ho i capelli corti e castani*: 자신의 외모를 묘사할 때는 *avere*를 써요.'
  it.a1.unit42.lesson06.teach.marco_guarda_e:
    title: Marco가 Nina를 발견해요
    gloss: 'Marco: 저기 봐요, 저 사람 Nina 맞아요? 짧은 금발 머리에 초록색 눈이에요.'
    note: '*Guarda*(보세요)는 *tu*에 대한 명령형이에요. *Quella*는 여자를 가리켜 ''저 사람''이라는 뜻이에요.'
  it.a1.unit42.lesson06.teach.giulia_si_e:
    title: Giulia가 확인해 줘요
    gloss: 'Giulia: 네, Nina 맞아요!'
    note: 짧고 자연스러운 확인 표현이에요.
  it.a1.unit42.lesson06.teach.nina_ciao_sei:
    title: Nina가 Marco에게 인사해요
    gloss: 'Nina: 안녕하세요, Marco 맞아요?'
    note: '*Sei Marco?*는 격식 없는 질문이에요. *sei*가 *essere*의 *tu* 형태라서 *tu*를 따로 쓸 필요가 없어요.'
  it.a1.unit42.lesson06.teach.marco_si_piacere:
    title: Marco가 답인사를 해요
    gloss: 'Marco: 네! 만나서 반가워요, Nina.'
    note: '*Piacere di conoscerti*는 처음 만난 사람에게 하는 표현이에요. *-ti*는 ''너를''이라는 뜻이에요.'
  it.a1.unit42.lesson06.teach.nina_piacere_mio:
    title: Nina도 인사를 받아 줘요
    gloss: 'Nina: 나도 만나서 반가워!'
    note: 대화를 마무리해요. Marco가 Giulia의 앞선 설명 덕분에 Nina를 알아봤어요.
