  it.a1.unit41.lesson04.giulia_e_marco_parlano:
    title: Giulia와 Marco가 취미에 대해 이야기해요
  it.a1.unit41.lesson05.marco_e_giulia_confrontano:
    title: Marco와 Giulia가 취미를 비교해요
  it.a1.unit41.lesson06.programmare_un_fine_settimana:
    title: 함께 주말 계획 세우기
teaching:
  it.a1.unit41.lesson01.teach.leggere_fare_sport:
    title: 독서, 운동, 요리
    gloss: 읽다, 운동하다, 요리하다
    note: '동사원형으로 쓰는 흔한 취미 동사 세 가지예요: *leggere*(읽다), *fare sport*(운동하다), *cucinare*(요리하다). 이탈리아어 동사원형은 -are, -ere, -ire로 끝나요.'
    example_gloss:
    - 저는 책 읽는 것을 좋아해요.
    - 저는 토요일마다 운동해요.
    - 저는 친구들을 위해 요리하는 것을 좋아해요.
  it.a1.unit41.lesson01.teach.il_tempo_libero:
    title: 여가 시간
    gloss: 여가 시간
    note: '*Il tempo libero*는 남성 명사라서 *il*이 붙어요. 취미를 이야기할 때 꼭 필요한 표현이에요.'
    example_gloss: 저는 여가 시간에 독서하는 것을 좋아해요.
  it.a1.unit41.lesson01.teach.nel_mio_tempo:
    title: 여가 시간에 하는 일 말하기
    gloss: 저는 여가 시간에 독서하는 것을 좋아해요.
    note: '*Leggo*는 *leggere*(읽다)의 *io* 형태예요. 이탈리아어는 주어 대명사를 생략해서 *Io leggo*가 아니라 *Leggo*라고 해요.'
  it.a1.unit41.lesson02.teach.ascoltare_musica_disegnare:
    title: 음악, 그림 그리기, 비디오 게임
    gloss: 음악을 듣다, 그림을 그리다, 비디오 게임을 하다
    note: '취미 세 가지를 더 알아봐요: *ascoltare musica*(음악을 듣다), *disegnare*(그림을 그리다), *giocare ai videogiochi*(비디오 게임을 하다).'
    example_gloss:
    - 저는 음악 듣는 것을 좋아해요.
    - 저는 그림을 자주 그려요.
    - 저는 친구들과 비디오 게임 하는 것을 좋아해요.
  it.a1.unit41.lesson02.teach.ascolto_volentieri_musica:
    title: 음악 듣기를 좋아한다고 말하기
    gloss: 저는 음악 듣는 것을 좋아해요.
    note: '*Ascoltare*는 목적어를 바로 받아요. *ascolto musica*처럼 그 사이에 전치사가 들어가지 않아요.'
  it.a1.unit41.lesson02.teach.gioco_volentieri_ai:
    title: 친구들과 게임하는 것을 좋아한다고 말하기
    gloss: 저는 친구들과 비디오 게임 하는 것을 좋아해요.
    note: '*Con gli amici*는 ''친구들과 함께''라는 뜻이에요. *Gli*는 모음으로 시작하는 남성 명사 앞에 쓰는 복수 관사예요.'
  it.a1.unit41.lesson03.teach.sempre_spesso_a:
    title: 항상, 자주, 가끔, 전혀 ~않다
    gloss: 항상, 자주, 가끔, 절대 ~않다
    note: '빈도를 나타내는 단어 네 가지예요. *Mai*(결코 ~ 않다)는 동사 앞에 *non*이 필요해요: *non gioco mai*.'
    example_gloss:
    - 저는 토요일마다 항상 운동해요.
    - 저는 책을 자주 읽어요.
    - 저는 가끔 그림을 그려요.
    - 저는 게임을 전혀 안 해요.
  it.a1.unit41.lesson03.teach.ogni_settimana_ogni:
    title: 매주, 주말마다
    gloss: 매주, 주말마다
    note: '*Ogni*(매~, 모든)는 형태가 변하지 않아요: *ogni settimana*, *ogni fine settimana*. 다음 카드를 보세요.'
    example_gloss:
    - 저는 매주 친구들을 위해 요리해요.
    - 저는 주말마다 운동해요.
  it.a1.unit41.lesson03.teach.con_mai_il:
    title: mai에는 non이 필요하고, ogni는 변하지 않아요
    gloss: 'mai와 함께 쓰면 동사에 non도 붙어요: Non gioco mai. Ogni는 어떤 명사 앞에서도 그대로예요: ogni settimana, ogni fine settimana.'
    note: 이탈리아어에서는 *non gioco mai*처럼 non과 mai를 함께 써서 '하지 않아요'라는 뜻을 나타내요(직역하면 '나는 하지 않는다 결코'). *ogni* 뒤에는 항상 단수 명사가 와요.
  it.a1.unit41.lesson03.teach.cosa_fai_nel:
    title: 여가 시간에 대해 묻기
    gloss: 여가 시간에 무엇을 하나요?
    note: 이 단원의 핵심 질문이에요. 누구에게든 취미를 물을 때 이 문장을 쓰세요.
  it.a1.unit41.lesson04.teach.giulia_passeggiamo_spesso:
    title: Giulia가 취미 이야기를 꺼내요
    gloss: 'Giulia: 우리는 자주 같이 산책해요. 그런데 Marco, 너는 여가 시간에 또 뭘 해요?'
    note: '*Passeggiamo*는 *passeggiare*의 *noi*(우리) 형태예요. *Spesso*는 동사 뒤에 와요.'
  it.a1.unit41.lesson04.teach.marco_cucino_volentieri:
    title: Marco의 취미
    gloss: 'Marco: 요리하는 걸 좋아해요, 집에서도요. 그리고 운동도 자주 해요.'
    note: '*Anche a casa*(집에서도)는 Marco가 일로만이 아니라 즐거워서도 요리한다는 걸 보여 줘요. *A casa*는 ''집에서''라는 뜻이고 관사가 없어요.'
  it.a1.unit41.lesson04.teach.giulia_cucini_anche:
    title: Giulia가 놀라요
    gloss: 'Giulia: 집에서도 요리해요? 직장에서 이미 하루 종일 요리하잖아요!'
    note: '*Già*(이미)와 *tutto il giorno*(하루 종일)는 Marco가 직장에서 이미 얼마나 많이 요리하는지 보여 줘요.'
  it.a1.unit41.lesson04.teach.marco_si_ma:
    title: Marco가 설명해요
    gloss: 'Marco: 네, 그래도 요리하면 마음이 편해져요. 너는요, 뭘 하는 걸 좋아해요?'
    note: '*Cucinare mi rilassa*는 직역하면 ''요리하는 것이 나를 편하게 한다''예요. 활동이 주어이고 *mi*(나를)가 목적어예요.'
  it.a1.unit41.lesson04.teach.giulia_leggo_volentieri:
    title: Giulia의 취미
    gloss: 'Giulia: 책 읽는 걸 좋아하고 음악도 자주 들어요.'
    note: '*e*(그리고)로 이어진 두 가지 취미예요. 두 동사 모두 *io* 형태를 유지해요: *leggo*와 *ascolto*.'
  it.a1.unit41.lesson04.teach.marco_giochi_anche:
    title: Marco가 게임에 대해 물어요
    gloss: 'Marco: 게임도 해요?'
    note: '예/아니요 질문은 평서문과 어순이 같고 억양만 올라가요: *Giochi anche ai videogiochi?* *Anche*는 ''~도''라는 뜻이에요.'
  it.a1.unit41.lesson04.teach.giulia_no_non:
    title: Giulia가 대답해요
    gloss: 'Giulia: 아니요, 게임은 전혀 안 해요. 대신 가끔 그림을 그려요!'
    note: 한 번의 대답 안에서 *Non ... mai*(결코 ~ 않다)와 *a volte*(가끔)가 대비돼요. *Ma*는 '하지만'이라는 뜻이에요.
  it.a1.unit41.lesson05.teach.marco_e_io:
    title: 취미 비교하기
    gloss: Marco와 저는 자주 같이 산책해요. 하지만 다른 취미도 있어요. Marco는 요리를 좋아해서 집에서도 하고, 운동도 자주 해요. 저는 책 읽는 걸 좋아하고 음악도 자주 들어요. 가끔 그림을 그리지만, 게임은 전혀 하지 않아요. 여러분은 여가 시간에 뭘 하는 걸 좋아하세요?
    note: Giulia의 메시지는 앞에서 나온 내용을 정리하고, 읽는 사람에게 이 단원의 핵심 질문을 던지며 끝나요.
    glosses:
      passeggiamo: 우리는 산책해요
      spesso: 자주
      insieme: 함께
      altri: 다른
      cucina: 요리하다
      volentieri: 기꺼이
      casa: 집 (a casa = 집에서)
      sport: 운동 (fa sport = 운동을 해요)
      leggo: 읽다
      ascolto: 듣다
      musica: 음악
      disegno: 그리다
      volte: 번, 때 (a volte = 가끔)
      videogiochi: 비디오 게임
      mai: 전혀 하지 않다
      libero: 자유로운
      tempo: 시간
  it.a1.unit41.lesson06.teach.marco_cosa_fai:
    title: Marco가 주말에 대해 물어요
    gloss: 'Marco: 이번 주말에 뭐 해요?'
    note: '*Questo fine settimana*(이번 주말)는 남성이라서 *questo*를 써요. *Fai*는 *fare*(하다)의 *tu* 형태예요.'
  it.a1.unit41.lesson06.teach.giulia_non_lo:
    title: Giulia가 망설여요
    gloss: 'Giulia: 아직 모르겠어요. 책 읽는 건 좋은데, 나가고도 싶어요.'
    note: '*Non lo so ancora*(아직 모르겠어요): *lo*는 모르는 그 내용을 가리키며 동사 앞에 와요. *Uscire*는 ''나가다''라는 뜻이에요.'
  it.a1.unit41.lesson06.teach.marco_facciamo_una:
    title: Marco가 계획을 제안해요
    gloss: 'Marco: 같이 산책할까요? 그다음에 제가 우리를 위해 요리할게요.'
    note: '*Poi*(그다음에)는 계획의 순서를 정해 줘요. *Cucino io*(동사 뒤의 *io*)는 ''내가 요리할 거예요''를 강조해요.'
  it.a1.unit41.lesson06.teach.giulia_buona_idea:
    title: Giulia가 동의해요
    gloss: 'Giulia: 좋은 생각이에요! 산책도 요리도 둘 다 좋아해요.'
    note: '*Sia ... sia ...*는 ''~도 ~도 둘 다''라는 뜻이에요: *mi piace sia passeggiare sia cucinare*.'
  it.a1.unit41.lesson06.teach.marco_perfetto_allora:
    title: Marco가 약속을 확정해요
    gloss: 'Marco: 좋아요. 그럼 토요일에 봐요!'
    note: '*Ci vediamo sabato*(토요일에 봐요): 다가오는 요일을 말할 때는 요일 앞에 관사를 쓰지 않아요.'
