course:
  title: 이탈리아어 A1
  description: '자유 시간 활동을 이야기하는 초급 이탈리아어: 취미 어휘, 빈도 표현, 여가 시간에 무엇을 하는지 묻고 답하기, 두 사람의 취미 비교하기.'
