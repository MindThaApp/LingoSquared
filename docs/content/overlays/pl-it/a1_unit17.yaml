teaching:
  it.a1.unit17.lesson01.teach.il_lavoro:
    title: il lavoro
    gloss: praca / zawód
    note: '*il lavoro* to rzeczownik rodzaju męskiego oznaczający zarówno „posadę, zawód”, jak i „pracę” w ogóle.'
    example_gloss:
    - Moja praca jest interesująca.
  it.a1.unit17.lesson01.teach.insegnante_commesso:
    title: insegnante, commesso
    gloss: nauczyciel / nauczycielka, sprzedawca
    note: '*insegnante* (nauczyciel/nauczycielka) ma tę samą formę dla mężczyzn i kobiet; *commesso* (sprzedawca) jest rodzaju męskiego — forma żeńska to *commessa*.'
    example_gloss:
    - Jestem nauczycielem, nie sprzedawcą.
  it.a1.unit17.lesson01.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: Czym się Pan/Pani zajmuje zawodowo?
    note: '*Che lavoro fai?* (dosłownie „Jaką pracę robisz?”) to standardowe pytanie o zawód.'
  it.a1.unit17.lesson01.teach.sono_insegnante:
    title: Sono insegnante.
    gloss: Jestem nauczycielką.
    note: 'Po włosku przed nazwą zawodu bez dodatkowego określenia nie używa się rodzajnika: *Sono insegnante*, a nie *Sono un insegnante*. Pod tym względem jest podobnie jak w polskim, gdzie rodzajników w ogóle nie ma.'
  it.a1.unit17.lesson01.teach.sono_commesso:
    title: Sono commesso.
    gloss: Jestem sprzedawcą.
    note: Ten sam wzorzec bez rodzajnika co w *Sono insegnante*.
  it.a1.unit17.lesson02.teach.ufficio_scuola:
    title: l'ufficio, la scuola
    gloss: biuro, szkoła
    note: W *l'ufficio* (biuro) rodzajnik ulega elizji przed samogłoską; *la scuola* (szkoła) jest rodzaju żeńskiego.
    example_gloss:
    - Pracuję w biurze.
    - Pracuję w szkole.
  it.a1.unit17.lesson02.teach.dove_lavori:
    title: Dove lavori?
    gloss: Gdzie pracujesz?
    note: '*Dove* (gdzie) plus *lavori* (pracujesz, forma nieformalna).'
  it.a1.unit17.lesson02.teach.lavoro_in_un_ufficio:
    title: Lavoro in un ufficio.
    gloss: Pracuję w biurze.
    note: '*Lavoro in* (pracuję w) plus *un ufficio* (biuro).'
  it.a1.unit17.lesson02.teach.lavoro_in_una_scuola:
    title: Lavoro in una scuola.
    gloss: Pracuję w szkole.
    note: Ten sam wzorzec z *una scuola* (szkoła).
  it.a1.unit17.lesson03.teach.inizio_finisco:
    title: inizio, finisco
    gloss: zaczynam, kończę
    note: '*inizio* (zaczynam) i *finisco* (kończę) to formy 1. osoby liczby pojedynczej czasu teraźniejszego od czasowników *iniziare* i *finire*.'
    example_gloss:
    - Zaczynam o dziewiątej.
    - Kończę o piątej.
  it.a1.unit17.lesson03.teach.a_che_ora_inizi:
    title: A che ora inizi?
    gloss: O której zaczynasz?
    note: '*A che ora* (o której godzinie) plus *inizi* (zaczynasz, forma nieformalna).'
  it.a1.unit17.lesson03.teach.inizio_alle_nove_e_finisco_alle_cinque:
    title: Inizio alle nove e finisco alle cinque.
    gloss: Zaczynam o dziewiątej, a kończę o piątej.
    note: '*alle nove* / *alle cinque* (o dziewiątej / o piątej) — przed godziną stoi *alle*, tak jak w zwrotach z godzinami w rozdziale 5.'
