teaching:
  it.a1.unit15.lesson01.teach.piu_meno:
    title: più, meno
    gloss: więcej, mniej
    note: '*più* (więcej) i *meno* (mniej) to podstawowe słowa do stopniowania; stawia się je przed przymiotnikiem albo używa z *di*, żeby porównać.'
    example_gloss:
    - Chcę więcej kawy i mniej herbaty.
  it.a1.unit15.lesson01.teach.di:
    title: di
    gloss: niż / z, od
    note: 'Po *più*/*meno* przyimek *di* znaczy „niż” (*più di due euro*); przed rodzajnikiem określonym łączy się z nim: *di* + *i* = *dei*, *di* + *le* = *delle*.'
    example_gloss:
    - Kawa kosztuje więcej niż dwa euro.
  it.a1.unit15.lesson01.teach.le_mele_costano_piu_dei_pomodori:
    title: Le mele costano più dei pomodori.
    gloss: Jabłka kosztują więcej niż pomidory.
    note: 'W *più dei pomodori* użyto *di* + *i* (po zlaniu: *dei*), żeby porównać z *i pomodori*.'
  it.a1.unit15.lesson01.teach.i_pomodori_costano_meno_delle_mele:
    title: I pomodori costano meno delle mele.
    gloss: Pomidory kosztują mniej niż jabłka.
    note: 'W *meno delle mele* użyto *di* + *le* (po zlaniu: *delle*), żeby porównać z *le mele*.'
  it.a1.unit15.lesson02.teach.quale_preferisci:
    title: Quale preferisci, le mele o i pomodori?
    gloss: 'Co wolisz: jabłka czy pomidory?'
    note: '*Quale* (który, które) prosi rozmówcę o wybór między dwiema właśnie wymienionymi rzeczami.'
  it.a1.unit15.lesson02.teach.preferisco_le_mele:
    title: Preferisco le mele.
    gloss: Wolę jabłka.
    note: '*Preferisco* (wolę) i *le mele* (jabłka) tworzą odpowiedź, w której dokonujesz wyboru.'
    example_gloss:
    - Wolę pomidory.
  it.a1.unit15.lesson03.teach.come:
    title: come
    gloss: tak jak / jak
    note: '*come* (jak) używa się z *buono/a*, żeby porównać dwie rzeczy jako równe.'
    example_gloss:
    - Herbata jest tak samo dobra jak kawa.
  it.a1.unit15.lesson03.teach.le_mele_sono_buone_come_i_pomodori:
    title: Le mele sono buone come i pomodori.
    gloss: Jabłka są tak samo dobre jak pomidory.
    note: '*sono buone* (są dobre, liczba mnoga rodzaju żeńskiego) zgadza się z *le mele*; *come* wprowadza porównanie równości.'
