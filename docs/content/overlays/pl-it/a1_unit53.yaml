    title: Nina słucha o wszystkich
    gloss: Nina jest nowa w kawiarni językowej. Pyta Marca, jacy są inni. Marco opowiada. Giulia jest miła i cierpliwa; pracuje jako pielęgniarka. Luca jest zabawny i chodzi na kurs hiszpańskiego. Chiara jest ciekawska; lubi uczyć się nowych rzeczy. Sam Marco jest spokojny.
    note: Podsumowuje cechy charakteru osób z grupy, podobnie jak czytanki porównawcze w jednostkach o domu, okolicy, poczcie i gotowaniu.
    glosses:
      nuova: nowa (rodzaj żeński)
      caffè: kawiarnia (caffè linguistico = kawiarnia językowa)
      Chiede: pyta
      altri: pozostali
      racconta: opowiada
      gentile: miły
      paziente: cierpliwy
      lavora: pracuje
      infermiera: pielęgniarka
      divertente: zabawny
      segue: chodzi na / uczęszcza
      corso: kurs
      spagnolo: hiszpański
      curiosa: ciekawska (rodzaj żeński)
      imparare: uczyć się
      piace: podoba się (le piace = ona lubi)
      nuove: nowe (liczba mnoga)
      cose: rzeczy
      stesso: sam (stesso)
      calmo: spokojny
