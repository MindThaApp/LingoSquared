teaching:
  it.a1.unit06.lesson01.teach.madre_padre:
    title: la madre, il padre
    gloss: matka, ojciec
    note: Włoskie rzeczowniki mają rodzajnik zależny od rodzaju – *la* przy żeńskich, *il* przy męskich. W polskim rodzajników nie ma.
    example_gloss:
    - To jest mój ojciec.
    - To jest moja matka.
  it.a1.unit06.lesson01.teach.fratello_sorella:
    title: il fratello, la sorella
    gloss: brat, siostra
    note: '*fratello* jest rodzaju męskiego (*il*), a *sorella* żeńskiego (*la*).'
    example_gloss:
    - Mam jednego brata i jedną siostrę.
  it.a1.unit06.lesson01.teach.questo_e_mio_padre:
    title: Questo è mio padre. Questa è mia madre.
    gloss: To jest mój ojciec. To jest moja matka.
    note: '*Questo/Questa* (ten/ta) zgadza się w rodzaju z osobą, o której mowa: *questo* dla mężczyzny, *questa* dla kobiety.'
  it.a1.unit06.lesson01.teach.nonno_nonna:
    title: il nonno, la nonna
    gloss: dziadek, babcia
    note: Ten sam wzór rodzajników męskiego i żeńskiego co w parze *padre/madre*.
    example_gloss:
    - Mój dziadek mieszka w Rzymie.
    - Moja babcia bardzo dobrze gotuje.
  it.a1.unit06.lesson02.teach.hai_fratelli_o_sorelle:
    title: Hai fratelli o sorelle?
    gloss: Masz rodzeństwo?
    note: '*Hai* (masz) + określenie członka rodziny + *o* (lub) to standardowy sposób pytania o rodzeństwo.'
  it.a1.unit06.lesson02.teach.ho_un_fratello_e_una_sorella:
    title: Ho un fratello e una sorella.
    gloss: Mam brata i siostrę.
    note: '*Ho* (mam) otwiera odpowiedź, a po nim stoi *un* (jeden, rodzaj męski) i *una* (jedna, rodzaj żeński).'
  it.a1.unit06.lesson02.teach.moglie_marito:
    title: il marito, la moglie
    gloss: mąż, żona
    note: Kolejna para męski/żeński, z tym samym wzorem rodzajników.
    example_gloss:
    - Sam ma żonę.
  it.a1.unit06.lesson03.teach.hai_figli:
    title: Hai figli?
    gloss: Masz dzieci?
    note: '*figli* (dzieci) to liczba mnoga używana w pytaniu ogólnym, bez względu na to, ile dzieci jest i jakiej są płci.'
  it.a1.unit06.lesson03.teach.ho_due_figli:
    title: Sì, ho due figli. Un maschio e una femmina.
    gloss: Tak, mam dwoje dzieci. Chłopca i dziewczynkę.
    note: '*maschio* (chłopiec) i *femmina* (dziewczynka) określają płeć dzieci po podaniu ich liczby.'
  it.a1.unit06.lesson03.teach.figlio_figlia:
    title: il figlio, la figlia
    gloss: syn, córka
    note: Formy liczby pojedynczej od *figli*, z typowym wzorem rodzajników męskiego i żeńskiego.
    example_gloss:
    - Elena ma syna i córkę.
