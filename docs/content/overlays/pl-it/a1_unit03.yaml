course:
  title: Włoski A1
  description: 'Naucz się włoskiego na poziomie A1: codziennych powitań i krótkich rozmów towarzyskich, ze szczegółowymi wyjaśnieniami po polsku.'
units:
  it.a1.unit03.basic_numbers:
    title: 'Liczby: ceny i numery telefonów'
lessons:
  it.a1.unit03.lesson01.contare_da_zero_a_dieci:
    title: Liczenie od zera do dziesięciu
  it.a1.unit03.lesson02.quanto_costa_al_bar:
    title: Ile to kosztuje? Zamawianie w kawiarni
  it.a1.unit03.lesson03.il_numero_di_telefono:
    title: Wymiana numerów telefonów
teaching:
  it.a1.unit03.lesson01.teach.numeri_zero_cinque:
    title: zero, uno, due, tre, quattro, cinque
    gloss: zero, jeden, dwa, trzy, cztery, pięć
    note: Pierwsze sześć liczb – podstawa cen, wieku i numerów telefonów w tej jednostce.
    example_gloss:
    - Mam dwóch braci.
    - Jest piąta.
  it.a1.unit03.lesson01.teach.numeri_sei_dieci:
    title: sei, sette, otto, nove, dieci
    gloss: sześć, siedem, osiem, dziewięć, dziesięć
    note: Liczby od sześciu do dziesięciu, które kończą zakres 0–10.
    example_gloss:
    - Pracuję osiem godzin dziennie.
    - Sklep otwiera się o dziesiątej.
  it.a1.unit03.lesson01.teach.quanti_anni:
    title: Quanti anni hai?
    gloss: Ile masz lat?
    note: Dosłownie „ile lat masz” – po włosku o wiek pyta się z czasownikiem *avere* (mieć), podobnie jak po polsku („Ile masz lat?”), a nie z czasownikiem „być”.
  it.a1.unit03.lesson01.teach.ho_trent_anni:
    title: Ho trent'anni.
    gloss: Mam trzydzieści lat.
    note: Stały zwrot do podawania wieku z czasownikiem *avere* (dosłownie „mam trzydzieści lat”); „trzydzieści” nie jest tu wprowadzane jako liczebnik — zakres liczb w tej jednostce to 0–10, a 30 i 50 pojawiają się tylko w tym zwrocie i w cenach.
  it.a1.unit03.lesson02.teach.quanto_costa:
    title: Quanto costa un caffè?
    gloss: Ile kosztuje kawa?
    note: '*Quanto costa* to standardowy sposób zapytania o cenę jednego produktu.'
  it.a1.unit03.lesson02.teach.costa_un_euro:
    title: un euro, due euro
    gloss: jedno euro, dwa euro
    note: 'Po włosku *euro* nie zmienia formy w liczbie mnogiej — zarówno w *un euro*, jak i w *due euro* występuje *euro*. Po polsku jest podobnie: jedno euro, dwa euro.'
    example_gloss:
    - Kosztuje jedno euro.
    - To dwa euro pięćdziesiąt.
  it.a1.unit03.lesson02.teach.un_cornetto:
    title: E un cornetto?
    gloss: A rogalik?
    note: Krótkie pytanie dodatkowe o cenę drugiego produktu, *cornetto* (włoski rogalik śniadaniowy).
  it.a1.unit03.lesson02.teach.due_euro_cinquanta:
    title: Sono due euro e cinquanta.
    gloss: To dwa euro pięćdziesiąt.
    note: '*e cinquanta* dodaje centy — dosłownie „i pięćdziesiąt”; tak samo mówi się przy każdej cenie z pięćdziesięcioma centami.'
  it.a1.unit03.lesson02.teach.quanti_ne_vuole:
    title: Quanti ne vuole?
    gloss: Ile Pan/Pani sobie życzy?
    note: Grzeczny sposób, w jaki barista lub sprzedawca pyta, ile sztuk czegoś chcesz; *ne* zastępuje wspomniany już produkt.
  it.a1.unit03.lesson02.teach.ne_vorrei_tre:
    title: Ne vorrei tre, grazie.
    gloss: Poproszę trzy, dziękuję.
    note: '*Ne vorrei* + liczba to grzeczny sposób proszenia o określoną ilość; *ne* znowu odnosi się do wspomnianego produktu.'
  it.a1.unit03.lesson03.teach.qual_e_il_tuo_numero:
    title: Qual è il tuo numero di telefono?
    gloss: Jaki jest twój numer telefonu?
    note: Nieformalny sposób zapytania o czyjś numer telefonu, z użyciem *tuo* (twój).
  it.a1.unit03.lesson03.teach.ti_chiamo_domani:
    title: Ti chiamo domani!
    gloss: Zadzwonię do ciebie jutro!
    note: Przyjazny sposób zakończenia rozmowy po otrzymaniu numeru.
  it.a1.unit03.lesson03.teach.il_mio_numero:
    title: il mio numero
    gloss: mój numer
    note: Włoskie numery telefonów zwykle czyta się cyfra po cyfrze, używając liczb z lekcji 1.
    example_gloss: Mój numer to zero, trzy, cztery, dwa, jeden.
  it.a1.unit03.lesson03.teach.numero_sam:
    title: Il mio numero è zero, tre, quattro, due, uno.
    gloss: Mój numer to zero, trzy, cztery, dwa, jeden.
    note: Sam podaje swój numer telefonu cyfra po cyfrze — tak zwykle czyta się numery telefonów po włosku.
  it.a1.unit03.lesson03.teach.perfetto_grazie:
    title: Perfetto, grazie!
    gloss: Doskonale, dziękuję!
    note: Krótki, pogodny sposób zakończenia rozmowy po uzyskaniu potrzebnej informacji.
