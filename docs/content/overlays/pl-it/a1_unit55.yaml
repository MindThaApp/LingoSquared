    title: Mi piace + pora roku
    gloss: 'Mi piace + pora roku mówi, co sądzisz o danej porze roku: Mi piace l''estate. Przy dwóch porach roku użyj mi piacciono: Mi piacciono l''estate e l''inverno.'
