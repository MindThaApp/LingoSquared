    title: Powitania i przedstawianie się
lessons:
  it.a1.unit01.lesson01.tu_e_lei:
    title: 'Tu i Lei: powitania nieformalne i formalne'
  it.a1.unit01.lesson02.stare_bene_e_salutarsi:
    title: Odpowiadanie i żegnanie się
  it.a1.unit01.lesson03.presentarsi_in_ufficio:
    title: 'Przedstawianie się: pierwszy dzień w biurze'
teaching:
  it.a1.unit01.lesson01.teach.ciao_buongiorno:
    title: Ciao, Buongiorno
    gloss: cześć, dzień dobry
    note: '*Ciao* to swobodne, uniwersalne powitanie między przyjaciółmi i rówieśnikami o każdej porze dnia. *Buongiorno* to standardowe, bardziej formalne powitanie w ciągu dnia – od rana do popołudnia.'
    example_gloss:
    - Cześć, jak się masz?
    - Dzień dobry, jak się Pan/Pani ma?
  it.a1.unit01.lesson01.teach.come_stai_sta:
    title: come stai, come sta
    gloss: jak się masz, jak się Pan/Pani ma
    note: '*come stai* łączy się z *tu* (przyjaciel, rówieśnik); *come sta* łączy się z *Lei* (nieznajomy, szef, osoba, której okazujesz szacunek). To samo pytanie, inny poziom grzeczności.'
    example_gloss:
    - Cześć, jak się dziś masz?
    - Dzień dobry, jak się Pan/Pani dziś ma?
  it.a1.unit01.lesson01.teach.ciao_come_stai:
    title: Ciao, come stai?
    gloss: Cześć, jak się masz?
    note: Swobodne, nieformalne powitanie z pytaniem, używane wobec przyjaciół, kolegów z grupy lub rówieśników.
  it.a1.unit01.lesson01.teach.buongiorno_come_sta:
    title: Buongiorno, come sta?
    gloss: Dzień dobry, jak się Pan/Pani ma?
    note: Formalny odpowiednik, używany wobec osoby, do której zwracasz się z szacunkiem, np. przełożonego nowego współpracownika.
  it.a1.unit01.lesson01.teach.register_rule:
    title: 'tu: informale · Lei: formale o rispettoso'
    gloss: 'tu: nieformalnie · Lei: formalnie lub z szacunkiem'
    note: '*tu* to codzienne „ty” wśród przyjaciół, kolegów i rówieśników. *Lei* to grzecznościowe „Pan/Pani” wobec nieznajomych, w hierarchii służbowej lub przy pierwszym spotkaniu – ma własne formy czasownika (porównaj *tu stai* z *Lei sta*).'
  it.a1.unit01.lesson02.teach.bene_grazie:
    title: Bene, grazie
    gloss: Dobrze, dziękuję
    note: Prosta, neutralna odpowiedź na pytanie „jak się masz”, pasująca do obu poziomów grzeczności, jeśli dodasz *e tu?* lub *e Lei?*
    example_gloss:
    - Dobrze, dziękuję, a ty?
    - Dobrze, dziękuję, a Pan/Pani?
  it.a1.unit01.lesson02.teach.e_tu:
    title: E tu?
    gloss: A tobie?
    note: Nieformalny sposób, by zwrócić pytanie przyjacielowi lub rówieśnikowi.
  it.a1.unit01.lesson02.teach.e_lei:
    title: E Lei?
    gloss: A Panu/Pani?
    note: Formalny sposób, by zwrócić pytanie, zgodny z formą grzecznościową *Lei*.
  it.a1.unit01.lesson02.teach.bene_grazie_e_tu:
    title: Bene, grazie, e tu?
    gloss: Dobrze, dziękuję, a ty?
    note: Pełna nieformalna odpowiedź z pytaniem zwrotnym, mówiona do przyjaciela lub rówieśnika.
  it.a1.unit01.lesson02.teach.bene_grazie_e_lei:
    title: Bene, grazie, e Lei?
    gloss: Dobrze, dziękuję, a Pan/Pani?
    note: Pełna formalna odpowiedź z pytaniem zwrotnym, mówiona do osoby, do której zwracasz się z szacunkiem.
  it.a1.unit01.lesson02.teach.buonasera_buonanotte:
    title: Buonasera, Buonanotte
    gloss: dobry wieczór, dobranoc
    note: '*Buonasera* to powitanie używane po przybyciu gdzieś wieczorem. *Buonanotte* to pożegnanie, gdy ktoś idzie spać lub kończy dzień – nigdy nie służy do powitania.'
    example_gloss:
    - Dobry wieczór, jak się Pan/Pani ma?
    - Dobranoc, do zobaczenia jutro.
  it.a1.unit01.lesson02.teach.arrivederla:
    title: Arrivederla, a domani.
    gloss: Do widzenia, do jutra.
    note: '*Arrivederla* to formalne pożegnanie, używane z formą *Lei*, pasujące do miejsca pracy lub rozmowy z nieznajomym.'
  it.a1.unit01.lesson02.teach.ci_vediamo:
    title: Ciao, ci vediamo domani!
    gloss: Cześć, do zobaczenia jutro!
    note: Swobodne pożegnanie wobec przyjaciół i rówieśników, których zobaczysz następnego dnia.
  it.a1.unit01.lesson03.teach.come_si_chiama:
    title: Come si chiama, scusi?
    gloss: Jak się Pan/Pani nazywa, przepraszam?
    note: '*Come si chiama?* dosłownie pyta „jak Pan/Pani się nazywa” w formie grzecznościowej *Lei*; dodanie *scusi* („przepraszam”) to naturalny grzeczny dodatek przy pytaniu nieznajomego.'
  it.a1.unit01.lesson03.teach.come_ti_chiami:
    title: Come ti chiami?
    gloss: Jak masz na imię? / Jak się nazywasz?
    note: Wersja nieformalna, używana wobec przyjaciela, rówieśnika lub osoby w twoim wieku.
  it.a1.unit01.lesson03.teach.mi_chiamo_elena:
    title: Mi chiamo Elena.
    gloss: Nazywam się Elena.
    note: '*chiamarsi* znaczy „nazywać się” – to standardowy sposób podania własnego imienia, odpowiedni w obu poziomach grzeczności.'
  it.a1.unit01.lesson03.teach.io_sono_sam:
    title: Io sono Sam.
    gloss: Jestem Sam.
    note: Prosta alternatywa dla *mi chiamo*, z czasownikiem *essere* („być”) i imieniem.
  it.a1.unit01.lesson03.teach.piacere:
    title: Piacere, Piacere di conoscerla
    gloss: miło mi, bardzo mi miło (formalnie)
    note: '*Piacere* samo w sobie to krótki, częsty sposób na powiedzenie „miło mi” w obu poziomach grzeczności. *Piacere di conoscerla* to pełniejsza, formalna wersja, używana z *Lei*.'
    example_gloss:
    - Miło mi, Sam!
    - Miło mi panią poznać, pani Eleno.
  it.a1.unit01.lesson03.teach.benvenuto:
    title: Benvenuto in ufficio!
    gloss: Witamy w biurze!
    note: '*Benvenuto* to forma męska słowa „witaj” (używana wobec mężczyzny; kobietę powitamy słowem *Benvenuta*).'
  it.a1.unit01.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: Dziękuję bardzo.
    note: Mocniejszy, bardziej serdeczny sposób podziękowania niż zwykłe *Grazie*.
