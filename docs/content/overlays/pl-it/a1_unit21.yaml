teaching:
  it.a1.unit21.lesson01.teach_maglietta_pantaloni:
    title: la maglietta, i pantaloni
    gloss: koszulka, spodnie
    note: '*Maglietta* jest rodzaju żeńskiego w liczbie pojedynczej, a *pantaloni* to liczba mnoga – podobnie jak polskie „spodnie”.'
    example_gloss:
    - Koszulka jest niebieska.
    - Spodnie są dla Eleny.
  it.a1.unit21.lesson01.teach_scarpe_giacca:
    title: le scarpe, la giacca
    gloss: buty, kurtka
    note: '*Scarpe* to liczba mnoga, a *giacca* to rodzaj żeński w liczbie pojedynczej.'
    example_gloss:
    - Buty są wygodne.
    - Kurtka jest duża.
  it.a1.unit21.lesson01.teach_blu_nero:
    title: blu
    gloss: niebieski
    note: '*Blu* nie zmienia się w zależności od rodzaju.'
    example_gloss:
    - Koszulka jest niebieska.
  it.a1.unit21.lesson01.teach_la_maglietta_e_blu:
    title: La maglietta è blu.
    gloss: Koszulka jest niebieska.
    note: Użyj *è*, aby opisać kolor jednego przedmiotu.
    example_gloss:
    - Koszulka jest niebieska.
  it.a1.unit21.lesson02.teach_taglia_piccola_media_grande:
    title: taglia piccola, media, grande
    gloss: mały rozmiar, średni, duży
    note: '*Taglia* to rozmiar ubrania. Jest rodzaju żeńskiego, więc określenia rozmiaru zgadzają się z nią: *taglia piccola*, *taglia media*; *grande* ma tę samą formę w obu rodzajach.'
    example_gloss:
    - Poproszę rozmiar średni.
  it.a1.unit21.lesson02.teach_vorrei_maglietta_blu:
    title: Vorrei una maglietta blu, taglia media.
    gloss: Poproszę niebieską koszulkę, rozmiar średni.
    note: '*Vorrei* sprawia, że prośba w sklepie brzmi grzecznie.'
    example_gloss:
    - Poproszę niebieską koszulkę, rozmiar średni.
  it.a1.unit21.lesson02.teach_quanto_costa:
    title: Quanto costa?
    gloss: Ile to kosztuje?
    note: Dla jednego przedmiotu użyj *costa* w liczbie pojedynczej.
