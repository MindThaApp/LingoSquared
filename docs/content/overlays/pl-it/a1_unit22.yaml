teaching:
  it.a1.unit22.lesson01.teach_felice_triste:
    title: felice, triste
    gloss: szczęśliwy, smutny
    note: '*Felice* i *triste* kończą się na *-e*, więc ta sama forma służy dla rodzaju męskiego i żeńskiego (*Sam è felice*, *Elena è felice*).'
    example_gloss:
    - Dziś jestem szczęśliwy/szczęśliwa.
    - Dziś jest mi smutno.
  it.a1.unit22.lesson01.teach_stanco_nervoso:
    title: stanco, nervoso
    gloss: zmęczony, zdenerwowany
    note: Te przymiotniki zmieniają końcówki; w tej lekcji poznajesz formy rodzaju męskiego, takie jak w słowniku.
    example_gloss:
    - Sam jest zmęczony.
    - Dziś jestem zdenerwowany.
  it.a1.unit22.lesson01.teach_come_ti_senti:
    title: Come ti senti?
    gloss: Jak się Pan/Pani czuje?
    note: '*Ti senti* to nieformalna forma „czujesz się”, używana wobec przyjaciela.'
    example_gloss:
    - Jak się dziś czujesz?
  it.a1.unit22.lesson01.teach_sono_felice:
    title: Sono felice.
    gloss: Jestem zadowolony.
    note: Użyj *sono* z przymiotnikiem opisującym uczucie.
    example_gloss:
    - Dziś jestem szczęśliwy.
  it.a1.unit22.lesson02.teach_perche:
    title: perché
    gloss: ponieważ / dlaczego
    note: W tej lekcji *perché* podaje przyczynę uczucia.
    example_gloss:
    - Jestem szczęśliwy, bo dziś świeci słońce.
  it.a1.unit22.lesson02.teach_sono_felice_perche:
    title: Sono felice perché oggi c'è il sole.
    gloss: Jestem szczęśliwy, bo dziś świeci słońce.
    note: 'To pełne zdanie: uczucie i jego przyczyna.'
    example_gloss:
    - W Mediolanie jestem szczęśliwy, bo dziś świeci słońce.
  it.a1.unit22.lesson02.teach_sono_un_poco_stanca:
    title: Sono un po' stanca.
    gloss: Jestem trochę zmęczony.
    note: '*Stanca* jest rodzaju żeńskiego, ponieważ mówi to Elena.'
    example_gloss:
    - Dziś jestem trochę zmęczona.
  it.a1.unit22.lesson02.teach_ma_sto_bene:
    title: ma sto bene
    gloss: ale czuję się dobrze
    note: '*Ma* przeciwstawia zmęczenie temu, że wszystko jest w porządku.'
    example_gloss:
    - Jestem zmęczony, ale czuję się dobrze.
