  it.a1.unit08.lesson01.teach.quanto_costano:
    title: Quanto costano le mele?
    gloss: Ile kosztują jabłka?
    note: '*Quanto costano?* mówimy o kilku rzeczach naraz – „ile one kosztują”.'
  it.a1.unit08.lesson01.teach.costano_tre_euro:
    title: Costano tre euro al chilo.
    gloss: Kosztują trzy euro za kilogram.
    note: '*al chilo* („za kilogram”) podaje cenę za jednostkę wagi.'
  it.a1.unit08.lesson02.teach.quanto_costa_questo:
    title: Quanto costa questo?
    gloss: Ile to kosztuje?
    note: '*Quanto costa?* (liczba pojedyncza) mówimy, gdy pytamy o jedną rzecz.'
  it.a1.unit08.lesson02.teach.un_euro_e_cinquanta:
    title: Un euro e cinquanta.
    gloss: Euro pięćdziesiąt.
    note: 'Po włosku kwotę w euro łączy się z centami spójnikiem *e* („i”): un euro e cinquanta. Po polsku zwykle mówimy po prostu „euro pięćdziesiąt”, bez spójnika.'
  it.a1.unit08.lesson02.teach.vorrei_un_chilo:
    title: Vorrei un chilo di mele, per favore.
    gloss: Poproszę kilogram jabłek.
    note: '*un chilo di* („kilogram czegoś”) podaje ilość, zanim nazwiemy produkt.'
  it.a1.unit08.lesson03.teach.va_bene_lo_prendo:
    title: Va bene, lo prendo.
    gloss: Dobrze, biorę to.
    note: '*lo prendo* („biorę to”) potwierdza zakup; *lo* odnosi się do rzeczy, o której właśnie mowa.'
  it.a1.unit08.lesson03.teach.un_chilo_mezzo_chilo:
