    title: Spesso i ogni giorno przy środkach transportu
    gloss: 'Znasz już spesso (często) i ogni giorno (codziennie). Używasz ich także przy środkach transportu: vado spesso in bicicletta (często jeżdżę na rowerze), viaggio ogni giorno in treno (codziennie podróżuję pociągiem).'
