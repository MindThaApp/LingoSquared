    title: Marco odpowiada
    gloss: 'Marco: No to jadę pociągiem, razem z Giulią.'
  it.a1.unit45.lesson05.teach.giulia_viaggia_ogni:
    title: Kto jak jeździ?
    gloss: Giulia codziennie jeździ do pracy pociągiem. Marco zwykle jeździ rowerem, ale kiedy pada deszcz, też jeździ pociągiem. Luca woli jeździć samochodem. Chiara mieszka blisko i chodzi do pracy pieszo. A ty jak dojeżdżasz do pracy?
    note: 'Zestawia cztery sposoby poruszania się i jeden warunek (*quando piove*, czyli kiedy pada deszcz). *Andare* (iść, jechać) jest czasownikiem nieregularnym: *vado*, *va*.'
    glosses:
      viaggia: dojeżdża
      ogni: każdy
      giorno: dzień
      treno: pociąg
      lavoro: praca
      bicicletta: rower (in bicicletta = rowerem)
      solito: zwykły (di solito = zwykle)
      piove: pada deszcz
      prende: bierze
      andare: iść, jechać (andare in macchina = jechać samochodem)
      preferisce: woli
      macchina: samochód
      abita: mieszka
      vicino: w pobliżu
      piedi: stopy (a piedi = pieszo)
      vai: idziesz, jedziesz
  it.a1.unit45.lesson05.teach.chiara_abita_vicino:
    title: Chiara mieszka blisko i chodzi do pracy pieszo
    gloss: Chiara mieszka blisko i chodzi do pracy pieszo.
  it.a1.unit45.lesson06.teach.giulia_andiamo_insieme:
