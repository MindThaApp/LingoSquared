    title: In + środek transportu, a piedi pieszo
    gloss: 'Przy środkach transportu po włosku mówi się in: in treno, in bicicletta, in macchina. „Pieszo” to a piedi: vado a piedi.'
    note: 'Po polsku mówimy „pociągiem” albo „w pociągu”, a po włosku *in treno*, bez rodzajnika: *in treno*, a nie *nel treno*.'
