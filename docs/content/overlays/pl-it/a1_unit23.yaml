teaching:
  it.a1.unit23.lesson01.teach_pronto_chi_parla:
    title: Pronto, chi parla?
    gloss: Halo? Kto mówi?
    note: Po włosku telefon odbiera się zwykle słowem *pronto*, a nie *ciao*.
    example_gloss:
    - Halo, tu Elena.
  it.a1.unit23.lesson01.teach_telefono_messaggio:
    title: il telefono, un messaggio
    gloss: telefon, wiadomość
    note: '*Messaggio* jest rodzaju męskiego; mów *un messaggio*.'
    example_gloss:
    - Wyślę ci wiadomość.
  it.a1.unit23.lesson01.teach_sono_elena:
    title: Sono Elena.
    gloss: Jestem Elena.
    note: Przez telefon po włosku zwykle przedstawia się za pomocą *sono* (dosł. „jestem”), a nie „tu mówi”.
    example_gloss:
    - Halo, tu Elena.
  it.a1.unit23.lesson01.teach_ciao_sam:
    title: Ciao Sam, sono Elena.
    gloss: Cześć, Sam, tu Elena.
    note: '*Sono Elena* to naturalny sposób, by powiedzieć „tu Elena” podczas rozmowy telefonicznej.'
    example_gloss:
    - Cześć, Sam, tu Elena przez telefon.
  it.a1.unit23.lesson02.teach_puoi_ripetere:
    title: Puoi ripetere, per favore?
    gloss: Możesz powtórzyć, proszę?
    note: '*Puoi* jest formą nieformalną, odpowiednią między Eleną a Samem.'
    example_gloss:
    - Sam, możesz powtórzyć, proszę?
  it.a1.unit23.lesson02.teach_piu_piano:
    title: Più piano, per favore.
    gloss: Wolniej, proszę.
    note: '*Più piano* znaczy „wolniej”; tak zwykle prosi się, by ktoś mówił wolniej.'
    example_gloss:
    - Mów wolniej, proszę.
  it.a1.unit23.lesson02.teach_ti_mando_un_messaggio:
    title: Ti mando un messaggio.
    gloss: Wyślę ci wiadomość.
    note: '*Ti mando* znaczy „wysyłam ci” w mowie nieformalnej.'
    example_gloss:
    - Cześć, Sam, wyślę ci wiadomość.
  it.a1.unit23.lesson02.teach_si_sono_elena:
    title: Sì, sono Elena.
    gloss: Tak, to ja, Elena.
    note: '*Sì* piszemy z akcentem; nie pisz *si* bez akcentu w znaczeniu „tak”.'
    example_gloss:
    - Tak, tu Elena.
