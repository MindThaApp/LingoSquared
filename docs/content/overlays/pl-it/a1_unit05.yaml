teaching:
  it.a1.unit05.lesson01.teach.che_ore_sono:
    title: Che ore sono?
    gloss: Która jest godzina?
    note: Standardowe włoskie pytanie o godzinę; dosłownie „jakie godziny są” – w liczbie mnogiej, inaczej niż po polsku „Która jest godzina?”.
  it.a1.unit05.lesson01.teach.sono_le_tre:
    title: Sono le tre.
    gloss: Jest trzecia.
    note: '*Sono le* + liczba podaje godzinę, z wyjątkiem pierwszej.'
  it.a1.unit05.lesson01.teach.ore_una_dodici:
    title: l'una, le due, le tre, le dodici
    gloss: pierwsza, druga, trzecia, dwunasta
    note: Tylko pierwsza godzina ma formę *è l'una* (liczba pojedyncza) zamiast *sono le* (liczba mnoga), bo „jeden” jest w liczbie pojedynczej.
    example_gloss:
    - Jest pierwsza.
    - Jest dwunasta.
  it.a1.unit05.lesson01.teach.ore_quattro_sei:
    title: le quattro, le cinque, le sei
    gloss: czwarta, piąta, szósta
    note: Dalej obowiązuje ten sam wzór *sono le* + liczba, co przy trzeciej.
    example_gloss:
    - Jest czwarta.
    - Jest szósta.
  it.a1.unit05.lesson02.teach.sono_le_tre_e_mezzo:
    title: Sono le tre e mezzo.
    gloss: Jest wpół do czwartej.
    note: '*e mezzo* („i pół”) dodaje do pełnej godziny trzydzieści minut.'
  it.a1.unit05.lesson02.teach.sono_le_tre_e_un_quarto:
    title: Sono le tre e un quarto.
    gloss: Jest kwadrans po trzeciej.
    note: '*e un quarto* („i kwadrans”) dodaje do pełnej godziny piętnaście minut.'
  it.a1.unit05.lesson02.teach.sono_le_quattro_meno_un_quarto:
    title: Sono le quattro meno un quarto.
    gloss: Jest za kwadrans czwarta.
    note: '*meno un quarto* („bez kwadransa”) odlicza od NASTĘPNEJ godziny, podobnie jak po polsku „za kwadrans czwarta”.'
  it.a1.unit05.lesson03.teach.a_che_ora_ci_vediamo:
    title: A che ora ci vediamo?
    gloss: O której się spotykamy?
    note: '*A che ora* pyta, o której godzinie coś się dzieje; *ci vediamo* znaczy „zobaczymy się”.'
  it.a1.unit05.lesson03.teach.ci_vediamo_alle_tre_e_mezzo:
    title: Ci vediamo alle tre e mezzo.
    gloss: Spotkamy się wpół do czwartej.
    note: '*alle* („o”) stosuje się przed konkretną godziną, natomiast *sono le* tylko podaje, która jest godzina.'
  it.a1.unit05.lesson03.teach.parti_del_giorno:
    title: di mattina, di pomeriggio, di sera
    gloss: rano, po południu, wieczorem
    note: Te wyrażenia określają porę dnia, której dotyczy godzina, bo sama włoska godzina zegarowa nie mówi, czy chodzi o rano, czy o wieczór.
    example_gloss:
    - Czy to spotkanie rano, czy wieczorem?
    - Po południu, wpół do czwartej.
  it.a1.unit05.lesson03.teach.e_di_pomeriggio:
    title: È di pomeriggio, alle tre e mezzo.
    gloss: Po południu, wpół do czwartej.
    note: Łączy porę dnia z konkretną godziną, żeby uniknąć niejasności między rankiem a wieczorem.
