teaching:
  it.a1.unit19.lesson01.teach.treno_stazione:
    title: il treno, la stazione
    gloss: pociąg, dworzec
    note: '*il treno* jest rodzaju męskiego; *la stazione* jest rodzaju żeńskiego.'
    example_gloss:
    - Pociąg stoi na dworcu.
  it.a1.unit19.lesson01.teach.binario_biglietto:
    title: il binario, il biglietto
    gloss: peron, bilet
    note: '*binario* to peron (tor); *biglietto* to bilet.'
    example_gloss:
    - Bilet jest do Rzymu.
  it.a1.unit19.lesson01.teach.parte_alle_otto:
    title: Parte alle otto.
    gloss: Odjeżdża o ósmej.
    note: '*parte* w odniesieniu do środków transportu znaczy „odjeżdża”.'
    example_gloss:
    - Pociąg odjeżdża o ósmej.
  it.a1.unit19.lesson01.teach.dal_binario_tre:
    title: dal binario tre
    gloss: z peronu trzeciego
    note: '*dal* to połączenie *da* + *il*, czyli „z”.'
    example_gloss:
    - Odjeżdża z peronu trzeciego.
  it.a1.unit19.lesson02.teach.a_che_ora_parte:
    title: A che ora parte il treno?
    gloss: O której odjeżdża pociąg?
    note: Pytania z *A che ora...?* stosuje się do godzin odjazdu według rozkładu.
    example_gloss:
    - O której odjeżdża pociąg do Rzymu?
  it.a1.unit19.lesson02.teach.vorrei_un_biglietto:
    title: Vorrei un biglietto per Roma alle otto, per favore.
    gloss: Poproszę bilet do Rzymu na ósmą.
    note: '*Vorrei* to uprzejma forma prośby, np. przy zakupie („chciałbym / chciałabym”); *alle otto* dodaje godzinę podróży.'
    example_gloss:
    - Dzień dobry, poproszę bilet do Rzymu.
  it.a1.unit19.lesson02.teach.il_treno_per_roma:
    title: il treno per Roma
    gloss: pociąg do Rzymu
    note: Użyj *per*, mówiąc o celu podróży.
    example_gloss:
    - Pociąg do Rzymu odjeżdża o ósmej.
  it.a1.unit19.lesson02.teach.hai_il_biglietto:
    title: Hai il biglietto?
