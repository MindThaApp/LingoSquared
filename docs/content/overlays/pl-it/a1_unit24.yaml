teaching:
  it.a1.unit24.lesson01.teach_soldi_carta:
    title: i soldi, la carta
    gloss: pieniądze, karta
    note: '*Soldi* jest po włosku w liczbie mnogiej (podobnie jak polskie „pieniądze”); *carta* to zwykła krótka nazwa karty płatniczej.'
    example_gloss:
    - Mam pieniądze.
    - Płacę kartą.
  it.a1.unit24.lesson01.teach_contanti_scontrino:
    title: i contanti, lo scontrino
    gloss: gotówka, paragon
    note: '*Contanti* występuje w liczbie mnogiej; *scontrino* to zwykły paragon ze sklepu.'
    example_gloss:
    - Płacę gotówką.
    - Oto paragon.
  it.a1.unit24.lesson01.teach_pago_con_la_carta:
    title: Pago con la carta.
    gloss: Płacę kartą.
    note: Mówiąc o płaceniu kartą, użyj *con la carta*.
    example_gloss:
    - W kawiarni płacę kartą.
  it.a1.unit24.lesson01.teach_pago_in_contanti:
    title: Pago in contanti.
    gloss: Płacę gotówką.
    note: Mówiąc o płaceniu gotówką, użyj *in contanti*.
    example_gloss:
    - Dziś płacę gotówką.
  it.a1.unit24.lesson02.teach_posso_pagare_carta:
    title: Posso pagare con la carta?
    gloss: Czy mogę zapłacić kartą?
    note: '*Posso pagare...?* służy do zapytania, czy dana forma płatności jest przyjmowana.'
    example_gloss:
    - Czy mogę dziś zapłacić kartą?
  it.a1.unit24.lesson02.teach_sono_dieci_euro:
    title: Sono dieci euro.
    gloss: To dziesięć euro.
    note: Przy cenach po włosku często używa się *sono* w liczbie mnogiej.
    example_gloss:
    - Ta koszulka kosztuje dziesięć euro.
  it.a1.unit24.lesson02.teach_si_certo:
    title: Sì, certo.
    gloss: Tak, oczywiście.
    note: Dla „tak” pisz *Sì* z akcentem; *si* bez akcentu znaczy coś innego.
    example_gloss:
    - Tak, oczywiście, płacę kartą.
  it.a1.unit24.lesson02.teach_ecco_scontrino:
    title: Ecco lo scontrino.
    gloss: Oto paragon.
    note: '*Ecco* coś przedstawia: oto / oto są.'
    example_gloss:
    - Dziękuję, oto paragon.
