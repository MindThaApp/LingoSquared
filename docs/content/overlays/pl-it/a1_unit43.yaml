    title: Ptak Niny
teaching:
  it.a1.unit43.lesson01.teach.l_animale_un:
    title: Zwierzę, zwierzę domowe
    gloss: zwierzę / zwierzę domowe
    note: '*Animale* to słowo ogólne; *animale domestico* znaczy zwierzę domowe (dosłownie: zwierzę domowe, oswojone).'
    example_gloss:
    - Pies to zwierzę.
    - Pies to też zwierzę domowe.
  it.a1.unit43.lesson01.teach.il_cane_il:
    title: Pies i kot
    gloss: pies / kot
    example_gloss:
    - Giulia ma psa.
    - Luca ma kota.
  it.a1.unit43.lesson01.teach.il_pesce_l:
    title: Ryba i ptak
    gloss: ryba / ptak
    example_gloss:
    - Dziadek ma rybę.
    - Nina ma ptaka.
  it.a1.unit43.lesson01.teach.hai_un_animale:
    title: Masz zwierzę domowe?
    gloss: Masz zwierzę domowe?
    note: '*Hai ...?* to forma *tu* czasownika *avere*. Zdanie twierdzące zamienia się w pytanie tylko dzięki intonacji.'
  it.a1.unit43.lesson01.teach.si_ho_un:
    title: Tak, mam psa
    gloss: Tak, mam psa.
    note: Prosta odpowiedź twierdząca z nowym słownictwem z tej lekcji.
  it.a1.unit43.lesson01.teach.no_non_ho:
    title: Nie, nie mam zwierzęcia domowego
    gloss: Nie, nie mam zwierzęcia domowego.
    note: 'Żeby powiedzieć, że czegoś nie masz, postaw *non* przed czasownikiem: *non ho*. Zobacz notatkę o gramatyce.'
  it.a1.unit43.lesson01.teach.per_dire_che:
    title: Non przed czasownikiem
    gloss: 'Żeby powiedzieć, że czegoś nie masz, postaw non przed czasownikiem: Non ho tempo, Non ho animali domestici.'
    note: 'Po *non ho* rzeczownik zwykle występuje bez rodzajnika: *non ho tempo*, *non ho animali*. Po polsku podobnie mówimy „nie mam czasu”, „nie mam zwierząt”, ale używamy dopełniacza, a po włosku nie ma takiej zmiany formy.'
  it.a1.unit43.lesson02.teach.portare_a_spasso:
    title: Wyprowadzać na spacer (zwierzę)
    gloss: wyprowadzać na spacer (zwierzę)
    note: '*Portare a spasso* to stałe wyrażenie oznaczające wyprowadzanie zwierzęcia na spacer. Zaimek stoi przed czasownikiem: *lo porto a spasso*.'
    example_gloss: Codziennie wyprowadzam psa na spacer.
  it.a1.unit43.lesson02.teach.il_pronome_lo:
    title: Zaimki stoją przed czasownikiem
    gloss: 'Zaimek lo zastępuje słowo „pies” i stoi przed czasownikiem: lo porto a spasso, gli do da mangiare.'
    note: 'Po polsku zaimek zwykle stoi po czasowniku lub swobodnie zmienia miejsce („wyprowadzam go”, „go wyprowadzam”); po włosku *lo* i *gli* stoją zawsze przed czasownikiem: *lo porto*, *gli do*.'
  it.a1.unit43.lesson02.teach.dare_da_mangiare:
    title: Karmić
    gloss: karmić
    example_gloss: Codziennie karmię kota.
  it.a1.unit43.lesson02.teach.giocare_con:
    title: Bawić się z
    gloss: bawić się z
    example_gloss: Luca bawi się ze swoim kotem.
  it.a1.unit43.lesson02.teach.porto_a_spasso:
    title: Codziennie wyprowadzam psa
    gloss: Codziennie wyprowadzam psa na spacer.
    note: '*Ogni giorno* (codziennie) stoi na końcu zdania, jak w *porto a spasso il cane ogni giorno*.'
  it.a1.unit43.lesson02.teach.do_da_mangiare:
    title: Codziennie karmię kota
    gloss: Codziennie karmię kota.
    note: '*Dare da mangiare* (karmić) to dosłownie „dać do jedzenia”. *Do* to forma *io* czasownika *dare*.'
  it.a1.unit43.lesson03.teach.il_plurale_cambia:
    title: 'Liczba mnoga: il cane -> i cani'
    gloss: 'Liczba mnoga zmienia ostatnią samogłoskę i rodzajnik: il cane -> i cani, il gatto -> i gatti, l''uccello -> gli uccelli, il pesce -> i pesci.'
    note: Regularny wzór tworzenia liczby mnogiej we włoskim, który po raz pierwszy pojawia się tu na przykładzie nazw zwierząt.
  it.a1.unit43.lesson03.teach.i_cani_i:
    title: Psy i koty
    gloss: psy / koty
    example_gloss:
    - Marco kocha psy.
    - Chiara kocha koty.
  it.a1.unit43.lesson03.teach.i_pesci_gli:
    title: Ryby i ptaki (liczba mnoga)
    gloss: ryby / ptaki
    example_gloss:
    - Uwielbiam ryby.
    - Dziadek uwielbia ptaki.
  it.a1.unit43.lesson03.teach.amo_gli_animali:
    title: Kocham zwierzęta
    gloss: Kocham zwierzęta.
    note: '*Amare* (kochać) łączy się bezpośrednio z dopełnieniem: *amo gli animali*. Rzeczownik w liczbie mnogiej wymaga rodzajnika w liczbie mnogiej *gli*.'
  it.a1.unit43.lesson03.teach.chiara_ama_i:
    title: Chiara kocha koty, ale nie ma zwierzęcia domowego
    gloss: Chiara kocha koty, ale nie ma zwierzęcia domowego.
    note: 'Przeciwstawienie: kochać zwierzęta, a mimo to żadnego nie mieć.'
  it.a1.unit43.lesson04.teach.marco_hai_un:
    title: Marco pyta o zwierzę domowe
    gloss: 'Marco: Masz zwierzę domowe, Giulio?'
  it.a1.unit43.lesson04.teach.giulia_si_ho:
    title: Giulia ma psa
    gloss: 'Giulia: Tak, mam psa.'
  it.a1.unit43.lesson04.teach.marco_com_e:
    title: Marco pyta, jak wygląda pies
    gloss: 'Marco: Jaki on jest?'
    note: '*Com''è?* można zapytać także o zwierzęta. W odpowiedzi używa się *è* lub *ha*: *è piccolo*, *ha il pelo castano*.'
  it.a1.unit43.lesson04.teach.giulia_ha_il:
    title: Giulia opisuje swojego psa
    gloss: 'Giulia: Ma brązową sierść i jest mały.'
    note: Słownictwo o kolorze włosów i wielkości z lekcji o wyglądzie, tym razem do opisu sierści zwierzęcia, a nie włosów człowieka.
  it.a1.unit43.lesson04.teach.un_animale_e:
    title: Zwierzęta są rodzaju męskiego lub żeńskiego
    gloss: 'Zwierzę jest rodzaju męskiego lub żeńskiego tak jak człowiek: il cane to lui, la gatta to lei.'
    note: 'We włoskim nie ma rodzaju nijakiego: każdy rzeczownik jest męski lub żeński, więc pies to *lui*, a kotka to *lei*, a zaimki się do tego dostosowują (*lo*, *la*).'
  it.a1.unit43.lesson04.teach.marco_lo_porti:
    title: Marco pyta o spacery
    gloss: 'Marco: Wyprowadzasz go codziennie na spacer?'
  it.a1.unit43.lesson04.teach.giulia_si_lo:
    title: Giulia opisuje swój codzienny rytm
    gloss: 'Giulia: Tak, codziennie wyprowadzam go na spacer i go karmię.'
  it.a1.unit43.lesson05.teach.marco_e_chiara:
    title: Marco, Chiara i Luca o zwierzętach
    gloss: 'Marco i Chiara oboje kochają zwierzęta, ale żadne z nich nie ma zwierzęcia domowego. Marco kocha psy, a Chiara kocha koty. Luca natomiast ma zwierzę domowe: kota. Często bawi się z kotem i codziennie go karmi. A ty masz zwierzę domowe?'
    note: 'Przeciwstawienie: kochać zwierzę a rzeczywiście je mieć.'
    glosses:
      amano: kochać
      entrambi: oboje
      animali: zwierzęta
      due: dwóch (nessuno dei due = żadne z dwojga)
      domestico: domowy (animale domestico = zwierzę domowe)
      cani: psy
      gatti: koty
      gatto: kot
      gioca: bawi się
      dà: daje
      ogni: każdy
      mangiare: jeść (dare da mangiare = karmić)
  it.a1.unit43.lesson05.teach.luca_gioca_spesso:
    title: Luca często bawi się ze swoim kotem
    gloss: Luca często bawi się ze swoim kotem.
    note: '*Spesso* (często) stoi po czasowniku: *gioca spesso*. *Giocare con* znaczy bawić się z kimś.'
  it.a1.unit43.lesson05.teach.amo_i_cani:
    title: Kocham psy. Nie mam zwierzęcia domowego.
    gloss: Kocham psy. Nie mam zwierzęcia domowego.
    note: Wzorcowa odpowiedź z dwóch zdań, którą możesz wykorzystać w zadaniu pisemnym z tej lekcji.
  it.a1.unit43.lesson06.teach.giulia_nina_hai:
    title: Giulia pyta Ninę
    gloss: 'Giulia: Nina, ty też masz zwierzę domowe?'
  it.a1.unit43.lesson06.teach.nina_si_ho:
    title: Nina ma ptaka o imieniu Pico
    gloss: 'Nina: Tak, mam ptaka. Nazywa się Pico.'
    note: '*Si chiama Pico* znaczy „ma na imię Pico”, dosłownie „nazywa się Pico”.'
  it.a1.unit43.lesson06.teach.marco_che_bello:
    title: Reakcja Marca
    gloss: 'Marco: Jak miło! Co z nim robisz codziennie?'
  it.a1.unit43.lesson06.teach.nina_gli_do:
    title: Nina codziennie karmi ptaka
    gloss: 'Nina: Codziennie daję mu jeść.'
  it.a1.unit43.lesson06.teach.marco_anch_io:
    title: Marco też kocha ptaki
    gloss: 'Marco: Ja też kocham ptaki.'
  it.a1.unit43.lesson06.teach.giulia_che_bello:
    title: Giulia kończy rozmowę
    gloss: 'Giulia: Jak miło, że całą naszą trójkę łączy miłość do zwierząt!'
    note: Zdanie kończące rozmowę, które łączy to, co wiemy o zwierzętach wszystkich trojga bohaterów.
