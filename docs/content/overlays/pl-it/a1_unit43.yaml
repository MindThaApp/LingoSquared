course:
  title: Włoski A1
  description: 'Włoski dla początkujących o zwierzętach domowych i popularnych zwierzętach: ich nazwy, podstawowa opieka (spacer, karmienie, zabawa), mówienie o zwierzętach, które kochasz, nawet jeśli żadnego nie masz, oraz włoska liczba mnoga.'
