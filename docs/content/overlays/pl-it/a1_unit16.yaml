  it.a1.unit16.lesson02.teach.la_febbre_la_tosse:
    title: la febbre, la tosse
    gloss: gorączka, kaszel
    note: 'Częste objawy, używane z *avere* (mieć): *Ho la febbre* (Mam gorączkę).'
    example_gloss:
