  it.a1.unit16.lesson02.teach.non_mi_sento_bene:
    title: non mi sento bene
    gloss: źle się czuję
    note: '*mi sento* (czuję się) plus *bene* (dobrze); *non* zaprzecza, więc całość znaczy: nie czuję się dobrze.'
    example_gloss:
