teaching:
  it.a1.unit18.lesson01.teach.la_cucina_il_soggiorno:
    title: la cucina, il soggiorno
    gloss: kuchnia, salon
    note: '*la cucina* (kuchnia) jest rodzaju żeńskiego; *il soggiorno* (salon) jest rodzaju męskiego.'
    example_gloss:
    - Kuchnia jest duża.
    - Salon jest wygodny.
  it.a1.unit18.lesson01.teach.la_camera_da_letto_il_bagno:
    title: la camera da letto, il bagno
    gloss: sypialnia, łazienka
    note: '*la camera da letto* to dosłownie „pokój na łóżko” (*letto* = łóżko); *il bagno* to łazienka.'
    example_gloss:
    - Sypialnia jest mała.
    - Łazienka jest czysta.
  it.a1.unit18.lesson01.teach.questa_e_la_mia_casa:
    title: Questa è la mia casa.
    gloss: To jest mój dom.
    note: '*Questa* (ta, forma żeńska) pasuje do *casa* (dom), które we włoskim jest rodzaju żeńskiego.'
  it.a1.unit18.lesson01.teach.ci_sono_quattro_stanze:
    title: Ci sono quattro stanze.
    gloss: Są cztery pokoje.
    note: '*Ci sono* (są) + liczba + *stanze* (pokoje); *quattro* (cztery) było w lekcji 3.'
  it.a1.unit18.lesson02.teach.il_letto_il_tavolo:
    title: il letto, il tavolo
    gloss: łóżko, stół
    note: '*il letto* (łóżko) i *il tavolo* (stół) są rodzaju męskiego.'
    example_gloss:
    - Łóżko jest w sypialni.
    - Stół jest w kuchni.
  it.a1.unit18.lesson02.teach.la_sedia_il_divano:
    title: la sedia, il divano
    gloss: krzesło, sofa
    note: '*la sedia* (krzesło) jest rodzaju żeńskiego; *il divano* (sofa) jest rodzaju męskiego.'
    example_gloss:
    - Krzesło stoi blisko stołu.
    - Sofa jest w salonie.
  it.a1.unit18.lesson02.teach.il_letto_e_nella_camera_da_letto:
    title: Il letto è nella camera da letto.
    gloss: Łóżko jest w sypialni.
    note: '*nella* to połączenie *in* + *la*, czyli „w”.'
  it.a1.unit18.lesson02.teach.il_divano_e_nel_soggiorno:
    title: Il divano è nel soggiorno.
    gloss: Sofa jest w salonie.
    note: '*nel* to połączenie *in* + *il* (rodzaj męski), czyli „w”.'
  it.a1.unit18.lesson03.teach.vicino_a_davanti:
    title: vicino a, davanti a
    gloss: blisko, przed
    note: Oba wyrażenia to dwuwyrazowe przyimki zakończone na *a*, które zrasta się z następującym rodzajnikiem (*al*, *alla*).
    example_gloss:
    - Krzesło stoi blisko stołu.
    - Łóżko stoi przed oknem.
  it.a1.unit18.lesson03.teach.dietro_sopra_sotto:
    title: dietro, sopra, sotto
    gloss: za, nad / na, pod
    note: 'Jeszcze trzy słowa określające położenie: *dietro* (za), *sopra* (nad / na), *sotto* (pod) — żadne z nich nie wymaga *a* przed rodzajnikiem.'
    example_gloss:
    - Sofa stoi za stołem.
    - Książka leży na stole.
    - Kot jest pod łóżkiem.
  it.a1.unit18.lesson03.teach.dove_il_letto:
    title: Dov'è il letto?
    gloss: Gdzie jest łóżko?
    note: '*Dov''è* to skrócone połączenie *dove* (gdzie) + *è* (jest).'
  it.a1.unit18.lesson03.teach.il_letto_e_vicino_alla_finestra:
    title: Il letto è vicino alla finestra.
    gloss: Łóżko jest blisko okna.
    note: '*vicino alla finestra* to *vicino a* + *la finestra* (okno), zrośnięte w *alla*.'
