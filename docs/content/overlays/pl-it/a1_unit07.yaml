teaching:
  it.a1.unit07.lesson01.teach.caffe_cornetto:
    title: il caffè, il cornetto
    gloss: kawa, rogalik
    note: 'Oba rzeczowniki są rodzaju męskiego (*il*): *caffè* to codzienne włoskie espresso, a *cornetto* to typowy słodki rogalik na śniadanie.'
    example_gloss:
    - Poproszę kawę.
    - Poproszę rogalik.
  it.a1.unit07.lesson01.teach.panino_acqua:
    title: il panino, l'acqua
    gloss: kanapka, woda
    note: '*panino* jest rodzaju męskiego (*il*); *acqua* jest rodzaju żeńskiego, ale przed samogłoską przyjmuje *l''*.'
    example_gloss:
    - Poproszę kanapkę.
    - Poproszę wodę.
  it.a1.unit07.lesson01.teach.cosa_desidera:
    title: Cosa desidera?
    gloss: Co podać?
    note: Grzeczne pytanie w formie *Lei*, które barista zadaje klientowi.
  it.a1.unit07.lesson01.teach.vorrei_un_caffe:
    title: Vorrei un caffè e un cornetto, per favore.
    gloss: Poproszę kawę i rogalik.
    note: '*Vorrei* („chciałbym”) to grzeczny sposób składania zamówienia; *e* („i”) dodaje drugą pozycję.'
  it.a1.unit07.lesson02.teach.vorrei_due_caffe:
    title: Vorrei due caffè, per favore.
    gloss: Poproszę dwie kawy.
    note: '*due* („dwa”) zastępuje rodzajnik, gdy zamawiasz więcej niż jedną rzecz.'
