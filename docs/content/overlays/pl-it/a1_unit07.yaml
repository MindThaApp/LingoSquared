    title: E per Lei?
    gloss: A dla Pani/Pana?
    note: '*E per Lei?* to pytanie do kolejnego klienta, co dla niego, w grzecznej formie *Lei*.'
  it.a1.unit07.lesson02.teach.basta_cosi:
    title: Basta così, grazie.
    gloss: To wszystko, dziękuję.
    note: Standardowy sposób zakończenia zamówienia, gdy nie chcesz już nic więcej.
