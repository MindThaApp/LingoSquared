  it.a1.unit09.lesson01.teach.farmacia_banca:
    title: la farmacia, la banca
    gloss: apteka, bank
    note: Oba rzeczowniki są rodzaju żeńskiego (*la*).
    example_gloss:
    - Przepraszam, gdzie jest apteka?
  it.a1.unit09.lesson01.teach.stazione_ufficio_postale:
    title: la stazione, l'ufficio postale
    gloss: dworzec, poczta
    note: '*stazione* jest rodzaju żeńskiego (*la*); *ufficio* jest rodzaju męskiego, ale przed samogłoską przyjmuje *l''*.'
    example_gloss:
    - Dworzec jest niedaleko.
  it.a1.unit09.lesson01.teach.scusi_dove_la_farmacia:
    title: Scusi, dov'è la farmacia?
    gloss: Przepraszam, gdzie jest apteka?
    note: '*Scusi* (przepraszam, forma grzecznościowa) otwiera pytanie przed *dov''è* (gdzie jest).'
  it.a1.unit09.lesson01.teach.e_qui_vicino:
    title: È qui vicino, in Via Roma.
    gloss: To niedaleko, na Via Roma.
    note: Po *qui vicino* (niedaleko, tu w pobliżu) można podać nazwę ulicy, aby dokładniej wskazać miejsce.
  it.a1.unit09.lesson02.teach.ce_una_banca_qui_vicino:
    title: C'è una banca qui vicino?
    gloss: Czy jest tu w pobliżu bank?
    note: '*C''è* (jest) służy do pytania o istnienie czegoś; dalej następuje *qui vicino* (tu w pobliżu).'
  it.a1.unit09.lesson02.teach.si_ce_ne_una:
    title: Sì, ce n'è una qui vicino.
    gloss: Tak, jest jeden w pobliżu.
    note: '*ce n''è una* (jest jedna) to odpowiedź na pytania z *c''è*; odnosi się do rzeczownika żeńskiego *banca*.'
  it.a1.unit09.lesson02.teach.accanto_alla_stazione:
    title: Accanto alla stazione.
    gloss: Obok dworca.
    note: '*accanto a* (obok) z rodzajnikiem dokładnie określa położenie względem znanego punktu.'
  it.a1.unit09.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: Wielkie dzięki.
