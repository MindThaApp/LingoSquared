teaching:
  it.a1.unit13.lesson01.teach.ieri_stamattina:
    title: ieri, stamattina
    gloss: wczoraj, dziś rano
    note: '*ieri* („wczoraj”) i *stamattina* („dziś rano”) to dwa określenia czasu używane, gdy mówimy o niedawnych wydarzeniach.'
    example_gloss:
    - Wczoraj byłem w domu.
  it.a1.unit13.lesson01.teach.sono_andato:
    title: sono andato, sono andata
    gloss: poszedłem, poszłam
    note: '*sono andato/andata* to passato prossimo czasownika *andare* z czasownikiem posiłkowym *essere*; imiesłów zgadza się z rodzajem podmiotu.'
    example_gloss:
    - Dziś rano poszedłem do pracy.
  it.a1.unit13.lesson01.teach.sono_andato_al_cinema_ieri:
    title: Sono andato al cinema ieri.
    gloss: Wczoraj poszedłem do kina.
    note: '*Sono andato* (mówi mężczyzna) + *al cinema* („do kina”) + *ieri* („wczoraj”) opisuje zakończone wydarzenie z przeszłości.'
  it.a1.unit13.lesson01.teach.ho_visto_un_bel_film:
    title: Ho visto un bel film!
    gloss: Widziałem świetny film!
    note: '*Ho visto* tworzy się z czasownikiem posiłkowym *avere* i nieregularnym imiesłowem *visto* (od *vedere*, „widzieć”).'
  it.a1.unit13.lesson02.teach.ho_mangiato_un_panino:
    title: Ho mangiato un panino a pranzo.
    gloss: Zjadłem kanapkę na obiad.
    note: '*Ho mangiato* tworzy się z *avere* i regularnym imiesłowem *mangiato* (od *mangiare*, „jeść”); *a pranzo* znaczy „na obiad”.'
  it.a1.unit13.lesson02.teach.cosa_hai_fatto_ieri:
    title: Cosa hai fatto ieri?
    gloss: Co Pan/Pani robił(a) wczoraj?
    note: '*hai fatto* to passato prossimo czasownika *fare* („robić”), użyte tu do zapytania o niedawne wydarzenie.'
    example_gloss:
    - Co robiłeś dziś rano?
  it.a1.unit13.lesson02.teach.ieri_sera:
    title: ieri sera
    gloss: wczoraj wieczorem
    note: '*ieri sera* łączy *ieri* („wczoraj”) z *sera* („wieczór”) i wskazuje konkretny moment w przeszłości.'
    example_gloss:
    - Wczoraj wieczorem poszedłem do kina.
  it.a1.unit13.lesson03.teach.sono_andata_al_lavoro:
    title: Stamattina sono andata al lavoro, come sempre.
    gloss: Dziś rano poszłam do pracy, jak zawsze.
    note: '*sono andata* (mówi kobieta) + *come sempre* („jak zawsze”) opisuje rutynową czynność z przeszłości.'
  it.a1.unit13.lesson03.teach.e_tu_cosa_hai_fatto:
    title: E tu, cosa hai fatto stamattina?
    gloss: A ty, co robiłeś dziś rano?
    note: '*E tu* („a ty”) odsyła pytanie z powrotem do rozmówcy.'
    example_gloss:
    - A ty, co robiłeś wczoraj wieczorem?
