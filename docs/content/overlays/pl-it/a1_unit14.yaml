teaching:
  it.a1.unit14.lesson01.teach.preferire:
    title: preferire, preferisco
    gloss: woleć, wolę
    note: '*preferire* („woleć”) to czasownik na -ire z wstawką -isc- w większości form czasu teraźniejszego; *preferisco* znaczy „wolę”.'
    example_gloss:
    - Wolę herbatę niż kawę.
  it.a1.unit14.lesson01.teach.preferisci_il_caffe_o_il_te:
    title: Preferisci il caffè o il tè?
    gloss: Wolisz kawę czy herbatę?
    note: '*Preferisci* („wolisz”) razem z *o* („albo”, „czy”) pozwala wybrać jedną z dwóch rzeczy.'
  it.a1.unit14.lesson01.teach.preferisco_il_caffe:
    title: Preferisco il caffè.
    gloss: Wolę kawę.
    note: '*Preferisco* („wolę”) i *il caffè* („kawa”) wyrażają preferencję.'
  it.a1.unit14.lesson02.teach.mi_piace_il_cornetto:
    title: Mi piace molto il cornetto.
    gloss: Bardzo lubię croissanta.
    note: '*Mi piace* (dosłownie „podoba mi się”, czyli „lubię”) razem z *molto* („bardzo”) wyraża silną sympatię.'
  it.a1.unit14.lesson02.teach.non_mi_piace:
    title: Non mi piace il tè la mattina.
    gloss: Nie lubię herbaty rano.
    note: '*Non mi piace* („nie lubię”) to zaprzeczenie konstrukcji z mi piace; *la mattina* znaczy „rano”.'
    example_gloss:
    - Nie lubię kawy wieczorem.
  it.a1.unit14.lesson02.teach.e_a_te:
    title: E a te?
    gloss: A Pan/Pani?
    note: '*E a te?* (dosłownie „a tobie?”) pyta rozmówcę o jego własną preferencję.'
  it.a1.unit14.lesson03.teach.anch_io_preferisco_il_caffe:
    title: Anch'io preferisco il caffè!
    gloss: Ja też wolę kawę!
    note: '*Anch''io* („ja też”) zgadza się z preferencją, którą ktoś właśnie wyraził słowem *preferisco*. (Aby zgodzić się z wypowiedzią z *mi piace*, po włosku mówi się *Anche a me*.)'
  it.a1.unit14.lesson03.teach.a_me_no:
    title: A me no, preferisco il tè.
    gloss: Ja nie, wolę herbatę.
    note: '*A me no* („ja nie”) wyraża sprzeciw wobec wypowiedzi z *mi piace* (powtarza *a me* z konstrukcji z „lubić”), po czym podajesz własną preferencję. Aby się nie zgodzić z wypowiedzią z *preferisco*, po włosku mówi się natomiast *Io no*.'
    example_gloss:
    - Ja nie, wolę kawę.
