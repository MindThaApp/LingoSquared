    title: Tekst o pożarze
    gloss: 'W kawiarni językowej w bibliotece wybuchł pożar. Pracownik mówi: Idźcie do wyjścia ewakuacyjnego! Nina potrzebuje pomocy. Giulia jest z Niną. Marco dzwoni po straż pożarną. Wszyscy są na zewnątrz. Dobrze!'
    note: Podsumowanie sceny pożaru w czasie teraźniejszym, ze słowami pracownika podanymi jako cytat.
    glosses:
      caffè: kawiarnia (caffè linguistico = kawiarnia językowa)
      biblioteca: biblioteka
      incendio: ogień, pożar
      dipendente: pracownik
      dice: mówi
      Andate: idźcie (andate = idźcie, rozkaźnik liczby mnogiej)
      emergenza: awaria, nagły wypadek (uscita di emergenza = wyjście ewakuacyjne)
      aiuto: pomoc
      bisogno: potrzeba (ho bisogno di = potrzebuję)
      chiama: wzywa
      vigili: strażacy (vigili del fuoco = straż pożarna)
      tutti: wszyscy
      fuori: na zewnątrz
      bene: dobrze (va bene = w porządku)
