teaching:
  it.a1.unit04.lesson01.teach.giorni_lun_mer:
    title: lunedì, martedì, mercoledì
    gloss: poniedziałek, wtorek, środa
    note: Pierwsze trzy dni włoskiego tygodnia. Włoski tydzień zaczyna się w poniedziałek, tak jak w Polsce.
    example_gloss:
    - W poniedziałek pracuję w biurze.
  it.a1.unit04.lesson01.teach.giorni_gio_dom:
    title: giovedì, venerdì, sabato, domenica
    gloss: czwartek, piątek, sobota, niedziela
    note: Pozostałe cztery dni tygodnia, które dopełniają całą listę.
    example_gloss:
    - W niedziele nie pracuję.
  it.a1.unit04.lesson01.teach.che_giorno_e_oggi:
    title: Che giorno è oggi?
    gloss: Jaki dziś dzień?
    note: Standardowy sposób zapytania, jaki jest dziś dzień tygodnia.
  it.a1.unit04.lesson01.teach.oggi_e_giovedi:
    title: Oggi è giovedì.
    gloss: Dziś jest czwartek.
    note: '*Oggi* (dziś) + *è* (jest) + nazwa dnia to bezpośrednia odpowiedź na pytanie.'
  it.a1.unit04.lesson01.teach.domani_e_venerdi:
    title: Domani è venerdì.
    gloss: Jutro jest piątek.
    note: '*Domani* (jutro) tworzy zdanie według tego samego wzoru co *oggi*, gdy podajesz nazwę dnia.'
  it.a1.unit04.lesson02.teach.che_data_e_oggi:
    title: Che data è oggi?
    gloss: Jaka jest dziś data?
    note: '*Che data* (jaka data) używa się zamiast *che giorno*, gdy pytasz o datę w kalendarzu, a nie o dzień tygodnia.'
  it.a1.unit04.lesson02.teach.mesi_gen_apr:
    title: gennaio, febbraio, marzo, aprile
    gloss: styczeń, luty, marzec, kwiecień
    note: Pierwsze cztery miesiące roku po włosku; nazwy miesięcy pisze się małą literą, tak jak po polsku.
    example_gloss:
    - Dziś jest piąty stycznia.
  it.a1.unit04.lesson02.teach.oggi_e_cinque_gennaio:
    title: Oggi è il cinque gennaio.
    gloss: Dziś jest piąty stycznia.
    note: Włoska data składa się z *il* + liczby oznaczającej dzień + nazwy miesiąca. Dzień podaje się zwykłą liczbą, np. *cinque*, a nie liczebnikiem porządkowym (po polsku mówimy „piątego”). Wyjątkiem jest pierwszy dzień miesiąca, który ma liczebnik porządkowy *primo* (*il primo gennaio*).
  it.a1.unit04.lesson02.teach.il_giorno_del_mese:
    title: il quindici marzo
    gloss: piętnastego marca
    note: Kolejny przykład wzoru dzień + miesiąc; działa tak samo przy każdej dacie.
  it.a1.unit04.lesson03.teach.quando_arrivi:
    title: Quando arrivi a Roma?
    gloss: Kiedy przyjeżdżasz do Rzymu?
    note: '*Quando* (kiedy) + *arrivi* (przyjeżdżasz, nieformalnie) pyta o przyszły przyjazd.'
  it.a1.unit04.lesson03.teach.arrivo_giovedi_pomeriggio:
    title: Arrivo giovedì pomeriggio.
    gloss: Przyjeżdżam w czwartek po południu.
    note: '*Arrivo* (przyjeżdżam) + dzień + pora dnia to pełna odpowiedź na pytanie, kiedy przyjeżdżasz.'
  it.a1.unit04.lesson03.teach.parti_di_domani:
    title: oggi, domani, dopodomani
    gloss: dzisiaj, jutro, pojutrze
    note: '*Dopodomani* to jedno słowo oznaczające „pojutrze” – dosłownie *dopo* (po) + *domani* (jutro).'
    example_gloss:
    - Pojutrze jest sobota.
  it.a1.unit04.lesson03.teach.ci_vediamo_giovedi:
    title: Ci vediamo giovedì!
    gloss: Do zobaczenia w czwartek!
    note: Przyjazny sposób na zakończenie rozmowy, gdy umówiliście się na konkretny dzień.
