course:
  title: Włoski A1
  description: 'Włoski dla początkujących: opisywanie podstawowego wyglądu osoby, czyli wrażenia dotyczącego wzrostu i wieku, koloru włosów i oczu, kluczowe pytanie Com''è? oraz porównywanie wyglądu dwóch osób.'
units:
  it.a1.unit42.aspetto:
    title: Opisywanie wyglądu
lessons:
  it.a1.unit42.lesson01.alto_basso_anziano_e:
    title: Wysoki, niski, stary i młody
  it.a1.unit42.lesson02.descrivere_i_capelli:
    title: Opisywanie włosów
  it.a1.unit42.lesson03.gli_occhi_e_com:
    title: Oczy i jak ktoś wygląda?
  it.a1.unit42.lesson04.giulia_descrive_nina:
    title: Giulia opisuje Ninę
  it.a1.unit42.lesson05.luca_e_chiara_a:
    title: Porównanie Luki i Chiary
  it.a1.unit42.lesson06.marco_riconosce_nina:
    title: Marco rozpoznaje Ninę
teaching:
  it.a1.unit42.lesson01.teach.alto_basso:
    title: Wysoki i niski
    gloss: wysoki / niski
    note: '*Alto* opisuje osobę wysoką, a *basso* niską. Włoskie przymiotniki zgadzają się z osobą, podobnie jak w polskim: *alto/alta*, *basso/bassa*.'
    example_gloss:
    - Chiara jest wysoka.
    - Luca jest niski.
  it.a1.unit42.lesson01.teach.anziano_giovane:
    title: Stary i młody
    gloss: stary / młody
    note: '*Anziano* (starszy) i *giovane* (młody) wyrażają ogólne wrażenie, a nie dokładną liczbę lat. *Giovane* kończy się na -e, więc ma tę samą formę dla mężczyzn i kobiet.'
    example_gloss:
    - Dziadek jest stary.
    - Marco jest młody.
  it.a1.unit42.lesson01.teach.per_l_eta:
    title: 'Wiek: avere anni czy anziano'
    gloss: 'Dokładny wiek we włoskim podaje się za pomocą avere + anni: Quanti anni hai? Ogólne wrażenie wyraża przymiotnik: Il nonno è anziano.'
    note: 'Po polsku mówimy „mam 30 lat”, i po włosku jest podobnie: dosłownie „mam 30 lat” (*ho trent''anni*). Przymiotnik *anziano* służy do tego, jak stara wydaje się dana osoba.'
  it.a1.unit42.lesson01.teach.chiara_e_alta:
    title: Chiara jest wysoka, a Luca niski
    gloss: Chiara jest wysoka, a Luca niski.
    note: 'Dwa przymiotniki połączone spójnikiem *e* (i). Każdy zgadza się ze swoją osobą: *alta* (rodzaj żeński) i *basso* (rodzaj męski).'
  it.a1.unit42.lesson02.teach.i_capelli:
    title: Włosy
    gloss: włosy
    note: '*I capelli* to we włoskim liczba mnoga: Włosi mówią o włosach „le włosy” w liczbie mnogiej, tak jak Polacy. Liczba pojedyncza *il capello* oznacza jeden pojedynczy włos.'
    example_gloss: Marco ma krótkie czarne włosy.
  it.a1.unit42.lesson02.teach.biondi_castani_grigi:
    title: Blond, brązowy i szary
    gloss: blond / brązowy / szary
    note: 'Trzy kolory włosów w liczbie mnogiej rodzaju męskiego, zgodne z *capelli*: *biondi*, *castani*, *grigi*. Do włosów używa się też *neri* (czarne).'
    example_gloss:
    - Giulia ma blond włosy.
    - Luca ma brązowe włosy.
    - Dziadek ma siwe włosy.
  it.a1.unit42.lesson02.teach.lunghi_corti:
    title: Długie i krótkie (włosy)
    gloss: długi / krótki (o włosach)
    note: '*Lunghi* (długie) i *corti* (krótkie) są w liczbie mnogiej, tak jak *capelli*. Słowa *alto* (wysoki) używa się tylko o osobach, nie o włosach.'
    example_gloss:
    - Chiara ma długie włosy.
    - Luca ma krótkie włosy.
  it.a1.unit42.lesson02.teach.i_capelli_sono:
    title: Capelli są w liczbie mnogiej
    gloss: 'Capelli to liczba mnoga, więc przymiotnik też jest w liczbie mnogiej: i capelli biondi, castani, grigi, neri, lunghi, corti.'
    note: 'Przymiotnik stoi po rzeczowniku i zgadza się z nim w rodzaju i liczbie: *capelli lunghi* (liczba mnoga rodzaju męskiego), *occhi azzurri*.'
  it.a1.unit42.lesson02.teach.per_descrivere_una:
    title: Włosy i oczy z czasownikiem avere
    gloss: 'Do opisu osoby włoski używa czasownika avere z włosami i oczami: Giulia ha i capelli biondi e gli occhi azzurri.'
    note: 'We włoskim potrzebny jest też rodzajnik, którego w polskim nie ma: *i capelli*, *gli occhi*. Można też powiedzieć *è bionda*, ale tu uczysz się wzoru z *avere*.'
  it.a1.unit42.lesson02.teach.marco_ha_i:
    title: Marco ma krótkie czarne włosy
    gloss: Marco ma krótkie czarne włosy.
    note: '*Neri* (czarne) to liczba mnoga rodzaju męskiego, zgodna z *capelli*.'
  it.a1.unit42.lesson02.teach.giulia_ha_i:
    title: Giulia ma długie blond włosy
    gloss: Giulia ma długie blond włosy.
    note: Łączy słownictwo tej lekcji o długości i kolorze w jednym naturalnym zdaniu.
  it.a1.unit42.lesson03.teach.gli_occhi:
    title: Oczy
    gloss: oczy
    note: '*Occhio* (oko) jest rodzaju męskiego; liczba mnoga to *occhi* i występuje z *gli*, bo zaczyna się od samogłoski.'
    example_gloss: Marco ma brązowe oczy.
  it.a1.unit42.lesson03.teach.azzurri_marroni_verdi:
    title: Niebieski, brązowy i zielony
    gloss: niebieski / brązowy / zielony
    note: 'Kolory oczu: *azzurri* (niebieskie), *marroni* (brązowe), *verdi* (zielone). Te formy liczby mnogiej pasują do obu rodzajów.'
    example_gloss:
    - Giulia ma niebieskie oczy.
    - Luca ma brązowe oczy.
    - Chiara ma zielone oczy.
  it.a1.unit42.lesson03.teach.anche_gli_occhi:
    title: Kolory zgadzają się w liczbie mnogiej
    gloss: 'Kolory oczu stoją w liczbie mnogiej, tak jak occhi: occhi azzurri, marroni, verdi.'
    note: 'Przymiotniki, które w liczbie pojedynczej kończą się na -e (*verde*, *marrone*), w liczbie mnogiej kończą się na -i: *verdi*, *marroni*.'
  it.a1.unit42.lesson03.teach.com_e_giulia:
    title: Jak wygląda Giulia?
    gloss: Jak wygląda Giulia?
    note: '*Com''è?* to podstawowe pytanie o wygląd. *Com''è* to *come è* z apostrofem w miejscu pominiętego e.'
  it.a1.unit42.lesson03.teach.giulia_ha_i:
    title: Giulia ma długie blond włosy i niebieskie oczy
    gloss: Giulia ma długie blond włosy i niebieskie oczy.
    note: 'Wzorcowa odpowiedź: *avere* + włosy + *e* + oczy w jednym zdaniu.'
  it.a1.unit42.lesson04.teach.giulia_al_caffe:
    title: Giulia opowiada o Ninie
    gloss: 'Giulia: Do kawiarni językowej przychodzi nowa dziewczyna. Ma na imię Nina.'
    note: '*Viene* (przychodzi) wprowadza kogoś nowego. *Si chiama* znaczy „ma na imię”, dosłownie „nazywa się”.'
  it.a1.unit42.lesson04.teach.marco_va_bene:
    title: Marco pyta, jak ona wygląda
    gloss: 'Marco: Dobrze! Jak wygląda?'
    note: 'To samo pytanie jeszcze raz, bez imienia: podmiot jest jasny z kontekstu.'
  it.a1.unit42.lesson04.teach.giulia_e_bassa:
    title: Giulia opisuje wzrost i włosy Niny
    gloss: 'Giulia: Jest niska i ma krótkie blond włosy.'
    note: '*È bassa* (jest niska) ma formę żeńską *bassa*; opis włosów następuje z *ha*.'
  it.a1.unit42.lesson04.teach.marco_e_gli:
    title: Marco pyta o jej oczy
    gloss: 'Marco: A oczy?'
    note: W *E gli occhi?* brakuje czasownika. Włosi często pomijają słowa, które wynikają z kontekstu, podobnie jak my w polskim „A oczy?”.
  it.a1.unit42.lesson04.teach.giulia_ha_gli:
    title: Giulia opisuje oczy Niny
    gloss: 'Giulia: Ma zielone oczy.'
    note: '*Ha gli occhi verdi*: zaimek osobowy nie jest potrzebny, bo końcówka czasownika już mówi, że chodzi o „ona”.'
  it.a1.unit42.lesson04.teach.marco_grazie_allora:
    title: Marco ją rozpozna
    gloss: 'Marco: Dzięki! To ją rozpoznam.'
    note: '*La riconosco* (rozpoznaję ją): zaimek dopełnienia *la* stoi przed czasownikiem.'
  it.a1.unit42.lesson05.teach.luca_e_chiara:
    title: Porównanie Luki i Chiary
    gloss: Luca i Chiara są rodzeństwem, ale wyglądają zupełnie inaczej. Luca jest niski, ma krótkie brązowe włosy i brązowe oczy. Chiara jest wyższa od Luki, ma długie brązowe włosy i zielone oczy. A ty, jak wyglądasz?
    note: Krótkie porównanie, w którym wracają wszystkie poznane dotąd słowa określające kolor i długość. Tekst kończy się pytaniem kluczowym dla tej lekcji, skierowanym do czytelnika.
    glosses:
      fratello: brat
      sorella: siostra
      sembrano: wyglądają / wydają się
      diversi: różnie
      basso: niski
      corti: niski
      castani: brązowy
      capelli: włosy
      marroni: brązowy
      occhi: oczy
      alta: wysoka (più alta = wyższa)
      lunghi: długi
      verdi: zielony
      come: jak (Tu come sei? = Jak wyglądasz?)
  it.a1.unit42.lesson05.teach.il_comparativo_si:
    title: 'Porównywanie: più ... di'
    gloss: 'Włoski porównuje za pomocą più + przymiotnik + di: Chiara è più alta di Luca.'
    note: 'Postaw *più* przed przymiotnikiem, a *di* przed osobą, z którą porównujesz. Przymiotnik zachowuje rodzaj: *più alta*, *più alto*.'
  it.a1.unit42.lesson05.teach.chiara_ha_i:
    title: Chiara ma dłuższe włosy niż Luca
    gloss: Chiara ma dłuższe włosy niż Luca.
    note: '*I capelli più lunghi di Luca*: przymiotnik pozostaje w liczbie mnogiej, bo zgadza się z *capelli*.'
  it.a1.unit42.lesson05.teach.ho_i_capelli:
    title: Mam krótkie brązowe włosy
    gloss: Mam krótkie brązowe włosy.
    note: '*Ho i capelli corti e castani*: do opisu własnego wyglądu używamy czasownika *avere*.'
  it.a1.unit42.lesson06.teach.marco_guarda_e:
    title: Marco dostrzega Ninę
    gloss: 'Marco: Patrz, czy to Nina? Ma krótkie blond włosy i zielone oczy.'
    note: '*Guarda* (patrz) to forma rozkazująca dla *tu*. *Quella* znaczy „tamta” i dotyczy kobiety lub dziewczyny.'
  it.a1.unit42.lesson06.teach.giulia_si_e:
    title: Giulia potwierdza
    gloss: 'Giulia: Tak, to Nina!'
    note: Krótkie, naturalne potwierdzenie.
  it.a1.unit42.lesson06.teach.nina_ciao_sei:
    title: Nina wita Marca
    gloss: 'Nina: Cześć, jesteś Marco?'
    note: '*Sei Marco?* to pytanie nieformalne: *sei* to forma *tu* czasownika *essere*, więc zaimek *tu* nie jest potrzebny.'
  it.a1.unit42.lesson06.teach.marco_si_piacere:
    title: Marco wita Ninę
    gloss: 'Marco: Tak! Miło cię poznać, Nina.'
    note: '*Piacere di conoscerti* to zwrot używany przy pierwszym spotkaniu; *-ti* znaczy „ciebie”.'
  it.a1.unit42.lesson06.teach.nina_piacere_mio:
    title: Nina odpowiada na powitanie
    gloss: 'Nina: Mnie również miło!'
    note: Zamyka dialog – Marco rozpoznał Ninę dzięki wcześniejszemu opisowi Giulii.
