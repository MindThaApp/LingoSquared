course:
  title: Włoski A1
  description: 'Naucz się włoskiego na poziomie A1: codziennych powitań i krótkich rozmów towarzyskich, ze szczegółowymi wyjaśnieniami po polsku.'
units:
  it.a1.unit02.origin_nationality_language:
    title: Skąd jesteś, narodowość i język
lessons:
  it.a1.unit02.lesson01.di_dove_sei:
    title: Skąd jesteś? Pytanie o pochodzenie i odpowiadanie
  it.a1.unit02.lesson02.parlare_italiano:
    title: 'Mówię po włosku: poziom i języki'
  it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto:
    title: Praca i witaj w Mediolanie
teaching:
  it.a1.unit02.lesson01.teach.di_dove:
    title: di dove
    gloss: skąd
    note: '*di dove* to podstawowy element pytania o pochodzenie lub podania go – łączy się z *sei* (nieformalnie) albo *è* (formalnie).'
    example_gloss:
    - Sam, skąd jesteś?
    - Elena, skąd Pani jest?
  it.a1.unit02.lesson01.teach.di_dove_sei:
    title: Di dove sei?
    gloss: Skąd Pan/Pani jest?
    note: Pytanie nieformalne, używane wobec rówieśnika lub przyjaciela; odpowiada formie *tu* z jednostki 1.
  it.a1.unit02.lesson01.teach.di_dov_e_lei:
    title: Di dov'è, Lei?
    gloss: Skąd Pan/Pani pochodzi? (oficjalnie)
    note: Pytanie formalne; odpowiada formie *Lei* z jednostki 1.
  it.a1.unit02.lesson01.teach.sono_americano_chicago:
    title: Sono americano, di Chicago.
    gloss: Jestem Amerykaninem, z Chicago.
    note: Podaje jednocześnie narodowość i miasto pochodzenia.
  it.a1.unit02.lesson01.teach.sono_italiana_milano:
    title: Sono italiana, di Milano.
    gloss: Jestem Włoszką, z Mediolanu.
    note: '*italiana* to żeńska forma narodowości, użyta, ponieważ Elena jest kobietą.'
  it.a1.unit02.lesson01.teach.nationalities:
    title: americano/americana, italiano/italiana
    gloss: Amerykanin/Amerykanka, Włoch/Włoszka
    note: 'Włoskie nazwy narodowości zmieniają końcówkę zależnie od płci osoby: *-o* dla mężczyzny, *-a* dla kobiety (*Sam è americano*, *Elena è italiana*). Po polsku jest podobnie: Amerykanin – Amerykanka, Włoch – Włoszka.'
    example_gloss:
    - Sam jest Amerykaninem.
    - Elena jest Włoszką.
  it.a1.unit02.lesson02.teach.parli_italiano:
    title: Parli italiano?
    gloss: Czy mówisz po włosku?
    note: Pytanie nieformalne, w formie *tu* czasownika *parlare* (mówić).
  it.a1.unit02.lesson02.teach.parla_italiano:
    title: Parla italiano?
    gloss: Czy Pan/Pani mówi po włosku? (formalnie)
    note: Pytanie formalne, w formie *Lei* czasownika *parlare*.
  it.a1.unit02.lesson02.teach.parlo_un_po:
    title: Parlo un po' d'italiano
    gloss: Mówię trochę po włosku
    note: Skromny, częsty sposób opisania własnego poziomu – *un po'* znaczy „trochę”.
    example_gloss: Mówię trochę po włosku, uczę się od roku.
  it.a1.unit02.lesson02.teach.parlo_inglese:
    title: Parlo inglese.
    gloss: Mówię po angielsku.
    note: Ta sama konstrukcja z *parlo* (mówię), tym razem z innym językiem.
  it.a1.unit02.lesson02.teach.studio_da_un_anno:
    title: Studio italiano da un anno.
    gloss: Uczę się włoskiego od roku.
    note: '*da un anno* znaczy „od roku” i opisuje czynność, która zaczęła się w przeszłości i trwa nadal.'
  it.a1.unit02.lesson02.teach.da_quanto_studi:
    title: Da quanto studi?
    gloss: Jak długo się uczysz?
    note: '*Da quanto* („od jak dawna”) + czas teraźniejszy *studi* (uczysz się, nieformalnie) pyta, jak długo trwa czynność. Odpowiedz tym samym wzorem: *Studio da un anno.*'
  it.a1.unit02.lesson02.teach.parla_bene:
    title: Parli italiano bene!
    gloss: Dobrze mówisz po włosku!
    note: Życzliwy komplement dotyczący czyjegoś poziomu języka, w formie nieformalnej *tu*.
  it.a1.unit02.lesson03.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: Czym się Pan/Pani zajmuje zawodowo?
    note: Pytanie nieformalne, w formie *tu* czasownika *fare* (robić).
  it.a1.unit02.lesson03.teach.che_lavoro_fa:
    title: Che lavoro fa, Lei?
    gloss: Czym się Pan/Pani zajmuje zawodowo? (formalnie)
    note: Pytanie formalne, w formie *Lei* czasownika *fare*.
  it.a1.unit02.lesson03.teach.sono_ingegnere:
    title: Sono ingegnere
    gloss: Jestem inżynierem
    note: 'Nazwy zawodów po włosku zwykle występują bez rodzajnika: *sono ingegnere*, a nie *sono un ingegnere*. Polszczyzna nie ma rodzajników, więc nie ma tu czego dodawać.'
    example_gloss: Jestem inżynierem, pracuję w Mediolanie.
  it.a1.unit02.lesson03.teach.sono_qui_per_lavoro:
    title: Sono qui per lavoro.
    gloss: Jestem tu służbowo.
    note: '*per lavoro* wyjaśnia powód pobytu – praca, a nie turystyka.'
  it.a1.unit02.lesson03.teach.per_due_anni:
    title: Sono qui per due anni.
    gloss: Jestem tu na dwa lata.
    note: Ta sama konstrukcja co *per lavoro*, tym razem podaje czas trwania, a nie powód.
  it.a1.unit02.lesson03.teach.che_bello_benvenuto:
    title: Che bello, benvenuto a Milano!
    gloss: Jak miło, witaj w Mediolanie!
    note: '*Che bello* to częsta, entuzjastyczna reakcja: „jak miło”, „jak wspaniale”.'
  it.a1.unit02.lesson03.teach.grazie_mille_reprise:
    title: Grazie mille!
    gloss: Dziękuję bardzo!
    note: To samo wylewne podziękowanie z jednostki 1, tu w odpowiedzi na serdeczne powitanie.
