    title: Marco się zgadza
    gloss: 'Marco: Dobry pomysł! Sprawdzę prognozę pogody.'
    note: '*Buona idea!* ma formę żeńską *buona*, bo *idea* jest rodzaju żeńskiego. *Cerco* to forma *io* od *cercare*.'
