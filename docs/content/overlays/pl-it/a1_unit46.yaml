    gloss: 'Cercare i usare to regularne czasowniki na -are: io cerco, tu cerchi; io uso, tu usi. Cercare dodaje h przed i.'
    note: 'Litera h w *cerchi* zachowuje twardą wymowę c: porównaj *cerco* (io) i *cerchi* (tu).'
