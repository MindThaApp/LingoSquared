    title: A + dzień
    gloss: 'Już znasz Arrivederci! Możesz też podać dzień: A sabato!, A domani!'
    note: Rozszerza wzór pożegnania z tematu o powitaniach na konkretny dzień.
  it.a1.unit46.lesson05.teach.giulia_chiama_marco:
    title: Kto czego używa?
    gloss: Giulia dzwoni do Marca codziennie. Używa telefonu, nie aplikacji. Marco nie ma w domu komputera, ale korzysta z internetu w telefonie. Luca co rano sprawdza prognozę pogody. Potem idzie pobiegać. Chiara często wysyła Giulii wiadomość. A ty używasz telefonu codziennie?
    note: Porównanie tego, jak wszystkie cztery postacie korzystają z urządzeń, na wzór tekstu porównawczego z tematu o sporcie.
