      app: aplikacja
      computer: komputer
      casa: dom (a casa = w domu)
      internet: internet
      cerca: sprawdza
      mattina: ranek
      previsioni: prognoza (previsioni del tempo = prognoza pogody)
      va: idzie
      correre: biegać
