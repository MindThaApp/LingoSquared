    gloss: 'Giulia: Widzę wiadomość. Poćwiczymy w sobotę o dziesiątej w parku?'
  it.a1.unit46.lesson06.teach.marco_si_e:
    title: Marco potwierdza pogodę
    gloss: 'Marco: Tak, i w sobotę jest słonecznie!'
  it.a1.unit46.lesson06.teach.luca_io_corro:
    title: Plan Luki
    gloss: 'Luca: Ja biegam. Potem gram też w piłkę nożną.'
    note: '*Poi* (potem) porządkuje czynności w czasie. *Gioco a calcio*: *giocare a* + nazwa sportu.'
  it.a1.unit46.lesson06.teach.chiara_io_preferisco:
    title: Plan Chiary
    gloss: 'Chiara: Ja wolę pływać, ale też przyjdę do parku.'
    note: '*Preferisco nuotare* (wolę pływać) to bezpośredni sposób wyrażenia preferencji. *Anch''io* (ja też) to jedno słowo z apostrofem.'
  it.a1.unit46.lesson06.teach.giulia_bello_a:
    title: Giulia kończy rozmowę
    gloss: 'Giulia: Świetnie! Do soboty w parku!'
    note: W jednym zdaniu zamyka wątek wiadomości z tej lekcji i plan z tematu o sporcie.
