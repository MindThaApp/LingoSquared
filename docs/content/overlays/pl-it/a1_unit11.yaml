    example_gloss:
    - Wieczorem wracam do domu.
  it.a1.unit11.lesson01.teach.a_che_ora_fai_colazione:
    title: A che ora fai colazione di solito?
    gloss: O której zwykle jesz śniadanie?
    note: '*A che ora* (o której godzinie) razem z *di solito* (zwykle) służy do pytania o stały rozkład dnia.'
  it.a1.unit11.lesson01.teach.faccio_colazione_alle_sette:
    title: Faccio colazione alle sette e poi vado al lavoro.
    gloss: Jem śniadanie o siódmej, a potem idę do pracy.
    note: '*alle sette* (o siódmej) tworzy się przez *alle* + godzina, aby podać porę na zegarze.'
  it.a1.unit11.lesson02.teach.a_che_ora_torni_a_casa:
    title: A che ora torni a casa la sera?
    gloss: O której wracasz do domu wieczorem?
    note: '*torni* to forma czasownika *tornare* (wracać) dla *tu*, użyta w pytaniu o wieczorny rozkład dnia.'
  it.a1.unit11.lesson02.teach.torno_alle_sei_e_trenta:
    title: Torno a casa alle sei e trenta, di solito.
    gloss: Zwykle wracam do domu o szóstej trzydzieści.
    note: W *alle sei e trenta* (o szóstej trzydzieści) minuty po godzinie dodaje się przez *e*.
  it.a1.unit11.lesson02.teach.vado_a_letto_presto:
    title: Vado a letto presto.
    gloss: Idę spać wcześnie.
    note: '*presto* (wcześnie) określa bliżej *vado a letto* (idę spać).'
