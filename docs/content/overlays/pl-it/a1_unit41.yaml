teaching:
  it.a1.unit41.lesson01.teach.leggere_fare_sport:
    title: Czytanie, sport, gotowanie
    gloss: czytać, uprawiać sport, gotować
    note: 'Trzy popularne czasowniki związane z hobby w bezokoliczniku: *leggere* (czytać), *fare sport* (uprawiać sport) i *cucinare* (gotować). Włoskie bezokoliczniki kończą się na -are, -ere lub -ire.'
    example_gloss:
    - Lubię czytać książkę.
    - W soboty uprawiam sport.
    - Lubię gotować dla przyjaciół.
  it.a1.unit41.lesson01.teach.il_tempo_libero:
    title: Czas wolny
    gloss: czas wolny
    note: '*Il tempo libero* to rzeczownik rodzaju męskiego, dlatego występuje z *il*. To kluczowe wyrażenie w rozmowie o hobby.'
    example_gloss: W wolnym czasie lubię czytać.
  it.a1.unit41.lesson01.teach.nel_mio_tempo:
    title: Mówimy, co robisz w wolnym czasie
    gloss: W wolnym czasie lubię czytać.
    note: '*Leggo* to forma *io* czasownika *leggere* (czytać). Po włosku zwykle pomija się zaimek osobowy: mówi się *Leggo*, a nie *Io leggo*. Podobnie jak w polskim: „czytam”, a nie „ja czytam”.'
  it.a1.unit41.lesson02.teach.ascoltare_musica_disegnare:
    title: Muzyka, rysowanie, gry wideo
    gloss: słuchać muzyki, rysować, grać w gry wideo
    note: 'Jeszcze trzy hobby: *ascoltare musica* (słuchać muzyki), *disegnare* (rysować) i *giocare ai videogiochi* (grać w gry wideo).'
    example_gloss:
    - Lubię słuchać muzyki.
    - Często rysuję.
    - Lubię grać w gry wideo z przyjaciółmi.
  it.a1.unit41.lesson02.teach.ascolto_volentieri_musica:
    title: Mówimy, że lubisz słuchać muzyki
    gloss: Lubię słuchać muzyki.
    note: '*Ascoltare* łączy się z dopełnieniem bezpośrednio: *ascolto musica*, bez żadnego przyimka. W polskim używamy dopełniacza: „słucham muzyki”.'
  it.a1.unit41.lesson02.teach.gioco_volentieri_ai:
    title: Mówimy, że lubisz grać z przyjaciółmi
    gloss: Lubię grać w gry wideo z przyjaciółmi.
    note: '*Con gli amici* znaczy „z przyjaciółmi”. *Gli* to rodzajnik liczby mnogiej przed rzeczownikiem rodzaju męskiego zaczynającym się od samogłoski.'
  it.a1.unit41.lesson03.teach.sempre_spesso_a:
    title: Zawsze, często, czasami, nigdy
    gloss: zawsze, często, czasami, nigdy
    note: 'Cztery słowa określające częstotliwość. *Mai* (nigdy) wymaga *non* przed czasownikiem: *non gioco mai*.'
    example_gloss:
    - W soboty zawsze ćwiczę.
    - Często czytam książkę.
    - Czasami rysuję.
    - Nigdy nie gram w gry.
  it.a1.unit41.lesson03.teach.ogni_settimana_ogni:
    title: Co tydzień, w każdy weekend
    gloss: co tydzień, w każdy weekend
    note: '*Ogni* (każdy) się nie zmienia: *ogni settimana*, *ogni fine settimana*. Zobacz następną kartę.'
    example_gloss:
    - Co tydzień gotuję dla przyjaciół.
    - Co weekend ćwiczę.
  it.a1.unit41.lesson03.teach.con_mai_il:
    title: Mai wymaga non; ogni się nie zmienia
    gloss: 'Przy mai czasownik wymaga też non: Non gioco mai. Ogni pozostaje bez zmian przy każdym rzeczowniku: ogni settimana, ogni fine settimana.'
    note: Podobnie jak po polsku („nigdy nie gram”), po włosku mówi się *non gioco mai* (dosłownie „nie gram nigdy”). Podwójne zaprzeczenie jest tu normalne i poprawne. Po *ogni* zawsze występuje rzeczownik w liczbie pojedynczej.
  it.a1.unit41.lesson03.teach.cosa_fai_nel:
    title: Pytamy o czas wolny
    gloss: Co robisz w wolnym czasie?
    note: To główne pytanie tej lekcji — użyj go, by zapytać kogokolwiek o hobby.
  it.a1.unit41.lesson04.teach.giulia_passeggiamo_spesso:
    title: Giulia zaczyna rozmowę o hobby
    gloss: 'Giulia: Często spacerujemy razem. A co jeszcze robisz w wolnym czasie, Marco?'
    note: '*Passeggiamo* to forma *noi* (my) czasownika *passeggiare*. *Spesso* stoi po czasowniku.'
  it.a1.unit41.lesson04.teach.marco_cucino_volentieri:
    title: Hobby Marca
    gloss: 'Marco: Chętnie gotuję, także w domu. I często uprawiam sport.'
    note: '*Anche a casa* (także w domu) pokazuje, że Marco gotuje dla przyjemności, a nie tylko w pracy. *A casa* znaczy „w domu” i występuje bez rodzajnika.'
  it.a1.unit41.lesson04.teach.giulia_cucini_anche:
    title: Giulia jest zaskoczona
    gloss: 'Giulia: Gotujesz też w domu? Przecież już cały dzień gotujesz w pracy!'
    note: '*Già* (już) i *tutto il giorno* (cały dzień) pokazują, jak dużo Marco gotuje już w pracy.'
  it.a1.unit41.lesson04.teach.marco_si_ma:
    title: Marco wyjaśnia
    gloss: 'Marco: Tak, ale gotowanie mnie relaksuje. A ty, co lubisz robić?'
    note: '*Cucinare mi rilassa* dosłownie znaczy „gotowanie mnie relaksuje”: podmiotem jest czynność, a *mi* (mnie) jest dopełnieniem.'
  it.a1.unit41.lesson04.teach.giulia_leggo_volentieri:
    title: Hobby Giulii
    gloss: 'Giulia: Chętnie czytam i często słucham muzyki.'
    note: 'Dwa hobby połączone spójnikiem *e* (i). Oba czasowniki pozostają w formie *io*: *leggo* i *ascolto*.'
  it.a1.unit41.lesson04.teach.marco_giochi_anche:
    title: Marco pyta o gry
    gloss: 'Marco: Grasz też w gry wideo?'
    note: 'Pytanie o tak lub nie zachowuje szyk zdania oznajmującego, zmienia się tylko intonacja: *Giochi anche ai videogiochi?* *Anche* znaczy „też”.'
  it.a1.unit41.lesson04.teach.giulia_no_non:
    title: Odpowiedź Giulii
    gloss: 'Giulia: Nie, nigdy nie gram w gry wideo. Ale czasami rysuję!'
    note: '*Non ... mai* (nigdy) i *a volte* (czasami) zestawione w jednej odpowiedzi. *Ma* znaczy „ale”.'
  it.a1.unit41.lesson05.teach.marco_e_io:
    title: Porównujemy hobby
    gloss: Marco i ja często spacerujemy razem. Mamy jednak także inne hobby. Marco chętnie gotuje, również w domu, i często uprawia sport. Ja chętnie czytam i często słucham muzyki. Czasami rysuję, ale nigdy nie gram w gry wideo. A co ty lubisz robić w wolnym czasie?
    note: Wiadomość Giulii podsumowuje wcześniejsze informacje i kończy się pytaniem do czytelnika o główny temat tej lekcji.
    glosses:
      passeggiamo: spacerujemy
      spesso: często
      insieme: razem
      altri: inne
      cucina: gotuje
      volentieri: chętnie
      casa: dom (a casa = w domu)
      sport: sport (fa sport = uprawia sport)
      leggo: czytam
      ascolto: słucham
      musica: muzyka
      disegno: rysuję
      volte: razy (a volte = czasami)
      videogiochi: gry wideo
      mai: nigdy
      libero: wolny
      tempo: czas
  it.a1.unit41.lesson06.teach.marco_cosa_fai:
    title: Marco pyta o weekend
    gloss: 'Marco: Co robisz w ten weekend?'
    note: '*Questo fine settimana* (ten weekend) jest rodzaju męskiego, dlatego mówimy *questo*. *Fai* to forma *tu* czasownika *fare* (robić).'
  it.a1.unit41.lesson06.teach.giulia_non_lo:
    title: Giulia się waha
    gloss: 'Giulia: Jeszcze nie wiem. Chętnie czytam, ale chcę też wyjść.'
    note: '*Non lo so ancora* (jeszcze nie wiem): *lo* zastępuje to, czego się nie wie, i stoi przed czasownikiem. *Uscire* znaczy „wyjść”.'
  it.a1.unit41.lesson06.teach.marco_facciamo_una:
    title: Marco proponuje plan
    gloss: 'Marco: Pójdziemy razem na spacer? Potem ugotuję dla nas.'
    note: '*Poi* (potem) porządkuje plany w czasie. *Cucino io* (z *io* po czasowniku) podkreśla: „to ja ugotuję”.'
  it.a1.unit41.lesson06.teach.giulia_buona_idea:
    title: Giulia się zgadza
    gloss: 'Giulia: Dobry pomysł! Lubię zarówno spacerować, jak i gotować.'
    note: '*Sia ... sia ...* znaczy „zarówno ... jak i ...”: *mi piace sia passeggiare sia cucinare*.'
  it.a1.unit41.lesson06.teach.marco_perfetto_allora:
    title: Marco potwierdza
    gloss: 'Marco: Świetnie. W takim razie do zobaczenia w sobotę!'
    note: '*Ci vediamo sabato* (do zobaczenia w sobotę): przed nazwą dnia nie ma rodzajnika, gdy chodzi o najbliższy taki dzień.'
