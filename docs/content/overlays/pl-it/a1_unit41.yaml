course:
  title: Włoski A1
  description: 'Włoski dla początkujących: opisywanie zajęć w wolnym czasie. Słownictwo związane z hobby, określenia częstotliwości, pytanie o to, co ktoś robi w wolnym czasie, i odpowiadanie na nie oraz porównywanie hobby dwóch osób.'
