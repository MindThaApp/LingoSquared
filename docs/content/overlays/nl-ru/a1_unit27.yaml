course:
  title: Russisch A1
  description: 'Russisch voor beginners over huisdieren en veelvoorkomende dieren: ze benoemen, basiszorg (uitlaten, voeren, spelen), zeggen van welke dieren je houdt ook als je er geen hebt, en het regelmatige Russische meervoud.'
