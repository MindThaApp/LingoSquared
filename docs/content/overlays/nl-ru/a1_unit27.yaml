teaching:
  ru.a1.unit27.lesson01.teach.zhivotnoe_domashnee_zhivotnoe:
    title: Dier, een huisdier
    gloss: het dier / een huisdier
    note: '*Животное* is het algemene woord voor ''dier''. *Домашнее животное* (letterlijk ''huisdier'') betekent specifiek een huisdier.'
    example_gloss:
    - Een hond is een dier.
    - Een hond is ook een huisdier.
  ru.a1.unit27.lesson01.teach.sobaka_koshka:
    title: Hond en kat
    gloss: de hond / de kat
    example_gloss:
    - Nastja heeft een hond.
    - Igor heeft een kat.
  ru.a1.unit27.lesson01.teach.ryba_ptitsa:
    title: Vis en vogel
    gloss: de vis / de vogel
    example_gloss:
    - Opa heeft een vis.
    - Nina heeft een vogel.
  ru.a1.unit27.lesson01.teach.u_tebya_est:
    title: Heb jij een huisdier?
    gloss: Heb jij een huisdier?
    note: '*У тебя есть ...?* is de vraag voor ''heb je ...'': *у тебя* (''bij jou'') + *есть* + het ding.'
  ru.a1.unit27.lesson01.teach.da_u_menya:
    title: Ja, ik heb een hond
    gloss: Ja, ik heb een hond.
    note: Een eenvoudig bevestigend antwoord met de nieuwe woorden uit deze les.
  ru.a1.unit27.lesson01.teach.net_u_menya:
    title: Nee, ik heb geen huisdier
    gloss: Nee, ik heb geen huisdier.
    note: '*Нет* + genitief betekent dat je iets niet hebt: *у меня нет домашнего животного*. Zie de grammaticanotitie.'
  ru.a1.unit27.lesson01.teach.posle_net_slovo:
    title: Нет + genitief
    gloss: 'Na *нет* staat wat ontbreekt in de genitief: *у меня нет времени*, *у меня нет домашнего животного*.'
    note: 'Vergelijk met de bevestigende zin: *у меня есть собака* (nominatief), maar *у меня нет собаки* (genitief).'
  ru.a1.unit27.lesson02.teach.gulyat_s_sobakoy:
    title: Een dier uitlaten
    gloss: uitlaten (een dier)
    note: '*Гулять с собакой* gebruikt *с* + instrumentalis: *собакой*. Zie de grammaticanotitie.'
    example_gloss: Ik laat de hond elke dag uit.
  ru.a1.unit27.lesson02.teach.posle_s_slovo:
    title: С + instrumentalis
    gloss: 'Na *с* (met) staat het zelfstandig naamwoord in de instrumentalis: *гулять с собакой*, *играть с кошкой*.'
    note: 'De instrumentalis van vrouwelijke woorden eindigt op *-ой* of *-ей*: *собакой*, *кошкой*.'
  ru.a1.unit27.lesson02.teach.kormit:
    title: Voeren
    gloss: voeren
    example_gloss: Ik geef de kat elke dag te eten.
  ru.a1.unit27.lesson02.teach.igrat_s:
    title: Spelen met
    gloss: spelen met
    example_gloss: Igor speelt met zijn kat.
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den:
    title: Ik laat de hond elke dag uit
    gloss: Ik laat de hond elke dag uit.
    note: '*Каждый день* (elke dag) is een tijdsaanduiding zonder voorzetsel: *Я каждый день гуляю с собакой*.'
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den_2:
    title: Ik geef de kat elke dag te eten
    gloss: Ik geef de kat elke dag te eten.
    note: '*Кормить* heeft het dier als lijdend voorwerp in de accusatief: *кошка* wordt *кошку*.'
  ru.a1.unit27.lesson03.teach.posle_lyubit_zhivotnoe:
    title: Dieren na любить
    gloss: 'Na *любить* staat een dierennaam in de accusatief; bij levende wezens is die gelijk aan de genitief meervoud: *собак*, *кошек*, *птиц*, *рыб*.'
    note: Het regelmatige Russische meervoudspatroon, hier voor het eerst geïntroduceerd met dierennamen als voorbeeld.
  ru.a1.unit27.lesson03.teach.sobak_koshek:
    title: Honden en katten
    gloss: honden / katten
    example_gloss:
    - Dima houdt van honden.
    - Lena houdt van katten.
  ru.a1.unit27.lesson03.teach.ryb_ptits:
    title: Vissen en vogels (meervoud)
    gloss: vissen / vogels
    example_gloss:
    - Ik hou van vissen.
    - Opa houdt van vogels.
  ru.a1.unit27.lesson03.teach.ya_lyublyu_zhivotnykh:
    title: Ik hou van dieren
    gloss: Ik hou van dieren.
    note: '*Люблю* + accusatief: *Я люблю животных*. Bij levende wezens in het meervoud ziet de accusatief eruit als de genitief.'
  ru.a1.unit27.lesson03.teach.lena_lyubit_koshek:
    title: Lena houdt van katten, maar heeft geen huisdier
    gloss: Lena houdt van katten, maar ze heeft geen huisdier.
    note: Bereidt het contrast voor waar de leestekst van deze les om draait.
  ru.a1.unit27.lesson04.teach.dima_u_tebya:
    title: Dima vraagt naar een huisdier
    gloss: 'Dima: Heb jij een huisdier, Nastja?'
  ru.a1.unit27.lesson04.teach.nastya_da_u:
    title: Nastja heeft een hond
    gloss: 'Nastja: Ja, ik heb een hond.'
  ru.a1.unit27.lesson04.teach.dima_kak_on:
    title: Dima vraagt hoe de hond eruitziet
    gloss: 'Dima: Hoe ziet hij eruit?'
    note: De vraag *Как он выглядит?* werkt ook voor dieren. *Он* (hij) gebruik je voor een mannelijk huisdier.
  ru.a1.unit27.lesson04.teach.nastya_u_nego:
    title: Nastja beschrijft haar hond
    gloss: 'Nastja: Hij heeft een bruine vacht en hij is klein.'
    note: Hier komen de woorden voor haarkleur en grootte uit de les over uiterlijk terug, nu om de vacht van een dier te beschrijven in plaats van het haar van een persoon.
  ru.a1.unit27.lesson04.teach.o_zhivotnom_mozhno:
    title: Он en она bij dieren
    gloss: 'Over een huisdier kun je *он* of *она* zeggen, net als over een mens: *У меня собака, он маленький*.'
    note: Grammaticaal is *собака* vrouwelijk, maar Russen zeggen vaak *он* als ze weten dat het huisdier een mannetje is.
  ru.a1.unit27.lesson04.teach.dima_ty_gulyaesh:
    title: Dima vraagt naar het uitlaten
    gloss: 'Dima: Laat je hem elke dag uit?'
  ru.a1.unit27.lesson04.teach.nastya_da_ya:
    title: Nastja beschrijft haar routine
    gloss: 'Nastja: Ja, ik laat hem elke dag uit en ik geef hem te eten.'
  ru.a1.unit27.lesson05.teach.dima_i_lena:
    title: Dima, Lena en Igor over dieren
    gloss: 'Dima en Lena houden allebei van dieren, maar geen van beiden heeft een huisdier. Dima houdt van honden en Lena houdt van katten. Igor heeft wél een huisdier: een kat. Hij speelt vaak met zijn kat en geeft haar elke dag eten. Heb jij een huisdier?'
    note: 'Zet van dieren houden tegenover er echt een hebben: dat is het communicatieve doel van deze les.'
    glosses:
      любят: houden van
      оба: beide
      животных: dieren
      обоих: beide
      домашнего: huisdier
      собак: honden
      кошек: katten
      кошка: kat
      играет: speelt
      даёт: geeft
      каждый: elke
      корм: voer
  ru.a1.unit27.lesson05.teach.igor_chasto_igraet:
    title: Igor speelt vaak met zijn kat
    gloss: Igor speelt vaak met zijn kat.
    note: '*Со своей кошкой*: *со* is *с* voor een groep medeklinkers, en *своей* betekent ''zijn eigen'' en verwijst naar het onderwerp.'
  ru.a1.unit27.lesson05.teach.ya_lyublyu_sobak:
    title: Ik hou van honden. Ik heb geen huisdier.
    gloss: Ik hou van honden. Ik heb geen huisdier.
    note: Een voorbeeldantwoord van twee zinnen, dat je kunt hergebruiken voor de schrijfopdracht van deze les.
  ru.a1.unit27.lesson06.teach.nastya_nina_u:
    title: Nastja vraagt het aan Nina
    gloss: 'Nastja: Nina, heb jij ook een huisdier?'
  ru.a1.unit27.lesson06.teach.nina_da_u:
    title: Nina heeft een vogel die Pico heet
    gloss: 'Nina: Ja, ik heb een vogel. Hij heet Pico.'
    note: '*Его зовут Пико* betekent letterlijk ''ze noemen hem Piko''. Zo geef je in het Russisch een naam.'
  ru.a1.unit27.lesson06.teach.dima_kak_zdorovo:
    title: Dima reageert
    gloss: 'Dima: Wat leuk! Wat doe je elke dag met hem?'
  ru.a1.unit27.lesson06.teach.nina_ya_kazhdyy:
    title: Nina geeft hem elke dag te eten
    gloss: 'Nina: Ik geef hem elke dag te eten.'
  ru.a1.unit27.lesson06.teach.dima_ya_tozhe:
    title: Dima houdt ook van vogels
    gloss: 'Dima: Ik hou ook van vogels.'
  ru.a1.unit27.lesson06.teach.nastya_kak_khorosho:
    title: Nastja sluit het gesprek af
    gloss: 'Nastja: Fijn dat we alle drie van dieren houden!'
    note: Rondt het gesprek af met wat alle drie de personages in deze les over dieren hebben verteld.
