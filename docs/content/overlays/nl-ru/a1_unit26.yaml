teaching:
  ru.a1.unit26.lesson01.teach.vysokiy_nevysokiy:
    title: Lang en klein
    gloss: lang / klein
    note: '*Высокий* beschrijft een lange persoon en *невысокий* een kleine (letterlijk ''niet lang''). De uitgang verandert met het geslacht: *высокая*, *невысокая*.'
    example_gloss:
    - Lena is lang.
    - Igor is klein.
  ru.a1.unit26.lesson01.teach.staryy_molodoy:
    title: Oud en jong
    gloss: oud / jong
    note: '*Старый* en *молодой* beschrijven hier een algemene indruk van leeftijd, niet een exact aantal jaren.'
    example_gloss:
    - Opa is oud.
    - Dima is jong.
  ru.a1.unit26.lesson01.teach.prilagatelnoe_menyaetsya_po:
    title: Bijvoeglijke naamwoorden veranderen mee met het geslacht
    gloss: 'Een bijvoeglijk naamwoord past zich aan de persoon aan: *он высокий, она высокая*; *он старый, она старая*.'
    note: Mannelijke bijvoeglijke naamwoorden eindigen op *-ый*, *-ий* of *-ой* (*высокий*, *молодой*); vrouwelijke op *-ая* (*высокая*, *молодая*).
  ru.a1.unit26.lesson01.teach.lena_vysokaya_a:
    title: Lena is lang en Igor is klein
    gloss: Lena is lang en Igor is klein.
    note: 'Twee beweringen worden naast elkaar gezet met *а* (terwijl, en): *Лена высокая, а Игорь невысокий*.'
  ru.a1.unit26.lesson02.teach.volosy:
    title: Haar
    gloss: het haar
    note: '*Волосы* (haar) staat in het Russisch altijd in het meervoud: *У Насти светлые волосы*, nooit als enkelvoudig zelfstandig naamwoord.'
    example_gloss: Dima heeft kort zwart haar.
  ru.a1.unit26.lesson02.teach.svetlye_kashtanovye_sedye:
    title: Blond, bruin en grijs
    gloss: blond / bruin / grijs
    note: 'Drie haarkleuren in het meervoud, passend bij *волосы*: *светлые*, *каштановые*, *седые*.'
    example_gloss:
    - Nastja heeft blond haar.
    - Igor heeft bruin haar.
    - Opa heeft grijs haar.
  ru.a1.unit26.lesson02.teach.dlinnye_korotkie:
    title: Lang en kort (haar)
    gloss: lang / kort (haar)
    note: '*Длинные* (lang) en *короткие* (kort) passen zich ook aan het meervoud *волосы* aan.'
    example_gloss:
    - Lena heeft lang haar.
    - Igor heeft kort haar.
  ru.a1.unit26.lesson02.teach.volosy_stoyat_vo:
    title: Bijvoeglijke naamwoorden passen zich aan волосы aan
    gloss: '*Волосы* is meervoud, dus het bijvoeglijk naamwoord ook: *длинные волосы*, *короткие волосы*, *светлые волосы*, *чёрные волосы*.'
    note: Meervoudige bijvoeglijke naamwoorden eindigen op *-ые* of *-ие*. Dezelfde uitgang zie je in de volgende les bij *глаза*.
  ru.a1.unit26.lesson02.teach.posle_u_imya:
    title: У plus genitief
    gloss: 'Na *у* staat de bezitter in de genitief: *у Насти* (Nastja heeft), *у Димы* (Dima heeft), *у неё* (zij heeft).'
    note: 'Zo zegt het Russisch ''hebben'': *у* + genitief + het bezit. Er is geen werkwoord ''hebben''.'
  ru.a1.unit26.lesson02.teach.u_dimy_korotkie:
    title: Dima heeft kort zwart haar
    gloss: Dima heeft kort zwart haar.
    note: '*Чёрные* (zwart) past zich aan het meervoud *волосы* aan. De letter *ё* schrijven we in deze cursus altijd.'
  ru.a1.unit26.lesson02.teach.u_nasti_dlinnye:
    title: Nastja heeft lang blond haar
    gloss: Nastja heeft lang blond haar.
    note: Combineert de woorden voor lengte en kleur uit deze les in één natuurlijke zin.
  ru.a1.unit26.lesson03.teach.glaza:
    title: Ogen
    gloss: de ogen
    note: '*Глаза* (ogen) is het meervoud van *глаз*; de meervoudsuitgang is *-а*.'
    example_gloss: Dima heeft bruine ogen.
  ru.a1.unit26.lesson03.teach.golubye_karie_zelyonye:
    title: Blauw, bruin en groen
    gloss: blauw / bruin / groen
    note: '*Голубые* is lichtblauw, *карие* is bruin (alleen voor ogen) en *зелёные* is groen. Alle drie staan in het meervoud.'
    example_gloss:
    - Nastja heeft blauwe ogen.
    - Igor heeft bruine ogen.
    - Lena heeft groene ogen.
  ru.a1.unit26.lesson03.teach.glaza_stoyat_vo:
    title: Bijvoeglijke naamwoorden passen zich aan глаза aan
    gloss: '*Глаза* is meervoud, dus het bijvoeglijk naamwoord ook: *голубые глаза*, *карие глаза*, *зелёные глаза*.'
    note: 'Bruine ogen zijn *карие*, niet *коричневые*, en bruin haar is *каштановые*: het Russisch gebruikt andere woorden voor ogen en haar.'
  ru.a1.unit26.lesson03.teach.kak_vyglyadit_nastya:
    title: Hoe ziet Nastja eruit?
    gloss: Hoe ziet Nastja eruit?
    note: '*Как выглядит ...?* is de kernvraag van dit hoofdstuk. Het werkwoord *выглядит* staat in het enkelvoud bij een enkelvoudig onderwerp.'
  ru.a1.unit26.lesson03.teach.u_nasti_dlinnye:
    title: Nastja heeft lang blond haar en blauwe ogen
    gloss: Nastja heeft lang blond haar en blauwe ogen.
    note: 'Een voorbeeldantwoord verbindt haar en ogen met *и*: *У Насти длинные светлые волосы и голубые глаза*.'
  ru.a1.unit26.lesson04.teach.nastya_v_yazykovoe:
    title: Nastja stelt Nina voor
    gloss: 'Nastja: Er komt een nieuw meisje naar het taalcafé. Ze heet Nina.'
    note: '*Придёт* (zal komen) is de voltooide toekomende tijd. *Её зовут Нина* betekent letterlijk ''ze noemen haar Nina''.'
  ru.a1.unit26.lesson04.teach.dima_khorosho_kak:
    title: Dima vraagt hoe ze eruitziet
    gloss: 'Dima: Goed! Hoe ziet ze eruit?'
    note: Weer de kernvraag, nu met *она* (zij) in plaats van een naam.
  ru.a1.unit26.lesson04.teach.nastya_ona_nevysokaya:
    title: Nastja beschrijft de lengte en het haar van Nina
    gloss: 'Nastja: Ze is klein en heeft kort blond haar.'
    note: Combineert *невысокая* uit les 1 met de haarwoorden uit les 2. *И у неё* voegt het tweede feit toe.
  ru.a1.unit26.lesson04.teach.dima_a_kakie:
    title: Dima vraagt naar haar ogen
    gloss: 'Dima: En haar ogen?'
    note: '*Какие у неё глаза?* gebruikt *у неё* (''zij heeft''). *Неё* is de vorm van *она* na het voorzetsel *у*.'
  ru.a1.unit26.lesson04.teach.nastya_u_neyo:
    title: Nastja beschrijft de ogen van Nina
    gloss: 'Nastja: Ze heeft groene ogen.'
    note: Hergebruikt *зелёные глаза* uit les 3, met *у неё* voor 'zij heeft'.
  ru.a1.unit26.lesson04.teach.dima_spasibo_togda:
    title: Dima zal haar herkennen
    gloss: 'Dima: Bedankt! Dan herken ik haar.'
    note: '*Я её узнаю* (ik zal haar herkennen): *её* is de accusatief van *она*, omdat Nina het lijdend voorwerp is.'
  ru.a1.unit26.lesson05.teach.igor_i_lena:
    title: Igor en Lena vergeleken
    gloss: Igor en Lena zijn broer en zus, maar ze zien er verschillend uit. Igor is klein en heeft kort bruin haar en bruine ogen. Lena is langer dan Igor en heeft lang bruin haar en groene ogen. Hoe zie jij eruit?
    note: Een korte vergelijking met alle kleur- en lengtewoorden die tot nu toe zijn geleerd, met als slot de kernvraag van de unit aan de lezer.
    glosses:
      брат: broer
      сестра: zus
      выглядят: eruitzien
      по-разному: verschillend
      невысокий: kort
      короткие: kort
      каштановые: bruin
      волосы: haar
      карие: bruin
      глаза: ogen
      выше: groter
      длинные: lang
      зелёные: groen
      выглядишь: jij ziet eruit (zoals in как ты выглядишь?)
  ru.a1.unit26.lesson05.teach.posle_vyshe_stoit:
    title: Vergelijken met выше
    gloss: 'Na *выше* (langer) staat de persoon met wie je vergelijkt in de genitief: *Лена выше Игоря*.'
    note: De vergrotende trap *выше* verandert niet met het geslacht. De persoon met wie je vergelijkt staat in de genitief, of komt na *чем*.
  ru.a1.unit26.lesson05.teach.u_leny_volosy:
    title: Lena heeft langer haar dan Igor
    gloss: Lena heeft langer haar dan Igor.
    note: '*У Лены волосы длиннее, чем у Игоря*: *длиннее* verandert nooit, en *чем* (dan) opent het tweede deel.'
  ru.a1.unit26.lesson05.teach.u_menya_korotkie:
    title: Ik heb kort bruin haar
    gloss: Ik heb kort bruin haar.
    note: 'Een voorbeeldzin over je eigen uiterlijk: *У меня* (''ik heb'') + bijvoeglijk naamwoord + zelfstandig naamwoord.'
  ru.a1.unit26.lesson06.teach.dima_smotri_eto:
    title: Dima ziet Nina
    gloss: 'Dima: Kijk, is dat Nina? Ze heeft kort blond haar en groene ogen.'
    note: '*Смотри* (kijk) is de informele gebiedende wijs, die in eerdere dialogen op dezelfde manier wordt gebruikt.'
  ru.a1.unit26.lesson06.teach.nastya_da_eto:
    title: Nastja bevestigt het
    gloss: 'Nastja: Ja, dat is Nina!'
    note: Een korte, natuurlijke bevestiging.
  ru.a1.unit26.lesson06.teach.nina_privet_ty:
    title: Nina begroet Dima
    gloss: 'Nina: Hoi, ben jij Dima?'
    note: 'Een eenvoudige informele vraag: het Russisch heeft geen werkwoord ''zijn'' nodig, gewoon *Ты Дима?*'
  ru.a1.unit26.lesson06.teach.dima_da_priyatno:
    title: Dima begroet Nina terug
    gloss: 'Dima: Ja! Leuk je te ontmoeten, Nina.'
    note: '*Приятно познакомиться* is de standaardzin als je iemand voor het eerst ontmoet. *Познакомиться* betekent kennismaken met een nieuw iemand.'
  ru.a1.unit26.lesson06.teach.nina_mne_tozhe:
    title: Nina beantwoordt de begroeting
    gloss: 'Nina: Aangenaam!'
    note: 'Sluit de dialoog af: Dima heeft Nina herkend aan de eerdere beschrijving van Nastja.'
