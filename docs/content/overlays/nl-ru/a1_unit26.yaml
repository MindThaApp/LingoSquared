course:
  title: Russisch A1
  description: 'Russisch voor beginners om de basisuiterlijke kenmerken van een persoon te beschrijven: lengte en leeftijdsindruk, haar- en oogkleur, de kernvraag Как ты выглядишь? en het vergelijken van het uiterlijk van twee mensen.'
