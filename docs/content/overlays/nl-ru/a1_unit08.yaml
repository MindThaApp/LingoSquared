teaching:
  ru.a1.unit08.lesson01.teach.magazin:
    title: магазин
    gloss: winkel
    note: магазин is een mannelijk zelfstandig naamwoord voor een winkel.
    example_gloss: We gaan naar de winkel.
  ru.a1.unit08.lesson01.teach.skolko:
    title: сколько
    gloss: hoeveel
    note: сколько vraagt naar een hoeveelheid of prijs en komt vaak samen met стоит voor.
    example_gloss: Hoeveel kost het brood?
  ru.a1.unit08.lesson01.teach.stoit:
    title: стоит
    gloss: kost
    note: стоит is de derde persoon enkelvoud van стоить ("kosten"), gebruikt met een enkelvoudig onderwerp zoals хлеб.
    example_gloss: Het brood kost honderd roebel.
  ru.a1.unit08.lesson01.teach.rubl:
    title: рубль
    gloss: roebel
    note: рубль is de Russische munteenheid; сто ("honderd") vraagt om de genitief meervoud рублей.
    example_gloss: Het brood kost honderd roebel.
  ru.a1.unit08.lesson01.teach.khleb_moloko:
    title: хлеб, молоко
    gloss: brood, melk
    note: хлеб is mannelijk en молоко is onzijdig -- beide zijn alledaagse boodschappen.
    example_gloss:
    - Hoeveel kost het brood?
    - Hoeveel kost de melk?
  ru.a1.unit08.lesson02.teach.dayte_pozhaluysta:
    title: Дайте, пожалуйста, ...
    gloss: Geeft u mij alstublieft ...
    note: Дайте is de beleefde gebiedende wijs (of meervoud) van дать ("geven"), gebruikt met вы.
  ru.a1.unit08.lesson02.teach.kilogramm:
    title: килограмм
    gloss: kilogram
    note: килограмм is de gewone eenheid om groente, fruit of brood op gewicht te kopen.
    example_gloss: Geeft u mij alstublieft een kilo.
  ru.a1.unit08.lesson02.teach.polkilo:
    title: полкило
    gloss: een halve kilo
    note: полкило is een samenstelling van пол- ("half") en кило (een informele korte vorm van килограмм).
    example_gloss: Geeft u mij alstublieft een halve kilo.
  ru.a1.unit08.lesson02.teach.shtuka:
    title: штука
    gloss: stuk
    note: штука telt losse stukken; пять штук staat in de genitief meervoud na het getal пять.
    example_gloss:
    - Geef me er alsjeblieft één.
    - Geef me er alsjeblieft vijf.
  ru.a1.unit08.lesson03.teach.pomidory_ogurtsy:
    title: помидоры, огурцы
    gloss: tomaten, komkommers
    note: Beide zijn meervoudsnamen van groenten; помидоры is mannelijk en огурцы is mannelijk.
    example_gloss:
    - Heeft u tomaten?
    - Heeft u komkommers?
  ru.a1.unit08.lesson03.teach.kartofel_kapusta:
    title: картофель, капуста
    gloss: aardappelen, kool
    note: картофель is een mannelijk verzamelwoord (gebruikt als een ontelbaar woord) en капуста is vrouwelijk.
    example_gloss:
    - Heeft u aardappelen?
    - Heeft u kool?
  ru.a1.unit08.lesson03.teach.yabloki_apelsiny:
    title: яблоки, апельсины
    gloss: appels, sinaasappels
    note: кило яблок gebruikt de genitief meervoud яблок na кило ("een kilo appels"), net als кило апельсинов.
    example_gloss:
    - Hoeveel kost een kilo appels?
    - Hoeveel kost een kilo sinaasappels?
  ru.a1.unit08.lesson03.teach.u_vas_est:
    title: У вас есть ...?
    gloss: Heeft u ...? (formeel)
    note: Gebruikt de beleefde vorm вас, de standaardmanier om een verkoper te vragen of hij iets heeft.
  ru.a1.unit08.lesson03.teach.da_u_menya_est:
    title: Да, у меня есть ...
    gloss: Ja, ik heb ...
    note: У меня есть (letterlijk "bij mij is er") is de standaardmanier om "ik heb" te zeggen, het antwoord van de verkoper.
  ru.a1.unit08.lesson03.teach.pokupatel_pomidory:
    title: De klant vraagt naar tomaten
    gloss: 'Klant: Heeft u tomaten?'
    note: De klant begint met de beleefde vraag У вас есть ...?
  ru.a1.unit08.lesson03.teach.prodavets_da_est:
    title: De verkoper zegt ja
    gloss: 'Verkoper: Ja, die hebben we.'
    note: Да, есть is het korte, alledaagse antwoord (letterlijk "ja, er is/zijn") zonder het product te herhalen.
  ru.a1.unit08.lesson03.teach.pokupatel_kilo_yablok:
    title: De klant vraagt naar een prijs
    gloss: 'Klant: Hoeveel kost een kilo appels?'
    note: кило яблок gebruikt de genitief meervoud яблок na кило.
  ru.a1.unit08.lesson03.teach.prodavets_dvesti:
    title: De verkoper noemt de prijs
    gloss: 'Verkoper: Tweehonderd roebel.'
    note: Двести betekent "tweehonderd"; net als сто wordt het gevolgd door de genitief meervoud рублей.
  ru.a1.unit08.lesson03.teach.pokupatel_dayte_kilogramm:
    title: De klant koopt een kilo
    gloss: 'Klant: Een kilo appels, alstublieft.'
    note: Дайте ..., пожалуйста uit les 2, nu met килограмм яблок ("een kilo appels").
  ru.a1.unit08.lesson03.teach.prodavets_khorosho:
    title: De verkoper overhandigt het
    gloss: 'Verkoper: Goed, alstublieft.'
    note: Пожалуйста betekent hier "alstublieft, hier is het" wanneer de verkoper de aankoop overhandigt, niet "alstublieft" als verzoek.
