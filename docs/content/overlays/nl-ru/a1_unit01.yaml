course:
  title: Russisch A1
  description: Leer Russisch op A1-niveau voor alledaagse begroetingen en korte sociale gesprekjes, met uitgebreide Nederlandse uitleg over het Cyrillische alfabet en het verschil in beleefdheid tussen вы en ты.
units:
  ru.a1.unit01.greetings:
    title: Begroetingen en afscheid
lessons:
  ru.a1.unit01.lesson01.script_ramp:
    title: Maak kennis met het Cyrillische alfabet
  ru.a1.unit01.lesson02.vremya_dnya:
    title: Begroetingen voor verschillende momenten van de dag
  ru.a1.unit01.lesson03.kak_dela_i_proshchanie:
    title: Hoe gaat het? en afscheid nemen
teaching:
  ru.a1.unit01.lesson01.teach.direction:
    title: Leesrichting
    gloss: Het Russische alfabet lees je van links naar rechts, net als het Nederlandse.
    note: Russisch (in Cyrillisch schrift) lees je in dezelfde richting als Nederlands. Je hoeft dus niets nieuws te leren over de leesrichting, alleen nieuwe lettervormen en klanken.
  ru.a1.unit01.lesson01.teach.letter_z:
    title: З з
    gloss: de letter Z
    note: Wordt uitgesproken als de "z" in "zon". De kleine letter з lijkt op een cijfer 3.
  ru.a1.unit01.lesson01.teach.letter_d:
    title: Д д
    gloss: de letter D
    note: Wordt uitgesproken als de "d" in "deur". De kleine letter д is een kleinere versie van de hoofdletter, met korte "voetjes" onder de regel. Hij lijkt helemaal niet op de Latijnse "d", dus leer de vorm als iets nieuws.
  ru.a1.unit01.lesson01.teach.letter_r:
    title: Р р
    gloss: de letter R
    note: 'Wordt uitgesproken als een gerolde "r" (met de tongpunt). Ze lijkt op een Latijnse "P": een klassieke valse vriend onder de letters, dus lees haar niet als "p".'
  ru.a1.unit01.lesson01.teach.letter_a:
    title: А а
    gloss: de letter A
    note: Wordt uitgesproken als de "a" in "aap". Ziet er hetzelfde uit als de Latijnse "A/a" en klinkt er ook sterk op.
  ru.a1.unit01.lesson01.teach.letter_v:
    title: В в
    gloss: de letter V
    note: 'Wordt uitgesproken als de "v" in "vis". Lijkt op een Latijnse "B": weer een valse vriend om op te letten.'
  ru.a1.unit01.lesson01.teach.letter_s:
    title: С с
    gloss: de letter S
    note: Wordt uitgesproken als de "s" in "sap". Ziet eruit als de Latijnse "C/c", maar klinkt in het Russisch nooit als "k".
  ru.a1.unit01.lesson01.teach.letter_t:
    title: Т т
    gloss: de letter T
    note: Wordt uitgesproken als de "t" in "tak". De kleine letter т wordt met de hand soms geschreven als een kleine "m". Leer eerst de gedrukte vorm die je hier ziet.
  ru.a1.unit01.lesson01.teach.letter_u:
    title: У у
    gloss: de letter U
    note: Wordt uitgesproken als de "oe" in "boek". Ze lijkt op een Latijnse "y", maar klinkt daar niet naar.
  ru.a1.unit01.lesson01.teach.letter_ye:
    title: Е е
    gloss: de letter Je
    note: Wordt aan het begin van een woord of lettergreep uitgesproken als de "je" in "jet". Ziet er hetzelfde uit als de Latijnse "E/e", maar klinkt heel anders.
  ru.a1.unit01.lesson01.teach.hard_sign_note:
    title: 'ъ en ь: harde teken en zachte teken'
    gloss: 'Het harde teken ъ en het zachte teken ь hebben geen eigen klank: ze veranderen de uitspraak van de letter naast zich.'
    note: Deze twee tekens staan nooit zelf voor een klank. Het ь maakt de voorafgaande medeklinker zacht en het ъ markeert een harde scheiding tussen klanken. Je komt ze nog tegen zodra echte woorden ze gebruiken.
  ru.a1.unit01.lesson01.teach.letter_short_i:
    title: Й й
    gloss: de letter korte I
    note: 'Wordt uitgesproken als de "j" in "mooi": een korte glijklank, geen volledige klinker. Je vindt hem in Здравствуйте, het woord waar deze les naartoe werkt.'
  ru.a1.unit01.lesson01.teach.zdravstvuyte_shape:
    title: Здравствуйте
    gloss: hallo (formeel)
    note: De volledige formele groet, opgebouwd uit de letters die je net hebt geleerd. Het woord lijkt lang en vol medeklinkers, maar je kent elke letter al uit deze les.
    example_gloss: Hallo! Mijn naam is Viktor.
  ru.a1.unit01.lesson02.teach.zdravstvuyte_privet:
    title: Здравствуйте, Привет
    gloss: hallo (formeel); hoi (informeel)
    note: Здравствуйте is de veilige, algemene formele groet voor elk moment van de dag en voor onbekenden. Привет is informeel en voor vrienden en leeftijdsgenoten.
    example_gloss:
    - Hallo! Hoe gaat het met u?
    - Hoi! Hoe gaat het?
  ru.a1.unit01.lesson02.teach.dobroe_utro:
    title: Доброе утро!
    gloss: goedemorgen
    note: Gebruik je in de ochtend, ongeveer tot laat in de ochtend.
  ru.a1.unit01.lesson02.teach.dobryy_den:
    title: Добрый день!
    gloss: goedendag / dag
    note: De standaardgroet overdag, te gebruiken van laat in de ochtend tot in de middag.
  ru.a1.unit01.lesson02.teach.dobryy_vecher:
    title: Добрый вечер!
    gloss: goedenavond
    note: Gebruik je als je 's avonds ergens aankomt. Het is een begroeting, geen afscheid.
  ru.a1.unit01.lesson02.teach.register_note:
    title: Een begroeting kiezen
    gloss: Здравствуйте kan op elk moment van de dag en in beleefd gezelschap. Привет is informeel en voor onder vrienden.
    note: Twijfel je over het moment van de dag of tegen wie je praat? Dan is Здравствуйте altijd veilig. Привет bewaar je voor mensen die je al goed kent.
  ru.a1.unit01.lesson03.teach.kak_dela:
    title: Как дела?
    gloss: Hoe gaat het? (informeel)
    note: De alledaagse informele manier om te vragen hoe het met iemand gaat, onder vrienden en leeftijdsgenoten.
  ru.a1.unit01.lesson03.teach.kak_pozhivaete:
    title: Как поживаете?
    gloss: Hoe gaat het met u?
    note: De formele manier om te vragen hoe het met iemand gaat, passend bij het register met вы.
  ru.a1.unit01.lesson03.teach.horosho_spasibo:
    title: Хорошо, спасибо
    gloss: goed, dank je
    note: Een eenvoudig, positief antwoord dat je in beide registers kunt gebruiken.
    example_gloss: Hoe gaat het? – Goed, dank je.
  ru.a1.unit01.lesson03.teach.tak_sebe:
    title: Так себе
    gloss: zo-zo
    note: Een neutraal tot licht negatief antwoord, voor als het niet geweldig en ook niet slecht gaat.
    example_gloss: Hoe gaat het? – Zo-zo.
  ru.a1.unit01.lesson03.teach.a_u_tebya:
    title: А у тебя?
    gloss: En met jou?
    note: De informele manier om de vraag terug te kaatsen, passend bij het register met ты.
  ru.a1.unit01.lesson03.teach.do_svidaniya:
    title: До свидания!
    gloss: tot ziens (neutraal/formeel)
    note: Het standaard, algemene afscheid. Letterlijk ongeveer "tot we elkaar weer zien".
  ru.a1.unit01.lesson03.teach.poka:
    title: Пока!
    gloss: doei (informeel)
    note: Een losse, heel gewone manier om afscheid te nemen van vrienden en kennissen.
  ru.a1.unit01.lesson03.teach.do_zavtra:
    title: До завтра!
    gloss: tot morgen
    note: Een vriendelijk afscheid als je de ander de volgende dag weer verwacht te zien.
  ru.a1.unit01.lesson03.teach.anna:
    title: Anna begroet Maksim
    gloss: 'Anna zegt: Goedendag! Hoe gaat het?'
    note: Anna en Maksim zijn collega's die elkaar overdag begroeten, op een vertrouwelijk niveau, zoals het woord дела aangeeft (informeel register).
  ru.a1.unit01.lesson03.teach.maksim_reply:
    title: Maksim antwoordt en vraagt terug
    gloss: 'Maksim zegt: Goed, dank je. En met jou?'
    note: Maksim antwoordt en kaatst de vraag informeel terug, passend bij het register van Anna.
  ru.a1.unit01.lesson03.teach.anna_close:
    title: Anna rondt het gesprek af
    gloss: 'Anna zegt: Ook goed. Nou, tot morgen!'
    note: Anna rondt het praatje af en neemt vriendelijk afscheid.
  ru.a1.unit01.lesson03.teach.maksim_close:
    title: Maksim neemt afscheid
    gloss: 'Maksim zegt: Tot morgen!'
    note: Maksim herhaalt het afscheid van Anna en sluit het gesprek af.
