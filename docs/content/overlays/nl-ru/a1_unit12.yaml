teaching:
  ru.a1.unit12.lesson01.teach.davay:
    title: Давай пойдём...
    gloss: Laten we gaan...
    note: Давай is een informeel voorstel ("laten we"); пойдём is de vorm voor "wij" van het werkwoord "gaan" in de toekomende tijd. Samen gebruik je ze om een activiteit voor te stellen.
  ru.a1.unit12.lesson01.teach.kino:
    title: кино
    gloss: de bioscoop
    note: кино is een onverbuigbaar onzijdig woord voor "bioscoop/film".
    example_gloss: Laten we naar de film gaan.
  ru.a1.unit12.lesson01.teach.zavtra_subbotu:
    title: завтра, в субботу
    gloss: morgen, op zaterdag
    note: завтра betekent "morgen"; в субботу gebruikt в + accusatief voor een dag van de week.
    example_gloss: Laten we morgen naar de bioscoop gaan.
  ru.a1.unit12.lesson02.teach.soglasen:
    title: Хорошо, я согласен.
    gloss: Goed, ik ga akkoord.
    note: согласен ("akkoord") zegt een man; een vrouw zegt согласна.
  ru.a1.unit12.lesson02.teach.ne_mogu:
    title: К сожалению, я не могу.
    gloss: Helaas kan ik niet.
    note: К сожалению ("helaas") maakt een weigering zachter; не могу betekent "ik kan niet".
  ru.a1.unit12.lesson02.teach.vo_skolko:
    title: Во сколько мы встретимся?
    gloss: Hoe laat spreken we af?
    note: Во сколько vraagt naar een kloktijd; встретимся is de "wij"-toekomende tijd van "elkaar ontmoeten".
    example_gloss: Zullen we zeven uur zeggen?
  ru.a1.unit12.lesson03.teach.nastya_davay_poydyom:
    title: Nastja doet een voorstel
    gloss: 'Nastja: Laten we zaterdag naar de bioscoop gaan.'
    note: Настя begint met Давай пойдём в кино в субботу.
  ru.a1.unit12.lesson03.teach.dima_horosho_soglasen:
    title: Dima stemt in en vraagt naar de tijd
    gloss: 'Dima: Goed, ik ga akkoord. Hoe laat spreken we af?'
    note: Дима stemt in en vraagt dan Во сколько мы встретимся?
  ru.a1.unit12.lesson03.teach.nastya_davay_v_sem:
    title: Nastja stelt een tijd en plek voor
    gloss: 'Nastja: Laten we zeven uur afspreken, bij de bioscoop.'
    note: у кинотеатра betekent "bij de bioscoop", met у + genitief.
  ru.a1.unit12.lesson03.teach.dima_otlichno:
    title: Dima bevestigt
    gloss: 'Dima: Prima, tot zaterdag.'
    note: Отлично, до субботы sluit het gesprek af; до субботы betekent letterlijk "tot zaterdag".
