teaching:
  ru.a1.unit15.lesson01.teach.kofe_luchshe_chem_chay:
    title: Кофе лучше, чем чай.
    gloss: Koffie is beter dan thee.
    note: лучше ("beter") plus чем ("dan") vormt de basisvergelijking.
  ru.a1.unit15.lesson01.teach.huzhe:
    title: хуже
    gloss: slechter
    note: хуже ("slechter") is het tegenovergestelde van лучше en wordt op dezelfde manier met чем gebruikt.
    example_gloss: Thee is slechter dan koffie.
  ru.a1.unit15.lesson01.teach.kakoy:
    title: какой / какое
    gloss: welk / wat voor
    note: какой (mannelijk) en какое (onzijdig) vragen welke van twee dingen; ze komen qua geslacht overeen met het zelfstandig naamwoord.
    example_gloss: Welke koffie is beter?
  ru.a1.unit15.lesson02.teach.eto_kafe_bolshe:
    title: Это кафе больше, чем то.
    gloss: Dit café is groter dan dat.
    note: больше ("groter/meer") plus чем vormt een vergelijking van grootte; это/то ("dit/dat") wijzen de twee cafés aan.
  ru.a1.unit15.lesson02.teach.menshe:
    title: меньше
    gloss: kleiner / minder
    note: меньше ("kleiner/minder") is het tegenovergestelde van больше.
    example_gloss: Dat café is kleiner dan dit.
  ru.a1.unit15.lesson02.teach.dom:
    title: дом
    gloss: huis
    note: дом ("huis") plus этот/тот ("dit/dat") laat je de grootte van twee huizen vergelijken.
    example_gloss: Dit huis is groter dan dat.
  ru.a1.unit15.lesson03.teach.nastya_kakoye_kafe_luchshe:
    title: Nastja vraagt welk café beter is
    gloss: 'Nastja: Welk café is beter?'
    note: Настя begint met Какое кафе лучше?
  ru.a1.unit15.lesson03.teach.dima_eto_kafe_luchshe:
    title: Dima antwoordt
    gloss: 'Dima: Dit café is beter dan dat.'
    note: Дима antwoordt Это кафе лучше, чем то.
  ru.a1.unit15.lesson03.teach.nastya_a_bolshe:
    title: Nastja vraagt naar de grootte, Dima bevestigt
