course:
  title: Russisch A1
  description: Leer Russisch op A1-niveau voor alledaagse begroetingen en korte sociale gesprekjes, met uitgebreide Nederlandse uitleg over het Cyrillische alfabet en het verschil in beleefdheid tussen вы en ты.
