  ru.a1.unit06.lesson03.semeynoe_foto:
    title: Een familiefoto
teaching:
  ru.a1.unit06.lesson01.teach.u_menya_est:
    title: У меня есть ...
    gloss: Ik heb ...
    note: Letterlijk "bij mij (is)..." – de standaardmanier in het Russisch om "ik heb" te zeggen. In Les 3 gebruikte У меня два брата al dezelfde У меня-constructie; есть laat je meestal weg als het om het aantal gaat dat je hebt.
  ru.a1.unit06.lesson01.teach.eto:
    title: Это ...
    gloss: Dit is ...
    note: Это gebruik je om een persoon of ding voor te stellen of aan te wijzen, ongeacht het grammaticale geslacht ervan.
  ru.a1.unit06.lesson01.teach.mat_otets:
    title: мать, отец
    gloss: moeder, vader
    note: мать hoort bij de kleine groep vrouwelijke Russische zelfstandige naamwoorden die op een zachtheidsteken (-ь) eindigen.
    example_gloss:
    - Dit is mijn moeder.
    - Dit is mijn vader.
  ru.a1.unit06.lesson01.teach.brat_sestra:
    title: брат, сестра
    gloss: broer, zus
    note: брат is het woord waarmee je in Les 3 al telde ("У меня два брата"); сестра is de vrouwelijke tegenhanger.
    example_gloss:
    - Dit is mijn broer.
    - Ik heb een zus.
  ru.a1.unit06.lesson01.teach.moy_moya:
    title: мой, моя
    gloss: mijn (mannelijk), mijn (vrouwelijk)
    note: мой gebruik je bij mannelijke woorden zoals отец en брат; моя bij vrouwelijke woorden zoals мать en сестра.
  ru.a1.unit06.lesson02.teach.babushka_dedushka:
    title: бабушка, дедушка
    gloss: oma, opa
    note: 'Beide eindigen op -а, maar дедушка is een man en is dus mannelijk voor de overeenkomst: мой дедушка, maar моя бабушка.'
    example_gloss:
    - Dit is mijn oma.
    - Dit is mijn opa.
  ru.a1.unit06.lesson02.teach.muzh_zhena:
    title: муж, жена
    gloss: man (echtgenoot), vrouw (echtgenote)
    note: муж is mannelijk en жена is vrouwelijk, volgens het gewone patroon van de uitgangen.
    example_gloss:
    - Dit is mijn man.
    - Dit is mijn vrouw.
  ru.a1.unit06.lesson02.teach.syn_doch:
    title: сын, дочь
    gloss: zoon, dochter
    note: дочь is, net als мать, een vrouwelijk woord dat op een zachtheidsteken (-ь) eindigt.
    example_gloss: Ik heb een zoon en een dochter.
  ru.a1.unit06.lesson02.teach.deti:
    title: дети
    gloss: kinderen
    note: дети is het onregelmatige meervoud van ребёнок ("kind") – enkelvoud en meervoud zijn twee totaal verschillende woorden.
    example_gloss: Heeft u kinderen?
  ru.a1.unit06.lesson02.teach.u_vas_est:
    title: У вас есть ...?
    gloss: Heeft u ...? (formeel)
    note: Gebruikt het formele вас, passend bij het вы-register uit Les 2.
  ru.a1.unit06.lesson03.teach.kto_eto:
    title: Кто это?
    gloss: Wie is dit?
    note: De standaardvraag om te vragen wie iemand is, bijvoorbeeld bij het bekijken van een foto.
  ru.a1.unit06.lesson03.teach.eyo_zovut:
    title: Её зовут Анна.
    gloss: Ze heet Anna.
    note: Letterlijk "ze noemen haar Anna" – Её ("haar") is het lijdend voorwerp van het werkwoord зовут, niet het onderwerp.
  ru.a1.unit06.lesson03.teach.maksim_kto_eto:
    title: Maksim vraagt naar de foto
    gloss: 'Maksim: Wie is dit op de foto?'
    note: 'Maksim begint door naar de foto te wijzen en te vragen: Кто это на фото?'
  ru.a1.unit06.lesson03.teach.olga_moya_semya:
    title: Olga stelt haar gezin voor
    gloss: 'Olga: Dit is mijn gezin.'
    note: Это моя семья gebruikt семья ("gezin"), een vrouwelijk woord, dus moя past daarbij.
  ru.a1.unit06.lesson03.teach.olga_vot_otets:
    title: Olga noemt drie gezinsleden
    gloss: 'Olga: Hier zijn mijn vader, mijn moeder en mijn broer.'
    note: Вот ("hier is/zijn") leidt de opsomming in; elk bezittelijk voornaamwoord (мой/моя) past bij het woord dat erop volgt.
  ru.a1.unit06.lesson03.teach.maksim_a_kto_devochka:
    title: Maksim vraagt naar het meisje
    gloss: 'Maksim: En wie is dat meisje?'
    note: А verbindt Maksims vervolgvraag over een vierde persoon op de foto soepel met het voorgaande.
  ru.a1.unit06.lesson03.teach.olga_eto_moya_doch:
    title: Olga noemt haar dochter
    gloss: 'Olga: Dit is mijn dochter. Ze heet Anna.'
    note: Olga antwoordt met моя дочь en noemt dan de naam met Её зовут Анна.
