teaching:
  ru.a1.unit02.lesson01.teach.kak_vas_zovut:
    title: Как вас зовут?, Как тебя зовут?
    gloss: Hoe heet u? (formeel); Hoe heet je? (informeel)
    note: Как вас зовут? gebruikt het formele вас en zeg je tegen onbekenden of in beleefde situaties. Как тебя зовут? gebruikt het informele тебя, voor vrienden, kinderen en leeftijdsgenoten.
    example_gloss:
    - Goedendag! Hoe heet u?
    - Hoi! Hoe heet je?
  ru.a1.unit02.lesson01.teach.menya_zovut:
    title: Меня зовут Виктор.
    gloss: Ik heet Viktor.
    note: Меня зовут (letterlijk "ze noemen mij") is de standaardmanier om in het Russisch je naam te zeggen, in elk register.
  ru.a1.unit02.lesson01.teach.menya_zovut_anna:
    title: Меня зовут Анна.
    gloss: Ik heet Anna.
    note: Hetzelfde patroon, Меня зовут ..., met een andere naam -- deze zin verandert niet naargelang het geslacht van de spreker.
  ru.a1.unit02.lesson01.teach.register_note:
    title: De juiste vraag kiezen
    gloss: Как вас зовут? is beleefd of voor onbekenden. Как тебя зовут? is voor vrienden, kinderen en leeftijdsgenoten.
    note: Dit verschil tussen formeel en informeel komt overeen met het verschil tussen вы en ты, dat in les 2 volledig wordt behandeld -- вас en тебя zijn de vormen van вы en ты in de lijdend-voorwerpsvorm (de naamvalsvorm).
  ru.a1.unit02.lesson02.teach.vy_ty:
    title: вы, ты
    gloss: u (formeel); je/jij (informeel)
    note: 'Net als het Nederlands met u en je/jij kent het Russisch twee vormen voor "jij": вы gebruik je bij onbekenden, ouderen en in een zakelijke context; ты bij vrienden, familie en kinderen.'
    example_gloss:
    - Waar komt u vandaan? (formeel)
    - Waar kom je vandaan? (informeel)
  ru.a1.unit02.lesson02.teach.vy_ty_rule:
    title: Wanneer gebruik je welke?
    gloss: 'Вы is formeel: bij onbekenden, op het werk, bij ouderen. Ты is informeel: bij vrienden, familie, kinderen.'
    note: Ты gebruiken tegen iemand die вы verwacht kan te familiair of zelfs onbeleefd overkomen -- begin bij twijfel met вы.
  ru.a1.unit02.lesson02.teach.mozhno_na_ty:
    title: Можно на ты?
    gloss: Mogen we elkaar tutoyeren (ты)?
    note: Een beleefde manier om voor te stellen van het formele вы over te stappen op het informele ty, zodra de verstandhouding vriendelijk genoeg is.
  ru.a1.unit02.lesson02.teach.davayte_pereydyom:
    title: Давайте перейдём на ты.
    gloss: Laten we overstappen op het informele ты.
    note: Een iets directere, uitnodigende manier om dezelfde overstap voor te stellen als bij Можно на ты?
  ru.a1.unit02.lesson02.teach.otkuda_vy:
    title: Откуда вы?
    gloss: Waar komt u vandaan? (formeel)
    note: Gebruikt het formele вы, passend bij een eerste ontmoeting of een zakelijke context.
  ru.a1.unit02.lesson02.teach.otkuda_ty:
    title: Откуда ты?
    gloss: Waar kom je vandaan? (informeel)
    note: De informele tegenhanger, voor iemand die je al goed kent.
  ru.a1.unit02.lesson02.teach.ya_iz_kanady:
    title: Я из Канады.
    gloss: Ik kom uit Canada.
    note: Из ("uit") staat met de genitief, dus Канада wordt hier Канады -- dit patroon voor herkomst is goed om te onthouden, ook al komt de volledige naamvalsgrammatica pas later.
  ru.a1.unit02.lesson02.teach.ya_iz_moskvy:
    title: Я из Москвы.
    gloss: Ik kom uit Moskou.
    note: 'Hetzelfde genitiefpatroon als bij Я из Канады: Москва wordt Москвы na из.'
  ru.a1.unit02.lesson03.teach.davayte_poznakomimsya:
    title: Давайте познакомимся.
    gloss: Laten we kennismaken.
    note: Een beleefde, gebruikelijke manier om een kennismaking te openen tussen mensen die elkaar voor het eerst ontmoeten.
  ru.a1.unit02.lesson03.teach.ochen_priyatno:
    title: Очень приятно
    gloss: aangenaam
    note: Een standaard, beleefd antwoord nadat iemand net zijn naam heeft gezegd.
    example_gloss: Ik heet John. -- Aangenaam.
  ru.a1.unit02.lesson03.teach.irina_greeting:
    title: Irina Petrovna opent de kennismaking
    gloss: 'Irina Petrovna zegt: Goedendag! Laten we kennismaken. Ik heet Irina Petrovna.'
    note: Irina Petrovna ontmoet John voor het eerst in een formele kantooromgeving, dus ze gebruikt het beleefde Здравствуйте en overal het вы-register.
  ru.a1.unit02.lesson03.teach.john_reply:
    title: John antwoordt met zijn naam
    gloss: 'John zegt: Aangenaam. Ik heet John.'
    note: John sluit met Очень приятно aan bij het formele, beleefde register van Irina Petrovna.
  ru.a1.unit02.lesson03.teach.irina_question:
    title: Irina Petrovna vraagt waar John vandaan komt
    gloss: 'Irina Petrovna vraagt: Waar komt u vandaan, John?'
    note: Ze gebruikt het formele Откуда вы, passend bij de kantooromgeving.
  ru.a1.unit02.lesson03.teach.john_answer:
    title: John antwoordt en vraagt terug
    gloss: 'John zegt: Ik kom uit Canada. En waar komt u vandaan?'
    note: John zegt waar hij vandaan komt en stelt de vraag beleefd terug met А вы откуда?
  ru.a1.unit02.lesson03.teach.irina_answer:
    title: Irina Petrovna antwoordt
    gloss: 'Irina Petrovna zegt: Ik kom uit Moskou.'
    note: Ze rondt het gesprekje af met het genitiefpatroon voor herkomst uit les 2.
