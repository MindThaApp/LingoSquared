teaching:
  ru.a1.unit09.lesson01.teach.gde:
    title: где
    gloss: waar
    note: где vraagt naar een plaats en staat vaak samen met находится.
    example_gloss: Waar is de winkel?
  ru.a1.unit09.lesson01.teach.nakhoditsya:
    title: находится
    gloss: bevindt zich
    note: находится is de derde persoon enkelvoud van находиться („zich bevinden”) en wordt gebruikt met een onderwerp in het enkelvoud, zoals магазин.
    example_gloss: Waar bevindt de winkel zich?
  ru.a1.unit09.lesson01.teach.ulitsa:
    title: улица
    gloss: straat
    note: улица is vrouwelijk; в на Тверской улице („in de Tverskajastraat”) staat улице in de prepositief na на.
    example_gloss: De winkel is in de Tverskajastraat.
  ru.a1.unit09.lesson01.teach.gde_nakhoditsya_magazin:
    title: Где находится магазин?
    gloss: Waar is de winkel?
    note: Het standaardpatroon om te vragen waar een plek is.
  ru.a1.unit09.lesson02.teach.bank_apteka:
    title: банк, аптека
    gloss: bank, apotheek
    note: банк is mannelijk en аптека is vrouwelijk -- beide komen veel voor in de stad.
    example_gloss:
    - Waar is de bank?
    - Waar is de apotheek?
  ru.a1.unit09.lesson02.teach.vokzal_gostinitsa:
    title: вокзал, гостиница
    gloss: station, hotel
    note: вокзал is mannelijk en гостиница is vrouwelijk.
    example_gloss:
    - Waar is het station?
    - Waar is het hotel?
  ru.a1.unit09.lesson02.teach.restoran_biblioteka:
    title: ресторан, библиотека
    gloss: restaurant, bibliotheek
    note: ресторан is mannelijk en библиотека is vrouwelijk; straatnamen zoals Чайковского en Пушкина staan in de genitief na улица.
    example_gloss:
    - Waar is het restaurant?
    - Waar is de bibliotheek?
  ru.a1.unit09.lesson03.teach.chto_est_na_vashey_ulitse:
    title: Что есть на вашей улице?
    gloss: Wat is er in jouw straat?
    note: вашей is het beleefde bezittelijk voornaamwoord („uw/jouw”), in overeenstemming met het vrouwelijke улице in de prepositief.
  ru.a1.unit09.lesson03.teach.anna_chto_est:
    title: Anna vraagt naar de straat
    gloss: 'Anna: Wat is er in jouw straat?'
    note: Anna opent de dialoog met Что есть на вашей улице?
  ru.a1.unit09.lesson03.teach.viktor_na_moey_ulitse:
    title: Viktor noemt drie plekken
    gloss: 'Viktor: In mijn straat is een winkel, een bibliotheek en een bank.'
    note: На моей улице есть somt dingen op met есть („er is/zijn”), verbonden met и.
  ru.a1.unit09.lesson03.teach.anna_a_gde_bank:
    title: Anna vraagt waar de bank is
    gloss: 'Anna: En waar is de bank?'
    note: А leidt Anna's vervolgvraag over een van de plekken die Viktor noemde op een vloeiende manier in.
  ru.a1.unit09.lesson03.teach.viktor_bank_na_pushkina:
    title: Viktor noemt de straat van de bank
    gloss: 'Viktor: De bank is in de Pushkinstraat.'
    note: Viktor antwoordt met Банк на улице Пушкина, met de genitief Пушкина na улице.
  ru.a1.unit09.lesson03.teach.anna_spasibo_bolshoe:
    title: Anna bedankt Viktor
    gloss: 'Anna: Hartelijk bedankt.'
    note: Спасибо большое versterkt спасибо met большое („groot”), een gangbare manier om „hartelijk bedankt” te zeggen.
  ru.a1.unit09.lesson03.teach.viktor_pozhaluysta:
    title: Viktor antwoordt
    gloss: 'Viktor: Graag gedaan.'
    note: 'Пожалуйста is het antwoord op спасибо: „graag gedaan”.'
