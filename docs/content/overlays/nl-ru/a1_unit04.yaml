teaching:
  ru.a1.unit04.lesson01.teach.kakoy_den:
    title: Какой сегодня день?
    gloss: Welke dag is het vandaag?
    note: Какой past zich aan bij het mannelijke woord день («dag»).
  ru.a1.unit04.lesson01.teach.ponedelnik_vtornik:
    title: понедельник, вторник
    gloss: maandag, dinsdag
    note: Dagen van de week schrijf je in het Russisch met een kleine letter, net als in het Nederlands.
    example_gloss:
    - Vandaag is het maandag.
    - Vandaag is het dinsdag.
  ru.a1.unit04.lesson01.teach.sreda_chetverg:
    title: среда, четверг
    gloss: woensdag, donderdag
    note: Net als alle Russische namen van weekdagen schrijf je среда en четверг met een kleine letter -- alleen aan het begin van een zin met een hoofdletter.
    example_gloss:
    - Vandaag is het woensdag.
    - Vandaag is het donderdag.
  ru.a1.unit04.lesson01.teach.pyatnitsa_subbota:
    title: пятница, суббота
    gloss: vrijdag, zaterdag
    note: суббота heeft een dubbele б – een veelvoorkomende spellingval.
    example_gloss:
    - Vandaag is het vrijdag.
    - Vandaag is het zaterdag.
  ru.a1.unit04.lesson01.teach.voskresenye:
    title: воскресенье
    gloss: zondag
    note: De laatste dag in de rij van de Russische weekdagen.
    example_gloss: Vandaag is het zondag.
  ru.a1.unit04.lesson01.teach.segodnya:
    title: Сегодня ...
    gloss: Vandaag is het ...
    note: Na Сегодня en een dagnaam staat in het Russisch geen werkwoord, terwijl je in het Nederlands wel "is" zegt.
  ru.a1.unit04.lesson02.teach.kakoe_chislo:
    title: Какое сегодня число?
    gloss: Welke datum is het vandaag?
    note: Какое past bij het onzijdige woord число ("datum/getal"), anders dan какой bij день hierboven.
  ru.a1.unit04.lesson02.teach.pervoe_tretye:
    title: первое, третье
    gloss: 1e, 3e
    note: Rangtelwoorden in datums krijgen de onzijdige uitgang (-ое/-ье), omdat ze bij het weggelaten woord число horen.
    example_gloss:
    - Vandaag is het 1 januari.
    - Vandaag is het 3 januari.
  ru.a1.unit04.lesson02.teach.pyatoe_desyatoe:
    title: пятое, десятое
    gloss: 5e, 10e
    note: Hetzelfde onzijdige patroon als bij первое/третье.
    example_gloss:
    - Vandaag is het 5 oktober.
    - Vandaag is het 10 april.
  ru.a1.unit04.lesson02.teach.yanvar_aprel:
    title: января, апреля
    gloss: van januari, van april
    note: 'De maandnaam staat na een datum in de genitief: январь wordt января en апрель wordt апреля.'
    example_gloss:
    - Vandaag is het 3 januari.
    - Vandaag is het 10 april.
  ru.a1.unit04.lesson02.teach.oktyabrya:
    title: октября
    gloss: van oktober
    note: Genitief van октябрь, met hetzelfde patroon na een datum als января/апреля.
    example_gloss: Vandaag is het 5 oktober.
  ru.a1.unit04.lesson03.teach.kakoe_segodnya_chislo:
    title: Какое сегодня число?
    gloss: Welke datum is het vandaag?
    note: De standaardmanier om naar de datum te vragen.
  ru.a1.unit04.lesson03.teach.vo_vtornik:
    title: во вторник
    gloss: op dinsdag
    note: 'Het voorzetsel в wordt во voor вторник, omdat dat makkelijker uit te spreken is; вторник zelf verandert hier niet (vrouwelijke dagnamen wel: в среду, в пятницу, в субботу).'
  ru.a1.unit04.lesson03.teach.vstrecha:
    title: встреча
    gloss: afspraak
    note: Een gewoon zelfstandig naamwoord voor een geplande bijeenkomst of afspraak.
    example_gloss: De afspraak is op dinsdag.
  ru.a1.unit04.lesson03.teach.anna_kakoy_den:
    title: Anna vraagt naar de dag
    gloss: 'Anna: Welke dag is het vandaag?'
    note: Anna opent het gesprek met de vraag naar de день uit les 1.
  ru.a1.unit04.lesson03.teach.viktor_sreda:
    title: Viktor antwoordt met dag en datum
    gloss: 'Viktor: Vandaag is het woensdag 3 januari.'
    note: Viktor noemt samen de weekdag en de datum met het rangtelwoord, en gebruikt de genitiefvorm января van de maand.
  ru.a1.unit04.lesson03.teach.anna_khorosho:
    title: Anna stelt dinsdag voor
    gloss: 'Anna: Goed. Is de afspraak op dinsdag?'
    note: Хорошо bevestigt Viktors antwoord, voordat Anna haar vervolgvraag stelt.
  ru.a1.unit04.lesson03.teach.viktor_da:
    title: Viktor bevestigt de datum
    gloss: 'Viktor: Ja, op dinsdag 9 januari.'
    note: 'Да bevestigt, daarna herhaalt Viktor de dag en de datum. Om te zeggen OP welke datum iets gebeurt, komt het rangtelwoord zelf in de genitief: девятого января ("op 9 januari"), vergelijk Сегодня девятое января ("Vandaag is het 9 januari").'
