teaching:
  ru.a1.unit03.lesson01.teach.u_menya:
    title: У меня ...
    gloss: Ik heb ...
    note: Letterlijk "bij mij (is) ..." — de standaardmanier in het Russisch om "ik heb" te zeggen, niet met een werkwoord dat overeenkomt met "hebben".
  ru.a1.unit03.lesson01.teach.odin_dva:
    title: один, два
    gloss: een, twee
    note: 'Na два ("twee") krijgt het zelfstandig naamwoord een speciale genitief enkelvoud — let op: брат ("broer") wordt брата, niet de meervoudsvorm die je zou verwachten.'
    example_gloss:
    - Ik heb één broer.
    - Ik heb twee broers.
  ru.a1.unit03.lesson01.teach.tri_chetyre:
    title: три, четыре
    gloss: drie, vier
    note: Три en четыре vragen dezelfde genitief enkelvoud als два — книга ("boek") wordt книги na два/три/четыре.
    example_gloss:
    - Ik heb drie boeken.
    - Ik heb vier boeken.
  ru.a1.unit03.lesson01.teach.pyat:
    title: пять
    gloss: vijf
    note: Vanaf пять ("vijf") staat het zelfstandig naamwoord in de genitief meervoud — рубль ("roebel") wordt рублей, niet рубли.
    example_gloss: Ik heb vijf roebel.
  ru.a1.unit03.lesson01.teach.brat_bratya:
    title: брат, брата
    gloss: broer; broers (na 2-4)
    note: брата is de genitief enkelvoud die specifiek na два, три en четыре wordt gebruikt — niet het gewone meervoud.
    example_gloss: Ik heb twee broers.
  ru.a1.unit03.lesson01.teach.kniga_knigi:
    title: книга, книги
    gloss: boek; boeken (na 2-4)
    note: книги volgt hetzelfde patroon van genitief enkelvoud als брата, na два, три en четыре.
    example_gloss: Ik heb drie boeken.
  ru.a1.unit03.lesson01.teach.rubl_rubley:
    title: рубль, рублей
    gloss: roebel; roebel (vanaf 5)
    note: рублей is de genitief meervoud die vanaf пять ("vijf") wordt gebruikt.
    example_gloss: Ik heb vijf roebel.
  ru.a1.unit03.lesson02.teach.shest_sem:
    title: шесть, семь
    gloss: zes, zeven
    note: Net als пять vragen шесть en семь de genitief meervoud.
    example_gloss:
    - Het is zes uur.
    - Ik heb zeven roebel.
  ru.a1.unit03.lesson02.teach.vosem_devyat:
    title: восемь, девять
    gloss: acht, negen
    note: 'Beide volgen het patroon van de genitief meervoud: книга wordt книг en рубль wordt рублей.'
    example_gloss:
    - Ik heb acht boeken.
    - Ik heb negen roebel.
  ru.a1.unit03.lesson02.teach.desyat:
    title: десять
    gloss: tien
    note: Wordt ook gebruikt om de leeftijd aan te geven, zoals in Мне десять лет ("Ik ben tien jaar oud").
    example_gloss: Ik ben tien jaar oud.
  ru.a1.unit03.lesson02.teach.kniga_genitive_plural:
    title: книг
    gloss: boeken (genitief meervoud, vanaf 5)
    note: 'De genitief meervoud van книга, gebruikt vanaf пять — let op: de eindklinker valt helemaal weg, anders dan bij книги na два/три/четыре.'
    example_gloss: Ik heb negen boeken.
  ru.a1.unit03.lesson02.teach.mne_let:
    title: Мне десять лет.
    gloss: Ik ben tien jaar oud.
    note: Leeftijd druk je in het Russisch uit met de datief "aan mij" (мне) plus een getal en лет (de genitief meervoud van "jaren"), niet met een werkwoord als "zijn".
  ru.a1.unit03.lesson02.teach.skolko_vam_let:
    title: Сколько вам лет?
    gloss: Hoe oud bent u? (formeel)
    note: Gebruikt de formele datief вам, passend bij het register вы uit Les 2.
  ru.a1.unit03.lesson03.teach.skolko_stoit:
    title: Сколько это стоит?
    gloss: Hoeveel kost dit?
    note: De standaardmanier om naar de prijs van één product te vragen, met стоит ("het kost", enkelvoud).
  ru.a1.unit03.lesson03.teach.skolko_stoyat:
    title: Сколько стоят яблоки?
    gloss: Hoeveel kosten de appels?
    note: Gebruikt стоят (de meervoudsvorm van "kosten") omdat яблоки ("appels") meervoud is — anders dan het enkelvoud стоит in Сколько это стоит?
  ru.a1.unit03.lesson03.teach.rubley:
    title: рубль, рубля, рублей
    gloss: roebel (1); roebel (2-4); roebel (5+)
    note: 'Het woord voor "roebel" verandert met het getal ervoor: рубль na één, рубля na два/три/четыре en рублей vanaf пять.'
    example_gloss:
    - Dit kost één roebel.
    - Dit kost twee roebel.
    - Dit kost vijf roebel.
  ru.a1.unit03.lesson03.teach.pokupatel_greeting:
    title: De klant begroet de verkoper
    gloss: 'Klant: Hallo! Hoeveel kosten de appels?'
    note: Een klant bij een marktkraam begint beleefd met Здравствуйте voordat hij naar de prijs vraagt.
  ru.a1.unit03.lesson03.teach.prodavets_apples:
    title: De verkoper antwoordt
    gloss: 'Verkoper: Drie roebel.'
    note: Три рубля gebruikt de genitief enkelvoud van «roebel» (de vorm voor 2-4), passend bij три.
  ru.a1.unit03.lesson03.teach.pokupatel_bread:
    title: De klant vraagt naar het brood
    gloss: 'Klant: En hoeveel kost het brood?'
    note: De klant gebruikt А («en») om vlot een vervolgvraag over een tweede product te stellen.
  ru.a1.unit03.lesson03.teach.prodavets_bread:
    title: De verkoper antwoordt opnieuw
    gloss: 'Verkoper: Zes roebel.'
    note: Шесть рублей gebruikt de genitief meervoud (de vorm vanaf 5), passend bij шесть.
  ru.a1.unit03.lesson03.teach.pokupatel_close:
    title: De klant sluit beleefd af
    gloss: 'Klant: Goed, bedankt!'
    note: Хорошо, спасибо! rondt het marktgesprek vriendelijk af met woordenschat uit de les over begroetingen.
