    title: Пользоваться en искать
    gloss: '*Пользоваться* wordt gevolgd door de instrumentalis (*пользоваться телефоном*), *искать* door de accusativus (*искать прогноз*).'
    note: 'Beide werkwoorden worden regelmatig vervoegd: *я пользуюсь, ты пользуешься*; *я ищу, ты ищешь*.'
