    title: Dima stemt in
    gloss: 'Dima: Goed idee! Ik zoek de weersverwachting even op.'
    note: '*Хорошая идея* is een vrouwelijk bijvoeglijk naamwoord bij een vrouwelijk zelfstandig naamwoord. *Поищу* is de voltooide toekomende tijd: ''ik zal opzoeken''.'
  ru.a1.unit30.lesson04.teach.dima_v_subbotu:
    title: Dima checkt het weer
    gloss: 'Dima: Zaterdag is het zonnig!'
    note: '*Солнечно* is een weerwoord. Je hebt geen werkwoord ''zijn'' nodig: *В субботу солнечно*.'
