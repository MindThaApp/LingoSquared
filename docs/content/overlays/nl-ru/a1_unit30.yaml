    title: Прогноз погоды en сообщение
    gloss: '*Прогноз погоды* bestaat uit twee woorden, en het tweede, *погоды*, staat in de genitief. *Сообщение* is een bericht dat je kunt versturen of lezen.'
    note: Koppelt het nieuwe woord aan het samengestelde zelfstandig naamwoord uit de weerles.
  ru.a1.unit30.lesson02.teach.nastya_otpravlyaet_soobshchenie:
    title: Nastya stuurt een bericht via de app
    gloss: Nastya stuurt een bericht via de app.
    note: '*Отправляет* (stuurt) is een regelmatig werkwoord. Het bericht is het lijdend voorwerp in de accusatief, en *через приложение* betekent ''via de app''.'
