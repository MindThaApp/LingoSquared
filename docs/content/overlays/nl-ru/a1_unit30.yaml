    title: Igor ziet het bericht
    gloss: 'Igor: Ik zie het bericht. Tot zaterdag!'
  ru.a1.unit30.lesson04.teach.ty_uzhe_znaesh:
    title: До + genitivus
    gloss: 'Je kent al *До свидания!* Je kunt ook een dag noemen: *До субботы!*, *До завтра!* Na *до* staat het zelfstandig naamwoord in de genitivus.'
    note: Breidt het afscheidspatroon uit de begroetingsles uit naar een bepaalde dag.
  ru.a1.unit30.lesson05.teach.nastya_kazhdyy_den:
    title: Wie gebruikt wat?
    gloss: Nastja belt elke dag met Dima. Ze gebruikt haar telefoon, geen app. Dima heeft thuis geen computer, maar hij gebruikt internet op zijn telefoon. Igor zoekt elke ochtend de weersverwachting op. Daarna gaat hij hardlopen. Lena stuurt Nastja vaak een bericht. Gebruik jij ook elke dag je telefoon?
    note: Vergelijkt hoe alle vier de personages hun apparaten gebruiken, net als de vergelijkende leestekst in de sportles.
