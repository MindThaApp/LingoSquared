    title: Igors plan
    gloss: 'Igor: Dan ga ik hardlopen. Daarna ga ik ook nog voetballen.'
    note: '*Потом* (daarna) plaatst het tweede plan na het eerste, en *побегаю* is voltooid: ''ik ga een tijdje hardlopen''.'
