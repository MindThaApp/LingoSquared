    title: спальня
    gloss: slaapkamer
    note: спальня betekent "slaapkamer". кровать betekent "bed".
    example_gloss: In de slaapkamer staat een bed.
  ru.a1.unit18.lesson02.teach.divan_v_gostinoy:
    title: Диван в гостиной.
    gloss: De bank staat in de woonkamer.
    note: диван betekent "bank"; гостиная betekent "woonkamer" (гостиной is de prepositivus na в, "in").
  ru.a1.unit18.lesson02.teach.stol_na_kuhne:
    title: на
    gloss: op / in
    note: Bij кухня gebruik je на (letterlijk "op de keuken") in plaats van в, anders dan bij de meeste kamers. Het betekent gewoon "in de keuken".
    example_gloss: De tafel staat in de keuken.
  ru.a1.unit18.lesson02.teach.vannaya:
    title: ванная
    gloss: badkamer
    note: ванная betekent "badkamer".
    example_gloss: De badkamer ligt naast de slaapkamer.
  ru.a1.unit18.lesson03.teach.dima_gde_ty_zhivyosh:
    title: Dima vraagt waar Nastya woont
    gloss: 'Dima: Nastya, waar woon jij?'
    note: Дима begint met Настя, где ты живёшь?
  ru.a1.unit18.lesson03.teach.nastya_zhivu_v_kvartire:
    title: Nastya zegt waar ze woont
    gloss: 'Nastja: Ik woon in een appartement.'
    note: Настя antwoordt Я живу в квартире; живу is de «ik»-vorm van жить («wonen») en в квартире is de locatiefvorm (prepositief) van квартира.
  ru.a1.unit18.lesson03.teach.dima_skolko_komnat:
    title: Dima vraagt hoeveel kamers er zijn
    gloss: 'Dima: Hoeveel kamers heeft het appartement?'
    note: 'Na Сколько («hoeveel») staat de genitief meervoud: сколько комнат.'
  ru.a1.unit18.lesson03.teach.nastya_dve_komnaty:
    title: Nastja somt de kamers op
    gloss: 'Nastja: Twee kamers: een slaapkamer en een woonkamer. Er is ook een keuken en een badkamer.'
    note: 'Настя gaat verder met Две комнаты: спальня и гостиная. Кухня и ванная тоже есть.'
