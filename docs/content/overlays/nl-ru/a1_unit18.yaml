    title: Это моя квартира.
    gloss: Dit is mijn appartement.
    note: Это betekent "dit is"; моя ("mijn", vrouwelijk) hoort bij het vrouwelijke woord квартира ("appartement").
  ru.a1.unit18.lesson01.teach.kuhnya:
