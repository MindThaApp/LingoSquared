teaching:
  ru.a1.unit13.lesson01.teach.vchera_byl:
    title: Вчера я был дома.
    gloss: Gisteren was ik thuis.
    note: вчера betekent „gisteren”; был is de mannelijke verleden tijd van „zijn”, gebruikt door een man.
  ru.a1.unit13.lesson01.teach.byla:
    title: была
    gloss: was (door een vrouw gezegd)
    note: была is de vrouwelijke verleden tijd van „zijn”; het werkwoord komt overeen met het geslacht van het onderwerp.
    example_gloss: Gisteren was ze thuis.
  ru.a1.unit13.lesson01.teach.vecherom:
    title: вечером
    gloss: '''s avonds'
    note: вечером betekent „'s avonds” en geeft preciezer aan wanneer iets in het verleden gebeurde.
    example_gloss: Gisterenavond was ik thuis.
  ru.a1.unit13.lesson02.teach.hodil_v_kino:
    title: Вчера я ходил в кино.
    gloss: Gisteren ben ik naar de bioscoop gegaan.
    note: ходил (mannelijk) is de verleden tijd van „gaan (te voet)” en wordt gebruikt voor een voltooide heen-en-terugtocht.
