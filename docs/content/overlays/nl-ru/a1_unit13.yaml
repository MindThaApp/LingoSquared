    gloss: keek naar een film
    note: смотрел (mannelijk) / смотрела (vrouwelijk) is de verleden tijd van „kijken”; фильм betekent „film”.
    example_gloss: Ik heb een film gekeken.
  ru.a1.unit13.lesson03.teach.nastya_chto_ty_delal:
    title: Nastya vraagt wat Dima deed
    gloss: 'Nastya: Wat heb je gisteren gedaan?'
