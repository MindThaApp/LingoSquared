    gloss: ging (door een vrouw gezegd)
    note: ходила is de vrouwelijke verleden tijd van „gaan (te voet)”.
    example_gloss: Gisteren is ze naar de bioscoop gegaan.
  ru.a1.unit13.lesson02.teach.smotrel_film:
