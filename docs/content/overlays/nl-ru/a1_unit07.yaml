teaching:
  ru.a1.unit07.lesson01.teach.menyu:
    title: меню
    gloss: menukaart
    note: меню is een onveranderlijk onzijdig woord, ontleend aan het Frans. Het verandert nooit van vorm.
    example_gloss: Hier is het menu.
  ru.a1.unit07.lesson01.teach.ofitsiant:
    title: официант, официантка
    gloss: ober, serveerster
    note: официант is mannelijk en официантка is vrouwelijk, volgens het gewone patroon van uitgangen naar geslacht.
    example_gloss: De serveerster werkt in een restaurant.
  ru.a1.unit07.lesson01.teach.stol_svoboden:
    title: Этот столик свободен?
    gloss: Is deze tafel vrij?
    note: столик is een verkleinwoord van стол ("tafel") dat vaak voor een tafeltje in een restaurant wordt gebruikt; свободен ("vrij") congrueert met het mannelijke woord.
  ru.a1.unit07.lesson01.teach.da_saditites:
    title: Да, садитесь, пожалуйста.
    gloss: Ja, gaat u zitten.
    note: садитесь is de beleefdheids- of meervoudsvorm van de gebiedende wijs van садиться ("gaan zitten"), gebruikt met вы.
  ru.a1.unit07.lesson01.teach.chto_budete_zakazyvat:
    title: Что будете заказывать?
    gloss: Wat wilt u bestellen?
    note: будете заказывать is een toekomende vorm ("gaat u bestellen") waarmee de ober vraagt wat de klant wil.
  ru.a1.unit07.lesson02.teach.ya_khochu:
    title: Я хочу ...
    gloss: Ik wil ...
    note: хочу is de eerste persoon enkelvoud van хотеть ("willen"), gebruikt om eten en drinken te bestellen.
  ru.a1.unit07.lesson02.teach.chay_kofe:
    title: чай, кофе
    gloss: thee, koffie
    note: Zowel чай als кофе zijn veelbesteld drankjes; кофе is onveranderlijk en grammaticaal mannelijk, ondanks de uitgang -е.
    example_gloss:
    - Ik wil thee.
    - Ik wil koffie.
  ru.a1.unit07.lesson02.teach.khleb_borshch:
    title: хлеб, борщ
    gloss: brood, borsjtsj (bietensoep)
    note: борщ is de klassieke Russische bietensoep; beide woorden zijn mannelijk.
    example_gloss:
    - Hebt u brood?
    - Ik wil borsjtsj.
  ru.a1.unit07.lesson02.teach.salat:
    title: салат
    gloss: salade
    note: и ("en") verbindt hier twee bestelde gerechten, zoals in борщ и салат.
    example_gloss: Ik wil borsjtsj en salade.
  ru.a1.unit07.lesson03.teach.morozhenoe:
    title: мороженое
    gloss: ijs
    note: мороженое is een onzijdig woord dat op een bijvoeglijk naamwoord lijkt ("bevroren [ding]"), een veelvoorkomend patroon bij Russische etenswoorden.
    example_gloss: Breng als dessert ijs.
  ru.a1.unit07.lesson03.teach.prinesite:
    title: Принесите, пожалуйста, ...
    gloss: Breng alstublieft ...
    note: Принесите is de beleefdheids- of meervoudsvorm van de gebiedende wijs van принести ("brengen"), gebruikt met вы.
  ru.a1.unit07.lesson03.teach.spasibo:
    title: Спасибо.
    gloss: Dank u.
    note: Спасибо is de standaardmanier om bedankt te zeggen in elk beleefd gesprek.
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_budete:
    title: De serveerster vraagt wat je wilt bestellen
    gloss: 'Serveerster: Wat wilt u bestellen?'
    note: De serveerster begint met de vraag Что будете заказывать?
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_borshch:
    title: De toerist bestelt eten
    gloss: 'Toerist: Ik wil borsjtsj en salade.'
    note: Турист ("toerist") antwoordt met Я хочу борщ и салат.
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_pit:
    title: De serveerster vraagt naar drinken
    gloss: 'Serveerster: Wat wilt u drinken?'
    note: пить ("drinken") staat bij будете, net als de eerdere vraag met заказывать.
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_chay:
    title: De toerist bestelt een drankje
    gloss: 'Toerist: Ik wil thee.'
    note: De toerist antwoordt eenvoudig met Я хочу чай.
  ru.a1.unit07.lesson03.teach.ofitsiantka_a_na_sladkoe:
    title: De serveerster vraagt naar het dessert
    gloss: 'Serveerster: En als dessert?'
    note: А на сладкое? is een korte vervolgvraag, letterlijk "en voor het zoete [gerecht]?"
  ru.a1.unit07.lesson03.teach.turist_na_sladkoe:
    title: De toerist bestelt een dessert
    gloss: 'Toerist: Breng als dessert ijs, alstublieft.'
    note: De toerist antwoordt met На сладкое принесите мороженое, пожалуйста.
  ru.a1.unit07.lesson03.teach.ofitsiantka_khorosho:
    title: De serveerster bevestigt de bestelling
    gloss: 'Serveerster: Goed. Dank u.'
    note: Хорошо ("goed, oké") bevestigt de bestelling en Спасибо sluit het gesprek beleefd af.
