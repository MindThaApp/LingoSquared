teaching:
  ru.a1.unit05.lesson01.teach.kotoryy_chas:
    title: Который час?
    gloss: Hoe laat is het?
    note: De standaardmanier om naar de tijd te vragen, letterlijk "welk uur".
  ru.a1.unit05.lesson01.teach.seychas_chas:
    title: Сейчас час.
    gloss: Het is nu één uur.
    note: Alleen "час" betekent "één uur". Het Russisch zegt hier niet "один час", anders dan bij het patroon van de getallen vanaf 2.
    example_gloss: Hoe laat is het? — Het is één uur.
  ru.a1.unit05.lesson01.teach.dva_tri_chasa:
    title: два часа, три часа
    gloss: twee uur, drie uur
    note: 'Na два en три staat час in de genitief enkelvoud: часа, net als bij het patroon van getal en zelfstandig naamwoord uit Les 3.'
    example_gloss:
    - Het is nu twee uur.
    - Het is nu drie uur.
  ru.a1.unit05.lesson01.teach.pyat_desyat_chasov:
    title: пять часов, десять часов
    gloss: vijf uur, tien uur
    note: 'Vanaf пять staat час in de genitief meervoud: часов, weer volgens het patroon van 5 en hoger uit Les 3.'
    example_gloss:
    - Het is nu vijf uur.
    - Het is nu tien uur.
  ru.a1.unit05.lesson02.teach.v_kotorom_chasu:
    title: В котором часу?
    gloss: Hoe laat?
    note: Gebruik je om te vragen wanneer iets gebeurt, anders dan Который час?, dat alleen naar de huidige tijd vraagt.
  ru.a1.unit05.lesson02.teach.utrom_dnem:
    title: утром, днём
    gloss: '''s ochtends, overdag'
    note: Dit zijn bijwoordvormen (instrumentalis) van утро en день, zonder voorzetsel gebruikt.
    example_gloss:
    - '''s Ochtends drink ik koffie.'
    - Overdag werk ik.
  ru.a1.unit05.lesson02.teach.vecherom_nochyu:
    title: вечером, ночью
    gloss: '''s avonds, ''s nachts'
    note: Hetzelfde patroon van instrumentalis-bijwoorden als утром/днём.
    example_gloss:
    - '''s Avonds ben ik thuis.'
    - '''s Nachts slaap ik.'
  ru.a1.unit05.lesson02.teach.v_dva_chasa_dnya:
    title: В два часа дня.
    gloss: Om twee uur 's middags.
    note: дня (genitief van день) achter het uur maakt duidelijk dat het twee uur 's middags is, niet twee uur 's nachts.
    example_gloss: Hoe laat is de afspraak? — Om twee uur 's middags.
  ru.a1.unit05.lesson02.teach.v_sem_chasov_vechera:
    title: В семь часов вечера.
    gloss: Om zeven uur 's avonds.
    note: вечера (genitief van вечер) maakt duidelijk dat het zeven uur 's avonds is.
    example_gloss: De winkel sluit om zeven uur 's avonds.
  ru.a1.unit05.lesson03.teach.skazhite_pozhaluysta:
    title: Скажите, пожалуйста, который час?
    gloss: Pardon, kunt u me zeggen hoe laat het is?
    note: Скажите, пожалуйста maakt de vraag beleefder, passend als je een vreemde aanspreekt.
  ru.a1.unit05.lesson03.teach.kogda_otkhodit:
    title: Когда отходит поезд?
    gloss: Wanneer vertrekt de trein?
    note: Отходит ("vertrekt") is het gebruikelijke werkwoord voor een trein of bus die van een station vertrekt.
  ru.a1.unit05.lesson03.teach.passazhir_vopros:
    title: De passagier vraagt hoe laat het is
    gloss: 'Passagier: Pardon, kunt u me zeggen hoe laat het is?'
    note: De passagier begint beleefd met Скажите, пожалуйста, passend om stationspersoneel aan te spreken.
  ru.a1.unit05.lesson03.teach.kassir_sem:
    title: De medewerker antwoordt
    gloss: 'Medewerker: Het is zeven uur ''s ochtends.'
    note: Сейчас семь часов утра geeft de huidige tijd aan, met утра ("'s ochtends") voor duidelijkheid.
  ru.a1.unit05.lesson03.teach.passazhir_kogda:
    title: De passagier vraagt naar de trein
    gloss: 'Passagier: En wanneer vertrekt de trein?'
    note: А leidt de vervolgvraag van de passagier soepel in.
  ru.a1.unit05.lesson03.teach.kassir_vosem:
    title: De medewerker noemt het vertrektijdstip
    gloss: 'Medewerker: Om acht uur ''s ochtends.'
    note: В восемь часов утра antwoordt met het voorzetsel в plus het uur en het dagdeel.
