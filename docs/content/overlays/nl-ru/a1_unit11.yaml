    title: Maria beschrijft haar ochtend
    gloss: 'Maria: Ik sta om zeven uur op, daarna ontbijt ik om acht uur.'
    note: Мария noemt twee handelingen na elkaar, verbonden door потом ("daarna").
  ru.a1.unit11.lesson03.teach.oleg_kogda_rabotayete:
