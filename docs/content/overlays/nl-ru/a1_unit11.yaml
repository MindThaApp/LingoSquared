    example_gloss: Ik ga om elf uur naar bed.
  ru.a1.unit11.lesson03.teach.oleg_chto_delayete:
    title: Oleg vraagt naar de ochtend
    gloss: 'Oleg: Wat doet u ''s ochtends?'
    note: Олег begint met Что вы делаете утром?
