    title: встаю
    gloss: ik sta op
    note: встаю is de eerste persoon enkelvoud van вставать ("opstaan"); встаёте is de вы-vorm waarmee je het aan iemand anders vraagt.
    example_gloss: Ik sta om zeven uur op.
  ru.a1.unit11.lesson01.teach.zavtrakayu:
    title: завтракаю
    gloss: ik ontbijt
    note: завтракаю is de eerste persoon enkelvoud van завтракать ("ontbijten").
    example_gloss: Ik ontbijt om acht uur.
  ru.a1.unit11.lesson01.teach.kogda:
    title: Когда вы встаёте?
    gloss: Wanneer staat u op?
    note: Когда betekent "wanneer"; вы is het beleefde of meervoudige "u/jullie".
  ru.a1.unit11.lesson02.teach.rabotayu:
    title: работаю
    gloss: ik werk
    note: работаю is de eerste persoon enkelvoud van работать ("werken"); с ... до ... betekent "van ... tot ..." bij een tijdsduur.
    example_gloss: Ik werk van negen tot vijf.
  ru.a1.unit11.lesson02.teach.uzhinayu:
    title: ужинаю
    gloss: ik eet 's avonds
    note: ужинаю is de eerste persoon enkelvoud van ужинать ("avondeten"); вечером betekent "'s avonds".
    example_gloss: '''s Avonds eet ik.'
  ru.a1.unit11.lesson02.teach.lozhus_spat:
    title: ложусь спать
    gloss: ik ga naar bed
