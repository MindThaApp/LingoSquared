teaching:
  ru.a1.unit25.lesson01.teach.chitat_zanimatsya_sportom:
    title: Lezen, sporten, koken
    gloss: lezen, sporten, koken
    note: 'Drie veelgebruikte hobbywerkwoorden: *читать* (lezen), *заниматься спортом* (sporten) en *готовить* (koken).'
    example_gloss:
    - Ik lees graag een boek.
    - Ik sport op zaterdag.
    - Ik kook graag voor vrienden.
  ru.a1.unit25.lesson01.teach.svobodnoe_vremya:
    title: Vrije tijd
    gloss: vrije tijd
    note: '*Свободное время* is de sleuteluitdrukking om over hobby''s te praten. Het adjectief *свободное* eindigt op *-ое* omdat het bij *время* past.'
    example_gloss: In mijn vrije tijd lees ik graag.
  ru.a1.unit25.lesson01.teach.v_svobodnoe_vremya:
    title: Zeggen wat je in je vrije tijd doet
    gloss: In mijn vrije tijd lees ik graag.
    note: '*Люблю* is de *я*-vorm van *любить* (houden van, graag doen). Het tweede werkwoord blijft daarna in de infinitief: *люблю читать*.'
  ru.a1.unit25.lesson02.teach.slushat_muzyku_risovat:
    title: Muziek, tekenen, gamen
    gloss: naar muziek luisteren, tekenen, gamen
    note: 'Nog drie hobby''s: *слушать музыку* (naar muziek luisteren), *рисовать* (tekenen) en *играть в игры* (games spelen).'
    example_gloss:
    - Ik luister graag naar muziek.
    - Ik teken vaak.
    - Ik game graag met vrienden.
  ru.a1.unit25.lesson02.teach.ya_lyublyu_slushat:
    title: Zeggen dat je graag naar muziek luistert
    gloss: Ik luister graag naar muziek.
    note: '*Слушать* heeft direct een lijdend voorwerp: *музыку* is de accusatief van *музыка*, met de uitgang *-у*.'
  ru.a1.unit25.lesson02.teach.ya_lyublyu_igrat:
    title: Zeggen dat je graag met vrienden gamet
    gloss: Ik game graag met vrienden.
    note: '*С друзьями* (met vrienden): na het voorzetsel *с* volgt de instrumentalis, dus *друзьями*.'
  ru.a1.unit25.lesson03.teach.vsegda_chasto_inogda:
    title: Altijd, vaak, soms, nooit
    gloss: altijd, vaak, soms, nooit
    note: 'De vier belangrijkste bijwoorden van frequentie: *всегда*, *часто*, *иногда*, *никогда*. Ze veranderen nooit van vorm.'
    example_gloss:
    - Ik sport altijd op zaterdag.
    - Ik lees vaak een boek.
    - Ik teken soms.
    - Ik game nooit.
  ru.a1.unit25.lesson03.teach.kazhduyu_nedelyu_kazhdye:
    title: Elke week, elk weekend
    gloss: elke week, elk weekend
    note: '*Каждую неделю* en *каждые выходные* betekenen allebei ''elke'', maar de uitgang volgt het zelfstandig naamwoord: zie de volgende kaart.'
    example_gloss:
    - Ik kook elke week voor vrienden.
    - Ik sport elk weekend.
  ru.a1.unit25.lesson03.teach.nedelya_zhenskogo_roda:
    title: 'Elke: vrouwelijk en meervoud'
    gloss: '*Неделя* is vrouwelijk, dus: *каждую неделю*. *Выходные* is meervoud, dus: *каждые выходные*.'
    note: '*Каждый* past zich aan het zelfstandig naamwoord aan, zoals elk adjectief: *каждый день* (mannelijk), *каждую неделю* (vrouwelijk, accusatief), *каждые выходные* (meervoud).'
  ru.a1.unit25.lesson03.teach.chto_ty_delaesh:
    title: Vragen naar vrije tijd
    gloss: Wat doe je in je vrije tijd?
    note: 'Dit is de kernvraag van deze unit: gebruik hem om iedereen naar zijn of haar hobby''s te vragen.'
  ru.a1.unit25.lesson04.teach.nastya_my_chasto:
    title: Nastja begint over hobby's
    gloss: 'Nastja: We gaan vaak samen wandelen. Maar wat doe jij nog meer in je vrije tijd, Dima?'
    note: '*Мы часто гуляем вместе*: bij *мы* (wij) hoort de werkwoordsuitgang *-ем*, en *гулять* betekent voor je plezier wandelen.'
  ru.a1.unit25.lesson04.teach.dima_ya_lyublyu:
    title: Dima's hobby's
    gloss: 'Dima: Ik kook graag, ook thuis. En ik sport ook vaak.'
    note: '*И дома тоже* (ook thuis): *и ... тоже* laat zien dat Dima voor zijn plezier kookt, niet alleen op zijn werk.'
  ru.a1.unit25.lesson04.teach.nastya_ty_i:
    title: Nastja is verrast
    gloss: 'Nastja: Kook je ook thuis? Je kookt toch al de hele dag op je werk!'
    note: '*Весь день* (de hele dag) benadrukt hoeveel Dima al op zijn werk kookt. *Весь* past zich aan het mannelijke *день* aan.'
  ru.a1.unit25.lesson04.teach.dima_da_no:
    title: Dima legt uit
    gloss: 'Dima: Ja, maar koken ontspant me. En jij, wat doe jij graag?'
    note: '*Готовить меня расслабляет* zet de activiteit voorop: letterlijk ''koken ontspant mij'', met *меня* in de accusatief.'
  ru.a1.unit25.lesson04.teach.nastya_ya_lyublyu:
    title: Nastja's hobby's
    gloss: 'Nastja: Ik lees graag en luister vaak naar muziek.'
    note: 'Twee hobbywerkwoorden uit eerdere lessen worden met *и* (en) verbonden: *люблю читать и часто слушаю музыку*.'
  ru.a1.unit25.lesson04.teach.dima_ty_tozhe:
    title: Dima vraagt naar gamen
    gloss: 'Dima: Game jij ook?'
    note: 'Een korte ja/nee-vraag: in het Russisch blijft de woordvolgorde gelijk en gaat alleen de intonatie omhoog: *Ты тоже играешь в игры?*'
  ru.a1.unit25.lesson04.teach.nastya_net_ya:
    title: Nastja antwoordt
    gloss: 'Nastja: Nee, ik game nooit. Maar ik teken soms wel!'
    note: Bij *никогда не* (nooit) hoort altijd een extra *не* vóór het werkwoord. *Иногда* (soms) vormt het contrast.
  ru.a1.unit25.lesson05.teach.my_s_dimoy:
    title: Hobby's vergelijken
    gloss: Dima en ik gaan vaak samen wandelen. Maar we hebben ook andere hobby's. Dima kookt graag, ook thuis, en sport vaak. Ik lees graag en luister vaak naar muziek. Ik teken soms, maar ik game nooit. Wat doe jij graag in je vrije tijd?
    note: Nastja's bericht herhaalt wat eerder is verteld en eindigt met de kernvraag van deze unit aan de lezer.
    glosses:
      гуляем: wandelen
      часто: vaak
      вместе: samen
      другие: andere
      готовить: kookt
      любит: graag
      дома: thuis
      занимается: sport
      читать: lees
      слушаю: luister
      музыку: muziek
      рисую: teken
      иногда: soms
      играю: videogames spelen
      никогда: nooit
      свободное: vrij
      время: tijd
  ru.a1.unit25.lesson06.teach.dima_chto_ty:
    title: Dima vraagt naar het weekend
    gloss: 'Dima: Wat doe je dit weekend?'
    note: '*В эти выходные* (dit weekend): *выходные* is meervoud, dus *эти* ook, en *в* bij een tijdsaanduiding vraagt de accusatief.'
  ru.a1.unit25.lesson06.teach.nastya_poka_ne:
    title: Nastja twijfelt
    gloss: 'Nastja: Ik weet het nog niet. Ik lees graag, maar ik wil ook naar buiten.'
    note: '*Хочу ещё выйти на улицу* betekent ''ik wil ook naar buiten''. *Хочу* is de *я*-vorm van *хотеть*.'
  ru.a1.unit25.lesson06.teach.dima_davay_pogulyaem:
    title: Dima doet een voorstel
    gloss: 'Dima: Zullen we samen gaan wandelen? Daarna kook ik voor ons.'
    note: '*Давай погуляем* is de gebruikelijke manier om voor te stellen iets samen te doen, en *потом* (daarna) zet de volgende stap in volgorde.'
  ru.a1.unit25.lesson06.teach.nastya_khoroshaya_ideya:
    title: Nastja stemt in
    gloss: 'Nastja: Goed idee! Ik vind zowel wandelen als koken leuk.'
    note: '*Мне нравится* betekent letterlijk ''mij is aangenaam'': de persoon staat in de datief (*мне*) en daarna volgt wat je leuk vindt.'
  ru.a1.unit25.lesson06.teach.dima_otlichno_togda:
    title: Dima bevestigt
    gloss: 'Dima: Prima. Dan zie ik je zaterdag!'
    note: '*Увидимся в субботу* (tot zaterdag): *в* met een weekdag vraagt de accusatief, dus *суббота* wordt *субботу*.'
