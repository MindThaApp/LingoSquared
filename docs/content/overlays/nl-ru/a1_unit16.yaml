teaching:
  ru.a1.unit16.lesson01.teach.u_menya_bolit_golova:
    title: У меня болит голова.
    gloss: Mijn hoofd doet pijn.
    note: у меня betekent „ik heb” (letterlijk „bij mij”); болит betekent „doet pijn” en staat in het enkelvoud, passend bij een enkelvoudig onderwerp als голова (hoofd).
  ru.a1.unit16.lesson01.teach.zhivot:
    title: живот
    gloss: buik
    note: живот betekent „buik”. Gebruik hetzelfde patroon у меня болит... met elk lichaamsdeel.
    example_gloss: Mijn buik doet pijn.
  ru.a1.unit16.lesson01.teach.gorlo:
    title: горло
    gloss: keel
    note: горло betekent „keel”.
    example_gloss: Mijn keel doet pijn.
  ru.a1.unit16.lesson02.teach.u_menya_temperatura:
    title: У меня температура.
    gloss: Ik heb koorts.
    note: температура betekent letterlijk „temperatuur”, maar is in het Russisch de gewone manier om „koorts” te zeggen.
  ru.a1.unit16.lesson02.teach.prostuda:
    title: простуда
    gloss: een verkoudheid
    note: простуда betekent „een verkoudheid” (de ziekte). Met у меня простуда zeg je „Ik ben verkouden.”
    example_gloss: Ik ben verkouden.
  ru.a1.unit16.lesson02.teach.mne_ploho:
    title: Мне плохо.
    gloss: Ik voel me niet lekker.
    note: Мне плохо is een algemene manier om te zeggen dat je je niet goed voelt, zonder een bepaalde klacht te noemen.
  ru.a1.unit16.lesson03.teach.dima_zdravstvuyte_bolit:
    title: Дима begroet de dokter
    gloss: 'Dima: Goedendag! Mijn hoofd en keel doen pijn.'
    note: Дима begint met het formele Здравствуйте!, omdat de dokter een vreemde is.
  ru.a1.unit16.lesson03.teach.doktor_chto_u_vas_bolit:
    title: De dokter vraagt wat pijn doet
    gloss: 'Dokter: Wat doet er pijn? Uw hoofd en keel?'
    note: De dokter gebruikt het formele вас („u”, ook meervoud) in plaats van het informele тебя („jou”).
  ru.a1.unit16.lesson03.teach.dima_da_i_eshchyo_temperatura:
    title: Dima noemt nog een klacht
    gloss: 'Dima: Ja, en ook koorts.'
    note: ещё betekent „ook / nog” — met и ещё... voeg je nog iets toe aan wat je net zei.
  ru.a1.unit16.lesson03.teach.doktor_vam_nuzhno_otdyhat:
    title: De dokter geeft advies
    gloss: 'Dokter: U moet rusten en veel water drinken.'
    note: Вам нужно + infinitief betekent „u moet...”; вам is de formele datief van „u”.
