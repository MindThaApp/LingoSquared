teaching:
  ru.a1.unit10.lesson01.teach.kak_doyti:
    title: Как дойти до...?
    gloss: Hoe kom ik bij...?
    note: Как дойти до...? is de standaard beleefde manier om een vreemde de weg naar een plek te vragen, gevolgd door de bestemming in de genitief.
  ru.a1.unit10.lesson01.teach.muzeya:
    title: музей
    gloss: museum
    note: музей is mannelijk; музея is de genitief, die na до ("naar/tot") wordt gebruikt.
    example_gloss: Hoe kom ik bij het museum?
  ru.a1.unit10.lesson01.teach.pryamo:
    title: прямо
    gloss: rechtdoor
    note: прямо geeft aan dat je rechtdoor gaat; Идите is de beleefde gebiedende wijs van "gaan".
    example_gloss: Ga rechtdoor.
  ru.a1.unit10.lesson01.teach.napravo:
    title: направо
    gloss: naar rechts
    note: направо geeft de bewegingsrichting aan (naar rechts afslaan); потом betekent "dan".
    example_gloss: Ga rechtdoor en dan naar rechts.
  ru.a1.unit10.lesson02.teach.nalevo:
    title: налево
    gloss: naar links
    note: налево geeft de bewegingsrichting aan, het spiegelbeeld van направо.
    example_gloss: Ga linksaf.
  ru.a1.unit10.lesson02.teach.povernite:
    title: поверните
    gloss: ga om, sla af (beleefde opdracht)
    note: поверните is de beleefde gebiedende wijs van повернуть ("afslaan"); за углом betekent "om de hoek".
    example_gloss: Ga om de hoek linksaf.
  ru.a1.unit10.lesson02.teach.kvartal_daleko:
    title: квартал, далеко
    gloss: huizenblok, ver
    note: квартал is een huizenblok (квартала na два); далеко betekent "ver" en отсюда betekent "vanaf hier".
    example_gloss:
    - Ga twee blokken door.
    - Is dat ver van hier?
  ru.a1.unit10.lesson03.teach.tourist_prostite:
    title: De toerist vraagt de weg
    gloss: 'Toerist: Pardon, hoe kom ik bij het museum?'
    note: Турист begint met Простите ("pardon") voordat hij vraagt Как дойти до музея?
  ru.a1.unit10.lesson03.teach.prokhozhiy_eto_prosto:
    title: De voorbijganger wijst de weg
    gloss: 'Voorbijganger: Dat is heel eenvoudig. Ga twee blokken rechtdoor en sla dan rechtsaf.'
    note: Прохожий antwoordt met Это очень просто, gevolgd door een route in twee stappen met Идите en поверните.
  ru.a1.unit10.lesson03.teach.tourist_daleko:
    title: De toerist vraagt of het ver is
    gloss: 'Toerist: Is dat ver van hier?'
    note: Это далеко отсюда? is een vervolgvraag om de loopafstand te checken.
  ru.a1.unit10.lesson03.teach.prokhozhiy_pyat_minut:
    title: De voorbijganger schat de tijd in
    gloss: 'Voorbijganger: Nee, vijf minuten lopen.'
    note: Прохожий antwoordt met Нет, пять минут пешком ("te voet").
  ru.a1.unit10.lesson03.teach.tourist_spasibo:
    title: De toerist bedankt de voorbijganger
    gloss: 'Toerist: Hartelijk bedankt.'
    note: Спасибо большое sluit het gesprek beleefd af.
  ru.a1.unit10.lesson03.teach.prokhozhiy_pozhaluysta:
    title: De voorbijganger antwoordt
    gloss: 'Voorbijganger: Graag gedaan.'
    note: Пожалуйста is het antwoord op спасибо, zoals "graag gedaan".
