answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's new verbs are all first-person singular (mă trezesc, mănânc, beau, lucrez, merg, mă culc) and are register-neutral -- Romanian's first-person verb form is the same regardless of tu/dumneavoastră, and this unit introduces no second-person forms. Ana and Mihai's closing dialogue keeps their existing polite register with each other, matching 6단원/unit07/unit08/unit09.
course:
  title: 한국어로 배우는 루마니아어 A1
  description: 루마니아어로 간단한 하루 일과 말하기 -- mă trezesc(일어나요), mănânc / beau(먹어요 / 마셔요), lucrez(일해요), merg acasă(집에 가요), mă culc(자러 가요) -- Ana가 Mihai에게 하루에 대해 묻는 이야기가 이어져요.
units:
  ro.a1.unit10.routines:
    title: 하루 일과
lessons:
  ro.a1.unit10.lesson01.dimineata:
    title: 아침에
  ro.a1.unit10.lesson02.lucrez_merg_acasa:
    title: 일하고 집에 가요
  ro.a1.unit10.lesson03.rutina_mihai:
    title: Mihai의 하루 일과
teaching:
  ro.a1.unit10.lesson01.teach.reminder_dimineata_seara_noaptea_cafea_paine:
    title: '복습: dimineața, seara, noaptea, cafea, pâine'
    gloss: 아침에 · 저녁에 · 밤에 · 커피 · 빵
    note: 모두 이미 배운 표현이에요 -- dimineața/seara/noaptea는 4단원부터, cafea/pâine은 6단원부터 나왔어요. 여기서는 이 단원의 하루 일과 문장 속에서 함께 쓰여요.
  ro.a1.unit10.lesson01.teach.ma_trezesc_vocab:
    title: 일어나요
    gloss: 일어나요
    note: '*Mă*는 *mă numesc*/*mă cheamă*에서 이미 본 재귀 대명사예요. 루마니아어는 ''일어나다''를 재귀 동사로 나타내서, 문자 그대로는 ''나 자신을 깨워요''라는 뜻이에요.'
    example_gloss:
    - 저는 아침에 일어나요.
  ro.a1.unit10.lesson01.teach.ma_trezesc_phrase:
    title: 아침에 일어나요
    gloss: 저는 아침에 일어나요.
    note: 짧고 완전한 문장이에요 -- 가장 간단한 하루 일과 문장이에요.
  ro.a1.unit10.lesson01.teach.mananc_vocab:
    title: 먹어요
    gloss: Mănânc (저는 먹어요)
    note: '''나는'' 같은 주어 대명사는 필요 없어요. 루마니아어는 동사 어미만 봐도 누가 말하는지 알 수 있어요. *vreau*, *cumpăr*, *aș dori*에서 이미 본 것과 같은 방식이에요.'
    example_gloss:
    - 저는 아침에 빵을 먹어요.
  ro.a1.unit10.lesson01.teach.beau_vocab:
    title: 마셔요
    gloss: Beau (저는 마셔요)
    note: 이미 배운 *cafea*, *ceai* 같은 음료와 자연스럽게 어울려요.
    example_gloss:
    - 저는 아침에 커피를 마셔요.
  ro.a1.unit10.lesson01.teach.mananc_beau_phrase:
    title: 저는 아침에 빵을 먹고 커피를 마셔요
    gloss: Mănânc pâine și beau cafea dimineața. (저는 아침에 빵을 먹고 커피를 마셔요.)
    note: '*și*(그리고)로 두 행동을 이어요. 4단원의 *ora unu și jumătate*에서 이미 본 표현이에요.'
  ro.a1.unit10.lesson02.teach.lucrez_vocab:
    title: 일해요
    gloss: Lucrez (저는 일해요)
    note: '*lucrează*의 1인칭 형태예요. 4단원에서 미하이가 저녁에 일한다고 말할 때 이미 나왔어요.'
    example_gloss:
    - 저는 저녁에 일해요.
  ro.a1.unit10.lesson02.teach.lucrez_phrase:
    title: 저는 저녁에 일해요
    gloss: Lucrez seara. (저는 저녁에 일해요.)
    note: 언제 일하는지 말하는 짧고 완전한 문장이에요.
  ro.a1.unit10.lesson02.teach.merg_vocab:
    title: 가요
    gloss: Merg (저는 가요)
    note: 앞에서 배운 명령형 *mergeți*의 1인칭 형태예요. 같은 동사이고 인칭만 달라요.
    example_gloss:
    - 저는 집에 가요.
  ro.a1.unit10.lesson02.teach.acasa_vocab:
    title: 집
    gloss: Acasă (집, 집으로)
    note: 전치사 없이 써요. *merg acasă*라고 하고 *merg la acasă*라고는 하지 않아요. 한국어에서 '집으로'를 '집에'처럼 간단히 말하는 것과 비슷하게 acasă 자체에 방향의 뜻이 들어 있어요.
    example_gloss:
    - 저는 밤에 집에 가요.
  ro.a1.unit10.lesson02.teach.merg_acasa_phrase:
    title: 저는 밤에 집에 가요
    gloss: Merg acasă noaptea. (저는 밤에 집에 가요.)
    note: 짧고 완전한 문장이에요. 하루 일과를 마치는 자연스러운 표현이에요.
  ro.a1.unit10.lesson02.teach.lucrez_merg_phrase:
    title: 저는 저녁에 일하고 밤에 집에 가요
    gloss: Lucrez seara și merg acasă noaptea. (저는 저녁에 일하고 밤에 집에 가요.)
    note: 이 수업의 두 문장을 *și*로 이어서 한 문장으로 만들었어요.
  ro.a1.unit10.lesson03.teach.reminder_cursul_incepe_ora_apoi:
    title: '복습: cursul, începe, la ora nouă, apoi'
    gloss: cursul (수업) · începe (시작해요) · la ora nouă (9시에) · apoi (그다음에)
    note: Cursul/începe/la ora nouă는 4단원에서 이미 나왔어요(미하이의 수업은 아침 9시에 시작해요). apoi는 9단원에서 나왔어요. 여기서는 이 표현들을 합쳐 미하이의 일과를 말해요.
  ro.a1.unit10.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: '복습: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (안녕하세요) · mulțumesc (고맙습니다) · la revedere (안녕히 가세요) · da (네) · Ana, Mihai (이름)
    note: 모두 앞 단원에서 이미 배운 표현이에요. 여기서는 아나가 미하이에게 하루 일과를 물어봐요.
  ro.a1.unit10.lesson03.teach.ma_culc_vocab:
    title: 자러 가요
    gloss: Mă culc (저는 자요)
    note: '*mă trezesc*와 같은 또 하나의 재귀 동사예요. 직역하면 ''나를 눕혀요''라는 뜻이에요.'
    example_gloss:
    - 저는 밤에 자요.
  ro.a1.unit10.lesson03.teach.ma_culc_phrase:
    title: 저는 밤에 자요
    gloss: Mă culc noaptea. (저는 밤에 자요.)
    note: '*mă trezesc dimineața*로 시작한 일과를 마무리하는 하루의 자연스러운 끝이에요.'
  ro.a1.unit10.lesson03.teach.line01:
    title: 인사하고 수업이 언제 시작하는지 묻기
    gloss: 아나가 미하이에게 인사하고 수업이 언제 시작하는지 물어요.
    note: 4단원에서 나온 미하이의 수업에 관한 질문을 다시 써요.
  ro.a1.unit10.lesson03.teach.line02:
    title: 수업 시간으로 대답하기
    gloss: 미하이가 수업이 아침 9시에 시작한다고 말해요.
    note: 4단원에서 미하이가 한 대답과 똑같아요. 여기서는 더 긴 하루 일과의 일부로 다시 나와요.
  ro.a1.unit10.lesson03.teach.line03:
    title: 저녁에 대해 묻기
    gloss: 아나가 짧게 되물어요. '저녁에는요?'
    note: 새로운 의문사 없이 일과를 더 물어볼 수 있는 자연스럽고 간단한 방법이에요.
  ro.a1.unit10.lesson03.teach.line04:
    title: 하루의 나머지 설명하기
    gloss: 미하이가 저녁에 일하고 그다음 밤에 잔다고 말해요.
    note: 이 단원의 *lucrez*와 *mă culc*를 *apoi*로 이었어요. 미하이가 저녁에 일한다는 4단원의 내용과도 맞아요.
  ro.a1.unit10.lesson03.teach.line05:
    title: 감사 인사로 마무리하기
    gloss: 아나가 '좋아요!'라고 말하고 미하이에게 고맙다고 한 뒤 작별 인사를 해요.
    note: 1단원, 8단원, 9단원의 대화에서 썼던 것과 같은 마무리 감사 인사예요.
  ro.a1.unit10.lesson03.teach.line06:
    title: 만남 마무리하기
    gloss: 미하이가 아나의 이름을 부르며 작별 인사에 답해요.
    note: 앞의 모든 단원의 대화가 끝날 때 썼던 것과 같은 친근한 마무리 표현이에요.
