answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (mic/mică, mai, decât) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing polite register with each other, matching every earlier unit; no new second-person form is introduced here (unlike 13단원's Vă place...?).
course:
  title: 한국어로 배우는 루마니아어 A1
  description: 루마니아어로 익숙한 것들을 비교해요 -- Mare(큰), Mic/Mică(작은), 그리고 Mai ... decât(~보다 더 ~한) 비교 구문을 배워요. 아나와 미하이가 커피, 차, 빵의 크기를 비교해요.
units:
  ro.a1.unit14.comparisons:
    title: 비교하기
lessons:
  ro.a1.unit14.lesson01.mare_mic:
    title: 큰, 작은
  ro.a1.unit14.lesson02.mai_mare_mai_mica:
    title: 더 큰 것, 더 작은 것
  ro.a1.unit14.lesson03.cafeaua_mai_mare:
    title: 어느 쪽이 더 클까요?
teaching:
  ro.a1.unit14.lesson01.teach.reminder_mare:
    title: '복습: mare'
    gloss: mare (큰)
    note: 3단원("literă mare", 대문자)과 5단원("o familie mare", 대가족)에서 이미 나왔어요. 여기서는 짝이 되는 *mic/mică*와 함께 비교에 쓰여요.
  ro.a1.unit14.lesson01.teach.reminder_cafeaua_ceaiul_painea:
    title: '복습: cafeaua, ceaiul, pâinea, cafea, ceai'
    gloss: cafeaua (그 커피) · ceaiul (그 차) · pâinea (그 빵) · cafea (커피) · ceai (차)
    note: 모두 6단원과 13단원에서 나온 말이에요. 이 단원에서는 관사가 붙은 형태를 크기를 비교하는 대상으로 쓰고, 이 과의 짝짓기 문제에서 관사 없는 형태도 다시 써요.
  ro.a1.unit14.lesson01.teach.mic_mica_vocab:
    title: 작은
    gloss: Mic (작은, 남성/중성) · Mică (작은, 여성)
    note: 루마니아어 형용사는 꾸미는 명사에 맞춰 형태가 바뀌어요. *ceai*(차)는 남성/중성형 *mic*을 쓰고, *cafea*(커피)와 *pâine*(빵)은 여성이라서 *mică*를 써요. *Mare*(큰)는 단수에서 남성과 여성의 형태가 같기 때문에 이런 구분이 필요 없었어요.
    example_gloss:
    - 차는 작아요.
    - 커피는 작아요.
  ro.a1.unit14.lesson01.teach.ceaiul_e_mic_phrase:
    title: 차는 작아요
    gloss: Ceaiul e mic. (차는 작아요.)
    note: '*Ceaiul*은 중성이라서 남성/중성형 *mic*을 써요.'
  ro.a1.unit14.lesson01.teach.cafeaua_e_mica_phrase:
    title: 커피는 작아요
    gloss: Cafeaua e mică. (커피는 작아요.)
    note: '*Cafeaua*는 여성이라서 여성형 *mică*를 써요.'
  ro.a1.unit14.lesson01.teach.painea_e_mica_phrase:
    title: 빵은 작아요
    gloss: Pâinea e mică. (빵은 작아요.)
    note: '*Pâinea*도 여성이라서 *cafeaua*와 마찬가지로 *mică*를 써요.'
  ro.a1.unit14.lesson02.teach.reminder_mare_mic_mica:
    title: '복습: Mare, Mic, Mică'
    gloss: Mare (큰) · Mic (작은, 남성/중성) · Mică (작은, 여성)
    note: 모두 이 단원 1과에서 나왔어요. 여기서는 비교형으로 쓰여요.
  ro.a1.unit14.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: '복습: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (그 커피) · ceaiul (그 차) · pâinea (그 빵)
    note: 모두 13단원에서 나왔고, 여기서도 비교하는 대상으로 다시 쓰여요.
  ro.a1.unit14.lesson02.teach.mai_vocab:
    title: 더 ~한
    gloss: Mai (더 ~한, 비교)
    note: 달 이름 *mai*(5월, 3단원)와는 달라요. 1단원의 'Ce mai faceți?'에서 본 바로 그 작은 단어지만, 여기서는 비교를 만드는 역할을 해요. 형용사 앞에 *mai*를 두면 '더 ~한'이라는 뜻이 되고, 이것이 루마니아어에서 비교를 만드는 기본 방법이에요.
    example_gloss:
    - 커피가 더 커요.
  ro.a1.unit14.lesson02.teach.mai_mare_phrase:
    title: 커피가 더 커요
    gloss: Cafeaua e mai mare. (커피가 더 커요.)
    note: '*Mai* + 형용사 -- 다른 변화는 필요 없어요.'
  ro.a1.unit14.lesson02.teach.decat_vocab:
    title: ~보다
    gloss: Decât (~보다)
    note: 비교를 완성해 줘요 -- *mai* + 형용사 + *decât* + 비교하는 두 번째 대상.
    example_gloss:
    - 커피가 차보다 더 커요.
  ro.a1.unit14.lesson02.teach.mai_mare_decat_phrase:
    title: 커피가 차보다 더 커요
    gloss: Cafeaua e mai mare decât ceaiul. (커피가 차보다 더 커요.)
    note: '비교 표현의 전체 패턴: [대상] + e + mai + [형용사] + decât + [두 번째 대상].'
  ro.a1.unit14.lesson02.teach.mai_mica_decat_phrase:
    title: 빵은 커피보다 더 작아요
    gloss: Pâinea e mai mică decât cafeaua. (빵은 커피보다 더 작아요.)
    note: 이 단원 1과에서 나온 여성형 *mică*를 쓴 같은 패턴이에요.
  ro.a1.unit14.lesson03.teach.reminder_mai_decat_mare_mic_mica:
    title: '복습: Mai, Decât, Mare, Mic, Mică'
    gloss: Mai (더) · Decât (~보다) · Mare (큰) · Mic (작은, 남성·중성) · Mică (작은, 여성)
    note: 모두 이 단원의 lesson01과 lesson02에서 나왔어요. 여기서는 Ana와 Mihai가 함께 사용해요.
  ro.a1.unit14.lesson03.teach.reminder_cafeaua_ceaiul_painea:
    title: '복습: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (그 커피) · ceaiul (그 차) · pâinea (그 빵)
    note: 모두 13단원에서 나왔어요. Ana와 Mihai가 비교하는 세 가지예요.
  ro.a1.unit14.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: '복습: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (안녕) · mulțumesc (감사합니다) · la revedere (안녕히 가세요) · Ana, Mihai (이름)
    note: 모두 이전 단원에서 이미 배웠어요. 이 코스의 모든 대화가 사용해 온 친근한 시작과 마무리 패턴이에요.
  ro.a1.unit14.lesson03.teach.line01:
    title: 인사하고 크기 묻기
    gloss: Mihai가 Ana에게 인사하고 커피가 큰지 작은지 물어요.
    note: 이 단원의 *mare sau mică*(크거나 작거나)로 크기를 묻는 질문을 시작해요. 13단원의 *cafea sau ceai?*에서 배운 'X sau Y?'처럼 선택지를 주는 형태예요.
  ro.a1.unit14.lesson03.teach.line02:
    title: 두 음료의 크기 말하기
    gloss: Ana가 커피는 크고 차는 작다고 말해요.
    note: 취향이 아니라 크기에 대한 사실만 말해요. 이 대화에서는 누가 어떤 음료를 좋아하거나 주문하는지는 나오지 않고, 각각이 얼마나 큰지만 나와요.
  ro.a1.unit14.lesson03.teach.line03:
    title: 비교가 맞는지 확인하며 묻기
    gloss: Mihai가 커피가 차보다 큰지 물어요.
    note: Ana가 말한 두 가지 사실(line02)을 이 단원의 핵심 표현인 *mai mare decât*로 직접 비교하는 문장으로 바꿔요.
  ro.a1.unit14.lesson03.teach.line04:
    title: 확인하고 빵 덧붙이기
    gloss: Ana가 맞다고 확인한 뒤, 빵이 커피보다 작다고 말해요.
    note: 세 번째 대상인 *pâinea*와 함께 *mai ... decât*를 다시 써요. 이번에는 '작은'의 비교 형태인 *mai mică*가 나와요.
  ro.a1.unit14.lesson03.teach.line05:
    title: 확인하고, 감사하고, 작별 인사하기
    gloss: Mihai가 빵이 작다고 확인하고 Ana에게 감사 인사를 한 뒤 작별 인사를 해요.
    note: 이전 모든 단원의 대화가 끝났던 것과 같은 마무리 패턴이에요.
  ro.a1.unit14.lesson03.teach.line06:
    title: 대화 마무리하기
    gloss: Ana가 Mihai의 이름을 부르며 작별 인사로 답해요.
    note: 이전 모든 단원의 대화가 끝났던 것과 같은 친근한 마무리 패턴이에요.
