generation_provenance:
  method: ai_generated
  authoring_system: derive_cross.py
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  notes: 'Derived from en-ro by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Korean string was translated and adapted. Needs native Korean review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Day and month names are correctly lowercase in standard Romanian writing (except sentence-initially); accept a learner's answer regardless of the case they happen to type it in -- this unit teaches the lowercase convention as a fact to recognize, not a hard-graded spelling rule.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register 1단원 already established between them.
course:
  title: 한국어로 배우는 루마니아어 A1
  description: 요일, 월 이름, 그리고 루마니아어로 날짜를 말하는 방법(기본 수 + 월 이름이고, 1일만 특별한 단어 întâi를 써요)을 배워요. Ana와 Mihai가 다음 만남 일정을 잡는 이야기가 이어져요.
units:
  ro.a1.unit03.dates:
    title: 요일과 날짜
lessons:
  ro.a1.unit03.lesson01.zilele_saptamanii:
    title: 요일
  ro.a1.unit03.lesson02.lunile_si_datele:
    title: 월 이름과 날짜 말하기
  ro.a1.unit03.lesson03.cand_ne_intalnim:
    title: 우리 언제 다시 만날까요?
teaching:
  ro.a1.unit03.lesson01.teach.este:
    title: '복습: este'
    gloss: ~이에요 / ~예요
    note: '*Este*는 2과(*Care este numărul...?*)에서 이미 나왔어요. 형태가 변하지 않아서, 주어가 요일이든 날짜든 다른 무엇이든 같은 단어를 쓰고, tu와 dumneavoastră에 따라 달라지지도 않아요.'
  ro.a1.unit03.lesson01.teach.astazi_maine:
    title: 오늘, 내일
    gloss: astăzi (오늘) / mâine (내일)
    note: 둘 다 형태가 변하지 않는 시간 표현이며, 요일이나 날짜를 말하는 문장의 맨 앞에 와요.
    example_gloss:
    - 오늘은 월요일이에요.
    - 내일은 화요일이에요.
  ro.a1.unit03.lesson01.teach.luni_marti:
    title: 월요일, 화요일
    gloss: luni (월요일) / marți (화요일)
    note: 요일을 말할 때(Astăzi este luni)는 여기 나온 기본 형태를 써요. 요일 이름에는 관사형 lunea, marțea도 있는데 '월요일마다', '화요일마다'라는 뜻이에요. 나중에 배워요.
    example_gloss:
    - 오늘은 월요일이에요.
    - 내일은 화요일이에요.
  ro.a1.unit03.lesson01.teach.miercuri_joi:
    title: 수요일, 목요일
    gloss: miercuri (수요일) / joi (목요일)
    note: luni, marți처럼 miercuri와 joi도 단수와 복수의 형태가 같아요.
    example_gloss:
    - 오늘은 수요일이에요.
    - 내일은 목요일이에요.
  ro.a1.unit03.lesson01.teach.vineri_sambata:
    title: 금요일, 토요일
    gloss: vineri (금요일) / sâmbătă (토요일)
    note: Sâmbătă는 현대 철자법에서 단어 가운데에 â를 써요. 예전 철자인 sîmbătă와는 달라요.
    example_gloss:
    - 오늘은 금요일이에요.
    - 내일은 토요일이에요.
  ro.a1.unit03.lesson01.teach.duminica:
    title: 일요일
    gloss: 일요일
    note: Duminică로 한 주가 완성돼요. 무슨 요일인지 말할 때는 이 기본 형태를 쓰고, 관사형 duminica는 '일요일마다'라는 뜻이에요.
    example_gloss: 오늘은 일요일이에요.
  ro.a1.unit03.lesson01.teach.ce_zi_e_azi:
    title: 무슨 요일인지 묻기
    gloss: 오늘은 무슨 요일이에요?
    note: 무슨 요일인지 묻는 일상적인 표현이에요. zi(날)가 새 단어이고, 나머지 ce, este, astăzi는 이미 익숙한 단어예요.
  ro.a1.unit03.lesson01.teach.saptamana_ieri:
    title: 주, 어제, 지난주, 다음 주
    gloss: săptămână (주) / ieri (어제) / săptămâna trecută (지난주) / săptămâna viitoare (다음 주)
    note: 요일 이름과 같은 자료에서 가져온 보너스 어휘예요. 날짜를 상대적으로 말할 때 유용하지만, 이 단원의 연습 문제에서는 요일만큼 집중적으로 다루지 않아요.
  ro.a1.unit03.lesson01.teach.lowercase_zile:
    title: 요일은 소문자로 써요
    gloss: '요일은 대문자로 쓰지 않아요: luni, vineri.'
    note: 루마니아어의 요일 이름은 문장 첫머리에 올 때를 제외하면 대문자로 쓰지 않아요. *Luni*가 아니라 *luni*라고 써요.
  ro.a1.unit03.lesson02.teach.ian_feb_mar:
    title: 1월, 2월, 3월
    gloss: ianuarie (1월) / februarie (2월) / martie (3월)
    note: 한국어는 '1월, 2월'처럼 숫자로 달을 말하지만, 루마니아어는 달마다 고유한 이름이 있어요. 요일 이름과 달리 달 이름은 라틴어에서 온 비슷한 모양이 많아 알아보기 쉬워요.
    example_gloss:
    - 1월이에요.
    - 2월이에요.
    - 3월이에요.
  ro.a1.unit03.lesson02.teach.apr_mai_iun:
    title: 4월, 5월, 6월
    gloss: aprilie (4월) / mai (5월) / iunie (6월)
    note: Mai(5월)는 짧은 단어지만, 이 과정의 다른 곳에서 쓰인 부사 mai(더)(ce mai faci)와는 달라요. 문맥을 보면 항상 구분돼요.
    example_gloss:
    - 4월이에요.
    - 5월이에요.
    - 6월이에요.
  ro.a1.unit03.lesson02.teach.iul_aug_sep:
    title: 7월, 8월, 9월
    gloss: iulie (7월) / august (8월) / septembrie (9월)
    note: 8월은 august라고 해요. 라틴어에서 온 이름이라 다른 유럽 언어에서도 비슷하게 볼 수 있어요. 숫자로 말하는 한국어와 달리 루마니아어는 달마다 고유한 이름을 써요.
    example_gloss:
    - 7월이에요.
    - 8월이에요.
    - 9월이에요.
  ro.a1.unit03.lesson02.teach.oct_noi_dec:
    title: 10월, 11월, 12월
    gloss: octombrie (10월) / noiembrie (11월) / decembrie (12월)
    note: 마지막 세 달로 열두 달이 모두 채워졌어요. 모두 형태가 변하지 않는 명사예요.
    example_gloss:
    - 10월이에요.
    - 11월이에요.
    - 12월이에요.
  ro.a1.unit03.lesson02.teach.intai:
    title: 그달의 1일
    gloss: 1일
    note: 루마니아어에만 있는 규칙이에요. 표준어에서는 한 달의 첫날을 평범한 숫자 *unu*(하나)로 말하지 않고, 따로 있는 단어 *întâi*를 써요. (일상 대화에서는 *unu*도 들을 수 있지만, 배워야 할 형태는 *întâi*예요.) 2일부터는 모두 평범한 기수를 써요.
    example_gloss: 오늘은 8월 1일이에요.
  ro.a1.unit03.lesson02.teach.date_rule:
    title: 루마니아어로 날짜 말하기
    gloss: '1일: întâi · 2일부터: 일반 기수(doi, trei, patru...)'
    note: '2일부터는 앞에서 배운 평범한 기수 뒤에 달 이름을 붙이면 돼요. 서수 형태도, 따로 붙는 말도 필요 없어요. 예: *trei aprilie*(4월 3일). 한국어는 ''달-일'' 순서이지만 루마니아어는 ''일-달'' 순서예요.'
  ro.a1.unit03.lesson02.teach.ce_data:
    title: 날짜 묻기
    gloss: 오늘은 며칠이에요?
    note: Dată(날짜)는 여기서 처음 나오는 단어예요. 나머지 질문은 앞서 요일을 물을 때처럼 ce, este, astăzi를 그대로 써요.
  ro.a1.unit03.lesson02.teach.raspuns_data:
    title: 날짜 말하기
    gloss: 오늘은 4월 3일이에요.
    note: Trei(셋)는 2단원에서 배운 기수 그대로예요. 서수 어미도 없고, aprilie 앞에 다른 단어도 붙지 않아요.
  ro.a1.unit03.lesson02.teach.la_multi_ani:
    title: 특별한 날에 축하 인사하기
    gloss: 생일 축하해요! / 새해 복 많이 받으세요!
    note: 직역하면 "(앞으로) 여러 해 동안"이라는 뜻이에요. 생일, 영명축일, 새해에 가장 흔히 쓰는 축하 인사이고, 2단원 나이 표현에서 배운 *ani*(해, 살)가 다시 나와요.
  ro.a1.unit03.lesson02.teach.lowercase_luni:
    title: 달 이름도 소문자로 써요
    gloss: '달 이름은 대문자로 쓰지 않아요: 1월, 5월.'
    note: 앞서 배운 요일 이름과 같은 규칙이에요. 루마니아어 달 이름은 문장 중간에서도 소문자로 써요.
  ro.a1.unit03.lesson03.teach.cand:
    title: 언제?
    gloss: 언제?
    note: Când은 시간을 묻는 질문을 여는 말로, 한국어의 '언제'와 같은 역할을 해요.
    example_gloss: 회의는 언제예요?
  ro.a1.unit03.lesson03.teach.intalnirea:
    title: 그 회의
    gloss: 회의
    note: Întâlnirea는 정관사가 붙은 형태(그 회의)예요. 관사가 없는 기본 명사는 întâlnire예요.
    example_gloss: 회의는 월요일이에요.
  ro.a1.unit03.lesson03.teach.cand_e_intalnirea:
    title: 언제인지 묻기
    gloss: 회의는 언제예요?
    note: 이미 익숙한 este와 이번 레슨의 새 단어 întâlnirea를 când과 함께 쓴 문장이에요.
  ro.a1.unit03.lesson03.teach.raspuns_intalnire:
    title: 행사 날짜 말하기
    gloss: 회의는 8월 1일 금요일이에요.
    note: 요일과 날짜는 쉼표로 이어서 함께 말할 수 있어요. 요일을 먼저 말하고 날짜를 뒤에 말해요.
  ro.a1.unit03.lesson03.teach.fara_de:
    title: 요일과 날짜에는 de가 필요 없어요
    gloss: '요일과 날짜에는 ''de''가 필요 없어요: 금요일, 8월 1일.'
    note: 2단원의 규칙과 비교해 보세요. 20 이상의 수는 일반 명사 앞에 *de*가 필요하지만(*treizeci de ani*), 요일이나 날짜는 *de* 없이 바로 이어져요.
  ro.a1.unit03.lesson03.teach.line01:
    title: 회의가 언제인지 묻기
    gloss: 아나가 미하이에게 회의가 언제인지 물어요.
    note: 격식에 상관없는 평범한 질문이에요. este는 tu를 쓰든 dumneavoastră를 쓰든 바뀌지 않아요.
  ro.a1.unit03.lesson03.teach.line02:
    title: 날짜 말하기
    gloss: 미하이가 회의는 8월 1일 금요일이라고 말해요.
    note: 미하이는 앞 레슨의 날짜 패턴을 그대로 써요. 요일, 그다음 întâi + 달 이름이고 de는 없어요.
  ro.a1.unit03.lesson03.teach.line03:
    title: 확인하고 마무리하기
    gloss: 아나가 고맙다고 하고 작별 인사를 해요.
    note: 1단원에서 배운 La revedere로, 늘 하던 대로 대화를 마무리해요.
  ro.a1.unit03.lesson03.teach.line04:
    title: 만남 마무리하기
    gloss: 미하이도 아나의 이름을 부르며 작별 인사를 해요.
    note: la revedere 뒤에 상대의 이름을 붙이면 자연스럽고 다정한 마무리 인사가 돼요.
exercises:
