      marți: 화요일
      miercuri: 수요일
      joi: 목요일
      vineri: 금요일
      sâmbătă: 토요일
      duminică: 일요일
    pairs:
    - left: luni
      right: 월요일
    - left: marți
      right: 화요일
    - left: miercuri
      right: 수요일
    - left: joi
      right: 목요일
    - left: vineri
      right: 금요일
    - left: sâmbătă
      right: 토요일
    - left: duminică
      right: 일요일
  ro.a1.unit03.lesson01.exercise04.order_day_question:
    instruction: 오늘이 무슨 요일인지 묻는 문장을 만드세요.
    correct_response:
    - Ce
    - zi
    - este
    - astăzi
  ro.a1.unit03.lesson01.exercise05.complete_next_day:
    instruction: 문장을 완성하세요.
    accepted_answers:
    - vineri
    feedback: 오늘이 목요일(*joi*)이면 내일은 금요일(*vineri*)이에요.
  ro.a1.unit03.lesson01.exercise06.listen_type_duminica:
    instruction: 들리는 요일을 입력하세요.
    accepted_answers:
    - duminică
  ro.a1.unit03.lesson01.exercise07.complete_lowercase_rule:
    instruction: 철자 규칙을 완성하세요.
    accepted_answers:
    - mare
    feedback: 요일은 문장 중간에서 대문자(*mare*)로 쓰지 않아요. *Luni*가 아니라 *luni*예요.
  ro.a1.unit03.lesson01.exercise08.speak_weekdays:
    instruction: 일주일의 일곱 요일을 순서대로 말하세요.
    accepted_answers:
    - Luni, marți, miercuri, joi, vineri, sâmbătă, duminică.
    - Luni, marți, miercuri, joi, vineri, sâmbătă, duminică
  ro.a1.unit03.lesson02.exercise01.listen_ianuarie:
    instruction: 듣고 들리는 달을 선택하세요.
    correct_option: ianuarie
    distractors:
    - februarie
    - iunie
    accepted_answers:
    - ianuarie
  ro.a1.unit03.lesson02.exercise02.choose_septembrie:
    instruction: '''9월''을 뜻하는 단어는 무엇일까요?'
    correct_option: septembrie
    distractors:
    - iunie
    - noiembrie
    accepted_answers:
    - septembrie
    prompt_blocks:
    - 9월
  ro.a1.unit03.lesson02.exercise03.match_months:
    instruction: 각 달을 한국어 이름과 짝지으세요.
    correct_response:
