      right: 12월
  ro.a1.unit03.lesson02.exercise04.order_date_question:
    instruction: 오늘 날짜를 묻는 문장을 만드세요.
    correct_response:
    - Ce
    - dată
    - este
    - astăzi
  ro.a1.unit03.lesson02.exercise05.first_day_word:
    instruction: 날짜에서 한 달의 1일을 나타낼 때 쓰는 단어를 쓰세요.
    accepted_answers:
    - întâi
    feedback: 표준 루마니아어에서 한 달의 첫날은 평범한 숫자 *unu*가 아니라 *întâi*예요.
  ro.a1.unit03.lesson02.exercise06.listen_type_decembrie:
    instruction: 들리는 달 이름을 입력하세요.
    accepted_answers:
    - decembrie
  ro.a1.unit03.lesson02.exercise07.complete_date_number:
    instruction: 날짜에서 말하는 대로 숫자를 쓰세요.
    accepted_answers:
    - trei
