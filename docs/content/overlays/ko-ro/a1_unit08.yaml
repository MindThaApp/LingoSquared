answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: No new register-sensitive forms in this unit -- este (is), the core verb every sentence here uses, does not change with tu or dumneavoastră (same standing note as unit03/unit04). Ana and Mihai's neighborhood dialogue keeps their existing polite register with each other, matching unit06/unit07.
course:
  title: 한국어로 배우는 루마니아어 A1
  description: 루마니아어로 흔한 장소를 알아보고 위치를 말해 봐요. Unde este...?(...은(는) 어디에 있어요?)로 묻고, 장소가 aproape(가까운)인지 departe(먼)인지 말하고, lângă(옆에), vizavi de(맞은편에), între(사이에)로 간단한 동네를 설명해요. 아나와 미하이가 시내를 다니며 나누는 이야기가 이어져요.
units:
  ro.a1.unit08.places:
    title: 장소
lessons:
  ro.a1.unit08.lesson01.unde_este:
    title: '...은 어디예요?'
  ro.a1.unit08.lesson02.langa_vizavi_intre:
    title: 옆, 맞은편, 사이
  ro.a1.unit08.lesson03.in_cartier:
    title: 동네에서
teaching:
  ro.a1.unit08.lesson01.teach.reminder_unde_este:
    title: '복습: unde, este'
    gloss: unde (어디) · este (~이다, 있다)
    note: 둘 다 이미 나왔어요 -- *unde*는 7단원의 *Unde pot să cumpăr ...?*에, *este*는 3·4단원부터요. 여기서는 둘이 합쳐져 이 단원의 핵심 위치 질문이 돼요.
  ro.a1.unit08.lesson01.teach.unde_este_phrase:
    title: '...은 어디예요?'
    gloss: Unde este...? (...은(는) 어디에 있어요?)
    note: 무언가가 어디 있는지 묻는 일상적인 방법이에요 -- *este* 뒤에 장소 이름을 붙이거나, 어떤 장소인지 문맥상 분명하면 이렇게 단독으로 써요.
  ro.a1.unit08.lesson01.teach.gara_magazin_banca:
    title: 기차역, 가게, 은행
    gloss: gară (기차역) · magazin (가게) · bancă (은행)
    note: '흔한 장소 세 곳이에요 -- 특정한 장소를 말할 때는 모두 정관사가 붙어요: *gara*, *magazinul*, *banca*.'
    example_gloss:
    - 기차역은 어디에 있어요?
    - 가게는 가까워요.
    - 은행은 멀어요.
  ro.a1.unit08.lesson01.teach.aproape_departe:
    title: 가깝다, 멀다
    gloss: aproape (가까운) · departe (먼)
    note: 정확한 길 안내 없이 장소가 얼마나 가깝거나 먼지 말하는 간단한 방법이에요.
    example_gloss:
    - 가게는 가까워요.
    - 은행은 멀어요.
  ro.a1.unit08.lesson01.teach.magazinul_aproape:
    title: 가게는 가까워요
    gloss: Magazinul este aproape. (가게는 가까워요.)
    note: 짧지만 완전한 문장이에요 -- 어떤 장소인지 이미 분명하면 *aproape* 뒤에 장소 이름이 필요 없어요.
  ro.a1.unit08.lesson01.teach.banca_departe:
    title: 은행은 멀어요
    gloss: Banca este departe. (은행은 멀어요.)
    note: '*aproape*의 반대말이에요 -- 같은 간단한 패턴이에요.'
  ro.a1.unit08.lesson01.teach.unde_este_gara:
    title: 기차역은 어디에 있어요?
    gloss: Unde este gara? (기차역은 어디에 있어요?)
    note: '*Unde este...?*와 *gara*를 합친 완전한 질문이에요.'
  ro.a1.unit08.lesson02.teach.spital_posta_biblioteca_statie:
    title: 병원, 우체국, 도서관, 버스 정류장
    gloss: spital (병원) · poștă (우체국) · bibliotecă (도서관) · stație de autobuz (버스 정류장)
    note: '흔한 장소 네 곳이 더 있어요 -- gară/magazin/bancă처럼 특정한 곳을 말할 때는 정관사가 붙어요: *spitalul*, *poșta*, *biblioteca*, *stația de autobuz*.'
    example_gloss:
    - 병원은 가게 맞은편에 있어요.
    - 우체국은 가게와 병원 사이에 있어요.
    - 도서관은 기차역에서 가까워요.
    - 버스 정류장은 도서관 옆에 있어요.
  ro.a1.unit08.lesson02.teach.langa_vizavi_intre:
    title: 옆, 맞은편, 사이
    gloss: lângă (옆에) · vizavi de (맞은편에) · între (사이에)
    note: 한 장소를 기준으로 다른 장소의 위치를 말하는 세 가지 방법이에요. *Vizavi de*는 *de*와 함께 쓰고 그 뒤에 두 번째 장소가 오며, *între*는 두 장소를 *și*로 이어요. *lângă*는 장소 이름에 바로 이어져요.
    example_gloss:
    - 가게는 기차역 옆에 있어요.
    - 병원은 가게 맞은편에 있어요.
    - 우체국은 가게와 병원 사이에 있어요.
  ro.a1.unit08.lesson02.teach.magazinul_langa_gara:
    title: 가게는 기차역 옆에 있어요
    gloss: Magazinul este lângă gară. (가게는 기차역 옆에 있어요.)
    note: '*Lângă*는 다른 단어 없이 장소 이름에 바로 이어져요.'
  ro.a1.unit08.lesson02.teach.spitalul_vizavi_magazin:
    title: 병원은 가게 맞은편에 있어요
    gloss: Spitalul este vizavi de magazin. (병원은 가게 맞은편에 있어요.)
    note: '*Vizavi de*는 *de*와 함께 쓰고, 그 뒤에 두 번째 장소가 와요.'
  ro.a1.unit08.lesson02.teach.posta_intre:
    title: 우체국은 가게와 병원 사이에 있어요
    gloss: Poșta este între magazin și spital. (우체국은 가게와 병원 사이에 있어요.)
    note: '*Între* 뒤에는 *și*(그리고)로 이어진 두 장소가 와요.'
  ro.a1.unit08.lesson02.teach.statia_langa_biblioteca:
    title: 버스 정류장은 도서관 옆에 있어요
    gloss: Stația de autobuz este lângă bibliotecă. (버스 정류장은 도서관 옆에 있어요.)
    note: 가게, 기차역에 쓴 *lângă* 패턴과 같아요. 이번에는 버스 정류장과 도서관에 써요.
  ro.a1.unit08.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: '복습: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună(안녕) · mulțumesc(감사합니다) · la revedere(안녕히 가세요) · da(네) · Ana, Mihai(이름)
    note: 모두 앞선 단원에서 이미 배웠어요. 여기서는 아나와 미하이가 동네에서 다시 만나요.
  ro.a1.unit08.lesson03.teach.line01:
    title: 인사하고 우체국이 어디인지 묻기
    gloss: 아나가 미하이에게 인사하고 우체국이 어디인지 물어요.
    note: 이 단원의 *Unde este*와 1단원의 인사말을 합쳤어요.
  ro.a1.unit08.lesson03.teach.line02:
    title: 위치 알려 주기
    gloss: 미하이가 우체국은 가게와 병원 사이에 있다고 말해요.
    note: 이 단원에서 배운 *poșta*와 *între ... și* 구문을 다시 써요.
  ro.a1.unit08.lesson03.teach.line03:
    title: 도서관에 대해 묻기
    gloss: 아나가 도서관이 가까운지 물어요.
    note: '*este*와 *aproape*를 다시 쓴 짧은 후속 질문이에요.'
  ro.a1.unit08.lesson03.teach.line04:
    title: 확인해 주고 더 알려 주기
    gloss: 미하이가 도서관이 기차역에서 가깝다고 확인해 주고, 버스 정류장은 도서관 옆에 있다고 덧붙여요.
    note: 이 단원의 전치사인 *aproape de*와 *lângă*를 한 문장에 함께 썼어요.
  ro.a1.unit08.lesson03.teach.line05:
    title: 고마움을 전하고 마무리하기
    gloss: 아나가 미하이에게 고맙다고 하고 작별 인사를 해요.
    note: 여기서 *Mulțumesc*는 간단한 마무리 감사 인사예요. 1단원의 *Bine, mulțumesc.*에 나온 그 말이에요.
  ro.a1.unit08.lesson03.teach.line06:
    title: 만남 마무리하기
    gloss: 미하이가 아나의 이름을 부르며 작별 인사로 답해요.
    note: 1, 5, 6, 7단원의 대화도 모두 이런 다정한 인사로 끝났어요.
