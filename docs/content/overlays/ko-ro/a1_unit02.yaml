answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching unit01''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Spoken answers are assessed for intelligibility, not written punctuation.
  register: tu and dumneavoastră (and their matching verb forms, ai/aveți) are never interchangeable answers for each other's exercises, the same discipline unit01 established.
course:
  title: 한국어로 배우는 루마니아어 A1
  description: 0부터 100까지의 숫자를 배워요. 십몇(-sprezece)과 십 단위(-zeci)를 만드는 규칙, doi/două의 성 구분, 그리고 숫자를 사용해 나이와 전화번호를 묻고 답하는 방법을 다루며, unit01의 Ana와 Mihai 이야기가 이어져요.
units:
  ro.a1.unit02.numbers:
    title: 숫자
lessons:
  ro.a1.unit02.lesson01.zero_to_ten:
    title: 0부터 10까지
  ro.a1.unit02.lesson02.eleven_to_hundred:
    title: 11부터 100까지의 숫자
  ro.a1.unit02.lesson03.age_and_phone:
    title: 나이와 전화번호
teaching:
  ro.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: 영
    note: '*Zero*는 형태가 변하지 않으며, 긴 숫자나 전화번호에서 숫자를 하나씩 읽을 때도 써요.'
    example_gloss: 영, 하나, 둘.
  ro.a1.unit02.lesson01.teach.unu:
    title: 일
    gloss: 일
    note: '*Unu*는 혼자 숫자를 셀 때 쓰는 형태예요. 남성 또는 중성 명사 앞에서는 *un*으로 줄고(*un câine*, 개 한 마리), 여성 명사 앞에서는 *o*가 돼요(*o sută*, 백).'
    example_gloss: 하나, 둘, 셋.
  ro.a1.unit02.lesson01.teach.doi:
    title: 둘(남성)
    gloss: 이
    note: '*Doi*는 남성 명사와 함께 써요(*doi bărbați*, 남자 두 명). 여성 명사와, 복수에서 여성처럼 행동하는 중성 명사는 다른 형태를 써요. 다음 카드를 보세요.'
    example_gloss: 둘, 셋, 넷.
  ro.a1.unit02.lesson01.teach.doi_doua_gender:
    title: 둘은 성에 따라 달라져요
    gloss: 둘(남성형 / 여성·중성형)
    note: 한국어의 '둘'은 명사의 성과 상관없이 늘 같지만, 루마니아어 *doi*에는 여성형 *două*가 따로 있어요. 여성 명사(*două femei*, 여자 두 명)와, 복수에서 여성처럼 쓰이는 중성 명사(*două numere*, 숫자 두 개)에는 două를 써요. 하나(*un*/*o*)와 둘을 제외하면, *trei*부터 *zece*까지는 성에 상관없이 같아요.
  ro.a1.unit02.lesson01.teach.trei:
    title: 삼
    gloss: 삼
    note: '*Trei*는 모든 성에서 형태가 같아요.'
    example_gloss: 셋, 넷, 다섯.
  ro.a1.unit02.lesson01.teach.patru:
    title: 사
    gloss: 사
    note: '*Patru*는 형태가 변하지 않아요. 십몇 수에서 줄어드는 불규칙형에 주의하세요: *paisprezece*(14)이고, *patrusprezece*가 아니에요.'
    example_gloss: 넷, 다섯, 여섯.
  ro.a1.unit02.lesson01.teach.cinci:
    title: 오
    gloss: 오
    note: '*Cinci*는 형태가 변하지 않아요.'
    example_gloss: 다섯, 여섯, 일곱.
  ro.a1.unit02.lesson01.teach.sase:
    title: 육
    gloss: 육
    note: '*Șase*는 형태가 변하지 않아요.'
    example_gloss: 여섯, 일곱, 여덟.
  ro.a1.unit02.lesson01.teach.sapte:
    title: 칠
    gloss: 칠
    note: '*Șapte*는 형태가 변하지 않아요.'
    example_gloss: 일곱, 여덟, 아홉.
  ro.a1.unit02.lesson01.teach.opt:
    title: 팔
    gloss: 팔
    note: '*Opt*는 형태가 변하지 않아요.'
    example_gloss: 여덟, 아홉, 열.
  ro.a1.unit02.lesson01.teach.noua:
    title: 구
    gloss: 구
    note: '*Nouă*는 형태가 변하지 않아요. 발음 기호 없이 쓰면 *noua*("그 새것", 여성형)와 똑같아지므로 *ă*를 꼭 입력하세요. 입력 답안은 발음 기호까지 확인해요.'
    example_gloss: 아홉, 열... 끝!
  ro.a1.unit02.lesson01.teach.zece:
    title: 십
    gloss: 십
    note: '*Zece*는 형태가 변하지 않으며, 11부터 나오는 모든 십대 수의 바탕이 돼요(*zece* + *-sprezece*).'
    example_gloss: 열! 잘했어요!
  ro.a1.unit02.lesson02.teach.unsprezece:
    title: 십일
    gloss: 십일
    note: '*Unsprezece*는 말 그대로 *unu* + *spre* + *zece*("10 위의 1")로 만들어져요. 이후의 모든 십대 수가 이 방식을 따라요.'
    example_gloss: 열, 열하나, 열둘.
  ro.a1.unit02.lesson02.teach.teens_pattern:
    title: 12부터 19까지
    gloss: doisprezece (12), treisprezece (13), paisprezece (14), cincisprezece (15), șaisprezece (16), șaptesprezece (17), optsprezece (18), nouăsprezece (19)
    note: 십대 수는 모두 한 자리 수의 일반 형태에 *-sprezece*를 붙여요. *doi* → *doisprezece*, *trei* → *treisprezece*, *nouă* → *nouăsprezece*까지 같아요. 불규칙한 수는 둘이에요. 14는 *patru*가 *pai-*로 줄어 *paisprezece*가 되고(*patrusprezece*가 아니에요), 16은 *șase*가 *șai-*로 바뀌어 *șaisprezece*가 돼요(*șasesprezece*가 아니에요).
  ro.a1.unit02.lesson02.teach.douazeci:
    title: 이십
    gloss: 이십
    note: '*Douăzeci*("십이 두 개")는 독립된 단어이며, 21부터 29까지 모든 수의 바탕이 돼요.'
    example_gloss: 열아홉, 스물...
  ro.a1.unit02.lesson02.teach.douazeci_si_unu:
    title: 스물하나
    gloss: 스물하나
    note: 21부터는 루마니아어에서 십의 자리와 일의 자리를 *și*("그리고")로 이어요. *douăzeci și unu*, *douăzeci și doi*처럼요. 한 단어로 합쳐지는 십대 수와는 달라요.
    example_gloss: 스물, 스물하나, 스물둘.
  ro.a1.unit02.lesson02.teach.tens_pattern:
    title: 30부터 90까지
    gloss: treizeci (30), patruzeci (40), cincizeci (50), șaizeci (60), șaptezeci (70), optzeci (80), nouăzeci (90)
    note: 30 이상의 십 단위는 모두 한 자리 수에 *-zeci*("십들")를 붙여요. *trei* → *treizeci*, *patru* → *patruzeci*처럼요. 철자가 바뀌는 건 60뿐이에요. *șase*가 *șai-*가 되어 *șaizeci*가 돼요(*șaisprezece*의 *șai-*와 같아요). 70, 80, 90을 20 단위로 세는 방식은 쓰지 않아요.
  ro.a1.unit02.lesson02.teach.o_suta:
    title: 백
    gloss: 백
    note: '*O sută*에서는 *sută*가 여성 명사이기 때문에 *un*이 아니라 "하나/한"의 여성형인 *o*를 써요.'
    example_gloss: 아흔, 백!
  ro.a1.unit02.lesson03.teach.cati_ani_ai:
    title: 친근하게 나이 묻기
    gloss: 몇 살이에요?
    note: 직역하면 "몇 년을 가지고 있어요?"예요. 나이를 말할 때 "이다" 동사 대신 *avea*(가지다)를 쓰는데, 프랑스어 *avoir*도 같은 방식이에요. *Câți*(몇, 남성형)는 *ani*(해, 남성형)와 성이 일치해요.
  ro.a1.unit02.lesson03.teach.am_nouasprezece_ani:
    title: 나이 말하기 (20세 미만)
    gloss: 저는 열아홉 살이에요.
    note: '*Am*은 *avea*의 *eu* 형태예요. 20 미만의 수에서는 *ani* 앞에 *de*가 필요 없어요.'
  ro.a1.unit02.lesson03.teach.cati_ani_aveti:
    title: 격식 있게 나이 묻기
    gloss: 몇 살이에요?
    note: '*Aveți*는 *avea*의 *dumneavoastră* 형태로, 1과에서 익힌 공손한 말투에 맞는 표현이에요.'
  ro.a1.unit02.lesson03.teach.am_treizeci_de_ani:
    title: 나이 말하기 (20세 이상)
    gloss: 저는 서른 살이에요.
    note: '*treizeci*는 20 이상의 수라서 여기에 *de*가 들어가요. 전체 규칙은 다음 카드에서 확인하세요.'
  ro.a1.unit02.lesson03.teach.de_insertion_rule:
    title: 명사 앞에 de를 붙이는 경우
    gloss: '2~19: de 없음 (doi ani) / 20 이상: de 붙임 (treizeci de ani)'
    note: 루마니아어에만 있는 규칙이에요. 2부터 19까지의 수는 명사에 바로 붙지만(*doi ani*, 2년/2살; *nouăsprezece ani*, 19년/19살), 20 이상은 수와 명사 사이에 *de*가 필요해요(*treizeci de ani*, 30년/30살; *o sută de ani*, 100년). 1은 따로 *un an*(1년, 단수)이라고 하며 어느 경우든 *de*가 없어요.
  ro.a1.unit02.lesson03.teach.care_e_numarul_tau:
    title: 전화번호 묻기 (친한 사이)
    gloss: 전화번호가 뭐예요?
    note: 특정한 번호를 물을 때는 *ce*가 아니라 *Care*(어느/무엇)를 쓰는 것이 자연스러워요. *Număr*는 중성 명사인데, 단수에서는 남성 명사와 똑같이 일치해요. 그래서 *너의*에 해당하는 말은 *ta*가 아니라 *tău*예요.
  ro.a1.unit02.lesson03.teach.care_este_numarul_dvs:
    title: 전화번호 묻기 (공손한 표현)
    gloss: 전화번호가 뭐예요?
    note: '*Este*는 *e*의 완전한 형태로, 격식을 차리거나 신경 써서 말할 때 더 자주 써요. *Dumneavoastră*는 1과에서 배운 단어로, 대화를 공손하게 유지해 줘요.'
  ro.a1.unit02.lesson03.teach.raspuns_telefon:
    title: 전화번호를 한 자리씩 말하기
    gloss: 0, 7, 2, 1, 4, 5, 6, 7, 8, 9예요.
    note: 이 단원에서는 숫자를 한 자리씩 읽는 간단한 방식만 써요. 1과에서 말투를 단순화했던 것과 같은 방침이에요. 실제로는 두 자리씩 묶어 말하기도 하지만, 한 자리씩 말해도 항상 알아들어요.
