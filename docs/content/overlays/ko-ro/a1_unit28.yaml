teaching:
  ro.a1.unit28.lesson01.teach.a_suna:
    title: 전화하다
    gloss: 전화하다
    note: 전화를 거는 동사의 원형이에요.
    example_gloss: 너에게 전화해야 해요.
  ro.a1.unit28.lesson01.teach.te_sun:
    title: 전화하겠다고 말하기
    gloss: 제가 전화할게요.
    note: '*Sun*은 *a suna*(전화하다)의 *eu* 형태예요. *te*("너를")는 동사 앞에 와요. 한국어는 "전화할게요"처럼 미래 의지를 어미로 나타내지만, 루마니아어는 이럴 때 현재 시제를 써요.'
  ro.a1.unit28.lesson01.teach.alo_sunt_ana:
    title: 전화 받기
    gloss: 여보세요, 아나예요.
    note: '*Alo*는 전화를 받을 때 하는 말이에요. *sunt* + 이름은 자신이 누구인지 말해요. 한국어의 "~예요"와 비슷해요.'
  ro.a1.unit28.lesson01.teach.alo_sunt_mihai:
    title: 미하이도 같은 방식으로 받아요
    gloss: 여보세요, 미하이예요.
    note: '*Alo, sunt Ana*와 같은 *Alo, sunt* + 이름 형태예요.'
  ro.a1.unit28.lesson02.teach.cu_cine_vorbesc:
    title: 누가 전화했는지 묻기
    gloss: 누구세요?
    note: '*Cu cine vorbesc?*(직역: "제가 누구와 말하고 있나요?")는 모르는 사람이 건 전화에서 상대가 누구인지 물을 때 쓰는 기본 표현이에요.'
  ro.a1.unit28.lesson02.teach.vorbiti_cu_ana:
    title: 격식 있게 자신을 밝히기
    gloss: 아나와 통화하고 계세요.
    note: '*Vorbiți cu* + 이름은 격식을 갖춘 대답이에요. *vorbiți*는 *a vorbi*(말하다)의 *dumneavoastră* 형태예요.'
  ro.a1.unit28.lesson03.teach.poti_sa_repeti:
    title: 다시 말해 달라고 부탁하기
    gloss: 다시 말해 줄 수 있어요?
    note: '*Poți să* ...(~해 줄 수 있어요?) + *repeți*(반복하다) + *asta*(그것).'
  ro.a1.unit28.lesson03.teach.nu_vorbi_atat:
    title: 천천히 말해 달라고 부탁하기
    gloss: 너무 빨리 말하지 말아 주세요.
    note: '*Nu vorbi*("말하지 마")는 *nu* + *tu* 형태예요. *atât de repede*는 "그렇게 빨리"라는 뜻이에요.'
  ro.a1.unit28.lesson03.teach.nu_te_aud:
    title: 잘 안 들린다고 말하기
    gloss: 잘 안 들려요.
    note: '*Nu te aud bine*: *aud*는 "나는 들어요", *te*("너를")는 동사 앞에 오고, *bine*는 "잘"이라는 뜻이에요.'
  ro.a1.unit28.lesson04.teach.mesajul:
    title: 문자 메시지
    gloss: 문자 메시지
    note: '*Mesaj*는 단수에서는 남성, 복수에서는 여성이에요(*un mesaj*, *două mesaje*). 정관사는 끝에 붙어요: *mesajul*.'
    example_gloss: 문자 메시지는 아나에게서 왔어요.
  ro.a1.unit28.lesson04.teach.iti_trimit_un:
    title: 문자 보내겠다고 말하기
    gloss: 문자 보낼게요.
    note: '*Îți*("너에게")는 동사 앞에 오는 여격 대명사예요: *Îți trimit un mesaj*.'
  ro.a1.unit28.lesson04.teach.te_sun_inapoi:
    title: 다시 전화하겠다고 말하기
    gloss: 나중에 다시 전화할게요.
    note: '*Înapoi*("다시, 되돌려")는 동사 뒤에 와요. *te sun înapoi*는 "다시 전화할게요"이고, *mai târziu*는 "나중에"라는 뜻이에요.'
  ro.a1.unit28.lesson05.teach.mihai_salut_ana:
    title: 문자 대화 읽기
    gloss: '미하이: 안녕, 아나. 전화해 줄 수 있어요? 할 말이 있어요. 아나: 네, 그럼요. 5분 뒤에 다시 전화할게요.'
    note: 미하이가 무엇을, 왜 부탁하는지, 그리고 아나가 언제 다시 전화한다고 하는지 살펴보세요.
    glosses:
      Salut: 안녕
      poți: ~할 수 있다
      suna: 전화하다
      Trebuie: ~해야 하다
      ceva: 무언가
      spun: 말해 주다
      sigur: 물론
      sun: 전화하다
      cinci: 다섯
      minute: 분
      înapoi: 다시 (전화) 걸다
  ro.a1.unit28.lesson06.teach.mihai_alo_sunt:
    title: 미하이가 전화를 받아요
    gloss: '미하이: 여보세요, 미하이예요.'
    note: 1과의 *Alo, sunt* + 이름 형태를 실제 통화에서 써요. 전화를 받은 사람이 먼저 말하고 자기 이름을 밝혀요.
  ro.a1.unit28.lesson06.teach.ana_salut_mihai:
    title: 아나가 자기를 밝혀요
    gloss: '아나: 안녕, 미하이. 아나예요. 미하이: 전화해 줘서 정말 좋아요!'
    note: '*Ce bine că* ...("~해서 정말 좋다")는 어떤 일에 대한 긍정적인 반응을 나타내요. *suni*는 *a suna*의 *tu* 형태예요.'
  ro.a1.unit28.lesson06.teach.ana_cum_a:
    title: 아나가 근무에 대해 물어요
    gloss: '아나: 첫 근무는 어땠어요?'
    note: '*A fost*는 "였다"라는 뜻이에요(*a fi*의 과거). *am mâncat*처럼 만드는 복합 과거예요. 다음 줄 뒤의 설명을 보세요.'
  ro.a1.unit28.lesson06.teach.mihai_a_mers:
    title: 미하이가 좋은 소식을 전해요
    gloss: '미하이: 아주 잘 됐어요. 생각했던 것보다 더 좋았어요.'
    note: '*A mers*는 *a merge*(가다, 여기서는 "~하게 되다")의 과거예요. *credeam*은 "나는 생각했어요"라는 뜻이에요(*a crede*의 과거형).'
  ro.a1.unit28.lesson06.teach.a_fost_a:
    title: '과거 형태: a fost, a mers, credeam'
    gloss: 였다 → 이다, 갔다 → 가다, 생각했다 → 생각하다
    note: '*A fost*와 *a mers*는 복합 과거 형태(*a* + 분사)이고 *credeam*은 반과거예요. 지금은 이 수업에 나온 상황의 고정 표현으로만 외워 두세요. 과거 시제의 전체 규칙은 이후 단계에서 배워요.'
  ro.a1.unit28.lesson06.teach.ana_ma_bucur:
    title: Ana가 자랑스러워해요
    gloss: 'Ana: 정말 반가운 소식이에요! 네가 자랑스러워요.'
    note: '*Mândră de*(''~이 자랑스러운'')는 고정된 결합이라 *de*가 꼭 필요해요. 남자는 *mândru*라고 해요.'
  ro.a1.unit28.lesson06.teach.mihai_iti_multumesc:
    title: Mihai가 감동해요
    gloss: 'Mihai: 고마워요, 나한테 큰 의미가 있어요.'
    note: '*Înseamnă*는 *a însemna*(의미하다)의 3인칭 단수형이에요. *pentru mine*(''나에게'')은 누구에게 중요한지를 말해 줘요.'
  ro.a1.unit28.lesson06.teach.prima_lui_tura:
    title: 그의
    gloss: 그의 첫 근무는 아주 잘 됐어요.
    note: '*Lui*는 "그의"라는 뜻이에요: *prima lui tură* (*prima*와 *tură* 사이에 와요). ("그녀의"는 *ei*예요.)'
