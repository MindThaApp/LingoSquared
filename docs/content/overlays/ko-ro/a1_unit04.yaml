answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02/03''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register 1단원 already established between them.
course:
  title: 한국어로 배우는 루마니아어 A1
  description: 루마니아어로 시간을 묻고 말하는 방법을 배워요. 정각, 30분, 15분, 15분 전, 하루의 때, 그리고 무언가가 언제 시작하는지 묻는 법까지 다뤄요. 아나와 미하이가 루마니아어 수업 시작 시간을 정하는 이야기가 이어져요.
units:
  ro.a1.unit04.time:
    title: 시간 말하기
lessons:
  ro.a1.unit04.lesson01.ora_fixa_si_jumatate:
    title: 정각과 30분
  ro.a1.unit04.lesson02.sferturi_si_intrebari:
    title: 15분, 그리고 시간을 묻는 법
  ro.a1.unit04.lesson03.cand_incepe_cursul:
    title: 수업은 언제 시작해요?
teaching:
  ro.a1.unit04.lesson01.teach.este:
    title: '복습: este'
    gloss: ~이다 / ~이에요
    note: '*Este*는 2단원과 3단원에서 이미 나왔어요. 숫자, 요일, 날짜를 말할 때도, 이제 시각을 말할 때도 똑같은 단어를 써요.'
  ro.a1.unit04.lesson01.teach.ora:
    title: 시각
    gloss: 시, 시각
    note: '여성 명사예요. 시계의 시각을 말할 때 숫자 바로 앞에 *ora*를 붙여요. 예: *ora unu* (1시).'
    example_gloss: 1시예요.
  ro.a1.unit04.lesson01.teach.ora_unu:
    title: 1시
    gloss: 1시
    note: 직역하면 '그 시각 하나'예요. ora가 먼저 오고 그다음에 숫자가 와요.
  ro.a1.unit04.lesson01.teach.ora_doua:
    title: 2시 정각
    gloss: 2시
    note: 여기서는 여성 명사 *ora*에 맞춰 숫자가 여성형 *două*가 돼요. 전체 패턴은 다음 카드에서 볼게요.
  ro.a1.unit04.lesson01.teach.ora_gender_note:
    title: '진짜 불규칙: unu는 그대로 unu'
    gloss: ora unu ("ora una"가 아님) / ora două ("ora doi"가 아님)
    note: 여성형이 있는 숫자는 보통 여성 명사 앞에서 여성형을 써요(*doi* → *două*, 여성 명사 *ora*처럼). 하지만 시간을 말할 때 *unu*는 유일한 예외예요. *ora*가 여성 명사인데도 항상 *ora unu*라고 하고 *ora una*라고는 하지 않아요.
  ro.a1.unit04.lesson01.teach.ora_trei:
    title: 3시 정각
    gloss: 3시
    note: Trei는 unu/una나 doi/două와 달리 성에 따라 형태가 전혀 바뀌지 않아요. 외울 것이 하나 줄어요.
  ro.a1.unit04.lesson01.teach.jumatate:
    title: 반, 절반
    gloss: 반, 절반
    note: 'și(그리고)와 함께 써서 ''~시 반''을 말해요: X și jumătate.'
    example_gloss: 1시 30분이에요.
  ro.a1.unit04.lesson01.teach.ora_unu_jumatate:
    title: 1시 반
    gloss: 1시 반이에요.
    note: 직역하면 '1시 그리고 반'이에요. 지나간 정시에 30분을 더하는 간단한 방식이에요.
  ro.a1.unit04.lesson01.teach.cat_e_ora:
    title: 시간 묻기
    gloss: 몇 시예요?
    note: 시각을 묻는 일상적인 표현이에요. cât(얼마, 2단원의 câți와 같은 계열) + este + ora(시각)로 이루어져 있어요.
  ro.a1.unit04.lesson02.teach.sfert:
    title: 15분
    gloss: 15분, 4분의 1
    note: 한 시간의 4분의 1, 즉 15분이에요. și(그리고)나 fără(~없이)와 결합해 15분 지남이나 15분 전을 나타내요.
    example_gloss: 1시 15분이에요.
  ro.a1.unit04.lesson02.teach.sfert_rule:
    title: 15분이나 30분과 함께 쓰는 și와 fără
    gloss: și un sfert = +15분 · fără un sfert = -15분
    note: '*Și*(그리고)는 방금 지난 정시에 분을 더하고, *fără*(~없이)는 곧 다가올 정시에서 분을 빼서 세요. 한국어의 ''1시 15분''과 ''2시 15분 전''처럼 더하기와 빼기로 생각하면 돼요.'
  ro.a1.unit04.lesson02.teach.ora_doua_sfert:
    title: 2시 15분
    gloss: 2시 15분이에요.
    note: Ora două(2시)에 și un sfert(+15분)를 더하면 2시 15분이에요.
  ro.a1.unit04.lesson02.teach.fara:
    title: ~없이 / ~분 전
    gloss: ~없이, ~전
    note: 시각에서는 다음 정시를 기준으로 거꾸로 분을 세요. 한국어의 '3시 15분 전'에서 '전'과 비슷한 역할이에요.
    example_gloss: 3시 15분 전이에요.
  ro.a1.unit04.lesson02.teach.ora_trei_fara_sfert:
    title: 2시 45분
    gloss: 3시 15분 전이에요.
    note: Ora trei(3시)에서 fără un sfert(-15분)를 빼면 2시 45분이에요. 루마니아어는 방금 지난 시각이 아니라, 앞으로 다가올 시각을 기준으로 말해요.
  ro.a1.unit04.lesson02.teach.la_ce_ora:
    title: 몇 시에인지 묻기
    gloss: 몇 시에요?
    note: La(~에) + ce(무슨) + oră(시각, 여기서는 ora가 아닌 부정형)로 이루어져 있어요. 무언가가 언제 일어나는지 묻는 일상적인 표현이에요.
  ro.a1.unit04.lesson02.teach.la_ora_noua:
    title: 언제 일어나는지 말하기
    gloss: 9시에요.
    note: La(~에) + ora(여기서는 정관사가 붙은 형태) + 숫자 순서예요. 'La ce oră?'에 대한 대답 패턴이에요.
  ro.a1.unit04.lesson02.teach.tarziu:
    title: 늦게
    gloss: 늦은
    note: 시간을 확인했을 때 자주 쓰는 유용한 반응 표현이에요.
    example_gloss: 늦었어요!
  ro.a1.unit04.lesson03.teach.cand:
    title: '복습: când'
    gloss: 언제?
    note: Când은 3단원에서 행사가 언제인지 물을 때 이미 나왔어요. 여기서는 무언가가 언제 시작하는지 물을 때 다시 쓰여요.
  ro.a1.unit04.lesson03.teach.zi_parts:
    title: 하루의 시간대
    gloss: 아침 / 오후 / 저녁 / 밤
    note: 이 단어들은 모두 정관사가 붙은 명사 형태로, 부사처럼 쓰여요. 한국어는 '아침에'처럼 조사 '에'를 붙이지만, 루마니아어는 따로 전치사 없이 이 형태만 써요.
    example_gloss:
    - 수업은 아침에 있어요.
    - 수업은 오후에 있어요.
    - 미하이는 저녁에 일해요.
    - 아나는 밤에 자요.
  ro.a1.unit04.lesson03.teach.cursul:
    title: 수업
    gloss: 수업, 강좌
    note: curs(수업, 강좌)에 정관사가 붙은 형태예요. 여기서는 아나와 미하이의 루마니아어 수업을 가리켜요.
    example_gloss: 수업은 아홉 시에 시작해요.
  ro.a1.unit04.lesson03.teach.incepe:
    title: 시작해요
    gloss: 시작하다, 시작해요
    note: 그, 그녀, 그것에 해당하는 현재형이에요. cursul(수업)처럼 '나'나 '너'가 아닌 단수 주어에 모두 쓰여요.
    example_gloss: 수업은 아침에 시작해요.
  ro.a1.unit04.lesson03.teach.cand_incepe_cursul:
    title: 수업이 언제 시작하는지 묻기
    gloss: 수업은 언제 시작해요?
    note: când에 이번 레슨의 새 단어 începe와 cursul을 합친 문장이에요.
  ro.a1.unit04.lesson03.teach.raspuns_curs:
    title: 수업이 언제 시작하는지 말하기
    gloss: 수업은 아침 9시에 시작해요.
    note: 때를 나타내는 부사(dimineața)를 쉼표와 함께 끝에 덧붙였어요. 3단원에서 요일 뒤에 날짜를 덧붙인 방식과 같아요.
  ro.a1.unit04.lesson03.teach.line01:
    title: 수업이 언제 시작하는지 묻기
    gloss: 아나가 미하이에게 수업이 언제 시작하는지 물어요.
    note: 격식 없이 평범한 질문이에요. este와 începe는 tu를 쓰든 dumneavoastră를 쓰든 바뀌지 않아요.
  ro.a1.unit04.lesson03.teach.line02:
    title: 시간 말하기
    gloss: 미하이가 수업이 아침 9시에 시작한다고 말해요.
    note: 미하이는 이번 레슨에서 배운 시각과 하루의 때 패턴을 그대로 써요.
  ro.a1.unit04.lesson03.teach.line03:
    title: 알겠다고 답하고 마무리하기
    gloss: 아나가 고맙다고 하고 작별 인사를 해요.
    note: 1단원에서 배운 la revedere로 늘 하던 대로 대화를 마무리해요.
  ro.a1.unit04.lesson03.teach.line04:
    title: 만남 마무리하기
    gloss: 미하이도 아나의 이름을 부르며 작별 인사를 해요.
    note: la revedere에 상대방 이름을 붙여 답하면 자연스럽고 다정하게 마무리할 수 있어요.
