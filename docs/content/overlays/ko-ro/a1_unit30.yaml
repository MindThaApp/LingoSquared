  ro.a1.unit30.lesson05.mihai_si_ana_isi:
    title: Mihai와 Ana가 취미를 비교해요
  ro.a1.unit30.lesson06.planuim_impreuna_un_weekend:
    title: 함께 주말 계획 세우기
teaching:
  ro.a1.unit30.lesson01.teach.a_citi_a:
    title: 독서, 운동, 요리
    gloss: 읽다, 운동하다, 요리하다
    note: '자주 쓰는 취미 동사 세 개: *a citi*(읽다), *a face sport*(운동하다), *a găti*(요리하다). 루마니아어 사전형은 *a*로 시작해요.'
    example_gloss:
    - 저는 책 읽는 것을 좋아해요.
    - 저는 토요일마다 운동해요.
    - 저는 친구들을 위해 요리하는 것을 좋아해요.
  ro.a1.unit30.lesson01.teach.timpul_liber:
    title: 여가 시간
    gloss: 여가 시간
    note: '*Timpul liber*(자유 시간)는 남성 명사 *timp*에 정관사가 붙은 형태예요. 취미를 말할 때 핵심이 되는 표현이에요.'
    example_gloss: 저는 여가 시간에 독서하는 것을 좋아해요.
  ro.a1.unit30.lesson01.teach.in_timpul_liber:
    title: 여가 시간에 하는 일 말하기
    gloss: 저는 여가 시간에 독서하는 것을 좋아해요.
    note: '*Citesc*는 *a citi*(읽다)의 *eu* 형태예요. *îmi place să* 뒤에서도 동사는 같은 형태를 써요.'
  ro.a1.unit30.lesson02.teach.a_asculta_muzica:
    title: 음악, 그림 그리기, 비디오 게임
    gloss: 음악을 듣다, 그림을 그리다, 비디오 게임을 하다
    note: '취미 표현 세 개 더: *a asculta muzică*(음악을 듣다), *a desena*(그림을 그리다), *a juca jocuri video*(비디오 게임을 하다).'
    example_gloss:
    - 저는 음악 듣는 것을 좋아해요.
    - 저는 그림을 자주 그려요.
    - 저는 친구들과 비디오 게임 하는 것을 좋아해요.
  ro.a1.unit30.lesson02.teach.imi_place_sa:
    title: 음악 듣기를 좋아한다고 말하기
    gloss: 저는 음악 듣는 것을 좋아해요.
    note: '*Îmi place să ascult muzică*: *îmi place*("나에게 즐거움을 준다") + *să* + 동사는 무언가 하는 것을 좋아한다고 말하는 일반적인 방법이에요.'
  ro.a1.unit30.lesson02.teach.imi_place_sa_2:
    title: 친구들과 게임하는 것을 좋아한다고 말하기
    gloss: 저는 친구들과 비디오 게임 하는 것을 좋아해요.
    note: '*Cu prietenii*는 "친구들과"라는 뜻이에요. *cu*("…와")는 전치사이고, *prietenii*는 정관사가 붙은 복수형이에요.'
  ro.a1.unit30.lesson03.teach.mereu_des_uneori:
    title: 항상, 자주, 가끔, 전혀 ~않다
    gloss: 항상, 자주, 가끔, 절대 ~않다
    note: '핵심 빈도 부사 네 개: *mereu*, *des*, *uneori*, *niciodată*. 보통 동사 뒤에 와요: *Citesc des*.'
    example_gloss:
    - 저는 토요일마다 항상 운동해요.
    - 저는 책을 자주 읽어요.
    - 저는 가끔 그림을 그려요.
    - 저는 게임을 전혀 안 해요.
  ro.a1.unit30.lesson03.teach.in_fiecare_saptamana:
    title: 매주, 주말마다
    gloss: 매주, 주말마다
    note: '*În fiecare săptămână*와 *în fiecare weekend*는 둘 다 "매…"라는 뜻이에요. *fiecare*는 변하지 않아요. 다음 카드를 보세요.'
    example_gloss:
    - 저는 매주 친구들을 위해 요리해요.
    - 저는 주말마다 운동해요.
  ro.a1.unit30.lesson03.teach.cuvantul_fiecare_nu:
    title: Fiecare는 변하지 않아요
    gloss: 'fiecare라는 단어는 변하지 않아요: în fiecare săptămână(매주), în fiecare weekend(주말마다).'
    note: '*Fiecare*는 명사가 무엇이든 *săptămână*, *weekend* 앞에서 그대로예요. 고를 필요가 없어요.'
  ro.a1.unit30.lesson03.teach.ce_faci_in:
    title: 여가 시간에 대해 묻기
    gloss: 여가 시간에 무엇을 하나요?
    note: 이 단원의 핵심 질문이에요. 누구에게든 취미를 물을 때 이 문장을 쓰세요.
  ro.a1.unit30.lesson04.teach.ana_ne_plimbam:
    title: Ana가 취미 이야기를 꺼내요
    gloss: 'Ana: 우리는 자주 같이 산책하잖아요. 그런데 Mihai, 자유 시간에는 또 뭘 해요?'
    note: '*Ne plimbăm*("우리는 산책한다")은 재귀 동사 *a se plimba*의 *noi* 형태예요. 두 친구가 함께 즐기는 산책을 가리켜요.'
  ro.a1.unit30.lesson04.teach.mihai_imi_place:
    title: Mihai의 취미
    gloss: 'Mihai: 요리하는 걸 좋아해요, 집에서도요. 그리고 운동도 자주 해요.'
    note: '*Și acasă*(집에서도)는 Mihai가 식당 일 때문만이 아니라 즐기려고도 요리한다는 걸 분명히 해 줘요.'
  ro.a1.unit30.lesson04.teach.ana_gatesti_si:
    title: Ana가 놀라요
    gloss: 'Ana: 집에서도 요리해요? 직장에서 이미 하루 종일 요리하잖아요!'
    note: '*Toată ziua*(하루 종일)는 Mihai가 직장에서 이미 얼마나 많이 요리하는지 강조해요. *deja*는 "이미"라는 뜻이에요.'
  ro.a1.unit30.lesson04.teach.mihai_da_dar:
    title: Mihai가 설명해요
    gloss: 'Mihai: 네, 그래도 저는 요리가 마음을 편하게 해 준다고 생각해요. 너는 뭐 하는 걸 좋아해요?'
    note: '*Gătitul mi se pare relaxant*는 직역하면 "요리는 나에게 편안하게 보인다"라는 뜻이에요. *mi se pare*는 의견을 말할 때 자주 쓰는 표현이에요.'
  ro.a1.unit30.lesson04.teach.ana_imi_place:
    title: Ana의 취미
    gloss: 'Ana: 저는 책 읽는 걸 좋아하고 음악도 자주 들어요.'
    note: 1과와 2과의 취미 동사 두 개를 *și*(그리고)로 이어 한 문장으로 만들었어요.
  ro.a1.unit30.lesson04.teach.mihai_joci_si:
    title: Mihai가 게임에 대해 묻기
    gloss: 'Mihai: 너도 게임해요?'
    note: 2과의 *jocuri video*를 쓴 짧은 예/아니요 질문이에요. *joci*는 *a juca*의 *tu* 형태예요.
  ro.a1.unit30.lesson04.teach.ana_nu_nu:
    title: Ana의 대답
    gloss: 'Ana: 아니요, 저는 게임은 절대 안 해요. 대신 가끔 그림을 그려요!'
    note: 3과의 *niciodată*(절대)와 *uneori*(가끔)를 한 대답에서 대비해 썼어요. *nu ... niciodată*는 부정어가 두 번 나오는 이중 부정이에요.
  ro.a1.unit30.lesson05.teach.mihai_si_cu:
    title: 취미 비교하기
    gloss: Mihai와 저는 자주 함께 산책해요. 하지만 다른 취미도 있어요. Mihai는 요리하는 걸 좋아해서 집에서도 요리하고, 운동도 자주 해요. 저는 책 읽는 걸 좋아하고 음악도 자주 들어요. 가끔 그림도 그리지만 게임은 절대 안 해요. 너는 여가 시간에 뭐 하는 걸 좋아해요?
    note: Ana의 메시지는 4과의 내용을 정리하고, 이 단원의 핵심 질문을 읽는 사람에게 던지며 끝나요.
    glosses:
      plimbăm: 산책하다
      des: 자주
      împreună: 함께
      alte: 다른
      gătească: 요리하다
      place: 즐겨
      acasă: 집에서
      sport: 운동하다
      citesc: 읽다
      ascult: 듣다
      muzică: 음악
      desenez: 그리다
      uneori: 가끔
      joc: 게임하다
      niciodată: 전혀 하지 않다
      liber: 자유로운
      timpul: 시간
  ro.a1.unit30.lesson06.teach.mihai_ce_faci:
    title: Mihai가 주말 계획을 묻기
    gloss: 'Mihai: 이번 주말에 뭐 해요?'
    note: '*În acest weekend*(이번 주말)에서는 "이"라는 뜻으로 *acest*를 써요.'
  ro.a1.unit30.lesson06.teach.ana_inca_nu:
    title: Ana는 아직 정하지 못했어요
    gloss: 'Ana: 아직 모르겠어요. 책 읽는 걸 좋아하지만, 밖에도 나가고 싶어요.'
    note: '*Să ies afară*(밖에 나가다)는 집을 나서고 싶다고 말할 때 자주 쓰는 표현이에요. *vreau să* + 동사는 "~하고 싶어요"라는 뜻이에요.'
  ro.a1.unit30.lesson06.teach.mihai_hai_sa:
    title: Mihai의 제안
    gloss: 'Mihai: 같이 산책해요! 그 후에 제가 우리를 위해 요리할게요.'
    note: '*După aceea*(그 후에)는 순서를 나타내는 표현이에요. *Hai să* + 동사는 함께 무언가를 하자고 제안할 때 써요.'
  ro.a1.unit30.lesson06.teach.ana_buna_idee:
    title: Ana의 동의
    gloss: 'Ana: 좋은 생각이에요! 저는 산책하는 것도, 요리하는 것도 좋아해요.'
    note: '*Și ..., și ...*("~도 ~도")는 Ana가 두 가지를 똑같이 좋아한다는 뜻이에요. 한쪽을 더 좋아하는 게 아니에요.'
  ro.a1.unit30.lesson06.teach.mihai_perfect_atunci:
    title: Mihai의 확정
    gloss: 'Mihai: 좋아요. 그럼 토요일에 봐요!'
    note: '*sâmbătă*(토요일) 약속을 확인하는 다정한 마무리 말이에요. *ne vedem*은 "우리 서로 만나요"라는 뜻이에요.'
