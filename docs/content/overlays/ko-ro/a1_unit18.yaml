answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (casă, apartament, cameră, dormitor, bucătărie, baie, fereastră) is used only in person-invariant third-person statements ("Ana are...", "Mihai are...", "Unde este baia?", "Casa mea este mare"). No new tu/dumneavoastră form is introduced this unit; Ana and Mihai keep their existing formal register with each other in the dialogue's greeting lines.
course:
  title: 한국어로 배우는 루마니아어 A1
  description: 루마니아어로 기본적인 집 이야기하기 -- Casă(집), Apartament(아파트), Cameră(방), Dormitor(침실), Bucătărie(부엌), Baie(화장실), Fereastră(창문) -- 미하이가 아나의 집을 방문해서 각자 어디에 사는지 이야기해요.
units:
  ro.a1.unit18.housing:
    title: 주거
lessons:
  ro.a1.unit18.lesson01.casa_anei:
    title: 아나의 집
  ro.a1.unit18.lesson02.apartamentul_lui_mihai:
    title: 미하이의 아파트
  ro.a1.unit18.lesson03.vizita_la_ana:
    title: 아나의 집 방문
teaching:
  ro.a1.unit18.lesson01.teach.reminder_ana_mare:
    title: '복습: Ana, mare'
    gloss: Ana (이름) · mare (큰)
    note: Ana는 1단원부터 나온 등장인물의 이름이고, *mare*는 5단원과 14단원에서 배웠어요. 이번 단원에서는 이 두 말을 다시 써서 아나의 집을 설명해요.
  ro.a1.unit18.lesson01.teach.reminder_articole_trei:
    title: '복습: un, o, și, trei'
    gloss: un/o (하나의, 한) · și (그리고) · trei (셋)
    note: '*Un*/*o*/*și*는 5단원에서, *trei*는 2단원의 숫자 세기에서 배웠어요. 이번 단원에서는 이 네 말을 모두 다시 써서 방의 수를 세고 설명해요.'
  ro.a1.unit18.lesson01.teach.are_vocab:
    title: 가지고 있다
    gloss: Are (그/그녀/그것이 가지고 있다)
    note: '*a avea*(가지다)의 새로운 형태예요. *am*(나는 가지고 있다, 2단원과 5단원)과 *aveți*(당신은 가지고 있다, 공손한 표현)는 이미 배웠죠. *are*는 같은 동사의 3인칭 형태로, 어떤 사람이나 사물이 무엇을 가지고 있는지 말할 때 써요.'
  ro.a1.unit18.lesson01.teach.casa_vocab:
    title: 집
    gloss: Casă (집)
    note: 사람이 사는 곳이에요.
    example_gloss:
    - 아나는 큰 집이 있어요.
  ro.a1.unit18.lesson01.teach.camera_vocab:
    title: 방
    gloss: Cameră (방)
    note: 집 안의 방을 두루 가리키는 말이에요.
    example_gloss:
    - 아나는 큰 방이 있어요.
  ro.a1.unit18.lesson01.teach.camere_plural:
    title: Cameră → camere
    gloss: cameră (방) · camere (방들)
    note: '*cameră*의 복수형은 *camere*예요. 방이 둘 이상일 때 써요.'
  ro.a1.unit18.lesson01.teach.dormitor_vocab:
    title: 침실
    gloss: Dormitor (침실)
    note: 잠을 자는 방이에요.
    example_gloss:
    - 아나는 침실이 있어요.
  ro.a1.unit18.lesson01.teach.bucatarie_vocab:
    title: 부엌
    gloss: Bucătărie (부엌)
    note: 요리를 하는 방이에요.
    example_gloss:
    - 아나는 부엌이 있어요.
  ro.a1.unit18.lesson01.teach.baie_vocab:
    title: 화장실
    gloss: Baie (화장실)
    note: 욕조나 샤워기, 변기가 있는 방이에요.
    example_gloss:
    - 아나는 화장실이 있어요.
  ro.a1.unit18.lesson01.teach.casa_mare_phrase:
    title: 아나는 큰 집이 있어요. 그 집에는 침실, 부엌, 화장실, 이렇게 방이 세 개 있어요.
    gloss: 'Ana are o casă mare. Casa are trei camere: un dormitor, o bucătărie și o baie.'
    note: 여기 나온 단어는 모두 이미 배웠거나 방금 배운 것으로, 아나의 집에 관한 새 문장 두 개로 묶었어요. *Casa*는 *casă*의 정관사형으로 '그 집'이라는 뜻이에요. -ă로 끝나는 여성 명사는 -ă를 -a로 바꿔요. 8단원의 *banca*(그 은행)와 같아요.
  ro.a1.unit18.lesson02.teach.reminder_mihai_mic:
    title: '복습: Mihai, mic'
    gloss: Mihai (이름) · mic (작은)
    note: Mihai는 1단원부터 나온 등장인물의 이름이고, *mic*은 14단원에서 배웠어요. 이번 단원에서는 이 두 말을 다시 써서 미하이의 아파트를 설명해요.
  ro.a1.unit18.lesson02.teach.reminder_unde_este_doua:
    title: '복습: unde, este, două'
    gloss: unde (어디) · este (~이다, ~에 있다) · două (둘, 여성형)
    note: '*Unde*와 *este*는 8단원과 9단원에서 배웠고, *două*는 2단원에서 배운 ''둘''의 여성형이에요. 이번 단원에서는 이 세 말을 다시 써서 방에 대해 묻고 방의 수를 세요.'
  ro.a1.unit18.lesson02.teach.apartament_vocab:
    title: 아파트
    gloss: Apartament (아파트)
    note: 미하이가 사는 곳으로, 아나의 집보다 작은 주거 형태예요.
    example_gloss:
    - 미하이는 작은 아파트가 있어요.
  ro.a1.unit18.lesson02.teach.fereastra_vocab:
    title: 창문
    gloss: Fereastră (창문)
    note: '*Apartamentul*은 *apartament*의 정관사형으로 ''그 아파트''라는 뜻이에요. 자음으로 끝나는 중성 명사는 -ul을 붙여요. 8단원의 *magazinul*(그 가게)과 같아요. 여성 명사 *casă*는 대신 *casa*가 돼요.'
    example_gloss:
    - 그 아파트에는 큰 창문이 있어요.
  ro.a1.unit18.lesson02.teach.apartament_mic_phrase:
    title: 미하이는 작은 아파트가 있어요. 그 아파트에는 침실과 부엌, 이렇게 방이 두 개 있어요.
    gloss: 'Mihai are un apartament mic. Apartamentul are două camere: un dormitor și o bucătărie.'
    note: 여기 나온 단어는 모두 이미 배웠거나 방금 배운 것으로, 미하이의 아파트에 관한 새 문장 두 개로 묶었어요.
  ro.a1.unit18.lesson02.teach.unde_este_baia_phrase:
    title: 화장실이 어디예요?
    gloss: Unde este baia? (화장실이 어디예요?)
    note: '*Baia*는 *baie*의 정관사형으로 ''그 화장실''이라는 뜻이에요. 다른 사람의 집을 방문했을 때 실제로 유용한 질문이에요.'
  ro.a1.unit18.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: '복습: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (안녕하세요) · Ce mai faceți? (어떻게 지내세요?, 공손한 표현) · Bine, mulțumesc (잘 지내요, 감사합니다)
    note: 모두 1단원의 첫 인사에서 나온 표현이에요. 이번 단원의 대화를 시작할 때 다시 써요.
  ro.a1.unit18.lesson03.teach.reminder_la_revedere_mea_aproape_am:
    title: '복습: La revedere, Mea, Aproape, Am'
    gloss: La revedere (안녕히 가세요) · Mea (나의, 여성형) · Aproape (가까이) · Am (나는 가지고 있다)
    note: '*La revedere*는 1단원, *mea*는 5단원의 *Mama mea*, *aproape*는 8단원과 9단원의 *Unde este...?* 대답, *am*은 2단원과 5단원에서 배웠어요. 모두 집 방문 대화에서 다시 써요.'
  ro.a1.unit18.lesson03.teach.line01:
    title: 아나에게 인사하고 안부 묻기
    gloss: 미하이가 아나에게 인사하고 어떻게 지내는지 물어요.
    note: 1단원의 *Ce mai faceți?* 인사를 다시 써요.
  ro.a1.unit18.lesson03.teach.line02:
    title: 대답하고 우리 집 설명하기
    gloss: 아나가 대답한 다음, 미하이에게 자기 집이 크고 방이 세 개라고 말해요.
    note: 1단원의 *Bine, mulțumesc*와 이번 단원 첫 번째 레슨의 문장을 합쳤어요.
  ro.a1.unit18.lesson03.teach.line03:
    title: 화장실이 어디인지 묻기
    gloss: 미하이가 아나에게 화장실이 어디인지 물어요.
    note: 이번 단원 두 번째 레슨의 문장을 거의 그대로 다시 써요.
  ro.a1.unit18.lesson03.teach.line04:
    title: 화장실 위치 대답하기
    gloss: 아나가 화장실이 가까이에 있다고 알려 줘요.
    note: '*baia*와 *aproape*를 합쳤어요. 8단원과 9단원에서 익힌 ''어디에 있어요?''에 대한 대답 방식과 같아요.'
  ro.a1.unit18.lesson03.teach.line05:
    title: 내 아파트 설명하고 작별 인사하기
    gloss: 미하이가 자기는 방이 두 개인 작은 아파트가 있다고 말한 다음 작별 인사를 해요.
    note: 이번 단원 두 번째 레슨의 문장과 1단원의 마무리 인사를 합쳤어요.
  ro.a1.unit18.lesson03.teach.line06:
    title: 작별 인사하기
    gloss: 아나가 작별 인사를 해요.
    note: 앞선 모든 단원의 대화가 끝날 때 쓴 것과 같은 마무리 표현이에요.
