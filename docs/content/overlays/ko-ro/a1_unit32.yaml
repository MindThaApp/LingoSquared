    title: 동물에 대한 Mihai, Elena, Andrei의 이야기
    gloss: Mihai와 Elena는 둘 다 동물을 좋아하지만, 두 사람 모두 반려동물은 없어요. Mihai는 개를 좋아하고 Elena는 고양이를 좋아해요. 반면에 Andrei는 반려동물이 있어요. 바로 고양이예요. 그는 자기 고양이와 자주 놀아 주고 매일 밥을 줘요. 여러분은 반려동물이 있어요?
    note: 동물을 좋아하는 것과 실제로 키우는 것의 차이를 보여 줘요. 이 단원이 전하려는 핵심이에요.
    glosses:
      iubesc: 사랑해요
      amândoi: 둘 다
      animalele: 동물들
      doi: 둘 다
      companie: 반려동물
      câinii: 개들
      pisicile: 고양이들
      pisică: 고양이
      joacă: 놀아요
      dă: 줘요
      fiecare: 매
      mâncare: 먹이
