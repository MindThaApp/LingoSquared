    note: '루마니아어 동사는 인칭마다 어미가 바뀌어요. 그래서 *a scoate la plimbare*도 하나의 동사처럼 활용해요: *scot*, *scoți*, *scoate*.'
  ro.a1.unit32.lesson02.teach.a_da_de:
