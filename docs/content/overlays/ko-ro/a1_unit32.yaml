    note: '*O cheamă*(''이름이 ~이다'')는 이름을 말할 때 쓰는 동사 *a chema*를 다시 쓴 표현이에요. 새는 여성 명사라서 대명사가 *o*예요.'
  ro.a1.unit32.lesson06.teach.mihai_ce_frumos:
    title: Mihai가 반응해요
    gloss: '미하이: 멋지네요! 매일 그 새와 무엇을 하세요?'
  ro.a1.unit32.lesson06.teach.nina_ii_dau:
    title: 니나는 매일 새에게 먹이를 줘요
    gloss: '니나: 매일 먹이를 줘요.'
  ro.a1.unit32.lesson06.teach.mihai_iubesc_si:
    title: Mihai도 새를 좋아해요
