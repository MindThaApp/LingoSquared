    gloss: 먹이를 주다
    example_gloss: 저는 매일 고양이에게 먹이를 줘요.
  ro.a1.unit32.lesson02.teach.a_se_juca:
    title: ~와 놀다
    gloss: ~와 놀다
    example_gloss: Andrei는 자기 고양이와 놀아요.
  ro.a1.unit32.lesson02.teach.scot_cainele_la:
    title: 저는 매일 개를 산책시켜요
    gloss: 저는 매일 개를 산책시켜요.
