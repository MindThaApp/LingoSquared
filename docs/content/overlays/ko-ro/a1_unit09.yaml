answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit introduces the course's first imperative form, "Mergeți" (go) -- the dumneavoastră/formal-plural imperative, matching the course's established dumneavoastră-as-safe-default policy. No tu-register imperative is taught or accepted here. Ana and Mihai's direction-giving dialogue keeps their existing polite register with each other, matching 6단원/unit07/unit08.
course:
  title: 한국어로 배우는 루마니아어 A1
  description: 루마니아어로 짧은 길 안내를 묻고 따라가는 법을 배워요. Cum pot să ajung...?(~에 어떻게 가요?), Mergeți înainte(똑바로 가세요), la dreapta / la stânga(오른쪽으로 / 왼쪽으로), aici / acolo(여기 / 저기)를 배우며, 아나가 미하이에게 기차역에 가는 길을 묻는 이야기가 이어져요.
units:
  ro.a1.unit09.directions:
    title: 길 안내
lessons:
  ro.a1.unit09.lesson01.cum_ajung:
    title: ~에 어떻게 가요?
  ro.a1.unit09.lesson02.dreapta_stanga:
    title: 오른쪽으로, 왼쪽으로
  ro.a1.unit09.lesson03.pe_strada:
    title: 길에서
teaching:
  ro.a1.unit09.lesson01.teach.reminder_unde_este_locuri:
    title: '복습: unde, este, gară, magazin, bancă, aproape'
    gloss: unde(어디) · este(~이다, ~에 있다) · gară(기차역) · magazin(가게) · bancă(은행) · aproape(가까운)
    note: 모두 이미 배운 말이에요. unde는 7단원, este는 3·4단원, gară/magazin/bancă/aproape는 8단원에서 나왔어요. 여기서는 이 단어들을 합쳐 길을 묻는 질문과 예문을 만들어요.
  ro.a1.unit09.lesson01.teach.cum_pot_sa_ajung:
    title: ~에 어떻게 가요?
    gloss: Cum pot să ajung...? (~에 어떻게 가요?)
    note: 장소에 가는 방법을 물을 때 일상적으로 쓰는 말이에요. *pot*(할 수 있다)는 7단원의 *Unde pot să cumpăr...?*에 이미 나왔고, *ajung*(도착하다)은 새로 나온 말이에요.
  ro.a1.unit09.lesson01.teach.mergeti_vocab:
    title: 가세요
    gloss: Mergeți (가세요 -- 존댓말 명령형)
    note: '*Mergeți*는 dumneavoastră(존칭)에 쓰는 명령형이에요. 상대에게 정중하게 가라고 말하는 방식이고, 아나와 미하이가 서로 말하는 방식과도 맞아요.'
    example_gloss:
    - 똑바로 가세요.
  ro.a1.unit09.lesson01.teach.inainte_vocab:
    title: 똑바로
    gloss: înainte (똑바로)
    note: '*Mergeți*와 짝을 이뤄 가장 간단한 길 안내가 돼요.'
    example_gloss:
    - 똑바로 가세요.
  ro.a1.unit09.lesson01.teach.mergeti_inainte_phrase:
    title: 곧장 가요
    gloss: Mergeți înainte. (똑바로 가세요.)
    note: '*Cum pot să ajung...?*에 대한 가장 간단하고 완전한 대답이에요.'
  ro.a1.unit09.lesson01.teach.cum_ajung_gara:
    title: 기차역에 어떻게 가요?
    gloss: Cum pot să ajung la gară? (기차역에 어떻게 가요?)
    note: '*Cum pot să ajung...?*와 *gară*를 하나의 완전한 질문으로 합쳤어요. *la*(~로, ~에)가 질문과 목적지를 이어 줘요. *la* 뒤에서는 장소가 기본형을 유지해서 *la gara*가 아니라 *la gară*라고 해요.'
  ro.a1.unit09.lesson01.teach.cum_ajung_banca:
    title: 은행에 어떻게 가요?
    gloss: Cum pot să ajung la bancă? (은행에 어떻게 가요?)
    note: 같은 패턴이고 이번에는 은행이에요. 8단원에서 은행이 멀다고 이미 배웠으니 자연스러운 질문이에요.
  ro.a1.unit09.lesson02.teach.dreapta_stanga_vocab:
    title: 오른쪽으로, 왼쪽으로
    gloss: la dreapta(오른쪽으로) · la stânga(왼쪽으로)
    note: '기본적인 두 가지 방향 전환이에요. *la*(~로)와 함께 하나의 짝으로 외우세요: *la dreapta*, *la stânga*.'
    example_gloss:
    - 오른쪽으로 가세요.
    - 왼쪽으로 가세요.
  ro.a1.unit09.lesson02.teach.mergeti_dreapta_phrase:
    title: 오른쪽으로 가세요
    gloss: 오른쪽으로 가세요.
    note: '*Mergeți înainte.*와 같은 *Mergeți* 명령인데, 직진 대신 방향을 틀어요.'
  ro.a1.unit09.lesson02.teach.mergeti_stanga_phrase:
    title: 왼쪽으로 가세요
    gloss: 왼쪽으로 가세요.
    note: 반대쪽으로 도는 표현이에요. 패턴은 똑같이 간단해요.
  ro.a1.unit09.lesson02.teach.aici_acolo_vocab:
    title: 여기, 저기
    gloss: 여기 · 저기
    note: 도착했거나 눈에 보일 때 무언가가 어디에 있는지 알려 주는 간단한 방법이에요. 8단원의 aproape/departe는 위치가 아니라 거리를 나타내므로 서로 달라요.
    example_gloss:
    - 가게는 여기에 있어요.
    - 기차역은 저쪽에 있어요.
  ro.a1.unit09.lesson02.teach.magazinul_aici_phrase:
    title: 가게는 여기에 있어요
    gloss: 가게는 여기에 있어요.
    note: 짧고 완전한 문장이에요. *aici*는 지금 있는 바로 이곳에 있는 것을 가리켜요.
  ro.a1.unit09.lesson02.teach.gara_acolo_phrase:
    title: 기차역은 저쪽에 있어요
    gloss: 기차역은 저쪽에 있어요.
    note: '*Acolo*는 눈에 보이지만 지금 있는 바로 이곳은 아닌 곳을 가리켜요. 길 안내를 마무리할 때 자연스럽게 쓰는 말이에요.'
  ro.a1.unit09.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: '복습: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: 안녕하세요 · 감사합니다 · 안녕히 계세요 · 네 · 아나, 미하이(이름)
    note: 모두 앞 단원에서 이미 배운 표현이에요. 여기서는 Ana가 Mihai에게 길을 물어요.
  ro.a1.unit09.lesson03.teach.apoi:
    title: 그다음에
    gloss: 그다음에 / 그러고 나서
    note: 두 길 안내 단계를 하나의 안내로 이어 줘요. 한 번에 여러 단계를 말할 때 쓰는 자연스러운 방법이에요.
    example_gloss:
    - 직진하고, 그다음에 오른쪽으로 가세요.
  ro.a1.unit09.lesson03.teach.line01:
    title: 인사하고 기차역 가는 길 묻기
    gloss: Ana가 Mihai에게 인사하고 기차역에 어떻게 가는지 물어요.
    note: 이 단원의 *Cum pot să ajung*과 1단원의 인사를 합친 표현이에요.
  ro.a1.unit09.lesson03.teach.line02:
    title: 두 단계로 길 안내하기
    gloss: Mihai가 직진한 다음 오른쪽으로 가라고 말해요.
    note: 이 단원의 *Mergeți înainte*와 *la dreapta*를 *apoi*로 이어요.
  ro.a1.unit09.lesson03.teach.line03:
    title: 가까운지 묻기
    gloss: Ana가 기차역이 가까운지 물어요.
    note: 8단원의 *este*와 *aproape*를 다시 쓰는 짧은 후속 질문이에요.
  ro.a1.unit09.lesson03.teach.line04:
    title: 확인해 주고 위치 알려 주기
    gloss: Mihai가 가깝다고 확인해 주고, 기차역이 저쪽에 있다고 알려 줘요.
    note: '*aproape*와 *acolo*, 즉 거리와 위치를 한 문장에 합쳤어요.'
  ro.a1.unit09.lesson03.teach.line05:
    title: 감사 인사하고 마무리하기
    gloss: Ana가 Mihai에게 감사 인사를 하고 작별 인사를 해요.
    note: 1단원과 8단원의 대화에서 썼던 것과 같은 감사 인사예요.
  ro.a1.unit09.lesson03.teach.line06:
    title: 만남 마무리하기
    gloss: Mihai가 Ana의 이름을 부르며 작별 인사에 답해요.
    note: 1, 5, 6, 7, 8단원의 대화가 모두 이 다정한 패턴으로 끝났어요.
