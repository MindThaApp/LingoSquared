teaching:
  ro.a1.unit20.lesson01.teach.reminder_vreau_un_ce:
    title: '복습: Vreau, Un, Ce'
    gloss: Vreau(원해요) · Un(하나의, 남성·중성) · Ce(무엇, 어떤)
    note: '*Vreau*(원해요), *un*(하나의), *ce*(무엇, *Ce mai faceți?*에서처럼)는 이미 아는 단어예요. 여기서는 옷을 달라고 할 때 다시 써요.'
  ro.a1.unit20.lesson01.teach.tricou_vocab:
    title: 티셔츠
    gloss: Tricou(티셔츠)
    note: 중성 명사예요. *un leu*처럼 앞에서 본 다른 남성·중성 명사와 같이 *o*가 아니라 *un*을 써요.
    example_gloss:
    - 티셔츠를 원해요.
  ro.a1.unit20.lesson01.teach.culoare_vocab:
    title: 색
    gloss: Culoare(색)
    note: 여성 명사예요. 무슨 색이 있는지 물을 때 유용해요.
    example_gloss:
    - 무슨 색이에요?
  ro.a1.unit20.lesson01.teach.rosu_vocab:
    title: 빨간색
    gloss: Roșu(빨간색)
    note: '꾸미는 명사 뒤에 와요. 루마니아어 형용사의 일반적인 어순이에요: *tricou roșu*는 직역하면 ''티셔츠 빨간''이에요.'
    example_gloss:
    - 빨간 티셔츠를 원해요.
  ro.a1.unit20.lesson01.teach.albastru_vocab:
    title: 파란색
    gloss: Albastru(파란색)
    note: '*roșu*와 같은 방식으로 명사 뒤에 와요: *tricou albastru*.'
    example_gloss:
    - 파란 티셔츠를 원해요.
  ro.a1.unit20.lesson01.teach.vreau_tricou_rosu_phrase:
    title: 빨간 티셔츠를 원해요.
    gloss: Vreau un tricou roșu.
    note: '기본 요청 문장이에요: *vreau*(원해요) + *un tricou*(티셔츠) + *roșu*(빨간색). 색깔 말은 명사 뒤에 와요.'
  ro.a1.unit20.lesson02.teach.reminder_cat_costa_va_rog:
    title: '복습: Cât, Costă, Vă, Rog'
    gloss: Cât costă?(얼마예요?) · Vă rog(부탁드려요, 격식)
    note: '*Cât costă?*는 시장 레슨에서 배웠고, *vă rog*는 격식을 갖춘 ''부탁드려요''예요. 여기서는 옷의 가격을 묻고 요청을 부드럽게 할 때 다시 써요.'
  ro.a1.unit20.lesson02.teach.reminder_mic_mica_mare:
    title: '복습: Mic, Mică, Mare'
    gloss: Mic/Mică(작은, 남성·중성/여성) · Mare(큰, 남성·여성 단수가 같은 형태)
    note: 음식과 음료를 비교하며 이미 배운 크기 단어예요. 여기서는 옷 사이즈를 말할 때 다시 써요.
  ro.a1.unit20.lesson02.teach.pantaloni_vocab:
    title: 바지
    gloss: Pantaloni(바지)
    note: 한국어 '바지'는 단수 형태로 쓰지만, 루마니아어에서는 보통 복수형으로 써요. *pantaloni* 하나가 바지 한 벌을 뜻해요.
    example_gloss:
    - 바지를 원해요.
  ro.a1.unit20.lesson02.teach.marime_vocab:
    title: 사이즈
    gloss: Mărime(사이즈)
    note: 여성 명사예요. 위에서 복습한 여성형 *mică*(작은)와 형태가 변하지 않는 *mare*(큰)와 함께 써요.
    example_gloss:
    - 무슨 사이즈예요?
  ro.a1.unit20.lesson02.teach.ce_marime_phrase:
    title: 무슨 사이즈예요?
    gloss: Ce mărime?(무슨 사이즈예요?)
    note: 가게 계산대에서 늘 듣는 질문이에요. 동사 없이 짧게 말하며, *Ce culoare?*(무슨 색이에요?)와 같은 생략형 구조예요.
  ro.a1.unit20.lesson02.teach.marime_mica_va_rog_phrase:
    title: 작은 사이즈로 주세요.
    gloss: 작은 사이즈로 주세요.
    note: '*Mică*는 *mic*의 여성형이고, 여성 명사 *mărime*에 맞춘 형태예요. 앞에서 복습한 *vă rog*와 함께 쓰면 자신의 사이즈를 공손하게 말할 수 있어요.'
  ro.a1.unit20.lesson02.teach.cat_costa_pantalonii_phrase:
    title: 바지는 얼마예요?
    gloss: Cât costă pantalonii? (바지는 얼마예요?)
    note: '*Pantalonii*는 *pantaloni*(''바지'')의 정관사형이에요. 남성 복수 명사는 *-i*를 붙여 ''그 ~''를 나타내요(*pantaloni* → *pantalonii*). 앞에서 복습한 *cât costă*와 함께 쓰여요.'
  ro.a1.unit20.lesson03.teach.reminder_buna_multumesc_bine_la_revedere_si:
    title: '복습: Bună, Mulțumesc, Bine, La revedere, Și'
    gloss: Bună (안녕하세요) · Mulțumesc (감사합니다) · Bine (좋아요/잘 지내요) · La revedere (안녕히 가세요) · Și (그리고)
    note: 일상적인 인사말과 *și*(그리고)예요. 여기서는 가게 대화를 시작하고 마무리할 때 다시 쓰여요.
  ro.a1.unit20.lesson03.teach.reminder_zece_douazeci_de_lei:
    title: '복습: Zece, Douăzeci, De, Lei'
    gloss: Zece (십) · Douăzeci (이십) · De (~의, 20 이상일 때 lei 앞에 씀) · Lei (화폐 단위, leu의 복수형)
    note: 이미 알고 있는 숫자와 화폐 단위 *leu/lei*예요. 여기서는 티셔츠와 바지 가격을 말할 때 다시 쓰여요.
  ro.a1.unit20.lesson03.teach.line01:
    title: 미하이에게 인사하고 빨간 티셔츠 달라고 하기
    gloss: 아나가 미하이에게 인사하고 빨간 티셔츠를 원한다고 말해요.
    note: '첫 번째 수업에서 배운 요청 표현이에요: *Vreau un tricou roșu.*'
  ro.a1.unit20.lesson03.teach.line02:
    title: 어떤 사이즈인지 묻기
    gloss: 미하이가 어떤 사이즈를 원하는지 물어요.
    note: 가게에서 자주 듣는 질문 *Ce mărime?*(어떤 사이즈예요?)예요.
  ro.a1.unit20.lesson03.teach.line03:
    title: 공손하게 사이즈를 말하고 가격 묻기
    gloss: 아나가 작은 사이즈를 달라고 한 다음 얼마인지 물어요.
    note: '*Mărime mică, vă rog*(작은 사이즈로 주세요) 다음에 *Cât costă?*(얼마예요?)가 이어져요.'
  ro.a1.unit20.lesson03.teach.line04:
    title: 가격 말하기
    gloss: 미하이가 오십 레이라고 말해요.
    note: 앞에서 복습한 *cincizeci de lei*를 써요.
  ro.a1.unit20.lesson03.teach.line05:
    title: 동의하고 바지도 물어보기
    gloss: 아나가 알겠다고 한 다음, 바지도 원한다며 가격을 물어요.
    note: '여기서 *Și*는 ''~도''라는 뜻이에요: *Vreau și pantaloni* -- ''바지도 원해요.'''
  ro.a1.unit20.lesson03.teach.line06:
    title: 바지 가격 말하기
    gloss: 미하이가 바지는 백이십 레이라고 말해요.
    note: '스무 이상의 수에서는 루마니아어가 수와 명사 사이에 *de*를 넣어요: *o sută douăzeci de lei*.'
  ro.a1.unit20.lesson03.teach.line07:
    title: 미하이에게 감사 인사와 작별 인사하기
    gloss: 아나가 고맙다고 하고 작별 인사를 해요.
    note: 공손한 감사 인사와 작별 인사예요.
  ro.a1.unit20.lesson03.teach.line08:
    title: 작별 인사하기
    gloss: 미하이가 작별 인사를 해요.
    note: 아나의 이름을 덧붙인 간단한 작별 인사예요.
