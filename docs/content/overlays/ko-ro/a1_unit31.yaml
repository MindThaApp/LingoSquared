answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: 한국어로 배우는 루마니아어 A1
  description: '사람의 기본적인 외모를 묘사하는 초급 루마니아어: 키와 나이에 대한 인상, 머리카락과 눈 색깔, 핵심 질문 Cum arată ...?, 그리고 두 사람의 외모 비교를 배워요.'
units:
  ro.a1.unit31.aspect:
    title: 외모 묘사하기
lessons:
  ro.a1.unit31.lesson01.inalt_scund_batran_si:
    title: 키가 큰, 키가 작은, 나이 든, 젊은
  ro.a1.unit31.lesson02.descrierea_parului:
    title: 머리카락 묘사하기
  ro.a1.unit31.lesson03.ochii_si_cum_arata:
    title: 눈, 그리고 어떻게 생겼는지 묻기
  ro.a1.unit31.lesson04.ana_o_descrie_pe:
    title: 아나가 니나를 묘사해요
  ro.a1.unit31.lesson05.ii_comparam_pe_andrei:
    title: 안드레이와 엘레나 비교하기
  ro.a1.unit31.lesson06.mihai_o_recunoaste_pe:
    title: 미하이가 니나를 알아봐요
teaching:
  ro.a1.unit31.lesson01.teach.inalt_scund:
    title: 키가 큰, 키가 작은
    gloss: 키가 큰 / 키가 작은
    note: '*Înalt*는 키가 큰 사람을, *scund*는 키가 작은 사람을 나타내요. 둘 다 여성형이 있어요: *înaltă*, *scundă*.'
    example_gloss:
    - 엘레나는 키가 커요.
    - 안드레이는 키가 작아요.
  ro.a1.unit31.lesson01.teach.batran_tanar:
    title: 나이 든, 젊은
    gloss: 나이 든 / 젊은
    note: '*Bătrân*과 *tânăr*는 여기서 정확한 나이가 아니라 전반적인 나이의 인상을 나타내요. 여성형: *bătrână*, *tânără*.'
    example_gloss:
    - 할아버지는 연세가 많으세요.
    - 미하이는 젊어요.
  ro.a1.unit31.lesson01.teach.pentru_varsta_exacta:
    title: 'Bătrân: 인상일까, 숫자일까'
    gloss: 정확한 나이는 Câți ani ai?로 묻고, bătrân은 Bunicul este bătrân.처럼 전반적인 인상을 나타내요.
    note: 정확한 나이는 *Câți ani ai?*로 물을 수 있어요. 여기서 *bătrân*은 숫자 없이 그 사람이 얼마나 나이 들어 보이는지를 나타내요.
  ro.a1.unit31.lesson01.teach.elena_este_inalta:
    title: 엘레나는 키가 크고 안드레이는 키가 작아요
    gloss: 엘레나는 키가 크고 안드레이는 키가 작아요.
    note: '*și*(그리고)로 이어진 간단한 문장으로, 5과의 직접 비교를 준비해요. 형용사는 주어에 맞춰 달라져요: 엘레나는 *înaltă*, 안드레이는 *scund*.'
  ro.a1.unit31.lesson02.teach.parul:
    title: 머리카락
    gloss: 머리카락
    note: '*Păr*는 남성 명사예요. 관사는 끝에 붙어요: *părul* (그 머리카락).'
    example_gloss: 미하이는 짧은 검은 머리예요.
  ro.a1.unit31.lesson02.teach.blond_maro_carunt:
    title: 금발, 갈색, 회색
    gloss: 금발 / 갈색 / 회색
    note: 머리카락 색깔 세 가지예요. 명사 *păr*(남성) 뒤에 와서 *părul blond*, *păr maro*, *păr cărunt*처럼 말해요.
    example_gloss:
    - 아나는 금발이에요.
    - 안드레이는 갈색 머리예요.
    - 할아버지는 백발이에요.
  ro.a1.unit31.lesson02.teach.lung_scurt:
    title: 긴 머리, 짧은 머리
    gloss: 긴 / 짧은 (머리)
    note: '*Lung*(긴)과 *scurt*(짧은)는 머리카락 길이를 나타내요. 색깔처럼 명사 뒤에 와요.'
    example_gloss:
    - 엘레나는 머리가 길어요.
    - 안드레이는 머리가 짧아요.
  ro.a1.unit31.lesson02.teach.adjectivul_vine_dupa:
    title: 형용사는 명사 뒤에 와요
    gloss: '형용사는 명사 뒤에 와요: păr scurt, păr lung, păr blond, păr maro, păr cărunt, păr negru.'
    note: 루마니아어에서는 형용사가 명사 뒤에 와요(*păr scurt*). 한국어에서 형용사가 명사 앞에 오는 것(짧은 머리)과 순서가 반대예요.
  ro.a1.unit31.lesson02.teach.posesivul_vine_dupa:
    title: 그의, 그녀의는 명사 뒤에 와요
    gloss: '소유를 나타내는 말은 명사 뒤에 와요: părul ei (그녀의 머리카락), ochii lui (그의 눈).'
    note: '*Ei*는 ''그녀의'', *lui*는 ''그의''라는 뜻이고, 둘 다 명사 뒤에 와요: *părul ei*. 누구를 가리키는지는 문맥으로 알 수 있어요.'
  ro.a1.unit31.lesson02.teach.mihai_are_parul:
    title: 미하이는 짧은 검은 머리예요
    gloss: 미하이는 짧은 검은 머리예요.
    note: '*Negru*(검은)는 색깔 형용사로 명사 뒤에 와요: *păr negru*.'
  ro.a1.unit31.lesson02.teach.ana_are_parul:
    title: 아나는 긴 금발이에요
    gloss: 아나는 긴 금발이에요.
    note: 이번 과의 길이와 색 어휘를 자연스러운 한 문장에 모았어요.
  ro.a1.unit31.lesson03.teach.ochii:
    title: 눈
    gloss: 눈
    note: '*Ochi*(눈)는 단수와 복수의 형태가 같아요. 관사로 수를 구별해요: *ochiul* (그 눈 한 개), *ochii* (그 눈들).'
    example_gloss: 미하이는 눈이 갈색이에요.
  ro.a1.unit31.lesson03.teach.albastru_maro_verde:
    title: 파란색, 갈색, 초록색
    gloss: 파란색 / 갈색 / 초록색
    note: '*Albastru*(파란), *maro*(갈색), *verde*(초록)는 색깔 형용사예요. *Maro*는 변하지 않고, 복수에서 *albastru*는 *albaștri*, *verde*는 *verzi*가 돼요.'
    example_gloss:
    - 아나는 눈이 파란색이에요.
    - 안드레이는 눈이 갈색이에요.
    - 엘레나는 눈이 초록색이에요.
  ro.a1.unit31.lesson03.teach.la_plural_adjectivul:
    title: 복수 형용사
    gloss: '복수에서는 형용사가 변해요: ochi albaștri, ochi maro, ochi verzi.'
    note: 복수 *ochi*와 함께 쓰면 형용사도 복수형이 돼요(*albaștri*, *verzi*). *maro*는 그대로예요. 단수 *păr albastru*와 비교해 보세요.
  ro.a1.unit31.lesson03.teach.cum_arata_ana:
    title: 아나는 어떻게 생겼어요?
    gloss: 아나는 어떻게 생겼어요?
    note: '*Cum arată ...?*는 이 단元의 핵심 질문이에요. 누구의 외모든 물을 때 쓸 수 있어요.'
  ro.a1.unit31.lesson03.teach.ana_are_parul:
    title: 아나는 긴 금발에 눈이 파란색이에요
    gloss: 아나는 긴 금발에 눈이 파란색이에요.
    note: '*și*로 머리카락과 눈을 한 문장에 묶은 모범 답이에요.'
  ro.a1.unit31.lesson04.teach.ana_vine_o:
    title: 아나가 니나를 소개해요
    gloss: '아나: 언어 카페에 새로운 여자애가 올 거야. 이름은 니나야.'
    note: '*Vine o fată nouă*(새로운 여자애가 온다)는 새로운 사람을 소개하는 표현이고, *O cheamă Nina*는 그녀의 이름을 말해요.'
  ro.a1.unit31.lesson04.teach.mihai_bine_cum:
    title: 미하이가 어떻게 생겼는지 물어요
    gloss: '미하이: 좋아! 어떻게 생겼어?'
    note: '이름 없이 이 단원의 핵심 질문을 다시 써요: *Cum arată?* (누구인지는 문맥으로 알 수 있어요.)'
  ro.a1.unit31.lesson04.teach.ana_este_scunda:
    title: 아나가 니나의 키와 머리를 묘사해요
    gloss: '아나: 키가 작고 짧은 금발이야.'
    note: 1과의 *scundă*와 2과의 머리카락 어휘를 합친 문장이에요.
  ro.a1.unit31.lesson04.teach.mihai_si_ochii:
    title: 미하이가 눈에 대해 물어요
    gloss: '미하이: 눈은?'
    note: '*Și ochii?*("그럼 눈은?")는 짧은 되묻기 질문이에요. 누구인지는 문맥으로 알 수 있어요.'
  ro.a1.unit31.lesson04.teach.ana_are_ochi:
    title: 아나가 니나의 눈을 묘사해요
    gloss: '아나: 눈이 초록색이야.'
    note: 3과의 *ochi verzi*를 다시 써요.
  ro.a1.unit31.lesson04.teach.mihai_multumesc_atunci:
    title: 미하이가 그녀를 알아볼 거예요
    gloss: '미하이: 고마워! 그럼 꼭 알아볼 수 있겠다.'
    note: '*O recunosc*는 ''그녀를 알아볼 거예요''라는 뜻이에요. *o*는 ''그녀를''에 해당하는 목적어 대명사로 동사 앞에 와요.'
  ro.a1.unit31.lesson05.teach.andrei_si_elena:
    title: 안드레이와 엘레나 비교하기
    gloss: 안드레이와 엘레나는 남매지만 생김새가 달라요. 안드레이는 키가 작고 짧은 갈색 머리에 눈이 갈색이에요. 엘레나는 안드레이보다 키가 크고 긴 갈색 머리에 눈이 초록색이에요. 당신은 어떻게 생겼어요?
    note: 지금까지 배운 색과 길이 어휘를 모두 다시 쓴 짧은 비교 글이에요. 마지막에는 이번 단원의 핵심 질문을 읽는 사람에게 던져요.
    glosses:
      frate: 남자 형제
      soră: 여자 형제
      arată: ~해 보이다
      diferit: 다른
      scund: 짧은
      scurt: 짧은
      maro: 갈색
      părul: 머리카락
      ochi: 눈
      înaltă: 키가 더 큰
      lung: 긴
      verzi: 초록색
      arăți: 생기다, ~해 보이다 (어떻게 생겼는지 말할 때)
  ro.a1.unit31.lesson05.teach.comparativul_se_formeaza:
    title: mai ... decât로 비교하기
    gloss: '비교급은 mai + 형용사 + decât로 만들어요: Elena este mai înaltă decât Andrei.'
    note: '루마니아어는 형용사 앞에 *mai*(''더'')를, 비교 대상 앞에 *decât*(''~보다'')를 써요: *mai înaltă decât Andrei*. 한국어에서 ''~보다''가 비교 대상 뒤에 붙는 것과 순서가 달라요.'
  ro.a1.unit31.lesson05.teach.elena_are_parul:
    title: 엘레나는 안드레이보다 머리가 길어요
    gloss: 엘레나는 안드레이보다 머리가 길어요.
    note: '*Mai lung*도 *decât* 앞에서 같은 방식으로 쓰여요: *părul mai lung decât Andrei*. 형용사는 여전히 *părul* 뒤에 와요.'
  ro.a1.unit31.lesson05.teach.am_parul_scurt:
    title: 저는 짧은 갈색 머리예요
    gloss: 저는 짧은 갈색 머리예요.
    note: '*Am ...*을 쓴 1인칭 모범 문장이에요. 내 외모를 말할 때 그대로 쓸 수 있어요.'
  ro.a1.unit31.lesson06.teach.mihai_uite_ea:
    title: 미하이가 니나를 발견해요
    gloss: '미하이: 저기, 저 사람이 니나야? 짧은 금발에 눈이 초록색이네.'
    note: '*Uite*(저기 봐)는 주의를 끄는 말이고, *ea e Nina?*는 ''저 사람이 니나야?''라고 묻는 말이에요.'
  ro.a1.unit31.lesson06.teach.ana_da_ea:
    title: 아나가 확인해 줘요
    gloss: '아나: 응, 니나 맞아!'
    note: 짧고 자연스러운 확인 표현이에요.
  ro.a1.unit31.lesson06.teach.nina_salut_tu:
    title: 니나가 미하이에게 인사해요
    gloss: '니나: 안녕, 네가 미하이야?'
    note: '간단한 친근한 인사 질문이에요: *tu ești ...?*'
  ro.a1.unit31.lesson06.teach.mihai_da_ma:
    title: 미하이가 니나에게 답인사를 해요
    gloss: '미하이: 응! 만나서 반가워, 니나.'
    note: '*Mă bucur să te cunosc*("만나서 반가워요")는 처음 만날 때 쓰는 기본 표현이에요.'
  ro.a1.unit31.lesson06.teach.nina_si_eu:
    title: Nina도 인사를 받아 줘요
    gloss: 'Nina: 나도 만나서 반가워!'
    note: 대화를 마무리해요. 미하이는 아나의 설명 덕분에 니나를 알아봤어요.
exercises:
  ro.a1.unit31.lesson01.exercise01.choose_elena_este_inalta:
    instruction: '''Elena este înaltă.''의 뜻을 고르세요.'
    correct_option: 엘레나는 키가 커요.
    distractors:
    - 엘레나는 키가 작아요.
    - 엘레나는 나이가 많아요.
    - 엘레나는 젊어요.
    accepted_answers:
    - value: 엘레나는 키가 커요.
      status: correct
    feedback: Elena este înaltă.
  ro.a1.unit31.lesson01.exercise02.listen_andrei_este_scund:
    instruction: 듣고 화자가 말하는 내용을 고르세요.
    correct_option: 안드레이는 키가 작아요.
    distractors:
    - 안드레이는 키가 커요.
    - 안드레이는 나이가 많아요.
    - 안드레이는 젊어요.
    accepted_answers:
    - value: 안드레이는 키가 작아요.
      status: correct
    feedback: Andrei este scund.
  ro.a1.unit31.lesson01.exercise03.match_inalt_scund_batran:
    instruction: 각 루마니아어 단어나 표현을 알맞은 뜻과 연결하세요.
    accepted_answers:
    - value:
      - left: înalt
        right: 키가 큰
      - left: scund
        right: 키가 작은
      - left: bătrân
        right: 나이가 많은
      - left: tânăr
        right: 젊은
      - left: Elena este înaltă.
        right: Elena는 키가 커요.
      - left: Andrei este scund.
        right: Andrei는 키가 작아요.
      - left: Bunicul este bătrân.
        right: 할아버지는 나이가 많으세요.
      status: correct
    feedback: Înalt/scund/bătrân/tânăr는 전반적인 키와 나이의 인상을 나타내요.
    pairs:
    - left: înalt
      right: 키가 큰
    - left: scund
      right: 키가 작은
    - left: bătrân
      right: 나이가 많은
    - left: tânăr
      right: 젊은
    - left: Elena este înaltă.
      right: Elena는 키가 커요.
    - left: Andrei este scund.
      right: Andrei는 키가 작아요.
    - left: Bunicul este bătrân.
      right: 할아버지는 나이가 많으세요.
  ro.a1.unit31.lesson01.exercise04.order_elena_este_inalta:
    instruction: 단어를 순서대로 놓아 '엘레나는 키가 크고 안드레이는 키가 작아요.'를 루마니아어로 만드세요.
    correct_option: Elena este înaltă și Andrei este scund
    accepted_answers:
    - value: Elena este înaltă și Andrei este scund
      status: correct
    feedback: Elena este înaltă și Andrei este scund.
  ro.a1.unit31.lesson01.exercise05.listen_bunicul_este_batran:
    instruction: 들리는 순서대로 단어를 배열하세요.
    correct_option: Bunicul este bătrân
    accepted_answers:
    - value: Bunicul este bătrân
      status: correct
    feedback: 완성된 문장은 Bunicul este bătrân.이에요.
  ro.a1.unit31.lesson01.exercise06.translate_tanar:
    instruction: '루마니아어로 번역하세요: 젊은.'
    accepted_answers:
    - value: tânăr
      status: correct
    feedback: Tânăr는 '젊은'이라는 뜻이에요.
    prompt_blocks:
    - 젊은
  ro.a1.unit31.lesson02.exercise01.choose_ana_are_parul:
    instruction: '''Ana are părul lung și blond.''의 뜻을 고르세요.'
