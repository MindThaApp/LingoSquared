answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (tren, pleacă, bilet, peron, București, Drum bun) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing formal register with each other; no new tu/dumneavoastră form is introduced this unit.
course:
  title: 한국어로 배우는 루마니아어 A1
  description: 루마니아어로 기본적인 기차 여행 표현 익히기 -- Tren(기차), Bilet(표), Peron(승강장), Pleacă(출발해요) -- Mihai가 București행 기차를 타고, Ana가 gară에서 배웅해요.
units:
  ro.a1.unit15.travel:
    title: 여행
lessons:
  ro.a1.unit15.lesson01.trenul_pleaca:
    title: 기차가 출발해요
  ro.a1.unit15.lesson02.un_bilet_va_rog:
    title: 표 한 장 주세요
  ro.a1.unit15.lesson03.la_gara:
    title: 기차역에서
teaching:
  ro.a1.unit15.lesson01.teach.reminder_gara_ora:
    title: '복습: gară, este, la, ce, oră, ora, nouă'
    gloss: gară (기차역) · este (~이에요/있어요) · la (~에) · ce (무슨, 어떤) · oră (시간) · ora (그 시각) · nouă (아홉)
    note: Gară는 8단원/9단원에서, este/la/ce/oră/ora/nouă는 4단원(시간)에서 나왔어요. 이 단원은 4단원의 "la ce oră"/"la ora nouă" 패턴을 수업 대신 기차를 묻는 새로운 용도로 다시 써요.
  ro.a1.unit15.lesson01.teach.tren_vocab:
    title: 기차
    gloss: Tren (기차)
    note: '중성 명사이고 자음으로 끝나요(단수에서 중성 명사는 남성 명사처럼 쓰여요: *un tren*). ''그 기차''는 *-ul*을 붙여 만들어요. *magazin*→*magazinul*과 같은 어미예요. *gară* 같은 *-ă* 명사는 대신 *-a*를 붙여요(*gara*).'
    example_gloss:
    - 기차는 역에 있어요.
  ro.a1.unit15.lesson01.teach.pleaca_vocab:
    title: 출발해요
    gloss: Pleacă (출발해요, 3인칭 단수)
    note: 기차, 버스, 비행기가 떠난다고 할 때 쓰는 동사예요. *Trenul pleacă* -- *pleacă*는 그 자체로 완전한 동사이므로 *este*가 필요 없어요.
    example_gloss:
    - 기차가 출발해요.
  ro.a1.unit15.lesson01.teach.trenul_pleaca_ora_noua_phrase:
    title: 기차는 9시에 출발해요
    gloss: Trenul pleacă la ora nouă. (기차는 9시에 출발해요.)
    note: '*trenul* + *pleacă*에 4단원의 *la ora nouă*를 합쳤어요. 새로운 시간 어휘는 필요 없어요.'
  ro.a1.unit15.lesson01.teach.la_ce_ora_pleaca_trenul_phrase:
    title: 기차는 몇 시에 출발해요?
    gloss: La ce oră pleacă trenul? (기차는 몇 시에 출발해요?)
    note: 4단원의 *La ce oră...?* 질문 틀을 이번에는 수업 대신 *trenul*에 대해 묻는 데 써요.
  ro.a1.unit15.lesson01.teach.peron_vocab:
    title: 승강장
    gloss: Peron (승강장)
    note: 기차 승강장이에요. 중성 명사이고 자음으로 끝나서 '그 승강장'은 *peronul*이에요. *tren*→*trenul*과 같은 *-ul* 어미예요.
    example_gloss:
    - 기차는 3번 승강장에 있어요.
  ro.a1.unit15.lesson01.teach.de_la_ce_peron_phrase:
    title: 기차는 어느 승강장에서 출발해요?
    gloss: De la ce peron pleacă trenul? (기차는 어느 승강장에서 출발해요?)
    note: '*De la*(~에서) + *ce peron*(어느 승강장) -- 여기 나온 단어는 모두 이미 배운 것이고, 새로운 질문으로 합쳤을 뿐이에요.'
  ro.a1.unit15.lesson02.teach.reminder_as_dori_va_rog_cat_costa:
    title: '복습: aș dori, vă rog, cât costă, costă, lei'
    gloss: aș dori (~을 원해요, 정중한 표현) · vă rog (부탁드려요, 정중한 표현) · cât costă (얼마예요) · costă (값이 ~예요) · lei (레이, 화폐)
    note: 모두 6단원(음식)과 7단원(쇼핑)에서 나왔어요. 이 단원은 정중하게 요청하고 가격을 묻는 같은 표현을 음식 대신 기차표를 살 때 다시 써요.
  ro.a1.unit15.lesson02.teach.bilet_vocab:
    title: 표
    gloss: 표, 티켓
    note: 기차표예요. 중성 명사로, 단수에서는 남성 명사처럼 *un*을 붙여요. 그래서 '표 한 장'은 *un bilet*예요.
    example_gloss:
    - 저는 표가 있어요.
  ro.a1.unit15.lesson02.teach.bucuresti_vocab:
    title: 부쿠레슈티
    gloss: 부쿠레슈티
    note: 루마니아의 수도예요. 이 과정에서 목적지로 쓰기에 가장 자연스러운 도시예요.
    example_gloss:
    - 기차가 부쿠레슈티로 떠나요.
  ro.a1.unit15.lesson02.teach.as_dori_bilet_bucuresti_phrase:
    title: 부쿠레슈티행 표 한 장 주세요
    gloss: 부쿠레슈티행 표 한 장 주세요.
    note: 6단원과 7단원에서 배운 정중한 표현 *Aș dori... vă rog*예요. 이번에는 음식 대신 표를 요청해요.
  ro.a1.unit15.lesson02.teach.cat_costa_bilet_bucuresti_phrase:
    title: 부쿠레슈티행 표는 얼마예요?
    gloss: 부쿠레슈티행 표는 얼마예요?
    note: 7단원에서 배운 가격 질문 *Cât costă...?*예요. 이번에는 감자 1킬로그램 대신 표의 가격을 물어요.
  ro.a1.unit15.lesson02.teach.costa_zece_lei_phrase:
    title: 40레이예요
    gloss: 40레이예요.
    note: 숫자가 2에서 19 사이이면 *lei* 앞에 *de*가 필요 없어요. 7단원에서 이미 배운 규칙과 같아요.
  ro.a1.unit15.lesson03.teach.reminder_travel_words:
    title: '복습: tren, pleacă, peron, bilet, București, trei, am'
    gloss: tren (기차) · pleacă (떠나요/출발해요) · peron (승강장) · bilet (표) · București (부쿠레슈티) · trei (3, 2단원) · am (저는 가지고 있어요, 2단원)
    note: tren, pleacă, peron, bilet, București는 이번 단원의 1·2과에서 나왔어요. trei와 am은 2단원(숫자)에서 배운 단어예요. 아나와 미하이가 역에서 'peronul trei'와 'am un bilet'를 함께 쓰기 때문에 다시 다뤄요.
  ro.a1.unit15.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: '복습: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (안녕하세요) · mulțumesc (고맙습니다) · la revedere (안녕히 가세요) · Ana, Mihai (이름)
    note: 모두 앞 단원에서 이미 배운 표현이에요. 이 과정의 모든 대화에서 썼던 다정한 시작과 마무리 방식이에요.
  ro.a1.unit15.lesson03.teach.drum_bun_vocab:
    title: 즐거운 여행 되세요
    gloss: Drum bun (즐거운 여행 되세요 / 잘 다녀오세요)
    note: 여행을 떠나려는 사람에게 하는 고정된 작별 인사예요. 글자 그대로는 '좋은 길'이지만, 한국어의 '잘 다녀오세요', '즐거운 여행 되세요'처럼 써요.
    example_gloss:
    - 미하이, 잘 다녀와요!
  ro.a1.unit15.lesson03.teach.line01:
    title: 인사하고 기차에 대해 묻기
    gloss: 아나가 미하이에게 인사하고 기차가 몇 시에 떠나는지 물어요.
    note: 이번 단원 1과의 질문을 다시 써요. 이번에는 미하이에게 직접 말해요.
  ro.a1.unit15.lesson03.teach.line02:
    title: 출발 시각 말하기
    gloss: 미하이가 기차가 9시에 떠난다고 말해요.
    note: 이번 단원 1과의 표현을 그대로 다시 써요.
  ro.a1.unit15.lesson03.teach.line03:
    title: 승강장 묻기
    gloss: 아나가 어느 승강장에서 출발하는지 물어요.
    note: 짧게 되묻는 질문이에요. *de la ce peron*은 1과에서 이미 완전한 문장으로 나왔어요. 여기서는 아나가 짧게 묻고, 나머지는 미하이가 채워 주길 기대해요.
  ro.a1.unit15.lesson03.teach.line04:
    title: 승강장과 표 말하기
    gloss: 미하이가 3번 승강장이라고 말하고, 부쿠레슈티행 표가 있다고 말해요.
    note: 이번 단원의 peron, bilet, București 어휘를 한 번의 대답에 모두 써요.
  ro.a1.unit15.lesson03.teach.line05:
    title: 즐거운 여행을 빌며 작별 인사하기
    gloss: 아나가 미하이에게 즐거운 여행을 빌어 주고 작별 인사를 해요.
    note: 이번 과의 *Drum bun*을 써요. 이 과정에서 늘 쓰던 *la revedere*만 말하는 대신, 여행할 때 쓰는 작별 인사예요.
  ro.a1.unit15.lesson03.teach.line06:
    title: 고마워하며 작별 인사하기
    gloss: 미하이가 아나에게 고맙다고 말하고 작별 인사를 해요.
    note: 앞 단원의 모든 대화가 끝났던 것과 같은 마무리 방식이에요.
