  notes: 'Derived from en-ro by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Korean string was translated and adapted. Needs native Korean review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: '"Vreau" (I want, plain) and "Aș dori" (I would like, polite, established in 6단원) are a genuine directness contrast, not interchangeable synonyms -- accept either for a general "I want/I would like" unless an exercise explicitly names one. "Vă rog" (formal) and "te rog" (informal, both established in 6단원) remain a register-sensitive pair here too. Ana and Mihai''s market dialogue keeps their existing polite register with each other (vă rog, not te rog).'
course:
  title: 한국어로 배우는 루마니아어 A1
  description: 루마니아어로 가격과 수량 묻기 -- 화폐 leu/lei, scump/ieftin, 그리고 roșii(토마토)와 cartofi(감자)를 킬로그램 단위로 사는 시장 쇼핑을 배워요. Ana와 Mihai가 시장에서 장을 보는 이야기가 이어져요.
units:
  ro.a1.unit07.shopping:
    title: 쇼핑
lessons:
  ro.a1.unit07.lesson01.cat_costa:
    title: 얼마예요?
  ro.a1.unit07.lesson02.rosii_si_cartofi:
    title: 토마토와 감자
  ro.a1.unit07.lesson03.la_piata:
    title: 시장에서
teaching:
  ro.a1.unit07.lesson01.teach.reminder_un_numere:
    title: '복습: un, doi, cinci, zece, douăzeci'
    gloss: un(하나의) · doi(둘) · cinci(다섯) · zece(열) · douăzeci(스물)
    note: 모두 앞선 단원에 나왔어요(*un*은 4단원, 숫자는 2단원). 여기서는 가격을 말할 때 다시 쓰여요.
  ro.a1.unit07.lesson01.teach.cat_costa:
    title: 얼마예요?
    gloss: Cât costă? (얼마예요?)
    note: 루마니아어로 가격을 묻는 일상적인 표현이에요. 뒤에 물건 이름을 붙이거나, 무엇인지 상황상 분명하면 이렇게 단독으로 써요.
  ro.a1.unit07.lesson01.teach.leu:
    title: Leu (화폐)
    gloss: 'leu (루마니아의 화폐 단위 -- 복수형: lei)'
    note: 루마니아의 화폐예요. Leu는 단수(1 leu)이고, 복수형 lei는 leu에 규칙적인 어미를 붙인 것이 아니라 불규칙해요.
    example_gloss: 1 leu예요.
  ro.a1.unit07.lesson01.teach.costa_cinci_lei:
    title: 8 lei예요
    gloss: Costă opt lei. (8 lei예요.)
    note: 2~19에서는 lei가 그대로 와요 -- 앞에 다른 단어가 필요 없어요.
  ro.a1.unit07.lesson01.teach.costa_douazeci_de_lei:
    title: 30 lei예요
    gloss: Costă treizeci de lei. (30 lei예요.)
    note: 20부터는 세는 대상 명사 앞에 *de*가 들어가요 -- 2단원에서 *ani*(해, 나이)에 배운 규칙과 같고, 이제 *lei*에 적용돼요.
  ro.a1.unit07.lesson01.teach.leu_lei_de_rule:
    title: '규칙: leu → lei, 그리고 de를 붙이는 경우'
    gloss: 'leu → lei · 2~19: *de* 없음 · 20 이상: *de* 붙임'
    note: 2단원의 *ani* 규칙(câți ani ai / am treizeci de ani)과 똑같은 패턴이에요. 한 명사에서 익히면 lei에도 그대로 적용돼요.
  ro.a1.unit07.lesson01.teach.scump:
    title: 비싼
    gloss: scump (비싼)
    note: 가격이 너무 비싸다고 느낄 때 흔히 하는 반응이에요.
    example_gloss: 8 lei요? 비싸요!
  ro.a1.unit07.lesson01.teach.ieftin:
    title: 저렴한
    gloss: ieftin (저렴한)
    note: scump의 반대말 -- 좋은 가격이에요.
    example_gloss: 1 leu요? 싸네요!
  ro.a1.unit07.lesson02.teach.reminder_un_o_si_as_dori_rog:
    title: '복습: un, o, și, aș dori, vă rog, te rog'
    gloss: un/o (하나의) · și (그리고) · aș dori (~하고 싶어요) · vă rog (부탁드려요, 격식) · te rog (부탁해요, 친구에게)
    note: '*Aș dori*, *vă rog*, *te rog*는 6단원 카페 장면에서 처음 나왔어요. 여기서는 시장에서 다시 쓰여요.'
  ro.a1.unit07.lesson02.teach.piata:
    title: 시장
    gloss: piață (시장)
    note: 여성 명사예요 -- 신선한 식품을 사는 노천 또는 실내 시장이에요.
    example_gloss: 시장에서는 얼마예요?
  ro.a1.unit07.lesson02.teach.rosii:
    title: 토마토
    gloss: roșii (토마토)
    note: roșie(토마토 한 개)의 복수형이에요 -- 토마토를 일반적으로 사겠다고 할 때 복수형으로 말해요.
    example_gloss: 토마토를 사고 싶어요.
  ro.a1.unit07.lesson02.teach.cartofi:
    title: 감자
    gloss: cartofi (감자)
    note: cartof(감자 한 개)의 복수형으로, roșii와 같은 패턴이에요.
    example_gloss: 감자를 사고 싶어요.
  ro.a1.unit07.lesson02.teach.kilogram:
    title: Kilogram
    gloss: kilogram (킬로그램)
    note: '농산물을 무게로 살 때 쓰는 표준 단위예요. *De*가 사는 물건과 이어 줘요: kilogram *de* roșii, ''토마토 1킬로그램''.'
    example_gloss: 토마토 1킬로그램요.
  ro.a1.unit07.lesson02.teach.vreau:
    title: 원해요
    gloss: vreau (원해요)
    note: '*aș dori*(''~하고 싶어요'')보다 더 간단하고 직접적이에요 -- 시장에서는 둘 다 괜찮고, vreau가 덜 격식적일 뿐이에요.'
    example_gloss: 감자를 원해요.
  ro.a1.unit07.lesson02.teach.unde_pot_sa_cumpar:
    title: '...은(는) 어디에서 살 수 있어요?'
    gloss: Unde pot să cumpăr roșii? (토마토는 어디에서 살 수 있어요?)
    note: 어디서 사야 할지 모를 때 유용한 질문이에요 -- roșii 대신 찾는 다른 물건을 넣어 보세요.
  ro.a1.unit07.lesson02.teach.cat_costa_kilogram_rosii:
    title: 토마토 1킬로그램은 얼마예요?
    gloss: Cât costă un kilogram de roșii? (토마토 1킬로그램은 얼마예요?)
    note: Cât costă와 kilogram de ... 구문을 한 문장의 완전한 질문으로 합친 표현이에요.
  ro.a1.unit07.lesson02.teach.vreau_kilogram_cartofi:
    title: 감자 1킬로그램을 원해요
    gloss: Vreau un kilogram de cartofi. (감자 1킬로그램을 원해요.)
    note: 같은 kilogram de ... 패턴이 이번에는 질문이 아니라 vreau를 쓴 평서문으로 나와요.
  ro.a1.unit07.lesson03.teach.reminder_buna_multumesc_la_revedere:
    title: '복습: bună, ziua, mulțumesc, bine, la revedere, Ana, Mihai'
    gloss: bună ziua (안녕하세요) · mulțumesc (감사합니다) · bine (좋아요/괜찮아요) · la revedere (안녕히 가세요) · Ana, Mihai (이름)
    note: 모두 1단원과 6단원의 대화에서 이미 나왔어요. 여기서는 Ana와 Mihai가 시장에서 다시 만나요.
  ro.a1.unit07.lesson03.teach.line01:
    title: 인사하고 가격 묻기
    gloss: Ana가 Mihai에게 인사하고 토마토 1킬로그램의 가격을 물어요.
    note: 이 단원의 Cât costă와 1단원의 인사를 합친 대화예요.
  ro.a1.unit07.lesson03.teach.line02:
    title: 가격 말하기
    gloss: Mihai가 8 lei라고 말하고, 싸다고 덧붙여요.
    note: 이 단원의 costă, opt lei, ieftin을 다시 써요.
  ro.a1.unit07.lesson03.teach.line03:
    title: 정중하게 주문하고 품목 추가하기
    gloss: Ana가 좋다고 하고, 토마토 1킬로그램을 정중하게 부탁한 뒤 감자도 원한다고 덧붙여요.
    note: aș dori, vă rog, vreau를 한 줄에 합쳤어요. 이 단원 어휘에 나오는 두 가지 말투를 모두 담았어요.
  ro.a1.unit07.lesson03.teach.line04:
    title: 두 번째 가격 말하기
    gloss: 미하이가 감자 1킬로그램에 5 lei라고 말해요.
    note: 2단원에 나온 zece(10)를 다시 써요. 이 단원 첫 번째 레슨에서 이미 복습했어요.
  ro.a1.unit07.lesson03.teach.line05:
    title: 감사하고 마무리하기
    gloss: 아나가 미하이에게 감사하고 작별 인사를 해요.
    note: 여기서 *Mulțumesc*는 마무리할 때 하는 간단한 감사 표현이에요. 1단원의 *Bine, mulțumesc.*에 나온 바로 그 말이에요.
  ro.a1.unit07.lesson03.teach.line06:
    title: 만남 마무리하기
    gloss: 미하이가 아나의 이름을 부르며 작별 인사로 답해요.
    note: 1단원, 5단원, 6단원의 대화도 모두 이렇게 친근한 인사로 끝났어요.
