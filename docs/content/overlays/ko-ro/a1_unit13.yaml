answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit introduces the formal Vă place...? question (dative vă, matching Mihai's own established faceți/aveți-style formal verb endings) alongside first-person Îmi place/Nu-mi place/Prefer, which are person-invariant and carry no register distinction of their own. Ana and Mihai's dialogue keeps their existing polite register with each other, matching every earlier unit.
course:
  title: 한국어로 배우는 루마니아어 A1
  description: 아나와 미하이가 커피냐 차냐를 정하면서, 루마니아어로 좋아하는 것, 싫어하는 것, 더 좋아하는 것을 말하는 법을 배워요. Îmi place(좋아해요), Nu-mi place(좋아하지 않아요), Vă place...?(~을 좋아하세요?), Prefer(더 좋아해요), Sau(또는)를 익혀요.
units:
  ro.a1.unit13.preferences:
    title: 선호 표현
lessons:
  ro.a1.unit13.lesson01.imi_place:
    title: 좋아해요
  ro.a1.unit13.lesson02.va_place_prefer:
    title: 좋아하세요? 저는 ~이 더 좋아요
  ro.a1.unit13.lesson03.cafea_sau_ceaiul:
    title: 커피? 아니면 차?
teaching:
  ro.a1.unit13.lesson01.teach.reminder_cafea_ceai_paine:
    title: '복습: cafea, ceai, pâine'
    gloss: cafea (커피) · ceai (차) · pâine (빵)
    note: 모두 6단원에서 이미 배운 단어예요. 여기서는 이 단원의 새 문법인 좋아함과 싫어함 표현과 함께 쓰여요.
  ro.a1.unit13.lesson01.teach.imi_place_vocab:
    title: 좋아해요
    gloss: Îmi place (좋아해요)
    note: 직역하면 '나에게 마음에 든다'예요. *îmi*(나에게)에 형태가 변하지 않는 *place*(마음에 들다)가 붙어요. 무언가를 일반적으로 좋아한다고 말할 때 루마니아어는 명사의 정관사 형태(*cafeaua*)를 써요. 6단원에서 배운 기본형 *cafea*를 쓰지 않아요. 한국어는 '커피를 좋아해요'처럼 이런 구분이 없지만, 루마니아어에서는 꼭 정관사 형태를 써야 해요.
    example_gloss:
    - 저는 커피를 좋아해요.
  ro.a1.unit13.lesson01.teach.imi_place_cafeaua_phrase:
    title: 커피를 좋아해요
    gloss: Îmi place cafeaua. (커피를 좋아해요.)
    note: 완전한 형태는 Îmi place + 정관사가 붙은 명사예요.
  ro.a1.unit13.lesson01.teach.imi_place_ceaiul_phrase:
    title: 차를 좋아해요
    gloss: Îmi place ceaiul. (차를 좋아해요.)
    note: '*Îmi place cafeaua*와 같은 형태에 다른 음료만 바뀌었어요. *ceaiul*은 6단원에서 배운 *ceai*의 정관사 형태예요.'
  ro.a1.unit13.lesson01.teach.numi_place_vocab:
    title: 좋아하지 않아요
    gloss: Nu-mi place (좋아하지 않아요)
    note: '*Îmi place*의 부정형이에요. 루마니아어는 일상 대화에서 *nu îmi*를 *nu-mi*로 줄여 말해요. 그래서 하이픈이 있는 이 짧은 형태가 단순한 줄임말이 아니라 자연스러운 표현이에요.'
    example_gloss:
    - 저는 빵을 좋아하지 않아요.
  ro.a1.unit13.lesson01.teach.numi_place_painea_phrase:
    title: 빵을 좋아하지 않아요
    gloss: Nu-mi place pâinea. (빵을 좋아하지 않아요.)
    note: '*Pâinea*는 6단원에서 배운 *pâine*의 정관사 형태예요. *cafeaua*, *ceaiul*과 같은 형태예요.'
  ro.a1.unit13.lesson02.teach.reminder_imi_place_numi_place:
    title: '복습: Îmi place, Nu-mi place'
    gloss: Îmi place (좋아해요) · Nu-mi place (좋아하지 않아요)
    note: 둘 다 이 단원의 1과에서 배웠어요. 여기서는 이 표현들에 맞는 의문문을 배워요.
  ro.a1.unit13.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: '복습: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (그 커피) · ceaiul (그 차) · pâinea (그 빵)
    note: 모두 이 단원의 1과에서 배웠어요. 여기서는 질문과 선호 표현에 다시 쓰여요.
  ro.a1.unit13.lesson02.teach.va_place_vocab:
    title: ~을 좋아하세요?
    gloss: Vă place...? (~을 좋아하세요?)
    note: '*Îmi place*의 높임 의문 형태예요. *îmi*(나에게) 대신 *vă*(당신에게, 높임)를 써요. 이미 *aveți*와 *faceți*에서 쓴 *dumneavoastră* 높임 표현과 같아요. 뒤에 정관사가 붙은 명사를 쓰거나, 화제가 이미 분명하면 이 표현만 단독으로 써도 돼요.'
    example_gloss:
    - 커피를 좋아하세요?
  ro.a1.unit13.lesson02.teach.va_place_cafeaua_phrase:
    title: 커피를 좋아하세요?
    gloss: Vă place cafeaua? (커피를 좋아하세요?)
    note: 완전한 형태는 Vă place + 정관사가 붙은 명사이고, 끝을 올려서 질문해요.
  ro.a1.unit13.lesson02.teach.prefer_vocab:
    title: 더 좋아해요
    gloss: Prefer (더 좋아해요)
    note: '''나에게''를 쓰는 구문이 필요 없어요. *prefer*는 ''나는 ~을 더 좋아한다''처럼 주어가 있는 일반 동사로 쓰여요. *Prefer* 뒤에는 *Îmi place*처럼 정관사가 붙은 명사를 써요.'
    example_gloss:
    - 저는 커피를 더 좋아해요.
  ro.a1.unit13.lesson02.teach.prefer_cafeaua_phrase:
    title: 커피를 더 좋아해요
    gloss: Prefer cafeaua. (커피를 더 좋아해요.)
    note: '*Îmi place cafeaua*보다 더 강한 표현이에요. 두 가지 중에서 고를 때 유용해요.'
  ro.a1.unit13.lesson02.teach.sau_vocab:
    title: 또는
    gloss: Sau (또는)
    note: 선택지를 권하거나 물을 때 두 가지를 이어 줘요. 10단원과 12단원에서 배운 *și*(그리고)는 두 가지가 함께 사실일 때 쓰므로 달라요.
    example_gloss:
    - 커피, 아니면 차?
  ro.a1.unit13.lesson02.teach.cafea_sau_ceai_phrase:
    title: 커피, 아니면 차?
    gloss: Cafea sau ceai? (커피, 아니면 차?)
    note: 선택지를 권하는 짧고 자연스러운 표현이에요. 여기서는 정관사 형태인 *cafeaua*, *ceaiul*이 아니라 기본형(*cafea*, *ceai*)을 써요. 커피나 차 일반에 대한 진술이 아니라 열린 제안이기 때문이에요.
  ro.a1.unit13.lesson03.teach.reminder_va_place_prefer_sau:
    title: '복습: Vă place, Prefer, Sau'
    gloss: Vă place? (~을 좋아하세요?) · Prefer (더 좋아해요) · Sau (또는)
    note: 모두 이 단원의 2과에서 배웠어요. 여기서는 아나와 미하이가 함께 사용해요.
  ro.a1.unit13.lesson03.teach.reminder_imi_place_numi_place_cafeaua_ceaiul_painea:
    title: '복습: Îmi place, Nu-mi place, cafeaua, ceaiul, pâinea'
    gloss: Îmi place (좋아해요) · Nu-mi place (좋아하지 않아요) · cafeaua (그 커피) · ceaiul (그 차) · pâinea (그 빵)
    note: 모두 이 단원의 1과에서 배웠어요. 여기서는 아나와 미하이가 각자 좋아하는 것과 싫어하는 것을 말해요.
  ro.a1.unit13.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: '복습: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (안녕하세요) · mulțumesc (감사합니다) · la revedere (안녕히 가세요) · Ana, Mihai (이름)
    note: 모두 앞선 단원에서 이미 배웠어요. 이 코스의 모든 대화가 사용해 온 친근한 시작과 마무리 방식이에요.
  ro.a1.unit13.lesson03.teach.line01:
    title: 인사하고 커피나 차에 대해 묻기
    gloss: 미하이가 아나에게 인사하고 커피를 좋아하는지 차를 좋아하는지 물어요.
    note: 이 단원의 *Vă place...?*와 *sau*를 합쳐서 한 문장으로 두 가지 선택지를 물어요.
  ro.a1.unit13.lesson03.teach.line02:
    title: 선호와 싫어함 말하기
    gloss: 아나는 커피를 더 좋아하고 차는 좋아하지 않는다고 말해요.
    note: '*Prefer*와 *Nu-mi place*를 함께 써요. 커피를 더 좋아한다는 것은 6단원과 12단원에서 나온 아나의 주문과 같아요.'
  ro.a1.unit13.lesson03.teach.line03:
    title: 반대되는 선호 말하기
    gloss: 미하이는 차를 좋아하고 커피는 좋아하지 않는다고 말해요.
    note: 6단원과 12단원에서 나온 미하이의 주문과 같아요(늘 ceai, 절대 cafea가 아니에요).
  ro.a1.unit13.lesson03.teach.line04:
    title: 빵에 대해서도 묻기
    gloss: 아나가 미하이에게 빵도 좋아하는지 물어요.
    note: 짧은 후속 질문 *Și pâinea?*(그럼 빵은요?)로 시작하고, 이어서 *Vă place...?*로 새로운 화제인 *pâinea*에 대해 정식으로 물어요.
  ro.a1.unit13.lesson03.teach.line05:
    title: 대답하고 감사하고 작별 인사하기
    gloss: 미하이는 빵을 좋아한다고 대답하고, 아나에게 감사하며 작별 인사를 해요.
    note: 6단원에서 나온 미하이의 주문(pâine)과 같고, 이전 단원의 모든 대화가 끝났던 마무리 방식도 같아요.
  ro.a1.unit13.lesson03.teach.line06:
    title: 대화 마무리하기
    gloss: 아나가 미하이의 이름을 부르며 작별 인사에 답해요.
    note: 이전 단원의 대화마다 끝에 나왔던 것과 같은 다정한 마무리 표현이에요.
