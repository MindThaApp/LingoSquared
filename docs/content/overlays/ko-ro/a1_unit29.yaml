teaching:
  ro.a1.unit29.lesson01.teach.cat_costa_in:
    title: 전체 가격 묻기
    gloss: 전부 해서 얼마예요?
    note: '*În total*(''총'')은 물건 하나의 가격이 아니라 전체 합계를 알고 싶다는 뜻이에요. *Cât costă?*는 ''얼마예요?''라는 뜻이에요.'
  ro.a1.unit29.lesson01.teach.costa_douazeci_si:
    title: 전체 가격 말하기
    gloss: 총 100레이예요.
    note: '*Costă*는 *a costa*(값이 나가다)의 3인칭 단수형이에요. 19보다 큰 수 뒤에서는 명사 앞에 *de*가 붙어요: *o sută de lei*.'
  ro.a1.unit29.lesson02.teach.a_plati_cu:
    title: 카드나 현금으로 계산하기
    gloss: 카드로 계산하다, 현금으로 계산하다
    note: '*A plăti cu cardul*는 카드로 결제하다, *a plăti în numerar*는 현금으로 결제하다라는 뜻이에요. *cu*는 ''~로'', *în*은 ''~으로, ~안에''라는 뜻이에요.'
    example_gloss:
    - 여기서 카드로 계산할 수 있나요?
    - 현금으로 계산할게요.
  ro.a1.unit29.lesson02.teach.pot_plati_cu:
    title: 카드 결제가 되는지 묻기
    gloss: 여기서 카드로 계산할 수 있나요?
    note: '*Pot plăti*(''결제할 수 있어요'')는 *a putea* + 동사예요. *aici*(''여기'')는 지금 있는 곳에서 가능한지 묻게 해 줘요.'
  ro.a1.unit29.lesson02.teach.doriti_sa_platiti:
    title: 결제 방법 묻기
    gloss: 현금으로 계산하시겠어요, 카드로 계산하시겠어요?
    note: '*Doriți să plătiți ...?*는 처음 보는 계산원이 쓰는 격식체 *dumneavoastră* 형태예요. 친구에게는 *Vrei să plătești ...?*라고 해요.'
  ro.a1.unit29.lesson03.teach.nota:
    title: 계산서
    gloss: 그 계산서
    note: '여성 명사예요: *o notă*, *nota* (정관사는 단어 끝에 붙어요).'
    example_gloss: 계산을 나눠서 낼까요?
  ro.a1.unit29.lesson03.teach.hai_sa_impartim:
    title: 계산 나누자고 제안하기
    gloss: 계산을 나눠서 낼까요?
    note: '*Hai să* + 동사는 함께 하자고 제안하는 표현이에요.'
  ro.a1.unit29.lesson03.teach.pot_plati_separat:
    title: 따로 계산해도 되는지 묻기
    gloss: 따로 계산해도 될까요?
    note: '*Separat*(''따로'')는 *a plăti* 뒤에 와요. *Pot plăti separat?*는 각자 자기 몫을 낼 때 쓰는 일반적인 부탁이에요.'
  ro.a1.unit29.lesson04.teach.restul:
    title: 거스름돈
    gloss: 거스름돈
    note: '*Restul*은 문자 그대로 ''나머지''라는 뜻인데, 루마니아어에서는 돌려받는 거스름돈을 이렇게 불러요. 정관사는 단어 끝에 붙어요.'
    example_gloss: 거스름돈 여기 있습니다.
  ro.a1.unit29.lesson04.teach.poftiti_restul:
    title: 거스름돈 건네기
    gloss: 거스름돈 여기 있습니다.
    note: '*Poftiți*는 ''여기 있습니다''라는 뜻의 격식체 *dumneavoastră* 형태로, 계산대에서 쓰는 격식 있는 말투와 어울려요.'
  ro.a1.unit29.lesson04.teach.nu_am_nevoie:
    title: 거스름돈 사양하기
    gloss: 거스름돈은 필요 없어요.
    note: '*A avea nevoie de*(''필요하다'')는 *de*와 함께 써요: *Nu am nevoie de rest*.'
  ro.a1.unit29.lesson05.teach.treizeci_si_cinci:
    title: '35'
    gloss: 서른다섯
    note: '루마니아어는 21부터 99까지의 수를 *și*로 이어요: *treizeci și cinci*(직역하면 ''서른 그리고 다섯''). 그리고 명사 앞에 *de*를 붙여요: *o sută treizeci și cinci de lei*.'
    example_gloss: 135레이예요.
  ro.a1.unit29.lesson05.teach.nota_doua_feluri:
    title: 식당 계산서 읽기
    gloss: '계산서: 메인 요리 두 개와 커피 두 잔. 합계: 135레이. 카드로 결제함.'
    note: 무엇을 주문했는지, 총액이 얼마인지, 어떻게 결제했는지 확인하세요.
    glosses:
      Nota: 계산서
      două: 둘
      feluri: 메인 요리
      cafele: 커피
      Total: 총액
      '135': '135'
      lei: 레이
      Plătit: 결제된
      cardul: 카드
  ro.a1.unit29.lesson06.teach.ana_hai_sa:
    title: Ana가 계산서를 요청해요
    gloss: 'Ana: 계산서 달라고 할까요?'
    note: '*A cere*(요청하다)는 *nota*를 직접 목적어로 취해요. *Hai să cerem nota?*는 함께 요청하자는 제안이에요.'
  ro.a1.unit29.lesson06.teach.mihai_da_buna:
    title: Mihai가 총액을 물어요
    gloss: 'Mihai: 네, 좋은 생각이에요. 총 얼마예요?'
    note: 1과에 나온 *Cât costă în total?* 질문을 다시 써요.
  ro.a1.unit29.lesson06.teach.ana_sunt_treizeci:
    title: Ana가 총액을 말해요
    gloss: 'Ana: 135레이예요. 나눠서 낼까요?'
    note: '*Împărțim*은 *a împărți*(나누다)의 *noi*(''우리'') 형태예요. *nota*는 문맥상 생략되었어요.'
  ro.a1.unit29.lesson06.teach.mihai_nu_lasa:
    title: Mihai가 자기가 내겠다고 고집해요
    gloss: 'Mihai: 아니에요, 오늘은 제가 계산할게요. 저를 정말 많이 도와주셨잖아요.'
    note: '*Lasă-mă să* ... (…하게 해 주세요)는 무언가를 해 주겠다고 제안할 때 쓰는 일반적인 표현이에요. *m-ai ajutat*("네가 나를 도와줬다")는 과거형이에요.'
  ro.a1.unit29.lesson06.teach.ana_ce_dragut:
    title: Ana가 감동해요
    gloss: 'Ana: 정말 다정하네요! 고마워요.'
    note: '*Ce drăguț din partea ta!*(참 다정하네요)는 너그러운 행동에 쓰는 따뜻하고 흔한 칭찬이에요.'
  ro.a1.unit29.lesson06.teach.mihai_pot_plati:
    title: Mihai가 카드 결제가 되는지 물어요
    gloss: 'Mihai: 여기서 카드로 계산할 수 있나요?'
    note: 2과에서 나온 *Pot plăti cu cardul aici?* 질문을 이번에는 실제 식당에서 다시 써요.
  ro.a1.unit29.lesson06.teach.mihai_plateste_nota:
    title: 'Plătește: 그/그녀 형태'
    gloss: Mihai가 계산서를 계산해요.
    note: '*Plătește*는 *a plăti*(지불하다)의 3인칭 단수 형태예요.'
