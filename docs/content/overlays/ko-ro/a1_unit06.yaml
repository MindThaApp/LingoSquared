review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  notes: 'Derived from en-ro by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Korean string was translated and adapted. Needs native Korean review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's "Vă rog" (formal, sourced) and "Te rog" (informal, freshly authored) are register-sensitive parallels, matching unit02's ai/aveți and unit05's ai frați/aveți frați pattern -- accept either register for a general "please" unless an exercise explicitly names one. Ana and Mihai's closing café dialogue keeps their existing polite register with each other (both use "vă rog," not "te rog").
course:
  title: 한국어로 배우는 루마니아어 A1
  description: 루마니아어로 음식과 음료 주문하기 -- 커피, 차, 빵 등을 다루며, 핵심 주문 표현 "Aș dori ..."(~을 주세요)와 존댓말·친근한 말 쌍인 vă rog/te rog를 배워요. 아나와 미하이가 카페에서 만나는 이야기가 이어져요.
units:
  ro.a1.unit06.food:
    title: 음식과 음료
lessons:
  ro.a1.unit06.lesson01.bauturi:
    title: 음료
  ro.a1.unit06.lesson02.va_rog_si_mancare:
    title: 부탁 표현과 음식
  ro.a1.unit06.lesson03.la_cafenea:
    title: 카페에서
teaching:
  ro.a1.unit06.lesson01.teach.reminder_un_o_si:
    title: '복습: un, o, și'
    gloss: un/o (하나의) · și (그리고)
    note: 세 단어 모두 앞 단원에서 이미 나왔어요(*și*는 1단원, *o*는 2단원, *un*은 4단원). 여기서는 음식과 음료 이야기에 다시 쓰여요.
  ro.a1.unit06.lesson01.teach.as_dori:
    title: ~을(를) 주세요
    gloss: Aș dori ... (~을 주세요 / ~을 원해요)
    note: 루마니아어에서 무언가를 공손하게 주문하는 일상적인 표현이에요. 고정된 조건법 형태라서 뒤에 오는 말에 따라 변하지 않아요.
  ro.a1.unit06.lesson01.teach.apa:
    title: 물
    gloss: apă (물)
    note: 여성 명사예요. 양을 따로 정하지 않을 때는 관사 없이 써요.
    example_gloss: 물 주세요.
  ro.a1.unit06.lesson01.teach.cafea:
    title: 커피
    gloss: cafea (커피)
    note: 여성 명사예요. 다른 여성 명사와 마찬가지로 *o*('하나의')와 함께 써요.
    example_gloss: 커피 한 잔 주세요.
  ro.a1.unit06.lesson01.teach.ceai:
    title: 차
    gloss: ceai (차)
    note: '*o*가 아니라 *un*(''하나의'')과 함께 써요. ceai는 남성·중성 명사예요.'
    example_gloss: 차 한 잔 주세요.
  ro.a1.unit06.lesson01.teach.suc:
    title: 주스
    gloss: suc (주스)
    note: 이것도 *un*과 함께 써요. ceai와 같은 방식이에요.
    example_gloss: 주스 한 잔 주세요.
  ro.a1.unit06.lesson01.teach.lapte:
    title: 우유
    gloss: lapte (우유)
    note: apă처럼 양을 따로 정하지 않을 때는 보통 관사 없이 말해요.
    example_gloss: 우유 주세요.
  ro.a1.unit06.lesson01.teach.mi_e_sete:
    title: 목이 말라요
    gloss: Mi-e sete (목이 말라요)
    note: 고정된 관용 표현이에요. 글자 그대로는 '나에게 갈증이 있다'에 가까워요.
  ro.a1.unit06.lesson01.teach.as_dori_o_cafea:
    title: 커피 한 잔 주세요
    gloss: 커피 한 잔 주세요.
    note: 주문 표현과 여성 음료 명사를 한 문장으로 합친 완전한 문장이에요.
  ro.a1.unit06.lesson02.teach.reminder_multumesc_bine_da_nu:
    title: '복습: mulțumesc, bine, da, nu'
    gloss: mulțumesc (고맙습니다) · bine (좋아요) · da (네) · nu (아니요)
    note: '*Mulțumesc*와 *bine*는 1단원 인사에서, *da*와 *nu*는 3단원과 5단원에서 처음 나왔어요. 여기서는 음식과 공손한 표현 속에서 다시 쓰여요.'
  ro.a1.unit06.lesson02.teach.mi_e_foame:
    title: 배가 고파요
    gloss: Mi-e foame (배가 고파요)
    note: '*Mi-e sete*와 같은 고정 관용 표현이고, sete(갈증) 대신 foame(배고픔)를 써요.'
  ro.a1.unit06.lesson02.teach.paine:
    title: 빵
    gloss: pâine (빵)
    note: 보통 관사 없이 말해요.
    example_gloss: 배가 고파요. 빵 주세요.
  ro.a1.unit06.lesson02.teach.mancare:
    title: 음식
    gloss: mâncare (음식)
    note: 특정한 요리가 아니라 '음식' 전반을 가리키는 말이에요.
    example_gloss: 음식을 주세요.
  ro.a1.unit06.lesson02.teach.carne:
    title: 고기
    gloss: carne (고기)
    note: '''고기'' 전반을 가리키는 말이에요. 종류를 말할 때는 carne de vită, carne de porc처럼 뒤에 종류를 덧붙여요.'
    example_gloss: 고기를 주세요.
  ro.a1.unit06.lesson02.teach.pui:
    title: 닭고기
    gloss: pui (닭고기)
    note: (음식으로서의) 닭고기를 가리키는 구체적인 말이에요. 일반적인 carne와는 달라요.
    example_gloss: 닭고기를 주세요.
  ro.a1.unit06.lesson02.teach.fructe:
    title: 과일
    gloss: fructe (과일)
    note: 일상에서 쓰는 복수형으로, 과일 전체를 두루 가리킬 때 써요.
    example_gloss: 과일을 주세요.
  ro.a1.unit06.lesson02.teach.va_rog:
    title: 부탁드려요 (격식)
    gloss: vă rog (부탁드려요, 격식)
    note: '''부탁드립니다''에 해당하는 공손한 표현이에요. 1~2단원에서 배운 dumneavoastră를 쓰는 말투와 짝을 이뤄요.'
    example_gloss: 커피 한 잔 주세요.
  ro.a1.unit06.lesson02.teach.te_rog:
    title: 부탁해요 (친근한 말)
    gloss: te rog (부탁해요, 친근한 말)
    note: 친구나 *tu*로 부르는 사람에게 쓰는 일상적인 표현이에요. 1단원의 tu 말투와 짝을 이뤄요.
    example_gloss: 차 한 잔 부탁해요.
  ro.a1.unit06.lesson03.teach.reminder_buna_ziua_bine_la_revedere:
    title: '복습: bună, ziua, bine, la revedere, Ana, Mihai'
    gloss: bună ziua (안녕하세요) · bine (좋아요) · la revedere (안녕히 가세요) · Ana, Mihai (이름)
    note: 모두 1단원과 5단원의 대화에서 이미 나왔어요. 여기서는 아나와 미하이가 이번에는 카페에서 다시 만나요.
  ro.a1.unit06.lesson03.teach.line01:
    title: 인사하고 배고프다고 말하기
    gloss: 아나가 미하이에게 인사하고 배가 고프다고 말해요.
    note: 이 단원의 *Mi-e foame*를 인사에 바로 써요.
  ro.a1.unit06.lesson03.teach.line02:
    title: 음식 주문하기
    gloss: 미하이가 빵과 닭고기를 달라고 말해요.
    note: 이 단원의 pâine/pui 어휘를 Aș dori 표현과 함께 다시 써요.
  ro.a1.unit06.lesson03.teach.line03:
    title: 공손하게 음료 주문하기
    gloss: 아나가 커피 한 잔을 부탁드린다고 말해요.
    note: 이 단원에서 따로 배운 Aș dori, cafea, vă rog 세 가지를 함께 써요.
  ro.a1.unit06.lesson03.teach.line04:
    title: 음료도 주문하기
    gloss: 미하이가 차 한 잔을 부탁드린다고 말해요.
    note: 아나의 말과 같은 형태이고, cafea 대신 ceai를 써요.
  ro.a1.unit06.lesson03.teach.line05:
    title: 감사 인사로 마무리하기
    gloss: 아나가 미하이에게 고맙다고 하고 작별 인사를 해요.
    note: 여기서 *Mulțumesc*는 간단한 마무리 감사 인사예요. 1단원의 *Bine, mulțumesc.*에 나온 그 단어예요.
  ro.a1.unit06.lesson03.teach.line06:
    title: 만남 마무리하기
    gloss: 미하이가 아나의 이름을 부르며 작별 인사로 답해요.
    note: 1단원과 5단원의 대화가 모두 이렇게 다정한 작별 인사로 끝났어요.
