source_language: ko
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: derive_cross.py
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  notes: 'Derived from en-ro by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Korean string was translated and adapted. Needs native Korean review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's new grammar is entirely 1st-person (am fost/am mâncat/ am băut, invariant for singular and plural) plus one fixed 3rd- person formulaic pair (Cum a fost...?/A fost bine!) taught only as an unanalyzed set phrase. No new second-person forms are introduced. Ana and Mihai's dialogue keeps their existing polite register with each other, matching 6단원/unit07/unit08/unit09/ 10단원/unit11.
course:
  title: 한국어로 배우는 루마니아어 A1
  description: 방금 끝난 일을 루마니아어로 말하기 -- am fost(~에 있었어요 / ~에 갔어요), am mâncat(먹었어요), am băut(마셨어요), 그리고 Cum a fost...?/A fost bine! 로 어땠는지 묻고 답하기 -- 아나와 미하이가 일요일 공원에서 보낸 하루를 이야기하는 장면이 이어집니다.
units:
  ro.a1.unit12.past_events:
    title: 어제
lessons:
  ro.a1.unit12.lesson01.am_fost_la_parc:
    title: 공원에 갔어요
  ro.a1.unit12.lesson02.am_mancat_am_baut:
    title: 먹고 마셨어요
  ro.a1.unit12.lesson03.cum_a_fost_duminica:
    title: 일요일은 어땠어요?
teaching:
  ro.a1.unit12.lesson01.teach.reminder_parc_cinema:
    title: '복습: parc, cinema'
    gloss: parc (공원) · cinema (영화관)
    note: 두 단어 모두 11단원에서 이미 배웠어요. 여기서는 이번 단원의 새로운 과거 시제 문법과 함께 쓰입니다.
  ro.a1.unit12.lesson01.teach.reminder_astazi_maine_duminica_sambata:
    title: '복습: astăzi, mâine, duminică, sâmbătă'
    gloss: astăzi (오늘) · mâine (내일) · duminică (일요일) · sâmbătă (토요일)
    note: 모두 3단원과 11단원에서 이미 배웠어요. 여기서는 이번 수업의 새 단어 *ieri*(어제)와 대비해 보게 됩니다.
  ro.a1.unit12.lesson01.teach.am_fost_vocab:
    title: 저는 있었어요 / 저는 갔어요
    gloss: Am fost (~에 있었어요 / ~에 갔어요)
    note: '*a fi*(~이다, 있다)의 복합 과거(과거 시제)예요. *am*은 ''나''와 ''우리''에 똑같이 쓰는 변하지 않는 도움 단어이고, *fost*는 고정된 과거형이에요. 장소와 함께 쓰는 *am fost la...*는 ''~에 갔어요''라는 뜻으로 일상 대화에서 아주 자연스럽게 쓰이며, ''걸어갔다''나 ''이동했다'' 같은 동사를 직접 쓰는 것보다 말할 때 더 흔해요.'
    example_gloss:
    - 공원에 갔어요.
  ro.a1.unit12.lesson01.teach.am_fost_parc_phrase:
    title: 공원에 갔어요
    gloss: Am fost la parc. (공원에 갔어요.)
    note: '완전한 문형이에요: am fost + la + 장소.'
  ro.a1.unit12.lesson01.teach.am_fost_cinema_phrase:
    title: 영화관에 갔어요
    gloss: Am fost la cinema. (영화관에 갔어요.)
    note: '*Am fost la parc*와 같은 문형이고 장소만 달라요.'
  ro.a1.unit12.lesson01.teach.ieri_vocab:
    title: 어제
    gloss: Ieri (어제)
    note: 3단원에서 *astăzi*(오늘), *mâine*(내일)와 함께 이미 나왔어요. 이제 과거 시제와 함께, 문장 맨 앞에 두어 언제 일어난 일인지 말하는 데 써요.
    example_gloss:
    - 어제 공원에 갔어요.
  ro.a1.unit12.lesson01.teach.ieri_am_fost_parc_phrase:
    title: 어제 공원에 갔어요
    gloss: Ieri am fost la parc. (어제 공원에 갔어요.)
    note: '*Am fost la parc* 앞에 *ieri*를 붙이면 언제인지 정확히 알려 줘요.'
  ro.a1.unit12.lesson02.teach.reminder_mananc_beau:
    title: '복습: mănânc, beau'
    gloss: mănânc (먹어요) · beau (마셔요)
    note: 두 단어 모두 10단원의 하루 일과에서 이미 배웠어요. 이번 수업에서는 이를 과거형으로 바꿔 봐요.
  ro.a1.unit12.lesson02.teach.reminder_paine_cafea_ceai_si:
    title: '복습: pâine, cafea, ceai, și'
    gloss: pâine (빵) · cafea (커피) · ceai (차) · și (그리고)
    note: 모두 6단원과 10단원에서 이미 배웠어요. 여기서는 이번 수업의 과거 시제 문장에 다시 쓰여요.
  ro.a1.unit12.lesson02.teach.am_mancat_vocab:
    title: 저는 먹었어요
    gloss: Am mâncat (먹었어요)
    note: '*a mânca*(먹다)의 복합 과거예요. 10단원에서 *mănânc*(먹어요)로 이미 나왔던 같은 동사의 과거형이에요. am + mâncat으로, *am fost*와 같은 구조예요.'
    example_gloss:
    - 빵을 먹었어요.
  ro.a1.unit12.lesson02.teach.am_mancat_paine_phrase:
    title: 빵을 먹었어요
    gloss: Am mâncat pâine. (빵을 먹었어요.)
    note: '완전한 문형이에요: am mâncat + 음식.'
  ro.a1.unit12.lesson02.teach.am_baut_vocab:
    title: 나는 마셨어요
    gloss: Am băut (마셨어요)
    note: '*a bea*(마시다)의 복합 과거예요. 10단원에서 *beau*(마셔요)로 이미 나왔던 같은 동사의 과거형이에요.'
    example_gloss:
    - 차를 마셨어요.
  ro.a1.unit12.lesson02.teach.am_baut_ceai_phrase:
    title: 차를 마셨어요
    gloss: Am băut ceai. (차를 마셨어요.)
    note: '완전한 문형이에요: am băut + 음료.'
  ro.a1.unit12.lesson02.teach.am_mancat_am_baut_phrase:
    title: 빵을 먹고 차를 마셨어요
    gloss: Am mâncat pâine și am băut ceai. (빵을 먹고 차를 마셨어요.)
    note: 과거의 두 행동을 *și*로 이었어요. 10단원에서 현재 시제의 일과를 이을 때 썼던 것과 같은 연결 단어예요.
  ro.a1.unit12.lesson03.teach.reminder_am_fost_ieri_parc_cinema:
    title: '복습: am fost, ieri, parc, cinema'
    gloss: am fost (~에 있었어요 / ~에 갔어요) · ieri (어제) · parc (공원) · cinema (영화관)
    note: 모두 이번 단원의 첫 번째 수업에서 배운 표현이에요. 여기서는 일요일 이야기를 나누기 위한 바탕이 돼요.
  ro.a1.unit12.lesson03.teach.reminder_am_mancat_am_baut:
    title: '복습: am mâncat, am băut, pâine, cafea, ceai'
    gloss: am mâncat (먹었어요) · am băut (마셨어요) · pâine (빵) · cafea (커피) · ceai (차)
    note: 모두 이번 단원의 두 번째 수업에서 배운 표현이에요. 여기서는 아나와 미하이가 각자 무엇을 먹고 마셨는지 말해요.
  ro.a1.unit12.lesson03.teach.reminder_cum_duminica_bine:
    title: '복습: cum, duminică, bine, mulțumesc, la revedere, Ana, Mihai'
    gloss: cum (어떻게, 1단원/9단원) · duminică (일요일, 3단원) · bine (좋게/잘, 1단원) · mulțumesc (감사합니다) · la revedere (안녕히 가세요) · Ana, Mihai (이름)
    note: 모두 앞선 단원에서 이미 배웠어요. *cum*은 처음에 이름을 물을 때(1단원), 길을 물을 때(9단원) 나왔는데, 여기서는 일이 어떻게 되었는지 묻는 다른 종류의 질문을 시작해요.
  ro.a1.unit12.lesson03.teach.a_fost_vocab:
    title: ~였어요
    gloss: A fost (~였어요)
    note: '*am fost*와 같은 동사의 다른 인칭형이에요. *a*는 ''그/그녀/그것''에 쓰는 도움 단어이고, ''나/우리''에 쓰는 것이 아니에요. 지금은 *Cum a fost...?*와 *A fost bine!*를 자유롭게 응용하는 문형이 아니라 굳어진 표현으로 익혀 두세요.'
    example_gloss:
    - 좋았어요!
  ro.a1.unit12.lesson03.teach.a_fost_bine_phrase:
    title: 좋았어요!
    gloss: A fost bine! (좋았어요!)
    note: 일이 잘 되었다고 말하는 짧고 자연스러운 표현이에요. *Cum a fost...?*에 대한 대답이에요.
  ro.a1.unit12.lesson03.teach.cum_a_fost_duminica_phrase:
    title: 일요일은 어땠어요?
    gloss: Cum a fost duminică? (일요일은 어땠어요?)
    note: 최근의 하루에 대해 이야기를 시작하는 자연스러운 말이에요. 같이 있었던 사람에게도 쓸 수 있고, 어떤 느낌이었는지 또는 무엇이 기억에 남는지 이야기하도록 권하는 표현이에요.
  ro.a1.unit12.lesson03.teach.line01:
    title: 인사하고 일요일이 어땠는지 묻기
    gloss: 미하이가 아나에게 인사하고 일요일이 어땠는지 물어요.
    note: 이번 단원의 *Cum a fost duminică?*와 이미 아는 *Bună*를 합쳤어요.
  ro.a1.unit12.lesson03.teach.line02:
    title: 대답하고 어디에 갔는지 말하기
    gloss: 아나가 좋았다고 말하고 공원에 갔다고 말해요.
    note: '*A fost bine!*와 첫 번째 수업의 *Am fost la parc*를 합쳤어요.'
  ro.a1.unit12.lesson03.teach.line03:
    title: 무엇을 먹고 마셨는지 말하기
    gloss: 미하이가 빵을 먹고 차를 마셨다고 말해요.
    note: 두 번째 수업의 *Am mâncat pâine și am băut ceai*를 다시 썼어요. 6단원에서 정해진 미하이의 취향(pâine과 ceai)에 맞았어요.
  ro.a1.unit12.lesson03.teach.line04:
    title: 무엇을 마셨는지 말하기
    gloss: 아나가 커피를 마셨다고 말해요.
    note: 6단원에서 정해진 아나의 취향(cafea)에 맞았어요.
  ro.a1.unit12.lesson03.teach.line05:
    title: 감사 인사를 하고 작별하기
    gloss: 미하이가 아나에게 고맙다고 하고 작별 인사를 해요.
    note: 앞선 모든 단원의 대화가 끝났던 것과 같은 마무리 방식이에요.
  ro.a1.unit12.lesson03.teach.line06:
    title: 대화 마무리하기
    gloss: 아나가 미하이의 이름을 부르며 작별 인사를 받아 줘요.
    note: 앞선 모든 단원의 대화가 끝났던 것과 같은 다정한 마무리 방식이에요.
