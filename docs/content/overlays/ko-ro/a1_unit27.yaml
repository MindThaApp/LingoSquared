teaching:
  ro.a1.unit27.lesson01.teach.fericit_trist_suparat:
    title: 기쁜, 슬픈, 화난
    gloss: 기쁜, 슬픈, 화난
    note: '*a fi*(이다, 있다)와 함께 쓰는 기본 감정 단어 세 개예요. 각각 *-ă*로 끝나는 여성형이 있어요: *fericită*, *tristă*, *supărată*.'
    example_gloss:
    - 저는 기뻐요.
    - 저는 슬퍼요.
    - 저는 화가 나요.
  ro.a1.unit27.lesson01.teach.sunt_fericit:
    title: 기쁘다고 말하기
    gloss: 저는 기뻐요.
    note: '*Sunt*(*a fi*, ''이다''의 형태) + 감정 형용사가 기본 패턴이에요. 여성은 *Sunt fericită*라고 말해요.'
  ro.a1.unit27.lesson01.teach.nu_sunt_suparat:
    title: 대조되는 감정 말하기
    gloss: 저는 화난 게 아니라 슬퍼요.
    note: '동사 앞에 *Nu*를 쓰면 부정이 돼요: *Nu sunt supărat*. 그다음 절에서 실제 감정을 말해요.'
  ro.a1.unit27.lesson02.teach.de_ce_esti:
    title: 이유 묻기
    gloss: 왜 기뻐요?
    note: '*De ce*(왜)는 이유를 묻는 기본 표현이에요.'
  ro.a1.unit27.lesson02.teach.sunt_fericit_pentru:
    title: 이유 말하기
    gloss: 새 아파트가 생겨서 기뻐요.
    note: '*Pentru că*(왜냐하면)가 이유를 나타내는 절을 이끌고, 어순은 그대로예요: *am un apartament nou*.'
  ro.a1.unit27.lesson02.teach.sunt_trist_pentru:
    title: 부정적인 이유
    gloss: 저는 비가 와서 슬퍼요.
    note: '*Plouă*(비가 와요)는 루마니아어에서 주어가 없어서 그 자체로 이유를 나타내는 절이 될 수 있어요.'
  ro.a1.unit27.lesson03.teach.emotionat:
    title: 긴장한
    gloss: 긴장한
    note: 긴장한 상태를 나타내는 기본 단어예요.
    example_gloss: 첫 근무를 앞두고 긴장돼요.
  ro.a1.unit27.lesson03.teach.sunt_emotionat_pentru:
    title: 무엇 때문에 긴장하는지 말하기
    gloss: 첫 근무를 앞두고 긴장돼요.
    note: '*Pentru*(문자 그대로 ''~을 위해'')는 여기서 긴장의 대상이 되는 일을 나타내요. 한국어로는 ''~ 때문에''나 ''~에 대해'' 정도로 옮길 수 있어요.'
  ro.a1.unit27.lesson03.teach.nu_ti_face:
    title: 안심시키기
    gloss: 걱정하지 마세요.
    note: '*Nu-ți face griji*(문자 그대로 ''너 자신에게 걱정을 만들지 마'')는 안심시킬 때 쓰는 대표적인 고정 표현이에요. 낯선 사람에게는 *Nu vă faceți griji*라고 말해요.'
  ro.a1.unit27.lesson04.teach.cum_se_simte:
    title: 다른 사람의 기분 묻기
    gloss: 미하이는 기분이 어때요?
    note: '*A se simți*(느끼다)는 재귀 동사예요: *mă simt*(나), *te simți*(너), *se simte*(그/그녀). 기분을 묻거나 말할 때 쓰는 기본 표현이에요.'
  ro.a1.unit27.lesson04.teach.el_se_simte:
    title: 다른 사람의 기분 설명하기
    gloss: 그는 긴장하고 있어요.
    note: '*Se*는 그/그녀에 해당하는 재귀 대명사이고 동사 앞에 와요: *se simte*.'
  ro.a1.unit27.lesson04.teach.de_ce_se:
    title: 왜 그런 기분인지 묻기
    gloss: 그는 왜 긴장해요?
    note: '*El se simte emoționat*의 *se simte* 패턴에 *de ce*를 합친 문장이에요.'
  ro.a1.unit27.lesson05.teach.salut_ana_sunt:
    title: 감정에 관한 메시지 읽기
    gloss: 안녕, 아나. 혼자 하는 첫 근무라 조금 긴장돼. 그래도 새 직장과 새 아파트가 생겨서 행복하기도 해. 잘 해결될 거라고 생각해.
    note: 글쓴이가 무엇 때문에 긴장하는지, 무엇 때문에 기쁜지, 전반적으로 어떻게 전망하는지 살펴보세요.
    glosses:
      puțin: 조금
      emoționat: 긴장한
      prima: 첫 번째의
      tură: 근무
      singur: 혼자
      fericit: 기쁜
      fiindcă: 왜냐하면
      nou: 새로운
      serviciu: 일
      apartament: 아파트
      cred: 생각하다
      rezolvă: 잘 되다 (여기서는 괜찮을 것이다)
  ro.a1.unit27.lesson06.teach.ana_salut_mihai:
    title: 아나가 미하이의 기분을 물어요
    gloss: '아나: 안녕, 미하이. 첫 근무를 앞두고 기분이 어때?'
    note: '*Cum te simți*에는 재귀 대명사 *te*(''너 자신'')가 쓰였어요. *prima ta tură*에서는 소유사 *ta*가 여성 명사 *tură*에 맞춰진 형태예요.'
  ro.a1.unit27.lesson06.teach.mihai_sunt_putin:
    title: 미하이가 긴장한다고 털어놓아요
    gloss: '미하이: 솔직히 조금 긴장돼.'
    note: '*Sincer să fiu*(솔직히 말해서)는 털어놓는 말을 부드럽게 해 줘요.'
  ro.a1.unit27.lesson06.teach.ana_nu_ti:
    title: 아나가 그를 안심시켜요
    gloss: '아나: 걱정하지 마, 잘 해낼 거야!'
    note: '*O să te descurci bine*(문자 그대로 ''너는 잘 해낼 거야'')는 격려할 때 쓰는 고정 표현이에요. *o să* + 동사로 미래를 나타내요.'
  ro.a1.unit27.lesson06.teach.mihai_multumesc_chiar:
    title: 미하이가 고마워해요
    gloss: '미하이: 고마워, 정말 도움이 돼.'
    note: '*Ajută*는 *a ajuta*(돕다)의 그/그녀/그것 형태로, 여기서는 ''도움이 돼요''라는 뜻이에요.'
  ro.a1.unit27.lesson06.teach.ana_si_dupa:
    title: 아나가 결과를 예측해요
    gloss: '아나: 그리고 그 뒤에는 분명히 아주 행복하고 자랑스러울 거야.'
    note: '*Sigur*(분명히)는 확신에 찬 예측을 나타내요. *mândru*(자랑스러운)는 새로 나온 유용한 형용사예요(여성은 *mândră*).'
  ro.a1.unit27.lesson06.teach.mihai_da_si:
    title: 미하이가 동의해요
    gloss: '미하이: 응, 나도 그렇게 생각해.'
    note: '*Și eu cred asta*(문자 그대로 ''나도 이것을 믿어'')는 상대의 의견에 동의할 때 쓰는 자연스러운 표현이에요.'
  ro.a1.unit27.lesson06.teach.mihai_este_emotionat:
    title: este, lui, îl 정리하기
    gloss: 미하이는 첫 근무 때문에 긴장돼요. 아나가 그를 도와줘요.
    note: '*Este*는 *a fi*(~이다)의 he/she 형태예요. *lui*는 "그의"라는 뜻이고, 여기서는 *prima*와 *tură* 사이에 와요. *îl*은 "그를"이라는 뜻이며 동사 앞에 놓여요: *îl ajută*. 다른 사람에 대해 말할 때 꼭 필요한 작지만 중요한 세 단어예요.'
