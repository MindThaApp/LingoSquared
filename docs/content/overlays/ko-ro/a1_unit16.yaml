answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (doare, cap, stomac, simt, bolnav, nevoie, doctor, odihnă, multă) is used only in fixed first-person (Mihai's own "Nu mă simt bine"/"Sunt bolnav") or already-established formal ("Aveți nevoie de...?") forms. No informal-tu form is introduced this unit; Ana and Mihai keep their existing formal register with each other.
course:
  title: 한국어로 배우는 루마니아어 A1
  description: 루마니아어로 기본적인 건강 문제 말하기 -- Doare(아파요), Bolnav(아픈), Doctor(의사) -- 미하이가 몸이 안 좋을 때 아나가 살펴보고 조언해 줘요.
units:
  ro.a1.unit16.health:
    title: 건강
lessons:
  ro.a1.unit16.lesson01.ma_doare_capul:
    title: 머리가 아파요
  ro.a1.unit16.lesson02.nu_ma_simt_bine:
    title: 몸이 안 좋아요
  ro.a1.unit16.lesson03.mihai_este_bolnav:
    title: 미하이가 아파요
teaching:
  ro.a1.unit16.lesson01.teach.reminder_ma_va_ce_sau:
    title: '복습: mă, vă, ce, sau'
    gloss: mă (나를) · vă (당신을, 격식) · ce (무엇) · sau (또는)
    note: Mă는 1단원과 10단원(mă numesc, mă trezesc)에서, vă는 1·6·7·13단원(vă rog)에서, ce는 1·3·4·15단원에서, sau는 13단원에서 나왔어요. 이번 단원에서는 이 네 단어를 모두 새로운 목적, 즉 어디가 아픈지 말하는 데 다시 써요.
  ro.a1.unit16.lesson01.teach.doare_vocab:
    title: 아파요
    gloss: Doare (아파요)
    note: '비인칭 동사예요. 루마니아어는 ''내가 아프다''가 아니라 ''나에게 아프다''(*mă doare*)라고 말해요. *Mă doare*만으로 ''아파요''라는 뜻이고, 아픈 부위를 덧붙이면 어디가 아픈지 말할 수 있어요: *Mă doare capul*.'
    example_gloss:
    - 아파요.
  ro.a1.unit16.lesson01.teach.cap_vocab:
    title: 머리
    gloss: 머리
    note: 중성 명사이고 자음으로 끝나요. '그 머리'는 *-ul*을 붙여 말하는데, *tren*->*trenul*, *peron*->*peronul*과 같은 어미예요.
    example_gloss:
    - 머리가 아파요.
  ro.a1.unit16.lesson01.teach.ce_va_doare_phrase:
    title: 어디가 아프세요?
    gloss: Ce vă doare? (어디가 아프세요?)
    note: '*Ce*(무엇) + *vă*(당신에게, 존댓말 목적어) + *doare* -- 이미 배웠거나 방금 나온 단어들을 합쳐 새 질문을 만들었어요.'
  ro.a1.unit16.lesson01.teach.stomac_vocab:
    title: 위
    gloss: Stomac (위)
    note: 중성 명사이고 자음으로 끝나서 '그 위'는 *stomacul*이에요. *cap*->*capul*과 같은 *-ul* 어미예요.
    example_gloss:
    - 배가 아파요.
  ro.a1.unit16.lesson01.teach.ma_doare_capul_sau_stomacul_phrase:
    title: 머리가 아프세요, 아니면 위가 아프세요?
    gloss: Vă doare capul sau stomacul? (머리가 아프세요, 아니면 위가 아프세요?)
    note: '*mă* 대신 *vă*(존댓말 ''당신'')를 쓰면 상대방에게 묻는 질문이 돼요. *sau*(또는, 13과)가 방금 배운 두 신체 부위를 이어 줘요.'
  ro.a1.unit16.lesson02.teach.reminder_nu_bine_am_un_de:
    title: '복습: nu, bine, am, un, de'
    gloss: nu (아니요/~않다) · bine (잘/좋은) · am (나는 가지고 있다) · un (하나의, 남성/중성) · de (~의/~에서)
    note: Nu/bine는 1과, 6과, 11과에서, am은 2과, 5과, 15과에서, un/de는 6과, 7과, 15과에서 나왔어요. 이번 단원은 이 다섯 단어를 모두 다시 써서 몸이 안 좋다는 것과 의사가 필요하다는 것을 말해요.
  ro.a1.unit16.lesson02.teach.ma_simt_vocab:
    title: 느껴요
    gloss: Mă simt (나는 느껴요)
    note: 재귀 동사로, 직역하면 '나 자신을 느낀다'예요. 10과의 *mă trezesc*/*mă culc*와 같은 *mă* + 동사 형태예요.
    example_gloss:
    - 컨디션이 좋아요.
  ro.a1.unit16.lesson02.teach.nu_ma_simt_bine_phrase:
    title: 몸이 안 좋아요
    gloss: Nu mă simt bine. (몸이 안 좋아요.)
    note: '*Nu*가 *mă simt bine*를 부정해요. 구체적인 증상을 말하기 전에 어딘가 안 좋다고 말하는 자연스러운 방법이에요.'
  ro.a1.unit16.lesson02.teach.bolnav_vocab:
    title: 아픈
    gloss: Bolnav (아픈, 남성형)
    note: 형용사의 남성형으로, 미하이가 말하는 형태예요(*Sunt bolnav*). 여자는 *Sunt bolnavă*(여성형)라고 해요.
    example_gloss:
    - 저는 아파요.
  ro.a1.unit16.lesson02.teach.am_nevoie_de_un_doctor_phrase:
    title: 의사가 필요해요
    gloss: Am nevoie de un doctor. (의사가 필요해요.)
    note: '*Am nevoie de*(필요해요, 직역하면 ''~의 필요를 가지고 있다'') + *un doctor* -- 고정된 관용 표현이라 의사뿐 아니라 무엇이든 도움을 청할 때 쓸 수 있어요.'
  ro.a1.unit16.lesson02.teach.doctor_vocab:
    title: Doctor
    gloss: Doctor (의사)
    note: 남성 명사라서 '의사 한 명'은 *un doctor*예요.
    example_gloss:
    - 의사가 필요해요.
  ro.a1.unit16.lesson03.teach.reminder_ce_mai_faceti_aveti_da:
    title: '복습: Ce mai faceți?, Aveți, Da'
    gloss: Ce mai faceți? (어떻게 지내세요?, 존댓말) · Aveți (가지고 계세요, 존댓말) · Da (네)
    note: Ce mai faceți는 1과에서, Aveți는 5과에서, Da는 6과와 11과에서 나왔어요. 모두 이번 단원의 안부 대화에 다시 쓰여요.
  ro.a1.unit16.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: '복습: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (안녕하세요) · mulțumesc (감사합니다) · la revedere (안녕히 가세요) · Ana, Mihai (이름)
    note: 모두 앞 단원에서 이미 배운 말이에요. 이 과정의 모든 대화에서 써 온, 다정하게 시작하고 끝맺는 방식이에요.
  ro.a1.unit16.lesson03.teach.reminder_spitalul_vizavi_magazin:
    title: '복습: Spitalul este vizavi de magazin'
    gloss: Spitalul este vizavi de magazin. (병원은 가게 맞은편에 있어요.)
    note: 8과의 문장을 그대로 다시 썼어요. 병원 위치는 변함이 없고, 이번 단원의 읽기 노트도 이 문장을 다시 가리켜요.
  ro.a1.unit16.lesson03.teach.odihna_vocab:
    title: 휴식
    gloss: Odihnă (휴식)
    note: 여성 명사예요. 몸이 안 좋을 때 의사나 친구가 권해 주는 것이에요.
    example_gloss:
    - 휴식이 필요해요.
  ro.a1.unit16.lesson03.teach.multa_apa_vocab:
    title: 물을 많이
    gloss: Multă apă (많은 물)
    note: '*Multă*(많은, 여성형)는 여성 명사 *apă*(물, 6과)와 호응해요. 의사가 권할 법한 고정된 표현이에요.'
    example_gloss:
    - 휴식하고 물을 많이 드세요.
  ro.a1.unit16.lesson03.teach.line01:
    title: 인사하고 안부 묻기
    gloss: 아나가 미하이에게 인사하고 어떻게 지내는지 물어요.
    note: 1과의 *Ce mai faceți?* 인사를 다시 썼어요.
  ro.a1.unit16.lesson03.teach.line02:
    title: 몸이 안 좋다고 말하기
    gloss: 미하이가 몸이 안 좋고 머리가 아프다고 말해요.
    note: 이번 단원의 두 번째 수업 표현과 첫 번째 수업 표현을 합쳤어요.
  ro.a1.unit16.lesson03.teach.line03:
    title: 의사가 필요한지 묻기
    gloss: 아나가 의사가 필요한지 물어요.
    note: 이번 단원의 두 번째 수업 표현을 질문으로 바꾸고, 5과의 *aveți*를 썼어요.
  ro.a1.unit16.lesson03.teach.line04:
    title: 아프고 의사가 필요하다고 확인하기
    gloss: 미하이가 네, 아프고 의사가 필요하다고 말해요.
    note: 이번 단원의 *sunt bolnav*와 *am nevoie de un doctor*를 합쳤어요.
  ro.a1.unit16.lesson03.teach.line05:
    title: 조언하고 작별 인사하기
    gloss: 아나가 쉬고 물을 많이 마시라고 조언하고 작별 인사를 해요.
    note: 이번 수업의 *Odihnă și multă apă*를 썼어요. 평소의 단순한 작별 인사 대신 건강에 관한 조언을 건네요.
  ro.a1.unit16.lesson03.teach.line06:
    title: 고맙다고 하고 작별 인사하기
    gloss: 미하이가 아나에게 고맙다고 하고 작별 인사를 해요.
    note: 앞 단원의 대화들이 모두 마무리되던 것과 같은 끝인사예요.
