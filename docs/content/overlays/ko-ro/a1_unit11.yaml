  ro.a1.unit11.lesson01.mergem_la_cinema:
    title: 영화관에 갈까요?
  ro.a1.unit11.lesson02.nu_pot_atunci:
    title: 저는 못 가요. 그럼요?
  ro.a1.unit11.lesson03.planul_de_duminica:
    title: 일요일 계획
teaching:
  ro.a1.unit11.lesson01.teach.reminder_da_bine:
    title: '복습: da, bine, nu, mulțumesc'
    gloss: da(네) · bine(좋아요) · nu(아니요) · mulțumesc(고마워요)
    note: 모두 6단원에서 이미 배운 말이에요. 여기서는 이 단원의 약속 수락 표현과 어휘 복습 짝 맞추기 연습에서 함께 쓰여요.
  ro.a1.unit11.lesson01.teach.mergem_vocab:
    title: 갈까요 / 가요
    gloss: 가요 / 우리 가요
    note: '*a merge*의 1인칭 복수형이에요. 10단원의 *merg*(저는 가요)와 9단원의 *mergeți*(공손한 명령형)에서 이미 본 같은 동사이고, 인칭과 수만 달라요. 끝을 올려 말하면 함께 무언가를 하자고 제안하는 자연스러운 표현이 돼요.'
    example_gloss:
    - 영화관에 갈까요?
  ro.a1.unit11.lesson01.teach.cinema_vocab:
    title: 영화관
    gloss: 영화관
    note: 루마니아어 cinema는 '시네마'와 비슷한 계열의 단어라서, 영화관이라는 뜻을 쉽게 짐작할 수 있어요.
    example_gloss:
    - 영화관에 갈까요?
  ro.a1.unit11.lesson01.teach.mergem_cinema_phrase:
    title: 영화관에 갈까요?
    gloss: 영화관에 갈까요?
    note: 완전한 초대 표현이에요. '원하세요?' 같은 말을 덧붙일 필요 없이, 물음표만으로 '우리 가요'가 제안이 돼요.
  ro.a1.unit11.lesson01.teach.parc_vocab:
    title: 공원
    gloss: 공원
    note: '*cinema*처럼 외래어와 비슷해서 알아보기 쉬운 단어예요.'
    example_gloss:
    - 공원에 갈까요?
  ro.a1.unit11.lesson01.teach.mergem_parc_phrase:
    title: 공원에 갈까요?
    gloss: 공원에 갈까요?
    note: '*Mergem la cinema?*와 같은 초대 패턴이고, 장소만 달라요.'
  ro.a1.unit11.lesson01.teach.da_bine_phrase:
    title: 네, 좋아요!
    gloss: 네, 좋아요!
    note: 약속을 수락하는 짧고 자연스러운 표현이에요. 이미 아는 단어를 새롭게 조합했어요.
  ro.a1.unit11.lesson02.teach.reminder_nu_pot:
    title: '복습: nu, pot'
    gloss: nu(아니요 / ~ 않다) · pot(저는 할 수 있어요)
    note: '*Nu*는 6단원, pot은 9단원의 *cum pot să ajung*(어떻게 가면 되나요)에서 이미 나왔어요. nu를 동사 앞에 두면 부정이 돼요. *nu pot*은 ''저는 못 해요''라는 뜻이고, 이 단원에서 약속을 거절하는 표현이에요.'
  ro.a1.unit11.lesson02.teach.reminder_sambata_duminica:
    title: '복습: sâmbătă, duminică'
    gloss: 토요일 · 일요일
    note: 둘 다 3단원의 요일에서 이미 배웠어요.
  ro.a1.unit11.lesson02.teach.mergem_parc_sambata_phrase:
    title: 토요일에 공원에 갈까요?
    gloss: 토요일에 공원에 갈까요?
    note: 첫 번째 레슨의 초대에 요일을 붙였어요. *Mergem la parc?*에 요일 이름을 더한 표현이에요.
  ro.a1.unit11.lesson02.teach.nu_pot_sambata_phrase:
    title: 토요일엔 못 가요
    gloss: 토요일엔 못 가요.
    note: 간단한 거절이에요. *nu pot*에 거절하는 요일을 붙여요.
  ro.a1.unit11.lesson02.teach.atunci_vocab:
    title: 그럼 / 그러면
    gloss: 그럼 / 그러면
    note: 9단원에서 두 동작을 순서대로 이을 때 쓴 '그다음에'인 *apoi*와는 달라요. *atunci*는 대안을 제안하거나 결과를 이끌어 내는 말로, 일정을 다시 잡을 때 '그러면 ~는 어때요?'라고 말하기에 알맞아요.
    example_gloss:
    - 그럼 일요일은요?
  ro.a1.unit11.lesson02.teach.atunci_duminica_phrase:
    title: 그럼 일요일은요?
    gloss: 그럼 일요일은요?
    note: 거절당한 뒤에 하는 짧은 역제안이에요. 새 요일만 말하면 되고, 초대 전체를 반복할 필요는 없어요.
  ro.a1.unit11.lesson02.teach.da_bine_duminica_phrase:
    title: 네, 좋아요! 일요일이요.
    gloss: 네, 좋아요! 일요일이요.
    note: 바뀐 요일을 수락하는 표현으로, 첫 번째 레슨의 *Da, bine!*와 같은 짧은 패턴이에요.
  ro.a1.unit11.lesson03.teach.reminder_la_ce_ora_la_ora_patru:
    title: '복습: la ce oră, la ora, patru'
    gloss: la ce oră(몇 시에) · la ora(~시에) · patru(넷)
    note: La ce oră와 la ora는 시간을 묻고 말하는 4단원에서, patru는 2단원의 숫자에서 이미 배웠어요. 여기서는 이 단원의 만남 시간을 정할 때 함께 써요.
  ro.a1.unit11.lesson03.teach.reminder_buna_multumesc_la_revedere_da_ana_mihai:
    title: '복습: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună(안녕하세요) · mulțumesc(고마워요) · la revedere(안녕히 가세요) · da(네) · Ana, Mihai(이름)
    note: 모두 앞 단원에서 이미 배운 말이에요. 여기서는 아나와 미하이가 약속 시간을 정해요.
  ro.a1.unit11.lesson03.teach.sigur_vocab:
    title: 물론이죠
    gloss: 물론이죠
    note: 약속을 확인할 때 단독으로 자주 쓰는 표현이에요. 한국어의 '물론이죠!', '그럼요!'와 비슷해요.
    example_gloss:
    - 물론이죠! 네 시에요.
  ro.a1.unit11.lesson03.teach.sigur_phrase:
    title: 물론이죠! 네 시에요.
    gloss: 물론이죠! 네 시에요.
    note: 하나의 짧은 대답으로 약속과 정확한 시간을 함께 확인해요.
  ro.a1.unit11.lesson03.teach.line01:
    title: 인사하고 공원을 제안하기
    gloss: 아나가 미하이에게 인사하고, 일요일에 공원에 갈지 물어봐요.
    note: 이 단원의 *Mergem la parc?* 초대에 *duminică*를 더했어요.
  ro.a1.unit11.lesson03.teach.line02:
    title: 수락하고 시간 묻기
    gloss: 미하이가 수락하고 몇 시인지 물어봐요.
    note: 4단원의 *La ce oră?* 질문을 다시 써요.
  ro.a1.unit11.lesson03.teach.line03:
    title: 시간 제안하기
    gloss: 아나가 네 시를 제안해요.
    note: 4단원의 *la ora* 패턴에 이 단원의 *patru*를 쓴 짧은 질문이에요.
  ro.a1.unit11.lesson03.teach.line04:
    title: 확인하고 감사하기
    gloss: 미하이가 '물론이죠!'라고 확인하고 아나에게 고마워해요.
    note: 이 단원의 *sigur*와 이미 아는 *mulțumesc*를 함께 썼어요.
  ro.a1.unit11.lesson03.teach.line05:
    title: 작별 인사하기
    gloss: 아나가 작별 인사를 해요.
    note: 앞선 모든 단원의 대화가 끝났던 것과 같은 마무리 패턴이에요.
  ro.a1.unit11.lesson03.teach.line06:
    title: 만남 마무리하기
    gloss: 미하이가 아나의 이름을 부르며 작별 인사로 답해요.
    note: 앞선 모든 단원의 대화가 끝났던 것과 같은 다정한 마무리 패턴이에요.
