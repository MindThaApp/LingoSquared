answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's new words are all register-neutral -- mergem (first-person plural) and nu pot (first-person singular) don't change with tu/dumneavoastră, and atunci/sigur are invariant connective/response words with no person marking. No new second-person forms are introduced. Ana and Mihai's closing dialogue keeps their existing polite register with each other, matching 6단원/unit07/unit08/unit09/unit10.
course:
  title: 한국어로 배우는 루마니아어 A1
  description: 루마니아어로 간단한 약속을 제안하고, 수락하고, 거절하고, 일정을 정해 봐요. mergem(가요 / 우리 가요), nu pot(저는 못 해요), atunci(그럼 / 그러면), sigur(물론이죠)를 배우며, 공원에서 만나기로 약속하는 아나와 미하이의 이야기를 이어 가요.
