teaching:
  ro.a1.unit17.lesson01.teach.reminder_este_la_mihai:
    title: '복습: este, la, Mihai'
    gloss: este (~이다) · la (~에서) · Mihai (이름)
    note: Este는 3과, 4과, 8과에서 나왔고, la는 4과의 *la ora nouă*(아홉 시에)에서 나왔어요. Mihai는 1과부터 나온 등장인물의 이름이에요. 이번 단원에서는 이 세 가지를 다시 써서 그의 직업을 이야기해요.
  ro.a1.unit17.lesson01.teach.reminder_lucrez_lucreaza:
    title: '복습: lucrez, lucrează'
    gloss: lucrez (저는 일해요) · lucrează (그/그녀는 일해요)
    note: 둘 다 10과의 하루 일과(*Lucrez seara.*)에서 나왔어요. 이번 단원에서는 시간대 대신 직업을 이야기할 때 다시 써요.
  ro.a1.unit17.lesson01.teach.inginer_vocab:
    title: 엔지니어
    gloss: Inginer (엔지니어)
    note: 남성형이에요. 이번 단원에서는 미하이만 쓰기 때문에(*Sunt inginer*) 아직 여성형은 필요 없어요.
    example_gloss:
    - 미하이는 엔지니어예요.
  ro.a1.unit17.lesson01.teach.birou_vocab:
    title: 사무실
    gloss: Birou (사무실)
    note: 미하이가 일하는 곳이에요. 4과에서 배운 전치사 *la*(~에서)와 함께 써요.
    example_gloss:
    - 그는 사무실에서 일해요.
  ro.a1.unit17.lesson01.teach.mihai_este_inginer_lucreaza_la_birou_phrase:
    title: 미하이는 엔지니어예요. 그는 사무실에서 일해요.
    gloss: Mihai este inginer. Lucrează la birou.
    note: 여기 나온 단어는 모두 이미 배웠거나 방금 배운 것이에요. 이 단어들로 미하이의 직업에 관한 새 문장 두 개를 만들었어요.
  ro.a1.unit17.lesson02.teach.reminder_sunt_unde_ana:
    title: '복습: sunt, unde, Ana'
    gloss: sunt (저는 ~이에요) · unde (어디) · Ana (이름)
    note: Sunt는 16과(*Sunt bolnav*)에서, unde는 7과와 8과(*Unde pot să cumpăr...?*, *Unde este...?*)에서 나왔어요. Ana는 1과부터 나온 등장인물의 이름이에요. 이번 단원에서는 이 세 가지를 다시 써서 아나의 직업을 이야기해요.
  ro.a1.unit17.lesson02.teach.profesoara_vocab:
    title: 선생님
    gloss: Profesoară (선생님, 여성형)
    note: 여성형이에요. 이번 단원에서는 아나만 쓰기 때문에(*Sunt profesoară*) 아직 남성형은 필요 없어요.
    example_gloss:
    - 저는 선생님이에요.
  ro.a1.unit17.lesson02.teach.scoala_vocab:
    title: 학교
    gloss: Școală (학교)
    note: 아나가 일하는 곳이에요. *la birou*와 같은 방식으로 *la*를 써요.
    example_gloss:
    - 저는 학교에서 일해요.
  ro.a1.unit17.lesson02.teach.sunt_profesoara_lucrez_la_scoala_phrase:
    title: 저는 선생님이에요. 학교에서 일해요.
    gloss: Sunt profesoară. Lucrez la școală.
    note: 아나가 자신의 직업을 말하는 문장이에요. 이번 과의 새 단어 두 개와 16과에서 배운 *sunt*를 함께 썼어요.
  ro.a1.unit17.lesson02.teach.unde_lucrati_phrase:
    title: 어디에서 일하세요?
    gloss: Unde lucrați? (어디에서 일하세요? 격식)
    note: '*Lucrați*는 격식을 갖춘 ''일하세요''의 형태예요. *aveți*, *faceți*에서 이미 본 -ați/-eți 어미와 같아요. 누구에게든 직업을 물을 때 쓸 수 있어요.'
  ro.a1.unit17.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: '복습: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (안녕하세요) · Ce mai faceți? (어떻게 지내세요? 격식) · Bine, mulțumesc (잘 지내요, 고맙습니다)
    note: 모두 1과의 첫인사에서 나왔어요. 이번 단원의 대화를 시작할 때 다시 써요.
  ro.a1.unit17.lesson03.teach.reminder_si_dumneavoastra_la_revedere:
    title: '복습: Și dumneavoastră?, La revedere'
    gloss: Și dumneavoastră? (당신은요? 격식) · La revedere (안녕히 계세요)
    note: 둘 다 1과에서 나왔어요. 여기서는 자연스러운 되묻기와 마무리 인사로 다시 써요.
  ro.a1.unit17.lesson03.teach.line01:
    title: 인사하고 안부 묻기
    gloss: 아나가 미하이에게 인사하고 안부를 물어요.
    note: 1과의 인사 *Ce mai faceți?*를 다시 써요.
  ro.a1.unit17.lesson03.teach.line02:
    title: 대답하고 어디에서 일하는지 묻기
    gloss: 미하이가 대답한 뒤 아나에게 어디에서 일하는지 물어요.
    note: 1과의 *Bine, mulțumesc*와 이번 단원의 *Unde lucrați?*를 합쳤어요.
  ro.a1.unit17.lesson03.teach.line03:
    title: 직업과 일터를 말하고 되묻기
    gloss: 아나는 학교에서 선생님으로 일한다고 말한 뒤, 미하이에게 같은 질문을 해요.
    note: 이번 단원 두 번째 과의 문장과 1과의 *Și dumneavoastră?*를 합쳤어요.
  ro.a1.unit17.lesson03.teach.line04:
    title: 직업과 일터 말하기
    gloss: 미하이는 사무실에서 엔지니어로 일한다고 말해요.
    note: 이번 단원 첫 번째 과의 문장을 거의 그대로 다시 써요.
  ro.a1.unit17.lesson03.teach.line05:
    title: 대화 마무리하기
    gloss: 아나가 작별 인사를 해요.
    note: 앞선 모든 단원의 대화가 끝나던 것과 같은 마무리 방식이에요.
  ro.a1.unit17.lesson03.teach.line06:
    title: 작별 인사하기
    gloss: 미하이가 작별 인사를 해요.
    note: 앞선 모든 단원의 대화가 끝나던 것과 같은 마무리 방식이에요.
