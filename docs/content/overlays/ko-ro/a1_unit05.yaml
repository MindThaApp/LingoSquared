schema_version: '1.1'
overlay_version: 2026.1-draft.1
source_language: ko
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: derive_cross.py
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  notes: 'Derived from en-ro by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Korean string was translated and adapted. Needs native Korean review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: This unit's new "Ai frați?"/"Aveți frați?" and "Câți copii ai?"/"Câți copii aveți?" pairs are register-sensitive (tu vs. dumneavoastră, parallel to 2단원's ai/aveți age questions) -- accept either register unless an exercise explicitly names one. Ana and Mihai's closing dialogue keeps the dumneavoastră register 1단원 already established between them.
course:
  title: 한국어로 배우는 루마니아어 A1
  description: 루마니아어로 가족 이야기하기 -- 부모, 형제자매, 자녀, 결혼 여부를 다루고, 소유 표현 meu/mea 한 쌍과 2단원의 나이 묻기에서 나온 tu/dumneavoastră 질문 대비를 사용해요 -- 아나와 미하이가 서로의 가족을 알아가는 이야기가 이어져요.
units:
  ro.a1.unit05.family:
    title: 가족
lessons:
  ro.a1.unit05.lesson01.familia_mea:
    title: 나의 가족
  ro.a1.unit05.lesson02.frati_si_copii:
    title: 형제자매와 자녀
  ro.a1.unit05.lesson03.o_discutie_despre_familie:
    title: 가족에 관한 대화
teaching:
  ro.a1.unit05.lesson01.teach.reminder_am_un_o_si_mare:
    title: '복습: am, un, o, și, mare'
    gloss: am (나는 가지고 있다) · un/o (하나의) · și (그리고) · mare (큰)
    note: 다섯 단어 모두 앞선 단원에서 이미 나왔어요 (*și*는 1단원, *am*과 *o*는 2단원, *mare*는 3단원의 '대문자' 설명, *un*은 4단원). 여기서는 가족 이야기를 하는 데 다시 쓰여요.
  ro.a1.unit05.lesson01.teach.familie:
    title: 가족
    gloss: familie (가족)
    note: 여성 명사예요. *o*와 *mare* 같은 형용사와 함께 쓰면 '대가족'이라는 뜻이 돼요.
    example_gloss: 저는 대가족이에요.
  ro.a1.unit05.lesson01.teach.mama:
    title: 어머니
    gloss: mamă (어머니)
    note: '''어머니''를 뜻하는 기본 사전형 단어예요. ''나의 어머니''라고 말하는 법은 몇 장 뒤에 나와요.'
    example_gloss: 미하이에게는 어머니와 아버지가 계세요.
  ro.a1.unit05.lesson01.teach.tata:
    title: 아버지
    gloss: tată (아버지)
    note: '''아버지''를 뜻하는 기본 사전형 단어예요.'
    example_gloss: 저희 아버지는 선생님이세요.
  ro.a1.unit05.lesson01.teach.parintii:
    title: 부모님
    gloss: părinți (부모님)
    note: 한국어의 '부모님'처럼 아버지와 어머니를 함께 가리켜요.
    example_gloss: 저희 부모님은 루마니아에 사세요.
  ro.a1.unit05.lesson01.teach.meu_mea:
    title: '나의: meu와 mea'
    gloss: meu (나의, 남성) / mea (나의, 여성)
    note: 루마니아어에서 '나의'에 해당하는 말은 소유자가 아니라 소유되는 것의 성에 맞춰요 -- *tată*처럼 남성 명사에는 *meu*, *mamă*처럼 여성 명사에는 *mea*를 써요.
  ro.a1.unit05.lesson01.teach.mama_mea:
    title: 나의 어머니
    gloss: 나의 어머니
    note: Mamă는 mea가 붙기 전에 mama로 바뀌어요(정관사가 붙어요). '나의 어머니'는 단어를 하나씩 옮긴 말이 아니라 바로 이 결합형으로 말해요.
  ro.a1.unit05.lesson01.teach.tatal_meu:
    title: 나의 아버지
    gloss: 나의 아버지
    note: Tată는 meu가 붙기 전에 tatăl로 바뀌어요(정관사가 붙어요). tată가 이미 -ă로 끝나지만 불규칙하게 -l이 붙어요.
  ro.a1.unit05.lesson01.teach.mama_si_tatal:
    title: 나의 어머니와 나의 아버지
    gloss: 나의 어머니와 나의 아버지.
    note: 두 소유 표현을 한 문장에 함께 쓰며, 각각 알맞은 성에 맞춰요.
  ro.a1.unit05.lesson02.teach.reminder_cati_ai_aveti_doi_nu:
    title: '복습: câți, ai, aveți, doi, nu'
    gloss: câți (몇) · ai/aveți (당신은 가지고 있다, 친근한/격식 있는) · doi (둘) · nu (아니요/아니다)
    note: '*Câți*, *ai*, *aveți*는 2단원에서 나이를 물을 때("Câți ani ai?") 처음 나왔어요. 여기서는 형제자매와 자녀를 묻는 데 쓰여요. *Doi*는 2단원의 숫자에서, *nu*는 3단원에서 나왔어요.'
  ro.a1.unit05.lesson02.teach.da:
    title: 네
    gloss: da (네)
    note: 일상에서 '네'라고 대답할 때 쓰는 말로, 3단원의 *nu*('아니요')와 짝을 이뤄요.
    example_gloss: 네, 저는 형이(남자 형제가) 있어요.
  ro.a1.unit05.lesson02.teach.frate_sora:
    title: 남자 형제, 여자 형제
    gloss: frate (남자 형제) / soră (여자 형제)
    note: 남성과 여성 형제자매를 나타내는 명사예요 -- 다른 명사와 똑같이 un/o와 함께 써요.
    example_gloss:
    - 저는 남자 형제가 한 명 있어요.
    - 저는 여자 형제가 한 명 있어요.
  ro.a1.unit05.lesson02.teach.frati_surori:
    title: 남자 형제들, 여자 형제들
    gloss: frați (남자 형제들) / surori (여자 형제들)
    note: 형제자매에 대해 일반적으로 물을 때 쓰는 복수형이에요 -- 루마니아 사람들은 "형제자매가 있어요?"라는 뜻으로 흔히 "Ai frați?"("남자 형제가 있어요?")라고 묻고, 이어서 자매만 따로 확인하려고 "Surori?"를 덧붙이기도 해요.
    example_gloss: 형제나 자매가 있어요?
  ro.a1.unit05.lesson02.teach.ai_frati:
    title: 형제자매가 있어요? (친근한 표현)
    gloss: 형제자매가 있어요?
    note: 일상적으로 친근하게 묻는 방식이에요 -- 1단원의 *tu* 말투와 짝이 돼요.
  ro.a1.unit05.lesson02.teach.aveti_frati:
    title: 형제자매가 있으세요? (격식 있는 표현)
    gloss: 형제자매가 있어요?
    note: 공손한 표현이에요. 2단원의 나이 질문에서 쓴 *aveți*와 같아요.
  ro.a1.unit05.lesson02.teach.copil_copii:
    title: 아이, 아이들
    gloss: copil (아이) / copii (아이들)
    note: Copil은 루마니아어에서 까다로운 복수형 중 하나예요 -- 규칙적인 -i나 -e 어미가 아니라 copii이므로 따로 외워 두세요.
    example_gloss: 저는 아이가 둘 있어요.
  ro.a1.unit05.lesson02.teach.fiu_fiica:
    title: 아들, 딸
    gloss: fiu (아들) / fiică (딸)
    note: 아들과 딸을 가리키는 구체적인 단어로, 일반적인 copil/copii와 달라요.
    example_gloss:
    - 저는 아들이 하나 있어요.
    - 저는 딸이 하나 있어요.
  ro.a1.unit05.lesson02.teach.cati_copii_ai:
    title: 아이가 몇 명이에요?
    gloss: 아이가 몇 명이에요?
    note: Câți (몇) + copii (아이들) + ai (당신은 가지고 있다) -- 세 단어 모두 이미 익숙해요.
  ro.a1.unit05.lesson02.teach.casatorit:
    title: 결혼한
    gloss: căsătorit (결혼한)
    note: 나이를 묻는 것처럼, 일상 대화에서 개인 정보를 묻는 흔한 질문이에요.
    example_gloss: 결혼하셨어요?
  ro.a1.unit05.lesson03.teach.reminder_bine_la_revedere:
    title: '복습: bine, la revedere, Ana, Mihai'
    gloss: bine (좋은/잘) · la revedere (안녕히 가세요) · Ana, Mihai (이름)
    note: 앞선 단원에서 배운 어휘를 정리한 것으로, 이번 과의 대화에서 다시 쓰여요.
  ro.a1.unit05.lesson03.teach.line01:
    title: 형제자매에 대해 묻기
    gloss: 아나가 미하이에게 형제자매가 있는지 물어요.
    note: 두 사람이 서로 쓰던 말투에 맞게 공손한 *aveți*를 써요.
  ro.a1.unit05.lesson03.teach.line02:
    title: 대답하고 되묻기
    gloss: 미하이는 형과 누나(남자 형제와 여자 형제)가 있다고 말하고, 아나에게 자녀가 있는지 물어요.
    note: 이번 단원의 frate/soră와 copii 어휘를 한 번의 대화에서 함께 써요.
  ro.a1.unit05.lesson03.teach.line03:
    title: 대답하고 같은 질문을 되묻기
    gloss: 아나는 딸이 있다고 말하고, 미하이에게 같은 질문을 되물어요.
    note: '*Și dumneavoastră?*(''당신은요?'')는 1단원 자기소개에서 나온 되묻기 표현과 똑같아요.'
  ro.a1.unit05.lesson03.teach.line04:
    title: 대답하기
    gloss: 미하이는 아들이 하나 있다고 말해요.
    note: 이번 단원의 fiu를 쓴 짧고 직접적인 대답이에요.
  ro.a1.unit05.lesson03.teach.line05:
    title: 반응하고 마무리하기
    gloss: 아나는 긍정적으로 반응하고 작별 인사를 해요.
    note: 여기서 *Bine!*는 짧은 긍정 반응이며, 1단원의 *Bine, mulțumesc.*에 나온 그 단어예요.
  ro.a1.unit05.lesson03.teach.line06:
    title: 만남 마무리하기
    gloss: 미하이도 아나의 이름을 부르며 작별 인사를 해요.
    note: 1단원과 4단원의 대화가 모두 이런 다정한 인사로 끝났어요.
