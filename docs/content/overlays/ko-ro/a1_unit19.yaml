answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (vreme, soare, cald, plouă, vânt, frig) is used only in person-invariant impersonal constructions ("Este soare," "Plouă," "Este vânt," "Este frig," "Cum este vremea?") with no register distinction of any kind. No new tu/ dumneavoastră form is introduced this unit; Ana and Mihai keep their existing formal register with each other in the dialogue's greeting/closing lines.
course:
  title: 한국어로 배우는 루마니아어 A1
  description: Ana와 Mihai가 내일 일기예보를 확인하고 언제 공원에 갈지 정하면서, 기본적인 날씨 표현인 Vreme(날씨), Soare(해, 화창한), Cald(따뜻한), Plouă(비가 와요), Vânt(바람), Frig(추운)를 로마니아어로 말해 봐요.
units:
  ro.a1.unit19.weather:
    title: 날씨
lessons:
  ro.a1.unit19.lesson01.vremea_de_azi:
    title: 오늘의 날씨
  ro.a1.unit19.lesson02.vremea_de_maine:
    title: 내일의 날씨
  ro.a1.unit19.lesson03.planul_de_sambata:
    title: 토요일 계획
teaching:
  ro.a1.unit19.lesson01.teach.reminder_ana_este:
    title: '복습: Ana, Este, Și'
    gloss: Ana (이름) · Este (~이다) · Și (그리고)
    note: Ana는 1단원부터 나온 등장인물의 이름이에요. *este*는 8단원의 장소 표현에서, *și*는 5단원에서 나왔어요. 이 단원에서는 세 가지를 모두 다시 써서 오늘의 날씨를 말해요.
  ro.a1.unit19.lesson01.teach.reminder_astazi:
    title: '복습: Astăzi'
    gloss: Astăzi (오늘)
    note: 3단원의 날짜 어휘에서 나온 말이에요. 여기서는 오늘의 날씨를 말할 때 다시 써요.
  ro.a1.unit19.lesson01.teach.vreme_vocab:
    title: 날씨
    gloss: Vreme (날씨)
    note: '*Vremea*는 *vreme*의 정관사 형태로 ''그 날씨''라는 뜻이에요. -e로 끝나는 여성 명사는 -a를 붙여요. 18단원의 *baie* → *baia*(그 욕실)와 같아요.'
    example_gloss:
    - 날씨가 어때요?
  ro.a1.unit19.lesson01.teach.cum_este_vremea_phrase:
    title: 날씨가 어때요?
    gloss: Cum este vremea? (날씨가 어때요?)
    note: 날씨를 물을 때 일상적으로 쓰는 표현이에요. *cum*은 1단원, 9단원, 12단원에서 나왔어요.
  ro.a1.unit19.lesson01.teach.soare_vocab:
    title: 해 / 화창한
    gloss: Soare (해 / 화창한)
    note: 화창한 날씨를 말할 때 *este*와 함께 써요. *Este soare*는 글자 그대로 '해예요'이고, '화창해요'라는 뜻이에요.
    example_gloss:
    - 오늘은 화창해요.
  ro.a1.unit19.lesson01.teach.cald_vocab:
    title: 따뜻한 / 더운
    gloss: Cald (따뜻한 / 더운)
    note: 형태가 변하지 않는 날씨 표현이에요. *Este cald*에서는 항상 같은 형태를 쓰고, 성이나 수에 맞춰 바뀌지 않아요.
    example_gloss:
    - 오늘은 따뜻해요.
  ro.a1.unit19.lesson01.teach.astazi_soare_cald_phrase:
    title: 오늘은 화창해요. 따뜻해요.
    gloss: Astăzi este soare. Este cald.
    note: 여기 나온 단어는 모두 이미 배웠거나 방금 배운 것들이에요. 이것들을 합쳐 오늘의 날씨를 말하는 새 문장 두 개를 만들었어요.
  ro.a1.unit19.lesson02.teach.reminder_mihai_maine:
    title: '복습: Mihai, Mâine'
    gloss: Mihai (이름) · Mâine (내일)
    note: Mihai는 1단원부터 나온 등장인물의 이름이에요. *mâine*은 3단원과 12단원에서 나왔어요. 이 단원에서는 둘 다 다시 써서 내일 일기예보를 말해요.
  ro.a1.unit19.lesson02.teach.reminder_nu_mergem_la_parc:
    title: '복습: Nu, Mergem, La parc'
    gloss: Nu (아니요 / ~지 않다) · Mergem (우리는 가요) · La parc (공원에)
    note: 모두 11단원의 계획 정하기 어휘에서 나왔어요. 여기서는 날씨 때문에 공원에 갈 수 있을지 정할 때 다시 써요.
  ro.a1.unit19.lesson02.teach.ploua_vocab:
    title: 비가 와요
    gloss: Plouă (비가 와요)
    note: 주어가 없는 비인칭 동사 형태예요. *Este cald*에도 주어가 필요 없는 것과 같아요.
    example_gloss:
    - 내일은 비가 와요.
  ro.a1.unit19.lesson02.teach.vant_vocab:
    title: 바람
    gloss: Vânt (바람)
    note: '*soare*처럼 *este*와 함께 써요. *Este vânt*는 ''바람이 불어요''라는 뜻이에요.'
    example_gloss:
    - 내일은 바람이 불어요.
  ro.a1.unit19.lesson02.teach.frig_vocab:
    title: 추위
    gloss: Frig (추운)
    note: '*este*와 함께 써요. *Este frig*는 ''추워요''라는 뜻이에요.'
    example_gloss:
    - 내일은 추워요.
  ro.a1.unit19.lesson02.teach.maine_ploua_phrase:
    title: 내일은 비가 와요. 바람이 불고 추워요.
    gloss: Mâine plouă. Este vânt și este frig.
    note: 여기 나온 단어는 모두 이미 배웠거나 방금 배운 것들이에요. 이것들을 합쳐 내일의 일기예보를 완성했어요.
  ro.a1.unit19.lesson02.teach.nu_mergem_phrase:
    title: 내일은 공원에 가지 않아요.
    gloss: Nu mergem la parc mâine. (내일은 공원에 가지 않아요.)
    note: 이 수업이 향해 가는, 날씨에 따른 계획이에요. 11단원의 *mergem*과 *la parc* 앞에 *nu*를 붙였어요.
  ro.a1.unit19.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: '복습: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (안녕하세요) · Ce mai faceți? (어떻게 지내세요? 존댓말) · Bine, mulțumesc (잘 지내요, 고맙습니다)
    note: 모두 1단원의 첫인사에서 나왔어요. 이 단원의 대화를 시작할 때 다시 써요.
  ro.a1.unit19.lesson03.teach.reminder_sambata_la_revedere:
    title: '복습: Sâmbătă, La revedere'
    gloss: Sâmbătă (토요일) · La revedere (안녕히 가세요)
    note: '*Sâmbătă*는 3단원, 11단원, 12단원에서, *la revedere*는 1단원에서 나왔어요. 둘 다 주말 계획 대화에서 다시 써요.'
  ro.a1.unit19.lesson03.teach.line01:
    title: Mihai에게 인사하고 안부 묻기
    gloss: Ana가 Mihai에게 인사하고 어떻게 지내는지 물어요.
    note: 1단원의 *Ce mai faceți?* 인사를 다시 써요.
  ro.a1.unit19.lesson03.teach.line02:
    title: 대답하고 내일 날씨 묻기
    gloss: Mihai가 대답한 다음, 내일 날씨가 어떨지 Ana에게 물어요.
    note: 1단원의 *Bine, mulțumesc*와 이 단원 첫 수업의 표현 *Cum este vremea?*를 합치고 *mâine*를 더했어요.
  ro.a1.unit19.lesson03.teach.line03:
    title: 내일 일기예보 말하기
    gloss: Ana가 내일은 비가 오고 바람이 불며 춥다고 말해 줘요.
    note: 이 단원의 lesson02 표현을 그대로 다시 써요.
  ro.a1.unit19.lesson03.teach.line04:
    title: 공원 대신 토요일에 가자고 제안하기
    gloss: Mihai는 내일은 공원에 가지 않는다고 말하고, 대신 토요일은 어떤지 물어요.
    note: 이 단원 lesson02의 표현에 11단원의 *mergem*과 이번 단원의 *sâmbătă*를 합친 문장이에요.
  ro.a1.unit19.lesson03.teach.line05:
    title: 토요일은 화창하다고 말하며 동의하기
    gloss: Ana는 토요일에 해가 날 거라고 말하며 계획에 동의해요.
    note: '*soare*와, 11단원에서 배운 동의 표현 *Da, bine!*를 합친 문장이에요.'
  ro.a1.unit19.lesson03.teach.line06:
    title: 작별 인사하기
    gloss: Mihai가 작별 인사를 해요.
    note: 앞선 모든 단원의 대화가 끝날 때 쓴 것과 같은 마무리 표현이에요.
  ro.a1.unit19.lesson03.teach.line07:
    title: 작별 인사하기
    gloss: Ana가 작별 인사를 해요.
    note: 앞선 모든 단원의 대화가 끝날 때 쓴 것과 같은 마무리 표현이에요.
