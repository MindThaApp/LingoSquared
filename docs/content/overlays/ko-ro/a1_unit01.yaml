review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  notes: 'Derived from en-ro by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Korean string was translated and adapted. Needs native Korean review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: 한국어로 배우는 루마니아어 A1
  description: 표준 루마니아어 인사말과 첫 만남 소개를 배워요. 이 단계에서 가장 중요한 차이인 편한 말투 tu와 공손한 말투 dumneavoastră, 그리고 이름을 말하는 일상적인 두 가지 방법(mă numesc.../mă cheamă...)을 중점적으로 다뤄요.
units:
  ro.a1.unit01.greetings:
    title: 인사와 첫 만남
lessons:
  ro.a1.unit01.lesson01.tu_dumneavoastra_greetings:
    title: '인사말: tu와 dumneavoastră'
  ro.a1.unit01.lesson02.names_introductions:
    title: 이름이 뭐예요?
  ro.a1.unit01.lesson03.street_meeting:
    title: 길에서 만난 사이
teaching:
  ro.a1.unit01.lesson01.teach.buna:
    title: 일상 인사
    gloss: 안녕; 안녕하세요
    note: Bună는 일상적이고 약간 편한 인사예요. 친구나 또래, 그리고 대부분의 가벼운 낮 만남에서 안심하고 쓸 수 있어요.
    example_gloss: 안녕, Mihai!
  ro.a1.unit01.lesson01.teach.salut:
    title: 친근한 인사
    gloss: 안녕; 잘 가
    note: Salut는 친구나 또래 사이에서 쓰는 편한 인사예요. 만날 때도 헤어질 때도 쓸 수 있지만, 낯선 어른에게 처음 건네는 인사로는 가장 안전한 선택이 아니에요.
    example_gloss: 안녕, Ana!
  ro.a1.unit01.lesson01.teach.buna_ziua:
    title: 격식 있는 인사
    gloss: 안녕하세요(격식)
    note: Bună ziua는 낯선 어른이나 가게 주인, 그리고 dumneavoastră로 부르는 모든 사람에게 쓰는 안전하고 공손한 인사예요. 직역하면 '좋은 낮'이지만, 정오에만 쓰는 게 아니라 공손한 인사말로 두루 써요.
    example_gloss: 안녕하세요, Ana!
  ro.a1.unit01.lesson01.teach.la_revedere:
    title: 일반적인 작별 인사
    gloss: 안녕히 가세요
    note: La revedere는 공손한 상황에서도 편한 상황에서도 모두 쓸 수 있어요.
    example_gloss: 안녕하세요! 안녕히 가세요!
  ro.a1.unit01.lesson01.teach.tu:
    title: 친근한 단수 "너"
    gloss: 너(친근한 단수)
    note: 한국어에 반말과 존댓말이 있듯이, 루마니아어 2인칭 대명사도 상대와의 거리감을 드러내요. tu는 친구, 아이, 또는 분명히 편한 사이인 한 사람에게 쓰고, 고유한 동사 형태를 가져요(faceți가 아니라 faci).
  ro.a1.unit01.lesson01.teach.dumneavoastra:
    title: 공손한 "당신" 또는 복수 "너희"
    gloss: 당신, 여러분 (공손한 단수 또는 복수)
    note: Dumneavoastră는 낯선 어른 한 명에게 쓰는 안전한 선택이고, 공손하게 대하는 여러 사람에게도 써요. domnia voastră(나리)에서 나온 말이며, 한 사람을 가리킬 때도 복수 동사형(faceți, numiți)을 써요.
  ro.a1.unit01.lesson01.teach.ce_mai_faceti:
    title: 격식 있는 안부 질문
    gloss: 안녕하세요?
    note: Faceți는 a face(하다, 만들다)의 dumneavoastră 형태예요. 이 문장은 관습적인 공손한 안부 질문이지, 상대가 지금 무엇을 하고 있는지 그대로 묻는 말이 아니에요.
  ro.a1.unit01.lesson01.teach.ce_mai_faci:
    title: 격식 없는 안부 질문
    gloss: 안녕하세요?
    note: Faci는 a face의 tu 형태예요. 이 질문은 공손한 형태와 편한 형태 사이에 동사 어미만 달라지고, ce mai는 어느 쪽이든 그대로예요.
  ro.a1.unit01.lesson01.teach.bine_multumesc:
    title: 기본적인 긍정 대답
    gloss: 잘 지내요, 고마워요.
    note: Bine, mulțumesc는 말투와 상관없이 ce mai faci/faceți에 대한 대답으로 써요. 대답 자체는 바뀌지 않아요.
    example_gloss: 어떻게 지내요? 잘 지내요, 고맙습니다.
  ro.a1.unit01.lesson01.teach.register_choice:
    title: 인사와 관계 맞추기
    gloss: Bună ziua는 dumneavoastră와, Salut는 tu와
    note: 절대적인 규칙이 아니라 쓸 만한 기본 짝이에요. Bună ziua로 격식 있게 시작한 대화가 dumneavoastră로 이어질 수도 있고, Salut와 dumneavoastră를 함께 쓰면 보통 서로 어긋나는 신호를 줘요.
  ro.a1.unit01.lesson02.teach.ma_numesc:
    title: 이름 말하기(표준)
    gloss: 제 이름은 Ana예요.
    note: Mă numesc는 직역하면 '나를 명명한다'는 뜻이에요. 어디서나 쓸 수 있는 중립적인 이름 소개 방법으로, 한국어의 '제 이름은 ~입니다'와 격식 정도가 비슷해요.
    example_gloss: 안녕하세요! 제 이름은 Ana예요.
  ro.a1.unit01.lesson02.teach.cum_va_numiti:
    title: 공손하게 이름 묻기
    gloss: 성함이 어떻게 되세요?
    note: Numiți는 a se numi(~라고 불리다)의 dumneavoastră 형태예요. Vă는 dumneavoastră에 맞는 재귀 대명사로, 여기서는 꼭 필요해요.
  ro.a1.unit01.lesson02.teach.ma_cheama:
    title: 이름 말하기(대화체)
    gloss: Mihai라고 해요.
    note: Mă cheamă는 이름을 말하는 좀 더 대화체적인 방법이에요. 직역하면 '그것이 나를 부른다'는 뜻이에요. Mă numesc와 mă cheamă는 둘 다 맞고 흔히 쓰이며, mă cheamă가 조금 더 편한 느낌이에요.
    example_gloss: 안녕하세요! Mihai라고 해요.
  ro.a1.unit01.lesson02.teach.cum_te_cheama:
    title: 격식 없이 이름 묻기
    gloss: 이름이 뭐예요?
    note: Te는 tu에 맞는 재귀 대명사예요. 친구나 또래끼리 서로 이름을 물을 때 쓰는 일상적인 표현이에요.
  ro.a1.unit01.lesson02.teach.imi_pare_bine:
    title: 처음 만났을 때
    gloss: 만나서 반가워요!
    note: Îmi pare bine는 직역하면 '나에게 좋게 보인다'는 뜻이에요. 낱말 하나하나로 풀 수 없는 관용적인 고정 표현이에요. 한국어 '반갑다'처럼 말하는 사람의 성별에 따라 형태가 바뀌지 않아요.
    example_gloss: Mihai라고 해요. 만나서 반가워요!
  ro.a1.unit01.lesson02.teach.si_mie_imi_pare_bine:
    title: 같은 마음으로 답하기
    gloss: 저도 만나서 반가워요!
    note: Și mie는 대화를 시작할 때 쓴 것과 같은 고정 표현 앞에 '~도'라는 뜻을 더해 줘요.
  ro.a1.unit01.lesson02.teach.si_dumneavoastra:
    title: 공손하게 되묻기
    gloss: 당신은요?
    note: 공손한 말투를 유지하거나 여러 사람에게 말할 때 dumneavoastră를 써요.
  ro.a1.unit01.lesson02.teach.si_tu:
    title: 친근하게 되묻기
    gloss: 당신은요?
    note: 친구나 또래 한 명에게 편하게 말할 때는 și 뒤에 tu를 써요.
  ro.a1.unit01.lesson03.teach.line01:
    title: 만남 시작하기
    gloss: Ana가 Mihai에게 격식 있게 인사하고 자기 이름을 말해요.
    note: Ana는 모르는 사람을 만났을 때 어울리는 공손한 bună ziua로 말을 시작해요.
  ro.a1.unit01.lesson03.teach.line02:
    title: 만남 시작하기, 답하기
    gloss: Mihai는 같은 마음을 전하고, 자기 이름을 말한 다음, 상대방의 안부를 물어요.
    note: Mihai는 Ana가 시작한 공손한 말투를 그대로 유지해요. ce mai faci가 아니라 ce mai faceți라고 물어요.
  ro.a1.unit01.lesson03.teach.line03:
    title: 대답하고 질문 되돌리기
    gloss: Ana는 잘 지낸다고 말하고, 같은 질문을 Mihai에게 공손하게 되물어요.
    note: Și dumneavoastră는 처음 시작한 때와 같이 대화를 격식 있게 유지해요.
  ro.a1.unit01.lesson03.teach.line04:
    title: 대답하고 마무리하기
    gloss: Mihai도 잘 지낸다고 말하고 작별 인사를 해요.
    note: La revedere는 중립적인 작별 인사라서, 격식 있는 대화에도 편한 대화에도 어울려요.
  ro.a1.unit01.lesson03.teach.line05:
    title: 만남 마무리하기
    gloss: Ana가 같은 작별 인사로 답해요.
    note: la revedere를 그대로 되돌려 말하는 것이 다정한 마무리를 확인하는 자연스러운 방법이에요.
exercises:
  ro.a1.unit01.lesson01.exercise01.listen_buna:
    instruction: 잘 듣고 들리는 표현을 고르세요.
    correct_option: Bună!
    distractors:
    - Salut!
    - La revedere!
    accepted_answers:
    - Bună!
    - Bună
  ro.a1.unit01.lesson01.exercise02.choose_informal_pronoun:
    instruction: 이 친근한 인사에 어울리는 대명사는 무엇일까요?
    correct_option: tu
    distractors:
    - dumneavoastră
    accepted_answers:
    - tu
    feedback: Salut와 tu는 둘 다 친근한 말투라서 잘 어울려요.
  ro.a1.unit01.lesson01.exercise04.order_polite_question:
    instruction: 정중하게 안부를 묻는 문장을 순서대로 배열하세요.
    correct_response:
    - Ce
    - mai
    - faceți
  ro.a1.unit01.lesson01.exercise06.match_register:
    instruction: 각 인사말을 초급 수준에서 주로 쓰는 말투와 연결하세요.
    correct_response:
      Bună ziua: dumneavoastră
      Salut: 너 (친구에게 쓰는 말)
    pairs:
    - left: Bună ziua
      right: dumneavoastră
    - left: Salut
      right: 너 (친구에게 쓰는 말)
  ro.a1.unit01.lesson01.exercise03.choose_polite_pronoun:
    instruction: 잘 모르는 어른 한 명에게 하는 인사를 완성하세요.
    accepted_answers:
    - dumneavoastră
    feedback: Dumneavoastră는 낯선 어른에게 쓰는 안전하고 예의 바른 선택이에요.
  ro.a1.unit01.lesson01.exercise05.listen_informal_question:
    instruction: 들리는 친근한 질문을 입력하세요.
    accepted_answers:
    - Ce mai faci?
    - Ce mai faci
  ro.a1.unit01.lesson01.exercise07.complete_farewell:
    instruction: 일반적인 작별 인사를 완성하세요.
    accepted_answers:
    - revedere
  ro.a1.unit01.lesson01.exercise08.speak_greeting:
    instruction: 정중하게 인사하고, 상대의 안부를 묻고, 대화를 마무리하세요.
    accepted_answers:
    - Bună ziua. Ce mai faceți? La revedere.
    - Bună ziua, ce mai faceți? La revedere.
  ro.a1.unit01.lesson02.exercise02.listen_name_question:
    instruction: 듣고 정중하게 이름을 묻는 질문을 고르세요.
    correct_option: Cum vă numiți?
    distractors:
    - Cum te cheamă?
    - Ce mai faceți?
    accepted_answers:
    - Cum vă numiți?
    - Cum va numiti?
  ro.a1.unit01.lesson02.exercise05.choose_reply_meaning:
    instruction: Mihai의 말은 무슨 뜻일까요?
    correct_option: 만나서 반가워요!
    distractors:
    - 안녕히 가세요!
    - 안녕하세요?
    accepted_answers:
    - 만나서 반가워요!
  ro.a1.unit01.lesson02.exercise01.order_self_intro:
    instruction: Ana의 자기소개를 만들어 보세요.
    correct_response:
    - Mă
    - numesc
    - Ana
  ro.a1.unit01.lesson02.exercise07.match_introductions:
    instruction: 각 이름 질문에 알맞은 대답을 짝지어 보세요.
    correct_response:
      Cum vă numiți?: Mă numesc Ana.
      Cum te cheamă?: Mă cheamă Mihai.
    pairs:
    - left: Cum vă numiți?
      right: Mă numesc Ana.
    - left: Cum te cheamă?
      right: Mă cheamă Mihai.
  ro.a1.unit01.lesson02.exercise03.informal_name_question:
    instruction: 친근한 인사 뒤에 상대의 이름을 물어보세요.
    accepted_answers:
    - Cum te cheamă?
    - Cum te cheama?
  ro.a1.unit01.lesson02.exercise04.complete_ma_cheama:
    instruction: Mihai의 이름을 말하는 표현을 완성하세요.
    accepted_answers:
    - Mă
  ro.a1.unit01.lesson02.exercise06.return_polite_question:
    instruction: 정중한 말투를 유지한 채 같은 질문을 되돌려 주세요.
    accepted_answers:
    - Și dumneavoastră?
    - Si dumneavoastra?
  ro.a1.unit01.lesson02.exercise08.write_introduction:
    instruction: 당신은 Ana예요. Bună로 인사하고, mă numesc로 이름을 말한 다음, '만나서 반가워요'라는 뜻의 표현을 쓰세요.
    accepted_answers:
    - Bună. Mă numesc Ana. Îmi pare bine.
    - Buna. Ma numesc Ana. Imi pare bine.
  ro.a1.unit01.lesson03.exercise01.role_selection:
    instruction: 대화에서 이 표현으로 이름을 말하는 사람은 누구일까요?
    correct_option: Ana
    distractors:
    - Mihai
    - 둘 다 아니에요
    accepted_answers:
    - Ana
  ro.a1.unit01.lesson03.exercise02.comprehend_register:
    instruction: Ana와 Mihai는 서로에게 어떤 대명사를 쓸까요?
    correct_option: dumneavoastră
    distractors:
    - 너 (친구에게 쓰는 말)
    - te
    accepted_answers:
    - dumneavoastră
  ro.a1.unit01.lesson03.exercise03.comprehend_names:
    instruction: mă numesc를 쓰는 사람은 누구이고, mă cheamă를 쓰는 사람은 누구일까요?
    correct_option: Ana uses mă numesc; Mihai uses mă cheamă.
    distractors:
    - Mihai uses mă numesc; Ana uses mă cheamă.
    - 두 사람 모두 mă numesc를 써요.
    accepted_answers:
    - Ana uses mă numesc; Mihai uses mă cheamă.
    - Ana; Mihai
  ro.a1.unit01.lesson03.exercise05.order_closing:
    instruction: 마무리하는 대답과 작별 인사를 만들어 보세요.
    correct_response:
    - Bine,
    - mulțumesc.
    - La
    - revedere!
  ro.a1.unit01.lesson03.exercise04.role_response:
    instruction: Ana의 역할을 해 보세요. 공손하게 대답하고 질문을 되돌려 주세요.
    accepted_answers:
    - Bine, mulțumesc. Și dumneavoastră?
    - Bine, multumesc. Si dumneavoastra?
  ro.a1.unit01.lesson03.exercise06.speak_role:
    instruction: Ana의 역할을 해 보세요. Mihai에게 격식 있게 인사하고, 이름을 말하고, 그의 인사에 답한 다음, 만남을 마무리하세요.
    accepted_answers:
    - Bună ziua. Mă numesc Ana. Îmi pare bine! La revedere!
    - Buna ziua. Ma numesc Ana. Imi pare bine! La revedere!
    - Bună ziua. Mă numesc Ana. Și mie îmi pare bine! La revedere!
  ro.a1.unit01.lesson01.exercise09.dictation_buna:
    instruction: 들리는 대로 입력하세요.
    correct_option: Bună
    accepted_answers:
    - value: Bună
      status: correct
    orthography_strict: true
