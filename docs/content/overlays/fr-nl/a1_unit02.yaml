teaching:
  nl.a1.unit02.lesson01.teach.zero_to_four:
    title: De zéro à quatre
    gloss: 0 — zéro, 1 — un, 2 — deux, 3 — trois, 4 — quatre
    note: En néerlandais, nul signifie zéro, y compris pour le premier chiffre d’un numéro de téléphone. Les accents de één distinguent à l’écrit le nombre de l’article een ; dans les textes courants, on les omet parfois quand le sens est clair.
    example_gloss:
    - J’ai zéro euro.
    - J’ai un livre.
    - J’ai deux chaises.
    - J’ai trois livres.
    - Il y a quatre personnes.
  nl.a1.unit02.lesson01.teach.five_to_eight:
    title: De cinq à huit
    gloss: 5 — cinq, 6 — six, 7 — sept, 8 — huit
    note: Vijf, zes, zeven et acht suivent le même schéma simple que les nombres de zéro à quatre.
    example_gloss:
    - J’ai cinq euros.
    - J’ai six livres.
    - J’ai sept chaises.
    - Il y a huit personnes.
  nl.a1.unit02.lesson01.teach.nine_to_twelve:
    title: De neuf à douze
    gloss: 9 — neuf, 10 — dix, 11 — onze, 12 — douze
    note: Negen, tien, elf et twaalf complètent les nombres jusqu’à douze.
    example_gloss:
    - J’ai neuf euros.
    - J’ai dix chaises.
    - J’ai onze livres.
    - Il y a douze personnes.
  nl.a1.unit02.lesson01.teach.how_many:
    title: Demander « combien »
    gloss: Combien ?
    note: Hoeveel sert à demander un nombre ou une quantité.
  nl.a1.unit02.lesson02.teach.teens:
    title: Les nombres de treize à dix-neuf
    gloss: '13–19 : treize, quatorze, quinze, seize, dix-sept, dix-huit, dix-neuf'
    note: Les formes néerlandaises de treize à dix-neuf se terminent toutes en -tien.
    example_gloss:
    - J’ai treize ans.
    - J’ai quatorze euros.
    - J’ai quinze ans.
    - J’ai seize livres.
    - Il y a dix-sept personnes.
    - J’ai dix-huit ans.
    - J’ai dix-neuf chaises.
  nl.a1.unit02.lesson02.teach.tens:
    title: Les dizaines
    gloss: '20–90 : vingt, trente, quarante, cinquante, soixante, soixante-dix, quatre-vingts, quatre-vingt-dix'
    note: Apprends ces dizaines comme base pour former les plus grands nombres à deux chiffres.
    example_gloss:
    - J’ai vingt ans.
    - Ça coûte trente euros.
    - J’ai quarante euros.
    - Il y a cinquante personnes.
    - J’ai soixante ans.
    - Ça coûte soixante-dix euros.
    - Il y a quatre-vingts personnes.
    - J’ai quatre-vingt-dix euros.
  nl.a1.unit02.lesson02.teach.inversion_rule:
    title: Les unités avant les dizaines
    gloss: '21–99, sauf 30, 40 et les autres dizaines exactes : unité + en + dizaine'
    note: 'Contrairement au français, le néerlandais dit normalement l’unité en premier : 42 se dit littéralement « deux-et-quarante ». Les dizaines exactes n’utilisent que le mot de la dizaine.'
  nl.a1.unit02.lesson02.teach.twenty_one:
    title: Vingt et un
    gloss: 21 — vingt et un
    note: Eenentwintig combine een + en + twintig en un seul mot écrit.
    example_gloss: Le café des langues se trouve dans la salle vingt et un.
  nl.a1.unit02.lesson02.teach.twenty_two:
    title: Vingt-deux
    gloss: 22 — vingt-deux
    note: Les deux points sur le ë de tweeëntwintig montrent que les voyelles voisines appartiennent à des syllabes différentes.
    example_gloss: J’ai vingt-deux ans.
  nl.a1.unit02.lesson02.teach.thirty_two:
    title: Trente-deux
    gloss: 32 — trente-deux
    note: Tweeëndertig s’écrit en un seul mot, avec un tréma sur le ë de liaison.
    example_gloss: Omar a trente-deux ans.
  nl.a1.unit02.lesson02.teach.forty_two:
    title: Quarante-deux
    gloss: 42, c’est quarante-deux.
    note: 'On dit l’unité avant la dizaine : twee-en-veertig, qui s’écrit en un seul mot : tweeënveertig.'
  nl.a1.unit02.lesson02.teach.forty_eight:
    title: Quarante-huit
    gloss: 48 — quarante-huit
    note: Achtenveertig, c’est acht + en + veertig, écrit en un seul mot.
    example_gloss: J’habite au numéro quarante-huit.
  nl.a1.unit02.lesson02.teach.seventy_five:
    title: Soixante-quinze
    gloss: 75 — soixante-quinze
    note: Dans vijfenzeventig, vijf se place avant zeventig.
    example_gloss: Ça coûte soixante-quinze centimes.
  nl.a1.unit02.lesson02.teach.ninety_nine:
    title: Quatre-vingt-dix-neuf
    gloss: 99 — quatre-vingt-dix-neuf
    note: Negenennegentig est un seul mot composé.
    example_gloss: J’ai quatre-vingt-dix-neuf ans.
  nl.a1.unit02.lesson03.teach.ask_phone:
    title: Demander un numéro de téléphone
    gloss: Quel est ton numéro de téléphone ?
    note: Avec je, la question reste familière, comme il se doit dans le café linguistique de Lotte et Omar.
  nl.a1.unit02.lesson03.teach.phone_number:
    title: Donner un numéro de portable néerlandais
    gloss: Mon numéro de téléphone est le 06 21 43 65 87.
    note: Les numéros de portable néerlandais commencent par 06 et s’écrivent couramment 06 suivi de huit chiffres, comme en France où ils commencent par 06 ou 07.
  nl.a1.unit02.lesson03.teach.phone_spoken:
    title: Dire le numéro de téléphone par groupes
    gloss: zéro six, vingt et un, quarante-trois, soixante-cinq, quatre-vingt-sept
    note: On groupe les chiffres d’un numéro de différentes façons. Ce cours utilise 06 suivi de groupes de deux chiffres ; dire les chiffres un par un est aussi courant quand il faut être clair.
  nl.a1.unit02.lesson03.teach.ask_house_number:
    title: Demander un numéro de maison
    gloss: Quel est ton numéro de maison ?
    note: Huisnummer est le numéro qui fait partie d’une adresse postale.
  nl.a1.unit02.lesson03.teach.house_number:
    title: Donner un numéro de maison
    gloss: Mon numéro de maison est le 48.
    note: Les chiffres sont naturels dans une adresse écrite ou un formulaire.
  nl.a1.unit02.lesson03.teach.live_number:
    title: Dire où l’on habite avec un numéro
    gloss: J’habite au numéro quarante-huit.
    note: Op nummer ... est une façon naturelle d’indiquer un numéro de maison quand la rue est déjà connue.
  nl.a1.unit02.lesson03.teach.repeat:
    title: Demander de répéter
    gloss: Peux-tu répéter cela ?
    note: Utile quand un numéro de téléphone est dit trop vite pour être compris.
  nl.a1.unit02.lesson04.teach.ask_age:
    title: Demander l’âge de quelqu’un de façon familière
    gloss: Quel âge as-tu ?
    note: Cette phrase utilise je, le tutoiement ; on ne pose une question sur l’âge que si le contexte s’y prête.
  nl.a1.unit02.lesson04.teach.age_twenty_eight:
    title: Donner son âge
    gloss: J'ai vingt-huit ans.
    note: 'Le néerlandais dit Ik ben ... jaar, littéralement « je suis ... an » : il utilise le verbe être, alors que le français dit « j’ai ... ans ».'
  nl.a1.unit02.lesson04.teach.age_thirty_two:
    title: Dire l’âge d’Omar
    gloss: Omar a trente-deux ans.
    note: Jaar ne prend pas de marque du pluriel après un nombre quand on indique l’âge.
  nl.a1.unit02.lesson04.teach.how_many_people:
    title: Demander un nombre de personnes
    gloss: Combien de personnes y a-t-il ?
    note: Hoeveel se place directement devant le nom mensen.
  nl.a1.unit02.lesson04.teach.twelve_people:
    title: Indiquer un nombre de personnes
    gloss: Il y a douze personnes.
    note: Er zijn est la construction habituelle au pluriel pour dire « il y a ».
  nl.a1.unit02.lesson04.teach.three_books:
    title: Compter des livres
    gloss: J’ai trois livres.
    note: Après un nombre supérieur à un, boek prend le pluriel boeken.
  nl.a1.unit02.lesson04.teach.seven_chairs:
    title: Compter des chaises
    gloss: sept chaises
    note: Stoelen est le pluriel de stoel.
  nl.a1.unit02.lesson05.teach.euro:
    title: Euro
    gloss: l’euro
    note: 'Euro reste normalement au singulier après un montant : twee euro, et non twee euro''s.'
    example_gloss: Ça coûte deux euros.
  nl.a1.unit02.lesson05.teach.cent:
    title: Cent
    gloss: le centime
    note: Cent reste aussi couramment au singulier après un nombre dans un prix.
    example_gloss: Ça fait cinquante centimes.
  nl.a1.unit02.lesson05.teach.ask_price:
    title: Demander un prix
    gloss: Combien ça coûte ?
    note: Hoeveel demande la quantité et kost signifie « coûte ».
  nl.a1.unit02.lesson05.teach.two_fifty:
    title: Deux euros cinquante
    gloss: 2,50 € — deux euros cinquante
    note: Le néerlandais écrit une virgule décimale, comme le français. À l’oral, €2,50 se dit couramment twee euro vijftig, sans en.
  nl.a1.unit02.lesson05.teach.seventy_five_cents:
    title: Soixante-quinze centimes
    gloss: 0,75 € — soixante-quinze centimes
    note: Quand le montant est inférieur à un euro, il est naturel de dire seulement les centimes.
  nl.a1.unit02.lesson05.teach.twelve_euros:
    title: Douze euros
    gloss: 12 € — douze euros
    note: Un prix en euros entiers n’a pas besoin d’expression pour les centimes.
  nl.a1.unit02.lesson05.teach.four_fifty:
    title: Quatre euros cinquante
    gloss: 4,50 € — quatre euros cinquante
    note: Le même schéma oral fonctionne avec d’autres prix en euros et centimes.
  nl.a1.unit02.lesson05.teach.costs:
    title: Indiquer un prix
    gloss: Ça coûte deux euros cinquante.
    note: Dat kost ... répond directement à Hoeveel kost dit ?
  nl.a1.unit02.lesson06.teach.opening:
    title: Omar s’inscrit
    gloss: 'Employée : Bonjour. Vous venez pour le café linguistique ? Omar : Oui, je voudrais m’inscrire.'
    note: La scène prolonge les visites d’Omar au café linguistique de la bibliothèque, vues dans l’unité 1.
  nl.a1.unit02.lesson06.teach.phone_turn:
    title: Donner le numéro de téléphone
    gloss: 'Employée : Très bien. Quel est ton numéro de téléphone ? Omar : 06 21 43 65 87.'
    note: Omar donne le numéro en groupes de deux chiffres, comme dans les exercices précédents.
  nl.a1.unit02.lesson06.teach.house_turn:
    title: Donner le numéro de maison
    gloss: 'Employée : Et quel est ton numéro de maison ? Omar : Quarante-huit.'
    note: Une réponse courte avec seulement le nombre est naturelle quand la question donne le contexte.
  nl.a1.unit02.lesson06.teach.fee_turn:
    title: Comprendre la participation
    gloss: 'Employée : La participation est de deux euros cinquante. Omar : D’accord.'
    note: Le prix à l’oral suit le schéma habituel euros + centimes.
  nl.a1.unit02.lesson06.teach.group_turn:
    title: Demander la taille du groupe
    gloss: 'Omar : Combien de personnes y a-t-il dans le groupe ? Employée : Douze.'
    note: Cette scène reprend la question Hoeveel mensen ... vue plus tôt dans l’unité.
  nl.a1.unit02.lesson06.teach.room_turn:
    title: Trouver le numéro de la salle
    gloss: 'Employée : Le café linguistique a lieu dans la salle vingt et un.'
    note: Zaal désigne une salle utilisée pour une activité.
  nl.a1.unit02.lesson06.teach.lotte_turn:
    title: Trouver la table de Lotte
    gloss: 'Lotte : Salut Omar ! Nous sommes à la table sept.'
    note: Le dialogue se termine par les retrouvailles d’Omar et de Lotte dans le même cadre familier.
