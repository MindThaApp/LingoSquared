teaching:
  nl.a1.unit19.lesson01.teach.weer:
    title: Le temps
    gloss: le temps
    note: 'Un nom neutre : *het weer*.'
    example_gloss: Quel temps fait-il ?
  nl.a1.unit19.lesson01.teach.wat_voor_weer:
    title: Demander quel temps il fait
    gloss: Quel temps fait-il ?
    note: '*Wat voor* + nom signifie « quel genre de » ; c’est une question générale très courante.'
  nl.a1.unit19.lesson01.teach.zonnig:
    title: Ensoleillé
    gloss: Il fait beau.
    note: '*Het is* + adjectif de météo est la structure standard, avec le *het* impersonnel (il).'
  nl.a1.unit19.lesson01.teach.regent:
    title: Pluie
    gloss: Il pleut.
    note: '*Regenen* (pleuvoir) s’emploie de façon impersonnelle : *het regent*, sans adjectif supplémentaire.'
  nl.a1.unit19.lesson01.teach.bewolkt:
    title: Nuageux
    gloss: Le ciel est nuageux.
    note: Suit la même structure *het is* + adjectif que *zonnig*.
  nl.a1.unit19.lesson02.teach.koud:
    title: Froid
    gloss: Il fait froid aujourd’hui.
    note: '*Vandaag* (aujourd’hui) situe la description du temps dans le temps.'
  nl.a1.unit19.lesson02.teach.warm:
    title: Warm
    gloss: Il fait chaud aujourd’hui.
    note: En néerlandais courant, *warm* correspond à la fois à « chaud » et à « très chaud » quand on parle du temps.
  nl.a1.unit19.lesson02.teach.niet_koud:
    title: Opposer des températures
    gloss: Il ne fait pas froid, il fait chaud.
    note: '*Niet* nie directement *koud*, juste devant l’adjectif.'
  nl.a1.unit19.lesson03.teach.weerbericht:
    title: La météo
    gloss: les prévisions météo
    note: 'Un nom neutre : *het weerbericht*, composé de *weer* (temps) et *bericht* (bulletin).'
    example_gloss: Quelle est la météo ?
  nl.a1.unit19.lesson03.teach.morgen_zonnig:
    title: Le temps de demain
    gloss: Demain, il fera beau.
    note: '*Morgen* (demain) passe en début de phrase, donc *is het* est inversé après lui.'
  nl.a1.unit19.lesson03.teach.zaterdag_zondag:
    title: Une prévision sur deux jours
    gloss: Samedi, il fait beau et chaud, mais dimanche, il pleut toute la journée.
    note: '*De hele dag* (toute la journée) souligne la durée de la pluie.'
  nl.a1.unit19.lesson04.teach.wandeling:
    title: La promenade
    gloss: la promenade
    note: 'Un nom de genre commun : *de wandeling*.'
    example_gloss: Si on faisait une promenade ?
  nl.a1.unit19.lesson04.teach.zullen_we_wandeling:
    title: Proposer une promenade
    gloss: Si on faisait une promenade ?
    note: '*Zullen we...?* reprend la structure de proposition de l’unité 11 ; *een wandeling maken* (littéralement « faire une promenade ») est la façon fixe de dire « se promener ».'
  nl.a1.unit19.lesson04.teach.binnen_blijven:
    title: Un projet conditionnel
    gloss: S’il pleut, nous restons à l’intérieur.
    note: '*Als* (si) introduit la condition ; dans la proposition principale, *blijven we binnen*, le sujet et le verbe sont inversés parce que la proposition en « als » vient en premier.'
  nl.a1.unit19.lesson04.teach.goed_idee_laten:
    title: Accepter et proposer
    gloss: Bonne idée ! Faisons une promenade.
    note: '*Laten we...* (faisons...) est une autre façon courante de proposer une activité, à côté de *Zullen we...?* de l’unité 11.'
  nl.a1.unit19.lesson05.teach.weerbericht_tekst:
    title: Lire une prévision sur deux jours
    gloss: 'Météo : samedi, il fait beau et chaud. Dimanche, il pleut toute la journée.'
    note: Repère quel jour a quel temps.
    glosses:
      Weerbericht: prévisions météo
      zaterdag: samedi
      zonnig: ensoleillé
      warm: chaud
      Zondag: dimanche
      regent: pleut
      hele: entier
      dag: jour
  nl.a1.unit19.lesson06.teach.lotte_ask_weather:
    title: Lotte s’informe sur le week-end
    gloss: 'Lotte : Quel temps fera-t-il ce week-end ?'
    note: '*Dit weekend* (ce week-end) situe la question dans un futur proche.'
  nl.a1.unit19.lesson06.teach.omar_forecast:
    title: Omar donne la prévision
    gloss: 'Omar : Samedi, il fera beau et chaud, mais dimanche, il pleuvra toute la journée.'
    note: Correspond exactement à la prévision lue dans la leçon 5.
  nl.a1.unit19.lesson06.teach.lotte_suggest_walk:
    title: Lotte fait une proposition
    gloss: 'Lotte : Alors, si on faisait une promenade samedi ?'
    note: '*Dan* (alors) relie directement la proposition au beau temps qu’Omar vient de décrire.'
  nl.a1.unit19.lesson06.teach.omar_agree:
    title: Omar accepte et prévoit dimanche
    gloss: 'Omar : Bonne idée. Et dimanche, on restera bien au chaud à l’intérieur.'
    note: '*Lekker* est ici un mot d’appoint qui signifie à peu près « bien agréablement » ; on l’emploie souvent devant un adjectif ou un verbe pour le rendre plus attrayant.'
  nl.a1.unit19.lesson06.teach.lotte_closing:
    title: Lotte conclut le programme
    gloss: 'Lotte : Parfait, alors on regardera un film.'
    note: '*Kijken* (regarder) s’associe naturellement à *een film* (un film).'
