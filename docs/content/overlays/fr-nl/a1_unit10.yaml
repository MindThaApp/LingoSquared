teaching:
  nl.a1.unit10.lesson01.teach.opstaan:
    title: Se lever
    gloss: se lever → je me lève
    note: '*Opstaan* se sépare dans une proposition principale : *Ik sta op*. La particule *op* passe à la fin.'
  nl.a1.unit10.lesson01.teach.aankleden:
    title: S’habiller
    gloss: s’habiller → je m’habille
    note: '*Zich aankleden* est pronominal et séparable. Avec *ik*, on utilise *me* et *aan* passe à la fin : *Ik kleed me aan*.'
  nl.a1.unit10.lesson01.teach.ontbijten:
    title: Prendre le petit-déjeuner
    gloss: prendre le petit-déjeuner → je prends le petit-déjeuner
    note: '*Ontbijten* ne se sépare pas : *Ik ontbijt*.'
  nl.a1.unit10.lesson01.teach.werken:
    title: Le travail
    gloss: travailler → je travaille
    note: '*Werken* ne se sépare pas : *Ik werk*.'
  nl.a1.unit10.lesson01.teach.eten:
    title: Manger
    gloss: manger → je mange
    note: 'La forme de *eten* avec *ik* est *eet* : *Ik eet*.'
  nl.a1.unit10.lesson01.teach.afwassen:
    title: Faire la vaisselle
    gloss: faire la vaisselle → je fais la vaisselle
    note: '*Afwassen* se sépare : *Ik was af*. La particule *af* passe à la fin.'
  nl.a1.unit10.lesson01.teach.slapen:
    title: Dormir
    gloss: dormir → je dors
    note: '*Slapen* ne se sépare pas. Sa forme avec *ik* a une voyelle longue : *Ik slaap*.'
  nl.a1.unit10.lesson02.teach.split_rule:
    title: Le schéma de la séparation
    gloss: 'Dans une proposition principale ordinaire, la première partie passe à la fin : opstaan → Ik sta op.'
    note: Ne dis pas *Ik opsta*. Conjugue le verbe principal et place le petit préfixe à la fin de la proposition principale.
  nl.a1.unit10.lesson02.teach.opstaan_split:
    title: Opstaan dans une phrase
    gloss: 'se lever : je me lève à sept heures.'
    note: L’indication de l’heure se place entre *sta* et le préfixe final *op*.
  nl.a1.unit10.lesson02.teach.aankleden_split:
    title: Aankleden dans une phrase
    gloss: 's’habiller : je m’habille.'
    note: Le schéma est *Ik* + *kleed* + *me* + *aan*. *Aan* reste à la fin.
  nl.a1.unit10.lesson02.teach.afwassen_split:
    title: Afwassen dans une phrase
    gloss: 'faire la vaisselle : je fais la vaisselle après avoir mangé.'
    note: '*Na het eten* se place entre *was* et le préfixe final *af*.'
  nl.a1.unit10.lesson02.teach.contrast:
    title: Les verbes qui ne se séparent pas
    gloss: 'Non séparable : Je prends le petit-déjeuner. Je travaille. Je dors. Aucune partie ne va à la fin.'
    note: '*Ontbijten*, *werken* et *slapen* restent d’un seul bloc dans ces propositions principales.'
  nl.a1.unit10.lesson03.teach.get_up_time:
    title: Se lever à sept heures et demie
    gloss: Je me lève à 7 h 30.
    note: 'Rappelle-toi comment le néerlandais dit l’heure : *half acht* signifie « la demie avant huit heures », donc 7 h 30 (et non 8 h 30). *Op* reste à la fin.'
  nl.a1.unit10.lesson03.teach.dress_time:
    title: S’habiller à huit heures moins le quart
    gloss: Je m’habille à 7 h 45.
    note: L’heure se place avant le préfixe séparable final *aan*.
  nl.a1.unit10.lesson03.teach.breakfast_time:
    title: Prendre le petit-déjeuner à huit heures
    gloss: Je prends mon petit-déjeuner à huit heures.
    note: Utilise *om* devant l’heure. *Ontbijt* ne se sépare pas.
  nl.a1.unit10.lesson03.teach.work_time:
    title: Travailler de neuf heures à dix-sept heures
    gloss: Je travaille de neuf heures à dix-sept heures.
    note: '*Van ... tot ...* indique l’heure de début et l’heure de fin.'
  nl.a1.unit10.lesson03.teach.eat_time:
    title: Manger à six heures et demie
    gloss: Je mange à 18 h 30.
    note: '*''s Avonds* précise que c’est le soir, donc *half zeven* correspond ici à 18 h 30.'
  nl.a1.unit10.lesson03.teach.sleep_time:
    title: Dormir à onze heures
    gloss: Je dors à onze heures.
    note: 'Utilise *om* devant l’heure : *om elf uur*.'
  nl.a1.unit10.lesson04.teach.eerst_dan_daarna:
    title: D’abord, puis, ensuite
    gloss: d’abord, puis, ensuite
    note: '*Eerst* marque la première activité, *dan* passe à la suivante, et *daarna* renvoie à ce qui précède.'
    example_gloss:
    - D’abord, je me lève.
    - Puis, je m’habille.
    - Ensuite, je prends mon petit-déjeuner.
  nl.a1.unit10.lesson04.teach.sequence:
    title: Une matinée en trois étapes
    gloss: D’abord, je me lève. Puis, je m’habille. Ensuite, je prends mon petit-déjeuner.
    note: 'Les préfixes séparables terminent toujours leur proposition : *sta ik op* ; *kleed ik me aan*.'
  nl.a1.unit10.lesson04.teach.sequence_order_note:
    title: Le verbe avant ik
    gloss: 'Après eerst, dan et daarna, le verbe se place avant ik : Daarna ontbijt ik.'
    note: Commencer par un mot de séquence transforme *Ik ontbijt* en *Daarna ontbijt ik*.
  nl.a1.unit10.lesson05.teach.routine_text:
    title: Ma journée
    gloss: Ma journée — Je me lève à 7 h 30. Ensuite, je m’habille et, à huit heures, je prends mon petit-déjeuner. Je travaille de neuf heures à dix-sept heures. À 18 h 30, je mange. Ensuite, je fais la vaisselle. À onze heures, je dors.
    note: Lis en repérant à la fois l’ordre des activités et leurs heures. Remarque *op*, *aan* et *af* à la fin des propositions avec verbes séparables.
    glosses:
      Mijn: mon, ma
      dag: jour
      sta: se lever
      half: 'et demie (la demie avant l’heure suivante : half acht = 7 h 30)'
      acht: huit
      Daarna: ensuite
      kleed: s’habiller
      uur: heure
      ontbijt: prendre le petit-déjeuner
      werk: travailler
      negen: neuf
      vijf: cinq
      zeven: sept
      avonds: le soir
      eet: manger
      was: faire la vaisselle
      elf: onze
      slaap: dormir
  nl.a1.unit10.lesson06.teach.question:
    title: Demander à quelqu’un de décrire sa journée
    gloss: 'Lotte : À quoi ressemble ta journée, Omar ?'
    note: '*Hoe ziet jouw dag eruit?* est une façon informelle d’inviter quelqu’un à décrire sa journée. *Eruitzien* est séparable : *ziet ... eruit*.'
  nl.a1.unit10.lesson06.teach.morning:
    title: Le matin d’Omar
    gloss: 'Omar : Je me lève à 7 h 30. Ensuite, je m’habille, et à huit heures, je prends le petit-déjeuner.'
    note: Omar enchaîne trois activités du matin et garde *op* et *aan* à la fin de leurs propositions.
  nl.a1.unit10.lesson06.teach.work:
    title: La journée de travail d’Omar
    gloss: 'Lotte : Quand travailles-tu ? Omar : Je travaille de neuf heures à cinq heures.'
    note: 'Lotte et Omar se tutoient : ils emploient *je* entre eux.'
  nl.a1.unit10.lesson06.teach.evening:
    title: Le soir d’Omar
    gloss: 'Omar : À 18 h 30, je mange. Ensuite, je fais la vaisselle. À onze heures, je dors.'
    note: 'Quand la phrase commence par une heure ou par *daarna*, le verbe se place avant *ik* : *eet ik*, *was ik*, *slaap ik*. *Af* reste à la fin.'
  nl.a1.unit10.lesson06.teach.lotte:
    title: Le matin de Lotte
    gloss: 'Lotte : Je me lève à six heures, mais je ne prends mon petit-déjeuner qu’à 6 h 30.'
    note: '*Pas* signifie ici « seulement à, pas avant ». Lotte oppose son heure de lever à l’heure de son petit-déjeuner.'
