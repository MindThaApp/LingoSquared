teaching:
  nl.a1.unit20.lesson01.teach.jas_trui:
    title: Manteau, pull
    gloss: le manteau, le pull
    note: '*De jas* et *de trui* sont deux noms de genre commun : ils s’emploient avec le même article défini.'
    example_gloss:
    - Je cherche un manteau.
    - J’ai un pull.
  nl.a1.unit20.lesson01.teach.broek_schoenen:
    title: Pantalon, chaussures
    gloss: le pantalon, les chaussures
    note: '*Broek* est singulier en néerlandais, comme « pantalon » en français : *een broek*, et non *broeken*, pour un pantalon. *Schoenen* est le pluriel de *schoen* ; on parle presque toujours des chaussures au pluriel, comme en français.'
    example_gloss:
    - Je cherche un pantalon.
    - Je cherche des chaussures.
  nl.a1.unit20.lesson01.teach.zoek_jas:
    title: Dire ce que l’on cherche
    gloss: Je cherche un manteau.
    note: '*Zoeken* (chercher) se construit ici avec un complément direct, sans préposition, comme « chercher » en français. (*Zoeken naar* existe aussi, mais le complément direct est la structure la plus simple.)'
  nl.a1.unit20.lesson02.teach.maat:
    title: Taille
    gloss: la taille
    note: 'Un nom de genre commun : *de maat*.'
    example_gloss: Quelle taille portes-tu ?
  nl.a1.unit20.lesson02.teach.welke_maat:
    title: Demander la taille
    gloss: Quelle taille portes-tu ?
    note: On emploie *welke* (quelle) parce que *maat* appelle un petit nombre de réponses possibles (S, M, L ou un chiffre).
  nl.a1.unit20.lesson02.teach.heb_maat_m:
    title: Indiquer sa taille
    gloss: Je fais du M.
    note: On emploie ici *hebben* (avoir), alors qu’en français on dit « je fais du M » ; en néerlandais, on dit littéralement « j’ai taille M ».
  nl.a1.unit20.lesson03.teach.zwart_blauw:
    title: Noir, bleu
    gloss: noir, bleu
    note: Les deux adjectifs de couleur de base de cette leçon.
    example_gloss:
    - Je voudrais le manteau en noir.
    - Vous avez aussi celui-ci en bleu ?
  nl.a1.unit20.lesson03.teach.wil_in_zwart:
    title: Demander une couleur
    gloss: Je voudrais le manteau en noir.
    note: '*In het* + couleur est la façon habituelle de préciser la couleur d’un vêtement quand on le demande ou le commande.'
  nl.a1.unit20.lesson03.teach.ook_in_blauw:
    title: Demander une autre couleur
    gloss: Vous avez aussi celui-ci en bleu ?
    note: '*Ook* (aussi) permet de demander si une autre couleur existe, avec la forme de politesse *u*.'
  nl.a1.unit20.lesson04.teach.past_deze_jas:
    title: Demander si ça va
    gloss: Ce manteau me va-t-il ?
    note: '*Passen* (aller, convenir) est le verbe naturel pour la coupe d’un vêtement ; il est distinct de *passen* au sens d’« essayer ».'
  nl.a1.unit20.lesson04.teach.past_goed:
    title: Confirmer que ça va bien
    gloss: Ça va bien.
    note: '*Goed* (bien) décrit la façon dont le vêtement va.'
  nl.a1.unit20.lesson04.teach.te_klein:
    title: Trop petit
    gloss: C’est trop petit.
    note: '*Te* (trop) se place devant l’adjectif pour exprimer l’excès.'
  nl.a1.unit20.lesson04.teach.te_groot:
    title: Trop grand
    gloss: C’est trop grand.
    note: Même structure *te* + adjectif que *te klein* de la carte précédente.
  nl.a1.unit20.lesson05.teach.negentig:
    title: Quatre-vingt-dix
    gloss: quatre-vingt-dix
    note: '*Negentig* est le nombre 90, utilisé ici pour le prix du manteau.'
    example_gloss: Le manteau coûte quatre-vingt-dix euros.
  nl.a1.unit20.lesson05.teach.kost_negentig:
    title: Indiquer un prix
    gloss: Le manteau coûte quatre-vingt-dix euros.
    note: '*Kost* est la troisième personne du singulier de *kosten* (coûter).'
  nl.a1.unit20.lesson05.teach.bonnetje:
    title: Lire un ticket de magasin
    gloss: 'Manteau d’hiver : taille M, couleur noire. Prix : quatre-vingt-dix euros. Ce manteau va bien et il est chaud.'
    note: Repère la taille, la couleur, le prix et les deux qualités mentionnées pour le manteau.
    glosses:
      Winterjas: manteau d’hiver
      maat: taille
      kleur: couleur
      zwart: noir
      Prijs: prix
      negentig: quatre-vingt-dix
      euro: euros
      jas: manteau
      past: va (bien)
      warm: chaud
  nl.a1.unit20.lesson06.teach.lotte_notice:
    title: Lotte remarque le manteau
    gloss: 'Lotte : Ce manteau est joli ! Tu fais quelle taille ?'
    note: '*Mooi* (joli, beau) est une réaction positive générale, déjà vue dans des unités précédentes.'
  nl.a1.unit20.lesson06.teach.omar_ask_try:
    title: Omar demande à l’essayer
    gloss: 'Omar : Je fais du M. Je peux l’essayer ?'
    note: '*Mag ik ...?* (Puis-je ... ?) est la façon polie habituelle de demander la permission ; ici, *passen* signifie « essayer », et non « aller ».'
  nl.a1.unit20.lesson06.teach.lotte_ask_fit:
    title: Lotte demande si ça va
    gloss: 'Lotte : Bien sûr. Il te va bien ?'
    note: '*Hij* (il) reprend *de jas*, un nom de genre commun.'
  nl.a1.unit20.lesson06.teach.omar_confirm_fit:
    title: Omar confirme
    gloss: 'Omar : Oui, il me va bien et il est chaud.'
    note: 'Correspond exactement au ticket lu dans la leçon 5 : c’est le même manteau.'
  nl.a1.unit20.lesson06.teach.lotte_ask_color:
    title: Lotte demande la couleur
    gloss: 'Lotte : Super ! Tu le veux en noir ou en bleu ?'
    note: '*Wil je... of...?* reprend la structure de choix vue dans les leçons sur les préférences de l’unité 13.'
  nl.a1.unit20.lesson06.teach.omar_choose_black:
    title: Omar se décide
    gloss: 'Omar : Je le prends en noir.'
    note: '*Nemen* (prendre) est le verbe naturel pour conclure un achat ; la couleur correspond à celle du ticket.'
  nl.a1.unit20.lesson06.teach.neemt_form:
    title: Neem ou neemt ?
    gloss: Neem est la forme en « je » de nemen (prendre) ; neemt est la forme en « il/elle ».
    note: 'Modèle régulier au présent : *ik neem, jij/hij/zij neemt*.'
