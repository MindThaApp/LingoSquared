teaching:
  nl.a1.unit06.lesson01.teach.koffie_thee_water:
    title: Café, thé, eau
    gloss: café, thé, eau
    note: '*De koffie*, *de thee*, *het water* — remarque les articles différents.'
    example_gloss:
    - Un café, s’il vous plaît.
    - Un thé, s’il vous plaît.
    - De l’eau, s’il vous plaît.
  nl.a1.unit06.lesson01.teach.melk_sap:
    title: Lait, jus
    gloss: lait, jus
    note: '*De melk*, *het sap*.'
    example_gloss:
    - Du lait, s’il vous plaît.
    - Un jus, s’il vous plaît.
  nl.a1.unit06.lesson02.teach.brood_broodje_kaas_appel:
    title: Pain, sandwich au fromage, pomme
    gloss: pain, sandwich au fromage, pomme
    note: On dit *het brood* et *de appel*. *Broodje* désigne un petit pain ou un sandwich ; *broodje kaas* est une commande très courante au quotidien.
    example_gloss:
    - Je voudrais du pain.
    - Je voudrais un sandwich au fromage.
    - Je voudrais une pomme.
  nl.a1.unit06.lesson02.teach.ik_wil_graag:
    title: Je voudrais ...
    gloss: Je voudrais ...
    note: '*Ik wil graag ...* est une façon polie et courante de commander quelque chose dans la vie de tous les jours.'
  nl.a1.unit06.lesson02.teach.ik_wil_graag_koffie:
    title: Je voudrais un café
    gloss: Je voudrais un café.
    note: '*Een* correspond à « un » ou « une » et reste identique devant tous les noms néerlandais, alors qu’en français l’article change selon le genre.'
  nl.a1.unit06.lesson02.teach.ik_wil_graag_broodje:
    title: Je voudrais un sandwich au fromage
    gloss: Je voudrais un sandwich au fromage.
    note: 'On dit *een broodje kaas* : *kaas* suit directement *broodje*, sans préposition.'
  nl.a1.unit06.lesson03.teach.alstublieft_alsjeblieft:
    title: S’il vous plaît / s’il te plaît
    gloss: s’il vous plaît, s’il te plaît
    note: Utilise *alstublieft* quand tu t’adresses à quelqu’un en le vouvoyant (*u*), et *alsjeblieft* quand tu le tutoies (*jij* ou *je*).
    example_gloss:
    - Un café, s’il vous plaît.
    - Un café, s’il te plaît.
  nl.a1.unit06.lesson03.teach.please_note:
    title: Alstublieft ou alsjeblieft
    gloss: alstublieft = s’il vous plaît, alsjeblieft = s’il te plaît
    note: Choisis *alstublieft* avec *u* et *alsjeblieft* avec *jij* ou *je*.
    target_text: alstublieft = s’il vous plaît (avec u) ; alsjeblieft = s’il te plaît (avec jij/je)
  nl.a1.unit06.lesson03.teach.twee_thee:
    title: Je voudrais deux thés, s’il vous plaît
    gloss: Je voudrais deux thés, s’il vous plaît.
    note: Dans une commande au café, *twee thee* signifie naturellement deux tasses de thé ; *thee* reste au singulier ici.
  nl.a1.unit06.lesson04.teach.wat_wilt_u:
    title: Que voulez-vous boire ? (vouvoiement)
    gloss: Que voulez-vous boire ?
    note: '*Wilt u* est la forme de politesse habituelle aux Pays-Bas.'
  nl.a1.unit06.lesson04.teach.wat_wil_je:
    title: Que veux-tu manger ? (tutoiement)
    gloss: Que souhaitez-vous manger ?
    note: Devant *je* ou *jij*, utilise *wil* et non *wilt*, comme dans cette question.
  nl.a1.unit06.lesson04.teach.wilt_wil_note:
    title: Wilt ou wil
    gloss: wilt u ... mais wil je/jij ...
    note: Quand le verbe précède le sujet, on dit *wilt u* mais *wil je* ou *wil jij*. Ne dis pas *wilt je* ni *wilt jij*.
    target_text: wilt u (formel) mais wil je (informel) — quand wil est devant je ou jij, il n’a pas de t
  nl.a1.unit06.lesson04.teach.appelsap:
    title: Jus de pomme
    gloss: jus de pomme
    note: Écris *appelsap* en un seul mot, et non *appel sap*.
    example_gloss: Puis-je avoir un jus de pomme, s’il te plaît ?
  nl.a1.unit06.lesson04.teach.mag_ik:
    title: Puis-je avoir un jus de pomme, s’il te plaît ?
    gloss: Puis-je avoir un jus de pomme, s’il te plaît ?
    note: '*Mag ik ...?* est une autre façon courante de commander, un peu plus décontractée que *ik wil graag ...*'
  nl.a1.unit06.lesson05.teach.euro_vijftig:
    title: Deux euros cinquante
    gloss: 2,50 € — deux euros cinquante
    note: On dit couramment *twee euro vijftig* pour 2,50 €, sans *en* ni *cent*.
  nl.a1.unit06.lesson05.teach.menu:
    title: Carte
    gloss: 'Carte — Café : 2,50 €. Thé : 2,00 €. Sandwich au fromage : 3,50 €. Jus de pomme : 2,50 €.'
    note: 'Les menus néerlandais écrivent ces prix avec une virgule décimale, comme en français : €2,50, €2,00 et €3,50.'
    glosses:
      Menukaart: carte
      Koffie: café
      Thee: thé
      Broodje: sandwich / petit pain
      kaas: fromage
      Appelsap: jus de pomme
  nl.a1.unit06.lesson06.teach.goedemiddag:
    title: Bonjour (l’après-midi)
    gloss: bonjour
    note: Une salutation naturelle au comptoir d’un café l’après-midi.
    example_gloss: Bonjour, que voulez-vous boire ?
  nl.a1.unit06.lesson06.teach.komt_eraan:
    title: Ça arrive !
    gloss: Ça arrive !
    note: Une phrase naturelle et courante que dit le personnel après avoir pris une commande.
    example_gloss: Votre café arrive !
  nl.a1.unit06.lesson06.teach.lines01_03:
    title: Bonjour, que voulez-vous boire ?
    gloss: 'Employé : Bonjour, que voulez-vous boire ? Lotte : Je voudrais un café, s’il vous plaît.'
    note: 'Un échange de service formel : Lotte dit *alstublieft* à l’employé, contrairement à sa façon de parler avec Omar, plus familière.'
  nl.a1.unit06.lesson06.teach.lines04_06:
    title: Voulez-vous aussi quelque chose à manger ?
    gloss: 'Employé : Et voulez-vous aussi quelque chose à manger ? Lotte : Oui, un sandwich au fromage, s’il vous plaît. Employé : Ça arrive !'
    note: '*En wilt u ook iets eten?* est une façon naturelle pour le personnel de demander si vous voulez aussi manger quelque chose.'
