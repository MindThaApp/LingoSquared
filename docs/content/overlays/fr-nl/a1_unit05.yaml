teaching:
  nl.a1.unit05.lesson01.teach.vader_moeder:
    title: Père et mère
    gloss: père / mère
    note: '*Vader* est le mot neutre standard pour « père ». *Moeder* est le mot neutre standard pour « mère ».'
    example_gloss:
    - C’est mon père.
    - C’est ma mère.
  nl.a1.unit05.lesson01.teach.ouders_broer_zus:
    title: Parents, frère et sœur
    gloss: parents / frère / sœur
    note: '*Ouders* est toujours au pluriel dans ce sens ; *de broer* et *de zus* prennent tous deux *de*.'
    example_gloss:
    - Mes parents habitent à Utrecht.
    - J’ai un frère.
    - J’ai une sœur.
  nl.a1.unit05.lesson01.teach.kind_kinderen:
    title: Enfant et enfants
    gloss: l’enfant / les enfants
    note: '*Kind* est un nom de genre neutre : *het kind*. Le pluriel *kinderen* prend *de*, alors que le singulier *kind* prend *het*.'
    example_gloss:
    - Ma sœur a un enfant.
    - Mon oncle et ma tante ont deux enfants.
  nl.a1.unit05.lesson01.teach.have_sentence:
    title: J’ai un frère et une sœur
    gloss: J’ai un frère et une sœur.
    note: '*Ik heb ...* est la façon habituelle de dire quels membres de ta famille tu as.'
  nl.a1.unit05.lesson02.teach.opa_oma_oom_tante:
    title: Grand-père, grand-mère, oncle et tante
    gloss: grand-père / grand-mère / oncle / tante
    note: '*Opa* est le mot courant pour grand-père ; *grootvader* est plus formel ou écrit. *Oma* est le mot courant pour grand-mère ; *grootmoeder* est plus formel ou écrit. *De oom*. *De tante*.'
    example_gloss:
    - Mon grand-père et ma grand-mère habitent à Rotterdam.
    - Ma grand-mère a quatre-vingt-dix-neuf ans.
    - Mon oncle habite à Amsterdam.
    - Mon oncle et ma tante ont deux enfants.
  nl.a1.unit05.lesson02.teach.neef_nicht_note:
    title: Neef et nicht sont ambigus
    gloss: neef = cousin ou neveu ; nicht = cousine ou nièce
    note: 'En néerlandais, un même mot désigne le cousin et le neveu (ou la cousine et la nièce) ; c’est le contexte qui indique le sens. Ces mots ne sont pas testés dans les exercices de cette unité : ils sont notés ici pour que tu les reconnaisses plus tard.'
    target_text: neef = cousin OU neveu ; nicht = cousine OU nièce
  nl.a1.unit05.lesson02.teach.gezin:
    title: La famille (le foyer)
    gloss: famille (foyer)
    note: '*Gezin* désigne le foyer dans lequel tu vis (en général les parents et les enfants) ; *familie* est le mot plus large pour la famille élargie, les proches en général.'
    example_gloss: Ma famille habite à Utrecht.
  nl.a1.unit05.lesson02.teach.opa_oma_sentence:
    title: Mes grands-parents habitent à Rotterdam
    gloss: Mon grand-père et ma grand-mère habitent à Rotterdam.
    note: '*Wonen in* + un nom de ville indique où quelqu’un habite.'
  nl.a1.unit05.lesson02.teach.oom_tante_sentence:
    title: Mon oncle et ma tante ont deux enfants
    gloss: Mon oncle et ma tante ont deux enfants.
    note: On utilise *hebben* parce que *oom en tante* désigne deux personnes.
  nl.a1.unit05.lesson03.teach.mijn_je_jouw:
    title: Mon et ton/ta (forme atone et forme accentuée)
    gloss: mon, ma, mes / ton, ta, tes (atone) / ton, ta, tes (accentué)
    note: '*Mijn* garde toujours la même forme devant les noms en de et en het, au singulier comme au pluriel. *Je* est la forme familière habituelle quand on n’insiste pas sur le possesseur ; elle garde aussi la même forme devant tout nom. *Jouw* est plus fort que *je* et obligatoire quand on oppose le membre de la famille d’une personne à celui d’une autre ; il garde lui aussi la même forme devant tout nom.'
    example_gloss:
    - C’est mon frère.
    - C’est ta sœur ?
    - Et celle-là, c’est ta sœur ?
  nl.a1.unit05.lesson03.teach.je_jouw_note:
    title: Je ou jouw
    gloss: je et jouw signifient tous deux « ton, ta, tes » (tutoiement)
    note: Utilise *je* quand tu n’insistes pas. Utilise *jouw* quand tu insistes sur le possesseur, surtout dans une opposition. La forme pleine *jouw* est aussi possible sans opposition, mais *je* est plus courant dans ce cas.
    target_text: je et jouw signifient tous deux « ton / ta / tes » (tutoiement). Je est l’usage courant, sans insistance ; jouw est plus fort et sert à marquer un contraste. Les deux gardent la même forme devant tous les noms.
  nl.a1.unit05.lesson03.teach.dit_is_mijn_broer:
    title: Voici mon frère
    gloss: C’est mon frère.
    note: '*Dit is ...* sert à présenter quelqu’un qui est tout près.'
  nl.a1.unit05.lesson03.teach.is_dat_jouw_zus:
    title: Est-ce ta sœur ?
    gloss: Est-ce ta sœur ?
    note: '*Dat is ...* désigne quelqu’un de plus éloigné ou dont on a déjà parlé.'
  nl.a1.unit05.lesson04.teach.zijn_haar:
    title: Son (à lui) et son (à elle)
    gloss: son, sa, ses (à lui) / son, sa, ses (à elle)
    note: '*Zijn* garde toujours la même forme, comme *mijn*, *je* et *jouw*. *Haar* garde aussi toujours la même forme.'
    example_gloss:
    - Voici son père.
    - Voilà sa mère.
  nl.a1.unit05.lesson04.teach.zijn_haar_note:
    title: Zijn ou haar
    gloss: zijn = son, sa, ses (à lui) ; haar = son, sa, ses (à elle)
    note: 'Pour les personnes de ces exemples, choisis *zijn* si le possesseur est un homme et *haar* si c’est une femme. Le mot de famille qui suit ne change pas ce choix : *zijn vader* et *zijn moeder* ; *haar vader* et *haar moeder*.'
    target_text: zijn = son / sa (à lui), haar = son / sa (à elle) ; les deux restent invariables, quel que soit le nom qui suit.
  nl.a1.unit05.lesson04.teach.dit_is_zijn_vader:
    title: Voici son père
    gloss: Voici son père.
    note: '*Zijn vader* — son père (à lui).'
  nl.a1.unit05.lesson04.teach.dat_is_haar_moeder:
    title: Voilà sa mère
    gloss: Voilà sa mère.
    note: '*Haar moeder* — sa mère (à elle).'
  nl.a1.unit05.lesson05.teach.heet:
    title: S’appelle
    gloss: s’appelle
    note: '*Ik heet...* / *Hij heet...* — la façon habituelle de donner le nom de quelqu’un, déjà vue dans l’unité 1.'
    example_gloss: Je m’appelle Lotte.
  nl.a1.unit05.lesson05.teach.sander_fenna_jan_marieke:
    title: 'Prénoms de membres de la famille : Sander, Fenna, Jan et Marieke'
    gloss: Sander (prénom masculin néerlandais) / Fenna (prénom féminin néerlandais) / Jan (prénom masculin néerlandais) / Marieke (prénom féminin néerlandais)
    note: 'Ce sont quatre prénoms néerlandais courants : Sander et Jan sont des prénoms masculins, Fenna et Marieke des prénoms féminins.'
    example_gloss:
    - Mon frère s’appelle Sander.
    - Ma sœur s’appelle Fenna.
    - Mon père s’appelle Jan.
    - Ma mère s’appelle Marieke.
  nl.a1.unit05.lesson05.teach.rotterdam:
    title: Rotterdam
    gloss: Rotterdam
    note: Une grande ville des Pays-Bas.
    example_gloss: Le grand-père et la grand-mère de Lotte habitent à Rotterdam.
  nl.a1.unit05.lesson05.teach.profile:
    title: Présentation de la famille de Lotte
    gloss: Je m’appelle Lotte. J’ai un frère et une sœur. Mon frère s’appelle Sander et ma sœur s’appelle Fenna. Mon père s’appelle Jan et ma mère s’appelle Marieke. Mon grand-père et ma grand-mère habitent à Rotterdam.
    note: Courte présentation orale de la famille de Lotte, qui reprend le vocabulaire des leçons précédentes de cette unité.
  nl.a1.unit05.lesson06.teach.egypte:
    title: L’Égypte
    gloss: Égypte
    note: Le pays d’origine d’Omar, comme dans les unités précédentes.
    example_gloss: Mes parents habitent en Égypte.
  nl.a1.unit05.lesson06.teach.elke_maand:
    title: Chaque mois
    gloss: chaque mois
    note: '*Elke* + un nom au singulier exprime « chaque ... ».'
    example_gloss: Oui, chaque mois.
  nl.a1.unit05.lesson06.teach.lines01_04:
    title: Tu as des frères et sœurs ?
    gloss: 'Lotte : Tu as des frères ou des sœurs, Omar ? Omar : Oui, j’ai deux sœurs. Pas de frères. Et toi ? Lotte : J’ai un frère et une sœur.'
    note: '*Broers of zussen* — des frères ou des sœurs, avec les formes du pluriel.'
  nl.a1.unit05.lesson06.teach.lines05_08:
    title: Tes parents habitent aussi aux Pays-Bas ?
    gloss: 'Omar : Tes parents habitent aussi aux Pays-Bas ? Lotte : Oui, mes parents habitent à Utrecht. Et ta famille ? Omar : Mes parents habitent en Égypte, mais mon oncle habite ici, à Amsterdam.'
    note: '*Wonen ook in* — habiter aussi à/en, pour demander si c’est pareil pour quelqu’un d’autre.'
  nl.a1.unit05.lesson06.teach.lines09_10:
    title: Tu le vois souvent ?
    gloss: 'Lotte : Sympa ! Tu le vois souvent ? Omar : Oui, chaque mois.'
    note: '*Zie je hem vaak?* — une façon naturelle et courante de demander à quelle fréquence on voit quelqu’un.'
