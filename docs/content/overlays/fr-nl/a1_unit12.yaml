teaching:
  nl.a1.unit12.lesson01.teach.completed_event:
    title: Le passé de tous les jours en néerlandais
    gloss: Dans la conversation, un événement terminé s’exprime en général avec hebben ou zijn plus un participe passé.
    note: Comme en français avec le passé composé, le néerlandais emploie normalement cette forme composée dans la conversation. *Ik heb koffie gedronken* peut donc se traduire par « J’ai bu du café ».
  nl.a1.unit12.lesson01.teach.drinken_model:
    title: J’ai bu du café
    gloss: boire → J’ai bu du café.
    note: '*Heb* est l’auxiliaire et *gedronken* est le participe passé de *drinken*.'
  nl.a1.unit12.lesson01.teach.gaan_model:
    title: Je suis allé(e) au supermarché
    gloss: aller → Je suis allé(e) au supermarché.
    note: '*Gaan* se construit avec *zijn* : *ik ben gegaan*.'
  nl.a1.unit12.lesson01.teach.word_order:
    title: Le participe passé est à la fin
    gloss: 'Le participe passé se place à la fin : Ik heb koffie gedronken. Pense à la place finale de op dans Ik sta op.'
    note: L’unité 10 t’a déjà appris à guetter un élément important à la fin de la phrase. Ici, l’élément final est le participe passé.
  nl.a1.unit12.lesson02.teach.hebben_rule:
    title: La plupart des verbes utilisent hebben
    gloss: La plupart des verbes utilisent hebben.
    note: Dans cette unité, utilise *hebben* avec *drinken*, *eten*, *werken* et *kopen*.
  nl.a1.unit12.lesson02.teach.drinken:
    title: Drinken avec hebben
    gloss: boire → J’ai bu du café.
    note: Le schéma complet est *ik + heb + complément + gedronken*.
  nl.a1.unit12.lesson02.teach.eten:
    title: Eten avec hebben
    gloss: manger → J’ai mangé du pain.
    note: Le participe passé de *eten* est *gegeten*.
  nl.a1.unit12.lesson02.teach.werken:
    title: Werken avec hebben
    gloss: travailler → J’ai travaillé.
    note: Le participe passé de *werken* est *gewerkt*.
  nl.a1.unit12.lesson02.teach.kopen:
    title: Kopen avec hebben
    gloss: acheter → J’ai acheté des pommes.
    note: Le participe passé de *kopen* est *gekocht*.
  nl.a1.unit12.lesson03.teach.zijn_rule:
    title: Gaan et komen utilisent zijn
    gloss: Avec gaan et komen, on utilise zijn.
    note: Ces deux verbes de mouvement courants utilisent *zijn*, et non *hebben*, dans la construction de l’événement terminé étudiée ici.
  nl.a1.unit12.lesson03.teach.gaan:
    title: Gaan avec zijn
    gloss: aller → Je suis allé(e) au supermarché.
    note: Utilise *ben* avec *ik* et place *gegaan* à la fin.
  nl.a1.unit12.lesson03.teach.komen:
    title: Komen avec zijn
    gloss: venir → Je suis venu(e) au café-langues.
    note: Utilise *ben* avec *ik* et place *gekomen* à la fin.
  nl.a1.unit12.lesson03.teach.auxiliary_contrast:
    title: Comparer les auxiliaires
    gloss: J’ai travaillé, mais je suis allé(e) au supermarché.
    note: '*Werken* se construit avec *hebben* ; *gaan* avec *zijn*.'
  nl.a1.unit12.lesson04.teach.gisteren_vanmorgen:
    title: Hier, ce matin
    gloss: hier, ce matin
    note: '*Gisteren* désigne la veille d’aujourd’hui ; *vanmorgen* renvoie au matin d’aujourd’hui.'
    example_gloss:
    - Hier, j’ai travaillé.
    - Ce matin à huit heures, j’ai bu du café.
  nl.a1.unit12.lesson04.teach.yesterday_work:
    title: J’ai travaillé hier
    gloss: Hier, j’ai travaillé.
    note: Quand *gisteren* commence la phrase, *heb* se place avant *ik*.
  nl.a1.unit12.lesson04.teach.morning_coffee:
    title: Du café ce matin
    gloss: Ce matin à huit heures, j’ai bu du café.
    note: On retrouve ici *om acht uur* du système des heures de l’unité 4.
  nl.a1.unit12.lesson04.teach.time_order:
    title: Le moment en premier change l’ordre
    gloss: 'Après Gisteren ou Vanmorgen, le verbe vient avant ik : Gisteren heb ik ...'
    note: C’est le même ordre verbe + *ik* que tu as vu après *daarna* dans l’unité 10.
  nl.a1.unit12.lesson05.teach.recent_text:
    title: Un récit d’événements récents
    gloss: Ce matin, je suis allé(e) au supermarché. J’ai acheté des pommes. Ensuite, je suis allé(e) au café-langues. Là, j’ai bu du café.
    note: Repère l’indication de temps, les lieux et chaque action terminée.
    glosses:
      Vanmorgen: ce matin
      supermarkt: supermarché
      gegaan: allé / est allé
      appels: pommes
      gekocht: acheté
      Daarna: ensuite
      taalcafé: café des langues
      Daar: là
      koffie: café
      gedronken: bu / a bu
  nl.a1.unit12.lesson06.teach.question:
    title: Qu’est-ce que tu as fait hier ?
    gloss: 'Lotte : Qu’est-ce que tu as fait hier, Omar ?'
    note: '*Wat heb je ... gedaan?* est la question courante et familière pour demander ce que quelqu’un a fait.'
  nl.a1.unit12.lesson06.teach.answer:
    title: Les trois actions d’Omar
    gloss: 'Omar : J’ai travaillé. Ensuite, je suis allé au supermarché. J’ai acheté des pommes.'
    note: La réponse donne trois actions terminées, dans des phrases séparées.
  nl.a1.unit12.lesson06.teach.morning_question:
    title: Et ce matin ?
    gloss: 'Lotte : Et qu’est-ce que tu as fait ce matin ?'
    note: Remplace *gisteren* par *vanmorgen* pour interroger sur un autre moment récent.
  nl.a1.unit12.lesson06.teach.morning_answer:
    title: Omar est venu au café-langues
    gloss: 'Omar : Ce matin, je suis venu au café-langues à huit heures.'
    note: '*Komen* se construit avec *zijn* : *ben ... gekomen*.'
  nl.a1.unit12.lesson06.teach.lotte_answer:
    title: Lotte a bu du café
    gloss: 'Lotte : Sympa. Moi, j’ai bu du café ce matin.'
    note: '*Drinken* se construit avec *hebben* : *heb ... gedronken*.'
