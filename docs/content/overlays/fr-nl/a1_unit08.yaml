teaching:
  nl.a1.unit08.lesson01.teach.station_supermarkt_bibliotheek_ziekenhuis:
    title: Gare, supermarché, bibliothèque, hôpital
    gloss: la gare, le supermarché, la bibliothèque, l’hôpital
    note: 'Avec *station*, on emploie *het* : *het station*. Le néerlandais écrit *supermarkt* en un seul mot : *de supermarkt*. Avec *bibliotheek*, on emploie *de* : *de bibliotheek*. Le néerlandais écrit *ziekenhuis* en un seul mot : *het ziekenhuis*.'
    example_gloss:
    - Où est la gare ?
    - Le supermarché est à côté de la gare.
    - La bibliothèque est en face de la gare.
    - L’hôpital est derrière la bibliothèque.
  nl.a1.unit08.lesson01.teach.bank_postkantoor_bushalte:
    title: Banque, poste, arrêt de bus
    gloss: la banque, la poste, l’arrêt de bus
    note: 'Pour la banque en tant qu’établissement financier, le néerlandais dit *de bank*. Le néerlandais écrit *postkantoor* en un seul mot, avec *het* : *het postkantoor*. Le néerlandais écrit *bushalte* en un seul mot, avec *de* : *de bushalte*.'
    example_gloss:
    - La banque est à côté du supermarché.
    - La poste est entre la bibliothèque et l’hôpital.
    - L’arrêt de bus est devant la gare.
  nl.a1.unit08.lesson02.teach.naast_tegenover:
    title: À côté de, en face de
    gloss: à côté de, en face de
    note: '*Naast* place une chose directement à côté d’une autre. *Tegenover* indique que deux lieux se font face, souvent de part et d’autre d’une rue ou d’une place.'
    example_gloss:
    - La banque est à côté du supermarché.
    - La bibliothèque est en face de la gare.
  nl.a1.unit08.lesson02.teach.supermarket_next:
    title: Le supermarché est à côté de la gare
    gloss: Le supermarché est à côté de la gare.
    note: '*Naast* signifie juste à côté : *De supermarkt is naast het station*.'
  nl.a1.unit08.lesson02.teach.library_opposite:
    title: La bibliothèque est en face de la gare
    gloss: La bibliothèque est en face de la gare.
    note: 'Garde *het* avec *station* : *tegenover het station*.'
  nl.a1.unit08.lesson03.teach.achter_voor:
    title: Derrière, devant
    gloss: derrière, devant
    note: '*Achter* situe un lieu derrière un autre. Ici, *voor* signifie « devant » ; dans d’autres phrases, il peut avoir d’autres sens.'
    example_gloss:
    - L’hôpital est derrière la bibliothèque.
    - L’arrêt de bus est devant la gare.
  nl.a1.unit08.lesson03.teach.hospital_behind:
    title: L’hôpital est derrière la bibliothèque
    gloss: L’hôpital est derrière la bibliothèque.
    note: 'Place *achter* avant l’autre lieu : *achter de bibliotheek*.'
  nl.a1.unit08.lesson03.teach.stop_in_front:
    title: L’arrêt de bus est devant la gare
    gloss: L’arrêt de bus est devant la gare.
    note: Ici, *voor* indique où se trouve l’arrêt de bus.
  nl.a1.unit08.lesson04.teach.waar_is:
    title: Où est… ?
    gloss: Où est… ?
    note: Utilise *Waar is ...?* pour demander où se trouve un lieu.
  nl.a1.unit08.lesson04.teach.where_post_office:
    title: Où est la poste ?
    gloss: Où est la poste ?
    note: Garde *het* avec *postkantoor* dans la question.
  nl.a1.unit08.lesson04.teach.tussen_bij:
    title: Entre, près de / à
    gloss: entre, près de / à
    note: Utilise *tussen ... en ...* pour placer un lieu entre deux autres. *Bij* indique qu’un lieu est près d’un autre ; c’est moins précis que *naast*.
    example_gloss:
    - La poste est entre la bibliothèque et l’hôpital.
    - Le supermarché est près de la gare.
  nl.a1.unit08.lesson04.teach.in_de_buurt_van:
    title: Près de
    gloss: près de
    note: L’expression *in de buurt van* signifie, dans son ensemble, qu’un lieu est tout près.
  nl.a1.unit08.lesson04.teach.post_office_between:
    title: La poste est entre deux lieux
    gloss: La poste est entre la bibliothèque et l’hôpital.
    note: Utilise *en* entre les deux autres lieux.
  nl.a1.unit08.lesson04.teach.supermarket_near:
    title: Le supermarché est près de la gare
    gloss: Le supermarché est près de la gare.
    note: '*Bij* indique un lieu proche sans dire que les bâtiments sont directement côte à côte.'
  nl.a1.unit08.lesson04.teach.library_vicinity:
    title: La bibliothèque est près de la gare
    gloss: La bibliothèque est près de la gare.
    note: 'Apprends les mots *in de buurt van* ensemble : *in de buurt van het station*.'
  nl.a1.unit08.lesson05.teach.kaart_buurtkaart:
    title: Plan, plan du quartier
    gloss: le plan, le plan du quartier
    note: '*De kaart* peut désigner une carte géographique ou un autre type de carte ; ici, il s’agit d’un plan. Le néerlandais écrit *buurtkaart* en un seul mot : *de buurtkaart*.'
    example_gloss:
    - Où est le plan ?
    - Voici le plan du quartier.
  nl.a1.unit08.lesson05.teach.map_labels:
    title: Étiquettes du plan du quartier
    gloss: 'Bibliothèque : en face de la gare. Hôpital : derrière la bibliothèque. Poste : entre la bibliothèque et l’hôpital. Supermarché : à côté de la gare. Banque : à côté du supermarché. Arrêt de bus : devant la gare.'
    note: Chaque étiquette nomme un lieu et dit où il se trouve.
    glosses:
      BUURTKAART: PLAN DU QUARTIER
      Bibliotheek: bibliothèque
      tegenover: en face de
      station: gare
      Ziekenhuis: hôpital
      achter: derrière
      Postkantoor: bureau de poste
      tussen: entre
      Supermarkt: supermarché
      naast: à côté de
      Bank: banque
      Bushalte: arrêt de bus
  nl.a1.unit08.lesson06.teach.opening:
    title: Devant le plan
    gloss: 'Lotte : Regarde, voici le plan du quartier. Omar : Super. Où est l’arrêt de bus ?'
    note: Lotte et Omar se tutoient, comme d’habitude.
  nl.a1.unit08.lesson06.teach.stop_location:
    title: Situer l’arrêt de bus
    gloss: 'Lotte : L’arrêt de bus est devant la gare.'
    note: Lotte répond par une seule phrase directe pour situer le lieu.
  nl.a1.unit08.lesson06.teach.more_places:
    title: Situer le supermarché
    gloss: 'Omar : Et où est le supermarché ? Lotte : Le supermarché est à côté de la gare, près de la banque.'
    note: La réponse situe le supermarché par rapport à deux lieux.
  nl.a1.unit08.lesson06.teach.library:
    title: Situer la bibliothèque
    gloss: 'Omar : Où est la bibliothèque ? Lotte : La bibliothèque est en face de la gare. Le café des langues est dans la bibliothèque.'
    note: Cette réplique relie le décor à la bibliothèque présentée plus tôt dans le cours.
