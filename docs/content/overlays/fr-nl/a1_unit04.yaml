    title: Les heures et la prise de rendez-vous
lessons:
  nl.a1.unit04.lesson01.hele_en_halve_uren:
    title: Les heures pile et les demi-heures
  nl.a1.unit04.lesson02.kwartieren:
    title: Et quart et moins le quart
  nl.a1.unit04.lesson03.hoe_laat:
    title: Demander et dire l’heure
  nl.a1.unit04.lesson04.digitale_tijd_en_dagdelen:
    title: L’heure numérique et les moments de la journée
  nl.a1.unit04.lesson05.rooster_lezen:
    title: Le programme du café des langues
  nl.a1.unit04.lesson06.afspreken_bij_het_taalcafe:
    title: Fixer une heure au café des langues
teaching:
  nl.a1.unit04.lesson01.teach.hour:
    title: Heure
    gloss: l’heure
    note: '*Uur* suit le nombre pour une heure pile : *twee uur* correspond à deux heures.'
    example_gloss: Il est deux heures.
  nl.a1.unit04.lesson01.teach.two_oclock:
    title: Deux heures
    gloss: 2:00 — deux heures
    note: Pour une heure pile, dis le nombre suivi de *uur*.
  nl.a1.unit04.lesson01.teach.three_oclock:
    title: Trois heures
    gloss: 3:00 — trois heures
    note: '*Drie uur* correspond exactement à 3:00.'
  nl.a1.unit04.lesson01.teach.half_three:
    title: À mi-chemin vers trois
    gloss: 2:30 — deux heures et demie
    note: 'Attention : en néerlandais, *half drie* désigne l’heure à venir. C’est 2:30 et non 3:30, alors qu’en français on nomme l’heure déjà commencée (« deux heures et demie »).'
  nl.a1.unit04.lesson01.teach.half_rule:
    title: Half renvoie à l’heure suivante
    gloss: half drie = à mi-chemin vers trois heures = 2:30
    note: Lis *half* + heure comme « à mi-chemin vers cette heure ». Donc *half vier* correspond à 3:30.
  nl.a1.unit04.lesson01.teach.half_four:
    title: À mi-chemin vers quatre
    gloss: 3:30 — trois heures et demie
    note: '*Half vier* est à mi-chemin vers quatre, donc cela signifie 3:30.'
  nl.a1.unit04.lesson01.teach.time_answer:
    title: Dire une demi-heure
    gloss: Il est deux heures et demie.
    note: '*Het is ...* est la structure habituelle pour dire l’heure qu’il est.'
  nl.a1.unit04.lesson02.teach.quarter:
    title: Quart d’heure
    gloss: le quart d’heure
    note: '*Kwart* s’emploie dans les expressions figées de l’heure *kwart over* et *kwart voor*.'
    example_gloss: Un quart d’heure, c’est quinze minutes.
  nl.a1.unit04.lesson02.teach.quarter_past_two:
    title: Deux heures et quart
    gloss: 2:15 — deux heures et quart
    note: '*Kwart over twee* correspond à quinze minutes après deux heures.'
  nl.a1.unit04.lesson02.teach.past_rule:
    title: Over signifie « après »
    gloss: over = après l’heure pile
    note: Dans une expression de l’heure, *over* compte à partir de l’heure qui vient de passer.
  nl.a1.unit04.lesson02.teach.quarter_to_three:
    title: Trois heures moins le quart
    gloss: 2:45 — trois heures moins le quart
    note: '*Kwart voor drie* est quinze minutes avant trois heures, donc 2:45.'
  nl.a1.unit04.lesson02.teach.to_rule:
    title: Voor signifie « moins »
    gloss: voor = avant l’heure pile suivante
    note: Dans une expression de l’heure, *voor* renvoie à l’heure suivante.
  nl.a1.unit04.lesson02.teach.quarter_past_three:
    title: Trois heures et quart
    gloss: 3:15 — trois heures et quart
    note: '*Over* garde l’heure qui vient de passer : *kwart over drie*.'
  nl.a1.unit04.lesson02.teach.quarter_to_four:
    title: Quatre heures moins le quart
    gloss: 3 h 45 — quatre heures moins le quart
    note: '*Voor* indique l’heure qui approche : *kwart voor vier* correspond à 3 h 45.'
  nl.a1.unit04.lesson03.teach.ask_time:
    title: Demander l’heure
    gloss: Quelle heure est-il ?
    note: '*Hoe laat is het?* est la question courante pour demander l’heure qu’il est.'
  nl.a1.unit04.lesson03.teach.tell_time:
    title: Dire l’heure
    gloss: Il est deux heures et demie.
    note: 'Attention : en néerlandais, *half drie* se rapporte à l’heure suivante (trois), mais il s’agit bien de 2 h 30, et non de 3 h 30.'
  nl.a1.unit04.lesson03.teach.ask_start:
    title: Demander quand une activité commence
    gloss: À quelle heure commence le café-langues ?
    note: '*Hoe laat* introduit une question sur l’heure.'
  nl.a1.unit04.lesson03.teach.at_quarter:
    title: À deux heures et quart
    gloss: À deux heures et quart.
    note: On utilise *om* devant l’heure pour dire quand un événement a lieu.
  nl.a1.unit04.lesson03.teach.at_rule:
    title: Utiliser om pour l’heure d’un événement
    gloss: 'à + heure : à deux heures, à deux heures et demie'
    note: N’utilise pas *om* quand tu indiques simplement l’heure qu’il est avec *Het is*.
  nl.a1.unit04.lesson03.teach.late:
    title: Demander si on est en retard
    gloss: Suis-je en retard ?
    note: '*Laat* signifie ici « tard » ; cette phrase est naturelle dans un échange sur l’heure.'
  nl.a1.unit04.lesson03.teach.on_time:
    title: Dire que quelqu’un est à l’heure
    gloss: Non, tu es à l’heure.
    note: '*Op tijd* signifie « à l’heure ». *Je* garde l’échange informel.'
  nl.a1.unit04.lesson04.teach.twenty_four_hour:
    title: Quatorze heures
    gloss: 14:00 — quatorze heures
    note: Les horaires et les annonces utilisent souvent le système de 24 heures. *Veertien uur* est une façon orale non ambiguë de dire 14 h 00.
  nl.a1.unit04.lesson04.teach.eighteen_hour:
    title: Dix-huit heures
    gloss: 18:00 — dix-huit heures
    note: '*Achttien uur* est la forme du système de 24 heures pour 6 heures du soir.'
  nl.a1.unit04.lesson04.teach.morning:
    title: Sept heures du matin
    gloss: 7:00 — sept heures du matin
    note: '*''s Ochtends* signifie « le matin ». Le *''s* initial fait partie de l’expression figée.'
  nl.a1.unit04.lesson04.teach.afternoon:
    title: Deux heures de l’après-midi
    gloss: 14:00 — deux heures de l’après-midi
    note: '*''s Middags* couvre l’après-midi, à partir de midi environ ; il distingue 14 h 00 de 2 h 00 quand on parle sur 12 heures.'
  nl.a1.unit04.lesson04.teach.evening:
    title: Huit heures du soir
    gloss: 20:00 — huit heures du soir
    note: '*''s Avonds* s’emploie pour la soirée, en gros de la fin d’après-midi jusqu’à minuit environ.'
  nl.a1.unit04.lesson04.teach.night:
    title: Deux heures du matin
    gloss: 2:00 — deux heures du matin
    note: '*''s Nachts* s’emploie pour les heures de la nuit ; 2 h 00 se dit naturellement *twee uur ''s nachts*.'
  nl.a1.unit04.lesson04.teach.day_parts:
    title: Les moments de la journée
    gloss: le matin · l’après-midi · le soir · la nuit
    note: 'Les limites sont approximatives en néerlandais : *ochtend* va jusqu’à midi environ, *middag* de midi à l’après-midi, *avond* couvre la soirée et *nacht* la période nocturne.'
    example_gloss:
    - Je bois du café le matin.
    - Le café-langues a lieu l’après-midi.
    - Je lis le soir.
    - Je dors la nuit.
  nl.a1.unit04.lesson05.teach.schedule:
    title: Horaire
    gloss: les horaires
    note: Un *rooster* présente les activités et leurs horaires.
    example_gloss: Je lis les horaires.
  nl.a1.unit04.lesson05.teach.opening_hours:
    title: Horaires d’ouverture du café-langues
    gloss: 'Café-langues ouvert : 14 h 00–16 h 00'
    note: Les horaires néerlandais utilisent souvent un point entre les heures et les minutes ; 14.00 correspond à 14 h 00 (en français, on écrit plutôt « 14 h 00 » ou « 14:00 »).
  nl.a1.unit04.lesson05.teach.welcome:
    title: Heure d’accueil
    gloss: 14 h 15 Accueil
    note: 14.15 peut se dire *kwart over twee* dans la langue courante sur 12 heures.
  nl.a1.unit04.lesson05.teach.workshop:
    title: Heure de l’atelier
    gloss: 14 h 45 Atelier
    note: '14.45 se dit *kwart voor drie* : le quart avant trois heures.'
  nl.a1.unit04.lesson05.teach.break:
    title: Heure de la pause
    gloss: 15 h 30 Pause
    note: '15.30 se dit *half vier* : à mi-chemin vers quatre heures, donc trois heures et demie.'
  nl.a1.unit04.lesson05.teach.ask_schedule:
    title: Demander une heure dans un programme
    gloss: À quelle heure commence l’atelier ?
    note: '*Begint* sert à demander quand l’activité commence.'
  nl.a1.unit04.lesson05.teach.workshop_answer:
    title: Donner l’heure de l’atelier
    gloss: À trois heures moins le quart.
    note: 14.45 dans le programme se dit *kwart voor drie*.
  nl.a1.unit04.lesson06.teach.start_turn:
    title: Confirmer l’heure du café-langues
    gloss: 'Lotte : À quelle heure commence le café-langues vendredi ? Omar : À deux heures et quart, donc à 14 h 15.'
    note: 'Omar donne les deux formes : *kwart over twee* et 14.15 désignent la même heure, comme l’heure d’accueil du programme dans la leçon 5.'
  nl.a1.unit04.lesson06.teach.workshop_turn:
    title: Poser une question sur l’atelier
    gloss: 'Lotte : Et à quelle heure commence l’atelier ? Omar : À trois heures moins le quart.'
    note: '*Kwart voor drie* correspond à 14 h 45, comme dans le programme de la leçon 5.'
  nl.a1.unit04.lesson06.teach.arrival_turn:
    title: Indiquer une heure d’arrivée
    gloss: 'Lotte : Bien. Alors j’y serai à deux heures.'
    note: Lotte prévoit d’arriver à 14 h 00, quinze minutes avant le début à 14 h 15.
  nl.a1.unit04.lesson06.teach.close_turn:
    title: Conclure le plan
    gloss: 'Omar : Parfait, à vendredi après-midi !'
    note: '*Vrijdagmiddag* est un mot composé naturel qui signifie « vendredi après-midi ».'
