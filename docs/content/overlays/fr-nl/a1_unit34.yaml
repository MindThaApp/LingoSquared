    note: Étend la formule d’au revoir de l’unité sur les salutations à un jour précis.
  nl.a1.unit34.lesson05.teach.tekst:
    title: Qui utilise quoi ?
    gloss: Lotte appelle Omar tous les jours. Elle utilise son téléphone, pas une appli. Omar n’a pas d’ordinateur à la maison, mais il utilise internet sur son téléphone. Sander cherche la météo tous les matins. Ensuite, il va courir. Fenna envoie souvent un message à Lotte. Et toi, utilises-tu aussi ton téléphone tous les jours ?
    note: Compare les habitudes des quatre personnages en matière d’appareils, sur le modèle du texte comparatif de l’unité sur le sport.
