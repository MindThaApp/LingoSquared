    title: Weerbericht et bericht
    gloss: Tu connais déjà *het weerbericht* (weer + bericht). *Bericht* désigne un message que l’on peut envoyer (ik stuur, jij/hij stuurt) ou lire (ik lees, jij/hij leest).
