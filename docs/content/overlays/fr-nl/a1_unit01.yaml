teaching:
  nl.a1.unit01.lesson01.teach.hallo_hoi:
    title: Bonjour et salut
    gloss: salut / bonjour
    note: '*Hallo* est neutre et convient aussi bien dans les situations informelles que formelles. *Hoi* est courant et informel.'
    example_gloss:
    - Bonjour, tu es nouveau ici ?
    - Salut, moi, c’est Noor.
  nl.a1.unit01.lesson01.teach.jij_je_u:
    title: 'Tu et vous : formes informelles et formelle'
    gloss: tu (accentué, informel) / tu (non accentué, informel) / vous (formel)
    note: '*Jij* est la forme informelle du singulier, employée quand le mot est accentué ou mis en contraste. *Je* est la forme informelle habituelle, non accentuée, dans la langue de tous les jours. *U* marque une distance respectueuse. Aux Pays-Bas, on l’emploie naturellement avec certains inconnus plus âgés et dans les relations explicitement formelles, mais jij/je est aussi courant entre adultes dans de nombreux magasins et lieux de travail.'
    example_gloss:
    - Tu es nouveau ici ? (informel, accentué)
    - Tu es nouveau ici. (informel, non accentué)
    - Vous êtes nouveau ici ? (formel)
  nl.a1.unit01.lesson01.teach.informal_new:
    title: Demander à une personne de ton âge si elle est nouvelle
    gloss: Tu es nouveau ici ?
    note: 'Dans une question, *jij bent* devient *ben jij* : le -t tombe quand *jij* suit le verbe.'
  nl.a1.unit01.lesson01.teach.formal_new:
    title: Demander formellement si quelqu’un est nouveau
    gloss: Vous êtes nouveau ici ?
    note: Avec *u*, on dit *bent u*. Le -t reste.
  nl.a1.unit01.lesson01.teach.register_rule:
    title: Choisir la forme pour dire « tu » ou « vous »
    gloss: 'jij/je : informel · u : formel ou poli'
    note: Utilise *jij/je* avec des amis, des personnes de ton âge, des enfants et dans de nombreux contextes modernes détendus. Utilise *u* quand la relation demande du respect ou de la distance ; les préférences varient, alors suis l’exemple de ton interlocuteur.
  nl.a1.unit01.lesson02.teach.goedemorgen_tot_goedenavond:
    title: Salutations du matin, de l’après-midi et du soir
    gloss: bonjour (le matin) / bonjour (l’après-midi) / bonsoir
    note: '*Goedemorgen* s’emploie le matin, en général jusqu’à midi environ. *Goedemiddag* s’emploie à partir de midi environ et pendant l’après-midi. *Goedenavond* est une salutation du soir.'
    example_gloss:
    - Bonjour ! Comment vas-tu ?
    - Bonjour, comment allez-vous ? (formel)
    - Bonsoir ! Tu es nouveau ici ?
  nl.a1.unit01.lesson02.teach.hoe_gaat_het:
    title: Comment ça va ?
    gloss: Comment allez-vous ?
    note: '*Hoe gaat het?* est une manière courante et neutre de demander comment va quelqu’un.'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_je:
    title: Comment vas-tu ? Informel
    gloss: Comment allez-vous ?
    note: '*Met je* désigne explicitement la personne à qui l’on s’adresse, de façon informelle.'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_u:
    title: Comment allez-vous ? Formel
    gloss: Comment allez-vous ?
    note: Utilise *met u* quand la situation demande le vouvoiement.
  nl.a1.unit01.lesson02.teach.goed_dank_je:
    title: 'Bien, merci : informel'
    gloss: Bien, merci.
    note: '*Dank je* correspond au tutoiement.'
  nl.a1.unit01.lesson02.teach.goed_dank_u:
    title: 'Bien, merci : formel'
    gloss: Bien, merci.
    note: '*Dank u* correspond au vouvoiement.'
  nl.a1.unit01.lesson02.teach.prima:
    title: Super
    gloss: super / très bien
    note: '*Prima* est une réponse courte et positive.'
    example_gloss: Très bien, merci.
  nl.a1.unit01.lesson02.teach.niet_slecht:
    title: Pas mal
    gloss: pas mal
    note: '*Niet slecht* est généralement une réponse moyennement positive.'
  nl.a1.unit01.lesson02.teach.en_met_jou:
    title: Et toi ? Informel
    gloss: Et vous ?
    note: '*Jou* est la forme informelle accentuée après *met*.'
  nl.a1.unit01.lesson02.teach.en_met_u:
    title: Et vous ? Formel
    gloss: Et vous ?
    note: '*U* garde la question de retour formelle.'
  nl.a1.unit01.lesson03.teach.hoe_heet_je:
    title: Demander familièrement le nom de quelqu’un
    gloss: Comment vous appelez-vous ?
    note: '*Hoe heet je?* est la question habituelle, informelle, pour demander le prénom.'
  nl.a1.unit01.lesson03.teach.hoe_heet_u:
    title: Demander poliment le nom de quelqu’un
    gloss: Comment vous appelez-vous ?
    note: '*Hoe heet u?* est poli ; *Wat is uw naam?* est une autre formule formelle, au ton plus administratif, qui n’est pas testée ici.'
  nl.a1.unit01.lesson03.teach.ik_heet_noor:
    title: Donner son nom
    gloss: Je m’appelle Noor.
    note: '*Ik heet ...* est une façon directe et standard de dire son nom.'
  nl.a1.unit01.lesson03.teach.ik_ben_noor:
    title: Se présenter naturellement
    gloss: Moi, c’est Noor.
    note: '*Ik ben ...* est particulièrement courant dans les présentations à l’oral.'
  nl.a1.unit01.lesson03.teach.mijn_naam:
    title: Mon nom est
    gloss: Mon nom est Noor.
    note: '*Mijn naam is ...* est correct, mais un peu plus explicite que *Ik ben ...* ou *Ik heet ...*.'
  nl.a1.unit01.lesson03.teach.leuk_ontmoeten:
    title: Enchanté(e)
    gloss: Enchanté.
    note: Cette formule est aimable et naturelle lors d’une première rencontre.
  nl.a1.unit01.lesson03.teach.aangenaam:
    title: Enchanté(e)
    gloss: enchanté(e)
    note: '*Aangenaam* est conventionnel et plus formel que *Leuk je te ontmoeten*.'
    example_gloss: Enchanté ! Je m’appelle Noor.
  nl.a1.unit01.lesson04.teach.where_from_informal:
    title: Demander d’où vient quelqu’un
    gloss: D’où venez-vous ?
    note: '*Kom je* est la forme interrogative informelle.'
  nl.a1.unit01.lesson04.teach.where_from_formal:
    title: Demander formellement d’où vient quelqu’un
    gloss: D’où venez-vous ?
    note: 'Avec *u*, le verbe est *komt* : *Waar komt u vandaan?*'
  nl.a1.unit01.lesson04.teach.from_netherlands:
    title: Des Pays-Bas
    gloss: Je viens des Pays-Bas.
    note: Utilise *uit* devant un pays d’origine.
  nl.a1.unit01.lesson04.teach.from_belgium:
    title: De Belgique
    gloss: Je viens de Belgique.
    note: '*België* porte un tréma sur le deuxième e.'
  nl.a1.unit01.lesson04.teach.from_germany:
    title: D’Allemagne
    gloss: Je viens d’Allemagne.
    note: '*Duitsland* est le pays ; *Duits* est la langue.'
  nl.a1.unit01.lesson04.teach.dutch_nationality:
    title: Nationalité néerlandaise
    gloss: Je suis néerlandais(e).
    note: '*Nederlands* peut désigner la nationalité aussi bien que la langue néerlandaise ; en français, on distingue « néerlandais » (adjectif) et « le néerlandais » (langue) avec le même mot.'
  nl.a1.unit01.lesson04.teach.belgian_nationality:
    title: Nationalité belge
    gloss: Je suis belge.
    note: '*Belgisch* désigne ici la nationalité belge.'
  nl.a1.unit01.lesson04.teach.speak_dutch:
    title: Parler néerlandais
    gloss: Je parle néerlandais.
    note: En néerlandais, les noms de langues prennent une majuscule, contrairement au français.
  nl.a1.unit01.lesson04.teach.speak_english:
    title: Parler anglais
    gloss: Je parle anglais.
    note: '*Engels* est le mot néerlandais pour « anglais ».'
  nl.a1.unit01.lesson04.teach.speak_german:
    title: Parler allemand
    gloss: Je parle allemand.
    note: '*Duits* est le mot néerlandais pour « allemand ».'
  nl.a1.unit01.lesson05.teach.taalcafe_bibliotheek:
    title: Café-langues et bibliothèque
    gloss: le café-langues / la bibliothèque
    note: Un *taalcafé* est une rencontre sans pression pour pratiquer le néerlandais avec d’autres personnes. Les bibliothèques publiques néerlandaises accueillent souvent des activités locales, dont des cafés-langues.
    example_gloss:
    - Je suis ici pour le café-langues.
    - J’apprends le néerlandais à la bibliothèque.
  nl.a1.unit01.lesson05.teach.location:
    title: Le lieu de rencontre
    gloss: Le café-langues a lieu à la bibliothèque.
    note: Cette phrase pose le décor de la scène.
  nl.a1.unit01.lesson05.teach.here_for:
    title: Vérifier l’activité commune
    gloss: Tu es ici pour le café-langues ?
    note: C’est une entrée en matière informelle et naturelle quand deux personnes arrivent pour la même activité.
  nl.a1.unit01.lesson05.teach.yes_here_for:
    title: Confirmer l’activité
    gloss: Oui, je suis ici pour le café-langues.
    note: La réponse reprend clairement l’activité.
  nl.a1.unit01.lesson05.teach.learning:
    title: Dire ce que tu apprends
    gloss: J’apprends le néerlandais.
    note: '*Leer* est la forme de la première personne de *leren*, « apprendre ».'
  nl.a1.unit01.lesson05.teach.me_too:
    title: Moi aussi
    gloss: Moi aussi.
    note: '*Ik ook* est une façon courte et naturelle d’exprimer un point commun.'
  nl.a1.unit01.lesson05.teach.first_time:
    title: Demander si c’est la première fois de quelqu’un
    gloss: C’est ta première fois ?
    note: C’est une conversation amicale lors d’une activité régulière.
  nl.a1.unit01.lesson05.teach.first_time_answer:
    title: Dire que c’est ta première fois
    gloss: Oui, c’est ma première fois.
    note: '*Mijn* veut dire « mon » ou « ma ».'
  nl.a1.unit01.lesson06.teach.lotte_opening:
    title: Lotte engage la conversation
    gloss: 'Lotte : Salut, je suis Lotte. Comment tu t’appelles ?'
    note: Lotte emploie le *je* informel dans ce cadre de groupe décontracté.
  nl.a1.unit01.lesson06.teach.omar_name:
    title: Omar donne son prénom
    gloss: 'Omar : Je m’appelle Omar. Enchanté.'
    note: Il répond à la question sur son prénom et accueille la rencontre.
  nl.a1.unit01.lesson06.teach.lotte_origin_question:
    title: Lotte demande d’où il vient
    gloss: 'Lotte : Moi aussi ! D’où viens-tu ?'
    note: '*Jou ook!* est une courte réponse naturelle à *Leuk je te ontmoeten*.'
  nl.a1.unit01.lesson06.teach.omar_origin:
    title: Omar donne son origine
    gloss: 'Omar : Je viens d’Égypte. Et toi ?'
    note: '*En jij?* renvoie la même question de façon informelle.'
  nl.a1.unit01.lesson06.teach.lotte_context:
    title: Lotte poursuit la conversation
    gloss: 'Lotte : Je viens des Pays-Bas. C’est ta première fois au café linguistique ?'
    note: '*Bij het taalcafé* signifie « au café linguistique », en tant qu’activité.'
  nl.a1.unit01.lesson06.teach.omar_language:
    title: Omar répond et dit ce qu’il apprend
    gloss: 'Omar : Oui, c’est ma première fois. J’apprends le néerlandais.'
    note: Il répond à la question de Lotte avant d’ajouter une information de base sur lui.
  nl.a1.unit01.lesson06.teach.tot_ziens:
    title: Au revoir
    gloss: Au revoir !
    note: '*Tot ziens* est une formule d’au revoir neutre.'
  nl.a1.unit01.lesson06.teach.closing:
    title: Une conclusion naturelle
    gloss: 'Lotte : Super ! À la semaine prochaine. Omar : À la semaine prochaine !'
    note: Répéter *Tot volgende week* est naturel quand les deux personnes comptent revenir.
