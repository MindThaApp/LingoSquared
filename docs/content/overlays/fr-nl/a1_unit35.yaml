  nl.a1.unit35.lesson05.teach.tekst:
    title: Qui étudie quoi ?
    gloss: Sander ne fait pas que travailler, il étudie aussi. Il suit un cours d’espagnol à l’université populaire. Il apprend de nouveaux mots chaque semaine. Fenna suit une formation en haute école. Elle y étudie les soins de santé. Tous les deux aiment étudier. Et toi, qu’étudies-tu, ou qu’aimerais-tu apprendre ?
    note: Compare les études de Sander et de Fenna, sur le modèle de la lecture comparative de l’unité sur la technologie.
