teaching:
  nl.a1.unit07.lesson01.teach.markt_winkel_kraam:
    title: Marché, magasin, étal
    gloss: le marché, le magasin, l’étal
    note: '*De markt* peut désigner un marché en général ou un marché régulier en plein air. *De winkel* est un magasin. Une *kraam* est un étal sur un marché en plein air.'
    example_gloss:
    - Je vais au marché.
    - Je vais au magasin.
    - L’étal vend des pommes.
  nl.a1.unit07.lesson01.teach.appels_peren_tomaten_paprikas:
    title: Pommes, poires, tomates, poivrons
    gloss: pommes, poires, tomates, poivrons
    note: Le singulier est *appel* ; le pluriel est *appels*. Le singulier est *peer* ; le pluriel est *peren*. Le singulier est *tomaat* ; le pluriel est *tomaten*. En néerlandais, *paprika* désigne un poivron ; le pluriel écrit est *paprika's*.
    example_gloss:
    - Je voudrais des pommes.
    - Je voudrais des poires.
    - Je voudrais des tomates.
    - Je voudrais des poivrons.
  nl.a1.unit07.lesson02.teach.kilo:
    title: Un kilo
    gloss: un kilo
    note: '*Een kilo* correspond à un kilogramme.'
    example_gloss: Je veux un kilo de pommes.
  nl.a1.unit07.lesson02.teach.per_kilo:
    title: Per kilo
    gloss: au kilo
    note: Sur les marchés, les étiquettes indiquent souvent un prix au kilo.
  nl.a1.unit07.lesson02.teach.ask_apples:
    title: Combien coûte un kilo de pommes ?
    gloss: Combien coûte un kilo de pommes ?
    note: '*Hoeveel kost ...?* sert à demander le prix. Ici, ce qui coûte quelque chose est *een kilo*, donc on utilise *kost* au singulier.'
  nl.a1.unit07.lesson02.teach.answer_apples:
    title: Un kilo de pommes coûte 2,50 €
    gloss: Un kilo de pommes coûte 2,50 €.
    note: 'Les prix néerlandais s’écrivent avec une virgule décimale, comme en français : €2,50.'
  nl.a1.unit07.lesson02.teach.spoken_price:
    title: Deux euros cinquante
    gloss: 2,50 € — deux euros cinquante
    note: €2,50 se dit couramment *twee euro vijftig*, sans *en* ni *cent*.
  nl.a1.unit07.lesson03.teach.gram_pond_stuk_stuks:
    title: Grammes, une livre, une pièce, deux pièces
    gloss: cent grammes, une livre = 500 grammes, une pièce, deux pièces
    note: 'Après un nombre, le néerlandais emploie ici *gram*, et non *grammen*. Dans le néerlandais courant, *een pond* désigne 500 grammes : c’est un terme ancien et informel, qui n’est pas une unité métrique officielle (comme la « livre » en français). *Per stuk* signifie que chaque pièce a son propre prix ; après un nombre supérieur à un, on emploie *stuks* pour indiquer seul un nombre de pièces, comme dans *twee stuks*.'
    example_gloss:
    - Je veux 100 grammes de fromage.
    - Une livre de pommes, s’il vous plaît.
    - Puis-je en avoir un, s’il vous plaît ?
    - J’en voudrais deux, s’il vous plaît.
  nl.a1.unit07.lesson03.teach.how_much:
    title: Vous en voulez combien ?
    gloss: Vous en voulez combien ?
    note: Le vendeur emploie la forme de politesse *u*. *Hoeveel* peut porter sur un poids ou sur un nombre.
  nl.a1.unit07.lesson03.teach.pond_tomatoes:
    title: Une livre de tomates, s’il vous plaît
    gloss: Une livre (500 g) de tomates, s’il vous plaît.
    note: C’est une réponse courte complète et naturelle quand un vendeur demande *Hoeveel wilt u?*
  nl.a1.unit07.lesson04.teach.prijskaartje:
    title: Étiquette de prix
    gloss: l’étiquette de prix
    note: '*Prijskaartje* s’écrit en un seul mot. Apprends le mot en entier.'
    example_gloss: L’étiquette indique 2,50 €.
  nl.a1.unit07.lesson04.teach.market_labels:
    title: Étiquettes de prix au marché
    gloss: 'Pommes : 2,50 € le kilo. Poires : 3,00 € le kilo. Tomates : 2,00 € le kilo. Poivrons : 1,00 € la pièce.'
    note: Lis *per kilo* comme « au kilo » et *per stuk* comme « à la pièce ». Les étiquettes néerlandaises utilisent une virgule dans les prix.
    glosses:
      Appels: pommes
      kilo: kilogramme
      Peren: poires
      Tomaten: tomates
      stuk: pièce / article
  nl.a1.unit07.lesson05.teach.what_would_you_like:
    title: Qu’est-ce que je vous sers ?
    gloss: Que désirez-vous ?
    note: '*Wat mag het zijn?* est une question courante et sympathique de la part d’un vendeur au marché ou d’un employé de magasin.'
  nl.a1.unit07.lesson05.teach.take_pears:
    title: Alors je prends un kilo de poires
    gloss: Alors je prends un kilo de poires, s’il vous plaît.
    note: '*Dan neem ik ...* est une façon naturelle de décider ce qu’on achète après avoir entendu le prix.'
  nl.a1.unit07.lesson05.teach.anything_else:
    title: Et avec ça ?
    gloss: Et avec ça ?
    note: Une petite question de suivi courante chez un vendeur.
  nl.a1.unit07.lesson05.teach.no_thanks:
    title: Non, merci
    gloss: Non, merci.
    note: '*Dank u* correspond au registre poli avec *u* utilisé avec le vendeur.'
  nl.a1.unit07.lesson05.teach.total:
    title: Cela fait 3,00 €
    gloss: Cela fait 3,00 € — trois euros.
    note: '*Dat is dan ...* est une façon courante pour un vendeur d’annoncer le total. Le prix écrit €3,00 se dit *drie euro*.'
  nl.a1.unit07.lesson05.teach.pin:
    title: Puis-je payer par carte ?
    gloss: Puis-je payer par carte ?
    note: '*Pinnen* est le verbe néerlandais courant pour payer par carte bancaire à un terminal, un peu comme « payer par carte » en français.'
  nl.a1.unit07.lesson06.teach.opening:
    title: Salutations et demande du prix
    gloss: 'Vendeur : Bonjour. Qu’est-ce que ce sera ? Lotte : Bonjour. Combien coûte un kilo de pommes ?'
    note: C’est un échange aimable et poli entre une cliente et un vendeur.
  nl.a1.unit07.lesson06.teach.purchase:
    title: Choisir la quantité
    gloss: 'Vendeur : Deux euros cinquante le kilo. Lotte : Alors j’en prends un kilo, s’il vous plaît.'
    note: Comme il est déjà question de pommes dans la réplique précédente, Lotte peut simplement dire *een kilo*.
  nl.a1.unit07.lesson06.teach.payment:
    title: Payer par carte
    gloss: 'Vendeur : Cela fait deux euros cinquante. Lotte : Je peux payer par carte ? Vendeur : Oui, bien sûr.'
    note: '*Kan ik pinnen?* est la question pratique habituelle au moment de payer.'
  nl.a1.unit07.lesson06.teach.closing:
    title: Terminer l’échange
    gloss: 'Lotte : Merci. Au revoir ! Vendeur : Au revoir !'
    note: '*Tot ziens* convient pour clore cet échange de service poli.'
