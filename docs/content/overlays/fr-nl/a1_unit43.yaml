  nl.a1.unit43.lesson03.teach.ik_vind_grammar:
    title: La construction Ik vind
    gloss: '*Ik vind* + saison + qualité dit ce que tu penses d’une saison : J’aime l’été.'
    note: 'On réutilise la construction d’opinion déjà vue *Ik vind X Y* (Ik vind koffie lekker, Ik vind Fenna nieuwsgierig) : pas de nouvelle grammaire, seulement un nouvel emploi. *vind* reste sans -t ici parce que le sujet est *Ik* (1re personne) ; la question *Welk seizoen vind jij mooi?* n’a pas non plus de -t, car *jij* suit le verbe (inversion). La forme de la 3e personne *vindt* (comme dans *Omar vindt ...*) est un point de grammaire distinct, qui sera vu plus tard.'
