  nl.a1.unit43.lesson05.teach.tekst:
    title: Une conversation sur les saisons
    gloss: 'C’est le printemps maintenant. Les tulipes sont belles. Nina demande : Quelle saison trouves-tu belle ? Omar dit : J’aime l’été. En été, on nage. Lotte dit : J’aime l’hiver. En hiver, on patine.'
    note: Reprend la conversation au café de langues de la leçon précédente sous forme de discours rapporté, comme les lectures de récapitulation des unités sur la maison, le quartier, la poste, la cuisine, la personnalité et les couleurs.
