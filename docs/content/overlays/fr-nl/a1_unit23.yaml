course:
  title: Néerlandais A1
  description: 'Néerlandais pour débutants afin de gérer les situations d’argent de base : demander le prix total, choisir un moyen de paiement, partager l’addition et gérer la monnaie.'
units:
  nl.a1.unit23.money:
    title: L’argent et le paiement
