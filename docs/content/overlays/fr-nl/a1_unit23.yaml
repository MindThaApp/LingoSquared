teaching:
  nl.a1.unit23.lesson01.teach.hoeveel_totaal:
    title: Demander le prix total
    gloss: Combien cela coûte-t-il au total ?
    note: '*In totaal* (au total) précise que tu veux le prix global, et non le prix d’un seul article.'
  nl.a1.unit23.lesson01.teach.kost_vijfentwintig:
    title: Indiquer un prix total
    gloss: Cela coûte vingt-cinq euros au total.
    note: '*Kost* est la troisième personne du singulier de *kosten* (coûter).'
  nl.a1.unit23.lesson02.teach.pinnen_contant:
    title: Payer par carte ou en espèces
    gloss: payer par carte, payer en espèces
    note: '*Pinnen* est un verbe typiquement néerlandais pour payer par carte, dérivé du code PIN servant à autoriser le paiement ; *contant betalen* (littéralement « comptant payer ») est l’équivalent pour l’argent liquide, avec *contant* placé avant *betalen* comme adverbe.'
    example_gloss:
    - Puis-je payer par carte ici ?
    - Je paie en espèces.
  nl.a1.unit23.lesson02.teach.kan_ik_pinnen:
    title: Demander s’il est possible de payer par carte
    gloss: Puis-je payer par carte ici ?
    note: '*Hier* (ici) situe la question à l’endroit où l’on se trouve.'
  nl.a1.unit23.lesson02.teach.wilt_u_betalen:
    title: Demander le moyen de paiement souhaité
    gloss: Souhaitez-vous payer en espèces ou par carte ?
    note: '*Wilt u* ...? est la version de politesse de *wil je* ...?, employée ici par un caissier que l’on ne connaît pas.'
  nl.a1.unit23.lesson03.teach.rekening:
    title: L’addition
    gloss: l’addition
    note: 'Un nom de genre commun : *de rekening*.'
    example_gloss: On partage l’addition ?
  nl.a1.unit23.lesson03.teach.rekening_delen:
    title: Proposer de partager l’addition
    gloss: On partage l’addition ?
    note: '*Zullen we* ...? reprend le modèle de proposition vu aux unités 11 et 19.'
  nl.a1.unit23.lesson03.teach.apart_afrekenen:
    title: Demander à payer séparément
    gloss: Puis-je payer séparément ?
    note: '*Apart* (séparément) complète *afrekenen* (régler la note), quasi-synonyme de *betalen* employé spécifiquement pour finaliser un paiement.'
  nl.a1.unit23.lesson04.teach.wisselgeld:
    title: La monnaie
    gloss: la monnaie
    note: 'Un nom neutre : *het wisselgeld*, composé de *wisselen* (changer) et *geld* (argent).'
    example_gloss: Voici votre monnaie.
  nl.a1.unit23.lesson04.teach.hier_wisselgeld:
    title: Rendre la monnaie
    gloss: Voici votre monnaie.
    note: '*Uw* est le possessif de politesse « votre », adapté au registre formel d’une caisse ou d’un comptoir.'
  nl.a1.unit23.lesson04.teach.geen_wisselgeld_nodig:
    title: Refuser la monnaie
    gloss: Je n’ai pas besoin de monnaie.
    note: '*Nodig hebben* (avoir besoin de) reprend le modèle de *rugzak nodig hebben* de l’unité 14.'
  nl.a1.unit23.lesson05.teach.vijfendertig:
    title: Trente-cinq
    gloss: trente-cinq
    note: '*Vijfendertig* (littéralement « cinq-et-trente ») suit le modèle néerlandais habituel des nombres composés : unités avant dizaines.'
    example_gloss: Cela coûte trente-cinq euros.
  nl.a1.unit23.lesson05.teach.bonnetje:
    title: Lire une addition de restaurant
    gloss: 'Addition : deux plats principaux et deux cafés. Total : trente-cinq euros. Payé par carte.'
    note: Repère ce qui a été commandé, le total et le moyen de paiement.
    glosses:
      Rekening: addition
      twee: deux
      hoofdgerechten: plats principaux
      koffies: cafés
      Totaal: total
      vijfendertig: trente-cinq
      euro: euros
      Betaald: payé
      pin: carte
  nl.a1.unit23.lesson06.teach.lotte_ask_bill:
    title: Lotte demande l’addition
    gloss: 'Lotte : On demande l’addition ?'
    note: '*Vragen* (demander) a pour complément d’objet direct *de rekening*.'
  nl.a1.unit23.lesson06.teach.omar_ask_total:
    title: Omar demande le total
    gloss: 'Omar : Oui, bonne idée. Ça coûte combien en tout ?'
    note: Reprend la question *hoeveel kost het in totaal?* de la leçon 1.
  nl.a1.unit23.lesson06.teach.lotte_state_total:
    title: Lotte annonce le total
    gloss: 'Lotte : Ça fait trente-cinq euros. On partage ?'
    note: '*Delen* (partager) renvoie ici à *de rekening*, mentionnée dans le contexte.'
  nl.a1.unit23.lesson06.teach.omar_offer_pay:
    title: Omar insiste pour payer
    gloss: 'Omar : Non, laisse-moi payer aujourd’hui. Tu m’as tellement aidé.'
    note: '*Laat mij* ... (laisse-moi ...) est la façon habituelle de proposer de faire quelque chose ; *geholpen* est le participe passé de *helpen* (aider).'
  nl.a1.unit23.lesson06.teach.lotte_thanks:
    title: Lotte est touchée
    gloss: 'Lotte : C’est gentil de ta part ! Merci.'
    note: '*Lief van je* (gentil de ta part) est un compliment chaleureux et courant pour un geste généreux.'
  nl.a1.unit23.lesson06.teach.omar_ask_card:
    title: Omar demande s’il peut payer par carte
    gloss: 'Omar : Je peux payer par carte ici ?'
    note: Reprend la question *kan ik hier pinnen?* de la leçon 2, cette fois dans le vrai restaurant.
  nl.a1.unit23.lesson06.teach.betaalt_form:
    title: 'Betaalt : la forme du il/elle'
    gloss: Omar paie l’addition.
    note: '*Betaalt* est la forme de la troisième personne du singulier de *betalen* (payer).'
