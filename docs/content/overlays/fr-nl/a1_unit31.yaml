course:
  title: Néerlandais A1
  description: 'Néerlandais pour débutants afin de parler des animaux de compagnie et des animaux courants : les nommer, les soins de base (promener, nourrir, jouer), dire quels animaux tu adores même sans en avoir, et le pluriel régulier en néerlandais.'
units:
  nl.a1.unit31.animals:
    title: Les animaux et les animaux de compagnie
lessons:
  nl.a1.unit31.lesson01.huisdieren_woorden:
    title: Le chien, le chat, le poisson et l’oiseau
  nl.a1.unit31.lesson02.zorg_voor_huisdieren:
    title: S’occuper d’un animal de compagnie
  nl.a1.unit31.lesson03.van_dieren_houden:
    title: Adorer les animaux
  nl.a1.unit31.lesson04.taalcafe_lottes_hond:
    title: Omar interroge Lotte sur son chien
  nl.a1.unit31.lesson05.omar_fenna_sander_dieren:
    title: Omar, Fenna et Sander parlent des animaux
  nl.a1.unit31.lesson06.taalcafe_ninas_vogel:
    title: L’oiseau de Nina
teaching:
  nl.a1.unit31.lesson01.teach.dier_huisdier:
    title: Un animal, un animal de compagnie
    gloss: l’animal / un animal de compagnie
    note: '*Dier* est le mot général pour « animal » ; *huisdier* (littéralement « animal de maison ») désigne spécifiquement un animal de compagnie.'
    example_gloss:
    - Un chien est un animal.
    - Un chien est aussi un animal de compagnie.
  nl.a1.unit31.lesson01.teach.hond_kat:
    title: Le chien et le chat
    gloss: le chien / le chat
    example_gloss:
    - Lotte a un chien.
    - Sander a un chat.
  nl.a1.unit31.lesson01.teach.vis_vogel:
    title: Le poisson et l’oiseau
    gloss: le poisson / l’oiseau
    example_gloss:
    - Grand-père a un poisson.
    - Nina a un oiseau.
  nl.a1.unit31.lesson01.teach.heb_je_huisdier:
    title: As-tu un animal de compagnie ?
    gloss: As-tu un animal de compagnie ?
    note: C’est le même schéma de question *Heb je ...?* que tu connais déjà des unités précédentes.
  nl.a1.unit31.lesson01.teach.antwoord_ja:
    title: Oui, j’ai un chien
    gloss: Oui, j’ai un chien.
    note: Une réponse affirmative simple qui utilise le nouveau vocabulaire de cette unité.
  nl.a1.unit31.lesson01.teach.antwoord_nee_geen:
    title: Non, je n’ai pas d’animal de compagnie
    gloss: Non, je n’ai pas d’animal de compagnie.
    note: '*Geen* nie le nom indéfini *een huisdier* -- voir la note de grammaire.'
  nl.a1.unit31.lesson01.teach.geen_note:
    title: 'Geen : nier un nom indéfini'
    gloss: Geen nie un nom indéfini, comme dans Ik heb geen tijd (que tu connais déjà) et ici Ik heb geen huisdier.
    note: C’est exactement le même schéma *geen* que dans *Ik heb geen tijd* -- pas de nouvelle grammaire, juste un nouveau nom.
  nl.a1.unit31.lesson02.teach.uitlaten:
    title: Promener un animal
    gloss: promener un animal
    note: 'Un verbe à particule séparable : voir la note de grammaire.'
    example_gloss: Je promène le chien tous les jours.
  nl.a1.unit31.lesson02.teach.separable_note:
    title: Uitlaten est un verbe séparable
    gloss: 'Uitlaten est séparable, tout comme opstaan et aankleden d’une leçon précédente : ik laat de hond uit.'
    note: 'C’est exactement le même schéma que pour les verbes séparables de la routine quotidienne : radical + … + particule à la fin.'
  nl.a1.unit31.lesson02.teach.eten_geven:
    title: Donner à manger
    gloss: donner à manger
    example_gloss: Je donne à manger au chat tous les jours.
  nl.a1.unit31.lesson02.teach.spelen_met:
    title: Jouer avec
    gloss: jouer avec
    example_gloss: Sander joue avec son chat.
  nl.a1.unit31.lesson02.teach.uitlaten_phrase:
    title: Je promène le chien tous les jours
    gloss: Je promène le chien tous les jours.
    note: Associe *uitlaten* à *elke dag* (tous les jours), déjà connu d’une unité précédente.
  nl.a1.unit31.lesson02.teach.eten_phrase:
    title: Je donne à manger au chat tous les jours
    gloss: Je donne à manger au chat tous les jours.
    note: Associe *eten geven* à *elke dag*.
  nl.a1.unit31.lesson03.teach.meervoud_note:
    title: 'Pluriel : hond -> honden'
    gloss: 'Pluriel en -en : hond -> honden, dier -> dieren. Après une voyelle brève, la consonne se double : kat -> katten.'
    note: Le pluriel régulier en néerlandais, présenté ici pour la première fois avec des noms d’animaux comme exemples.
  nl.a1.unit31.lesson03.teach.honden_katten:
    title: Les chiens et les chats
    gloss: chiens / chats
    example_gloss:
    - Omar adore les chiens.
    - Fenna adore les chats.
  nl.a1.unit31.lesson03.teach.vissen_vogels:
    title: Les poissons et les oiseaux
    gloss: poissons / oiseaux
    example_gloss:
    - J’adore les poissons.
    - Grand-père adore les oiseaux.
  nl.a1.unit31.lesson03.teach.ik_houd_van_dieren:
    title: J’adore les animaux
    gloss: J’adore les animaux.
    note: Reprend *houden van* de la leçon sur les préférences d’une unité précédente, appliqué ici aux animaux.
  nl.a1.unit31.lesson03.teach.fenna_katten_geen:
    title: Fenna adore les chats, mais n’a pas d’animal de compagnie
    gloss: Fenna adore les chats, mais elle n’a pas d’animal de compagnie.
    note: Cette phrase souligne la différence entre adorer un animal et en avoir un.
  nl.a1.unit31.lesson04.teach.omar_vraagt_huisdier:
    title: Omar demande si Lotte a un animal
    gloss: 'Omar : Tu as un animal de compagnie, Lotte ?'
  nl.a1.unit31.lesson04.teach.lotte_ja_hond:
    title: Lotte a un chien
    gloss: 'Lotte : Oui, j’ai un chien.'
  nl.a1.unit31.lesson04.teach.omar_hoe_ziet_eruit:
    title: Omar demande à quoi il ressemble
    gloss: 'Omar : Il est comment ?'
    note: Reprend la question *Hoe ziet ... eruit?* d’une unité précédente consacrée à l’apparence, cette fois à propos d’un animal.
  nl.a1.unit31.lesson04.teach.lotte_beschrijft:
    title: Lotte décrit son chien
    gloss: 'Lotte : Il a le poil brun et il est petit.'
    note: On réutilise le vocabulaire de la couleur des cheveux et de la taille, étudié pour décrire l’apparence, mais cette fois pour parler du pelage d’un animal.
  nl.a1.unit31.lesson04.teach.pronoun_note:
    title: Hij/hem pour les animaux
    gloss: Hij (il) et hem (lui, le) peuvent aussi s’employer pour un animal, pas seulement pour une personne.
    note: 'Dans ce cours, hij/hem désignait jusqu’ici toujours une personne : cette note signale explicitement l’extension aux animaux.'
  nl.a1.unit31.lesson04.teach.omar_laat_je_uit:
    title: Omar demande si elle le sort
    gloss: 'Omar : Tu le sors tous les jours ?'
  nl.a1.unit31.lesson04.teach.lotte_ja_zorg:
    title: Lotte décrit sa routine
    gloss: 'Lotte : Oui, je le sors tous les jours et je lui donne à manger.'
  nl.a1.unit31.lesson05.teach.tekst:
    title: Omar, Fenna et Sander parlent des animaux
    gloss: 'Omar et Fenna aiment tous les deux les animaux, mais ni l’un ni l’autre n’a d’animal de compagnie. Omar aime les chiens et Fenna aime les chats. Sander, lui, a un animal de compagnie : un chat. Il joue souvent avec son chat et lui donne à manger tous les jours. Et toi, as-tu un animal de compagnie ?'
    note: Ce texte met en contraste le fait d’adorer un animal et celui d’en avoir réellement un.
    glosses:
      houden: adorer
      allebei: tous les deux
      dieren: animaux
      beiden: tous les deux
      huisdier: animal de compagnie
      honden: chiens
      katten: chats
      kat: chat
      speelt: joue
      geeft: donne
      elke: tous les
      eten: nourriture
  nl.a1.unit31.lesson05.teach.sander_speelt:
    title: Sander joue souvent avec son chat
    gloss: Sander joue souvent avec son chat.
    note: Reprend *vaak* (souvent), déjà vu pour les habitudes d’Omar dans une unité précédente.
  nl.a1.unit31.lesson05.teach.ik_houd_geen:
    title: J’adore les chiens. Je n’ai pas d’animal de compagnie.
    gloss: J’adore les chiens. Je n’ai pas d’animal de compagnie.
    note: Un modèle de réponse en deux phrases, prêt à être réutilisé pour l’exercice d’expression écrite de cette unité.
  nl.a1.unit31.lesson06.teach.lotte_vraagt_nina:
    title: Lotte interroge Nina
    gloss: 'Lotte : Nina, toi aussi, tu as un animal de compagnie ?'
  nl.a1.unit31.lesson06.teach.nina_ja_vogel:
    title: Nina a un oiseau qui s’appelle Pico
    gloss: 'Nina : Oui, j’ai un oiseau. Il s’appelle Pico.'
    note: '*Heet* (s’appelle) reprend le verbe de présentation de toute première unité.'
  nl.a1.unit31.lesson06.teach.omar_wat_leuk:
    title: Omar réagit
    gloss: 'Omar : Comme c’est chouette ! Qu’est-ce que tu fais avec lui tous les jours ?'
  nl.a1.unit31.lesson06.teach.nina_geeft_eten:
    title: Nina le nourrit tous les jours
    gloss: 'Nina : Je le nourris tous les jours.'
  nl.a1.unit31.lesson06.teach.omar_houd_ook:
    title: Omar aime aussi les oiseaux
    gloss: 'Omar : J’aime aussi les oiseaux.'
  nl.a1.unit31.lesson06.teach.lotte_afsluiting:
    title: Lotte conclut la conversation
    gloss: 'Lotte : C’est chouette que nous aimions tous les trois les animaux !'
    note: Cette phrase réunit ce que les trois personnages ont dit sur les animaux dans cette unité.
