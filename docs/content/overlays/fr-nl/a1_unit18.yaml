teaching:
  nl.a1.unit18.lesson01.teach.appartement_woonkamer_slaapkamer:
    title: Appartement, salon, chambre
    gloss: l’appartement, le salon, la chambre
    note: '*Het appartement* est un nom neutre ; *de woonkamer* et *de slaapkamer* sont des noms de genre commun.'
    example_gloss:
    - J’ai un appartement.
    - J’ai un salon.
    - J’ai une chambre.
  nl.a1.unit18.lesson01.teach.keuken_badkamer:
    title: Cuisine, salle de bains
    gloss: la cuisine, la salle de bains
    note: '*De keuken* et *de badkamer* sont tous deux des noms de genre commun.'
    example_gloss:
    - J’ai une cuisine.
    - J’ai une salle de bains.
  nl.a1.unit18.lesson01.teach.appartement_utrecht:
    title: Dire que tu as un appartement
    gloss: J’ai un appartement.
    note: '*Hebben* (avoir) est le verbe naturel pour dire quel logement on a, comme « avoir » en français. Il s’agit ici d’un exemple général ; l’appartement d’Omar (à Utrecht) est présenté plus loin dans cette unité.'
  nl.a1.unit18.lesson01.teach.rooms_list:
    title: Énumérer toutes les pièces
    gloss: J’ai un salon, une chambre, une cuisine et une salle de bains.
    note: Cette phrase énumère les quatre pièces du vocabulaire de la leçon, séparées par des virgules, avec *en* (et) devant la dernière.
  nl.a1.unit18.lesson02.teach.hoeveel_kamers:
    title: Demander combien de pièces
    gloss: Combien de pièces as-tu ?
    note: '*Hoeveel* (combien) reprend le modèle de question sur la quantité vu dans les leçons sur les nombres.'
  nl.a1.unit18.lesson02.teach.twee_slaapkamers:
    title: Indiquer un nombre de chambres
    gloss: J’ai deux chambres.
    note: '*Slaapkamers* est le pluriel de *slaapkamer*, formé régulièrement avec -s.'
  nl.a1.unit18.lesson02.teach.drie_kamers:
    title: Indiquer le nombre total de pièces
    gloss: L’appartement a trois pièces.
    note: '*Kamers* est un terme général pour les pièces ; il ne se limite pas aux chambres.'
  nl.a1.unit18.lesson03.teach.balkon_tuin:
    title: Balcon, jardin
    gloss: le balcon, le jardin
    note: '*Het balkon* est neutre ; *de tuin* est un nom de genre commun.'
    example_gloss:
    - Il y a un balcon.
    - Il n’y a pas de jardin.
  nl.a1.unit18.lesson03.teach.er_is_balkon:
    title: Dire que quelque chose existe
    gloss: Il y a un balcon.
    note: '*Er is* est la construction néerlandaise habituelle pour dire l’existence, comparable à « il y a » en français.'
  nl.a1.unit18.lesson03.teach.geen_tuin:
    title: Dire que quelque chose n’existe pas
    gloss: Il n’y a pas de jardin.
    note: '*Geen* nie un nom indéfini : on dit *geen tuin*, et non *niet een tuin*.'
  nl.a1.unit18.lesson04.teach.gezellig:
    title: Cosy
    gloss: cosy
    note: Adjectif néerlandais très courant et bien caractéristique, pour une atmosphère chaleureuse et agréable -- aucun mot français ne le rend exactement.
    example_gloss: L’appartement est petit mais cosy.
  nl.a1.unit18.lesson04.teach.klein_maar_gezellig:
    title: Un modèle de description courant
    gloss: L’appartement est petit mais cosy.
    note: '*Klein maar gezellig* est une façon extrêmement courante et naturelle, en néerlandais, de décrire positivement un logement compact.'
  nl.a1.unit18.lesson04.teach.woonkamer_groot:
    title: Décrire la taille d’une pièce
    gloss: Le salon est grand.
    note: '*Groot* décrit ici une pièce précise, et non tout le logement.'
  nl.a1.unit18.lesson04.teach.keuken_klein:
    title: Décrire la taille d’une autre pièce
    gloss: La cuisine est petite.
    note: Même modèle que *groot* sur la carte précédente, appliqué à une autre pièce avec *klein*.
  nl.a1.unit18.lesson05.teach.advertentie:
    title: Lire une annonce immobilière
    gloss: 'Appartement à Utrecht : une chambre, un salon, une cuisine et une salle de bains. Il y a un balcon, mais pas de jardin. L’appartement est petit mais cosy.'
    note: Repère le nombre de pièces, les éléments présents ou absents et l’impression générale donnée.
    glosses:
      Appartement: appartement
      slaapkamer: chambre
      woonkamer: salon
      keuken: cuisine
      badkamer: salle de bains
      balkon: balcon
      tuin: jardin
      klein: petit
      gezellig: cosy
  nl.a1.unit18.lesson06.teach.lotte_ask:
    title: Lotte s’informe sur l’appartement
    gloss: 'Lotte : Salut Omar, comment est ton nouvel appartement à Utrecht ?'
    note: '*Nieuwe* est la forme fléchie de *nieuw* (nouveau), employée devant un nom.'
  nl.a1.unit18.lesson06.teach.omar_describe:
    title: Omar le décrit
    gloss: 'Omar : Il est petit mais cosy. J’ai une chambre, un salon, une cuisine et une salle de bains.'
    note: 'Cela correspond exactement à l’annonce lue dans la leçon 5 : c’est bien l’appartement d’Omar.'
  nl.a1.unit18.lesson06.teach.lotte_ask_balcony:
    title: Lotte demande s’il y a un balcon
    gloss: 'Lotte : Tu as un balcon ?'
    note: Une question fermée directe qui reprend *heb je ...?* vu dans les unités précédentes.
  nl.a1.unit18.lesson06.teach.omar_balcony_answer:
    title: Omar répond
    gloss: 'Omar : Oui, j’ai un balcon, mais pas de jardin.'
    note: 'Cela correspond à l’annonce de la leçon 5 : un balcon, mais pas de jardin.'
  nl.a1.unit18.lesson06.teach.hij_pronoun_note:
    title: Utiliser hij pour parler d’Omar
    gloss: 'Au lieu de dire Omar, tu peux aussi dire hij : il a un balcon.'
    note: '*Hij* (il) peut remplacer le prénom d’Omar dès qu’il a été présenté dans la conversation.'
  nl.a1.unit18.lesson06.teach.lotte_reaction:
    title: Lotte réagit chaleureusement
    gloss: 'Lotte : Ça a l’air bien ! Je passerai te voir bientôt.'
    note: '*Komen langs* (passer voir) est un verbe à particule séparable ; *langs* se place à la fin de la proposition.'
  nl.a1.unit18.lesson06.teach.omar_welcome:
    title: Omar l’accueille
    gloss: 'Omar : Super, tu es toujours la bienvenue.'
    note: '*Altijd welkom* est une façon chaleureuse et naturelle d’inviter quelqu’un à revenir.'
