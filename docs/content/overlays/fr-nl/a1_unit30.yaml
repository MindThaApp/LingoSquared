course:
  title: Néerlandais A1
  description: 'Néerlandais pour débutants : décrire l’apparence physique d’une personne, avec des impressions de taille et d’âge, la couleur des cheveux et des yeux, la question clé Hoe ziet ... eruit? et la comparaison de l’apparence de deux personnes.'
units:
  nl.a1.unit30.appearance:
    title: Décrire l’apparence physique
lessons:
  nl.a1.unit30.lesson01.lang_klein_oud_jong:
    title: Grand, petit, âgé et jeune
  nl.a1.unit30.lesson02.haar_beschrijven:
    title: Décrire les cheveux
  nl.a1.unit30.lesson03.ogen_en_eruitzien:
    title: Les yeux et demander à quoi ressemble quelqu’un
  nl.a1.unit30.lesson04.taalcafe_nina:
    title: Lotte décrit Nina
  nl.a1.unit30.lesson05.sander_fenna_vergelijken:
    title: Comparer Sander et Fenna
  nl.a1.unit30.lesson06.taalcafe_herkenning:
    title: Omar reconnaît Nina
teaching:
  nl.a1.unit30.lesson01.teach.lang_klein:
    title: Grand et petit
    gloss: grand / petit
    note: '*Lang* décrit une personne grande ; *klein* décrit une personne petite (le même mot sert aussi pour un petit objet ailleurs dans ce cours).'
    example_gloss:
    - Fenna est grande.
    - Sander est petit.
  nl.a1.unit30.lesson01.teach.oud_jong:
    title: Âgé et jeune
    gloss: âgé / jeune
    note: '*Oud* et *jong* décrivent ici une impression générale d’âge, pas un nombre d’années exact.'
    example_gloss:
    - Grand-père est âgé.
    - Omar est jeune.
  nl.a1.unit30.lesson01.teach.oud_note:
    title: 'Oud : un nombre ou une impression'
    gloss: Oud peut désigner un nombre d’années précis, comme dans Hoe oud ben je?, ou une impression générale sans chiffre, comme dans Opa is oud.
    note: Tu connais déjà *oud* pour demander l’âge exact de quelqu’un (*Hoe oud ben je?*). Ici, il décrit l’âge que quelqu’un PARAÎT avoir, sans chiffre.
  nl.a1.unit30.lesson01.teach.fenna_sander_phrase:
    title: Fenna est grande et Sander est petit
    gloss: Fenna est grande et Sander est petit.
    note: Une phrase simple reliée par *en* (et), qui prépare la comparaison directe de la leçon 5.
  nl.a1.unit30.lesson02.teach.haar_noun:
    title: Les cheveux
    gloss: les cheveux
    note: '*Haar* est un mot en het : *het haar*.'
    example_gloss: Omar a les cheveux courts et noirs.
  nl.a1.unit30.lesson02.teach.haar_kleuren:
    title: Blond, châtain et gris
    gloss: blond / châtain / gris
    note: Trois couleurs de cheveux. *Zwart* (noir) a été vu plus tôt pour les vêtements ; on le réutilise ici pour les cheveux.
    example_gloss:
    - Lotte a les cheveux blonds.
    - Sander a les cheveux bruns.
    - Grand-père a les cheveux gris.
  nl.a1.unit30.lesson02.teach.haar_lengte:
    title: Cheveux longs et courts
    gloss: long / court (cheveux)
    note: '*Lang* (long) reprend le mot de taille de la leçon 1, mais décrit ici la longueur des cheveux. *Kort* (court) est nouveau ici.'
    example_gloss:
    - Fenna a les cheveux longs.
    - Sander a les cheveux courts.
  nl.a1.unit30.lesson02.teach.haar_agreement_note:
    title: Haar s’emploie avec un adjectif sans terminaison
    gloss: 'Haar est un mot en het sans article : l’adjectif reste sans terminaison : kort haar, lang haar, blond haar, bruin haar, grijs haar, zwart haar.'
    note: Pas de -e devant *haar* dans cette forme indéfinie sans article ; à comparer avec *ogen* à la leçon 3, qui prend un -e.
  nl.a1.unit30.lesson02.teach.haar_homoniem_note:
    title: 'Haar : deux sens'
    gloss: 'Haar a deux sens : « cheveux » (le nouveau nom de cette leçon) et « son, sa » (le possessif de l’unité 5, par ex. haar moeder). Le contexte indique lequel est visé.'
    note: 'Un véritable homonyme néerlandais : *haar* le nom (cheveux) et *haar* le possessif (son, sa) s’écrivent de la même façon. Le reste de la phrase montre toujours lequel est visé.'
    target_text: 'Haar a deux sens : « cheveux » (le nouveau nom de cette leçon) et « son / sa » (le possessif, par exemple haar moeder). Le contexte te montre duquel il s’agit.'
  nl.a1.unit30.lesson02.teach.omar_kort_zwart:
    title: Omar a les cheveux courts et noirs
    gloss: Omar a les cheveux courts et noirs.
    note: Reprend *zwart* (noir) de l’unité 20 sur les vêtements.
  nl.a1.unit30.lesson02.teach.lotte_lang_blond:
    title: Lotte a de longs cheveux blonds
    gloss: Lotte a de longs cheveux blonds.
    note: Combine le vocabulaire de la longueur et de la couleur de cette leçon dans une phrase naturelle.
  nl.a1.unit30.lesson03.teach.ogen_noun:
    title: Les yeux
    gloss: les yeux
    note: '*Ogen* est le pluriel de *het oog* ; le pluriel prend toujours *de*.'
    example_gloss: Omar a les yeux marron.
  nl.a1.unit30.lesson03.teach.oog_kleuren:
    title: Bleu, marron et vert
    gloss: bleu / marron / vert
    note: '*Blauw* (bleu) a été vu plus tôt pour les vêtements ; *bruin* (marron) vient d’être appris à la leçon 2 pour les cheveux ; *groen* (vert) est nouveau ici.'
    example_gloss:
    - Lotte a les yeux bleus.
    - Sander a les yeux marron.
    - Fenna a les yeux verts.
  nl.a1.unit30.lesson03.teach.ogen_agreement_note:
    title: Ogen prend un -e
    gloss: 'Avec ogen (pluriel), l’adjectif prend un -e supplémentaire : blauwe ogen, bruine ogen, groene ogen.'
    note: 'À comparer avec *haar* (leçon 2), où l’adjectif reste sans terminaison : au pluriel, l’adjectif prend toujours -e, que le nom soit un mot en de ou en het.'
  nl.a1.unit30.lesson03.teach.hoe_ziet_eruit:
    title: Comment est Lotte physiquement ?
    gloss: Comment est Lotte physiquement ?
    note: '*Hoe ziet ... eruit?* est la question centrale de cette unité : réutilise-la pour demander l’apparence de n’importe qui.'
  nl.a1.unit30.lesson03.teach.antwoord_patroon:
    title: Lotte a de longs cheveux blonds et les yeux bleus
    gloss: Lotte a de longs cheveux blonds et les yeux bleus.
    note: Une réponse modèle qui réunit cheveux et yeux dans une seule phrase avec *en*.
  nl.a1.unit30.lesson04.teach.lotte_intro_nina:
    title: Lotte présente Nina
    gloss: 'Lotte : Une nouvelle fille vient au taalcafé. Elle s’appelle Nina.'
    note: '*Er komt* (« il vient ») introduit une nouvelle personne dans la scène.'
  nl.a1.unit30.lesson04.teach.omar_ask_eruit:
    title: Omar demande à quoi elle ressemble
    gloss: 'Omar : D’accord ! Elle est comment ?'
    note: Reprend la question centrale de l’unité, ici avec *ze* (elle) à la place d’un prénom.
  nl.a1.unit30.lesson04.teach.lotte_klein_kort_blond:
    title: Lotte décrit la taille et les cheveux de Nina
    gloss: 'Lotte : Elle est petite et elle a les cheveux courts et blonds.'
    note: Associe *klein* de la leçon 1 et le vocabulaire des cheveux de la leçon 2.
  nl.a1.unit30.lesson04.teach.omar_ask_ogen:
    title: Omar demande comment sont ses yeux
    gloss: 'Omar : Et ses yeux ?'
    note: Ici, *haar* signifie « son, sa, ses » (le possessif de l’unité 5), et non « cheveux » – voir la note sur l’homonyme à la leçon 2.
  nl.a1.unit30.lesson04.teach.lotte_groene_ogen:
    title: Lotte décrit les yeux de Nina
    gloss: 'Lotte : Elle a les yeux verts.'
    note: Reprend *groene ogen* de la leçon 3.
  nl.a1.unit30.lesson04.teach.omar_bedankt_herken:
    title: Omar la reconnaîtra
    gloss: 'Omar : Merci ! Alors je la reconnaîtrai.'
    note: '*Herken ik haar wel* – « je la reconnaîtrai sans problème » – ici, *haar* est de nouveau le pronom « la, elle », et non « cheveux ».'
  nl.a1.unit30.lesson05.teach.vergelijking:
    title: Comparer Sander et Fenna
    gloss: Sander et Fenna sont frère et sœur, mais ils ne se ressemblent pas. Sander est petit, il a les cheveux courts et bruns et les yeux marron. Fenna est plus grande que Sander et elle a de longs cheveux bruns et les yeux verts. Et toi, tu ressembles à quoi ?
    note: Une courte comparaison qui réutilise tous les mots de couleur et de longueur appris jusqu’ici et se termine par la question essentielle de l’unité, adressée au lecteur.
    glosses:
      broer: frère
      zus: sœur
      zien: apparence
      anders: différent
      klein: petit
      kort: petit
      bruin: châtain
      haar: cheveux
      bruine: châtain
      ogen: yeux
      langer: plus grand
      lang: long
      groene: vert
      eruit: (fait partie de « eruit zien » = avoir l’air, paraître)
  nl.a1.unit30.lesson05.teach.comparatief_note:
    title: Réutiliser la structure comparative
    gloss: 'Tu connais déjà ce schéma grâce aux comparaisons : adjectif + er + dan (« que »). Ici, on l’emploie pour des personnes : Fenna est plus grande que Sander.'
    note: Exactement le schéma *adjectif + -er + dan* de l’unité 14 (achat de sacs à dos), appliqué ici à la description de personnes et non d’objets.
  nl.a1.unit30.lesson05.teach.langer_haar:
    title: Fenna a les cheveux plus longs que Sander
    gloss: Fenna a les cheveux plus longs que Sander.
    note: '*Langer* reste sans terminaison devant *haar* (mot en het), selon la même règle d’accord que la leçon 2, même au comparatif.'
  nl.a1.unit30.lesson05.teach.ik_heb_haar:
    title: J’ai les cheveux courts et châtains
    gloss: J’ai les cheveux courts et châtains.
    note: Une phrase modèle à la première personne avec *Ik heb ...*, à réutiliser pour décrire ta propre apparence.
  nl.a1.unit30.lesson06.teach.omar_kijk_is_dat_nina:
    title: Omar repère Nina
    gloss: 'Omar : Regarde, c’est Nina ? Elle a les cheveux courts et blonds et les yeux verts.'
    note: '*Kijk* (regarde) a déjà été employé de la même façon dans le dialogue de l’unité 14.'
  nl.a1.unit30.lesson06.teach.lotte_ja_dat_is_nina:
    title: Lotte confirme
    gloss: 'Lotte : Oui, c’est Nina !'
    note: Une confirmation courte et naturelle.
  nl.a1.unit30.lesson06.teach.nina_ben_jij_omar:
    title: Nina salue Omar
    gloss: 'Nina : Salut, tu es Omar ?'
    note: Une question de salutation simple et informelle, *ben jij ...?*
  nl.a1.unit30.lesson06.teach.omar_leuk_je_te_zien:
    title: Omar salue Nina à son tour
    gloss: 'Omar : Oui ! Ravi de te rencontrer, Nina.'
    note: '*Leuk je te ontmoeten* – la formule habituelle pour une vraie première rencontre (voir unité 1), et non *leuk je te zien*, qui s’emploie pour quelqu’un qu’on connaît déjà.'
  nl.a1.unit30.lesson06.teach.nina_leuk_je_ook:
    title: Nina lui répond
    gloss: 'Nina : Enchantée de faire ta connaissance, moi aussi !'
    note: Clôt le dialogue – Omar a bien reconnu Nina grâce à la description de Lotte.
