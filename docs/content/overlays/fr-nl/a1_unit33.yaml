    title: Qui se déplace comment ?
    gloss: Lotte va au travail en train tous les jours. Omar y va le plus souvent à vélo, mais quand il pleut, il prend aussi le train. Sander préfère conduire. Fenna habite près de son travail et y va à pied. Et toi, comment vas-tu au travail ?
    note: Oppose quatre moyens de se rendre au travail et une condition (la pluie), sur le modèle du texte de l’unité 32 qui compare les sports.
