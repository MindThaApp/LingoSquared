teaching:
  nl.a1.unit03.lesson01.teach.maandag_tot_woensdag:
    title: De lundi à mercredi
    gloss: lundi, mardi, mercredi
    note: En néerlandais, comme en français, les noms des jours de la semaine s'écrivent normalement avec une minuscule.
    example_gloss:
    - Aujourd'hui, c'est lundi.
    - Aujourd'hui, c'est mardi.
    - Aujourd'hui, c'est mercredi.
  nl.a1.unit03.lesson01.teach.donderdag_vrijdag:
    title: Jeudi, vendredi
    gloss: jeudi, vendredi
    note: Donderdag et vrijdag poursuivent la série des jours de la semaine, toujours avec une minuscule.
    example_gloss:
    - Aujourd'hui, c'est jeudi.
    - Le café des langues a lieu vendredi.
  nl.a1.unit03.lesson01.teach.zaterdag_zondag:
    title: Samedi, dimanche
    gloss: Samedi, dimanche
    note: Zaterdag et zondag sont les jours du week-end.
    example_gloss:
    - Aujourd'hui, c'est samedi.
    - Aujourd'hui, c'est dimanche.
  nl.a1.unit03.lesson01.teach.ask_day:
    title: Demander quel jour de la semaine on est
    gloss: Quel jour sommes-nous aujourd’hui ?
    note: Welke dag ... demande le jour de la semaine, pas la date du calendrier.
  nl.a1.unit03.lesson01.teach.today_wednesday:
    title: Dire quel jour on est
    gloss: Aujourd'hui, c'est mercredi.
    note: Le nom du jour garde sa minuscule à l'intérieur de la phrase.
  nl.a1.unit03.lesson01.teach.lowercase_days:
    title: Les jours de la semaine en minuscules
    gloss: 'Les jours ne prennent normalement pas de majuscule : lundi, vendredi.'
    note: Comme en français, le néerlandais n'écrit les noms des jours avec une majuscule qu'en début de phrase.
  nl.a1.unit03.lesson02.teach.jan_mar:
    title: De janvier à mars
    gloss: janvier, février, mars
    note: En néerlandais, comme en français, les noms des mois s'écrivent normalement avec une minuscule.
    example_gloss:
    - Mon anniversaire est en janvier.
    - J'apprends le néerlandais en février.
    - Mon anniversaire est en mars.
  nl.a1.unit03.lesson02.teach.apr_jun:
    title: D'avril à juin
    gloss: avril, mai, juin
    note: Le mot néerlandais mei correspond à « mai » ; juni correspond à « juin ».
    example_gloss:
    - J'apprends le néerlandais en avril.
    - Mon anniversaire est en mai.
    - J'apprends le néerlandais en juin.
  nl.a1.unit03.lesson02.teach.jul_sep:
    title: De juillet à septembre
    gloss: juillet, août, septembre
    note: 'Les mots néerlandais juli et juni se ressemblent beaucoup : fais attention à la différence entre l et n.'
    example_gloss:
    - Mon anniversaire est en juillet.
    - J'apprends le néerlandais en août.
    - Mon anniversaire est en septembre.
  nl.a1.unit03.lesson02.teach.oct_dec:
    title: D'octobre à décembre
    gloss: octobre, novembre, décembre
    note: En néerlandais, oktober s'écrit avec un k, alors qu'en français on écrit « octobre » avec un c.
    example_gloss:
    - J'apprends le néerlandais en octobre.
    - Mon anniversaire est en novembre.
    - J'apprends le néerlandais en décembre.
  nl.a1.unit03.lesson02.teach.year:
    title: L'année
    gloss: l'année
    note: Jaar est le mot utilisé pour une année du calendrier.
    example_gloss: J'apprends le néerlandais cette année.
  nl.a1.unit03.lesson02.teach.lowercase_months:
    title: Les mois en minuscules
    gloss: 'Les mois ne prennent normalement pas de majuscule : avril, septembre.'
    note: Comme en français, les noms des mois s'écrivent en néerlandais avec une minuscule, sauf en début de phrase.
  nl.a1.unit03.lesson03.teach.first_fourth:
    title: Du premier au quatrième
    gloss: '1–4 : le premier, le deuxième, le troisième, le quatrième'
    note: Eerste, tweede et derde sont des formes à apprendre telles quelles ; vierde est formé à partir de vier.
    example_gloss:
    - Nous sommes le 1er avril.
    - Nous sommes le 2 avril.
    - Nous sommes le 3 avril.
    - Nous sommes le 4 avril.
  nl.a1.unit03.lesson03.teach.fifth_eighth:
    title: Du cinquième au huitième
    gloss: '5–8 : le cinquième, le sixième, le septième, le huitième'
    note: Ces formes de dates sont vijfde, zesde, zevende et achtste.
    example_gloss:
    - Nous sommes le 5 avril.
    - Nous sommes le 6 avril.
    - Nous sommes le 7 avril.
    - Nous sommes le 8 avril 2026.
  nl.a1.unit03.lesson03.teach.ninth_twelfth:
    title: Du neuvième au douzième
    gloss: '9–12 : le neuvième, le dixième, le onzième, le douzième'
    note: Ces formes couvrent les dates du début du mois utilisées plus loin dans l'unité.
    example_gloss:
    - Nous sommes le 9 avril.
    - Nous sommes le 10 avril.
    - Nous sommes le 11 avril.
    - Nous sommes le 12 avril.
  nl.a1.unit03.lesson03.teach.thirteenth_nineteenth:
    title: Du treizième au dix-neuvième
    gloss: '13–19 : le treizième, le quatorzième, le quinzième, le seizième, le dix-septième, le dix-huitième, le dix-neuvième'
    note: Ces ordinaux écrits en toutes lettres se terminent par -de.
    example_gloss:
    - Nous sommes le 13 avril.
    - Nous sommes le 14 avril.
    - Nous sommes le 15 avril.
    - Nous sommes le 16 avril.
    - Nous sommes le 17 avril.
    - Nous sommes le 18 avril.
    - Nous sommes le 19 avril.
  nl.a1.unit03.lesson03.teach.twentieth_twenty_fourth:
    title: Du vingtième au vingt-quatrième
    gloss: '20–24 : le vingtième, le vingt et unième, le vingt-deuxième, le vingt-troisième, le vingt-quatrième'
    note: À partir de twintig, ces ordinaux se terminent par -ste et s'écrivent en un seul mot.
    example_gloss:
    - Nous sommes le 20 avril.
    - Le livre doit être rendu le 21 avril.
    - Nous sommes le 22 avril.
    - Nous sommes le 23 avril.
    - Nous sommes le 24 avril.
  nl.a1.unit03.lesson03.teach.twenty_fifth_twenty_ninth:
    title: Du vingt-cinquième au vingt-neuvième
    gloss: '25–29 : le vingt-cinquième, le vingt-sixième, le vingt-septième, le vingt-huitième, le vingt-neuvième'
    note: Ces ordinaux composés se terminent par -ste et s'écrivent en un seul mot.
    example_gloss:
    - Nous sommes le 25 avril.
    - Nous sommes le 26 avril.
    - Nous sommes le 27 avril.
    - Nous sommes le 28 avril.
    - Nous sommes le 29 avril.
  nl.a1.unit03.lesson03.teach.thirtieth_thirty_first:
    title: Le trentième et le trente et unième
    gloss: '30–31 : le trentième, le trente et unième'
    note: Ce sont les deux derniers numéros de jour possibles dans un mois.
    example_gloss:
    - Nous sommes le 30 avril.
    - Nous sommes le 31 décembre.
  nl.a1.unit03.lesson03.teach.spoken_date:
    title: Dire une date avec un ordinal
    gloss: le 3 avril — le trois avril
    note: Cette unité présente l'ordinal quand le numéro du jour se dit en toutes lettres ; en néerlandais, le jour se place avant le mois, comme en français.
  nl.a1.unit03.lesson03.teach.on_date:
    title: Pour situer une date
    gloss: le 3 avril — le trois avril
    note: Avec un chiffre écrit, on dit op 3 april ; quand l'ordinal est écrit en toutes lettres, on dit op de derde april.
  nl.a1.unit03.lesson04.teach.ask_date:
    title: Demander la date du calendrier
    gloss: Quelle est la date aujourd'hui ?
    note: Welke datum ... demande explicitement la date du calendrier.
  nl.a1.unit03.lesson04.teach.ask_which_date:
    title: Demander quel jour du mois on est
    gloss: Quel jour du mois sommes-nous aujourd'hui ?
    note: De hoeveelste ... est une façon courante, à l'oral, de demander le numéro du jour.
  nl.a1.unit03.lesson04.teach.date_answer:
    title: Donner une date complète
    gloss: Nous sommes le 3 avril 2026.
    note: Comme en français, l'ordre des dates en néerlandais est jour–mois–année, et april garde sa minuscule.
  nl.a1.unit03.lesson04.teach.date_words:
    title: Donner le jour sous forme d'ordinal
    gloss: Nous sommes le 3 avril.
    note: 'L''ordinal écrit en toutes lettres s''accompagne de de : de derde april.'
  nl.a1.unit03.lesson04.teach.written_order:
    title: L'ordre jour–mois–année
    gloss: 'jour–mois–année : 3 avril 2026 ou 3-4-2026'
    note: 'La forme numérique n’est pas du type mois-jour-année : 3-4-2026 signifie 3 avril 2026.'
  nl.a1.unit03.lesson04.teach.day_and_date:
    title: Associer jour de la semaine et date
    gloss: Aujourd’hui, nous sommes vendredi 10 avril.
    note: Vrijdag et april s’écrivent tous deux avec une minuscule au milieu d’une phrase. Le 10 avril 2026 tombe bien un vendredi.
  nl.a1.unit03.lesson05.teach.when:
    title: Quand
    gloss: quand
    note: Wanneer sert à demander à quelle heure ou à quelle date quelque chose a lieu.
    example_gloss: Quand a lieu le café des langues ?
  nl.a1.unit03.lesson05.teach.book:
    title: Livre
    gloss: le livre
    note: Ici, boek désigne un livre de bibliothèque.
    example_gloss: J’ai le livre.
  nl.a1.unit03.lesson05.teach.due_date:
    title: Date de retour
    gloss: la date de retour
    note: Une inleverdatum est la date avant laquelle il faut rendre quelque chose.
    example_gloss: Quelle est la date de retour du livre ?
  nl.a1.unit03.lesson05.teach.ask_due:
    title: Demander quand rendre un livre
    gloss: Pour quand faut-il rendre le livre ?
    note: Moet ... terug est une façon simple et naturelle de demander quand il faut rendre un objet emprunté.
  nl.a1.unit03.lesson05.teach.due_answer:
    title: Donner la date de retour
    gloss: Le 21 avril.
    note: La réponse courte se construit avec op, suivi du jour et du mois en minuscules.
  nl.a1.unit03.lesson05.teach.due_words:
    title: Dire la date de retour en toutes lettres
    gloss: Le livre doit être rendu le vingt et un avril.
    note: Quand l’ordinal est écrit en toutes lettres, il faut mettre de après op.
  nl.a1.unit03.lesson05.teach.label:
    title: Lire une étiquette de date de retour
    gloss: 'Date de retour : 21-4-2026'
    note: Cette date numérique suit l’ordre jour-mois-année.
  nl.a1.unit03.lesson06.teach.dialogue_day:
    title: Lotte demande le jour de la semaine
    gloss: 'Lotte : Quel jour sommes-nous aujourd’hui ? Omar : Nous sommes mercredi.'
    note: La réponse donne un jour de la semaine.
  nl.a1.unit03.lesson06.teach.dialogue_date:
    title: Lotte demande la date
    gloss: 'Lotte : Et quelle est la date ? Omar : Nous sommes le 8 avril 2026.'
    note: 'En néerlandais parlé, on répond avec l’ordinal : de achtste. Le 8 avril 2026 tombe bien un mercredi, comme dans la réplique précédente.'
  nl.a1.unit03.lesson06.teach.next:
    title: Prochain
    gloss: prochain
    note: Volgende désigne l’occurrence suivante.
    example_gloss: Quand a lieu le prochain café des langues ?
  nl.a1.unit03.lesson06.teach.dialogue_next:
    title: Demander la date de la prochaine rencontre
    gloss: 'Lotte : Quand a lieu le prochain café des langues ? Omar : Le vendredi 10 avril.'
    note: La réponse combine op, un jour de la semaine en minuscules, le numéro du jour et un mois en minuscules. Le 10 avril 2026 tombe bien un vendredi, deux jours après le 8.
  nl.a1.unit03.lesson06.teach.dialogue_close:
    title: Terminer l’échange
    gloss: 'Lotte : Bien, à vendredi ! Omar : À vendredi !'
    note: Tot vrijdag indique le jour de la prochaine rencontre.
