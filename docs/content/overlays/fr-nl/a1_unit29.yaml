course:
  title: Néerlandais A1
  description: 'Néerlandais pour débutants pour parler des loisirs : vocabulaire des loisirs, expressions de fréquence, demander et dire ce que l’on fait pendant son temps libre, et comparer les loisirs de deux personnes.'
