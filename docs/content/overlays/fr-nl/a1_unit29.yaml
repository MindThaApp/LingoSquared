teaching:
  nl.a1.unit29.lesson01.teach.hobbies_set1:
    title: Lire, faire du sport, cuisiner
    gloss: lire, faire de l’exercice / du sport, cuisiner
    note: 'Trois verbes de loisirs courants : *lezen* (lire), *sporten* (faire du sport) et *koken* (cuisiner).'
    example_gloss:
    - J’aime lire un livre.
    - Je fais du sport le samedi.
    - J’aime cuisiner pour des amis.
  nl.a1.unit29.lesson01.teach.vrije_tijd:
    title: Le temps libre
    gloss: temps libre
    note: '*De vrije tijd* est un nom de genre commun : *de vrije tijd*. C’est l’expression clé pour parler de loisirs.'
    example_gloss: Pendant mon temps libre, j’aime lire.
  nl.a1.unit29.lesson01.teach.in_vrije_tijd:
    title: Dire ce que tu fais pendant ton temps libre
    gloss: Pendant mon temps libre, j’aime lire.
    note: '*Lees* est la première personne du singulier de *lezen* (lire).'
  nl.a1.unit29.lesson02.teach.hobbies_set2:
    title: Musique, dessin, jeux vidéo
    gloss: écouter de la musique, dessiner, jouer aux jeux vidéo
    note: 'Trois autres verbes de loisirs : *muziek luisteren* (écouter de la musique), *tekenen* (dessiner) et *gamen* (jouer aux jeux vidéo), un verbe néerlandais emprunté à l’anglais.'
    example_gloss:
    - J’aime écouter de la musique.
    - Je dessine souvent.
    - J’aime jouer aux jeux vidéo avec des amis.
  nl.a1.unit29.lesson02.teach.luister_muziek:
    title: Dire que tu aimes écouter de la musique
    gloss: J’aime écouter de la musique.
    note: Avec *luisteren* (écouter), on met toujours *naar* devant le complément.
  nl.a1.unit29.lesson02.teach.game_vrienden:
    title: Dire que tu aimes jouer aux jeux vidéo avec des amis
    gloss: J’aime jouer aux jeux vidéo avec des amis.
    note: '*Met vrienden* (avec des amis) reprend *vrienden* de la leçon 1.'
  nl.a1.unit29.lesson03.teach.frequency_set1:
    title: Toujours, souvent, parfois, jamais
    gloss: toujours, souvent, parfois, jamais
    note: Les quatre adverbes de fréquence de base. *Vaak* est déjà apparu à l’unité 5 dans *Zie je hem vaak?* ; les trois autres sont nouveaux ici.
    example_gloss:
    - Je fais toujours du sport le samedi.
    - Je lis souvent un livre.
    - Je dessine parfois.
    - Je ne joue jamais aux jeux vidéo.
  nl.a1.unit29.lesson03.teach.frequency_set2:
    title: Chaque semaine, chaque week-end
    gloss: chaque semaine, chaque week-end
    note: '*Elke week* et *elk weekend* signifient tous deux « chaque », mais la forme change selon le genre du nom – voir la fiche suivante.'
    example_gloss:
    - Je cuisine pour des amis chaque semaine.
    - Je fais du sport chaque week-end.
  nl.a1.unit29.lesson03.teach.elke_elk_grammar:
    title: Elke ou elk
    gloss: Avec les mots en de comme week, on utilise elke. Avec les mots en het comme weekend, on utilise elk.
    note: '*Week* est un mot en de (*de week*), donc il prend *elke* ; *weekend* est un mot en het (*het weekend*), donc il prend *elk* – c’est le même principe d’accord de/het que *de rekening* et *het wisselgeld* à l’unité 23.'
  nl.a1.unit29.lesson03.teach.vrije_tijd_vraag:
    title: Poser une question sur le temps libre
    gloss: Que fais-tu pendant ton temps libre ?
    note: 'C’est la question centrale de cette unité : réutilise-la pour interroger quelqu’un sur ses loisirs.'
  nl.a1.unit29.lesson04.teach.lotte_callback:
    title: Lotte aborde les loisirs
    gloss: 'Lotte : Nous marchons souvent ensemble. Mais toi, Omar, que fais-tu d’autre pendant ton temps libre ?'
    note: '*We wandelen vaak samen* renvoie à l’unité 13, où Lotte et Omar disaient tous deux aimer *wandelen*.'
  nl.a1.unit29.lesson04.teach.omar_cook_sport:
    title: Les loisirs d’Omar
    gloss: 'Omar : J’aime cuisiner, même à la maison. Et je fais souvent du sport.'
    note: '*Ook thuis* (aussi à la maison) montre qu’Omar cuisine par plaisir, pas seulement dans son travail au restaurant.'
  nl.a1.unit29.lesson04.teach.lotte_surprised:
    title: Lotte est surprise
    gloss: 'Lotte : Tu cuisines aussi à la maison ? Tu cuisines déjà toute la journée au travail !'
    note: '*Al de hele dag* (« déjà toute la journée ») souligne à quel point Omar cuisine déjà au travail.'
  nl.a1.unit29.lesson04.teach.omar_relaxing:
    title: Omar explique
    gloss: 'Omar : Oui, mais je trouve que cuisiner est relaxant. Et toi, qu’est-ce que tu aimes faire ?'
    note: '*Koken vind ik ontspannend* place le complément *koken* en tête de phrase pour l’insistance, littéralement : « cuisiner, je trouve ça relaxant ».'
  nl.a1.unit29.lesson04.teach.lotte_reads_music:
    title: Les loisirs de Lotte
    gloss: 'Lotte : J’aime lire et j’écoute souvent de la musique.'
    note: Deux verbes de loisirs des leçons 01-02 sont réunis dans une seule phrase avec *en* (et).
  nl.a1.unit29.lesson04.teach.omar_ask_game:
    title: Omar demande si elle joue aux jeux vidéo
    gloss: 'Omar : Tu joues aussi aux jeux vidéo ?'
    note: Une courte question fermée avec *gamen*, vu à la leçon 02.
  nl.a1.unit29.lesson04.teach.lotte_no_game_draw:
    title: Lotte répond
    gloss: 'Lotte : Non, je ne joue jamais aux jeux vidéo. Mais je dessine parfois !'
    note: '*Nooit* (jamais) et *soms* (parfois), vus à la leçon 03, sont opposés dans une même réponse.'
  nl.a1.unit29.lesson05.teach.vergelijking:
    title: Comparer des loisirs
    gloss: Omar et moi, nous nous promenons souvent ensemble. Mais nous avons aussi d’autres loisirs. Omar aime cuisiner, même à la maison, et il fait souvent du sport. J’aime lire et j’écoute souvent de la musique. Je dessine parfois, mais je ne joue jamais aux jeux vidéo. Et toi, qu’est-ce que tu aimes faire pendant ton temps libre ?
    note: Le message de Lotte reprend des faits de la leçon 04 et se termine par la question centrale de l’unité.
    glosses:
      wandelen: se promener
      vaak: souvent
      samen: ensemble
      andere: autre
      kookt: cuisine
      graag: aime
      thuis: à la maison
      sport: fait du sport
      lees: lire
      luister: écouter
      muziek: musique
      teken: dessiner
      soms: parfois
      game: jouer aux jeux vidéo
      nooit: jamais
      vrije: libre
      tijd: temps
  nl.a1.unit29.lesson06.teach.omar_ask_weekend:
    title: Omar demande ce qu’elle fait ce week-end
    gloss: 'Omar : Qu’est-ce que tu fais ce week-end ?'
    note: '*Dit weekend* (ce week-end) reprend l’expression de temps de l’unité 19.'
  nl.a1.unit29.lesson06.teach.lotte_unsure:
    title: Lotte hésite
    gloss: 'Lotte : Je ne sais pas encore. J’aime lire, mais j’ai aussi envie de sortir.'
    note: '*Naar buiten* (dehors, littéralement « vers l’extérieur ») est une façon courante de dire qu’on veut sortir de chez soi.'
  nl.a1.unit29.lesson06.teach.omar_suggest_walk_cook:
    title: Omar propose un programme
    gloss: 'Omar : On se promène ensemble ? Après, je cuisine pour nous.'
    note: '*Daarna* (après) reprend le mot de séquence *eerst, dan, daarna* de l’unité 10.'
  nl.a1.unit29.lesson06.teach.lotte_agree_both:
    title: Lotte accepte
    gloss: 'Lotte : Bonne idée ! J’aime autant me promener que cuisiner.'
    note: '*Allebei* (les deux) montre que Lotte aime les deux choses de la même façon, sans préférer l’une à l’autre.'
  nl.a1.unit29.lesson06.teach.omar_confirm_saturday:
    title: Omar confirme
    gloss: 'Omar : Parfait. Alors on se voit samedi !'
    note: Une phrase amicale pour conclure et confirmer le programme de *zaterdag* (samedi).
