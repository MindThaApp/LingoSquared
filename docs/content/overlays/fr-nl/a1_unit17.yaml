teaching:
  nl.a1.unit17.lesson01.teach.wat_doe_je:
    title: Demander le métier de quelqu’un
    gloss: Quel travail fais-tu ?
    note: Une manière courante et décontractée de demander quel est le métier de quelqu’un.
  nl.a1.unit17.lesson01.teach.beroep_kok:
    title: Métier / cuisinier
    gloss: le métier ; cuisinier
    note: '*Het beroep* (le métier) est un nom neutre. *Kok* (cuisinier) est un nom de métier courant, valable pour tous les genres : *een kok*, *de kok*.'
    example_gloss:
    - Quel est ton métier ?
    - Je travaille comme cuisinier.
  nl.a1.unit17.lesson01.teach.werk_als_kok:
    title: Dire que tu es cuisinier
    gloss: Je travaille comme cuisinier.
    note: '*Werken als* + nom de métier est la structure habituelle pour indiquer son métier, sans article devant le nom du métier.'
  nl.a1.unit17.lesson01.teach.verpleegkundige:
    title: Infirmier / infirmière
    gloss: infirmière
    note: Le terme moderne et neutre pour cette profession, employé pour tous les genres.
    example_gloss: Je travaille comme infirmier.
  nl.a1.unit17.lesson01.teach.werk_als_verpleegkundige:
    title: Dire que tu es infirmier
    gloss: Je travaille comme infirmier.
    note: Même structure *werken als* que pour *kok*.
  nl.a1.unit17.lesson02.teach.waar_werk_je:
    title: Demander où quelqu’un travaille
    gloss: Où travailles-tu ?
    note: Une question de suite directe après *Wat doe je voor werk?*
  nl.a1.unit17.lesson02.teach.werk_restaurant:
    title: Travailler dans un restaurant
    gloss: Je travaille dans un restaurant.
    note: '*Een restaurant* prend l’article indéfini ici, car il s’agit d’un restaurant parmi d’autres.'
  nl.a1.unit17.lesson02.teach.ziekenhuis:
    title: L’hôpital
    gloss: l’hôpital
    note: 'Un nom neutre : *het ziekenhuis*.'
    example_gloss: Je travaille à l’hôpital.
  nl.a1.unit17.lesson02.teach.werk_ziekenhuis:
    title: Travailler à l’hôpital
    gloss: Je travaille à l’hôpital.
    note: '*Het ziekenhuis* prend l’article défini : le néerlandais le traite comme une institution précise et connue, comme le français avec « à l’hôpital ».'
  nl.a1.unit17.lesson02.teach.kantoor:
    title: Travailler dans un bureau
    gloss: Certaines personnes travaillent au bureau.
    note: '*Op kantoor* (au bureau) est une expression figée sans article, contrairement à *in een restaurant* / *in het ziekenhuis*.'
  nl.a1.unit17.lesson03.teach.begin_negen:
    title: L’heure de début
    gloss: Je commence à neuf heures.
    note: '*Begin* est la forme de *beginnen* (commencer) à la première personne (ik), avec le même schéma pour l’heure qu’à l’unité 4.'
  nl.a1.unit17.lesson03.teach.maandag_vrijdag:
    title: Les jours de travail
    gloss: Je travaille du lundi au vendredi.
    note: '*Van... tot...* reprend la structure vue à l’unité 3 pour indiquer une période de jours de la semaine.'
  nl.a1.unit17.lesson03.teach.pauze:
    title: La pause
    gloss: la pause
    note: 'Un nom de genre commun : *de pauze*.'
    example_gloss: J’ai une pause à midi.
  nl.a1.unit17.lesson03.teach.heb_pauze:
    title: Avoir une pause
    gloss: J’ai une pause à midi.
    note: '*Pauze hebben* (avoir une pause) est l’expression naturelle et figée.'
  nl.a1.unit17.lesson03.teach.stop_vijf:
    title: L’heure de fin
    gloss: Je termine à cinq heures.
    note: '*Stop* est la forme de *stoppen* (s’arrêter, finir) à la première personne (ik).'
  nl.a1.unit17.lesson03.teach.begin_en_stop:
    title: Une journée de travail complète
    gloss: Je commence à neuf heures et je termine à cinq heures.
    note: Associe *begin* et *stop* avec *en* dans une seule phrase qui décrit toute une journée de travail.
  nl.a1.unit17.lesson04.teach.third_person_rule:
    title: Les terminaisons verbales à la troisième personne
    gloss: 'Avec « il » ou « elle », le verbe prend généralement un -t supplémentaire : il travaille, elle travaille.'
    note: '*Werk* devient *werkt* avec *hij*/*zij* : c’est la règle régulière du présent néerlandais à la troisième personne. En français, cette différence s’entend rarement à l’oral, mais en néerlandais le -t est toujours prononcé.'
  nl.a1.unit17.lesson04.teach.lotte_werkt:
    title: Le métier de Lotte
    gloss: Lotte travaille comme infirmière.
    note: '*Werkt* (et non *werk*) parce que le sujet est un prénom à la troisième personne, et non *ik*.'
  nl.a1.unit17.lesson04.teach.omar_werkt:
    title: Le métier d’Omar
    gloss: Omar travaille comme cuisinier.
    note: Même terminaison -t à la troisième personne que dans *Lotte werkt als verpleegkundige*.
  nl.a1.unit17.lesson04.teach.pronouns_workplaces:
    title: Utiliser les pronoms
    gloss: Elle travaille à l’hôpital. Il travaille dans un restaurant.
    note: '*Zij*/*hij* remplacent les prénoms Lotte/Omar, mais le verbe garde la même forme en -t.'
  nl.a1.unit17.lesson05.teach.profiel:
    title: Lis deux profils professionnels
    gloss: Lotte travaille comme infirmière à l’hôpital. Elle commence à sept heures et travaille du lundi au vendredi. Omar travaille comme cuisinier dans un restaurant. Il commence à onze heures et a sa pause à seize heures.
    note: Repère séparément le métier, le lieu de travail et l’horaire de chaque personne.
    glosses:
      werkt: travaille
      verpleegkundige: infirmière
      ziekenhuis: hôpital
      begint: commence
      zeven: sept
      maandag: Lundi
      vrijdag: Vendredi
      kok: cuisinier / chef
      restaurant: restaurant
      elf: onze
      pauze: pause
  nl.a1.unit17.lesson06.teach.lotte_curious:
    title: Lotte pose une question sur le travail
    gloss: 'Lotte : Salut Omar ! Je suis curieuse : qu’est-ce que tu fais comme travail, au fait ?'
    note: '*Eigenlijk* (au fait, en réalité) adoucit la question et lui donne un ton de curiosité amicale plutôt que d’interrogatoire.'
  nl.a1.unit17.lesson06.teach.omar_answer:
    title: Omar répond
    gloss: 'Omar : Je travaille comme cuisinier dans un restaurant. Et toi ?'
    note: '*En jij?* est la manière habituelle de retourner la question à l’autre personne.'
  nl.a1.unit17.lesson06.teach.lotte_answer:
    title: Lotte répond
    gloss: 'Lotte : Je travaille comme infirmière à l’hôpital.'
    note: Reprend le métier et le lieu de travail déjà vus dans lesson01/lesson02/lesson05.
  nl.a1.unit17.lesson06.teach.omar_ask_hours:
    title: Omar demande les horaires
    gloss: 'Omar : Tu fais quels horaires ?'
    note: '*Uren maken* (littéralement « faire des heures ») est une expression figée pour parler de ses horaires de travail.'
  nl.a1.unit17.lesson06.teach.lotte_hours:
    title: Lotte indique ses horaires
    gloss: 'Lotte : Je commence à sept heures et je travaille du lundi au vendredi.'
    note: Reprend l’horaire déjà présenté dans le profil de lecture de lesson05.
  nl.a1.unit17.lesson06.teach.omar_reaction:
    title: Omar réagit
    gloss: 'Omar : C’est tôt ! Moi, je commence plus tard, à onze heures.'
    note: Reprend l’heure de début d’Omar déjà présentée dans lesson05.
  nl.a1.unit17.lesson06.teach.lotte_closing:
    title: Lotte conclut le sujet
    gloss: 'Lotte : Chaque métier a son propre rythme, je pense.'
    note: 'Une remarque finale naturelle et pleine de réflexion : il suffit de la comprendre, inutile de la reproduire exactement.'
