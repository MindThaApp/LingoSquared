teaching:
  nl.a1.unit13.lesson01.teach.lekker_vinden:
    title: Lekker vinden pour la nourriture et les boissons
    gloss: Pour la nourriture et les boissons, le néerlandais emploie souvent lekker vinden.
    note: Le verbe français « aimer » ne correspond pas à une seule expression néerlandaise. Pour un goût, on dit *Ik vind ... lekker*, littéralement « je trouve ça bon ».
  nl.a1.unit13.lesson01.teach.koffie:
    title: Aimer le café
    gloss: J’aime le café.
    note: La nourriture ou la boisson se place entre *vind* et *lekker*.
  nl.a1.unit13.lesson01.teach.thee:
    title: Ne pas aimer le thé
    gloss: Je n’aime pas le thé.
    note: Place *niet* avant *lekker* pour dire que tu n’aimes pas le goût.
  nl.a1.unit13.lesson01.teach.question:
    title: Demander si on aime un goût
    gloss: Tu aimes la soupe à la tomate ?
    note: Dans la question familière, *vind* se place avant *je*. Cela prolonge le registre *jij/je* du cours.
  nl.a1.unit13.lesson02.teach.leuk_vinden:
    title: Leuk vinden pour les activités
    gloss: 'Pour les activités, le néerlandais emploie souvent leuk vinden : j’aime faire du vélo.'
    note: Utilise *leuk*, et non *lekker*, pour une activité comme faire du vélo.
  nl.a1.unit13.lesson02.teach.walking:
    title: Aimer la marche
    gloss: J’aime marcher.
    note: L’activité *wandelen* se place entre *vind* et *leuk*.
  nl.a1.unit13.lesson02.teach.dislike:
    title: Ne pas aimer faire les magasins
    gloss: Je n’aime pas faire les magasins.
    note: '*Niet* se place avant *leuk*.'
  nl.a1.unit13.lesson02.teach.activity_question:
    title: Demander quelles activités on aime
    gloss: Qu’aimes-tu faire ?
    note: '*Wat vind je leuk om te doen?* est une question générale naturelle sur les activités préférées de quelqu’un.'
  nl.a1.unit13.lesson03.teach.strong_like:
    title: Une appréciation plus forte ou générale
    gloss: Houden van exprime une préférence forte ou générale.
    note: Emploie-le avec parcimonie. Pour réagir normalement à un plat ou à une activité précise, on utilise plus naturellement *lekker vinden* ou *leuk vinden*.
  nl.a1.unit13.lesson03.teach.music:
    title: Être passionné de musique
    gloss: J’adore la musique / J’aime beaucoup la musique.
    note: '*Houd* est la forme de *houden* avec *ik* ; *van* le suit.'
  nl.a1.unit13.lesson03.teach.films:
    title: Ne pas aimer les films
    gloss: Je n’aime pas les films.
    note: À la forme négative, *niet* se place entre *houd* et *van*.
  nl.a1.unit13.lesson03.teach.contrast:
    title: Choisir l’expression naturelle
    gloss: 'Pour un goût ordinaire, dis aussi : J’aime le café. Pour une activité : J’aime marcher.'
    note: Ne traduis pas mécaniquement chaque « aimer » français par *houden van*.
  nl.a1.unit13.lesson04.teach.choice_question:
    title: Proposer deux options
    gloss: Tu veux du café ou du thé ?
    note: '*Wil je ... of ...?* demande à l’autre personne de choisir.'
  nl.a1.unit13.lesson04.teach.want_prefer:
    title: Dire ce que l’on préfère prendre
    gloss: Je préfère du thé.
    note: Dans ce schéma de choix courant, *liever* suit *wil*.
  nl.a1.unit13.lesson04.teach.have_prefer:
    title: Préférer un objet
    gloss: Je préfère le pull bleu.
    note: '*Ik heb liever ...* est aussi naturel pour choisir un objet plutôt qu’un autre.'
  nl.a1.unit13.lesson04.teach.liever_note:
    title: Liever indique l’option préférée
    gloss: Liever montre que tu choisis une option plutôt qu’une autre.
    note: La comparaison peut rester implicite quand les deux choix sont clairs dans la conversation.
  nl.a1.unit13.lesson05.teach.message:
    title: Lire plusieurs préférences
    gloss: Salut Lotte, j’aime bien le film, mais Omar n’aime pas les films. Il préférerait aller au parc. J’aime aussi marcher.
    note: Repère qui aime le film, qui refuse les films et quelle autre option Omar choisit.
    glosses:
      Hoi: salut
      vind: aimer / trouver
      film: film
      leuk: agréable / sympa
      maar: mais
      houdt: aime (houdt van = aime)
      films: films
      wil: veut
      liever: plutôt / préfère
      park: parc
      wandelen: la marche
  nl.a1.unit13.lesson06.teach.food_question:
    title: Lotte propose deux plats
    gloss: 'Lotte : Qu’est-ce que tu veux manger, Omar ? Tu veux du pain ou de la soupe à la tomate ?'
    note: La deuxième question présente les deux choix.
  nl.a1.unit13.lesson06.teach.omar_choice:
    title: Omar choisit la soupe
    gloss: 'Omar : Je préfère de la soupe à la tomate. J’aime la soupe à la tomate. Et toi ?'
    note: Omar fait d’abord un choix avec *liever*, puis l’explique comme un goût avec *lekker*.
  nl.a1.unit13.lesson06.teach.lotte_choice:
    title: Lotte choisit le pain
    gloss: 'Lotte : Je préfère le pain. Je n’aime pas trop la soupe à la tomate.'
    note: '*Niet zo lekker* atténue la négation et est naturel dans une conversation amicale.'
  nl.a1.unit13.lesson06.teach.activity:
    title: Choisir quoi faire ensuite
    gloss: 'Omar : Qu’est-ce que tu veux faire après le repas ? Lotte : J’aime marcher.'
    note: '*Leuk* qualifie l’activité *wandelen*.'
  nl.a1.unit13.lesson06.teach.plan:
    title: Ils partagent une préférence
    gloss: 'Omar : Moi aussi. J’adore marcher. On va au parc ? Lotte : Bonne idée.'
    note: Cela reprend le langage familier pour faire des projets vu dans l’unité 11.
