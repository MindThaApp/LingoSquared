course:
  title: Néerlandais A1
  description: 'Néerlandais pour débutants : proposer, accepter, refuser, fixer un rendez-vous, lire et écrire des projets simples.'
units:
  nl.a1.unit11.plans:
    title: Organiser des projets simples
lessons:
  nl.a1.unit11.lesson01.een_activiteit_voorstellen:
    title: Proposer une activité
  nl.a1.unit11.lesson02.ja_of_nee:
    title: Accepter ou refuser une proposition
  nl.a1.unit11.lesson03.dag_en_tijd_afspreken:
    title: Se mettre d’accord sur un jour et une heure
  nl.a1.unit11.lesson04.een_bericht_lezen:
    title: Lire une invitation
  nl.a1.unit11.lesson05.een_plan_schrijven:
    title: Écrire et confirmer un projet
  nl.a1.unit11.lesson06.lotte_en_omar_maken_een_plan:
    title: Lotte et Omar font un projet
teaching:
  nl.a1.unit11.lesson01.teach.samen:
    title: Ensemble
    gloss: ensemble
    note: '*Samen* montre que les personnes font l’activité ensemble.'
    example_gloss: On prend un café ensemble ?
  nl.a1.unit11.lesson01.teach.koffie_drinken:
    title: Prendre un café
    gloss: prendre un café
    note: Le néerlandais dit littéralement *koffie drinken*, « boire du café » (là où le français dit plutôt « prendre un café »).
  nl.a1.unit11.lesson01.teach.naar_de_film:
    title: Aller voir un film
    gloss: aller voir un film
    note: '*Naar de film gaan* est une façon courante de dire qu’on va au cinéma sans introduire un nouveau mot de lieu.'
  nl.a1.unit11.lesson01.teach.zullen_we:
    title: On prend un café ?
    gloss: On prend un café ?
    note: '*Zullen we ...?* est la structure néerlandaise habituelle pour proposer une activité à faire ensemble.'
  nl.a1.unit11.lesson01.teach.zullen_note:
    title: Utiliser Zullen we
    gloss: Zullen we + activité ? est la façon habituelle de proposer de faire quelque chose ensemble.
    note: 'Place l’activité après *we* et le verbe à la fin : *Zullen we koffie drinken?*'
  nl.a1.unit11.lesson01.teach.zin_om:
    title: Ça te dit d’aller voir un film ?
    gloss: Ça te dit d’aller voir un film ?
    note: '*Heb je zin om ...?* demande de façon informelle si l’autre personne a envie de faire une activité. Ici, utilise *te* devant *gaan*.'
  nl.a1.unit11.lesson02.teach.ja_leuk:
    title: Oui, super !
    gloss: Oui, super !
    note: '*Ja, leuk!* est une acceptation brève et enthousiaste.'
  nl.a1.unit11.lesson02.teach.goed_idee:
    title: Bonne idée
    gloss: Bonne idée !
    note: '*Goed idee!* accepte la proposition en la jugeant positivement.'
  nl.a1.unit11.lesson02.teach.goed_plan:
    title: C’est un bon plan
    gloss: C’est un bon plan.
    note: C’est une réponse positive un peu plus développée.
  nl.a1.unit11.lesson02.teach.sorry_reason:
    title: Refuser en donnant une raison
    gloss: Désolé, je ne peux pas parce que je travaille.
    note: '*Sorry* adoucit le refus, et *want* introduit la brève raison.'
  nl.a1.unit11.lesson02.teach.no_time:
    title: Je n’ai pas le temps
    gloss: Je n’ai pas le temps.
    note: '*Ik heb geen tijd* est une raison directe mais courante pour refuser.'
  nl.a1.unit11.lesson02.teach.polite_decline:
    title: Refuser aimablement
    gloss: Sorry + ik kan niet + une courte raison rendent un refus aimable.
    note: Dans une conversation, il n’est pas obligatoire de donner une raison, mais cela rend cette formule pratique et polie.
  nl.a1.unit11.lesson03.teach.afspreken:
    title: Fixer un rendez-vous
    gloss: convenir de se retrouver
    note: '*Afspreken* s’écrit en un seul mot après *Zullen we*. Dans *We spreken vrijdag af*, il se sépare en *spreken* et *af*.'
    example_gloss: On se retrouve vendredi à 2 h 30 ?
  nl.a1.unit11.lesson03.teach.friday_half_three:
    title: Se retrouver vendredi à deux heures et demie
    gloss: On se retrouve vendredi à 2 h 30 ?
    note: Cette phrase combine le jour de la semaine de l’unité 3 avec *om* et l’heure de l’unité 4.
  nl.a1.unit11.lesson03.teach.half_three_review:
    title: Half drie signifie 2 h 30
    gloss: half drie = 2 h 30 ; om half drie donne l’heure du rendez-vous.
    note: 'Le néerlandais compte vers l’heure suivante, alors que le français part de l’heure écoulée (« deux heures et demie ») : *half drie* est à mi-chemin vers trois heures, donc cela signifie 2 h 30.'
  nl.a1.unit11.lesson03.teach.date_time:
    title: Une date et une heure
    gloss: le vendredi 17 avril à 3 h 15
    note: Les jours de la semaine et les mois restent en minuscules. Utilise *op* pour la date et *om* pour l’heure.
  nl.a1.unit11.lesson03.teach.confirm_time:
    title: Confirmer l’heure
    gloss: Oui, vendredi à 2 h 30, ça me va.
    note: '*Is goed* confirme que l’horaire proposé convient.'
  nl.a1.unit11.lesson04.teach.bericht_uitnodiging_taalcafe:
    title: Message, invitation, café des langues
    gloss: le message, l’invitation, le café des langues
    note: '*Bericht* est un court message écrit ou numérique, une *uitnodiging* invite quelqu’un à participer à une activité ou à un événement, et *taalcafé* (un seul mot composé, avec son accent) est le lieu de rencontre du groupe.'
    example_gloss:
    - J’ai un message de Lotte.
    - C’est une invitation au café des langues.
    - Nous prenons un café au café des langues.
  nl.a1.unit11.lesson04.teach.invitation:
    title: L’invitation de Lotte
    gloss: Salut Omar, as-tu envie de prendre un café au café des langues le samedi 18 avril à 2 h 30 ? Amicalement, Lotte.
    note: 'Repère quatre informations : l’activité, la date, l’heure et le lieu.'
    glosses:
      Hoi: salut
      zin: envie (heb je zin = as-tu envie)
      zaterdag: samedi
      april: avril
      half: la demie VERS l’heure suivante (half acht = 7 h 30)
      drie: trois
      koffie: café
      drinken: boire / prendre
      taalcafé: café des langues
      Groet: amitiés
  nl.a1.unit11.lesson05.teach.proposal_message:
    title: Un message pour faire une proposition
    gloss: Salut Omar, on prend un café vendredi à 2 h 30 ? Amicalement, Lotte.
    note: Le message comprend une salutation, une activité, un jour, une heure et une formule de fin.
    glosses:
      Hoi: salut
      zullen: on… ?
      vrijdag: vendredi
      half: la demie VERS l’heure suivante (half acht = 7 h 30)
      drie: trois
      koffie: café
      drinken: boire / prendre
      Groet: amitiés
  nl.a1.unit11.lesson05.teach.confirm_message:
    title: Un message de confirmation
    gloss: Salut Lotte, oui, avec plaisir ! Vendredi à 2 h 30, c’est bon. À vendredi ! Omar.
    note: La réponse accepte l’activité et répète l’horaire pour le confirmer.
    glosses:
      Hoi: salut
      leuk: super / très bien
      Vrijdag: vendredi
      half: la demie VERS l’heure suivante (half acht = 7 h 30)
      drie: trois
      goed: bien / convient
      Tot: jusqu’à / à bientôt
      vrijdag: vendredi
  nl.a1.unit11.lesson05.teach.message_shape:
    title: Le contenu d’un message
    gloss: Un court message indique l’activité, le jour ou la date et l’heure.
    note: Une salutation et une formule de fin sont utiles, mais les informations essentielles sont l’activité et le moment où elle a lieu.
  nl.a1.unit11.lesson06.teach.proposal:
    title: Lotte propose un café
    gloss: 'Lotte : On prend un café vendredi ? Omar : Oui, avec plaisir ! À quelle heure ?'
    note: Omar accepte l’activité avant de demander l’heure.
  nl.a1.unit11.lesson06.teach.first_time:
    title: La première heure de Lotte
    gloss: 'Lotte : À 2 h 30.'
    note: '*Half drie* signifie 2 h 30, selon la convention de l’unité 4.'
  nl.a1.unit11.lesson06.teach.negotiate:
    title: Omar propose une autre heure
    gloss: 'Omar : Désolé, à 2 h 30, je ne peux pas. Est-ce possible à 3 h 15 ?'
    note: '*Kan het om ...?* est une façon concise de demander si une autre heure convient.'
  nl.a1.unit11.lesson06.teach.confirm:
    title: Ils confirment le rendez-vous
    gloss: 'Lotte : Oui, 3 h 15, c’est bon. Omar : Bon plan. Alors on se retrouve vendredi à 3 h 15.'
    note: 'Ici, *afspreken* se sépare : *spreken* près du début et *af* à la fin.'
