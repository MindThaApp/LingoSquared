teaching:
  nl.a1.unit15.lesson01.teach.kaartje:
    title: Le billet
    gloss: le billet
    note: '*Het kaartje* est un nom neutre ; on utilise *het*, pas *de*.'
    example_gloss: Je voudrais un billet pour Utrecht.
  nl.a1.unit15.lesson01.teach.wil_graag:
    title: Demander un billet
    gloss: Je voudrais un billet pour Utrecht.
    note: '*Wil graag* adoucit une demande ; c’est le même schéma que pour commander à manger dans l’unité 6.'
  nl.a1.unit15.lesson01.teach.enkele_of_retour:
    title: L’agent demande quel type de billet vous souhaitez
    gloss: Vous voulez un billet aller simple ou aller-retour ?
    note: '*Wilt u* est la forme de politesse de *willen*, employée ici avec un employé de gare que l’on ne connaît pas.'
  nl.a1.unit15.lesson01.teach.retour_alstublieft:
    title: Répondre poliment
    gloss: Un aller-retour, s’il vous plaît.
    note: '*Alstublieft* est le « s’il vous plaît » de politesse, en accord avec le registre *u* de l’échange.'
  nl.a1.unit15.lesson01.teach.register_note:
    title: Le registre au guichet
    gloss: Au guichet, on utilise généralement la forme de politesse u.
    note: 'Prolonge la distinction *jij*/*je* et *u* introduite à l’unité 1 : face à des inconnus dans un rôle de service, on emploie *u* par défaut.'
  nl.a1.unit15.lesson02.teach.perron:
    title: Le quai
    gloss: le quai
    note: '*Het perron* est neutre ; on utilise *het*, pas *de*.'
    example_gloss: De quel quai part le train pour Utrecht ?
  nl.a1.unit15.lesson02.teach.welk_perron:
    title: Demander de quel quai part le train
    gloss: De quel quai part le train pour Utrecht ?
    note: '*Van welk perron* demande précisément le quai, et non un lieu en général.'
  nl.a1.unit15.lesson02.teach.vertrektijd:
    title: Indiquer les détails du départ
    gloss: Le train part à dix heures moins le quart du quai cinq.
    note: '*Kwart voor tien* reprend le schéma de l’heure vu dans l’unité 4.'
  nl.a1.unit15.lesson02.teach.hoe_laat_aan:
    title: Demander l’heure d’arrivée
    gloss: À quelle heure le train arrive-t-il ?
    note: '*Komt ... aan* appartient à un verbe séparable (*aankomen*) ; *aan* passe à la fin de la question.'
  nl.a1.unit15.lesson02.teach.aankomsttijd:
    title: Indiquer l’heure d’arrivée
    gloss: Le train arrive à onze heures.
    note: '*Komt aan* montre à nouveau les deux parties du verbe séparable, écartées dans la phrase.'
  nl.a1.unit15.lesson03.teach.op_tijd_de_vertraging:
    title: À l’heure / le retard
    gloss: à l’heure ; le retard
    note: '*Op tijd* est une expression figée pour ce qui se passe comme prévu. *De vertraging* (le retard) est un nom de genre commun.'
    example_gloss:
    - Le train ne part pas à l’heure.
    - 'Attention : le train pour Utrecht a du retard.'
  nl.a1.unit15.lesson03.teach.let_op:
    title: Une annonce
    gloss: 'Attention : le train pour Utrecht a du retard.'
    note: '*Let op* (littéralement « fais attention ») ouvre une annonce en gare, un peu comme « Votre attention, s’il vous plaît » en français.'
  nl.a1.unit15.lesson03.teach.niet_op_tijd:
    title: Dire que le train n’est pas à l’heure
    gloss: Le train ne part pas à l’heure.
    note: '*Niet* se place juste devant *op tijd* pour nier toute l’expression.'
  nl.a1.unit15.lesson03.teach.ander_perron:
    title: Un changement de quai
    gloss: Le train part du quai trois au lieu du quai cinq.
    note: '*In plaats van* signifie « au lieu de ».'
  nl.a1.unit15.lesson03.teach.tien_minuten_vertraging:
    title: Indiquer la durée du retard
    gloss: Le train a dix minutes de retard.
    note: '*Heeft vertraging* (littéralement « a du retard ») est la façon naturelle de dire que quelque chose est en retard, à côté de l’adjectif *vertraagd*.'
  nl.a1.unit15.lesson04.teach.ingang_uitgang_wachtruimte:
    title: Entrée, sortie, salle d’attente
    gloss: l’entrée ; la sortie ; la salle d’attente
    note: '*De ingang*, *de uitgang* et *de wachtruimte* sont tous des noms de genre commun.'
    example_gloss:
    - Où est l’entrée ?
    - Où est la sortie ?
    - Où est la salle d’attente ?
  nl.a1.unit15.lesson04.teach.waar_perron_zeven:
    title: Demander où se trouve un quai
    gloss: Où se trouve le quai numéro sept ?
    note: Reprend le schéma *Waar is...?* des leçons sur l’orientation de l’unité 9.
  nl.a1.unit15.lesson04.teach.rechtdoor_rechts:
    title: Indiquer le chemin
    gloss: Tout droit, puis à droite.
    note: '*Rechtdoor* et *rechts* sont les mêmes mots de direction que dans l’unité 9, réutilisés ici dans une gare.'
  nl.a1.unit15.lesson04.teach.waar_wachtruimte:
    title: Demander où se trouve la salle d’attente
    gloss: Où est la salle d’attente ?
    note: La même structure interrogative est appliquée à un nouveau lieu.
  nl.a1.unit15.lesson05.teach.kaartje_tekst:
    title: Lire un billet imprimé
    gloss: 'Billet : Amsterdam Centraal – Utrecht Centraal. Départ : dix heures dix, quai sept. Arrivée : onze heures moins dix. Aller-retour. Prix : douze euros quarante.'
    note: Repère l’heure et le quai de départ, l’heure d’arrivée, le type de billet et le prix.
    glosses:
      Kaartje: billet
      Vertrek: départ
      tien: dix
      perron: quai
      zeven: sept
      Aankomst: arrivée
      elf: onze
      Retour: billet aller-retour
      Prijs: prix
      twaalf: douze
      euro: euros
      veertig: quarante
  nl.a1.unit15.lesson06.teach.omar_open:
    title: Omar expose le plan
    gloss: 'Omar : Nous devons aller au quai sept. Le train part à dix heures dix.'
    note: '*Moeten* (devoir, falloir) exprime ici une nécessité pratique, pas une obligation stricte.'
  nl.a1.unit15.lesson06.teach.lotte_sign:
    title: Lotte lit le panneau
    gloss: 'Lotte : Regarde, voilà le panneau : retard, dix minutes.'
    note: '*Daar staat* (littéralement « là se tient ») est la façon naturelle de dire qu’un panneau affiche quelque chose.'
  nl.a1.unit15.lesson06.teach.omar_coffee:
    title: Omar reste calme
    gloss: 'Omar : Pas de problème, on a encore le temps de prendre un café.'
    note: '*Geen probleem* est une formule rassurante courante et familière.'
  nl.a1.unit15.lesson06.teach.lotte_train_arrives:
    title: Le train arrive
    gloss: 'Lotte : Bonne idée. Oh, le train est déjà là. Quai sept, exactement !'
    note: '*Al* (déjà) indique que le train est arrivé plus tôt que prévu, vu le retard qui vient d’être annoncé.'
  nl.a1.unit15.lesson06.teach.omar_board:
    title: Ils montent dans le train
    gloss: 'Omar : Allez, on monte. Utrecht, nous voilà !'
    note: '*Stappen in* (monter à bord) est un verbe séparable ; *in* passe à la fin de la proposition. *We komen eraan* (littéralement « nous venons vers cela ») est la façon naturelle de dire « nous voilà » en néerlandais ; une traduction mot à mot paraîtrait étrange.'
