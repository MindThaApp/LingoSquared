teaching:
  nl.a1.unit14.lesson01.teach.comparative_rule:
    title: Former le comparatif
    gloss: Dans les comparaisons, on ajoute souvent -er à l’adjectif et on utilise dan.
    note: '*Dan* correspond à « que » dans une comparaison en français. Il suit toujours l’adjectif au comparatif.'
  nl.a1.unit14.lesson01.teach.groot_klein:
    title: Grand, petit
    gloss: grand, petit
    note: '*Groot* et *klein* sont les adjectifs de base, avant l’ajout de -er.'
    example_gloss:
    - Le sac à dos est grand.
    - Le sac est petit.
  nl.a1.unit14.lesson01.teach.rugzak_groter:
    title: Le sac à dos est plus grand
    gloss: Le sac à dos est plus grand que le sac.
    note: '*Groter* se forme avec *groot* + *er* ; *dan* introduit le deuxième élément de la comparaison.'
  nl.a1.unit14.lesson01.teach.tas_kleiner:
    title: Le sac est plus petit
    gloss: Le sac est plus petit que le sac à dos.
    note: '*Kleiner* se forme avec *klein* + *er*, selon le même schéma.'
  nl.a1.unit14.lesson02.teach.rugzak_price:
    title: Le prix du sac à dos
    gloss: Le sac à dos coûte quarante-cinq euros.
    note: '*Kost* est la troisième personne du singulier de *kosten*, « coûter ».'
  nl.a1.unit14.lesson02.teach.tas_price:
    title: Le prix du sac
    gloss: Le sac coûte vingt euros.
    note: Un prix plus bas que celui du sac à dos, qui prépare la comparaison suivante.
  nl.a1.unit14.lesson02.teach.duur_goedkoop:
    title: Cher, bon marché
    gloss: cher, bon marché
    note: '*Duur* et *goedkoop* sont les adjectifs de base, avant l’ajout de *-der* ou *-er*.'
    example_gloss:
    - Le sac à dos est cher.
    - Le sac est bon marché.
  nl.a1.unit14.lesson02.teach.rugzak_duurder:
    title: Le sac à dos est plus cher
    gloss: Le sac à dos est plus cher que le sac.
    note: '*Duurder* se forme avec *duur* + *der*. Après un mot qui se termine déjà par r, le néerlandais ajoute *-der* au lieu de *-er*.'
  nl.a1.unit14.lesson02.teach.tas_goedkoper:
    title: Le sac est moins cher
    gloss: Le sac est moins cher que le sac à dos.
    note: '*Goedkoper* se forme avec *goedkoop* + *er* ; c’est l’image inverse de la phrase précédente.'
  nl.a1.unit14.lesson03.teach.equality_rule:
    title: Comparer des choses égales
    gloss: Utilise net zo + l’adjectif + als pour comparer deux choses de même niveau.
    note: C’est l’équivalent néerlandais de la structure française « aussi ... que ».
  nl.a1.unit14.lesson03.teach.mooi:
    title: Aussi joli
    gloss: Ce sac à dos est aussi joli que ce sac.
    note: '*Mooi* (joli) se place entre *net zo* et *als*, sans changement : pas de terminaison -er dans cette structure.'
  nl.a1.unit14.lesson03.teach.praktisch:
    title: Aussi pratique
    gloss: Le sac à dos est aussi pratique que le sac.
    note: N’importe quel adjectif simple peut prendre la place dans la structure *net zo ... als*.
  nl.a1.unit14.lesson04.teach.superlative_rule:
    title: Former le superlatif
    gloss: Pour un superlatif, on utilise souvent het + l’adjectif + st.
    note: Cette forme attribut (après *is*) prend *het*, quel que soit le genre du nom.
  nl.a1.unit14.lesson04.teach.duurst:
    title: Le plus cher des deux
    gloss: Des deux, le sac à dos est le plus cher.
    note: '*Duurst* se forme avec *duur* + *st*. Le néerlandais peut employer un superlatif même quand on ne compare que deux options, alors qu’en français on dirait plutôt « le plus cher des deux » avec le comparatif ou le superlatif selon le registre.'
  nl.a1.unit14.lesson04.teach.irregular_rule:
    title: 'Irrégulier : goed, beter, best'
    gloss: 'Goed, beter, best sont irréguliers : c’est le meilleur choix. Veel, meer, meest fonctionnent de la même façon.'
    note: Comme en français (bon/meilleur, beaucoup/plus), aucune de ces deux séries (*goed/beter/best*, *veel/meer/meest*) ne suit le schéma régulier -er/-st.
  nl.a1.unit14.lesson04.teach.beste_keuze:
    title: Le meilleur choix pour le voyage
    gloss: Ce sac à dos est le meilleur choix pour un long voyage en train.
    note: '*Beste* est la forme épithète (devant un nom) : elle prend la terminaison -e que les adjectifs néerlandais reçoivent généralement devant un nom.'
  nl.a1.unit14.lesson04.teach.meer_ruimte:
    title: Plus de place
    gloss: Le sac à dos a plus de place que le sac.
    note: '*Meer* est le comparatif irrégulier de *veel* (beaucoup) ; le français a aussi une forme à part : « plus » et non « beaucoupier ».'
  nl.a1.unit14.lesson05.teach.advertentie:
    title: Lire une annonce de magasin
    gloss: 'Sac à dos Bergsport : quarante-cinq euros. Ce sac à dos est grand et solide. Sac à bandoulière Stad : vingt euros. Ce sac est plus petit et plus léger que le sac à dos, mais moins solide. Pour un long voyage, le sac à dos est le meilleur choix, car il est plus solide et offre plus de place.'
    note: Repère les prix et les tailles des deux produits, ainsi que celui que l’annonce recommande et pourquoi.
    glosses:
      Rugzak: sac à dos
      vijfenveertig: quarante-cinq
      euro: euros
      groot: grand
      sterk: solide
      Schoudertas: sac à bandoulière
      twintig: vingt
      tas: sac
      kleiner: plus petit
      lichter: plus léger
      minder: moins
      lange: long
      reis: voyage
      beste: meilleur
      keuze: choix
      sterker: plus solide
      ruimte: place / espace
  nl.a1.unit14.lesson06.teach.lotte_open:
    title: Lotte fait remarquer la taille
    gloss: 'Lotte : Regarde, ce sac à dos est plus grand que ce sac.'
    note: '*Kijk* (regarde) est une façon courante d’attirer l’attention de quelqu’un sur quelque chose.'
  nl.a1.unit14.lesson06.teach.omar_room:
    title: Omar explique pourquoi il en a besoin
    gloss: 'Omar : Oui, et il a plus de place. J’ai besoin d’un grand sac pour le voyage en train.'
    note: '*Nodig hebben* (avoir besoin de) est une combinaison fixe ; ce dont on a besoin se place entre *hebben* et *nodig*.'
  nl.a1.unit14.lesson06.teach.lotte_best_choice:
    title: Lotte confirme le choix
    gloss: 'Lotte : Alors le sac à dos est le meilleur choix pour toi.'
    note: 'Ici, *dan* signifie « dans ce cas », et non le *dan* comparatif vu dans la leçon précédente : la même orthographe couvre les deux emplois.'
  nl.a1.unit14.lesson06.teach.omar_question:
    title: Omar demande l’avis de Lotte
    gloss: 'Omar : Exactement. Quel sac trouves-tu le plus joli ?'
    note: '*Vind jij het mooist* reprend la structure pour donner son avis vue dans les leçons sur *vinden* de l’unité 13.'
  nl.a1.unit14.lesson06.teach.lotte_choice:
    title: Lotte choisit le sac à bandoulière
    gloss: 'Lotte : Je trouve ce sac à bandoulière le plus joli. Et il est léger.'
    note: '*Licht* (léger, en poids) est un nouvel adjectif utile pour décrire les sacs et les bagages.'
  nl.a1.unit14.lesson06.teach.omar_close:
    title: Ils prennent leur décision
    gloss: 'Omar : Bien, alors j’achète le sac à dos et toi le sac à bandoulière.'
    note: La deuxième proposition omet le verbe répété *koop* ; c’est naturel à l’oral en néerlandais, comme en français, quand le contexte est clair.
  nl.a1.unit14.lesson06.teach.koopt_form:
    title: Koop et koopt
    gloss: Koop est la forme de « je » de kopen (acheter) ; koopt est la forme de « il » ou « elle ».
    note: 'Schéma régulier au présent : *ik koop*, *jij/hij/zij koopt*.'
