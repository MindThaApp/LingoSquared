  nl.a1.unit42.lesson03.teach.ik_wil_grammar:
    title: La construction Ik wil graag
    gloss: '*Ik wil graag* + couleur indique la couleur que tu choisis : je voudrais du rose.'
    note: 'On réutilise la construction *Ik wil graag ...* déjà vue pour commander (Ik wil graag appels, Ik wil graag een koffie) : pas de nouvelle grammaire, juste un nouvel emploi. Ici, les couleurs s’emploient toujours ainsi (comme complément de *wil* ou comme attribut après *zijn*), jamais directement devant un nom : en néerlandais, la terminaison du mot de couleur change alors (*rood* devient *rode*), et cette règle n’est pas encore enseignée dans ce cours.'
