teaching:
  nl.a1.unit16.lesson01.teach.niet_lekker:
    title: Ne pas se sentir bien
    gloss: Je ne me sens pas bien.
    note: '*Voelen* est ici pronominal (*je*/*me voelen*) ; *niet lekker* est la façon générale et nuancée de dire que quelque chose ne va pas.'
  nl.a1.unit16.lesson01.teach.ziek:
    title: Malade
    gloss: malade
    note: L’adjectif de base, employé avec *zijn* (être).
    example_gloss: Je suis malade.
  nl.a1.unit16.lesson01.teach.ben_ziek:
    title: Être malade
    gloss: Je suis malade.
    note: '*Ziek* décrit un état plus général et plus fort que *niet lekker*.'
  nl.a1.unit16.lesson01.teach.hoofdpijn:
    title: Mal de tête
    gloss: un mal de tête
    note: 'Employé sans article après *hebben* : *Ik heb hoofdpijn*, et non *Ik heb een hoofdpijn*.'
    example_gloss: J’ai mal à la tête.
  nl.a1.unit16.lesson01.teach.heb_hoofdpijn:
    title: Avoir mal à la tête
    gloss: J’ai mal à la tête.
    note: 'En néerlandais, les symptômes se construisent généralement avec *hebben* (avoir), comme en français : « avoir mal à la tête ».'
  nl.a1.unit16.lesson01.teach.buikpijn:
    title: Mal au ventre
    gloss: mal au ventre
    note: Même absence d’article que pour *hoofdpijn*.
    example_gloss: J’ai mal au ventre.
  nl.a1.unit16.lesson01.teach.heb_buikpijn:
    title: Avoir mal au ventre
    gloss: J’ai mal au ventre.
    note: Suit le même schéma avec *hebben* que *hoofdpijn*.
  nl.a1.unit16.lesson02.teach.wat_is_er:
    title: Demander de manière générale
    gloss: Qu’est-ce qui ne va pas ?
    note: Une formule générale qui convient dans toutes les situations pour demander si quelque chose ne va pas.
  nl.a1.unit16.lesson02.teach.wat_scheelt:
    title: Une expression courante
    gloss: Qu’est-ce qui ne va pas ?
    note: '*Scheelt eraan* est une expression figée ; ne la traduis pas mot à mot.'
  nl.a1.unit16.lesson02.teach.keelpijn:
    title: Mal de gorge
    gloss: mal à la gorge
    note: Même absence d’article que pour *hoofdpijn* et *buikpijn*.
    example_gloss: J’ai mal à la gorge.
  nl.a1.unit16.lesson02.teach.heb_keelpijn:
    title: Avoir mal à la gorge
    gloss: J’ai mal à la gorge.
    note: Suit le même schéma avec *hebben* que les autres symptômes.
  nl.a1.unit16.lesson02.teach.gaat_het:
    title: Prendre des nouvelles de quelqu’un
    gloss: Ça va ? Non, je ne me sens pas bien.
    note: '*Gaat het?* est une question très courante et décontractée pour prendre des nouvelles entre amis.'
  nl.a1.unit16.lesson03.teach.koorts:
    title: Fièvre
    gloss: de la fièvre
    note: Employé sans article après *hebben*, comme les autres symptômes.
    example_gloss: J’ai de la fièvre.
  nl.a1.unit16.lesson03.teach.heb_koorts:
    title: Avoir de la fièvre
    gloss: J’ai de la fièvre.
    note: Suit le schéma avec *hebben*.
  nl.a1.unit16.lesson03.teach.verkouden:
    title: Avoir un rhume
    gloss: être enrhumé
    note: 'Un adjectif employé avec *zijn*, et non un nom employé avec *hebben* : comme en français, on dit « être enrhumé ».'
    example_gloss: Je suis enrhumé.
  nl.a1.unit16.lesson03.teach.ben_verkouden:
    title: Dire que l’on est enrhumé
    gloss: Je suis enrhumé.
    note: Le néerlandais dit *zijn* + *verkouden*, comme le français « être enrhumé » ; on ne dit pas *Ik heb een verkouden*.
  nl.a1.unit16.lesson03.teach.zijn_note:
    title: 'Zijn ou hebben : cela dépend de la classe du mot, pas de la durée'
    gloss: 'Ziek et verkouden sont des adjectifs et s’emploient avec zijn : je suis malade, je suis enrhumé. Koorts et hoofdpijn sont des noms et s’emploient avec hebben.'
    note: 'Le choix entre *zijn* et *hebben* dépend de la classe grammaticale (adjectif ou nom de symptôme), pas du caractère plus ou moins temporaire de l’état : *koorts* (un nom) est tout aussi passager que *verkouden* (un adjectif), mais se construit avec *hebben*, pas avec *zijn*.'
  nl.a1.unit16.lesson04.teach.apotheek:
    title: La pharmacie
    gloss: la pharmacie
    note: 'Nom de genre commun : *de apotheek*.'
    example_gloss: Je vais à la pharmacie.
  nl.a1.unit16.lesson04.teach.waarmee_helpen:
    title: L’accueil du pharmacien
    gloss: Comment puis-je vous aider ?
    note: '*Waarmee kan ik u helpen?* est une formule d’accueil formelle courante dans les services ; elle prolonge le registre en *u* vu dans les leçons sur le registre des unités 1 et 15.'
  nl.a1.unit16.lesson04.teach.iets_tegen:
    title: Demander quelque chose contre un symptôme
    gloss: Avez-vous quelque chose contre le mal de tête ?
    note: '*Iets tegen* + symptôme est la façon naturelle de demander un remède.'
  nl.a1.unit16.lesson04.teach.tablet:
    title: Un comprimé
    gloss: un comprimé
    note: 'Nom neutre : *het tablet*, mais employé ici de façon indéfinie : *een tablet*.'
    example_gloss: Je prends un comprimé.
  nl.a1.unit16.lesson04.teach.neem_tablet:
    title: Instructions de dosage
    gloss: Prends un comprimé deux fois par jour.
    note: '*Neem* est l’impératif de *nemen* (prendre), employé pour donner des instructions.'
  nl.a1.unit16.lesson04.teach.register_note:
    title: Le registre à la pharmacie
    gloss: À la pharmacie, on emploie la forme de politesse u.
    note: 'Le pharmacien est un adulte inconnu dans un rôle de service : c’est la même règle de registre qu’au guichet des billets de l’unité 15.'
  nl.a1.unit16.lesson05.teach.advies:
    title: Lis les conseils de la pharmacie
    gloss: 'Conseil : prends un comprimé deux fois par jour avec de l’eau. Repose-toi bien et bois beaucoup d’eau. Tu ne te sens toujours pas bien au bout de trois jours ? Alors va chez le médecin.'
    note: Repère le dosage, les deux recommandations sans médicament et le moment où il faut consulter un médecin.
    glosses:
      Advies: conseil
      neem: prendre
      keer: fois
      dag: jour
      tablet: comprimé
      Rust: se reposer
      drink: boire
      Voel: se sentir
      steeds: encore
      lekker: bien
      huisarts: médecin généraliste
  nl.a1.unit16.lesson06.teach.lotte_ask:
    title: Lotte prend des nouvelles
    gloss: 'Lotte : Salut Omar, comment ça va ? Tu te sens déjà mieux ?'
    note: '*Al* (déjà) montre que Lotte veut savoir si Omar va mieux depuis leur dernière conversation.'
  nl.a1.unit16.lesson06.teach.omar_still_bad:
    title: Omar va encore mal
    gloss: 'Omar : Pas encore très bien. J’ai toujours mal à la tête et je suis fatigué.'
    note: '*Nog steeds* (toujours) montre que le mal de tête n’a pas disparu ; *moe* (fatigué) est un nouvel adjectif très utile.'
  nl.a1.unit16.lesson06.teach.lotte_ask_tablet:
    title: Lotte s’informe du médicament
    gloss: 'Lotte : Tu as pris un comprimé ?'
    note: '*Genomen* est le participe passé de *nemen*, avec le même schéma *heb* + participe que dans l’unité 12.'
  nl.a1.unit16.lesson06.teach.omar_took_tablet:
    title: Omar confirme
    gloss: 'Omar : Oui, j’ai pris un comprimé. Je vais me reposer maintenant.'
    note: '*Ga nu rusten* (je vais me reposer maintenant) utilise le futur proche *gaan* + infinitif.'
  nl.a1.unit16.lesson06.teach.lotte_wish:
    title: Lotte lui souhaite un prompt rétablissement
    gloss: 'Lotte : Bonne idée. Repose-toi bien. Bon rétablissement !'
    note: '*Beterschap!* est la formule figée habituelle pour souhaiter un prompt rétablissement à quelqu’un.'
  nl.a1.unit16.lesson06.teach.omar_thanks:
    title: Omar prend congé
    gloss: 'Omar : Merci, à demain !'
    note: '*Tot morgen!* reprend le schéma *tot* + moment des formules d’au revoir vues dans les unités précédentes.'
