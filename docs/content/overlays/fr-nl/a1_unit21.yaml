teaching:
  nl.a1.unit21.lesson01.teach.blij_verdrietig_boos:
    title: Content, triste et en colère
    gloss: content, triste, en colère
    note: Trois mots simples et très courants, utilisés avec zijn (être) pour dire comment on se sent.
    example_gloss:
    - Je suis heureux.
    - Je suis triste.
    - Je suis en colère.
  nl.a1.unit21.lesson01.teach.ben_blij:
    title: Dire que tu es content
    gloss: Je suis heureux.
    note: '*Zijn* (être) + adjectif de sentiment est le schéma de base, comme « je suis ... » en français.'
  nl.a1.unit21.lesson01.teach.niet_boos:
    title: Opposer des sentiments
    gloss: Je ne suis pas en colère, je suis triste.
    note: '*Niet* nie directement *boos* ; la deuxième proposition indique ensuite le vrai sentiment.'
  nl.a1.unit21.lesson02.teach.waarom_blij:
    title: Demander pourquoi
    gloss: Pourquoi es-tu content ?
    note: '*Waarom* (pourquoi) est le mot interrogatif habituel pour demander une raison.'
  nl.a1.unit21.lesson02.teach.blij_omdat_appartement:
    title: Donner une raison
    gloss: Je suis content parce que j’ai un nouvel appartement.
    note: '*Omdat* (parce que) introduit la proposition de cause ; le verbe se place à la fin de cette proposition (*heb* passe après *appartement*).'
  nl.a1.unit21.lesson02.teach.verdrietig_omdat_regent:
    title: Une raison négative
    gloss: Je suis triste parce qu’il pleut.
    note: On réutilise *regent* (il pleut) de l’unité sur la météo dans la proposition de cause.
  nl.a1.unit21.lesson03.teach.zenuwachtig:
    title: Nerveux
    gloss: nerveux
    note: Le mot habituel pour dire qu’on est nerveux.
    example_gloss: Je suis nerveux pour mon premier service.
  nl.a1.unit21.lesson03.teach.eerste_dienst:
    title: Dire pourquoi tu es nerveux
    gloss: Je suis nerveux pour mon premier service.
    note: '*Voor* (littéralement « pour ») introduit ce qui rend nerveux, comme « pour » dans « nerveux pour mon premier service ».'
  nl.a1.unit21.lesson03.teach.geen_zorgen:
    title: Rassurer quelqu’un
    gloss: Ne t’inquiète pas.
    note: '*Maak je geen zorgen* (littéralement « ne te fais pas de soucis ») est la formule habituelle pour rassurer.'
  nl.a1.unit21.lesson04.teach.hoe_voelt_omar:
    title: Demander comment quelqu’un se sent
    gloss: Comment se sent Omar ?
    note: '*Voelen zich* (se sentir, verbe pronominal) est la façon habituelle de demander ou de décrire un état émotionnel, à distinguer du verbe *voelen* employé pour le physique dans les leçons de santé de l’unité 16.'
  nl.a1.unit21.lesson04.teach.hij_voelt_zich:
    title: Décrire comment quelqu’un se sent
    gloss: Il se sent nerveux.
    note: '*Zich* (se) est le pronom réfléchi de la troisième personne, associé à *voelt*.'
  nl.a1.unit21.lesson04.teach.waarom_voelt_hij:
    title: Demander pourquoi quelqu’un se sent ainsi
    gloss: Pourquoi se sent-il nerveux ?
    note: Combine *waarom* et le schéma *voelt zich* de *Hij voelt zich zenuwachtig*.
  nl.a1.unit21.lesson05.teach.bericht:
    title: Lire un message sur les sentiments
    gloss: Salut Lotte, je suis un peu nerveux à l’idée de mon premier service seul. Mais je suis aussi content, parce que j’ai un nouveau travail et un nouvel appartement. Je pense que ça va aller.
    note: Repère ce qui rend l’auteur nerveux, ce qui le rend heureux et sa perspective générale.
    glosses:
      beetje: un peu
      zenuwachtig: nerveux
      eerste: premier
      dienst: service
      alleen: seul
      blij: content
      want: parce que
      nieuwe: nouveau
      baan: travail
      nieuw: nouveau
      appartement: appartement
      denk: penser
      komt: 's’arranger (ici : ça va aller)'
  nl.a1.unit21.lesson06.teach.lotte_ask_feeling:
    title: Lotte demande à Omar comment il se sent
    gloss: 'Lotte : Salut Omar, comment te sens-tu pour ton premier service ?'
    note: '*Voor je eerste dienst* (pour ton premier service) reprend le schéma *voor* + nom vu dans la leçon 03.'
  nl.a1.unit21.lesson06.teach.omar_admit_nervous:
    title: Omar avoue qu’il est nerveux
    gloss: 'Omar : Je suis un peu nerveux, pour être honnête.'
    note: '*Eerlijk gezegd* (honnêtement) adoucit l’aveu.'
  nl.a1.unit21.lesson06.teach.lotte_reassure:
    title: Lotte le rassure
    gloss: 'Lotte : Ne t’inquiète pas, tu en es capable !'
    note: '*Je kunt het goed* (littéralement « tu peux bien le faire ») est une expression d’encouragement figée.'
  nl.a1.unit21.lesson06.teach.omar_thanks_helps:
    title: Omar la remercie
    gloss: 'Omar : Merci, ça aide vraiment.'
    note: '*Helpt* est la forme de la troisième personne de *helpen* (aider).'
  nl.a1.unit21.lesson06.teach.lotte_predict:
    title: Lotte prédit la suite
    gloss: 'Lotte : Et après, tu seras sûrement très content et fier.'
    note: '*Vast* (sûrement) exprime une prédiction pleine d’assurance ; *trots* (fier) est un nouvel adjectif utile.'
  nl.a1.unit21.lesson06.teach.omar_agree:
    title: Omar est d’accord
    gloss: 'Omar : Oui, je le pense aussi.'
    note: '*Dat denk ik ook* (littéralement « cela, je le pense aussi ») est la façon naturelle d’approuver l’avis de quelqu’un.'
  nl.a1.unit21.lesson06.teach.summary_pronouns:
    title: Résumer avec is, zijn et hem
    gloss: Omar est nerveux pour son premier service. Lotte l’aide.
    note: '*Is* est la forme de la troisième personne de *zijn* (être) ; ici, *zijn* signifie aussi « son » (possessif) ; *hem* signifie « le/lui » (pronom complément) : trois petits mots essentiels pour parler de quelqu’un d’autre.'
