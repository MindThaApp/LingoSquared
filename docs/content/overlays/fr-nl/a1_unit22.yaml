course:
  title: Néerlandais A1
  description: Néerlandais débutant pour gérer un échange simple par téléphone ou par SMS, y compris demander à quelqu’un de répéter ou de parler plus lentement.
units:
  nl.a1.unit22.communication:
    title: Téléphoner et envoyer des SMS
