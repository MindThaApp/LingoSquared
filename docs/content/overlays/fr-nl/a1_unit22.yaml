teaching:
  nl.a1.unit22.lesson01.teach.bellen:
    title: Appeler
    gloss: appeler
    note: L’infinitif du verbe qui signifie passer un appel téléphonique.
    example_gloss: Je dois t’appeler.
  nl.a1.unit22.lesson01.teach.ik_bel_je:
    title: Dire que tu appelleras
    gloss: Je t’appellerai.
    note: '*Bel* est la forme de *bellen* à la première personne ; le néerlandais utilise ici le présent, là où le français emploie souvent le futur proche (« je vais t’appeler »).'
  nl.a1.unit22.lesson01.teach.met_lotte:
    title: Répondre au téléphone
    gloss: Allô, ici Lotte.
    note: '*Met* + prénom (littéralement « avec » + prénom) est la façon habituelle de se présenter au téléphone en néerlandais, là où le français dit « ici » ou « c’est ».'
  nl.a1.unit22.lesson01.teach.met_omar:
    title: Omar répond de la même façon
    gloss: Allô, ici Omar.
    note: Même structure *met* + prénom que dans *Hallo, met Lotte*.
  nl.a1.unit22.lesson02.teach.met_wie:
    title: Demander qui appelle
    gloss: À qui ai-je l’honneur ?
    note: '*Met wie spreek ik?* est la formule de politesse habituelle pour un interlocuteur inconnu.'
  nl.a1.unit22.lesson02.teach.u_spreekt_met:
    title: Se présenter de manière formelle
    gloss: Vous parlez avec Lotte.
    note: '*U spreekt met* + nom est l’équivalent formel de *met* + prénom.'
  nl.a1.unit22.lesson03.teach.kun_je_herhalen:
    title: Demander de répéter
    gloss: Peux-tu répéter cela ?
    note: '*Kun je* ...? (Peux-tu ... ?) plus *herhalen* (répéter) plus *dat* (ça).'
  nl.a1.unit22.lesson03.teach.spreek_niet_snel:
    title: Demander à quelqu’un de parler moins vite
    gloss: Ne parle pas si vite, s’il te plaît.
    note: '*Niet zo* + adjectif nie le degré, et non le verbe lui-même : pas aussi vite, et non « ne parle pas ».'
  nl.a1.unit22.lesson03.teach.hoor_niet_goed:
    title: Dire que tu entends mal
    gloss: Je ne t’entends pas bien.
    note: '*Horen* (entendre) avec *niet goed* (pas bien) exprime un problème d’audition, à distinguer de *verstaan* (comprendre ce qui est dit).'
  nl.a1.unit22.lesson04.teach.sms:
    title: SMS
    gloss: le SMS
    note: 'Un nom de genre commun : *de sms*, emprunté directement à l’abréviation internationale.'
    example_gloss: Le SMS est de Lotte.
  nl.a1.unit22.lesson04.teach.stuur_sms:
    title: Dire que tu enverras un SMS
    gloss: Je t’enverrai un message.
    note: '*Sturen* (envoyer) prend un complément indirect (*je*) avant le complément direct (*een sms*).'
  nl.a1.unit22.lesson04.teach.bel_later_terug:
    title: Dire que tu rappelleras
    gloss: Je te rappellerai plus tard.
    note: '*Terug* (en retour) se place à la fin, comme la particule séparable : *bellen* + *terug* correspond à « rappeler ».'
  nl.a1.unit22.lesson05.teach.sms_gesprek:
    title: Lis un échange de SMS
    gloss: 'Omar : Salut Lotte, tu peux m’appeler ? J’ai quelque chose à te dire. Lotte : Oui, bien sûr, je te rappelle dans cinq minutes.'
    note: Repère ce qu’Omar demande, pourquoi, et quand Lotte dit qu’elle rappellera.
    glosses:
      Hoi: salut
      kun: pouvoir
      bellen: appeler
      moet: devoir
      iets: quelque chose
      vertellen: dire
      natuurlijk: bien sûr
      bel: appeler
      vijf: cinq
      minuten: minutes
      terug: rappeler
  nl.a1.unit22.lesson06.teach.lotte_open_call:
    title: Omar répond au téléphone
    gloss: 'Omar : Allô, Omar à l’appareil.'
    note: 'Le même modèle *met* + prénom que dans lesson01, utilisé ici dans un vrai appel : la personne qui décroche parle la première et dit son nom.'
  nl.a1.unit22.lesson06.teach.omar_answer_glad:
    title: Lotte se présente
    gloss: 'Lotte : Salut Omar, c’est Lotte. Omar : Super que tu appelles !'
    note: '*Fijn dat* ... (super / content que ...) exprime une réaction positive à un événement.'
  nl.a1.unit22.lesson06.teach.lotte_ask_shift:
    title: Lotte demande comment s’est passé le service
    gloss: 'Lotte : Comment s’est passé ton premier service ?'
    note: '*Was* est le prétérit de *zijn* ; c’est une construction différente du passé composé (hebben/zijn + participe passé, par ex. *Ik heb gewerkt*) vu à l’unité 12. Voir la note après la réplique suivante.'
  nl.a1.unit22.lesson06.teach.omar_report_good:
    title: Omar annonce une bonne nouvelle
    gloss: 'Omar : Ça s’est très bien passé, mieux que je ne pensais.'
    note: '*Ging* est le prétérit de *gaan* (aller, ici au sens de « se passer ») ; *dacht* est le prétérit de *denken* (penser).'
  nl.a1.unit22.lesson06.teach.simple_past_note:
    title: Was, ging, dacht sont des formes du prétérit
    gloss: was → être, ging → aller, dacht → penser
    note: '*Was*, *ging* et *dacht* sont des formes irrégulières du prétérit (verleden tijd), un modèle différent du passé composé de l’unité 12 (hebben/zijn + participe passé), qui n’est pas encore étudié en détail. Pour l’instant, retiens was/ging/dacht comme des formes figées dans les contextes de cette leçon ; les règles complètes de conjugaison au prétérit viendront à un niveau ultérieur.'
  nl.a1.unit22.lesson06.teach.lotte_proud:
    title: Lotte est fière
    gloss: 'Lotte : Quelle bonne nouvelle ! Je suis fière de toi.'
    note: '*Trots op* (fier de) est une combinaison figée ; *op* est obligatoire, et non *van*.'
  nl.a1.unit22.lesson06.teach.omar_thanks_means:
    title: Omar est touché
    gloss: 'Omar : Merci beaucoup, ça compte beaucoup pour moi.'
    note: '*Betekent* est la forme de la troisième personne de *betekenen* (signifier) ; *voor me* (pour moi) indique pour qui cela compte.'
  nl.a1.unit22.lesson06.teach.zijn_possessive:
    title: Son
    gloss: Son premier service s’est très bien passé.
    note: '*Zijn* est ici le possessif « son », et non le verbe « être » : le contexte distingue ces deux mots identiques.'
