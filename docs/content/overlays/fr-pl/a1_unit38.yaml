  pl.a1.unit38.lesson05.teach.teraz_jest_wiosna:
    title: Une conversation sur les saisons
    gloss: 'C’est le printemps. Les tulipes sont belles. Nina demande : Quelle saison trouves-tu belle ? Marek dit : J’aime l’été. En été, on nage. Ewa dit : J’aime l’hiver. En hiver, on fait du patin à glace.'
    note: Ce texte reprend la conversation du café des langues et présente directement ce que Nina, Mateo et Elena disent des saisons.
    glosses:
      wiosna: printemps
      Tulipany: tulipes
      ładne: beau
