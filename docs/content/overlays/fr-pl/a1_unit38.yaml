  pl.a1.unit38.lesson03.teach.lubie_pora_roku:
    title: La construction avec Lubię
    gloss: '*Lubię* + saison indique quelle saison tu aimes : *Lubię lato.* La saison est à l’accusatif : *wiosnę*, *zimę*.'
    note: '*Lubię* (« j’aime ») se construit avec l’accusatif : les noms féminins en *-a* prennent *-ę* (*zima* -> *zimę*, *wiosna* -> *wiosnę*), tandis que *jesień* et *lato* (un nom en *-o*) ne changent pas. Pour dire ce que tu penses d’une saison, utilise *Uważam* + accusatif + *za* + adjectif : *Uważam jesień za ładną*.'
