teaching:
  pl.a1.unit16.lesson01.teach.boli_note:
    title: Ça fait mal
    gloss: 'Boleć (avoir mal), au présent : boli (il/elle/cela) et bolą (ils/elles). Głowa mnie boli signifie « j’ai mal à la tête » -- littéralement « la tête me fait mal ».'
    note: 'Pour les douleurs, on n’utilise au présent que ces deux formes de *boleć* : la partie du corps est le sujet et *mnie* indique à qui elle appartient ; il n’y a donc pas de forme « je » à apprendre ici.'
  pl.a1.unit16.lesson01.teach.glowa:
    title: Tête
    gloss: tête
    note: La partie du corps dont on se plaint le plus souvent.
    example_gloss: J’ai mal à la tête.
  pl.a1.unit16.lesson01.teach.gardlo:
    title: La gorge
    gloss: gorge
    note: Utile pour parler d’un rhume ou d’un mal de gorge.
    example_gloss: J’ai mal à la gorge.
  pl.a1.unit16.lesson01.teach.brzuch:
    title: Estomac
    gloss: ventre
    note: Utile après un gros repas, ou quand quelque chose ne passe pas.
    example_gloss: J’ai mal au ventre.
  pl.a1.unit16.lesson01.teach.zeby:
    title: Les dents
    gloss: les dents
    note: 'Toujours au pluriel ici, comme le dirait un vrai locuteur polonais : c’est pourquoi on emploie *bolą* (et non *boli*).'
    example_gloss: J’ai mal aux dents.
  pl.a1.unit16.lesson01.teach.co_cie_boli:
    title: Où avez-vous mal ?
    gloss: Qu’est-ce qui te fait mal ?
    note: La question naturelle à poser à quelqu’un qui ne se sent pas bien.
  pl.a1.unit16.lesson02.teach.czuc_sie_note:
    title: Comment te sens-tu ?
    gloss: 'Czuć się (se sentir) : czuję się (je), czujesz się (tu). Comment tu te sens ?'
    note: 'Seulement deux formes pour l’instant : *czuję* pour parler de soi, *czujesz* pour demander à quelqu’un d’autre.'
  pl.a1.unit16.lesson02.teach.dobrze_zle_contrast:
    title: Bien et mal
    gloss: Je me sens bien. Je me sens mal. -- tu connais déjà dobrze ; źle en est le contraire.
    note: Le même *dobrze* que tu utilises depuis ta toute première leçon, maintenant associé à son contraire.
  pl.a1.unit16.lesson02.teach.zle:
    title: Mal
    gloss: mal
    note: Le mot qu’il te faut pour dire que tu ne te sens pas bien.
    example_gloss: Je me sens mal.
  pl.a1.unit16.lesson02.teach.goraczka:
    title: Fièvre
    gloss: fièvre
    note: Un symptôme courant et simple à nommer.
    example_gloss: J’ai de la fièvre.
  pl.a1.unit16.lesson02.teach.ewa_ma_recap:
    title: Ewa, a -- encore une fois
    gloss: Ewa, ma -- tu connais déjà ce prénom et cette forme du verbe mieć (avoir) grâce aux leçons précédentes (Mam, masz, ma).
    note: Un petit rappel avant que cette leçon n’utilise les deux.
  pl.a1.unit16.lesson02.teach.chory_chora:
    title: Malade
    gloss: malade (masculin) / malade (féminin)
    note: 'Le même schéma -y/-a que tu as déjà vu avec *młodszy/starsza* : *chory* pour un homme, *chora* pour une femme.'
    example_gloss:
    - Il est malade.
    - Elle est malade.
  pl.a1.unit16.lesson02.teach.ewa_line_preview:
    title: Ewa ne se sent pas bien
    gloss: Je me sens mal. J’ai de la fièvre.
    note: 'Ewa décrit ses propres symptômes : elle redit la même chose dans le dialogue de cette unité.'
  pl.a1.unit16.lesson03.teach.marek_recap:
    title: Marek, encore une fois
    gloss: Marek -- tu connais déjà ce prénom grâce aux leçons précédentes.
    note: Un petit rappel avant le dialogue de cette leçon.
  pl.a1.unit16.lesson03.teach.i_recap:
    title: Et, encore une fois
    gloss: I -- tu connais déjà ce mot grâce aux leçons précédentes.
    note: Un petit rappel avant le dialogue de cette leçon.
  pl.a1.unit16.lesson03.teach.prosze_wode_recap:
    title: S’il vous plaît et eau, encore une fois
    gloss: Proszę et wodę -- tu connais déjà ces deux mots grâce aux leçons précédentes.
    note: Un petit rappel avant le dialogue de cette leçon.
  pl.a1.unit16.lesson03.teach.dziekuje_recap:
    title: Merci, encore une fois
    gloss: Dziękuję -- tu connais déjà ce mot grâce aux leçons précédentes.
    note: Un petit rappel avant le dialogue de cette leçon.
  pl.a1.unit16.lesson03.teach.odpoczac:
    title: Se reposer
    gloss: se reposer
    note: 'S’emploie avec *Proszę* comme tu l’as déjà vu pour demander d’aller tout droit ou de tourner : *Proszę* + infinitif, sans impératif.'
    example_gloss: Reposez-vous, s’il vous plaît.
  pl.a1.unit16.lesson03.teach.pic:
    title: Boire
    gloss: boire
    note: Un autre infinitif qui suit *Proszę* de la même façon.
    example_gloss: Buvez de l’eau, s’il vous plaît.
  pl.a1.unit16.lesson03.teach.dialogue.line01:
    title: Marek demande à Ewa comment elle se sent
    gloss: Ewa, comment tu te sens ?
    note: Marek remarque que quelque chose ne va pas et demande directement.
  pl.a1.unit16.lesson03.teach.dialogue.line02:
    title: Ewa décrit ses symptômes
    gloss: Je me sens mal. J’ai mal à la gorge et j’ai de la fièvre.
    note: 'Ewa énonce clairement deux symptômes : les mêmes faits qu’elle a déjà donnés plus tôt dans cette unité.'
  pl.a1.unit16.lesson03.teach.dialogue.line03:
    title: Marek donne un conseil simple
    gloss: Reposez-vous et buvez de l’eau, s’il vous plaît.
    note: 'Un conseil simple, sans diagnostic : pas une consigne médicale, juste du bon sens.'
  pl.a1.unit16.lesson03.teach.dialogue.line04:
    title: Ewa remercie Marek
    gloss: D’accord, merci Marek.
    note: Une façon simple et familière de terminer la conversation.
