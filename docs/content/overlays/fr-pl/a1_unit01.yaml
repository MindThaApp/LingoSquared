teaching:
  pl.a1.unit01.lesson01.teach.pan:
    title: Politesse envers un homme
    gloss: monsieur
    note: 'Comme le français avec tu/vous, le polonais impose un vrai choix social : *pan* s''adresse à un homme qu''on ne connaît pas ou qu''on respecte dans un cadre professionnel. Grammaticalement, *pan* se comporte pourtant comme un sujet de troisième personne : « pan jest » signifie littéralement « monsieur est », et non une vraie forme de deuxième personne, même si on l''emploie pour dire « vous ».'
  pl.a1.unit01.lesson01.teach.pani:
    title: Politesse envers une femme
    gloss: madame
    note: 'L''équivalent féminin de *pan*. On emploie *pani* avec une femme qu''on ne connaît pas ou qu''on respecte dans un cadre professionnel. Toute femme adulte est appelée *pani*, quel que soit son état civil : l''usage courant ne distingue pas « mademoiselle » et « madame ».'
  pl.a1.unit01.lesson01.teach.ty:
    title: Le « tu » informel
    gloss: tu
    note: '*Ty* s''emploie avec un(e) ami(e), un(e) camarade, un membre de la famille, un enfant ou toute personne avec qui la relation est informelle. Contrairement à *pan*/*pani*, *ty* prend de vraies terminaisons de deuxième personne, par ex. *masz* (« tu as »), et non celles de la troisième personne.'
  pl.a1.unit01.lesson01.teach.jak_sie_pan_ma:
    title: Demander des nouvelles à un homme (forme de politesse)
    gloss: Comment allez-vous ? (à un homme)
    note: 'Littéralement : « comment monsieur se porte-t-il ». *Ma* est la forme de troisième personne du verbe (accordée avec *pan*, sujet grammatical), la même terminaison que pour *on* (« il »).'
  pl.a1.unit01.lesson01.teach.jak_sie_pani_ma:
    title: Demander des nouvelles à une femme (forme de politesse)
    gloss: Comment allez-vous ? (à une femme)
    note: 'Même structure que *Jak się pan ma?*, avec *pani* à la place de *pan*. La forme verbale *ma* ne change pas : c''est la même terminaison de troisième personne, quel que soit le sexe de la personne à qui l''on parle.'
  pl.a1.unit01.lesson01.teach.jak_sie_masz:
    title: Demander familièrement comment va quelqu’un
    gloss: Comment ça va ? (informel)
    note: 'Avec *ty*, le verbe prend la vraie terminaison de deuxième personne *masz*, et non *ma*. Compare *Jak się pan/pani ma?* (forme de politesse) et *Jak się masz?* (forme familière) : c''est la meilleure paire minimale pour entendre dans le verbe même la différence entre pan/pani et ty.'
  pl.a1.unit01.lesson01.teach.dobrze_dziekuje:
    title: Une réponse standard
    gloss: Bien, merci.
    note: '*Dziękuję* (« merci ») ne change pas selon le registre : c''est le même mot que tu répondes à *pan*, à *pani* ou à *ty*. Seule la question marque le niveau de politesse.'
  pl.a1.unit01.lesson01.teach.a_pan:
    title: Retourner la question avec politesse
    gloss: Et vous ? (à un homme)
    note: Une façon brève de retourner la question à un homme à qui l'on s'adresse poliment. Remplace *pan* par *pani* (« A pani? ») pour retourner la question à une femme.
  pl.a1.unit01.lesson01.teach.a_ty:
    title: Retourner la question de manière informelle
    gloss: Et toi ? (informel)
    note: Emploie *ty* pour retourner la question à un(e) ami(e) ou à un(e) camarade.
  pl.a1.unit01.lesson02.teach.czesc:
    title: Bonjour et au revoir en registre familier
    gloss: salut (pour arriver comme pour partir)
    note: '*Cześć* est particulier parmi les salutations polonaises : il sert à la fois à dire « salut » en arrivant et en partant, dans le registre familier, comme « salut » en français. On ne l''emploie que dans les relations où l''on dit *ty*, jamais avec *pan*/*pani*.'
    example_gloss: Salut, comment vas-tu ?
  pl.a1.unit01.lesson02.teach.dzien_dobry:
    title: Salutation valable toute la journée
    gloss: bonjour
    note: '*Dzień dobry* s''emploie à tout moment avant le soir et, contrairement à *cześć*, il est neutre quant au registre : on peut le dire à *pan*, à *pani* ou à *ty*. C''est la salutation la plus sûre pour quelqu''un qu''on connaît peu.'
  pl.a1.unit01.lesson02.teach.dobry_wieczor:
    title: Salutation du soir
    gloss: bonsoir
    note: Elle remplace *dzień dobry* dès que le soir est venu. Même emploi neutre quant au registre.
  pl.a1.unit01.lesson02.teach.dobranoc:
    title: Souhait pour la nuit
    gloss: bonne nuit
    note: 'Contrairement à *dzień dobry*/*dobry wieczór*, *dobranoc* est une formule d''adieu, pas de salutation : on la dit quand quelqu''un s''en va pour la nuit ou va se coucher, jamais pour commencer un échange.'
    example_gloss: Bonne nuit, Piotr !
  pl.a1.unit01.lesson02.teach.do_widzenia:
    title: Formule d'adieu standard
    gloss: au revoir
    note: 'La façon neutre et sûre de dire au revoir : elle convient avec *pan*, *pani* ou *ty*. Elle sonne plus définitif que *do zobaczenia*.'
  pl.a1.unit01.lesson02.teach.do_zobaczenia:
    title: Adieu avec « à bientôt »
    gloss: à bientôt
    note: 'Littéralement : « jusqu''à [ce que nous nous] revoyions ». Cela suppose qu''on pense se revoir, contrairement à *do widzenia*, plus neutre.'
  pl.a1.unit01.lesson02.teach.milego_dnia:
    title: Un souhait poli pour prendre congé
    gloss: Bonne journée !
    note: '*Miłego dnia* emploie le génitif dans un souhait, comme *smacznego* (« bon appétit ») : c''est une construction figée, à apprendre comme une expression entière plutôt qu''à analyser cas par cas à ce stade.'
  pl.a1.unit01.lesson03.teach.jak_sie_pan_nazywa:
    title: Demander un nom, poliment
    gloss: Comment vous appelez-vous ? (à un homme)
    note: 'Littéralement : « comment monsieur s''appelle-t-il » ; *nazywać się* est un verbe pronominal qui signifie « s''appeler ». Remplace *pan* par *pani* pour t''adresser poliment à une femme.'
  pl.a1.unit01.lesson03.teach.jak_masz_na_imie:
    title: Demander un prénom, familièrement
    gloss: Comment tu t'appelles ?
    note: 'Elle utilise une autre tournure, *mieć na imię* (littéralement « avoir pour prénom »), et demande précisément le prénom, non le nom complet ni le nom de famille : c''est la façon naturelle et familière de demander son nom à quelqu''un de son âge.'
  pl.a1.unit01.lesson03.teach.nazywam_sie:
    title: Donner son nom complet
    gloss: Je m'appelle Anna Kowalska.
    note: 'La forme de première personne de *nazywać się*, suivie naturellement du prénom et du nom de famille ensemble : la façon la plus soignée ou la plus complète de se présenter.'
  pl.a1.unit01.lesson03.teach.mam_na_imie:
    title: Donner son prénom
    gloss: Je m'appelle Anna.
    note: 'La forme de première personne de *mieć na imię*, suivie naturellement du seul prénom : l''équivalent décontracté de *Nazywam się...*.'
  pl.a1.unit01.lesson03.teach.bardzo_mi_milo:
    title: Exprimer son plaisir de rencontrer quelqu’un
    gloss: Enchanté(e).
    note: Une expression figée, très courante lors d'une première rencontre, qui convient aussi bien en situation formelle qu'informelle.
  pl.a1.unit01.lesson03.teach.skad_jestes:
    title: Demander l'origine, familièrement
    gloss: D’où venez-vous ?
    note: '*Skąd* signifie « d''où ». On présente ici la forme familière avec *ty* ; la forme de politesse *Skąd pan/pani jest?* apparaît dans le dialogue final de cette leçon.'
  pl.a1.unit01.lesson03.teach.jestem_z:
    title: Indiquer son origine
    gloss: Je viens du Canada.
    note: '*Z* (« de ») est suivi du génitif : *Kanada* devient donc *Kanady*. La plupart des noms de pays suivent ce même schéma après *z*.'
  pl.a1.unit01.lesson03.teach.mieszkam_w:
    title: Indiquer où l’on habite
    gloss: J'habite à Varsovie.
    note: '*W* (« à, dans ») est ici suivi du locatif : *Warszawa* devient donc *Warszawie*. L''origine (avec *z*) et le lieu de résidence actuel (avec *w*) demandent des cas différents pour le nom du lieu : c''est un schéma à remarquer, non une exception à mémoriser.'
  pl.a1.unit01.lesson03.teach.dialogue.line01:
    title: Engager la conversation
    gloss: Ewa salue Marek et lui demande poliment son nom.
    note: 'Ewa emploie le registre de politesse avec *pan* envers quelqu''un qu''elle vient de rencontrer : c''est le choix le plus sûr lors d''une première rencontre professionnelle ou avec un inconnu.'
  pl.a1.unit01.lesson03.teach.dialogue.line02:
    title: 'Engager la conversation : la réponse'
    gloss: Marek donne son nom complet et dit qu'il est enchanté de la rencontrer.
    note: '*Nazywam się* suivi d''un nom complet est la façon naturelle et complète de répondre à une question polie sur le nom.'
  pl.a1.unit01.lesson03.teach.dialogue.line03:
    title: Demander l’origine
    gloss: Ewa répond de même et demande poliment à Marek d'où il vient.
    note: '*Skąd pan jest?*, la forme de politesse de *Skąd jesteś?* vue dans cette leçon, utilise *jest*, la même troisième personne que dans *pan jest*/*pan ma* déjà rencontrés.'
  pl.a1.unit01.lesson03.teach.dialogue.line04:
    title: 'Demander l’origine : la réponse'
    gloss: Marek dit qu'il vient du Canada mais qu'il habite à Varsovie.
    note: '*Ale* (« mais ») relie le contraste entre le pays d''origine de Marek et son lieu de résidence actuel : c''est la même distinction que celle de *jestem z*/*mieszkam w*.'
  pl.a1.unit01.lesson03.teach.dialogue.line05:
    title: Demander si quelqu'un parle une langue
    gloss: Ewa demande poliment à Marek s'il parle polonais.
    note: '*Czy* introduit une question fermée (à laquelle on répond par oui ou non) : en polonais, il n''y a pas de tournure comme « est-ce que » à construire autour du verbe ; *czy* seul signale qu''une question arrive.'
  pl.a1.unit01.lesson03.teach.dialogue.line06:
    title: Répondre sur sa connaissance de la langue et prendre congé
    gloss: Marek dit qu'il parle un peu et qu'il apprend encore, puis il dit au revoir.
    note: '*Jeszcze się uczę* (« j''apprends encore ») est une façon naturelle et modeste de décrire un effort en cours : une phrase utile à dire aussi de soi quand on apprend vraiment.'
