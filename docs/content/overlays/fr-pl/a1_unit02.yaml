teaching:
  pl.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: zéro
    note: Le point de départ de tous les nombres qui suivent dans cette unité.
    example_gloss: Aujourd’hui, il fait zéro degré.
  pl.a1.unit02.lesson01.teach.jeden:
    title: Un
    gloss: un
    note: '*Jeden* est suivi d’un nom au singulier normal, contrairement à tous les autres nombres de cette leçon.'
    example_gloss: J’ai un téléphone.
  pl.a1.unit02.lesson01.teach.dwa:
    title: Deux
    gloss: deux
    note: '*Dwa*, *trzy* et *cztery* sont suivis d’une forme spéciale du pluriel (comme *psy*, « chiens »), différente de celle utilisée après *pięć* et au-delà.'
    example_gloss: J’ai deux chiens.
  pl.a1.unit02.lesson01.teach.trzy:
    title: Trois
    gloss: trois
    note: 'Même pluriel que pour *dwa* : *trzy złote* (trois zlotys), et non *trzy złotych*.'
    example_gloss: Le café coûte trois zlotys.
  pl.a1.unit02.lesson01.teach.cztery:
    title: Quatre
    gloss: quatre
    note: Le dernier des trois nombres (*dwa*, *trzy*, *cztery*) qui partagent ce pluriel.
    example_gloss: J’ai quatre livres.
  pl.a1.unit02.lesson01.teach.piec:
    title: Cinq
    gloss: cinq
    note: À partir de *pięć*, les nombres sont suivis d’une autre forme du pluriel (le génitif pluriel, par ex. *minut* et non *minuty*) ; tu retrouveras ce schéma dans le reste de l’unité.
    example_gloss: J’ai cinq minutes.
  pl.a1.unit02.lesson01.teach.szesc:
    title: Six
    gloss: six
    note: 'Même génitif pluriel que pour *pięć* : *sześć jabłek* (six pommes).'
    example_gloss: J'ai six pommes.
  pl.a1.unit02.lesson01.teach.siedem:
    title: Sept
    gloss: sept
    note: Un nombre utile pour parler des jours de la semaine.
    example_gloss: Il y a sept jours dans une semaine.
  pl.a1.unit02.lesson01.teach.osiem:
    title: Huit
    gloss: huit
    note: '*Mam osiem lat* signifie littéralement « j’ai huit ans » : comme en français, le polonais exprime l’âge avec le verbe *mieć* (« avoir »). Tu t’entraîneras à ce schéma plus loin.'
    example_gloss: J’ai huit ans.
  pl.a1.unit02.lesson01.teach.dziewiec:
    title: Neuf
    gloss: neuf
    note: 'De nouveau le génitif pluriel : *dziewięć osób* (neuf personnes).'
    example_gloss: Neuf personnes font la queue.
  pl.a1.unit02.lesson01.teach.dziesiec:
    title: Dix
    gloss: dix
    note: Le dernier des nombres à un chiffre ; la suite porte sur les nombres de onze à dix-neuf et sur les dizaines.
    example_gloss: J’ai dix doigts.
  pl.a1.unit02.lesson02.teach.jedenascie:
    title: Onze
    gloss: onze
    note: 'Les nombres de 11 à 19 se terminent en *-naście*. Comme à partir de *pięć*, ils sont suivis du génitif pluriel : *jedenaście osób*.'
    example_gloss: La classe compte onze personnes.
  pl.a1.unit02.lesson02.teach.dwanascie:
    title: Douze
    gloss: douze
    note: Même terminaison *-naście* que *jedenaście*.
    example_gloss: Il y a douze mois dans une année.
  pl.a1.unit02.lesson02.teach.pietnascie:
    title: Quinze
    gloss: quinze
    note: 'Toujours la terminaison *-naście* : *piętnaście minut* (quinze minutes).'
    example_gloss: J’ai une pause de quinze minutes.
  pl.a1.unit02.lesson02.teach.dwadziescia:
    title: Vingt
    gloss: vingt
    note: Les nombres de 20 à 40 se terminent en *-dzieści*, un schéma différent de celui en *-naście*. *Dwadzieścia* lui-même est suivi du génitif pluriel (*dwadzieścia lat*), mais fais attention à ce qui se passe quand on y ajoute une unité.
    example_gloss: J’ai vingt ans.
  pl.a1.unit02.lesson02.teach.dwadziescia_jeden:
    title: Vingt et un
    gloss: vingt et un
    note: 'Les nombres composés se forment ainsi : la dizaine, puis l’unité, sans mot de liaison (contrairement au français « vingt et un »).'
  pl.a1.unit02.lesson02.teach.trzydziesci:
    title: Trente
    gloss: trente
    note: Toujours la terminaison *-dzieści* vue avec *dwadzieścia*.
    example_gloss: Le billet coûte trente zlotys.
  pl.a1.unit02.lesson02.teach.piecdziesiat:
    title: Cinquante
    gloss: cinquante
    note: Les nombres de 50 à 90 suivent un troisième schéma, *-dziesiąt*, au lieu de *-dzieści*.
    example_gloss: J’ai cinquante zlotys.
  pl.a1.unit02.lesson02.teach.sto:
    title: Cent
    gloss: cent
    note: Un nombre rond, sans terminaison composée à retenir.
    example_gloss: Ça coûte cent zlotys.
  pl.a1.unit02.lesson02.teach.ile:
    title: Combien
    gloss: combien
    note: Le mot interrogatif pour demander une quantité ou un prix.
    example_gloss: Combien ça coûte ?
  pl.a1.unit02.lesson02.teach.ile_to_kosztuje:
    title: Demander un prix
    gloss: Combien ça coûte ?
    note: '*Kosztować* (« coûter ») est le verbe ; *to* (« ceci/cela ») est le sujet. Toute la question est une formule figée très courante.'
  pl.a1.unit02.lesson02.teach.to_kosztuje_dwadziescia:
    title: Indiquer un prix
    gloss: Ça coûte vingt zlotys.
    note: '*Złotych* est le génitif pluriel de *złoty* (la monnaie polonaise), le même pluriel que celui qui suit déjà *dwadzieścia*.'
  pl.a1.unit02.lesson03.teach.jaki_jest_pana_numer:
    title: Demander un numéro de téléphone à un homme
    gloss: Quel est votre numéro de téléphone ? (à un homme, vouvoiement)
    note: 'Littéralement « quel est le numéro de téléphone du monsieur ». *Pana* est la forme possessive (génitif) de *pan* : « du monsieur », c’est-à-dire « votre ».'
  pl.a1.unit02.lesson03.teach.jaki_jest_pani_numer:
    title: Demander un numéro de téléphone à une femme
    gloss: Quel est votre numéro de téléphone ? (à une femme, vouvoiement)
    note: Remplace *pana* par *pani* pour t’adresser poliment à une femme, comme dans le schéma de l’unité 1.
  pl.a1.unit02.lesson03.teach.jaki_jest_twoj_numer:
    title: Demander un numéro de téléphone en tutoyant
    gloss: Quel est ton numéro de téléphone ? (tutoiement)
    note: '*Twój* (« ton », familier) remplace *pana*/*pani* quand on parle à un ami ou à une personne de son âge.'
  pl.a1.unit02.lesson03.teach.numer_to:
    title: 'Donner un numéro : l’introduction'
    gloss: Le numéro est…
    note: Une courte introduction naturelle avant d’énoncer les chiffres un à un, la manière habituelle de donner un numéro de téléphone à voix haute en polonais.
  pl.a1.unit02.lesson03.teach.przykladowy_numer:
    title: Un exemple de numéro de téléphone
    gloss: Six, un, cinq, zéro, deux.
    note: En polonais, on énonce souvent le numéro de téléphone chiffre par chiffre ; ici, chaque chiffre reprend un nombre déjà appris dans cette unité.
  pl.a1.unit02.lesson03.teach.ile_masz_lat:
    title: Demander son âge à quelqu’un en le tutoyant
    gloss: Quel âge as-tu ? (forme familière)
    note: 'Littéralement « combien d’années as-tu » : comme en français, le polonais exprime l’âge avec *mieć* (« avoir »), schéma déjà aperçu avec *osiem*.'
  pl.a1.unit02.lesson03.teach.ile_pan_ma_lat:
    title: Demander son âge à quelqu’un en le vouvoyant
    gloss: Quel âge avez-vous ? (à un homme, vouvoiement)
    note: '*Ma* est la même forme de la 3e personne que celle déjà vue avec *pan jest*/*pan ma* : *pan* se comporte grammaticalement comme « monsieur », un sujet à la 3e personne.'
  pl.a1.unit02.lesson03.teach.mam_dwadziescia_osiem_lat:
    title: Dire son âge
    gloss: J'ai vingt-huit ans.
    note: '*Mam* est la forme de la 1re personne de *mieć* (« avoir »). *Dwadzieścia osiem* se termine par *osiem* (huit) ; comme tout nombre finissant par 5-9, il est suivi de *lat*. Regarde dans le dialogue un nombre qui se termine autrement.'
  pl.a1.unit02.lesson03.teach.dialogue.line01:
    title: Ewa demande son numéro à Marek
    gloss: Ewa demande poliment son numéro de téléphone à Marek.
    note: Reprend exactement la question de politesse sur le numéro de téléphone vue dans cette leçon.
  pl.a1.unit02.lesson03.teach.dialogue.line02:
    title: Marek donne son numéro
    gloss: Marek énonce son numéro de téléphone chiffre par chiffre.
    note: Tous les chiffres ici ont déjà été appris dans cette unité.
  pl.a1.unit02.lesson03.teach.dialogue.line03:
    title: Ewa demande son âge à Marek
    gloss: Ewa le remercie et lui demande poliment son âge.
    note: '*Dziękuję* (« merci ») et *A* (« et ») ne changent pas selon le registre, comme *dziękuję* dans l’unité 1.'
  pl.a1.unit02.lesson03.teach.dialogue.line04:
    title: Marek donne son âge et retourne la question
    gloss: Marek dit qu’il a vingt-huit ans et demande à son tour son âge à Ewa, poliment.
    note: '*A pani ?* retourne poliment la question à une femme, sur le même modèle que *A pan ?* vu dans l’unité 1.'
  pl.a1.unit02.lesson03.teach.dialogue.line05:
    title: Ewa donne son âge
    gloss: Ewa dit qu’elle a trente-deux ans.
    note: '*Trzydzieści dwa* se termine par *dwa* (deux) ; contrairement à *dwadzieścia osiem* (qui finit par huit et prend *lat*), ce nombre est suivi de *lata*. Les nombres finissant par 2, 3 ou 4 (sauf 12, 13, 14) utilisent cette autre forme du pluriel. *Lat* et *lata* ne sont pas interchangeables : le choix dépend du dernier chiffre du nombre.'
  pl.a1.unit02.lesson03.teach.dialogue.line06:
    title: Marek conclut la conversation
    gloss: Marek dit qu’il a été agréable de discuter avec elle, puis lui dit au revoir.
    note: '*Do zobaczenia* reprend le « à bientôt » de l’unité 1.'
