    note: '*Idzie biegać* signifie « va courir » : *iść* + infinitif.'
  pl.a1.unit29.lesson04.teach.ewa_pocwiczymy_w:
    title: Ewa fait une proposition
    gloss: 'Ewa : On fait du sport samedi à dix heures ?'
  pl.a1.unit29.lesson04.teach.marek_dobry_pomysl:
    title: Marek est d’accord
    gloss: 'Marek : Bonne idée ! Je regarde la météo.'
    note: '*Dobry pomysł!* est une réponse courte à une proposition ; l’adjectif *dobry* s’accorde avec *pomysł*, qui est masculin.'
  pl.a1.unit29.lesson04.teach.marek_w_sobote:
    title: Marek vérifie la météo
    gloss: 'Marek : Il y a du soleil samedi !'
    note: '*Słonecznie* est un adverbe : *jest słonecznie* signifie « il fait soleil », sans sujet.'
  pl.a1.unit29.lesson04.teach.tomek_widze_wiadomosc:
    title: Tomek voit le message
    gloss: 'Tomek : Je vois le message. À samedi !'
  pl.a1.unit29.lesson04.teach.znasz_juz_do:
    title: Do widzenia et do + un jour
    gloss: 'Tu connais déjà *Do widzenia!* Tu peux aussi nommer un jour : *Do soboty!*, *Do jutra!* (*do* est suivi du génitif).'
    note: Étend la formule d’au revoir de l’unité sur les salutations à un jour précis.
  pl.a1.unit29.lesson05.teach.ewa_dzwoni_do:
    title: Qui utilise quoi ?
    gloss: Ewa appelle Marek tous les jours. Elle utilise son téléphone, pas une appli. Marek n’a pas d’ordinateur chez lui, mais il utilise internet sur son téléphone. Tomek consulte la météo chaque matin. Ensuite, il va courir. Kasia envoie souvent un message à Ewa. Et toi, utilises-tu aussi ton téléphone tous les jours ?
    note: Compare les habitudes des quatre personnages en matière d’appareils, sur le modèle du texte comparatif de l’unité sur le sport.
