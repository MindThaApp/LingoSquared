  pl.a1.unit29.lesson02.teach.znasz_juz_prognoze:
    title: 'Les verbes pour un message : envoyer et lire'
    gloss: Tu connais déjà *prognoza pogody* (la météo). *Wiadomość* est un message que tu peux envoyer (*wysyłam*, *wysyłasz*) ou lire (*czytam*, *czytasz*).
    note: Associe le nouveau mot au nom composé déjà appris dans l’unité sur la météo.
  pl.a1.unit29.lesson02.teach.ewa_wysyla_wiadomosc:
    title: Ewa envoie un message via l’appli
    gloss: Ewa envoie un message via l’appli.
    note: '*Wysyłać* (envoyer) se construit avec *przez* + accusatif pour le moyen : *przez aplikację*.'
  pl.a1.unit29.lesson02.teach.marek_czyta_wiadomosc:
    title: Marek lit le message
