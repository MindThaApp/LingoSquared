  pl.a1.unit29.lesson03.teach.po_sprawdzam_stoi:
    title: Deux verbes, deux cas
    gloss: '*Sprawdzam* se construit avec l’accusatif : *prognozę pogody*. *Używam* se construit avec le génitif : *telefonu*.'
    note: La plupart des verbes se construisent avec l’accusatif, mais *używać* fait exception et demande le génitif.
