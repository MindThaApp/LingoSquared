  pl.a1.unit29.lesson06.teach.tomek_wtedy_pobiegam:
    title: Le projet de Tomek
    gloss: 'Tomek : Je courrai à ce moment-là. Ensuite, je jouerai aussi au football.'
    note: '*Wtedy* (à ce moment-là) et *potem* (ensuite) marquent l’ordre des événements ; *pobiegam* et *zagram* sont perfectifs, donc ils expriment un projet.'
  pl.a1.unit29.lesson06.teach.kasia_wole_plywac:
    title: Le projet de Kasia
    gloss: 'Kasia : Je préfère nager, mais je viens aussi au parc.'
    note: '*Wolę* signifie « je préfère » et est suivi d’un infinitif : *wolę pływać*.'
