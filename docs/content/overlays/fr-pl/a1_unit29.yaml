      dzwoni: appelle
      każdego: tous les
      dnia: jour
      używa: utilise
      telefonu: téléphone
      aplikacji: application
      komputera: ordinateur
      domu: à la maison
      internetu: Internet
      sprawdza: consulte
      ranka: matin
      prognozę: prévisions météo
      idzie: va
