teaching:
  pl.a1.unit12.lesson01.teach.wczoraj:
    title: Hier
    gloss: hier
    note: Le mot de base pour parler d’une journée récente et terminée ; il va naturellement avec les formes du passé étudiées dans cette unité.
    example_gloss: Hier, j’étais au cinéma.
  pl.a1.unit12.lesson01.teach.co_bylo_wczoraj:
    title: Que s’est-il passé hier ?
    gloss: Que s’est-il passé hier ?
    note: 'C’est la façon naturelle de demander à quelqu’un de raconter un événement récent. Było ne change pas selon la personne qui répond : cette question marche donc avec n’importe qui.'
  pl.a1.unit12.lesson01.teach.bylo_note:
    title: Było
    gloss: 'Było est la forme du passé de być (être) à la 3e personne du neutre (« il »). Elle s’accorde avec co (que, quoi) : on l’emploie donc pour demander de façon générale ce qui s’est passé : Co było wczoraj ? C’est toujours le même mot, quelle que soit la personne qui répond.'
    note: '*Było* est la forme neutre « c’était / il y a eu » : elle s’accorde avec *co* (que, quoi) et non avec la personne interrogée. Dans une question ouverte comme *Co było wczoraj?*, elle se comprend donc comme « il s’est passé » ou « il y a eu ».'
  pl.a1.unit12.lesson01.teach.bylem_bylam:
    title: J’étais (un homme / une femme)
    gloss: j’étais (dit par un homme) / j’étais (dit par une femme)
    note: 'Au passé, le polonais marque le genre de la personne qui parle : byłem si c’est un homme, byłam si c’est une femme. Les deux signifient exactement « j’étais ».'
    example_gloss:
    - Hier, j’étais au cinéma.
    - Hier, j’étais au cinéma.
  pl.a1.unit12.lesson01.teach.gender_past_note:
    title: 'Passé : -em ou -am'
    gloss: 'Au passé, la terminaison du verbe dépend du genre de la personne qui parle : -em pour un homme (byłem), -am pour une femme (byłam). Cela vaut pour tous les verbes au passé, pas seulement pour być.'
    note: 'Fais attention aux dernières lettres : *-em* indique que c’est un homme qui parle, *-am* que c’est une femme. Tu retrouveras ce même schéma avec tous les verbes au passé de cette unité.'
  pl.a1.unit12.lesson01.teach.w_kinie_locative_note:
    title: Au cinéma
    gloss: 'Kino change de terminaison après w : idę do kina (vers où ?) n’a pas la même forme que jestem w kinie (où ?). W kinie est au locatif : il dit OÙ quelque chose se passe, et non vers où quelqu’un va.'
    note: 'Deux terminaisons différentes, deux questions différentes : *do kina* répond à « vers où ? » (tu l’as vu dans l’unité sur les projets), tandis que *w kinie* répond à « où ? ». Ne les confonds pas.'
  pl.a1.unit12.lesson01.teach.bylem_w_kinie:
    title: Hier, j’étais au cinéma (un homme)
    gloss: Hier, j’étais au cinéma.
    note: 'Cette phrase réunit byłem, wczoraj et w kinie : c’est ce que dirait un homme pour raconter où il était.'
  pl.a1.unit12.lesson01.teach.bylam_w_kinie:
    title: Hier, j’étais au cinéma (une femme)
    gloss: Hier, j’étais au cinéma.
    note: 'La même phrase avec byłam : c’est ce que dirait une femme pour raconter où elle était.'
  pl.a1.unit12.lesson02.teach.film:
    title: Film
    gloss: film
    note: Un mot courant pour parler de ce qu’on a regardé ; il revient sans cesse quand on raconte une sortie au cinéma.
    example_gloss: J’ai vu un bon film.
  pl.a1.unit12.lesson02.teach.dobry:
    title: Bon
    gloss: bon
    note: 'Tu as déjà vu dobry dans dzień dobry (bonjour). Ici, il s’emploie seul comme un adjectif ordinaire : « bon ».'
    example_gloss: Un très bon film !
  pl.a1.unit12.lesson02.teach.zobaczylem_zobaczylam:
    title: J’ai vu (un homme / une femme)
    gloss: j’ai vu (dit par un homme) / j’ai vu (dit par une femme)
    note: 'Zobaczyć décrit un acte de voir unique et achevé (à la différence de widzieć, voir en continu) : zobaczyłem si c’est un homme qui parle, zobaczyłam si c’est une femme, selon le même schéma -em/-am que byłem/byłam.'
    example_gloss:
    - J’ai vu un bon film.
    - J’ai vu un bon film.
  pl.a1.unit12.lesson02.teach.zobaczyc_pattern_note:
    title: Le même schéma que byłem/byłam
    gloss: 'Le même schéma que byłem/byłam : zobaczyłem est dit par un homme, zobaczyłam par une femme. Zobaczyć est un verbe perfectif : il décrit un événement unique et achevé.'
    note: 'Même terminaison, nouveau verbe : *zobaczyłem/zobaczyłam* suit exactement le schéma que tu viens d’apprendre avec *byłem/byłam*.'
  pl.a1.unit12.lesson02.teach.zrobilem_zrobilam:
    title: J’ai fait (un homme / une femme)
    gloss: j’ai fait (dit par un homme) / j’ai fait (dit par une femme)
    note: 'Zrobić correspond à « faire » (préparer, réaliser) pour une action unique et achevée : zrobiłem pour un homme, zrobiłam pour une femme, toujours le même schéma.'
    example_gloss:
    - J’ai préparé le déjeuner.
    - J’ai préparé le déjeuner.
  pl.a1.unit12.lesson02.teach.obiad:
    title: Déjeuner
    gloss: déjeuner / repas de midi
    note: Tu te souviens peut-être de obiad dans l’unité sur les habitudes quotidiennes. Ici, c’est le repas principal de la journée que prépare Marek.
    example_gloss: C’est un délicieux déjeuner.
  pl.a1.unit12.lesson02.teach.pyszny:
    title: Savoureux
    gloss: savoureux / délicieux
    note: Une façon chaleureuse et courante de complimenter un plat ; ce mot vient naturellement juste après obiad.
    example_gloss: C’est un délicieux déjeuner.
  pl.a1.unit12.lesson03.teach.jaki:
    title: Quel / quelle sorte de
    gloss: quel / quelle sorte de
    note: 'Tu as déjà vu jaki pour demander un numéro de téléphone ou un jour de la semaine. Ici, il sert de la même façon à demander un détail précis : quel film ?'
    example_gloss: C’est quel film ?
  pl.a1.unit12.lesson03.teach.elliptical_note:
    title: Questions courtes en un mot
    gloss: Dans une conversation, on peut poser une question courte en un seul mot, par exemple Pyszny ? au lieu de la question complète Czy obiad był pyszny ? Cela sonne naturel et rapide, comme dans la conversation de tous les jours.
    note: 'Dans une vraie conversation, on saute la phrase complète quand le contexte est clair : *Pyszny?* seul signifie « C’était bon ? »'
  pl.a1.unit12.lesson03.teach.dialogue.line01:
    title: Marek demande ce qui s’est passé
    gloss: Salut Ewa ! Que s’est-il passé hier ?
    note: On reprend la toute première question de l’unité, qui ouvre maintenant une vraie conversation.
  pl.a1.unit12.lesson03.teach.dialogue.line02:
    title: Ewa était au cinéma
    gloss: J’étais au cinéma ! J’ai vu un bon film.
    note: Byłam (féminin) et zobaczyłam (féminin) indiquent tous deux que c’est Ewa qui parle.
  pl.a1.unit12.lesson03.teach.dialogue.line03:
    title: Marek demande quel film
    gloss: Quel film ?
    note: Une courte question de relance, naturelle, avec jaki.
  pl.a1.unit12.lesson03.teach.dialogue.line04:
    title: Ewa répond et renvoie la question
    gloss: Très bon ! Et toi ?
    note: A ty ? (et toi ?) redonne la parole à Marek sans aucune nouvelle notion de grammaire.
  pl.a1.unit12.lesson03.teach.dialogue.line05:
    title: Marek a préparé le déjeuner
    gloss: J’ai préparé le déjeuner !
    note: 'Zrobiłem (masculin) indique que c’est Marek qui parle : c’est ce qu’il a fait de sa journée.'
  pl.a1.unit12.lesson03.teach.dialogue.line06:
    title: Ewa demande si c’était bon
    gloss: C’était bon ?
    note: Une question en un mot, exactement selon le schéma de la note de grammaire de cette leçon.
