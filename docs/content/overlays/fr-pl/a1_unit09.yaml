teaching:
  pl.a1.unit09.lesson01.teach.isc_dojsc:
    title: Aller, arriver à
    gloss: aller ; arriver à
    note: 'Deux verbes de mouvement très proches : iść est le verbe général « aller / marcher », dojść signifie précisément « arriver à / atteindre » une destination, et c’est lui qu’on emploie dans la question étudiée dans cette leçon.'
    example_gloss:
    - Veuillez aller tout droit.
    - Comment aller à la banque ?
  pl.a1.unit09.lesson01.teach.prosto:
    title: Tout droit
    gloss: tout droit
    note: 'Le mot de direction le plus simple : on l’emploie juste après iść pour dire « aller tout droit ».'
    example_gloss: Veuillez aller tout droit jusqu’au parc.
  pl.a1.unit09.lesson01.teach.tam_potem:
    title: Là-bas, ensuite
    gloss: là-bas ; ensuite
    note: 'Tam indique un lieu ; potem enchaîne les étapes (« d’abord ceci, ensuite cela ») : les deux sont indispensables pour enchaîner des indications.'
    example_gloss:
    - La banque est là-bas.
    - Ensuite, veuillez aller tout droit.
  pl.a1.unit09.lesson01.teach.prosze_bezokolicznik:
    title: Please + infinitive
    gloss: 'Proszę + infinitif -- Proszę (« veuillez », « s’il vous plaît ») suivi d’un verbe à l’infinitif est la façon polie et courante d’indiquer un chemin, sans forme d’impératif distincte : Veuillez aller tout droit.'
    note: '*Proszę* suivi d’un verbe à l’infinitif est la façon polie de dire à quelqu’un de faire quelque chose en polonais -- *Proszę iść prosto* (« Veuillez aller tout droit »). C’est le choix sûr et poli avec un inconnu : tu n’as donc pas besoin de l’impératif pour donner ou comprendre un itinéraire. (Entre amis, on emploie plutôt l’impératif : tu le verras plus tard.)'
  pl.a1.unit09.lesson01.teach.jak_dojsc_note:
    title: Comment aller à + [lieu] ?
    gloss: 'Jak dojść do + [miejsce]? -- Jak (« comment ») plus dojść (« arriver à ») sert à demander son chemin : Comment aller à la banque ? Comment aller à l’hôtel ? Comment aller au parc ? Le nom après do prend la même terminaison de génitif -u qu’après obok et naprzeciwko dans l’unité précédente : bank -> banku, hotel -> hotelu, park -> parku.'
    note: '*Jak dojść do...?* est la question courante pour demander comment se rendre quelque part. Le nom du lieu qui suit *do* prend la même terminaison de génitif *-u* que celle déjà vue après *obok* et *naprzeciwko* -- *bank* devient *banku*, *hotel* devient *hotelu*, *park* devient *parku* : exactement le même schéma, mais après une nouvelle préposition.'
  pl.a1.unit09.lesson01.teach.jak_dojsc_do_banku:
    title: Comment aller à la banque ?
    gloss: Comment aller à la banque ?
    note: Le modèle de la note de grammaire mis en pratique avec la première destination de la leçon.
  pl.a1.unit09.lesson02.teach.prawo_lewo:
    title: Droite, gauche
    gloss: droite ; gauche
    note: S’emploient après na pour dire où se trouve quelque chose ou de quel côté tourner -- na prawo (à droite), na lewo (à gauche).
    example_gloss:
    - La banque est à droite.
    - Le parc est à gauche.
  pl.a1.unit09.lesson02.teach.skrecic:
    title: Tourner
    gloss: tourner
    note: Le verbe pour changer de direction -- associé à na prawo/na lewo, il signifie « tourner à droite » / « tourner à gauche ».
    example_gloss: Veuillez tourner à droite.
  pl.a1.unit09.lesson02.teach.skrecic_na_lewo:
    title: Veuillez tourner à gauche
    gloss: Veuillez tourner à gauche.
    note: Le même modèle Proszę + infinitif, cette fois avec skręcić et na lewo.
  pl.a1.unit09.lesson02.teach.ulica:
    title: Rue
    gloss: rue
    note: Un mot ordinaire pour désigner n’importe quelle rue -- utile dès que les indications mentionnent une rue précise.
    example_gloss: La rue est là-bas.
  pl.a1.unit09.lesson02.teach.multi_step_note:
    title: Enchaîner les indications avec potem
    gloss: 'Veuillez aller tout droit, puis tourner à droite. -- On peut enchaîner plusieurs indications avec une virgule et le mot potem (« ensuite ») : une action d’abord, puis la suivante.'
    note: 'Pour donner plusieurs indications à la suite, il suffit de les relier par une virgule et *potem* : *Proszę iść prosto, potem skręcić na prawo* (« Veuillez aller tout droit, puis tourner à droite »). Les vraies indications en plusieurs étapes se construisent exactement ainsi.'
  pl.a1.unit09.lesson03.teach.rozumiem:
    title: Je comprends
    gloss: je comprends
    note: Une façon utile de confirmer que tu as suivi les indications avant de poser une autre question.
    example_gloss: Je comprends, merci.
  pl.a1.unit09.lesson03.teach.dialogue.line01:
    title: Ewa demande comment aller au parc
    gloss: Ewa dit « Excusez-moi » et demande comment aller au parc.
    note: Przepraszam ouvre la question, avec la même politesse que dans le dialogue sur les lieux de l’unité précédente.
  pl.a1.unit09.lesson03.teach.dialogue.line02:
    title: Un passant indique le chemin du parc
    gloss: Le passant dit d’aller tout droit, puis de tourner à gauche. Le parc est là-bas.
    note: Deux indications enchaînées avec potem, exactement comme le décrit la note de grammaire de cette leçon.
  pl.a1.unit09.lesson03.teach.dialogue.line03:
    title: Ewa confirme et demande comment aller à la banque
    gloss: Ewa dit qu’elle a compris et demande comment aller à la banque.
    note: Rozumiem confirme qu’elle a bien suivi les premières indications avant de poser une nouvelle question.
  pl.a1.unit09.lesson03.teach.dialogue.line04:
    title: Le passant explique le chemin jusqu’à la banque
    gloss: Le passant dit de tourner à droite, puis d’aller tout droit. La banque est à droite.
    note: Un itinéraire en deux étapes différent de celui du parc, qui réutilise la même construction Proszę + infinitif.
  pl.a1.unit09.lesson03.teach.dialogue.line05:
    title: Ewa remercie
    gloss: Ewa dit merci beaucoup.
    note: Dziękuję bardzo, déjà vu dans les unités sur les achats et les lieux.
  pl.a1.unit09.lesson03.teach.dialogue.line06:
    title: Le passant répond
    gloss: Le passant répond « de rien ».
    note: Proszę bardzo, la réponse habituelle à un remerciement, déjà vue dans les unités précédentes.
