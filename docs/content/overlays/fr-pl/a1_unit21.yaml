teaching:
  pl.a1.unit21.lesson01.teach.szczesliwy_smutny_zly:
    title: Content, triste et en colère
    gloss: content, triste, en colère
    note: Trois mots de base pour les sentiments, utilisés avec *jestem* (je suis). Ce sont des formes masculines ; une femme dit *szczęśliwa, smutna, zła*.
    example_gloss:
    - Je suis heureux.
    - Je suis triste.
    - Je suis en colère.
  pl.a1.unit21.lesson01.teach.jestem_szczesliwy:
    title: Dire que tu es content
    gloss: Je suis heureux.
    note: '*Jestem* (je suis, de *być*) + adjectif est la structure de base, comme en français « je suis ... ». L’adjectif s’accorde avec la personne qui parle : *szczęśliwy* (homme), *szczęśliwa* (femme).'
  pl.a1.unit21.lesson01.teach.nie_jestem_zly:
    title: Opposer des sentiments
    gloss: Je ne suis pas en colère, je suis triste.
    note: '*Nie* se place juste devant le verbe : *Nie jestem zły*. La deuxième proposition donne ensuite le vrai sentiment.'
  pl.a1.unit21.lesson02.teach.dlaczego_jestes_szczesliwy:
    title: Demander pourquoi
    gloss: Pourquoi es-tu content ?
    note: '*Dlaczego* (pourquoi) est le mot interrogatif habituel pour demander une raison.'
  pl.a1.unit21.lesson02.teach.jestem_szczesliwy_bo:
    title: Donner une raison
    gloss: Je suis content parce que j’ai un nouvel appartement.
    note: '*Bo* (parce que) introduit la raison ; après *mam* (j’ai), le nom est à l’accusatif : *nowe mieszkanie*.'
  pl.a1.unit21.lesson02.teach.jestem_smutny_bo:
    title: Une raison négative
    gloss: Je suis triste parce qu’il pleut.
    note: '*Pada deszcz* (il pleut, littéralement « la pluie tombe ») est l’expression courante pour la météo, ici employée comme raison.'
  pl.a1.unit21.lesson03.teach.zdenerwowany:
    title: Nerveux
    gloss: nerveux
    note: Le mot habituel pour dire qu’on est nerveux.
    example_gloss: Je suis nerveux pour mon premier service.
  pl.a1.unit21.lesson03.teach.jestem_zdenerwowany_przed:
    title: Dire pourquoi tu es nerveux
    gloss: Je suis nerveux pour mon premier service.
    note: '*Przed* (littéralement « devant, avant ») + instrumental indique ce qui provoque la nervosité, là où le français dit « avant » ou « à l’idée de » : *przed pierwszą zmianą*.'
  pl.a1.unit21.lesson03.teach.nie_martw_sie:
    title: Rassurer quelqu’un
    gloss: Ne t’inquiète pas.
    note: '*Nie martw się* (littéralement « ne t’inquiète pas ») est la formule habituelle pour rassurer ; *się* est le pronom réfléchi.'
  pl.a1.unit21.lesson04.teach.jak_czuje_sie:
    title: Demander comment quelqu’un se sent
    gloss: Comment se sent Marek ?
    note: '*Czuć się* (se sentir, réfléchi) est la manière usuelle de demander ou de décrire un état émotionnel : *Jak czuje się Marek?*'
  pl.a1.unit21.lesson04.teach.on_czuje_sie:
    title: Décrire comment quelqu’un se sent
    gloss: Il se sent nerveux.
    note: '*Się* reste avec le verbe : *on czuje się*. L’adjectif est au masculin, comme *on* : *zdenerwowany*.'
  pl.a1.unit21.lesson04.teach.dlaczego_on_czuje:
    title: Demander pourquoi quelqu’un se sent ainsi
    gloss: Pourquoi se sent-il nerveux ?
    note: Combine *dlaczego* (pourquoi) avec la structure *czuje się* de *On czuje się zdenerwowany*.
  pl.a1.unit21.lesson05.teach.czesc_ewo_jestem:
    title: Lire un message sur les sentiments
    gloss: Salut Ewa, je suis un peu nerveux avant mon premier service en solo. Mais je suis aussi heureux, parce que j’ai un nouveau travail et un nouvel appartement. Je pense que tout ira bien.
    note: Repère ce qui rend l’auteur nerveux, ce qui le rend heureux et sa perspective générale.
    glosses:
      trochę: un peu
      zdenerwowany: nerveux
      pierwszą: premier
      zmianą: service
      samodzielną: seul
      szczęśliwy: content
      bo: parce que
      nową: nouveau
      pracę: travail
      nowe: nouveau
      mieszkanie: appartement
      myślę: penser
      będzie: 's’arranger (ici : ça va aller)'
  pl.a1.unit21.lesson06.teach.ewa_czesc_marku:
    title: Ewa demande à Marek comment il se sent
    gloss: 'Ewa : Salut Marek, comment tu te sens avant ton premier service ?'
    note: '*Przed pierwszą zmianą* (avant ton premier service) reprend la structure *przed* + instrumental de la leçon 3. *Czujesz się* est la forme de *ty*.'
  pl.a1.unit21.lesson06.teach.marek_szczerze_mowiac:
    title: Marek avoue qu’il est nerveux
    gloss: 'Marek : Franchement, je suis un peu nerveux.'
    note: '*Szczerze mówiąc* (franchement, littéralement « en parlant sincèrement ») adoucit l’aveu.'
  pl.a1.unit21.lesson06.teach.ewa_nie_martw:
    title: Ewa le rassure
    gloss: 'Ewa : Ne t’inquiète pas, tu vas bien t’en sortir !'
    note: '*Dobrze sobie poradzisz* (littéralement « tu te débrouilleras bien ») est une expression figée d’encouragement ; *poradzisz* est le futur à la forme *ty* de *poradzić sobie*.'
  pl.a1.unit21.lesson06.teach.marek_dzieki_to:
    title: Marek la remercie
    gloss: 'Marek : Merci, ça aide vraiment.'
    note: '*Pomaga* est la forme *on/ona/ono* de *pomagać* (aider) ; *dzięki* est le « merci » familier.'
  pl.a1.unit21.lesson06.teach.ewa_a_potem:
    title: Ewa prédit la suite
    gloss: 'Ewa : Et après, tu seras sûrement très heureux et fier.'
    note: '*Na pewno* (sûrement) exprime une prédiction assurée ; *dumny* (fier) est un nouvel adjectif utile. *Będziesz* est le futur de *być*.'
  pl.a1.unit21.lesson06.teach.marek_tak_ja:
    title: Marek est d’accord
    gloss: 'Marek : Oui, je le pense aussi.'
    note: '*Ja też tak myślę* (littéralement « moi aussi je pense ainsi ») est la façon naturelle d’approuver ; *ja* est ajouté ici pour marquer l’insistance.'
  pl.a1.unit21.lesson06.teach.marek_jest_zdenerwowany:
    title: Résumer avec jest et mu
    gloss: Marek est nerveux avant son premier service. Ewa l’aide.
    note: '*Jest* est la forme *on/ona* de *być* (être) ; *mu* signifie « lui » (datif, car *pomagać* se construit avec le datif). Ce sont de petits mots, mais essentiels pour parler de quelqu’un d’autre.'
