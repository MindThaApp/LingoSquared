  pl.a1.unit37.lesson05.teach.nina_i_ewa:
    title: Nina et Ewa achètent des tulipes
    gloss: Samedi, Nina et Ewa vont au marché aux fleurs. Quelle couleur veut Ewa ? Ewa aimerait du rouge. Quelle couleur veut Nina ? Nina aimerait du jaune. Elles achètent cinq tulipes. Ça coûte vingt-cinq zlotys. Les tulipes sont très belles !
    note: Ce texte récapitule la sortie du samedi au marché aux fleurs en reprenant la structure des textes comparatifs des unités sur la maison, le quartier, la poste, la cuisine et la personnalité.
    glosses:
      idą: aller
      sobotę: samedi
      targ: marché aux fleurs
      koloru: couleur
      chce: veut
      chciałaby: voudrait / volontiers
      czerwone: rouge
      żółte: jaune
      Kupują: acheter
      pięć: cinq
      tulipanów: tulipes
      kosztuje: coûte
      złotych: zloty
      ładne: beau
      dwadzieścia: vingt
