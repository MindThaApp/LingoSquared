  pl.a1.unit37.lesson03.teach.poprosze_kolor_mowi:
    title: La construction Poproszę
    gloss: '*Poproszę* + couleur indique la couleur que tu choisis : *Poproszę różowe.* La couleur se termine en *-e* parce que les tulipes sont au pluriel.'
    note: '*Poproszę* (« je prendrai…, s’il vous plaît ») est une façon pratique de commander ou de choisir quelque chose. Les couleurs sont des adjectifs et s’accordent avec le nom : *tulipany* est au pluriel, donc la terminaison est *-e* (*różowe*, *czerwone*). Seul, le nom de la couleur est au masculin singulier (*różowy*), car il s’accorde avec *kolor*.'
