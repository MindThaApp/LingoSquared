teaching:
  pl.a1.unit10.lesson01.teach.wstawac_wstaje:
    title: Se lever, je me lève
    gloss: se lever ; je me lève
    note: Wstawać est l’infinitif ; wstaję est la forme courante à la première personne, que tu utiliseras pour parler de ta propre routine.
    example_gloss: Je me lève à sept heures du matin.
  pl.a1.unit10.lesson01.teach.jesc_jem:
    title: Manger, je mange
    gloss: manger ; je mange
    note: 'Jeść est un peu irrégulier, mais jem (« je mange ») est la forme que tu utiliseras le plus : c’est exactement ainsi qu’un Polonais dit « je mange » à propos de n’importe quel repas.'
    example_gloss: Je prends mon petit-déjeuner le matin.
  pl.a1.unit10.lesson01.teach.sniadanie:
    title: Le petit-déjeuner
    gloss: petit-déjeuner
    note: 'Śniadanie ne change pas de forme après jem : « je prends le petit-déjeuner » se dit simplement jem śniadanie, sans terminaison supplémentaire à apprendre.'
    example_gloss: Le matin, je prends mon petit-déjeuner.
  pl.a1.unit10.lesson01.teach.pic_pije:
    title: Boire, je bois
    gloss: boire ; je bois
    note: Pić est l’infinitif ; piję est la forme de la première personne, utilisée comme jem et wstaję.
    example_gloss: Je bois du café le matin.
  pl.a1.unit10.lesson01.teach.pierwsza_osoba_note:
    title: Parler de soi
    gloss: Wstaję, jem, piję – dans cette unité, nous parlons seulement de nous, à la première personne (je), comme lorsque tu décris ta propre journée.
    note: Toute cette unité s’en tient volontairement à la forme « je » de chaque verbe – *wstaję* (je me lève), *jem* (je mange), *piję* (je bois) – pour que tu puisses te concentrer sur la description de ta routine, sans apprendre en même temps comment chaque verbe change pour « tu », « il » ou « elle ».
  pl.a1.unit10.lesson01.teach.o_siodmej_rano:
    title: Je me lève à sept heures du matin
    gloss: Je me lève à sept heures du matin.
    note: 'Le schéma de la note de grammaire en action : o + le locatif de l’heure (siódmej) dit « à » cette heure, exactement comme dans l’unité précédente sur l’heure.'
  pl.a1.unit10.lesson01.teach.sniadanie_kawa:
    title: Je prends mon petit-déjeuner et je bois du café
    gloss: Je prends mon petit-déjeuner et je bois du café.
    note: 'Deux verbes à la première personne reliés par i (et) : une façon naturelle d’énumérer ses activités du matin.'
  pl.a1.unit10.lesson02.teach.obiad:
    title: Le déjeuner
    gloss: déjeuner / repas de midi
    note: 'Comme śniadanie, obiad ne change pas de forme après jem : jem obiad signifie simplement « je déjeune ».'
    example_gloss: Je déjeune à midi.
  pl.a1.unit10.lesson02.teach.pracowac_pracuje:
    title: Travailler, je travaille
    gloss: travailler ; je travaille
    note: Pracować suit le même schéma -ować → -uję que kosztować → kosztuje de l’unité sur les achats, mais cette fois à la première personne.
    example_gloss: Je travaille l’après-midi.
  pl.a1.unit10.lesson02.teach.dom:
    title: Le logement
    gloss: maison / chez soi
    note: 'Le mot courant pour « maison, chez soi » : il revient sans cesse dans l’expression « rentrer à la maison ».'
    example_gloss: La maison est là-bas.
  pl.a1.unit10.lesson02.teach.do_domu_note:
    title: Vers la maison
    gloss: 'Vers la maison – do se construit avec le génitif, et le génitif de dom se termine par -u : domu, exactement comme bank → banku, park → parku, hotel → hotelu.'
    note: '*Do domu* (« à la maison », comme dans « je rentre chez moi ») reprend la même terminaison de génitif *-u* que tu connais déjà après *do* avec bank, hotel et park : un nom de plus qui suit le même schéma.'
  pl.a1.unit10.lesson02.teach.wracac_wracam:
    title: Revenir, je reviens
    gloss: revenir / rentrer ; je reviens / je rentre
    note: 'Employé avec do domu pour dire « je rentre à la maison » : l’une des phrases les plus courantes du quotidien en polonais.'
    example_gloss: Je rentre à la maison le soir.
  pl.a1.unit10.lesson02.teach.pory_dnia:
    title: À midi, l’après-midi, le soir
    gloss: à midi ; l’après-midi ; le soir
    note: 'Révision de l’unité précédente sur l’heure : avec rano et w nocy, ces expressions couvrent toute la journée.'
    example_gloss:
    - Je déjeune à midi.
    - Je travaille l’après-midi.
    - Je rentre à la maison le soir.
  pl.a1.unit10.lesson02.teach.praca_dom_phrase:
    title: Je travaille l'après-midi, puis je rentre à la maison
    gloss: Je travaille l'après-midi, puis je rentre à la maison.
    note: Le même enchaînement avec une virgule + potem que dans l'unité sur les directions, ici pour relier deux moments d'une journée.
  pl.a1.unit10.lesson03.teach.spac_spie:
    title: Dormir, je dors
    gloss: dormir ; je dors
    note: Śpię présente un changement de voyelle par rapport à l'infinitif spać, mais c'est un verbe très fréquent, à retenir tel quel.
    example_gloss: Je dors la nuit.
  pl.a1.unit10.lesson03.teach.a_ty_ja_tez:
    title: Et toi ? Moi aussi.
    gloss: Et toi ? / Moi aussi.
    note: A ty? sert simplement à passer la parole à l'autre personne ; ja też veut dire « moi aussi » -- les deux reviennent sans cesse dans la conversation de tous les jours.
    example_gloss: Moi aussi, je prends le petit-déjeuner le matin.
  pl.a1.unit10.lesson03.teach.ale_nie_herbata:
    title: Mais, thé, pas
    gloss: mais ; thé (complément d'objet) ; non / pas
    note: Ale introduit un contraste ; nie placé juste devant un mot (et non devant un verbe) signifie « pas [cela] » -- piję herbatę, nie kawę veut dire « je bois du thé, pas du café ».
    example_gloss: Je bois du thé, mais pas de café.
  pl.a1.unit10.lesson03.teach.dziesiatej_wczesnie_note:
    title: Tôt, à dix heures
    gloss: tôt ; à dix heures -- la même terminaison -ej pour les heures après 'o' que czwartej, siódmej dans la leçon précédente.
    note: '*O dziesiątej* (« à dix heures ») reprend exactement le même schéma d''heure que tu connais déjà -- *dziesiąta* devient *dziesiątej* après *o*, comme *czwarta* -> *czwartej* et *siódma* -> *siódmej*.'
  pl.a1.unit10.lesson03.teach.dialogue.line01:
    title: Ewa raconte sa matinée
    gloss: Ewa dit qu'elle se lève à sept heures du matin et qu'elle boit du café.
    note: Reprend le tout premier schéma de phrase de cette unité, ici dans une vraie conversation.
  pl.a1.unit10.lesson03.teach.dialogue.line02:
    title: Ewa poursuit sa journée
    gloss: Ewa dit qu'elle prend son petit-déjeuner, puis qu'elle travaille l'après-midi.
    note: Enchaîne deux activités à la première personne avec potem, comme dans la leçon 2.
  pl.a1.unit10.lesson03.teach.dialogue.line03:
    title: Ewa termine et interroge Marek
    gloss: Ewa dit qu'elle rentre à la maison le soir. Et toi ?
    note: A ty? passe la parole à Marek sans aucune nouvelle grammaire de question.
  pl.a1.unit10.lesson03.teach.dialogue.line04:
    title: Marek parle de son matin
    gloss: Marek dit que lui aussi se lève à sept heures ! Mais il boit du thé, pas du café.
    note: Ja też confirme un point commun (l'heure du lever) avant d'opposer la boisson avec ale...nie.
  pl.a1.unit10.lesson03.teach.dialogue.line05:
    title: Marek décrit sa journée
    gloss: Marek dit qu'il travaille le matin, puis qu'il déjeune à midi.
    note: Un ordre différent de celui d'Ewa -- d'abord le travail, puis un repas de midi.
  pl.a1.unit10.lesson03.teach.dialogue.line06:
    title: Marek parle de son sommeil
    gloss: Marek dit qu'il dort tôt, à dix heures du soir.
    note: Termine la conversation avec le nouveau verbe spać/śpię et le schéma d'heure revu dans cette leçon.
