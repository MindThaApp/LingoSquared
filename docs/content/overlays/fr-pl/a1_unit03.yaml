teaching:
  pl.a1.unit03.lesson01.teach.poniedzialek:
    title: lundi
    gloss: lundi
    note: Le premier jour de la semaine en polonais, comme en français.
    example_gloss: Aujourd'hui, c'est lundi.
  pl.a1.unit03.lesson01.teach.wtorek:
    title: mardi
    gloss: mardi
    note: 'Attention : pour dire « mardi », *wtorek* prend la préposition *we* et non *w*. Nous y reviendrons plus loin dans cette leçon.'
    example_gloss: Aujourd'hui, c'est mardi.
  pl.a1.unit03.lesson01.teach.sroda:
    title: mercredi
    gloss: mercredi
    note: Un nom féminin, contrairement à la plupart des autres jours de la semaine.
    example_gloss: Aujourd'hui, c'est mercredi.
  pl.a1.unit03.lesson01.teach.czwartek:
    title: jeudi
    gloss: jeudi
    note: Même modèle masculin que *poniedziałek*, *wtorek* et *piątek*.
    example_gloss: Aujourd'hui, c'est jeudi.
  pl.a1.unit03.lesson01.teach.piatek:
    title: vendredi
    gloss: vendredi
    note: 'Tu reverras ce jour plus loin dans l’unité : c’est le jour où Ewa et Marek prévoient de se revoir.'
    example_gloss: Aujourd’hui, c’est vendredi.
  pl.a1.unit03.lesson01.teach.sobota:
    title: samedi
    gloss: samedi
    note: Fait partie du week-end, *weekend* (un mot emprunté à l’anglais que beaucoup de Polonais utilisent aussi).
    example_gloss: Aujourd'hui, c'est samedi.
  pl.a1.unit03.lesson01.teach.niedziela:
    title: Dimanche
    gloss: dimanche
    note: Le dernier des sept jours de la semaine présentés dans cette leçon.
    example_gloss: Aujourd'hui, c'est dimanche.
  pl.a1.unit03.lesson01.teach.jaki_dzien:
    title: Demander le jour
    gloss: Quel jour de la semaine sommes-nous aujourd’hui ?
    note: 'Une question directe : *dzień tygodnia* signifie littéralement « jour de la semaine ».'
  pl.a1.unit03.lesson01.teach.we_wtorek_note:
    title: L’exception w/we
    gloss: Lundi, jeudi, vendredi, mais mardi (pour faciliter la prononciation).
    note: 'Pour la plupart des jours, on utilise « *w* + [jour] » pour dire « le [jour] ». *Wtorek* est la vraie exception : on dit *we wtorek* et non *w wtorek*, simplement parce que c’est plus facile à prononcer. C’est une vraie irrégularité, pas une faute.'
  pl.a1.unit03.lesson01.teach.w_piatek_kino:
    title: Vendredi, je vais au cinéma
    gloss: Vendredi, je vais au cinéma.
    note: '*Piątek* ne change pas après *w* ; seuls *środa*, *sobota* et *niedziela* changeraient (cela n’est pas traité dans cette leçon, pour rester simple en A1).'
  pl.a1.unit03.lesson02.teach.styczen_luty_marzec:
    title: Janvier, février, mars
    gloss: janvier ; février ; mars
    note: '*Luty* est à part sur le plan grammatical : il se comporte comme un adjectif et non comme un nom ordinaire (tu verras sa forme « en février » plus loin dans l’unité).'
    example_gloss:
    - Mon anniversaire est en janvier.
    - Je vais à Varsovie en février.
    - Mon anniversaire est en mars.
  pl.a1.unit03.lesson02.teach.kwiecien_maj_czerwiec:
    title: Avril, mai, juin
    gloss: avril ; mai ; juin
    note: '*Maj* est le mois que tu verras pour les deux dates de l’histoire de cette unité.'
    example_gloss:
    - Je vais à Varsovie en avril.
    - Mon anniversaire est en mai.
    - Je vais à Varsovie en juin.
  pl.a1.unit03.lesson02.teach.lipiec_sierpien_wrzesien:
    title: Juillet, août, septembre
    gloss: juillet ; août ; septembre
    note: 'Autre vraie irrégularité : « en septembre » se dit *we wrześniu* et non *w wrześniu*, avec le même *we* plus facile à prononcer que tu as déjà vu avec *wtorek*.'
    example_gloss:
    - Je suis en vacances en juillet.
    - Je vais à Varsovie en août.
    - Mon anniversaire est en septembre.
  pl.a1.unit03.lesson02.teach.pazdziernik_listopad_grudzien:
    title: Octobre, novembre, décembre
    gloss: octobre ; novembre ; décembre
    note: Les trois derniers mois de l’année, qui complètent la série des douze.
    example_gloss:
    - Je vais à Varsovie en octobre.
    - Mon anniversaire est en novembre.
    - Je suis en vacances en décembre.
  pl.a1.unit03.lesson02.teach.urodziny:
    title: Anniversaire
    gloss: anniversaire
    note: '*Urodziny* est toujours un pluriel en polonais, même pour l’anniversaire d’une seule personne : il s’emploie avec *są* (« sont »), jamais avec *jest* (« est »). Tu t’exerceras sur ce point précis dans un exercice plus loin dans cette leçon.'
    example_gloss: Mon anniversaire est en mai.
  pl.a1.unit03.lesson02.teach.kiedy:
    title: Quand
    gloss: quand
    note: Le mot interrogatif pour demander à quel moment quelque chose a lieu.
    example_gloss: Quand a lieu la réunion ?
  pl.a1.unit03.lesson02.teach.kiedy_sa_twoje_urodziny:
    title: Demander l’anniversaire de quelqu’un
    gloss: Quand est ton anniversaire ?
    note: '*Są* et non *jest*, en accord avec le pluriel *urodziny* : c’est le point signalé sur la carte *urodziny*.'
  pl.a1.unit03.lesson02.teach.moje_urodziny_sa_dziesiatego_maja:
    title: Dire la date de son anniversaire
    gloss: Mon anniversaire est le 10 mai.
    note: '*Dziesiątego maja* : le jour se termine en *-ego* et le mois en *-a*, sans aucune préposition. C’est la façon habituelle de donner une date précise en polonais ; voir la note de grammaire plus loin dans cette leçon pour le schéma complet.'
  pl.a1.unit03.lesson02.teach.kiedy_jest_spotkanie:
    title: Demander quand a lieu la réunion
    gloss: Quand a lieu la réunion ?
    note: '*Spotkanie* (réunion, rendez-vous) : un mot que tu reverras dans le dialogue de la leçon 3.'
  pl.a1.unit03.lesson02.teach.spotkanie_jest_pietnastego_maja:
    title: Donner la date de la réunion
    gloss: La réunion a lieu le 15 mai.
    note: Même schéma de date *-ego* + *-a* que *dziesiątego maja*, avec un autre numéro de jour.
  pl.a1.unit03.lesson02.teach.date_pattern_note:
    title: Comment le polonais donne une date
    gloss: 'Une date : le jour se termine en -ego, le mois en -a (mais février donne lutego), sans préposition : le 10 mai, le 15 mai.'
    note: 'Compare avec « vendredi » (*w piątek*, qui demande la préposition *w*) : donner une date précise du calendrier fonctionne autrement et n’utilise jamais de préposition.'
  pl.a1.unit03.lesson03.teach.kiedy_mozemy_sie_spotkac:
    title: Proposer de se revoir
    gloss: Quand pouvons-nous nous revoir ?
    note: '*Znowu* signifie « de nouveau » : une façon naturelle d’ouvrir la discussion pour fixer un autre rendez-vous.'
  pl.a1.unit03.lesson03.teach.czy_piatek_panu:
    title: Demander à un homme si vendredi lui convient, de façon formelle
    gloss: Est-ce que vendredi vous convient ? (à un homme, formel)
    note: '*Panu* est le datif de *pan* : le verbe *odpowiadać* (« convenir ») met toujours son complément au datif, comme en français on dit « vendredi *me* convient », avec un pronom complément d’objet indirect.'
  pl.a1.unit03.lesson03.teach.czy_piatek_pani:
    title: Demander à une femme si vendredi lui convient, de façon formelle
    gloss: Est-ce que vendredi vous convient ? (à une femme, formel)
    note: 'Remplace *panu* par *pani* pour s’adresser formellement à une femme : *pani* reste identique au nominatif et au datif, contrairement à *pan*/*panu*.'
  pl.a1.unit03.lesson03.teach.czy_piatek_ci:
    title: Demander à un ami si vendredi lui convient, de façon informelle
    gloss: Est-ce que vendredi te convient ? (informel)
    note: '*Ci* remplace *panu*/*pani* quand on parle à un ami ou à une personne de son âge : c’est le « te » informel au datif.'
  pl.a1.unit03.lesson03.teach.piatek_mi_odpowiada:
    title: Dire que vendredi te convient
    gloss: Vendredi me convient.
    note: '*Mi* est le datif de la première personne : le même cas que *panu*/*pani*/*ci*, mais pour « moi » au lieu de « toi/vous ».'
  pl.a1.unit03.lesson03.teach.data:
    title: Date
    gloss: date (jour du calendrier)
    note: 'Un mot très proche du français « date » : facile à reconnaître.'
    example_gloss: Quelle sera la date ?
  pl.a1.unit03.lesson03.teach.jaka_to_bedzie_data:
    title: Demander quelle sera la date
    gloss: Quelle sera la date ?
    note: Une suite naturelle quand deux personnes se sont mises d’accord sur un jour de la semaine, mais pas encore sur la date exacte.
  pl.a1.unit03.lesson03.teach.dialogue.line01:
    title: Ewa propose de se revoir
    gloss: Ewa demande à Marek quand ils peuvent se revoir.
    note: Reprend exactement la question du début de cette leçon.
  pl.a1.unit03.lesson03.teach.dialogue.line02:
    title: Marek propose vendredi, de façon formelle
    gloss: Marek demande à Ewa, de façon formelle, si le vendredi lui convient.
    note: Il s’adresse à Ewa avec *pani*, en gardant le registre formel utilisé depuis la première unité.
  pl.a1.unit03.lesson03.teach.dialogue.line03:
    title: Ewa accepte et demande la date
    gloss: Ewa dit que le vendredi lui convient, puis demande quelle sera la date exacte.
    note: '*Tak* (« oui »), vu dans l’unité 1, ouvre l’accord d’Ewa avant qu’elle demande la date exacte.'
  pl.a1.unit03.lesson03.teach.dialogue.line04:
    title: Marek donne la date
    gloss: 'Marek dit : le 15 mai.'
    note: Les deux mots ont déjà été vus dans la leçon 2 de cette unité.
  pl.a1.unit03.lesson03.teach.dialogue.line05:
    title: Ewa confirme et dit au revoir
    gloss: Ewa dit que c’est super et dit à bientôt, le 15 mai.
    note: '*Do zobaczenia* reprend la formule d’au revoir de la première unité, ici combinée à une date précise.'
  pl.a1.unit03.lesson03.teach.dialogue.line06:
    title: Marek termine la conversation
    gloss: Marek dit au revoir à son tour.
    note: 'La clôture la plus courte possible : simplement la formule d’au revoir.'
