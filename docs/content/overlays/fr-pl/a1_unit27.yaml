  pl.a1.unit27.lesson04.teach.biegac_biegam_biegasz:
    title: Biegać change selon la personne
    gloss: '*Biegać* (courir) change de terminaison selon la personne : *biegam* (je cours), *biegasz* (tu cours), *biega* (il court).'
    note: 'En polonais, le verbe prend une terminaison différente pour chaque personne ; on omet donc généralement le pronom sujet : *biegam*, *biegasz*, *biega*.'
  pl.a1.unit27.lesson04.teach.marek_fajnie_czesto:
    title: Marek réagit
    gloss: 'Marek : Super, j’y joue souvent au football.'
  pl.a1.unit27.lesson05.teach.ewa_cwiczy_joge:
    title: Ewa et Kasia parlent de sport
    gloss: Ewa fait du yoga deux fois par semaine. Elle adore les mouvements tranquilles. Kasia ne fait pas de yoga, mais elle adore nager. Kasia nage souvent, presque toutes les semaines. Et toi, quel sport pratiques-tu ?
    note: Oppose deux sports différents et deux expressions de fréquence différentes dans un court texte.
    glosses:
      ćwiczy: fait
      dwa: deux
      razy: fois
      tygodniu: semaine
      jogę: yoga
      uwielbia: adore
      spokojny: tranquillement
      ruch: bouger
      pływać: la natation
      pływa: nage
      często: souvent
      prawie: presque
      jaki: quel
      sport: sport
