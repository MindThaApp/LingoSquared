    gloss: Quel sport pratiques-tu ?
  pl.a1.unit27.lesson01.teach.gram_w_pilke:
    title: Je joue au football
    gloss: Je joue au football.
    note: '*Gram w piłkę nożną* (littéralement « je joue à football ») utilise *grać w* + accusatif ; les autres sports utilisent d''autres verbes. Voir la note de grammaire.'
  pl.a1.unit27.lesson01.teach.kazdy_sport_ma:
    title: Un verbe pour chaque sport
    gloss: 'Chaque sport a son propre verbe : *gram w piłkę nożną*, *biegam*, *pływam*, *ćwiczę jogę*.'
    note: 'Une seule construction couvre tous les sports : inutile d’apprendre un verbe différent pour chaque sport à ce niveau.'
  pl.a1.unit27.lesson02.teach.razy_w_tygodniu:
    title: Fois par semaine
    gloss: fois par semaine
    example_gloss: Je fais du yoga deux fois par semaine.
  pl.a1.unit27.lesson02.teach.dwa_razy_w:
    title: Razy w tygodniu
    gloss: Tu connais déjà *codziennie* (tous les jours) et *często* (souvent). *Dwa razy w tygodniu* (deux fois par semaine) est une façon nouvelle et plus précise de dire la fréquence.
    note: Cette expression enrichit le vocabulaire de la fréquence déjà vu dans l’unité sur les loisirs.
  pl.a1.unit27.lesson02.teach.dwa_razy_w_2:
    title: Je fais du yoga deux fois par semaine
    gloss: Je fais du yoga deux fois par semaine.
  pl.a1.unit27.lesson02.teach.marek_czesto_gra:
    title: Marek joue souvent au football
    gloss: Marek joue souvent au football.
    note: '*Często* (souvent) est l''adverbe de fréquence et se place avant le verbe : *Marek często gra w piłkę nożną.*'
  pl.a1.unit27.lesson03.teach.uprawiam_sport_tak:
    title: Uprawiać sport ou gram w
    gloss: '*Uprawiam sport* dit de façon générale que tu fais du sport. Un verbe comme *gram w piłkę nożną* nomme le sport précis. Les deux sont corrects en polonais.'
    note: '*Uprawiać sport* est le verbe général de la leçon sur les loisirs ; des verbes comme *grać w* nomment le sport précis. L''un est général, l''autre précis.'
  pl.a1.unit27.lesson03.teach.uprawiac_sport:
