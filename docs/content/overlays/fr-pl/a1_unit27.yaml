    title: Ewa fait une proposition
    gloss: 'Ewa : Et si on faisait du sport ensemble ?'
  pl.a1.unit27.lesson06.teach.moze_pocwiczymy_razem:
    title: Może poćwiczymy ...?
    gloss: '*Może poćwiczymy ...?* (littéralement « peut-être que nous ferons de l’exercice ? ») sert à proposer de faire quelque chose ensemble ; tu connais peut-être déjà cette structure grâce à une leçon précédente.'
    note: Cette phrase reprend exactement la construction servant à proposer une activité, vue dans l’unité sur les projets.
