teaching:
  pl.a1.unit07.lesson01.teach.banan:
    title: Banane
    gloss: banane
    note: Un fruit très courant, vendu à la pièce ou au poids sur n'importe quel marché ou dans n'importe quel magasin.
    example_gloss: C'est une banane.
  pl.a1.unit07.lesson01.teach.pomidor_ogorek:
    title: Tomate, concombre
    gloss: tomate ; concombre
    note: 'Les deux sont des masculins inanimés : leurs formes du génitif pluriel (pomidorów, ogórków) te serviront pour acheter au kilo, plus loin dans cette unité.'
    example_gloss:
    - C'est une tomate.
    - C'est un concombre.
  pl.a1.unit07.lesson01.teach.ziemniak_cebula:
    title: Pomme de terre, oignon
    gloss: pomme de terre ; oignon
    note: Ziemniak est un masculin inanimé (même famille de génitif pluriel en -ów que banan et pomidor) ; cebula est féminin.
    example_gloss:
    - C'est une pomme de terre.
    - C'est un oignon.
  pl.a1.unit07.lesson01.teach.tanio_drogo:
    title: Bon marché, cher
    gloss: bon marché ; cher
    note: '*Tanio* et *drogo* sont des adverbes, et le polonais les associe directement à *kosztować* (« coûter »), là où le français dit « coûter cher » ou « coûter peu » : *To kosztuje drogo* signifie littéralement « cela coûte chèrement », c''est-à-dire « c''est cher ».'
    example_gloss:
    - Très bon marché !
    - Très cher !
  pl.a1.unit07.lesson01.teach.kosztuje_kosztuja_note:
    title: 'Coûter : kosztuje, kosztują'
    gloss: 'coûter : il coûte (une seule chose), ils coûtent (plusieurs) -- Une banane est bon marché. Les bananes sont bon marché.'
    note: '*Kosztować* est le verbe « coûter ». Utilise *kosztuje* pour un seul article et *kosztują* pour plusieurs, exactement comme *jest*/*są* (« est »/« sont »), mais pour les prix. Il est important de faire cet accord : un marchand te comprendra dans les deux cas, mais *banany kosztują* est ce que dit réellement un locuteur natif.'
  pl.a1.unit07.lesson01.teach.ile_kosztuje_banan:
    title: Combien coûte une banane ?
    gloss: Combien coûte une banane ?
    note: 'La question courante pour commencer à parler prix : *Ile* (combien) suivi de *kosztuje* au singulier, puisqu''on parle d''une seule banane.'
  pl.a1.unit07.lesson02.teach.grejpfrut:
    title: Pamplemousse
    gloss: pamplemousse
    note: 'Masculin inanimé, comme pomidor et ziemniak : la terminaison ne change pas après proszę o.'
    example_gloss: C'est un pamplemousse.
  pl.a1.unit07.lesson02.teach.mandarynka_pomarancza:
    title: Mandarine, orange
    gloss: mandarine ; orange
    note: 'Les deux sont féminins, comme kawa et herbata dans l''unité sur la nourriture : à l''accusatif, -a deviendrait -ę, mais cette leçon n''utilise que leur forme du dictionnaire.'
    example_gloss:
    - C'est une mandarine.
    - C'est une orange.
  pl.a1.unit07.lesson02.teach.kilo_pol_kilo:
    title: Un kilo, un demi-kilo
    gloss: un kilo ; un demi-kilo
    note: '*Kilo* ne change jamais de terminaison, quoi que tu pèses et quelle que soit la quantité demandée : c''est le nom qui suit *kilo* qui change, comme l''explique la note de grammaire de cette leçon.'
    example_gloss:
    - Un kilo de tomates, s'il vous plaît.
    - Un demi-kilo de bananes, s'il vous plaît.
  pl.a1.unit07.lesson02.teach.poprosze:
    title: Je voudrais (s'il vous plaît)
    gloss: je voudrais / donnez-moi, s'il vous plaît
    note: '*Poproszę* est une alternative un peu plus soignée et courante à *proszę o* de l''unité sur la nourriture : les deux signifient à peu près « je voudrais », et les Polonais passent librement de l''une à l''autre. *Poproszę* est suivi directement de ce que tu veux, sans *o*.'
    example_gloss: Je voudrais un pamplemousse, s'il vous plaît.
  pl.a1.unit07.lesson02.teach.genitive_ow_note:
    title: 'Après « kilo » : la terminaison -ów'
    gloss: 'Génitif pluriel après « kilo » : banane -> de bananes, tomate -> de tomates, pomme de terre -> de pommes de terre.'
    note: 'Quand tu indiques une quantité au poids (*kilo*, *pół kilo*), le nom qui suit prend une autre forme, le génitif pluriel. Pour ces trois noms masculins réguliers, il suffit d''ajouter *-ów* : *banan* devient *bananów*, *pomidor* devient *pomidorów*, *ziemniak* devient *ziemniaków*.'
  pl.a1.unit07.lesson02.teach.poprosze_kilo_pomidorow:
    title: Un kilo de tomates, s'il vous plaît
    gloss: Un kilo de tomates, s’il vous plaît.
    note: 'Met en pratique le schéma en -ów de la note de grammaire dans une vraie demande : pomidor devient pomidorów après kilo.'
  pl.a1.unit07.lesson03.teach.dla:
    title: Pour
    gloss: pour
    note: 'Une préposition simple qui signifie « pour » : le marchand l''emploie dans *Co dla pani?* (littéralement « quoi pour vous ? ») pour demander poliment à une cliente ce qu''elle désire.'
    example_gloss: C'est pour vous.
  pl.a1.unit07.lesson03.teach.swieze_bardzo:
    title: Frais, très
    gloss: frais ; très
    note: 'Deux mots courants que le marchand a sans cesse à la bouche : pour vanter la fraîcheur d''un produit ou dire qu''il est très bon marché ou très cher.'
    example_gloss:
    - Les tomates sont fraîches.
    - Très bon marché !
  pl.a1.unit07.lesson03.teach.trochę:
    title: Un peu
    gloss: un peu
    note: 'Adoucit poliment une plainte : trochę drogo (« un peu cher ») est bien plus naturel dans un marchandage amical que drogo tout court.'
    example_gloss: Un peu cher.
  pl.a1.unit07.lesson03.teach.razem:
    title: En tout / ensemble
    gloss: en tout / ensemble
    note: Ce que dit le marchand juste avant d'annoncer la somme finale à payer.
    example_gloss: Dix zlotys en tout.
  pl.a1.unit07.lesson03.teach.co_dla_pani:
    title: Que désirez-vous ?
    gloss: Que désirez-vous ?
    note: 'Littéralement « quoi pour vous (forme de politesse) » : la question d''ouverture naturelle d''un marchand à un client.'
  pl.a1.unit07.lesson03.teach.dialogue.line01:
    title: Le marchand salue Ewa
    gloss: Le marchand dit bonjour et demande à Ewa ce qu'elle désire.
    note: Dzień dobry, déjà vu dans les salutations de l'unité 1.
  pl.a1.unit07.lesson03.teach.dialogue.line02:
    title: Ewa s'informe sur les bananes
    gloss: Ewa demande combien coûtent les bananes.
    note: 'Kosztują : la forme du pluriel vue dans la note de grammaire de cette unité, puisqu''on parle des bananes en général.'
  pl.a1.unit07.lesson03.teach.dialogue.line03:
    title: Le marchand annonce le prix
    gloss: Le marchand dit cinq zlotys le kilo, et que les bananes sont très fraîches.
    note: 'Une formule de prix elliptique naturelle : « [prix] kilo » est la façon dont un marchand polonais indique un prix au kilo, sans mot supplémentaire pour « le ».'
  pl.a1.unit07.lesson03.teach.dialogue.line04:
    title: Ewa commande des bananes
    gloss: Ewa dit d'accord et demande un kilo de bananes.
    note: Associe poproszę à kilo + bananów, exactement le schéma de la note de grammaire de la leçon 2.
  pl.a1.unit07.lesson03.teach.dialogue.line05:
    title: Le marchand propose des tomates
    gloss: Le marchand propose aussi des tomates et dit qu'elles coûtent huit zlotys le kilo.
    note: Le même schéma elliptique de prix que dans la réplique 3, cette fois pour un autre produit.
  pl.a1.unit07.lesson03.teach.dialogue.line06:
    title: Ewa marchande gentiment et commande
    gloss: Ewa dit que c'est un peu cher, mais qu'elle prend un demi-kilo.
    note: 'Trochę drogo adoucit la plainte : Ewa achète quand même, mais en plus petite quantité.'
  pl.a1.unit07.lesson03.teach.dialogue.line07:
    title: Le marchand annonce le total
    gloss: Le marchand dit « voilà » et que le total est de neuf zlotys.
    note: '5 złotych pour les bananes plus 4 złotych pour le demi-kilo de tomates : neuf złotych en tout, ce qui correspond à tous les prix annoncés plus haut dans la scène.'
