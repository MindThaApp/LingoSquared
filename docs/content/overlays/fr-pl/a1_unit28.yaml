    title: Jeździć se construit avec l’instrumental
    gloss: 'Avec les transports, le polonais met le véhicule à l’instrumental : *jeżdżę rowerem*, *jeżdżę samochodem*, *jadę pociągiem*.'
    note: 'Le véhicule est à l’instrumental (« à vélo ») et le verbe se conjugue normalement : *jeżdżę*, *jeździsz*, *jeździ*.'
