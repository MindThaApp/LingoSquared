  pl.a1.unit28.lesson05.teach.ewa_co_dzien:
    title: Qui se déplace comment ?
    gloss: Ewa va au travail en train tous les jours. Marek y va en général à vélo, mais quand il pleut, il prend aussi le train. Tomek préfère conduire la voiture. Kasia habite tout près et va au travail à pied. Et toi, comment vas-tu au travail ?
    note: Un court texte qui oppose quatre façons d’aller au travail et une condition (la pluie).
