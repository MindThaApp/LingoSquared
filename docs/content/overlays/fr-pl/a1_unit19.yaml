teaching:
  pl.a1.unit19.lesson01.teach.recap_jaka_jest_dzis_nie:
    title: 'Quelle, est, aujourd''hui, ne… pas : rappel'
    gloss: Jaka, jest, Dziś, nie -- tu connais déjà ces mots grâce aux leçons précédentes.
    note: Un petit rappel avant d'utiliser ces mots pour parler du temps qu'il fait.
  pl.a1.unit19.lesson01.teach.pogoda:
    title: Le temps
    gloss: le temps (météo)
    note: Le mot général pour parler du temps qu'il fait.
    example_gloss: Quel temps fait-il ?
  pl.a1.unit19.lesson01.teach.zimno:
    title: Froid
    gloss: froid
    note: 'Il décrit la température : il ne change pas selon le genre.'
    example_gloss: Il fait froid.
  pl.a1.unit19.lesson01.teach.goraco:
    title: Chaud
    gloss: chaud
    note: 'Le contraire de « *zimno* » : il ne change pas non plus selon le genre.'
    example_gloss: Il fait chaud.
  pl.a1.unit19.lesson01.teach.jest_pogoda_note:
    title: Il fait froid, il fait chaud
    gloss: 'Jest zimno. Jest gorąco. -- voilà comment on décrit le temps en polonais : « *jest* » plus un mot météo, sans accord en genre.'
    note: Le même schéma simple fonctionne pour tous les mots météo de cette unité.
  pl.a1.unit19.lesson01.teach.jaka_jest_pogoda_phrase:
    title: Quel temps fait-il ?
    gloss: Quel temps fait-il ?
    note: Une façon naturelle de demander quel temps il fait en ce moment.
  pl.a1.unit19.lesson01.teach.dzis_jest_zimno_phrase:
    title: Il fait froid aujourd'hui
    gloss: Il fait froid aujourd'hui.
    note: La phrase sur laquelle toute cette unité s'appuie pour décrire le temps du jour.
  pl.a1.unit19.lesson02.teach.pada:
    title: Il pleut
    gloss: il pleut
    note: 'Employé seul, sans sujet : c''est la façon normale de dire « il pleut » en polonais.'
    example_gloss: Il pleut aujourd’hui.
  pl.a1.unit19.lesson02.teach.snieg:
    title: Neige
    gloss: neige
    note: 'Le mot pour « neige » : avec « *pada* », il signifie « il neige ».'
    example_gloss: Il neige.
  pl.a1.unit19.lesson02.teach.mgla:
    title: Brouillard
    gloss: brouillard
    note: Une autre condition météo courante.
    example_gloss: Il y a du brouillard.
  pl.a1.unit19.lesson02.teach.dobra_note:
    title: Bon, bonne
    gloss: Pogoda jest dobra. -- « *dobra* » s'accorde avec les noms féminins, comme « *pogoda* ».
    note: 'La forme féminine de « *dobry* » (comme dans « *Dzień dobry* ») : même alternance -y/-a que *chory/chora*.'
  pl.a1.unit19.lesson02.teach.straszna_note:
    title: Affreux, affreuse
    gloss: Jaka straszna pogoda! -- « *straszna* » s'accorde aussi avec « *pogoda* », tout comme « *dobra* ».
    note: 'Un mot fort : à réserver aux vrais mauvais temps.'
  pl.a1.unit19.lesson02.teach.jaka_straszna_pogoda_phrase:
    title: Quel temps affreux !
    gloss: Quel temps affreux !
    note: Une exclamation naturelle face au mauvais temps.
  pl.a1.unit19.lesson02.teach.pogoda_dobra_phrase:
    title: Il fait beau
    gloss: Il fait beau.
    note: On reprend le mot météo vu plus tôt dans cette leçon.
  pl.a1.unit19.lesson03.teach.recap_words:
    title: 'Oui, et, je, aussi : rappel'
    gloss: Tak, A, ja, też, chcę, iść, idę, do, parku, tam, bardzo -- tu connais déjà ces mots grâce aux leçons précédentes.
    note: Un petit rappel avant le dialogue de cette leçon.
  pl.a1.unit19.lesson03.teach.bo:
    title: Parce que
    gloss: parce que
    note: Il relie un projet à la raison météo qui l'explique.
    example_gloss: Je ne vais pas au parc, parce qu'il pleut.
  pl.a1.unit19.lesson03.teach.nie_chce_isc_bo_pada_phrase:
    title: Je ne veux pas y aller, parce qu'il pleut
    gloss: Je ne veux pas aller au parc, parce qu'il pleut.
    note: 'Une description du temps associée à un vrai projet : exactement l''objectif de cette unité.'
  pl.a1.unit19.lesson03.teach.w_krakowie_recap:
    title: 'À Cracovie : rappel'
    gloss: W Krakowie -- tu connais déjà cette forme grâce aux leçons précédentes, par ex. « Ona mieszka w Krakowie » (Elle habite à Cracovie).
    note: Un petit rappel avant le dialogue de cette leçon, qui compare le temps dans deux endroits.
  pl.a1.unit19.lesson03.teach.dialogue.line01:
    title: Marek demande quel temps il fait
    gloss: Quel temps fait-il aujourd’hui ?
    note: Marek ouvre la conversation en demandant le temps qu'il fait aujourd'hui.
  pl.a1.unit19.lesson03.teach.dialogue.line02:
    title: Ewa répond
    gloss: Il pleut. Il fait froid.
    note: Ewa décrit le temps réel de la journée.
  pl.a1.unit19.lesson03.teach.dialogue.line03:
    title: Marek réagit et fait un projet
    gloss: Quel temps affreux ! Je ne veux pas aller au parc, parce qu'il pleut.
    note: Marek réagit au temps et annonce son projet en conséquence.
  pl.a1.unit19.lesson03.teach.dialogue.line04:
    title: Ewa est d'accord
    gloss: Moi non plus, je ne vais pas au parc.
    note: Ewa fait le même projet que Marek.
  pl.a1.unit19.lesson03.teach.dialogue.line05:
    title: Marek demande pour Cracovie
    gloss: Et à Cracovie ? Quel temps fait-il là-bas ?
    note: Marek amène la conversation sur le temps dans une autre ville.
  pl.a1.unit19.lesson03.teach.dialogue.line06:
    title: Ewa répond
    gloss: À Cracovie, il neige. Il fait très froid là-bas.
    note: Ewa décrit un autre temps, plus froid, à Cracovie.
