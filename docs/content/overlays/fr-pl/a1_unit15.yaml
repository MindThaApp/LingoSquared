teaching:
  pl.a1.unit15.lesson01.teach.dworzec:
    title: Gare
    gloss: gare
    note: 'Le lieu où les trains et les autobus arrivent et partent : le point de départ de toute cette unité.'
    example_gloss: La gare est près de l’hôtel.
  pl.a1.unit15.lesson01.teach.bilet:
    title: Billet
    gloss: billet
    note: Il t’en faudra un avant de monter dans un train ou un autobus.
    example_gloss: Le billet coûte vingt zlotys.
  pl.a1.unit15.lesson01.teach.peron:
    title: Quai
    gloss: quai
    note: L’endroit où tu attends ton train.
    example_gloss: Le quai numéro un est là-bas.
  pl.a1.unit15.lesson01.teach.peron_numer_note:
    title: Quai numéro un, deux…
    gloss: 'Pour dire un numéro de quai, tu peux dire Peron numer + nombre : Peron numer jeden, Peron numer dwa.'
    note: 'C’est plus simple qu’il n’y paraît : *peron* + *numer* + un nombre ordinaire que tu connais déjà. (Les annonces en gare utilisent souvent des adjectifs ordinaux, comme *peron pierwszy* – « quai un » –, mais *peron numer jeden* est toujours compris.)'
  pl.a1.unit15.lesson01.teach.pociag_recap:
    title: Le train, encore
    gloss: 'Pociąg odjeżdża o czwartej po południu : tu connais déjà cette phrase grâce à la leçon sur l’heure.'
    note: Exactement la même information que dans l’unité sur l’heure, mais maintenant dans une scène de voyage.
  pl.a1.unit15.lesson01.teach.krakow:
    title: Cracovie
    gloss: Cracovie
    note: 'Une vraie ville polonaise : la première destination de cette unité.'
    example_gloss: Cracovie est loin.
  pl.a1.unit15.lesson01.teach.do_krakowa_note:
    title: Vers Cracovie
    gloss: 'Quand on va quelque part, on dit do + une autre forme du nom de la ville : do Krakowa (et non do Kraków). Retiens cette forme comme un tout.'
    note: 'N’essaie pas de déduire *Krakowa* d’une règle : apprends simplement *do Krakowa* comme une expression figée pour l’instant.'
  pl.a1.unit15.lesson01.teach.bilet_do_krakowa:
    title: Un billet pour Cracovie, s’il vous plaît
    gloss: Un billet pour Cracovie, s’il vous plaît.
    note: La phrase exacte à dire au guichet.
  pl.a1.unit15.lesson01.teach.jechac_note:
    title: To go (by vehicle)
    gloss: 'Jechać (aller en véhicule) : jadę (je vais), jedzie (il/elle va). Demain, je vais à Cracovie. Marek va à Cracovie.'
    note: 'Seulement deux formes pour l’instant : *jadę* pour soi-même, *jedzie* pour quelqu’un d’autre.'
  pl.a1.unit15.lesson01.teach.marek_jedzie:
    title: Marek va à Cracovie
    gloss: Marek va à Cracovie demain.
    note: 'Le voyage de Marek : son histoire se poursuit dans le dialogue de cette unité.'
  pl.a1.unit15.lesson02.teach.autobus:
    title: Autobus
    gloss: autobus
    note: L’autre moyen courant de voyager entre les villes.
    example_gloss: L’autobus est à la gare.
  pl.a1.unit15.lesson02.teach.warszawa:
    title: Varsovie
    gloss: Varsovie
    note: 'La capitale de la Pologne : la deuxième destination de cette unité.'
    example_gloss: Varsovie est loin.
  pl.a1.unit15.lesson02.teach.do_warszawy_note:
    title: Vers Varsovie
    gloss: 'Warszawa change autrement que Kraków : do Warszawy (et non do Warszawa). Chaque ville a sa propre forme : retiens les deux séparément.'
    note: '*Krakowa* et *Warszawy* ne suivent pas le même modèle : c’est pourquoi on apprend chacune à part, et non selon une règle commune.'
  pl.a1.unit15.lesson02.teach.dokad:
    title: Vers où
    gloss: vers où
    note: 'Sert à demander la destination, et non le lieu : différent de « où » quand on demande où se trouve quelque chose.'
    example_gloss: Où va le bus ?
  pl.a1.unit15.lesson02.teach.godzina_recap:
    title: À sept heures, encore
    gloss: Siódmej -- tu connais déjà cette forme de l’heure grâce à la leçon sur l’heure (o siódmej = à sept heures).
    note: Le même modèle de locatif pour l’heure, réutilisé ici pour un horaire de départ.
  pl.a1.unit15.lesson02.teach.autobus_odjezdza:
    title: Le bus pour Varsovie part à sept heures
    gloss: Le bus pour Varsovie part à sept heures.
    note: Réunit les modèles de la destination et de l’heure de cette leçon dans une vraie phrase.
  pl.a1.unit15.lesson02.teach.kiedy_recap:
    title: Quand, encore
    gloss: Kiedy -- tu connais déjà ce mot grâce à la leçon sur les dates. Quand part le bus ?
    note: La question naturelle à poser avant un voyage.
  pl.a1.unit15.lesson02.teach.ewa_jedzie:
    title: Ewa va à Varsovie
    gloss: Ewa va à Varsovie demain.
    note: 'Le voyage d’Ewa : son histoire continue dans le dialogue de cette unité, avec celle de Marek.'
  pl.a1.unit15.lesson03.teach.ja_recap:
    title: Je, encore
    gloss: Ja -- tu connais déjà ce mot grâce aux leçons précédentes.
    note: Un petit rappel avant le dialogue de cette leçon.
  pl.a1.unit15.lesson03.teach.moj_recap:
    title: Mon, encore
    gloss: Mój -- tu connais déjà ce mot grâce à la leçon sur la famille.
    note: Un petit rappel avant le dialogue de cette leçon.
  pl.a1.unit15.lesson03.teach.dziesiatej_rano_note:
    title: À dix heures du matin, encore
    gloss: Dziesiątej et rano -- tu connais déjà ces deux formes grâce à la leçon sur l’heure (o dziesiątej rano = à dix heures du matin).
    note: Un petit rappel avant le dialogue de cette leçon.
  pl.a1.unit15.lesson03.teach.dziekuje_recap:
    title: Merci et à bientôt
    gloss: Dziękuję et Do zobaczenia -- tu les connais déjà grâce aux leçons précédentes.
    note: Un petit rappel avant le dialogue de cette leçon.
  pl.a1.unit15.lesson03.teach.mila_podrozy_note:
    title: Bon voyage !
    gloss: 'Miłej podróży! sert à souhaiter bon voyage à quelqu’un : on l’emploie comme une expression entière, sans la traduire mot à mot.'
    note: 'Une formule d’adieu figée et idiomatique : apprends-la comme un bloc, comme tu as déjà appris *Dzień dobry*.'
  pl.a1.unit15.lesson03.teach.dialogue.line01:
    title: Marek va à Cracovie demain
    gloss: Demain, je vais à Cracovie. Mon train part à quatre heures de l’après-midi.
    note: 'Marek commence par parler de son propre projet de voyage : c’est le même fait que la leçon 1 nous a déjà appris sur lui.'
  pl.a1.unit15.lesson03.teach.dialogue.line02:
    title: Ewa va à Varsovie demain
    gloss: Je vais à Varsovie. Mon bus part à dix heures du matin.
    note: 'Ewa parle de son projet : c’est le même fait que la leçon 2 nous a déjà appris sur elle.'
  pl.a1.unit15.lesson03.teach.dialogue.line03:
    title: Marek souhaite bon voyage à Ewa
    gloss: Bon voyage !
    note: Marek utilise l’expression idiomatique de cette leçon pour souhaiter bonne route à Ewa.
  pl.a1.unit15.lesson03.teach.dialogue.line04:
    title: Ewa remercie Marek et lui dit au revoir
    gloss: Merci ! À bientôt !
    note: Une fin de conversation simple et familière.
