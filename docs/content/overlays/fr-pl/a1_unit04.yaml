teaching:
  pl.a1.unit04.lesson01.teach.pierwsza_druga_trzecia:
    title: Une, deux, trois heures
    gloss: une heure ; deux heures ; trois heures
    note: 'Le polonais donne l’heure avec des nombres ordinaux féminins, accordés avec le nom féminin sous-entendu *godzina* (heure) : *pierwsza* signifie littéralement « la première (heure) ».'
    example_gloss:
    - Il est une heure.
    - Il est deux heures.
    - Il est trois heures.
  pl.a1.unit04.lesson01.teach.czwarta_piata_szosta:
    title: Quatre, cinq, six heures
    gloss: quatre heures ; cinq heures ; six heures
    note: Même schéma d’ordinaux féminins que *pierwsza*, *druga*, *trzecia*.
    example_gloss:
    - Il est quatre heures.
    - Il est cinq heures.
    - Il est six heures.
  pl.a1.unit04.lesson01.teach.siodma_osma_dziewiata:
    title: Sept, huit, neuf heures
    gloss: sept heures ; huit heures ; neuf heures
    note: Les trois heures du milieu des douze, selon le même schéma.
    example_gloss:
    - Il est sept heures.
    - Il est huit heures.
    - Il est neuf heures.
  pl.a1.unit04.lesson01.teach.dziesiata_jedenasta_dwunasta:
    title: Dix, onze, douze heures
    gloss: dix heures ; onze heures ; douze heures
    note: Les trois dernières heures, qui complètent la série de 1 à 12.
    example_gloss:
    - Il est dix heures.
    - Il est onze heures.
    - Il est midi.
  pl.a1.unit04.lesson01.teach.ktora_jest_godzina:
    title: Demander l’heure
    gloss: Quelle heure est-il ?
    note: 'Littéralement « quelle est l’heure ? » : *która* s’accorde avec le nom féminin *godzina*, le même accord que tu retrouveras dans toute cette unité.'
  pl.a1.unit04.lesson01.teach.godzina_note:
    title: Godzina est féminin
    gloss: On dit pierwsza, druga, trzecia, et non pierwszy, drugi, trzeci.
    note: '*Pierwszy*, *drugi*, *trzeci* sont les formes masculines de ces mêmes ordinaux, employées ailleurs en polonais avec des noms masculins, mais jamais pour dire l’heure, car *godzina* est féminin.'
  pl.a1.unit04.lesson02.teach.rano_poludnie_popoludniu:
    title: Matin, midi, après-midi
    gloss: le matin ; à midi ; l’après-midi
    note: '*Rano* s’emploie seul (sans préposition) ; *w południe* et *po południu* gardent chacun leur préposition fixe. Mieux vaut apprendre ces trois expressions par cœur comme des locutions toutes faites plutôt que chercher une règle générale.'
    example_gloss:
    - Le matin, je bois du café.
    - Je déjeune à midi.
    - Je travaille l’après-midi.
  pl.a1.unit04.lesson02.teach.wieczorem_w_nocy:
    title: Soir, nuit
    gloss: le soir ; la nuit
    note: '*Wieczorem* est une forme adverbiale figée (sans préposition) ; *w nocy* associe *w* au locatif de *noc* (nuit).'
    example_gloss:
    - Le soir, je regarde la télé.
    - La nuit, je dors.
  pl.a1.unit04.lesson02.teach.o_ktorej_godzinie:
    title: Demander à quelle heure
    gloss: À quelle heure ?
    note: Utilise cette question à la place de *Która jest godzina?* quand tu demandes à quel moment quelque chose aura lieu, et non l’heure qu’il est maintenant.
  pl.a1.unit04.lesson02.teach.locative_hour_note:
    title: Dire « à » une heure
    gloss: Quatre heures, sept heures, dix heures – mais à quatre heures, à sept heures, à dix heures.
    note: 'Après *o* (« à »), le *-a* final du mot de l’heure devient *-ej* : *czwarta* → *o czwartej*, *siódma* → *o siódmej*, *dziesiąta* → *o dziesiątej*. Toutes les heures suivent ce même schéma ; seule petite particularité d’orthographe : *druga* → *o drugiej*, avec un *i* après le *g*.'
  pl.a1.unit04.lesson02.teach.ewa_wstaje:
    title: Ewa se lève tôt
    gloss: Ewa se lève à 7 heures du matin.
    note: '*Wstaje* est la troisième personne du singulier de *wstawać* (se lever).'
  pl.a1.unit04.lesson02.teach.pociag_odjezdza:
    title: L’heure de départ du train
    gloss: Le train part à 4 heures de l’après-midi.
    note: '*Odjeżdża* est la troisième personne du singulier de *odjeżdżać* (partir, quitter un lieu en véhicule).'
  pl.a1.unit04.lesson03.teach.spotkanie:
    title: Réunion, rendez-vous
    gloss: réunion, rendez-vous
    note: C’est le mot que tu as déjà vu dans l’unité 3 (*Kiedy jest spotkanie?*), quand Ewa et Marek se sont mis d’accord sur un jour et une date pour se revoir.
    example_gloss: La réunion a lieu vendredi.
  pl.a1.unit04.lesson03.teach.o_ktorej_mozemy_sie_spotkac:
    title: Demander à quelle heure se retrouver
    gloss: À quelle heure pouvons-nous nous retrouver vendredi 15 mai ?
    note: 'Cette phrase combine *o której godzinie* de cette unité avec le jour et la date de l’unité 3 : Ewa et Marek ont déjà choisi vendredi 15 mai et doivent maintenant fixer l’heure exacte.'
  pl.a1.unit04.lesson03.teach.moze_o_czwartej:
    title: Proposer une heure
    gloss: Peut-être à 4 heures de l’après-midi ?
    note: '*Może* seul signifie « peut-être » : c’est une façon naturelle et douce de suggérer une heure.'
  pl.a1.unit04.lesson03.teach.czwarta_mi_odpowiada:
    title: Confirmer qu’une heure convient
    gloss: 4 heures de l’après-midi, ça me convient.
    note: 'Même structure *[time] + mi + odpowiada* que dans *Piątek mi odpowiada* de l''unité 3 : l''heure elle-même est le sujet grammatical, et *odpowiadać* met toujours la personne au datif (*mi*, « à moi »).'
  pl.a1.unit04.lesson03.teach.do_zobaczenia_o_czwartej:
    title: Confirmer le programme complet
    gloss: À bientôt, le 15 mai à 4 heures !
    note: On réutilise la formule d’au revoir *Do zobaczenia* de l’unité 1, cette fois avec une date et une heure.
  pl.a1.unit04.lesson03.teach.dialogue.line01:
    title: Ewa demande une heure
    gloss: Ewa demande à Marek à quelle heure ils peuvent se retrouver vendredi 15 mai.
    note: C’est exactement la question qui ouvre cette leçon.
  pl.a1.unit04.lesson03.teach.dialogue.line02:
    title: Marek propose 16 h
    gloss: Marek suggère 4 heures de l’après-midi.
    note: 'C’est une suggestion douce, pas une affirmation ferme : c’est ce que marque *może*.'
  pl.a1.unit04.lesson03.teach.dialogue.line03:
    title: Ewa confirme
    gloss: Ewa dit que 4 heures de l’après-midi lui conviennent.
    note: C’est la même construction avec le datif que dans l’échange de l’unité 3 sur le vendredi qui convient.
  pl.a1.unit04.lesson03.teach.dialogue.line04:
    title: Marek conclut le programme
    gloss: Marek dit que c’est parfait et donne rendez-vous le 15 mai à 4 heures !
    note: '*Świetnie* reprend l’exclamation d’enthousiasme de l’unité 3.'
  pl.a1.unit04.lesson03.teach.dialogue.line05:
    title: Ewa dit au revoir
    gloss: Ewa dit au revoir à son tour.
    note: 'La clôture la plus courte possible : juste la formule d’au revoir.'
