  pl.a1.unit26.lesson06.ptak_niny:
    title: L’oiseau de Nina
teaching:
  pl.a1.unit26.lesson01.teach.zwierze_zwierzak:
    title: Un animal, un animal de compagnie
    gloss: l’animal / un animal de compagnie
    note: '*Zwierzę* est le mot général pour « animal » ; *zwierzak* est le mot courant pour « animal de compagnie ».'
    example_gloss:
    - Un chien est un animal.
    - Un chien est aussi un animal de compagnie.
  pl.a1.unit26.lesson01.teach.pies_kot:
    title: Le chien et le chat
    gloss: le chien / le chat
    example_gloss:
    - Ewa a un chien.
    - Tomek a un chat.
  pl.a1.unit26.lesson01.teach.ryba_ptak:
    title: Le poisson et l’oiseau
    gloss: le poisson / l’oiseau
    example_gloss:
    - Grand-père a un poisson.
    - Nina a un oiseau.
  pl.a1.unit26.lesson01.teach.masz_zwierzaka:
    title: As-tu un animal de compagnie ?
    gloss: As-tu un animal de compagnie ?
    note: C’est le même modèle de question *Masz ...?* que tu connais déjà des unités précédentes ; *masz* est la forme de *ty* du verbe *mieć*.
  pl.a1.unit26.lesson01.teach.tak_mam_psa:
    title: Oui, j’ai un chien
    gloss: Oui, j’ai un chien.
    note: Une réponse affirmative simple qui utilise le nouveau vocabulaire de cette unité.
  pl.a1.unit26.lesson01.teach.nie_nie_mam:
    title: Non, je n’ai pas d’animal de compagnie
    gloss: Non, je n’ai pas d’animal de compagnie.
    note: '*Nie mam* + génitif nie ce que l’on n’a pas : *zwierzaka*. Voir la note de grammaire.'
  pl.a1.unit26.lesson01.teach.nie_mam_czasu:
    title: Nie mam + génitif
    gloss: 'Après *nie mam*, le complément se met au génitif : *Nie mam czasu* (je n’ai pas le temps) et ici *Nie mam zwierzaka* (je n’ai pas d’animal).'
    note: On réutilise le modèle de *Nie mam czasu* ; seul le nom est nouveau. Les noms masculins animés comme *zwierzak* ont la même forme à l’accusatif et au génitif, alors que les noms féminins changent (*Mam rybę* devient *Nie mam ryby*).
  pl.a1.unit26.lesson02.teach.wyprowadzac_na_spacer:
    title: Promener un animal
    gloss: promener un animal
    note: '*Wyprowadzać na spacer* est l’expression consacrée pour promener un animal ; le verbe est imperfectif parce qu’il s’agit d’une habitude. Voir la note de grammaire.'
    example_gloss: Je promène le chien tous les jours.
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa:
    title: L’imperfectif pour les habitudes
    gloss: '*Wyprowadzać* (imperfectif) exprime une habitude : *Codziennie wyprowadzam psa.* Le perfectif *wyprowadzić* s’emploie pour une promenade précise et terminée.'
    note: 'Couples d’aspect : l’imperfectif (*wyprowadzać*) sert pour ce qui se répète, le perfectif (*wyprowadzić*) pour une action unique et achevée.'
  pl.a1.unit26.lesson02.teach.karmic:
    title: Donner à manger
    gloss: donner à manger
    example_gloss: Je donne à manger au chat tous les jours.
  pl.a1.unit26.lesson02.teach.bawic_sie_z:
    title: Jouer avec
    gloss: jouer avec
    example_gloss: Tomek joue avec son chat.
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa_2:
    title: Je promène le chien tous les jours
    gloss: Je promène le chien tous les jours.
    note: Associe *wyprowadzać na spacer* à *codziennie* (tous les jours) ; le complément *psa* est à l’accusatif.
  pl.a1.unit26.lesson02.teach.codziennie_karmie_kota:
    title: Je donne à manger au chat tous les jours
    gloss: Je donne à manger au chat tous les jours.
    note: '*Karmić* (nourrir) se construit avec l’accusatif de l’animal : *karmię kota*. Ici, il est associé à *codziennie*.'
  pl.a1.unit26.lesson03.teach.liczba_mnoga_pies:
    title: 'Pluriel : pies, psy'
    gloss: 'Pluriel : *pies* devient *psy*, *kot* devient *koty*, *ryba* devient *ryby*, *ptak* devient *ptaki*. La plupart des pluriels se terminent en *-y*, ou en *-i* après k et g.'
    note: Le modèle régulier du pluriel polonais, présenté ici pour la première fois avec des noms d’animaux comme exemples.
  pl.a1.unit26.lesson03.teach.psy_koty:
    title: Les chiens et les chats
    gloss: chiens / chats
    example_gloss:
    - Marek adore les chiens.
    - Kasia adore les chats.
  pl.a1.unit26.lesson03.teach.ryby_ptaki:
    title: Les poissons et les oiseaux
    gloss: poissons / oiseaux
    example_gloss:
    - J’adore les poissons.
    - Grand-père adore les oiseaux.
  pl.a1.unit26.lesson03.teach.kocham_zwierzeta:
    title: J’adore les animaux
    gloss: J’adore les animaux.
    note: '*Kocham* est la forme de *ja* du verbe *kochać* ; son complément *zwierzęta* est à l’accusatif pluriel.'
  pl.a1.unit26.lesson03.teach.kasia_kocha_koty:
    title: Kasia adore les chats, mais n’a pas d’animal
    gloss: Kasia adore les chats, mais elle n’a pas d’animal.
    note: Cette phrase souligne la différence entre adorer un animal et en avoir un.
  pl.a1.unit26.lesson04.teach.marek_masz_zwierzaka:
    title: Marek demande si elle a un animal
    gloss: 'Marek : Tu as un animal, Ewa ?'
  pl.a1.unit26.lesson04.teach.ewa_tak_mam:
    title: Ewa a un chien
    gloss: 'Ewa : Oui, j’ai un chien.'
  pl.a1.unit26.lesson04.teach.marek_jak_on:
    title: Marek demande à quoi il ressemble
    gloss: 'Marek : Il est comment ?'
    note: On réutilise la question *Jak wygląda ...?* d’une leçon précédente, cette fois à propos d’un animal ; *on* peut désigner un chien.
  pl.a1.unit26.lesson04.teach.ewa_ma_brazowa:
    title: Ewa décrit son chien
    gloss: 'Ewa : Il a le poil brun et il est petit.'
    note: On réutilise le vocabulaire de la couleur des cheveux et de la taille, étudié pour décrire l’apparence, mais cette fois pour parler du pelage d’un animal.
  pl.a1.unit26.lesson04.teach.zwierzeta_maja_rodzaj:
    title: On et ona pour les animaux
    gloss: 'Les animaux ont un genre grammatical : *on* (il) pour *pies* et *kot*, *ona* (elle) pour *ryba*. Ces pronoms peuvent désigner un animal, pas seulement une personne.'
    note: 'Le pronom suit le genre du nom : *pies* et *ptak* prennent *on*, *ryba* prend *ona*, et *zwierzę* prend *ono*.'
  pl.a1.unit26.lesson04.teach.marek_codziennie_wyprowadzasz:
    title: Marek interroge Ewa sur les promenades
    gloss: 'Marek : Tu le promènes tous les jours ?'
  pl.a1.unit26.lesson04.teach.ewa_tak_codziennie:
    title: Ewa décrit sa routine
    gloss: 'Ewa : Oui, je le promène tous les jours et je le nourris.'
  pl.a1.unit26.lesson05.teach.marek_i_kasia:
    title: Marek, Kasia et Tomek parlent des animaux
    gloss: 'Marek et Kasia adorent tous les deux les animaux, mais aucun des deux n’a d’animal de compagnie. Marek adore les chiens et Kasia adore les chats. Tomek, lui, a un animal : un chat. Il joue souvent avec son chat et le nourrit tous les jours. Et toi, as-tu un animal ?'
    note: Ce texte met en contraste le fait d’adorer un animal et celui d’en avoir réellement un.
    glosses:
      kochają: adorer
      oboje: tous les deux
      zwierzęta: animaux
      zwierzaka: animal de compagnie
      psy: chiens
      koty: chats
      kota: chat
      bawi: joue
      daje: donne
      co: tous les
      jeść: nourriture
  pl.a1.unit26.lesson05.teach.tomek_czesto_bawi:
    title: Tomek joue souvent avec son chat
    gloss: Tomek joue souvent avec son chat.
    note: '*Bawić się z* (jouer avec) se construit avec l’instrumental : *z kotem*. *Często* est l’adverbe de fréquence pour « souvent ».'
  pl.a1.unit26.lesson05.teach.kocham_psy_nie:
    title: J’adore les chiens. Je n’ai pas d’animal de compagnie.
    gloss: J’adore les chiens. Je n’ai pas d’animal de compagnie.
    note: Un modèle de réponse en deux phrases, prêt à être réutilisé pour l’exercice d’expression écrite de cette unité.
  pl.a1.unit26.lesson06.teach.ewa_nino_ty:
    title: Ewa interroge Nina
    gloss: 'Ewa : Nina, toi aussi, tu as un animal ?'
  pl.a1.unit26.lesson06.teach.nina_tak_mam:
    title: Nina a un oiseau qui s’appelle Pico
    gloss: 'Nina : Oui, j’ai un oiseau. Il s’appelle Pico.'
    note: '*Ma na imię* (s’appelle) est la même expression que celle utilisée plus tôt pour donner un prénom.'
  pl.a1.unit26.lesson06.teach.marek_jak_milo:
    title: Marek réagit
    gloss: 'Marek : Comme c’est sympa ! Qu’est-ce que tu fais avec lui tous les jours ?'
  pl.a1.unit26.lesson06.teach.nina_codziennie_go:
    title: Nina le nourrit tous les jours
    gloss: 'Nina : Je le nourris tous les jours.'
  pl.a1.unit26.lesson06.teach.marek_ja_tez:
    title: Marek adore aussi les oiseaux
    gloss: 'Marek : Moi aussi, j’adore les oiseaux.'
  pl.a1.unit26.lesson06.teach.ewa_fajnie_ze:
    title: Ewa conclut la conversation
    gloss: 'Ewa : C’est chouette que nous trois, nous adorions les animaux !'
    note: Cette phrase réunit ce que les trois personnages ont dit sur les animaux dans cette unité.
