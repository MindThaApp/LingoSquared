answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Polonais A1
  description: 'Polonais débutant pour décrire l’apparence physique d’une personne : impressions de taille et d’âge, couleur des cheveux et des yeux, la question clé Jak wygląda ...? et la comparaison de l’apparence de deux personnes.'
units:
  pl.a1.unit25.wyglad:
    title: Décrire l’apparence physique
lessons:
  pl.a1.unit25.lesson01.wysoki_niski_stary_i:
    title: Grand, petit, âgé et jeune
  pl.a1.unit25.lesson02.opisywanie_wlosow:
    title: Décrire les cheveux
  pl.a1.unit25.lesson03.oczy_i_jak_ktos:
    title: Les yeux et demander à quoi ressemble quelqu’un
  pl.a1.unit25.lesson04.ewa_opisuje_nine:
    title: Ewa décrit Nina
  pl.a1.unit25.lesson05.porownanie_tomka_i_kasi:
    title: Comparer Tomek et Kasia
  pl.a1.unit25.lesson06.marek_rozpoznaje_nine:
    title: Marek reconnaît Nina
teaching:
  pl.a1.unit25.lesson01.teach.wysoki_niski:
    title: Grand et petit
    gloss: grand / petit
    note: '*Wysoki* décrit une personne grande et *niski* une personne petite. Pour une femme, on dit *wysoka* ou *niska*.'
    example_gloss:
    - Kasia est grande.
    - Tomek est petit.
  pl.a1.unit25.lesson01.teach.stary_mlody:
    title: Âgé et jeune
    gloss: âgé / jeune
    note: '*Stary* et *młody* décrivent ici une impression générale, pas un nombre d’années précis.'
    example_gloss:
    - Grand-père est âgé.
    - Marek est jeune.
  pl.a1.unit25.lesson01.teach.dziadek_jest_stary:
    title: 'Stary : impression ou âge'
    gloss: '*Stary* décrit une impression générale, comme dans *Dziadek jest stary*. Pour donner un âge précis, le polonais utilise une autre structure : *Ile masz lat?*'
    note: Pour dire si quelqu’un paraît vieux ou jeune, on utilise *stary* ou *młody* ; pour un âge précis, on demande *Ile masz lat?* et on répond *mam ... lat* (j’ai ... ans).
  pl.a1.unit25.lesson01.teach.kasia_jest_wysoka:
    title: Kasia est grande et Tomek est petit
    gloss: Kasia est grande et Tomek est petit.
    note: Une phrase composée simple avec *a* (et, pour marquer un contraste). *Wysoka* et *niski* s’accordent avec un sujet féminin et un sujet masculin, ce qui prépare la comparaison de la leçon 5.
  pl.a1.unit25.lesson02.teach.wlosy:
    title: Les cheveux
    gloss: les cheveux
    note: '*Włosy* est toujours au pluriel en polonais : *długie włosy* (les cheveux longs).'
    example_gloss: Marek a les cheveux courts et noirs.
  pl.a1.unit25.lesson02.teach.blond_brazowe_siwe:
    title: Blond, châtain et gris
    gloss: blond / châtain / gris
    note: Trois couleurs de cheveux. *Blond* ne change jamais ; *brązowe* et *siwe* sont des formes du pluriel pour s’accorder avec *włosy*.
    example_gloss:
    - Ewa a les cheveux blonds.
    - Tomek a les cheveux bruns.
    - Grand-père a les cheveux gris.
  pl.a1.unit25.lesson02.teach.dlugie_krotkie:
    title: Cheveux longs et courts
    gloss: long / court (cheveux)
    note: '*Długie* (longs) et *krótkie* (courts) sont des formes du pluriel pour s’accorder avec *włosy*.'
    example_gloss:
    - Kasia a les cheveux longs.
    - Tomek a les cheveux courts.
  pl.a1.unit25.lesson02.teach.wlosy_sa_w:
    title: Włosy se construit avec des adjectifs au pluriel
    gloss: '*Włosy* est au pluriel, donc l’adjectif l’est aussi : cheveux longs, cheveux courts, cheveux bruns, cheveux noirs.'
    note: 'Les noms pluriels qui ne désignent pas des hommes prennent des adjectifs en *-e* : *długie włosy*. *Blond* fait exception : il ne change jamais (*blond włosy*).'
  pl.a1.unit25.lesson02.teach.wlosy_maja_tylko:
    title: 'Włosy : toujours au pluriel'
    gloss: '*Włosy* (les cheveux) est toujours au pluriel : *jej włosy są długie* (ses cheveux sont longs, littéralement « ses cheveux sont longs » avec un verbe au pluriel). *Jej* signifie « son/sa » (à elle).'
    note: 'En polonais, « cheveux » est un nom pluriel : le verbe et les adjectifs s’accordent donc au pluriel. *Jej* (« son/sa », à elle) ne change jamais, quel que soit le nombre de choses qu’elle possède.'
  pl.a1.unit25.lesson02.teach.marek_ma_krotkie:
    title: Marek a les cheveux courts et noirs
    gloss: Marek a les cheveux courts et noirs.
    note: '*Czarne* (noirs) est la forme du pluriel pour s’accorder avec *włosy*.'
  pl.a1.unit25.lesson02.teach.ewa_ma_dlugie:
    title: Ewa a de longs cheveux blonds
    gloss: Ewa a de longs cheveux blonds.
    note: Combine le vocabulaire de la longueur et de la couleur de cette leçon dans une phrase naturelle.
  pl.a1.unit25.lesson03.teach.oczy:
    title: Les yeux
    gloss: les yeux
    note: '*Oczy* est le pluriel de *oko* ; en polonais, on parle généralement des deux yeux au pluriel.'
    example_gloss: Marek a les yeux marron.
  pl.a1.unit25.lesson03.teach.niebieski_brazowy_zielony:
    title: Bleu, marron et vert
    gloss: bleu / marron / vert
    note: 'Trois couleurs d’yeux, au pluriel pour s’accorder avec *oczy* : *niebieskie*, *brązowe*, *zielone*.'
    example_gloss:
    - Ewa a les yeux bleus.
    - Tomek a les yeux marron.
    - Kasia a les yeux verts.
  pl.a1.unit25.lesson03.teach.oczy_sa_w:
    title: Oczy prend -e
    gloss: '*Oczy* est un pluriel, donc l’adjectif se termine en *-e* : des yeux bleus, des yeux marron, des yeux verts.'
    note: 'La même terminaison du pluriel que pour *włosy* dans la leçon 2 : *niebieskie oczy*, *brązowe oczy*, *zielone oczy*.'
  pl.a1.unit25.lesson03.teach.jak_wyglada_ewa:
    title: Comment est Ewa ?
    gloss: Comment est Ewa physiquement ?
    note: '*Jak wygląda ...?* est la question centrale de cette unité ; tu peux la réutiliser pour demander l’apparence de n’importe qui.'
  pl.a1.unit25.lesson03.teach.ewa_ma_dlugie:
    title: Ewa a de longs cheveux blonds et des yeux bleus
    gloss: Ewa a de longs cheveux blonds et des yeux bleus.
    note: Une réponse modèle qui réunit cheveux et yeux dans une seule phrase avec *i* (et).
  pl.a1.unit25.lesson04.teach.ewa_do_kawiarni:
    title: Ewa présente Nina
    gloss: 'Ewa : Une nouvelle fille vient au café linguistique. Elle s’appelle Nina.'
    note: '*Przychodzi* (vient) introduit une personne nouvelle dans la scène ; *do kawiarni językowej* utilise *do* + génitif.'
  pl.a1.unit25.lesson04.teach.marek_okej_jak:
    title: Marek demande à quoi elle ressemble
    gloss: 'Marek : D’accord ! Elle est comment ?'
    note: Reprise de la question centrale de l’unité, cette fois avec *ona* (elle) au lieu d’un prénom.
  pl.a1.unit25.lesson04.teach.ewa_jest_niska:
    title: Ewa décrit la taille et les cheveux de Nina
    gloss: 'Ewa : Elle est petite et elle a les cheveux courts et blonds.'
    note: Associe *niska* de la leçon 1 (le féminin de *niski*) au vocabulaire des cheveux de la leçon 2.
  pl.a1.unit25.lesson04.teach.marek_a_jej:
    title: Marek demande comment sont ses yeux
    gloss: 'Marek : Et ses yeux ?'
    note: 'Ici *jej* est le possessif « son/sa » (d’une femme) : *jej oczy* signifie « ses yeux » ; *jej* ne change jamais.'
  pl.a1.unit25.lesson04.teach.ewa_ma_zielone:
    title: Ewa décrit les yeux de Nina
    gloss: 'Ewa : Elle a les yeux verts.'
    note: Reprise de *zielone oczy* de la leçon 3.
  pl.a1.unit25.lesson04.teach.marek_dzieki_wtedy:
    title: Marek la reconnaîtra
    gloss: 'Marek : Merci ! Comme ça, je la reconnaîtrai.'
    note: '*Rozpoznam* est le futur perfectif (« je reconnaîtrai ») ; *ją* est l’accusatif de *ona* (la).'
  pl.a1.unit25.lesson05.teach.tomek_i_kasia:
    title: Comparaison de Tomek et Kasia
    gloss: Tomek et Kasia sont frère et sœur, mais ils ne se ressemblent pas. Tomek est petit, il a les cheveux courts et châtains et les yeux marron. Kasia est plus grande que Tomek et elle a les cheveux longs et châtains et les yeux verts. Et toi, à quoi ressembles-tu ?
    note: Une courte comparaison qui réutilise tous les mots de couleur et de longueur appris jusqu’ici et se termine par la question essentielle de l’unité, adressée au lecteur.
    glosses:
      brat: frère
      siostra: sœur
      wyglądają: apparence
      inaczej: différent
      niski: petit
      krótkie: petit
      brązowe: châtain
      włosy: cheveux
      oczy: yeux
      wyższa: plus grand
      długie: long
      zielone: vert
      wyglądasz: tu as l’air, tu ressembles à (forme familière), pour parler de l’apparence
  pl.a1.unit25.lesson05.teach.stopien_wyzszy_wysoki:
    title: Réutiliser le comparatif
    gloss: 'Comparatif : *wysoki* (grand) devient *wyższy* (plus grand), et la personne comparée vient après *niż* (que) : Kasia est plus grande que Tomek.'
    note: 'Le polonais forme le comparatif en changeant la terminaison de l’adjectif, qui s’accorde toujours en genre : *wyższa* pour Kasia (féminin).'
  pl.a1.unit25.lesson05.teach.kasia_ma_dluzsze:
    title: Kasia a les cheveux plus longs que Tomek
    gloss: Kasia a les cheveux plus longs que Tomek.
    note: '*Dłuższe* (plus longs) est au pluriel pour s’accorder avec *włosy*, et *niż* (que) introduit la comparaison.'
  pl.a1.unit25.lesson05.teach.mam_krotkie_brazowe:
    title: J’ai les cheveux courts et châtains
    gloss: J’ai les cheveux courts et châtains.
    note: Une phrase modèle à la première personne avec *Mam ...*, à réutiliser pour décrire ta propre apparence.
  pl.a1.unit25.lesson06.teach.marek_patrz_czy:
    title: Marek repère Nina
    gloss: 'Marek : Regarde, c’est Nina ? Elle a les cheveux courts et blonds et les yeux verts.'
    note: '*Patrz* (regarde) est l’impératif de *patrzeć*. *Czy to Nina?* signifie « C’est Nina ? »'
  pl.a1.unit25.lesson06.teach.ewa_tak_to:
    title: Ewa confirme
    gloss: 'Ewa : Oui, c’est Nina !'
    note: Une confirmation courte et naturelle.
  pl.a1.unit25.lesson06.teach.nina_czesc_jestes:
    title: Nina salue Marek
    gloss: 'Nina : Salut, tu es Marek ?'
    note: 'Une simple question de salutation familière. Après *być*, un prénom se met à l’instrumental : *jesteś Markiem?*'
  pl.a1.unit25.lesson06.teach.marek_tak_milo:
    title: Marek salue Nina en retour
    gloss: 'Marek : Oui ! Enchanté de te rencontrer, Nina.'
    note: '*Miło cię poznać* est la formule habituelle d’une première rencontre (« enchanté » ; *poznać* signifie « faire la connaissance de »). Nina est au vocatif : *Nino*.'
  pl.a1.unit25.lesson06.teach.nina_ciebie_tez:
    title: Nina lui répond
    gloss: 'Nina : Enchantée de faire ta connaissance, moi aussi !'
    note: 'Fin du dialogue : Marek a bien reconnu Nina grâce à la description d’Ewa.'
