teaching:
  pl.a1.unit17.lesson01.teach.jestem_zawod_note:
    title: Je suis ingénieur / professeure
    gloss: Je suis ingénieur. Je suis professeure. -- « inżynier » et « nauczycielka » changent de terminaison après « Jestem ».
    note: C’est la première fois dans ce cours que la terminaison d’un mot change pour indiquer le métier ; pour l’instant, cela ne concerne que ces deux mots de métier.
  pl.a1.unit17.lesson01.teach.inzynier:
    title: Ingénieur
    gloss: ingénieur
    note: Dans la langue courante, ce mot reste normalement *inżynier* aussi pour une femme.
    example_gloss: Marek est ingénieur.
  pl.a1.unit17.lesson01.teach.nauczyciel_nauczycielka:
    title: Professeure
    gloss: professeur (masculin) / professeure (féminin)
    note: 'Contrairement à *inżynier*, ce nom de métier change selon le genre : *nauczyciel* pour un homme, *nauczycielka* pour une femme.'
    example_gloss:
    - Il est professeur.
    - Ewa est professeure.
  pl.a1.unit17.lesson01.teach.marek_ewa_recap:
    title: Marek et Ewa, encore
    gloss: Marek, Ewa -- tu connais déjà ces prénoms grâce aux leçons précédentes.
    note: Un petit rappel avant que cette leçon n’utilise les deux.
  pl.a1.unit17.lesson01.teach.jest_recap:
    title: Est -- encore
    gloss: Jest -- tu connais déjà ce mot grâce aux leçons précédentes, par exemple « Dom jest tam » (la maison est là-bas).
    note: Un petit rappel avant que cette leçon l’utilise pour parler du métier de quelqu’un.
  pl.a1.unit17.lesson01.teach.marek_jest_inzynierem:
    title: Le métier de Marek
    gloss: Marek est ingénieur.
    note: Le fait sur lequel repose toute cette unité pour Marek.
  pl.a1.unit17.lesson01.teach.ewa_jest_nauczycielka:
    title: Le métier d’Ewa
    gloss: Ewa est professeure.
    note: Le fait sur lequel repose toute cette unité pour Ewa.
  pl.a1.unit17.lesson02.teach.pracowac_recap_pracujesz:
    title: Travailler -- tu travailles
    gloss: 'Pracować (tu connais déjà pracuję grâce aux leçons précédentes) : pracuję (je), pracujesz (tu). Où travailles-tu ?'
    note: 'Seulement deux formes pour l’instant : *pracuję* pour parler de toi, *pracujesz* pour interroger quelqu’un d’autre, comme pour *czuć się* dans l’unité précédente.'
  pl.a1.unit17.lesson02.teach.szkola:
    title: École
    gloss: école
    note: L’endroit où travaille une professeure comme Ewa.
    example_gloss: Je travaille dans une école.
  pl.a1.unit17.lesson02.teach.biuro:
    title: Bureau
    gloss: bureau
    note: L’endroit où travaille un ingénieur comme Marek.
    example_gloss: Je travaille dans un bureau.
  pl.a1.unit17.lesson02.teach.w_miejsce_pracy_note:
    title: À l’école, au bureau
    gloss: 'W + lieu de travail : w szkole, w biurze -- comme w Warszawie ou w Krakowie.'
    note: 'C’est le même principe que pour les noms de villes déjà appris (*w Warszawie*, *w Krakowie*) : la terminaison change un peu pour dire *dans/à* cet endroit.'
  pl.a1.unit17.lesson02.teach.gdzie_pracujesz_phrase:
    title: Où travailles-tu ?
    gloss: Où travailles-tu ?
    note: La question naturelle pour s’informer sur le travail de quelqu’un.
  pl.a1.unit17.lesson03.teach.a_ty_recap:
    title: Et toi -- encore
    gloss: A ty -- tu connais déjà cette expression grâce aux leçons précédentes.
    note: Un petit rappel avant le dialogue de cette leçon.
  pl.a1.unit17.lesson03.teach.dialogue.line01:
    title: Marek interroge Ewa sur son travail
    gloss: Où travailles-tu, Ewa ?
    note: Marek ouvre la conversation par une question directe.
  pl.a1.unit17.lesson03.teach.dialogue.line02:
    title: Ewa répond
    gloss: Je travaille dans une école. Je suis professeure.
    note: Ewa indique son lieu de travail et son métier -- les mêmes faits que ceux vus plus tôt dans cette unité.
  pl.a1.unit17.lesson03.teach.dialogue.line03:
    title: Ewa renvoie la question à Marek
    gloss: Et toi, Marek ? Où travailles-tu ?
    note: Ewa retourne la question à Marek.
  pl.a1.unit17.lesson03.teach.dialogue.line04:
    title: Marek répond
    gloss: Je travaille dans un bureau. Je suis ingénieur.
    note: Marek indique son lieu de travail et son métier -- les mêmes faits que ceux vus plus tôt dans cette unité.
