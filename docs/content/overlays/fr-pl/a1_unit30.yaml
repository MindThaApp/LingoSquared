  pl.a1.unit30.lesson05.teach.tomek_nie_tylko:
    title: Qui étudie quoi ?
    gloss: Tomek ne fait pas que travailler, il étudie aussi. Il suit un cours d’espagnol au centre d’éducation pour adultes. Chaque semaine, il apprend de nouveaux mots. Kasia suit une filière dans un établissement d’enseignement supérieur. Elle y étudie les soins de santé. Tous les deux aiment étudier. Et toi, qu’étudies-tu, ou qu’est-ce que tu voudrais apprendre ?
    note: Compare les études de Tomek et de Kasia, sur le modèle de la lecture comparative de l’unité sur la technologie.
