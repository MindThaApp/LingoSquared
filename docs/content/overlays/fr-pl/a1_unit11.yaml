teaching:
  pl.a1.unit11.lesson01.teach.chciec_chce:
    title: Vouloir, je veux
    gloss: vouloir ; je veux
    note: Chcieć est l'infinitif ; chcę est la forme courante à la première personne, celle que tu utiliseras pour dire ce que tu veux.
    example_gloss: Je veux aller au cinéma.
  pl.a1.unit11.lesson01.teach.chcesz:
    title: Tu veux
    gloss: tu veux (tutoiement)
    note: Chcesz est la forme de « tu » (tutoiement), employée comme masz et jesteś -- exactement ce qu'il te faut pour demander à un ami ce qu'il veut.
    example_gloss: Tu veux du café ?
  pl.a1.unit11.lesson01.teach.chciec_osoba_note:
    title: Je veux, tu veux
    gloss: 'Chcę, chcesz -- même schéma que masz (avoir) et jesteś (être) : chcesz est la forme « tu » (deuxième personne), utilisée pour demander à quelqu''un d''autre ce qu''il veut.'
    note: Cette unité demande un peu plus que « je » -- *chcę* (je veux) et *chcesz* (tu veux) suivent exactement le même schéma de personne que *masz* et *jesteś*, que tu connais déjà, appliqué à un nouveau verbe.
  pl.a1.unit11.lesson01.teach.kino:
    title: Cinéma
    gloss: cinéma
    note: 'Le mot courant pour dire « cinéma » : il revient sans cesse quand on fait des projets.'
    example_gloss: Voici le cinéma.
  pl.a1.unit11.lesson01.teach.razem:
    title: Ensemble
    gloss: ensemble
    note: 'Razem signifie aussi « total » quand on fait des achats (tu t’en souviens peut-être dans l’unité sur les courses). Ici, il a son autre sens courant : « ensemble ».'
    example_gloss: Tu veux y aller ensemble ?
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_do_kina:
    title: Tu veux aller au cinéma ?
    gloss: Tu veux aller au cinéma ?
    note: 'Czy introduit une question fermée (oui/non) ; chcesz iść do kina demande ce que l’autre a envie de faire : c’est la façon de base de proposer un projet.'
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_razem_do_kina_w_piatek:
    title: Tu veux aller au cinéma ensemble vendredi ?
    gloss: Tu veux aller au cinéma ensemble vendredi ?
    note: 'La proposition complète : razem (ensemble) et w piątek (vendredi) s’ajoutent à la question que tu viens d’apprendre.'
  pl.a1.unit11.lesson02.teach.moc_moge:
    title: Pouvoir, je peux
    gloss: pouvoir ; je peux
    note: 'Móc est l’infinitif ; mogę est la forme de la première personne. Tu te souviens peut-être de możemy (« nous pouvons ») dans les unités précédentes sur la date et l’heure : c’est le même verbe, au singulier.'
    example_gloss: Je peux venir vendredi.
  pl.a1.unit11.lesson02.teach.mozesz:
    title: Tu peux
    gloss: tu peux (informel)
    note: Możesz est la forme du « tu » informel, avec la même terminaison de deuxième personne que chcesz ; on l’emploie pour demander si quelqu’un peut faire quelque chose.
    example_gloss: Tu peux samedi ?
  pl.a1.unit11.lesson02.teach.przyjsc:
    title: Venir
    gloss: venir
    note: Le verbe pour venir retrouver quelqu’un ; il va naturellement avec mogę/możesz pour dire qui peut ou ne peut pas venir.
    example_gloss: Je veux venir vendredi.
  pl.a1.unit11.lesson02.teach.moc_note:
    title: Je peux, tu peux
    gloss: 'Móc : mogę, możesz -- la même deuxième personne (tu) que dans chcesz. Mogę suivi d’un infinitif dit ce que tu peux faire : mogę przyjść (je peux venir), mogę iść (je peux y aller).'
    note: '*Mogę* + un verbe à l’infinitif dit ce que tu peux faire : *mogę przyjść* (« je peux venir ») et *mogę iść* (« je peux aller ») suivent le même schéma simple.'
  pl.a1.unit11.lesson02.teach.chetnie:
    title: Volontiers
    gloss: volontiers
    note: Une façon chaleureuse et enthousiaste d’accepter un projet ; souvent associé à tak (oui) ou bardzo (très) pour plus de chaleur.
    example_gloss: Oui, très volontiers !
  pl.a1.unit11.lesson02.teach.niestety:
    title: Malheureusement
    gloss: malheureusement
    note: L’adoucisseur naturel pour refuser poliment un projet ; presque toujours suivi de nie mogę (je ne peux pas).
    example_gloss: Malheureusement, je ne peux pas.
  pl.a1.unit11.lesson02.teach.w_sobote_note:
    title: Samedi
    gloss: 'W + jour de la semaine : les jours masculins (piątek, poniedziałek, czwartek) ne changent pas de terminaison -- w piątek. Les jours féminins (sobota, środa, niedziela) prennent la terminaison -ę de l’accusatif, comme kawa -> kawę -- w sobotę.'
    note: 'Après *w*, tous les jours ne se comportent pas de la même façon : les noms de jours féminins comme *sobota* deviennent *sobotę*, avec la même terminaison *-a* -> *-ę* que *kawa* -> *kawę* et *herbata* -> *herbatę*. Les jours masculins comme *piątek* restent tels quels.'
  pl.a1.unit11.lesson02.teach.czy_mozesz_przyjsc_w_sobote:
    title: Tu peux venir samedi ?
    gloss: Tu peux venir samedi ?
    note: 'Cette phrase réunit możesz, przyjść et la nouvelle forme w sobotę : une façon complète de proposer un autre jour.'
  pl.a1.unit11.lesson03.teach.moze:
    title: Peut-être, et si…
    gloss: peut-être / et si
    note: Le mot pour proposer une alternative ; il sert chaque fois qu’un premier projet ne marche pas et que tu veux suggérer autre chose.
    example_gloss: Et samedi ?
  pl.a1.unit11.lesson03.teach.moze_vs_moge_note:
    title: Może ou mogę ?
    gloss: 'Może et mogę se ressemblent, mais ne veulent pas dire la même chose : może (« peut-être ») propose quelque chose de nouveau ; mogę (la forme « je » du verbe, « je peux ») dit ce que tu peux faire.'
    note: 'Facile à confondre à l’écrit : *może* (« peut-être », ici pour suggérer quelque chose) et *mogę* (« je peux », verbe à la première personne) ont des rôles différents dans la phrase, même s’ils viennent de la même racine. Regarde bien la dernière lettre.'
  pl.a1.unit11.lesson03.teach.o_ktorej_godzinie:
    title: À quelle heure ?
    gloss: À quelle heure ?
    note: La façon habituelle de demander une heure précise quand le jour est déjà fixé ; tu connais peut-être o której depuis l’unité sur l’heure.
  pl.a1.unit11.lesson03.teach.dialogue.line01:
    title: Ewa propose le cinéma
    gloss: Ewa demande à Marek s’il veut aller au cinéma vendredi.
    note: Reprise de la toute première question de l’unité, maintenant dans une vraie conversation.
  pl.a1.unit11.lesson03.teach.dialogue.line02:
    title: Marek n’est pas libre vendredi
    gloss: Marek dit que, malheureusement, il ne peut pas vendredi.
    note: Niestety adoucit le refus avant que nie mogę ne l’énonce clairement.
  pl.a1.unit11.lesson03.teach.dialogue.line03:
    title: Marek propose samedi
    gloss: 'Marek demande : et samedi ?'
    note: Może propose une alternative au lieu de simplement mettre fin à la conversation par un refus.
  pl.a1.unit11.lesson03.teach.dialogue.line04:
    title: Ewa accepte volontiers
    gloss: 'Ewa dit : Samedi ? Volontiers !'
    note: Elle reprend le jour proposé (avec la forme w sobotę) avant d’accepter avec chętnie.
  pl.a1.unit11.lesson03.teach.dialogue.line05:
    title: Ewa demande l’heure
    gloss: 'Ewa demande : À quelle heure ?'
    note: Le jour étant fixé, il reste à convenir de l’heure.
  pl.a1.unit11.lesson03.teach.dialogue.line06:
    title: Marek confirme l’heure
    gloss: 'Marek dit : À quatre heures de l’après-midi.'
    note: La négociation se termine par une heure précise et convenue, avec le même schéma pour les heures que dans les unités sur l’heure et les habitudes.
