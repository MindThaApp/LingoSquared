  pl.a1.unit36.lesson05.teach.nina_jest_nowa:
    title: Nina découvre la personnalité de chacun
    gloss: Nina est nouvelle au café linguistique. Elle demande à Marek comment sont les autres. Marek lui répond. Ewa est gentille et patiente ; elle travaille comme infirmière. Tomek est drôle et suit un cours d’espagnol. Kasia est curieuse ; elle aime apprendre de nouvelles choses. Marek, lui, est calme.
    note: Ce texte récapitule les traits de caractère des membres du groupe en les comparant.
    glosses:
      nowa: nouveau
      kawiarni: café des langues
      Pyta: demande
      inni: les autres
      opowiada: raconte
      miła: sympathique / gentil
      cierpliwa: patient
      pracuje: travaille
      pielęgniarka: infirmière
      zabawny: drôle
      chodzi: suit / fréquente
      kurs: cours
      hiszpańskiego: espagnol
      ciekawska: curieux
      uczyć: apprend
      lubi: aime
      nowych: nouveau
      rzeczy: choses
      Sam: lui-même
      spokojny: calme
  pl.a1.unit36.lesson05.teach.wszyscy_w_kawiarni:
    title: Tout le monde est différent, et c’est une belle chose
    gloss: Au café des langues, tout le monde est différent, et c’est une belle chose.
  pl.a1.unit36.lesson06.teach.marek_a_ty:
    title: Marek interroge Nina sur elle-même
    gloss: 'Marek : Et toi, Nina ? Comment es-tu ?'
  pl.a1.unit36.lesson06.teach.nina_jestem_niesmiala:
