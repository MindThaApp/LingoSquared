teaching:
  pl.a1.unit14.lesson01.teach.mlody:
    title: Jeune
    gloss: jeune
    note: 'Un adjectif de base : le point de départ des comparatifs de cette unité.'
    example_gloss: Marek est jeune.
  pl.a1.unit14.lesson01.teach.stary:
    title: Vieux
    gloss: vieux
    note: 'Le contraire de młody : un autre adjectif que cette unité va mettre au comparatif.'
    example_gloss: Grand-père est âgé.
  pl.a1.unit14.lesson01.teach.comparative_formation_note:
    title: 'Former un comparatif : ajouter -szy'
    gloss: 'Pour les adjectifs courts comme stary et młody, la terminaison -y devient -szy : stary donne starszy, młody donne młodszy. Tous les adjectifs ne fonctionnent pas ainsi.'
    note: 'Un schéma simple pour ces deux mots : on enlève le *-y* final et on ajoute *-szy* pour obtenir le comparatif. Beaucoup d’autres adjectifs utilisent une autre terminaison, donc ne l’applique pas partout.'
  pl.a1.unit14.lesson01.teach.starszy_starsza:
    title: Plus âgé
    gloss: plus âgé
    note: 'Starszy s’emploie pour un homme (on) ; starsza pour une femme (ona) : c’est le comparatif de stary.'
    example_gloss:
    - Grand-père est plus âgé que père.
    - Grand-mère est plus âgée que mère.
  pl.a1.unit14.lesson01.teach.mlodszy_mlodsza:
    title: Plus jeune
    gloss: plus jeune
    note: 'Młodszy pour un homme, młodsza pour une femme : c’est le comparatif de młody.'
    example_gloss:
    - Le père est plus jeune que le grand-père.
    - La mère est plus jeune que la grand-mère.
  pl.a1.unit14.lesson01.teach.niz:
    title: Que
    gloss: que
    note: 'Niż relie les deux éléments comparés : le mot placé après niż reste à sa forme de base.'
    example_gloss: Le fils est plus jeune que le père.
  pl.a1.unit14.lesson01.teach.gender_agreement_note:
    title: Les comparatifs s’accordent en genre
    gloss: Starszy/starsza et młodszy/młodsza changent selon le genre, comme byłem/byłam. Starszy, młodszy pour un homme (on) ; starsza, młodsza pour une femme (ona).
    note: 'Même principe que *byłem*/*byłam* : la terminaison change selon qu’on parle d’un homme ou d’une femme.'
  pl.a1.unit14.lesson01.teach.ewa_starsza:
    title: Ewa est plus âgée que Marek
    gloss: Ewa est plus âgée que Marek.
    note: 'Un fait réel sur nos deux personnages : Ewa a 32 ans, Marek 28.'
  pl.a1.unit14.lesson01.teach.marek_mlodszy:
    title: Marek est plus jeune qu’Ewa
    gloss: Marek est plus jeune qu’Ewa.
    note: Le même fait, dit dans l’autre sens.
  pl.a1.unit14.lesson02.teach.dobry_recap:
    title: Bon, encore
    gloss: 'Dobry (bon) : tu le connais déjà grâce à Dzień dobry.'
    note: C’est le même adjectif que depuis la toute première unité, ici utilisé pour construire un comparatif.
  pl.a1.unit14.lesson02.teach.zly:
    title: Mauvais
    gloss: mauvais
    note: 'Le contraire de dobry : un mot tout nouveau dans cette unité.'
    example_gloss: C’est un mauvais jour.
  pl.a1.unit14.lesson02.teach.irregular_comparative_note:
    title: Dobry et zły sont irréguliers
    gloss: 'Dobry et zły sont irréguliers : dobry donne lepszy, zły donne gorszy ; on n’ajoute pas -szy.'
    note: 'Contrairement à *stary*/*młody*, ces deux mots ne suivent pas le schéma régulier en *-szy* : leurs comparatifs sont à apprendre par cœur.'
  pl.a1.unit14.lesson02.teach.lepszy_lepsza:
    title: Mieux
    gloss: mieux
    note: 'Lepszy pour un homme, lepsza pour une femme (ou pour un mot féminin comme kawa) : c’est le comparatif irrégulier de dobry.'
    example_gloss:
    - Il est meilleur que moi.
    - Le café est meilleur que le thé.
  pl.a1.unit14.lesson02.teach.gorszy_gorsza:
    title: Pire
    gloss: moins bon / pire
    note: 'Gorszy/gorsza : le comparatif irrégulier de zły.'
    example_gloss:
    - Il est pire que moi.
    - Le thé est moins bon que le café.
  pl.a1.unit14.lesson02.teach.kawa_herbata_recap:
    title: Le café et le thé, encore
    gloss: 'Kawa et herbata : tu connais déjà ces mots grâce à la leçon précédente sur les boissons.'
    note: Un petit rappel avant que cette leçon ne les utilise dans une comparaison.
  pl.a1.unit14.lesson02.teach.gender_note_recap:
    title: Même schéma qu’avant
    gloss: Lepszy/lepsza et gorszy/gorsza changent selon le genre, comme starszy/starsza dans la leçon précédente.
    note: La même distinction masculin/féminin que tu viens d’apprendre, appliquée à une nouvelle paire de mots.
  pl.a1.unit14.lesson03.teach.pronouns_recap:
    title: Je, je suis, tu
    gloss: 'Ja, jestem, ty : tu connais déjà ces mots grâce aux leçons précédentes.'
    note: Un petit rappel avant le dialogue de cette leçon.
  pl.a1.unit14.lesson03.teach.tak_nie_dobrze_recap:
    title: Oui, non, bien
    gloss: 'Tak, nie et dobrze : tu les connais aussi déjà.'
    note: Un autre petit rappel avant le dialogue.
  pl.a1.unit14.lesson03.teach.ale_recap:
    title: Mais, encore
    gloss: 'Ale (mais) : tu le connais déjà grâce aux leçons précédentes. Il relie deux phrases qui s’opposent.'
    note: Un court mot de liaison qui introduit une opposition, comme « mais » en français.
  pl.a1.unit14.lesson03.teach.dialogue.line01:
    title: Marek dit que le thé est meilleur
    gloss: Le thé est meilleur que le café !
    note: Marek commence par donner son opinion, conforme à ce qu’il nous a déjà dit dans la leçon sur les préférences.
  pl.a1.unit14.lesson03.teach.dialogue.line02:
    title: Ewa n’est pas d’accord
    gloss: Non, non ! Le café, c’est meilleur que le thé !
    note: Ewa riposte avec sa propre opinion, dans la même ligne que ce qu’elle disait avant.
  pl.a1.unit14.lesson03.teach.dialogue.line03:
    title: Marek change de sujet et parle d’âge
    gloss: D’accord, d’accord. Mais moi, je suis plus jeune que toi !
    note: Marek abandonne la dispute sur les boissons et évoque un point dont il est sûr.
  pl.a1.unit14.lesson03.teach.dialogue.line04:
    title: Ewa est d’accord, et répète son opinion
    gloss: Oui, je suis plus âgée. Mais le café est meilleur !
    note: Ewa confirme le fait concernant l’âge, puis revient à son opinion sur le café.
