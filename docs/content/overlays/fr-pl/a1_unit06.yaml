teaching:
  pl.a1.unit06.lesson01.teach.chleb:
    title: Le pain
    gloss: pain
    note: 'Un mot de base de l''alimentation : il revient constamment à chaque repas.'
    example_gloss: C'est du pain.
  pl.a1.unit06.lesson01.teach.maslo_ser:
    title: Beurre, fromage
    gloss: beurre ; fromage
    note: 'Le premier est un nom neutre, le second un nom masculin inanimé : ni l''un ni l''autre ne change de terminaison après proszę o, comme l''explique la note de grammaire de cette leçon.'
    example_gloss:
    - C'est du beurre.
    - C'est du fromage.
  pl.a1.unit06.lesson01.teach.woda_mleko:
    title: Eau, lait
    gloss: eau ; lait
    note: Woda est féminin (son accusatif wodę apparaît dans la note de grammaire de cette leçon) ; mleko est neutre et ne change jamais.
    example_gloss:
    - C'est de l'eau.
    - C'est du lait.
  pl.a1.unit06.lesson01.teach.kawa_herbata:
    title: Café, thé
    gloss: café ; thé
    note: 'Les deux sont féminins : ce sont leurs formes à l''accusatif, kawę et herbatę, que l''on dit réellement pour commander, comme le montre la note de grammaire de cette leçon.'
    example_gloss:
    - C'est du café.
    - C'est du thé.
  pl.a1.unit06.lesson01.teach.prosze_o_note:
    title: 'Commander : proszę o + accusatif'
    gloss: 'Je voudrais + accusatif : café -> kawę, thé -> herbatę, eau -> wodę. Le pain, le fromage et le lait ne changent pas.'
    note: '*Proszę o* (« je voudrais », littéralement « je demande ») est suivi de l''accusatif. Les noms féminins comme *kawa*, *herbata* et *woda* remplacent leur *-a* final par *-ę*. Les noms masculins inanimés comme *chleb* et *ser*, et les noms neutres comme *mleko*, gardent exactement la forme du dictionnaire.'
  pl.a1.unit06.lesson01.teach.prosze_o_kawe:
    title: Un café, s'il vous plaît
    gloss: Un café, s'il vous plaît.
    note: 'La façon polie et courante de commander un seul article : elle met en pratique le schéma de la note de grammaire dans une demande complète.'
  pl.a1.unit06.lesson02.teach.zupa:
    title: Soupe
    gloss: soupe
    note: Un plat courant au déjeuner ou au dîner, souvent le plat du jour, comme dans la scène de restaurant de cette unité.
    example_gloss: C'est de la soupe.
  pl.a1.unit06.lesson02.teach.sok:
    title: Le jus
    gloss: jus
    note: 'Masculin inanimé, comme chleb et ser : la terminaison ne change pas quand on le commande.'
    example_gloss: C'est du jus.
  pl.a1.unit06.lesson02.teach.cukier:
    title: Sucre
    gloss: sucre
    note: Utile pour le café ou le thé ; lui aussi est masculin inanimé, sans changement de terminaison.
    example_gloss: C'est du sucre.
  pl.a1.unit06.lesson02.teach.rachunek:
    title: L’addition
    gloss: l'addition
    note: 'Ce que l''on demande à la fin du repas : proszę o rachunek est la façon standard et polie de la réclamer.'
    example_gloss: L’addition, s’il vous plaît.
  pl.a1.unit06.lesson02.teach.lubic_note:
    title: 'Aimer : lubię, lubi'
    gloss: 'aimer : j''aime, il/elle aime -- J''aime le café. Il aime la soupe.'
    note: '*Lubić* est le verbe « aimer ». Seules les formes de la 1re personne (*lubię*) et de la 3e personne (*lubi*) sont présentées ici. *Lubić* se construit aussi avec l''accusatif, comme *proszę o* : *lubię kawę*, et non *lubię kawa*.'
  pl.a1.unit06.lesson02.teach.lubie_zupe:
    title: J'aime la soupe
    gloss: J'aime la soupe.
    note: 'Zupa devient zupę à l''accusatif : c''est le même passage du féminin -a à -ę que dans la note de grammaire de la leçon 1.'
  pl.a1.unit06.lesson03.teach.danie_dnia:
    title: Le plat du jour
    gloss: Le plat du jour est la soupe.
    note: '*Dnia* est le génitif de *dzień* (jour) : *danie dnia* signifie littéralement « le plat du jour », formule figée telle qu''on la trouve sur un menu.'
  pl.a1.unit06.lesson03.teach.polecac_note:
    title: 'Recommander : polecam, poleca'
    gloss: 'recommander : je recommande, il/elle recommande -- Je recommande le café. Il recommande la soupe.'
    note: '*Polecać* est le verbe « recommander » : le serveur l''emploie pour suggérer un plat, et le client le même verbe pour demander une suggestion. Il se construit aussi avec l''accusatif, comme *proszę o* et *lubić*.'
  pl.a1.unit06.lesson03.teach.co_pan_poleca:
    title: Que recommandez-vous ?
    gloss: Que recommandez-vous ?
    note: '*Co* (quoi, que) avec le *pan* de politesse : la question naturelle à poser à un serveur, avec la même forme de politesse que dans l''unité 1.'
  pl.a1.unit06.lesson03.teach.prosze_bardzo:
    title: Voilà / de rien
    gloss: Voilà.
    note: 'Une expression souple et courante : on la dit en servant quelque chose, et elle est tout aussi naturelle en réponse à dziękuję (merci).'
  pl.a1.unit06.lesson03.teach.juz_podaje:
    title: Tout de suite
    gloss: Tout de suite.
    note: 'Littéralement « je sers déjà » : réponse habituelle du serveur pour confirmer qu''il a bien entendu la commande.'
  pl.a1.unit06.lesson03.teach.dialogue.line01:
    title: Le serveur annonce le plat du jour
    gloss: Le serveur dit bonjour et annonce que le plat du jour est la soupe.
    note: Dzień dobry, déjà vu dans les salutations de l'unité 1.
  pl.a1.unit06.lesson03.teach.dialogue.line02:
    title: Ewa demande une recommandation
    gloss: Ewa demande au serveur ce qu'il recommande.
    note: 'Une question polie et formelle : pan s''adresse au serveur avec respect.'
  pl.a1.unit06.lesson03.teach.dialogue.line03:
    title: Le serveur recommande le café
    gloss: Le serveur recommande le café.
    note: 'Polecam : la forme de la 1re personne vue dans la note de grammaire de cette leçon.'
  pl.a1.unit06.lesson03.teach.dialogue.line04:
    title: Ewa passe sa commande
    gloss: Ewa dit d'accord et commande un café et une soupe.
    note: Combine proszę o avec le connecteur i (et) de l'unité sur la famille, et reprend le schéma de commande de la leçon 1 et le vocabulaire de la soupe de la leçon 2.
  pl.a1.unit06.lesson03.teach.dialogue.line05:
    title: Le serveur confirme
    gloss: Le serveur dit que la commande arrive tout de suite.
    note: Une courte confirmation naturelle avant l'arrivée des plats.
  pl.a1.unit06.lesson03.teach.dialogue.line06:
    title: Ewa demande l'addition
    gloss: Ewa dit merci et demande l'addition.
    note: Reprend dziękuję de l'unité 1 et proszę o + rachunek de la leçon 2.
  pl.a1.unit06.lesson03.teach.dialogue.line07:
    title: Le serveur apporte l'addition
    gloss: 'Le serveur dit : voilà.'
    note: Le même proszę bardzo vu plus tôt dans cette leçon, qui sert ici à remettre l'addition.
