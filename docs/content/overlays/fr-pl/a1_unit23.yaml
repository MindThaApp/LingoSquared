answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Polonais A1
  description: 'Polonais débutant pour gérer les situations d’argent de base : demander un prix total, choisir un moyen de paiement, partager l’addition et gérer la monnaie.'
units:
  pl.a1.unit23.pieniadze:
    title: L’argent et le paiement
lessons:
  pl.a1.unit23.lesson01.ile_to_kosztuje_w:
    title: Combien cela coûte-t-il au total ?
  pl.a1.unit23.lesson02.karta_czy_gotowka:
    title: Carte ou espèces ?
  pl.a1.unit23.lesson03.dzielenie_rachunku:
    title: Partager l’addition
  pl.a1.unit23.lesson04.reszta:
    title: La monnaie
  pl.a1.unit23.lesson05.czytanie_rachunku_z_restauracji:
    title: Lire une addition de restaurant
  pl.a1.unit23.lesson06.ewa_i_marek_placa:
    title: Ewa et Marek paient l’addition
teaching:
  pl.a1.unit23.lesson01.teach.ile_to_kosztuje:
    title: Demander le prix total
    gloss: Combien cela coûte-t-il au total ?
    note: '*W sumie* (au total) précise que tu veux le prix global, et non le prix d’un seul article.'
  pl.a1.unit23.lesson01.teach.w_sumie_to:
    title: Indiquer un prix total
    gloss: Ça coûte cent zlotys au total.
    note: '*Kosztuje* est la forme *on/ona/ono* de *kosztować* (coûter). À partir de 5, les nombres se construisent avec le génitif pluriel : *sto złotych*.'
  pl.a1.unit23.lesson02.teach.placic_karta_placic:
    title: Payer par carte ou en espèces
    gloss: payer par carte, payer en espèces
    note: '*Płacić kartą* (payer par carte) et *płacić gotówką* (payer en espèces) emploient tous deux l’instrumental après *płacić* : *kartą*, *gotówką*.'
    example_gloss:
    - Puis-je payer par carte ici ?
    - Je paie en espèces.
  pl.a1.unit23.lesson02.teach.czy_moge_tu:
    title: Demander s’il est possible de payer par carte
    gloss: Puis-je payer par carte ici ?
    note: '*Tu* (ici) situe la question à l’endroit où tu te trouves ; *czy* introduit une question fermée et *mogę* signifie « je peux ».'
  pl.a1.unit23.lesson02.teach.czy_chce_pan:
    title: Demander le moyen de paiement souhaité
    gloss: Souhaitez-vous payer en espèces ou par carte ?
    note: '*Czy chce pan ...?* est la forme de politesse de *Czy chcesz ...?*, employée ici par un caissier qui ne te connaît pas (*pan* pour un homme, *pani* pour une femme).'
  pl.a1.unit23.lesson03.teach.rachunek:
    title: L’addition
    gloss: l’addition
    note: 'Un nom masculin : *rachunek* (génitif *rachunku*).'
    example_gloss: On partage l’addition ?
  pl.a1.unit23.lesson03.teach.moze_podzielimy_rachunek:
    title: Proposer de partager l’addition
    gloss: On partage l’addition ?
    note: '*Może podzielimy ...?* est une manière polie de proposer quelque chose à plusieurs ; *podzielimy* est la forme *my* (nous) de *podzielić*.'
  pl.a1.unit23.lesson03.teach.czy_moge_zaplacic:
    title: Demander à payer séparément
    gloss: Puis-je payer séparément ?
    note: '*Osobno* (séparément) s’emploie avec *zapłacić* (payer, perfectif : un paiement unique et achevé).'
  pl.a1.unit23.lesson04.teach.reszta:
    title: La monnaie
    gloss: la monnaie
    note: 'Un nom féminin : *reszta* (génitif *reszty*, comme dans *nie potrzebuję reszty*).'
    example_gloss: Voici votre monnaie.
  pl.a1.unit23.lesson04.teach.oto_pana_reszta:
    title: Rendre la monnaie
    gloss: Voici votre monnaie.
    note: '*Pana* est le « votre » de politesse (à un homme ; *pani* pour une femme), en accord avec le registre formel d’un comptoir.'
  pl.a1.unit23.lesson04.teach.nie_potrzebuje_reszty:
    title: Refuser la monnaie
    gloss: Je n’ai pas besoin de monnaie.
    note: '*Nie potrzebuję* + génitif : la négation met le complément au génitif, d’où *reszty*.'
  pl.a1.unit23.lesson05.teach.trzydziesci_piec:
    title: Trente-cinq
    gloss: trente-cinq
    note: '*Trzydzieści pięć* s’écrit en deux mots : les dizaines d’abord, puis les unités (30 + 5).'
    example_gloss: Ça coûte cent quarante zlotys.
  pl.a1.unit23.lesson05.teach.rachunek_dwa_dania:
    title: Lire une addition de restaurant
    gloss: 'Addition : deux plats principaux et deux cafés. Total : cent quarante zlotys. Payé par carte.'
    note: Repère ce qui a été commandé, le total et le moyen de paiement.
    glosses:
      Rachunek: addition
      dwa: deux
      dania: plats principaux (dania główne)
      kawy: cafés
      Razem: total
      złotych: zlotys
      Zapłacono: payé
      kartą: carte
      sto: cent
      czterdzieści: quarante
  pl.a1.unit23.lesson06.teach.ewa_moze_poprosimy:
    title: Ewa demande l’addition
    gloss: 'Ewa : On demande l’addition ?'
    note: '*Poprosić o* (demander) est suivi de l’accusatif : *o rachunek*. *Poprosimy* est le futur perfectif.'
  pl.a1.unit23.lesson06.teach.marek_tak_dobry:
    title: Marek demande le total
    gloss: 'Marek : Oui, bonne idée. Ça coûte combien au total ?'
    note: Reprend la question *Ile to kosztuje w sumie?* de la leçon 1.
  pl.a1.unit23.lesson06.teach.ewa_to_trzydziesci:
    title: Ewa annonce le total
    gloss: 'Ewa : Ça fait cent quarante zlotys. On partage ?'
    note: '*Podzielimy się?* (littéralement « on se divise ? ») emploie le réfléchi *się* pour parler de partager l’addition.'
  pl.a1.unit23.lesson06.teach.marek_nie_dzisiaj:
    title: Marek insiste pour payer
    gloss: 'Marek : Non, aujourd’hui c’est moi qui paie. Tu m’as tellement aidé !'
    note: '*Dzisiaj ja płacę* (littéralement « aujourd’hui je paie ») est la façon habituelle de proposer de payer ; *pomogłaś* est le passé féminin de *pomóc* (aider), car Marek s’adresse à Ewa.'
  pl.a1.unit23.lesson06.teach.ewa_jak_milo:
    title: Ewa est touchée
    gloss: 'Ewa : C’est gentil de ta part ! Merci.'
    note: '*Miło z twojej strony* (c’est gentil de ta part) est un compliment chaleureux et courant pour un geste généreux ; *z* + génitif : *z twojej strony*.'
  pl.a1.unit23.lesson06.teach.marek_czy_moge:
    title: Marek demande s’il peut payer par carte
    gloss: 'Marek : Je peux payer par carte ici ?'
    note: Reprend la question *Czy mogę tu zapłacić kartą?* de la leçon 2, cette fois dans le vrai restaurant.
  pl.a1.unit23.lesson06.teach.marek_placi_rachunek:
    title: 'Płaci : la forme il/elle'
    gloss: Marek paie l’addition.
    note: '*Płaci* est la forme *on/ona/ono* de *płacić* (payer).'
