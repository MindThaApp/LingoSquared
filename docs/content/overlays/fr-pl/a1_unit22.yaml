teaching:
  pl.a1.unit22.lesson01.teach.dzwonic:
    title: Appeler
    gloss: appeler
    note: L’infinitif du verbe qui signifie passer un appel téléphonique.
    example_gloss: Je dois t’appeler.
  pl.a1.unit22.lesson01.teach.zadzwonie_do_ciebie:
    title: Dire que tu appelleras
    gloss: Je t’appellerai.
    note: '*Zadzwonię* est le futur perfectif de *zadzwonić* (appeler, une fois). Le polonais l’emploie pour une promesse, comme le français « je t’appellerai ».'
  pl.a1.unit22.lesson01.teach.halo_tu_ewa:
    title: Répondre au téléphone
    gloss: Allô, c’est Ewa.
    note: '*Tu* + prénom (littéralement « ici ... ») est la formule habituelle pour se présenter au téléphone ; le français dit « c’est ... ».'
  pl.a1.unit22.lesson01.teach.halo_tu_marek:
    title: Marek répond de la même façon
    gloss: Allô, c’est Marek.
    note: Même structure *tu* + prénom que dans *Halo, tu Ewa*.
  pl.a1.unit22.lesson02.teach.z_kim_rozmawiam:
    title: Demander qui appelle
    gloss: À qui ai-je l’honneur ?
    note: '*Z kim rozmawiam?* (littéralement « avec qui je parle ? ») est la formule habituelle face à un interlocuteur inconnu ; *kim* est l’instrumental après *z*.'
  pl.a1.unit22.lesson02.teach.rozmawia_pan_z:
    title: Se présenter de manière formelle
    gloss: Vous parlez avec Ewa.
    note: '*Rozmawia pan z Ewą* est la version formelle : *pan* (à un homme) ou *pani* (à une femme) avec le verbe à la 3e personne, et *z* + instrumental.'
  pl.a1.unit22.lesson03.teach.mozesz_to_powtorzyc:
    title: Demander de répéter
    gloss: Peux-tu répéter cela ?
    note: '*Możesz* (peux-tu, de *móc*) + l’infinitif *powtórzyć* (répéter) + *to* (cela).'
  pl.a1.unit22.lesson03.teach.nie_mow_tak:
    title: Demander à quelqu’un de parler moins vite
    gloss: Ne parle pas si vite, s’il te plaît.
    note: '*Nie mów* est l’impératif négatif (ne parle pas) ; *tak szybko* signifie « si vite ».'
  pl.a1.unit22.lesson03.teach.nie_slysze_cie:
    title: Dire que tu entends mal
    gloss: Je ne t’entends pas bien.
    note: '*Nie słyszę cię dobrze* exprime un problème d’audition ; *cię* est l’accusatif de *ty* et *dobrze* signifie « bien ».'
  pl.a1.unit22.lesson04.teach.sms:
    title: SMS
    gloss: le SMS
    note: '*SMS* est un nom masculin emprunté à l’anglais : *ten SMS*.'
    example_gloss: Le SMS est d’Ewa.
  pl.a1.unit22.lesson04.teach.wysle_ci_sms:
    title: Dire que tu enverras un SMS
    gloss: Je t’enverrai un message.
    note: '*Wysłać* (envoyer) se construit avec le datif *ci* (à toi) pour la personne et l’accusatif pour la chose envoyée : *Wyślę ci SMS*.'
  pl.a1.unit22.lesson04.teach.oddzwonie_pozniej:
    title: Dire que tu rappelleras
    gloss: Je te rappellerai plus tard.
    note: '*Oddzwonić* (rappeler) est un verbe unique en polonais : *oddzwonię później*.'
  pl.a1.unit22.lesson05.teach.marek_czesc_ewo:
    title: Lis un échange de SMS
    gloss: 'Marek : Salut Ewa, peux-tu m’appeler ? Je dois te dire quelque chose. Ewa : Oui, bien sûr, je te rappelle dans cinq minutes.'
    note: Repère ce que Marek demande, pourquoi, et quand Ewa dit qu’elle rappellera.
    glosses:
      Cześć: salut
      możesz: pouvoir
      zadzwonić: appeler
      Muszę: devoir
      coś: quelque chose
      powiedzieć: dire
      oczywiście: bien sûr
      oddzwonię: appeler
      pięć: cinq
      minut: minutes
      za: rappeler
  pl.a1.unit22.lesson06.teach.marek_halo_tu:
    title: Marek décroche
    gloss: 'Marek : Allô, c’est Marek.'
    note: 'La même structure *tu* + prénom que dans la leçon 1, employée ici dans un vrai appel : la personne qui décroche parle la première et donne son nom.'
  pl.a1.unit22.lesson06.teach.ewa_czesc_marku:
    title: Ewa se présente
    gloss: 'Ewa : Salut Marek, c’est Ewa. Marek : Super que tu appelles !'
    note: '*Fajnie, że* ... (super que ...) exprime une réaction positive à un événement ; *że* introduit la proposition.'
  pl.a1.unit22.lesson06.teach.ewa_jak_ci:
    title: Ewa demande comment s’est passé le service
    gloss: 'Ewa : Comment s’est passé ton premier service ?'
    note: '*Jak ci poszła ...?* (littéralement « comment ... est-il allé pour toi ? ») interroge sur un événement passé. *Ci* est le datif de *ty*, et *poszła* s’accorde avec le nom féminin *zmiana*.'
  pl.a1.unit22.lesson06.teach.marek_poszlo_bardzo:
    title: Marek annonce une bonne nouvelle
    gloss: 'Marek : Ça s’est très bien passé, mieux que je ne le pensais.'
    note: '*Poszło* est le passé de *iść* avec la terminaison *-o* (« cela » ; ici « se passer ») ; *myślałem* est le passé de *myśleć* (penser), avec la terminaison d’un locuteur masculin.'
  pl.a1.unit22.lesson06.teach.czas_przeszly_bylo:
    title: 'Passé : było, poszło, myślałem'
    gloss: 'Passé : *było* (c’était) de *być* (être), *poszło* (cela s’est passé) de *iść* (aller), *myślałem* (je pensais) de *myśleć* (penser).'
    note: 'Le passé polonais se forme avec *-ł-* plus une terminaison de genre : *myślał* (il), *myślała* (elle), *było* (neutre). Pour l’instant, retiens *było*, *poszło* et *myślałem* comme des formes figées dans les contextes de cette leçon.'
  pl.a1.unit22.lesson06.teach.ewa_jak_milo:
    title: Ewa est fière
    gloss: 'Ewa : Quel plaisir de l’entendre ! Je suis fière de toi.'
    note: '*Dumny z* (fier de) est une combinaison figée : *z* + génitif, donc *z ciebie*. Ewa est une femme, elle dit donc *dumna*.'
  pl.a1.unit22.lesson06.teach.marek_dziekuje_ci:
    title: Marek est touché
    gloss: 'Marek : Merci beaucoup, ça compte énormément pour moi.'
    note: '*Znaczy* est la forme *on/ona/ono* de *znaczyć* (signifier) ; *dla mnie* (pour moi) indique pour qui c’est important.'
  pl.a1.unit22.lesson06.teach.jego_pierwsza_zmiana:
    title: Son
    gloss: Son premier service s’est très bien passé.
    note: '*Jego* (son, à lui) est invariable et se place avant le nom : *jego pierwsza zmiana* ; le nom féminin n’a aucune influence.'
