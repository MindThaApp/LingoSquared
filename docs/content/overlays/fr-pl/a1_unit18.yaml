teaching:
  pl.a1.unit18.lesson01.teach.dom_jest_ma_recap:
    title: Maison, est, a – encore
    gloss: Dom, jest, ma, Marek, Ewa – tu connais déjà ces mots grâce aux leçons précédentes, par exemple Dom jest tam (la maison est là-bas).
    note: Un petit rappel avant que cette leçon les utilise pour parler de ton logement.
  pl.a1.unit18.lesson01.teach.mieszkanie:
    title: Appartement
    gloss: appartement
    note: Un logement dans un immeuble, et non une maison entière.
    example_gloss: Ewa a un appartement.
  pl.a1.unit18.lesson01.teach.duzy_note:
    title: Grand
    gloss: La maison est grande. – *duży* s’accorde avec les noms masculins, comme *dom*.
    note: C’est la première fois dans ce cours qu’un mot décrit la taille – pour l’instant, il ne s’emploie qu’avec *dom*.
  pl.a1.unit18.lesson01.teach.marek_ma_dom_duzy:
    title: Chez Marek
    gloss: Marek a une maison. La maison est grande.
    note: Le fait sur lequel repose toute cette unité pour Marek.
  pl.a1.unit18.lesson01.teach.ewa_ma_mieszkanie:
    title: Chez Ewa
    gloss: Ewa a un appartement.
    note: Le fait sur lequel repose toute cette unité pour Ewa.
  pl.a1.unit18.lesson01.teach.pokoj:
    title: Pièce
    gloss: pièce
    note: Un mot général pour désigner n’importe quelle pièce d’un logement.
    example_gloss: Où est la pièce ?
  pl.a1.unit18.lesson01.teach.ile_pokoi_note:
    title: Combien de pièces ?
    gloss: Tu as combien de pièces ? J’ai deux pièces. – tu connais déjà Ile, les nombres et mam/masz grâce aux leçons précédentes ; *pokoi* et *pokoje* sont des formes du mot *pokój*.
    note: '*Pokoi* s’emploie juste après *Ile* ; *pokoje* s’emploie juste après *dwa*, *trzy* ou *cztery* (deux, trois, quatre).'
  pl.a1.unit18.lesson01.teach.ile_pokoi_masz_phrase:
    title: Combien de pièces as-tu ?
    gloss: Combien de pièces as-tu ?
    note: Une question naturelle à poser sur le logement de quelqu’un.
  pl.a1.unit18.lesson01.teach.mam_dwa_pokoje_phrase:
    title: J’ai deux pièces
    gloss: J’ai deux pièces.
    note: Une réponse naturelle à la question précédente.
  pl.a1.unit18.lesson02.teach.kuchnia:
    title: Cuisine
    gloss: cuisine
    note: Une des pièces les plus courantes d’un logement.
    example_gloss: La cuisine est petite.
  pl.a1.unit18.lesson02.teach.mala_note:
    title: Petit
    gloss: La cuisine est petite. – *mała* s’accorde avec les noms féminins, comme *kuchnia*.
    note: C’est un mot distinct de *duży* (grand) – pour l’instant, il ne s’emploie qu’avec *kuchnia*.
  pl.a1.unit18.lesson02.teach.sypialnia:
    title: Chambre
    gloss: chambre
    note: La pièce où l’on dort.
    example_gloss: Où est la chambre ?
  pl.a1.unit18.lesson02.teach.lazienka:
    title: Salle de bain
    gloss: salle de bains
    note: La pièce avec la douche et les toilettes.
    example_gloss: Où est la salle de bains ?
  pl.a1.unit18.lesson02.teach.gdzie_tam_recap:
    title: Où, là-bas – encore
    gloss: Gdzie, tam – tu connais déjà ces mots grâce aux leçons précédentes, par exemple Bank jest tam (la banque est là-bas).
    note: Un petit rappel avant que cette leçon les utilise pour parler des pièces.
  pl.a1.unit18.lesson02.teach.w_pokoje_locative_note:
    title: Dans la pièce, dans la cuisine…
    gloss: 'W + pièce, cuisine, chambre, salle de bains : w pokoju, w kuchni, w sypialni, w łazience – même schéma que w szkole (à l’école) ou w biurze (au bureau).'
    note: 'C’est le même principe que pour les lieux de travail déjà appris : la terminaison change un peu pour dire « dans » cette pièce.'
  pl.a1.unit18.lesson02.teach.gdzie_jest_lazienka_phrase:
    title: Où est la salle de bains ?
    gloss: Où est la salle de bains ? La salle de bains est là-bas.
    note: Un échange naturel pour trouver une pièce chez quelqu’un.
  pl.a1.unit18.lesson02.teach.kuchnia_jest_mala_phrase:
    title: La cuisine est petite
    gloss: La cuisine est petite.
    note: On réutilise le mot de taille vu plus tôt dans cette leçon.
  pl.a1.unit18.lesson03.teach.recap_words:
    title: Oui, et, sont – encore
    gloss: Tak, i, są, A, ja, jeden – tu connais déjà ces mots grâce aux leçons précédentes.
    note: Un petit rappel avant le dialogue de cette leçon.
  pl.a1.unit18.lesson03.teach.lodowka:
    title: Réfrigérateur
    gloss: réfrigérateur / frigo
    note: Un appareil courant de la cuisine.
    example_gloss: Il y a un frigo dans la cuisine.
  pl.a1.unit18.lesson03.teach.piekarnik:
    title: Four
    gloss: four
    note: Un autre appareil courant de la cuisine.
    example_gloss: Il y a un four dans la cuisine.
  pl.a1.unit18.lesson03.teach.dialogue.line01:
    title: Marek décrit sa maison
    gloss: J’ai une maison. La maison est grande.
    note: Marek ouvre la conversation en décrivant son logement.
  pl.a1.unit18.lesson03.teach.dialogue.line02:
    title: Ewa pose une question sur les pièces
    gloss: Combien de pièces as-tu ?
    note: Ewa pose une question de suite naturelle.
  pl.a1.unit18.lesson03.teach.dialogue.line03:
    title: Marek répond
    gloss: J’ai deux pièces. Dans la maison, il y a une cuisine, une chambre et une salle de bains.
    note: Marek indique son nombre de pièces et énumère les pièces de sa maison.
  pl.a1.unit18.lesson03.teach.dialogue.line04:
    title: Ewa décrit son logement
    gloss: Et moi, j’ai un appartement. J’ai une pièce.
    note: Ewa passe à la description de son propre logement, plus petit.
  pl.a1.unit18.lesson03.teach.dialogue.line05:
    title: Ewa pose une question sur la cuisine
    gloss: La cuisine est petite ?
    note: Ewa pose à Marek une question de suite sur sa cuisine.
  pl.a1.unit18.lesson03.teach.dialogue.line06:
    title: Marek répond
    gloss: Oui, la cuisine est petite. Dans la cuisine, il y a un frigo et un four.
    note: Marek confirme la taille de la cuisine et nomme deux objets qui s’y trouvent.
