    feedback: '*Chciałabym* suivi d’un infinitif signifie « je voudrais ». La terminaison indique le genre de la personne qui parle : *-abym* au féminin, *-bym* au masculin.'
  pl.a1.unit48.lesson04.exercise06.respond_na_osma_poprosze:
