  pl.a1.unit48.lesson04.exercise01.listen_jaki_film_chce:
    instruction: Écoute et choisis ce que demande Iga.
    correct_option: Bonjour ! Quel film souhaitez-vous voir ?
    distractors:
    - Bonjour ! Quelle place souhaitez-vous ?
    - Bonsoir ! Le film affiche-t-il complet ?
    - Bonjour ! Voulez-vous du pop-corn ?
    accepted_answers:
    - value: Bonjour ! Quel film souhaitez-vous voir ?
      status: correct
    feedback: 'Iga dit : Dzień dobry! Jaki film chce pani obejrzeć?'
  pl.a1.unit48.lesson04.exercise02.comprehend_nowy_film:
    instruction: Écoute le dialogue et choisis le film que Nina veut voir.
    correct_option: Le nouveau film.
    distractors:
    - La séance pour enfants.
    - N’importe quel film lui convient.
    - Elle ne le dit pas.
    accepted_answers:
    - value: Le nouveau film.
      status: correct
    feedback: Nina veut *nowy film*. L'adjectif *nowy* s'accorde avec *film*, qui est masculin ; comme il désigne une chose inanimée, il reste identique à l'accusatif.
    prompt_blocks:
    - Quel film Nina veut-elle voir ?
  pl.a1.unit48.lesson04.exercise03.comprehend_a_na_ktora:
    instruction: Écoute le dialogue et choisis ce qu'Iga demande ensuite à Nina.
    correct_option: L’heure à laquelle elle souhaite assister à la séance.
    distractors:
    - Si elle veut du pop-corn.
    - Si elle veut un reçu.
    - Elle ne demande rien.
    accepted_answers:
    - value: L’heure à laquelle elle souhaite assister à la séance.
      status: correct
    feedback: Iga demande *a na którą godzinę?* *Na* suivi de l'accusatif sert à indiquer l'heure pour laquelle on réserve une séance, et *którą* s'accorde avec *godzina*, qui est féminin.
    prompt_blocks:
    - Que demande ensuite Iga à Nina ?
  pl.a1.unit48.lesson04.exercise04.comprehend_na_osma:
    instruction: Écoute le dialogue et choisis l’heure à laquelle Nina veut assister à la séance.
    correct_option: Huit heures.
    distractors:
    - Sept heures.
    - Six heures.
    - Le dialogue ne le dit pas.
    accepted_answers:
    - value: Huit heures.
      status: correct
    feedback: Nina dit *na ósmą* (« pour huit heures »). L'ordinal *ósma* s'accorde avec *godzina*, féminin, et se met à l'accusatif après *na*.
    prompt_blocks:
    - À quelle heure Nina veut-elle voir le film ?
