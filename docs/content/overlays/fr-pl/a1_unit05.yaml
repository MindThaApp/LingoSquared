teaching:
  pl.a1.unit05.lesson01.teach.rodzina:
    title: La famille
    gloss: famille
    note: 'Le mot général pour « famille » : il désigne tout le foyer, et pas un seul lien de parenté.'
    example_gloss: Voici ma famille.
  pl.a1.unit05.lesson01.teach.matka_ojciec:
    title: Mère, père
    gloss: mère ; père
    note: Les deux mots de base pour les parents. Tu entendras aussi les formes affectueuses mama et tata dans la langue de tous les jours, mais matka et ojciec sont les formes neutres et standard enseignées ici.
    example_gloss:
    - C’est ma mère.
    - C’est mon père.
  pl.a1.unit05.lesson01.teach.brat_siostra:
    title: Frère, sœur
    gloss: frère ; sœur
    note: 'Ce sont deux noms réguliers : brat est masculin, siostra est féminin. Cela compte pour l’accord mój/moja dans la note de grammaire de cette leçon.'
    example_gloss:
    - C’est mon frère.
    - C’est ma sœur.
  pl.a1.unit05.lesson01.teach.rodzice:
    title: Parents
    gloss: parents
    note: 'Rodzice est un nom pluriel du genre masculin personnel : il prend sa propre forme de possessif, moi (et non mój/moja), que tu verras dans l’exemple et la note de grammaire de cette leçon.'
    example_gloss: Mes parents habitent à Varsovie.
  pl.a1.unit05.lesson01.teach.moj_moja_note:
    title: 'Mon, ma, mes : mój, moja, moi'
    gloss: mon père, mon frère -- ma mère, ma sœur -- mes parents.
    note: 'Les possessifs polonais s’accordent avec le genre du nom qu’ils accompagnent : *mój* devant un nom masculin (*mój ojciec*, *mój brat*), *moja* devant un nom féminin (*moja matka*, *moja siostra*), et la forme irrégulière à part *moi* devant le pluriel masculin personnel *rodzice*.'
  pl.a1.unit05.lesson01.teach.to_jest_moj_ojciec:
    title: C’est mon père
    gloss: C’est mon père.
    note: '*To jest* (c’est) fonctionne de la même façon quel que soit le genre du nom : seul le possessif mój/moja change.'
  pl.a1.unit05.lesson02.teach.dziadek_babcia:
    title: Grand-père, grand-mère
    gloss: grand-père ; grand-mère
    note: Les mots courants pour grand-père et grand-mère, utilisés aussi bien par les enfants que par les adultes.
    example_gloss:
    - C’est mon grand-père.
    - C’est ma grand-mère.
  pl.a1.unit05.lesson02.teach.wujek_ciotka:
    title: Oncle, tante
    gloss: oncle ; tante
    note: Ces mots désignent à la fois le frère ou la sœur d’un parent et le conjoint du frère ou de la sœur d’un parent, comme « oncle » et « tante » en français.
    example_gloss:
    - C’est mon oncle.
    - C’est ma tante.
  pl.a1.unit05.lesson02.teach.syn_corka:
    title: Fils, fille
    gloss: fils ; fille
    note: 'Les exemples montrent l’accusatif nécessaire après *mieć* (avoir) : *syn* devient *syna*, *córka* devient *córkę*. Les notes de grammaire suivantes expliquent pourquoi la terminaison change.'
    example_gloss:
    - J’ai un fils.
    - J’ai une fille.
  pl.a1.unit05.lesson02.teach.miec_note:
    title: 'Avoir : mam, masz, ma'
    gloss: 'avoir : j’ai, tu as, il/elle a -- j’ai un frère, tu as une sœur, il/elle a un fils.'
    note: '*Mieć* est le verbe « avoir ». *Mam* (j’ai) et *ma* (il/elle a) sont les principales formes nouvelles de cette leçon ; tu as déjà rencontré *masz* (tu as) dans la question sur l’âge, à l’unité 2.'
  pl.a1.unit05.lesson02.teach.accusative_note:
    title: Dire ce que l’on a
    gloss: 'Après « avoir », le nom change de terminaison : brat -> brata, siostra -> siostrę, syn -> syna, córka -> córkę.'
    note: C’est l’accusatif, la forme que prend un nom complément d’objet direct d’un verbe comme *mieć*. Les noms masculins désignant des personnes (et des animaux), comme *brat* et *syn*, prennent *-a* ; les noms féminins comme *siostra* et *córka* remplacent leur *-a* final par *-ę*.
  pl.a1.unit05.lesson02.teach.mam_brata_siostre:
    title: J’ai un frère et une sœur
    gloss: J’ai un frère et une sœur.
    note: Cette phrase met en pratique les terminaisons de l’accusatif vues dans la note de grammaire, avec le nouveau connecteur *i* (et).
  pl.a1.unit05.lesson03.teach.lub:
    title: Ou
    gloss: ou
    note: S’emploie comme « ou » en français dans une question fermée qui propose deux options.
    example_gloss: As-tu un frère ou une sœur ?
  pl.a1.unit05.lesson03.teach.tylko:
    title: Seulement
    gloss: seulement
    note: Se place juste avant le mot qu’il limite.
    example_gloss: Je n’ai qu’une sœur.
  pl.a1.unit05.lesson03.teach.gdzie:
    title: Où
    gloss: où
    note: Un mot interrogatif de base, qui va naturellement avec mieszkać (habiter), comme dans le dialogue de cette leçon.
    example_gloss: Où habite ton frère ?
  pl.a1.unit05.lesson03.teach.on_ona_mieszka_note:
    title: Il, elle -- et « habiter »
    gloss: 'il, elle = on, ona -- habiter : j’habite, il/elle habite. Il habite à Gdańsk. Elle habite à Cracovie.'
    note: '*On* (il) et *ona* (elle) sont les pronoms de la troisième personne. *Mieszkać* (habiter) suit le même schéma de 1re et 3e personne que *mieć* : *mieszkam* (j’habite, vu à l’unité 1 dans *Mieszkam w Warszawie*) et *mieszka* (il/elle habite). Les noms de lieux prennent *w* + le locatif : *Gdańsk* devient *w Gdańsku*, *Kraków* devient *w Krakowie*, comme dans *Mieszkam w Warszawie* à l’unité 1.'
  pl.a1.unit05.lesson03.teach.dialogue.line01:
    title: Marek pose des questions sur les frères et sœurs
    gloss: Marek demande à Ewa si elle a un frère ou une sœur.
    note: 'Une question fermée avec *Czy*, le même marqueur interrogatif qu’à l’unité 1. Ewa et Marek se connaissent maintenant bien : ils sont passés du *pan*/*pani* formel au *ty* informel (*masz*, *A ty?*, *twój*).'
  pl.a1.unit05.lesson03.teach.dialogue.line02:
    title: Ewa répond et retourne la question
    gloss: Ewa dit qu’elle a un frère et une sœur, puis pose la même question à Marek.
    note: '*A ty?* (« Et toi ? ») est une façon brève et naturelle de retourner la question à la personne qui l’a posée.'
  pl.a1.unit05.lesson03.teach.dialogue.line03:
    title: Marek répond
    gloss: Marek dit qu’il n’a qu’une sœur, qui habite à Cracovie, puis interroge Ewa sur son frère.
    note: 'Marek n’a pas de frère : il a seulement *tylko siostrę* (une sœur). Il peut sans risque poser sa question sur le frère d’Ewa, puisqu’elle a déjà dit qu’elle en a un.'
  pl.a1.unit05.lesson03.teach.dialogue.line04:
    title: Ewa répond
    gloss: Ewa dit que son frère habite à Gdańsk et qu’il a un fils et une fille.
    note: Reprend le schéma d’accusatif de syn/córka vu dans la leçon 2 de cette unité.
  pl.a1.unit05.lesson03.teach.dialogue.line05:
    title: Marek réagit
    gloss: 'Marek dit : quelle chouette famille !'
    note: '*Fajna* est un mot familier et courant pour dire « sympa » ou « chouette » : une réaction de conclusion naturelle, du même registre que *Świetnie!* à l’unité 4.'
