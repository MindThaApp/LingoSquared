teaching:
  pl.a1.unit08.lesson01.teach.bank_poczta:
    title: Banque, poste
    gloss: banque ; poste
    note: 'Deux démarches du quotidien : bank ressemble beaucoup au mot français ; poczta, c''est là où l''on va pour envoyer une lettre ou un colis.'
    example_gloss:
    - C'est une banque.
    - C'est une poste.
  pl.a1.unit08.lesson01.teach.apteka_restauracja:
    title: Pharmacie, restaurant
    gloss: pharmacie ; restaurant
    note: Apteka est l'endroit où l'on achète des médicaments (et non un magasin général) ; restauracja ressemble beaucoup au mot « restaurant ».
    example_gloss:
    - C'est une pharmacie.
    - C'est un restaurant.
  pl.a1.unit08.lesson01.teach.hotel_park:
    title: Hotel, park
    gloss: hôtel ; parc
    note: Deux mots très proches du français, faciles à reconnaître à l'écrit comme à l'oral.
    example_gloss:
    - C'est un hôtel.
    - C'est un parc.
  pl.a1.unit08.lesson01.teach.gdzie_jest_note:
    title: Où est + [lieu] ?
    gloss: 'Où est + [lieu] ? -- Gdzie (où) plus jest (est) sert à demander où se trouve un lieu : Où est la banque ? Où est la pharmacie ?'
    note: '*Gdzie* signifie « où » et *jest* signifie « est » : ensemble, *Gdzie jest...?* est la question courante pour demander où se trouve un lieu. Utilise-la telle quelle pour un seul lieu ; pour plusieurs lieux, le polonais emploie *są* (« sont »).'
  pl.a1.unit08.lesson01.teach.gdzie_jest_bank:
    title: Où est la banque ?
    gloss: Où se trouve la banque ?
    note: Le modèle de la note de grammaire mis en pratique avec le premier nom de lieu de cette leçon.
  pl.a1.unit08.lesson02.teach.blisko_daleko:
    title: Près, loin
    gloss: près ; loin
    note: Une paire d'opposés simple, utilisée directement après jest pour dire si un lieu est proche ou éloigné.
    example_gloss:
    - Le parc est près.
    - L'hôtel est loin.
  pl.a1.unit08.lesson02.teach.niedaleko:
    title: Pas loin
    gloss: pas loin
    note: 'Littéralement *nie* (pas) plus *daleko* (loin), fondus en un seul mot : une façon plus douce, très courante, de rassurer quelqu''un en lui disant qu''un lieu est facile à atteindre.'
    example_gloss: La pharmacie n'est pas loin.
  pl.a1.unit08.lesson02.teach.obok_naprzeciwko:
    title: À côté de, en face de
    gloss: à côté de ; en face de
    note: Ces deux mots décrivent la position d'un lieu par rapport à un repère, et pas seulement sa proximité. Tous deux demandent que le nom qui suit se mette au génitif -- voir la note de grammaire de cette leçon.
    example_gloss:
    - La pharmacie est à côté de la banque.
    - Le restaurant est en face de l'hôtel.
  pl.a1.unit08.lesson02.teach.genitive_note:
    title: 'Après ''obok''/''naprzeciwko''/''blisko + nom'' : le génitif'
    gloss: 'Après « à côté de » / « en face de » / « près de » + un lieu : génitif -- bank -> de la banque, hotel -> de l''hôtel, park -> du parc. La pharmacie est à côté de la banque. Le restaurant est en face de l''hôtel. Le restaurant est près du parc.'
    note: '*Obok*, *naprzeciwko* et *blisko* (quand il est suivi d''un lieu, et non employé seul) demandent tous le génitif : le nom qui suit change donc de terminaison. Pour ces trois noms masculins réguliers, on ajoute *-u* : *bank* devient *banku*, *hotel* devient *hotelu*, *park* devient *parku*. Employé seul, *blisko* n''a pas besoin de génitif : *To jest blisko* (« C''est proche ») est tout aussi correct que *blisko parku* (« près du parc »).'
  pl.a1.unit08.lesson02.teach.apteka_obok_banku:
    title: La pharmacie est à côté de la banque
    gloss: La pharmacie est à côté de la banque.
    note: 'Le modèle en -u de la note de grammaire dans une vraie phrase : bank devient banku après obok.'
  pl.a1.unit08.lesson03.teach.przepraszam:
    title: Excusez-moi
    gloss: excusez-moi / pardon
    note: 'La façon courante d''attirer l''attention d''un inconnu avant de poser une question : on le dit avant la question, et non après.'
    example_gloss: Excusez-moi, où est la banque ?
  pl.a1.unit08.lesson03.teach.dialogue.line01:
    title: Ewa demande où est la pharmacie
    gloss: Ewa s'excuse et demande où se trouve la pharmacie.
    note: 'Przepraszam ouvre la question, comme le décrit la note de vocabulaire de cette leçon : même avec quelqu''un qu''elle connaît, comme Marek, c''est la façon polie de l''interrompre avant de poser une question.'
  pl.a1.unit08.lesson03.teach.dialogue.line02:
    title: Marek indique où se trouve la pharmacie
    gloss: Marek dit que la pharmacie n'est pas loin, à côté de la banque.
    note: Combine niedaleko et obok + banku, deux points vus dans la note de grammaire de cette leçon.
  pl.a1.unit08.lesson03.teach.dialogue.line03:
    title: Ewa remercie Marek et demande où est le restaurant
    gloss: Ewa dit merci et demande où se trouve le restaurant.
    note: Dziękuję, déjà vu dans les unités précédentes ; A (« et ») relie la nouvelle question à la précédente.
  pl.a1.unit08.lesson03.teach.dialogue.line04:
    title: Marek indique où se trouve le restaurant
    gloss: Marek dit que le restaurant est en face de l'hôtel, près du parc.
    note: Naprzeciwko + hotelu (génitif, même modèle que banku) et blisko pour un second repère.
  pl.a1.unit08.lesson03.teach.dialogue.line05:
    title: Ewa remercie encore Marek
    gloss: Ewa dit merci beaucoup.
    note: Bardzo (« beaucoup ») renforce dziękuję, comme dans proszę bardzo.
  pl.a1.unit08.lesson03.teach.dialogue.line06:
    title: Marek répond
    gloss: Marek dit « Je vous en prie. »
    note: Proszę bardzo, la réponse habituelle à un remerciement, déjà vue dans l’unité sur les achats.
