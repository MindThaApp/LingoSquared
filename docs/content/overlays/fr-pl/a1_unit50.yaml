  pl.a1.unit50.lesson04.exercise02.comprehend_bilet_na_koncert:
    instruction: Écoute le dialogue et choisis pour quoi Nina veut un billet.
    correct_option: Le groupe.
    distractors:
    - Un guide.
    - Un programme.
    - Elle ne le dit pas.
    accepted_answers:
    - value: Le groupe.
      status: correct
    feedback: Nina veut *bilet na koncert zespołu*. *Zespołu* est au génitif (« du groupe »), que le polonais emploie pour exprimer l’appartenance.
    prompt_blocks:
    - Pour quoi Nina veut-elle un billet ?
  pl.a1.unit50.lesson04.exercise03.comprehend_czy_chce_pani:
    instruction: Écoute le dialogue et choisis ce que Jan demande ensuite à Nina.
    correct_option: Si elle veut un programme.
    distractors:
    - Si elle veut un guide.
    - Si elle souhaite une table.
    - Il ne demande rien.
    accepted_answers:
    - value: Si elle veut un programme.
      status: correct
    feedback: 'Jan demande *czy chce pani też program?* *Program* est masculin mais ne désigne pas une personne : l’accusatif est donc identique au nominatif.'
    prompt_blocks:
    - Que demande Jan à Nina ?
  pl.a1.unit50.lesson04.exercise04.comprehend_nie_trzeba:
    instruction: Écoute le dialogue et indique si Nina veut un programme.
    correct_option: Non, elle dit que ce n’est pas nécessaire.
    distractors:
    - Oui, elle en souhaite un.
    - Elle ne répond pas.
    - Elle demande deux programmes.
    accepted_answers:
    - value: Non, elle dit que ce n’est pas nécessaire.
      status: correct
    feedback: Nina dit *Nie, dziękuję, nie trzeba.* *Nie trzeba* signifie « ce n’est pas nécessaire », et *dziękuję* signifie « merci ».
    prompt_blocks:
    - Nina veut-elle un programme ?
