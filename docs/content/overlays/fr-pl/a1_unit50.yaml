  pl.a1.unit50.lesson04.exercise01.listen_czy_chce_pani:
    instruction: Écoute et choisis ce que Jan demande.
    correct_option: Bonsoir ! Voulez-vous un billet pour le concert ?
    distractors:
    - Bonsoir ! Voulez-vous une table ?
    - Bonjour ! Le concert est-il complet ?
    - Bonjour ! Voulez-vous du pop-corn ?
