answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Polonais A1
  description: 'Polonais débutant pour parler des loisirs : vocabulaire des hobbies, expressions de fréquence, demander et dire ce qu’on fait pendant son temps libre, et comparer les loisirs de deux personnes.'
units:
  pl.a1.unit24.hobby:
    title: Les loisirs et le temps libre
lessons:
  pl.a1.unit24.lesson01.czytanie_sport_i_gotowanie:
    title: Lire, faire du sport et cuisiner
  pl.a1.unit24.lesson02.muzyka_rysowanie_i_gry:
    title: Musique, dessin et jeux vidéo
  pl.a1.unit24.lesson03.co_robisz_w_wolnym:
    title: Que fais-tu pendant ton temps libre ?
  pl.a1.unit24.lesson04.ewa_i_marek_rozmawiaja:
    title: Ewa et Marek parlent de leurs loisirs
  pl.a1.unit24.lesson05.marek_i_ewa_porownuja:
    title: Marek et Ewa comparent leurs loisirs
  pl.a1.unit24.lesson06.wspolne_planowanie_weekendu:
    title: Organiser un week-end ensemble
teaching:
  pl.a1.unit24.lesson01.teach.czytac_uprawiac_sport:
    title: Lire, faire du sport, cuisiner
    gloss: lire, faire de l’exercice / du sport, cuisiner
    note: 'Trois verbes de loisirs courants : *czytać* (lire), *uprawiać sport* (faire du sport) et *gotować* (cuisiner).'
    example_gloss:
    - J’aime lire un livre.
    - Je fais du sport le samedi.
    - J’aime cuisiner pour des amis.
  pl.a1.unit24.lesson01.teach.wolny_czas:
    title: Le temps libre
    gloss: temps libre
    note: '*Wolny czas* est l’expression clé pour parler de ses loisirs. L’adjectif *wolny* (libre) s’accorde avec le nom masculin *czas* ; dans *w wolnym czasie*, les deux sont au locatif.'
    example_gloss: Pendant mon temps libre, j’aime lire.
  pl.a1.unit24.lesson01.teach.w_wolnym_czasie:
    title: Dire ce que tu fais pendant ton temps libre
    gloss: Pendant mon temps libre, j’aime lire.
    note: '*Lubię* (j’aime) est suivi d’un infinitif : *lubię czytać*. *W wolnym czasie* se construit avec *w* + locatif.'
  pl.a1.unit24.lesson02.teach.sluchac_muzyki_rysowac:
    title: Musique, dessin, jeux vidéo
    gloss: écouter de la musique, dessiner, jouer aux jeux vidéo
    note: 'Trois autres loisirs : *słuchać muzyki* (écouter de la musique), *rysować* (dessiner) et *grać w gry* (jouer à des jeux).'
    example_gloss:
    - J’aime écouter de la musique.
    - Je dessine souvent.
    - J’aime jouer aux jeux vidéo avec des amis.
  pl.a1.unit24.lesson02.teach.lubie_sluchac_muzyki:
    title: Dire que tu aimes écouter de la musique
    gloss: J’aime écouter de la musique.
    note: '*Słuchać* se construit toujours avec le génitif : *słucham muzyki*, et non *muzyka*.'
  pl.a1.unit24.lesson02.teach.lubie_grac_w:
    title: Dire que tu aimes jouer aux jeux vidéo avec des amis
    gloss: J’aime jouer aux jeux vidéo avec des amis.
    note: '*Z przyjaciółmi* (avec des amis) se construit avec *z* + instrumental pluriel.'
  pl.a1.unit24.lesson03.teach.zawsze_czesto_czasami:
    title: Toujours, souvent, parfois, jamais
    gloss: toujours, souvent, parfois, jamais
    note: 'Les quatre adverbes de fréquence de base : *zawsze*, *często*, *czasami*, *nigdy*. Ils ne changent jamais de forme, et *nigdy* exige *nie* devant le verbe : *Nigdy nie gram.*'
    example_gloss:
    - Je fais toujours du sport le samedi.
    - Je lis souvent un livre.
    - Je dessine parfois.
    - Je ne joue jamais aux jeux vidéo.
  pl.a1.unit24.lesson03.teach.co_tydzien_co:
    title: Chaque semaine, chaque week-end
    gloss: chaque semaine, chaque week-end
    note: '*Co tydzień* et *co weekend* signifient tous deux « chaque... » ; *co* est suivi de l’accusatif et ne change jamais — voir la fiche suivante.'
    example_gloss:
    - Je cuisine pour des amis chaque semaine.
    - Je fais du sport chaque week-end.
  pl.a1.unit24.lesson03.teach.co_biernik_co:
    title: Co + accusatif
    gloss: '*Co* + accusatif signifie « chaque » : chaque semaine, chaque week-end, chaque mois.'
    note: '*Co* est un mot invariable qui signifie « chaque », quel que soit le nom. Les noms masculins inanimés comme *tydzień*, *weekend* et *miesiąc* ont la même forme au nominatif et à l’accusatif.'
  pl.a1.unit24.lesson03.teach.co_robisz_w:
    title: Poser une question sur le temps libre
    gloss: Que fais-tu pendant ton temps libre ?
    note: 'C’est la question centrale de cette unité : réutilise-la pour interroger quelqu’un sur ses loisirs.'
  pl.a1.unit24.lesson04.teach.ewa_czesto_razem:
    title: Ewa aborde le sujet des loisirs
    gloss: 'Ewa : Nous nous promenons souvent ensemble. Et toi, Marek, que fais-tu d’autre pendant ton temps libre ?'
    note: '*Spacerujemy* est la forme de *my* (nous) de *spacerować* ; *Marku* est le vocatif, employé quand on s’adresse directement à quelqu’un.'
  pl.a1.unit24.lesson04.teach.marek_lubie_gotowac:
    title: Les loisirs de Marek
    gloss: 'Marek : J’aime cuisiner, même à la maison. Et je fais souvent du sport.'
    note: '*Także w domu* (aussi à la maison) montre que Marek cuisine par plaisir, pas seulement dans son travail au restaurant ; *w domu* est au locatif.'
  pl.a1.unit24.lesson04.teach.ewa_gotujesz_tez:
    title: Ewa est surprise
    gloss: 'Ewa : Tu cuisines aussi à la maison ? Mais tu cuisines déjà toute la journée au travail !'
    note: '*Cały dzień* (toute la journée) souligne combien Marek cuisine déjà au travail ; *przecież* ajoute une nuance de « enfin, tout de même ».'
  pl.a1.unit24.lesson04.teach.marek_tak_ale:
    title: Marek s’explique
    gloss: 'Marek : Oui, mais cuisiner me détend. Et toi, qu’est-ce que tu aimes faire ?'
    note: '*Gotowanie mnie odpręża* signifie littéralement « cuisiner me détend » : en polonais, l’activité est souvent le sujet, et *mnie* (me) est à l’accusatif.'
  pl.a1.unit24.lesson04.teach.ewa_lubie_czytac:
    title: Les loisirs d’Ewa
    gloss: 'Ewa : J’aime lire et j’écoute souvent de la musique.'
    note: Réunit deux verbes de loisirs des leçons 1 et 2 dans une seule phrase avec *i* (et).
  pl.a1.unit24.lesson04.teach.marek_grasz_tez:
    title: Marek pose une question sur les jeux vidéo
    gloss: 'Marek : Tu joues aussi aux jeux vidéo ?'
    note: Une courte question fermée avec *grać w gry* de la leçon 2 ; *też* signifie « aussi ».
  pl.a1.unit24.lesson04.teach.ewa_nie_nigdy:
    title: Ewa répond
    gloss: 'Ewa : Non, je ne joue jamais aux jeux vidéo. Mais je dessine parfois !'
    note: '*Nigdy* (jamais) et *czasami* (parfois) de la leçon 3, opposés dans une seule réponse. Remarque la double négation : *nigdy nie gram*.'
  pl.a1.unit24.lesson05.teach.marek_i_ja:
    title: Comparer des loisirs
    gloss: Marek et moi, nous nous promenons souvent ensemble. Mais nous avons aussi d’autres loisirs. Marek aime cuisiner, même à la maison, et il fait souvent du sport. J’aime lire et j’écoute souvent de la musique. Je dessine parfois, mais je ne joue jamais aux jeux vidéo. Et toi, qu’aimes-tu faire pendant ton temps libre ?
    note: Le message d’Ewa reprend les informations de la leçon 4 et se termine par la question centrale de l’unité, adressée au lecteur.
    glosses:
      spacerujemy: se promener
      często: souvent
      razem: ensemble
      inne: autre
      gotować: cuisine
      lubi: aime
      domu: à la maison
      uprawia: fait du sport
      czytać: lire
      słucham: écouter
      muzyki: musique
      rysuję: dessiner
      czasami: parfois
      gram: jouer aux jeux vidéo
      nigdy: jamais
      wolnym: libre
      czasie: temps
  pl.a1.unit24.lesson06.teach.marek_co_robisz:
    title: Marek demande ce qu’Ewa fait ce week-end
    gloss: 'Marek : Qu’est-ce que tu fais ce week-end ?'
    note: '*W ten weekend* (ce week-end) se construit avec *w* + accusatif pour une expression de temps.'
  pl.a1.unit24.lesson06.teach.ewa_jeszcze_nie:
    title: Ewa hésite
    gloss: 'Ewa : Je ne sais pas encore. J’aime lire, mais j’ai aussi envie de sortir.'
    note: '*Wyjść na dwór* (sortir dehors) est une façon courante de dire qu’on veut sortir de chez soi ; *chcę* + infinitif signifie « je veux ».'
  pl.a1.unit24.lesson06.teach.marek_pojdziemy_razem:
    title: Marek propose un programme
    gloss: 'Marek : On va se promener ensemble ? Ensuite, je nous préparerai quelque chose à manger.'
    note: '*Potem* (ensuite) est le mot qui marque la succession ; *ugotuję* est perfectif, car la cuisine est vue comme un résultat achevé.'
  pl.a1.unit24.lesson06.teach.ewa_dobry_pomysl:
    title: Ewa accepte
    gloss: 'Ewa : Bonne idée ! J’aime autant me promener que cuisiner.'
    note: '*Lubię i ..., i ...* (« autant... que... ») montre qu’Ewa aime deux choses de la même façon, sans préférer l’une à l’autre.'
  pl.a1.unit24.lesson06.teach.marek_swietnie_to:
    title: Marek confirme
    gloss: 'Marek : Super. Alors on se voit samedi !'
    note: Une phrase de conclusion amicale qui confirme le programme de samedi ; *w sobotę* se construit avec *w* + accusatif pour un jour de la semaine.
