teaching:
  pl.a1.unit20.lesson01.teach.recap_jest_sa_to_poprosze:
    title: 'Est, sont, ceci, je voudrais : on révise'
    gloss: 'Jest, są, To, Poproszę, Ile, kosztuje, złotych, chcę, do : tu connais déjà ces mots grâce aux leçons précédentes.'
    note: Un petit rappel avant que cette leçon les utilise pour parler d’achats de vêtements.
  pl.a1.unit20.lesson01.teach.sklep:
    title: Magasin
    gloss: magasin
    note: Le mot général pour désigner une boutique.
    example_gloss: Je vais au magasin.
  pl.a1.unit20.lesson01.teach.koszula:
    title: Chemise
    gloss: chemise
    note: 'Un nom féminin : il prendra des formes d’adjectifs au féminin.'
    example_gloss: C’est une chemise.
  pl.a1.unit20.lesson01.teach.spodnie:
    title: Pantalon
    gloss: pantalon
    note: 'Toujours au pluriel en polonais, même pour un seul pantalon : il n’existe pas de forme au singulier.'
    example_gloss: Ce sont des pantalons.
  pl.a1.unit20.lesson01.teach.kupic:
    title: Acheter
    gloss: acheter
    note: 'S’emploie après « *chcę* » (je veux), comme « *iść* » (aller) dans une leçon précédente : « *chcę kupić* » signifie « je veux acheter ».'
    example_gloss: Je veux acheter une chemise.
  pl.a1.unit20.lesson01.teach.chce_kupic_spodnie_phrase:
    title: Je veux acheter un pantalon
    gloss: Je veux acheter un pantalon.
    note: Le même schéma chcę + infinitif, appliqué à un pantalon.
  pl.a1.unit20.lesson01.teach.ile_kosztuje_koszula_phrase:
    title: Combien coûte la chemise ?
    gloss: Combien coûte la chemise ?
    note: Une façon naturelle de demander le prix d’un article précis, en reprenant « *Ile kosztuje* » de la leçon sur les achats.
  pl.a1.unit20.lesson02.teach.jaki_note:
    title: 'Quel / quelle : la forme masculine'
    gloss: 'Jaki, Jaka : « *Jaki* » s’emploie pour les noms masculins, « *Jaka* » pour les noms féminins (tu connais déjà « *Jaka* » grâce à la leçon sur la météo).'
    note: '« *Kolor* » (couleur) est masculin : il va donc avec « *Jaki* », et non « *Jaka* ».'
  pl.a1.unit20.lesson02.teach.kolor:
    title: Couleur
    gloss: couleur
    note: Un nom masculin.
    example_gloss: Quelle couleur ?
  pl.a1.unit20.lesson02.teach.sukienka:
    title: Robe
    gloss: robe
    note: Un autre nom féminin, comme « *koszula* ».
    example_gloss: C’est une robe.
  pl.a1.unit20.lesson02.teach.niebieska_note:
    title: Bleu
    gloss: 'Koszula jest niebieska. : « *niebieska* » s’accorde avec les noms féminins, comme « *koszula* ».'
    note: 'Uniquement cette forme : dans ce cours, elle est pour l’instant liée à « *koszula* ».'
  pl.a1.unit20.lesson02.teach.czerwona_note:
    title: Rouge
    gloss: 'Sukienka jest czerwona. : « *czerwona* » s’accorde aussi avec les noms féminins, tout comme « *niebieska* ».'
    note: Ici, cette forme est liée à « *sukienka* », de la même façon que « *niebieska* » l’est à « *koszula* ».
  pl.a1.unit20.lesson02.teach.koszula_niebieska_phrase:
    title: La chemise est bleue
    gloss: La chemise est bleue.
    note: Une information que cette unité reprendra plus tard, quand Marek cherchera une chemise.
  pl.a1.unit20.lesson02.teach.sukienka_czerwona_phrase:
    title: La robe est rouge
    gloss: La robe est rouge.
    note: Le même schéma jest + couleur, pour un autre article.
  pl.a1.unit20.lesson03.teach.recap_words:
    title: 'Bonjour, s’il vous plaît, très : on révise'
    gloss: 'Dzień, dobry, Proszę, bardzo, i, Dobrze, Co : tu connais déjà ces mots grâce aux leçons précédentes.'
    note: Un petit rappel avant le dialogue au magasin de cette leçon.
  pl.a1.unit20.lesson03.teach.rozmiar:
    title: Taille
    gloss: taille
    note: En Pologne, les tailles de vêtements sont souvent simplement les lettres S, M et L, comme en France.
    example_gloss: Quelle taille ?
  pl.a1.unit20.lesson03.teach.pan_chce_note:
    title: Monsieur, veut
    gloss: 'Co pan chce kupić? : « *pan* » est la façon polie de s’adresser à un homme, comme « *pani* » pour une femme (tu connais déjà « *pani* » grâce à la leçon sur les achats).'
    note: '« *chce* » est la forme « il/elle » de « *chcieć* » : tu connais déjà « *chcę* » (je veux) et « *chcesz* » (tu veux).'
  pl.a1.unit20.lesson03.teach.co_pan_chce_kupic_phrase:
    title: Que voulez-vous acheter, monsieur ?
    gloss: Que voulez-vous acheter, monsieur ?
    note: La façon dont un vendeur entame poliment la conversation avec un client.
  pl.a1.unit20.lesson03.teach.dialogue.line01:
    title: Le vendeur accueille Marek
    gloss: Bonjour ! Que voulez-vous acheter, monsieur ?
    note: Sprzedawca (le vendeur) commence avec le même registre poli que le commerçant du marché dans l’unité précédente sur les achats.
  pl.a1.unit20.lesson03.teach.dialogue.line02:
    title: Marek dit ce qu’il veut
    gloss: Je veux acheter une chemise et un pantalon.
    note: Marek indique les deux articles qu’il cherche.
  pl.a1.unit20.lesson03.teach.dialogue.line03:
    title: Le vendeur demande la taille
    gloss: Quelle taille ?
    note: Une question de suivi courte et naturelle.
  pl.a1.unit20.lesson03.teach.dialogue.line04:
    title: Marek donne sa taille
    gloss: Taille M.
    note: Marek répond simplement par la lettre de la taille, comme on le fait naturellement.
  pl.a1.unit20.lesson03.teach.dialogue.line05:
    title: Le vendeur confirme le stock et le prix
    gloss: Nous avons une chemise bleue et un pantalon. Cela fait 100 zlotys en tout.
    note: '« *Mamy* » signifie « nous avons » (comme « *mam* »/« *masz* »). Après ce verbe, « *koszula* » devient « *koszulę* » et « *niebieska* » devient « *niebieską* » : le même changement que dans « *Chcę kupić koszulę* ». La couleur correspond à la chemise bleue de la leçon 2.'
  pl.a1.unit20.lesson03.teach.dialogue.line06:
    title: Marek accepte
    gloss: Très bien, je les prends.
    note: Marek confirme l’achat et clôt l’échange.
