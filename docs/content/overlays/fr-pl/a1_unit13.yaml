teaching:
  pl.a1.unit13.lesson01.teach.muzyka:
    title: La musique
    gloss: musique
    note: Un sujet courant pour parler de ce qu’on aime ou non -- un mot facile à reconnaître, car il ressemble beaucoup au mot français.
    example_gloss: J’aime la musique.
  pl.a1.unit13.lesson01.teach.muzyke_accusative_note:
    title: Muzyka -> muzykę
    gloss: Avec lubić (aimer) + complément, muzyka devient muzykę, comme kawa devient kawę. Lubię muzykę, et non Lubię muzyka.
    note: 'C’est le même schéma que tu connais déjà : *muzyka* devient *muzykę* comme complément de *lubię*, tout comme *kawa* devient *kawę*.'
  pl.a1.unit13.lesson01.teach.lubisz:
    title: Tu aimes
    gloss: tu aimes (informel, ty)
    note: La forme « ty » de lubić -- celle qu’il faut pour demander directement à un ami s’il aime quelque chose.
    example_gloss: Tu aimes la musique ?
  pl.a1.unit13.lesson01.teach.lubic_paradigm_note:
    title: 'Lubić: lubię, lubisz, lubi'
    gloss: 'Lubić (aimer) : lubię (je), lubisz (tu), lubi (il/elle). Tu connais déjà lubię et lubi -- lubisz est la nouvelle forme, pour la personne à qui tu parles.'
    note: '*Lubię* et *lubi* n’ont plus de secret pour toi -- *lubisz* complète le verbe avec la forme « tu » qui manquait.'
  pl.a1.unit13.lesson01.teach.czy_lubisz_muzyke:
    title: Tu aimes la musique ?
    gloss: Tu aimes la musique ?
    note: Czy ouvre une question oui/non -- la façon naturelle de demander à un ami ce qu’il préfère.
  pl.a1.unit13.lesson01.teach.tak_lubie:
    title: Oui, j’aime ça.
    gloss: Oui, j’aime ça.
    note: Une réponse courte et naturelle -- inutile de répéter le mot muzykę.
  pl.a1.unit13.lesson01.teach.nie_nie_lubie:
    title: Non, je n’aime pas.
    gloss: Non, je n’aime pas ça.
    note: Nie nie lubię paraît redoublé, mais ce n’est pas une faute -- le premier nie répond à la question, le second nie lubię.
  pl.a1.unit13.lesson01.teach.ellipsis_note:
    title: Réponses courtes
    gloss: 'Réponse courte : Tak, lubię. / Nie, nie lubię. -- inutile de répéter le mot muzykę, puisque la question montre déjà de quoi on parle.'
    note: Tout comme *Pyszny?* peut se dire seul, *Tak, lubię.* n’a pas besoin de rappeler le sujet -- le contexte suffit.
  pl.a1.unit13.lesson01.teach.bardzo_lubie_muzyke:
    title: J’aime beaucoup la musique
    gloss: J’aime beaucoup la musique.
    note: Bardzo (beaucoup / très) renforce une simple préférence -- tu connais bardzo depuis la toute première unité.
  pl.a1.unit13.lesson02.teach.wole:
    title: je préfère
    gloss: je préfère
    note: Un tout nouveau verbe dans cette unité, woleć (préférer) -- on n’apprend ici que la forme « je », comme pour lubię.
    example_gloss: Je préfère le thé.
  pl.a1.unit13.lesson02.teach.wolec_scope_note:
    title: 'Woleć : seulement wolę dans cette unité'
    gloss: 'Woleć (préférer) : wolę (je) -- cette leçon n’enseigne que la forme « je », comme pour lubię. Wolę kawę. = Je préfère le café.'
    note: Seulement la forme *ja* (je) de *woleć* pour l’instant, exactement comme pour *lubię* à son introduction.
  pl.a1.unit13.lesson02.teach.kawa_herbata_recap:
    title: Encore le café et le thé
    gloss: 'Wolę + complément : kawa devient kawę, herbata devient herbatę -- le même schéma que tu connais déjà.'
    note: 'Le même schéma de l’accusatif qu’avant, avec un nouveau verbe : *wolę kawę*, *wolę herbatę*.'
  pl.a1.unit13.lesson02.teach.wole_kawe:
    title: Je préfère le café
    gloss: Je préfère le café.
    note: Une simple affirmation de préférence avec wolę.
  pl.a1.unit13.lesson02.teach.wole_herbate:
    title: Je préfère le thé
    gloss: Je préfère le thé.
    note: Le même schéma, avec herbatę à la place de kawę.
  pl.a1.unit13.lesson02.teach.czy_or_note:
    title: Czy signifiant « ou »
    gloss: Le czy de Kawa czy herbata? n’est pas le czy qui ouvre une question oui/non -- ici, il relie deux choix, comme « ou » en français. Kawa czy herbata? = Du café ou du thé ?
    note: 'Attention : *czy* ouvre d’habitude une question oui/non, mais entre deux noms comme ici, il signifie simplement « ou ».'
  pl.a1.unit13.lesson02.teach.kawa_czy_herbata:
    title: Café ou thé ?
    gloss: Du café ou du thé ?
    note: Une façon courte et naturelle de proposer un choix.
  pl.a1.unit13.lesson03.teach.ja_tez:
    title: Moi aussi
    gloss: moi aussi
    note: Une façon courte d’être d’accord avec ce que quelqu’un vient de dire.
  pl.a1.unit13.lesson03.teach.ja_tez_note:
    title: Ja też, encore
    gloss: Ja też signifie « moi aussi » -- tu le connais déjà grâce à la leçon sur la routine (Ja też wstaję o siódmej, « Moi aussi, je me lève à sept heures »).
    note: 'Un petit rappel : cette expression est déjà apparue.'
  pl.a1.unit13.lesson03.teach.elliptical_reminder_note:
    title: Kawa czy herbata? n’a pas besoin de verbe
    gloss: Comme Pyszny? dans l’unité précédente, la question courte Kawa czy herbata? n’a pas besoin de verbe -- le contexte suffit.
    note: Le même schéma que *Pyszny?* -- une question courte sans verbe, que le contexte rend parfaitement claire.
  pl.a1.unit13.lesson03.teach.dialogue.line01:
    title: Marek demande à Ewa si elle aime la musique
    gloss: Tu aimes la musique ?
    note: Marek ouvre la conversation avec la question qu’on vient d’apprendre dans cette unité.
  pl.a1.unit13.lesson03.teach.dialogue.line02:
    title: Ewa aime ça et pose la question à son tour
    gloss: Oui, j’aime beaucoup ! Et toi ?
    note: A ty? (et toi ?) renvoie la question à Marek, comme dans les unités précédentes.
  pl.a1.unit13.lesson03.teach.dialogue.line03:
    title: Marek est d’accord et parle des boissons
    gloss: Moi aussi. Du café ou du thé ?
    note: Ja też lubię confirme la réponse d’Ewa avant que Marek change de sujet avec une nouvelle question à choix.
  pl.a1.unit13.lesson03.teach.dialogue.line04:
    title: Ewa préfère le café
    gloss: Je préfère le café.
    note: La préférence d’Ewa, exprimée avec wolę -- c’est la même buveuse de café que dans l’unité sur la routine.
  pl.a1.unit13.lesson03.teach.dialogue.line05:
    title: Marek préfère le thé
    gloss: Moi, je préfère le thé.
    note: La préférence de Marek -- le choix opposé à celui d’Ewa.
