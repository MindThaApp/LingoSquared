    title: Layla și Yusuf gătesc împreună
    gloss: Layla și Yusuf gătesc împreună în bucătăria lui Yusuf din Alexandria. Layla taie ceapa. Yusuf prăjește roșiile în tigaie. Yusuf pregătește mâncarea. Layla gustă mâncarea. Mâncarea este delicioasă!
    note: Un text scurt despre gătitul împreună. Terminația ـان din يطبخان (yaṭbukhān) arată că amândoi gătesc.
    glosses:
      يطبخان: gătesc
      معا: împreună
      مطبخ: bucătărie
      تقطع: taie
      البصلة: ceapă
      يقلي: prăjește
      الطماطم: roșie
      المقلاة: tigaie
      يقوم: execută; împreună cu cuvântul pentru „pregătire”, înseamnă „pregătește”
      الطعام: masă / mâncare
      بتجهيز: 'pregătire; completează expresia: pregătește'
      تتذوق: gustă
      لذيذ: gustos
