    title: Verbul se schimbă după persoană
    gloss: 'Verbul se schimbă după persoană: أنا أركض (anā arkuḍ), كريم يركض (karīm yarkuḍ), أنت تركض (anta tarkuḍ).'
    note: 'Prima literă a verbului arată cine face acțiunea: أ (a-) este „eu”, ي (ya-) este „el” și ت (ta-) este „tu” sau „ea”.'
  ar.a1.unit28.lesson04.teach.ywsf_ma_ajml:
    title: Reacția lui Yusuf
    gloss: 'Yusuf: Ce frumos, joc des fotbal acolo.'
  ar.a1.unit28.lesson05.teach.lyla_tmars_alywgha:
    title: Layla și Sara despre sport
    gloss: Layla face yoga de două ori pe săptămână. Îi place să se miște cu calm. Sara nu face yoga, dar îi place înotul. Sara înoată des, aproape în fiecare săptămână. Ce sport practici tu?
    note: ليلى تمارس اليوغا (laylā tumāris al-yūghā) și سارة تسبح (sāra tasbaḥ) folosesc verbe care încep cu ت (ta-), pentru că ambele sunt femei. لا înaintea unui verb îl face negativ.
    glosses:
      تمارس: face
      مرتين: de două ori
      الأسبوع: săptămână
      اليوغا: yoga
      تحب: iubește
      بهدوء: liniștit
      تتحرك: mișcare
      السباحة: înot
      تسبح: înoată
      كثيرا: des
      تقريبا: aproape
      ما: ce fel de
      الرياضة: sport
