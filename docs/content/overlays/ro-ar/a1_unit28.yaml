  ar.a1.unit28.lesson06.teach.nqtrh_shyia_maa:
    title: Propunerea unei activități împreună
    gloss: 'Ca să propui ceva împreună, folosește هل (hal) + un verb la persoana „noi”: هل نتمشى؟ (hal natamashshā?) și هل نمارس الرياضة؟ (hal numāris ar-riyāḍa?).'
    note: Reia exact construcția pentru propuneri din lecția despre planuri.
  ar.a1.unit28.lesson06.teach.sara_nam_jmyl:
    title: Sara este de acord
    gloss: 'Sara: Da, frumos! Îmi place înotul.'
  ar.a1.unit28.lesson06.teach.ywsf_afdl_lab:
