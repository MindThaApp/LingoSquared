  ar.a1.unit28.lesson01.teach.nqwl_amars_qbl:
    title: 'Verbe pentru sport: أمارس și ألعب'
    gloss: 'Spune أمارس (umāris, „practic”) înaintea majorității sporturilor: أمارس اليوغا (umāris al-yūghā), أمارس الركض (umāris ar-rakḍ), أمارس السباحة (umāris as-sibāḥa). Pentru jocurile cu mingea spune ألعب (alʿab, „joc”): ألعب كرة القدم.'
    note: أمارس (umāris) se potrivește cu majoritatea sporturilor, dar jocurile cu mingea cer ألعب (alʿab), așa că învață verbul împreună cu sportul.
  ar.a1.unit28.lesson02.teach.mrat_fy_alasbwa:
    title: Ori pe săptămână
    gloss: ori pe săptămână
    example_gloss: Fac yoga de două ori pe săptămână.
  ar.a1.unit28.lesson02.teach.mrtyn_fy_alasbwa:
    title: Ori pe săptămână
    gloss: كثيرا (kathīran) și كل يوم (kull yawm) sunt generale; مرتين في الأسبوع (marratayn fī al-usbūʿ) spune exact cât de des. مرتين este dualul lui مرة (marra, „dată”).
    note: Completează vocabularul de frecvență învățat deja în unitatea despre hobby-uri.
