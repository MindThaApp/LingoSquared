  ar.a1.unit28.lesson03.teach.amars_alryada_tany:
    title: Două moduri de a vorbi despre sport
    gloss: أمارس الرياضة (umāris ar-riyāḍa) vorbește despre sport în general, în timp ce أمارس اليوغا (umāris al-yūghā) numește sportul anume. Ambele sunt corecte.
    note: رياضة (riyāḍa) este un substantiv feminin, iar اليوغا (al-yūghā) este un nume de sport cu ال atașat.
