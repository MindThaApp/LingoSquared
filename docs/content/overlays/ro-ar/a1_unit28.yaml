    gloss: 'Karim: Iar mie îmi place alergarea.'
  ar.a1.unit28.lesson06.teach.lyla_idhn_nmars:
    title: Layla încheie conversația
    gloss: 'Layla: Atunci facem sport săptămâna aceasta toți patru împreună!'
    note: Încheie cercul preferințelor sportive ale celor patru personaje din această unitate.
