  ar.a1.unit29.lesson04.teach.rkwb_aldraja_ytghyr:
    title: Verbul se schimbă în funcție de persoană
    gloss: 'Verbul se schimbă în funcție de persoană: أركب الدراجة إلى عملي (arkab ad-darrāja ilā ʿamalī), يوسف يركب الدراجة إلى عمله (yūsuf yarkab ad-darrāja ilā ʿamalihi).'
    note: Litera inițială أ (a-) marchează „eu”, iar ي (ya-) marchează „el”. Terminația ي din عملي înseamnă „meu”, iar terminația ه din عمله înseamnă „său”.
  ar.a1.unit29.lesson04.teach.ywsf_idhn_adhhb:
    title: Yusuf răspunde
    gloss: 'Yusuf: Atunci iau trenul, împreună cu Layla.'
  ar.a1.unit29.lesson05.teach.lyla_tsafr_kl:
    title: Cine merge cum?
    gloss: Layla merge zilnic cu trenul la serviciu. Yusuf merge de obicei cu bicicleta, dar când plouă merge și el cu trenul. Karim preferă să conducă mașina. Sara locuiește aproape și merge pe jos la serviciu. Tu cum ajungi la serviciu?
    note: Verbele care se referă la femei (تسافر, تسكن, تمشي) încep cu ت (ta-), iar cele care se referă la bărbați (يركب, يذهب, يقود, يفضل) încep cu ي (ya-).
    glosses:
      تسافر: călătorește
      كل: fiecare
      يوم: zi
      بالقطار: cu trenul
      عملها: serviciu
      يركب: merge cu bicicleta
      غالبا: de obicei
      أمطرت: plouă
      يذهب: ia
      يقود: merge cu mașina
      يفضل: preferă
      السيارة: mașină
      تسكن: locuiește
      قريبا: în apropiere
      وتمشي: merge pe jos
      تذهب: călătorești
  ar.a1.unit29.lesson05.teach.sara_tskn_qryba:
    title: Sara locuiește aproape și merge pe jos la serviciu
    gloss: Sara locuiește aproape și merge pe jos la serviciu.
  ar.a1.unit29.lesson06.teach.lyla_hl_nrkb:
