teaching:
  ar.a1.unit03.lesson01.teach.waahid:
    title: Unu
    gloss: unu
    note: واحد (wāḥid) se folosește și singur, fără substantiv, pentru a răspunde la „câți?”.
    example_gloss: Am o carte.
  ar.a1.unit03.lesson01.teach.ithnaan:
    title: Doi
    gloss: doi
    note: اثنان (ithnān) este forma de citare independentă pentru „doi”.
    example_gloss: Am doi frați.
  ar.a1.unit03.lesson01.teach.thalaatha:
    title: Trei
    gloss: trei
    note: ثلاثة (thalātha) este forma de citare independentă pentru „trei”.
    example_gloss: Unu, doi, trei.
  ar.a1.unit03.lesson01.teach.arbaa:
    title: Patru
    gloss: patru
    note: أربعة (arbaʿa) este forma de citare independentă pentru „patru”.
    example_gloss: Am patru cărți.
  ar.a1.unit03.lesson01.teach.khamsa:
    title: Cinci
    gloss: cinci
    note: خمسة (khamsa) este forma de citare independentă pentru „cinci”.
    example_gloss: Am cinci cărți.
  ar.a1.unit03.lesson02.teach.sitta:
    title: Șase
    gloss: șase
    note: ستة (sitta) este forma de citare independentă pentru „șase”.
    example_gloss: Am șase cărți.
  ar.a1.unit03.lesson02.teach.sabaa:
    title: Șapte
    gloss: șapte
    note: سبعة (sabʿa) este forma de citare independentă pentru „șapte”.
    example_gloss: Am șapte cărți.
  ar.a1.unit03.lesson02.teach.thamaaniya:
    title: Opt
    gloss: opt
    note: ثمانية (thamāniya) este forma de citare independentă pentru „opt”.
    example_gloss: Am opt cărți.
  ar.a1.unit03.lesson02.teach.tisaa:
    title: Nouă
    gloss: nouă
    note: تسعة (tisʿa) este forma de citare independentă pentru „nouă”.
    example_gloss: Am nouă dirhami.
  ar.a1.unit03.lesson02.teach.ashara:
    title: Zece
    gloss: zece
    note: عشرة (ʿashara) este forma de citare independentă pentru „zece”.
    example_gloss: Am zece dinari.
  ar.a1.unit03.lesson03.teach.kam:
    title: Cât costă asta?
    gloss: Cât costă asta?
    note: كم هذا؟ (kam hādhā) este o modalitate simplă de a întreba prețul; și بكم هذا؟ (bi-kam hādhā, „cu cât este asta?”) este foarte des folosit.
  ar.a1.unit03.lesson03.teach.raqam:
    title: Număr
    gloss: număr
    note: رقم (raqam) este cuvântul general pentru „număr”, de exemplu număr de telefon.
    example_gloss: Numărul meu este unu.
  ar.a1.unit03.lesson03.teach.dialogue_line01:
    title: Întreabă prețul
    gloss: Yusuf întreabă cât costă ceva.
    note: كم هذا؟ deschide schimbul de replici.
  ar.a1.unit03.lesson03.teach.dialogue_line02:
    title: Spune prețul
    gloss: Layla spune că costă cinci.
    note: بخمسة atașează direct la număr prepoziția بـ („pe”, „cu”).
  ar.a1.unit03.lesson03.teach.dialogue_line03:
    title: Întreabă despre alt obiect
    gloss: Yusuf arată spre altceva.
    note: وهذا؟ scurtează întrebarea, reluând contextul anterior.
  ar.a1.unit03.lesson03.teach.dialogue_line04:
    title: Spune al doilea preț
    gloss: Layla spune că costă zece.
    note: بعشرة urmează același tipar ca بخمسة.
  ar.a1.unit03.lesson03.teach.dialogue_line05:
    title: Mulțumește
    gloss: Yusuf îi mulțumește.
    note: شكرا, din unitatea despre saluturi, încheie schimbul de replici.
