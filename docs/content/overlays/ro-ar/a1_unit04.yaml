  ar.a1.unit04.lesson02.teach.line01:
    title: Întrebăm data
    gloss: Layla întreabă data de azi.
    note: ما تاريخ اليوم؟ cere o dată din calendar, nu ora.
    example_gloss: 'Layla a spus: Ce dată este astăzi?'
  ar.a1.unit04.lesson02.teach.line02:
    title: Spune data
    gloss: Yusuf spune că este 5 mai.
    note: Răspunsul începe cu اليوم.
    example_gloss: 'Yusuf a spus: Astăzi este cinci mai.'
  ar.a1.unit04.lesson02.teach.line03:
    title: Menționează o lecție
