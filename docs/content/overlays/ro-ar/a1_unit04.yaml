    example_gloss: 'Layla a spus: Ce dată este azi?'
  ar.a1.unit04.lesson01.teach.fee_shahr:
    title: Din mai
    gloss: din mai
    note: 'În date se folosește من înaintea lunii: الخامس من مايو.'
