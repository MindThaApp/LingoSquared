  ar.a1.unit04.lesson01.teach.may:
    title: Mai
    gloss: mai
    note: مايو (māyū) este numele lunii mai folosit în Egipt și în mare parte din lumea arabă; în Liban, Siria, Iordania și Irak aceeași lună se numește أيار (ayyār).
    example_gloss: Azi este cinci mai.
  ar.a1.unit04.lesson01.teach.june:
    title: Iunie
    gloss: iunie
    note: يونيو (yūnyū) este numele lunii iunie folosit în Egipt și în mare parte din lumea arabă; în Liban, Siria, Iordania și Irak aceeași lună se numește حزيران (ḥazīrān).
    example_gloss: Azi este șase iunie.
  ar.a1.unit04.lesson02.teach.al_khamis:
    title: Al cincilea
    gloss: al cincilea
    note: الخامس este numeralul ordinal folosit pentru ziua 5 în această dată simplă.
    example_gloss: Azi este cinci mai.
  ar.a1.unit04.lesson02.teach.al_sadis:
    title: Al șaselea
    gloss: al șaselea
    note: السادس este numeralul ordinal folosit pentru ziua 6.
    example_gloss: Azi este șase iunie.
  ar.a1.unit04.lesson02.teach.fifth_may:
    title: 5 mai
    gloss: cinci mai
    note: 'În arabă se folosește من între zi și lună (ca în română „5 din mai” nu se spune, dar araba o cere): الخامس من مايو.'
    example_gloss: Cinci mai.
  ar.a1.unit04.lesson02.teach.sixth_june:
    title: 6 iunie
    gloss: șase iunie
    note: Aceasta este o dată clară, cu ziua și luna.
