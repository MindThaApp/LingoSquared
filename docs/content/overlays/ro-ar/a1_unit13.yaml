  ar.a1.unit13.lesson01.teach.yesterday:
    title: Ieri
    gloss: ieri
    note: أمس (ams) înseamnă „ieri”. Se folosește cu un verb la trecut, ca ذهبت, și poate sta la sfârșitul sau la începutul propoziției.
    example_gloss: Ieri am fost la piață.
  ar.a1.unit13.lesson01.teach.went:
    title: M-am dus
    gloss: m-am dus
    note: 'ذهبت (dhahabtu) înseamnă „am fost / m-am dus”: terminația de trecut -tu marchează persoana I. Fără vocale, aceleași litere pot fi citite și dhahabta / dhahabti („te-ai dus”, către un bărbat / către o femeie) sau dhahabat („s-a dus”, ea); contextul îți arată varianta corectă.'
    example_gloss: Am fost la piață.
  ar.a1.unit13.lesson01.teach.bought:
    title: Am cumpărat
    gloss: am cumpărat
    note: اشتريت (ishtaraytu) înseamnă „am cumpărat”; ca ذهبت, are terminația -tu pentru persoana I.
    example_gloss: Am cumpărat mere.
  ar.a1.unit13.lesson01.teach.apples_object:
    title: Mere
    gloss: mere
    note: تفاحا (tuffāḥan) este تفاح („mere”, din unitatea despre cumpărături) în funcția de complement direct al verbului; ا în plus notează terminația -an.
    example_gloss: Am cumpărat mere.
  ar.a1.unit13.lesson02.teach.what_did:
    title: Ce ai făcut ieri?
    gloss: Ce ați făcut ieri?
    note: 'ماذا (mādhā) înseamnă „ce”; فعلت înseamnă aici „ai făcut”: faʿalta către un bărbat, faʿalti către o femeie (scris, cuvântul este același). Yusuf o întreabă pe Layla, deci spune faʿalti.'
    example_gloss: 'Yusuf a spus: Ce ai făcut ieri?'
  ar.a1.unit13.lesson02.teach.drank:
    title: Am băut
    gloss: am băut
    note: شربت (sharibtu) înseamnă „am băut”; are aceeași terminație -tu (persoana I) ca ذهبت și اشتريت.
    example_gloss: Am băut cafea.
  ar.a1.unit13.lesson02.teach.event_sequence:
    title: Succesiunea unor evenimente recente
    gloss: Am fost la piață. Am cumpărat mere. Am băut cafea.
    note: Câteva propoziții scurte la trecut, una după alta, spun ce ai făcut. Fiecare verb are terminația -tu pentru persoana I.
    example_gloss: Ieri am fost la piață. Am cumpărat mere. Am băut cafea.
  ar.a1.unit13.lesson02.teach.line01:
    title: Întrebare despre ieri
    gloss: Yusuf o întreabă pe Layla ce a făcut ieri.
    note: Yusuf o întreabă pe Layla, o femeie, deci فعلت se citește aici faʿalti; unui bărbat i s-ar spune faʿalta.
    example_gloss: 'Yusuf a spus: Ce ai făcut ieri?'
  ar.a1.unit13.lesson02.teach.line02:
    title: La piață
    gloss: Layla spune că a fost la piață.
    note: ذهبت arată o mișcare încheiată.
    example_gloss: 'Layla a spus: Am fost la piață.'
  ar.a1.unit13.lesson02.teach.line03:
    title: Am cumpărat mere
    gloss: Layla spune că a cumpărat mere.
    note: Aceasta adaugă o a doua acțiune încheiată.
    example_gloss: 'Layla a spus: Am cumpărat mere.'
  ar.a1.unit13.lesson02.teach.line04:
    title: Am băut cafea
    gloss: Layla spune că a băut cafea.
    note: Aceasta încheie scurta relatare a evenimentelor.
    example_gloss: 'Layla a spus: Am băut cafea.'
