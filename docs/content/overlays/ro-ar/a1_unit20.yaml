teaching:
  ar.a1.unit20.lesson01.teach.weather:
    title: Vremea
    gloss: vremea
    note: الجو (al-jaww) este cuvântul obișnuit pentru „vreme”; الطقس (aṭ-ṭaqs), din titlul unității, înseamnă tot „vreme”.
    example_gloss: Cum e vremea azi?
  ar.a1.unit20.lesson01.teach.sunny:
    title: Însorit
    gloss: cu soare, însorit
    note: مشمس (mushmis) înseamnă „însorit”; este la masculin, pentru acordul cu الجو.
    example_gloss: Azi este soare.
  ar.a1.unit20.lesson01.teach.cold:
    title: Frig
    gloss: frig, rece
    note: بارد (bārid) înseamnă „rece”.
    example_gloss: Azi este frig.
  ar.a1.unit20.lesson01.teach.sunny_today:
    title: Azi e soare
    gloss: Azi este soare
    note: Araba nu are nevoie de un cuvânt separat pentru „este”.
    example_gloss: 'Yusuf a spus: Azi este soare.'
  ar.a1.unit20.lesson02.teach.hot:
    title: Cald
    gloss: cald
    note: حار (ḥārr) înseamnă „fierbinte, cald”.
    example_gloss: Este cald.
  ar.a1.unit20.lesson02.teach.weather_question:
    title: Cum e vremea?
    gloss: Cum e vremea azi?
    note: كيف (kayfa) înseamnă „cum”, ca în كيف حالك؟
    example_gloss: 'Layla a spus: Cum e vremea azi?'
  ar.a1.unit20.lesson02.teach.drink_water_plan:
    title: Hai să bem apă
    gloss: hai să bem apă
    note: هيا (hayyā) + un verb la persoana I plural înseamnă „hai să…”; نشرب (nashrab) înseamnă „bem”.
    example_gloss: Este cald. Hai să bem apă.
  ar.a1.unit20.lesson02.teach.line01:
    title: Întreabă despre vreme
    gloss: Layla întreabă cum e vremea azi.
    note: اليوم înseamnă „azi”.
    example_gloss: 'Layla a spus: Cum e vremea azi?'
  ar.a1.unit20.lesson02.teach.line02:
    title: Soare și cald
    gloss: Yusuf spune că este soare și cald.
    note: 'و (wa, „și”) leagă cele două cuvinte despre vreme și se scrie lipit de cuvântul următor: وحار.'
    example_gloss: 'Yusuf a spus: Este soare și cald.'
  ar.a1.unit20.lesson02.teach.line03:
    title: Propune cafeneaua
    gloss: Layla propune să meargă la cafenea.
    note: هل نذهب înseamnă „mergem?”, adică o propunere.
    example_gloss: 'Layla a spus: Mergem la cafenea?'
  ar.a1.unit20.lesson02.teach.line04:
    title: Planul cu apa
    gloss: Yusuf spune da și propune să bea apă.
    note: هيا نشرب înseamnă „hai să bem”.
    example_gloss: 'Yusuf a spus: Da, hai să bem apă.'
