    title: Întrebare despre stare
    gloss: Layla îl întreabă pe Yusuf cum se simte.
    note: يا (yā) stă înaintea numelui persoanei căreia i te adresezi.
    example_gloss: 'Layla a spus: Cum te simți, Yusuf?'
  ar.a1.unit22.lesson02.teach.line02:
    title: Stare și cauză
    gloss: Yusuf spune că este fericit pentru că vremea e însorită.
    note: Această replică spune și starea, și cauza.
    example_gloss: 'Yusuf a spus: Sunt fericit pentru că vremea e însorită.'
  ar.a1.unit22.lesson02.teach.line03:
    title: Altă stare
    gloss: Layla spune că este obosită pentru că are de lucru.
    note: متعبة se acordă cu Layla.
    example_gloss: 'Layla a spus: Sunt obosită pentru că am de lucru.'
  ar.a1.unit22.lesson02.teach.line04:
    title: Verificare
    gloss: Yusuf o întreabă pe Layla dacă este bine.
    note: 'هل (hal) începe o întrebare cu răspuns da/nu. Yusuf o întreabă pe Layla, deci أنت se citește anti (unui bărbat: anta).'
    example_gloss: 'Yusuf a spus: Ești bine?'
  ar.a1.unit22.lesson02.teach.line05:
    title: Răspunde afirmativ
    gloss: Layla spune da și îi mulțumește.
    note: نعم este răspunsul „da”.
    example_gloss: 'Layla a spus: Da, mulțumesc.'
