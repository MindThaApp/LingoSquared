teaching:
  ar.a1.unit11.lesson01.teach.every_day:
    title: În fiecare zi
    gloss: în fiecare zi
    note: كل يوم (kull yawm) vine adesea după verb (أدرس كل يوم), dar poate începe și propoziția (كل يوم أدرس).
    example_gloss: Învăț în fiecare zi.
  ar.a1.unit11.lesson01.teach.wake:
    title: Mă trezesc
    gloss: Mă trezesc
    note: أستيقظ (astayqiẓ) înseamnă „mă trezesc”; litera أ de la început marchează persoana I la prezent. السابعة (as-sābiʿa) este „șapte” în exprimarea orei.
    example_gloss: Mă trezesc la ora șapte.
  ar.a1.unit11.lesson01.teach.study:
    title: Învăț
    gloss: Învăț
    note: أدرس (adrus) înseamnă „învăț”; are aceeași rădăcină ca درس („lecție”). التاسعة (at-tāsiʿa) este „nouă” în exprimarea orei.
    example_gloss: Învăț la ora nouă.
  ar.a1.unit11.lesson01.teach.sleep:
    title: Dorm
    gloss: Dorm / Mă culc
    note: أنام (anām) înseamnă „dorm”; împreună cu o oră înseamnă „mă culc”. العاشرة (al-ʿāshira) este „zece” în exprimarea orei.
    example_gloss: Dorm la ora zece.
  ar.a1.unit11.lesson02.teach.what_do:
    title: Ce faci în fiecare zi?
    gloss: Ce faci în fiecare zi?
    note: ماذا (mādhā) înseamnă „ce”, iar تفعل (tafʿal) înseamnă „faci”, când vorbești cu un bărbat; unei femei i se spune تفعلين (tafʿalīn).
    example_gloss: 'Layla a spus: Ce faci în fiecare zi?'
  ar.a1.unit11.lesson02.teach.routine_sequence:
    title: Trei propoziții despre program
    gloss: Mă trezesc la șapte. Învăț la nouă. Mă culc la zece.
    note: Fiecare propoziție este format din verb + في الساعة + ora; împreună descriu o zi întreagă.
    example_gloss: În fiecare zi, mă trezesc la ora șapte. Învăț la nouă. Mă culc la zece.
  ar.a1.unit11.lesson02.teach.line01:
    title: Întreabă despre program
    gloss: Layla îl întreabă pe Yusuf ce face în fiecare zi.
    note: 'Layla spune تفعل pentru că se adresează unui bărbat; unei femei i-ar spune: ماذا تفعلين كل يوم؟'
    example_gloss: 'Layla a spus: Ce faci în fiecare zi?'
  ar.a1.unit11.lesson02.teach.line02:
    title: Ora trezirii
    gloss: Yusuf spune că se trezește la șapte.
    note: Folosește في الساعة înaintea orei.
    example_gloss: 'Yusuf a spus: Mă trezesc la ora șapte.'
  ar.a1.unit11.lesson02.teach.line03:
    title: Ora de studiu
    gloss: Yusuf spune că învață la nouă.
    note: Același tipar pentru oră funcționează și cu أدرس.
    example_gloss: 'Yusuf a spus: Învăț la ora nouă.'
  ar.a1.unit11.lesson02.teach.line04:
    title: Ora de culcare
    gloss: Yusuf spune că se culcă la zece.
    note: Ultima activitate din zi folosește același tipar pentru oră, cu أنام.
    example_gloss: 'Yusuf a spus: Dorm la ora zece.'
