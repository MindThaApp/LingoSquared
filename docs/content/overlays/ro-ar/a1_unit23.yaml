teaching:
  ar.a1.unit23.lesson01.teach.phone:
    title: Telefon
    gloss: telefon
    note: هاتف (hātif) înseamnă telefon.
    example_gloss: Acesta este un telefon.
  ar.a1.unit23.lesson01.teach.hear:
    title: Te aud
    gloss: te aud
    note: أسمعك (asmaʿuka unui bărbat, asmaʿuki unei femei) înseamnă te aud; لا أسمعك (lā asmaʿuk) înseamnă nu te aud.
    example_gloss: Nu te aud.
  ar.a1.unit23.lesson01.teach.repeat:
    title: Repetă
    gloss: repetă
    note: 'أعد (aʿid) se spune unui bărbat; unei femei i se spune: أعيدي (aʿīdī). أعد من فضلك este o cerere politicoasă de a repeta.'
    example_gloss: Nu te aud. Repetă, te rog.
  ar.a1.unit23.lesson01.teach.slowly:
    title: Vorbește rar
    gloss: vorbește rar
    note: 'تكلم ببطء (takallam bi-buṭʾ) se spune unui bărbat; unei femei i se spune: تكلمي ببطء (takallamī bi-buṭʾ).'
    example_gloss: Vorbește mai rar, te rog.
  ar.a1.unit23.lesson02.teach.message:
    title: Mesaj
    gloss: mesaj
    note: رسالة (risāla) înseamnă mesaj; poate însemna și scrisoare.
    example_gloss: Acesta este un mesaj.
  ar.a1.unit23.lesson02.teach.appointment:
    title: Întâlnire
    gloss: programarea
    note: موعد (mawʿid) înseamnă întâlnire (programare); الموعد (al-mawʿid) este întâlnirea.
    example_gloss: Întâlnirea este la ora cinci.
  ar.a1.unit23.lesson02.teach.line01:
    title: Răspuns la telefon
    gloss: Yusuf o salută pe Layla la telefon și își spune numele.
    note: La telefon, أنا يوسف (anā Yūsuf) spune cine sună.
    example_gloss: 'Yusuf a spus: Bună, sunt Yusuf.'
  ar.a1.unit23.lesson02.teach.line02:
    title: Nu se aude
    gloss: Layla spune că nu îl aude pe Yusuf.
    note: Aceasta pregătește cererea de clarificare.
    example_gloss: 'Layla a spus: Bună, Yusuf, nu te aud.'
  ar.a1.unit23.lesson02.teach.line03:
    title: Cerere de vorbire rară
    gloss: Layla îi cere lui Yusuf să vorbească mai rar.
    note: من فضلك face cererea politicoasă; Layla spune تكلم pentru că se adresează unui bărbat.
    example_gloss: 'Layla a spus: Vorbește mai rar, te rog.'
  ar.a1.unit23.lesson02.teach.line04:
    title: Detaliul important
    gloss: Yusuf spune că întâlnirea este la ora cinci.
    note: في الساعة الخامسة (fī s-sāʿa l-khāmisa) înseamnă la ora cinci.
    example_gloss: 'Yusuf a spus: Întâlnirea este la ora cinci.'
  ar.a1.unit23.lesson02.teach.line05:
    title: Cerere de repetare
    gloss: Layla îi cere lui Yusuf să repete.
    note: أعد من فضلك este cererea de repetare.
    example_gloss: 'Layla a spus: Repetă, te rog.'
  ar.a1.unit23.lesson02.teach.line06:
    title: Repetarea detaliului
    gloss: Yusuf repetă ora întâlnirii.
    note: Replica repetată confirmă ora.
    example_gloss: 'Yusuf a spus: Întâlnirea este la ora cinci.'
