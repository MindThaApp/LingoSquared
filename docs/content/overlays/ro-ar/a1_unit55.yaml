  ar.a1.unit55.lesson05.exercise01.listen_nwd_an_nshtry:
    instruction: Ascultă dialogul și alege ce spune Layla.
    correct_option: Am dori să cumpărăm două bilete.
    distractors:
    - Am dori să vedem elefantul.
    - Am dori să cumpărăm un bilet.
    - Aveți o hartă?
    accepted_answers:
    - value: Am dori să cumpărăm două bilete.
      status: correct
    feedback: 'Layla spune: صباح الخير. نود أن نشتري تذكرتين (ṣabāḥ al-khayr. nawaddu ʾan nashtariya tadhkiratayn). تذكرتين (tadhkiratayn) este la dual: „două bilete” într-un singur cuvânt.'
  ar.a1.unit55.lesson05.exercise02.comprehend_althmn_sta_ashr:
    instruction: Ascultă dialogul și alege cât costă două bilete.
    correct_option: Șaisprezece dirhami.
    distractors:
    - Opt dirhami.
    - Douăzeci de dirhami.
    - Nu scrie.
    accepted_answers:
    - value: Șaisprezece dirhami.
      status: correct
    feedback: 'Angajatul spune: بالطبع. الثمن ستة عشر درهما (bi-ṭ-ṭabʿ. ath-thaman sitta ʿashar dirhaman). De la 11 în sus substantivul stă la singular: ستة عشر درهما („șaisprezece dirhami”).'
    prompt_blocks:
    - Cât costă două bilete?
  ar.a1.unit55.lesson05.exercise03.comprehend_fy_ay_saaa:
    instruction: Ascultă dialogul și alege ce întreabă Yusuf.
    correct_option: La ce oră este hrănirea leilor?
    distractors:
    - La ce oră se închide zoo?
    - Unde este elefantul?
    - Nu întreabă nimic.
    accepted_answers:
    - value: La ce oră este hrănirea leilor?
      status: correct
    feedback: 'Yusuf întreabă: في أي ساعة موعد إطعام الأسود؟ (fī ayyi sāʿa mawʿid iṭʿām al-usūd?). موعد إطعام الأسود (mawʿid iṭʿām al-usūd) este un lanț de substantive: ora hrănirii leilor.'
    prompt_blocks:
    - Ce întreabă Yusuf?
  ar.a1.unit55.lesson05.exercise04.comprehend_fy_alsaaa_althanya:
    instruction: Ascultă dialogul și alege ora și locul hrănirii.
    correct_option: La ora două, la țarcul leilor.
    distractors:
    - La ora trei, la intrare.
    - La prânz, la cafenea.
    - Nu scrie.
    accepted_answers:
    - value: La ora două, la țarcul leilor.
      status: correct
    feedback: 'Angajatul spune: في الساعة الثانية. عند منطقة الأسود (fī s-sāʿa ath-thāniya. ʿinda minṭaqat al-usūd). عند (ʿinda) înseamnă „la” sau „lângă”.'
    prompt_blocks:
    - La ce oră este hrănirea leilor și unde?
  ar.a1.unit55.lesson05.exercise05.order_nwd_an_nshtry:
