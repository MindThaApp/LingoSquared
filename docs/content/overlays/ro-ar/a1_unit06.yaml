teaching:
  ar.a1.unit06.lesson01.teach.family:
    title: Familia
    gloss: familie
    note: عائلة (ʿāʾila) este cuvântul general pentru „familie”. În exemplu, هذه este forma feminină a lui هذا („acesta”), folosită pentru că عائلة este de genul feminin.
    example_gloss: Aceasta este o familie.
  ar.a1.unit06.lesson01.teach.father:
    title: Tatăl
    gloss: tată
    note: أب (ab) înseamnă „tată”.
    example_gloss: Am un tată.
  ar.a1.unit06.lesson01.teach.mother:
    title: Mama
    gloss: mamă
    note: أم (umm) înseamnă „mamă”.
    example_gloss: Am o mamă.
  ar.a1.unit06.lesson01.teach.brother:
    title: Fratele
    gloss: frate
    note: أخ (akh) înseamnă „frate”.
    example_gloss: Am un frate.
  ar.a1.unit06.lesson01.teach.sister:
    title: Sora
    gloss: soră
    note: أخت (ukht) înseamnă „soră”.
    example_gloss: Am un frate și o soră.
  ar.a1.unit06.lesson01.teach.i_have:
    title: Am
    gloss: am
    note: عندي (ʿindī, literal „la mine”) este modul simplu, de nivel A1, de a spune că ai ceva; لدي (ladayya) este un echivalent mai formal.
    example_gloss: Am o soră.
  ar.a1.unit06.lesson02.teach.in_family:
    title: În familia ta
    gloss: în familia ta
    note: 'Aici من este man, „cine”, nu min, „din”, ca în من أين أنت؟ — se scriu la fel. عائلتك înseamnă „familia ta”: ʿāʾilatuka pentru un bărbat, ʿāʾilatuki pentru o femeie.'
    example_gloss: Cine este în familia ta?
  ar.a1.unit06.lesson02.teach.sister_name:
    title: O cheamă Nour
    gloss: o cheamă Nour
    note: اسمها înseamnă „numele ei”.
    example_gloss: 'Yusuf a spus: O cheamă Nour.'
  ar.a1.unit06.lesson02.teach.line01:
    title: Întreabă despre familie
    gloss: Layla întreabă cine este în familia lui Yusuf.
    note: من (man) înseamnă aici „cine”. يا يوسف se adresează lui Yusuf pe nume.
    example_gloss: 'Layla a spus: Cine este în familia ta, Yusuf?'
  ar.a1.unit06.lesson02.teach.line02:
    title: Descrie familia
    gloss: Yusuf spune că are tată, mamă și soră.
    note: و leagă membrii familiei.
    example_gloss: 'Yusuf a spus: Am tată, mamă și soră.'
  ar.a1.unit06.lesson02.teach.line03:
    title: Întreabă numele surorii
    gloss: Layla îl întreabă cum o cheamă pe sora lui.
    note: 'أختك înseamnă „sora ta”: ukhtuka pentru un bărbat, ukhtuki pentru o femeie. Aici Layla îl întreabă pe Yusuf, deci ukhtuka.'
    example_gloss: 'Layla a spus: Cum o cheamă pe sora ta?'
  ar.a1.unit06.lesson02.teach.line04:
    title: Spune numele ei
    gloss: Yusuf spune că o cheamă Nour.
    note: 'Terminația ـها înseamnă „ei/al ei”: اسمها (ismuhā), „numele ei”.'
    example_gloss: 'Yusuf a spus: O cheamă Nour.'
