teaching:
  ar.a1.unit09.lesson01.teach.place:
    title: Loc
    gloss: loc
    note: مكان (makān) este cuvântul general pentru „loc”. هذا („acesta”) a fost predat împreună cu numerele.
    example_gloss: Acesta este un loc.
  ar.a1.unit09.lesson01.teach.library:
    title: Biblioteca
    gloss: bibliotecă
    note: مكتبة (maktaba) poate însemna bibliotecă sau librărie; aici este bibliotecă. المكتبة (al-maktaba) este „biblioteca”.
    example_gloss: Biblioteca este aici.
  ar.a1.unit09.lesson01.teach.market:
    title: Piață
    gloss: piață
    note: سوق (sūq) înseamnă piață; السوق (as-sūq) este „piața”.
    example_gloss: Piața este aici.
  ar.a1.unit09.lesson01.teach.cafe:
    title: Cafenea
    gloss: cafenea
    note: مقهى (maqhā) înseamnă cafenea; este înrudit cu قهوة (cafea). المقهى (al-maqhā) este „cafeneaua”.
    example_gloss: Cafeneaua este aici.
  ar.a1.unit09.lesson01.teach.here:
    title: Aici
    gloss: aici
    note: 'هنا (hunā) vine de obicei după loc: المقهى هنا, cafeneaua este aici. În această propoziție araba nu are nevoie de un cuvânt pentru „este”.'
    example_gloss: Cafeneaua este aici.
  ar.a1.unit09.lesson02.teach.where_library:
    title: Unde este biblioteca?
    gloss: Unde este biblioteca?
    note: أين (ayna) întreabă „unde”; l-ai întâlnit în من أين أنت؟ (de unde ești?).
    example_gloss: 'Yusuf a spus: Unde este biblioteca?'
  ar.a1.unit09.lesson02.teach.near:
    title: Aproape
    gloss: lângă
    note: 'قرب (qurba) înseamnă „lângă” și stă înaintea locului la care se referă: قرب المكتبة, lângă bibliotecă. بالقرب من (bi-l-qurbi min) înseamnă la fel.'
    example_gloss: Cafeneaua este lângă bibliotecă.
  ar.a1.unit09.lesson02.teach.library_near_market:
    title: Biblioteca este lângă piață
    gloss: Biblioteca este lângă piață
    note: Araba nu are nevoie aici de un cuvânt separat pentru „este”.
    example_gloss: 'Layla a spus: Biblioteca este lângă piață.'
  ar.a1.unit09.lesson02.teach.line01:
    title: Întreabă unde
    gloss: Yusuf întreabă unde este biblioteca.
    note: أين începe întrebarea despre loc.
    example_gloss: 'Yusuf a spus: Unde este biblioteca?'
  ar.a1.unit09.lesson02.teach.line02:
    title: Indică locul bibliotecii
    gloss: Layla spune că biblioteca este aici, lângă piață.
    note: 'هنا și قرب pot apărea împreună: aici, lângă piață.'
    example_gloss: 'Layla a spus: Biblioteca este aici, lângă piață.'
  ar.a1.unit09.lesson02.teach.line03:
    title: Întreabă despre cafenea
    gloss: Yusuf întreabă unde este cafeneaua.
    note: 'و (wa, „și”) se scrie legat de cuvântul următor: وأين (wa-ayna), „și unde”.'
    example_gloss: 'Yusuf a spus: Și unde este cafeneaua?'
  ar.a1.unit09.lesson02.teach.line04:
    title: Indică locul cafenelei
    gloss: Layla spune că cafeneaua este lângă bibliotecă.
    note: 'Loc + قرب + al doilea loc: المقهى قرب المكتبة, cafeneaua este lângă bibliotecă.'
    example_gloss: 'Layla a spus: Cafeneaua este lângă bibliotecă.'
