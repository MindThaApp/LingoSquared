    title: Layla îi mulțumește funcționarului
    gloss: 'Layla: Grozav! Mulțumesc, la revedere!'
  ar.a1.unit35.lesson05.teach.and_lyla_trd:
    title: Layla trimite un pachet
    gloss: Layla are un pachet pentru bunicul și bunica ei la Beirut. Ea cumpără un timbru la poștă. Scrie adresa pe pachet. Pachetul ajunge la ei mâine. Scrisoarea durează trei zile.
    note: 'Un text scurt despre pachet. Verbul se acordă cu subiectul: الطرد يصل (aṭ-ṭard yaṣil) pentru un substantiv masculin, dar ليلى تشتري (Layla tashtarī) pentru o femeie.'
    glosses:
      طرد: coletul
      لجدها: pentru bunicul ei
      وجدتها: și bunica ei
      تشتري: cumpără
      طابعا: timbrul
      البريد: poștă (corespondența)
      تكتب: scrie
      العنوان: adresa
      يصل: ajunge (verb la masculin)
      غدا: mâine
      إليهما: la ei (la cei doi); verbul împreună cu acest cuvânt înseamnă „le ajunge”
      الرسالة: scrisoarea
      تستغرق: durează (o perioadă de timp)
      ثلاثة: trei
      أيام: zile
  ar.a1.unit35.lesson05.teach.lyla_trsl_trda:
    title: Layla trimite un pachet bunicilor ei
    gloss: Layla trimite un pachet bunicului și bunicii ei.
