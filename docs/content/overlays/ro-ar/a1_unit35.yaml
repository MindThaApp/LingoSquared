    title: Verbul se acordă cu substantivul
    gloss: Pachetul (الطرد) este masculin, deci spunem يصل (yaṣil). Scrisoarea (الرسالة) este feminin, deci spunem تصل (taṣil).
    note: Un verb la prezent începe cu ي pentru un subiect masculin și cu ت pentru unul feminin, ca în الطرد يصل (aṭ-ṭard yaṣil) și الرسالة تصل (ar-risāla taṣil).
