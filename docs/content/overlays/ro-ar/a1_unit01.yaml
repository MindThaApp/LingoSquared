teaching:
  ar.a1.unit01.lesson01.teach.rtl:
    title: Araba se scrie de la dreapta la stânga
    gloss: Araba se scrie de la dreapta la stânga.
    note: Citește textul arab de la marginea din dreapta spre stânga.
  ar.a1.unit01.lesson01.teach.mim:
    title: Litera م
    gloss: m
    note: م notează sunetul m și își schimbă forma în funcție de poziția în cuvânt.
  ar.a1.unit01.lesson01.teach.ra:
    title: Litera ر
    gloss: r
    note: ر notează un r vibrat și nu se leagă de litera care urmează.
  ar.a1.unit01.lesson01.teach.ha:
    title: Litera ح
    gloss: ḥ
    note: ح este un sunet h suflat, pronunțat adânc în gât, diferit de h-ul simplu din română.
  ar.a1.unit01.lesson01.teach.ba:
    title: Litera ب
    gloss: b
    note: ب notează sunetul b și se leagă de literele din jur.
  ar.a1.unit01.lesson01.teach.alef:
    title: Litera ا
    gloss: ā / a
    note: ا notează vocala lungă ā și nu se leagă de litera următoare.
  ar.a1.unit01.lesson01.teach.marhaba_shape:
    title: Formează مرحبا
    gloss: salut
    note: مرحبا se citește marḥaban. Vocalele scurte se omit de obicei în scrierea arabă.
    example_gloss: Salut! Eu sunt Sara.
  ar.a1.unit01.lesson02.teach.marhaba:
    title: Salut
    gloss: salut
    note: مرحبا este un salut cald, potrivit în aproape orice situație.
    example_gloss: Salut, ce mai faci?
  ar.a1.unit01.lesson02.teach.sabah_alkhayr:
    title: Bună dimineața
    gloss: bună dimineața
    note: صباح الخير se citește ṣabāḥ al-khayr și înseamnă literal „dimineața binelui”.
  ar.a1.unit01.lesson02.teach.masaa_alkhayr:
    title: Bună ziua sau bună seara
    gloss: bună ziua / bună seara
    note: مساء الخير se citește masāʾ al-khayr și se folosește de la sfârșitul după-amiezii și pe parcursul serii.
  ar.a1.unit01.lesson02.teach.maa_alsalama:
    title: La revedere
    gloss: la revedere
    note: مع السلامة se citește maʿa as-salāma, literal „cu bine” (cu siguranță) – formula obișnuită de rămas-bun.
    example_gloss: Mulțumesc, la revedere!
  ar.a1.unit01.lesson02.teach.shukran:
    title: Mulțumesc
    gloss: mulțumesc
    note: شكرا se citește shukran și se potrivește în orice registru.
    example_gloss: Vă mulțumesc foarte mult.
  ar.a1.unit01.lesson02.teach.afwan:
    title: Cu plăcere
    gloss: cu plăcere
    note: عفوا (ʿafwan) este răspunsul obișnuit la شكرا; în alt context poate însemna și „scuzați-mă”.
  ar.a1.unit01.lesson03.teach.tusbih_ala_khayr:
    title: Noapte bună
    gloss: noapte bună
    note: تصبح على خير (tuṣbiḥ ʿalā khayr) se spune la despărțirea de seară sau înainte de culcare, nu ca salut de început. تصبح este forma pentru un bărbat; unei femei i se spune تصبحين على خير (tuṣbiḥīna ʿalā khayr).
  ar.a1.unit01.lesson03.teach.ahlan_wa_sahlan:
    title: Bun venit
    gloss: bun venit
    note: أهلا وسهلا (ahlan wa sahlan) se spune pentru a primi un oaspete sau a saluta călduros la sosire.
    example_gloss: Bun venit! Fii binevenit.
  ar.a1.unit01.lesson03.teach.ila_alliqaa:
    title: Pe curând
    gloss: pe curând / până ne revedem
    note: إلى اللقاء (ilā al-liqāʾ) este un rămas-bun elegant și neutru.
  ar.a1.unit01.lesson03.teach.sabah_alnoor:
    title: Bună dimineața, răspunsul
    gloss: bună dimineața [răspuns]
    note: صباح النور (ṣabāḥ an-nūr, „dimineața luminii”) este răspunsul obișnuit la صباح الخير.
  ar.a1.unit01.lesson03.teach.masaa_alnoor:
    title: Bună seara, răspunsul
    gloss: bună seara [răspuns]
    note: مساء النور (masāʾ an-nūr) este răspunsul obișnuit la مساء الخير.
  ar.a1.unit01.lesson03.teach.yawman_saeedan:
    title: O zi bună
    gloss: o zi bună
    note: يوما سعيدا (yawman saʿīdan) este o urare caldă de încheiere.
  ar.a1.unit01.lesson04.teach.kayfa_haluk:
    title: Ce mai faci?
    gloss: Ce mai faceți?
    note: كيف حالك؟ (kayfa ḥāluk) este formula obișnuită pentru a întreba ce mai face cineva; fără vocalizare, forma scrisă se potrivește oricărui interlocutor.
  ar.a1.unit01.lesson04.teach.gender_note:
    title: Tu la masculin și la feminin
    gloss: tu (m.) / tu (f.)
    note: În limba vorbită, araba deosebește أنتَ (anta, către un bărbat) de أنتِ (anti, către o femeie) – la fel și حالَك de حالِك. Fără semnele diacritice afișate aici, formele scrise folosite în acest curs sunt identice pentru ambele.
  ar.a1.unit01.lesson04.teach.bikhayr:
    title: Bine
    gloss: bine
    note: بخير (bikhayr) este răspunsul pozitiv obișnuit la كيف حالك؟
    example_gloss: Azi sunt bine.
  ar.a1.unit01.lesson04.teach.alhamdulillah:
    title: Slavă Domnului
    gloss: slavă lui Dumnezeu / mulțumesc lui Dumnezeu
    note: الحمد لله (al-ḥamdu lillāh) urmează foarte des după بخير într-un răspuns, indiferent de practica religioasă a vorbitorului – funcționează ca o formulă obișnuită de încheiere, asemănătoare cu „slavă Domnului” sau „mulțumesc lui Dumnezeu” din română.
    example_gloss: Bine, slavă Domnului.
  ar.a1.unit01.lesson04.teach.wa_anta:
    title: Și tu?
    gloss: Dar dumneavoastră?
    note: وأنت؟ (wa anta către un bărbat, wa anti către o femeie) întoarce întrebarea; scrierea fără vocalizare este aceeași pentru ambele.
  ar.a1.unit01.lesson04.teach.mumtaz:
    title: Excelent
    gloss: excelent / grozav
    note: ممتاز (mumtāz) este o variantă entuziastă față de بخير.
    example_gloss: Azi mă simt grozav!
  ar.a1.unit01.lesson04.teach.la_bas:
    title: Nu-i rău
    gloss: nu-i rău
    note: لا بأس (lā baʾs) este un răspuns moderat firesc, nu o plângere.
