teaching:
  ar.a1.unit19.lesson01.teach.house:
    title: Casă
    gloss: casă
    note: بيت (bayt) înseamnă casă; terminația ـي înseamnă „meu/mea”, deci بيتي (baytī) este casa mea.
    example_gloss: Casa mea este lângă bibliotecă.
  ar.a1.unit19.lesson01.teach.room:
    title: Cameră
    gloss: cameră
    note: غرفة (ghurfa) este de genul feminin (se termină în ة), deci urmează واحدة, forma de feminin.
    example_gloss: În casa mea este o cameră.
  ar.a1.unit19.lesson01.teach.kitchen:
    title: Bucătărie
    gloss: bucătărie
    note: 'مطبخ (maṭbakh) înseamnă bucătărie. În arabă nu există un cuvânt pentru „există” aici: începutul cu في بيتي (în casa mea) are acest rol.'
    example_gloss: În casa mea este o bucătărie.
  ar.a1.unit19.lesson01.teach.one_room:
    title: O cameră
    gloss: o cameră
    note: 'Numeralul „unu” vine după substantiv și se acordă cu el: غرفة واحدة (ghurfa wāḥida); cu un substantiv masculin se spune واحد.'
    example_gloss: În casa mea este o cameră.
  ar.a1.unit19.lesson02.teach.table:
    title: Masă
    gloss: masă
    note: طاولة (ṭāwila) înseamnă masă; ca غرفة, se termină în ة și este de genul feminin.
    example_gloss: Am o masă în cameră.
  ar.a1.unit19.lesson02.teach.in_room:
    title: În cameră
    gloss: în cameră
    note: الغرفة (al-ghurfa) înseamnă camera.
    example_gloss: Masa este în cameră.
  ar.a1.unit19.lesson02.teach.near_library:
    title: Lângă bibliotecă
    gloss: lângă bibliotecă
    note: قرب (qurb) înseamnă lângă; المكتبة este biblioteca, din unitatea despre locuri.
    example_gloss: Casa mea este lângă bibliotecă.
  ar.a1.unit19.lesson02.teach.line01:
    title: Întreabă unde
    gloss: Layla îl întreabă unde este casa lui Yusuf.
    note: أين întreabă „unde”; بيتك (baytuka) înseamnă „casa ta”, spus unui bărbat; unei femei i se spune baytuki, scris la fel.
    example_gloss: 'Layla a spus: Unde este casa ta, Yusuf?'
  ar.a1.unit19.lesson02.teach.line02:
    title: Locul casei
    gloss: Yusuf spune că locuiește lângă bibliotecă.
    note: بيتي înseamnă „casa mea”.
    example_gloss: 'Yusuf a spus: Casa mea este lângă bibliotecă.'
  ar.a1.unit19.lesson02.teach.line03:
    title: Camerele
    gloss: Yusuf spune că în casa lui este o cameră și o bucătărie.
    note: 'و (wa, „și”) leagă cele două elemente ale casei și se scrie lipit de cuvântul următor: ومطبخ.'
    example_gloss: 'Yusuf a spus: În casa mea este o cameră și o bucătărie.'
  ar.a1.unit19.lesson02.teach.line04:
    title: Întreabă despre un obiect
    gloss: Layla îl întreabă pe Yusuf dacă are o masă.
    note: هل începe o întrebare cu răspuns da sau nu; عندك (ʿindaka) înseamnă „ai”, spus unui bărbat; unei femei i se spune ʿindaki, scris la fel.
    example_gloss: 'Layla a spus: Ai o masă?'
  ar.a1.unit19.lesson02.teach.line05:
    title: Locul obiectului
    gloss: Yusuf spune că are o masă în cameră.
    note: عندي exprimă posesia.
    example_gloss: 'Yusuf a spus: Da, am o masă în cameră.'
