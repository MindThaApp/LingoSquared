teaching:
  ar.a1.unit02.lesson01.teach.ma_ismuka:
    title: Cum te cheamă?
    gloss: Cum vă numiți?
    note: ما اسمك؟ (mā ismuk) este modul uzual de a întreba un nume; scrisă fără vocale, forma este potrivită pentru orice interlocutor.
  ar.a1.unit02.lesson01.teach.ismee:
    title: Mă numesc
    gloss: numele meu [este]
    note: اسمي (ismī) îmbină اسم („nume”) cu terminația posesivă ـي („meu”).
    example_gloss: Mă numesc Karim.
  ar.a1.unit02.lesson01.teach.ana:
    title: eu
    gloss: eu
    note: أنا (anā) este pronumele independent pentru „eu”; verbele arabe marchează persoana și singure, dar أنا se folosește pentru accent și în propoziții nominale simple ca aceasta.
    example_gloss: Eu sunt Sara.
  ar.a1.unit02.lesson01.teach.tasharrafna:
    title: Încântat de cunoștință
    gloss: îmi pare bine
    note: تشرفنا (tasharrafnā), literal „ne simțim onorați”, este răspunsul reciproc uzual la o primă întâlnire; oricare dintre cei doi îl poate spune primul.
  ar.a1.unit02.lesson02.teach.min_ayna:
    title: De unde ești?
    gloss: De unde sunteți?
    note: من أين أنت؟ (min ayna anta pentru un bărbat, min ayna anti pentru o femeie) întreabă de unde este cineva; scrisă fără vocale, forma este aceeași pentru amândoi.
  ar.a1.unit02.lesson02.teach.ana_min:
    title: Sunt din
    gloss: sunt din
    note: أنا من (anā min) este urmat direct de numele unei țări sau al unui oraș.
  ar.a1.unit02.lesson02.teach.lubnan:
    title: Liban
    gloss: Liban
    note: لبنان (lubnān) nu primește articol hotărât, spre deosebire de majoritatea celorlalte țări din această lecție.
    example_gloss: Sunt din Liban.
  ar.a1.unit02.lesson02.teach.misr:
    title: Egipt
    gloss: Egipt
    note: مصر (miṣr) nu primește nici ea articol hotărât.
    example_gloss: Sunt din Egipt.
  ar.a1.unit02.lesson02.teach.urdun:
    title: Iordania
    gloss: Iordania
    note: الأردن (al-ʾurdun) poartă mereu articolul hotărât الـ ca parte a numelui, ca المغرب și العراق din această lecție.
    example_gloss: Sunt din Iordania.
  ar.a1.unit02.lesson02.teach.maghrib:
    title: Maroc
    gloss: Maroc
    note: المغرب (al-maghrib) înseamnă literal „apusul”, de la aceeași rădăcină ca rugăciunea de la apus.
    example_gloss: Sunt din Maroc.
  ar.a1.unit02.lesson02.teach.soorya:
    title: Siria
    gloss: Siria
    note: سوريا (sūryā) nu primește articol hotărât.
    example_gloss: Sunt din Siria.
  ar.a1.unit02.lesson02.teach.iraq:
    title: Irak
    gloss: Irak
    note: العراق (al-ʿirāq) primește articolul hotărât.
    example_gloss: Sunt din Irak.
  ar.a1.unit02.lesson03.teach.hal_anta_min:
    title: Ești din...?
    gloss: Ești din Egipt?
    note: هل (hal) este o particulă pentru întrebările cu răspuns da/nu, plasată la începutul propoziției; nu are sens propriu.
  ar.a1.unit02.lesson03.teach.naam:
    title: Da
    gloss: da
    note: نعم (naʿam) este răspunsul afirmativ obișnuit.
    example_gloss: Da, sunt din Egipt.
  ar.a1.unit02.lesson03.teach.laa:
    title: Nu
    gloss: nu
    note: لا (lā) este răspunsul negativ obișnuit.
    example_gloss: Nu, sunt din Liban.
  ar.a1.unit02.lesson03.teach.saidtu_biliqaaik:
    title: Mi-a părut bine să te cunosc
    gloss: Mi-a părut bine să te cunosc
    note: سعدت بلقائك (saʿidtu bi-liqāʾik) este o formulă de încheiere mai caldă decât تشرفنا, folosită adesea chiar înainte de despărțire.
  ar.a1.unit02.lesson03.teach.marhaban_bik:
    title: Bine ai venit
    gloss: bine ai venit / ești binevenit aici
    note: 'مرحبا بك (marḥaban bik) adaugă بك, „ție”: prepoziția بـ cu sufixul pronominal ـك (tu) atașat, același بك ca în أهلا بك.'
  ar.a1.unit02.lesson04.teach.line01:
    title: Salutul de început
    gloss: Yusuf o salută pe Layla.
    note: Schimbul începe cu un simplu مرحبا, înainte de a-și spune numele.
  ar.a1.unit02.lesson04.teach.line02:
    title: Salutul de început, răspunsul
    gloss: Layla îl salută la rândul ei.
    note: Același cuvânt, مرحبا, folosit de ambele părți ale unui salut.
  ar.a1.unit02.lesson04.teach.line03:
    title: Întrebarea despre nume
    gloss: Yusuf o întreabă cum o cheamă.
    note: ما اسمك؟ deschide prezentarea.
  ar.a1.unit02.lesson04.teach.line04:
    title: Întrebarea despre nume, răspunsul
    gloss: Layla răspunde și îl întreabă și ea.
    note: وأنت؟ reia întrebarea fără a repeta toată fraza, o scurtătură frecventă.
  ar.a1.unit02.lesson04.teach.line05:
    title: Răspuns și plăcere reciprocă
    gloss: Yusuf își spune numele și zice că îi pare bine să o cunoască.
    note: تشرفنا încheie schimbul de nume.
  ar.a1.unit02.lesson04.teach.line06:
    title: Plăcere reciprocă, răspunsul
    gloss: Layla răspunde cu aceeași formulă.
    note: تشرفنا se spune în mod firesc de către ambele persoane, nu doar de una.
  ar.a1.unit02.lesson04.teach.line07:
    title: Întrebarea despre proveniență
    gloss: Yusuf o întreabă de unde este.
    note: من أين أنت؟ mută conversația spre locul de origine.
  ar.a1.unit02.lesson04.teach.line08:
    title: Întrebarea despre proveniență, răspunsul
    gloss: Layla răspunde și îl întreabă și ea.
    note: Ea folosește din nou وأنت؟, aceeași scurtătură ca în line04.
  ar.a1.unit02.lesson04.teach.line09:
    title: Spune de unde este
    gloss: Yusuf spune că este din Liban.
    note: أنا من لبنان urmează același tipar învățat în lesson02.
  ar.a1.unit02.lesson04.teach.line10:
    title: Încheierea conversației
    gloss: Layla spune că i-a părut bine să-l cunoască.
    note: سعدت بلقائك arată că discuția se apropie firesc de final.
  ar.a1.unit02.lesson04.teach.line11:
    title: Rămas-bun
    gloss: Yusuf o invită oricând înapoi și își ia rămas-bun.
    note: دائما („mereu/oricând”) transformă مرحبا بك într-o invitație deschisă, înainte de formula de rămas-bun مع السلامة.
  ar.a1.unit02.lesson04.teach.line12:
    title: Rămas-bun, răspunsul
    gloss: Layla își ia rămas-bun.
    note: مع السلامة încheie schimbul; a fost învățată în a1_unit01.
