course:
  title: Araba A1
  description: 'Arabă pentru începători, pentru a vorbi despre animalele de companie și despre animalele obișnuite: cum se numesc, îngrijirea de bază (plimbare, hrănire, joacă), cum spui ce animale iubești chiar dacă nu ai niciunul și pluralele uzuale.'
