teaching:
  ar.a1.unit27.lesson01.teach.alhywan_hywan_alyf:
    title: Animal, un animal de companie
    gloss: animalul / un animal de companie
    note: حيوان (ḥayawān) înseamnă animal, iar حيوان أليف (ḥayawān alīf) înseamnă animal de companie. أليف (alīf) este un adjectiv care înseamnă domesticit, blând, deci vine după substantiv.
    example_gloss:
    - Câinele este un animal.
    - Câinele este și un animal de companie.
  ar.a1.unit27.lesson01.teach.alklb_alqta:
    title: Câinele și pisica
    gloss: câinele / pisica
    example_gloss:
    - Layla are un câine.
    - Karim are o pisică.
  ar.a1.unit27.lesson01.teach.alsmka_altair:
    title: Peștele și pasărea
    gloss: peștele / pasărea
    example_gloss:
    - Bunicul are un pește.
    - Nour are o pasăre.
  ar.a1.unit27.lesson01.teach.hl_ldyk_hywan:
    title: Ai un animal de companie?
    gloss: Ai un animal de companie?
    note: 'هل لديك (hal ladayka) înseamnă „ai?”. Pentru o femeie se scrie la fel, dar ultima vocală este i: ladayki. هل (hal) deschide o întrebare cu da/nu.'
  ar.a1.unit27.lesson01.teach.nam_ldy_klb:
    title: Da, am un câine
    gloss: Da, am un câine.
    note: Un răspuns afirmativ simplu, cu vocabularul nou al acestei unități.
  ar.a1.unit27.lesson01.teach.la_lys_ldy:
    title: Nu, nu am niciun animal de companie
    gloss: Nu, nu am niciun animal de companie.
    note: 'ليس لدي (laysa ladayya) înseamnă „nu am”: ليس (laysa) neagă, iar لدي (ladayya) înseamnă „am”.'
  ar.a1.unit27.lesson01.teach.nnfy_almlkya_babara:
    title: 'A nu avea: ليس لدي'
    gloss: 'Ca să spui că nu ai ceva, folosește ليس لدي (laysa ladayya): ليس لدي وقت (nu am timp), ليس لدي حيوان أليف (nu am un animal de companie).'
    note: ليس لدي se folosește cu orice substantiv și nu se schimbă după gen. Pentru „el” și „ea” se spune ليس لديه (laysa ladayhi) și ليس لديها (laysa ladayhā).
  ar.a1.unit27.lesson02.teach.akhdh_alhywan_fy:
    title: A scoate la plimbare (un animal)
    gloss: a scoate la plimbare (un animal)
    note: أخذ الحيوان في نزهة (akhdh al-ḥayawān fī nuzha) înseamnă literal „a lua animalul la plimbare”. Verbul este أخذ, „a lua”.
    example_gloss: Scot câinele la plimbare în fiecare zi.
  ar.a1.unit27.lesson02.teach.ytghyr_alfal_ma:
    title: Verbul se schimbă după persoană
    gloss: 'Verbul se schimbă după persoană: آخذ الكلب في نزهة (ākhudh al-kalb fī nuzha), „scot câinele la plimbare”; كريم يأخذ كلبه في نزهة (karīm yākhudh kalbahu fī nuzha), „Karim își scoate câinele la plimbare”.'
    note: Litera de la început أ (a-) marchează „eu”, iar ي (ya-) marchează „el”. نزهة (nuzha) este o plimbare sau o scurtă ieșire.
  ar.a1.unit27.lesson02.teach.itaam_alhywan:
    title: A da de mâncare
    gloss: a da de mâncare
    example_gloss: Dau de mâncare pisicii în fiecare zi.
  ar.a1.unit27.lesson02.teach.allab_ma_alhywan:
    title: A se juca cu
    gloss: a se juca cu
    example_gloss: Karim se joacă cu pisica lui.
  ar.a1.unit27.lesson02.teach.akhdh_alklb_fy:
    title: Scot câinele la plimbare în fiecare zi
    gloss: Scot câinele la plimbare în fiecare zi.
    note: 'كل يوم (kull yawm) înseamnă „în fiecare zi”: كل + substantiv la singular, fără ال.'
  ar.a1.unit27.lesson02.teach.atam_alqta_kl:
    title: Dau de mâncare pisicii în fiecare zi
    gloss: Dau de mâncare pisicii în fiecare zi.
    note: أطعم (uṭʿim) înseamnă „hrănesc”. القطة (al-qiṭṭa) este de genul feminin, iar ال este atașat la substantiv.
  ar.a1.unit27.lesson03.teach.jma_klb_hw:
    title: 'Plurale: كلب → كلاب'
    gloss: 'Multe plurale sunt neregulate, așa că învață-le împreună cu substantivul: كلب (kalb) devine كلاب (kilāb), قطة (qiṭṭa) devine قطط (qiṭaṭ), iar طائر (ṭāʾir) devine طيور (ṭuyūr).'
    note: Pluralele arabe sunt în mare parte plurale fracte, deci fiecare plural se învață împreună cu substantivul său; pluralul animalelor primește un adjectiv la feminin singular.
  ar.a1.unit27.lesson03.teach.klab_qtt:
    title: Câini și pisici
    gloss: câini / pisici
    example_gloss:
    - Yusuf iubește câinii.
    - Sara iubește pisicile.
  ar.a1.unit27.lesson03.teach.asmak_tywr:
    title: Pești și păsări (plural)
    gloss: pești / păsări
    example_gloss:
    - Iubesc peștii.
    - Bunicul iubește păsările.
  ar.a1.unit27.lesson03.teach.ahb_alhywanat:
    title: Iubesc animalele
    gloss: Iubesc animalele.
    note: أحب الحيوانات (uḥibb al-ḥayawānāt) înseamnă „iubesc animalele”. Pluralul se termină în ات și primește articolul ال atașat.
  ar.a1.unit27.lesson03.teach.sara_thb_alqtt:
    title: Sara iubește pisicile, dar nu are un animal de companie
    gloss: Sara iubește pisicile, dar nu are un animal de companie.
    note: Pregătește contrastul pe care se construiește textul de citit al lecției.
  ar.a1.unit27.lesson04.teach.ywsf_hl_ldyk:
    title: Yusuf întreabă despre un animal de companie
    gloss: 'Yusuf: Ai un animal de companie, Layla?'
  ar.a1.unit27.lesson04.teach.lyla_nam_ldy:
    title: Layla are un câine
    gloss: 'Layla: Da, am un câine.'
  ar.a1.unit27.lesson04.teach.ywsf_kyf_ybdw:
    title: Yusuf întreabă cum arată
    gloss: 'Yusuf: Cum arată?'
    note: كيف يبدو؟ (kayfa yabdū?) înseamnă „cum arată (el)?”. يبدو (yabdū) este la masculin pentru că كلب, „câine”, este un substantiv masculin.
  ar.a1.unit27.lesson04.teach.lyla_lh_shar:
    title: Layla își descrie câinele
    gloss: 'Layla: Are blana maro și este mic.'
    note: Reia vocabularul culorilor și al mărimii din unitatea despre aspect, acum pentru blana unui animal, nu pentru părul unei persoane.
  ar.a1.unit27.lesson04.teach.nqwl_hw_llklb:
    title: Pronumele pentru animale
    gloss: 'Fiecare cuvânt pentru animal este masculin sau feminin: câinele este هو (huwa, el), iar pisica este هي (hiya, ea). Terminația ه din أطعمه (uṭʿimuhu) înseamnă „pe el” sau „îl”.'
    note: Un cuvânt masculin pentru animal, ca كلب, primește pronume și adjective la masculin; unul feminin, ca قطة, le primește la feminin.
  ar.a1.unit27.lesson04.teach.ywsf_hl_takhdhynh:
    title: Yusuf întreabă despre plimbări
    gloss: 'Yusuf: Îl scoți la plimbare în fiecare zi?'
  ar.a1.unit27.lesson04.teach.lyla_nam_akhdhh:
    title: Layla își descrie rutina
    gloss: 'Layla: Da, îl scot la plimbare în fiecare zi și îl hrănesc.'
  ar.a1.unit27.lesson05.teach.ywsf_wsara_yhban:
    title: Yusuf, Sara și Karim despre animale
    gloss: 'Yusuf și Sara iubesc amândoi animalele, dar niciunul dintre ei nu are un animal de companie. Yusuf iubește câinii, iar Sara iubește pisicile. Karim, în schimb, are un animal de companie: o pisică. Se joacă mult cu pisica lui și o hrănește în fiecare zi. Tu ai un animal de companie?'
    note: Contrastează a iubi un animal cu a avea cu adevărat unul -- chiar scopul comunicativ al unității.
    glosses:
      يحبان: iubesc
      كلاهما: amândoi
      الحيوانات: animale
      منهما: dintre ei (niciunul dintre ei)
      أليف: animal de companie (lit. domesticit)
      الكلاب: câini
      القطط: pisici
      قطة: pisică
      يلعب: se joacă
      ويعطي: dă
      كل: fiecare
      طعاما: mâncare
  ar.a1.unit27.lesson05.teach.krym_ylab_ma:
    title: Karim se joacă mult cu pisica lui
    gloss: Karim se joacă mult cu pisica lui.
    note: 'قطته (qiṭṭatuhu) înseamnă „pisica lui”: terminația ه (hu) înseamnă „lui”, iar ة din قطة devine ت înaintea ei.'
  ar.a1.unit27.lesson05.teach.ahb_alklab_lys:
    title: Iubesc câinii. Nu am animal de companie.
    gloss: Iubesc câinii. Nu am animal de companie.
    note: Un răspuns model din două propoziții, bun de reutilizat la sarcina de scriere a unității.
  ar.a1.unit27.lesson06.teach.lyla_ya_nwr:
    title: Layla o întreabă pe Nour
    gloss: 'Layla: Nour, ai și tu un animal de companie?'
  ar.a1.unit27.lesson06.teach.nwr_nam_ldy:
    title: Nour are o pasăre pe nume Pico
    gloss: 'Nour: Da, am o pasăre. O cheamă Pico.'
    note: اسمه (ismuhu) înseamnă „numele lui”; ه de la final înseamnă „lui”. بيكو (bīkū) este numele păsării.
  ar.a1.unit27.lesson06.teach.ywsf_ma_ajml:
    title: Reacția lui Yusuf
    gloss: 'Yusuf: Ce frumos! Ce faci cu el în fiecare zi?'
  ar.a1.unit27.lesson06.teach.nwr_atamh_kl:
    title: Nour îl hrănește în fiecare zi
    gloss: 'Nour: Îl hrănesc în fiecare zi.'
  ar.a1.unit27.lesson06.teach.ywsf_wana_ayda:
    title: Și Yusuf iubește păsările
    gloss: 'Yusuf: Și eu iubesc păsările.'
  ar.a1.unit27.lesson06.teach.lyla_ma_ajml:
    title: Layla încheie conversația
    gloss: 'Layla: Ce frumos că noi trei iubim animalele!'
    note: Închide cercul faptelor despre animale ale celor trei personaje din această unitate.
