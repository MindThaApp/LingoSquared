teaching:
  ar.a1.unit14.lesson01.teach.like:
    title: Îmi place
    gloss: îmi place
    note: أحب (uḥibbu) înseamnă îmi place. Araba folosește ال (articolul hotărât) pentru lucrurile în general, deci „îmi place cafeaua” se spune أحب القهوة, cu ال, ca și în română.
    example_gloss: Îmi place cafeaua.
  ar.a1.unit14.lesson01.teach.tea:
    title: Ceai
    gloss: ceai
    note: شاي (shāy) înseamnă ceai; الشاي (ash-shāy) adaugă ال, ca atunci când vorbești despre ceai în general.
    example_gloss: Nu-mi place ceaiul.
  ar.a1.unit14.lesson01.teach.dislike:
    title: Nu-mi place
    gloss: nu-mi place
    note: În arabă nu se folosește un verb auxiliar pentru negație; se pune لا înaintea lui أحب.
    example_gloss: Nu-mi place ceaiul.
  ar.a1.unit14.lesson01.teach.water:
    title: Apa
    gloss: apă
    note: الماء (al-māʾ) este ماء (apă, din unitatea despre mâncare) cu ال, folosit pentru apa în general.
    example_gloss: Îmi place apa.
  ar.a1.unit14.lesson01.teach.and_not:
    title: Și nu
    gloss: și nu
    note: 'ولا (wa-lā) este و (și) legat de لا (nu): adaugă o neplăcere după o plăcere.'
    example_gloss: Îmi place cafeaua și nu-mi place ceaiul.
  ar.a1.unit14.lesson02.teach.prefer:
    title: Prefer
    gloss: prefer
    note: 'أفضل (ufaḍḍilu) înseamnă prefer: alegi o variantă în locul alteia.'
    example_gloss: Prefer cafeaua.
  ar.a1.unit14.lesson02.teach.what_prefer:
    title: Ce preferi?
    gloss: Ce preferi?
    note: تفضل de aici este tufaḍḍil, „preferi”, spus unui bărbat; unei femei i se spune تفضلين (tufaḍḍilīn). Este un cuvânt diferit de تفضل (tafaḍḍal, poftim) din unitatea despre mâncare, deși se scrie la fel.
    example_gloss: 'Nour a spus: Ce preferi, Yusuf?'
  ar.a1.unit14.lesson02.teach.line01:
    title: Nour întreabă
    gloss: Nour îl întreabă pe Yusuf ce preferă.
    note: 'نور (Nour) este sora lui Yusuf. Ea spune تفضل pentru că se adresează unui bărbat; unei femei i se spune: ماذا تفضلين؟'
    example_gloss: 'Nour a spus: Ce preferi, Yusuf?'
  ar.a1.unit14.lesson02.teach.line02:
    title: Yusuf preferă cafeaua
    gloss: Yusuf spune că preferă cafeaua.
    note: أفضل alege o variantă în locul celorlalte; أحب spune pur și simplu că îți place ceva.
    example_gloss: 'Yusuf a spus: Prefer cafeaua.'
  ar.a1.unit14.lesson02.teach.line03:
    title: Lui Yusuf nu-i place ceaiul
    gloss: Yusuf spune că nu-i place ceaiul.
    note: لا أحب exprimă simplu o neplăcere.
    example_gloss: 'Yusuf a spus: Nu-mi place ceaiul.'
  ar.a1.unit14.lesson02.teach.line04:
    title: Nourei îi place apa
    gloss: Nour spune că îi place apa.
    note: أنا poate fi adăugat pentru accent.
    example_gloss: 'Nour a spus: Îmi place apa.'
