  ar.a1.unit15.lesson02.teach.cheaper:
    title: Mai ieftin
    gloss: mai ieftin
    note: 'أرخص (arkhaṣ) compară prețul: „mai ieftin”.'
    example_gloss: Apa este mai ieftină decât cafeaua.
  ar.a1.unit15.lesson02.teach.nearer_sentence:
    title: Cafeneaua este mai aproape
    gloss: Cafeneaua este mai aproape decât piața
    note: Păstrează من înaintea celui de-al doilea element.
    example_gloss: 'Yusuf a spus: Cafeneaua este mai aproape decât piața.'
  ar.a1.unit15.lesson02.teach.line01:
    title: Întreabă despre o preferință
    gloss: Layla îl întreabă pe Yusuf ce preferă.
    note: 'Layla spune تفضل (tufaḍḍil) pentru că se adresează unui bărbat; unei femei i s-ar spune: ماذا تفضلين؟'
    example_gloss: 'Layla a spus: Ce preferi?'
  ar.a1.unit15.lesson02.teach.line02:
    title: Prefer cafeneaua
    gloss: Yusuf spune că preferă cafeneaua.
    note: După أفضل poate urma un loc, ca opțiune preferată.
    example_gloss: 'Yusuf a spus: Prefer cafeneaua.'
  ar.a1.unit15.lesson02.teach.line03:
    title: Compararea distanței
    gloss: Yusuf spune că cafeneaua este mai aproape decât piața.
    note: أقرب من dă motivul.
    example_gloss: 'Yusuf a spus: Cafeneaua este mai aproape decât piața.'
  ar.a1.unit15.lesson02.teach.line04:
    title: Compararea mărimii
    gloss: Nour adaugă că piața este mai mare decât cafeneaua.
    note: 'والسوق (was-sūq) este و („și”) lipit de السوق: „și piața”.'
    example_gloss: 'Nour a spus: Și piața este mai mare decât cafeneaua.'
