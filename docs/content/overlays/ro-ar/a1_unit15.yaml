teaching:
  ar.a1.unit15.lesson01.teach.than:
    title: Decât
    gloss: decât
    note: من (min) este același cuvânt ca „din” (أنا من لبنان); după un comparativ înseamnă „decât”.
    example_gloss: Piața este mai mare decât cafeneaua.
  ar.a1.unit15.lesson01.teach.bigger:
    title: Mai mare
    gloss: mai mare
    note: أكبر (akbar) vine de la كبير (kabīr, „mare”). Comparativele ca أكبر, أصغر, أقرب și أرخص încep toate cu أ și au aceeași formă pentru substantivele masculine și feminine.
    example_gloss: Piața este mai mare decât cafeneaua.
  ar.a1.unit15.lesson01.teach.smaller:
    title: Mai mic
    gloss: mai mic
    note: أصغر (aṣghar), „mai mic”, are același tipar cu أ ca أكبر.
    example_gloss: Cafeneaua este mai mică decât piața.
  ar.a1.unit15.lesson01.teach.nearer:
    title: Mai aproape
    gloss: mai aproape
    note: 'أقرب (aqrab) compară distanța: „mai aproape”.'
    example_gloss: Cafeneaua este mai aproape decât piața.
  ar.a1.unit15.lesson01.teach.bigger_sentence:
    title: Piața este mai mare
    gloss: Piața este mai mare decât cafeneaua
    note: În această comparație araba nu are nevoie de un cuvânt separat pentru „este”.
    example_gloss: 'Yusuf a spus: Piața este mai mare decât cafeneaua.'
  ar.a1.unit15.lesson02.teach.nearer:
    title: Mai aproape
    gloss: mai aproape
    note: 'أقرب (aqrab) compară distanța: „mai aproape”.'
