  ar.a1.unit26.lesson06.ywsf_ytarf_ala_nwr:
    title: Yusuf o recunoaște pe Nour
teaching:
  ar.a1.unit26.lesson01.teach.twyl_qsyr:
    title: Înalt și scund
    gloss: înalt / scund
    note: 'طويل (ṭawīl) înseamnă înalt, iar قصير (qaṣīr) scund. Pentru o femeie primesc ة: طويلة (ṭawīla), قصيرة (qaṣīra).'
    example_gloss:
    - Sara este înaltă.
    - Karim este scund.
  ar.a1.unit26.lesson01.teach.kbyr_fy_alsn:
    title: Bătrân și tânăr
    gloss: bătrân / tânăr
    note: كبير في السن (kabīr fī as-sinn) și صغير في السن (ṣaghīr fī as-sinn) descriu o impresie generală despre vârstă, nu un număr exact de ani.
    example_gloss:
    - Bunicul este bătrân.
    - Yusuf este tânăr.
  ar.a1.unit26.lesson01.teach.km_amrk_sual:
    title: 'Vârsta: un număr sau o impresie'
    gloss: كم عمرك؟ (kam ʿumruka?) cere un număr de ani, în timp ce كبير في السن (kabīr fī as-sinn) dă o impresie generală, fără număr, ca în الجد كبير في السن (al-jadd kabīr fī as-sinn).
    note: Folosește كم عمرك؟ ca să afli exact câți ani are cineva. Aici, كبير في السن descrie doar cât de în vârstă pare cineva.
  ar.a1.unit26.lesson01.teach.sara_twyla_wkrym:
    title: Sara este înaltă, iar Karim este scund
    gloss: Sara este înaltă, iar Karim este scund.
    note: 'و (wa-) leagă cele două propoziții și se scrie lipit de cuvântul următor: وكريم (wa-karīm). Adjectivele se acordă: سارة طويلة este feminin, iar كريم قصير este masculin.'
  ar.a1.unit26.lesson02.teach.alshar:
    title: Părul
    gloss: părul
    note: 'الشعر (ash-shaʿr) înseamnă părul. ش este literă solară, deci ل din ال nu se pronunță: ash-shaʿr.'
    example_gloss: Yusuf are păr scurt și negru.
  ar.a1.unit26.lesson02.teach.ashqr_bny_rmady:
    title: Blond, șaten și cărunt
    gloss: blond / șaten / cărunt
    note: 'أشقر (ashqar), بني (bunnī) și رمادي (ramādī) descriu părul și stau după substantiv: شعر أشقر (shaʿr ashqar).'
    example_gloss:
    - Layla are păr blond.
    - Karim are păr castaniu.
    - Bunicul are părul cărunt.
  ar.a1.unit26.lesson02.teach.shar_twyl_shar:
    title: Lung și scurt (părul)
    gloss: lung / scurt (părul)
    note: 'طويل (ṭawīl) și قصير (qaṣīr) descriu și părul: شعر طويل (shaʿr ṭawīl), شعر قصير (shaʿr qaṣīr). Ele urmează după شعر, care este de genul masculin.'
    example_gloss:
    - Sara are păr lung.
    - Karim are păr scurt.
  ar.a1.unit26.lesson02.teach.alsfa_taty_bad:
    title: Adjectivul urmează după substantiv
    gloss: 'În arabă adjectivul stă după substantiv și se acordă cu el: شعر قصير (shaʿr qaṣīr), شعر طويل (shaʿr ṭawīl), شعر أشقر (shaʿr ashqar), شعر بني (shaʿr bunnī), شعر رمادي (shaʿr ramādī), شعر أسود (shaʿr aswad).'
    note: شعر (shaʿr) este masculin, deci adjectivele lui sunt tot la masculin. Cu un substantiv nedeterminat, niciunul dintre cuvinte nu primește ال.
  ar.a1.unit26.lesson02.teach.ndyf_aldmyr_ha:
    title: Părul și părul ei
    gloss: شعر (shaʿr) înseamnă păr. Adaugă pronumele ها (hā, ei) și obții شعرها (shaʿruhā, părul ei).
    note: 'Terminația ها marchează posesorul: شعرها (părul ei), اسمها (numele ei), عيناها (ochii ei). Se scrie lipită de cuvânt.'
  ar.a1.unit26.lesson02.teach.lywsf_shar_qsyr:
    title: Yusuf are păr scurt și negru
    gloss: Yusuf are păr scurt și negru.
    note: 'ليوسف شعر قصير أسود (li-yūsuf shaʿr qaṣīr aswad): ل (li-) înaintea unui nume înseamnă „are” și se scrie lipit de nume.'
  ar.a1.unit26.lesson02.teach.llyla_shar_twyl:
    title: Layla are păr lung și blond
    gloss: Layla are păr lung și blond.
    note: Combină într-o propoziție naturală vocabularul lecției despre lungime și culoare.
  ar.a1.unit26.lesson03.teach.alaynan:
    title: Ochii
    gloss: ochii
    note: 'العينان (al-ʿaynān) înseamnă ochii. Este un substantiv la dual: araba are o terminație specială ان pentru exact doi.'
    example_gloss: Yusuf are ochi căprui.
  ar.a1.unit26.lesson03.teach.azrq_bny_akhdr:
    title: Albastru, căprui și verde
    gloss: albastru / căprui / verde
    note: 'أزرق (azraq) albastru, بني (bunnī) căprui și أخضر (akhḍar) verde sunt formele de masculin. Cu عينان se folosesc formele de dual: زرقاوان (zarqāwān), بنيتان (bunnīyatān), خضراوان (khaḍrāwān).'
    example_gloss:
    - Layla are ochi albaștri.
    - Karim are ochi căprui.
    - Sara are ochi verzi.
  ar.a1.unit26.lesson03.teach.aynan_mthna_ldhlk:
    title: Ochi la dual, adjectiv la dual
    gloss: 'عينان (ʿaynān) este la dual, deci și adjectivul lui este la dual: عينان زرقاوان (ʿaynān zarqāwān), عينان بنيتان (ʿaynān bunnīyatān), عينان خضراوان (ʿaynān khaḍrāwān).'
    note: La dual, terminația ان se adaugă atât substantivului, cât și adjectivului. Adjectivul este și la feminin, pentru că عين este un substantiv feminin.
  ar.a1.unit26.lesson03.teach.kyf_tbdw_lyla:
    title: Cum arată Layla?
    gloss: Cum arată Layla?
    note: كيف تبدو ليلى؟ (kayfa tabdū laylā?) întreabă cum arată Layla. تبدو (tabdū) este feminin pentru că Layla este o femeie; pentru un bărbat se spune يبدو (yabdū).
  ar.a1.unit26.lesson03.teach.llyla_shar_twyl:
    title: Layla are păr lung și blond și ochi albaștri
    gloss: Layla are păr lung și blond și ochi albaștri.
    note: 'لليلى شعر طويل أشقر وعينان زرقاوان (li-laylā shaʿr ṭawīl ashqar wa-ʿaynān zarqāwān): ل + un nume înseamnă „are”, iar و leagă părul și ochii.'
  ar.a1.unit26.lesson04.teach.lyla_staty_ftaa:
    title: Layla o prezintă pe Nour
    gloss: 'Layla: O fată nouă va veni la cafeneaua de limbi. O cheamă Nour.'
    note: 'ستأتي (sa-taʾtī) înseamnă „va veni” (ea): س (sa-) marchează viitorul, iar ت (ta-) înseamnă „ea”. اسمها (ismuhā) înseamnă numele ei.'
  ar.a1.unit26.lesson04.teach.ywsf_hsna_kyf:
    title: Yusuf întreabă cum arată ea
    gloss: 'Yusuf: Bine! Cum arată?'
    note: 'De data aceasta nu apare niciun nume: verbul تبدو înseamnă deja „ea arată”.'
  ar.a1.unit26.lesson04.teach.lyla_hy_qsyra:
    title: Layla descrie înălțimea și părul lui Nour
    gloss: 'Layla: Este scundă și are păr scurt și blond.'
    note: قصيرة (qaṣīra) este feminin pentru că Nour este o femeie, dar شعر قصير أشقر rămâne masculin, pentru că شعر este un substantiv masculin.
  ar.a1.unit26.lesson04.teach.ywsf_waynaha:
    title: Yusuf întreabă despre ochii ei
    gloss: 'Yusuf: Dar ochii ei?'
    note: 'وعيناها (wa-ʿaynāhā) înseamnă „și ochii ei”: و (wa-) se leagă de substantiv, iar ها (hā) de la final înseamnă „ei”.'
  ar.a1.unit26.lesson04.teach.lyla_lha_aynan:
    title: Layla descrie ochii lui Nour
    gloss: 'Layla: Are ochi verzi.'
    note: 'لها (lahā) înseamnă „ea are”: ل (la-) + ها (hā). عينان خضراوان (ʿaynān khaḍrāwān) este un substantiv la dual cu adjectiv la dual.'
  ar.a1.unit26.lesson04.teach.ywsf_shkra_idhn:
    title: Yusuf o va recunoaște
    gloss: 'Yusuf: Mulțumesc! Atunci o voi recunoaște.'
    note: 'سأتعرف عليها (sa-ataʿarraf ʿalayhā) înseamnă „o voi recunoaște”: س (sa-) marchează viitorul, iar ها din عليها înseamnă „ea” (o).'
  ar.a1.unit26.lesson05.teach.sara_akht_krym:
    title: Comparație între Karim și Sara
    gloss: Karim și Sara sunt frate și soră, dar arată diferit. Karim este scund și are păr scurt și castaniu și ochi căprui. Sara este mai înaltă decât Karim și are păr lung și castaniu și ochi verzi. Tu cum arăți?
    note: O scurtă comparație care reia toate cuvintele pentru culori și lungime învățate până acum și se încheie cu întrebarea centrală a unității, adresată cititorului.
    glosses:
      أخ: frate
      أخت: soră
      تبدو: a arăta
      مختلفان: diferit
      القامة: scund (la înălțime)
      قصير: scund
      بني: castaniu
      شعر: păr
      بنيتان: castaniu
      وعينان: ochi
      أطول: mai înalt
      طويل: lung
      خضراوان: verde
      المظهر: înfățișare (cum arată cineva)
  ar.a1.unit26.lesson05.teach.llmqarna_nstkhdm_afal:
    title: Comparația cu أفعل
    gloss: 'Pentru comparație, folosește forma أفعل (afʿal) + من (min): سارة أطول من كريم (sāra aṭwal min karīm), Sara este mai înaltă decât Karim.'
    note: طويل (ṭawīl) devine أطول (aṭwal) la comparativ, iar من (min) înseamnă „decât”. Forma nu se schimbă pentru o femeie.
  ar.a1.unit26.lesson05.teach.lsara_shar_atwl:
    title: Sara are părul mai lung decât Karim
    gloss: Sara are părul mai lung decât Karim.
    note: 'لسارة شعر أطول من شعر كريم (li-sāra shaʿr aṭwal min shaʿr karīm): أطول rămâne masculin, pentru că شعر este un substantiv masculin.'
  ar.a1.unit26.lesson05.teach.ldy_shar_qsyr:
    title: Am părul scurt și castaniu
    gloss: Am părul scurt și castaniu.
    note: 'لدي (ladayya) înseamnă „am”; araba nu are verbul „a avea”. Adjectivele urmează după substantiv: شعر قصير بني (shaʿr qaṣīr bunnī).'
  ar.a1.unit26.lesson06.teach.ywsf_anzry_hl:
    title: Yusuf o observă pe Nour
    gloss: 'Yusuf: Uite, aceasta este Nour? Are păr scurt și blond și ochi verzi.'
    note: انظري (unẓurī) este imperativul pentru o femeie, pentru că Yusuf vorbește cu Layla; pentru un bărbat se spune انظر (unẓur). هذه (hādhihi) înseamnă „aceasta”, pentru un substantiv feminin.
  ar.a1.unit26.lesson06.teach.lyla_nam_hdhh:
    title: Layla confirmă
    gloss: 'Layla: Da, aceasta este Nour!'
    note: O confirmare scurtă și naturală.
  ar.a1.unit26.lesson06.teach.nwr_mrhba_hl:
    title: Nour îl salută pe Yusuf
    gloss: 'Nour: Bună, tu ești Yusuf?'
    note: 'هل أنت يوسف؟ (hal anta yūsuf?) este o întrebare cu răspuns da/nu: هل (hal) + o propoziție fără verbul „a fi”.'
  ar.a1.unit26.lesson06.teach.ywsf_nam_tshrft:
    title: Yusuf o salută la rândul lui pe Nour
    gloss: 'Yusuf: Da! Îmi pare bine să te cunosc, Nour.'
    note: تشرفت بمعرفتك (tasharraftu bi-maʿrifatika) este formula politicoasă pentru o primă întâlnire. ب (bi-) se leagă de معرفتك, iar ك de la final înseamnă „tine”.
  ar.a1.unit26.lesson06.teach.nwr_wana_ayda:
    title: Nour răspunde la salut
    gloss: 'Nour: Și mie îmi pare bine să te cunosc!'
    note: 'Încheie dialogul: Yusuf a reușit să o recunoască pe Nour după descrierea făcută mai devreme de Layla.'
