course:
  title: Araba A1
  description: 'Arabă pentru începători: descrierea înfățișării de bază a unei persoane: înălțimea și vârsta, culoarea părului și a ochilor, întrebarea كيف تبدو؟ (kayfa tabdū?) și compararea a două persoane cu أطول من (aṭwal min).'
