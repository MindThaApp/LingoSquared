teaching:
  ar.a1.unit12.lesson01.teach.tomorrow:
    title: Mâine
    gloss: mâine
    note: غدا (ghadan) plasează o acțiune în viitorul apropiat.
    example_gloss: Învăț mâine.
  ar.a1.unit12.lesson01.teach.go:
    title: Mergem
    gloss: mergem / vom merge
    note: نذهب (nadh-hab) înseamnă „mergem”; litera ن de la început marchează „noi”. Împreună cu غدا, verbul la prezent exprimă un plan.
    example_gloss: Mergem la cafenea.
  ar.a1.unit12.lesson01.teach.plan_time:
    title: Mâine la cinci
    gloss: mâine, la ora cinci
    note: في الساعة („la ora”) vine înaintea orei, ca în unitatea despre oră.
    example_gloss: Mergem mâine la ora cinci.
  ar.a1.unit12.lesson02.teach.propose:
    title: Propune un plan
    gloss: Mergem mâine la cafenea?
    note: 'هل (hal) transformă o afirmație într-o întrebare cu răspuns da sau nu; cu نذهب funcționează ca o propunere: mergem?'
    example_gloss: 'Layla a spus: Mergem mâine la cafenea?'
  ar.a1.unit12.lesson02.teach.accept:
    title: Acceptă, cu o oră
    gloss: Da, la ora cinci
    note: Poți răspunde doar cu نعم plus ora; nu este nevoie de verb.
    example_gloss: 'Yusuf a spus: Da, la ora cinci.'
  ar.a1.unit12.lesson02.teach.decline:
    title: Refuză simplu
    gloss: Nu, am lecție
    note: لا este un refuz simplu, urmat de un motiv cu عندي (am).
    example_gloss: Nu, mâine am lecție.
  ar.a1.unit12.lesson02.teach.line01:
    title: Layla propune
    gloss: Layla propune să meargă mâine la cafenea.
    note: Această replică deschide schimbul de replici în care se face un plan.
    example_gloss: 'Layla a spus: Mergem mâine la cafenea?'
  ar.a1.unit12.lesson02.teach.line02:
    title: Yusuf acceptă
    gloss: Yusuf acceptă și spune ora.
    note: Planul are acum o activitate, o zi și o oră.
    example_gloss: 'Yusuf a spus: Da, la ora cinci.'
  ar.a1.unit12.lesson02.teach.line03:
    title: Layla confirmă
    gloss: Layla spune „bine” și își ia rămas bun.
    note: جيد (jayyid) înseamnă „bine”; aici confirmă planul. إلى اللقاء este formula de rămas bun din unitatea despre saluturi.
    example_gloss: 'Layla a spus: Bine. La revedere.'
