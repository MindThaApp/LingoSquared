  ar.a1.unit37.lesson05.teach.nwr_hy_aljdyda:
    title: Nour află cum sunt toți
    gloss: Nour este nouă la cafeneaua de limbi. Îl întreabă pe Yusuf cum sunt ceilalți. Yusuf îi povestește. Layla este amabilă și răbdătoare; lucrează ca asistentă medicală. Karim este amuzant și urmează un curs de spaniolă. Sara este curioasă; îi place să învețe lucruri noi. Yusuf însuși este calm.
    note: 'Un text scurt despre grup. Adjectivele se acordă cu persoana: لطيفة (laṭīfa) pentru o femeie și مضحك (muḍḥik) pentru un bărbat.'
    glosses:
      الجديدة: cea nouă
      مقهى: cafenea
      تسأل: întreabă
      الآخرون: ceilalți
      يخبرها: povestește
