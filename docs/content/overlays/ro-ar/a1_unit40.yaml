    title: Yusuf povestește anunțul
    gloss: 'Yusuf: Angajatul spune: Mergeți la ieșirea de urgență! Este un incendiu!'
  ar.a1.unit40.lesson06.teach.lyla_ahda_ya:
    title: Layla îl liniștește pe Karim
    gloss: 'Layla: Calmează-te, Karim. Toată lumea este afară. E bine.'
