    title: Un text despre incendiu
    gloss: 'La cafeneaua de limbi din bibliotecă este un incendiu. Angajatul spune: Mergeți la ieșirea de urgență! Nour are nevoie de ajutor. Layla este cu Nour. Yusuf sună la pompieri. Toată lumea este afară. E bine!'
    note: 'O scurtă recapitulare la prezent a scenei cu incendiul. Observă verbele: الموظف يقول (angajatul spune) începe cu ي pentru un bărbat, iar نور تحتاج (Nour are nevoie) începe cu ت pentru o femeie.'
    glosses:
      مقهى: cafenea
      المكتبة: biblioteca
      حريق: focul, incendiul
      الموظف: angajatul
      يقول: spune
      اذهبوا: merg
      مخرج: ieșire
      مساعدة: ajutor
      تحتاج: are nevoie
      يتصل: cheamă (la telefon)
      بالإطفاء: pompierii
      الجميع: toți
      الخارج: afară
      جيد: bine
