    gloss: Ai internet acasă?
  ar.a1.unit30.lesson01.teach.astkhdm_hatfy_kl:
    title: Îmi folosesc telefonul în fiecare zi
    gloss: Îmi folosesc telefonul în fiecare zi.
    note: أستخدم (astakhdim) înseamnă „folosesc”. Litera ي de la sfârșitul cuvântului هاتفي înseamnă „al meu”.
  ar.a1.unit30.lesson02.teach.alttbyq:
    title: Aplicația
    gloss: aplicația
    example_gloss: Am o aplicație pentru prognoza meteo.
  ar.a1.unit30.lesson02.teach.alrsala:
    title: Mesajul
    gloss: mesajul
    example_gloss: Trimit un mesaj prin aplicație.
  ar.a1.unit30.lesson02.teach.rsala_tany_nsa:
    title: 'Mesaj: a trimite și a citi'
    gloss: رسالة (risāla) înseamnă un mesaj pe care îl trimiți (أرسل رسالة, ursil risāla) sau îl citești (أقرأ رسالة, aqraʾ risāla).
    note: Leagă cuvântul nou de textul despre prognoza meteo și de mesajele pe care oamenii le trimit și le citesc.
  ar.a1.unit30.lesson02.teach.lyla_trsl_rsala:
    title: Layla trimite un mesaj prin aplicație
    gloss: Layla trimite un mesaj prin aplicație.
    note: 'ترسل (tursil) înseamnă „ea trimite”: litera de la început, ت (ta-), arată persoana a treia feminin. عبر (ʿabra) înseamnă „prin” sau „via”.'
  ar.a1.unit30.lesson02.teach.ywsf_yqra_alrsala:
    title: Yusuf citește mesajul
    gloss: Yusuf citește mesajul.
  ar.a1.unit30.lesson03.teach.albhth_an:
    title: A căuta (o informație)
    gloss: a verifica, a căuta o informație
    example_gloss: Verific prognoza meteo.
  ar.a1.unit30.lesson03.teach.alfal_abhth_yaty:
    title: Un verb cu عن
    gloss: 'Verbul أبحث (abḥath) este urmat de عن (ʿan): أبحث عن توقعات الطقس (abḥath ʿan tawaqquʿāt aṭ-ṭaqs). Dar أستخدم (astakhdim) are complementul direct, fără prepoziție: أستخدم هاتفي.'
    note: عن (ʿan) înseamnă „despre” sau „după”. Fiecare verb arab are propria prepoziție, așa că învață-le împreună.
  ar.a1.unit30.lesson03.teach.krym_ybhth_an:
    title: Karim caută prognoza meteo
    gloss: Karim caută prognoza meteo.
  ar.a1.unit30.lesson03.teach.thm_ydhhb_llrkd:
    title: Apoi merge la alergat
    gloss: Apoi merge la alergat.
    note: 'ثم (thumma) înseamnă „apoi” și este un cuvânt separat, spre deosebire de و. يذهب للركض (yadhhab li-r-rakḍ) înseamnă „se duce să alerge”: ل + الركض devine للركض.'
  ar.a1.unit30.lesson04.teach.lyla_hl_nmars:
    title: Layla face o propunere
    gloss: 'Layla: Facem sport sâmbătă, la ora zece?'
  ar.a1.unit30.lesson04.teach.ywsf_fkra_jyda:
    title: Yusuf e de acord
    gloss: 'Yusuf: Bună idee! Voi căuta prognoza meteo.'
    note: 'فكرة جيدة (fikra jayyida): adjectivul جيدة se termină în ة ca substantivul, pentru că ambele sunt feminine. سأبحث (sa-abḥath) este viitorul: س + أبحث.'
  ar.a1.unit30.lesson04.teach.ywsf_aljw_mshms:
    title: Yusuf verifică vremea
    gloss: 'Yusuf: Sâmbătă e soare!'
    note: الجو مشمس (al-jaww mushmis) înseamnă „vremea e însorită”, fără un cuvânt pentru „este”. مشمس este la masculin, ca să se acorde cu الجو.
  ar.a1.unit30.lesson04.teach.krym_ara_alrsala:
    title: Karim vede mesajul
    gloss: 'Karim: Văd mesajul. Ne vedem sâmbătă!'
  ar.a1.unit30.lesson04.teach.ila_allqaa_abara:
    title: إلى اللقاء + o zi
    gloss: 'Cunoști deja إلى اللقاء (ilā al-liqāʾ, la revedere). Poți adăuga o zi: إلى اللقاء يوم السبت (ilā al-liqāʾ yawm as-sabt), إلى اللقاء غدا (ilā al-liqāʾ ghadan).'
    note: Extinde formula de rămas-bun din unitatea despre saluturi la o zi anume.
  ar.a1.unit30.lesson05.teach.lyla_ttsl_bywsf:
    title: Cine ce folosește?
    gloss: Layla îl sună pe Yusuf în fiecare zi. Folosește telefonul, nu o aplicație. Yusuf nu are calculator acasă, dar folosește internetul pe telefon. Karim caută în fiecare dimineață prognoza meteo. Apoi se duce să alerge. Sara îi trimite des mesaje Laylei. Și tu îți folosești telefonul în fiecare zi?
    note: Compară obiceiurile celor patru personaje legate de dispozitive, la fel ca textul comparativ din unitatea despre sport.
    glosses:
      تتصل: sună
      كل: fiecare
      يوم: zi
      تستخدم: folosește
      هاتفها: telefon
      تطبيقا: aplicație
      حاسوب: computer
      البيت: acasă
      الإنترنت: internet
      يبحث: verifică
      صباح: dimineață
      توقعات: prognoză (prognoza meteo)
      يذهب: merge
      للركض: pentru alergare
      ترسل: trimite
      كثيرا: des
      رسالة: mesaj
      تستعمل: folosești
  ar.a1.unit30.lesson05.teach.krym_ybhth_kl:
    title: Karim caută prognoza în fiecare dimineață
    gloss: Karim caută prognoza meteo în fiecare dimineață.
  ar.a1.unit30.lesson05.teach.sara_trsl_rsala:
    title: Sara îi scrie des Laylei
    gloss: Sara îi trimite des un mesaj Laylei.
  ar.a1.unit30.lesson06.teach.lyla_ara_alrsala:
    title: Layla confirmă planul
    gloss: 'Layla: Văd mesajul. Facem sport sâmbătă, la ora zece, în parc?'
  ar.a1.unit30.lesson06.teach.ywsf_nam_waljw:
    title: Yusuf confirmă vremea
    gloss: 'Yusuf: Da, și sâmbătă e soare!'
  ar.a1.unit30.lesson06.teach.krym_sarkd_idhn:
    title: Planul lui Karim
    gloss: 'Karim: Atunci voi alerga. După aceea voi juca și fotbal.'
    note: 'سأركض (sa-arkuḍ) înseamnă „voi alerga”: س marchează viitorul. بعد ذلك (baʿda dhālik) înseamnă „după aceea”.'
  ar.a1.unit30.lesson06.teach.sara_afdl_alsbaha:
    title: Planul Sarei
    gloss: 'Sara: Prefer să înot, dar vin și eu în parc.'
    note: أفضل (ufaḍḍil) înseamnă „prefer”. لكنني (lākinnanī) înseamnă „dar eu”, iar سآتي (sa-ātī) înseamnă „voi veni”.
  ar.a1.unit30.lesson06.teach.lyla_jmyl_ila:
    title: Layla încheie conversația
    gloss: 'Layla: Frumos! Ne vedem sâmbătă în parc!'
    note: Încheie într-o singură replică atât firul de mesaje din această unitate, cât și planul din unitatea despre sport.
