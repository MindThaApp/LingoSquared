course:
  title: Araba A1
  description: 'Arabă pentru începători despre tehnologie: denumirea telefonului, a calculatorului și a internetului, trimiterea și citirea mesajelor într-o aplicație, căutarea de informații online și folosirea lor pentru a face un plan real cu prietenii.'
