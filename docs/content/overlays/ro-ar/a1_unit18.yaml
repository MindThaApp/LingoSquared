  ar.a1.unit18.lesson01.teach.work:
    title: Munca
    gloss: muncă
    note: 'عمل (ʿamal) înseamnă muncă. ما عملك؟ întreabă despre munca cuiva; terminația ـك înseamnă „tău/ta”: ʿamaluka pentru un bărbat, ʿamaluki pentru o femeie, scrise la fel.'
    example_gloss: Care este munca ta?
  ar.a1.unit18.lesson01.teach.engineer:
    title: Inginer
    gloss: inginer
    note: مهندس (muhandis) este forma de masculin, folosită pentru Yusuf; o femeie spune أنا مهندسة (anā muhandisa).
    example_gloss: Sunt inginer.
  ar.a1.unit18.lesson01.teach.office:
    title: Biroul
    gloss: birou
    note: مكتب (maktab) înseamnă birou (încăpere); في مكتب înseamnă într-un birou.
    example_gloss: Lucrez într-un birou.
  ar.a1.unit18.lesson01.teach.workplace_sentence:
    title: Lucrez într-un birou
    gloss: lucrez într-un birou
    note: أعمل (aʿmal) înseamnă lucrez; are aceeași rădăcină ca عمل (muncă), iar أ de la început marchează persoana I (eu).
    example_gloss: 'Yusuf a spus: Lucrez într-un birou.'
  ar.a1.unit18.lesson02.teach.write:
    title: Scriu
    gloss: scriu
    note: أكتب (aktub) înseamnă scriu.
    example_gloss: Scriu la serviciu.
  ar.a1.unit18.lesson02.teach.read:
    title: Citesc
    gloss: citesc
    note: أقرأ (aqraʾ) înseamnă citesc.
    example_gloss: Citesc la serviciu.
  ar.a1.unit18.lesson02.teach.at_work:
    title: La serviciu
    gloss: la serviciu
    note: العمل (al-ʿamal) înseamnă munca; في العمل înseamnă la serviciu.
    example_gloss: Scriu și citesc la serviciu.
  ar.a1.unit18.lesson02.teach.line01:
    title: Întreabă despre muncă
    gloss: Layla îl întreabă pe Yusuf despre munca lui.
    note: يا يوسف se adresează lui Yusuf pe nume (vocativ).
    example_gloss: 'Layla a spus: Cu ce te ocupi, Yusuf?'
  ar.a1.unit18.lesson02.teach.line02:
    title: Spune profesia
    gloss: Yusuf spune că este inginer.
    note: Nu este nevoie de un cuvânt separat pentru „sunt”.
    example_gloss: 'Yusuf a spus: Sunt inginer.'
  ar.a1.unit18.lesson02.teach.line03:
    title: Spune locul de muncă
    gloss: Yusuf spune că lucrează într-un birou.
    note: أعمل في indică locul de muncă.
    example_gloss: 'Yusuf a spus: Lucrez într-un birou.'
  ar.a1.unit18.lesson02.teach.line04:
    title: Întreabă despre activitate
    gloss: Layla îl întreabă ce face Yusuf în fiecare zi.
    note: 'Aici revine întrebarea despre rutină; تفعل se spune unui bărbat. Unei femei i se spune: ماذا تفعلين كل يوم؟'
    example_gloss: 'Layla a spus: Ce faci în fiecare zi?'
  ar.a1.unit18.lesson02.teach.line05:
    title: Spune activitatea
    gloss: Yusuf spune că scrie și citește la serviciu.
    note: 'و (wa, „și”) leagă cele două activități și se scrie legat de cuvântul următor: وأقرأ.'
    example_gloss: 'Yusuf a spus: Scriu și citesc la serviciu.'
