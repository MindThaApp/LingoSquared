teaching:
  ar.a1.unit17.lesson01.teach.pain:
    title: Durere
    gloss: durere
    note: ألم (alam) înseamnă durere; عندي ألم (ʿindī alam) înseamnă „mă doare” (am o durere).
    example_gloss: Mă doare.
  ar.a1.unit17.lesson01.teach.head:
    title: Capul
    gloss: capul
    note: الرأس (ar-raʾs) este capul. Araba spune عندي ألم في الرأس, adică „o durere în cap”, pe când în română se spune de obicei „mă doare capul”.
    example_gloss: Mă doare capul.
  ar.a1.unit17.lesson01.teach.stomach:
    title: Stomacul
    gloss: stomacul
    note: البطن (al-baṭn) este stomacul sau zona abdomenului.
    example_gloss: Mă doare stomacul.
  ar.a1.unit17.lesson01.teach.problem_sentence:
    title: Durere de cap
    gloss: Mă doare capul
    note: عندي ألم, literal „la mine (este) durere”, este modul în care araba spune „mă doare”; في + partea corpului arată unde.
    example_gloss: 'Layla a spus: Mă doare capul.'
  ar.a1.unit17.lesson02.teach.problem_question:
    title: Care este problema?
    gloss: Care este problema?
    note: ما (mā) întreabă „ce”; المشكلة (al-mushkila) înseamnă problema.
    example_gloss: Care este problema, Layla?
  ar.a1.unit17.lesson02.teach.drink:
    title: Bea apă
    gloss: bea apă
    note: اشربي (ishrabī) este porunca „bea!” adresată unei femei, aici Layla; unui bărbat i se spune اشرب (ishrab).
    example_gloss: 'Yusuf a spus: Bea apă.'
  ar.a1.unit17.lesson02.teach.rest:
    title: Odihnește-te
    gloss: odihnește-te
    note: استريحي (istarīḥī) este porunca „odihnește-te!” adresată unei femei; unui bărbat i se spune استرح (istariḥ).
    example_gloss: Odihnește-te astăzi.
  ar.a1.unit17.lesson02.teach.need_help:
    title: Am nevoie de ajutor
    gloss: Am nevoie de ajutor
    note: أحتاج (aḥtāj) înseamnă „am nevoie” și مساعدة (musāʿada) înseamnă ajutor. Vei întâlni și أحتاج إلى مساعدة, cu إلى; ambele sunt corecte.
    example_gloss: Mă doare. Am nevoie de ajutor.
  ar.a1.unit17.lesson02.teach.line01:
    title: Întreabă care e problema
    gloss: Yusuf o întreabă pe Layla care este problema.
    note: يا ليلى se adresează Laylei pe nume.
    example_gloss: 'Yusuf a spus: Care este problema, Layla?'
  ar.a1.unit17.lesson02.teach.line02:
    title: Spune simptomul
    gloss: Layla spune că o doare capul.
    note: Simptomul este spus direct.
    example_gloss: 'Layla a spus: Mă doare capul.'
  ar.a1.unit17.lesson02.teach.line03:
    title: Un sfat simplu
    gloss: Yusuf îi spune Laylei să bea apă și să se odihnească.
    note: 'Ambele porunci sunt la feminin, pentru că Yusuf vorbește cu Layla; و (wa, „și”) se scrie legat de cuvântul următor: واستريحي.'
    example_gloss: 'Yusuf a spus: Bea apă și odihnește-te.'
  ar.a1.unit17.lesson02.teach.line04:
    title: Mulțumiri
    gloss: Layla spune mulțumesc.
    note: شكرا încheie scurtul schimb de replici.
    example_gloss: 'Layla a spus: Mulțumesc.'
