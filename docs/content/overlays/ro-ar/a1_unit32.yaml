  ar.a1.unit32.lesson05.teach.ywm_alsbt_ayd:
    title: Cine ce face pentru petrecere?
    gloss: Sâmbătă este ziua Sarei. Sărbătorim cu o petrecere. Yusuf îi invită pe Karim și pe Layla la petrecere. Karim îi place să sărbătorească alături de prieteni. Layla va veni și ea la petrecere. Toți sunt fericiți pentru Sara.
    note: Recapitulează planul pentru petrecere.
    glosses:
      السبت: sâmbătă
      ميلاد: naștere (ca în ziua de naștere)
      نحتفل: a sărbători
      بحفلة: petrecere
      يدعو: invită
      إلى: la (ca în „invită ... la petrecere”)
      الاحتفال: sărbătorește
      يحب: cu plăcere
      الأصدقاء: prieteni
      ستأتي: vine
      الجميع: toți
      سعداء: se bucură
