    title: Cine ce studiază?
    gloss: Karim nu doar lucrează, ci și studiază. Urmează un curs de spaniolă la centrul de educație pentru adulți. În fiecare săptămână învață cuvinte noi. Sara urmează un program la colegiu. Acolo studiază asistența medicală. Amândurora le place să studieze. Tu ce studiezi sau ce ai vrea să înveți?
    note: Compară studiile lui Karim și ale Sarei, ca în lectura de comparație din unitatea despre tehnologie.
    glosses:
      يعمل: lucrează
      فقط: doar
      يدرس: studiază
      يتابع: ia
      دورة: curs
      الإسبانية: spaniolă
      مركز: centru (centru de educație pentru adulți)
      يتعلم: învață
      كل: fiecare
      أسبوع: săptămână
