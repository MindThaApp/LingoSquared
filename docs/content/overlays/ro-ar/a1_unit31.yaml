      كلمات: cuvinte
      تلتحق: este înscrisă (urmează un program)
      ببرنامج: program de studii
      الكلية: școală superioară
      الرعاية: îngrijire (asistență medicală)
      كلاهما: amândoi
      يحب: le place
      الدراسة: a studia
      تتعلم: a învăța
