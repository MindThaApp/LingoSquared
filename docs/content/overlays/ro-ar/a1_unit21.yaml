teaching:
  ar.a1.unit21.lesson01.teach.clothes:
    title: Haine
    gloss: haine
    note: ملابس (malābis) este un substantiv la plural care înseamnă haine.
    example_gloss: Vreau haine.
  ar.a1.unit21.lesson01.teach.shirt:
    title: Cămașă
    gloss: cămașă
    note: 'قميص (qamīṣ) înseamnă cămașă; după أريد primește terminația de acuzativ -an: قميصا (qamīṣan).'
    example_gloss: Vreau o cămașă.
  ar.a1.unit21.lesson01.teach.blue:
    title: Albastră
    gloss: albastru
    note: 'أزرق (azraq) este forma masculină, care se acordă cu قميص; cu un substantiv feminin devine زرقاء (zarqāʾ). După أريد, أزرق nu primește alif în plus: قميصا أزرق.'
    example_gloss: Vreau o cămașă albastră.
  ar.a1.unit21.lesson01.teach.blue_shirt:
    title: O cămașă albastră
    gloss: o cămașă albastră
    note: 'În arabă, culoarea stă după obiect, la fel ca adjectivul în română: قميصا أزرق (qamīṣan azraq).'
    example_gloss: Vreau o cămașă albastră.
  ar.a1.unit21.lesson02.teach.size:
    title: Mărimea
    gloss: mărimea
    note: مقاس (maqās) înseamnă mărime; ما المقاس؟ (mā l-maqās) întreabă ce mărime.
    example_gloss: Ce mărime?
  ar.a1.unit21.lesson02.teach.medium:
    title: Mărimea medie
    gloss: mărime medie
    note: 'متوسط (mutawassiṭ) înseamnă mediu; cu بـ (bi-, în) se leagă de un obiect: قميصا بمقاس متوسط (qamīṣan bi-maqāsin mutawassiṭ), o cămașă de mărime medie.'
    example_gloss: Vreau o cămașă de mărime medie.
  ar.a1.unit21.lesson02.teach.price:
    title: Zece dirhami
    gloss: zece dirhami
    note: 'بعشرة (bi-ʿashara) înseamnă cu zece: prefixul بـ marchează prețul, ca în unitatea despre cumpărături.'
    example_gloss: Cămașa costă zece dirhami.
  ar.a1.unit21.lesson02.teach.line01:
    title: Cererea unui obiect
    gloss: Layla cere o cămașă albastră.
    note: من فضلك păstrează cererea politicoasă.
    example_gloss: 'Layla a spus: Vreau o cămașă albastră, vă rog.'
  ar.a1.unit21.lesson02.teach.line02:
    title: Întrebarea despre mărime
    gloss: Vânzătorul întreabă ce mărime.
    note: 'Vânzătorul întreabă mărimea: ما المقاس؟'
    example_gloss: 'Vânzătorul a spus: Ce mărime?'
  ar.a1.unit21.lesson02.teach.line03:
    title: Spunerea mărimii
    gloss: Layla spune mărimea medie.
    note: Aceasta răspunde direct la întrebarea despre mărime.
    example_gloss: 'Layla a spus: Mărimea medie.'
  ar.a1.unit21.lesson02.teach.line04:
    title: Darea obiectului și a prețului
    gloss: Vânzătorul dă cămașa și spune prețul.
    note: تفضلي (tafaḍḍalī) se spune unei femei când îi dai ceva; unui bărbat i se spune تفضل (tafaḍḍal).
    example_gloss: 'Vânzătorul a spus: Poftiți. Cămașa costă zece dirhami.'
