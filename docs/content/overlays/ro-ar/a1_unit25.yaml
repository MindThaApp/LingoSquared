course:
  title: Araba A1
  description: 'Arabă pentru începători, pentru a vorbi despre activitățile din timpul liber: vocabular al hobby-urilor, expresii de frecvență, cum să întrebi și să răspunzi ce face cineva în timpul liber și cum să compari hobby-urile a două persoane.'
