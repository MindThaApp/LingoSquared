teaching:
  ar.a1.unit25.lesson01.teach.alqraaa_mmarsa_alryada:
    title: Citit, sport, gătit
    gloss: a citi, a face sport, a găti
    note: القراءة (al-qirāʾa) este cititul, ممارسة الرياضة (mumārasat ar-riyāḍa) este practicarea sportului, iar الطبخ (aṭ-ṭabkh) este gătitul. Fiecare este un substantiv, deci articolul ال este lipit de el.
    example_gloss:
    - Îmi place să citesc o carte.
    - Fac sport sâmbăta.
    - Îmi place să gătesc pentru prieteni.
  ar.a1.unit25.lesson01.teach.wqt_alfragh:
    title: Timpul liber
    gloss: timpul liber
    note: وقت الفراغ (waqt al-farāgh) este, literal, „timpul spațiului liber”. Primul cuvânt nu are ال; doar al doilea îl primește.
    example_gloss: În timpul liber, îmi place să citesc.
  ar.a1.unit25.lesson01.teach.fy_wqt_fraghy:
    title: Spui ce faci în timpul liber
    gloss: În timpul liber, îmi place să citesc.
    note: أحب (uḥibb) înseamnă „îmi place” și este la fel pentru un bărbat și pentru o femeie. ي de la sfârșitul cuvântului فراغي (farāghī) înseamnă „meu”.
  ar.a1.unit25.lesson02.teach.alastmaa_ila_almwsyqa:
    title: Muzică, desen, jocuri video
    gloss: a asculta muzică, a desena, a juca jocuri video
    note: الاستماع إلى الموسيقى (al-istimāʿ ilā al-mūsīqā) este ascultatul muzicii, الرسم (ar-rasm) este desenul, iar لعب ألعاب الفيديو (laʿb alʿāb al-fīdiyū) este jucatul jocurilor video.
    example_gloss:
    - Îmi place să ascult muzică.
    - Desenez des.
    - Îmi place să joc jocuri video cu prietenii.
  ar.a1.unit25.lesson02.teach.ahb_alastmaa_ila:
    title: Spui că îți place să asculți muzică
    gloss: Îmi place să ascult muzică.
    note: 'الاستماع (al-istimāʿ) cere إلى (ilā, „la”) înaintea a ceea ce asculți: الاستماع إلى الموسيقى.'
  ar.a1.unit25.lesson02.teach.ahb_lab_alaab:
    title: Spui că îți place să joci jocuri video cu prietenii
    gloss: Îmi place să joc jocuri video cu prietenii.
    note: 'مع (maʿa) înseamnă „cu”: مع الأصدقاء (maʿa al-aṣdiqāʾ). Articolul ال rămâne lipit de الأصدقاء.'
  ar.a1.unit25.lesson03.teach.daima_kthyra_ahyana:
    title: Mereu, des, uneori, niciodată
    gloss: mereu, des, uneori, niciodată
    note: دائما (dāʾiman), كثيرا (kathīran), أحيانا (aḥyānan) și أبدا (abadan) sunt adverbe, deci nu se schimbă după gen. ا (alif) de la final se scrie fără semne.
    example_gloss:
    - Fac mereu sport sâmbăta.
    - Citesc des o carte.
    - Desenez uneori.
    - Nu joc niciodată jocuri video.
  ar.a1.unit25.lesson03.teach.kl_asbwa_kl:
    title: În fiecare săptămână, în fiecare weekend
    gloss: în fiecare săptămână, în fiecare weekend
    note: كل أسبوع (kull usbūʿ) și كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ) folosesc ambele كل (kull, „fiecare”); vezi cartonașul următor.
    example_gloss:
    - Gătesc pentru prieteni în fiecare săptămână.
    - Fac sport în fiecare weekend.
  ar.a1.unit25.lesson03.teach.bad_kl_yaty:
    title: 'Fiecare: كل'
    gloss: 'După كل (kull, „fiecare”) substantivul este la singular și nu are ال: كل أسبوع (kull usbūʿ), كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ).'
    note: 'كل (kull) nu se schimbă: același cuvânt stă înaintea unui substantiv masculin, ca أسبوع, și înaintea unuia feminin, ca عطلة.'
  ar.a1.unit25.lesson03.teach.madha_tfal_fy:
    title: Întrebi despre timpul liber
    gloss: Ce faci în timpul liber?
    note: Aceasta este întrebarea de bază a unității -- folosește-o ca să întrebi pe oricine despre hobby-uri.
  ar.a1.unit25.lesson04.teach.lyla_ntmsha_maa:
    title: Layla aduce vorba despre hobby-uri
    gloss: 'Layla: Ne plimbăm des împreună. Dar ce mai faci în timpul liber, Yusuf?'
    note: Litera inițială ن (na-) din نتمشى (natamashshā) înseamnă „noi”, deci araba nu are nevoie de un cuvânt separat pentru „noi”. معا (maʿan) înseamnă „împreună”.
  ar.a1.unit25.lesson04.teach.ywsf_ahb_altbkh:
    title: Hobby-urile lui Yusuf
    gloss: 'Yusuf: Îmi place să gătesc, și acasă. Și fac sport des.'
    note: في البيت أيضا (fī al-bayt ayḍan) adaugă „și acasă”. وأمارس (wa-umāris) leagă و („și”) de verb și se scrie ca un singur cuvânt.
  ar.a1.unit25.lesson04.teach.lyla_hl_ttbkh:
    title: Layla este surprinsă
    gloss: 'Layla: Gătești și acasă? Doar gătești toată ziua la serviciu!'
    note: تطبخ (taṭbukh) este verbul la persoana a doua pentru un bărbat; unei femei îi spui تطبخين (taṭbukhīn). طوال اليوم (ṭawāl al-yawm) înseamnă „toată ziua”.
  ar.a1.unit25.lesson04.teach.ywsf_nam_lknny:
    title: Yusuf explică
    gloss: 'Yusuf: Da, dar mie gătitul mi se pare relaxant. Și tu, ce-ți place să faci?'
    note: 'أجد (ajid) înseamnă „găsesc” și مريحا (murīḥan) înseamnă „relaxant”. وأنت (wa-anta) leagă و de أنت: „și tu”.'
  ar.a1.unit25.lesson04.teach.lyla_ahb_alqraaa:
    title: Hobby-urile Laylei
    gloss: 'Layla: Îmi place să citesc și ascult des muzică.'
    note: 'و leagă cele două hobby-uri: أحب القراءة (uḥibb al-qirāʾa) și وأستمع (wa-astamiʿ, „și ascult”). Se scrie lipit de cuvântul următor.'
  ar.a1.unit25.lesson04.teach.ywsf_hl_tlabyn:
    title: Yusuf întreabă despre jocuri
    gloss: 'Yusuf: Joci și jocuri video?'
    note: تلعبين (talʿabīn) este verbul la persoana a doua pentru o femeie, pentru că Yusuf o întreabă pe Layla; pentru un bărbat este تلعب (talʿab). هل (hal) începe o întrebare cu răspuns da/nu.
  ar.a1.unit25.lesson04.teach.lyla_la_la:
    title: Layla răspunde
    gloss: 'Layla: Nu, nu joc niciodată jocuri video. Dar uneori desenez!'
    note: 'أبدا (abadan) înseamnă „niciodată” și أحيانا (aḥyānan) „uneori”. Verbul se neagă cu لا (lā): لا ألعب (lā alʿab) înseamnă „nu joc”.'
  ar.a1.unit25.lesson05.teach.ana_wywsf_ntmsha:
    title: Comparăm hobby-urile
    gloss: Eu și Yusuf ne plimbăm des împreună. Dar avem și alte hobby-uri. Lui Yusuf îi place să gătească, și acasă, și face sport des. Mie îmi place să citesc și ascult des muzică. Uneori desenez, dar nu joc niciodată jocuri video. Tu ce-ți place să faci în timpul liber?
    note: Mesajul Laylei reia ce ai învățat în lecțiile anterioare și se încheie cu întrebarea centrală a unității.
    glosses:
      نتمشى: a se plimba
      كثيرا: des
      معا: împreună
      أخرى: alte
      يطبخ: gătește
      يحب: cu plăcere
      البيت: casa (acasă)
      ويمارس: face sport
      أقرأ: citesc
      وأستمع: ascult
      الموسيقى: muzică
      أرسم: desenez
      أحيانا: uneori
      ألعب: joc (jocuri video)
      أبدا: niciodată
      فراغك: timpul tău liber
      وقت: timp
  ar.a1.unit25.lesson06.teach.ywsf_madha_stfalyn:
    title: Yusuf întreabă despre weekend
    gloss: 'Yusuf: Ce faci în weekendul acesta?'
    note: 'ستفعلين (sa-tafʿalīn) este la viitor: litera inițială س (sa-) îl marchează, iar terminația ين este pentru o femeie. عطلة نهاية الأسبوع (ʿuṭlat nihāyat al-usbūʿ) înseamnă „weekendul”.'
  ar.a1.unit25.lesson06.teach.lyla_la_aarf:
    title: Layla este nehotărâtă
    gloss: 'Layla: Încă nu știu. Îmi place să citesc, dar vreau și să ies.'
    note: لا أعرف بعد (lā aʿrif baʿd) înseamnă „încă nu știu”. أن أخرج (an akhruj) înseamnă „să ies”.
  ar.a1.unit25.lesson06.teach.ywsf_hl_ntmsha:
    title: Yusuf propune un plan
    gloss: 'Yusuf: Ne plimbăm împreună? După aceea gătesc eu pentru noi.'
    note: 'هل نتمشى (hal natamashshā) este modul obișnuit de a propune ceva împreună: هل + un verb la persoana „noi”. لنا (lanā) este ل („pentru”) + نا („noi”), scris ca un singur cuvânt.'
  ar.a1.unit25.lesson06.teach.lyla_fkra_jyda:
    title: Layla este de acord
    gloss: 'Layla: Idee bună! Îmi place și plimbarea, și gătitul.'
    note: 'كليهما (kilayhimā) înseamnă „amândouă” și stă la final, referindu-se la cele două lucruri: المشي والطبخ (al-mashy wa-aṭ-ṭabkh).'
  ar.a1.unit25.lesson06.teach.ywsf_mmtaz_idhn:
    title: Yusuf confirmă
    gloss: 'Yusuf: Perfect. Atunci ne vedem sâmbătă!'
    note: يوم السبت (yawm as-sabt) înseamnă „sâmbătă”. ل din ال nu se pronunță înaintea lui س, literă solară, așa că transcriem as-sabt.
