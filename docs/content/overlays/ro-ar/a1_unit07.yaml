    title: Doriți pâine?
    gloss: Doriți pâine?
    note: تريدين (turīdīna) înseamnă „vrei”, spus unei femei, aici Layla; unui bărbat i se spune تريد (turīdu).
    example_gloss: 'Ospătarul a spus: Doriți pâine?'
