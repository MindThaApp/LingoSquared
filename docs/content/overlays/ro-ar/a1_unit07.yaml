    gloss: Layla spune da și cere o felie de pâine.
    note: نعم exprimă răspunsul afirmativ.
    example_gloss: 'Layla a spus: Da, vreau o felie de pâine.'
  ar.a1.unit07.lesson02.teach.line04:
