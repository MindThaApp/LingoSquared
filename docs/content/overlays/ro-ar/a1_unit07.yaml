    title: Poftiți
    gloss: poftiți
    note: تفضلي (tafaḍḍalī) se spune unei femei când i se oferă ceva; unui bărbat i se spune تفضل (tafaḍḍal).
    example_gloss: 'Ospătarul a spus: Poftiți.'
  ar.a1.unit07.lesson02.teach.line01:
    title: Plasează o comandă
    gloss: Layla comandă politicos apă și cafea.
    note: Cererea folosește أريد urmat de produse.
    example_gloss: 'Layla a spus: Bună ziua. Vreau apă și cafea, vă rog.'
  ar.a1.unit07.lesson02.teach.line02:
    title: Pune o întrebare suplimentară
    gloss: Ospătarul o întreabă dacă dorește pâine.
