teaching:
  en.a2.unit36.lesson01.teach.certificate:
    title: certificate
    gloss: 証明書
    note: '*certificate* は、役所などが発行する公的な書類のことです。*registration certificate* は住民登録証明書です。'
    example_gloss: 住民登録証明書は、予約日の2週間後に届きました。
  en.a2.unit36.lesson01.teach.mistake:
    title: mistake
    gloss: 間違い、誤り
    note: '*mistake* は、間違って書かれたり、間違ってされたりしたことです。'
    example_gloss: この書類の私の住所に間違いがあります。
  en.a2.unit36.lesson01.teach.spelled:
    title: spelled
    gloss: つづられた、書かれた
    note: '*spelled* は、単語がどの文字をどの順番で使って書かれているかを表します。'
    example_gloss: 私の名前のつづりは L が1つで、2つではありません。
  en.a2.unit36.lesson01.teach.correct:
    title: correct
    gloss: 訂正する、直す
    note: ここでの *correct* は動詞で、間違っているものを正しくするという意味です。
    example_gloss: 担当者は、今日私の姓を訂正できます。
  en.a2.unit36.lesson01.teach.copy:
    title: copy
    gloss: コピー、写し
    note: '*copy* は、書類と同じ内容をもう1部作ったもののことです。'
    example_gloss: 役所は、すべての書類のコピーを保管しています。
  en.a2.unit36.lesson01.teach.passport:
    title: passport
    gloss: パスポート
    note: '*passport* は、あなたの写真がついた旅行用の身分証明書です。'
    example_gloss: 役所の予約には、いつもパスポートを持っていきます。
  en.a2.unit36.lesson01.teach.grammar_there_is_there_are:
    title: there is と there are
    gloss: 私の証明書には間違いが1つあります。私の証明書には間違いが2つあります。
    note: '*there is* は1つのものについて、*there are* は2つ以上のものについて使います。日本語の「あります」は数が変わっても形が同じですが、英語では be 動詞の形が変わります。'
  en.a2.unit36.lesson02.teach.there_is_a_mistake:
    title: 間違いがあると伝える
    gloss: 私の住民登録証明書に間違いがあります。
    note: '*There is a mistake on...* は、誤りを事務的かつ丁寧に伝える言い方です。'
  en.a2.unit36.lesson02.teach.name_spelled_wrong:
    title: 何が間違っているかを具体的に伝える
    gloss: 私の姓のつづりが間違っています。
    note: '*last name* は姓、*first name* は名です。'
  en.a2.unit36.lesson02.teach.could_you_correct_it:
    title: 訂正できるかをたずねる
    gloss: それを訂正していただけますか？
    note: '*Could you...?* は *Can you...?* より丁寧で、役所の窓口に合う言い方です。'
  en.a2.unit36.lesson02.teach.how_long_correction:
    title: どのくらいかかるかをたずねる
    gloss: 訂正にはどのくらい時間がかかりますか？
    note: '*How long...?* は、長さではなく、時間の長さをたずねるときに使います。'
  en.a2.unit36.lesson02.teach.grammar_polite_request:
    title: 丁寧なお願い2つ
    gloss: それを訂正していただけますか？新しい証明書をいただくことは可能でしょうか？
    note: '*Could you...?* は何かをしてもらうようお願いする言い方です。*Would it be possible to...?* はさらに控えめで、そもそもそれが可能かどうかをたずねます。'
  en.a2.unit36.lesson03.teach.working_days:
    title: working days
    gloss: 営業日、就業日
    note: '*working days* は、週末を除く月曜日から金曜日までの日のことです。'
    example_gloss: 役所は、すべての手紙に5営業日以内に返事をします。
  en.a2.unit36.lesson03.teach.notice_text:
    title: 訂正を求める文面
    gloss: 訂正依頼を受け付けました。あなたの住民登録証明書は、5営業日以内に訂正されます。パスポートとこの通知を役所に持参してください。照会番号3092。
    note: 公的な通知は短く事務的で、何が起きたか、これから何が起きるか、あなたが何をすべきかが書かれています。
  en.a2.unit36.lesson03.teach.bring_passport_and_notice:
    title: 何を持っていくべきか
    gloss: パスポートとこの通知を役所に持参してください。
    note: '*bring ... to ...* は、あるものをある場所に持っていくという意味です。'
  en.a2.unit36.lesson04.teach.q_there_is_a_mistake:
    title: レイラがエラーを報告する
    gloss: レイラが言います：こんにちは、私の住民登録証明書に間違いがあります。
    note: '*Hello* は *Hi* より中立的で、役所の窓口に向いています。'
  en.a2.unit36.lesson04.teach.a_what_is_wrong:
    title: 窓口担当者が聞き返す
    gloss: 担当者が言います：わかりました。どこが間違っていますか？
    note: ここでの *I see* は、「わかりました、うかがっています」という意味です。
  en.a2.unit36.lesson04.teach.q_name_spelled_wrong:
    title: レイラがミスを説明して訂正を求める
    gloss: レイラが言います：私の姓のつづりが間違っています。訂正していただけますか？
    note: レッスン2の2つの文を、続けて言っています。
  en.a2.unit36.lesson04.teach.a_do_you_have_passport:
    title: 窓口担当者がパスポートについてたずねる
    gloss: 担当者が言います：もちろんです。パスポートはお持ちですか？
    note: '*Do you have ... with you?* は、「今、それを持っていますか？」という意味です。'
  en.a2.unit36.lesson04.teach.q_here_it_is:
    title: レイラがパスポートを差し出す
    gloss: レイラが言います：はい、こちらです。
    note: '*Here it is* は、相手に何かを手渡すときに言います。'
  en.a2.unit36.lesson04.teach.a_copy_and_send:
    title: 窓口担当者が手続きの内容を説明する
    gloss: 担当者が言います：ありがとうございます。コピーを取って、訂正を今日送ります。
    note: '*make a copy* は決まった言い方で、「コピーを取る」という意味です。'
  en.a2.unit36.lesson04.teach.q_how_long:
    title: レイラがどのくらいかかるかをたずねる
    gloss: レイラがたずねます：訂正にはどのくらい時間がかかりますか？
    note: レッスン2と同じ質問です。
  en.a2.unit36.lesson04.teach.a_within_five_working_days:
    title: 窓口担当者の答え
    gloss: 担当者が言います：5営業日以内です。
    note: '*within* は期限以内という意味なので、最長で5営業日かかるということです。'
  en.a2.unit36.lesson04.teach.q_thank_you:
    title: レイラが窓口担当者にお礼を言う
    gloss: レイラが言います：どうもありがとうございます。
    note: '*very much* を付けると、感謝の気持ちが強くなります。'
