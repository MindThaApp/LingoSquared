teaching:
  en.b1.unit11.lesson01.teach.would:
    title: would
    gloss: 〜するだろう
    note: '*would* + 動詞の原形で、想像した結果や、丁寧な希望を表します。'
    example_gloss: もっと時間があれば、参加するのに。
  en.b1.unit11.lesson01.teach.would_rather:
    title: would rather
    gloss: むしろ〜したい
    note: '*would rather* は、別の選択肢よりもこちらをしたい、という意味です。'
    example_gloss: 週末のクラスのほうに出たいです。
  en.b1.unit11.lesson01.teach.if_i_were:
    title: if I were
    gloss: もし私が〜なら
    note: '*if I were* は、自分についての現実とは違う状況を切り出す表現です。'
    example_gloss: 今夜空いていたら、行くのに。
  en.b1.unit11.lesson01.teach.opportunity:
    title: opportunity
    gloss: 機会、チャンス
    note: '*opportunity* は、何かをするのによい機会という意味です。'
    example_gloss: このコースはレイラにとってよい機会です。
  en.b1.unit11.lesson01.teach.regret:
    title: regret
    gloss: 後悔
    note: '*regret* は、過去の決断についての後悔や悔やむ気持ちを表します。'
    example_gloss: 彼女には一つ後悔があります。もっと早くお金を貯め始めなかったことです。
  en.b1.unit11.lesson01.teach.take_a_chance:
    title: take a chance
    gloss: 思い切ってやってみる
    note: '*take a chance* は、成功するかわからなくても試してみる、という意味です。'
    example_gloss: コースがもっと安ければ、彼女は思い切って挑戦するでしょう。
  en.b1.unit11.lesson02.teach.more_time_course:
    title: 現在の非現実的な状況
    gloss: もっと時間があれば、デザインのコースを受講するのに。
    note: 現実とは違う「今」の状況を表すとき、*if* の後ろは過去形になります：*If I had more time*。日本語の「もし時間があったら」に近い言い方ですが、英語では動詞そのものを過去形にして表します。
  en.b1.unit11.lesson02.teach.cheaper_sign_up:
    title: if it were cheaper
    gloss: もっと安ければ、今日申し込むのに。
    note: 現実とは違う条件では、主語が *it* でも *were* を使うと自然に聞こえます。
  en.b1.unit11.lesson02.teach.grammar_unreal_present:
    title: 現在の非現実的な条件
    gloss: もっと安ければ、申し込むのに。
    note: 形：*if* + 過去形、そのあとに *would* + 動詞の原形。
  en.b1.unit11.lesson03.teach.sooner:
    title: sooner
    gloss: もっと早く
    note: '*sooner* は、実際にそうなった時点よりも早く、という意味です。'
    example_gloss: もっと早く知っていれば、彼女はもっとお金を貯めていたでしょう。
  en.b1.unit11.lesson03.teach.confident:
    title: confident
    gloss: 自信がある
    note: '*confident* は、自分はうまくできると感じている、という意味です。'
    example_gloss: ダニエルが参加すれば、レイラはもっと自信が持てるでしょう。
  en.b1.unit11.lesson03.teach.reading_passage:
    title: 読み物：逃したチャンス
    gloss: レイラは、ぜひ受けたいデザインのコースを見つけました。役に立ちそうですが、高額です。もっと安ければ、今日申し込むでしょう。ダニエルも同じクラスに参加してくれれば、もっと自信が持てます。唯一の後悔はタイミングです。そのコースをもっと早く知っていれば、もっとお金を貯めていたでしょう。
    note: 現実とは違う現在と過去の仮定が出てくる短い読み物です。
  en.b1.unit11.lesson04.teach.q_take_if_cheaper:
    title: ミアが仮定の質問をする
    gloss: ミア：レイラ、デザインのコースがもっと安ければ受講しますか？
    note: '*would* を使った、丁寧で仮定的な質問です。'
  en.b1.unit11.lesson04.teach.a_sign_up_today:
    title: レイラが発表した結果を伝える
    gloss: レイラ：もちろんです。もっと安ければ、今日申し込みます。
    note: '*If it were cheaper, I would...* は、状況が違えば彼女がすることを表しています。'
  en.b1.unit11.lesson04.teach.q_daniel_joined:
    title: ミアが別の場面を提案する
    gloss: ミア：ダニエルも参加したらどうですか？
    note: '*What if...* は、想像した可能性を持ち出す表現です。'
  en.b1.unit11.lesson04.teach.a_more_confident:
    title: レイラが自分の気持ちを説明する
    gloss: レイラ：ダニエルが参加するなら、もっと自信が持てます。
    note: 想像上の状況なので、*joined* は過去形になっています。
  en.b1.unit11.lesson04.teach.q_would_rather_weekend:
    title: ミアが自分の好みを伝える
    gloss: ミア：私は夜のクラスより週末のクラスのほうに出たいです。
    note: '*would rather ... than ...* は、二つの好みを比べる表現です。'
  en.b1.unit11.lesson04.teach.a_known_sooner:
    title: レイラが過去の後悔について話す
    gloss: レイラ：私もです。もっと早く知っていれば、もっとお金を貯めていたのに。
    note: '*if + past perfect, would have + past participle* は、現実とは違う過去の状況を表します。'
