teaching:
  en.a1.unit44.lesson01.teach.spring:
    title: spring
    gloss: 春
    note: '*spring* は「春」という意味です。'
    example_gloss: 春には花が咲きます。
  en.a1.unit44.lesson01.teach.summer:
    title: summer
    gloss: 夏
    note: '*summer* は「夏」という意味です。'
    example_gloss: 私は夏に海へ行きます。
  en.a1.unit44.lesson01.teach.fall:
    title: fall
    gloss: 秋
    note: '*fall* は「秋」という意味で、アメリカ英語の言い方です。イギリス英語では *autumn* と言います。'
    example_gloss: 秋には葉の色が変わります。
  en.a1.unit44.lesson01.teach.winter:
    title: winter
    gloss: 冬
    note: '*winter* は「冬」という意味です。'
    example_gloss: 冬には雪が降ります。
  en.a1.unit44.lesson01.teach.season:
    title: season
    gloss: 季節
    note: '*season* は「季節」という意味です。'
    example_gloss: 好きな季節は何ですか。
  en.a1.unit44.lesson02.teach.in_the_summer:
    title: in the summer
    gloss: 夏に
    note: '*in the summer* は「夏に」という意味です。日本語では冠詞がありませんが、英語では季節の前の *the* を省くこともでき、*in summer* と *in the summer* のどちらも正しい言い方です。*in spring*、*in fall*、*in winter* も同じです。'
    example_gloss: 私たちは夏に海へ行きます。
  en.a1.unit44.lesson02.teach.leaves_change_color:
    title: the leaves change color
    gloss: 葉の色が変わる
    note: '*the leaves change color* は「葉の色が変わる」という意味です。'
    example_gloss: 秋には、葉の色が変わります。
  en.a1.unit44.lesson02.teach.it_snows_a_lot:
    title: it snows a lot
    gloss: 雪がたくさん降る
    note: '*it snows a lot* は「雪がたくさん降る」という意味です。'
    example_gloss: 冬には雪がたくさん降ります。
  en.a1.unit44.lesson02.teach.flowers_bloom:
    title: flowers bloom
    gloss: 花が咲く
    note: '*flowers bloom* は「花が咲く」という意味です。'
    example_gloss: 春には花が咲きます。
  en.a1.unit44.lesson02.teach.whats_your_favorite_season:
    title: What's your favorite season?
    gloss: 好きな季節は何ですか。
    note: '*What''s your favorite season?* は、その人の好きな季節をたずねる表現です。'
  en.a1.unit44.lesson02.teach.my_favorite_season_is:
    title: My favorite season is fall.
    gloss: 私の好きな季節は秋です。
    note: '*My favorite season is ...* は、好みを言うときの決まった言い方です。'
  en.a1.unit44.lesson03.teach.dialogue_line1:
    title: ミアの質問
    gloss: ミア：レイラは、どの季節がいちばん好き？
    note: '*What''s your favorite ...?* は、その人の好みをたずねる表現です。'
  en.a1.unit44.lesson03.teach.dialogue_line2:
    title: "レイラの答え"
    gloss: レイラ：秋ね。葉の色が変わるし、外で絵を描くのにぴったりの天気なの。
    note: '*great weather for painting outside* は「外で絵を描くのにぴったりの天気」という意味です。'
  en.a1.unit44.lesson03.teach.dialogue_line3:
    title: ミアの返事
    gloss: ミア：いいね。私の好きな季節は春だよ。
    note: '*My favorite season is spring* は「私の好きな季節は春です」という意味です。'
  en.a1.unit44.lesson03.teach.dialogue_line4:
    title: レイラの質問
    gloss: レイラ：どうして春なの？
    note: '*Why spring?* は、理由をたずねる短い言い方です。'
  en.a1.unit44.lesson03.teach.dialogue_line5:
    title: "ミアの答え"
    gloss: ミア：花が咲くし、写真の授業のために花の写真を撮るのが大好きなの。
    note: '*I love taking photos* は「写真を撮るのが大好きです」という意味です。'
  en.a1.unit44.lesson03.teach.dialogue_line6:
    title: レイラの質問
    gloss: レイラ：なるほどね！あなたの住んでいるところは、春は暖かい？それとも寒い？
    note: '*That makes sense!* は、よい説明を聞いたときの自然な返事です。'
  en.a1.unit44.lesson03.teach.dialogue_line7:
    title: "ミアの答え"
    gloss: ミア：たいてい暖かくて、雨が少し降るくらい。外を歩くのにぴったりよ。
    note: '*with a little rain* は「雨が少し降って」という意味です。'
  en.a1.unit44.lesson04.teach.reading_passage:
    title: 3つの好きな季節についての文章
    gloss: ダニエル、レイラ、ミアは、それぞれ好きな季節がちがいます。ダニエルの好きな季節は夏です。暖かくて晴れた日に、サッカーをしたり走ったりするのが大好きです。レイラの好きな季節は秋で、色が変わっていく葉を描くのが大好きだからです。ミアの好きな季節は春です。写真の授業のために、花の写真を撮ります。好きな季節はみんなちがいますが、3人はいつも時間を見つけて、いっしょに外を楽しんでいます。
    note: '*even though* は「〜だけれども」という意味です。'
