teaching:
  en.a1.unit64.lesson01.teach.nice:
    title: nice
    gloss: すてきな・いい・親切な
    note: '*nice* は、状況によって「すてきな」「いい」「親切な」などの意味になります。'
    example_gloss: それはいいですね。
  en.a1.unit64.lesson01.teach.great:
    title: great
    gloss: すばらしい
    note: '*great* は *nice* より強い言葉で、「すばらしい」という意味です。'
    example_gloss: とてもすてきに見えますよ。
  en.a1.unit64.lesson01.teach.lovely:
    title: lovely
    gloss: とてもすてきな・かわいらしい
    note: '*lovely* は、温かくて親しみのある響きの言葉です。'
    example_gloss: なんてすてきな笑顔でしょう。
  en.a1.unit64.lesson01.teach.kind:
    title: kind
    gloss: 親切な
    note: '*kind* は、人に優しくて親切だという意味です。'
    example_gloss: それはとても親切ですね。
  en.a1.unit64.lesson01.teach.smile:
    title: smile
    gloss: 笑顔
    note: '*smile* は「笑顔」という意味です。'
    example_gloss: なんてすてきな笑顔でしょう。
  en.a1.unit64.lesson01.teach.jacket:
    title: jacket
    gloss: ジャケット・上着
    note: '*jacket* は「ジャケット」や「上着」という意味です。'
    example_gloss: あなたのジャケットが好きです。
  en.a1.unit64.lesson02.teach.that_is_nice:
    title: That is nice.
    gloss: それはいいですね。
    note: '*That is nice* は、前向きな気持ちを伝える短い返事です。'
  en.a1.unit64.lesson02.teach.you_look_great:
    title: You look great.
    gloss: とてもすてきに見えますよ。
    note: '*look* は、ここでは「見える」という意味で、「見る」ではありません。'
  en.a1.unit64.lesson02.teach.like_your_jacket:
    title: I like your jacket.
    gloss: あなたのジャケットが好きです。
    note: '*I like your...* は、相手の持ち物をほめるときの普通の言い方です。'
  en.a1.unit64.lesson02.teach.lovely_smile:
    title: What a lovely smile.
    gloss: なんてすてきな笑顔でしょう。
    note: '*What a...* は、ほめ言葉を感嘆の形で言うときに使います。'
  en.a1.unit64.lesson02.teach.very_kind:
    title: That is very kind.
    gloss: それはとても親切ですね。
    note: '*very* は *kind* の意味を強めます。'
  en.a1.unit64.lesson02.teach.thank_you_much:
    title: Thank you very much.
    gloss: 本当にありがとうございます。
    note: '*Thank you very much* は、丁寧で温かいお礼の言い方です。'
  en.a1.unit64.lesson03.teach.dialogue_line1:
    title: "ミアが褒める"
    gloss: ミアは「こんにちは、レイラ。今日はとてもすてきね」と言います。
    note: '*You look great* は、ストレートなほめ言葉です。'
  en.a1.unit64.lesson03.teach.dialogue_line2:
    title: レイラがミアにお礼を言います
    gloss: レイラは「ありがとう、ミア」と言います。
    note: '*Thank you* は「ありがとう」という意味です。'
  en.a1.unit64.lesson03.teach.dialogue_line3:
    title: ミアが緑のジャケットをほめます
    gloss: ミアは「その緑のジャケット、いいわね」と言います。
    note: '*I like your green jacket* は、服をほめる文です。'
  en.a1.unit64.lesson03.teach.dialogue_line4:
    title: レイラが優しく答えます
    gloss: レイラは「ありがとう、うれしい」と言います。
    note: '*That is very kind* は、相手が言ってくれた優しい言葉に対する返事です。'
  en.a1.unit64.lesson03.teach.dialogue_line5:
    title: ミアが笑顔をほめます
    gloss: ミアは「あなたの笑顔もすてきよ！見て、これは私の写真」と言います。
    note: '*too* は、ここでは「も」という意味です。'
  en.a1.unit64.lesson03.teach.dialogue_line6:
    title: レイラが写真をほめます
    gloss: レイラは「本当にありがとう。あなたの写真、すてきね」と言います。
    note: '*Your photo is nice* は、ほめ言葉のお返しです。'
  en.a1.unit64.lesson03.teach.dialogue_line7:
    title: ミアが写真について説明します
    gloss: ミアは「ありがとう。これはダニエルへの写真なの」と言います。
    note: '*Thanks* は *thank you* より短い言い方です。'
  en.a1.unit64.lesson04.teach.message:
    title: 親切なメッセージ
    gloss: 親切なメッセージ：あなたの緑のジャケットはとてもすてきです。あなたの写真はいいですね。親切にしてくれてありがとう。
    note: このメッセージには、2つのほめ言葉とお礼が入っています。
  en.a1.unit64.lesson04.teach.reading_passage:
    title: 本文：友だちへのほめ言葉
    gloss: 友だちへのほめ言葉：ミアは、緑のジャケットを着たレイラを見かけました。ミアは、レイラはとてもすてきだと言いました。また、レイラの笑顔はすてきだとも言いました。レイラはミアにお礼を言いました。そのあと、レイラはミアの写真を見て、いい写真だと言いました。その写真はダニエルのためのものだったので、ミアはうれしく思いました。あとで、レイラは短いメッセージを書きました。「あなたの緑のジャケットはとてもすてきです。」
    note: '*looked great* は *look great* の過去形です。'
