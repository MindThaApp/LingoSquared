teaching:
  en.a1.unit15.lesson01.teach.cash:
    title: Cash
    gloss: 現金
    note: '*cash* は現金(紙幣と硬貨)のことです。英語では数えられない名詞なので、*some cash* とは言いますが、*a cash* とは言いません。'
    example_gloss: 私は現金を少し持っています。
  en.a1.unit15.lesson01.teach.card:
    title: Card
    gloss: カード
    note: '*card* は、プラスチック製の支払い用カード全般をさす一般的な言葉です。'
    example_gloss: 私のカードは青色です。
  en.a1.unit15.lesson01.teach.credit_card:
    title: Credit card
    gloss: クレジットカード
    note: '*credit card* は、お金を借りて後から返すカードです。日本語の「クレジットカード」とほぼ同じ意味で使えます。'
  en.a1.unit15.lesson01.teach.debit_card:
    title: Debit card
    gloss: デビットカード
    note: '*debit card* は、支払うとすぐに口座からお金が引き落とされるカードです。日本のキャッシュカード兼用のデビットカードがこれにあたります。'
  en.a1.unit15.lesson01.teach.total:
    title: Total
    gloss: 合計金額
    note: '*total* は、支払わなければならない金額の合計のことです。'
    example_gloss: 合計はいくらですか。
  en.a1.unit15.lesson02.teach.do_you_take_cards:
    title: Do you take credit cards?
    gloss: クレジットカードは使えますか。
    note: '*Do you take credit cards?* は、支払いの前によく使う質問です。ここでの *take* は「受け付ける」という意味です。'
  en.a1.unit15.lesson02.teach.cash_only:
    title: Sorry, cash only.
    gloss: すみません、現金のみです。
    note: '*Sorry, cash only.* は、カードを使えない店でよく返ってくる答えです。'
  en.a1.unit15.lesson02.teach.ill_pay_by_card:
    title: Yes, I'll pay by card.
    gloss: はい、カードで払います。
    note: '*Yes, I''ll pay by card.* は、支払い方法を最終的に決める言い方です。*by* のあとの *card* には冠詞(*a*, *the*)をつけません。'
  en.a1.unit15.lesson03.teach.tax:
    title: Tax
    gloss: 税金
    note: '*tax* は税金のことです。アメリカのほとんどの店では、値札には税が含まれておらず、レジで価格に加算されます(日本の税込表示とは違います)。'
    example_gloss: 税金は1ドルです。
  en.a1.unit15.lesson03.teach.receipt_text:
    title: レシートの文面
    gloss: コーヒー:3ドル。サンドイッチ:6ドル。税金:1ドル。合計:10ドル。
    note: これは実際のレシートです。
  en.a1.unit15.lesson03.teach.total_summary_sentence:
    title: The total is $10.
    gloss: 合計は10ドルです。
    note: この文は、レシートの合計金額を完全な文でまとめたものです。
  en.a1.unit15.lesson04.teach.q_total:
    title: 合計をたずねる
    gloss: レイラが合計はいくらかたずねています
    note: '*How much is the total?* は、最終的な金額をたずねるときの決まった言い方です。*the total* は合計というひとつの金額なので、*is* を使います。'
  en.a1.unit15.lesson04.teach.a_fifteen:
    title: 合計への答え
    gloss: 店員が「15ドルです」と言っています
    note: '*It''s fifteen dollars.* は、合計をたずねられたときの完全な答えです。'
  en.a1.unit15.lesson04.teach.q_cards:
    title: カードが使えるかたずねる
    gloss: レイラがクレジットカードが使えるかたずねています
    note: 先ほどと同じ質問です。
  en.a1.unit15.lesson04.teach.a_yes_we_do:
    title: カードについての答え
    gloss: 店員が「はい、使えます」と言っています
    note: '*Yes, we do.* は、完全な短い答えです。英語では「はい」だけで終わらせず、助動詞 *do* をくり返します。'
  en.a1.unit15.lesson04.teach.closing_pay_by_card:
    title: 支払い方法を決める
    gloss: レイラが「よかった、カードで払います」と言っています
    note: この文は、支払い方法を決めて会話を締めくくります。
