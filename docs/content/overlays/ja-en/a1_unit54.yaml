teaching:
  en.a1.unit54.lesson01.teach.laundromat:
    title: laundromat
    gloss: コインランドリー
    note: '*laundromat* は「コインランドリー」という意味です。お金を払って洗濯機を使える場所です。'
    example_gloss: 今日はコインランドリーに行きます。
  en.a1.unit54.lesson01.teach.washing_machine:
    title: washing machine
    gloss: 洗濯機
    note: '*washing machine* は「洗濯機」という意味です。'
    example_gloss: 洗濯機が壊れています。
  en.a1.unit54.lesson01.teach.dryer:
    title: dryer
    gloss: 乾燥機
    note: '*dryer* は「乾燥機」という意味です。'
    example_gloss: 服を乾燥機に入れてください。
  en.a1.unit54.lesson01.teach.quarters:
    title: quarters
    gloss: 25セント硬貨（アメリカの硬貨）
    note: '*quarters* は、アメリカの25セント硬貨のことです。コインランドリーの洗濯機でよく必要になります。日本の硬貨にぴったり同じものはないので、英語の *quarters* のまま覚えましょう。'
    example_gloss: この機械では25セント硬貨が使えます。
  en.a1.unit54.lesson01.teach.detergent:
    title: detergent
    gloss: 洗剤
    note: '*detergent* は「洗剤」という意味です。'
    example_gloss: 服をきれいにするには洗剤が必要です。
  en.a1.unit54.lesson01.teach.load:
    title: load
    gloss: 1回分の洗濯物
    note: ここでの *load* は「1回分の洗濯物」という意味で、一度に洗う洗濯物の量です。
    example_gloss: 洗濯物がたくさんあります。
  en.a1.unit54.lesson02.teach.id_like_to_wash_a_few_things:
    title: I'd like to wash a few things, please.
    gloss: 少し洗濯をしたいのですが。
    note: '*I''d like to*（*I would like to* の短い形）は、丁寧に頼む言い方です。'
  en.a1.unit54.lesson02.teach.do_you_have_change:
    title: Do you have change for the machines?
    gloss: 機械用の小銭はありますか。
    note: ここでの *change* は「小銭」という意味で、「変化」ではありません。
  en.a1.unit54.lesson02.teach.how_long_does_the_cycle_take:
    title: How long does the wash cycle take?
    gloss: 洗濯にはどのくらい時間がかかりますか。
    note: ここでの *take* は「（時間が）かかる」という意味です。*the machines take quarters* の *take* は「（お金として）受け付ける」という意味なので、同じ単語でも使い方が違います。日本語の「かかる」にあたる動詞と考えると覚えやすいでしょう。
  en.a1.unit54.lesson02.teach.its_three_dollars_for_one_load:
    title: It's three dollars for one load.
    gloss: 1回3ドルです。
    note: '*for one load* は「1回分で」という意味です。'
  en.a1.unit54.lesson02.teach.what_time_do_you_close:
    title: What time do you close?
    gloss: 何時に閉まりますか。
    note: '*do you close* では、疑問文を作るために助動詞 *do* を使います。'
  en.a1.unit54.lesson02.teach.please_pick_up_by_nine:
    title: Please pick up your laundry by nine o'clock.
    gloss: 9時までに洗濯物を取りに来てください。
    note: '*pick up* は「取りに来る、受け取る」という意味です。*by nine o''clock* は「9時までに」（その時刻が期限）という意味です。'
  en.a1.unit54.lesson03.teach.dialogue_line1:
    title: 店員のあいさつ
    gloss: 店員：こんにちは！洗濯機を使いますか。
    note: '*Do you need...?* でも、疑問文を作るために助動詞 *do* を使います。'
  en.a1.unit54.lesson03.teach.dialogue_line2:
    title: レイラの理由
    gloss: レイラ：はい、お願いします。家の洗濯機が壊れているんです。
    note: '*at home* は「家で」という意味です。'
  en.a1.unit54.lesson03.teach.dialogue_line3:
    title: ダニエルの依頼
    gloss: ダニエル：私も少し洗濯物があります。機械を使ってもいいですか。
    note: ここでの *too* は「も」という意味で、文の最後に置きます。*as well* も同じ意味で、2番目の文で使われています。
  en.a1.unit54.lesson03.teach.dialogue_line4:
    title: 店員が硬貨について話す
    gloss: 店員：もちろんです！機械では25セント硬貨が使えます。
    note: ここでの *take* は「（支払いとして）受け付ける」という意味です。このあと出てくる *The wash cycle takes thirty minutes* の *take* は「（時間が）かかる」という意味なので、違いに注意しましょう。
  en.a1.unit54.lesson03.teach.dialogue_line5:
    title: レイラは硬貨を持っている
    gloss: レイラ：はい、25セント硬貨を持っています。
    note: 短い確認の返事で、新しい情報ではありません。
  en.a1.unit54.lesson03.teach.dialogue_line6:
    title: 洗濯にかかる時間
    gloss: 店員：洗濯は30分かかります。
    note: ここでの *take* は「（時間が）かかる」という意味です。上の *take quarters* の *take* とは意味が違います。
  en.a1.unit54.lesson03.teach.dialogue_line7:
    title: ダニエルが料金をたずねる
    gloss: ダニエル：それで、いくらですか。
    note: '*How much does it cost?* でも、疑問文を作るために助動詞 *does* を使います。'
  en.a1.unit54.lesson03.teach.dialogue_line8:
    title: 料金
    gloss: 店員：1回3ドルです。
    note: これは、硬貨の数や時間とは別の情報です。
  en.a1.unit54.lesson03.teach.dialogue_line9:
    title: 閉店時間
    gloss: 店員：コインランドリーは9時に閉まりますので、それまでに洗濯物を取りに来てください。
    note: ここでの *so* は「だから」という意味で、閉店時間と、それまでに取りに来るという指示をつないでいます。
  en.a1.unit54.lesson04.teach.reading_passage:
    title: コインランドリーに行く話の文章
    gloss: ある日の午後、レイラの家の洗濯機が壊れました。彼女は、通りの先にあるコインランドリーに行くことにしました。ダニエルも少し洗濯物があったので、いっしょに行きました。コインランドリーで、店員は、機械では25セント硬貨が使えること、洗濯は30分かかることを説明しました。1回の料金は3ドルでした。服を洗っている間、ダニエルとレイラは話をしながら、隣のカフェでコーヒーを飲みました。コインランドリーは9時に閉まるので、二人はそれまでに洗濯物を取りに行くようにしました。レイラは、ダニエルが付き合ってくれたことに感謝し、家の洗濯機はおそらく週末までには直るだろうと言いました。
    note: '*would be fixed* は「直るだろう」という意味です。レイラは機械が直ると思っていますが、まだ確実ではありません。'
