teaching:
  en.b1.unit09.lesson01.teach.said_that:
    title: said that
    gloss: 〜と言った
    note: '*said that* は、ほかの人が言ったことを伝えるときに使います。'
    example_gloss: 彼女は、忙しいと言いました。
  en.b1.unit09.lesson01.teach.told_me_that:
    title: told me that
    gloss: 私に〜と言った
    note: '*told me that* は、誰かが自分に情報を伝えてくれたときに使います。'
    example_gloss: 彼は私に、会議は中止になったと言いました。
  en.b1.unit09.lesson01.teach.asked_whether:
    title: asked whether
    gloss: 〜かどうか尋ねた
    note: '*asked whether* は、はい・いいえで答える質問を伝える表現で、*asked if* より少しあらたまった響きがあります。'
    example_gloss: ミアは、私たちが助けを必要としているかどうか尋ねました。
  en.b1.unit09.lesson01.teach.asked_if:
    title: asked if
    gloss: 〜かと聞いた
    note: '*asked if* は、はい・いいえで答える質問を、日常会話で伝える表現です。'
    example_gloss: ミアは、私たちが助けを必要としているかと聞きました。
  en.b1.unit09.lesson01.teach.message:
    title: message
    gloss: メッセージ
    note: '*message* は、短い文章や音声で伝える連絡のことです。'
    example_gloss: レイラは、昼食のあとにメッセージを送りました。
  en.b1.unit09.lesson01.teach.confirm:
    title: confirm
    gloss: 確認する
    note: '*confirm* は、あることが確かである、または正しいと伝えることを表します。'
    example_gloss: 出発する前に、時間を確認してください。
  en.b1.unit09.lesson01.teach.available:
    title: available
    gloss: 都合がつく、空いている
    note: '*available* は、空いていて、会うことができる状態を表します。'
    example_gloss: ミアは、昼食のあと時間があります。
  en.b1.unit09.lesson02.teach.mia_available:
    title: 発言を伝える
    gloss: ミアは、昼食のあと時間があると言いました。
    note: 英語の間接話法では、*is* が *was* になることがよくあります:*Mia said that she was available*。日本語では「時間がある」と現在形のままで言えますが、英語では動詞を過去形に合わせます。
  en.b1.unit09.lesson02.teach.leila_told_me:
    title: 情報をあなたに伝える
    gloss: レイラは私に、事務所は忙しかったと言いました。
    note: '*told me that* は、誰かがあなたに直接情報を伝えたときに使います。'
  en.b1.unit09.lesson02.teach.grammar_backshift:
    title: 直接話法と間接話法
    gloss: ミアは「私は時間があります」と言います。ミアは、時間があると言いました。
    note: 直接話法:*I am available*。間接話法:*Mia said that she was available*。間接話法では、もとの発言の時制が、一つ過去にずれることがよくあります。
  en.b1.unit09.lesson03.teach.short_summary:
    title: short summary
    gloss: 短い要約
    note: '*short summary* は、いちばん大切な点だけを短くまとめたもののことです。'
    example_gloss: 今日の会議には、短い要約で十分です。
  en.b1.unit09.lesson03.teach.full_report:
    title: full report
    gloss: 完全版の報告書
    note: '*full report* は、要約だけでなく、報告書の全体のことです。'
    example_gloss: ミアは、完全版の報告書が必要かどうか尋ねました。
  en.b1.unit09.lesson03.teach.reading_passage:
    title: 読み物：メッセージのやり取り
    gloss: レイラはミアのメッセージを読んで、ダニエルに電話しました。彼女は、ミアは昼食のあと時間があると言いました。また、ミアは数字を完成させたとも言いました。ミアは、チームが今日、完全版の報告書を必要とするかどうか尋ねました。ダニエルはレイラに、会議はたった15分なので、短い要約で十分だと言いました。
    note: 発言や質問を伝える表現についての、短い読み物です。
  en.b1.unit09.lesson04.teach.q_mia_reply:
    title: ダニエルがミアの答えをたずねる
    gloss: ダニエルは言います。「ミアは、見直しの件で返事をくれた?」
    note: 前のメッセージについての、はい・いいえで答える質問です。
  en.b1.unit09.lesson04.teach.a_she_said_available:
    title: レイラがミアの発言を伝える
    gloss: レイラは言います。「うん、昼食のあとなら時間があるって言ってたよ。」
    note: '*she said that she was available* は、ミアの発言を伝えています。'
  en.b1.unit09.lesson04.teach.q_anything_else:
    title: ダニエルがさらにたずねる
    gloss: ダニエルは言います。「よかった。ほかに何か聞いてきた?」
    note: メッセージにほかの質問があったかどうかを知るための、続けての質問です。
  en.b1.unit09.lesson04.teach.a_asked_if_report:
    title: レイラがミアの質問を伝える
    gloss: レイラは言います。「今日、完全版の報告書が必要かどうか聞いてきたよ。」
    note: '*asked if* は、直接の、はい・いいえで答える質問を、間接話法にします。'
  en.b1.unit09.lesson04.teach.q_what_tell_her:
    title: ダニエルがレイラの答えをたずねる
    gloss: ダニエルは言います。「それで、何て言ったの?」
    note: レイラが伝えた情報についての質問です。
  en.b1.unit09.lesson04.teach.a_short_summary_enough:
    title: レイラが自分の答えを伝える
    gloss: レイラは言います。「短い要約で十分だって伝えたよ。」
    note: '*I told her that...* は、自分がほかの人に伝えた情報を伝える表現です。'
  en.b1.unit09.lesson04.teach.q_tell_team:
    title: ダニエルがメッセージのやり取りを終える
    gloss: ダニエルは言います。「完璧だね。チームには、2時に集まれるって伝えるよ。」
    note: ダニエルは、情報を伝えるのに、ここでも *tell ... that* を使っています。
