teaching:
  en.a1.unit40.lesson01.teach.post_office:
    title: post office
    gloss: 郵便局
    note: '*post office* は「郵便局」という意味です。'
    example_gloss: 私は手紙を出しに郵便局へ行きます。
  en.a1.unit40.lesson01.teach.letter:
    title: letter
    gloss: 手紙
    note: '*letter* は「手紙」という意味です。'
    example_gloss: 私は友だちに手紙を書きます。
  en.a1.unit40.lesson01.teach.package:
    title: package
    gloss: 小包
    note: '*package* は「小包」という意味です。'
    example_gloss: 私は妹に小包を送ります。
  en.a1.unit40.lesson01.teach.stamp:
    title: stamp
    gloss: 切手
    note: '*stamp* は「切手」という意味です。'
    example_gloss: この手紙に貼る切手が必要です。
  en.a1.unit40.lesson01.teach.envelope:
    title: envelope
    gloss: 封筒
    note: '*envelope* は「封筒」という意味です。'
    example_gloss: 私は手紙を封筒に入れます。
  en.a1.unit40.lesson01.teach.mailbox:
    title: mailbox
    gloss: 郵便ポスト
    note: '*mailbox* は「郵便ポスト」という意味です。'
    example_gloss: 郵便ポストは郵便局のとなりにあります。
  en.a1.unit40.lesson02.teach.send_a_letter:
    title: send a letter
    gloss: 手紙を出す
    note: '*send a letter* は「手紙を出す」という意味です。'
    example_gloss: 私は両親に手紙を出したいです。
  en.a1.unit40.lesson02.teach.buy_a_stamp:
    title: buy a stamp
    gloss: 切手を買う
    note: '*buy a stamp* は「切手を買う」という意味です。'
    example_gloss: このはがきに貼る切手を買わなければなりません。
  en.a1.unit40.lesson02.teach.write_the_address:
    title: write the address
    gloss: 住所を書く
    note: '*write the address* は「住所を書く」という意味です。'
    example_gloss: 小包に住所を書いてください。
  en.a1.unit40.lesson02.teach.how_long_will_it_take:
    title: how long will it take
    gloss: どのくらいかかりますか
    note: '*how long will it take* は「どのくらいかかりますか」という意味です。'
    example_gloss: 着くまでにどのくらいかかりますか。
  en.a1.unit40.lesson02.teach.express_mail:
    title: express mail
    gloss: 速達
    note: '*express mail* は「速達」という意味で、ふつうの郵便より早く届きますが、料金は高くなります。'
    example_gloss: 速達は、ふつうの郵便より早く届きます。
  en.a1.unit40.lesson02.teach.how_much_does_it_cost_question:
    title: How much does it cost to send this?
    gloss: これを送るにはいくらかかりますか。
    note: '*How much does it cost to ...?* は、ある行動にかかる料金をたずねる表現です。'
  en.a1.unit40.lesson03.teach.dialogue_line1:
    title: ダニエルのお願い
    gloss: ダニエル：こんにちは。この小包を送りたいのですが。
    note: '*I''d like to* + 動詞は、丁寧にお願いするときの言い方です。窓口で *I want* と言うと、かなりぶっきらぼうに聞こえます。'
  en.a1.unit40.lesson03.teach.dialogue_line2:
    title: 窓口の人のたずねる言葉
    gloss: 窓口の人：かしこまりました。どちらに送りますか。
    note: '*Where is it going?* は、送り先をたずねる表現です。'
  en.a1.unit40.lesson03.teach.dialogue_line3:
    title: "ダニエルの答え"
    gloss: ダニエル：シカゴです。妹への誕生日プレゼントなんです。
    note: '*It''s a birthday gift for my sister* は「妹への誕生日プレゼントです」という意味です。'
  en.a1.unit40.lesson03.teach.dialogue_line4:
    title: 窓口の人のたずねる言葉
    gloss: 窓口の人：ふつうの郵便と速達、どちらになさいますか。速達ですと2日ほどです。
    note: '*regular or express mail* は「ふつうの郵便か速達か」という意味です。'
  en.a1.unit40.lesson03.teach.dialogue_line5:
    title: ダニエルの選択
    gloss: ダニエル：速達でお願いします。おいくらですか。
    note: '*I''ll take ...* は、お店やサービスの窓口で選ぶときの自然な言い方です。'
  en.a1.unit40.lesson03.teach.dialogue_line6:
    title: 窓口の人の答え
    gloss: 窓口の人：12ドルです。こちらがレシートです。
    note: '*Here''s your receipt* は「こちらがレシートです」という意味です。'
  en.a1.unit40.lesson03.teach.dialogue_line7:
    title: ダニエルのお礼
    gloss: ダニエル：ありがとうございます。よい一日を。
    note: '*Have a good day* は、別れるときの丁寧なあいさつです。'
  en.a1.unit40.lesson04.teach.reading_passage:
    title: 郵便局に行った3人についての文章
    gloss: ダニエル、レイラ、ミアの3人とも、郵便局の使い方をよく知っています。先週、ダニエルはシカゴにいる妹に誕生日の小包を送りました。早く届いてほしかったので速達にして、わずか2日で着きました。レイラはミアの近くに引っ越す準備をしているので、古い本を両親に送りに郵便局へ行きました。窓口の人は小包の重さをはかって、切手を渡してくれました。レイラが届くまでにどのくらいかかるかたずねると、ふつうの郵便を選んだので1週間ほどだと言われました。ミアはあまり小包を送りませんが、祖母に書く手紙には必ず切手を買います。切手を貼った手紙のほうが、メッセージより気持ちが伝わる気がするそうです。
    note: '*getting ready to move* は「引っ越しの準備をしている」という意味です。'
