teaching:
  en.a1.unit36.lesson01.teach.class:
    title: class
    gloss: 授業
    note: '*class* は「授業」という意味です（何かを学ぶために集まる時間のことです）。'
    example_gloss: 私は毎週火曜日の夜に授業があります。
  en.a1.unit36.lesson01.teach.course:
    title: course
    gloss: 講座
    note: '*course* は「講座」という意味です（一つのテーマについての一連の授業のことです）。'
    example_gloss: 彼は今年、コンピューターの講座を受けています。
  en.a1.unit36.lesson01.teach.student:
    title: student
    gloss: 学生
    note: '*student* は「学生」という意味で、学校や授業で学んでいる人のことです。'
    example_gloss: 彼女はコミュニティカレッジの学生です。
  en.a1.unit36.lesson01.teach.homework:
    title: homework
    gloss: 宿題
    note: '*homework* は「宿題」という意味です。'
    example_gloss: 私は夕食のあとで宿題をします。
  en.a1.unit36.lesson01.teach.subject:
    title: subject
    gloss: 科目
    note: '*subject* は「科目」という意味です（学んでいる分野のことです）。'
    example_gloss: 数学は私のいちばん好きな科目です。
  en.a1.unit36.lesson01.teach.test:
    title: test
    gloss: テスト
    note: '*test* は「テスト」という意味です。'
    example_gloss: 金曜日にテストがあります。
  en.a1.unit36.lesson02.teach.take_a_class:
    title: take a class
    gloss: 授業を受ける
    note: '*take a class* は「授業を受ける」という意味の決まった言い方です。日本語の「受ける」を *receive* などと直訳せず、いつも *take* を使います。'
    example_gloss: 私は毎週火曜日の夜に授業を受けています。
  en.a1.unit36.lesson02.teach.do_homework:
    title: do homework
    gloss: 宿題をする
    note: '*do homework*：動詞は *do* で、*make* ではありません。日本語の「宿題をする」「宿題をやる」にあたる言い方です。'
    example_gloss: 彼は夕食のあとで宿題をします。
  en.a1.unit36.lesson02.teach.study_for_a_test:
    title: study for a test
    gloss: テスト勉強をする
    note: '*study for a test* は「テスト勉強をする」という意味です。ここでの *for* は、何のために勉強するか（目的）を表します。'
    example_gloss: 私は毎週金曜日にテスト勉強をしています。
  en.a1.unit36.lesson02.teach.community_college:
    title: community college
    gloss: コミュニティカレッジ（地域の成人向けの学校）
    note: '*community college* は、おもにアメリカで、大人が仕事のかたわら講座を受ける学校のことです。日本語に決まった訳語がないので、「コミュニティカレッジ」とそのまま言うことが多いです。'
    example_gloss: 彼女はコミュニティカレッジで勉強しています。
  en.a1.unit36.lesson02.teach.in_the_evening:
    title: in the evening
    gloss: 夜に
    note: '*in the evening* は「夕方・夜に」という意味です。'
    example_gloss: 私の授業は夜にあります。
  en.a1.unit36.lesson02.teach.what_are_you_studying_question:
    title: What are you studying?
    gloss: 何を勉強していますか。
    note: この疑問文は、今の生活の中で取り組んでいることについて、現在進行形（*are you studying*）を使っています。日本語の「勉強しています」にあたる形で、ふつうの現在形ではありません。
  en.a1.unit36.lesson03.teach.dialogue_line1:
    title: ダニエルの質問
    gloss: ダニエルは「今日、仕事のあとに何か予定はありますか」とたずねています。
    note: '*anything* は、ここでは「何か」という意味で、疑問文の中で使います。'
  en.a1.unit36.lesson03.teach.dialogue_line2:
    title: "ミアの答え"
    gloss: ミアは「はい、今夜は写真の授業があります」と言っています。
    note: '*tonight* は「今夜」という意味です。'
  en.a1.unit36.lesson03.teach.dialogue_line3:
    title: ダニエルの返事
    gloss: ダニエルは「いいですね！ どこで受けているんですか」と言っています。
    note: '*Where do you take it?*：授業や講座を受けるときは、*take a class* と同じように *take* を使います。'
  en.a1.unit36.lesson03.teach.dialogue_line4:
    title: "ミアの答え"
    gloss: ミアは「市の中心部にあるコミュニティカレッジです。週に2回あります」と言っています。
    note: '*twice a week*：ここでも *a* は「〜につき」を表します。'
  en.a1.unit36.lesson03.teach.dialogue_line5:
    title: ダニエルの質問
    gloss: ダニエルは「ここまではどうですか」とたずねています。
    note: '*so far* は「ここまでは」という意味です。'
  en.a1.unit36.lesson03.teach.dialogue_line6:
    title: "ミアの答え"
    gloss: ミアは「とても気に入っています。カメラの上手な使い方を学んでいるところです」と言っています。
    note: '*I''m learning how to ...*：今まさに身につけている技能について、現在進行形を使っています。'
  en.a1.unit36.lesson03.teach.dialogue_line7:
    title: ダニエルの最後のひとこと
    gloss: ダニエルは「すばらしいですね！ いつか私にも教えてください」と言っています。
    note: '*sometime* は「いつか」という意味で、未来のはっきりしない時を表します。'
  en.a1.unit36.lesson04.teach.reading_passage:
    title: ダニエル、レイラ、ミアについての文章
    gloss: ダニエル、レイラ、ミアは、みんな仕事のほかに新しいことを学んでいます。ダニエルは、仕事に役立つ新しい技能を身につけるために、月曜の夜にコンピューターの講座を受けています。レイラは、いつかメキシコを旅行したいので、スペイン語を勉強しています。ミアは、コミュニティカレッジで週に2回写真の授業を受けていて、もうずっと上手に写真が撮れるようになっています。三人は、ときどきお昼にいっしょに授業の話をします。
    note: '*takes a computer course*：「受ける」にあたる動詞は *take* です。*take a class* と同じ使い方です。'
