  en.a1.unit68.lesson03.teach.dialogue_line1:
    title: レイラが傘を頼みます
    gloss: レイラは「こんにちは、ミア。あなたの傘を借りてもいい？」と言います。
    note: '*Can I borrow your umbrella?* がお願いの文です。'
  en.a1.unit68.lesson03.teach.dialogue_line2:
    title: ミアが傘を貸します
    gloss: ミアは「うん、貸してあげられるよ」と言います。
    note: '*lend it to you* は、ミアがそれを貸すという意味です。'
  en.a1.unit68.lesson03.teach.dialogue_line3:
    title: レイラがミアにお礼を言います
    gloss: レイラは「ありがとう。今日は雨が降っているの」と言います。
    note: '*It is raining today* は、傘が必要な理由を説明しています。'
  en.a1.unit68.lesson03.teach.dialogue_line4:
    title: ミアが返すように頼みます
    gloss: ミアは「明日、返してね」と言います。
    note: '*tomorrow* は、傘をいつ返すかを表しています。'
  en.a1.unit68.lesson03.teach.dialogue_line5:
    title: レイラが充電器についてたずねます
    gloss: レイラは「もちろん。充電器は必要？」と言います。
    note: '*Of course* は「もちろん」という意味です。'
  en.a1.unit68.lesson03.teach.dialogue_line6:
    title: ミアが充電器を借りたがっています
    gloss: ミアは「うん、充電器を貸してもらえる？」と言います。
    note: '*Can you lend me...?* は、物を貸してほしいと頼む表現です。'
  en.a1.unit68.lesson03.teach.dialogue_line7:
    title: レイラが貸します
    gloss: レイラは「いいよ。1つ貸してあげられるよ」と言います。
    note: '*one* は、充電器を指しています。'
  en.a1.unit68.lesson04.teach.borrowing_note:
    title: 貸し借りメモ
    gloss: 貸し借りメモ：レイラは今日、ミアの傘を持っています。明日返すこと。ミアはレイラの充電器を持っています。
    note: このメモには、誰がどの物を持っているかと、傘をいつ返すかが書かれています。
  en.a1.unit68.lesson04.teach.reading_passage:
    title: 本文：貸し借りをする友だち
    gloss: 貸し借りをする友だち：雨が降っていたので、レイラはミアに傘を頼みました。ミアは、レイラに貸してあげられると言いました。ミアは、明日返してほしいとレイラに頼みました。そのあと、ミアは充電器が必要になりました。レイラはミアに充電器を1つ貸しました。2人は、何を返すか忘れないように、短いメモを書きました。
    note: '*lent* は *lend* の過去形です。'
  en.a1.unit68.lesson04.teach.borrowed_umbrella:
    title: I borrowed your umbrella.
    gloss: あなたの傘を借りました。
    note: '*borrowed* は *borrow* の過去形です。'
  en.a1.unit68.lesson04.teach.will_return_tomorrow:
    title: I will return it tomorrow.
    gloss: 明日、返します。
    note: '*will* に動詞を続けると、これからすることを表します。'
