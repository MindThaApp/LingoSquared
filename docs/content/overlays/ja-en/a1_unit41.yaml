teaching:
  en.a1.unit41.lesson01.teach.cook:
    title: cook
    gloss: 料理する
    note: '*cook* は「料理する」という意味です。'
    example_gloss: 私は友だちに夕食を作るのが好きです。
  en.a1.unit41.lesson01.teach.recipe:
    title: recipe
    gloss: レシピ
    note: '*recipe* は「レシピ」、つまり料理の作り方という意味です。'
    example_gloss: これは私の祖母のレシピです。
  en.a1.unit41.lesson01.teach.ingredient:
    title: ingredient
    gloss: 材料
    note: '*ingredient* は「材料」という意味です。'
    example_gloss: このレシピでは、玉ねぎが最初の材料です。
  en.a1.unit41.lesson01.teach.chop:
    title: chop
    gloss: 刻む
    note: '*chop* は「刻む」、つまり小さく切るという意味です。ただ「切る」というより、細かくするイメージです。'
    example_gloss: 玉ねぎを刻んでくれますか。
  en.a1.unit41.lesson01.teach.boil:
    title: boil
    gloss: ゆでる／沸かす
    note: '*boil* は、液体をぐらぐらと沸かす、またはそれでゆでるという意味です。'
    example_gloss: パスタ用にお湯を沸かさなければなりません。
  en.a1.unit41.lesson01.teach.taste:
    title: taste
    gloss: 味見する
    note: '*taste* は「味見する」という意味です。'
    example_gloss: ソースを味見して、塩が足りるか教えてくれますか。
  en.a1.unit41.lesson02.teach.make_dinner:
    title: make dinner
    gloss: 夕食を作る
    note: '*make dinner* は「夕食を作る」という意味です。'
    example_gloss: 今夜は夕食を作るつもりです。
  en.a1.unit41.lesson02.teach.follow_a_recipe:
    title: follow a recipe
    gloss: レシピどおりに作る
    note: '*follow a recipe* は「レシピどおりに作る」という意味です。'
    example_gloss: お菓子を焼くときは、いつもレシピどおりに作ります。
  en.a1.unit41.lesson02.teach.chop_the_onions:
    title: chop the onions
    gloss: 玉ねぎを刻む
    note: '*chop the onions* は「玉ねぎを刻む」という意味です。'
    example_gloss: ソース用に玉ねぎを刻んでくれますか。
  en.a1.unit41.lesson02.teach.boil_the_pasta:
    title: boil the pasta
    gloss: パスタをゆでる
    note: '*boil the pasta* は「パスタをゆでる」という意味です。'
    example_gloss: パスタを10分ゆでるのを忘れないでね。
  en.a1.unit41.lesson02.teach.add_some_salt:
    title: add some salt
    gloss: 塩を少し加える
    note: '*add some salt* は「塩を少し加える」という意味です。'
    example_gloss: スープに塩を少し入れてください。
  en.a1.unit41.lesson02.teach.what_are_you_cooking_question:
    title: What are you cooking?
    gloss: 何を作っているの？
    note: '*What are you ...ing?* は、今その人がしていることをたずねる表現です。'
  en.a1.unit41.lesson03.teach.dialogue_line1:
    title: ミアの誘い
    gloss: ミア：今夜はパスタを作るの。料理を手伝ってくれない？
    note: '*Do you want to help me* + 動詞*?* は、手伝いにさそう自然な言い方です。'
  en.a1.unit41.lesson03.teach.dialogue_line2:
    title: ダニエルの返事
    gloss: ダニエル：もちろん！でも、あまり料理は上手じゃないんだ。
    note: 文末の *though* は「でも」「ただ」のように、前の内容と少しだけ対比させるときに使います。
  en.a1.unit41.lesson03.teach.dialogue_line3:
    title: ミアの励まし
    gloss: ミア：大丈夫、教えてあげる。この玉ねぎを刻んでくれる？
    note: '*I''ll show you* は「やって見せてあげる」という意味です。'
  en.a1.unit41.lesson03.teach.dialogue_line4:
    title: ダニエルの質問
    gloss: ダニエル：いいよ。どのくらい細かく刻めばいい？
    note: ここでの *should* は、アドバイスをたずねる言い方です。
  en.a1.unit41.lesson03.teach.dialogue_line5:
    title: ミアの説明
    gloss: ミア：小さく、こんなふうに。じゃあ、パスタをゆでよう。
    note: '*like this* は「こんなふうに」という意味です。'
  en.a1.unit41.lesson03.teach.dialogue_line6:
    title: ダニエルの返事
    gloss: ダニエル：ソースを味見してもいい？おいしい！
    note: '*Can I* + 動詞*?* は、許可を求める言い方です。'
  en.a1.unit41.lesson03.teach.dialogue_line7:
    title: ミアのしめくくり
    gloss: ミア：よかった！夕食はもうすぐできるよ。
    note: '*almost ready* は「もうすぐできる」という意味です。'
  en.a1.unit41.lesson04.teach.reading_passage:
    title: いっしょに料理することについての文章
    gloss: ダニエル、レイラ、ミアは、料理の腕前がそれぞれちがいます。レイラがミアの近くの新しいアパートに引っ越してから、3人の友だちはよくいっしょに夕食を作っています。レイラは料理が上手です。お母さんの古いレシピで、よくパスタを作ります。ミアも料理が大好きで、ダニエルに、指を切らずに玉ねぎを刻むやり方を教えました。ダニエルはまだ料理が得意ではありませんが、上達が早いです。昨夜、ミアはダニエルにパスタ作りを手伝ってほしいとたのみました。ミアがパスタをゆでてソースを作る間に、ダニエルは玉ねぎを刻みました。ダニエルはソースを味見して、おいしいと言いました。夕食ができあがったちょうどそのとき、レイラが到着して、3人はミアの台所でいっしょに食べました。
    note: '*arrived just as dinner was ready* は「夕食ができたちょうどそのときに着いた」という意味です。'
