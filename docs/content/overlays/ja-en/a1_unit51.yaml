    note: '*sore throat* は「のどの痛み」という意味です。'
    example_gloss: のども痛いです。
  en.a1.unit51.lesson02.teach.can_i_help_you:
    title: Can I help you?
    gloss: いらっしゃいませ。何かお探しですか。
    note: '*Can I help you?* は「何かお探しですか。」「ご用件をうかがいます。」という意味です。'
  en.a1.unit51.lesson02.teach.i_have_a_bad_cough_and_a_runny_nose:
    title: I have a bad cough and a runny nose.
    gloss: ひどい咳が出て、鼻水も出ます。
    note: '*a bad cough* は「ひどい咳」という意味です。'
  en.a1.unit51.lesson02.teach.do_you_have_something_for_a_sore_throat:
    title: Do you have something for a sore throat?
    gloss: のどの痛みに効く薬はありますか。
    note: '*something for ...* は「…に効くもの」という意味で、症状に合う薬をたずねるときに使います。'
  en.a1.unit51.lesson02.teach.take_one_tablet_every_four_hours:
    title: Take one tablet every four hours.
    gloss: 4時間おきに1錠飲んでください。
    note: 英語では *every four hours* と言い、「4時間ごとに」という意味になります。日本語の「4時間おきに」と同じ考え方で使えます。
  en.a1.unit51.lesson02.teach.how_much_is_that:
    title: How much is that?
    gloss: いくらですか。
    note: '*How much is that?* は「いくらですか。」という意味です。'
  en.a1.unit51.lesson02.teach.thats_nine_dollars:
    title: That's nine dollars.
    gloss: 9ドルです。
    note: '*That''s nine dollars.* は「9ドルです。」という意味です。'
  en.a1.unit51.lesson03.teach.dialogue_line1:
    title: 薬剤師のあいさつ
    gloss: 薬剤師：こんにちは、何かお探しですか。
    note: '*Hi, can I help you?* は「こんにちは、何かお探しですか。」という意味です。'
  en.a1.unit51.lesson03.teach.dialogue_line2:
    title: レイラの症状
    gloss: レイラ：はい、ひどい咳が出て、鼻水も出ます。
    note: 前に習った文のくり返しです。
  en.a1.unit51.lesson03.teach.dialogue_line3:
    title: 薬剤師がシロップをすすめる
    gloss: 薬剤師：効くと思う咳止めシロップがありますよ。寝る前に飲んでください。
    note: '*before bed* は「寝る前に」という意味です。これは咳止めシロップの飲み方で、錠剤のことではありません。'
  en.a1.unit51.lesson03.teach.dialogue_line4:
    title: ダニエルの質問
    gloss: ダニエル：のどの痛みに効く薬もありますか。
    note: 文末の *too* は「も」という意味です。
  en.a1.unit51.lesson03.teach.dialogue_line5:
    title: 薬剤師が錠剤をすすめる
    gloss: 薬剤師：はい、この錠剤はのどの痛みによく効きます。4時間おきに1錠飲んでください。
    note: これは錠剤の飲み方で、4時間おきに飲みます。シロップは別のタイミング、つまり寝る前に飲みます。
  en.a1.unit51.lesson03.teach.dialogue_line6:
    title: レイラの決断
    gloss: レイラ：よかった、両方いただきます。いくらですか。
    note: '*I''ll take both.* は「両方いただきます。」という意味です。'
  en.a1.unit51.lesson03.teach.dialogue_line7:
    title: 値段
    gloss: 薬剤師：9ドルです。
    note: 前に習った文のくり返しです。
  en.a1.unit51.lesson03.teach.dialogue_line8:
    title: レイラの支払い
    gloss: レイラ：どうぞ。ありがとうございます！
    note: '*Here you go.* は「どうぞ。」という意味で、物を相手に渡すときに使います。'
  en.a1.unit51.lesson04.teach.reading_passage:
    title: 薬局に行く話の文章
    gloss: 薬局に行く：ミアと山に出かけた数日後、レイラは風邪をひきました。ひどい咳が出て、鼻水も出て、のども痛くなりました。ダニエルは、彼女のアパートの近くにある薬局まで付き添いました。薬剤師はレイラの症状を聞いて、咳止めシロップと錠剤をすすめました。薬剤師は、シロップは寝る前に、錠剤は4時間おきに1錠飲むように言いました。レイラは両方で9ドル払いました。帰り道、ダニエルは彼女のためにティッシュを1箱買いました。レイラはその夜に薬を飲み、週末までには咳がずっとよくなりました。
    note: '*by the weekend* は「週末までには」という意味です。'
