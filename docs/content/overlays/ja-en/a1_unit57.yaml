teaching:
  en.a1.unit57.lesson01.teach.cinema:
    title: cinema
    gloss: 映画館
    note: '*cinema* は「映画館」という意味です。'
    example_gloss: この映画館はとても人気があります。
  en.a1.unit57.lesson01.teach.ticket:
    title: ticket
    gloss: チケット
    note: '*ticket* は「チケット」という意味です。'
    example_gloss: チケットを買わなければなりません。
  en.a1.unit57.lesson01.teach.showtime:
    title: showtime
    gloss: 上映時間（映画が始まる時刻）
    note: '*showtime* は「上映時間」、つまり映画が始まる時刻のことです。'
    example_gloss: その映画の上映時間は何時ですか？
  en.a1.unit57.lesson01.teach.seat:
    title: seat
    gloss: 席
    note: '*seat* は「席」や「座席」という意味です。'
    example_gloss: この席は空いていますか？
  en.a1.unit57.lesson01.teach.screen:
    title: screen
    gloss: スクリーン
    note: '*screen* は「スクリーン」という意味です。'
    example_gloss: そのスクリーンはとても大きいです。
  en.a1.unit57.lesson01.teach.popcorn:
    title: popcorn
    gloss: ポップコーン
    note: '*popcorn* は「ポップコーン」という意味です。'
    example_gloss: 私たちはいつも映画館でポップコーンを買います。
  en.a1.unit57.lesson02.teach.what_time_does_the_film_start:
    title: What time does the film start?
    gloss: 映画は何時に始まりますか？
    note: '*does the film start* では、動詞が *start* なので、疑問文を作るために助動詞 *does* を使います。'
  en.a1.unit57.lesson02.teach.two_tickets_for_the_seven_oclock_show:
    title: Two tickets for the seven o'clock show, please.
    gloss: 7時の回のチケットを2枚お願いします。
    note: '*for the seven o''clock show* で、どの回のチケットかを伝えています。'
  en.a1.unit57.lesson02.teach.can_i_have_some_popcorn:
    title: Can I have some popcorn, please?
    gloss: ポップコーンをいただけますか？
    note: '*Can I have...?* は、ものを注文するときによく使う、率直な言い方です。'
  en.a1.unit57.lesson02.teach.how_much_is_that_in_total:
    title: How much is that in total?
    gloss: 合計でいくらですか？
    note: '*in total* は「合計で」という意味で、最終的な金額をたずねるときに使います。'
  en.a1.unit57.lesson02.teach.thats_twenty_dollars:
    title: That's twenty dollars, please.
    gloss: 20ドルです。
    note: '*That''s* のあとに金額を続けると、値段を伝える決まった言い方になります。'
  en.a1.unit57.lesson02.teach.i_really_liked_it:
    title: I really liked it!
    gloss: すごく気に入りました！
    note: 英語では、動詞 *like* の目的語に *it* を置いて言います。日本語では「気に入った」「好きだった」のように言い、文の組み立てが異なります。この文は、単語ごとではなく、ひとまとまりで覚えましょう。
  en.a1.unit57.lesson03.teach.dialogue_line1:
    title: ダニエルが上映時間をたずねます
    gloss: ダニエルは「こんにちは！映画は何時に始まりますか？」と言います。
    note: '*does the film start* では、疑問文を作るために助動詞 *does* を使います。'
  en.a1.unit57.lesson03.teach.dialogue_line2:
    title: 上映時間
    gloss: 受付の人は「次の上映は7時です」と言います。
    note: '*at seven o''clock* のように、時刻の前には前置詞 *at* を使います。日本語では「7時に」と、助詞の「に」を使います。'
  en.a1.unit57.lesson03.teach.dialogue_line3:
    title: ダニエルがチケットを注文します
    gloss: ダニエルは「いいですね。チケットを2枚お願いできますか？」と言います。
    note: ポイントは1つだけです。チケットの枚数（2枚）です。
  en.a1.unit57.lesson03.teach.dialogue_line4:
    title: チケットの値段
    gloss: 受付の人は「もちろんです。16ドルです」と言います。
    note: ポイントは1つだけです。チケット2枚の合計金額です。
  en.a1.unit57.lesson03.teach.dialogue_line5:
    title: レイラがポップコーンを注文します
    gloss: レイラは「ポップコーンをいただけますか？」と言います。
    note: これはお願いの表現で、新しい金額の情報はありません。
  en.a1.unit57.lesson03.teach.dialogue_line6:
    title: ポップコーンの値段
    gloss: 受付の人は「はい。ポップコーンは4ドルです」と言います。
    note: 2つ目のポイントです。チケットとは別の、ポップコーンだけの値段です。
  en.a1.unit57.lesson03.teach.dialogue_line7:
    title: ダニエルが合計をたずねます
    gloss: ダニエルは「合計でいくらですか？」と言います。
    note: '*in total* は、すべての金額を合わせた合計をたずねています。'
  en.a1.unit57.lesson03.teach.dialogue_line8:
    title: 合計金額
    gloss: 受付の人は「20ドルです」と言います。
    note: 3つ目のポイントです。チケットやポップコーン単品の値段とは違う、合計金額です。
  en.a1.unit57.lesson03.teach.dialogue_line9:
    title: レイラが楽しみにしています
    gloss: レイラは「ありがとう！見るのが待ちきれません」と言います。
    note: '*I can''t wait to...* は、わくわくする気持ちを表す決まった言い方です。'
  en.a1.unit57.lesson04.teach.cinema_schedule:
    title: 映画館の上映スケジュール
    gloss: 映画館の上映スケジュール：Star Journey - 7:00、$8。The Great Race - 5:00、$10。Funny Family - 9:00、$6。
    note: このスケジュールには、3本の映画の上映時間と料金が載っています。
  en.a1.unit57.lesson04.teach.reading_passage:
    title: 本文：映画館での夜
    gloss: ある晩、ダニエルとレイラは映画館で映画を見ることにしました。2人は何時に始まるかをたずね、受付の人は、次の上映の Star Journey は7時からだと答えました。2人はチケットを2枚で16ドル、ポップコーンを1袋で4ドルで買いました。合計で20ドルでした。2人は一緒に映画を見ました。映画は宇宙探検家についての話で、とても面白かったです。映画が終わると、レイラは「すごく気に入った」と言い、ダニエルは「次の作品も見たい」と言いました。
    note: '*watched* は *watch*（見る）の過去形です。'
