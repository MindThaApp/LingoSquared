teaching:
  en.a2.unit37.lesson01.teach.video_call:
    title: video call
    gloss: ビデオ通話
    note: '*video call* は、お互いの顔を見ながら話せる通話のことです。日本語では「ビデオ通話」のほか、「ビデオ会議」などとも言います。'
    example_gloss: 毎週月曜日にチームとビデオ通話があります。
  en.a2.unit37.lesson01.teach.camera:
    title: camera
    gloss: カメラ
    note: '*camera* は、あなたの映像を送る機器です。'
    example_gloss: 会議が始まる前に、カメラをオンにしてください。
  en.a2.unit37.lesson01.teach.microphone:
    title: microphone
    gloss: マイク
    note: '*microphone* は、あなたの声を送る機器です。'
    example_gloss: マイクがオフになっていたので、ほかの人に私の声が聞こえませんでした。
  en.a2.unit37.lesson01.teach.connection:
    title: connection
    gloss: 接続
    note: '*connection* は、あなたのコンピューターとインターネットのつながりのことです。'
    example_gloss: 接続が悪かったので、映像が止まりました。
  en.a2.unit37.lesson01.teach.mute:
    title: mute
    gloss: ミュートにする
    note: '*mute* は、自分の音声を切って、ほかの人に聞こえないようにするという意味です。'
    example_gloss: 話していないときは、マイクをミュートにします。
  en.a2.unit37.lesson01.teach.face_to_face:
    title: face to face
    gloss: 直接会って、対面で
    note: '*face to face* は、画面越しではなく、同じ場所で顔を合わせて話すという意味です。'
    example_gloss: 会議によっては、オンラインより対面のほうがよいものもあります。
  en.a2.unit37.lesson01.teach.grammar_comparison:
    title: faster than と less ... than で比べる
    gloss: ビデオ通話は、訪問するより速いです。ビデオ通話は、直接会って話すより親しみが感じにくいです。
    note: 短い形容詞には *-er* を付けて、そのあとに *than* を置きます（*faster than*）。長い形容詞には *less ... than* や *more ... than* を使います。
  en.a2.unit37.lesson02.teach.video_call_every_monday:
    title: ビデオ通話の頻度を伝える
    gloss: 毎週月曜日にチームとビデオ通話があります。
    note: '*every Monday* は「毎週月曜日」という意味で、決まった習慣を表します。'
  en.a2.unit37.lesson02.teach.turn_on_your_camera:
    title: カメラをオンにしてほしいと頼む
    gloss: カメラをオンにしてもらえますか？
    note: '*turn on* は「オンにする」という意味で、反対は *turn off*（オフにする）です。'
  en.a2.unit37.lesson02.teach.you_were_on_mute:
    title: ミュートになっていたと伝える
    gloss: ごめんなさい、ミュートになっていましたよ。
    note: '*you were on mute* は、マイクがミュートだったために声が聞こえなかったときに言う決まった表現です。'
  en.a2.unit37.lesson02.teach.useful_but_prefer_face_to_face:
    title: 好みを添えて自分の意見を言う
    gloss: ビデオ通話は便利だと思いますが、人とは直接会うほうが好きです。
    note: '*I think ... but I prefer ...* は、まず自分の意見を述べて、次に自分の好みを言う形です。'
  en.a2.unit37.lesson02.teach.grammar_prefer:
    title: prefer X to Y
    gloss: 私は電話よりビデオ通話のほうが好きです。私はビデオ通話より対面の会議のほうが好きです。
    note: '*prefer* のあとには *than* ではなく *to* を使います。*prefer A to B*（BよりAが好き）の形です：*I prefer video calls to phone calls*。'
  en.a2.unit37.lesson03.teach.headphones:
    title: headphones
    gloss: ヘッドホン
    note: '*headphones* は、1組だけ使うときでも、英語ではいつも複数形で言います。'
    example_gloss: 家族に会議の声が聞こえないように、ヘッドホンを使っています。
  en.a2.unit37.lesson03.teach.leilas_message:
    title: レイラのメッセージ
    gloss: 私のオンライン授業は、今はすべてビデオ通話です。カメラはオンにしますが、先生が質問するまで、マイクはミュートにしています。ヘッドホンを使うと接続がよくなるので、ヘッドホンを使っています。ビデオ通話は時間の節約になると思いますが、それでも同級生とは直接会うほうが好きです。
    note: レイラが自分のオンライン授業について書いた、気軽なメッセージです。
  en.a2.unit37.lesson03.teach.mute_until_question:
    title: いつマイクをミュートにするかを伝える
    gloss: 先生が質問するまで、マイクはミュートにしています。
    note: '*until* は「～まで」という意味で、ある時点が来るまで続くことを表します。'
  en.a2.unit37.lesson04.teach.q_lot_of_video_calls:
    title: レイラがダニエルの仕事についてたずねる
    gloss: レイラが聞きます：仕事でビデオ通話はたくさんありますか？
    note: '*a lot of* は「たくさんの」という意味で、数えられる名詞にも数えられない名詞にも使えます。'
  en.a2.unit37.lesson04.teach.a_call_every_monday:
    title: ダニエルが決まっている予定について話す
    gloss: ダニエルが答えます：はい、毎週月曜日にチームとビデオ通話があります。
    note: レッスン2と同じ文です。
  en.a2.unit37.lesson04.teach.q_turn_on_camera:
    title: レイラがカメラについてたずねる
    gloss: レイラが聞きます：カメラはオンにしますか？
    note: もっと詳しく知りたいときの、短い聞き返しです。
  en.a2.unit37.lesson04.teach.a_always_but_mute:
    title: ビデオ通話でのダニエルの習慣
    gloss: ダニエルが答えます：いつもオンにします。でも、話していないときはマイクをミュートにします。
    note: ここでの *when I am not speaking* は、「話していないあいだ」という意味です。
  en.a2.unit37.lesson04.teach.q_classes_are_video_calls:
    title: レイラが自分の授業について話す
    gloss: レイラが言います：私のオンライン授業は、今はすべてビデオ通話です。
    note: ユニット33で出てきた、月曜日と水曜日の授業とつながっています。
  en.a2.unit37.lesson04.teach.a_what_do_you_think:
    title: ダニエルが相手の意見をたずねる
    gloss: ダニエルが聞きます：それについてどう思いますか？
    note: '*What do you think about them?* は、今話に出たことについて意見をたずねる言い方です。'
  en.a2.unit37.lesson04.teach.q_useful_but_prefer:
    title: レイラが意見を言う
    gloss: レイラが言います：ビデオ通話は便利だと思いますが、人とは直接会うほうが好きです。
    note: レッスン2と同じ意見です。
  en.a2.unit37.lesson04.teach.a_agree_faster_less_personal:
    title: ダニエルが彼女に同意する
    gloss: ダニエルが言います：同感です。ビデオ通話は訪問するより速いですが、あまり親しみが感じられませんね。
    note: '*I agree* は賛成を表します。そのあとに、自分の理由を続けることが多いです。'
  en.a2.unit37.lesson04.teach.q_exactly:
    title: レイラが確認する
    gloss: レイラが言います：その通りです。
    note: '*Exactly* は、完全に同意していることを伝える短い言い方です。'
