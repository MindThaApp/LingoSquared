teaching:
  en.a1.unit39.lesson01.teach.neighborhood:
    title: neighborhood
    gloss: 近所
    note: '*neighborhood* は「近所」、つまり家のまわりの、近くの通りや建物がある地域という意味です。'
    example_gloss: 私は自分の近所が大好きです。
  en.a1.unit39.lesson01.teach.neighbor:
    title: neighbor
    gloss: 隣人／近所の人
    note: '*neighbor* は「隣人」、つまり自分の隣や近くに住んでいる人という意味です。'
    example_gloss: 私の隣人はとても親切です。
  en.a1.unit39.lesson01.teach.nearby:
    title: nearby
    gloss: 近くに／近くの
    note: '*nearby* は「近くに」という意味です。'
    example_gloss: 近くに公園があります。
  en.a1.unit39.lesson01.teach.quiet:
    title: quiet
    gloss: 静かな
    note: '*quiet* は「静かな」、つまり大きな音があまりしないという意味です。'
    example_gloss: 私の家の前の通りは、夜はとても静かです。
  en.a1.unit39.lesson01.teach.noisy:
    title: noisy
    gloss: うるさい
    note: '*noisy* は「うるさい」、つまり大きな音がたくさんするという意味です。'
    example_gloss: 私の家の隣の通りはうるさいです。
  en.a1.unit39.lesson01.teach.friendly:
    title: friendly
    gloss: 親切な／感じのよい
    note: '*friendly* は「親切な」、つまり人に対して感じがよいという意味です。'
    example_gloss: 私の近所の人たちはとても親切です。
  en.a1.unit39.lesson02.teach.live_in_a_neighborhood:
    title: live in a neighborhood
    gloss: 近所に住む
    note: '*live in a neighborhood* は「ある近所に住む」という意味です。'
    example_gloss: 私は静かな住宅地に住んでいます。
  en.a1.unit39.lesson02.teach.get_along_with_your_neighbors:
    title: get along with your neighbors
    gloss: 近所の人たちと仲よくする
    note: '*get along with your neighbors* は、近くに住む人たちと仲のよい、良好な関係にあるという意味です。'
    example_gloss: 私は近所の人たちと仲よくしています。
  en.a1.unit39.lesson02.teach.close_to:
    title: close to
    gloss: ～の近くに
    note: '*close to* は「(場所)の近くに」という意味です。'
    example_gloss: 私のアパートはスーパーの近くにあります。
  en.a1.unit39.lesson02.teach.a_five_minute_walk:
    title: a five-minute walk
    gloss: 歩いて5分
    note: '*a five-minute walk* は「歩いて5分」という意味の決まった言い方です。数字と名詞をハイフンでつなぎ、walk は単数形のままにします。日本語の「歩いて5分」と似た意味ですが、英語では *a five-minute walk* と名詞の形で言うのが特徴です。'
    example_gloss: 公園は私の家から歩いて5分です。
  en.a1.unit39.lesson02.teach.say_hello_to:
    title: say hello to
    gloss: ～にあいさつする
    note: '*say hello to* は「～にあいさつする」という意味です。'
    example_gloss: 私は毎朝、隣の人にあいさつします。
  en.a1.unit39.lesson02.teach.whats_your_neighborhood_like_question:
    title: What's your neighborhood like?
    gloss: あなたの近所はどんなところですか。
    note: '*What''s ... like?* は、好みではなく、様子や特徴をたずねる表現です。'
  en.a1.unit39.lesson03.teach.dialogue_line1:
    title: レイラの質問
    gloss: レイラ：もうすぐ引っ越すかもしれないの。ミア、あなたの近所はどんなところ？
    note: '*might* + 動詞は可能性を表します。そうなるかもしれないし、ならないかもしれない、という意味です。'
  en.a1.unit39.lesson03.teach.dialogue_line2:
    title: "ミアの答え"
    gloss: ミア：すごく気に入ってるよ。静かだし、近くに公園もあるの。
    note: '*there''s a park nearby* は「近くに公園がある」という意味です。'
  en.a1.unit39.lesson03.teach.dialogue_line3:
    title: レイラの質問
    gloss: レイラ：いいね。スーパーは近い？
    note: '*That sounds nice* は、よい知らせに対する自然な返事です。'
  en.a1.unit39.lesson03.teach.dialogue_line4:
    title: "ミアの答え"
    gloss: ミア：うん、うちの建物から歩いてたった5分のところに1軒あるよ。
    note: ここでの *just* は「たった」という意味で、距離が短いことを強調しています。
  en.a1.unit39.lesson03.teach.dialogue_line5:
    title: レイラの質問
    gloss: レイラ：近所の人たちはどう？親切？
    note: '*What about ...?* は、新しい話題を出すときの自然な言い方です。'
  en.a1.unit39.lesson03.teach.dialogue_line6:
    title: "ミアの答え"
    gloss: ミア：すごく親切だよ！お隣のロペスさんは、私が留守のとき、植物に水をあげてくれるの。
    note: '*waters my plants* は「私の植物に水をやる」という意味です。英語ではここで *water* が動詞として使われています。'
  en.a1.unit39.lesson03.teach.dialogue_line7:
    title: レイラの感想
    gloss: レイラ：それは素敵ね。私もあなたの近くに住みたいな！
    note: '*I''d like to* + 動詞は「～したいです」という意味です。'
  en.a1.unit39.lesson04.teach.reading_passage:
    title: 3つの近所についての文章
    gloss: ダニエル、レイラ、ミアは、3人とも別々の地域に住んでいます。ダニエルの住む地域はにぎやかで、アパートの近くにレストランやお店があります。近所の人を何人か知っていて、廊下でよくあいさつをします。レイラは静かな地域に住んでいて、泳ぎに行くプールが近くにあります。通りの向かいに住む人は大きな犬を飼っていて、その犬はよく吠えます。ミアの地域も静かで、建物から歩いてたった5分のところにスーパーがあります。お隣のロペスさんはとても親切で、ミアが留守のときは植物に水をやってくれます。ミアと話したあと、レイラはミアの近くでアパートを探したいと思いました。
    note: '*decided she wants to look for* は「～を探したいと決めた」という意味です。'
