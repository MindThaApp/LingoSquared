teaching:
  en.a1.unit61.lesson01.teach.sorry:
    title: sorry
    gloss: ごめんなさい・すみません
    note: '*sorry* は、謝るときに使う基本の言葉です。'
    example_gloss: ごめんなさい。
  en.a1.unit61.lesson01.teach.late:
    title: late
    gloss: 遅れて・遅刻して
    note: '*late* は「時間に間に合わない」という意味です。'
    example_gloss: 遅れています。
  en.a1.unit61.lesson01.teach.excuse:
    title: excuse
    gloss: 言い訳・理由
    note: '*excuse* は、問題が起きたことについて説明するための理由、つまり「言い訳」です。'
    example_gloss: これが私の言い訳です。
  en.a1.unit61.lesson01.teach.traffic:
    title: traffic
    gloss: 交通（渋滞）
    note: '*traffic* は、道路を走る車の流れ、つまり「交通」や「渋滞」という意味です。'
    example_gloss: 道路が混んでいます。
  en.a1.unit61.lesson01.teach.mistake:
    title: mistake
    gloss: 間違い
    note: '*mistake* は「間違い」という意味です。'
    example_gloss: 間違えてしまいました。
  en.a1.unit61.lesson01.teach.problem:
    title: problem
    gloss: 問題
    note: '*problem* は「問題」という意味です。'
    example_gloss: 問題ありません。
  en.a1.unit61.lesson02.teach.im_sorry:
    title: I'm sorry.
    gloss: ごめんなさい。
    note: '*I''m sorry* は、謝るときの基本の文です。'
  en.a1.unit61.lesson02.teach.im_late:
    title: I'm late.
    gloss: 遅れています。
    note: '*late* は、ここでは「遅れた」という意味で、「夜遅い」という意味ではありません。'
  en.a1.unit61.lesson02.teach.bus_is_late:
    title: The bus is late.
    gloss: バスが遅れています。
    note: 英語では、人にも、バスにも、同じ形 *is late* を使います。
  en.a1.unit61.lesson02.teach.thats_okay:
    title: That's okay.
    gloss: 大丈夫ですよ。
    note: '*That''s okay* は、謝罪を優しく受け入れる言い方です。'
  en.a1.unit61.lesson02.teach.no_problem:
    title: No problem.
    gloss: 問題ありません。
    note: '*No problem* は、謝罪やお礼に対する、短くてくだけた返事です。'
  en.a1.unit61.lesson02.teach.made_mistake:
    title: I made a mistake.
    gloss: 間違えてしまいました。
    note: 英語では *make a mistake* と言い、*do a mistake* とは言いません。
  en.a1.unit61.lesson03.teach.dialogue_line1:
    title: "ダニエルが謝る"
    gloss: ダニエルは「こんにちは、ミア。遅れてごめんなさい」と言います。
    note: '*I''m sorry I''m late* は、謝る気持ちと、遅れたという内容を1つの文にしています。'
  en.a1.unit61.lesson03.teach.dialogue_line2:
    title: ミアが受け入れます
    gloss: ミアは「大丈夫よ」と言います。
    note: '*That''s okay* は、優しくて簡単な言い方です。'
  en.a1.unit61.lesson03.teach.dialogue_line3:
    title: バスが遅れました
    gloss: ダニエルは「バスが遅れているんだ」と言います。
    note: この文は、遅れた理由を伝えています。
  en.a1.unit61.lesson03.teach.dialogue_line4:
    title: ミアは待てると言います
    gloss: ミアは「問題ないよ。待てるよ」と言います。
    note: '*We can wait* は、待つことができるという意味です。'
  en.a1.unit61.lesson03.teach.dialogue_line5:
    title: ダニエルは時間を間違えました
    gloss: ダニエルは「時間を間違えてしまったんだ」と言います。
    note: '*with the time* は、時間に関して、という意味です。'
  en.a1.unit61.lesson03.teach.dialogue_line6:
    title: 授業は3時に始まります
    gloss: ミアは「大丈夫。授業は3時に始まるよ」と言います。
    note: '*at three* のように、時刻の前には *at* を使います。'
  en.a1.unit61.lesson03.teach.dialogue_line7:
    title: ダニエルがミアにお礼を言います
    gloss: ダニエルは「待ってくれてありがとう」と言います。
    note: '*Thank you for waiting* では、*for* のあとに動詞の *-ing* 形が続きます。'
  en.a1.unit61.lesson04.teach.class_note:
    title: 授業のお知らせ
    gloss: 授業のお知らせ：授業は3:00に始まります。時間どおりに来てください。遅れる場合は、メッセージを送ってください。
    note: このお知らせには、遅れるときにすることが書かれています。
  en.a1.unit61.lesson04.teach.reading_passage:
    title: 本文：授業の前のおわび
    gloss: 授業の前のおわび：バスが遅れたため、ダニエルは授業に遅刻しました。彼は教室の外でミアに会いました。ダニエルは「ごめんなさい」と言いました。また、時間を間違えてしまったとも言いました。ミアは「大丈夫」と言いました。授業は3:00からでした。ダニエルは先生に短いメッセージを送りました。メッセージにはこう書かれていました。「遅れてごめんなさい。バスが遅れています。」
    note: '*because* は理由を表します。ここでは、バスが遅れたから、という理由です。'
