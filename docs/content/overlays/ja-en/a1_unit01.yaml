teaching:
  en.a1.unit01.lesson01.teach.hello:
    title: Hello
    gloss: こんにちは
    note: '*Hello* は中立的で、どんな場面でも使えるあいさつです。'
    example_gloss: こんにちは、ダニエル！
  en.a1.unit01.lesson01.teach.hi:
    title: Hi
    gloss: やあ（くだけた言い方）
    note: '*Hi* は *Hello* よりくだけた言い方で、友だち同士で使う「やあ」に近い感じです。'
    example_gloss: やあ、レイラ！
  en.a1.unit01.lesson01.teach.good_morning:
    title: Good morning
    gloss: おはようございます
    note: '*Good morning* は朝に使います。日本語の「おはようございます」と同じ使い方です。'
  en.a1.unit01.lesson01.teach.good_afternoon:
    title: Good afternoon
    gloss: こんにちは（午後）
    note: '*Good afternoon* は午後に使います。英語には、一日中使える「こんにちは」にあたる表現はありません。'
  en.a1.unit01.lesson01.teach.good_evening:
    title: Good evening
    gloss: こんばんは
    note: '*Good evening* は夕方から夜に使います。日本語の「こんばんは」と同じです。'
  en.a1.unit01.lesson01.teach.goodbye:
    title: Goodbye
    gloss: さようなら
    note: '*Goodbye* は中立的で、どんな場面でも使える別れのあいさつです。'
    example_gloss: さようなら、また明日！
  en.a1.unit01.lesson01.teach.bye:
    title: Bye
    gloss: じゃあね
    note: '*Bye* は *Goodbye* よりくだけた言い方で、「じゃあね」に近い感じです。'
    example_gloss: じゃあね、また近いうちに！
  en.a1.unit01.lesson03.teach.how_are_you:
    title: How are you?
    gloss: お元気ですか？／元気？
    note: '*How are you?* は、丁寧な場面でもくだけた場面でも使えます。日本語のように、相手によって言い方を変える必要はありません。'
  en.a1.unit01.lesson03.teach.im_fine:
    title: I'm fine, thanks.
    gloss: 元気です、ありがとう。
    note: シンプルで中立的な答え方です。
  en.a1.unit01.lesson03.teach.im_good:
    title: I'm good, thanks.
    gloss: 元気です、ありがとう。
    note: '*I''m fine, thanks* と同じ意味です。どちらも日常会話でよく使われます。'
  en.a1.unit01.lesson03.teach.not_bad:
    title: Not bad, thanks.
    gloss: まあまあです、ありがとう。
    note: くだけた、控えめな答え方です。とても良いわけでも悪いわけでもない、という感じです。
  en.a1.unit01.lesson03.teach.and_you:
    title: And you?
    gloss: あなたはどうですか？／そっちは？
    note: 同じ質問を相手に返す言い方です。丁寧さを問わず、どんな場面でも使えます。
  en.a1.unit01.lesson03.teach.are_you_okay:
    title: Are you okay?
    gloss: 大丈夫ですか？
    note: '*Are you okay?* は、相手に何か困ったことがないかをたずねる表現です。*How are you?* のような一般的なあいさつの質問とは違います。'
  en.a1.unit01.lesson05.teach.nice_to_meet_you:
    title: Nice to meet you.
    gloss: はじめまして。
    note: 初めて会う人に言います。
  en.a1.unit01.lesson05.teach.nice_to_meet_you_too:
    title: Nice to meet you too.
    gloss: こちらこそ、はじめまして。
    note: '*Nice to meet you* に対する自然な返事です。'
  en.a1.unit01.lesson05.teach.see_you_later:
    title: See you later.
    gloss: またあとで。
    note: その日のうちにまた会う相手に使います。日本語の「またあとで」と同じ使い方です。
  en.a1.unit01.lesson05.teach.have_a_good_day:
    title: Have a good day.
    gloss: よい一日を。
    note: 相手に、この先の一日がよいものになるよう願う、親しみのある別れのあいさつです。
