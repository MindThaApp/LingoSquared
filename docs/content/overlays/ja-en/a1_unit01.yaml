  en.a1.unit01.lesson01.everyday_greetings:
    title: 日常のあいさつ
  en.a1.unit01.lesson03.wellbeing:
    title: 調子をたずねる・答える
  en.a1.unit01.lesson05.noun_phrases_and_closings:
