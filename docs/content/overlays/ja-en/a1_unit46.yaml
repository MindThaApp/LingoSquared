course:
  title: 英語 A1
  description: あいさつや日常の短い会話ができるようになる、A1レベルの英語コースです。日本語で詳しく解説します。
units:
  en.a1.unit46.lost_items:
    title: 落とし物を届け出る
lessons:
  en.a1.unit46.lesson01.lost_items_vocabulary:
    title: なくしたものの言葉
  en.a1.unit46.lesson02.reporting_a_lost_item:
    title: 落とし物を届け出る
  en.a1.unit46.lesson03.dialogue_missing_backpack:
    title: 会話：見つからないリュック
  en.a1.unit46.lesson04.lost_and_found_notice:
