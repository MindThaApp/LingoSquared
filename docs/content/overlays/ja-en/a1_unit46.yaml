teaching:
  en.a1.unit46.lesson01.teach.lost:
    title: lost
    gloss: なくした
    note: '*lost* は「なくした」という意味です。英語では「財布をなくした」を *I lost my wallet.* と、過去形で言います。'
    example_gloss: 財布をなくしました。
  en.a1.unit46.lesson01.teach.found:
    title: found
    gloss: 見つけた
    note: '*found* は find の過去形で、過去分詞も同じ形です。I found your keys は「あなたの鍵を見つけました」という意味です。'
    example_gloss: あなたの鍵を見つけましたよ！
  en.a1.unit46.lesson01.teach.keys:
    title: keys
    gloss: 鍵
    note: '*keys* は「鍵」という意味です。鍵がいくつかあるときは複数形で言います。'
    example_gloss: これは私の鍵です。
  en.a1.unit46.lesson01.teach.wallet:
    title: wallet
    gloss: 財布
    note: '*wallet* は「財布」という意味です。'
    example_gloss: これはあなたの財布ですか。
  en.a1.unit46.lesson01.teach.backpack:
    title: backpack
    gloss: リュック
    note: '*backpack* は「リュック」という意味です。'
    example_gloss: 私のリュックは黒です。
  en.a1.unit46.lesson02.teach.i_lost_my_wallet:
    title: I lost my wallet.
    gloss: 財布をなくしました。
    note: '*I lost my wallet.* は直訳すると「私は財布をなくした」です。日本語の「財布をなくした」とほぼ同じように、過去形で言います。'
  en.a1.unit46.lesson02.teach.have_you_seen_my_keys:
    title: Have you seen my keys?
    gloss: 私の鍵を見ませんでしたか。
    note: '*Have you seen ...?* は「…を見ましたか」という意味です。have + 過去分詞の形で、今の状況に関わる経験や結果をたずねます。'
  en.a1.unit46.lesson02.teach.has_anyone_found_a_backpack:
    title: Has anyone found a backpack?
    gloss: だれかリュックを見つけた人はいますか。
    note: '*Has anyone found ...?* は「だれか…を見つけた人はいますか」という意味です。'
  en.a1.unit46.lesson02.teach.its_black_with_a_red_strap:
    title: It's black with a red strap.
    gloss: それは黒で、赤いひもがついています。
    note: '*It''s black with a red strap.* は「それは黒で、赤いひもがついています。」という意味です。'
  en.a1.unit46.lesson02.teach.wheres_the_lost_and_found:
    title: Where's the lost and found?
    gloss: 遺失物取扱所はどこですか。
    note: '*the lost and found* は、遺失物取扱所を表す決まった英語の言い方です。直訳すると「なくしたものと見つかったもの」です。'
  en.a1.unit46.lesson02.teach.yes_we_found_it:
    title: Yes, we found it!
    gloss: はい、見つかりました！
    note: '*Yes, we found it!* は「はい、見つかりました！」という意味です。'
  en.a1.unit46.lesson03.teach.dialogue_line1:
    title: ダニエルの質問
    gloss: ダニエル：ミア、リュックはどこ？噴水のそばでは持っていたよね。
    note: '*had* は have の過去形です。「持っていた」という意味になります。'
  en.a1.unit46.lesson03.teach.dialogue_line2:
    title: ミアの驚き
    gloss: ミア：えっ、本当だ！持ってない。中にカメラが入ってるのに！
    note: '*My camera is inside!* は「中にカメラが入っています！」という意味です。'
  en.a1.unit46.lesson03.teach.dialogue_line3:
    title: ダニエルの提案
    gloss: ダニエル：心配しないで、公園の事務所に電話して聞いてみよう。
    note: '*Don''t worry* は「心配しないで」という意味です。'
  en.a1.unit46.lesson03.teach.dialogue_line4:
    title: ダニエルの電話
    gloss: ダニエル：もしもし、噴水のそばで黒いリュックをなくしてしまいました。だれか見つけた人はいませんか。
    note: '*we lost a black backpack* は「黒いリュックをなくしました」という意味です。過去のことなので、過去形の *lost* を使います。'
  en.a1.unit46.lesson03.teach.dialogue_line5:
    title: ミアの質問
    gloss: ミア：なんて言ってた？
    note: '*did they say* は、過去の疑問文で助動詞 *did* を使った形です。'
  en.a1.unit46.lesson03.teach.dialogue_line6:
    title: ダニエルの朗報
    gloss: ダニエル：見つかったって！黒くて、黄色いひもがついてるよね？受付で預かってくれてるよ。
    note: 文の最後の *right?* は、「～ですよね？」と確かめる短い言い方です。
  en.a1.unit46.lesson03.teach.dialogue_line7:
    title: ミアの安堵
    gloss: ミア：うん、それ！今すぐ取りに行こう。ああ、よかった。
    note: '*Let''s go get it* は「取りに行こう」という意味です。go と get という二つの動詞を、to を入れずに続けて言います。'
  en.a1.unit46.lesson04.teach.reading_passage:
    title: 遺失物取扱所についての文章
    gloss: 遺失物取扱所：公園で物をなくしたら、まず最後にそれを持っていた場所を思い出してください。次に、正門の近くにある公園の事務所へ行って、その物の特徴を伝えます。色や、ほかに目立つ特徴を言いましょう。あとで見つかったときにスタッフが連絡できるように、名前と電話番号も伝えてください。ミアが噴水のそばでリュックをなくしたあと、彼女とダニエルはすぐに公園の事務所に電話しました。スタッフはすでにリュックを見つけていて、受付で預かっていました。ミアはカメラが無事に戻ってきて、とてもほっとしました。そのあと、ミアはレイラにすべてを話し、レイラは今度から持ち物にもっと気をつけられるように手伝うと言いました。
    note: '*keep better track of your things* は「持ち物にもっと気をつける」という意味です。'
