teaching:
  en.a1.unit35.lesson01.teach.phone:
    title: phone
    gloss: 電話
    note: '*phone* は「電話」という意味です。'
    example_gloss: 私は携帯電話で母に電話します。
  en.a1.unit35.lesson01.teach.laptop:
    title: laptop
    gloss: ノートパソコン
    note: '*laptop* は「ノートパソコン」という意味です。'
    example_gloss: 彼女は仕事にノートパソコンを使います。
  en.a1.unit35.lesson01.teach.tablet:
    title: tablet
    gloss: タブレット
    note: '*tablet* は「タブレット」という意味です。'
    example_gloss: 彼はタブレットで本を読みます。
  en.a1.unit35.lesson01.teach.computer:
    title: computer
    gloss: パソコン
    note: '*computer* は「パソコン」という意味です。'
    example_gloss: 私たちは家にパソコンがあります。
  en.a1.unit35.lesson01.teach.app:
    title: app
    gloss: アプリ
    note: '*app* は「アプリ」という意味です。'
    example_gloss: 私は電話に新しいアプリを入れました。
  en.a1.unit35.lesson01.teach.camera:
    title: camera
    gloss: カメラ
    note: '*camera* は「カメラ」という意味です。'
    example_gloss: このカメラはすばらしい写真が撮れます。
  en.a1.unit35.lesson02.teach.make_a_call:
    title: make a call
    gloss: 電話をかける
    note: '*make a call* は「電話をかける」という意味で、動詞と名詞を組み合わせた決まった言い方です。日本語の「電話をかける」と同じように、組み合わせごと覚えましょう。'
    example_gloss: 私は毎週日曜日に兄に電話をかけます。
  en.a1.unit35.lesson02.teach.send_a_text:
    title: send a text
    gloss: メッセージを送る
    note: '*send a text* は「メッセージを送る」という意味です。*make a call* と同じように、動詞と名詞を組み合わせた決まった言い方で、「メッセージを送る」という日本語の言い方とよく似ています。'
    example_gloss: 彼女は毎朝、友だちにメッセージを送ります。
  en.a1.unit35.lesson02.teach.download_an_app:
    title: download an app
    gloss: アプリをダウンロードする
    note: '*download an app*：*download* は日本語の「ダウンロードする」とほぼ同じ使い方なので、三つの決まった言い方の中でいちばん簡単です。'
    example_gloss: 彼は毎週、新しいアプリをダウンロードします。
  en.a1.unit35.lesson02.teach.wifi:
    title: wifi
    gloss: ワイファイ
    note: '*wifi* は「ワイファイ」（無線LAN）という意味です。'
    example_gloss: 私の家のワイファイは速いです。
  en.a1.unit35.lesson02.teach.battery:
    title: battery
    gloss: バッテリー
    note: '*battery* は「バッテリー」という意味です。'
    example_gloss: 私の電話のバッテリーは残りわずかです。
  en.a1.unit35.lesson02.teach.how_use_phone_question:
    title: How do you use your phone?
    gloss: 電話をどのように使っていますか。
    note: '*Do you use ...?* は、ほかの英語の疑問文と同じ do-support を使います。'
  en.a1.unit35.lesson03.teach.dialogue_line1:
    title: ミアの不満
    gloss: ミアは「私の電話はすごく古いんです。本当に遅くて」と言っています。
    note: '*so* + 形容詞（*so old*）は、日本語の「すごく」「とても」のように意味を強めます。'
  en.a1.unit35.lesson03.teach.dialogue_line2:
    title: レイラのアドバイス
    gloss: レイラは「新しいのを買ったほうがいいですよ。いちばん何に使っていますか」と言っています。
    note: '*What do you use it for most?* は前置詞 *for* で終わります。日本語の「何に使っていますか」にあたる文で、英語では *what* で始まり、*for* が文の最後に残ります。'
  en.a1.unit35.lesson03.teach.dialogue_line3:
    title: "ミアの答え"
    gloss: ミアは「たいてい姉にメッセージを送ったり、写真を撮ったりしています」と言っています。
    note: '*text* は動詞としても使えます（*I text my sister*）。*send a text* よりよく使われますが、どちらも正しい英語です。'
  en.a1.unit35.lesson03.teach.dialogue_line4:
    title: レイラの使い方
    gloss: レイラは「毎週末、携帯電話で両親に電話をかけます。アプリもたくさん使います」と言っています。
    note: 動詞の *call*（*I call my parents*）は、ふつうのくだけた言い方です。*Make a call* は、決まった組み合わせとしての言い方です。
  en.a1.unit35.lesson03.teach.dialogue_line5:
    title: ミアの質問
    gloss: ミアは「どのアプリを使っていますか」とたずねています。
    note: '*Which apps do you use?*：*which* は、いくつかある中から選ぶときに使い、日本語の「どの」にあたります。'
  en.a1.unit35.lesson03.teach.dialogue_line6:
    title: レイラのアプリ
    gloss: レイラは「料理アプリと地図アプリを使っています。ダウンロードしたいですか」と言っています。
    note: '*Do you want to ...?* は、*want* が普通の動詞なので、do-support を使います。'
  en.a1.unit35.lesson03.teach.dialogue_line7:
    title: "ミアの答え"
    gloss: ミアは「はい、お願いします。名前を送ってください」と言っています。
    note: '*please* は動詞の前（*please send ...*）に置いて、依頼をていねいにします。'
  en.a1.unit35.lesson04.teach.reading_passage:
    title: ダニエル、レイラ、ミアについての文章
    gloss: ダニエル、レイラ、ミアは、電話の使い方がそれぞれ違います。ダニエルはメッセージを送るのが好きではなく、代わりに電話をかけるほうが好きです。レイラは地図に電話を使います。新しいレシピを試すときは、料理アプリも使います。ミアは写真をたくさん撮って、家族に送ります。三人とも仕事にはノートパソコンを使い、週末には友だちとビデオ通話をします。
    note: '*He prefers to call people instead*：文末の *instead* は「その代わりに」という意味です（メッセージを送る代わりに、ということです）。'
