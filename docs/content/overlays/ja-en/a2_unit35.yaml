teaching:
  en.a2.unit35.lesson01.teach.pharmacy:
    title: pharmacy
    gloss: 薬局
    note: '*pharmacy* は、薬を受け取る店のことです。'
    example_gloss: 診療所の隣に薬局があります。
  en.a2.unit35.lesson01.teach.pharmacist:
    title: pharmacist
    gloss: 薬剤師
    note: '*pharmacist* は、薬を渡してくれる人のことです。'
    example_gloss: 薬剤師が薬の飲み方を説明してくれました。
  en.a2.unit35.lesson01.teach.tablet:
    title: tablet
    gloss: 錠剤
    note: '*tablet* は、飲み込む固形の薬ひと粒のことです。'
    example_gloss: 朝に1錠、夜にもう1錠飲みます。
  en.a2.unit35.lesson01.teach.dose:
    title: dose
    gloss: 用量
    note: '*dose* は、1回に飲む薬の量のことです。'
    example_gloss: 用量は1回1錠、1日2回です。
  en.a2.unit35.lesson01.teach.refill:
    title: refill
    gloss: 同じ薬の追加分、補充
    note: '*refill* は、もう一度医師の診察を受けなくても受け取れる、同じ薬の新しい分のことです。'
    example_gloss: 錠剤がもうすぐなくなるので、同じ薬の追加分が必要です。
  en.a2.unit35.lesson01.teach.side_effects:
    title: side effects
    gloss: 副作用
    note: '*side effects* は、薬が体に起こすことがある、本来の目的以外の作用のことです。'
    example_gloss: 薬剤師がこの薬の副作用を説明してくれました。
  en.a2.unit35.lesson01.teach.grammar_frequency:
    title: どのくらいの頻度で飲むかを伝える
    gloss: 1日1回、1日2回、1日3回、8時間ごと
    note: '*once a day* = 1日1回、*twice a day* = 1日2回、*three times a day* = 1日3回、*every eight hours* = 8時間ごと。'
  en.a2.unit35.lesson02.teach.pick_up_prescription:
    title: なぜカウンターにいるのかを伝える
    gloss: 処方薬を受け取りたいのですが。
    note: '*I''d like to...* は、したいことを伝えるときの、丁寧で基本的な言い方です。'
  en.a2.unit35.lesson02.teach.take_one_tablet:
    title: 耳にする用量の言い方
    gloss: 1日2回、食事といっしょに1錠飲んでください。
    note: '*with food* は「食事といっしょに」という意味で、空腹のときに飲まないということです。'
  en.a2.unit35.lesson02.teach.ask_how_many_days:
    title: どのくらい飲み続けるかをたずねる
    gloss: 何日間飲めばいいですか？
    note: '*How many...?* は、日数のように数えられるものの数をたずねるときに使います。'
  en.a2.unit35.lesson02.teach.ask_side_effects:
    title: 副作用についてたずねる
    gloss: 副作用はありますか？
    note: '*Are there any...?* は、何かがあるかどうかをたずねるときの一般的な言い方です。'
  en.a2.unit35.lesson02.teach.grammar_should:
    title: 指示に使う should と shouldn't
    gloss: 食事といっしょに飲んだほうがいいです。途中でやめないほうがいいです。
    note: '*should* は助言や指示を表します。*shouldn''t* はその否定形です。'
  en.a2.unit35.lesson03.teach.before_bed:
    title: before bed
    gloss: 寝る前に
    note: '*before bed* は、寝る前にという意味です。'
    example_gloss: 薬の中には、寝る前に飲むとよく効くものがあります。
  en.a2.unit35.lesson03.teach.label_text:
    title: 薬局のラベル
    gloss: 風邪薬。1日2回、食事といっしょに1錠ずつ、5日間飲んでください。錠剤は途中でやめないでください。起こりうる副作用：眠気やだるさを感じることがあります。補充：1回。
    note: 薬局のラベルは短く簡潔です。文は短く、丁寧な言い回しは使いません。
  en.a2.unit35.lesson03.teach.do_not_stop_early:
    title: ラベルの注意書き
    gloss: 錠剤は途中でやめないでください。
    note: '*Do not...* は、ラベルや掲示でよく見かける、してはいけないことを示す命令の形です。'
  en.a2.unit35.lesson04.teach.q_pick_up:
    title: ダニエルがカウンターで声をかける
    gloss: ダニエルが言います：こんにちは、処方薬を受け取りたいのですが。
    note: '*Hi* は *Hello* よりくだけた言い方ですが、カウンターでもふつうに使います。'
  en.a2.unit35.lesson04.teach.a_what_is_your_name:
    title: 薬剤師が名前をたずねる
    gloss: 薬剤師が言います：かしこまりました。お名前は何ですか？
    note: ここでの *Of course* は、「もちろんです、問題ありません」という意味です。
  en.a2.unit35.lesson04.teach.q_doctor_gave_me_medicine:
    title: ダニエルが薬を飲む理由を伝える
    gloss: ダニエルが言います：ダニエルです。ひどい風邪のために、医師から薬をもらいました。
    note: ユニット28の診察の場面とつながっていて、同じ風邪のことです。
  en.a2.unit35.lesson04.teach.a_here_it_is:
    title: 薬剤師が用量を伝える
    gloss: 薬剤師が言います：こちらです。1日2回、食事といっしょに1錠飲んでください。
    note: '*Here it is* は、相手に何かを手渡すときに言います。'
  en.a2.unit35.lesson04.teach.q_how_many_days:
    title: ダニエルがどのくらいかをたずねる
    gloss: ダニエルがたずねます：何日間飲めばいいですか？
    note: レッスン2と同じ質問です。
  en.a2.unit35.lesson04.teach.a_five_days_no_stopping:
    title: 薬剤師の答え
    gloss: 薬剤師が言います：5日間です。錠剤は途中でやめないでください。
    note: レッスン3のラベルにあった指示と同じです。
  en.a2.unit35.lesson04.teach.q_any_side_effects:
    title: ダニエルが副作用をたずねる
    gloss: ダニエルがたずねます：副作用はありますか？
    note: レッスン2と同じ質問です。
  en.a2.unit35.lesson04.teach.a_you_may_feel_tired:
    title: 薬剤師が副作用を伝える
    gloss: 薬剤師が言います：眠気やだるさを感じるかもしれませんが、それだけです。
    note: ここでの *but that's all* は、「でも、それだけです」という意味です。
  en.a2.unit35.lesson04.teach.q_thank_you:
    title: ダニエルが薬剤師にお礼を言う
    gloss: ダニエルが言います：どうもありがとうございます。
    note: '*very much* を付けると、感謝の気持ちが強くなります。'
