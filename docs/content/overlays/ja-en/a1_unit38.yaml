teaching:
  en.a1.unit38.lesson01.teach.chore:
    title: chore
    gloss: 家事
    note: '*chore* は「家事」という意味で、家をきれいに整えておくために定期的にする仕事のことです。'
    example_gloss: 皿洗いは、私がいちばん嫌いな家事です。
  en.a1.unit38.lesson01.teach.dishes:
    title: dishes
    gloss: 食器
    note: '*dishes* は「食器」という意味で、洗う皿やコップ、カトラリーのことです。'
    example_gloss: 私は夕食のあとで食器を洗います。
  en.a1.unit38.lesson01.teach.laundry:
    title: laundry
    gloss: 洗濯物
    note: '*laundry* は「洗濯物」という意味で、洗って乾かしてたたむ衣類のことです。'
    example_gloss: 彼女は日曜日に洗濯をします。
  en.a1.unit38.lesson01.teach.vacuum:
    title: vacuum
    gloss: 掃除機をかける
    note: '*vacuum* は「掃除機をかける」という意味です。'
    example_gloss: 彼は毎週土曜日にリビングに掃除機をかけます。
  en.a1.unit38.lesson01.teach.trash:
    title: trash
    gloss: ごみ
    note: '*trash* は「ごみ」という意味です。'
    example_gloss: ごみを出してもらえますか。
  en.a1.unit38.lesson01.teach.clean:
    title: clean
    gloss: 掃除する
    note: '*clean* は「掃除する」という意味です。'
    example_gloss: 私たちはいっしょにアパートを掃除します。
  en.a1.unit38.lesson02.teach.wash_the_dishes:
    title: wash the dishes
    gloss: 食器を洗う
    note: '*wash the dishes* は、文字どおり「食器を洗う」という意味です。*Do the dishes* も同じようによく使われ、同じ意味です。'
    example_gloss: 私は毎晩食器を洗います。
  en.a1.unit38.lesson02.teach.do_the_laundry:
    title: do the laundry
    gloss: 洗濯をする
    note: '*do the laundry* は「洗濯をする」という意味です。'
    example_gloss: 彼女は日曜日に洗濯をします。
  en.a1.unit38.lesson02.teach.take_out_the_trash:
    title: take out the trash
    gloss: ごみを出す
    note: '*take out the trash* は *take out* を使い、*do* は使いません。*do the laundry* や *do the dishes* とは違って、ここでは *do* が使えません。'
    example_gloss: ごみを出してもらえますか。
  en.a1.unit38.lesson02.teach.clean_the_bathroom:
    title: clean the bathroom
    gloss: 浴室を掃除する
    note: '*clean the bathroom* は「浴室を掃除する」という意味です。'
    example_gloss: 彼は週末に浴室を掃除します。
  en.a1.unit38.lesson02.teach.need_to:
    title: need to
    gloss: 〜しなければならない
    note: '*need to* は、「〜しなければならない」という意味です。'
    example_gloss: 私は今週末、リビングに掃除機をかけなければなりません。
  en.a1.unit38.lesson02.teach.can_you_help_me_with_question:
    title: Can you help me with the dishes?
    gloss: 食器洗いを手伝ってもらえますか。
    note: 家事の手伝いをお願いするときの、ていねいな言い方です。
  en.a1.unit38.lesson03.teach.dialogue_line1:
    title: ミアの困りごと
    gloss: ミアは「私のアパートは散らかっています。今週末、人が来るんです」と言っています。
    note: '*a mess* は「散らかった状態」という意味です。'
  en.a1.unit38.lesson03.teach.dialogue_line2:
    title: ダニエルの申し出
    gloss: ダニエルは「掃除を手伝いましょうか」とたずねています。
    note: '*Do you want some help ...ing?* は、手伝いを申し出る自然な言い方です。'
  en.a1.unit38.lesson03.teach.dialogue_line3:
    title: "ミアの答え"
    gloss: ミアは「はい、お願いします！リビングに掃除機をかけて、食器を洗わないといけないんです」と言っています。
    note: '*I need to* + 動詞は、「私は〜しなければなりません」という意味です。'
  en.a1.unit38.lesson03.teach.dialogue_line4:
    title: ダニエルの申し出
    gloss: ダニエルは「掃除機は私がかけますよ。食器はあなたが洗ってください」と言っています。
    note: '*for you* は、ここでは「あなたの代わりに」という意味です。'
  en.a1.unit38.lesson03.teach.dialogue_line5:
    title: ミアの付け足し
    gloss: ミアは「ありがとう！洗濯もまだしないといけないんです」と言っています。
    note: '*still need to* は、「まだ〜しなければならない」という意味です。'
  en.a1.unit38.lesson03.teach.dialogue_line6:
    title: ダニエルの申し出
    gloss: ダニエルは「今日はそれをする時間がありませんが、帰る前にごみを出すことはできますよ」と言っています。
    note: '*before I leave* は、「帰る前に」という意味です。'
  en.a1.unit38.lesson03.teach.dialogue_line7:
    title: ミアのお礼
    gloss: ミアは「それはとても助かります。本当にありがとう！」と言っています。
    note: '*That would help a lot* は、「それはとても助かります」という意味です。*Would* を使うと、ていねいな言い方になります。'
  en.a1.unit38.lesson04.teach.reading_passage:
    title: 家での家事についての文章
    gloss: ダニエル、レイラ、ミアには、それぞれ自分の家事の習慣があります。ダニエルは毎晩夕食のあとに食器を洗い、土曜日にアパートに掃除機をかけます。レイラは洗濯は苦になりませんが、浴室の掃除は大嫌いです。ミアの猫のルナはあちこちに毛を落とすので、ミアはほとんど毎日アパートに掃除機をかけています。先週末、ミアのところに客が来ることになっていたので、ダニエルが手伝いを申し出ました。彼はリビングに掃除機をかけ、ミアの代わりにごみを出しました。ミアは彼の手伝いにとても感謝しました。
    note: '*doesn''t mind* は、「気にならない」「苦にならない」という意味です。'
