teaching:
  en.a2.unit40.lesson01.teach.order:
    title: order
    gloss: 注文
    note: '*order* は、注文そのものを表します。動詞の *to order* は「注文する」という意味です。'
    example_gloss: 注文した品が2日遅れて届きました。
  en.a2.unit40.lesson01.teach.delivery:
    title: delivery
    gloss: 配達
    note: '*delivery* は、注文した品があなたの家まで届けられることです。'
    example_gloss: 配達は火曜日の午前中でした。
  en.a2.unit40.lesson01.teach.parcel:
    title: parcel
    gloss: 荷物、小包
    note: '*parcel* は、あなたの家のドアのところに届けられる、梱包された荷物のことです。'
    example_gloss: 荷物は、玄関のドアの外に置かれていました。
  en.a2.unit40.lesson01.teach.damaged:
    title: damaged
    gloss: 傷んだ、破損した
    note: '*damaged* は、運ばれる途中で傷んだけれど、まだ使えるかもしれないことを表します。多くは包装について言います。'
    example_gloss: 箱は、届いたときに傷んでいました。
  en.a2.unit40.lesson01.teach.broken:
    title: broken
    gloss: 壊れた
    note: '*broken* は *damaged* より強い言葉で、そのものがもう動かないことを表します。'
    example_gloss: 荷物の中のランプは壊れていました。
  en.a2.unit40.lesson01.teach.replacement:
    title: replacement
    gloss: 代替品、交換品
    note: '*replacement* は、壊れたものの代わりに届く新しい品です。*refund* は代金の返金です。'
    example_gloss: 返金ではなく、代替品をお願いしました。
  en.a2.unit40.lesson01.teach.grammar_arrived:
    title: arrived und has not arrived yet
    gloss: 注文した品は昨日届きました。注文した品はまだ届いていません。
    note: '*arrived* は、過去の時点について言うときに使います。*has not arrived yet* は、今もまだ待っていることを表します。'
  en.a2.unit40.lesson02.teach.report_order_problem:
    title: Sagen, wofür Sie anrufen
    gloss: 注文についての問題をお伝えしたいのですが。
    note: '*I''d like to report a problem with ...* は、ユニット29の水漏れのときと同じ、丁寧な言い方です。'
  en.a2.unit40.lesson02.teach.lamp_arrived_broken:
    title: Sagen, was nicht stimmt
    gloss: ランプは壊れた状態で届きました。
    note: '*arrived broken* は、届いたときにすでに壊れていたという意味です。'
  en.a2.unit40.lesson02.teach.ask_for_replacement:
    title: Zwischen Ersatz und Rückerstattung wählen
    gloss: 返金ではなく、代替品をいただくことはできますか？
    note: '*instead of* は、2つの選択肢を比べて、1つ目を選ぶという意味です。2つ目は選びません。'
  en.a2.unit40.lesson02.teach.my_order_number:
    title: Ihre Bestellnummer nennen
    gloss: 注文番号は8154です。
    note: 注文番号をたずねられたら、すぐに伝えましょう。担当者がその番号であなたの注文を探します。
  en.a2.unit40.lesson02.teach.grammar_instead_of:
    title: instead of zum Auswählen
    gloss: 返金ではなく、代替品をいただくことはできますか？交換ではなく、返金をお願いしたいです。
    note: '*instead of* のあとには、名詞か -ing の形を置きます（*instead of a refund*、*instead of getting a refund*）。動詞の原形は置きません。*instead of get a refund* とは言いません。'
  en.a2.unit40.lesson03.teach.box:
    title: box
    gloss: 箱
    note: '*box* は、注文した品が入っている箱のことです。*parcel* は、届けられる荷物全体のことです。'
    example_gloss: ランプは大きな箱に入っていました。
  en.a2.unit40.lesson03.teach.return_message:
    title: Die Antwort des Shops
    gloss: メッセージをありがとうございます。ランプが壊れた状態で届いたとのこと、申し訳ございません。ランプを箱に戻して、郵便局に持ち込んでください。新しいランプは3営業日以内に発送いたします。注文番号8154。
    note: カスタマーサービスの返信には、いつも次のことが書かれています。問題、あなたがすること、ショップがすること。
  en.a2.unit40.lesson03.teach.put_it_back_in_the_box:
    title: Was Sie mit der kaputten Lampe tun sollen
    gloss: ランプを箱に戻して、郵便局に持ち込んでください。
    note: '*put ... back in ...* は、あるものを元あった場所に戻すという意味です。'
  en.a2.unit40.lesson04.teach.q_report_a_problem:
    title: Leila ruft den Online-Shop an
    gloss: レイラが言います：もしもし、注文についての問題をお伝えしたいのですが。
    note: 電話では、すぐに用件を伝えます。
  en.a2.unit40.lesson04.teach.a_what_is_the_problem:
    title: Der Mitarbeiter fragt nach
    gloss: 担当者が言います：それは申し訳ございません。どんな問題でしょうか？
    note: '*I''m sorry to hear that* は、悪い知らせを聞いたときに担当者が使う、決まった丁寧な反応です。'
  en.a2.unit40.lesson04.teach.q_lamp_broken_box_damaged:
    title: Leila erklärt das Problem
    gloss: レイラが言います：ランプが壊れた状態で届きました。箱も傷んでいました。
    note: 違いに注意しましょう。箱は *damaged*、ランプは *broken* です。
  en.a2.unit40.lesson04.teach.a_ask_order_number:
    title: Der Mitarbeiter fragt nach der Bestellnummer
    gloss: 担当者が言います：わかりました。注文番号を教えていただけますか？
    note: ユニット39と同じ、間接的な質問の形 *Could you tell me ...?* です。
  en.a2.unit40.lesson04.teach.q_order_number_8154:
    title: Leila nennt ihre Bestellnummer
    gloss: レイラが言います：注文番号は8154です。
    note: レッスン2と同じ文です。
  en.a2.unit40.lesson04.teach.a_refund_or_replacement:
    title: Der Mitarbeiter bietet zwei Möglichkeiten an
    gloss: 担当者が言います：ありがとうございます。返金と代替品、どちらになさいますか？
    note: ここでの *or* は、2つの選択肢を並べています。そのうちの1つを選びます。
  en.a2.unit40.lesson04.teach.q_replacement_please:
    title: Leila wählt den Ersatz
    gloss: レイラが言います：返金ではなく、代替品をいただくことはできますか？
    note: レッスン2と同じ質問です。
  en.a2.unit40.lesson04.teach.a_new_lamp_three_days:
    title: Der Mitarbeiter regelt es
    gloss: 担当者が言います：もちろんです。新しいランプは3営業日以内に発送いたします。
    note: レッスン3のメッセージにあった約束と同じです。
  en.a2.unit40.lesson04.teach.q_thank_you:
    title: Leila bedankt sich beim Mitarbeiter
    gloss: レイラが言います：どうもありがとうございます。
    note: '*very much* を付けると、感謝の気持ちが少し強くなります。'
