teaching:
  en.a2.unit34.lesson01.teach.refund:
    title: refund
    gloss: 返金
    note: '*refund* は、支払ったお金が戻ってくることです。'
    example_gloss: このミキサーの代金を返金してほしいのですが。
  en.a2.unit34.lesson01.teach.exchange:
    title: exchange
    gloss: 交換、交換する
    note: '*exchange* は、商品を別のものと取り替えることです。'
    example_gloss: 返金と交換、どちらになさいますか？
  en.a2.unit34.lesson01.teach.receipt:
    title: receipt
    gloss: レシート
    note: '*receipt* は、その商品を買ったことを証明する紙のことです。'
    example_gloss: レシートはお持ちですか？
  en.a2.unit34.lesson01.teach.return_policy:
    title: return policy
    gloss: 返品ポリシー
    note: '*return policy* は、商品の返品について店が決めているルールのことです。'
    example_gloss: その店の返品ポリシーでは、30日以内なら返品できます。
  en.a2.unit34.lesson01.teach.defective:
    title: defective
    gloss: 欠陥のある、不良の
    note: '*defective* は、壊れている、またはきちんと動かないという意味です。'
    example_gloss: ミキサーが不良品だったので、返品しました。
  en.a2.unit34.lesson02.teach.return_blender_stopped_working:
    title: 不良品を返品する
    gloss: このミキサーを返品したいのですが。1回使っただけで動かなくなりました。
    note: '*I''d like to return...* は、商品を返したいときの丁寧な言い方です。'
  en.a2.unit34.lesson02.teach.refund_or_exchange_question:
    title: 店員が選択肢を示す
    gloss: 返金と交換、どちらになさいますか？
    note: '*Would you like...or...?* は、2つの選択肢から選んでもらうときの言い方です。'
  en.a2.unit34.lesson02.teach.id_like_a_refund:
    title: 返金をお願いする
    gloss: 返金をお願いします。
    note: '*I''d like..., please* は、何かを丁寧に頼むときの言い方です。'
  en.a2.unit34.lesson03.teach.within_30_days:
    title: いつまでに返品できるかを伝える
    gloss: レシートがあれば、30日以内に商品を返品できます。
    note: '*within 30 days* は、30日以内にという意味です。'
  en.a2.unit34.lesson03.teach.policy_text:
    title: 返品規定の文面
    gloss: 返品ポリシー：レシートがあれば、30日以内に商品を返品できます。不良品は、いつでも交換または返金できます。
    note: 期限と、不良品についての例外が書かれた、正式な返品ポリシーです。
  en.a2.unit34.lesson03.teach.i_have_my_receipt:
    title: レシートがあると伝える
    gloss: 先週のレシートがあります。
    note: '*from last week* は「先週の」という意味です。'
  en.a2.unit34.lesson04.teach.q_return_blender:
    title: レイラがミキサーを返品する
    gloss: レイラが言います：こんにちは、このミキサーを返品したいのですが。1回使っただけで動かなくなりました。
    note: レッスン2と同じ文に、あいさつがついています。
  en.a2.unit34.lesson04.teach.a_sorry_do_you_have_receipt:
    title: 店員がレシートについてたずねる
    gloss: 店員が言います：それは申し訳ございません。レシートはお持ちですか？
    note: '*I''m sorry to hear that* は、相手の話に対して気の毒に思う気持ちを伝える丁寧な言い方です。'
  en.a2.unit34.lesson04.teach.q_yes_bought_last_week:
    title: レイラが購入を確認する
    gloss: レイラが言います：はい、こちらです。ミキサーは先週買いました。
    note: レイラはレシートを渡して、ミキサーをいつ買ったかを伝えています。
  en.a2.unit34.lesson04.teach.a_refund_or_exchange:
    title: 店員が選択肢を示す
    gloss: 店員が言います：ありがとうございます。返金と交換、どちらになさいますか？
    note: レッスン2で学んだ質問と同じです。
  en.a2.unit34.lesson04.teach.q_id_like_a_refund:
    title: レイラが返金を選ぶ
    gloss: レイラが言います：返金をお願いします。
    note: レッスン2で学んだ文と同じです。
  en.a2.unit34.lesson04.teach.a_refund_thirty_five:
    title: 店員が返金する
    gloss: 店員が言います：承知しました。こちらが返金の35ドルです。
    note: 店員は対応を済ませ、返金する金額をはっきり伝えています。
