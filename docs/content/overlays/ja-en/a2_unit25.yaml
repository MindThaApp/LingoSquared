teaching:
  en.a2.unit25.lesson01.teach.appointment:
    title: appointment
    gloss: 予約
    note: '*appointment* は、役所などでの決まった日時の予約を表します。'
    example_gloss: 金曜日にDMV(自動車・運転免許の窓口)の予約があります。
  en.a2.unit25.lesson01.teach.document:
    title: document
    gloss: 書類
    note: '*document* は、公式な書類や文書を表します。'
    example_gloss: 居住証明として書類を1通お持ちください。
  en.a2.unit25.lesson01.teach.proof_of_residency:
    title: proof of residency
    gloss: 居住証明
    note: '*proof of residency* は、どこに住んでいるかを示す書類のことです。'
    example_gloss: 公共料金の請求書は居住証明として使えます。
  en.a2.unit25.lesson01.teach.form:
    title: form
    gloss: 申請用紙
    note: '*form* は、記入する用紙のことです。'
    example_gloss: 予約の前に、この用紙に記入してください。
  en.a2.unit25.lesson01.teach.confirmation_number:
    title: confirmation number
    gloss: 確認番号
    note: '*confirmation number* は、予約を確認するための番号です。'
    example_gloss: 確認番号は4471です。
  en.a2.unit25.lesson02.teach.i_was_wondering_whether:
    title: I was wondering whether I could make an appointment.
    gloss: 予約を取らせていただけないかと思い、お電話しました。
    note: '*I was wondering whether...* は、丁寧でかしこまった尋ね方です。'
  en.a2.unit25.lesson02.teach.would_it_be_possible:
    title: Would it be possible to come this Friday?
    gloss: 今週の金曜日に伺うことは可能でしょうか。
    note: '*Would it be possible...?* は、とても丁寧な依頼の言い方です。'
  en.a2.unit25.lesson02.teach.because_i_moved:
    title: I need to update my address because I moved last month.
    gloss: 先月引っ越したので、住所を変更する必要があります。
    note: '*because* は、理由を述べる節を導きます。'
  en.a2.unit25.lesson03.teach.photo_id:
    title: photo ID
    gloss: 顔写真付き身分証明書
    note: '*photo ID* は、顔写真付きの身分証明書のことで、運転免許証などがこれにあたります。'
    example_gloss: 顔写真付き身分証明書と居住証明が1通必要です。
  en.a2.unit25.lesson03.teach.utility_bill:
    title: utility bill
    gloss: 電気・ガス・水道の請求書
    note: '*utility bill* は、電気・ガス・水道の請求書のことです。'
    example_gloss: 公共料金の請求書は、居住証明のよくある例です。
  en.a2.unit25.lesson03.teach.notice_text:
    title: Text des Hinweises
    gloss: 住所を変更するには、顔写真付き身分証明書と、公共料金の請求書などの居住証明を1通お持ちください。公共料金の請求書がない場合は、賃貸契約書をお持ちいただいても構いません。
    note: 正式なお知らせです。持参するものと、その代わりに持参できるものが書かれています。
  en.a2.unit25.lesson03.teach.i_will_bring:
    title: I will bring a photo ID.
    gloss: 顔写真付き身分証明書を持っていきます。
    note: '*will* は、これからすることを表します(未来)。'
  en.a2.unit25.lesson04.teach.could_you_tell_me:
    title: Could you tell me what I need to bring?
    gloss: 何を持ってくる必要があるか、教えていただけますか。
    note: '*Could you tell me...?* は丁寧な間接疑問です。*what* の後は通常の語順で、*what I need to bring* となります。'
  en.a2.unit25.lesson04.teach.q_since_when:
    title: Fragen, wie lange
    gloss: 窓口の職員が尋ねます。新しい住所には、どのくらい住んでいますか。
    note: '*How long have you lived...?* は、ある状態がどのくらい続いているかを尋ねます。英語では現在完了形(*have lived*)を使います。答えは *since* で始められます。例:*Since last month.*'
  en.a2.unit25.lesson04.teach.a_since_last_month:
    title: Daniels Antwort
    gloss: ダニエルが言います。先月からです。
    note: '*Since last month* は「先月から」という意味です。ここでは短い答えで十分です。'
  en.a2.unit25.lesson04.teach.q_would_it_be_possible:
    title: Nach einem Termin fragen
    gloss: ダニエルが尋ねます。今週の金曜日に伺うことは可能でしょうか。
    note: 2つ目のレッスンと同じ質問です。
  en.a2.unit25.lesson04.teach.a_friday_works_confirmation:
    title: Antwort des Sachbearbeiters
    gloss: 窓口の職員が言います。はい、金曜日の10時で大丈夫です。確認番号は4471です。
    note: 職員は時間を確認し、確認番号を伝えています。
