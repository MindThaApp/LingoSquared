      status: correct
    - value: Both sources agree that demand increased after the hospital opened, but they disagree about the cause. The survey points to higher demand, while the operator report points to driver shortages and includes staffing records. The operator report is better supported on the cause.
      status: correct
    feedback: ここでは、複数の情報源をまとめ、比べ、評価する練習をします。
