teaching:
  en.b2.unit08.lesson01.teach.source:
    title: source
    gloss: 情報源、出典
    note: '*source* は、情報を提供してくれるもとのことです。どこでも *according to* を使うのではなく、情報源どうしの一致や対立を述べることも大切です。'
    example_gloss: 情報源は、情報を提供します。
  en.b2.unit08.lesson01.teach.synthesize:
    title: synthesize
    gloss: 統合する、まとめ上げる
    note: '*synthesize* は、複数の情報源の情報を組み合わせて、一貫した答えにまとめることです。'
    example_gloss: 統合するとは、情報源の情報を組み合わせることです。
  en.b2.unit08.lesson01.teach.evaluate:
    title: evaluate
    gloss: 評価する
    note: '*evaluate* は、あるものがどれだけ確かで強いかを判断することです。'
    example_gloss: 評価するとは、あるものがどれだけ強いかを見極めることです。
  en.b2.unit08.lesson01.teach.agreement:
    title: agreement
    gloss: 一致
    note: '*agreement* は、ある点について、情報源が同じことを述べていることです。'
    example_gloss: 一致とは、情報源が同じことを述べていることです。
  en.b2.unit08.lesson01.teach.conflict:
    title: conflict
    gloss: 対立、食い違い
    note: '*conflict* は、ある点について、情報源どうしが矛盾したり、異なったりすることです。'
    example_gloss: 対立とは、情報源の意見が合わないことです。
  en.b2.unit08.lesson01.teach.judgement:
    title: judgment
    gloss: 判断、見極め
    note: '*judgment* は、どの情報源のほうがより確かかについての、根拠のある判断のことです。アメリカ英語では *judgment* と書き、イギリス英語では *judgement* も見られます。'
    example_gloss: 判断は、どの情報源のほうが強いかを説明します。
  en.b2.unit08.lesson02.teach_agree_conflict:
    title: 一致と対立の両方
    gloss: どちらの情報源も、需要が増えたという点では一致していますが、その原因については意見が分かれています。
    note: '*Both sources agree... but they disagree...* は、毎回 *according to* を使って別々の文を並べるよりも優れています。'
  en.b2.unit08.lesson02.teach_by_contrast:
    title: by contrast
    gloss: 対照的に、それとは逆に
    note: '*By contrast* は、2つの情報源や論点を本当に対比させるときに使います。単なるつなぎの言葉として、何にでも使わないようにしましょう。'
  en.b2.unit08.lesson02.teach_better_supported:
    title: better supported
    gloss: より裏づけがしっかりしている
    note: '*better supported on the cause* は、原因に関して、より強い根拠があるという意味です。'
  en.b2.unit08.lesson02.teach_grammar_synthesis:
    title: 統合の文章を組み立てる
    gloss: 統合では、情報源がどこで一致し、どこで対立し、どの説明のほうが裏づけがしっかりしているかを述べる必要があります。
    note: 情報源どうしの関係を的確に示すために、*agree*、*conflict*、*better supported* を使いましょう。
  en.b2.unit08.lesson03.teach_survey:
    title: survey
    gloss: アンケート調査
    note: '*survey* は、多くの人から回答や意見を集めるものです。'
    example_gloss: アンケートでは、多くの意見を集められます。
  en.b2.unit08.lesson03.teach_account:
    title: account
    gloss: 説明、報告、記述
    note: '*account* は、起きたことについての説明や報告のことです。'
    example_gloss: 報告は、何が起きたかを説明します。
  en.b2.unit08.lesson03.teach.source_a:
    title: Source A
    gloss: 情報源A:乗客アンケートによると、新しい病院が開業してから、バスの遅れがより頻繁に起きるようになりました。多くの乗客が、特に朝は、今では路線が混雑していると答えています。アンケートは、主な原因は需要の増加だと主張しています。
    note: 情報源Aには乗客の意見がたくさん含まれていますが、それが原因について最も強い根拠になるとは限りません。
  en.b2.unit08.lesson03.teach.source_b:
    title: Source B
    gloss: 情報源B:運行会社の報告書も、病院の開業後に需要が増えたことには同意していますが、運行の遅れの主な原因は運転手不足だとしています。報告書には、同じ期間の人員配置の記録が含まれています。
    note: '*staffing records* は、乗客の体験談だけよりも、原因についてより強い根拠を示します。'
  en.b2.unit08.lesson04.teach.q_survey:
    title: テッサが情報源Aを挙げる
    gloss: テッサ:バスの遅れについて、2つの報告を読んだの。乗客アンケートでは、新しい病院が開業してから需要が増えたとされているわ。
    note: これは、一つの情報源と、需要の増加という論点を紹介しています。
  en.b2.unit08.lesson04.teach.a_operator:
    title: ローワンが情報源Bを挙げる
    gloss: ローワン:運行会社の報告書も需要が増えたことには同意しているけど、主な問題は運転手不足だったとしているよ。
    note: 情報源Bは、ある点では同意していますが、原因については見解が異なります。
  en.b2.unit08.lesson04.teach.q_agree_conflict:
    title: テッサが統合する
    gloss: テッサ:つまり、需要が増えたという点では情報源が一致しているけど、原因については対立しているのね。
    note: '*agree on* と *conflict about* が、情報源どうしの関係をまとめています。'
  en.b2.unit08.lesson04.teach.a_better_supported:
    title: ローワンが根拠を尋ねる
    gloss: ローワン:どちらの報告のほうが、裏づけがしっかりしている?
    note: 彼は、要約だけではなく、判断を求めています。
  en.b2.unit08.lesson04.teach.q_evidence_compare:
    title: テッサが根拠を比べる
    gloss: テッサ:アンケートには乗客の意見がたくさんあるけど、運行会社の報告書には人員配置の記録が含まれているわ。
    note: これは根拠についての問いです。意見と記録の違いに注目します。
  en.b2.unit08.lesson04.teach.a_judgement_question:
    title: ローワンが判断を求める
    gloss: ローワン:それで、君の判断は?
    note: '*judgment* は、根拠のある結論を求める言葉です。'
  en.b2.unit08.lesson04.teach.q_final_judgement:
    title: テッサが判断を述べる
    gloss: テッサ:原因については運行会社の報告書のほうが裏づけがしっかりしているわ。ただ、アンケートも乗客の体験を知るには役に立つけどね。
    note: '*although* を使うと、両方の情報源を視野に入れたまま、判断を述べられます。'
