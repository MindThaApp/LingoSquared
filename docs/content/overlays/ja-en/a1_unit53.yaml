course:
  title: 英語 A1
  description: あいさつや日常の短い会話ができるようになる、A1レベルの英語コースです。日本語で詳しく解説します。
units:
  en.a1.unit53.bike_rental:
    title: 自転車を借りる
lessons:
  en.a1.unit53.lesson01.bike_rental_vocabulary:
    title: 自転車を借りるときの単語
  en.a1.unit53.lesson02.phrases_for_renting_a_bike:
    title: 自転車を借りるときの文
  en.a1.unit53.lesson03.dialogue_at_the_rental_shop:
    title: 会話：レンタサイクルのお店で
  en.a1.unit53.lesson04.a_bike_ride_along_the_river:
    title: 読み物：川沿いのサイクリング
teaching:
  en.a1.unit53.lesson01.teach.rent:
    title: rent
    gloss: 借りる
    note: '*rent* は「借りる」という意味です。注意：英語の *rent* は、借りる側にも貸す側にも使います（だれかから借りる、だれかに貸す）。日本語では「借りる」と「貸す」が別の動詞なので、文脈でどちらの意味かを判断しましょう。'
    example_gloss: 自転車を借りたいです。
  en.a1.unit53.lesson01.teach.deposit:
    title: deposit
    gloss: 保証金、デポジット
    note: '*deposit* は「保証金、デポジット」という意味です。先に払っておくお金で、自転車を壊さずに返せば戻ってきます。'
    example_gloss: デポジットは20ドルです。
  en.a1.unit53.lesson01.teach.return:
    title: return
    gloss: 返す
    note: ここでの *return* は「返す」という意味です（「帰る」ではありません）。
    example_gloss: 自転車は今日中に返してください。
  en.a1.unit53.lesson01.teach.hour:
    title: hour
    gloss: 1時間
    note: '*hour* は「1時間、時間」という意味です。'
    example_gloss: 1時間10ドルです。
  en.a1.unit53.lesson01.teach.size:
    title: size
    gloss: サイズ
    note: '*size* は「サイズ」という意味です。'
    example_gloss: どのサイズが必要ですか。
  en.a1.unit53.lesson01.teach.helmet:
    title: helmet
    gloss: ヘルメット
    note: '*helmet* は「ヘルメット」という意味です。'
    example_gloss: ヘルメットはありますか。
  en.a1.unit53.lesson02.teach.id_like_to_rent_a_bike:
    title: I'd like to rent a bike, please.
    gloss: 自転車を借りたいのですが。
    note: '*I''d like to*（*I would like to* の短い形）は、丁寧に頼む言い方です。直接的な *I want* よりも、やわらかい感じになります。'
  en.a1.unit53.lesson02.teach.how_much_does_it_cost_per_hour:
    title: How much does it cost per hour?
    gloss: 1時間いくらですか。
    note: '*does it cost* では助動詞 *does* を使います。主な動詞が *cost* だからで、ほかの英語の疑問文と同じように *do* を使う形です。'
  en.a1.unit53.lesson02.teach.i_need_a_small_bike:
    title: I need a small bike.
    gloss: 小さい自転車が必要です。
    note: '*need a small bike* のように、英語では動詞 *need* のあとに名詞を続けます。日本語の「小さい自転車が必要です」とほぼ同じように言えます。'
  en.a1.unit53.lesson02.teach.can_i_have_a_helmet:
    title: Can I have a helmet, please?
    gloss: ヘルメットをいただけますか。
    note: '*Can I have ...?* は、お店で何かをお願いするときの決まった丁寧な言い方です。直訳すると「…を持てますか」ですが、英語では日本語の「…をいただけますか」と同じくらい丁寧に聞こえます。'
  en.a1.unit53.lesson02.teach.when_do_i_need_to_return_it:
    title: When do I need to return it?
    gloss: いつ返せばいいですか。
    note: '*do I need to* でも、疑問文を作るために助動詞 *do* を使います。'
  en.a1.unit53.lesson02.teach.its_ten_dollars_an_hour:
    title: It's ten dollars an hour.
    gloss: 1時間10ドルです。
    note: ここでの *an hour* は「1時間につき」という意味です。冠詞の *an* が「…につき」の意味で使われています。ほかの時間の単位の *a* も同じです。
  en.a1.unit53.lesson03.teach.dialogue_line1:
    title: 店員のあいさつ
    gloss: 店員：こんにちは！今日はどうなさいますか。
    note: '*How can I help you today?* は、お店やサービスでよく使われる、決まった丁寧な最初の言葉です。'
  en.a1.unit53.lesson03.teach.dialogue_line2:
    title: ミアの依頼
    gloss: ミア：自転車を2台借りたいです。川沿いを走りたいんです。
    note: '*We''d like to rent* の *rent* も、ここでは店から「借りる」という意味です（貸すのではありません）。'
  en.a1.unit53.lesson03.teach.dialogue_line3:
    title: 店員がサイズをたずねる
    gloss: 店員：かしこまりました。サイズはどれが必要ですか。
    note: '*What size do you need?* でも、疑問文を作るために助動詞 *do* を使います。'
  en.a1.unit53.lesson03.teach.dialogue_line4:
    title: レイラのサイズ
    gloss: レイラ：小さいのが必要です。
    note: ここでの *one* は *bike* の代わりに使われていて、同じ語をくり返さずにすみます。日本語の「小さいの」の「の」に似ていますが、英語の *one* は独立した単語です。
  en.a1.unit53.lesson03.teach.dialogue_line5:
    title: ミアのサイズ
    gloss: ミア：私は中くらいのが必要です。
    note: ここでも *bike* の代わりに *one* が使われています。レイラの前の文と同じです。
  en.a1.unit53.lesson03.teach.dialogue_line6:
    title: 料金とデポジット
    gloss: 店員：はい、こちらがお客様の自転車です。1時間10ドルで、デポジットは20ドルです。
    note: この文には、別々の2つの情報（1時間の料金とデポジット）が入っています。混同しないようにしましょう。
  en.a1.unit53.lesson03.teach.dialogue_line7:
    title: ミアが返却について聞く
    gloss: ミア：いつまでに返せばいいですか。
    note: ここでの *them* は、前に出た自転車（複数）を指しています。
  en.a1.unit53.lesson03.teach.dialogue_line8:
    title: 返却の時間
    gloss: 店員：5時までに返してください。
    note: '*by five o''clock* は「5時までに」という意味で、それより後ではいけません。'
  en.a1.unit53.lesson03.teach.dialogue_line9:
    title: レイラが店員にお礼を言う
    gloss: レイラ：わかりました、ありがとうございます！
    note: '*Great, thank you!* は、会話を丁寧に終えるときの、短くて決まった言い方です。'
  en.a1.unit53.lesson04.teach.reading_passage:
    title: 川沿いのサイクリングの文章
    gloss: ある暖かい午後、ミアはレイラを、自分のアパートの近くの川沿いのサイクリングに誘いました。二人とも自転車を持っていなかったので、いっしょにレンタサイクルのお店に行きました。店員がどのサイズが必要かたずね、レイラは小さい自転車、ミアは中くらいの自転車を選びました。料金は1時間10ドルで、デポジットは2台で20ドルでした。自転車は5時までに返さなければなりませんでした。川沿いの道はとても美しく、犬を散歩させている人たちや、晴れた天気を楽しんでいる人たちを見かけました。二人は自転車をちょうど時間どおりに返し、デポジットも戻ってきました。そのあと、ダニエルにサイクリングのことを話すと、彼は次はいっしょに行きたいと言いました。
    note: '*owned* は *own*（持っている）の過去形です。*Neither of them owned a bike* は「二人とも自転車を持っていなかった」という意味です。'
