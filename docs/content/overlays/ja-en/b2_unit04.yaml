teaching:
  en.b2.unit04.lesson01.teach.background:
    title: background
    gloss: 背景
    note: '*background* は、すでに進行していたこと、または状況を説明する文脈のことです。英語の物語では、背景を past continuous で表すことがよくあります。'
    example_gloss: 背景情報は、すでに何が起きていたかを伝えます。
  en.b2.unit04.lesson01.teach.foreground:
    title: foreground
    gloss: 物語の中心となる出来事
    note: '*foreground* は、物語が向かっていく中心の出来事です。英語では、現在完了ではなく simple past を使うことが多いです。'
    example_gloss: 中心となる出来事は、物語の中で最も重要な出来事です。
  en.b2.unit04.lesson01.teach.prior:
    title: prior
    gloss: 以前の、それより前の
    note: '*prior* は、過去の別の時点より前を意味します。多くの場合 past perfect になり、*had moved* のようになります。'
    example_gloss: それ以前の出来事は、過去の別の出来事より前に起こりました。
  en.b2.unit04.lesson01.teach.interrupt:
    title: interrupt
    gloss: 中断する、割り込む
    note: '*interrupt* は、進行中のことに短い出来事が割り込むときに使います。'
    example_gloss: 突然の問題が、動作を中断させることがあります。
  en.b2.unit04.lesson01.teach.ongoing:
    title: ongoing
    gloss: 進行中の
    note: '*ongoing* は、日本語の「〜していた」「〜しているところだった」に近い意味の語です。英語では、*was/were + -ing* で表すことがよくあります。'
    example_gloss: 進行中の動作は、しばらくの間続きます。
  en.b2.unit04.lesson01.teach.chronology:
    title: chronology
    gloss: 時系列、実際の順序
    note: '*chronology* は、物語が別の順序で語っていても、出来事が実際に起こった順序のことです。'
    example_gloss: 時系列とは、出来事が実際に起こった順序のことです。
  en.b2.unit04.lesson02.teach.by_the_time:
    title: 以前にすでに起きていたこと
    gloss: 私が到着するまでに、コーディネーターはすでに機材を屋内へ移していました。
    note: '*had already moved* は、それが *I arrived* より前に起きたことを示します。英語では *has moved* ではなく、*had moved* を使います。'
  en.b2.unit04.lesson02.teach.while_checking:
    title: 進行中の動作と、それを中断した出来事
    gloss: 私が音響システムを確認している間に、停電しました。
    note: '*was checking* は「確認していた」という進行中の動作を表します。中断する出来事そのものは simple past で、*went out* と言います。'
  en.b2.unit04.lesson02.teach.when_arrived_setting:
    title: 背景の動作の最中に到着する
    gloss: 私が到着したとき、ボランティアの人たちは椅子を並べているところでした。
    note: 中心となる出来事が起きたときに進行していたことには、*were setting up* を使います。
  en.b2.unit04.lesson02.teach.grammar_shifted_time:
    title: 物語の時間の層
    gloss: 背景の動作には past continuous を、中心となる出来事には simple past を、過去の別の時点より前に起きたことには past perfect を使います。
    note: 物語を英語で語るときは、現在完了ではなく simple past を使うことが多いです。たとえば *the power went out* と言い、*has gone out* とは言いません。
  en.b2.unit04.lesson03.teach.venue:
    title: venue
    gloss: 会場、開催場所
    note: '*venue* は、イベントが行われる場所のことです。'
    example_gloss: 会場とは、イベントが開催される場所です。
  en.b2.unit04.lesson03.teach.delayed:
    title: delayed
    gloss: 遅れた、延期された
    note: '*delayed* は、予定より遅く始まる、または起こるという意味です。'
    example_gloss: イベントは二十分遅れて始まりました。
  en.b2.unit04.lesson03.teach.reading_passage:
    title: 読解：会場でのトラブル
    gloss: サイモンは、この話を厳密な時系列では語りませんでした。サイモンが会場に着く前に、コーディネーターは雨が予想されていたため、機材を屋内へ移していました。サイモンが着いたとき、ボランティアの人たちは椅子を並べているところでした。彼が音響システムを確認している間に、停電が起きました。彼が建物の管理者に電話をすると、その日の朝早く、近くで修理班が作業をしていたと説明されました。チームは開始を二十分遅らせましたが、招待客が入場するころには、照明は再びついていました。
    note: 英語の時間の層に注目しましょう。以前のことには *had moved*、背景には *were setting up*、中心となる出来事には *went out* を使っています。
  en.b2.unit04.lesson04.teach.q_walk_me_through:
    title: ハーパーが話をたずねる
    gloss: ハーパー：会場で何が起きたのか、順を追って話してもらえますか。
    note: '*walk me through* は、ある出来事を、相手に順を追って説明することを意味します。'
  en.b2.unit04.lesson04.teach.a_arrived_volunteers:
    title: サイモンが時間の層を組み合わせる
    gloss: サイモン：もちろんです。私が着いたとき、ボランティアの人たちは椅子を並べているところでしたが、コーディネーターは雨が予想されていたので、すでに機材を屋内へ移していました。
    note: よい語りは、背景の動作とそれ以前の出来事を組み合わせます。
  en.b2.unit04.lesson04.teach.q_equipment_safe:
    title: ハーパーが順序を確認する
    gloss: ハーパー：では、あなたが着く前に、機材は安全な状態だったのですね。
    note: この質問は順序についてのものです。サイモンが着く前に、機材はすでに安全な状態でした。
  en.b2.unit04.lesson04.teach.a_power_went_out:
    title: サイモンが中断を述べる
    gloss: サイモン：そのとおりです。そのあと、私が音響システムを確認している間に、停電しました。
    note: '*while I was checking* は進行中の動作で、*the power went out* はそれを中断した出来事です。'
  en.b2.unit04.lesson04.teach.q_after_that:
    title: ハーパーが次の行動をたずねる
    gloss: ハーパー：そのあと、どうしましたか。
    note: '*What did you do...?* は、終わった行動についての質問で、*did* を使った simple past です。'
  en.b2.unit04.lesson04.teach.a_repair_crew:
    title: サイモンが以前の背景を伝える
    gloss: サイモン：建物の管理者に電話をしたところ、その日の朝早く、近くで修理班が作業をしていたと教えてくれました。
    note: '*had been working* は、その作業がその朝の早い時間にすでに行われていたことを示します。'
  en.b2.unit04.lesson04.teach.q_event:
    title: ハーパーがイベントについてたずねる
    gloss: ハーパー：イベントはどうでしたか。
    note: この短い質問は、イベントにどんな影響があったかをたずねています。
  en.b2.unit04.lesson04.teach.a_delayed_start:
    title: サイモンが締めくくる
    gloss: サイモン：開始を二十分遅らせましたが、招待客が入場するころには、照明は再びついていました。
    note: '*had come back on* は、招待客が入場した時点より前に起きたことです。'
