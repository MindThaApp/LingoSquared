  en.b2.unit04.lesson04.exercise04.reply_as_simon:
    instruction: ハーパーが、何が起きたかをたずねています。サイモンとして、到着したときボランティアの人たちは椅子を並べているところだったが、コーディネーターはすでに機材を屋内へ移していた、と答えてください。
    accepted_answers:
    - value: When I arrived, the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside.
      status: correct
    - value: When I arrived the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside.
      status: correct
    - value: Sure. When I arrived, the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside.
      status: correct
    - value: Sure. When I arrived the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside.
      status: correct
    feedback: この文は、*were setting up* と *had already moved* を組み合わせています。
  en.b2.unit04.lesson04.exercise05.speak_recount:
    instruction: 会場でのトラブルについて、四つの要素を入れて声に出して語ってください。背景、それ以前の出来事、中断された動作、そして解決した結末です。
    accepted_answers:
    - value: When I arrived, the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside. While I was checking the sound system, the power went out. We delayed the start, but by the time guests entered, the lights had come back on.
