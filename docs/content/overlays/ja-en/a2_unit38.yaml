  description: もう少し改まった日常の場面で使える、A2レベルの英語コースです。日本語で詳しく解説します。
units:
  en.a2.unit38.repair_visit:
    title: 修理の予約を変更して確認する
lessons:
  en.a2.unit38.lesson01.repair_visit_vocabulary:
    title: 予約の変更、鍵、隣の人
  en.a2.unit38.lesson02.moving_the_appointment:
    title: 予約を別の時間に変更する
  en.a2.unit38.lesson03.reading_a_rescheduling_message:
    title: 新しい予約についてのメッセージを読む
  en.a2.unit38.lesson04.repair_visit_dialogue:
    title: 修理の日時を変更するために電話する
teaching:
  en.a2.unit38.lesson01.teach.reschedule:
    title: reschedule
    gloss: 日時を変更する
    note: '*reschedule* は、予約を別の時間に変更するという意味です。'
    example_gloss: その時間は仕事があるので、修理の日時を変更しなければなりません。
  en.a2.unit38.lesson01.teach.neighbor:
    title: neighbor
    gloss: 隣人、隣に住んでいる人
    note: '*neighbor* は、あなたの隣に住んでいる人のことです。男性にも女性にも使えます。'
    example_gloss: 隣の人が、配管工のためにドアを開けてくれます。
  en.a2.unit38.lesson01.teach.key:
    title: key
    gloss: 鍵
    note: '*key* は、ドアを開けるための小さな金属の道具です。'
    example_gloss: 鍵は隣の人に預けておきます。
  en.a2.unit38.lesson01.teach.leak:
    title: leak
    gloss: 水漏れ
    note: ここでの *leak* は名詞で、水が漏れ出している箇所そのものを表します。動詞の *to leak* は「漏れる」という意味です。
    example_gloss: 台所の流しの下の水漏れが、ひどくなってきています。
  en.a2.unit38.lesson01.teach.fixed:
    title: fixed
    gloss: 修理された、直った
    note: '*fixed* は *to fix*（直す）の過去分詞で、もう壊れていないという意味です。'
    example_gloss: 流しはもう直って、水は止まりました。
  en.a2.unit38.lesson01.teach.afternoon:
    title: afternoon
    gloss: 午後
    note: '*afternoon* は、正午から夕方までの時間帯です。午前は *morning* といいます。'
    example_gloss: 配管工が来たのは、午前ではなく午後でした。
  en.a2.unit38.lesson01.teach.grammar_cant_wont:
    title: うまくいかないときの can't と won't
    gloss: 午後2時から4時のあいだは、家にいられません。午後は家にいません。
    note: '*can''t* は、できない、つまり無理だという意味です。*won''t* は、これから先そうならないという意味です。'
  en.a2.unit38.lesson02.teach.need_to_reschedule:
    title: 予約を変更したいと伝える
    gloss: 修理の日時を変更しなければなりません。
    note: '*I need to ...* は、必要だということを事務的に伝える言い方で、失礼には聞こえません。'
  en.a2.unit38.lesson02.teach.possible_in_the_morning:
    title: 別の時間をお願いする
    gloss: 代わりに、午前中に来ていただくことは可能でしょうか？
    note: '*Would it be possible to ...?* は、お願いをするときのいちばん控えめな言い方です。*instead* は「代わりに」という意味です。'
  en.a2.unit38.lesson02.teach.leave_key_with_neighbor:
    title: 鍵の場所を伝える
    gloss: 鍵は隣の人に預けておきます。
    note: '*leave something with someone* は、あるものを人に預けておくという意味です。'
  en.a2.unit38.lesson02.teach.is_the_leak_fixed:
    title: 問題が解決したかをたずねる
    gloss: 水漏れはもう直りましたか？
    note: '*Is ... fixed?* は、作業そのものではなく、結果をたずねる言い方です。'
  en.a2.unit38.lesson02.teach.grammar_because_reason:
    title: because で理由を言う
    gloss: 仕事があるので、午後2時から4時のあいだは家にいられません。
    note: '*because* は、問題と理由をつなぎます。*because* のあとも、ふつうの文と同じ語順（主語＋動詞）のままです。'
  en.a2.unit38.lesson03.teach.message:
    title: message
    gloss: メッセージ
    note: '*message* は、短い文章のやりとりのことで、ショートメッセージ、チャットのメッセージ、短いメールなどを指します。'
    example_gloss: 新しい修理の時間についてのメッセージが届きました。
  en.a2.unit38.lesson03.teach.rescheduling_text:
    title: 新しい日程のメッセージ
    gloss: 修理6180の日時が変更されました。配管工は明日の午前9時から11時のあいだに伺います。ドアは隣の方が開けてくれます。この新しい日時を、本日中にメッセージで確認してください。
    note: 管理会社からのメッセージは、短く事務的で、何が変わったか、いつか、あなたが何をすべきかが書かれています。
  en.a2.unit38.lesson03.teach.confirm_by_message:
    title: 確認を求められる
    gloss: この新しい日時を、本日中にメッセージで確認してください。
    note: '*confirm* は「確認する」、*by message* は「メッセージで」という意味です。'
  en.a2.unit38.lesson04.teach.q_need_to_reschedule:
    title: ダニエルが管理会社に電話する
    gloss: ダニエルが言います：もしもし、修理の日時を変更したいのですが。
    note: 電話では *Hello* で始めて、すぐに用件を伝えます。
  en.a2.unit38.lesson04.teach.a_which_repair:
    title: 管理会社がどの修理かをたずねる
    gloss: 管理会社が言います：かしこまりました。どの修理ですか？
    note: '*Which repair is it?* は、いくつかある中から1つをたずねる言い方です。'
  en.a2.unit38.lesson04.teach.q_repair_6180:
    title: ダニエルが修理番号を伝える
    gloss: ダニエルが言います：修理6180、台所の流しの下の水漏れです。
    note: ユニット29と同じ修理番号で、同じ流しの水漏れです。
  en.a2.unit38.lesson04.teach.a_why_cant_you_be_home:
    title: 管理会社が理由をたずねる
    gloss: 管理会社が言います：わかりました。なぜ家にいられないのですか？
    note: '*Why can''t you ...?* は、うまくいかない理由をたずねる言い方です。'
  en.a2.unit38.lesson04.teach.q_at_work_ask_morning:
    title: ダニエルが理由を伝えて午前中をお願いする
    gloss: ダニエルが言います：仕事があるので、午後2時から4時のあいだは家にいられません。代わりに、午前中に来ていただくことは可能でしょうか？
    note: 先に理由を言ってからお願いすると、いきなり要求するより丁寧に聞こえます。
  en.a2.unit38.lesson04.teach.a_plumber_can_come_morning:
    title: 管理会社が新しい期間を提案する
    gloss: 管理会社が言います：はい、配管工は午前9時から11時のあいだに伺えます。
    note: '*between 9am and 11am* が新しい時間帯です。'
  en.a2.unit38.lesson04.teach.q_leave_key:
    title: ダニエルが鍵の件を片づける
    gloss: ダニエルが言います：ありがとうございます。鍵は隣の人に預けておきます。
    note: レッスン2と同じ文です。
  en.a2.unit38.lesson04.teach.a_please_confirm:
    title: 管理会社が確認を求める
    gloss: 管理会社が言います：わかりました。この新しい日時を、本日中にメッセージで確認してください。
    note: レッスン3のメッセージにあった依頼と同じです。
  en.a2.unit38.lesson04.teach.q_will_confirm_this_afternoon:
    title: ダニエルがいつ確認するかを言う
    gloss: ダニエルが言います：今日の午後に確認します。
    note: '*this afternoon* は「今日の午後」という意味で、今日の12時以降のことです。'
