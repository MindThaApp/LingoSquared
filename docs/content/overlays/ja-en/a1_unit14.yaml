teaching:
  en.a1.unit14.lesson01.teach.hello_this_is:
    title: Hello, this is Daniel.
    gloss: もしもし、ダニエルです。
    note: '*this is [Name]* は、電話で名乗るときの言い方です。顔を合わせて自己紹介する *I''m* とは使い分けます。'
  en.a1.unit14.lesson01.teach.hi_its:
    title: Hi, it's Leila.
    gloss: もしもし、レイラだよ。
    note: '*it''s [Name]* は、*this is [Name]* より短く、くだけた言い方です。'
  en.a1.unit14.lesson01.teach.are_you_free:
    title: Are you free tonight?
    gloss: 今夜、時間ある?
    note: '*free* は、ここでは「無料」ではなく「時間があいている」という意味です。'
  en.a1.unit14.lesson02.teach.can_you_repeat:
    title: Sorry, can you repeat that?
    gloss: すみません、もう一度言っていただけますか。
    note: '*Sorry* は、くり返しのお願いを丁寧に切り出す言葉です。'
  en.a1.unit14.lesson02.teach.speak_slowly:
    title: Can you speak more slowly, please?
    gloss: もう少しゆっくり話していただけますか。
    note: '*more slowly* は「もっとゆっくり」という意味で、*slowly* の比較の形です。'
  en.a1.unit14.lesson02.teach.i_cant_hear:
    title: I can't hear you well.
    gloss: よく聞こえません。
    note: '*can''t hear* は「聞こえない」という意味で、電話の接続が悪いときによく使います。'
  en.a1.unit14.lesson03.teach.are_you_free_at:
    title: Are you free at 6pm?
    gloss: 6時に時間ある?
    note: '*at 6pm* は、正確な時刻を表します。'
  en.a1.unit14.lesson03.teach.text_message_text:
    title: テキストメッセージ
    gloss: こんにちは、レイラ。6時に時間ある?カフェで会おうよ。
    note: 短いテキストメッセージでは、時間をたずねる質問と、具体的な提案をいっしょに書きます。
  en.a1.unit14.lesson03.teach.purpose_summary:
    title: This message is to suggest a meeting time and place.
    gloss: このメッセージは、会う時間と場所を提案するためのものです。
    note: '*to suggest* は「提案する」という意味で、メッセージの目的を表します。'
  en.a1.unit14.lesson04.teach.how_about:
    title: How about 6pm at the cafe?
    gloss: 6時にカフェはどうですか。
    note: '*How about...?* は、時間や場所を丁寧に提案する言い方です。'
  en.a1.unit14.lesson04.teach.a_hello:
    title: レイラのあいさつ
    gloss: レイラ:もしもし、レイラです。
    note: レイラは、電話で自分の名前を言って出ます。
  en.a1.unit14.lesson04.teach.q_free_tonight:
    title: ダニエルの質問
    gloss: ダニエル:やあ、レイラ、ダニエルだよ。今夜、時間ある?
    note: ダニエルは名乗って、すぐに相手の都合をたずねます。
  en.a1.unit14.lesson04.teach.a_repeat_request:
    title: レイラのお願い
    gloss: レイラ:ごめん、もう一度言ってくれる?
    note: レイラは質問が聞き取れなかったので、もう一度言ってもらうようお願いしています。
  en.a1.unit14.lesson04.teach.repeat_question:
    title: ダニエルのくり返しの質問
    gloss: ダニエル:今夜、時間ある?
    note: ダニエルは、まったく同じ質問をくり返します。
  en.a1.unit14.lesson04.teach.a_yes_what_time:
    title: レイラの答え
    gloss: レイラ:ああ、あるよ!何時?
    note: レイラは承諾して、正確な時刻をたずねます。
  en.a1.unit14.lesson04.teach.suggest_time_place:
    title: ダニエルの提案
    gloss: ダニエル:6時にカフェはどう?
    note: ダニエルは、時間と場所を1つの文で提案します。
