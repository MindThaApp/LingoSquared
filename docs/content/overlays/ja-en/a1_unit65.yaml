teaching:
  en.a1.unit65.lesson01.teach.return:
    title: return
    gloss: 返品する
    note: '*return* は、買ったものを店に返すという意味です。'
    example_gloss: これを返品したいです。
  en.a1.unit65.lesson01.teach.exchange:
    title: exchange
    gloss: 交換する
    note: '*exchange* は、ある商品を別の商品と取りかえるという意味です。'
    example_gloss: 交換できますか？
  en.a1.unit65.lesson01.teach.receipt:
    title: receipt
    gloss: レシート
    note: '*receipt* は、買い物をした証明になる「レシート」のことです。'
    example_gloss: レシートはお持ちですか？
  en.a1.unit65.lesson01.teach.size:
    title: size
    gloss: サイズ
    note: '*size* は、たとえば服の「サイズ」という意味です。'
    example_gloss: もっと大きいサイズが必要です。
  en.a1.unit65.lesson01.teach.refund:
    title: refund
    gloss: 返金
    note: '*refund* は、戻ってくるお金、つまり「返金」という意味です。'
    example_gloss: 返金してもらえます。
  en.a1.unit65.lesson01.teach.small:
    title: small
    gloss: 小さい
    note: '*small* は「小さい」という意味です。'
    example_gloss: このサイズは小さすぎます。
  en.a1.unit65.lesson02.teach.want_return:
    title: I want to return this.
    gloss: これを返品したいです。
    note: '*I want to return this* は、返品カウンターで使う、率直な言い方です。'
  en.a1.unit65.lesson02.teach.can_exchange:
    title: Can I exchange it?
    gloss: 交換できますか？
    note: '*Can I...?* は、何かができるかどうか、してよいかどうかをたずねる表現です。'
  en.a1.unit65.lesson02.teach.have_receipt:
    title: Do you have the receipt?
    gloss: レシートはお持ちですか？
    note: '*receipt* は、支払いをしたことを示すレシートのことです。'
  en.a1.unit65.lesson02.teach.too_small:
    title: This size is too small.
    gloss: このサイズは小さすぎます。
    note: '*too small* は「小さすぎる」という意味です。'
  en.a1.unit65.lesson02.teach.larger_size:
    title: I need a larger size.
    gloss: もっと大きいサイズが必要です。
    note: '*larger* は「もっと大きい」という意味です。'
  en.a1.unit65.lesson02.teach.get_refund:
    title: You can get a refund.
    gloss: 返金してもらえます。
    note: '*get a refund* は「返金してもらう」という意味です。'
  en.a1.unit65.lesson03.teach.dialogue_line1:
    title: ダニエルが返品したがっています
    gloss: ダニエルは「こんにちは。このシャツを返品したいのですが」と言います。
    note: '*return this shirt* は「このシャツを返品する」という意味です。'
  en.a1.unit65.lesson03.teach.dialogue_line2:
    title: 店員がレシートを求めます
    gloss: 店員は「レシートはお持ちですか？」と言います。
    note: '*Do you have...?* は、相手がそれを持っているかどうかをたずねる表現です。'
  en.a1.unit65.lesson03.teach.dialogue_line3:
    title: ダニエルはレシートを持っています
    gloss: ダニエルは「はい、こちらです。サイズが小さすぎるんです」と言います。
    note: '*Here it is* は「はい、これです」という意味です。'
  en.a1.unit65.lesson03.teach.dialogue_line4:
    title: 店員が交換を提案します
    gloss: 店員は「もっと大きいサイズと交換できますよ」と言います。
    note: '*for a larger size* は、何と交換するかを表しています。'
  en.a1.unit65.lesson03.teach.dialogue_line5:
    title: "ダニエルが承諾する"
    gloss: ダニエルは「はい、お願いします」と言います。
    note: '*Yes, please* は、丁寧に「はい」と答える言い方です。'
  en.a1.unit65.lesson03.teach.dialogue_line6:
    title: もっと大きいサイズがあります
    gloss: 店員は「もっと大きいサイズが青でございます」と言います。
    note: '*We have...* は、何があるかを伝える表現です。'
  en.a1.unit65.lesson03.teach.dialogue_line7:
    title: ダニエルは返金は必要ありません
    gloss: ダニエルは「よかった。返金は必要ありません」と言います。
    note: '*I do not need* は「私は必要ありません」という意味です。'
  en.a1.unit65.lesson04.teach.return_note:
    title: 返品メモ
    gloss: 返品メモ：青いシャツ。サイズ：小。大きいサイズに交換。レシートが必要です。
    note: このメモには、商品、サイズ、手続き、レシートについて書かれています。
  en.a1.unit65.lesson04.teach.reading_passage:
    title: 本文：お店での交換
    gloss: お店での交換：ダニエルは青いシャツを買いましたが、サイズが小さすぎました。彼はレシートを持って店に戻りました。店員はレシートを求め、もっと大きいサイズを出してくれました。ダニエルはシャツを交換しました。大きい青いシャツで問題なかったので、返金は必要ありませんでした。
    note: '*exchanged* は *exchange* の過去形です。'
