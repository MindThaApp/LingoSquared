teaching:
  en.a1.unit42.lesson01.teach.friendly:
    title: friendly
    gloss: 親しみやすい／感じのよい
    note: '*friendly* は「感じがよくて、話しやすい」という意味です。'
    example_gloss: 私の隣の人はとても感じのよい人です。
  en.a1.unit42.lesson01.teach.funny:
    title: funny
    gloss: おもしろい
    note: '*funny* は「おもしろい」、つまりまわりの人を笑わせる人という意味です。'
    example_gloss: 私の兄は本当におもしろいです。
  en.a1.unit42.lesson01.teach.hardworking:
    title: hardworking
    gloss: 努力家の／よく働く
    note: '*hardworking* は「努力家の」、つまり簡単にはあきらめない人という意味です。'
    example_gloss: 彼女はよく働く社員です。
  en.a1.unit42.lesson01.teach.shy:
    title: shy
    gloss: 内気な／恥ずかしがりの
    note: '*shy* は「内気な」、つまり新しい人に会うと緊張したり、恥ずかしがったりするという意味です。'
    example_gloss: 彼は最初は少し内気です。
  en.a1.unit42.lesson01.teach.calm:
    title: calm
    gloss: 落ち着いた
    note: '*calm* は「落ち着いた」、つまりすぐには取り乱したり、緊張したりしないという意味です。'
    example_gloss: 私の母はとても落ち着いています。
  en.a1.unit42.lesson01.teach.talkative:
    title: talkative
    gloss: おしゃべりな
    note: '*talkative* は「おしゃべりな」、つまりたくさん話す人という意味です。'
    example_gloss: 私の姉はとてもおしゃべりです。
  en.a1.unit42.lesson02.teach.a_little_shy:
    title: a little shy
    gloss: 少し内気な
    note: ここでの *a little* は「少し」という程度を表し、大きさが「小さい」という意味ではありません。
    example_gloss: 彼は最初は少し内気ですが、すぐに打ち解けます。
  en.a1.unit42.lesson02.teach.very_hardworking:
    title: very hardworking
    gloss: とても努力家の
    note: '*very hardworking* は「とても努力家の」という意味です。'
    example_gloss: 私の同僚はとても努力家です。
  en.a1.unit42.lesson02.teach.have_a_great_sense_of_humor:
    title: have a great sense of humor
    gloss: すばらしいユーモアのセンスがある
    note: '*have a great sense of humor* は「ユーモアのセンスがすばらしい」という意味です。'
    example_gloss: ダニエルはユーモアのセンスがすばらしいです。
  en.a1.unit42.lesson02.teach.get_along_with_everyone:
    title: get along with everyone
    gloss: だれとでも仲よくする
    note: '*get along with everyone* は「だれとでも仲よくする」という意味です。'
    example_gloss: ミアは職場のだれとでも仲よくしています。
  en.a1.unit42.lesson02.teach.warm_up_quickly:
    title: warm up quickly
    gloss: すぐに打ち解ける
    note: '*warm up quickly* は、新しい人にすぐに慣れて、打ち解けるという意味です。'
    example_gloss: 彼は内気ですが、知り合うとすぐに打ち解けます。
  en.a1.unit42.lesson02.teach.whats_he_like_question:
    title: What's he like?
    gloss: 彼はどんな人ですか。
    note: '*What''s he like?* は、見た目ではなく、その人の性格をたずねる表現です。'
  en.a1.unit42.lesson03.teach.dialogue_line1:
    title: ミアの質問
    gloss: ミア：来週、ダニエルと新しいプロジェクトを始めるの。彼ってどんな人？
    note: '*What''s he like?* は、その人の性格をたずねる表現です。'
  en.a1.unit42.lesson03.teach.dialogue_line2:
    title: "レイラの答え"
    gloss: レイラ：とても感じがよくて、本当におもしろい人よ。
    note: '*and he''s really funny too* は「それに、本当におもしろい」という意味です。'
  en.a1.unit42.lesson03.teach.dialogue_line3:
    title: ミアの質問
    gloss: ミア：それはよかった！いっしょに仕事はしやすい？
    note: '*Is he easy to work with?* は、その人といっしょに働きやすいかどうかをたずねる表現です。'
  en.a1.unit42.lesson03.teach.dialogue_line4:
    title: "レイラの答え"
    gloss: レイラ：うん、努力家でもあるわ。仕事はいつも期限どおりに終わらせるの。
    note: '*finishes his tasks on time* は「仕事を期限どおりに終わらせる」という意味です。'
  en.a1.unit42.lesson03.teach.dialogue_line5:
    title: ミアの質問
    gloss: ミア：会議で内気になることはある？
    note: ここでの *ever* は「これまでに、ときどき」という意味です。
  en.a1.unit42.lesson03.teach.dialogue_line6:
    title: "レイラの答え"
    gloss: レイラ：少しね。でも、知り合うともっと気楽に話せるようになるわ。
    note: '*once he knows you* は「知り合ったら」という意味です。'
  en.a1.unit42.lesson03.teach.dialogue_line7:
    title: ミアのお礼
    gloss: ミア：ありがとう、レイラ。これでプロジェクトのことがだいぶ気楽になったわ。
    note: '*I feel more relaxed* は「前より気が楽になった」という意味です。'
  en.a1.unit42.lesson04.teach.reading_passage:
    title: 3つの性格についての文章
    gloss: ダニエル、レイラ、ミアは仲のよい友だちですが、性格はまったくちがいます。ダニエルは感じがよくておもしろい人で、いつも友だちを笑わせています。新しい人に会うと少し内気になりますが、すぐに打ち解けます。レイラは落ち着いていて、創造的です。絵を描くとリラックスできるので絵が大好きで、何があってもめったに取り乱しません。ミアは外向的で、きちんとした人です。みんなの計画を立てるのが好きで、友だちに新しいことを教えるときはとても辛抱強く、ダニエルに料理を教えました。3人はみんなちがいますが、仲がよく、いっしょに過ごすのを楽しんでいます。
    note: '*even though* は「〜だけれども」という意味です。'
