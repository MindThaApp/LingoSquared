course:
  title: 英語 B2
  description: B2レベルの英語を学び、ニュアンスのある会話、議論、推測、職場での話し合いができるようになります。説明は日本語で行います。
units:
  en.b2.unit07.negotiation:
    title: On condition that the scope is reduced
lessons:
  en.b2.unit07.lesson01_terms_and_concessions:
    title: 条件、拒否、譲歩
  en.b2.unit07.lesson02_conditional_terms:
    title: I can agree on condition that...
  en.b2.unit07.lesson03.reading_revised_terms:
    title: 読解:何が決まったのか
  en.b2.unit07.lesson04.the_negotiation_dialogue:
    title: Agreed, with a condition
teaching:
  en.b2.unit07.lesson01.teach.term:
    title: term
    gloss: 取り決めの個々の条項
    note: '*term* は、取り決めや契約を構成する一つ一つの項目のことです。ここでは学期の意味ではありません。'
    example_gloss: 条項とは、合意の一部分です。
  en.b2.unit07.lesson01.teach.proposal:
    title: proposal
    gloss: 提案
    note: '*proposal* は、考えられる条件を示す提案のことです。'
    example_gloss: 提案は、考えられる条件を示します。
  en.b2.unit07.lesson01.teach.refusal:
    title: refusal
    gloss: 拒否、お断り
    note: '*refusal* は、ある条件が受け入れられないことを伝えるものです。英語では、はっきり断るときに理由を添えると、より好印象になることが多いです。'
    example_gloss: 拒否は、ある条件が受け入れられないことを伝えます。
  en.b2.unit07.lesson01.teach.concession:
    title: concession
    gloss: 譲歩
    note: '*concession* は、合意を可能にするために、自分の立場の一部を手放すことです。'
    example_gloss: 譲歩とは、自分の立場の一部を手放すことです。
  en.b2.unit07.lesson01.teach.scope:
    title: scope
    gloss: 仕事の範囲
    note: '*scope* は、含まれている仕事の量のことです。交渉では、締め切りと *scope* を天秤にかけることができます。'
    example_gloss: '*scope* とは、含まれている仕事の量のことです。'
  en.b2.unit07.lesson01.teach.condition:
    title: condition
    gloss: 前提条件
    note: '*condition* は、取り決めが有効になる前に満たされていなければならないことです。'
    example_gloss: 取り決めが有効になる前に、前提条件を満たす必要があります。
  en.b2.unit07.lesson02.teach.condition_deadline:
    title: 条件つきの譲歩
    gloss: 仕事の範囲を縮小することを条件に、前倒しの締め切りに同意できます。
    note: '*I can agree... on condition that...* は、はっきりしていながら、ビジネスにふさわしい言い方です。あいまいにして和らげる必要はありません。'
  en.b2.unit07.lesson02.teach.cannot_agree:
    title: はっきり断る
    gloss: 仕事の範囲がすべて含まれたままでの火曜日の締め切りには、同意できません。
    note: '*I cannot agree to...* は、*No, that is impossible* のような、そっけない直接的な断り方よりも、ビジネスにふさわしい響きがあります。'
  en.b2.unit07.lesson02.teach.accept_if:
    title: if を使って受け入れる
    gloss: 来週、付録の全体が続けて提出されるなら、それを受け入れられます。
    note: '*I can accept that if...* は、条件をはっきり示す表現です。'
  en.b2.unit07.lesson02.teach.grammar_concession:
    title: 断りながら、交渉は続ける
    gloss: はっきり線引きをするときは I cannot agree を使います。条件つきの譲歩を示すときは I can agree on condition that を使います。
    note: 日本語で「難しいです」とぼかして断ると、英語では意図が伝わらないことがあります。逆に、直接的すぎる言い方は、英語でもきつく聞こえることがあります。限界、理由、条件の3つを示しましょう。
  en.b2.unit07.lesson03.teach.executive_summary:
    title: executive summary
    gloss: エグゼクティブサマリー(要旨)
    note: '*executive summary* は、報告書の要点をまとめた短い要約のことです。'
    example_gloss: エグゼクティブサマリーは、報告書の要点を示します。
  en.b2.unit07.lesson03.teach.charts:
    title: charts
    gloss: グラフ、図表
    note: '*charts* は、情報を視覚的に示します。'
    example_gloss: グラフは、情報を視覚的に示します。
  en.b2.unit07.lesson03.teach.reading_passage:
    title: 読解文:見直された条件
    gloss: プリヤは最初、報告書全体の締め切りとして木曜日を提案しました。クライアントがもっと早く必要としていたので、マーカスは反論しました。プリヤは、品質が危うくなるとして、仕事の範囲がすべて含まれたままでの火曜日を断りました。その後、条件つきの譲歩を示しました。仕事の範囲をエグゼクティブサマリーとグラフに縮小するなら、火曜日は可能だというものです。マーカスはその条件を受け入れましたが、1つ条項を加えました。付録の全体は来週続けて提出することです。決まった内容は、サマリーとグラフが火曜日、付録が来週でした。
    note: この交渉は、しっかりしていながらビジネスにふさわしい進め方です。断り、理由、条件、合意の順になっています。
  en.b2.unit07.lesson04.teach.q_thursday:
    title: プリヤが提案する
    gloss: プリヤ:仕事の範囲が計画どおりなら、木曜日までに報告書を納品できます。
    note: 彼女は、締め切りをすぐに仕事の範囲と結びつけています。
  en.b2.unit07.lesson04.teach.a_tuesday:
    title: マーカスが反論する
    gloss: マーカス:木曜日ではクライアントには遅すぎます。火曜日までに納品できますか?
    note: 彼は、仕事の範囲をすぐには変えずに、早い締め切りを求めています。
  en.b2.unit07.lesson04.teach.q_cannot_tuesday:
    title: プリヤが理由をつけて断る
    gloss: プリヤ:仕事の範囲がすべて含まれたままでの火曜日には同意できません。それでは品質が危うくなります。
    note: 理由があることで、断り方はビジネスにふさわしく、そっけなさも和らぎます。
  en.b2.unit07.lesson04.teach.a_what_possible:
    title: マーカスが条件を尋ねる
    gloss: マーカス:何があれば、火曜日が可能になりますか?
    note: この質問は、条件つきの譲歩への道を開きます。
  en.b2.unit07.lesson04.teach.q_condition:
    title: プリヤが条件を示す
    gloss: プリヤ:仕事の範囲をエグゼクティブサマリーとグラフに縮小することを条件に、前倒しの締め切りに同意できます。
    note: '*on condition that* は、はっきりしていて、ビジネスにふさわしい表現です。'
  en.b2.unit07.lesson04.teach.a_accept_appendix:
    title: マーカスが条件を追加して受け入れる
    gloss: マーカス:来週、付録の全体が続けて提出されるなら、それを受け入れられます。
    note: 彼は受け入れつつ、残りがいつ納品されるのかを決めています。
  en.b2.unit07.lesson04.teach.q_agreed:
    title: プリヤが合意をまとめる
    gloss: プリヤ:決まりですね。サマリーとグラフが火曜日、付録が来週です。
    note: '*Agreed* は、交渉を短く、はっきりと締めくくります。'
