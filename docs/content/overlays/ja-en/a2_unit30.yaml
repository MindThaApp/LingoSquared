  en.a2.unit30.lesson01.teach.strength:
    title: strength
    gloss: 強み
    note: '*strength* は、自分が特に得意なことです。'
    example_gloss: 私の強みの1つは、きちんと整理して物事を進められることです。
  en.a2.unit30.lesson01.teach.requirement:
