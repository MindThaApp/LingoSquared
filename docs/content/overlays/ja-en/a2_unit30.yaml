    gloss: 応募条件
    note: '*requirement* は、その職に求められることです。'
    example_gloss: 2年の実務経験が、このポジションの応募条件です。
  en.a2.unit30.lesson02.teach.two_years_experience:
    title: 自分の経験を説明する
    gloss: ソーシャルメディアマーケティングの経験が2年あります。
    note: 面接で、自分の仕事の経験を説明するときに使う文です。
  en.a2.unit30.lesson02.teach.one_strength_organized:
    title: 強みを伝える
    gloss: 私の強みの1つは、きちんと整理して物事を進められることです。
    note: '*One of my strengths is...* は、面接で強みを伝えるときの決まった言い方です。'
  en.a2.unit30.lesson02.teach.available_next_monday:
    title: 自分の都合を伝える
    gloss: 次の月曜日から働き始められます。
    note: '*I''m available to start...* で、いつから働き始められるかを伝えられます。'
  en.a2.unit30.lesson03.teach.resume:
    title: resume
    gloss: 履歴書
    note: '*resume* は「履歴書」のことです。この語は、主にアメリカ英語で使われます。'
    example_gloss: 面接には履歴書をお持ちください。
  en.a2.unit30.lesson03.teach.deadline:
    title: deadline
    gloss: 締め切り
    note: '*deadline* は、何かを終わらせなければならない期限のことです。日本語の「締め切り」にあたります。'
    example_gloss: 私は仕事で、いつも締め切りを守っています。
  en.a2.unit30.lesson03.teach.posting_text:
    title: 求人広告の文面
    gloss: Bright Path Marketing は、マーケティングコーディネーターを募集しています。応募条件は、2年の実務経験、優れた文章力、すぐに勤務できることです。面接には履歴書をお持ちください。
    note: 応募条件と指示が書かれた、正式な求人広告です。
  en.a2.unit30.lesson03.teach.i_meet_deadlines:
    title: 自分の仕事の進め方について話す
    gloss: 私は締め切りを守りますし、チームでうまく働けます。
    note: '*I meet deadlines* と *I work well in a team* は、自分の仕事の進め方を説明するときに役立つ文です。'
  en.a2.unit30.lesson04.teach.q_tell_me_experience:
    title: 面接官が経験についてたずねる
    gloss: 面接官が言います。本日はお越しいただきありがとうございます。ご経験について教えていただけますか。
    note: '*Thank you for coming in today* は、面接の最初に使う丁寧な言い方です。'
  en.a2.unit30.lesson04.teach.a_two_years_managed_team:
    title: 経験についてのミアの答え
    gloss: ミアが言います。ソーシャルメディアマーケティングの経験が2年あります。小さなチームをまとめた経験もあります。
    note: レッスン2と同じ経験の文に、「チームをまとめた」という内容が加わっています。
  en.a2.unit30.lesson04.teach.q_what_strength:
    title: 強みをたずねる
    gloss: 面接官が言います。それは素晴らしいですね。あなたの強みの1つは何ですか。
    note: 面接官は肯定的に反応してから、次の質問をしています。
  en.a2.unit30.lesson04.teach.a_organized_deadlines:
    title: 強みについてのミアの答え
    gloss: ミアが言います。とてもきちんと整理して仕事を進められますし、締め切りも守ります。
    note: ミアは、強み(整理して進められること)と、具体的な例(締め切りを守ること)を挙げています。
  en.a2.unit30.lesson04.teach.q_have_questions:
    title: ほかに質問がないかをたずねる
    gloss: 面接官が尋ねます。この仕事について、何か質問はありますか。
    note: 面接の最後によくある質問です。
  en.a2.unit30.lesson04.teach.a_wondering_typical_week:
    title: ミアが自分から質問する
    gloss: ミアが言います。はい、このポジションでは、典型的な1週間がどのようなものか伺いたいです。
    note: '*I was wondering...* は、自分から質問するときの丁寧な言い方です。'
