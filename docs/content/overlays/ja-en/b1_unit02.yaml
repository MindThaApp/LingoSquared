teaching:
  en.b1.unit02.lesson01.teach.be_able_to:
    title: be able to
    gloss: 〜することができる
    note: '*be able to* は、何かをする能力や機会があることを表します。'
    example_gloss: 私は運転免許証をオンラインで更新できます。
  en.b1.unit02.lesson01.teach.manage_to:
    title: manage to
    gloss: なんとか〜できる、〜することに成功する
    note: '*manage to* は、多少苦労しても何かがうまくいったことを表します。'
    example_gloss: 私は10分で用紙に記入し終えることができました。
  en.b1.unit02.lesson01.teach.renew:
    title: renew
    gloss: 更新する
    note: '*renew* は、書類の有効期限が切れる前に延長することを表します。'
    example_gloss: 私は運転免許証を更新しなければなりません。
  en.b1.unit02.lesson01.teach.license:
    title: license
    gloss: 運転免許証
    note: ここでの *license* は、運転が許可されていることを示す公式の書類(*driver's license* の略)のことです。イギリス英語では名詞を *licence* と書きます。
    example_gloss: 私の運転免許証は今月で期限が切れます。
  en.b1.unit02.lesson01.teach.online:
    title: online
    gloss: オンラインで
    note: '*online* は、インターネットを通じて、という意味で、実際の場所へ行くのではありません。'
    example_gloss: 今ではオンラインで更新できます。
  en.b1.unit02.lesson01.teach.in_person:
    title: in person
    gloss: 直接、本人が出向いて
    note: '*in person* は、オンラインではなく、自分でその場所へ行くことを表します。'
    example_gloss: 去年は、直接行かなければなりませんでした。
  en.b1.unit02.lesson02.teach.am_able_to_renew_online:
    title: 現在の可能性を表す
    gloss: 私は今、運転免許証をオンラインで更新できます。
    note: '*I am able to* は、現在の可能性を表します。'
  en.b1.unit02.lesson02.teach.was_not_able_to_last_year:
    title: 過去の可能性を否定する
    gloss: 去年は、オンラインでは手続きできませんでした。
    note: '*was not able to* は、過去にその可能性がなかったことを表します。'
  en.b1.unit02.lesson02.teach.managed_to_finish:
    title: うまくいったと伝える
    gloss: 私は10分で用紙に記入し終えることができました。
    note: '*managed to* は、多少苦労しても何かがうまくいったことを強調します。'
  en.b1.unit02.lesson02.teach.grammar_present_past:
    title: '''be able to'' の現在と過去'
    gloss: 私はそれを更新できます。私はそれを更新できました。私はあなたを手伝うことができるでしょう。
    note: '*am able to*(現在)、*was able to*(過去)、*would be able to*(仮定の話や申し出)は、同じ表現の別の形です。'
  en.b1.unit02.lesson03.teach.friend:
    title: friend
    gloss: 友だち
    note: '*friend* は、友だちのことです。'
    example_gloss: 私の友だちは先週、運転免許証を更新しました。
  en.b1.unit02.lesson03.teach.system:
    title: system
    gloss: システム
    note: '*system* は、何かを行うための組織立った方法のことです。'
    example_gloss: 新しいシステムはずっと速いです。
  en.b1.unit02.lesson03.teach.reading_passage:
    title: 読み物：新しいシステム
    gloss: 去年は、オンラインで運転免許証を更新することができませんでした。みんな直接、事務所へ行かなければなりませんでした。今年、システムが変わりました。今では、みんな家からすべて更新できます。友だちのミアは、10分で終わらせることができました。
    note: 新しいシステムで更新が簡単になったことについての、短い読み物です。
  en.b1.unit02.lesson04.teach.q_were_you_able:
    title: レイラが運転免許証についてたずねる
    gloss: レイラは言います。「運転免許証はオンラインで更新できた?」
    note: '*were you able to* は、過去の可能性についてたずねる表現です。'
  en.b1.unit02.lesson04.teach.a_wasnt_able_office:
    title: ダニエルの答え：オンラインではできなかった
    gloss: ダニエルは言います。「ううん、できなかった。直接、事務所に行かなきゃいけなかったよ。」
    note: '*wasn''t able to* は *was not able to* の話し言葉の短縮形です。'
  en.b1.unit02.lesson04.teach.q_really_managed:
    title: レイラが自分の経験について話す
    gloss: レイラは言います。「本当?私はオンラインで10分でできたよ。」
    note: '*managed to* は、レイラが手早く問題なくできたことを強調しています。'
  en.b1.unit02.lesson04.teach.a_next_time_save:
    title: ダニエルが次回のことを考える
    gloss: ダニエルは言います。「次回は、私もオンラインでやれば時間を節約できるな。」
    note: ここでの *would be able to* は、未来についての仮定の可能性を表します。
  en.b1.unit02.lesson04.teach.q_would_help:
    title: レイラが手助けを申し出る
    gloss: レイラは言います。「よかったら、次回は手伝ってあげられるよ。」
    note: ここでは、丁寧な申し出として *would be able to* が使われています。
  en.b1.unit02.lesson04.teach.a_thanks:
    title: ダニエルがお礼を言う
    gloss: ダニエルは言います。「ありがとう、お願いしたいな。」
    note: '*I''d like that* は、申し出をありがたく受け入れる自然な言い方です。'
