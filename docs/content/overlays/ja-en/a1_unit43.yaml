course:
  title: 英語 A1
  description: あいさつや日常の短い会話ができるようになる、A1レベルの英語コースです。日本語で詳しく解説します。
units:
  en.a1.unit43.colors:
    title: 色を説明する
lessons:
  en.a1.unit43.lesson01.colors_vocabulary:
    title: 色を表す言葉
  en.a1.unit43.lesson02.talking_about_colors:
    title: 色について話す
  en.a1.unit43.lesson03.dialogue_choosing_a_shirt_color:
    title: 会話：シャツの色を選ぶ
  en.a1.unit43.lesson04.three_friends_three_favorite_colors:
    title: 読み物：3人の友だち、3つの好きな色
teaching:
  en.a1.unit43.lesson01.teach.red:
    title: red
    gloss: 赤
    note: '*red* は「赤」という意味です。'
    example_gloss: 私の車は赤いです。
  en.a1.unit43.lesson01.teach.blue:
    title: blue
    gloss: 青
    note: '*blue* は「青」という意味です。'
    example_gloss: 空は青いです。
  en.a1.unit43.lesson01.teach.green:
    title: green
    gloss: 緑
    note: '*green* は「緑」という意味です。'
    example_gloss: 草は緑色です。
  en.a1.unit43.lesson01.teach.yellow:
    title: yellow
    gloss: 黄色
    note: '*yellow* は「黄色」という意味です。'
    example_gloss: 太陽は黄色です。
  en.a1.unit43.lesson01.teach.black:
    title: black
    gloss: 黒
    note: '*black* は「黒」という意味です。'
    example_gloss: 彼のくつは黒いです。
  en.a1.unit43.lesson01.teach.white:
    title: white
    gloss: 白
    note: '*white* は「白」という意味です。'
    example_gloss: 彼女のシャツは白いです。
  en.a1.unit43.lesson02.teach.dark_blue:
    title: dark blue
    gloss: 濃い青／紺色
    note: '*dark blue* は「濃い青」「紺色」にあたる言い方で、英語では *dark* と *blue* の2語を離して書きます。'
    example_gloss: 彼は紺色のシャツを着ています。
  en.a1.unit43.lesson02.teach.light_green:
    title: light green
    gloss: 明るい緑／薄い緑
    note: '*light green* も *dark blue* と同じように、*light* と *green* の2語を離して書きます。'
    example_gloss: 彼女は寝室を明るい緑色に塗りました。
  en.a1.unit43.lesson02.teach.goes_well_with:
    title: goes well with
    gloss: ～によく合う
    note: '*goes well with* は、2つの色や服がよく合うという意味です。'
    example_gloss: この青いシャツは黒いズボンによく合います。
  en.a1.unit43.lesson02.teach.too_bright:
    title: too bright
    gloss: 派手すぎる
    note: '*too bright* は、色が鮮やかすぎる、または目立ちすぎるという意味です。'
    example_gloss: 黄色は楽しい色ですが、仕事には派手すぎます。
  en.a1.unit43.lesson02.teach.whats_your_favorite_color:
    title: What's your favorite color?
    gloss: 好きな色は何ですか。
    note: '*What''s your favorite ...?* は、その人の好みをたずねる表現です。'
  en.a1.unit43.lesson02.teach.my_favorite_color_is:
    title: My favorite color is blue.
    gloss: 私の好きな色は青です。
    note: '*My favorite ... is ...* は、好みを言うときの決まった言い方です。'
  en.a1.unit43.lesson03.teach.dialogue_line1:
    title: ダニエルの質問
    gloss: ダニエル：来週のプレゼン用に、新しいシャツが必要なんだ。色を選ぶのを手伝ってくれる？
    note: '*Can you help me* + 動詞*?* は、手伝いをたのむ表現です。'
  en.a1.unit43.lesson03.teach.dialogue_line2:
    title: ミアの質問
    gloss: ミア：もちろん！どんな色が好き？
    note: '*What colors do you like?* は、どんな色が好きかをたずねる表現です。'
  en.a1.unit43.lesson03.teach.dialogue_line3:
    title: "ダニエルの答え"
    gloss: ダニエル：青と緑が好きなんだけど、何がきちんとして見えるのかわからなくて。
    note: '*I''m not sure what looks professional* は「何がきちんとして見えるのかわからない」という意味です。'
  en.a1.unit43.lesson03.teach.dialogue_line4:
    title: ミアのアドバイス
    gloss: ミア：紺色がいいと思う。きちんとして見えるし、黒いズボンにもよく合うよ。
    note: '*It looks professional* は「きちんとして見える」という意味です。'
  en.a1.unit43.lesson03.teach.dialogue_line5:
    title: ダニエルの質問
    gloss: ダニエル：この黄色いのはどう？
    note: '*What about ...?* は、別の案を出すときの言い方です。'
  en.a1.unit43.lesson03.teach.dialogue_line6:
    title: ミアのアドバイス
    gloss: ミア：黄色は楽しい色だけど、プレゼンには派手すぎるよ。私なら紺色のシャツにするな。
    note: '*I''d choose* は「私なら選ぶ」という意味です。'
  en.a1.unit43.lesson03.teach.dialogue_line7:
    title: ダニエルの決断
    gloss: ダニエル：ありがとう、ミア。じゃあ、紺色にするよ！
    note: '*Dark blue it is!* は、決めたことをくだけた言い方で伝える表現です。'
  en.a1.unit43.lesson04.teach.reading_passage:
    title: 3つの好きな色についての文章
    gloss: ダニエル、レイラ、ミアは、それぞれ好きな色がちがいます。ダニエルの好きな色は青です。青は落ち着く色で、仕事に着ていくほとんどの服に合うと言います。レイラの好きな色は緑で、彼女が好んで描く植物や庭の色です。とくに明るい緑が美しいと思っています。ミアの好きな色は黄色で、太陽を思い出させ、いつも幸せな気持ちにしてくれるからです。好きな色はみんなちがいますが、色は毎日をもっと楽しくしてくれるという点では、3人の意見は同じです。
    note: '*reminds her of the sun* は「太陽を思い出させる」という意味です。'
