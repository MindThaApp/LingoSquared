teaching:
  en.a1.unit62.lesson01.teach.phone:
    title: phone
    gloss: 電話、携帯電話
    note: '*phone* は「電話」という意味です。日常会話では、たいてい携帯電話をさします。'
    example_gloss: 私の携帯はここにあります。
  en.a1.unit62.lesson01.teach.call:
    title: call
    gloss: 電話をかける / 電話、通話
    note: '*call* は「電話、通話」という名詞にも、「電話をかける」という動詞にもなります。*a call*(名詞)、*to call*(動詞)です。'
    example_gloss: あなたに電話できます。
  en.a1.unit62.lesson01.teach.message:
    title: message
    gloss: 伝言、メッセージ
    note: '*message* は「伝言、メッセージ」という意味です。'
    example_gloss: 伝言を残してください。
  en.a1.unit62.lesson01.teach.voicemail:
    title: voicemail
    gloss: 留守番電話、ボイスメール
    note: '*voicemail* は、電話に録音されたメッセージ(留守番電話)のことです。'
    example_gloss: 留守番電話のメッセージは短いです。
  en.a1.unit62.lesson01.teach.repeat:
    title: repeat
    gloss: くり返す
    note: '*repeat* は「もう一度言う」という意味です。'
    example_gloss: もう一度言ってください。
  en.a1.unit62.lesson01.teach.slowly:
    title: slowly
    gloss: ゆっくり
    note: '*slowly* は「ゆっくり」という意味です。形容詞 *slow* の語尾に *-ly* がついた副詞です。日本語の「ゆっくり」と同じように、動詞を修飾します。'
    example_gloss: ゆっくり話してください。
  en.a1.unit62.lesson02.teach.this_is_leila:
    title: Hello, this is Leila.
    gloss: もしもし、レイラです。
    note: 英語では、電話で名乗るときに *this is...* を使います。*My name is...* は、電話ではあまり使いません。
  en.a1.unit62.lesson02.teach.speak_to_mia:
    title: Can I speak to Mia?
    gloss: ミアさんをお願いできますか。
    note: '*speak to* は「〜と話す」という意味です。日本語の「と」にあたる語は、英語では *to* になります。'
  en.a1.unit62.lesson02.teach.repeat_that:
    title: Please repeat that.
    gloss: もう一度言ってください。
    note: '*Please repeat that* は、もう一度言ってほしいと丁寧にたのむ言い方です。'
  en.a1.unit62.lesson02.teach.speak_slowly:
    title: Please speak slowly.
    gloss: ゆっくり話してください。
    note: ここでは、*slowly* は動詞 *speak* のあとに置きます。
  en.a1.unit62.lesson02.teach.leave_message:
    title: Leave a message.
    gloss: 伝言を残してください。
    note: '*leave a message* は「伝言を残す」という決まった言い方です。'
  en.a1.unit62.lesson02.teach.call_back_later:
    title: I'll call back later.
    gloss: あとでかけ直します。
    note: '*call back* は「かけ直す、折り返し電話する」という意味です。*back* は動詞のあとに置きます。'
  en.a1.unit62.lesson03.teach.dialogue_line1:
    title: ミアが電話に出る
    gloss: ミアが「もしもし、ミアです」と言っています
    note: '*this is Mia* は、電話では自然な言い方です。'
  en.a1.unit62.lesson03.teach.dialogue_line2:
    title: レイラが名乗る
    gloss: レイラが「ミア、こんにちは。レイラです」と言っています
    note: 電話で自分の名前を言うときは、*this is* を使いましょう。
  en.a1.unit62.lesson03.teach.dialogue_line3:
    title: レイラがよく聞こえない
    gloss: レイラが「あまりよく聞こえません」と言っています
    note: '*can''t hear you well* は「あなたの声がよく聞こえない」という意味です。'
  en.a1.unit62.lesson03.teach.dialogue_line4:
    title: レイラがゆっくり話してほしいとたのむ
    gloss: レイラが「ゆっくり話してください」と言っています
    note: '*Please speak slowly* は、丁寧なお願いです。'
  en.a1.unit62.lesson03.teach.dialogue_line5:
    title: ミアが時間を伝える
    gloss: ミアが「いいですよ。会議は4時です」と言っています
    note: '*at four* のように、時刻の前には *at* を使います。'
  en.a1.unit62.lesson03.teach.dialogue_line6:
    title: レイラがもう一度言ってほしいとたのむ
    gloss: レイラが「もう一度言ってください」と言っています
    note: '*repeat that* は、今言われたことをさします。'
  en.a1.unit62.lesson03.teach.dialogue_line7:
    title: ミアが4時をくり返す
    gloss: ミアが「4時です」と言っています
    note: '*Four o''clock* は、ちょうどの時刻です。'
  en.a1.unit62.lesson03.teach.dialogue_line8:
    title: レイラがあとでかけ直す
    gloss: レイラが「ありがとう。あとでかけ直します」と言っています
    note: '*I''ll* は *I will* の短縮形です。'
  en.a1.unit62.lesson04.teach.phone_note:
    title: 電話のメッセージ
    gloss: 電話のメッセージ:ミアさんから3:00に電話がありました。会議は5号室です。折り返しお電話ください。
    note: このメッセージには、誰が電話をかけてきたか、時刻、部屋、そして何をするべきかが書いてあります。
  en.a1.unit62.lesson04.teach.reading_passage:
    title: 読み物:短い電話
    gloss: 短い電話:ミアは午後にレイラに電話をかけました。音がはっきりしなかったので、レイラはミアにゆっくり話してほしいとたのみました。ミアは、会議は4時に5号室であると言いました。レイラはミアに、時間をもう一度言ってほしいとたのみました。そのあと、レイラは電話のメッセージを書きました。メッセージには、ミアが3:00に電話をかけてきたことと、折り返しの電話をほしがっていることが書いてありました。
    note: '*called* は *call* の過去形です。'
