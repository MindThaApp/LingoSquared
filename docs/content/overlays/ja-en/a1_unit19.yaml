teaching:
  en.a1.unit19.lesson01.teach.like:
    title: like
    gloss: 好き
    note: '*like* は「好き」という意味です。'
    example_gloss: コーヒーが好きです。
  en.a1.unit19.lesson01.teach.dont_like:
    title: don't like
    gloss: 好きではない
    note: '*don''t like* は *like* の否定の形です。'
    example_gloss: 紅茶は好きではありません。
  en.a1.unit19.lesson01.teach.prefer:
    title: prefer
    gloss: 〜のほうが好き
    note: '*prefer* は、選べるときにどちらかのほうが好きだと言う表現です。'
    example_gloss: コーヒーのほうが好きです。
  en.a1.unit19.lesson01.teach.love:
    title: love
    gloss: 大好き
    note: '*love* は「とても好き」という意味です。'
    example_gloss: 家族が大好きです。
  en.a1.unit19.lesson01.teach.hate:
    title: hate
    gloss: 大嫌い
    note: '*hate* は *love* の反対の意味です。'
    example_gloss: 遅刻するのが大嫌いです。
  en.a1.unit19.lesson02.teach.do_you_like_or:
    title: Do you like coffee or tea?
    gloss: コーヒーと紅茶、どちらが好きですか。
    note: この文は、2つの選択肢のうちどちらが好きかをたずねるときに使います。
  en.a1.unit19.lesson02.teach.i_prefer_tea:
    title: I prefer tea.
    gloss: 紅茶のほうが好きです。
    note: '*I prefer...* は、どちらかのほうが好きだと言うときに使います。'
  en.a1.unit19.lesson02.teach.because_reason:
    title: I like tea because it's milder.
    gloss: まろやかなので、紅茶が好きです。
    note: '*because* は、好みの理由を言うときに使います。'
  en.a1.unit19.lesson03.teach.very_much:
    title: very much
    gloss: とても
    note: '*very much* は「とても」という意味です。'
    example_gloss: コーヒーがとても好きです。
  en.a1.unit19.lesson03.teach.preference_text:
    title: 好みについての文章
    gloss: 紅茶は好きですが、コーヒーは好きではありません。まろやかなので、紅茶のほうが好きです。
    note: この短い文章では、ある人が何が好きか、そしてその理由を話しています。
  en.a1.unit19.lesson04.teach.too_strong:
    title: It's too strong.
    gloss: 濃すぎます。
    note: '*too strong* は「濃すぎる」という意味です。'
  en.a1.unit19.lesson04.teach.q_coffee_or_tea:
    title: コーヒーか紅茶かをたずねる
    gloss: レイラは「コーヒーと紅茶、どちらが好きですか」とたずねています。
    note: 前に出てきた質問と同じです。
  en.a1.unit19.lesson04.teach.a_prefer_tea_not_much:
    title: "ダニエルの答え"
    gloss: ダニエルは「紅茶のほうが好きです。コーヒーはあまり好きではありません」と言っています。
    note: ダニエルは自分の好みを言ってから、もう一言つけ加えています。
  en.a1.unit19.lesson04.teach.q_why_not:
    title: Why not?
    gloss: どうしてですか。
    note: '*Why not?* は、相手が何かを好きではないと言ったときに、その理由をたずねる表現です。'
  en.a1.unit19.lesson04.teach.a_too_strong_calmer:
    title: ダニエルの完全な答え
    gloss: ダニエルは「濃すぎると思います。まろやかなので、紅茶が好きです」と言っています。
    note: ダニエルは、コーヒーが好きではない理由と、紅茶のほうが好きな理由を話しています。
  en.a1.unit19.lesson04.teach.he_prefers_thinks:
    title: He prefers tea. He thinks it's too strong.
    gloss: 彼は紅茶のほうが好きです。濃すぎると思っています。
    note: '*prefers* と *thinks* は、主語が *he* や *she* のときの形で、語尾に *-s* がつきます。'
