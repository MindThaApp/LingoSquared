teaching:
  en.b1.unit15.lesson01.teach.complain:
    title: complain
    gloss: 苦情を言う
    note: '*complain* は、何かが間違っている、または不満だとあらたまって伝える、という意味です。'
    example_gloss: ミアは、壊れた椅子について苦情を伝えることにしました。
  en.b1.unit15.lesson01.teach.damaged:
    title: damaged
    gloss: 破損した
    note: '*damaged* は、壊れている、または傷んでいる製品を表します。'
    example_gloss: 椅子は壊れた状態で届きました。
  en.b1.unit15.lesson01.teach.refund:
    title: refund
    gloss: 返金
    note: '*refund* は、返品した製品や不良品に対して、支払ったお金が戻ってくることです。'
    example_gloss: ミアは返金を求めました。
  en.b1.unit15.lesson01.teach.replacement:
    title: replacement
    gloss: 交換品
    note: '*replacement* は、不良品の代わりになる新しい品物のことです。'
    example_gloss: 会社は、代わりに交換品を提案しました。
  en.b1.unit15.lesson01.teach.resolve:
    title: resolve
    gloss: 解決する
    note: '*resolve* は、問題を完全に解決する、という意味です。'
    example_gloss: 担当者は、問題をすぐに解決すると約束しました。
  en.b1.unit15.lesson01.teach.issue:
    title: issue
    gloss: 問題、件
    note: '*issue* は、対処が必要な問題のことです。'
    example_gloss: ミアは、問題をはっきりと説明しました。
  en.b1.unit15.lesson02.teach.writing_to_complain:
    title: I'm writing to complain about + 名詞
    gloss: 破損した製品についてご連絡しています。
    note: '*I''m writing to complain about* は、書面での苦情を丁寧に切り出す表現です。'
  en.b1.unit15.lesson02.teach.would_like_refund:
    title: I would like + 名詞
    gloss: この品物の返金をお願いしたいです。
    note: '*I would like a refund for* は、お金を返してほしいと丁寧に頼む表現です。'
  en.b1.unit15.lesson02.teach.grammar_complaint_structure:
    title: 丁寧なクレームの組み立て方
    gloss: 丁寧な苦情の書面は、たいてい三つの部分からなります。問題を伝える（I'm writing to complain about...）、すでに起きたことを述べる（it arrived damaged / it stopped working）、そして具体的な解決策を求める（I would like a refund / I would like a replacement）です。
    note: 形：問題を伝える、起きたことを述べる、具体的な解決策を求める。
  en.b1.unit15.lesson03.teach.desk_chair:
    title: desk chair
    gloss: オフィスチェア
    note: '*desk chair* は、机に向かって座るときに使う椅子のことです。'
    example_gloss: ミアは、自宅の仕事部屋用に新しいオフィスチェアを注文しました。
  en.b1.unit15.lesson03.teach.as_soon_as_possible:
    title: as soon as possible
    gloss: できるだけ早く
    note: '*as soon as possible* は、余計な遅れなく、という意味です。'
    example_gloss: ミアは、できるだけ早く交換品がほしいと伝えました。
  en.b1.unit15.lesson03.teach.reading_passage:
    title: 読み物：オフィスチェアについてのクレーム
    gloss: GreenDesk ご担当者様。破損した製品についてご連絡しています。先週、自宅の仕事部屋用にオフィスチェアを注文しましたが、車輪が壊れた状態で届きました。できるだけ早く交換品をお願いしたいです。今後の手続きについて、お知らせください。よろしくお願いいたします。ミア
    note: 丁寧にまとめた、短い苦情の手紙です。
  en.b1.unit15.lesson04.teach.q_calling_to_complain:
    title: ミアがオフィスチェアについてクレームの電話をする
    gloss: ミア：もしもし、注文したオフィスチェアについて苦情があって、お電話しました。
    note: '*I''m calling to complain about* は、電話での苦情を丁寧に切り出す表現です。'
  en.b1.unit15.lesson04.teach.a_whats_the_issue:
    title: スタッフが問題についてたずねる
    gloss: 担当者：それは申し訳ございません。どのような問題でしょうか。
    note: '*I''m sorry to hear that* は、相手の気持ちに寄り添った丁寧な返事です。'
  en.b1.unit15.lesson04.teach.q_broken_wheel_cant_use:
    title: ミアが問題を説明する
    gloss: ミア：車輪が壊れた状態で届いたので、使えません。
    note: '*it arrived with a broken wheel* は、すでに起きたことを説明しています。'
  en.b1.unit15.lesson04.teach.a_refund_or_replacement:
    title: スタッフが解決策を提案する
    gloss: 担当者：承知しました。返金と交換品のどちらがよろしいでしょうか。
    note: '*would you like... or...* は、お客様に選択肢を示す表現です。'
  en.b1.unit15.lesson04.teach.q_prefer_replacement:
    title: ミアが代替品を選ぶ
    gloss: ミア：可能でしたら、交換品のほうがいいです。
    note: '*I would prefer a replacement, if that''s possible* は、希望を丁寧に伝える表現です。'
  en.b1.unit15.lesson04.teach.a_resolve_send_friday:
    title: スタッフが解決を確認する
    gloss: 担当者：かしこまりました。この件は解決いたします。金曜日までに新しい椅子をお送りします。
    note: '*we''ll resolve this and send... by Friday* は、期日を示した具体的な約束です。'
