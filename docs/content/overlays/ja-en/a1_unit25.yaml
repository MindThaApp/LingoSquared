  en.a1.unit30.lesson03.teach.dialogue_line1:
    title: レイラの質問
    gloss: レイラは「ダニエル、自由な時間には何をしていますか」とたずねています。
    note: レイラは、ダニエルに直接質問して会話を始めています。
  en.a1.unit30.lesson03.teach.dialogue_line2:
    title: "ダニエルの答え"
    gloss: ダニエルは「よくランニングに行きます。それから、ときどき料理もします。あなたは？」と言っています。
    note: ダニエルは、頻度をつけて2つの趣味を挙げ、*What about you?* で質問を返しています。
  en.a1.unit30.lesson03.teach.dialogue_line3:
    title: 絵を描くことについてのレイラの話
    gloss: レイラは「絵を描くのが大好きです。ほぼ毎週末に描いています」と言っています。
    note: '*almost every weekend* は「ほぼ毎週末」という意味です。'
  en.a1.unit30.lesson03.teach.dialogue_line4:
    title: ダニエルの続きの質問
    gloss: ダニエルは「すてきですね！ゲームはしますか」と言っています。
    note: '*Do you ever...?* は、相手がときには何かをするかどうかをたずねるときに使います。'
  en.a1.unit30.lesson03.teach.dialogue_line5:
    title: レイラの最後の答え
    gloss: レイラは「めったにしません。本を読むほうが好きです」と言っています。
    note: '*I prefer...* は「〜のほうが好きです」という意味です。'
  en.a1.unit30.lesson04.teach.reading_passage:
    title: 趣味についての文章
    gloss: ダニエルとレイラは、趣味が違います。ダニエルは土曜の朝にいつもランニングに行き、ときどき友人のために夕食を作ります。レイラはランニングには一度も行きませんが、週末によく絵を描きます。二人ともゲームが好きですが、いっしょにはめったにしません。
    note: この文章は、ダニエルとレイラの趣味とその頻度を直接くらべています。
