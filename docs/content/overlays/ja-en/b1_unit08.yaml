teaching:
  en.b1.unit08.lesson01.teach.before:
    title: before
    gloss: 〜する前に、〜の前に
    note: '*before* は、ほかの出来事より前であることを表します。'
    example_gloss: 料理する前に、手を洗ってください。
  en.b1.unit08.lesson01.teach.after:
    title: after
    gloss: 〜したあとで、〜のあとに
    note: '*after* は、ほかの出来事より後であることを表します。'
    example_gloss: 仕事が終わったら、私に電話してください。
  en.b1.unit08.lesson01.teach.as_soon_as:
    title: as soon as
    gloss: 〜したらすぐに
    note: '*as soon as* は、何かが起こったらすぐに、という意味です。'
    example_gloss: 着いたらすぐに、あなたにメッセージを送ります。
  en.b1.unit08.lesson01.teach.by_the_time:
    title: by the time
    gloss: 〜するまでには
    note: '*by the time* は、何かが起こる時点までに、という意味です。'
    example_gloss: ミアが着くまでには、夕食の準備ができています。
  en.b1.unit08.lesson01.teach.check_in:
    title: check in
    gloss: 無事に着いたと連絡する
    note: '*check in* は、着いたことや無事であることを、誰かに簡単に知らせることを表します。'
    example_gloss: ホテルに着いたら、連絡してください。
  en.b1.unit08.lesson01.teach.lock_up:
    title: lock up
    gloss: 戸締まりをする
    note: '*lock up* は、部屋や建物を閉めて、鍵をかけることを表します。'
    example_gloss: 私は事務所を出る前に、戸締まりをします。
  en.b1.unit08.lesson02.teach.as_soon_as_home:
    title: Etwas sofort danach tun
    gloss: 家に着いたらすぐに、あなたに電話します。
    note: '*as soon as* は、二つ目の動作が一つ目の動作のすぐあとに起こることを表します。'
  en.b1.unit08.lesson02.teach.before_upstairs:
    title: Zuerst etwas tun
    gloss: 上の階に行く前に、郵便物を確認してください。
    note: '*before* は、どちらの動作を先にするかを表します。'
  en.b1.unit08.lesson02.teach.grammar_future_time_clause:
    title: Präsens in Zeitsätzen
    gloss: 家に着いたら、あなたに電話します。上の階に行く前に、郵便物を確認してください。
    note: 時を表す節では、未来の出来事も現在形で表します。*when I get home* と言い、*when I will get home* とは言いません。
  en.b1.unit08.lesson03.teach.front_door:
    title: front door
    gloss: 玄関のドア
    note: '*front door* は、家や建物の正面にある主要なドアのことです。'
    example_gloss: ダニエルは郵便物を確認したあとで、玄関のドアに鍵をかけます。
  en.b1.unit08.lesson03.teach.ready:
    title: ready
    gloss: 準備ができた
    note: '*ready* は、準備ができていて、使える状態であることを表します。'
    example_gloss: ミアが着くまでには、夕食の準備ができています。
  en.b1.unit08.lesson03.teach.reading_passage:
    title: 'Lesetext: der Abendplan'
    gloss: ダニエルは、几帳面な夜の習慣を持っています。家に帰ると、まず郵便物を確認します。郵便物を確認したあとで、玄関のドアに鍵をかけます。夕食を作り始める前に、手を洗ってテーブルを片づけます。ミアが着くまでには、キッチンの準備ができていて、料理は温まっています。
    note: '*when*、*after*、*before*、*by the time* が出てくる、短い読み物です。'
  en.b1.unit08.lesson04.teach.q_call_when_home:
    title: Leila bittet um einen Anruf
    gloss: レイラは言います。「ダニエル、家に着いたら電話してくれる?」
    note: 動作の時を示す *when* を使った質問です。
  en.b1.unit08.lesson04.teach.a_as_soon_as_home:
    title: Daniel verspricht, sofort anzurufen
    gloss: ダニエルは言います。「もちろん。家に着いたらすぐに電話するよ。」
    note: '*as soon as* は、すぐに電話する、ということをはっきり示しています。'
  en.b1.unit08.lesson04.teach.q_check_mail:
    title: Leila gibt eine erste Aufgabe
    gloss: レイラは言います。「上の階に行く前に、郵便物を確認してね。」
    note: '*before* は、郵便物の確認が先であることを表します。'
  en.b1.unit08.lesson04.teach.a_after_mail_lock:
    title: Daniel nennt den nächsten Schritt
    gloss: ダニエルは言います。「わかった。郵便物を確認したあとで、玄関のドアに鍵をかけるよ。」
    note: '*after* は、二つの動作の順番を表します。'
  en.b1.unit08.lesson04.teach.q_by_the_time_mia:
    title: Leila nennt den Zeitpunkt
    gloss: レイラは言います。「よかった。ミアが着くまでには、全部準備ができているはずだね。」
    note: '*by the time* は、その時点まで、またはそれより前に、すべての準備ができているはず、という意味です。'
  en.b1.unit08.lesson04.teach.a_start_dinner:
    title: Daniel schließt den Plan ab
    gloss: ダニエルは言います。「じゃあ、彼女が着いたら夕食を始められるね。」
    note: '*when she arrives* は、始められる時を示しています。'
