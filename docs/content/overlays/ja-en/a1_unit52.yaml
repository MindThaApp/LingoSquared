  en.a1.unit52.lesson03.teach.dialogue_line1:
    title: 美容師のあいさつ
    gloss: 美容師：こんにちは、今日はどうなさいますか。
    note: '*How can I help you today?* は「今日はどうなさいますか。」という意味です。'
  en.a1.unit52.lesson03.teach.dialogue_line2:
    title: ダニエルの依頼
    gloss: ダニエル：カットをお願いします。来週、姉が遊びに来るんです。
    note: '*I''d like a haircut* では名詞の *haircut* を使います。日本語の「カットをお願いします」と同じように、してほしいことをそのまま伝えられます。'
  en.a1.unit52.lesson03.teach.dialogue_line3:
    title: "美容師の質問"
    gloss: 美容師：わかりました、どんな髪型にしますか。
    note: '*what style do you want* は「どんな髪型にしたいですか」という意味です。'
  en.a1.unit52.lesson03.teach.dialogue_line4:
    title: ダニエルの希望
    gloss: ダニエル：同じ髪型で、少しだけ短くしてください。
    note: '*just a little shorter* は「ほんの少し短く」という意味です。'
  en.a1.unit52.lesson03.teach.dialogue_line5:
    title: ミアの質問
    gloss: ミア：先に彼の髪を洗ってもらえますか。
    note: '*Can you wash his hair first?* は「先に彼の髪を洗ってもらえますか。」という意味です。'
  en.a1.unit52.lesson03.teach.dialogue_line6:
    title: 美容師の返事
    gloss: 美容師：もちろんです。それはカット料金に含まれています。
    note: '*included with* は「…に含まれている」という意味です。'
  en.a1.unit52.lesson03.teach.dialogue_line7:
    title: ダニエルの料金の質問
    gloss: ダニエル：いいですね。いくらですか。
    note: ここでの *Great.* は「いいですね」「すばらしい」という意味で、短い返事として使います。
  en.a1.unit52.lesson03.teach.dialogue_line8:
    title: 料金
    gloss: 美容師：20ドルです。
    note: 前に習った文のくり返しです。
  en.a1.unit52.lesson04.teach.reading_passage:
    title: 美容室に行く話の文章
    gloss: 美容室に行く：来週、ダニエルのお姉さんがシカゴから遊びに来るので、彼は髪を切ることにしました。ミアは、自分のアパートの近くにある小さなお店でお気に入りの美容師をすすめ、いっしょに行きました。美容師がどんな髪型にしたいかたずねると、彼は同じ髪型で少しだけ短くしてほしいと答えました。美容師はまず髪を洗ってくれて、その洗髪はカット料金に含まれていました。カットは20ドルでした。終わると、ミアは「髪がすてきね」と言いました。帰り道、二人はレイラとコーヒーを飲みました。レイラは風邪がだいぶよくなっていて、ダニエルの新しい髪型もとても気に入りました。
    note: '*looked great* は「すてきに見えた」という意味です。'
