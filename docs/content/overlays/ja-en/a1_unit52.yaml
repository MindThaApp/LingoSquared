    title: Just a trim, please.
    gloss: 毛先を整えるだけでお願いします。
    note: '*Just a trim, please.* は「毛先を整えるだけでお願いします。」という意味です。'
  en.a1.unit52.lesson02.teach.can_you_make_it_a_little_shorter:
    title: Can you make it a little shorter?
    gloss: もう少し短くしてもらえますか。
    note: '*make it* のあとに形容詞を置くと、「それを…の状態にする」という意味になります。日本語の「短くする」の「…くする」に近い考え方です。'
