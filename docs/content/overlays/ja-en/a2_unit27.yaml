teaching:
  en.a2.unit27.lesson01.teach.checking_account:
    title: checking account
    gloss: 普通預金口座(日常の支払い用口座)
    note: '*checking account* は、日常の支払いに使う口座のことです。小切手やカードでの支払いに使われます。'
    example_gloss: 普通預金口座を開設したいのですが。
  en.a2.unit27.lesson01.teach.debit_card:
    title: debit card
    gloss: デビットカード
    note: '*debit card* は、口座から直接支払いができるカードです。'
    example_gloss: 食料品の買い物は、デビットカードで支払います。
  en.a2.unit27.lesson01.teach.monthly_fee:
    title: monthly fee
    gloss: 月額手数料
    note: '*monthly fee* は、銀行が毎月請求する手数料のことです。'
    example_gloss: この口座には月額手数料はかかりません。
  en.a2.unit27.lesson01.teach.minimum_balance:
    title: minimum balance
    gloss: 最低預金残高
    note: '*minimum balance* は、口座に残しておく必要がある最低限の金額のことです。'
    example_gloss: 最低預金残高として500ドルを維持する必要があります。
  en.a2.unit27.lesson01.teach.direct_deposit:
    title: direct deposit
    gloss: 給与の口座への直接振込
    note: '*direct deposit* は、給料が直接あなたの口座に振り込まれることです。'
    example_gloss: 給料は口座に直接振り込まれます。
  en.a2.unit27.lesson02.teach.i_was_wondering_what_documents:
    title: I was wondering what documents I would need to open an account.
    gloss: 口座を開設するには、どんな書類が必要かお伺いしたいのですが。
    note: これは丁寧な間接疑問です。
  en.a2.unit27.lesson02.teach.same_as_dmv:
    title: You'll need a photo ID and one proof of residency, just like at the DMV.
    gloss: DMVのときと同じで、顔写真付き身分証明書と居住証明が1通必要です。
    note: DMVは、運転免許や車両の手続きを扱うアメリカの機関です。ダニエルはユニット25でここで住所を変更しました。
  en.a2.unit27.lesson03.teach.business_days:
    title: business days
    gloss: 営業日
    note: '*business days* は営業日のことで、土日や祝日を含みません。'
    example_gloss: カードは5〜7営業日で届きます。
  en.a2.unit27.lesson03.teach.features_text:
    title: Text über Kontomerkmale
    gloss: 最低預金残高として500ドルを維持すれば、月額手数料はかかりません。デビットカードは5〜7営業日で届きます。
    note: 正式なお知らせです。条件と期間が書かれています。
  en.a2.unit27.lesson04.teach.that_sounds_good:
    title: That sounds good.
    gloss: それはいいですね。
    note: '*That sounds good* は、提案が気に入ったことを伝える言い方です。'
  en.a2.unit27.lesson04.teach.q_what_documents:
    title: Nach Unterlagen fragen
    gloss: ダニエルが言います。普通預金口座を開設するには、どんな書類が必要かお伺いしたいのですが。
    note: 2つ目のレッスンと同じ質問です。
  en.a2.unit27.lesson04.teach.a_id_and_proof:
    title: Antwort des Bankangestellten
    gloss: 銀行員が言います。DMVのときと同じで、顔写真付き身分証明書と居住証明が1通必要です。
    note: 銀行員は、ダニエルが以前DMVを訪れたことに触れています。
  en.a2.unit27.lesson04.teach.q_is_there_fee:
    title: Nach Gebühren fragen
    gloss: ダニエルが言います。両方とも持っています。月額手数料はありますか。
    note: ダニエルはまず書類があることを伝え、それから質問を続けます。
  en.a2.unit27.lesson04.teach.a_no_fee_condition:
    title: Antwort zu den Gebühren
    gloss: 銀行員が言います。最低預金残高として500ドルを維持すれば、月額手数料はかかりません。
    note: 銀行員は、月額手数料がかからない条件を伝えています。レッスン3の文章と同じ内容です。
  en.a2.unit27.lesson04.teach.q_when_card:
    title: Nach der Debitkarte fragen
    gloss: ダニエルが言います。それはいいですね。デビットカードはいつ受け取れますか。
    note: ダニエルは満足して、次の質問をしています。
  en.a2.unit27.lesson04.teach.a_five_to_seven_days:
    title: Antwort zur Debitkarte
    gloss: 銀行員が言います。5〜7営業日で届きます。
    note: レッスン3の文章と同じで、5〜7営業日です。
