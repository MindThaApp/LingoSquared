  en.a2.unit32.lesson03.teach.mias_message:
    title: Mias Nachricht
    gloss: こんにちは!私は毎日、スマホをたくさん使っています。ほぼ毎晩、SNSに写真を投稿し、1日に何度も通知を確認します。スクリーンタイムが長すぎることはわかっていますが、友だちと写真を共有するのが好きなんです。
    note: ミアが自分の習慣について書いた、気軽なメッセージです。
  en.a2.unit32.lesson03.teach.i_enjoy_sharing_photos:
    title: Sagen, was man gern tut
