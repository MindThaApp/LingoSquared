    title: Eine Meinung mit einem Gegenargument äußern
    gloss: 私の意見では、連絡を取り合うには便利ですが、時間をたくさんむだにすることもあります。
    note: '*In my opinion..., but...* で、意見を述べて、すぐに反対の点も伝えられます。'
  en.a2.unit32.lesson03.teach.too_much:
