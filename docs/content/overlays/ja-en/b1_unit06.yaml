teaching:
  en.b1.unit06.lesson01.teach.while:
    title: while
    gloss: 〜している間に
    note: '*while* は、あることが別のことと同時に起こっていることを表します。'
    example_gloss: 運転している間に、雨が降り出しました。
  en.b1.unit06.lesson01.teach.flat_tire:
    title: flat tire
    gloss: パンク
    note: '*flat tire* は、空気が抜けて使えなくなったタイヤのことです。'
    example_gloss: 高速道路で、タイヤがパンクしました。
  en.b1.unit06.lesson01.teach.pull_over:
    title: pull over
    gloss: 車を路肩に寄せて止める
    note: '*pull over* は、車を道路の端に止めることを表します。'
    example_gloss: 私はすぐに車を路肩に寄せて止めなければなりませんでした。
  en.b1.unit06.lesson01.teach.stranger:
    title: stranger
    gloss: 見知らぬ人
    note: '*stranger* は、知らない人のことです。'
    example_gloss: 見知らぬ人が車を止めて、私を助けてくれました。
  en.b1.unit06.lesson01.teach.mechanic:
    title: mechanic
    gloss: 整備士
    note: '*mechanic* は、車を修理する人のことです。'
    example_gloss: 整備士はすぐに私のタイヤを直してくれました。
  en.b1.unit06.lesson01.teach.said_that:
    title: said that
    gloss: 〜と言った
    note: '*said that* は、ほかの人が言ったことを伝えるときに使います。'
    example_gloss: 彼は、手伝えると言いました。
  en.b1.unit06.lesson02.teach.while_driving_tire_went_flat:
    title: Hintergrundgeschehen mit 'while'
    gloss: 仕事に車で向かっている間に、タイヤがパンクしました。
    note: '*while* + *was/were* + -ing の過去形は、別の出来事に中断される、背景の出来事を表します。'
  en.b1.unit06.lesson02.teach.when_pulled_over_stranger_helped:
    title: Folgendes Ereignis mit 'when'
    gloss: 車を路肩に寄せて止めると、見知らぬ人が助けようと止まってくれました。
    note: '*when* は、話の中の次の出来事を導きます。'
  en.b1.unit06.lesson02.teach.grammar_while_when_sequencing:
    title: '''while'' und ''when'' in einer Geschichte'
    gloss: 運転している間に、タイヤがパンクしました。車を路肩に寄せて止めると、見知らぬ人が助けてくれました。
    note: '*while* は背景(進行中の動作)を表し、*when* はその中で起こった、次の、より短い出来事を表します。'
  en.b1.unit06.lesson03.teach.had_already_called:
    title: had already called
    gloss: すでに電話していた
    note: '*had already* + 過去分詞は、過去のある時点より前にすでに起こっていたことを表します。'
    example_gloss: 彼が着いたときには、私はすでにダニエルに電話していました。
  en.b1.unit06.lesson03.teach.kept_his_word:
    title: kept his word
    gloss: 約束を守った
    note: '*kept his word* は、約束したことを実行した、という意味です。'
    example_gloss: 彼は約束を守って、10分で直してくれました。
  en.b1.unit06.lesson03.teach.reading_passage:
    title: 'Lesetext: die Geschichte vom Platten'
    gloss: 昨日の朝、レイラが車で仕事に向かっている間に、突然タイヤがパンクしました。彼女は静かな通りで車を路肩に寄せて止めました。見知らぬ人が車を止めて、手伝うと申し出てくれました。整備士が到着したときには、レイラはすでにダニエルに電話して、遅れると伝えていました。整備士は、10分でタイヤを直せると言いました。彼は約束を守り、レイラは20分遅れただけで職場に着きました。
    note: 背景の出来事(*while*)、出来事の順序(*when*)、それ以前にすでに起こっていたこと(*had already*)が出てくる、過去の話です。
  en.b1.unit06.lesson04.teach.q_youre_late_what_happened:
    title: Daniel bemerkt, dass Leila zu spät ist
    gloss: ダニエルは言います。「遅刻だよ!どうしたの?」
    note: 話の始まりとなる、心配している直接的な質問です。
  en.b1.unit06.lesson04.teach.a_tire_went_flat_suddenly:
    title: Leila beginnt ihre Geschichte
    gloss: レイラは言います。「車で仕事に向かっている間に、急にタイヤがパンクしたの。」
    note: '*while* は、別のことが起こった背景の出来事を表します。'
  en.b1.unit06.lesson04.teach.q_oh_no_what_did_you_do:
    title: Daniel fragt nach
    gloss: ダニエルは言います。「えっ!どうしたの?」
    note: 話をもっと聞くための、短い問いかけです。
  en.b1.unit06.lesson04.teach.a_pulled_over_stranger_helped:
    title: Leila erzählt weiter
    gloss: レイラは言います。「車を路肩に寄せて止めたら、見知らぬ人が止まって助けてくれたの。」
    note: 背景の出来事のあとの、話の中の次の出来事です。
  en.b1.unit06.lesson04.teach.q_kind_of_him_call_mechanic:
    title: Daniel reagiert und fragt weiter
    gloss: ダニエルは言います。「親切な人だね。整備士さんには電話した?」
    note: '*that was kind of him* は、誰かの親切に対する自然な反応です。'
  en.b1.unit06.lesson04.teach.a_had_already_called_mechanic_said:
    title: Leila beendet die Geschichte
    gloss: レイラは言います。「うん、その人が来る前に、もう電話してたの。整備士さんは10分で直せるって言って、本当にそのとおりにしてくれたよ!」
    note: '*had already called* は、見知らぬ人が到着する前にすでに起こっていたことを表します。'
