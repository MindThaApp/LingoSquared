teaching:
  en.a1.unit22.lesson01.teach.headache:
    title: headache
    gloss: 頭痛
    note: '*headache* は「頭痛」という意味です。日本語では冠詞を意識しませんが、英語では *a headache* のように、数えられる名詞として *a* をつけて言います。'
    example_gloss: 私は頭が痛いです。
  en.a1.unit22.lesson01.teach.stomachache:
    title: stomachache
    gloss: 腹痛、おなかの痛み
    note: '*stomachache* は「腹痛」という意味です。これも *a stomachache* のように *a* をつけます。'
    example_gloss: 私はおなかが痛いです。
  en.a1.unit22.lesson01.teach.fever:
    title: fever
    gloss: 熱
    note: '*fever* は「熱」という意味です。*have a fever* と言い、*have fever* とは言いません。'
    example_gloss: 私は熱があると思います。
  en.a1.unit22.lesson01.teach.cough:
    title: cough
    gloss: せき
    note: '*cough* は「せき」という意味です。名詞にも動詞にもなります。*a cough*(せき)、*to cough*(せきをする)です。'
    example_gloss: ダニエルはひどいせきが出ています。
  en.a1.unit22.lesson01.teach.sore_throat:
    title: sore throat
    gloss: のどの痛み
    note: '*sore throat* は「のどの痛み」という意味です。*sore* は「ひりひり痛む」という意味で、ここでも *a sore throat* のように *a* をつけます。'
    example_gloss: 私はのどが痛いです。
  en.a1.unit22.lesson02.teach.whats_wrong:
    title: What's wrong?
    gloss: どうしたのですか。
    note: '*What''s wrong?* で、何か問題があるのかをたずねます。*What''s* は *What is* の短縮形です。'
  en.a1.unit22.lesson02.teach.i_have_a_headache:
    title: I have a headache.
    gloss: 私は頭が痛いです。
    note: '*I have a...* で、体の不調を伝えます。日本語では「頭が痛い」と言いますが、英語は「私は頭痛を持っている」という形で、*I have a headache.* と言います。'
  en.a1.unit22.lesson02.teach.i_feel_hot:
    title: I feel hot.
    gloss: 私は暑いです。
    note: '*I feel...* で、体で感じていることを伝えます。*I feel hot* は、文字どおりには「私は暑く感じる」で、「暑い」という意味です。日本語の「暑い」のように、主語は *I* です。'
  en.a1.unit22.lesson03.teach.rest:
    title: rest
    gloss: 休む
    note: '*rest* は「休む」という意味です。'
    example_gloss: 私は休まなければなりません。
  en.a1.unit22.lesson03.teach.symptom_text:
    title: 体の不調についての文章
    gloss: 私は頭痛とのどの痛みがあります。熱もあると思います。休まなければなりません。
    note: この短い文章では、ある人がいくつかの不調を一度に説明しています。
  en.a1.unit22.lesson04.teach.see_a_doctor:
    title: You should see a doctor.
    gloss: 医者に診てもらったほうがいいですよ。
    note: '*You should...* で、簡単なアドバイスをします。「〜したほうがいいですよ」にあたります。*should* のあとの動詞には *to* をつけません。'
  en.a1.unit22.lesson04.teach.q_dont_look_well:
    title: 具合をたずねる
    gloss: レイラが「具合が悪そうですね。どうしたのですか」と言っています
    note: '*You don''t look well* は「具合が悪そうですね」という意味です。'
  en.a1.unit22.lesson04.teach.a_headache_sore_throat:
    title: ダニエルの答え
    gloss: ダニエルが「頭痛とのどの痛みがあります」と言っています
    note: ダニエルは2つの不調をまとめて言っています。
  en.a1.unit22.lesson04.teach.q_do_you_have_fever:
    title: 熱があるかたずねる
    gloss: レイラが「熱はありますか」とたずねています
    note: '*Do you have a fever?* で、特定の症状があるかどうかをたずねます。'
  en.a1.unit22.lesson04.teach.a_not_sure_feel_hot:
    title: ダニエルの答え
    gloss: ダニエルが「よくわかりませんが、暑く感じます」と言っています
    note: ダニエルははっきりわかりませんが、どう感じているかを伝えています。
  en.a1.unit22.lesson04.teach.a_rest_water_doctor:
    title: レイラのアドバイス
    gloss: レイラが「休んで、水を飲んだほうがいいですよ。よくならなければ、医者に診てもらったほうがいいですよ」と言っています
    note: レイラはまず簡単なアドバイスをして、そのあと、いつ医者に行くべきかを伝えています。
  en.a1.unit22.lesson04.teach.a_okay_rest_today:
    title: ダニエルの最後の答え
    gloss: ダニエルが「わかりました、ありがとう。今日は休みます」と言っています
    note: ダニエルはアドバイスを受け入れて、今日することを伝えています。
