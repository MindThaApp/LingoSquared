  en.a1.unit22.lesson04.exercise05.reply_as_daniel:
    instruction: ダニエルになって答えてください。レイラが「具合が悪そうですね。どうしたのですか」と言います。頭痛とのどの痛みがあると答えてください。彼女が「熱はありますか」とたずねます。よくわからないけれど暑く感じると答えてください。そのあと彼女が、休んで水を飲んだほうがいい、よくならなければ医者に行ったほうがいいと言います。お礼を言って、今日は休むと伝えてください。
    accepted_answers:
    - value: I have a headache and a sore throat. I'm not sure, but I feel hot. Okay, thank you. I'll rest today.
      status: correct
    - value: I have a headache and a sore throat. I'm not sure if I have a fever, but I feel hot. Okay, thank you. I'll rest today.
      status: correct
    - value: I have a headache and a sore throat. I am not sure, but I feel hot. Okay, thank you. I will rest today.
      status: correct
    feedback: 完全な答えには、体の不調を伝えること、熱があるかよくわからないと言うこと、アドバイスを受け入れることが入っています。会話の中の3つの別々の場面です。
  en.a1.unit22.lesson04.exercise06.speak_health_dialogue:
    instruction: ダニエルになって、声に出して答えてください。レイラが「具合が悪そうですね。どうしたのですか」と言います。頭痛とのどの痛みがあると答えてください。彼女が「熱はありますか」とたずねます。よくわからないけれど暑く感じると答えてください。そのあと彼女が、休んで水を飲んだほうがいい、よくならなければ医者に行ったほうがいいと言います。お礼を言って、今日は休むと伝えてください。
    accepted_answers:
    - value: I have a headache and a sore throat. I'm not sure, but I feel hot. Okay, thank you. I'll rest today.
      status: correct
    - value: I have a headache and a sore throat. I'm not sure if I have a fever, but I feel hot. Okay, thank you. I'll rest today.
      status: correct
    - value: I have a headache and a sore throat. I am not sure, but I feel hot. Okay, thank you. I will rest today.
      status: correct
    feedback: 完全な答えには、会話の3つの部分がすべて入っています。体の不調、熱、そしてアドバイスを受け入れることです。
