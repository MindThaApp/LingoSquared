  en.b1.unit10.lesson02.teach.evening_class:
    title: '''in order to'' で目的を表す'
    gloss: 私は英語を上達させるために、夜間の講座を受けています。
    note: '*in order to improve* は、夜間講座を受ける目的を表します。'
  en.b1.unit10.lesson02.teach.study_so_that:
    title: '''so that'' で目的を表す'
    gloss: 私は毎晩、もっと多くの語彙を覚えられるように勉強しています。
    note: '*so that* のあとには、完全な文が続きます:*I can remember more vocabulary*。'
  en.b1.unit10.lesson02.teach.grammar_purpose:
    title: '''in order to'' と ''so that'''
    gloss: 私は英語を上達させるために勉強しています。私はもっと覚えられるように勉強しています。
    note: '*in order to* は動詞の前に、*so that* は完全な節の前に置きます。日本語ではどちらも「〜するために」「〜できるように」で表せますが、英語では形を使い分けます。'
  en.b1.unit10.lesson03.teach.design_course:
