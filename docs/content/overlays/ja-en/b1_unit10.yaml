    example_gloss: レイラは、デザイン講座のためにお金を貯めています。
  en.b1.unit10.lesson03.teach.clear_goal:
    title: clear goal
    gloss: はっきりした目標
    note: '*clear goal* は、具体的で、わかりやすい目標のことです。'
    example_gloss: はっきりした目標があると、次に何をするかを決めやすくなります。
  en.b1.unit10.lesson03.teach.reading_passage:
    title: 読み物：明確な目標
    gloss: ダニエルとレイラには、どちらもはっきりした目標があります。ダニエルは、仕事のために英語を上達させようと、夜間の講座を受けています。彼は、もっとプロらしく聞こえるように、短い報告を書く練習をしています。レイラは、来年デザイン講座を受けられるように、お金を貯めています。彼女は、ふさわしいプログラムを選ぶために、講座の説明を読んでいます。
    note: '*in order to* と *so that* を使った、目標についての短い読み物です。'
  en.b1.unit10.lesson04.teach.q_why_evening_class:
    title: レイラがダニエルの目標をたずねる
    gloss: レイラは言います。「ダニエル、どうして夜間の講座を受けているの?」
    note: 行動の目的についての、直接的な質問です。
  en.b1.unit10.lesson04.teach.a_improve_english:
    title: ダニエルが自分の目標を説明する
    gloss: ダニエルは言います。「仕事のために、英語を上達させようと思って受けているんだ。」
    note: '*in order to improve* は、ダニエルの目標を表します。'
  en.b1.unit10.lesson04.teach.q_studying_every_night:
    title: レイラが彼の学習習慣をたずねる
    gloss: レイラは言います。「なるほどね。毎晩勉強してるの?」
    note: ダニエルが目標をどう達成するつもりかについての、続けての質問です。
  en.b1.unit10.lesson04.teach.a_remember_vocabulary:
    title: ダニエルが 'so that' を使う
    gloss: ダニエルは言います。「もっと語彙を覚えられるように、30分勉強してるよ。」
    note: '*so that I can remember...* は、望んでいる結果を表します。'
  en.b1.unit10.lesson04.teach.q_saving_money:
    title: レイラが自分の目標を伝える
    gloss: レイラは言います。「いい計画だね。私は、来年デザイン講座を受けられるように、お金を貯めているよ。」
    note: レイラも、自分の目標を説明するのに *so that* を使っています。
  en.b1.unit10.lesson04.teach.a_clear_goals:
    title: ダニエルがまとめる
    gloss: ダニエルは言います。「じゃあ、二人ともはっきりした目標があるね。」
    note: '*clear goals* は、具体的な目標のことです。'
