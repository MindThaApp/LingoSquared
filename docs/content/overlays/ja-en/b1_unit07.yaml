  en.b1.unit07.lesson01.condition_vocabulary:
    title: If、unless、condition、result
  en.b1.unit07.lesson02.real_conditions:
    title: If it starts late, I will send a message
  en.b1.unit07.lesson03.reading_a_meeting_plan:
    title: 読み物:代わりの計画
  en.b1.unit07.lesson04.the_meeting_plan_dialogue:
