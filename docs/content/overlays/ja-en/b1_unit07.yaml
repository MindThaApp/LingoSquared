teaching:
  en.b1.unit07.lesson01.teach.if:
    title: if
    gloss: もし〜なら
    note: '*if* は、起こりうる条件を導きます。'
    example_gloss: バスが遅れたら、あなたに電話します。
  en.b1.unit07.lesson01.teach.unless:
    title: unless
    gloss: 〜でない限り、〜しなければ
    note: '*unless* は、ほぼ *if not* と同じ意味です。条件が実際に成り立たない限り、あることが起こります。'
    example_gloss: 計画が変わらない限り、10時に会います。
  en.b1.unit07.lesson01.teach.condition:
    title: condition
    gloss: 条件
    note: '*condition* は、最初に成り立っていなければならない状況のことです。'
    example_gloss: 条件ははっきりしています。全員が来たら始めます。
  en.b1.unit07.lesson01.teach.result:
    title: result
    gloss: 結果
    note: '*result* は、ある条件によって起こることです。'
    example_gloss: その結果、私たちはオンラインで会います。
  en.b1.unit07.lesson01.teach.delay:
    title: delay
    gloss: 遅れ
    note: '*delay* は、何かが予定より遅く起こることを表します。'
    example_gloss: 遅れが出ると、みんなが遅刻することがあります。
  en.b1.unit07.lesson01.teach.reschedule:
    title: reschedule
    gloss: 日程を変更する
    note: '*reschedule* は、予約や会議のために新しい時間を決めることを表します。'
    example_gloss: 医者の都合がつかなければ、予約の日程を変更します。
  en.b1.unit07.lesson02.teach.if_meeting_late:
    title: Eine reale Bedingung mit Ergebnis
    gloss: 会議の開始が遅れたら、全員にメッセージを送ります。
    note: 未来についての現実的な条件では、*if* のあとは現在形になります。*If the meeting starts late* と言い、*will start* とは言いません。
  en.b1.unit07.lesson02.teach.if_not_ready:
    title: Eine verneinte Bedingung
    gloss: 報告書の準備ができていなければ、見直しの日程を変更します。
    note: '*if ... not* は、条件を否定にします。'
  en.b1.unit07.lesson02.teach.grammar_real_condition:
    title: Reale Bedingungen in der Zukunft
    gloss: 開始が遅れたら、メッセージを送ります。報告書の準備ができていなければ、見直しの日程を変更します。
    note: '*if* のあとは現在形になり、結果の部分には *will* がよく使われます。'
  en.b1.unit07.lesson03.teach.backup_plan:
    title: backup plan
    gloss: 代替案、プランB
    note: '*backup plan* は、最初の計画がうまくいかないときのための、もう一つの計画のことです。'
    example_gloss: 部屋が使用中の場合に備えて、代替案が必要です。
  en.b1.unit07.lesson03.teach.move_update:
    title: move the update
    gloss: アップデートの時間を変更する
    note: '*move the update* は、アップデートを別の時間に話すことにする、という意味です。'
    example_gloss: レイラが遅れたら、彼女のアップデートは明日に移します。
  en.b1.unit07.lesson03.teach.reading_passage:
    title: 'Lesetext: der Ersatzplan'
    gloss: ダニエルは、チームミーティングの代替案を書きます。会議室が空いていれば、チームは10時にそこで集まります。部屋が使用中であれば、オンラインで集まります。10時までにレイラが参加しない限り、ダニエルは彼女のアップデートを明日に移します。報告書の準備ができていなければ、ミアが代わりにもっと短いアップデートを送ります。
    note: 現実的な条件と結果、そして *unless* が出てくる、短い読み物です。
  en.b1.unit07.lesson04.teach.q_if_meeting_late:
    title: Mia fragt nach dem Plan
    gloss: ミアは言います。「ダニエル、会議の開始が遅れたらどうする?」
    note: 起こりうる条件の結果についての質問です。
  en.b1.unit07.lesson04.teach.a_send_message:
    title: Daniel nennt das Ergebnis
    gloss: ダニエルは言います。「開始が遅れたら、全員にメッセージを送るよ。」
    note: '*If it starts late, I will...* は、実際に起こりうることと、具体的な行動を結びつけます。'
  en.b1.unit07.lesson04.teach.q_if_leila_cannot_join:
    title: Mia fragt nach Leila
    gloss: ミアは言います。「それと、レイラが参加できなかったら?」
    note: 同じ条件の構文を使った、短い続きの質問です。
  en.b1.unit07.lesson04.teach.a_unless_she_joins:
    title: Daniel verwendet 'unless'
    gloss: ダニエルは言います。「10時までに参加しない限り、彼女のアップデートは明日に移すよ。」
    note: '*unless she joins by ten* は、「10時までに彼女が参加しなければ」という意味です。'
  en.b1.unit07.lesson04.teach.q_room_busy:
    title: Mia fragt nach dem Raum
    gloss: ミアは言います。「それならいいね。それと、部屋がまだ使用中だったら、オンラインで集まる?」
    note: ミアは、部屋が使用中の場合の代替案を確認しています。
  en.b1.unit07.lesson04.teach.a_meet_online:
    title: Daniel bestätigt den Online-Plan
    gloss: ダニエルは言います。「うん、部屋が使用中なら、代わりにオンラインで集まるよ。」
    note: '*instead* は、この計画がもう一方の計画に代わる、という意味です。'
