course:
  title: 英語 B1
  description: 義務、可能性、仮定の話、日常の出来事の語りを学べる、B1レベルの英語コースです。日本語で詳しく解説します。
units:
  en.b1.unit01.necessity:
    title: やらなければならないこと、やるべきこと
lessons:
  en.b1.unit01.lesson01.necessity_vocabulary:
    title: Must、have to、should
  en.b1.unit01.lesson02.saying_what_you_must_do:
    title: I must / I have to / she has to
  en.b1.unit01.lesson03.past_regret_and_prohibition:
    title: Should have、must not、don't have to
  en.b1.unit01.lesson04.the_gym_membership_dialogue:
    title: You must not forget again
teaching:
  en.b1.unit01.lesson01.teach.must:
    title: must
    gloss: 〜しなければならない(強い個人的な義務)
    note: '*must* は強い個人的な義務、つまり自分自身がとても大切だと思っていることを表します。'
    example_gloss: 私は今日、この作業を終わらせなければなりません。
  en.b1.unit01.lesson01.teach.have_to:
    title: have to
    gloss: 〜しなければならない(外からの義務)
    note: '*have to* は、規則や期限など、外からくる義務を表します。'
    example_gloss: 私は金曜日までに家賃を払わなければなりません。
  en.b1.unit01.lesson01.teach.should:
    title: should
    gloss: 〜したほうがいい、〜すべきだ
    note: '*should* は助言や推奨を表し、厳しい義務ではありません。'
    example_gloss: 近いうちに歯医者に電話したほうがいいですよ。
  en.b1.unit01.lesson01.teach.task:
    title: task
    gloss: 作業、課題
    note: '*task* は、片づけなければならない作業や仕事のことです。'
    example_gloss: 私にはまだ終わらせるべき作業が一つあります。
  en.b1.unit01.lesson01.teach.rent:
    title: rent
    gloss: 家賃
    note: '*rent* は、住むために払うお金のことです。'
    example_gloss: 家賃は金曜日が支払期限です。
  en.b1.unit01.lesson01.teach.appointment:
    title: appointment
    gloss: 予約、約束
    note: '*appointment* は、医者など誰かと会うために決めた日時のことです。'
    example_gloss: 私は今週、歯医者の予約があります。
  en.b1.unit01.lesson02.teach.must_finish_task:
    title: 強い義務を表す
    gloss: 私は今日、この作業を終わらせなければなりません。
    note: '*I must* は、強い個人的な義務を表します。'
  en.b1.unit01.lesson02.teach.have_to_pay_rent:
    title: 外からの義務を表す
    gloss: 私は金曜日までに家賃を払わなければなりません。
    note: '*I have to* は、支払期限のような外からくる義務を表します。'
  en.b1.unit01.lesson02.teach.she_has_to_make:
    title: '''she'' のときの形'
    gloss: 彼女は予約を取らなければなりません。
    note: 主語が *he/she/it* のときは、*have to* が *has to* になります。
  en.b1.unit01.lesson02.teach.you_should_call:
    title: おすすめを伝える
    gloss: 電話して予約を確認したほうがいいですよ。
    note: '*should* は助言を表し、*must* や *have to* のような厳しい義務ではありません。'
  en.b1.unit01.lesson02.teach.grammar_agreement:
    title: '''have to'' の形'
    gloss: 私は行かなければなりません。彼女は行かなければなりません。私たちは行かなければなりません。彼らは行かなければなりません。
    note: '*he/she/it* のときだけ *have* が *has* になり、ほかの人称では *have to* のままです。'
  en.b1.unit01.lesson03.teach.should_have_called:
    title: 過去への後悔を表す
    gloss: もっと早く電話すればよかった。
    note: '*should have* + 過去分詞は、しなかったことへの後悔を表します。'
    example_gloss: もっと早く電話すればよかったです。
  en.b1.unit01.lesson03.teach.must_not:
    title: must not
    gloss: 〜してはいけない
    note: '*must not* は禁止、つまり絶対にしてはいけないことを表します。注意:*must not* は「〜しなくてもよい」ではなく「〜してはいけない」という意味です。「〜しなくてもよい」は *don''t have to* で表します。'
    example_gloss: もう二度と忘れてはいけませんよ。
  en.b1.unit01.lesson03.teach.dont_have_to:
    title: don't have to
    gloss: 〜しなくてもよい、〜する必要はない
    note: '*don''t have to* は、義務ではないことを表します。*must not*(禁止)とは意味が違います。'
    example_gloss: 忙しければ、来なくてもいいですよ。
  en.b1.unit01.lesson03.teach.grammar_past_regret:
    title: 後悔、禁止、不必要
    gloss: 電話すればよかった。忘れてしまいました。もう二度と忘れてはいけません。来なくてもいいですよ。
    note: '*should have* + 過去分詞は過去への後悔を表します。*must not* は禁止です。*don''t have to* は義務ではありませんが、してもかまわないという意味です。'
  en.b1.unit01.lesson03.teach.reading_passage:
    title: 読み物：フィットネスジム
    gloss: 昨日、ダニエルはジムの会員更新を忘れてしまいました。携帯電話にリマインダーを設定しておくべきでした。今は延滞料金を払わなければなりません。来月は二度と忘れてはいけません。
    note: ダニエルの失敗と、その結果についての短い読み物です。
  en.b1.unit01.lesson04.teach.q_renew_gym:
    title: レイラが会員資格についてたずねる
    gloss: レイラは言います。「ダニエル、ジムの会員更新はした?」
    note: やるべきことがもう済んでいるかを確かめる、直接的な質問です。
  en.b1.unit01.lesson04.teach.a_forgot_should_have:
    title: ダニエルの答え：忘れていた
    gloss: ダニエルは言います。「あっ、忘れてた!先週やっておくべきだった。」
    note: '*I should have done that* は、やらなかったことへの後悔を表します。'
  en.b1.unit01.lesson04.teach.q_call_today:
    title: レイラがダニエルに警告する
    gloss: レイラは言います。「今日中に電話しないと、延滞料金を払うことになるよ。」
    note: ここでの *must* は、差し迫った個人的な警告を表します。
  en.b1.unit01.lesson04.teach.a_also_pay_rent:
    title: ダニエルがほかの用事を挙げる
    gloss: ダニエルは言います。「そうだね。金曜日までに家賃も払わなきゃいけないし、歯医者にも電話したほうがいいな。」
    note: ダニエルは一つの返事の中で、*have to*(義務)と *should*(助言)を組み合わせています。
  en.b1.unit01.lesson04.teach.q_dont_have_to:
    title: レイラがダニエルを安心させる
    gloss: レイラは言います。「全部を今日やらなくてもいいよ。でも、ジムはもう二度と忘れちゃだめだよ。」
    note: レイラは *don't have to*(義務ではない)と *must not*(禁止)を対比させています。
  en.b1.unit01.lesson04.teach.a_more_organized:
    title: ダニエルが決意する
    gloss: ダニエルは言います。「わかってる。今月はもっときちんとしなきゃ。」
    note: ここでの *I must be* は、個人的な決意を表します。
