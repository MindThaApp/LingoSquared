  en.a1.unit50.lesson02.teach.do_you_have_a_reservation:
    title: Do you have a reservation?
    gloss: ご予約はありますか。
    note: '*Do you have a reservation?* は「ご予約はありますか。」という意味です。'
  en.a1.unit50.lesson02.teach.i_have_a_reservation_for_two_nights:
    title: I have a reservation for two nights.
    gloss: 二泊で予約しています。
    note: '*for two nights* の *for* は、期間を表します。「二泊で」「二泊分」という意味です。'
  en.a1.unit50.lesson02.teach.does_the_room_have_wifi:
    title: Does the room have wifi?
    gloss: 部屋にWi-Fiはありますか。
    note: '*Does the room have wifi?* は「部屋にWi-Fiはありますか。」という意味です。'
  en.a1.unit50.lesson02.teach.what_time_is_check_out:
    title: What time is check-out?
    gloss: チェックアウトは何時ですか。
    note: '*What time is check-out?* は「チェックアウトは何時ですか。」という意味です。'
  en.a1.unit50.lesson02.teach.breakfast_is_included:
    title: Breakfast is included.
    gloss: 朝食は含まれています。
    note: '*Breakfast is included.* は「朝食は含まれています。」という意味です。'
  en.a1.unit50.lesson02.teach.heres_your_key:
    title: Here's your key.
    gloss: こちらがお部屋の鍵です。
    note: '*Here''s* は here is の短縮形です。'
  en.a1.unit50.lesson03.teach.dialogue_line1:
    title: ミアがフロントで話す
    gloss: ミア：こんにちは、二泊で予約しています。
    note: '*we have a reservation* は「予約しています」という意味です。'
  en.a1.unit50.lesson03.teach.dialogue_line2:
    title: フロント係のあいさつ
    gloss: フロント係：いらっしゃいませ！ご予約のお名前をお願いします。
    note: '*What''s the name on the reservation?* は「ご予約のお名前は何ですか。」という意味です。'
  en.a1.unit50.lesson03.teach.dialogue_line3:
    title: "レイラの答え"
    gloss: レイラ：レイラの名前で予約しています。
    note: '*it''s under my name* は「私の名前で予約されている」という意味です。*under* を使い、be 動詞の *is* と組み合わせて言います。'
  en.a1.unit50.lesson03.teach.dialogue_line4:
    title: フロント係が鍵を渡す
    gloss: フロント係：結構です。こちらが鍵です。お部屋にはベッドが二つあります。
    note: '*Your room has two beds.* は「お部屋にはベッドが二つあります。」という意味です。'
  en.a1.unit50.lesson03.teach.dialogue_line5:
    title: ミアのWi-Fiの質問
    gloss: ミア：部屋にWi-Fiはありますか。
    note: さっき学んだ質問をもう一度使っています。
  en.a1.unit50.lesson03.teach.dialogue_line6:
    title: フロント係が朝食について話す
    gloss: フロント係：はい。朝食は下の階で、7時から10時までです。
    note: '*from seven to ten* は「7時から10時まで」という意味です。'
  en.a1.unit50.lesson03.teach.dialogue_line7:
    title: レイラのチェックアウトの質問
    gloss: レイラ：ありがとうございます！チェックアウトは何時ですか。
    note: さっき学んだ質問 *What time is check-out?* をもう一度使っています。
  en.a1.unit50.lesson03.teach.dialogue_line8:
    title: フロント係がチェックアウトについて話す
    gloss: フロント係：チェックアウトは11時です。
    note: '*Check-out is at eleven o''clock.* は「チェックアウトは11時です。」という意味です。'
  en.a1.unit50.lesson04.teach.reading_passage:
    title: ゲストハウスで過ごす週末についての文章
    gloss: ゲストハウスで過ごす週末：ミアとレイラは、週末に山へ短い旅行に出かけました。ミアは写真を撮るのが好きで、レイラは絵を描くのが好きなので、くつろぐのにぴったりの場所でした。ゲストハウスに着くと、二人は受付の人に、11月14日から16日まで二泊の予約をしていると伝えました。受付の人が予約の名前をたずね、レイラは自分の名前で予約してあると答えました。部屋にはベッドが二つとWi-Fiがあり、朝食は毎朝7時から10時まで含まれていました。チェックアウトは11時でした。ミアは山の写真をたくさん撮り、レイラは窓から見える景色を小さな絵に描きました。ダニエルはその週末は家にいて、図書館で借りた料理の本のレシピで、自分用の夕食を作りました。ミアとレイラが帰ってくると、二人は彼に写真と絵を見せ、彼はとても気に入りました。
    note: '*Their room had two beds and wifi* は「部屋にはベッドが二つとWi-Fiがあった」という意味です。'
