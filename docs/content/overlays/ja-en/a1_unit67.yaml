    note: '*That is wonderful* は、いい知らせに対する温かい返事です。'
  en.a1.unit67.lesson03.teach.dialogue_line1:
    title: ミアが家族のことをたずねます
    gloss: ミアは「こんにちは、ダニエル。ご家族は元気？」と言います。
    note: '*How is your family?* は、この会話の中心になる質問です。'
  en.a1.unit67.lesson03.teach.dialogue_line2:
    title: ダニエルにいい知らせがあります
    gloss: ダニエルは「みんな元気だよ。いい知らせがあるんだ」と言います。
    note: '*They are well* は「みんな元気です」という意味です。'
  en.a1.unit67.lesson03.teach.dialogue_line3:
    title: ミアがニュースをたずねます
    gloss: ミアは「どんな知らせ？」と言います。
    note: '*What is...?* は、もっと詳しい情報をたずねる表現です。'
  en.a1.unit67.lesson03.teach.dialogue_line4:
    title: お姉さんに赤ちゃんが生まれました
    gloss: ダニエルは「姉に赤ちゃんが生まれたんだ」と言います。
    note: '*My sister has a baby* は、家族のニュースを伝える文です。'
  en.a1.unit67.lesson03.teach.dialogue_line5:
    title: ミアが温かく答えます
    gloss: ミアは「それはすばらしいね」と言います。
    note: '*wonderful* は、温かくて前向きな響きの言葉です。'
  en.a1.unit67.lesson03.teach.dialogue_line6:
    title: ダニエルが会いに行きます
    gloss: ダニエルは「ありがとう。近いうちに会いに行くよ」と言います。
    note: '*soon* は「もうすぐ」「近いうちに」という意味です。'
  en.a1.unit67.lesson03.teach.dialogue_line7:
    title: ミアは、ダニエルが誇らしいはずだと言います
    gloss: ミアは「きっと誇らしいでしょうね」と言います。
    note: '*must be* は、おそらくそうだろうと推測するときに使います。'
  en.a1.unit67.lesson03.teach.dialogue_line8:
    title: ダニエルは誇りに思っています
    gloss: ダニエルは「彼女を誇りに思っているよ」と言います。
    note: '*of her* は、ダニエルのお姉さんを指しています。'
  en.a1.unit67.lesson04.teach.family_note:
    title: 家族からの知らせ
    gloss: 家族からの知らせ：いい知らせです。姉に赤ちゃんが生まれました。近いうちに会いに行きます。
    note: この知らせは、いい知らせと、これから会いに行くことを短く伝えています。
  en.a1.unit67.lesson04.teach.reading_passage:
    title: 本文：家族のいい知らせ
    gloss: 家族のいい知らせ：ミアは、ダニエルに家族の様子をたずねました。ダニエルは、みんな元気だと答えました。それから、いい知らせを伝えました。お姉さんに赤ちゃんが生まれたのです。ミアは、それはすばらしい知らせだと言いました。ダニエルは、自分と家族が近いうちに会いに行くと言いました。彼はお姉さんを誇りに思っていました。あとで、ミアは短いメッセージを送りました。「あなたの家族のことをうれしく思います。」
    note: '*shared good news* は「いい知らせを伝えた」という意味です。'
