teaching:
  en.b1.unit03.lesson01.teach.if:
    title: if
    gloss: もし〜なら
    note: '*if* は条件を表します。「〜のとき」のように時を表すなら *when* を使い、*if* は実際にそうなるかどうかわからない条件にだけ使います。'
    example_gloss: 雨が降ったら、私たちは家にいます。
  en.b1.unit03.lesson01.teach.rain:
    title: rain
    gloss: 雨、雨が降る
    note: '*rain* は、空から降ってくる水のこと、または「雨が降る」という意味です。'
    example_gloss: 今週末は雨が降るかもしれません。
  en.b1.unit03.lesson01.teach.stay_home:
    title: stay home
    gloss: 家にいる
    note: '*stay home* は、外出せずに家にいることを表します。'
    example_gloss: 雨が降ったら、私たちは家にいます。
  en.b1.unit03.lesson01.teach.weekend:
    title: weekend
    gloss: 週末
    note: '*weekend* は、土曜日と日曜日のことです。'
    example_gloss: 週末の予定は何ですか。
  en.b1.unit03.lesson01.teach.free_time:
    title: free time
    gloss: 自由な時間
    note: '*free time* は、仕事をしていなくて、忙しくもない時間のことです。'
    example_gloss: 最近は、あまり自由な時間がありません。
  en.b1.unit03.lesson01.teach.paint:
    title: paint
    gloss: 絵を描く
    note: '*paint* は、絵の具で絵を描くことを表します。'
    example_gloss: レイラは週末に絵を描くのが大好きです。
  en.b1.unit03.lesson02.teach.if_rains_stay_home:
    title: eine reale Bedingung in der Zukunft
    gloss: 明日雨が降ったら、私たちは家にいます。
    note: '*if + present, will* + 動詞の原形 は、未来における現実的で可能性のある条件を表します。'
  en.b1.unit03.lesson02.teach.if_have_free_time_paint:
    title: eine weitere reale Bedingung
    gloss: 今週末に自由な時間があったら、絵を描きます。
    note: 同じ構文です:*if + present, will* + 動詞の原形。
  en.b1.unit03.lesson02.teach.grammar_real_condition:
    title: reale Bedingungen
    gloss: 雨が降ったら、私たちは家にいます。時間があったら、絵を描きます。
    note: 未来のことでも、*if* のあとは現在形を使います。*will rain* とは言いません。
  en.b1.unit03.lesson03.teach.would:
    title: would
    gloss: 〜するだろう(仮定の話で)
    note: '*would* + 動詞の原形は、現実とは違う仮定の状況を、現在について述べるときに使います。'
    example_gloss: もっと時間があったら、毎日絵を描くのに。
  en.b1.unit03.lesson03.teach.class:
    title: class
    gloss: 授業、教室、クラス
    note: '*class* は、先生がいる、きちんと組まれた授業やクラスのことです。'
    example_gloss: 彼女の家の近くに絵画教室がありました。
  en.b1.unit03.lesson03.teach.reading_passage:
    title: 'Lesetext: wenn sie mehr Freizeit hätte'
    gloss: レイラは絵を描くのが大好きですが、自由な時間があまりありません。もっと自由な時間があれば、毎日絵を描くのに。先月、彼女の家の近くに絵画教室がありました。もっと早く知っていれば、申し込んだのに。今では、毎週新しい教室がないか調べています。
    note: 現在についての現実とは違う仮定と、過去についての現実とは違う仮定が出てくる、短い読み物です。
  en.b1.unit03.lesson04.teach.q_weekend_plans:
    title: Daniel fragt nach dem Wochenende
    gloss: ダニエルは言います。「週末の予定は何?」
    note: 会話を始めるための、簡単な自由回答の質問です。
  en.b1.unit03.lesson04.teach.a_walk_or_stay_home:
    title: Leilas Pläne, je nach Wetter
    gloss: レイラは言います。「雨が降らなければ、散歩に行くよ。雨が降ったら、家にいて絵を描くよ。」
    note: 天気によって決まる、現実的な条件が二つ続いています。
  en.b1.unit03.lesson04.teach.q_take_class:
    title: Daniel fragt nach dem Malkurs
    gloss: ダニエルは言います。「いいね。先月のあの絵画教室には行ったの?」
    note: 過去のことについての、続けての質問です。
  en.b1.unit03.lesson04.teach.a_would_have_signed_up:
    title: Leilas Reue über die Vergangenheit
    gloss: レイラは言います。「ううん、行かなかったの。もっと早く知っていれば、申し込んだんだけど。」
    note: '*if + past perfect, would have* + 過去分詞 は、過去についての現実とは違う仮定や、後悔を表します。'
  en.b1.unit03.lesson04.teach.q_should_join:
    title: Daniel gibt eine Empfehlung
    gloss: ダニエルは言います。「それは残念だね。もしまたあったら、参加したほうがいいよ。」
    note: ダニエルは *should* を使って、レイラに次の機会を逃さないよう勧めています。
  en.b1.unit03.lesson04.teach.a_will_sign_up:
    title: Leila nimmt sich etwas vor
    gloss: レイラは言います。「そうだね。見つけたら、すぐに申し込むよ。」
    note: 仮定の話ではなく、未来についての新しい現実的な条件です。
