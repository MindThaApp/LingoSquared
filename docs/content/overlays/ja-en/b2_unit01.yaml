    title: The evidence still supports it
lessons:
  en.b2.unit01.lesson01.argument_structure:
    title: 主張・根拠・反駁
  en.b2.unit01.lesson02.building_an_argument:
    title: I agree there are risks, but...
  en.b2.unit01.lesson03.reading_an_argument:
    title: 読解：ハイブリッド勤務を擁護する
  en.b2.unit01.lesson04.the_argument_dialogue:
    title: The benefits outweigh the risks
teaching:
  en.b2.unit01.lesson01.teach.claim:
    title: claim
    gloss: 主張
    note: '*claim* は自分が擁護する立場、つまり主張のことです。ここでは苦情や損害賠償の請求という意味ではありません。'
    example_gloss: 彼女の主張は、この計画を続けるべきだということです。
  en.b2.unit01.lesson01.teach.evidence:
    title: evidence
    gloss: 証拠、裏付け
    note: '*evidence* は、自分の主張を支えるための事実、数字、具体例のことです。'
    example_gloss: この例は、ミアに主張の裏付けとなる証拠を与えます。
  en.b2.unit01.lesson01.teach.counterargument:
    title: counterargument
    gloss: 反論
    note: '*counterargument* は、自分の主張に反する論点のことです。英語では間にハイフンを入れず、一語で書きます。'
    example_gloss: ダニエルは反論を持ち出します。
  en.b2.unit01.lesson01.teach.rebut:
    title: rebut
    gloss: 反駁する、論破する
    note: '*rebut* は、自分の主張を手放さずに、相手の反論に答えることを表します。'
    example_gloss: ミアは証拠を示して、その懸念に反駁します。
  en.b2.unit01.lesson01.teach.concede:
    title: concede
    gloss: 認める、譲歩する
    note: '*concede* は、相手の指摘の一部がもっともだと認めることです。主張全体を取り下げることとは違います。'
    example_gloss: 主張の核心は譲らずに、懸念を認めることはできます。
  en.b2.unit01.lesson01.teach.outweigh:
    title: outweigh
    gloss: 〜を上回る、〜より重みがある
    note: '*outweigh* は、ある利点、リスク、理由が別のものより重要なときに使います。'
    example_gloss: 強い証拠は、懸念を上回ることがあります。
  en.b2.unit01.lesson02.teach.position_with_evidence:
    title: リスクを認めたうえで主張を保つ
    gloss: このプランにリスクがあることは認めますが、証拠は依然として前に進むことを支持しています。
    note: '*I agree..., but...* は、まず相手の点を認めます。そのあとの *but the evidence still supports...* で、自分の主張が変わらないことを示します。'
  en.b2.unit01.lesson02.teach.strongest_reason:
    title: 最も強い理由を述べる
    gloss: 最も強い理由は、アンケートの結果が一貫していたことです。
    note: '*The strongest reason is that...* は、最も重要な根拠を導入する表現です。*that* の後は、主語、動詞の順になることに注意しましょう。'
  en.b2.unit01.lesson02.teach.fair_concern:
    title: もっともな懸念を認める
    gloss: それはもっともな懸念ですが、データは逆の方向を示しています。
    note: '*That is a fair concern; however,...* はプロフェッショナルな響きがあります。懸念を認めたうえで、データでそれに反駁します。'
  en.b2.unit01.lesson02.teach.grammar_argument_shape:
    title: 主張を擁護する
    gloss: 主張を述べ、証拠を示し、最も強い反対意見を認めて、それに反駁します。That is a fair concern や However のような表現を使えば、主張を取り下げることなく、理性的な印象を与えられます。
    note: 日本語の語順を英語に持ち込まないでください。*the data points...* のように、主語の直後に動詞を置きます。*the data in the other direction points* とは言いません。
  en.b2.unit01.lesson03.teach.retention:
    title: retention
    gloss: 従業員の定着
    note: ここでの *retention* は、従業員が辞めずに残ることを表します。
    example_gloss: 定着率が高いということは、チームを離れる従業員が減るということです。
  en.b2.unit01.lesson03.teach.collaboration:
    title: collaboration
    gloss: 協力、共同作業
    note: '*collaboration* は、仕事やプロジェクトで一緒に取り組むことです。否定的な意味合いはなく、日本語の「協力」「共同作業」に近い、ふつうの前向きな語です。'
    example_gloss: よい協力関係は、チームが仕事を終わらせる助けになります。
  en.b2.unit01.lesson03.teach.reading_passage:
    title: 読解：ハイブリッド勤務を擁護する
    gloss: ミアは、会社は来四半期もハイブリッド勤務の体制を維持すべきだと主張しています。彼女の中心的な主張は、ハイブリッド勤務は業績を下げることなく従業員の定着を高める、というものです。最も強い証拠は社員アンケートです。ハイブリッド勤務のチームの社員は、転職を考えていると答える割合が低かったのです。最も強い反論は、毎日出社しないと協力関係が損なわれるかもしれない、というものです。ミアはその懸念を認めつつも、プロジェクトのデータで反駁します。ハイブリッドのチームは納期を守り、評価スコアもわずかに高かったのです。このことから、彼女は利点がリスクを上回ると結論づけています。
    note: この文章は、主張、証拠、反論、反駁、結論という、完全な議論の流れを組み立てています。
  en.b2.unit01.lesson04.teach.q_keep_hybrid:
    title: ミアが主張を述べる
    gloss: ミア：次の四半期もハイブリッド勤務の体制を続けるべきだと思います。
    note: ミアは、はっきりと擁護できる主張から話し始めます。
  en.b2.unit01.lesson04.teach.a_strongest_reason:
    title: ダニエルが理由をたずねる
    gloss: ダニエル：いちばん強い理由は何ですか。
    note: ダニエルは意見を一般的にたずねているのではなく、最も重要な根拠をたずねています。
  en.b2.unit01.lesson04.teach.q_retention_survey:
    title: ミアが証拠を示す
    gloss: ミア：いちばん強い理由は定着率です。社員アンケートでは、ハイブリッドで働いている人ほど、転職を考えていると答える割合が低かったのです。
    note: ミアは、感覚だけでなく、アンケートの結果を証拠として使っています。
  en.b2.unit01.lesson04.teach.a_collaboration_weaker:
    title: ダニエルが反論を挙げる
    gloss: ダニエル：一部のマネージャーは、毎日出社しないと協力関係が弱まると言っています。
    note: これが、このあとミアが答えなければならない反論です。
  en.b2.unit01.lesson04.teach.q_data_rebuttal:
    title: ミアがデータで反駁する
    gloss: ミア：それはもっともな懸念です。ただ、プロジェクトのデータはそれを裏付けていません。ハイブリッドのチームは仕事を期限どおりに納めていて、評価スコアもわずかに高かったのです。
    note: '*does not support it* の *does* は、英語の否定文では do の助けが必要なために使われています。'
  en.b2.unit01.lesson04.teach.a_benefits_outweigh:
    title: ダニエルが立場を要約する
    gloss: ダニエル：つまり、あなたの立場は、利点がリスクを上回るということですね。
    note: '*outweigh* は、利点とリスクを天秤にかけた比較を表します。'
  en.b2.unit01.lesson04.teach.q_improve_routines:
    title: ミアが解決策で締めくくる
    gloss: ミア：そのとおりです。体制をやめるのではなく、会議の進め方を改善すべきです。
    note: ミアは計画を擁護しつつ、現実的な改善案も出しています。
