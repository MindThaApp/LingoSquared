teaching:
  en.a1.unit58.lesson01.teach.museum:
    title: museum
    gloss: 博物館・美術館
    note: '*museum* は「博物館」や「美術館」という意味です。日本語では展示の内容によって呼び分けますが、英語ではどちらも *museum* です。'
    example_gloss: この博物館はとても古いです。
  en.a1.unit58.lesson01.teach.ticket:
    title: ticket
    gloss: チケット（入場券）
    note: '*ticket* は入場するための券、つまり「チケット」や「入場券」という意味です。'
    example_gloss: チケットを1枚お願いします。
  en.a1.unit58.lesson01.teach.exhibition:
    title: exhibition
    gloss: 展覧会・展示
    note: '*exhibition* は、見るために並べられた美術品や物の集まり、つまり「展覧会」や「展示」という意味です。'
    example_gloss: 新しい展覧会があります。
  en.a1.unit58.lesson01.teach.painting:
    title: painting
    gloss: 絵画
    note: '*painting* は、絵の具で描かれた作品、つまり「絵画」という意味です。'
    example_gloss: 私はこの絵がとても好きです。
  en.a1.unit58.lesson01.teach.sculpture:
    title: sculpture
    gloss: 彫刻
    note: '*sculpture* は、石、木、金属などで作られた作品、つまり「彫刻」や「像」という意味です。'
    example_gloss: この彫刻もとても古いです。
  en.a1.unit58.lesson01.teach.guide:
    title: guide
    gloss: ガイド
    note: '*guide* は、訪れた人を案内して説明してくれる人、つまり「ガイド」という意味です。'
    example_gloss: 今日はガイドがいますか？
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_open:
    title: What time does the museum open?
    gloss: 博物館は何時に開きますか？
    note: この疑問文は *what time* で始まり、主な動詞が *open* なので、助動詞 *does* が続きます。
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_close:
    title: What time does the museum close?
    gloss: 博物館は何時に閉まりますか？
    note: '*What time does the museum open?* と同じ疑問文の形で、*open* の代わりに *close* を使っています。'
  en.a1.unit58.lesson02.teach.two_tickets_please:
    title: Two tickets, please.
    gloss: チケットを2枚お願いします。
    note: 文の最後の *please* で、丁寧な頼み方になります。食べ物を注文するときと同じです。
  en.a1.unit58.lesson02.teach.is_there_a_guide_for_the_exhibition:
    title: Is there a guide for the exhibition?
    gloss: 展覧会のガイドはいますか？
    note: '*Is there...?* は、何かがあるかどうかをたずねる表現です。ここではガイドがいるかどうかをたずねています。'
  en.a1.unit58.lesson02.teach.the_museum_is_open_every_day:
    title: The museum is open every day.
    gloss: 博物館は毎日開いています。
    note: '*every day* は「毎日」という意味で、文の最後に置きます。'
  en.a1.unit58.lesson02.teach.i_really_enjoyed_the_paintings:
    title: I really enjoyed the paintings!
    gloss: 絵画がとても楽しかったです！
    note: '*enjoyed* は *enjoy*（楽しむ）の過去形で、楽しかったことを振り返るときに使います。'
  en.a1.unit58.lesson03.teach.dialogue_line1:
    title: ダニエルの質問
    gloss: ダニエルは「こんにちは！博物館は何時に閉まりますか？」と言います。
    note: '*Hi!* はくだけたあいさつです。'
  en.a1.unit58.lesson03.teach.dialogue_line2:
    title: 係員の答え
    gloss: 係員は「5時に閉まります」と言います。
    note: '*at five o''clock* のように、*at* のあとに時刻を置くと、いつ何が起こるかを表せます。'
  en.a1.unit58.lesson03.teach.dialogue_line3:
    title: ミアのお願い
    gloss: ミアは「いいですね。チケットを2枚お願いできますか？」と言います。
    note: '*Can we have...?* は、ものを頼んだりたずねたりするときの丁寧な言い方です。'
  en.a1.unit58.lesson03.teach.dialogue_line4:
    title: 値段
    gloss: 係員は「もちろんです。12ドルです」と言います。
    note: '*That''s* のあとに金額を続けると、値段を伝える言い方になります。'
  en.a1.unit58.lesson03.teach.dialogue_line5:
    title: ガイドについてのダニエルの質問
    gloss: ダニエルは「展覧会のガイドはいますか？」とたずねます。
    note: レッスン2で学んだ *Is there...?* と同じ形です。
  en.a1.unit58.lesson03.teach.dialogue_line6:
    title: ガイドについての係員の答え
    gloss: 係員は「はい、入口の近くにガイドがいます」と言います。
    note: '*there''s* は *there is* の短縮形です。'
  en.a1.unit58.lesson03.teach.dialogue_line7:
    title: ミアが名前をたずねます
    gloss: ミアは「その展覧会は何という名前ですか？」とたずねます。
    note: '*What is ... called?* は、ものの名前をたずねるときによく使う言い方です。'
  en.a1.unit58.lesson03.teach.dialogue_line8:
    title: 展覧会の名前
    gloss: 係員は「Colors of the City という名前です」と言います。
    note: '*It''s called...* は、*What is ... called?* に対する答え方です。'
  en.a1.unit58.lesson03.teach.dialogue_line9:
    title: ダニエルの結びのことば
    gloss: ダニエルは「ありがとうございます！絵を見るのが待ちきれません」と言います。
    note: '*can''t wait to...* は、何かをするのをとても楽しみにしているという意味です。'
  en.a1.unit58.lesson04.teach.museum_notice:
    title: 博物館の案内板
    gloss: 市立博物館：毎日開館、9:00〜17:00。大人のチケット：6ドル。開催中の展覧会：Colors of the City、2号室。
    note: この案内板には、開館時間、料金、展覧会の名前が書かれています。
  en.a1.unit58.lesson04.teach.reading_passage:
    title: ダニエルとミアの文章
    gloss: 博物館・美術館を訪ねて：ある土曜日の午後、ダニエルとミアは一緒に市立博物館を訪ねることにしました。入口で、係員は2人に、博物館は5時に閉まると伝えました。2人はチケットを2枚で12ドルで買いました。ダニエルがガイドについてたずねると、係員は入口の近くにいると答えました。2人は展覧会 Colors of the City を見て、2号室でたくさんの美しい絵を見ました。ダニエルは古い町の広場の絵が気に入り、ミアは夕日の中の川の絵が気に入りました。帰るとき、ミアは「次は彫刻の展覧会を見に来たい」と言いました。
    note: '*decided to visit* のように、*decided* のあとに *to* と動詞の原形を置くと、何をすることに決めたかを表せます。'
