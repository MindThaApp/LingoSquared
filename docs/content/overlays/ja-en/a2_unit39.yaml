teaching:
  en.a2.unit39.lesson01.teach.offer:
    title: offer
    gloss: 内定、オファー
    note: ここでの *offer* は、仕事の内定のことです。動詞の *to offer* は「提供する」という意味です。
    example_gloss: ブライトパス・マーケティングから内定をもらいました。
  en.a2.unit39.lesson01.teach.contract:
    title: contract
    gloss: 雇用契約、契約
    note: '*contract* は、あなたと会社のあいだで交わす書面の取り決めです。'
    example_gloss: 契約期間は1年です。
  en.a2.unit39.lesson01.teach.salary:
    title: salary
    gloss: 給料
    note: '*salary* は、毎月または毎年もらう金額のことです。'
    example_gloss: 給料については、来週お話しできます。
  en.a2.unit39.lesson01.teach.accept:
    title: accept
    gloss: 受ける、承諾する
    note: '*accept* は、提示されたことに「はい」と答えるという意味です。'
    example_gloss: この職をお受けしたいです。
  en.a2.unit39.lesson01.teach.start_date:
    title: start date
    gloss: 開始日、入社日
    note: '*start date* は、新しい仕事の最初の日です。'
    example_gloss: 開始日は、月の最初の月曜日です。
  en.a2.unit39.lesson01.teach.reply:
    title: reply
    gloss: 返事
    note: '*reply* は、メッセージへの返事という名詞と、「返事をする」という動詞の両方に使います。'
    example_gloss: その日のうちに返事を送りました。
  en.a2.unit39.lesson01.teach.grammar_would_like_to:
    title: would like to für einen höflichen Wunsch
    gloss: 内定をお受けしたいです。月曜日から働き始めたいです。
    note: '*I would like to ...* は *I want to ...* より丁寧で、ビジネスの場面に合います。'
  en.a2.unit39.lesson02.teach.thank_you_for_the_interview:
    title: Die Nachricht beginnen
    gloss: 昨日は面接をありがとうございました。
    note: '*Thank you for ...* は、ビジネスの短いお礼のメッセージの、決まった書き出しです。'
  en.a2.unit39.lesson02.teach.still_interested:
    title: Sagen, dass Sie weiterhin interessiert sind
    gloss: 今も、この職にとても関心があります。
    note: '*still* は「今も、引き続き」という意味で、形容詞の前に置きます。'
  en.a2.unit39.lesson02.teach.could_you_tell_me_start_date:
    title: Höflich nach dem Starttermin fragen
    gloss: 開始日を教えていただけますか？
    note: '*Could you tell me ...?* は間接的な質問で、*When is the start date?* より丁寧です。'
  en.a2.unit39.lesson02.teach.would_like_to_accept:
    title: Das Angebot annehmen
    gloss: 内定をお受けしたいです。
    note: これは、仕事を引き受けるときの決まった言い方です。
  en.a2.unit39.lesson02.teach.grammar_indirect_questions:
    title: Indirekte Fragen mit Could you tell me
    gloss: 開始日を教えていただけますか？勤務時間について教えていただけますか？
    note: '*Could you tell me* のあとは、疑問文の語順にしません。*what is the start date* ではなく *the start date* と言います。'
  en.a2.unit39.lesson03.teach.full_time:
    title: full time
    gloss: フルタイム
    note: '*full time* は、1週間をフルに働くという意味です。反対は *part time*（パートタイム）です。'
    example_gloss: この仕事はフルタイムで、週2日だけではありません。
  en.a2.unit39.lesson03.teach.offer_message:
    title: Die Nachricht mit dem Angebot
    gloss: ミア様、火曜日にお越しいただき、ありがとうございました。マーケティング・コーディネーターの職をご提示したいと考えております。契約はフルタイムで、開始日は月曜日です。金曜日までにご返信ください。ブライトパス・マーケティング。
    note: 採用のメッセージには、必ず4つのことが書かれています。職種、契約の種類、開始日、返事の期限です。
  en.a2.unit39.lesson03.teach.please_reply_by_friday:
    title: Die Antwortfrist
    gloss: 金曜日までにご返信ください。
    note: '*by Friday* は「遅くとも金曜日まで」という意味なので、金曜日当日でも大丈夫です。'
  en.a2.unit39.lesson04.teach.q_calling_about_interview:
    title: Die Interviewerin ruft Mia an
    gloss: 面接官が言います：こんにちは、ミアさん。火曜日の面接の件でお電話しました。
    note: '*I am calling about ...* は、ビジネスの電話の、決まった切り出し方です。'
  en.a2.unit39.lesson04.teach.a_still_interested:
    title: Mia sagt, dass sie weiterhin interessiert ist
    gloss: ミアが言います：お電話をありがとうございます。今も、この職にとても関心があります。
    note: レッスン2と同じ文です。
  en.a2.unit39.lesson04.teach.q_offer_you_the_job:
    title: Die Interviewerin bietet die Stelle an
    gloss: 面接官が言います：よかったです。こちらとしても、あなたにこの職をオファーしたいと考えているんです。
    note: ここでの *because* は、ミアの答えと、そのあとの良い知らせをつないでいます。
  en.a2.unit39.lesson04.teach.a_great_news_ask_start_date:
    title: Mia reagiert und fragt nach dem Starttermin
    gloss: ミアが言います：すばらしい知らせですね。開始日を教えていただけますか？
    note: まず知らせに短く反応してから、質問します。
  en.a2.unit39.lesson04.teach.q_start_date_and_contract:
    title: Die Interviewerin nennt Termin und Vertrag
    gloss: 面接官が言います：開始日は月曜日で、契約はフルタイムです。
    note: レッスン3のメッセージにあった2つの事実と同じです。
  en.a2.unit39.lesson04.teach.a_ask_working_hours:
    title: Mia fragt nach den Arbeitszeiten
    gloss: ミアがたずねます：勤務時間について教えていただけますか？
    note: 開始日をたずねたときと同じ、間接的な質問の形です。
  en.a2.unit39.lesson04.teach.q_nine_to_five:
    title: Die Interviewerin nennt die Arbeitszeiten
    gloss: 面接官が言います：9時から5時までで、昼休みが1時間あります。
    note: '*from nine to five* は、1日の勤務時間を表すときの決まった言い方です。'
  en.a2.unit39.lesson04.teach.a_accept_the_offer:
    title: Mia nimmt das Angebot an
    gloss: ミアが言います：ありがとうございます。内定をお受けしたいです。
    note: レッスン2と同じ文です。
  en.a2.unit39.lesson04.teach.q_send_the_contract:
    title: Die Interviewerin beendet das Gespräch
    gloss: 面接官が言います：すばらしいです。契約書を本日お送りします。
    note: '*Wonderful* は、温かく前向きな反応で、ビジネス英語でもふつうに使います。'
