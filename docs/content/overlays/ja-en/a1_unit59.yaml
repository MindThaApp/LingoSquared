teaching:
  en.a1.unit59.lesson01.teach.bank:
    title: bank
    gloss: 銀行
    note: '*bank* は「銀行」という意味です。'
    example_gloss: 銀行はこの近くにあります。
  en.a1.unit59.lesson01.teach.account:
    title: account
    gloss: 口座
    note: '*account* は、ここでは「銀行口座」という意味です。'
    example_gloss: 私は銀行口座を持っています。
  en.a1.unit59.lesson01.teach.card:
    title: card
    gloss: カード
    note: '*card* は、ここでは「キャッシュカード」や「銀行のカード」という意味です。'
    example_gloss: このカードはここで使えます。
  en.a1.unit59.lesson01.teach.cash:
    title: cash
    gloss: 現金
    note: '*cash* は「現金」という意味です。'
    example_gloss: 私は現金が必要です。
  en.a1.unit59.lesson01.teach.atm:
    title: ATM
    gloss: ATM（現金自動預け払い機）
    note: '*ATM* は「ATM」、つまり現金自動預け払い機のことです。アメリカ英語では *cash machine* よりもよく使われます。'
    example_gloss: ATMは外にあります。
  en.a1.unit59.lesson01.teach.balance:
    title: balance
    gloss: 残高
    note: '*balance* は、口座にあるお金の額、つまり「残高」という意味です。'
    example_gloss: 私は残高を確認したいです。
  en.a1.unit59.lesson02.teach.i_need_cash:
    title: I need cash.
    gloss: 私は現金が必要です。
    note: '*need* は「必要とする」という意味で、必要なものがすぐあとに続きます。例：*need cash*。'
  en.a1.unit59.lesson02.teach.where_is_the_atm:
    title: Where is the ATM?
    gloss: ATMはどこですか？
    note: '*Where is...?* は、場所をたずねるときの基本の疑問文です。'
  en.a1.unit59.lesson02.teach.check_my_balance:
    title: I want to check my balance.
    gloss: 私は残高を確認したいです。
    note: '*check my balance* は、残高を確認するときの銀行でよく使う決まった言い方です。'
  en.a1.unit59.lesson02.teach.can_i_use_this_card:
    title: Can I use this card?
    gloss: このカードは使えますか？
    note: '*Can I use...?* は、何かが使えるかどうか、使ってよいかどうかをたずねる表現です。'
  en.a1.unit59.lesson02.teach.enter_your_pin:
    title: Please enter your PIN.
    gloss: 暗証番号を入力してください。
    note: '*enter* は、ここでは「入力する」という意味です。*PIN* は暗証番号そのものを指します。'
  en.a1.unit59.lesson02.teach.atm_outside:
    title: The ATM is outside.
    gloss: ATMは外にあります。
    note: '*outside* は文の最後に置きます。例：*is outside*。'
  en.a1.unit59.lesson03.teach.dialogue_line1:
    title: ミアがATMの場所をたずねます
    gloss: ミアは「こんにちは！ATMはどこですか？」と言います。
    note: '*Where is...?* は場所をたずねる表現です。'
  en.a1.unit59.lesson03.teach.dialogue_line2:
    title: ATMの場所
    gloss: 係員は「ATMは外にあります」と言います。
    note: '*outside* は「外に」という意味です。'
  en.a1.unit59.lesson03.teach.dialogue_line3:
    title: レイラがカードについてたずねます
    gloss: レイラは「このカードは使えますか？」と言います。
    note: '*this card* は、彼女が手に持っているカードのことです。'
  en.a1.unit59.lesson03.teach.dialogue_line4:
    title: カードは使えます
    gloss: 係員は「はい、そのカードは使えますよ」と言います。
    note: '*Yes* は「はい」という意味で、*that card* はレイラのカードのことです。'
  en.a1.unit59.lesson03.teach.dialogue_line5:
    title: ミアが残高を確認したがっています
    gloss: ミアは「残高を確認したいです」と言います。
    note: '*want to check* のように、2つ目の動詞の前に *to* を置きます。'
  en.a1.unit59.lesson03.teach.dialogue_line6:
    title: 暗証番号
    gloss: 係員は「暗証番号を入力してください」と言います。
    note: '*Please* を付けると、丁寧な指示になります。'
  en.a1.unit59.lesson03.teach.dialogue_line7:
    title: レイラも現金が必要です
    gloss: レイラは「私も現金が必要です」と言います。
    note: '*too* は「も」という意味で、ここでは文の最後に置かれています。'
  en.a1.unit59.lesson03.teach.dialogue_line8:
    title: 20ドルを引き出す
    gloss: 係員は「20ドル引き出せますよ」と言います。
    note: '*take out* は、ここでは「お金を引き出す」という意味です。'
  en.a1.unit59.lesson03.teach.dialogue_line9:
    title: ミアが係員にお礼を言います
    gloss: ミアは「ありがとう！助かります」と言います。
    note: '*helpful* は「役に立つ」「助かる」という意味です。'
  en.a1.unit59.lesson04.teach.bank_notice:
    title: 銀行からのお知らせ
    gloss: 銀行からのお知らせ：営業時間 9:00〜16:00。ATMは外にあります。本日の現金引き出し限度額：$100。カードをご利用いただけます。
    note: このお知らせには、営業時間、ATMの場所、引き出し限度額が書かれています。
  en.a1.unit59.lesson04.teach.reading_passage:
    title: 本文：銀行での短い用事
    gloss: 銀行での短い用事：ある朝、ミアとレイラは一緒に銀行へ行きました。ミアは残高を確認したくて、レイラは現金が必要でした。係員は、ATMは外にあると言いました。レイラはカードを使って20ドルを引き出しました。ミアは暗証番号を入力して、残高を確認しました。帰る前に、2人はお知らせを読みました。銀行は9時から4時まで開いていて、現金の限度額は100ドルでした。ミアは、今日の用事は簡単だったと言いました。
    note: '*took out* は、お金を引き出すという意味の *take out* の過去形です。'
