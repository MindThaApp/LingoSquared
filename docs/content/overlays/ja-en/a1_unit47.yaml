teaching:
  en.a1.unit47.lesson01.teach.appointment:
    title: appointment
    gloss: 予約
    note: '*appointment* は、病院などの「予約」や人と会う「約束」という意味です。'
    example_gloss: 木曜日に予約があります。
  en.a1.unit47.lesson01.teach.available:
    title: available
    gloss: 都合がつく
    note: '*available* は「都合がつく」「空いている」という意味です。'
    example_gloss: 木曜日は都合がつきますか。
  en.a1.unit47.lesson01.teach.book:
    title: book
    gloss: 予約する
    note: '*book* は、ここでは名詞の「本」ではなく、「予約する」という意味の動詞です。'
    example_gloss: 予約を取りたいです。
  en.a1.unit47.lesson01.teach.confirm:
    title: confirm
    gloss: 確認する
    note: '*confirm* は「確認する」「確定する」という意味です。'
    example_gloss: 時間を確認してもらえますか。
  en.a1.unit47.lesson01.teach.reschedule:
    title: reschedule
    gloss: 日程を変更する
    note: '*reschedule* は、すでに決まっている予定の日時を別の日時に変えることです。'
    example_gloss: 金曜日に変更できますか。
  en.a1.unit47.lesson02.teach.id_like_to_make_an_appointment:
    title: I'd like to make an appointment.
    gloss: 予約をお願いしたいのですが。
    note: '*I''d* は I would の短縮形です。*I''d like to ...* は「…したいのですが」という丁寧な言い方で、*I want to ...* よりやわらかく聞こえます。'
  en.a1.unit47.lesson02.teach.are_you_available_on_friday:
    title: Are you available on Friday?
    gloss: 金曜日は空いていますか。
    note: 曜日の前には、いつも *on* を使います。日本語の「金曜日に」の「に」にあたります。
  en.a1.unit47.lesson02.teach.what_time_works_for_you:
    title: What time works for you?
    gloss: 何時がご都合よろしいですか。
    note: '*works for you* は、ここでは「あなたの都合に合う」という意味の決まった言い方で、「働く」という意味ではありません。'
  en.a1.unit47.lesson02.teach.that_time_works_for_me:
    title: That time works for me.
    gloss: その時間で大丈夫です。
    note: '*That time works for me.* は「その時間で大丈夫です。」という意味です。'
  en.a1.unit47.lesson02.teach.can_we_reschedule_for_monday:
    title: Can we reschedule for Monday?
    gloss: 月曜日に変更できますか。
    note: '*reschedule for ...* では、新しい日時を表すのに *to* ではなく *for* を使います。'
  en.a1.unit47.lesson02.teach.your_appointment_is_confirmed:
    title: Your appointment is confirmed.
    gloss: ご予約が確定しました。
    note: '*Your appointment is confirmed.* は「ご予約が確定しました。」という意味です。'
  en.a1.unit47.lesson03.teach.dialogue_line1:
    title: ミアの質問
    gloss: ミア：レイラ、マックスは元気？最近ちょっと疲れてるみたいだけど。
    note: '*He seems a little tired lately.* は「最近ちょっと疲れているみたい」という意味です。'
  en.a1.unit47.lesson03.teach.dialogue_line2:
    title: レイラの説明
    gloss: レイラ：元気よ、心配しないで。ちょうど年に一度の健康診断の時期なの。動物病院に電話しなきゃ。
    note: '*due for* は「そろそろ…の時期である」という意味で、時期が来たことに使います。'
  en.a1.unit47.lesson03.teach.dialogue_line3:
    title: レイラが動物病院に電話する
    gloss: レイラ：もしもし、うちの犬の健康診断の予約をお願いしたいのですが。
    note: '*I''d like to* は *I want to* より丁寧な言い方です。日本語の「～したいのですが」にあたります。'
  en.a1.unit47.lesson03.teach.dialogue_line4:
    title: ミアの質問
    gloss: ミア：なんて言ってた？
    note: '*did they say* は、過去の疑問文で助動詞 *did* を使った形です。'
  en.a1.unit47.lesson03.teach.dialogue_line5:
    title: "レイラの答え"
    gloss: レイラ：木曜日の午後3時なら空いているって。
    note: '*at 3pm* のように、はっきりした時刻には *at* を使います。'
  en.a1.unit47.lesson03.teach.dialogue_line6:
    title: ミアの確認
    gloss: ミア：その時間で大丈夫？
    note: '*Does that time work for you?* は、*that time works for you* の疑問文です。主語が三人称単数なので、*does* を使います。'
  en.a1.unit47.lesson03.teach.dialogue_line7:
    title: レイラの確認
    gloss: レイラ：ええ、大丈夫です。木曜日の午後3時ですね。ありがとうございます！マックスの予約が確定しました。
    note: '*Max''s appointment* の *''s* は「～の」という所有を表します。「マックスの予約」という意味です。'
  en.a1.unit47.lesson04.teach.reading_passage:
    title: 予約の取り方についての文章
    gloss: 予約の取り方：医者や歯医者など、何かのサービスを受けたいときは、たいていまず予約が必要です。電話をして、予約をお願いしたいと伝えましょう。受付の人が、空いている日や時間を教えてくれます。都合のよい時間を選ぶと、予約を確定してくれます。予定が変わったら、もう一度電話して、日程を変更したいと伝えます。先週、レイラは愛犬マックスの年に一度の健康診断の予約をするために、動物病院に電話しました。木曜日の午後3時なら空いていたので、レイラはその時間を確認しました。ダニエルも予約があります。月曜日の朝に歯医者で検診を受ける予定です。彼は緊張していなくて、ただ今週は少し忙しいだけだと言いました。
    note: '*a little busy this week* は「今週は少し忙しい」という意味です。'
