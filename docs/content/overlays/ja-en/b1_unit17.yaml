teaching:
  en.b1.unit17.lesson01.teach.regret:
    title: regret
    gloss: 後悔
    note: '*regret* は、したことやしなかったことについての、悲しい気持ちのことです。'
    example_gloss: ダニエルは、締め切りを守れなかったことを後悔しました。
  en.b1.unit17.lesson01.teach.wish:
    title: wish
    gloss: 願い
    note: '*wish* は、実際とは違っていてほしかった、と願うことです。'
    example_gloss: ダニエルには、過ぎた一週間について、一つ願いがありました。
  en.b1.unit17.lesson01.teach.mistake:
    title: mistake
    gloss: ミス
    note: '*mistake* は、判断を誤ってしてしまった、間違った行動のことです。'
    example_gloss: 助けを求めるのをこんなに長く待ったのは、ミスでした。
  en.b1.unit17.lesson01.teach.hindsight:
    title: hindsight
    gloss: 後から振り返ってみると
    note: '*hindsight* は、出来事のあとになってわかる洞察のことです。'
    example_gloss: 後から振り返ってみると、ダニエルはもっと早く声を上げるべきでした。
  en.b1.unit17.lesson01.teach.procrastinate:
    title: procrastinate
    gloss: 先延ばしにする
    note: '*procrastinate* は、やるべきことを後回しにする、という意味です。'
    example_gloss: ダニエルは、難しく感じる仕事を先延ばしにしがちです。
  en.b1.unit17.lesson01.teach.delay:
    title: delay
    gloss: 遅れ
    note: '*delay* は、予定より後になってしまう時間のことです。'
    example_gloss: その遅れのせいで、ダニエルは最初の締め切りを守れませんでした。
  en.b1.unit17.lesson02.teach.wish_had_asked:
    title: I wish I had + 過去分詞
    gloss: もっと早く助けを求めればよかったです。
    note: '*I wish I had asked* は、過去に起こらなかったことについての願いを表します。'
  en.b1.unit17.lesson02.teach.should_have_talked:
    title: I should have + 過去分詞
    gloss: もっと早く上司に相談すればよかったです。
    note: '*I should have talked* は、あとから考えると何が正しい行動だったかを表します。'
  en.b1.unit17.lesson02.teach.if_i_had_asked_would_have_finished:
    title: if I had + 過去分詞, I would have + 過去分詞
    gloss: 最初の週にミアに助けを求めていれば、時間どおりに終わらせられたのに。
    note: '*if I had asked..., I would have finished...* は、過去についての、現実とは違う結果を表します。'
  en.b1.unit17.lesson02.teach.grammar_past_hypothetical:
    title: 過去への後悔を表す形
    gloss: 過去についての後悔を表すには、*wish* + 過去完了（I wish I had asked...）、*should have* + 過去分詞（I should have talked...）、または *if* + 過去完了と *would have* + 過去分詞（If I had asked..., I would have finished...）を使います。三つとも、実際には起こらなかったことを表しています。
    note: 形：*wish* + *had*、*should have*、*if* + *had* ... *would have* から選びます。
  en.b1.unit17.lesson03.teach.looking_back:
    title: looking back
    gloss: 振り返ってみると
    note: '*looking back* は、過去についての振り返りを切り出す表現です。'
    example_gloss: 振り返ってみると、ダニエルはもっと早く助けを求めればよかったと思っています。
  en.b1.unit17.lesson03.teach.missed_deadline:
    title: missed deadline
    gloss: 守れなかった締め切り
    note: '*missed deadline* は、守れなかった期限のことです。'
    example_gloss: ダニエルは、助けを求める前に、締め切りを一つ守れませんでした。
  en.b1.unit17.lesson03.teach.reading_passage:
    title: 読み物：大変だった1か月の振り返り
    gloss: レイラさん、振り返ってみると、もっと早く助けを求めればよかったと思っています。仕事量について、もっと早く上司に相談すべきでした。相談したときには、すでに締め切りを一つ守れていませんでした。最初の週にミアに助けを求めていれば、二つのプロジェクトとも時間どおりに終わらせられたと思います。こんなに長く待ったのは、ミスでした。ダニエル
    note: 過去を振り返る、短いメッセージです。
  en.b1.unit17.lesson04.teach.q_wish_asked_sooner:
    title: ダニエルが振り返りから始める
    gloss: ダニエル：振り返ってみると、もっと早く助けを求めればよかったと思っています。
    note: '*looking back* で、振り返りの会話が始まります。'
  en.b1.unit17.lesson04.teach.a_what_happened:
    title: レイラが聞き返す
    gloss: レイラ：何があったんですか？
    note: もっと詳しく知るための、短くて自由な質問です。
  en.b1.unit17.lesson04.teach.q_should_have_talked_missed:
    title: ダニエルが何をすべきだったかを説明する
    gloss: ダニエル：仕事量について、もっと早く上司に相談すべきでした。相談したときには、すでに締め切りを一つ守れていませんでした。
    note: '*should have talked* と *had already missed* で、後悔と具体的な結果を結びつけています。'
  en.b1.unit17.lesson04.teach.a_fair_regret_fixed:
    title: レイラがダニエルを安心させる
    gloss: レイラ：気にしないで。結局は解決したんだから。
    note: '*Don''t worry* は、自分を責めている人を安心させる表現です。'
  en.b1.unit17.lesson04.teach.q_true_if_had_asked:
    title: ダニエルが違っていたかもしれないことを説明する
    gloss: ダニエル：そうですね。最初の週にミアに助けを求めていれば、二つのプロジェクトとも時間どおりに終わらせられたんです。
    note: '*if I had asked..., I would have finished...* は、過去についての、現実とは違う結果を表します。'
  en.b1.unit17.lesson04.teach.a_now_you_know:
    title: レイラが励まして締めくくる
    gloss: レイラ：まあ、これで次回はわかりましたよね。
    note: 会話を前向きな言葉で締めくくっています。
