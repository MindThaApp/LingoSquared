teaching:
  en.b1.unit05.lesson01.teach.responsible_for:
    title: responsible for
    gloss: 〜に責任がある、〜の担当である
    note: '*responsible for* は、あなたが何かの面倒を見るのが仕事であることを表します。'
    example_gloss: 私は月次報告書の担当です。
  en.b1.unit05.lesson01.teach.update:
    title: update
    gloss: 最新情報、アップデート
    note: '*update* は、物事の進み具合についての新しい情報のことです。'
    example_gloss: 私は毎週、チームに最新状況を伝えています。
  en.b1.unit05.lesson01.teach.deadline:
    title: deadline
    gloss: 締め切り、期限
    note: '*deadline* は、何かを終わらせなければならない期限のことです。'
    example_gloss: 報告書の締め切りは金曜日です。
  en.b1.unit05.lesson01.teach.report:
    title: report
    gloss: 報告書、レポート
    note: '*report* は、仕事や結果についての書面の文書のことです。'
    example_gloss: 私は毎月、売上報告書を書いています。
  en.b1.unit05.lesson01.teach.on_schedule:
    title: on schedule
    gloss: 予定どおりに
    note: '*on schedule* は、物事が計画どおりに進んでいて、遅れていないことを表します。'
    example_gloss: プロジェクトは予定どおりに進んでいます。
  en.b1.unit05.lesson01.teach.behind_schedule:
    title: behind schedule
    gloss: 予定より遅れて
    note: '*behind schedule* は、物事が計画より遅く進んでいることを表します。'
    example_gloss: 今週は、少し予定より遅れています。
  en.b1.unit05.lesson02.teach.responsible_for_report:
    title: Eine Zuständigkeit nennen
    gloss: 私は月次報告書の担当です。
    note: '*I''m responsible for...* は、仕事上の担当を述べる、率直な言い方です。'
  en.b1.unit05.lesson02.teach.project_on_schedule:
    title: Sagen, dass etwas im Zeitplan liegt
    gloss: プロジェクトは予定どおりに進んでいます。
    note: '*on schedule* は、遅れがないことを表します。'
  en.b1.unit05.lesson02.teach.behind_schedule_finish_friday:
    title: Eine Statusmeldung geben
    gloss: 少し予定より遅れていますが、金曜日までには終わらせます。
    note: '*I''m a little behind schedule, but I''ll finish by...* は、遅れを正直に報告し、具体的な期限を伝える言い方です。'
  en.b1.unit05.lesson02.teach.grammar_status_update:
    title: Statusmeldungen geben
    gloss: 私は報告書の担当です。プロジェクトは予定どおりに進んでいます。私は予定より遅れています。
    note: この三つの文は、仕事で担当や進み具合を話すときの、定番の言い方です。
  en.b1.unit05.lesson03.teach.team:
    title: team
    gloss: チーム
    note: '*team* は、一緒に働く人たちのグループのことです。'
    example_gloss: 彼は毎週、チームに短い最新状況を伝えています。
  en.b1.unit05.lesson03.teach.technical_problem:
    title: technical problem
    gloss: 技術的な問題
    note: '*technical problem* は、機器やソフトウェアに関する問題のことです。'
    example_gloss: 彼は技術的な問題のせいで、予定より遅れています。
  en.b1.unit05.lesson03.teach.reading_passage:
    title: 'Lesetext: Daniels Wochenbericht'
    gloss: ダニエルは、月次の売上報告書の担当です。毎週、チームに短い最新状況を伝えています。今週は技術的な問題のせいで少し予定より遅れていますが、金曜日までには終わる見込みです。彼は遅れについて、いつもチームに本当のことを伝えています。
    note: ダニエルが遅れについて正直に話す様子を描いた、短い読み物です。
  en.b1.unit05.lesson04.teach.q_could_you_help_review:
    title: Daniel bittet Mia um Hilfe
    gloss: ダニエルは言います。「ミア、この報告書を送る前に、見直すのを手伝ってもらえる?」
    note: '*could you help me...* は、同僚に助けをお願いする丁寧な言い方です。'
  en.b1.unit05.lesson04.teach.a_of_course_what_help:
    title: Mia sagt zu
    gloss: ミアは言います。「もちろん。何を手伝えばいい?」
    note: '*of course* は、親しみのこもった、はっきりした「はい」の言い方です。'
  en.b1.unit05.lesson04.teach.q_make_sure_numbers:
    title: Daniel erklärt, was er braucht
    gloss: ダニエルは言います。「数字が合っているか、確認したいんだ。」
    note: '*make sure* は、何かが正しいかどうかを確かめることを表します。'
  en.b1.unit05.lesson04.teach.a_check_this_afternoon:
    title: Mia verspricht, es durchzusehen
    gloss: ミアは言います。「いいよ。今日の午後に見て、コメントを送るね。」
    note: '*I''ll check it this afternoon* は、時間を示した、具体的な約束です。'
  en.b1.unit05.lesson04.teach.q_thank_you_appreciate:
    title: Daniel bedankt sich bei Mia
    gloss: ダニエルは言います。「ありがとう、本当に助かるよ。」
    note: '*I really appreciate it* は、心からの感謝を表す言い方です。'
  en.b1.unit05.lesson04.teach.a_youre_welcome_let_me_know:
    title: Mia bietet weitere Hilfe an
    gloss: ミアは言います。「どういたしまして。ほかにも必要なことがあったら言ってね。」
    note: '*let me know if...* は、さらに手助けができる余地を残す言い方です。'
