teaching:
  en.a1.unit17.lesson01.teach.do_you_want_to:
    title: Do you want to see a movie this weekend?
    gloss: 今週末、映画を見ませんか。
    note: '*Do you want to...?* で、何かをしようと誘います。*to* のあとは、語尾の変化のない動詞の原形が続きます。'
  en.a1.unit17.lesson01.teach.would_you_like_to:
    title: Would you like to go for a walk?
    gloss: 散歩に行きませんか。
    note: '*Would you like to...?* は、*Do you want to...?* よりも少し丁寧な言い方です。日本語の「〜しませんか」にあたります。'
  en.a1.unit17.lesson02.teach.sure_id_love_to:
    title: Sure, I'd love to!
    gloss: もちろん、ぜひ行きたいです。
    note: '*I''d love to* は、喜んで誘いを受けるときの言い方です。*I''d* は *I would* の短縮形です。*to* のあとの動詞は、質問にすでに出ているので省略します。'
  en.a1.unit17.lesson02.teach.sorry_cant_busy:
    title: Sorry, I can't. I'm busy on Saturday.
    gloss: すみません、行けません。土曜日は予定があります。
    note: この文は、理由を言って断るときに使います。*can't* は *cannot* の短縮形です。
  en.a1.unit17.lesson02.teach.maybe_another_time:
    title: Maybe another time?
    gloss: また別の機会にどうですか。
    note: 別の機会ならぜひ会いたい、という気持ちを伝えられます。
  en.a1.unit17.lesson03.teach.have_lunch:
    title: have lunch
    gloss: 昼食をとる
    note: '*have lunch* は「昼食をとる」という意味です。ほかの食事の名前と同じように、冠詞をつけません。'
  en.a1.unit17.lesson03.teach.invitation_text:
    title: 招待の文面
    gloss: こんにちは!金曜日にお昼を一緒に食べませんか。午後1時にカフェでどうですか。
    note: これは昼食への招待です。
  en.a1.unit17.lesson04.teach.works_for_me:
    title: Sunday works for me.
    gloss: 日曜日なら大丈夫です。
    note: '*works for me* は、「都合がいい、それで大丈夫」という意味です。'
  en.a1.unit17.lesson04.teach.q_movie_weekend:
    title: 映画についての質問
    gloss: ダニエルが、今週末に映画を見ないかとたずねています
    note: 第1レッスンと同じ質問です。
  en.a1.unit17.lesson04.teach.a_love_to_what_day:
    title: 誘いを受けて日にちをたずねる
    gloss: レイラが「もちろん、ぜひ行きたいです。何曜日ですか」と言っています
    note: レイラはまず誘いを受けて、それから日にちをたずねています。
  en.a1.unit17.lesson04.teach.q_saturday:
    title: 土曜日を提案する
    gloss: ダニエルが「土曜日はどうですか」と言っています
    note: '*How about...?* は、特定の日や時間を提案するときの言い方です。'
  en.a1.unit17.lesson04.teach.a_busy_sunday:
    title: 断って日曜日を提案する
    gloss: レイラが「すみません、行けません。土曜日は予定があります。日曜日はどうですか」と言っています
    note: レイラは土曜日を断って、日曜日を提案しています。
  en.a1.unit17.lesson04.teach.a_sunday_works:
    title: 日曜日に同意する
    gloss: ダニエルが「日曜日なら大丈夫です」と言っています
    note: ダニエルが日曜日に同意したので、予定が決まりました。
