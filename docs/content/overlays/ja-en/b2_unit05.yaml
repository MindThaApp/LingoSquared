course:
  title: 英語 B2
  description: B2レベルの英語を学び、ニュアンスのある会話、議論、推測、職場での話し合いができるようになります。説明は日本語で行います。
units:
  en.b2.unit05.register:
    title: Same message, different register
lessons:
  en.b2.unit05.lesson01.audience_and_formality:
    title: くだけた表現、ビジネス表現、フォーマルな表現
  en.b2.unit05.lesson02_same_request_three_ways:
    title: Can you, could we, I would be grateful
  en.b2.unit05.lesson03.reading_same_message:
    title: 読解：3種類の相手
  en.b2.unit05.lesson04.the_register_dialogue:
    title: To a friend, yes. To the clinic, no.
teaching:
  en.b2.unit05.lesson01.teach.register:
    title: Register
    gloss: 文体のレベル、丁寧さの度合い
    note: '*register* は、どれだけ改まって聞こえるか、あるいはくだけて聞こえるかを表します。英語には日本語の敬語のような体系的な区別がないので、丁寧さは主に文の組み立て方で表します。'
    example_gloss: 相手が変わると、文体のレベルも変わります。
  en.b2.unit05.lesson01.teach.casual:
    title: casual
    gloss: くだけた、カジュアルな
    note: '*casual* は友人や親しい人に向く表現です。より直接的ですが、それだけで失礼になるわけではありません。'
    example_gloss: くだけたメッセージは友人に向いています。
  en.b2.unit05.lesson01.teach.professional:
    title: professional
    gloss: ビジネス上の、丁寧で実務的な
    note: '*professional* は同僚に向く表現です。丁寧で分かりやすく、かしこまりすぎません。'
    example_gloss: ビジネス向けのメッセージは同僚に向いています。
  en.b2.unit05.lesson01.teach.formal:
    title: formal
    gloss: 改まった、フォーマルな
    note: '*formal* は機関や組織に向く表現です。英語では、長めで遠回しな依頼の形を使うことがよくあります。'
    example_gloss: 改まったメッセージは機関や組織に向いています。
  en.b2.unit05.lesson01.teach.audience:
    title: audience
    gloss: 読者・聞き手、受け手
    note: '*audience* は、あなたが書いたり話したりする相手の人、またはグループのことです。'
    example_gloss: 相手によって言葉の選び方が変わります。
  en.b2.unit05.lesson01.teach.institution:
    title: institution
    gloss: 機関、組織
    note: '*institution* は、クリニック、銀行、大学などの組織のことです。'
    example_gloss: クリニックは機関の一つです。
  en.b2.unit05.lesson02.teach.formal_request:
    title: フォーマルな依頼
    gloss: 予約を変更できるかどうかご確認いただけますと幸いです。
    note: '*I would be grateful if you could...* はフォーマルな言い方です。丁寧さは特別な二人称の言葉ではなく、文全体の組み立てで表します。*you* は誰に対しても同じです。'
  en.b2.unit05.lesson02.teach.casual_request:
    title: くだけた依頼
    gloss: 金曜に変更してくれる？
    note: '*Can you...?* は友人にはまったく問題ありませんが、機関に対しては直接的すぎる印象を与えがちです。'
  en.b2.unit05.lesson02.teach.professional_request:
    title: ビジネス上の依頼
    gloss: 金曜日があなたの都合にまだ合うなら、予約を金曜に変更できますか？
    note: '*Could we...?* は、協力的で丁寧な響きで、同僚に向いています。'
  en.b2.unit05.lesson02.teach.to_whom:
    title: Dear scheduling team,
    gloss: 予約調整チーム各位
    note: '*Dear...* は、ごく普通のフォーマルな書き出しです。日本語の手紙の定型的な書き出しほど堅苦しくありません。'
  en.b2.unit05.lesson02.teach.grammar_register_shift:
    title: 文体のレベルを切り替える
    gloss: 文体のレベルを切り替えても、内容は同じに保ちましょう。くだけた英語では直接的な質問を使えます。ビジネス英語ではよく could を使います。フォーマルな英語ではよく I would be grateful if you could を使います。
    note: 相手の呼び方だけを変えれば済むわけではありません。英語では文全体の形が変わります。
  en.b2.unit05.lesson03.teach.stiff:
    title: stiff
    gloss: 堅苦しい、改まりすぎた
    note: '*stiff* は、その場面に対してメッセージが必要以上に改まって聞こえることを表します。'
    example_gloss: 堅苦しいメッセージは、その場面に対して改まりすぎて聞こえます。
  en.b2.unit05.lesson03.teach.appropriate:
    title: appropriate
    gloss: ふさわしい、適切な
    note: '*appropriate* は、言い方が相手や状況に合っていることを表します。'
    example_gloss: ふさわしいメッセージは、相手に合っています。
  en.b2.unit05.lesson03.teach.reading_passage:
    title: 読解文：同じメッセージ、3種類の相手
    gloss: ニーナは予約を金曜日に変更する必要があります。友人には「Can you move it to Friday?」と書きます。このメッセージは直接的でくだけています。同僚には「Could we move the appointment to Friday if that still works for you?」と書きます。このメッセージはビジネス向けで丁寧です。クリニックには「I would be grateful if you could confirm whether my appointment can be moved to Friday.」と書きます。3つの文章とも内容は同じですが、相手によって文体のレベルが変わります。
    note: 英語では、文体のレベルは特別な言葉ではなく、言い回しによって変わります。
  en.b2.unit05.lesson04.teach.q_need_ask:
    title: ニーナが言い方を尋ねる
    gloss: ニーナ：予約の変更をお願いしないといけないの。ただ「Can you move it?」って書いてもいいかな？
    note: '*just write* は、直接的な言い方でよいのかどうか、彼女が迷っていることを示しています。'
  en.b2.unit05.lesson04.teach.a_too_casual:
    title: オスカーが文体の違いを指摘する
    gloss: オスカー：友人にならいいよ。クリニックには、それだとくだけすぎだね。
    note: ここでも英語では普通に *you* を使いますが、文そのものがクリニックには直接的すぎます。
  en.b2.unit05.lesson04.teach.q_colleague:
    title: ニーナが同僚への書き方を尋ねる
    gloss: ニーナ：同僚にはどう書く？
    note: 同僚には、最大限に改まった文体ではなく、ビジネス向けの文体が合います。
  en.b2.unit05.lesson04.teach.a_colleague_request:
    title: オスカーが同僚向けの文を示す
    gloss: オスカー：「Could we move the appointment to Friday if that still works for you?」と書くかな。
    note: '*Could we* と *if that still works for you* が、依頼を柔らかくしています。'
  en.b2.unit05.lesson04.teach.q_clinic:
    title: ニーナがクリニックへの書き方を尋ねる
    gloss: ニーナ：じゃあ、クリニックには？
    note: 機関に対しては、もっと改まった依頼の形が必要です。
  en.b2.unit05.lesson04.teach.a_clinic_request:
    title: オスカーがフォーマルな文を示す
    gloss: オスカー：「I would be grateful if you could confirm whether my appointment can be moved to Friday.」と書くかな。
    note: この文は、ぶっきらぼうに行動を求めるのではなく、確認をお願いしています。
  en.b2.unit05.lesson04.teach.q_same_message:
    title: ニーナがまとめる
    gloss: ニーナ：同じメッセージでも、文体のレベルは違うんだね。
    note: 内容は変わりません。予約を金曜に変更することです。
  en.b2.unit05.lesson04.teach.a_content_stays:
    title: オスカーが同意する
    gloss: オスカー：その通り。内容は同じだけど、改まりの度合いが変わるんだ。
    note: これが B2 レベルで文体を使い分けるうえでの要点です。
