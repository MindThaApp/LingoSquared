teaching:
  en.b1.unit19.lesson01.teach.main_point:
    title: main point
    gloss: 要点
    note: '*main point* は、文章や会話の中でいちばん大切な考えのことです。'
    example_gloss: 会議の要点は、予算でした。
  en.b1.unit19.lesson01.teach.detail:
    title: detail
    gloss: 細かい点
    note: '*detail* は、要点を補う、ちょっとした追加の情報のことです。'
    example_gloss: ミアは、スケジュールについて細かい点を一つ付け加えました。
  en.b1.unit19.lesson01.teach.in_summary:
    title: in summary
    gloss: 要約すると
    note: '*in summary* は、長い説明の最後に、短くまとめた内容を切り出す表現です。'
    example_gloss: 要約すると、プロジェクトは来月終わります。
  en.b1.unit19.lesson01.teach.in_short:
    title: in short
    gloss: つまり
    note: '*in short* は、会話の中で、手っ取り早く要点を言うときの、くだけた言い方です。'
    example_gloss: つまり、チームは計画に合意しました。
  en.b1.unit19.lesson01.teach.in_your_own_words:
    title: in your own words
    gloss: 自分の言葉で
    note: '*in your own words* は、元の文をそのまま使わずに説明してほしい、という頼み方です。'
    example_gloss: 計画を、自分の言葉で説明してください。
  en.b1.unit19.lesson02.teach.in_summary_budget_client:
    title: In summary, ...（要約する）
    gloss: 要約すると、会議では予算と新しいお客様について話しました。
    note: '*In summary, the meeting covered...* は、話し合った内容を短くまとめる表現です。'
  en.b1.unit19.lesson02.teach.main_point_under_budget:
    title: The main point was that ...（要点を伝える）
    gloss: 要点は、今月は予算内に収まっている、ということでした。
    note: '*The main point was that...* は、細かい点とは分けて、いちばん大切な考えを示す表現です。'
  en.b1.unit19.lesson02.teach.grammar_summary_structure:
    title: 要約の組み立て方
    gloss: 要約は、*In summary* や *In short* のような表現で始め、そのあとに要点だけを、順番どおりに、短い文で述べます。細かい点とは分けて、いちばん大切な考えを目立たせたいときは、*The main point was that...* を使います。
    note: 形：*In summary* / *In short* で始め、要点は *The main point was that...* で示します。
  en.b1.unit19.lesson03.teach.condensed:
    title: condensed
    gloss: 短くまとめた
    note: '*condensed* は、要点を残したまま短くした要約を表します。'
    example_gloss: ミアは、ダニエルに会議の内容を短くまとめた要約を渡しました。
  en.b1.unit19.lesson03.teach.original_article:
    title: original article
    gloss: 元の記事
    note: '*original article* は、要約する前の、もとの文章全体のことです。'
    example_gloss: レイラの要約は、元の記事とよく合っていました。
  en.b1.unit19.lesson03.teach.reading_passage:
    title: 読み物：短い記事を要約する
    gloss: レイラは、デザインのコースのために、職場でのコミュニケーションについての長い記事を読みました。元の記事には、たくさんの例や背景情報がありましたが、レイラに必要なのは要点だけでした。彼女は自分の言葉で、短くまとめた要約を書きました。職場でのコミュニケーションは、メッセージが明確で短いとき、そして人が推測せずに質問をするときに、いちばんうまくいく、という内容です。例の大部分は、要点ではなく細かい点だったので省きました。先生は、その要約は大切な考えを正しい順番で残している、と言いました。
    note: 短い読み物です。
  en.b1.unit19.lesson04.teach.q_missed_meeting:
    title: ダニエルが説明を求める
    gloss: ダニエル：会議に出られなかったんです。何があったか教えてもらえますか？
    note: 要約を頼むための、自由な質問です。
  en.b1.unit19.lesson04.teach.a_in_short_budget_client:
    title: ミアが短くまとめる
    gloss: ミア：もちろん。つまり、予算と新しいお客様について話しました。
    note: '*in short* は、手っ取り早い、くだけた要約を切り出します。'
  en.b1.unit19.lesson04.teach.q_main_point_budget:
    title: ダニエルが要点をたずねる
    gloss: ダニエル：予算についての要点は何でしたか？
    note: 要点をたずねる、的を絞った質問です。
  en.b1.unit19.lesson04.teach.a_under_budget_this_month:
    title: ミアが要点を伝える
    gloss: ミア：要点は、今月は予算内に収まっている、ということでした。
    note: '*the main point was that...* は、いちばん大切な考えを目立たせます。'
  en.b1.unit19.lesson04.teach.q_other_details:
    title: ダニエルが詳細をたずねる
    gloss: ダニエル：よかった。ほかに細かい点はありましたか？
    note: 細かい点についての、続きの質問です。
  en.b1.unit19.lesson04.teach.a_client_meeting_moved:
    title: ミアが細かい点を伝える
    gloss: ミア：小さな点が一つだけ。お客様との打ち合わせが、来週に変更になりました。
    note: '*just one small detail* は、ちょっとした補足の事実を切り出します。'
  en.b1.unit19.lesson04.teach.q_thanks_for_summary:
    title: ダニエルがミアにお礼を言う
    gloss: ダニエル：要約をありがとう。とても助かります。
    note: 会話を、感謝の言葉で締めくくっています。
