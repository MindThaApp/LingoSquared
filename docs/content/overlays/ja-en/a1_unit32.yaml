  en.a1.unit32.lesson01.teach.cat:
    title: cat
    gloss: 猫
    note: '*cat* は「猫」という意味です。'
    example_gloss: 姉の猫は黒いです。
  en.a1.unit32.lesson01.teach.fish:
    title: fish
    gloss: 魚
    note: '*fish* は「魚」という意味です。'
    example_gloss: 彼は魚を飼っています。
  en.a1.unit32.lesson01.teach.bird:
    title: bird
    gloss: 鳥
    note: '*bird* は「鳥」という意味です。'
    example_gloss: 私たちは鳥を飼っています。
  en.a1.unit32.lesson01.teach.pet:
    title: pet
    gloss: ペット
    note: '*pet* は「ペット」という意味で、*pets* はその複数形です。*Do you have any pets?* の *any* に注目しましょう。英語では、疑問文や否定文で複数形や数えられない名詞の前に、ふつう *any* を使います。日本語には対応する語がありませんが、英語ではこの *any* を省略しないのが自然です。'
    example_gloss: ペットを飼っていますか。
  en.a1.unit32.lesson02.teach.name_is:
    title: Her name is Luna.
    gloss: 名前はルナです。
    note: 英語では、動物の性別がわかっているときは *her*/*his*（*she*/*he*）を使います。日本語では代名詞を使わずに言えることが多いですが、英語では必要です。*Her name is Luna* は、メスの動物について話している文です。
  en.a1.unit32.lesson02.teach.play:
    title: play
    gloss: 遊ぶ
    note: '*play* は「遊ぶ」という意味です。'
    example_gloss: 私の犬は遊ぶのが好きです。
  en.a1.unit32.lesson02.teach.walk:
    title: walk
    gloss: 散歩に連れて行く
    note: '*walk* は、ここではペットを散歩に連れて行くという意味です。'
    example_gloss: 毎日、犬を散歩に連れて行きます。
  en.a1.unit32.lesson02.teach.friendly:
    title: friendly
    gloss: 人なつっこい
    note: '*friendly* は「人なつっこい」「親しみやすい」という意味です。'
    example_gloss: 彼女の猫はとても人なつっこいです。
  en.a1.unit32.lesson02.teach.small:
    title: small
    gloss: 小さい
    note: '*small* は「小さい」という意味です。'
    example_gloss: その魚は小さいです。
  en.a1.unit32.lesson03.teach.dialogue_line1:
    title: ダニエルの質問
    gloss: ダニエルは「ミア、ペットを飼っていますか」とたずねています。
    note: 疑問文の *any* には、日本語に直接対応する語がありません。英語では、ふつう省略しません。
  en.a1.unit32.lesson03.teach.dialogue_line2:
    title: "ミアの答え"
    gloss: ミアは「はい、猫を飼っています。名前はルナです」と言っています。
    note: 猫がメスだとわかっているので、*She* と *her* を使っています。
  en.a1.unit32.lesson03.teach.dialogue_line3:
    title: ダニエルの続きの質問
    gloss: ダニエルは「いいですね！ 遊ぶのは好きですか」と言っています。
    note: '*Does* は、*she* や *he* が主語の疑問文で使う助動詞です（do-support）。'
  en.a1.unit32.lesson03.teach.dialogue_line4:
    title: "ミアの答え"
    gloss: ミアは「はい、ボールで遊ぶのが大好きです。あなたは？」と言っています。
    note: '*What about you?* は、同じ質問を相手に返す、短くて自然な言い方です。'
  en.a1.unit32.lesson03.teach.dialogue_line5:
    title: "ダニエルの答え"
    gloss: ダニエルは「小さな魚を飼っていますが、犬がほしいです」と言っています。
    note: '*but* は、ここでは反対の内容をつなぎます。すでにペットを飼っているけれど、別の動物がほしい、という意味です。'
  en.a1.unit32.lesson04.teach.reading_passage:
    title: レイラとダニエルについての文章
    gloss: レイラはマックスという名前の犬を飼っています。大きくて、とても人なつっこい犬です。毎朝、散歩に連れて行きます。ダニエルは犬を飼っていませんが、小さな魚を飼っています。魚に散歩は必要ありませんが、ダニエルは泳ぐ姿を見るのが好きです。
    note: マックスはオスなので、*He* を使っています。ここでも、動物の実際の性別に合わせて *she* か *he* を選びます。
