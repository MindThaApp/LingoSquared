course:
  title: 英語 B1
  description: 義務、可能性、仮定の話、日常の出来事の語りを学べる、B1レベルの英語コースです。日本語で詳しく解説します。
units:
  en.b1.unit04.debate:
    title: I agree、I disagree、because
lessons:
  en.b1.unit04.lesson01.debate_vocabulary:
    title: Agree、disagree、opinion
  en.b1.unit04.lesson02.agreeing_and_disagreeing:
    title: I agree that / I disagree that
  en.b1.unit04.lesson03.reading_two_opinions:
