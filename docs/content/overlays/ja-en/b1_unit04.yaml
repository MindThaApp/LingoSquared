teaching:
  en.b1.unit04.lesson01.teach.agree:
    title: agree
    gloss: 賛成する、同意する
    note: '*agree* は、相手が正しいと思うことを表します。'
    example_gloss: 私はあなたに賛成です。
  en.b1.unit04.lesson01.teach.disagree:
    title: disagree
    gloss: 反対する、意見が違う
    note: '*disagree* は、相手が正しくないと思うことを表します。'
    example_gloss: 私はその意見には反対です。
  en.b1.unit04.lesson01.teach.opinion:
    title: opinion
    gloss: 意見
    note: '*opinion* は、あることについての個人的な考えのことです。'
    example_gloss: 誰でも、それぞれ違う意見を持っています。
  en.b1.unit04.lesson01.teach.believe:
    title: believe
    gloss: 思う、信じる
    note: '*believe* は、あることが本当だと思うことを表します。'
    example_gloss: それはいい考えだと思います。
  en.b1.unit04.lesson01.teach.reason:
    title: reason
    gloss: 理由
    note: '*reason* は、意見の背景にある説明のことです。'
    example_gloss: なぜそう思うのですか。
  en.b1.unit04.lesson01.teach.save_time:
    title: save time
    gloss: 時間を節約する
    note: '*save time* は、何かにかかる時間が短くて済むことを表します。'
    example_gloss: 在宅勤務のおかげで、時間を節約できます。
  en.b1.unit04.lesson02.teach.agree_that_saves_time:
    title: 賛成して理由を伝える
    gloss: 在宅勤務のほうが時間を節約できるので、そのほうがいいということに賛成です。
    note: '*I agree that... because...* は、意見と理由を結びつけます。'
  en.b1.unit04.lesson02.teach.disagree_that_miss_coworkers:
    title: 反対して理由を伝える
    gloss: 同僚に会えなくなるので、そのほうがいいとは思いません。
    note: '*I disagree that... because...* は、反対の意見と理由を結びつけます。'
  en.b1.unit04.lesson02.teach.grammar_agree_disagree_that:
    title: agree that / disagree that
    gloss: そのほうがいいということに賛成です。そのほうがいいとは思いません。
    note: '*agree* や *disagree* のあとの *that* は、賛成または反対する意見の内容を示す節を導きます。'
  en.b1.unit04.lesson03.teach.focus:
    title: focus
    gloss: 集中する
    note: '*focus* は、注意を何かに向けることを表します。'
    example_gloss: 彼女は家のほうが集中しやすいです。
  en.b1.unit04.lesson03.teach.respect:
    title: respect
    gloss: 尊重する
    note: '*respect* は、賛成できなくても、相手の意見を大切にすることを表します。'
    example_gloss: 彼らはお互いの意見を尊重しています。
  en.b1.unit04.lesson03.teach.reading_passage:
    title: 読み物：2つの意見
    gloss: ミアは、在宅勤務のほうが集中しやすいのでいいと考えています。レイラは反対です。彼女は、毎日同僚に会うのが好きなので、出社するほうがいいと考えています。二人は意見が合いませんが、お互いの意見を尊重しています。
    note: 正反対の二つの意見が出てくる、短い読み物です。
  en.b1.unit04.lesson04.teach.q_working_from_home:
    title: ダニエルが討論を始める
    gloss: ダニエルは言います。「在宅勤務のほうが、オフィスで働くよりいいと思う?」
    note: 意見の違いのきっかけをつくる、自由回答の質問です。
  en.b1.unit04.lesson04.teach.a_disagree_miss_coworkers:
    title: レイラが違う見方をする
    gloss: レイラは言います。「そのほうがいいとは思わないな。同僚との大事な会話を逃してしまうと思うから。」
    note: レイラは自分の意見と、その理由を述べています。
  en.b1.unit04.lesson04.teach.q_fair_point_saves_time:
    title: ダニエルがレイラの主張を認めつつ、自分の意見は変えない
    gloss: ダニエルは言います。「それはもっともだね。でも、時間がすごく節約できるっていうのは、そのとおりだと思う。」
    note: '*that''s a fair point* は、自分の意見を言う前に、相手の意見を認める表現です。'
  en.b1.unit04.lesson04.teach.a_agree_saves_time_prefer_office:
    title: レイラが一部は認めつつ、好みは変えない
    gloss: レイラは言います。「時間が節約できるのはそのとおりだけど、それでもオフィスのほうがいいな。」
    note: レイラは一つの点は認めつつも、全体としての意見は変えていません。
  en.b1.unit04.lesson04.teach.q_everyone_different_opinion:
    title: ダニエルが会話を終える
    gloss: ダニエルは言います。「なるほどね。人それぞれ意見が違うよね。」
    note: 意見の対立を、自然で穏やかに終わらせる言い方です。
