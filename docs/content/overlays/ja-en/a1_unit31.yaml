teaching:
  en.a1.unit31.lesson01.teach.tall:
    title: tall
    gloss: 背が高い
    note: '*tall* は、人の身長が「高い」という意味です。'
    example_gloss: 私の兄は背が高いです。
  en.a1.unit31.lesson01.teach.short:
    title: short
    gloss: 背が低い
    note: '*short* は、ここでは人の背が「低い」という意味です。髪などが「短い」という意味にもなります。'
    example_gloss: 私の姉は背が低いです。
  en.a1.unit31.lesson01.teach.hair:
    title: hair
    gloss: 髪、髪の毛
    note: '*hair* は「髪」という意味です。英語では数えられない名詞なので、*her hair is long* と言い、*her hairs are long* とは言いません。'
    example_gloss: 彼女は長い髪をしています。
  en.a1.unit31.lesson01.teach.blond:
    title: blond
    gloss: 金髪の
    note: '*blond* は「金髪の」という意味です。'
    example_gloss: 彼の髪は金色です。
  en.a1.unit31.lesson01.teach.curly:
    title: curly
    gloss: くせ毛の、巻き毛の
    note: '*curly* は「巻き毛の、くるくるした」という意味です。'
    example_gloss: レイラは巻き毛です。
  en.a1.unit31.lesson02.teach.eyes:
    title: eyes
    gloss: 目
    note: '*eyes* は「目」という意味です(複数形)。'
    example_gloss: 私は茶色い目をしています。
  en.a1.unit31.lesson02.teach.blue:
    title: blue
    gloss: 青い
    note: '*blue* は「青い」という意味です。'
    example_gloss: 彼女の目は青いです。
  en.a1.unit31.lesson02.teach.brown:
    title: brown
    gloss: 茶色の
    note: '*brown* は「茶色の」という意味です。'
    example_gloss: 私の目は茶色です。
  en.a1.unit31.lesson02.teach.green:
    title: green
    gloss: 緑の
    note: '*green* は「緑の」という意味です。'
    example_gloss: 彼は緑色の目をしています。
  en.a1.unit31.lesson02.teach.glasses:
    title: glasses
    gloss: めがね
    note: '*glasses* は「めがね」という意味です。いつも複数形で使い、*wears glasses* で「めがねをかけている」という意味になります。'
    example_gloss: 私の父はめがねをかけています。
  en.a1.unit31.lesson02.teach.what_look_like:
    title: What does she look like?
    gloss: 彼女はどんな見た目ですか。
    note: 語順に注意しましょう。日本語では「彼女はどんな見た目ですか」のように、文末に「ですか」をつけるだけで疑問文になりますが、英語では *look* のような一般動詞の文で、必ず *does* や *do* が必要です。*What does she look like?* と言い、*What looks she like?* とは言いません。この助動詞 *does*(do を使う形)は、日本語を話す学習者がとくに忘れやすい部分です。
  en.a1.unit31.lesson03.teach.dialogue_line1:
    title: レイラの紹介
    gloss: レイラが「今日から新しい同僚が来ます。名前はミアです」と言っています
    note: '*starting today* は「今日から」という意味です。'
  en.a1.unit31.lesson03.teach.dialogue_line2:
    title: ダニエルの質問
    gloss: ダニエルが「どんな見た目ですか」とたずねています
    note: ここでも do を使う形です。*does* を省かないでください。日本語のように、文末を変えるだけでは疑問文になりません。
  en.a1.unit31.lesson03.teach.dialogue_line3:
    title: レイラの説明
    gloss: レイラが「背が高くて、金色の巻き毛です」と言っています
    note: '*She''s* は *she is* の短縮形です。'
  en.a1.unit31.lesson03.teach.dialogue_line4:
    title: ダニエルの追加の質問
    gloss: ダニエルが「めがねをかけていますか」とたずねています
    note: ここでも do を使う形が必要です。*Does she wear glasses?* と言い、*Wears she glasses?* とは言いません。
  en.a1.unit31.lesson03.teach.dialogue_line5:
    title: レイラの答え
    gloss: レイラが「はい、かけています。目も緑色です」と言っています
    note: '*Yes, she does* は、助動詞 *does* をくり返す、短い肯定の答えです。'
  en.a1.unit31.lesson03.teach.dialogue_line6:
    title: ダニエルの最後の言葉
    gloss: ダニエルが「わかりました。今、ドアのところにいる人がそうだと思います」と言っています
    note: '*at the door* は「ドアのところに」という意味です。'
  en.a1.unit31.lesson04.teach.reading_passage:
    title: ダニエルとレイラについての文章
    gloss: ダニエルとレイラは仲のよい友だちですが、見た目は似ていません。ダニエルは背が高く、短い黒髪です。めがねをかけています。レイラは背が低く、長くて巻き毛の茶色い髪です。目は青く、ダニエルの目は茶色です。二人ともよく笑います。
    note: '*don''t look the same* は「似ていない」という意味です。ここでも do を使う形が必要で(*don''t* = *do not*)、否定文でも同じです。'
