    example_gloss: 毎週ごみを分別します。
  en.a1.unit49.lesson01.teach.bin:
    title: bin
    gloss: ごみ箱
    note: '*bin* は「ごみ箱」や、ごみを入れる大きな容器という意味です。'
    example_gloss: これはどの容器に入れればいいですか。
  en.a1.unit49.lesson01.teach.recycle:
    title: recycle
    gloss: リサイクルする
    note: '*recycle* は「リサイクルする」という意味です。'
    example_gloss: ガラスと紙をリサイクルしています。
  en.a1.unit49.lesson01.teach.trash:
    title: trash
    gloss: ごみ
    note: '*trash* は「ごみ」という意味です（アメリカ英語です。*garbage* も同じ意味で使われます）。'
    example_gloss: ごみを出してくれますか。
  en.a1.unit49.lesson01.teach.collection_day:
    title: collection day
    gloss: ごみ収集日
    note: '*collection day* は「ごみ収集日」という意味です。'
    example_gloss: ごみ収集日は火曜日です。
  en.a1.unit49.lesson02.teach.which_bin_does_this_go_in:
    title: Which bin does this go in?
    gloss: これはどの容器に入れればいいですか。
    note: '*go in* は、ここでは「（入れる場所として）属する」「入れるものである」という意味です。'
  en.a1.unit49.lesson02.teach.this_goes_in_the_recycling_bin:
    title: This goes in the recycling bin.
    gloss: これはリサイクル用の容器に入れてください。
    note: '*This goes in the recycling bin.* は「これはリサイクル用の容器に入れます。」という意味です。'
  en.a1.unit49.lesson02.teach.the_green_bin_is_for_glass:
    title: The green bin is for glass.
    gloss: 緑の容器はガラス用です。
    note: '*is for ...* は「…用です」という意味で、何のためのものかを表します。'
  en.a1.unit49.lesson02.teach.can_you_take_out_the_trash:
    title: Can you take out the trash?
    gloss: ごみを出してくれますか。
    note: '*take out* は、*take out the trash* と *take the trash out* のどちらの語順でも言えます。'
  en.a1.unit49.lesson02.teach.collection_day_is_on_tuesday:
    title: Collection day is on Tuesday.
    gloss: ごみ収集日は火曜日です。
    note: '*Collection day is on Tuesday.* は「ごみ収集日は火曜日です。」という意味です。'
  en.a1.unit49.lesson02.teach.what_about_paper_and_food_waste:
    title: What about paper and food waste?
    gloss: 紙と生ごみはどうですか。
    note: '*What about ...?* は「…はどうですか」という意味で、別のものについてたずねるときに使います。'
  en.a1.unit49.lesson03.teach.dialogue_line1:
    title: ミアの注意
    gloss: ミア：待って、そのガラスのびんはごみに入れちゃだめだよ！
    note: '*doesn''t go in the trash* は「ごみには入れない」という意味です。'
  en.a1.unit49.lesson03.teach.dialogue_line2:
    title: ダニエルの謝罪
    gloss: ダニエル：あ、ごめん！どの容器に入れればいいの？
    note: '*Which bin does it go in?* は、さっき学んだ質問の形と同じです。'
  en.a1.unit49.lesson03.teach.dialogue_line3:
    title: ミアの説明
    gloss: ミア：緑の容器に入れて。ここではガラスをリサイクルしてるの。
    note: '*We recycle glass here.* は「ここではガラスをリサイクルしています。」という意味です。'
  en.a1.unit49.lesson03.teach.dialogue_line4:
    title: ダニエルの質問
    gloss: ダニエル：紙と生ごみは？
    note: さっき学んだ *What about ...?* をもう一度使っています。
  en.a1.unit49.lesson03.teach.dialogue_line5:
    title: ミアの説明
    gloss: ミア：紙は青い容器、生ごみは茶色い容器に入れるの。
    note: '*goes in ..., and ... goes in ...* という同じ形を、二つの違うごみに使っています。'
  en.a1.unit49.lesson03.teach.dialogue_line6:
    title: ダニエルの収集日の質問
    gloss: ダニエル：わかった。ごみ収集日はいつ？
    note: '*Got it.* は「わかった」というくだけた言い方です。'
  en.a1.unit49.lesson03.teach.dialogue_line7:
    title: "ミアの答え"
    gloss: ミア：リサイクルの容器は火曜日に出して、普通のごみは金曜日に出すの。
    note: ミアは、ごみの種類ごとに違う曜日を言っています。リサイクルは火曜日、普通のごみは金曜日です。
  en.a1.unit49.lesson03.teach.dialogue_line8:
    title: ダニエルの約束
    gloss: ダニエル：ありがとう！次からはちゃんと全部分別するよ。
    note: '*I''ll sort everything correctly next time.* は「次からはちゃんと全部分別します。」という意味です。'
  en.a1.unit49.lesson04.teach.reading_passage:
    title: ごみの分別のしくみについての文章
    gloss: ごみの分別のしかた：多くのアパートでは、ごみの種類ごとに違う容器があります。ガラスはたいてい緑の容器、紙は青い容器に入れます。生ごみは茶色の容器に入れ、それ以外のものは普通のごみ用の黒い容器に入れます。容器は週に一回しか回収されないので、ごみ収集日を知っておくと便利です。ダニエルは図書館で借りた料理の本のレシピを練習していて、ミアのアパートでよくいっしょに料理をします。昨夜、彼は本のレシピで料理を作り、そのあとガラスのびんを普通のごみに入れそうになりました。ミアは彼を止めて、彼女の建物でのごみの分別のしかたを教えました。彼女は、リサイクルの容器は火曜日に、普通のごみは金曜日に出すのだと説明しました。ダニエルは感謝して、これからは全部ちゃんと分別すると言いました。
    note: '*almost put a glass jar in the regular trash* は「ガラスのびんを普通のごみに入れそうになった」という意味です。'
