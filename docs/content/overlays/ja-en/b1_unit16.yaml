teaching:
  en.b1.unit16.lesson01.teach.advice:
    title: advice
    gloss: 助言、アドバイス
    note: '*advice* は、相手が何をするべきかについての意見のことです。'
    example_gloss: レイラは、ダニエルに役に立つアドバイスをしました。
  en.b1.unit16.lesson01.teach.suggest:
    title: suggest
    gloss: 提案する
    note: '*suggest* は、検討してもらうためにアイデアを出す、という意味です。'
    example_gloss: レイラは、仕事量をうまく管理する方法を提案しました。
  en.b1.unit16.lesson01.teach.overwhelmed:
    title: overwhelmed
    gloss: 手が回らない
    note: '*overwhelmed* は、こなせる以上のことをしなければならないと感じる気持ちです。'
    example_gloss: ダニエルは、二つのプロジェクトで手が回らなくなっていました。
  en.b1.unit16.lesson01.teach.prioritize:
    title: prioritize
    gloss: 優先順位をつける
    note: '*prioritize* は、いちばん大事な仕事を先にする、という意味です。'
    example_gloss: ダニエルは、締め切りが近いほうのプロジェクトを優先することにしました。
  en.b1.unit16.lesson01.teach.workload:
    title: workload
    gloss: 仕事量
    note: '*workload* は、ある人がこなさなければならない仕事の総量のことです。'
    example_gloss: ダニエルの仕事量は、3月にチームに加わってから増えました。
  en.b1.unit16.lesson01.teach.decline:
    title: decline
    gloss: 断る
    note: '*decline* は、提案や申し出を丁寧に断る、という意味です。'
    example_gloss: ダニエルは、アドバイスを受け入れることも、丁寧に断ることもできました。
  en.b1.unit16.lesson02.teach.if_i_were_you:
    title: if I were you, I would + 動詞の原形
    gloss: 私があなたなら、上司に相談します。
    note: '*if I were you, I would* は、アドバイスをするときに使う、現実とは違う仮定の形です。'
  en.b1.unit16.lesson02.teach.you_should_prioritize:
    title: you should + 動詞の原形
    gloss: 締め切りが近いほうのプロジェクトを優先したほうがいいですよ。
    note: '*you should* は、はっきりとした勧め方です。'
  en.b1.unit16.lesson02.teach.how_about:
    title: how about + -ing
    gloss: 同僚に手伝ってもらうのはどうですか。
    note: '*how about + -ing* は、提案をやわらかく伝える言い方です。'
  en.b1.unit16.lesson02.teach.grammar_advice_forms:
    title: アドバイスをする形
    gloss: アドバイスや提案には、いくつかの形があります。*If I were you, I would...*（現実とは違う仮定）、*You should...*（はっきりした勧め）、*How about + -ing...?*（やわらかい提案）です。どれくらい断定的に聞こえさせたいかによって、強めの形かやわらかい形かを選びましょう。
    note: 形：現実とは違う仮定、はっきりした勧め、やわらかい提案から選びます。
  en.b1.unit16.lesson03.teach.deadline:
    title: deadline
    gloss: 締め切り
    note: '*deadline* は、何かを終えなければならない日付のことです。'
    example_gloss: ダニエルの、より近いほうの締め切りは、次の金曜日です。
  en.b1.unit16.lesson03.teach.that_makes_sense:
    title: that makes sense. I'll try it.
    gloss: なるほど、それならやってみます。
    note: '*that makes sense* は、アドバイスを理解して、受け入れたことを示します。'
    example_gloss: なるほど、それなら今週やってみます。
  en.b1.unit16.lesson03.teach.reading_passage:
    title: 読み物：仕事が多すぎるときのアドバイス
    gloss: レイラさん、今週は手が回らなくなっています。二つのプロジェクトを率いていて、その上、夜のクラスもあります。何かアドバイスはありますか。ダニエルさん、私があなたなら、仕事量について上司に相談します。締め切りが近いほうのプロジェクトを優先したほうがいいですよ。もう一方については、ミアに手伝ってもらうのはどうですか。ありがとうございます、なるほどと思いました。やってみて、どうなったかお知らせします。
    note: 同僚どうしの、あたたかいアドバイスのやりとりです。
  en.b1.unit16.lesson04.teach.q_overwhelmed_two_projects:
    title: ダニエルが自分の問題を説明する
    gloss: ダニエル：ちょっと手が回らなくて。二つのプロジェクトを率いていて、それに週3回、夜のクラスもあるんです。
    note: '*a little overwhelmed* は、仕事がちょっと多すぎる状態を表します。'
  en.b1.unit16.lesson04.teach.a_talk_to_manager:
    title: レイラが最初のアドバイスをする
    gloss: レイラ：私があなたなら、仕事量について上司に相談します。
    note: '*if I were you, I would* は、現実とは違う仮定の形です。'
  en.b1.unit16.lesson04.teach.q_dont_want_to_seem:
    title: ダニエルがためらう
    gloss: ダニエル：いい考えですね。でも、こなせない人だと思われたくないんです。
    note: '*I don''t want to seem like* は、自分がどう見られるかについての心配を表します。'
  en.b1.unit16.lesson04.teach.a_prioritize_and_how_about:
    title: レイラが具体的な提案を2つする
    gloss: レイラ：まず、締め切りが近いほうのプロジェクトを優先したほうがいいですよ。もう一方は、同僚に手伝ってもらうのはどうですか。
    note: '*you should* と *how about* で、はっきりした勧めとやわらかい提案を組み合わせています。'
  en.b1.unit16.lesson04.teach.q_ask_mia_this_week:
    title: ダニエルがアドバイスを受け入れる
    gloss: ダニエル：それはいいですね。今週時間があるか、ミアに聞いてみます。
    note: '*I like that* は、アドバイスを受け入れたことを示します。'
  en.b1.unit16.lesson04.teach.a_sounds_like_solid_plan:
    title: レイラが計画を確認する
    gloss: レイラ：いい計画だと思います。
    note: 会話を前向きな言葉で締めくくっています。
