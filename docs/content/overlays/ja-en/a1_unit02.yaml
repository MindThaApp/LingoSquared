  en.a1.unit02.lesson03.teach.names:
    title: レイラが答える
    gloss: レイラ「こんにちは。レイラです。学生です。はじめまして。」
    note: レイラは、名前と役割を言い、決まりのあいさつを添えています。
  en.a1.unit02.lesson03.teach.room_and_member:
    title: ダニエルが会員資格についてたずねる
    gloss: ダニエル「こちらこそ、はじめまして。新しい会員の方ですか？」レイラ「はい、そうです。」
    note: ダニエルはあいさつを返し、会員かどうかをたずねています。会話は引き続き丁寧です。
  en.a1.unit02.lesson03.teach.role:
    title: ダニエルが自分の仕事を伝える
    gloss: ダニエル「私はエンジニアです。」
    note: 英語では、職業の前に *a* または *an* が付きます（*I'm an engineer*）。日本語にはこのような冠詞はありません。
  en.a1.unit02.lesson03.teach.closing:
    title: ダニエルとレイラが会話を終える
    gloss: ダニエル「図書館へようこそ。」レイラ「ありがとうございます。」
    note: 感じのよい、丁寧なしめくくりです。
