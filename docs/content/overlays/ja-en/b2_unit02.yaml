teaching:
  en.b2.unit02.lesson01.teach.may:
    title: may
    gloss: 〜かもしれない、〜の可能性がある
    note: '*may* は可能性を表します。ここでは、*May I...?* のような許可の意味ではありません。'
    example_gloss: これは本当かもしれません。
  en.b2.unit02.lesson01.teach.might:
    title: might
    gloss: ひょっとすると〜かもしれない（控えめ）
    note: '*might* は慎重な可能性を表します。*may* よりも、確信がやや弱いことが多いです。'
    example_gloss: これはひょっとすると本当かもしれません。
  en.b2.unit02.lesson01.teach.must:
    title: must
    gloss: 〜に違いない
    note: ここでの *must* は、証拠に基づく強い結論を表します。義務ではありません。
    example_gloss: これは本当に違いありません。
  en.b2.unit02.lesson01.teach.cannot:
    title: cannot
    gloss: 〜のはずがない、〜ではありえない
    note: '*cannot* は、証拠からある可能性が除外されるときに使います。過去のことなら *cannot have been* になります。'
    example_gloss: これは本当のはずがありません。
  en.b2.unit02.lesson01.teach.deduction:
    title: deduction
    gloss: 証拠に基づく推論
    note: '*deduction* は、手がかりから筋道を立てて考えることです。当てずっぽうではありません。'
    example_gloss: ミアの推論は証拠に基づいています。
  en.b2.unit02.lesson01.teach.guesswork:
    title: guesswork
    gloss: 当て推量
    note: '*guesswork* は、証拠がほとんど、またはまったくない推測のことです。'
    example_gloss: 証拠がなければ、その説明は当て推量にすぎないでしょう。
  en.b2.unit02.lesson01.teach.may_might_contrast:
    title: may と might
    gloss: May と might はしばしば重なります。どちらも可能な説明を示しますが、might のほうがやや控えめに聞こえることが多いです。
    note: 日本語の「もしかしたら」を、いつも *maybe* と訳さないようにしましょう。丁寧に組み立てた文では、*may* や *might* のほうが整った印象になることが多いです。
  en.b2.unit02.lesson02.teach.must_have_gone_down:
    title: 過去についての強い結論
    gloss: 報告書が一つも生成されていないので、サーバーは夜のうちにダウンしたに違いありません。
    note: 日本語の「〜したに違いない」は、英語では *must have* + 過去分詞になります。たとえば *must have gone down* です。
  en.b2.unit02.lesson02.teach.may_have_failed:
    title: 過去に起きた可能性のある原因
    gloss: 報告書は夜のうちに失敗したのかもしれません。
    note: '*may have failed* は、可能性のある原因を表し、確実な結論ではありません。'
  en.b2.unit02.lesson02.teach.might_have_permission:
    title: 慎重な可能性
    gloss: 代わりに、アクセス権限の問題だったのかもしれません。
    note: '*might have been* は原因の可能性を開いたままにし、*must have been* よりも控えめに聞こえます。'
  en.b2.unit02.lesson02.teach.cannot_have_only_report:
    title: 可能性を除外する
    gloss: 報告書の問題だけだったはずがありません。
    note: 日本語の「〜だったはずがない」に当たる英語は、ここでは *cannot have been* で、話し言葉では *can't have been* になります。
  en.b2.unit02.lesson02.teach.grammar_modal_deduction:
    title: 推測のための助動詞
    gloss: 現在についての強い結論には must be を、過去についての強い結論には must have been を使います。現在の可能性には may や might を、過去の可能性には may have や might have を使います。証拠が説明を除外するときは、cannot や cannot have been を使います。
    note: 注意：ここでの *must* は、義務を表す「〜しなければならない」ではなく、「〜に違いない」という結論を表します。
  en.b2.unit02.lesson03.teach.outage:
    title: outage
    gloss: 障害、機能停止
    note: '*outage* は、システムやサービスが動かなくなる障害のことです。'
    example_gloss: システム障害のために、報告書が実行されませんでした。
  en.b2.unit02.lesson03.teach.consequence:
    title: consequence
    gloss: 結果、影響
    note: '*consequence* は、原因や問題から生じる結果のことです。'
    example_gloss: 結果として、ダッシュボードに古いデータが表示されるかもしれません。
  en.b2.unit02.lesson03.teach.reading_passage:
    title: 読解：何が起きた可能性が高いか
    gloss: 夜間の報告書が実行されず、監視ページは空白です。ミアは、サーバーが夜のうちにダウンしたに違いないと言います。ダニエルは、アクセス権限の問題だったのかもしれないと言いますが、それでは監視ページが空白になることは説明できません。経理チームは朝の数字が届いていないかもしれませんし、顧客向けダッシュボードには、報告書が再作成されるまで古いデータが表示されるかもしれません。ミアは完全に確信しているわけではありませんが、彼女の説明は、入手できる証拠からの推論であり、単なる当て推量ではありません。
    note: この文章は、事実、可能性のある原因、強い結論、除外された説明、起こりうる結果を区別しています。
  en.b2.unit02.lesson04.teach.q_no_reports:
    title: ダニエルが事実を述べる
    gloss: ダニエル：夜間の報告書は、どれも生成されていません。
    note: これはすでに分かっている事実で、まだ推測ではありません。
  en.b2.unit02.lesson04.teach.a_server_down:
    title: ミアが強い結論を出す
    gloss: ミア：サーバーは夜のうちにダウンしたに違いありません。
    note: '*must have gone down* は、過去についての強い結論です。'
  en.b2.unit02.lesson04.teach.q_permission_issue:
    title: ダニエルが可能性のある原因を挙げる
    gloss: ダニエル：代わりに、アクセス権限の問題だったのかもしれません。
    note: '*might have been* は選択肢を残しますが、確実なものにはしません。'
  en.b2.unit02.lesson04.teach.a_cannot_only_report:
    title: ミアが限定的な説明を除外する
    gloss: ミア：かもしれませんが、監視ページも空白なので、報告書の問題だけだったはずはありません。
    note: '*cannot have been only...* は、証拠がもっと広い範囲に及ぶため、その説明を除外します。'
  en.b2.unit02.lesson04.teach.q_consequences:
    title: ダニエルが影響をたずねる
    gloss: ダニエル：どんな影響が出ると予想すべきでしょうか。
    note: 原因のあとは、起こりうる結果についての質問が続きます。
  en.b2.unit02.lesson04.teach.a_possible_consequences:
    title: ミアが起こりうる影響を述べる
    gloss: ミア：経理チームは朝の数字が届いていないかもしれませんし、顧客向けダッシュボードには古いデータが表示されるかもしれません。
    note: '*may be missing* と *might show* は、確実な事実ではなく、起こりうる結果を表します。'
  en.b2.unit02.lesson04.teach.q_deduction_guess:
    title: ダニエルが確実さを確認する
    gloss: ダニエル：つまり、それは単なる当て推量ではなく、推論だということですね。
    note: ダニエルは、ミアの推論が証拠に基づいているかをたずねています。
  en.b2.unit02.lesson04.teach.a_evidence_limited:
    title: ミアが結論に条件をつける
    gloss: ミア：はい。証拠は限られていますが、システム障害を示しています。
    note: 強い結論でも、証拠が限られていることを認めることはできます。
