teaching:
  en.a1.unit48.lesson01.teach.library:
    title: library
    gloss: 図書館
    note: '*library* は「図書館」という意味です。'
    example_gloss: 毎週図書館に行きます。
  en.a1.unit48.lesson01.teach.borrow:
    title: borrow
    gloss: 借りる
    note: '*borrow* は「借りる」という意味です。あとで返すことを前提に、人や場所から何かを受け取ることです。'
    example_gloss: この本を借りたいです。
  en.a1.unit48.lesson01.teach.return:
    title: return
    gloss: 返す
    note: '*return* は、ここでは「返す」「返却する」という意味です。'
    example_gloss: この本を返してもいいですか。
  en.a1.unit48.lesson01.teach.due:
    title: due
    gloss: 返却期限
    note: '*due* は「期限が来る」という意味で、図書館では返却の期限日を表します。日本語の「返却期限」にあたりますが、英語では *due* の一語で言えます。'
    example_gloss: 返却期限はいつですか。
  en.a1.unit48.lesson01.teach.card:
    title: library card
    gloss: 図書館カード
    note: '*library card* は「図書館カード」という意味です。'
    example_gloss: これは私の図書館カードです。
  en.a1.unit48.lesson02.teach.do_you_have_a_library_card:
    title: Do you have a library card?
    gloss: 図書館カードを持っていますか。
    note: '*Do you have a library card?* は「図書館カードを持っていますか。」という意味です。'
  en.a1.unit48.lesson02.teach.yes_heres_my_library_card:
    title: Yes, here's my library card.
    gloss: はい、これが私の図書館カードです。
    note: '*here''s* は here is の短縮形です。'
  en.a1.unit48.lesson02.teach.id_like_to_borrow_this_book:
    title: I'd like to borrow this book.
    gloss: この本を借りたいです。
    note: '*I''d like to...* は「…したいのですが」という丁寧な言い方で、前のユニットで学んだものと同じ形です。'
  en.a1.unit48.lesson02.teach.when_is_this_book_due:
    title: When is this book due?
    gloss: この本の返却期限はいつですか。
    note: ここでも *due* が出てきます。日本語の「返却期限」にあたる言葉です。
  en.a1.unit48.lesson02.teach.can_i_return_this_book:
    title: Can I return this book?
    gloss: この本を返してもいいですか。
    note: '*Can I return this book?* は「この本を返してもいいですか。」という意味です。'
  en.a1.unit48.lesson02.teach.your_book_is_due_on_friday:
    title: Your book is due on Friday.
    gloss: 本の返却期限は金曜日です。
    note: '*due on Friday* のように、特定の曜日には *on* を使います。'
  en.a1.unit48.lesson03.teach.dialogue_line1:
    title: レイラの誘い
    gloss: レイラ：この本を図書館に返しに行かなきゃ。いっしょに来る？
    note: '*Do you want to come with me?* は「いっしょに来る？」という意味です。'
  en.a1.unit48.lesson03.teach.dialogue_line2:
    title: ダニエルの返事
    gloss: ダニエル：行く行く！図書館で本を借りたことって、たぶん一度もないと思う。
    note: '*I don''t think I''ve ever ...* は「…したことは一度もないと思う」という意味で、have + 過去分詞の形（現在完了）で経験を表します。'
  en.a1.unit48.lesson03.teach.dialogue_line3:
    title: レイラが受付で話す
    gloss: レイラ：こんにちは、この本を返したいんですが、新しい本も借りたいです。
    note: '*and I''d like to ... too* は「…もしたいです」という意味です。'
  en.a1.unit48.lesson03.teach.dialogue_line4:
    title: 司書の質問
    gloss: 司書：ありがとうございます。図書館カードはお持ちですか。
    note: '*Do you have your library card?* は「図書館カードはお持ちですか。」という意味です。'
  en.a1.unit48.lesson03.teach.dialogue_line5:
    title: "レイラの答え"
    gloss: レイラ：はい、これです。
    note: '*here it is* は「はい、これです」と物を差し出すときの言い方です。'
  en.a1.unit48.lesson03.teach.dialogue_line6:
    title: 司書の説明
    gloss: 司書：結構です。この新しい本は、3週間後までにお返しください。
    note: '*due back in three weeks* は「3週間後までに返却が必要」という意味です。'
  en.a1.unit48.lesson03.teach.dialogue_line7:
    title: ダニエルも借りたい
    gloss: ダニエル：ぼくも図書館カードを作れますか。料理の本を借りたいんです。
    note: '*Can I get ... too?* は「私も…をもらえますか」という意味です。'
  en.a1.unit48.lesson03.teach.dialogue_line8:
    title: 司書がダニエルを手伝う
    gloss: 司書：もちろんです！この用紙に記入してください。
    note: '*fill out this form* は「この用紙に記入する」という意味です。fill out で一つのまとまった動詞のように使います。'
  en.a1.unit48.lesson04.teach.reading_passage:
    title: 図書館のしくみについての文章
    gloss: 図書館に行こう：たいていの図書館では、本や、ときにはそれ以外のものも、数週間借りることができます。何かを借りるには、たいてい図書館カードが必要です。本を借りるとき、司書が返却期限を教えてくれます。返却期限とは、その本を返さなければならない日のことです。それまでに読み終わらなければ、司書に頼めば期限を延ばしてもらえることがよくあります。レイラは新しいアパートに引っ越してから、以前ほど本を持っていないので、代わりに図書館で本を借りるようになりました。先週、彼女は本を一冊返して新しい本を借り、友達のダニエルもいっしょに来ました。彼は図書館で本を借りたことが一度もなかったので、自分の図書館カードを作り、ミアが教えてくれているレシピの練習に役立つ料理の本を借りました。司書は二人に、期限までに本を返すようにと念を押しました。ミアはあまり図書館に行きませんが、一度、授業のために写真の本を借りたことがあります。
    note: '*checked out a cookbook* は「料理の本を借りた」という意味です。*check out* は、図書館で本を借りるときの決まった言い方です。'
