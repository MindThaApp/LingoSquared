teaching:
  en.a1.unit34.lesson01.teach.soccer:
    title: soccer
    gloss: サッカー
    note: '*soccer* は「サッカー」という意味です。使う動詞は *play* で、*play soccer* と言います。英語では、スポーツの名前によって *play*、*go*、*do* のどれを使うかが変わります。名前とセットで覚えましょう。'
    example_gloss: 私たちは土曜日にサッカーをします。
  en.a1.unit34.lesson01.teach.tennis:
    title: tennis
    gloss: テニス
    note: '*tennis* は「テニス」という意味です。*soccer* と同じように、ここでも *play* を使います：*play tennis*。'
    example_gloss: 彼女は毎週末テニスをします。
  en.a1.unit34.lesson01.teach.basketball:
    title: basketball
    gloss: バスケットボール
    note: '*basketball* は「バスケットボール」という意味です。ここでも *play* を使います：*play basketball*。*soccer* や *tennis* と同じで、球技にはふつう *play* + スポーツ名を使います。'
    example_gloss: 彼らは公園でバスケットボールをします。
  en.a1.unit34.lesson01.teach.swimming:
    title: swimming
    gloss: 水泳
    note: '*swimming* は「水泳」という意味です。ここでは動詞が変わります：*go swimming*（*play swimming* ではありません）。泳ぐ、走るなどの活動には、*go* + *-ing* の形を使います。'
    example_gloss: 私は週に2回泳ぎに行きます。
  en.a1.unit34.lesson01.teach.yoga:
    title: yoga
    gloss: ヨガ
    note: '*yoga* は「ヨガ」という意味です。動詞は *do* で、*do yoga* と言います。ヨガのように一人でする活動には、*play* でも *go* でもなく *do* を使います。'
    example_gloss: 彼は朝にヨガをします。
  en.a1.unit34.lesson01.teach.exercise:
    title: exercise
    gloss: 運動する
    note: '*exercise* は「運動する」「運動」という意味で、体を動かすことを広く表す言葉です。*soccer* や *swimming*、*yoga* と違って、*play*、*go*、*do* なしで、そのまま動詞として使えます：*Do you exercise every day?*'
    example_gloss: 毎日運動していますか。
  en.a1.unit34.lesson02.teach.twice_a_week:
    title: twice a week
    gloss: 週に2回
    note: '*twice a week* は「週に2回」という意味です。ここでの *a* は「ひとつの」ではなく「〜につき」を表します。回数 + *a* + 期間で、その期間に何回するかを言います。'
    example_gloss: 彼は週に2回テニスをします。
  en.a1.unit34.lesson02.teach.three_times_a_week:
    title: three times a week
    gloss: 週に3回
    note: '*three times a week* は「週に3回」という意味です。*twice a week* と同じように、*a* は「ひとつの」ではなく「〜につき」を表します。*times*（回）と *a week*（週につき）で、週に何回かを言います。'
    example_gloss: 彼女は週に3回泳ぎます。
  en.a1.unit34.lesson02.teach.on_weekends:
    title: on weekends
    gloss: 週末に
    note: '*on weekends* は「週末に」という意味です。英語では、曜日や週末には *on* を使います：*on Saturdays*、*on weekends*。'
    example_gloss: 私たちは週末にバスケットボールをします。
  en.a1.unit34.lesson02.teach.gym:
    title: gym
    gloss: スポーツジム
    note: '*gym* は「スポーツジム」という意味で、運動器具やレッスンがある場所のことです。'
    example_gloss: 彼はジムでヨガをします。
  en.a1.unit34.lesson02.teach.pool:
    title: pool
    gloss: プール
    note: '*pool* は「プール」という意味で、泳ぐための水がたまっている場所のことです。'
    example_gloss: 私はプールに泳ぎに行きます。
  en.a1.unit34.lesson02.teach.how_often_question:
    title: How often do you exercise?
    gloss: どのくらいの頻度で運動していますか。
    note: この疑問文は *how often*（どのくらいの頻度で）で始まります。そのあとに助動詞 *do* が続きます。本動詞が *exercise* だからです。ほかの英語の疑問文と同じ do-support です。
  en.a1.unit34.lesson03.teach.dialogue_line1:
    title: ダニエルの質問
    gloss: ダニエルは「土曜日、私たちといっしょにサッカーをしませんか」とたずねています。
    note: 会話は、サッカーへの誘いで始まります。*soccer* には *play* を使います。
  en.a1.unit34.lesson03.teach.dialogue_line2:
    title: "レイラの答え"
    gloss: レイラは「サッカーはあまり好きではありません。水泳のほうが好きです」と言っています。
    note: '*don''t really like* は「あまり好きではありません」という意味で、やわらかく断る言い方です。'
  en.a1.unit34.lesson03.teach.dialogue_line3:
    title: "ダニエルの答え"
    gloss: ダニエルは「いいですよ！ どのくらいの頻度で泳ぎに行きますか」と言っています。
    note: '*go swimming*：水泳には *go* を使い、*play* や *do* は使いません。'
  en.a1.unit34.lesson03.teach.dialogue_line4:
    title: "レイラの答え"
    gloss: レイラは「週に2回、たいてい家の近くのプールです」と言っています。
    note: '*Twice a week*：ここでも *a* は「〜につき」を表します。'
  en.a1.unit34.lesson03.teach.dialogue_line5:
    title: "ダニエルの答え"
    gloss: ダニエルは「いいですね！ 私もときどきヨガをしますが、やっぱりいちばん好きなのはランニングです」と言っています。
    note: '*do yoga*：ヨガには *do* を使い、*play* や *go* とは別です。'
  en.a1.unit34.lesson04.teach.reading_passage:
    title: ダニエル、レイラ、ミアについての文章
    gloss: ダニエル、レイラ、ミアは、それぞれ違うやり方で体を動かしています。ダニエルは毎朝、仕事の前に走りに行きます。レイラは水泳のほうが好きで、週に2回プールに行きます。ミアはチームに入ったばかりですが、毎週日曜日に近所の人とテニスをしています。土曜日には、公園でみんなでサッカーをすることもありますが、サッカーはだれにとってもいちばん好きなスポーツではありません。
    note: この文章には、三つの動詞がすべて出てきます：*goes running*（*go*）、*plays tennis* と *play soccer*（*play*）。スポーツごとに使う動詞が決まっています。
