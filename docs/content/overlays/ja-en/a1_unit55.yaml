teaching:
  en.a1.unit55.lesson01.teach.swimming_pool:
    title: swimming pool
    gloss: プール
    note: '*swimming pool* は「プール」という意味です。'
    example_gloss: プールは毎朝開きます。
  en.a1.unit55.lesson01.teach.ticket:
    title: ticket
    gloss: チケット、入場券
    note: '*ticket* は「チケット、入場券」という意味です。'
    example_gloss: プールに入るにはチケットが必要です。
  en.a1.unit55.lesson01.teach.locker:
    title: locker
    gloss: ロッカー
    note: '*locker* は「ロッカー」という意味です。'
    example_gloss: かばんをロッカーに入れてください。
  en.a1.unit55.lesson01.teach.swim_cap:
    title: swim cap
    gloss: 水泳帽
    note: '*swim cap* は「水泳帽」という意味です。'
    example_gloss: プールでは水泳帽をかぶってください。
  en.a1.unit55.lesson01.teach.rules:
    title: rules
    gloss: ルール、規則
    note: '*rules* は「ルール、規則」という意味です。'
    example_gloss: 泳ぐ前にプールのルールを読んでください。
  en.a1.unit55.lesson01.teach.lifeguard:
    title: lifeguard
    gloss: 監視員
    note: '*lifeguard* は「監視員」という意味で、泳いでいる人を見守る人のことです。'
    example_gloss: 監視員は毎日プールを見守っています。
  en.a1.unit55.lesson02.teach.id_like_to_buy_a_ticket:
    title: I'd like to buy a ticket, please.
    gloss: チケットを1枚買いたいのですが。
    note: '*I''d like to*（*I would like to* の短い形）は、丁寧に頼む言い方です。'
  en.a1.unit55.lesson02.teach.where_are_the_lockers:
    title: Where are the lockers?
    gloss: ロッカーはどこですか。
    note: '*Where are...?* では、主語の前に動詞（*are*）が来ます。これは英語の疑問文に特有の語順です。'
  en.a1.unit55.lesson02.teach.what_time_do_you_open:
    title: What time do you open?
    gloss: 何時に開きますか。
    note: '*do you open* では、疑問文を作るために助動詞 *do* を使います。'
  en.a1.unit55.lesson02.teach.its_five_dollars_for_one_ticket:
    title: It's five dollars for one ticket.
    gloss: チケット1枚5ドルです。
    note: '*for one ticket* は「チケット1枚につき」という意味です。'
  en.a1.unit55.lesson02.teach.do_i_need_a_swim_cap:
    title: Do I need a swim cap?
    gloss: 水泳帽は必要ですか。
    note: '*Do I need...?* でも、疑問文を作るために助動詞 *do* を使います。'
  en.a1.unit55.lesson02.teach.we_close_at_eight:
    title: We close at eight o'clock.
    gloss: 8時に閉まります。
    note: '*at eight o''clock* のように、英語では決まった時刻を言うときに *at* を使います。日本語の「8時に」の「に」にあたります。'
  en.a1.unit55.lesson03.teach.dialogue_line1:
    title: 監視員のあいさつ
    gloss: 監視員：こんにちは！今日は泳ぎに来ましたか。
    note: '*Are you here to swim today?* の *to swim* は「泳ぐために」という目的を表します。日本語の「泳ぎに」の「に」にあたる使い方です。'
  en.a1.unit55.lesson03.teach.dialogue_line2:
    title: ダニエルのチケット
    gloss: ダニエル：はい、チケットを2枚お願いします。
    note: チケットを2枚ほしいという、短くて直接的な依頼です。
  en.a1.unit55.lesson03.teach.dialogue_line3:
    title: 料金
    gloss: 監視員：かしこまりました！チケット1枚5ドルです。
    note: 1つの情報です。チケット1枚あたりの料金です。
  en.a1.unit55.lesson03.teach.dialogue_line4:
    title: ミアが水泳帽についてたずねる
    gloss: ミア：水泳帽は必要ですか。
    note: '*Do we need...?* でも、疑問文を作るために助動詞 *do* を使います。'
  en.a1.unit55.lesson03.teach.dialogue_line5:
    title: 水泳帽のルール
    gloss: 監視員：はい、プールでは水泳帽の着用が必要です。
    note: '*swim caps are required* は受け身の形です。ルールを伝えるときの改まった言い方で、プールの掲示や係員がよく使います。日本語でも「水泳帽の着用が必要です」「水泳帽をかぶってください」のように言えます。'
  en.a1.unit55.lesson03.teach.dialogue_line6:
    title: ダニエルがロッカーについてたずねる
    gloss: ダニエル：ロッカーはどこですか。
    note: 短い質問で、料金や時間についての新しい情報はありません。
  en.a1.unit55.lesson03.teach.dialogue_line7:
    title: ロッカーの場所
    gloss: 監視員：ロッカーは入口の近くにあります。
    note: 1つの情報です。ロッカーの場所で、ロッカーに何が必要かではありません。
  en.a1.unit55.lesson03.teach.dialogue_line8:
    title: ロッカーに必要なもの
    gloss: 監視員：1ドル硬貨が必要です。
    note: '*a dollar coin* は、英語の2つの単語（*dollar* と *coin*）を分けて書いた言い方で、「1ドル硬貨」という意味です。'
  en.a1.unit55.lesson03.teach.dialogue_line9:
    title: ミアが閉まる時間をたずねる
    gloss: ミア：何時に閉まりますか。
    note: '*What time do you close?* でも、疑問文を作るために助動詞 *do* を使います。'
  en.a1.unit55.lesson03.teach.dialogue_line10:
    title: 閉まる時間
    gloss: 監視員：8時に閉まります。
    note: 4つ目の、別の情報です。閉まる時間です。
  en.a1.unit55.lesson04.teach.reading_passage:
    title: プールで過ごす一日の文章
    gloss: 7月のある暑い午後、ダニエルとミアは、地域のプールで涼むことにしました。入口の近くの掲示には、プールのルールが書いてありました。走らないこと、そして、プールでは水泳帽の着用が必要なことです。二人は監視員にチケットを2枚お願いしました。チケットは1枚5ドルでした。監視員は、ロッカーは入口の近くにあり、1ドル硬貨が必要だと説明しました。ダニエルとミアはかばんをロッカーに入れ、2時間近く泳ぎました。帰る前に、もう一度掲示を確認しました。プールは8時に閉まります。ミアは、来週末にまた来て、飛び込み台に挑戦したいと言いました。
    note: '*required* は受け身の形です。*swim caps are required* は「水泳帽の着用が必要です」という意味です。'
