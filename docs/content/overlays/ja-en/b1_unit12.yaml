teaching:
  en.b1.unit12.lesson01.teach.although:
    title: although
    gloss: 〜だけれども
    note: '*although* は、完全な節を続けて、同じ文の中で対比を表します。'
    example_gloss: オフィスは静かですが、ミアは家で働くほうが好きです。
  en.b1.unit12.lesson01.teach.even_though:
    title: even though
    gloss: 〜なのに
    note: '*even though* は、*although* よりも対比を強く表します。'
    example_gloss: レイラは、アパートが狭くても集中力を保っています。
  en.b1.unit12.lesson01.teach.despite:
    title: despite
    gloss: 〜にもかかわらず
    note: '*despite* の後ろには名詞か -ing 形が来て、完全な節は来ません。'
    example_gloss: 気が散る要因があっても、ダニエルは報告書を時間どおりに仕上げます。
  en.b1.unit12.lesson01.teach.however:
    title: however
    gloss: しかしながら
    note: '*however* は、ピリオドやセミコロンの後ろで新しい文を始めます。'
    example_gloss: オフィスは静かです。それでも、ミアは家で働くほうが好きです。
  en.b1.unit12.lesson01.teach.valid_point:
    title: valid point
    gloss: もっともな意見、正しい指摘
    note: '*valid point* は、筋が通っている、または説得力のある意見という意味です。'
    example_gloss: 集中力についてのそれはもっともな意見です。
  en.b1.unit12.lesson01.teach.convince:
    title: convince
    gloss: 説得する
    note: '*convince* は、相手にそうだと納得させる、という意味です。'
    example_gloss: レイラは、ミアにオフィスへ戻るよう説得しようとしました。
  en.b1.unit12.lesson02.teach.office_quiet_home:
    title: although + vollständiger Nebensatz
    gloss: オフィスは静かですが、ミアは家で働くほうが好きです。
    note: '*although* + 主語 + 動詞で、対比を表す完全な節になります。'
  en.b1.unit12.lesson02.teach.distractions_report:
    title: despite + Nomen
    gloss: 気が散る要因があっても、ダニエルは報告書を時間どおりに仕上げます。
    note: '*despite* の後ろには名詞が来ます。完全な節は続けません。'
  en.b1.unit12.lesson02.teach.grammar_concession:
    title: although, despite und however
    gloss: '*although* と *even though* は、完全な節を導きます：Although the office is quiet, Mia prefers home。*despite* の後ろには名詞か -ing 形が来て、節は来ません：Despite the distractions, Daniel finishes his report。*however* はピリオドやセミコロンの後ろで新しい文を始めます：The office is quiet. However, Mia prefers home。'
    note: 形：*although/even though* + 節、*despite* + 名詞/-ing 形、*however* はピリオドの後ろに置く文副詞。
  en.b1.unit12.lesson03.teach.flexibility:
    title: flexibility
    gloss: 柔軟性
    note: '*flexibility* は、予定や働き方を簡単に変えられること、という意味です。'
    example_gloss: ミアもレイラも、柔軟性は大切だという点で意見が一致しています。
  en.b1.unit12.lesson03.teach.teamwork:
    title: teamwork
    gloss: チームワーク
    note: '*teamwork* は、チームとして一緒に働くことです。'
    example_gloss: レイラは、オフィスのほうがチームワークが良くなると考えています。
  en.b1.unit12.lesson03.teach.reading_passage:
    title: 'Lesetext: wo man arbeitet'
    gloss: ミアとレイラは、どこで働くかについて意見が分かれています。ミアは、居心地がいいので家で働いています。同僚に会えなくて寂しいですが、家のほうが仕事がはかどります。レイラはオフィスのほうが好きです。騒がしくても、休憩時間に同僚と話すのが好きだからです。ミアは集中力についてもっともな指摘をしていますが、それでもレイラは、オフィスのほうがチームワークが良くなると考えています。ただ、柔軟性が大切だという点では二人とも同じ意見です。
    note: 対比表現が出てくる短い読み物です。
  en.b1.unit12.lesson04.teach.q_although_nice_home:
    title: Mia führt den Gegensatz ein
    gloss: ミア：レイラ、オフィスはいいところだけど、私は家のほうが仕事がはかどるんです。
    note: '*although* + 完全な節を、文頭に置いています。'
  en.b1.unit12.lesson04.teach.a_despite_noise_breaks:
    title: Leila nennt ihre Sicht
    gloss: レイラ：わかります。でも、騒がしくても、私は休憩時間に人と話すのが本当に好きです。
    note: '*despite* + 名詞（*the noise*）。'
  en.b1.unit12.lesson04.teach.q_valid_point_however:
    title: Mia erkennt den Punkt an, bleibt aber bei ihrer Meinung
    gloss: ミア：それはもっともな意見ですね。でも、やっぱり私は一人のほうが集中できると思います。
    note: ここでは *however* が、ピリオドの後ろで新しい文を始めています。
  en.b1.unit12.lesson04.teach.a_even_though_convince:
    title: Leila zieht Mia auf
    gloss: レイラ：私はオフィスのほうが好きだけど、あなたの考えを変えるのは無理ですよね？
    note: '*even though* は対比を強調します。'
  en.b1.unit12.lesson04.teach.q_however_flexibility:
    title: Mia findet einen Kompromiss
    gloss: ミア：たぶん無理です！でも、柔軟性がいちばん大切だという点では同じ意見ですね。
    note: '*however* は、対立する二つの考えを、新しい文としてつなぎます。'
  en.b1.unit12.lesson04.teach.a_despite_preferences_time:
    title: Leila beendet das Gespräch positiv
    gloss: レイラ：好みが違っても、私たちはすべてを時間どおりに終わらせています。
    note: '*despite* + 名詞（*our different preferences*）。'
