teaching:
  en.a1.unit45.lesson01.teach.emergency:
    title: emergency
    gloss: 緊急事態
    note: '*emergency* は「緊急事態」という意味です。'
    example_gloss: これは緊急事態です！
  en.a1.unit45.lesson01.teach.help:
    title: help
    gloss: 助け
    note: '*help* は「助け」という意味です。'
    example_gloss: 助けが必要です！
  en.a1.unit45.lesson01.teach.police:
    title: police
    gloss: 警察
    note: '*police* は「警察」という意味です。'
    example_gloss: 警察を呼んでください！
  en.a1.unit45.lesson01.teach.ambulance:
    title: ambulance
    gloss: 救急車
    note: '*ambulance* は「救急車」という意味です。'
    example_gloss: 救急車が必要です！
  en.a1.unit45.lesson01.teach.fire_department:
    title: fire department
    gloss: 消防署
    note: '*fire department* は「消防署」という意味です。'
    example_gloss: 消防隊が来ました。
  en.a1.unit45.lesson02.teach.call_911:
    title: Call 911!
    gloss: 911に電話してください！
    note: アメリカでは、緊急の場合に電話するのは *911* です。日本の110番や119番とは違うので、覚えておきましょう。
  en.a1.unit45.lesson02.teach.i_need_help:
    title: I need help!
    gloss: 助けが必要です！
    note: '*I need help!* は「助けが必要です！」という意味です。'
  en.a1.unit45.lesson02.teach.send_the_police:
    title: Send the police, please.
    gloss: 警察をお願いします。
    note: '*Send the police, please.* は「警察をお願いします。」という意味です。'
  en.a1.unit45.lesson02.teach.send_an_ambulance:
    title: Send an ambulance, please.
    gloss: 救急車をお願いします。
    note: '*Send an ambulance, please.* は「救急車をお願いします。」という意味です。'
  en.a1.unit45.lesson02.teach.theres_a_fire:
    title: There's a fire!
    gloss: 火事です！
    note: '*There''s a fire!* は「火事です！」という意味です。'
  en.a1.unit45.lesson02.teach.whats_your_emergency:
    title: What's your emergency?
    gloss: どうしましたか。（どんな緊急事態ですか。）
    note: アメリカで911に電話をすると、通信指令係が最初にこうたずねるのが決まりです。
  en.a1.unit45.lesson03.teach.dialogue_line1:
    title: レイラが煙のにおいに気づく
    gloss: レイラ：ダニエル、何か燃えている？煙のにおいがする！
    note: '*smell* の後ろに名詞を直接置きます。I smell smoke は「煙のにおいがする」という意味です。*I smell of smoke* は「（自分が）煙のにおいがする」という別の意味になるので注意しましょう。'
  en.a1.unit45.lesson03.teach.dialogue_line2:
    title: ダニエルの説明
    gloss: ダニエル：ああ、鍋に火がついたんだ！夕食を作っていたんだよ。
    note: '*caught fire* は、突然火がつくことを表す決まった言い方です。'
  en.a1.unit45.lesson03.teach.dialogue_line3:
    title: レイラの指示
    gloss: レイラ：落ち着いて。コンロを消して！私が助けを呼ぶわ。
    note: '*call for help* は「助けを呼ぶ」という意味です。ここでは *for* を忘れないようにしましょう。'
  en.a1.unit45.lesson03.teach.dialogue_line4:
    title: ダニエルの警告
    gloss: ダニエル：急いで、火が大きくなってる！
    note: '*getting bigger* は「大きくなっていく」という意味です。get + 形容詞で、状態の変化を表します。'
  en.a1.unit45.lesson03.teach.dialogue_line5:
    title: レイラが緊急通報をする
    gloss: レイラ：もしもし、緊急事態です。友達の家のキッチンで火事です。消防隊をお願いします。
    note: アメリカで緊急通報をするときの会話の例です。電話するのは911です。
  en.a1.unit45.lesson03.teach.dialogue_line6:
    title: ダニエルの安堵
    gloss: ダニエル：よかった。もう消えたと思うけど、念のため外で待とう。
    note: '*just in case* は「念のため」という意味です。'
  en.a1.unit45.lesson03.teach.dialogue_line7:
    title: レイラのアドバイス
    gloss: レイラ：いい考えね。到着するまで外で待つほうが安全よ。
    note: '*safer* は safe の比較級です。語尾に *-er* をつけて「より安全な」という意味になります（「大きい→より大きい」の *bigger* と同じ仕組みです）。'
  en.a1.unit45.lesson04.teach.reading_passage:
    title: 緊急時の行動についての文章
    gloss: 火事のときは：まず、落ち着いてください。次に、すぐに建物から出てください。エレベーターは使わず、階段を使ってください。三つ目に、外に出たら911に電話して、住所を伝えてください。最後に、消防隊が到着するまで外で待ってください。ダニエルのキッチンで火事があったあと、彼とレイラは注意書きのとおりに外で待ちました。消防隊はすぐに到着し、すべて安全であることを確認しました。その後、ミアが様子を見に来て、だれもけがをしていないことにほっとしました。
    note: '*elevator* はアメリカ英語の「エレベーター」です。イギリス英語では *lift* と言います。'
