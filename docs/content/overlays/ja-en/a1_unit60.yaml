teaching:
  en.a1.unit60.lesson01.teach.invitation:
    title: invitation
    gloss: 招待
    note: '*invitation* は「招待」や「招待状」という意味です。'
    example_gloss: ご招待ありがとうございます。
  en.a1.unit60.lesson01.teach.party:
    title: party
    gloss: パーティー
    note: '*party* は「パーティー」という意味です。'
    example_gloss: パーティーは土曜日です。
  en.a1.unit60.lesson01.teach.dinner:
    title: dinner
    gloss: 夕食
    note: '*dinner* は「夕食」や、夕食の会という意味です。'
    example_gloss: 夕食を食べに来てください。
  en.a1.unit60.lesson01.teach.picnic:
    title: picnic
    gloss: ピクニック
    note: '*picnic* は「ピクニック」という意味です。'
    example_gloss: ピクニックができますよ。
  en.a1.unit60.lesson01.teach.bring:
    title: bring
    gloss: 持っていく
    note: '*bring* は、行く先へ何かを持っていくという意味です。'
    example_gloss: 飲み物を持ってきてください。
  en.a1.unit60.lesson01.teach.free:
    title: free
    gloss: 空いている・ひまな
    note: '*free* は、ここでは「時間が空いている」という意味で、「無料」ではありません。'
    example_gloss: 空いていますか？
  en.a1.unit60.lesson02.teach.are_you_free:
    title: Are you free on Saturday?
    gloss: 土曜日は空いていますか？
    note: '*on Saturday* のように、曜日の前には *on* を使います。日本語では「土曜日に」のように助詞の「に」を使い、「土曜日」だけでも通じることが多いです。'
  en.a1.unit60.lesson02.teach.would_you_like_dinner:
    title: Would you like to come to dinner?
    gloss: 夕食を食べに来ませんか？
    note: '*Would you like to...?* は、人を誘うときの丁寧な言い方です。'
  en.a1.unit60.lesson02.teach.bring_a_drink:
    title: Please bring a drink.
    gloss: 飲み物を持ってきてください。
    note: '*bring* は、ここでは約束の場所へ何かを持っていくという意味です。'
  en.a1.unit60.lesson02.teach.i_can_come:
    title: I can come.
    gloss: 行けます。
    note: この文は、招待を短くはっきりと受ける言い方です。
  en.a1.unit60.lesson02.teach.cant_come:
    title: Sorry, I can't come.
    gloss: ごめんなさい、行けません。
    note: '*can''t* は *cannot* の短縮形です。'
  en.a1.unit60.lesson02.teach.see_you_at_six:
    title: See you at six.
    gloss: 6時に会いましょう。
    note: '*at six* のように、時刻の前には *at* を使います。日本語では「6時に」と助詞の「に」を使います。'
  en.a1.unit60.lesson03.teach.dialogue_line1:
    title: レイラがダニエルの都合をたずねます
    gloss: レイラは「こんにちは、ダニエル！土曜日は空いている？」と言います。
    note: '*Are you free...?* は、相手の都合がよいかどうかをたずねる表現です。'
  en.a1.unit60.lesson03.teach.dialogue_line2:
    title: ダニエルは空いています
    gloss: ダニエルは「うん、空いているよ」と言います。
    note: '*I am free* は「私は空いています」という意味です。'
  en.a1.unit60.lesson03.teach.dialogue_line3:
    title: レイラがダニエルを誘います
    gloss: レイラは「夕食を食べに来ない？」と言います。
    note: '*Would you like to come...?* は、丁寧で感じのよい言い方です。'
  en.a1.unit60.lesson03.teach.dialogue_line4:
    title: ダニエルが受けます
    gloss: ダニエルは「うん、ぜひ」と言います。
    note: '*I''d love to* は、うれしい気持ちを込めて「はい」と答える言い方です。'
  en.a1.unit60.lesson03.teach.dialogue_line5:
    title: レイラが飲み物を頼みます
    gloss: レイラは「飲み物を持ってきてね」と言います。
    note: '*Please bring...* は、丁寧なお願いの言い方です。'
  en.a1.unit60.lesson03.teach.dialogue_line6:
    title: ダニエルが時間をたずねます
    gloss: ダニエルは「いいよ。何時？」と言います。
    note: '*What time?* は、短くて自然な質問です。'
  en.a1.unit60.lesson03.teach.dialogue_line7:
    title: レイラが6時と伝えます
    gloss: レイラは「6時にね」と言います。
    note: '*at six* のように、時刻の前には *at* を使います。'
  en.a1.unit60.lesson03.teach.dialogue_line8:
    title: ダニエルがレイラにお礼を言います
    gloss: ダニエルは「よかった。招待してくれてありがとう」と言います。
    note: '*Thank you for...* の *for* は、お礼を言う理由を表します。'
  en.a1.unit60.lesson04.teach.invitation_message:
    title: 招待状
    gloss: 夕食へのご招待：土曜日の6:00。飲み物を持ってきてください。住所：18 Park Street。
    note: この招待状には、日にち、時間、ダニエルが持っていくもの、住所が書かれています。
  en.a1.unit60.lesson04.teach.reading_passage:
    title: 本文：レイラの家での夕食
    gloss: レイラの家での夕食：レイラは、土曜日の夕食にダニエルを招待しました。彼女は、飲み物を持ってきてほしいと頼みました。ダニエルは行けると答えました。招待状には、夕食は18 Park Streetで6:00からと書かれていました。ダニエルは住所を携帯電話に書き込みました。彼は時間どおりに着きたいと思いました。友だちが来られるので、レイラはうれしく思いました。
    note: '*invited Daniel to dinner* は、レイラがダニエルを夕食に招待したという意味です。'
