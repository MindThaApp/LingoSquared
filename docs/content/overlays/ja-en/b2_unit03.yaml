teaching:
  en.b2.unit03.lesson01.teach.hedge:
    title: hedge
    gloss: 表現を和らげる、断定を避ける
    note: '*hedge* は、発言を断定的でなくすることです。日本語の「ちょっと」を、いつも *a little* と訳さないようにしましょう。'
    example_gloss: レイラは、方針についての主張を和らげるために seems を使っています。
  en.b2.unit03.lesson01.teach.qualify:
    title: qualify
    gloss: 限定する、条件をつける
    note: '*qualify* は、条件や例外をつけて発言の範囲を狭めることです。'
    example_gloss: '''provided we agree'' という表現が、レイラの支持に条件をつけています。'
  en.b2.unit03.lesson01.teach.emphasize:
    title: emphasize
    gloss: 強調する
    note: '*emphasize* は、伝えたいことの一部をより強く打ち出すことです。'
    example_gloss: ダニエルは、業務負担の問題を強調します。
  en.b2.unit03.lesson01.teach.to_some_extent:
    title: to some extent
    gloss: ある程度は
    note: '*to some extent* は、あちこちで *a little* を使うよりも、自然に聞こえることが多いです。'
    example_gloss: ある程度は、この方針はチームの懸念に応えています。
  en.b2.unit03.lesson01.teach.broadly:
    title: broadly
    gloss: おおむね、大筋では
    note: '*broadly* は、例外の余地を残しつつ、全体としての支持や一般的な真実を表します。'
    example_gloss: この提案は完璧ではありませんが、おおむね有用です。
  en.b2.unit03.lesson01.teach.provided:
    title: provided
    gloss: 〜という条件で、〜であれば
    note: '*provided* は条件を導入します。日本語の「〜という条件で」に似ていますが、英語ではフォーマルでプロフェッショナルな響きになることが多いです。'
    example_gloss: 合意できるのであれば、この方針を支持できます。
  en.b2.unit03.lesson02.teach.seems_but_does:
    title: 慎重さと強調を組み合わせる
    gloss: この方針は妥当に思えますが、チームの仕事は確かに増えます。
    note: '*seems* は肯定的な発言を和らげ、*does create* は追加の仕事が実際に生じることを強調します。日本語では「確かに」「実際に」などを加えて、同じような強調を表せます。'
  en.b2.unit03.lesson02.teach.what_worries_me:
    title: 一つの懸念に焦点を当てる
    gloss: 私が心配しているのは、チームの追加の仕事です。
    note: '*What worries me is...* は、一つの点を文頭に置いて焦点を当てます。そのあとは英語の語順を保ち、*is the extra work* のようにします。'
  en.b2.unit03.lesson02.teach.broadly_provided:
    title: 条件つきの全体的な支持
    gloss: スケジュールが調整されるなら、おおむね有用です。
    note: '*broadly useful, provided...* は、はっきりした条件つきの支持を表します。'
  en.b2.unit03.lesson02.teach.grammar_stance:
    title: ニュアンスと強調
    gloss: seems、broadly、to some extent を使うと、主張を和らげたり、限定したりできます。do や does を主動詞の前に置くと、それが本当だと強調できます。What matters is... や What worries me is... を使うと、一つの点に注意を向けられます。
    note: 日本語の話者にとって新しいのは、特に *does create* でしょう。これは「〜をする」という別の意味を加えるのではなく、*create* を強調します。日本語で「確かに作り出す」と言うのに近い働きです。
  en.b2.unit03.lesson03.teach.overall:
    title: overall
    gloss: 全体として
    note: '*overall* は、細かい点や例外があっても、全体を見渡した評価を表します。'
    example_gloss: 全体として、レイラはこの方針を支持しています。
  en.b2.unit03.lesson03.teach.condition:
    title: condition
    gloss: 条件
    note: '*condition* は、あることが成り立つ前に満たさなければならないことです。'
    example_gloss: 彼女の条件は、スケジュールを調整しなければならないことです。
  en.b2.unit03.lesson03.teach.reading_passage:
    title: 読解：条件つきの支持
    gloss: レイラのフィードバックは前向きですが、慎重に限定されています。彼女は、レビュー方針は全体として妥当に思える、と言います。これは主張を和らげ、断定的に聞こえるのを避けています。さらに、スケジュールが調整されるなら、おおむね有用だとも言っています。この条件が彼女の支持を限定しており、彼女は方針を書かれているとおりに受け入れているわけではありません。ダニエルは、焦点を当てる構文を使って別の点を強調します。彼が心配しているのは、チームの追加の仕事です。二人とも原則としてはこの方針を支持していますが、言葉づかいから、コミットの度合いの違いが分かります。
    note: この文章は、同じ基本的な内容を、より柔らかく、より強く、あるいはより条件つきにする方法を示しています。
  en.b2.unit03.lesson04.teach.q_policy_seems:
    title: レイラが慎重に表現する
    gloss: レイラ：新しいレビュー方針は、全体として妥当に思えます。
    note: '*seems reasonable overall* は、批判よりは肯定的ですが、断定的ではありません。'
  en.b2.unit03.lesson04.teach.a_not_fully_ready:
    title: ダニエルが慎重さに気づく
    gloss: ダニエル：少し慎重な言い方ですね。まだ完全には準備ができていない、ということですか。
    note: ダニエルは、レイラが単に *it is ready* とは言っていないことに気づいています。
  en.b2.unit03.lesson04.teach.q_workable_deadlines:
    title: レイラがさらに限定する
    gloss: レイラ：そのとおりです。実行できるかもしれませんが、もっと明確な期限が必要です。
    note: '*may be workable* は疑いの余地を残し、*but* が制約を述べています。'
  en.b2.unit03.lesson04.teach.a_what_worries:
    title: ダニエルが焦点を当てる
    gloss: ダニエル：同感です。私が心配しているのは、チームの追加の仕事です。
    note: '*What worries me is...* は、懸念に焦点を当てます。'
  en.b2.unit03.lesson04.teach.q_does_create_checks:
    title: レイラが does で強調する
    gloss: レイラ：おっしゃるとおりです。この方針は、確かに品質チェックを改善しますが、承認のステップがもう一つ増えます。
    note: '*does create* は、あとで制約があるとしても、この利点が確かに存在することを強調します。'
  en.b2.unit03.lesson04.teach.a_support_conditions:
    title: ダニエルが条件を要約する
    gloss: ダニエル：では、条件つきで支持すべきということですね。
    note: 彼は、レイラの限定つきの支持を要約しています。
  en.b2.unit03.lesson04.teach.q_broadly_useful:
    title: レイラが条件つきの支持を示す
    gloss: レイラ：はい。スケジュールが調整されるなら、おおむね有用だと言えるでしょう。
    note: ここでの *provided* は「〜という条件で」という意味で、条件が満たされた場合にのみ支持が有効になります。
  en.b2.unit03.lesson04.teach.same_content_triad:
    title: 同じ内容を三つの強さで
    gloss: この方針は追加の仕事を生みます。この方針は追加の仕事を生むようです。この方針は確かに追加の仕事を生みます。
    note: この三つの文では、中立的な言い方、*seems to* を使ったより慎重な言い方、*does* を使ったより強い言い方を練習します。
