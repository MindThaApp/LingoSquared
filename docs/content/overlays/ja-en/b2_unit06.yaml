teaching:
  en.b2.unit06.lesson01.teach.value:
    title: value
    gloss: 価値、価値観
    note: '*value* は、ここでは人々が大切だと考える原則のことで、金銭的な価値だけを指すのではありません。'
    example_gloss: 公平さは一つの価値観です。
  en.b2.unit06.lesson01.teach.fairness:
    title: fairness
    gloss: 公平さ、公正さ
    note: '*fairness* は、人々を道理にかなった形で扱うことに関わる言葉です。単なる *nice* よりも強く、抽象的です。'
    example_gloss: 公平さとは、人々を道理にかなった形で扱うことです。
  en.b2.unit06.lesson01.teach.convenience:
    title: convenience
    gloss: 便利さ、利便性
    note: '*convenience* は、便利さや手軽さのことです。ここでは、日本語の「簡単さ」にあたる *easiness* と直訳しないようにしましょう。'
    example_gloss: 便利さは日常生活を楽にします。
  en.b2.unit06.lesson01.teach.flexibility:
    title: flexibility
    gloss: 柔軟性
    note: '*flexibility* は、状況が変わったときにそれに合わせて対応できる力のことです。'
    example_gloss: 柔軟性があれば、状況が変わったときに変更ができます。
  en.b2.unit06.lesson01.teach.qualify:
    title: qualify
    gloss: 条件をつける、限定する
    note: '*qualify* は、ここでは意見に条件をつけたり、範囲を限定したりすることです。資格を取るという意味ではありません。'
    example_gloss: 意見は、範囲を限定することで条件をつけられます。
  en.b2.unit06.lesson01.teach.prioritize:
    title: prioritize
    gloss: 優先する
    note: '*prioritize fairness* は、公平さを他の価値よりも重要なものとして扱うことです。'
    example_gloss: 公平さを優先するとは、それを他のものより重要だと考えることです。
  en.b2.unit06.lesson02.teach.in_principle:
    title: 価値を比べる
    gloss: 原則として、便利さは大切ですが、公平さのほうがより重く扱われるべきです。
    note: '*In principle* は、ここでは「原則として」という意味です。*eventually* は「最終的に」という意味なので、「結局」「場合によっては」の意味では使えません。'
  en.b2.unit06.lesson02.teach.not_arguing_everywhere:
    title: 自分の主張を限定する
    gloss: 私は、どこでも静かにすべきだと主張しているわけではありません。
    note: '*I am not arguing for...* は、自分の主張の範囲を限定する表現です。*a little* のようなあいまいな言い方より、はるかに適切です。'
  en.b2.unit06.lesson02.teach.respond_opposing:
    title: 相手の意見に直接答える
    gloss: それはもっともですし、企業に柔軟性が必要だという点には同意します。
    note: '*That is fair* は、自分の価値観を手放さずに相手の指摘を認める表現です。'
  en.b2.unit06.lesson02.teach.grammar_abstract_response:
    title: 抽象的な意見を組み立てる
    gloss: 説得力のある抽象的な意見は、価値を挙げ、主張に条件をつけ、相手の考えに直接答えます。
    note: ニュアンスを出すために毎回 *a bit* を使うのではなく、*in principle*、*fairness*、*carry more weight* のような、B2 レベルの的確な表現を使いましょう。
  en.b2.unit06.lesson03.teach.transparent:
    title: transparent
    gloss: 透明な、分かりやすい
    note: '*transparent rules* は、理解しやすく、確認もしやすい規則のことです。'
    example_gloss: 透明性のある規則は理解しやすいです。
  en.b2.unit06.lesson03.teach.commercial:
    title: commercial
    gloss: 商業的な、営利の
    note: '*commercial activity* は、企業や利益に関わる活動のことです。'
    example_gloss: 商業活動は企業と関わりがあります。
  en.b2.unit06.lesson03.teach.reading_passage:
    title: 読解文:静かな公共の場
    gloss: アマラは、たとえ商業活動が制限されることになっても、静かな公共の場は守られるべきだと主張しています。彼女の考えは絶対的なものではありません。どこでも静かにすべきだと主張しているわけではなく、企業にもある程度の柔軟性が必要だと認めています。それに対してレオは、規則があると企業が生き残りにくくなる場合があると考えています。アマラはその点に直接答えて、便利さは大切だが、その場所がみんなのものである場合は、公平さのほうがより重く扱われるべきだと述べます。彼女は、制限のない規制ではなく、限定的で透明性のある規則を支持しているので、立場に条件がついています。
    note: これは抽象的な英語の使い方です。価値を明確に挙げ、主張の範囲を的確に限定しましょう。
  en.b2.unit06.lesson04.teach.q_protect_spaces:
    title: アマラが自分の立場を述べる
    gloss: アマラ:都市は、たとえ一部の商業活動が制限されることになっても、静かな公共の場を守るべきだと思います。
    note: '*even if* は、彼女が不利な点を認めていることを示します。'
  en.b2.unit06.lesson04.teach.a_business_flexibility:
    title: レオがもう一つの価値を挙げる
    gloss: レオ:僕も静けさは大切だと思うけど、企業は生き残るために柔軟性が必要なんだ。
    note: レオは、アマラが重視する公共の場に対して、柔軟性を対置しています。
  en.b2.unit06.lesson04.teach.q_not_silence:
    title: アマラが条件をつける
    gloss: アマラ:それはもっともだし、私はどこでも静かにすべきだと言っているわけではないの。私が言いたいのは、みんなで共有する場所が利益だけで形づくられてはいけないということよ。
    note: '*not arguing for silence everywhere* は、彼女の立場が絶対的に聞こえないようにしています。'
  en.b2.unit06.lesson04.teach.a_prioritizing:
    title: レオが価値を言葉にする
    gloss: レオ:つまり、君が優先している価値は、単なる快適さじゃなくて公平さなんだね?
    note: '*prioritizing* は、ここでは「比較したときに、より重要なものとして扱う」という意味です。'
  en.b2.unit06.lesson04.teach.q_fairness_weight:
    title: アマラが価値を比べる
    gloss: アマラ:その通り。原則として、便利さは大切だけど、その場所がみんなのものである場合は、公平さのほうがより重く扱われるべきよ。
    note: '*carry more weight* は、「より重く扱われる」ことを表す自然な英語です。'
  en.b2.unit06.lesson04.teach.a_accept_rules:
    title: レオが条件つきで受け入れる
    gloss: レオ:規則が限定的で透明性があるなら、それは受け入れられるよ。
    note: 受け入れるかどうかは、規則が限定的で分かりやすいかどうかにかかっています。
