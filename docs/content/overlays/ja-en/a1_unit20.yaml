    gloss: ダニエルは「大きいほうがすてきですが、小さいほうが安いです」と言っています。
    note: ダニエルは *but* を使って、2つの比較を対比させています。
  en.a1.unit20.lesson04.teach.q_how_much_cheaper:
    title: 差についてたずねる
    gloss: レイラは「どれくらい安いですか」とたずねています。
    note: 上と同じ質問です。
