    title: 車をくらべる文章
    gloss: 赤い車は青い車より速いですが、青い車のほうが安いです。白い車は3台の中でいちばん安いです。
    note: この文章は3台の車をくらべています。赤い車は青い車より速く、青い車は赤い車より安く、白い車がいちばん安いです。
  en.a1.unit20.lesson04.teach.how_much_cheaper:
