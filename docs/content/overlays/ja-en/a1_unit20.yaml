    title: 正確な値段
    gloss: ダニエルは「小さいほうは10ドルで、大きいほうは15ドルです」と言っています。
    note: ダニエルは、両方のバッグの値段（10ドルと15ドル）を伝えています。
  en.a1.unit20.lesson04.teach.a_cheaper_by_five:
    title: レイラの結論
    gloss: レイラは「わかりました、小さいほうが5ドル安いですね。小さいほうにします」と言っています。
    note: 15ドルから10ドルを引くと5ドルなので、小さいバッグは5ドル安いです。
