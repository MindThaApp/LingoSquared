teaching:
  en.b1.unit13.lesson01.teach.who:
    title: who
    gloss: 〜する人（人の説明）
    note: '*who* は、関係詞節の中で人を指します。'
    example_gloss: 3月にチームに加わったダニエルは、もう二つのプロジェクトを率いています。
  en.b1.unit13.lesson01.teach.which:
    title: which
    gloss: 〜するもの（物の説明）
    note: '*which* は、関係詞節の中で物や事柄を指します。'
    example_gloss: レイラが選んだデザインのコースは、6月に始まります。
  en.b1.unit13.lesson01.teach.that_relative:
    title: that
    gloss: 〜する人・もの（特定する）
    note: '*that* は、限定用法の関係詞節の中で、人にも物にも使えます。'
    example_gloss: 今朝電話をくれたお客様が、打ち合わせをしたいそうです。
  en.b1.unit13.lesson01.teach.whose:
    title: whose
    gloss: その人・ものの〜
    note: '*whose* は、関係詞節の中で所有を表します。'
    example_gloss: 彼らが今仕上げているプロジェクトのお客様は、もうデザインを承認しています。
  en.b1.unit13.lesson01.teach.where:
    title: where
    gloss: 〜する場所
    note: '*where* は、関係詞節の中で場所を指します。'
    example_gloss: ダニエルが働いているオフィスは、繁華街にあります。
  en.b1.unit13.lesson01.teach.coworker:
    title: coworker
    gloss: 同僚
    note: '*coworker* は、一緒に働いている人のことです。'
    example_gloss: ミアには、夜にスペイン語を勉強している同僚がいます。
  en.b1.unit13.lesson02.teach.colleague_organized:
    title: 限定用法の関係詞節の who
    gloss: ミアの隣に座っている同僚は、とても几帳面です。
    note: ここでは *who* が、誰のことなのかを特定するために必要な情報を導いています。
  en.b1.unit13.lesson02.teach.daniel_leads_projects:
    title: 非限定用法の関係詞節の who
    gloss: 3月にチームに加わったダニエルは、もう二つのプロジェクトを率いています。
    note: カンマは、この関係詞節が追加の情報であり、誰のことかを特定するために必要なものではないことを示します。
  en.b1.unit13.lesson02.teach.grammar_defining:
    title: 限定用法と非限定用法の関係詞節
    gloss: 限定用法の関係詞節はカンマを付けず、誰や何のことなのかをはっきり示します：The colleague who sits next to Mia is organized。非限定用法の関係詞節はカンマを付け、すでに分かっている人について追加の情報を加えます：Daniel, who joined in March, already leads two projects。日本語では、どちらも名詞の前に置いて表すので区別が目立ちませんが、英語ではカンマの有無で意味が変わる点に注意しましょう。
    note: 形：限定用法＝カンマなしで、誰・何のことかを示す。非限定用法＝カンマ付きで、追加の情報を加える。
  en.b1.unit13.lesson03.teach.deadline:
    title: deadline
    gloss: 締め切り
    note: '*deadline* は、何かを終えなければならない日付や時刻のことです。'
    example_gloss: ミアの隣に座っている同僚は、いつも締め切りを守ります。
  en.b1.unit13.lesson03.teach.approve:
    title: approve
    gloss: 承認する
    note: '*approve* は、何かを正式に認める、という意味です。'
    example_gloss: お客様は、最初のデザインをすでに承認しています。
  en.b1.unit13.lesson03.teach.reading_passage:
    title: 読み物：新しいオフィス
    gloss: ミアは、仕事をしやすくしてくれる人たちと働いています。3月にチームに加わったダニエルは、もう二つのプロジェクトを率いています。ミアの隣に座っている同僚はとても几帳面で、いつも締め切りを守ります。5階にある彼らのオフィスには、みんなで一緒に昼食をとる小さなキッチンがあります。彼らが今仕上げているプロジェクトのお客様は、最初のデザインをすでに承認しています。
    note: 限定用法と非限定用法の関係詞節が出てくる短い読み物です。
  en.b1.unit13.lesson04.teach.q_met_the_woman:
    title: ミアが新しい同僚を紹介する
    gloss: ミア：レイラ、新しくチームに入った女性にはもう会いましたか？
    note: ここでは *who* が *the woman* を指しています。
  en.b1.unit13.lesson04.teach.a_whose_desk:
    title: レイラが新しい同僚の席をたずねる
    gloss: レイラ：まだです。窓の近くに席がある人ですか？
    note: '*whose* は所有を表します：*whose desk*。'
  en.b1.unit13.lesson04.teach.q_the_designer_who:
    title: ミアが新しい同僚を説明する
    gloss: ミア：はい、その人です。ロゴのプロジェクトを終わらせたデザイナーです。
    note: '*who* は *the designer* を指しています。'
  en.b1.unit13.lesson04.teach.a_which_won_award:
    title: レイラがプロジェクトを思い出す
    gloss: レイラ：ああ、思い出しました。先月賞を取ったプロジェクトのことですか？
    note: '*which* は *the project* を指しています。'
  en.b1.unit13.lesson04.teach.q_office_smaller:
    title: ミアが前のオフィスについて話す
    gloss: ミア：そのとおりです。彼女が前に働いていたオフィスは、ここよりずっと小さかったんです。
    note: '*where* は場所（*the office*）を指しています。'
  en.b1.unit13.lesson04.teach.a_kitchen_where:
    title: レイラがキッチンを好きな理由に気づく
    gloss: レイラ：それで、みんなで一緒に昼食をとるキッチンが気に入っているんですね。
    note: '*where* は *the kitchen* を指しています。'
