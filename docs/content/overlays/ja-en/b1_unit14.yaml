teaching:
  en.b1.unit14.lesson01.teach.would_it_be_possible_to:
    title: would it be possible to
    gloss: 〜することは可能でしょうか
    note: '*would it be possible to* は、そもそも可能かどうかを丁寧に尋ねる表現です。'
    example_gloss: 会議を木曜日に変更することは可能でしょうか。
  en.b1.unit14.lesson01.teach.i_was_wondering_if:
    title: I was wondering if
    gloss: 〜かなと思っていたのですが
    note: '*I was wondering if* は、依頼を遠回しで控えめな言い方にします。'
    example_gloss: 今日、私のレポートに目を通していただけないかと思っていたのですが。
  en.b1.unit14.lesson01.teach.could_we_possibly:
    title: could we possibly
    gloss: 〜してもよろしいでしょうか
    note: '*could we possibly* は、一緒にすることについて丁寧にお願いする表現です。'
    example_gloss: 会議を5分遅く始めてもよろしいでしょうか。
  en.b1.unit14.lesson01.teach.i_would_appreciate_it_if:
    title: I would appreciate it if
    gloss: 〜していただけるとありがたいです
    note: '*I would appreciate it if* は、相手がしてくれたら感謝する、という気持ちを表します。'
    example_gloss: 議事録を近いうちに送っていただけるとありがたいです。
  en.b1.unit14.lesson01.teach.agenda:
    title: agenda
    gloss: 議題
    note: '*agenda* は、会議で話し合う項目の一覧のことです。'
    example_gloss: ダニエルは、議題をもう一つ追加しました。
  en.b1.unit14.lesson01.teach.follow_up:
    title: follow up
    gloss: フォローアップする
    note: '*follow up* は、会議や作業のあとにもう一度連絡を取る、という意味です。'
    example_gloss: ミアは会議のあと、メールでフォローアップします。
  en.b1.unit14.lesson02.teach.move_meeting_thursday:
    title: would it be possible to + Verb
    gloss: 会議を木曜日に変更することは可能でしょうか。
    note: '*would it be possible to* + 動詞の原形で、変更を丁寧にお願いします。'
  en.b1.unit14.lesson02.teach.review_report_today:
    title: I was wondering if + could
    gloss: 今日、私のレポートに目を通していただけないかと思っていたのですが。
    note: '*I was wondering if you could* は、遠回しで丁寧な頼み方です。'
  en.b1.unit14.lesson02.teach.grammar_softened_requests:
    title: 職場でのやわらかい依頼
    gloss: 職場でのかしこまった依頼では、命令する言い方ではなく、*Would it be possible to...* や *I was wondering if...* のような、やわらげた仮定の形を使います。これらは、*Move the meeting* や *Review my report* よりも丁寧に響きます。
    note: 形：命令する言い方ではなく、やわらげた仮定の形を使います。
  en.b1.unit14.lesson03.teach.budget_update:
    title: budget update
    gloss: 予算の最新状況
    note: '*budget update* は、お金がどのように使われているかについての報告のことです。'
    example_gloss: ダニエルは、会議のために予算の最新状況をまとめました。
  en.b1.unit14.lesson03.teach.afterward:
    title: afterward
    gloss: あとで
    note: '*afterward* は、何かの後の時点、という意味です。'
    example_gloss: 議事録は、あとで確認できます。
  en.b1.unit14.lesson03.teach.reading_passage:
    title: 読み物：ミーティング前のメッセージ
    gloss: ダニエルさん、お元気でお過ごしのことと思います。明日の会議の議題に、予算の最新状況を加えることは可能でしょうか。最新の数字を持参していただけるとありがたいです。あとで質問の時間が取れるよう、10分早く始めてもよろしいでしょうか。よろしくお願いします。ミア
    note: 丁寧にお願いする表現が出てくる、短くて仕事向きのメッセージです。
  en.b1.unit14.lesson04.teach.q_start_budget_update:
    title: チームリーダーが丁寧にミーティングを始める
    gloss: チームリーダー：おはようございます、ミア。今日は予算の最新状況から始めることは可能でしょうか。
    note: '*would it be possible to* は、会議の進め方について丁寧に尋ねる表現です。'
  en.b1.unit14.lesson04.teach.a_add_new_client:
    title: ミアが追加のお願いをする
    gloss: ミア：もちろんです。新しいお客様も議題に加えられないかと思っていたのですが。
    note: '*I was wondering if we could* は、遠回しで丁寧な提案の仕方です。'
  en.b1.unit14.lesson04.teach.q_keep_thirty_minutes:
    title: チームリーダーが短いミーティングをお願いする
    gloss: チームリーダー：いい考えですね。この会議を30分以内に収めることは可能でしょうか。
    note: '*could we possibly* は、二人で一緒にすることについて丁寧にお願いする表現です。'
  en.b1.unit14.lesson04.teach.a_questions_in_advance:
    title: ミアが次回に向けてお願いをする
    gloss: ミア：最善を尽くします。次回は、みんなが事前に質問を送ってくれるとありがたいです。
    note: '*I would appreciate it if* は、してくれたら感謝する、という気持ちを表します。'
  en.b1.unit14.lesson04.teach.q_fair_request_followup:
    title: チームリーダーが同意し、確認すると約束する
    gloss: チームリーダー：もっともなお願いですね。次の会議の前に、リマインダーを送ってフォローアップします。
    note: ここでの *follow up* は、あとでもう一度連絡する、という意味です。
  en.b1.unit14.lesson04.teach.a_send_updated_agenda:
    title: ミアが確認して締めくくる
    gloss: ミア：ありがとうございます。更新した議題を、今日の午後に送ります。
    note: 会話を丁寧に締めくくるひとことです。
