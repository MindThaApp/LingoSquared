teaching:
  en.a2.unit31.lesson01.teach.delay:
    title: delay
    gloss: 遅れ、遅延
    note: '*delay* は「遅れ」「遅延」という意味です。'
    example_gloss: 5時15分の電車は45分遅れています。
  en.a2.unit31.lesson01.teach.cancelled:
    title: cancelled
    gloss: 運休になった
    note: '*cancelled* は、予定されていたものが行われないことを表します。電車では、日本語の「運休」にあたります。'
    example_gloss: 5時15分の電車は運休ではなく、遅れているだけです。
  en.a2.unit31.lesson01.teach.alternative:
    title: alternative
    gloss: 代わりの手段
    note: '*alternative* は、ほかの選択肢のことです。'
    example_gloss: 駅員は、代わりの手段として5時30分のバスを案内してくれました。
  en.a2.unit31.lesson01.teach.notice:
    title: notice
    gloss: お知らせ、掲示
    note: '*notice* は、旅行者向けの書かれたお知らせのことで、駅の掲示などがこれにあたります。'
    example_gloss: 駅で、遅延についての掲示を読みました。
  en.a2.unit31.lesson01.teach.signal_problem:
    title: signal problem
    gloss: 信号トラブル
    note: '*signal problem* は、線路沿いの信号に起きたトラブルのことです。'
    example_gloss: 遅れの原因は、線路の信号トラブルです。
  en.a2.unit31.lesson02.teach.wondering_why_delayed:
    title: 丁寧に理由をたずねる
    gloss: 電車がなぜ遅れているのか、お伺いしたいのですが。
    note: '*I was wondering why...* は、理由を丁寧にたずねる間接的な言い方です。'
  en.a2.unit31.lesson02.teach.another_way_home:
    title: 代わりになるものをたずねる
    gloss: 今夜、家に帰るほかの方法はありますか。
    note: '*Is there another way to...?* で、代わりの手段を尋ねられます。'
  en.a2.unit31.lesson02.teach.delayed_because_signal:
    title: 遅れた理由を伝える
    gloss: 電車は信号トラブルのため遅れています。
    note: '*has been delayed because of...* で、遅れの理由を伝えられます。'
  en.a2.unit31.lesson03.teach.departure_time:
    title: departure time
    gloss: 出発時刻
    note: '*departure time* は「出発時刻」という意味です。'
    example_gloss: 新しい出発時刻は6時です。
  en.a2.unit31.lesson03.teach.notice_text:
    title: お知らせの文面
    gloss: お知らせ:5時15分の電車は、信号トラブルのため遅れています。新しい出発時刻は6時です。5時30分に、駅の外からバスが出ます。
    note: 遅れの理由、新しい時刻、代わりの手段が書かれた、正式なお知らせです。
  en.a2.unit31.lesson03.teach.i_will_take_the_bus:
    title: 自分の決定を伝える
    gloss: 代わりにバスに乗ります。
    note: '*instead* は「代わりに」という意味です。'
  en.a2.unit31.lesson04.teach.q_can_i_help:
    title: スタッフが手助けを申し出る
    gloss: 駅員が尋ねます。何かお困りですか。
    note: '*Can I help you?* は、駅員がよく使う決まった質問です。'
  en.a2.unit31.lesson04.teach.a_wondering_why_delayed:
    title: ダニエルが理由をたずねる
    gloss: ダニエルが言います。はい、電車がなぜ遅れているのか、お伺いしたいのですが。
    note: レッスン2と同じ丁寧な質問です。
  en.a2.unit31.lesson04.teach.q_signal_problem_new_time:
    title: スタッフが遅れの理由を説明する
    gloss: 駅員が言います。線路で信号トラブルが起きています。新しい出発時刻は6時です。
    note: 駅員は、理由と新しい出発時刻を伝えています。
  en.a2.unit31.lesson04.teach.a_another_way_home_tonight:
    title: ダニエルが代わりになるものをたずねる
    gloss: ダニエルが言います。今夜、家に帰るほかの方法はありますか。
    note: レッスン2と同じ質問です。
  en.a2.unit31.lesson04.teach.q_bus_at_530:
    title: スタッフが代案を伝える
    gloss: 駅員が言います。5時30分に、駅の外からバスが出ます。
    note: 駅員は、時刻と場所を示して、具体的な代わりの手段を伝えています。
  en.a2.unit31.lesson04.teach.a_thank_you_take_bus:
    title: ダニエルの最終決定
    gloss: ダニエルが言います。ありがとうございます。では、代わりにバスに乗ります。
    note: ダニエルは駅員にお礼を言い、自分の決めたことを伝えています。
