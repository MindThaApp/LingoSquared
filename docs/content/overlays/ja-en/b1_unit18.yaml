teaching:
  en.b1.unit18.lesson01.teach.arrangement:
    title: arrangement
    gloss: 取り決め、約束
    note: '*arrangement* は、時間の決まった、ほかの人とすでに取り決めてある予定のことです。'
    example_gloss: ミアは、金曜日にレイラと会う約束があります。
  en.b1.unit18.lesson01.teach.intention:
    title: intention
    gloss: つもり、意図
    note: '*intention* は、自分でやると決めてはいるけれど、ほかの人と時間までは決めていないことです。'
    example_gloss: ダニエルは、プロジェクトを早めに終わらせるつもりです。
  en.b1.unit18.lesson01.teach.prediction:
    title: prediction
    gloss: 予測
    note: '*prediction* は、何かの兆しをもとに、これから起こることを見通すことです。'
    example_gloss: 私の予測では、プロジェクトは時間どおりに終わります。
  en.b1.unit18.lesson01.teach.definitely:
    title: definitely
    gloss: 必ず、間違いなく
    note: '*definitely* は、何かが起こるとまったく確信している、ということを示します。'
    example_gloss: ダニエルは、今日中に必ず報告書を仕上げます。
  en.b1.unit18.lesson01.teach.probably:
    title: probably
    gloss: おそらく
    note: '*probably* は、かなり確かだが、完全ではない、ということを示します。'
    example_gloss: プロジェクトには、おそらく2か月かかります。
  en.b1.unit18.lesson01.teach.might:
    title: might
    gloss: 〜かもしれない
    note: '*might* は、可能性が低いことを示します。'
    example_gloss: ダニエルは、レイラにチームに加わってもらうよう頼むかもしれません。
  en.b1.unit18.lesson02.teach.meeting_leila_friday:
    title: I am + 動詞のing形（確定した約束）
    gloss: 金曜日にレイラと昼食をとる予定です。
    note: '*I am meeting Leila for lunch on Friday* は、すでにほかの人と時間まで決めた予定を、現在進行形で表しています。'
  en.b1.unit18.lesson02.teach.going_to_start_project:
    title: I am going to + 動詞（意図）
    gloss: デザインチームと新しいプロジェクトを始めるつもりです。
    note: '*I am going to start a new project* は、すでに決めたことで、時間は決まっていない場合に *going to* を使っています。'
  en.b1.unit18.lesson02.teach.grammar_arrangements_vs_intentions:
    title: 確定した約束と意図
    gloss: 相手と時間までしっかり取り決めてある予定には、現在進行形を使います（I am meeting Leila on Friday）。すでに決めた意図や決心には、時間がまだ決まっていなくても *going to* を使います（I am going to start a new project）。日本語では「会います」「始めるつもりです」のように、言い方で使い分けられますが、英語では形そのものを選ぶ必要があります。
    note: 形：しっかり決まった予定には現在進行形、意図には *going to* を使い分けます。
  en.b1.unit18.lesson03.teach.on_time:
    title: on time
    gloss: 時間どおりに、期日までに
    note: '*on time* は、予定した時刻や日付にちょうど合っている、という意味です。'
    example_gloss: ダニエルは、プロジェクトは時間どおりに終わると思っています。
  en.b1.unit18.lesson03.teach.confident:
    title: confident
    gloss: 自信がある
    note: '*confident* は、物事がうまくいくと確信している、という意味です。'
    example_gloss: ダニエルは、新しいプロジェクトについて自信を持っています。
  en.b1.unit18.lesson03.teach.reading_passage:
    title: 読み物：ダニエルの来月の予定
    gloss: ダニエルは、来月、デザインチームと新しいプロジェクトを始める予定です。金曜日の朝に彼らと会って、最初の進め方を計画します。ダニエルはこのプロジェクトに自信を持っていますが、時間どおりに終わるかどうかは、完全には確信していません。おそらく2か月くらいかかると予測しています。レイラは役に立つデザインの経験があるので、チームに加わってもらうよう頼むかもしれません。彼女が承諾してくれれば、プロジェクトは間違いなくもっと早く進むでしょう。
    note: 予定や予測についての短い読み物です。
  en.b1.unit18.lesson04.teach.q_plans_next_month:
    title: ミアがダニエルの予定をたずねる
    gloss: ミア：ダニエル、来月の予定はどうなっていますか？
    note: 会話を始めるための、自由な質問です。
  en.b1.unit18.lesson04.teach.a_going_to_start:
    title: ダニエルが自分の予定を伝える
    gloss: ダニエル：デザインチームと新しいプロジェクトを始めるつもりです。
    note: '*going to* は、すでに決めたことを表します。'
  en.b1.unit18.lesson04.teach.q_meeting_this_week:
    title: ミアがさらにたずねる
    gloss: ミア：それは楽しみですね。今週、彼らと会うんですか？
    note: 決まっている約束についての、続きの質問です。
  en.b1.unit18.lesson04.teach.a_meeting_friday_morning:
    title: ダニエルが確定した約束を確認する
    gloss: ダニエル：はい、金曜日の朝に会います。
    note: '*I am meeting... on Friday morning* は、決まっている約束を表す現在進行形です。'
  en.b1.unit18.lesson04.teach.q_finish_on_time:
    title: ミアが日程をたずねる
    gloss: ミア：プロジェクトは時間どおりに終わると思いますか？
    note: 予測についての質問です。
  en.b1.unit18.lesson04.teach.a_probably_two_months:
    title: ダニエルが予測を言う
    gloss: ダニエル：わからないけど、おそらく2か月くらいかかると思います。
    note: '*probably* は、かなり確かだが、完全ではないことを表します。'
  en.b1.unit18.lesson04.teach.q_sure_it_will_go_well:
    title: ミアが楽観的に話す
    gloss: ミア：まあ、きっとうまくいくと思いますよ。
    note: 励ましの言葉です。
  en.b1.unit18.lesson04.teach.a_might_ask_leila:
    title: ダニエルが可能性の低い選択肢を挙げる
    gloss: ダニエル：ありがとう。レイラにもチームに加わってもらうよう頼むかもしれません。
    note: '*might* は、可能性が低いことを表します。'
