  en.a1.unit37.lesson01.teach.invite:
    title: invite
    gloss: 招待する
    note: '*invite* は「招待する」という意味です。'
    example_gloss: 私は友だちを招待したいです。
  en.a1.unit37.lesson01.teach.celebrate:
    title: celebrate
    gloss: 祝う
    note: '*celebrate* は「祝う」という意味です。'
    example_gloss: いっしょに祝いましょう！
  en.a1.unit37.lesson01.teach.congratulations:
    title: congratulations
    gloss: おめでとう
    note: '*congratulations* は「おめでとう」という意味です。何かを達成した人や、うれしい出来事があった人にお祝いを言うときに使います。'
    example_gloss: 新しい仕事、おめでとう！
  en.a1.unit37.lesson02.teach.invite_someone_to:
    title: invite someone to
    gloss: 人を〜に招待する
    note: '*invite someone to* は、「人を〜に招待する」という意味です。'
    example_gloss: 私は同僚を誕生日パーティーに招待します。
  en.a1.unit37.lesson02.teach.congratulate_someone_on:
    title: congratulate someone on
    gloss: 人の〜をお祝いする
    note: '*congratulate someone* のあとには、いつも前置詞 *on* を使い、*with* や *for* は使いません。日本語の「〜をお祝いする」では助詞「を」を使うので、英語の前置詞はそのまま覚える必要があります。'
    example_gloss: 私たちは彼の昇進をお祝いします。
  en.a1.unit37.lesson02.teach.wish_someone_happy_birthday:
    title: wish someone a happy birthday
    gloss: 人に誕生日のお祝いを言う
    note: '*wish someone a happy birthday* は、「人に誕生日のお祝いを言う」という意味です。'
    example_gloss: あなたに誕生日おめでとうと言いたいです。
  en.a1.unit37.lesson02.teach.surprise_party:
    title: surprise party
    gloss: サプライズパーティー
    note: '*surprise party* は「サプライズパーティー」という意味です。'
    example_gloss: 彼らは彼女のためにサプライズパーティーを計画しています。
  en.a1.unit37.lesson02.teach.have_a_party:
    title: have a party
    gloss: パーティーを開く
    note: '*have a party* は「パーティーを開く」という意味です。'
    example_gloss: 私たちは毎年10月にパーティーを開きます。
  en.a1.unit37.lesson02.teach.come_to_my_party_question:
    title: Do you want to come to my party?
    gloss: 私のパーティーに来ませんか。
    note: 気軽に人を誘う、親しみやすい言い方です。
  en.a1.unit37.lesson03.teach.dialogue_line1:
    title: レイラの質問
    gloss: レイラは「ダニエルの誕生日が10月12日だって知っていましたか」とたずねています。
    note: '*Did you know ...?* は、新しい情報を伝えて会話を始める自然な言い方です。'
  en.a1.unit37.lesson03.teach.dialogue_line2:
    title: ミアの反応
    gloss: ミアは「いいえ、知りませんでした！ 今度の金曜日ですね」と言っています。
    note: '*No, I didn''t!* は、*Did you know ...?* という質問に対する短い否定の返事で、「いいえ、知りませんでした」という意味です。'
  en.a1.unit37.lesson03.teach.dialogue_line3:
    title: レイラの提案
    gloss: レイラは「会社で彼のためにサプライズパーティーを開きましょう」と言っています。
    note: '*Let''s* + 動詞は、提案をするときに使います。日本語の「〜しましょう」にあたります。'
  en.a1.unit37.lesson03.teach.dialogue_line4:
    title: ミアの反応
    gloss: ミアは「いい考えですね！ 私がチームのほかの人たちを招待できますよ」と言っています。
    note: '*the rest of the team* は「チームのほかの人たち」という意味です。'
  en.a1.unit37.lesson03.teach.dialogue_line5:
    title: Leila's plan
    gloss: レイラは「いいですね。彼にプレゼントを買います。走るのが大好きなので、新しいランニングシューズかな」と言っています。
    note: '*since* は、ここでは「〜なので」（理由）という意味で、「〜から」（時間）ではありません。'
  en.a1.unit37.lesson03.teach.dialogue_line6:
    title: ミアの提案
    gloss: ミアは「それはいい考えですね。ケーキも買いましょうか」と言っています。
    note: '*Should we ...?* は、いっしょに何かを決めるときに使います。'
  en.a1.unit37.lesson03.teach.dialogue_line7:
    title: "レイラの答え"
    gloss: レイラは「はい、もちろん！ みんなでいっしょに彼に誕生日おめでとうと言いましょう」と言っています。
    note: '*We''ll all wish him a happy birthday* は、「みんなで彼に誕生日おめでとうと言います」という意味です。'
  en.a1.unit37.lesson04.teach.reading_passage:
    title: サプライズパーティーについての文章
    gloss: ダニエルは、レイラとミアが自分のためにサプライズパーティーを計画していることを知りませんでした。誕生日の10月12日、彼が会社に着くと、休憩室に風船とケーキがありました。みんなが「誕生日おめでとう！」と言いました。レイラは新しいランニングシューズをあげました。ミアは、自分で撮った、三人の同僚がいっしょに写っている写真を額に入れて贈りました。ダニエルはとても喜んで、すばらしいサプライズのことをみんなに感謝しました。
    note: '*he arrived at work and found*：*arrive* と *find* の過去形です（会社に着いて、見つけた）。'
