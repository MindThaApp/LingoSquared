teaching:
  en.a1.unit33.lesson01.teach.bus:
    title: bus
    gloss: バス
    note: '*bus* は「バス」という意味です。使う動詞は *take* で、*take the bus* と言います。日本語でも「バスに乗る」「車を運転する」のように動詞を使い分けますが、英語も乗り物ごとに *take*、*drive*、*ride* を使い分けます。それぞれ覚えましょう。'
    example_gloss: 私はバスに乗ります。
  en.a1.unit33.lesson01.teach.train:
    title: train
    gloss: 電車
    note: '*train* は「電車」という意味です。*bus* と同じように、ここでも *take* を使います：*take the train*。'
    example_gloss: 彼女は電車に乗ります。
  en.a1.unit33.lesson01.teach.car:
    title: car
    gloss: 車
    note: '*car* は「車」という意味です。車には *take* ではなく *drive* を使います：*drive my car*。バスや電車とは別の動詞です。'
    example_gloss: 私は車で通勤しています。
  en.a1.unit33.lesson01.teach.bike:
    title: bike
    gloss: 自転車
    note: '*bike* は「自転車」という意味です。ここでもまた別の動詞を使います：*ride a bike*（*take* でも *drive* でもありません）。'
    example_gloss: 私は毎日自転車で通勤しています。
  en.a1.unit33.lesson01.teach.walk:
    title: walk
    gloss: 歩く
    note: '*walk* は「歩く」という意味です。*take*、*drive*、*ride* のような別の動詞は要りません。*walk* 自体が動詞だからです：*walk to work*（*take a walk to work* とは言いません）。'
    example_gloss: 私は歩いて通勤しています。
  en.a1.unit33.lesson02.teach.how_get_to:
    title: How do you get to work?
    gloss: どうやって通勤していますか。
    note: この疑問文は助動詞 *do* で始まります。本動詞が *get* だからです。日本語の疑問文には、このような助動詞は要りません。
  en.a1.unit33.lesson02.teach.usually:
    title: usually
    gloss: たいてい
    note: '*usually* は「たいてい」という意味です。英語では、この副詞はふつう主語と本動詞の間に置きます：*I usually take the bus*。'
    example_gloss: 私はたいていバスに乗ります。
  en.a1.unit33.lesson02.teach.minutes:
    title: minutes
    gloss: 分
    note: '*minutes* は「分」という意味です。*It takes twenty minutes* の *it* は、それ自体に意味のない形式上の主語です。日本語では「20分かかります」と主語を言いませんが、英語の文には主語が必要なので *it* を置きます。'
    example_gloss: 20分かかります。
  en.a1.unit33.lesson02.teach.late:
    title: late
    gloss: 遅れた
    note: '*late* は「遅れた」「遅い」という意味で、予定より遅く着くことを表します：*The bus is often late.*'
    example_gloss: バスはよく遅れます。
  en.a1.unit33.lesson02.teach.faster:
    title: faster
    gloss: より速い
    note: '*faster* は「より速い」という意味で、*fast* に *-er* をつけた比較級です。比べるときは *than* を使います：*faster than the bus*。'
    example_gloss: 電車はバスより速いです。
  en.a1.unit33.lesson03.teach.dialogue_line1:
    title: レイラの質問
    gloss: レイラは「ダニエル、どうやって通勤していますか」とたずねています。
    note: 会話は *How do you get to work?* で始まります。
  en.a1.unit33.lesson03.teach.dialogue_line2:
    title: "ダニエルの答え"
    gloss: ダニエルは「たいていバスに乗ります。20分くらいかかります」と言っています。
    note: ここには二つのポイントがあります。バスには動詞 *take* を使うこと、そして *It takes about twenty minutes* の形式上の主語 *it* です。
  en.a1.unit33.lesson03.teach.dialogue_line3:
    title: レイラの質問
    gloss: レイラは「気に入っていますか」とたずねています。
    note: '*Do* で始まる、はい・いいえで答える疑問文です。'
  en.a1.unit33.lesson03.teach.dialogue_line4:
    title: "ダニエルの答え"
    gloss: ダニエルは「まあまあです。でも、バスはよく遅れます。あなたはどうですか」と言っています。
    note: '*How about you?* は「あなたはどうですか」という意味で、同じ質問を相手に返す短い言い方です。'
  en.a1.unit33.lesson03.teach.dialogue_line5:
    title: "レイラの答え"
    gloss: レイラは「私は車を運転します。そのほうが速いですが、駐車が大変です」と言っています。
    note: 車には動詞 *drive* を使い、*take* は使いません。
  en.a1.unit33.lesson04.teach.reading_passage:
    title: レイラとダニエルについての文章
    gloss: レイラは毎日車で通勤しています。運転は15分くらいですが、会社の近くは駐車が大変です。ダニエルは車を持っていないので、バスに乗ります。バスは20分かかり、ときどき遅れますが、駐車の心配はありません。
    note: ポイント：バスと電車には *take*、車には *drive* を使います。
