teaching:
  en.a1.unit66.lesson01.teach.symptom:
    title: symptom
    gloss: 症状
    note: '*symptom* は、体で感じる「症状」という意味です。綴りに注意しましょう。*symptom* の2文字目は *y* で、*i* ではありません。'
    example_gloss: これは症状です。
  en.a1.unit66.lesson01.teach.cough:
    title: cough
    gloss: せき
    note: '*cough* は「せき」という意味です。発音は *kof* で、*gh* はここでは *f* の音になります。'
    example_gloss: 私はせきが出ます。
  en.a1.unit66.lesson01.teach.fever:
    title: fever
    gloss: 熱
    note: '*fever* は「熱」という意味です。体温が高くなる状態をさします。'
    example_gloss: 熱はありますか。
  en.a1.unit66.lesson01.teach.throat:
    title: throat
    gloss: のど
    note: '*throat* は「のど」という意味で、口の奥から続く部分をさします。首の外側は *neck* と言います。'
    example_gloss: 私はのどが痛いです。
  en.a1.unit66.lesson01.teach.headache:
    title: headache
    gloss: 頭痛
    note: '*headache* は「頭痛」という意味です(英語では単数形で使います)。'
    example_gloss: 私は頭が痛いです。
  en.a1.unit66.lesson01.teach.medicine:
    title: medicine
    gloss: 薬
    note: '*medicine* は「薬」という意味です。数えられない名詞なので、*some medicine* と言います。'
    example_gloss: この薬を飲んでください。
  en.a1.unit66.lesson02.teach.have_cough:
    title: I have a cough.
    gloss: 私はせきが出ます。
    note: 英語では、*have a cough* のように *a* をつけます。日本語の「せきが出る」では数を意識しませんが、英語では1回分のせきをさす形で言います。
  en.a1.unit66.lesson02.teach.throat_hurts:
    title: My throat hurts.
    gloss: 私はのどが痛いです。
    note: '*hurts* は「痛む」という意味です。英語では、痛む体の部分が主語になります(*my throat hurts*)。日本語の「のどが痛い」と同じように、「のど」が主役です。'
  en.a1.unit66.lesson02.teach.have_headache:
    title: I have a headache.
    gloss: 私は頭が痛いです。
    note: 英語では、*have a headache* のように *a* をつけます。日本語の「頭痛がする」と違い、数えられる名詞として扱います。
  en.a1.unit66.lesson02.teach.have_medicine:
    title: Do you have medicine?
    gloss: 薬はありますか。
    note: '*Do you have...?* で、何かがあるかどうかをたずねます。'
  en.a1.unit66.lesson02.teach.with_water:
    title: Take this with water.
    gloss: これを水で飲んでください。
    note: '*with water* は文の最後に置きます。'
  en.a1.unit66.lesson02.teach.ask_doctor:
    title: Please ask a doctor.
    gloss: 医者に聞いてください。
    note: '*Please* をつけると、文が丁寧になります。'
  en.a1.unit66.lesson03.teach.dialogue_line1:
    title: レイラが症状を伝える
    gloss: レイラが「こんにちは。せきが出ます」と言っています
    note: '*I have a cough* は、症状を伝える言い方です。'
  en.a1.unit66.lesson03.teach.dialogue_line2:
    title: 薬剤師が熱についてたずねる
    gloss: 薬剤師が「熱はありますか」と言っています
    note: '*Do you have a fever?* は、「はい」か「いいえ」で答える質問です。'
  en.a1.unit66.lesson03.teach.dialogue_line3:
    title: レイラは熱がない
    gloss: レイラが「いいえ、熱はありません。のどが痛いです」と言っています
    note: '*No, I do not have...* で、症状がないことを伝えます。英語では *do not* を使って否定します。'
  en.a1.unit66.lesson03.teach.dialogue_line4:
    title: 薬剤師が頭痛についてたずねる
    gloss: 薬剤師が「頭痛はありますか」と言っています
    note: '*headache* は「頭痛」という意味です。'
  en.a1.unit66.lesson03.teach.dialogue_line5:
    title: レイラは頭痛がある
    gloss: レイラが「はい、頭痛があります」と言っています
    note: '*Yes* は「はい」という意味です。'
  en.a1.unit66.lesson03.teach.dialogue_line6:
    title: 薬剤師のアドバイス
    gloss: 薬剤師が「この薬を水で飲んでください。具合がもっと悪くなったら、医者に相談してください」と言っています
    note: '*if you feel worse* は「もっと具合が悪くなったら」という意味です。'
  en.a1.unit66.lesson03.teach.dialogue_line7:
    title: レイラがお礼を言う
    gloss: レイラが「ありがとうございます」と言っています
    note: '*Thank you* は、お礼を言う短い言い方です。'
  en.a1.unit66.lesson04.teach.pharmacy_note:
    title: 薬局のメモ
    gloss: 薬局のメモ:せきとのどの痛み。熱なし。薬は水で飲むこと。悪くなったら医者に相談。
    note: このメモには、症状と簡単なアドバイスが書いてあります。
  en.a1.unit66.lesson04.teach.reading_passage:
    title: 読み物:薬局に行く
    gloss: 薬局に行く:レイラは、せきが出て、のどが痛かったので、薬局に行きました。薬剤師は、熱があるかたずねました。レイラは、熱はないけれど頭痛がすると答えました。薬剤師はレイラに薬を渡して、水で飲むように言いました。メモには、具合が悪くなったら医者に相談するようにと書いてありました。
    note: '*felt worse* は *feel worse* の過去形です。'
