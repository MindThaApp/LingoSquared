teaching:
  en.a2.unit28.lesson01.teach.medicine:
    title: medicine
    gloss: 薬
    note: '*medicine* は「薬」のことです。'
    example_gloss: 医師が頭痛の薬を出してくれました。
  en.a2.unit28.lesson01.teach.prescription:
    title: prescription
    gloss: 処方箋
    note: '*prescription* は、医師が出す処方箋のことです。'
    example_gloss: 医師がその薬の処方箋を書いてくれました。
  en.a2.unit28.lesson01.teach.follow_up_appointment:
    title: follow-up appointment
    gloss: 再診の予約
    note: '*follow-up appointment* は、医師が経過を診るためのもう一度の予約のことです。'
    example_gloss: よくならなければ、再診の予約が必要です。
  en.a2.unit28.lesson01.teach.getting_worse:
    title: getting worse
    gloss: 悪化する
    note: '*getting worse* は、症状がどんどん悪くなっていることを表します。'
    example_gloss: 頭痛はよくなるどころか、悪化しています。
  en.a2.unit28.lesson01.teach.insurance_card:
    title: insurance card
    gloss: 健康保険証
    note: '*insurance card* は、健康保険の保険証のことです。'
    example_gloss: 予約のときに保険証を持ってきてください。
  en.a2.unit28.lesson01.teach.reused_symptoms:
    title: 以前の症状
    gloss: 頭痛、のどの痛み、熱
    note: これらの単語はユニット22で学びました。ここで復習します。
    example_gloss:
    - 頭痛がします。
    - のどが痛いです。
    - 熱があります。
  en.a2.unit28.lesson02.teach.appointment_request:
    title: 予約をお願いする
    gloss: 医師の診察の予約を取りたいのですが。
    note: '*I''d like to...* で、丁寧に予約をお願いできます。'
  en.a2.unit28.lesson02.teach.symptom_duration:
    title: 症状がどのくらい続いているかを伝える
    gloss: 3日前から頭痛とのどの痛みがあり、悪化しています。
    note: ある状態が今まで続いているときは、英語では現在完了形(*Present Perfect*、*I've had ... for three days*)を使います。日本語の「3日前から〜ています」にあたる内容を、*have* と *had* で表します。
  en.a2.unit28.lesson03.teach.arrive_early:
    title: arrive ten minutes early
    gloss: 10分前に着く
    note: '*arrive ten minutes early* は、予約の10分前に着くことを表します。'
    example_gloss: 予約の10分前にお越しください。
  en.a2.unit28.lesson03.teach.confirmation_text:
    title: 確認の文面
    gloss: 本日15時のご予約を承りました。保険証をお持ちのうえ、10分前にお越しください。確認番号は7724です。
    note: 時間、お願いしたいこと、番号が書かれた正式な確認です。
  en.a2.unit28.lesson04.teach.i_see:
    title: I see.
    gloss: なるほど。
    note: '*I see* は、相手の話を理解したことを示す言い方です。'
  en.a2.unit28.lesson04.teach.q_whats_wrong:
    title: どうしたのかをたずねる
    gloss: 医師が尋ねます。どうされましたか。
    note: ユニット22でレイラが尋ねたのと同じ質問を、今度は医師が尋ねています。
  en.a2.unit28.lesson04.teach.a_symptoms_duration:
    title: 症状についてのダニエルの答え
    gloss: ダニエルが言います。3日前から頭痛とのどの痛みがあり、悪化しています。
    note: レッスン2と同じ文です。
  en.a2.unit28.lesson04.teach.a_bad_cold:
    title: 医師の診断
    gloss: 医師が言います。なるほど。ひどい風邪ですね。
    note: よくある、重くない診断です。
  en.a2.unit28.lesson04.teach.q_medicine:
    title: 薬についてたずねる
    gloss: ダニエルが尋ねます。何か薬を飲んだほうがいいですか。
    note: ダニエルは診断を聞いて、治療について尋ねています。
  en.a2.unit28.lesson04.teach.a_medicine_instructions:
    title: 薬の飲み方の説明
    gloss: 医師が言います。はい、この薬を1日2回、5日間飲んでください。水をたくさん飲んでください。
    note: 具体的な指示です。1日2回、5日間です。
  en.a2.unit28.lesson04.teach.q_follow_up:
    title: 次回の診察についてたずねる
    gloss: ダニエルが尋ねます。よくならなければ、また来たほうがいいですか。
    note: ダニエルは、ユニット22でレイラが使ったのと同じ条件(*if it doesn't get better*)を使っています。
  en.a2.unit28.lesson04.teach.a_followup_appointment:
    title: 次回の診察についての医師の答え
    gloss: 医師が言います。はい、1週間以内によくならなければ、再診の予約でまた来てください。
    note: 医師は、いつまた来るべきかをはっきり伝えています。1週間以内によくならない場合です。
