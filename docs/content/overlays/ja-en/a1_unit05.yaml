teaching:
  en.a1.unit05.lesson01.teach.what_time:
    title: What time is it?
    gloss: 今、何時ですか？
    note: '*What time is it?* は、時刻を一般的にたずねる表現です。'
  en.a1.unit05.lesson01.teach.three_oclock:
    title: It's three o'clock.
    gloss: 3時です。
    note: '*It''s three o''clock.* は、ちょうどの時刻を言う表現です。'
  en.a1.unit05.lesson01.teach.half_past:
    title: It's half past three.
    gloss: 3時半です。
    note: 英語の *half past three* は「3時を半分過ぎた」という意味で、3:30のことです。日本語の「3時半」と同じ時刻です。直訳すると「3時の半分あと」のように聞こえますが、意味は3:30です。
  en.a1.unit05.lesson01.teach.five_oclock:
    title: It's five o'clock.
    gloss: 5時です。
    note: '*It''s five o''clock.* は、ちょうど5:00という意味です。'
  en.a1.unit05.lesson02.teach.quarter_past:
    title: It's a quarter past three.
    gloss: 3時15分です。
    note: '*It''s a quarter past three.* は3:15という意味です。'
  en.a1.unit05.lesson02.teach.quarter_to:
    title: It's a quarter to four.
    gloss: 4時15分前です。
    note: '*It''s a quarter to four.* は3:45という意味です。'
  en.a1.unit05.lesson02.teach.ten_past:
    title: It's ten past four.
    gloss: 4時10分です。
    note: '*It''s ten past four.* は4:10という意味です。'
  en.a1.unit05.lesson02.teach.ten_to:
    title: It's ten to five.
    gloss: 5時10分前です。
    note: '*It''s ten to five.* は4:50という意味です。'
  en.a1.unit05.lesson03.teach.morning:
    title: morning
    gloss: 朝
    note: '*morning* は朝から午前中を表し、だいたい6時から12時ごろです。'
    example_gloss: おはよう、ダニエル！
  en.a1.unit05.lesson03.teach.afternoon:
    title: afternoon
    gloss: 午後
    note: '*afternoon* は午後を表し、だいたい12時から17時ごろです。'
    example_gloss: 私は午後に働きます。
  en.a1.unit05.lesson03.teach.evening:
    title: evening
    gloss: 夕方
    note: '*evening* は夕方から夜のはじめを表し、だいたい17時から21時ごろです。境目ははっきりしていません。'
    example_gloss: こんばんは、レイラ！
  en.a1.unit05.lesson03.teach.night:
    title: night
    gloss: 夜
    note: '*night* は夜を表し、だいたい21時から6時ごろです。'
    example_gloss: おやすみ、ダニエル！
  en.a1.unit05.lesson03.teach.at_nine_am:
    title: The store opens at nine in the morning.
    gloss: お店は朝9時に開きます。
    note: 時刻の前には *at* を使います（*at nine*）。日本語の「9時に」の「に」にあたります。
  en.a1.unit05.lesson03.teach.at_six_pm:
    title: The store closes at six in the evening.
    gloss: お店は夕方6時（18時）に閉まります。
    note: 英語では、日常の時刻を12時間制で言い、時間帯を添えることがよくあります（*six in the evening*）。日本語でも「午後6時」「18時」の両方を使いますが、英語の営業時間では18時のような24時間制はあまり使いません。
  en.a1.unit05.lesson04.teach.opens_at:
    title: opens at
    gloss: 〜に開く
    note: '*opens at* + 時刻は、「〜時に開く」という意味です。'
    example_gloss: 図書館は9時に開きます。
  en.a1.unit05.lesson04.teach.closes_at:
    title: closes at
    gloss: 〜に閉まる
    note: '*closes at* + 時刻は、「〜時に閉まる」という意味です。'
    example_gloss: 図書館は6時に閉まります。
  en.a1.unit05.lesson04.teach.q_open:
    title: ダニエルが開店時間をたずねる
    gloss: ダニエル「図書館は何時に開きますか？」
    note: '*What time does ...?* は、正確な時刻をたずねる表現です。疑問文では *does* を使うので、*open* には -s が付きません。'
  en.a1.unit05.lesson04.teach.a_open:
    title: 開店時間についての答え
    gloss: レイラ「朝9時に開きます。」
    note: 完全な答えは、正確な時刻と時間帯を伝えます。
  en.a1.unit05.lesson04.teach.q_close:
    title: 閉店時間をたずねる
    gloss: ダニエル「それで、何時に閉まりますか？」
    note: '*And* は、同じ会話の二つ目の質問を始める言葉です。'
  en.a1.unit05.lesson04.teach.a_close:
    title: 閉店時間についての答え
    gloss: レイラ「夕方6時（18時）に閉まります。」
    note: 完全な答えは、ここでも正確な時刻を伝えます。
  en.a1.unit05.lesson04.teach.closing:
    title: 会話を終える
    gloss: ダニエル「いいですね、では9時に会いましょう！」
    note: '*See you at nine!* は、9時にまた会うという意味です。'
