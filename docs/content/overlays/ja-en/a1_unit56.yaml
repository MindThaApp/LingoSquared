teaching:
  en.a1.unit56.lesson01.teach.restaurant:
    title: restaurant
    gloss: レストラン
    note: '*restaurant* は「レストラン」という意味です。'
    example_gloss: このレストランは毎晩開いています。
  en.a1.unit56.lesson01.teach.waiter:
    title: waiter
    gloss: ウェイター、給仕
    note: '*waiter* は「ウェイター、給仕の人」という意味です。'
    example_gloss: ウェイターはとても親切です。
  en.a1.unit56.lesson01.teach.table:
    title: table
    gloss: テーブル、席
    note: '*table* は「テーブル、席」という意味です。'
    example_gloss: 私たちの席は窓のそばです。
  en.a1.unit56.lesson01.teach.menu:
    title: menu
    gloss: メニュー
    note: '*menu* は「メニュー」という意味です。'
    example_gloss: メニューを見せていただけますか。
  en.a1.unit56.lesson01.teach.order:
    title: order
    gloss: 注文する
    note: '*order* は「注文する」という意味です。'
    example_gloss: チキンを注文したいです。
  en.a1.unit56.lesson01.teach.bill:
    title: bill
    gloss: お会計、勘定書
    note: '*bill* は「お会計、勘定書」という意味です。'
    example_gloss: お会計は10ドルでした。
  en.a1.unit56.lesson02.teach.is_this_table_free:
    title: Is this table free?
    gloss: この席は空いていますか。
    note: ここでの *free* は「空いている」という意味で、使われていない状態を表します。日本語の「空いている」とよく似た使い方です。
  en.a1.unit56.lesson02.teach.can_i_order_now:
    title: Can I order now?
    gloss: もう注文してもいいですか。
    note: '*Can I...?* は気軽に頼む言い方で、*could* ほど改まっていません。'
  en.a1.unit56.lesson02.teach.id_like_the_salad:
    title: I'd like the salad, please.
    gloss: サラダをお願いします。
    note: '*I''d like*（*I would like* の短い形）は、丁寧に注文する言い方です。'
  en.a1.unit56.lesson02.teach.how_much_is_the_salad:
    title: How much is the salad?
    gloss: サラダはいくらですか。
    note: '*How much is...?* は値段をたずねる表現です。'
  en.a1.unit56.lesson02.teach.could_we_have_the_bill:
    title: Could we have the bill, please?
    gloss: お会計をお願いできますか。
    note: '*Could we have...?* は丁寧にお願いする言い方です。英語では *could* が自然で丁寧な形です。日本語の「…をお願いできますか」に近い感じです。'
  en.a1.unit56.lesson02.teach.enjoy_your_meal:
    title: Enjoy your meal!
    gloss: どうぞ召し上がってください。
    note: '*Enjoy your meal!* は、ウェイターが食べ始める前に言う決まった表現です。直訳は「食事を楽しんでください」ですが、日本語の「どうぞごゆっくり」「召し上がれ」に近い場面で使います。単語ごとではなく、ひとまとまりで覚えましょう。'
  en.a1.unit56.lesson03.teach.dialogue_line1:
    title: レイラが席についてたずねる
    gloss: レイラ：こんにちは！この席は空いていますか。
    note: '*Is this table free?* では、*free* を「空いている」という意味で使っています。'
  en.a1.unit56.lesson03.teach.dialogue_line2:
    title: ウェイターが席を案内する
    gloss: ウェイター：はい、こちらにおかけください。
    note: '*please sit here* は、短くて丁寧な案内です。'
  en.a1.unit56.lesson03.teach.dialogue_line3:
    title: ミアがメニューをたのむ
    gloss: ミア：メニューを見せていただけますか。
    note: '*Could I see...?* でも、*could we have the bill* と同じように丁寧な *could* を使っています。'
  en.a1.unit56.lesson03.teach.dialogue_line4:
    title: ウェイターがメニューを渡す
    gloss: ウェイター：もちろんです、どうぞ。
    note: '*Of course, here you are* は、何かを相手に渡すときの決まった言い方です。'
  en.a1.unit56.lesson03.teach.dialogue_line5:
    title: レイラの注文
    gloss: レイラ：チキンをお願いします。
    note: 1つの情報です。レイラの注文はチキンです。
  en.a1.unit56.lesson03.teach.dialogue_line6:
    title: ミアの注文
    gloss: ミア：サラダをお願いします。
    note: 1つの情報です。ミアの注文はサラダです。
  en.a1.unit56.lesson03.teach.dialogue_line7:
    title: ウェイターが食事をすすめる
    gloss: ウェイター：いい選択ですね！どうぞ召し上がってください！
    note: '*Enjoy your meal!* は、お客さんが食べ始める前に言う決まった一言です。'
  en.a1.unit56.lesson03.teach.dialogue_line8:
    title: レイラがチキンの値段をたずねる
    gloss: レイラ：チキンはいくらですか。
    note: '*How much is...?* は値段をたずねる表現です。'
  en.a1.unit56.lesson03.teach.dialogue_line9:
    title: チキンの値段
    gloss: ウェイター：チキンは12ドルです。
    note: 1つの情報です。チキンの値段で、サラダや合計金額とは別です。
  en.a1.unit56.lesson03.teach.dialogue_line10:
    title: ミアがサラダの値段をたずねる
    gloss: ミア：サラダはいくらですか。
    note: '*How much is...?* は、チキンのときと同じ疑問文の形です。'
  en.a1.unit56.lesson03.teach.dialogue_line11:
    title: サラダの値段
    gloss: ウェイター：サラダは7ドルです。
    note: 2つ目の、別の情報です。サラダの値段です。
  en.a1.unit56.lesson03.teach.dialogue_line12:
    title: "レイラが会計をお願いする"
    gloss: レイラ：お会計をお願いできますか。
    note: '*Could we have...?* でも、丁寧な *could* を使っています。'
  en.a1.unit56.lesson03.teach.dialogue_line13:
    title: 合計金額
    gloss: ウェイター：19ドルです。
    note: 3つ目の、別の情報です。合計金額で、チキンとサラダそれぞれの値段とは別です。
  en.a1.unit56.lesson04.teach.restaurant_menu:
    title: メニュー
    gloss: レストランのメニュー：チキン - $12。サラダ - $7。ピザ - $10。ジュース - $3。
    note: メニューには、4つの品物とその値段が載っています。
  en.a1.unit56.lesson04.teach.reading_passage:
    title: レストランでの食事の文章
    gloss: ある晩、レイラとミアは、街の中心にある新しいレストランに行ってみることにしました。ウェイターが二人を窓のそばの席に案内しました。彼は、チキン、サラダ、ピザ、ジュースが載ったメニューを持ってきました。レイラはチキンを、ミアはサラダを注文しました。チキンは12ドルで、サラダは7ドルでした。食事をしながら、二人はミアの写真教室について話しました。食べ終わると、ウェイターがお会計を持ってきました。二人で19ドルでした。レイラはそのレストランをすばらしいと言い、ミアは次はダニエルを連れてきたいと言いました。
    note: '*ordered* は *order*（注文する）の過去形です。'
