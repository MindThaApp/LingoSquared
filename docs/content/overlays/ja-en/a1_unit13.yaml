teaching:
  en.a1.unit13.lesson01.teach.happy:
    title: happy
    gloss: うれしい / 幸せな
    note: '*happy* は「うれしい」「幸せな」という意味です。'
    example_gloss: 今日はうれしいです。
  en.a1.unit13.lesson01.teach.sad:
    title: sad
    gloss: 悲しい
    note: '*sad* は「悲しい」という意味です。'
