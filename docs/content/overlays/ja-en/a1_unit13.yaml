  en.a1.unit13.lesson01.teach.excited:
    title: excited
    gloss: わくわくした
    note: '*excited* は、よいことを楽しみにして「わくわくする」気持ちを表します。不安な気持ちは *worried* で表します。'
    example_gloss: 明日が楽しみです。
  en.a1.unit13.lesson01.teach.worried:
    title: worried
    gloss: 心配な
    note: '*worried* は、これから起こるかもしれないことが「心配」「不安」だという意味です。'
    example_gloss: 彼は明日のことが心配です。
  en.a1.unit13.lesson02.teach.how_are_you_feeling:
    title: How are you feeling today?
    gloss: 今日は気分はどうですか。
    note: '*How are you feeling?* は、今の気持ちを具体的にたずねる言い方で、ふつうのあいさつの *How are you?* とは少し違います。'
  en.a1.unit13.lesson02.teach.im_worried_because:
    title: I'm a little worried because I have a big test tomorrow.
    gloss: 明日大事なテストがあるので、少し心配です。
    note: '*because* は「~なので」「~だから」という意味で、気持ちの理由を表します。'
  en.a1.unit13.lesson02.teach.im_happy_because:
    title: I'm happy because the class is almost over.
    gloss: 授業がもうすぐ終わるので、うれしいです。
    note: '*almost over* は「もうすぐ終わる」という意味です。'
  en.a1.unit13.lesson03.teach.message_text:
    title: 気持ちについてのメッセージ
    gloss: こんにちは、明日大事なテストがあるので、少し心配です。でも、今年最後のテストなので、わくわくしてもいます!
    note: メッセージの中では、短い文をつなげて、いくつかの気持ち(反対の気持ちでも)を表すことができます。
  en.a1.unit13.lesson03.teach.writer_summary:
    title: The writer is worried and excited.
    gloss: 書いた人は、心配でもあり、わくわくしてもいます。
    note: '*writer* は、メッセージを書いた人のことです。'
  en.a1.unit13.lesson04.teach.i_understand:
    title: Oh, I understand.
    gloss: ああ、わかります。
    note: '*I understand* は「わかります」という意味で、話を聞いて共感を示すときに使います。'
  en.a1.unit13.lesson04.teach.q_feeling:
    title: レイラの質問
    gloss: レイラ:今日は気分はどう?
    note: レイラは、ダニエルの気持ちをたずねて会話を始めます。
  en.a1.unit13.lesson04.teach.a_worried_test:
    title: ダニエルの答え
    gloss: ダニエル:明日大事なテストがあるから、少し心配だよ。
    note: ダニエルは、自分の気持ちとその理由を言っています。
  en.a1.unit13.lesson04.teach.acknowledge_and_ask:
    title: レイラの反応
    gloss: レイラ:ああ、わかるよ。わくわくする気持ちもある?
    note: レイラは、理解を示し、ほかの気持ちもあるかたずねています。
  en.a1.unit13.lesson04.teach.a_yes_happy_class:
    title: ダニエルの答え
    gloss: ダニエル:うん、少しね。授業がもうすぐ終わるのがうれしいんだ。
    note: ダニエルは短く答え、2つ目の前向きな気持ちを伝えています。
