teaching:
  en.a1.unit24.lesson01.teach.bedroom:
    title: bedroom
    gloss: 寝室
    note: '*bedroom* は「寝室」という意味です。*bed*(ベッド)と *room*(部屋)を組み合わせた語ですが、英語では2つの部分をはっきり区切って発音し、強く読みます。'
    example_gloss: 私の寝室は浴室の隣にあります。
  en.a1.unit24.lesson01.teach.kitchen:
    title: kitchen
    gloss: 台所、キッチン
    note: '*kitchen* は「台所」という意味です。発音は *KITCH-en* で、*t* は単独では発音しません。'
    example_gloss: キッチンはリビングの隣にあります。
  en.a1.unit24.lesson01.teach.bathroom:
    title: bathroom
    gloss: 浴室、バスルーム
    note: '*bathroom* は「浴室」という意味です。アメリカでは、トイレをさす言葉としてもよく使われます。'
    example_gloss: 浴室にはシャワーがあります。
  en.a1.unit24.lesson01.teach.living_room:
    title: living room
    gloss: 居間、リビング
    note: '*living room* は「居間、リビング」という意味です。2語に分けて書きます。'
    example_gloss: 私たちはリビングでテレビを見ます。
  en.a1.unit24.lesson01.teach.garden:
    title: garden
    gloss: 庭
    note: '*garden* は「庭」という意味です。アメリカでは、家の裏にある庭を *yard* と言うこともよくあります。'
    example_gloss: 庭はありませんが、ベランダはあります。
  en.a1.unit24.lesson01.teach.the_kitchen_is_a_room:
    title: This is the kitchen.
    gloss: ここは台所です。
    note: '*This is ...* で、目の前のものを紹介します。*the* は特定のものを表し、ここでは「この住まいの台所」をさします。'
  en.a1.unit24.lesson02.teach.how_many_rooms:
    title: How many rooms are there?
    gloss: 部屋はいくつありますか。
    note: '*How many...are there?* で、数をたずねます。*many* は数えられるものの複数形と一緒に使います。*rooms* は複数なので *are* になります。'
  en.a1.unit24.lesson02.teach.there_is_a_kitchen:
    title: There's a small kitchen.
    gloss: 小さな台所があります。
    note: '*There''s...*(*there is*)で、どこかに何かがあることを伝えます。日本語の「〜があります」にあたります。ものが複数のときは *there are* と言います。'
  en.a1.unit24.lesson02.teach.next_to:
    title: next to
    gloss: 〜の隣に
    note: '*next to* は「〜の隣に」という意味です。2語でいつもセットで使います。'
    example_gloss: 椅子はテーブルの隣にあります。
  en.a1.unit24.lesson03.teach.apartment:
    title: apartment
    gloss: アパート、マンション
    note: '*apartment* は「アパート、マンションの一室」という意味です(アメリカ英語。イギリス英語では *flat* と言います)。'
    example_gloss: ダニエルのアパートには寝室が2つあります。
  en.a1.unit24.lesson03.teach.home_text:
    title: アパートについての文章
    gloss: 私のアパートには、寝室が2つと浴室が1つあります。リビングの隣に小さな台所があります。
    note: この短い文章では、ある人が自分のアパートと、部屋の数を説明しています。
  en.a1.unit24.lesson04.teach.favorite_room:
    title: What's your favorite room?
    gloss: 一番好きな部屋はどこですか。
    note: '*favorite* は「お気に入りの、一番好きな」という意味です。'
  en.a1.unit24.lesson04.teach.q_tell_me_about:
    title: 住まいについてたずねる
    gloss: レイラが「あなたのアパートについて教えてください」と言っています
    note: '*Tell me about...* で、何かについて説明してほしいとたのみます。'
  en.a1.unit24.lesson04.teach.a_two_bed_one_bath:
    title: ダニエルの答え
    gloss: ダニエルが「寝室が2つと浴室が1つあります。リビングの隣に小さな台所があります」と言っています
    note: ダニエルは、部屋の数と、台所の場所を伝えています。
  en.a1.unit24.lesson04.teach.q_is_there_garden:
    title: 庭があるかたずねる
    gloss: レイラが「庭はありますか」とたずねています
    note: '*Is there...?* で、何かがあるかどうかをたずねます。'
  en.a1.unit24.lesson04.teach.a_no_but_balcony:
    title: ダニエルの答え
    gloss: ダニエルが「いいえ、ありません。でも小さなベランダがあります」と言っています
    note: ダニエルはまず「いいえ」と答えて、そのあとほかのものを伝えています。
  en.a1.unit24.lesson04.teach.a_living_room_near_kitchen:
    title: ダニエルの最後の答え
    gloss: ダニエルが「一番好きな部屋はリビングです。台所の近くなので、そこで夕食を食べるのが楽です」と言っています
    note: ダニエルは、一番好きな部屋とその理由を伝えています。
