teaching:
  en.a1.unit63.lesson01.teach.help:
    title: help
    gloss: 手伝う、助ける / 助け
    note: '*help* は、動詞の「手伝う、助ける」にも、名詞の「助け」にもなります。「私を手伝う」は *help me* と言い、*me* の前に *to* は入りません。'
    example_gloss: 手伝ってもらえますか。
  en.a1.unit63.lesson01.teach.carry:
    title: carry
    gloss: 運ぶ
    note: '*carry* は、何かを持って、ある場所から別の場所へ移すという意味です。'
    example_gloss: 私がそれを運べます。
  en.a1.unit63.lesson01.teach.heavy:
    title: heavy
    gloss: 重い
    note: '*heavy* は「重い」という意味です(重さについて)。'
    example_gloss: これは重いです。
  en.a1.unit63.lesson01.teach.bag:
    title: bag
    gloss: かばん、袋
    note: '*bag* は「かばん」という意味で、「袋」の意味でも使います。'
    example_gloss: このかばんは重いです。
  en.a1.unit63.lesson01.teach.door:
    title: door
    gloss: ドア、扉
    note: '*door* は「ドア」という意味です。'
    example_gloss: ドアを開けてください。
  en.a1.unit63.lesson01.teach.shelf:
    title: shelf
    gloss: 棚
    note: '*shelf* は「棚」という意味で、壁や戸棚にある、物をのせる板をさします。複数形は *shelves* です。'
    example_gloss: それを棚に置いてください。
  en.a1.unit63.lesson02.teach.can_you_help:
    title: Can you help me?
    gloss: 手伝ってもらえますか。
    note: '*Can you...?* は、助けをたのむときの、ふつうでわかりやすい言い方です。'
  en.a1.unit63.lesson02.teach.bag_heavy:
    title: This bag is heavy.
    gloss: このかばんは重いです。
    note: '*this bag* は、自分の近くにあるかばんをさすときに使います。'
  en.a1.unit63.lesson02.teach.open_door:
    title: Could you open the door?
    gloss: ドアを開けていただけますか。
    note: '*Could you...?* は *Can you...?* よりも丁寧に聞こえます。日本語の「〜していただけますか」にあたります。'
  en.a1.unit63.lesson02.teach.i_can_help:
    title: I can help.
    gloss: 私が手伝えます。
    note: この文は、手助けを申し出る言い方です。
  en.a1.unit63.lesson02.teach.thank_you_help:
    title: Thank you for your help.
    gloss: 手伝ってくれてありがとう。
    note: '*Thank you for...* では、お礼の理由を *for* で表します。日本語の「〜をありがとう」にあたります。'
  en.a1.unit63.lesson02.teach.put_on_shelf:
    title: Put it on the shelf.
    gloss: それを棚に置いてください。
    note: '*put it on...* は、何かを何かの上に置くという意味です。英語では、日本語のように「置く」「立てる」「載せる」などを使い分けず、どれも *put* で言えます。'
  en.a1.unit63.lesson03.teach.dialogue_line1:
    title: レイラが助けをたのむ
    gloss: レイラが「こんにちは、ダニエル。手伝ってもらえますか」と言っています
    note: '*Can you help me?* は、助けをたのむときの基本の文です。'
  en.a1.unit63.lesson03.teach.dialogue_line2:
    title: ダニエルが何が必要かたずねる
    gloss: ダニエルが「もちろん。何が必要ですか」と言っています
    note: '*Of course* は「もちろん」という意味です。'
  en.a1.unit63.lesson03.teach.dialogue_line3:
    title: かばんが重い
    gloss: レイラが「このかばんは重いです」と言っています
    note: '*heavy* は、なぜ助けが必要なのかを説明しています。'
  en.a1.unit63.lesson03.teach.dialogue_line4:
    title: ダニエルがかばんを運べる
    gloss: ダニエルが「私が運べます」と言っています
    note: '*carry it* の *it* はかばんをさしています。英語では、ものを *it* と言います。人のように *he* や *she* とは言いません。'
  en.a1.unit63.lesson03.teach.dialogue_line5:
    title: レイラがドアをたのむ
    gloss: レイラが「ドアも開けていただけますか」と言っています
    note: '*Could you...?* で、お願いが丁寧になります。'
  en.a1.unit63.lesson03.teach.dialogue_line6:
    title: ダニエルが棚についてたずねる
    gloss: ダニエルが「はい。かばんを棚に置いてもいいですか」と言っています
    note: '*Can I ...?* で、ダニエルはかばんを棚に置くことを申し出ています。'
  en.a1.unit63.lesson03.teach.dialogue_line7:
    title: レイラがダニエルにお礼を言う
    gloss: レイラが「はい、お願いします。手伝ってくれてありがとう」と言っています
    note: '*Thank you for your help* は、お礼の決まった言い方です。'
  en.a1.unit63.lesson03.teach.dialogue_line8:
    title: ダニエルが答える
    gloss: ダニエルが「どういたしまして」と言っています
    note: '*No problem* は、短くて親しみのある答えです。'
  en.a1.unit63.lesson04.teach.help_note:
    title: 手助けのメモ
    gloss: 手助けのメモ:青いかばんは重いです。ドアの近くの棚に置いてください。
    note: このメモには、どのかばんなのかと、どこに置くのかが書いてあります。
  en.a1.unit63.lesson04.teach.reading_passage:
    title: 読み物:親切な隣人
    gloss: 親切な隣人:レイラは重い青いかばんを持っていました。ドアのそばにダニエルがいるのを見て、助けをたのみました。ダニエルはかばんを中に運びました。レイラは、ドアも開けてほしいとたのみました。そのあと、ダニエルはかばんをドアの近くの棚に置きました。レイラは、ダニエルに手伝ってくれたお礼を言いました。ダニエルは「どういたしまして」と言いました。あとで、レイラは短いメモを書きました:青いかばんは棚にあります。
    note: '*carried* は *carry* の過去形です。'
