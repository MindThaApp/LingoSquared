answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's "Vă rog" (formal, sourced) and "Te rog" (informal, freshly authored) are register-sensitive parallels, matching unit02's ai/aveți and unit05's ai frați/aveți frați pattern -- accept either register for a general "please" unless an exercise explicitly names one. Ana and Mihai's closing café dialogue keeps their existing polite register with each other (both use "vă rog," not "te rog").
course:
  title: Rumänisch A1
  description: Essen und Getränke auf Rumänisch bestellen – Kaffee, Tee, Brot und mehr – mit der zentralen Bestellwendung „Aș dori ...“ (Ich hätte gern ...) und dem Höflichkeitspaar vă rog/te rog. Ana und Mihai treffen sich weiter in einem Café.
units:
  ro.a1.unit06.food:
    title: Essen und Getränke
lessons:
  ro.a1.unit06.lesson01.bauturi:
    title: Getränke
  ro.a1.unit06.lesson02.va_rog_si_mancare:
    title: Bitte und Essen
  ro.a1.unit06.lesson03.la_cafenea:
    title: Im Café
teaching:
  ro.a1.unit06.lesson01.teach.reminder_un_o_si:
    title: 'Rückblick: un, o, și'
    gloss: un/o (ein/eine) · și (und)
    note: Alle drei sind schon in früheren Lektionen vorgekommen (*și* in Lektion 1, *o* in Lektion 2, *un* in Lektion 4) – hier kehren sie zurück, um über Essen und Getränke zu sprechen.
  ro.a1.unit06.lesson01.teach.as_dori:
    title: Ich möchte gern ...
    gloss: Aș dori ... (Ich hätte gern ...)
    note: Die höfliche Alltagswendung, um auf Rumänisch etwas zu bestellen – eine feste Konditionalform, die sich nach dem Folgenden nicht richtet.
  ro.a1.unit06.lesson01.teach.apa:
    title: Wasser
    gloss: apă (Wasser)
    note: Ein feminines Nomen – steht ohne Artikel, wenn die Menge nicht genannt wird, wie auch im Deutschen bei „Wasser“.
    example_gloss: Ich hätte gern Wasser.
  ro.a1.unit06.lesson01.teach.cafea:
    title: Kaffee
    gloss: cafea (Kaffee)
    note: Feminin – verbindet sich mit *o* („eine“) wie jedes andere feminine Nomen.
    example_gloss: Ich hätte gern einen Kaffee.
  ro.a1.unit06.lesson01.teach.ceai:
    title: Tee
    gloss: ceai (Tee)
    note: Verbindet sich mit *un* („ein“), nicht mit *o* – ceai ist ein maskulines/neutrales Nomen.
    example_gloss: Ich hätte gern einen Tee.
  ro.a1.unit06.lesson01.teach.suc:
    title: Saft
    gloss: suc (Saft)
    note: Steht ebenfalls mit *un*, nach demselben Muster wie ceai.
    example_gloss: Ich hätte gern einen Saft.
  ro.a1.unit06.lesson01.teach.lapte:
    title: Milch
    gloss: lapte (Milch)
    note: Wie apă meist ohne Artikel, wenn die Menge nicht genannt wird.
    example_gloss: Ich hätte gern Milch.
  ro.a1.unit06.lesson01.teach.mi_e_sete:
    title: Ich habe Durst
    gloss: Mi-e sete (Ich habe Durst)
    note: Eine feste Redewendung – wörtlich eher „mir ist Durst“ als „ich bin durstig“.
  ro.a1.unit06.lesson01.teach.as_dori_o_cafea:
    title: Ich möchte gern einen Kaffee
    gloss: Ich hätte gern einen Kaffee.
    note: Verbindet die Bestellwendung und ein feminines Getränk zu einem vollständigen Satz.
  ro.a1.unit06.lesson02.teach.reminder_multumesc_bine_da_nu:
    title: 'Rückblick: mulțumesc, bine, da, nu'
    gloss: mulțumesc (danke) · bine (gut) · da (ja) · nu (nein)
    note: '*Mulțumesc* und *bine* kamen zuerst in den Begrüßungen von Lektion 1 vor, *da* und *nu* in Lektion 3/Lektion 5 – hier kehren sie rund um Essen und Höflichkeit zurück.'
  ro.a1.unit06.lesson02.teach.mi_e_foame:
    title: Ich habe Hunger
    gloss: Mi-e foame (Ich habe Hunger)
    note: Dasselbe feste Muster wie *Mi-e sete*, nur mit foame (Hunger) statt sete (Durst).
  ro.a1.unit06.lesson02.teach.paine:
    title: Brot
    gloss: pâine (Brot)
    note: Wird meist ohne Artikel gesagt, wie auch im Deutschen oft „Brot“.
    example_gloss: Ich habe Hunger. Ich hätte gern Brot.
  ro.a1.unit06.lesson02.teach.mancare:
    title: Essen
    gloss: mâncare (Essen)
    note: Das allgemeine Wort für „Essen“, nicht für ein bestimmtes Gericht.
    example_gloss: Ich hätte gern etwas zu essen.
  ro.a1.unit06.lesson02.teach.carne:
    title: Fleisch
    gloss: carne (Fleisch)
    note: Das allgemeine Wort für „Fleisch“ – bestimmte Sorten (carne de vită, carne de porc) fügen danach die Art hinzu.
    example_gloss: Ich hätte gern Fleisch.
  ro.a1.unit06.lesson02.teach.pui:
    title: Hähnchen
    gloss: pui (Hähnchen)
    note: Das spezielle Wort für Hähnchen (als Essen), unterschieden vom allgemeinen carne.
    example_gloss: Ich hätte gern Hähnchen.
  ro.a1.unit06.lesson02.teach.fructe:
    title: Das Obst
    gloss: fructe (Obst)
    note: Die gebräuchliche Pluralform; im Rumänischen steht hier der Plural, wo das Deutsche „Obst“ als Sammelbegriff verwendet.
    example_gloss: Ich hätte gern Obst.
  ro.a1.unit06.lesson02.teach.va_rog:
    title: Bitte (formell)
    gloss: vă rog (bitte, formell)
    note: Die höfliche Art, „bitte“ zu sagen – passt zum Sie-Register (dumneavoastră) aus Lektion 1/Lektion 2.
    example_gloss: Einen Kaffee, bitte.
  ro.a1.unit06.lesson02.teach.te_rog:
    title: Bitte (informell)
    gloss: te rog (bitte, informell)
    note: Die Alltagsform für Freunde und Personen, die Sie mit *tu* ansprechen – passt zum tu-Register aus Lektion 1.
    example_gloss: Einen Tee, bitte.
  ro.a1.unit06.lesson03.teach.reminder_buna_ziua_bine_la_revedere:
    title: 'Rückblick: bună, ziua, bine, la revedere, Ana, Mihai'
    gloss: bună ziua (guten Tag / hallo) · bine (gut) · la revedere (auf Wiedersehen) · Ana, Mihai (Namen)
    note: Alles schon in den Dialogen von Lektion 1 und Lektion 5 eingeführt – hier treffen sich Ana und Mihai wieder, diesmal in einem Café.
  ro.a1.unit06.lesson03.teach.line01:
    title: Begrüßen und sagen, dass man Hunger hat
    gloss: Ana begrüßt Mihai und sagt, dass sie Hunger hat.
    note: Verwendet *Mi-e foame* aus dieser Lektion gleich in der Begrüßung.
  ro.a1.unit06.lesson03.teach.line02:
    title: Essen bestellen
    gloss: Mihai sagt, dass er gern Brot und Hähnchen hätte.
    note: Nutzt die Vokabeln pâine/pui dieser Lektion mit der Wendung Aș dori.
  ro.a1.unit06.lesson03.teach.line03:
    title: Höflich ein Getränk bestellen
    gloss: Ana sagt, dass sie gern einen Kaffee hätte, bitte.
    note: Verbindet Aș dori, cafea und vă rog – drei Dinge, die in dieser Lektion schon einzeln vorkamen.
  ro.a1.unit06.lesson03.teach.line04:
    title: Auch ein Getränk bestellen
    gloss: Mihai sagt, dass er gern einen Tee hätte, bitte.
    note: Dasselbe Muster wie bei Anas Satz, nur mit ceai statt cafea.
  ro.a1.unit06.lesson03.teach.line05:
    title: Danken und sich verabschieden
    gloss: Ana bedankt sich bei Mihai und verabschiedet sich.
    note: '*Mulțumesc* ist hier ein einfaches Dankeschön zum Abschluss, dasselbe Wort wie in *Bine, mulțumesc.* aus Lektion 1.'
  ro.a1.unit06.lesson03.teach.line06:
    title: Die Begegnung beenden
    gloss: Mihai verabschiedet sich ebenfalls und nennt Anas Namen.
    note: Dasselbe freundliche Schlussmuster, mit dem auch die Dialoge in Lektion 1 und Lektion 5 endeten.
