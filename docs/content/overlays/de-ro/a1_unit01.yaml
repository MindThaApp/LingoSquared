answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Rumänisch A1
  description: Sie lernen die gängigen rumänischen Begrüßungen und das Vorstellen beim ersten Treffen. Besonders im Fokus steht der Unterschied zwischen dem vertrauten tu und dem höflichen dumneavoastră (ähnlich wie du und Sie) sowie die zwei alltäglichen Arten, den eigenen Namen zu nennen (mă numesc.../mă cheamă...).
units:
  ro.a1.unit01.greetings:
    title: Begrüßungen und erste Begegnungen
lessons:
  ro.a1.unit01.lesson01.tu_dumneavoastra_greetings:
    title: 'Begrüßung: tu und dumneavoastră'
  ro.a1.unit01.lesson02.names_introductions:
    title: Wie heißen Sie?
  ro.a1.unit01.lesson03.street_meeting:
    title: Eine Begegnung auf der Straße
teaching:
  ro.a1.unit01.lesson01.teach.buna:
    title: Alltägliche Begrüßung
    gloss: hallo
    note: Bună ist die alltägliche, leicht informelle Begrüßung. Sie passt bei Freunden, Gleichaltrigen und in den meisten lockeren Begegnungen tagsüber.
    example_gloss: Hallo, Mihai!
  ro.a1.unit01.lesson01.teach.salut:
    title: Informelle Begrüßung
    gloss: hallo; tschüss
    note: Salut ist informell und wird unter Freunden und Gleichaltrigen verwendet. Man kann damit ein Gespräch eröffnen oder beenden, aber bei einem unbekannten Erwachsenen ist es nicht die sicherste Wahl.
    example_gloss: Hallo, Ana!
  ro.a1.unit01.lesson01.teach.buna_ziua:
    title: Höfliche Begrüßung
    gloss: guten Tag (formell)
    note: Bună ziua ist die sichere, höfliche Begrüßung für unbekannte Erwachsene, Verkäufer oder alle, die Sie mit dumneavoastră ansprechen. Wörtlich heißt es „guter Tag“, wird aber als allgemeiner höflicher Gruß verwendet, nicht nur mittags.
    example_gloss: Guten Tag, Ana!
  ro.a1.unit01.lesson01.teach.la_revedere:
    title: Neutraler Abschied
    gloss: auf Wiedersehen
    note: La revedere passt sowohl in höflichen als auch in informellen Situationen, ähnlich wie „Auf Wiedersehen“ oder „Tschüss“ je nach Situation.
    example_gloss: Guten Tag! Auf Wiedersehen!
  ro.a1.unit01.lesson01.teach.tu:
    title: Informelles „du“ (Singular)
    gloss: du
    note: Wie im Deutschen du und Sie gibt es im Rumänischen zwei Anredeformen. tu richtet sich an einen Freund, ein Kind oder jemanden, mit dem man ausdrücklich per du ist, und hat eigene Verbformen (faci, nicht faceți).
  ro.a1.unit01.lesson01.teach.dumneavoastra:
    title: Höfliches „Sie“ oder „ihr“
    gloss: Sie (höflich); ihr (Plural)
    note: Dumneavoastră ist die sichere Wahl für eine unbekannte erwachsene Person und kann auch eine Gruppe höflich anreden – ähnlich wie Sie im Deutschen. Es kommt von domnia voastră („Ihre Herrschaft“) und verlangt die Pluralformen des Verbs (faceți, numiți), auch wenn nur eine Person gemeint ist.
  ro.a1.unit01.lesson01.teach.ce_mai_faceti:
    title: Förmlich nach dem Befinden fragen
    gloss: Wie geht es Ihnen?
    note: Faceți ist die dumneavoastră-Form von a face („tun, machen“). Es ist eine feste höfliche Frage, keine wörtliche Erkundigung danach, was jemand gerade tut.
  ro.a1.unit01.lesson01.teach.ce_mai_faci:
    title: Vertraut nach dem Befinden fragen
    gloss: Wie geht es Ihnen?
    note: Faci ist die tu-Form von a face. Zwischen der höflichen und der informellen Version dieser Frage ändert sich nur die Verbendung – ce mai bleibt in beiden gleich.
  ro.a1.unit01.lesson01.teach.bine_multumesc:
    title: Übliche positive Antwort
    gloss: Gut, danke.
    note: Bine, mulțumesc antwortet auf ce mai faci/faceți in jedem Register – die Antwort selbst bleibt gleich.
    example_gloss: Wie geht es dir? Gut, danke.
  ro.a1.unit01.lesson01.teach.register_choice:
    title: Begrüßung und Beziehung zuordnen
    gloss: Bună ziua mit dumneavoastră; Salut mit tu
    note: Das sind nützliche Grundregeln, keine absoluten Gesetze. Bună ziua kann auch ein formelles Gespräch eröffnen, das dann mit dumneavoastră weitergeht; Salut mit dumneavoastră zu verbinden sendet meist widersprüchliche soziale Signale.
  ro.a1.unit01.lesson02.teach.ma_numesc:
    title: Den eigenen Namen nennen (Standard)
    gloss: Ich heiße Ana.
    note: Mă numesc bedeutet wörtlich „ich nenne mich“ – die neutrale Art, überall seinen Namen zu nennen, vergleichbar mit „Ich heiße“.
    example_gloss: Hallo! Ich heiße Ana.
  ro.a1.unit01.lesson02.teach.cum_va_numiti:
    title: Höflich nach dem Namen fragen
    gloss: Wie heißen Sie?
    note: Numiți ist die dumneavoastră-Form von a se numi („heißen“). Vă ist das zu dumneavoastră passende Reflexivpronomen und hier erforderlich; im Deutschen steht in „Wie heißen Sie?“ dagegen kein Reflexivpronomen.
  ro.a1.unit01.lesson02.teach.ma_cheama:
    title: Den eigenen Namen nennen (umgangssprachlich)
    gloss: Ich heiße Mihai.
    note: Mă cheamă ist die umgangssprachlichere Art, den Namen zu nennen, wörtlich „es ruft mich“. Mă numesc und mă cheamă sind beide richtig und üblich; mă cheamă klingt etwas lockerer.
    example_gloss: Hallo! Ich heiße Mihai.
  ro.a1.unit01.lesson02.teach.cum_te_cheama:
    title: Vertraut nach dem Namen fragen
    gloss: Wie heißen Sie?
    note: Te ist das zu tu passende Reflexivpronomen. So fragen sich Freunde und Gleichaltrige im Alltag nach dem Namen.
  ro.a1.unit01.lesson02.teach.imi_pare_bine:
    title: Jemanden kennenlernen
    gloss: Freut mich!
    note: Îmi pare bine bedeutet wörtlich „es scheint mir gut“ – ein idiomatischer fester Ausdruck, keine Wort-für-Wort-Entsprechung von „schön“. Er ändert sich nicht, egal ob eine Frau oder ein Mann spricht.
    example_gloss: Ich heiße Mihai. Freut mich!
  ro.a1.unit01.lesson02.teach.si_mie_imi_pare_bine:
    title: Die Freude erwidern
    gloss: Freut mich auch!
    note: Și mie stellt „auch“ bzw. „ebenso“ vor denselben festen Ausdruck, mit dem das Gespräch eröffnet wurde.
  ro.a1.unit01.lesson02.teach.si_dumneavoastra:
    title: Eine höfliche Frage zurückgeben
    gloss: Und Sie?
    note: Verwenden Sie dumneavoastră, um höflich zu bleiben oder um eine Gruppe anzusprechen.
  ro.a1.unit01.lesson02.teach.si_tu:
    title: Eine informelle Frage zurückgeben
    gloss: Und Sie?
    note: Verwenden Sie tu nach și, wenn Sie informell mit einem Freund oder Gleichaltrigen sprechen.
  ro.a1.unit01.lesson03.teach.line01:
    title: Die Begegnung eröffnen
    gloss: Ana begrüßt Mihai förmlich und nennt ihren Namen.
    note: Ana beginnt mit dem höflichen bună ziua, passend für jemanden, den sie nicht kennt.
  ro.a1.unit01.lesson03.teach.line02:
    title: Die Begegnung eröffnen, Antwort
    gloss: Mihai erwidert das Gefühl, nennt seinen Namen und fragt, wie es ihr geht.
    note: Mihai bleibt in demselben höflichen Register wie Ana – er fragt ce mai faceți, nicht ce mai faci.
  ro.a1.unit01.lesson03.teach.line03:
    title: Antworten und die Frage zurückgeben
    gloss: Ana sagt, dass es ihr gut geht, und stellt Mihai höflich dieselbe Frage.
    note: Și dumneavoastră hält das Gespräch förmlich, passend zu seinem Beginn.
  ro.a1.unit01.lesson03.teach.line04:
    title: Antworten und verabschieden
    gloss: Mihai sagt, dass es ihm auch gut geht, und verabschiedet sich.
    note: La revedere ist der neutrale Abschiedsgruß und passt sowohl zu einem förmlichen als auch zu einem informellen Gespräch.
  ro.a1.unit01.lesson03.teach.line05:
    title: Die Begegnung beenden
    gloss: Ana erwidert denselben Abschiedsgruß.
    note: La revedere zu wiederholen ist die natürliche Art, einen freundlichen Abschluss zu bestätigen.
