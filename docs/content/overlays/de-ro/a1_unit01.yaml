    - Wie geht es Ihnen?
    accepted_answers:
    - Freut mich!
  ro.a1.unit01.lesson02.exercise01.order_self_intro:
    instruction: Bilden Sie Anas Vorstellung.
    correct_response:
    - Mă
    - numesc
    - Ana
  ro.a1.unit01.lesson02.exercise07.match_introductions:
    instruction: Ordnen Sie jeder Frage nach dem Namen die passende Antwort zu.
    correct_response:
      Cum vă numiți?: Mă numesc Ana.
      Cum te cheamă?: Mă cheamă Mihai.
    pairs:
