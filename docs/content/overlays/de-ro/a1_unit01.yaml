      right: Mă numesc Ana.
    - left: Cum te cheamă?
      right: Mă cheamă Mihai.
  ro.a1.unit01.lesson02.exercise03.informal_name_question:
    instruction: Fragen Sie nach der informellen Begrüßung die andere Person nach ihrem Namen.
    accepted_answers:
    - Cum te cheamă?
    - Cum te cheama?
  ro.a1.unit01.lesson02.exercise04.complete_ma_cheama:
