teaching:
  ro.a1.unit17.lesson01.teach.reminder_este_la_mihai:
    title: 'Wiederholung: este, la, Mihai'
    gloss: este (ist) · la (in, bei) · Mihai (Name)
    note: Este stammt aus Einheit 3, 4 und 8; la aus Einheit 4 (*la ora nouă*, „um neun Uhr“); Mihai ist der Name der Figur, bekannt seit Einheit 1. Diese Einheit nutzt alle drei, um über seinen Beruf zu sprechen.
  ro.a1.unit17.lesson01.teach.reminder_lucrez_lucreaza:
    title: 'Wiederholung: lucrez, lucrează'
    gloss: lucrez (ich arbeite) · lucrează (er/sie arbeitet)
    note: Beide stammen aus dem Tagesablauf in Einheit 10 (*Lucrez seara.*). Hier dienen sie dazu, über den Beruf statt über die Tageszeit zu sprechen.
  ro.a1.unit17.lesson01.teach.inginer_vocab:
    title: Ingenieur
    gloss: Inginer (Ingenieur)
    note: Maskulin – in dieser Einheit verwendet nur Mihai es (*Sunt inginer*), daher ist noch keine weibliche Form nötig.
    example_gloss:
    - Mihai ist Ingenieur.
  ro.a1.unit17.lesson01.teach.birou_vocab:
    title: Büro
    gloss: Birou (Büro)
    note: Der Arbeitsort von Mihai, im Anschluss an die bereits bekannte Präposition *la* aus Einheit 4.
    example_gloss:
    - Er arbeitet im Büro.
  ro.a1.unit17.lesson01.teach.mihai_este_inginer_lucreaza_la_birou_phrase:
    title: Mihai ist Ingenieur. Er arbeitet im Büro.
    gloss: Mihai este inginer. Lucrează la birou.
    note: Alle Wörter hier waren schon bekannt oder wurden gerade eingeführt und sind zu zwei neuen Sätzen über Mihais Beruf kombiniert.
  ro.a1.unit17.lesson02.teach.reminder_sunt_unde_ana:
    title: 'Wiederholung: sunt, unde, Ana'
    gloss: sunt (ich bin) · unde (wo) · Ana (Name)
    note: Sunt stammt aus Einheit 16 (*Sunt bolnav*); unde aus Einheit 7 und 8 (*Unde pot să cumpăr...?*, *Unde este...?*); Ana ist der Name der Figur, bekannt seit Einheit 1. Diese Einheit nutzt alle drei, um über Anas Beruf zu sprechen.
  ro.a1.unit17.lesson02.teach.profesoara_vocab:
    title: Lehrerin
    gloss: Profesoară (Lehrerin)
    note: Feminin – in dieser Einheit verwendet nur Ana es (*Sunt profesoară*), daher ist noch keine maskuline Form nötig.
    example_gloss:
    - Ich bin Lehrerin.
  ro.a1.unit17.lesson02.teach.scoala_vocab:
    title: Schule
    gloss: Școală (Schule)
    note: Der Arbeitsort von Ana, mit *la* wie in *la birou*.
    example_gloss:
    - Ich arbeite in der Schule.
  ro.a1.unit17.lesson02.teach.sunt_profesoara_lucrez_la_scoala_phrase:
    title: Ich bin Lehrerin. Ich arbeite in der Schule.
    gloss: Ich bin Lehrerin. Ich arbeite in der Schule.
    note: 'Anas Aussage über ihren Beruf: Sie verbindet die zwei neuen Wörter dieser Lektion mit dem schon bekannten *sunt* aus Lektion 16.'
  ro.a1.unit17.lesson02.teach.unde_lucrati_phrase:
    title: Wo arbeiten Sie?
    gloss: Wo arbeiten Sie? (formell)
    note: '*Lucrați* ist die höfliche Form „arbeiten Sie“ mit derselben Endung -ați/-eți wie in *aveți*/*faceți*. So können Sie jeden nach seinem Beruf fragen.'
  ro.a1.unit17.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Wiederholung: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (Hallo) · Ce mai faceți? (Wie geht es Ihnen?) · Bine, mulțumesc (Gut, danke)
    note: Alles aus der Begrüßung in Lektion 1; hier eröffnet sie den Dialog dieser Lektion.
  ro.a1.unit17.lesson03.teach.reminder_si_dumneavoastra_la_revedere:
    title: 'Wiederholung: Și dumneavoastră?, La revedere'
    gloss: Și dumneavoastră? (Und Ihnen/Und Sie?) · La revedere (Auf Wiedersehen)
    note: Beides aus Lektion 1; hier als natürliche Rückfrage und als Abschiedssatz verwendet.
  ro.a1.unit17.lesson03.teach.line01:
    title: Begrüßen und fragen, wie es geht
    gloss: Ana begrüßt Mihai und fragt, wie es ihm geht.
    note: Hier kommt die Begrüßung *Ce mai faceți?* aus Lektion 1 wieder vor.
  ro.a1.unit17.lesson03.teach.line02:
    title: Antworten und fragen, wo sie arbeitet
    gloss: Mihai antwortet und fragt dann Ana, wo sie arbeitet.
    note: Verbindet *Bine, mulțumesc* aus Lektion 1 mit *Unde lucrați?* aus dieser Lektion.
  ro.a1.unit17.lesson03.teach.line03:
    title: Beruf und Arbeitsplatz nennen, dann zurückfragen
    gloss: Ana sagt, dass sie als Lehrerin in einer Schule arbeitet, und stellt Mihai dieselbe Frage.
    note: Verbindet die Wendung aus der zweiten Lektion dieser Einheit mit *Și dumneavoastră?* aus Lektion 1.
  ro.a1.unit17.lesson03.teach.line04:
    title: Beruf und Arbeitsplatz nennen
    gloss: Mihai sagt, dass er als Ingenieur in einem Büro arbeitet.
    note: Greift die Wendung aus der ersten Lektion dieser Einheit fast wörtlich wieder auf.
  ro.a1.unit17.lesson03.teach.line05:
    title: Das Gespräch beenden
    gloss: Ana verabschiedet sich.
    note: Dasselbe Abschlussmuster, mit dem schon die Dialoge der früheren Lektionen endeten.
  ro.a1.unit17.lesson03.teach.line06:
    title: Sich verabschieden
    gloss: Mihai verabschiedet sich.
    note: Dasselbe Abschlussmuster, mit dem schon die Dialoge der früheren Lektionen endeten.
