answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02/03''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: Rumänisch A1
  description: Wie man im Rumänischen nach der Uhrzeit fragt und sie nennt – volle Stunde, halb, Viertel nach und Viertel vor, Tageszeiten und die Frage, wann etwas beginnt. Ana und Mihai verabreden, wann ihr Rumänischkurs anfängt.
units:
  ro.a1.unit04.time:
    title: Die Uhrzeit sagen
lessons:
  ro.a1.unit04.lesson01.ora_fixa_si_jumatate:
    title: Volle Stunde und halb
  ro.a1.unit04.lesson02.sferturi_si_intrebari:
    title: Ein Viertel und wie wir nach der Uhrzeit fragen
  ro.a1.unit04.lesson03.cand_incepe_cursul:
    title: Wann beginnt der Kurs?
teaching:
  ro.a1.unit04.lesson01.teach.este:
    title: 'Wiederholung: este'
    gloss: ist
    note: '*Este* kam schon in Unit 2 und Unit 3 vor. Es bleibt immer dasselbe Wort, ob Sie eine Zahl, einen Wochentag, ein Datum oder jetzt eine Uhrzeit nennen.'
  ro.a1.unit04.lesson01.teach.ora:
    title: Die Stunde
    gloss: die Stunde / die Uhrzeit
    note: Ein feminines Substantiv – *ora* steht direkt vor der Zahl, wenn man eine Uhrzeit nennt, z. B. *ora unu* (ein Uhr).
    example_gloss: Es ist ein Uhr.
  ro.a1.unit04.lesson01.teach.ora_unu:
    title: Ein Uhr
    gloss: ein Uhr
    note: Wörtlich „die Stunde eins“ – erst kommt ora, dann die Zahl.
  ro.a1.unit04.lesson01.teach.ora_doua:
    title: Zwei Uhr
    gloss: zwei Uhr
    note: Hier steht die Zahl in der weiblichen Form *două*, passend zum femininen *ora* – das vollständige Muster zeigt die nächste Karte.
  ro.a1.unit04.lesson01.teach.ora_gender_note:
    title: 'Eine echte Unregelmäßigkeit: unu bleibt unu'
    gloss: ora unu (nicht „ora una“) / ora două (nicht „ora doi“)
    note: 'Zahlen mit weiblicher Form nehmen sie meist bei einem femininen Substantiv an (*doi* → *două* bei einem femininen Wort wie *ora*). Bei der Uhrzeit ist *unu* die einzige Ausnahme: Es heißt immer *ora unu*, nie *ora una*, obwohl *ora* feminin ist.'
  ro.a1.unit04.lesson01.teach.ora_trei:
    title: Drei Uhr
    gloss: drei Uhr
    note: Trei ändert sich nach dem Genus gar nicht, anders als unu/una oder doi/două – eine Sorge weniger.
  ro.a1.unit04.lesson01.teach.jumatate:
    title: Halb
    gloss: die Hälfte / halb
    note: 'Wird mit și (und) verwendet, um „halb“ zu sagen: X și jumătate – wörtlich „X und eine Hälfte“, also eine halbe Stunde nach X.'
    example_gloss: Halb zwei.
  ro.a1.unit04.lesson01.teach.ora_unu_jumatate:
    title: Halb zwei
    gloss: Es ist halb zwei.
    note: 'Wörtlich „Es ist eins und eine Hälfte“ – Achtung: Anders als im Deutschen (halb zwei = halb auf zwei zu) zählt das Rumänische von der vollen Stunde aus weiter.'
  ro.a1.unit04.lesson01.teach.cat_e_ora:
    title: Nach der Uhrzeit fragen
    gloss: Wie spät ist es?
    note: Die übliche Art, nach der Uhrzeit zu fragen – cât (wie viel, verwandt mit câți aus Unit 2) + este + ora (die Stunde).
  ro.a1.unit04.lesson02.teach.sfert:
    title: Ein Viertel
    gloss: ein Viertel
    note: Eine Viertelstunde – 15 Minuten. Mit și (und) oder fără (ohne) bildet man „Viertel nach“ und „Viertel vor“.
    example_gloss: Es ist Viertel nach eins.
  ro.a1.unit04.lesson02.teach.sfert_rule:
    title: și und fără mit Viertel oder halb
    gloss: și un sfert = +15 Minuten · fără un sfert = −15 Minuten
    note: '*Și* (und) zählt Minuten zur gerade vergangenen Stunde hinzu; *fără* (ohne) zählt Minuten rückwärts von der kommenden Stunde – genau wie im Deutschen „Viertel nach“ und „Viertel vor“.'
  ro.a1.unit04.lesson02.teach.ora_doua_sfert:
    title: Viertel nach zwei
    gloss: Es ist Viertel nach zwei.
    note: Ora două (2:00) plus și un sfert (+15 Minuten) = 2:15.
  ro.a1.unit04.lesson02.teach.fara:
    title: Ohne / vor
    gloss: ohne
    note: Zählt Minuten rückwärts von der NÄCHSTEN Stunde – dieselbe Rolle wie „vor“ in „Viertel vor drei“.
    example_gloss: Es ist Viertel vor drei.
  ro.a1.unit04.lesson02.teach.ora_trei_fara_sfert:
    title: Viertel vor drei
    gloss: Es ist Viertel vor drei.
    note: Ora trei (3:00) minus fără un sfert (−15 Minuten) = 2:45 – das Rumänische nennt die Stunde, auf die es zuzählt, nicht die gerade vergangene.
  ro.a1.unit04.lesson02.teach.la_ce_ora:
    title: Nach der Uhrzeit fragen
    gloss: Um wie viel Uhr?
    note: La (um) + ce (welche) + oră (eine Stunde, hier unbestimmte Form statt ora) – die übliche Frage, wann etwas stattfindet.
  ro.a1.unit04.lesson02.teach.la_ora_noua:
    title: Sagen, wann etwas stattfindet
    gloss: Um neun Uhr.
    note: La (um) + ora (die Stunde, hier bestimmte Form) + Zahl – das Antwortmuster auf „La ce oră?“.
  ro.a1.unit04.lesson02.teach.tarziu:
    title: Zu spät
    gloss: spät
    note: Ein häufiges, nützliches Wort als Reaktion beim Blick auf die Uhr.
    example_gloss: Es ist spät!
  ro.a1.unit04.lesson03.teach.cand:
    title: 'Wiederholung: când'
    gloss: wann?
    note: Când kam schon in Unit 3 vor, um zu fragen, wann ein Ereignis stattfindet – hier fragt es, wann etwas beginnt.
  ro.a1.unit04.lesson03.teach.zi_parts:
    title: Tageszeiten
    gloss: morgens / nachmittags / abends / nachts
    note: Jedes dieser Wörter ist die bestimmte Form des Substantivs, adverbial gebraucht – das Rumänische sagt „morgens“ ganz einfach so, ohne zusätzliche Präposition.
    example_gloss:
    - Der Kurs ist morgens.
    - Der Kurs ist nachmittags.
    - Mihai arbeitet abends.
    - Ana schläft nachts.
  ro.a1.unit04.lesson03.teach.cursul:
    title: Der Kurs
    gloss: der Kurs
    note: Die bestimmte Form von curs (Kurs) – hier der Rumänischkurs von Ana und Mihai.
    example_gloss: Der Kurs beginnt um neun Uhr.
  ro.a1.unit04.lesson03.teach.incepe:
    title: Beginnt
    gloss: beginnt / fängt an
    note: Die Präsensform für er, sie oder es – jedes Subjekt im Singular außer ich und du, etwa cursul (der Kurs).
    example_gloss: Der Kurs beginnt morgens.
  ro.a1.unit04.lesson03.teach.cand_incepe_cursul:
    title: Fragen, wann der Kurs beginnt
    gloss: Wann beginnt der Kurs?
    note: Verbindet când mit den neuen Wörtern începe und cursul dieser Lektion.
  ro.a1.unit04.lesson03.teach.raspuns_curs:
    title: Sagen, wann der Kurs beginnt
    gloss: Der Kurs beginnt um neun Uhr morgens.
    note: Eine Zeitangabe (dimineața) wird am Ende mit Komma angehängt, so wie in Unit 3 nach dem Wochentag ein Datum folgte.
  ro.a1.unit04.lesson03.teach.line01:
    title: Fragen, wann der Kurs beginnt
    gloss: Ana fragt Mihai, wann der Kurs beginnt.
    note: Eine schlichte, neutrale Frage – este und începe ändern sich nicht, ob man tu oder dumneavoastră sagt.
  ro.a1.unit04.lesson03.teach.line02:
    title: Die Uhrzeit nennen
    gloss: Mihai sagt, der Kurs beginnt um neun Uhr morgens.
    note: 'Mihai verwendet genau das Muster aus dieser Lektion: Uhrzeit und Tageszeit.'
  ro.a1.unit04.lesson03.teach.line03:
    title: Bestätigen und sich verabschieden
    gloss: Ana bedankt sich und verabschiedet sich.
    note: La revedere, schon in Unit 1 gelernt, beendet das Gespräch wie immer.
  ro.a1.unit04.lesson03.teach.line04:
    title: Die Begegnung beenden
    gloss: Mihai verabschiedet sich ebenfalls und nennt Anas Namen.
    note: La revedere mit dem Namen des Gegenübers zu wiederholen ist ein natürlicher, freundlicher Abschluss.
