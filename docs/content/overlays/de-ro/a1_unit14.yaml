answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (mic/mică, mai, decât) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing polite register with each other, matching every earlier unit; no new second-person form is introduced here (unlike unit13's Vă place...?).
course:
  title: Rumänisch A1
  description: 'Vertraute Dinge auf Rumänisch vergleichen: Mare (groß), Mic/Mică (klein) und der Komparativ mit Mai ... decât (mehr/-er ... als), während Ana und Mihai die Größe ihres Kaffees, Tees und Brots vergleichen.'
units:
  ro.a1.unit14.comparisons:
    title: Vergleiche
lessons:
  ro.a1.unit14.lesson01.mare_mic:
    title: Groß, klein
  ro.a1.unit14.lesson02.mai_mare_mai_mica:
    title: Größer, kleiner
  ro.a1.unit14.lesson03.cafeaua_mai_mare:
    title: Was ist größer?
teaching:
  ro.a1.unit14.lesson01.teach.reminder_mare:
    title: 'Wiederholung: mare'
    gloss: mare (groß)
    note: Schon in Einheit 3 ("literă mare", Großbuchstabe) und Einheit 5 ("o familie mare", eine große Familie) vorgekommen – hier bekommt es mit *mic/mică* einen echten Gegenpart.
  ro.a1.unit14.lesson01.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Wiederholung: cafeaua, ceaiul, pâinea, cafea, ceai'
    gloss: cafeaua (der Kaffee) · ceaiul (der Tee) · pâinea (das Brot) · cafea (Kaffee) · ceai (Tee)
    note: Alles aus Einheit 6 und Einheit 13 – in dieser Einheit dienen die bestimmten Formen als die Dinge, deren Größe verglichen wird; die unbestimmten Formen kommen in der Zuordnungsübung dieser Lektion noch einmal vor.
  ro.a1.unit14.lesson01.teach.mic_mica_vocab:
    title: Klein
    gloss: Mic (klein, m./n.) · Mică (klein, f.)
    note: 'Rumänische Adjektive richten sich nach dem Nomen, das sie beschreiben: *ceai* (Tee) steht mit der maskulinen/neutralen Form *mic*, während *cafea* (Kaffee) und *pâine* (Brot) feminin sind und *mică* verlangen. *Mare* (groß) hat im Singular für Maskulinum und Femininum dieselbe Form, deshalb war diese Unterscheidung dort nie nötig.'
    example_gloss:
    - Der Tee ist klein.
    - Der Kaffee ist klein.
  ro.a1.unit14.lesson01.teach.ceaiul_e_mic_phrase:
    title: Der Tee ist klein
    gloss: Ceaiul e mic. (Der Tee ist klein.)
    note: '*Ceaiul* ist ein Neutrum, deshalb steht es mit der maskulinen/neutralen Form *mic*.'
  ro.a1.unit14.lesson01.teach.cafeaua_e_mica_phrase:
    title: Der Kaffee ist klein
    gloss: Cafeaua e mică. (Der Kaffee ist klein.)
    note: '*Cafeaua* ist feminin, deshalb steht es mit der femininen Form *mică*.'
  ro.a1.unit14.lesson01.teach.painea_e_mica_phrase:
    title: Das Brot ist klein
    gloss: Pâinea e mică. (Das Brot ist klein.)
    note: '*Pâinea* ist ebenfalls feminin, deshalb steht es genauso mit *mică* wie *cafeaua*.'
  ro.a1.unit14.lesson02.teach.reminder_mare_mic_mica:
    title: 'Wiederholung: Mare, Mic, Mică'
    gloss: Mare (groß) · Mic (klein, m./n.) · Mică (klein, f.)
    note: Alles aus der ersten Lektion dieser Einheit – hier kommt nun die Steigerungsform dazu.
  ro.a1.unit14.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Wiederholung: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (der Kaffee) · ceaiul (der Tee) · pâinea (das Brot)
    note: Alles aus Einheit 13 – hier noch einmal als die Dinge, die verglichen werden.
  ro.a1.unit14.lesson02.teach.mai_vocab:
    title: Mehr / -er
    gloss: Mai (mehr / -er, Komparativ)
    note: 'Nicht der Monat *mai* (Mai, Einheit 3). Es ist dasselbe kleine Wort wie in „Ce mai faceți?“ (Einheit 1), hat hier aber eine andere Aufgabe als Komparativpartikel: Steht *mai* vor einem Adjektiv, bedeutet es „mehr ___“ oder „___-er“ – so bildet das Rumänische ganz regulär den Komparativ.'
    example_gloss:
    - Der Kaffee ist größer.
  ro.a1.unit14.lesson02.teach.mai_mare_phrase:
    title: Der Kaffee ist größer
    gloss: Cafeaua e mai mare. (Der Kaffee ist größer.)
    note: '*Mai* + Adjektiv – mehr ist nicht nötig, das Adjektiv ändert sich nicht.'
  ro.a1.unit14.lesson02.teach.decat_vocab:
    title: Als
    gloss: Decât (als)
    note: 'Vervollständigt den Vergleich: *mai* + Adjektiv + *decât* + das zweite Ding, mit dem verglichen wird.'
    example_gloss:
    - Der Kaffee ist größer als der Tee.
  ro.a1.unit14.lesson02.teach.mai_mare_decat_phrase:
    title: Der Kaffee ist größer als der Tee
    gloss: Cafeaua e mai mare decât ceaiul. (Der Kaffee ist größer als der Tee.)
    note: 'Das vollständige Muster des Komparativs: [Sache] + e + mai + [Adjektiv] + decât + [zweite Sache].'
  ro.a1.unit14.lesson02.teach.mai_mica_decat_phrase:
    title: Das Brot ist kleiner als der Kaffee
    gloss: Pâinea e mai mică decât cafeaua. (Das Brot ist kleiner als der Kaffee.)
    note: Dasselbe Muster mit *mică*, der femininen Form von „klein“ aus der ersten Lektion dieser Einheit.
  ro.a1.unit14.lesson03.teach.reminder_mai_decat_mare_mic_mica:
    title: 'Wiederholung: Mai, Decât, Mare, Mic, Mică'
    gloss: Mai (mehr/-er) · Decât (als) · Mare (groß) · Mic (klein, m./n.) · Mică (klein, f.)
    note: Alles aus den ersten beiden Lektionen dieser Einheit – hier verwenden Ana und Mihai sie zusammen.
  ro.a1.unit14.lesson03.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Wiederholung: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (der Kaffee) · ceaiul (der Tee) · pâinea (das Brot)
    note: Alles aus Einheit 13 – die drei Dinge, die Ana und Mihai vergleichen.
  ro.a1.unit14.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Wiederholung: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (hallo) · mulțumesc (danke) · la revedere (auf Wiedersehen) · Ana, Mihai (Namen)
    note: Alles schon aus früheren Einheiten bekannt – derselbe freundliche Anfang und Schluss, mit dem jeder Dialog in diesem Kurs gestaltet ist.
  ro.a1.unit14.lesson03.teach.line01:
    title: Begrüßen und nach der Größe fragen
    gloss: Mihai begrüßt Ana und fragt, ob der Kaffee groß oder klein ist.
    note: Mit *mare sau mică* (groß oder klein) aus dieser Einheit wird eine Frage nach der Größe gestellt – nach demselben „X sau Y?“-Muster für eine Auswahl wie *cafea sau ceai?* in Einheit 13.
  ro.a1.unit14.lesson03.teach.line02:
    title: Die Größe beider Getränke beschreiben
    gloss: Ana sagt, der Kaffee sei groß und der Tee klein.
    note: Hier wird einfach eine Tatsache über die Größe genannt, keine Vorliebe – in diesem Dialog sagt niemand, wer welches Getränk mag oder bestellt, nur wie groß jedes ist.
  ro.a1.unit14.lesson03.teach.line03:
    title: Den Vergleich bestätigen lassen
    gloss: Mihai fragt, ob der Kaffee größer ist als der Tee.
    note: Macht aus Anas zwei einzelnen Aussagen einen direkten Vergleich mit *mai mare decât*, dem Kernmuster dieser Einheit.
  ro.a1.unit14.lesson03.teach.line04:
    title: Bestätigen und das Brot ergänzen
    gloss: Ana bestätigt und sagt dann, das Brot sei kleiner als der Kaffee.
    note: Verwendet *mai ... decât* erneut, nun mit der dritten Sache, *pâinea*, und diesmal mit der Form *mai mică*.
  ro.a1.unit14.lesson03.teach.line05:
    title: Bestätigen, danken und sich verabschieden
    gloss: Mihai bestätigt, dass das Brot klein ist, bedankt sich bei Ana und verabschiedet sich.
    note: Derselbe Abschluss, mit dem schon die Dialoge der früheren Einheiten geendet haben.
  ro.a1.unit14.lesson03.teach.line06:
    title: Das Gespräch beenden
    gloss: Ana verabschiedet sich ebenfalls und nennt dabei Mihais Namen.
    note: Derselbe freundliche Abschluss, mit dem schon die Dialoge der früheren Einheiten geendet haben.
