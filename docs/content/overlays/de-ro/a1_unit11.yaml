answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's new words are all register-neutral -- mergem (first-person plural) and nu pot (first-person singular) don't change with tu/dumneavoastră, and atunci/sigur are invariant connective/response words with no person marking. No new second-person forms are introduced. Ana and Mihai's closing dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08/unit09/unit10.
course:
  title: Rumänisch A1
  description: Einen einfachen Plan vorschlagen, annehmen, ablehnen und zeitlich festlegen – mergem (gehen wir / wir gehen), nu pot (ich kann nicht), atunci (dann / in dem Fall) und sigur (klar). Ana und Mihai verabreden sich weiter im Park.
units:
  ro.a1.unit11.plans:
    title: Pläne
lessons:
  ro.a1.unit11.lesson01.mergem_la_cinema:
    title: Gehen wir ins Kino?
  ro.a1.unit11.lesson02.nu_pot_atunci:
    title: Ich kann nicht. Und dann?
  ro.a1.unit11.lesson03.planul_de_duminica:
    title: Der Plan für Sonntag
teaching:
  ro.a1.unit11.lesson01.teach.reminder_da_bine:
    title: 'Wiederholung: da, bine, nu, mulțumesc'
    gloss: da (ja) · bine (gut) · nu (nein) · mulțumesc (danke)
    note: Alles schon seit Lektion 6 bekannt. Hier verbinden sie sich zur Art dieser Lektion, einen Plan anzunehmen, und zur Wiederholungsübung zum Zuordnen.
  ro.a1.unit11.lesson01.teach.mergem_vocab:
    title: Gehen wir / wir gehen
    gloss: Mergem (gehen wir / wir gehen)
    note: Die erste Person Plural von *a merge*; bekannt sind schon *merg* (ich gehe, Lektion 10) und *mergeți* (die höfliche Aufforderung, Lektion 9) – dasselbe Verb, eine andere Person bzw. Zahl. Allein mit steigender Intonation gesprochen, ist es ein natürlicher Vorschlag, etwas gemeinsam zu tun.
    example_gloss:
    - Gehen wir ins Kino?
  ro.a1.unit11.lesson01.teach.cinema_vocab:
    title: Das Kino
    gloss: Cinema (das Kino)
    note: Dem deutschen Wort „Kino“ ähnelt es zwar kaum, aber cinema ist aus „Kinematograph“ / „Cinema“ leicht wiederzuerkennen, etwa aus dem Wort „Cineast“.
    example_gloss:
    - Gehen wir ins Kino?
  ro.a1.unit11.lesson01.teach.mergem_cinema_phrase:
    title: Gehen wir ins Kino?
    gloss: Mergem la cinema? (Gehen wir ins Kino?)
    note: Eine vollständige Einladung – kein zusätzliches „willst du“ nötig; das Fragezeichen macht aus „wir gehen“ einen Vorschlag.
  ro.a1.unit11.lesson01.teach.parc_vocab:
    title: Der Park
    gloss: Parc (der Park)
    note: Ebenfalls ein direktes Lehnwort, wie *cinema*.
    example_gloss:
    - Gehen wir in den Park?
  ro.a1.unit11.lesson01.teach.mergem_parc_phrase:
    title: Gehen wir in den Park?
    gloss: Mergem la parc? (Gehen wir in den Park?)
    note: Dasselbe Einladungsmuster wie bei *Mergem la cinema?*, nur mit einem anderen Ort.
  ro.a1.unit11.lesson01.teach.da_bine_phrase:
    title: Ja, gut!
    gloss: Da, bine! (Ja, gut!)
    note: Eine kurze, natürliche Art, einen Plan anzunehmen – bekannte Wörter in neuer Kombination.
  ro.a1.unit11.lesson02.teach.reminder_nu_pot:
    title: 'Wiederholung: nu, pot'
    gloss: nu (nein / nicht) · pot (ich kann)
    note: 'Nu kennen Sie seit Lektion 6; pot kennen Sie aus *cum pot să ajung* (wie komme ich hin) in Lektion 9. Vor einem Verb bedeutet *nu* „nicht“: *nu pot* heißt „ich kann nicht“ – die Art dieser Lektion, einen Plan abzulehnen.'
  ro.a1.unit11.lesson02.teach.reminder_sambata_duminica:
    title: 'Wiederholung: sâmbătă, duminică'
    gloss: sâmbătă (Samstag) · duminică (Sonntag)
    note: Beide wurden bereits in Lektion 3 bei den Wochentagen eingeführt.
  ro.a1.unit11.lesson02.teach.mergem_parc_sambata_phrase:
    title: Gehen wir am Samstag in den Park?
    gloss: Mergem la parc sâmbătă? (Gehen wir am Samstag in den Park?)
    note: 'Die Einladung aus Lektion 1, jetzt mit Tagesangabe: *Mergem la parc?* wird mit einem Wochentag verbunden.'
  ro.a1.unit11.lesson02.teach.nu_pot_sambata_phrase:
    title: Am Samstag kann ich nicht.
    gloss: Nu pot sâmbătă. (Am Samstag kann ich nicht.)
    note: 'Eine einfache Absage: *nu pot* plus der Tag, an dem man nicht kann.'
  ro.a1.unit11.lesson02.teach.atunci_vocab:
    title: Dann / in dem Fall
    gloss: Atunci (dann / in dem Fall)
    note: 'Nicht zu verwechseln mit *apoi* ("danach" aus Lektion 9, das zwei Handlungen aneinanderreiht): *atunci* schlägt eine Alternative vor oder zieht eine Folgerung. Es ist das natürliche Wort für "Dann vielleicht …?", wenn man einen neuen Termin sucht.'
    example_gloss:
    - Dann am Sonntag?
  ro.a1.unit11.lesson02.teach.atunci_duminica_phrase:
    title: Dann am Sonntag?
    gloss: Atunci, duminică? (Dann am Sonntag?)
    note: 'Ein kurzer Gegenvorschlag nach einer Absage: Es genügt, einen neuen Tag zu nennen, die ganze Einladung muss nicht wiederholt werden.'
  ro.a1.unit11.lesson02.teach.da_bine_duminica_phrase:
    title: Ja, gut! Sonntag.
    gloss: Da, bine! Duminică. (Ja, gut! Sonntag.)
    note: Zusage für den neuen Tag, im selben kurzen Muster wie *Da, bine!* aus Lektion 1.
  ro.a1.unit11.lesson03.teach.reminder_la_ce_ora_la_ora_patru:
    title: 'Wiederholung: la ce oră, la ora, patru'
    gloss: la ce oră (um wie viel Uhr) · la ora (um … Uhr) · patru (vier)
    note: La ce oră/la ora wurden bereits in Lektion 4 eingeführt (nach der Uhrzeit fragen und sie nennen), patru in Lektion 2 bei den Zahlen. Hier werden sie kombiniert, um die Zeit für das Treffen dieser Lektion festzulegen.
  ro.a1.unit11.lesson03.teach.reminder_buna_multumesc_la_revedere_da_ana_mihai:
    title: 'Wiederholung: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (hallo) · mulțumesc (danke) · la revedere (auf Wiedersehen) · da (ja) · Ana, Mihai (Namen)
    note: Alles bereits aus früheren Lektionen bekannt. Hier legen Ana und Mihai die Zeit für ihr Vorhaben fest.
  ro.a1.unit11.lesson03.teach.sigur_vocab:
    title: Klar
    gloss: Sigur (klar)
    note: Eine gängige, eigenständige Art, einen Plan zu bestätigen – ähnlich wie das deutsche "Klar!" oder "Sicher!".
    example_gloss:
    - Klar! Um vier Uhr.
  ro.a1.unit11.lesson03.teach.sigur_phrase:
    title: Klar! Um vier Uhr.
    gloss: Sigur! La ora patru. (Klar! Um vier Uhr.)
    note: Bestätigt in einer kurzen Antwort sowohl den Plan als auch die genaue Uhrzeit.
  ro.a1.unit11.lesson03.teach.line01:
    title: Begrüßen und den Park vorschlagen
    gloss: Ana begrüßt Mihai und fragt, ob sie am Sonntag in den Park gehen.
    note: Verbindet die Einladung *Mergem la parc?* aus dieser Lektion mit *duminică*.
  ro.a1.unit11.lesson03.teach.line02:
    title: Zusagen und nach der Uhrzeit fragen
    gloss: Mihai sagt zu und fragt, um wie viel Uhr.
    note: Greift die Frage *La ce oră?* aus Lektion 4 wieder auf.
  ro.a1.unit11.lesson03.teach.line03:
    title: Eine Uhrzeit vorschlagen
    gloss: Ana schlägt vier Uhr vor.
    note: Eine kurze Frage mit dem Muster *la ora* aus Lektion 4 und dem neuen *patru* aus dieser Lektion.
  ro.a1.unit11.lesson03.teach.line04:
    title: Bestätigen und danken
    gloss: Mihai bestätigt mit "Klar!" und bedankt sich bei Ana.
    note: Verbindet das neue *sigur* mit dem schon bekannten *mulțumesc*.
  ro.a1.unit11.lesson03.teach.line05:
    title: Sich verabschieden
    gloss: Ana verabschiedet sich.
    note: Derselbe Abschluss, mit dem schon die Dialoge aller früheren Lektionen geendet haben.
  ro.a1.unit11.lesson03.teach.line06:
    title: Das Gespräch beenden
    gloss: Mihai verabschiedet sich ebenfalls und nennt dabei Anas Namen.
    note: Derselbe freundliche Abschluss, mit dem schon die Dialoge aller früheren Lektionen geendet haben.
