answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit introduces the formal Vă place...? question (dative vă, matching Mihai's own established faceți/aveți-style formal verb endings) alongside first-person Îmi place/Nu-mi place/Prefer, which are person-invariant and carry no register distinction of their own. Ana and Mihai's dialogue keeps their existing polite register with each other, matching every earlier unit.
course:
  title: Rumänisch A1
  description: Vorlieben, Abneigungen und Präferenzen auf Rumänisch ausdrücken – Îmi place (Ich mag), Nu-mi place (Ich mag nicht), Vă place...? (Mögen Sie...?), Prefer (Ich bevorzuge) und Sau (oder) – während Ana und Mihai die Frage „Kaffee oder Tee?“ klären.
