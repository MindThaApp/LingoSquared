teaching:
  ro.a1.unit13.lesson01.teach.reminder_cafea_ceai_paine:
    title: 'Wiederholung: cafea, ceai, pâine'
    gloss: cafea (Kaffee) · ceai (Tee) · pâine (Brot)
    note: Alle schon aus Lektion 6 bekannt – hier verbinden sie sich mit der neuen Grammatik dieser Lektion zum Mögen und Nicht-Mögen.
  ro.a1.unit13.lesson01.teach.imi_place_vocab:
    title: ich mag
    gloss: Îmi place (Ich mag)
    note: Wörtlich „mir gefällt“ – *îmi* (mir) plus das unveränderliche *place* (gefällt). Um allgemein zu sagen, dass man etwas mag, verwendet das Rumänische die bestimmte Form des Nomens (*cafeaua*, nicht das schon bekannte *cafea* aus Lektion 6). Das ist ähnlich wie im Deutschen, wo man „Ich mag den Kaffee“ ebenfalls mit Artikel sagen kann, im Rumänischen ist die bestimmte Form hier aber der Normalfall.
    example_gloss:
    - Ich mag Kaffee.
  ro.a1.unit13.lesson01.teach.imi_place_cafeaua_phrase:
    title: Ich mag Kaffee
    gloss: Îmi place cafeaua. (Ich mag Kaffee.)
    note: 'Das vollständige Muster: Îmi place + das Nomen mit bestimmtem Artikel.'
  ro.a1.unit13.lesson01.teach.imi_place_ceaiul_phrase:
    title: Ich mag Tee
    gloss: Îmi place ceaiul. (Ich mag Tee.)
    note: Dasselbe Muster wie *Îmi place cafeaua*, nur mit einem anderen Getränk – *ceaiul* ist die bestimmte Form des schon bekannten *ceai* aus Lektion 6.
  ro.a1.unit13.lesson01.teach.numi_place_vocab:
    title: ich mag nicht
    gloss: Nu-mi place (Ich mag nicht)
    note: Die Verneinung von *Îmi place* – im Alltag wird *nu îmi* zu *nu-mi* zusammengezogen. Diese Kurzform mit Bindestrich ist also die natürliche Weise, es zu sagen, und nicht bloß eine Abkürzung.
    example_gloss:
    - Ich mag kein Brot.
  ro.a1.unit13.lesson01.teach.numi_place_painea_phrase:
    title: Ich mag kein Brot
    gloss: Nu-mi place pâinea. (Ich mag kein Brot.)
    note: '*Pâinea* ist die bestimmte Form des schon bekannten *pâine* aus Lektion 6, nach demselben Muster wie *cafeaua*/*ceaiul*.'
  ro.a1.unit13.lesson02.teach.reminder_imi_place_numi_place:
    title: 'Wiederholung: Îmi place, Nu-mi place'
    gloss: Îmi place (Ich mag) · Nu-mi place (Ich mag nicht)
    note: Beide stammen aus der ersten Lektion dieser Einheit – hier kommt dazu eine Frageform.
  ro.a1.unit13.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Wiederholung: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (der Kaffee) · ceaiul (der Tee) · pâinea (das Brot)
    note: Alle aus der ersten Lektion dieser Einheit – hier in der Frage- und Vorliebenform wiederverwendet.
  ro.a1.unit13.lesson02.teach.va_place_vocab:
    title: Mögen Sie...?
    gloss: Vă place...? (Mögen Sie...?)
    note: Die höfliche Frageform zu *Îmi place* – *vă* (Ihnen, höflich) ersetzt *îmi* (mir), im selben *dumneavoastră*-Register wie schon bei *aveți*/*faceți*. Danach folgt ein Nomen mit bestimmtem Artikel, oder man verwendet die Wendung allein, wenn das Thema klar ist.
    example_gloss:
    - Mögen Sie Kaffee?
  ro.a1.unit13.lesson02.teach.va_place_cafeaua_phrase:
    title: Mögen Sie Kaffee?
    gloss: Vă place cafeaua? (Mögen Sie Kaffee?)
    note: 'Das vollständige Muster: Vă place + das Nomen mit bestimmtem Artikel, mit steigender Frageintonation.'
  ro.a1.unit13.lesson02.teach.prefer_vocab:
    title: ich bevorzuge
    gloss: Prefer (Ich bevorzuge)
    note: 'Ein leicht erkennbares Verwandtes des deutschen „präferieren“ – keine „mir gefällt“-Konstruktion nötig, *prefer* funktioniert wie ein gewöhnliches Verb: *Prefer* + das Bevorzugte, wie bei *Îmi place* in der bestimmten Form.'
    example_gloss:
    - Ich bevorzuge Kaffee.
  ro.a1.unit13.lesson02.teach.prefer_cafeaua_phrase:
    title: Ich bevorzuge Kaffee
    gloss: Prefer cafeaua. (Ich bevorzuge Kaffee.)
    note: Eine stärkere Aussage als *Îmi place cafeaua* – nützlich, wenn man zwischen zwei Dingen wählt.
  ro.a1.unit13.lesson02.teach.sau_vocab:
    title: oder
    gloss: Sau (oder)
    note: Verbindet zwei Möglichkeiten, wenn man etwas anbietet oder nach einer Wahl fragt – anders als *și* (und) aus Lektion 10/12, das zwei Dinge verbindet, die beide zutreffen.
    example_gloss:
    - Kaffee oder Tee?
  ro.a1.unit13.lesson02.teach.cafea_sau_ceai_phrase:
    title: Kaffee oder Tee?
    gloss: Cafea sau ceai? (Kaffee oder Tee?)
    note: Eine kurze, natürliche Art, eine Wahl anzubieten – hier stehen die einfachen Formen ohne Artikel (*cafea*, *ceai*), nicht die bestimmten *cafeaua*/*ceaiul*, da es ein offenes Angebot und keine allgemeine Aussage über Kaffee/Tee ist.
  ro.a1.unit13.lesson03.teach.reminder_va_place_prefer_sau:
    title: 'Wiederholung: Vă place, Prefer, Sau'
    gloss: Vă place? (Mögen Sie?) · Prefer (Ich bevorzuge) · Sau (oder)
    note: Alle aus der zweiten Lektion dieser Einheit – hier verwenden Ana und Mihai sie zusammen.
  ro.a1.unit13.lesson03.teach.reminder_imi_place_numi_place_cafeaua_ceaiul_painea:
    title: 'Wiederholung: Îmi place, Nu-mi place, cafeaua, ceaiul, pâinea'
    gloss: Îmi place (Ich mag) · Nu-mi place (Ich mag nicht) · cafeaua (der Kaffee) · ceaiul (der Tee) · pâinea (das Brot)
    note: Alle aus der ersten Lektion dieser Einheit – hier sagen Ana und Mihai jeweils, was sie mögen und was nicht.
  ro.a1.unit13.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Wiederholung: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (hallo) · mulțumesc (danke) · la revedere (auf Wiedersehen) · Ana, Mihai (Namen)
    note: Alle schon aus früheren Lektionen bekannt – dasselbe freundliche Muster zu Beginn und Ende, das jeder Dialog in diesem Kurs verwendet hat.
  ro.a1.unit13.lesson03.teach.line01:
    title: Begrüßen und nach Kaffee oder Tee fragen
    gloss: Mihai begrüßt Ana und fragt, ob sie Kaffee oder Tee mag.
    note: Verbindet *Vă place...?* aus dieser Lektion mit *sau*, um beide Möglichkeiten in einer Frage anzubieten.
  ro.a1.unit13.lesson03.teach.line02:
    title: Eine Vorliebe und eine Abneigung äußern
    gloss: Ana sagt, dass sie Kaffee bevorzugt und Tee nicht mag.
    note: Verbindet *Prefer* mit *Nu-mi place* – ihre Vorliebe für Kaffee entspricht ihrer bisherigen Bestellung aus Lektion 6/12.
  ro.a1.unit13.lesson03.teach.line03:
    title: Die gegenteilige Vorliebe nennen
    gloss: Mihai sagt, dass er Tee mag und Kaffee nicht mag.
    note: Entspricht Mihais bisheriger Bestellung aus Lektion 6/12 (ceai, nie cafea).
  ro.a1.unit13.lesson03.teach.line04:
    title: Auch nach Brot fragen
    gloss: Ana fragt, ob Mihai auch Brot mag.
    note: Beginnt mit der kurzen Anschlussfrage *Și pâinea?* (Und das Brot?) und fragt dann vollständig mit *Vă place...?* nach einem neuen Thema, *pâinea*.
  ro.a1.unit13.lesson03.teach.line05:
    title: Zustimmen, danken und sich verabschieden
    gloss: Mihai sagt ja, er mag Brot, bedankt sich bei Ana und verabschiedet sich.
    note: Entspricht Mihais bisheriger Bestellung aus Lektion 6 (pâine) – derselbe Abschluss, mit dem jeder frühere Dialog geendet hat.
  ro.a1.unit13.lesson03.teach.line06:
    title: Das Gespräch beenden
    gloss: Ana verabschiedet sich ebenfalls und nennt dabei Mihais Namen.
    note: Derselbe freundliche Abschluss, mit dem jeder frühere Dialog geendet hat.
