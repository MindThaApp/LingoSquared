teaching:
  ro.a1.unit28.lesson01.teach.a_suna:
    title: Anrufen
    gloss: anrufen
    note: Der Infinitiv des Verbs für „telefonisch anrufen“.
    example_gloss: Ich muss dich anrufen.
  ro.a1.unit28.lesson01.teach.te_sun:
    title: Sagen, dass man anruft
    gloss: Ich rufe dich an.
    note: '*Sun* ist die *eu*-Form von *a suna* (anrufen); *te* („dich“) steht vor dem Verb. Für „ich rufe dich an“ (auch als Zukunft gemeint) verwendet Rumänisch wie Deutsch das Präsens.'
  ro.a1.unit28.lesson01.teach.alo_sunt_ana:
    title: Ans Telefon gehen
    gloss: Hallo, hier ist Ana.
    note: '*Alo* sagt man, wenn man ans Telefon geht; *sunt* + Name nennt, wer man ist, ähnlich wie „hier ist“ im Deutschen.'
  ro.a1.unit28.lesson01.teach.alo_sunt_mihai:
    title: Mihai meldet sich genauso
    gloss: Hallo, hier ist Mihai.
    note: Dasselbe Muster *Alo, sunt* + Name wie in *Alo, sunt Ana*.
  ro.a1.unit28.lesson02.teach.cu_cine_vorbesc:
    title: Fragen, wer anruft
    gloss: Mit wem spreche ich?
    note: '*Cu cine vorbesc?* (wörtlich „mit wem spreche ich?“) ist die Standardfrage, um zu erfahren, wer ein unbekannter Anrufer ist.'
  ro.a1.unit28.lesson02.teach.vorbiti_cu_ana:
    title: Sich förmlich melden
    gloss: Sie sprechen mit Ana.
    note: '*Vorbiți cu* + Name ist die höfliche Antwort: *vorbiți* ist die *dumneavoastră*-Form von *a vorbi* (sprechen).'
  ro.a1.unit28.lesson03.teach.poti_sa_repeti:
    title: Um Wiederholung bitten
    gloss: Kannst du das wiederholen?
    note: '*Poți să* ... (Kannst du ...?) plus *repeți* (du wiederholst) plus *asta* (das).'
  ro.a1.unit28.lesson03.teach.nu_vorbi_atat:
    title: Jemanden bitten, langsamer zu sprechen
    gloss: Sprich nicht so schnell, bitte.
    note: '*Nu vorbi* („sprich nicht“) ist *nu* + die *tu*-Form; *atât de repede* bedeutet „so schnell“.'
  ro.a1.unit28.lesson03.teach.nu_te_aud:
    title: Sagen, dass man schlecht hört
    gloss: Ich kann dich nicht gut hören.
    note: '*Nu te aud bine*: *aud* heißt „ich höre“, *te* („dich“) steht vor dem Verb, und *bine* bedeutet „gut“.'
  ro.a1.unit28.lesson04.teach.mesajul:
    title: Textnachricht
    gloss: die Textnachricht
    note: '*Mesaj* ist im Singular maskulin und im Plural feminin (*un mesaj*, *două mesaje*); der bestimmte Artikel wird hinten angehängt: *mesajul*.'
    example_gloss: Die Nachricht ist von Ana.
  ro.a1.unit28.lesson04.teach.iti_trimit_un:
    title: Sagen, dass man eine Nachricht schickt
    gloss: Ich schicke dir eine Nachricht.
    note: '*Îți* („dir“) ist ein Dativpronomen und steht vor dem Verb: *Îți trimit un mesaj*.'
  ro.a1.unit28.lesson04.teach.te_sun_inapoi:
    title: Sagen, dass man zurückruft
    gloss: Ich rufe dich später zurück.
    note: '*Înapoi* („zurück“) steht nach dem Verb: *te sun înapoi* heißt „ich rufe dich zurück“, und *mai târziu* bedeutet „später“.'
  ro.a1.unit28.lesson05.teach.mihai_salut_ana:
    title: Einen Nachrichtenaustausch lesen
    gloss: 'Mihai: Hallo Ana, kannst du mich anrufen? Ich muss dir etwas sagen. Ana: Ja, klar, ich rufe dich in fünf Minuten zurück.'
    note: Achten Sie darauf, worum Mihai bittet, warum und wann Ana zurückrufen will.
    glosses:
      Salut: hallo
      poți: kannst
      suna: anrufen
      Trebuie: müssen
      ceva: etwas
      spun: erzählen
      sigur: natürlich
      sun: anrufen
      cinci: fünf
      minute: Minuten
      înapoi: zurück
  ro.a1.unit28.lesson06.teach.mihai_alo_sunt:
    title: Mihai nimmt den Anruf an
    gloss: 'Mihai: Hallo, hier ist Mihai.'
    note: 'Dasselbe Muster *Alo, sunt* + Name aus Lektion 1, jetzt im echten Gespräch: Wer abnimmt, spricht zuerst und nennt seinen Namen.'
  ro.a1.unit28.lesson06.teach.ana_salut_mihai:
    title: Ana nennt ihren Namen
    gloss: 'Ana: Hallo Mihai, hier ist Ana. Mihai: Schön, dass du anrufst!'
    note: '*Ce bine că* ... („wie gut, dass ...“) drückt eine positive Reaktion auf ein Ereignis aus; *suni* ist die *tu*-Form von *a suna*.'
  ro.a1.unit28.lesson06.teach.ana_cum_a:
    title: Ana fragt nach der Schicht
    gloss: 'Ana: Wie war deine erste Schicht?'
    note: '*A fost* bedeutet „war“ (Vergangenheit von *a fi*). Es ist ein perfect compus, gebildet wie *am mâncat*; siehe die Anmerkung nach der nächsten Zeile.'
  ro.a1.unit28.lesson06.teach.mihai_a_mers:
    title: Mihai berichtet Gutes
    gloss: 'Mihai: Sie ist richtig gut gelaufen, besser, als ich dachte.'
    note: '*A mers* ist die Vergangenheit von *a merge* (gehen, hier „laufen, verlaufen“); *credeam* bedeutet „ich dachte“ (eine Vergangenheitsform von *a crede*).'
  ro.a1.unit28.lesson06.teach.a_fost_a:
    title: 'Vergangenheitsformen: a fost, a mers, credeam'
    gloss: war → sein, ging/lief → gehen, dachte → denken
    note: '*A fost* und *a mers* sind Formen des perfect compus (*a* + Partizip), *credeam* ist ein Imperfekt. Merken Sie sich diese Formen vorerst als feste Wendungen in den Zusammenhängen dieser Lektion; die vollständigen Regeln zur Vergangenheit folgen auf einem späteren Niveau.'
  ro.a1.unit28.lesson06.teach.ana_ma_bucur:
    title: Ana ist stolz
    gloss: 'Ana: Wie schön, das zu hören! Ich bin stolz auf dich.'
    note: '*Mândră de* („stolz auf“) ist eine feste Verbindung; *de* ist Pflicht. Ein Mann sagt *mândru*.'
  ro.a1.unit28.lesson06.teach.mihai_iti_multumesc:
    title: Mihai ist gerührt
    gloss: 'Mihai: Danke, das bedeutet mir viel.'
    note: '*Înseamnă* ist die Form für er/sie/es von *a însemna* (bedeuten); *pentru mine* („für mich“) sagt, wem es wichtig ist.'
  ro.a1.unit28.lesson06.teach.prima_lui_tura:
    title: Sein
    gloss: Seine erste Schicht ist sehr gut gelaufen.
    note: '*Lui* nach dem Nomen bedeutet „sein“: *prima lui tură*. (Für „ihr“ heißt es *ei*.)'
