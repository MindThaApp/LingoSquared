answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching unit01''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Spoken answers are assessed for intelligibility, not written punctuation.
  register: tu and dumneavoastră (and their matching verb forms, ai/aveți) are never interchangeable answers for each other's exercises, the same discipline unit01 established.
course:
  title: Rumänisch A1
  description: Zahlen von null bis hundert, einschließlich der Bildung der Zahlen von elf bis neunzehn (-sprezece) und der Zehner (-zeci), des Unterschieds doi/două je nach Genus sowie der Verwendung von Zahlen, um nach dem Alter und der Telefonnummer zu fragen und darauf zu antworten – in Fortsetzung von Ana und Mihai aus Lektion 1.
units:
  ro.a1.unit02.numbers:
    title: Zahlen
lessons:
  ro.a1.unit02.lesson01.zero_to_ten:
    title: Die Zahlen von null bis zehn
  ro.a1.unit02.lesson02.eleven_to_hundred:
    title: Zahlen von elf bis hundert
  ro.a1.unit02.lesson03.age_and_phone:
    title: Alter und Telefonnummer
teaching:
  ro.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: 'null'
    note: '*Zero* ist unveränderlich und wird auch verwendet, um eine Ziffer innerhalb einer längeren Zahl oder Telefonnummer vorzulesen.'
    example_gloss: Null, eins, zwei.
  ro.a1.unit02.lesson01.teach.unu:
    title: Eins
    gloss: eins
    note: '*Unu* ist die Form beim alleinigen Zählen. Vor einem maskulinen oder neutralen Substantiv wird es zu *un* (*un câine*, ein Hund); vor einem femininen Substantiv wird es zu *o* (*o sută*, hundert).'
    example_gloss: Eins, zwei, drei.
  ro.a1.unit02.lesson01.teach.doi:
    title: Zwei (maskulin)
    gloss: zwei
    note: '*Doi* steht bei maskulinen Substantiven (*doi bărbați*, zwei Männer). Feminine Substantive – und neutrale, die sich im Plural wie feminine verhalten – haben eine andere Form; siehe nächste Karte.'
    example_gloss: Zwei, drei, vier.
  ro.a1.unit02.lesson01.teach.doi_doua_gender:
    title: Zwei verändert sich je nach Genus
    gloss: doi (maskulin) / două (feminin und neutral)
    note: Anders als deutsch „zwei“ hat rumänisch *doi* eine eigene feminine Form, *două*, die bei femininen Substantiven steht (*două femei*, zwei Frauen) und auch bei neutralen, die im Plural feminin sind (*două numere*, zwei Zahlen). Außer bei eins (*un*/*o*) und zwei bleiben die Zahlen *trei* bis *zece* für jedes Genus gleich.
  ro.a1.unit02.lesson01.teach.trei:
    title: Drei
    gloss: drei
    note: '*Trei* ist für jedes Genus unveränderlich.'
    example_gloss: Drei, vier, fünf.
  ro.a1.unit02.lesson01.teach.patru:
    title: Vier
    gloss: vier
    note: '*Patru* ist unveränderlich. Achten Sie auf die unregelmäßige verkürzte Form bei den Zahlen von elf bis neunzehn: *paisprezece* (14), nicht *patrusprezece*.'
    example_gloss: Vier, fünf, sechs.
  ro.a1.unit02.lesson01.teach.cinci:
    title: Fünf
    gloss: fünf
    note: '*Cinci* ist unveränderlich.'
    example_gloss: Fünf, sechs, sieben.
  ro.a1.unit02.lesson01.teach.sase:
    title: Sechs
    gloss: sechs
    note: '*Șase* ist unveränderlich.'
    example_gloss: Sechs, sieben, acht.
  ro.a1.unit02.lesson01.teach.sapte:
    title: Sieben
    gloss: sieben
    note: '*Șapte* ist unveränderlich.'
    example_gloss: Sieben, acht, neun.
  ro.a1.unit02.lesson01.teach.opt:
    title: Acht
    gloss: acht
    note: '*Opt* ist unveränderlich.'
    example_gloss: Acht, neun, zehn.
  ro.a1.unit02.lesson01.teach.noua:
    title: Neun
    gloss: neun
    note: '*Nouă* ist unveränderlich. Ohne das Diakritikum geschrieben wäre es mit *noua* („die neue“, feminin) identisch – tippen Sie also das *ă*: Getippte Antworten werden samt Diakritika geprüft.'
    example_gloss: Neun, zehn ... geschafft!
  ro.a1.unit02.lesson01.teach.zece:
    title: Zehn
    gloss: zehn
    note: '*Zece* ist unveränderlich und bildet die Grundlage aller Zahlen von elf bis neunzehn (*zece* + *-sprezece*).'
    example_gloss: Zehn! Bravo!
  ro.a1.unit02.lesson02.teach.unsprezece:
    title: Elf
    gloss: elf
    note: '*Unsprezece* setzt sich wörtlich aus *unu* + *spre* + *zece* zusammen („eins über zehn“) – nach diesem Muster werden alle folgenden Zahlen von elf bis neunzehn gebildet.'
    example_gloss: Zehn, elf, zwölf.
  ro.a1.unit02.lesson02.teach.teens_pattern:
    title: Zwölf bis neunzehn
    gloss: doisprezece (12), treisprezece (13), paisprezece (14), cincisprezece (15), șaisprezece (16), șaptesprezece (17), optsprezece (18), nouăsprezece (19)
    note: 'Jede dieser Zahlen hängt *-sprezece* an die normale Form der Ziffer an: *doi* → *doisprezece*, *trei* → *treisprezece* und so weiter bis *nouă* → *nouăsprezece*. Zwei Zahlen sind unregelmäßig: vierzehn, wo *patru* zu *pai-* verkürzt wird (*paisprezece*, nicht *patrusprezece*), und sechzehn, wo *șase* zu *șai-* wird (*șaisprezece*, nicht *șasesprezece*).'
  ro.a1.unit02.lesson02.teach.douazeci:
    title: Zwanzig
    gloss: zwanzig
    note: '*Douăzeci* („zwei Zehner“) ist ein eigenes Wort und die Grundlage aller Zahlen von 21 bis 29.'
    example_gloss: Neunzehn, zwanzig ...
  ro.a1.unit02.lesson02.teach.douazeci_si_unu:
    title: Einundzwanzig
    gloss: einundzwanzig
    note: 'Ab einundzwanzig verbindet das Rumänische Zehner und Einer mit *și* („und“): *douăzeci și unu*, *douăzeci și doi* und so weiter – anders als die Zahlen von elf bis neunzehn, die zu einem Wort verschmelzen. Die Reihenfolge ist dabei wie im Deutschen nicht umgekehrt: Der Zehner steht hier jedoch zuerst.'
    example_gloss: Zwanzig, einundzwanzig, zweiundzwanzig.
  ro.a1.unit02.lesson02.teach.tens_pattern:
    title: Dreißig bis neunzig
    gloss: treizeci (30), patruzeci (40), cincizeci (50), șaizeci (60), șaptezeci (70), optzeci (80), nouăzeci (90)
    note: 'Jeder Zehner ab dreißig besteht aus der Ziffer plus *-zeci* („Zehner“) – *trei* → *treizeci*, *patru* → *patruzeci* und so weiter. Die einzige Schreibänderung betrifft sechzig: *șase* wird zu *șai-*, also *șaizeci* (dasselbe *șai-* wie in *șaisprezece*). Eine Zählweise in Zwanzigern wie im Französischen gibt es für 70/80/90 nicht.'
  ro.a1.unit02.lesson02.teach.o_suta:
    title: Einhundert
    gloss: einhundert
    note: '*O sută* verwendet *o* (die feminine Form von „ein/eine“) und nicht *un*, weil *sută* ein feminines Substantiv ist.'
    example_gloss: Neunzig, hundert!
  ro.a1.unit02.lesson03.teach.cati_ani_ai:
    title: Informell nach dem Alter fragen
    gloss: Wie alt bist du?
    note: Wörtlich „wie viele Jahre hast du“, mit *avea* (haben). Wie im Französischen (*avoir*) und im Spanischen wird das Alter mit „haben“ ausgedrückt, nicht mit „sein“ wie im Deutschen. *Câți* (wie viele, maskulin) richtet sich nach *ani* (Jahre, maskulin).
  ro.a1.unit02.lesson03.teach.am_nouasprezece_ani:
    title: Das Alter angeben (unter zwanzig)
    gloss: Ich bin neunzehn.
    note: '*Am* ist die *eu*-Form von *avea*. Vor *ani* steht bei Zahlen unter zwanzig kein *de*.'
  ro.a1.unit02.lesson03.teach.cati_ani_aveti:
    title: Formell nach dem Alter fragen
    gloss: Wie alt bist du?
    note: '*Aveți* ist die *dumneavoastră*-Form von *avea* und passt zur höflichen Anrede aus Lektion 1.'
  ro.a1.unit02.lesson03.teach.am_treizeci_de_ani:
    title: Das Alter angeben (ab zwanzig)
    gloss: Ich bin dreißig.
    note: '*De* steht hier, weil *treizeci* zwanzig oder mehr ist – die vollständige Regel steht auf der nächsten Karte.'
  ro.a1.unit02.lesson03.teach.de_insertion_rule:
    title: Wann vor dem Substantiv de steht
    gloss: '2–19: kein de (doi ani) / ab 20: mit de (treizeci de ani)'
    note: 'Eine typisch rumänische Regel, die es im Deutschen nicht gibt: Zahlen von 2 bis 19 stehen direkt vor dem Substantiv (*doi ani*, zwei Jahre; *nouăsprezece ani*, neunzehn Jahre), ab 20 steht dagegen *de* zwischen Zahl und Substantiv (*treizeci de ani*, dreißig Jahre; *o sută de ani*, hundert Jahre). Eine Sonderform ist *un an* (ein Jahr) – Singular, in beiden Fällen ohne *de*.'
  ro.a1.unit02.lesson03.teach.care_e_numarul_tau:
    title: Informell nach der Telefonnummer fragen
    gloss: Wie lautet deine Telefonnummer?
    note: '*Care* (welche/was) ist die natürliche Frage nach einer bestimmten, vorhandenen Nummer, nicht *ce*. *Număr* ist ein Neutrum; im Singular verhält es sich wie ein Maskulinum, deshalb heißt *dein* hier *tău*, nicht *ta*.'
  ro.a1.unit02.lesson03.teach.care_este_numarul_dvs:
    title: Förmlich nach der Telefonnummer fragen
    gloss: Wie lautet deine Telefonnummer?
    note: '*Este* ist die volle Form von *e* und wird in sorgfältiger oder förmlicher Sprache häufiger gebraucht. *Dumneavoastră* hält das Gespräch höflich – dasselbe Wort wie in Lektion 1.'
  ro.a1.unit02.lesson03.teach.raspuns_telefon:
    title: Eine Telefonnummer Ziffer für Ziffer nennen
    gloss: 'Sie lautet: null, sieben, zwei, eins, vier, fünf, sechs, sieben, acht, neun.'
    note: In dieser Lektion wird nur Ziffer für Ziffer gelesen – eine vereinfachende Festlegung, wie schon in Lektion 1 bei der Wahl des Sprachregisters. Im Alltag werden Ziffern oft auch paarweise zusammengefasst, aber einzelne Ziffern werden immer verstanden.
