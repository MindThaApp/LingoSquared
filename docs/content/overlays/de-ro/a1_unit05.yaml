answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: This unit's new "Ai frați?"/"Aveți frați?" and "Câți copii ai?"/"Câți copii aveți?" pairs are register-sensitive (tu vs. dumneavoastră, parallel to unit02's ai/aveți age questions) -- accept either register unless an exercise explicitly names one. Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: Rumänisch A1
  description: Über die Familie sprechen auf Rumänisch – Eltern, Geschwister, Kinder und Familienstand – mit dem Possessivpaar meu/mea und demselben Kontrast zwischen tu und dumneavoastră wie bei den Fragen nach dem Alter in Unit 2. Ana und Mihai lernen dabei die Familie des anderen kennen.
units:
  ro.a1.unit05.family:
    title: Familie
lessons:
  ro.a1.unit05.lesson01.familia_mea:
    title: Meine Familie
  ro.a1.unit05.lesson02.frati_si_copii:
    title: Geschwister und Kinder
  ro.a1.unit05.lesson03.o_discutie_despre_familie:
    title: Ein Gespräch über die Familie
teaching:
  ro.a1.unit05.lesson01.teach.reminder_am_un_o_si_mare:
    title: 'Wiederholung: am, un, o, și, mare'
    gloss: am (ich habe) · un/o (ein/eine) · și (und) · mare (groß)
    note: Alle fünf Wörter kamen schon in früheren Units vor (*și* in Unit 1, *am* und *o* in Unit 2, *mare* in der Notiz zu Großbuchstaben in Unit 3, *un* in Unit 4) – hier kehren sie zurück, um über die Familie zu sprechen.
  ro.a1.unit05.lesson01.teach.familie:
    title: Familie
    gloss: Familie
    note: Ein feminines Substantiv – es verbindet sich mit *o* und einem Adjektiv wie *mare* zu „eine große Familie“.
    example_gloss: Ich habe eine große Familie.
  ro.a1.unit05.lesson01.teach.mama:
    title: Mutter
    gloss: Mutter
    note: Das einfache Wörterbuchwort für „Mutter“ – wie man „meine Mutter“ sagt, sehen Sie auf den nächsten Karten.
    example_gloss: Mihai hat eine Mutter und einen Vater.
  ro.a1.unit05.lesson01.teach.tata:
    title: Vater
    gloss: Vater
    note: Das einfache Wörterbuchwort für „Vater“.
    example_gloss: Mein Vater ist Lehrer.
  ro.a1.unit05.lesson01.teach.parintii:
    title: Eltern
    gloss: Eltern
    note: Bezeichnet beide Elternteile zusammen, genau wie das deutsche „Eltern“.
    example_gloss: Meine Eltern wohnen in Rumänien.
  ro.a1.unit05.lesson01.teach.meu_mea:
    title: 'Mein: meu und mea'
    gloss: meu (mein, maskulin) / mea (meine, feminin)
    note: Das rumänische Wort für „mein“ richtet sich nach dem Genus des Besitzten, nicht nach dem Besitzer – *meu* steht bei einem maskulinen Substantiv wie *tată*, *mea* bei einem femininen wie *mamă*.
  ro.a1.unit05.lesson01.teach.mama_mea:
    title: Meine Mutter
    gloss: meine Mutter
    note: Aus mamă wird mama (der bestimmte Artikel wird angehängt), bevor mea folgt – genau diese Form ist die echte Wendung für „meine Mutter“, keine Wort-für-Wort-Übersetzung.
  ro.a1.unit05.lesson01.teach.tatal_meu:
    title: Mein Vater
    gloss: mein Vater
    note: Aus tată wird tatăl (der bestimmte Artikel wird unregelmäßig mit -l angehängt), bevor meu folgt.
  ro.a1.unit05.lesson01.teach.mama_si_tatal:
    title: Meine Mutter und mein Vater
    gloss: Meine Mutter und mein Vater.
    note: Beide Possessivformen stehen in einem Satz, jeweils mit dem passenden Genus.
  ro.a1.unit05.lesson02.teach.reminder_cati_ai_aveti_doi_nu:
    title: 'Wiederholung: câți, ai, aveți, doi, nu'
    gloss: câți (wie viele) · ai/aveți (du hast/Sie haben) · doi (zwei) · nu (nein/nicht)
    note: '*Câți*, *ai* und *aveți* kamen zuerst in Unit 2 bei der Frage nach dem Alter vor („Câți ani ai?“); hier fragen sie nach Geschwistern und Kindern. *Doi* stammt aus den Zahlen von Unit 2, *nu* aus Unit 3.'
  ro.a1.unit05.lesson02.teach.da:
    title: Ja
    gloss: ja
    note: Das alltägliche Wort für „ja“, das Gegenstück zu *nu* („nein“) aus Unit 3.
    example_gloss: Ja, ich habe einen Bruder.
  ro.a1.unit05.lesson02.teach.frate_sora:
    title: Bruder, Schwester
    gloss: Bruder / Schwester
    note: Maskulines und feminines Wort für Geschwister – sie verbinden sich mit un/o wie jedes andere Substantiv.
    example_gloss:
    - Ich habe einen Bruder.
    - Ich habe eine Schwester.
  ro.a1.unit05.lesson02.teach.frati_surori:
    title: Brüder, Schwestern
    gloss: Brüder / Schwestern
    note: Die Pluralformen, mit denen man allgemein nach Geschwistern fragt – auf Rumänisch fragt man oft „Ai frați?“ („Hast du Brüder?“) und meint damit „Hast du Geschwister?“; danach folgt häufig noch „Surori?“, um gezielt nach Schwestern zu fragen, genau wie die zweiteilige Frage im Ausgangsmaterial.
    example_gloss: Hast du Brüder oder Schwestern?
  ro.a1.unit05.lesson02.teach.ai_frati:
    title: Hast du Geschwister? (informell)
    gloss: Hast du Brüder?
    note: Die alltägliche, informelle Art zu fragen – passend zum Register *tu* aus Unit 1.
  ro.a1.unit05.lesson02.teach.aveti_frati:
    title: Haben Sie Geschwister? (formell)
    gloss: Hast du Brüder?
    note: Die höfliche Variante mit demselben *aveți* wie bei der Frage nach dem Alter in Unit 2.
  ro.a1.unit05.lesson02.teach.copil_copii:
    title: Kind, Kinder
    gloss: Kind / Kinder
    note: Copil hat einen der kniffligeren Plurale im Rumänischen – copii, keine regelmäßige Endung auf -i oder -e –, deshalb lohnt es sich, ihn als eigene Form zu lernen.
    example_gloss: Ich habe zwei Kinder.
  ro.a1.unit05.lesson02.teach.fiu_fiica:
    title: Sohn, Tochter
    gloss: Sohn / Tochter
    note: Die speziellen Wörter für Sohn und Tochter, im Unterschied zum allgemeinen copil/copii.
    example_gloss:
    - Ich habe einen Sohn.
    - Ich habe eine Tochter.
  ro.a1.unit05.lesson02.teach.cati_copii_ai:
    title: Wie viele Kinder haben Sie?
    gloss: Wie viele Kinder haben Sie?
    note: Câți (wie viele) + copii (Kinder) + ai (du hast) – alle drei kennen Sie bereits.
  ro.a1.unit05.lesson02.teach.casatorit:
    title: Verheiratet
    gloss: verheiratet
    note: Eine im Alltag übliche Frage zur Person, ähnlich wie die Frage nach dem Alter.
    example_gloss: Bist du verheiratet?
  ro.a1.unit05.lesson03.teach.reminder_bine_la_revedere:
    title: 'Wiederholung: bine, la revedere, Ana, Mihai'
    gloss: bine (gut) · la revedere (auf Wiedersehen) · Ana, Mihai (Namen)
    note: Wiederholt Wortschatz aus früheren Units, der im Dialog dieser Lektion wieder vorkommt.
  ro.a1.unit05.lesson03.teach.line01:
    title: Nach Geschwistern fragen
    gloss: Ana fragt Mihai, ob er Geschwister hat.
    note: Verwendet das höfliche *aveți*, passend zum Register, das die beiden miteinander eingeführt haben.
  ro.a1.unit05.lesson03.teach.line02:
    title: Antworten und zurückfragen
    gloss: Mihai sagt, dass er einen Bruder und eine Schwester hat, und fragt, ob Ana Kinder hat.
    note: Verwendet den Wortschatz frate/soră und copii dieser Unit in einem Wortwechsel.
  ro.a1.unit05.lesson03.teach.line03:
    title: Antworten und die Frage zurückgeben
    gloss: Ana sagt, dass sie eine Tochter hat, und stellt Mihai dieselbe Frage zurück.
    note: '*Și dumneavoastră?* („Und Sie?“) ist genau dasselbe Muster für die Rückfrage wie bei den Vorstellungen in Unit 1.'
  ro.a1.unit05.lesson03.teach.line04:
    title: Antwort
    gloss: Mihai sagt, dass er einen Sohn hat.
    note: Eine kurze, direkte Antwort mit fiu aus dieser Unit.
  ro.a1.unit05.lesson03.teach.line05:
    title: Reagieren und sich verabschieden
    gloss: Ana reagiert positiv und verabschiedet sich.
    note: '*Bine!* ist hier eine kurze positive Reaktion, dasselbe Wort wie in *Bine, mulțumesc.* aus Unit 1.'
  ro.a1.unit05.lesson03.teach.line06:
    title: Das Gespräch beenden
    gloss: Mihai verabschiedet sich ebenfalls und nennt Anas Namen.
    note: Derselbe freundliche Abschluss, mit dem auch die Dialoge in Unit 1 und Unit 4 endeten.
