teaching:
  ro.a1.unit08.lesson01.teach.reminder_unde_este:
    title: 'Wiederholung: unde, este'
    gloss: unde (wo) · este (ist)
    note: Beide kamen schon vor – *unde* in *Unde pot să cumpăr ...?* aus Lektion 7, *este* seit Lektion 3/4 – hier verbinden sie sich zur zentralen Ortsfrage dieser Lektion.
  ro.a1.unit08.lesson01.teach.unde_este_phrase:
    title: Wo ist ...?
    gloss: Unde este...? (Wo ist...?)
    note: 'Die alltägliche Art zu fragen, wo etwas ist: Hängen Sie den Namen des Ortes hinter *este*, oder sagen Sie es so allein, wenn der Ort aus dem Zusammenhang klar ist.'
  ro.a1.unit08.lesson01.teach.gara_magazin_banca:
    title: Bahnhof, Geschäft, Bank
    gloss: gară (bahnhof) · magazin (Geschäft) · bancă (Bank)
    note: 'Drei häufige Orte – alle bekommen den bestimmten Artikel, wenn von einem bestimmten, bekannten Ort die Rede ist: *gara*, *magazinul*, *banca*.'
    example_gloss:
    - Wo ist der Bahnhof?
    - Das Geschäft ist nah.
    - Die Bank ist weit weg.
  ro.a1.unit08.lesson01.teach.aproape_departe:
    title: Nah, weit
    gloss: aproape (nah / in der Nähe) · departe (weit)
    note: Eine einfache Möglichkeit zu sagen, wie nah oder weit ein Ort ist, ohne genaue Wegbeschreibung.
    example_gloss:
    - Das Geschäft ist nah.
    - Die Bank ist weit weg.
  ro.a1.unit08.lesson01.teach.magazinul_aproape:
    title: Das Geschäft ist nah
    gloss: Magazinul este aproape. (Das Geschäft ist nah.)
    note: Eine kurze, vollständige Aussage – nach *aproape* braucht es keinen Ortsnamen, wenn klar ist, welcher Ort gemeint ist.
  ro.a1.unit08.lesson01.teach.banca_departe:
    title: Die Bank ist weit weg
    gloss: Banca este departe. (Die Bank ist weit weg.)
    note: Das Gegenteil von *aproape* – dasselbe einfache Muster.
  ro.a1.unit08.lesson01.teach.unde_este_gara:
    title: Wo ist der Bahnhof?
    gloss: Unde este gara? (Wo ist der Bahnhof?)
    note: Verbindet *Unde este...?* und *gara* zu einer vollständigen Frage.
  ro.a1.unit08.lesson02.teach.spital_posta_biblioteca_statie:
    title: Krankenhaus, Post, Bibliothek, Bushaltestelle
    gloss: spital (Krankenhaus) · poștă (Post) · bibliotecă (Bibliothek) · stație de autobuz (Bushaltestelle)
    note: 'Vier weitere häufige Orte – wie gară/magazin/bancă bekommen sie für einen bestimmten Ort den bestimmten Artikel: *spitalul*, *poșta*, *biblioteca*, *stația de autobuz*.'
    example_gloss:
    - Das Krankenhaus liegt gegenüber dem Geschäft.
    - Die Post liegt zwischen dem Geschäft und dem Krankenhaus.
    - Die Bibliothek ist nicht weit vom Bahnhof.
    - Die Bushaltestelle ist neben der Bibliothek.
  ro.a1.unit08.lesson02.teach.langa_vizavi_intre:
    title: Neben, gegenüber, zwischen
    gloss: lângă (neben) · vizavi de (gegenüber) · între (zwischen)
    note: Drei Möglichkeiten, einen Ort in Bezug auf einen anderen zu bestimmen. *Vizavi de* braucht *de* und *între* braucht *și*, um den zweiten Ort anzuschließen; *lângă* steht direkt davor.
    example_gloss:
    - Das Geschäft ist neben dem Bahnhof.
    - Das Krankenhaus liegt gegenüber dem Geschäft.
    - Die Post liegt zwischen dem Geschäft und dem Krankenhaus.
  ro.a1.unit08.lesson02.teach.magazinul_langa_gara:
    title: Das Geschäft ist neben dem Bahnhof
    gloss: Magazinul este lângă gară. (Das Geschäft ist neben dem Bahnhof.)
    note: '*Lângă* steht direkt vor dem Ortsnamen, ohne zusätzliches Wort.'
  ro.a1.unit08.lesson02.teach.spitalul_vizavi_magazin:
    title: Das Krankenhaus liegt gegenüber dem Geschäft
    gloss: Spitalul este vizavi de magazin. (Das Krankenhaus liegt gegenüber dem Geschäft.)
    note: '*Vizavi de* braucht *de* vor dem zweiten Ort.'
  ro.a1.unit08.lesson02.teach.posta_intre:
    title: Die Post liegt zwischen dem Geschäft und dem Krankenhaus
    gloss: Poșta este între magazin și spital. (Die Post liegt zwischen dem Geschäft und dem Krankenhaus.)
    note: '*Între* nennt zwei Orte, die mit *și* (und) verbunden werden.'
  ro.a1.unit08.lesson02.teach.statia_langa_biblioteca:
    title: Die Bushaltestelle ist neben der Bibliothek
    gloss: Stația de autobuz este lângă bibliotecă. (Die Bushaltestelle ist neben der Bibliothek.)
    note: Dasselbe *lângă*-Muster wie bei Geschäft und Bahnhof, jetzt mit Bushaltestelle und Bibliothek.
  ro.a1.unit08.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Wiederholung: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (hallo) · mulțumesc (danke) · la revedere (auf Wiedersehen) · da (ja) · Ana, Mihai (Namen)
    note: Alles schon aus früheren Lektionen bekannt – hier treffen sich Ana und Mihai wieder, diesmal in der Nachbarschaft.
  ro.a1.unit08.lesson03.teach.line01:
    title: Begrüßen und nach der Post fragen
    gloss: Ana begrüßt Mihai und fragt, wo die Post ist.
    note: Verbindet das *Unde este* dieser Lektion mit der Begrüßung aus Lektion 1.
  ro.a1.unit08.lesson03.teach.line02:
    title: Den Ort angeben
    gloss: Mihai sagt, dass die Post zwischen dem Geschäft und dem Krankenhaus liegt.
    note: Greift die *poșta*- und *între ... și*-Konstruktion dieser Lektion wieder auf.
  ro.a1.unit08.lesson03.teach.line03:
    title: Nach der Bibliothek fragen
    gloss: Ana fragt, ob die Bibliothek nah ist.
    note: Eine kurze Anschlussfrage mit *este* und *aproape*.
  ro.a1.unit08.lesson03.teach.line04:
    title: Bestätigen und ergänzen
    gloss: Mihai bestätigt, dass die Bibliothek nah am Bahnhof liegt, und ergänzt, dass die Bushaltestelle neben der Bibliothek ist.
    note: Verbindet *aproape de* und *lângă* – beide Präpositionen dieser Lektion – in einer Zeile.
  ro.a1.unit08.lesson03.teach.line05:
    title: Danken und abschließen
    gloss: Ana bedankt sich bei Mihai und verabschiedet sich.
    note: '*Mulțumesc* ist hier ein einfacher Dank zum Abschluss, dasselbe Wort wie in *Bine, mulțumesc.* aus Lektion 1.'
  ro.a1.unit08.lesson03.teach.line06:
    title: Das Gespräch beenden
    gloss: Mihai verabschiedet sich ebenfalls und nennt dabei Anas Namen.
    note: Dasselbe freundliche Abschlussmuster, mit dem schon die Dialoge der Lektionen 1, 5, 6 und 7 endeten.
