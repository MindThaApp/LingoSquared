answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (tren, pleacă, bilet, peron, București, Drum bun) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing formal register with each other; no new tu/dumneavoastră form is introduced this unit.
course:
  title: Rumänisch A1
  description: Eine einfache Zugreise auf Rumänisch meistern – Tren (Zug), Bilet (Fahrkarte), Peron (Bahnsteig) und Pleacă (fährt ab) – während Mihai den Zug nach București nimmt und Ana ihn am Bahnhof (gară) verabschiedet.
units:
  ro.a1.unit15.travel:
    title: Reisen
lessons:
  ro.a1.unit15.lesson01.trenul_pleaca:
    title: Der Zug fährt ab
  ro.a1.unit15.lesson02.un_bilet_va_rog:
    title: Eine Fahrkarte, bitte
  ro.a1.unit15.lesson03.la_gara:
    title: Am Bahnhof
teaching:
  ro.a1.unit15.lesson01.teach.reminder_gara_ora:
    title: 'Wiederholung: gară, este, la, ce, oră, ora, nouă'
    gloss: gară (Bahnhof) · este (ist) · la (um/zu/nach) · ce (was/welche) · oră (Stunde/Uhr) · ora (die Stunde/Uhr) · nouă (neun)
    note: 'Gară kennen Sie aus Lektion 8/9; este/la/ce/oră/ora/nouă stammen aus Lektion 4 (Uhrzeit) – diese Lektion verwendet das Muster „la ce oră“/„la ora nouă“ aus Lektion 4 mit neuem Zweck: Man fragt nach einem Zug statt nach einem Kurs.'
  ro.a1.unit15.lesson01.teach.tren_vocab:
    title: Zug
    gloss: Tren (Zug)
    note: 'Neutrum, auf Konsonant endend (im Singular verhalten sich Neutra wie Maskulina: *un tren*) – für „der Zug“ erhält es die Endung *-ul*, genau wie *magazin*->*magazinul*; Nomen auf *-ă* wie *gară* nehmen dagegen *-a* (*gara*).'
    example_gloss:
    - Der Zug steht am Bahnhof.
  ro.a1.unit15.lesson01.teach.pleaca_vocab:
    title: Fährt ab
    gloss: Pleacă (fährt ab, er/sie/es)
    note: Das Verb für das Abfahren eines Zuges, Busses oder Flugzeugs. *Trenul pleacă* – ohne *este*, denn *pleacă* ist bereits ein vollständiges Verb.
    example_gloss:
    - Der Zug fährt ab.
  ro.a1.unit15.lesson01.teach.trenul_pleaca_ora_noua_phrase:
    title: Der Zug fährt um neun ab
    gloss: Trenul pleacă la ora nouă. (Der Zug fährt um neun Uhr ab.)
    note: Verbindet *trenul* + *pleacă* mit *la ora nouă* aus Lektion 4 – es ist kein neuer Wortschatz zur Uhrzeit nötig.
  ro.a1.unit15.lesson01.teach.la_ce_ora_pleaca_trenul_phrase:
    title: Um wie viel Uhr fährt der Zug ab?
    gloss: La ce oră pleacă trenul? (Um wie viel Uhr fährt der Zug ab?)
    note: Das Fragemuster *La ce oră...?* aus Lektion 4, jetzt mit Frage nach *trenul* statt nach einem Kurs.
  ro.a1.unit15.lesson01.teach.peron_vocab:
    title: Bahnsteig
    gloss: Peron (Bahnsteig)
    note: Ein Bahnsteig. Neutrum, auf Konsonant endend, daher heißt „der Bahnsteig“ *peronul* – dieselbe Endung *-ul* wie bei *tren*->*trenul*.
    example_gloss:
    - Der Zug steht an Gleis drei.
  ro.a1.unit15.lesson01.teach.de_la_ce_peron_phrase:
    title: Von welchem Bahnsteig fährt der Zug ab?
    gloss: De la ce peron pleacă trenul? (Von welchem Bahnsteig fährt der Zug ab?)
    note: '*De la* (von) + *ce peron* (welcher Bahnsteig) – alle Wörter kennen Sie schon, sie sind hier nur zu einer neuen Frage kombiniert.'
  ro.a1.unit15.lesson02.teach.reminder_as_dori_va_rog_cat_costa:
    title: 'Wiederholung: aș dori, vă rog, cât costă, costă, lei'
    gloss: aș dori (ich möchte) · vă rog (bitte, förmlich) · cât costă (wie viel kostet es) · costă (es kostet) · lei (Lei, Währung)
    note: Alles aus Lektion 6 (Essen) und Lektion 7 (Einkaufen) – hier verwenden Sie dieselben höflichen Bitten und Preisfragen, um eine Fahrkarte statt Essen zu kaufen.
  ro.a1.unit15.lesson02.teach.bilet_vocab:
    title: Fahrkarte
    gloss: Bilet (Fahrkarte)
    note: Eine Zugfahrkarte. Neutrum (im Singular steht *un* wie bei einem Maskulinum), also heißt „eine Fahrkarte“ *un bilet*.
    example_gloss:
    - Ich habe eine Fahrkarte.
  ro.a1.unit15.lesson02.teach.bucuresti_vocab:
    title: Bukarest
    gloss: București (Bukarest)
    note: Die Hauptstadt Rumäniens – das naheliegende Beispielziel in diesem Kurs.
    example_gloss:
    - Der Zug fährt nach Bukarest.
  ro.a1.unit15.lesson02.teach.as_dori_bilet_bucuresti_phrase:
    title: Ich hätte gern eine Fahrkarte nach Bukarest, bitte
    gloss: Aș dori un bilet la București, vă rog. (Ich hätte gern eine Fahrkarte nach Bukarest, bitte.)
    note: Das Höflichkeitsmuster *Aș dori... vă rog* aus Lektion 6/7, jetzt für die Bitte um eine Fahrkarte statt um Essen.
  ro.a1.unit15.lesson02.teach.cat_costa_bilet_bucuresti_phrase:
    title: Wie viel kostet eine Fahrkarte nach Bukarest?
    gloss: Cât costă un bilet la București? (Wie viel kostet eine Fahrkarte nach Bukarest?)
    note: Die Preisfrage *Cât costă...?* aus Lektion 7, jetzt für eine Fahrkarte statt für ein Kilo Kartoffeln.
  ro.a1.unit15.lesson02.teach.costa_zece_lei_phrase:
    title: Sie kostet vierzig Lei
    gloss: Costă patruzeci de lei. (Sie kostet vierzig Lei.)
    note: Bei Zahlen ab 20 steht *de* vor *lei* (patruzeci de lei); bei Zahlen von 2 bis 19 (z. B. zece lei) entfällt es – die Regel kennen Sie schon aus Lektion 7.
  ro.a1.unit15.lesson03.teach.reminder_travel_words:
    title: 'Wiederholung: tren, pleacă, peron, bilet, București, trei, am'
    gloss: tren (Zug) · pleacă (fährt ab) · peron (Bahnsteig) · bilet (Fahrkarte) · București (Bukarest) · trei (drei, aus Lektion 2) · am (ich habe, aus Lektion 2)
    note: Tren/pleacă/peron/bilet/București stammen aus den ersten beiden Lektionen dieser Einheit; trei und am werden hier aus Lektion 2 (Zahlen) wiederholt, da Ana und Mihai am Bahnhof „peronul trei“ und „am un bilet“ zusammen verwenden.
  ro.a1.unit15.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Wiederholung: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (hallo) · mulțumesc (danke) · la revedere (auf Wiedersehen) · Ana, Mihai (Namen)
    note: Alles schon aus früheren Lektionen bekannt – dasselbe freundliche Begrüßungs- und Abschiedsmuster wie in jedem Dialog dieses Kurses.
  ro.a1.unit15.lesson03.teach.drum_bun_vocab:
    title: Gute Reise
    gloss: Drum bun (Gute Reise)
    note: Ein fester Abschiedsgruß für jemanden, der gleich verreist – wörtlich „guter Weg“, verwendet wie im Deutschen „Gute Reise!“.
    example_gloss:
    - Gute Reise, Mihai!
  ro.a1.unit15.lesson03.teach.line01:
    title: Begrüßen und nach dem Zug fragen
    gloss: Ana begrüßt Mihai und fragt, um wie viel Uhr der Zug abfährt.
    note: Greift die Frage aus der ersten Lektion dieser Einheit auf, jetzt direkt an Mihai gerichtet.
  ro.a1.unit15.lesson03.teach.line02:
    title: Die Abfahrtszeit nennen
    gloss: Mihai sagt, dass der Zug um neun Uhr abfährt.
    note: Greift den Satz aus der ersten Lektion dieser Einheit genau auf.
  ro.a1.unit15.lesson03.teach.line03:
    title: Nach dem Bahnsteig fragen
    gloss: Ana fragt, von welchem Bahnsteig der Zug fährt.
    note: Eine kurze Nachfrage – *de la ce peron* wurde in der ersten Lektion schon vollständig gefragt; hier fragt Ana kurz und erwartet, dass Mihai den Rest ergänzt.
  ro.a1.unit15.lesson03.teach.line04:
    title: Bahnsteig und Fahrkarte nennen
    gloss: Mihai sagt, dass der Zug von Bahnsteig drei fährt und dass er eine Fahrkarte nach Bukarest hat.
    note: Verbindet den Wortschatz dieser Einheit – peron sowie bilet/București – in einer Antwort.
  ro.a1.unit15.lesson03.teach.line05:
    title: Gute Reise wünschen und sich verabschieden
    gloss: Ana wünscht Mihai eine gute Reise und verabschiedet sich.
    note: Hier kommt das *Drum bun* dieser Lektion vor – ein Abschiedsgruß für Reisende, der das einfache *la revedere* allein ersetzt, wie es im Kurs sonst üblich ist.
  ro.a1.unit15.lesson03.teach.line06:
    title: Sich bedanken und verabschieden
    gloss: Mihai bedankt sich bei Ana und verabschiedet sich.
    note: Dasselbe Schlussmuster, mit dem schon die Dialoge aller früheren Lektionen geendet haben.
