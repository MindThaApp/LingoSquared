teaching:
  ro.a1.unit32.lesson01.teach.animalul_un_animal:
    title: Tier, Haustier
    gloss: das Tier / ein Haustier
    note: '*Animal* ist das allgemeine Wort; *animal de companie* („Begleittier“) bedeutet speziell Haustier. Der Plural ist *animale* (*un animal*, *două animale*).'
    example_gloss:
    - Ein Hund ist ein Tier.
    - Ein Hund ist auch ein Haustier.
  ro.a1.unit32.lesson01.teach.cainele_pisica:
    title: Hund und Katze
    gloss: der Hund / die Katze
    example_gloss:
    - Ana hat einen Hund.
    - Andrei hat eine Katze.
  ro.a1.unit32.lesson01.teach.pestele_pasarea:
    title: Fisch und Vogel
    gloss: der Fisch / der Vogel
    example_gloss:
    - Opa hat einen Fisch.
    - Nina hat einen Vogel.
  ro.a1.unit32.lesson01.teach.ai_un_animal:
    title: Hast du ein Haustier?
    gloss: Hast du ein Haustier?
    note: 'Dasselbe Fragemuster *Ai ...?*, das Sie schon kennen: *a avea* (haben) + Nomen.'
  ro.a1.unit32.lesson01.teach.da_am_un:
    title: Ja, ich habe einen Hund
    gloss: Ja, ich habe einen Hund.
    note: Eine einfache bejahende Antwort mit dem neuen Wortschatz dieser Lektion.
  ro.a1.unit32.lesson01.teach.nu_nu_am:
    title: Nein, ich habe kein Haustier
    gloss: Nein, ich habe kein Haustier.
    note: Nach *nu am* verneint *niciun* („kein einziger“) das Nomen; siehe die Grammatikerklärung.
  ro.a1.unit32.lesson01.teach.la_negatie_nu:
    title: 'Nu am: kein Artikel'
    gloss: 'Nach nu am verwenden Sie kein un oder o: Nu am timp, nu am niciun animal de companie.'
    note: 'Es ist genau das Muster, das Sie schon von *Nu am timp* kennen: keine neue Grammatik, nur ein neues Nomen dafür.'
  ro.a1.unit32.lesson02.teach.a_scoate_la:
    title: (Ein Tier) ausführen
    gloss: (ein Tier) ausführen, mit dem Hund rausgehen
    note: '*A scoate la plimbare* ist eine feste Wendung; siehe die Grammatikerklärung.'
    example_gloss: Ich gehe jeden Tag mit dem Hund spazieren.
  ro.a1.unit32.lesson02.teach.verbul_se_schimba:
    title: Das Verb ändert sich mit der Person
    gloss: 'Das Verb ändert sich mit der Person: eu scot, tu scoți, el scoate (ich führe, du führst, er führt) den Hund spazieren.'
    note: 'Rumänische Verben ändern ihre Endung je nach Person, daher wird *a scoate la plimbare* wie ein einziges Verb konjugiert: *scot*, *scoți*, *scoate*.'
  ro.a1.unit32.lesson02.teach.a_da_de:
    title: Füttern
    gloss: füttern
    example_gloss: Ich füttere jeden Tag die Katze.
  ro.a1.unit32.lesson02.teach.a_se_juca:
    title: Spielen mit
    gloss: spielen mit
    example_gloss: Andrei spielt mit seiner Katze.
  ro.a1.unit32.lesson02.teach.scot_cainele_la:
    title: Ich gehe jeden Tag mit dem Hund spazieren
    gloss: Ich gehe jeden Tag mit dem Hund spazieren.
    note: Verbindet *a scoate la plimbare* mit *în fiecare zi* (jeden Tag), das Sie aus einer früheren Lektion kennen.
  ro.a1.unit32.lesson02.teach.dau_de_mancare:
    title: Ich füttere jeden Tag die Katze
    gloss: Ich füttere jeden Tag die Katze.
    note: 'Verbindet *a da de mâncare* mit *în fiecare zi*; das Tier steht im Dativ: *pisicii*.'
  ro.a1.unit32.lesson03.teach.plural_caine_caini:
    title: 'Plural: câine → câini'
    gloss: 'Plural: câine → câini, animal → animale, pisică → pisici.'
    note: Das regelmäßige rumänische Pluralmuster, hier zum ersten Mal mit Tiernamen als Beispielen eingeführt.
  ro.a1.unit32.lesson03.teach.caini_pisici:
    title: Hunde und Katzen
    gloss: Hunde / Katzen
    example_gloss:
    - Mihai liebt Hunde.
    - Elena liebt Katzen.
  ro.a1.unit32.lesson03.teach.pesti_pasari:
    title: Fische und Vögel (Plural)
    gloss: Fische / Vögel
    example_gloss:
    - Ich liebe Fische.
    - Opa liebt Vögel.
  ro.a1.unit32.lesson03.teach.iubesc_animalele:
    title: Ich liebe Tiere
    gloss: Ich liebe Tiere.
    note: '*A iubi* („lieben“) steht mit direktem Objekt, ohne Präposition: *Iubesc animalele*; der Artikel *-le* zeigt, dass Tiere im Allgemeinen gemeint sind.'
  ro.a1.unit32.lesson03.teach.elena_iubeste_pisicile:
    title: Elena liebt Katzen, hat aber kein Haustier
    gloss: Elena liebt Katzen, hat aber kein Haustier.
    note: Bereitet den Gegensatz vor, um den sich der Lesetext der Lektion dreht.
  ro.a1.unit32.lesson04.teach.mihai_ai_un:
    title: Mihai fragt nach einem Haustier
    gloss: 'Mihai: Hast du ein Haustier, Ana?'
  ro.a1.unit32.lesson04.teach.ana_da_am:
    title: Ana hat einen Hund
    gloss: 'Ana: Ja, ich habe einen Hund.'
  ro.a1.unit32.lesson04.teach.mihai_cum_arata:
    title: Mihai fragt, wie er aussieht
    gloss: 'Mihai: Wie sieht er aus?'
    note: Dieselbe Frage *Cum arată ...?* wie in der Lektion über das Aussehen, hier nun über ein Tier.
  ro.a1.unit32.lesson04.teach.ana_are_blana:
    title: Ana beschreibt ihren Hund
    gloss: 'Ana: Er hat braunes Fell und ist klein.'
    note: Greift Wortschatz zu Haarfarbe und Größe aus der Lektion zum Aussehen wieder auf, hier für das Fell eines Tieres statt für die Haare eines Menschen.
  ro.a1.unit32.lesson04.teach.pentru_un_animal:
    title: El und ea für Tiere
    gloss: 'Für ein Tier verwenden Sie el oder ea, je nach Genus: câinele ist el, pisica ist ea.'
    note: Bisher bezogen sich *el* und *ea* in diesem Kurs immer auf Personen; hier gelten sie auch für Tiere, je nach Genus des Nomens.
  ro.a1.unit32.lesson04.teach.mihai_il_scoti:
    title: Mihai fragt nach dem Spazierengehen
    gloss: 'Mihai: Gehst du jeden Tag mit ihm spazieren?'
  ro.a1.unit32.lesson04.teach.ana_da_il:
    title: Ana beschreibt ihren Alltag
    gloss: 'Ana: Ja, ich gehe jeden Tag mit ihm spazieren und füttere ihn.'
  ro.a1.unit32.lesson05.teach.mihai_si_elena:
    title: Mihai, Elena und Andrei über Tiere
    gloss: 'Mihai und Elena lieben beide Tiere, aber keiner von beiden hat ein Haustier. Mihai liebt Hunde und Elena liebt Katzen. Andrei dagegen hat ein Haustier: eine Katze. Er spielt oft mit seiner Katze und füttert sie jeden Tag. Haben Sie ein Haustier?'
    note: Stellt gegenüber, ein Tier zu lieben und es wirklich zu besitzen – das ist der kommunikative Kern dieser Lektion.
    glosses:
      iubesc: lieben
      amândoi: beide
      animalele: Tiere
      doi: beide
      companie: Haustier
      câinii: Hunde
      pisicile: Katzen
      pisică: Katze
      joacă: spielt
      dă: gibt
      fiecare: jeder
      mâncare: Futter
  ro.a1.unit32.lesson05.teach.andrei_se_joaca:
    title: Andrei spielt oft mit seiner Katze
    gloss: Andrei spielt oft mit seiner Katze.
    note: '*Des* (oft) ist das Häufigkeitswort aus der Hobby-Lektion; *a se juca cu* („spielen mit“) ist ein reflexives Verb.'
  ro.a1.unit32.lesson05.teach.iubesc_cainii_nu:
    title: Ich liebe Hunde. Ich habe kein Haustier.
    gloss: Ich liebe Hunde. Ich habe kein Haustier.
    note: Eine Muster-Antwort in zwei Sätzen, die Sie für die Schreibaufgabe der Lektion übernehmen können.
  ro.a1.unit32.lesson06.teach.ana_nina_ai:
    title: Ana fragt Nina
    gloss: 'Ana: Nina, hast du auch ein Haustier?'
  ro.a1.unit32.lesson06.teach.nina_da_am:
    title: Nina hat einen Vogel namens Pico
    gloss: 'Nina: Ja, ich habe einen Vogel. Er heißt Pico.'
    note: '*O cheamă* („heißt“) verwendet wieder das Verb *a chema* für den Namen; ein Vogel ist feminin, daher lautet das Pronomen *o*.'
  ro.a1.unit32.lesson06.teach.mihai_ce_frumos:
    title: Mihai reagiert
    gloss: 'Mihai: Wie schön! Was machst du jeden Tag mit ihm?'
  ro.a1.unit32.lesson06.teach.nina_ii_dau:
    title: Nina füttert ihn jeden Tag
    gloss: 'Nina: Ich füttere ihn jeden Tag.'
  ro.a1.unit32.lesson06.teach.mihai_iubesc_si:
    title: Mihai liebt Vögel auch
    gloss: 'Mihai: Ich liebe Vögel auch.'
  ro.a1.unit32.lesson06.teach.ana_ce_frumos:
    title: Ana beendet das Gespräch
    gloss: 'Ana: Wie schön, dass wir drei Tiere lieben!'
    note: Schließt den Kreis um alle Aussagen der drei Personen zu Tieren in dieser Lektion.
