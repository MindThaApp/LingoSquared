    title: Wer nutzt was?
    gloss: Ana ruft Mihai jeden Tag an. Sie benutzt ihr Telefon, keine App. Mihai hat zu Hause keinen Computer, aber er nutzt das Internet auf seinem Telefon. Andrei schlägt jeden Morgen die Wettervorhersage nach. Dann geht er joggen. Elena schickt Ana oft eine Nachricht. Benutzen Sie auch jeden Tag Ihr Telefon?
