    title: 'Neutrale Nomen: *mesaj*'
    gloss: '*Mesaj* ist ein neutrales Nomen: *un mesaj* (eins), *două mesaje* (zwei). Der bestimmte Artikel wird hinten angehängt: *mesajul*.'
