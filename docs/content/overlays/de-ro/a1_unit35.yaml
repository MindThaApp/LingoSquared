    title: Die Verbendungen ändern sich je nach Person
    gloss: '*A căuta* (nachschlagen, suchen) verändert sich je nach Person: *eu caut*, *tu cauți*. *A folosi* funktioniert genauso: *eu folosesc*, *tu folosești*.'
    note: Die Endung zeigt, wer handelt, deshalb lässt man im Rumänischen *eu* und *tu* oft weg.
