  ro.a1.unit20.lesson01.un_tricou_rosu:
    title: Ein rotes T-Shirt
  ro.a1.unit20.lesson02.ce_marime:
    title: Welche Größe?
  ro.a1.unit20.lesson03.la_magazin:
    title: Im Geschäft
teaching:
  ro.a1.unit20.lesson01.teach.reminder_vreau_un_ce:
    title: 'Wiederholung: Vreau, Un, Ce'
    gloss: Vreau (ich möchte) · Un (ein, m./n.) · Ce (was/welche)
    note: '*Vreau* (ich möchte), *un* (ein) und *ce* (was, wie in *Ce mai faceți?*) kennen Sie schon – hier werden sie verwendet, um nach einem Kleidungsstück zu fragen.'
  ro.a1.unit20.lesson01.teach.tricou_vocab:
    title: T-Shirt
    gloss: Tricou (T-Shirt)
    note: Ein sächliches Substantiv – es steht mit demselben *un* (nicht *o*) wie andere bereits gelernte maskuline/neutrale Substantive, etwa *un leu*.
    example_gloss:
    - Ich möchte ein T-Shirt.
  ro.a1.unit20.lesson01.teach.culoare_vocab:
    title: Farbe
    gloss: Culoare (Farbe)
    note: Ein feminines Substantiv, nützlich, um zu fragen, in welcher Farbe etwas erhältlich ist.
    example_gloss:
    - Welche Farbe?
  ro.a1.unit20.lesson01.teach.rosu_vocab:
    title: Rot
    gloss: Roșu (rot)
    note: 'Steht nach dem Substantiv, das es beschreibt – die übliche rumänische Stellung des Adjektivs: *tricou roșu*, wörtlich „T-Shirt rot“.'
    example_gloss:
    - Ich möchte ein rotes T-Shirt.
  ro.a1.unit20.lesson01.teach.albastru_vocab:
    title: Blau
    gloss: Albastru (blau)
    note: 'Gleiches Muster wie bei *roșu* – es steht nach dem Substantiv: *tricou albastru*.'
    example_gloss:
    - Ich möchte ein blaues T-Shirt.
  ro.a1.unit20.lesson01.teach.vreau_tricou_rosu_phrase:
    title: Ich möchte ein rotes T-Shirt.
    gloss: Vreau un tricou roșu.
    note: 'Die zentrale Bitte: *vreau* (ich möchte) + *un tricou* (ein T-Shirt) + *roșu* (rot), wobei die Farbe nach dem Substantiv steht.'
  ro.a1.unit20.lesson02.teach.reminder_cat_costa_va_rog:
    title: 'Wiederholung: Cât, Costă, Vă, Rog'
    gloss: Cât costă? (Was kostet es?) · Vă rog (bitte, höflich)
    note: '*Cât costă?* kennen Sie aus der Markt-Lektion; *vă rog* ist das höfliche „bitte“ – hier wird es verwendet, um nach dem Preis eines Kleidungsstücks zu fragen und die Bitte höflicher zu machen.'
  ro.a1.unit20.lesson02.teach.reminder_mic_mica_mare:
    title: 'Wiederholung: Mic, Mică, Mare'
    gloss: Mic/Mică (klein, m.-n./f.) · Mare (groß, gleiche Form für Maskulinum und Femininum im Singular)
    note: Die Größenwörter kennen Sie schon aus dem Vergleich von Speisen und Getränken – hier werden sie für Kleidergrößen verwendet.
  ro.a1.unit20.lesson02.teach.pantaloni_vocab:
    title: Hose
    gloss: Pantaloni (Hose)
    note: Wird im Rumänischen normalerweise im Plural verwendet – *pantaloni* bedeutet eine Hose. (Im Deutschen steht „Hose“ im Singular, im Rumänischen dagegen der Plural.)
    example_gloss:
    - Ich möchte eine Hose.
  ro.a1.unit20.lesson02.teach.marime_vocab:
    title: Größe
    gloss: Mărime (Größe)
    note: Ein feminines Substantiv – es passt zum femininen *mică* (klein), an das oben erinnert wurde, und zum unveränderlichen *mare* (groß).
    example_gloss:
    - Welche Größe?
  ro.a1.unit20.lesson02.teach.ce_marime_phrase:
    title: Welche Größe?
    gloss: Ce mărime? (Welche Größe?)
    note: Die alltägliche Frage am Ladentisch – kurz und ohne Verb, in derselben verkürzten Form wie *Ce culoare?* (Welche Farbe?).
  ro.a1.unit20.lesson02.teach.marime_mica_va_rog_phrase:
    title: Kleine Größe, bitte.
    gloss: Mărime mică, vă rog.
    note: '*Mică* ist die feminine Form von *mic* und passt zum femininen *mărime* – kombiniert mit dem bereits bekannten *vă rog*, um höflich die eigene Größe zu nennen.'
  ro.a1.unit20.lesson02.teach.cat_costa_pantalonii_phrase:
    title: Was kostet die Hose?
    gloss: Cât costă pantalonii? (Was kostet die Hose?)
    note: '*Pantalonii* ist die bestimmte Form von *pantaloni* („die Hose“) – maskuline Pluralnomen erhalten für „der/die/das“ die Endung *-i* (*pantaloni* → *pantalonii*). Kombiniert mit dem bekannten *cât costă*.'
  ro.a1.unit20.lesson03.teach.reminder_buna_multumesc_bine_la_revedere_si:
    title: 'Wiederholung: Bună, Mulțumesc, Bine, La revedere, Și'
    gloss: Bună (hallo) · Mulțumesc (danke) · Bine (gut) · La revedere (auf Wiedersehen) · Și (und)
    note: Alltägliche Grußformeln plus *și* (und) – hier verwendet, um das Gespräch im Geschäft zu beginnen und zu beenden.
  ro.a1.unit20.lesson03.teach.reminder_zece_douazeci_de_lei:
    title: 'Wiederholung: Zece, Douăzeci, De, Lei'
    gloss: Zece (zehn) · Douăzeci (zwanzig) · De (von, vor lei ab 20) · Lei (Währung, Plural von leu)
    note: Zahlen und die Währung *leu/lei* kennen Sie schon – hier werden sie für die Preise von T-Shirt und Hose verwendet.
  ro.a1.unit20.lesson03.teach.line01:
    title: Mihai begrüßen und ein rotes T-Shirt verlangen
    gloss: Ana begrüßt Mihai und sagt, dass sie ein rotes T-Shirt möchte.
    note: 'Der Satz für die Bitte aus der ersten Lektion: *Vreau un tricou roșu.*'
  ro.a1.unit20.lesson03.teach.line02:
    title: Nach der Größe fragen
    gloss: Mihai fragt, welche Größe sie möchte.
    note: 'Die alltägliche Frage im Geschäft: *Ce mărime?* (Welche Größe?).'
  ro.a1.unit20.lesson03.teach.line03:
    title: Die Größe höflich nennen und nach dem Preis fragen
    gloss: Ana bittet um eine kleine Größe und fragt dann, was es kostet.
    note: '*Mărime mică, vă rog* (kleine Größe, bitte), dann *Cât costă?* (Was kostet es?).'
  ro.a1.unit20.lesson03.teach.line04:
    title: Den Preis nennen
    gloss: Mihai sagt, dass es fünfzig Lei kostet.
    note: Verwendet das bereits bekannte *cincizeci de lei*.
  ro.a1.unit20.lesson03.teach.line05:
    title: Zustimmen und auch nach der Hose fragen
    gloss: Ana stimmt zu, sagt dann, dass sie auch eine Hose möchte, und fragt nach dem Preis.
    note: '*Și* bedeutet hier „auch“: *Vreau și pantaloni* – „Ich möchte auch eine Hose.“'
  ro.a1.unit20.lesson03.teach.line06:
    title: Den Preis der Hose nennen
    gloss: Mihai sagt, dass die Hose hundertzwanzig Lei kostet.
    note: 'Ab zwanzig steht im Rumänischen *de* zwischen der Zahl und dem Substantiv: *o sută douăzeci de lei*.'
  ro.a1.unit20.lesson03.teach.line07:
    title: Sich bei Mihai bedanken und verabschieden
    gloss: Ana bedankt sich und verabschiedet sich.
    note: Ein höfliches Danke und Auf Wiedersehen.
  ro.a1.unit20.lesson03.teach.line08:
    title: Sich verabschieden
    gloss: Mihai verabschiedet sich.
    note: Ein einfacher Abschied, ergänzt um Anas Namen.
