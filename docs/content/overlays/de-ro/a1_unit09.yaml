answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit introduces the course's first imperative form, "Mergeți" (go) -- the dumneavoastră/formal-plural imperative, matching the course's established dumneavoastră-as-safe-default policy. No tu-register imperative is taught or accepted here. Ana and Mihai's direction-giving dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08.
course:
  title: Rumänisch A1
  description: Nach dem Weg fragen und kurzen Wegbeschreibungen folgen auf Rumänisch – Cum pot să ajung...? (Wie komme ich zu ...?), Mergeți înainte (gehen Sie geradeaus), la dreapta / la stânga (nach rechts / nach links) und aici / acolo (hier / dort) – mit Ana und Mihai, wobei Ana Mihai fragt, wie sie zum Bahnhof kommt.
units:
  ro.a1.unit09.directions:
    title: Wegbeschreibungen
lessons:
  ro.a1.unit09.lesson01.cum_ajung:
    title: Wie komme ich zu ...?
  ro.a1.unit09.lesson02.dreapta_stanga:
    title: Nach rechts, nach links
  ro.a1.unit09.lesson03.pe_strada:
    title: Auf der Straße
teaching:
  ro.a1.unit09.lesson01.teach.reminder_unde_este_locuri:
    title: 'Wiederholung: unde, este, gară, magazin, bancă, aproape'
    gloss: unde (wo) · este (ist) · gară (Bahnhof) · magazin (Geschäft) · bancă (Bank) · aproape (nah)
    note: Alles schon bekannt – unde seit Lektion 7, este seit Lektion 3/4, gară/magazin/bancă/aproape seit Lektion 8 – hier verbinden sich die Wörter zu den Fragen und Beispielen dieser Lektion zur Wegbeschreibung.
  ro.a1.unit09.lesson01.teach.cum_pot_sa_ajung:
    title: Wie komme ich zu ...?
    gloss: Cum pot să ajung...? (Wie komme ich zu ...?)
    note: Die übliche Art, nach dem Weg zu einem Ort zu fragen – *pot* (ich kann) kam schon in *Unde pot să cumpăr...?* aus Lektion 7 vor; *ajung* (ich gelange / komme an) ist neu.
  ro.a1.unit09.lesson01.teach.mergeti_vocab:
    title: Gehen Sie
    gloss: Mergeți (gehen Sie – höfliche Aufforderung)
    note: '*Mergeți* ist die Befehlsform der Höflichkeitsform (dumneavoastră) – die höfliche Art, jemanden aufzufordern zu gehen, passend dazu, wie Ana und Mihai bereits miteinander sprechen.'
    example_gloss:
    - Gehen Sie geradeaus.
  ro.a1.unit09.lesson01.teach.inainte_vocab:
    title: Geradeaus
    gloss: înainte (geradeaus)
    note: Wird mit *Mergeți* kombiniert und ergibt die einfachste Wegbeschreibung.
    example_gloss:
    - Gehen Sie geradeaus.
  ro.a1.unit09.lesson01.teach.mergeti_inainte_phrase:
    title: Geradeaus gehen
    gloss: Mergeți înainte. (Gehen Sie geradeaus.)
    note: Eine kurze, vollständige Wegangabe – die einfachste Antwort auf *Cum pot să ajung...?*
  ro.a1.unit09.lesson01.teach.cum_ajung_gara:
    title: Wie komme ich zum Bahnhof?
    gloss: Cum pot să ajung la gară? (Wie komme ich zum Bahnhof?)
    note: 'Verbindet *Cum pot să ajung...?* und *gară* in einer vollständigen Frage – *la* (zu) verknüpft die Frage mit dem Ziel. Nach *la* behält der Ort seine Grundform: *la gară*, nicht *la gara*.'
  ro.a1.unit09.lesson01.teach.cum_ajung_banca:
    title: Wie komme ich zur Bank?
    gloss: Cum pot să ajung la bancă? (Wie komme ich zur Bank?)
    note: Dasselbe Muster, jetzt mit der Bank – eine naheliegende Frage, denn in Lektion 8 wurde bereits gesagt, dass die Bank weit weg ist.
  ro.a1.unit09.lesson02.teach.dreapta_stanga_vocab:
    title: Nach rechts, nach links
    gloss: la dreapta (nach rechts) · la stânga (nach links)
    note: 'Die beiden grundlegenden Abbiegerichtungen – lernen Sie sie als feste Paare mit *la* (zu): *la dreapta*, *la stânga*.'
    example_gloss:
    - Gehen Sie nach rechts.
    - Gehen Sie nach links.
  ro.a1.unit09.lesson02.teach.mergeti_dreapta_phrase:
    title: Gehen Sie nach rechts
    gloss: Mergeți la dreapta. (Gehen Sie nach rechts.)
    note: Dieselbe Aufforderung *Mergeți* wie in *Mergeți înainte.*, jetzt mit einer Abbiegerichtung statt geradeaus.
  ro.a1.unit09.lesson02.teach.mergeti_stanga_phrase:
    title: Gehen Sie nach links
    gloss: Mergeți la stânga. (Gehen Sie nach links.)
    note: Die entgegengesetzte Richtung – dasselbe einfache Muster.
  ro.a1.unit09.lesson02.teach.aici_acolo_vocab:
    title: Hier, dort
    gloss: aici (hier) · acolo (dort)
    note: Eine einfache Möglichkeit, zu zeigen, wo etwas ist, wenn man angekommen ist oder es sehen kann; anders als aproape/departe aus Lektion 8, die die Entfernung beschreiben, nicht die Position.
    example_gloss:
    - Das Geschäft ist hier.
    - Der Bahnhof ist dort drüben.
  ro.a1.unit09.lesson02.teach.magazinul_aici_phrase:
    title: Das Geschäft ist hier
    gloss: Magazinul este aici. (Das Geschäft ist hier.)
    note: Eine kurze, vollständige Aussage – *aici* zeigt auf etwas genau dort, wo Sie sind.
  ro.a1.unit09.lesson02.teach.gara_acolo_phrase:
    title: Der Bahnhof ist dort drüben
    gloss: Gara este acolo. (Der Bahnhof ist dort drüben.)
    note: '*Acolo* zeigt auf etwas Sichtbares, das aber nicht genau dort ist, wo Sie sind – der natürliche Abschluss einer Wegbeschreibung.'
  ro.a1.unit09.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Wiederholung: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (hallo) · mulțumesc (danke) · la revedere (auf Wiedersehen) · da (ja) · Ana, Mihai (Namen)
    note: Alles bereits in früheren Lektionen eingeführt – hier fragt Ana Mihai nach dem Weg.
  ro.a1.unit09.lesson03.teach.apoi:
    title: Dann
    gloss: apoi (dann / danach)
    note: Verbindet zwei Wegschritte zu einer Anweisung – so gibt man natürlich mehrere Schritte auf einmal an.
    example_gloss:
    - Gehen Sie geradeaus, dann nach rechts.
  ro.a1.unit09.lesson03.teach.line01:
    title: Begrüßen und nach dem Weg zum Bahnhof fragen
    gloss: Ana begrüßt Mihai und fragt, wie sie zum Bahnhof kommt.
    note: Verbindet *Cum pot să ajung* aus dieser Lektion mit der Begrüßung aus Lektion 1.
  ro.a1.unit09.lesson03.teach.line02:
    title: Zwei Wegschritte angeben
    gloss: Mihai sagt, sie soll geradeaus gehen und dann nach rechts.
    note: Greift *Mergeți înainte* und *la dreapta* aus dieser Lektion wieder auf, verbunden mit *apoi*.
  ro.a1.unit09.lesson03.teach.line03:
    title: Fragen, ob es nah ist
    gloss: Ana fragt, ob der Bahnhof nah ist.
    note: Eine kurze Nachfrage mit *este* und *aproape* aus Lektion 8.
  ro.a1.unit09.lesson03.teach.line04:
    title: Bestätigen und darauf zeigen
    gloss: Mihai bestätigt, dass es nah ist, und zeigt, dass der Bahnhof dort drüben liegt.
    note: Verbindet *aproape* und *acolo* – Entfernung und Position – in einer Zeile.
  ro.a1.unit09.lesson03.teach.line05:
    title: Danken und sich verabschieden
    gloss: Ana bedankt sich bei Mihai und verabschiedet sich.
    note: Derselbe Abschluss wie in den Dialogen von Lektion 1 und 8.
  ro.a1.unit09.lesson03.teach.line06:
    title: Das Gespräch beenden
    gloss: Mihai verabschiedet sich ebenfalls und nennt Anas Namen.
    note: Dasselbe freundliche Schlussmuster, mit dem schon die Dialoge der Lektionen 1, 5, 6, 7 und 8 endeten.
