answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (casă, apartament, cameră, dormitor, bucătărie, baie, fereastră) is used only in person-invariant third-person statements ("Ana are...", "Mihai are...", "Unde este baia?", "Casa mea este mare"). No new tu/dumneavoastră form is introduced this unit; Ana and Mihai keep their existing formal register with each other in the dialogue's greeting lines.
course:
  title: Rumänisch A1
  description: Eine einfache Wohnsituation auf Rumänisch beschreiben – Casă (Haus), Apartament (Wohnung), Cameră (Zimmer), Dormitor (Schlafzimmer), Bucătărie (Küche), Baie (Badezimmer) und Fereastră (Fenster) –, während Mihai Ana besucht und die beiden darüber sprechen, wo sie wohnen.
units:
  ro.a1.unit18.housing:
    title: Wohnen
lessons:
  ro.a1.unit18.lesson01.casa_anei:
    title: Anas Haus
  ro.a1.unit18.lesson02.apartamentul_lui_mihai:
    title: Mihais Wohnung
  ro.a1.unit18.lesson03.vizita_la_ana:
    title: Der Besuch bei Ana
teaching:
  ro.a1.unit18.lesson01.teach.reminder_ana_mare:
    title: 'Wiederholung: Ana, mare'
    gloss: Ana (Name) · mare (groß)
    note: Ana ist der Name der Figur, seit Lektion 1 bekannt; *mare* kennen Sie aus Lektion 5/14. Diese Lektion verwendet beides, um ihr Haus zu beschreiben.
  ro.a1.unit18.lesson01.teach.reminder_articole_trei:
    title: 'Wiederholung: un, o, și, trei'
    gloss: un/o (ein/eine) · și (und) · trei (drei)
    note: '*Un*/*o*/*și* stammen aus Lektion 5, *trei* aus dem Zählen in Lektion 2. Diese Lektion nutzt alle vier, um Zimmer zu zählen und zu beschreiben.'
  ro.a1.unit18.lesson01.teach.are_vocab:
    title: Hat
    gloss: Are (er/sie/es hat)
    note: 'Eine neue Form von *a avea* (haben): *am* (ich habe, aus Lektion 2/5) und *aveți* (Sie haben, formell) kennen Sie schon. *Are* ist die Form der dritten Person und sagt, was jemand oder etwas hat.'
  ro.a1.unit18.lesson01.teach.casa_vocab:
    title: Haus
    gloss: Casă (Haus)
    note: Der Ort, an dem jemand wohnt.
    example_gloss:
    - Ana hat ein großes Haus.
  ro.a1.unit18.lesson01.teach.camera_vocab:
    title: Zimmer
    gloss: Cameră (Zimmer)
    note: Ein allgemeines Wort für einen Raum in einer Wohnung.
    example_gloss:
    - Ana hat ein großes Zimmer.
  ro.a1.unit18.lesson01.teach.camere_plural:
    title: Cameră → camere
    gloss: cameră (Zimmer) · camere (Zimmer, Mehrzahl)
    note: Der Plural von *cameră* ist *camere*; er steht, wenn man mehr als ein Zimmer zählt.
  ro.a1.unit18.lesson01.teach.dormitor_vocab:
    title: Schlafzimmer
    gloss: Dormitor (Schlafzimmer)
    note: Der Raum, in dem jemand schläft.
    example_gloss:
    - Ana hat ein Schlafzimmer.
  ro.a1.unit18.lesson01.teach.bucatarie_vocab:
    title: Küche
    gloss: Bucătărie (Küche)
    note: Der Raum, in dem man kocht.
    example_gloss:
    - Ana hat eine Küche.
  ro.a1.unit18.lesson01.teach.baie_vocab:
    title: Badezimmer
    gloss: Badezimmer
    note: Der Raum mit Badewanne oder Dusche und Toilette.
    example_gloss:
    - Ana hat ein Badezimmer.
  ro.a1.unit18.lesson01.teach.casa_mare_phrase:
    title: 'Ana hat ein großes Haus. Es hat drei Zimmer: ein Schlafzimmer, eine Küche und ein Badezimmer.'
    gloss: 'Ana hat ein großes Haus. Das Haus hat drei Zimmer: ein Schlafzimmer, eine Küche und ein Badezimmer.'
    note: 'Alle Wörter hier wurden bereits gelernt oder gerade eingeführt und sind zu zwei neuen Sätzen über Anas Haus kombiniert. *Casa* ist die bestimmte Form von *casă* – „das Haus“: Ein weibliches Nomen auf -ă tauscht das -ă gegen -a aus, wie *banca* (die Bank) in Lektion 8.'
  ro.a1.unit18.lesson02.teach.reminder_mihai_mic:
    title: 'Wiederholung: Mihai, mic'
    gloss: Mihai (Name) · mic (klein)
    note: Mihai ist der Name der Figur, der seit Lektion 1 bekannt ist; *mic* stammt aus Lektion 14. Diese Lektion verwendet beide, um seine Wohnung zu beschreiben.
  ro.a1.unit18.lesson02.teach.reminder_unde_este_doua:
    title: 'Wiederholung: unde, este, două'
    gloss: unde (wo) · este (ist) · două (zwei, weiblich)
    note: '*Unde* und *este* stammen aus Lektion 8 und 9; *două* ist die weibliche Form von „zwei“ aus Lektion 2. Diese Lektion verwendet alle drei, um nach Zimmern zu fragen und sie zu zählen.'
  ro.a1.unit18.lesson02.teach.apartament_vocab:
    title: Wohnung
    gloss: Wohnung
    note: Mihais Zuhause – eine kleinere Alternative zu Anas Haus.
    example_gloss:
    - Mihai hat eine kleine Wohnung.
  ro.a1.unit18.lesson02.teach.fereastra_vocab:
    title: Fenster
    gloss: Fenster
    note: '*Apartamentul* ist die bestimmte Form von *apartament* – „die Wohnung“: Ein sächliches Nomen auf Konsonant erhält -ul, wie *magazinul* (das Geschäft) in Lektion 8 (das weibliche *casă* wird dagegen zu *casa*).'
    example_gloss:
    - Die Wohnung hat ein großes Fenster.
  ro.a1.unit18.lesson02.teach.apartament_mic_phrase:
    title: 'Mihai hat eine kleine Wohnung. Sie hat zwei Zimmer: ein Schlafzimmer und eine Küche.'
    gloss: 'Mihai hat eine kleine Wohnung. Die Wohnung hat zwei Zimmer: ein Schlafzimmer und eine Küche.'
    note: Alle Wörter hier wurden bereits gelernt oder gerade eingeführt und sind zu zwei neuen Sätzen über Mihais Wohnung kombiniert.
  ro.a1.unit18.lesson02.teach.unde_este_baia_phrase:
    title: Wo ist das Badezimmer?
    gloss: Wo ist das Badezimmer?
    note: '*Baia* ist die bestimmte Form von *baie* – „das Badezimmer“. Eine nützliche Frage, wenn man bei jemandem zu Besuch ist.'
  ro.a1.unit18.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Wiederholung: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (Hallo) · Ce mai faceți? (Wie geht es Ihnen?) · Bine, mulțumesc (Gut, danke)
    note: Alles aus der Begrüßung in Lektion 1, hier wieder verwendet, um den Dialog dieser Lektion zu beginnen.
  ro.a1.unit18.lesson03.teach.reminder_la_revedere_mea_aproape_am:
    title: 'Wiederholung: La revedere, Mea, Aproape, Am'
    gloss: La revedere (Auf Wiedersehen) · Mea (meine, weiblich) · Aproape (nah/in der Nähe) · Am (ich habe)
    note: '*La revedere* stammt aus Lektion 1; *mea* aus *Mama mea* in Lektion 5; *aproape* aus den Antworten auf *Unde este...?* in Lektion 8 und 9; *am* aus Lektion 2 und 5. Alles wird hier im Dialog beim Besuch zu Hause wieder verwendet.'
  ro.a1.unit18.lesson03.teach.line01:
    title: Ana begrüßen und fragen, wie es ihr geht
    gloss: Mihai begrüßt Ana und fragt, wie es ihr geht.
    note: Verwendet die Begrüßung *Ce mai faceți?* aus Lektion 1 erneut.
  ro.a1.unit18.lesson03.teach.line02:
    title: Antworten und das eigene Haus beschreiben
    gloss: Ana antwortet und erzählt Mihai dann, dass ihr Haus groß ist und drei Zimmer hat.
    note: Verbindet *Bine, mulțumesc* aus Lektion 1 mit dem Satz aus der ersten Lerneinheit dieser Lektion.
  ro.a1.unit18.lesson03.teach.line03:
    title: Fragen, wo das Badezimmer ist
    gloss: Mihai fragt Ana, wo das Badezimmer ist.
    note: Verwendet den Satz aus der zweiten Lerneinheit dieser Lektion fast unverändert.
  ro.a1.unit18.lesson03.teach.line04:
    title: Antworten, wo das Badezimmer ist
    gloss: Ana sagt ihm, dass es in der Nähe ist.
    note: Verbindet *baia* mit *aproape*, dem gleichen Antwortmuster auf „Wo ist …?“, das in Lektion 8 und 9 schon vorkam.
  ro.a1.unit18.lesson03.teach.line05:
    title: Die eigene Wohnung beschreiben und sich verabschieden
    gloss: Mihai sagt, dass er eine kleine Wohnung mit zwei Zimmern hat, und verabschiedet sich dann.
    note: Verbindet den Satz aus der zweiten Lerneinheit dieser Lektion mit der Abschiedszeile aus Lektion 1.
  ro.a1.unit18.lesson03.teach.line06:
    title: Sich verabschieden
    gloss: Ana verabschiedet sich.
    note: Dasselbe Abschiedsmuster, mit dem jeder Dialog der früheren Lektionen endete.
