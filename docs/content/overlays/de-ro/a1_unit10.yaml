answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's new verbs are all first-person singular (mă trezesc, mănânc, beau, lucrez, merg, mă culc) and are register-neutral -- Romanian's first-person verb form is the same regardless of tu/dumneavoastră, and this unit introduces no second-person forms. Ana and Mihai's closing dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08/unit09.
course:
  title: Rumänisch A1
  description: Einen einfachen Tagesablauf auf Rumänisch beschreiben – mă trezesc (ich wache auf), mănânc / beau (ich esse / ich trinke), lucrez (ich arbeite), merg acasă (ich gehe nach Hause) und mă culc (ich gehe schlafen) – mit Ana und Mihai, wenn Ana Mihai nach seinem Tag fragt.
units:
  ro.a1.unit10.routines:
    title: Tagesablauf
lessons:
  ro.a1.unit10.lesson01.dimineata:
    title: Am Morgen
  ro.a1.unit10.lesson02.lucrez_merg_acasa:
    title: Ich arbeite, ich gehe nach Hause
  ro.a1.unit10.lesson03.rutina_mihai:
    title: Mihais Tagesablauf
teaching:
  ro.a1.unit10.lesson01.teach.reminder_dimineata_seara_noaptea_cafea_paine:
    title: 'Wiederholung: dimineața, seara, noaptea, cafea, pâine'
    gloss: dimineața (morgens) · seara (abends) · noaptea (nachts) · cafea (Kaffee) · pâine (Brot)
    note: Alles bereits bekannt – dimineața/seara/noaptea seit Lektion 4, cafea/pâine seit Lektion 6 – hier verbinden sie sich zu den Aussagen über den Tagesablauf dieser Lektion.
  ro.a1.unit10.lesson01.teach.ma_trezesc_vocab:
    title: Ich wache auf
    gloss: Mă trezesc (ich wache auf)
    note: '*Mă* ist das Reflexivpronomen, das schon in *mă numesc*/*mă cheamă* vorkam – für „aufwachen“ verwendet das Rumänische ein reflexives Verb, wörtlich „ich wecke mich“.'
    example_gloss:
    - Ich wache morgens auf.
  ro.a1.unit10.lesson01.teach.ma_trezesc_phrase:
    title: Ich wache morgens auf
    gloss: Mă trezesc dimineața. (Ich wache morgens auf.)
    note: Eine kurze, vollständige Aussage – der einfachstmögliche Satz über den Tagesablauf.
  ro.a1.unit10.lesson01.teach.mananc_vocab:
    title: Ich esse
    gloss: Mănânc (ich esse)
    note: Kein Pronomen „ich“ nötig – die Verbendung zeigt schon, wer spricht, dasselbe Muster wie bei *vreau*/*cumpăr*/*aș dori*.
    example_gloss:
    - Ich esse morgens Brot.
  ro.a1.unit10.lesson01.teach.beau_vocab:
    title: Ich trinke
    gloss: Beau (ich trinke)
    note: Passt natürlich zu den bekannten Getränken wie *cafea* und *ceai*.
    example_gloss:
    - Ich trinke morgens Kaffee.
  ro.a1.unit10.lesson01.teach.mananc_beau_phrase:
    title: Ich esse Brot und trinke Kaffee am Morgen
    gloss: Mănânc pâine și beau cafea dimineața. (Ich esse morgens Brot und trinke Kaffee.)
    note: Verbindet zwei Handlungen mit *și* (und), bekannt aus *ora unu și jumătate* in Lektion 4.
  ro.a1.unit10.lesson02.teach.lucrez_vocab:
    title: Ich arbeite
    gloss: Lucrez (ich arbeite)
    note: Die Ich-Form von *lucrează*, das schon in Lektion 4 Mihais Arbeit am Abend beschrieb.
    example_gloss:
    - Ich arbeite abends.
  ro.a1.unit10.lesson02.teach.lucrez_phrase:
    title: Ich arbeite abends
    gloss: Lucrez seara. (Ich arbeite abends.)
    note: Eine kurze, vollständige Aussage darüber, wann man arbeitet.
  ro.a1.unit10.lesson02.teach.merg_vocab:
    title: Ich gehe
    gloss: Merg (ich gehe)
    note: Die Ich-Form von *mergeți*, der bereits behandelten Aufforderungsform – dasselbe Verb, andere Person.
    example_gloss:
    - Ich gehe nach Hause.
  ro.a1.unit10.lesson02.teach.acasa_vocab:
    title: Wohnen
    gloss: Acasă (nach Hause / zu Hause)
    note: Ohne Präposition – *merg acasă*, nicht *merg la acasă*; acasă enthält „nach Hause“ schon in sich.
    example_gloss:
    - Ich gehe nachts nach Hause.
  ro.a1.unit10.lesson02.teach.merg_acasa_phrase:
    title: Ich gehe nachts nach Hause
    gloss: Merg acasă noaptea. (Ich gehe nachts nach Hause.)
    note: Eine kurze, vollständige Aussage – das natürliche Ende eines Arbeitstags.
  ro.a1.unit10.lesson02.teach.lucrez_merg_phrase:
    title: Ich arbeite abends und gehe nachts nach Hause
    gloss: Lucrez seara și merg acasă noaptea. (Ich arbeite abends und gehe nachts nach Hause.)
    note: Verbindet beide Aussagen dieser Lektion mit *și* zu einem Satz.
  ro.a1.unit10.lesson03.teach.reminder_cursul_incepe_ora_apoi:
    title: 'Wiederholung: cursul, începe, la ora nouă, apoi'
    gloss: cursul (der Kurs) · începe (beginnt) · la ora nouă (um neun Uhr) · apoi (dann)
    note: Cursul, începe und la ora nouă kennen Sie bereits aus Lektion 4 (Mihais Kurs beginnt um neun Uhr morgens); apoi kennen Sie aus Lektion 9. Hier verbinden sie sich zu Mihais eigenem Tagesablauf.
  ro.a1.unit10.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Wiederholung: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (hallo) · mulțumesc (danke) · la revedere (auf Wiedersehen) · da (ja) · Ana, Mihai (Namen)
    note: Alles schon aus früheren Lektionen bekannt. Hier fragt Ana Mihai nach seinem Tag.
  ro.a1.unit10.lesson03.teach.ma_culc_vocab:
    title: Ich gehe schlafen
    gloss: Mă culc (ich gehe schlafen)
    note: 'Ein weiteres reflexives Verb nach demselben Muster wie *mă trezesc*. Wörtlich: „Ich lege mich hin“.'
    example_gloss:
    - Ich gehe nachts schlafen.
  ro.a1.unit10.lesson03.teach.ma_culc_phrase:
    title: Ich gehe nachts schlafen
    gloss: Mă culc noaptea. (Ich gehe nachts schlafen.)
    note: Das natürliche Ende des Tages; es schließt die Routine ab, die mit *mă trezesc dimineața* begann.
  ro.a1.unit10.lesson03.teach.line01:
    title: Begrüßen und fragen, wann der Kurs beginnt
    gloss: Ana begrüßt Mihai und fragt, wann sein Kurs beginnt.
    note: Greift die Frage nach Mihais Kurs aus Lektion 4 wieder auf.
  ro.a1.unit10.lesson03.teach.line02:
    title: Mit der Kurszeit antworten
    gloss: Mihai sagt, dass sein Kurs um neun Uhr morgens beginnt.
    note: Genau dieselbe Antwort wie in Lektion 4, hier als Teil seines ausführlicheren Tagesablaufs.
  ro.a1.unit10.lesson03.teach.line03:
    title: Nach dem Abend fragen
    gloss: 'Ana stellt eine kurze Anschlussfrage: „Und abends?“'
    note: Eine natürliche, knappe Art, nach mehr vom Tagesablauf zu fragen, ohne neues Fragewort.
  ro.a1.unit10.lesson03.teach.line04:
    title: Den Rest des Tages beschreiben
    gloss: Mihai sagt, dass er abends arbeitet und dann nachts schlafen geht.
    note: Verbindet *lucrez* und *mă culc* dieser Lektion mit *apoi*; passt zu der Tatsache aus Lektion 4, dass Mihai abends arbeitet.
  ro.a1.unit10.lesson03.teach.line05:
    title: Danken und sich verabschieden
    gloss: Ana sagt „Gut!“, bedankt sich bei Mihai und verabschiedet sich.
    note: Derselbe Abschluss mit Dank wie in den Dialogen der Lektionen 1, 8 und 9.
  ro.a1.unit10.lesson03.teach.line06:
    title: Das Gespräch beenden
    gloss: Mihai verabschiedet sich ebenfalls und nennt Anas Namen.
    note: Dasselbe freundliche Schlussmuster wie in allen früheren Dialogen.
