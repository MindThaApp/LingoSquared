teaching:
  ro.a1.unit29.lesson01.teach.cat_costa_in:
    title: Nach dem Gesamtpreis fragen
    gloss: Wie viel kostet es insgesamt?
    note: '*În total* (insgesamt) macht klar, dass Sie den gesamten Preis meinen, nicht den eines einzelnen Artikels; *Cât costă?* fragt „Wie viel kostet es?“.'
  ro.a1.unit29.lesson01.teach.costa_douazeci_si:
    title: Den Gesamtpreis nennen
    gloss: Es kostet insgesamt hundert Lei.
    note: '*Costă* ist die er/sie/es-Form von *a costa* (kosten). Nach einer Zahl über 19 steht im Rumänischen *de* vor dem Nomen: *o sută de lei*.'
  ro.a1.unit29.lesson02.teach.a_plati_cu:
    title: Mit Karte oder bar bezahlen
    gloss: mit Karte bezahlen, bar bezahlen
    note: '*A plăti cu cardul* bedeutet mit Karte bezahlen und *a plăti în numerar* bedeutet bar bezahlen; *cu* heißt „mit“ und *în* heißt „in“.'
    example_gloss:
    - Kann ich hier mit Karte zahlen?
    - Ich zahle bar.
  ro.a1.unit29.lesson02.teach.pot_plati_cu:
    title: Fragen, ob Kartenzahlung möglich ist
    gloss: Kann ich hier mit Karte zahlen?
    note: '*Pot plăti* (ich kann bezahlen) ist *a putea* + Verb; *aici* (hier) bezieht die Frage auf den aktuellen Ort.'
  ro.a1.unit29.lesson02.teach.doriti_sa_platiti:
    title: Nach der Zahlungsart fragen
    gloss: Möchten Sie bar oder mit Karte zahlen?
    note: '*Doriți să plătiți ...?* ist die höfliche *dumneavoastră*-Form einer fremden Kassiererin; mit einem Freund würden Sie sagen: *Vrei să plătești ...?*'
  ro.a1.unit29.lesson03.teach.nota:
    title: Die Rechnung
    gloss: die Rechnung
    note: 'Ein feminines Nomen: *o notă*, *nota* (der Artikel wird hinten angehängt).'
    example_gloss: Teilen wir die Rechnung?
  ro.a1.unit29.lesson03.teach.hai_sa_impartim:
    title: Vorschlagen, die Rechnung zu teilen
    gloss: Teilen wir die Rechnung?
    note: '*Hai să* + Verb schlägt vor, etwas gemeinsam zu tun.'
  ro.a1.unit29.lesson03.teach.pot_plati_separat:
    title: Bitten, getrennt zu zahlen
    gloss: Darf ich getrennt bezahlen?
    note: '*Separat* (getrennt) steht nach *a plăti*; *Pot plăti separat?* ist die übliche Bitte, wenn jeder seinen eigenen Teil bezahlt.'
  ro.a1.unit29.lesson04.teach.restul:
    title: Das Wechselgeld
    gloss: das Wechselgeld
    note: '*Restul* heißt wörtlich „der Rest“; so bezeichnet das Rumänische das Wechselgeld, das man zurückbekommt. Der Artikel wird hinten angehängt.'
    example_gloss: Hier ist Ihr Wechselgeld.
  ro.a1.unit29.lesson04.teach.poftiti_restul:
    title: Wechselgeld zurückgeben
    gloss: Hier ist Ihr Wechselgeld.
    note: '*Poftiți* ist die höfliche *dumneavoastră*-Form und bedeutet „bitte sehr“; sie passt zum förmlichen Ton an der Kasse.'
  ro.a1.unit29.lesson04.teach.nu_am_nevoie:
    title: Wechselgeld ablehnen
    gloss: Ich brauche kein Wechselgeld.
    note: '*A avea nevoie de* (brauchen) steht mit *de*: *Nu am nevoie de rest*.'
  ro.a1.unit29.lesson05.teach.treizeci_si_cinci:
    title: Fünfunddreißig
    gloss: fünfunddreißig
    note: 'Das Rumänische bildet die Zahlen von 21 bis 99 mit *și*: *treizeci și cinci* (wörtlich „dreißig und fünf“) und setzt *de* vor das Nomen: *o sută treizeci și cinci de lei*.'
    example_gloss: Es kostet einhundertfünfunddreißig Lei.
  ro.a1.unit29.lesson05.teach.nota_doua_feluri:
    title: Eine Restaurantrechnung lesen
    gloss: 'Rechnung: zwei Hauptgerichte und zwei Kaffee. Gesamt: einhundertfünfunddreißig Lei. Mit Karte bezahlt.'
    note: Achten Sie darauf, was bestellt wurde, wie hoch der Gesamtbetrag ist und wie bezahlt wurde.
    glosses:
      Nota: Rechnung
      două: zwei
      feluri: Hauptgerichte
      cafele: Kaffee
      Total: Gesamtbetrag
      '135': einhundertfünfunddreißig
      lei: Lei
      Plătit: bezahlt
      cardul: Karte
  ro.a1.unit29.lesson06.teach.ana_hai_sa:
    title: Ana bittet um die Rechnung
    gloss: 'Ana: Sollen wir die Rechnung verlangen?'
    note: '*A cere* (verlangen) hat *nota* als direktes Objekt; *Hai să cerem nota?* schlägt vor, sie gemeinsam zu verlangen.'
  ro.a1.unit29.lesson06.teach.mihai_da_buna:
    title: Mihai fragt nach dem Gesamtbetrag
    gloss: 'Mihai: Ja, gute Idee. Wie viel kostet es insgesamt?'
    note: Greift die Frage *Cât costă în total?* aus Lektion 1 wieder auf.
  ro.a1.unit29.lesson06.teach.ana_sunt_treizeci:
    title: Ana nennt den Gesamtbetrag
    gloss: 'Ana: Es sind einhundertfünfunddreißig Lei. Sollen wir teilen?'
    note: '*Împărțim* ist die *noi*-Form (wir) von *a împărți* (aufteilen); *nota* ergibt sich aus dem Zusammenhang.'
  ro.a1.unit29.lesson06.teach.mihai_nu_lasa:
    title: Mihai besteht darauf zu bezahlen
    gloss: 'Mihai: Nein, lass mich heute bezahlen. Du hast mir so sehr geholfen.'
    note: '*Lasă-mă să* ... (lass mich ...) ist die übliche Art, anzubieten, etwas zu tun; *m-ai ajutat* („du hast mir geholfen“) ist eine Vergangenheitsform.'
  ro.a1.unit29.lesson06.teach.ana_ce_dragut:
    title: Ana ist gerührt
    gloss: 'Ana: Wie lieb von dir! Vielen Dank.'
    note: '*Ce drăguț din partea ta!* (wie lieb von dir) ist ein herzliches, häufiges Kompliment für eine großzügige Geste.'
  ro.a1.unit29.lesson06.teach.mihai_pot_plati:
    title: Mihai fragt nach Kartenzahlung
    gloss: 'Mihai: Kann ich hier mit Karte bezahlen?'
    note: Greift die Frage *Pot plăti cu cardul aici?* aus Lektion 2 wieder auf, jetzt im echten Restaurant.
  ro.a1.unit29.lesson06.teach.mihai_plateste_nota:
    title: 'Plătește: die er/sie-Form'
    gloss: Mihai bezahlt die Rechnung.
    note: '*Plătește* ist die er/sie-Form von *a plăti* (bezahlen).'
