answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (vreme, soare, cald, plouă, vânt, frig) is used only in person-invariant impersonal constructions ("Este soare," "Plouă," "Este vânt," "Este frig," "Cum este vremea?") with no register distinction of any kind. No new tu/ dumneavoastră form is introduced this unit; Ana and Mihai keep their existing formal register with each other in the dialogue's greeting/closing lines.
course:
  title: Rumänisch A1
  description: Das Wetter auf Rumänisch einfach beschreiben – Vreme (Wetter), Soare (Sonne/sonnig), Cald (warm), Plouă (es regnet), Vânt (Wind) und Frig (kalt) – während Ana und Mihai die Vorhersage für morgen prüfen und entscheiden, wann sie in den Park gehen.
units:
  ro.a1.unit19.weather:
    title: Wetter
lessons:
  ro.a1.unit19.lesson01.vremea_de_azi:
    title: Das Wetter heute
  ro.a1.unit19.lesson02.vremea_de_maine:
    title: Das Wetter von morgen
  ro.a1.unit19.lesson03.planul_de_sambata:
    title: Der Plan für Samstag
teaching:
  ro.a1.unit19.lesson01.teach.reminder_ana_este:
    title: 'Wiederholung: Ana, Este, Și'
    gloss: Ana (Name) · Este (ist) · Și (und)
    note: Ana ist der Name der Figur und kommt seit Lektion 1 vor; *este* stammt aus dem Orte-Wortschatz von Lektion 8; *și* aus Lektion 5. In dieser Lektion kommen alle drei vor, um das heutige Wetter zu beschreiben.
  ro.a1.unit19.lesson01.teach.reminder_astazi:
    title: 'Wiederholung: Astăzi'
    gloss: Astăzi (heute)
    note: Aus dem Datumswortschatz von Lektion 3 – hier wiederverwendet, um über das heutige Wetter zu sprechen.
  ro.a1.unit19.lesson01.teach.vreme_vocab:
    title: Wetter
    gloss: Vreme (Wetter)
    note: '*Vremea* ist die bestimmte Form von *vreme* – „das Wetter“: Ein weibliches Nomen auf -e hängt als Artikel ein -a an, wie *baie* → *baia* (das Badezimmer) in Lektion 18.'
    example_gloss:
    - Wie ist das Wetter?
  ro.a1.unit19.lesson01.teach.cum_este_vremea_phrase:
    title: Wie ist das Wetter?
    gloss: Cum este vremea? (Wie ist das Wetter?)
    note: So fragt man im Alltag nach dem Wetter – *cum* kennen Sie aus Lektion 1, 9 und 12.
  ro.a1.unit19.lesson01.teach.soare_vocab:
    title: Sonne / sonnig
    gloss: Soare (Sonne / sonnig)
    note: 'Wird mit *este* verwendet, um sonniges Wetter zu beschreiben: *Este soare* heißt wörtlich „es ist Sonne“ und bedeutet „es ist sonnig“.'
    example_gloss:
    - Heute ist es sonnig.
  ro.a1.unit19.lesson01.teach.cald_vocab:
    title: Warm / heiß
    gloss: Cald (warm / heiß)
    note: Ein unveränderliches Wetterwort – *Este cald* hat immer dieselbe Form, ohne Angleichung.
    example_gloss:
    - Heute ist es warm.
  ro.a1.unit19.lesson01.teach.astazi_soare_cald_phrase:
    title: Heute ist es sonnig. Es ist warm.
    gloss: Astăzi este soare. Este cald.
    note: Alle Wörter hier waren bereits bekannt oder sind gerade neu eingeführt und werden zu zwei neuen Sätzen über das heutige Wetter kombiniert.
  ro.a1.unit19.lesson02.teach.reminder_mihai_maine:
    title: 'Wiederholung: Mihai, Mâine'
    gloss: Mihai (Name) · Mâine (morgen)
    note: Mihai ist der Name der Figur und kommt seit Lektion 1 vor; *mâine* stammt aus Lektion 3 und 12. In dieser Lektion kommen beide vor, um die Vorhersage für morgen zu beschreiben.
  ro.a1.unit19.lesson02.teach.reminder_nu_mergem_la_parc:
    title: 'Wiederholung: Nu, Mergem, La parc'
    gloss: Nu (nein / nicht) · Mergem (wir gehen) · La parc (zum Park / in den Park)
    note: Alles aus dem Wortschatz zum Pläneschmieden in Lektion 11 – hier wiederverwendet, um zu entscheiden, ob das Wetter einen Ausflug in den Park erlaubt.
  ro.a1.unit19.lesson02.teach.ploua_vocab:
    title: Es regnet
    gloss: Plouă (es regnet)
    note: Eine unpersönliche Verbform – es braucht kein Subjekt, genauso wie *Este cald* keines braucht.
    example_gloss:
    - Morgen regnet es.
  ro.a1.unit19.lesson02.teach.vant_vocab:
    title: Wind
    gloss: Vânt (Wind)
    note: 'Wird mit *este* genauso verwendet wie *soare*: *Este vânt*, „es ist windig“.'
    example_gloss:
    - Morgen ist es windig.
  ro.a1.unit19.lesson02.teach.frig_vocab:
    title: Kalt
    gloss: Frig (kalt)
    note: 'Wird mit *este* verwendet: *Este frig*, „es ist kalt“.'
    example_gloss:
    - Morgen ist es kalt.
  ro.a1.unit19.lesson02.teach.maine_ploua_phrase:
    title: Morgen regnet es. Es ist windig und kalt.
    gloss: Mâine plouă. Este vânt și este frig.
    note: Alle Wörter hier waren bereits bekannt oder sind gerade neu eingeführt und werden zu einer vollständigen Vorhersage für morgen kombiniert.
  ro.a1.unit19.lesson02.teach.nu_mergem_phrase:
    title: Morgen gehen wir nicht in den Park.
    gloss: Nu mergem la parc mâine. (Wir gehen morgen nicht in den Park.)
    note: Der wetterabhängige Plan, auf den diese Lektion hinarbeitet – er verwendet *mergem* und *la parc* aus Lektion 11 mit *nu* davor.
  ro.a1.unit19.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Wiederholung: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (hallo) · Ce mai faceți? (Wie geht es Ihnen?) · Bine, mulțumesc (Gut, danke)
    note: Alles aus der Begrüßung in Lektion 1 – hier wiederverwendet, um den Dialog dieser Lektion zu eröffnen.
  ro.a1.unit19.lesson03.teach.reminder_sambata_la_revedere:
    title: 'Wiederholung: Sâmbătă, La revedere'
    gloss: Sâmbătă (Samstag) · La revedere (auf Wiedersehen)
    note: '*Sâmbătă* stammt aus Lektion 3, 11 und 12; *la revedere* aus Lektion 1 – beides wird im Dialog über das Wochenende wiederverwendet.'
  ro.a1.unit19.lesson03.teach.line01:
    title: Mihai begrüßen und fragen, wie es ihm geht
    gloss: Ana begrüßt Mihai und fragt, wie es ihm geht.
    note: Hier kehrt die Begrüßung *Ce mai faceți?* aus Lektion 1 wieder.
  ro.a1.unit19.lesson03.teach.line02:
    title: Antworten und nach dem Wetter von morgen fragen
    gloss: Mihai antwortet und fragt Ana dann, wie das Wetter morgen wird.
    note: Verbindet *Bine, mulțumesc* aus Lektion 1 mit der Wendung *Cum este vremea?* aus dem ersten Teil dieser Lektion, ergänzt um *mâine*.
  ro.a1.unit19.lesson03.teach.line03:
    title: Die Vorhersage für morgen beschreiben
    gloss: Ana sagt ihm, dass es regnen wird und dass es windig und kalt sein wird.
    note: Wiederholt genau den Satz aus dem zweiten Teil dieser Lektion.
  ro.a1.unit19.lesson03.teach.line04:
    title: Vorschlagen, nicht in den Park zu gehen, sondern am Samstag
    gloss: Mihai sagt, dass sie morgen nicht in den Park gehen, und fragt stattdessen nach Samstag.
    note: Verbindet den Satz aus dem zweiten Teil dieser Lektion mit *mergem* aus Lektion 11 und *sâmbătă* aus dieser Lektion.
  ro.a1.unit19.lesson03.teach.line05:
    title: Zustimmen und auf das sonnige Wetter am Samstag hinweisen
    gloss: Ana sagt, dass am Samstag die Sonne scheint, und stimmt dem Plan zu.
    note: Verbindet *soare* mit der Zustimmung *Da, bine!* aus Lektion 11.
  ro.a1.unit19.lesson03.teach.line06:
    title: Sich verabschieden
    gloss: Mihai verabschiedet sich.
    note: Dasselbe Schlussmuster, mit dem jeder frühere Dialog geendet hat.
  ro.a1.unit19.lesson03.teach.line07:
    title: Sich verabschieden
    gloss: Ana verabschiedet sich.
    note: Dasselbe Schlussmuster, mit dem jeder frühere Dialog geendet hat.
