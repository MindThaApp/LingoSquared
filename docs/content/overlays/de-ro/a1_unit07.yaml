answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: '"Vreau" (I want, plain) and "Aș dori" (I would like, polite, established in unit06) are a genuine directness contrast, not interchangeable synonyms -- accept either for a general "I want/I would like" unless an exercise explicitly names one. "Vă rog" (formal) and "te rog" (informal, both established in unit06) remain a register-sensitive pair here too. Ana and Mihai''s market dialogue keeps their existing polite register with each other (vă rog, not te rog).'
course:
  title: Rumänisch A1
  description: Preise und Mengen auf Rumänisch erfragen – die Währung leu/lei, scump/ieftin und der Einkauf von Marktwaren wie roșii (Tomaten) und cartofi (Kartoffeln) nach Kilogramm – Ana und Mihai gehen weiter auf dem Markt einkaufen.
units:
  ro.a1.unit07.shopping:
    title: Einkaufen
lessons:
  ro.a1.unit07.lesson01.cat_costa:
    title: Wie viel kostet es?
  ro.a1.unit07.lesson02.rosii_si_cartofi:
    title: Tomaten und Kartoffeln
  ro.a1.unit07.lesson03.la_piata:
    title: Auf dem Markt
teaching:
  ro.a1.unit07.lesson01.teach.reminder_un_numere:
    title: 'Wiederholung: un, doi, cinci, zece, douăzeci'
    gloss: un (ein) · doi (zwei) · cinci (fünf) · zece (zehn) · douăzeci (zwanzig)
    note: Alle sind schon aus früheren Lektionen bekannt (*un* aus Lektion 4, die Zahlen aus Lektion 2) – hier kehren sie für Preise wieder.
  ro.a1.unit07.lesson01.teach.cat_costa:
    title: Wie viel kostet es?
    gloss: Cât costă? (Wie viel kostet das?)
    note: So fragt man im Alltag auf Rumänisch nach dem Preis – mit dem Namen der Ware danach oder allein, wenn aus dem Zusammenhang klar ist, worum es geht.
  ro.a1.unit07.lesson01.teach.leu:
    title: Leu (Währung)
    gloss: 'leu (die rumänische Währungseinheit – Plural: lei)'
    note: Die Währung Rumäniens. Leu ist der Singular (ein Leu); der Plural lei ist unregelmäßig, nicht leu + eine normale Endung.
    example_gloss: Es kostet einen Leu.
  ro.a1.unit07.lesson01.teach.costa_cinci_lei:
    title: Es kostet acht Lei
    gloss: Costă opt lei. (Es kostet acht Lei.)
    note: Bei 2–19 steht lei einfach so – kein zusätzliches Wort davor.
  ro.a1.unit07.lesson01.teach.costa_douazeci_de_lei:
    title: Es kostet dreißig Lei
    gloss: Costă treizeci de lei. (Es kostet dreißig Lei.)
    note: Ab 20 steht im Rumänischen *de* vor dem gezählten Nomen – dieselbe Regel wie bei *ani* (Jahre) in Lektion 2, jetzt auf *lei* angewendet.
  ro.a1.unit07.lesson01.teach.leu_lei_de_rule:
    title: 'Regel: leu → lei, und wann de steht'
    gloss: 'leu → lei · Zahlen 2–19: kein *de* · Zahlen ab 20: mit *de*'
    note: Genau dasselbe Muster wie die *ani*-Regel aus Lektion 2 (câți ani ai / am treizeci de ani) – wenn Sie es bei einem Nomen kennen, gilt es genauso für lei.
  ro.a1.unit07.lesson01.teach.scump:
    title: Teuer
    gloss: scump (teuer)
    note: Eine übliche Reaktion auf einen Preis, den man zu hoch findet.
    example_gloss: Acht Lei? Teuer!
  ro.a1.unit07.lesson01.teach.ieftin:
    title: Billig
    gloss: ieftin (billig)
    note: Das Gegenteil von scump – ein guter Preis.
    example_gloss: Ein Leu? Billig!
  ro.a1.unit07.lesson02.teach.reminder_un_o_si_as_dori_rog:
    title: 'Wiederholung: un, o, și, aș dori, vă rog, te rog'
    gloss: un/o (ein/eine) · și (und) · aș dori (ich möchte) · vă rog (bitte, formell) · te rog (bitte, informell)
    note: '*Aș dori*, *vă rog* und *te rog* kamen zuerst in der Café-Szene in Lektion 6 vor – hier kehren sie auf dem Markt wieder.'
  ro.a1.unit07.lesson02.teach.piata:
    title: Markt
    gloss: piață (Markt)
    note: Ein feminines Nomen – der Markt unter freiem Himmel oder in einer Halle, wo man frische Lebensmittel kauft.
    example_gloss: Wie viel kostet das auf dem Markt?
  ro.a1.unit07.lesson02.teach.rosii:
    title: Tomaten
    gloss: roșii (Tomaten)
    note: Plural von roșie (eine Tomate) – man sagt es im Plural, wenn man allgemein vom Kauf spricht.
    example_gloss: Ich hätte gern Tomaten.
  ro.a1.unit07.lesson02.teach.cartofi:
    title: Kartoffeln
    gloss: cartofi (Kartoffeln)
    note: Plural von cartof (eine Kartoffel), nach demselben Muster wie roșii.
    example_gloss: Ich möchte Kartoffeln.
  ro.a1.unit07.lesson02.teach.kilogram:
    title: Kilogram
    gloss: kilogram (Kilogramm)
    note: 'Die übliche Einheit, um Obst und Gemüse nach Gewicht zu kaufen. *De* verbindet sie mit der Ware: kilogram *de* roșii, „ein Kilogramm Tomaten“.'
    example_gloss: Ein Kilogramm Tomaten.
  ro.a1.unit07.lesson02.teach.vreau:
    title: ich möchte
    gloss: vreau (ich will)
    note: Schlichter und direkter als *aș dori* („ich möchte“) – beides ist auf dem Markt in Ordnung, vreau ist nur weniger förmlich.
    example_gloss: Ich will Kartoffeln.
  ro.a1.unit07.lesson02.teach.unde_pot_sa_cumpar:
    title: Wo kann ich ... kaufen?
    gloss: Unde pot să cumpăr roșii? (Wo kann ich Tomaten kaufen?)
    note: Eine nützliche Frage, wenn Sie noch nicht wissen, wo Sie einkaufen können – ersetzen Sie roșii durch eine beliebige andere Ware.
  ro.a1.unit07.lesson02.teach.cat_costa_kilogram_rosii:
    title: Wie viel kostet ein Kilogramm Tomaten?
    gloss: Cât costă un kilogram de roșii? (Wie viel kostet ein Kilogramm Tomaten?)
    note: Verbindet Cât costă und die Konstruktion kilogram de ... in einer vollständigen Frage.
  ro.a1.unit07.lesson02.teach.vreau_kilogram_cartofi:
    title: Ich will ein Kilogramm Kartoffeln
    gloss: Vreau un kilogram de cartofi. (Ich will ein Kilogramm Kartoffeln.)
    note: Dasselbe Muster kilogram de ..., diesmal als Aussage mit vreau statt als Frage.
  ro.a1.unit07.lesson03.teach.reminder_buna_multumesc_la_revedere:
    title: 'Wiederholung: bună, ziua, mulțumesc, bine, la revedere, Ana, Mihai'
    gloss: bună ziua (guten Tag) · mulțumesc (danke) · bine (gut) · la revedere (auf Wiedersehen) · Ana, Mihai (Namen)
    note: Alles schon in den Dialogen von Lektion 1 und 6 eingeführt – hier begegnen sich Ana und Mihai wieder, diesmal auf dem Markt.
  ro.a1.unit07.lesson03.teach.line01:
    title: Begrüßen und nach dem Preis fragen
    gloss: Ana begrüßt Mihai und fragt nach dem Preis für ein Kilogramm Tomaten.
    note: Verbindet das Cât costă dieser Lektion mit der Begrüßung aus Lektion 1.
  ro.a1.unit07.lesson03.teach.line02:
    title: Den Preis nennen
    gloss: Mihai sagt, dass es acht Lei kostet, und findet es billig.
    note: Greift costă/opt lei/ieftin aus dieser Lektion wieder auf.
  ro.a1.unit07.lesson03.teach.line03:
    title: Höflich bestellen und etwas hinzufügen
    gloss: Ana ist einverstanden, bittet höflich um ein Kilogramm Tomaten und fügt hinzu, dass sie auch Kartoffeln will.
    note: Verbindet aș dori, vă rog und vreau – beide Stilebenen aus dem Wortschatz dieser Lektion in einer Zeile.
  ro.a1.unit07.lesson03.teach.line04:
    title: Den zweiten Preis nennen
    gloss: Mihai sagt, dass ein Kilogramm Kartoffeln fünf Lei kostet.
    note: Greift cinci (fünf) aus Lektion 2 wieder auf, das in dieser Lektion schon wiederholt wurde.
  ro.a1.unit07.lesson03.teach.line05:
    title: Danken und sich verabschieden
    gloss: Ana bedankt sich bei Mihai und verabschiedet sich.
    note: '*Mulțumesc* ist hier ein einfaches Dankeschön zum Abschluss, dasselbe Wort wie in *Bine, mulțumesc.* aus Lektion 1.'
  ro.a1.unit07.lesson03.teach.line06:
    title: Das Gespräch beenden
    gloss: Mihai verabschiedet sich ebenfalls und nennt dabei Anas Namen.
    note: Dasselbe freundliche Schlussmuster, mit dem schon die Dialoge in Lektion 1, 5 und 6 endeten.
