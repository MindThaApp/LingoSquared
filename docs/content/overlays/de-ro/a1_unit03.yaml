answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Day and month names are correctly lowercase in standard Romanian writing (except sentence-initially); accept a learner's answer regardless of the case they happen to type it in -- this unit teaches the lowercase convention as a fact to recognize, not a hard-graded spelling rule.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: Rumänisch A1
  description: Wochentage, Monate des Jahres und wie das Rumänische ein Kalenderdatum angibt (eine einfache Grundzahl plus Monat, außer beim 1., für den das besondere Wort întâi steht) – weiter mit Ana und Mihai, die ihr nächstes Treffen planen.
units:
  ro.a1.unit03.dates:
    title: Tage und Daten
lessons:
  ro.a1.unit03.lesson01.zilele_saptamanii:
    title: Wochentage
  ro.a1.unit03.lesson02.lunile_si_datele:
    title: Die Monate des Jahres und wie wir das Datum sagen
  ro.a1.unit03.lesson03.cand_ne_intalnim:
    title: Wann treffen wir uns wieder?
teaching:
  ro.a1.unit03.lesson01.teach.este:
    title: 'Zur Erinnerung: este'
    gloss: ist / es ist
    note: '*Este* kam schon in Lektion 2 vor (*Care este numărul...?*). Es ist unveränderlich – dasselbe Wort, ob das Subjekt ein Tag, ein Datum oder etwas anderes ist, und es ändert sich nicht zwischen tu und dumneavoastră.'
  ro.a1.unit03.lesson01.teach.astazi_maine:
    title: Heute, morgen
    gloss: astăzi (heute) / mâine (morgen)
    note: Beide sind unveränderliche Zeitwörter, die am Satzanfang stehen, wenn man sagt, welcher Tag oder welches Datum ist.
    example_gloss:
    - Heute ist Montag.
    - Morgen ist Dienstag.
  ro.a1.unit03.lesson01.teach.luni_marti:
    title: Montag, Dienstag
    gloss: luni (Montag) / marți (Dienstag)
    note: Um einen Tag zu nennen (Astăzi este luni), verwenden Sie die hier gezeigte einfache Form. Wochentage haben auch Formen mit Artikel – lunea, marțea –, die „montags“, „dienstags“ bedeuten; denen begegnen Sie später.
    example_gloss:
    - Heute ist Montag.
    - Morgen ist Dienstag.
  ro.a1.unit03.lesson01.teach.miercuri_joi:
    title: Mittwoch, Donnerstag
    gloss: miercuri (Mittwoch) / joi (Donnerstag)
    note: Wie luni und marți behalten miercuri und joi im Singular und im Plural dieselbe Form.
    example_gloss:
    - Heute ist Mittwoch.
    - Morgen ist Donnerstag.
  ro.a1.unit03.lesson01.teach.vineri_sambata:
    title: Freitag, Samstag
    gloss: vineri (Freitag) / sâmbătă (Samstag)
    note: Sâmbătă behält in der heutigen Rechtschreibung das â in der Wortmitte, anders als das ältere sîmbătă.
    example_gloss:
    - Heute ist Freitag.
    - Morgen ist Samstag.
  ro.a1.unit03.lesson01.teach.duminica:
    title: Sonntag
    gloss: Sonntag
    note: Duminică vervollständigt die Woche. Um zu sagen, welcher Tag ist, verwenden Sie diese einfache Form; die Form mit Artikel duminica bedeutet „sonntags“.
    example_gloss: Heute ist Sonntag.
  ro.a1.unit03.lesson01.teach.ce_zi_e_azi:
    title: Fragen, welcher Tag heute ist
    gloss: Welcher Tag ist heute?
    note: Die alltägliche Art zu fragen, welcher Wochentag ist – zi (Tag) ist hier das neue Wort, neben den bereits bekannten ce, este und astăzi.
  ro.a1.unit03.lesson01.teach.saptamana_ieri:
    title: Woche, gestern, letzte/nächste Woche
    gloss: săptămână (Woche) / ieri (gestern) / săptămâna trecută (letzte Woche) / săptămâna viitoare (nächste Woche)
    note: Ein zusätzlicher Wortschatz aus demselben Material wie die Wochentage – nützlich, um Zeitangaben relativ auszudrücken; in den Übungen dieser Lektion wird er nicht so intensiv geübt wie die Wochentage selbst.
  ro.a1.unit03.lesson01.teach.lowercase_zile:
    title: Wochentage werden kleingeschrieben
    gloss: 'Wochentage werden nicht großgeschrieben: luni, vineri.'
    note: Anders als im Deutschen, wo Wochentage als Substantive großgeschrieben werden, schreibt das Rumänische sie mitten im Satz klein – *luni*, nicht *Luni*, außer wenn das Wort den Satz eröffnet.
  ro.a1.unit03.lesson02.teach.ian_feb_mar:
    title: Januar, Februar, März
    gloss: ianuarie (Januar) / februarie (Februar) / martie (März)
    note: Anders als die Wochentagsnamen sind mehrere Monatsnamen leicht erkennbar, weil sie den deutschen (und lateinischen) Namen ähneln.
    example_gloss:
    - Es ist Januar.
    - Es ist Februar.
    - Es ist März.
  ro.a1.unit03.lesson02.teach.apr_mai_iun:
    title: April, Mai, Juni
    gloss: aprilie (April) / mai (Mai) / iunie (Juni)
    note: Mai (Mai) ist kurz, aber nicht zu verwechseln mit dem Adverb mai (mehr), das an anderer Stelle in diesem Kurs vorkommt (ce mai faci) – der Zusammenhang macht es immer klar.
    example_gloss:
    - Es ist April.
    - Es ist Mai.
    - Es ist Juni.
  ro.a1.unit03.lesson02.teach.iul_aug_sep:
    title: Juli, August, September
    gloss: iulie (Juli) / august (August) / septembrie (September)
    note: August wird im Rumänischen genauso geschrieben wie im Deutschen – eines der durchsichtigsten Verwandtschaftswörter dieser Gruppe.
    example_gloss:
    - Es ist Juli.
    - Es ist August.
    - Es ist September.
  ro.a1.unit03.lesson02.teach.oct_noi_dec:
    title: Oktober, November, Dezember
    gloss: octombrie (Oktober) / noiembrie (November) / decembrie (Dezember)
    note: Die letzten drei Monate vervollständigen die zwölf Monate; alle sind unveränderliche Substantive.
    example_gloss:
    - Es ist Oktober.
    - Es ist November.
    - Es ist Dezember.
  ro.a1.unit03.lesson02.teach.intai:
    title: Der Erste (des Monats)
    gloss: der Erste
    note: 'Eine typisch rumänische Regel: Der erste Tag eines Monats heißt in der Standardsprache nicht *unu* (einfaches „eins“), sondern hat ein eigenes Wort – *întâi*. (In der Umgangssprache hört man mitunter *unu*, aber *întâi* ist die Form, die Sie lernen sollten.) Alle anderen Daten ab dem Zweiten verwenden die gewöhnliche Grundzahl.'
    example_gloss: Heute ist der erste August.
  ro.a1.unit03.lesson02.teach.date_rule:
    title: Wie man im Rumänischen ein Datum nennt
    gloss: 'der 1.: întâi · ab dem 2.: die gewöhnliche Grundzahl (doi, trei, patru ...)'
    note: Ab dem 2. besteht ein rumänisches Datum nur aus der gewöhnlichen Grundzahl (die Sie schon kennen) und dem Monat – ohne Ordinalform und ohne zusätzliches Wort, z. B. *trei aprilie* (der dritte April, wörtlich „drei April“).
  ro.a1.unit03.lesson02.teach.ce_data:
    title: Nach dem Datum fragen
    gloss: Welches Datum ist heute?
    note: Dată (Datum) ist hier ein neues Wort; der Rest der Frage verwendet ce, este und astăzi genauso wie die Frage nach dem Tag in lesson01.
  ro.a1.unit03.lesson02.teach.raspuns_data:
    title: Ein Datum nennen
    gloss: Heute ist der dritte April.
    note: Trei (drei) ist die Grundzahl aus Unit 2; vor aprilie steht weder eine Ordinalendung noch ein zusätzliches Wort.
  ro.a1.unit03.lesson02.teach.la_multi_ani:
    title: Jemandem zu einem besonderen Tag gratulieren
    gloss: Alles Gute zum Geburtstag! / Ein frohes neues Jahr!
    note: Wörtlich „(auf) viele Jahre“ – der häufigste rumänische Glückwunsch zum Geburtstag, Namenstag oder Jahreswechsel; er enthält *ani* (Jahre) aus dem Altersvokabular von Unit 2.
  ro.a1.unit03.lesson02.teach.lowercase_luni:
    title: Auch Monate schreibt man klein
    gloss: 'Monatsnamen schreibt man nicht mit großem Anfangsbuchstaben: ianuarie, mai.'
    note: Dieselbe Regel wie bei den Wochentagen in lesson01 – rumänische Monatsnamen bleiben mitten im Satz kleingeschrieben.
  ro.a1.unit03.lesson03.teach.cand:
    title: Wann?
    gloss: wann?
    note: Când leitet eine Frage nach dem Zeitpunkt ein, genau wie „wann“ im Deutschen.
    example_gloss: Wann ist das Treffen?
  ro.a1.unit03.lesson03.teach.intalnirea:
    title: Das Treffen
    gloss: das Treffen
    note: Întâlnirea ist die bestimmte Form (das Treffen) – das Substantiv ohne Artikel lautet întâlnire.
    example_gloss: Das Treffen ist am Montag.
  ro.a1.unit03.lesson03.teach.cand_e_intalnirea:
    title: Fragen, wann etwas ist
    gloss: Wann ist das Treffen?
    note: Verbindet când mit dem bekannten este und dem neuen Wort întâlnirea.
  ro.a1.unit03.lesson03.teach.raspuns_intalnire:
    title: Das Datum eines Ereignisses nennen
    gloss: Das Treffen ist am Freitag, dem ersten August.
    note: Wochentag und Datum werden wie im Deutschen zusammen genannt und durch ein Komma getrennt.
  ro.a1.unit03.lesson03.teach.fara_de:
    title: Kein de bei Tagen und Daten
    gloss: 'Bei Tagen und Daten steht kein „de“: vineri, întâi august.'
    note: 'Ein nützlicher Gegensatz zur Regel aus Unit 2: Zahlen ab 20 brauchen *de* vor einem gewöhnlichen Substantiv (*treizeci de ani*), aber ein Wochentag oder ein Datum steht ganz ohne *de*.'
  ro.a1.unit03.lesson03.teach.line01:
    title: Fragen, wann das Treffen ist
    gloss: Ana fragt Mihai, wann ihr Treffen ist.
    note: Eine schlichte, neutrale Frage – este bleibt gleich, ob tu oder dumneavoastră.
  ro.a1.unit03.lesson03.teach.line02:
    title: Das Datum nennen
    gloss: Mihai sagt, das Treffen ist am Freitag, dem ersten August.
    note: 'Mihai verwendet genau das Datumsmuster aus lesson02: Wochentag, dann întâi + Monat, ohne de.'
  ro.a1.unit03.lesson03.teach.line03:
    title: Bestätigen und sich verabschieden
    gloss: Ana bedankt sich und verabschiedet sich.
    note: La revedere, schon in Unit 1 gelernt, beendet das Gespräch wie immer.
  ro.a1.unit03.lesson03.teach.line04:
    title: Das Gespräch beenden
    gloss: Mihai verabschiedet sich ebenfalls und nennt dabei Anas Namen.
    note: La revedere mit dem Namen des Gegenübers zu wiederholen, ist ein natürlicher, freundlicher Abschluss.
