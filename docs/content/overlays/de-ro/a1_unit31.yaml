answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Rumänisch A1
  description: 'Rumänisch für Anfänger: das grundlegende Aussehen einer Person beschreiben – Größe und Alterseindruck, Haar- und Augenfarbe, die Kernfrage Cum arată ...? und den Vergleich des Aussehens zweier Personen.'
units:
  ro.a1.unit31.aspect:
    title: Aussehen beschreiben
lessons:
  ro.a1.unit31.lesson01.inalt_scund_batran_si:
    title: Groß, klein, alt und jung
  ro.a1.unit31.lesson02.descrierea_parului:
    title: Haare beschreiben
  ro.a1.unit31.lesson03.ochii_si_cum_arata:
    title: 'Augen und: Wie sieht jemand aus?'
  ro.a1.unit31.lesson04.ana_o_descrie_pe:
    title: Ana beschreibt Nina
  ro.a1.unit31.lesson05.ii_comparam_pe_andrei:
    title: Andrei und Elena im Vergleich
  ro.a1.unit31.lesson06.mihai_o_recunoaste_pe:
    title: Mihai erkennt Nina
teaching:
  ro.a1.unit31.lesson01.teach.inalt_scund:
    title: Groß und klein
    gloss: groß / klein
    note: '*Înalt* beschreibt eine große Person und *scund* eine kleine. Beide haben weibliche Formen: *înaltă*, *scundă*.'
    example_gloss:
    - Elena ist groß.
    - Andrei ist klein.
  ro.a1.unit31.lesson01.teach.batran_tanar:
    title: Alt und jung
    gloss: alt / jung
    note: '*Bătrân* und *tânăr* beschreiben hier einen allgemeinen Alterseindruck, keine genaue Zahl von Jahren. Weibliche Formen: *bătrână*, *tânără*.'
    example_gloss:
    - Opa ist alt.
    - Mihai ist jung.
  ro.a1.unit31.lesson01.teach.pentru_varsta_exacta:
    title: 'Bătrân: Eindruck oder Zahl'
    gloss: Nach dem genauen Alter fragen Sie mit Câți ani ai?, während bătrân einen allgemeinen Eindruck wiedergibt, wie in Bunicul este bătrân.
    note: Nach dem genauen Alter können Sie mit *Câți ani ai?* fragen. *Bătrân* beschreibt hier, wie alt jemand AUSSIEHT, ohne Zahl.
  ro.a1.unit31.lesson01.teach.elena_este_inalta:
    title: Elena ist groß und Andrei ist klein
    gloss: Elena ist groß und Andrei ist klein.
    note: 'Ein einfacher zusammengesetzter Satz mit *și* (und), der den direkten Vergleich in Lektion 5 vorbereitet; das Adjektiv richtet sich nach dem Subjekt: *înaltă* für Elena, *scund* für Andrei.'
  ro.a1.unit31.lesson02.teach.parul:
    title: Haare
    gloss: die Haare
    note: '*Păr* ist ein maskulines Substantiv; der Artikel wird hinten angehängt: *părul* (das Haar).'
    example_gloss: Mihai hat kurze schwarze Haare.
  ro.a1.unit31.lesson02.teach.blond_maro_carunt:
    title: Blond, braun und grau
    gloss: blond / braun / grau
    note: Drei Haarfarben. Sie stehen nach dem Substantiv *păr* (maskulin), also sagt man *părul blond*, *păr maro*, *păr cărunt*.
    example_gloss:
    - Ana hat blonde Haare.
    - Andrei hat braune Haare.
    - Opa hat graue Haare.
  ro.a1.unit31.lesson02.teach.lung_scurt:
    title: Lang und kurz (Haare)
    gloss: lang / kurz (Haare)
    note: '*Lung* (lang) und *scurt* (kurz) beschreiben die Haarlänge; wie die Farben stehen sie nach dem Substantiv.'
    example_gloss:
    - Elena hat lange Haare.
    - Andrei hat kurze Haare.
  ro.a1.unit31.lesson02.teach.adjectivul_vine_dupa:
    title: Das Adjektiv steht nach dem Nomen
    gloss: 'Das Adjektiv steht nach dem Substantiv: păr scurt, păr lung, păr blond, păr maro, păr cărunt, păr negru.'
    note: Im Rumänischen steht das Adjektiv NACH dem Substantiv (*păr scurt*), anders als im Deutschen, wo es davor steht („kurzes Haar“).
  ro.a1.unit31.lesson02.teach.posesivul_vine_dupa:
    title: „Sein“ und „ihr“ stehen nach dem Substantiv
    gloss: 'Das Possessivum steht nach dem Substantiv: părul ei (ihr Haar), ochii lui (seine Augen).'
    note: '*Ei* bedeutet „ihr“ und *lui* „sein“; beide stehen nach dem Substantiv: *părul ei*. Der Kontext zeigt, wer gemeint ist.'
  ro.a1.unit31.lesson02.teach.mihai_are_parul:
    title: Mihai hat kurze schwarze Haare
    gloss: Mihai hat kurze schwarze Haare.
    note: '*Negru* (schwarz) ist ein Farbadjektiv; es steht nach dem Substantiv: *păr negru*.'
  ro.a1.unit31.lesson02.teach.ana_are_parul:
    title: Ana hat lange blonde Haare
    gloss: Ana hat lange blonde Haare.
    note: Verbindet Länge und Farbe aus dieser Lektion in einem natürlichen Satz.
  ro.a1.unit31.lesson03.teach.ochii:
    title: Augen
    gloss: die Augen
    note: '*Ochi* (Auge/Augen) sieht im Singular und Plural gleich aus; der Artikel zeigt die Zahl: *ochiul* (das Auge), *ochii* (die Augen).'
    example_gloss: Mihai hat braune Augen.
  ro.a1.unit31.lesson03.teach.albastru_maro_verde:
    title: Blau, braun und grün
    gloss: blau / braun / grün
    note: '*Albastru* (blau), *maro* (braun) und *verde* (grün) sind Farbadjektive. *Maro* ändert sich nie; *albastru* wird im Plural zu *albaștri* und *verde* zu *verzi*.'
    example_gloss:
    - Ana hat blaue Augen.
    - Andrei hat braune Augen.
    - Elena hat grüne Augen.
  ro.a1.unit31.lesson03.teach.la_plural_adjectivul:
    title: Adjektive im Plural
    gloss: 'Im Plural verändert sich das Adjektiv: ochi albaștri, ochi maro, ochi verzi.'
    note: Bei *ochi* im Plural steht das Adjektiv in der Pluralform (*albaștri*, *verzi*); *maro* bleibt gleich. Vergleichen Sie den Singular *păr albastru*.
  ro.a1.unit31.lesson03.teach.cum_arata_ana:
    title: Wie sieht Ana aus?
    gloss: Wie sieht Ana aus?
    note: '*Cum arată ...?* ist die Kernfrage dieser Lektion; mit ihr können Sie nach dem Aussehen jeder Person fragen.'
  ro.a1.unit31.lesson03.teach.ana_are_parul:
    title: Ana hat lange blonde Haare und blaue Augen
    gloss: Ana hat lange blonde Haare und blaue Augen.
    note: Eine Musterantwort, die Haare und Augen mit *și* in einem Satz verbindet.
  ro.a1.unit31.lesson04.teach.ana_vine_o:
    title: Ana stellt Nina vor
    gloss: 'Ana: Eine Neue kommt ins Sprachcafé. Sie heißt Nina.'
    note: '*Vine o fată nouă* („ein neues Mädchen kommt“) führt jemand Neues ein; *O cheamă Nina* nennt ihren Namen.'
  ro.a1.unit31.lesson04.teach.mihai_bine_cum:
    title: Mihai fragt, wie sie aussieht
    gloss: 'Mihai: Gut! Wie sieht sie aus?'
    note: 'Wieder die Kernfrage dieser Lektion, diesmal ohne Namen: *Cum arată?* (wer gemeint ist, ergibt sich aus dem Kontext).'
  ro.a1.unit31.lesson04.teach.ana_este_scunda:
    title: Ana beschreibt Ninas Größe und Haare
    gloss: 'Ana: Sie ist klein und hat kurze blonde Haare.'
    note: Verbindet *scundă* aus Lektion 1 mit dem Haarwortschatz aus Lektion 2.
  ro.a1.unit31.lesson04.teach.mihai_si_ochii:
    title: Mihai fragt nach ihren Augen
    gloss: 'Mihai: Und ihre Augen?'
    note: '*Și ochii?* („Und die Augen?“) ist eine kurze Nachfrage; die Person ergibt sich aus dem Kontext.'
  ro.a1.unit31.lesson04.teach.ana_are_ochi:
    title: Ana beschreibt Ninas Augen
    gloss: 'Ana: Sie hat grüne Augen.'
    note: Greift *ochi verzi* aus Lektion 3 wieder auf.
  ro.a1.unit31.lesson04.teach.mihai_multumesc_atunci:
    title: Mihai wird sie erkennen
    gloss: 'Mihai: Danke! Dann erkenne ich sie bestimmt.'
    note: '*O recunosc* bedeutet „ich erkenne sie“: *o* ist das Objektpronomen „sie“ und steht vor dem Verb.'
  ro.a1.unit31.lesson05.teach.andrei_si_elena:
    title: Andrei und Elena im Vergleich
    gloss: Andrei und Elena sind Bruder und Schwester, sehen aber unterschiedlich aus. Andrei ist klein und hat kurze braune Haare und braune Augen. Elena ist größer als Andrei und hat lange braune Haare und grüne Augen. Wie sehen Sie aus?
    note: Ein kurzer Vergleich mit allen bisher gelernten Farb- und Längenwörtern; am Ende steht die Kernfrage der Einheit an die Leserin bzw. den Leser.
    glosses:
      frate: Bruder
      soră: Schwester
      arată: ist ... (vom Aussehen her)
      diferit: verschieden
      scund: klein
      scurt: klein
      maro: braun
      părul: Haare
      ochi: Augen
      înaltă: größer
      lung: lang
      verzi: grün
      arăți: aussehen (z. B. wie jemand aussieht)
  ro.a1.unit31.lesson05.teach.comparativul_se_formeaza:
    title: Vergleichen mit mai ... decât
    gloss: 'Der Komparativ wird mit mai + Adjektiv + decât gebildet: Elena este mai înaltă decât Andrei. (Elena ist größer als Andrei.)'
    note: 'Im Rumänischen steht *mai* („mehr“) vor dem Adjektiv und *decât* („als“) vor der zweiten Person: *mai înaltă decât Andrei*.'
  ro.a1.unit31.lesson05.teach.elena_are_parul:
    title: Elena hat längere Haare als Andrei
    gloss: Elena hat längere Haare als Andrei.
    note: '*Mai lung* funktioniert vor *decât* genauso: *părul mai lung decât Andrei*; das Adjektiv steht weiterhin nach *părul*.'
  ro.a1.unit31.lesson05.teach.am_parul_scurt:
    title: Ich habe kurze braune Haare
    gloss: Ich habe kurze braune Haare.
    note: Ein Mustersatz in der ersten Person mit *Am ...*, den Sie wiederverwenden können, wenn Sie Ihr eigenes Aussehen beschreiben.
  ro.a1.unit31.lesson06.teach.mihai_uite_ea:
    title: Mihai entdeckt Nina
    gloss: 'Mihai: Schau, ist das Nina? Sie hat kurze blonde Haare und grüne Augen.'
    note: '*Uite* („schau“) lenkt die Aufmerksamkeit auf etwas; *ea e Nina?* fragt „ist das Nina?“.'
  ro.a1.unit31.lesson06.teach.ana_da_ea:
    title: Ana bestätigt
    gloss: 'Ana: Ja, das ist Nina!'
    note: Eine kurze, natürliche Bestätigung.
  ro.a1.unit31.lesson06.teach.nina_salut_tu:
    title: Nina begrüßt Mihai
    gloss: 'Nina: Hallo, bist du Mihai?'
    note: 'Eine einfache, informelle Begrüßungsfrage: *tu ești ...?*'
  ro.a1.unit31.lesson06.teach.mihai_da_ma:
    title: Mihai begrüßt Nina zurück
    gloss: 'Mihai: Ja! Freut mich, dich kennenzulernen, Nina.'
    note: '*Mă bucur să te cunosc* („Ich freue mich, dich kennenzulernen“) ist die übliche Wendung für ein erstes Kennenlernen.'
  ro.a1.unit31.lesson06.teach.nina_si_eu:
    title: Nina erwidert die Begrüßung
    gloss: 'Nina: Freut mich auch, dich kennenzulernen!'
    note: Das schließt den Dialog ab – Mihai hat Nina anhand von Anas früherer Beschreibung erkannt.
