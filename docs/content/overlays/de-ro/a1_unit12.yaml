teaching:
  ro.a1.unit12.lesson01.teach.reminder_parc_cinema:
    title: 'Wiederholung: parc, cinema'
    gloss: parc (der Park) · cinema (das Kino)
    note: Beide wurden bereits in Lektion 11 eingeführt. Hier werden sie mit der neuen Vergangenheitsform dieser Lektion kombiniert.
  ro.a1.unit12.lesson01.teach.reminder_astazi_maine_duminica_sambata:
    title: 'Wiederholung: astăzi, mâine, duminică, sâmbătă'
    gloss: astăzi (heute) · mâine (morgen) · duminică (Sonntag) · sâmbătă (Samstag)
    note: Alles bereits aus Lektion 3 und 11 bekannt. Hier bilden sie den Gegensatz zum neuen *ieri* (gestern) dieser Lektion.
  ro.a1.unit12.lesson01.teach.am_fost_vocab:
    title: ich war / ich bin gegangen
    gloss: Am fost (ich war / ich bin gegangen)
    note: 'Das Perfekt (perfect compus) von *a fi* (sein): *am* ist das unveränderliche Hilfsverb für „ich“ und „wir“, *fost* die feste Partizipform. Mit einem Ort ist *am fost la...* die alltägliche, natürliche Art zu sagen „ich war in …“ bzw. „ich bin zu … gegangen“ – in der Umgangssprache üblicher als ein Verb der Fortbewegung.'
    example_gloss:
    - Ich war im Park.
  ro.a1.unit12.lesson01.teach.am_fost_parc_phrase:
    title: Ich war im Park
    gloss: Am fost la parc. (Ich war im Park.)
    note: 'Das vollständige Muster: am fost + la + Ort.'
  ro.a1.unit12.lesson01.teach.am_fost_cinema_phrase:
    title: Ich war im Kino
    gloss: Am fost la cinema. (Ich war im Kino. / Ich bin ins Kino gegangen.)
    note: Dasselbe Muster wie *Am fost la parc*, nur mit einem anderen Ort.
  ro.a1.unit12.lesson01.teach.ieri_vocab:
    title: Gestern
    gloss: Ieri (gestern)
    note: Schon in Lektion 3 neben *astăzi* (heute) und *mâine* (morgen) vorgekommen – jetzt wird es mit der Vergangenheit verwendet und steht am Satzanfang, um zu sagen, wann etwas geschah.
    example_gloss:
    - Gestern war ich im Park.
  ro.a1.unit12.lesson01.teach.ieri_am_fost_parc_phrase:
    title: Gestern war ich im Park
    gloss: Ieri am fost la parc. (Gestern war ich im Park.)
    note: Wenn man *ieri* vor *Am fost la parc* stellt, wird der Zeitpunkt genau festgelegt.
  ro.a1.unit12.lesson02.teach.reminder_mananc_beau:
    title: 'Wiederholung: mănânc, beau'
    gloss: mănânc (ich esse) · beau (ich trinke)
    note: Beide kennen Sie schon aus dem Tagesablauf in Einheit 10 – in dieser Lektion lernen Sie ihre Vergangenheitsformen.
  ro.a1.unit12.lesson02.teach.reminder_paine_cafea_ceai_si:
    title: 'Wiederholung: pâine, cafea, ceai, și'
    gloss: pâine (Brot) · cafea (Kaffee) · ceai (Tee) · și (und)
    note: Alle schon aus Einheit 6 und 10 bekannt – hier in den Vergangenheitssätzen dieser Lektion wieder verwendet.
  ro.a1.unit12.lesson02.teach.am_mancat_vocab:
    title: ich habe gegessen
    gloss: Am mâncat (ich habe gegessen)
    note: Das Perfekt (perfect compus) von *a mânca* (essen), das Sie schon als *mănânc* (ich esse, Einheit 10) kennen – dasselbe Verb in der Vergangenheit. Am + mâncat, dasselbe Muster wie bei *am fost*.
    example_gloss:
    - Ich habe Brot gegessen.
  ro.a1.unit12.lesson02.teach.am_mancat_paine_phrase:
    title: Ich habe Brot gegessen
    gloss: Am mâncat pâine. (Ich habe Brot gegessen.)
    note: 'Das vollständige Muster: am mâncat + das Essen.'
  ro.a1.unit12.lesson02.teach.am_baut_vocab:
    title: ich habe getrunken
    gloss: Am băut (ich habe getrunken)
    note: Das Perfekt (perfect compus) von *a bea* (trinken), das Sie schon als *beau* (ich trinke, Einheit 10) kennen – dasselbe Verb in der Vergangenheit.
    example_gloss:
    - Ich habe Tee getrunken.
  ro.a1.unit12.lesson02.teach.am_baut_ceai_phrase:
    title: Ich habe Tee getrunken
    gloss: Am băut ceai. (Ich habe Tee getrunken.)
    note: 'Das vollständige Muster: am băut + das Getränk.'
  ro.a1.unit12.lesson02.teach.am_mancat_am_baut_phrase:
    title: Ich habe Brot gegessen und Tee getrunken
    gloss: Am mâncat pâine și am băut ceai. (Ich habe Brot gegessen und Tee getrunken.)
    note: Zwei Handlungen in der Vergangenheit, mit *și* verbunden – demselben Bindewort, das Einheit 10 schon für Abläufe in der Gegenwart verwendet hat.
  ro.a1.unit12.lesson03.teach.reminder_am_fost_ieri_parc_cinema:
    title: 'Wiederholung: am fost, ieri, parc, cinema'
    gloss: am fost (ich war / ich bin gegangen) · ieri (gestern) · parc (der Park) · cinema (das Kino)
    note: Alle aus der ersten Lektion dieser Einheit – hier bereiten sie den Rückblick auf den Sonntag vor.
  ro.a1.unit12.lesson03.teach.reminder_am_mancat_am_baut:
    title: 'Wiederholung: am mâncat, am băut, pâine, cafea, ceai'
    gloss: am mâncat (ich habe gegessen) · am băut (ich habe getrunken) · pâine (Brot) · cafea (Kaffee) · ceai (Tee)
    note: Alle aus der zweiten Lektion dieser Einheit – hier sagen Ana und Mihai jeweils, was sie hatten.
  ro.a1.unit12.lesson03.teach.reminder_cum_duminica_bine:
    title: 'Wiederholung: cum, duminică, bine, mulțumesc, la revedere, Ana, Mihai'
    gloss: cum (wie, Einheit 1/Einheit 9) · duminică (Sonntag, Einheit 3) · bine (gut, Einheit 1) · mulțumesc (danke) · la revedere (auf Wiedersehen) · Ana, Mihai (Namen)
    note: 'Alle schon aus früheren Einheiten bekannt – *cum* kam zuerst bei der Frage nach dem Namen (Einheit 1) und nach dem Weg (Einheit 9) vor; hier leitet es eine andere Frage ein: wie etwas war.'
  ro.a1.unit12.lesson03.teach.a_fost_vocab:
    title: Es war
    gloss: A fost (es war)
    note: Eine andere Person desselben Verbs wie bei *am fost* – *a* ist das Hilfswort für „er/sie/es“, nicht für „ich/wir“. Lernen Sie *Cum a fost...?* und *A fost bine!* vorerst als feste Wendungen, nicht als Muster, das man frei bilden kann.
    example_gloss:
    - Es war gut!
  ro.a1.unit12.lesson03.teach.a_fost_bine_phrase:
    title: Es war gut!
    gloss: A fost bine! (Es war gut!)
    note: Eine kurze, natürliche Art zu sagen, dass etwas gut gelaufen ist – die Antwort auf *Cum a fost...?*
  ro.a1.unit12.lesson03.teach.cum_a_fost_duminica_phrase:
    title: Wie war der Sonntag?
    gloss: Cum a fost duminică? (Wie war der Sonntag?)
    note: Eine natürliche Art, ein Gespräch über einen vergangenen Tag zu beginnen, selbst mit jemandem, der dabei war – man lädt dazu ein zu erzählen, wie es war oder was besonders war.
  ro.a1.unit12.lesson03.teach.line01:
    title: Begrüßen und fragen, wie der Sonntag war
    gloss: Mihai begrüßt Ana und fragt, wie der Sonntag war.
    note: Verbindet *Cum a fost duminică?* aus dieser Einheit mit dem schon bekannten *Bună*.
  ro.a1.unit12.lesson03.teach.line02:
    title: Antworten und sagen, wo
    gloss: Ana sagt, es war gut und dass sie im Park war.
    note: Verbindet *A fost bine!* mit *Am fost la parc* aus der ersten Lektion.
  ro.a1.unit12.lesson03.teach.line03:
    title: Sagen, was er gegessen und getrunken hat
    gloss: Mihai sagt, dass er Brot gegessen und Tee getrunken hat.
    note: Greift *Am mâncat pâine și am băut ceai* aus der zweiten Lektion wieder auf – passend zu Mihais Vorlieben aus Einheit 6 (pâine und ceai).
  ro.a1.unit12.lesson03.teach.line04:
    title: Sagen, was sie getrunken hat
    gloss: Ana sagt, dass sie Kaffee getrunken hat.
    note: Passt zu Anas Vorlieben aus Einheit 6 (cafea).
  ro.a1.unit12.lesson03.teach.line05:
    title: Danken und sich verabschieden
    gloss: Mihai bedankt sich bei Ana und verabschiedet sich.
    note: Derselbe Abschluss, mit dem schon die Dialoge aller früheren Einheiten geendet haben.
  ro.a1.unit12.lesson03.teach.line06:
    title: Das Gespräch beenden
    gloss: Ana verabschiedet sich ebenfalls und nennt dabei Mihais Namen.
    note: Derselbe freundliche Abschluss, mit dem schon die Dialoge aller früheren Einheiten geendet haben.
