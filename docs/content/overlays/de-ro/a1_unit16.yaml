answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (doare, cap, stomac, simt, bolnav, nevoie, doctor, odihnă, multă) is used only in fixed first-person (Mihai's own "Nu mă simt bine"/"Sunt bolnav") or already-established formal ("Aveți nevoie de...?") forms. No informal-tu form is introduced this unit; Ana and Mihai keep their existing formal register with each other.
course:
  title: Rumänisch A1
  description: Ein einfaches gesundheitliches Problem auf Rumänisch nennen – Doare (tut weh), Bolnav (krank) und Doctor (Arzt) –, während sich Mihai unwohl fühlt und Ana nach ihm sieht und ihm Ratschläge gibt.
units:
  ro.a1.unit16.health:
    title: Gesundheit
lessons:
  ro.a1.unit16.lesson01.ma_doare_capul:
    title: Mir tut der Kopf weh
  ro.a1.unit16.lesson02.nu_ma_simt_bine:
    title: Ich fühle mich nicht gut
  ro.a1.unit16.lesson03.mihai_este_bolnav:
    title: Mihai ist krank
teaching:
  ro.a1.unit16.lesson01.teach.reminder_ma_va_ce_sau:
    title: 'Wiederholung: mă, vă, ce, sau'
    gloss: mă (mich) · vă (Sie/Ihnen, förmlich) · ce (was) · sau (oder)
    note: Mă kommt aus Lektion 1/Lektion 10 (mă numesc, mă trezesc); vă aus Lektion 1/6/7/13 (vă rog); ce aus Lektion 1/3/4/15; sau aus Lektion 13 – diese Lektion verwendet alle vier neu, um darüber zu sprechen, was wehtut.
  ro.a1.unit16.lesson01.teach.doare_vocab:
    title: Tut weh
    gloss: Doare (tut weh)
    note: 'Ein unpersönliches Verb – Rumänisch sagt wörtlich „es tut mir weh“ (*mă doare*). *Mă doare* allein bedeutet „es tut (mir) weh“; mit dem Körperteil sagen Sie, was wehtut: *Mă doare capul*.'
    example_gloss:
    - Es tut weh.
  ro.a1.unit16.lesson01.teach.cap_vocab:
    title: Kopf
    gloss: Kopf
    note: Neutrum, auf Konsonant endend – bekommt für „der Kopf“ die Endung *-ul*, wie *tren*->*trenul* und *peron*->*peronul*.
    example_gloss:
    - Mir tut der Kopf weh.
  ro.a1.unit16.lesson01.teach.ce_va_doare_phrase:
    title: Was tut Ihnen weh?
    gloss: Was tut Ihnen weh?
    note: '*Ce* (was) + *vă* (Sie/Ihnen, förmlich) + *doare* – alle Wörter sind bereits bekannt oder gerade neu und bilden hier eine neue Frage.'
  ro.a1.unit16.lesson01.teach.stomac_vocab:
    title: Magen
    gloss: Magen
    note: Neutrum, auf Konsonant endend, daher heißt „der Magen“ *stomacul* – dieselbe Endung *-ul* wie bei *cap*->*capul*.
    example_gloss:
    - Mein Magen tut weh.
  ro.a1.unit16.lesson01.teach.ma_doare_capul_sau_stomacul_phrase:
    title: Tut Ihnen der Kopf oder der Magen weh?
    gloss: Tut Ihnen der Kopf oder der Magen weh?
    note: '*Vă* (Sie/Ihnen, förmlich) statt *mă* macht aus der Aussage eine Frage an das Gegenüber; *sau* (oder, aus Lektion 13) verbindet die beiden eben gelernten Körperteile.'
  ro.a1.unit16.lesson02.teach.reminder_nu_bine_am_un_de:
    title: 'Wiederholung: nu, bine, am, un, de'
    gloss: nu (nicht/nein) · bine (gut) · am (ich habe) · un (ein, maskulin/neutral) · de (von)
    note: Nu/bine stammen aus Lektion 1/6/11; am aus Lektion 2/5/15; un/de aus Lektion 6/7/15 – diese Lektion verwendet alle fünf, um zu sagen, dass man sich nicht wohlfühlt und einen Arzt braucht.
  ro.a1.unit16.lesson02.teach.ma_simt_vocab:
    title: ich fühle mich
    gloss: Mă simt (ich fühle mich)
    note: Ein reflexives Verb, wörtlich „ich fühle mich“ – dasselbe Muster *mă* + Verb wie bei *mă trezesc*/*mă culc* aus Lektion 10.
    example_gloss:
    - Ich fühle mich gut.
  ro.a1.unit16.lesson02.teach.nu_ma_simt_bine_phrase:
    title: Ich fühle mich nicht gut
    gloss: Nu mă simt bine. (Ich fühle mich nicht gut.)
    note: '*Nu* verneint *mă simt bine* – die natürliche Art zu sagen, dass etwas nicht stimmt, ohne schon ein bestimmtes Symptom zu nennen.'
  ro.a1.unit16.lesson02.teach.bolnav_vocab:
    title: Krank
    gloss: Bolnav (krank, maskulin)
    note: Maskuline Form des Adjektivs, so wie Mihai sie sagt (*Sunt bolnav*). Eine Frau sagt *Sunt bolnavă* (feminine Form).
    example_gloss:
    - Ich bin krank.
  ro.a1.unit16.lesson02.teach.am_nevoie_de_un_doctor_phrase:
    title: Ich brauche einen Arzt
    gloss: Am nevoie de un doctor. (Ich brauche einen Arzt.)
    note: '*Am nevoie de* (ich brauche, wörtlich „ich habe Bedarf an“) + *un doctor* – eine feste Wendung, nützlich, um bei allem um Hilfe zu bitten, nicht nur beim Arzt.'
  ro.a1.unit16.lesson02.teach.doctor_vocab:
    title: Doctor
    gloss: Doctor (Arzt)
    note: Maskulin, daher heißt „ein Arzt“ *un doctor*.
    example_gloss:
    - Ich brauche einen Arzt.
  ro.a1.unit16.lesson03.teach.reminder_ce_mai_faceti_aveti_da:
    title: 'Wiederholung: Ce mai faceți?, Aveți, Da'
    gloss: Ce mai faceți? (Wie geht es Ihnen?) · Aveți (Sie haben) · Da (ja)
    note: Ce mai faceți stammt aus Lektion 1; Aveți aus Lektion 5; Da aus Lektion 6/11 – alle werden im Gespräch dieser Lektion wieder verwendet.
  ro.a1.unit16.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Wiederholung: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (hallo) · mulțumesc (danke) · la revedere (auf Wiedersehen) · Ana, Mihai (Namen)
    note: Alles aus früheren Lektionen bekannt – dasselbe freundliche Anfangs- und Schlussmuster, das jeder Dialog in diesem Kurs verwendet hat.
  ro.a1.unit16.lesson03.teach.reminder_spitalul_vizavi_magazin:
    title: 'Wiederholung: Spitalul este vizavi de magazin'
    gloss: Spitalul este vizavi de magazin. (Das Krankenhaus ist gegenüber dem Geschäft.)
    note: Direkt aus Lektion 8 übernommen – der Standort des Krankenhauses hat sich nicht geändert, und der Lesetext dieser Lektion verweist darauf zurück.
  ro.a1.unit16.lesson03.teach.odihna_vocab:
    title: Ruhe
    gloss: Odihnă (Ruhe)
    note: Ein feminines Nomen – das, was ein Arzt (oder ein Freund) empfiehlt, wenn man sich nicht wohlfühlt.
    example_gloss:
    - Sie brauchen Ruhe.
  ro.a1.unit16.lesson03.teach.multa_apa_vocab:
    title: Viel Wasser
    gloss: Multă apă (viel Wasser)
    note: '*Multă* (viel, feminin) richtet sich nach dem femininen *apă* (Wasser, aus Lektion 6) – eine feste Verbindung, wie sie ein Arzt empfehlen könnte.'
    example_gloss:
    - Ruhe und viel Wasser.
  ro.a1.unit16.lesson03.teach.line01:
    title: Begrüßen und fragen, wie es ihm geht
    gloss: Ana begrüßt Mihai und fragt, wie es ihm geht.
    note: Greift die Begrüßung *Ce mai faceți?* aus Lektion 1 wieder auf.
  ro.a1.unit16.lesson03.teach.line02:
    title: Sagen, dass es Ihnen nicht gut geht
    gloss: Mihai sagt, dass es ihm nicht gut geht und dass er Kopfschmerzen hat.
    note: Verbindet den Ausdruck aus Lektion 2 dieser Einheit mit dem Ausdruck aus Lektion 1.
  ro.a1.unit16.lesson03.teach.line03:
    title: Fragen, ob er einen Arzt braucht
    gloss: Ana fragt, ob er einen Arzt braucht.
    note: Greift den Ausdruck aus Lektion 2 dieser Einheit als Frage auf, mit *aveți* aus Einheit 5.
  ro.a1.unit16.lesson03.teach.line04:
    title: Bestätigen, dass Sie krank sind und einen Arzt brauchen
    gloss: Mihai sagt ja, er ist krank und braucht einen Arzt.
    note: Verbindet *sunt bolnav* und *am nevoie de un doctor* aus dieser Einheit.
  ro.a1.unit16.lesson03.teach.line05:
    title: Einen Rat geben und sich verabschieden
    gloss: Ana rät ihm, sich auszuruhen und viel Wasser zu trinken, und verabschiedet sich.
    note: 'Verwendet *Odihnă și multă apă* aus dieser Lektion: ein Gesundheitsrat statt des sonst üblichen schlichten Abschieds.'
  ro.a1.unit16.lesson03.teach.line06:
    title: Ihr danken und sich verabschieden
    gloss: Mihai dankt Ana und verabschiedet sich.
    note: Dasselbe Schlussmuster, mit dem schon die Dialoge aller früheren Einheiten endeten.
