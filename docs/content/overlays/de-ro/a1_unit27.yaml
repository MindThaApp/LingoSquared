teaching:
  ro.a1.unit27.lesson01.teach.fericit_trist_suparat:
    title: Froh, traurig und wütend
    gloss: froh, traurig, wütend
    note: 'Drei grundlegende Gefühlswörter mit *a fi* (sein). Jedes hat eine weibliche Form auf *-ă*: *fericită*, *tristă*, *supărată*.'
    example_gloss:
    - Ich bin glücklich.
    - Ich bin traurig.
    - Ich bin wütend.
  ro.a1.unit27.lesson01.teach.sunt_fericit:
    title: Sagen, dass man froh ist
    gloss: Ich bin glücklich.
    note: '*Sunt* (von *a fi*, sein) + Adjektiv des Gefühls ist das Grundmuster, wie im Deutschen „Ich bin ...“. Eine Frau sagt *Sunt fericită*.'
  ro.a1.unit27.lesson01.teach.nu_sunt_suparat:
    title: Gefühle gegenüberstellen
    gloss: Ich bin nicht wütend, ich bin traurig.
    note: '*Nu* vor dem Verb macht den Satz negativ: *Nu sunt supărat*. Der zweite Satzteil nennt dann das tatsächliche Gefühl.'
  ro.a1.unit27.lesson02.teach.de_ce_esti:
    title: Nach dem Grund fragen
    gloss: Warum sind Sie froh?
    note: '*De ce* (warum) ist die übliche Frage nach einem Grund.'
  ro.a1.unit27.lesson02.teach.sunt_fericit_pentru:
    title: Einen Grund nennen
    gloss: Ich bin froh, weil ich eine neue Wohnung habe.
    note: '*Pentru că* (weil) leitet den Begründungssatz ein; die Wortstellung bleibt normal: *am un apartament nou*.'
  ro.a1.unit27.lesson02.teach.sunt_trist_pentru:
    title: Ein negativer Grund
    gloss: Ich bin traurig, weil es regnet.
    note: '*Plouă* (es regnet) hat im Rumänischen kein Subjekt und funktioniert daher allein als Begründungssatz.'
  ro.a1.unit27.lesson03.teach.emotionat:
    title: Nervös
    gloss: nervös
    note: Das gebräuchliche Wort für Nervosität.
    example_gloss: Ich bin nervös wegen meiner ersten Schicht.
  ro.a1.unit27.lesson03.teach.sunt_emotionat_pentru:
    title: Sagen, wovor man nervös ist
    gloss: Ich bin nervös wegen meiner ersten Schicht.
    note: '*Pentru* (wörtlich „für“) leitet ein, worauf sich die Aufregung bezieht; im Deutschen sagt man dafür „wegen“ oder „vor“.'
  ro.a1.unit27.lesson03.teach.nu_ti_face:
    title: Jemanden beruhigen
    gloss: Mach dir keine Sorgen.
    note: '*Nu-ți face griji* (wörtlich „mach dir keine Sorgen“) ist die feste Standardwendung zum Beruhigen. Zu Fremden sagt man: *Nu vă faceți griji*.'
  ro.a1.unit27.lesson04.teach.cum_se_simte:
    title: Fragen, wie sich jemand fühlt
    gloss: Wie fühlt sich Mihai?
    note: '*A se simți* (sich fühlen) ist reflexiv: *mă simt* (ich), *te simți* (du), *se simte* (er/sie). So fragt man nach Gefühlen oder beschreibt sie.'
  ro.a1.unit27.lesson04.teach.el_se_simte:
    title: Beschreiben, wie sich jemand fühlt
    gloss: Er ist nervös.
    note: '*Se* ist das Reflexivpronomen für er/sie und steht vor dem Verb: *se simte*.'
  ro.a1.unit27.lesson04.teach.de_ce_se:
    title: Fragen, warum sich jemand so fühlt
    gloss: Warum fühlt er sich nervös?
    note: Verbindet *de ce* mit dem Muster *se simte* aus *El se simte emoționat*.
  ro.a1.unit27.lesson05.teach.salut_ana_sunt:
    title: Eine Nachricht über Gefühle lesen
    gloss: Hallo Ana, ich bin ein bisschen aufgeregt wegen meiner ersten Schicht allein. Aber ich bin auch glücklich, weil ich eine neue Arbeit und eine neue Wohnung habe. Ich glaube, es wird schon klappen.
    note: Achten Sie darauf, wovor der Schreiber nervös ist, was ihn froh macht und wie er insgesamt die Lage sieht.
    glosses:
      puțin: ein bisschen
      emoționat: nervös
      prima: erste
      tură: Schicht
      singur: allein
      fericit: glücklich
      fiindcă: denn, weil
      nou: neu
      serviciu: Arbeit
      apartament: Wohnung
      cred: denken, glauben
      rezolvă: 'klappt (hier: wird gut gehen)'
  ro.a1.unit27.lesson06.teach.ana_salut_mihai:
    title: Ana fragt Mihai, wie er sich fühlt
    gloss: 'Ana: Hallo Mihai, wie fühlst du dich vor deiner ersten Schicht?'
    note: '*Cum te simți* hat das Reflexivpronomen *te* („dich“); in *prima ta tură* richtet sich das Possessivum *ta* nach dem femininen *tură*.'
  ro.a1.unit27.lesson06.teach.mihai_sunt_putin:
    title: Mihai gibt zu, dass er aufgeregt ist
    gloss: 'Mihai: Ich bin ehrlich gesagt ein bisschen aufgeregt.'
    note: '*Sincer să fiu* (ehrlich gesagt) mildert das Eingeständnis ab.'
  ro.a1.unit27.lesson06.teach.ana_nu_ti:
    title: Ana beruhigt ihn
    gloss: 'Ana: Mach dir keine Sorgen, du schaffst das gut!'
    note: '*O să te descurci bine* (wörtlich „du wirst gut zurechtkommen“) ist eine aufmunternde feste Wendung; *o să* + Verb bildet das Futur.'
  ro.a1.unit27.lesson06.teach.mihai_multumesc_chiar:
    title: Mihai bedankt sich bei ihr
    gloss: 'Mihai: Danke, das hilft wirklich.'
    note: '*Ajută* ist die Form für er/sie/es von *a ajuta* (helfen); hier bedeutet sie „es hilft“.'
  ro.a1.unit27.lesson06.teach.ana_si_dupa:
    title: Ana sagt den Ausgang voraus
    gloss: 'Ana: Und danach bist du bestimmt sehr glücklich und stolz.'
    note: '*Sigur* (sicher) drückt eine zuversichtliche Vorhersage aus; *mândru* (stolz) ist ein neues, nützliches Adjektiv (*mândră* bei einer Frau).'
  ro.a1.unit27.lesson06.teach.mihai_da_si:
    title: Mihai stimmt zu
    gloss: 'Mihai: Ja, das glaube ich auch.'
    note: '*Și eu cred asta* (wörtlich „ich glaube das auch“) ist die natürliche Art, jemandes Meinung zuzustimmen.'
  ro.a1.unit27.lesson06.teach.mihai_este_emotionat:
    title: Zusammenfassung mit este, lui und îl
    gloss: Mihai ist wegen seiner ersten Schicht aufgeregt. Ana hilft ihm.
    note: '*Este* ist die Form für er/sie von *a fi* (sein); *lui* nach dem Substantiv bedeutet „sein“; *îl* bedeutet „ihn/ihm“ und steht vor dem Verb: *îl ajută*. Drei kleine, aber wichtige Wörter, um über andere zu sprechen.'
