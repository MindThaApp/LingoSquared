answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Rumänisch A1
  description: 'Rumänisch für Anfänger: Freizeitaktivitäten beschreiben – Hobbywortschatz, Häufigkeitsausdrücke, Fragen und Antworten dazu, was jemand in der Freizeit macht, und der Vergleich der Hobbys zweier Personen.'
units:
  ro.a1.unit30.timp_liber:
    title: Hobbys und Freizeit
lessons:
  ro.a1.unit30.lesson01.cititul_sportul_si_gatitul:
    title: Lesen, Sport und Kochen
  ro.a1.unit30.lesson02.muzica_desen_si_jocuri:
    title: Musik, Zeichnen und Gaming
  ro.a1.unit30.lesson03.ce_faci_in_timpul:
    title: Was machst du in deiner Freizeit?
  ro.a1.unit30.lesson04.ana_si_mihai_vorbesc:
    title: Ana und Mihai sprechen über Hobbys
  ro.a1.unit30.lesson05.mihai_si_ana_isi:
    title: Mihai und Ana vergleichen ihre Hobbys
  ro.a1.unit30.lesson06.planuim_impreuna_un_weekend:
    title: Ein gemeinsames Wochenende planen
teaching:
  ro.a1.unit30.lesson01.teach.a_citi_a:
    title: Lesen, Sport, Kochen
    gloss: lesen, Sport treiben, kochen
    note: 'Drei häufige Hobbyverben: *a citi* (lesen), *a face sport* (Sport treiben) und *a găti* (kochen). Rumänische Grundformen beginnen mit *a*.'
    example_gloss:
    - Ich lese gern ein Buch.
    - Ich treibe samstags Sport.
    - Ich koche gern für Freunde.
  ro.a1.unit30.lesson01.teach.timpul_liber:
    title: Freizeit
    gloss: Freizeit
    note: '*Timpul liber* (Freizeit) besteht aus dem maskulinen Substantiv *timp* mit angehängtem bestimmtem Artikel. Es ist der Schlüsselausdruck, wenn man über Hobbys spricht.'
    example_gloss: In meiner Freizeit lese ich gern.
  ro.a1.unit30.lesson01.teach.in_timpul_liber:
    title: Sagen, was man in der Freizeit macht
    gloss: In meiner Freizeit lese ich gern.
    note: '*Citesc* ist die *eu*-Form von *a citi* (lesen); nach *îmi place să* behält das Verb dieselbe Form.'
  ro.a1.unit30.lesson02.teach.a_asculta_muzica:
    title: Musik, Zeichnen, Gaming
    gloss: Musik hören, zeichnen, Videospiele spielen
    note: 'Drei weitere Hobbyausdrücke: *a asculta muzică* (Musik hören), *a desena* (zeichnen) und *a juca jocuri video* (Videospiele spielen).'
    example_gloss:
    - Ich höre gern Musik.
    - Ich zeichne oft.
    - Ich spiele gern mit Freunden Videospiele.
  ro.a1.unit30.lesson02.teach.imi_place_sa:
    title: Sagen, dass man gern Musik hört
    gloss: Ich höre gern Musik.
    note: '*Îmi place să ascult muzică*: *îmi place* („es gefällt mir“) + *să* + Verb ist die übliche Art zu sagen, dass man etwas gern tut.'
  ro.a1.unit30.lesson02.teach.imi_place_sa_2:
    title: Sagen, dass man gern mit Freunden Videospiele spielt
    gloss: Ich spiele gern mit Freunden Videospiele.
    note: '*Cu prietenii* bedeutet „mit den Freunden“: *cu* („mit“) ist die Präposition, und *prietenii* ist der bestimmte Plural.'
  ro.a1.unit30.lesson03.teach.mereu_des_uneori:
    title: Immer, oft, manchmal, nie
    gloss: immer, oft, manchmal, nie
    note: 'Die vier wichtigsten Häufigkeitsadverbien: *mereu*, *des*, *uneori* und *niciodată*. Sie stehen meist nach dem Verb: *Citesc des*.'
    example_gloss:
    - Ich treibe immer samstags Sport.
    - Ich lese oft ein Buch.
    - Ich zeichne manchmal.
    - Ich spiele nie Videospiele.
  ro.a1.unit30.lesson03.teach.in_fiecare_saptamana:
    title: Jede Woche, jedes Wochenende
    gloss: jede Woche, jedes Wochenende
    note: '*În fiecare săptămână* und *în fiecare weekend* bedeuten beide „jede/jedes“; *fiecare* verändert sich nie, siehe die nächste Karte.'
    example_gloss:
    - Ich koche jede Woche für Freunde.
    - Ich treibe jedes Wochenende Sport.
  ro.a1.unit30.lesson03.teach.cuvantul_fiecare_nu:
    title: Fiecare bleibt unverändert
    gloss: 'Das Wort fiecare verändert sich nicht: în fiecare săptămână (jede Woche), în fiecare weekend (jedes Wochenende).'
    note: '*Fiecare* bleibt vor *săptămână* und *weekend* gleich, egal welches Substantiv folgt; Sie müssen also keine Form wählen.'
  ro.a1.unit30.lesson03.teach.ce_faci_in:
    title: Nach der Freizeit fragen
    gloss: Was machst du in deiner Freizeit?
    note: Das ist die Kernfrage dieser Lektion – mit ihr können Sie jeden nach seinen Hobbys fragen.
  ro.a1.unit30.lesson04.teach.ana_ne_plimbam:
    title: Ana spricht über Hobbys
    gloss: 'Ana: Wir gehen oft zusammen spazieren. Aber was machst du sonst noch in deiner Freizeit, Mihai?'
    note: '*Ne plimbăm* („wir gehen spazieren“) ist die *noi*-Form des reflexiven Verbs *a se plimba*; es bezieht sich auf die Spaziergänge, die beide Freunde mögen.'
  ro.a1.unit30.lesson04.teach.mihai_imi_place:
    title: Mihais Hobbys
    gloss: 'Mihai: Ich koche gern, auch zu Hause. Und ich treibe oft Sport.'
    note: '*Și acasă* (auch zu Hause) stellt klar, dass Mihai aus Freude kocht, nicht nur bei seiner Arbeit im Restaurant.'
  ro.a1.unit30.lesson04.teach.ana_gatesti_si:
    title: Ana ist überrascht
    gloss: 'Ana: Du kochst auch zu Hause? Du kochst doch schon den ganzen Tag bei der Arbeit!'
    note: '*Toată ziua* (den ganzen Tag) betont, wie viel Mihai schon bei der Arbeit kocht; *deja* bedeutet „schon“.'
  ro.a1.unit30.lesson04.teach.mihai_da_dar:
    title: Mihai erklärt
    gloss: 'Mihai: Ja, aber Kochen finde ich entspannend. Und du, was machst du gern?'
    note: '*Gătitul mi se pare relaxant* bedeutet wörtlich „das Kochen scheint mir entspannend“: *mi se pare* ist eine gängige Art, eine Meinung zu äußern.'
  ro.a1.unit30.lesson04.teach.ana_imi_place:
    title: Anas Hobbys
    gloss: 'Ana: Ich lese gern und höre oft Musik.'
    note: Verbindet zwei Hobbyverben aus Lektion 1 und 2 in einem Satz mit *și* (und).
  ro.a1.unit30.lesson04.teach.mihai_joci_si:
    title: Mihai fragt nach dem Spielen
    gloss: 'Mihai: Spielst du auch Videospiele?'
    note: Eine kurze Ja/Nein-Frage mit *jocuri video* aus Lektion 2; *joci* ist die *tu*-Form von *a juca*.
  ro.a1.unit30.lesson04.teach.ana_nu_nu:
    title: Ana antwortet
    gloss: 'Ana: Nein, ich spiele nie Videospiele. Aber ich zeichne manchmal!'
    note: '*Niciodată* (nie) und *uneori* (manchmal) aus Lektion 3, in einer Antwort gegenübergestellt; *nu ... niciodată* ist eine doppelte Verneinung.'
  ro.a1.unit30.lesson05.teach.mihai_si_cu:
    title: Hobbys im Vergleich
    gloss: Mihai und ich gehen oft zusammen spazieren. Aber wir haben auch andere Leidenschaften. Mihai kocht gern, auch zu Hause, und er treibt oft Sport. Ich lese gern und höre oft Musik. Ich zeichne manchmal, aber ich spiele nie Videospiele. Was machst du gern in deiner Freizeit?
    note: Anas Nachricht fasst Fakten aus Lektion 4 zusammen und endet mit der Kernfrage der Einheit an die Leserin oder den Leser.
    glosses:
      plimbăm: spazieren gehen
      des: oft
      împreună: zusammen
      alte: andere
      gătească: kocht
      place: mag
      acasă: zu Hause
      sport: macht Sport
      citesc: lesen
      ascult: hören
      muzică: Musik
      desenez: zeichne
      uneori: manchmal
      joc: Videospiele spielen
      niciodată: nie
      liber: frei
      timpul: Zeit
  ro.a1.unit30.lesson06.teach.mihai_ce_faci:
    title: Mihai fragt nach dem Wochenende
    gloss: 'Mihai: Was machst du dieses Wochenende?'
    note: '*În acest weekend* (dieses Wochenende) verwendet *acest* für „dieses“.'
  ro.a1.unit30.lesson06.teach.ana_inca_nu:
    title: Ana ist unentschlossen
    gloss: 'Ana: Ich weiß es noch nicht. Ich lese gern, aber ich möchte auch nach draußen gehen.'
    note: '*Să ies afară* (nach draußen gehen) ist eine gängige Art zu sagen, dass man das Haus verlassen möchte; *vreau să* + Verb bedeutet „ich möchte ...“.'
  ro.a1.unit30.lesson06.teach.mihai_hai_sa:
    title: Mihai macht einen Vorschlag
    gloss: 'Mihai: Wollen wir zusammen spazieren gehen? Danach koche ich für uns.'
    note: '*După aceea* (danach) ist ein Ausdruck für die zeitliche Abfolge; *Hai să* + Verb schlägt vor, etwas gemeinsam zu tun.'
  ro.a1.unit30.lesson06.teach.ana_buna_idee:
    title: Ana stimmt zu
    gloss: 'Ana: Gute Idee! Ich gehe gern spazieren und koche auch gern.'
    note: '*Și ..., și ...* („sowohl ... als auch ...“) zeigt, dass Ana beides gleich gern mag, nicht eines lieber als das andere.'
  ro.a1.unit30.lesson06.teach.mihai_perfect_atunci:
    title: Mihai bestätigt
    gloss: 'Mihai: Perfekt. Dann sehen wir uns am Samstag!'
    note: Ein freundlicher Schlusssatz, der den Plan für *sâmbătă* (Samstag) bestätigt; *ne vedem* bedeutet „wir sehen uns“.
