    gloss: 'Михай: Хорошая идея! Посмотрю прогноз погоды.'
    note: '*Bună idee!* значит «хорошая идея»; *bună* — женского рода, как и *idee*.'
  ro.a1.unit35.lesson04.teach.mihai_sambata_este:
    title: Михай проверяет погоду
    gloss: 'Михай: В субботу будет солнечно!'
