    title: Андрей видит сообщение
    gloss: 'Андрей: Вижу сообщение. До встречи в субботу!'
  ro.a1.unit35.lesson04.teach.stii_deja_la:
    title: До встречи + день
    gloss: 'Ты уже знаешь *La revedere!* Можно назвать и день: *Ne vedem sâmbătă!*, *Ne vedem mâine!*'
    note: Модель прощания из темы приветствий переносится на конкретный день.
  ro.a1.unit35.lesson05.teach.ana_il_suna:
    title: Кто чем пользуется?
    gloss: Ана звонит Михаю каждый день. Она пользуется телефоном, а не приложением. У Михая нет компьютера дома, но он пользуется интернетом на телефоне. Андрей каждое утро смотрит прогноз погоды. Потом он идёт на пробежку. Елена часто пишет Ане сообщения. А ты тоже пользуешься телефоном каждый день?
    note: Сравнивает, как четыре героя пользуются устройствами, по образцу сравнительного текста из темы спорта.
    glosses:
      sună: звонит
      fiecare: каждый
      zi: день
      folosește: пользуется
      telefonul: телефон
      aplicație: приложение
      computer: компьютер
      acasă: дома
      internet: интернет
      caută: ищет, смотрит
      dimineață: утро
      prognoza: прогноз погоды
      merge: идёт
      alergat: бегать
      trimite: отправляет
      des: часто
      mesaj: сообщение
      Folosești: пользуешься
  ro.a1.unit35.lesson05.teach.andrei_cauta_in:
    title: Андрей каждое утро смотрит прогноз
    gloss: Андрей каждое утро смотрит прогноз погоды.
  ro.a1.unit35.lesson05.teach.elena_trimite_des:
    title: Елена часто пишет Ане
    gloss: Елена часто отправляет Ане сообщение.
  ro.a1.unit35.lesson06.teach.ana_vad_mesajul:
    title: Ана подтверждает план
    gloss: 'Ана: Вижу сообщение. Давай позанимаемся спортом в парке в субботу в десять?'
  ro.a1.unit35.lesson06.teach.mihai_da_si:
    title: Михай подтверждает погоду
    gloss: 'Михай: Да, и в субботу будет солнечно!'
  ro.a1.unit35.lesson06.teach.andrei_atunci_alerg:
    title: План Андрея
    gloss: 'Андрей: Тогда я побегаю. Потом ещё поиграю в футбол.'
    note: '*După aceea* значит «после этого»; *joc* — форма *eu* глагола *a juca* (играть).'
  ro.a1.unit35.lesson06.teach.elena_eu_prefer:
    title: План Елены
    gloss: 'Елена: Я бы лучше поплавала, но в парк тоже приду.'
    note: '*Prefer să înot* значит «я предпочитаю плавать»: *a prefera* + *să* + глагол.'
  ro.a1.unit35.lesson06.teach.ana_super_ne:
    title: Ана завершает разговор
    gloss: 'Ана: Супер! До встречи в субботу в парке!'
    note: Одной фразой завершает переписку этого урока и план из темы спорта.
