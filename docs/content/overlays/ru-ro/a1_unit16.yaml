answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (doare, cap, stomac, simt, bolnav, nevoie, doctor, odihnă, multă) is used only in fixed first-person (Mihai's own "Nu mă simt bine"/"Sunt bolnav") or already-established formal ("Aveți nevoie de...?") forms. No informal-tu form is introduced this unit; Ana and Mihai keep their existing formal register with each other.
course:
  title: Румынский язык A1
  description: 'Как сказать по-румынски о простой проблеме со здоровьем: Doare (болит), Bolnav (больной) и Doctor (врач) — Михаю нездоровится, а Ана спрашивает, как он, и даёт советы.'
units:
  ro.a1.unit16.health:
    title: Здоровье
lessons:
  ro.a1.unit16.lesson01.ma_doare_capul:
    title: У меня болит голова
  ro.a1.unit16.lesson02.nu_ma_simt_bine:
    title: Я плохо себя чувствую
  ro.a1.unit16.lesson03.mihai_este_bolnav:
    title: Михай заболел
teaching:
  ro.a1.unit16.lesson01.teach.reminder_ma_va_ce_sau:
    title: 'Повторение: mă, vă, ce, sau'
    gloss: меня · вас (вежливо) · что · или
    note: 'Mă — из Уроков 1 и 10 (mă numesc, mă trezesc); vă — из Уроков 1, 6, 7 и 13 (vă rog); ce — из Уроков 1, 3, 4 и 15; sau — из Урока 13. Здесь все четыре слова используются по-новому: чтобы сказать, что болит.'
  ro.a1.unit16.lesson01.teach.doare_vocab:
    title: Болит
    gloss: болит
    note: 'Безличный глагол: по-румынски говорят буквально «мне болит» (*mă doare*), а не «я болю». *Mă doare* само по себе значит «у меня болит»; чтобы назвать, что болит, добавь часть тела: *Mă doare capul*.'
    example_gloss:
    - Болит.
  ro.a1.unit16.lesson01.teach.cap_vocab:
    title: Голова
    gloss: голова
    note: 'Существительное среднего рода, оканчивается на согласный: определённый артикль — *-ul*, «голова» (с артиклем) — capul. Так же, как *tren*→*trenul* и *peron*→*peronul*.'
    example_gloss:
    - У меня болит голова.
  ro.a1.unit16.lesson01.teach.ce_va_doare_phrase:
    title: Что у вас болит?
    gloss: Что у вас болит?
    note: '*Ce* (что) + *vă* (вам, вежливая форма) + *doare* (болит): все слова уже знакомы или только что введены, а вместе они образуют новый вопрос.'
  ro.a1.unit16.lesson01.teach.stomac_vocab:
    title: Желудок
    gloss: желудок
    note: Средний род, оканчивается на согласный, поэтому «желудок» с артиклем — *stomacul*. Тот же артикль *-ul*, что в *cap*→*capul*.
    example_gloss:
    - У меня болит живот.
  ro.a1.unit16.lesson01.teach.ma_doare_capul_sau_stomacul_phrase:
    title: У вас болит голова или желудок?
    gloss: У вас болит голова или желудок?
    note: Если вместо *mă* поставить *vă* (вам, вежливая форма), утверждение превращается в вопрос о собеседнике; *sau* (или, из Урока 13) соединяет две только что выученные части тела.
  ro.a1.unit16.lesson02.teach.reminder_nu_bine_am_un_de:
    title: 'Повторение: nu, bine, am, un, de'
    gloss: не / нет · хорошо · у меня есть · один, какой-то (м. и ср. род) · из, от, «о»
    note: Nu и bine — из Уроков 1, 6 и 11; am — из Уроков 2, 5 и 15; un и de — из Уроков 6, 7 и 15. В этом уроке все пять слов помогают сказать, что тебе нездоровится и нужен врач.
  ro.a1.unit16.lesson02.teach.ma_simt_vocab:
    title: Я себя чувствую
    gloss: я себя чувствую
    note: Возвратный глагол, буквально «я чувствую себя». Та же модель *mă* + глагол, что в *mă trezesc* и *mă culc* из Урока 10.
    example_gloss:
    - Я хорошо себя чувствую.
  ro.a1.unit16.lesson02.teach.nu_ma_simt_bine_phrase:
    title: Я плохо себя чувствую
    gloss: Я плохо себя чувствую.
    note: '*Nu* отрицает *mă simt bine*: так естественно сказать, что что-то не так, не называя конкретного симптома.'
  ro.a1.unit16.lesson02.teach.bolnav_vocab:
    title: Больной
    gloss: больной (м. р.)
    note: Форма мужского рода, как её говорит Михай (*Sunt bolnav*). Женщина говорит *Sunt bolnavă* (форма женского рода).
    example_gloss:
    - Я болен.
  ro.a1.unit16.lesson02.teach.am_nevoie_de_un_doctor_phrase:
    title: Мне нужен врач
    gloss: Мне нужен врач.
    note: '*Am nevoie de* (мне нужно, буквально «у меня есть нужда в») + *un doctor*: устойчивое выражение, полезное, когда просишь о помощи по любому поводу, а не только про врача.'
  ro.a1.unit16.lesson02.teach.doctor_vocab:
    title: Doctor
    gloss: врач
    note: Мужской род, поэтому «врач» с неопределённым артиклем — *un doctor*.
    example_gloss:
    - Мне нужен врач.
  ro.a1.unit16.lesson03.teach.reminder_ce_mai_faceti_aveti_da:
    title: 'Повторение: Ce mai faceți?, Aveți, Da'
    gloss: Как поживаете? (вежливо) · у вас есть (вежливо) · да
    note: Ce mai faceți — из Урока 1, Aveți — из Урока 5, Da — из Уроков 6 и 11. Всё это снова пригодится в диалоге этого урока.
  ro.a1.unit16.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Повторение: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: привет · спасибо · до свидания · Ана, Михай (имена)
    note: 'Всё это уже встречалось в прежних уроках: такое же дружелюбное начало и завершение есть в каждом диалоге курса.'
  ro.a1.unit16.lesson03.teach.reminder_spitalul_vizavi_magazin:
    title: 'Повторение: Spitalul este vizavi de magazin'
    gloss: Больница напротив магазина.
    note: 'Взято прямо из Урока 8: больница никуда не переехала, и заметка для чтения в этом уроке отсылает к ней.'
  ro.a1.unit16.lesson03.teach.odihna_vocab:
    title: Отдых
    gloss: отдых
    note: 'Существительное женского рода: то, что советует врач (или друг), когда тебе нездоровится.'
    example_gloss:
    - Тебе нужен отдых.
  ro.a1.unit16.lesson03.teach.multa_apa_vocab:
    title: Много воды
    gloss: много воды
    note: '*Multă* (много, женский род) согласуется с существительным женского рода *apă* (вода, из Урока 6). Это устойчивое сочетание, которое мог бы посоветовать врач.'
    example_gloss:
    - Отдых и много воды.
  ro.a1.unit16.lesson03.teach.line01:
    title: Поздороваться и спросить, как дела
    gloss: Ана здоровается с Михаем и спрашивает, как у него дела.
    note: Снова приветствие *Ce mai faceți?* из Урока 1.
  ro.a1.unit16.lesson03.teach.line02:
    title: Сказать, что плохо себя чувствуешь
    gloss: Михай говорит, что плохо себя чувствует и у него болит голова.
    note: Соединяет фразы из первого и второго занятий этого урока.
  ro.a1.unit16.lesson03.teach.line03:
    title: Спросить, нужен ли ему врач
    gloss: Ана спрашивает, нужен ли ему врач.
    note: Фраза из второго занятия этого урока в форме вопроса, с *aveți* из Урока 5.
  ro.a1.unit16.lesson03.teach.line04:
    title: Подтвердить, что болеешь и нужен врач
    gloss: Михай отвечает «да», говорит, что болен и что ему нужен врач.
    note: Соединяет *sunt bolnav* и *am nevoie de un doctor* из этого урока.
  ro.a1.unit16.lesson03.teach.line05:
    title: Дать совет и попрощаться
    gloss: Ана советует ему отдыхать и пить много воды и прощается.
    note: 'Здесь звучит *Odihnă și multă apă* из этого занятия: совет о здоровье вместо обычного простого прощания.'
  ro.a1.unit16.lesson03.teach.line06:
    title: Поблагодарить и попрощаться
    gloss: Михай благодарит Ану и прощается.
    note: Та же концовка, которой заканчивался диалог каждого предыдущего урока.
