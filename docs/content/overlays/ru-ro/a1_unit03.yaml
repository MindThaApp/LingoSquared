answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Day and month names are correctly lowercase in standard Romanian writing (except sentence-initially); accept a learner's answer regardless of the case they happen to type it in -- this unit teaches the lowercase convention as a fact to recognize, not a hard-graded spelling rule.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: Румынский язык A1
  description: Дни недели, месяцы года и то, как по-румынски называют дату (обычное количественное число и месяц, кроме первого числа, для которого есть особое слово întâi). Мы продолжаем следить за Аной и Михаем, которые планируют следующую встречу.
units:
  ro.a1.unit03.dates:
    title: Дни и даты
lessons:
  ro.a1.unit03.lesson01.zilele_saptamanii:
    title: Дни недели
  ro.a1.unit03.lesson02.lunile_si_datele:
    title: Месяцы года и как назвать дату
  ro.a1.unit03.lesson03.cand_ne_intalnim:
    title: Когда мы встретимся снова?
teaching:
  ro.a1.unit03.lesson01.teach.este:
    title: 'Напоминание: este'
    gloss: есть / это
    note: '*Este* уже встречалось в Уроке 2 (*Care este numărul...?*). Это слово не изменяется: оно одинаково, будь подлежащее днём, датой или чем-то другим, и не меняется ни при tu, ни при dumneavoastră.'
  ro.a1.unit03.lesson01.teach.astazi_maine:
    title: Сегодня, завтра
    gloss: astăzi (сегодня) / mâine (завтра)
    note: Оба слова не изменяются и стоят в начале предложения, в котором называют день или дату.
    example_gloss:
    - Сегодня понедельник.
    - Завтра вторник.
  ro.a1.unit03.lesson01.teach.luni_marti:
    title: Понедельник, вторник
    gloss: luni (понедельник) / marți (вторник)
    note: Чтобы назвать день (Astăzi este luni), используй простую форму, показанную здесь. У названий дней есть и формы с артиклем — lunea, marțea, — которые значат «по понедельникам», «по вторникам»; с ними ты познакомишься позже.
    example_gloss:
    - Сегодня понедельник.
    - Завтра вторник.
  ro.a1.unit03.lesson01.teach.miercuri_joi:
    title: Среда, четверг
    gloss: miercuri (среда) / joi (четверг)
    note: Как и luni и marți, miercuri и joi имеют одну и ту же форму в единственном и множественном числе.
    example_gloss:
    - Сегодня среда.
    - Завтра четверг.
  ro.a1.unit03.lesson01.teach.vineri_sambata:
    title: Пятница, суббота
    gloss: vineri (пятница) / sâmbătă (суббота)
    note: В современном написании sâmbătă сохраняет â в середине слова, в отличие от старой формы sîmbătă.
    example_gloss:
    - Сегодня пятница.
    - Завтра суббота.
  ro.a1.unit03.lesson01.teach.duminica:
    title: Воскресенье
    gloss: воскресенье
    note: Duminică завершает неделю. Чтобы сказать, какой сегодня день, используй эту простую форму; форма с артиклем duminica значит «по воскресеньям».
    example_gloss: Сегодня воскресенье.
  ro.a1.unit03.lesson01.teach.ce_zi_e_azi:
    title: Спросить, какой сегодня день
    gloss: Какой сегодня день?
    note: 'Обычный способ спросить, какой сегодня день недели: zi («день») — новое слово, а ce, este и astăzi тебе уже знакомы.'
  ro.a1.unit03.lesson01.teach.saptamana_ieri:
    title: Неделя, вчера, на прошлой/следующей неделе
    gloss: săptămână (неделя) / ieri (вчера) / săptămâna trecută (прошлая неделя) / săptămâna viitoare (следующая неделя)
    note: 'Дополнительный набор слов из того же материала, что и названия дней недели: он пригодится, чтобы говорить о датах относительно настоящего момента. В упражнениях этого урока он отрабатывается не так интенсивно, как сами дни недели.'
  ro.a1.unit03.lesson01.teach.lowercase_zile:
    title: Дни недели пишутся со строчной буквы
    gloss: 'Дни недели не пишутся с заглавной буквы: понедельник, пятница.'
    note: 'Как и в русском, названия дней недели в румынском не пишутся с заглавной буквы в середине предложения: *luni*, а не *Luni*; заглавная нужна, только если слово начинает предложение.'
  ro.a1.unit03.lesson02.teach.ian_feb_mar:
    title: Январь, февраль, март
    gloss: ianuarie (январь) / februarie (февраль) / martie (март)
    note: 'В отличие от названий дней недели, многие названия месяцев легко узнать: они похожи на русские, потому что восходят к латинским названиям.'
    example_gloss:
    - Сейчас январь.
    - Сейчас февраль.
    - Сейчас март.
  ro.a1.unit03.lesson02.teach.apr_mai_iun:
    title: Апрель, май, июнь
    gloss: aprilie (апрель) / mai (май) / iunie (июнь)
    note: Mai (май) — короткое слово, но оно отличается от наречия mai («ещё, более»), которое встречается в других местах курса (ce mai faci). Контекст всегда подсказывает, о чём речь.
    example_gloss:
    - Сейчас апрель.
    - Сейчас май.
    - Сейчас июнь.
  ro.a1.unit03.lesson02.teach.iul_aug_sep:
    title: Июль, август, сентябрь
    gloss: iulie (июль) / august (август) / septembrie (сентябрь)
    note: Слово August по написанию почти совпадает с русским «август» — это один из самых прозрачных родственных корней в этом наборе.
    example_gloss:
    - Сейчас июль.
    - Сейчас август.
    - Сейчас сентябрь.
  ro.a1.unit03.lesson02.teach.oct_noi_dec:
    title: Октябрь, ноябрь, декабрь
    gloss: octombrie (октябрь) / noiembrie (ноябрь) / decembrie (декабрь)
    note: Последние три месяца завершают набор из двенадцати; все они — неизменяемые существительные.
    example_gloss:
    - Сейчас октябрь.
    - Сейчас ноябрь.
    - Сейчас декабрь.
  ro.a1.unit03.lesson02.teach.intai:
    title: Первое (число месяца)
    gloss: первое
    note: 'Это особое правило румынского языка: в стандартной речи первое число месяца называют не *unu* (обычное «один»), а особым словом *întâi*. (В разговорной речи можно услышать *unu*, но учить нужно форму *întâi*.) Все остальные даты, начиная со второго числа, образуются с обычным количественным числительным.'
    example_gloss: Сегодня первое августа.
  ro.a1.unit03.lesson02.teach.date_rule:
    title: Как по-румынски назвать дату
    gloss: '1-е число: întâi · со 2-го числа: обычное числительное (doi, trei, patru...)'
    note: 'Начиная со 2-го числа, дата по-румынски — это просто количественное числительное (оно уже встречалось) и название месяца: порядковой формы и лишних слов не нужно, например *trei aprilie* (третье апреля, буквально «три апрель»).'
  ro.a1.unit03.lesson02.teach.ce_data:
    title: Спрашиваем дату
    gloss: Какое сегодня число?
    note: Dată (дата) — новое слово; остальная часть вопроса повторяет ce, este и astăzi, как в вопросе о дне недели в lesson01.
  ro.a1.unit03.lesson02.teach.raspuns_data:
    title: Назвать дату
    gloss: Сегодня третье апреля.
    note: Trei (три) — числительное из Unit 2; порядкового окончания нет, и перед aprilie не нужно никакого дополнительного слова.
  ro.a1.unit03.lesson02.teach.la_multi_ani:
    title: Поздравьте человека с праздником
    gloss: С днём рождения! / С Новым годом!
    note: Буквально «(на) многие годы» — самое распространённое румынское пожелание на день рождения, именины или Новый год; в нём использовано слово *ani* (годы) из темы возраста в Unit 2.
  ro.a1.unit03.lesson02.teach.lowercase_luni:
    title: Месяцы тоже пишутся со строчной буквы
    gloss: 'Месяцы пишутся без заглавной буквы: ianuarie, mai.'
    note: 'Правило то же, что и для дней недели в lesson01: названия месяцев в середине предложения остаются строчными, как и в русском.'
  ro.a1.unit03.lesson03.teach.cand:
    title: Когда?
    gloss: когда?
    note: Când открывает вопрос о времени, как и русское «когда».
    example_gloss: Когда встреча?
  ro.a1.unit03.lesson03.teach.intalnirea:
    title: Встреча
    gloss: встреча
    note: Întâlnirea — форма с определённым артиклем (встреча); без артикля существительное звучало бы как întâlnire.
    example_gloss: Встреча в понедельник.
  ro.a1.unit03.lesson03.teach.cand_e_intalnirea:
    title: Спросите, когда что-то состоится
    gloss: Когда встреча?
    note: Объединяет уже знакомые când и este с новым словом этого урока — întâlnirea.
  ro.a1.unit03.lesson03.teach.raspuns_intalnire:
    title: Назовите дату события
    gloss: Встреча в пятницу, первого августа.
    note: День недели и дату можно назвать вместе, через запятую, как и по-русски.
  ro.a1.unit03.lesson03.teach.fara_de:
    title: Для дней и дат не нужен предлог de
    gloss: 'Для дней и дат не нужно «de»: vineri, întâi august (в пятницу, первого августа).'
    note: 'Полезный контраст с правилом из Unit 2: числа от 20 требуют *de* перед обычным существительным (*treizeci de ani*), а день недели или дата присоединяются напрямую, вообще без *de*.'
  ro.a1.unit03.lesson03.teach.line01:
    title: Спросите, когда встреча
    gloss: Ана спрашивает Михая, когда их встреча.
    note: 'Простой нейтральный вопрос: este не меняется ни при обращении на ты, ни при обращении на вы (dumneavoastră).'
  ro.a1.unit03.lesson03.teach.line02:
    title: Назвать дату
    gloss: Михай говорит, что встреча в пятницу, первого августа.
    note: 'Михай использует ту же модель даты из lesson02: день недели, затем întâi + месяц, без de.'
  ro.a1.unit03.lesson03.teach.line03:
    title: Поблагодарите и попрощайтесь
    gloss: Ана благодарит его и прощается.
    note: La revedere, которое мы изучили в Unit 1, завершает разговор так же, как и всегда.
  ro.a1.unit03.lesson03.teach.line04:
    title: Завершите разговор
    gloss: Михай тоже прощается, называя Ану по имени.
    note: Повторить la revedere и добавить имя собеседника — естественный, дружелюбный способ завершить разговор.
