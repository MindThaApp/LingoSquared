answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's "Vă rog" (formal, sourced) and "Te rog" (informal, freshly authored) are register-sensitive parallels, matching unit02's ai/aveți and unit05's ai frați/aveți frați pattern -- accept either register for a general "please" unless an exercise explicitly names one. Ana and Mihai's closing café dialogue keeps their existing polite register with each other (both use "vă rog," not "te rog").
course:
  title: Румынский язык A1
  description: 'Заказ еды и напитков по-румынски: кофе, чай, хлеб и не только. Главная фраза для заказа — «Aș dori ...» («Я бы хотел ...»), а также пара вежливых слов vă rog/te rog. Ана и Михай продолжают общаться, встретившись в кафе.'
units:
  ro.a1.unit06.food:
    title: Еда и напитки
lessons:
  ro.a1.unit06.lesson01.bauturi:
    title: Напитки
  ro.a1.unit06.lesson02.va_rog_si_mancare:
    title: Пожалуйста, и еда
  ro.a1.unit06.lesson03.la_cafenea:
    title: В кафе
teaching:
  ro.a1.unit06.lesson01.teach.reminder_un_o_si:
    title: 'Повторение: un, o, și'
    gloss: un/o (один, одна) · și (и)
    note: Все три слова уже встречались раньше (*și* в уроке 1, *o* в уроке 2, *un* в уроке 4) — теперь они вернулись в теме еды и напитков.
  ro.a1.unit06.lesson01.teach.as_dori:
    title: Я хотел бы ...
    gloss: Aș dori ... (Я бы хотел ...)
    note: Обычный вежливый способ сделать заказ по-румынски — устойчивая форма условного наклонения, она не меняется в зависимости от того, что идёт дальше.
  ro.a1.unit06.lesson01.teach.apa:
    title: Вода
    gloss: apă (вода)
    note: Существительное женского рода; если количество не уточняется, употребляется без артикля, как и русское «вода» в таком случае.
    example_gloss: Я бы хотел воды.
  ro.a1.unit06.lesson01.teach.cafea:
    title: Кофе
    gloss: cafea (кофе)
    note: Женский род — сочетается с *o* («один, одна») так же, как и любое другое существительное женского рода.
    example_gloss: Я бы хотел кофе.
  ro.a1.unit06.lesson01.teach.ceai:
    title: Чай
    gloss: ceai (чай)
    note: 'Сочетается с *un*, а не с *o*: ceai — существительное мужского или среднего рода.'
    example_gloss: Я бы хотел чай.
  ro.a1.unit06.lesson01.teach.suc:
    title: Сок
    gloss: suc (сок)
    note: Тоже употребляется с *un*, как и ceai.
    example_gloss: Я бы хотел сок.
  ro.a1.unit06.lesson01.teach.lapte:
    title: Молоко
    gloss: lapte (молоко)
    note: Как и apă, обычно употребляется без артикля, если количество не уточняется.
    example_gloss: Я бы хотел молока.
  ro.a1.unit06.lesson01.teach.mi_e_sete:
    title: Мне хочется пить
    gloss: Mi-e sete (Мне хочется пить)
    note: Устойчивое выражение; буквально оно ближе к «мне есть жажда», чем к «я испытываю жажду».
  ro.a1.unit06.lesson01.teach.as_dori_o_cafea:
    title: Я хотел бы кофе
    gloss: Я хотел бы кофе.
    note: Фраза для заказа и существительное женского рода — вместе в одном целом предложении.
  ro.a1.unit06.lesson02.teach.reminder_multumesc_bine_da_nu:
    title: 'Повторение: mulțumesc, bine, da, nu'
    gloss: mulțumesc (спасибо) · bine (хорошо) · da (да) · nu (нет)
    note: '*Mulțumesc* и *bine* впервые появились в приветствиях урока 1, а *da* и *nu* — в уроках 3 и 5; теперь они вернулись в теме еды и вежливости.'
  ro.a1.unit06.lesson02.teach.mi_e_foame:
    title: Я хочу есть
    gloss: Mi-e foame (Я хочу есть)
    note: То же устойчивое выражение, что и *Mi-e sete*, только с foame (голод) вместо sete (жажда).
  ro.a1.unit06.lesson02.teach.paine:
    title: Хлеб
    gloss: pâine (хлеб)
    note: Обычно употребляется без артикля, как и русское «хлеб» в таком случае.
    example_gloss: Я хочу есть. Я бы хотел хлеба.
  ro.a1.unit06.lesson02.teach.mancare:
    title: Еда
    gloss: mâncare (еда)
    note: Общее слово «еда», а не название конкретного блюда.
    example_gloss: Я бы хотел поесть.
  ro.a1.unit06.lesson02.teach.carne:
    title: Мясо
    gloss: carne (мясо)
    note: Общее слово «мясо»; конкретные виды (carne de vită, carne de porc) уточняются словами после него.
    example_gloss: Я бы хотел мяса.
  ro.a1.unit06.lesson02.teach.pui:
    title: Курица
    gloss: pui (курица)
    note: Особое слово для курицы (как блюда), отличное от общего carne.
    example_gloss: Я бы хотел курицу.
  ro.a1.unit06.lesson02.teach.fructe:
    title: Фрукты
    gloss: fructe (фрукты)
    note: Обычная форма множественного числа, как и в русском «фрукты» для общего обозначения категории.
    example_gloss: Я бы хотел фруктов.
  ro.a1.unit06.lesson02.teach.va_rog:
    title: Пожалуйста (на «вы»)
    gloss: vă rog (пожалуйста, на «вы»)
    note: Вежливый способ сказать «пожалуйста»; соответствует форме вежливого обращения dumneavoastră из уроков 1 и 2.
    example_gloss: Кофе, пожалуйста.
  ro.a1.unit06.lesson02.teach.te_rog:
    title: Пожалуйста (на «ты»)
    gloss: te rog (пожалуйста, на «ты»)
    note: Повседневный вариант для друзей и тех, к кому ты обращаешься на *tu*; соответствует обращению на «ты» из урока 1.
    example_gloss: Чай, пожалуйста.
  ro.a1.unit06.lesson03.teach.reminder_buna_ziua_bine_la_revedere:
    title: 'Повторение: bună, ziua, bine, la revedere, Ana, Mihai'
    gloss: bună ziua (добрый день / здравствуйте) · bine (хорошо) · la revedere (до свидания) · Ana, Mihai (имена)
    note: Всё это уже встречалось в диалогах уроков 1 и 5; теперь Ана и Михай снова встречаются, на этот раз в кафе.
  ro.a1.unit06.lesson03.teach.line01:
    title: Поздороваться и сказать, что голоден
    gloss: Ана здоровается с Михаем и говорит, что хочет есть.
    note: Прямо в приветствии используется *Mi-e foame* из этого урока.
  ro.a1.unit06.lesson03.teach.line02:
    title: Заказать еду
    gloss: Михай говорит, что хотел бы хлеба и курицу.
    note: Слова pâine и pui из этого урока снова используются с фразой Aș dori.
  ro.a1.unit06.lesson03.teach.line03:
    title: Вежливо заказать напиток
    gloss: Ана говорит, что хотела бы кофе, пожалуйста.
    note: Здесь объединены Aș dori, cafea и vă rog — три элемента, которые в этом уроке изучались по отдельности.
  ro.a1.unit06.lesson03.teach.line04:
    title: Тоже заказать напиток
    gloss: Михай говорит, что хотел бы чай, пожалуйста.
    note: Та же схема, что и в реплике Аны, только ceai вместо cafea.
  ro.a1.unit06.lesson03.teach.line05:
    title: Поблагодарить и проститься
    gloss: Ана благодарит Михая и прощается.
    note: '*Mulțumesc* здесь — простая заключительная благодарность, то же слово, что и в *Bine, mulțumesc.* из урока 1.'
  ro.a1.unit06.lesson03.teach.line06:
    title: Завершить встречу
    gloss: Михай тоже прощается, называя Ану по имени.
    note: Та же дружеская концовка, которой заканчивались диалоги уроков 1 и 5.
