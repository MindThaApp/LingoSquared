teaching:
  ro.a1.unit28.lesson01.teach.a_suna:
    title: Звонить
    gloss: звонить
    note: Инфинитив глагола, которым обозначают звонок по телефону.
    example_gloss: Мне нужно тебе позвонить.
  ro.a1.unit28.lesson01.teach.te_sun:
    title: Говорим, что позвоним
    gloss: Я тебе позвоню.
    note: '*Sun* — форма *eu* глагола *a suna* («звонить»); *te* («тебе») стоит перед глаголом. Здесь румынский использует настоящее время, хотя по-русски мы скажем «позвоню».'
  ro.a1.unit28.lesson01.teach.alo_sunt_ana:
    title: Отвечаем на звонок
    gloss: Алло, это Ana.
    note: '*Alo* — так отвечают на телефонный звонок; *sunt* + имя говорит, кто вы, — как русское «это Ana» (букв. «я Ana»).'
  ro.a1.unit28.lesson01.teach.alo_sunt_mihai:
    title: Mihai отвечает так же
    gloss: Алло, это Mihai.
    note: Та же модель *Alo, sunt* + имя, что и в *Alo, sunt Ana*.
  ro.a1.unit28.lesson02.teach.cu_cine_vorbesc:
    title: Спрашиваем, кто звонит
    gloss: С кем я разговариваю?
    note: '*Cu cine vorbesc?* (букв. «с кем я говорю?») — стандартный способ спросить, кто звонит.'
  ro.a1.unit28.lesson02.teach.vorbiti_cu_ana:
    title: Представляемся официально
    gloss: Вы говорите с Ana.
    note: '*Vorbiți cu* + имя — вежливый ответ: *vorbiți* — форма *dumneavoastră* глагола *a vorbi* («говорить»).'
  ro.a1.unit28.lesson03.teach.poti_sa_repeti:
    title: Просим повторить
    gloss: Ты можешь повторить?
    note: '*Poți să* ... («Можешь ...?») + *repeți* («повторяешь») + *asta* («это»).'
  ro.a1.unit28.lesson03.teach.nu_vorbi_atat:
    title: Просим говорить помедленнее
    gloss: Не говори так быстро, пожалуйста.
    note: '*Nu vorbi* («не говори») — это *nu* + форма *tu*; *atât de repede* значит «так быстро».'
  ro.a1.unit28.lesson03.teach.nu_te_aud:
    title: Говорим, что плохо слышно
    gloss: Я тебя плохо слышу.
    note: '*Nu te aud bine*: *aud* — «я слышу», *te* («тебя») стоит перед глаголом, *bine* значит «хорошо».'
  ro.a1.unit28.lesson04.teach.mesajul:
    title: Сообщение
    gloss: сообщение
    note: '*Mesaj* в единственном числе мужского рода, а во множественном — женского (*un mesaj*, *două mesaje*); определённый артикль присоединяется в конце: *mesajul*.'
    example_gloss: Сообщение от Ana.
  ro.a1.unit28.lesson04.teach.iti_trimit_un:
    title: Как сказать, что отправишь сообщение
    gloss: Я пришлю тебе сообщение.
    note: '*Îți* («тебе») — местоимение в дательном падеже, стоит перед глаголом: *Îți trimit un mesaj*.'
  ro.a1.unit28.lesson04.teach.te_sun_inapoi:
    title: Как сказать, что перезвонишь
    gloss: Я позвоню тебе позже.
    note: '*Înapoi* («обратно») стоит после глагола: *te sun înapoi* значит «я тебе перезвоню», а *mai târziu* — «позже».'
  ro.a1.unit28.lesson05.teach.mihai_salut_ana:
    title: Прочитай переписку
    gloss: 'Mihai: Привет, Ana, можешь мне позвонить? Мне нужно кое-что тебе сказать. Ana: Да, конечно, я перезвоню тебе через пять минут.'
    note: Найди, о чём просит Mihai, зачем и когда Ana обещает перезвонить.
    glosses:
      Salut: привет
      poți: мочь
      suna: звонить
      Trebuie: надо / должен
      ceva: что-то
      spun: рассказать
      sigur: конечно
      sun: звонить
      cinci: пять
      minute: минуты
      înapoi: обратно
  ro.a1.unit28.lesson06.teach.mihai_alo_sunt:
    title: Mihai отвечает на звонок
    gloss: 'Mihai: Алло, это Mihai.'
    note: 'Та же модель *Alo, sunt* + имя из первого урока, теперь в настоящем разговоре: тот, кто берёт трубку, говорит первым и называет своё имя.'
  ro.a1.unit28.lesson06.teach.ana_salut_mihai:
    title: Ana называет себя
    gloss: 'Ana: Привет, Mihai, это Ana. Mihai: Как хорошо, что ты звонишь!'
    note: '*Ce bine că* ... («как хорошо, что ...») выражает положительную реакцию на событие; *suni* — форма *tu* глагола *a suna*.'
  ro.a1.unit28.lesson06.teach.ana_cum_a:
    title: Ана спрашивает о смене
    gloss: 'Ана: Как прошла твоя первая смена?'
    note: '*A fost* значит «был/была/было» (прошедшее от *a fi*). Это perfect compus, образованный так же, как *am mâncat*; см. примечание после следующей реплики.'
  ro.a1.unit28.lesson06.teach.mihai_a_mers:
    title: Михай рассказывает хорошие новости
    gloss: 'Михай: Всё прошло очень хорошо, лучше, чем я думал.'
    note: '*A mers* — прошедшее от *a merge* (идти; здесь «получиться, пройти»); *credeam* значит «я думал» (прошедшая форма от *a crede*).'
  ro.a1.unit28.lesson06.teach.a_fost_a:
    title: 'Формы прошедшего: a fost, a mers, credeam'
    gloss: был → быть, шёл/прошёл → идти, думал → думать
    note: '*A fost* и *a mers* — формы perfect compus (*a* + причастие), а *credeam* — imperfect. Пока просто запомни их как готовые выражения в тех контекстах, где они встречаются в этом уроке; полные правила прошедшего времени будут на следующем уровне.'
  ro.a1.unit28.lesson06.teach.ana_ma_bucur:
    title: Ана гордится
    gloss: 'Ана: Как приятно это слышать! Я горжусь тобой.'
    note: '*Mândră de* («горжусь кем-то») — устойчивое сочетание; *de* обязательно. Мужчина скажет *mândru*.'
  ro.a1.unit28.lesson06.teach.mihai_iti_multumesc:
    title: Михай тронут
    gloss: 'Михай: Спасибо, для меня это много значит.'
    note: '*Înseamnă* — форма 3-го лица единственного числа от *a însemna* (значить); *pentru mine* («для меня») указывает, для кого это важно.'
  ro.a1.unit28.lesson06.teach.prima_lui_tura:
    title: Его
    gloss: Его первая смена прошла очень хорошо.
    note: '*Lui* после существительного означает «его»: *prima lui tură*. (Для «её» используется *ei*.)'
