  ro.a1.unit30.lesson05.mihai_si_ana_isi:
    title: Михай и Ана сравнивают свои увлечения
  ro.a1.unit30.lesson06.planuim_impreuna_un_weekend:
    title: Планируем выходные вместе
teaching:
  ro.a1.unit30.lesson01.teach.a_citi_a:
    title: Чтение, спорт, готовка
    gloss: читать, заниматься спортом, готовить
    note: 'Три распространённых глагола для разговора о хобби: *a citi* (читать), *a face sport* (заниматься спортом) и *a găti* (готовить). Словарные формы румынских глаголов начинаются с *a*.'
    example_gloss:
    - Мне нравится читать книгу.
    - По субботам я занимаюсь спортом.
    - Мне нравится готовить для друзей.
  ro.a1.unit30.lesson01.teach.timpul_liber:
    title: Свободное время
    gloss: свободное время
    note: '*Timpul liber* (свободное время) образовано от существительного мужского рода *timp* с присоединённым артиклем. Это ключевое выражение для разговора о хобби.'
    example_gloss: В свободное время я люблю читать.
  ro.a1.unit30.lesson01.teach.in_timpul_liber:
    title: Как сказать, чем занимаешься в свободное время
    gloss: В свободное время я люблю читать.
    note: '*Citesc* — форма *eu* («я») от *a citi* (читать); после *îmi place să* глагол остаётся в той же форме.'
  ro.a1.unit30.lesson02.teach.a_asculta_muzica:
    title: Музыка, рисование, видеоигры
    gloss: слушать музыку, рисовать, играть в видеоигры
    note: 'Ещё три выражения о хобби: *a asculta muzică* (слушать музыку), *a desena* (рисовать) и *a juca jocuri video* (играть в видеоигры).'
    example_gloss:
    - Я люблю слушать музыку.
    - Я часто рисую.
    - Я люблю играть в видеоигры с друзьями.
  ro.a1.unit30.lesson02.teach.imi_place_sa:
    title: Говорим, что любим слушать музыку
    gloss: Я люблю слушать музыку.
    note: '*Îmi place să ascult muzică*: *îmi place* («мне нравится») + *să* + глагол — обычный способ сказать, что тебе нравится что-то делать.'
  ro.a1.unit30.lesson02.teach.imi_place_sa_2:
    title: Говорим, что любим играть в видеоигры с друзьями
    gloss: Я люблю играть в видеоигры с друзьями.
    note: '*Cu prietenii* значит «с друзьями»: *cu* («с») — предлог, а *prietenii* — множественное число с определённым артиклем, который в румынском стоит в конце слова.'
  ro.a1.unit30.lesson03.teach.mereu_des_uneori:
    title: Всегда, часто, иногда, никогда
    gloss: всегда, часто, иногда, никогда
    note: 'Четыре основных наречия частоты: *mereu*, *des*, *uneori* и *niciodată*. Обычно они стоят после глагола: *Citesc des*.'
    example_gloss:
    - Я всегда занимаюсь спортом по субботам.
    - Я часто читаю книгу.
    - Иногда я рисую.
    - Я никогда не играю в видеоигры.
  ro.a1.unit30.lesson03.teach.in_fiecare_saptamana:
    title: Каждую неделю, каждые выходные
    gloss: каждую неделю, каждые выходные
    note: '*În fiecare săptămână* и *în fiecare weekend* значат «каждую неделю» и «каждые выходные»; *fiecare* не изменяется, см. следующую карточку.'
    example_gloss:
    - Я каждую неделю готовлю для друзей.
    - Я занимаюсь спортом каждые выходные.
  ro.a1.unit30.lesson03.teach.cuvantul_fiecare_nu:
    title: Fiecare не изменяется
    gloss: 'Слово fiecare не изменяется: în fiecare săptămână (каждую неделю), în fiecare weekend (каждые выходные).'
    note: '*Fiecare* остаётся неизменным перед *săptămână* и *weekend*, каким бы ни было существительное, так что выбирать форму не нужно.'
  ro.a1.unit30.lesson03.teach.ce_faci_in:
    title: Спрашиваем о свободном времени
    gloss: Чем ты занимаешься в свободное время?
    note: Это главный вопрос этого раздела — с ним можно спросить любого человека о его увлечениях.
  ro.a1.unit30.lesson04.teach.ana_ne_plimbam:
    title: Ана заговаривает о хобби
    gloss: 'Ана: Мы часто гуляем вместе. А чем ты ещё занимаешься в свободное время, Михай?'
    note: '*Ne plimbăm* («мы гуляем») — форма *noi* возвратного глагола *a se plimba*; она относится к прогулкам, которые нравятся обоим друзьям.'
  ro.a1.unit30.lesson04.teach.mihai_imi_place:
    title: Хобби Михая
    gloss: 'Михай: Я люблю готовить, и дома тоже. И часто занимаюсь спортом.'
    note: '*Și acasă* («и дома тоже») поясняет, что Михай готовит для удовольствия, а не только на работе в ресторане.'
  ro.a1.unit30.lesson04.teach.ana_gatesti_si:
    title: Ана удивлена
    gloss: 'Ана: Ты и дома готовишь? Ты же и так целый день готовишь на работе!'
    note: '*Toată ziua* («целый день») подчёркивает, как много Михай уже готовит на работе; *deja* значит «уже».'
  ro.a1.unit30.lesson04.teach.mihai_da_dar:
    title: Михай объясняет
    gloss: 'Михай: Да, но мне кажется, что готовить — это расслабляет. А ты что любишь делать?'
    note: '*Gătitul mi se pare relaxant* буквально значит «готовка кажется мне расслабляющей»: *mi se pare* — распространённый способ выразить мнение.'
  ro.a1.unit30.lesson04.teach.ana_imi_place:
    title: Хобби Аны
    gloss: 'Ана: Я люблю читать и часто слушаю музыку.'
    note: В одном предложении с *și* («и») соединены два глагола хобби из уроков 1 и 2.
  ro.a1.unit30.lesson04.teach.mihai_joci_si:
    title: Михай спрашивает об играх
    gloss: 'Михай: Ты тоже играешь в видеоигры?'
    note: Короткий вопрос с ответом «да» или «нет» со словами *jocuri video* из урока 2; *joci* — форма *tu* глагола *a juca*.
  ro.a1.unit30.lesson04.teach.ana_nu_nu:
    title: Ответ Аны
    gloss: 'Ана: Нет, я никогда не играю в видеоигры. Но иногда рисую!'
    note: '*Niciodată* («никогда») и *uneori* («иногда») из урока 3 противопоставлены в одном ответе; в *nu ... niciodată* два отрицания, как и в русском «не ... никогда».'
  ro.a1.unit30.lesson05.teach.mihai_si_cu:
    title: Сравниваем увлечения
    gloss: Михай и я часто гуляем вместе. Но у нас есть и другие увлечения. Михай любит готовить, и дома тоже, и часто занимается спортом. Я люблю читать и часто слушаю музыку. Иногда я рисую, но никогда не играю в видеоигры. А что ты любишь делать в свободное время?
    note: В сообщении Ана повторяет факты из предыдущих уроков и в конце задаёт читателю главный вопрос этого раздела.
    glosses:
      plimbăm: гуляем
      des: часто
      împreună: вместе
      alte: другие
      gătească: готовит
      place: нравится
      acasă: дома
      sport: занимается спортом
      citesc: читать
      ascult: слушаю
      muzică: музыка
      desenez: рисую
      uneori: иногда
      joc: играть в видеоигры
      niciodată: никогда
      liber: свободное
      timpul: время
  ro.a1.unit30.lesson06.teach.mihai_ce_faci:
    title: Михай спрашивает о выходных
    gloss: 'Михай: Что ты делаешь в эти выходные?'
    note: В *În acest weekend* («в эти выходные») слово *acest* значит «этот».
  ro.a1.unit30.lesson06.teach.ana_inca_nu:
    title: Ана ещё не решила
    gloss: 'Ана: Пока не знаю. Я люблю читать, но хочу ещё и выйти на улицу.'
    note: '*Să ies afară* («выйти на улицу») — обычный способ сказать, что хочешь выйти из дома; *vreau să* + глагол значит «я хочу ...».'
  ro.a1.unit30.lesson06.teach.mihai_hai_sa:
    title: Михай предлагает план
    gloss: 'Михай: Давай погуляем вместе! А потом я приготовлю что-нибудь для нас.'
    note: '*După aceea* («после этого») указывает на последовательность; *Hai să* + глагол — предложение сделать что-то вместе.'
  ro.a1.unit30.lesson06.teach.ana_buna_idee:
    title: Ана соглашается
    gloss: 'Ана: Хорошая идея! Я люблю и гулять, и готовить.'
    note: '*Și ..., și ...* («и ..., и ...») показывает, что Ане нравятся обе вещи одинаково, а не одна больше другой.'
  ro.a1.unit30.lesson06.teach.mihai_perfect_atunci:
    title: Михай подтверждает
    gloss: 'Михай: Отлично. Тогда увидимся в субботу!'
    note: Дружеская заключительная фраза, подтверждающая план на *sâmbătă* («субботу»); *ne vedem* значит «увидимся».
