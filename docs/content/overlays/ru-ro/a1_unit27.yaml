teaching:
  ro.a1.unit27.lesson01.teach.fericit_trist_suparat:
    title: Радость, грусть и злость
    gloss: рад, грустный, сердитый
    note: 'Три базовых слова для чувств с глаголом *a fi* (быть). У каждого есть форма женского рода на *-ă*: *fericită*, *tristă*, *supărată*.'
    example_gloss:
    - Я рад.
    - Мне грустно.
    - Я сержусь.
  ro.a1.unit27.lesson01.teach.sunt_fericit:
    title: Говорим, что ты рад
    gloss: Я счастлив.
    note: '*Sunt* (от *a fi*, быть) + прилагательное, обозначающее чувство, — основная модель, как и в русском «я счастлив», только глагол быть в настоящем времени в русском опускается, а в румынском он обязателен. Женщина говорит *Sunt fericită*.'
  ro.a1.unit27.lesson01.teach.nu_sunt_suparat:
    title: Противопоставляем чувства
    gloss: Я не сержусь, мне грустно.
    note: '*Nu* перед глаголом делает предложение отрицательным: *Nu sunt supărat*. Вторая часть называет настоящее чувство.'
  ro.a1.unit27.lesson02.teach.de_ce_esti:
    title: Спрашиваем «почему»
    gloss: Почему ты рад?
    note: '*De ce* (почему) — стандартный вопрос о причине.'
  ro.a1.unit27.lesson02.teach.sunt_fericit_pentru:
    title: Называем причину
    gloss: Я рад, потому что у меня новая квартира.
    note: '*Pentru că* (потому что) вводит придаточное с причиной; порядок слов остаётся обычным: *am un apartament nou*.'
  ro.a1.unit27.lesson02.teach.sunt_trist_pentru:
    title: Грустная причина
    gloss: Мне грустно, потому что идёт дождь.
    note: У *Plouă* (идёт дождь) в румынском нет подлежащего, поэтому оно само по себе может быть придаточным причины.
  ro.a1.unit27.lesson03.teach.emotionat:
    title: Нервный
    gloss: нервный
    note: Обычное слово для обозначения волнения.
    example_gloss: Я нервничаю перед своей первой сменой.
  ro.a1.unit27.lesson03.teach.sunt_emotionat_pentru:
    title: Говорим, из-за чего ты нервничаешь
    gloss: Я нервничаю перед своей первой сменой.
    note: '*Pentru* (буквально «для») вводит то, из-за чего волнуешься; в русском здесь говорят «из-за» или «перед».'
  ro.a1.unit27.lesson03.teach.nu_ti_face:
    title: Успокаиваем человека
    gloss: Не волнуйся.
    note: '*Nu-ți face griji* (буквально «не делай себе забот») — стандартная устойчивая фраза утешения. Незнакомому человеку или на «вы»: *Nu vă faceți griji*.'
  ro.a1.unit27.lesson04.teach.cum_se_simte:
    title: Спрашиваем, как человек себя чувствует
    gloss: Как себя чувствует Михай?
    note: '*A se simți* (чувствовать себя) — возвратный глагол: *mă simt* (я), *te simți* (ты), *se simte* (он/она). Это стандартный способ спросить о чувствах или описать их.'
  ro.a1.unit27.lesson04.teach.el_se_simte:
    title: Описываем, как человек себя чувствует
    gloss: Он нервничает.
    note: '*Se* — возвратное местоимение для он/она, оно стоит перед глаголом: *se simte*.'
  ro.a1.unit27.lesson04.teach.de_ce_se:
    title: Спрашиваем, почему человек так себя чувствует
    gloss: Почему он нервничает?
    note: Соединяет *de ce* с моделью *se simte* из фразы *El se simte emoționat*.
  ro.a1.unit27.lesson05.teach.salut_ana_sunt:
    title: Читаем сообщение о чувствах
    gloss: Привет, Ана, я немного волнуюсь из-за своей первой самостоятельной смены. Но я и счастлив, потому что у меня новая работа и новая квартира. Думаю, всё получится.
    note: Обрати внимание, из-за чего автор нервничает, что его радует и как он смотрит на будущее.
    glosses:
      puțin: немного
      emoționat: нервный, взволнованный
      prima: первый
      tură: смена
      singur: один, самостоятельно
      fericit: довольный
      fiindcă: потому что
      nou: новый
      serviciu: работа
      apartament: квартира
      cred: думать
      rezolvă: 'получится, сложится (здесь: всё будет хорошо)'
  ro.a1.unit27.lesson06.teach.ana_salut_mihai:
    title: Ана спрашивает, как себя чувствует Михай
    gloss: 'Ана: Привет, Михай, как ты себя чувствуешь перед своей первой сменой?'
    note: В *Cum te simți* используется возвратное *te* («себя»); в *prima ta tură* притяжательное *ta* согласуется с существительным женского рода *tură*.
  ro.a1.unit27.lesson06.teach.mihai_sunt_putin:
    title: Михай признаётся, что волнуется
    gloss: 'Михай: Я немного волнуюсь, если честно.'
    note: '*Sincer să fiu* (если честно) смягчает признание.'
  ro.a1.unit27.lesson06.teach.ana_nu_ti:
    title: Ана его успокаивает
    gloss: 'Ана: Не волнуйся, ты хорошо справишься!'
    note: '*O să te descurci bine* (буквально «ты хорошо справишься») — ободряющее устойчивое выражение; *o să* + глагол образует будущее время.'
  ro.a1.unit27.lesson06.teach.mihai_multumesc_chiar:
    title: Mihai благодарит её
    gloss: 'Mihai: Спасибо, это правда помогает.'
    note: '*Ajută* — форма он/она от *a ajuta* («помогать»); здесь значит «помогает».'
  ro.a1.unit27.lesson06.teach.ana_si_dupa:
    title: Ana предсказывает, чем всё кончится
    gloss: 'Ana: А потом ты наверняка будешь очень счастлив и горд.'
    note: '*Sigur* («наверняка») выражает уверенный прогноз; *mândru* («гордый») — новое полезное прилагательное (*mândră* — о женщине).'
  ro.a1.unit27.lesson06.teach.mihai_da_si:
    title: Mihai соглашается
    gloss: 'Mihai: Да, я тоже так думаю.'
    note: '*Și eu cred asta* (букв. «я тоже это думаю») — естественный способ согласиться с чьим-то мнением.'
  ro.a1.unit27.lesson06.teach.mihai_este_emotionat:
    title: 'Подводим итог: este, lui и îl'
    gloss: Mihai волнуется перед своей первой сменой. Ana ему помогает.
    note: '*Este* — форма он/она от *a fi* («быть»); *lui* после существительного значит «его»; *îl* значит «его/ему» и стоит перед глаголом: *îl ajută*. Три маленьких, но важных слова, чтобы говорить о другом человеке.'
