  ro.a1.unit13.lesson01.imi_place:
    title: Мне нравится
  ro.a1.unit13.lesson02.va_place_prefer:
    title: Вам нравится? Я предпочитаю...
  ro.a1.unit13.lesson03.cafea_sau_ceaiul:
    title: Кофе или чай?
teaching:
  ro.a1.unit13.lesson01.teach.reminder_cafea_ceai_paine:
    title: 'Повторение: cafea, ceai, pâine'
    gloss: cafea (кофе) · ceai (чай) · pâine (хлеб)
    note: 'Все эти слова уже встречались в Уроке 6 — здесь они сочетаются с новой грамматикой этого урока: нравится и не нравится.'
  ro.a1.unit13.lesson01.teach.imi_place_vocab:
    title: Мне нравится
    gloss: Îmi place (мне нравится)
    note: 'Буквально «мне нравится»: *îmi* (мне) и неизменяемое *place* (нравится). Когда речь о том, что нравится вообще, в румынском берётся определённая форма существительного (*cafeaua*, а не просто *cafea*, уже известное из Урока 6). По-русски артикля нет, и мы говорим просто «мне нравится кофе».'
    example_gloss:
    - Мне нравится кофе.
  ro.a1.unit13.lesson01.teach.imi_place_cafeaua_phrase:
    title: Мне нравится кофе
    gloss: Îmi place cafeaua. (Мне нравится кофе.)
    note: 'Полная модель: Îmi place + существительное в определённой форме.'
  ro.a1.unit13.lesson01.teach.imi_place_ceaiul_phrase:
    title: Мне нравится чай
    gloss: Îmi place ceaiul. (Мне нравится чай.)
    note: 'Та же модель, что и *Îmi place cafeaua*, но с другим напитком: *ceaiul* — определённая форма слова *ceai*, уже known из Урока 6.'
  ro.a1.unit13.lesson01.teach.numi_place_vocab:
    title: Мне не нравится
    gloss: Nu-mi place (мне не нравится)
    note: 'Отрицание к *Îmi place*: в повседневной речи *nu îmi* сокращается до *nu-mi*, поэтому эта короткая форма через дефис — естественный способ сказать это, а не просто сокращение.'
    example_gloss:
    - Мне не нравится хлеб.
  ro.a1.unit13.lesson01.teach.numi_place_painea_phrase:
    title: Мне не нравится хлеб
    gloss: Nu-mi place pâinea. (Мне не нравится хлеб.)
    note: '*Pâinea* — определённая форма слова *pâine* из Урока 6, по той же модели, что *cafeaua* и *ceaiul*.'
  ro.a1.unit13.lesson02.teach.reminder_imi_place_numi_place:
    title: 'Повторение: Îmi place, Nu-mi place'
    gloss: Îmi place (мне нравится) · Nu-mi place (мне не нравится)
    note: Обе фразы из первого занятия этого урока — теперь к ним добавляется вопросительная форма.
  ro.a1.unit13.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Повторение: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (кофе) · ceaiul (чай) · pâinea (хлеб)
    note: Все слова из первого занятия этого урока — здесь они используются в вопросах и в фразах о предпочтениях.
  ro.a1.unit13.lesson02.teach.va_place_vocab:
    title: Вам нравится...?
    gloss: Vă place...? (Вам нравится...?)
    note: 'Вежливая вопросительная форма к *Îmi place*: *vă* («вам», вежливое) заменяет *îmi* («мне»); это тот же вежливый регистр *dumneavoastră*, что и в *aveți* и *faceți*. После неё ставится существительное в определённой форме, а когда тема уже ясна, можно сказать и одну эту фразу.'
    example_gloss:
    - Вам нравится кофе?
  ro.a1.unit13.lesson02.teach.va_place_cafeaua_phrase:
    title: Вам нравится кофе?
    gloss: Vă place cafeaua? (Вам нравится кофе?)
    note: 'Полная модель: Vă place + существительное в определённой форме, с вопросительной интонацией с повышением голоса.'
  ro.a1.unit13.lesson02.teach.prefer_vocab:
    title: Я предпочитаю
    gloss: Prefer (я предпочитаю)
    note: 'Это прозрачное слово, похожее на русское «предпочитать»: конструкция с «мне» не нужна. *prefer* — обычный глагол, как русское «предпочитаю»: *Prefer* + то, чему отдаётся предпочтение, в определённой форме, как и после *Îmi place*.'
    example_gloss:
    - Я предпочитаю кофе.
  ro.a1.unit13.lesson02.teach.prefer_cafeaua_phrase:
    title: Я предпочитаю кофе
    gloss: Prefer cafeaua. (Я предпочитаю кофе.)
    note: Это звучит сильнее, чем *Îmi place cafeaua*, и пригодится, когда выбираешь из двух вещей.
  ro.a1.unit13.lesson02.teach.sau_vocab:
    title: или
    gloss: Sau (или)
    note: Соединяет два варианта, когда предлагаешь выбор или спрашиваешь о нём. Не путай с *și* («и») из Уроков 10 и 12, которое соединяет две вещи, верные одновременно.
    example_gloss:
    - Кофе или чай?
  ro.a1.unit13.lesson02.teach.cafea_sau_ceai_phrase:
    title: Кофе или чай?
    gloss: Cafea sau ceai? (Кофе или чай?)
    note: Короткий и естественный способ предложить выбор. Здесь используются простые формы без артикля (*cafea*, *ceai*), а не определённые *cafeaua* и *ceaiul*, потому что это открытое предложение, а не утверждение о кофе или чае вообще.
  ro.a1.unit13.lesson03.teach.reminder_va_place_prefer_sau:
    title: 'Повторение: Vă place, Prefer, Sau'
    gloss: Vă place? (Вам нравится?) · Prefer (я предпочитаю) · Sau (или)
    note: Все из второго занятия этого урока — здесь Ана и Михай используют их вместе.
  ro.a1.unit13.lesson03.teach.reminder_imi_place_numi_place_cafeaua_ceaiul_painea:
    title: 'Повторение: Îmi place, Nu-mi place, cafeaua, ceaiul, pâinea'
    gloss: Îmi place (мне нравится) · Nu-mi place (мне не нравится) · cafeaua (кофе) · ceaiul (чай) · pâinea (хлеб)
    note: Всё из первого занятия этого урока — здесь Ана и Михай говорят, что им нравится, а что нет.
  ro.a1.unit13.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Повторение: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (привет) · mulțumesc (спасибо) · la revedere (до свидания) · Ana, Mihai (имена)
    note: Всё это уже встречалось в прошлых уроках — это дружелюбное начало и конец, которые есть в каждом диалоге курса.
  ro.a1.unit13.lesson03.teach.line01:
    title: Приветствие и вопрос о кофе или чае
    gloss: 'Михай здоровается с Аной и спрашивает, что ей нравится: кофе или чай.'
    note: Здесь *Vă place...?* из этого урока сочетается с *sau*, чтобы предложить оба варианта в одном вопросе.
  ro.a1.unit13.lesson03.teach.line02:
    title: Предпочтение и нелюбовь
    gloss: Ана говорит, что предпочитает кофе, а чай ей не нравится.
    note: Здесь *Prefer* сочетается с *Nu-mi place*; её предпочтение кофе совпадает с тем, что она выбирала в Уроках 6 и 12.
  ro.a1.unit13.lesson03.teach.line03:
    title: Назвать противоположное предпочтение
    gloss: Михай говорит, что ему нравится чай, а кофе не нравится.
    note: Совпадает с выбором Михая в Уроках 6 и 12 (всегда ceai, никогда cafea).
  ro.a1.unit13.lesson03.teach.line04:
    title: Вопрос и о хлебе
    gloss: Ана спрашивает Михая, нравится ли ему ещё и хлеб.
    note: Начинается с короткого уточнения *Și pâinea?* («А хлеб?»), затем полный вопрос с *Vă place...?* о новой теме — *pâinea*.
  ro.a1.unit13.lesson03.teach.line05:
    title: Подтверждение, благодарность и прощание
    gloss: Михай отвечает «да», ему нравится хлеб, благодарит Ану и прощается.
    note: Совпадает с выбором Михая в Уроке 6 (pâine) — и это тот же завершающий оборот, которым заканчивался диалог в каждом прошлом уроке.
  ro.a1.unit13.lesson03.teach.line06:
    title: Завершение разговора
    gloss: Ана тоже прощается и называет Mihai по имени.
    note: Тот же дружелюбный финал, которым заканчивался диалог в каждом предыдущем уроке.
