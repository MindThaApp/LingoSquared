answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: '"Vreau" (I want, plain) and "Aș dori" (I would like, polite, established in unit06) are a genuine directness contrast, not interchangeable synonyms -- accept either for a general "I want/I would like" unless an exercise explicitly names one. "Vă rog" (formal) and "te rog" (informal, both established in unit06) remain a register-sensitive pair here too. Ana and Mihai''s market dialogue keeps their existing polite register with each other (vă rog, not te rog).'
course:
  title: Румынский язык A1
  description: 'Как спросить цену и количество по-румынски: денежная единица leu/lei, scump/ieftin и покупки на рынке — roșii («помидоры») и cartofi («картофель») на килограммы. Ана и Михай продолжают ходить за покупками на рынок.'
units:
  ro.a1.unit07.shopping:
    title: Покупки
lessons:
  ro.a1.unit07.lesson01.cat_costa:
    title: Сколько это стоит?
  ro.a1.unit07.lesson02.rosii_si_cartofi:
    title: Помидоры и картофель
  ro.a1.unit07.lesson03.la_piata:
    title: На рынке
teaching:
  ro.a1.unit07.lesson01.teach.reminder_un_numere:
    title: 'Напоминание: un, doi, cinci, zece, douăzeci'
    gloss: un (один, какой-то) · doi (два) · cinci (пять) · zece (десять) · douăzeci (двадцать)
    note: Все эти слова уже встречались раньше (*un* — в уроке 4, числа — в уроке 2); здесь они возвращаются, чтобы говорить о ценах.
  ro.a1.unit07.lesson01.teach.cat_costa:
    title: Сколько это стоит?
    gloss: Cât costă? (Сколько это стоит?)
    note: 'Обычный способ спросить цену по-румынски: назови после этого товар или скажи просто так, если и без того ясно, о чём речь.'
  ro.a1.unit07.lesson01.teach.leu:
    title: Leu (валюта)
    gloss: 'лей (румынская денежная единица; мн. ч.: lei)'
    note: Валюта Румынии. Leu — единственное число (один лей); форма множественного числа lei неправильная, это не leu с обычным окончанием.
    example_gloss: Это стоит один лей.
  ro.a1.unit07.lesson01.teach.costa_cinci_lei:
    title: Стоит восемь леев
    gloss: Costă opt lei. (Это стоит восемь леев.)
    note: С числами от 2 до 19 слово lei стоит без дополнительных слов.
  ro.a1.unit07.lesson01.teach.costa_douazeci_de_lei:
    title: Стоит тридцать леев
    gloss: Costă treizeci de lei. (Это стоит тридцать леев.)
    note: Начиная с 20, перед считаемым существительным в румынском ставится *de* — то же правило, что в уроке 2 для *ani* («годы, лет»), теперь для *lei*.
  ro.a1.unit07.lesson01.teach.leu_lei_de_rule:
    title: 'Правило: leu → lei и когда нужен de'
    gloss: 'leu → lei · числа 2–19: без *de* · числа от 20: с *de*'
    note: 'Точно такая же схема, как с *ani* в уроке 2 (câți ani ai / am treizeci de ani): раз ты знаешь её для одного слова, она так же работает и для lei.'
  ro.a1.unit07.lesson01.teach.scump:
    title: Дорогой
    gloss: scump (дорогой)
    note: Обычная реакция на цену, которая кажется слишком высокой.
    example_gloss: Восемь леев? Дорого!
  ro.a1.unit07.lesson01.teach.ieftin:
    title: Дешёвый
    gloss: ieftin (дешёвый)
    note: Противоположность слова scump — хорошая цена.
    example_gloss: Один лей? Дёшево!
  ro.a1.unit07.lesson02.teach.reminder_un_o_si_as_dori_rog:
    title: 'Напоминание: un, o, și, aș dori, vă rog, te rog'
    gloss: un/o (артикль при «один, какой-то») · și (и) · aș dori (я бы хотел(а)) · vă rog (пожалуйста, вежливо) · te rog (пожалуйста, на «ты»)
    note: '*Aș dori*, *vă rog* и *te rog* впервые появились в сцене в кафе в уроке 6; здесь они возвращаются на рынке.'
  ro.a1.unit07.lesson02.teach.piata:
    title: Рынок
    gloss: piață (рынок)
    note: Существительное женского рода — открытый или крытый рынок, где покупают свежие продукты.
    example_gloss: Сколько это стоит на рынке?
  ro.a1.unit07.lesson02.teach.rosii:
    title: Помидоры
    gloss: roșii (помидоры)
    note: Множественное число от roșie («помидор»); так говорят, когда вообще хотят купить помидоры.
    example_gloss: Я хотел бы помидоры.
  ro.a1.unit07.lesson02.teach.cartofi:
    title: Картофель
    gloss: cartofi (картофель)
    note: Множественное число от cartof («картофелина»), образуется так же, как roșii.
    example_gloss: Я бы хотел картофель.
  ro.a1.unit07.lesson02.teach.kilogram:
    title: Kilogram
    gloss: kilogram (килограмм)
    note: 'Стандартная единица при покупке продуктов на вес. *De* связывает её с тем, что покупают: kilogram *de* roșii — «килограмм помидоров».'
    example_gloss: Килограмм помидоров.
  ro.a1.unit07.lesson02.teach.vreau:
    title: Я хочу
    gloss: vreau (я хочу)
    note: 'Проще и прямее, чем *aș dori* («я бы хотел(а)»): на рынке подходят оба варианта, vreau просто менее официально.'
    example_gloss: Я хочу картофель.
  ro.a1.unit07.lesson02.teach.unde_pot_sa_cumpar:
    title: Где можно купить ...?
    gloss: Unde pot să cumpăr roșii? (Где можно купить помидоры?)
    note: Полезный вопрос, когда ты ещё не знаешь, где делать покупки; вместо roșii подставь любой другой нужный товар.
  ro.a1.unit07.lesson02.teach.cat_costa_kilogram_rosii:
    title: Сколько стоит килограмм помидоров?
    gloss: Cât costă un kilogram de roșii? (Сколько стоит килограмм помидоров?)
    note: Соединяет Cât costă и конструкцию kilogram de ... в одном полном вопросе.
  ro.a1.unit07.lesson02.teach.vreau_kilogram_cartofi:
    title: Я хочу килограмм картофеля
    gloss: Vreau un kilogram de cartofi. (Я хочу килограмм картофеля.)
    note: Та же конструкция kilogram de ..., но теперь в утверждении с vreau, а не в вопросе.
  ro.a1.unit07.lesson03.teach.reminder_buna_multumesc_la_revedere:
    title: 'Напоминание: bună, ziua, mulțumesc, bine, la revedere, Ana, Mihai'
    gloss: bună ziua (добрый день / здравствуйте) · mulțumesc (спасибо) · bine (хорошо) · la revedere (до свидания) · Ana, Mihai (имена)
    note: Всё это уже встречалось в диалогах уроков 1 и 6; здесь Ана и Михай снова встречаются, на этот раз на рынке.
  ro.a1.unit07.lesson03.teach.line01:
    title: Поздороваться и спросить цену
    gloss: Ана здоровается с Михаем и спрашивает цену килограмма помидоров.
    note: Соединяет Cât costă из этого урока с приветствием из урока 1.
  ro.a1.unit07.lesson03.teach.line02:
    title: Назвать цену
    gloss: Михай говорит, что это стоит восемь леев, и замечает, что это дёшево.
    note: Снова использует costă, opt lei и ieftin из этого урока.
  ro.a1.unit07.lesson03.teach.line03:
    title: Вежливо заказать и добавить товар
    gloss: Ана соглашается, вежливо просит килограмм помидоров и добавляет, что ещё хочет картофель.
    note: В одной реплике сочетаются aș dori, vă rog и vreau — оба регистра из лексики этого урока.
  ro.a1.unit07.lesson03.teach.line04:
    title: Назови вторую цену
    gloss: Михай говорит, что килограмм картофеля стоит пять лей.
    note: Снова используется zece (десять) из урока 2, которое уже повторялось в lesson01 этого раздела.
  ro.a1.unit07.lesson03.teach.line05:
    title: Поблагодари и попрощайся
    gloss: Ана благодарит Михая и прощается.
    note: '*Mulțumesc* здесь — простая благодарность в конце разговора, то же слово, что и в *Bine, mulțumesc.* из раздела 1.'
  ro.a1.unit07.lesson03.teach.line06:
    title: Заверши разговор
    gloss: Михай тоже прощается и называет Ану по имени.
    note: Та же дружелюбная концовка, которой заканчивались диалоги разделов 1, 5 и 6.
