  notes: 'Derived from en-ro by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Russian string was translated and adapted. Needs native Russian review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's new grammar is entirely 1st-person (am fost/am mâncat/ am băut, invariant for singular and plural) plus one fixed 3rd- person formulaic pair (Cum a fost...?/A fost bine!) taught only as an unanalyzed set phrase. No new second-person forms are introduced. Ana and Mihai's dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08/unit09/ unit10/unit11.
course:
  title: Румынский язык A1
  description: 'Рассказ о недавнем завершённом событии по-румынски: am fost (я был(а) / я ходил(а)), am mâncat (я поел(а)), am băut (я выпил(а)) и обмен репликами Cum a fost...? / A fost bine! — «Как это было?» / «Хорошо!». Продолжаем историю Аны и Михая, которые вспоминают воскресенье в парке.'
units:
  ro.a1.unit12.past_events:
    title: Вчера
lessons:
  ro.a1.unit12.lesson01.am_fost_la_parc:
    title: Я ходил(а) в парк
  ro.a1.unit12.lesson02.am_mancat_am_baut:
    title: Я поел(а) и выпил(а)
  ro.a1.unit12.lesson03.cum_a_fost_duminica:
    title: Как прошло воскресенье?
teaching:
  ro.a1.unit12.lesson01.teach.reminder_parc_cinema:
    title: 'Напоминание: parc, cinema'
    gloss: parc (парк) · cinema (кинотеатр, кино)
    note: Оба слова уже встречались в Уроке 11 — теперь они сочетаются с новой грамматикой прошедшего времени из этого урока.
  ro.a1.unit12.lesson01.teach.reminder_astazi_maine_duminica_sambata:
    title: 'Напоминание: astăzi, mâine, duminică, sâmbătă'
    gloss: astăzi (сегодня) · mâine (завтра) · duminică (воскресенье) · sâmbătă (суббота)
    note: Все эти слова уже были в Уроках 3 и 11 — теперь они подготавливают контраст с новым словом *ieri* (вчера).
  ro.a1.unit12.lesson01.teach.am_fost_vocab:
    title: Я был(а) / я ходил(а)
    gloss: Am fost (я был(а) / я ходил(а))
    note: Perfect compus (прошедшее время) глагола *a fi* (быть). *Am* — вспомогательное слово, одинаковое для «я» и «мы», а *fost* — неизменяемая форма прошедшего времени. С названием места *am fost la...* — обычный, естественный способ сказать «я ходил(а) в...»; в речи он встречается чаще, чем глагол движения.
    example_gloss:
    - Я ходил(а) в парк.
  ro.a1.unit12.lesson01.teach.am_fost_parc_phrase:
    title: Я ходил(а) в парк
    gloss: Am fost la parc. (Я ходил(а) в парк.)
    note: 'Полная модель: am fost + la + место.'
  ro.a1.unit12.lesson01.teach.am_fost_cinema_phrase:
    title: Я ходил(а) в кино
    gloss: Am fost la cinema. (Я ходил(а) в кино.)
    note: Та же модель, что и *Am fost la parc*, но с другим местом.
  ro.a1.unit12.lesson01.teach.ieri_vocab:
    title: Вчера
    gloss: Ieri (вчера)
    note: Это слово уже встречалось в Уроке 3 рядом с *astăzi* (сегодня) и *mâine* (завтра). Теперь оно используется с прошедшим временем и ставится в начало предложения, чтобы указать, когда это произошло.
    example_gloss:
    - Вчера я ходил(а) в парк.
  ro.a1.unit12.lesson01.teach.ieri_am_fost_parc_phrase:
    title: Вчера я ходил(а) в парк
    gloss: Ieri am fost la parc. (Вчера я ходил(а) в парк.)
    note: Если поставить *ieri* перед *Am fost la parc*, станет точно ясно, когда это было.
  ro.a1.unit12.lesson02.teach.reminder_mananc_beau:
    title: 'Напоминание: mănânc, beau'
    gloss: mănânc (я ем) · beau (я пью)
    note: Оба глагола уже были в Уроке 10 в рассказе о распорядке дня — теперь мы образуем от них формы прошедшего времени.
  ro.a1.unit12.lesson02.teach.reminder_paine_cafea_ceai_si:
    title: 'Напоминание: pâine, cafea, ceai, și'
    gloss: pâine (хлеб) · cafea (кофе) · ceai (чай) · și (и)
    note: Все эти слова уже были в Уроках 6 и 10 — здесь они используются в предложениях в прошедшем времени.
  ro.a1.unit12.lesson02.teach.am_mancat_vocab:
    title: Я поел(а)
    gloss: Am mâncat (я поел(а), я ел(а))
    note: Perfect compus глагола *a mânca* (есть), который мы уже видели в форме *mănânc* (я ем, Урок 10) — тот же глагол в прошедшем времени. Am + mâncat — та же модель, что и *am fost*.
    example_gloss:
    - Я ел(а) хлеб.
  ro.a1.unit12.lesson02.teach.am_mancat_paine_phrase:
    title: Я ел(а) хлеб
    gloss: Am mâncat pâine. (Я ел(а) хлеб.)
    note: 'Полная модель: am mâncat + еда.'
  ro.a1.unit12.lesson02.teach.am_baut_vocab:
    title: Я выпил(а)
    gloss: Am băut (я выпил(а), я пил(а))
    note: Perfect compus глагола *a bea* (пить), который мы уже видели в форме *beau* (я пью, Урок 10) — тот же глагол в прошедшем времени.
    example_gloss:
    - Я пил(а) чай.
  ro.a1.unit12.lesson02.teach.am_baut_ceai_phrase:
    title: Я пил(а) чай
    gloss: Am băut ceai. (Я пил(а) чай.)
    note: 'Полная модель: am băut + напиток.'
  ro.a1.unit12.lesson02.teach.am_mancat_am_baut_phrase:
    title: Я ел(а) хлеб и пил(а) чай
    gloss: Am mâncat pâine și am băut ceai. (Я ел(а) хлеб и пил(а) чай.)
    note: Два действия в прошедшем времени, соединённые словом *și* — тем же союзом, который в Уроке 10 соединял действия в настоящем времени.
  ro.a1.unit12.lesson03.teach.reminder_am_fost_ieri_parc_cinema:
    title: 'Напоминание: am fost, ieri, parc, cinema'
    gloss: am fost (я был(а) / я ходил(а)) · ieri (вчера) · parc (парк) · cinema (кинотеатр, кино)
    note: Все эти слова — из первого занятия этого урока; теперь они готовят рассказ о воскресенье.
  ro.a1.unit12.lesson03.teach.reminder_am_mancat_am_baut:
    title: 'Напоминание: am mâncat, am băut, pâine, cafea, ceai'
    gloss: am mâncat (я поел(а)) · am băut (я выпил(а)) · pâine (хлеб) · cafea (кофе) · ceai (чай)
    note: Все эти слова — из второго занятия этого урока; здесь Ана и Михай рассказывают, что они ели и пили.
  ro.a1.unit12.lesson03.teach.reminder_cum_duminica_bine:
    title: 'Напоминание: cum, duminică, bine, mulțumesc, la revedere, Ana, Mihai'
    gloss: cum (как, Уроки 1 и 9) · duminică (воскресенье, Урок 3) · bine (хорошо, Урок 1) · mulțumesc (спасибо) · la revedere (до свидания) · Ana, Mihai (имена)
    note: 'Все эти слова уже были в предыдущих уроках. Слово *cum* впервые встретилось в вопросе об имени (Урок 1) и в вопросе о дороге (Урок 9), а здесь оно открывает вопрос другого рода: как что-то прошло.'
  ro.a1.unit12.lesson03.teach.a_fost_vocab:
    title: Это было
    gloss: A fost (это было; он/она был(а))
    note: 'Другое лицо того же глагола, что и в *am fost*: *a* — вспомогательное слово для «он/она/оно», а не для «я/мы». Пока выучи *Cum a fost...?* и *A fost bine!* как готовые выражения, а не как модель для свободного построения фраз.'
    example_gloss:
    - Было хорошо!
  ro.a1.unit12.lesson03.teach.a_fost_bine_phrase:
    title: Было хорошо!
    gloss: A fost bine! (Было хорошо!)
    note: Короткий и естественный способ сказать, что всё прошло хорошо, — ответ на вопрос *Cum a fost...?*
  ro.a1.unit12.lesson03.teach.cum_a_fost_duminica_phrase:
    title: Как прошло воскресенье?
    gloss: Cum a fost duminică? (Как прошло воскресенье?)
    note: 'Естественный способ начать разговор о недавнем дне, даже если собеседник был там же: так ты предлагаешь ему рассказать, как всё прошло и что запомнилось.'
  ro.a1.unit12.lesson03.teach.line01:
    title: Поздороваться и спросить, как прошло воскресенье
    gloss: Михай здоровается с Аной и спрашивает, как прошло воскресенье.
    note: Соединяет *Cum a fost duminică?* из этого урока с уже знакомым *Bună*.
  ro.a1.unit12.lesson03.teach.line02:
    title: Ответить и сказать, где был(а)
    gloss: Ана говорит, что всё было хорошо и что она ходила в парк.
    note: Соединяет *A fost bine!* с фразой *Am fost la parc* из первого занятия.
  ro.a1.unit12.lesson03.teach.line03:
    title: Сказать, что он ел и пил
    gloss: Михай говорит, что ел хлеб и пил чай.
    note: Повторяет фразу *Am mâncat pâine și am băut ceai* из второго занятия и соответствует выбору Михая из Урока 6 (хлеб и чай).
  ro.a1.unit12.lesson03.teach.line04:
    title: Сказать, что она пила
    gloss: Ана говорит, что пила кофе.
    note: Соответствует выбору Аны из Урока 6 (кофе).
  ro.a1.unit12.lesson03.teach.line05:
    title: Поблагодарить и попрощаться
    gloss: Михай благодарит Ану и прощается.
    note: Та же заключительная модель, которой заканчивался диалог в каждом из прежних уроков.
  ro.a1.unit12.lesson03.teach.line06:
    title: Завершить разговор
    gloss: Ана тоже прощается, называя Михая по имени.
    note: Та же дружелюбная заключительная модель, которой заканчивался диалог в каждом из прежних уроков.
