answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: This unit's new "Ai frați?"/"Aveți frați?" and "Câți copii ai?"/"Câți copii aveți?" pairs are register-sensitive (tu vs. dumneavoastră, parallel to unit02's ai/aveți age questions) -- accept either register unless an exercise explicitly names one. Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: Румынский язык A1
  description: 'Разговор о семье по-румынски: родители, братья и сёстры, дети и семейное положение. Ты узнаешь пару притяжательных слов meu/mea и снова увидишь различие между вопросами на tu и на dumneavoastră, как в вопросах о возрасте из unit02. Ана и Михай продолжают знакомиться и рассказывают о своих семьях.'
units:
  ro.a1.unit05.family:
    title: Семья
lessons:
  ro.a1.unit05.lesson01.familia_mea:
    title: Моя семья
  ro.a1.unit05.lesson02.frati_si_copii:
    title: Братья, сёстры и дети
  ro.a1.unit05.lesson03.o_discutie_despre_familie:
    title: Разговор о семье
teaching:
  ro.a1.unit05.lesson01.teach.reminder_am_un_o_si_mare:
    title: 'Повторение: am, un, o, și, mare'
    gloss: am (у меня есть) · un/o (неопределённый артикль) · și (и) · mare (большой)
    note: Все пять слов уже встречались в прежних уроках (*și* — в Уроке 1, *am* и *o* — в Уроке 2, *mare* — в заметке о заглавной букве в Уроке 3, *un* — в Уроке 4). Теперь они возвращаются в рассказе о семье.
  ro.a1.unit05.lesson01.teach.familie:
    title: Семья
    gloss: семья
    note: Существительное женского рода. С *o* и прилагательным вроде *mare* получается «большая семья».
    example_gloss: У меня большая семья.
  ro.a1.unit05.lesson01.teach.mama:
    title: Мать
    gloss: мама
    note: Обычное словарное слово «мать». Как сказать «моя мама», будет через несколько карточек.
    example_gloss: У Михая есть мама и папа.
  ro.a1.unit05.lesson01.teach.tata:
    title: Отец
    gloss: папа
    note: Обычное словарное слово «отец».
    example_gloss: Мой папа — учитель.
  ro.a1.unit05.lesson01.teach.parintii:
    title: Родители
    gloss: родители
    note: Обозначает обоих родителей вместе, как и русское «родители».
    example_gloss: Мои родители живут в Румынии.
  ro.a1.unit05.lesson01.teach.meu_mea:
    title: 'Мой: meu и mea'
    gloss: мой (м. р.) / моя (ж. р.)
    note: 'Румынское слово «мой» согласуется в роде с тем, что принадлежит, а не с владельцем: *meu* — с существительным мужского рода вроде *tată*, *mea* — с существительным женского рода вроде *mamă*.'
  ro.a1.unit05.lesson01.teach.mama_mea:
    title: Моя мама
    gloss: моя мама
    note: Mamă превращается в mama (добавляется определённый артикль), и только потом ставится mea. Так и говорят «моя мама»; это не пословный перевод.
  ro.a1.unit05.lesson01.teach.tatal_meu:
    title: Мой папа
    gloss: мой папа
    note: Tată превращается в tatăl (определённый артикль -l, необычная форма, хотя слово уже оканчивается на -ă), и только потом ставится meu.
  ro.a1.unit05.lesson01.teach.mama_si_tatal:
    title: Моя мама и мой папа
    gloss: Моя мама и мой папа.
    note: В одном предложении обе формы притяжательного слова, каждая согласована по роду.
  ro.a1.unit05.lesson02.teach.reminder_cati_ai_aveti_doi_nu:
    title: 'Повторение: câți, ai, aveți, doi, nu'
    gloss: câți (сколько) · ai/aveți (у тебя/у вас есть) · doi (два) · nu (нет/не)
    note: '*Câți*, *ai* и *aveți* впервые встретились в Уроке 2 в вопросе о возрасте («Câți ani ai?»). Теперь с ними спрашивают о братьях, сёстрах и детях. *Doi* — из числительных Урока 2, *nu* — из Урока 3.'
  ro.a1.unit05.lesson02.teach.da:
    title: Да
    gloss: да
    note: Обычное слово «да»; пара к *nu* («нет») из Урока 3.
    example_gloss: Да, у меня есть брат.
  ro.a1.unit05.lesson02.teach.frate_sora:
    title: Брат, сестра
    gloss: брат / сестра
    note: Существительные мужского и женского рода. С un/o они сочетаются так же, как любые другие.
    example_gloss:
    - У меня есть брат.
    - У меня есть сестра.
  ro.a1.unit05.lesson02.teach.frati_surori:
    title: Братья, сёстры
    gloss: братья / сёстры
    note: Формы множественного числа, которыми спрашивают о братьях и сёстрах вообще. Румыны часто спрашивают «Ai frați?» («Есть братья?»), имея в виду «есть ли братья или сёстры», и нередко добавляют отдельный вопрос «Surori?» о сёстрах.
    example_gloss: У тебя есть братья или сёстры?
  ro.a1.unit05.lesson02.teach.ai_frati:
    title: Есть ли у тебя братья или сёстры? (на ты)
    gloss: У тебя есть братья?
    note: Обычный разговорный способ спросить; соответствует обращению на *tu* из Урока 1.
  ro.a1.unit05.lesson02.teach.aveti_frati:
    title: Есть ли у вас братья или сёстры? (на вы)
    gloss: У вас есть братья?
    note: Вежливый вариант; то же *aveți*, что и в вопросе о возрасте в Уроке 2.
  ro.a1.unit05.lesson02.teach.copil_copii:
    title: Ребёнок, дети
    gloss: ребёнок / дети
    note: 'Copil — одно из непростых множественных чисел в румынском: copii, а не обычное окончание -i или -e. Эту форму стоит запомнить отдельно.'
    example_gloss: У меня двое детей.
  ro.a1.unit05.lesson02.teach.fiu_fiica:
    title: Сын, дочь
    gloss: сын / дочь
    note: Особые слова для «сына» и «дочери», отличные от общего copil/copii.
    example_gloss:
    - У меня есть сын.
    - У меня есть дочь.
  ro.a1.unit05.lesson02.teach.cati_copii_ai:
    title: Сколько у тебя детей?
    gloss: Сколько у тебя детей?
    note: Câți (сколько) + copii (дети) + ai (у тебя есть) — все три слова уже знакомы.
  ro.a1.unit05.lesson02.teach.casatorit:
    title: Женат / замужем
    gloss: женатый
    note: Частый личный вопрос в повседневном разговоре, как и вопрос о возрасте.
    example_gloss: Ты женат?
  ro.a1.unit05.lesson03.teach.reminder_bine_la_revedere:
    title: 'Повторение: bine, la revedere, Ana, Mihai'
    gloss: bine (хорошо) · la revedere (до свидания) · Ana, Mihai (имена)
    note: Повторение слов из прежних уроков, которые снова встречаются в диалоге этого урока.
  ro.a1.unit05.lesson03.teach.line01:
    title: Спросить о братьях и сёстрах
    gloss: Ана спрашивает Михая, есть ли у него братья или сёстры.
    note: Здесь вежливое *aveți*, как и принято в их общении.
  ro.a1.unit05.lesson03.teach.line02:
    title: Ответ и встречный вопрос
    gloss: Михай говорит, что у него есть брат и сестра, и спрашивает, есть ли дети у Аны.
    note: 'В одной реплике использованы слова этого урока: frate/soră и copii.'
  ro.a1.unit05.lesson03.teach.line03:
    title: Ответ и встречный вопрос
    gloss: Ана говорит, что у неё есть дочь, и задаёт Михаю тот же вопрос.
    note: '*Și dumneavoastră?* («А у вас?») — тот же встречный вопрос, что и в знакомствах в Уроке 1.'
  ro.a1.unit05.lesson03.teach.line04:
    title: Ответ
    gloss: Михай говорит, что у него есть сын.
    note: Короткий прямой ответ со словом fiu из этого урока.
  ro.a1.unit05.lesson03.teach.line05:
    title: Реакция и прощание
    gloss: Ана доброжелательно реагирует и прощается.
    note: '*Bine!* здесь — короткая положительная реакция; то же слово было в *Bine, mulțumesc.* в Уроке 1.'
  ro.a1.unit05.lesson03.teach.line06:
    title: Завершение встречи
    gloss: Михай тоже прощается и называет Ану по имени.
    note: Такое же дружелюбное прощание было в конце диалогов Урока 1 и Урока 4.
