    gloss: '*Aș vrea* + цвет говорит, какой цвет ты выбираешь: Мне бы хотелось розовый.'
    note: '*Aș vrea* («я бы хотел», «я бы хотела») — вежливый способ сказать, чего ты хочешь; он мягче, чем *Vreau*. Слово цвета после него никак не оформляется, а *roz* и *mov* вообще не меняют окончание, в отличие от *roșu*, которое с существительным женского рода становится *roșie* (*o lalea roșie*).'
