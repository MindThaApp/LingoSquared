  ro.a1.unit43.lesson05.teach.nina_si_ana:
    title: Нина и Ана покупают тюльпаны
    gloss: Нина и Ана идут в субботу на цветочный рынок. Какой цвет хочет Ана? Ана хотела бы красный. Какой цвет хочет Нина? Нина хотела бы жёлтый. Они покупают пять тюльпанов. Всё вместе стоит двадцать пять лей. Тюльпаны очень красивые!
    note: Краткое повторение субботней поездки на цветочный рынок.
