teaching:
  ro.a1.unit20.lesson01.teach.reminder_vreau_un_ce:
    title: 'Повторение: Vreau, Un, Ce'
    gloss: Vreau (я хочу) · Un (один; неопределённый артикль м./ср. р.) · Ce (что)
    note: '*Vreau* («я хочу»), *un* (неопределённый артикль) и *ce* («что», как в *Ce mai faceți?*) — слова, которые ты уже знаешь; здесь они помогают попросить предмет одежды.'
  ro.a1.unit20.lesson01.teach.tricou_vocab:
    title: Футболка
    gloss: Tricou (футболка)
    note: 'Существительное среднего рода: употребляется с тем же *un* (а не *o*), что и другие существительные мужского и среднего рода, например *un leu*.'
    example_gloss:
    - Я хочу футболку.
  ro.a1.unit20.lesson01.teach.culoare_vocab:
    title: Цвет
    gloss: Culoare (цвет)
    note: Существительное женского рода; нужно, чтобы спросить, какого цвета бывает вещь.
    example_gloss:
    - Какого цвета?
  ro.a1.unit20.lesson01.teach.rosu_vocab:
    title: Красный
    gloss: Roșu (красный)
    note: 'Стоит после существительного, как обычно в румынском: *tricou roșu*, буквально «футболка красная».'
    example_gloss:
    - Я хочу красную футболку.
  ro.a1.unit20.lesson01.teach.albastru_vocab:
    title: Синий
    gloss: Albastru (синий)
    note: 'Та же схема, что у *roșu*: слово стоит после существительного — *tricou albastru*.'
    example_gloss:
    - Я хочу синюю футболку.
  ro.a1.unit20.lesson01.teach.vreau_tricou_rosu_phrase:
    title: Я хочу красную футболку.
    gloss: Vreau un tricou roșu.
    note: 'Основная просьба: *vreau* («я хочу») + *un tricou* («футболка») + *roșu* («красный»), причём цвет стоит после существительного.'
  ro.a1.unit20.lesson02.teach.reminder_cat_costa_va_rog:
    title: 'Повторение: Cât, Costă, Vă, Rog'
    gloss: Cât costă? (Сколько стоит?) · Vă rog (пожалуйста, вежливая форма)
    note: '*Cât costă?* — из урока о рынке; *vă rog* — вежливое «пожалуйста». Здесь они помогают спросить цену одежды и смягчить просьбу.'
  ro.a1.unit20.lesson02.teach.reminder_mic_mica_mare:
    title: 'Повторение: Mic, Mică, Mare'
    gloss: Mic/Mică (маленький, м.-ср. р./ж. р.) · Mare (большой, одна форма для м. и ж. р. в ед. числе)
    note: Слова о размере, которые ты уже знаешь по сравнению еды и напитков; здесь они используются для размеров одежды.
  ro.a1.unit20.lesson02.teach.pantaloni_vocab:
    title: Брюки
    gloss: Pantaloni (брюки)
    note: 'В румынском обычно употребляется во множественном числе, как и в русском «брюки»: *pantaloni* — это одни брюки.'
    example_gloss:
    - Я хочу брюки.
  ro.a1.unit20.lesson02.teach.marime_vocab:
    title: Размер
    gloss: размер
    note: 'Существительное женского рода: сочетается с формой женского рода *mică* (маленький), которую ты уже повторял(а), и с неизменяемым *mare* (большой).'
    example_gloss:
    - Какой размер?
  ro.a1.unit20.lesson02.teach.ce_marime_phrase:
    title: Какой размер?
    gloss: Какой размер?
    note: 'Обычный вопрос у прилавка: короткий, без глагола, как и *Ce culoare?* (Какой цвет?).'
  ro.a1.unit20.lesson02.teach.marime_mica_va_rog_phrase:
    title: Маленький размер, пожалуйста.
    gloss: Маленький размер, пожалуйста.
    note: '*Mică* — форма женского рода от *mic*, она согласуется с существительным женского рода *mărime*. С уже знакомым *vă rog* получается вежливо назвать свой размер.'
  ro.a1.unit20.lesson02.teach.cat_costa_pantalonii_phrase:
    title: Сколько стоят брюки?
    gloss: Сколько стоят брюки?
    note: '*Pantalonii* — форма *pantaloni* с определённым артиклем («те самые брюки»): у существительных мужского рода во множественном числе артикль — окончание *-i* (*pantaloni* → *pantalonii*). Здесь же знакомое *cât costă*.'
  ro.a1.unit20.lesson03.teach.reminder_buna_multumesc_bine_la_revedere_si:
    title: 'Повторение: Bună, Mulțumesc, Bine, La revedere, Și'
    gloss: привет · спасибо · хорошо · до свидания · и
    note: 'Повседневные приветствия и слово *și* (и): они снова пригодятся, чтобы начать и закончить разговор в магазине.'
  ro.a1.unit20.lesson03.teach.reminder_zece_douazeci_de_lei:
    title: 'Повторение: Zece, Douăzeci, De, Lei'
    gloss: десять · двадцать · de (ставится перед lei, начиная с 20) · лей (мн. ч. от leu, румынская валюта)
    note: 'Числа и валюта *leu/lei* тебе уже знакомы: здесь они нужны для цен на футболку и брюки.'
  ro.a1.unit20.lesson03.teach.line01:
    title: Поздоровайся с Михаем и попроси красную футболку
    gloss: Ана здоровается с Михаем и говорит, что хочет красную футболку.
    note: 'Фраза-просьба из первого урока: *Vreau un tricou roșu.*'
  ro.a1.unit20.lesson03.teach.line02:
    title: Спроси, какой размер
    gloss: Михай спрашивает, какой размер ей нужен.
    note: 'Обычный вопрос в магазине: *Ce mărime?* (Какой размер?).'
  ro.a1.unit20.lesson03.teach.line03:
    title: Назови размер вежливо и спроси цену
    gloss: Ана просит маленький размер, а затем спрашивает, сколько это стоит.
    note: '*Mărime mică, vă rog* (маленький размер, пожалуйста), затем *Cât costă?* (Сколько стоит?).'
  ro.a1.unit20.lesson03.teach.line04:
    title: Назови цену
    gloss: Михай говорит, что это стоит пятьдесят лей.
    note: Здесь используется уже знакомое *cincizeci de lei*.
  ro.a1.unit20.lesson03.teach.line05:
    title: Согласись и спроси ещё про брюки
    gloss: Ана соглашается, затем говорит, что хочет ещё и брюки, и спрашивает их цену.
    note: '*Și* здесь значит «тоже, ещё»: *Vreau și pantaloni* — «Я хочу ещё и брюки».'
  ro.a1.unit20.lesson03.teach.line06:
    title: Назови цену брюк
    gloss: Михай говорит, что брюки стоят сто двадцать лей.
    note: 'Начиная с двадцати, между числом и существительным в румынском ставится *de*: *o sută douăzeci de lei*.'
  ro.a1.unit20.lesson03.teach.line07:
    title: Поблагодари Михая и попрощайся
    gloss: Ана благодарит его и прощается.
    note: Вежливое «спасибо» и «до свидания».
  ro.a1.unit20.lesson03.teach.line08:
    title: Попрощайся
    gloss: Михай прощается.
    note: Простое прощание с обращением по имени к Ане.
