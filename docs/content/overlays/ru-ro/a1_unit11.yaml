answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's new words are all register-neutral -- mergem (first-person plural) and nu pot (first-person singular) don't change with tu/dumneavoastră, and atunci/sigur are invariant connective/response words with no person marking. No new second-person forms are introduced. Ana and Mihai's closing dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08/unit09/unit10.
course:
  title: Румынский язык A1
  description: 'Как предложить план, согласиться, отказаться и договориться о простой встрече по-румынски: mergem (идём), nu pot (я не могу), atunci (тогда, в таком случае) и sigur (конечно). Ана и Михай продолжают договариваться о встрече в парке.'
units:
  ro.a1.unit11.plans:
    title: Планы
lessons:
  ro.a1.unit11.lesson01.mergem_la_cinema:
    title: Пойдём в кино?
  ro.a1.unit11.lesson02.nu_pot_atunci:
    title: Я не могу. Тогда?
  ro.a1.unit11.lesson03.planul_de_duminica:
    title: План на воскресенье
teaching:
  ro.a1.unit11.lesson01.teach.reminder_da_bine:
    title: 'Повторение: da, bine, nu, mulțumesc'
    gloss: да · хорошо · нет · спасибо
    note: Все эти слова уже встречались с Урока 6. Здесь они складываются в способ принять предложение, характерный для этого урока, и входят в задание на повторение лексики.
  ro.a1.unit11.lesson01.teach.mergem_vocab:
    title: Идём / мы идём
    gloss: идём, мы идём
    note: Форма 1-го лица множественного числа глагола *a merge*. Раньше ты видел *merg* (я иду, Урок 10) и *mergeți* (вежливая форма приказа, Урок 9) — это тот же глагол в другом лице и числе. С вопросительной интонацией одно слово звучит как естественное предложение пойти куда-то вместе.
    example_gloss:
    - Пойдём в кино?
  ro.a1.unit11.lesson01.teach.cinema_vocab:
    title: Кинотеатр
    gloss: кино, кинотеатр
    note: Слово близко к русскому «кинематограф» и «синема», поэтому его легко узнать.
    example_gloss:
    - Пойдём в кино?
  ro.a1.unit11.lesson01.teach.mergem_cinema_phrase:
    title: Пойдём в кино?
    gloss: Пойдём в кино?
    note: 'Это полноценное приглашение. Слова «хочешь» не нужно: вопросительная интонация превращает «идём» в предложение.'
  ro.a1.unit11.lesson01.teach.parc_vocab:
    title: Парк
    gloss: парк
    note: Ещё одно слово, похожее на русское, как и *cinema*.
    example_gloss:
    - Пойдём в парк?
  ro.a1.unit11.lesson01.teach.mergem_parc_phrase:
    title: Пойдём в парк?
    gloss: Пойдём в парк?
    note: Та же модель приглашения, что и *Mergem la cinema?*, но с другим местом.
  ro.a1.unit11.lesson01.teach.da_bine_phrase:
    title: Да, хорошо!
    gloss: Да, хорошо!
    note: 'Короткий естественный способ принять план: уже знакомые слова в новом сочетании.'
  ro.a1.unit11.lesson02.teach.reminder_nu_pot:
    title: 'Повторение: nu, pot'
    gloss: нет, не · я могу
    note: '*Nu* известно с Урока 6, а pot — из фразы *cum pot să ajung* (как мне добраться) в Уроке 9. Перед глаголом nu означает «не»: *nu pot* — «я не могу». Так в этом уроке отказываются от предложения.'
  ro.a1.unit11.lesson02.teach.reminder_sambata_duminica:
    title: 'Повторение: sâmbătă, duminică'
    gloss: суббота · воскресенье
    note: Оба слова уже встречались среди дней недели в Уроке 3.
  ro.a1.unit11.lesson02.teach.mergem_parc_sambata_phrase:
    title: Пойдём в парк в субботу?
    gloss: Пойдём в парк в субботу?
    note: 'Приглашение из первого урока, теперь с днём недели: *Mergem la parc?* плюс название дня.'
  ro.a1.unit11.lesson02.teach.nu_pot_sambata_phrase:
    title: В субботу не могу
    gloss: В субботу не могу.
    note: 'Простой отказ: *nu pot* и день, на который отказываешься.'
  ro.a1.unit11.lesson02.teach.atunci_vocab:
    title: Тогда / в таком случае
    gloss: тогда, в таком случае
    note: 'Не путай с *apoi* (Урок 9: «потом», когда выстраиваются два действия по порядку). *Atunci* предлагает альтернативу или делает вывод: это естественное слово для «тогда как насчёт...?», когда переносишь встречу.'
    example_gloss:
    - Тогда в воскресенье?
  ro.a1.unit11.lesson02.teach.atunci_duminica_phrase:
    title: Тогда в воскресенье?
    gloss: Тогда в воскресенье?
    note: 'Короткое встречное предложение после отказа: достаточно назвать новый день, повторять всё приглашение не нужно.'
  ro.a1.unit11.lesson02.teach.da_bine_duminica_phrase:
    title: Да, хорошо! В воскресенье.
    gloss: Да, хорошо! В воскресенье.
    note: Согласие на новый день по той же короткой модели, что и *Da, bine!* из первого урока.
  ro.a1.unit11.lesson03.teach.reminder_la_ce_ora_la_ora_patru:
    title: 'Повторение: la ce oră, la ora, patru'
    gloss: в котором часу · в ... часов · четыре
    note: La ce oră и la ora уже встречались в Уроке 4 (спрашиваем и называем время), а patru — среди чисел в Уроке 2. Здесь они помогают назначить время встречи.
  ro.a1.unit11.lesson03.teach.reminder_buna_multumesc_la_revedere_da_ana_mihai:
    title: 'Повторение: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: привет · спасибо · до свидания · да · Ана, Михай (имена)
    note: Всё это уже встречалось в прежних уроках. Здесь Ана и Михай договариваются о времени встречи.
  ro.a1.unit11.lesson03.teach.sigur_vocab:
    title: Конечно
    gloss: конечно
    note: Распространённый самостоятельный ответ, которым подтверждают план, как русское «Конечно!» или «Разумеется!».
    example_gloss:
    - Конечно! В четыре часа.
  ro.a1.unit11.lesson03.teach.sigur_phrase:
    title: Конечно! В четыре часа.
    gloss: Конечно! В четыре часа.
    note: Один короткий ответ подтверждает и план, и точное время.
  ro.a1.unit11.lesson03.teach.line01:
    title: Приветствие и предложение пойти в парк
    gloss: Ана здоровается с Михаем и предлагает пойти в парк в воскресенье.
    note: Здесь соединяются приглашение *Mergem la parc?* из этого урока и слово *duminică*.
  ro.a1.unit11.lesson03.teach.line02:
    title: Согласиться и спросить время
    gloss: Михай соглашается и спрашивает, во сколько.
    note: Снова вопрос *La ce oră?* из Урока 4.
  ro.a1.unit11.lesson03.teach.line03:
    title: Предложить время
    gloss: Ана предлагает четыре часа.
    note: Короткий вопрос по модели *la ora* из Урока 4 с новым числом *patru*.
  ro.a1.unit11.lesson03.teach.line04:
    title: Подтвердить и поблагодарить
    gloss: Михай отвечает «Конечно!» и благодарит Ану.
    note: Здесь соединяются слово *sigur* из этого урока и уже знакомое *mulțumesc*.
  ro.a1.unit11.lesson03.teach.line05:
    title: Попрощаться
    gloss: Ана прощается.
    note: Так заканчивались диалоги всех предыдущих уроков.
  ro.a1.unit11.lesson03.teach.line06:
    title: Завершить встречу
    gloss: Михай прощается в ответ, называя Ану по имени.
    note: Тот же дружеский финал, которым заканчивались диалоги всех предыдущих уроков.
