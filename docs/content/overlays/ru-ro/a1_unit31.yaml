answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Румынский язык A1
  description: 'Румынский для начинающих: описание внешности человека — рост и впечатление о возрасте, цвет волос и глаз, главный вопрос Cum arată ...? и сравнение внешности двух людей.'
units:
  ro.a1.unit31.aspect:
    title: Описываем внешность
lessons:
  ro.a1.unit31.lesson01.inalt_scund_batran_si:
    title: Высокий, низкий, пожилой и молодой
  ro.a1.unit31.lesson02.descrierea_parului:
    title: Описываем волосы
  ro.a1.unit31.lesson03.ochii_si_cum_arata:
    title: Глаза и вопрос «Как выглядит человек?»
  ro.a1.unit31.lesson04.ana_o_descrie_pe:
    title: Ана описывает Нину
  ro.a1.unit31.lesson05.ii_comparam_pe_andrei:
    title: Сравниваем Андрея и Елену
  ro.a1.unit31.lesson06.mihai_o_recunoaste_pe:
    title: Михай узнаёт Нину
teaching:
  ro.a1.unit31.lesson01.teach.inalt_scund:
    title: Высокий и низкий
    gloss: высокий / невысокий
    note: '*Înalt* — высокий человек, *scund* — низкий. У обоих слов есть женская форма: *înaltă*, *scundă*.'
    example_gloss:
    - Елена высокая.
    - Андрей низкого роста.
  ro.a1.unit31.lesson01.teach.batran_tanar:
    title: Пожилой и молодой
    gloss: пожилой / молодой
    note: '*Bătrân* и *tânăr* здесь передают общее впечатление о возрасте, а не точное число лет. Женские формы: *bătrână*, *tânără*.'
    example_gloss:
    - Дедушка пожилой.
    - Михай молодой.
  ro.a1.unit31.lesson01.teach.pentru_varsta_exacta:
    title: 'Bătrân: впечатление или число'
    gloss: О точном возрасте спрашивают Câți ani ai?, а bătrân передаёт общее впечатление, как в Bunicul este bătrân.
    note: 'О точном возрасте можно спросить: *Câți ani ai?* А *bătrân* здесь описывает, насколько человек СТАРО ВЫГЛЯДИТ, без указания числа.'
  ro.a1.unit31.lesson01.teach.elena_este_inalta:
    title: Елена высокая, а Андрей низкого роста
    gloss: Елена высокая, а Андрей низкого роста.
    note: 'Простое сложное предложение с *și* (и): оно готовит почву для прямого сравнения в уроке 5. Прилагательное согласуется с подлежащим: *înaltă* для Елены, *scund* для Андрея.'
  ro.a1.unit31.lesson02.teach.parul:
    title: Волосы
    gloss: волосы
    note: '*Păr* — существительное мужского рода; артикль присоединяется в конце: *părul* (волосы).'
    example_gloss: У Михая короткие чёрные волосы.
  ro.a1.unit31.lesson02.teach.blond_maro_carunt:
    title: Светлый, каштановый и седой
    gloss: светлый / каштановый / седой
    note: 'Три цвета волос. Они стоят после существительного *păr* (мужской род): *părul blond*, *păr maro*, *păr cărunt*.'
    example_gloss:
    - У Аны светлые волосы.
    - У Андрея каштановые волосы.
    - У дедушки седые волосы.
  ro.a1.unit31.lesson02.teach.lung_scurt:
    title: Длинные и короткие (волосы)
    gloss: длинный / короткий (о волосах)
    note: '*Lung* (длинный) и *scurt* (короткий) описывают длину волос; как и цвета, они стоят после существительного.'
    example_gloss:
    - У Елены длинные волосы.
    - У Андрея короткие волосы.
  ro.a1.unit31.lesson02.teach.adjectivul_vine_dupa:
    title: Прилагательное стоит после существительного
    gloss: 'Прилагательное стоит после существительного: păr scurt, păr lung, păr blond, păr maro, păr cărunt, păr negru.'
    note: В румынском прилагательное стоит ПОСЛЕ существительного (*păr scurt*), в отличие от русского «короткие волосы», где оно обычно стоит перед ним.
  ro.a1.unit31.lesson02.teach.posesivul_vine_dupa:
    title: «Его» и «её» стоят после существительного
    gloss: 'Притяжательное слово стоит после существительного: părul ei (её волосы), ochii lui (его глаза).'
    note: '*Ei* значит «её», а *lui* — «его»; оба слова стоят после существительного: *părul ei*. О ком речь, понятно из контекста.'
  ro.a1.unit31.lesson02.teach.mihai_are_parul:
    title: У Михая короткие чёрные волосы
    gloss: У Михая короткие чёрные волосы.
    note: '*Negru* (чёрный) — прилагательное цвета; оно стоит после существительного: *păr negru*.'
  ro.a1.unit31.lesson02.teach.ana_are_parul:
    title: У Аны длинные светлые волосы
    gloss: У Аны длинные светлые волосы.
    note: В одном естественном предложении соединены слова о длине и цвете из этого урока.
  ro.a1.unit31.lesson03.teach.ochii:
    title: Глаза
    gloss: глаза
    note: '*Ochi* (глаз/глаза) в единственном и множественном числе выглядит одинаково; число показывает артикль: *ochiul* (глаз), *ochii* (глаза).'
    example_gloss: У Михая карие глаза.
  ro.a1.unit31.lesson03.teach.albastru_maro_verde:
    title: Голубой, карий и зелёный
    gloss: голубой / карий / зелёный
    note: '*Albastru* (синий, голубой), *maro* (карий, коричневый) и *verde* (зелёный) — прилагательные цвета. *Maro* не изменяется; во множественном числе *albastru* превращается в *albaștri*, а *verde* — в *verzi*.'
    example_gloss:
    - У Аны голубые глаза.
    - У Андрея карие глаза.
    - У Елены зелёные глаза.
  ro.a1.unit31.lesson03.teach.la_plural_adjectivul:
    title: Прилагательные во множественном числе
    gloss: 'Во множественном числе прилагательное изменяется: ochi albaștri, ochi maro, ochi verzi.'
    note: 'С *ochi* во множественном числе прилагательное принимает форму множественного числа (*albaștri*, *verzi*); *maro* не меняется. Сравни единственное число: *păr albastru*.'
  ro.a1.unit31.lesson03.teach.cum_arata_ana:
    title: Как выглядит Ана?
    gloss: Как выглядит Ана?
    note: '*Cum arată ...?* — главный вопрос этого раздела; с его помощью можно спросить о внешности любого человека.'
  ro.a1.unit31.lesson03.teach.ana_are_parul:
    title: У Аны длинные светлые волосы и голубые глаза
    gloss: У Аны длинные светлые волосы и голубые глаза.
    note: 'Образец ответа: волосы и глаза в одном предложении, связанные через *și*.'
  ro.a1.unit31.lesson04.teach.ana_vine_o:
    title: Ана представляет Нину
    gloss: 'Ана: В языковое кафе придёт новая девушка. Её зовут Нина.'
    note: '*Vine o fată nouă* («придёт новая девушка») вводит нового человека; *O cheamă Nina* называет её имя.'
  ro.a1.unit31.lesson04.teach.mihai_bine_cum:
    title: Михай спрашивает, как она выглядит
    gloss: 'Михай: Отлично! А как она выглядит?'
    note: 'Главный вопрос раздела без имени: *Cum arată?* (о ком речь, понятно из контекста).'
  ro.a1.unit31.lesson04.teach.ana_este_scunda:
    title: Ана описывает рост и волосы Нины
    gloss: 'Ана: Она невысокая, у неё короткие светлые волосы.'
    note: Объединяет *scundă* из урока 1 и лексику о волосах из урока 2.
  ro.a1.unit31.lesson04.teach.mihai_si_ochii:
    title: Михай спрашивает о её глазах
    gloss: 'Михай: А глаза?'
    note: '*Și ochii?* («А глаза?») — короткий уточняющий вопрос; о ком речь, понятно из контекста.'
  ro.a1.unit31.lesson04.teach.ana_are_ochi:
    title: Ана описывает глаза Нины
    gloss: 'Ана: У неё зелёные глаза.'
    note: Снова *ochi verzi* из урока 3.
  ro.a1.unit31.lesson04.teach.mihai_multumesc_atunci:
    title: Михай её узнает
    gloss: 'Михай: Спасибо! Тогда я её точно узнаю.'
    note: '*O recunosc* значит «я её узнаю»: *o* — местоимение-дополнение «её», оно стоит перед глаголом.'
  ro.a1.unit31.lesson05.teach.andrei_si_elena:
    title: Сравниваем Андрея и Елену
    gloss: Андрей и Елена — брат и сестра, но выглядят они по-разному. Андрей невысокий, у него короткие каштановые волосы и карие глаза. Елена выше Андрея, у неё длинные каштановые волосы и зелёные глаза. А как выглядишь ты?
    note: Короткое сравнение, в котором встречаются все изученные слова о цвете и длине; в конце читателю задан главный вопрос раздела.
    glosses:
      frate: брат
      soră: сестра
      arată: выглядеть
      diferit: разный
      scund: невысокий
      scurt: невысокий
      maro: карий
      părul: волосы
      ochi: глаза
      înaltă: выше
      lung: длинный
      verzi: зелёный
      arăți: выглядеть (как ты выглядишь)
  ro.a1.unit31.lesson05.teach.comparativul_se_formeaza:
    title: Сравнение с mai ... decât
    gloss: 'Сравнительная степень образуется так: mai + прилагательное + decât: Elena este mai înaltă decât Andrei.'
    note: 'В румынском *mai* («более») стоит перед прилагательным, а *decât* («чем») — перед вторым человеком: *mai înaltă decât Andrei*.'
  ro.a1.unit31.lesson05.teach.elena_are_parul:
    title: У Елены волосы длиннее, чем у Андрея
    gloss: У Елены волосы длиннее, чем у Андрея.
    note: '*Mai lung* работает так же перед *decât*: *părul mai lung decât Andrei*; прилагательное по-прежнему стоит после *părul*.'
  ro.a1.unit31.lesson05.teach.am_parul_scurt:
    title: У меня короткие каштановые волосы
    gloss: У меня короткие каштановые волосы.
    note: Образец предложения от первого лица с *Am ...*; его удобно использовать, когда описываешь свою внешность.
  ro.a1.unit31.lesson06.teach.mihai_uite_ea:
    title: Михай замечает Нину
    gloss: 'Михай: Смотри, это Нина? У неё короткие светлые волосы и зелёные глаза.'
    note: '*Uite* («смотри») привлекает внимание к чему-либо; *ea e Nina?* значит «это Нина?».'
  ro.a1.unit31.lesson06.teach.ana_da_ea:
    title: Ана подтверждает
    gloss: 'Ана: Да, это Нина!'
    note: Короткое естественное подтверждение.
  ro.a1.unit31.lesson06.teach.nina_salut_tu:
    title: Нина здоровается с Михаем
    gloss: 'Нина: Привет, ты Михай?'
    note: 'Простой неформальный вопрос при встрече: *tu ești ...?*'
  ro.a1.unit31.lesson06.teach.mihai_da_ma:
    title: Михай отвечает на приветствие Нины
    gloss: 'Михай: Да! Рад познакомиться, Нина.'
    note: '*Mă bucur să te cunosc* («рад с тобой познакомиться») — стандартная фраза при первом знакомстве.'
  ro.a1.unit31.lesson06.teach.nina_si_eu:
    title: Нина отвечает на приветствие
    gloss: 'Нина: Я тоже рада познакомиться!'
    note: 'Завершает диалог: Михай успешно узнал Нину по описанию Аны.'
