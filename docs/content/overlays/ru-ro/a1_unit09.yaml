answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit introduces the course's first imperative form, "Mergeți" (go) -- the dumneavoastră/formal-plural imperative, matching the course's established dumneavoastră-as-safe-default policy. No tu-register imperative is taught or accepted here. Ana and Mihai's direction-giving dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08.
course:
  title: Румынский язык A1
  description: 'Как спросить дорогу и понять короткие указания по-румынски: Cum pot să ajung...? (Как мне добраться до...?), Mergeți înainte (идите прямо), la dreapta / la stânga (направо / налево), aici / acolo (здесь / там). Ана и Михай продолжают общаться: Ана спрашивает Михая, как добраться до вокзала.'
units:
  ro.a1.unit09.directions:
    title: Как пройти
lessons:
  ro.a1.unit09.lesson01.cum_ajung:
    title: Как мне добраться до...?
  ro.a1.unit09.lesson02.dreapta_stanga:
    title: Направо, налево
  ro.a1.unit09.lesson03.pe_strada:
    title: На улице
teaching:
  ro.a1.unit09.lesson01.teach.reminder_unde_este_locuri:
    title: 'Повторение: unde, este, gară, magazin, bancă, aproape'
    gloss: unde (где) · este (находится, есть) · gară (вокзал) · magazin (магазин) · bancă (банк) · aproape (близко)
    note: 'Всё это уже встречалось: unde — с урока 7, este — с уроков 3 и 4, gară/magazin/bancă/aproape — с урока 8. Здесь они соединяются в вопросы и примеры о том, как пройти.'
  ro.a1.unit09.lesson01.teach.cum_pot_sa_ajung:
    title: Как мне добраться до...?
    gloss: Cum pot să ajung...? (Как мне добраться до...?)
    note: Обычный способ спросить, как добраться до места. *pot* («я могу») уже было в *Unde pot să cumpăr...?* из урока 7; *ajung* («добираюсь, прибываю») — новое слово.
  ro.a1.unit09.lesson01.teach.mergeti_vocab:
    title: Идите
    gloss: Mergeți (идите — вежливая форма)
    note: '*Mergeți* — повелительное наклонение вежливой формы (dumneavoastră), вежливый способ сказать «идите»; так же Ана и Михай обращаются друг к другу.'
    example_gloss:
    - Идите прямо.
  ro.a1.unit09.lesson01.teach.inainte_vocab:
    title: Прямо
    gloss: înainte (прямо, вперёд)
    note: Сочетается с *Mergeți* и даёт простейшее указание направления.
    example_gloss:
    - Идите прямо.
  ro.a1.unit09.lesson01.teach.mergeti_inainte_phrase:
    title: Идти прямо
    gloss: Mergeți înainte. (Идите прямо.)
    note: Короткое законченное указание — самый простой ответ на *Cum pot să ajung...?*
  ro.a1.unit09.lesson01.teach.cum_ajung_gara:
    title: Как мне добраться до вокзала?
    gloss: Cum pot să ajung la gară? (Как мне добраться до вокзала?)
    note: 'Здесь *Cum pot să ajung...?* и *gară* соединены в один полный вопрос: *la* («до, в») связывает вопрос с пунктом назначения. После *la* слово остаётся без артикля: *la gară*, а не *la gara*.'
  ro.a1.unit09.lesson01.teach.cum_ajung_banca:
    title: Как мне добраться до банка?
    gloss: Cum pot să ajung la bancă? (Как мне добраться до банка?)
    note: Та же модель, теперь с банком — естественный вопрос, ведь в уроке 8 мы выяснили, что банк далеко.
  ro.a1.unit09.lesson02.teach.dreapta_stanga_vocab:
    title: Направо, налево
    gloss: la dreapta (направо) · la stânga (налево)
    note: 'Два основных поворота: учи каждый как устойчивое сочетание с *la*: *la dreapta*, *la stânga*.'
    example_gloss:
    - Идите направо.
    - Идите налево.
  ro.a1.unit09.lesson02.teach.mergeti_dreapta_phrase:
    title: Идите направо
    gloss: Mergeți la dreapta. (Идите направо.)
    note: Та же команда *Mergeți*, что и в *Mergeți înainte.*, но теперь с поворотом вместо движения прямо.
  ro.a1.unit09.lesson02.teach.mergeti_stanga_phrase:
    title: Идите налево
    gloss: Mergeți la stânga. (Идите налево.)
    note: Поворот в другую сторону — та же простая конструкция.
  ro.a1.unit09.lesson02.teach.aici_acolo_vocab:
    title: Здесь, там
    gloss: aici (здесь) · acolo (там)
    note: Простой способ указать, где что-то находится, когда вы уже пришли или видите это место. Отличается от aproape/departe из урока 8, которые говорят о расстоянии, а не о положении.
    example_gloss:
    - Магазин здесь.
    - Вокзал вон там.
  ro.a1.unit09.lesson02.teach.magazinul_aici_phrase:
    title: Магазин здесь
    gloss: Magazinul este aici. (Магазин здесь.)
    note: 'Короткое законченное предложение: *aici* указывает на то, что находится прямо там, где ты стоишь.'
  ro.a1.unit09.lesson02.teach.gara_acolo_phrase:
    title: Вокзал вон там
    gloss: Gara este acolo. (Вокзал вон там.)
    note: '*Acolo* указывает на то, что видно, но находится не рядом с тобой. Это естественное завершение объяснения дороги.'
  ro.a1.unit09.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Повторение: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (привет) · mulțumesc (спасибо) · la revedere (до свидания) · da (да) · Ana, Mihai (имена)
    note: Всё это уже встречалось в предыдущих уроках. Здесь Ана спрашивает у Михая дорогу.
  ro.a1.unit09.lesson03.teach.apoi:
    title: Потом
    gloss: apoi (потом / затем)
    note: Соединяет два шага маршрута в одно указание. Так естественно объяснять дорогу, когда шагов несколько.
    example_gloss:
    - Идите прямо, потом направо.
  ro.a1.unit09.lesson03.teach.line01:
    title: Поздороваться и спросить, как добраться до вокзала
    gloss: Ана здоровается с Михаем и спрашивает, как добраться до вокзала.
    note: Сочетает конструкцию *Cum pot să ajung* из этого урока с приветствием из урока 1.
  ro.a1.unit09.lesson03.teach.line02:
    title: Назвать два шага маршрута
    gloss: Михай говорит идти прямо, потом направо.
    note: Снова *Mergeți înainte* и *la dreapta* из этого урока, соединённые словом *apoi*.
  ro.a1.unit09.lesson03.teach.line03:
    title: Спросить, близко ли
    gloss: Ана спрашивает, близко ли вокзал.
    note: Короткий уточняющий вопрос со словами *este* и *aproape* из урока 8.
  ro.a1.unit09.lesson03.teach.line04:
    title: Подтвердить и показать, где это
    gloss: Михай подтверждает, что близко, и показывает, что вокзал вон там.
    note: 'В одной реплике соединены *aproape* и *acolo*: расстояние и положение.'
  ro.a1.unit09.lesson03.teach.line05:
    title: Поблагодарить и проститься
    gloss: Ана благодарит Михая и прощается.
    note: Та же благодарность в конце, что и в диалогах уроков 1 и 8.
  ro.a1.unit09.lesson03.teach.line06:
    title: Завершить встречу
    gloss: Михай прощается в ответ и называет Ану по имени.
    note: Та же дружелюбная концовка, которой заканчивались диалоги уроков 1, 5, 6, 7 и 8.
