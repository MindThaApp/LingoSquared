answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: No new register-sensitive forms in this unit -- este (is), the core verb every sentence here uses, does not change with tu or dumneavoastră (same standing note as unit03/unit04). Ana and Mihai's neighborhood dialogue keeps their existing polite register with each other, matching unit06/unit07.
course:
  title: Румынский язык A1
  description: 'Как назвать и найти знакомые места по-румынски: спросить Unde este...? (Где находится...?), сказать, что место aproape (близко) или departe (далеко), и с помощью lângă (рядом с), vizavi de (напротив) и între (между) описать простой район. Ана и Михай продолжают разговор о том, как ориентироваться в городе.'
units:
  ro.a1.unit08.places:
    title: Места
lessons:
  ro.a1.unit08.lesson01.unde_este:
    title: Где...?
  ro.a1.unit08.lesson02.langa_vizavi_intre:
    title: Рядом, напротив, между
  ro.a1.unit08.lesson03.in_cartier:
