teaching:
  ro.a1.unit08.lesson01.teach.reminder_unde_este:
    title: 'Повторение: unde, este'
    gloss: unde (где) · este (находится, есть)
    note: 'Оба слова уже встречались: *unde* — в *Unde pot să cumpăr ...?* из раздела 7, *este* — ещё с разделов 3 и 4. Здесь они соединяются в главный вопрос этого раздела — о местонахождении.'
  ro.a1.unit08.lesson01.teach.unde_este_phrase:
    title: Где...?
    gloss: Unde este...? (Где находится...?)
    note: 'Обычный способ спросить, где что-то находится: после *este* добавь название места или произнеси вопрос один, если из контекста и так ясно, о каком месте речь.'
  ro.a1.unit08.lesson01.teach.gara_magazin_banca:
    title: Вокзал, магазин, банк
    gloss: gară (вокзал) · magazin (магазин) · bancă (банк)
    note: 'Три обычных места. Когда речь о конкретном, известном месте, они употребляются с определённым артиклем: *gara*, *magazinul*, *banca*.'
    example_gloss:
    - Где находится вокзал?
    - Магазин рядом.
    - Банк далеко.
  ro.a1.unit08.lesson01.teach.aproape_departe:
    title: Близко, далеко
    gloss: aproape (близко / рядом) · departe (далеко)
    note: Простой способ сказать, далеко место или близко, не объясняя точной дороги.
    example_gloss:
    - Магазин рядом.
    - Банк далеко.
  ro.a1.unit08.lesson01.teach.magazinul_aproape:
    title: Магазин рядом
    gloss: Magazinul este aproape. (Магазин рядом.)
    note: 'Короткое законченное предложение: после *aproape* не нужно называть место, если и так ясно, о каком месте речь.'
  ro.a1.unit08.lesson01.teach.banca_departe:
    title: Банк далеко
    gloss: Banca este departe. (Банк далеко.)
    note: Противоположность *aproape* — модель та же.
  ro.a1.unit08.lesson01.teach.unde_este_gara:
    title: Где находится вокзал?
    gloss: Unde este gara? (Где находится вокзал?)
    note: '*Unde este...?* и *gara* соединяются в один полный вопрос.'
  ro.a1.unit08.lesson02.teach.spital_posta_biblioteca_statie:
    title: Больница, почта, библиотека, автобусная остановка
    gloss: spital (больница) · poștă (почта) · bibliotecă (библиотека) · stație de autobuz (автобусная остановка)
    note: 'Ещё четыре обычных места. Как и gară/magazin/bancă, для конкретного места они берут определённый артикль: *spitalul*, *poșta*, *biblioteca*, *stația de autobuz*.'
    example_gloss:
    - Больница напротив магазина.
    - Почта между магазином и больницей.
    - Библиотека рядом с вокзалом.
    - Автобусная остановка рядом с библиотекой.
  ro.a1.unit08.lesson02.teach.langa_vizavi_intre:
    title: Рядом, напротив, между
    gloss: lângă (рядом с) · vizavi de (напротив) · între (между)
    note: Три способа указать положение места относительно другого. После *vizavi de* стоит *de*, а *între* соединяет два места с помощью *și*; *lângă* присоединяет место напрямую.
    example_gloss:
    - Магазин рядом с вокзалом.
    - Больница напротив магазина.
    - Почта между магазином и больницей.
  ro.a1.unit08.lesson02.teach.magazinul_langa_gara:
    title: Магазин рядом с вокзалом
    gloss: Magazinul este lângă gară. (Магазин рядом с вокзалом.)
    note: '*Lângă* присоединяет название места напрямую, без дополнительных слов.'
  ro.a1.unit08.lesson02.teach.spitalul_vizavi_magazin:
    title: Больница напротив магазина
    gloss: Spitalul este vizavi de magazin. (Больница напротив магазина.)
    note: В *vizavi de* слово *de* нужно перед вторым местом.
  ro.a1.unit08.lesson02.teach.posta_intre:
    title: Почта между магазином и больницей
    gloss: Poșta este între magazin și spital. (Почта между магазином и больницей.)
    note: После *între* называются два места, соединённые словом *și* (и).
  ro.a1.unit08.lesson02.teach.statia_langa_biblioteca:
    title: Автобусная остановка рядом с библиотекой
    gloss: Stația de autobuz este lângă bibliotecă. (Автобусная остановка рядом с библиотекой.)
    note: Та же конструкция с *lângă*, что и с магазином и вокзалом, теперь — с автобусной остановкой и библиотекой.
  ro.a1.unit08.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Повторение: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (привет) · mulțumesc (спасибо) · la revedere (до свидания) · da (да) · Ana, Mihai (имена)
    note: Всё это уже встречалось в прошлых уроках. Здесь Ана и Михай снова встречаются, на этот раз в своём районе.
  ro.a1.unit08.lesson03.teach.line01:
    title: Здороваемся и спрашиваем, где почта
    gloss: Ана здоровается с Михаем и спрашивает, где почта.
    note: Здесь соединяются *Unde este* из этого урока и приветствие из урока 1.
  ro.a1.unit08.lesson03.teach.line02:
    title: Объяснить, где находится место
    gloss: Михай говорит, что почта находится между магазином и больницей.
    note: Снова используются *poșta* и конструкция *între ... și* из этого урока.
  ro.a1.unit08.lesson03.teach.line03:
    title: Спрашиваем о библиотеке
    gloss: Ана спрашивает, близко ли библиотека.
    note: Короткий уточняющий вопрос с *este* и *aproape*.
  ro.a1.unit08.lesson03.teach.line04:
    title: Подтверждаем и добавляем
    gloss: Михай подтверждает, что библиотека близко от вокзала, и добавляет, что автобусная остановка рядом с библиотекой.
    note: В одной реплике сочетаются *aproape de* и *lângă* — оба предлога из этого урока.
  ro.a1.unit08.lesson03.teach.line05:
    title: Благодарим и прощаемся
    gloss: Ана благодарит Михая и прощается.
    note: '*Mulțumesc* здесь — простая благодарность на прощание, то же слово, что в *Bine, mulțumesc.* из урока 1.'
  ro.a1.unit08.lesson03.teach.line06:
    title: Завершаем встречу
    gloss: Михай тоже прощается и называет Ану по имени.
    note: Такое же дружеское прощание завершало диалоги уроков 1, 5, 6 и 7.
