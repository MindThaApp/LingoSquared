answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Румынский язык A1
  description: 'Стандартные румынские приветствия и знакомство. Особое внимание уделено различию, которое важнее всего на этом этапе: неформальное tu и вежливое dumneavoastră (как русские «ты» и «вы»), а также два повседневных способа назвать своё имя (mă numesc.../mă cheamă...).'
units:
  ro.a1.unit01.greetings:
    title: Приветствия и первые встречи
lessons:
  ro.a1.unit01.lesson01.tu_dumneavoastra_greetings:
    title: 'Приветствия: tu и dumneavoastră'
  ro.a1.unit01.lesson02.names_introductions:
    title: Как тебя зовут?
  ro.a1.unit01.lesson03.street_meeting:
    title: Встреча на улице
teaching:
  ro.a1.unit01.lesson01.teach.buna:
    title: Повседневное приветствие
    gloss: привет
    note: Bună — повседневное, слегка неформальное приветствие. Оно подходит для друзей, ровесников и большинства обычных встреч в течение дня.
    example_gloss: Привет, Mihai!
  ro.a1.unit01.lesson01.teach.salut:
    title: Неформальное приветствие
    gloss: привет; пока
    note: Salut — неформальное приветствие для друзей и ровесников. Им можно и начать, и закончить разговор, но с незнакомым взрослым лучше не начинать с него.
    example_gloss: Привет, Ana!
  ro.a1.unit01.lesson01.teach.buna_ziua:
    title: Вежливое приветствие
    gloss: добрый день; здравствуйте
    note: Bună ziua — безопасное вежливое приветствие для незнакомого взрослого, продавца или любого человека, к которому вы обращаетесь на dumneavoastră. Буквально «добрый день», но это общее вежливое «здравствуйте», а не только приветствие в полдень.
    example_gloss: Добрый день, Ana!
  ro.a1.unit01.lesson01.teach.la_revedere:
    title: Нейтральное прощание
    gloss: до свидания; прощай
    note: La revedere подходит и для вежливого, и для неформального общения, как русское «до свидания».
    example_gloss: Добрый день! До свидания!
  ro.a1.unit01.lesson01.teach.tu:
    title: «Ты» — обращение к одному человеку
    gloss: ты
    note: В румынском, как и в русском, есть два «вы»-«ты» уровня общения. Tu обращено к одному другу, ребёнку или человеку, с которым отношения явно неформальные, и у него своя форма глагола (faci, а не faceți).
  ro.a1.unit01.lesson01.teach.dumneavoastra:
    title: «Вы» — вежливое или во множественном числе
    gloss: вы (вежливое обращение к одному человеку или обращение к нескольким)
    note: Dumneavoastră — безопасный выбор для одного незнакомого взрослого; оно подходит и для группы, к которой вы обращаетесь вежливо. По роли это русское «вы». Слово происходит от domnia voastră («ваша милость») и требует глагола во множественном числе (faceți, numiți), как и русское «вы делаете», даже когда речь об одном человеке.
  ro.a1.unit01.lesson01.teach.ce_mai_faceti:
    title: Вежливый вопрос о самочувствии
    gloss: Как вы поживаете?
    note: Faceți — форма dumneavoastră глагола a face («делать»). Это устоявшийся вежливый вопрос, а не буквальный вопрос о том, чем человек занят.
  ro.a1.unit01.lesson01.teach.ce_mai_faci:
    title: Неформальный вопрос о самочувствии
    gloss: Как вы поживаете?
    note: Faci — форма tu глагола a face. Между вежливым и неформальным вариантом этого вопроса меняется только окончание глагола, а ce mai остаётся тем же.
  ro.a1.unit01.lesson01.teach.bine_multumesc:
    title: Стандартный положительный ответ
    gloss: Хорошо, спасибо.
    note: 'Bine, mulțumesc отвечает на ce mai faci/faceți при любом уровне вежливости: сам ответ не меняется.'
    example_gloss: Как дела? Хорошо, спасибо.
  ro.a1.unit01.lesson01.teach.register_choice:
    title: Подбери приветствие к отношениям
    gloss: Bună ziua с dumneavoastră; Salut с tu
    note: Это удобные ориентиры, а не незыблемые законы. Bună ziua может начинать и официальный разговор, который затем продолжается на dumneavoastră; сочетание Salut с dumneavoastră обычно даёт противоречивый сигнал.
  ro.a1.unit01.lesson02.teach.ma_numesc:
    title: Назвать своё имя (стандартно)
    gloss: Меня зовут Ana.
    note: Mă numesc буквально значит «я называю себя». Это нейтральный способ назвать своё имя, уместный в любой ситуации, примерно как русское «Меня зовут...» в спокойной, нейтральной речи.
    example_gloss: Привет! Меня зовут Ana.
  ro.a1.unit01.lesson02.teach.cum_va_numiti:
    title: Вежливо спросить имя
    gloss: Как вас зовут?
    note: Numiți — форма dumneavoastră глагола a se numi («называться»). Vă — возвратное местоимение, соответствующее dumneavoastră; здесь оно обязательно.
  ro.a1.unit01.lesson02.teach.ma_cheama:
    title: Назвать своё имя (разговорно)
    gloss: Меня зовут Mihai.
    note: Mă cheamă — более разговорный способ назвать имя, буквально «меня зовёт». Mă numesc и mă cheamă оба правильны и часто употребляются; mă cheamă чуть непринуждённее.
    example_gloss: Привет! Меня зовут Mihai.
  ro.a1.unit01.lesson02.teach.cum_te_cheama:
    title: Спрашиваем имя неформально
    gloss: Как тебя зовут?
    note: Te — возвратное местоимение, соответствующее tu. Так друзья и ровесники обычно спрашивают друг у друга имя.
  ro.a1.unit01.lesson02.teach.imi_pare_bine:
    title: Знакомство
    gloss: Приятно познакомиться!
    note: Îmi pare bine буквально значит «мне кажется хорошо». Это устойчивое выражение, а не дословный перевод слова «приятно». В отличие от русского «рад/рада», оно не меняется в зависимости от пола говорящего.
    example_gloss: Меня зовут Mihai. Приятно познакомиться!
  ro.a1.unit01.lesson02.teach.si_mie_imi_pare_bine:
    title: Отвечаем взаимностью
    gloss: Мне тоже приятно!
    note: Și mie добавляет «тоже» в начало того же устойчивого выражения, которым начинали разговор.
  ro.a1.unit01.lesson02.teach.si_dumneavoastra:
    title: Вежливо задать вопрос в ответ
    gloss: А вы?
    note: Используйте dumneavoastră, чтобы сохранить вежливый тон или обратиться к нескольким людям.
  ro.a1.unit01.lesson02.teach.si_tu:
    title: Неформально задать вопрос в ответ
    gloss: А вы?
    note: Используйте tu после și, когда неформально обращаетесь к одному другу или ровеснику.
  ro.a1.unit01.lesson03.teach.line01:
    title: Начало разговора
    gloss: Ana официально здоровается с Mihai и называет своё имя.
    note: Ana начинает с вежливого bună ziua, как и подобает при знакомстве с незнакомым человеком.
  ro.a1.unit01.lesson03.teach.line02:
    title: Начало разговора, ответ
    gloss: Mihai отвечает тем же, называет своё имя и спрашивает, как у неё дела.
    note: 'Mihai сохраняет тот же вежливый тон, с которого начала Ana: он говорит ce mai faceți, а не ce mai faci.'
  ro.a1.unit01.lesson03.teach.line03:
    title: Ответить и вернуть вопрос
    gloss: Ana говорит, что у неё всё хорошо, и вежливо задаёт Mihai тот же вопрос.
    note: Și dumneavoastră сохраняет официальный тон, как и в начале разговора.
  ro.a1.unit01.lesson03.teach.line04:
    title: Ответить и закончить разговор
    gloss: Mihai говорит, что у него тоже всё хорошо, и прощается.
    note: La revedere — нейтральное прощание, подходящее и для официального, и для неформального разговора.
  ro.a1.unit01.lesson03.teach.line05:
    title: Завершить встречу
    gloss: Ana отвечает тем же прощанием.
    note: Повторить la revedere в ответ — естественный способ дружелюбно завершить разговор.
exercises:
  ro.a1.unit01.lesson01.exercise01.listen_buna:
    instruction: Послушай и выбери фразу, которую ты слышишь.
    correct_option: Bună!
    distractors:
    - Salut!
    - La revedere!
    accepted_answers:
    - Bună!
    - Bună
  ro.a1.unit01.lesson01.exercise02.choose_informal_pronoun:
    instruction: Какое местоимение подходит к этому неформальному приветствию?
    correct_option: tu
    distractors:
    - dumneavoastră
    accepted_answers:
    - tu
    feedback: Salut и tu вместе образуют неформальную пару.
  ro.a1.unit01.lesson01.exercise04.order_polite_question:
    instruction: Расставь слова вежливого вопроса о самочувствии в правильном порядке.
    correct_response:
    - Ce
    - mai
    - faceți
  ro.a1.unit01.lesson01.exercise06.match_register:
    instruction: Соедини каждое приветствие с его обычным регистром общения.
    correct_response:
      Bună ziua: dumneavoastră
      Salut: ты
    pairs:
    - left: Bună ziua
      right: dumneavoastră
    - left: Salut
      right: ты
  ro.a1.unit01.lesson01.exercise03.choose_polite_pronoun:
    instruction: Закончи приветствие, обращённое к одному незнакомому взрослому.
    accepted_answers:
    - dumneavoastră
    feedback: Dumneavoastră — безопасный вежливый выбор при обращении к незнакомому взрослому.
  ro.a1.unit01.lesson01.exercise05.listen_informal_question:
    instruction: Напиши услышанный неформальный вопрос.
    accepted_answers:
    - Ce mai faci?
    - Ce mai faci
  ro.a1.unit01.lesson01.exercise07.complete_farewell:
    instruction: Закончи нейтральное прощание.
    accepted_answers:
    - revedere
  ro.a1.unit01.lesson01.exercise08.speak_greeting:
    instruction: Вежливо поздоровайся, спроси, как дела у собеседника, и закончи разговор.
    accepted_answers:
    - Bună ziua. Ce mai faceți? La revedere.
    - Bună ziua, ce mai faceți? La revedere.
  ro.a1.unit01.lesson02.exercise02.listen_name_question:
    instruction: Послушай и выбери вежливый вопрос об имени.
    correct_option: Cum vă numiți?
    distractors:
    - Cum te cheamă?
    - Ce mai faceți?
    accepted_answers:
    - Cum vă numiți?
    - Cum va numiti?
  ro.a1.unit01.lesson02.exercise05.choose_reply_meaning:
    instruction: Что означает ответ Mihai?
    correct_option: Приятно познакомиться!
    distractors:
    - До свидания!
    - Как дела?
    accepted_answers:
    - Приятно познакомиться!
  ro.a1.unit01.lesson02.exercise01.order_self_intro:
    instruction: Составь фразу, которой Ana представляется.
    correct_response:
    - Mă
    - numesc
    - Ana
  ro.a1.unit01.lesson02.exercise07.match_introductions:
    instruction: Соедини каждый вопрос об имени с подходящим ответом.
    correct_response:
      Cum vă numiți?: Mă numesc Ana.
      Cum te cheamă?: Mă cheamă Mihai.
    pairs:
    - left: Cum vă numiți?
      right: Mă numesc Ana.
    - left: Cum te cheamă?
      right: Mă cheamă Mihai.
  ro.a1.unit01.lesson02.exercise03.informal_name_question:
    instruction: После неформального приветствия спроси, как зовут собеседника.
    accepted_answers:
    - Cum te cheamă?
    - Cum te cheama?
  ro.a1.unit01.lesson02.exercise04.complete_ma_cheama:
    instruction: Дополни фразу, в которой называется имя Mihai.
    accepted_answers:
    - Mă
  ro.a1.unit01.lesson02.exercise06.return_polite_question:
    instruction: Верни вопрос собеседнику, оставаясь в вежливом регистре.
    accepted_answers:
    - Și dumneavoastră?
    - Si dumneavoastra?
  ro.a1.unit01.lesson02.exercise08.write_introduction:
    instruction: 'Ты — Ana. Напиши: поздоровайся с помощью Bună, назови своё имя с помощью mă numesc, затем скажи «Приятно познакомиться».'
    accepted_answers:
    - Bună. Mă numesc Ana. Îmi pare bine.
    - Buna. Ma numesc Ana. Imi pare bine.
  ro.a1.unit01.lesson03.exercise01.role_selection:
    instruction: Кто из собеседников в диалоге называет своё имя с помощью этой фразы?
    correct_option: Ana
    distractors:
    - Mihai
    - Никто из них
    accepted_answers:
    - Ana
  ro.a1.unit01.lesson03.exercise02.comprehend_register:
    instruction: Какое местоимение Ana и Mihai используют друг с другом?
    correct_option: dumneavoastră
    distractors:
    - tu
    - te
    accepted_answers:
    - dumneavoastră
  ro.a1.unit01.lesson03.exercise03.comprehend_names:
    instruction: Кто использует mă numesc, а кто — mă cheamă?
    correct_option: Ana uses mă numesc; Mihai uses mă cheamă.
    distractors:
    - Mihai uses mă numesc; Ana uses mă cheamă.
    - Оба собеседника используют mă numesc.
    accepted_answers:
    - Ana uses mă numesc; Mihai uses mă cheamă.
    - Ana; Mihai
  ro.a1.unit01.lesson03.exercise05.order_closing:
    instruction: Составь заключительный ответ и прощание.
    correct_response:
    - Bine,
    - mulțumesc.
    - La
    - revedere!
  ro.a1.unit01.lesson03.exercise04.role_response:
    instruction: Ты — Ana. Ответь вежливо и верни вопрос.
    accepted_answers:
    - Bine, mulțumesc. Și dumneavoastră?
    - Bine, multumesc. Si dumneavoastra?
  ro.a1.unit01.lesson03.exercise06.speak_role:
    instruction: Ты — Ana. Вежливо поздоровайся с Mihai, назови своё имя, ответь на его приветствие и закончи разговор.
    accepted_answers:
    - Bună ziua. Mă numesc Ana. Îmi pare bine! La revedere!
    - Buna ziua. Ma numesc Ana. Imi pare bine! La revedere!
    - Bună ziua. Mă numesc Ana. Și mie îmi pare bine! La revedere!
  ro.a1.unit01.lesson01.exercise09.dictation_buna:
    instruction: Напиши то, что ты слышишь.
    correct_option: Bună
    accepted_answers:
    - value: Bună
      status: correct
    orthography_strict: true
