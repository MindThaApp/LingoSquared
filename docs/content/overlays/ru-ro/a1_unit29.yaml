teaching:
  ro.a1.unit29.lesson01.teach.cat_costa_in:
    title: Спрашиваем общую стоимость
    gloss: Сколько это стоит всего?
    note: '*În total* («в общей сумме») уточняет, что тебя интересует полная цена, а не цена одной позиции; *Cât costă?* значит «сколько это стоит?».'
  ro.a1.unit29.lesson01.teach.costa_douazeci_si:
    title: Называем общую стоимость
    gloss: Всего это стоит сто лей.
    note: '*Costă* — форма 3-го лица единственного числа от *a costa* (стоить). После числительных больше 19 в румынском перед существительным ставится *de*: *o sută de lei*.'
  ro.a1.unit29.lesson02.teach.a_plati_cu:
    title: Оплата картой или наличными
    gloss: платить картой, платить наличными
    note: '*A plăti cu cardul* значит «платить картой», а *a plăti în numerar* — «платить наличными»; *cu* значит «с, при помощи», а *în* — «в».'
    example_gloss:
    - Можно здесь заплатить картой?
    - Я плачу наличными.
  ro.a1.unit29.lesson02.teach.pot_plati_cu:
    title: Спрашиваем, можно ли платить картой
    gloss: Можно здесь заплатить картой?
    note: '*Pot plăti* («я могу заплатить») — это *a putea* + глагол; *aici* («здесь») относит вопрос к этому месту.'
  ro.a1.unit29.lesson02.teach.doriti_sa_platiti:
    title: Спрашиваем о способе оплаты
    gloss: Вы хотите заплатить наличными или картой?
    note: '*Doriți să plătiți ...?* — вежливая форма на *dumneavoastră*, которую использует незнакомый кассир; с другом ты бы сказал(а) *Vrei să plătești ...?*'
  ro.a1.unit29.lesson03.teach.nota:
    title: Счёт
    gloss: счёт
    note: 'Существительное женского рода: *o notă*, *nota* (артикль присоединяется к концу слова).'
    example_gloss: Разделим счёт?
  ro.a1.unit29.lesson03.teach.hai_sa_impartim:
    title: Предлагаем разделить счёт
    gloss: Разделим счёт?
    note: '*Hai să* + глагол — предложение сделать что-то вместе.'
  ro.a1.unit29.lesson03.teach.pot_plati_separat:
    title: Просим заплатить раздельно
    gloss: Можно заплатить раздельно?
    note: '*Separat* («отдельно») стоит после *a plăti*; *Pot plăti separat?* — обычная просьба, когда каждый платит за себя.'
  ro.a1.unit29.lesson04.teach.restul:
    title: Сдача
    gloss: сдача
    note: '*Restul* буквально значит «остаток»; так по-румынски называют сдачу, которую получают обратно. Артикль присоединяется к концу слова.'
    example_gloss: Вот ваша сдача.
  ro.a1.unit29.lesson04.teach.poftiti_restul:
    title: Отдаём сдачу
    gloss: Вот ваша сдача.
    note: '*Poftiți* — вежливая форма на *dumneavoastră* со значением «пожалуйста, возьмите», подходящая для официального тона у кассы.'
  ro.a1.unit29.lesson04.teach.nu_am_nevoie:
    title: Отказываемся от сдачи
    gloss: Сдача не нужна.
    note: '*A avea nevoie de* («нуждаться в») требует *de*: *Nu am nevoie de rest*.'
  ro.a1.unit29.lesson05.teach.treizeci_si_cinci:
    title: Тридцать пять
    gloss: тридцать пять
    note: 'Числа от 21 до 99 в румынском образуются с *și*: *treizeci și cinci* (буквально «тридцать и пять»), а перед существительным добавляется *de*: *o sută treizeci și cinci de lei*.'
    example_gloss: Это стоит сто тридцать пять лей.
  ro.a1.unit29.lesson05.teach.nota_doua_feluri:
    title: Читаем счёт из ресторана
    gloss: 'Счёт: два основных блюда и два кофе. Итого: сто тридцать пять лей. Оплачено картой.'
    note: Обрати внимание, что заказали, какова итоговая сумма и как заплатили.
    glosses:
      Nota: счёт
      două: два
      feluri: основные блюда
      cafele: кофе
      Total: итого
      '135': сто тридцать пять
      lei: лей
      Plătit: оплачено
      cardul: карта
  ro.a1.unit29.lesson06.teach.ana_hai_sa:
    title: Ана просит счёт
    gloss: 'Ана: Давай попросим счёт?'
    note: '*A cere* (просить) принимает *nota* как прямое дополнение; *Hai să cerem nota?* — предложение попросить счёт вместе.'
  ro.a1.unit29.lesson06.teach.mihai_da_buna:
    title: Михай спрашивает общую сумму
    gloss: 'Михай: Да, хорошая идея. Сколько всего это стоит?'
    note: Повторяется вопрос *Cât costă în total?* из первого урока.
  ro.a1.unit29.lesson06.teach.ana_sunt_treizeci:
    title: Ана называет сумму
    gloss: 'Ана: Сто тридцать пять лей. Давай разделим?'
    note: '*Împărțim* — форма *noi* («мы») от *a împărți* (делить); *nota* подразумевается из контекста.'
  ro.a1.unit29.lesson06.teach.mihai_nu_lasa:
    title: Михай настаивает, что заплатит сам
    gloss: 'Михай: Нет, позволь мне заплатить сегодня. Ты мне так много помогла.'
    note: '*Lasă-mă să* ... («позволь мне ...») — обычный способ предложить что-то сделать; *m-ai ajutat* («ты мне помогла») — форма прошедшего времени.'
  ro.a1.unit29.lesson06.teach.ana_ce_dragut:
    title: Ана тронута
    gloss: 'Ана: Как мило с твоей стороны! Большое спасибо.'
    note: '*Ce drăguț din partea ta!* («как мило с твоей стороны») — тёплый и частый комплимент в ответ на щедрый жест.'
  ro.a1.unit29.lesson06.teach.mihai_pot_plati:
    title: Михай спрашивает об оплате картой
    gloss: 'Михай: Можно здесь заплатить картой?'
    note: Повторяется вопрос *Pot plăti cu cardul aici?* из урока 2, теперь уже в настоящем ресторане.
  ro.a1.unit29.lesson06.teach.mihai_plateste_nota:
    title: 'Plătește: форма «он/она»'
    gloss: Михай оплачивает счёт.
    note: '*Plătește* — форма «он/она» от *a plăti* (платить).'
