answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching unit01''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Spoken answers are assessed for intelligibility, not written punctuation.
  register: tu and dumneavoastră (and their matching verb forms, ai/aveți) are never interchangeable answers for each other's exercises, the same discipline unit01 established.
course:
  title: Румынский язык A1
  description: 'Числа от нуля до ста: образование числительных от одиннадцати до девятнадцати (-sprezece) и десятков (-zeci), различие doi/două по роду, а также вопросы и ответы о возрасте и номере телефона. Продолжаем историю Ana и Mihai из первого модуля.'
units:
  ro.a1.unit02.numbers:
    title: Числа
lessons:
  ro.a1.unit02.lesson01.zero_to_ten:
    title: Числа от нуля до десяти
  ro.a1.unit02.lesson02.eleven_to_hundred:
    title: Числа от одиннадцати до ста
  ro.a1.unit02.lesson03.age_and_phone:
    title: Возраст и номер телефона
teaching:
  ro.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: ноль
    note: '*Zero* не изменяется; это слово также используют, чтобы прочитать цифру 0 внутри длинного числа или номера телефона.'
    example_gloss: Ноль, один, два.
  ro.a1.unit02.lesson01.teach.unu:
    title: Один
    gloss: один
    note: '*Unu* — форма, которую используют при счёте без существительного. Перед существительным мужского или среднего рода она сокращается до *un* (*un câine*, одна собака — «один пёс»); перед существительным женского рода превращается в *o* (*o sută*, сто).'
    example_gloss: Один, два, три.
  ro.a1.unit02.lesson01.teach.doi:
    title: Два (мужской род)
    gloss: два
    note: '*Doi* употребляется с существительными мужского рода (*doi bărbați*, два мужчины). Существительные женского рода, а также среднего рода, которые во множественном числе ведут себя как женские, требуют другой формы; см. следующую карточку.'
    example_gloss: Два, три, четыре.
  ro.a1.unit02.lesson01.teach.doi_doua_gender:
    title: Два меняется по роду
    gloss: doi (мужской род) / două (женский и средний род)
    note: Как и в русском («два» и «две»), у румынского *doi* есть отдельная женская форма — *două*. Но в румынском она нужна не только с существительными женского рода (*două femei*, две женщины), но и со средним родом, который во множественном числе ведёт себя как женский (*două numere*, два числа; по-русски здесь «два»). Кроме «один» (*un*/*o*) и «два», числа от *trei* до *zece* одинаковы для всех родов.
  ro.a1.unit02.lesson01.teach.trei:
    title: Три
    gloss: три
    note: '*Trei* не изменяется ни по какому роду.'
    example_gloss: Три, четыре, пять.
  ro.a1.unit02.lesson01.teach.patru:
    title: Четыре
    gloss: четыре
    note: '*Patru* не изменяется. Обратите внимание на его неправильную сокращённую форму в числах второго десятка: *paisprezece* (14), а не *patrusprezece*.'
    example_gloss: Четыре, пять, шесть.
  ro.a1.unit02.lesson01.teach.cinci:
    title: Пять
    gloss: пять
    note: '*Cinci* не изменяется.'
    example_gloss: Пять, шесть, семь.
  ro.a1.unit02.lesson01.teach.sase:
    title: Шесть
    gloss: шесть
    note: '*Șase* не изменяется.'
    example_gloss: Шесть, семь, восемь.
  ro.a1.unit02.lesson01.teach.sapte:
    title: Семь
    gloss: семь
    note: '*Șapte* не изменяется.'
    example_gloss: Семь, восемь, девять.
  ro.a1.unit02.lesson01.teach.opt:
    title: Восемь
    gloss: восемь
    note: '*Opt* не изменяется.'
    example_gloss: Восемь, девять, десять.
  ro.a1.unit02.lesson01.teach.noua:
    title: Девять
    gloss: девять
    note: '*Nouă* не изменяется. Без диакритического знака оно совпало бы с *noua* («новая», женский род), поэтому пиши *ă*: при вводе ответа диакритика проверяется.'
    example_gloss: Девять, десять... готово!
  ro.a1.unit02.lesson01.teach.zece:
    title: Десять
    gloss: десять
    note: '*Zece* не изменяется и служит основой всех чисел от одиннадцати до девятнадцати (*zece* + *-sprezece*).'
    example_gloss: Десять! Молодец!
  ro.a1.unit02.lesson02.teach.unsprezece:
    title: Одиннадцать
    gloss: одиннадцать
    note: '*Unsprezece* буквально строится из *unu* + *spre* + *zece* («один на десять»). По этой же модели образованы все числа от двенадцати до девятнадцати.'
    example_gloss: Десять, одиннадцать, двенадцать.
  ro.a1.unit02.lesson02.teach.teens_pattern:
    title: От двенадцати до девятнадцати
    gloss: doisprezece (12), treisprezece (13), paisprezece (14), cincisprezece (15), șaisprezece (16), șaptesprezece (17), optsprezece (18), nouăsprezece (19)
    note: 'В каждом числе к обычной форме цифры добавляется *-sprezece*: *doi* → *doisprezece*, *trei* → *treisprezece* и так далее до *nouă* → *nouăsprezece*. Два числа — исключения: четырнадцать, где *patru* сокращается до *pai-* (*paisprezece*, а не *patrusprezece*), и шестнадцать, где *șase* превращается в *șai-* (*șaisprezece*, а не *șasesprezece*).'
  ro.a1.unit02.lesson02.teach.douazeci:
    title: Двадцать
    gloss: двадцать
    note: '*Douăzeci* («два десятка») — отдельное слово, основа всех чисел от 21 до 29.'
    example_gloss: Девятнадцать, двадцать...
  ro.a1.unit02.lesson02.teach.douazeci_si_unu:
    title: Двадцать один
    gloss: двадцать один
    note: 'Начиная с двадцати одного, десяток и единицы соединяются словом *și* («и»): *douăzeci și unu*, *douăzeci și doi* и так далее. Числа от 11 до 19 в отличие от них пишутся слитно.'
    example_gloss: Двадцать, двадцать один, двадцать два.
  ro.a1.unit02.lesson02.teach.tens_pattern:
    title: От тридцати до девяноста
    gloss: treizeci (30), patruzeci (40), cincizeci (50), șaizeci (60), șaptezeci (70), optzeci (80), nouăzeci (90)
    note: 'Каждый десяток начиная с тридцати — это цифра плюс *-zeci* («десятки»): *trei* → *treizeci*, *patru* → *patruzeci* и так далее. Единственное изменение в написании — шестьдесят: *șase* превращается в *șai-*, получается *șaizeci* (та же основа *șai-*, что и в *șaisprezece*). Как и в русском, 70, 80 и 90 образуются просто: цифра плюс -zeci, без счёта двадцатками.'
  ro.a1.unit02.lesson02.teach.o_suta:
    title: Сто
    gloss: сто
    note: В *o sută* используется *o* (женская форма «один/одна»), а не *un*, потому что *sută* — существительное женского рода.
    example_gloss: Девяносто, сто!
  ro.a1.unit02.lesson03.teach.cati_ani_ai:
    title: Вопрос о возрасте (неформально)
    gloss: Сколько тебе лет?
    note: 'Буквально «сколько лет ты имеешь»: возраст передаётся глаголом *avea* (иметь), как во французском *avoir*, а не глаголом «быть». В русском же говорят «тебе … лет». *Câți* (сколько, муж. р.) согласуется с *ani* (годы, муж. р.).'
  ro.a1.unit02.lesson03.teach.am_nouasprezece_ani:
    title: Назвать свой возраст (до двадцати)
    gloss: Мне девятнадцать лет.
    note: '*Am* — форма *avea* для *eu*. Перед *ani* с числами до двадцати *de* не нужно.'
  ro.a1.unit02.lesson03.teach.cati_ani_aveti:
    title: Вопрос о возрасте (формально)
    gloss: Сколько тебе лет?
    note: '*Aveți* — форма *avea* для *dumneavoastră*, она соответствует вежливому обращению из Урока 1.'
  ro.a1.unit02.lesson03.teach.am_treizeci_de_ani:
    title: Назвать свой возраст (от двадцати)
    gloss: Мне тридцать лет.
    note: Здесь появляется *de*, потому что *treizeci* — это число от двадцати и выше. Полное правило смотри на следующей карточке.
  ro.a1.unit02.lesson03.teach.de_insertion_rule:
    title: Когда ставить de перед существительным
    gloss: '2–19: без de (doi ani) / от 20: с de (treizeci de ani)'
    note: 'Особое румынское правило, которого нет в русском: числа от 2 до 19 стоят прямо перед существительным (*doi ani*, два года; *nouăsprezece ani*, девятнадцать лет), а начиная с 20 между числом и существительным нужно *de* (*treizeci de ani*, тридцать лет; *o sută de ani*, сто лет). Отдельный случай — *un an* (один год): единственное число, *de* не нужно.'
  ro.a1.unit02.lesson03.teach.care_e_numarul_tau:
    title: Спросить номер телефона на «ты»
    gloss: Какой у тебя номер телефона?
    note: '*Care* (какой) — естественное слово, когда спрашивают о конкретном, уже существующем номере, а не *ce*. *Număr* — существительное среднего рода: в единственном числе оно согласуется как мужское, поэтому после *numărul* стоит *tău*, а не *ta*.'
  ro.a1.unit02.lesson03.teach.care_este_numarul_dvs:
    title: Спросить номер телефона на «вы»
    gloss: Какой у тебя номер телефона?
    note: '*Este* — полная форма от *e*, она чаще встречается в аккуратной или официальной речи. *Dumneavoastră* сохраняет вежливый тон; это то же слово, что и в Уроке 1.'
  ro.a1.unit02.lesson03.teach.raspuns_telefon:
    title: Назвать номер телефона по цифрам
    gloss: 'Номер: ноль, семь, два, один, четыре, пять, шесть, семь, восемь, девять.'
    note: В этом уроке номер читается просто по цифрам, как и в Уроке 1, где мы упрощали выбор регистра. В жизни цифры могут называть и парами, но по отдельности их поймут всегда.
