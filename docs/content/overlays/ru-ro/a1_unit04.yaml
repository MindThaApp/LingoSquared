answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02/03''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: Румынский язык A1
  description: 'Как спросить и сказать время по-румынски: ровно час, половина, четверть, без четверти, части суток и вопрос о том, когда что-то начинается. Ана и Михай продолжают договариваться о начале занятия по румынскому.'
units:
  ro.a1.unit04.time:
    title: Как назвать время
lessons:
  ro.a1.unit04.lesson01.ora_fixa_si_jumatate:
    title: Ровно час и половина
  ro.a1.unit04.lesson02.sferturi_si_intrebari:
    title: Четверть и как спросить время
  ro.a1.unit04.lesson03.cand_incepe_cursul:
    title: Когда начинается занятие?
teaching:
  ro.a1.unit04.lesson01.teach.este:
    title: 'Напоминание: este'
    gloss: есть / это есть (3-е лицо от «быть»)
    note: Слово *este* уже встречалось в Уроках 2 и 3. Оно остаётся тем же, когда ты называешь число, день, дату, а теперь и время.
  ro.a1.unit04.lesson01.teach.ora:
    title: Час
    gloss: час (время на часах)
    note: 'Существительное женского рода. *Ora* ставится прямо перед числом, когда называют время: *ora unu* (час дня или ночи, один час).'
    example_gloss: Час.
  ro.a1.unit04.lesson01.teach.ora_unu:
    title: Час (1:00)
    gloss: час
    note: 'Буквально «час один»: сначала ora, потом число.'
  ro.a1.unit04.lesson01.teach.ora_doua:
    title: Два часа
    gloss: два часа
    note: Здесь числительное принимает женскую форму *două* в согласовании с существительным женского рода *ora*. Полная схема на следующей карточке.
  ro.a1.unit04.lesson01.teach.ora_gender_note:
    title: 'Настоящее исключение: unu остаётся unu'
    gloss: ora unu (не «ora una») / ora două (не «ora doi»)
    note: 'Числительные с женской формой обычно принимают её при существительных женского рода (*doi* → *două* при *ora*), но *unu* в обозначении времени — исключение: всегда *ora unu*, а не *ora una*, хотя *ora* женского рода.'
  ro.a1.unit04.lesson01.teach.ora_trei:
    title: Три часа
    gloss: три часа
    note: Trei вообще не меняется по роду, в отличие от unu/una или doi/două. Одной трудностью меньше.
  ro.a1.unit04.lesson01.teach.jumatate:
    title: Половина
    gloss: половина
    note: 'Используется с și (и) для «половина такого-то»: X și jumătate.'
    example_gloss: Половина второго.
  ro.a1.unit04.lesson01.teach.ora_unu_jumatate:
    title: Половина второго
    gloss: Половина второго.
    note: 'Буквально «час и половина»: к уже прошедшему часу прибавляется половина. Это не то же, что русское «половина второго», где счёт идёт к следующему часу.'
  ro.a1.unit04.lesson01.teach.cat_e_ora:
    title: Спросить, который час
    gloss: Который час?
    note: 'Обычный способ спросить время: cât (сколько, родственное слову câți из Урока 2) + este + ora (час).'
  ro.a1.unit04.lesson02.teach.sfert:
    title: Четверть
    gloss: четверть
    note: Четверть часа — 15 минут. С și (и) или fără (без) обозначает «четверть после» или «без четверти».
    example_gloss: Четверть второго.
  ro.a1.unit04.lesson02.teach.sfert_rule:
    title: și и fără с четвертью или половиной
    gloss: și un sfert = +15 минут · fără un sfert = −15 минут
    note: '*Și* (и) прибавляет минуты к только что прошедшему часу, а *fără* (без) отсчитывает минуты назад от ещё не наступившего часа. Как и в русском «без четверти три», здесь используется «без».'
  ro.a1.unit04.lesson02.teach.ora_doua_sfert:
    title: Четверть третьего
    gloss: Четверть третьего.
    note: Ora două (2:00) плюс și un sfert (+15 минут) = 2:15.
  ro.a1.unit04.lesson02.teach.fara:
    title: Без
    gloss: без
    note: Отсчитывает минуты назад от СЛЕДУЮЩЕГО часа, как и русское «без» в выражении «без четверти три».
    example_gloss: Без четверти три.
  ro.a1.unit04.lesson02.teach.ora_trei_fara_sfert:
    title: Без четверти три
    gloss: Без четверти три.
    note: Ora trei (3:00) минус fără un sfert (−15 минут) = 2:45. Румынский называет время по часу, к которому идёт отсчёт, а не по часу, который только прошёл.
  ro.a1.unit04.lesson02.teach.la_ce_ora:
    title: Спросить, в котором часу
    gloss: Во сколько?
    note: La (в) + ce (какой) + oră (час в неопределённой форме, а не ora). Обычный способ спросить, когда что-то происходит.
  ro.a1.unit04.lesson02.teach.la_ora_noua:
    title: Сказать, когда что-то происходит
    gloss: В девять часов.
    note: La (в) + ora (час в определённой форме) + число. Так отвечают на вопрос «La ce oră?».
  ro.a1.unit04.lesson02.teach.tarziu:
    title: С опозданием
    gloss: поздно
    note: Частая и полезная реакция, когда смотришь на время.
    example_gloss: Уже поздно!
  ro.a1.unit04.lesson03.teach.cand:
    title: 'Напоминание: când'
    gloss: когда?
    note: Când уже встречалось в Уроке 3, когда спрашивали, когда состоится событие. Здесь оно снова служит для вопроса, когда что-то начинается.
  ro.a1.unit04.lesson03.teach.zi_parts:
    title: Части суток
    gloss: утром / днём (после полудня) / вечером / ночью
    note: 'Каждое из этих слов — существительное в определённой форме, употреблённое как обстоятельство. Предлог не нужен: по-румынски просто говорят «утром», «вечером».'
    example_gloss:
    - Занятие проходит утром.
    - Занятие проходит днём.
    - Михай работает вечером.
    - Ана спит ночью.
  ro.a1.unit04.lesson03.teach.cursul:
    title: Занятие
    gloss: занятие / курс
    note: Определённая форма слова curs (занятие, курс). Здесь это занятие Аны и Михая по румынскому.
    example_gloss: Занятие начинается в девять часов.
  ro.a1.unit04.lesson03.teach.incepe:
    title: Начинается
    gloss: начинается
    note: 'Форма настоящего времени для он, она, оно: подходит любому подлежащему в единственном числе, кроме «я» и «ты», например cursul (занятие).'
    example_gloss: Занятие начинается утром.
  ro.a1.unit04.lesson03.teach.cand_incepe_cursul:
    title: Спросить, когда начинается занятие
    gloss: Когда начинается занятие?
    note: 'Соединяет când с новыми словами урока: începe и cursul.'
  ro.a1.unit04.lesson03.teach.raspuns_curs:
    title: Сказать, когда начинается занятие
    gloss: Занятие начинается в девять часов утра.
    note: Обстоятельство времени суток (dimineața) ставится в конце через запятую, так же как в Уроке 3 дата добавлялась после дня недели.
  ro.a1.unit04.lesson03.teach.line01:
    title: Спросить, когда начинается занятие
    gloss: Ана спрашивает Михая, когда начинается занятие.
    note: 'Простой нейтральный вопрос: este и începe не меняются в зависимости от tu или dumneavoastră.'
  ro.a1.unit04.lesson03.teach.line02:
    title: Назвать время
    gloss: Михай говорит, что занятие начинается в девять утра.
    note: Михай использует именно ту модель с временем и частью суток, которую мы изучили на этом уроке.
  ro.a1.unit04.lesson03.teach.line03:
    title: Ответить и попрощаться
    gloss: Ана благодарит его и прощается.
    note: La revedere, которое мы выучили в Уроке 1, завершает разговор так же, как всегда.
  ro.a1.unit04.lesson03.teach.line04:
    title: Завершить встречу
    gloss: Михай тоже прощается, называя Ану по имени.
    note: Повторить la revedere и добавить имя собеседника — естественный и дружелюбный способ закончить разговор.
