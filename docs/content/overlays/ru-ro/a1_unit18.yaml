answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (casă, apartament, cameră, dormitor, bucătărie, baie, fereastră) is used only in person-invariant third-person statements ("Ana are...", "Mihai are...", "Unde este baia?", "Casa mea este mare"). No new tu/dumneavoastră form is introduced this unit; Ana and Mihai keep their existing formal register with each other in the dialogue's greeting lines.
course:
  title: Румынский язык A1
  description: 'Описываем простое жильё по-румынски: Casă (дом), Apartament (квартира), Cameră (комната), Dormitor (спальня), Bucătărie (кухня), Baie (ванная) и Fereastră (окно). Михай приходит в гости к Ане, и они рассказывают, кто где живёт.'
units:
  ro.a1.unit18.housing:
    title: Жильё
lessons:
  ro.a1.unit18.lesson01.casa_anei:
    title: Дом Аны
  ro.a1.unit18.lesson02.apartamentul_lui_mihai:
    title: Квартира Михая
  ro.a1.unit18.lesson03.vizita_la_ana:
    title: В гостях у Аны
teaching:
  ro.a1.unit18.lesson01.teach.reminder_ana_mare:
    title: 'Повторение: Ana, mare'
    gloss: Ana (имя) · mare (большой)
    note: Ana — имя героини, знакомое с первого урока; *mare* встречалось в уроках 5 и 14. В этом уроке оба слова используются, чтобы описать её дом.
  ro.a1.unit18.lesson01.teach.reminder_articole_trei:
    title: 'Повторение: un, o, și, trei'
    gloss: un/o (один, одна — неопределённый артикль) · și (и) · trei (три)
    note: '*Un*, *o* и *și* известны из урока 5; *trei* — из счёта в уроке 2. В этом уроке все четыре слова помогают считать и описывать комнаты.'
  ro.a1.unit18.lesson01.teach.are_vocab:
    title: Имеет
    gloss: Are (он/она имеет, у него/неё есть)
    note: 'Новая форма глагола *a avea* (иметь): ты уже знаешь *am* (у меня есть, уроки 2 и 5) и *aveți* (у вас есть, вежливая форма). *Are* — форма 3-го лица той же глагола; она показывает, что есть у кого-то или у чего-то.'
  ro.a1.unit18.lesson01.teach.casa_vocab:
    title: Дом
    gloss: Casă (дом)
    note: Место, где человек живёт.
    example_gloss:
    - У Аны большой дом.
  ro.a1.unit18.lesson01.teach.camera_vocab:
    title: Комната
    gloss: Cameră (комната)
    note: Общее слово для комнаты в жилище.
    example_gloss:
    - У Аны большая комната.
  ro.a1.unit18.lesson01.teach.camere_plural:
    title: Cameră → camere
    gloss: cameră (комната) · camere (комнаты)
    note: Множественное число от *cameră* — *camere*; его используют, когда комнат больше одной.
  ro.a1.unit18.lesson01.teach.dormitor_vocab:
    title: Спальня
    gloss: Dormitor (спальня)
    note: Комната, где спят.
    example_gloss:
    - У Аны есть спальня.
  ro.a1.unit18.lesson01.teach.bucatarie_vocab:
    title: Кухня
    gloss: Bucătărie (кухня)
    note: Комната, где готовят еду.
    example_gloss:
    - У Аны есть кухня.
  ro.a1.unit18.lesson01.teach.baie_vocab:
    title: Ванная
    gloss: Baie (ванная)
    note: Комната с ванной или душем и туалетом.
    example_gloss:
    - У Аны есть ванная.
  ro.a1.unit18.lesson01.teach.casa_mare_phrase:
    title: 'У Аны большой дом. В нём три комнаты: спальня, кухня и ванная.'
    gloss: 'Ana are o casă mare. Casa are trei camere: un dormitor, o bucătărie și o baie.'
    note: 'Все слова здесь уже изучены или только что введены; из них составлены два новых предложения о доме Аны. *Casa* — определённая форма от *casă*, «этот дом»: у существительных женского рода на -ă окончание меняется на -a, как в *banca* (банк) в уроке 8.'
  ro.a1.unit18.lesson02.teach.reminder_mihai_mic:
    title: 'Повторение: Mihai, mic'
    gloss: Mihai (имя) · mic (маленький)
    note: Mihai — имя героя, знакомое с первого урока; *mic* встречалось в уроке 14. В этом уроке оба слова используются, чтобы описать его квартиру.
  ro.a1.unit18.lesson02.teach.reminder_unde_este_doua:
    title: 'Повторение: unde, este, două'
    gloss: unde (где) · este (есть, находится) · două (два, женский род)
    note: '*Unde* и *este* известны из уроков 8 и 9; *două* — женская форма числа «два» из урока 2. В этом уроке все три слова помогают спрашивать о комнатах и считать их.'
  ro.a1.unit18.lesson02.teach.apartament_vocab:
    title: Квартира
    gloss: Apartament (квартира)
    note: Жильё Михая — поменьше, чем дом Аны.
    example_gloss:
    - У Михая маленькая квартира.
  ro.a1.unit18.lesson02.teach.fereastra_vocab:
    title: Окно
    gloss: Fereastră (окно)
    note: '*Apartamentul* — определённая форма от *apartament*, «эта квартира»: у существительных среднего рода на согласный добавляется -ul, как в *magazinul* (магазин) в уроке 8 (а *casă* женского рода получает -a: *casa*).'
    example_gloss:
    - В квартире большое окно.
  ro.a1.unit18.lesson02.teach.apartament_mic_phrase:
    title: 'У Михая маленькая квартира. В ней две комнаты: спальня и кухня.'
    gloss: 'Mihai are un apartament mic. Apartamentul are două camere: un dormitor și o bucătărie.'
    note: Все слова здесь уже изучены или только что введены; из них составлены два новых предложения о квартире Михая.
  ro.a1.unit18.lesson02.teach.unde_este_baia_phrase:
    title: Где ванная?
    gloss: Unde este baia? (Где ванная?)
    note: '*Baia* — определённая форма от *baie*, «ванная». Полезный вопрос, когда приходишь в гости.'
  ro.a1.unit18.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Повторение: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (привет) · Ce mai faceți? (как дела? — вежливо) · Bine, mulțumesc (хорошо, спасибо)
    note: Всё это из приветствия в уроке 1; здесь оно открывает диалог этого урока.
  ro.a1.unit18.lesson03.teach.reminder_la_revedere_mea_aproape_am:
    title: 'Повторение: La revedere, Mea, Aproape, Am'
    gloss: La revedere (до свидания) · Mea (моя, женский род) · Aproape (рядом, близко) · Am (у меня есть)
    note: '*La revedere* — из урока 1; *mea* — из *Mama mea* в уроке 5; *aproape* — из ответов на *Unde este...?* в уроках 8 и 9; *am* — из уроков 2 и 5. Все эти слова повторяются в диалоге о визите в гости.'
  ro.a1.unit18.lesson03.teach.line01:
    title: Поздоровайся с Аной и спроси, как у неё дела
    gloss: Михай здоровается с Аной и спрашивает, как у неё дела.
    note: Снова используется приветствие *Ce mai faceți?* из урока 1.
  ro.a1.unit18.lesson03.teach.line02:
    title: Ответь и опиши свой дом
    gloss: Ана отвечает, а потом говорит Михаю, что её дом большой и в нём три комнаты.
    note: Сочетает *Bine, mulțumesc* из урока 1 с фразой из первого занятия этого урока.
  ro.a1.unit18.lesson03.teach.line03:
    title: Спроси, где ванная
    gloss: Михай спрашивает Ану, где ванная.
    note: Почти точно повторяет фразу из второго занятия этого урока.
  ro.a1.unit18.lesson03.teach.line04:
    title: Ответь, где ванная
    gloss: Ана говорит, что она рядом.
    note: Соединяет *baia* и *aproape* — тот же образец ответа на вопрос «где...?», что уже был в уроках 8 и 9.
  ro.a1.unit18.lesson03.teach.line05:
    title: Опиши свою квартиру и попрощайся
    gloss: Михай говорит, что у него маленькая квартира из двух комнат, и прощается.
    note: Сочетает фразу из второго занятия этого урока с прощанием из урока 1.
  ro.a1.unit18.lesson03.teach.line06:
    title: Попрощайся
    gloss: Ана прощается.
    note: Та же завершающая фраза, которой заканчивался диалог в каждом предыдущем уроке.
