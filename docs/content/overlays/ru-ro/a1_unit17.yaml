teaching:
  ro.a1.unit17.lesson01.teach.reminder_este_la_mihai:
    title: 'Повторение: este, la, Mihai'
    gloss: este (есть, является) · la (в, на) · Mihai (имя)
    note: Este — из разделов 3, 4 и 8; la — из фразы *la ora nouă* (в девять часов) в разделе 4; Mihai — имя героя, знакомое с самого первого раздела. В этом разделе все три слова используются, чтобы рассказать о его работе.
  ro.a1.unit17.lesson01.teach.reminder_lucrez_lucreaza:
    title: 'Повторение: lucrez, lucrează'
    gloss: lucrez (я работаю) · lucrează (он/она работает)
    note: Обе формы — из распорядка дня в разделе 10 (*Lucrez seara.*). Здесь они нужны, чтобы говорить о профессии, а не о времени суток.
  ro.a1.unit17.lesson01.teach.inginer_vocab:
    title: Инженер
    gloss: Inginer (инженер)
    note: Мужской род. В этом разделе слово использует только Mihai (*Sunt inginer*), поэтому женская форма пока не нужна.
    example_gloss:
    - Mihai — инженер.
  ro.a1.unit17.lesson01.teach.birou_vocab:
    title: Офис
    gloss: Birou (офис)
    note: Место, где работает Mihai. Используется с уже знакомым предлогом *la* (в, на) из раздела 4.
    example_gloss:
    - Он работает в офисе.
  ro.a1.unit17.lesson01.teach.mihai_este_inginer_lucreaza_la_birou_phrase:
    title: Mihai — инженер. Он работает в офисе.
    gloss: Mihai este inginer. Lucrează la birou.
    note: Все слова здесь уже знакомы или только что появились; из них составлены два новых предложения о работе Mihai.
  ro.a1.unit17.lesson02.teach.reminder_sunt_unde_ana:
    title: 'Повторение: sunt, unde, Ana'
    gloss: sunt (я есть, я) · unde (где) · Ana (имя)
    note: Sunt — из раздела 16 (*Sunt bolnav*); unde — из разделов 7 и 8 (*Unde pot să cumpăr...?*, *Unde este...?*); Ana — имя героини, знакомое с первого раздела. Здесь все три слова нужны, чтобы рассказать о работе Ana.
  ro.a1.unit17.lesson02.teach.profesoara_vocab:
    title: Учительница
    gloss: Profesoară (учительница)
    note: Женский род. В этом разделе слово использует только Ana (*Sunt profesoară*), поэтому мужская форма пока не нужна.
    example_gloss:
    - Я учительница.
  ro.a1.unit17.lesson02.teach.scoala_vocab:
    title: Школа
    gloss: Școală (школа)
    note: Место, где работает Ana. *La* употребляется так же, как в *la birou*.
    example_gloss:
    - Я работаю в школе.
  ro.a1.unit17.lesson02.teach.sunt_profesoara_lucrez_la_scoala_phrase:
    title: Я учительница. Я работаю в школе.
    gloss: Sunt profesoară. Lucrez la școală.
    note: 'Ana рассказывает о своей работе: два новых слова этого урока и уже знакомое *sunt* из раздела 16.'
  ro.a1.unit17.lesson02.teach.unde_lucrati_phrase:
    title: Где ты работаешь?
    gloss: Unde lucrați? (Где вы работаете?, вежливо)
    note: '*Lucrați* — вежливая форма «вы работаете» с тем же окончанием -ați/-eți, что уже встречалось в *aveți* и *faceți*. Подходит, чтобы спросить о работе любого человека.'
  ro.a1.unit17.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Повторение: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (привет) · Ce mai faceți? (как поживаете?, вежливо) · Bine, mulțumesc (хорошо, спасибо)
    note: Всё это из приветствия в разделе 1; здесь оно открывает диалог.
  ro.a1.unit17.lesson03.teach.reminder_si_dumneavoastra_la_revedere:
    title: 'Повторение: Și dumneavoastră?, La revedere'
    gloss: Și dumneavoastră? (а вы?, вежливо) · La revedere (до свидания)
    note: Обе фразы из раздела 1; здесь они служат встречным вопросом и завершением разговора.
  ro.a1.unit17.lesson03.teach.line01:
    title: Поздороваться и спросить, как дела
    gloss: Ana здоровается с Mihai и спрашивает, как у него дела.
    note: Здесь снова звучит приветствие *Ce mai faceți?* из раздела 1.
  ro.a1.unit17.lesson03.teach.line02:
    title: Ответить и спросить, где она работает
    gloss: Mihai отвечает, а затем спрашивает Ana, где она работает.
    note: Фраза *Bine, mulțumesc* из раздела 1 соединяется с новой *Unde lucrați?*.
  ro.a1.unit17.lesson03.teach.line03:
    title: Назвать профессию и место работы и спросить в ответ
    gloss: Ana говорит, что работает в школе учительницей, и задаёт Mihai тот же вопрос.
    note: Фраза из второго урока этого раздела соединяется с *Și dumneavoastră?* из раздела 1.
  ro.a1.unit17.lesson03.teach.line04:
    title: Назвать профессию и место работы
    gloss: Mihai говорит, что работает в офисе инженером.
    note: Почти дословно повторяется фраза из первого урока этого раздела.
  ro.a1.unit17.lesson03.teach.line05:
    title: Завершить разговор
    gloss: Ana прощается.
    note: Так заканчивался диалог в каждом из прошлых разделов.
  ro.a1.unit17.lesson03.teach.line06:
    title: Попрощаться
    gloss: Mihai прощается.
    note: Так заканчивался диалог в каждом из прошлых разделов.
