answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Румынский язык A1
  description: 'Румынский для начинающих: разговор о домашних и обычных животных. Как их назвать, как о них заботиться (гулять, кормить, играть), как сказать, что ты любишь животных, даже если их у тебя нет, и как образуется регулярное множественное число.'
units:
  ro.a1.unit32.animale:
    title: Животные и питомцы
lessons:
  ro.a1.unit32.lesson01.caine_pisica_peste_si:
    title: Собака, кот, рыба и птица
  ro.a1.unit32.lesson02.ingrijirea_unui_animal_de:
    title: Уход за питомцем
  ro.a1.unit32.lesson03.a_iubi_animalele:
    title: Любовь к животным
  ro.a1.unit32.lesson04.mihai_o_intreaba_pe:
    title: Михай спрашивает о собаке Ани
  ro.a1.unit32.lesson05.mihai_elena_si_andrei:
    title: Михай, Елена и Андрей о животных
  ro.a1.unit32.lesson06.nina_si_pasarea_ei:
    title: Птица Нины
teaching:
  ro.a1.unit32.lesson01.teach.animalul_un_animal:
    title: Животное, питомец
    gloss: животное / домашнее животное
    note: '*Animal* — общее слово «животное»; *animal de companie* (буквально «животное-компаньон») означает именно домашнего питомца. Множественное число — *animale* (*un animal*, *două animale*).'
    example_gloss:
    - Собака — это животное.
    - Собака — ещё и домашний питомец.
  ro.a1.unit32.lesson01.teach.cainele_pisica:
    title: Собака и кот
    gloss: собака / кот
    example_gloss:
    - У Ани есть собака.
    - У Андрея есть кошка.
  ro.a1.unit32.lesson01.teach.pestele_pasarea:
    title: Рыба и птица
    gloss: рыба / птица
    example_gloss:
    - У дедушки есть рыба.
    - У Нины есть птица.
  ro.a1.unit32.lesson01.teach.ai_un_animal:
    title: У тебя есть питомец?
    gloss: У тебя есть питомец?
    note: 'Тот же вопрос *Ai ...?*, который ты уже знаешь: *a avea* («иметь») + существительное.'
  ro.a1.unit32.lesson01.teach.da_am_un:
    title: Да, у меня есть собака
    gloss: Да, у меня есть собака.
    note: Простой утвердительный ответ с новой лексикой этого раздела.
  ro.a1.unit32.lesson01.teach.nu_nu_am:
    title: Нет, у меня нет питомца
    gloss: Нет, у меня нет питомца.
    note: После *nu am* слово *niciun* («ни одного») отрицает существительное; см. грамматическую заметку.
  ro.a1.unit32.lesson01.teach.la_negatie_nu:
    title: 'Nu am: без артикля'
    gloss: 'После nu am не ставят un или o: Nu am timp, nu am niciun animal de companie.'
    note: 'Это та же модель, что и в *Nu am timp*: грамматика не новая, просто применяется к новому существительному.'
  ro.a1.unit32.lesson02.teach.a_scoate_la:
    title: Выгуливать (животное)
    gloss: выгуливать (животное)
    note: '*A scoate la plimbare* — устойчивое выражение; см. грамматическую заметку.'
    example_gloss: Я выгуливаю собаку каждый день.
  ro.a1.unit32.lesson02.teach.verbul_se_schimba:
    title: Глагол изменяется по лицам
    gloss: 'Глагол изменяется по лицам: eu scot, tu scoți, el scoate câinele la plimbare (я гуляю, ты гуляешь, он гуляет с собакой).'
    note: 'Румынские глаголы меняют окончание в зависимости от лица, поэтому *a scoate la plimbare* спрягается как один глагол: *scot*, *scoți*, *scoate*.'
  ro.a1.unit32.lesson02.teach.a_da_de:
    title: Кормить
    gloss: кормить
    example_gloss: Я кормлю кошку каждый день.
  ro.a1.unit32.lesson02.teach.a_se_juca:
    title: Играть с
    gloss: играть с
    example_gloss: Андрей играет со своей кошкой.
  ro.a1.unit32.lesson02.teach.scot_cainele_la:
    title: Я выгуливаю собаку каждый день
    gloss: Я выгуливаю собаку каждый день.
    note: Соединяет *a scoate la plimbare* с *în fiecare zi* («каждый день»), которое уже встречалось раньше.
  ro.a1.unit32.lesson02.teach.dau_de_mancare:
    title: Я кормлю кота каждый день
    gloss: Я кормлю кота каждый день.
    note: 'Сочетание *a da de mâncare* с *în fiecare zi*; название животного стоит в дативе: *pisicii*.'
  ro.a1.unit32.lesson03.teach.plural_caine_caini:
    title: 'Plural: câine → câini'
    gloss: 'Множественное число: câine → câini, animal → animale, pisică → pisici.'
    note: Основная модель образования множественного числа в румынском; здесь она впервые показана на примере названий животных.
  ro.a1.unit32.lesson03.teach.caini_pisici:
    title: Собаки и кошки
    gloss: собаки / коты
    example_gloss:
    - Михай любит собак.
    - Елена любит кошек.
  ro.a1.unit32.lesson03.teach.pesti_pasari:
    title: Рыбы и птицы
    gloss: рыбы / птицы
    example_gloss:
    - Я обожаю рыбок.
    - Дедушка обожает птиц.
  ro.a1.unit32.lesson03.teach.iubesc_animalele:
    title: Я обожаю животных
    gloss: Я обожаю животных.
    note: 'Глагол *a iubi* («любить») присоединяет дополнение без предлога: *Iubesc animalele*; артикль *-le* показывает, что речь о животных вообще.'
  ro.a1.unit32.lesson03.teach.elena_iubeste_pisicile:
    title: Елена любит кошек, но у неё нет домашнего животного
    gloss: Елена любит кошек, но у неё нет домашнего животного.
    note: 'Готовит противопоставление, на котором построен текст для чтения: любить животных и иметь питомца.'
  ro.a1.unit32.lesson04.teach.mihai_ai_un:
    title: Михай спрашивает о домашнем животном
    gloss: 'Михай: У тебя есть домашнее животное, Ана?'
  ro.a1.unit32.lesson04.teach.ana_da_am:
    title: У Аны есть собака
    gloss: 'Ана: Да, у меня есть собака.'
  ro.a1.unit32.lesson04.teach.mihai_cum_arata:
    title: Михай спрашивает, как она выглядит
    gloss: 'Михай: Как он выглядит?'
    note: Снова вопрос *Cum arată ...?* из урока о внешности, теперь о животном.
  ro.a1.unit32.lesson04.teach.ana_are_blana:
    title: Ана описывает свою собаку
    gloss: 'Ана: У него коричневая шерсть, и он маленький.'
    note: Слова о цвете волос и размере из раздела о внешности, но теперь они описывают шерсть животного, а не волосы человека.
  ro.a1.unit32.lesson04.teach.pentru_un_animal:
    title: El и ea для животных
    gloss: 'Для животного ты используешь el или ea в зависимости от рода: câinele — el, pisica — ea.'
    note: Раньше в этом курсе *el* и *ea* относились только к людям; теперь они используются и для животных, в зависимости от рода существительного.
  ro.a1.unit32.lesson04.teach.mihai_il_scoti:
    title: Михай спрашивает о прогулках
    gloss: 'Михай: Ты гуляешь с ним каждый день?'
  ro.a1.unit32.lesson04.teach.ana_da_il:
    title: Ана рассказывает о своём распорядке
    gloss: 'Ана: Да, я гуляю с ним каждый день и кормлю его.'
  ro.a1.unit32.lesson05.teach.mihai_si_elena:
    title: Михай, Елена и Андрей о животных
    gloss: 'Михай и Елена оба любят животных, но ни у одного из них нет домашнего питомца. Михай любит собак, а Елена любит кошек. А вот у Андрея есть домашнее животное: кошка. Он часто играет со своей кошкой и кормит её каждый день. А у тебя есть домашнее животное?'
    note: Противопоставляет любовь к животным и наличие собственного питомца — в этом коммуникативный смысл всего раздела.
    glosses:
      iubesc: обожать
      amândoi: оба
      animalele: животные
      doi: оба
      companie: питомец
      câinii: собаки
      pisicile: коты
      pisică: кот
      joacă: играет
      dă: даёт
      fiecare: каждый
      mâncare: еда
  ro.a1.unit32.lesson05.teach.andrei_se_joaca:
    title: Андрей часто играет со своей кошкой
    gloss: Андрей часто играет со своей кошкой.
    note: '*Des* («часто») — слово частоты из урока о хобби; *a se juca cu* («играть с») — возвратный глагол.'
  ro.a1.unit32.lesson05.teach.iubesc_cainii_nu:
    title: Я обожаю собак. У меня нет питомца.
    gloss: Я обожаю собак. У меня нет питомца.
    note: Образец ответа из двух предложений, который можно использовать в письменном задании раздела.
  ro.a1.unit32.lesson06.teach.ana_nina_ai:
    title: Ана спрашивает Нину
    gloss: 'Ана: Нина, а у тебя тоже есть домашнее животное?'
  ro.a1.unit32.lesson06.teach.nina_da_am:
    title: У Nina есть птица по имени Pico
    gloss: 'Nina: Да, у меня есть птица. Её зовут Pico.'
    note: '*O cheamă* («её зовут») — снова глагол *a chema*, которым называют имя; птица — женского рода, поэтому местоимение *o*.'
  ro.a1.unit32.lesson06.teach.mihai_ce_frumos:
    title: Михай реагирует
    gloss: 'Михай: Как здорово! Что ты делаешь с ней каждый день?'
  ro.a1.unit32.lesson06.teach.nina_ii_dau:
    title: Nina кормит птицу каждый день
    gloss: 'Nina: Я кормлю его каждый день.'
  ro.a1.unit32.lesson06.teach.mihai_iubesc_si:
    title: Михай тоже любит птиц
    gloss: 'Михай: Я тоже люблю птиц.'
  ro.a1.unit32.lesson06.teach.ana_ce_frumos:
    title: Ана завершает разговор
    gloss: 'Ана: Как здорово, что мы все трое любим животных!'
    note: Подводит итог всем фактам о животных, которые рассказали три героя раздела.
