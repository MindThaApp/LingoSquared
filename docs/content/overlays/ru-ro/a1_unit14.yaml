answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (mic/mică, mai, decât) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing polite register with each other, matching every earlier unit; no new second-person form is introduced here (unlike unit13's Vă place...?).
course:
  title: Румынский язык A1
  description: 'Сравниваем знакомые вещи по-румынски: Mare («большой»), Mic/Mică («маленький») и конструкция Mai ... decât («более ... чем»). Ana и Mihai сравнивают размер своего кофе, чая и хлеба.'
units:
  ro.a1.unit14.comparisons:
    title: Сравнения
lessons:
  ro.a1.unit14.lesson01.mare_mic:
    title: Большой, маленький
  ro.a1.unit14.lesson02.mai_mare_mai_mica:
    title: Больше и меньше
  ro.a1.unit14.lesson03.cafeaua_mai_mare:
    title: Что больше?
teaching:
  ro.a1.unit14.lesson01.teach.reminder_mare:
    title: 'Напоминание: mare'
    gloss: mare (большой)
    note: 'Уже встречалось в Unit 3 («literă mare», заглавная буква) и в Unit 5 («o familie mare», большая семья) — здесь у него появляется пара для сравнения: *mic/mică*.'
  ro.a1.unit14.lesson01.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Напоминание: cafeaua, ceaiul, pâinea, cafea, ceai'
    gloss: cafeaua (кофе) · ceaiul (чай) · pâinea (хлеб) · cafea (кофе) · ceai (чай)
    note: 'Всё из Unit 6 и Unit 13: в этом уроке определённые формы — это предметы, которые сравниваются по размеру, а неопределённые формы снова встретятся в упражнении на соответствия.'
  ro.a1.unit14.lesson01.teach.mic_mica_vocab:
    title: Маленький
    gloss: Mic (маленький, м. и ср. р.) · Mică (маленькая, ж. р.)
    note: 'Румынские прилагательные согласуются с существительным: *ceai* (чай) берёт форму мужского и среднего рода *mic*, а *cafea* (кофе) и *pâine* (хлеб) — женского рода и берут *mică*. У *mare* (большой) форма в единственном числе одна и та же для мужского и женского рода, поэтому такого деления не требовалось.'
    example_gloss:
    - Чай маленький.
    - Кофе маленький.
  ro.a1.unit14.lesson01.teach.ceaiul_e_mic_phrase:
    title: Чай маленький
    gloss: Ceaiul e mic. (Чай маленький.)
    note: '*Ceaiul* — среднего рода, поэтому берёт форму *mic* (для мужского и среднего рода).'
  ro.a1.unit14.lesson01.teach.cafeaua_e_mica_phrase:
    title: Кофе маленький
    gloss: Cafeaua e mică. (Кофе маленький.)
    note: '*Cafeaua* — женского рода, поэтому берёт женскую форму *mică*.'
  ro.a1.unit14.lesson01.teach.painea_e_mica_phrase:
    title: Хлеб маленький
    gloss: Pâinea e mică. (Хлеб маленький.)
    note: '*Pâinea* тоже женского рода, поэтому берёт *mică*, как и *cafeaua*.'
  ro.a1.unit14.lesson02.teach.reminder_mare_mic_mica:
    title: 'Напоминание: Mare, Mic, Mică'
    gloss: Mare (большой) · Mic (маленький, м. и ср. р.) · Mică (маленькая, ж. р.)
    note: Всё из первого урока этого раздела — теперь у этих слов появляется сравнительная форма.
  ro.a1.unit14.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Напоминание: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (кофе) · ceaiul (чай) · pâinea (хлеб)
    note: Всё из Unit 13, здесь снова используется как предметы для сравнения.
  ro.a1.unit14.lesson02.teach.mai_vocab:
    title: Более / -ее
    gloss: Mai (более / -ее, сравнительная степень)
    note: 'Это не месяц *mai* (май, Unit 3). Это то же маленькое слово, что и в «Ce mai faceți?» (Unit 1), но здесь оно выполняет другую роль — частицы сравнения: *mai* перед прилагательным значит «более ___» или «___-ее»; так в румынском обычно образуется сравнительная степень.'
    example_gloss:
    - Кофе больше.
  ro.a1.unit14.lesson02.teach.mai_mare_phrase:
    title: Кофе больше
    gloss: Cafeaua e mai mare. (Кофе больше.)
    note: '*Mai* + прилагательное — больше ничего менять не нужно.'
  ro.a1.unit14.lesson02.teach.decat_vocab:
    title: Чем
    gloss: Decât (чем)
    note: 'Завершает сравнение: *mai* + прилагательное + *decât* + второй предмет сравнения.'
    example_gloss:
    - Кофе больше, чем чай.
  ro.a1.unit14.lesson02.teach.mai_mare_decat_phrase:
    title: Кофе больше, чем чай
    gloss: Cafeaua e mai mare decât ceaiul. (Кофе больше, чем чай.)
    note: 'Полная модель сравнения: [предмет] + e + mai + [прилагательное] + decât + [второй предмет].'
  ro.a1.unit14.lesson02.teach.mai_mica_decat_phrase:
    title: Хлеб меньше, чем кофе
    gloss: Pâinea e mai mică decât cafeaua. (Хлеб меньше, чем кофе.)
    note: Та же модель с *mică* — женской формой слова «маленький» из первого урока этого раздела.
  ro.a1.unit14.lesson03.teach.reminder_mai_decat_mare_mic_mica:
    title: 'Повторение: Mai, Decât, Mare, Mic, Mică'
    gloss: Mai (более, -ее) · Decât (чем) · Mare (большой) · Mic (маленький, муж./ср. р.) · Mică (маленькая, жен. р.)
    note: Всё это из уроков 1 и 2 этого раздела — здесь Ана и Михай используют эти слова вместе.
  ro.a1.unit14.lesson03.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Повторение: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (кофе) · ceaiul (чай) · pâinea (хлеб)
    note: Всё это из раздела 13 — три предмета, которые сравнивают Ана и Михай.
  ro.a1.unit14.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Повторение: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (привет) · mulțumesc (спасибо) · la revedere (до свидания) · Ana, Mihai (имена)
    note: Всё это уже встречалось в предыдущих разделах — те же дружелюбные начало и конец, что и в каждом диалоге курса.
  ro.a1.unit14.lesson03.teach.line01:
    title: Приветствие и вопрос о размере
    gloss: Михай здоровается с Аной и спрашивает, большой кофе или маленький.
    note: Здесь используется *mare sau mică* («большой или маленький») из этого раздела — вопрос с выбором по схеме «X или Y?», как *cafea sau ceai?* в разделе 13.
  ro.a1.unit14.lesson03.teach.line02:
    title: Описание размера обоих напитков
    gloss: Ана говорит, что кофе большой, а чай маленький.
    note: 'Это простое утверждение о размере, а не о предпочтениях: в диалоге не говорится, кто что любит или заказывает, а только то, какой напиток по размеру.'
  ro.a1.unit14.lesson03.teach.line03:
    title: Вопрос для подтверждения сравнения
    gloss: Михай спрашивает, больше ли кофе, чем чай.
    note: Два отдельных факта Аны (реплика 2) превращаются в прямое сравнение с *mai mare decât* — главной конструкцией этого раздела.
  ro.a1.unit14.lesson03.teach.line04:
    title: Подтверждение и добавление хлеба
    gloss: Ана соглашается и добавляет, что хлеб меньше, чем кофе.
    note: Снова *mai ... decât*, теперь с третьим предметом, *pâinea*, и формой *mai mică* («меньше»).
  ro.a1.unit14.lesson03.teach.line05:
    title: Согласие, благодарность и прощание
    gloss: Михай соглашается, что хлеб маленький, благодарит Ану и прощается.
    note: Тот же финал, которым заканчивался диалог в каждом предыдущем разделе.
  ro.a1.unit14.lesson03.teach.line06:
    title: Завершение разговора
    gloss: Ана тоже прощается и называет Михая по имени.
    note: Тот же дружелюбный финал, которым заканчивался диалог в каждом предыдущем разделе.
