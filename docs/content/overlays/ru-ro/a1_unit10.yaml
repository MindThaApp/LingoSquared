answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's new verbs are all first-person singular (mă trezesc, mănânc, beau, lucrez, merg, mă culc) and are register-neutral -- Romanian's first-person verb form is the same regardless of tu/dumneavoastră, and this unit introduces no second-person forms. Ana and Mihai's closing dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08/unit09.
course:
  title: Румынский язык A1
  description: 'Описание простого распорядка дня по-румынски: mă trezesc (я просыпаюсь), mănânc / beau (я ем / я пью), lucrez (я работаю), merg acasă (я иду домой) и mă culc (я ложусь спать). Продолжаем историю Аны и Михая: Ана расспрашивает Михая о его дне.'
units:
  ro.a1.unit10.routines:
    title: Распорядок дня
lessons:
  ro.a1.unit10.lesson01.dimineata:
    title: Утром
  ro.a1.unit10.lesson02.lucrez_merg_acasa:
    title: Я работаю, я иду домой
  ro.a1.unit10.lesson03.rutina_mihai:
    title: Распорядок дня Михая
teaching:
  ro.a1.unit10.lesson01.teach.reminder_dimineata_seara_noaptea_cafea_paine:
    title: 'Повторение: dimineața, seara, noaptea, cafea, pâine'
    gloss: dimineața (утром) · seara (вечером) · noaptea (ночью) · cafea (кофе) · pâine (хлеб)
    note: 'Всё это уже знакомо: dimineața/seara/noaptea с урока 4, cafea/pâine с урока 6. Теперь они соединяются в предложения о распорядке дня из этого урока.'
  ro.a1.unit10.lesson01.teach.ma_trezesc_vocab:
    title: Я просыпаюсь
    gloss: Mă trezesc (я просыпаюсь)
    note: '*Mă* — возвратное местоимение, которое уже встречалось в *mă numesc*/*mă cheamă*. Как и в русском («просыпаюсь» с частицей -сь), в румынском здесь возвратный глагол; буквально «я бужу себя».'
    example_gloss:
    - Я просыпаюсь утром.
  ro.a1.unit10.lesson01.teach.ma_trezesc_phrase:
    title: Я просыпаюсь утром
    gloss: Mă trezesc dimineața. (Я просыпаюсь утром.)
    note: Короткое законченное предложение — самое простое предложение о распорядке дня.
  ro.a1.unit10.lesson01.teach.mananc_vocab:
    title: Я ем
    gloss: Mănânc (я ем)
    note: 'Местоимение «я» не нужно: окончание румынского глагола уже показывает, кто говорит. Так же было с *vreau*, *cumpăr*, *aș dori*.'
    example_gloss:
    - Утром я ем хлеб.
  ro.a1.unit10.lesson01.teach.beau_vocab:
    title: Я пью
    gloss: Beau (я пью)
    note: Естественно сочетается с уже знакомыми напитками, например *cafea* и *ceai*.
    example_gloss:
    - Я пью кофе по утрам.
  ro.a1.unit10.lesson01.teach.mananc_beau_phrase:
    title: Утром я ем хлеб и пью кофе
    gloss: Mănânc pâine și beau cafea dimineața. (Утром я ем хлеб и пью кофе.)
    note: Два действия соединены союзом *și* (и), который уже встречался в Уроке 4 во фразе *ora unu și jumătate*.
  ro.a1.unit10.lesson02.teach.lucrez_vocab:
    title: Я работаю
    gloss: Lucrez (я работаю)
    note: Форма первого лица от *lucrează*, которую мы видели в Уроке 4, когда Михай рассказывал о своей вечерней работе.
    example_gloss:
    - Вечером я работаю.
  ro.a1.unit10.lesson02.teach.lucrez_phrase:
    title: Вечером я работаю
    gloss: Lucrez seara. (Вечером я работаю.)
    note: Короткое законченное высказывание о том, когда ты работаешь.
  ro.a1.unit10.lesson02.teach.merg_vocab:
    title: Я иду
    gloss: Merg (я иду)
    note: Форма первого лица от *mergeți*, повелительной формы, которую мы уже разбирали. Глагол тот же, лицо другое.
    example_gloss:
    - Я иду домой.
  ro.a1.unit10.lesson02.teach.acasa_vocab:
    title: Дом
    gloss: Acasă (домой)
    note: 'Употребляется без предлога: *merg acasă*, а не *merg la acasă*. В русском так же: «иду домой», а не «иду в домой».'
    example_gloss:
    - Ночью я иду домой.
  ro.a1.unit10.lesson02.teach.merg_acasa_phrase:
    title: Ночью я иду домой
    gloss: Merg acasă noaptea. (Ночью я иду домой.)
    note: Короткое законченное высказывание, естественный конец рабочего дня.
  ro.a1.unit10.lesson02.teach.lucrez_merg_phrase:
    title: Вечером я работаю, а ночью иду домой
    gloss: Lucrez seara și merg acasă noaptea. (Вечером я работаю, а ночью иду домой.)
    note: Оба высказывания этого урока соединены в одно предложение с помощью *și*.
  ro.a1.unit10.lesson03.teach.reminder_cursul_incepe_ora_apoi:
    title: 'Повторение: cursul, începe, la ora nouă, apoi'
    gloss: cursul (занятие) · începe (начинается) · la ora nouă (в девять часов) · apoi (потом)
    note: Cursul, începe и la ora nouă уже были в Уроке 4 (занятие Михая начинается в девять утра), а apoi — в Уроке 9. Здесь они складываются в рассказ Михая о своём распорядке.
  ro.a1.unit10.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Повторение: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (привет) · mulțumesc (спасибо) · la revedere (до свидания) · da (да) · Ana, Mihai (имена)
    note: Всё это уже встречалось в прошлых уроках. Здесь Ана спрашивает Михая о его дне.
  ro.a1.unit10.lesson03.teach.ma_culc_vocab:
    title: Я ложусь спать
    gloss: Mă culc (я ложусь спать)
    note: Ещё один возвратный глагол, как *mă trezesc*. Буквально «я укладываю себя».
    example_gloss:
    - Ночью я ложусь спать.
  ro.a1.unit10.lesson03.teach.ma_culc_phrase:
    title: Ночью я ложусь спать
    gloss: Mă culc noaptea. (Ночью я ложусь спать.)
    note: Естественный конец дня, замыкающий распорядок, начатый фразой *mă trezesc dimineața*.
  ro.a1.unit10.lesson03.teach.line01:
    title: Поприветствовать и спросить, когда начинается занятие
    gloss: Ана здоровается с Михаем и спрашивает, когда начинается его занятие.
    note: Повторяется вопрос о занятии Михая из Урока 4.
  ro.a1.unit10.lesson03.teach.line02:
    title: Ответить, во сколько занятие
    gloss: Михай говорит, что занятие начинается в девять утра.
    note: Тот же ответ, что Михай давал в Уроке 4, теперь как часть его распорядка дня.
  ro.a1.unit10.lesson03.teach.line03:
    title: Спросить про вечер
    gloss: 'Ана задаёт короткий уточняющий вопрос: «А вечером?»'
    note: Естественный краткий способ узнать больше о распорядке дня без нового вопросительного слова.
  ro.a1.unit10.lesson03.teach.line04:
    title: Рассказать об остальной части дня
    gloss: Михай говорит, что вечером работает, а потом ночью ложится спать.
    note: Здесь соединены *lucrez* и *mă culc* из этого урока с помощью *apoi*. Это согласуется с фактом из Урока 4, что Михай работает вечером.
  ro.a1.unit10.lesson03.teach.line05:
    title: Поблагодарить и проститься
    gloss: Ана говорит «Хорошо!», благодарит Михая и прощается.
    note: Такое же завершение с благодарностью было в диалогах Уроков 1, 8 и 9.
  ro.a1.unit10.lesson03.teach.line06:
    title: Закончить разговор
    gloss: Михай тоже прощается, называя Ану по имени.
    note: Такое же дружелюбное прощание завершало диалоги всех предыдущих уроков.
