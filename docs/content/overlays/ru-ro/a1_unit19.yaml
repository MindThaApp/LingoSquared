teaching:
  ro.a1.unit19.lesson01.teach.reminder_ana_este:
    title: 'Напоминание: Ana, Este, Și'
    gloss: Ana (имя) · Este (есть, является) · Și (и)
    note: Ana — имя героини, знакомое с первого урока; *este* — из темы мест в уроке 8; *și* — из урока 5. В этом уроке все три слова снова используются, чтобы описать сегодняшнюю погоду.
  ro.a1.unit19.lesson01.teach.reminder_astazi:
    title: 'Напоминание: Astăzi'
    gloss: Astăzi (сегодня)
    note: Из лексики дат урока 3. Здесь используется, чтобы говорить о сегодняшней погоде.
  ro.a1.unit19.lesson01.teach.vreme_vocab:
    title: Погода
    gloss: Vreme (погода)
    note: '*Vremea* — определённая форма от *vreme*, «погода». Существительные женского рода на -e принимают артикль -a, как *baie* → *baia* (ванная) в уроке 18.'
    example_gloss:
    - Какая погода?
  ro.a1.unit19.lesson01.teach.cum_este_vremea_phrase:
    title: Какая погода?
    gloss: Cum este vremea? (Какая погода?)
    note: Обычный способ спросить о погоде. Слово *cum* знакомо по урокам 1, 9 и 12.
  ro.a1.unit19.lesson01.teach.soare_vocab:
    title: Солнце / солнечно
    gloss: Soare (солнце / солнечно)
    note: 'Употребляется с *este*, чтобы описать солнечную погоду: *Este soare* буквально «есть солнце», то есть «солнечно».'
    example_gloss:
    - Сегодня солнечно.
  ro.a1.unit19.lesson01.teach.cald_vocab:
    title: Тепло / жарко
    gloss: Cald (тепло / жарко)
    note: 'Неизменяемое слово для погоды: в *Este cald* форма всегда одна и та же, без согласования.'
    example_gloss:
    - Сегодня тепло.
  ro.a1.unit19.lesson01.teach.astazi_soare_cald_phrase:
    title: Сегодня солнечно. Тепло.
    gloss: Astăzi este soare. Este cald.
    note: Все слова здесь уже были изучены или только что введены. Из них составлены два новых предложения о сегодняшней погоде.
  ro.a1.unit19.lesson02.teach.reminder_mihai_maine:
    title: 'Напоминание: Mihai, Mâine'
    gloss: Mihai (имя) · Mâine (завтра)
    note: Mihai — имя героя, знакомое с первого урока; *mâine* — из уроков 3 и 12. В этом уроке оба слова снова используются, чтобы описать прогноз на завтра.
  ro.a1.unit19.lesson02.teach.reminder_nu_mergem_la_parc:
    title: 'Напоминание: Nu, Mergem, La parc'
    gloss: Nu (нет / не) · Mergem (мы идём) · La parc (в парк)
    note: Всё это из лексики урока 11 о договорённостях. Здесь используется, чтобы решить, позволяет ли погода пойти в парк.
  ro.a1.unit19.lesson02.teach.ploua_vocab:
    title: Идёт дождь
    gloss: Plouă (идёт дождь)
    note: 'Безличная форма глагола: подлежащее не нужно, как и в *Este cald*.'
    example_gloss:
    - Завтра идёт дождь.
  ro.a1.unit19.lesson02.teach.vant_vocab:
    title: Ветер
    gloss: Vânt (ветер)
    note: 'Употребляется с *este* так же, как *soare*: *Este vânt*, «ветрено».'
    example_gloss:
    - Завтра ветрено.
  ro.a1.unit19.lesson02.teach.frig_vocab:
    title: Холодно
    gloss: Frig (холодно)
    note: 'Употребляется с *este*: *Este frig*, «холодно».'
    example_gloss:
    - Завтра холодно.
  ro.a1.unit19.lesson02.teach.maine_ploua_phrase:
    title: Завтра идёт дождь. Ветрено и холодно.
    gloss: Mâine plouă. Este vânt și este frig.
    note: Все слова здесь уже были изучены или только что введены. Из них составлен полный прогноз на завтра.
  ro.a1.unit19.lesson02.teach.nu_mergem_phrase:
    title: Завтра мы не идём в парк.
    gloss: Nu mergem la parc mâine. (Завтра мы не идём в парк.)
    note: План, зависящий от погоды, — к нему ведёт весь урок. Здесь используются *mergem* и *la parc* из урока 11, а перед ними стоит *nu*.
  ro.a1.unit19.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Напоминание: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (привет) · Ce mai faceți? (как дела, на «вы») · Bine, mulțumesc (хорошо, спасибо)
    note: Всё это из приветствия в начале урока 1. Здесь используется, чтобы начать диалог этого урока.
  ro.a1.unit19.lesson03.teach.reminder_sambata_la_revedere:
    title: 'Напоминание: Sâmbătă, La revedere'
    gloss: Sâmbătă (суббота) · La revedere (до свидания)
    note: '*Sâmbătă* встречалось в разделах 3, 11 и 12; *la revedere* — в разделе 1. Оба выражения повторяются в диалоге о планах на выходные.'
  ro.a1.unit19.lesson03.teach.line01:
    title: Поздороваться с Михаем и спросить, как у него дела
    gloss: Ана здоровается с Михаем и спрашивает, как у него дела.
    note: Повторяется приветствие *Ce mai faceți?* из раздела 1.
  ro.a1.unit19.lesson03.teach.line02:
    title: Ответить и спросить о погоде на завтра
    gloss: Михай отвечает, а потом спрашивает Ану, какая завтра будет погода.
    note: Соединяет *Bine, mulțumesc* из раздела 1 и фразу *Cum este vremea?* из первого урока этого раздела, к которой добавлено *mâine*.
  ro.a1.unit19.lesson03.teach.line03:
    title: Описать прогноз на завтра
    gloss: Ана говорит, что завтра будет дождь, ветер и холод.
    note: Точно повторяется фраза из второго урока этого раздела.
  ro.a1.unit19.lesson03.teach.line04:
    title: Предложить не идти в парк, а пойти в субботу
    gloss: Михай говорит, что завтра они не идут в парк, и предлагает пойти в субботу.
    note: Соединяет фразу из второго урока этого раздела с *mergem* из раздела 11 и *sâmbătă* из этого раздела.
  ro.a1.unit19.lesson03.teach.line05:
    title: Согласиться, отметив, что в субботу будет солнечно
    gloss: Ана говорит, что в субботу будет солнечно, и соглашается с планом.
    note: Соединяет *soare* с фразой согласия *Da, bine!* из раздела 11.
  ro.a1.unit19.lesson03.teach.line06:
    title: Попрощаться
    gloss: Михай прощается.
    note: Та же заключительная реплика, которой заканчивался диалог в каждом предыдущем разделе.
  ro.a1.unit19.lesson03.teach.line07:
    title: Попрощаться
    gloss: Ана прощается.
    note: Та же заключительная реплика, которой заканчивался диалог в каждом предыдущем разделе.
