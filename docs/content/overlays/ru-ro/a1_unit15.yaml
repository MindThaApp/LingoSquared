answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (tren, pleacă, bilet, peron, București, Drum bun) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing formal register with each other; no new tu/dumneavoastră form is introduced this unit.
course:
  title: Румынский язык A1
  description: 'Как справиться с обычной поездкой на поезде по-румынски: Tren (поезд), Bilet (билет), Peron (платформа) и Pleacă (отправляется). Михай едет поездом в București, а Ана провожает его на gară.'
units:
  ro.a1.unit15.travel:
    title: Путешествие
lessons:
  ro.a1.unit15.lesson01.trenul_pleaca:
    title: Поезд отправляется
  ro.a1.unit15.lesson02.un_bilet_va_rog:
    title: Билет, пожалуйста
  ro.a1.unit15.lesson03.la_gara:
    title: На вокзале
teaching:
  ro.a1.unit15.lesson01.teach.reminder_gara_ora:
    title: 'Повторение: gară, este, la, ce, oră, ora, nouă'
    gloss: gară (вокзал) · este (есть, является) · la (в, на, к) · ce (что, какой) · oră (час) · ora (час, с артиклем) · nouă (девять)
    note: 'Gară — из разделов 8 и 9; este, la, ce, oră, ora, nouă — из раздела 4 (время). Здесь модель «la ce oră» / «la ora nouă» из раздела 4 используется для нового случая: вопрос о поезде вместо занятия.'
  ro.a1.unit15.lesson01.teach.tren_vocab:
    title: Поезд
    gloss: Tren (поезд)
    note: 'Существительное среднего рода, оканчивается на согласную (в единственном числе существительные среднего рода ведут себя как мужского: *un tren*). Определённая форма — с окончанием *-ul*: trenul, как *magazin* → *magazinul*; существительные на *-ă*, например *gară*, получают *-a* (*gara*).'
    example_gloss:
    - Поезд стоит на вокзале.
  ro.a1.unit15.lesson01.teach.pleaca_vocab:
    title: Отправляется
    gloss: Pleacă (отправляется, он/она/оно)
    note: Глагол для отправления поезда, автобуса или самолёта. *Trenul pleacă* — *este* не нужно, так как *pleacă* уже полноценный глагол.
    example_gloss:
    - Поезд отправляется.
  ro.a1.unit15.lesson01.teach.trenul_pleaca_ora_noua_phrase:
    title: Поезд отправляется в девять
    gloss: Trenul pleacă la ora nouă. (Поезд отправляется в девять часов.)
    note: Соединяет *trenul* + *pleacă* с *la ora nouă* из раздела 4 — новых слов для времени не нужно.
  ro.a1.unit15.lesson01.teach.la_ce_ora_pleaca_trenul_phrase:
    title: Во сколько отправляется поезд?
    gloss: La ce oră pleacă trenul? (Во сколько отправляется поезд?)
    note: Вопросная модель *La ce oră...?* из раздела 4, теперь о *trenul*, а не о занятии.
  ro.a1.unit15.lesson01.teach.peron_vocab:
    title: Платформа
    gloss: Peron (платформа)
    note: Платформа на вокзале. Существительное среднего рода на согласную, поэтому «платформа» с артиклем — *peronul*, с тем же окончанием *-ul*, что и *tren* → *trenul*.
    example_gloss:
    - Поезд стоит у третьей платформы.
  ro.a1.unit15.lesson01.teach.de_la_ce_peron_phrase:
    title: С какой платформы отправляется поезд?
    gloss: De la ce peron pleacă trenul? (С какой платформы отправляется поезд?)
    note: '*De la* (от, с) + *ce peron* (какая платформа) — все слова уже изучены, они лишь соединены в новый вопрос.'
  ro.a1.unit15.lesson02.teach.reminder_as_dori_va_rog_cat_costa:
    title: 'Повторение: aș dori, vă rog, cât costă, costă, lei'
    gloss: хотел бы / хотела бы · пожалуйста (вежливая форма) · сколько стоит · стоит · леи (валюта)
    note: 'Всё это из Урока 6 (еда) и Урока 7 (покупки): здесь те же вежливые просьбы и вопросы о цене используются, чтобы купить билет на поезд, а не еду.'
  ro.a1.unit15.lesson02.teach.bilet_vocab:
    title: Билет
    gloss: билет
    note: Железнодорожный билет. Существительное среднего рода (в единственном числе берёт *un*, как мужской род), поэтому «билет» будет *un bilet*.
    example_gloss:
    - У меня есть билет.
  ro.a1.unit15.lesson02.teach.bucuresti_vocab:
    title: Бухарест
    gloss: Бухарест
    note: Столица Румынии — естественный пункт назначения для примеров в этом курсе.
    example_gloss:
    - Поезд отправляется в Бухарест.
  ro.a1.unit15.lesson02.teach.as_dori_bilet_bucuresti_phrase:
    title: Мне, пожалуйста, билет до Бухареста
    gloss: Мне, пожалуйста, билет до Бухареста.
    note: Вежливая конструкция *Aș dori... vă rog* из Уроков 6 и 7, теперь для просьбы о билете, а не о еде.
  ro.a1.unit15.lesson02.teach.cat_costa_bilet_bucuresti_phrase:
    title: Сколько стоит билет до Бухареста?
    gloss: Сколько стоит билет до Бухареста?
    note: Вопрос о цене *Cât costă...?* из Урока 7, теперь о билете, а не о килограмме картофеля.
  ro.a1.unit15.lesson02.teach.costa_zece_lei_phrase:
    title: Это стоит сорок лей
    gloss: Это стоит сорок лей.
    note: Числа от 2 до 19 (например, zece — десять) употребляются перед *lei* без *de* — это то же правило, что и в Уроке 7.
  ro.a1.unit15.lesson03.teach.reminder_travel_words:
    title: 'Повторение: tren, pleacă, peron, bilet, București, trei, am'
    gloss: поезд · отправляется · платформа · билет · Бухарест · три (из Урока 2) · у меня есть (из Урока 2)
    note: Слова tren, pleacă, peron, bilet, București — из первого и второго уроков этого раздела; trei и am повторяются из Урока 2 (числа), потому что Ана и Михай теперь на вокзале говорят «peronul trei» и «am un bilet» вместе.
  ro.a1.unit15.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Повторение: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: привет · спасибо · до свидания · Ана, Михай (имена)
    note: Всё это уже встречалось в прежних уроках — это то же дружелюбное начало и завершение, которым заканчивается каждый диалог курса.
  ro.a1.unit15.lesson03.teach.drum_bun_vocab:
    title: Счастливого пути
    gloss: Счастливого пути
    note: Устойчивое прощальное пожелание тому, кто отправляется в дорогу. Буквально «добрый путь» — по-русски так же говорят «доброго пути» или «счастливого пути».
    example_gloss:
    - Счастливого пути, Михай!
  ro.a1.unit15.lesson03.teach.line01:
    title: Поприветствовать и спросить о поезде
    gloss: Ана здоровается с Михаем и спрашивает, во сколько отправляется поезд.
    note: Здесь повторяется вопрос из первого урока раздела, теперь обращённый прямо к Михаю.
  ro.a1.unit15.lesson03.teach.line02:
    title: Назвать время отправления
    gloss: Михай говорит, что поезд отправляется в девять часов.
    note: Точно повторяется фраза из первого урока раздела.
  ro.a1.unit15.lesson03.teach.line03:
    title: Спросить о платформе
    gloss: Ана спрашивает, с какой платформы.
    note: 'Короткий уточняющий вопрос: *de la ce peron* уже звучал полностью в первом уроке; здесь Ана задаёт его кратко, ожидая, что Михай всё поймёт.'
  ro.a1.unit15.lesson03.teach.line04:
    title: Назвать платформу и билет
    gloss: 'Михай говорит: платформа три, и что у него есть билет до Бухареста.'
    note: 'В одном ответе соединяются слова этого раздела: peron, bilet и București.'
  ro.a1.unit15.lesson03.teach.line05:
    title: Пожелать счастливого пути и попрощаться
    gloss: Ана желает Михаю счастливого пути и прощается.
    note: Здесь используется *Drum bun* из этого урока — прощание для путешественника вместо обычного *la revedere*.
  ro.a1.unit15.lesson03.teach.line06:
    title: Поблагодарить и попрощаться
    gloss: Михай благодарит Ану и прощается.
    note: То же завершение, которым заканчивались диалоги всех прежних уроков.
