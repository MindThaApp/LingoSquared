answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spaans A1
  description: 'Spaans voor beginners om iemands uiterlijk te beschrijven: lengte en indruk van leeftijd, haar- en oogkleur, de kernvraag ¿Cómo es ...? en het vergelijken van het uiterlijk van twee mensen.'
units:
  es.a1.unit52.appearance:
    title: Uiterlijk beschrijven
lessons:
  es.a1.unit52.lesson01.alto_bajo_mayor_y:
    title: Lang, klein, oud en jong
  es.a1.unit52.lesson02.describir_el_pelo:
    title: Haar beschrijven
  es.a1.unit52.lesson03.los_ojos_y_como:
    title: Ogen en hoe ziet iemand eruit?
  es.a1.unit52.lesson04.elena_describe_a_nina:
    title: Elena beschrijft Nina
  es.a1.unit52.lesson05.comparar_a_diego_y:
    title: Diego en Lucía vergelijken
  es.a1.unit52.lesson06.mateo_reconoce_a_nina:
    title: Mateo herkent Nina
teaching:
  es.a1.unit52.lesson01.teach.alto_bajo:
    title: Lang en klein
    gloss: lang / klein
    note: '*Alto* beschrijft een lange persoon en *bajo* een kleine; beide passen zich aan de persoon aan: *alta*, *baja*.'
    example_gloss:
    - Lucía is lang.
    - Diego is klein.
  es.a1.unit52.lesson01.teach.mayor_joven:
    title: Oud en jong
    gloss: oud / jong
    note: '*Mayor* en *joven* geven een algemene indruk van de leeftijd, geen exact aantal jaren.'
    example_gloss:
    - Opa is oud.
    - Mateo is jong.
  es.a1.unit52.lesson01.teach.para_dar_la:
    title: 'Mayor: een indruk, geen getal'
    gloss: Voor een exacte leeftijd gebruik je tener años, zoals in ¿Cuántos años tienes?; mayor geeft een algemene indruk zonder getal, zoals in El abuelo es mayor.
    note: 'Voor een exacte leeftijd zeg je *tener años*: *¿Cuántos años tienes?* *Mayor* geeft alleen een algemene indruk, zonder getal.'
  es.a1.unit52.lesson01.teach.lucia_es_alta:
    title: Lucía is lang en Diego is klein
    gloss: Lucía is lang en Diego is klein.
    note: Een eenvoudige samengestelde zin met *y* ("en"), als voorbereiding op de directe vergelijking in een latere les.
  es.a1.unit52.lesson02.teach.el_pelo:
    title: Haar
    gloss: het haar
    note: '*El pelo* is mannelijk en blijft enkelvoud als je over iemands haar als geheel praat.'
    example_gloss: Mateo heeft kort zwart haar.
  es.a1.unit52.lesson02.teach.rubio_castano_gris:
    title: Blond, bruin en grijs
    gloss: blond / bruin / grijs
    note: 'Drie haarkleuren: *rubio* (blond), *castaño* (bruin) en *gris* (grijs). *Rubio* past zich aan het zelfstandig naamwoord aan: *pelo rubio*, *melena rubia*.'
    example_gloss:
    - Elena heeft blond haar.
    - Diego heeft bruin haar.
    - Opa heeft grijs haar.
  es.a1.unit52.lesson02.teach.largo_corto:
    title: Lang en kort (haar)
    gloss: lang / kort (haar)
    note: '*Largo* (lang) kennen we al uit de les over lengte, nu voor de haarlengte; *corto* (kort) is nieuw: *el pelo largo*, *el pelo corto*.'
    example_gloss:
    - Lucía heeft lang haar.
    - Diego heeft kort haar.
  es.a1.unit52.lesson02.teach.el_adjetivo_va:
    title: Het bijvoeglijk naamwoord staat achter het zelfstandig naamwoord
    gloss: 'Het bijvoeglijk naamwoord staat achter het zelfstandig naamwoord: el pelo corto, el pelo largo, el pelo rubio, el pelo castaño, el pelo gris, el pelo negro.'
    note: 'In het Spaans staat het bijvoeglijk naamwoord, anders dan in het Nederlands, meestal achter het zelfstandig naamwoord en past het zich eraan aan: *el pelo corto*, *el pelo rubio*.'
  es.a1.unit52.lesson02.teach.pelo_y_cabello:
    title: Pelo en cabello
    gloss: 'Pelo en cabello betekenen hetzelfde. In deze cursus zeggen we pelo: el pelo largo.'
    note: '*Pelo* en *cabello* betekenen allebei "haar" in alledaags Spaans; in deze cursus gebruiken we *pelo*.'
  es.a1.unit52.lesson02.teach.mateo_tiene_el:
    title: Mateo heeft kort zwart haar
    gloss: Mateo heeft kort zwart haar.
    note: Hier komt *negro* (zwart) terug uit de unit over kleding.
  es.a1.unit52.lesson02.teach.elena_tiene_el:
    title: Elena heeft lang blond haar
    gloss: Elena heeft lang blond haar.
    note: Combineert de woorden voor lengte en kleur uit deze les in één natuurlijke zin.
  es.a1.unit52.lesson03.teach.los_ojos:
    title: Ogen
    gloss: de ogen
    note: '*Los ojos* is het meervoud van *el ojo*; beide woorden zijn mannelijk.'
    example_gloss: Mateo heeft bruine ogen.
  es.a1.unit52.lesson03.teach.azul_marron_verde:
    title: Blauw, bruin en groen
    gloss: blauw / bruin / groen
    note: '*Azul* (blauw) en *verde* (groen) hebben één vorm voor beide geslachten; *marrón* (bruin) is het gebruikelijke woord voor oogkleur, terwijl haar *castaño* is.'
    example_gloss:
    - Elena heeft blauwe ogen.
    - Diego heeft bruine ogen.
    - Lucía heeft groene ogen.
  es.a1.unit52.lesson03.teach.con_ojos_plural:
    title: Ojos krijgt een bijvoeglijk naamwoord in het meervoud
    gloss: 'Bij ojos (meervoud) staat het bijvoeglijk naamwoord ook in het meervoud: ojos azules, ojos marrones, ojos verdes.'
    note: 'Bijvoeglijke naamwoorden passen zich aan in getal: *ojos* is meervoud, dus *azules*, *marrones*, *verdes*.'
  es.a1.unit52.lesson03.teach.como_es_elena:
    title: Hoe ziet Elena eruit?
    gloss: Hoe ziet Elena eruit?
    note: '*¿Cómo es ...?* is de kernvraag van deze unit; gebruik hem om naar het uiterlijk van iedereen te vragen.'
  es.a1.unit52.lesson03.teach.elena_tiene_el:
    title: Elena heeft lang blond haar en blauwe ogen
    gloss: Elena heeft lang blond haar en blauwe ogen.
    note: Een voorbeeldantwoord dat haar en ogen met *y* in één zin combineert.
  es.a1.unit52.lesson04.teach.elena_viene_una:
    title: Elena stelt Nina voor
    gloss: 'Elena: Er komt een nieuw meisje naar het taalcafé. Ze heet Nina.'
    note: '*Viene* ("komt eraan") introduceert iemand nieuws; *se llama* betekent "heet".'
  es.a1.unit52.lesson04.teach.mateo_genial_como:
    title: Mateo vraagt hoe ze eruitziet
    gloss: 'Mateo: Gaaf! Hoe ziet ze eruit?'
    note: 'Hier komt de kernvraag van deze unit terug, zonder naam: *¿Cómo es?*'
  es.a1.unit52.lesson04.teach.elena_es_baja:
    title: Elena beschrijft Nina's lengte en haar
    gloss: 'Elena: Ze is klein en heeft kort blond haar.'
    note: Combineert *baja* uit de eerste les met de haarwoorden; *baja* is vrouwelijk omdat Nina een meisje is.
  es.a1.unit52.lesson04.teach.mateo_y_los:
    title: Mateo vraagt naar haar ogen
    gloss: 'Mateo: En haar ogen?'
    note: '*¿Y los ojos?* pakt het onderwerp op met het bepaald lidwoord; in het Spaans is hier geen bezittelijk woord als *sus* nodig.'
  es.a1.unit52.lesson04.teach.elena_tiene_los:
    title: Elena beschrijft Nina's ogen
    gloss: 'Elena: Ze heeft groene ogen.'
    note: Hier komt *los ojos verdes* terug uit de les over ogen.
  es.a1.unit52.lesson04.teach.mateo_gracias_entonces:
    title: Mateo zal haar herkennen
    gloss: 'Mateo: Bedankt! Dan herken ik haar wel.'
    note: '*La reconoceré* ("ik zal haar herkennen") is een toekomende tijd; *la* betekent "haar" en staat voor het werkwoord.'
  es.a1.unit52.lesson05.teach.diego_es_el:
    title: Diego en Lucía vergelijken
    gloss: Diego en Lucía zijn broer en zus, maar ze zien er verschillend uit. Diego is klein en heeft kort bruin haar en bruine ogen. Lucía is langer dan Diego en heeft lang bruin haar en groene ogen. En jij, hoe zie jij eruit?
    note: Een korte vergelijking met alle kleur- en lengtewoorden die tot nu toe zijn geleerd, met als slot de kernvraag van de unit aan de lezer.
    glosses:
      hermano: broer
      hermana: zus
      eres: eruitzien
      diferentes: verschillend
      bajo: klein
      corto: klein
      castaño: bruin
      pelo: haar
      marrones: bruin
      ojos: ogen
      alta: groter
      largo: lang
      verdes: groen
      cómo: (deel van 'cómo es' = hoe ... eruitziet)
  es.a1.unit52.lesson05.teach.ya_conoces_el:
    title: Het vergelijkingspatroon opnieuw gebruiken
    gloss: 'Je kent het vergelijkingspatroon al: más + bijvoeglijk naamwoord + que. Hier gebruik je het voor personen: Lucía is groter dan Diego.'
    note: Het patroon *más + adjective + que* uit de les over vergelijkingen, nu toegepast op personen in plaats van voorwerpen.
  es.a1.unit52.lesson05.teach.lucia_tiene_el:
    title: Lucía heeft langer haar dan Diego
    gloss: Lucía heeft langer haar dan Diego.
    note: '*Más largo que* vergelijkt twee dingen: *el pelo más largo que Diego*; *largo* blijft mannelijk omdat *pelo* mannelijk is.'
  es.a1.unit52.lesson05.teach.tengo_el_pelo:
    title: Ik heb kort bruin haar
    gloss: Ik heb kort bruin haar.
    note: Een voorbeeldzin in de ik-vorm met *tengo*, handig om te hergebruiken als je jezelf beschrijft.
  es.a1.unit52.lesson06.teach.mateo_mira_es:
    title: Mateo ziet Nina
    gloss: 'Mateo: Kijk, is dat Nina? Ze heeft kort blond haar en groene ogen.'
    note: '*Mira* ("kijk") is de informele gebiedende wijs van *mirar*, hier gebruikt om iets aan te wijzen.'
  es.a1.unit52.lesson06.teach.elena_si_esa:
    title: Elena bevestigt het
    gloss: 'Elena: Ja, dat is Nina!'
    note: Een korte, natuurlijke bevestiging.
  es.a1.unit52.lesson06.teach.nina_hola_eres:
    title: Nina begroet Mateo
    gloss: 'Nina: Hoi, ben jij Mateo?'
    note: 'Een simpele informele begroetingsvraag: *¿Eres ...?*'
  es.a1.unit52.lesson06.teach.mateo_si_encantado:
    title: Mateo begroet Nina terug
    gloss: 'Mateo: Ja! Aangenaam kennis te maken, Nina.'
    note: '*Encantado de conocerte* is de standaardzin bij een eerste ontmoeting; een vrouw zegt *Encantada*.'
  es.a1.unit52.lesson06.teach.nina_encantada_de:
    title: Nina beantwoordt de begroeting
    gloss: 'Nina: Aangenaam!'
    note: 'Sluit de dialoog af: Mateo heeft Nina herkend aan de beschrijving die Elena eerder gaf.'
