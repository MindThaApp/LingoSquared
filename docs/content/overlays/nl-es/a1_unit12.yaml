  title: Spaans A1
  description: 'Basisgevoelens uitdrukken, met het vervolg van het verhaal van Elena en Mateo tijdens de workshoples van 22 juli zelf: zenuwen voor de les, een misser in de keuken en trots als het gerecht gered is.'
