teaching:
  es.a1.unit12.lesson01.teach.nervioso:
    title: Nerveus
    gloss: nerveus
    note: '*Nervioso* (mannelijk) / *nerviosa* (vrouwelijk) -- een gewoon -o/-a-paar van bijvoeglijke naamwoorden.'
    example_gloss:
    - Mateo is nerveus.
    - Elena is nerveus.
  es.a1.unit12.lesson01.teach.contento:
    title: Blij
    gloss: blij / tevreden
    note: '*Contento/contenta* beschrijft dat je je blij of tevreden voelt, niet een blijvende eigenschap.'
    example_gloss:
    - Mateo is blij.
    - Elena is blij.
  es.a1.unit12.lesson01.teach.cansado:
    title: Moe
    gloss: moe
    note: '*Cansado/cansada*, van *cansar* (vermoeien).'
    example_gloss:
    - Na de workshop ben ik moe. (mannelijk)
    - Na de workshop ben ik moe. (vrouwelijk)
  es.a1.unit12.lesson01.teach.preocupado:
    title: Bezorgd
    gloss: bezorgd
    note: '*Preocupado/preocupada*, van *preocupar* (zorgen baren).'
    example_gloss:
    - Mateo is bezorgd.
    - Elena is bezorgd.
  es.a1.unit12.lesson01.teach.orgulloso:
    title: Trots
    gloss: trots
    note: '*Orgulloso/orgullosa* -- bij *estoy orgulloso/a de...* (ik ben trots op...) gebruik je *de* voor datgene waar je trots op bent.'
    example_gloss:
    - Ik ben trots op je. (mannelijk)
    - Ik ben trots op je. (vrouwelijk)
  es.a1.unit12.lesson02.teach.estoy_nervioso:
    title: Ik ben nerveus (mannelijk)
    gloss: Ik ben nerveus.
    note: '*Estoy* (ik ben, van *estar*) + de mannelijke vorm van het bijvoeglijk naamwoord.'
  es.a1.unit12.lesson02.teach.estoy_nerviosa:
    title: Ik ben nerveus (vrouwelijk)
    gloss: Ik ben nerveus.
    note: Dezelfde constructie met de vrouwelijke vorm van het bijvoeglijk naamwoord.
  es.a1.unit12.lesson02.teach.estoy_contento:
    title: Ik ben blij (mannelijk)
    gloss: Ik ben blij.
    note: '*Estoy contento* -- hetzelfde patroon van *estar* + bijvoeglijk naamwoord.'
  es.a1.unit12.lesson02.teach.estar_vs_ser_note:
    title: Estar of ser bij gevoelens
    gloss: Waarom je bij gevoelens meestal estar gebruikt en niet ser.
    note: Zie de tekst op de kaart zelf.
    target_text: '*Estar* + bijvoeglijk naamwoord beschrijft een tijdelijke toestand of gevoel (estoy nervioso -- ik ben [nu] nerveus), anders dan *ser* + bijvoeglijk naamwoord voor een blijvende eigenschap. Gevoelens gebruik je normaal met *estar*.'
  es.a1.unit12.lesson03.teach.como_te_sientes:
    title: Vragen hoe iemand zich voelt
    gloss: Hoe voel je je?
    note: '*¿Cómo te sientes?* gebruikt *sentirse* (zich voelen), een wederkerend werkwoord. Dat is iets anders dan *estar* + bijvoeglijk naamwoord.'
  es.a1.unit12.lesson03.teach.me_siento_nervioso_pero_contento:
    title: Een gemengd gevoel beschrijven
    gloss: Ik voel me een beetje nerveus, maar blij.
    note: '*Me siento* (ik voel me) + bijvoeglijk naamwoord, met *pero* (maar) om twee gevoelens tegenover elkaar te zetten. Zo antwoord je natuurlijk op *¿Cómo te sientes?*.'
  es.a1.unit12.lesson04.teach.algo_se_quema:
    title: Er brandt iets aan
    gloss: Er brandt iets aan!
    note: '*Se quema* is de wederkerende vorm van *quemar* (branden) -- letterlijk "het brandt zichzelf". Zo zeg je op een natuurlijke manier dat er iets aanbrandt, zonder te zeggen wie of wat de oorzaak is.'
  es.a1.unit12.lesson04.teach.estoy_preocupado:
    title: Ik maak me zorgen (mannelijk)
    gloss: Ik maak me zorgen.
    note: '*Preocupado* in het patroon *estoy* + bijvoeglijk naamwoord.'
  es.a1.unit12.lesson04.teach.no_te_preocupes:
    title: Maak je geen zorgen
    gloss: Maak je geen zorgen.
    note: Zie de volgende grammaticakaart.
  es.a1.unit12.lesson04.teach.podemos_empezar_de_nuevo:
    title: Voorstellen om opnieuw te beginnen
    gloss: We kunnen opnieuw beginnen.
    note: '*Podemos* (we kunnen) + infinitief. *De nuevo* (opnieuw) is een veelgebruikte uitdrukking om iets over te doen.'
  es.a1.unit12.lesson04.teach.no_te_preocupes_note:
    title: No te preocupes
    gloss: Het patroon van het negatieve gebod achter "maak je geen zorgen".
    note: Zie de tekst op de kaart zelf.
    target_text: '*No te preocupes* (maak je geen zorgen) is een ontkennend informeel bevel, gevormd met *no* + wederkerend voornaamwoord (*te*) + werkwoord.'
  es.a1.unit12.lesson05.teach.reflexion_reading:
    title: Een terugblik op de les
    gloss: Voor de les waren Elena en Mateo een beetje nerveus. Tijdens de les brandde er iets aan en maakten ze zich allebei zorgen. Maar ze begonnen opnieuw, en uiteindelijk werd de taart perfect. Nu zijn ze allebei erg trots en blij.
    note: '*Estaban* (ze waren) beschrijft hoe ze zich toen voelden. *Están* (ze zijn) beschrijft hoe ze zich nu voelen.'
    glosses:
      Antes: voor
      clase: les
      estaban: waren (van estar)
      poco: een beetje
      nerviosos: nerveus
      Durante: tijdens
      algo: iets
      quemó: brandde aan (van quemarse)
      dos: allebei
      preocupados: bezorgd
      Pero: maar
      empezaron: begonnen (van empezar)
      nuevo: opnieuw
      final: einde
      pastel: taart
      salió: werd (van salir)
      perfecto: perfect
      Ahora: nu
      están: zijn (van estar)
      orgullosos: trots
      contentos: blij
  es.a1.unit12.lesson05.teach.plural_adjective_note:
    title: Meervoud van bijvoeglijke naamwoorden
    gloss: Waarom een gemengde groep bijvoeglijke naamwoorden in het mannelijk meervoud krijgt.
    note: Zie de tekst op de kaart zelf.
    target_text: Als je Elena en Mateo samen beschrijft, krijgen bijvoeglijke naamwoorden de mannelijke meervoudsvorm (nerviosos, preocupados, orgullosos, contentos) -- de gewone Spaanse regel wanneer een groep minstens één man bevat.
  es.a1.unit12.lesson06.teach.line01:
    title: Vragen hoe Mateo zich voelt
    gloss: Elena vraagt Mateo hoe hij zich voor de les voelt.
    note: Met *¿Cómo te sientes?* vraag je hoe iemand zich voelt.
  es.a1.unit12.lesson06.teach.line02:
    title: Antwoorden met een gemengd gevoel
    gloss: Mateo zegt dat hij zich een beetje nerveus, maar blij voelt.
    note: Mateo gebruikt de mannelijke vormen *nervioso* en *contento*.
  es.a1.unit12.lesson06.teach.line03:
    title: Reageren op het ongelukje
    gloss: Elena is het met hem eens en merkt dan dat er iets aanbrandt.
    note: '*¡Ay, no!* (o nee!) is een veelgebruikte uitroep van schrik.'
  es.a1.unit12.lesson06.teach.line04:
    title: Zorgen uiten
    gloss: Mateo zegt dat hij zich zorgen maakt en vraagt wat ze moeten doen.
    note: '*¿Qué hacemos?* (wat doen we?) is een praktische vraag.'
  es.a1.unit12.lesson06.teach.line05:
    title: Geruststellen en een oplossing voorstellen
    gloss: Elena zegt dat hij zich geen zorgen moet maken -- ze kunnen opnieuw beginnen.
    note: Combineert *no te preocupes* en *podemos empezar de nuevo*.
  es.a1.unit12.lesson06.teach.line06:
    title: Het eens zijn en opnieuw proberen
    gloss: Mateo is het met haar eens en stelt voor om het nog een keer te proberen.
    note: '*Vamos a intentarlo otra vez* (laten we het nog een keer proberen) gebruikt opnieuw de constructie *vamos a* + infinitief uit eerdere units, nu met het lijdend voorwerp *lo*.'
  es.a1.unit12.lesson06.teach.line07:
    title: Het succes aankondigen
    gloss: Elena zegt dat de taart nu perfect is.
    note: '*¡Mira!* (kijk!) is een tussenwerpsel om aandacht te trekken. *El pastel* (de taart) is het gerecht waar het ongelukje om draaide.'
  es.a1.unit12.lesson06.teach.line08:
    title: Vieren en trots zijn
    gloss: Mateo is blij en zegt dat hij trots is op hen allebei.
    note: '*¡Qué bien!* (wat goed!) gebruikt het uitroeppatroon *¡Qué...!*, net als *¡Qué calor!*. *De nosotros* (op ons) breidt *estoy orgulloso de ti* uit naar een groep.'
  es.a1.unit12.lesson06.teach.line09:
    title: De trots delen
    gloss: Elena is ook trots -- ze hebben het samen gedaan.
    note: '*Lo logramos juntos* (we hebben het samen bereikt) is een natuurlijke afsluitende zin. Hier zie je voor het eerst *lograr* (bereiken, lukken).'
