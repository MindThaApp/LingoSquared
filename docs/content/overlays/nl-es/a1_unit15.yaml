teaching:
  es.a1.unit15.lesson01.teach.mas_que:
    title: Meer...dan
    gloss: meer...dan
    note: '*Más...que* vergelijkt twee verschillende hoeveelheden of dingen -- zie de grammaticanotitie hieronder.'
    example_gloss: Het nieuwe appartement is groter dan het oude.
  es.a1.unit15.lesson01.teach.menos_que:
    title: Minder...dan
    gloss: minder...dan
    note: '*Menos...que*, het tegenovergestelde van *más...que*.'
    example_gloss: Het oude appartement is minder groot dan het nieuwe.
  es.a1.unit15.lesson01.teach.tan_como:
    title: Even...als
    gloss: even...als
    note: '*Tan...como* vergelijkt twee GELIJKE dingen. Het is een andere constructie dan *más/menos*, niet zomaar een andere manier om hetzelfde te zeggen.'
    example_gloss: Mateo kookt even goed als Elena.
  es.a1.unit15.lesson01.teach.mas_menos_tan_note:
    title: Ongelijkheid vs. gelijkheid
    gloss: Het verschil tussen más/menos...que en tan...como.
    note: Zie de tekst op de kaart zelf.
    target_text: '*Más...que* (meer...dan) en *menos...que* (minder...dan) vergelijken twee VERSCHILLENDE dingen of hoeveelheden. *Tan...como* (even...als) vergelijkt twee GELIJKE dingen -- een andere constructie, niet zomaar een synoniem van *más/menos*.'
  es.a1.unit15.lesson02.teach.el_nuevo_es_mas_grande:
    title: Het nieuwe appartement vergelijken
    gloss: Het nieuwe appartement is groter dan het oude.
    note: '*Más grande que* (groter dan) zet *grande* (groot) in het patroon *más...que*.'
  es.a1.unit15.lesson02.teach.el_viejo_es_mas_pequeno:
    title: Het oude appartement vergelijken
    gloss: Het oude appartement is kleiner dan het nieuwe.
    note: '*Más pequeño que* (kleiner dan) gebruikt *pequeño* (klein) en drukt de vergelijking uit vanuit de andere kant.'
  es.a1.unit15.lesson03.teach.cual_apartamento_es_mas_grande:
    title: Vragen welke groter is
    gloss: Welk appartement is groter?
    note: '*¿Cuál...?* (welk...?) + een vergrotende trap is de standaardmanier om naar een vergelijking te vragen.'
  es.a1.unit15.lesson03.teach.el_nuevo_es_mas_grande_reply:
    title: Antwoorden welke groter is
    gloss: Het nieuwe is groter dan het oude.
    note: Dezelfde vergelijking, nu als direct antwoord op de vraag met *¿cuál...?*. Bij *el nuevo* (het nieuwe) wordt het herhaalde zelfstandig naamwoord weggelaten.
  es.a1.unit15.lesson04.teach.mateo_cocina_tan_bien_como_elena:
    title: Kookvaardigheid gelijk vergelijken
    gloss: Mateo kookt even goed als Elena.
    note: '*Tan bien como* (even goed als) gebruikt *tan* + bijwoord + *como*: het gelijkheidspatroon, hier toegepast op de manier waarop iemand iets doet.'
  es.a1.unit15.lesson04.teach.somos_un_buen_equipo:
    title: Zeggen dat jullie een goed team zijn
    gloss: We zijn een goed team.
    note: '*Somos* (wij zijn) + *un buen equipo* (een goed team) is een natuurlijke afsluiter na een gelijkheidsvergelijking.'
  es.a1.unit15.lesson05.teach.comparacion_reading:
    title: De twee appartementen vergelijken
    gloss: Mateo's oude appartement heeft een kleine keuken. Het nieuwe appartement is groter, en de keuken is ook groter. Het oude is kleiner dan het nieuwe, en daarom wil Mateo verhuizen. Het nieuwe heeft meer ruimte om te koken.
    note: Een realistische samenvatting waarin beide appartementen worden vergeleken.
    glosses:
      viejo: oud
      tiene: heeft (van tener)
      pequeña: klein
      nuevo: nieuwe
      grande: groot
      también: ook
      pequeño: klein
      eso: dat
      quiere: wil (van querer)
      mudarse: verhuizen
      espacio: ruimte
      cocinar: koken
  es.a1.unit15.lesson05.teach.por_eso_note:
    title: Por eso (daarom)
    gloss: Hoe por eso een reden aan een gevolg koppelt.
    note: Zie de tekst op de kaart zelf.
    target_text: '*Por eso* (daarom) verbindt een reden met het gevolg -- de kleine keuken is de reden dat Mateo wil verhuizen, dezelfde oorzaak-gevolglogica als bij *porque*, die je al kent.'
  es.a1.unit15.lesson06.teach.line01:
    title: Vragen of hij het heeft gezien
    gloss: Elena vraagt of Mateo het nieuwe appartement al heeft gezien.
    note: '*¿Ya viste...?* (heb je ... al gezien?) is een nieuwe vraagvorm in de verleden tijd.'
  es.a1.unit15.lesson06.teach.line02:
    title: Bevestigen dat het groter is
    gloss: Mateo bevestigt dat het groter is dan het oude, keuken inbegrepen.
    note: Een vergelijking met *más...que*, uitgebreid met *la cocina también* (de keuken ook).
  es.a1.unit15.lesson06.teach.line03:
    title: Vragen welke kleiner is
    gloss: Elena vraagt dan welk appartement kleiner is.
    note: '*Entonces* (dan/dus) is een logisch verbindingswoord dat je al kent. De vraag volgt het patroon *¿Cuál...?* met *pequeño* in plaats van *grande*.'
  es.a1.unit15.lesson06.teach.line04:
    title: Antwoorden en uitleggen
    gloss: Mateo zegt dat het oude kleiner is en dat hij daarom wil verhuizen.
    note: '*El viejo es más pequeño que el nuevo* plus *por eso quiero mudarme* (daarom wil ik verhuizen).'
  es.a1.unit15.lesson06.teach.line05:
    title: Het eens zijn dat het logisch is
    gloss: 'Elena zegt dat het logisch is: het nieuwe heeft meer ruimte om te koken.'
    note: '*Tiene mucho sentido* (dat is heel logisch) is een nieuwe uitdrukking om het eens te zijn. *Más espacio para cocinar* betekent meer ruimte om te koken.'
  es.a1.unit15.lesson06.teach.line06:
    title: De redenering uitbreiden
    gloss: Mateo is het eens en voegt toe dat Elena net zo goed kookt als hij, dus ze hebben ruimte nodig voor twee.
    note: '*Tan bien como* (even goed als), nu gebruikt in een gesprek met *tú cocinas* (jij kookt).'
  es.a1.unit15.lesson06.teach.line07:
    title: Het compliment teruggeven
    gloss: Elena is het enthousiast eens en zegt dat hij net zo goed kookt als zij.
    note: '*¡Es verdad!* (dat is waar!) + *tú cocinas tan bien como yo* (jij kookt even goed als ik): dezelfde vergelijking met *tan bien como*, nu teruggegeven aan Mateo.'
  es.a1.unit15.lesson06.teach.line08:
    title: Afsluiten met teamgeest
    gloss: Mateo concludeert dat ze een goed team zijn.
    note: '*Somos un buen equipo* (we zijn een goed team) sluit de dialoog af.'
