course:
  title: Spaans A1
  description: 'Eenvoudige vergelijkingen maken. Het verhaal van Elena en Mateo gaat verder: ze vergelijken Mateo''s oude en nieuwe appartement en sluiten af met een vergelijking van hun kookkunsten, waarin ze even goed zijn.'
