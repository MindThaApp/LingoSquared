answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spaans A1
  description: Leer neutrale Spaanse begroetingen, kennismakingszinnen en praktische small talk voor een eerste ontmoeting. De uitleg belicht register, congruentie, het weglaten van het onderwerp en werkwoordsvormen in het Spaans.
units:
  es.a1.unit01.greetings:
    title: Begroetingen en eerste ontmoetingen
lessons:
  es.a1.unit01.lesson01.tu_and_usted:
    title: Kiezen tussen tú en usted
  es.a1.unit01.lesson02.greetings_by_time:
    title: Begroetingen en afscheid door de dag heen
  es.a1.unit01.lesson03.names_and_introductions:
    title: Namen en voorstellen
  es.a1.unit01.lesson04.origin_and_language:
    title: Herkomst, woonplaats en taal
  es.a1.unit01.lesson05.shared_activity_small_talk:
    title: Small talk bij een gezamenlijke activiteit
  es.a1.unit01.lesson06.cooking_workshop_dialogue:
    title: Eerste ontmoeting bij een kookworkshop
teaching:
  es.a1.unit01.lesson01.teach.usted:
    title: Beleefd 'u'
    gloss: u (formeel of respectvol)
    note: In het Nederlands kies je tussen u en je/jij; ook het Spaans maakt die sociale keuze vaak zichtbaar. Usted is handig bij een onbekende volwassene of wanneer een respectvolle toon past. Hoewel het 'u' betekent, krijgt het dezelfde werkwoordsvorm als él of ella.
  es.a1.unit01.lesson01.teach.tu:
    title: Informeel 'je'
    gloss: jij; je (enkelvoud, informeel)
    note: Tú gebruik je voor één vriend, leeftijdsgenoot, kind of een andere persoon met wie je informeel omgaat. Het accent onderscheidt het voornaamwoord tú van het bezittelijk voornaamwoord tu, dat 'jouw' betekent.
  es.a1.unit01.lesson01.teach.como_esta_usted:
    title: Formele vraag naar iemands welzijn
    gloss: Hoe gaat het met u?
    note: Está is de usted-vorm van estar. Het Spaans gebruikt hier estar voor iemands huidige toestand. Cómo heeft een accent omdat het een vraagwoord is.
  es.a1.unit01.lesson01.teach.como_estas:
    title: Informele vraag naar iemands welzijn
    gloss: Hoe gaat het met u?
    note: 'Estás is de tú-vorm van estar. Het Spaans verandert está in estás, afhankelijk van wie je aanspreekt: usted of tú.'
  es.a1.unit01.lesson01.teach.bien_gracias:
    title: Een kort antwoord
    gloss: Goed, dank je.
    note: In het Spaans kun je gewoon met bien antwoorden, zonder onderwerp of werkwoord te herhalen.
  es.a1.unit01.lesson01.teach.muy_bien:
    title: Een positief antwoord
    gloss: Heel goed, dank je.
    note: Muy versterkt bien en verandert zelf niet van vorm.
  es.a1.unit01.lesson01.teach.and_usted:
    title: De formele vraag teruggeven
    gloss: En u?
    note: Houd usted aan wanneer je een respectvol gestelde vraag teruggeeft.
  es.a1.unit01.lesson01.teach.and_tu:
    title: De informele vraag teruggeven
    gloss: En u?
    note: Gebruik tú wanneer het gesprek informeel is. Het geschreven accent is belangrijk, want tu zonder accent betekent 'jouw'.
  es.a1.unit01.lesson02.teach.hola:
    title: Begroeting voor alle gelegenheden
    gloss: hallo
    note: Hola kun je op elk moment van de dag gebruiken, zowel formeel als informeel.
  es.a1.unit01.lesson02.teach.buenos_dias:
    title: Ochtendbegroeting
    gloss: goedemorgen
    note: Spaanse zelfstandige naamwoorden hebben een grammaticaal geslacht, net als in het Nederlands (de/het). Días is mannelijk meervoud, dus het bijvoeglijk naamwoord staat als buenos.
  es.a1.unit01.lesson02.teach.buenas_tardes:
    title: Middagbegroeting
    gloss: goedemiddag
    note: Tardes is vrouwelijk meervoud, dus buenas past zich daaraan aan. De wisseling van buenos naar buenas is grammaticale congruentie en geen verandering in beleefdheid.
  es.a1.unit01.lesson02.teach.buenas_noches:
    title: Avond- of nachtbegroeting
    gloss: goedenavond; goedenacht
    note: Noches is vrouwelijk meervoud en krijgt daarom buenas. Met deze uitdrukking kun je iemand 's avonds begroeten of afscheid nemen voordat je gaat slapen.
  es.a1.unit01.lesson02.teach.adios:
    title: Direct afscheid
    gloss: tot ziens
    note: Adiós is neutraal, maar kan definitiever klinken dan een uitdrukking als 'tot later'.
  es.a1.unit01.lesson02.teach.hasta_luego:
    title: Tot later
    gloss: tot later
    note: Hasta luego is een vaste afscheidsgroet die je niet woord voor woord hoeft te lezen.
  es.a1.unit01.lesson02.teach.nos_vemos:
    title: Vriendelijk afscheid
    gloss: tot snel
    note: Letterlijk komt nos vemos dichter bij 'we zien elkaar'.
  es.a1.unit01.lesson02.teach.good_day:
    title: Beleefde afscheidswens
    gloss: Fijne dag nog.
    note: Tenga is de usted-vorm die in deze beleefde wens wordt gebruikt. Buen is de verkorte mannelijke enkelvoudsvorm van bueno voor día.
  es.a1.unit01.lesson03.teach.formal_name_question:
    title: Formeel naar een naam vragen
    gloss: Hoe heet u?
    note: Het Spaans zegt dit ongeveer als 'hoe noemt u zichzelf'. Se hoort bij llama, de beleefde usted-vorm.
  es.a1.unit01.lesson03.teach.my_name_lucia:
    title: Je naam zeggen
    gloss: Mijn naam is Lucía.
    note: Me llamo betekent letterlijk 'ik noem mezelf'. De werkwoordsuitgang geeft al aan wie er spreekt, dus het Spaans laat yo hier normaal weg.
  es.a1.unit01.lesson03.teach.informal_name_question:
    title: Informeel naar een naam vragen
    gloss: Hoe heet u?
    note: Te hoort bij informeel tú, en llamas heeft de tú-uitgang -as. Vergelijk formeel se llama met informeel te llamas.
  es.a1.unit01.lesson03.teach.i_am_diego:
    title: Jezelf voorstellen met ser
    gloss: Ik ben Diego.
    note: Soy is de eerste persoon enkelvoud van ser. Het Spaans gebruikt ser voor identiteit en estar voor veel tijdelijke toestanden, terwijl het Nederlands voor beide 'zijn' gebruikt.
  es.a1.unit01.lesson03.teach.mucho_gusto:
    title: Blij zijn iemand te ontmoeten
    gloss: Aangenaam.
    note: Mucho gusto is een vaste, algemeen begrepen uitdrukking. Anders dan encantado of encantada verandert het niet naargelang het geslacht van de spreker.
  es.a1.unit01.lesson03.teach.igualmente:
    title: Hetzelfde terugzeggen
    gloss: Insgelijks.
    note: Igualmente is een kort antwoord op Mucho gusto.
  es.a1.unit01.lesson03.teach.este_carlos:
    title: Een man voorstellen
    gloss: Dit is Carlos.
    note: Het Spaans gebruikt este wanneer de aangewezen persoon of zaak grammaticaal mannelijk is.
  es.a1.unit01.lesson03.teach.esta_ana:
    title: Een vrouw voorstellen
    gloss: Dit is Ana.
    note: Gebruik esta voor een vrouwelijk woord. Esta heeft hier geen accent; está met accent is een vorm van estar en betekent 'is' of 'bevindt zich'.
  es.a1.unit01.lesson04.teach.formal_origin_question:
    title: Formeel naar herkomst vragen
    gloss: Waar komt u vandaan?
    note: Es is de usted-vorm van ser. Het Spaans gebruikt ser, niet estar, voor herkomst. Dónde heeft een accent in een directe vraag.
  es.a1.unit01.lesson04.teach.from_mexico:
    title: Je herkomst noemen
    gloss: Ik kom uit Mexico.
    note: Soy is de yo-vorm van ser. Het onderwerp yo is overbodig, omdat soy al aangeeft wie er spreekt.
  es.a1.unit01.lesson04.teach.informal_origin_question:
    title: Informeel naar herkomst vragen
    gloss: Waar komt u vandaan?
    note: Eres is de tú-vorm van ser. Vergelijk formeel es bij usted met informeel eres.
  es.a1.unit01.lesson04.teach.from_colombia:
    title: Nog een zin over herkomst
    gloss: Ik kom uit Colombia.
    note: Gebruik soy de gevolgd door een plaats om je herkomst te noemen.
  es.a1.unit01.lesson04.teach.live_london:
    title: Zeggen waar je woont
    gloss: Ik woon in Londen.
    note: Vivo is de yo-vorm van vivir. Het Spaans heeft yo niet nodig, omdat de uitgang -o aangeeft wie er spreekt.
  es.a1.unit01.lesson04.teach.speak_spanish:
    title: Formeel naar Spaans vragen
    gloss: Spreekt u Spaans?
    note: Het Spaans vormt deze ja/nee-vraag zonder hulpwerkwoord. Habla is de usted-vorm; intonatie en vraagtekens laten zien dat het een vraag is.
  es.a1.unit01.lesson04.teach.yes_a_little:
    title: Beperkte kennis
    gloss: Ja, een beetje.
    note: Sí met accent betekent 'ja'. Si zonder accent betekent 'als', al wordt de spelling zonder accent hier op A1-niveau als typfout getolereerd.
  es.a1.unit01.lesson04.teach.still_learning:
    title: Een lopende situatie beschrijven
    gloss: Ik ben nog aan het leren.
    note: Estoy is de yo-vorm van estar. Hier ondersteunt estar een activiteit die bezig is, terwijl soy in Soy de Colombia herkomst of identiteit uitdrukt. Het Nederlands gebruikt in beide gevallen 'ben'.
  es.a1.unit01.lesson05.teach.formal_first_time:
    title: Formeel naar een eerste bezoek vragen
    gloss: Is dit uw eerste keer hier?
    note: Su betekent 'uw' wanneer je iemand met usted aanspreekt. Net als in het Nederlands (uw/jouw) blijft de formele of informele keuze zichtbaar in su en tu.
  es.a1.unit01.lesson05.teach.informal_first_time:
    title: Informeel naar een eerste bezoek vragen
    gloss: Is dit uw eerste keer hier?
    note: Tu zonder accent is het informele bezittelijk voornaamwoord 'jouw'. Vergelijk het met het voornaamwoord tú, dat wel een accent heeft.
  es.a1.unit01.lesson05.teach.first_time_answer:
    title: Bevestigen dat het je eerste bezoek is
    gloss: Ja, het is mijn eerste keer.
    note: Primera is vrouwelijk omdat het congrueert met vez. Spaanse bijvoeglijke naamwoorden passen zich aan het geslacht van het zelfstandig naamwoord aan.
  es.a1.unit01.lesson05.teach.cooking_workshop:
    title: Je bestemming noemen
    gloss: Ik kom voor de kookworkshop.
    note: Vengo is de yo-vorm van venir, 'ik kom'. Al is de verplichte samentrekking van a en el.
  es.a1.unit01.lesson05.teach.me_too:
    title: Dezelfde situatie delen
    gloss: Ik ook.
    note: Yo también is handig wanneer wat de ander zegt ook voor jou geldt.
  es.a1.unit01.lesson05.teach.like_cooking:
    title: Naar een interesse vragen
    gloss: Vind je koken leuk?
    note: 'Gustar werkt anders dan ''leuk vinden'': de zinsbouw is omgedraaid. Te geeft aan wie iets leuk vindt, en cocinar is datgene wat bevalt. Het werkwoord blijft gusta, omdat de activiteit als enkelvoud wordt gezien.'
  es.a1.unit01.lesson05.teach.yes_very_much:
    title: Sterke interesse uitdrukken
    gloss: Ja, heel erg.
    note: Mucho beantwoordt de vraag naar de mate en verandert hier niet van vorm.
  es.a1.unit01.lesson05.teach.thats_good:
    title: Positieve reactie
    gloss: Wat fijn!
    note: Qué heeft in deze uitroep een accent. Het leidt een positieve reactie in en stelt geen vraag.
  es.a1.unit01.lesson06.teach.line01:
    title: De ontmoeting openen
    gloss: Elena begroet Mateo en vraagt of hij hier voor het eerst is.
    note: Beide sprekers gebruiken informele tú-vormen, omdat ze elkaar als gelijken ontmoeten bij dezelfde activiteit.
  es.a1.unit01.lesson06.teach.line02:
    title: De ontmoeting openen, antwoord
    gloss: Mateo zegt ja, het is zijn eerste keer, en legt uit dat hij voor de kookworkshop komt.
    note: Vengo al taller geeft de reden van zijn komst aan, met de tegenwoordige tijd voor een situatie die nu speelt.
  es.a1.unit01.lesson06.teach.line03:
    title: Namen uitwisselen
    gloss: Elena zegt dat het ook haar eerste keer is, noemt haar naam en vraagt naar die van Mateo.
    note: Me llamo is een natuurlijke manier om je naam te zeggen. In het Spaans laat je yo meestal weg, omdat de werkwoordsvorm al aangeeft wie spreekt (net als in het Nederlands is het persoonlijk voornaamwoord hier dus niet nodig).
  es.a1.unit01.lesson06.teach.line04:
    title: Namen uitwisselen, antwoord
    gloss: Mateo noemt zijn naam en zegt dat hij blij is kennis te maken.
    note: Soy is een andere natuurlijke manier om je naam te zeggen, met ser in plaats van het wederkerende llamarse.
  es.a1.unit01.lesson06.teach.line05:
    title: Naar herkomst vragen
    gloss: Elena beantwoordt de beleefdheid (Insgelijks) en vraagt waar Mateo vandaan komt.
    note: De dónde eres vraagt naar herkomst, met de informele tú-vorm.
  es.a1.unit01.lesson06.teach.line06:
    title: Naar herkomst vragen, antwoord
    gloss: Mateo komt uit Colombia maar woont in Londen, en stelt Elena dan dezelfde vraag.
    note: Soy de drukt herkomst uit, terwijl vivo en de huidige woonplaats aangeeft. Pero verbindt het contrast tussen die twee feiten.
  es.a1.unit01.lesson06.teach.line07:
    title: Over een interesse praten
    gloss: Elena zegt dat ze uit Spanje komt en vraagt of Mateo graag kookt.
    note: Soy beschrijft herkomst, hetzelfde patroon als Mateo net gebruikte.
  es.a1.unit01.lesson06.teach.line08:
    title: Over een interesse praten, antwoord
    gloss: Mateo zegt dat hij heel graag kookt, maar nog aan het leren is.
    note: Estoy aprendiendo beschrijft een activiteit die nu bezig is. Het Nederlands zegt hier vaak 'ik ben aan het leren' of gewoon 'ik leer'; het Spaans gebruikt estar + gerundio.
  es.a1.unit01.lesson06.teach.line09:
    title: Het gesprek afsluiten
    gloss: Elena zegt dat zij ook nog aan het leren is en dat ze elkaar binnen zien.
    note: Nos vemos geeft aan dat ze elkaar straks weer zien, en dentro zegt waar.
  es.a1.unit01.lesson06.teach.line10:
    title: Het gesprek afsluiten, antwoord
    gloss: Mateo stemt in en bevestigt dat ze elkaar zien.
    note: Sí bevestigt Elena's voorstel voordat nos vemos wordt herhaald.
