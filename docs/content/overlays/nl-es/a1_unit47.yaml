teaching:
  es.a1.unit47.lesson01.teach.llamar:
    title: Bellen
    gloss: bellen
    note: De infinitief van het werkwoord voor telefoneren.
    example_gloss: Ik moet je bellen.
  es.a1.unit47.lesson01.teach.te_llamo:
    title: Zeggen dat je belt
    gloss: Ik bel je.
    note: '*Llamo* is de *yo*-vorm van *llamar*; met *te* betekent het letterlijk "ik bel je". Net als in het Nederlands gebruikt het Spaans hier de tegenwoordige tijd voor wat je gaat doen.'
  es.a1.unit47.lesson01.teach.hola_soy_elena:
    title: De telefoon opnemen
    gloss: Hallo, met Elena.
    note: Het Spaans geeft aan wie er aan de telefoon is met *soy* + naam (letterlijk "ik ben"), waar het Nederlands "met" + naam zegt.
  es.a1.unit47.lesson01.teach.hola_soy_mateo:
    title: Mateo neemt op dezelfde manier op
    gloss: Hallo, met Mateo.
    note: Hetzelfde patroon *soy* + naam als in *Hola, soy Elena*.
  es.a1.unit47.lesson02.teach.con_quien_hablo:
    title: Vragen wie er belt
    gloss: Met wie spreek ik?
    note: '*¿Con quién hablo?* is de standaardvraag als je niet weet wie er belt.'
  es.a1.unit47.lesson02.teach.habla_con_elena:
    title: Jezelf formeel voorstellen
    gloss: U spreekt met Elena.
    note: '*Habla con* + naam gebruikt de formele *usted*-vorm van *hablar*: het beleefde equivalent van *soy* + naam.'
  es.a1.unit47.lesson03.teach.puedes_repetir_eso:
    title: Vragen om herhaling
    gloss: Kun je dat herhalen?
    note: '*¿Puedes...?* (Kun je ...?) plus *repetir* (herhalen) plus *eso* (dat).'
  es.a1.unit47.lesson03.teach.no_hables_tan:
    title: Vragen om langzamer te praten
    gloss: Praat niet zo snel, alsjeblieft.
    note: '*No hables* is de ontkennende informele gebiedende wijs van *hablar*; *tan rápido* (zo snel) geeft de mate aan.'
  es.a1.unit47.lesson03.teach.no_te_oigo:
    title: Zeggen dat je niet goed hoort
    gloss: Ik hoor je niet goed.
    note: '*Oír* (horen) met *no ... bien* (niet goed) geeft aan dat je iemand slecht hoort. Dat is iets anders dan *entender* (begrijpen). *Te oigo* betekent „ik hoor je”.'
  es.a1.unit47.lesson04.teach.el_mensaje:
    title: Appje
    gloss: het berichtje
    note: 'Een mannelijk woord: *el mensaje*. In het Spaans zeggen ze ook wel *el SMS* of *el texto*, maar *mensaje* is de neutrale keuze.'
    example_gloss: Het appje is van Elena.
  es.a1.unit47.lesson04.teach.te_envio_un:
    title: Zeggen dat je iets stuurt
    gloss: Ik stuur je een berichtje.
    note: 'Het voornaamwoord *te* (je) staat vóór het werkwoord *enviar* (sturen): *te envío un mensaje*.'
  es.a1.unit47.lesson04.teach.te_llamo_mas:
    title: Zeggen dat je terugbelt
    gloss: Ik bel je straks terug.
    note: '*Más tarde* (later) staat aan het eind van de zin: *te llamo más tarde*.'
  es.a1.unit47.lesson05.teach.mateo_hola_elena:
    title: Lees een appgesprek
    gloss: 'Mateo: Hoi Elena, kun je me bellen? Ik moet je iets vertellen. Elena: Ja, natuurlijk, ik bel je over vijf minuten terug.'
    note: Let op wat Mateo vraagt, waarom, en wanneer Elena zegt terug te bellen.
    glosses:
      Hola: hoi
      puedes: kunnen
      llamarme: bellen
      Tengo: moeten
      algo: iets
      contarte: vertellen
      claro: natuurlijk
      llamada: bellen
      cinco: vijf
      minutos: minuten
      devuelvo: terug
  es.a1.unit47.lesson06.teach.mateo_hola_soy:
    title: Mateo neemt de telefoon op
    gloss: 'Mateo: Hallo, met Mateo.'
    note: 'Hetzelfde patroon *soy* + naam als in de eerste les, nu tijdens een echt telefoongesprek: wie opneemt, spreekt het eerst en noemt zijn naam.'
  es.a1.unit47.lesson06.teach.elena_hola_mateo:
    title: Elena stelt zich voor
    gloss: 'Elena: Hoi Mateo, met Elena. Mateo: Fijn dat je belt!'
    note: '*Gracias por llamar* (bedankt voor het bellen) is *gracias por* + infinitief.'
  es.a1.unit47.lesson06.teach.elena_como_ha:
    title: Elena vraagt naar de dienst
    gloss: 'Elena: Hoe was je eerste dienst?'
    note: '*Ha ido* is het voltooid tegenwoordige tijd van *ir* (hier „verlopen”): *ha* + het voltooid deelwoord *ido*.'
  es.a1.unit47.lesson06.teach.mateo_ha_ido:
    title: Mateo heeft goed nieuws
    gloss: 'Mateo: Het ging heel goed, beter dan ik had verwacht.'
    note: '*Ha ido muy bien* gebruikt dezelfde tijd als de vraag; *mejor de lo esperado* (beter dan verwacht) maakt de vergelijking met *de lo*.'
  es.a1.unit47.lesson06.teach.ha_ido_ir:
    title: Ha ido, es, esperado met hun infinitief
    gloss: ha ido → ir (gaan), es → ser (zijn), esperado → esperar (verwachten)
    note: '*Ha ido*, *es* en *esperado* worden getoond met hun infinitief: *ir*, *ser*, *esperar*. Zie *ha ido muy bien* voorlopig als een vaste uitdrukking; de voltooid tegenwoordige tijd oefen je later pas goed.'
  es.a1.unit47.lesson06.teach.elena_que_bien:
    title: Elena is trots
    gloss: 'Elena: Fijn om te horen! Ik ben trots op je.'
    note: '*Orgulloso/a de* (trots op) is een vaste combinatie met *de*; het bijvoeglijk naamwoord past zich aan de spreker aan (*orgullosa* voor Elena).'
  es.a1.unit47.lesson06.teach.mateo_muchas_gracias:
    title: Mateo is ontroerd
    gloss: 'Mateo: Hartelijk bedankt, dat betekent veel voor me.'
    note: '*Significa* is de derde persoon van *significar* (betekenen); *para mí* (voor mij) geeft aan voor wie het belangrijk is.'
  es.a1.unit47.lesson06.teach.su_primer_turno:
    title: Zijn
    gloss: Zijn eerste dienst is heel goed gegaan.
    note: '*Su* is hier het bezittelijk voornaamwoord „zijn” (ook „haar” of „uw” bij *usted*); uit de context blijkt van wie het is.'
