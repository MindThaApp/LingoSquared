teaching:
  es.a1.unit46.lesson01.teach.no_me_siento:
    title: Je niet goed voelen
    gloss: Ik voel me niet goed.
    note: '*Sentirse* is wederkerend (*me siento*, *te sientes*); *no me siento bien* is de algemene, milde manier om te zeggen dat er iets niet klopt.'
  es.a1.unit46.lesson01.teach.enfermo:
    title: Ziek
    gloss: ziek
    note: 'Een basaal bijvoeglijk naamwoord, gebruikt met *estar* (zijn, voor toestanden): *estoy enfermo*.'
    example_gloss: Ik ben ziek.
  es.a1.unit46.lesson01.teach.estoy_enfermo:
    title: Ziek zijn
    gloss: Ik ben ziek.
    note: '*Enfermo* beschrijft een algemenere, sterkere toestand dan *no me siento bien*; het verandert met het geslacht van de spreker (*enferma*).'
  es.a1.unit46.lesson01.teach.dolor_de_cabeza:
    title: Hoofdpijn
    gloss: hoofdpijn
    note: 'In het Spaans gebruik je *dolor de cabeza* met *tener* en zonder lidwoord: *tengo dolor de cabeza*.'
    example_gloss: Ik heb hoofdpijn.
  es.a1.unit46.lesson01.teach.tengo_dolor_de:
    title: Hoofdpijn hebben
    gloss: Ik heb hoofdpijn.
    note: 'Klachten gaan samen met *tener* (hebben): *tengo dolor de cabeza*, net als in het Nederlands "ik heb hoofdpijn".'
  es.a1.unit46.lesson01.teach.dolor_de_estomago:
    title: Buikpijn
    gloss: buikpijn
    note: 'Hetzelfde patroon zonder lidwoord als bij *dolor de cabeza*: *dolor de estómago*.'
    example_gloss: Ik heb buikpijn.
  es.a1.unit46.lesson01.teach.tengo_dolor_de_2:
    title: Buikpijn hebben
    gloss: Ik heb buikpijn.
    note: Volgt hetzelfde *tener*-patroon als *dolor de cabeza*.
  es.a1.unit46.lesson02.teach.que_pasa:
    title: Algemeen vragen
    gloss: Wat is er aan de hand?
    note: Een algemene manier om te vragen of er iets aan de hand is.
  es.a1.unit46.lesson02.teach.que_te_pasa:
    title: Een veelgebruikte uitdrukking
    gloss: Wat scheelt er?
    note: '*¿Qué te pasa?* is de natuurlijke manier om te vragen wat er aan de hand is (letterlijk "wat gebeurt er met je?"); vertaal het niet woord voor woord.'
  es.a1.unit46.lesson02.teach.dolor_de_garganta:
    title: Keelpijn
    gloss: keelpijn
    note: 'Hetzelfde patroon als *dolor de cabeza* en *dolor de estómago*: *dolor de garganta*.'
    example_gloss: Ik heb keelpijn.
  es.a1.unit46.lesson02.teach.tengo_dolor_de:
    title: Keelpijn hebben
    gloss: Ik heb keelpijn.
    note: Volgt hetzelfde *tener*-patroon als de andere klachten.
  es.a1.unit46.lesson02.teach.estas_bien_no:
    title: Vragen hoe het met iemand gaat
    gloss: Gaat het goed met je? Nee, ik voel me niet goed.
    note: '*¿Estás bien?* is een heel gebruikelijke, informele vraag tussen vrienden; bij iemand die je met *usted* aanspreekt wordt het *¿Está bien?*.'
  es.a1.unit46.lesson03.teach.fiebre:
    title: Koorts
    gloss: koorts
    note: 'Wordt na *tener* zonder lidwoord gebruikt, net als de andere klachten: *tengo fiebre*.'
    example_gloss: Ik heb koorts.
  es.a1.unit46.lesson03.teach.tengo_fiebre:
    title: Koorts hebben
    gloss: Ik heb koorts.
    note: Volgt het *tener*-patroon.
  es.a1.unit46.lesson03.teach.resfriado:
    title: Verkouden zijn
    gloss: verkouden / verkouden zijn
    note: '*Resfriado* is een bijvoeglijk naamwoord dat met *estar* wordt gebruikt; je kunt ook *tengo un resfriado* zeggen, met het zelfstandig naamwoord *resfriado*.'
    example_gloss: Ik ben verkouden.
  es.a1.unit46.lesson03.teach.estoy_resfriado:
    title: Zeggen dat je verkouden bent
    gloss: Ik ben verkouden.
    note: 'Net als in het Nederlands ("ik ben verkouden") gebruik je in het Spaans een bijvoeglijk naamwoord: *estoy resfriado*; het verandert met het geslacht van de spreker (*resfriada*).'
  es.a1.unit46.lesson03.teach.enfermo_y_resfriado:
    title: Estar of tener hangt af van het soort woord
    gloss: 'Enfermo en resfriado zijn bijvoeglijke naamwoorden en gebruiken estar: ik ben ziek, ik ben verkouden. Fiebre en dolor de cabeza zijn zelfstandige naamwoorden en gebruiken tener: ik heb koorts, ik heb hoofdpijn.'
    note: 'De keuze tussen *estar* en *tener* hangt af van het soort woord: bijvoeglijke naamwoorden (*enfermo*, *resfriado*) gebruiken *estar*, zelfstandige naamwoorden voor klachten (*fiebre*, *dolor de cabeza*) gebruiken *tener*.'
  es.a1.unit46.lesson04.teach.la_farmacia:
    title: De apotheek
    gloss: de apotheek
    note: 'Een vrouwelijk woord: *la farmacia*.'
    example_gloss: Ik ga naar de apotheek.
  es.a1.unit46.lesson04.teach.en_que_puedo:
    title: De begroeting van de apotheker
    gloss: Waarmee kan ik u helpen?
    note: '*¿En qué puedo ayudarle?* is een standaard beleefde servicevraag; *ayudarle* gebruikt het beleefde voornaamwoord *le* van *usted*.'
  es.a1.unit46.lesson04.teach.tiene_algo_para:
    title: Om iets vragen tegen een klacht
    gloss: Heeft u iets tegen hoofdpijn?
    note: '*Algo para* + klacht is de natuurlijke manier om om een middel te vragen: *algo para el dolor de cabeza*.'
  es.a1.unit46.lesson04.teach.una_pastilla:
    title: Een tablet
    gloss: een tablet / pil
    note: 'Een vrouwelijk woord: *la pastilla*; *una pastilla* is een pil of tablet.'
    example_gloss: Ik neem een tablet.
  es.a1.unit46.lesson04.teach.toma_una_pastilla:
    title: Doseringsinstructies
    gloss: Neem twee keer per dag een tablet.
    note: '*Toma* is de informele gebiedende wijs van *tomar* (nemen), die je gebruikt voor instructies.'
  es.a1.unit46.lesson04.teach.en_la_farmacia:
    title: Taalregister in de apotheek
    gloss: In de apotheek gebruik je de beleefdheidsvorm usted (u).
    note: 'De apotheker is een onbekende volwassene in een dienstverlenende rol, dus gebruik je *usted*: *¿Tiene algo...?* in plaats van *¿Tienes algo...?*.'
  es.a1.unit46.lesson05.teach.consejo_toma_una:
    title: Lees een advies uit de apotheek
    gloss: 'Advies: neem twee keer per dag een tablet met water. Rust goed uit en drink veel water. Voel je je na drie dagen nog steeds niet goed? Ga dan naar de dokter.'
    note: Let op de dosering, de twee adviezen zonder medicijn en wanneer je naar de dokter moet.
    glosses:
      Consejo: advies
      toma: nemen
      veces: keer
      día: dag
      pastilla: tablet
      Descansa: rusten
      bebe: drinken
      sentirte: voelen
      sigues: nog steeds
      bien: goed
      médico: dokter / huisarts
  es.a1.unit46.lesson06.teach.elena_hola_mateo:
    title: Elena vraagt hoe het gaat
    gloss: 'Elena: Hoi Mateo, hoe gaat het? Voel je je al beter?'
    note: '*Ya* (al, inmiddels) laat zien dat Elena vraagt of Mateo vooruit is gegaan sinds ze elkaar voor het laatst spraken; *te sientes* is de informele *tú*-vorm van *sentirse*.'
  es.a1.unit46.lesson06.teach.mateo_todavia_no:
    title: Mateo is nog steeds niet fit
    gloss: 'Mateo: Nog niet zo goed. Ik heb nog steeds hoofdpijn en ben moe.'
    note: '*Sigo con* (ik heb nog steeds) laat zien dat de hoofdpijn niet is verdwenen; *cansado* (moe) is een nieuw, nuttig bijvoeglijk naamwoord dat van geslacht verandert (*cansada*).'
  es.a1.unit46.lesson06.teach.elena_has_tomado:
    title: Elena vraagt naar het medicijn
    gloss: 'Elena: Heb je een tablet genomen?'
    note: '*Has tomado* is de voltooid tegenwoordige tijd: *has* + het voltooid deelwoord *tomado*, hetzelfde patroon als *me has ayudado*.'
  es.a1.unit46.lesson06.teach.mateo_si_he:
    title: Mateo bevestigt het
    gloss: 'Mateo: Ja, ik heb een tablet genomen. Nu ga ik rusten.'
    note: '*Voy a descansar* (ik ga rusten) gebruikt het patroon voor de nabije toekomst: *ir a* + infinitief.'
  es.a1.unit46.lesson06.teach.elena_buena_idea:
    title: Elena wenst hem beterschap
    gloss: 'Elena: Goed idee. Rust lekker uit. Beterschap!'
    note: '*¡Que te mejores!* is de vaste uitdrukking om iemand beterschap te wensen; er staat de aanvoegende wijs *mejores* in.'
  es.a1.unit46.lesson06.teach.mateo_gracias_hasta:
    title: Mateo neemt afscheid
    gloss: 'Mateo: Bedankt, tot morgen!'
    note: '*Hasta mañana* volgt het patroon *hasta* + tijdsaanduiding, zoals andere afscheidsgroeten als *hasta luego*.'
