answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spaans A1
  description: Woordenschat over de directe en verdere familie, bezittelijke voornaamwoorden en het beschrijven van een gezin, als vervolg op het kookworkshopverhaal van Elena en Mateo uit unit 01-02. Extra aandacht gaat uit naar het verschil tussen mi/tu/su en naar familiewoorden met een mannelijke en vrouwelijke vorm.
units:
  es.a1.unit03.family:
    title: De families van Elena en Mateo
lessons:
  es.a1.unit03.lesson01.immediate_family:
    title: Naaste familie
  es.a1.unit03.lesson02.possessives_and_asking:
    title: 'Bezittelijk: mi, tu, su'
  es.a1.unit03.lesson03.extended_family:
    title: Verdere familie
  es.a1.unit03.lesson04.describing_family_size:
    title: Hoeveel mensen zijn er thuis
  es.a1.unit03.lesson05.reading_a_family_profile:
    title: Een familieprofiel lezen
  es.a1.unit03.lesson06.family_photos_dialogue:
    title: Familiefoto's met Elena en Mateo
teaching:
  es.a1.unit03.lesson01.teach.madre:
    title: Moeder
    gloss: moeder
    note: '*Madre* is vrouwelijk. *Mamá* is het gebruikelijkere alledaagse woord binnen de familie, terwijl *madre* neutraal is en in de woordenlijsten van deze cursus wordt gebruikt.'
  es.a1.unit03.lesson01.teach.padre:
    title: Vader
    gloss: vader
    note: '*Padre* is mannelijk. *Papá* is het alledaagse equivalent, net als *madre*/*mamá*.'
  es.a1.unit03.lesson01.teach.hermano:
    title: Broer
    gloss: broer
    note: '*Hermano* is mannelijk enkelvoud.'
  es.a1.unit03.lesson01.teach.hermana:
    title: Zus
    gloss: zus
    note: '*Hermana* is vrouwelijk enkelvoud.'
  es.a1.unit03.lesson01.teach.hijo:
    title: Zoon
    gloss: zoon
    note: '*Hijo* is mannelijk enkelvoud.'
  es.a1.unit03.lesson01.teach.hija:
    title: Dochter
    gloss: dochter
    note: '*Hija* is vrouwelijk enkelvoud.'
  es.a1.unit03.lesson01.teach.padres:
    title: Ouders
    gloss: ouders
    note: '*Padres* (mannelijk meervoud) wordt gebruikt voor een gemengd paar (moeder en vader samen). Het Spaans doet dit altijd wanneer een groep minstens één man bevat.'
  es.a1.unit03.lesson01.teach.hermanos:
    title: Broers en zussen
    gloss: broers en zussen; broers
    note: '*Hermanos* kan "broers" (alleen jongens) of "broers en zussen" (gemengde groep) betekenen, volgens dezelfde regel als *padres*: het mannelijk meervoud geldt ook voor gemengde groepen.'
  es.a1.unit03.lesson02.teach.mi_familia:
    title: Mijn familie
    gloss: mijn familie
    note: '*Mi* (zonder accent) is het bezittelijk voornaamwoord "mijn"; het verandert niet naargelang het geslacht, alleen naargelang het getal (*mis* bij meervoud).'
  es.a1.unit03.lesson02.teach.tu_familia:
    title: Jouw familie (informeel)
    gloss: jouw familie
    note: '*Tu* (zonder accent, anders dan het persoonlijk voornaamwoord *tú*) is het informele bezittelijk voornaamwoord, passend bij het *tú*-register uit Unit 1.'
  es.a1.unit03.lesson02.teach.su_familia:
    title: Uw/zijn/haar familie (formeel of derde persoon)
    gloss: zijn/haar/uw familie
    note: '*Su* betekent "zijn", "haar" ÉN het formele "uw" (*usted*). Het Spaans maakt hier met het bezittelijk voornaamwoord zelf geen onderscheid; de context maakt de betekenis duidelijk.'
  es.a1.unit03.lesson02.teach.tienes_hermanos:
    title: Vragen naar broers en zussen
    gloss: Heb je broers of zussen?
    note: '*Tienes* is de *tú*-vorm van *tener*, hetzelfde werkwoord dat in Unit 2 voor leeftijd werd gebruikt.'
  es.a1.unit03.lesson02.teach.tengo_dos_hermanas:
    title: Het aantal broers en zussen noemen
    gloss: Ik heb twee zussen.
    note: '*Tengo* (ik heb) met een getal en het familiewoord is de standaardmanier om je broers en zussen te beschrijven.'
  es.a1.unit03.lesson02.teach.tu_familia_es_grande:
    title: Vragen of een familie groot is
    gloss: Is jouw familie groot?
    note: '*Grande* (groot) verandert niet naargelang het geslacht, alleen naargelang het getal (*grandes*).'
  es.a1.unit03.lesson02.teach.mi_familia_es_pequena:
    title: Een kleine familie beschrijven
    gloss: Mijn familie is klein.
    note: '*Pequeña* komt overeen met het vrouwelijke woord *familia*; de mannelijke vorm *pequeño* gebruik je bij een mannelijk zelfstandig naamwoord.'
  es.a1.unit03.lesson03.teach.abuelo:
    title: Grootvader
    gloss: grootvader
    note: '*Abuelo* is mannelijk enkelvoud.'
  es.a1.unit03.lesson03.teach.abuela:
    title: Grootmoeder
    gloss: grootmoeder
    note: '*Abuela* is vrouwelijk enkelvoud.'
  es.a1.unit03.lesson03.teach.abuelos:
    title: Grootouders
    gloss: grootouders
    note: '*Abuelos* (mannelijk meervoud) wordt gebruikt voor een gemengd paar, net als *padres* en *hermanos*.'
  es.a1.unit03.lesson03.teach.tio:
    title: Oom
    gloss: oom
    note: '*Tío* heeft een accent omdat de klemtoon op de *í* valt; zo vormen de klinkers geen tweeklank.'
  es.a1.unit03.lesson03.teach.tia:
    title: Tante
    gloss: tante
    note: '*Tía* heeft hetzelfde accent als *tío*, om dezelfde reden.'
  es.a1.unit03.lesson03.teach.primo:
    title: Neef
    gloss: neef
    note: '*Primo* is mannelijk enkelvoud; het Spaans geeft anders dan het Nederlandse "neef" en "nicht" ook hier het geslacht aan met een eigen vorm: primo en prima.'
  es.a1.unit03.lesson03.teach.prima:
    title: Nicht
    gloss: nicht
    note: '*Prima* is vrouwelijk enkelvoud.'
  es.a1.unit03.lesson03.teach.mis_abuelos:
    title: Mijn grootouders
    gloss: mijn grootouders
    note: '*Mis* is de meervoudsvorm van *mi* en is verplicht wanneer het zelfstandig naamwoord meervoud is, ongeacht het geslacht.'
  es.a1.unit03.lesson04.teach.cuantos_hermanos_tienes:
    title: Vragen hoeveel broers en zussen iemand heeft
    gloss: Hoeveel broers en zussen heb je?
    note: '*Cuántos* (mannelijk meervoud, omdat *hermanos* ook een gemengde groep omvat) komt overeen met het zelfstandig naamwoord waar je naar vraagt.'
  es.a1.unit03.lesson04.teach.somos_cinco:
    title: Zeggen hoeveel mensen er thuis wonen
    gloss: We zijn thuis met z'n vijven.
    note: '*Somos* (wij zijn) is in het Spaans de gewone manier om te zeggen hoeveel mensen er in het huishouden wonen. Het Spaans gebruikt hier dus "wij zijn" en niet een woordelijke vertaling van "er zijn".'
  es.a1.unit03.lesson04.teach.mi_familia_es_grande:
    title: Een grote familie beschrijven
    gloss: Mijn familie is groot.
    note: '*Grande* hoort hier bij *familia* (vrouwelijk), maar heeft dezelfde vorm als bij mannelijke woorden: *grande*. Bijvoeglijke naamwoorden die op -e eindigen, zoals *grande*, veranderen namelijk niet naar geslacht.'
  es.a1.unit03.lesson04.teach.tengo_muchos_primos:
    title: Zeggen dat je veel neven en nichten hebt
    gloss: Ik heb veel neven en nichten.
    note: '*Muchos* (mannelijk meervoud) wordt gebruikt omdat *primos*, net als *hermanos* en *padres*, ook naar een gemengde groep kan verwijzen.'
  es.a1.unit03.lesson04.teach.vives_cerca_de_tus_padres:
    title: Vragen of iemand dicht bij zijn ouders woont
    gloss: Woon je dicht bij je ouders?
    note: '*Tus* is het meervoud van *tu* en is nodig omdat *padres* meervoud is.'
  es.a1.unit03.lesson04.teach.vivo_con_mis_abuelos:
    title: Zeggen met wie je samenwoont
    gloss: Ik woon bij mijn grootouders.
    note: '*Con* (met) introduceert de mensen met wie je woont. *Vivo* is de *yo*-vorm van *vivir*, die je al kent van *vivo en Londres* in Unit 1.'
  es.a1.unit03.lesson05.teach.profile_reading:
    title: Het familieprofiel van Elena
    gloss: 'Ik heet Elena. Ik ben eenendertig en ik woon met mijn grootouders in Spanje. Mijn moeder en mijn vader wonen in Barcelona. Ik heb een zus en een broer: we zijn thuis met z''n vijven. Mijn jongere zus heet Sofía en is twintig.'
    note: 'Dit profiel gebruikt woordenschat en structuren uit les 1-4 in één samenhangende korte tekst in plaats van losse zinnen. Het oefent dezelfde vaardigheid als de leestoets van deze unit: begrijpen wie wie is.'
    glosses:
      llamo: heet (van llamarse)
      Tengo: ik ben / ik heb (van tener)
      treinta: dertig
      años: jaar oud
      vivo: wonen (van vivir)
      abuelos: grootouders
      madre: moeder
      padre: vader
      viven: wonen (van vivir)
      hermana: zus
      hermano: broer
      somos: wij zijn (van ser)
      cinco: vijf
      casa: thuis
      menor: jonger
      tiene: is / heeft (van tener)
      veinte: twintig
  es.a1.unit03.lesson05.teach.hermana_menor:
    title: Jongere zus
    gloss: jongere zus
    note: '*Menor* (jonger) staat na het zelfstandig naamwoord waar het bij hoort en verandert niet naar geslacht.'
  es.a1.unit03.lesson05.teach.vive_third_person:
    title: Woont (derde persoon)
    gloss: woont
    note: '*Vive* is de derde persoon enkelvoud van *vivir*. Je gebruikt het om over iemand anders te praten (*Elena vive*...) en niet over jezelf (*vivo*, dat je zag in les 4 van Unit 1 en opnieuw in les 4 van deze unit).'
  es.a1.unit03.lesson05.teach.sus_third_person_plural:
    title: Haar/zijn/hun (met meervoud)
    gloss: haar/zijn/hun
    note: '*Sus* is het meervoud van *su*. Net zoals *su* voor "zijn/haar/uw" bij een enkelvoudig woord staat, gebruik je sus bij een meervoudig woord: *sus abuelos* betekent "haar grootouders" als het over Elena gaat.'
  es.a1.unit03.lesson06.teach.line01:
    title: Familiefoto's laten zien
    gloss: Elena laat Mateo een foto zien en stelt haar ouders en haar jongere zus voor.
    note: '*Estos son* (dit zijn, mannelijk/gemengd meervoud) introduceert de ouders; *esta es* (dit is, vrouwelijk enkelvoud) introduceert de zus.'
  es.a1.unit03.lesson06.teach.line02:
    title: Reageren en naar broers en zussen vragen
    gloss: Mateo reageert hartelijk en vraagt of ze nog meer broers of zussen heeft.
    note: '*Qué bonito* is een natuurlijke, hartelijke reactie op een foto. Het lijkt qua functie op *Qué bien* uit Unit 1.'
  es.a1.unit03.lesson06.teach.line03:
    title: Het huishouden noemen en de vraag teruggeven
    gloss: Elena zegt dat ze een zus en een broer heeft, dus met z'n vijven thuis, en vraagt dan naar Mateo's familie.
    note: '*Somos cinco en casa* geeft aan hoeveel mensen er in totaal thuis wonen, in het patroon van les 4.'
  es.a1.unit03.lesson06.teach.line04:
    title: Een kleinere familie beschrijven
    gloss: 'Mateo zegt dat zijn familie kleiner is, met z''n drieën: zijn ouders en hij. Maar hij heeft veel neven en nichten.'
    note: '*Pero* (maar) geeft het contrast aan tussen een klein gezin en een grote verdere familie.'
  es.a1.unit03.lesson06.teach.line05:
    title: Vragen of iemand dicht bij zijn ouders woont
    gloss: Elena vraagt of Mateo dicht bij zijn ouders woont.
    note: '*Cerca de* (dicht bij) is een veelgebruikte manier om fysieke nabijheid te beschrijven.'
  es.a1.unit03.lesson06.teach.line06:
    title: Uitleggen dat het ver is en hoe je contact houdt
    gloss: Mateo zegt nee, ze wonen in Colombia en ze bellen elkaar elke week.
    note: 'Dit sluit aan op wat je in Unit 1 leerde: Mateo komt uit Colombia maar woont in Londen. Zijn ouders blijven in Colombia.'
  es.a1.unit03.lesson06.teach.line07:
    title: Begrip tonen en je eigen situatie delen
    gloss: Elena zegt dat ze het begrijpt en dat ze hier in Spanje bij haar grootouders woont.
    note: '*Entiendo* (ik begrijp het) is een korte, natuurlijke manier om te reageren op wat iemand zegt voordat je er iets eigens aan toevoegt.'
  es.a1.unit03.lesson06.teach.line08:
    title: Afsluiten met een warme opmerking
    gloss: Mateo zegt dat het fijn is om je familie dichtbij te hebben.
    note: '*Qué bien tener a la familia cerca* sluit het gesprek af met een warme, bedachtzame opmerking, in het patroon van *qué bien* en *qué bonito* in dit dialoog.'
