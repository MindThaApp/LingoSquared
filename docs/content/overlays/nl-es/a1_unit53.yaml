teaching:
  es.a1.unit53.lesson01.teach.el_animal_la:
    title: Dier, een huisdier
    gloss: het dier / een huisdier
    note: '*Animal* is het algemene woord en *mascota* betekent specifiek huisdier; *mascota* is vrouwelijk, ook bij een mannelijk dier.'
    example_gloss:
    - Een hond is een dier.
    - Een hond is ook een huisdier.
  es.a1.unit53.lesson01.teach.el_perro_el:
    title: Hond en kat
    gloss: de hond / de kat
    example_gloss:
    - Elena heeft een hond.
    - Diego heeft een kat.
  es.a1.unit53.lesson01.teach.el_pez_el:
    title: Vis en vogel
    gloss: de vis / de vogel
    example_gloss:
    - Opa heeft een vis.
    - Nina heeft een vogel.
  es.a1.unit53.lesson01.teach.tienes_mascota:
    title: Heb je een huisdier?
    gloss: Heb je een huisdier?
    note: Dezelfde vraagvorm *¿Tienes ...?* die je al kent uit eerdere units.
  es.a1.unit53.lesson01.teach.si_tengo_un:
    title: Ja, ik heb een hond
    gloss: Ja, ik heb een hond.
    note: Een eenvoudig bevestigend antwoord met de nieuwe woorden uit deze les.
  es.a1.unit53.lesson01.teach.no_no_tengo:
    title: Nee, ik heb geen huisdier
    gloss: Nee, ik heb geen huisdier.
    note: Bij *No tengo mascota* zet je gewoon *no* voor het werkwoord; zie de grammaticanotitie.
  es.a1.unit53.lesson01.teach.para_decir_que:
    title: 'No tengo: zeggen dat je iets niet hebt'
    gloss: 'Om te zeggen dat je iets niet hebt, zet je no voor tengo: No tengo tiempo, no tengo mascota.'
    note: Hergebruikt het patroon *no tengo* uit *No tengo tiempo*; alleen het zelfstandig naamwoord is nieuw.
  es.a1.unit53.lesson02.teach.sacar_a_pasear:
    title: Een dier uitlaten
    gloss: uitlaten (een dier)
    note: '*Sacar a pasear* is een vaste uitdrukking: *sacar* ("naar buiten brengen") + *a pasear* ("om te wandelen").'
    example_gloss: Ik laat elke dag de hond uit.
  es.a1.unit53.lesson02.teach.cuando_el_objeto:
    title: Sacar a pasear en de persoonlijke a
    gloss: 'Als het lijdend voorwerp een dier of een persoon is, komt er een a voor: saco al perro a pasear.'
    note: Hergebruikt *saco al perro* van de vorige kaart; de persoonlijke *a* staat voor dieren of mensen om wie je geeft.
  es.a1.unit53.lesson02.teach.dar_de_comer:
    title: Voeren
    gloss: te eten geven
    example_gloss: Ik geef elke dag de kat te eten.
  es.a1.unit53.lesson02.teach.jugar_con:
    title: Spelen met
    gloss: spelen met
    example_gloss: Diego speelt met zijn kat.
  es.a1.unit53.lesson02.teach.saco_al_perro:
    title: Ik laat de hond elke dag uit
    gloss: Ik laat elke dag de hond uit.
    note: '*Sacar a pasear* combineert met *todos los días* (elke dag), dat je al kent uit een eerdere unit; *a* + *el* wordt *al*.'
  es.a1.unit53.lesson02.teach.le_doy_de:
    title: Ik geef de kat elke dag te eten
    gloss: Ik geef elke dag de kat te eten.
    note: '*Dar de comer* ("te eten geven") betekent voeren; *le* verwijst naar het dier: *le doy de comer al gato*.'
  es.a1.unit53.lesson03.teach.el_plural_termina:
    title: 'Plural: perro → perros'
    gloss: 'Het meervoud eindigt op -s: perro → perros, gato → gatos. Na een medeklinker is het -es: animal → animales.'
    note: Het regelmatige Spaanse meervoud wordt hier voor het eerst geïntroduceerd, met dierennamen als voorbeelden.
  es.a1.unit53.lesson03.teach.perros_gatos:
    title: Honden en katten
    gloss: honden / katten
    example_gloss:
    - Mateo houdt van honden.
    - Lucía houdt van katten.
  es.a1.unit53.lesson03.teach.peces_pajaros:
    title: Vissen en vogels (meervoud)
    gloss: vissen / vogels
    example_gloss:
    - Ik hou van vissen.
    - Opa houdt van vogels.
  es.a1.unit53.lesson03.teach.me_encantan_los:
    title: Ik hou van dieren
    gloss: Ik hou van dieren.
    note: '*Me encantan* staat in het meervoud omdat *los animales* meervoud is: het werkwoord richt zich naar datgene waarvan je houdt.'
  es.a1.unit53.lesson03.teach.a_lucia_le:
    title: Lucía houdt van katten, maar heeft geen huisdier
    gloss: Lucía houdt van katten, maar ze heeft geen huisdier.
    note: Bereidt het contrast voor waar de leestekst van deze les om draait.
  es.a1.unit53.lesson04.teach.mateo_tienes_mascota:
    title: Mateo vraagt naar een huisdier
    gloss: 'Mateo: Heb je een huisdier, Elena?'
  es.a1.unit53.lesson04.teach.elena_si_tengo:
    title: Elena heeft een hond
    gloss: 'Elena: Ja, ik heb een hond.'
  es.a1.unit53.lesson04.teach.mateo_como_es:
    title: Mateo vraagt hoe hij eruitziet
    gloss: 'Mateo: Hoe ziet hij eruit?'
    note: Hergebruikt *¿Cómo es?* uit de eerdere unit over uiterlijk, nu gevraagd over een dier.
  es.a1.unit53.lesson04.teach.elena_tiene_el:
    title: Elena beschrijft haar hond
    gloss: 'Elena: Hij heeft bruin haar en hij is klein.'
    note: Hier komen de woorden voor haarkleur en grootte uit de les over uiterlijk terug, nu om de vacht van een dier te beschrijven in plaats van het haar van een persoon.
  es.a1.unit53.lesson04.teach.el_y_lo:
    title: Él en lo voor dieren
    gloss: Él en lo kunnen ook naar een dier verwijzen, niet alleen naar een persoon.
    note: Tot nu toe sloeg *él* in deze cursus altijd op een persoon; dit wijst expliciet op het gebruik voor dieren, samen met *lo* ("hem, het") als lijdend voorwerpspronomen.
  es.a1.unit53.lesson04.teach.mateo_lo_sacas:
    title: Mateo vraagt naar het uitlaten
    gloss: 'Mateo: Laat je hem elke dag uit?'
  es.a1.unit53.lesson04.teach.elena_si_lo:
    title: Elena beschrijft haar routine
    gloss: 'Elena: Ja, ik laat hem elke dag uit en ik geef hem te eten.'
  es.a1.unit53.lesson05.teach.a_mateo_y:
    title: Mateo, Lucía en Diego over dieren
    gloss: 'Mateo en Lucía houden allebei van dieren, maar geen van beiden heeft een huisdier. Mateo houdt van honden en Lucía houdt van katten. Diego heeft wél een huisdier: een kat. Hij speelt vaak met zijn kat en geeft hem elke dag te eten. Heb jij een huisdier?'
    note: 'Zet van dieren houden tegenover er echt een hebben: dat is het communicatieve doel van deze les.'
    glosses:
      encantan: houden van
      dos: beide
      animales: dieren
      ninguno: beide
      mascota: huisdier
      perros: honden
      gatos: katten
      gato: kat
      juega: speelt
      da: geeft
      todos: elke
      comer: voer
  es.a1.unit53.lesson05.teach.diego_juega_a:
    title: Diego speelt vaak met zijn kat
    gloss: Diego speelt vaak met zijn kat.
    note: Hergebruikt *a menudo* (vaak), dat je al kent uit eerdere units.
  es.a1.unit53.lesson05.teach.me_encantan_los:
    title: Ik hou van honden. Ik heb geen huisdier.
    gloss: Ik hou van honden. Ik heb geen huisdier.
    note: Een voorbeeldantwoord van twee zinnen, dat je kunt hergebruiken voor de schrijfopdracht van deze les.
  es.a1.unit53.lesson06.teach.elena_nina_tu:
    title: Elena vraagt het aan Nina
    gloss: 'Elena: Nina, heb jij ook een huisdier?'
  es.a1.unit53.lesson06.teach.nina_si_tengo:
    title: Nina heeft een vogel die Pico heet
    gloss: 'Nina: Ja, ik heb een vogel. Hij heet Pico.'
    note: '*Se llama* ("heet") hergebruikt de naamzin uit de allereerste unit.'
  es.a1.unit53.lesson06.teach.mateo_que_bien:
    title: Mateo reageert
    gloss: 'Mateo: Wat leuk! Wat doe je elke dag met hem?'
  es.a1.unit53.lesson06.teach.nina_le_doy:
    title: Nina geeft hem elke dag te eten
    gloss: 'Nina: Ik geef hem elke dag te eten.'
  es.a1.unit53.lesson06.teach.mateo_a_mi:
    title: Mateo houdt ook van vogels
    gloss: 'Mateo: Ik ben ook dol op vogels.'
  es.a1.unit53.lesson06.teach.elena_que_bien:
    title: Elena sluit het gesprek af
    gloss: 'Elena: Leuk dat wij alle drie van dieren houden!'
    note: Rondt het gesprek af met wat alle drie de personages in deze les over dieren hebben verteld.
