  es.a1.unit06.lesson06.el_almuerzo_dialogue:
    title: De lunch van Elena en Mateo
teaching:
  es.a1.unit06.lesson01.teach.sandwich_ensalada:
    title: Sandwich, salade
    gloss: sandwich, salade
    note: Beide woorden zijn geleend of aangepast -- *sándwich* is een directe leenwoord uit het Engels, geschreven met een accent om de beklemtoonde lettergreep aan te geven.
    example_gloss:
    - Ik wil een sandwich.
    - De salade bevat tomaat.
  es.a1.unit06.lesson01.teach.sopa:
    title: Soep
    gloss: soep
    note: '*Sopa* is vrouwelijk, zoals de meeste Spaanse woorden die op -a eindigen.'
    example_gloss: De soep is heel lekker.
  es.a1.unit06.lesson01.teach.agua_cafe:
    title: Water, koffie
    gloss: water, koffie
    note: '*Agua* is grammaticaal vrouwelijk, maar krijgt in het enkelvoud het mannelijke lidwoord *el* (niet *la*), omdat het met een beklemtoonde *a* begint -- een echte Spaanse onregelmatigheid, geen tikfout.'
    example_gloss:
    - Ik wil graag water.
    - Voor mij een koffie.
  es.a1.unit06.lesson02.teach.quiero_un_sandwich:
    title: Ik wil een sandwich
    gloss: Ik wil een sandwich.
    note: '*Quiero* (ik wil) is de ik-vorm van *querer*, een nieuw werkwoord in deze unit.'
  es.a1.unit06.lesson02.teach.para_mi_un_cafe:
    title: Voor mij een koffie
    gloss: Voor mij een koffie.
    note: '*Para mí* (voor mij) is een veelgebruikte alternatieve bestelzin, waarmee je het gerecht noemt zonder werkwoord -- zie de volgende grammaticanotitie.'
  es.a1.unit06.lesson02.teach.que_quieres_comer:
    title: Vragen wat iemand wil eten
    gloss: Wat wil je eten?
    note: '*Quieres* is de *tú*-vorm van *querer*, de informele aanspreekvorm voor vrienden.'
  es.a1.unit06.lesson02.teach.quiero_vs_para_mi_note:
    title: Quiero of Para mí
    gloss: Twee even natuurlijke manieren om te bestellen.
    note: '*Quiero un café* en *Para mí, un café* zijn allebei prima bij het bestellen.'
    target_text: '*Quiero* ("ik wil") en *Para mí* ("voor mij", gezegd vóór je het gerecht noemt) zijn allebei natuurlijke, even beleefde manieren om in een informele situatie te bestellen -- geen van beide is beter dan de andere.'
  es.a1.unit06.lesson03.teach.el_menu:
    title: De menukaart
    gloss: het menu
    note: '*Menú* heeft een accent omdat de klemtoon op de laatste lettergreep valt.'
    example_gloss: Kunnen we het menu zien?
  es.a1.unit06.lesson03.teach.podemos_ver_el_menu:
    title: Om het menu vragen
    gloss: Kunnen we het menu zien?
    note: '*Podemos* (we kunnen) is de wij-vorm van *poder*, een nieuw werkwoord in deze unit.'
  es.a1.unit06.lesson03.teach.aqui_tiene:
    title: Alstublieft
    gloss: Alstublieft.
    note: '*Aquí tiene* is de standaardzin van een ober als hij iets aan een klant geeft. Hij gebruikt de beleefde *usted*-vorm, ook in een verder informeel gesprek -- een vaste beleefdheidsformule, geen wisseling van register.'
  es.a1.unit06.lesson03.teach.buen_provecho:
    title: Eet smakelijk
    gloss: Eet smakelijk
    note: '*Buen provecho* zeg je gewoonlijk voordat iemand begint te eten, vergelijkbaar met ons "eet smakelijk".'
    example_gloss: Alstublieft. Eet smakelijk.
  es.a1.unit06.lesson04.teach.el_postre:
    title: Nagerecht
    gloss: nagerecht
    note: '*Postre* is mannelijk.'
    example_gloss: Als nagerecht wil ik taart.
  es.a1.unit06.lesson04.teach.de_postre_quiero_pastel:
    title: Een nagerecht bestellen
    gloss: Als nagerecht wil ik taart.
    note: '*De postre* (als nagerecht) leidt in wat iemand als laatste gang bestelt, volgens hetzelfde patroon als *para mí* bij een hoofdbestelling.'
  es.a1.unit06.lesson04.teach.la_cuenta_por_favor:
    title: Om de rekening vragen
    gloss: De rekening, alsjeblieft.
    note: '*La cuenta* (de rekening) is de standaardmanier om aan het eind van een maaltijd te vragen om af te rekenen.'
  es.a1.unit06.lesson05.teach.menu_reading:
    title: Het menu lezen
    gloss: 'Menu: sandwich, vijf. Salade, acht. Soep, drie. Koffie of water, inbegrepen. Nagerecht: taart.'
    note: Een realistische opmaak van een menukaart, met de woordenschat van deze unit en prijzen erbij.
    glosses:
      Menú: menu
      sándwich: sandwich
      Ensalada: salade
      Sopa: soep
      Café: koffie
      agua: water
      incluido: inbegrepen
      Postre: nagerecht
      pastel: taart
  es.a1.unit06.lesson05.teach.incluido_note:
    title: Incluido (inbegrepen)
    gloss: Wat het betekent als een drankje als inbegrepen staat aangegeven.
    note: '*Incluido* = inbegrepen, zonder extra kosten.'
    target_text: '*Incluido* (inbegrepen) betekent dat er een drankje bij de maaltijd zit, zonder extra kosten.'
  es.a1.unit06.lesson06.teach.line01:
    title: Begroeten en de bestelling opnemen
    gloss: De ober begroet Elena en Mateo en vraagt wat ze willen eten.
    note: '*Buenas tardes* (goedemiddag) gebruik je vanaf de middag, dus het past bij de lunch.'
  es.a1.unit06.lesson06.teach.line02:
    title: Elena bestelt
    gloss: Elena bestelt een salade en water, alsjeblieft.
    note: '*Una ensalada y agua* = een salade en water.'
  es.a1.unit06.lesson06.teach.line03:
    title: Mateo bestelt
    gloss: Mateo bestelt een sandwich en een koffie, voor zichzelf.
    note: Hij gebruikt *Para mí* in plaats van *Quiero* te herhalen.
  es.a1.unit06.lesson06.teach.line04:
    title: Naar het nagerecht vragen
    gloss: De ober keurt het goed en vraagt of ze nog een nagerecht willen.
    note: '*¿Algo de postre?* (iets als nagerecht?) is een natuurlijke, korte manier om een nagerecht aan te bieden.'
  es.a1.unit06.lesson06.teach.line05:
    title: Een nagerecht om te delen bestellen
    gloss: Elena zegt ja, één taart voor hen tweeën.
    note: '*Para los dos* (voor ons tweeën) betekent dat ze één nagerecht delen, een natuurlijke keuze in het echte leven.'
  es.a1.unit06.lesson06.teach.line06:
    title: Instemmen en om de rekening vragen
    gloss: Mateo is het ermee eens en vraagt om de rekening.
    note: '*La cuenta, por favor* = de rekening, alsjeblieft.'
  es.a1.unit06.lesson06.teach.line07:
    title: De rekening overhandigen
    gloss: De ober geeft hun de rekening.
    note: '*Aquí tiene* zeg je als je iets overhandigt.'
  es.a1.unit06.lesson06.teach.line08:
    title: Warm afsluiten
    gloss: Elena bedankt de ober en zegt dat het eten heerlijk was.
    note: '*¡Qué buena comida!* gebruikt hetzelfde uitroeppatroon met *¡Qué ...!* als *¡Qué bien!* en *¡Qué bonito!*.'
