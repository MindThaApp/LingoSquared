answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spaans A1
  description: Spaans voor beginners om eenvoudige plannen voor te stellen, te accepteren, af te slaan, in te plannen, te lezen en te schrijven.
units:
  es.a1.unit50.plans:
    title: Eenvoudige plannen maken
lessons:
  es.a1.unit50.lesson01.proponer_una_actividad:
    title: Een activiteit voorstellen
  es.a1.unit50.lesson02.aceptar_o_rechazar_un:
    title: Een plan accepteren of afslaan
  es.a1.unit50.lesson03.quedar_un_dia_y:
    title: Een dag en tijd afspreken
  es.a1.unit50.lesson04.leer_una_invitacion:
    title: Een uitnodiging lezen
  es.a1.unit50.lesson05.escribir_y_confirmar_un:
    title: Een plan schrijven en bevestigen
  es.a1.unit50.lesson06.elena_y_mateo_hacen:
    title: Elena en Mateo maken een plan
teaching:
  es.a1.unit50.lesson01.teach.juntos:
    title: Samen
    gloss: samen
    note: '*Juntos* maakt duidelijk dat mensen de activiteit samen doen; het past zich aan aan de personen (*juntas* als het allemaal vrouwen zijn).'
    example_gloss: Zullen we samen koffie drinken?
  es.a1.unit50.lesson01.teach.tomar_un_cafe:
    title: Koffie drinken
    gloss: koffie drinken
    note: In het Spaans zeg je *tomar un café* (letterlijk "een koffie nemen"), niet een woord voor "koffie drinken".
  es.a1.unit50.lesson01.teach.ir_al_cine:
    title: Naar de film gaan
    gloss: naar de film gaan
    note: '*Ir al cine* ("naar de bioscoop gaan") is de gebruikelijke manier om te zeggen dat je naar een film gaat; *al* is *a* + *el*.'
  es.a1.unit50.lesson01.teach.tomamos_un_cafe:
    title: Zullen we koffie drinken?
    gloss: Zullen we koffie drinken?
    note: '*¿Tomamos ...?* gebruikt de tegenwoordige tijd van *nosotros* om samen iets voor te stellen.'
  es.a1.unit50.lesson01.teach.tomamos_algo_es:
    title: ¿Tomamos ...? gebruiken
    gloss: ¿Tomamos + iets? is de gebruikelijke manier om voor te stellen samen iets te doen.
    note: 'De *nosotros*-vorm (*tomamos*) werkt als "zullen we" in het Nederlands: *¿Tomamos un café?*'
  es.a1.unit50.lesson01.teach.tienes_ganas_de:
    title: Heb je zin om naar de film te gaan?
    gloss: Heb je zin om naar de film te gaan?
    note: '*¿Tienes ganas de ...?* vraagt informeel of iemand zin heeft om iets te doen; na *de* volgt een infinitief.'
  es.a1.unit50.lesson02.teach.si_que_bien:
    title: Ja, leuk!
    gloss: Ja, leuk!
    note: '*¡Sí, qué bien!* is een korte, enthousiaste instemming.'
  es.a1.unit50.lesson02.teach.buena_idea:
    title: Goed idee
    gloss: Goed idee!
    note: Met *¡Buena idea!* stem je in met het voorstel door het te prijzen.
  es.a1.unit50.lesson02.teach.es_un_buen:
    title: Dat is een goed plan
    gloss: Dat is een goed plan.
    note: Dit is een iets uitgebreidere positieve reactie.
  es.a1.unit50.lesson02.teach.lo_siento_no:
    title: Afslaan met een reden
    gloss: Sorry, ik kan niet, want ik werk.
    note: '*Lo siento* maakt de weigering zachter en *porque* leidt de korte reden in.'
  es.a1.unit50.lesson02.teach.no_tengo_tiempo:
    title: Ik heb geen tijd
    gloss: Ik heb geen tijd.
    note: '*No tengo tiempo* is een directe maar gewone reden om af te slaan; *no* staat voor het werkwoord.'
  es.a1.unit50.lesson02.teach.lo_siento_no_2:
    title: Vriendelijk afslaan
    gloss: Lo siento + no puedo + een korte reden maakt een weigering vriendelijk.
    note: In een gesprek is een reden niet verplicht, maar het maakt dit model bruikbaar en beleefd.
  es.a1.unit50.lesson03.teach.quedar:
    title: Afspreken
    gloss: afspreken
    note: '*Quedar* betekent afspreken: *¿Quedamos el viernes?* Veel Latijns-Amerikanen zeggen liever *¿Nos vemos el viernes?*'
    example_gloss: Zullen we vrijdag om half drie afspreken?
  es.a1.unit50.lesson03.teach.quedamos_el_viernes:
    title: Vrijdag om half drie afspreken
    gloss: Zullen we vrijdag om half drie afspreken?
    note: Dit combineert de weekdag *el viernes* met *a las* plus de tijd.
  es.a1.unit50.lesson03.teach.las_dos_y:
    title: Y media betekent half
    gloss: las dos y media = half drie (2:30); a las dos y media geeft het tijdstip van de afspraak.
    note: 'Het Spaans telt vanaf het uur dat net voorbij is: *las dos y media* is 2:30, letterlijk "twee en een half". In het Nederlands tel je juist naar het volgende uur toe: "half drie".'
  es.a1.unit50.lesson03.teach.el_viernes_17:
    title: Een datum en tijd
    gloss: op vrijdag 17 april om kwart over drie
    note: 'Net als in het Nederlands schrijf je weekdagen en maanden in het Spaans met een kleine letter, en bij datums gebruik je *de*: *el viernes 17 de abril*.'
  es.a1.unit50.lesson03.teach.si_el_viernes:
    title: De tijd bevestigen
    gloss: Ja, vrijdag om half drie komt goed uit.
    note: '*Me viene bien* ("het komt me goed uit") bevestigt dat het voorgestelde tijdstip past.'
  es.a1.unit50.lesson04.teach.el_mensaje_la:
    title: Bericht, uitnodiging, taalcafé
    gloss: het bericht, de uitnodiging, het taalcafé
    note: '*Un mensaje* is een kort geschreven of digitaal bericht, *una invitación* vraagt iemand mee te doen aan een activiteit, en *el café de idiomas* is de ontmoetingsplek van de groep.'
    example_gloss:
    - Ik heb een bericht van Elena.
    - Dit is een uitnodiging voor het taalcafé.
    - We drinken koffie in het taalcafé.
  es.a1.unit50.lesson04.teach.hola_mateo_tienes:
    title: Elena's uitnodiging
    gloss: Hoi Mateo, heb je zin om zaterdag 18 april om half drie koffie te drinken in het taalcafé? Groetjes, Elena.
    note: 'Lees op vier details: activiteit, datum, tijd en plaats.'
    glosses:
      Hola: hoi
      ganas: zin, wens (tener ganas de = zin hebben in)
      sábado: zaterdag
      abril: april
      media: half (y media = half)
      dos: twee
      café: koffie
      tomar: drinken / nemen
      idiomas: taalcafé
      saludo: groetjes
  es.a1.unit50.lesson05.teach.hola_mateo_vamos:
    title: Een voorstel per bericht
    gloss: Hoi Mateo, zullen we vrijdag om half drie koffie drinken? Groetjes, Elena.
    note: Het bericht bevat een begroeting, activiteit, dag, tijd en afsluiting.
    glosses:
      Hola: hoi
      vamos: gaan we
      viernes: vrijdag
      media: half (y media = half)
      dos: twee
      café: koffie
      tomar: drinken / nemen
      saludo: groetjes
  es.a1.unit50.lesson05.teach.hola_elena_si:
    title: Een bevestigingsbericht
    gloss: Hoi Elena, ja, leuk! Vrijdag om half drie komt goed uit. Tot vrijdag! Mateo.
    note: Het antwoord gaat akkoord met de activiteit en herhaalt het tijdstip ter bevestiging.
    glosses:
      Hola: hoi
      bien: leuk / goed
      viernes: vrijdag
      media: half (y media = half)
      dos: twee
      viene: goed / past
      Hasta: tot / tot dan
  es.a1.unit50.lesson05.teach.un_mensaje_corto:
    title: Wat een bericht bevat
    gloss: Een kort bericht noemt de activiteit, de dag of datum en de tijd.
    note: Een begroeting en afsluiting zijn handig, maar de belangrijkste details zijn de activiteit en wanneer die plaatsvindt.
  es.a1.unit50.lesson06.teach.elena_tomamos_un:
    title: Elena stelt koffie voor
    gloss: 'Elena: Zullen we vrijdag koffie drinken? Mateo: Ja, leuk! hoe laat?'
    note: Mateo stemt in met de activiteit voordat hij naar de tijd vraagt.
  es.a1.unit50.lesson06.teach.elena_a_las:
    title: Elena's eerste tijdstip
    gloss: 'Elena: Om half drie.'
    note: '*Las dos y media* betekent half drie, zoals in de les over de tijd.'
  es.a1.unit50.lesson06.teach.mateo_lo_siento:
    title: Mateo stelt een andere tijd voor
    gloss: 'Mateo: Sorry, om half drie kan ik niet. Kan het om kwart over drie?'
    note: '*¿Puede ser a ...?* is een beknopte manier om te vragen of een andere tijd past.'
  es.a1.unit50.lesson06.teach.elena_si_a:
    title: Ze bevestigen het definitieve plan
    gloss: 'Elena: Ja, kwart over drie komt goed uit. Mateo: Goed plan. Dan spreken we vrijdag om kwart over drie af.'
    note: Hier is *quedamos* weer de *nosotros*-vorm, nu om het plan te bevestigen.
