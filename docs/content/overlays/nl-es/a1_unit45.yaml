teaching:
  es.a1.unit45.lesson01.teach.cuanto_cuesta_en:
    title: Naar de totaalprijs vragen
    gloss: Hoeveel kost het in totaal?
    note: '*En total* maakt duidelijk dat je de volledige prijs van alles samen bedoelt, niet de prijs van één product.'
  es.a1.unit45.lesson01.teach.cuesta_veinticinco_euros:
    title: Een totaalprijs noemen
    gloss: Het kost in totaal vijfentwintig euro.
    note: '*Cuesta* is de derde persoon enkelvoud van *costar* (kosten); de stamklinker verandert van *o* in *ue* wanneer hij beklemtoond is.'
  es.a1.unit45.lesson02.teach.pagar_con_tarjeta:
    title: Met pinpas of contant betalen
    gloss: met pinpas betalen, contant betalen
    note: '*Pagar con tarjeta* (met pinpas betalen) en *pagar en efectivo* (contant betalen) gebruiken verschillende voorzetsels: *con* voor het betaalmiddel, *en* voor de vorm van het geld.'
    example_gloss:
    - Kan ik hier met pinpas betalen?
    - Ik betaal contant.
  es.a1.unit45.lesson02.teach.puedo_pagar_con:
    title: Vragen of pinbetaling mogelijk is
    gloss: Kan ik hier met pinpas betalen?
    note: '*Puedo* (ik kan) is de *yo*-vorm van *poder*; *aquí* (hier) plaatst de vraag op de plek waar je nu bent.'
  es.a1.unit45.lesson02.teach.quiere_pagar_en:
    title: Vragen naar de betaalvoorkeur
    gloss: Wilt u contant of met pinpas betalen?
    note: '*Quiere* is de formele *usted*-vorm van *querer*, hier gebruikt door een onbekende kassamedewerker; tegen een vriend zeg je *¿quieres pagar...?*'
  es.a1.unit45.lesson03.teach.la_cuenta:
    title: De rekening
    gloss: de rekening
    note: 'Een vrouwelijk woord: *la cuenta*. In een restaurant is het de rekening; bij een bank is het de rekening (het account).'
    example_gloss: Zullen we de rekening delen?
  es.a1.unit45.lesson03.teach.dividimos_la_cuenta:
    title: Voorstellen de rekening te delen
    gloss: Zullen we de rekening delen?
    note: '*¿Dividimos...?* gebruikt de *nosotros*-vorm om een voorstel te doen, zoals Nederlands "zullen we...?".'
  es.a1.unit45.lesson03.teach.puedo_pagar_por:
    title: Vragen om apart te betalen
    gloss: Mag ik apart betalen?
    note: '*Por separado* (apart) zegt hoe je betaalt; *pagar* (betalen) is het gewone werkwoord daarvoor.'
  es.a1.unit45.lesson04.teach.el_cambio:
    title: Het wisselgeld
    gloss: het wisselgeld
    note: 'Een mannelijk woord: *el cambio*. Het betekent ook een verandering van van alles, zoals in *un cambio de planes*.'
    example_gloss: Hier is uw wisselgeld.
  es.a1.unit45.lesson04.teach.aqui_tiene_su:
    title: Wisselgeld teruggeven
    gloss: Hier is uw wisselgeld.
    note: '*Su* is het bezittelijk voornaamwoord dat bij het formele *usted* hoort ("uw"); *Aquí tiene* is de gebruikelijke beleefde manier om iets aan te geven.'
  es.a1.unit45.lesson04.teach.no_necesito_cambio:
    title: Wisselgeld weigeren
    gloss: Ik heb geen wisselgeld nodig.
    note: '*Necesitar* (nodig hebben) krijgt zijn object direct, zonder voorzetsel: *necesito cambio*; *no* ontkent het werkwoord.'
  es.a1.unit45.lesson05.teach.treinta_y_cinco:
    title: Vijfendertig
    gloss: vijfendertig
    note: '*Treinta y cinco* (vijfendertig): van 31 tot 99 verbindt het Spaans tientallen en eenheden met *y*, en schrijft ze als losse woorden. De volgorde is anders dan in het Nederlands: eerst het tiental, dan de eenheid.'
    example_gloss: Het kost vijfendertig euro.
  es.a1.unit45.lesson05.teach.cuenta_dos_platos:
    title: Een restaurantrekening lezen
    gloss: 'Rekening: twee hoofdgerechten en twee koffies. Totaal: vijfendertig euro. Betaald met pinpas.'
    note: Let op wat er besteld is, wat het totaal is en hoe er is betaald.
    glosses:
      Cuenta: rekening
      dos: twee
      platos: hoofdgerechten
      cafés: koffies
      Total: totaal
      treinta: vijfendertig
      euros: euro
      Pagado: betaald
      tarjeta: pinpas
  es.a1.unit45.lesson06.teach.elena_pedimos_la:
    title: Elena vraagt om de rekening
    gloss: 'Elena: Zullen we om de rekening vragen?'
    note: '*Pedir* (vragen om, bestellen) heeft *la cuenta* als direct object: *pedimos la cuenta* (we vragen om de rekening).'
  es.a1.unit45.lesson06.teach.mateo_si_buena:
    title: Mateo vraagt naar het totaal
    gloss: 'Mateo: Ja, goed idee. Hoeveel kost het in totaal?'
    note: Hier komt de vraag *¿cuánto cuesta en total?* uit les 1 terug.
  es.a1.unit45.lesson06.teach.elena_son_treinta:
    title: Elena noemt het totaal
    gloss: 'Elena: Het is vijfendertig euro. Zullen we delen?'
    note: '*Son* gebruik je bij geldbedragen: *son treinta y cinco euros* krijgt een meervoudig werkwoord omdat het bedrag meervoud is.'
  es.a1.unit45.lesson06.teach.mateo_no_deja:
    title: Mateo staat erop te betalen
    gloss: 'Mateo: Nee, laat mij vandaag betalen. Je hebt me zo veel geholpen.'
    note: '*Deja que pague yo* (laat mij betalen) gebruikt de aanvoegende wijs *pague* na *que*; leer het voorlopig als vaste uitdrukking. *Me has ayudado* is het voltooid tegenwoordige tijd (je hebt me geholpen).'
  es.a1.unit45.lesson06.teach.elena_que_amable:
    title: Elena is ontroerd
    gloss: 'Elena: Wat lief van je! Hartelijk bedankt.'
    note: '*¡Qué amable eres!* (wat ben je aardig!) gebruikt *qué* + bijvoeglijk naamwoord om warm te reageren op een gul gebaar; *muchas gracias* is een sterker *dank je wel*.'
  es.a1.unit45.lesson06.teach.mateo_puedo_pagar:
    title: Mateo vraagt of hij met pinpas kan betalen
    gloss: 'Mateo: Kan ik hier met pinpas betalen?'
    note: Hergebruikt de vraag *¿puedo pagar con tarjeta aquí?* uit les 2, nu in het echte restaurant.
  es.a1.unit45.lesson06.teach.mateo_paga_la:
    title: 'Paga: de hij/zij-vorm'
    gloss: Mateo betaalt de rekening.
    note: '*Paga* is de derde persoon enkelvoud van *pagar* (betalen): *Mateo paga la cuenta*.'
