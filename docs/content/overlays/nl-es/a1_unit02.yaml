  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spaans A1
  description: Getallen van 0 tot 100, leeftijden, telefoonnummers en recepthoeveelheden, in het verlengde van Elena en Mateo van unit 1 bij de kookworkshop. Er is extra aandacht voor leeftijdsuitdrukkingen met tener (in het Nederlands zeg je 'ik ben ... jaar', in het Spaans 'ik heb ... jaar') en voor overeenkomst in geslacht bij hoeveelheden.
