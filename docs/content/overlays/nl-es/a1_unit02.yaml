teaching:
  es.a1.unit02.lesson01.teach.cero:
    title: Nul
    gloss: nul
    note: '*Cero* gebruik je zowel als getal zelf als als cijfer wanneer je een reeks cijfers hardop voorleest.'
  es.a1.unit02.lesson01.teach.uno:
    title: Een
    gloss: een
    note: '*Uno* wordt *un* voor een mannelijk enkelvoudig zelfstandig naamwoord (*un huevo*, één ei) en *una* voor een vrouwelijk (*una taza*, één kopje). Los, bijvoorbeeld bij het tellen, blijft het *uno*.'
  es.a1.unit02.lesson01.teach.dos:
    title: Twee
    gloss: twee
    note: '*Dos* verandert nooit, welk geslacht het zelfstandig naamwoord ook heeft.'
  es.a1.unit02.lesson01.teach.tres:
    title: Drie
    gloss: drie
    note: '*Tres* is, net als *dos*, onveranderlijk.'
  es.a1.unit02.lesson01.teach.cuatro:
    title: Vier
    gloss: vier
    note: '*Cuatro* is onveranderlijk.'
  es.a1.unit02.lesson01.teach.cinco:
    title: Vijf
    gloss: vijf
    note: '*Cinco* is onveranderlijk.'
  es.a1.unit02.lesson01.teach.seis:
    title: Zes
    gloss: zes
    note: '*Seis* is onveranderlijk.'
  es.a1.unit02.lesson01.teach.siete:
    title: Zeven
    gloss: zeven
    note: '*Siete* is onveranderlijk.'
  es.a1.unit02.lesson01.teach.ocho:
    title: Acht
    gloss: acht
    note: '*Ocho* is onveranderlijk.'
  es.a1.unit02.lesson01.teach.nueve:
    title: Negen
    gloss: negen
    note: '*Nueve* is onveranderlijk.'
  es.a1.unit02.lesson01.teach.diez:
    title: Tien
    gloss: tien
    note: '*Diez* is onveranderlijk.'
  es.a1.unit02.lesson02.teach.once:
    title: Elf
    gloss: elf
    note: '*Once* tot en met *quince* (11-15) zijn elk een eigen woord dat je als reeks leert; van zestien tot negentien worden de getallen opgebouwd uit *diez* (*dieciséis*, *diecisiete*...).'
  es.a1.unit02.lesson02.teach.doce:
    title: Twaalf
    gloss: twaalf
    note: '*Doce* is één woord; het lijkt op *dos*, maar heeft een eigen spelling.'
  es.a1.unit02.lesson02.teach.trece:
    title: Dertien
    gloss: dertien
    note: '*Trece* is één woord; het lijkt op *tres*, maar heeft een eigen spelling.'
  es.a1.unit02.lesson02.teach.catorce:
    title: Veertien
    gloss: veertien
    note: '*Catorce* is één woord; het lijkt op *cuatro*, maar heeft een eigen spelling.'
  es.a1.unit02.lesson02.teach.quince:
    title: Vijftien
    gloss: vijftien
    note: '*Quince* is het laatste van de samengesmolten getallen voordat het patroon bij zestien verandert.'
  es.a1.unit02.lesson02.teach.veinte:
    title: Twintig
    gloss: twintig
    note: '*Veinte* is een eigen woord. Vanaf *veintiuno* (21) tot en met negenentwintig worden tientallen en eenheden aan elkaar geschreven als één woord; dit patroon komt in les 3 terug met *veintiocho*.'
  es.a1.unit02.lesson02.teach.treinta:
    title: Dertig
    gloss: dertig
    note: Vanaf dertig worden tientallen en eenheden met *y* (en) verbonden als drie losse woorden, anders dan bij de twintigers.
  es.a1.unit02.lesson02.teach.treinta_y_cuatro:
    title: Vierendertig
    gloss: vierendertig
    note: '*Treinta y cuatro* schrijf je als drie losse woorden: het tiental, *y* en de eenheid.'
  es.a1.unit02.lesson02.teach.cien:
    title: Honderd
    gloss: honderd
    note: '*Cien* is de vorm voor precies 100 op zichzelf; *ciento* gebruik je als er nog een getal op volgt (*ciento uno*, 101), wat in deze unit nog niet wordt behandeld.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tienes:
    title: Informeel naar de leeftijd vragen
    gloss: Hoe oud ben je?
    note: In het Spaans vraag je letterlijk hoeveel jaar je hebt, met *tener* (hebben), niet met *ser* of *estar* (zijn), zoals je in het Nederlands 'ben' gebruikt.
  es.a1.unit02.lesson03.teach.tengo_veintiocho:
    title: Je leeftijd zeggen
    gloss: Ik ben achtentwintig.
    note: '*Tengo* is de yo-vorm van *tener*. Een volledig antwoord bevat normaal *años* (jaren); als het al over leeftijd gaat, kun je het weglaten, zoals in *Tengo treinta y uno*.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tiene_usted:
    title: Formeel naar de leeftijd vragen
    gloss: Hoe oud ben je?
    note: '*Tiene* is de *usted*-vorm van *tener*, passend bij het formele register uit unit 1.'
  es.a1.unit02.lesson03.teach.tengo_treinta_y_uno:
    title: Een samengestelde leeftijd zeggen
    gloss: Ik ben eenendertig.
    note: '*Treinta y uno* houdt hier *uno* (niet *un*), omdat er in dit antwoord geen zelfstandig naamwoord direct op volgt.'
  es.a1.unit02.lesson03.teach.y_tu_cuantos:
    title: De leeftijdsvraag terugkaatsen
    gloss: En jij, hoe oud ben je?
    note: '*Tienes* zonder herhaling van *años* is een natuurlijke, gebruikelijke verkorting als het onderwerp al duidelijk is.'
  es.a1.unit02.lesson04.teach.cual_es_tu_numero:
    title: Vraag om een telefoonnummer
    gloss: Wat is je telefoonnummer?
    note: '*Cuál*, en niet *qué*, is de natuurlijke keuze als je iemand vraagt om één specifiek ding uit een reeks mogelijkheden te noemen, zoals een telefoonnummer.'
  es.a1.unit02.lesson04.teach.numero_elena:
    title: Een nummer cijfer voor cijfer uitgesproken
    gloss: Zes, één, vijf, nul, twee, negen, zeven, drie
    note: Een telefoonnummer kan cijfer voor cijfer worden uitgesproken, zoals hier. Veel Spaanstaligen groeperen de cijfers ook in paren, dus let op allebei de manieren.
  es.a1.unit02.lesson04.teach.es_el:
    title: Het nummer inleiden
    gloss: Het is...
    note: '*El* (mannelijk lidwoord, "de"/"het") wordt gebruikt omdat *número* een mannelijk woord is.'
  es.a1.unit02.lesson04.teach.puedes_repetir:
    title: Om herhaling vragen
    gloss: Kun je dat herhalen, alsjeblieft?
    note: '*Puedes* is de *tú*-vorm van *poder* (kunnen), handig als een nummer te snel wordt uitgesproken om te verstaan.'
  es.a1.unit02.lesson04.teach.claro:
    title: Gewillig instemmen
    gloss: Zeker; natuurlijk
    note: '*Claro* is een gebruikelijke, vriendelijke manier om op een verzoek in te gaan.'
  es.a1.unit02.lesson05.teach.necesito_tres_huevos:
    title: Een benodigde hoeveelheid noemen
    gloss: Ik heb drie eieren nodig.
    note: '*Necesito* is de yo-vorm van *necesitar* (nodig hebben). *Huevos* (eieren) blijft meervoud na elk getal groter dan één.'
  es.a1.unit02.lesson05.teach.cuantos_huevos_necesitas:
    title: Vragen hoeveel er nodig zijn
    gloss: Hoeveel eieren heb je nodig?
    note: '*Cuántos* komt overeen in geslacht en getal met het zelfstandig naamwoord waarnaar je vraagt; *huevos* is mannelijk meervoud, dus je gebruikt *cuántos* (niet *cuántas*).'
  es.a1.unit02.lesson05.teach.dos_tazas_harina:
    title: Een afgemeten hoeveelheid noemen
    gloss: Twee kopjes bloem
    note: '*De* verbindt de maateenheid (*tazas*, kopjes) met wat wordt afgemeten (*harina*, bloem), net zoals "van" dat in het Nederlands doet.'
  es.a1.unit02.lesson05.teach.media_taza:
    title: Een halve hoeveelheid noemen
    gloss: Een half kopje suiker
    note: '*Media* komt overeen met het vrouwelijke woord *taza*; de mannelijke vorm *medio* staat bij mannelijke woorden.'
  es.a1.unit02.lesson05.teach.tengo_cuatro_huevos:
    title: Zeggen wat je hebt
    gloss: Ik heb vier eieren op tafel.
    note: '*Tengo* (ik heb) geeft aan wat al beschikbaar is, anders dan *necesito* (ik heb nodig), dat aangeeft wat nog ontbreekt.'
  es.a1.unit02.lesson06.teach.line01:
    title: Vragen hoeveel eieren
    gloss: Elena vraagt Mateo hoeveel eieren hij nodig heeft voor het recept.
    note: Het *tú*-register van eenheid 1 gaat door tussen de twee leeftijdsgenoten.
  es.a1.unit02.lesson06.teach.line02:
    title: De ingrediënten noemen
    gloss: Mateo zegt dat hij drie eieren en twee kopjes bloem nodig heeft.
    note: '*Necesito* noemt wat er nog nodig is voor het recept.'
  es.a1.unit02.lesson06.teach.line03:
    title: Aanbieden wat je hebt
    gloss: Elena zegt dat ze vier eieren op tafel heeft en vraagt of hij ook suiker nodig heeft.
    note: '*Tengo* geeft aan wat Elena al heeft, los van wat Mateo nodig zei te hebben.'
  es.a1.unit02.lesson06.teach.line04:
    title: Een kleine hoeveelheid bevestigen
    gloss: 'Mateo zegt ja, een beetje: ongeveer een half kopje.'
    note: '*Como* betekent hier "ongeveer", niet de gebruikelijkere betekenis "zoals" of "als".'
  es.a1.unit02.lesson06.teach.line05:
    title: Vraag om een telefoonnummer
    gloss: Elena zegt dat het goed is en vraagt dan om Mateo's telefoonnummer, zodat ze hem kan appen over de volgende les.
    note: '*Así te escribo* ("zodat ik je kan schrijven/appen") geeft de reden van de vraag, een natuurlijke gewoonte in een gesprek voordat je om contactgegevens vraagt.'
  es.a1.unit02.lesson06.teach.line06:
    title: Het telefoonnummer geven
    gloss: Mateo noemt zijn nummer cijfer voor cijfer.
    note: '*Es el* leidt het nummer in, passend bij het mannelijke woord *número*.'
  es.a1.unit02.lesson06.teach.line07:
    title: Hem bedanken en naar zijn leeftijd vragen
    gloss: 'Elena bedankt hem en stelt nog één vraag: hoe oud hij is.'
    note: '*Una pregunta más* ("nog één vraag") geeft op een natuurlijke manier een onderwerpwissel binnen hetzelfde gesprek aan.'
  es.a1.unit02.lesson06.teach.line08:
    title: Zijn leeftijd noemen
    gloss: Mateo zegt dat hij achtentwintig is en stelt Elena dezelfde vraag.
    note: '*Tengo veintiocho años* gebruikt de samengetrokken vorm van de twintigers: veintiocho is één woord.'
  es.a1.unit02.lesson06.teach.line09:
    title: Haar leeftijd noemen
    gloss: Elena zegt dat ze eenendertig is.
    note: '*Tengo treinta y uno* laat *años* weg, omdat uit de context al duidelijk is dat het om leeftijd gaat: een natuurlijke verkorting zodra het onderwerp vaststaat, net als bij de teruggekaatste vraag zonder *años*.'
