  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spaans A1
  description: 'Over je beroep praten, als vervolg op het verhaal van Elena en Mateo: tijdens een pauze in de workshoples van 22 juli praten ze over hun werk – Mateo de boekhouder en Elena de lerares – en ze besluiten dat ze allebei het liefst samen koken.'
