teaching:
  es.a1.unit13.lesson01.teach.el_trabajo:
    title: De baan / het werk
    gloss: de baan / het werk
    note: '*Trabajo* is mannelijk en is ook de werkwoordsvorm "ik werk".'
    example_gloss: Ik hou van mijn werk.
  es.a1.unit13.lesson01.teach.la_oficina:
    title: Het kantoor
    gloss: het kantoor
    note: '*Oficina* is vrouwelijk.'
    example_gloss: Ik werk op een kantoor.
  es.a1.unit13.lesson01.teach.el_escritorio:
    title: De balie
    gloss: de balie
    note: '*Escritorio* is mannelijk.'
    example_gloss: Dit is mijn bureau.
  es.a1.unit13.lesson01.teach.la_escuela:
    title: De school
    gloss: de school
    note: '*Escuela* is vrouwelijk.'
    example_gloss: Ik geef les op een school.
  es.a1.unit13.lesson01.teach.los_estudiantes:
    title: De studenten
    gloss: de studenten
    note: '*Estudiante* heeft dezelfde vorm voor een man en een vrouw; het meervoud *los estudiantes* geldt ook voor een gemengde groep.'
    example_gloss: Ik heb twintig studenten.
  es.a1.unit13.lesson02.teach.trabajar:
    title: Werken
    gloss: werken
    note: De infinitief van het werkwoord, gebruikt in constructies als *me gusta trabajar* (ik werk graag).
  es.a1.unit13.lesson02.teach.soy_contador:
    title: Zeg dat je boekhouder bent
    gloss: Ik ben boekhouder.
    note: Beroepen gebruiken *ser* + beroep zonder lidwoord – zie de grammaticakaart hieronder.
  es.a1.unit13.lesson02.teach.soy_profesora:
    title: Zeg dat je lerares bent (vrouwelijk)
    gloss: Ik ben lerares.
    note: '*Profesora* is de vrouwelijke vorm van *profesor*.'
  es.a1.unit13.lesson02.teach.enseno_en_una_escuela:
    title: Zeg waar je lesgeeft
    gloss: Ik geef les op een school.
    note: '*Enseño* (ik geef les) is de eerste persoon van *enseñar*, hier met *escuela* (school).'
  es.a1.unit13.lesson02.teach.contador_vs_profesora_note:
    title: Beroepen met ser
    gloss: Hoe je in het Spaans een beroep noemt zonder lidwoord.
    note: Zie de tekst op de kaart zelf.
    target_text: 'Beroepen gebruiken *ser* + beroep, zonder lidwoord: *soy contador* (ik ben boekhouder), niet *soy un contador*. *Contador* heeft een bijbehorende vrouwelijke vorm *contadora*; *profesor/profesora* is hetzelfde soort mannelijk/vrouwelijk paar voor "leraar" (voeg *-a* toe voor een vrouw).'
  es.a1.unit13.lesson03.teach.en_que_trabajas:
    title: Vraag naar iemands werk
    gloss: Wat voor werk doe je?
    note: '*¿En qué trabajas?* (letterlijk "waarin werk je?") is de standaardmanier om iemand naar zijn of haar beroep te vragen.'
  es.a1.unit13.lesson03.teach.trabajo_en_una_oficina_soy_contador:
    title: Antwoord met je beroep
    gloss: Ik werk op een kantoor. Ik ben boekhouder.
    note: Combineert *oficina* met *soy contador* tot een natuurlijk antwoord van twee zinnen.
  es.a1.unit13.lesson04.teach.me_gusta_mi_trabajo:
    title: Zeg dat je van je werk houdt
    gloss: Ik hou van mijn werk.
    note: Gebruikt opnieuw de *gustar*-constructie, nu met *mi trabajo* (mijn werk).
  es.a1.unit13.lesson04.teach.pero_prefiero_cocinar:
    title: Zeg waar je de voorkeur aan geeft
    gloss: Maar ik kook liever.
    note: '*Prefiero* (ik verkies) ken je al; *cocinar* (koken) is de infinitief van de centrale activiteit in dit hele verhaal.'
  es.a1.unit13.lesson04.teach.los_dos_preferimos_esto:
    title: Zeg dat jullie dit allebei liever doen
    gloss: Wij doen dit allebei liever.
    note: '*Preferimos* is de *nosotros*-vorm van *preferir*, gebruikt als Elena en Mateo het samen eens zijn.'
  es.a1.unit13.lesson05.teach.trabajos_reading:
    title: Lezen over hun werk
    gloss: Mateo werkt op een kantoor in Londen. Hij is accountant. Elena geeft les op een school. Ze is lerares en heeft twintig studenten. Ze houden allebei van hun werk, maar ze koken liever samen op dinsdag.
    note: Een korte samenvatting van het werk van Mateo en Elena.
    glosses:
      trabaja: werkt (van trabajar)
      oficina: kantoor
      contador: accountant
      enseña: geeft les (van enseñar)
      escuela: school
      profesora: leraar / lerares
      tiene: heeft (van tener)
      veinte: twintig
      estudiantes: studenten
      gusta: valt in de smaak (van gustar)
      trabajo: werk
      prefieren: verkiezen (van preferir)
      cocinar: koken
      juntos: samen
      martes: dinsdagen
  es.a1.unit13.lesson05.teach.a_los_dos_les_gusta_note:
    title: A los dos les gusta
    gloss: Hoe gustar werkt met een meervoudig meewerkend voorwerp.
    note: Zie de tekst op de kaart zelf.
    target_text: '*A los dos les gusta* (allebei vinden ze het leuk) breidt de *gustar*-constructie (die je al kent) uit naar een meervoudig meewerkend voorwerp: *les* (hun) in plaats van *me/te* (mij/jou).'
  es.a1.unit13.lesson06.teach.line01:
    title: Vraag naar het werk van Mateo
    gloss: Elena vraagt Mateo wat voor werk hij doet.
    note: De vraag die je eerder hebt geleerd, nu gericht aan Mateo bij naam.
  es.a1.unit13.lesson06.teach.line02:
    title: Antwoord met zijn beroep
    gloss: Mateo zegt dat hij op een kantoor werkt als accountant.
    note: 'Het volledige antwoord dat je eerder hebt geleerd: waar hij werkt, en dan zijn beroep.'
  es.a1.unit13.lesson06.teach.line03:
    title: Reageer en vertel over haar eigen werk
    gloss: Elena vindt het interessant en vertelt dat ze lerares is.
    note: '*Interesante* (interessant) is een nieuw, makkelijk herkenbaar woord; de rest is *soy profesora* en *enseño en una escuela*, die je al kent.'
  es.a1.unit13.lesson06.teach.line04:
    title: Vraag of ze het leuk vindt om les te geven
    gloss: Mateo vraagt of ze het leuk vindt om les te geven.
    note: '*¿Te gusta enseñar?* combineert het bekende vraagpatroon met *gustar* en het hele werkwoord *enseñar*.'
  es.a1.unit13.lesson06.teach.line05:
    title: Bevestig en voeg een voorkeur toe
    gloss: Elena zegt dat ze het erg leuk vindt, maar dat ze liever met hem kookt op dinsdag.
    note: '*Contigo* (met jou) is een nieuwe samengetrokken vorm van voorzetsel + voornaamwoord; *los martes* (op dinsdag) gebruikt het meervoudige lidwoord voor een vaste weekdag.'
  es.a1.unit13.lesson06.teach.line06:
    title: Zeg dat je hetzelfde voorkeurt
    gloss: Mateo zegt dat hij zijn werk ook leuk vindt, maar liever kookt.
    note: '*A mí también* (ik ook) is het nadrukkelijke patroon om het eens te zijn bij *gustar*: *a mí* benadrukt wie iets leuk vindt.'
  es.a1.unit13.lesson06.teach.line07:
    title: Trek de conclusie
    gloss: Elena besluit dat ze allebei dit verkiezen (samen koken).
    note: '*Entonces* (dus/dan) is een nieuw logisch verbindingswoord; de rest is *los dos preferimos esto* (wij allebei verkiezen dit).'
  es.a1.unit13.lesson06.teach.line08:
    title: Bevestig enthousiast
    gloss: 'Mateo is het ermee eens: absoluut.'
    note: '*Definitivamente* (absoluut) is een nieuw, makkelijk herkenbaar bijwoord dat de scène afsluit.'
