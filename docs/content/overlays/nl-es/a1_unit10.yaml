teaching:
  es.a1.unit10.lesson01.teach.el_tiempo:
    title: Het weer
    gloss: het weer
    note: '*Tiempo* betekent ook "tijd" -- de context laat zien welke betekenis bedoeld wordt.'
    example_gloss: Wat voor weer is het vandaag?
  es.a1.unit10.lesson01.teach.el_sol:
    title: De zon
    gloss: de zon
    note: '*Sol* is mannelijk.'
    example_gloss: Het is vandaag erg zonnig.
  es.a1.unit10.lesson01.teach.la_lluvia:
    title: De regen
    gloss: de regen
    note: '*Lluvia* is vrouwelijk.'
    example_gloss: Ik hou niet van regen.
  es.a1.unit10.lesson01.teach.el_viento:
    title: De wind
    gloss: de wind
    note: '*Viento* is mannelijk.'
    example_gloss: Het waait vandaag hard.
  es.a1.unit10.lesson01.teach.la_nube:
    title: De wolk
    gloss: de wolk
    note: '*Nube* is vrouwelijk.'
    example_gloss: Er is geen enkele wolk.
  es.a1.unit10.lesson02.teach.hace_calor:
    title: Het is warm
    gloss: Het is warm.
    note: '*Hace calor* (letterlijk "het maakt hitte") is de standaarduitdrukking voor warm weer.'
    example_gloss: Het is heel warm in juli.
  es.a1.unit10.lesson02.teach.hace_frio:
    title: Het is koud
    gloss: Het is koud.
    note: '*Hace frío* volgt hetzelfde patroon van *hace* + zelfstandig naamwoord als *hace calor*.'
    example_gloss: In december is het koud.
  es.a1.unit10.lesson02.teach.hace_sol:
    title: Het is zonnig
    gloss: Het is zonnig.
    note: '*Hace sol* gebruikt *el sol* (de zon) in hetzelfde uitdrukkingspatroon.'
  es.a1.unit10.lesson02.teach.llueve:
    title: Het regent
    gloss: Het regent.
    note: '*Llueve* is een eigen werkwoordsvorm (van *llover*, regenen) en volgt niet het patroon met *hace* -- zie de grammaticanotitie hierna.'
  es.a1.unit10.lesson02.teach.esta_nublado:
    title: Het is bewolkt
    gloss: Het is bewolkt.
    note: '*Está nublado* gebruikt *estar* + bijvoeglijk naamwoord, een derde, ander patroon om het weer te beschrijven.'
  es.a1.unit10.lesson02.teach.hace_vs_esta_note:
    title: 'Hace, llueve, está: drie patronen'
    gloss: Drie verschillende grammaticale patronen om het weer te beschrijven.
    note: Zie de tekst van de kaart zelf.
    target_text: 'Weeruitdrukkingen met *hace* (hace calor, hace frío, hace sol) zijn vaste uitdrukkingen, letterlijk "het maakt hitte/kou/zon". *Llueve* (het regent) is een eigen werkwoordsvorm, en *está nublado* (het is bewolkt) gebruikt *estar* + bijvoeglijk naamwoord -- drie verschillende patronen voor hetzelfde idee: het weer beschrijven.'
  es.a1.unit10.lesson03.teach.que_tiempo_hace_hoy:
    title: Naar het weer vragen
    gloss: Wat voor weer is het vandaag?
    note: '*¿Qué tiempo hace hoy?* is de standaardmanier om naar het weer van nu te vragen, met *el tiempo* (het weer).'
  es.a1.unit10.lesson03.teach.hace_mucho_calor_y_sol:
    title: Warm, zonnig weer beschrijven
    gloss: Het is heel warm en zonnig.
    note: Combineert twee uitdrukkingen met *hace* via *y* (en).
  es.a1.unit10.lesson03.teach.hace_calor_pero_hay_viento:
    title: Warm, winderig weer beschrijven
    gloss: Het is warm, maar het waait.
    note: '*Pero* (maar) zet twee weersfeiten tegenover elkaar -- hitte en wind, met *hay* + zelfstandig naamwoord zoals in *hay mucho viento*.'
  es.a1.unit10.lesson04.teach.en_invierno_hace_frio_en_madrid:
    title: Over de winter in Madrid praten
    gloss: In de winter is het erg koud in Madrid.
    note: '*En invierno* (in de winter) introduceert een jaargetijde, in contrast met *en julio* hieronder.'
  es.a1.unit10.lesson04.teach.en_julio_hace_demasiado_calor:
    title: Over de hitte in juli praten
    gloss: In juli is het te warm.
    note: '*Demasiado* (te veel) versterkt *calor* meer dan het gewone *mucho* (veel).'
  es.a1.unit10.lesson04.teach.necesitamos_agua:
    title: Uitleggen waarom je water nodig hebt
    gloss: We hebben water nodig omdat het warm is.
    note: '*Porque* (omdat, want) koppelt een behoefte aan de weersoorzaak: een praktische zin die bij de workshop past.'
  es.a1.unit10.lesson05.teach.pronostico_reading:
    title: Een weersverwachting lezen
    gloss: Vandaag, 22 juli, is het heel warm en zonnig. Er is geen enkele wolk. Er staat ook een beetje wind. Het is een goede dag om naar de kookworkshop te gaan, maar het is belangrijk om water mee te nemen.
    note: Een korte weersverwachting voor 22 juli, de dag van de kookles.
    glosses:
      Hoy: vandaag
      veintidós: tweeëntwintigste
      julio: juli
      hace: het is / het weer is (van hacer)
      calor: warm weer / hitte
      sol: zonnig / zon
      hay: er is (van haber)
      nube: wolk
      También: ook
      poco: een beetje
      viento: wind
      buen: goed
      día: dag
      ir: gaan
      taller: workshop
      cocina: koken
      importante: belangrijk
      llevar: meenemen / dragen
      agua: water
  es.a1.unit10.lesson05.teach.un_poco_de_note:
    title: Un poco de (een beetje)
    gloss: Zo geef je een kleine hoeveelheid aan.
    note: Zie de tekst van de kaart zelf.
    target_text: '*Un poco de* (een beetje) gebruik je bij hoeveelheden eten, en hier beschrijft het een kleine hoeveelheid wind -- hetzelfde patroon met een nieuw zelfstandig naamwoord.'
  es.a1.unit10.lesson06.teach.line01:
    title: Reageren op de hitte
    gloss: Elena merkt op hoe warm het vandaag is.
    note: '*¡Qué calor hace hoy!* (wat een hitte maakt het vandaag / wat is het warm vandaag!) is een uitroep met de uitdrukking *hace calor*.'
  es.a1.unit10.lesson06.teach.line02:
    title: Het ermee eens zijn en iets toevoegen
    gloss: Mateo is het met haar eens en merkt op dat er geen enkele wolk is.
    note: Combineert *hace mucho calor y hace sol* met *no hay ni una nube*.
  es.a1.unit10.lesson06.teach.line03:
    title: Voorstellen om water mee te nemen
    gloss: Elena zegt dat ze water nodig hebben voor onderweg.
    note: '*El camino* (de weg) verwijst naar hun wandeling naar de workshop.'
  es.a1.unit10.lesson06.teach.line04:
    title: Het ermee eens zijn en een winkel aanwijzen
    gloss: Mateo vindt het een goed idee en noemt een winkel in de buurt.
    note: '*Cerca de aquí* (hier in de buurt) gebruikt de plaatsuitdrukking *cerca de* (dicht bij).'
  es.a1.unit10.lesson06.teach.line05:
    title: Winter en zomer vergelijken
    gloss: Elena zet de koude winters van Madrid af tegen de overdreven hitte van vandaag in juli.
    note: Combineert de twee seizoenszinnen *en invierno hace mucho frío* en *en julio hace demasiado calor*.
  es.a1.unit10.lesson06.teach.line06:
    title: Een voorkeur uitspreken
    gloss: Mateo zegt dat hij liever warm weer heeft -- in Londen regent het bijna elke dag.
    note: '*Prefiero* (ik verkies, ik heb liever) is een nieuwe werkwoordsvorm voor de eerste persoon; *casi todos los días* (bijna elke dag) is een handige uitdrukking voor frequentie.'
  es.a1.unit10.lesson06.teach.line07:
    title: Instemmen en voortmaken
    gloss: Elena is het met hem eens en zegt dat ze moeten gaan, anders komen ze te laat voor de les.
    note: '*Es verdad* betekent "dat is waar"; *o* (of) geeft hier een gevolg aan ("anders").'
  es.a1.unit10.lesson06.teach.line08:
    title: Akkoord, we gaan
    gloss: Mateo geeft haar gelijk en ze gaan.
    note: '*Tienes razón* (je hebt gelijk) is een veelgebruikte manier om het eens te zijn.'
