    title: Wie studeert wat?
    gloss: Diego werkt niet alleen, hij studeert ook. Hij volgt een cursus Spaans aan het taleninstituut. Hij leert elke week nieuwe woorden. Lucía volgt een opleiding aan de hogeschool. Daar studeert ze gezondheidszorg. Allebei studeren ze graag. Wat studeer jij, of wat zou je graag willen leren?
