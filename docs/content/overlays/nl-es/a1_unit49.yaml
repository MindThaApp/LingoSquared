teaching:
  es.a1.unit49.lesson01.teach.levantarse_me_levanto:
    title: Opstaan
    gloss: opstaan → ik sta op
    note: '*Levantarse* is wederkerend: het voornaamwoord *me* staat voor het werkwoord, *Me levanto*.'
  es.a1.unit49.lesson01.teach.vestirse_me_visto:
    title: Je aankleden
    gloss: zich aankleden → ik kleed me aan
    note: '*Vestirse* is ook wederkerend: *Me visto*. Hier betekent *me* "mezelf".'
  es.a1.unit49.lesson01.teach.desayunar_desayuno:
    title: Ontbijten
    gloss: ontbijten → ik ontbijt
    note: '*Desayunar* is niet wederkerend: *Desayuno*, zonder *me*.'
  es.a1.unit49.lesson01.teach.trabajar_trabajo:
    title: Werk
    gloss: werken → ik werk
    note: '*Trabajar* is een regelmatig werkwoord op -ar: de *yo*-vorm eindigt op -o, *trabajo*.'
  es.a1.unit49.lesson01.teach.comer_como:
    title: Eten
    gloss: eten → ik eet
    note: '*Comer* is een regelmatig werkwoord op -er: de *yo*-vorm eindigt op -o, *como*.'
  es.a1.unit49.lesson01.teach.lavar_los_platos:
    title: De afwas doen
    gloss: de afwas doen → ik doe de afwas
    note: '*Lavar los platos* is niet wederkerend: *Lavo los platos*. Het lijdend voorwerp *los platos* blijft achter het werkwoord staan.'
  es.a1.unit49.lesson01.teach.dormir_duermo:
    title: Slapen
    gloss: slapen → ik slaap
    note: '*Dormir* verandert de klinker van de stam in de *yo*-vorm: *duermo* (o wordt ue).'
  es.a1.unit49.lesson02.teach.con_levantarse_y:
    title: Het wederkerende patroon
    gloss: 'Bij levantarse en vestirse staat het voornaamwoord voor het werkwoord: levantarse → Me levanto.'
    note: 'Bij wederkerende werkwoorden zet je *me* voor het vervoegde werkwoord: zeg *Me levanto*, niet *Levanto me*.'
  es.a1.unit49.lesson02.teach.levantarse_me_levanto:
    title: Levantarse in een zin
    gloss: 'opstaan: Ik sta om zeven uur op.'
    note: 'De tijdsaanduiding komt na het werkwoord: *Me levanto a las siete*.'
  es.a1.unit49.lesson02.teach.vestirse_me_visto:
    title: Vestirse in een zin
    gloss: 'zich aankleden: Ik kleed me aan.'
    note: 'Het patroon is *me* + *visto*: het voornaamwoord staat direct voor het werkwoord.'
  es.a1.unit49.lesson02.teach.lavar_los_platos:
    title: Lavar los platos in een zin
    gloss: 'de afwas doen: Ik doe de afwas na het eten.'
    note: '*Después de comer* ("na het eten") gebruikt *de* plus een infinitief en kan aan het einde staan.'
  es.a1.unit49.lesson02.teach.sin_pronombre_desayuno:
    title: Werkwoorden zonder me
    gloss: 'Zonder voornaamwoord: Ik ontbijt. Ik werk. Ik slaap. Deze werkwoorden zijn niet wederkerend.'
    note: '*Desayuno*, *trabajo* en *duermo* hebben geen *me*: deze werkwoorden zijn niet wederkerend.'
  es.a1.unit49.lesson03.teach.me_levanto_a:
    title: Om half acht opstaan
    gloss: Ik sta om half acht op.
    note: 'In het Spaans zeg je "half" met *y media* (letterlijk "en half"), terwijl het Nederlands het volgende uur noemt: *las siete y media* is 7:30, dus half acht. Gebruik *a las* voor de tijd.'
  es.a1.unit49.lesson03.teach.me_visto_a:
    title: Om kwart voor acht je aankleden
    gloss: Ik kleed me om kwart voor acht aan.
    note: '*Las ocho menos cuarto* telt terug vanaf het volgende uur: 7:45.'
  es.a1.unit49.lesson03.teach.desayuno_a_las:
    title: Om acht uur ontbijten
    gloss: Ik ontbijt om acht uur.
    note: 'Gebruik *a las* voor de tijd: *a las ocho*. Voor één uur is het *a la una*.'
  es.a1.unit49.lesson03.teach.trabajo_de_nueve:
    title: Van negen tot vijf werken
    gloss: Ik werk van negen tot vijf uur.
    note: '*De ... a ...* geeft een begin- en eindtijd: *de nueve a cinco*.'
  es.a1.unit49.lesson03.teach.como_a_las:
    title: Om half zeven eten
    gloss: Ik eet om half zeven 's avonds.
    note: '*De la tarde* maakt duidelijk dat het om de middag of avond gaat, dus *las seis y media* is hier 18:30.'
  es.a1.unit49.lesson03.teach.duermo_a_las:
    title: Om elf uur slapen
    gloss: Ik ga om elf uur slapen.
    note: 'Gebruik *a las* voor de tijd: *a las once*.'
  es.a1.unit49.lesson04.teach.primero_luego_despues:
    title: Eerst, dan, daarna
    gloss: eerst, dan, daarna
    note: '*Primero* markeert de eerste activiteit, *luego* de volgende en *después* wat daarna komt.'
    example_gloss:
    - Eerst sta ik op.
    - Dan kleed ik me aan.
    - Daarna ontbijt ik.
  es.a1.unit49.lesson04.teach.primero_me_levanto:
    title: Een ochtend in drie stappen
    gloss: Eerst sta ik op. Dan kleed ik me aan. Daarna ontbijt ik.
    note: 'Wederkerende werkwoorden houden *me* voor het werkwoord: *me levanto*, *me visto*.'
  es.a1.unit49.lesson04.teach.primero_luego_y:
    title: Volgordewoorden
    gloss: 'Primero, luego en después zetten je activiteiten op volgorde; het werkwoord verandert niet: Después desayuno.'
    note: 'Volgordewoorden staan aan het begin van de zin en de werkwoordsvorm verandert niet: *Después desayuno*.'
  es.a1.unit49.lesson05.teach.mi_dia_me:
    title: Mijn dag
    gloss: Mijn dag — Ik sta om half acht op. Daarna kleed ik me aan en om acht uur ontbijt ik. Ik werk van negen tot vijf. Om half zeven 's avonds eet ik. Daarna doe ik de afwas. Om elf uur ga ik slapen.
    note: Let bij het lezen op zowel de volgorde van de activiteiten als de tijden. Merk *me levanto* en *me visto* met *me* op.
    glosses:
      Mi: mijn
      día: dag
      levanto: opstaan (me levanto)
      media: half (y media = half)
      ocho: acht
      Después: daarna
      visto: zich aankleden (me visto)
      las: 'het (voor kloktijden: las ocho)'
      desayuno: ontbijten
      Trabajo: werken
      nueve: negen
      cinco: vijf
      siete: zeven
      tarde: '''s avonds'
      como: eten
      lavo: afwassen (lavo los platos)
      once: elf
      duermo: slapen
  es.a1.unit49.lesson06.teach.elena_como_es:
    title: Vragen naar een dag
    gloss: 'Elena: Hoe ziet jouw dag eruit, Mateo?'
    note: '*¿Cómo es tu día?* is een informele manier om iemand te vragen zijn dag te beschrijven; *tu* is het informele "jouw".'
  es.a1.unit49.lesson06.teach.mateo_me_levanto:
    title: Mateo's ochtend
    gloss: 'Mateo: Ik sta om half acht op. Daarna kleed ik me aan en om acht uur ontbijt ik.'
    note: Mateo verbindt drie ochtendactiviteiten met *después* en *y*.
  es.a1.unit49.lesson06.teach.elena_cuando_trabajas:
    title: Mateo's werkdag
    gloss: 'Elena: Wanneer werk je? Mateo: Ik werk van negen tot vijf.'
    note: 'Elena en Mateo gebruiken informele *tú*-vormen met elkaar: *¿Cuándo trabajas?*'
  es.a1.unit49.lesson06.teach.mateo_a_las:
    title: Mateo's avond
    gloss: 'Mateo: Om half zeven ''s avonds eet ik. Daarna doe ik de afwas. Om elf uur ga ik slapen.'
    note: '*Después* staat aan het begin van de zin, maar de werkwoordsvorm blijft hetzelfde: *después lavo*.'
  es.a1.unit49.lesson06.teach.elena_me_levanto:
    title: Elena's ochtend
    gloss: 'Elena: Ik sta om zes uur op, maar ik ontbijt pas om half zeven.'
    note: '*No ... hasta* betekent "pas om" of "niet tot". Elena zet haar opstaantijd tegenover haar ontbijttijd.'
