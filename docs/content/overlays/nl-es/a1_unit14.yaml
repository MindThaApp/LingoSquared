    example_gloss: De slaapkamer heeft een groot bed.
  es.a1.unit14.lesson01.teach.el_bano:
    title: De badkamer
    gloss: de badkamer
    note: '*Baño* is mannelijk.'
    example_gloss: Het appartement heeft een badkamer.
  es.a1.unit14.lesson01.teach.la_sala:
    title: De woonkamer
    gloss: de woonkamer
    note: '*Sala* is vrouwelijk.'
    example_gloss: We kijken televisie in de woonkamer.
  es.a1.unit14.lesson01.teach.cocina_ambiguity_note:
    title: 'Cocina: keuken of koken'
    gloss: Het verschil tussen la cocina (keuken) en cocinar (koken).
    note: Zie de tekst op de kaart zelf.
    target_text: '*La cocina* betekent hier "de keuken" (een kamer). Dat is een andere betekenis dan *cocina*/*cocinar* (koken), die in het hele verhaal al voor de workshop worden gebruikt. De context maakt het verschil duidelijk: in *taller de cocina* gaat het om koken; *la cocina* van een huis of appartement is de kamer; *cocinar* is het werkwoord "koken".'
  es.a1.unit14.lesson02.teach.alquilar:
    title: Huren
    gloss: huren
    note: De infinitief, gebruikt in *quiero alquilar* (ik wil huren).
  es.a1.unit14.lesson02.teach.el_edificio:
    title: Het gebouw
    gloss: het gebouw
    note: '*Edificio* is mannelijk.'
    example_gloss: Het gebouw staat vlak bij het park.
  es.a1.unit14.lesson02.teach.desocupado:
    title: Vrij / leegstaand
    gloss: beschikbaar / vrij
    note: '*Desocupado* beschrijft een huurwoning die op dit moment leeg en beschikbaar is.'
  es.a1.unit14.lesson02.teach.grande:
    title: Groot
    gloss: groot
    note: '*Grande* verandert niet naargelang het geslacht (anders dan bijvoeglijke naamwoorden op -o/-a).'
  es.a1.unit14.lesson02.teach.pequeno:
    title: Klein
    gloss: klein
    note: '*Pequeño/pequeña*, het tegenovergestelde van *grande*.'
  es.a1.unit14.lesson03.teach.cuantos_dormitorios_tiene:
    title: Vragen hoeveel slaapkamers er zijn
    gloss: Hoeveel slaapkamers heeft het?
    note: '*¿Cuántos...tiene?* (hoeveel ... heeft het?) is een vast patroon om naar de kenmerken van een plek te vragen.'
  es.a1.unit14.lesson03.teach.tiene_dos_dormitorios_y_una_cocina_grande:
    title: De slaapkamers en de keuken beschrijven
    gloss: Het heeft twee slaapkamers en een grote keuken.
    note: '*Tiene* (het heeft) + aantal + zelfstandig naamwoord, hier met *dormitorio*, *cocina* en *grande*.'
  es.a1.unit14.lesson04.teach.quiero_alquilar_un_apartamento_con_una_cocina_grande:
    title: Je woonwens uitspreken
    gloss: Ik wil een appartement huren met een grote keuken.
    note: '*Quiero* (ik wil) + infinitief *alquilar*, met *con* (met) om de gewenste eigenschap in te leiden.'
  es.a1.unit14.lesson04.teach.asi_puedes_cocinar_en_casa:
    title: Het voordeel uitleggen
    gloss: Zo kun je ook thuis koken.
    note: '*Así* (zo) + *puedes* (je kunt) + infinitief verbindt het woondoel met het kookthema van het hele verhaal.'
  es.a1.unit14.lesson05.teach.anuncio_reading:
    title: Een appartementadvertentie lezen
    gloss: Vrij appartement in een gebouw vlak bij het park. Het heeft twee slaapkamers, een badkamer, een woonkamer en een grote keuken. Het is perfect voor iemand die thuis wil koken.
    note: Een realistische advertentie zoals in de krant.
    glosses:
      desocupado: beschikbaar / vrij
      edificio: gebouw
      cerca: dichtbij
      parque: park
      Tiene: heeft (van tener)
      dormitorios: slaapkamers
      baño: badkamer
      sala: woonkamer
      grande: groot
      perfecto: perfect
      quiere: wil (van querer)
      cocinar: koken
  es.a1.unit14.lesson05.teach.para_alguien_que_note:
    title: Para alguien que...
    gloss: Hoe een bijzin de ideale huurder beschrijft.
    note: Zie de tekst op de kaart zelf.
    target_text: '*Para alguien que quiere* (voor iemand die wil) gebruikt *alguien* (iemand) + *que* (die) om een bijzin te openen. Dit is een veelvoorkomend patroon in advertenties die de ideale huurder beschrijven.'
  es.a1.unit14.lesson06.teach.line01:
    title: Het probleem en het doel noemen
    gloss: Mateo zegt dat zijn keuken heel klein is en dat hij een appartement met een grote keuken wil huren.
    note: Combineert *mi cocina es muy pequeña* (mijn keuken is heel klein) met de doelzin *quiero alquilar un apartamento con una cocina grande*.
  es.a1.unit14.lesson06.teach.line02:
    title: Voorstellen om advertenties te bekijken
    gloss: 'Elena stelt voor om in de krant te kijken: er staan veel advertenties in.'
    note: '*El periódico* (de krant) en *anuncios* (advertenties) zijn nieuwe woorden uit de praktijk van kleine advertenties.'
  es.a1.unit14.lesson06.teach.line03:
    title: Een advertentie vinden
    gloss: Mateo vindt een gebouw met een vrij appartement.
    note: '*Este edificio* (dit gebouw) en *desocupado* (vrij, beschikbaar).'
  es.a1.unit14.lesson06.teach.line04:
    title: Vragen naar de slaapkamers
    gloss: Elena vraagt hoeveel slaapkamers het heeft.
    note: De standaardvraag om naar de kenmerken van een plek te vragen.
  es.a1.unit14.lesson06.teach.line05:
    title: Antwoorden met de details
    gloss: Mateo zegt dat het twee slaapkamers en een grote keuken heeft.
    note: '*Tiene* (het heeft) + aantal + zelfstandig naamwoord.'
  es.a1.unit14.lesson06.teach.line06:
    title: Meer kenmerken bevestigen
    gloss: Elena is dolblij en merkt op dat er ook een badkamer en een woonkamer zijn.
    note: '*Baño* (badkamer) en *sala* (woonkamer) maken de lijst met kamers compleet; *también* (ook) komt aan het eind.'
  es.a1.unit14.lesson06.teach.line07:
    title: Besluiten om te bellen
    gloss: Mateo besluit vandaag nog het kantoor te bellen.
    note: '*Voy a llamar* (ik ga bellen) + *hoy mismo* (vandaag nog); *la agencia* is het verhuurkantoor.'
  es.a1.unit14.lesson06.teach.line08:
    title: Instemmen en afronden
    gloss: Elena vindt het een goed idee en zegt dat hij dan ook thuis kan koken.
    note: '*Así puedes cocinar en casa también* (zo kun je ook thuis koken) sluit de scène af.'
