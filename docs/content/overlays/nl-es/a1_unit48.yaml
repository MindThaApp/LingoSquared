teaching:
  es.a1.unit48.lesson01.teach.leer_hacer_deporte:
    title: Lezen, sporten, koken
    gloss: lezen, sporten, koken
    note: 'Drie veelgebruikte hobbywerkwoorden: *leer* (lezen), *hacer deporte* (sporten) en *cocinar* (koken).'
    example_gloss:
    - Ik lees graag een boek.
    - Ik sport op zaterdag.
    - Ik kook graag voor vrienden.
  es.a1.unit48.lesson01.teach.el_tiempo_libre:
    title: Vrije tijd
    gloss: vrije tijd
    note: '*El tiempo libre* is een mannelijke woordgroep en dé sleutelfrase om over hobby''s te praten.'
    example_gloss: In mijn vrije tijd lees ik graag.
  es.a1.unit48.lesson01.teach.en_mi_tiempo:
    title: Zeggen wat je in je vrije tijd doet
    gloss: In mijn vrije tijd lees ik graag.
    note: '*Me gusta leer* (ik lees graag) gebruikt *gustar* + infinitief; *me gusta* blijft gelijk bij elke activiteit.'
  es.a1.unit48.lesson02.teach.escuchar_musica_dibujar:
    title: Muziek, tekenen, gamen
    gloss: naar muziek luisteren, tekenen, gamen
    note: 'Drie andere hobbywerkwoorden: *escuchar música* (naar muziek luisteren), *dibujar* (tekenen) en *jugar videojuegos* (videogames spelen).'
    example_gloss:
    - Ik luister graag naar muziek.
    - Ik teken vaak.
    - Ik game graag met vrienden.
  es.a1.unit48.lesson02.teach.me_gusta_escuchar:
    title: Zeggen dat je graag naar muziek luistert
    gloss: Ik luister graag naar muziek.
    note: '*Escuchar* krijgt zijn object direct, zonder voorzetsel: *escuchar música*. In het Nederlands zeg je wel "luisteren naar".'
  es.a1.unit48.lesson02.teach.me_gusta_jugar:
    title: Zeggen dat je graag met vrienden gamet
    gloss: Ik game graag met vrienden.
    note: '*Con amigos* (met vrienden) gebruikt opnieuw het voorzetsel *con* uit eerdere lessen.'
  es.a1.unit48.lesson03.teach.siempre_a_menudo:
    title: Altijd, vaak, soms, nooit
    gloss: altijd, vaak, soms, nooit
    note: 'De vier belangrijkste bijwoorden van frequentie: *siempre* (altijd), *a menudo* (vaak), *a veces* (soms), *nunca* (nooit). Ze staan meestal voor het werkwoord of aan het begin van de zin.'
    example_gloss:
    - Ik sport altijd op zaterdag.
    - Ik lees vaak een boek.
    - Ik teken soms.
    - Ik game nooit.
  es.a1.unit48.lesson03.teach.cada_semana_cada:
    title: Elke week, elk weekend
    gloss: elke week, elk weekend
    note: '*Cada semana* en *cada fin de semana* betekenen allebei "elke"; *cada* verandert nooit van vorm.'
    example_gloss:
    - Ik kook elke week voor vrienden.
    - Ik sport elk weekend.
  es.a1.unit48.lesson03.teach.con_palabras_femeninas:
    title: Cada verandert nooit
    gloss: 'Cada blijft gelijk: cada semana, cada fin de semana.'
    note: '*Cada* verandert nooit: het is hetzelfde voor vrouwelijke (*semana*) en mannelijke (*fin de semana*) woorden.'
  es.a1.unit48.lesson03.teach.que_haces_en:
    title: Vragen naar vrije tijd
    gloss: Wat doe je in je vrije tijd?
    note: 'Dit is de kernvraag van deze unit: gebruik hem om iedereen naar zijn of haar hobby''s te vragen.'
  es.a1.unit48.lesson04.teach.elena_a_menudo:
    title: Elena begint over hobby's
    gloss: 'Elena: We gaan vaak samen wandelen. Maar wat doe jij nog meer in je vrije tijd, Mateo?'
    note: '*A menudo paseamos juntos* (we wandelen vaak samen): *paseamos* is de *nosotros*-vorm van *pasear*.'
  es.a1.unit48.lesson04.teach.mateo_me_gusta:
    title: Mateo's hobby's
    gloss: 'Mateo: Ik kook graag, ook thuis. En ik sport vaak.'
    note: '*También en casa* (ook thuis) laat zien dat Mateo voor zijn plezier kookt, niet alleen in zijn werk in het restaurant.'
  es.a1.unit48.lesson04.teach.elena_cocinas_tambien:
    title: Elena is verrast
    gloss: 'Elena: Kook je ook thuis? Je kookt toch al de hele dag op je werk!'
    note: '*Todo el día* (de hele dag) benadrukt hoeveel Mateo al op zijn werk kookt.'
  es.a1.unit48.lesson04.teach.mateo_si_pero:
    title: Mateo legt het uit
    gloss: 'Mateo: Ja, maar ik vind koken ontspannend. En jij, wat doe jij graag?'
    note: '*Cocinar me parece relajante* betekent letterlijk "koken lijkt me ontspannend": *me parece* + bijvoeglijk naamwoord is een natuurlijke manier om je mening te geven.'
  es.a1.unit48.lesson04.teach.elena_me_gusta:
    title: Elena's hobby's
    gloss: 'Elena: Ik lees graag en ik luister vaak naar muziek.'
    note: Combineert twee hobbywerkwoorden uit eerdere lessen in één zin met *y* (en).
  es.a1.unit48.lesson04.teach.mateo_tu_tambien:
    title: Mateo vraagt naar gamen
    gloss: 'Mateo: Game jij ook?'
    note: Een korte ja/nee-vraag met *jugar videojuegos* uit les 2; *tú también* (jij ook) gebruikt de informele *tú*.
  es.a1.unit48.lesson04.teach.elena_no_nunca:
    title: Elena antwoordt
    gloss: 'Elena: Nee, ik game nooit. Maar ik teken soms wel!'
    note: '*Nunca* (nooit) en *a veces* (soms) uit les 3, tegenover elkaar gezet in één antwoord.'
  es.a1.unit48.lesson05.teach.mateo_y_yo:
    title: Hobby's vergelijken
    gloss: Mateo en ik gaan vaak samen wandelen. Maar we hebben ook andere hobby's. Mateo kookt graag, ook thuis, en sport vaak. Ik lees graag en luister vaak naar muziek. Soms teken ik, maar ik game nooit. Wat doe jij graag in je vrije tijd?
    note: Elena's bericht vat samen wat je al over hen weet en eindigt met de kernvraag van deze unit aan de lezer.
    glosses:
      paseamos: wandelen
      menudo: vaak
      juntos: samen
      otras: andere
      cocinar: kookt
      gusta: graag
      casa: thuis
      deporte: sport
      leer: lees
      escucho: luister
      música: muziek
      dibujo: teken
      veces: soms
      videojuegos: videogames spelen
      nunca: nooit
      libre: vrij
      tiempo: tijd
  es.a1.unit48.lesson06.teach.mateo_que_haces:
    title: Mateo vraagt naar het weekend
    gloss: 'Mateo: Wat doe je dit weekend?'
    note: '*Este fin de semana* (dit weekend) gebruikt *este* bij het mannelijke woord *fin de semana*.'
  es.a1.unit48.lesson06.teach.elena_todavia_no:
    title: Elena weet het nog niet
    gloss: 'Elena: Dat weet ik nog niet. Ik lees graag, maar ik wil ook naar buiten.'
    note: '*Quiero salir* (ik wil uitgaan) is een gangbare manier om te zeggen dat je het huis uit wilt.'
  es.a1.unit48.lesson06.teach.mateo_paseamos_juntos:
    title: Mateo doet een voorstel
    gloss: 'Mateo: Zullen we samen gaan wandelen? Daarna kook ik voor ons.'
    note: '*Después* (daarna) is een woord voor de volgorde: *primero*, *luego*, *después*.'
  es.a1.unit48.lesson06.teach.elena_buena_idea:
    title: Elena stemt in
    gloss: 'Elena: Goed idee! Ik vind allebei leuk: wandelen en koken.'
    note: '*Las dos cosas* (beide dingen) laat zien dat Elena van twee dingen evenveel houdt, niet van het ene meer dan van het andere.'
  es.a1.unit48.lesson06.teach.mateo_perfecto_entonces:
    title: Mateo bevestigt
    gloss: 'Mateo: Perfect! Dan zie ik je zaterdag.'
    note: Een vriendelijke afsluiting die het plan voor *el sábado* (zaterdag) bevestigt; in het Spaans staat er *el* voor een specifieke dag.
