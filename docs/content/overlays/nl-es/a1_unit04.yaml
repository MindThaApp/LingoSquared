    title: Elena en Mateo plannen de volgende les
teaching:
  es.a1.unit04.lesson01.teach.dias_entre_semana:
    title: Maandag t/m vrijdag
    gloss: maandag, dinsdag, woensdag, donderdag, vrijdag
    note: Spaanse namen van weekdagen schrijf je met een kleine letter, ook net als in het Nederlands, behalve aan het begin van een zin.
    example_gloss:
    - De kookworkshop is op dinsdag.
    - Op donderdag studeer ik Spaans.
  es.a1.unit04.lesson01.teach.fin_de_semana:
    title: Zaterdag, zondag
    gloss: Zaterdag, zondag
    note: '*Sábado* en *domingo* zijn de enige twee dagen die in het meervoud een -s krijgen (*los sábados*, *los domingos*); de andere dagen blijven in enkelvoud en meervoud hetzelfde.'
    example_gloss:
    - Op zaterdag ga ik naar de markt.
    - Op zondag rust ik uit.
  es.a1.unit04.lesson01.teach.hoy_es_viernes:
    title: Vandaag is het vrijdag
    gloss: Vandaag is het vrijdag.
    note: '*Hoy* (vandaag) + *es* (is) + de dagnaam geeft direct aan welke dag het vandaag is, zonder lidwoord.'
  es.a1.unit04.lesson01.teach.el_taller_es_los_martes:
    title: De workshop is op dinsdag
    gloss: De kookworkshop is op dinsdag.
    note: '*Los martes* (met het meervoudslidwoord *los*) betekent "op dinsdag" als vast terugkerend moment, niet alleen één bepaalde dinsdag.'
  es.a1.unit04.lesson02.teach.meses_primer_semestre:
    title: Januari t/m juni
    gloss: januari, februari, maart, april, mei, juni
    note: Net als weekdagen schrijf je Spaanse maandnamen met een kleine letter, tenzij ze een zin openen.
    example_gloss:
    - Ik ben jarig in maart.
    - In juni is het warm.
  es.a1.unit04.lesson02.teach.meses_segundo_semestre:
    title: Juli t/m december
    gloss: juli, augustus, september, oktober, november, december
    note: '*Septiembre* lijkt sterk op het Nederlandse "september": de meeste Spaanse maandnamen lijken veel op de Nederlandse.'
    example_gloss:
    - De kookworkshop begint in juli.
    - In december bezoek ik mijn familie.
  es.a1.unit04.lesson02.teach.mi_cumpleanos_es_en_marzo:
    title: Ik ben in maart jarig
    gloss: Ik ben jarig in maart.
    note: '*En* (in) gebruik je met alleen de maandnaam, zonder een bepaalde dag.'
  es.a1.unit04.lesson03.teach.que_fecha_es_hoy:
    title: Naar de datum vragen
    gloss: Welke datum is het vandaag?
    note: '*Qué fecha* (welke datum) is de standaardmanier om naar een datum te vragen, anders dan *qué hora* (hoe laat), dat in een latere unit aan bod komt.'
  es.a1.unit04.lesson03.teach.hoy_es_el_veintidos_de_julio:
    title: Een datum noemen
    gloss: Vandaag is het tweeëntwintig juli.
    note: '*El veintidós de julio* staat er letterlijk als "de tweeëntwintig van juli": het Spaans gebruikt gewoon een hoofdtelwoord, geen rangtelwoord zoals het Nederlandse "tweeëntwintigste".'
  es.a1.unit04.lesson03.teach.formato_fecha_note:
    title: Spaanse datumnotatie
    gloss: Hoe je in het Spaans een datum zegt.
    note: Hoofdtelwoord + de + maand. Voor de eerste van de maand is *el primero* gebruikelijk (vooral in Latijns-Amerika); *el uno* wordt ook gebruikt, vooral in Spanje.
    target_text: 'Het Spaans noemt een datum met hoofdtelwoord + de + maand: el veintidós de julio is letterlijk "de tweeëntwintig van juli". Voor de eerste van de maand zeggen veel sprekers (vooral in Latijns-Amerika) *el primero*; *el uno* komt ook veel voor, vooral in Spanje.'
  es.a1.unit04.lesson03.teach.cuando_es_el_taller:
    title: Vraag wanneer de workshop is
    gloss: Wanneer is de workshop?
    note: '*Cuándo* (wanneer) vraagt algemeen naar het tijdstip; *qué fecha* (de andere vraag in deze les) vraagt specifiek naar een kalenderdatum. Beide zijn hier natuurlijk.'
  es.a1.unit04.lesson03.teach.el_taller_es_el_veintidos_de_julio:
    title: Zeg de datum van de workshop
    gloss: De workshop is op tweeëntwintig juli.
    note: Hetzelfde datumpatroon als in *hoy es el veintidós de julio*, nu met een ander onderwerp (*el taller*).
  es.a1.unit04.lesson04.teach.cuando_es_tu_cumpleanos:
    title: Vraag naar iemands verjaardag
    gloss: Wanneer ben jij jarig?
    note: '*Tu cumpleaños* (jouw verjaardag, informeel) gebruikt het *tú*-register, zoals je dat bij vrienden doet.'
  es.a1.unit04.lesson04.teach.mi_cumpleanos_es_el_diez_de_marzo:
    title: Zeg wanneer jij jarig bent
    gloss: Mijn verjaardag is op tien maart.
    note: Anders dan *en marzo* (in maart, alleen de maand) gebruik je bij een volledige verjaardagsdatum *el* plus het dagnummer, hetzelfde patroon als *el veintidós de julio*.
  es.a1.unit04.lesson04.teach.el_de_mateo_es_el_veintidos_de_agosto:
    title: Zeg wanneer iemand anders jarig is
    gloss: Mateo is jarig op tweeëntwintig augustus.
    note: '*El cumpleaños de Mateo* (de verjaardag van Mateo) gebruikt *de* om bezit aan te geven, dezelfde constructie als *la familia de Elena*.'
  es.a1.unit04.lesson04.teach.felicidades:
    title: Gefeliciteerd!
    gloss: Gefeliciteerd! / Fijne verjaardag!
    note: '*¡Felicidades!* is het algemene woord voor gefeliciteerd, dat je bij verjaardagen en bij ander goed nieuws gebruikt.'
    example_gloss: Gefeliciteerd, Elena! Vandaag ben je jarig.
  es.a1.unit04.lesson05.teach.horario_reading:
    title: Het workshopschema lezen
    gloss: De kookworkshop is op dinsdag. De volgende les is op tweeëntwintig juli. Daarna is er een les op negenentwintig juli. De workshop eindigt op twaalf augustus.
    note: Dit korte schema gebruikt de namen van de dagen en het datumpatroon dat je hebt geleerd in één samenhangende tekst.
    glosses:
      taller: workshop
      cocina: koken
      martes: op dinsdag
      próxima: volgende
      clase: les
      veintidós: tweeëntwintig
      julio: juli
      Después: daarna
      hay: er is (van haber)
      veintinueve: negenentwintig
      termina: eindigt (van terminar)
      doce: twaalf
      agosto: augustus
  es.a1.unit04.lesson05.teach.la_proxima_clase:
    title: De volgende les
    gloss: de volgende les
    note: '*Próxima* (volgende) congrueert met het vrouwelijke woord *clase*; bij een mannelijk woord gebruik je *próximo*.'
  es.a1.unit04.lesson05.teach.despues_note:
    title: Después (daarna)
    gloss: Hoe *después* gebeurtenissen op elkaar laat volgen.
    note: '*Después* = daarna, nadien.'
    target_text: '*Después* (daarna, vervolgens) verbindt twee gebeurtenissen op volgorde: eerst het ene, dan het andere.'
  es.a1.unit04.lesson06.teach.line01:
    title: Vraag naar de volgende les
    gloss: Mateo vraagt Elena wanneer de volgende les van de workshop is.
    note: '*La próxima clase del taller* = de volgende les van de workshop.'
  es.a1.unit04.lesson06.teach.line02:
    title: Noem de datum
    gloss: Elena bevestigt dat het tweeëntwintig juli is, een dinsdag.
    note: 'Elena voegt *un martes* (een dinsdag) toe na de datum, waarmee ze bevestigt dat de les op de vaste dag van de workshop valt: dinsdag.'
  es.a1.unit04.lesson06.teach.line03:
    title: Vraag wanneer de workshop eindigt
    gloss: Mateo vraagt wanneer de workshop eindigt.
    note: '*Perfecto* (perfect) is een natuurlijke korte reactie voordat je een vervolgvraag stelt.'
  es.a1.unit04.lesson06.teach.line04:
    title: Noem de einddatum
    gloss: Elena zegt dat de workshop op twaalf augustus eindigt.
    note: Dezelfde einddatum als op het afgedrukte schema.
  es.a1.unit04.lesson06.teach.line05:
    title: Vraag midden in het gesprek naar een verjaardag
    gloss: Mateo zegt "trouwens" en vraagt wanneer Elena jarig is.
    note: '*Por cierto* (trouwens) leidt op een natuurlijke manier een nieuw onderwerp in tijdens een gesprek.'
  es.a1.unit04.lesson06.teach.line06:
    title: Noem de datum en stel de vraag terug
    gloss: 'Elena zegt tien maart en vraagt dan: "En die van jou?"'
    note: '*¿Y el tuyo?* (en die van jou?) gebruikt het bezittelijk voornaamwoord *tuyo*, een nieuwe korte vorm om een vraag terug te stellen over iets wat al genoemd is (*cumpleaños* is mannelijk, dus *tuyo* en niet *tuya*).'
  es.a1.unit04.lesson06.teach.line07:
    title: Noem de verjaardag van Mateo
    gloss: Mateo zegt tweeëntwintig augustus.
    note: Een kort, volledig antwoord met hetzelfde datumpatroon, zonder "mi cumpleaños es" te herhalen. Dat is natuurlijk in een snel gesprek.
  es.a1.unit04.lesson06.teach.line08:
    title: Reageer en let op de timing
    gloss: Elena reageert enthousiast en merkt op dat zijn verjaardag na het einde van de workshop valt.
    note: '*Es después del taller* (het is na de workshop): 22 augustus komt na het einde van de workshop op 12 augustus.'
