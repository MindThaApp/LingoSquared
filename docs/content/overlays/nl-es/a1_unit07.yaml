  es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue:
    title: Elena en Mateo gaan naar de markt
teaching:
  es.a1.unit07.lesson01.teach.el_mercado:
    title: De markt
    gloss: de markt
    note: '*Mercado* is mannelijk.'
    example_gloss: Laten we naar de markt gaan.
  es.a1.unit07.lesson01.teach.fruta_verdura:
    title: Fruit, groente
    gloss: fruit, groente
    note: '*Verdura* betekent groente in het algemeen (vaak groene groente). Het is een vrouwelijk enkelvoudig zelfstandig naamwoord dat ook collectief wordt gebruikt, ongeveer zoals het Nederlandse "groente".'
    example_gloss:
    - Ik wil fruit kopen.
    - De groente is vers.
  es.a1.unit07.lesson01.teach.huevos_pan:
    title: Eieren, brood
    gloss: eieren, brood
    note: '*Huevos* is al meervoud (het enkelvoud is *huevo*). *Pan* (brood) is net als in het Nederlands een stofnaam en heeft in de gewone betekenis geen natuurlijk meervoud.'
    example_gloss:
    - Ik heb eieren nodig.
    - Het brood is van vanochtend.
  es.a1.unit07.lesson02.teach.cuanto_cuesta:
    title: Naar de prijs vragen
    gloss: Hoeveel kost het?
    note: '*Cuesta* is de derde persoon van *costar* (kosten), een nieuw werkwoord in deze unit.'
  es.a1.unit07.lesson02.teach.cuanto_es:
    title: Naar de prijs vragen, andere vorm
    gloss: Hoeveel is het?
    note: Zie de volgende grammaticanotitie, waarin dit wordt vergeleken met *¿Cuánto cuesta?*.
  es.a1.unit07.lesson02.teach.cuesta_dos:
    title: Een prijs noemen
    gloss: Het kost twee.
    note: 'Een kort, volledig antwoord over de prijs: de valuta of eenheid blijkt uit de context, net zoals je in het Nederlands bij het winkelen vaak alleen een getal noemt.'
  es.a1.unit07.lesson02.teach.cuanto_cuesta_vs_es_note:
    title: Cuánto cuesta vs. Cuánto es
    gloss: Twee even natuurlijke manieren om naar een prijs te vragen.
    note: Zie de tekst op de kaart zelf.
    target_text: '*¿Cuánto cuesta?* (hoeveel kost het?) en *¿Cuánto es?* (hoeveel is het?) zijn allebei natuurlijke manieren om naar een prijs te vragen -- in deze alledaagse winkelsituatie zijn ze uitwisselbaar.'
  es.a1.unit07.lesson03.teach.una_docena_de_huevos:
    title: Om een dozijn eieren vragen
    gloss: Een dozijn eieren, alsjeblieft.
    note: '*Docena* (dozijn) is in het Spaans een zelfstandig naamwoord dat altijd wordt gevolgd door *de* plus het product, zoals ook in het Nederlands "een dozijn eieren" kan, maar in het Spaans is de verplicht.'
  es.a1.unit07.lesson03.teach.un_kilo_de_tomates:
    title: Om een kilo tomaten vragen
    gloss: Een kilo tomaten, alsjeblieft.
    note: '*Kilo* volgt hetzelfde patroon als *docena*: *de* plus het product.'
  es.a1.unit07.lesson03.teach.medio_kilo:
    title: Een halve kilo
    gloss: een halve kilo
    note: '*Medio* (half) staat voor het zelfstandig naamwoord en komt overeen met het geslacht (*medio kilo* is mannelijk; *media docena* is vrouwelijk).'
    example_gloss: Een halve kilo brood, alsjeblieft.
  es.a1.unit07.lesson03.teach.un_poco_de:
    title: Een beetje
    gloss: een beetje
    note: '*Un poco de* gebruik je voor een niet nader bepaalde kleine hoeveelheid, als je geen exacte hoeveelheid nodig hebt.'
    example_gloss: Ik wil een beetje fruit.
  es.a1.unit07.lesson04.teach.necesita_algo_mas:
    title: Vragen of er nog iets nodig is
    gloss: Heeft u nog iets nodig?
    note: '*Necesita* is de *usted*-vorm van *necesitar*, de beleefde vorm die een verkoper meestal tegen een klant gebruikt.'
  es.a1.unit07.lesson04.teach.no_creo_que_ya_tenemos_todo:
    title: Zeggen dat je alles hebt
    gloss: Nee, ik denk dat we alles al hebben.
    note: '*Creo que* (ik denk dat) is een veelgebruikte manier om een uitspraak te verzachten. Hier bevestigt het dat de boodschappenlijst compleet is.'
  es.a1.unit07.lesson04.teach.gracias_vendedor:
    title: De verkoper bedanken
    gloss: Perfect, dank u.
    note: Een korte, natuurlijke afsluiting van een aankoop.
  es.a1.unit07.lesson05.teach.etiquetas_reading:
    title: Prijskaartjes lezen
    gloss: 'Kraam van Rosa: tomaten, twee per kilo. Eieren, vier per dozijn. Brood, zes. Elke dag vers fruit.'
    note: 'Een typisch prijskaartje op een marktkraam: het product, de prijs en dan de eenheid waarvoor die prijs geldt (*el kilo*, *la docena*). *Puesto* is een marktkraam; Rosa heeft deze kraam.'
    glosses:
      Puesto: kraam
      tomates: tomaten
      kilo: kilo
      Huevos: eieren
      docena: dozijn
      Pan: brood
      Fruta: fruit
      fresca: vers
      todos: elke
      días: dagen
  es.a1.unit07.lesson05.teach.el_kilo_note:
    title: El kilo als "per kilo"
    gloss: Hoe een eenheidswoord na een prijs "per" die eenheid betekent.
    note: Zie de tekst op de kaart zelf.
    target_text: '*El kilo* na een prijs ("tomates, dos el kilo") betekent „per kilo” -- de prijs geldt voor elke kilo die je koopt.'
  es.a1.unit07.lesson06.teach.line01:
    title: Voorstellen om naar de markt te gaan
    gloss: Elena stelt voor naar de markt te gaan voor ingrediënten voor de volgende les.
    note: '*Para la próxima clase* betekent "voor de volgende les", dus de volgende bijeenkomst van de kookworkshop.'
  es.a1.unit07.lesson06.teach.line02:
    title: Instemmen en vragen wat nodig is
    gloss: Mateo stemt in en vraagt wat ze nodig hebben.
    note: '*¿Qué necesitamos?* gebruikt de *nosotros*-vorm van *necesitar*, die past bij "wij hebben nodig".'
  es.a1.unit07.lesson06.teach.line03:
    title: Verse tomaten aanwijzen
    gloss: Elena zegt dat ze eerst groente nodig hebben en wijst erop hoe vers de tomaten eruitzien.
    note: '*¡Qué tomates tan frescos!* (wat een verse tomaten!) is een uitroep met *qué*, net als *¡Qué bonito!* uit Unit 3, maar nu met een zelfstandig naamwoord: *qué* + zelfstandig naamwoord + *tan* + bijvoeglijk naamwoord.'
  es.a1.unit07.lesson06.teach.line04:
    title: De verkoper vraagt naar de hoeveelheid
    gloss: De verkoper vraagt Elena hoeveel ze wil.
    note: '*Señorita* is een beleefde aanspreekvorm voor een jonge vrouw, passend bij de *usted*-vorm die de verkoper tegen een klant gebruikt (sommige sprekers vinden het tegenwoordig wat ouderwets).'
  es.a1.unit07.lesson06.teach.line05:
    title: Een kilo bestellen en naar de prijs vragen
    gloss: Elena vraagt om een kilo en vraagt wat het kost.
    note: Combineert *un kilo* met *¿Cuánto cuesta?* uit eerder in deze unit in één natuurlijk gesprekje.
  es.a1.unit07.lesson06.teach.line06:
    title: De prijs noemen
    gloss: De verkoper zegt dat het twee kost.
    note: '*Cuesta dos*: een kort antwoord over de prijs, waarbij de valuta uit de context blijkt.'
  es.a1.unit07.lesson06.teach.line07:
    title: Mateo bestelt eieren en brood
    gloss: Mateo zegt dat hij een dozijn eieren en brood nodig heeft.
    note: Combineert *huevos*/*pan* met *una docena de* uit eerder in deze unit. *Yo* is optioneel en legt een beetje nadruk ("ik heb nodig...").
  es.a1.unit07.lesson06.teach.line08:
    title: De verkoper noemt beide prijzen
    gloss: De verkoper zegt dat de eieren vier kosten en het brood zes.
    note: '*Cuestan* (meervoud, ze kosten) komt overeen met het meervoudige onderwerp *los huevos*, anders dan het enkelvoud *cuesta* dat bij de tomaten werd gebruikt.'
  es.a1.unit07.lesson06.teach.line09:
    title: De verkoper bedanken
    gloss: Mateo zegt dat het prima is en bedankt.
    note: Dezelfde korte afsluiting als eerder in deze unit.
  es.a1.unit07.lesson06.teach.line10:
    title: Een vriend vragen of hij nog iets nodig heeft
    gloss: Elena vraagt Mateo of hij nog iets nodig heeft.
    note: '*¿Necesitas...?* is de *tú*-vorm, voor een vriend. De vorm van de verkoper, *¿Necesita...?*, is de *usted*-vorm.'
  es.a1.unit07.lesson06.teach.line11:
    title: Zeggen dat je alles hebt
    gloss: Mateo zegt nee, hij denkt dat ze alles al hebben.
    note: '*Creo que* (ik denk dat) verzacht het antwoord. *Ya* betekent "al".'
