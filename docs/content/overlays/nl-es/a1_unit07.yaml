  es.a1.unit07.lesson02.preguntar_el_precio:
    title: Naar de prijs vragen
  es.a1.unit07.lesson03.cantidades:
    title: 'Hoeveelheden: dozijn, kilo, een beetje'
  es.a1.unit07.lesson04.una_compra_sencilla:
    title: Een eenvoudige aankoop
  es.a1.unit07.lesson05.leer_las_etiquetas_de_precio:
