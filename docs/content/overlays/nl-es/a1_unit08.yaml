    title: Mateo vraagt naar de buurt
teaching:
  es.a1.unit08.lesson01.teach.banco_farmacia:
    title: Bank, apotheek
    gloss: bank, apotheek
    note: '*Banco* is mannelijk; *farmacia* is vrouwelijk.'
    example_gloss:
    - Ik ga naar de bank.
    - De apotheek gaat om negen uur open.
  es.a1.unit08.lesson01.teach.parque_restaurante:
    title: Park, restaurant
    gloss: park, restaurant
    note: Beide zelfstandige naamwoorden zijn mannelijk.
    example_gloss:
    - Het park is heel mooi.
    - We eten in het restaurant.
  es.a1.unit08.lesson01.teach.biblioteca:
    title: Bibliotheek
    gloss: bibliotheek
    note: '*Biblioteca* is vrouwelijk.'
    example_gloss: Ik studeer in de bibliotheek.
  es.a1.unit08.lesson02.teach.cerca_de:
    title: Dichtbij
    gloss: Het restaurant is dichtbij de markt.
    note: Na *cerca de* (dichtbij) volgt altijd *de* voor de plek waar je naar verwijst.
  es.a1.unit08.lesson02.teach.lejos_de:
    title: Ver van
    gloss: Het park is ver van de markt.
    note: '*Lejos de* (ver van) is het tegenovergestelde van *cerca de*.'
  es.a1.unit08.lesson02.teach.al_lado_de:
    title: Naast
    gloss: De bank ligt naast de markt.
    note: '*Al lado de* (naast) is een vaste uitdrukking (*al* = *a* + *el lado*). Voor een mannelijk zelfstandig naamwoord zoals *mercado* wordt *de* + *el* samengetrokken tot *del*: *al lado del mercado*.'
  es.a1.unit08.lesson02.teach.enfrente_de:
    title: Tegenover
    gloss: De apotheek ligt tegenover de markt.
    note: '*Enfrente de* (tegenover) beschrijft twee plekken aan weerszijden van iets, zoals een straat.'
  es.a1.unit08.lesson02.teach.entre:
    title: Tussen
    gloss: De bibliotheek ligt tussen de bank en het park.
    note: '*Entre* (tussen) heeft twee referentiepunten nodig, hier verbonden met *y* (en).'
  es.a1.unit08.lesson03.teach.donde_esta_el_banco:
    title: Vragen waar de bank is
    gloss: Waar is de bank?
    note: '*Dónde está* (waar is) is het standaard vraagpatroon om een plek te vinden.'
  es.a1.unit08.lesson03.teach.esta_al_lado_del_mercado:
    title: Antwoorden met een locatie
    gloss: Het is naast de markt.
    note: '*Del* is de samentrekking van *de* + *el*, verplicht voor het mannelijke *mercado*.'
  es.a1.unit08.lesson03.teach.donde_esta_la_farmacia:
    title: Vragen waar de apotheek is
    gloss: Waar is de apotheek?
    note: Hetzelfde vraagpatroon, nu met een vrouwelijk lidwoord. De vraag zelf verandert niet door het geslacht.
  es.a1.unit08.lesson03.teach.esta_enfrente_del_mercado:
    title: 'Antwoord: tegenover'
    gloss: Het is tegenover de markt.
    note: '*Enfrente de* + *el mercado* wordt *enfrente del mercado*, dezelfde samentrekking *del* als in *al lado del mercado*.'
  es.a1.unit08.lesson04.teach.esta_lejos:
    title: Vragen of het ver is
    gloss: Is het ver?
    note: Een korte vervolgvraag waarin het onderwerp wegvalt, omdat het uit de context al duidelijk is.
  es.a1.unit08.lesson04.teach.no_esta_cerca:
    title: 'Antwoord: nee, het is dichtbij'
    gloss: Nee, het is dichtbij.
    note: '*Cerca* alleen (zonder *de*) werkt als kort antwoord, anders dan de volledige uitdrukking *cerca de* bij een genoemde plek.'
  es.a1.unit08.lesson04.teach.si_esta_lejos:
    title: 'Antwoord: ja, best ver'
    gloss: Ja, het is best ver.
    note: '*Bastante* (best, tamelijk) versterkt *lejos*, maar minder sterk dan *muy* (heel).'
  es.a1.unit08.lesson05.teach.barrio_reading:
    title: Lezen over de buurt
    gloss: In deze buurt zijn veel nuttige plekken. De bank is naast de markt. De apotheek is tegenover de markt. Het park is ver weg, maar de bibliotheek ligt tussen de bank en het park. Het restaurant is heel dicht bij de markt.
    note: Deze korte tekst brengt de locatiezinnen van deze unit samen in één beschrijving van de buurt.
    glosses:
      barrio: wijk
      hay: er zijn (van haber)
      muchos: veel
      lugares: plekken
      útiles: nuttig
      banco: bank
      está: bevindt zich (van estar)
      lado: kant
      mercado: markt
      farmacia: apotheek
      enfrente: tegenover
      parque: park
      lejos: ver
      biblioteca: bibliotheek
      entre: tussen
      restaurante: restaurant
      cerca: dichtbij
  es.a1.unit08.lesson05.teach.hay_note:
    title: Hay (er is/er zijn)
    gloss: Waarom hay nooit verandert in enkelvoud of meervoud.
    note: 'Hay (er is/er zijn) verandert niet in enkelvoud of meervoud: hay un banco en hay muchos lugares gebruiken hetzelfde woord.'
    target_text: '*Hay* (er is/er zijn) verandert niet in enkelvoud of meervoud: *hay un banco* en *hay muchos lugares* gebruiken hetzelfde woord.'
  es.a1.unit08.lesson06.teach.line01:
    title: Vragen waar de bank is
    gloss: Mateo vraagt Elena waar de bank is.
    note: Dezelfde vraag *¿Dónde está...?* als eerder in deze unit, hier begonnen met Elena's naam om haar aandacht te trekken.
  es.a1.unit08.lesson06.teach.line02:
    title: Antwoorden en naar de markt verwijzen
    gloss: Elena zegt dat het naast de markt is, waar ze de eieren hebben gekocht.
    note: '*Donde compramos los huevos* (waar we de eieren hebben gekocht) verwijst terug naar hun boodschappen in Unit 7.'
  es.a1.unit08.lesson06.teach.line03:
    title: Naar de apotheek vragen
    gloss: Mateo reageert en vraagt naar de apotheek.
    note: '*Ah, sí* (ah, ja) is een natuurlijke korte reactie voor de volgende vraag.'
  es.a1.unit08.lesson06.teach.line04:
    title: 'Antwoord: tegenover'
    gloss: Elena zegt dat het tegenover de markt is.
    note: 'Een kort antwoord: het onderwerp (*la farmacia*) valt weg, omdat het uit de vraag duidelijk is.'
  es.a1.unit08.lesson06.teach.line05:
    title: Naar het park vragen
    gloss: Mateo vraagt naar het park en of het dichtbij is.
    note: Twee vragen in één beurt, heel gewoon in een informeel gesprek.
  es.a1.unit08.lesson06.teach.line06:
    title: 'Antwoord: ver, en dan de bibliotheek noemen'
    gloss: Elena zegt dat het park ver is, maar dat de bibliotheek tussen de bank en het park ligt.
    note: '*Pero* (maar) zet de afstand van het park tegenover de gunstigere ligging van de bibliotheek.'
  es.a1.unit08.lesson06.teach.line07:
    title: Bedanken en naar het restaurant vragen
    gloss: Mateo bedankt Elena en vraagt naar het restaurant waar ze hebben gegeten.
    note: '*El restaurante donde comimos* (het restaurant waar we hebben gegeten) verwijst terug naar hun lunch in Unit 6.'
  es.a1.unit08.lesson06.teach.line08:
    title: Bevestigen dat het heel dichtbij is
    gloss: Elena bevestigt dat het heel dicht bij de markt is.
    note: '*Muy cerca* (heel dichtbij): *muy* (heel) is sterker dan *bastante* (best), zoals in *bastante lejos* (best ver).'
