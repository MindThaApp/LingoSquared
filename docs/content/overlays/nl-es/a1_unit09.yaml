  es.a1.unit09.lesson01.la_calle_y_la_esquina:
    title: De straat en de hoek
  es.a1.unit09.lesson02.verbos_de_movimiento:
    title: Rechtdoor, afslaan, oversteken
  es.a1.unit09.lesson03.como_llego_a:
    title: Hoe kom ik bij...?
  es.a1.unit09.lesson04.confirmar_direcciones:
    title: De route bevestigen
  es.a1.unit09.lesson05.leer_las_direcciones:
    title: Een geschreven routebeschrijving lezen
  es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue:
    title: Elena legt Mateo de weg uit
teaching:
  es.a1.unit09.lesson01.teach.la_calle:
    title: De straat
    gloss: de straat
    note: '*Calle* is vrouwelijk.'
    example_gloss: Ik woon in deze straat.
  es.a1.unit09.lesson01.teach.la_esquina:
    title: De hoek
    gloss: de hoek
    note: '*Esquina* is vrouwelijk.'
    example_gloss: De bank staat op de hoek.
  es.a1.unit09.lesson02.teach.seguir_derecho:
    title: Rechtdoor
    gloss: Ga rechtdoor.
    note: '*Sigue* is de informele gebiedende wijs van *seguir* (volgen/doorgaan) en komt in de routebeschrijvingen van deze les steeds terug.'
  es.a1.unit09.lesson02.teach.doblar_izquierda:
    title: Linksaf
    gloss: Sla linksaf.
    note: '*Dobla* is de informele gebiedende wijs van *doblar* (afslaan/vouwen). Zie de grammaticakaart hierna over *doblar* en *girar*.'
  es.a1.unit09.lesson02.teach.girar_derecha:
    title: Rechtsaf
    gloss: Sla rechtsaf.
    note: '*Gira* is de informele gebiedende wijs van *girar* (afslaan/draaien) en is helemaal uitwisselbaar met *doblar*.'
  es.a1.unit09.lesson02.teach.cruzar_la_calle:
    title: De straat oversteken
    gloss: Steek de straat over.
    note: '*Cruza* is de informele gebiedende wijs van *cruzar* (oversteken).'
  es.a1.unit09.lesson02.teach.doblar_vs_girar_note:
    title: Doblar of girar
    gloss: Twee even natuurlijke woorden voor "afslaan".
    note: Zie de tekst op de kaart zelf.
    target_text: '*Doblar* en *girar* betekenen allebei "afslaan" en zijn hier helemaal uitwisselbaar -- het is een regionale voorkeur, geen verschil in register of betekenis. Beide komen in deze les voor.'
  es.a1.unit09.lesson03.teach.como_llego_a_la_biblioteca:
    title: Vragen hoe je ergens komt
    gloss: Hoe kom ik bij de bibliotheek?
    note: '*Cómo llego a* (hoe kom ik bij) is de standaardmanier om de weg naar een bepaalde plek te vragen.'
  es.a1.unit09.lesson03.teach.es_facil:
    title: Zeggen dat het makkelijk is
    gloss: Het is makkelijk.
    note: Een veelgebruikte, geruststellende zin die je zegt voordat je de weg uitlegt.
  es.a1.unit09.lesson03.teach.sigue_derecho_por_esta_calle:
    title: Rechtdoor door deze straat
    gloss: Ga rechtdoor door deze straat.
    note: '*Por esta calle* (door/langs deze straat) geeft aan welke straat je volgt.'
  es.a1.unit09.lesson03.teach.dobla_a_la_izquierda_en_la_esquina:
    title: Op de hoek linksaf
    gloss: Sla op de hoek linksaf.
    note: '*En la esquina* (op de hoek) zegt waar je afslaat.'
  es.a1.unit09.lesson04.teach.esta_bien_asi:
    title: Om bevestiging vragen
    gloss: Klopt dat?
    note: '*¿Está bien así?* (is het zo goed?) controleert of je het goed begrepen hebt nadat je de route hebt herhaald, de logische volgende stap nadat iemand je de weg heeft uitgelegd.'
  es.a1.unit09.lesson04.teach.si_asi_es:
    title: Bevestigen
    gloss: Ja, dat klopt.
    note: '*Así es* (zo is het) is een natuurlijke, korte bevestiging.'
  es.a1.unit09.lesson04.teach.no_te_pierdas:
    title: Raak niet verdwaald
    gloss: Raak niet verdwaald!
    note: '*No te pierdas* is de informele ontkennende gebiedende wijs van *perderse* (verdwalen), een warm, ongedwongen afscheid.'
  es.a1.unit09.lesson05.teach.direcciones_reading:
    title: Een geschreven routebeschrijving lezen
    gloss: 'Om vanaf de markt bij de bibliotheek te komen: ga rechtdoor door deze straat. Sla op de hoek linksaf. Steek daarna de straat over. De bibliotheek is aan de rechterkant.'
    note: 'Geschreven routebeschrijvingen noemen de stappen op volgorde: *Para llegar a...* (om bij ... te komen) noemt de bestemming, daarna is elke stap een gebiedende wijs van *tú* (*sigue*, *dobla*, *cruza*) en *después* (daarna) verbindt de stappen.'
    glosses:
      llegar: komen / aankomen
      biblioteca: bibliotheek
      desde: vanaf
      mercado: markt
      sigue: doorgaan / volgen (van seguir)
      derecho: rechtdoor
      calle: straat
      Dobla: afslaan (van doblar)
      izquierda: links
      esquina: hoek
      Después: daarna
      cruza: oversteken (van cruzar)
      está: bevindt zich (van estar)
      derecha: rechts
  es.a1.unit09.lesson05.teach.desde_note:
    title: Desde (vanaf)
    gloss: Hoe desde het beginpunt van een route aangeeft.
    note: Zie de tekst op de kaart zelf.
    target_text: '*Desde* (vanaf) geeft het beginpunt van een route aan, samen met *a* (naar) voor de bestemming -- *desde el mercado* ... *a la biblioteca*.'
  es.a1.unit09.lesson06.teach.line01:
    title: De weg vragen
    gloss: Mateo vraagt Elena hoe hij vanaf de markt bij de bibliotheek komt.
    note: 'Dezelfde vraag *¿Cómo llego a...?* als eerder in deze les, nu met een beginpunt: *desde el mercado* (vanaf de markt).'
  es.a1.unit09.lesson06.teach.line02:
    title: De eerste stap geven
    gloss: Elena zegt dat het makkelijk is en geeft de eerste aanwijzing.
    note: '*Es fácil* (het is makkelijk) stelt gerust voordat de eerste stap komt.'
  es.a1.unit09.lesson06.teach.line03:
    title: Herhaal en vraag verder
    gloss: Mateo herhaalt de aanwijzing en vraagt wat er daarna komt.
    note: '*Sigo derecho* (ik ga rechtdoor) is de ik-vorm van *seguir*. Zo bevestigt Mateo actief terwijl hij de uitleg volgt.'
  es.a1.unit09.lesson06.teach.line04:
    title: Geef de tweede stap
    gloss: Elena zegt dat hij bij de hoek linksaf moet.
    note: '*Dobla* (sla af) -- *gira* zou hier hetzelfde betekenen.'
  es.a1.unit09.lesson06.teach.line05:
    title: Herhaal en controleer
    gloss: Mateo herhaalt de afslag en vraagt of dat klopt.
    note: '*Doblo* (ik sla af) sluit aan op zijn eerdere *Sigo derecho* -- Mateo herhaalt elke stap in de *yo*-vorm om te controleren of hij het goed heeft.'
  es.a1.unit09.lesson06.teach.line06:
    title: Bevestig en geef de laatste stappen
    gloss: Elena bevestigt het en zegt dat hij de straat moet oversteken -- de bibliotheek ligt dan rechts.
    note: '*Sí, así es* (ja, dat klopt) bevestigt, en *después* (daarna) leidt de laatste stappen van de route in.'
  es.a1.unit09.lesson06.teach.line07:
    title: Bedank Elena
    gloss: Mateo bedankt Elena hartelijk.
    note: '*Muchas gracias* (hartelijk bedankt) is een warmere versie van het simpele *gracias*.'
  es.a1.unit09.lesson06.teach.line08:
    title: Reageer en neem afscheid
    gloss: Elena zegt dat het graag gedaan is en dat hij niet moet verdwalen.
    note: '*De nada* (graag gedaan) is het standaardantwoord op *gracias*.'
