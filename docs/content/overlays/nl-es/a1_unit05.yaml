teaching:
  es.a1.unit05.lesson01.teach.que_hora_es:
    title: Naar de tijd vragen
    gloss: Hoe laat is het?
    note: '*Qué hora* (welk uur) vraagt naar de tijd op de klok, in tegenstelling tot *qué fecha* (welke datum).'
  es.a1.unit05.lesson01.teach.es_la_una:
    title: Het is één uur
    gloss: Het is één uur.
    note: Zie de volgende grammaticakaart over waarom alleen bij één uur *es* (en niet *son*) wordt gebruikt.
  es.a1.unit05.lesson01.teach.es_vs_son_note:
    title: Es of son bij de tijd
    gloss: Waarom één uur anders is dan alle andere uren.
    note: '*Es la una* (enkelvoud) maar *son las dos, son las tres...* (meervoud).'
    target_text: Bij één uur gebruik je het enkelvoud *es* (Es la una), maar bij alle andere uren het meervoud *son* (Son las dos, Son las tres...), omdat *la una* enkelvoud is ("het ene uur") en *las dos*, *las tres* enz. meervoud zijn.
  es.a1.unit05.lesson01.teach.son_las_horas:
    title: Twee, vier, vijf, zeven uur
    gloss: Het is twee uur, het is vier uur, het is vijf uur, het is zeven uur.
    note: '*Son las...* (meervoud) gebruik je voor alle uren behalve één uur, zoals in de vorige grammaticakaart.'
    example_gloss:
    - Het is twee uur.
    - Het is vier uur.
    - Het is vijf uur.
    - Het is zeven uur.
  es.a1.unit05.lesson02.teach.y_cuarto:
    title: Kwart over
    gloss: Het is kwart over vier.
    note: '*Y cuarto* (en een kwart) telt vijftien minuten op bij het genoemde uur.'
  es.a1.unit05.lesson02.teach.y_media:
    title: Half
    gloss: Het is half acht (zeven uur dertig).
    note: '*Y media* (en een half) telt dertig minuten op bij het genoemde uur. Let op: in het Nederlands tel je naar het volgende uur toe (half acht), in het Spaans vanaf het genoemde uur.'
  es.a1.unit05.lesson02.teach.menos_cuarto:
    title: Kwart voor
    gloss: Het is kwart voor vijf (vier uur vijfenveertig).
    note: Zie de volgende grammaticakaart over hoe *menos* terugtelt naar het volgende uur.
  es.a1.unit05.lesson02.teach.menos_note:
    title: Menos (voor het hele uur)
    gloss: Hoe je in het Spaans de minuten vóór het volgende uur telt.
    note: '*Las cinco menos cuarto* = kwart voor vijf (4:45).'
    target_text: '*Menos* (min, voor) telt terug naar het volgende hele uur: *las cinco menos cuarto* is 4:45, ofwel "kwart voor vijf", net als in het Nederlands.'
  es.a1.unit05.lesson03.teach.partes_del_dia:
    title: Ochtend, middag, avond/nacht
    gloss: '''s ochtends, ''s middags, ''s avonds/''s nachts'
    note: '*De la mañana/tarde/noche* maakt duidelijk of het om de ochtend of de middag gaat, zoals je in het Nederlands "''s ochtends" of "''s nachts" achter een tijd zet.'
    example_gloss:
    - Het is acht uur 's ochtends.
    - De workshop begint om vier uur 's middags.
    - Het is tien uur 's avonds.
  es.a1.unit05.lesson03.teach.taller_empieza_cuatro_tarde:
    title: De workshop begint om vier uur
    gloss: De workshop begint om vier uur 's middags.
    note: '*Empieza* (begint) is de derde persoon van *empezar*, een nieuw werkwoord in deze les.'
  es.a1.unit05.lesson03.teach.a_que_hora_empieza:
    title: Vragen hoe laat iets begint
    gloss: Hoe laat begint de workshop?
    note: '*A qué hora* (hoe laat) is de gebruikelijke manier om te vragen wanneer een bepaalde gebeurtenis plaatsvindt, in tegenstelling tot het algemene *qué hora es* (hoe laat is het nu).'
  es.a1.unit05.lesson04.teach.nos_vemos_a_que_hora:
    title: Vragen wanneer je afspreekt
    gloss: Hoe laat spreken we af?
    note: '*Nos vemos* (we zien elkaar / we spreken af) is een wederkerige constructie die je gebruikt om met iemand af te spreken.'
  es.a1.unit05.lesson04.teach.nos_vemos_tres_y_media:
    title: Een tijdstip voorstellen
    gloss: Zien we elkaar om half vier?
    note: Combineert *y media* met *nos vemos* om een precies tijdstip voor te stellen.
  es.a1.unit05.lesson04.teach.antes_del_taller:
    title: Vóór de workshop
    gloss: Dat is voor de workshop.
    note: '*Antes de* (vóór) is het tegenovergestelde van *después* (na).'
  es.a1.unit05.lesson04.teach.de_acuerdo:
    title: Afgesproken / Oké
    gloss: Afgesproken / Oké
    note: '*De acuerdo* is een natuurlijke, korte manier om een plan te bevestigen, vergelijkbaar met *Muy bien*.'
    example_gloss: Akkoord, we zien elkaar om half vier.
  es.a1.unit05.lesson05.teach.horario_dia_reading:
    title: Het schema van de dag lezen
    gloss: De workshop begint om vier uur 's middags. Eerder zien Elena en Mateo elkaar om half vier. De workshop eindigt om zes uur. De volgende dag zien ze elkaar om één uur om te lunchen.
    note: 'Een kort schema voor de dag: afspraak, workshop en de dag erna een lunch.'
    glosses:
      taller: workshop
      empieza: begint (van empezar)
      cuatro: vier
      tarde: middag
      Antes: eerder
      ven: zien elkaar (van verse)
      tres: drie
      media: half
      termina: eindigt (van terminar)
      seis: zes
      día: dag
      siguiente: volgende
      almorzar: lunchen
  es.a1.unit05.lesson05.teach.al_dia_siguiente:
    title: De volgende dag
    gloss: de volgende dag / de dag erna
    note: '*Al día siguiente* (letterlijk: op de volgende dag) is een gangbare manier om een verhaal naar een nieuwe dag te laten springen. Het verschilt van *la próxima clase* (de volgende les, een specifieke gebeurtenis en geen kalenderdag).'
  es.a1.unit05.lesson06.teach.line01:
    title: Vragen naar eten na de workshop
    gloss: Mateo zegt dat de workshop om zes uur eindigt en vraagt of Elena daarna honger heeft.
    note: '*Tienes hambre* (heb je honger) is een nieuwe uitdrukking. Letterlijk staat er "je hebt honger", met hetzelfde werkwoord tener als in *tener ... años* en *tener hermanos*.'
  es.a1.unit05.lesson06.teach.line02:
    title: Instemmen en de volgende dag voorstellen
    gloss: Elena zegt ja, een beetje, en stelt voor om de volgende dag te eten.
    note: '*¿Comemos mañana?* stelt morgen voor in plaats van direct na de workshop, en bereidt zo het volgende gesprek over een precies tijdstip voor.'
  es.a1.unit05.lesson06.teach.line03:
    title: Instemmen en naar het uur vragen
    gloss: Mateo vindt het een goed idee en vraagt hoe laat.
    note: '*Buena idea* (goed idee) is een natuurlijke, korte manier om met een voorstel in te stemmen.'
  es.a1.unit05.lesson06.teach.line04:
    title: Één uur voorstellen
    gloss: Elena stelt voor om elkaar om één uur te zien.
    note: '*A la una* (om één uur) gebruikt het enkelvoud *la una*, net als in *Es la una*.'
  es.a1.unit05.lesson06.teach.line05:
    title: Bevestigen en een restaurant noemen
    gloss: Mateo bevestigt dat één uur goed is en noemt een restaurant in de buurt.
    note: '*Hay un restaurante cerca de aquí*: *cerca de* (dicht bij), zoals in *cerca de tus padres*, hier gebruikt voor een plek.'
  es.a1.unit05.lesson06.teach.line06:
    title: Hartelijk afsluiten
    gloss: 'Elena reageert blij en zegt: tot morgen.'
    note: '*¡Genial!* (geweldig!) sluit het gesprek enthousiast af, vergelijkbaar met *¡Qué bien!*.'
