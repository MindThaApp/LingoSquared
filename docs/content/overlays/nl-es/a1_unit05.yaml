course:
  title: Spaans A1
  description: De tijd vertellen en ernaar vragen, delen van de dag en een afspraak plannen, als vervolg op het verhaal van Elena en Mateo's kookworkshop uit les 01-04. Extra aandacht voor het verschil tussen enkelvoud en meervoud bij es/son en voor de woorden cuarto, media en menos.
