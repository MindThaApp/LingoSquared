teaching:
  es.a1.unit11.lesson01.teach.la_camisa:
    title: Het overhemd
    gloss: het overhemd
    note: '*Camisa* is vrouwelijk.'
    example_gloss: Ik vind dit overhemd mooi.
  es.a1.unit11.lesson01.teach.el_pantalon:
    title: De broek
    gloss: de broek
    note: '*Pantalón* is in het Spaans enkelvoud, net als "broek" in het Nederlands.'
    example_gloss: De broek kost twintig.
  es.a1.unit11.lesson01.teach.la_chaqueta:
    title: Het jack
    gloss: het jasje
    note: '*Chaqueta* is vrouwelijk.'
    example_gloss: Ik heb een jas nodig voor de winter.
  es.a1.unit11.lesson01.teach.los_zapatos:
    title: De schoenen
    gloss: de schoenen
    note: '*Zapatos* is meervoud, net als "schoenen" in het Nederlands.'
    example_gloss: Deze schoenen zitten comfortabel.
  es.a1.unit11.lesson01.teach.el_delantal:
    title: De schort
    gloss: de schort
    note: '*Delantal* is mannelijk -- het specifieke kledingstuk dat Elena en Mateo nodig hebben voor de workshop.'
    example_gloss: We hebben een schort nodig voor de workshop.
  es.a1.unit11.lesson02.teach.que_talla_usas:
    title: Naar de maat vragen
    gloss: Welke maat heb je?
    note: '*¿Qué talla usas?* is de standaardmanier om iemand naar zijn of haar kledingmaat te vragen.'
  es.a1.unit11.lesson02.teach.uso_la_talla_mediana:
    title: Je maat zeggen
    gloss: Ik heb maat M.
    note: '*Uso* (ik gebruik/draag) + *la talla* (de maat) + het maatwoord zelf.'
  es.a1.unit11.lesson02.teach.me_queda_bien:
    title: Zeggen dat het goed zit
    gloss: Het zit me goed.
    note: '*Me queda bien* gebruikt *quedar* (passen/staan) -- zie de grammaticakaart hierna.'
  es.a1.unit11.lesson02.teach.me_queda_mal:
    title: Zeggen dat het slecht zit
    gloss: Het zit me slecht.
    note: 'Het tegenovergestelde van *me queda bien*: je vervangt *bien* door *mal*.'
  es.a1.unit11.lesson02.teach.queda_note:
    title: Quedar bien/mal
    gloss: Hoe quedar de pasvorm beschrijft, niet de kwaliteit.
    note: Zie de tekst op de kaart zelf.
    target_text: '*Me queda bien* (het zit me goed) gebruikt *quedar* (passen/staan), een ander werkwoord dan *ser* of *estar* -- letterlijk "het blijft goed op me zitten". *Bien* en *mal* beschrijven hier de pasvorm, niet de kwaliteit.'
  es.a1.unit11.lesson03.teach.cuanto_cuesta_este_delantal:
    title: Naar de prijs van de schort vragen
    gloss: Hoeveel kost deze schort?
    note: Gebruikt het patroon *¿Cuánto cuesta?* met een specifiek voorwerp, aangeduid met *este* (deze).
  es.a1.unit11.lesson03.teach.cuesta_doce:
    title: De prijs noemen
    gloss: Hij kost twaalf.
    note: '*Cuesta* + getal geeft de prijs aan.'
  es.a1.unit11.lesson03.teach.este_vs_esta_note:
    title: Este vs. esta
    gloss: Hoe de aanwijzende voornaamwoorden het geslacht van het zelfstandig naamwoord volgen.
    note: Zie de tekst op de kaart zelf.
    target_text: '*Este* (dit, mannelijk) hoort bij *el delantal*; *esta* (dit, vrouwelijk) hoort bij *esta camisa* -- het aanwijzend voornaamwoord verandert mee met het geslacht van het zelfstandig naamwoord, net als bij andere bijvoeglijke naamwoorden.'
  es.a1.unit11.lesson04.teach.me_gusta_este:
    title: Zeggen dat je deze mooi vindt
    gloss: Deze vind ik mooi.
    note: '*Este* staat hier los als voornaamwoord ("deze") en verwijst naar het voorwerp dat net genoemd is.'
  es.a1.unit11.lesson04.teach.voy_a_comprarlo:
    title: Zeggen dat je het gaat kopen
    gloss: Ik ga het kopen.
    note: '*Voy a* + infinitief is de nabije toekomst; bij *comprarlo* hangt het voornaamwoord *lo* (het) aan de infinitief *comprar*.'
  es.a1.unit11.lesson04.teach.compramos_dos:
    title: Zeggen dat je er twee koopt
    gloss: We kopen er twee.
    note: '*Compramos* (wij kopen) is de *nosotros*-vorm, gebruikt als Elena en Mateo samen beslissen.'
  es.a1.unit11.lesson05.teach.precios_reading:
    title: Een prijslijst lezen
    gloss: 'In deze winkel kost het overhemd vijftien, de broek twintig, het jack dertig en de schoenen vijfentwintig. De schort is het goedkoopst: hij kost maar twaalf.'
    note: 'Een prijslijst van een winkel: *cuesta* (kost) bij één artikel, *cuestan* (kosten) bij meervoud zoals *los zapatos*.'
    glosses:
      tienda: winkel
      camisa: overhemd
      cuesta: kost (van costar)
      quince: vijftien
      pantalón: broek
      veinte: twintig
      chaqueta: jack
      treinta: dertig
      zapatos: schoenen
      cuestan: kosten (van costar)
      veinticinco: vijfentwintig
      delantal: schort
      barato: goedkoop
      solo: alleen
      doce: twaalf
  es.a1.unit11.lesson05.teach.el_mas_barato_note:
    title: El más barato (het goedkoopst)
    gloss: Hoe el/la + más + bijvoeglijk naamwoord een overtreffende trap vormt.
    note: Zie de tekst op de kaart zelf.
    target_text: '*El más barato* (het goedkoopst) is een overtreffende trap -- *el/la* + *más* + bijvoeglijk naamwoord, met *de/en* voor de groep waarmee je vergelijkt. In deze unit leer je het volledige patroon van vergelijkingen nog niet, alleen deze veelgebruikte winkelzin.'
  es.a1.unit11.lesson06.teach.line01:
    title: De behoefte noemen
    gloss: Elena zegt dat ze schorten nodig hebben voor de workshop.
    note: '*Delantales* is het meervoud van *el delantal*.'
  es.a1.unit11.lesson06.teach.line02:
    title: Instemmen en een winkel voorstellen
    gloss: Mateo is het eens en stelt voor naar die winkel te gaan.
    note: '*Tienes razón* betekent "je hebt gelijk"; *esa tienda* betekent "die winkel".'
  es.a1.unit11.lesson06.teach.line03:
    title: De verkoper begroet hen
    gloss: De verkoper begroet hen en biedt hulp aan.
    note: '*¿Los ayudo?* (kan ik jullie helpen?) is een gebruikelijke begroeting van een verkoper, gericht aan Elena en Mateo samen.'
  es.a1.unit11.lesson06.teach.line04:
    title: Zeggen wat ze zoeken
    gloss: Elena zegt ja, ze zoeken schorten.
    note: '*Buscamos* (wij zoeken) is de *nosotros*-vorm van *buscar*.'
  es.a1.unit11.lesson06.teach.line05:
    title: De verkoper toont opties en vraagt naar de maat
    gloss: De verkoper laat een paar schorten zien en vraagt naar hun maat.
    note: '*¿Qué talla usan?* gebruikt het meervoud *usan* (jullie dragen), gericht aan hen beiden, anders dan enkelvoud *usas*.'
  es.a1.unit11.lesson06.teach.line06:
    title: Een maat noemen
    gloss: Mateo zegt dat hij maat M heeft.
    note: '*Uso la talla mediana* is zijn antwoord op *¿Qué talla usan?* voor zichzelf.'
  es.a1.unit11.lesson06.teach.line06b:
    title: Elena sluit zich aan
    gloss: Elena zegt dat zij dezelfde maat heeft.
    note: '*Yo también* betekent "ik ook".'
  es.a1.unit11.lesson06.teach.line07:
    title: Naar de prijs vragen
    gloss: Mateo vraagt hoeveel de schort kost.
    note: '*Este* (deze) wijst naar de schort die voor hem ligt.'
  es.a1.unit11.lesson06.teach.line07b:
    title: De prijs noemen
    gloss: De verkoper zegt dat hij twaalf kost.
    note: '*Cuesta* + getal geeft de prijs.'
  es.a1.unit11.lesson06.teach.line08:
    title: Bevestigen dat het past en besluiten te kopen
    gloss: Elena zegt dat het goed zit, dat ze hem mooi vindt en dat ze hem koopt.
    note: Combineert *me queda bien*, *me gusta este* en *voy a comprarlo* achter elkaar.
  es.a1.unit11.lesson06.teach.line09:
    title: Instemmen en er twee kopen
    gloss: Mateo zegt dat hij ook goed zit, en ze kopen er twee.
    note: '*A mí también* (ik ook, met nadruk) gebruikt het patroon met *también* plus een extra nadrukkelijk voornaamwoord; *compramos dos* sluit de scène af.'
