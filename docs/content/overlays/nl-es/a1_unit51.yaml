answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spaans A1
  description: 'Spaans voor beginners om een eenvoudige treinreis te regelen: een kaartje kopen, aankondigingen over vertrek en vertraging begrijpen en de weg vragen op een station.'
units:
  es.a1.unit51.travel:
    title: Met de trein reizen
lessons:
  es.a1.unit51.lesson01.comprar_un_billete:
    title: Een kaartje kopen
  es.a1.unit51.lesson02.a_que_hora_sale:
    title: Hoe laat vertrekt de trein?
  es.a1.unit51.lesson03.retraso:
    title: Vertraging
  es.a1.unit51.lesson04.orientarse_en_la_estacion:
    title: De weg vinden op het station
  es.a1.unit51.lesson05.leer_un_billete_de:
    title: Een treinkaartje lezen
  es.a1.unit51.lesson06.elena_y_mateo_de:
    title: Elena en Mateo gaan op reis
teaching:
  es.a1.unit51.lesson01.teach.el_billete:
    title: Het toegangskaartje
    gloss: het toegangskaartje
    note: '*El billete* is mannelijk, dus het is *un billete*, niet *una*.'
    example_gloss: Ik wil graag een kaartje naar Toledo.
  es.a1.unit51.lesson01.teach.quisiera_un_billete:
    title: Om een kaartje vragen
    gloss: Ik wil graag een kaartje naar Toledo.
    note: '*Quisiera* ("ik wil graag") maakt een verzoek zachter en is beleefder dan *quiero*.'
  es.a1.unit51.lesson01.teach.quiere_un_billete:
    title: De medewerker vraagt welk soort kaartje
    gloss: Wilt u een enkele reis of een retour?
    note: '*Quiere* is de formele *usted*-vorm van *querer*, hier gebruikt voor een onbekende medewerker van het station.'
  es.a1.unit51.lesson01.teach.ida_y_vuelta:
    title: Beleefd antwoorden
    gloss: Een retour, alstublieft.
    note: '*Por favor* is hoe je ''alstublieft'' zegt; het verzoek blijft zo beleefd en kort.'
  es.a1.unit51.lesson01.teach.en_la_taquilla:
    title: Taalregister aan het loket
    gloss: Aan het loket gebruik je meestal de beleefdheidsvorm usted.
    note: Onbekenden in een dienstverlenende functie spreek je aan met *usted*, niet met *tú*.
  es.a1.unit51.lesson02.teach.el_anden:
    title: Het perron
    gloss: het perron
    note: '*El andén* is mannelijk: *un andén*, *el andén*.'
    example_gloss: Vanaf welk perron vertrekt de trein naar Toledo?
  es.a1.unit51.lesson02.teach.de_que_anden:
    title: Vragen naar het perron
    gloss: Vanaf welk perron vertrekt de trein naar Toledo?
    note: '*¿De qué andén ...?* vraagt specifiek naar het perron, niet naar een algemene plek.'
  es.a1.unit51.lesson02.teach.el_tren_sale:
    title: Vertrekgegevens noemen
    gloss: De trein vertrekt om kwart voor tien van perron vijf.
    note: '*Las diez menos cuarto* gebruikt opnieuw het patroon "min een kwartier" uit de les over de tijd.'
  es.a1.unit51.lesson02.teach.a_que_hora:
    title: Naar de aankomsttijd vragen
    gloss: Hoe laat komt de trein aan?
    note: '*¿A qué hora llega ...?* vraagt naar een aankomsttijd; *llegar* is regelmatig en krijgt *a las* voor de tijd.'
  es.a1.unit51.lesson02.teach.el_tren_llega:
    title: De aankomsttijd noemen
    gloss: De trein komt om elf uur aan.
    note: '*Llega a las once* gebruikt *llegar* (aankomen) met *a las* voor de tijd.'
  es.a1.unit51.lesson03.teach.a_tiempo_el:
    title: Op tijd / de vertraging
    gloss: op tijd; de vertraging
    note: '*A tiempo* is een vaste uitdrukking voor iets dat volgens schema gebeurt. *El retraso* (de vertraging) is mannelijk.'
    example_gloss:
    - De trein vertrekt niet op tijd.
    - 'Let op: de trein naar Toledo heeft vertraging.'
  es.a1.unit51.lesson03.teach.atencion_el_tren:
    title: Een omroepbericht
    gloss: 'Let op: de trein naar Toledo heeft vertraging.'
    note: '*Atención* opent een omroepbericht op het station, zoals ons "Aandacht, reizigers".'
  es.a1.unit51.lesson03.teach.el_tren_no:
    title: '"Op tijd" ontkennen'
    gloss: De trein vertrekt niet op tijd.
    note: '*No* staat vlak voor het werkwoord en ontkent de hele zin: *no sale a tiempo*.'
  es.a1.unit51.lesson03.teach.el_tren_sale:
    title: Een perronwijziging
    gloss: De trein vertrekt van perron drie in plaats van perron vijf.
    note: '*En lugar de* betekent "in plaats van".'
  es.a1.unit51.lesson03.teach.el_tren_lleva:
    title: De duur van de vertraging noemen
    gloss: De trein heeft tien minuten vertraging.
    note: '*Lleva retraso* (letterlijk "draagt vertraging") is de natuurlijke manier om te zeggen dat iets vertraging heeft.'
  es.a1.unit51.lesson04.teach.la_entrada_la:
    title: Ingang, uitgang, wachtkamer
    gloss: de ingang; de uitgang; de wachtkamer
    note: '*La entrada*, *la salida* en *la sala de espera* zijn allemaal vrouwelijke zelfstandige naamwoorden.'
    example_gloss:
    - Waar is de ingang?
    - Waar is de uitgang?
    - Waar is de wachtkamer?
  es.a1.unit51.lesson04.teach.donde_esta_el:
    title: Vragen waar een perron is
    gloss: Waar is perron zeven?
    note: Hier komt het patroon *¿Dónde está ...?* uit de lessen over de weg wijzen terug.
  es.a1.unit51.lesson04.teach.todo_recto_y:
    title: De weg wijzen
    gloss: Rechtdoor en dan rechts.
    note: '*Todo recto* en *a la derecha* zijn de richtingaanduidingen uit de lessen over de weg wijzen, nu gebruikt op een station.'
  es.a1.unit51.lesson04.teach.donde_esta_la:
    title: Vragen naar de wachtkamer
    gloss: Waar is de wachtkamer?
    note: Hetzelfde vraagpatroon, nu voor een nieuwe plek.
  es.a1.unit51.lesson05.teach.billete_madrid_atocha:
    title: Een gedrukt kaartje lezen
    gloss: 'Kaartje: Madrid Atocha naar Toledo. Vertrek: tien over tien, perron zeven. Aankomst: tien voor elf. Retour. Prijs: twaalf euro veertig.'
    note: Let op de vertrektijd en het perron, de aankomsttijd, het soort kaartje en de prijs.
    glosses:
      Billete: kaartje
      Salida: vertrek
      diez: tien
      andén: perron
      siete: zeven
      Llegada: aankomst
      once: elf
      vuelta: retour
      Precio: prijs
      doce: twaalf
      euros: euro
      cuarenta: veertig
  es.a1.unit51.lesson06.teach.mateo_tenemos_que:
    title: Mateo noemt het plan
    gloss: 'Mateo: We moeten naar perron zeven. De trein vertrekt om tien over tien.'
    note: '*Tenemos que* + infinitief ("we moeten") drukt een praktische noodzaak uit.'
  es.a1.unit51.lesson06.teach.elena_mira_ahi:
    title: Elena leest het bord
    gloss: 'Elena: Kijk, daar is het bord: vertraging, tien minuten.'
    note: '*Ahí está* ("daar is het") wijst het bord aan; *el panel* is het informatiebord.'
  es.a1.unit51.lesson06.teach.mateo_no_hay:
    title: Mateo blijft kalm
    gloss: 'Mateo: Geen probleem, we hebben nog tijd voor een koffie.'
    note: '*No hay problema* is een gebruikelijke, informele geruststelling.'
  es.a1.unit51.lesson06.teach.elena_buena_idea:
    title: De trein komt aan
    gloss: 'Elena: Goed idee. Oh, daar is de trein al! Perron zeven, precies!'
    note: '*Ya* ("al") laat merken dat de trein eerder aankwam dan verwacht, gezien de vertraging die net is omgeroepen.'
  es.a1.unit51.lesson06.teach.mateo_vamos_que:
    title: Ze stappen in de trein
    gloss: 'Mateo: Kom op, iedereen stapt in! Toledo, here we go!'
    note: '*Suben* ("ze stappen in") komt van *subir*, instappen; *¡Allá vamos!* is de natuurlijke manier om "daar gaan we" te zeggen, terwijl een woordelijke vertaling van "hier komen we" vreemd zou klinken.'
