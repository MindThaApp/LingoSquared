answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Franceză A1
  description: Comparații de bază (plus/moins/aussi... que) și superlative (le/la plus...), în continuarea poveștii atelierului de gătit al Inèsei și al lui Mathieu, care compară două brânzeturi la cumpărături. În franceză, *meilleur* („mai bun”) și *le meilleur* („cel mai bun”) sunt neregulate și nu urmează tiparul *plus... que* folosit pentru majoritatea celorlalte adjective.
units:
  fr.a1.unit14.comparisons:
    title: Mai mult sau mai puțin?
lessons:
  fr.a1.unit14.lesson01.vocabulaire_comparaisons:
    title: Mai mult, mai puțin, la fel
  fr.a1.unit14.lesson02.superlatifs:
    title: Cel mai, cel mai puțin
  fr.a1.unit14.lesson03.dialogue_comparer_fromages:
    title: Comparăm două brânzeturi la piață
teaching:
  fr.a1.unit14.lesson01.teach.plus_que:
    title: Mai... decât
    gloss: mai... decât
    note: '*Plus + adjectiv + que* este comparativul obișnuit în franceză, ca în română „mai + adjectiv + decât”; adjectivul rămâne neschimbat, doar se acordă.'
    example_gloss: Brânza aceasta este mai scumpă decât cealaltă.
  fr.a1.unit14.lesson01.teach.moins_que:
    title: Mai puțin... decât
    gloss: mai puțin... decât
    note: '*Moins* este opusul direct al lui *plus* în același tipar de comparativ.'
    example_gloss: Rețeta aceasta este mai puțin grea decât cealaltă.
  fr.a1.unit14.lesson01.teach.aussi_que:
    title: La fel de... ca
    gloss: la fel de... ca
    note: '*Aussi + adjective + que* exprimă egalitatea dintre două lucruri.'
    example_gloss: Tarta este la fel de bună ca quiche-ul.
  fr.a1.unit14.lesson01.teach.meilleur_que:
    title: Mai bun decât
    gloss: mai bun decât
    note: '*Meilleur* este comparativul neregulat al lui *bon* („bun”). Spre deosebire de românescul „mai bun”, franceza NU spune *plus bon*.'
    example_gloss: Prăjitura aceasta este mai bună decât prima.
  fr.a1.unit14.lesson01.teach.cher_bon_marche:
    title: Scump, ieftin
    gloss: scump, ieftin / avantajos
    note: '*Bon marché* este invariabil (nu își schimbă forma), chiar dacă ai crede că se acordă ca alte adjective.'
    example_gloss:
    - Brânza este scumpă.
    - Legumele sunt ieftine.
  fr.a1.unit14.lesson01.teach.facile_difficile:
    title: Ușor, dificil
    gloss: ușor, dificil
    note: O pereche frecventă de adjective pentru a descrie rețetele; au aceeași formă la masculin și la feminin, iar la plural primesc -s (*faciles*, *difficiles*).
    example_gloss:
    - Rețeta aceasta este ușoară.
    - Quiche-ul este puțin dificil.
  fr.a1.unit14.lesson02.teach.le_plus_cher:
    title: Cel mai scump
    gloss: cel mai scump
    note: '*Le/la plus + adjectiv* formează superlativul; articolul hotărât este obligatoriu, spre deosebire de comparativ.'
    example_gloss: Este cea mai scumpă brânză de la piață.
  fr.a1.unit14.lesson02.teach.la_moins_chere:
    title: Cea mai puțin scumpă
    gloss: cea mai puțin scumpă
    note: '*La moins chère* se acordă cu substantivul feminin *recette*; forma de masculin este *le moins cher*.'
    example_gloss: Este cea mai ieftină rețetă.
  fr.a1.unit14.lesson02.teach.le_meilleur:
    title: Cel mai bun
    gloss: cel mai bun
    note: '*Le meilleur* este superlativul neregulat al lui *bon*, pereche cu comparativul neregulat *meilleur* din prima lecție.'
    example_gloss: Este cea mai bună prăjitură de la atelier!
  fr.a1.unit14.lesson02.teach.la_plus_facile:
    title: Cea mai ușoară
    gloss: cea mai ușoară
    note: Un superlativ regulat, care urmează direct tiparul *le/la plus + adjectiv*.
    example_gloss: Este cea mai ușor de făcut rețetă.
  fr.a1.unit14.lesson02.teach.grammar_superlative_note:
    title: Tiparul superlativului
    gloss: le/la plus + adjectiv; meilleur este neregulat
    note: Majoritatea superlativelor franceze sunt regulate (*le/la plus + adjectiv*), dar *bon* → *meilleur* → *le meilleur* este o excepție de reținut.
  fr.a1.unit14.lesson02.teach.comparer_les_prix:
    title: Propune să comparați prețurile
    gloss: Să comparăm prețurile înainte de a cumpăra.
    note: '*Comparons* este imperativul la persoana I plural (*nous*) al verbului *comparer*, adică „să comparăm”, o formulă firească la cumpărături.'
  fr.a1.unit14.lesson03.teach.line01:
    title: Observă două variante
    gloss: 'Inès spune: „Uite, sunt două feluri de brânză. Pe care o luăm?”'
    note: '*Lequel* („care dintre ele”) îi cere celeilalte persoane să aleagă între două variante deja menționate.'
  fr.a1.unit14.lesson03.teach.line02:
    title: Compară și apreciază calitatea
    gloss: Mathieu spune că aceasta este mai scumpă decât cealaltă, dar pare mai bună.
    note: '*Avoir l''air* + adjectiv („a părea”) atenuează o afirmație despre calitate, când încă nu ai gustat produsul.'
  fr.a1.unit14.lesson03.teach.line03:
    title: Exprimă dezacordul față de o comparație
    gloss: Inès întreabă dacă el chiar crede asta și spune că ea o găsește pe cealaltă la fel de bună și mai ieftină.
    note: Folosește *aussi* și *moins* din prima lecție într-un singur răspuns, pentru a contrazice politicos; *que* lipsește, fiindcă brânza comparată (a lui Mathieu) reiese din context.
  fr.a1.unit14.lesson03.teach.line04:
    title: Recunoaște diferența de preț
    gloss: 'Mathieu e de acord: e adevărat, este cea mai ieftină dintre cele două.'
    note: '*Des deux* („dintre cele două”) limitează superlativul la această pereche, nu la toată piața.'
  fr.a1.unit14.lesson03.teach.line05:
    title: Luați decizia finală
    gloss: 'Inès spune: „Atunci o luăm pe aceea, este cea mai bună opțiune pentru atelier.”'
    note: '*Celui-là* („aceea”) se referă la brânza mai ieftină, despre care tocmai s-a vorbit.'
  fr.a1.unit14.lesson03.teach.line06:
    title: Observă avantajul
    gloss: Mathieu e de acord și spune că le rămân mai mulți bani pentru desert!
    note: '*Il nous reste* (literal: „ne rămâne”) este un mod frecvent de a spune „ne mai rămâne”.'
