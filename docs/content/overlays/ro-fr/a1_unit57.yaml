    gloss: Camille îl sună pe Mathieu în fiecare zi. Folosește telefonul, nu o aplicație. Mathieu nu are computer acasă, dar folosește internetul pe telefon. Thomas caută prognoza meteo în fiecare dimineață. Apoi merge să alerge. Léa îi trimite des mesaje lui Camille. Și tu, folosești telefonul în fiecare zi?
