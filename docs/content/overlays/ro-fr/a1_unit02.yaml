  fr.a1.unit02.lesson01.numbers_zero_to_ten:
    title: Numerele de la zero la zece
  fr.a1.unit02.lesson02.numbers_eleven_to_hundred:
    title: 'Forme speciale: de la unsprezece la o sută'
  fr.a1.unit02.lesson03.asking_age:
    title: Cum întrebi vârsta cuiva
  fr.a1.unit02.lesson04.phone_numbers:
    title: Numerele de telefon
  fr.a1.unit02.lesson05.recipe_quantities:
    title: Cantitățile din rețete
  fr.a1.unit02.lesson06.recipe_count_dialogue:
    title: Numărăm ingrediente cu Inès și Mathieu
teaching:
  fr.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: zero
    note: '*Zéro* se folosește atât ca numărul însuși, cât și ca cifră când citești cu voce tare un șir de cifre.'
  fr.a1.unit02.lesson01.teach.un:
    title: Unu
    gloss: unu
    note: '*Un* este masculin; forma de feminin *une* apare înaintea unui substantiv feminin (*une tasse*, o ceașcă). Singur, ca atunci când numeri, rămâne *un*.'
  fr.a1.unit02.lesson01.teach.deux:
    title: Doi
    gloss: doi
    note: '*Deux* nu își schimbă forma, indiferent de genul substantivului.'
  fr.a1.unit02.lesson01.teach.trois:
    title: Trei
    gloss: trei
    note: '*Trois* este invariabil.'
  fr.a1.unit02.lesson01.teach.quatre:
    title: Patru
    gloss: patru
    note: '*Quatre* este invariabil.'
  fr.a1.unit02.lesson01.teach.cinq:
    title: Cinci
    gloss: cinci
    note: '*Cinq* este invariabil. Litera finală q se pronunță în mod normal, spre deosebire de consoanele finale mute ale altor numere franceze.'
  fr.a1.unit02.lesson01.teach.six:
    title: Six
    gloss: șase
    note: '*Six* se pronunță cu un /s/ final când este spus singur, dar această consoană finală dispare înaintea unui substantiv care începe cu consoană (*six livres* sună ca „si livres”).'
  fr.a1.unit02.lesson01.teach.sept:
    title: Șapte
    gloss: șapte
    note: '*Sept* este invariabil; p este mut, se pronunță doar t-ul final.'
  fr.a1.unit02.lesson01.teach.huit:
    title: Opt
    gloss: opt
    note: '*Huit* este invariabil. H este mut, spre deosebire de română, unde h se pronunță; în franceză este mut în aproape toate cuvintele.'
  fr.a1.unit02.lesson01.teach.neuf:
    title: Nouă
    gloss: nouă
    note: '*Neuf* este invariabil.'
  fr.a1.unit02.lesson01.teach.dix:
    title: Zece
    gloss: zece
    note: '*Dix* se pronunță cu un /s/ final când este spus singur, urmând același tipar ca *six*: consoana finală dispare înaintea unei consoane.'
  fr.a1.unit02.lesson02.teach.onze:
    title: Unsprezece
    gloss: unsprezece
    note: '*Onze* până la *seize* (11–16) sunt cuvinte de sine stătătoare, nu sunt construite de la *dix*, spre deosebire de numerele de la douăzeci și unu încolo, care reiau *vingt*.'
  fr.a1.unit02.lesson02.teach.douze:
    title: Doisprezece
    gloss: doisprezece
    note: '*Douze* este un singur cuvânt. Începutul seamănă cu *deux*, dar în el nu se vede niciun *dix*.'
  fr.a1.unit02.lesson02.teach.treize:
    title: Treisprezece
    gloss: treisprezece
    note: '*Treize* este un singur cuvânt. Începutul seamănă cu *trois*, dar în el nu se vede niciun *dix*.'
  fr.a1.unit02.lesson02.teach.quatorze:
    title: Paisprezece
    gloss: paisprezece
    note: '*Quatorze* este un singur cuvânt. Începutul seamănă cu *quatre*, dar în el nu se vede niciun *dix*.'
  fr.a1.unit02.lesson02.teach.quinze:
    title: Cincisprezece
    gloss: cincisprezece
    note: '*Quinze* este un singur cuvânt. Are o legătură îndepărtată cu *cinq*, dar în el nu se vede niciun *dix*.'
  fr.a1.unit02.lesson02.teach.seize:
    title: Șaisprezece
    gloss: șaisprezece
    note: '*Seize* este ultimul dintre cuvintele „sudate” ale numerelor de după zece; de la *dix-sept* (17) încolo, *dix* se combină din nou vizibil cu unitatea.'
  fr.a1.unit02.lesson02.teach.vingt:
    title: Douăzeci
    gloss: douăzeci
    note: '*Vingt* este un cuvânt de sine stătător. De la douăzeci și unu încolo, zecile și unitățile se combină (*vingt et un*, *vingt-deux*) după un tipar pe care cursul îl reia mai jos.'
  fr.a1.unit02.lesson02.teach.trente:
    title: Treizeci
    gloss: treizeci
    note: '*Trente* se leagă de unitatea următoare printr-o cratimă (*trente-quatre*), cu excepția lui unu, care primește *et* (*trente et un*).'
  fr.a1.unit02.lesson02.teach.trente_quatre:
    title: Treizeci și patru
    gloss: treizeci și patru
    note: '*Trente-quatre* se scrie cu cratimă, într-un singur cuvânt compus, în timp ce în română numărul se scrie în trei cuvinte: treizeci și patru.'
  fr.a1.unit02.lesson02.teach.soixante:
    title: Șaizeci
    gloss: șaizeci
    note: '*Soixante* se comportă ca o zece obișnuită (*soixante-quatre*, 64) până la șaizeci și nouă; partea neregulată începe la șaptezeci, pe care îl vei învăța în continuare.'
  fr.a1.unit02.lesson02.teach.soixante_dix:
    title: Șaptezeci
    gloss: șaptezeci
    note: 'Aceasta este cea mai mare surpriză din numerele franceze: nu există un cuvânt propriu pentru șaptezeci. *Soixante-dix* înseamnă literal „șaizeci-zece” (60 + 10). Numărarea continuă așa până la *soixante-dix-neuf* (79, „șaizeci-nouăsprezece”), apoi *quatre-vingts* începe o nouă bază, la optzeci.'
  fr.a1.unit02.lesson02.teach.quatre_vingts:
    title: Optzeci
    gloss: optzeci
    note: '*Quatre-vingts* înseamnă literal „patru douăzeci” (4 x 20), rest al unui vechi sistem de numărare în baza 20. Primește un s final doar când stă singur sau încheie numărul (*quatre-vingts*, 80); s-ul dispare când urmează o unitate (*quatre-vingt-un*, 81).'
  fr.a1.unit02.lesson02.teach.quatre_vingt_dix:
    title: Nouăzeci
    gloss: nouăzeci
    note: '*Quatre-vingt-dix* înseamnă literal „patru douăzeci plus zece” (4x20 + 10), continuând același tipar de numărare în baza 20 ca la șaptezeci, până la *quatre-vingt-dix-neuf* (99).'
  fr.a1.unit02.lesson02.teach.cent:
    title: O sută
    gloss: o sută
    note: '*Cent* este forma folosită pentru exact 100, de sine stătătoare, fără articol (nu „*un cent*”).'
  fr.a1.unit02.lesson03.teach.quel_age_as_tu:
    title: Întreabă vârsta, informal
    gloss: Câți ani ai?
    note: Ca și româna („Câți ani ai?”), franceza întreabă literal ce vârstă ai, cu *avoir* (a avea), nu cu o formă de la *être* („a fi”).
  fr.a1.unit02.lesson03.teach.jai_vingt_huit_ans:
    title: Spune-ți vârsta
    gloss: Am douăzeci și opt de ani.
    note: '*Ai* este forma persoanei I singular a lui *avoir*. *Ans* (ani) trebuie spus în franceză; cuvântul nu se omite în J''ai vingt-huit ans.'
  fr.a1.unit02.lesson03.teach.quel_age_avez_vous:
    title: Întreabă vârsta, formal
    gloss: Câți ani ai?
    note: '*Avez-vous* folosește forma de *vous* a lui *avoir*, în acord cu registrul formal stabilit în Unitatea 1.'
  fr.a1.unit02.lesson03.teach.jai_trente_et_un_ans:
    title: Spune o vârstă compusă
    gloss: Am treizeci și unu de ani.
    note: '*Trente et un* folosește *et* („și”), nu cratimă, specific formelor cu „unu” ale lui treizeci, patruzeci, cincizeci și șaizeci (*trente et un*, *quarante et un*, *cinquante et un*, *soixante et un*). Șaptezeci și unu rupe acest tipar: se spune *soixante et onze* (șaizeci + unsprezece), nu *soixante et un*, deoarece numerele din șaptezeci continuă cu formele lui *dix* până la *soixante-dix-neuf* (79).'
  fr.a1.unit02.lesson03.teach.et_toi_quel_age:
    title: Întoarce întrebarea despre vârstă
    gloss: Și tu, câți ani ai?
    note: '*Et toi* deschide întrebarea întoarsă; *toi* (nu *tu*) este pronumele accentuat folosit după *et* pentru accent.'
  fr.a1.unit02.lesson04.teach.quel_est_ton_numero:
    title: Cere un număr de telefon
    gloss: Care este numărul tău de telefon?
    note: '*Quel* se acordă cu substantivul masculin *numéro*; un substantiv feminin ar cere *quelle*.'
  fr.a1.unit02.lesson04.teach.numero_ines:
    title: Un număr citit cifră cu cifră
    gloss: Zero, șase, unu, cinci, zero, doi, nouă, șapte, patru, trei
    note: Numerele reale de telefon din Franța au zece cifre și se citesc de obicei în perechi (*zéro six*, *quinze*, *zéro deux*...). Numerele din această unitate au formatul real de zece cifre (06 15 02 97 43), dar sunt citite cifră cu cifră, ca să exersezi mai întâi cifrele simple.
  fr.a1.unit02.lesson04.teach.cest_le:
    title: Introdu numărul
    gloss: Este...
    note: '*Le* (articolul masculin) apare pentru că *numéro* este un substantiv masculin.'
  fr.a1.unit02.lesson04.teach.tu_peux_repeter:
    title: Cere repetarea
    gloss: Poți repeta, te rog?
    note: '*Peux* este forma de *tu* a lui *pouvoir* (a putea), utilă oricând un număr rostit trece prea repede ca să-l prinzi.'
  fr.a1.unit02.lesson04.teach.bien_sur:
    title: Confirmă pe loc
    gloss: Desigur; sigur
    note: '*Bien sûr* este o modalitate frecventă și prietenoasă de a accepta o rugăminte.'
  fr.a1.unit02.lesson05.teach.jai_besoin_trois_oeufs:
    title: Spune o cantitate necesară
    gloss: Am nevoie de trei ouă.
    note: '*J''ai besoin de* (literal „am nevoie de”) exprimă nevoia cu *avoir*, ca în română „am nevoie de”, nu printr-un verb propriu.'
  fr.a1.unit02.lesson05.teach.combien_oeufs:
    title: Întreabă câte sunt necesare
    gloss: De câte ouă ai nevoie?
    note: '*De combien d''œufs* pune *de combien* („de câte”) înaintea substantivului, ca în română „de câte ouă”.'
  fr.a1.unit02.lesson05.teach.deux_tasses_farine:
    title: Spune o cantitate măsurată
    gloss: Două căni de făină
    note: '*De* leagă unitatea de măsură (*tasses*, căni) de ceea ce se măsoară (*farine*, făină), ca „de” în română: „două căni de făină”.'
  fr.a1.unit02.lesson05.teach.demi_tasse:
    title: Spune o jumătate de cantitate
    gloss: O jumătate de cană de zahăr
    note: '*Demi-* rămâne invariabil ca prefix înaintea substantivului (*une demi-tasse*), spre deosebire de adjectivul *demi* așezat după substantiv, care se acordă (*une heure et demie*).'
  fr.a1.unit02.lesson05.teach.jai_quatre_oeufs:
    title: Spune ce ai la îndemână
    gloss: Am patru ouă pe masă.
    note: '*J''ai* („am”) arată ce ai deja la îndemână, spre deosebire de *j''ai besoin de* („am nevoie de”), care arată ce lipsește încă.'
  fr.a1.unit02.lesson06.teach.line01:
    title: Întreabă câte ouă
    gloss: Inès îl întreabă pe Mathieu de câte ouă are nevoie pentru rețetă.
    note: 'Inès și Mathieu folosesc acum *tu*, nu *vous* ca în Unitatea 1: fiind colegi la atelier, au trecut repede la registrul informal.'
  fr.a1.unit02.lesson06.teach.line02:
    title: Spune ingredientele
    gloss: Mathieu spune că are nevoie de trei ouă și două căni de făină.
    note: '*J''ai besoin de* arată ce mai este necesar pentru rețetă.'
  fr.a1.unit02.lesson06.teach.line03:
    title: Oferă ce ai la îndemână
    gloss: Inès spune că are patru ouă pe masă și îl întreabă dacă are nevoie și de zahăr.
    note: '*J''ai* arată ce are Inès deja la îndemână, separat de ce a spus Mathieu că îi trebuie.'
  fr.a1.unit02.lesson06.teach.line04:
    title: Confirmă o cantitate mică
    gloss: Mathieu spune că da, puțin -- aproximativ o jumătate de cană.
    note: '*Environ* înseamnă aici „aproximativ”, atenuând cantitatea exactă.'
  fr.a1.unit02.lesson06.teach.line05:
    title: Cere un număr de telefon
    gloss: Inès spune că e perfect, apoi îi cere numărul de telefon lui Mathieu ca să-i scrie despre cursul următor.
    note: '*Comme ça je t''écris* („așa îți scriu”) explică de ce întreabă, un obicei firesc de conversație înainte de a cere datele de contact.'
  fr.a1.unit02.lesson06.teach.line06:
    title: Spune numărul de telefon
    gloss: Mathieu își citește numărul cifră cu cifră.
    note: '*C''est le* introduce numărul, în acord cu substantivul masculin *numéro*.'
  fr.a1.unit02.lesson06.teach.line07:
    title: Mulțumește-i și întreabă-l câți ani are
    gloss: 'Inès îi mulțumește, apoi pune o ultimă întrebare: câți ani are.'
    note: '*Une dernière question* („o ultimă întrebare”) marchează o schimbare firească de subiect în cadrul aceleiași conversații.'
  fr.a1.unit02.lesson06.teach.line08:
    title: Spune-i vârsta
    gloss: Mathieu spune că are douăzeci și opt de ani și îi pune lui Inès aceeași întrebare.
    note: '*J''ai vingt-huit ans* folosește forma compusă cu cratimă, conform tiparului din lecția 02.'
  fr.a1.unit02.lesson06.teach.line09:
    title: Spune-i vârsta ei
    gloss: Inès spune că are treizeci și unu de ani.
    note: '*J''ai trente et un ans* folosește *et* („și”) în loc de cratimă, deoarece treizeci și unu este una dintre formele cu „unu” predate în lecția 03.'
