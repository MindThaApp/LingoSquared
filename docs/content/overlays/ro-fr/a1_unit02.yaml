answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Franceză A1
  description: Numerele 0–100 (inclusiv formele soixante-dix/quatre-vingts/quatre-vingt-dix), vârsta, numerele de telefon și cantitățile din rețete, în continuarea atelierului de gătit cu Inès și Mathieu din unitatea 1. Sunt evidențiate exprimarea vârstei cu avoir, rămășițele sistemului vigesimal din numerele franceze și acordul în expresiile de cantitate.
units:
  fr.a1.unit02.numbers:
    title: Numerele în bucătărie
