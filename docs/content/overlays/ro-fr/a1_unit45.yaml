teaching:
  fr.a1.unit45.lesson01.teach.tu_fais_quoi:
    title: Întrebarea despre meseria cuiva
    gloss: Cu ce vă ocupați?
    note: Un mod standard, informal, de a întreba pe cineva ce meserie are.
  fr.a1.unit45.lesson01.teach.le_metier_cuisinier:
    title: Meseria / bucătar
    gloss: meseria; bucătar
    note: '*Métier* (meserie) este masculin: *le métier*. *Cuisinier* se schimbă la feminin: *un cuisinier*, *une cuisinière*.'
    example_gloss:
    - Ce meserie ai?
    - Lucrez ca bucătar.
  fr.a1.unit45.lesson01.teach.je_travaille_comme:
    title: Spui că ești bucătar
    gloss: Lucrez ca bucătar.
    note: '*Travailler comme* + meserie este structura standard pentru a spune ce meserie ai, fără articol înaintea substantivului.'
  fr.a1.unit45.lesson01.teach.infirmiere:
    title: Asistent medical
    gloss: asistent medical
    note: Termenul modern pentru această profesie, folosit pentru oricine, indiferent de gen.
    example_gloss: Lucrez ca asistent medical.
  fr.a1.unit45.lesson01.teach.je_travaille_comme_2:
    title: Spui că ești asistent medical
    gloss: Lucrez ca asistent medical.
    note: Urmează același model *travailler comme* ca *cuisinier*; femininul este *infirmière*.
  fr.a1.unit45.lesson02.teach.ou_travailles_tu:
    title: Întrebarea despre locul de muncă
    gloss: Unde lucrezi?
    note: O întrebare directă, care urmează după *Tu fais quoi dans la vie ?*
  fr.a1.unit45.lesson02.teach.je_travaille_dans:
    title: Lucrezi într-un restaurant
    gloss: Lucrez într-un restaurant.
    note: '*Un restaurant* primește aici articolul nehotărât, fiindcă este unul dintre multele restaurante.'
  fr.a1.unit45.lesson02.teach.l_hopital:
    title: Spitalul
    gloss: spitalul
    note: '*Hôpital* este masculin și începe cu un sunet vocalic: *l''hôpital*.'
    example_gloss: Lucrez la spital.
  fr.a1.unit45.lesson02.teach.je_travaille_a:
    title: Lucrezi la spital
    gloss: Lucrez la spital.
    note: '*À l''hôpital* folosește articolul hotărât, fiindcă este un loc precis, cunoscut; *le* devine *l''* înaintea unui sunet vocalic.'
  fr.a1.unit45.lesson02.teach.certaines_personnes_travaillent:
    title: Lucrezi într-un birou
    gloss: Unii oameni lucrează într-un birou.
    note: '*Dans un bureau* (într-un birou) primește articol, ca *dans un restaurant*.'
  fr.a1.unit45.lesson03.teach.je_commence_a:
    title: Ora de începere
    gloss: Încep la nouă.
    note: '*Commence* este forma pentru *je* a verbului *commencer* (a începe); *à neuf heures* indică ora.'
  fr.a1.unit45.lesson03.teach.je_travaille_du:
    title: Zilele de lucru
    gloss: Lucrez de luni până vineri.
    note: '*Du lundi au vendredi* înseamnă de luni până vineri; *du* este *de* + *le*, iar *au* este *à* + *le*.'
  fr.a1.unit45.lesson03.teach.la_pause:
    title: Pauza
    gloss: pauza
    note: '*Pause* este de genul feminin: *la pause*.'
    example_gloss: Am o pauză la douăsprezece.
  fr.a1.unit45.lesson03.teach.j_ai_une:
    title: A avea pauză
    gloss: Am o pauză la douăsprezece.
    note: '*Avoir une pause* (a avea o pauză) este structura fixă, firească.'
  fr.a1.unit45.lesson03.teach.je_finis_a:
    title: Ora de terminare
    gloss: Termin la cinci.
    note: '*Finis* este forma pentru *je* a verbului *finir* (a termina).'
  fr.a1.unit45.lesson03.teach.je_commence_a_2:
    title: O zi de lucru completă
    gloss: Încep la nouă și termin la cinci.
    note: Îmbină *je commence* și *je finis* cu *et* într-o singură propoziție care descrie o zi de lucru întreagă.
  fr.a1.unit45.lesson04.teach.avec_il_ou:
    title: Terminațiile verbelor cu il și elle
    gloss: 'Cu el sau ea, verbele regulate în -er păstrează aceeași formă ca la persoana I: eu lucrez, el lucrează, ea lucrează.'
    note: '*Travaille* este la fel pentru *je*, *il* și *elle*: verbele regulate în *-er* nu adaugă nimic la persoana a treia.'
  fr.a1.unit45.lesson04.teach.camille_travaille_comme:
    title: Meseria lui Camille
    gloss: Camille lucrează ca asistentă medicală.
    note: '*Travaille* se potrivește cu *je*, *il* și *elle*: terminația nu se pronunță, deci cele trei forme sună la fel.'
  fr.a1.unit45.lesson04.teach.mathieu_travaille_comme:
    title: Meseria lui Mathieu
    gloss: Mathieu lucrează ca bucătar.
    note: Aceeași terminație ca în *Camille travaille comme infirmière*.
  fr.a1.unit45.lesson04.teach.elle_travaille_a:
    title: Folosirea pronumelor
    gloss: Ea lucrează la spital. El lucrează într-un restaurant.
    note: '*Elle* și *il* înlocuiesc numele Camille și Mathieu, dar verbul rămâne în aceeași formă.'
  fr.a1.unit45.lesson05.teach.camille_travaille_comme:
    title: Citește două profiluri profesionale
    gloss: Camille lucrează ca asistentă medicală la spital. Începe la șapte și lucrează de luni până vineri. Mathieu lucrează ca bucătar într-un restaurant. Începe la unsprezece și face pauză la patru.
    note: Urmărește separat meseria, locul de muncă și programul fiecărei persoane.
    glosses:
      travaille: lucrează
      infirmière: asistentă medicală
      l'hôpital: spital
      commence: începe
      sept: șapte
      lundi: luni
      vendredi: vineri
      cuisinier: bucătar / bucătar-șef
      restaurant: restaurant
      onze: unsprezece
      pause: pauză
  fr.a1.unit45.lesson06.teach.camille_salut_mathieu:
    title: Camille întreabă despre muncă
    gloss: 'Camille: Salut, Mathieu! Sunt curioasă, ce meserie ai, de fapt?'
    note: '*Au fait* (apropo) transformă întrebarea într-o curiozitate prietenoasă, nu într-un interogatoriu.'
  fr.a1.unit45.lesson06.teach.mathieu_je_travaille:
    title: Mathieu răspunde
    gloss: 'Mathieu: Lucrez ca bucătar într-un restaurant. Și tu?'
    note: '*Et toi ?* este modul obișnuit de a întoarce întrebarea către celălalt.'
  fr.a1.unit45.lesson06.teach.camille_je_travaille:
    title: Camille răspunde
    gloss: 'Camille: Lucrez ca asistentă medicală la spital.'
    note: Corespunde meseriei și locului de muncă stabilite deja în lecțiile anterioare.
  fr.a1.unit45.lesson06.teach.mathieu_tu_fais:
    title: Mathieu întreabă despre program
    gloss: 'Mathieu: Ce program ai?'
    note: '*Tu fais quels horaires ?* este o formă firească de a întreba despre programul de lucru al cuiva; *quels* se acordă cu pluralul *horaires*.'
  fr.a1.unit45.lesson06.teach.camille_je_commence:
    title: Camille spune ce program are
    gloss: 'Camille: Încep la șapte și lucrez de luni până vineri.'
    note: Corespunde programului stabilit deja în textul de citit din lecția anterioară.
  fr.a1.unit45.lesson06.teach.mathieu_c_est:
    title: Reacția lui Mathieu
    gloss: 'Mathieu: E devreme! Eu încep mai târziu, la unsprezece.'
    note: Corespunde orei de începere a lui Mathieu, stabilită deja în lecția anterioară.
  fr.a1.unit45.lesson06.teach.camille_chaque_metier:
    title: Camille încheie subiectul
    gloss: 'Camille: Fiecare meserie are ritmul ei, cred.'
    note: O remarcă finală firească, pe gânduri – recunoaște-o după sens, nu trebuie să o reproduci exact.
