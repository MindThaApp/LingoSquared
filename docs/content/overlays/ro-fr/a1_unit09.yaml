teaching:
  fr.a1.unit09.lesson01.teach.a_gauche:
    title: La stânga
    gloss: la stânga
    note: '*À gauche* se folosește atât pentru locul în care se află ceva („este la stânga”), cât și pentru direcție („virează la stânga”).'
    example_gloss: Virați la stânga după brutărie.
  fr.a1.unit09.lesson01.teach.a_droite:
    title: La dreapta
    gloss: la dreapta
    note: Opusul direct al lui *à gauche*, folosit la fel.
    example_gloss: Farmacia este în dreapta cafenelei.
  fr.a1.unit09.lesson01.teach.tout_droit:
    title: Înainte
    gloss: drept înainte
    note: '*Tout droit* înseamnă „drept înainte”. Nu îl confunda cu *à droite* („la dreapta”), care seamănă, dar înseamnă altceva.'
    example_gloss: Mergeți drept înainte până la piață.
  fr.a1.unit09.lesson01.teach.au_coin_de_la_rue:
    title: La colțul străzii
    gloss: la colțul străzii
    note: '*Au coin de* înseamnă „la colțul”; *au coin de la rue* („la colțul străzii”) este un reper foarte des folosit.'
    example_gloss: Magazinul este la colțul străzii.
  fr.a1.unit09.lesson01.teach.traverser:
    title: A traversa
    gloss: a traversa
    note: '*Traverser* este un verb regulat în -ER: *je traverse*, *tu traverses* etc.'
    example_gloss: Trebuie să traversezi strada ca să ajungi la magazin.
  fr.a1.unit09.lesson01.teach.la_boutique:
    title: Magazinul
    gloss: magazinul
    note: '*La boutique* înseamnă de obicei un magazin mic, specializat, spre deosebire de un magazin mare.'
    example_gloss: Magazinul este la colțul străzii, în dreapta.
  fr.a1.unit09.lesson01.teach.le_carrefour:
    title: Intersecția
    gloss: intersecția
    note: '*Le carrefour* este locul în care se întretaie două străzi, un reper frecvent în indicațiile orale.'
    example_gloss: Virați la stânga la intersecție.
  fr.a1.unit09.lesson02.teach.pour_aller_a:
    title: Întreabă cum ajungi undeva
    gloss: Scuzați-mă, cum ajung la magazin, vă rog?
    note: '*Pour aller à... ?* (literal „pentru a merge la...”) este modul politicos obișnuit de a întreba cum ajungi într-un loc.'
  fr.a1.unit09.lesson02.teach.tournez_a_gauche:
    title: Virează la stânga
    gloss: Virați la stânga după farmacie.
    note: '*Tournez* este imperativul de politețe (forma *vous*) de la *tourner* („a vira”), registrul obișnuit pentru a da indicații cuiva pe care nu îl cunoști bine.'
  fr.a1.unit09.lesson02.teach.continuez_tout_droit:
    title: Mergi înainte
    gloss: Mergeți drept înainte până la intersecție.
    note: '*Continuez* („mergeți mai departe”) + *tout droit* („drept înainte”) este modul obișnuit de a spune cuiva să meargă fără să vireze.'
  fr.a1.unit09.lesson02.teach.cest_au_coin:
    title: Spune unde se află
    gloss: Este la colțul străzii, în dreapta.
    note: Îîmbină *au coin de la rue* cu *à droite* pentru a indica exact locul.
  fr.a1.unit09.lesson02.teach.cest_loin:
    title: Spune că nu e departe
    gloss: Nu e departe, la cinci minute pe jos.
    note: '*À cinq minutes à pied* („la cinci minute pe jos”) este același tipar pentru durata mersului pe care l-ai întâlnit când Mathieu a întrebat despre farmacie.'
  fr.a1.unit09.lesson03.teach.line01:
    title: Întreabă despre un magazin
    gloss: Inès îl întreabă pe Mathieu dacă știe un magazin unde să cumpere ustensile de bucătărie.
    note: '*Tu connais... ?* („știi...?”) este modul informal obișnuit de a întreba dacă cineva cunoaște un loc.'
  fr.a1.unit09.lesson03.teach.line02:
    title: Dă primul pas
    gloss: 'Mathieu spune că da, e unul nu departe de aici: virezi la stânga la intersecție.'
    note: '*Il y en a une* („există unul”) folosește *en* ca să nu repete *boutique*, o scurtătură frecventă în franceza vorbită.'
  fr.a1.unit09.lesson03.teach.line03:
    title: Confirmă și cere mai multe
    gloss: 'Inès confirmă: la stânga la intersecție, și întreabă ce urmează.'
    note: '*Et ensuite ?* („și apoi?”) este un mod simplu și firesc de a cere următorul pas al indicațiilor.'
  fr.a1.unit09.lesson03.teach.line04:
    title: Spune al doilea pas
    gloss: Mathieu spune că apoi mergi drept înainte și traversezi strada.
    note: Două verbe de mișcare legate prin *et* („și”), un mod firesc de a descrie un traseu scurt.
  fr.a1.unit09.lesson03.teach.line05:
    title: Întreabă unde anume
    gloss: Inès întreabă unde anume este magazinul.
    note: '*Exactement* („exact”) cere un răspuns mai precis decât o direcție generală.'
  fr.a1.unit09.lesson03.teach.line06:
    title: Spune locul exact
    gloss: Mathieu spune că este la colțul străzii, chiar vizavi de brutărie.
    note: '*En face de* („vizavi de”) indică locul printr-un reper, un mod firesc de a încheia indicațiile.'
