answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Franceză A1
  description: Cum ceri și cum dai indicații simple de orientare pe stradă (à gauche/à droite, tout droit, au coin de la rue, traverser), continuând povestea atelierului de gătit al Inèsei și al lui Mathieu, în timp ce Inès caută un magazin de ustensile de bucătărie. În franceză, indicațiile se pot da cu imperativul de politețe ("Tournez à gauche") sau cu prezentul ("Tu tournes à gauche"); în română se folosește la fel imperativul ("Virați la stânga") sau prezentul ("Virezi la stânga").
units:
  fr.a1.unit09.directions:
    title: Cum ajung acolo?
lessons:
  fr.a1.unit09.lesson01.vocabulaire_directions:
    title: Cuvinte pentru a te orienta
  fr.a1.unit09.lesson02.donner_des_indications:
