teaching:
  fr.a1.unit47.lesson01.teach.le_temps:
    title: Vremea
    gloss: vremea
    note: '*Le temps* înseamnă atât „vreme”, cât și „timp”; este de genul masculin.'
    example_gloss: Ce vreme este afară?
  fr.a1.unit47.lesson01.teach.quel_temps_fait:
    title: Întrebarea despre vreme
    gloss: Ce vreme este afară?
    note: '*Quel temps fait-il ?* este întrebarea obișnuită despre vreme; *quel* se acordă cu substantivul masculin *temps*.'
  fr.a1.unit47.lesson01.teach.le_temps_est:
    title: Însorit
    gloss: Este senin și soare.
    note: '*Le temps est* + adjectiv este un tipar uzual; adjectivul se acordă cu substantivul masculin *temps*.'
  fr.a1.unit47.lesson01.teach.il_pleut:
    title: Plouă
    gloss: Plouă.
    note: '*Pleuvoir* (a ploua) se folosește impersonal: *il pleut*, fără alt adjectiv.'
  fr.a1.unit47.lesson01.teach.le_temps_est_2:
    title: Înnorat
    gloss: Este înnorat.
    note: Urmează același tipar *le temps est* + adjectiv ca *ensoleillé*.
  fr.a1.unit47.lesson02.teach.il_fait_froid:
    title: Frig
    gloss: Azi este frig.
    note: '*Aujourd''hui* (azi) plasează vremea în timp; *il fait froid* folosește *faire*, nu *être*.'
  fr.a1.unit47.lesson02.teach.il_fait_chaud:
    title: Cald
    gloss: Azi este cald.
    note: '*Il fait chaud* acoperă atât „cald”, cât și „foarte cald” în vorbirea obișnuită despre vreme.'
  fr.a1.unit47.lesson02.teach.il_ne_fait:
    title: Temperaturi în contrast
    gloss: Nu este frig, este cald.
    note: '*Ne ... pas* încadrează verbul: *il ne fait pas froid*.'
  fr.a1.unit47.lesson03.teach.la_meteo:
    title: Prognoza meteo
    gloss: prognoza meteo
    note: '*La météo* este de genul feminin și este forma scurtă de la *la météorologie*.'
    example_gloss: Care este prognoza meteo?
  fr.a1.unit47.lesson03.teach.demain_le_temps:
    title: Vremea de mâine
    gloss: Mâine este senin și soare.
    note: '*Demain* deschide propoziția și este urmat de virgulă; restul își păstrează ordinea normală.'
  fr.a1.unit47.lesson03.teach.samedi_le_temps:
    title: O prognoză pe două zile
    gloss: Sâmbătă este senin și cald, dar duminică plouă toată ziua.
    note: '*Toute la journée* (toată ziua) subliniază cât timp durează ploaia.'
  fr.a1.unit47.lesson04.teach.la_promenade:
    title: Plimbarea
    gloss: plimbarea
    note: '*Promenade* este de genul feminin: *la promenade*.'
    example_gloss: Mergem la plimbare?
  fr.a1.unit47.lesson04.teach.on_fait_une:
    title: Propunerea unei plimbări
    gloss: Mergem la plimbare?
    note: '*On fait une promenade ?* este o variantă prietenoasă de a propune un plan; *faire une promenade* este expresia fixă pentru „a merge la plimbare”.'
  fr.a1.unit47.lesson04.teach.s_il_pleut:
    title: Un plan condiționat
    gloss: Dacă plouă, rămânem în casă.
    note: '*S''il pleut* (dacă plouă): *si* + *il* devine *s''il*; apoi *on reste à l''intérieur* spune ce faceți.'
  fr.a1.unit47.lesson04.teach.bonne_idee_faisons:
    title: Acceptarea și propunerea
    gloss: Bună idee! Hai să mergem la plimbare.
    note: '*Faisons ...* (hai să ...) este o altă formă frecventă de a propune o activitate, pe lângă *On ... ?*'
  fr.a1.unit47.lesson05.teach.meteo_samedi_le:
    title: Citește o prognoză pe două zile
    gloss: 'Prognoza meteo: sâmbătă este senin și cald. Duminică plouă toată ziua.'
    note: Urmărește ce vreme este în fiecare zi.
    glosses:
      Météo: prognoza meteo
      samedi: sâmbătă
      ensoleillé: însorit
      chaud: cald
      Dimanche: duminică
      pleut: plouă
      toute: întreagă
      journée: zi
  fr.a1.unit47.lesson06.teach.camille_quel_temps:
    title: Camille întreabă despre weekend
    gloss: 'Camille: Ce vreme va fi în acest weekend?'
    note: '*Ce week-end* (în acest weekend) plasează întrebarea în viitorul apropiat.'
  fr.a1.unit47.lesson06.teach.mathieu_samedi_le:
    title: Mathieu spune prognoza
    gloss: 'Mathieu: Sâmbătă este senin și cald, dar duminică plouă toată ziua.'
    note: Coincide exact cu prognoza citită în lecția 5.
  fr.a1.unit47.lesson06.teach.camille_alors_on:
    title: Camille propune un plan
    gloss: 'Camille: Atunci mergem la plimbare sâmbătă?'
    note: '*Alors* (atunci) leagă propunerea direct de vremea bună descrisă de Mathieu.'
  fr.a1.unit47.lesson06.teach.mathieu_bonne_idee:
    title: Mathieu acceptă și planifică duminica
    gloss: 'Mathieu: Bună idee. Iar duminică rămânem liniștiți în casă.'
    note: '*Tranquillement* înseamnă aici „liniștit, fără grabă” și face ca statul în casă să sune plăcut.'
  fr.a1.unit47.lesson06.teach.camille_parfait_alors:
    title: Camille stabilește planul
    gloss: 'Camille: Perfect, atunci ne uităm la un film.'
    note: '*Regarder* (a se uita) se asociază firesc cu *un film* (un film).'
