teaching:
  fr.a1.unit51.lesson01.teach.combien_ca_coute:
    title: Cum afli prețul total
    gloss: Cât costă în total?
    note: '*En tout* (în total) arată clar că vrei prețul complet, nu prețul unui singur articol.'
  fr.a1.unit51.lesson01.teach.ca_coute_vingt:
    title: Cum spui prețul total
    gloss: Costă douăzeci și cinci de euro în total.
    note: '*Ça coûte* folosește *ça* (acesta, aceasta) cu *coûte*, forma lui *coûter* (a costa) folosită pentru un singur lucru.'
  fr.a1.unit51.lesson02.teach.payer_par_carte:
    title: Plata cu cardul sau în numerar
    gloss: a plăti cu cardul, a plăti în numerar
    note: '*Payer par carte* este modul obișnuit de a spune că plătești cu cardul, iar *payer en espèces* înseamnă a plăti în numerar. Folosește *par* cu *carte* și *en* cu *espèces*.'
    example_gloss:
    - Pot plăti cu cardul aici?
    - Plătesc în numerar.
  fr.a1.unit51.lesson02.teach.je_peux_payer:
    title: Cum întrebi dacă se poate plăti cu cardul
    gloss: Pot plăti cu cardul aici?
    note: '*Ici* (aici) plasează întrebarea la casa unde te afli.'
  fr.a1.unit51.lesson02.teach.vous_voulez_payer:
    title: Cum întrebi cum preferă cineva să plătească
    gloss: Doriți să plătiți în numerar sau cu cardul?
    note: '*Vous voulez ... ?* este modul de politețe de a întreba, folosit de un casier pe care nu îl cunoști; prietenii ar spune *tu veux ... ?*.'
  fr.a1.unit51.lesson03.teach.l_addition:
    title: Nota de plată
    gloss: nota de plată
    note: '*Addition* este feminin: *l''addition*. *La* se reduce la *l''* înaintea unei vocale.'
    example_gloss: Împărțim nota de plată?
  fr.a1.unit51.lesson03.teach.on_partage_l:
    title: Cum propui să împărțiți nota de plată
    gloss: Împărțim nota de plată?
    note: '*On ... ?* propune să faceți ceva împreună, ca în *On partage ?*. *Partager* (a împărți) se potrivește cu *l''addition*.'
  fr.a1.unit51.lesson03.teach.je_peux_payer:
    title: Cum ceri să plătești separat
    gloss: Pot plăti separat?
    note: '*Séparément* (separat) stă imediat după *payer*; este modul politicos de a cere să-ți plătești doar partea ta din notă.'
  fr.a1.unit51.lesson04.teach.la_monnaie:
    title: Restul
    gloss: restul
    note: '*Monnaie* este feminin: *la monnaie*. Înseamnă restul de monede și bancnote pe care îl primești înapoi.'
    example_gloss: Poftiți restul.
  fr.a1.unit51.lesson04.teach.voici_votre_monnaie:
    title: Cum dai restul
    gloss: Poftiți restul.
    note: '*Votre* este forma de politețe pentru „dumneavoastră”, potrivită cu registrul *vous* de la casă.'
  fr.a1.unit51.lesson04.teach.je_n_ai:
    title: Cum refuzi restul
    gloss: Nu am nevoie de rest.
    note: '*Avoir besoin de* (a avea nevoie de) este urmat de un substantiv: *Je n''ai pas besoin de monnaie.* După *ne ... pas*, *de* înlocuiește *de la*.'
  fr.a1.unit51.lesson05.teach.trente_cinq:
    title: Treizeci și cinci
    gloss: treizeci și cinci
    note: '*Trente-cinq* se scrie cu cratimă și pune zecile primele: treizeci + cinci.'
    example_gloss: Costă treizeci și cinci de euro.
  fr.a1.unit51.lesson05.teach.addition_deux_plats:
    title: Citește o notă de plată de la restaurant
    gloss: 'Nota: două feluri principale și două cafele. Total: treizeci și cinci de euro. Plătit cu cardul.'
    note: Urmărește ce s-a comandat, totalul și cum s-a plătit.
    glosses:
      Addition: nota de plată
      deux: două
      plats: feluri principale
      cafés: cafele
      Total: totalul
      trente-cinq: treizeci și cinci
      euros: euro
      Payé: plătit
      carte: card
  fr.a1.unit51.lesson06.teach.camille_on_demande:
    title: Camille cere nota de plată
    gloss: 'Camille: Cerem nota de plată?'
    note: '*Demander* (a cere) se construiește cu *l''addition* ca complement direct, fără niciun cuvânt în plus.'
  fr.a1.unit51.lesson06.teach.mathieu_oui_bonne:
    title: Mathieu întreabă totalul
    gloss: 'Mathieu: Da, bună idee. Cât costă în total?'
    note: Reia întrebarea *Combien ça coûte en tout ?* din lecția 1.
  fr.a1.unit51.lesson06.teach.camille_ca_fait:
    title: Camille spune totalul
    gloss: 'Camille: Face treizeci și cinci de euro. Împărțim?'
    note: '*Ça fait* + o sumă indică totalul, iar *partager* se referă la nota de plată.'
  fr.a1.unit51.lesson06.teach.mathieu_non_laisse:
    title: Mathieu insistă să plătească
    gloss: 'Mathieu: Nu, lasă-mă să plătesc eu azi. M-ai ajutat atât de mult.'
    note: '*Laisse-moi* + infinitiv exprimă oferta de a face ceva, iar *aidé* este participiul trecut al verbului *aider* (a ajuta).'
  fr.a1.unit51.lesson06.teach.camille_c_est:
    title: Camille este mișcată
    gloss: 'Camille: Ce drăguț din partea ta! Mulțumesc.'
    note: '*C''est gentil de ta part* (ce amabil din partea ta) este un compliment cald și frecvent pentru un gest generos.'
  fr.a1.unit51.lesson06.teach.mathieu_je_peux:
    title: Mathieu întreabă despre plata cu cardul
    gloss: 'Mathieu: Pot plăti cu cardul aici?'
    note: Reia *Je peux payer par carte ici ?* din lecția 2, acum în restaurantul propriu-zis.
  fr.a1.unit51.lesson06.teach.mathieu_paie_l:
    title: 'Paie: forma pentru el/ea'
    gloss: Mathieu plătește nota.
    note: '*Paie* este forma de *il/elle* a verbului *payer* (a plăti): *je paie, tu paies, il paie*.'
