answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Franceză A1
  description: Descrierea unei rutine zilnice simple cu verbe reflexive (se réveiller, se lever, se coucher) și cuvinte de succesiune (d'abord, ensuite), continuând povestea atelierului de gătit al Inèsei și al lui Mathieu, când Inès îl întreabă despre sâmbăta lui Mathieu. Ghidajul evidențiază faptul că verbele reflexive franceze cer un pronume reflexiv (je ME réveille), ca în română („mă trezesc”).
units:
  fr.a1.unit10.routines:
    title: Rutina de sâmbătă
lessons:
  fr.a1.unit10.lesson01.vocabulaire_routine:
    title: Activități de dimineață
  fr.a1.unit10.lesson02.la_journee_complete:
    title: Ziua întreagă
  fr.a1.unit10.lesson03.dialogue_routine_samedi:
    title: Rutina de sâmbătă a lui Mathieu
teaching:
  fr.a1.unit10.lesson01.teach.se_reveiller:
    title: A se trezi
    gloss: a se trezi
    note: 'Verb reflexiv: *je me réveille*, *tu te réveilles*. Pronumele *me/te/se* se acordă mereu cu subiectul.'
    example_gloss: Mă trezesc la ora șapte.
  fr.a1.unit10.lesson01.teach.se_lever:
    title: A se ridica din pat
    gloss: a se scula
    note: Diferit de *se réveiller* (a se trezi) – *se lever* înseamnă a te da jos din pat, adică acțiunea fizică.
    example_gloss: Mă ridic imediat după aceea.
  fr.a1.unit10.lesson01.teach.prendre_une_douche:
    title: A face duș
    gloss: a face duș
    note: '*Prendre une douche* (literal „a lua un duș”) folosește *prendre*, același verb ca pentru mese și mijloace de transport.'
    example_gloss: Fac duș dimineața.
  fr.a1.unit10.lesson01.teach.shabiller:
    title: A se îmbrăca
    gloss: a se îmbrăca
    note: 'Încă un verb reflexiv: *je m''habille*, cu *m''* elidat în fața vocalei.'
    example_gloss: Mă îmbrac înainte de micul dejun.
  fr.a1.unit10.lesson01.teach.le_petit_dejeuner:
    title: Micul dejun
    gloss: micul dejun
    note: '*Prendre le petit-déjeuner* (a lua micul dejun) folosește același tipar cu *prendre* ca *prendre une douche*.'
    example_gloss: Iau micul dejun la ora opt.
  fr.a1.unit10.lesson01.teach.quitter_la_maison:
    title: A pleca de acasă
    gloss: a pleca de acasă
    note: '*Quitter* înseamnă aici „a părăsi (un loc)” – a nu se confunda cu *partir*, care nu primește complement direct.'
    example_gloss: Plec de acasă la ora nouă.
  fr.a1.unit10.lesson01.teach.dabord_ensuite:
    title: Mai întâi... apoi...
    gloss: Mai întâi mă ridic din pat, apoi mă îmbrac.
    note: '*D''abord* (mai întâi) și *ensuite* (apoi) sunt cuvintele de bază pentru a descrie o rutină pas cu pas.'
  fr.a1.unit10.lesson02.teach.rentrer:
    title: A se întoarce acasă
    gloss: a se întoarce acasă
    note: '*Rentrer* presupune întoarcerea la propria casă, spre deosebire de *retourner* (a merge din nou undeva), mai general.'
    example_gloss: Mă întorc acasă după muncă.
  fr.a1.unit10.lesson02.teach.diner:
    title: A lua cina
    gloss: a lua cina
    note: '*Dîner* poate fi verb (a lua cina) sau substantiv (*le dîner*, cina) – contextul le deosebește.'
    example_gloss: Luăm cina împreună sâmbăta seara.
  fr.a1.unit10.lesson02.teach.se_coucher:
    title: A se culca
    gloss: a se culca
    note: Sfârșitul firesc al succesiunii rutinei zilnice, în pereche cu *se lever* de la început.
    example_gloss: Mă culc pe la ora unsprezece seara.
  fr.a1.unit10.lesson02.teach.le_weekend:
    title: Weekendul
    gloss: weekendul
    note: '*Le week-end* este un împrumut frecvent în franceză, scris cu cratimă; și româna folosește cuvântul „weekend”.'
    example_gloss: Atelierul are loc în weekend.
  fr.a1.unit10.lesson02.teach.dhabitude:
    title: De obicei
    gloss: de obicei
    note: '*D''habitude* introduce o rutină obișnuită, spre deosebire de *aujourd''hui* (astăzi) pentru un eveniment de o singură dată.'
    example_gloss: De obicei mă ridic din pat la ora șapte.
  fr.a1.unit10.lesson02.teach.ma_routine_du_samedi:
    title: Descrie o sâmbătă
    gloss: Sâmbăta mă scol târziu, apoi merg la piață înainte de atelier.
    note: Îmbină succesiunea de tip *d'abord/ensuite* (aici cu *puis*, „apoi”) pentru a descrie o sâmbătă.
  fr.a1.unit10.lesson02.teach.quest_ce_que_tu_fais:
    title: Ce faci?
    gloss: Ce faci sâmbăta?
    note: '*Qu''est-ce que tu fais... ?* este modalitatea standard, informală, de a întreba ce face cineva.'
  fr.a1.unit10.lesson03.teach.line01:
    title: Întreabă despre sâmbătă
    gloss: Inès îl întreabă pe Mathieu ce face sâmbăta înainte de atelier.
    note: '*Tu fais quoi... ?* este modul firesc, informal, de a întreba „ce faci...?”, mai relaxat decât *Qu''est-ce que tu fais ?*'
  fr.a1.unit10.lesson03.teach.line02:
    title: Descrie trezirea
    gloss: Mathieu spune că mai întâi se trezește târziu, pe la nouă.
    note: '*Vers neuf heures* (pe la ora nouă) reia tiparul *vers* + oră pentru o oră aproximativă.'
  fr.a1.unit10.lesson03.teach.line03:
    title: Întreabă ce urmează
    gloss: Inès întreabă ce urmează.
    note: O întrebare scurtă și firească pentru a continua descrierea unei rutine.
  fr.a1.unit10.lesson03.teach.line04:
    title: Descrie micul dejun și piața
    gloss: Mathieu spune că apoi ia micul dejun și merge la piață.
    note: Două acțiuni legate prin *et*, continuând succesiunea începută cu *d'abord*.
  fr.a1.unit10.lesson03.teach.line05:
    title: Întreabă despre întoarcerea acasă
    gloss: Inès întreabă la ce oră se întoarce Mathieu acasă.
    note: '*Tu rentres à quelle heure ?* reia verbul *rentrer* din această unitate într-o întrebare directă.'
  fr.a1.unit10.lesson03.teach.line06:
    title: Descrie după-amiaza
    gloss: Mathieu spune că se întoarce pe la prânz, iar după-amiaza se odihnește înainte de atelierul de seară.
    note: '*Se reposer* (a se odihni) este alt verb reflexiv: *je me repose*.'
