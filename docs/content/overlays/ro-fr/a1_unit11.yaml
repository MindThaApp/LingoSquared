answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Franceză A1
  description: Propunerea, acceptarea, refuzul și stabilirea unui plan simplu, în continuarea poveștii atelierului de gătit al Inèsei și al lui Mathieu, care se înțeleg să facă împreună cumpărăturile pentru ingrediente înainte de sesiunea de sâmbătă. Verbul reflexiv/reciproc *se retrouver* (a se întâlni) se construiește cu pronumele se, iar *vers* + oră exprimă o oră aproximativă, nu exactă.
units:
  fr.a1.unit11.plans:
    title: Când ne vedem?
lessons:
  fr.a1.unit11.lesson01.vocabulaire_projets:
    title: Propunerea unei ore
  fr.a1.unit11.lesson02.accepter_refuser:
    title: Accept sau refuz
  fr.a1.unit11.lesson03.dialogue_projet_courses:
    title: Planificăm cumpărăturile
teaching:
  fr.a1.unit11.lesson01.teach.libre:
    title: Liber / disponibil
    gloss: liber / disponibil
    note: Aici *libre* descrie disponibilitatea unei persoane; pentru ceva ce nu costă nimic, franceza folosește *gratuit*.
    example_gloss: Ești liber sâmbătă?
  fr.a1.unit11.lesson01.teach.occupe:
    title: Ocupat
    gloss: ocupat
    note: 'Opusul direct al lui *libre*. Se acordă în gen: *occupé* / *occupée*.'
    example_gloss: Vineri seara sunt ocupat.
  fr.a1.unit11.lesson01.teach.se_retrouver:
    title: A se întâlni
    gloss: a se întâlni
    note: În acest sens *se retrouver* este reciproc -- două sau mai multe persoane se întâlnesc -- spre deosebire de *trouver* (a găsi).
    example_gloss: Unde ne întâlnim în seara asta?
  fr.a1.unit11.lesson01.teach.vers:
    title: În jur de (o oră)
    gloss: în jur de / spre (o oră)
    note: '*Vers* + oră exprimă o oră aproximativă, mai relaxat decât o oră exactă.'
    example_gloss: Trec pe la tine în jur de ora șapte.
  fr.a1.unit11.lesson01.teach.ca_te_dit_de:
    title: Ce zici de...?
    gloss: Ce zici să facem cumpărăturile împreună?
    note: '*Ça te dit de... ?* + infinitiv este o formulă obișnuită și informală de a propune o activitate -- mai relaxată decât *Voulez-vous... ?*'
  fr.a1.unit11.lesson01.teach.venir_chercher:
    title: A veni să iei pe cineva
    gloss: Vii să mă iei pe la ora 18:00?
    note: '*Venir chercher quelqu''un* înseamnă a veni să iei pe cineva, nu doar „a căuta”.'
  fr.a1.unit11.lesson01.teach.daccord_a_tout_a_lheure:
    title: De acord, pe curând
    gloss: OK, ne vedem mai târziu!
    note: '*D''accord* (de acord/OK) confirmă un plan; *à tout à l''heure* se folosește când te revezi cu cineva mai târziu în aceeași zi.'
  fr.a1.unit11.lesson02.teach.je_ne_peux_pas:
    title: Refuzul unui plan
    gloss: Nu pot, sunt ocupat.
    note: '*Je ne peux pas* (nu pot) + un motiv este un mod simplu și politicos de a refuza.'
  fr.a1.unit11.lesson02.teach.avec_plaisir:
    title: Acceptarea cu bucurie
    gloss: Cu plăcere!
    note: '*Avec plaisir* (literal „cu plăcere”) este un mod călduros și entuziast de a accepta o invitație.'
  fr.a1.unit11.lesson02.teach.a_quelle_heure_on_se_voit:
    title: Întreabă ora
    gloss: La ce oră ne vedem?
    note: '*On se voit* (informal, „ne vedem”) este o alternativă obișnuită și relaxată la *se retrouver* când stabilești o întâlnire.'
  fr.a1.unit11.lesson02.teach.devant_le_marche:
    title: Propunerea unui loc
    gloss: În fața pieței, ți se potrivește?
    note: '*Ça te va ?* (ți se potrivește?) verifică dacă un detaliu propus este acceptabil pentru celălalt.'
  fr.a1.unit11.lesson02.teach.parfait_alors:
    title: Confirmarea planului
    gloss: Perfect, atunci ne vedem vineri!
    note: '*Alors* înseamnă aici „atunci”, în sensul de a confirma o concluzie și a încheia discuția despre plan.'
  fr.a1.unit11.lesson03.teach.line01:
    title: Propunerea de a face cumpărături împreună
    gloss: Inès îl întreabă pe Mathieu dacă vrea să facă împreună cumpărăturile înainte de atelier.
    note: '*Ça te dit de... ?* deschide discuția cu o sugestie informală.'
  fr.a1.unit11.lesson03.teach.line02:
    title: Acceptă și întreabă unde
    gloss: Mathieu spune că vine cu plăcere și întreabă unde se întâlnesc.
    note: Îmbină *Avec plaisir* (cu plăcere) cu *se retrouver* (a se întâlni).
  fr.a1.unit11.lesson03.teach.line03:
    title: Propunerea unui loc și a unei zile
    gloss: Inès propune în fața pieței, vineri seara.
    note: O propunere scurtă care îmbină locul (*devant le marché*) și ziua (*vendredi soir*).
  fr.a1.unit11.lesson03.teach.line04:
    title: Acceptă și întreabă ora
    gloss: Mathieu este de acord și întreabă la ce oră.
    note: '*D''accord* confirmă locul și ziua; întrebarea următoare precizează ora exactă.'
  fr.a1.unit11.lesson03.teach.line05:
    title: Propunerea unei ore precise
    gloss: Inès îl întreabă pe Mathieu dacă vine să o ia pe la ora 18:00.
    note: Folosește *venir chercher* + *vers* cu o oră precisă.
  fr.a1.unit11.lesson03.teach.line06:
    title: Confirmarea tuturor detaliilor
    gloss: Mathieu spune perfect, atunci ne vedem vineri, la 18:00, în fața pieței.
    note: Reia împreună cele trei detalii ale planului (ziua, ora, locul) pentru a încheia clar discuția.
