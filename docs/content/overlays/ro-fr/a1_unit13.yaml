answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Franceză A1
  description: Exprimarea și întrebarea despre preferințe, lucruri plăcute și neplăcute, în continuarea poveștii atelierului de gătit al Inèsei și al lui Mathieu, care aleg între două rețete pentru sâmbătă. Un accent special cade pe faptul că *préférer X à Y* (a prefera X în loc de Y) folosește *à*, nu *que*.
units:
  fr.a1.unit13.preferences:
    title: Ce preferi?
lessons:
  fr.a1.unit13.lesson01.vocabulaire_preferences:
    title: A-ți plăcea, a prefera, a detesta
  fr.a1.unit13.lesson02.demander_les_preferences:
    title: Întrebări despre preferințe
  fr.a1.unit13.lesson03.dialogue_choisir_la_recette:
    title: Alegem rețeta de sâmbătă
teaching:
  fr.a1.unit13.lesson01.teach.preferer:
    title: A prefera
    gloss: a prefera
    note: '*Préférer* este un verb în -er cu schimbare de accent: *je préfère*, dar *nous préférons* (la formele *nous/vous* accentul nu se schimbă).'
    example_gloss: Prefer tarta cu ciocolată.
  fr.a1.unit13.lesson01.teach.aimer_mieux:
    title: A-i plăcea mai mult
    gloss: a-i plăcea mai mult
    note: '*Aimer mieux* este o alternativă frecventă la *préférer*, dar compară cu *que* (*aimer mieux X que Y*), în timp ce *préférer* folosește *à* (*préférer X à Y*).'
    example_gloss: Îmi plac mai mult mâncărurile sărate decât cele dulci.
  fr.a1.unit13.lesson01.teach.detester:
    title: A detesta
    gloss: a detesta
    note: '*Détester* exprimă o aversiune puternică, mai tare decât *ne pas aimer* (a nu-ți plăcea).'
    example_gloss: Mathieu detestă condimentele prea iuți; preferă mâncărurile blânde.
  fr.a1.unit13.lesson01.teach.plutot:
    title: Mai degrabă
    gloss: mai degrabă
    note: '*Plutôt* atenuează o preferință: „mai degrabă” aceasta, fără a exclude cu totul cealaltă variantă.'
    example_gloss: Iau mai degrabă brânză.
  fr.a1.unit13.lesson01.teach.sucre:
    title: Dulce
    gloss: dulce
    note: '*Sucré* descrie mâncarea și nu trebuie confundat cu *doux* (blând, moale, delicat), o confuzie frecventă.'
    example_gloss: Acest desert este foarte dulce.
  fr.a1.unit13.lesson01.teach.sale:
    title: Sărat
    gloss: sărat
    note: '*Salé* este opusul obișnuit al lui *sucré* în vocabularul culinar francez și acoperă atât sensul de „sărat”, cât și pe cel de mâncare nedulce.'
    example_gloss: Brânza este sărată.
  fr.a1.unit13.lesson01.teach.la_recette:
    title: Rețeta
    gloss: rețeta
    note: '*La recette* este întotdeauna feminin.'
    example_gloss: Această rețetă este ușoară.
  fr.a1.unit13.lesson02.teach.quest_ce_que_tu_preferes:
    title: Întreabă despre o preferință
    gloss: Ce preferi?
    note: '*Qu''est-ce que...* este modul obișnuit de a pune o întrebare deschisă cu „ce” în franceza vorbită.'
  fr.a1.unit13.lesson02.teach.je_prefere_x_a_y:
    title: Spune ce preferi între două lucruri
    gloss: Prefer tarta în loc de quiche.
    note: '*Préférer X à Y* folosește *à* pentru a introduce opțiunea mai puțin preferată, nu *que*; que este o greșeală frecventă.'
  fr.a1.unit13.lesson02.teach.tu_aimes_plutot:
    title: Întreabă despre o înclinație generală
    gloss: Îți place mai degrabă dulcele sau săratul?
    note: Combină *plutôt* (lecția 1) cu o întrebare de alegere cu *ou* (sau).
  fr.a1.unit13.lesson02.teach.moi_aussi_moi_non:
    title: Exprimă acordul sau dezacordul
    gloss: Și mie. / Mie nu.
    note: '*Moi aussi* exprimă acordul cu o afirmație pozitivă; *moi non* exprimă dezacordul sau preferința opusă.'
  fr.a1.unit13.lesson02.teach.ca_ne_me_derange_pas:
    title: Spune că nu te deranjează
    gloss: Nu mă deranjează.
    note: '*Ça ne me dérange pas* este o formulă utilă și neutră prin care accepți oricare variantă când ți se cere să alegi.'
  fr.a1.unit13.lesson02.teach.on_pourrait_faire:
    title: Propune o variantă
    gloss: Am putea face o quiche, nu?
    note: '*On pourrait* (am putea) + infinitiv propune blând o variantă, cerând acordul prin *non ?*'
  fr.a1.unit13.lesson03.teach.line01:
    title: Întreabă ce pregătiți
    gloss: 'Mathieu întreabă ce pregătesc sâmbătă: o tartă sau o quiche?'
    note: '*Qu''est-ce qu''on prépare... ?* (ce pregătim) folosește *on* pentru „noi”, ca în vorbirea obișnuită.'
  fr.a1.unit13.lesson03.teach.line02:
    title: Spune ce preferi și întreabă la rândul tău
    gloss: Inès spune că preferă tarta, mai degrabă dulce, și îl întreabă pe Mathieu.
    note: '*Et toi ?* (și tu?) este cea mai simplă cale de a transforma o afirmație într-o întrebare adresată celuilalt.'
  fr.a1.unit13.lesson03.teach.line03:
    title: Spune preferința opusă
    gloss: Mathieu spune că îi place mai mult sărătul și că preferă quiche în loc de tartă.
    note: Reia direct structura *préférer X à Y* din lecția 2.
  fr.a1.unit13.lesson03.teach.line04:
    title: Propune un compromis
    gloss: Inès propune să le facă pe amândouă, nu?
    note: '*Les deux* (amândouă) rezolvă dezacordul propunând să faceți ambele rețete.'
  fr.a1.unit13.lesson03.teach.line05:
    title: Acceptă compromisul
    gloss: Mathieu spune că e o idee bună și că nu-l deranjează deloc.
    note: '*Ça ne me dérange pas du tout* întărește fraza din lecția 2 cu *du tout* (deloc).'
  fr.a1.unit13.lesson03.teach.line06:
    title: Confirmă decizia
    gloss: 'Inès spune: perfect, o tartă dulce și o quiche sărată pentru sâmbătă.'
    note: Reia clar decizia finală și încheie discuția.
