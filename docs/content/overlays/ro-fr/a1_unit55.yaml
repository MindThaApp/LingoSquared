    gloss: '*Courir* (a alerga) este neregulat: *je cours, tu cours, il court*. *s*-ul și *t*-ul final nu se pronunță.'
    note: '*Courir* nu urmează modelul regulat în *-er*, așa că formele lui merită învățate pe de rost: *je cours*, *tu cours*, *il court*.'
  fr.a1.unit55.lesson04.teach.mathieu_super_j:
    title: Mathieu reacționează
    gloss: 'Mathieu: Grozav, eu joc des fotbal acolo.'
  fr.a1.unit55.lesson05.teach.camille_fait_du:
    title: Camille și Léa despre sport
    gloss: Camille face yoga de două ori pe săptămână. Îi place să se miște încet. Léa nu face yoga, dar adoră să înoate. Léa înoată des, aproape în fiecare săptămână. Ce sport faci tu?
    note: Pune în contrast două sporturi diferite și două expresii de frecvență diferite, la fel ca lectura de comparare a animalelor din unitatea anterioară.
    glosses:
      fait: face
      deux: două
      fois: ori
      semaine: săptămână
      yoga: yoga
      adore: iubește
      doucement: liniștit
