    gloss: Ce sport practici?
  fr.a1.unit55.lesson01.teach.je_joue_au:
    title: Joc fotbal
    gloss: Joc fotbal.
    note: '*Jouer au* + un sport cu mingea este modul obișnuit de a spune că joci fotbal. Pentru alte sporturi folosește *faire du* sau *faire de la*; vezi nota de gramatică.'
  fr.a1.unit55.lesson01.teach.faire_du_de:
    title: Faire du / de la + sport
    gloss: '*Faire du*, *de la* sau *de l''* + sport spune ce sport practici: *faire du yoga*, *faire de la natation*, *faire de la course à pied*. Pentru fotbal se spune *jouer au football*.'
    note: O singură construcție acoperă toate sporturile – la acest nivel nu trebuie să înveți un verb separat pentru fiecare sport.
  fr.a1.unit55.lesson02.teach.fois_par_semaine:
    title: Ori pe săptămână
    gloss: ori pe săptămână
    example_gloss: Fac yoga de două ori pe săptămână.
  fr.a1.unit55.lesson02.teach.tu_connais_deja:
    title: Fois par semaine față de tous les jours/souvent
    gloss: Știi deja *tous les jours* (în fiecare zi) și *souvent* (des). *Deux fois par semaine* (de două ori pe săptămână) este o modalitate nouă, mai precisă, de a spune cât de des faci ceva.
    note: Completează vocabularul de frecvență învățat deja în unitatea despre hobby-uri.
  fr.a1.unit55.lesson02.teach.je_fais_du:
    title: Fac yoga de două ori pe săptămână
    gloss: Fac yoga de două ori pe săptămână.
  fr.a1.unit55.lesson02.teach.mathieu_joue_souvent:
    title: Mathieu joacă des fotbal
    gloss: Mathieu joacă des fotbal.
    note: Reia *souvent* (des), deja introdus pentru rutine într-o unitate anterioară.
  fr.a1.unit55.lesson03.teach.tu_connais_deja:
    title: Faire du sport față de faire de la + sport
    gloss: 'Știi deja *faire du sport* din lecția despre hobby-uri (*Je fais du sport le samedi*). *Faire de la* + sport numește sportul precis: *Je fais de la natation*. Ambele variante sunt corecte în franceză.'
    note: '*Faire du sport* este reluat din unitatea despre hobby-uri, nu este nou. Aici este pus în contrast cu numirea unui sport precis: un mod general și unul precis de a vorbi despre mișcare.'
