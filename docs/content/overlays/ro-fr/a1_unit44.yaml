teaching:
  fr.a1.unit44.lesson01.teach.je_ne_me:
    title: Nu te simți bine
    gloss: Nu mă simt bine.
    note: '*Se sentir* este reflexiv (*je me sens*); *ne ... pas bien* este modul general și blând de a spune că ceva nu e în regulă.'
  fr.a1.unit44.lesson01.teach.malade:
    title: Bolnav
    gloss: bolnav
    note: 'Adjectivul de bază, folosit cu *être*: *je suis malade*.'
    example_gloss: Sunt bolnav.
  fr.a1.unit44.lesson01.teach.je_suis_malade:
    title: A fi bolnav
    gloss: Sunt bolnav.
    note: '*Malade* descrie o stare mai generală și mai serioasă decât *pas bien*.'
  fr.a1.unit44.lesson01.teach.mal_a_la:
    title: Durere de cap
    gloss: durere de cap
    note: '*Mal à la tête* se folosește cu *avoir*: *j''ai mal à la tête*; *à la* pentru că *tête* este feminin.'
    example_gloss: Mă doare capul.
  fr.a1.unit44.lesson01.teach.j_ai_mal:
    title: A avea dureri de cap
    gloss: Mă doare capul.
    note: 'Simptomele se construiesc cu *avoir* (a avea): *j''ai mal*.'
  fr.a1.unit44.lesson01.teach.mal_au_ventre:
    title: Durere de stomac
    gloss: durere de stomac
    note: '*Mal au ventre*: *au* este *à* + *le* contractate, pentru că *ventre* este masculin.'
    example_gloss: Am dureri de stomac.
  fr.a1.unit44.lesson01.teach.j_ai_mal_2:
    title: A avea dureri de stomac
    gloss: Am dureri de stomac.
    note: Același tipar cu *avoir* ca la *mal à la tête*, dar cu *au* în loc de *à la*.
  fr.a1.unit44.lesson02.teach.qu_est_ce:
    title: Întrebare generală
    gloss: Ce s-a întâmplat?
    note: Un mod general, potrivit pentru orice situație, de a întreba dacă ceva nu este în regulă.
  fr.a1.unit44.lesson02.teach.qu_est_ce_2:
    title: O expresie frecventă
    gloss: Ce ai?
    note: '*Qu''est-ce qui ne va pas ?* este o întrebare fixă, literal „ce nu merge bine”; nu o traduce cuvânt cu cuvânt.'
  fr.a1.unit44.lesson02.teach.mal_a_la:
    title: Durere în gât
    gloss: durere în gât
    note: '*Mal à la gorge* urmează modelul *mal à la tête*: *gorge* este feminin, deci *à la*.'
    example_gloss: Mă doare gâtul.
  fr.a1.unit44.lesson02.teach.j_ai_mal:
    title: A avea dureri în gât
    gloss: Mă doare gâtul.
    note: Urmează același tipar cu *avoir* ca celelalte simptome.
  fr.a1.unit44.lesson02.teach.ca_va_non:
    title: Ne interesăm de cineva
    gloss: Ești bine? Nu, nu mă simt bine.
    note: '*Ça va ?* este o întrebare foarte frecventă și informală între prieteni.'
  fr.a1.unit44.lesson03.teach.la_fievre:
    title: Febră
    gloss: febră
    note: '*La fièvre* este feminin; după *avoir* primește *de la*: *j''ai de la fièvre*.'
    example_gloss: Am febră.
  fr.a1.unit44.lesson03.teach.j_ai_de:
    title: A avea febră
    gloss: Am febră.
    note: Urmează tiparul cu *avoir*, cu partitivul *de la*.
  fr.a1.unit44.lesson03.teach.le_rhume:
    title: A fi răcit
    gloss: răcit / a fi răcit
    note: '*Le rhume* este un substantiv masculin folosit cu *avoir*, nu un adjectiv folosit cu *être*.'
    example_gloss: Sunt răcit.
  fr.a1.unit44.lesson03.teach.j_ai_un:
    title: Spunem că suntem răciți
    gloss: Sunt răcit.
    note: În franceză se spune *j'ai un rhume* („am o răceală”); nu se spune *je suis rhume*.
  fr.a1.unit44.lesson03.teach.malade_se_dit:
    title: Être sau avoir?
    gloss: '*Malade* este adjectiv și se folosește cu *être*: sunt bolnav. *Mal*, *fièvre* și *rhume* sunt substantive și se folosesc cu *avoir*: am o răceală.'
    note: 'Alegerea între *être* și *avoir* depinde de clasa cuvântului: un adjectiv ca *malade* merge cu *être*, un substantiv ca *fièvre* merge cu *avoir*, oricât de ușoară ar fi boala.'
  fr.a1.unit44.lesson04.teach.la_pharmacie:
    title: Farmacia
    gloss: farmacia
    note: '*Pharmacie* este feminin: *la pharmacie*.'
    example_gloss: Merg la farmacie.
  fr.a1.unit44.lesson04.teach.je_peux_vous:
    title: Salutul farmacistului
    gloss: Cu ce vă pot ajuta?
    note: '*Je peux vous aider ?* este o formulă standard de întâmpinare în servicii; *vous* este forma de politețe.'
  fr.a1.unit44.lesson04.teach.avez_vous_quelque:
    title: Cerem ceva pentru un simptom
    gloss: Aveți ceva pentru durerea de cap?
    note: '*Quelque chose contre* + simptom este modul firesc de a cere un remediu.'
  fr.a1.unit44.lesson04.teach.un_comprime:
    title: O tabletă
    gloss: o tabletă / o pastilă
    note: '*Comprimé* este masculin: *un comprimé*.'
    example_gloss: Iau o pastilă.
  fr.a1.unit44.lesson04.teach.prenez_un_comprime:
    title: Indicații de dozare
    gloss: Ia o pastilă de două ori pe zi.
    note: '*Prenez* este imperativul cu *vous* al verbului *prendre* (a lua), folosit pentru instrucțiuni.'
  fr.a1.unit44.lesson04.teach.a_la_pharmacie:
    title: Registrul la farmacie
    gloss: La farmacie se folosește forma de politețe *vous*.
    note: Farmacistul este un adult necunoscut, într-un rol de serviciu, așa că spui *vous*, ca la ghișeul de bilete.
  fr.a1.unit44.lesson05.teach.conseil_prends_un:
    title: Citește un sfat de la farmacie
    gloss: 'Sfat: ia o pastilă de două ori pe zi, cu apă. Odihnește-te bine și bea multă apă. Tot nu te simți bine după trei zile? Atunci mergi la medic.'
    note: Urmărește doza, cele două recomandări care nu sunt medicamente și momentul în care trebuie să mergi la medic.
    glosses:
      Conseil: sfat
      prends: a lua
      fois: ori
      jour: zi
      comprimé: pastilă
      Repose-toi: a se odihni
      bois: a bea
      sens: a se simți
      toujours: încă
      bien: bine
      médecin: medic
  fr.a1.unit44.lesson06.teach.camille_salut_mathieu:
    title: Camille îl întreabă cum se simte
    gloss: 'Camille: Salut, Mathieu, ce faci? Te simți deja mai bine?'
    note: '*Déjà* (deja) arată că Camille verifică dacă lui Mathieu i-a trecut de la ultima discuție.'
  fr.a1.unit44.lesson06.teach.mathieu_pas_encore:
    title: Mathieu încă nu se simte bine
    gloss: 'Mathieu: Încă nu prea bine. Mă doare în continuare capul și sunt obosit.'
    note: '*Toujours* (încă) arată că durerea de cap nu a trecut; *fatigué* (obosit) este un adjectiv nou și util.'
  fr.a1.unit44.lesson06.teach.camille_tu_as:
    title: Camille întreabă despre medicament
    gloss: 'Camille: Ai luat un comprimat?'
    note: '*Pris* este participiul verbului *prendre*, folosit cu *as* de la *avoir*: *tu as pris*.'
  fr.a1.unit44.lesson06.teach.mathieu_oui_j:
    title: Mathieu confirmă
    gloss: 'Mathieu: Da, am luat un comprimat. Acum o să mă odihnesc.'
    note: '*Je vais me reposer* (o să mă odihnesc) folosește *aller* + infinitiv pentru viitorul apropiat.'
  fr.a1.unit44.lesson06.teach.camille_bonne_idee:
    title: Camille îi urează însănătoșire
    gloss: 'Camille: Bună idee. Odihnește-te bine. Însănătoșire grabnică!'
    note: '*Bon rétablissement !* este formula fixă obișnuită pentru a ura cuiva o însănătoșire rapidă.'
  fr.a1.unit44.lesson06.teach.mathieu_merci_a:
    title: Mathieu își ia rămas-bun
    gloss: 'Mathieu: Mulțumesc, pe mâine!'
    note: '*À demain !* folosește *à* + moment pentru formule de rămas-bun: *à demain*, *à bientôt*.'
