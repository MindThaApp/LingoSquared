teaching:
  fr.a1.unit48.lesson01.teach.le_manteau_le:
    title: Palton, pulover
    gloss: paltonul, puloverul
    note: '*Le manteau* și *le pull* sunt amândouă de genul masculin.'
    example_gloss:
    - Caut un palton.
    - Am un pulover.
  fr.a1.unit48.lesson01.teach.le_pantalon_les:
    title: Pantaloni, pantofi
    gloss: pantalonii, pantofii
    note: '*Pantalon* este la singular în franceză, chiar dacă în română „pantaloni” este la plural: *un pantalon* pentru o pereche. *Chaussures* este pluralul lui *chaussure*; pantofii se menționează de obicei la plural, ca și în română.'
    example_gloss:
    - Caut pantaloni.
    - Caut pantofi.
  fr.a1.unit48.lesson01.teach.je_cherche_un:
    title: Spui ce cauți
    gloss: Caut un palton.
    note: '*Chercher* (a căuta) se construiește direct, fără prepoziție, la fel ca „a căuta” în română: *je cherche un manteau*.'
  fr.a1.unit48.lesson02.teach.la_taille:
    title: Mărimea
    gloss: mărimea
    note: '*Taille* este de genul feminin: *la taille*.'
    example_gloss: Ce mărime porți?
  fr.a1.unit48.lesson02.teach.quelle_taille_faites:
    title: Întrebi despre mărime
    gloss: Ce mărime porți?
    note: '*Quelle taille ?* folosește *quelle* (ce, care) pentru că *taille* este feminin și există un set mic de răspunsuri posibile (S, M, L sau un număr).'
  fr.a1.unit48.lesson02.teach.je_fais_du:
    title: Spui ce mărime porți
    gloss: Port mărimea M.
    note: '*Faire du M* înseamnă a purta mărimea M: franceza folosește *faire* (a face), în timp ce româna spune „port mărimea M”.'
  fr.a1.unit48.lesson03.teach.noir_bleu:
    title: Negru, albastru
    gloss: negru, albastru
    note: Cele două adjective de culoare de bază din această lecție.
    example_gloss:
    - Vreau paltonul în negru.
    - Aveți și acesta în albastru?
  fr.a1.unit48.lesson03.teach.je_veux_le:
    title: Ceri o culoare
    gloss: Vreau paltonul în negru.
    note: '*En* + culoare este modul obișnuit de a preciza culoarea unei haine când o ceri sau o comanzi.'
  fr.a1.unit48.lesson03.teach.avez_vous_aussi:
    title: Întrebi despre altă culoare
    gloss: Aveți și acesta în albastru?
    note: '*Aussi* (și, de asemenea) întreabă dacă există și o altă culoare, folosind registrul formal *vous*.'
  fr.a1.unit48.lesson04.teach.est_ce_que:
    title: Întrebi dacă se potrivește
    gloss: Îți vine bine acest palton?
    note: '*Aller* (a merge) este verbul firesc pentru felul în care îți vine o haină: *il me va bien*, literal „îmi merge bine”.'
  fr.a1.unit48.lesson04.teach.il_me_va:
    title: Confirmi că îți vine bine
    gloss: Îmi vine bine.
    note: '*Bien* (bine) descrie cum se potrivește haina.'
  fr.a1.unit48.lesson04.teach.c_est_trop:
    title: Prea mic
    gloss: Este prea mic.
    note: '*Trop* (prea) stă înaintea adjectivului pentru a exprima excesul.'
  fr.a1.unit48.lesson04.teach.c_est_trop_2:
    title: Prea mare
    gloss: Este prea mare.
    note: Același tipar *trop* + adjectiv ca în *trop petit* de pe cardul anterior.
  fr.a1.unit48.lesson05.teach.quatre_vingt_dix:
    title: Nouăzeci
    gloss: nouăzeci
    note: '*Quatre-vingt-dix* este numărul 90 (literal „patru ori douăzeci și zece”), folosit aici în prețul paltonului.'
    example_gloss: Paltonul costă nouăzeci de euro.
  fr.a1.unit48.lesson05.teach.le_manteau_coute:
    title: Spui un preț
    gloss: Paltonul costă nouăzeci de euro.
    note: '*Coûte* este forma de persoana a treia singular (*il*) a verbului *coûter* (a costa).'
  fr.a1.unit48.lesson05.teach.parka_taille_m:
    title: Citește un bon de casă
    gloss: 'Geacă de iarnă: mărimea M, culoare neagră. Preț: nouăzeci de euro. Acest palton îmi vine bine și este cald.'
    note: Urmărește mărimea, culoarea, prețul și cele două calități menționate despre palton.
    glosses:
      Parka: geacă de iarnă
      taille: mărime
      couleur: culoare
      noire: negru
      Prix: preț
      quatre-vingt-dix: nouăzeci
      euros: euro
      manteau: palton
      va: se potrivește
      chaud: cald
  fr.a1.unit48.lesson06.teach.camille_ce_manteau:
    title: Camille observă paltonul
    gloss: 'Camille: Ce frumos e paltonul ăsta! Ce mărime porți?'
    note: '*Joli* (frumos, drăguț) este o reacție pozitivă generală; aici este la masculin, în acord cu *manteau*.'
  fr.a1.unit48.lesson06.teach.mathieu_je_fais:
    title: Mathieu cere să-l probeze
    gloss: 'Mathieu: Port mărimea M. Pot să-l probez?'
    note: '*Je peux ... ?* este formula obișnuită pentru a cere permisiunea; *l''essayer* înseamnă „a-l proba”, iar *l''* înlocuiește paltonul.'
  fr.a1.unit48.lesson06.teach.camille_bien_sur:
    title: Camille întreabă cum i se potrivește
    gloss: 'Camille: Sigur. Îți vine bine?'
    note: '*Il* (el) se referă la *le manteau*, un substantiv masculin.'
  fr.a1.unit48.lesson06.teach.mathieu_oui_il:
    title: Mathieu confirmă
    gloss: 'Mathieu: Da, îmi vine bine și este cald.'
    note: 'Corespunde întocmai cu bonul citit mai devreme: este același palton.'
  fr.a1.unit48.lesson06.teach.camille_super_tu:
    title: Camille întreabă despre culoare
    gloss: 'Camille: Super! Îl vrei în negru sau în albastru?'
    note: '*Tu le veux en ... ou en ... ?* propune o alegere; *le* înlocuiește paltonul.'
  fr.a1.unit48.lesson06.teach.mathieu_je_le:
    title: Mathieu se hotărăște
    gloss: 'Mathieu: Îl iau în negru.'
    note: '*Prendre* (a lua) este verbul firesc pentru a încheia alegerea unei cumpărături, în acord cu culoarea de pe bon.'
  fr.a1.unit48.lesson06.teach.on_ecrit_prends:
    title: Prends sau prend
    gloss: '*Prends* este forma pentru „eu” și „tu” a verbului *prendre* (a lua); *prend* este forma pentru „el/ea”.'
    note: 'Modelul verbului *prendre*: *je prends, tu prends, il/elle prend*.'
