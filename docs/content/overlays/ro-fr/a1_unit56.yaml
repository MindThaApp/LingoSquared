    title: À vélo, en train
    gloss: Franceza folosește *à* pentru mijloacele pe care le călărești sau pentru mersul pe jos (*à vélo*, *à pied*) și *en* pentru cele în interiorul cărora te așezi (*en train*, *en voiture*).
    note: Cei care învață franceza spun uneori greșit *par vélo* sau *dans le train*. Tratează *à vélo*, *à pied*, *en train* și *en voiture* ca expresii fixe.
