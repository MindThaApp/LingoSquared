answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Franceză A1
  description: Vocabularul familiei apropiate și extinse, sistemul adjectivelor posesive mon/ma/mes și descrierea unei gospodării, continuând povestea atelierului de gătit al lui Inès și Mathieu din unitățile 01-02. Ghidajul evidențiază că posesivele franceze se acordă cu genul substantivului, nu al posesorului.
units:
  fr.a1.unit03.family:
    title: Familiile lui Inès și Mathieu
lessons:
  fr.a1.unit03.lesson01.immediate_family:
    title: Familia apropiată
  fr.a1.unit03.lesson02.possessives_mon_ma_mes:
    title: 'Posesive: mon, ma, mes'
  fr.a1.unit03.lesson03.extended_family:
    title: Familia extinsă
  fr.a1.unit03.lesson04.describing_family_size:
    title: Câți sunt acasă
  fr.a1.unit03.lesson05.reading_a_family_profile:
    title: Citim profilul unei familii
  fr.a1.unit03.lesson06.family_photos_dialogue:
    title: Fotografii de familie cu Inès și Mathieu
teaching:
  fr.a1.unit03.lesson01.teach.mere:
    title: Mama
    gloss: mamă
    note: '*Mère* este feminin. *Maman* este cuvântul mai des folosit în familie, în timp ce *mère* este neutru și apare în listele de vocabular ale cursului.'
  fr.a1.unit03.lesson01.teach.pere:
    title: Tatăl
    gloss: tată
    note: '*Père* este masculin. *Papa* este echivalentul de zi cu zi, paralel cu *mère*/*maman*.'
  fr.a1.unit03.lesson01.teach.frere:
    title: Fratele
    gloss: frate
    note: '*Frère* este masculin singular.'
  fr.a1.unit03.lesson01.teach.soeur:
    title: Sora
    gloss: soră
    note: '*Sœur* este feminin singular. Ligatura œ este o singură literă în ortografia franceză, nu două litere separate.'
  fr.a1.unit03.lesson01.teach.fils:
    title: Fiul
    gloss: fiu
    note: '*Fils* este masculin; atenție: s-ul final, de obicei mut, se pronunță aici (o excepție), iar l-ul nu se pronunță.'
  fr.a1.unit03.lesson01.teach.fille:
    title: Fiica
    gloss: fiică
    note: '*Fille* este feminin singular; același cuvânt înseamnă și „fată” în alte contexte.'
  fr.a1.unit03.lesson01.teach.parents:
    title: Parents
    gloss: părinți
    note: '*Parents* este masculin plural și îi cuprinde împreună pe mamă și pe tată.'
  fr.a1.unit03.lesson01.teach.freres_et_soeurs:
    title: Frații
    gloss: frați și surori
    note: Franceza nu are un singur cuvânt neutru pentru „frați și surori”; *frères et sœurs* îi numește explicit pe amândoi.
  fr.a1.unit03.lesson02.teach.ma_mere:
    title: Mama mea
    gloss: mama mea
    note: '*Ma* este posesivul feminin singular „meu/mea”, folosit pentru că *mère* este de genul feminin.'
  fr.a1.unit03.lesson02.teach.mon_pere:
    title: Tatăl meu
    gloss: tatăl meu
    note: '*Mon* este posesivul masculin singular „meu”, folosit pentru că *père* este de genul masculin.'
  fr.a1.unit03.lesson02.teach.mes_freres_et_soeurs:
    title: Frații și surorile mele
    gloss: frații și surorile mele
    note: '*Mes* este posesivul la plural „mei/mele”, folosit pentru orice substantiv la plural, indiferent de gen. Acordul este asemănător cu *ma*/*mon*, dar se face în număr, nu în gen.'
  fr.a1.unit03.lesson02.teach.as_tu_des_freres_et_soeurs:
    title: Întreabă despre frați și surori
    gloss: Ai frați sau surori?
    note: '*As-tu* este forma interogativă cu inversiune a lui *tu as* („ai”), un tipar de întrebare foarte frecvent la nivelul A1.'
  fr.a1.unit03.lesson02.teach.jai_deux_soeurs:
    title: Spune câți frați și surori ai
    gloss: Am două surori.
    note: '*J''ai* („am”) împreună cu un număr și un substantiv din familie este modul standard de a vorbi despre frați și surori.'
  fr.a1.unit03.lesson02.teach.ta_famille_est_grande:
    title: Întreabă dacă o familie este mare
    gloss: Familia ta este mare?
    note: '*Ta* este posesivul informal feminin singular „ta”, acordat cu substantivul feminin *famille*.'
  fr.a1.unit03.lesson02.teach.ma_famille_est_petite:
    title: Descrie o familie mică
    gloss: Familia mea este mică.
    note: '*Petite* se acordă cu substantivul feminin *famille*; forma masculină *petit* apare cu un substantiv masculin. Este un alt tip de acord decât *mon*/*ma*/*mes*, care se acordă tot cu substantivul, dar exprimă POSESIA, nu o calitate.'
  fr.a1.unit03.lesson03.teach.grand_pere:
    title: Bunicul
    gloss: bunic
    note: '*Grand-père* este un cuvânt compus cu cratimă, de genul masculin.'
  fr.a1.unit03.lesson03.teach.grand_mere:
    title: Bunica
    gloss: bunică
    note: '*Grand-mère* este un cuvânt compus cu cratimă, de genul feminin. Observă că *grand-* rămâne invariabil, nu devine *grande-mère*.'
  fr.a1.unit03.lesson03.teach.grands_parents:
    title: Bunicii
    gloss: bunici
    note: '*Grands-parents* pune la plural ambele părți ale compusului (*grands*, nu *grand-*), spre deosebire de singular, unde *grand-* din *grand-mère*/*grand-père* rămâne invariabil.'
  fr.a1.unit03.lesson03.teach.oncle:
    title: Unchiul
    gloss: unchi
    note: '*Oncle* este de genul masculin.'
  fr.a1.unit03.lesson03.teach.tante:
    title: Mătușa
    gloss: mătușă
    note: '*Tante* este de genul feminin.'
  fr.a1.unit03.lesson03.teach.cousin:
    title: Vărul
    gloss: văr
    note: '*Cousin* este masculin singular; ca în română (văr / verișoară), franceza marchează genul vărului.'
  fr.a1.unit03.lesson03.teach.cousine:
    title: Verișoara
    gloss: verișoară
    note: '*Cousine* este feminin singular, format prin adăugarea lui -e la *cousin*.'
  fr.a1.unit03.lesson03.teach.mes_grands_parents:
    title: Bunicii mei
    gloss: bunicii mei
    note: Se folosește *mes* pentru că *grands-parents* este la plural, chiar dacă include atât un bunic, cât și o bunică.
  fr.a1.unit03.lesson04.teach.combien_de_freres_et_soeurs:
    title: Întreabă câți frați și surori are cineva
    gloss: Câți frați și surori ai?
    note: '*Combien de* („câți/câte”) stă direct înaintea substantivului în franceză, iar întrebarea se formează prin inversiune (as-tu).'
  fr.a1.unit03.lesson04.teach.on_est_cinq:
    title: Spune câți oameni sunteți în casă
    gloss: Suntem șase acasă.
    note: '*On est* (literal „se este”, dar folosit ca un „suntem” informal) este modul natural și foarte frecvent de a spune câte persoane sunt într-o gospodărie în franceza vorbită; *nous sommes* este mai formal sau scris.'
  fr.a1.unit03.lesson04.teach.ma_famille_est_grande:
    title: Descrie o familie mare
    gloss: Familia mea este mare.
    note: '*Grande* se acordă cu substantivul feminin *famille*; forma masculină *grand* apare cu un substantiv masculin.'
  fr.a1.unit03.lesson04.teach.jai_beaucoup_de_cousins:
    title: Spune că ai mulți veri
    gloss: Am mulți veri.
    note: '*Beaucoup de* („mulți/multe”) stă înaintea substantivului; *de* nu devine *du*/*des*, pentru că *beaucoup* cuantifică deja substantivul.'
  fr.a1.unit03.lesson04.teach.tu_habites_pres_de_tes_parents:
    title: Întreabă dacă cineva locuiește aproape de părinți
    gloss: Locuiești aproape de părinții tăi?
    note: '*Tes* este posesivul informal la plural „tăi/tale”, necesar pentru că *parents* este la plural.'
  fr.a1.unit03.lesson04.teach.jhabite_avec_mes_grands_parents:
    title: Spune cu cine locuiești
    gloss: Locuiesc cu bunicii mei.
    note: '*Avec* („cu”) introduce persoanele cu care locuiește cineva; *j''habite* este forma lui *je* de la *habiter*, văzută deja în Unitatea 1, în *j''habite à Montreuil*.'
  fr.a1.unit03.lesson05.teach.profile_reading:
    title: Profilul familiei Inèsei
    gloss: 'Mă numesc Inès. Am treizeci și unu de ani și locuiesc cu bunicii mei la Paris. Mama și tatăl meu locuiesc la Lille. Am două surori și un frate: suntem șase acasă. Sora mea mai mică se numește Camille și are douăzeci de ani.'
    note: Acest profil reia vocabularul și structurile din lecțiile 1–4 într-un text scurt și coerent, nu în propoziții izolate, exersând aceeași abilitate de a înțelege cine este cine, pe care o urmărește și evaluarea de lectură a unității.
    glosses:
      trente: treizeci
      ans: ani
      grands-parents: bunici
      mère: mamă
      père: tată
      habitent: locuiesc / locuiește (de la habiter)
      deux: două
      sœurs: surori
      frère: frate
      six: șase
      maison: acasă
      petite: mai mică / mică
      sœur: soră
      vingt: douăzeci
  fr.a1.unit03.lesson05.teach.petite_soeur:
    title: Sora mai mică
    gloss: sora mai mică
    note: '*Petite* (femininul lui *petit*) stă aici înaintea substantivului, ca majoritatea adjectivelor scurte și uzuale din franceză; celelalte adjective stau, de obicei, după substantiv.'
  fr.a1.unit03.lesson05.teach.habite_third_person:
    title: Locuiește (persoana a III-a)
    gloss: locuiește
    note: '*Habite* este forma persoanei a treia singular a verbului *habiter*, folosită pentru a vorbi DESPRE cineva (*Inès habite...*), nu despre sine (*j''habite*, văzut în Unitatea 1 și în lecția 4 a acestei unități).'
  fr.a1.unit03.lesson05.teach.ses_third_person_plural:
    title: Al ei/al lui/al lor (substantiv la plural)
    gloss: ei/lui/lor
    note: '*Ses* este pluralul lui *sa*/*son*, folosit la fel cum *sa*/*son* exprimă „al ei/al lui” pentru un substantiv la singular -- *ses grands-parents* înseamnă „bunicii ei” când vorbim despre Inès la persoana a treia.'
  fr.a1.unit03.lesson05.teach.a_third_person_avoir:
    title: A are (persoana a treia)
    gloss: are
    note: '*A* este forma persoanei a treia singular a verbului *avoir*, folosită pentru a vorbi DESPRE cineva (*elle a vingt ans*), nu despre sine (*j''ai* / *as-tu*, văzute în lecțiile 2–4 ale acestei unități).'
  fr.a1.unit03.lesson06.teach.line01:
    title: Arată fotografii de familie
    gloss: Inès îi arată lui Mathieu o fotografie și îi prezintă părinții și sora mai mică.
    note: '*Voici* („iată”, „aici este/sunt”) introduce ceva ce se arată, o expresie firească pentru a prezenta o fotografie.'
  fr.a1.unit03.lesson06.teach.line02:
    title: Reacționează și întreabă despre frați
    gloss: Mathieu reacționează cu căldură și o întreabă dacă are și alți frați și surori.
    note: '*C''est adorable* este o reacție firească și caldă când vezi fotografia unui frate sau a unei surori mai mici.'
  fr.a1.unit03.lesson06.teach.line03:
    title: Spune câți sunteți acasă și întoarce întrebarea
    gloss: Inès spune că are două surori și un frate, că sunt șase acasă, apoi îl întreabă despre familia lui Mathieu.
    note: '*On est six à la maison* indică numărul total de persoane din gospodărie, continuând tiparul din lecția 4.'
  fr.a1.unit03.lesson06.teach.line04:
    title: Descrie o familie mai mică
    gloss: 'Mathieu spune că familia lui este mai mică, doar trei persoane: părinții și el, dar că are mulți veri.'
    note: '*Mais* („dar”) marchează contrastul dintre o familie apropiată mică și multe rude îndepărtate.'
  fr.a1.unit03.lesson06.teach.line05:
    title: Întreabă dacă locuiește aproape de părinți
    gloss: Inès îl întreabă pe Mathieu dacă locuiește aproape de părinți.
    note: '*Près de* („aproape de”) este o modalitate frecventă de a descrie apropierea fizică.'
  fr.a1.unit03.lesson06.teach.line06:
    title: Explică distanța și cum țineți legătura
    gloss: Mathieu spune că nu, ei locuiesc la Lyon, și vorbesc la telefon în fiecare săptămână.
    note: 'Continuă faptul stabilit în Unitatea 1, că Mathieu este din Lyon: părinții lui au rămas acolo, iar el locuiește la Saint-Ouen.'
  fr.a1.unit03.lesson06.teach.line07:
    title: Arată înțelegere și spune ce se întâmplă la tine
    gloss: Inès spune că înțelege și că ea locuiește aici, la Paris, cu bunicii ei.
    note: '*Je comprends* („înțeleg”) este o formulă scurtă și firească prin care recunoști ce a spus celălalt, înainte de a adăuga un detaliu al tău.'
  fr.a1.unit03.lesson06.teach.line08:
    title: Încheie cu o remarcă caldă
    gloss: Mathieu spune că este frumos să ai familia aproape.
    note: '*C''est bien d''avoir sa famille près de soi* încheie schimbul de replici pe o notă caldă și reflexivă, reluând tiparul *près de* din lecția 4.'
