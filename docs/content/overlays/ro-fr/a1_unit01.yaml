  fr.a1.unit01.lesson05.first_meeting_small_talk:
    title: Cunoștință în cartier
  fr.a1.unit01.lesson06.workshop_dialogue:
    title: Prima întâlnire la un atelier
teaching:
  fr.a1.unit01.lesson01.teach.bonjour:
    title: Salut neutru
    gloss: bună ziua; bună dimineața
    note: Bonjour se potrivește cu necunoscuți, colegi și prieteni, în timpul zilei. Ca „bună ziua” în română, nu se folosește seara.
  fr.a1.unit01.lesson01.teach.salut:
    title: Salut informal
    gloss: salut; pa
    note: Salut se folosește într-o relație informală. Poate deschide sau încheia o discuție, dar nu este prima alegere sigură cu un adult necunoscut.
  fr.a1.unit01.lesson01.teach.au_revoir:
    title: Rămas-bun neutru
    gloss: la revedere
    note: Au revoir se potrivește atât în situații politicoase, cât și în cele informale.
  fr.a1.unit01.lesson01.teach.tu:
    title: „Tu” de adresare informală, la singular
    gloss: tu (informal, singular)
    note: Ca în română, franceza face diferența între tu și forma de politețe. Tu se adresează unui prieten, unui copil sau unei persoane cu care ai o relație explicit informală și cere propriile forme verbale.
  fr.a1.unit01.lesson01.teach.vous:
    title: „Dumneavoastră” sau „voi”
    gloss: dumneavoastră; voi
    note: Vous este alegerea sigură pentru un adult necunoscut și este totodată forma pentru orice grup. Spre deosebire de română, unde pluralul „voi” și politețea „dumneavoastră” sunt cuvinte diferite, franceza folosește același vous pentru ambele.
  fr.a1.unit01.lesson01.teach.comment_allez_vous:
    title: Întrebare formală despre starea cuiva
    gloss: Ce mai faceți?
    note: Allez este forma de vous a verbului aller. Verbul și pronumele sunt inversate și legate printr-o cratimă. Este o întrebare de politețe convențională, nu o întrebare literală despre locul unde merge cineva.
  fr.a1.unit01.lesson01.teach.comment_vas_tu:
    title: Întrebare informală despre starea cuiva
    gloss: Ce mai faceți?
    note: Vas este forma de tu a verbului aller. Când relația devine informală, allez-vous devine vas-tu, la fel cum în română treci de la „Ce mai faceți?” la „Ce mai faci?”.
  fr.a1.unit01.lesson01.teach.register_choice:
    title: Potrivește salutul cu relația
    gloss: Bonjour cu vous; salut cu tu
    note: Aceste perechi sunt repere utile, nu legi absolute. Bonjour poate fi folosit și cu prietenii, dar salut împreună cu vous transmite de obicei semnale sociale contradictorii.
  fr.a1.unit01.lesson02.teach.je_mappelle:
    title: Spune-ți numele
    gloss: Mă numesc Camille.
    note: Je m’appelle înseamnă literal „mă numesc”. Spre deosebire de română, unde pronumele subiect se omite de obicei, franceza cere în mod normal subiectul je. Vocala din me dispare înaintea lui appelle și rezultă m’appelle.
  fr.a1.unit01.lesson02.teach.comment_appelez_vous:
    title: Întreabă politicos cum cheamă pe cineva
    gloss: Cum vă numiți?
    note: 'Appelez este forma de vous a verbului appeler. Al doilea vous stă după verb, deoarece întrebarea folosește inversiunea: vous appelez-vous.'
  fr.a1.unit01.lesson02.teach.tu_tappelles:
    title: Întreabă informal numele cuiva
    gloss: Cum vă numiți?
    note: T’appelles este forma de tu, cu pronumele reflexiv te scurtat înaintea unei vocale. Această întrebare de zi cu zi păstrează tu înaintea verbului și pune comment la final.
  fr.a1.unit01.lesson02.teach.moi_cest:
    title: Prezentare de sine în conversație
    gloss: Eu sunt Noé.
    note: Moi, c’est este o prezentare vorbită, idiomatică. Sună mai firesc decât o traducere cuvânt cu cuvânt a lui „eu sunt”.
  fr.a1.unit01.lesson02.teach.enchante:
    title: Acord la masculin
    gloss: Îmi pare bine.
    note: Un vorbitor bărbat scrie în mod normal enchanté. Ca în română („încântat” / „încântată”), adjectivul se acordă cu genul vorbitorului.
  fr.a1.unit01.lesson02.teach.enchantee:
    title: Acord la feminin
    gloss: Îmi pare bine.
    note: O vorbitoare scrie în mod normal enchantée, cu un e la final. Enchanté și enchantée se pronunță de obicei la fel, deci diferența se vede mai clar în scris decât în vorbire.
  fr.a1.unit01.lesson02.teach.et_vous:
    title: Întoarce politicos întrebarea
    gloss: Dar dumneavoastră?
    note: Folosește vous pentru a păstra registrul politicos sau pentru a te adresa unui grup.
  fr.a1.unit01.lesson02.teach.et_toi:
    title: Întoarce informal întrebarea
    gloss: Dar dumneavoastră?
    note: Toi este forma accentuată care corespunde lui tu. După et se folosește toi, nu tu, spre deosebire de română, unde se spune „Și tu?”.
  fr.a1.unit01.lesson03.teach.elision_jhabite:
    title: Elidarea înaintea unei vocale
    gloss: locuiesc
    note: 'Je pierde vocala înaintea lui habite, iar apostroful marchează elidarea: j’habite. Litera h din habiter nu împiedică elidarea.'
  fr.a1.unit01.lesson03.teach.liaison_vous_etes:
    title: Legătura (liaison) după vous
    gloss: sunteți
    note: 'Litera s finală din vous este în mod normal mută, dar înaintea sunetului vocalic din êtes se leagă ca un sunet z: vous êtes sună aproximativ voo-ZET. Legătura ține de rostirea expresiei, nu de scrierea ei.'
  fr.a1.unit01.lesson03.teach.liaison_un_atelier:
    title: Legătura (liaison) după un
    gloss: un atelier
    note: Litera n finală din un se leagă de atelier. Evită să faci o pauză bruscă între cele două cuvinte.
  fr.a1.unit01.lesson03.teach.final_e_enchante:
    title: Scrierea la masculin
    gloss: încântat (vorbitor bărbat)
    note: Enchanté se termină în é când vorbește un bărbat. Grupul -an- este o vocală nazală, așa că nu rosti un n separat, cum ai face într-un cuvânt românesc.
  fr.a1.unit01.lesson03.teach.final_e_enchantee:
    title: Scrierea la feminin
    gloss: încântată (vorbitoare)
    note: Enchantée adaugă un e pentru acordul la feminin, dar acest e în plus nu adaugă, în mod normal, o silabă rostită.
  fr.a1.unit01.lesson03.teach.question_liaison:
    title: Citește o întrebare cu inversiune
    gloss: Ce mai faceți?
    note: Păstrează allez-vous legat, ca o singură unitate. Litera z din allez nu se pronunță aici ca un z în plus; pronunțarea standard este aproximativ a-LE vu.
  fr.a1.unit01.lesson04.teach.ca_va:
    title: Întrebare obișnuită despre cum te simți
    gloss: Ce mai faci?; Merge bine?
    note: Ça are o sedilă, care face ca litera c să sune s înaintea lui a. Aceeași expresie poate fi întrebare sau răspuns, în funcție de intonație.
  fr.a1.unit01.lesson04.teach.tres_bien:
    title: Răspuns foarte pozitiv
    gloss: Foarte bine, mulțumesc.
    note: Très întărește sensul lui bien. Litera s finală este mută.
  fr.a1.unit01.lesson04.teach.ca_va_bien:
    title: Răspuns pozitiv
    gloss: Sunt bine.
    note: În această replică fixă nu apare niciun pronume subiect; Ça va bien înseamnă literal „merge bine”.
  fr.a1.unit01.lesson04.teach.pas_mal:
    title: Răspuns moderat pozitiv
    gloss: Nu-i rău.
    note: Pas mal are adesea un sens ușor pozitiv, ca „nu-i rău” în română.
  fr.a1.unit01.lesson04.teach.fatigue:
    title: Acordul adjectivului la masculin
    gloss: Sunt puțin obosit.
    note: Suis este forma de je a verbului être. Un vorbitor bărbat scrie fatigué. Ca în română („obosit” / „obosită”), adjectivul se acordă cu genul vorbitorului.
  fr.a1.unit01.lesson04.teach.fatiguee:
    title: Acordul adjectivului la feminin
    gloss: Sunt puțin obosită.
    note: O vorbitoare scrie fatiguée, cu un e la final. Forma de masculin și cea de feminin se pronunță în mod normal la fel.
  fr.a1.unit01.lesson04.teach.et_vous:
    title: Întoarce politicos întrebarea
    gloss: Dar dumneavoastră?
    note: Vous păstrează registrul respectuos folosit cu un adult necunoscut.
  fr.a1.unit01.lesson04.teach.et_toi:
    title: Întoarce informal întrebarea
    gloss: Dar dumneavoastră?
    note: Folosește toi după et când vorbești informal cu un prieten sau cu o persoană de aceeași vârstă.
  fr.a1.unit01.lesson05.teach.here_for_workshop:
    title: Confirmă scopul prezenței cuiva
    gloss: Sunteți aici pentru atelier?
    note: Êtes este forma de vous a verbului être. Ca în română, intonația ascendentă transformă propoziția într-o întrebare, fără alte cuvinte în plus.
  fr.a1.unit01.lesson05.teach.yes_thats_it:
    title: Confirmă o presupunere
    gloss: Da, așa este.
    note: C’est ça este o confirmare firească, nu o traducere literală a lui „este asta”.
  fr.a1.unit01.lesson05.teach.live_neighborhood:
    title: Întreabă unde locuiește cineva
    gloss: Locuiți în cartier?
    note: Habitez este forma de vous a verbului habiter. Ca în română, întrebarea poate păstra ordinea din afirmație, cu intonație ascendentă.
  fr.a1.unit01.lesson05.teach.i_live:
    title: Spune unde locuiești
    gloss: Locuiesc în Montreuil.
    note: J’habite este forma de je a verbului habiter, cu elidare. À indică un oraș și nu trebuie confundat cu a, forma verbală care înseamnă „are”.
  fr.a1.unit01.lesson05.teach.from_here:
    title: Întreabă despre originea locală
    gloss: Sunteți de aici?
    note: D’ici îîmbină de și ici prin elidare. Êtes rămâne forma de vous a verbului être.
  fr.a1.unit01.lesson05.teach.from_lille:
    title: Spune de unde ești
    gloss: Sunt din Lille.
    note: Suis este forma de je a verbului être. Pentru a spune de unde ești, franceza folosește de înaintea numelui unui oraș, așa cum româna folosește „din”.
  fr.a1.unit01.lesson05.teach.workshop_starts:
    title: Activitatea începe
    gloss: Atelierul începe.
    note: Atelier este de genul masculin, deci articolul la singular este le. Înaintea unei vocale, le devine l’. Commence este forma de persoana a treia singular.
  fr.a1.unit01.lesson05.teach.see_you_shortly:
    title: Rămas-bun pentru scurt timp
    gloss: ne vedem imediat; ne vedem mai târziu azi
    note: À tout à l’heure sugerează o nouă întâlnire mai târziu în aceeași zi, spre deosebire de un rămas-bun general, fără un moment anume așteptat.
  fr.a1.unit01.lesson06.teach.line01:
    title: Începe întâlnirea
    gloss: Inès îl salută pe Mathieu și verifică dacă este aici pentru atelierul de gătit.
    note: Interlocutorii încep cu vous, pentru că sunt adulți necunoscuți.
  fr.a1.unit01.lesson06.teach.line02:
    title: Începe întâlnirea, răspunsul
    gloss: Mathieu confirmă și își spune numele, apoi o întreabă pe ea.
    note: Je m’appelle este modul standard de a-ți spune numele.
  fr.a1.unit01.lesson06.teach.line03:
    title: Schimb de nume
    gloss: Inès își spune numele și zice că îi pare bine să îl cunoască.
    note: Enchantée se acordă cu Inès (feminin); terminația -e se scrie, dar în mod normal nu se aude.
  fr.a1.unit01.lesson06.teach.line04:
    title: Schimb de nume, răspuns
    gloss: Mathieu răspunde la fel și o întreabă dacă locuiește prin apropiere.
    note: Enchanté se acordă cu Mathieu (masculin); este același cuvânt pe care tocmai l-a folosit Inès, fără -e mut.
  fr.a1.unit01.lesson06.teach.line05:
    title: Schimb de informații despre cartier
    gloss: Inès confirmă și spune pe ce stradă locuiește, apoi îi pune lui Mathieu aceeași întrebare.
    note: J’habite urmat de numele unei străzi nu folosește nicio prepoziție înaintea lui rue.
  fr.a1.unit01.lesson06.teach.line06:
    title: Schimb de informații despre cartier, răspunsul
    gloss: Mathieu spune că locuiește în Saint-Ouen și o întreabă dacă este de aici.
    note: J’habite à folosește à înaintea numelui unui loc, spre deosebire de expresia cu strada, folosită de Inès adineauri.
  fr.a1.unit01.lesson06.teach.line07:
    title: Schimb de informații despre origine
    gloss: Inès spune că nu este de aici, că este din Lille, apoi îl întreabă pe Mathieu.
    note: Je suis de + un oraș arată de unde este cineva.
  fr.a1.unit01.lesson06.teach.line08:
    title: Schimb de origini, răspuns
    gloss: Mathieu spune că e din Lyon.
    note: Același tipar je suis de pe care tocmai l-a folosit Inès.
  fr.a1.unit01.lesson06.teach.line09:
    title: Întrerupe conversația
    gloss: Inès observă că atelierul începe și spune că ne vedem imediat.
    note: À tout à l’heure se potrivește pentru că amândoi vor rămâne la același eveniment.
  fr.a1.unit01.lesson06.teach.line10:
    title: Întrerupe conversația, răspuns
    gloss: Mathieu repetă aceeași urare de rămas-bun.
    note: Repetarea lui à tout à l’heure este modul firesc de a confirma.
