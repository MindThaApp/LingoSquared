    title: Planuri pentru un weekend împreună
teaching:
  fr.a1.unit52.lesson01.teach.lire_faire_du:
    title: Citit, sport, gătit
    gloss: a citi, a face sport, a găti
    note: 'Trei verbe uzuale pentru hobby-uri: *lire* (a citi), *faire du sport* (a face sport) și *cuisiner* (a găti).'
    example_gloss:
    - Îmi place să citesc o carte.
    - Fac sport sâmbăta.
    - Îmi place să gătesc pentru prieteni.
  fr.a1.unit52.lesson01.teach.le_temps_libre:
    title: Timpul liber
    gloss: timpul liber
    note: '*Temps libre* este masculin: *le temps libre*. Este expresia-cheie pentru a vorbi despre hobby-uri.'
    example_gloss: În timpul liber, îmi place să citesc.
  fr.a1.unit52.lesson01.teach.pendant_mon_temps:
    title: Spui ce faci în timpul liber
    gloss: În timpul liber, îmi place să citesc.
    note: '*Lis* este forma pentru *je* a verbului *lire* (a citi); *s* final nu se pronunță.'
  fr.a1.unit52.lesson02.teach.ecouter_de_la:
    title: Muzică, desen, jocuri video
    gloss: a asculta muzică, a desena, a juca jocuri video
    note: 'Încă trei hobby-uri: *écouter de la musique*, *dessiner* și *jouer aux jeux vidéo*. La jocuri, *jouer à* + *les* devine *jouer aux*.'
    example_gloss:
    - Îmi place să ascult muzică.
    - Desenez des.
    - Îmi place să joc jocuri video cu prietenii.
  fr.a1.unit52.lesson02.teach.j_aime_ecouter:
    title: Spui că îți place să asculți muzică
    gloss: Îmi place să ascult muzică.
    note: '*Écouter* se construiește direct cu complementul, fără niciun cuvânt în plus: *écouter de la musique*.'
  fr.a1.unit52.lesson02.teach.j_aime_jouer:
    title: Spui că îți place să joci jocuri video cu prietenii
    gloss: Îmi place să joc jocuri video cu prietenii.
    note: '*Avec des amis* (cu prieteni) reia *amis* din lecția 1; *des* este pluralul lui „niște”.'
  fr.a1.unit52.lesson03.teach.toujours_souvent_parfois:
    title: Mereu, des, uneori, niciodată
    gloss: mereu, des, uneori, niciodată
    note: Cele patru adverbe de frecvență de bază. *Souvent* poate fi deja cunoscut; *toujours*, *parfois* și *jamais* sunt noi. *Jamais* cere *ne* înaintea verbului.
    example_gloss:
    - Fac mereu sport sâmbăta.
    - Citesc des o carte.
    - Desenez uneori.
    - Nu joc niciodată jocuri video.
  fr.a1.unit52.lesson03.teach.chaque_semaine_chaque:
    title: În fiecare săptămână, în fiecare weekend
    gloss: în fiecare săptămână, în fiecare weekend
    note: '*Chaque semaine* și *chaque week-end* înseamnă amândouă „în fiecare”. *Chaque* nu se schimbă niciodată, indiferent de genul substantivului.'
    example_gloss:
    - Gătesc pentru prieteni în fiecare săptămână.
    - Fac sport în fiecare weekend.
  fr.a1.unit52.lesson03.teach.chaque_ne_change:
    title: Chaque nu se schimbă niciodată
    gloss: '*Chaque* rămâne la fel înaintea substantivelor masculine și feminine: *chaque semaine*, *chaque week-end*.'
    note: '*Semaine* este feminin, iar *week-end* este masculin, dar *chaque* este identic pentru amândouă. Compară cu *tous les* / *toutes les*, care se schimbă.'
  fr.a1.unit52.lesson03.teach.qu_est_ce:
    title: Întrebi despre timpul liber
    gloss: Ce faci în timpul liber?
    note: Aceasta este întrebarea de bază a unității -- folosește-o ca să întrebi pe oricine despre hobby-uri.
  fr.a1.unit52.lesson04.teach.camille_on_se:
    title: Camille aduce vorba despre hobby-uri
    gloss: 'Camille: Ne plimbăm des împreună. Dar ce altceva mai faci în timpul liber, Mathieu?'
    note: '*On se promène souvent* folosește *on* pentru „noi”, iar *souvent* stă imediat după verb.'
  fr.a1.unit52.lesson04.teach.mathieu_j_aime:
    title: Hobby-urile lui Mathieu
    gloss: 'Mathieu: Îmi place să gătesc, chiar și acasă. Și fac des sport.'
    note: '*Même à la maison* (chiar și acasă) arată că Mathieu gătește din plăcere, nu doar la serviciu.'
  fr.a1.unit52.lesson04.teach.camille_tu_cuisines:
    title: Camille este surprinsă
    gloss: 'Camille: Gătești și acasă? Deja gătești toată ziua la serviciu!'
    note: '*Toute la journée* (toată ziua) subliniază cât gătește Mathieu deja la serviciu.'
  fr.a1.unit52.lesson04.teach.mathieu_oui_mais:
    title: Mathieu explică
    gloss: 'Mathieu: Da, dar mie gătitul mi se pare relaxant. Și tu, ce-ți place să faci?'
    note: '*Cuisiner, je trouve ça relaxant* pune *cuisiner* la început pentru accent: literal „gătitul, îl găsesc relaxant”.'
  fr.a1.unit52.lesson04.teach.camille_j_aime:
    title: Hobby-urile lui Camille
    gloss: 'Camille: Îmi place să citesc și ascult des muzică.'
    note: Combină două pasiuni din lecțiile 1 și 2 într-o singură propoziție, cu *et* (și).
  fr.a1.unit52.lesson04.teach.mathieu_tu_joues:
    title: Mathieu întreabă despre jocuri video
    gloss: 'Mathieu: Joci și tu jocuri video?'
    note: 'O întrebare scurtă cu da/nu: *Tu joues aussi aux jeux vidéo ?* Intonația ascendentă o transformă în întrebare.'
  fr.a1.unit52.lesson04.teach.camille_non_je:
    title: Camille răspunde
    gloss: 'Camille: Nu, eu nu joc niciodată jocuri video. Dar uneori desenez!'
    note: '*Jamais* (niciodată) și *parfois* (uneori) din lecția 3, puse în contrast într-un singur răspuns.'
  fr.a1.unit52.lesson05.teach.mathieu_et_moi:
    title: Comparăm hobby-urile
    gloss: Mathieu și cu mine ne plimbăm des împreună. Dar avem și alte pasiuni. Lui Mathieu îi place să gătească, chiar și acasă, și face des sport. Mie îmi place să citesc și ascult des muzică. Uneori desenez, dar nu joc niciodată jocuri video. Ce îți place să faci în timpul liber?
    note: Mesajul lui Camille reia fapte din lecția 4 și se termină cu întrebarea centrală a unității, adresată cititorului.
    glosses:
      promène: a se plimba
      souvent: des
      ensemble: împreună
      d'autres: alte
      cuisiner: gătește
      aime: cu plăcere
      maison: acasă
      sport: face sport
      lire: citesc
      j'écoute: ascult
      musique: muzică
      dessine: desenez
      parfois: uneori
      jeux: joc jocuri video
      jamais: niciodată
      libre: liber
      temps: timp
  fr.a1.unit52.lesson06.teach.mathieu_qu_est:
    title: Mathieu întreabă despre weekend
    gloss: 'Mathieu: Ce faci în weekendul ăsta?'
    note: '*Ce week-end* (weekendul acesta) folosește *ce* pentru că *week-end* este de genul masculin.'
  fr.a1.unit52.lesson06.teach.camille_je_ne:
    title: Camille nu s-a hotărât
    gloss: 'Camille: Încă nu știu. Îmi place să citesc, dar vreau și să ies.'
    note: '*Sortir* (a ieși) este un mod obișnuit de a spune că vrei să ieși din casă.'
  fr.a1.unit52.lesson06.teach.mathieu_on_se:
    title: Mathieu propune un plan
    gloss: 'Mathieu: Ne plimbăm împreună? După aceea gătesc eu pentru noi.'
    note: '*Après* (după aceea) ordonează două planuri, ca *d''abord* și *ensuite*.'
  fr.a1.unit52.lesson06.teach.camille_bonne_idee:
    title: Camille e de acord
    gloss: 'Camille: Bună idee! Îmi place la fel de mult să mă plimb ca să gătesc.'
    note: '*Autant ... que* (la fel de mult ... ca) arată că lui Camille îi plac două lucruri în mod egal, nu unul mai mult decât celălalt.'
  fr.a1.unit52.lesson06.teach.mathieu_parfait_alors:
    title: Mathieu confirmă
    gloss: 'Mathieu: Perfect. Atunci ne vedem sâmbătă!'
    note: O replică prietenoasă de încheiere, care confirmă planul pentru *samedi* (sâmbătă).
