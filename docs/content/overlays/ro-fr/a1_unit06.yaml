answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Franceză A1
  description: Momentele zilei și spunerea orei (heure(s), et quart, et demie, moins le quart), continuând povestea atelierului de gătit al Inèsei și al lui Mathieu, acum la programarea următoarei întâlniri. În franceză, în contexte formale sau de program se folosește sistemul de 24 de ore (dix-huit heures trente), alături de formele informale de 12 ore învățate mai devreme în unitate.
units:
  fr.a1.unit06.time:
    title: Cât este ceasul?
lessons:
  fr.a1.unit06.lesson01.moments_de_la_journee:
    title: Momentele zilei
  fr.a1.unit06.lesson02.dire_lheure:
    title: Cum spunem ora
  fr.a1.unit06.lesson03.dialogue_prochain_atelier:
    title: Următorul atelier
teaching:
  fr.a1.unit06.lesson01.teach.heure:
    title: Ora; timpul
    gloss: ora; timpul
    note: '*Heure* este feminin; este și unitatea folosită pentru a spune ora (*dix heures* = ora zece).'
    example_gloss: Cât este ceasul?
  fr.a1.unit06.lesson01.teach.matin:
    title: Dimineața
    gloss: dimineața
    note: '*Matin* este masculin.'
    example_gloss: Piața este deschisă dimineața.
  fr.a1.unit06.lesson01.teach.apres_midi:
    title: După-amiaza
    gloss: după-amiaza
    note: '*Après-midi* poate fi masculin sau feminin (masculinul este mai frecvent); *l''* se elidează în fața sunetului vocalic.'
    example_gloss: Lucrez după-amiaza.
  fr.a1.unit06.lesson01.teach.soir:
    title: Seara
    gloss: seara
    note: '*Soir* este masculin.'
    example_gloss: Atelierul de gătit este seara.
  fr.a1.unit06.lesson01.teach.midi:
    title: Amiaza
    gloss: amiază
    note: '*Midi* nu primește articol când indică ora (*à midi*, nu *au midi*).'
    example_gloss: Mâncăm la prânz, la ora douăsprezece.
  fr.a1.unit06.lesson01.teach.minuit:
    title: Miezul nopții
    gloss: miezul nopții
    note: '*Minuit* urmează același model fără articol ca *midi*.'
    example_gloss: Atelierul nu se termină niciodată după miezul nopții.
  fr.a1.unit06.lesson01.teach.latelier_commence_le_soir:
    title: Spune când are loc atelierul
    gloss: Atelierul începe seara, nu dimineața.
    note: Opune direct *le soir* și *le matin*, reluând ambele substantive din vocabularul acestei lecții.
  fr.a1.unit06.lesson02.teach.quelle_heure_est_il:
    title: Întreabă ora
    gloss: Cât este ceasul?
    note: '*Quelle heure est-il ?* este modul standard, de uz general, de a întreba ora; *-il* este inversat după verb și marchează întrebarea.'
  fr.a1.unit06.lesson02.teach.il_est_dix_heures:
    title: Spune ora
    gloss: Este ora zece.
    note: '*Il est* + număr + *heures* este modelul de bază pentru a spune orice oră; *heures* rămâne la plural, cu excepția lui *une heure* (ora unu).'
  fr.a1.unit06.lesson02.teach.et_quart:
    title: Spune „și un sfert”
    gloss: Este zece și un sfert.
    note: '*Et quart* (și un sfert) adaugă cincisprezece minute la ora spusă.'
  fr.a1.unit06.lesson02.teach.et_demie:
    title: Spune „și jumătate”
    gloss: Este zece și jumătate.
    note: '*Et demie* (și jumătate) adaugă treizeci de minute; *demie* primește -e de feminin, în acord cu *heure*.'
  fr.a1.unit06.lesson02.teach.moins_le_quart:
    title: Spune „fără un sfert”
    gloss: Este unsprezece fără un sfert.
    note: '*Moins le quart* (fără sfertul) numără înapoi de la ora URMĂTOARE, nu de la cea curentă, la fel ca în română: „unsprezece fără un sfert” înseamnă 10:45.'
  fr.a1.unit06.lesson02.teach.a_quelle_heure:
    title: Întreabă la ce oră începe ceva
    gloss: La ce oră începe atelierul?
    note: '*À quelle heure ?* (la ce oră) se folosește pentru un eveniment programat, spre deosebire de întrebarea generală *Quelle heure est-il ?*.'
  fr.a1.unit06.lesson03.teach.line01:
    title: Întreabă ora de începere de săptămâna viitoare
    gloss: Inès întreabă la ce oră este atelierul de săptămâna viitoare.
    note: '*La semaine prochaine* (săptămâna viitoare) se combină cu modelul de întrebare *à quelle heure* din această lecție.'
  fr.a1.unit06.lesson03.teach.line02:
    title: Spune ora de începere
    gloss: Mathieu spune că începe la optsprezece și treizeci (18:30), cred.
    note: '*Dix-huit heures trente* folosește sistemul de 24 de ore, frecvent în programele din franceză, diferit de formele informale cu *et demie*.'
  fr.a1.unit06.lesson03.teach.line03:
    title: Confirmă că este seara
    gloss: 'Inès verifică: seara, nu dimineața?'
    note: O scurtă întrebare de confirmare care opune *le soir* și *le matin*.
  fr.a1.unit06.lesson03.teach.line04:
    title: Confirmă și explică de ce
    gloss: Mathieu confirmă că e seara, mai comod după serviciu.
    note: '*Après le travail* (după serviciu) oferă un motiv practic, simplu.'
  fr.a1.unit06.lesson03.teach.line05:
    title: Întreabă ora de încheiere
    gloss: Inès întreabă la ce oră se termină.
    note: '*Finit* (se termină) se opune direct lui *commence* (începe) din replica a doua.'
  fr.a1.unit06.lesson03.teach.line06:
    title: Spune ora de încheiere
    gloss: Mathieu spune că se termină pe la douăzeci și cincisprezece (20:15), ca de obicei.
    note: '*Vers* (pe la, în jur de) indică o oră aproximativă, mai vagă decât un *à* precis.'
  fr.a1.unit06.lesson03.teach.line07:
    title: Confirmă planul
    gloss: 'Inès confirmă: ne vedem săptămâna viitoare, la optsprezece și treizeci!'
    note: Încheie discuția repetând ora stabilită, un mod firesc de a confirma un plan în franceză.
