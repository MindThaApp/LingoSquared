answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Franceză A1
  description: Vocabularul pieței, cum să ceri prețuri și cantități cu combien/kilo/litre și contrastul dintre du/de la și simplul de după expresiile de cantitate, continuând povestea atelierului de gătit al lui Inès și Mathieu într-un scenariu de cumpărături la piață. Se subliniază că franceza renunță complet la articolul partitiv după o cantitate explicită (un kilo de tomates, nu un kilo des tomates).
units:
  fr.a1.unit04.shopping:
    title: La cumpărături cu Inès
lessons:
  fr.a1.unit04.lesson01.au_marche:
    title: La piață
  fr.a1.unit04.lesson02.combien_ca_coute:
    title: Cât costă?
  fr.a1.unit04.lesson03.dialogue_marche:
    title: La piață cu Inès și Mathieu
teaching:
  fr.a1.unit04.lesson01.teach.marche:
    title: Piața
    gloss: piața
    note: '*Marché* este de genul masculin.'
    example_gloss: Piața este deschisă sâmbăta.
  fr.a1.unit04.lesson01.teach.boulangerie:
    title: Brutăria
    gloss: brutăria
    note: '*Boulangerie* este de genul feminin; este magazinul specializat în pâine, diferit de o *pâtisserie* (cofetărie).'
    example_gloss: Este o brutărie bună aici aproape.
  fr.a1.unit04.lesson01.teach.legumes:
    title: Legumele
    gloss: legume
    note: '*Légumes* este de genul masculin, la plural.'
    example_gloss: Cumpăr legume proaspete pentru atelier.
  fr.a1.unit04.lesson01.teach.fruits:
    title: Fructele
    gloss: fructe
    note: '*Fruits* este de genul masculin, la plural. Ca și în română, în franceză se folosește de obicei pluralul: *les fruits* (fructele).'
    example_gloss: Fructele sunt scumpe luna aceasta.
  fr.a1.unit04.lesson01.teach.prix:
    title: Prețul
    gloss: prețul
    note: '*Prix* este de genul masculin și invariabil: are aceeași formă la singular și la plural.'
    example_gloss: Cât costă pâinea?
  fr.a1.unit04.lesson01.teach.cher:
    title: Scump
    gloss: scump
    note: '*Cher* este forma de masculin; *chère* este de feminin, iar *chers*/*chères* sunt la plural, acordându-se cu substantivul descris.'
    example_gloss: Brânza aceasta este prea scumpă.
  fr.a1.unit04.lesson01.teach.pas_cher:
    title: Nu sunt scumpe azi
    gloss: Legumele nu sunt scumpe azi.
    note: '*Pas cher(s)* (fără *ne*) este modul obișnuit, din limba vorbită, de a spune că ceva nu e scump; forma completă, scrisă, este *ne sont pas chers*.'
  fr.a1.unit04.lesson02.teach.un_kilo_de:
    title: Un kilogram de
    gloss: un kilogram de
    note: '*De* urmează direct după cantitate, fără articol; vezi nota de gramatică *de după cantitate* de mai jos.'
    example_gloss: Aș dori un kilogram de roșii.
  fr.a1.unit04.lesson02.teach.un_litre_de:
    title: Un litru de
    gloss: un litru de
    note: '*Litre* este de genul masculin și se folosește pentru lichide, așa cum se folosește *kilo* pentru produsele solide.'
    example_gloss: Un litru de lapte, vă rog.
  fr.a1.unit04.lesson02.teach.euro:
    title: Un euro
    gloss: un euro
    note: '*Euro* face pluralul în mod regulat, cu -s: *deux euros*, *cinq euros*.'
    example_gloss: Costă cinci euro.
  fr.a1.unit04.lesson02.teach.de_after_quantity:
    title: De după o cantitate
    gloss: de
    note: 'După un cuvânt care exprimă o cantitate (*un kilo*, *un litre*, *beaucoup*, ca în *beaucoup de cousins*), franceza folosește simplu *de* și renunță complet la *du*/*de la*/*des*: *un kilo de tomates*, niciodată *un kilo des tomates*.'
  fr.a1.unit04.lesson02.teach.combien_ca_coute:
    title: Întreabă prețul
    gloss: Cât costă?
    note: '*Combien* (cât) împreună cu *ça coûte* (costă) este modul general de a întreba un preț.'
  fr.a1.unit04.lesson02.teach.cest_combien_pain:
    title: Întreabă prețul unui produs anume
    gloss: Cât costă pâinea?
    note: '*C''est combien, [item] ?* numește produsul anume al cărui preț îl întrebi; este o alternativă frecventă la *Combien ça coûte ?*.'
  fr.a1.unit04.lesson02.teach.ca_fait_combien:
    title: Cere totalul
    gloss: Cât face în total?
    note: '*Ça fait combien ?* cere suma totală, de obicei la finalul cumpărăturilor, nu prețul unui singur produs.'
  fr.a1.unit04.lesson03.teach.line01:
    title: Comandă roșii
    gloss: Inès salută vânzătorul și cere un kilogram de roșii.
    note: Îmbină *Bonjour* cu structura *je voudrais* + cantitate.
  fr.a1.unit04.lesson03.teach.line02:
    title: Întreabă dacă mai este nevoie de ceva
    gloss: Vânzătorul confirmă și o întreabă dacă mai dorește ceva.
    note: '*Autre chose ?* (altceva?) este întrebarea obișnuită a vânzătorului.'
  fr.a1.unit04.lesson03.teach.line03:
    title: Adaugă brânză și întreabă prețul
    gloss: Inès mai cere puțină brânză și întreabă cât costă.
    note: '*Un peu de fromage* (puțină brânză) folosește același *de* simplu ca *un kilo de*.'
  fr.a1.unit04.lesson03.teach.line04:
    title: Spune un preț pe kilogram
    gloss: Vânzătorul spune că brânza costă opt euro kilogramul.
    note: '*X euros le kilo* este modul firesc în franceză de a spune prețul unei unități; aici *le* are sensul „pe”, „la”, nu pe cel de articol hotărât.'
  fr.a1.unit04.lesson03.teach.line05:
    title: Explică de ce are nevoie de pâine aici
    gloss: Mathieu spune că vrea și el pâine, dar brutăria este închisă azi.
    note: '*Fermée* (închisă) este forma de feminin, acordată cu *la boulangerie*.'
  fr.a1.unit04.lesson03.teach.line06:
    title: Propune o alternativă
    gloss: 'Inès îl liniștește: se poate cumpăra pâine și aici.'
    note: '*On peut* (se poate / putem) + infinitiv este o modalitate informală frecventă de a exprima o posibilitate.'
  fr.a1.unit04.lesson03.teach.line07:
    title: Confirmă și spune totalul
    gloss: Vânzătorul confirmă că are pâine proaspătă, se gândește la total și spune treisprezece euro cincizeci.
    note: '*Ça fait combien en tout ?* este aici gândul cu voce tare al vânzătorului înainte de a spune totalul; nu o întreabă de fapt pe Inès.'
  fr.a1.unit04.lesson03.teach.line08:
    title: Mulțumește vânzătorului
    gloss: Inès îi mulțumește călduros în timp ce plătește.
    note: '*Voilà* însoțește aici gestul de a întinde banii; este un cuvânt care merge cu gestul.'
