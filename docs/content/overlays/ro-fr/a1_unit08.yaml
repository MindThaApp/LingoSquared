answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Franceză A1
  description: Zilele săptămânii și exprimarea datei calendaristice (le + număr cardinal + lună, cu le premier ca unică excepție ordinală), continuând povestea atelierului de gătit al Inèsei și al lui Mathieu cu planificarea ultimei ședințe. Ghidajul subliniază că în franceză datele folosesc peste tot numere cardinale (le quinze mars, nu „al cincisprezecelea mars”), cu excepția primei zile a lunii. În română, data se spune la fel cu numere cardinale (cincisprezece martie), iar prima zi are forma specială „întâi”.
