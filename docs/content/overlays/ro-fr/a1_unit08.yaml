teaching:
  fr.a1.unit08.lesson01.teach.lundi:
    title: luni
    gloss: luni
    note: Zilele săptămânii sunt de genul masculin în franceză și nu se scriu cu majusculă, la fel ca în română.
    example_gloss: Atelierul nu se întâlnește niciodată lunea.
  fr.a1.unit08.lesson01.teach.samedi:
    title: sâmbătă
    gloss: sâmbătă
    note: '*Le samedi* (cu articol) înseamnă „sâmbăta”, în mod obișnuit; *samedi* singur înseamnă o anumită sâmbătă, cea mai apropiată, viitoare sau trecută, în funcție de timpul verbului.'
    example_gloss: Atelierul se întâlnește sâmbăta.
  fr.a1.unit08.lesson01.teach.dimanche:
    title: duminică
    gloss: duminică
    note: 'Același tipar ca la celelalte zile: masculin, fără majusculă.'
    example_gloss: Brutăria este închisă duminica.
  fr.a1.unit08.lesson01.teach.aujourdhui:
    title: Astăzi
    gloss: astăzi
    note: '*Aujourd''hui* este un singur cuvânt invariabil, deși arată ca o îmbinare de mai multe părți.'
    example_gloss: Astăzi este sâmbătă.
  fr.a1.unit08.lesson01.teach.demain:
    title: Mâine
    gloss: mâine
    note: '*Demain* este invariabil și se folosește la fel în orice context.'
    example_gloss: Farmacia se deschide mâine.
  fr.a1.unit08.lesson01.teach.hier:
    title: Ieri
    gloss: ieri
    note: '*Hier* este opusul direct al lui *demain*.'
    example_gloss: Am mâncat pește ieri.
  fr.a1.unit08.lesson01.teach.quel_jour_sommes_nous:
    title: Întrebăm ziua
    gloss: Ce zi este?
    note: '*Quel jour sommes-nous ?* (literal „ce zi suntem”) este modul standard de a întreba ce zi a săptămânii este.'
  fr.a1.unit08.lesson02.teach.mars:
    title: martie
    gloss: martie
    note: Lunile, ca și zilele, sunt de genul masculin și nu se scriu cu majusculă în franceză, la fel ca în română.
    example_gloss: Atelierul se termină în martie.
  fr.a1.unit08.lesson02.teach.quelle_est_la_date:
    title: Întrebăm data
    gloss: Ce dată este azi?
    note: '*Quelle est la date... ?* este modul standard de a întreba data completă, spre deosebire de *Quel jour sommes-nous ?*, care întreabă doar ziua săptămânii.'
  fr.a1.unit08.lesson02.teach.cest_le_quinze_mars:
    title: Spune data
    gloss: Este cincisprezece martie.
    note: '*Le* + număr cardinal + lună este tiparul standard al datei în franceză, ca și în română: *quinze* (cincisprezece), nu un ordinal.'
  fr.a1.unit08.lesson02.teach.nous_sommes_le:
    title: Spunem data de astăzi
    gloss: Astăzi este cincisprezece martie.
    note: '*Nous sommes le...* este o alternativă la fel de frecventă ca *C''est le...* pentru a spune data de astăzi.'
  fr.a1.unit08.lesson02.teach.le_premier:
    title: Prima zi (a lunii)
    gloss: întâi
    note: '*Le premier* este SINGURA excepție de la regula numerelor cardinale: toate celelalte zile ale lunii folosesc un număr cardinal simplu (*le deux*, *le trois*...), dar prima zi folosește ordinalul *premier*.'
  fr.a1.unit08.lesson02.teach.le_vingt_deux:
    title: Spunem data de încheiere
    gloss: Atelierul se termină pe douăzeci și doi martie.
    note: '*Se termine* (se termină) este un verb reflexiv; *vingt-deux* este un simplu număr cardinal, după aceeași regulă ca în *le quinze mars*.'
  fr.a1.unit08.lesson03.teach.line01:
    title: Întrebăm când este ultima ședință
    gloss: Inès întreabă când este ultima ședință a atelierului.
    note: '*C''est quand... ?* („când este”) este un mod simplu și firesc de a întreba despre moment.'
  fr.a1.unit08.lesson03.teach.line02:
    title: Spunem data și ziua
    gloss: Mathieu spune că pe douăzeci și doi martie, crede el, într-o sâmbătă.
    note: '*Un samedi* (o sâmbătă, fără *le*) spune pur și simplu în ce zi a săptămânii cade data respectivă.'
  fr.a1.unit08.lesson03.teach.line03:
    title: Întreabă data de azi
    gloss: Inès întreabă care este data de astăzi.
    note: Aceeași *Quelle est la date aujourd'hui ?* pe care ai învățat-o pentru a întreba data.
  fr.a1.unit08.lesson03.teach.line04:
    title: Spunem data de astăzi și intervalul
    gloss: Mathieu spune că astăzi este cincisprezece martie, deci mai e o săptămână.
    note: '*Dans une semaine* („peste o săptămână”) exprimă o distanță în timp față de astăzi.'
  fr.a1.unit08.lesson03.teach.line05:
    title: Reacționăm cu un plan
    gloss: Inès spune că e perfect, are timp să pregătească un desert pentru ocazie.
    note: '*J''ai le temps de* + infinitiv („am timp să”) este un mod uzual de a spune că ai destul timp pentru ceva.'
  fr.a1.unit08.lesson03.teach.line06:
    title: Confirmăm planul
    gloss: Mathieu spune că e o idee bună, deci ne vedem sâmbăta viitoare, pe douăzeci și doi.
    note: '*Samedi prochain* („sâmbăta viitoare”) confirmă împreună numele zilei și data, încheind schimbul de replici.'
