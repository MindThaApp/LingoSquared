answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Franceză A1
  description: Locuri obișnuite din cartier și cum ceri sau dai indicații simple (en face de, à côté de, près de, loin de), continuând căutarea farmaciei de lângă atelier de către Mathieu. Aceste expresii de loc se termină toate în de, care se contractă în du/des înaintea unui substantiv masculin/plural (du café, des arbres), în loc să fie urmate direct de substantiv.
units:
  fr.a1.unit07.places:
    title: Unde este...?
