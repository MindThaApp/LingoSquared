teaching:
  fr.a1.unit07.lesson01.teach.gare:
    title: Gara
    gloss: gara
    note: '*Gare* este feminin.'
    example_gloss: Gara este mare.
  fr.a1.unit07.lesson01.teach.pharmacie:
    title: Farmacia
    gloss: farmacia
    note: '*Pharmacie* este feminin.'
    example_gloss: Farmacia se deschide la nouă.
  fr.a1.unit07.lesson01.teach.banque:
    title: Banca
    gloss: banca
    note: '*Banque* este feminin.'
    example_gloss: Banca este închisă duminica.
  fr.a1.unit07.lesson01.teach.ecole:
    title: Școala
    gloss: școala
    note: '*École* este feminin; *l''* se elidează înaintea sunetului vocalic.'
    example_gloss: Școala este lângă parc.
  fr.a1.unit07.lesson01.teach.cafe:
    title: Cafeneaua
    gloss: cafeneaua
    note: '*Café* este masculin; în alte contexte înseamnă și „cafea”.'
    example_gloss: Cafeneaua este deschisă toată ziua.
  fr.a1.unit07.lesson01.teach.poste:
    title: Poșta
    gloss: poșta
    note: '*Poste* (feminin) înseamnă aici „poșta”; *le poste* (masculin, alt sens) poate însemna „postul/slujba” – genul schimbă sensul.'
    example_gloss: Poșta se închide la șase.
  fr.a1.unit07.lesson01.teach.la_gare_est_grande:
    title: Compară două locuri
    gloss: Gara este mare, iar farmacia este mică.
    note: '*Grande* și *petite* se acordă aici cu substantive feminine (*la gare*, *la pharmacie*).'
  fr.a1.unit07.lesson02.teach.ou_est_la_gare:
    title: Întreabă unde se află un loc
    gloss: Unde este gara, vă rog?
    note: '*Où est... ?* este modalitatea standard, de uz general, de a întreba unde se află un loc.'
  fr.a1.unit07.lesson02.teach.en_face_de:
    title: Spune că ceva este vizavi de
    gloss: Banca este vizavi de gară.
    note: '*En face de* (vizavi de) se termină în *de*, urmat de locul de referință: *en face de la banque*. Înaintea unui substantiv masculin se contractă: *en face du café*.'
  fr.a1.unit07.lesson02.teach.a_cote_de:
    title: Spune că ceva este lângă
    gloss: Farmacia este lângă bancă.
    note: '*À côté de* (lângă) urmează același tipar cu *de* ca *en face de*.'
  fr.a1.unit07.lesson02.teach.pres_de:
    title: Spune că ceva este aproape
    gloss: Școala este aproape de aici.
    note: '*Près de* (aproape de) devine *près d''* înaintea unui sunet vocalic, ca în *près d''ici* (aproape de aici).'
  fr.a1.unit07.lesson02.teach.loin_de:
    title: Spune că ceva este departe
    gloss: Poșta este departe de aici.
    note: '*Loin de* (departe de) este opusul direct al lui *près de*.'
  fr.a1.unit07.lesson02.teach.cest_loin:
    title: Întreabă dacă ceva este departe
    gloss: Este departe de aici? — Nu, nu este departe.
    note: '*C''est loin d''ici ?* este întrebarea firească de după ce ai aflat direcția. Pentru a răspunde negativ, pune *ne... pas* în jurul verbului: *ce n''est pas loin* (nu este departe).'
  fr.a1.unit07.lesson03.teach.line01:
    title: Cere indicații de la un necunoscut
    gloss: Mathieu întreabă politicos un trecător unde este farmacia.
    note: '*Excusez-moi* (scuzați-mă) este formula politicoasă standard când abordezi un necunoscut, împreună cu *vous*.'
  fr.a1.unit07.lesson03.teach.line02:
    title: Spune unde se află
    gloss: Ea spune că este vizavi de bancă, lângă cafenea.
    note: Combină *en face de* și *à côté de* într-o singură propoziție pentru a da o locație precisă. *De* + *le café* se contractă în *du café*.
  fr.a1.unit07.lesson03.teach.line03:
    title: Întreabă dacă este departe
    gloss: Mathieu întreabă dacă este departe de aici.
    note: Același *C'est loin d'ici ?* pe care l-ai învățat pentru a întreba despre distanță.
  fr.a1.unit07.lesson03.teach.line04:
    title: Asigură-l că este aproape
    gloss: Ea spune că nu, este foarte aproape – cinci minute pe jos.
    note: '*À pied* (pe jos) este modalitatea standard de a arăta că mergi pe jos.'
  fr.a1.unit07.lesson03.teach.line05:
    title: Mulțumește-i
    gloss: Mathieu îi mulțumește călduros.
    note: '*Merci beaucoup* întărește *merci*, pe care îl știi deja din unitățile anterioare.'
  fr.a1.unit07.lesson03.teach.line06:
    title: Răspunde la mulțumiri
    gloss: 'Ea răspunde: cu plăcere.'
    note: '*Je vous en prie* este un „cu plăcere” mai formal, potrivit registrului *vous* folosit cu un necunoscut; *De rien* este o variantă mai puțin formală, de zi cu zi.'
