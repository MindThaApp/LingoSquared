teaching:
  fr.a1.unit46.lesson01.teach.l_appartement_le:
    title: Apartament, living, dormitor
    gloss: apartamentul, livingul, dormitorul
    note: '*L''appartement* este masculin și îl pierde pe *e* din *le*; *le salon* este masculin, iar *la chambre* este feminin.'
    example_gloss:
    - Am un apartament.
    - Am un living.
    - Am un dormitor.
  fr.a1.unit46.lesson01.teach.la_cuisine_la:
    title: Bucătărie, baie
    gloss: bucătăria, baia
    note: '*La cuisine* și *la salle de bains* sunt ambele feminine.'
    example_gloss:
    - Am o bucătărie.
    - Am o baie.
  fr.a1.unit46.lesson01.teach.j_ai_un:
    title: Să spui că ai un apartament
    gloss: Am un apartament.
    note: '*Avoir* (a avea) este verbul firesc pentru a spune ce locuință ai, la fel ca „a avea” în română. Este un exemplu general; apartamentul lui Mathieu (din Lyon) apare mai târziu în această unitate.'
  fr.a1.unit46.lesson01.teach.j_ai_un_2:
    title: Enumerarea tuturor camerelor
    gloss: Am un living, un dormitor, o bucătărie și o baie.
    note: Enumeră într-o singură propoziție cele patru camere din vocabularul lecției, separate prin virgule, cu *et* înaintea ultimei.
  fr.a1.unit46.lesson02.teach.tu_as_combien:
    title: Să întrebi câte camere are cineva
    gloss: Câte camere ai?
    note: 'După *combien de* (câte) urmează un substantiv la plural: *combien de pièces*.'
  fr.a1.unit46.lesson02.teach.j_ai_deux:
    title: Să spui numărul de dormitoare
    gloss: Am două dormitoare.
    note: '*Chambres* este pluralul lui *chambre*, format regulat cu un *-s* final care nu se pronunță.'
  fr.a1.unit46.lesson02.teach.l_appartement_a:
    title: Să spui numărul total de camere
    gloss: Apartamentul are trei camere.
    note: '*Pièces* este un cuvânt general pentru camere, nu doar pentru dormitoare.'
  fr.a1.unit46.lesson03.teach.le_balcon_le:
    title: Balcon, grădină
    gloss: balconul, grădina
    note: '*Le balcon* și *le jardin* sunt ambele de genul masculin.'
    example_gloss:
    - Este un balcon.
    - Nu există grădină.
  fr.a1.unit46.lesson03.teach.il_y_a:
    title: Să spui că ceva există
    gloss: Este un balcon.
    note: '*Il y a* este construcția obișnuită pentru a spune că ceva există, ca „există” sau „este” în română.'
  fr.a1.unit46.lesson03.teach.il_n_y:
    title: Să spui că ceva nu există
    gloss: Nu există grădină.
    note: '*Pas de* neagă un substantiv nedefinit: *pas de jardin*, nu *pas un jardin*.'
  fr.a1.unit46.lesson04.teach.cosy:
    title: Confortabil și primitor
    gloss: primitor
    note: Un adjectiv francez foarte frecvent și caracteristic pentru o atmosferă caldă și plăcută; nu are un echivalent exact într-un singur cuvânt românesc.
    example_gloss: Apartamentul este mic, dar primitor.
  fr.a1.unit46.lesson04.teach.l_appartement_est:
    title: Un tipar frecvent de descriere
    gloss: Apartamentul este mic, dar primitor.
    note: '*Petit mais cosy* este o formulă foarte firească prin care francezii descriu pozitiv o locuință mică.'
  fr.a1.unit46.lesson04.teach.le_salon_est:
    title: Descrierea dimensiunii unei camere
    gloss: Livingul este mare.
    note: '*Grand* descrie o anumită cameră, nu întreaga locuință; se acordă cu *le salon*, care este masculin.'
  fr.a1.unit46.lesson04.teach.la_cuisine_est:
    title: Descrierea dimensiunii altei camere
    gloss: Bucătăria este mică.
    note: 'Același tipar ca *grand* de pe cartonașul anterior, cu altă cameră: *la cuisine* este feminin, deci *petite*.'
  fr.a1.unit46.lesson05.teach.appartement_a_lyon:
    title: Citește un anunț imobiliar
    gloss: 'Apartament în Lyon: un dormitor, un living, o bucătărie și o baie. Este un balcon, dar nu există grădină. Apartamentul este mic, dar primitor.'
    note: Urmărește numărul de camere, ce dotări există sau lipsesc și impresia generală.
    glosses:
      Appartement: apartament
      chambre: dormitor
      salon: sufragerie
      cuisine: bucătărie
      bains: baie
      balcon: balcon
      jardin: grădină
      petit: mic
      cosy: primitor
  fr.a1.unit46.lesson06.teach.camille_salut_mathieu:
    title: Camille întreabă despre apartament
    gloss: 'Camille: Salut, Mathieu, cum este noul tău apartament din Lyon?'
    note: '*Nouvel* este forma lui *nouveau* (nou) folosită înaintea unui substantiv masculin care începe cu vocală: *un nouvel appartement*.'
  fr.a1.unit46.lesson06.teach.mathieu_il_est:
    title: Mathieu îl descrie
    gloss: 'Mathieu: Este mic, dar primitor. Am un dormitor, un living, o bucătărie și o baie.'
    note: Se potrivește exact cu anunțul imobiliar citit anterior; acesta este apartamentul real al lui Mathieu.
  fr.a1.unit46.lesson06.teach.camille_tu_as:
    title: Camille întreabă despre balcon
    gloss: 'Camille: Ai balcon?'
    note: O întrebare directă cu răspuns da/nu, cu *Tu as ... ?*
  fr.a1.unit46.lesson06.teach.mathieu_oui_j:
    title: Mathieu răspunde
    gloss: 'Mathieu: Da, am balcon, dar nu am grădină.'
    note: 'Se potrivește cu informația din anunț: balcon, dar fără grădină.'
  fr.a1.unit46.lesson06.teach.balcon_est_masculin:
    title: Genul cuvântului balcon
    gloss: '*Balcon* este masculin: un balcon, el este mic.'
    note: '*Il* (el) înlocuiește un substantiv masculin precum *balcon*, deci și adjectivul este la masculin: *il est petit*.'
  fr.a1.unit46.lesson06.teach.camille_ca_a:
    title: Camille reacționează călduros
    gloss: 'Camille: Pare drăguț! Trec pe la tine în curând.'
    note: '*Je passerai te voir* (trec pe la tine) folosește viitorul *passerai* plus *te voir*, „să te văd”.'
  fr.a1.unit46.lesson06.teach.mathieu_super_tu:
    title: Mathieu o primește cu drag
    gloss: 'Mathieu: Super, ești oricând binevenită.'
    note: '*Toujours la bienvenue* (oricând binevenită) este o formulă caldă de invitare; *bienvenue* este la feminin, deoarece se referă la Camille.'
