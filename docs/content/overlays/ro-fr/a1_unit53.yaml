  fr.a1.unit53.lesson06.mathieu_reconnait_nina:
    title: Mathieu o recunoaște pe Nina
teaching:
  fr.a1.unit53.lesson01.teach.grand_petit:
    title: Înalt și scund
    gloss: înalt / scund
    note: '*Grand* descrie o persoană înaltă, iar *petit* una scundă. Se acordă cu persoana: *grand/grande*, *petit/petite*.'
    example_gloss:
    - Léa este înaltă.
    - Thomas este scund.
  fr.a1.unit53.lesson01.teach.vieux_jeune:
    title: Bătrân și tânăr
    gloss: bătrân / tânăr
    note: Aici, *vieux* și *jeune* dau o impresie generală despre vârstă, nu un număr exact de ani.
    example_gloss:
    - Bunicul este bătrân.
    - Mathieu este tânăr.
  fr.a1.unit53.lesson01.teach.pour_un_age:
    title: 'Vârsta: un număr sau o impresie'
    gloss: Pentru vârsta exactă, franceza folosește *avoir* (*Il a vingt ans*), dar *être vieux* dă o impresie generală (*Mon grand-père est vieux*). Ca în română, vârsta exactă se spune cu „a avea”, iar impresia generală cu „a fi”.
    note: Cunoști deja *Quel âge as-tu ?* pentru vârsta exactă. Aici, *vieux* descrie cât de bătrân ARATĂ cineva, fără niciun număr.
  fr.a1.unit53.lesson01.teach.lea_est_grande:
    title: Léa este înaltă și Thomas este scund
    gloss: Léa este înaltă și Thomas este scund.
    note: O propoziție simplă cu *et* (și), care pregătește comparația directă din lecția 5.
  fr.a1.unit53.lesson02.teach.les_cheveux:
    title: Părul
    gloss: părul
    note: '*Les cheveux* este întotdeauna la plural și masculin, în timp ce în română „părul” este la singular.'
    example_gloss: Mathieu are părul scurt și negru.
  fr.a1.unit53.lesson02.teach.blonds_bruns_gris:
    title: Blond, șaten și cărunt
    gloss: blond / șaten / cărunt
    note: 'Trei culori de păr. Cu *cheveux*, culoarea primește un *s* de plural: *blonds*, *bruns*. *Gris* se termină deja în *s*, iar *noirs* (negru) este reluat din unitatea despre haine.'
    example_gloss:
    - Camille are părul blond.
    - Thomas are părul șaten.
    - Bunicul are părul cărunt.
  fr.a1.unit53.lesson02.teach.longs_courts:
    title: Lung și scurt (părul)
    gloss: lung / scurt (părul)
    note: '*Longs* (lung) reia ideea de înălțime din lecția 1, acum pentru lungimea părului. *Courts* (scurt) este nou aici, iar ambele primesc un *s* de plural cu *cheveux*.'
    example_gloss:
    - Léa are părul lung.
    - Thomas are părul scurt.
  fr.a1.unit53.lesson02.teach.cheveux_est_toujours:
    title: Cheveux cere adjectivul la plural
    gloss: '*Cheveux* este mereu la plural, deci adjectivul primește un *s*: *longs*, *courts*, *blonds*, *bruns*, *noirs*. *Gris* se termină deja în *s*.'
    note: 'Culorile și lungimile se acordă cu *cheveux* la plural: *les cheveux longs*. Compară cu *yeux* din lecția 3, unde *marron* nu se schimbă.'
  fr.a1.unit53.lesson02.teach.ses_est_le:
    title: 'Ses: al lui sau al ei'
    gloss: '*Ses* înseamnă „lui” sau „ei” înaintea unui substantiv la plural: *ses cheveux*, *ses yeux*. Se acordă cu lucrul posedat, nu cu posesorul.'
    note: 'Franceza nu are aici cuvinte separate pentru „al lui” și „al ei”: *ses yeux* poate însemna „ochii lui” sau „ochii ei”, iar contextul îți spune care.'
  fr.a1.unit53.lesson02.teach.mathieu_a_les:
    title: Mathieu are părul scurt și negru
    gloss: Mathieu are părul scurt și negru.
    note: Reia *noirs* (negru) din unitatea despre haine.
  fr.a1.unit53.lesson02.teach.camille_a_les:
    title: Camille are părul lung și blond
    gloss: Camille are părul lung și blond.
    note: Combină într-o propoziție naturală vocabularul lecției despre lungime și culoare.
  fr.a1.unit53.lesson03.teach.les_yeux:
    title: Ochii
    gloss: ochii
    note: '*Les yeux* este pluralul lui *l''œil* (ochiul); *yeux* se termină în *x*, nu în *s*.'
    example_gloss: Mathieu are ochii căprui.
  fr.a1.unit53.lesson03.teach.bleus_marron_verts:
    title: Albastru, căprui și verde
    gloss: albastru / căprui / verde
    note: '*Bleus* (albastru) a fost învățat mai devreme pentru haine; *marron* (căprui) nu se schimbă niciodată; *verts* (verde) este nou.'
    example_gloss:
    - Camille are ochii albaștri.
    - Thomas are ochii căprui.
    - Léa are ochii verzi.
  fr.a1.unit53.lesson03.teach.avec_yeux_pluriel:
    title: Yeux primește -s, marron rămâne la fel
    gloss: 'Cu *yeux* (plural), adjectivul primește un *s*: *yeux bleus*, *yeux verts*. *Marron* nu se schimbă niciodată: *yeux marron*.'
    note: 'Compară cu *cheveux* din lecția 2: un substantiv la plural cere un adjectiv la plural, cu excepția culorilor ca *marron*, împrumutate de la un substantiv.'
  fr.a1.unit53.lesson03.teach.comment_est_camille:
    title: Cum arată Camille?
    gloss: Cum arată Camille?
    note: '*Comment est ... ?* este întrebarea de bază a acestei unități; folosește-o pentru a întreba despre aspectul oricui.'
  fr.a1.unit53.lesson03.teach.camille_a_les:
    title: Camille are părul lung și blond și ochii albaștri
    gloss: Camille are părul lung și blond și ochii albaștri.
    note: Un răspuns model care combină părul și ochii într-o singură propoziție cu *et*.
  fr.a1.unit53.lesson04.teach.camille_une_nouvelle:
    title: Camille o prezintă pe Nina
    gloss: 'Camille: O fată nouă vine la cafeneaua de limbi. O cheamă Nina.'
    note: '*Une nouvelle fille vient* introduce o persoană nouă în scenă; *vient* vine de la *venir* (a veni).'
  fr.a1.unit53.lesson04.teach.mathieu_d_accord:
    title: Mathieu întreabă cum arată ea
    gloss: 'Mathieu: Bine! Cum arată?'
    note: 'Reia întrebarea de bază cu *elle* (ea) în loc de un nume: *Comment est-elle ?* Cratima leagă verbul de pronume.'
  fr.a1.unit53.lesson04.teach.camille_elle_est:
    title: Camille descrie înălțimea și părul Ninei
    gloss: 'Camille: Este scundă și are părul scurt și blond.'
    note: Combină *petite* din lecția 1 cu vocabularul despre păr din lecția 2; *petite* primește un *e* pentru o fată.
  fr.a1.unit53.lesson04.teach.mathieu_et_ses:
    title: Mathieu întreabă despre ochii ei
    gloss: 'Mathieu: Și ochii ei?'
    note: '*Ses yeux* înseamnă aici „ochii ei”: *ses* se acordă cu *yeux*, nu cu fata.'
  fr.a1.unit53.lesson04.teach.camille_elle_a:
    title: Camille descrie ochii Ninei
    gloss: 'Camille: Are ochii verzi.'
    note: Reia *yeux verts* din lecția 3.
  fr.a1.unit53.lesson04.teach.mathieu_merci_alors:
    title: Mathieu o va recunoaște
    gloss: 'Mathieu: Mulțumesc! Atunci o s-o recunosc.'
    note: '*Je vais la reconnaître* folosește *aller* + infinitiv pentru viitorul apropiat, iar *la* înseamnă „o” (pe ea).'
  fr.a1.unit53.lesson05.teach.thomas_et_lea:
    title: Comparație între Thomas și Léa
    gloss: 'Thomas și Léa sunt frate și soră, dar nu seamănă: sunt foarte diferiți. Thomas este scund, are părul scurt și șaten și ochii căprui. Léa este mai înaltă decât Thomas, are părul lung și șaten și ochii verzi. Și tu, cum arăți?'
    note: O scurtă comparație care reia toate cuvintele pentru culori și lungime învățate până acum și se încheie cu întrebarea centrală a unității, adresată cititorului.
    glosses:
      frère: frate
      sœur: soră
      ressemblent: a arăta
      différents: diferit
      petit: scund
      courts: scund
      bruns: castaniu
      cheveux: păr
      marron: castaniu
      yeux: ochi
      grande: mai înalt
      longs: lung
      verts: verde
      se: (parte din „se ressemblent” = seamănă)
  fr.a1.unit53.lesson05.teach.tu_connais_deja:
    title: Plus ... que cu persoane
    gloss: 'Cunoști deja structura *plus* + adjectiv + *que*. Aici o folosești pentru persoane: Léa este mai înaltă decât Thomas.'
    note: Aceeași structură *plus ... que* din unitatea despre cumpărături, aplicată acum persoanelor, nu obiectelor. *Grande* se acordă cu *Léa*, care este de parte feminină.
  fr.a1.unit53.lesson05.teach.lea_a_les:
    title: Léa are părul mai lung decât Thomas
    gloss: Léa are părul mai lung decât Thomas.
    note: '*Plus longs que* se acordă cu *cheveux* (plural): *les cheveux plus longs que Thomas*.'
  fr.a1.unit53.lesson05.teach.j_ai_les:
    title: Am părul scurt și castaniu
    gloss: Am părul scurt și castaniu.
    note: O propoziție model la persoana I cu *J'ai ...*, bună de refolosit când îți descrii propriul aspect.
  fr.a1.unit53.lesson06.teach.mathieu_regarde_c:
    title: Mathieu o zărește pe Nina
    gloss: 'Mathieu: Uite, aceea e Nina? Are părul scurt și blond și ochii verzi.'
    note: '*Regarde* (uită-te) este imperativul cu *tu* de la *regarder*, folosit la fel într-un dialog anterior.'
  fr.a1.unit53.lesson06.teach.camille_oui_c:
    title: Camille confirmă
    gloss: 'Camille: Da, e Nina!'
    note: O confirmare scurtă și naturală.
  fr.a1.unit53.lesson06.teach.nina_salut_tu:
    title: Nina îl salută pe Mathieu
    gloss: 'Nina: Salut, tu ești Mathieu?'
    note: 'O întrebare simplă de salut informal: *Tu es ... ?*'
  fr.a1.unit53.lesson06.teach.mathieu_oui_ravi:
    title: Mathieu o salută la rândul lui pe Nina
    gloss: 'Mathieu: Da! Încântat să te cunosc, Nina.'
    note: '*Ravi de te rencontrer* este formula obișnuită pentru o primă întâlnire reală (*ravi* pentru un bărbat, *ravie* pentru o femeie), nu *content de te revoir*, care se folosește pentru cineva pe care îl cunoști deja.'
  fr.a1.unit53.lesson06.teach.nina_ravie_de:
    title: Nina răspunde la salut
    gloss: 'Nina: Și mie îmi pare bine!'
    note: 'Încheie dialogul: Mathieu a recunoscut-o pe Nina după descrierea lui Camille.'
