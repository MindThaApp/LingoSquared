teaching:
  fr.a1.unit43.lesson01.teach.le_billet:
    title: Biletul de intrare
    gloss: biletul de intrare
    note: '*Billet* este de genul masculin: *le billet*, *un billet*.'
    example_gloss: Aș dori un bilet pentru Lyon.
  fr.a1.unit43.lesson01.teach.je_voudrais_un:
    title: Cum ceri un bilet
    gloss: Aș dori un bilet pentru Lyon.
    note: '*Je voudrais* atenuează cererea; este mai politicos decât *je veux*.'
  fr.a1.unit43.lesson01.teach.voulez_vous_un:
    title: Casierul întreabă ce fel de bilet
    gloss: Doriți un bilet dus sau dus-întors?
    note: '*Voulez-vous* este forma de politețe cu *vous* a verbului *vouloir*, folosită aici pentru un angajat necunoscut de la gară.'
  fr.a1.unit43.lesson01.teach.un_aller_retour:
    title: Cum răspunzi politicos
    gloss: Dus-întors, vă rog.
    note: '*S''il vous plaît* este „vă rog” de politețe, potrivit cu registrul *vous* al schimbului de replici.'
  fr.a1.unit43.lesson01.teach.au_guichet_on:
    title: Registrul la ghișeu
    gloss: La ghișeu se folosește de obicei forma de politețe *vous*.
    note: Persoanelor necunoscute care îți oferă un serviciu li te adresezi cu *vous*; prietenilor și familiei cu *tu*.
  fr.a1.unit43.lesson02.teach.le_quai:
    title: Peronul
    gloss: peronul
    note: '*Quai* este de genul masculin: *le quai*.'
    example_gloss: De la ce peron pleacă trenul spre Lyon?
  fr.a1.unit43.lesson02.teach.de_quel_quai:
    title: Cum întrebi de peron
    gloss: De la ce peron pleacă trenul spre Lyon?
    note: '*De quel quai* întreabă anume despre peron; *quel* se acordă cu substantivul masculin *quai*.'
  fr.a1.unit43.lesson02.teach.le_train_part:
    title: Cum spui detaliile plecării
    gloss: Trenul pleacă la zece fără un sfert de la peronul cinci.
    note: '*Dix heures moins le quart* înseamnă zece fără un sfert: franceza spune *moins* („fără”) pentru orele dinaintea orei fixe, ca și româna.'
  fr.a1.unit43.lesson02.teach.a_quelle_heure:
    title: Cum întrebi ora sosirii
    gloss: La ce oră ajunge trenul?
    note: '*À quelle heure arrive ... ?* întreabă ora; *arriver* este un verb regulat în *-er*: *le train arrive*.'
  fr.a1.unit43.lesson02.teach.le_train_arrive:
    title: Cum spui ora sosirii
    gloss: Trenul ajunge la ora unsprezece.
    note: '*Arrive* este forma de *il/elle* a verbului *arriver*; verbele în *-er* se termină în *-e* la *il* și *elle*.'
  fr.a1.unit43.lesson03.teach.a_l_heure:
    title: La timp / întârzierea
    gloss: la timp; întârzierea
    note: '*À l''heure* este o expresie fixă pentru ceva care se întâmplă la timp. *Le retard* (întârzierea) este de genul masculin.'
    example_gloss:
    - Trenul nu pleacă la timp.
    - 'Atenție: trenul spre Lyon are întârziere.'
  fr.a1.unit43.lesson03.teach.attention_le_train:
    title: Un anunț
    gloss: 'Atenție: trenul spre Lyon are întârziere.'
    note: '*Attention* deschide un anunț din gară, ca „Atenție, stimați călători”.'
  fr.a1.unit43.lesson03.teach.le_train_ne:
    title: Cum negi „la timp”
    gloss: Trenul nu pleacă la timp.
    note: '*Ne ... pas* înconjoară verbul: *ne part pas à l''heure*.'
  fr.a1.unit43.lesson03.teach.le_train_part:
    title: O schimbare de peron
    gloss: Trenul pleacă de la peronul trei, în loc de peronul cinci.
    note: '*Au lieu du* înseamnă „în loc de”; *de* + *le* se contractă în *du*.'
  fr.a1.unit43.lesson03.teach.le_train_a:
    title: Cum spui cât este întârzierea
    gloss: Trenul are zece minute de întârziere.
    note: '*A ... de retard* (literal „are ... de întârziere”) este modul natural de a spune că ceva întârzie; folosește *avoir*.'
  fr.a1.unit43.lesson04.teach.l_entree_la:
    title: Intrarea, ieșirea, sala de așteptare
    gloss: intrarea; ieșirea; sala de așteptare
    note: '*L''entrée* pierde *e* în fața unei vocale și devine *l''*; *la sortie* și *la salle d''attente* sunt de genul feminin.'
    example_gloss:
    - Unde este intrarea?
    - Unde este ieșirea?
    - Unde este sala de așteptare?
  fr.a1.unit43.lesson04.teach.ou_est_le:
    title: Cum întrebi unde este un peron
    gloss: Unde este peronul șapte?
    note: '*Où est ... ?* întreabă unde se află ceva; *le quai sept* este de genul masculin.'
  fr.a1.unit43.lesson04.teach.tout_droit_puis:
    title: Cum dai indicații
    gloss: Drept înainte și apoi la dreapta.
    note: '*Tout droit* și *à droite* sunt cuvinte pentru direcții; *à* se pune înaintea lui *droite*.'
  fr.a1.unit43.lesson04.teach.ou_est_la:
    title: Cum întrebi de sala de așteptare
    gloss: Unde este sala de așteptare?
    note: Același model de întrebare, aplicat unui loc nou.
  fr.a1.unit43.lesson05.teach.billet_paris_gare:
    title: Citește un bilet tipărit
    gloss: 'Bilet: Paris Gare de Lyon – Lyon Part-Dieu. Plecare: zece și zece, peronul șapte. Sosire: unsprezece fără zece. Dus-întors. Preț: doisprezece euro patruzeci.'
    note: Urmărește ora și peronul de plecare, ora sosirii, tipul biletului și prețul.
    glosses:
      Billet: bilet
      Départ: plecare
      dix: zece
      quai: peron
      sept: șapte
      Arrivée: sosire
      onze: unsprezece
      Aller-retour: bilet dus-întors
      Prix: preț
      douze: doisprezece
      euros: euro
      quarante: patruzeci
  fr.a1.unit43.lesson06.teach.mathieu_on_doit:
    title: Mathieu spune planul
    gloss: 'Mathieu: Trebuie să ajungem la peronul șapte. Trenul pleacă la zece și zece.'
    note: '*On doit* (de la *devoir*) exprimă aici o nevoie practică, nu o obligație strictă.'
  fr.a1.unit43.lesson06.teach.camille_regarde_voila:
    title: Camille citește panoul
    gloss: 'Camille: Uite panoul: întârziere, zece minute.'
    note: '*Voilà* arată ce se află acolo: *voilà le panneau*.'
  fr.a1.unit43.lesson06.teach.mathieu_pas_de:
    title: Mathieu rămâne calm
    gloss: 'Mathieu: Nicio problemă, mai avem timp să bem o cafea.'
    note: '*Pas de problème* este o formulă obișnuită, informală, de liniștire.'
  fr.a1.unit43.lesson06.teach.camille_bonne_idee:
    title: Sosește trenul
    gloss: 'Camille: Bună idee. Ah, uite că a venit deja trenul. Peronul șapte, exact!'
    note: '*Déjà* („deja”) arată că trenul a sosit mai devreme decât se aștepta, având în vedere întârzierea tocmai anunțată.'
  fr.a1.unit43.lesson06.teach.mathieu_allez_on:
    title: Se urcă în tren
    gloss: 'Mathieu: Hai, urcăm. Lyon, ajungem!'
    note: '*On* este un *noi* de zi cu zi, folosit cu forma verbului de la persoana a treia singular, ca după *il*: *on monte*. *On arrive !* este felul natural de a spune „venim!”; o traducere cuvânt cu cuvânt ar suna ciudat.'
