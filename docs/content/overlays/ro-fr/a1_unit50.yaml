teaching:
  fr.a1.unit50.lesson01.teach.appeler:
    title: A suna
    gloss: a suna
    note: Infinitivul verbului folosit pentru a da un telefon.
    example_gloss: Trebuie să te sun.
  fr.a1.unit50.lesson01.teach.je_t_appelle:
    title: Spui că suni
    gloss: Te sun.
    note: '*Appelle* este forma pentru *je* a verbului *appeler*; aici franceza folosește prezentul, la fel ca româna în „te sun”.'
  fr.a1.unit50.lesson01.teach.allo_c_est:
    title: Răspunsul la telefon
    gloss: Alo, sunt Camille.
    note: '*C''est* + nume este modul standard de a te prezenta la telefon în franceză; româna spune „sunt...”.'
  fr.a1.unit50.lesson01.teach.allo_c_est_2:
    title: Mathieu răspunde la fel
    gloss: Alo, sunt Mathieu.
    note: Aceeași structură *c'est* + nume ca în *Allô, c'est Camille*.
  fr.a1.unit50.lesson02.teach.qui_est_a:
    title: Întrebi cine sună
    gloss: Cu cine vorbesc?
    note: '*Qui est à l''appareil ?* este modul standard de a întreba cine este un apelant necunoscut.'
  fr.a1.unit50.lesson02.teach.vous_parlez_avec:
    title: Te prezinți formal
    gloss: Vorbiți cu Camille.
    note: '*Vous parlez avec* + nume este corespondentul formal al lui *c''est* + nume.'
  fr.a1.unit50.lesson03.teach.tu_peux_repeter:
    title: Ceri să repete
    gloss: Poți repeta asta?
    note: '*Tu peux ...* (Poți ...?) plus infinitivul *répéter* (a repeta).'
  fr.a1.unit50.lesson03.teach.ne_parle_pas:
    title: Ceri cuiva să vorbească mai rar
    gloss: Nu vorbi atât de repede, te rog.
    note: '*Ne parle pas si vite* este o propoziție negativă: *ne ... pas* încadrează verbul *parle*, iar *si* înseamnă „atât de”.'
  fr.a1.unit50.lesson03.teach.je_ne_t:
    title: Spui că nu auzi bine
    gloss: Nu te aud bine.
    note: '*Entendre* (a auzi) cu *ne ... pas bien* arată o problemă de auz, diferită de *comprendre* (a înțelege).'
  fr.a1.unit50.lesson04.teach.le_sms:
    title: Mesajul text
    gloss: mesajul text
    note: '*SMS* este masculin: *un SMS*, împrumutat direct din abrevierea internațională.'
    example_gloss: SMS-ul este de la Camille.
  fr.a1.unit50.lesson04.teach.je_t_envoie:
    title: Cum spui că trimiți un mesaj
    gloss: Îți trimit un mesaj.
    note: '*Envoyer* (a trimite) cere pronumele *te* (aici *t''*) înaintea verbului, apoi *un SMS*.'
  fr.a1.unit50.lesson04.teach.je_te_rappelle:
    title: Cum spui că suni înapoi
    gloss: Te sun mai târziu.
    note: '*Rappeler* (a suna înapoi) conține deja ideea de „înapoi” în *re-*; *plus tard* înseamnă „mai târziu”.'
  fr.a1.unit50.lesson05.teach.mathieu_salut_camille:
    title: Citește o conversație prin mesaje
    gloss: 'Mathieu: Salut, Camille, poți să mă suni? Trebuie să-ți spun ceva. Camille: Da, desigur, te sun înapoi în cinci minute.'
    note: Urmărește ce îi cere Mathieu, de ce și când spune Camille că îl va suna înapoi.
    glosses:
      Salut: salut
      peux: a putea
      m'appeler: a suna
      dois: a trebui / a fi nevoit să
      truc: în timpul
      dire: a povesti / a spune
      évidemment: sigur / desigur
      rappelle: înapoi
      cinq: cinci
      minutes: minute
  fr.a1.unit50.lesson06.teach.mathieu_allo_c:
    title: Mathieu răspunde la telefon
    gloss: 'Mathieu: Alo, sunt Mathieu.'
    note: 'Același tipar *c''est* + nume din lecția 1, folosit acum într-o convorbire telefonică reală: cel care răspunde vorbește primul și își spune numele.'
  fr.a1.unit50.lesson06.teach.camille_salut_mathieu:
    title: Camille se prezintă
    gloss: 'Camille: Salut, Mathieu, sunt Camille. Mathieu: Drăguț că mă suni!'
    note: '*C''est sympa que* ... (drăguț că ...) exprimă o reacție pozitivă la un eveniment; *appelles* este o formă specială pe care o poți memora pur și simplu aici.'
  fr.a1.unit50.lesson06.teach.camille_comment_s:
    title: Camille întreabă despre tură
    gloss: 'Camille: Cum a decurs prima ta tură?'
    note: '*Comment s''est passé ... ?* folosește passé composé al verbului *se passer* (a se întâmpla, a decurge), format cu *être*, pentru a întreba cum a decurs ceva.'
  fr.a1.unit50.lesson06.teach.mathieu_ca_s:
    title: Mathieu dă o veste bună
    gloss: 'Mathieu: A mers foarte bine, mai bine decât credeam.'
    note: '*Ça s''est très bien passé* și *je pensais* sunt expresii fixe aici; *je pensais* este imperfectul verbului *penser* (a gândi, a crede).'
  fr.a1.unit50.lesson06.teach.au_passe_compose:
    title: Passé composé cu avoir și être
    gloss: s'est passé → a se întâmpla, j'ai pensé → a gândi, je suis allé → a merge
    note: 'Passé composé se formează cu *avoir* sau *être* + un participiu: *j''ai pensé*, *je suis allé*. *Ça s''est passé* este o expresie fixă pentru „a decurs”; deocamdată, memoreaz-o în contextele în care apare în această lecție.'
  fr.a1.unit50.lesson06.teach.camille_ca_fait:
    title: Camille este mândră
    gloss: 'Camille: Mă bucur să aud asta! Sunt mândră de tine.'
    note: '*Fière de* (mândră de) este o combinație fixă; este obligatoriu *de*, nu *pour*; *fière* este aici la feminin.'
  fr.a1.unit50.lesson06.teach.mathieu_merci_beaucoup:
    title: Mathieu este emoționat
    gloss: 'Mathieu: Mulțumesc mult, înseamnă foarte mult pentru mine.'
    note: '*Compter* înseamnă aici „a conta”: *ça compte pour moi* (contează pentru mine); *pour moi* arată pentru cine contează.'
  fr.a1.unit50.lesson06.teach.son_premier_service:
    title: Posesivul „său”
    gloss: Prima lui tură a mers foarte bine.
    note: '*Son* este aici posesivul „său”, nu un verb: *son premier service* (prima lui tură); *son* se acordă cu *service*, care este masculin.'
