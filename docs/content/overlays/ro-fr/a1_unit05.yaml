answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Franceză A1
  description: Vocabular uzual despre mâncare și băutură și un schimb de replici la cafenea, care continuă povestea atelierului de gătit al Inèsei și al lui Mathieu printr-o masă luată împreună după curs. Ghidajul evidențiază articolele partitive du/de la/de l' folosite cu substantivele de mâncare nenumărabile, o structură pe care româna nu o are.
units:
  fr.a1.unit05.food:
    title: O masă după atelier
lessons:
  fr.a1.unit05.lesson01.a_table:
    title: La masă
  fr.a1.unit05.lesson02.au_cafe:
    title: La cafenea
  fr.a1.unit05.lesson03.dialogue_cafe:
    title: La cafenea, după atelier
teaching:
  fr.a1.unit05.lesson01.teach.poulet:
    title: Puiul
    gloss: pui
    note: '*Poulet* este de genul masculin.'
    example_gloss: Aș dori niște pui.
  fr.a1.unit05.lesson01.teach.poisson:
    title: Peștele
    gloss: pește
    note: '*Poisson* este de genul masculin.'
    example_gloss: Peștele este proaspăt astăzi.
  fr.a1.unit05.lesson01.teach.salade:
    title: Salata
    gloss: salată
    note: '*Salade* este de genul feminin.'
    example_gloss: Ea mănâncă o salată.
  fr.a1.unit05.lesson01.teach.riz:
    title: Orezul
    gloss: orez
    note: '*Riz* este de genul masculin și invariabil (aceeași ortografie la singular și la plural, ca *prix*).'
    example_gloss: Orezul merge bine cu puiul.
  fr.a1.unit05.lesson01.teach.eau:
    title: Apa
    gloss: apă
    note: '*Eau* este de genul feminin; *l''* se elidează în fața sunetului vocalic, ca în *l''addition*, mai târziu în această unitate.'
    example_gloss: Aș dori niște apă, vă rog.
  fr.a1.unit05.lesson01.teach.vin:
    title: Vinul
    gloss: vin
    note: '*Vin* este de genul masculin.'
    example_gloss: Vinul roșu este delicios.
  fr.a1.unit05.lesson01.teach.je_voudrais_poulet_salade:
    title: Comandă pui și salată
    gloss: Aș dori pui și salată.
    note: '*Du poulet* (masculin) și *de la salade* (feminin) sunt articole partitive (≈ „niște”) care se acordă cu genul substantivului; după o cantitate (*un kilo de*) se folosește însă doar *de*, fără articol.'
  fr.a1.unit05.lesson02.teach.dessert:
    title: Dessert
    gloss: desert
    note: '*Dessert* este de genul masculin.'
    example_gloss: Desertul este oferit astăzi.
  fr.a1.unit05.lesson02.teach.addition:
    title: Nota de plată
    gloss: nota de plată
    note: '*Addition* este de genul feminin; *l''* se elidează în fața sunetului vocalic. Este termenul standard din restaurantele franceze, nu *facture* (factură oficială).'
    example_gloss: Nota de plată, vă rog.
  fr.a1.unit05.lesson02.teach.vous_avez_choisi:
    title: Întreabă dacă ai ales
    gloss: Ați ales?
    note: Întrebarea standard a ospătarului când se apropie de masă să preia comanda; folosește passé composé al verbului *choisir* (a alege).
  fr.a1.unit05.lesson02.teach.je_voudrais_un_cafe:
    title: Comandă o cafea
    gloss: Aș dori o cafea, vă rog.
    note: '*Je voudrais* + produs, același tipar folosit la cumpărături, acum pentru mâncare și băutură.'
  fr.a1.unit05.lesson02.teach.qcq_comme_dessert:
    title: Întreabă ce există
    gloss: Ce aveți la desert?
    note: '*Qu''est-ce que vous avez comme...?* este o modalitate naturală și frecventă de a întreba ce variante există într-o categorie.'
  fr.a1.unit05.lesson02.teach.cest_delicieux:
    title: Spune că ceva e delicios
    gloss: E delicios!
    note: O reacție obișnuită și entuziastă la mâncare; *délicieux* rămâne invariabil aici, deoarece *c'est* nu se referă la un substantiv cu gen anume.
  fr.a1.unit05.lesson03.teach.line01:
    title: Salută și întreabă dacă s-a ales
    gloss: Ospătarul îi salută și îi întreabă dacă au ales.
    note: Începe cu *Bonjour*, registrul politicos pentru situațiile de servire.
  fr.a1.unit05.lesson03.teach.line02:
    title: Comandă salată și apă
    gloss: Inès comandă o salată și apă.
    note: Îl combină pe *je voudrais* cu *et* pentru a lega două produse comandate într-o singură replică.
  fr.a1.unit05.lesson03.teach.line03:
    title: Comandă pui cu orez
    gloss: Mathieu comandă pui cu orez.
    note: '*Avec* (cu) leagă felul principal de garnitură, o construcție simplă și frecventă la comandă.'
  fr.a1.unit05.lesson03.teach.line04:
    title: Confirmă și întreabă despre băuturi
    gloss: Ospătarul confirmă și întreabă ce vor să bea.
    note: '*Et comme boisson pour vous ?* reia tiparul cu *comme* din *Qu''est-ce que vous avez comme dessert ?*, acum pentru băuturi.'
  fr.a1.unit05.lesson03.teach.line05:
    title: Comandă un pahar de vin
    gloss: Mathieu comandă un pahar de vin roșu.
    note: '*Un verre de* (un pahar de) este modul standard de a comanda vin la pahar.'
  fr.a1.unit05.lesson03.teach.line06:
    title: Reacționează la mâncare
    gloss: Inès spune că salata este delicioasă.
    note: Reia *C'est délicieux !*, acum pentru un fel anume (*cette salade*). *Délicieux* rămâne la masculin după *c'est*, chiar dacă *salade* este feminin; varianta cu acord este *Elle est délicieuse, cette salade !*.
  fr.a1.unit05.lesson03.teach.line07:
    title: Explică de ce le e foame și cere nota
    gloss: Mathieu spune că atelierul le-a făcut foame și cere nota de plată.
    note: '*Nous a donné faim* (literal „ne-a dat foame”) este modul firesc în franceză de a spune că ceva ți-a făcut foame.'
  fr.a1.unit05.lesson03.teach.line08:
    title: Confirmă că nota vine
    gloss: Ospătarul confirmă că o aduce imediat.
    note: '*Tout de suite* (imediat) este o expresie frecventă și liniștitoare în situațiile de servire.'
