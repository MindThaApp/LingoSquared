    title: Pasărea Ninei
teaching:
  fr.a1.unit54.lesson01.teach.l_animal_un:
    title: Animal, un animal de companie
    gloss: animalul / un animal de companie
    note: '*Un animal* este cuvântul general; *un animal de compagnie* (literal „un animal de companie”) desemnează în mod special un animal de casă.'
    example_gloss:
    - Câinele este un animal.
    - Câinele este și un animal de companie.
  fr.a1.unit54.lesson01.teach.le_chien_le:
    title: Câinele și pisica
    gloss: câinele / pisica
    example_gloss:
    - Camille are un câine.
    - Thomas are o pisică.
  fr.a1.unit54.lesson01.teach.le_poisson_l:
    title: Peștele și pasărea
    gloss: peștele / pasărea
    example_gloss:
    - Bunicul are un pește.
    - Nina are o pasăre.
  fr.a1.unit54.lesson01.teach.tu_as_un:
    title: Ai un animal de companie?
    gloss: Ai un animal de companie?
    note: Același tipar de întrebare *Tu as ... ?* pe care îl cunoști din unitățile anterioare.
  fr.a1.unit54.lesson01.teach.oui_j_ai:
    title: Da, am un câine
    gloss: Da, am un câine.
    note: Un răspuns afirmativ simplu, cu vocabularul nou al acestei unități.
  fr.a1.unit54.lesson01.teach.non_je_n:
    title: Nu, nu am niciun animal de companie
    gloss: Nu, nu am niciun animal de companie.
    note: '*Pas d''* înlocuiește *un* după o negație: *Je n''ai pas d''animal de compagnie.* Vezi nota de gramatică.'
  fr.a1.unit54.lesson01.teach.apres_ne_pas:
    title: 'Pas de: negarea lui un/une/des'
    gloss: După *ne ... pas*, *un*, *une* și *des* devin *de* sau *d'*, ca în *Je n'ai pas de temps* (pe care îl știi deja) și aici în *Je n'ai pas d'animal de compagnie*.
    note: 'Reia tiparul învățat deja la *Je n''ai pas de temps*: nu e gramatică nouă, ci doar un substantiv nou la care îl aplici.'
  fr.a1.unit54.lesson02.teach.promener:
    title: A scoate la plimbare (un animal)
    gloss: a scoate la plimbare (un animal)
    note: '*Promener* (a plimba) este un verb regulat în *-er*; vezi nota de gramatică.'
    example_gloss: Scot câinele la plimbare în fiecare zi.
  fr.a1.unit54.lesson02.teach.promener_est_un:
    title: Promener este un verb regulat în -er
    gloss: '*Promener* este un verb regulat în *-er*, ca *cuisiner*: *je promène, tu promènes, il promène le chien*. Accentul de pe *e* arată că acesta se pronunță.'
    note: Verbul se conjugă la fel ca celelalte verbe în *-er* pe care le știi deja.
  fr.a1.unit54.lesson02.teach.donner_a_manger:
    title: A da de mâncare
    gloss: a da de mâncare
    example_gloss: Dau de mâncare pisicii în fiecare zi.
  fr.a1.unit54.lesson02.teach.jouer_avec:
    title: A se juca cu
    gloss: a se juca cu
    example_gloss: Thomas se joacă cu pisica lui.
  fr.a1.unit54.lesson02.teach.je_promene_le:
    title: Scot câinele la plimbare în fiecare zi
    gloss: Scot câinele la plimbare în fiecare zi.
    note: Îmbină *promener* cu *tous les jours* (în fiecare zi), deja cunoscut dintr-o unitate anterioară.
  fr.a1.unit54.lesson02.teach.je_donne_a:
    title: Dau de mâncare pisicii în fiecare zi
    gloss: Dau de mâncare pisicii în fiecare zi.
    note: Îmbină *donner à manger* (literal „a da de mâncare”) cu *tous les jours*.
  fr.a1.unit54.lesson03.teach.au_pluriel_on:
    title: 'Pluralul: chien -> chiens'
    gloss: 'Pluralul adaugă, de obicei, un *s* care nu se aude: *chien -> chiens*, *chat -> chats*. Substantivele în *-al* devin *-aux*: *animal -> animaux*.'
    note: Tiparul pluralului regulat în franceză, introdus aici pentru prima dată, cu substantive despre animale ca exemple.
  fr.a1.unit54.lesson03.teach.chiens_chats:
    title: Câini și pisici
    gloss: câini / pisici
    example_gloss:
    - Mathieu adoră câinii.
    - Léa adoră pisicile.
  fr.a1.unit54.lesson03.teach.poissons_oiseaux:
    title: Pești și păsări (plural)
    gloss: pești / păsări
    example_gloss:
    - Iubesc peștii.
    - Bunicul iubește păsările.
  fr.a1.unit54.lesson03.teach.j_adore_les:
    title: Iubesc animalele
    gloss: Iubesc animalele.
    note: '*Adorer* (a adora) este urmat direct de substantiv, iar o preferință generală cere *les*: *J''adore les animaux.*'
  fr.a1.unit54.lesson03.teach.lea_adore_les:
    title: Léa adoră pisicile, dar nu are animal de companie
    gloss: Léa adoră pisicile, dar nu are un animal de companie.
    note: Pregătește contrastul pe care se construiește textul de citit al lecției.
  fr.a1.unit54.lesson04.teach.mathieu_tu_as:
    title: Mathieu întreabă despre un animal de companie
    gloss: 'Mathieu: Ai un animal de companie, Camille?'
  fr.a1.unit54.lesson04.teach.camille_oui_j:
    title: Camille are un câine
    gloss: 'Camille: Da, am un câine.'
  fr.a1.unit54.lesson04.teach.mathieu_comment_est:
    title: Mathieu întreabă cum arată
    gloss: 'Mathieu: Cum arată?'
    note: Reia *Comment est-il ?* din unitatea despre aspectul fizic, acum folosit pentru un animal.
  fr.a1.unit54.lesson04.teach.camille_il_a:
    title: Camille își descrie câinele
    gloss: 'Camille: Are blana maro și este mic.'
    note: Reia vocabularul culorilor și al mărimii din unitatea despre aspect, acum pentru blana unui animal, nu pentru părul unei persoane.
  fr.a1.unit54.lesson04.teach.il_et_le:
    title: Il/le pentru animale
    gloss: '*Il* (el) și *le* (îl) se pot folosi și pentru un animal de parte bărbătească, nu doar pentru o persoană.'
    note: Până acum, în acest curs, *il* și *le* se refereau la persoane; aici se arată explicit că se folosesc și pentru animale.
  fr.a1.unit54.lesson04.teach.mathieu_tu_le:
    title: Mathieu întreabă despre plimbări
    gloss: 'Mathieu: Îl plimbi în fiecare zi?'
  fr.a1.unit54.lesson04.teach.camille_oui_je:
    title: Camille își descrie rutina
    gloss: 'Camille: Da, îl plimb în fiecare zi și îi dau de mâncare.'
  fr.a1.unit54.lesson05.teach.mathieu_et_lea:
    title: Mathieu, Léa și Thomas despre animale
    gloss: 'Mathieu și Léa iubesc amândoi animalele, dar niciunul dintre ei nu are un animal de companie. Mathieu adoră câinii, iar Léa adoră pisicile. Thomas, în schimb, are un animal de companie: o pisică. Se joacă adesea cu pisica lui și îi dă de mâncare în fiecare zi. Dar tu, ai un animal de companie?'
    note: Contrastează a iubi un animal cu a avea cu adevărat unul -- chiar scopul comunicativ al unității.
    glosses:
      adorent: iubesc
      tous: amândoi
      animaux: animale
      deux: amândoi
      compagnie: animal de companie
      chiens: câini
      chats: pisici
      chat: pisică
      joue: se joacă
      donne: dă
      chaque: fiecare
      manger: mâncare
  fr.a1.unit54.lesson05.teach.thomas_joue_souvent:
    title: Thomas se joacă adesea cu pisica lui
    gloss: Thomas se joacă adesea cu pisica lui.
    note: '*Souvent* (adesea) se așază imediat după verb, ca în rutinele de mai înainte.'
  fr.a1.unit54.lesson05.teach.j_adore_les:
    title: Iubesc câinii. Nu am animal de companie.
    gloss: Iubesc câinii. Nu am animal de companie.
    note: Un răspuns model din două propoziții, bun de reutilizat la sarcina de scriere a unității.
  fr.a1.unit54.lesson06.teach.camille_nina_tu:
    title: Camille o întreabă pe Nina
    gloss: 'Camille: Nina, ai și tu un animal de companie?'
  fr.a1.unit54.lesson06.teach.nina_oui_j:
    title: Nina are o pasăre pe nume Pico
    gloss: 'Nina: Da, am o pasăre. Se numește Pico.'
    note: '*Il s''appelle* (îl cheamă) reia verbul de prezentare din prima unitate.'
  fr.a1.unit54.lesson06.teach.mathieu_comme_c:
    title: Reacția lui Mathieu
    gloss: 'Mathieu: Ce drăguț! Ce faci cu el în fiecare zi?'
  fr.a1.unit54.lesson06.teach.nina_je_lui:
    title: Nina îi dă de mâncare în fiecare zi
    gloss: 'Nina: Îi dau de mâncare în fiecare zi.'
  fr.a1.unit54.lesson06.teach.mathieu_j_adore:
    title: Și Mathieu iubește păsările
    gloss: 'Mathieu: Și eu ador păsările.'
  fr.a1.unit54.lesson06.teach.camille_c_est:
    title: Camille încheie conversația
    gloss: 'Camille: Super, toți trei iubim animalele!'
    note: Închide cercul faptelor despre animale ale celor trei personaje din această unitate.
