teaching:
  fr.a1.unit49.lesson01.teach.content_triste_en:
    title: Fericit, trist și furios
    gloss: fericit, trist, furios
    note: Trei cuvinte de bază pentru sentimente, folosite cu *être* (a fi); *content* are la feminin forma *contente*, iar *triste* și *en colère* nu se schimbă.
    example_gloss:
    - Sunt fericit.
    - Sunt trist.
    - Sunt furios.
  fr.a1.unit49.lesson01.teach.je_suis_content:
    title: Spui că ești fericit
    gloss: Sunt fericit.
    note: '*Être* (a fi) + adjectiv care exprimă un sentiment este structura de bază, ca în română: „Sunt ...”.'
  fr.a1.unit49.lesson01.teach.je_ne_suis:
    title: Sentimente în contrast
    gloss: Nu sunt furios, sunt trist.
    note: '*Ne ... pas* înconjoară verbul; a doua propoziție spune apoi sentimentul real.'
  fr.a1.unit49.lesson02.teach.pourquoi_es_tu:
    title: Întrebarea „de ce”
    gloss: De ce ești fericit?
    note: '*Pourquoi* (de ce) este cuvântul interogativ obișnuit pentru a cere un motiv.'
  fr.a1.unit49.lesson02.teach.je_suis_content:
    title: Spui motivul
    gloss: Sunt fericit pentru că am un apartament nou.
    note: '*Parce que* (pentru că) introduce propoziția care dă motivul; înaintea lui *il* devine *parce qu''*.'
  fr.a1.unit49.lesson02.teach.je_suis_triste:
    title: Un motiv negativ
    gloss: Sunt trist pentru că plouă.
    note: Reia *il pleut* (plouă) din unitatea despre vreme, ca propoziție care dă motivul.
  fr.a1.unit49.lesson03.teach.nerveux:
    title: Nervos
    gloss: nervos
    note: Cuvântul obișnuit pentru nervozitate.
    example_gloss: Sunt nervos înainte de prima mea tură.
  fr.a1.unit49.lesson03.teach.je_suis_nerveux:
    title: Spui de ce ești nervos
    gloss: Sunt nervos înainte de prima mea tură.
    note: '*Avant* (literal „înainte de”) introduce evenimentul care provoacă nervozitatea; în română spunem mai des „din cauza” sau „pentru”, așa că reține această structură franceză.'
  fr.a1.unit49.lesson03.teach.ne_t_inquiete:
    title: Liniștești pe cineva
    gloss: Nu-ți face griji.
    note: '*Ne t''inquiète pas* (literal „nu te îngrijora”) este formula fixă obișnuită de liniștire; *s''inquiéter* este reflexiv.'
  fr.a1.unit49.lesson04.teach.comment_se_sent:
    title: Întrebi cum se simte cineva
    gloss: Cum se simte Mathieu?
    note: '*Se sentir* (a se simți, reflexiv) este modul obișnuit de a întreba despre sau de a descrie o stare emoțională; apare și în unitatea despre sănătate.'
  fr.a1.unit49.lesson04.teach.il_se_sent:
    title: Descrii cum se simte cineva
    gloss: El se simte nervos.
    note: '*Se* este pronumele reflexiv de persoana a treia, folosit cu *sent*.'
  fr.a1.unit49.lesson04.teach.pourquoi_se_sent:
    title: Întrebi de ce se simte cineva într-un anumit fel
    gloss: De ce se simte nervos?
    note: Îmbină *pourquoi* cu *se sentir* din *Il se sent nerveux*; *sent-il* se scrie cu cratimă.
  fr.a1.unit49.lesson05.teach.salut_camille_je:
    title: Citește un mesaj despre sentimente
    gloss: Salut, Camille, sunt puțin nervos înainte de prima mea tură singur. Dar sunt și fericit, pentru că am un job nou și un apartament nou. Cred că va merge bine.
    note: Urmărește de ce este nervos autorul, ce îl face fericit și cum vede el lucrurile în ansamblu.
    glosses:
      peu: puțin
      nerveux: nervos
      premier: primul
      service: tură
      seul: singur
      content: se bucură
      car: pentru că
      nouveau: noi
      travail: slujbă
      nouvel: noi
      appartement: apartament
      pense: a crede
      aller: va merge (bine)
  fr.a1.unit49.lesson06.teach.camille_salut_mathieu:
    title: Camille îl întreabă pe Mathieu cum se simte
    gloss: 'Camille: Salut, Mathieu, cum te simți înainte de prima ta tură?'
    note: '*Avant ton premier service* (înainte de prima ta tură) reia structura *avant* + substantiv din lecția 3.'
  fr.a1.unit49.lesson06.teach.mathieu_je_suis:
    title: Mathieu recunoaște că e nervos
    gloss: 'Mathieu: Sunt puțin nervos, sincer.'
    note: '*Honnêtement* (sincer) atenuează recunoașterea.'
  fr.a1.unit49.lesson06.teach.camille_ne_t:
    title: Camille îl liniștește
    gloss: 'Camille: Nu-ți face griji, o să reușești!'
    note: '*Tu vas y arriver* (literal „o să ajungi acolo”) este o expresie fixă de încurajare; *aller* + infinitiv formează viitorul apropiat.'
  fr.a1.unit49.lesson06.teach.mathieu_merci_ca:
    title: Mathieu îi mulțumește
    gloss: 'Mathieu: Mulțumesc, chiar mă ajută.'
    note: '*Aide* este forma de *il/elle* a verbului *aider* (a ajuta); *m''* înseamnă *me*.'
  fr.a1.unit49.lesson06.teach.camille_et_apres:
    title: Camille prezice rezultatul
    gloss: 'Camille: Iar după aceea vei fi sigur foarte fericit și mândru.'
    note: '*Sûrement* (sigur) exprimă o predicție încrezătoare; *fier* (mândru) este un adjectiv nou și util.'
  fr.a1.unit49.lesson06.teach.mathieu_oui_je:
    title: Mathieu este de acord
    gloss: 'Mathieu: Da, cred și eu.'
    note: '*Je pense aussi* este modul firesc de a fi de acord cu părerea cuiva.'
  fr.a1.unit49.lesson06.teach.il_remplace_mathieu:
    title: Rezumat cu il, elle și l'
    gloss: Mathieu este nervos din cauza primei sale ture. Camille îl ajută.
    note: '*Il* înlocuiește numele unui bărbat (*il est nerveux*), *elle* înlocuiește numele unei femei, iar *l''* (*elle l''aide*) înseamnă „pe el”: trei cuvinte mici, dar esențiale, pentru a vorbi despre altcineva.'
