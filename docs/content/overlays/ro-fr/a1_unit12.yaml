answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Franceză A1
  description: 'Relatarea scurtă a unui eveniment recent încheiat, cu passé composé, folosind ambele auxiliare, avoir și être, în continuarea poveștii atelierului de gătit al Inèsei și al lui Mathieu: Mathieu povestește o neplăcere din sesiunea de sâmbăta trecută. Franceza folosește două auxiliare diferite (avoir pentru majoritatea verbelor, être pentru un grup mic, printre care aller/arriver/rester), la fel ca în română, unde perfectul compus se formează cu „a avea” sau „a fi” (am ajuns, m-am dus). Participiile conjugate cu être se acordă în gen cu subiectul (arrivé/arrivée).'
units:
  fr.a1.unit12.past_events:
    title: Ce s-a întâmplat?
lessons:
  fr.a1.unit12.lesson01.passe_compose_avoir:
    title: Passé composé cu avoir
  fr.a1.unit12.lesson02.passe_compose_etre:
    title: Passé composé cu être
  fr.a1.unit12.lesson03.dialogue_atelier_dernier:
    title: Atelierul de sâmbăta trecută
teaching:
  fr.a1.unit12.lesson01.teach.jai_prepare:
    title: Am pregătit
    gloss: am pregătit / am făcut
    note: 'Verbele regulate în -ER formează participiul pentru passé composé în *-é*: *préparer* → *préparé*, folosit cu *avoir*.'
    example_gloss: Am făcut un tort pentru atelier.
  fr.a1.unit12.lesson01.teach.jai_achete:
    title: Am cumpărat
    gloss: am cumpărat
    note: '*Acheter* urmează același model *avoir* + *-é* ca *préparer*.'
    example_gloss: Am cumpărat legume de la piață.
  fr.a1.unit12.lesson01.teach.jai_oublie:
    title: Am uitat
    gloss: am uitat
    note: '*Oublier* → *oublié*, din nou același model regulat.'
    example_gloss: Am uitat untul acasă!
  fr.a1.unit12.lesson01.teach.tu_as_aime:
    title: Ți-a plăcut
    gloss: ți-a plăcut
    note: '*Tu as* + participiu este forma pentru *tu* a aceleiași construcții cu *avoir*.'
    example_gloss: Ți-a plăcut tortul?
  fr.a1.unit12.lesson01.teach.il_a_goute:
    title: A gustat
    gloss: a gustat
    note: '*Il a* + participiu este forma pentru *il*: auxiliarul *avoir* se schimbă după subiect, participiul rămâne la fel.'
    example_gloss: Mathieu a gustat sosul.
  fr.a1.unit12.lesson01.teach.grammar_avoir_participe:
    title: Avoir + participiu trecut
    gloss: avoir + participiu trecut (-é)
    note: Majoritatea verbelor franceze formează passé composé cu auxiliarul *avoir*, urmat de un participiu trecut care se termină în *-é* la verbele regulate în -ER.
  fr.a1.unit12.lesson01.teach.la_semaine_derniere:
    title: Săptămâna trecută
    gloss: săptămâna trecută
    note: '*Dernière* („trecută”) se acordă cu *semaine*, care este feminin; forma de masculin este *dernier*, ca în *samedi dernier* („sâmbăta trecută”).'
    example_gloss: Săptămâna trecută am făcut un tort.
  fr.a1.unit12.lesson02.teach.je_suis_arrive:
    title: Am ajuns
    gloss: am ajuns
    note: '*Arriver* face parte dintr-un grup mic de verbe (mai ales de mișcare) care folosesc *être*, nu *avoir*, ca auxiliar.'
    example_gloss: Am ajuns târziu la atelier.
  fr.a1.unit12.lesson02.teach.je_suis_alle:
    title: M-am dus
    gloss: m-am dus
    note: '*Aller* se conjugă tot cu *être*. Participiul se acordă cu subiectul: *allé* (masculin) sau *allée* (feminin, cum ar spune Inès).'
    example_gloss: M-am dus la piață înainte de atelier.
  fr.a1.unit12.lesson02.teach.il_est_reste:
    title: A rămas
    gloss: a rămas
    note: '*Rester* („a rămâne”) este un alt verb conjugat cu *être*, cu aceeași regulă de acord.'
    example_gloss: Mathieu a rămas să curețe bucătăria.
  fr.a1.unit12.lesson02.teach.grammar_etre_accord:
    title: Acordul participiului cu être
    gloss: être + participiu trecut (se acordă cu subiectul)
    note: La verbele conjugate cu *être*, participiul trecut se acordă în gen și în număr cu subiectul, spre deosebire de verbele conjugate cu *avoir*.
  fr.a1.unit12.lesson02.teach.en_retard:
    title: Târziu
    gloss: târziu
    note: '*En retard* arată că ai ajuns după ora prevăzută; apare des împreună cu *arriver*.'
    example_gloss: Autobuzul a ajuns târziu.
  fr.a1.unit12.lesson02.teach.finalement:
    title: În sfârșit / până la urmă
    gloss: în sfârșit / până la urmă
    note: '*Finalement* încheie o povestire scurtă și arată rezultatul final după complicațiile de la început.'
    example_gloss: Până la urmă, tortul a fost delicios.
  fr.a1.unit12.lesson02.teach.quest_ce_qui_sest_passe:
    title: Ce s-a întâmplat?
    gloss: Ce s-a întâmplat?
    note: '*Qu''est-ce qui s''est passé ?* este modul obișnuit de a întreba ce s-a întâmplat.'
    example_gloss: Ce s-a întâmplat la atelier?
  fr.a1.unit12.lesson03.teach.line01:
    title: Întreabă ce s-a întâmplat
    gloss: Inès întreabă ce s-a întâmplat la atelierul de sâmbăta trecută, la care nu a putut veni.
    note: '*Qu''est-ce qui s''est passé ?* („ce s-a întâmplat?”) este modul obișnuit de a întreba despre un eveniment trecut.'
  fr.a1.unit12.lesson03.teach.line02:
    title: Povestește neplăcerea
    gloss: Mathieu spune „vai!”, că a ajuns târziu și a uitat untul acasă!
    note: 'Două forme de passé composé într-o singură frază: cu *être* (*je suis arrivé*) și cu *avoir* (*j''ai oublié*).'
  fr.a1.unit12.lesson03.teach.line03:
    title: Întreabă ce a făcut
    gloss: Inès întreabă ce a făcut mai departe.
    note: '*Qu''est-ce que tu as fait ?* („ce ai făcut?”) folosește participiul neregulat al verbului *faire*.'
  fr.a1.unit12.lesson03.teach.line04:
    title: Descrie soluția
    gloss: Mathieu spune că a fugit repede la băcănia din colț.
    note: În *l'épicerie du coin* („băcănia din colț”), *coin* apare ca în *au coin de la rue*.
  fr.a1.unit12.lesson03.teach.line05:
    title: Întreabă dacă a mers
    gloss: Inès îl întreabă dacă a găsit unt acolo.
    note: '*Tu as trouvé... ?* („ai găsit...?”) este o altă întrebare regulată cu auxiliarul *avoir*.'
  fr.a1.unit12.lesson03.teach.line06:
    title: Dă un final fericit
    gloss: Mathieu spune că da și că, până la urmă, tortul a fost delicios!
    note: Încheie povestea pe o notă pozitivă cu *finalement*, rezolvând neplăcerea de la început.
