teaching:
  en.a1.unit15.lesson01.teach.cash:
    title: Cash
    gloss: Bargeld
    note: '*cash* ist Bargeld (Scheine und Münzen). Im Englischen ist es unzählbar: *some cash*, nie *a cash*.'
    example_gloss: Ich habe etwas Bargeld.
  en.a1.unit15.lesson01.teach.card:
    title: Card
    gloss: Karte
    note: '*card* ist das allgemeine Wort für jede Zahlungskarte aus Plastik.'
    example_gloss: Meine Karte ist blau.
  en.a1.unit15.lesson01.teach.credit_card:
    title: Credit card
    gloss: Kreditkarte
    note: '*credit card* ist eine Karte, mit der man sich Geld leiht und später zurückzahlt. Der Begriff entspricht dem deutschen ''Kreditkarte''.'
  en.a1.unit15.lesson01.teach.debit_card:
    title: Debit card
    gloss: Debitkarte/Girocard
    note: '*debit card* ist eine Karte, bei der das Geld sofort vom Konto abgebucht wird. Eine deutsche Girocard ist so eine *debit card*.'
  en.a1.unit15.lesson01.teach.total:
    title: Total
    gloss: Gesamtbetrag
    note: '*total* ist der gesamte Betrag, den Sie zahlen müssen.'
    example_gloss: Wie hoch ist der Gesamtbetrag?
  en.a1.unit15.lesson02.teach.do_you_take_cards:
    title: Do you take credit cards?
    gloss: Akzeptieren Sie Kreditkarten?
    note: '*Do you take credit cards?* ist die übliche Frage vor dem Bezahlen. *take* heißt hier ''annehmen/akzeptieren''.'
  en.a1.unit15.lesson02.teach.cash_only:
    title: Sorry, cash only.
    gloss: Tut mir leid, nur Barzahlung.
    note: '*Sorry, cash only.* ist die übliche Antwort von Geschäften, die keine Karten akzeptieren.'
  en.a1.unit15.lesson02.teach.ill_pay_by_card:
    title: Yes, I'll pay by card.
    gloss: Ja, ich zahle mit Karte.
    note: '*Yes, I''ll pay by card.* ist die endgültige Wahl der Zahlungsart. Nach *by* steht *card* ohne Artikel.'
  en.a1.unit15.lesson03.teach.tax:
    title: Tax
    gloss: Steuer
    note: '*tax* ist die Steuer; in den meisten US-Geschäften wird sie erst an der Kasse zum Preis addiert (anders als die deutsche MwSt. im Preisschild).'
    example_gloss: Die Steuer beträgt einen Dollar.
  en.a1.unit15.lesson03.teach.receipt_text:
    title: Kassenbontext
    gloss: 'Kaffee: 3 Dollar. Sandwich: 6 Dollar. Steuer: 1 Dollar. Gesamt: 10 Dollar.'
    note: Das ist ein echter Kassenbon.
  en.a1.unit15.lesson03.teach.total_summary_sentence:
    title: The total is $10.
    gloss: Der Gesamtbetrag ist 10 Dollar.
    note: Dieser Satz fasst den Gesamtbetrag des Kassenbons in einem vollständigen Satz zusammen.
  en.a1.unit15.lesson04.teach.q_total:
    title: Nach dem Gesamtbetrag fragen
    gloss: Leila fragt, wie hoch der Gesamtbetrag ist
    note: '*How much is the total?* ist die übliche Frage nach dem Endbetrag. *is* steht im Singular, weil *the total* eine Summe ist.'
  en.a1.unit15.lesson04.teach.a_fifteen:
    title: Antwort zum Gesamtbetrag
    gloss: 'Der Kassierer sagt: Das macht fünfzehn Dollar.'
    note: '*It''s fifteen dollars.* ist eine vollständige Antwort auf die Frage nach dem Gesamtbetrag.'
  en.a1.unit15.lesson04.teach.q_cards:
    title: Nach Kartenzahlung fragen
    gloss: Leila fragt, ob Kreditkarten akzeptiert werden
    note: Dieselbe Frage wie zuvor.
  en.a1.unit15.lesson04.teach.a_yes_we_do:
    title: Antwort zur Kartenzahlung
    gloss: 'Der Kassierer sagt: Ja, tun wir.'
    note: '*Yes, we do.* ist eine vollständige Kurzantwort. Im Englischen wiederholt man das Hilfsverb *do*, statt nur ''ja'' zu sagen.'
  en.a1.unit15.lesson04.teach.closing_pay_by_card:
    title: Endgültige Zahlungswahl
    gloss: 'Leila sagt: Super, ich zahle mit Karte.'
    note: Dieser Satz beendet das Gespräch mit der endgültigen Zahlungswahl.
