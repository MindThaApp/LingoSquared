    gloss: Schicken Sie bitte die Polizei.
    note: '*Send the police, please.* bedeutet: Schicken Sie bitte die Polizei.'
  en.a1.unit45.lesson02.teach.send_an_ambulance:
    title: Send an ambulance, please.
    gloss: Schicken Sie bitte einen Krankenwagen.
    note: '*Send an ambulance, please.* bedeutet: Schicken Sie bitte einen Krankenwagen.'
  en.a1.unit45.lesson02.teach.theres_a_fire:
    title: There's a fire!
    gloss: Es brennt!
    note: '*There''s a fire!* bedeutet: Es brennt!'
  en.a1.unit45.lesson02.teach.whats_your_emergency:
    title: What's your emergency?
    gloss: Was ist Ihr Notfall?
    note: Das ist die Standardfrage einer amerikanischen Notrufzentrale, sobald Sie die 911 wählen.
  en.a1.unit45.lesson03.teach.dialogue_line1:
    title: Leila riecht Rauch
    gloss: 'Leila fragt: Daniel, brennt etwas? Ich rieche Rauch!'
    note: '*smell* + Nomen, ohne Präposition: I smell smoke = ich rieche Rauch. Achtung: *I smell of smoke* bedeutet etwas anderes (ich rieche nach Rauch).'
  en.a1.unit45.lesson03.teach.dialogue_line2:
    title: Daniels Erklärung
    gloss: 'Daniel sagt: Oh nein, die Pfanne hat Feuer gefangen! Ich habe gerade das Abendessen gekocht.'
    note: '*caught fire* ist ein fester Ausdruck dafür, dass etwas plötzlich zu brennen beginnt.'
  en.a1.unit45.lesson03.teach.dialogue_line3:
    title: Leilas Anweisungen
    gloss: 'Leila sagt: Bleib ruhig. Schalte den Herd aus! Ich rufe Hilfe.'
    note: '*call for help* bedeutet Hilfe rufen. Lassen Sie das Wort *for* hier nicht weg.'
  en.a1.unit45.lesson03.teach.dialogue_line4:
    title: Daniels Warnung
    gloss: 'Daniel sagt: Beeil dich, das Feuer wird größer!'
    note: '*getting bigger* bedeutet größer werden -- *get* + Adjektiv drückt eine Veränderung aus.'
  en.a1.unit45.lesson03.teach.dialogue_line5:
    title: Leila ruft den Notruf an
    gloss: 'Leila sagt: Hallo, das ist ein Notfall. In der Küche meines Freundes brennt es. Bitte schicken Sie die Feuerwehr.'
    note: 'So klingt ein Gespräch mit der Notrufzentrale in den USA: Dort wählt man die 911, nicht die 112.'
  en.a1.unit45.lesson03.teach.dialogue_line6:
    title: Daniels Erleichterung
    gloss: 'Daniel sagt: Gott sei Dank. Ich glaube, es ist jetzt aus, aber lass uns sicherheitshalber draußen warten.'
    note: '*just in case* bedeutet sicherheitshalber.'
  en.a1.unit45.lesson03.teach.dialogue_line7:
    title: Leilas Rat
    gloss: 'Leila sagt: Gute Idee. Es ist sicherer, draußen zu warten, bis sie ankommen.'
    note: '*safer* ist die Steigerungsform von *safe*, gebildet mit -er wie im Deutschen (sicher -> sicherer).'
  en.a1.unit45.lesson04.teach.reading_passage:
    title: Text über Verhalten im Notfall
    gloss: 'Bei Brand: Bleiben Sie zuerst ruhig. Verlassen Sie zweitens sofort das Gebäude. Benutzen Sie nicht den Aufzug, sondern die Treppe. Rufen Sie drittens, sobald Sie draußen sind, die 911 an und nennen Sie Ihre Adresse. Warten Sie schließlich draußen, bis die Feuerwehr eintrifft. Nach Daniels Küchenbrand warteten er und Leila draußen, genau wie es im Aushang stand. Die Feuerwehr kam schnell und sorgte dafür, dass alles sicher war. Später kam Mia vorbei, um nach ihnen zu sehen, und war erleichtert, dass niemand verletzt wurde.'
    note: '*elevator* ist das amerikanische Wort für Aufzug. Im britischen Englisch sagt man *lift*.'
