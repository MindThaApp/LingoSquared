  en.a1.unit45.lesson02.teach.call_911:
    title: Call 911!
    gloss: Rufen Sie 911 an!
    note: In den USA wählen Sie im Notfall die *911*, nicht die *112* wie in Deutschland -- ein wichtiger Unterschied, den man sich merken sollte.
  en.a1.unit45.lesson02.teach.i_need_help:
