teaching:
  en.b1.unit13.lesson01.teach.who: {title: "who", gloss: "der/die (für Personen)", note: "*who* bezieht sich in einem Relativsatz auf eine Person.", example_gloss: "Daniel, der im März zum Team kam, leitet schon zwei Projekte."}
  en.b1.unit13.lesson01.teach.which: {title: "which", gloss: "der/die/das (für Dinge)", note: "*which* bezieht sich in einem Relativsatz auf eine Sache.", example_gloss: "Der Designkurs, den Leila gewählt hat, beginnt im Juni."}
  en.b1.unit13.lesson01.teach.that_relative: {title: "that", gloss: "der/die/das (bestimmend)", note: "*that* bezieht sich in einem bestimmenden Relativsatz auf eine Person oder Sache.", example_gloss: "Der Kunde, der heute Morgen angerufen hat, möchte einen Termin."}
  en.b1.unit13.lesson01.teach.whose: {title: "whose", gloss: "dessen/deren", note: "*whose* zeigt in einem Relativsatz Besitz an.", example_gloss: "Der Kunde, dessen Projekt sie gerade abschließen, hat den Entwurf schon genehmigt."}
  en.b1.unit13.lesson01.teach.where: {title: "where", gloss: "wo", note: "*where* bezieht sich in einem Relativsatz auf einen Ort.", example_gloss: "Das Büro, in dem Daniel arbeitet, liegt in der Innenstadt."}
  en.b1.unit13.lesson01.teach.coworker: {title: "coworker", gloss: "Kollege, Kollegin", note: "*coworker* bedeutet jemanden, mit dem man zusammenarbeitet.", example_gloss: "Mia hat eine Kollegin, die abends Spanisch lernt."}

  en.b1.unit13.lesson02.teach.colleague_organized: {title: "who im bestimmenden Relativsatz", gloss: "Die Kollegin, die neben Mia sitzt, ist sehr organisiert.", note: "*who* leitet hier eine Information ein, die man braucht, um zu wissen, um wen es geht."}
  en.b1.unit13.lesson02.teach.daniel_leads_projects: {title: "who im nicht bestimmenden Relativsatz", gloss: "Daniel, der im März zum Team kam, leitet schon zwei Projekte.", note: "Die Kommas zeigen, dass der Relativsatz eine zusätzliche Information gibt und nichts Notwendiges zur Identifizierung."}
  en.b1.unit13.lesson02.teach.grammar_defining: {title: "Bestimmende und nicht bestimmende Relativsätze", gloss: "Verwenden Sie einen bestimmenden Relativsatz ohne Kommas, um genau zu sagen, wen oder was Sie meinen: The colleague who sits next to Mia is organized. Verwenden Sie einen nicht bestimmenden Relativsatz mit Kommas, um zusätzliche Informationen über jemanden zu geben, der schon bekannt ist: Daniel, who joined in March, already leads two projects. Achtung: Im Deutschen steht der Relativsatz immer zwischen Kommas, im Englischen nur der nicht bestimmende.", note: "Form: bestimmend = keine Kommas, sagt, wer/was gemeint ist; nicht bestimmend = Kommas, fügt zusätzliche Information hinzu."}

  en.b1.unit13.lesson03.teach.deadline: {title: "deadline", gloss: "Deadline, Frist", note: "*deadline* bedeutet das Datum oder die Uhrzeit, bis zu der etwas fertig sein muss.", example_gloss: "Die Kollegin, die neben Mia sitzt, hält ihre Fristen immer ein."}
  en.b1.unit13.lesson03.teach.approve: {title: "approve", gloss: "genehmigen", note: "*approve* bedeutet, etwas offiziell zu akzeptieren.", example_gloss: "Der Kunde hat den ersten Entwurf bereits genehmigt."}
  en.b1.unit13.lesson03.teach.reading_passage: {title: "Lesetext: das neue Büro", gloss: "Mia arbeitet mit verschiedenen Menschen, die ihr die Arbeit leichter machen. Daniel, der im März zum Team kam, leitet schon zwei Projekte. Die Kollegin, die neben Mia sitzt, ist sehr organisiert und hält ihre Fristen immer ein. Ihr Büro, das im fünften Stock liegt, hat eine kleine Küche, in der alle gemeinsam zu Mittag essen. Der Kunde, dessen Projekt sie gerade abschließen, hat den ersten Entwurf schon genehmigt.", note: "Ein kurzer Lesetext mit bestimmenden und nicht bestimmenden Relativsätzen."}

  en.b1.unit13.lesson04.teach.q_met_the_woman: {title: "Mia stellt die neue Kollegin vor", gloss: "Mia sagt: Leila, hast du die Frau schon kennengelernt, die gerade in unser Team gekommen ist?", note: "*who* bezieht sich hier auf *the woman*."}
  en.b1.unit13.lesson04.teach.a_whose_desk: {title: "Leila fragt nach dem Platz der neuen Kollegin", gloss: "Leila sagt: Noch nicht. Ist das die Person, deren Schreibtisch am Fenster steht?", note: "*whose* zeigt Besitz an: *whose desk*."}
  en.b1.unit13.lesson04.teach.q_the_designer_who: {title: "Mia beschreibt die neue Kollegin", gloss: "Mia sagt: Ja, genau die. Sie ist die Designerin, die das Logoprojekt abgeschlossen hat.", note: "*who* bezieht sich auf *the designer*."}
  en.b1.unit13.lesson04.teach.a_which_won_award: {title: "Leila erinnert sich an das Projekt", gloss: "Leila sagt: Ach ja, ich erinnere mich. Ist das das Projekt, das letzten Monat den Preis gewonnen hat?", note: "*which* bezieht sich auf *the project*."}
  en.b1.unit13.lesson04.teach.q_office_smaller: {title: "Mia erzählt von ihrem früheren Büro", gloss: "Mia sagt: Genau. Das Büro, in dem sie früher gearbeitet hat, war viel kleiner als unseres.", note: "*where* bezieht sich auf einen Ort: *the office*."}
  en.b1.unit13.lesson04.teach.a_kitchen_where: {title: "Leila versteht, warum sie die Küche mag", gloss: "Leila sagt: Das erklärt, warum sie die Küche, in der alle gemeinsam zu Mittag essen, so mag.", note: "*where* bezieht sich auf *the kitchen*."}

