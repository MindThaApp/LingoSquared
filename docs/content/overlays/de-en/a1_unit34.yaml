teaching:
  en.a1.unit34.lesson01.teach.soccer:
    title: soccer
    gloss: Fußball
    note: '*soccer* bedeutet Fußball. Das passende Verb ist *play*: *play soccer*. Im Deutschen sagt man ebenfalls "Fußball spielen", das passt also gut. Der Unterschied: Das Englische hat für Sportarten drei Verben (*play*, *go*, *do*), und Sie müssen sich merken, welches zu welcher Sportart gehört.'
    example_gloss: Wir spielen samstags Fußball.
  en.a1.unit34.lesson01.teach.tennis:
    title: tennis
    gloss: Tennis
    note: '*tennis* bedeutet Tennis. Wie bei *soccer* verwenden Sie hier *play*: *play tennis*. Auch im Deutschen sagt man "Tennis spielen".'
    example_gloss: Sie spielt jedes Wochenende Tennis.
  en.a1.unit34.lesson01.teach.basketball:
    title: basketball
    gloss: Basketball
    note: '*basketball* bedeutet Basketball. Auch hier verwenden Sie *play*: *play basketball*, genau wie bei *soccer* und *tennis*. Bei Ballsportarten verwendet das Englische immer *play* + Sportart.'
    example_gloss: Sie spielen im Park Basketball.
  en.a1.unit34.lesson01.teach.swimming:
    title: swimming
    gloss: schwimmen
    note: '*swimming* bedeutet schwimmen. Hier ändert sich das Verb: *go swimming* (nicht *play swimming*). Das Englische verwendet *go* + die *-ing*-Form für Aktivitäten wie Schwimmen und Laufen. Das ähnelt dem Deutschen "schwimmen gehen", aber im Englischen steht dabei immer die *-ing*-Form.'
    example_gloss: Ich gehe zweimal pro Woche schwimmen.
  en.a1.unit34.lesson01.teach.yoga:
    title: yoga
    gloss: Yoga
    note: '*yoga* bedeutet Yoga. Das Verb ist *do*: *do yoga*. Das Englische verwendet *do* für individuelle Aktivitäten wie Yoga, nicht *play* und nicht *go*. Im Deutschen sagt man "Yoga machen", das Verb entspricht also ungefähr *do*. Beachten Sie, dass das Englische drei Verben hat (*play*, *go*, *do*), die Sie je nach Art des Sports lernen müssen.'
    example_gloss: Er macht morgens Yoga.
  en.a1.unit34.lesson01.teach.exercise:
    title: exercise
    gloss: Sport treiben
    note: '*exercise* bedeutet Sport treiben oder sich bewegen: ein allgemeines Wort für körperliche Aktivität. Anders als *soccer*, *swimming* und *yoga* können Sie *exercise* selbst als Verb verwenden, ohne *play*, *go* oder *do*: *Do you exercise every day?*'
    example_gloss: Treibst du jeden Tag Sport?
  en.a1.unit34.lesson02.teach.twice_a_week:
    title: twice a week
    gloss: zweimal pro Woche
    note: '*twice a week* bedeutet zweimal pro Woche. Das Wort *a* bedeutet hier nicht "ein", sondern "pro": Zahl + *a* + Zeiteinheit gibt an, wie oft etwas in diesem Zeitraum passiert. Im Deutschen sagt man dafür "pro" oder "in der" (zweimal pro Woche, zweimal in der Woche).'
    example_gloss: Er spielt zweimal pro Woche Tennis.
  en.a1.unit34.lesson02.teach.three_times_a_week:
    title: three times a week
    gloss: dreimal pro Woche
    note: '*three times a week* bedeutet dreimal pro Woche. Wie bei *twice a week* bedeutet *a* hier "pro", nicht "ein": *times* (Mal) plus *a week* (pro Woche) gibt an, wie oft pro Woche.'
    example_gloss: Sie schwimmt dreimal pro Woche.
  en.a1.unit34.lesson02.teach.on_weekends:
    title: on weekends
    gloss: am Wochenende
    note: '*on weekends* bedeutet am Wochenende. Das Englische verwendet *on* bei Wochentagen und Wochenenden; im Deutschen steht dafür "am" (am Wochenende). Beachten Sie die Mehrzahl: *weekends* bedeutet "an Wochenenden" im Allgemeinen.'
    example_gloss: Am Wochenende spielen wir Basketball.
  en.a1.unit34.lesson02.teach.gym:
    title: gym
    gloss: Fitnessstudio
    note: gym bedeutet Fitnessstudio, ein Ort mit Geräten und Kursen zum Trainieren.
    example_gloss: Er macht im Fitnessstudio Yoga.
  en.a1.unit34.lesson02.teach.pool:
    title: pool
    gloss: Schwimmbad
    note: pool bedeutet Schwimmbad, ein Ort voller Wasser zum Schwimmen.
    example_gloss: Ich schwimme im Schwimmbad.
  en.a1.unit34.lesson02.teach.how_often_question:
    title: How often do you exercise?
    gloss: Wie oft treibst du Sport?
    note: 'Diese Frage beginnt mit *how often* (wie oft). Danach kommt das Hilfsverb *do*, weil das Hauptverb *exercise* ist: dieselbe do-Umschreibung wie bei anderen englischen Fragen.'
  en.a1.unit34.lesson03.teach.dialogue_line1:
    title: Daniels Frage
    gloss: 'Daniel fragt: Hast du Lust, am Samstag mit uns Fußball zu spielen?'
    note: Beginn des Gesprächs mit einer Einladung zum Fußballspielen. Bei *soccer* verwenden Sie *play*.
  en.a1.unit34.lesson03.teach.dialogue_line2:
    title: "Leilas Antwort"
    gloss: 'Leila sagt: Ich mag Fußball nicht so gern. Ich schwimme lieber.'
    note: '*don''t really like* bedeutet "nicht so gern mögen": eine mildere Art, Nein zu sagen.'
  en.a1.unit34.lesson03.teach.dialogue_line3:
    title: "Daniels Antwort"
    gloss: 'Daniel sagt: Das ist in Ordnung! Wie oft gehst du schwimmen?'
    note: '*go swimming*: Bei Schwimmen verwenden Sie *go*, nicht *play* oder *do*.'
  en.a1.unit34.lesson03.teach.dialogue_line4:
    title: "Leilas Antwort"
    gloss: 'Leila sagt: Zweimal pro Woche, meistens im Schwimmbad bei mir in der Nähe.'
    note: '*Twice a week*: Auch hier bedeutet *a* "pro".'
  en.a1.unit34.lesson03.teach.dialogue_line5:
    title: "Daniels Antwort"
    gloss: 'Daniel sagt: Schön! Ich mache manchmal auch Yoga, aber Joggen ist immer noch mein Liebling.'
    note: '*do yoga*: Bei Yoga verwenden Sie *do*, getrennt von *play* und *go*.'
  en.a1.unit34.lesson04.teach.reading_passage:
    title: Text über Daniel, Leila und Mia
    gloss: Daniel, Leila und Mia bleiben alle auf ihre eigene Art aktiv. Daniel geht jeden Morgen vor der Arbeit joggen. Leila schwimmt lieber; sie geht zweimal pro Woche ins Schwimmbad. Mia ist neu im Team, aber sie spielt schon jeden Sonntag mit ihrer Nachbarin Tennis. Samstags spielen sie manchmal zusammen im Park Fußball, aber Fußball ist niemandes Lieblingssport.
    note: 'Dieser Text verwendet alle drei Verben: *goes running* (*go*), *plays tennis* und *play soccer* (*play*). Jede Sportart hat ihr eigenes Verb.'
