course:
  title: "Englisch A1"
  description: "Englisch auf A1-Niveau lernen, für Begrüßungen und kurze Gespräche im Alltag, mit ausführlichen deutschen Erklärungen."

units:
  en.a1.unit13.emotions: {title: "Über Gefühle sprechen"}

lessons:
  en.a1.unit13.lesson01.feeling_words: {title: "Übliche Gefühlswörter"}
  en.a1.unit13.lesson02.expressing_feelings_with_reasons: {title: "Sagen, wie man sich fühlt, und warum"}
  en.a1.unit13.lesson03.reading_a_message: {title: "Eine Nachricht über Gefühle lesen"}
  en.a1.unit13.lesson04.feelings_check_dialogue: {title: "Nach den Gefühlen einer Person fragen"}

teaching:
  en.a1.unit13.lesson01.teach.happy: {title: "happy", gloss: "glücklich / froh", note: "*happy* bedeutet glücklich.", example_gloss: "Ich bin heute glücklich."}
  en.a1.unit13.lesson01.teach.sad: {title: "sad", gloss: "traurig", note: "*sad* bedeutet traurig.", example_gloss: "Sie sieht traurig aus."}
  en.a1.unit13.lesson01.teach.tired: {title: "tired", gloss: "müde", note: "*tired* bedeutet müde.", example_gloss: "Ich bin sehr müde."}
  en.a1.unit13.lesson01.teach.excited: {title: "excited", gloss: "freudig aufgeregt / gespannt", note: "*excited* bedeutet freudig aufgeregt oder gespannt auf etwas Positives -- nicht nervös im negativen Sinn (dafür sagt man *worried*).", example_gloss: "Ich bin gespannt auf morgen."}
  en.a1.unit13.lesson01.teach.worried: {title: "worried", gloss: "besorgt", note: "*worried* bedeutet besorgt oder nervös wegen etwas, das passieren könnte.", example_gloss: "Er ist besorgt wegen morgen."}

  en.a1.unit13.lesson02.teach.how_are_you_feeling: {title: "How are you feeling today?", gloss: "Wie fühlst du dich heute?", note: "*How are you feeling?* fragt gezielt nach dem aktuellen Gefühlszustand, anders als das allgemeinere *How are you?*"}
  en.a1.unit13.lesson02.teach.im_worried_because: {title: "I'm a little worried because I have a big test tomorrow.", gloss: "Ich bin ein bisschen besorgt, weil ich morgen eine große Prüfung habe.", note: "*because* bedeutet 'weil' und leitet den Grund für das Gefühl ein."}
  en.a1.unit13.lesson02.teach.im_happy_because: {title: "I'm happy because the class is almost over.", gloss: "Ich bin froh, weil der Kurs fast vorbei ist.", note: "*almost over* bedeutet 'fast vorbei.'"}

  en.a1.unit13.lesson03.teach.message_text: {title: "Eine Nachricht über Gefühle", gloss: "Hallo, ich bin ein bisschen besorgt, weil ich morgen eine große Prüfung habe. Aber ich freue mich auch, weil es die letzte in diesem Jahr ist!", note: "Eine Nachricht kann mehrere, sogar gegensätzliche Gefühle in kurzen, verbundenen Sätzen ausdrücken."}
  en.a1.unit13.lesson03.teach.writer_summary: {title: "The writer is worried and excited.", gloss: "Der Schreiber ist besorgt und voller Vorfreude.", note: "*writer* bedeutet die Person, die die Nachricht geschrieben hat."}

  en.a1.unit13.lesson04.teach.i_understand: {title: "Oh, I understand.", gloss: "Oh, ich verstehe.", note: "*I understand* bedeutet 'ich verstehe' -- zeigt Mitgefühl beim Zuhören."}
  en.a1.unit13.lesson04.teach.q_feeling: {title: "Frage von Leila", gloss: "Leila: Wie fühlst du dich heute?", note: "Leila eröffnet das Gespräch, indem sie nach Daniels Gefühlen fragt."}
  en.a1.unit13.lesson04.teach.a_worried_test: {title: "Antwort von Daniel", gloss: "Daniel: Ich bin ein bisschen besorgt, weil ich morgen eine große Prüfung habe.", note: "Daniel nennt sein Gefühl und den Grund dafür."}
  en.a1.unit13.lesson04.teach.acknowledge_and_ask: {title: "Reaktion von Leila", gloss: "Leila: Oh, ich verstehe. Freust du dich auch?", note: "Leila zeigt Verständnis und fragt nach einem weiteren Gefühl."}
  en.a1.unit13.lesson04.teach.a_yes_happy_class: {title: "Antwort von Daniel", gloss: "Daniel: Ja, ein bisschen. Ich bin froh, dass der Kurs fast vorbei ist.", note: "Daniel bestätigt kurz und nennt ein zweites, positives Gefühl."}

exercises:
  en.a1.unit13.lesson01.exercise01.listen_feeling:
    instruction: "Hören Sie zu und wählen Sie das genannte Wort."
    correct_option: "tired"
    distractors: ["happy", "sad", "worried"]
    accepted_answers: [{value: "tired", status: "correct"}]
    feedback: "*tired* bedeutet müde."
  en.a1.unit13.lesson01.exercise02.choose_sad:
    instruction: "Das Gegenteil von glücklich ist..."
    correct_option: "sad"
    distractors: ["tired", "excited", "worried"]
    accepted_answers: [{value: "sad", status: "correct"}]
    feedback: "*sad* bedeutet traurig, das Gegenteil von *happy* (glücklich)."
  en.a1.unit13.lesson01.exercise03.choose_worried:
    instruction: "Welches Wort beschreibt das Gefühl, wegen etwas nervös zu sein, das passieren könnte?"
    correct_option: "worried"
    distractors: ["happy", "sad", "tired"]
    accepted_answers: [{value: "worried", status: "correct"}]
    feedback: "*worried* bedeutet besorgt."
  en.a1.unit13.lesson01.exercise04.match_feeling_words:
    instruction: "Verbinden Sie jedes englische Wort mit der richtigen deutschen Beschreibung."
    pairs:
      - {left: "happy", right: "sich gut fühlen"}
      - {left: "sad", right: "sich schlecht fühlen"}
      - {left: "tired", right: "Ruhe brauchen"}
      - {left: "excited", right: "sich auf etwas freuen"}
      - {left: "worried", right: "besorgt"}
      - {left: "today", right: "der gegenwärtige Tag"}
      - {left: "tomorrow", right: "der Tag direkt nach heute"}
    accepted_answers:
      - value:
          - {left: "happy", right: "sich gut fühlen"}
          - {left: "sad", right: "sich schlecht fühlen"}
          - {left: "tired", right: "Ruhe brauchen"}
          - {left: "excited", right: "sich auf etwas freuen"}
          - {left: "worried", right: "besorgt"}
          - {left: "today", right: "der gegenwärtige Tag"}
          - {left: "tomorrow", right: "der Tag direkt nach heute"}
        status: "correct"
    feedback: "happy=glücklich, sad=traurig, tired=müde, excited=aufgeregt, worried=besorgt, today=heute, tomorrow=morgen."
  en.a1.unit13.lesson01.exercise05.write_worried:
    instruction: "Schreiben Sie das Wort für das Gefühl, nervös wegen etwas zu sein, das passieren könnte."
    accepted_answers:
      - {value: "worried", status: "correct"}
      - {value: "worried.", status: "correct"}
    feedback: "*worried* bedeutet besorgt."

  en.a1.unit13.lesson02.exercise01.listen_feeling_question:
    instruction: "Hören Sie zu und wählen Sie die Frage, die Sie hören."
    correct_option: "How are you feeling today?"
    distractors: ["What time is it?", "What day is it today?", "What's the weather like today?"]
    accepted_answers: [{value: "How are you feeling today", status: "correct"}, {value: "How are you feeling today?", status: "correct"}]
    feedback: "*How are you feeling today?* bedeutet 'Wie fühlst du dich heute?'"
  en.a1.unit13.lesson02.exercise02.choose_feeling_answer:
    instruction: "Jemand fragt: 'How are you feeling today?' Sie sind ein bisschen besorgt wegen einer großen Prüfung morgen. Was antworten Sie?"
    correct_option: "I'm a little worried because I have a big test tomorrow."
    distractors: ["I'm happy because the class is almost over.", "I'm a little sad because I have a big test tomorrow.", "How are you feeling today?"]
    accepted_answers: [{value: "I'm a little worried because I have a big test tomorrow.", status: "correct"}]
    feedback: "*I'm a little worried because I have a big test tomorrow* bedeutet 'Ich bin ein bisschen besorgt, weil ich morgen eine große Prüfung habe.'"
  en.a1.unit13.lesson02.exercise03.order_happy_because:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um zu sagen, dass Sie glücklich sind, weil der Kurs fast vorbei ist."
    accepted_answers: [{value: ["I'm", "happy", "because", "the", "class", "is", "almost", "over"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *I'm happy because the class is almost over.*"
  en.a1.unit13.lesson02.exercise04.reply_feeling_reason:
    instruction: "Jemand fragt: 'How are you feeling today?' Antworten Sie, dass Sie ein bisschen besorgt sind, weil Sie morgen eine große Prüfung haben."
    accepted_answers:
      - {value: "I'm a little worried because I have a big test tomorrow.", status: "correct"}
      - {value: "I'm a little worried because I have a big test tomorrow", status: "correct"}
      - {value: "I am a little worried because I have a big test tomorrow.", status: "correct"}
      - {value: "I'm a little worried because tomorrow I have a big test.", status: "correct"}
      - {value: "I am a little worried because tomorrow I have a big test.", status: "correct"}
    feedback: "*I'm a little worried because I have a big test tomorrow* bedeutet 'Ich bin ein bisschen besorgt, weil ich morgen eine große Prüfung habe.'"
  en.a1.unit13.lesson02.exercise05.write_feeling:
    instruction: "Schreiben Sie, dass Sie glücklich sind, weil der Kurs fast vorbei ist."
    accepted_answers:
      - {value: "I'm happy because the class is almost over", status: "correct"}
      - {value: "I'm happy because the class is almost over.", status: "correct"}
      - {value: "I am happy because the class is almost over.", status: "correct"}
      - {value: "I'm happy the class is almost over.", status: "correct"}
      - {value: "I am happy the class is almost over.", status: "correct"}
    feedback: "*I'm happy because the class is almost over* bedeutet 'Ich bin froh, weil der Kurs fast vorbei ist.'"

  en.a1.unit13.lesson03.exercise01.read_worry_reason:
    instruction: "Warum ist der Schreiber besorgt?"
    correct_option: "big test tomorrow"
    distractors: ["it's the last one this year", "the class is almost over", "feeling tired"]
    accepted_answers: [{value: "big test tomorrow", status: "correct"}]
    feedback: "Die Nachricht sagt: *I'm a little worried because I have a big test tomorrow* -- wegen der Prüfung morgen."
  en.a1.unit13.lesson03.exercise02.read_excited_reason:
    instruction: "Warum freut sich der Schreiber auch?"
    correct_option: "it's the last one this year"
    distractors: ["big test tomorrow", "the class is almost over", "feeling worried"]
    accepted_answers: [{value: "it's the last one this year", status: "correct"}]
    feedback: "Die Nachricht sagt: *I'm also excited because it's the last one this year* -- weil es die letzte Prüfung in diesem Jahr ist."
  en.a1.unit13.lesson03.exercise03.choose_both_feelings:
    instruction: "Welche zwei Gefühle erwähnt der Schreiber?"
    correct_option: "worried and excited"
    distractors: ["happy and sad", "tired and worried", "sad and excited"]
    accepted_answers: [{value: "worried and excited", status: "correct"}]
    feedback: "Der Schreiber ist *worried and excited* -- besorgt und voller Vorfreude."
  en.a1.unit13.lesson03.exercise04.order_message_sentence:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um zu sagen, dass Sie morgen eine große Prüfung haben."
    accepted_answers: [{value: ["I", "have", "a", "big", "test", "tomorrow"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *I have a big test tomorrow.*"
  en.a1.unit13.lesson03.exercise05.write_message_summary:
    instruction: "Schreiben Sie in einem Satz, der mit 'The writer' beginnt, welche zwei Gefühle der Schreiber hat."
    accepted_answers:
      - {value: "The writer is worried and excited", status: "correct"}
      - {value: "The writer is worried and excited.", status: "correct"}
      - {value: "The writer is excited and worried.", status: "correct"}
      - {value: "The writer feels worried and excited.", status: "correct"}
      - {value: "The writer feels excited and worried.", status: "correct"}
      - {value: "The writer is worried and also excited.", status: "correct"}
    feedback: "*The writer is worried and excited* bedeutet 'Der Schreiber ist besorgt und voller Vorfreude.'"

  en.a1.unit13.lesson04.exercise01.listen_daniels_feeling:
    instruction: "Hören Sie das Gespräch. Wie fühlt sich Daniel und warum?"
    correct_option: "I'm a little worried because I have a big test tomorrow"
    distractors: ["I'm a little sad because I have a big test tomorrow", "I'm a little tired because I have a big test tomorrow", "I'm a little worried because the class is almost over"]
    accepted_answers: [{value: "I'm a little worried because I have a big test tomorrow", status: "correct"}]
    feedback: "Daniel sagt: *I'm a little worried because I have a big test tomorrow* -- er ist besorgt wegen der Prüfung."
  en.a1.unit13.lesson04.exercise02.listen_happy_reason:
    instruction: "Hören Sie noch einmal. Warum ist Daniel froh?"
    correct_option: "the class is almost over"
    distractors: ["the test is over", "the class is tomorrow", "the test is almost over"]
    accepted_answers: [{value: "the class is almost over", status: "correct"}]
    feedback: "Daniel sagt: *I'm happy the class is almost over* -- er ist froh, dass der Kurs fast vorbei ist."
  en.a1.unit13.lesson04.exercise03.choose_leila_response:
    instruction: "Nachdem sie gehört hat, dass Daniel besorgt ist, was sagt Leila?"
    correct_option: "Oh, I understand. Are you excited too?"
    distractors: ["I'm happy the class is almost over.", "How are you feeling today?", "Yes, a little."]
    accepted_answers: [{value: "Oh, I understand. Are you excited too?", status: "correct"}]
    feedback: "*Oh, I understand. Are you excited too?* bedeutet 'Oh, ich verstehe. Freust du dich auch?'"
  en.a1.unit13.lesson04.exercise04.order_q_feeling:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um zu fragen, wie sich jemand heute fühlt."
    accepted_answers: [{value: ["How", "are", "you", "feeling", "today"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *How are you feeling today?*"
  en.a1.unit13.lesson04.exercise05.reply_as_daniel:
    instruction: "Antworten Sie als Daniel auf Leilas Fragen: Sagen Sie, dass Sie wegen einer großen Prüfung morgen ein bisschen besorgt sind, antworten Sie auf die zweite Frage mit 'ja, ein bisschen' und sagen Sie, dass Sie froh sind, weil der Kurs fast vorbei ist."
    accepted_answers:
      - {value: "I'm a little worried because I have a big test tomorrow. Yes, a little. I'm happy the class is almost over.", status: "correct"}
      - {value: "I'm a little worried because I have a big test tomorrow, and yes, a little, I'm happy the class is almost over.", status: "correct"}
      - {value: "I'm a little worried because I have a big test tomorrow Yes a little I'm happy the class is almost over", status: "correct"}
      - {value: "I'm a little worried because I have a big test tomorrow. Yes, a little. I'm happy because the class is almost over.", status: "correct"}
      - {value: "I am a little worried because I have a big test tomorrow. Yes, a little. I am happy the class is almost over.", status: "correct"}
      - {value: "I am a little worried because I have a big test tomorrow. Yes, a little. I am happy because the class is almost over.", status: "correct"}
    feedback: "Eine vollständige Antwort nennt die Sorge und ihren Grund, bestätigt kurz und nennt ein zweites, positives Gefühl."
  en.a1.unit13.lesson04.exercise06.speak_feelings:
    instruction: "Antworten Sie laut als Daniel auf Leilas Fragen: Sagen Sie, dass Sie wegen einer großen Prüfung morgen ein bisschen besorgt sind, antworten Sie auf die zweite Frage mit 'ja, ein bisschen' und sagen Sie, dass Sie froh sind, weil der Kurs fast vorbei ist."
    accepted_answers:
      - {value: "I'm a little worried because I have a big test tomorrow Yes a little I'm happy the class is almost over", status: "correct"}
      - {value: "I'm a little worried because I have a big test tomorrow. Yes, a little. I'm happy the class is almost over.", status: "correct"}
      - {value: "I'm a little worried because I have a big test tomorrow. Yes, a little. I'm happy because the class is almost over.", status: "correct"}
      - {value: "I am a little worried because I have a big test tomorrow. Yes, a little. I am happy the class is almost over.", status: "correct"}
      - {value: "I am a little worried because I have a big test tomorrow. Yes, a little. I am happy because the class is almost over.", status: "correct"}
    feedback: "Diese vollständige Antwort deckt die Sorge, die Bestätigung und das positive Gefühl ab."
