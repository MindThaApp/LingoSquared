  en.a1.unit31.lesson02.teach.glasses:
    title: glasses
    gloss: eine Brille
    note: '*glasses* bedeutet Brille. Das Wort steht immer im Plural; *wears glasses* bedeutet ''trägt eine Brille''.'
    example_gloss: Mein Vater trägt eine Brille.
  en.a1.unit31.lesson02.teach.what_look_like:
    title: What does she look like?
    gloss: Wie sieht sie aus?
    note: 'Achten Sie auf den Satzbau: Im Deutschen drehen Sie für eine Frage einfach Subjekt und Verb um (*Wie sieht sie aus?*), ohne Hilfsverb. Im Englischen brauchen Sie bei einem normalen Verb (*look*) immer *does* oder *do*: *What does she look like?*, nie *What looks she like?*. Das Hilfsverb *does* (do-Umschreibung) vergessen deutsche Lernende am häufigsten.'
  en.a1.unit31.lesson03.teach.dialogue_line1:
    title: Leilas Einstieg
    gloss: 'Leila sagt: Wir haben heute eine neue Kollegin. Sie heißt Mia.'
    note: '*starting today* bedeutet ''ab heute''.'
  en.a1.unit31.lesson03.teach.dialogue_line2:
    title: Daniels Frage
    gloss: 'Daniel fragt: Wie sieht sie aus?'
    note: 'Noch einmal die do-Umschreibung: Lassen Sie *does* nicht weg und drehen Sie Subjekt und Verb nicht einfach um wie im Deutschen.'
  en.a1.unit31.lesson03.teach.dialogue_line3:
    title: Leilas Beschreibung
    gloss: 'Leila sagt: Sie ist groß und hat lockiges, blondes Haar.'
    note: '*She''s* ist die Kurzform von *she is*.'
  en.a1.unit31.lesson03.teach.dialogue_line4:
    title: Daniels Nachfrage
    gloss: 'Daniel fragt: Trägt sie eine Brille?'
    note: 'Auch hier brauchen Sie die do-Umschreibung: *Does she wear glasses?*, nicht *Wears she glasses?*.'
  en.a1.unit31.lesson03.teach.dialogue_line5:
    title: Leilas Antwort
    gloss: 'Leila sagt: Ja, tut sie. Sie hat auch grüne Augen.'
    note: '*Yes, she does* ist eine kurze bejahende Antwort, in der das Hilfsverb *does* wiederholt wird.'
  en.a1.unit31.lesson03.teach.dialogue_line6:
    title: Daniels letzte Bemerkung
    gloss: 'Daniel sagt: Okay, ich glaube, ich sehe sie jetzt an der Tür.'
    note: '*at the door* bedeutet an der Tür.'
  en.a1.unit31.lesson04.teach.reading_passage:
    title: Text über Daniel und Leila
    gloss: Daniel und Leila sind gute Freunde, aber sie sehen nicht gleich aus. Daniel ist groß und hat kurzes, schwarzes Haar. Er trägt eine Brille. Leila ist klein und hat langes, lockiges, braunes Haar. Sie hat blaue Augen, und Daniel hat braune Augen. Beide lachen viel.
    note: '*don''t look the same* bedeutet ''sehen nicht gleich aus''. Auch hier brauchen Sie die do-Umschreibung (*don''t* = *do not*), sogar in der Verneinung.'
