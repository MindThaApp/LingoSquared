teaching:
  en.b2.unit04.lesson01.teach.background:
    title: background
    gloss: Hintergrund
    note: '*background* ist das, was schon im Gange war oder den Kontext liefert. In englischen Erzählungen steht der Hintergrund oft in der past continuous.'
    example_gloss: Hintergrundinformationen sagen, was schon im Gange war.
  en.b2.unit04.lesson01.teach.foreground:
    title: foreground
    gloss: Haupthandlung, Vordergrund
    note: '*foreground* ist das Ereignis, auf das die Geschichte zusteuert. Im Englischen steht es oft in der simple past, nicht automatisch im present perfect.'
    example_gloss: Das Vordergrundereignis ist das wichtigste Ereignis der Geschichte.
  en.b2.unit04.lesson01.teach.prior:
    title: prior
    gloss: früher, vorausgehend
    note: '*prior* bedeutet früher als ein anderer Zeitpunkt in der Vergangenheit. Dafür steht oft die past perfect: *had moved*.'
    example_gloss: Ein früheres Ereignis geschah vor einem anderen Ereignis in der Vergangenheit.
  en.b2.unit04.lesson01.teach.interrupt:
    title: interrupt
    gloss: unterbrechen
    note: '*interrupt* verwenden Sie, wenn ein kurzes Ereignis in etwas hineinplatzt, das gerade im Gange war.'
    example_gloss: Ein plötzliches Problem kann eine Handlung unterbrechen.
  en.b2.unit04.lesson01.teach.ongoing:
    title: ongoing
    gloss: laufend, andauernd
    note: '*ongoing* passt zu einer Handlung, die gerade im Gange ist. Im Englischen steht dafür oft *was/were + -ing*.'
    example_gloss: Eine laufende Handlung dauert eine Zeit lang.
  en.b2.unit04.lesson01.teach.chronology:
    title: chronology
    gloss: Chronologie, tatsächliche Reihenfolge
    note: '*chronology* ist die tatsächliche Reihenfolge der Ereignisse, auch wenn die Geschichte sie in anderer Reihenfolge erzählt.'
    example_gloss: Die Chronologie ist die tatsächliche Reihenfolge der Ereignisse.
  en.b2.unit04.lesson02.teach.by_the_time:
    title: Etwas war schon vorher geschehen
    gloss: Als ich ankam, hatte der Koordinator die Ausrüstung schon nach drinnen gebracht.
    note: '*had already moved* zeigt, dass dies vor *I arrived* geschah. Wie im Deutschen steht hier das Plusquamperfekt (hatte ... gebracht); sagen Sie im Englischen also nicht *has moved*, sondern *had moved*.'
  en.b2.unit04.lesson02.teach.while_checking:
    title: Laufende Handlung plus Unterbrechung
    gloss: Während ich die Tonanlage überprüfte, fiel der Strom aus.
    note: '*was checking* drückt die laufende Handlung aus, die im Deutschen meist einfach „überprüfte“ heißt. Die Unterbrechung selbst steht in der simple past: *went out*.'
  en.b2.unit04.lesson02.teach.when_arrived_setting:
    title: Ankunft während einer Hintergrundhandlung
    gloss: Als ich ankam, stellten die Freiwilligen gerade die Stühle auf.
    note: Verwenden Sie *were setting up* für das, was im Gange war, als das Hauptereignis eintrat.
  en.b2.unit04.lesson02.teach.grammar_shifted_time:
    title: Zeitebenen in einer Erzählung
    gloss: Verwenden Sie die past continuous für Hintergrundhandlungen, die simple past für Hauptereignisse und die past perfect für das, was schon vorher geschehen war.
    note: 'Im Deutschen erzählt man mündlich oft im Perfekt („der Strom ist ausgefallen“). Im erzählenden Englisch verwenden Sie dagegen meist die simple past: *the power went out*, nicht *has gone out*.'
  en.b2.unit04.lesson03.teach.venue:
    title: venue
    gloss: Veranstaltungsort
    note: '*venue* ist der Ort, an dem eine Veranstaltung stattfindet.'
    example_gloss: Der Veranstaltungsort ist der Ort, an dem eine Veranstaltung stattfindet.
  en.b2.unit04.lesson03.teach.delayed:
    title: delayed
    gloss: verspätet, verschoben
    note: '*delayed* bedeutet, dass etwas später beginnt oder geschieht als geplant.'
    example_gloss: Die Veranstaltung begann zwanzig Minuten später.
  en.b2.unit04.lesson03.teach.reading_passage:
    title: 'Lesetext: das Problem am Veranstaltungsort'
    gloss: Simon erzählte die Geschichte nicht in streng chronologischer Reihenfolge. Bevor er am Veranstaltungsort ankam, hatte der Koordinator die Ausrüstung nach drinnen gebracht, weil Regen erwartet wurde. Als Simon ankam, stellten die Freiwilligen gerade Stühle auf. Während er die Tonanlage überprüfte, fiel der Strom aus. Er rief den Hausmeister an, der erklärte, dass früher an diesem Morgen ein Reparaturtrupp in der Nähe gearbeitet hatte. Das Team verschob den Beginn um zwanzig Minuten, aber als die Gäste eintraten, war das Licht wieder angegangen.
    note: 'Achten Sie auf die englischen Zeitebenen: *had moved* für das Frühere, *were setting up* für den Hintergrund und *went out* für das Hauptereignis.'
  en.b2.unit04.lesson04.teach.q_walk_me_through:
    title: Harper bittet um die Geschichte
    gloss: 'Harper fragt: Kannst du mir Schritt für Schritt erzählen, was am Veranstaltungsort passiert ist?'
    note: '*walk me through* bedeutet, jemanden Schritt für Schritt durch ein Ereignis zu führen.'
  en.b2.unit04.lesson04.teach.a_arrived_volunteers:
    title: Simon verbindet Zeitebenen
    gloss: 'Simon sagt: Klar. Als ich ankam, stellten die Freiwilligen gerade die Stühle auf, aber der Koordinator hatte die Ausrüstung schon nach drinnen gebracht, weil Regen erwartet wurde.'
    note: Eine gute Erzählung verbindet eine Hintergrundhandlung mit einem früheren Ereignis.
  en.b2.unit04.lesson04.teach.q_equipment_safe:
    title: Harper prüft die Reihenfolge
    gloss: 'Harper fragt: Die Ausrüstung war also in Sicherheit, bevor du dort ankamst?'
    note: 'Die Frage betrifft die Reihenfolge: Die Ausrüstung war schon vor Simons Ankunft in Sicherheit.'
  en.b2.unit04.lesson04.teach.a_power_went_out:
    title: Simon nennt die Unterbrechung
    gloss: 'Simon sagt: Genau. Dann, während ich die Tonanlage überprüfte, fiel der Strom aus.'
    note: '*while I was checking* ist die laufende Handlung; *the power went out* ist die Unterbrechung.'
  en.b2.unit04.lesson04.teach.q_after_that:
    title: Harper fragt nach dem nächsten Schritt
    gloss: 'Harper fragt: Was hast du danach gemacht?'
    note: '*What did you do...?* verwendet die simple past mit *did* für eine Frage nach einem abgeschlossenen Schritt.'
  en.b2.unit04.lesson04.teach.a_repair_crew:
    title: Simon berichtet früheren Hintergrund
    gloss: 'Simon sagt: Ich rief den Hausmeister an, und sie sagte mir, dass früher an diesem Morgen ein Reparaturtrupp in der Nähe gearbeitet hatte.'
    note: '*had been working* zeigt, dass diese Arbeit früher am Morgen schon eine Zeit lang im Gange war.'
  en.b2.unit04.lesson04.teach.q_event:
    title: Harper fragt nach der Veranstaltung
    gloss: 'Harper fragt: Und die Veranstaltung?'
    note: Die kurze Frage verlangt nach der Folge für die Veranstaltung.
  en.b2.unit04.lesson04.teach.a_delayed_start:
    title: Simon schließt ab
    gloss: 'Simon sagt: Wir verschoben den Beginn um zwanzig Minuten, aber als die Gäste eintraten, war das Licht wieder angegangen.'
    note: '*had come back on* geschah vor dem Moment, in dem die Gäste eintraten.'
