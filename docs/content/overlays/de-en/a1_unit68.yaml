  en.a1.unit68.lesson04.teach.reading_passage:
    title: 'Text: Freunde, die teilen'
    gloss: 'Freunde, die teilen: Es regnete, deshalb fragte Leila Mia nach einem Regenschirm. Mia sagte, sie könne ihn Leila leihen. Mia bat Leila, ihn morgen zurückzugeben. Dann brauchte Mia ein Ladegerät. Leila lieh Mia ein Ladegerät. Beide Freundinnen schrieben einen kurzen Zettel, damit sie sich merken konnten, was sie zurückgeben mussten.'
    note: '*lent* ist die Vergangenheitsform von *lend*.'
