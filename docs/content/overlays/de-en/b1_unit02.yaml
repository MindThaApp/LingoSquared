course:
  title: "Englisch B1"
  description: "Englisch auf B1-Niveau lernen, für Pflichten, Möglichkeiten, hypothetische Situationen und Erzählungen im Alltag, mit ausführlichen deutschen Erklärungen."

units:
  en.b1.unit02.abilities: {title: "Was ich tun kann"}

lessons:
  en.b1.unit02.lesson01.ability_vocabulary: {title: "Be able to und manage to"}
  en.b1.unit02.lesson02.present_and_past_ability: {title: "I am able to, I was able to"}
  en.b1.unit02.lesson03.reading_the_new_system: {title: "Lesen: das neue Online-System"}
  en.b1.unit02.lesson04.the_license_dialogue: {title: "Were you able to renew it?"}

teaching:
  en.b1.unit02.lesson01.teach.be_able_to: {title: "be able to", gloss: "in der Lage sein / können", note: "*be able to* bedeutet, dass man die Fähigkeit oder Gelegenheit hat, etwas zu tun.", example_gloss: "Ich kann meinen Führerschein online verlängern."}
  en.b1.unit02.lesson01.teach.manage_to: {title: "manage to", gloss: "es schaffen, etwas zu tun", note: "*manage to* bedeutet, dass etwas gelingt, oft trotz etwas Mühe.", example_gloss: "Ich habe es geschafft, das Formular in zehn Minuten fertigzustellen."}
  en.b1.unit02.lesson01.teach.renew: {title: "renew", gloss: "verlängern / erneuern", note: "*renew* bedeutet, ein Dokument zu verlängern, bevor es abläuft.", example_gloss: "Ich muss meinen Führerschein verlängern."}
  en.b1.unit02.lesson01.teach.license: {title: "license", gloss: "Führerschein", note: "*license* bedeutet hier ein offizielles Dokument, mit dem man fahren darf.", example_gloss: "Mein Führerschein läuft diesen Monat ab."}
  en.b1.unit02.lesson01.teach.online: {title: "online", gloss: "online", note: "*online* bedeutet über das Internet, nicht an einem physischen Ort.", example_gloss: "Man kann ihn jetzt online verlängern."}
  en.b1.unit02.lesson01.teach.in_person: {title: "in person", gloss: "persönlich / vor Ort", note: "*in person* bedeutet, selbst irgendwohin zu gehen, nicht online.", example_gloss: "Letztes Jahr musste ich persönlich hingehen."}

  en.b1.unit02.lesson02.teach.am_able_to_renew_online: {title: "eine gegenwärtige Möglichkeit ausdrücken", gloss: "Ich kann meinen Führerschein jetzt online verlängern.", note: "*I am able to* drückt eine Möglichkeit in der Gegenwart aus."}
  en.b1.unit02.lesson02.teach.was_not_able_to_last_year: {title: "eine vergangene Möglichkeit verneinen", gloss: "Letztes Jahr konnte ich es nicht online erledigen.", note: "*was not able to* drückt aus, dass eine Möglichkeit in der Vergangenheit nicht bestand."}
  en.b1.unit02.lesson02.teach.managed_to_finish: {title: "sagen, dass etwas gelungen ist", gloss: "Ich habe es geschafft, das Formular in zehn Minuten fertigzustellen.", note: "*managed to* betont, dass etwas gelungen ist, oft trotz Mühe."}
  en.b1.unit02.lesson02.teach.grammar_present_past: {title: "Gegenwart und Vergangenheit mit 'be able to'", gloss: "Ich kann ihn verlängern. Ich konnte ihn verlängern. Ich könnte dir helfen.", note: "*am able to* (jetzt), *was able to* (Vergangenheit), *would be able to* (hypothetisch oder als Angebot) sind Formen derselben Konstruktion."}

  en.b1.unit02.lesson03.teach.friend: {title: "friend", gloss: "Freund(in)", note: "*friend* bedeutet Freund oder Freundin.", example_gloss: "Meine Freundin hat ihren Führerschein letzte Woche verlängert."}
  en.b1.unit02.lesson03.teach.system: {title: "system", gloss: "System", note: "*system* bedeutet eine organisierte Art, etwas zu tun.", example_gloss: "Das neue System ist viel schneller."}
  en.b1.unit02.lesson03.teach.reading_passage: {title: "Lesetext: das neue System", gloss: "Letztes Jahr konnten die Leute ihre Führerscheine nicht online verlängern. Alle mussten persönlich ins Büro gehen. Dieses Jahr hat sich das System geändert. Jetzt können die Leute alles von zu Hause aus verlängern. Meine Freundin Mia konnte ihren in zehn Minuten fertigstellen.", note: "Ein kurzer Lesetext darüber, wie das neue System das Verlängern einfacher macht."}

  en.b1.unit02.lesson04.teach.q_were_you_able: {title: "Leila fragt nach dem Führerschein", gloss: "Leila sagt: Konntest du deinen Führerschein online verlängern?", note: "*were you able to* fragt nach einer Möglichkeit in der Vergangenheit."}
  en.b1.unit02.lesson04.teach.a_wasnt_able_office: {title: "Daniels Antwort: online ging es nicht", gloss: "Daniel sagt: Nein, das konnte ich nicht. Ich musste persönlich ins Büro gehen.", note: "*wasn't able to* ist die gesprochene Kurzform von *was not able to*."}
  en.b1.unit02.lesson04.teach.q_really_managed: {title: "Leila erzählt von ihrer Erfahrung", gloss: "Leila sagt: Wirklich? Ich habe es geschafft, es online in zehn Minuten zu erledigen.", note: "*managed to* betont, dass es Leila schnell und problemlos gelungen ist."}
  en.b1.unit02.lesson04.teach.a_next_time_save: {title: "Daniel denkt an nächstes Mal", gloss: "Daniel sagt: Nächstes Mal könnte ich Zeit sparen, wenn ich es auch online machen würde.", note: "*would be able to* drückt hier eine hypothetische Möglichkeit in der Zukunft aus."}
  en.b1.unit02.lesson04.teach.q_would_help: {title: "Leila bietet Hilfe an", gloss: "Leila sagt: Ich könnte dir nächstes Mal helfen, wenn du möchtest.", note: "*would be able to* wird hier für ein höfliches Angebot verwendet."}
  en.b1.unit02.lesson04.teach.a_thanks: {title: "Daniel bedankt sich", gloss: "Daniel sagt: Danke, das wäre schön.", note: "*I'd like that* ist eine natürliche Art, ein Angebot dankbar anzunehmen."}

exercises:
  en.b1.unit02.lesson01.exercise01.listen_word:
    instruction: "Hören Sie zu und wählen Sie das genannte Wort."
    correct_option: "license"
    distractors: ["renew", "online", "in person"]
    accepted_answers: [{value: "license", status: "correct"}]
    feedback: "*license* bedeutet Führerschein."
  en.b1.unit02.lesson01.exercise02.choose_get_new_document_word:
    instruction: "Welches Wort bedeutet, ein Dokument zu verlängern, bevor es abläuft?"
    correct_option: "renew"
    distractors: ["manage to", "license", "online"]
    accepted_answers: [{value: "renew", status: "correct"}]
    feedback: "*renew* bedeutet verlängern."
  en.b1.unit02.lesson01.exercise03.choose_by_going_yourself_phrase:
    instruction: "Welche Wendung bedeutet, selbst irgendwohin zu gehen, nicht online?"
    correct_option: "in person"
    distractors: ["be able to", "renew", "online"]
    accepted_answers: [{value: "in person", status: "correct"}]
    feedback: "*in person* bedeutet persönlich oder vor Ort."
  en.b1.unit02.lesson01.exercise04.match_ability_words:
    instruction: "Verbinden Sie jede Bedeutung mit dem richtigen englischen Wort oder Ausdruck."
    accepted_answers:
      - value:
          - {left: "to have the ability or opportunity to do something", right: "be able to"}
          - {left: "to succeed in doing something, often with some difficulty", right: "manage to"}
          - {left: "to get a document extended before it expires", right: "renew"}
          - {left: "an official document that lets you drive", right: "license"}
          - {left: "using the internet, not in a physical place", right: "online"}
          - {left: "by going somewhere yourself", right: "in person"}
        status: "correct"
    feedback: "*be able to*=können, *manage to*=es schaffen, *renew*=verlängern, *license*=Führerschein, *online*=online, *in person*=persönlich."
  en.b1.unit02.lesson01.exercise05.write_renew:
    instruction: "Schreiben Sie das Wort dafür, ein Dokument zu verlängern, bevor es abläuft."
    accepted_answers:
      - {value: "renew", status: "correct"}
      - {value: "Renew", status: "correct"}
    feedback: "*renew* bedeutet verlängern."

  en.b1.unit02.lesson02.exercise01.choose_present_ability:
    instruction: "Welcher Satz sagt, dass Sie Ihren Führerschein jetzt online verlängern können, also in der Gegenwart?"
    correct_option: "I am able to renew my license online now."
    distractors: ["Last year, I was not able to do it online.", "I managed to finish the form in ten minutes.", "I would be able to help you."]
    accepted_answers: [{value: "I am able to renew my license online now.", status: "correct"}]
    feedback: "*I am able to* drückt eine gegenwärtige Möglichkeit aus."
  en.b1.unit02.lesson02.exercise02.choose_past_ability:
    instruction: "Welcher Satz spricht über letztes Jahr, also über die Vergangenheit?"
    correct_option: "Last year, I was not able to do it online."
    distractors: ["I am able to renew my license online now.", "I managed to finish the form in ten minutes.", "I would be able to help you."]
    accepted_answers: [{value: "Last year, I was not able to do it online.", status: "correct"}]
    feedback: "*was not able to* drückt eine Möglichkeit in der Vergangenheit aus, die damals nicht bestand."
  en.b1.unit02.lesson02.exercise03.order_managed_to_finish:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge für 'ich habe es geschafft, das Formular in zehn Minuten fertigzustellen'."
    accepted_answers: [{value: ["I", "managed", "to", "finish", "the", "form", "in", "ten", "minutes"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *I managed to finish the form in ten minutes*."
  en.b1.unit02.lesson02.exercise04.reply_were_you_able_to_renew:
    instruction: "Jemand fragt, ob Sie Ihren Führerschein jetzt online verlängern können. Antworten Sie mit *am able to*, dass Sie das jetzt können."
    accepted_answers:
      - {value: "I am able to renew my license online now.", status: "correct"}
      - {value: "I am able to renew my license online now", status: "correct"}
      - {value: "I'm able to renew my license online now.", status: "correct"}
      - {value: "I'm able to renew my license online now", status: "correct"}
    feedback: "*I am able to renew my license online now* ist die akzeptierte Antwort; *I'm* ist die gesprochene Kurzform von *I am*."
  en.b1.unit02.lesson02.exercise05.write_managed_to_finish:
    instruction: "Schreiben Sie mit *managed to*, dass Sie es geschafft haben, das Formular in zehn Minuten fertigzustellen."
    accepted_answers:
      - {value: "I managed to finish the form in ten minutes.", status: "correct"}
      - {value: "I managed to finish the form in ten minutes", status: "correct"}
    feedback: "*I managed to finish the form in ten minutes* bedeutet, dass es Ihnen gelungen ist, es schnell fertigzustellen."

  en.b1.unit02.lesson03.exercise01.comprehend_last_year:
    instruction: "Was mussten alle letztes Jahr tun, um ihren Führerschein zu verlängern?"
    correct_option: "go to the office in person"
    distractors: ["renew everything from home", "finish it in ten minutes", "use the new system"]
    accepted_answers: [{value: "go to the office in person", status: "correct"}]
    feedback: "Der Text sagt *go to the office in person*."
  en.b1.unit02.lesson03.exercise02.comprehend_mia_time:
    instruction: "Wie lange brauchte Mia, um ihren fertigzustellen?"
    correct_option: "ten minutes"
    distractors: ["ten seconds", "one hour", "one week"]
    accepted_answers: [{value: "ten minutes", status: "correct"}]
    feedback: "Der Text sagt *ten minutes*."
  en.b1.unit02.lesson03.exercise03.recognize_system:
    instruction: "Welches Wort bedeutet eine organisierte Art, etwas zu tun?"
    correct_option: "system"
    distractors: ["friend", "license", "renew"]
    accepted_answers: [{value: "system", status: "correct"}]
    feedback: "*system* bedeutet System."
  en.b1.unit02.lesson03.exercise04.order_mia_was_able_to_finish:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge für 'Mia konnte ihren in zehn Minuten fertigstellen'."
    accepted_answers: [{value: ["Mia", "was", "able", "to", "finish", "hers", "in", "ten", "minutes"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *Mia was able to finish hers in ten minutes*."
  en.b1.unit02.lesson03.exercise05.write_friend_renewed:
    instruction: "Schreiben Sie mit *was able to*, dass Ihr Freund oder Ihre Freundin es online fertigstellen konnte."
    accepted_answers:
      - {value: "My friend was able to finish it online.", status: "correct"}
      - {value: "My friend was able to finish it online", status: "correct"}
    feedback: "*My friend was able to finish it online* bedeutet, dass es Ihrem Freund oder Ihrer Freundin online gelungen ist."

  en.b1.unit02.lesson04.exercise01.listen_daniel_couldnt_online:
    instruction: "Hören Sie das Gespräch und wählen Sie, was Daniel tun musste, weil es online nicht ging."
    correct_option: "go to the office in person"
    distractors: ["call the office by phone", "wait until next year", "ask Leila to do it for him"]
    accepted_answers: [{value: "go to the office in person", status: "correct"}]
    feedback: "Daniel sagt *I had to go to the office in person*."
  en.b1.unit02.lesson04.exercise02.listen_leilas_time:
    instruction: "Hören Sie zu und wählen Sie, wie lange Leila brauchte, um es online zu erledigen."
    correct_option: "ten minutes"
    distractors: ["ten seconds", "one hour", "one week"]
    accepted_answers: [{value: "ten minutes", status: "correct"}]
    feedback: "Leila sagt *ten minutes*."
  en.b1.unit02.lesson04.exercise03.choose_leilas_offer:
    instruction: "Was bietet Leila für nächstes Mal an?"
    correct_option: "I would be able to help you next time, if you want."
    distractors: ["I would be able to renew it for you.", "I would be able to call the office for you.", "I would be able to finish your form today."]
    accepted_answers: [{value: "I would be able to help you next time, if you want.", status: "correct"}]
    feedback: "Leila sagt *I would be able to help you next time, if you want*."
  en.b1.unit02.lesson04.exercise04.order_i_wasnt_able_to:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge für 'ich konnte es nicht online erledigen'."
    accepted_answers: [{value: ["I", "wasn't", "able", "to", "do", "it", "online"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *I wasn't able to do it online*."
  en.b1.unit02.lesson04.exercise05.reply_as_daniel:
    instruction: "Leila fragt: Konntest du deinen Führerschein online verlängern? Antworten Sie als Daniel: Sagen Sie mit *wasn't able to*, dass es nicht ging und dass Sie persönlich ins Büro gehen mussten."
    accepted_answers:
      - {value: "No, I wasn't able to. I had to go to the office in person.", status: "correct"}
      - {value: "No, I was not able to. I had to go to the office in person.", status: "correct"}
    feedback: "*No, I wasn't able to. I had to go to the office in person.* ist die akzeptierte Antwort; *wasn't* ist die Kurzform von *was not*."
  en.b1.unit02.lesson04.exercise06.speak_ability_dialogue:
    instruction: "Leila sagt: Wirklich? Ich habe es geschafft, es online in zehn Minuten zu erledigen. Antworten Sie laut als Daniel mit *would be able to*: Sagen Sie, dass Sie nächstes Mal Zeit sparen könnten, wenn Sie es auch online machen würden."
    accepted_answers:
      - {value: "Next time, I would be able to save time if I did it online too.", status: "correct"}
      - {value: "Next time, I'd be able to save time if I did it online too.", status: "correct"}
    feedback: "*Next time, I would be able to save time if I did it online too.* ist die akzeptierte Antwort; *I'd* ist die Kurzform von *I would*."
