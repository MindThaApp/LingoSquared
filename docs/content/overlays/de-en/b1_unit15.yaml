  en.b1.unit15.lesson01.teach.complain: {title: "complain", gloss: "sich beschweren", note: "*complain* bedeutet, förmlich zu sagen, dass etwas nicht in Ordnung oder nicht zufriedenstellend ist.", example_gloss: "Mia beschloss, sich über den beschädigten Stuhl zu beschweren."}
  en.b1.unit15.lesson01.teach.damaged: {title: "damaged", gloss: "beschädigt", note: "*damaged* beschreibt ein Produkt, das kaputt oder beschädigt ist.", example_gloss: "Der Stuhl kam beschädigt an."}
  en.b1.unit15.lesson01.teach.refund: {title: "refund", gloss: "Rückerstattung", note: "*refund* bedeutet Geld, das für ein zurückgegebenes oder defektes Produkt zurückgezahlt wird.", example_gloss: "Mia bat um eine Rückerstattung."}
  en.b1.unit15.lesson01.teach.replacement: {title: "replacement", gloss: "Ersatz, Ersatzlieferung", note: "*replacement* bedeutet einen neuen Artikel anstelle eines defekten Artikels.", example_gloss: "Die Firma bot stattdessen einen Ersatz an."}
  en.b1.unit15.lesson01.teach.resolve: {title: "resolve", gloss: "lösen, klären", note: "*resolve* bedeutet, ein Problem vollständig zu lösen.", example_gloss: "Der Mitarbeiter versprach, das Problem schnell zu klären."}
  en.b1.unit15.lesson01.teach.issue: {title: "issue", gloss: "Problem, Anliegen", note: "*issue* bedeutet ein Problem, um das man sich kümmern muss.", example_gloss: "Mia schilderte das Problem klar und deutlich."}

  en.b1.unit15.lesson02.teach.writing_to_complain: {title: "I'm writing to complain about + Nomen", gloss: "Ich schreibe Ihnen, um mich über ein beschädigtes Produkt zu beschweren.", note: "*I'm writing to complain about* eröffnet eine höfliche schriftliche Beschwerde."}
  en.b1.unit15.lesson02.teach.would_like_refund: {title: "I would like + Nomen", gloss: "Ich hätte gern eine Rückerstattung für diesen Artikel.", note: "*I would like a refund for* bittet höflich um die Rückerstattung des Geldes."}
  en.b1.unit15.lesson02.teach.grammar_complaint_structure: {title: "Der Aufbau einer höflichen Beschwerde", gloss: "Eine höfliche schriftliche Beschwerde hat meist drei Teile: das Problem nennen (I'm writing to complain about...), sagen, was schon passiert ist (it arrived damaged / it stopped working), und um eine bestimmte Lösung bitten (I would like a refund / I would like a replacement).", note: "Form: das Problem nennen, sagen, was passiert ist, um eine bestimmte Lösung bitten."}

  en.b1.unit15.lesson03.teach.desk_chair: {title: "desk chair", gloss: "Bürostuhl, Schreibtischstuhl", note: "*desk chair* bedeutet einen Stuhl, auf dem man an einem Schreibtisch sitzt.", example_gloss: "Mia bestellte einen neuen Bürostuhl für ihr Homeoffice."}
  en.b1.unit15.lesson03.teach.as_soon_as_possible: {title: "as soon as possible", gloss: "so bald wie möglich", note: "*as soon as possible* bedeutet ohne unnötige Verzögerung.", example_gloss: "Mia bat darum, so bald wie möglich einen Ersatz zu bekommen."}
  en.b1.unit15.lesson03.teach.reading_passage: {title: "Lesetext: eine Beschwerde über einen Bürostuhl", gloss: "Sehr geehrtes GreenDesk-Team, ich schreibe Ihnen, um mich über ein beschädigtes Produkt zu beschweren. Ich habe letzte Woche einen Bürostuhl für mein Homeoffice bestellt, aber er kam mit einem kaputten Rad an. Ich hätte gern so bald wie möglich einen Ersatz. Bitte teilen Sie mir mit, wie ich weiter vorgehen soll. Vielen Dank, Mia", note: "Ein kurzer, höflicher Beschwerdebrief."}

  en.b1.unit15.lesson04.teach.q_calling_to_complain: {title: "Mia ruft an, um sich über den Bürostuhl zu beschweren", gloss: "Mia sagt: Guten Tag, ich rufe an, um mich über einen Bürostuhl zu beschweren, den ich bestellt habe.", note: "*I'm calling to complain about* eröffnet eine höfliche telefonische Beschwerde."}
  en.b1.unit15.lesson04.teach.a_whats_the_issue: {title: "Der Mitarbeiter fragt nach dem Problem", gloss: "Der Mitarbeiter sagt: Das tut mir leid zu hören. Was ist das Problem damit?", note: "*I'm sorry to hear that* ist eine höfliche, einfühlsame Reaktion."}
  en.b1.unit15.lesson04.teach.q_broken_wheel_cant_use: {title: "Mia beschreibt das Problem", gloss: "Mia sagt: Er kam mit einem kaputten Rad an, also kann ich ihn nicht benutzen.", note: "*it arrived with a broken wheel* erklärt, was schon passiert ist."}
  en.b1.unit15.lesson04.teach.a_refund_or_replacement: {title: "Der Mitarbeiter bietet eine Lösung an", gloss: "Der Mitarbeiter sagt: Ich verstehe. Möchten Sie lieber eine Rückerstattung oder einen Ersatz?", note: "*would you like... or...* gibt dem Kunden eine Wahl."}
  en.b1.unit15.lesson04.teach.q_prefer_replacement: {title: "Mia entscheidet sich für einen Ersatz", gloss: "Mia sagt: Ich hätte lieber einen Ersatz, wenn das möglich ist.", note: "*I would prefer a replacement, if that's possible* nennt höflich eine Präferenz."}
  en.b1.unit15.lesson04.teach.a_resolve_send_friday: {title: "Der Mitarbeiter bestätigt die Lösung", gloss: "Der Mitarbeiter sagt: Selbstverständlich. Wir klären das und schicken Ihnen bis Freitag einen neuen Stuhl.", note: "*we'll resolve this and send... by Friday* ist ein konkretes Versprechen mit Datum."}

