teaching:
  en.a1.unit63.lesson01.teach.help:
    title: help
    gloss: helfen / Hilfe
    note: '*help* kann das Verb ''helfen'' oder das Nomen ''Hilfe'' sein. Anders als im Deutschen steht danach kein Dativ: *help me* (mir helfen) hat kein *to*.'
    example_gloss: Kannst du mir helfen?
  en.a1.unit63.lesson01.teach.carry:
    title: carry
    gloss: tragen
    note: '*carry* bedeutet etwas halten und von einem Ort zum anderen bringen.'
    example_gloss: Ich kann es tragen.
  en.a1.unit63.lesson01.teach.heavy:
    title: heavy
    gloss: schwer
    note: '*heavy* bedeutet schwer (im Gewicht).'
    example_gloss: Das ist schwer.
  en.a1.unit63.lesson01.teach.bag:
    title: bag
    gloss: Tasche
    note: '*bag* bedeutet Tasche, auch Tüte oder Beutel.'
    example_gloss: Diese Tasche ist schwer.
  en.a1.unit63.lesson01.teach.door:
    title: door
    gloss: Tür
    note: '*door* bedeutet Tür.'
    example_gloss: Öffne die Tür.
  en.a1.unit63.lesson01.teach.shelf:
    title: shelf
    gloss: Regal, Regalbrett
    note: '*shelf* bedeutet Regal oder Regalbrett, zum Beispiel an der Wand oder im Schrank. Die Mehrzahl ist *shelves*.'
    example_gloss: Leg es ins Regal.
  en.a1.unit63.lesson02.teach.can_you_help:
    title: Can you help me?
    gloss: Kannst du mir helfen?
    note: '*Can you...?* ist eine direkte, gewöhnliche Art, um Hilfe zu bitten.'
  en.a1.unit63.lesson02.teach.bag_heavy:
    title: This bag is heavy.
    gloss: Diese Tasche ist schwer.
    note: Verwenden Sie *this bag* für die Tasche, die bei Ihnen in der Nähe ist.
  en.a1.unit63.lesson02.teach.open_door:
    title: Could you open the door?
    gloss: Könntest du die Tür öffnen?
    note: '*Could you...?* klingt höflicher als *Can you...?*. Es entspricht dem deutschen Konjunktiv ''Könntest du ...?''.'
  en.a1.unit63.lesson02.teach.i_can_help:
    title: I can help.
    gloss: Ich kann helfen.
    note: Dieser Satz bietet Hilfe an.
  en.a1.unit63.lesson02.teach.thank_you_help:
    title: Thank you for your help.
    gloss: Danke für deine Hilfe.
    note: '*Thank you for...* verwendet *for* für den Grund des Dankes, wie ''danke für''.'
  en.a1.unit63.lesson02.teach.put_on_shelf:
    title: Put it on the shelf.
    gloss: Leg es ins Regal.
    note: '*put it on...* bedeutet etwas auf etwas legen oder stellen. Das Englische unterscheidet hier nicht zwischen ''legen'' und ''stellen'': beides ist *put*.'
  en.a1.unit63.lesson03.teach.dialogue_line1:
    title: Leila bittet um Hilfe
    gloss: 'Leila sagt: Hallo Daniel. Kannst du mir helfen?'
    note: '*Can you help me?* ist der Grundsatz, um Hilfe zu erbitten.'
  en.a1.unit63.lesson03.teach.dialogue_line2:
    title: Daniel fragt, was nötig ist
    gloss: 'Daniel sagt: Natürlich. Was brauchst du?'
    note: '*Of course* bedeutet natürlich.'
  en.a1.unit63.lesson03.teach.dialogue_line3:
    title: Die Tasche ist schwer
    gloss: 'Leila sagt: Diese Tasche ist schwer.'
    note: '*heavy* beschreibt, warum Hilfe nötig ist.'
  en.a1.unit63.lesson03.teach.dialogue_line4:
    title: Daniel kann die Tasche tragen
    gloss: 'Daniel sagt: Ich kann sie tragen.'
    note: '*carry it* bezieht sich auf die Tasche. Das Englische sagt *it* für Dinge; die Tasche ist hier nicht ''sie'' wie im Deutschen.'
  en.a1.unit63.lesson03.teach.dialogue_line5:
    title: Leila bittet um die Tür
    gloss: 'Leila sagt: Könntest du auch die Tür öffnen?'
    note: '*Could you...?* macht die Bitte höflich.'
  en.a1.unit63.lesson03.teach.dialogue_line6:
    title: Daniel fragt nach dem Regal
    gloss: 'Daniel sagt: Ja. Kann ich die Tasche ins Regal stellen?'
    note: Mit *Can I ...?* bietet Daniel an, die Tasche ins Regal zu stellen.
  en.a1.unit63.lesson03.teach.dialogue_line7:
    title: Leila bedankt sich bei Daniel
    gloss: 'Leila sagt: Ja, gern. Danke für deine Hilfe.'
    note: '*Thank you for your help* ist eine feste Dankesformel.'
  en.a1.unit63.lesson03.teach.dialogue_line8:
    title: Daniel antwortet
    gloss: 'Daniel sagt: Kein Problem.'
    note: '*No problem* ist eine kurze, freundliche Antwort.'
  en.a1.unit63.lesson04.teach.help_note:
    title: Hilfszettel
    gloss: 'Hilfszettel: Die blaue Tasche ist schwer. Bitte legen Sie sie ins Regal neben der Tür.'
    note: Der Zettel sagt, welche Tasche gemeint ist und wohin sie soll.
  en.a1.unit63.lesson04.teach.reading_passage:
    title: 'Text: Ein hilfsbereiter Nachbar'
    gloss: 'Ein hilfsbereiter Nachbar: Leila hatte eine schwere blaue Tasche. Sie sah Daniel an der Tür und bat um Hilfe. Daniel trug die Tasche hinein. Leila bat ihn auch, die Tür zu öffnen. Danach legte Daniel die Tasche ins Regal neben der Tür. Leila bedankte sich bei Daniel für seine Hilfe. Daniel sagte: Kein Problem. Später schrieb Leila einen kurzen Zettel: Die blaue Tasche liegt im Regal.'
    note: '*carried* ist die Vergangenheitsform von *carry*.'
