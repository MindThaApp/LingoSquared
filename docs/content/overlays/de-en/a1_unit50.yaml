  en.a1.unit50.lesson03.teach.dialogue_line1:
    title: Mia an der Rezeption
    gloss: 'Mia sagt: Hallo, wir haben eine Reservierung für zwei Nächte.'
    note: '*we have a reservation* bedeutet: wir haben eine Reservierung.'
  en.a1.unit50.lesson03.teach.dialogue_line2:
    title: Der Rezeptionist begrüßt sie
    gloss: 'Der Rezeptionist sagt: Willkommen! Auf welchen Namen läuft die Reservierung?'
    note: '*What''s the name on the reservation?* bedeutet: Auf welchen Namen läuft die Reservierung?'
  en.a1.unit50.lesson03.teach.dialogue_line3:
    title: "Leilas Antwort"
    gloss: 'Leila sagt: Sie läuft auf meinen Namen, Leila.'
    note: 'Das Englische sagt *it''s under my name* (wörtlich: unter meinem Namen), das Deutsche dagegen "auf meinen Namen" -- das Präpositionsbild unterscheidet sich also.'
  en.a1.unit50.lesson03.teach.dialogue_line4:
    title: Der Rezeptionist gibt den Schlüssel
    gloss: 'Der Rezeptionist sagt: Perfekt. Hier ist Ihr Schlüssel. Ihr Zimmer hat zwei Betten.'
    note: '*Your room has two beds.* bedeutet: Ihr Zimmer hat zwei Betten.'
  en.a1.unit50.lesson03.teach.dialogue_line5:
    title: Mias Frage zum WLAN
    gloss: 'Mia fragt: Hat das Zimmer WLAN?'
    note: Wiederholung der Frage, die Sie schon kennen.
  en.a1.unit50.lesson03.teach.dialogue_line6:
    title: Der Rezeptionist über das Frühstück
    gloss: 'Der Rezeptionist sagt: Ja, und das Frühstück gibt es unten von sieben bis zehn Uhr.'
    note: '*from seven to ten* bedeutet: von sieben bis zehn Uhr.'
  en.a1.unit50.lesson03.teach.dialogue_line7:
    title: Leilas Frage zum Auschecken
    gloss: 'Leila sagt: Danke! Um wie viel Uhr ist das Auschecken?'
    note: Wiederholung der Frage *What time is check-out?*, die Sie schon kennen.
  en.a1.unit50.lesson03.teach.dialogue_line8:
    title: Der Rezeptionist über das Auschecken
    gloss: 'Der Rezeptionist sagt: Auschecken ist um elf Uhr.'
    note: '*Check-out is at eleven o''clock.* bedeutet: Auschecken ist um elf Uhr.'
  en.a1.unit50.lesson04.teach.reading_passage:
    title: Text über ein Wochenende in der Pension
    gloss: 'Ein Wochenende in der Pension: Mia und Leila machten am Wochenende einen kurzen Ausflug in die Berge. Mia liebt es zu fotografieren, und Leila liebt es zu malen, also war es der perfekte Ort zum Entspannen. Als sie in der Pension ankamen, sagten sie dem Rezeptionisten, dass sie eine Reservierung für zwei Nächte hatten, vom 14. bis zum 16. November. Der Rezeptionist fragte nach dem Namen der Reservierung, und Leila sagte, sie laufe auf ihren Namen. Ihr Zimmer hatte zwei Betten und WLAN, und das Frühstück war jeden Morgen von sieben bis zehn Uhr inbegriffen. Auschecken war um elf Uhr. Mia machte viele Fotos von den Bergen, und Leila malte ein kleines Bild von der Aussicht aus ihrem Fenster. Daniel blieb an dem Wochenende zu Hause und kochte für sich selbst, nach einem Rezept aus dem Kochbuch, das er in der Bibliothek ausgeliehen hatte. Als Mia und Leila zurückkamen, zeigten sie ihm ihre Fotos und das Bild, und es gefiel ihm sehr.'
    note: '*Their room had two beds and wifi* bedeutet: Ihr Zimmer hatte zwei Betten und WLAN.'
