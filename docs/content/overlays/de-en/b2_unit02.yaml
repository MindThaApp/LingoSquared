teaching:
  en.b2.unit02.lesson01.teach.may:
    title: may
    gloss: kann sein, möglicherweise
    note: '*may* drückt Möglichkeit aus. Hier bedeutet es keine Erlaubnis wie in *May I...?*.'
    example_gloss: Das kann wahr sein.
  en.b2.unit02.lesson01.teach.might:
    title: might
    gloss: könnte sein, eventuell
    note: '*might* drückt eine vorsichtige Möglichkeit aus, oft etwas unsicherer als *may*.'
    example_gloss: Das könnte wahr sein.
  en.b2.unit02.lesson01.teach.must:
    title: must
    gloss: muss wohl, bestimmt
    note: '*must* drückt hier einen starken Schluss auf Grundlage von Belegen aus, keine Pflicht.'
    example_gloss: Das muss wahr sein.
  en.b2.unit02.lesson01.teach.cannot:
    title: cannot
    gloss: kann nicht, ausgeschlossen
    note: '*cannot* verwenden Sie, wenn die Belege etwas ausschließen. Für die Vergangenheit wird daraus *cannot have been*.'
    example_gloss: Das kann nicht wahr sein.
  en.b2.unit02.lesson01.teach.deduction:
    title: deduction
    gloss: Schlussfolgerung aus Belegen
    note: '*deduction* ist das Folgern aus Anhaltspunkten, nicht bloßes Raten.'
    example_gloss: Mias Schlussfolgerung beruht auf Belegen.
  en.b2.unit02.lesson01.teach.guesswork:
    title: guesswork
    gloss: Rätselraten
    note: '*guesswork* ist ein Tipp mit wenigen oder gar keinen Belegen.'
    example_gloss: Ohne Belege wäre die Erklärung bloßes Rätselraten.
  en.b2.unit02.lesson01.teach.may_might_contrast:
    title: may en might
    gloss: May und might überschneiden sich oft. Beide nennen eine mögliche Erklärung; might klingt oft etwas vorsichtiger.
    note: Übersetzen Sie deutsches „vielleicht“ nicht immer mit *maybe*. In einem sorgfältig formulierten Satz sind *may* und *might* oft passender.
  en.b2.unit02.lesson02.teach.must_have_gone_down:
    title: Starke Schlussfolgerung über die Vergangenheit
    gloss: Der Server muss in der Nacht ausgefallen sein, denn es wurden keine Berichte erzeugt.
    note: 'Das deutsche „muss ... gewesen sein“ entspricht im Englischen *must have* + Partizip: *must have gone down*. Das Verb *have* steht nach *must* im Infinitiv, nicht umgekehrt wie im deutschen Satzende.'
  en.b2.unit02.lesson02.teach.may_have_failed:
    title: Mögliche Ursache in der Vergangenheit
    gloss: Die Berichte sind in der Nacht möglicherweise fehlgeschlagen.
    note: '*may have failed* nennt eine mögliche Ursache, keine sichere Schlussfolgerung.'
  en.b2.unit02.lesson02.teach.might_have_permission:
    title: Vorsichtige Möglichkeit
    gloss: Es könnte stattdessen ein Berechtigungsproblem gewesen sein.
    note: '*might have been* lässt die Ursache offen und klingt vorsichtiger als *must have been*.'
  en.b2.unit02.lesson02.teach.cannot_have_only_report:
    title: Etwas ausschließen
    gloss: Es kann nicht nur ein Berichtsproblem gewesen sein.
    note: Das deutsche „kann nicht ... gewesen sein“ entspricht hier *cannot have been* oder in der gesprochenen Sprache *can't have been*.
  en.b2.unit02.lesson02.teach.grammar_modal_deduction:
    title: Modalverben für Vermutungen
    gloss: Verwenden Sie must be für einen starken Schluss über die Gegenwart und must have been für einen starken Schluss über die Vergangenheit. Verwenden Sie may/might für Möglichkeit in der Gegenwart und may have/might have für Möglichkeit in der Vergangenheit. Verwenden Sie cannot/cannot have been, wenn die Belege eine Erklärung ausschließen.
    note: 'Achtung: *must* bedeutet hier nicht „müssen“ als Pflicht, sondern „muss wohl so sein“: eine Schlussfolgerung.'
  en.b2.unit02.lesson03.teach.outage:
    title: outage
    gloss: Ausfall, Störung
    note: '*outage* ist eine Störung, bei der ein System oder Dienst nicht funktioniert.'
    example_gloss: Ein Systemausfall verhinderte, dass die Berichte liefen.
  en.b2.unit02.lesson03.teach.consequence:
    title: consequence
    gloss: Folge
    note: '*consequence* ist die Folge einer Ursache oder eines Problems.'
    example_gloss: Eine Folge ist, dass das Dashboard alte Daten anzeigen kann.
  en.b2.unit02.lesson03.teach.reading_passage:
    title: 'Lesetext: Was ist wahrscheinlich passiert?'
    gloss: Die nächtlichen Berichte liefen nicht, und die Überwachungsseite ist leer. Mia sagt, der Server müsse in der Nacht ausgefallen sein. Daniel meint, es könnte ein Berechtigungsproblem gewesen sein, aber das kann die leere Überwachungsseite nicht erklären. Der Finanzbereich fehlen möglicherweise die Morgenzahlen, und das Kunden-Dashboard zeigt womöglich alte Daten an, bis die Berichte neu erstellt sind. Mia ist nicht völlig sicher, aber ihre Erklärung ist eine Schlussfolgerung aus den vorhandenen Belegen, kein reines Rätselraten.
    note: Der Text trennt Fakten, mögliche Ursachen, starke Schlussfolgerungen, ausgeschlossene Erklärungen und mögliche Folgen.
  en.b2.unit02.lesson04.teach.q_no_reports:
    title: Daniel nennt die Tatsache
    gloss: 'Daniel sagt: Keiner der nächtlichen Berichte wurde erzeugt.'
    note: Das ist die bekannte Tatsache, noch keine Vermutung.
  en.b2.unit02.lesson04.teach.a_server_down:
    title: Mia zieht einen starken Schluss
    gloss: 'Mia sagt: Der Server muss in der Nacht ausgefallen sein.'
    note: '*must have gone down* ist ein starker Schluss über die Vergangenheit.'
  en.b2.unit02.lesson04.teach.q_permission_issue:
    title: Daniel nennt eine mögliche Ursache
    gloss: 'Daniel sagt: Es könnte stattdessen ein Berechtigungsproblem gewesen sein.'
    note: '*might have been* hält die Möglichkeit offen, macht sie aber nicht sicher.'
  en.b2.unit02.lesson04.teach.a_cannot_only_report:
    title: Mia schließt eine zu enge Erklärung aus
    gloss: 'Mia sagt: Vielleicht, aber die Überwachungsseite ist auch leer, also kann es nicht nur ein Berichtsproblem gewesen sein.'
    note: '*cannot have been only...* schließt die Erklärung aus, weil die Belege weiter reichen.'
  en.b2.unit02.lesson04.teach.q_consequences:
    title: Daniel fragt nach den Folgen
    gloss: 'Daniel fragt: Welche Folgen sollten wir erwarten?'
    note: Nach der Ursache kommt die Frage nach möglichen Folgen.
  en.b2.unit02.lesson04.teach.a_possible_consequences:
    title: Mia nennt mögliche Folgen
    gloss: 'Mia sagt: Der Finanzbereich fehlen möglicherweise die Morgenzahlen, und das Kunden-Dashboard zeigt womöglich alte Daten an.'
    note: '*may be missing* und *might show* nennen mögliche Folgen, keine sicheren Tatsachen.'
  en.b2.unit02.lesson04.teach.q_deduction_guess:
    title: Daniel prüft die Sicherheit
    gloss: 'Daniel sagt: Das ist also eine Schlussfolgerung, nicht bloß ein Tipp?'
    note: Daniel fragt, ob Mias Überlegung auf Belegen beruht.
  en.b2.unit02.lesson04.teach.a_evidence_limited:
    title: Mia relativiert ihre Schlussfolgerung
    gloss: 'Mia sagt: Ja. Die Belege sind begrenzt, aber sie deuten auf einen Systemausfall hin.'
    note: Eine starke Schlussfolgerung kann trotzdem die Grenzen der Belege eingestehen.
