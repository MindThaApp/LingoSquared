teaching:
  en.a1.unit33.lesson01.teach.bus:
    title: bus
    gloss: Bus
    note: '*bus* bedeutet Bus. Das passende Verb ist *take*: *take the bus*. Beachten Sie: Im Deutschen sagt man für fast jedes Verkehrsmittel "fahren" (mit dem Bus fahren, mit dem Auto fahren), im Englischen hat dagegen jedes Verkehrsmittel sein eigenes Verb (*take*, *drive*, *ride*). Diese lernen Sie am besten einzeln.'
    example_gloss: Ich nehme den Bus.
  en.a1.unit33.lesson01.teach.train:
    title: train
    gloss: Zug
    note: '*train* bedeutet Zug. Wie bei *bus* verwenden Sie hier *take*: *take the train*.'
    example_gloss: Sie nimmt den Zug.
  en.a1.unit33.lesson01.teach.car:
    title: car
    gloss: Auto
    note: '*car* bedeutet Auto. Beim Auto verwenden Sie nicht *take*, sondern *drive*: *drive my car*. Das ist ein anderes Verb als bei Bus oder Zug.'
    example_gloss: Ich fahre mit meinem Auto zur Arbeit.
  en.a1.unit33.lesson01.teach.bike:
    title: bike
    gloss: Fahrrad
    note: '*bike* bedeutet Fahrrad. Hier verwenden Sie wieder ein anderes Verb: *ride a bike* (weder *take* noch *drive*).'
    example_gloss: Ich fahre jeden Tag mit dem Fahrrad zur Arbeit.
  en.a1.unit33.lesson01.teach.walk:
    title: walk
    gloss: gehen
    note: '*walk* bedeutet zu Fuß gehen. Hier brauchen Sie kein zusätzliches Verb wie *take*, *drive* oder *ride*, denn *walk* ist selbst das Verb: *walk to work*, nicht *take a walk to work*.'
    example_gloss: Ich gehe zu Fuß zur Arbeit.
  en.a1.unit33.lesson02.teach.how_get_to:
    title: How do you get to work?
    gloss: Wie kommst du zur Arbeit?
    note: Diese Frage beginnt mit dem Hilfsverb *do*, weil das eigentliche Verb *get* ist. Im Deutschen gibt es in solchen Fragen kein Hilfsverb; man stellt einfach das Verb voran ("Wie kommst du ...?").
  en.a1.unit33.lesson02.teach.usually:
    title: usually
    gloss: meistens
    note: '*usually* bedeutet meistens. Im Englischen steht dieses Adverb meist zwischen dem Subjekt und dem Hauptverb: *I usually take the bus*.'
    example_gloss: Ich nehme meistens den Bus.
  en.a1.unit33.lesson02.teach.minutes:
    title: minutes
    gloss: Minuten
    note: '*minutes* bedeutet Minuten. In *It takes twenty minutes* ist *it* ein leeres Subjekt ohne eigene Bedeutung; es füllt nur die Subjektstelle. Das deutsche "Es dauert zwanzig Minuten" funktioniert genauso, der Satz wirkt also vertraut. Aber nicht in jedem englischen Satz über Zeitdauer funktioniert es so.'
    example_gloss: Es dauert zwanzig Minuten.
  en.a1.unit33.lesson02.teach.late:
    title: late
    gloss: spät
    note: '*late* bedeutet spät (später ankommen als erwartet): *The bus is often late.*'
    example_gloss: Der Bus ist oft spät dran.
  en.a1.unit33.lesson02.teach.faster:
    title: faster
    gloss: schneller
    note: '*faster* bedeutet schneller: die Steigerungsform von *fast* mit *-er*. Für einen Vergleich verwenden Sie *than*: *faster than the bus*.'
    example_gloss: Der Zug ist schneller als der Bus.
  en.a1.unit33.lesson03.teach.dialogue_line1:
    title: Leilas Frage
    gloss: 'Leila fragt: Wie kommst du zur Arbeit, Daniel?'
    note: Beginn des Gesprächs mit *How do you get to work?*
  en.a1.unit33.lesson03.teach.dialogue_line2:
    title: "Daniels Antwort"
    gloss: 'Daniel sagt: Normalerweise nehme ich den Bus. Es dauert etwa zwanzig Minuten.'
    note: 'Zwei Dinge auf einmal: das Verb *take* für den Bus und das leere Subjekt *it* in *It takes about twenty minutes*.'
  en.a1.unit33.lesson03.teach.dialogue_line3:
    title: Leilas Frage
    gloss: 'Leila fragt: Gefällt dir das?'
    note: Ja/Nein-Frage mit *Do*.
  en.a1.unit33.lesson03.teach.dialogue_line4:
    title: "Daniels Antwort"
    gloss: 'Daniel sagt: Es ist okay, aber der Bus ist oft spät dran. Und du?'
    note: '*How about you?* bedeutet "Und du?": eine kurze Art, die Frage zurückzugeben.'
  en.a1.unit33.lesson03.teach.dialogue_line5:
    title: "Leilas Antwort"
    gloss: 'Leila sagt: Ich fahre mit dem Auto. Das geht schneller, aber Parken ist schwierig.'
    note: Für das Auto verwenden Sie das Verb *drive*, nicht *take*.
  en.a1.unit33.lesson04.teach.reading_passage:
    title: Text über Leila und Daniel
    gloss: Leila fährt jeden Tag mit dem Auto zur Arbeit. Die Fahrt dauert etwa fünfzehn Minuten, aber das Parken in der Nähe ihres Büros ist schwierig. Daniel hat kein Auto, deshalb nimmt er den Bus. Seine Busfahrt dauert zwanzig Minuten und der Bus ist manchmal spät dran, aber er muss sich keine Sorgen ums Parken machen.
    note: 'Beachten Sie: *take* verwenden Sie für Bus und Zug, *drive* für das Auto.'
