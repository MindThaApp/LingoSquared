teaching:
  en.a1.unit54.lesson01.teach.laundromat:
    title: laundromat
    gloss: Waschsalon
    note: '*laundromat* bedeutet Waschsalon – ein Ort mit Waschmaschinen, an dem man gegen Bezahlung seine Wäsche waschen kann.'
    example_gloss: Ich gehe heute in den Waschsalon.
  en.a1.unit54.lesson01.teach.washing_machine:
    title: washing machine
    gloss: Waschmaschine
    note: '*washing machine* bedeutet Waschmaschine.'
    example_gloss: Die Waschmaschine ist kaputt.
  en.a1.unit54.lesson01.teach.dryer:
    title: dryer
    gloss: Trockner
    note: '*dryer* bedeutet Trockner.'
    example_gloss: Steck deine Kleidung in den Trockner.
  en.a1.unit54.lesson01.teach.quarters:
    title: quarters
    gloss: 25-Cent-Münzen (US-Währung)
    note: '*quarters* sind amerikanische Münzen zu fünfundzwanzig Cent – oft nötig für die Waschmaschinen im Waschsalon. Dafür gibt es im Deutschen kein genaues Wort, deshalb bleibt *quarters* meist Englisch.'
    example_gloss: Die Maschinen nehmen 25-Cent-Münzen.
  en.a1.unit54.lesson01.teach.detergent:
    title: detergent
    gloss: Waschmittel
    note: '*detergent* bedeutet Waschmittel.'
    example_gloss: Du brauchst Waschmittel, um deine Kleidung sauber zu machen.
  en.a1.unit54.lesson01.teach.load:
    title: load
    gloss: Waschladung / Maschinenfüllung
    note: '*load* bedeutet hier eine Waschladung – die Menge Wäsche, die man auf einmal wäscht.'
    example_gloss: Ich habe eine große Ladung Wäsche.
  en.a1.unit54.lesson02.teach.id_like_to_wash_a_few_things:
    title: I'd like to wash a few things, please.
    gloss: Ich möchte bitte ein paar Sachen waschen.
    note: '*I''d like to* (Kurzform von *I would like to*) ist die höfliche Art, um etwas zu bitten.'
  en.a1.unit54.lesson02.teach.do_you_have_change:
    title: Do you have change for the machines?
    gloss: Haben Sie Wechselgeld für die Maschinen?
    note: '*change* bedeutet hier Wechselgeld (Münzen), nicht Veränderung.'
  en.a1.unit54.lesson02.teach.how_long_does_the_cycle_take:
    title: How long does the wash cycle take?
    gloss: Wie lange dauert das Waschprogramm?
    note: '*take* bedeutet hier dauern (eine bestimmte Zeit brauchen) – eine ganz andere Verwendung als in *the machines take quarters*, wo *take* annehmen bedeutet. Im Deutschen sind das ebenfalls zwei verschiedene Verben: dauern und annehmen.'
  en.a1.unit54.lesson02.teach.its_three_dollars_for_one_load:
    title: It's three dollars for one load.
    gloss: Es kostet drei Dollar pro Ladung.
    note: '*for one load* bedeutet für eine Waschladung.'
  en.a1.unit54.lesson02.teach.what_time_do_you_close:
    title: What time do you close?
    gloss: Wann schließen Sie?
    note: '*do you close* verwendet für die Frageform das Hilfsverb *do*.'
  en.a1.unit54.lesson02.teach.please_pick_up_by_nine:
    title: Please pick up your laundry by nine o'clock.
    gloss: Bitte holen Sie Ihre Wäsche bis neun Uhr ab.
    note: '*pick up* bedeutet abholen – *by nine o''clock* bedeutet bis neun Uhr (spätestens zu dieser Zeit).'
  en.a1.unit54.lesson03.teach.dialogue_line1:
    title: Der Mitarbeiter begrüßt sie
    gloss: 'Der Mitarbeiter sagt: Hallo! Brauchst du eine Waschmaschine?'
    note: '*Do you need...?* verwendet für die Frageform das Hilfsverb *do*.'
  en.a1.unit54.lesson03.teach.dialogue_line2:
    title: Leilas Grund
    gloss: 'Leila sagt: Ja, bitte. Meine Waschmaschine zu Hause ist kaputt.'
    note: '*at home* bedeutet zu Hause.'
  en.a1.unit54.lesson03.teach.dialogue_line3:
    title: Daniels Frage
    gloss: 'Daniel sagt: Ich habe auch eine kleine Ladung Wäsche. Kann ich auch eine Maschine benutzen?'
    note: '*too* bedeutet hier auch und steht am Satzende – *as well* hat dieselbe Bedeutung und steht im zweiten Satz.'
  en.a1.unit54.lesson03.teach.dialogue_line4:
    title: Der Mitarbeiter über die Münzen
    gloss: 'Der Mitarbeiter sagt: Klar! Die Maschinen nehmen 25-Cent-Münzen.'
    note: '*take* bedeutet hier annehmen/akzeptieren (als Zahlung) – beachten Sie den Unterschied zu *take* in *The wash cycle takes thirty minutes* weiter unten, wo *take* dauern bedeutet.'
  en.a1.unit54.lesson03.teach.dialogue_line5:
    title: Leila hat Münzen
    gloss: 'Leila sagt: Ja, ich habe 25-Cent-Münzen.'
    note: Eine kurze Bestätigung, keine neue Information.
  en.a1.unit54.lesson03.teach.dialogue_line6:
    title: Die Dauer des Waschprogramms
    gloss: 'Der Mitarbeiter sagt: Das Waschprogramm dauert dreißig Minuten.'
    note: '*take* bedeutet hier dauern – eine andere Bedeutung als *take* in *take quarters* weiter oben.'
  en.a1.unit54.lesson03.teach.dialogue_line7:
    title: Daniel fragt nach dem Preis
    gloss: 'Daniel sagt: Und was kostet das?'
    note: '*How much does it cost?* – wieder das Hilfsverb *does* für die Frageform.'
  en.a1.unit54.lesson03.teach.dialogue_line8:
    title: Der Preis
    gloss: 'Der Mitarbeiter sagt: Es kostet drei Dollar pro Ladung.'
    note: Eine eigene Information, getrennt von den Münzen und der Dauer.
  en.a1.unit54.lesson03.teach.dialogue_line9:
    title: Die Schließzeit
    gloss: 'Der Mitarbeiter sagt: Der Waschsalon schließt um neun Uhr, holt also bitte eure Wäsche vorher ab.'
    note: '*so* bedeutet hier also/deshalb – es verbindet die Schließzeit mit der Aufforderung, rechtzeitig zu kommen.'
  en.a1.unit54.lesson04.teach.reading_passage:
    title: 'Text: Ein Besuch im Waschsalon'
    gloss: An einem Nachmittag ging Leilas Waschmaschine zu Hause kaputt. Sie beschloss, in den Waschsalon die Straße runter zu gehen. Daniel kam mit, weil er auch eine kleine Ladung Wäsche hatte. Im Waschsalon erklärte der Mitarbeiter, dass die Maschinen 25-Cent-Münzen annehmen und dass das Waschprogramm dreißig Minuten dauert. Es kostete drei Dollar pro Ladung. Während ihre Kleidung wusch, unterhielten sich Daniel und Leila und tranken Kaffee in einem Café nebenan. Der Waschsalon schließt um neun Uhr, deshalb achteten sie darauf, ihre Wäsche rechtzeitig abzuholen. Leila war dankbar, dass Daniel ihr Gesellschaft leistete, und sagte, die Maschine zu Hause sei bis zum Wochenende wahrscheinlich repariert.
    note: '*would be fixed* bedeutet wäre repariert – Leila erwartet, dass die Maschine repariert wird, aber es ist noch nicht sicher.'
