  en.a1.unit30.lesson02.teach.often:
    title: often
    gloss: oft
    note: '*often* bedeutet oft. Achten Sie auf die englische Wortstellung: *She often cooks dinner* (Subjekt, *often*, Verb). Im deutschen Hauptsatz kann das Adverb am Anfang stehen, dann folgt das Verb vor dem Subjekt: Oft kocht sie das Abendessen. Diese Umstellung wird nicht ins Englische übernommen.'
