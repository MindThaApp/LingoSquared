    title: sometimes
    gloss: manchmal
    note: '*sometimes* bedeutet manchmal. Im Deutschen steht in einem Hauptsatz mit dem Adverb am Anfang das Verb direkt danach: Manchmal gehe ich laufen. Im Englischen ist das anders: *Sometimes I go running*. Auch wenn *sometimes* am Anfang steht, bleibt das Subjekt vor dem Verb.'
