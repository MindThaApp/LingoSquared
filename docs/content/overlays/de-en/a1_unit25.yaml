  en.a1.unit30.lesson03.teach.i_like_pattern:
    title: I like reading.
    gloss: Ich lese gern.
    note: Mit *I like* + einem Verb auf *-ing* sagen Sie, dass Sie etwas gern tun.
  en.a1.unit30.lesson03.teach.dialogue_line1:
    title: Leilas Frage
    gloss: 'Leila fragt: Was machst du in deiner Freizeit, Daniel?'
    note: Leila beginnt das Gespräch mit einer direkten Frage an Daniel.
  en.a1.unit30.lesson03.teach.dialogue_line2:
    title: Daniels Antwort
    gloss: 'Daniel sagt: Ich gehe oft laufen. Und manchmal koche ich. Und du?'
    note: Daniel nennt zwei Hobbys und sagt, wie oft er ihnen nachgeht. Mit *What about you?* gibt er die Frage zurück.
  en.a1.unit30.lesson03.teach.dialogue_line3:
    title: Leila über das Malen
    gloss: 'Leila sagt: Ich male sehr gern. Ich male fast jedes Wochenende.'
    note: '*almost every weekend* bedeutet fast jedes Wochenende.'
  en.a1.unit30.lesson03.teach.dialogue_line4:
    title: Daniels nächste Frage
    gloss: 'Daniel sagt: Das ist toll! Spielst du manchmal Videospiele?'
    note: Mit *Do you ever...?* fragen Sie, ob jemand etwas gelegentlich tut.
  en.a1.unit30.lesson03.teach.dialogue_line5:
    title: Leilas letzte Antwort
    gloss: 'Leila sagt: Selten. Ich lese lieber ein Buch.'
    note: '*I prefer...* bedeutet: Ich bevorzuge ... oder ich mache ... lieber.'
  en.a1.unit30.lesson04.teach.reading_passage:
    title: Text über Hobbys
    gloss: Daniel und Leila haben unterschiedliche Hobbys. Daniel geht samstagmorgens immer laufen und kocht manchmal das Abendessen für seine Freunde. Leila geht nie laufen, malt aber am Wochenende oft. Beide mögen Videospiele, spielen aber nur selten zusammen.
    note: Dieser Text vergleicht die Hobbys von Daniel und Leila und zeigt, wie oft sie ihnen nachgehen.
