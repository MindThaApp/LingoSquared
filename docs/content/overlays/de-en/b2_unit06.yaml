teaching:
  en.b2.unit06.lesson01.teach.value:
    title: value
    gloss: Wert
    note: '*value* bedeutet hier ein Prinzip, das Menschen wichtig finden, nicht nur einen finanziellen Wert.'
    example_gloss: Gerechtigkeit ist ein Wert.
  en.b2.unit06.lesson01.teach.fairness:
    title: fairness
    gloss: Gerechtigkeit, angemessene Behandlung
    note: '*fairness* meint die angemessene Behandlung von Menschen. Es ist stärker und abstrakter als nur *nice*.'
    example_gloss: Gerechtigkeit bedeutet, Menschen angemessen zu behandeln.
  en.b2.unit06.lesson01.teach.convenience:
    title: convenience
    gloss: Bequemlichkeit, praktischer Nutzen
    note: '*convenience* bedeutet Bequemlichkeit oder praktischen Nutzen. Verwenden Sie in diesem B2-Zusammenhang nicht *easiness*, um "Einfachheit" auszudrücken.'
    example_gloss: Bequemlichkeit macht den Alltag leichter.
  en.b2.unit06.lesson01.teach.flexibility:
    title: flexibility
    gloss: Anpassungsfähigkeit, Flexibilität
    note: '*flexibility* ist die Fähigkeit, sich anzupassen, wenn sich die Umstände ändern.'
    example_gloss: Anpassungsfähigkeit ermöglicht Veränderung, wenn sich die Umstände ändern.
  en.b2.unit06.lesson01.teach.qualify:
    title: qualify
    gloss: einschränken, relativieren
    note: '*qualify* bedeutet hier, Ihre Meinung einzuschränken oder zu relativieren. Es bedeutet nicht, einen Abschluss zu machen.'
    example_gloss: Sie können eine Meinung relativieren, indem Sie sie einschränken.
  en.b2.unit06.lesson01.teach.prioritize:
    title: prioritize
    gloss: Vorrang geben, priorisieren
    note: '*prioritize fairness* bedeutet, dass Sie Gerechtigkeit wichtiger machen als einen anderen Wert.'
    example_gloss: Der Gerechtigkeit Vorrang zu geben bedeutet, sie für wichtiger zu halten als etwas anderes.
  en.b2.unit06.lesson02.teach.in_principle:
    title: Werte abwägen
    gloss: Grundsätzlich ist Bequemlichkeit wichtig, aber Gerechtigkeit sollte mehr Gewicht haben.
    note: '*In principle* bedeutet hier grundsätzlich oder im Prinzip. Verwenden Sie dafür nicht *eventually*: Wie das deutsche "eventuell" (= möglicherweise) ist es ein falscher Freund, denn *eventually* bedeutet schließlich oder am Ende.'
  en.b2.unit06.lesson02.teach.not_arguing_everywhere:
    title: Ihren Standpunkt einschränken
    gloss: Ich plädiere nicht für Stille überall.
    note: '*I am not arguing for...* schränkt Ihre Aussage ein. Das ist besser als eine vage Formulierung mit *a little*.'
  en.b2.unit06.lesson02.teach.respond_opposing:
    title: Direkt auf die Gegenseite eingehen
    gloss: Das ist ein berechtigter Punkt, und ich stimme zu, dass Unternehmen Flexibilität brauchen.
    note: '*That is fair* erkennt den Punkt an, ohne Ihren eigenen Wert aufzugeben.'
  en.b2.unit06.lesson02.teach.grammar_abstract_response:
    title: Eine abstrakte Meinung aufbauen
    gloss: Eine starke abstrakte Meinung nennt einen Wert, schränkt die Aussage ein und geht direkt auf die Sichtweise des anderen ein.
    note: Verwenden Sie genaue B2-Wörter wie *in principle*, *fairness* und *carry more weight*, statt immer wieder *a bit* für Abstufungen zu benutzen.
  en.b2.unit06.lesson03.teach.transparent:
    title: transparent
    gloss: durchschaubar, nachvollziehbar
    note: '*transparent rules* sind Regeln, die leicht zu verstehen und zu überprüfen sind.'
    example_gloss: Durchschaubare Regeln sind leicht zu verstehen.
  en.b2.unit06.lesson03.teach.commercial:
    title: commercial
    gloss: geschäftlich, kommerziell
    note: '*commercial activity* ist Tätigkeit, die mit Unternehmen und Gewinn zu tun hat.'
    example_gloss: Geschäftliche Tätigkeit hat mit Unternehmen zu tun.
  en.b2.unit06.lesson03.teach.reading_passage:
    title: 'Lesetext: ruhige öffentliche Räume'
    gloss: 'Amara argumentiert, dass ruhige öffentliche Räume geschützt werden sollten, auch wenn das geschäftliche Tätigkeit einschränkt. Ihre Sicht ist nicht absolut: Sie plädiert nicht für Stille überall, und sie akzeptiert, dass Unternehmen eine gewisse Flexibilität brauchen. Leos Gegenposition ist, dass Regeln es Unternehmen schwerer machen können zu überleben. Amara geht direkt auf diesen Punkt ein und sagt, dass Bequemlichkeit wichtig ist, aber Gerechtigkeit mehr Gewicht haben sollte, wenn ein Raum allen gehört. Ihr Standpunkt ist differenziert, weil sie begrenzte und durchschaubare Regeln unterstützt, keine unbegrenzten Einschränkungen.'
    note: 'Das ist abstraktes Englisch: Nennen Sie Werte und schränken Sie Ihre Aussage genau ein.'
  en.b2.unit06.lesson04.teach.q_protect_spaces:
    title: Amara nennt ihren Standpunkt
    gloss: 'Amara sagt: Ich finde, eine Stadt sollte ruhige öffentliche Räume schützen, auch wenn das manche geschäftliche Tätigkeit einschränkt.'
    note: '*even if* macht deutlich, dass sie einen Nachteil anerkennt.'
  en.b2.unit06.lesson04.teach.a_business_flexibility:
    title: Leo nennt den anderen Wert
    gloss: 'Leo sagt: Ich schätze Ruhe auch, aber Unternehmen brauchen Anpassungsfähigkeit, um zu überleben.'
    note: Leo stellt Flexibilität gegen Amaras Betonung des öffentlichen Raums.
  en.b2.unit06.lesson04.teach.q_not_silence:
    title: Amara relativiert
    gloss: 'Amara sagt: Das ist berechtigt, und ich plädiere nicht für Stille überall. Mein Punkt ist, dass gemeinsam genutzte Räume nicht nur vom Profit geprägt sein sollten.'
    note: '*not arguing for silence everywhere* verhindert, dass ihr Standpunkt absolut klingt.'
  en.b2.unit06.lesson04.teach.a_prioritizing:
    title: Leo benennt den Wert
    gloss: 'Leo sagt: Der Wert, dem du also Vorrang gibst, ist Gerechtigkeit, nicht nur Komfort?'
    note: '*prioritizing* bedeutet hier: in der Abwägung wichtiger machen.'
  en.b2.unit06.lesson04.teach.q_fairness_weight:
    title: Amara wägt Werte ab
    gloss: 'Amara sagt: Genau. Grundsätzlich ist Bequemlichkeit wichtig, aber Gerechtigkeit sollte mehr Gewicht haben, wenn ein Raum allen gehört.'
    note: '*carry more weight* ist die natürliche englische Wendung für "mehr Gewicht haben".'
  en.b2.unit06.lesson04.teach.a_accept_rules:
    title: Leo akzeptiert unter einer Bedingung
    gloss: 'Leo sagt: Das kann ich akzeptieren, wenn die Regeln begrenzt und durchschaubar sind.'
    note: Die Zustimmung hängt davon ab, dass die Regeln begrenzt und klar sind.
