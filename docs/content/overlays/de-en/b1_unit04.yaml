  en.b1.unit04.lesson02.teach.agree_that_saves_time: {title: "Zustimmen und einen Grund nennen", gloss: "Ich stimme zu, dass Arbeiten von zu Hause besser ist, weil man Zeit spart.", note: "*I agree that... because...* verbindet eine Meinung mit einem Grund."}
  en.b1.unit04.lesson02.teach.disagree_that_miss_coworkers: {title: "Widersprechen und einen Grund nennen", gloss: "Ich bin nicht der Meinung, dass es besser ist, weil man seine Kollegen vermisst.", note: "*I disagree that... because...* verbindet eine gegenteilige Meinung mit einem Grund."}
  en.b1.unit04.lesson02.teach.grammar_agree_disagree_that: {title: "agree that / disagree that", gloss: "Ich stimme zu, dass es besser ist. Ich bin nicht der Meinung, dass es besser ist.", note: "Nach *agree*/*disagree* leitet *that* den Nebensatz ein, der die Meinung nennt, der man zustimmt oder nicht zustimmt. Im Englischen steht dabei kein Komma vor *that*."}

  en.b1.unit04.lesson03.teach.focus: {title: "focus", gloss: "sich konzentrieren", note: "*focus* bedeutet, seine Aufmerksamkeit auf etwas zu richten.", example_gloss: "Zu Hause kann sie sich leichter konzentrieren."}
  en.b1.unit04.lesson03.teach.respect: {title: "respect", gloss: "respektieren", note: "*respect* bedeutet, die Meinung eines anderen zu achten, auch wenn man nicht zustimmt.", example_gloss: "Sie respektieren die Meinung des anderen."}
  en.b1.unit04.lesson03.teach.reading_passage: {title: "Lesetext: zwei Meinungen", gloss: "Mia findet, dass Arbeiten von zu Hause besser ist, weil sie sich dort leichter konzentrieren kann. Leila sieht das anders. Sie glaubt, dass es besser ist, ins Büro zu gehen, weil sie es mag, ihre Kollegen jeden Tag zu sehen. Sie sind nicht einer Meinung, aber sie respektieren die Meinung der anderen.", note: "Ein kurzer Lesetext mit zwei gegensätzlichen Meinungen."}

