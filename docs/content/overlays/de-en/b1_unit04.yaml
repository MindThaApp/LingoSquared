  en.b1.unit04.lesson04.teach.a_disagree_miss_coworkers: {title: "Leila sieht das anders", gloss: "Leila sagt: Ich bin nicht der Meinung, dass es besser ist. Ich denke, man verpasst wichtige Gespräche mit Kollegen.", note: "Leila nennt ihre Meinung und einen Grund."}
  en.b1.unit04.lesson04.teach.q_fair_point_saves_time: {title: "Daniel erkennt Leilas Argument an, bleibt aber bei seiner Meinung", gloss: "Daniel sagt: Da ist etwas dran, aber ich stimme zu, dass es viel Zeit spart.", note: "*that's a fair point* erkennt die Meinung des anderen an, bevor man die eigene sagt."}
  en.b1.unit04.lesson04.teach.a_agree_saves_time_prefer_office: {title: "Leila gibt etwas zu, bleibt aber bei ihrer Vorliebe", gloss: "Leila sagt: Ich stimme zu, dass es Zeit spart, aber ich arbeite trotzdem lieber im Büro.", note: "Leila gibt einen Punkt zu, ohne ihre Gesamtmeinung zu ändern."}
  en.b1.unit04.lesson04.teach.q_everyone_different_opinion: {title: "Daniel beendet das Gespräch", gloss: "Daniel sagt: Das kann ich nachvollziehen. Jeder hat eine andere Meinung.", note: "Eine natürliche, freundliche Art, eine Meinungsverschiedenheit zu beenden."}

