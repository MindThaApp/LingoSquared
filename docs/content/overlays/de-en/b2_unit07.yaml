course:
  title: Englisch B2
  description: Englisch auf B2-Niveau lernen für differenzierte Gespräche, Argumente, Vermutungen und fachliche Diskussionen, mit Erklärungen auf Deutsch.
units:
  en.b2.unit07.negotiation:
    title: On condition that the scope is reduced
lessons:
  en.b2.unit07.lesson01_terms_and_concessions:
    title: Bedingungen, Ablehnungen und Zugeständnisse
  en.b2.unit07.lesson02_conditional_terms:
    title: I can agree on condition that...
  en.b2.unit07.lesson03.reading_revised_terms:
