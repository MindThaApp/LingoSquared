teaching:
  en.b2.unit07.lesson01.teach.term:
    title: term
    gloss: Vertragspunkt, Klausel einer Vereinbarung
    note: '*term* ist ein Bestandteil einer Vereinbarung. Es bedeutet hier nicht Schulhalbjahr oder Semester.'
    example_gloss: Ein Vertragspunkt ist ein Bestandteil einer Vereinbarung.
  en.b2.unit07.lesson01.teach.proposal:
    title: proposal
    gloss: Vorschlag
    note: '*proposal* ist ein Vorschlag für mögliche Vertragspunkte.'
    example_gloss: Ein Vorschlag nennt mögliche Vertragspunkte.
  en.b2.unit07.lesson01.teach.refusal:
    title: refusal
    gloss: Weigerung, Ablehnung
    note: '*refusal* sagt, dass ein Vertragspunkt nicht akzeptabel ist. Im Englischen klingt eine klare Ablehnung oft besser, wenn ein Grund dabei steht.'
    example_gloss: Eine Ablehnung sagt, dass ein Vertragspunkt nicht akzeptabel ist.
  en.b2.unit07.lesson01.teach.concession:
    title: concession
    gloss: Zugeständnis
    note: '*concession* bedeutet, dass Sie einen Teil Ihrer Position aufgeben, um eine Einigung zu ermöglichen.'
    example_gloss: Ein Zugeständnis gibt einen Teil einer Position auf.
  en.b2.unit07.lesson01.teach.scope:
    title: scope
    gloss: Arbeitsumfang
    note: '*scope* ist der Umfang der enthaltenen Arbeit. In Verhandlungen können Sie Frist und *scope* gegeneinander abwägen.'
    example_gloss: Der Arbeitsumfang ist die Menge an Arbeit, die enthalten ist.
  en.b2.unit07.lesson01.teach.condition:
    title: condition
    gloss: Bedingung, Voraussetzung
    note: '*condition* ist etwas, das gelten muss, bevor eine Vereinbarung wirksam wird.'
    example_gloss: Eine Voraussetzung muss erfüllt sein, bevor die Vereinbarung greift.
  en.b2.unit07.lesson02.teach.condition_deadline:
    title: Bedingtes Zugeständnis
    gloss: Ich kann der früheren Frist unter der Bedingung zustimmen, dass der Arbeitsumfang verringert wird.
    note: '*I can agree... on condition that...* ist klar, aber professionell. Es wird nicht abgeschwächt, indem es vage wird.'
  en.b2.unit07.lesson02.teach.cannot_agree:
    title: Klar ablehnen
    gloss: Ich kann dem Dienstag als Frist bei vollem Arbeitsumfang nicht zustimmen.
    note: '*I cannot agree to...* klingt sachlicher als eine schroffe Ablehnung wie *No, that is impossible*, die man im Deutschen vielleicht wörtlich mit "Nein, das geht nicht" übersetzen würde.'
  en.b2.unit07.lesson02.teach.accept_if:
    title: Mit if annehmen
    gloss: Das kann ich akzeptieren, wenn der vollständige Anhang nächste Woche folgt.
    note: '*I can accept that if...* macht die Bedingung ausdrücklich.'
  en.b2.unit07.lesson02.teach.grammar_concession:
    title: Ablehnen und trotzdem verhandeln
    gloss: Verwenden Sie I cannot agree, um klar eine Grenze zu ziehen. Verwenden Sie I can agree on condition that, um ein bedingtes Zugeständnis anzubieten.
    note: Direktheit, die im Deutschen normal wirkt, kann im Englischen hart klingen. Nennen Sie die Grenze, den Grund und die Bedingung.
  en.b2.unit07.lesson03.teach.executive_summary:
    title: executive summary
    gloss: Zusammenfassung für die Geschäftsleitung
    note: '*executive summary* ist die kurze Zusammenfassung mit den Hauptpunkten eines Berichts.'
    example_gloss: Eine Zusammenfassung für die Geschäftsleitung nennt die Hauptpunkte eines Berichts.
  en.b2.unit07.lesson03.teach.charts:
    title: charts
    gloss: Diagramme, Grafiken
    note: '*charts* zeigen Informationen visuell.'
    example_gloss: Diagramme zeigen Informationen visuell.
  en.b2.unit07.lesson03.teach.reading_passage:
    title: 'Lesetext: geänderte Bedingungen'
    gloss: 'Priya schlug zuerst Donnerstag als Frist für den vollständigen Bericht vor. Marcus widersprach, weil der Kunde etwas früher brauchte. Priya lehnte Dienstag bei vollem Arbeitsumfang ab, weil das die Qualität gefährden würde. Dann bot sie ein bedingtes Zugeständnis an: Dienstag sei möglich, wenn der Arbeitsumfang auf die Zusammenfassung für die Geschäftsleitung und die Diagramme verringert werde. Marcus akzeptierte diese Bedingung, fügte aber einen Punkt hinzu: Der vollständige Anhang solle nächste Woche folgen. Das vereinbarte Ergebnis war Dienstag für die Zusammenfassung und die Diagramme und nächste Woche für den Anhang.'
    note: 'Die Verhandlung ist bestimmt, aber professionell: Ablehnung, Grund, Bedingung und Einigung.'
  en.b2.unit07.lesson04.teach.q_thursday:
    title: Priya macht einen Vorschlag
    gloss: 'Priya sagt: Wir können den Bericht bis Donnerstag liefern, wenn der Arbeitsumfang wie geplant bleibt.'
    note: Sie koppelt die Frist sofort an den Arbeitsumfang.
  en.b2.unit07.lesson04.teach.a_tuesday:
    title: Marcus widerspricht
    gloss: 'Marcus sagt: Donnerstag ist für den Kunden zu spät. Können Sie ihn bis Dienstag liefern?'
    note: Er bittet um eine frühere Frist, ohne sofort den Arbeitsumfang zu ändern.
  en.b2.unit07.lesson04.teach.q_cannot_tuesday:
    title: Priya lehnt mit Begründung ab
    gloss: 'Priya sagt: Ich kann Dienstag bei vollem Arbeitsumfang nicht zustimmen. Das würde die Qualität gefährden.'
    note: Der Grund macht die Ablehnung professionell und weniger schroff.
  en.b2.unit07.lesson04.teach.a_what_possible:
    title: Marcus fragt nach Bedingungen
    gloss: 'Marcus sagt: Was würde Dienstag möglich machen?'
    note: Diese Frage öffnet die Tür für ein bedingtes Zugeständnis.
  en.b2.unit07.lesson04.teach.q_condition:
    title: Priya nennt eine Bedingung
    gloss: 'Priya sagt: Ich kann der früheren Frist unter der Bedingung zustimmen, dass der Arbeitsumfang auf die Zusammenfassung für die Geschäftsleitung und die Diagramme verringert wird.'
    note: '*on condition that* ist ausdrücklich und professionell.'
  en.b2.unit07.lesson04.teach.a_accept_appendix:
    title: Marcus akzeptiert mit einer zusätzlichen Bedingung
    gloss: 'Marcus sagt: Das kann ich akzeptieren, wenn der vollständige Anhang nächste Woche folgt.'
    note: Er akzeptiert, hält aber fest, wann der Rest geliefert wird.
  en.b2.unit07.lesson04.teach.q_agreed:
    title: Priya schließt die Einigung ab
    gloss: 'Priya sagt: Abgemacht. Dienstag für die Zusammenfassung und die Diagramme, nächste Woche für den Anhang.'
    note: '*Agreed* beendet die Verhandlung kurz und klar.'
