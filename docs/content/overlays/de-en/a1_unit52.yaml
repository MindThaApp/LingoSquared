  en.a1.unit52.lesson03.teach.dialogue_line4:
    title: Daniels Frisurwunsch
    gloss: 'Daniel sagt: Die gleiche Frisur, nur ein wenig kürzer.'
    note: '*just a little shorter* bedeutet: nur ein wenig kürzer.'
  en.a1.unit52.lesson03.teach.dialogue_line5:
