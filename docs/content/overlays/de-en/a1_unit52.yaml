  en.a1.unit52.lesson04.teach.reading_passage:
    title: Text über einen Besuch beim Friseur
    gloss: 'Ein Besuch beim Friseur: Daniels Schwester wollte in der folgenden Woche aus Chicago zu Besuch kommen, also beschloss er, sich die Haare schneiden zu lassen. Mia empfahl ihm ihren Lieblingsfriseur in einem kleinen Salon in der Nähe ihrer Wohnung und begleitete ihn. Der Friseur fragte, welche Frisur er wollte, und er antwortete: die gleiche Frisur, nur ein wenig kürzer. Zuerst wusch sie ihm die Haare; die Haarwäsche war im Haarschnitt inbegriffen. Der Haarschnitt kostete zwanzig Dollar. Als sie fertig waren, sagte Mia, dass seine Haare toll aussähen. Auf dem Heimweg trafen sie Leila auf einen Kaffee. Nach ihrer Erkältung ging es ihr schon viel besser, und auch sie fand Daniels neuen Haarschnitt toll.'
    note: '*looked great* bedeutet: sah toll aus.'
