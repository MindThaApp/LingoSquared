    title: Daniels Wunsch
    gloss: 'Daniel sagt: Ich hätte gern einen Haarschnitt, bitte. Meine Schwester kommt nächste Woche zu Besuch.'
    note: In *I'd like a haircut* bezeichnet *haircut* einen Haarschnitt. Auf Deutsch kann man auch sagen, dass man sich die Haare schneiden lassen möchte.
  en.a1.unit52.lesson03.teach.dialogue_line3:
