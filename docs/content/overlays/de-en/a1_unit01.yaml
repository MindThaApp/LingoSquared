course:
  title: "Englisch A1"
  description: "Englisch auf A1-Niveau lernen, für Begrüßungen und kurze Gespräche im Alltag, mit ausführlichen deutschen Erklärungen."

units:
  en.a1.unit01.greetings: {title: "Begrüßungen und kurze Gespräche"}

lessons:
  en.a1.unit01.lesson01.everyday_greetings: {title: "Alltägliche Begrüßungen"}
  en.a1.unit01.lesson03.wellbeing: {title: "Fragen und antworten, wie es jemandem geht"}
  en.a1.unit01.lesson05.noun_phrases_and_closings: {title: "Freundliche Verabschiedungen"}

teaching:
  en.a1.unit01.lesson01.teach.hello: {title: "Hello", gloss: "Hallo", note: "*Hello* ist die neutrale, universelle Begrüßung -- passend in fast jeder Situation.", example_gloss: "Hallo, Daniel!"}
  en.a1.unit01.lesson01.teach.hi: {title: "Hi", gloss: "Hallo (locker)", note: "*Hi* ist lockerer als *Hello*, ähnlich wie das deutsche *Hallo* unter Freunden.", example_gloss: "Hallo, Leila!"}
  en.a1.unit01.lesson01.teach.good_morning: {title: "Good morning", gloss: "Guten Morgen", note: "*Good morning* wird morgens verwendet, genau wie *Guten Morgen* im Deutschen."}
  en.a1.unit01.lesson01.teach.good_afternoon: {title: "Good afternoon", gloss: "Guten Tag / Guten Nachmittag", note: "*Good afternoon* wird am Nachmittag verwendet -- im Englischen gibt es keine direkte Entsprechung zu *Guten Tag*, das den ganzen Tag über passt."}
  en.a1.unit01.lesson01.teach.good_evening: {title: "Good evening", gloss: "Guten Abend", note: "*Good evening* wird abends verwendet, genau wie *Guten Abend*."}
  en.a1.unit01.lesson01.teach.goodbye: {title: "Goodbye", gloss: "Auf Wiedersehen", note: "*Goodbye* ist die neutrale, universelle Verabschiedung.", example_gloss: "Auf Wiedersehen, bis morgen!"}
  en.a1.unit01.lesson01.teach.bye: {title: "Bye", gloss: "Tschüss", note: "*Bye* ist lockerer als *Goodbye*, ähnlich wie das deutsche *Tschüss*.", example_gloss: "Tschüss, bis bald!"}

  en.a1.unit01.lesson03.teach.how_are_you: {title: "How are you?", gloss: "Wie geht es Ihnen? / Wie geht's dir?", note: "*How are you?* funktioniert im Englischen sowohl formell als auch informell -- anders als im Deutschen gibt es hier keine grammatische Unterscheidung zwischen *Sie* und *du*."}
  en.a1.unit01.lesson03.teach.im_fine: {title: "I'm fine, thanks.", gloss: "Mir geht es gut, danke.", note: "Eine einfache, neutrale Antwort."}
  en.a1.unit01.lesson03.teach.im_good: {title: "I'm good, thanks.", gloss: "Mir geht es gut, danke.", note: "Bedeutet dasselbe wie *I'm fine, thanks* -- beide sind gleich üblich im Alltag."}
  en.a1.unit01.lesson03.teach.not_bad: {title: "Not bad, thanks.", gloss: "Nicht schlecht, danke.", note: "Eine lockere, leicht zurückhaltende Antwort -- weder besonders gut noch schlecht."}
  en.a1.unit01.lesson03.teach.and_you: {title: "And you?", gloss: "Und Ihnen? / Und dir?", note: "Die Frage zurückgeben -- funktioniert in jedem Register, ohne Unterscheidung zwischen formell und informell."}
  en.a1.unit01.lesson03.teach.are_you_okay: {title: "Are you okay?", gloss: "Ist alles in Ordnung?", note: "*Are you okay?* fragt eher, ob jemandem gerade etwas fehlt, als eine allgemeine Begrüßungsfrage wie *How are you?*"}

  en.a1.unit01.lesson05.teach.nice_to_meet_you: {title: "Nice to meet you.", gloss: "Schön, Sie kennenzulernen. / Schön, dich kennenzulernen.", note: "Wird gesagt, wenn man jemanden zum ersten Mal trifft."}
  en.a1.unit01.lesson05.teach.nice_to_meet_you_too: {title: "Nice to meet you too.", gloss: "Freut mich auch.", note: "Die passende Antwort auf *Nice to meet you*."}
  en.a1.unit01.lesson05.teach.see_you_later: {title: "See you later.", gloss: "Bis später.", note: "Wird verwendet, wenn man die Person noch am selben Tag wiedersehen wird, genau wie *Bis später* im Deutschen."}
  en.a1.unit01.lesson05.teach.have_a_good_day: {title: "Have a good day.", gloss: "Einen schönen Tag noch.", note: "Eine freundliche Verabschiedung, die einer Person einen guten weiteren Tagesverlauf wünscht."}

exercises:
  en.a1.unit01.lesson01.exercise01.listen_hello:
    instruction: "Hören Sie zu und wählen Sie das Wort aus, das Sie hören."
    correct_option: "Hello"
    distractors: ["Hi", "Goodbye", "Bye"]
    accepted_answers: [{value: "Hello", status: "correct"}]
    feedback: "*Hello* bedeutet Hallo."
  en.a1.unit01.lesson01.exercise02.choose_informal:
    instruction: "Welches Wort ist die lockere Version von *Hello*?"
    correct_option: "Hi"
    distractors: ["Hello", "Goodbye", "Good morning"]
    accepted_answers: [{value: "Hi", status: "correct"}]
    feedback: "*Hi* ist die lockere Version von *Hello*."
  en.a1.unit01.lesson01.exercise04.order_afternoon:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um 'Guten Tag' (nachmittags) zu sagen."
    accepted_answers: [{value: ["Good", "afternoon"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *Good afternoon*."
  en.a1.unit01.lesson01.exercise06.goodbye_meaning:
    instruction: "Welches Wort bedeutet die neutrale Verabschiedung?"
    correct_option: "Goodbye"
    distractors: ["Hello", "Hi", "Good evening"]
    accepted_answers: [{value: "Goodbye", status: "correct"}]
    feedback: "*Goodbye* ist die neutrale, universelle Verabschiedung."
  en.a1.unit01.lesson01.exercise07.listen_order:
    instruction: "Hören Sie zu und bringen Sie die Wörter in die richtige Reihenfolge."
    accepted_answers: [{value: ["Good", "afternoon"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *Good afternoon*."
  en.a1.unit01.lesson01.exercise03.listen_morning:
    instruction: "Hören Sie zu und schreiben Sie, was Sie hören."
    accepted_answers:
      - {value: "Good morning", status: "correct"}
      - {value: "Good morning.", status: "correct"}
    feedback: "*Good morning* bedeutet Guten Morgen."
  en.a1.unit01.lesson01.exercise08.speak_bye:
    instruction: "Sagen Sie laut die lockere Verabschiedung."
    accepted_answers:
      - {value: "Bye", status: "correct"}
      - {value: "Bye.", status: "correct"}
    feedback: "*Bye* ist die lockere Verabschiedung."

  en.a1.unit01.lesson03.exercise01.listen_question:
    instruction: "Hören Sie zu und wählen Sie die Frage aus, die Sie hören."
    correct_option: "How are you"
    distractors: ["And you", "Are you okay", "Not bad"]
    accepted_answers: [{value: "How are you", status: "correct"}]
    feedback: "*How are you?* fragt, wie es jemandem geht."
  en.a1.unit01.lesson03.exercise05.return_question:
    instruction: "Wie gibt man die Frage höflich zurück?"
    correct_option: "And you"
    distractors: ["Are you okay", "Not bad", "Nice to meet you"]
    accepted_answers: [{value: "And you", status: "correct"}]
    feedback: "*And you?* gibt die Frage zurück."
  en.a1.unit01.lesson03.exercise02.order_question:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um zu fragen, wie es jemandem geht."
    accepted_answers: [{value: ["How", "are", "you"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *How are you?*"
  en.a1.unit01.lesson03.exercise06.be_question_order:
    instruction: "Welche Frage fragt, ob mit jemandem gerade etwas nicht stimmt?"
    correct_option: "Are you okay"
    distractors: ["How are you", "And you", "Not bad"]
    accepted_answers: [{value: "Are you okay", status: "correct"}]
    feedback: "*Are you okay?* fragt eher, ob gerade etwas fehlt."
  en.a1.unit01.lesson03.exercise03.reply_fine:
    instruction: "Jemand fragt: 'How are you?' Antworten Sie, dass es Ihnen gut geht, danke."
    accepted_answers:
      - {value: "I'm fine, thanks.", status: "correct"}
      - {value: "I'm fine, thanks", status: "correct"}
    feedback: "*I'm fine, thanks* ist eine einfache, neutrale Antwort."
  en.a1.unit01.lesson03.exercise08.speak_exchange:
    instruction: "Sagen Sie laut: es geht Ihnen gut, danke, und fragen Sie zurück."
    accepted_answers:
      - {value: "I'm good, thanks. And you?", status: "correct"}
      - {value: "I'm good, thanks, and you?", status: "correct"}
      - {value: "I'm good thanks And you", status: "correct"}
    feedback: "*I'm good, thanks. And you?* antwortet und gibt die Frage zurück."

  en.a1.unit01.lesson05.exercise06.choose_later:
    instruction: "Welcher Ausdruck bedeutet 'bis später'?"
    correct_option: "See you later"
    distractors: ["Have a good day", "Nice to meet you", "Goodbye"]
    accepted_answers: [{value: "See you later", status: "correct"}]
    feedback: "*See you later* bedeutet bis später."
  en.a1.unit01.lesson05.exercise07.order_good_day:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um 'einen schönen Tag noch' zu wünschen."
    accepted_answers: [{value: ["Have", "a", "good", "day"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *Have a good day*."
  en.a1.unit01.lesson05.exercise04.listen_nice:
    instruction: "Hören Sie zu und schreiben Sie, was Sie hören."
    accepted_answers:
      - {value: "Nice to meet you", status: "correct"}
      - {value: "Nice to meet you.", status: "correct"}
    feedback: "*Nice to meet you* bedeutet: Schön, Sie/dich kennenzulernen."
  en.a1.unit01.lesson05.exercise05.reply_nice:
    instruction: "Jemand sagt: 'Nice to meet you.' Antworten Sie passend."
    accepted_answers:
      - {value: "Nice to meet you too.", status: "correct"}
      - {value: "Nice to meet you too", status: "correct"}
    feedback: "*Nice to meet you too* ist die passende Antwort."
  en.a1.unit01.lesson05.exercise08.speak_closing:
    instruction: "Wünschen Sie jemandem laut einen schönen Tag."
    accepted_answers:
      - {value: "Have a good day", status: "correct"}
      - {value: "Have a good day.", status: "correct"}
    feedback: "*Have a good day* wünscht einen schönen weiteren Tagesverlauf."
