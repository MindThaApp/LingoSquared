course:
  title: Englisch B2
  description: Englisch auf B2-Niveau lernen für differenzierte Gespräche, Argumente, Vermutungen und fachliche Diskussionen, mit Erklärungen auf Deutsch.
units:
  en.b2.unit08.synthesis:
    title: Where the sources agree and conflict
lessons:
  en.b2.unit08.lesson01_source_relationships:
    title: Übereinstimmung, Widerspruch und Begründung
  en.b2.unit08.lesson02_linking_sources:
    title: Both sources agree, but...
  en.b2.unit08.lesson03.reading_two_sources:
    title: 'Lesen: eine Umfrage und ein Bericht des Verkehrsbetriebs'
  en.b2.unit08.lesson04.the_synthesis_dialogue:
    title: Which account is better supported?
teaching:
  en.b2.unit08.lesson01.teach.source:
    title: source
    gloss: Quelle
    note: '*source* ist eine Quelle, die Informationen liefert. Verwenden Sie nicht überall *according to*; manchmal geht es um Übereinstimmung oder Widerspruch zwischen Quellen.'
    example_gloss: Eine Quelle liefert Informationen.
  en.b2.unit08.lesson01.teach.synthesize:
    title: synthesize
    gloss: zusammenführen, verknüpfen
    note: '*synthesize* bedeutet, Informationen aus mehreren Quellen zu einer zusammenhängenden Antwort zu verbinden.'
    example_gloss: Zusammenführen heißt, Informationen aus Quellen zu verbinden.
  en.b2.unit08.lesson01.teach.evaluate:
    title: evaluate
    gloss: bewerten, beurteilen
    note: '*evaluate* bedeutet zu beurteilen, wie stark etwas ist.'
    example_gloss: Beurteilen heißt einschätzen, wie stark etwas ist.
  en.b2.unit08.lesson01.teach.agreement:
    title: agreement
    gloss: Übereinstimmung
    note: '*agreement* bedeutet, dass Quellen zu einem Punkt dasselbe sagen.'
    example_gloss: Übereinstimmung bedeutet, dass die Quellen dasselbe sagen.
  en.b2.unit08.lesson01.teach.conflict:
    title: conflict
    gloss: Widerspruch, Konflikt
    note: '*conflict* bedeutet, dass Quellen einander widersprechen oder bei einem Punkt abweichen.'
    example_gloss: Widerspruch bedeutet, dass die Quellen uneins sind.
  en.b2.unit08.lesson01.teach.judgement:
    title: judgment
    gloss: Urteil, abgewogene Einschätzung
    note: '*judgment* ist ein begründetes Urteil darüber, welche Quelle stärker ist. Im amerikanischen Englisch schreibt man *judgment*; im britischen Englisch sieht man auch *judgement*.'
    example_gloss: Ein Urteil erklärt, welche Quelle stärker ist.
  en.b2.unit08.lesson02.teach_agree_conflict:
    title: Übereinstimmung und Widerspruch
    gloss: Beide Quellen stimmen darin überein, dass die Nachfrage gestiegen ist, aber sie sind sich über die Ursache uneinig.
    note: '*Both sources agree... but they disagree...* ist besser als zwei einzelne Sätze mit immer wieder *according to*.'
  en.b2.unit08.lesson02.teach_by_contrast:
    title: by contrast
    gloss: dagegen, im Gegensatz dazu
    note: '*By contrast* verwenden Sie, wenn Sie wirklich zwei Quellen oder Punkte gegenüberstellen. Benutzen Sie es nicht als allgemeines Füllwort für "dagegen" oder "hingegen".'
  en.b2.unit08.lesson02.teach_better_supported:
    title: better supported
    gloss: besser belegt
    note: '*better supported on the cause* bedeutet, dass die Belege für die Ursache stärker sind.'
  en.b2.unit08.lesson02.teach_grammar_synthesis:
    title: Eine Zusammenführung aufbauen
    gloss: Eine Zusammenführung sollte nennen, wo Quellen übereinstimmen, wo sie sich widersprechen und welche Darstellung besser belegt ist.
    note: Verwenden Sie *agree*, *conflict* und *better supported*, um die Beziehungen zwischen den Quellen genau zu fassen.
  en.b2.unit08.lesson03.teach_survey:
    title: survey
    gloss: Umfrage
    note: '*survey* sammelt Antworten oder Anmerkungen von mehreren Menschen.'
    example_gloss: Eine Umfrage kann viele Anmerkungen sammeln.
  en.b2.unit08.lesson03.teach_account:
    title: account
    gloss: Darstellung, Bericht
    note: '*account* ist ein Bericht oder eine Erklärung dessen, was geschah.'
    example_gloss: Ein Bericht erklärt, was geschah.
  en.b2.unit08.lesson03.teach.source_a:
    title: Source A
    gloss: 'Quelle A: Die Fahrgastumfrage besagt, dass verspätete Busse häufiger wurden, nachdem das neue Krankenhaus eröffnet worden war. Viele Fahrgäste sagen, die Strecke sei jetzt überfüllt, besonders morgens. Die Umfrage argumentiert, dass die Hauptursache die höhere Nachfrage sei.'
    note: Quelle A enthält viele Anmerkungen von Fahrgästen, aber das ist nicht automatisch der stärkste Beleg für die Ursache.
  en.b2.unit08.lesson03.teach.source_b:
    title: Source B
    gloss: 'Quelle B: Der Bericht des Verkehrsbetriebs stimmt zu, dass die Nachfrage nach der Eröffnung des Krankenhauses stieg, nennt aber Fahrermangel als Hauptursache für den verspäteten Betrieb. Der Bericht enthält Personalunterlagen für denselben Zeitraum.'
    note: '*staffing records* sind ein stärkerer Beleg für die Ursache als allein die Erfahrung der Fahrgäste.'
  en.b2.unit08.lesson04.teach.q_survey:
    title: Tessa nennt Quelle A
    gloss: 'Tessa sagt: Ich habe zwei Berichte über den verspäteten Busverkehr gelesen. Die Fahrgastumfrage besagt, dass die Nachfrage stieg, nachdem das neue Krankenhaus eröffnet worden war.'
    note: Das führt eine Quelle und einen Punkt über höhere Nachfrage ein.
  en.b2.unit08.lesson04.teach.a_operator:
    title: Rowan nennt Quelle B
    gloss: 'Rowan sagt: Der Bericht des Verkehrsbetriebs stimmt zu, dass die Nachfrage stieg, sagt aber, das Hauptproblem sei der Fahrermangel gewesen.'
    note: Quelle B bestätigt einen Punkt, weicht aber bei der Ursache ab.
  en.b2.unit08.lesson04.teach.q_agree_conflict:
    title: Tessa führt zusammen
    gloss: 'Tessa sagt: Die Quellen stimmen also bei der höheren Nachfrage überein, widersprechen sich aber bei der Ursache.'
    note: '*agree on* und *conflict about* fassen die Beziehung der Quellen zusammen.'
  en.b2.unit08.lesson04.teach.a_better_supported:
    title: Rowan fragt nach Belegen
    gloss: 'Rowan fragt: Welche Darstellung ist besser belegt?'
    note: Er fragt nach einem Urteil, nicht nur nach einer Zusammenfassung.
  en.b2.unit08.lesson04.teach.q_evidence_compare:
    title: Tessa vergleicht die Belege
    gloss: 'Tessa sagt: Die Umfrage enthält viele Anmerkungen von Fahrgästen, aber der Bericht des Verkehrsbetriebs enthält Personalunterlagen.'
    note: 'Das ist eine Frage der Belege: Anmerkungen gegenüber Daten.'
  en.b2.unit08.lesson04.teach.a_judgement_question:
    title: Rowan fragt nach dem Urteil
    gloss: 'Rowan fragt: Und wie lautet dein Urteil?'
    note: '*judgment* verlangt eine begründete Schlussfolgerung.'
  en.b2.unit08.lesson04.teach.q_final_judgement:
    title: Tessa gibt ihr Urteil ab
    gloss: 'Tessa sagt: Der Bericht des Verkehrsbetriebs ist bei der Ursache besser belegt, auch wenn die Umfrage nützlich ist, um die Erfahrung der Fahrgäste zu zeigen.'
    note: '*although* behält beide Quellen im Blick, während Sie trotzdem ein Urteil abgeben.'
