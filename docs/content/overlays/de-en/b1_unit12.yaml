  en.b1.unit12.lesson03.teach.reading_passage: {title: "Lesetext: wo man arbeitet", gloss: "Mia und Leila sind unterschiedlicher Meinung darüber, wo sie arbeiten. Mia arbeitet zu Hause, weil es bequem ist. Obwohl sie es vermisst, ihre Kollegen zu sehen, schafft sie zu Hause mehr. Leila arbeitet lieber im Büro. Trotz des Lärms unterhält sie sich in den Pausen gern mit Kollegen. Auch wenn Mia einen berechtigten Punkt zur Konzentration macht, glaubt Leila weiterhin, dass das Büro bessere Teamarbeit ermöglicht. Dennoch sind sich beide einig, dass Flexibilität wichtig ist.", note: "Ein kurzer Lesetext mit Gegensätzen."}

