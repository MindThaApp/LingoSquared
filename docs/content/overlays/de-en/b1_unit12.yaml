  en.b1.unit12.lesson04.teach.q_valid_point_however: {title: "Mia erkennt den Punkt an, bleibt aber bei ihrer Meinung", gloss: "Mia sagt: Das ist ein berechtigter Punkt. Trotzdem glaube ich, dass ich mich allein besser konzentrieren kann.", note: "*however* beginnt hier einen neuen Satz nach einem Punkt."}
  en.b1.unit12.lesson04.teach.a_even_though_convince: {title: "Leila zieht Mia auf", gloss: "Leila sagt: Auch wenn ich lieber im Büro arbeite, kann ich dich wohl nicht überzeugen, deine Meinung zu ändern, oder?", note: "*even though* betont den Gegensatz."}
