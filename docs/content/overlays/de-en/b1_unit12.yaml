  en.b1.unit12.lesson02.teach.grammar_concession: {title: "although, despite und however", gloss: "Although en even though beginnen een volledige bijzin: Although the office is quiet, Mia prefers home. Despite wordt gevolgd door een zelfstandig naamwoord of -ing-vorm, geen bijzin: Despite the distractions, Daniel finishes his report. However begint een nieuwe zin na een punt of puntkomma: The office is quiet. However, Mia prefers home.", note: "Form: *although/even though* + Nebensatz; *despite* + Nomen/-ing-Form; *however* als Satzadverb nach einem Punkt."}

