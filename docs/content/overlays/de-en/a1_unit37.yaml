  en.a1.unit37.lesson03.teach.dialogue_line1:
    title: Leilas Frage
    gloss: 'Leila fragt: Wusstest du, dass Daniels Geburtstag am 12. Oktober ist?'
    note: '*Did you know ...?* ist eine natürliche Art, ein Gespräch mit einer neuen Information zu beginnen.'
  en.a1.unit37.lesson03.teach.dialogue_line2:
    title: Mias Reaktion
    gloss: 'Mia sagt: Nein, das wusste ich nicht! Das ist nächsten Freitag.'
    note: '*No, I didn''t!* ist eine kurze verneinende Antwort auf eine Frage mit *Did you know ...?*: "Nein, das wusste ich nicht."'
  en.a1.unit37.lesson03.teach.dialogue_line3:
    title: Leilas Vorschlag
    gloss: 'Leila sagt: Lass uns im Büro eine Überraschungsparty für ihn machen.'
    note: '*Let''s* + Verb verwenden Sie, um einen Vorschlag zu machen, ähnlich wie "Lass uns ..." oder "Lasst uns ..." im Deutschen.'
  en.a1.unit37.lesson03.teach.dialogue_line4:
    title: Mias Reaktion
    gloss: 'Mia sagt: Gute Idee! Ich kann den Rest des Teams einladen.'
    note: '*the rest of the team* bedeutet der Rest des Teams.'
  en.a1.unit37.lesson03.teach.dialogue_line5:
    title: Leilas Plan
    gloss: 'Leila sagt: Perfekt. Ich kaufe ihm ein Geschenk, vielleicht neue Laufschuhe, da er das Laufen liebt.'
    note: '*since* bedeutet hier "da" oder "weil" (Grund), nicht "seit" (Zeit).'
  en.a1.unit37.lesson03.teach.dialogue_line6:
    title: Mias Vorschlag
    gloss: 'Mia sagt: Das ist eine gute Idee. Sollen wir auch eine Torte besorgen?'
    note: '*Should we ...?* verwenden Sie, um gemeinsam eine Entscheidung zu treffen.'
  en.a1.unit37.lesson03.teach.dialogue_line7:
    title: "Leilas Antwort"
    gloss: 'Leila sagt: Ja, auf jeden Fall! Wir wünschen ihm alle zusammen alles Gute zum Geburtstag.'
    note: '*We''ll all wish him a happy birthday* bedeutet: Wir wünschen ihm alle gemeinsam alles Gute zum Geburtstag.'
  en.a1.unit37.lesson04.teach.reading_passage:
    title: Text über die Überraschungsparty
    gloss: Daniel wusste nicht, dass Leila und Mia eine Überraschungsparty für ihn planten. Am 12. Oktober, seinem Geburtstag, kam er zur Arbeit und fand Luftballons und eine Torte im Pausenraum. Alle sagten "Alles Gute zum Geburtstag!" zu ihm. Leila schenkte ihm ein neues Paar Laufschuhe. Mia schenkte ihm ein gerahmtes Foto der drei Kollegen zusammen, das sie selbst gemacht hatte. Daniel war sehr glücklich und bedankte sich bei allen für die wunderbare Überraschung.
    note: '*he arrived at work and found*: Vergangenheit von *arrive* und *find* (er kam bei der Arbeit an und fand ...).'
