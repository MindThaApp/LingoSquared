  en.b1.unit06.lesson01.teach.said_that: {title: "said that", gloss: "sagte, dass", note: "*said that* verwendet man, um wiederzugeben, was jemand anderes gesagt hat.", example_gloss: "Er sagte, dass er helfen könne."}

  en.b1.unit06.lesson02.teach.while_driving_tire_went_flat: {title: "Hintergrundgeschehen mit 'while'", gloss: "Während ich zur Arbeit fuhr, bekam ich einen Platten.", note: "*while* + Vergangenheit mit *was/were* + -ing beschreibt das Hintergrundgeschehen, das von etwas anderem unterbrochen wird."}
  en.b1.unit06.lesson02.teach.when_pulled_over_stranger_helped: {title: "Folgendes Ereignis mit 'when'", gloss: "Als ich rechts ranfuhr, hielt ein Fremder an, um zu helfen.", note: "*when* leitet das nächste Ereignis in der Geschichte ein."}
  en.b1.unit06.lesson02.teach.grammar_while_when_sequencing: {title: "'while' und 'when' in einer Geschichte", gloss: "Während ich fuhr, bekam ich einen Platten. Als ich rechts ranfuhr, half mir ein Fremder.", note: "*while* markiert den Hintergrund (eine laufende Handlung); *when* markiert das nächste, kürzere Ereignis, das darin passiert."}

  en.b1.unit06.lesson03.teach.had_already_called: {title: "had already called", gloss: "hatte schon angerufen", note: "*had already* + Partizip beschreibt etwas, das vor einem anderen Zeitpunkt in der Vergangenheit schon passiert war.", example_gloss: "Als er ankam, hatte ich Daniel schon angerufen."}
  en.b1.unit06.lesson03.teach.kept_his_word: {title: "kept his word", gloss: "hielt sein Wort", note: "*kept his word* bedeutet, dass jemand das getan hat, was er versprochen hatte.", example_gloss: "Er hielt sein Wort und reparierte es in zehn Minuten."}
  en.b1.unit06.lesson03.teach.reading_passage: {title: "Lesetext: die Geschichte vom Platten", gloss: "Gestern Morgen, während Leila zur Arbeit fuhr, platzte plötzlich ihr Reifen. Sie fuhr in einer ruhigen Straße rechts ran. Ein Fremder hielt mit seinem Auto an und bot ihr Hilfe an. Als der Mechaniker ankam, hatte Leila Daniel schon angerufen, um ihm zu sagen, dass sie sich verspäten würde. Der Mechaniker sagte, dass er den Reifen in zehn Minuten reparieren könne. Er hielt sein Wort, und Leila kam nur zwanzig Minuten zu spät bei der Arbeit an.", note: "Eine Geschichte in der Vergangenheit mit Hintergrundgeschehen (*while*), zeitlicher Abfolge (*when*) und etwas, das schon vorher passiert war (*had already*)."}

  en.b1.unit06.lesson04.teach.q_youre_late_what_happened: {title: "Daniel bemerkt, dass Leila zu spät ist", gloss: "Daniel sagt: Du bist spät dran! Was ist passiert?", note: "Eine direkte, besorgte Frage, mit der die Geschichte beginnt."}
  en.b1.unit06.lesson04.teach.a_tire_went_flat_suddenly: {title: "Leila beginnt ihre Geschichte", gloss: "Leila sagt: Während ich zur Arbeit fuhr, platzte plötzlich mein Reifen.", note: "*while* markiert das Hintergrundgeschehen, in dem etwas anderes passierte."}
  en.b1.unit06.lesson04.teach.q_oh_no_what_did_you_do: {title: "Daniel fragt nach", gloss: "Daniel sagt: Oh nein! Was hast du gemacht?", note: "Eine kurze Nachfrage, um mehr von der Geschichte zu hören."}
  en.b1.unit06.lesson04.teach.a_pulled_over_stranger_helped: {title: "Leila erzählt weiter", gloss: "Leila sagt: Ich fuhr rechts ran, und ein Fremder hielt an, um mir zu helfen.", note: "Das nächste Ereignis in der Geschichte, nach dem Hintergrundgeschehen."}
  en.b1.unit06.lesson04.teach.q_kind_of_him_call_mechanic: {title: "Daniel reagiert und fragt weiter", gloss: "Daniel sagt: Das war nett von ihm. Hast du einen Mechaniker angerufen?", note: "*that was kind of him* ist eine natürliche Reaktion auf jemandes Freundlichkeit."}
  en.b1.unit06.lesson04.teach.a_had_already_called_mechanic_said: {title: "Leila beendet die Geschichte", gloss: "Leila sagt: Ja, ich hatte schon einen angerufen, bevor der Fremde ankam. Der Mechaniker sagte, dass er es in zehn Minuten reparieren könne, und das hat er auch getan!", note: "*had already called* zeigt, was schon passiert war, bevor der Fremde ankam."}

