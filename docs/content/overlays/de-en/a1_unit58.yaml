    note: '*painting* bedeutet ein mit Farbe gemaltes Kunstwerk.'
    example_gloss: Dieses Gemälde gefällt mir wirklich gut.
  en.a1.unit58.lesson01.teach.sculpture:
    title: sculpture
    gloss: Skulptur
    note: '*sculpture* bedeutet ein Kunstwerk aus Stein, Holz oder Metall.'
    example_gloss: Diese Skulptur ist auch sehr alt.
  en.a1.unit58.lesson01.teach.guide:
