    example_gloss: Gibt es heute eine Führung?
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_open:
    title: What time does the museum open?
    gloss: Wann öffnet das Museum?
    note: Diese Frage beginnt mit *what time*, gefolgt vom Hilfsverb *does*, weil das Hauptverb *open* ist.
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_close:
    title: What time does the museum close?
    gloss: Wann schließt das Museum?
    note: Dieselbe Fragestruktur wie bei *What time does the museum open?*, nur mit *close* statt *open*.
  en.a1.unit58.lesson02.teach.two_tickets_please:
    title: Two tickets, please.
    gloss: Zwei Eintrittskarten, bitte.
    note: '*please* am Ende macht die Bitte höflich, genau wie beim Bestellen von Essen.'
  en.a1.unit58.lesson02.teach.is_there_a_guide_for_the_exhibition:
    title: Is there a guide for the exhibition?
    gloss: Gibt es eine Führung für die Ausstellung?
    note: '*Is there...?* fragt, ob etwas vorhanden ist, hier eine Führung.'
  en.a1.unit58.lesson02.teach.the_museum_is_open_every_day:
    title: The museum is open every day.
    gloss: Das Museum ist jeden Tag geöffnet.
    note: '*every day* bedeutet jeden Tag und steht am Satzende.'
  en.a1.unit58.lesson02.teach.i_really_enjoyed_the_paintings:
    title: I really enjoyed the paintings!
    gloss: Die Gemälde haben mir richtig gut gefallen!
    note: '*enjoyed* ist die Vergangenheitsform von *enjoy* (genießen) und wird verwendet, um auf etwas Schönes zurückzublicken.'
  en.a1.unit58.lesson03.teach.dialogue_line1:
    title: Daniels Frage
    gloss: 'Daniel sagt: Hi! Wann schließt das Museum?'
    note: '*Hi!* ist eine informelle Begrüßung.'
  en.a1.unit58.lesson03.teach.dialogue_line2:
    title: Der Mitarbeiter antwortet
    gloss: 'Der Mitarbeiter sagt: Wir schließen um fünf Uhr.'
    note: '*at* + Uhrzeit gibt an, wann etwas geschieht, wie bei *at five o''clock*.'
  en.a1.unit58.lesson03.teach.dialogue_line3:
    title: Mias Bitte
    gloss: 'Mia sagt: Super. Können wir bitte zwei Karten haben?'
    note: '*Can we have...?* ist eine höfliche Art, etwas zu bestellen oder zu erbitten.'
  en.a1.unit58.lesson03.teach.dialogue_line4:
    title: Der Preis
    gloss: 'Der Mitarbeiter sagt: Natürlich. Das macht zwölf Dollar.'
    note: '*That''s* + Betrag wird verwendet, um einen Preis zu nennen.'
  en.a1.unit58.lesson03.teach.dialogue_line5:
    title: Daniels Frage nach der Führung
    gloss: 'Daniel fragt: Gibt es eine Führung für die Ausstellung?'
    note: Dieselbe *Is there...?*-Struktur, die schon in der zweiten Lektion vorkam.
  en.a1.unit58.lesson03.teach.dialogue_line6:
    title: Der Mitarbeiter zur Führung
    gloss: 'Der Mitarbeiter sagt: Ja, am Eingang gibt es eine Führung.'
    note: '*there''s* ist die Kurzform von *there is*.'
  en.a1.unit58.lesson03.teach.dialogue_line7:
    title: Mia fragt nach dem Namen
    gloss: 'Mia fragt: Wie heißt die Ausstellung?'
    note: '*What is ... called?* ist die übliche Art, nach dem Namen von etwas zu fragen.'
  en.a1.unit58.lesson03.teach.dialogue_line8:
    title: Der Name der Ausstellung
    gloss: 'Der Mitarbeiter sagt: Sie heißt Colors of the City.'
    note: '*It''s called...* ist die Antwort auf die Frage *What is ... called?*.'
  en.a1.unit58.lesson03.teach.dialogue_line9:
    title: Daniels Schlusswort
    gloss: 'Daniel sagt: Danke! Ich kann es kaum erwarten, die Gemälde zu sehen.'
    note: '*can''t wait to...* bedeutet, sich sehr darauf zu freuen, etwas zu tun.'
  en.a1.unit58.lesson04.teach.museum_notice:
    title: Museumsschild
    gloss: 'Stadtmuseum: jeden Tag geöffnet, von 9.00 bis 17.00 Uhr. Erwachsenenkarte: 6 Dollar. Aktuelle Ausstellung: Colors of the City, Raum 2.'
    note: Das Schild nennt die Öffnungszeiten, den Preis und den Namen der Ausstellung.
  en.a1.unit58.lesson04.teach.reading_passage:
    title: Text über Daniel und Mia
    gloss: 'Ein Besuch im Museum: An einem Samstagnachmittag beschlossen Daniel und Mia, gemeinsam das Stadtmuseum zu besuchen. Am Eingang sagte ihnen der Mitarbeiter, dass das Museum um fünf Uhr schließt. Sie kauften zwei Karten für zwölf Dollar. Daniel fragte nach einer Führung, und der Mitarbeiter sagte, am Eingang gebe es eine. Sie besichtigten die Ausstellung Colors of the City und sahen in Raum 2 viele schöne Gemälde. Daniel gefiel ein Gemälde vom alten Stadtplatz, und Mia gefiel ein Gemälde vom Fluss bei Sonnenuntergang. Als sie gingen, sagte Mia, dass sie das nächste Mal die Skulpturenausstellung besuchen möchte.'
    note: '*decided to visit* verwendet *to* + Infinitiv nach *decided*, um auszudrücken, was jemand beschlossen hat.'
