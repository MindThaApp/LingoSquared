course:
  title: "Englisch A1"
  description: "Englisch auf A1-Niveau lernen, für Begrüßungen und kurze Gespräche im Alltag, mit ausführlichen deutschen Erklärungen."

units:
  en.a1.unit14.communication: {title: "Telefonate und Nachrichten"}

lessons:
  en.a1.unit14.lesson01.answering_the_phone: {title: "Ein Telefonat entgegennehmen und beginnen"}
  en.a1.unit14.lesson02.asking_to_repeat: {title: "Jemanden bitten, etwas zu wiederholen"}
  en.a1.unit14.lesson03.reading_a_text_message: {title: "Eine Textnachricht lesen"}
  en.a1.unit14.lesson04.phone_call_dialogue: {title: "Ein vollständiges Telefonat"}

teaching:
  en.a1.unit14.lesson01.teach.hello_this_is: {title: "Hello, this is Daniel.", gloss: "Hallo, hier ist Daniel.", note: "*this is [Name]* stellt sich selbst am Telefon vor -- anders als eine persönliche Vorstellung mit *I'm.*"}
  en.a1.unit14.lesson01.teach.hi_its: {title: "Hi, it's Leila.", gloss: "Hallo, hier ist Leila.", note: "*it's [Name]* ist eine kürzere, informellere Variante von *this is [Name].*"}
  en.a1.unit14.lesson01.teach.are_you_free: {title: "Are you free tonight?", gloss: "Hast du heute Abend Zeit?", note: "*free* bedeutet hier zeitlich verfügbar, nicht kostenlos."}

  en.a1.unit14.lesson02.teach.can_you_repeat: {title: "Sorry, can you repeat that?", gloss: "Entschuldigung, können Sie das wiederholen?", note: "*Sorry* leitet höflich eine Bitte um Wiederholung ein."}
  en.a1.unit14.lesson02.teach.speak_slowly: {title: "Can you speak more slowly, please?", gloss: "Können Sie bitte langsamer sprechen?", note: "*more slowly* bedeutet 'langsamer' -- der Vergleichsform von *slowly.*"}
  en.a1.unit14.lesson02.teach.i_cant_hear: {title: "I can't hear you well.", gloss: "Ich kann Sie nicht gut hören.", note: "*can't hear* bedeutet 'kann nicht hören' -- oft wegen einer schlechten Verbindung."}

  en.a1.unit14.lesson03.teach.are_you_free_at: {title: "Are you free at 6pm?", gloss: "Hast du um 18 Uhr Zeit?", note: "*at 6pm* gibt die genaue Uhrzeit an."}
  en.a1.unit14.lesson03.teach.text_message_text: {title: "Eine Textnachricht", gloss: "Hallo Leila, hast du um 18 Uhr Zeit? Lass uns im Café treffen.", note: "Eine kurze Textnachricht kombiniert eine Frage nach der Zeit mit einem konkreten Vorschlag."}
  en.a1.unit14.lesson03.teach.purpose_summary: {title: "This message is to suggest a meeting time and place.", gloss: "Diese Nachricht soll eine Treffzeit und einen Treffpunkt vorschlagen.", note: "*to suggest* bedeutet 'vorschlagen' -- der Zweck der Nachricht."}

  en.a1.unit14.lesson04.teach.how_about: {title: "How about 6pm at the cafe?", gloss: "Wie wäre es um 18 Uhr im Café?", note: "*How about...?* schlägt höflich eine Zeit oder einen Ort vor."}
  en.a1.unit14.lesson04.teach.a_hello: {title: "Begrüßung von Leila", gloss: "Leila: Hallo, hier ist Leila.", note: "Leila meldet sich am Telefon mit ihrem Namen."}
  en.a1.unit14.lesson04.teach.q_free_tonight: {title: "Frage von Daniel", gloss: "Daniel: Hallo Leila, hier ist Daniel. Hast du heute Abend Zeit?", note: "Daniel stellt sich vor und fragt direkt nach ihrer Zeit."}
  en.a1.unit14.lesson04.teach.a_repeat_request: {title: "Bitte von Leila", gloss: "Leila: Entschuldigung, können Sie das wiederholen?", note: "Leila hat die Frage nicht verstanden und bittet um Wiederholung."}
  en.a1.unit14.lesson04.teach.repeat_question: {title: "Wiederholte Frage von Daniel", gloss: "Daniel: Hast du heute Abend Zeit?", note: "Daniel wiederholt genau dieselbe Frage."}
  en.a1.unit14.lesson04.teach.a_yes_what_time: {title: "Antwort von Leila", gloss: "Leila: Oh, ja! Um wie viel Uhr?", note: "Leila stimmt zu und fragt nach der genauen Uhrzeit."}
  en.a1.unit14.lesson04.teach.suggest_time_place: {title: "Vorschlag von Daniel", gloss: "Daniel: Wie wäre es um 18 Uhr im Café?", note: "Daniel schlägt Zeit und Ort in einem Satz vor."}

exercises:
  en.a1.unit14.lesson01.exercise01.listen_greeting:
    instruction: "Hören Sie zu und wählen Sie den Satz, den Sie hören."
    correct_option: "Hello, this is Daniel."
    distractors: ["Hi, it's Leila.", "Are you free tonight?", "Sorry, can you repeat that?"]
    accepted_answers: [{value: "Hello, this is Daniel", status: "correct"}]
    feedback: "*Hello, this is Daniel* bedeutet 'Hallo, hier ist Daniel.'"
  en.a1.unit14.lesson01.exercise02.choose_phone_greeting:
    instruction: "Sie nehmen das Telefonat entgegen. Was sagen Sie, um sich vorzustellen?"
    correct_option: "Hello, this is Daniel."
    distractors: ["Are you free tonight?", "Sorry, can you repeat that?", "Can you speak more slowly, please?"]
    accepted_answers: [{value: "Hello, this is Daniel.", status: "correct"}]
    feedback: "*Hello, this is Daniel* stellt Sie am Telefon vor."
  en.a1.unit14.lesson01.exercise03.order_are_you_free:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um zu fragen, ob jemand heute Abend Zeit hat."
    accepted_answers: [{value: ["Are", "you", "free", "tonight"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *Are you free tonight?*"
  en.a1.unit14.lesson01.exercise04.reply_as_leila_hi:
    instruction: "Sie nehmen das Telefonat entgegen. Stellen Sie sich als Leila vor."
    accepted_answers:
      - {value: "Hi, it's Leila.", status: "correct"}
      - {value: "Hi it's Leila", status: "correct"}
    feedback: "*Hi, it's Leila* bedeutet 'Hallo, hier ist Leila.'"
  en.a1.unit14.lesson01.exercise05.write_phone_intro:
    instruction: "Schreiben Sie, wie Sie sich als Daniel am Telefon vorstellen."
    accepted_answers:
      - {value: "Hello, this is Daniel", status: "correct"}
      - {value: "Hello, this is Daniel.", status: "correct"}
    feedback: "*Hello, this is Daniel* bedeutet 'Hallo, hier ist Daniel.'"

  en.a1.unit14.lesson02.exercise01.listen_repeat_request:
    instruction: "Hören Sie zu und wählen Sie den Satz, den Sie hören."
    correct_option: "Sorry, can you repeat that?"
    distractors: ["Can you speak more slowly, please?", "I can't hear you well.", "Are you free tonight?"]
    accepted_answers: [{value: "Sorry, can you repeat that", status: "correct"}]
    feedback: "*Sorry, can you repeat that?* bedeutet 'Entschuldigung, können Sie das wiederholen?'"
  en.a1.unit14.lesson02.exercise02.choose_slow_down_request:
    instruction: "Die andere Person spricht zu schnell. Was sagen Sie?"
    correct_option: "Can you speak more slowly, please?"
    distractors: ["Sorry, can you repeat that?", "I can't hear you well.", "Hello, this is Daniel."]
    accepted_answers: [{value: "Can you speak more slowly, please?", status: "correct"}]
    feedback: "*Can you speak more slowly, please?* bittet höflich um langsameres Sprechen."
  en.a1.unit14.lesson02.exercise03.order_cant_hear:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um zu sagen, dass Sie die Person nicht gut hören können."
    accepted_answers: [{value: ["I", "can't", "hear", "you", "well"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *I can't hear you well.*"
  en.a1.unit14.lesson02.exercise04.reply_didnt_understand:
    instruction: "Sie haben nicht verstanden, was gesagt wurde. Was sagen Sie?"
    accepted_answers:
      - {value: "Sorry, can you repeat that?", status: "correct"}
      - {value: "Sorry can you repeat that", status: "correct"}
    feedback: "*Sorry, can you repeat that?* bedeutet 'Entschuldigung, können Sie das wiederholen?'"
  en.a1.unit14.lesson02.exercise05.write_repeat_request:
    instruction: "Schreiben Sie, wie Sie höflich bitten, dass etwas wiederholt wird."
    accepted_answers:
      - {value: "Can you repeat that?", status: "correct"}
      - {value: "Can you repeat that", status: "correct"}
    feedback: "*Can you repeat that?* bedeutet 'Können Sie das wiederholen?'"

  en.a1.unit14.lesson03.exercise01.read_meeting_time:
    instruction: "Um wie viel Uhr schlägt die Nachricht ein Treffen vor?"
    correct_option: "6pm"
    distractors: ["7pm", "5pm", "8pm"]
    accepted_answers: [{value: "6pm", status: "correct"}]
    feedback: "Die Nachricht sagt: *Are you free at 6pm?* -- um 18 Uhr."
  en.a1.unit14.lesson03.exercise02.read_meeting_place:
    instruction: "Wo schlägt die Nachricht ein Treffen vor?"
    correct_option: "the cafe"
    distractors: ["the restaurant", "home", "work"]
    accepted_answers: [{value: "the cafe", status: "correct"}]
    feedback: "Die Nachricht sagt: *Let's meet at the cafe* -- im Café."
  en.a1.unit14.lesson03.exercise03.choose_message_purpose:
    instruction: "Was ist der Zweck dieser Nachricht?"
    correct_option: "to suggest a meeting time and place"
    distractors: ["to say sorry", "to ask for a phone number", "to cancel a meeting"]
    accepted_answers: [{value: "to suggest a meeting time and place", status: "correct"}]
    feedback: "Die Nachricht schlägt eine Zeit und einen Ort für ein Treffen vor."
  en.a1.unit14.lesson03.exercise04.order_lets_meet:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um ein Treffen im Café vorzuschlagen."
    accepted_answers: [{value: ["Let's", "meet", "at", "the", "cafe"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *Let's meet at the cafe.*"
  en.a1.unit14.lesson03.exercise05.write_text_reply:
    instruction: "Schreiben Sie eine Textnachricht, in der Sie fragen, ob jemand um 18 Uhr Zeit hat."
    accepted_answers:
      - {value: "Are you free at 6pm", status: "correct"}
      - {value: "Are you free at 6pm?", status: "correct"}
    feedback: "*Are you free at 6pm?* bedeutet 'Hast du um 18 Uhr Zeit?'"

  en.a1.unit14.lesson04.exercise01.listen_who_calls:
    instruction: "Hören Sie das Gespräch. Wer ruft an, und wen ruft diese Person an?"
    correct_option: "Hi Leila it's Daniel"
    distractors: ["6pm at the cafe", "Sorry, can you repeat that?", "Oh, yes! What time?"]
    accepted_answers: [{value: "Hi Leila it's Daniel", status: "correct"}]
    feedback: "Daniel sagt: *Hi Leila, it's Daniel* -- Daniel ruft Leila an."
  en.a1.unit14.lesson04.exercise02.listen_suggested_time:
    instruction: "Hören Sie noch einmal und wählen Sie, was Sie hören."
    correct_option: "6pm at the cafe"
    distractors: ["7pm at the cafe", "6pm at home", "5pm at the cafe"]
    accepted_answers: [{value: "6pm at the cafe", status: "correct"}]
    feedback: "Daniel sagt: *How about 6pm at the cafe?* -- 18 Uhr im Café."
  en.a1.unit14.lesson04.exercise03.choose_leila_confusion:
    instruction: "Leila hat Daniels Frage nicht klar gehört. Was sagt sie?"
    correct_option: "Sorry, can you repeat that?"
    distractors: ["How about 6pm at the cafe?", "Oh, yes! What time?", "Hi, it's Leila."]
    accepted_answers: [{value: "Sorry, can you repeat that?", status: "correct"}]
    feedback: "*Sorry, can you repeat that?* bedeutet 'Entschuldigung, können Sie das wiederholen?'"
  en.a1.unit14.lesson04.exercise04.order_a_yes_what_time:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um zuzustimmen und nach der Uhrzeit zu fragen."
    accepted_answers: [{value: ["Oh", "yes", "What", "time"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *Oh, yes! What time?*"
  en.a1.unit14.lesson04.exercise05.reply_as_daniel:
    instruction: "Antworten Sie als Daniel: Stellen Sie sich Leila vor, fragen Sie, ob sie heute Abend Zeit hat, wiederholen Sie dieselbe Frage, als sie darum bittet, und schlagen Sie dann 18 Uhr im Café vor."
    accepted_answers:
      - {value: "Hi Leila, it's Daniel. Are you free tonight? Are you free tonight? How about 6pm at the cafe?", status: "correct"}
      - {value: "Hi Leila, it's Daniel, and are you free tonight, and are you free tonight, how about 6pm at the cafe", status: "correct"}
      - {value: "Hi Leila it's Daniel Are you free tonight Are you free tonight How about 6pm at the cafe", status: "correct"}
    feedback: "Eine vollständige Antwort stellt sich vor, fragt nach der Zeit, wiederholt die Frage bei Bedarf, und schlägt eine konkrete Zeit und einen Ort vor."
  en.a1.unit14.lesson04.exercise06.speak_phone_call:
    instruction: "Antworten Sie laut als Daniel: Stellen Sie sich Leila vor, fragen Sie, ob sie heute Abend Zeit hat, wiederholen Sie dieselbe Frage, als sie darum bittet, und schlagen Sie dann 18 Uhr im Café vor."
    accepted_answers:
      - {value: "Hi Leila it's Daniel Are you free tonight Are you free tonight How about 6pm at the cafe", status: "correct"}
      - {value: "Hi Leila, it's Daniel. Are you free tonight? Are you free tonight? How about 6pm at the cafe?", status: "correct"}
    feedback: "Diese vollständige Antwort deckt die Vorstellung, die Frage, die Wiederholung und den Vorschlag ab."
