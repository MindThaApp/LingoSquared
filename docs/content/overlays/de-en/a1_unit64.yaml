  en.a1.unit64.lesson02.teach.you_look_great:
    title: You look great.
    gloss: Du siehst großartig aus.
    note: '*look* bedeutet hier aussehen, nicht schauen.'
  en.a1.unit64.lesson02.teach.like_your_jacket:
    title: I like your jacket.
    gloss: Deine Jacke gefällt mir.
    note: '*I like your...* ist eine gewöhnliche Art, jemandem ein Kompliment zu etwas zu machen, das ihm gehört.'
  en.a1.unit64.lesson02.teach.lovely_smile:
    title: What a lovely smile.
    gloss: Was für ein wunderschönes Lächeln.
    note: '*What a...* verwendet man, um ein Kompliment als Ausruf zu machen.'
  en.a1.unit64.lesson02.teach.very_kind:
    title: That is very kind.
    gloss: Das ist sehr lieb.
    note: '*very* verstärkt *kind*.'
  en.a1.unit64.lesson02.teach.thank_you_much:
    title: Thank you very much.
    gloss: Vielen Dank.
    note: '*Thank you very much* ist ein höflicher, herzlicher Dank.'
  en.a1.unit64.lesson03.teach.dialogue_line1:
    title: "Mia macht ein Kompliment"
    gloss: 'Mia sagt: Hi Leila. Du siehst heute großartig aus.'
    note: '*You look great* ist ein direktes Kompliment.'
  en.a1.unit64.lesson03.teach.dialogue_line2:
    title: Leila bedankt sich bei Mia
    gloss: 'Leila sagt: Danke, Mia.'
    note: '*Thank you* bedeutet danke.'
  en.a1.unit64.lesson03.teach.dialogue_line3:
    title: Mia erwähnt die grüne Jacke
    gloss: 'Mia sagt: Deine grüne Jacke gefällt mir.'
    note: '*I like your green jacket* lobt ein Kleidungsstück.'
  en.a1.unit64.lesson03.teach.dialogue_line4:
    title: Leila reagiert freundlich
    gloss: 'Leila sagt: Das ist sehr lieb.'
    note: '*That is very kind* ist die Antwort auf etwas Nettes, das jemand sagt.'
  en.a1.unit64.lesson03.teach.dialogue_line5:
    title: Mia erwähnt das Lächeln
    gloss: 'Mia sagt: Du hast auch ein wunderschönes Lächeln! Schau, das ist mein Foto.'
    note: '*too* bedeutet hier auch.'
  en.a1.unit64.lesson03.teach.dialogue_line6:
    title: Leila lobt das Foto
    gloss: 'Leila sagt: Vielen Dank. Dein Foto ist schön.'
    note: '*Your photo is nice* gibt ein Kompliment zurück.'
  en.a1.unit64.lesson03.teach.dialogue_line7:
    title: Mia erklärt das Foto
    gloss: 'Mia sagt: Danke. Es ist für Daniel.'
    note: '*Thanks* ist kürzer als *thank you*.'
  en.a1.unit64.lesson04.teach.message:
    title: Nette Nachricht
    gloss: 'Nette Nachricht: Deine grüne Jacke ist wunderschön. Dein Foto ist schön. Danke, dass du so lieb bist.'
    note: Die Nachricht enthält zwei Komplimente und bedankt sich bei jemandem.
  en.a1.unit64.lesson04.teach.reading_passage:
    title: 'Text: Ein Kompliment für eine Freundin'
    gloss: 'Ein Kompliment für eine Freundin: Mia sah Leila in einer grünen Jacke. Mia sagte, Leila sehe großartig aus. Sie sagte auch, Leila habe ein wunderschönes Lächeln. Leila bedankte sich bei Mia. Dann sah Leila sich Mias Foto an und sagte, es sei schön. Mia freute sich, weil das Foto für Daniel war. Später schrieb Leila eine kurze Nachricht: Deine grüne Jacke ist wunderschön.'
    note: '*looked great* ist die Vergangenheitsform von *look great*.'
