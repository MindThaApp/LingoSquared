course:
  title: "Englisch A1"
  description: "Englisch auf A1-Niveau lernen, für Begrüßungen und kurze Gespräche im Alltag, mit ausführlichen deutschen Erklärungen."

units:
  en.a1.unit08.shopping: {title: "Einkaufen: Preise und Mengen"}

lessons:
  en.a1.unit08.lesson01.quantities: {title: "Übliche Mengenangaben beim Einkaufen"}
  en.a1.unit08.lesson02.asking_prices: {title: "Nach Preisen fragen"}
  en.a1.unit08.lesson03.reading_price_labels: {title: "Preis- und Mengenschilder lesen"}
  en.a1.unit08.lesson04.market_dialogue: {title: "Auf dem Markt"}

teaching:
  en.a1.unit08.lesson01.teach.a_pound_of: {title: "a pound of apples", gloss: "ein Pfund Äpfel", note: "*a pound* ist eine Gewichtseinheit (ca. 454 Gramm), in den USA üblich für Obst und Gemüse."}
  en.a1.unit08.lesson01.teach.a_dozen: {title: "a dozen eggs", gloss: "ein Dutzend Eier", note: "*a dozen* bedeutet zwölf Stück."}
  en.a1.unit08.lesson01.teach.a_bottle_of: {title: "a bottle of water", gloss: "eine Flasche Wasser", note: "*a bottle of* bedeutet 'eine Flasche...'."}
  en.a1.unit08.lesson01.teach.a_bag_of: {title: "a bag of rice", gloss: "eine Tüte Reis", note: "*a bag of* bedeutet 'eine Tüte...' -- für lose Waren wie Reis."}
  en.a1.unit08.lesson01.teach.a_kilo_of: {title: "a kilo of tomatoes", gloss: "ein Kilo Tomaten", note: "*a kilo of* wird für Gemüse verwendet, das nach dem metrischen System gewogen wird -- in den USA neben *pound* gebräuchlich."}

  en.a1.unit08.lesson02.teach.how_much_are: {title: "How much are the apples?", gloss: "Wie viel kosten die Äpfel?", note: "*How much are...?* fragt nach dem Preis von etwas im Plural."}
  en.a1.unit08.lesson02.teach.two_dollars_a_pound: {title: "They're two dollars a pound.", gloss: "Sie kosten zwei Dollar pro Pfund.", note: "*a pound* am Satzende bedeutet hier 'pro Pfund', genau wie *per pound*."}
  en.a1.unit08.lesson02.teach.can_i_have_two_pounds: {title: "Can I have two pounds, please?", gloss: "Kann ich zwei Pfund haben, bitte?", note: "*Can I have...?* ist eine höfliche Bestellformel beim Einkaufen."}
  en.a1.unit08.lesson02.teach.is_it_fresh: {title: "Is it fresh?", gloss: "Ist es frisch?", note: "Eine nützliche Frage bei frischen Lebensmitteln wie Obst oder Gemüse."}

  en.a1.unit08.lesson03.teach.per_pound: {title: "per pound", gloss: "pro Pfund", note: "*per pound* gibt den Preis pro Gewichtseinheit an, z.B. auf Preisschildern.", example_gloss: "Äpfel kosten zwei Dollar pro Pfund."}
  en.a1.unit08.lesson03.teach.label_text: {title: "Cafe Menu", gloss: "Äpfel: 2 Dollar pro Pfund. Eier: 4 Dollar pro Dutzend. Reis: 3 Dollar pro Tüte.", note: "Das Dollarzeichen steht VOR der Zahl (*$2*), anders als beim Euro-Zeichen, das NACH der Zahl steht."}

  en.a1.unit08.lesson04.teach.thats_x_dollars: {title: "That's eight dollars.", gloss: "Das macht acht Dollar.", note: "*That's X dollars* entspricht dem deutschen 'Das macht X Euro.'"}
  en.a1.unit08.lesson04.teach.q_price: {title: "Frage von Daniel", gloss: "Daniel: Wie viel kosten die Äpfel?", note: "Daniel eröffnet das Gespräch mit einer Preisfrage."}
  en.a1.unit08.lesson04.teach.a_price: {title: "Antwort von Leila", gloss: "Leila: Sie kosten zwei Dollar pro Pfund.", note: "Leila nennt den Preis pro Pfund."}
  en.a1.unit08.lesson04.teach.q_two_pounds: {title: "Bestellung von Daniel", gloss: "Daniel: Okay, kann ich zwei Pfund haben, bitte?", note: "*OK* bestätigt, dass Daniel den Preis akzeptiert, bevor er bestellt."}
  en.a1.unit08.lesson04.teach.a_sure_anything_else: {title: "Nachfrage von Leila", gloss: "Leila: Klar. Sonst noch etwas?", note: "*Sure* bedeutet hier 'klar' oder 'gerne.'"}
  en.a1.unit08.lesson04.teach.q_eggs_too: {title: "Zusatzbestellung von Daniel", gloss: "Daniel: Ja, auch ein Dutzend Eier.", note: "*too* am Satzende bedeutet 'auch/ebenfalls.'"}
  en.a1.unit08.lesson04.teach.a_total: {title: "Abschluss von Leila", gloss: "Leila: Das macht acht Dollar.", note: "Leila nennt den Gesamtpreis für Äpfel und Eier zusammen."}

exercises:
  en.a1.unit08.lesson01.exercise01.listen_quantity:
    instruction: "Hören Sie zu und wählen Sie die genannte Menge."
    correct_option: "a dozen eggs"
    distractors: ["a pound of apples", "a bottle of water", "a bag of rice"]
    accepted_answers: [{value: "a dozen eggs", status: "correct"}]
    feedback: "*a dozen eggs* bedeutet ein Dutzend Eier."
  en.a1.unit08.lesson01.exercise02.choose_dozen:
    instruction: "Zwölf Eier zusammen nennt man..."
    correct_option: "a dozen"
    distractors: ["a pound", "a bottle", "a bag"]
    accepted_answers: [{value: "a dozen", status: "correct"}]
    feedback: "*a dozen* bedeutet zwölf Stück."
  en.a1.unit08.lesson01.exercise03.choose_bottle:
    instruction: "Welcher Ausdruck bedeutet 'ein Behälter Wasser'?"
    correct_option: "a bottle of water"
    distractors: ["a bag of rice", "a dozen eggs", "a pound of apples"]
    accepted_answers: [{value: "a bottle of water", status: "correct"}]
    feedback: "*a bottle of water* bedeutet eine Flasche Wasser."
  en.a1.unit08.lesson01.exercise04.match_quantities:
    instruction: "Verbinden Sie jede Beschreibung mit dem richtigen englischen Wort."
    accepted_answers:
      - value:
          - {left: "weight unit for apples", right: "pound"}
          - {left: "twelve of something", right: "dozen"}
          - {left: "container for water", right: "bottle"}
          - {left: "container for rice", right: "bag"}
          - {left: "weight unit for tomatoes", right: "kilo"}
          - {left: "unit of money used to pay for things", right: "dollars"}
          - {left: "means not old, still good to eat", right: "fresh"}
        status: "correct"
    feedback: "*pound*=Pfund, *dozen*=Dutzend, *bottle*=Flasche, *bag*=Tüte, *kilo*=Kilo, *dollars*=Dollar, *fresh*=frisch."
  en.a1.unit08.lesson01.exercise05.write_kilo:
    instruction: "Schreiben Sie, wie Sie ein Kilo Tomaten verlangen, auf Englisch."
    accepted_answers:
      - {value: "a kilo of tomatoes", status: "correct"}
      - {value: "a kilo of tomatoes.", status: "correct"}
    feedback: "*a kilo of tomatoes* bedeutet ein Kilo Tomaten."

  en.a1.unit08.lesson02.exercise01.listen_price_question:
    instruction: "Hören Sie zu und wählen Sie die Frage, die Sie hören."
    correct_option: "How much are the apples"
    distractors: ["They're two dollars a pound", "Can I have two pounds, please?", "Is it fresh?"]
    accepted_answers: [{value: "How much are the apples", status: "correct"}]
    feedback: "*How much are the apples?* bedeutet 'Wie viel kosten die Äpfel?'"
  en.a1.unit08.lesson02.exercise02.listen_price_answer:
    instruction: "Hören Sie noch einmal. Wählen Sie die Antwort, die Sie hören."
    correct_option: "They're two dollars a pound"
    distractors: ["How much are the apples?", "Can I have two pounds, please?", "Is it fresh?"]
    accepted_answers: [{value: "They're two dollars a pound", status: "correct"}]
    feedback: "*They're two dollars a pound* bedeutet 'Sie kosten zwei Dollar pro Pfund.'"
  en.a1.unit08.lesson02.exercise03.order_price_question:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um zu fragen, wie viel die Äpfel kosten."
    accepted_answers: [{value: ["How", "much", "are", "the", "apples"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *How much are the apples?*"
  en.a1.unit08.lesson02.exercise04.reply_price:
    instruction: "Jemand fragt: 'How much are the apples?' Antworten Sie, dass sie zwei Dollar pro Pfund kosten."
    accepted_answers:
      - {value: "They're two dollars a pound.", status: "correct"}
      - {value: "They're two dollars a pound", status: "correct"}
    feedback: "*They're two dollars a pound* bedeutet 'Sie kosten zwei Dollar pro Pfund.'"
  en.a1.unit08.lesson02.exercise05.write_request:
    instruction: "Schreiben Sie, wie Sie höflich um zwei Pfund bitten, auf Englisch."
    accepted_answers:
      - {value: "Can I have two pounds, please?", status: "correct"}
      - {value: "Can I have two pounds, please", status: "correct"}
    feedback: "*Can I have two pounds, please?* bedeutet 'Kann ich zwei Pfund haben, bitte?'"

  en.a1.unit08.lesson03.exercise01.read_apple_price:
    instruction: "Wie viel kosten Äpfel pro Pfund?"
    correct_option: "$2"
    distractors: ["$3", "$4", "$8"]
    accepted_answers: [{value: "$2", status: "correct"}]
    feedback: "Das Schild listet *Apples: $2 per pound* -- Äpfel kosten 2 Dollar pro Pfund."
  en.a1.unit08.lesson03.exercise02.read_egg_price:
    instruction: "Wie viel kostet ein Dutzend Eier?"
    correct_option: "$4"
    distractors: ["$2", "$3", "$8"]
    accepted_answers: [{value: "$4", status: "correct"}]
    feedback: "Das Schild listet *Eggs: $4 a dozen* -- ein Dutzend Eier kostet 4 Dollar."
  en.a1.unit08.lesson03.exercise03.choose_cheapest_item:
    instruction: "Welcher Artikel ist am billigsten?"
    correct_option: "Apples"
    distractors: ["Eggs", "Rice", "Water"]
    accepted_answers: [{value: "Apples", status: "correct"}]
    feedback: "*Apples* für 2 Dollar pro Pfund sind der billigste Artikel auf diesem Schild (*Eggs* $4/Dutzend, *Rice* $3/Tüte)."
  en.a1.unit08.lesson03.exercise04.match_labels:
    instruction: "Verbinden Sie jeden Artikel mit seiner Angabe."
    accepted_answers:
      - value:
          - {left: "Apples", right: "$2 per pound"}
          - {left: "Eggs", right: "$4 a dozen"}
          - {left: "Rice", right: "$3 a bag"}
          - {left: "Water", right: "sold by the bottle"}
          - {left: "Tomatoes", right: "sold by the kilo"}
          - {left: "Total for the whole order", right: "eight dollars"}
        status: "correct"
    feedback: "*Apples*=2 Dollar pro Pfund, *Eggs*=4 Dollar pro Dutzend, *Rice*=3 Dollar pro Tüte, *Water*=nach Flasche verkauft, *Tomatoes*=nach Kilo verkauft, *Total for the whole order*=acht Dollar."
  en.a1.unit08.lesson03.exercise05.write_apple_total:
    instruction: "Schreiben Sie den Preis von Äpfeln pro Pfund, auf Englisch."
    accepted_answers:
      - {value: "Apples are $2 per pound", status: "correct"}
      - {value: "Apples are $2 per pound.", status: "correct"}
    feedback: "*Apples are $2 per pound* bedeutet 'Äpfel kosten 2 Dollar pro Pfund.'"

  en.a1.unit08.lesson04.exercise01.listen_apple_price:
    instruction: "Hören Sie das Gespräch. Wie viel kosten die Äpfel pro Pfund laut Leila?"
    correct_option: "They're two dollars a pound"
    distractors: ["They're four dollars a pound", "Can I have two pounds, please?", "Is it fresh?"]
    accepted_answers: [{value: "They're two dollars a pound", status: "correct"}]
    feedback: "Leila sagt: *They're two dollars a pound* -- 'Sie kosten zwei Dollar pro Pfund.'"
  en.a1.unit08.lesson04.exercise02.listen_total:
    instruction: "Hören Sie noch einmal und wählen Sie den Gesamtpreis, den Sie hören."
    correct_option: "That's eight dollars"
    distractors: ["They're three dollars a pound", "Can I have two pounds, please?", "Is it fresh?"]
    accepted_answers: [{value: "That's eight dollars", status: "correct"}]
    feedback: "*That's eight dollars* bedeutet 'Das macht acht Dollar.'"
  en.a1.unit08.lesson04.exercise03.choose_extra_item:
    instruction: "Was kauft Daniel außer Äpfeln noch?"
    correct_option: "a dozen eggs"
    distractors: ["a bag of rice", "a bottle of water", "a kilo of tomatoes"]
    accepted_answers: [{value: "a dozen eggs", status: "correct"}]
    feedback: "Daniel sagt: *Yes, a dozen eggs too* -- er kauft auch ein Dutzend Eier."
  en.a1.unit08.lesson04.exercise04.order_two_pounds_request:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um höflich um zwei Pfund zu bitten."
    accepted_answers: [{value: ["Can", "I", "have", "two", "pounds", "please"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *Can I have two pounds, please?*"
  en.a1.unit08.lesson04.exercise05.reply_as_leila:
    instruction: "Antworten Sie als Leila auf Daniels Fragen: Nennen Sie den Preis (zwei Dollar pro Pfund), fragen Sie, ob er noch etwas möchte, und nennen Sie den Gesamtpreis (acht Dollar)."
    accepted_answers:
      - {value: "They're two dollars a pound. Sure. Anything else? That's eight dollars.", status: "correct"}
      - {value: "They're two dollars a pound, sure, anything else, and that's eight dollars.", status: "correct"}
      - {value: "They're two dollars a pound Sure Anything else That's eight dollars", status: "correct"}
    feedback: "Eine vollständige Antwort nennt den Preis pro Pfund, fragt nach weiteren Wünschen und nennt den Gesamtpreis."
  en.a1.unit08.lesson04.exercise06.speak_shopping:
    instruction: "Antworten Sie laut als Leila auf Daniels Fragen: Nennen Sie den Preis (zwei Dollar pro Pfund), fragen Sie, ob er noch etwas möchte, und nennen Sie den Gesamtpreis (acht Dollar)."
    accepted_answers:
      - {value: "They're two dollars a pound Sure Anything else That's eight dollars", status: "correct"}
      - {value: "They're two dollars a pound. Sure. Anything else? That's eight dollars.", status: "correct"}
      - {value: "They're two dollars a pound, sure, anything else, and that's eight dollars.", status: "correct"}
    feedback: "Diese vollständige Antwort deckt den Preis, die Nachfrage und den Gesamtbetrag ab."
