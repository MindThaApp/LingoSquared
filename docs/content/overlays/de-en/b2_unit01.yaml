teaching:
  en.b2.unit01.lesson01.teach.claim:
    title: claim
    gloss: Standpunkt, Behauptung
    note: '*claim* ist der Standpunkt, den Sie verteidigen. Hier bedeutet es weder Beschwerde noch Schadenersatzforderung.'
    example_gloss: Ihr Standpunkt ist, dass der Plan weiterverfolgt werden sollte.
  en.b2.unit01.lesson01.teach.evidence:
    title: evidence
    gloss: Beleg, Begründung durch Fakten
    note: '*evidence* sind Fakten, Zahlen oder Beispiele, mit denen Sie Ihren Standpunkt stützen.'
    example_gloss: Dieses Beispiel liefert Mia einen Beleg für ihren Standpunkt.
  en.b2.unit01.lesson01.teach.counterargument:
    title: counterargument
    gloss: Gegenargument
    note: '*counterargument* ist ein Punkt, der gegen Ihren Standpunkt spricht. Im Englischen schreibt man es in einem Wort, ohne Bindestrich.'
    example_gloss: Daniel bringt ein Gegenargument vor.
  en.b2.unit01.lesson01.teach.rebut:
    title: rebut
    gloss: widerlegen
    note: '*rebut* bedeutet, dass Sie ein Gegenargument beantworten, ohne Ihren eigenen Standpunkt aufzugeben.'
    example_gloss: Mia widerlegt die Sorge mit Belegen.
  en.b2.unit01.lesson01.teach.concede:
    title: concede
    gloss: einräumen, zugestehen
    note: '*concede* bedeutet, dass Sie anerkennen, dass ein Teil des anderen Punktes berechtigt ist. Das heißt nicht, dass Sie Ihren ganzen Standpunkt aufgeben.'
    example_gloss: Man kann eine Sorge anerkennen, ohne seinen Hauptstandpunkt aufzugeben.
  en.b2.unit01.lesson01.teach.outweigh:
    title: outweigh
    gloss: schwerer wiegen als, überwiegen
    note: '*outweigh* verwenden Sie, wenn ein Vorteil, ein Risiko oder ein Grund wichtiger ist als etwas anderes.'
    example_gloss: Starke Belege können schwerer wiegen als eine Sorge.
  en.b2.unit01.lesson02.teach.position_with_evidence:
    title: Ein Risiko anerkennen und beim Standpunkt bleiben
    gloss: Ich stimme zu, dass der Plan Risiken hat, aber die Belege sprechen weiterhin dafür, voranzugehen.
    note: '*I agree..., but...* erkennt zuerst den anderen Punkt an. Danach zeigt *but the evidence still supports...*, dass Ihr Standpunkt bestehen bleibt.'
  en.b2.unit01.lesson02.teach.strongest_reason:
    title: Den stärksten Grund nennen
    gloss: Der stärkste Grund ist, dass die Umfrageergebnisse konsistent waren.
    note: '*The strongest reason is that...* leitet Ihre wichtigste Begründung ein. Beachten Sie die englische Satzstellung nach *that*: erst das Subjekt, dann das Verb, wie im Hauptsatz.'
  en.b2.unit01.lesson02.teach.fair_concern:
    title: Eine berechtigte Sorge anerkennen
    gloss: Das ist eine berechtigte Sorge; die Daten weisen jedoch in die andere Richtung.
    note: '*That is a fair concern; however,...* klingt professionell: Sie erkennen die Sorge an, widerlegen sie aber mit Daten.'
  en.b2.unit01.lesson02.teach.grammar_argument_shape:
    title: Einen Standpunkt verteidigen
    gloss: Nennen Sie Ihren Standpunkt, belegen Sie ihn, erkennen Sie den stärksten Gegenpunkt an und widerlegen Sie ihn. Formulierungen wie That is a fair concern und However lassen Sie vernünftig klingen, ohne Ihren Standpunkt aufzugeben.
    note: 'Im englischen Nebensatz nach *that* bleibt die Wortstellung wie im Hauptsatz: *the data points...*. Das Verb rutscht nicht ans Satzende, also nicht *the data in the other direction points*.'
  en.b2.unit01.lesson03.teach.retention:
    title: retention
    gloss: Mitarbeiterbindung
    note: '*retention* bedeutet hier, dass Mitarbeitende im Unternehmen bleiben, statt zu gehen.'
    example_gloss: Bessere Mitarbeiterbindung bedeutet, dass weniger Beschäftigte das Team verlassen.
  en.b2.unit01.lesson03.teach.collaboration:
    title: collaboration
    gloss: Zusammenarbeit
    note: '*collaboration* ist das gemeinsame Arbeiten an einer Aufgabe oder einem Projekt. Anders als das deutsche Wort *Kollaboration* hat es keinen negativen, historischen Beigeschmack.'
    example_gloss: Gute Zusammenarbeit hilft einem Team, Arbeit abzuschließen.
  en.b2.unit01.lesson03.teach.reading_passage:
    title: 'Lesetext: einen hybriden Arbeitsplan verteidigen'
    gloss: 'Mia argumentiert, dass das Unternehmen den hybriden Arbeitsplan im nächsten Quartal beibehalten sollte. Ihr Hauptstandpunkt ist, dass hybrides Arbeiten die Mitarbeiterbindung verbessert, ohne die Leistung zu senken. Der stärkste Beleg ist die Mitarbeiterumfrage: Beschäftigte in hybriden Teams sagten seltener, dass sie nach einer anderen Stelle suchten. Das stärkste Gegenargument ist, dass die Zusammenarbeit leiden könnte, wenn die Leute nicht jeden Tag im Büro sind. Mia erkennt diese Sorge an, widerlegt sie aber mit Projektdaten: Die hybriden Teams lieferten pünktlich, und ihre Bewertungen waren etwas besser. Aus diesem Grund kommt sie zu dem Schluss, dass die Vorteile die Risiken überwiegen.'
    note: 'Der Text baut ein vollständiges Argument auf: Standpunkt, Beleg, Gegenargument, Widerlegung und Schlussfolgerung.'
  en.b2.unit01.lesson04.teach.q_keep_hybrid:
    title: Mia nennt ihren Standpunkt
    gloss: 'Mia sagt: Ich denke, wir sollten den hybriden Arbeitsplan im nächsten Quartal beibehalten.'
    note: Mia beginnt mit einem klaren, verteidigbaren Standpunkt.
  en.b2.unit01.lesson04.teach.a_strongest_reason:
    title: Daniel fragt nach dem Grund
    gloss: 'Daniel sagt: Was ist dein stärkster Grund?'
    note: Daniel fragt nicht allgemein nach einer Meinung, sondern nach der wichtigsten Begründung.
  en.b2.unit01.lesson04.teach.q_retention_survey:
    title: Mia liefert einen Beleg
    gloss: 'Mia sagt: Der stärkste Grund ist die Mitarbeiterbindung. In der Mitarbeiterumfrage sagten Leute, die hybrid arbeiteten, seltener, dass sie nach einer anderen Stelle suchten.'
    note: Mia stützt sich auf Umfrageergebnisse als Beleg, nicht nur auf ein Gefühl.
  en.b2.unit01.lesson04.teach.a_collaboration_weaker:
    title: Daniel nennt das Gegenargument
    gloss: 'Daniel sagt: Manche Führungskräfte sagen, die Zusammenarbeit sei schwächer, wenn die Leute nicht jeden Tag im Büro sind.'
    note: Das ist das Gegenargument, das Mia gleich beantworten muss.
  en.b2.unit01.lesson04.teach.q_data_rebuttal:
    title: Mia widerlegt mit Daten
    gloss: 'Mia sagt: Das ist eine berechtigte Sorge. Die Projektdaten stützen sie jedoch nicht. Die hybriden Teams lieferten ihre Arbeit pünktlich ab, und ihre Bewertungen waren etwas besser.'
    note: In *does not support it* steht *does*, weil die englische Verneinung des Vollverbs das Hilfsverb *do* braucht.
  en.b2.unit01.lesson04.teach.a_benefits_outweigh:
    title: Daniel fasst die Position zusammen
    gloss: 'Daniel sagt: Dein Standpunkt ist also, dass die Vorteile die Risiken überwiegen?'
    note: '*outweigh* drückt die Abwägung zwischen Vorteilen und Risiken aus.'
  en.b2.unit01.lesson04.teach.q_improve_routines:
    title: Mia schließt mit einer Lösung ab
    gloss: 'Mia sagt: Genau. Wir sollten die Besprechungsroutinen verbessern, nicht den Arbeitsplan abschaffen.'
    note: Mia verteidigt den Plan, schlägt aber auch eine praktische Verbesserung vor.
