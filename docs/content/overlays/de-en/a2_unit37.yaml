teaching:
  en.a2.unit37.lesson01.teach.video_call: {title: "video call", gloss: "Videoanruf", note: "*video call* ist ein Gespräch, bei dem man sich auch sehen kann. Im Deutschen sagt man oft auch Videochat oder Videokonferenz.", example_gloss: "Ich habe jeden Montag einen Videoanruf mit meinem Team."}
  en.a2.unit37.lesson01.teach.camera: {title: "camera", gloss: "Kamera", note: "*camera* ist das Gerät, das Ihr Bild überträgt.", example_gloss: "Schalte bitte deine Kamera ein, bevor die Besprechung anfängt."}
  en.a2.unit37.lesson01.teach.microphone: {title: "microphone", gloss: "Mikrofon", note: "*microphone* ist das Gerät, das Ihre Stimme überträgt.", example_gloss: "Mein Mikrofon war aus, deshalb haben die anderen mich nicht gehört."}
  en.a2.unit37.lesson01.teach.connection: {title: "connection", gloss: "Verbindung", note: "*connection* ist die Verbindung zwischen Ihrem Computer und dem Internet.", example_gloss: "Die Verbindung war schlecht, deshalb ist das Bild stehen geblieben."}
  en.a2.unit37.lesson01.teach.mute: {title: "mute", gloss: "stumm schalten", note: "*mute* bedeutet, den eigenen Ton auszuschalten, damit die anderen Sie nicht hören.", example_gloss: "Ich schalte mein Mikrofon stumm, wenn ich gerade nicht spreche."}
  en.a2.unit37.lesson01.teach.face_to_face: {title: "face to face", gloss: "persönlich / von Angesicht zu Angesicht", note: "*face to face* bedeutet, dass man im selben Raum ist und nicht über einen Bildschirm spricht.", example_gloss: "Manche Besprechungen sind persönlich besser als online."}
  en.a2.unit37.lesson01.teach.grammar_comparison: {title: "Vergleichen mit faster than und less ... than", gloss: "Ein Videoanruf geht schneller als ein Besuch. Ein Videoanruf ist weniger persönlich als ein Treffen von Angesicht zu Angesicht.", note: "Bei kurzen Adjektiven hängt man *-er* an und setzt *than* dahinter (*faster than*). Bei längeren Adjektiven verwendet man *less ... than* oder *more ... than*."}

  en.a2.unit37.lesson02.teach.video_call_every_monday: {title: "Sagen, wie oft Sie Videoanrufe haben", gloss: "Ich habe jeden Montag einen Videoanruf mit meinem Team.", note: "*every Monday* bedeutet jeden Montag und beschreibt eine feste Gewohnheit."}
  en.a2.unit37.lesson02.teach.turn_on_your_camera: {title: "Jemanden bitten, die Kamera einzuschalten", gloss: "Kannst du bitte deine Kamera einschalten?", note: "*turn on* bedeutet einschalten, das Gegenteil ist *turn off* (ausschalten)."}
  en.a2.unit37.lesson02.teach.you_were_on_mute: {title: "Sagen, dass jemand stumm geschaltet war", gloss: "Sorry, du warst stumm geschaltet.", note: "*you were on mute* ist die feste Wendung, wenn jemand nicht zu hören war, weil sein Mikrofon stumm geschaltet war."}
  en.a2.unit37.lesson02.teach.useful_but_prefer_face_to_face: {title: "Die eigene Meinung mit einer Vorliebe sagen", gloss: "Ich finde Videoanrufe praktisch, aber ich treffe Leute lieber persönlich.", note: "Mit *I think ... but I prefer ...* sagen Sie erst Ihre Meinung und dann, was Sie lieber mögen."}
  en.a2.unit37.lesson02.teach.grammar_prefer: {title: "prefer X to Y", gloss: "Ich mag Videoanrufe lieber als Telefonate. Ich mag persönliche Treffen lieber als Videoanrufe.", note: "Achtung: Nach *prefer* steht *to*, nicht *than*, auch wenn wir im Deutschen \"lieber als\" sagen: *I prefer video calls to phone calls*."}

  en.a2.unit37.lesson03.teach.headphones: {title: "headphones", gloss: "Kopfhörer", note: "*headphones* steht im Englischen immer im Plural, auch wenn Sie nur ein Paar benutzen.", example_gloss: "Ich benutze Kopfhörer, damit meine Familie die Besprechung nicht hört."}
  en.a2.unit37.lesson03.teach.leilas_message: {title: "Leilas Nachricht", gloss: "Meine Online-Kurse sind jetzt alle Videoanrufe. Ich schalte meine Kamera ein, aber mein Mikrofon bleibt stumm, bis die Lehrerin eine Frage stellt. Ich benutze Kopfhörer, weil meine Verbindung damit besser ist. Ich finde, dass Videoanrufe viel Zeit sparen, aber ich treffe meine Mitschüler trotzdem lieber persönlich.", note: "Eine lockere Nachricht von Leila über ihre eigenen Online-Kurse."}
  en.a2.unit37.lesson03.teach.mute_until_question: {title: "Sagen, wann Sie Ihr Mikrofon stumm schalten", gloss: "Mein Mikrofon bleibt stumm, bis die Lehrerin eine Frage stellt.", note: "*until* bedeutet \"bis\": etwas dauert, bis ein bestimmter Moment kommt."}

  en.a2.unit37.lesson04.teach.q_lot_of_video_calls: {title: "Leila fragt nach Daniels Arbeit", gloss: "Leila fragt: Hast du bei der Arbeit viele Videoanrufe?", note: "*a lot of* bedeutet viel und passt sowohl zu zählbaren als auch zu nicht zählbaren Wörtern."}
  en.a2.unit37.lesson04.teach.a_call_every_monday: {title: "Daniel erzählt von seinem festen Termin", gloss: "Daniel sagt: Ja, ich habe jeden Montag einen Videoanruf mit meinem Team.", note: "Derselbe Satz wie in Lektion 2."}
  en.a2.unit37.lesson04.teach.q_turn_on_camera: {title: "Leila fragt nach der Kamera", gloss: "Leila fragt: Schaltest du deine Kamera ein?", note: "Eine kurze Nachfrage, um mehr zu erfahren."}
  en.a2.unit37.lesson04.teach.a_always_but_mute: {title: "Daniels Gewohnheit im Videoanruf", gloss: "Daniel sagt: Immer, aber ich schalte mein Mikrofon stumm, wenn ich nicht spreche.", note: "*when I am not speaking* bedeutet hier: in den Momenten, in denen ich nicht spreche."}
  en.a2.unit37.lesson04.teach.q_classes_are_video_calls: {title: "Leila erzählt von ihren Kursen", gloss: "Leila sagt: Meine Online-Kurse sind jetzt alle Videoanrufe.", note: "Das knüpft an ihre Kurse am Montag und Mittwoch aus Einheit 33 an."}
  en.a2.unit37.lesson04.teach.a_what_do_you_think: {title: "Daniel fragt nach ihrer Meinung", gloss: "Daniel fragt: Was hältst du davon?", note: "*What do you think about them?* fragt nach der Meinung zu etwas, das gerade erwähnt wurde."}
  en.a2.unit37.lesson04.teach.q_useful_but_prefer: {title: "Leila sagt ihre Meinung", gloss: "Leila sagt: Ich finde Videoanrufe praktisch, aber ich treffe Leute lieber persönlich.", note: "Dieselbe Meinung wie in Lektion 2."}
  en.a2.unit37.lesson04.teach.a_agree_faster_less_personal: {title: "Daniel stimmt ihr zu", gloss: "Daniel sagt: Da stimme ich dir zu. Ein Videoanruf geht schneller als ein Besuch, aber er ist weniger persönlich.", note: "Mit *I agree* drücken Sie Zustimmung aus. Danach nennt man meist den eigenen Grund."}
  en.a2.unit37.lesson04.teach.q_exactly: {title: "Leila bestätigt", gloss: "Leila sagt: Genau.", note: "*Exactly* ist eine kurze Art zu sagen, dass Sie völlig einverstanden sind."}

