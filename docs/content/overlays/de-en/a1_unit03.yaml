  en.a1.unit03.lesson02.teach.eleven: {title: "eleven", gloss: "elf", note: "*eleven* ist unregelmäßig, wie im Deutschen *elf*.", example_gloss: "Ich wohne in Hausnummer elf."}
  en.a1.unit03.lesson02.teach.twelve: {title: "twelve", gloss: "zwölf", note: "*twelve* ist ebenfalls unregelmäßig, wie *zwölf*.", example_gloss: "Ich wohne in Hausnummer zwölf."}
  en.a1.unit03.lesson02.teach.thirteen: {title: "thirteen", gloss: "dreizehn", note: "Ab 13 folgt Englisch dem Muster Grundzahl + *-teen*, ähnlich wie Deutsch + *-zehn*.", example_gloss: "Ich wohne in Hausnummer dreizehn."}
  en.a1.unit03.lesson02.teach.fifteen: {title: "fifteen", gloss: "fünfzehn", note: "*fifteen*, nicht *fiveteen* -- eine kleine Unregelmäßigkeit im Englischen.", example_gloss: "Ich wohne in Hausnummer fünfzehn."}
  en.a1.unit03.lesson02.teach.twenty: {title: "twenty", gloss: "zwanzig", note: "*twenty* ist die englische Zahl 20.", example_gloss: "Ich wohne in Hausnummer zwanzig."}
  en.a1.unit03.lesson02.teach.twenty_one: {title: "twenty-one", gloss: "einundzwanzig", note: "Anders als im Deutschen (*einundzwanzig*, Einer vor Zehner) sagt man im Englischen die Zehnerzahl zuerst: *twenty-one*, mit Bindestrich."}
  en.a1.unit03.lesson02.teach.thirty: {title: "thirty", gloss: "dreißig", note: "*thirty* ist die englische Zahl 30.", example_gloss: "Das kostet dreißig Dollar."}
  en.a1.unit03.lesson02.teach.forty: {title: "forty", gloss: "vierzig", note: "Achtung: *forty*, nicht *fourty* -- das *u* aus *four* entfällt.", example_gloss: "Das kostet vierzig Dollar."}
  en.a1.unit03.lesson02.teach.fifty: {title: "fifty", gloss: "fünfzig", note: "*fifty* ist die englische Zahl 50.", example_gloss: "Das kostet fünfzig Dollar."}
  en.a1.unit03.lesson02.teach.hundred: {title: "one hundred", gloss: "hundert", note: "Im Englischen braucht man *one* vor *hundred* -- anders als im Deutschen, wo *hundert* allein steht."}

  en.a1.unit03.lesson03.teach.how_old: {title: "How old are you?", gloss: "Wie alt sind Sie? / Wie alt bist du?", note: "*How old are you?* funktioniert in jedem Register -- keine Sie/du-Unterscheidung im Englischen."}
  en.a1.unit03.lesson03.teach.im_25: {title: "I'm twenty-five years old.", gloss: "Ich bin fünfundzwanzig Jahre alt.", note: "Gleiche Wortstellung wie im Deutschen: Zahl + *years old*."}
  en.a1.unit03.lesson03.teach.how_much: {title: "How much is this?", gloss: "Wie viel kostet das?", note: "Fragt nach dem Preis von etwas."}
  en.a1.unit03.lesson03.teach.its_ten_dollars: {title: "It's ten dollars.", gloss: "Das kostet zehn Dollar.", note: "Die Standardantwort auf eine Preisfrage."}
  en.a1.unit03.lesson03.teach.phone_question: {title: "What's your phone number?", gloss: "Wie ist Ihre Telefonnummer?", note: "Fragt nach einer Telefonnummer."}
  en.a1.unit03.lesson03.teach.phone_answer: {title: "It's five-five-five, one-two-three-four.", gloss: "Sie ist fünf-fünf-fünf, eins-zwei-drei-vier.", note: "Telefonnummern werden im Englischen Ziffer für Ziffer genannt, mit Pausen zwischen den Gruppen."}

  en.a1.unit03.lesson04.teach.market: {title: "market", gloss: "der Markt", note: "Ein Ort, an dem man Lebensmittel und andere Waren kauft.", example_gloss: "Wir sind auf dem Markt."}
  en.a1.unit03.lesson04.teach.apples: {title: "apples", gloss: "Äpfel", note: "Mehrzahl von *apple*.", example_gloss: "Die Äpfel sind frisch."}
  en.a1.unit03.lesson04.teach.opening: {title: "Daniel eröffnet das Gespräch", gloss: "Daniel fragt: Wie viel kostet das?", note: "Eine einfache Preisfrage."}
  en.a1.unit03.lesson04.teach.price_five: {title: "Leila antwortet", gloss: "Leila sagt: Das kostet fünf Dollar.", note: "Die Antwort auf Daniels Preisfrage."}
  en.a1.unit03.lesson04.teach.ask_apples: {title: "Daniel fragt nach den Äpfeln", gloss: "Daniel fragt: Und wie viel kosten die Äpfel?", note: "*And* verbindet diese Frage mit der vorherigen."}
  en.a1.unit03.lesson04.teach.price_two: {title: "Leila antwortet", gloss: "Leila sagt: Die kosten zwei Dollar.", note: "*They're* wird verwendet, weil *apples* Mehrzahl ist."}
  en.a1.unit03.lesson04.teach.ask_shop_age: {title: "Daniel fragt nach dem Alter des Ladens", gloss: "Daniel sagt: OK, wie alt ist dieser Laden?", note: "*How old* kann sich auch auf Dinge beziehen, nicht nur auf Personen."}
  en.a1.unit03.lesson04.teach.shop_age: {title: "Leila antwortet", gloss: "Leila sagt: Er ist zwanzig Jahre alt!", note: "Gleiche Konstruktion wie bei Personen -- *years old* funktioniert auch für Dinge."}

exercises:
  en.a1.unit03.lesson01.exercise01.listen_low:
    instruction: "Hören Sie zu und wählen Sie die Zahl aus, die Sie hören."
    correct_option: "five"
    distractors: ["four", "six", "seven"]
    accepted_answers: [{value: "five", status: "correct"}]
    feedback: "*five* bedeutet fünf."
  en.a1.unit03.lesson01.exercise02.choose_three:
    instruction: "Welches Wort bedeutet 3?"
    correct_option: "three"
    distractors: ["two", "four", "five"]
    accepted_answers: [{value: "three", status: "correct"}]
    feedback: "*three* bedeutet drei."
  en.a1.unit03.lesson01.exercise03.choose_eight:
    instruction: "Welches Wort bedeutet 8?"
    correct_option: "eight"
    distractors: ["seven", "nine", "six"]
    accepted_answers: [{value: "eight", status: "correct"}]
    feedback: "*eight* bedeutet acht."
  en.a1.unit03.lesson01.exercise04.match_digits:
    instruction: "Verbinden Sie jedes englische Zahlwort mit seiner Ziffer."
    accepted_answers:
      - value:
          - {left: "1", right: "one"}
          - {left: "2", right: "two"}
          - {left: "3", right: "three"}
          - {left: "4", right: "four"}
          - {left: "0", right: "zero"}
          - {left: "5", right: "five"}
          - {left: "6", right: "six"}
          - {left: "7", right: "seven"}
          - {left: "8", right: "eight"}
          - {left: "9", right: "nine"}
          - {left: "10", right: "ten"}
        status: "correct"
    feedback: "1=one, 2=two, 3=three, 4=four."
  en.a1.unit03.lesson01.exercise05.order_seven:
    instruction: "Bilden Sie mit den Kacheln das Wort, das 7 bedeutet."
    accepted_answers: [{value: "seven", status: "correct"}]
    feedback: "*seven* bedeutet sieben."
  en.a1.unit03.lesson01.exercise06.write_ten:
    instruction: "Schreiben Sie das englische Wort für 10."
    accepted_answers:
      - {value: "ten", status: "correct"}
      - {value: "ten.", status: "correct"}
    feedback: "*ten* bedeutet zehn."

  en.a1.unit03.lesson02.exercise01.listen_tens:
    instruction: "Hören Sie zu und wählen Sie die Zahl aus, die Sie hören."
    correct_option: "forty"
    distractors: ["thirty", "fifty", "fourteen"]
    accepted_answers: [{value: "forty", status: "correct"}]
    feedback: "*forty* bedeutet vierzig."
  en.a1.unit03.lesson02.exercise02.choose_thirteen:
    instruction: "Welches Wort bedeutet 13?"
    correct_option: "thirteen"
    distractors: ["thirty", "fifteen", "twelve"]
    accepted_answers: [{value: "thirteen", status: "correct"}]
    feedback: "*thirteen* bedeutet dreizehn."
  en.a1.unit03.lesson02.exercise03.choose_twenty_one:
    instruction: "Welches Wort bedeutet 21?"
    correct_option: "twenty-one"
    distractors: ["twelve", "twenty", "eleven"]
    accepted_answers: [{value: "twenty-one", status: "correct"}]
    feedback: "*twenty-one* bedeutet einundzwanzig -- im Englischen zuerst der Zehner, dann der Einer."
  en.a1.unit03.lesson02.exercise04.match_tens:
    instruction: "Verbinden Sie jedes englische Zahlwort mit seiner Ziffer."
    accepted_answers:
      - value:
          - {left: "20", right: "twenty"}
          - {left: "30", right: "thirty"}
          - {left: "40", right: "forty"}
          - {left: "50", right: "fifty"}
          - {left: "11", right: "eleven"}
          - {left: "12", right: "twelve"}
          - {left: "13", right: "thirteen"}
          - {left: "15", right: "fifteen"}
          - {left: "21", right: "twenty-one"}
          - {left: "100", right: "one hundred"}
        status: "correct"
    feedback: "20=twenty, 30=thirty, 40=forty, 50=fifty."
  en.a1.unit03.lesson02.exercise05.order_hundred:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um 100 zu sagen."
    accepted_answers: [{value: ["one", "hundred"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *one hundred*."
  en.a1.unit03.lesson02.exercise06.write_fifteen:
    instruction: "Schreiben Sie das englische Wort für 15."
    accepted_answers:
      - {value: "fifteen", status: "correct"}
      - {value: "fifteen.", status: "correct"}
    feedback: "*fifteen* bedeutet fünfzehn."

  en.a1.unit03.lesson03.exercise01.listen_age_question:
    instruction: "Hören Sie zu und wählen Sie die Frage aus, die Sie hören."
    correct_option: "How old are you"
    distractors: ["What's your phone number", "How much is this", "How old is this"]
    accepted_answers: [{value: "How old are you", status: "correct"}]
    feedback: "*How old are you?* fragt nach dem Alter."
  en.a1.unit03.lesson03.exercise02.choose_age_answer:
    instruction: "Jemand fragt: 'How old are you?' Antworten Sie, dass Sie fünfundzwanzig Jahre alt sind."
    correct_option: "I'm twenty-five years old"
    distractors: ["It's ten dollars", "It's five-five-five, one-two-three-four", "How old are you"]
    accepted_answers: [{value: "I'm twenty-five years old", status: "correct"}]
    feedback: "*I'm twenty-five years old* bedeutet: Ich bin fünfundzwanzig Jahre alt."
  en.a1.unit03.lesson03.exercise03.order_price:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um 'Das kostet zehn Dollar' zu sagen."
    accepted_answers: [{value: ["It's", "ten", "dollars"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *It's ten dollars*."
  en.a1.unit03.lesson03.exercise04.listen_phone_question:
    instruction: "Hören Sie zu und wählen Sie die Frage aus, die Sie hören."
    correct_option: "What's your phone number"
    distractors: ["How old are you", "How much is this", "It's ten dollars"]
    accepted_answers: [{value: "What's your phone number", status: "correct"}]
    feedback: "*What's your phone number?* fragt nach der Telefonnummer."
  en.a1.unit03.lesson03.exercise05.reply_phone:
    instruction: "Jemand fragt: 'What's your phone number?' Antworten Sie mit: 555-1234."
    accepted_answers:
      - {value: "It's five-five-five, one-two-three-four.", status: "correct"}
      - {value: "It's five five five one two three four", status: "correct"}
    feedback: "Telefonnummern werden Ziffer für Ziffer genannt."
  en.a1.unit03.lesson03.exercise06.write_price:
    instruction: "Schreiben Sie den Preis: $10."
    accepted_answers:
      - {value: "It's ten dollars", status: "correct"}
      - {value: "It's ten dollars.", status: "correct"}
    feedback: "*It's ten dollars* bedeutet: Das kostet zehn Dollar."

  en.a1.unit03.lesson04.exercise01.listen_price_this:
    instruction: "Hören Sie sich das Gespräch an. Was kostet der erste Artikel?"
    correct_option: "five dollars"
    distractors: ["two dollars", "ten dollars", "twenty dollars"]
    accepted_answers: [{value: "five dollars", status: "correct"}]
    feedback: "Leila sagt: *It's five dollars.*"
  en.a1.unit03.lesson04.exercise02.listen_price_apples:
    instruction: "Hören Sie zu und wählen Sie aus, was die Äpfel kosten."
    correct_option: "They're two dollars"
    distractors: ["They're five dollars", "It's ten dollars", "They're twenty dollars"]
    accepted_answers: [{value: "They're two dollars", status: "correct"}]
    feedback: "Leila sagt: *They're two dollars.*"
  en.a1.unit03.lesson04.exercise03.choose_shop_age:
    instruction: "Wie alt ist der Laden?"
    correct_option: "It's twenty years old"
    distractors: ["It's ten years old", "It's five years old", "It's thirty years old"]
    accepted_answers: [{value: "It's twenty years old", status: "correct"}]
    feedback: "Leila sagt: *It's twenty years old!*"
  en.a1.unit03.lesson04.exercise04.order_apples_question:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um zu fragen, was die Äpfel kosten."
    accepted_answers: [{value: ["how", "much", "are", "the", "apples"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *how much are the apples*."
  en.a1.unit03.lesson04.exercise05.reply_as_leila:
    instruction: "Daniel fragt: Wie viel kostet das? Und wie viel kosten die Äpfel? Antworten Sie als Leila mit beiden Preisen."
    accepted_answers:
      - {value: "It's five dollars. They're two dollars.", status: "correct"}
      - {value: "It's five dollars, and they're two dollars.", status: "correct"}
      - {value: "It's five dollars They're two dollars", status: "correct"}
    feedback: "Diese vollständige Antwort nennt beide Preise."
  en.a1.unit03.lesson04.exercise06.speak_prices:
    instruction: "Antworten Sie laut in der Rolle von Leila: nennen Sie beide Preise und das Alter des Ladens."
    accepted_answers:
      - {value: "It's five dollars. They're two dollars. It's twenty years old.", status: "correct"}
      - {value: "It's five dollars, they're two dollars, and it's twenty years old.", status: "correct"}
      - {value: "It's five dollars They're two dollars It's twenty years old", status: "correct"}
    feedback: "Diese vollständige Antwort deckt beide Preise und das Alter des Ladens ab."
