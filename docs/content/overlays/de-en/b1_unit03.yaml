  en.b1.unit03.lesson01.conditional_vocabulary: {title: "If, rain und free time"}
  en.b1.unit03.lesson02.real_conditions: {title: "If it rains, we will stay home"}
  en.b1.unit03.lesson03.reading_more_free_time: {title: "Lesen: if she had more free time"}
  en.b1.unit03.lesson04.the_weekend_plans_dialogue: {title: "If there's another one, you should join"}

teaching:
  en.b1.unit03.lesson01.teach.if: {title: "if", gloss: "wenn / falls", note: "*if* leitet eine Bedingung ein.", example_gloss: "Wenn es regnet, bleiben wir zu Hause."}
  en.b1.unit03.lesson01.teach.rain: {title: "rain", gloss: "Regen / regnen", note: "*rain* bedeutet Wasser, das vom Himmel fällt, oder 'regnen'.", example_gloss: "Es könnte dieses Wochenende regnen."}
  en.b1.unit03.lesson01.teach.stay_home: {title: "stay home", gloss: "zu Hause bleiben", note: "*stay home* bedeutet, nicht hinauszugehen und zu Hause zu bleiben.", example_gloss: "Wenn es regnet, bleiben wir zu Hause."}
  en.b1.unit03.lesson01.teach.weekend: {title: "weekend", gloss: "Wochenende", note: "*weekend* bedeutet Samstag und Sonntag.", example_gloss: "Was sind deine Pläne fürs Wochenende?"}
  en.b1.unit03.lesson01.teach.free_time: {title: "free time", gloss: "Freizeit", note: "*free time* bedeutet Zeit, in der man nicht arbeitet und nicht beschäftigt ist.", example_gloss: "Ich habe im Moment nicht viel Freizeit."}
  en.b1.unit03.lesson01.teach.paint: {title: "paint", gloss: "malen", note: "*paint* bedeutet, ein Bild mit Farbe zu machen.", example_gloss: "Leila malt gern am Wochenende."}

  en.b1.unit03.lesson02.teach.if_rains_stay_home: {title: "eine reale Bedingung in der Zukunft", gloss: "Wenn es morgen regnet, bleiben wir zu Hause.", note: "*if + present, will + Grundform* drückt eine reale, mögliche Bedingung in der Zukunft aus."}
  en.b1.unit03.lesson02.teach.if_have_free_time_paint: {title: "eine weitere reale Bedingung", gloss: "Wenn ich dieses Wochenende Freizeit habe, werde ich malen.", note: "Dieselbe Konstruktion: *if + present, will + Grundform*."}
  en.b1.unit03.lesson02.teach.grammar_real_condition: {title: "reale Bedingungen", gloss: "Wenn es regnet, bleiben wir zu Hause. Wenn ich Zeit habe, werde ich malen.", note: "Nach *if* verwendet Englisch hier die Gegenwart, auch wenn es um die Zukunft geht -- nicht *will rain*."}

  en.b1.unit03.lesson03.teach.would: {title: "would", gloss: "würde", note: "*would* + Grundform drückt eine unwirkliche oder hypothetische Situation in der Gegenwart aus.", example_gloss: "Wenn ich mehr Zeit hätte, würde ich jeden Tag malen."}
  en.b1.unit03.lesson03.teach.class: {title: "class", gloss: "Kurs / Unterricht", note: "*class* bedeutet einen organisierten Kurs oder Unterricht mit einer Lehrperson.", example_gloss: "Es gab einen Malkurs in der Nähe ihres Hauses."}
  en.b1.unit03.lesson03.teach.reading_passage: {title: "Lesetext: wenn sie mehr Freizeit hätte", gloss: "Leila malt gern, aber sie hat nicht viel Freizeit. Wenn sie mehr Freizeit hätte, würde sie jeden Tag malen. Letzten Monat gab es einen Malkurs in der Nähe ihres Hauses. Wenn sie früher davon gewusst hätte, hätte sie sich angemeldet. Jetzt sucht sie jede Woche nach neuen Kursen.", note: "Ein kurzer Lesetext mit einer unwirklichen Situation in der Gegenwart und einer unwirklichen Situation in der Vergangenheit."}

  en.b1.unit03.lesson04.teach.q_weekend_plans: {title: "Daniel fragt nach dem Wochenende", gloss: "Daniel sagt: Was sind deine Pläne fürs Wochenende?", note: "Eine einfache offene Frage, um ein Gespräch zu beginnen."}
  en.b1.unit03.lesson04.teach.a_walk_or_stay_home: {title: "Leilas Pläne, je nach Wetter", gloss: "Leila sagt: Wenn es nicht regnet, gehe ich spazieren. Wenn es regnet, bleibe ich zu Hause und male.", note: "Zwei reale Bedingungen nacheinander, abhängig vom Wetter."}
  en.b1.unit03.lesson04.teach.q_take_class: {title: "Daniel fragt nach dem Malkurs", gloss: "Daniel sagt: Das klingt schön. Hast du letzten Monat diesen Malkurs gemacht?", note: "Eine Anschlussfrage über etwas in der Vergangenheit."}
  en.b1.unit03.lesson04.teach.a_would_have_signed_up: {title: "Leilas Reue über die Vergangenheit", gloss: "Leila sagt: Nein. Wenn ich früher davon gewusst hätte, hätte ich mich angemeldet.", note: "*if + past perfect, would have + Partizip* drückt eine unwirkliche Vergangenheit oder Reue aus."}
  en.b1.unit03.lesson04.teach.q_should_join: {title: "Daniel gibt eine Empfehlung", gloss: "Daniel sagt: Das ist schade. Wenn es noch einen gibt, solltest du mitmachen.", note: "Daniel verwendet *should*, um Leila zu ermutigen, die nächste Gelegenheit zu nutzen."}
  en.b1.unit03.lesson04.teach.a_will_sign_up: {title: "Leila nimmt sich etwas vor", gloss: "Leila sagt: Du hast recht. Wenn ich einen sehe, melde ich mich sofort an.", note: "Eine neue reale Bedingung über die Zukunft, nicht mehr hypothetisch."}

exercises:
  en.b1.unit03.lesson01.exercise01.listen_word:
    instruction: "Hören Sie zu und wählen Sie das genannte Wort."
    correct_option: "weekend"
    distractors: ["class", "walk", "plans"]
    accepted_answers: [{value: "weekend", status: "correct"}]
    feedback: "*weekend* bedeutet Wochenende."
  en.b1.unit03.lesson01.exercise02.choose_water_from_sky_word:
    instruction: "Welches Wort bedeutet Wasser, das vom Himmel fällt?"
    correct_option: "rain"
    distractors: ["weekend", "stay home", "paint"]
    accepted_answers: [{value: "rain", status: "correct"}]
    feedback: "*rain* bedeutet Regen."
  en.b1.unit03.lesson01.exercise03.choose_hours_not_working_phrase:
    instruction: "Welche Wendung bedeutet Zeit, in der man nicht arbeitet und nicht beschäftigt ist?"
    correct_option: "free time"
    distractors: ["weekend", "stay home", "if"]
    accepted_answers: [{value: "free time", status: "correct"}]
    feedback: "*free time* bedeutet Freizeit."
  en.b1.unit03.lesson01.exercise04.match_conditional_words:
    instruction: "Verbinden Sie jede Bedeutung mit dem richtigen englischen Wort oder Ausdruck."
    accepted_answers:
      - value:
          - {left: "introduces a condition", right: "if"}
          - {left: "water falling from the sky", right: "rain"}
          - {left: "to not go out, to remain in your house", right: "stay home"}
          - {left: "Saturday and Sunday", right: "weekend"}
          - {left: "hours when you are not working or busy", right: "free time"}
          - {left: "to make a picture with color", right: "paint"}
        status: "correct"
    feedback: "*if*=wenn/falls, *rain*=Regen/regnen, *stay home*=zu Hause bleiben, *weekend*=Wochenende, *free time*=Freizeit, *paint*=malen."
  en.b1.unit03.lesson01.exercise05.write_weekend:
    instruction: "Schreiben Sie das Wort für Samstag und Sonntag."
    accepted_answers:
      - {value: "weekend", status: "correct"}
      - {value: "Weekend", status: "correct"}
    feedback: "*weekend* bedeutet Wochenende."

  en.b1.unit03.lesson02.exercise01.choose_rain_result:
    instruction: "Welcher Satz sagt, was passiert, wenn es morgen regnet?"
    correct_option: "If it rains tomorrow, we will stay home."
    distractors: ["If I have free time this weekend, I will paint.", "It rains a lot in the fall.", "We stayed home yesterday."]
    accepted_answers: [{value: "If it rains tomorrow, we will stay home.", status: "correct"}]
    feedback: "*If it rains tomorrow, we will stay home* sagt, was passiert, wenn es regnet."
  en.b1.unit03.lesson02.exercise02.choose_free_time_result:
    instruction: "Welcher Satz sagt, was passiert, wenn Sie dieses Wochenende Freizeit haben?"
    correct_option: "If I have free time this weekend, I will paint."
    distractors: ["If it rains tomorrow, we will stay home.", "I painted last weekend.", "I don't have much free time."]
    accepted_answers: [{value: "If I have free time this weekend, I will paint.", status: "correct"}]
    feedback: "*If I have free time this weekend, I will paint* sagt, was passiert, wenn Sie Freizeit haben."
  en.b1.unit03.lesson02.exercise03.order_if_rains_stay_home:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge für 'wenn es morgen regnet, bleiben wir zu Hause'."
    accepted_answers: [{value: ["If", "it", "rains", "tomorrow", "we", "will", "stay", "home"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *If it rains tomorrow, we will stay home*."
  en.b1.unit03.lesson02.exercise04.reply_weekend_plans:
    instruction: "Jemand fragt, was Sie tun werden, wenn Sie dieses Wochenende Freizeit haben. Antworten Sie mit der Form *if + present, will*: Sagen Sie, dass Sie malen werden."
    accepted_answers:
      - {value: "If I have free time this weekend, I will paint.", status: "correct"}
      - {value: "If I have free time this weekend, I will paint", status: "correct"}
      - {value: "If I have free time this weekend, I'll paint.", status: "correct"}
      - {value: "If I have free time this weekend, I'll paint", status: "correct"}
    feedback: "*If I have free time this weekend, I will paint.* ist die akzeptierte Antwort; *I'll* ist die Kurzform von *I will*."
  en.b1.unit03.lesson02.exercise05.write_if_rains:
    instruction: "Schreiben Sie mit der Form *if + present, will*, dass wir zu Hause bleiben, wenn es morgen regnet."
    accepted_answers:
      - {value: "If it rains tomorrow, we will stay home.", status: "correct"}
      - {value: "If it rains tomorrow, we will stay home", status: "correct"}
      - {value: "If it rains tomorrow, we'll stay home.", status: "correct"}
      - {value: "If it rains tomorrow, we'll stay home", status: "correct"}
    feedback: "*If it rains tomorrow, we will stay home.* ist die akzeptierte Antwort; *we'll* ist die Kurzform von *we will*."

  en.b1.unit03.lesson03.exercise01.comprehend_if_more_time:
    instruction: "Was würde Leila tun, wenn sie mehr Freizeit hätte?"
    correct_option: "she would paint every day"
    distractors: ["she would take more classes", "she would go for a walk", "she would visit her friends"]
    accepted_answers: [{value: "she would paint every day", status: "correct"}]
    feedback: "Der Text sagt *she would paint every day*."
  en.b1.unit03.lesson03.exercise02.comprehend_if_known_earlier:
    instruction: "Was hätte Leila getan, wenn sie früher von dem Kurs gewusst hätte?"
    correct_option: "she would have signed up"
    distractors: ["she would have canceled it", "she would have asked Daniel", "she would have painted at home"]
    accepted_answers: [{value: "she would have signed up", status: "correct"}]
    feedback: "Der Text sagt *she would have signed up*."
  en.b1.unit03.lesson03.exercise03.recognize_class:
    instruction: "Welches Wort bedeutet einen organisierten Kurs oder Unterricht mit einer Lehrperson?"
    correct_option: "class"
    distractors: ["would", "friend", "weekend"]
    accepted_answers: [{value: "class", status: "correct"}]
    feedback: "*class* bedeutet Kurs oder Unterricht."
  en.b1.unit03.lesson03.exercise04.order_would_paint_every_day:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge für 'sie würde jeden Tag malen'."
    accepted_answers: [{value: ["She", "would", "paint", "every", "day"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *She would paint every day*."
  en.b1.unit03.lesson03.exercise05.write_if_had_known:
    instruction: "Schreiben Sie mit *if + past perfect, would have*, dass Sie sich angemeldet hätten, wenn Sie früher davon gewusst hätten."
    accepted_answers:
      - {value: "If I had known about it earlier, I would have signed up.", status: "correct"}
      - {value: "If I had known about it earlier, I would have signed up", status: "correct"}
      - {value: "If I had known about it earlier, I would've signed up.", status: "correct"}
      - {value: "If I had known about it earlier, I would've signed up", status: "correct"}
    feedback: "*If I had known about it earlier, I would have signed up.* ist die akzeptierte Antwort; *would've* ist die Kurzform von *would have*."

  en.b1.unit03.lesson04.exercise01.listen_leilas_rain_plan:
    instruction: "Hören Sie das Gespräch und wählen Sie, was Leila tut, wenn es regnet."
    correct_option: "stay home and paint"
    distractors: ["visit a museum", "call Daniel", "take the bus"]
    accepted_answers: [{value: "stay home and paint", status: "correct"}]
    feedback: "Leila sagt, dass sie bei Regen *stay home and paint* wird."
  en.b1.unit03.lesson04.exercise02.listen_when_class_was:
    instruction: "Hören Sie zu und wählen Sie, wann der Malkurs war."
    correct_option: "last month"
    distractors: ["last week", "next month", "yesterday"]
    accepted_answers: [{value: "last month", status: "correct"}]
    feedback: "Daniel fragt nach dem Kurs von *last month*."
  en.b1.unit03.lesson04.exercise03.choose_leilas_regret:
    instruction: "Was sagt Leila, was sie getan hätte, wenn sie früher von dem Kurs gewusst hätte?"
    correct_option: "If I had known about it earlier, I would have signed up."
    distractors: ["If I had known about it earlier, I would have canceled it.", "If I had known about it earlier, I would have asked Daniel.", "If I had known about it earlier, I would have painted at home."]
    accepted_answers: [{value: "If I had known about it earlier, I would have signed up.", status: "correct"}]
    feedback: "Leila sagt *If I had known about it earlier, I would have signed up*."
  en.b1.unit03.lesson04.exercise04.order_if_there_is_another:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge für 'wenn es noch einen gibt, solltest du mitmachen'."
    accepted_answers: [{value: ["If", "there's", "another", "one", "you", "should", "join"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *If there's another one, you should join*."
  en.b1.unit03.lesson04.exercise05.reply_as_leila:
    instruction: "Daniel fragt nach Ihren Plänen fürs Wochenende. Antworten Sie als Leila mit zwei realen Bedingungen: Sagen Sie, dass Sie spazieren gehen, wenn es nicht regnet, und dass Sie zu Hause bleiben und malen, wenn es regnet."
    accepted_answers:
      - {value: "If it doesn't rain, I will go for a walk. If it rains, I will stay home and paint.", status: "correct"}
      - {value: "If it doesn't rain, I'll go for a walk. If it rains, I'll stay home and paint.", status: "correct"}
      - {value: "If it doesn't rain I will go for a walk If it rains I will stay home and paint", status: "correct"}
    feedback: "*If it doesn't rain, I will go for a walk. If it rains, I will stay home and paint.* ist die akzeptierte Antwort; *I'll* ist die Kurzform von *I will*."
  en.b1.unit03.lesson04.exercise06.speak_hypotheticals_dialogue:
    instruction: "Daniel sagt: Das klingt schön. Hast du letzten Monat diesen Malkurs gemacht? Antworten Sie laut als Leila mit *would have*: Sagen Sie, dass Sie ihn nicht gemacht haben und dass Sie sich angemeldet hätten, wenn Sie früher davon gewusst hätten."
    accepted_answers:
      - {value: "No, I didn't. If I had known about it earlier, I would have signed up.", status: "correct"}
      - {value: "No, I didn't. If I had known about it earlier, I would've signed up.", status: "correct"}
      - {value: "No I didn't If I had known about it earlier I would have signed up", status: "correct"}
    feedback: "*No, I didn't. If I had known about it earlier, I would have signed up.* ist die akzeptierte Antwort; *would've* ist die Kurzform von *would have*."
