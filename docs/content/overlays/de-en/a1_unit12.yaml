  en.a1.unit12.lesson03.teach.label_summary_sentence: {title: "The shirt is a medium and it's blue.", gloss: "Das Hemd ist Größe M und es ist blau.", note: "Eine vollständige Zusammenfassung von Größe und Farbe in einem Satz."}

  en.a1.unit12.lesson04.teach.here_you_go: {title: "Here you go.", gloss: "Bitte sehr.", note: "*Here you go* wird gesagt, wenn man jemandem etwas reicht."}
  en.a1.unit12.lesson04.teach.ill_take_it: {title: "I'll take it, thanks.", gloss: "Ich nehme es, danke.", note: "*I'll take it* zeigt, dass man sich zum Kauf entschieden hat."}
  en.a1.unit12.lesson04.teach.q_medium: {title: "Frage von Leila", gloss: "Leila: Entschuldigung, haben Sie dieses Hemd in Größe M?", note: "Leila fragt höflich nach einer anderen Größe."}
  en.a1.unit12.lesson04.teach.a_here_you_go: {title: "Antwort von Daniel", gloss: "Daniel: Ja, bitte sehr.", note: "Daniel reicht Leila das Hemd in der gewünschten Größe."}
  en.a1.unit12.lesson04.teach.q_blue: {title: "Nachfrage von Leila", gloss: "Leila: Toll. Haben Sie es in Blau?", note: "Leila fragt nun nach einer anderen Farbe."}
  en.a1.unit12.lesson04.teach.a_yes_we_do: {title: "Antwort von Daniel", gloss: "Daniel: Ja, haben wir.", note: "*we do* bestätigt kurz, dass die Farbe verfügbar ist."}
  en.a1.unit12.lesson04.teach.closing_ill_take_it: {title: "Abschluss von Leila", gloss: "Leila: Ich nehme es, danke.", note: "Leila entscheidet sich zum Kauf."}

exercises:
  en.a1.unit12.lesson01.exercise01.listen_item:
    instruction: "Hören Sie zu und wählen Sie das genannte Wort."
    correct_option: "jacket"
    distractors: ["shirt", "pants", "dress"]
    accepted_answers: [{value: "jacket", status: "correct"}]
    feedback: "*jacket* bedeutet Jacke."
  en.a1.unit12.lesson01.exercise02.choose_shoes:
    instruction: "Welches Wort bedeutet das, was man an den Füßen trägt?"
    correct_option: "shoes"
    distractors: ["shirt", "pants", "jacket"]
    accepted_answers: [{value: "shoes", status: "correct"}]
    feedback: "*shoes* bedeutet Schuhe."
  en.a1.unit12.lesson01.exercise03.choose_dress:
    instruction: "Welches Wort bedeutet ein einteiliges Kleidungsstück, das Frauen oft tragen?"
    correct_option: "dress"
    distractors: ["shirt", "pants", "jacket"]
    accepted_answers: [{value: "dress", status: "correct"}]
    feedback: "*dress* bedeutet Kleid."
  en.a1.unit12.lesson01.exercise04.match_clothing_words:
    instruction: "Verbinden Sie jede Beschreibung mit dem richtigen englischen Wort."
    accepted_answers:
      - value:
          - {left: "worn on the upper body", right: "shirt"}
          - {left: "worn on the legs", right: "pants"}
          - {left: "worn on the feet", right: "shoes"}
          - {left: "worn over other clothes, often for warmth", right: "jacket"}
          - {left: "a one-piece item, often worn by women", right: "dress"}
          - {left: "the smallest clothing size letter", right: "small"}
          - {left: "the size between small and large", right: "medium"}
          - {left: "the biggest clothing size letter", right: "large"}
          - {left: "the color of a clear daytime sky", right: "blue"}
          - {left: "the color with no light at all, opposite of white", right: "black"}
        status: "correct"
    feedback: "shirt=Hemd, pants=Hose, shoes=Schuhe, jacket=Jacke, dress=Kleid, small=klein, medium=mittel, large=groß, blue=blau, black=schwarz."
  en.a1.unit12.lesson01.exercise05.write_dress:
    instruction: "Schreiben Sie das Wort für ein einteiliges Kleidungsstück."
    accepted_answers:
      - {value: "dress", status: "correct"}
      - {value: "dress.", status: "correct"}
    feedback: "*dress* bedeutet Kleid."

  en.a1.unit12.lesson02.exercise01.listen_size_question:
    instruction: "Hören Sie zu und wählen Sie die Frage, die Sie hören."
    correct_option: "Do you have this in a medium"
    distractors: ["Do you have it in blue?", "Here you go.", "I'll take it, thanks."]
    accepted_answers: [{value: "Do you have this in a medium", status: "correct"}]
    feedback: "*Do you have this in a medium?* bedeutet 'Haben Sie das in Größe M?'"
  en.a1.unit12.lesson02.exercise02.listen_color_question:
    instruction: "Hören Sie noch einmal und wählen Sie die Frage, die Sie hören."
    correct_option: "Do you have it in blue"
    distractors: ["Do you have this in a medium?", "Here you go.", "I'll take it, thanks."]
    accepted_answers: [{value: "Do you have it in blue", status: "correct"}]
    feedback: "*Do you have it in blue?* bedeutet 'Haben Sie es in Blau?'"
  en.a1.unit12.lesson02.exercise03.choose_large:
    instruction: "Welche Größe ist größer als M?"
    correct_option: "large"
    distractors: ["small", "medium", "blue"]
    accepted_answers: [{value: "large", status: "correct"}]
    feedback: "*large* bedeutet groß, größer als *medium.*"
  en.a1.unit12.lesson02.exercise04.order_color_question:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um nach der Farbe Blau zu fragen."
    accepted_answers: [{value: ["Do", "you", "have", "it", "in", "blue"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *Do you have it in blue?*"
  en.a1.unit12.lesson02.exercise05.write_size_request:
    instruction: "Schreiben Sie, wie Sie fragen, ob Größe M verfügbar ist."
    accepted_answers:
      - {value: "Do you have this in a medium?", status: "correct"}
      - {value: "Do you have this in a medium", status: "correct"}
    feedback: "*Do you have this in a medium?* bedeutet 'Haben Sie das in Größe M?'"

  en.a1.unit12.lesson03.exercise01.read_size:
    instruction: "Welche Größe hat das Hemd?"
    correct_option: "Medium"
    distractors: ["Small", "Large", "Blue"]
    accepted_answers: [{value: "Medium", status: "correct"}]
    feedback: "Das Etikett listet *Size: Medium* -- das Hemd hat Größe M."
  en.a1.unit12.lesson03.exercise02.read_color:
    instruction: "Welche Farbe hat das Hemd?"
    correct_option: "Blue"
    distractors: ["Black", "Medium", "Large"]
    accepted_answers: [{value: "Blue", status: "correct"}]
    feedback: "Das Etikett listet *Color: Blue* -- das Hemd ist blau."
  en.a1.unit12.lesson03.exercise03.choose_price:
    instruction: "Wie viel kostet das Hemd?"
    correct_option: "$20"
    distractors: ["$10", "$15", "$25"]
    accepted_answers: [{value: "$20", status: "correct"}]
    feedback: "Das Etikett listet *Price: $20* -- das Hemd kostet 20 Dollar."
  en.a1.unit12.lesson03.exercise04.match_label_fields:
    instruction: "Verbinden Sie jedes Etikettfeld mit seinem Wert."
    accepted_answers:
      - value:
          - {left: "Size", right: "Medium"}
          - {left: "Color", right: "Blue"}
          - {left: "Price", right: "$20"}
          - {left: "Item", right: "Shirt"}
          - {left: "The clothing size bigger than medium", right: "Large"}
          - {left: "The color with no light at all, opposite of white", right: "Black"}
        status: "correct"
    feedback: "Size=Größe, Color=Farbe, Price=Preis, Item=Artikel, Large=groß, Black=schwarz."
  en.a1.unit12.lesson03.exercise05.write_label_summary:
    instruction: "Schreiben Sie die Größe und Farbe des Hemds."
    accepted_answers:
      - {value: "The shirt is a medium and it's blue", status: "correct"}
      - {value: "The shirt is a medium and it's blue.", status: "correct"}
    feedback: "*The shirt is a medium and it's blue* bedeutet 'Das Hemd ist Größe M und es ist blau.'"

  en.a1.unit12.lesson04.exercise01.listen_size_available:
    instruction: "Hören Sie das Gespräch. Was antwortet Daniel, als Leila nach Größe M fragt?"
    correct_option: "Yes, here you go"
    distractors: ["No, we don't have that size", "I'll take it, thanks.", "Do you have it in blue?"]
    accepted_answers: [{value: "Yes, here you go", status: "correct"}]
    feedback: "Daniel sagt: *Yes, here you go* -- 'Ja, bitte sehr.'"
  en.a1.unit12.lesson04.exercise02.listen_color_available:
    instruction: "Hören Sie noch einmal und wählen Sie, was Sie hören."
    correct_option: "Yes, we do"
    distractors: ["No, we don't.", "I'll take it, thanks.", "Here you go."]
    accepted_answers: [{value: "Yes, we do", status: "correct"}]
    feedback: "*Yes, we do* bedeutet 'Ja, haben wir.'"
  en.a1.unit12.lesson04.exercise03.choose_final_response:
    instruction: "Leila entscheidet sich, das Hemd zu kaufen. Was sagt sie?"
    correct_option: "I'll take it, thanks."
    distractors: ["Here you go.", "Yes, we do.", "Do you have it in blue?"]
    accepted_answers: [{value: "I'll take it, thanks.", status: "correct"}]
    feedback: "*I'll take it, thanks* bedeutet 'Ich nehme es, danke.'"
  en.a1.unit12.lesson04.exercise04.order_q_medium:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um mitten im Satz (nach 'Excuse me,') nach dem Hemd in Größe M zu fragen."
    accepted_answers: [{value: ["do", "you", "have", "this", "shirt", "in", "a", "medium"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *do you have this shirt in a medium* (klein geschrieben, da es nach 'Excuse me,' mitten im Satz steht)."
  en.a1.unit12.lesson04.exercise05.reply_as_leila:
    instruction: "Antworten Sie als Leila: Fragen Sie nach dem Hemd in Größe M, fragen Sie dann, ob es das auch in Blau gibt, und entscheiden Sie sich schließlich zum Kauf."
    accepted_answers:
      - {value: "Excuse me, do you have this shirt in a medium? Great. Do you have it in blue? I'll take it, thanks.", status: "correct"}
      - {value: "Excuse me, do you have this shirt in a medium, and do you have it in blue, I'll take it, thanks.", status: "correct"}
      - {value: "Excuse me do you have this shirt in a medium Great Do you have it in blue I'll take it thanks", status: "correct"}
    feedback: "Eine vollständige Antwort fragt nach der Größe, fragt nach der Farbe, und entscheidet sich zum Kauf."
  en.a1.unit12.lesson04.exercise06.speak_shopping:
    instruction: "Antworten Sie laut als Leila: Fragen Sie nach dem Hemd in Größe M, fragen Sie dann, ob es das auch in Blau gibt, und entscheiden Sie sich schließlich zum Kauf."
    accepted_answers:
      - {value: "Excuse me do you have this shirt in a medium Great Do you have it in blue I'll take it thanks", status: "correct"}
      - {value: "Excuse me, do you have this shirt in a medium? Great. Do you have it in blue? I'll take it, thanks.", status: "correct"}
    feedback: "Diese vollständige Antwort deckt die Größenfrage, die Farbfrage und die Kaufentscheidung ab."
