  en.a1.unit12.lesson01.clothing_items: {title: "Übliche Kleidungsstücke"}
  en.a1.unit12.lesson02.sizes_and_colors: {title: "Größen und Farben"}
  en.a1.unit12.lesson03.reading_a_label: {title: "Ein Kleidungsetikett lesen"}
  en.a1.unit12.lesson04.clothing_store_dialogue: {title: "Im Bekleidungsgeschäft"}

teaching:
  en.a1.unit12.lesson01.teach.shirt: {title: "Shirt", gloss: "Hemd", note: "*shirt* bedeutet Hemd.", example_gloss: "Ich brauche ein neues Hemd."}
  en.a1.unit12.lesson01.teach.pants: {title: "Pants", gloss: "Hose", note: "*pants* bedeutet Hose -- im Englischen immer Plural.", example_gloss: "Diese Hose ist zu lang."}
  en.a1.unit12.lesson01.teach.shoes: {title: "Shoes", gloss: "Schuhe", note: "*shoes* bedeutet Schuhe (Plural).", example_gloss: "Meine Schuhe sind sehr bequem."}
  en.a1.unit12.lesson01.teach.jacket: {title: "Jacket", gloss: "Jacke", note: "*jacket* bedeutet Jacke.", example_gloss: "Ich trage eine Jacke, wenn es kalt ist."}
  en.a1.unit12.lesson01.teach.dress: {title: "Dress", gloss: "Kleid", note: "*dress* bedeutet Kleid.", example_gloss: "Sie trägt ein schönes Kleid."}

  en.a1.unit12.lesson02.teach.small: {title: "Small", gloss: "klein / Größe S", note: "*small* bedeutet klein, als Kleidergröße 'S.'", example_gloss: "Dieses Hemd ist zu klein."}
  en.a1.unit12.lesson02.teach.medium: {title: "Medium", gloss: "mittel / Größe M", note: "*medium* bedeutet mittel, als Kleidergröße 'M.'", example_gloss: "Ich trage normalerweise Größe M."}
  en.a1.unit12.lesson02.teach.large: {title: "Large", gloss: "groß / Größe L", note: "*large* bedeutet groß, als Kleidergröße 'L.'", example_gloss: "Diese Jacke ist Größe L."}
  en.a1.unit12.lesson02.teach.blue: {title: "Blue", gloss: "blau", note: "*blue* bedeutet blau.", example_gloss: "Das Hemd ist blau."}
  en.a1.unit12.lesson02.teach.black: {title: "Black", gloss: "schwarz", note: "*black* bedeutet schwarz.", example_gloss: "Sie hat schwarze Schuhe."}
  en.a1.unit12.lesson02.teach.do_you_have_in_medium: {title: "Do you have this in a medium?", gloss: "Haben Sie das in Größe M?", note: "*Do you have this in...?* fragt nach einer anderen Größe."}
  en.a1.unit12.lesson02.teach.do_you_have_in_blue: {title: "Do you have it in blue?", gloss: "Haben Sie es in Blau?", note: "*Do you have it in...?* fragt nach einer anderen Farbe."}

  en.a1.unit12.lesson03.teach.size: {title: "Size", gloss: "Größe", note: "*size* bedeutet Größe.", example_gloss: "Welche Größe hat dieses Hemd?"}
  en.a1.unit12.lesson03.teach.color: {title: "Color", gloss: "Farbe", note: "*color* bedeutet Farbe (US-Schreibweise ohne 'u'; britisch: colour).", example_gloss: "Welche Farbe hat die Jacke?"}
