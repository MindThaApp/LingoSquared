teaching:
  en.a1.unit66.lesson01.teach.symptom:
    title: symptom
    gloss: Beschwerde / Symptom
    note: '*symptom* bedeutet ein Symptom oder eine Beschwerde, die man spürt. Die Schreibweise ist anders als im Deutschen: *symptom* mit *y*, ohne Endung *-e*.'
    example_gloss: Das ist ein Symptom.
  en.a1.unit66.lesson01.teach.cough:
    title: cough
    gloss: Husten
    note: '*cough* bedeutet Husten. Die Aussprache ist *kof*; *gh* wird hier wie *f* gesprochen.'
    example_gloss: Ich habe einen Husten.
  en.a1.unit66.lesson01.teach.fever:
    title: fever
    gloss: Fieber
    note: '*fever* bedeutet Fieber. Das Wort ist im Deutschen und Englischen verwandt, die Schreibweise ist anders.'
    example_gloss: Hast du Fieber?
  en.a1.unit66.lesson01.teach.throat:
    title: throat
    gloss: Hals
    note: '*throat* bedeutet Hals im Sinne von ''Rachen, Kehle''; für den äußeren Hals sagt man *neck*.'
    example_gloss: Mein Hals tut weh.
  en.a1.unit66.lesson01.teach.headache:
    title: headache
    gloss: Kopfschmerzen
    note: '*headache* bedeutet Kopfschmerzen (im Englischen im Singular).'
    example_gloss: Ich habe Kopfschmerzen.
  en.a1.unit66.lesson01.teach.medicine:
    title: medicine
    gloss: Medikament
    note: '*medicine* bedeutet Medikament oder Medizin. Das Wort ist unzählbar: *some medicine*.'
    example_gloss: Nimm dieses Medikament.
  en.a1.unit66.lesson02.teach.have_cough:
    title: I have a cough.
    gloss: Ich habe Husten.
    note: Im Englischen sagen Sie *have a cough* mit *a*; im Deutschen steht oft kein Artikel ('Ich habe Husten').
  en.a1.unit66.lesson02.teach.throat_hurts:
    title: My throat hurts.
    gloss: Mein Hals tut weh.
    note: '*hurts* bedeutet ''tut weh''. Im Englischen ist das Körperteil das Subjekt (*my throat hurts*), nicht ein ''mir'' wie im Deutschen.'
  en.a1.unit66.lesson02.teach.have_headache:
    title: I have a headache.
    gloss: Ich habe Kopfschmerzen.
    note: Im Englischen sagen Sie *have a headache* mit *a*; im Deutschen steht der Plural 'Kopfschmerzen'.
  en.a1.unit66.lesson02.teach.have_medicine:
    title: Do you have medicine?
    gloss: Haben Sie ein Medikament?
    note: '*Do you have...?* fragt, ob etwas vorhanden ist.'
  en.a1.unit66.lesson02.teach.with_water:
    title: Take this with water.
    gloss: Nehmen Sie das mit Wasser.
    note: '*with water* steht am Satzende.'
  en.a1.unit66.lesson02.teach.ask_doctor:
    title: Please ask a doctor.
    gloss: Bitte fragen Sie einen Arzt.
    note: '*Please* macht den Satz höflich.'
  en.a1.unit66.lesson03.teach.dialogue_line1:
    title: Leila nennt eine Beschwerde
    gloss: 'Leila sagt: Hallo. Ich habe Husten.'
    note: '*I have a cough* nennt eine Beschwerde.'
  en.a1.unit66.lesson03.teach.dialogue_line2:
    title: Der Apotheker fragt nach Fieber
    gloss: 'Der Apotheker sagt: Haben Sie Fieber?'
    note: '*Do you have a fever?* ist eine Ja/Nein-Frage.'
  en.a1.unit66.lesson03.teach.dialogue_line3:
    title: Leila hat kein Fieber
    gloss: 'Leila sagt: Nein, ich habe kein Fieber. Mein Hals tut weh.'
    note: '*No, I do not have...* verneint eine Beschwerde. Im Englischen verneinen Sie mit *do not*, nicht mit ''kein'' wie im Deutschen.'
  en.a1.unit66.lesson03.teach.dialogue_line4:
    title: Der Apotheker fragt nach Kopfschmerzen
    gloss: 'Der Apotheker sagt: Haben Sie Kopfschmerzen?'
    note: '*headache* bedeutet Kopfschmerzen.'
  en.a1.unit66.lesson03.teach.dialogue_line5:
    title: Leila hat Kopfschmerzen
    gloss: 'Leila sagt: Ja, ich habe Kopfschmerzen.'
    note: '*Yes* bedeutet ja.'
  en.a1.unit66.lesson03.teach.dialogue_line6:
    title: Rat des Apothekers
    gloss: 'Der Apotheker sagt: Nehmen Sie dieses Medikament mit Wasser. Bitte fragen Sie einen Arzt, wenn es Ihnen schlechter geht.'
    note: '*if you feel worse* bedeutet ''wenn es Ihnen schlechter geht''.'
  en.a1.unit66.lesson03.teach.dialogue_line7:
    title: Leila bedankt sich
    gloss: 'Leila sagt: Danke.'
    note: '*Thank you* ist die kurze Dankesformel.'
  en.a1.unit66.lesson04.teach.pharmacy_note:
    title: Apothekenzettel
    gloss: 'Apothekenzettel: Husten und Halsschmerzen. Kein Fieber. Medikament mit Wasser einnehmen. Arzt fragen, wenn es schlimmer wird.'
    note: Der Zettel nennt Beschwerden und einfache Ratschläge.
  en.a1.unit66.lesson04.teach.reading_passage:
    title: 'Text: Ein Besuch in der Apotheke'
    gloss: 'Ein Besuch in der Apotheke: Leila ging in die Apotheke, weil sie Husten hatte und ihr Hals wehtat. Der Apotheker fragte, ob sie Fieber habe. Leila sagte, dass sie kein Fieber, aber Kopfschmerzen habe. Der Apotheker gab ihr ein Medikament und sagte, sie solle es mit Wasser einnehmen. Auf dem Zettel stand, dass sie einen Arzt fragen solle, wenn es ihr schlechter gehe.'
    note: '*felt worse* ist die Vergangenheitsform von *feel worse*.'
