review: {status: "reviewed", required_next_reviewer: "native_speaker_review", notes: "First de-en A2 overlay for a2_unit39_after_the_interview, authored against the English realization with nl-en consulted for structure only. Formal Sie throughout, including the interviewer/Mia phone call and the company's message to Mia. NATIVE FLAGS: offer glossed as Angebot (Stellenangebot / Zusage as alternatives); company message opens with 'Liebe Mia, ... Sie' (first name plus Sie, common in modern HR mails); 'Wäre es möglich' style indirect question rendered as 'Könnten Sie mir ... mitteilen'."}

course:
  title: "Englisch A2"
  description: "Englisch auf A2-Niveau für etwas formellere Alltagssituationen, mit ausführlichen deutschen Erklärungen."

units:
  en.a2.unit39.after_the_interview: {title: "Nach dem Bewerbungsgespräch"}

lessons:
  en.a2.unit39.lesson01.offer_vocabulary: {title: "Angebot, Vertrag und Starttermin"}
  en.a2.unit39.lesson02.following_up: {title: "Nachfassen und das Angebot annehmen"}
  en.a2.unit39.lesson03.reading_an_offer_message: {title: "Ein Stellenangebot lesen"}
  en.a2.unit39.lesson04.offer_call_dialogue: {title: "Der Anruf mit dem Stellenangebot"}

teaching:
  en.a2.unit39.lesson01.teach.offer: {title: "offer", gloss: "Angebot", note: "*offer* ist hier das Angebot für eine Stelle. Als Verb bedeutet *to offer* anbieten.", example_gloss: "Ich habe ein Stellenangebot von Bright Path Marketing bekommen."}
  en.a2.unit39.lesson01.teach.contract: {title: "contract", gloss: "Arbeitsvertrag, Vertrag", note: "*contract* ist die schriftliche Vereinbarung zwischen Ihnen und der Firma.", example_gloss: "Der Vertrag läuft ein Jahr."}
  en.a2.unit39.lesson01.teach.salary: {title: "salary", gloss: "Gehalt", note: "*salary* ist der Betrag, den man pro Monat oder pro Jahr verdient.", example_gloss: "Über das Gehalt können wir nächste Woche sprechen."}
  en.a2.unit39.lesson01.teach.accept: {title: "accept", gloss: "annehmen, zusagen", note: "*accept* bedeutet, Ja zu etwas zu sagen, das einem angeboten wird.", example_gloss: "Ich möchte die Stelle gern annehmen."}
  en.a2.unit39.lesson01.teach.start_date: {title: "start date", gloss: "Starttermin, Eintrittsdatum", note: "*start date* ist der erste Tag in Ihrer neuen Stelle.", example_gloss: "Der Starttermin ist der erste Montag im Monat."}
  en.a2.unit39.lesson01.teach.reply: {title: "reply", gloss: "Antwort", note: "*reply* ist sowohl die Antwort auf eine Nachricht als auch das Verb antworten.", example_gloss: "Ich habe noch am selben Tag eine Antwort geschickt."}
  en.a2.unit39.lesson01.teach.grammar_would_like_to: {title: "would like to für einen höflichen Wunsch", gloss: "Ich möchte das Angebot gern annehmen. Ich würde gern am Montag anfangen.", note: "*I would like to ...* ist höflicher als *I want to ...* und passt zum geschäftlichen Kontakt."}

  en.a2.unit39.lesson02.teach.thank_you_for_the_interview: {title: "Die Nachricht beginnen", gloss: "Vielen Dank für das Gespräch gestern.", note: "*Thank you for ...* ist der übliche Anfang einer kurzen geschäftlichen Dankesnachricht."}
  en.a2.unit39.lesson02.teach.still_interested: {title: "Sagen, dass Sie weiterhin interessiert sind", gloss: "Ich bin weiterhin sehr an der Stelle interessiert.", note: "*still* bedeutet immer noch bzw. weiterhin und steht vor dem Adjektiv."}
  en.a2.unit39.lesson02.teach.could_you_tell_me_start_date: {title: "Höflich nach dem Starttermin fragen", gloss: "Könnten Sie mir den Starttermin mitteilen?", note: "*Could you tell me ...?* ist eine indirekte Frage und höflicher als *When is the start date?*"}
  en.a2.unit39.lesson02.teach.would_like_to_accept: {title: "Das Angebot annehmen", gloss: "Ich möchte das Angebot gern annehmen.", note: "Das ist der Standardsatz, mit dem man eine Stelle annimmt."}
  en.a2.unit39.lesson02.teach.grammar_indirect_questions: {title: "Indirekte Fragen mit Could you tell me", gloss: "Könnten Sie mir den Starttermin mitteilen? Könnten Sie mir etwas über die Arbeitszeiten sagen?", note: "Nach *Could you tell me* folgt keine Frage-Wortstellung mehr: Man sagt *the start date*, nicht *what is the start date*."}

  en.a2.unit39.lesson03.teach.full_time: {title: "full time", gloss: "Vollzeit", note: "*full time* bedeutet eine volle Arbeitswoche; das Gegenteil ist *part time* (Teilzeit).", example_gloss: "Die Stelle ist in Vollzeit, nicht nur an zwei Tagen pro Woche."}
  en.a2.unit39.lesson03.teach.offer_message: {title: "Die Nachricht mit dem Angebot", gloss: "Liebe Mia, vielen Dank, dass Sie am Dienstag bei uns waren. Wir möchten Ihnen gern die Stelle als Marketing-Koordinatorin anbieten. Der Vertrag ist in Vollzeit und der Starttermin ist Montag. Bitte antworten Sie uns bis Freitag. Bright Path Marketing.", note: "Eine Nachricht mit einem Stellenangebot nennt immer vier Dinge: die Stelle, die Art des Vertrags, den Starttermin und die Frist für Ihre Antwort."}
  en.a2.unit39.lesson03.teach.please_reply_by_friday: {title: "Die Antwortfrist", gloss: "Bitte antworten Sie bis Freitag.", note: "*by Friday* bedeutet bis spätestens Freitag, also ist Freitag selbst noch erlaubt."}

  en.a2.unit39.lesson04.teach.q_calling_about_interview: {title: "Die Interviewerin ruft Mia an", gloss: "Die Interviewerin sagt: Hallo Mia, ich rufe wegen des Gesprächs am Dienstag an.", note: "*I am calling about ...* ist die übliche Eröffnung eines geschäftlichen Telefonats."}
  en.a2.unit39.lesson04.teach.a_still_interested: {title: "Mia sagt, dass sie weiterhin interessiert ist", gloss: "Mia sagt: Vielen Dank für Ihren Anruf. Ich bin weiterhin sehr an der Stelle interessiert.", note: "Derselbe Satz wie in Lektion 2."}
  en.a2.unit39.lesson04.teach.q_offer_you_the_job: {title: "Die Interviewerin bietet die Stelle an", gloss: "Die Interviewerin sagt: Das freut mich, denn wir möchten Ihnen die Stelle gern anbieten.", note: "*because* verbindet hier Mias Antwort mit der guten Nachricht, die folgt."}
  en.a2.unit39.lesson04.teach.a_great_news_ask_start_date: {title: "Mia reagiert und fragt nach dem Starttermin", gloss: "Mia sagt: Das sind tolle Neuigkeiten. Könnten Sie mir den Starttermin mitteilen?", note: "Erst kurz auf die Nachricht reagieren, dann erst die Frage stellen."}
  en.a2.unit39.lesson04.teach.q_start_date_and_contract: {title: "Die Interviewerin nennt Termin und Vertrag", gloss: "Die Interviewerin sagt: Der Starttermin ist Montag, und der Vertrag ist in Vollzeit.", note: "Dieselben zwei Fakten wie in der Nachricht in Lektion 3."}
  en.a2.unit39.lesson04.teach.a_ask_working_hours: {title: "Mia fragt nach den Arbeitszeiten", gloss: "Mia fragt: Könnten Sie mir etwas über die Arbeitszeiten sagen?", note: "Dieselbe indirekte Frageform wie beim Starttermin."}
  en.a2.unit39.lesson04.teach.q_nine_to_five: {title: "Die Interviewerin nennt die Arbeitszeiten", gloss: "Die Interviewerin sagt: Von neun bis siebzehn Uhr, mit einer Stunde Mittagspause.", note: "*from nine to five* ist die feste Wendung, um einen Arbeitstag zu beschreiben."}
  en.a2.unit39.lesson04.teach.a_accept_the_offer: {title: "Mia nimmt das Angebot an", gloss: "Mia sagt: Vielen Dank. Ich möchte das Angebot gern annehmen.", note: "Derselbe Satz wie in Lektion 2."}
  en.a2.unit39.lesson04.teach.q_send_the_contract: {title: "Die Interviewerin beendet das Gespräch", gloss: "Die Interviewerin sagt: Wunderbar. Wir schicken Ihnen den Vertrag noch heute.", note: "*Wonderful* ist eine warme, positive Reaktion, die auch im geschäftlichen Englisch ganz üblich ist."}

