    gloss: Telefon
    note: '*phone* bedeutet Telefon.'
    example_gloss: Ich rufe meine Mutter mit meinem Telefon an.
  en.a1.unit35.lesson01.teach.laptop:
    title: laptop
    gloss: Notebook
    note: '*laptop* bedeutet Notebook oder Laptop.'
    example_gloss: Sie benutzt ihren Laptop für die Arbeit.
  en.a1.unit35.lesson01.teach.tablet:
