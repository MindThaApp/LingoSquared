    gloss: Rechner
    note: '*computer* bedeutet Computer oder Rechner.'
    example_gloss: Wir haben zu Hause einen Computer.
  en.a1.unit35.lesson01.teach.app:
    title: app
    gloss: App
    note: '*app* bedeutet App.'
    example_gloss: Ich habe eine neue App auf meinem Telefon.
  en.a1.unit35.lesson01.teach.camera:
    title: camera
    gloss: Kamera
    note: '*camera* bedeutet Kamera.'
    example_gloss: Diese Kamera macht tolle Fotos.
  en.a1.unit35.lesson02.teach.make_a_call:
    title: make a call
    gloss: anrufen
    note: '*make a call* ist eine feste Verbindung aus Verb + Nomen, die Sie als Ganzes lernen müssen. Das Deutsche hat dafür meist nur ein Verb, "anrufen", ohne ein eigenes Wort für *call*.'
    example_gloss: Ich rufe jeden Sonntag meinen Bruder an.
  en.a1.unit35.lesson02.teach.send_a_text:
    title: send a text
    gloss: eine Nachricht schicken
    note: '*send a text* ist wie *make a call* eine feste Verbindung aus Verb + Nomen. Im Deutschen sagt man "eine Nachricht schicken" oder umgangssprachlich "simsen" und "texten". Im Englischen sagen Sie meistens *send a text*.'
    example_gloss: Sie schickt ihrer Freundin jeden Morgen eine Nachricht.
  en.a1.unit35.lesson02.teach.download_an_app:
    title: download an app
    gloss: eine App herunterladen
    note: '*download an app*: *download* funktioniert wie das deutsche "herunterladen", daher ist dies die einfachste der drei festen Verbindungen.'
    example_gloss: Er lädt jede Woche eine neue App herunter.
  en.a1.unit35.lesson02.teach.wifi:
    title: wifi
    gloss: WLAN
    note: '*wifi* bedeutet WLAN.'
    example_gloss: Das WLAN bei mir zu Hause ist schnell.
  en.a1.unit35.lesson02.teach.battery:
    title: battery
    gloss: Akku
    note: '*battery* bedeutet Akku oder Batterie.'
    example_gloss: Der Akku meines Telefons ist fast leer.
  en.a1.unit35.lesson02.teach.how_use_phone_question:
    title: How do you use your phone?
    gloss: Wie benutzt du dein Telefon?
    note: '*Do you use ...?* verwendet dieselbe do-Umschreibung wie andere englische Fragen.'
  en.a1.unit35.lesson03.teach.dialogue_line1:
    title: Mias Beschwerde
    gloss: 'Mia sagt: Mein Telefon ist so alt. Es ist echt langsam.'
    note: '*so* + Adjektiv (*so old*) verstärkt die Bedeutung, wie "so" oder "sehr" im Deutschen.'
  en.a1.unit35.lesson03.teach.dialogue_line2:
    title: Leilas Rat
    gloss: 'Leila sagt: Du solltest dir ein neues kaufen. Wofür benutzt du es am meisten?'
    note: '*What do you use it for most?* endet mit der Präposition *for*. Im Deutschen steht die Präposition dagegen in "wofür" ("Wofür benutzt du es?") am Anfang. Im Englischen beginnen Sie mit *what*, und *for* bleibt am Ende stehen.'
  en.a1.unit35.lesson03.teach.dialogue_line3:
    title: "Mias Antwort"
    gloss: 'Mia sagt: Ich schreibe hauptsächlich meiner Schwester und mache Fotos.'
    note: '*text* können Sie auch als Verb verwenden (*I text my sister*). Das ist gebräuchlicher als *send a text*; beides ist korrektes Englisch.'
  en.a1.unit35.lesson03.teach.dialogue_line4:
    title: Leilas Nutzung
    gloss: 'Leila sagt: Ich rufe jedes Wochenende meine Eltern mit meinem Telefon an. Ich benutze auch viele Apps.'
    note: '*call* als Verb (*I call my parents*) ist die gewöhnliche, informelle Variante. *Make a call* ist die feste Verbindung aus Lektion 2.'
  en.a1.unit35.lesson03.teach.dialogue_line5:
    title: Mias Frage
    gloss: 'Mia fragt: Welche Apps benutzt du?'
    note: '*Which apps do you use?*: *which* fragt nach einer Auswahl aus einer Gruppe (Apps), genau wie "welche" im Deutschen.'
  en.a1.unit35.lesson03.teach.dialogue_line6:
    title: Leila's apps
    gloss: 'Leila sagt: Ich benutze eine Koch-App und eine Karten-App. Möchtest du sie herunterladen?'
    note: '*Do you want to ...?* verwendet die do-Umschreibung, auch wenn *want* selbst ein gewöhnliches Verb ist.'
  en.a1.unit35.lesson03.teach.dialogue_line7:
    title: "Mias Antwort"
    gloss: 'Mia sagt: Ja, gern, schick mir die Namen!'
    note: '*please* steht hier vor dem Verb (*please send ...*) und macht die Bitte höflicher.'
  en.a1.unit35.lesson04.teach.reading_passage:
    title: Text über Daniel, Leila und Mia
    gloss: Daniel, Leila und Mia benutzen ihr Telefon alle unterschiedlich. Daniel schreibt nicht gern Nachrichten; er ruft stattdessen lieber an. Leila benutzt ihr Telefon für Karten. Sie benutzt auch eine Koch-App, wenn sie neue Rezepte ausprobiert. Mia macht viele Fotos und schickt sie ihrer Familie. Alle benutzen einen Laptop für die Arbeit, und am Wochenende telefonieren sie per Video mit Freunden.
    note: '*He prefers to call people instead*: *instead* am Satzende bedeutet "stattdessen" (also statt Nachrichten zu schreiben).'
