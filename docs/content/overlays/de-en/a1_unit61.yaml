  en.a1.unit61.lesson03.teach.dialogue_line1:
    title: "Daniel entschuldigt sich"
    gloss: 'Daniel sagt: Hi Mia. Tut mir leid, dass ich zu spät bin.'
    note: '*I''m sorry I''m late* verbindet die Entschuldigung mit dem Grund.'
  en.a1.unit61.lesson03.teach.dialogue_line2:
    title: Mia nimmt es an
    gloss: 'Mia sagt: Das ist in Ordnung.'
    note: '*That''s okay* ist freundlich und einfach.'
  en.a1.unit61.lesson03.teach.dialogue_line3:
    title: Der Bus hat Verspätung
    gloss: 'Daniel sagt: Der Bus hat Verspätung.'
    note: Dieser Satz nennt den Grund.
  en.a1.unit61.lesson03.teach.dialogue_line4:
    title: Mia sagt, Warten ist in Ordnung
    gloss: 'Mia sagt: Kein Problem. Wir können warten.'
    note: '*We can wait* bedeutet, dass Warten möglich ist.'
  en.a1.unit61.lesson03.teach.dialogue_line5:
    title: Daniel hat sich bei der Zeit geirrt
    gloss: 'Daniel sagt: Ich habe mich bei der Uhrzeit geirrt.'
    note: '*with the time* bedeutet: bei der Uhrzeit.'
  en.a1.unit61.lesson03.teach.dialogue_line6:
    title: Der Unterricht beginnt um drei Uhr
    gloss: 'Mia sagt: Ist schon gut. Der Unterricht beginnt um drei.'
    note: '*at three* verwendet *at* für eine Uhrzeit.'
  en.a1.unit61.lesson03.teach.dialogue_line7:
    title: Daniel bedankt sich bei Mia
    gloss: 'Daniel sagt: Danke fürs Warten.'
    note: '*Thank you for waiting* verwendet *for* plus die -ing-Form.'
  en.a1.unit61.lesson04.teach.class_note:
    title: Hinweis zum Unterricht
    gloss: 'Hinweis zum Unterricht: Der Unterricht beginnt um 3.00 Uhr. Bitte komm pünktlich. Wenn du zu spät bist, schicke eine Nachricht.'
    note: Der Hinweis sagt, was man tun soll, wenn man zu spät ist.
  en.a1.unit61.lesson04.teach.reading_passage:
    title: 'Text: Eine Entschuldigung vor dem Unterricht'
    gloss: 'Eine Entschuldigung vor dem Unterricht: Daniel kam zu spät zum Unterricht, weil der Bus Verspätung hatte. Er traf Mia vor dem Klassenzimmer. Daniel sagte, es tue ihm leid. Er sagte auch, er habe sich bei der Uhrzeit geirrt. Mia sagte, es sei in Ordnung. Der Unterricht war um 3.00 Uhr. Daniel schickte dem Lehrer eine kurze Nachricht. In der Nachricht stand: "Tut mir leid, dass ich zu spät bin. Der Bus hat Verspätung."'
    note: '*because* nennt den Grund: weil der Bus Verspätung hatte.'
