teaching:
  en.b1.unit09.lesson01.teach.said_that: {title: "said that", gloss: "sagte, dass", note: "*said that* verwendet man, um zu berichten, was jemand anderes gesagt hat.", example_gloss: "Sie sagte, dass sie viel zu tun habe."}
  en.b1.unit09.lesson01.teach.told_me_that: {title: "told me that", gloss: "sagte mir, dass", note: "*told me that* verwendet man, wenn jemand einem selbst eine Information gegeben hat.", example_gloss: "Er sagte mir, dass das Meeting abgesagt worden sei."}
  en.b1.unit09.lesson01.teach.asked_whether: {title: "asked whether", gloss: "fragte, ob", note: "*asked whether* gibt eine Ja/Nein-Frage wieder und klingt etwas förmlicher als *asked if*.", example_gloss: "Mia fragte, ob wir Hilfe brauchten."}
  en.b1.unit09.lesson01.teach.asked_if: {title: "asked if", gloss: "fragte, ob", note: "*asked if* gibt eine Ja/Nein-Frage in der Alltagssprache wieder.", example_gloss: "Mia fragte, ob wir Hilfe brauchten."}
  en.b1.unit09.lesson01.teach.message: {title: "message", gloss: "Nachricht", note: "*message* bedeutet eine kurze schriftliche oder gesprochene Nachricht.", example_gloss: "Leila schickte nach dem Mittagessen eine Nachricht."}
  en.b1.unit09.lesson01.teach.confirm: {title: "confirm", gloss: "bestätigen", note: "*confirm* bedeutet zu sagen, dass etwas sicher oder richtig ist.", example_gloss: "Bitte bestätige die Uhrzeit, bevor du losgehst."}
  en.b1.unit09.lesson01.teach.available: {title: "available", gloss: "verfügbar, Zeit haben", note: "*available* bedeutet frei oder in der Lage, sich zu treffen.", example_gloss: "Mia hat nach dem Mittagessen Zeit."}

  en.b1.unit09.lesson02.teach.mia_available: {title: "Eine Aussage wiedergeben", gloss: "Mia sagte, dass sie nach dem Mittagessen Zeit habe.", note: "In der indirekten Rede rückt *is* oft zu *was*: *Mia said that she was available*. Anders als im Deutschen, wo man den Konjunktiv I (habe, sei) verwenden kann, steht im Englischen einfach die Vergangenheitsform."}
  en.b1.unit09.lesson02.teach.leila_told_me: {title: "Informationen an Sie wiedergeben", gloss: "Leila sagte mir, dass im Büro viel los war.", note: "*told me that* verwendet man, wenn jemand die Information direkt an Sie weitergegeben hat."}
  en.b1.unit09.lesson02.teach.grammar_backshift: {title: "Direkte und indirekte Rede", gloss: "Mia sagt: „Ich habe Zeit.“ Mia sagte, dass sie Zeit hatte.", note: "Direkt: *I am available*. Indirekt: *Mia said that she was available*. In der indirekten Rede rückt die ursprüngliche Aussage oft eine Zeitstufe zurück."}

  en.b1.unit09.lesson03.teach.short_summary: {title: "short summary", gloss: "kurze Zusammenfassung", note: "*short summary* bedeutet eine kurze Fassung mit nur den wichtigsten Punkten.", example_gloss: "Eine kurze Zusammenfassung reicht für das heutige Meeting."}
  en.b1.unit09.lesson03.teach.full_report: {title: "full report", gloss: "vollständiger Bericht", note: "*full report* bedeutet den ganzen Bericht, nicht nur die Kurzfassung.", example_gloss: "Mia fragte, ob wir den vollständigen Bericht brauchten."}
  en.b1.unit09.lesson03.teach.reading_passage: {title: "Lesetext: der Nachrichtenverlauf", gloss: "Leila las Mias Nachricht und rief Daniel an. Sie sagte, dass Mia nach dem Mittagessen Zeit habe. Sie sagte auch, dass Mia die Zahlen fertiggestellt habe. Mia fragte, ob das Team heute den vollständigen Bericht brauche. Daniel sagte Leila, dass eine kurze Zusammenfassung genüge, weil das Meeting nur fünfzehn Minuten dauere.", note: "Ein kurzer Lesetext darüber, Aussagen und Fragen wiederzugeben."}

  en.b1.unit09.lesson04.teach.q_mia_reply: {title: "Daniel fragt nach Mias Antwort", gloss: "Daniel sagt: Hat Mia sich wegen der Besprechung gemeldet?", note: "Eine Ja/Nein-Frage zu einer früheren Nachricht."}
  en.b1.unit09.lesson04.teach.a_she_said_available: {title: "Leila gibt Mias Aussage wieder", gloss: "Leila sagt: Ja, sie hat gesagt, dass sie nach dem Mittagessen Zeit hat.", note: "*she said that she was available* gibt Mias Aussage wieder."}
  en.b1.unit09.lesson04.teach.q_anything_else: {title: "Daniel fragt weiter", gloss: "Daniel sagt: Gut. Hat sie noch etwas anderes gefragt?", note: "Eine Nachfrage, um zu erfahren, ob in der Nachricht noch eine Frage stand."}
  en.b1.unit09.lesson04.teach.a_asked_if_report: {title: "Leila gibt Mias Frage wieder", gloss: "Leila sagt: Sie hat gefragt, ob wir heute den vollständigen Bericht brauchen.", note: "*asked if* macht aus einer direkten Ja/Nein-Frage indirekte Rede."}
  en.b1.unit09.lesson04.teach.q_what_tell_her: {title: "Daniel fragt nach Leilas Antwort", gloss: "Daniel sagt: Was hast du ihr gesagt?", note: "Eine Frage nach der Information, die Leila weitergegeben hat."}
  en.b1.unit09.lesson04.teach.a_short_summary_enough: {title: "Leila gibt ihre Antwort wieder", gloss: "Leila sagt: Ich habe ihr gesagt, dass eine kurze Zusammenfassung genügt.", note: "*I told her that...* gibt Informationen wieder, die Sie jemand anderem gegeben haben."}
  en.b1.unit09.lesson04.teach.q_tell_team: {title: "Daniel beendet den Nachrichtenverlauf", gloss: "Daniel sagt: Perfekt. Ich sage dem Team, dass wir uns um zwei Uhr treffen können.", note: "Daniel verwendet wieder *tell ... that*, um Informationen weiterzugeben."}

