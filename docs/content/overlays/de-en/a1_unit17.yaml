  en.a1.unit17.lesson01.teach.do_you_want_to:
    title: Do you want to see a movie this weekend?
    gloss: Willst du dieses Wochenende einen Film sehen?
    note: Mit *Do you want to...?* schlagen Sie eine Aktivität vor. Nach *to* folgt das Verb im Infinitiv, ohne weitere Endung.
  en.a1.unit17.lesson01.teach.would_you_like_to:
    title: Would you like to go for a walk?
    gloss: Hättest du Lust, spazieren zu gehen?
    note: '*Would you like to...?* ist eine etwas höflichere Variante von *Do you want to...?* Es entspricht dem deutschen ''Hättest du Lust ...?''.'
  en.a1.unit17.lesson02.teach.sure_id_love_to:
    title: Sure, I'd love to!
    gloss: Klar, sehr gern!
    note: Mit *I'd love to* sagen Sie begeistert zu. *I'd* ist die Kurzform von *I would*; nach *to* lässt man das Verb weg, weil es schon in der Frage steht.
  en.a1.unit17.lesson02.teach.sorry_cant_busy:
    title: Sorry, I can't. I'm busy on Saturday.
    gloss: Tut mir leid, ich kann nicht. Am Samstag habe ich zu tun.
    note: Mit diesem Satz sagen Sie ab und nennen den Grund. *can't* ist die Kurzform von *cannot*.
  en.a1.unit17.lesson02.teach.maybe_another_time:
    title: Maybe another time?
    gloss: Vielleicht ein andermal?
    note: Damit zeigen Sie, dass Sie bei einer anderen Gelegenheit gern kommen.
