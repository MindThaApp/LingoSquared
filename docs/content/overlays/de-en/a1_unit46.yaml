  en.a1.unit46.lesson02.teach.wheres_the_lost_and_found:
    title: Where's the lost and found?
    gloss: Wo ist das Fundbüro?
    note: '*the lost and found* ist die feste englische Bezeichnung für das Fundbüro, wörtlich: das Verlorene und Gefundene.'
  en.a1.unit46.lesson02.teach.yes_we_found_it:
    title: Yes, we found it!
    gloss: Ja, wir haben ihn gefunden!
    note: '*Yes, we found it!* bedeutet: Ja, wir haben es gefunden!'
  en.a1.unit46.lesson03.teach.dialogue_line1:
    title: Daniels Frage
    gloss: 'Daniel fragt: Mia, wo ist dein Rucksack? Du hattest ihn doch eben noch am Brunnen.'
    note: '*had* ist die Vergangenheitsform von *have*, wie im Deutschen "hatte".'
  en.a1.unit46.lesson03.teach.dialogue_line2:
    title: Mias Schreck
    gloss: 'Mia sagt: Oh nein, du hast recht! Ich habe ihn nicht. Meine Kamera ist drin!'
    note: '*My camera is inside!* bedeutet: Meine Kamera ist drin!'
  en.a1.unit46.lesson03.teach.dialogue_line3:
    title: Daniels Vorschlag
    gloss: 'Daniel sagt: Keine Sorge, lass uns im Parkbüro anrufen und nachfragen.'
    note: '*Don''t worry* bedeutet: Keine Sorge / Mach dir keine Sorgen.'
  en.a1.unit46.lesson03.teach.dialogue_line4:
    title: Daniel ruft an
    gloss: 'Daniel sagt: Hallo, wir haben am Brunnen einen schwarzen Rucksack verloren. Hat ihn jemand gefunden?'
    note: '*we lost a black backpack* bedeutet: wir haben einen schwarzen Rucksack verloren -- das Englische verwendet hier einfach die Vergangenheitsform *lost*.'
  en.a1.unit46.lesson03.teach.dialogue_line5:
    title: Mias Frage
    gloss: 'Mia sagt: Was haben sie gesagt?'
    note: '*did they say* verwendet *did* als Hilfsverb in der Vergangenheit.'
  en.a1.unit46.lesson03.teach.dialogue_line6:
    title: Daniels gute Nachricht
    gloss: 'Daniel sagt: Sie haben ihn gefunden! Er ist schwarz mit einem gelben Riemen, stimmt''s? Sie bewahren ihn am Empfang auf.'
    note: '*right?* am Satzende ist eine kurze Rückfrage, ähnlich wie "stimmt''s?" oder "oder?" im Deutschen.'
  en.a1.unit46.lesson03.teach.dialogue_line7:
    title: Mias Erleichterung
    gloss: 'Mia sagt: Ja, das ist er! Lass uns ihn gleich abholen. Gott sei Dank.'
    note: '*Let''s go get it* bedeutet: Lass uns ihn holen gehen -- zwei Verben hintereinander, ohne *to*.'
  en.a1.unit46.lesson04.teach.reading_passage:
    title: Text über das Fundbüro
    gloss: 'Das Fundbüro: Wenn Sie im Park etwas verlieren, überlegen Sie zuerst, wo Sie es zuletzt hatten. Gehen Sie dann zum Parkbüro am Haupteingang und beschreiben Sie den Gegenstand -- nennen Sie die Farbe und besondere Merkmale. Geben Sie Ihren Namen und Ihre Telefonnummer an, damit die Mitarbeiter Sie anrufen können, falls sie ihn später finden. Nachdem Mia ihren Rucksack am Brunnen verloren hatte, riefen sie und Daniel sofort im Parkbüro an. Die Mitarbeiter hatten ihn schon gefunden und bewahrten ihn am Empfang auf. Mia war sehr erleichtert, ihre Kamera sicher zurückzubekommen. Später erzählte sie Leila die ganze Geschichte, und Leila sagte, sie werde Mia nächstes Mal helfen, besser auf ihre Sachen aufzupassen.'
    note: '*keep better track of your things* bedeutet: besser auf Ihre Sachen aufpassen.'
