  en.a1.unit46.lesson02.teach.i_lost_my_wallet:
    title: I lost my wallet.
    gloss: Ich habe mein Portemonnaie verloren.
    note: 'Wörtlich: ich verlor mein Portemonnaie. Im Deutschen sagt man meist das Perfekt (ich habe ... verloren), im Englischen reicht hier die einfache Vergangenheit *lost*.'
  en.a1.unit46.lesson02.teach.have_you_seen_my_keys:
