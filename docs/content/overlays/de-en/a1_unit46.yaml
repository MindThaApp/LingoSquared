    title: lost
    gloss: verloren
    note: '*lost* bedeutet hier verloren. Im Englischen steht dafür die Vergangenheitsform *lost* (I lost my wallet), nicht das Perfekt wie im Deutschen (ich habe verloren).'
    example_gloss: Ich habe mein Portemonnaie verloren.
