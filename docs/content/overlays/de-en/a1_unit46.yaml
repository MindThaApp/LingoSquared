    gloss: Hast du meine Schlüssel gesehen?
    note: '*Have you seen ...?* bedeutet: Hast du ... gesehen? -- derselbe Aufbau wie im Deutschen, mit *have* als Hilfsverb.'
  en.a1.unit46.lesson02.teach.has_anyone_found_a_backpack:
