  en.a1.unit43.lesson03.teach.dialogue_line1:
    title: Daniels Frage
    gloss: 'Daniel fragt: Ich brauche ein neues Hemd für unsere Präsentation nächste Woche. Kannst du mir helfen, eine Farbe auszusuchen?'
    note: '*Can you help me* + Verb*?* bittet um Hilfe.'
  en.a1.unit43.lesson03.teach.dialogue_line2:
    title: Mias Frage
    gloss: 'Mia sagt: Klar! Welche Farben magst du?'
    note: '*What colors do you like?* fragt nach den Lieblingsfarben eines Menschen.'
  en.a1.unit43.lesson03.teach.dialogue_line3:
    title: "Daniels Antwort"
    gloss: 'Daniel sagt: Ich mag Blau und Grün, aber ich weiß nicht genau, was professionell wirkt.'
    note: '*I''m not sure what looks professional* bedeutet: Ich weiß nicht genau, was professionell wirkt.'
  en.a1.unit43.lesson03.teach.dialogue_line4:
    title: Mias Rat
    gloss: 'Mia sagt: Dunkelblau ist eine tolle Wahl. Es wirkt professionell, und es passt gut zu einer schwarzen Hose.'
    note: '*It looks professional* bedeutet: Es wirkt professionell.'
  en.a1.unit43.lesson03.teach.dialogue_line5:
    title: Daniels Frage
    gloss: 'Daniel fragt: Und was ist mit diesem gelben?'
    note: '*What about ...?* schlägt eine Alternative vor.'
  en.a1.unit43.lesson03.teach.dialogue_line6:
    title: Mias Rat
    gloss: 'Mia sagt: Gelb ist eine schöne Farbe, aber für eine Präsentation zu grell. Ich würde das dunkelblaue Hemd nehmen.'
    note: '*I''d choose* bedeutet: Ich würde nehmen.'
  en.a1.unit43.lesson03.teach.dialogue_line7:
    title: Daniels Entscheidung
    gloss: 'Daniel sagt: Danke, Mia. Dann also Dunkelblau!'
    note: '*Dark blue it is!* ist eine lockere Art, eine Entscheidung zu bestätigen.'
  en.a1.unit43.lesson04.teach.reading_passage:
    title: Text über drei Lieblingsfarben
    gloss: Daniel, Leila und Mia haben alle eine andere Lieblingsfarbe. Daniels Lieblingsfarbe ist Blau. Er sagt, es ist eine ruhige Farbe, und sie passt zu fast allem, was er zur Arbeit trägt. Leilas Lieblingsfarbe ist Grün, die Farbe der Pflanzen und Gärten, die sie gern malt. Sie findet Hellgrün besonders schön. Mias Lieblingsfarbe ist Gelb, weil sie sie an die Sonne erinnert und sie immer glücklich macht. Obwohl sie alle verschiedene Farben mögen, sind sie sich einig, dass Farben jeden Tag schöner machen.
    note: '*reminds her of the sun* bedeutet: erinnert sie an die Sonne.'
