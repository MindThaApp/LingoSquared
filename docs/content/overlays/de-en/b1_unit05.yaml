  en.b1.unit05.lesson04.teach.q_thank_you_appreciate: {title: "Daniel bedankt sich bei Mia", gloss: "Daniel sagt: Danke, das weiß ich wirklich zu schätzen.", note: "*I really appreciate it* ist eine aufrichtige Art, Dankbarkeit auszudrücken."}
