  en.b1.unit05.lesson04.teach.q_make_sure_numbers: {title: "Daniel erklärt, was er braucht", gloss: "Daniel sagt: Ich möchte sichergehen, dass die Zahlen stimmen.", note: "*make sure* bedeutet, zu prüfen, dass etwas stimmt."}
