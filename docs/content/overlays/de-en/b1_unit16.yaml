  en.b1.unit16.lesson03.teach.reading_passage: {title: "Lesetext: Rat bei zu viel Arbeit", gloss: "Hallo Leila, ich fühle mich diese Woche überfordert. Ich leite zwei Projekte, und dazu kommt noch mein Abendkurs. Hast du einen Rat? Hallo Daniel, wenn ich du wäre, würde ich mit deiner Teamleitung über die Arbeitsbelastung sprechen. Du solltest außerdem das Projekt mit der nächsten Frist priorisieren. Wie wäre es, Mia zu bitten, bei dem anderen Projekt zu helfen? Danke, das leuchtet mir ein. Ich probiere es aus und sage dir Bescheid, wie es läuft.", note: "Ein kurzer, herzlicher Rat unter Kollegen."}

