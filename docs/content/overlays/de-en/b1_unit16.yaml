  en.b1.unit16.lesson04.teach.a_talk_to_manager: {title: "Leila gibt ihren ersten Rat", gloss: "Leila sagt: Wenn ich du wäre, würde ich mit deiner Teamleitung über die Arbeitsbelastung sprechen.", note: "*if I were you, I would* ist die unwirkliche hypothetische Form."}
  en.b1.unit16.lesson04.teach.q_dont_want_to_seem: {title: "Daniel zögert", gloss: "Daniel sagt: Das ist eine gute Idee, aber ich möchte nicht den Eindruck erwecken, dass ich es nicht schaffe.", note: "*I don't want to seem like* drückt eine Sorge darüber aus, wie man wirkt."}
  en.b1.unit16.lesson04.teach.a_prioritize_and_how_about: {title: "Leila macht zwei konkrete Vorschläge", gloss: "Leila sagt: Du solltest zuerst das Projekt mit der nächsten Frist priorisieren. Wie wäre es, wenn du eine Kollegin oder einen Kollegen bittest, bei dem anderen Projekt zu helfen?", note: "*you should* und *how about* verbinden einen direkten und einen sanften Vorschlag."}
  en.b1.unit16.lesson04.teach.q_ask_mia_this_week: {title: "Daniel nimmt den Rat an", gloss: "Daniel sagt: Das gefällt mir. Ich frage Mia, ob sie diese Woche Zeit hat.", note: "*I like that* zeigt, dass man den Rat annimmt."}
  en.b1.unit16.lesson04.teach.a_sounds_like_solid_plan: {title: "Leila bestätigt den Plan", gloss: "Leila sagt: Das klingt nach einem soliden Plan.", note: "Ein kurzer, ermutigender Abschluss des Gesprächs."}

