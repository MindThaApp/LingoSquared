  en.b1.unit16.lesson02.teach.grammar_advice_forms: {title: "Formen, um Rat zu geben", gloss: "Rat und Vorschläge verwenden verschiedene Formen: If I were you, I would... (eine unwirkliche Hypothese), You should... (eine direkte Empfehlung) und How about + -ing...? (ein sanfterer Vorschlag). Wählen Sie eine stärkere oder sanftere Form, je nachdem, wie bestimmt Sie klingen möchten.", note: "Form: Wählen Sie zwischen einer unwirklichen Hypothese, einer direkten Empfehlung oder einem sanften Vorschlag."}

