teaching:
  en.a2.unit36.lesson01.teach.certificate: {title: "certificate", gloss: "Bescheinigung", note: "*certificate* ist das amtliche Papier, das eine Behörde einem ausstellt; *registration certificate* ist die Meldebescheinigung.", example_gloss: "Meine Meldebescheinigung kam zwei Wochen nach dem Termin."}
  en.a2.unit36.lesson01.teach.mistake: {title: "mistake", gloss: "Fehler", note: "*mistake* ist etwas, das falsch geschrieben oder falsch gemacht wurde.", example_gloss: "In meiner Adresse auf diesem Formular ist ein Fehler."}
  en.a2.unit36.lesson01.teach.spelled: {title: "spelled", gloss: "geschrieben, buchstabiert", note: "*spelled* sagt, mit welchen Buchstaben in welcher Reihenfolge ein Wort geschrieben wird.", example_gloss: "Mein Name wird mit einem L geschrieben, nicht mit zwei."}
  en.a2.unit36.lesson01.teach.correct: {title: "correct", gloss: "berichtigen, korrigieren", note: "*correct* ist hier ein Verb: etwas Falsches richtig machen.", example_gloss: "Der Sachbearbeiter kann meinen Nachnamen heute berichtigen."}
  en.a2.unit36.lesson01.teach.copy: {title: "copy", gloss: "Kopie", note: "*copy* ist eine zweite, identische Fassung eines Dokuments.", example_gloss: "Das Amt behält von jedem Dokument eine Kopie."}
  en.a2.unit36.lesson01.teach.passport: {title: "passport", gloss: "Reisepass", note: "*passport* ist das Reisedokument mit Ihrem Foto.", example_gloss: "Zu einem Termin beim Amt bringe ich immer meinen Reisepass mit."}
  en.a2.unit36.lesson01.teach.grammar_there_is_there_are: {title: "there is und there are", gloss: "Auf meiner Bescheinigung ist ein Fehler. Auf meiner Bescheinigung sind zwei Fehler.", note: "*there is* verwendet man bei einer einzelnen Sache, *there are* bei mehr als einer, so wie im Deutschen ist und sind."}

  en.a2.unit36.lesson02.teach.there_is_a_mistake: {title: "Sagen, dass ein Fehler vorliegt", gloss: "Auf meiner Meldebescheinigung ist ein Fehler.", note: "*There is a mistake on...* ist die sachliche, förmliche Art, einen Fehler zu melden."}
  en.a2.unit36.lesson02.teach.name_spelled_wrong: {title: "Sagen, was genau falsch ist", gloss: "Mein Nachname ist falsch geschrieben.", note: "*last name* ist der Nachname; *first name* ist der Vorname."}
  en.a2.unit36.lesson02.teach.could_you_correct_it: {title: "Fragen, ob es berichtigt werden kann", gloss: "Könnten Sie das bitte berichtigen?", note: "*Could you...?* ist höflicher als *Can you...?* und passt an einen Amtsschalter."}
  en.a2.unit36.lesson02.teach.how_long_correction: {title: "Fragen, wie lange es dauert", gloss: "Wie lange dauert die Berichtigung?", note: "*How long...?* fragt nach einer Zeitdauer, nicht nach einer Länge."}
  en.a2.unit36.lesson02.teach.grammar_polite_request: {title: "zwei höfliche Bitten", gloss: "Könnten Sie das bitte berichtigen? Wäre es möglich, eine neue Bescheinigung zu bekommen?", note: "*Could you...?* bittet darum, etwas zu tun; *Would it be possible to...?* ist noch vorsichtiger und fragt, ob etwas überhaupt möglich ist."}

  en.a2.unit36.lesson03.teach.working_days: {title: "working days", gloss: "Werktage / Arbeitstage", note: "*working days* sind die Tage von Montag bis Freitag, also ohne das Wochenende.", example_gloss: "Das Amt beantwortet jeden Brief innerhalb von fünf Werktagen."}
  en.a2.unit36.lesson03.teach.notice_text: {title: "Das Schreiben zur Berichtigung", gloss: "Berichtigungsantrag eingegangen. Ihre Meldebescheinigung wird innerhalb von fünf Werktagen berichtigt. Bitte bringen Sie Ihren Reisepass und dieses Schreiben mit ins Amt. Aktenzeichen 3092.", note: "Ein amtliches Schreiben ist kurz und sachlich: was geschehen ist, was geschehen wird und was Sie tun müssen."}
  en.a2.unit36.lesson03.teach.bring_passport_and_notice: {title: "was man mitbringen soll", gloss: "Bitte bringen Sie Ihren Reisepass und dieses Schreiben mit ins Amt.", note: "*bring ... to ...* bedeutet, etwas an einen Ort mitzubringen."}

  en.a2.unit36.lesson04.teach.q_there_is_a_mistake: {title: "Leila meldet den Fehler", gloss: "Leila sagt: Guten Tag, auf meiner Meldebescheinigung ist ein Fehler.", note: "*Hello* ist neutraler als *Hi* und passt besser an einen Amtsschalter."}
  en.a2.unit36.lesson04.teach.a_what_is_wrong: {title: "Der Sachbearbeiter fragt nach", gloss: "Der Sachbearbeiter sagt: Verstehe. Was stimmt denn nicht?", note: "*I see* bedeutet hier: Ich verstehe, ich höre zu."}
  en.a2.unit36.lesson04.teach.q_name_spelled_wrong: {title: "Leila erklärt den Fehler und bittet um Berichtigung", gloss: "Leila sagt: Mein Nachname ist falsch geschrieben. Könnten Sie das bitte berichtigen?", note: "Dieselben zwei Sätze wie in Lektion 2, jetzt hintereinander."}
  en.a2.unit36.lesson04.teach.a_do_you_have_passport: {title: "Der Sachbearbeiter fragt nach dem Reisepass", gloss: "Der Sachbearbeiter sagt: Selbstverständlich. Haben Sie Ihren Reisepass dabei?", note: "*Do you have ... with you?* bedeutet: Haben Sie es jetzt dabei?"}
  en.a2.unit36.lesson04.teach.q_here_it_is: {title: "Leila reicht ihren Reisepass", gloss: "Leila sagt: Ja, bitte sehr.", note: "*Here it is* sagt man, während man jemandem etwas reicht."}
  en.a2.unit36.lesson04.teach.a_copy_and_send: {title: "Der Sachbearbeiter erklärt, was er tut", gloss: "Der Sachbearbeiter sagt: Vielen Dank. Ich mache eine Kopie und schicke die Berichtigung noch heute los.", note: "*make a copy* ist eine feste Verbindung: eine Kopie machen."}
  en.a2.unit36.lesson04.teach.q_how_long: {title: "Leila fragt, wie lange es dauert", gloss: "Leila fragt: Wie lange dauert die Berichtigung?", note: "Dieselbe Frage wie in Lektion 2."}
  en.a2.unit36.lesson04.teach.a_within_five_working_days: {title: "Die Antwort des Sachbearbeiters", gloss: "Der Sachbearbeiter sagt: Innerhalb von fünf Werktagen.", note: "*within* bedeutet innerhalb einer Frist, es dauert also höchstens fünf Werktage."}
  en.a2.unit36.lesson04.teach.q_thank_you: {title: "Leila bedankt sich beim Sachbearbeiter", gloss: "Leila sagt: Vielen Dank.", note: "*very much* macht das Danken nachdrücklicher."}

