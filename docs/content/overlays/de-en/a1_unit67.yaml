  en.a1.unit67.lesson04.teach.reading_passage:
    title: 'Text: Gute Familiennachrichten'
    gloss: 'Gute Familiennachrichten: Mia fragte Daniel nach seiner Familie. Daniel sagte, dass es ihnen gut gehe. Dann teilte er gute Neuigkeiten mit: Seine Schwester hatte ein Baby bekommen. Mia sagte, die Neuigkeit sei wunderbar. Daniel sagte, er und seine Familie würden bald zu Besuch kommen. Er war stolz auf seine Schwester. Später schickte Mia eine kurze Nachricht: Ich freue mich für deine Familie.'
    note: '*shared good news* bedeutet: teilte gute Neuigkeiten mit.'
