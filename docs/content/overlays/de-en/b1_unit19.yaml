  en.b1.unit19.lesson02.teach.in_summary_budget_client: {title: "In summary, ... (eine Zusammenfassung geben)", gloss: "Zusammenfassend ging es in dem Meeting um das Budget und den neuen Kunden.", note: "*In summary, the meeting covered...* eröffnet eine kurze, verkürzte Zusammenfassung dessen, was besprochen wurde."}
  en.b1.unit19.lesson02.teach.main_point_under_budget: {title: "The main point was that ... (den Hauptpunkt nennen)", gloss: "Der Hauptpunkt war, dass wir diesen Monat unter dem Budget liegen.", note: "*The main point was that...* nennt die allerwichtigste Idee, getrennt von kleineren Details."}
  en.b1.unit19.lesson02.teach.grammar_summary_structure: {title: "Der Aufbau einer Zusammenfassung", gloss: "Beginnen Sie eine Zusammenfassung mit einem Ausdruck wie In summary oder In short und nennen Sie dann nur die Hauptpunkte in der richtigen Reihenfolge, in einem kurzen Satz. Verwenden Sie The main point was that..., um die allerwichtigste Idee hervorzuheben, getrennt von kleineren Details.", note: "Form: Beginnen Sie mit In summary/In short und verwenden Sie The main point was that... für den Hauptpunkt."}

  en.b1.unit19.lesson03.teach.condensed: {title: "condensed", gloss: "verkürzt, gekürzt", note: "*condensed* beschreibt eine Zusammenfassung, die kürzer gemacht wurde, aber die Hauptpunkte beibehält.", example_gloss: "Mia gab Daniel eine verkürzte Zusammenfassung des Meetings."}
  en.b1.unit19.lesson03.teach.original_article: {title: "original article", gloss: "ursprünglicher Artikel, Originalartikel", note: "*original article* bedeutet den vollständigen Originaltext, bevor er zusammengefasst wurde.", example_gloss: "Leilas Zusammenfassung stimmte gut mit dem Originalartikel überein."}
  en.b1.unit19.lesson03.teach.reading_passage: {title: "Lesetext: einen kurzen Artikel zusammenfassen", gloss: "Leila las für ihren Designkurs einen langen Artikel über Kommunikation am Arbeitsplatz. Der Originalartikel enthielt viele Beispiele und Hintergrundinformationen, aber Leila brauchte nur die Hauptpunkte. Mit eigenen Worten schrieb sie eine verkürzte Zusammenfassung: Kommunikation am Arbeitsplatz funktioniert am besten, wenn Nachrichten klar und kurz sind und wenn Leute Fragen stellen, statt zu raten. Sie ließ die meisten Beispiele weg, weil das Details waren und keine Hauptpunkte. Ihr Dozent sagte, die Zusammenfassung habe die wichtigen Ideen in der richtigen Reihenfolge behalten.", note: "Ein kurzer Lesetext."}

  en.b1.unit19.lesson04.teach.q_missed_meeting: {title: "Daniel bittet um eine Erklärung", gloss: "Daniel sagt: Ich habe das Meeting verpasst. Kannst du mir sagen, was passiert ist?", note: "Eine offene Frage, um um eine Zusammenfassung zu bitten."}
  en.b1.unit19.lesson04.teach.a_in_short_budget_client: {title: "Mia gibt eine kurze Zusammenfassung", gloss: "Mia sagt: Klar. Kurz gesagt, wir haben über das Budget und den neuen Kunden gesprochen.", note: "*in short* eröffnet eine schnelle, informelle Zusammenfassung."}
  en.b1.unit19.lesson04.teach.q_main_point_budget: {title: "Daniel fragt nach dem Hauptpunkt", gloss: "Daniel sagt: Was war der Hauptpunkt zum Budget?", note: "Eine gezielte Frage nach dem Hauptpunkt."}
  en.b1.unit19.lesson04.teach.a_under_budget_this_month: {title: "Mia nennt den Hauptpunkt", gloss: "Mia sagt: Der Hauptpunkt war, dass wir diesen Monat unter dem Budget liegen.", note: "*the main point was that...* hebt die wichtigste Idee hervor."}
  en.b1.unit19.lesson04.teach.q_other_details: {title: "Daniel fragt nach Details", gloss: "Daniel sagt: Gut. Gab es noch andere Details?", note: "Eine Nachfrage zu kleineren Details."}
  en.b1.unit19.lesson04.teach.a_client_meeting_moved: {title: "Mia nennt ein kleines Detail", gloss: "Mia sagt: Nur noch ein kleines Detail: Der Kundentermin wurde auf nächste Woche verschoben.", note: "*just one small detail* leitet eine kleine, ergänzende Tatsache ein."}
  en.b1.unit19.lesson04.teach.q_thanks_for_summary: {title: "Daniel bedankt sich bei Mia", gloss: "Daniel sagt: Danke für die Zusammenfassung. Das ist sehr hilfreich.", note: "Ein kurzer, anerkennender Abschluss des Gesprächs."}

