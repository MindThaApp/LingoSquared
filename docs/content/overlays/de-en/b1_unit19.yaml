  en.b1.unit19.lesson01.teach.detail: {title: "detail", gloss: "Detail", note: "*detail* bedeutet eine kleine zusätzliche Information, die den Hauptpunkt stützt.", example_gloss: "Mia fügte ein kleines Detail zum Zeitplan hinzu."}
  en.b1.unit19.lesson01.teach.in_summary: {title: "in summary", gloss: "zusammenfassend", note: "*in summary* leitet am Ende einer längeren Erklärung eine verkürzte Zusammenfassung ein.", example_gloss: "Zusammenfassend: Das Projekt ist nächsten Monat fertig."}
  en.b1.unit19.lesson01.teach.in_short: {title: "in short", gloss: "kurz gesagt", note: "*in short* ist eine schnelle, informelle Art, in einem Gespräch gleich zum Punkt zu kommen.", example_gloss: "Kurz gesagt, das Team war sich über den Plan einig."}
