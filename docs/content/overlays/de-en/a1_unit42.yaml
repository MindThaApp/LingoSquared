teaching:
  en.a1.unit42.lesson01.teach.friendly:
    title: friendly
    gloss: freundlich
    note: '*friendly* bedeutet freundlich und leicht ansprechbar.'
    example_gloss: Mein Nachbar ist sehr freundlich.
  en.a1.unit42.lesson01.teach.funny:
    title: funny
    gloss: lustig
    note: '*funny* bedeutet lustig: jemand, der andere zum Lachen bringt.'
    example_gloss: Mein Bruder ist wirklich lustig.
  en.a1.unit42.lesson01.teach.hardworking:
    title: hardworking
    gloss: fleißig
    note: '*hardworking* bedeutet fleißig: jemand, der nicht so schnell aufgibt.'
    example_gloss: Sie ist eine fleißige Angestellte.
  en.a1.unit42.lesson01.teach.shy:
    title: shy
    gloss: schüchtern
    note: '*shy* bedeutet schüchtern oder nervös bei neuen Leuten.'
    example_gloss: Er ist am Anfang ein bisschen schüchtern.
  en.a1.unit42.lesson01.teach.calm:
    title: calm
    gloss: ruhig / gelassen
    note: '*calm* bedeutet ruhig und gelassen: jemand, der sich nicht schnell aufregt oder nervös wird.'
    example_gloss: Meine Mutter ist sehr gelassen.
  en.a1.unit42.lesson01.teach.talkative:
    title: talkative
    gloss: gesprächig / redselig
    note: '*talkative* bedeutet gesprächig: jemand, der viel redet.'
    example_gloss: Meine Schwester ist sehr gesprächig.
  en.a1.unit42.lesson02.teach.a_little_shy:
    title: a little shy
    gloss: ein bisschen schüchtern
    note: '*a little* bedeutet hier ein bisschen (ein Grad), nicht klein (eine Größe). Übersetzen Sie es also nicht wörtlich als ''klein schüchtern''.'
    example_gloss: Er ist am Anfang ein bisschen schüchtern, aber er taut schnell auf.
  en.a1.unit42.lesson02.teach.very_hardworking:
    title: very hardworking
    gloss: sehr fleißig
    note: '*very hardworking* bedeutet sehr fleißig.'
    example_gloss: Mein Kollege ist sehr fleißig.
  en.a1.unit42.lesson02.teach.have_a_great_sense_of_humor:
    title: have a great sense of humor
    gloss: einen tollen Sinn für Humor haben
    note: '*have a great sense of humor* bedeutet einen tollen Sinn für Humor haben.'
    example_gloss: Daniel hat einen tollen Sinn für Humor.
  en.a1.unit42.lesson02.teach.get_along_with_everyone:
    title: get along with everyone
    gloss: sich mit allen gut verstehen
    note: '*get along with everyone* bedeutet sich mit allen gut verstehen.'
    example_gloss: Mia versteht sich bei der Arbeit mit allen gut.
  en.a1.unit42.lesson02.teach.warm_up_quickly:
    title: warm up quickly
    gloss: schnell auftauen
    note: '*warm up quickly* bedeutet bei neuen Leuten schnell auftauen, also sich schnell wohlfühlen.'
    example_gloss: Er ist schüchtern, aber er taut schnell auf, sobald er dich kennt.
  en.a1.unit42.lesson02.teach.whats_he_like_question:
    title: What's he like?
    gloss: Wie ist er?
    note: '*What''s he like?* fragt nach dem Charakter eines Menschen, nicht danach, wie er aussieht.'
  en.a1.unit42.lesson03.teach.dialogue_line1:
    title: Mias Frage
    gloss: 'Mia fragt: Ich fange nächste Woche ein neues Projekt mit Daniel an. Wie ist er so?'
    note: '*What''s he like?* fragt nach dem Charakter eines Menschen.'
  en.a1.unit42.lesson03.teach.dialogue_line2:
    title: "Leilas Antwort"
    gloss: 'Leila sagt: Er ist sehr freundlich, und er ist auch richtig lustig.'
    note: '*and he''s really funny too* bedeutet: und er ist auch richtig lustig.'
  en.a1.unit42.lesson03.teach.dialogue_line3:
    title: Mias Frage
    gloss: 'Mia sagt: Schön zu hören! Ist es leicht, mit ihm zusammenzuarbeiten?'
    note: '*Is he easy to work with?* fragt, ob die Zusammenarbeit mit jemandem angenehm ist.'
  en.a1.unit42.lesson03.teach.dialogue_line4:
    title: "Leilas Antwort"
    gloss: 'Leila sagt: Ja, er ist auch sehr fleißig. Er erledigt seine Aufgaben immer pünktlich.'
    note: '*finishes his tasks on time* bedeutet: erledigt seine Aufgaben pünktlich.'
  en.a1.unit42.lesson03.teach.dialogue_line5:
    title: Mias Frage
    gloss: 'Mia fragt: Ist er in Besprechungen manchmal schüchtern?'
    note: '*ever* bedeutet hier: überhaupt mal, manchmal.'
  en.a1.unit42.lesson03.teach.dialogue_line6:
    title: "Leilas Antwort"
    gloss: 'Leila sagt: Ein bisschen, aber er wird lockerer, sobald er dich kennt.'
    note: '*once he knows you* bedeutet: sobald er dich kennt.'
  en.a1.unit42.lesson03.teach.dialogue_line7:
    title: Mias Dank
    gloss: 'Mia sagt: Danke, Leila. Jetzt fühle ich mich bei dem Projekt viel entspannter.'
    note: '*I feel more relaxed* bedeutet: Ich fühle mich entspannter.'
  en.a1.unit42.lesson04.teach.reading_passage:
    title: Text über drei Persönlichkeiten
    gloss: 'Daniel, Leila und Mia sind enge Freunde, aber sie haben sehr unterschiedliche Persönlichkeiten. Daniel ist freundlich und lustig: Er bringt seine Freunde immer zum Lachen. Er ist ein bisschen schüchtern, wenn er neue Leute trifft, aber er taut schnell auf. Leila ist ruhig und kreativ. Sie malt gern, weil es ihr beim Entspannen hilft, und sie regt sich selten über etwas auf. Mia ist gesellig und organisiert. Sie plant gern für die Gruppe, und sie ist sehr geduldig, wenn sie ihren Freunden etwas Neues beibringt: Sie hat Daniel das Kochen beigebracht. Obwohl sie alle verschieden sind, verstehen sie sich gut und verbringen gern Zeit miteinander.'
    note: '*even though* bedeutet: obwohl.'
