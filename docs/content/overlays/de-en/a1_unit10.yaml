  en.a1.unit10.lesson01.teach.corner: {title: "Corner", gloss: "Ecke", note: "*corner* bedeutet Ecke -- der Ort, an dem zwei Straßen aufeinandertreffen.", example_gloss: "Biegen Sie an der Ecke links ab."}

  en.a1.unit10.lesson02.teach.how_do_i_get_to: {title: "How do I get to the bank?", gloss: "Wie komme ich zur Bank?", note: "*How do I get to...?* fragt nach dem Weg zu einem bestimmten Ort."}
  en.a1.unit10.lesson02.teach.go_straight_then_left: {title: "Go straight, then turn left at the corner.", gloss: "Gehen Sie geradeaus, dann biegen Sie an der Ecke links ab.", note: "*then* verbindet zwei aufeinanderfolgende Anweisungen."}
  en.a1.unit10.lesson02.teach.is_it_far: {title: "Is it far?", gloss: "Ist es weit?", note: "Eine kurze Nachfrage zur Entfernung."}
  en.a1.unit10.lesson02.teach.two_minutes: {title: "It's just two minutes from here.", gloss: "Es sind nur zwei Minuten von hier.", note: "*just* betont hier, dass es sehr nah ist."}
  en.a1.unit10.lesson02.teach.cant_miss_it: {title: "You can't miss it.", gloss: "Sie können es nicht verfehlen.", note: "*You can't miss it* ist eine feste Redewendung, die versichert, dass ein Ort leicht zu finden ist."}

  en.a1.unit10.lesson03.teach.first_street: {title: "Take the first street on the left.", gloss: "Nehmen Sie die erste Straße links.", note: "*Take the first street* bedeutet 'die erste Straße nehmen/abbiegen.'"}
  en.a1.unit10.lesson03.teach.second_street: {title: "Take the second street on the right.", gloss: "Nehmen Sie die zweite Straße rechts.", note: "*second* bedeutet 'zweite(r/s).'"}
  en.a1.unit10.lesson03.teach.route_text: {title: "Directions to the pharmacy", gloss: "Wegbeschreibung zur Apotheke: Gehen Sie geradeaus. Nehmen Sie die erste Straße links. Die Apotheke ist auf der rechten Seite.", note: "Schriftliche Wegbeschreibungen reihen kurze Befehlssätze aneinander, jeweils einen Schritt nach dem anderen."}

  en.a1.unit10.lesson04.teach.q_bank: {title: "Frage von Daniel", gloss: "Daniel: Entschuldigung, wie komme ich zur Bank?", note: "Daniel spricht einen Fremden höflich mit *Excuse me* an."}
  en.a1.unit10.lesson04.teach.a_route: {title: "Antwort von Leila", gloss: "Leila: Gehen Sie geradeaus, dann biegen Sie an der Ecke links ab.", note: "Leila gibt eine zweischrittige Wegbeschreibung."}
