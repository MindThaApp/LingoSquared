  en.a1.unit10.lesson02.asking_how_to_get: {title: "Fragen, wie man irgendwohin kommt"}
  en.a1.unit10.lesson03.reading_a_route: {title: "Eine einfache schriftliche Wegbeschreibung lesen"}
