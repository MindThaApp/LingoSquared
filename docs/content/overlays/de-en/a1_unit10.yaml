  en.a1.unit10.lesson04.teach.a_close_cant_miss: {title: "Antwort von Leila", gloss: "Leila: Nein, es sind nur zwei Minuten von hier. Sie können es nicht verfehlen.", note: "Leila beruhigt Daniel, dass der Weg kurz und einfach zu finden ist."}

