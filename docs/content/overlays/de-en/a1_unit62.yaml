teaching:
  en.a1.unit62.lesson01.teach.phone:
    title: phone
    gloss: Telefon, Handy
    note: '*phone* bedeutet Telefon. Im Alltag meint *phone* meistens das Handy.'
    example_gloss: Mein Handy ist hier.
  en.a1.unit62.lesson01.teach.call:
    title: call
    gloss: anrufen / Anruf
    note: '*call* kann ein Anruf sein oder ''anrufen'' bedeuten: *a call* (Nomen), *to call* (Verb).'
    example_gloss: Ich kann dich anrufen.
  en.a1.unit62.lesson01.teach.message:
    title: message
    gloss: Nachricht
    note: '*message* bedeutet Nachricht.'
    example_gloss: Hinterlassen Sie eine Nachricht.
  en.a1.unit62.lesson01.teach.voicemail:
    title: voicemail
    gloss: Voicemail, Mailbox
    note: '*voicemail* bedeutet eine besprochene Telefonnachricht (die Mailbox).'
    example_gloss: Die Voicemail ist kurz.
  en.a1.unit62.lesson01.teach.repeat:
    title: repeat
    gloss: wiederholen
    note: '*repeat* bedeutet noch einmal sagen.'
    example_gloss: Bitte wiederholen Sie das.
  en.a1.unit62.lesson01.teach.slowly:
    title: slowly
    gloss: langsam
    note: '*slowly* bedeutet langsam. Es ist ein Adverb auf *-ly*; im Deutschen ist ''langsam'' Adjektiv und Adverb zugleich.'
    example_gloss: Bitte sprechen Sie langsam.
  en.a1.unit62.lesson02.teach.this_is_leila:
    title: Hello, this is Leila.
    gloss: Hallo, hier ist Leila.
    note: Am Telefon sagt man im Englischen *this is...*, um zu sagen, wer anruft. *My name is...* klingt am Telefon ungewöhnlich.
  en.a1.unit62.lesson02.teach.speak_to_mia:
    title: Can I speak to Mia?
    gloss: Kann ich Mia sprechen?
    note: '*speak to* bedeutet sprechen mit. Das deutsche ''mit'' wird hier zu *to*.'
  en.a1.unit62.lesson02.teach.repeat_that:
    title: Please repeat that.
    gloss: Bitte wiederholen Sie das.
    note: '*Please repeat that* bittet höflich um Wiederholung.'
  en.a1.unit62.lesson02.teach.speak_slowly:
    title: Please speak slowly.
    gloss: Bitte sprechen Sie langsam.
    note: '*slowly* steht hier nach dem Verb *speak*.'
  en.a1.unit62.lesson02.teach.leave_message:
    title: Leave a message.
    gloss: Hinterlassen Sie eine Nachricht.
    note: '*leave a message* ist die feste Wendung für ''eine Nachricht hinterlassen''.'
  en.a1.unit62.lesson02.teach.call_back_later:
    title: I'll call back later.
    gloss: Ich rufe später zurück.
    note: '*call back* bedeutet zurückrufen. Die Partikel *back* steht hinter dem Verb, wie bei ''zurück-rufen''.'
  en.a1.unit62.lesson03.teach.dialogue_line1:
    title: Mia nimmt ab
    gloss: 'Mia sagt: Hallo, hier ist Mia.'
    note: '*this is Mia* klingt am Telefon natürlich.'
  en.a1.unit62.lesson03.teach.dialogue_line2:
    title: Leila sagt, wer anruft
    gloss: 'Leila sagt: Hallo Mia, hier ist Leila.'
    note: Verwenden Sie *this is* für sich selbst am Telefon.
  en.a1.unit62.lesson03.teach.dialogue_line3:
    title: Leila versteht schlecht
    gloss: 'Leila sagt: Ich kann dich nicht gut hören.'
    note: '*can''t hear you well* bedeutet ''dich nicht gut hören können''.'
  en.a1.unit62.lesson03.teach.dialogue_line4:
    title: Leila bittet, langsam zu sprechen
    gloss: 'Leila sagt: Bitte sprich langsam.'
    note: '*Please speak slowly* ist eine höfliche Bitte.'
  en.a1.unit62.lesson03.teach.dialogue_line5:
    title: Mia nennt die Uhrzeit
    gloss: 'Mia sagt: Klar. Die Besprechung ist um vier Uhr.'
    note: '*at four* verwendet *at* für eine Uhrzeit.'
  en.a1.unit62.lesson03.teach.dialogue_line6:
    title: Leila bittet um Wiederholung
    gloss: 'Leila sagt: Bitte wiederhole das.'
    note: '*repeat that* bezieht sich auf das, was gerade gesagt wurde.'
  en.a1.unit62.lesson03.teach.dialogue_line7:
    title: Mia wiederholt vier Uhr
    gloss: 'Mia sagt: Vier Uhr.'
    note: '*Four o''clock* ist eine volle Uhrzeit.'
  en.a1.unit62.lesson03.teach.dialogue_line8:
    title: Leila ruft später zurück
    gloss: 'Leila sagt: Danke. Ich rufe später zurück.'
    note: '*I''ll* ist die Kurzform von *I will*.'
  en.a1.unit62.lesson04.teach.phone_note:
    title: Telefonnachricht
    gloss: 'Telefonnachricht: Mia hat um 3:00 Uhr angerufen. Besprechung in Raum 5. Bitte zurückrufen.'
    note: Die Nachricht nennt, wer angerufen hat, die Uhrzeit, den Raum und was zu tun ist.
  en.a1.unit62.lesson04.teach.reading_passage:
    title: 'Text: Ein kurzes Telefongespräch'
    gloss: 'Ein kurzes Telefongespräch: Mia rief Leila am Nachmittag an. Der Ton war nicht klar, deshalb bat Leila Mia, langsam zu sprechen. Mia sagte, dass die Besprechung um vier Uhr in Raum 5 sei. Leila bat Mia, die Uhrzeit zu wiederholen. Später schrieb Leila eine Telefonnachricht. In der Nachricht stand, dass Mia um 3:00 Uhr angerufen hatte und um Rückruf bat.'
    note: '*called* ist die Vergangenheitsform von *call*.'
