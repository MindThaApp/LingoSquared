teaching:
  en.a2.unit40.lesson01.teach.order: {title: "order", gloss: "Bestellung", note: "*order* ist die Bestellung selbst. Als Verb bedeutet *to order* bestellen.", example_gloss: "Meine Bestellung kam zwei Tage zu spät."}
  en.a2.unit40.lesson01.teach.delivery: {title: "delivery", gloss: "Lieferung", note: "*delivery* ist der Moment, in dem Ihre Bestellung zu Ihnen nach Hause gebracht wird.", example_gloss: "Die Lieferung kam am Dienstagvormittag."}
  en.a2.unit40.lesson01.teach.parcel: {title: "parcel", gloss: "Paket", note: "*parcel* ist das verpackte Paket, das an Ihrer Tür abgegeben wird.", example_gloss: "Das Paket wurde draußen vor meiner Tür abgestellt."}
  en.a2.unit40.lesson01.teach.damaged: {title: "damaged", gloss: "beschädigt", note: "*damaged* sagt, dass etwas unterwegs beschädigt wurde, aber vielleicht noch funktioniert. Meist sagt man es über die Verpackung.", example_gloss: "Der Karton war beschädigt, als er ankam."}
  en.a2.unit40.lesson01.teach.broken: {title: "broken", gloss: "kaputt", note: "*broken* ist stärker als *damaged*: Die Sache funktioniert nicht mehr.", example_gloss: "Die Lampe im Paket war kaputt."}
  en.a2.unit40.lesson01.teach.replacement: {title: "replacement", gloss: "Ersatz, Ersatzlieferung", note: "*replacement* ist ein neues Exemplar anstelle des kaputten. *refund* ist die Rückerstattung des Geldes.", example_gloss: "Ich habe um Ersatz gebeten und nicht um mein Geld zurück."}
  en.a2.unit40.lesson01.teach.grammar_arrived: {title: "arrived und has not arrived yet", gloss: "Meine Bestellung ist gestern angekommen. Meine Bestellung ist noch nicht angekommen.", note: "*arrived* verwenden Sie mit einem Zeitpunkt in der Vergangenheit. *has not arrived yet* sagt, dass Sie jetzt immer noch darauf warten."}

  en.a2.unit40.lesson02.teach.report_order_problem: {title: "Sagen, wofür Sie anrufen", gloss: "Ich möchte ein Problem mit meiner Bestellung melden.", note: "*I'd like to report a problem with ...* ist dieselbe höfliche Form wie bei der undichten Stelle in Einheit 29."}
  en.a2.unit40.lesson02.teach.lamp_arrived_broken: {title: "Sagen, was nicht stimmt", gloss: "Die Lampe ist kaputt angekommen.", note: "*arrived broken* bedeutet: Sie war schon kaputt, als sie ankam."}
  en.a2.unit40.lesson02.teach.ask_for_replacement: {title: "Zwischen Ersatz und Rückerstattung wählen", gloss: "Könnte ich stattdessen Ersatz bekommen statt mein Geld zurück?", note: "*instead of* stellt zwei Möglichkeiten gegenüber: Sie wählen die erste, nicht die zweite."}
  en.a2.unit40.lesson02.teach.my_order_number: {title: "Ihre Bestellnummer nennen", gloss: "Meine Bestellnummer ist 8154.", note: "Nennen Sie Ihre Bestellnummer gleich, wenn danach gefragt wird; damit findet der Mitarbeiter Ihre Bestellung."}
  en.a2.unit40.lesson02.teach.grammar_instead_of: {title: "instead of zum Auswählen", gloss: "Könnte ich Ersatz bekommen statt einer Rückerstattung? Ich hätte gern mein Geld zurück statt eines Umtauschs.", note: "Nach *instead of* steht ein Nomen oder eine -ing-Form (*instead of a refund*, *instead of getting a refund*), nie die Grundform des Verbs: nicht *instead of get a refund*."}

  en.a2.unit40.lesson03.teach.box: {title: "box", gloss: "Karton, Schachtel", note: "*box* ist der Karton, in dem Ihre Bestellung steckt. *parcel* ist das ganze Paket, wie es geliefert wird.", example_gloss: "Die Lampe war in einem großen Karton."}
  en.a2.unit40.lesson03.teach.return_message: {title: "Die Antwort des Shops", gloss: "Vielen Dank für Ihre Nachricht. Es tut uns leid, dass Ihre Lampe kaputt angekommen ist. Bitte legen Sie die Lampe zurück in den Karton und bringen Sie sie zur Post. Innerhalb von drei Werktagen wird eine neue Lampe verschickt. Bestellnummer 8154.", note: "Eine Antwort vom Kundenservice nennt immer: das Problem, was Sie tun sollen und was der Shop tun wird."}
  en.a2.unit40.lesson03.teach.put_it_back_in_the_box: {title: "Was Sie mit der kaputten Lampe tun sollen", gloss: "Bitte legen Sie die Lampe zurück in den Karton und bringen Sie sie zur Post.", note: "*put ... back in ...* bedeutet, etwas dorthin zurückzulegen, wo es hergekommen ist."}

  en.a2.unit40.lesson04.teach.q_report_a_problem: {title: "Leila ruft den Online-Shop an", gloss: "Leila sagt: Guten Tag, ich möchte ein Problem mit meiner Bestellung melden.", note: "Am Telefon sagen Sie gleich, wofür Sie anrufen."}
  en.a2.unit40.lesson04.teach.a_what_is_the_problem: {title: "Der Mitarbeiter fragt nach", gloss: "Der Mitarbeiter sagt: Das tut mir leid zu hören. Was ist das Problem?", note: "*I'm sorry to hear that* ist die feste, höfliche Reaktion eines Mitarbeiters auf schlechte Nachrichten."}
  en.a2.unit40.lesson04.teach.q_lamp_broken_box_damaged: {title: "Leila erklärt das Problem", gloss: "Leila sagt: Die Lampe ist kaputt angekommen. Der Karton war beschädigt.", note: "Achten Sie auf den Unterschied: Der Karton ist *damaged*, die Lampe ist *broken*."}
  en.a2.unit40.lesson04.teach.a_ask_order_number: {title: "Der Mitarbeiter fragt nach der Bestellnummer", gloss: "Der Mitarbeiter sagt: Verstehe. Könnten Sie mir Ihre Bestellnummer nennen?", note: "Dieselbe indirekte Frageform *Could you tell me ...?* wie in Einheit 39."}
  en.a2.unit40.lesson04.teach.q_order_number_8154: {title: "Leila nennt ihre Bestellnummer", gloss: "Leila sagt: Meine Bestellnummer ist 8154.", note: "Derselbe Satz wie in Lektion 2."}
  en.a2.unit40.lesson04.teach.a_refund_or_replacement: {title: "Der Mitarbeiter bietet zwei Möglichkeiten an", gloss: "Der Mitarbeiter sagt: Vielen Dank. Möchten Sie Ihr Geld zurück oder Ersatz?", note: "*or* stellt hier zwei Möglichkeiten nebeneinander; Sie wählen eine davon."}
  en.a2.unit40.lesson04.teach.q_replacement_please: {title: "Leila wählt den Ersatz", gloss: "Leila sagt: Könnte ich stattdessen Ersatz bekommen statt mein Geld zurück?", note: "Dieselbe Frage wie in Lektion 2."}
  en.a2.unit40.lesson04.teach.a_new_lamp_three_days: {title: "Der Mitarbeiter regelt es", gloss: "Der Mitarbeiter sagt: Selbstverständlich. Innerhalb von drei Werktagen wird eine neue Lampe verschickt.", note: "Dieselbe Zusage wie in der Nachricht in Lektion 3."}
  en.a2.unit40.lesson04.teach.q_thank_you: {title: "Leila bedankt sich beim Mitarbeiter", gloss: "Leila sagt: Vielen herzlichen Dank.", note: "*very much* macht das Danken etwas nachdrücklicher."}

