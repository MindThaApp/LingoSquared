    gloss: 'Der Mitarbeiter sagt: Ja, du kannst diese Karte benutzen.'
    note: '*Yes* bedeutet ja; *that card* bezieht sich auf Leilas Karte.'
  en.a1.unit59.lesson03.teach.dialogue_line5:
    title: Mia will ihren Kontostand prüfen
    gloss: 'Mia sagt: Ich möchte meinen Kontostand prüfen.'
    note: '*want to check* verwendet *to* vor dem zweiten Verb.'
  en.a1.unit59.lesson03.teach.dialogue_line6:
