    note: '*helpful* bedeutet hilfreich oder nützlich.'
  en.a1.unit59.lesson04.teach.bank_notice:
    title: Bankmitteilung
    gloss: 'Bankmitteilung: Geöffnet von 9.00 bis 16.00 Uhr. Geldautomat draußen. Abhebelimit heute: $100. Karten werden akzeptiert.'
    note: Die Mitteilung nennt die Öffnungszeiten, den Standort des Geldautomaten und das Limit.
  en.a1.unit59.lesson04.teach.reading_passage:
    title: 'Text: Ein kurzer Besuch bei der Bank'
    gloss: 'Ein kurzer Besuch bei der Bank: Eines Morgens gingen Mia und Leila zusammen zur Bank. Mia wollte ihren Kontostand prüfen, und Leila brauchte Bargeld. Der Mitarbeiter sagte, der Geldautomat sei draußen. Leila benutzte ihre Karte und hob zwanzig Dollar ab. Mia gab ihre PIN ein und prüfte ihren Kontostand. Bevor sie gingen, lasen sie die Mitteilung. Die Bank war von 9.00 bis 16.00 Uhr geöffnet, und das Bargeldlimit betrug $100. Mia sagte, der Besuch sei einfach gewesen.'
    note: '*took out* ist die Vergangenheitsform von *take out* in der Bedeutung Geld abheben.'
