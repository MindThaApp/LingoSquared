teaching:
  en.b1.unit14.lesson01.teach.would_it_be_possible_to: {title: "would it be possible to", gloss: "wäre es möglich, zu", note: "*would it be possible to* fragt höflich, ob etwas grundsätzlich möglich ist.", example_gloss: "Wäre es möglich, das Meeting auf Donnerstag zu verschieben?"}
  en.b1.unit14.lesson01.teach.i_was_wondering_if: {title: "I was wondering if", gloss: "ich habe mich gefragt, ob", note: "*I was wondering if* macht eine Bitte indirekt und vorsichtig.", example_gloss: "Ich habe mich gefragt, ob du meinen Bericht heute durchsehen könntest."}
  en.b1.unit14.lesson01.teach.could_we_possibly: {title: "could we possibly", gloss: "könnten wir vielleicht", note: "*could we possibly* bittet höflich um etwas, das man gemeinsam tun würde.", example_gloss: "Könnten wir das Meeting vielleicht fünf Minuten später beginnen?"}
  en.b1.unit14.lesson01.teach.i_would_appreciate_it_if: {title: "I would appreciate it if", gloss: "ich wäre dankbar, wenn", note: "*I would appreciate it if* sagt, dass man dankbar wäre, wenn jemand etwas tut.", example_gloss: "Ich wäre dankbar, wenn du das Protokoll bald schicken könntest."}
  en.b1.unit14.lesson01.teach.agenda: {title: "agenda", gloss: "Tagesordnung", note: "*agenda* bedeutet eine Liste von Themen, die in einem Meeting besprochen werden sollen.", example_gloss: "Daniel hat der Tagesordnung noch einen Punkt hinzugefügt."}
  en.b1.unit14.lesson01.teach.follow_up: {title: "follow up", gloss: "nachfassen, sich wieder melden", note: "*follow up* bedeutet, nach einem Meeting oder einer Aufgabe erneut Kontakt aufzunehmen.", example_gloss: "Mia fasst nach dem Meeting per E-Mail nach."}

  en.b1.unit14.lesson02.teach.move_meeting_thursday: {title: "would it be possible to + Verb", gloss: "Wäre es möglich, das Meeting auf Donnerstag zu verschieben?", note: "*would it be possible to* + Grundform fragt höflich nach einer Änderung."}
  en.b1.unit14.lesson02.teach.review_report_today: {title: "I was wondering if + could", gloss: "Ich habe mich gefragt, ob du meinen Bericht heute durchsehen könntest.", note: "*I was wondering if you could* ist eine indirekte, höfliche Art zu fragen."}
  en.b1.unit14.lesson02.teach.grammar_softened_requests: {title: "Abgeschwächte Bitten bei der Arbeit", gloss: "Verwenden Sie in förmlichen Bitten bei der Arbeit eine abgeschwächte Konditionalform wie Would it be possible to... oder I was wondering if... statt eines direkten Befehls. Diese Formen klingen höflicher als Move the meeting oder Review my report.", note: "Form: Verwenden Sie eine abgeschwächte Konditionalform statt eines direkten Befehls."}

  en.b1.unit14.lesson03.teach.budget_update: {title: "budget update", gloss: "Budget-Update", note: "*budget update* bedeutet einen Bericht darüber, wie Geld ausgegeben wird.", example_gloss: "Daniel hat das Budget-Update für das Meeting vorbereitet."}
  en.b1.unit14.lesson03.teach.afterward: {title: "afterward", gloss: "danach, anschließend", note: "*afterward* bedeutet zeitlich nach etwas anderem.", example_gloss: "Das Protokoll können wir danach durchgehen."}
  en.b1.unit14.lesson03.teach.reading_passage: {title: "Lesetext: eine Nachricht vor dem Meeting", gloss: "Hallo Daniel, ich hoffe, es geht dir gut. Wäre es möglich, das Budget-Update auf die Tagesordnung für das morgige Meeting zu setzen? Ich wäre dankbar, wenn du die aktuellen Zahlen mitbringen könntest. Könnten wir vielleicht zehn Minuten früher anfangen, damit wir danach Zeit für Fragen haben? Danke, Mia", note: "Eine kurze, professionelle Nachricht mit abgeschwächten Bitten."}

  en.b1.unit14.lesson04.teach.q_start_budget_update: {title: "Die Teamleitung eröffnet das Meeting höflich", gloss: "Die Teamleitung sagt: Guten Morgen, Mia. Wäre es möglich, heute mit dem Budget-Update zu beginnen?", note: "*would it be possible to* fragt höflich nach der Reihenfolge im Meeting."}
  en.b1.unit14.lesson04.teach.a_add_new_client: {title: "Mia macht eine zusätzliche Bitte", gloss: "Mia sagt: Natürlich. Ich habe mich gefragt, ob wir auch den neuen Kunden auf die Tagesordnung setzen könnten.", note: "*I was wondering if we could* ist eine indirekte, höfliche Art, etwas vorzuschlagen."}
  en.b1.unit14.lesson04.teach.q_keep_thirty_minutes: {title: "Die Teamleitung bittet um ein kurzes Meeting", gloss: "Die Teamleitung sagt: Gute Idee. Könnten wir dieses Meeting vielleicht unter dreißig Minuten halten?", note: "*could we possibly* bittet höflich um etwas, das beide gemeinsam tun."}
  en.b1.unit14.lesson04.teach.a_questions_in_advance: {title: "Mia bittet um etwas für das nächste Mal", gloss: "Mia sagt: Ich gebe mein Bestes. Ich wäre dankbar, wenn alle beim nächsten Mal vorab Fragen schicken würden.", note: "*I would appreciate it if* sagt, dass man dankbar wäre."}
  en.b1.unit14.lesson04.teach.q_fair_request_followup: {title: "Die Teamleitung stimmt zu und verspricht nachzufassen", gloss: "Die Teamleitung sagt: Das ist eine berechtigte Bitte. Ich schicke vor dem nächsten Meeting eine Erinnerung.", note: "*follow up* bedeutet hier: später darauf zurückkommen."}
  en.b1.unit14.lesson04.teach.a_send_updated_agenda: {title: "Mia schließt mit einer Bestätigung", gloss: "Mia sagt: Danke. Ich schicke die aktualisierte Tagesordnung heute Nachmittag.", note: "Ein kurzer, höflicher Abschluss des Gesprächs."}

