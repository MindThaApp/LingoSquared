  en.a1.unit49.lesson02.teach.this_goes_in_the_recycling_bin:
    title: This goes in the recycling bin.
    gloss: Das kommt in die Recyclingtonne.
    note: '*This goes in the recycling bin.* bedeutet: Das kommt in die Recyclingtonne.'
  en.a1.unit49.lesson02.teach.the_green_bin_is_for_glass:
    title: The green bin is for glass.
    gloss: Die grüne Tonne ist für Glas.
    note: '*is for ...* bedeutet "ist für ..." und sagt, wofür etwas gedacht ist.'
  en.a1.unit49.lesson02.teach.can_you_take_out_the_trash:
    title: Can you take out the trash?
    gloss: Kannst du den Müll rausbringen?
    note: '*take out* ist ein trennbares englisches Verb: take out the trash und take the trash out sind beide richtig. Im Deutschen steht die Partikel dagegen immer am Ende (den Müll rausbringen).'
  en.a1.unit49.lesson02.teach.collection_day_is_on_tuesday:
    title: Collection day is on Tuesday.
    gloss: Der Abholtag ist Dienstag.
    note: '*Collection day is on Tuesday.* bedeutet: Der Abholtag ist Dienstag.'
  en.a1.unit49.lesson02.teach.what_about_paper_and_food_waste:
    title: What about paper and food waste?
    gloss: Und was ist mit Papier und Bioabfall?
    note: '*What about ...?* bedeutet "Und was ist mit ...?" und wird verwendet, um nach etwas anderem zu fragen.'
  en.a1.unit49.lesson03.teach.dialogue_line1:
    title: Mias Warnung
    gloss: 'Mia sagt: Warte, das Glas gehört nicht in den Müll!'
    note: '*doesn''t go in the trash* bedeutet: gehört nicht in den Müll.'
  en.a1.unit49.lesson03.teach.dialogue_line2:
    title: Daniels Entschuldigung
    gloss: 'Daniel sagt: Oh nein, tut mir leid! In welche Tonne kommt es?'
    note: '*Which bin does it go in?* wiederholt die Frageform, die Sie gerade gelernt haben.'
  en.a1.unit49.lesson03.teach.dialogue_line3:
    title: Mia erklärt
    gloss: 'Mia sagt: Es kommt in die grüne Tonne. Wir recyceln hier Glas.'
    note: '*We recycle glass here.* bedeutet: Wir recyceln hier Glas.'
  en.a1.unit49.lesson03.teach.dialogue_line4:
    title: Daniels Frage
    gloss: 'Daniel fragt: Und was ist mit Papier und Bioabfall?'
    note: Wiederholung der Frage *What about ...?*, die Sie schon kennen.
  en.a1.unit49.lesson03.teach.dialogue_line5:
    title: Mias Erklärung
    gloss: 'Mia sagt: Papier kommt in die blaue Tonne, und Bioabfall kommt in die braune Tonne.'
    note: '*goes in ..., and ... goes in ...* wiederholt dieselbe Struktur für zwei verschiedene Arten von Abfall.'
  en.a1.unit49.lesson03.teach.dialogue_line6:
    title: Daniels Frage zum Abholtag
    gloss: 'Daniel sagt: Alles klar. Wann ist der Abholtag?'
    note: '*Got it.* ist eine umgangssprachliche Art zu sagen: Verstanden.'
  en.a1.unit49.lesson03.teach.dialogue_line7:
    title: "Mias Antwort"
    gloss: 'Mia sagt: Die Recyclingtonnen kommen dienstags raus, und der Müll kommt freitags raus.'
    note: 'Beachten Sie: Mia nennt hier zwei verschiedene Tage für zwei verschiedene Abfallarten -- Dienstag fürs Recycling, Freitag für den normalen Müll.'
  en.a1.unit49.lesson03.teach.dialogue_line8:
    title: Daniels Versprechen
    gloss: 'Daniel sagt: Danke! Ich sortiere nächstes Mal alles richtig.'
    note: '*I''ll sort everything correctly next time.* bedeutet: Ich sortiere nächstes Mal alles richtig.'
  en.a1.unit49.lesson04.teach.reading_passage:
    title: Text darüber, wie Mülltrennung funktioniert
    gloss: 'So trennen Sie Ihren Müll: In vielen Mehrfamilienhäusern gibt es verschiedene Tonnen für verschiedene Arten von Abfall. Glas kommt meist in die grüne Tonne, und Papier kommt in die blaue Tonne. Bioabfall kommt in die braune Tonne, und alles andere kommt in die schwarze Tonne für den Restmüll. Es hilft, Ihren Abholtag zu kennen, denn die Tonnen werden nur einmal pro Woche geleert. Daniel übt Rezepte aus dem Kochbuch, das er in der Bibliothek ausgeliehen hat, und er kocht oft mit Mia in ihrer Wohnung. Gestern Abend hat er ein Rezept aus dem Kochbuch gekocht, und danach hätte er fast ein Glas in den Restmüll geworfen. Mia hielt ihn auf und zeigte ihm, wie in ihrem Haus der Müll getrennt wird. Sie erklärte, dass die Recyclingtonnen dienstags rauskommen und der Restmüll freitags. Daniel war dankbar und sagte, er werde ab jetzt alles richtig sortieren.'
    note: '*almost put a glass jar in the regular trash* bedeutet: hätte fast ein Glas in den Restmüll geworfen.'
