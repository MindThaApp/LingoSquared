review: {status: "reviewed", required_next_reviewer: null, notes: "Ninth de-en overlay, authored independently with zero reference to any other X-en overlay pairing with this same realization. Pairs with the existing, already-reviewed docs/content/realizations/en/a1_unit09_places.yaml (status: reviewed). correct_option/distractors are English throughout, matching de-en/a1_unit01-08.yaml precedent -- multiple_choice distractors for the preposition-choice exercises (choose_next_to/choose_across_from/choose_behind) are full alternate sentences swapping in a different preposition, matching each exercise's own tested_text shape. matching_pairs (match_places) copied verbatim from the realization's own prompt.pairs -- already 10 pairs, well past the §16 floor. FLAGGING A REAL REALIZATION-SIDE BUG, not fixed here (shared content used by every X-en pairing, same 'flag don't unilaterally fix' precedent as unit06's match_family_words note): lesson02.exercise03.order_between's word_bank is `[between, the, bank, and, park, The, pharmacy, is]` -- only ONE 'the' tile -- but its own tested_text/teaching-card text is 'The pharmacy is between the bank and the park' (TWO 'the's). The word_bank as authored cannot physically assemble the full tested_text in the frontend's tile UI. This overlay's order_between accepted_answers is therefore authored as the sequence the ACTUAL given tiles can build (`The pharmacy is between the bank and park`, dropping the second 'the' -- grammatical, if slightly less natural than repeating it) rather than the unreachable 9-word form, so the exercise stays winnable; flagging for whoever owns a cross-cutting realization fix to add the missing 'the' tile so future re-authoring can use the fuller phrasing. Every other word_order (order_where_question, order_excuse_me) re-derived from tested_text and confirmed to exactly match its own word_bank token count. §12: reply_as_leila/speak_directions (3-clause reply: location, distance, precise location) each carry a period-punctuated, a comma/and-joined, and the exact space-joined tested_text form. dialogue_response answers reply-only (reply_location, reply_as_leila), matching the en.a1.unit07 reply_anything_else precedent -- tested_text includes the prompt for reference/audio, accepted_answers does not echo it. Every German word embedded in English-language feedback/notes is asterisk-wrapped per §15. §19: paired realization not yet retrofitted (schema_version still 1.0, 0 example: blocks) -- all 5 kind:vocabulary cards (bank/hospital/pharmacy/park/restaurant) have title/gloss/note but deliberately no example_gloss; flag for follow-up once the English retrofit reaches unit09. Review 2026-10-19: 14 fixes - vocabulary card titles lowercased to match lowercase targets; restaurant note said the spelling was only almost the same (it is identical); q_pharmacy note called Leila einen Fremden (wrong gender, and Daniel and Leila know each other since unit02) -> neutral, lesson title -> Jemanden nach einem Ort fragen; listen_place distractor school untaught -> hospital/restaurant/library; match_places instruction said Taetigkeit and pharmacy's right was the bare translation Apotheke -> Beschreibung / Medikamente kaufen; choose_behind instruction (hinten an der Bank) unidiomatic -> auf der Rueckseite der Bank; listen_where_question had statement distractors under die Frage plus a punctuation tell -> taught questions; listen_location_answer said noch einmal for a new audio and had question distractors -> location statements; write_not_far underdetermined -> pinned as a No-answer to Is it far from here?, variants added; listen_pharmacy_location distractor No, it's not far is Leila's own line and two locations were correct -> asks for her answer to the first question, location distractors; listen_between distractors were lines heard in the audio -> pinned to Leila's final location, unheard location distractors; choose_far_answer distractors were Leila's line / untaught very -> Yes-far answers; comma before und in reply_as_leila/speak_directions instructions and feedback; accepted answers widened (write_restaurant, write_in_front_of, reply_location, write_not_far, reply_as_leila, speak_directions, punctuated correct options). Stale notes above: order_between's word_bank now has both the tiles and the cards have example_gloss. NATIVE FLAGS: none."}

course:
  title: "Englisch A1"
  description: "Englisch auf A1-Niveau lernen, für Begrüßungen und kurze Gespräche im Alltag, mit ausführlichen deutschen Erklärungen."

units:
  en.a1.unit09.places: {title: "Alltägliche Orte und ihre Lage"}

lessons:
  en.a1.unit09.lesson01.common_places: {title: "Übliche Orte in der Stadt"}
  en.a1.unit09.lesson02.location_prepositions: {title: "Sagen, wo sich etwas befindet"}
  en.a1.unit09.lesson03.asking_where: {title: "Fragen, wo sich etwas befindet"}
  en.a1.unit09.lesson04.asking_directions_dialogue: {title: "Jemanden nach einem Ort fragen"}

teaching:
  en.a1.unit09.lesson01.teach.bank: {title: "bank", gloss: "Bank", note: "*bank* bedeutet Bank (das Geldinstitut).", example_gloss: "Ich muss zur Bank gehen."}
  en.a1.unit09.lesson01.teach.hospital: {title: "hospital", gloss: "Krankenhaus", note: "*hospital* bedeutet Krankenhaus.", example_gloss: "Mein Freund ist im Krankenhaus."}
  en.a1.unit09.lesson01.teach.pharmacy: {title: "pharmacy", gloss: "Apotheke", note: "*pharmacy* bedeutet Apotheke.", example_gloss: "Die Apotheke ist heute geöffnet."}
  en.a1.unit09.lesson01.teach.park: {title: "park", gloss: "Park", note: "*park* bedeutet Park.", example_gloss: "Wir spazieren gern im Park."}
  en.a1.unit09.lesson01.teach.restaurant: {title: "restaurant", gloss: "Restaurant", note: "*restaurant* wird im Englischen genauso geschrieben wie im Deutschen, nur klein.", example_gloss: "Dieses Restaurant hat gutes Essen."}

  en.a1.unit09.lesson02.teach.next_to: {title: "The bank is next to the park.", gloss: "Die Bank ist neben dem Park.", note: "*next to* bedeutet 'neben.'"}
  en.a1.unit09.lesson02.teach.across_from: {title: "The pharmacy is across from the hospital.", gloss: "Die Apotheke ist gegenüber dem Krankenhaus.", note: "*across from* bedeutet 'gegenüber.'"}
  en.a1.unit09.lesson02.teach.between: {title: "The pharmacy is between the bank and the park.", gloss: "Die Apotheke liegt zwischen der Bank und dem Park.", note: "*between X and Y* bedeutet 'zwischen X und Y.'"}
  en.a1.unit09.lesson02.teach.behind: {title: "The restaurant is behind the bank.", gloss: "Das Restaurant ist hinter der Bank.", note: "*behind* bedeutet 'hinter.'"}
  en.a1.unit09.lesson02.teach.in_front_of: {title: "The park is in front of the hospital.", gloss: "Der Park liegt vor dem Krankenhaus.", note: "*in front of* bedeutet 'vor.'"}

  en.a1.unit09.lesson03.teach.where_is_the_bank: {title: "Where is the bank?", gloss: "Wo ist die Bank?", note: "*Where is...?* fragt nach dem Ort einer Sache."}
  en.a1.unit09.lesson03.teach.its_next_to: {title: "It's next to the park.", gloss: "Sie ist neben dem Park.", note: "*It's* ersetzt den Namen des Ortes (hier: die Bank)."}
  en.a1.unit09.lesson03.teach.is_it_far: {title: "Is it far from here?", gloss: "Ist es weit von hier?", note: "*far from here* bedeutet 'weit von hier entfernt.'"}
  en.a1.unit09.lesson03.teach.not_far: {title: "No, it's not far.", gloss: "Nein, es ist nicht weit.", note: "Eine einfache, beruhigende Antwort auf die Entfernungsfrage."}

  en.a1.unit09.lesson04.teach.excuse_me: {title: "Excuse me, where is the pharmacy?", gloss: "Entschuldigung, wo ist die Apotheke?", note: "*Excuse me* wird verwendet, um einen Fremden höflich anzusprechen."}
  en.a1.unit09.lesson04.teach.q_pharmacy: {title: "Frage von Daniel", gloss: "Daniel: Entschuldigung, wo ist die Apotheke?", note: "Daniel spricht Leila mit *Excuse me* höflich an."}
  en.a1.unit09.lesson04.teach.a_across: {title: "Antwort von Leila", gloss: "Leila: Sie ist gegenüber dem Krankenhaus.", note: "Leila nennt die Lage relativ zum Krankenhaus."}
  en.a1.unit09.lesson04.teach.q_far: {title: "Nachfrage von Daniel", gloss: "Daniel: Ist es weit von hier?", note: "Daniel möchte wissen, ob er zu Fuß hingehen kann."}
  en.a1.unit09.lesson04.teach.a_not_far_between: {title: "Genauere Antwort von Leila", gloss: "Leila: Nein, es ist nicht weit. Sie liegt zwischen der Bank und dem Park.", note: "Leila beruhigt Daniel und gibt eine genauere Lagebeschreibung."}

exercises:
  en.a1.unit09.lesson01.exercise01.listen_place:
    instruction: "Hören Sie zu und wählen Sie den genannten Ort."
    correct_option: "pharmacy"
    distractors: ["hospital", "restaurant", "library"]
    accepted_answers: [{value: "pharmacy", status: "correct"}]
    feedback: "*pharmacy* bedeutet Apotheke."
  en.a1.unit09.lesson01.exercise02.choose_hospital:
    instruction: "Wohin gehen Sie, wenn Sie sehr krank sind?"
    correct_option: "hospital"
    distractors: ["bank", "pharmacy", "restaurant"]
    accepted_answers: [{value: "hospital", status: "correct"}]
    feedback: "*hospital* bedeutet Krankenhaus."
  en.a1.unit09.lesson01.exercise03.choose_bank:
    instruction: "Wohin gehen Sie, um Geld zu bekommen?"
    correct_option: "bank"
    distractors: ["hospital", "pharmacy", "park"]
    accepted_answers: [{value: "bank", status: "correct"}]
    feedback: "*bank* bedeutet Bank."
  en.a1.unit09.lesson01.exercise04.match_places:
    instruction: "Verbinden Sie jedes englische Wort mit der passenden deutschen Beschreibung."
    pairs:
      - {left: "bank", right: "Geld abheben"}
      - {left: "hospital", right: "ärztliche Hilfe bekommen"}
      - {left: "pharmacy", right: "Medikamente kaufen"}
      - {left: "park", right: "öffentliche Grünfläche zum Spazierengehen"}
      - {left: "restaurant", right: "Ort, an dem jemand anderes eine Mahlzeit zubereitet"}
      - {left: "next to", right: "direkt daneben"}
      - {left: "between", right: "in der Mitte von zwei Dingen"}
      - {left: "behind", right: "auf der Rückseite von etwas"}
      - {left: "in front of", right: "direkt vor etwas"}
    accepted_answers:
      - value:
          - {left: "bank", right: "Geld abheben"}
          - {left: "hospital", right: "ärztliche Hilfe bekommen"}
          - {left: "pharmacy", right: "Medikamente kaufen"}
          - {left: "park", right: "öffentliche Grünfläche zum Spazierengehen"}
          - {left: "restaurant", right: "Ort, an dem jemand anderes eine Mahlzeit zubereitet"}
          - {left: "next to", right: "direkt daneben"}
          - {left: "between", right: "in der Mitte von zwei Dingen"}
          - {left: "behind", right: "auf der Rückseite von etwas"}
          - {left: "in front of", right: "direkt vor etwas"}
        status: "correct"
    feedback: "Jede Beschreibung gehört zu einem englischen Wort oder Ausdruck."
  en.a1.unit09.lesson01.exercise05.write_restaurant:
    instruction: "Schreiben Sie das Wort für einen Ort, an dem man eine Mahlzeit isst, die man nicht selbst gekocht hat."
    accepted_answers:
      - {value: "restaurant", status: "correct"}
      - {value: "restaurant.", status: "correct"}
      - {value: "a restaurant", status: "correct"}
    feedback: "*restaurant* bedeutet Restaurant."

  en.a1.unit09.lesson02.exercise01.choose_next_to:
    instruction: "Die Bank und der Park liegen direkt nebeneinander. Welcher Satz ist richtig?"
    correct_option: "The bank is next to the park."
    distractors: ["The bank is across from the park.", "The bank is between the park and the hospital.", "The bank is behind the park."]
    accepted_answers: [{value: "The bank is next to the park.", status: "correct"}]
    feedback: "*next to* bedeutet 'neben' -- *The bank is next to the park* heißt 'Die Bank ist neben dem Park.'"
  en.a1.unit09.lesson02.exercise02.choose_across_from:
    instruction: "Die Apotheke liegt auf der gegenüberliegenden Straßenseite vom Krankenhaus. Welcher Satz ist richtig?"
    correct_option: "The pharmacy is across from the hospital."
    distractors: ["The pharmacy is next to the hospital.", "The pharmacy is between the hospital and the bank.", "The pharmacy is behind the hospital."]
    accepted_answers: [{value: "The pharmacy is across from the hospital.", status: "correct"}]
    feedback: "*across from* bedeutet 'gegenüber' -- *The pharmacy is across from the hospital* heißt 'Die Apotheke ist gegenüber dem Krankenhaus.'"
  en.a1.unit09.lesson02.exercise03.order_between:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um zu sagen, dass die Apotheke zwischen der Bank und dem Park liegt."
    accepted_answers: [{value: ["The", "pharmacy", "is", "between", "the", "bank", "and", "the", "park"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *The pharmacy is between the bank and the park.*"
  en.a1.unit09.lesson02.exercise04.choose_behind:
    instruction: "Das Restaurant liegt auf der Rückseite der Bank, auf der von der Straße abgewandten Seite. Welcher Satz ist richtig?"
    correct_option: "The restaurant is behind the bank."
    distractors: ["The restaurant is in front of the bank.", "The restaurant is next to the bank.", "The restaurant is across from the bank."]
    accepted_answers: [{value: "The restaurant is behind the bank.", status: "correct"}]
    feedback: "*behind* bedeutet 'hinter' -- *The restaurant is behind the bank* heißt 'Das Restaurant ist hinter der Bank.'"
  en.a1.unit09.lesson02.exercise05.write_in_front_of:
    instruction: "Schreiben Sie, dass der Park direkt vor dem Krankenhaus liegt."
    accepted_answers:
      - {value: "The park is in front of the hospital", status: "correct"}
      - {value: "The park is in front of the hospital.", status: "correct"}
      - {value: "The park is directly in front of the hospital.", status: "correct"}
    feedback: "*The park is in front of the hospital* bedeutet 'Der Park liegt vor dem Krankenhaus.'"

  en.a1.unit09.lesson03.exercise01.listen_where_question:
    instruction: "Hören Sie zu und wählen Sie die Frage, die Sie hören."
    correct_option: "Where is the bank?"
    distractors: ["Is it far from here?", "How much is this?", "How old are you?"]
    accepted_answers: [{value: "Where is the bank", status: "correct"}, {value: "Where is the bank?", status: "correct"}]
    feedback: "*Where is the bank?* bedeutet 'Wo ist die Bank?'"
  en.a1.unit09.lesson03.exercise02.listen_location_answer:
    instruction: "Hören Sie zu und wählen Sie die Antwort, die Sie hören."
    correct_option: "It's next to the park."
    distractors: ["It's across from the park.", "It's behind the park.", "It's next to the bank."]
    accepted_answers: [{value: "It's next to the park", status: "correct"}, {value: "It's next to the park.", status: "correct"}]
    feedback: "*It's next to the park* bedeutet 'Sie ist neben dem Park.'"
  en.a1.unit09.lesson03.exercise03.order_where_question:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um zu fragen, wo die Bank ist."
    accepted_answers: [{value: ["Where", "is", "the", "bank"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *Where is the bank?*"
  en.a1.unit09.lesson03.exercise04.reply_location:
    instruction: "Jemand fragt: 'Where is the bank?' Antworten Sie, dass sie neben dem Park ist."
    accepted_answers:
      - {value: "It's next to the park.", status: "correct"}
      - {value: "It's next to the park", status: "correct"}
      - {value: "It is next to the park.", status: "correct"}
      - {value: "The bank is next to the park.", status: "correct"}
      - {value: "Next to the park.", status: "acceptable_with_note"}
    feedback: "*It's next to the park* bedeutet 'Sie ist neben dem Park.'"
  en.a1.unit09.lesson03.exercise05.write_not_far:
    instruction: "Jemand fragt: 'Is it far from here?' Antworten Sie mit Nein und sagen Sie, dass es nicht weit ist."
    accepted_answers:
      - {value: "No, it's not far", status: "correct"}
      - {value: "No, it's not far.", status: "correct"}
      - {value: "No, it is not far.", status: "correct"}
      - {value: "No, it isn't far.", status: "correct"}
      - {value: "It's not far.", status: "acceptable_with_note"}
    feedback: "*No, it's not far* bedeutet 'Nein, es ist nicht weit.'"

  en.a1.unit09.lesson04.exercise01.listen_pharmacy_location:
    instruction: "Hören Sie das Gespräch. Was antwortet Leila auf Daniels erste Frage?"
    correct_option: "It's across from the hospital"
    distractors: ["It's next to the park.", "It's behind the hospital.", "It's next to the hospital."]
    accepted_answers: [{value: "It's across from the hospital", status: "correct"}]
    feedback: "Leila sagt: *It's across from the hospital* -- 'Sie ist gegenüber dem Krankenhaus.'"
  en.a1.unit09.lesson04.exercise02.listen_between:
    instruction: "Hören Sie noch einmal. Wie beschreibt Leila zum Schluss die genaue Lage der Apotheke?"
    correct_option: "It's between the bank and the park"
    distractors: ["It's behind the restaurant.", "It's between the bank and the hospital.", "It's next to the bank."]
    accepted_answers: [{value: "It's between the bank and the park", status: "correct"}]
    feedback: "*It's between the bank and the park* bedeutet 'Sie liegt zwischen der Bank und dem Park.'"
  en.a1.unit09.lesson04.exercise03.choose_far_answer:
    instruction: "Ist die Apotheke weit von Daniels Standort entfernt?"
    correct_option: "No, it's not far."
    distractors: ["Yes, it's far.", "Yes, it's far from here.", "Yes, it's far from the park."]
    accepted_answers: [{value: "No, it's not far.", status: "correct"}]
    feedback: "Leila sagt *No, it's not far* -- die Apotheke ist nicht weit."
  en.a1.unit09.lesson04.exercise04.order_excuse_me:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge für eine höfliche Frage nach der Apotheke."
    accepted_answers: [{value: ["Excuse", "me", "where", "is", "the", "pharmacy"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *Excuse me, where is the pharmacy?*"
  en.a1.unit09.lesson04.exercise05.reply_as_leila:
    instruction: "Antworten Sie als Leila auf Daniels Fragen: Sagen Sie, dass die Apotheke gegenüber dem Krankenhaus liegt, dass es nicht weit ist und dass sie zwischen der Bank und dem Park liegt."
    accepted_answers:
      - {value: "It's across from the hospital. No, it's not far. It's between the bank and the park.", status: "correct"}
      - {value: "It's across from the hospital, and no, it's not far, it's between the bank and the park.", status: "correct"}
      - {value: "It's across from the hospital No it's not far It's between the bank and the park", status: "correct"}
      - {value: "It is across from the hospital. No, it is not far. It is between the bank and the park.", status: "correct"}
      - {value: "It's across from the hospital. It's not far. It's between the bank and the park.", status: "correct"}
    feedback: "Eine vollständige Antwort nennt die Lage gegenüber dem Krankenhaus, bestätigt die geringe Entfernung und gibt die genaue Lage zwischen Bank und Park an."
  en.a1.unit09.lesson04.exercise06.speak_directions:
    instruction: "Antworten Sie laut als Leila auf Daniels Fragen: Sagen Sie, dass die Apotheke gegenüber dem Krankenhaus liegt, dass es nicht weit ist und dass sie zwischen der Bank und dem Park liegt."
    accepted_answers:
      - {value: "It's across from the hospital No it's not far It's between the bank and the park", status: "correct"}
      - {value: "It's across from the hospital. No, it's not far. It's between the bank and the park.", status: "correct"}
      - {value: "It's across from the hospital, no, it's not far, and it's between the bank and the park.", status: "correct"}
      - {value: "It is across from the hospital. No, it is not far. It is between the bank and the park.", status: "correct"}
      - {value: "It's across from the hospital. It's not far. It's between the bank and the park.", status: "correct"}
    feedback: "Diese vollständige Antwort deckt die Lage, die Entfernung und die genaue Position ab."
