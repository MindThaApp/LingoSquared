teaching:
  en.a1.unit24.lesson01.teach.bedroom:
    title: bedroom
    gloss: Schlafzimmer
    note: '*bedroom* bedeutet Schlafzimmer. Es ist aus *bed* (Bett) und *room* (Zimmer) zusammengesetzt, wird im Englischen aber getrennt gesprochen und betont.'
    example_gloss: Mein Schlafzimmer liegt neben dem Badezimmer.
  en.a1.unit24.lesson01.teach.kitchen:
    title: kitchen
    gloss: Küche
    note: '*kitchen* bedeutet Küche. Die Aussprache ist *KITCH-en*; das *t* wird nicht einzeln gesprochen.'
    example_gloss: Die Küche liegt neben dem Wohnzimmer.
  en.a1.unit24.lesson01.teach.bathroom:
    title: bathroom
    gloss: Badezimmer
    note: '*bathroom* bedeutet Badezimmer. In den USA ist es oft auch das Wort für die Toilette.'
    example_gloss: Das Badezimmer hat eine Dusche.
  en.a1.unit24.lesson01.teach.living_room:
    title: living room
    gloss: Wohnzimmer
    note: '*living room* bedeutet Wohnzimmer. Es sind zwei Wörter, anders als im deutschen Kompositum.'
    example_gloss: Wir sehen im Wohnzimmer fern.
  en.a1.unit24.lesson01.teach.garden:
    title: garden
    gloss: Garten
    note: '*garden* bedeutet Garten. In den USA sagt man für den Garten hinter dem Haus oft auch *yard*.'
    example_gloss: Es gibt keinen Garten, aber es gibt einen Balkon.
  en.a1.unit24.lesson01.teach.the_kitchen_is_a_room:
    title: This is the kitchen.
    gloss: Das ist die Küche.
    note: 'Mit *This is ...* zeigen Sie auf etwas. *the* steht für etwas Bestimmtes: die Küche dieser Wohnung.'
  en.a1.unit24.lesson02.teach.how_many_rooms:
    title: How many rooms are there?
    gloss: Wie viele Zimmer gibt es?
    note: Mit *How many...are there?* fragen Sie nach einer Anzahl. *many* steht bei zählbaren Dingen im Plural; *are* steht, weil *rooms* Plural ist.
  en.a1.unit24.lesson02.teach.there_is_a_kitchen:
    title: There's a small kitchen.
    gloss: Es gibt eine kleine Küche.
    note: Mit *There's...* (*there is*) sagen Sie, dass es irgendwo etwas gibt. Es entspricht dem deutschen 'es gibt'; bei mehreren Dingen heißt es *there are*.
  en.a1.unit24.lesson02.teach.next_to:
    title: next to
    gloss: neben
    note: '*next to* bedeutet neben. Es sind zwei Wörter und sie bleiben immer zusammen.'
    example_gloss: Der Stuhl steht neben dem Tisch.
  en.a1.unit24.lesson03.teach.apartment:
    title: apartment
    gloss: Wohnung
    note: '*apartment* bedeutet Wohnung (amerikanisch; britisch heißt es *flat*).'
    example_gloss: Daniels Wohnung hat zwei Schlafzimmer.
  en.a1.unit24.lesson03.teach.home_text:
    title: Text über eine Wohnung
    gloss: Meine Wohnung hat zwei Schlafzimmer und ein Badezimmer. Es gibt eine kleine Küche neben dem Wohnzimmer.
    note: In diesem kurzen Text beschreibt jemand seine Wohnung und nennt die Anzahl der Zimmer.
  en.a1.unit24.lesson04.teach.favorite_room:
    title: What's your favorite room?
    gloss: Was ist dein Lieblingszimmer?
    note: '*favorite* bedeutet Lieblings-, bevorzugt.'
  en.a1.unit24.lesson04.teach.q_tell_me_about:
    title: Nach der Wohnung fragen
    gloss: 'Leila sagt: Erzähl mir von deiner Wohnung.'
    note: Mit *Tell me about...* bitten Sie jemanden, etwas zu beschreiben.
  en.a1.unit24.lesson04.teach.a_two_bed_one_bath:
    title: Daniels Antwort
    gloss: 'Daniel sagt: Sie hat zwei Schlafzimmer und ein Badezimmer. Es gibt eine kleine Küche neben dem Wohnzimmer.'
    note: Daniel nennt die Anzahl der Zimmer und sagt, wo die Küche ist.
  en.a1.unit24.lesson04.teach.q_is_there_garden:
    title: Nach einem Garten fragen
    gloss: 'Leila fragt: Gibt es einen Garten?'
    note: Mit *Is there...?* fragen Sie, ob etwas vorhanden ist.
  en.a1.unit24.lesson04.teach.a_no_but_balcony:
    title: Daniels Antwort
    gloss: 'Daniel sagt: Nein, gibt es nicht, aber es gibt einen kleinen Balkon.'
    note: Daniel sagt zuerst nein und nennt dann eine Alternative.
  en.a1.unit24.lesson04.teach.a_living_room_near_kitchen:
    title: Daniels letzte Antwort
    gloss: 'Daniel sagt: Mein Lieblingszimmer ist das Wohnzimmer. Es ist in der Nähe der Küche, deshalb kann man dort leicht zu Abend essen.'
    note: Daniel nennt sein Lieblingszimmer und gibt den Grund.
