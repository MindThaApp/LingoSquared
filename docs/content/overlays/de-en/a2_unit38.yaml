teaching:
  en.a2.unit38.lesson01.teach.reschedule: {title: "reschedule", gloss: "verschieben", note: "*reschedule* bedeutet, einen Termin auf einen anderen Zeitpunkt zu verschieben.", example_gloss: "Ich muss die Reparatur verschieben, weil ich dann bei der Arbeit bin."}
  en.a2.unit38.lesson01.teach.neighbor: {title: "neighbor", gloss: "Nachbar, Nachbarin", note: "*neighbor* ist die Person, die neben Ihnen wohnt. Das englische Wort sagt nichts darüber, ob es ein Mann oder eine Frau ist.", example_gloss: "Meine Nachbarin kann dem Klempner die Tür aufmachen."}
  en.a2.unit38.lesson01.teach.key: {title: "key", gloss: "Schlüssel", note: "*key* ist der kleine Metallgegenstand, mit dem man die Tür aufschließt.", example_gloss: "Ich lasse den Schlüssel bei meiner Nachbarin."}
  en.a2.unit38.lesson01.teach.leak: {title: "leak", gloss: "undichte Stelle, Leck", note: "*leak* ist hier ein Nomen: die undichte Stelle selbst, aus der Wasser austritt. Das Verb *to leak* bedeutet lecken bzw. tropfen.", example_gloss: "Die undichte Stelle unter meiner Spüle wird immer schlimmer."}
  en.a2.unit38.lesson01.teach.fixed: {title: "fixed", gloss: "repariert", note: "*fixed* ist das Partizip von *to fix* (reparieren) und bedeutet, dass etwas nicht mehr kaputt ist.", example_gloss: "Die Spüle ist jetzt repariert und das Wasser läuft nicht mehr aus."}
  en.a2.unit38.lesson01.teach.afternoon: {title: "afternoon", gloss: "Nachmittag", note: "*afternoon* ist der Teil des Tages nach dem Mittag; der Vormittag heißt *morning*.", example_gloss: "Der Klempner kam am Nachmittag, nicht am Vormittag."}
  en.a2.unit38.lesson01.teach.grammar_cant_wont: {title: "can't und won't, wenn etwas nicht klappt", gloss: "Ich kann zwischen 14 und 16 Uhr nicht zu Hause sein. Am Nachmittag bin ich nicht zu Hause.", note: "*can't* sagt, dass etwas nicht möglich ist. *won't* sagt, dass es in der Zukunft einfach nicht so sein wird."}

  en.a2.unit38.lesson02.teach.need_to_reschedule: {title: "Sagen, dass Sie den Termin verschieben möchten", gloss: "Ich muss die Reparatur verschieben.", note: "*I need to ...* ist sachlich und neutral: Es ist notwendig, klingt aber nicht unhöflich."}
  en.a2.unit38.lesson02.teach.possible_in_the_morning: {title: "Um eine andere Uhrzeit bitten", gloss: "Wäre es möglich, stattdessen am Vormittag zu kommen?", note: "*Would it be possible to ...?* ist die vorsichtigste Art, etwas zu erbitten. *instead* bedeutet stattdessen."}
  en.a2.unit38.lesson02.teach.leave_key_with_neighbor: {title: "Sagen, wo der Schlüssel ist", gloss: "Ich lasse den Schlüssel bei meiner Nachbarin.", note: "*leave something with someone* bedeutet, etwas bei jemandem zu lassen bzw. abzugeben."}
  en.a2.unit38.lesson02.teach.is_the_leak_fixed: {title: "Fragen, ob das Problem behoben ist", gloss: "Ist die undichte Stelle jetzt repariert?", note: "*Is ... fixed?* fragt nach dem Ergebnis, nicht nach der Arbeit selbst."}
  en.a2.unit38.lesson02.teach.grammar_because_reason: {title: "Einen Grund mit because nennen", gloss: "Ich kann zwischen 14 und 16 Uhr nicht zu Hause sein, weil ich dann bei der Arbeit bin.", note: "*because* verbindet das Problem mit dem Grund. Anders als im Deutschen ändert sich die Wortstellung danach nicht: Das Verb bleibt an seiner normalen Stelle."}

  en.a2.unit38.lesson03.teach.message: {title: "message", gloss: "Nachricht", note: "*message* ist jede kurze schriftliche Nachricht: eine SMS, eine Chatnachricht oder eine kurze E-Mail.", example_gloss: "Ich habe eine Nachricht über den neuen Reparaturtermin bekommen."}
  en.a2.unit38.lesson03.teach.rescheduling_text: {title: "Die Nachricht über den neuen Termin", gloss: "Reparatur 6180 wurde verschoben. Der Klempner kommt morgen zwischen 9 und 11 Uhr. Ihre Nachbarin macht die Tür auf. Bitte bestätigen Sie diesen neuen Termin noch heute per Nachricht.", note: "Eine Nachricht der Hausverwaltung ist kurz und sachlich: was sich geändert hat, wann, und was Sie noch tun müssen."}
  en.a2.unit38.lesson03.teach.confirm_by_message: {title: "Zur Bestätigung aufgefordert werden", gloss: "Bitte bestätigen Sie diesen neuen Termin noch heute per Nachricht.", note: "*confirm* bedeutet bestätigen; *by message* bedeutet per Nachricht."}

  en.a2.unit38.lesson04.teach.q_need_to_reschedule: {title: "Daniel ruft die Hausverwaltung an", gloss: "Daniel sagt: Guten Tag, ich muss die Reparatur verschieben.", note: "Am Telefon beginnt man mit *Hello* und nennt dann gleich den Grund des Anrufs."}
  en.a2.unit38.lesson04.teach.a_which_repair: {title: "Die Hausverwaltung fragt, welche Reparatur", gloss: "Die Verwaltung sagt: Kein Problem. Um welche Reparatur geht es?", note: "*Which repair is it?* fragt nach einer einzelnen Sache aus einer bekannten Gruppe."}
  en.a2.unit38.lesson04.teach.q_repair_6180: {title: "Daniel nennt die Reparaturnummer", gloss: "Daniel sagt: Reparatur 6180, die undichte Stelle unter meiner Küchenspüle.", note: "Dieselbe Reparaturnummer wie in Einheit 29: dieselbe undichte Spüle."}
  en.a2.unit38.lesson04.teach.a_why_cant_you_be_home: {title: "Die Hausverwaltung fragt nach dem Grund", gloss: "Die Verwaltung sagt: Verstehe. Warum können Sie nicht zu Hause sein?", note: "*Why can't you ...?* fragt nach dem Grund, warum etwas nicht klappt."}
  en.a2.unit38.lesson04.teach.q_at_work_ask_morning: {title: "Daniel nennt den Grund und bittet um den Vormittag", gloss: "Daniel sagt: Ich kann zwischen 14 und 16 Uhr nicht zu Hause sein, weil ich dann bei der Arbeit bin. Wäre es möglich, stattdessen am Vormittag zu kommen?", note: "Erst der Grund, dann die Bitte: Das klingt höflicher, als gleich etwas zu verlangen."}
  en.a2.unit38.lesson04.teach.a_plumber_can_come_morning: {title: "Die Hausverwaltung bietet einen neuen Zeitraum an", gloss: "Die Verwaltung sagt: Ja, der Klempner kann zwischen 9 und 11 Uhr kommen.", note: "*between 9am and 11am* ist der neue Zeitraum."}
  en.a2.unit38.lesson04.teach.q_leave_key: {title: "Daniel regelt den Schlüssel", gloss: "Daniel sagt: Vielen Dank. Ich lasse den Schlüssel bei meiner Nachbarin.", note: "Derselbe Satz wie in Lektion 2."}
  en.a2.unit38.lesson04.teach.a_please_confirm: {title: "Die Hausverwaltung bittet um Bestätigung", gloss: "Die Verwaltung sagt: Gut. Bitte bestätigen Sie diesen neuen Termin noch heute per Nachricht.", note: "Dieselbe Aufforderung wie in der Nachricht in Lektion 3."}
  en.a2.unit38.lesson04.teach.q_will_confirm_this_afternoon: {title: "Daniel sagt, wann er bestätigt", gloss: "Daniel sagt: Ich bestätige ihn heute Nachmittag.", note: "*this afternoon* bedeutet heute Nachmittag, also heute nach 12 Uhr."}

