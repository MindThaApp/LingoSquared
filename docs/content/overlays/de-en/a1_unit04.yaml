  en.a1.unit04.lesson03.exercise03.order_birthday_question:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um nach jemandes Geburtstag zu fragen."
    accepted_answers: [{value: ["When's", "your", "birthday"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *When's your birthday?*"
