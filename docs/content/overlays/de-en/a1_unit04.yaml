review: {status: "reviewed", required_next_reviewer: null, notes: "Fourth de-en overlay, authored independently. Pairs with the existing, already-reviewed docs/content/realizations/en/a1_unit04_dates.yaml (status: reviewed) -- this overlay itself still needs the standard fresh-context review before shipping, same bar as every other overlay. Rewritten 2026-07-07 (draft.2) after a fresh-context review correctly flagged that the draft.1 version had been authored while consulting the existing nl-en/a1_unit04.yaml overlay (same target realization) for exercise-design conventions -- a real breach of CLAUDE.md's strong sibling-isolation rule ('treat the sibling-direction overlay as if it does not exist, do not open it at all'; 'for reference only' has demonstrably failed twice) even though no actual German content was copied. This version was authored from scratch with zero reference to any other X-en overlay pairing with this realization; every correct_option/distractor is in English, matching this project's own de-en/a1_unit01-03.yaml precedent (checked directly, not nl-en's Dutch-recognition-option convention). Also fixed in this rewrite: a pervasive AUTHORING_GUIDE section-15 gap (English target-language words/phrases embedded in German notes/feedback without asterisk-wrapping) across nearly every teaching note and several exercise feedback fields, and a section-12 gap in lesson04.exercise06.speak_dates (missing the unpunctuated fallback variant its sibling en-de/a1_unit04.yaml's speak_termine already has, relevant since speak_response is STT-graded and STT output won't reliably reproduce authored punctuation). One known, unfixable-from-this-file gap remains: lesson01.exercise03.match_days and lesson02.exercise03.match_months only carry 4 pairs each (AUTHORING_GUIDE section-16 wants 6-12) -- this originates in the shared, already-reviewed en/a1_unit04_dates.yaml realization's own pairs: field (used by every X-en overlay pairing with it, not just this one), so it cannot be fixed unilaterally from this overlay without touching reviewed content shared across fa-en/nl-en/prs-en too; flagging for whoever owns a cross-cutting revisit of that realization file. 2026-07-07 §19 retrofit: added example_gloss to all 14 vocabulary cards, matching the realization's new example: sentences; schema_version bumped to 1.1. 2026-10-11: accepted answers widened for write_date, reply_birthday (en realization review). Review 2026-10-19: 13 fixes - listen_weekday/listen_month distractors today/tomorrow/birthday (tomorrow never taught, birthday taught later, non-weekday/month options trivial) -> weekdays/months; listen_open_date distractor Tuesday, July 7th is spoken by Leila in the same audio (-> Monday, July 6th); match_days/match_months rights erster..fünfter Wochentag contradicted the Sunday note (US week starts on Sunday) -> Arbeitstag, match_days feedback now lists Friday and the weekend; teach.wednesday note (first d is silent, not kaum ausgesprochen); teach.its_july_7 note used symmetric 7.7 example; teach.its_tuesday_july_7 note ambiguous [Tag] -> [Wochentag]; teach.opens/again titles lowercased to match target; teach.again example_gloss Bis bald! dropped again (-> Wir sehen uns bald wieder!); teach.q_library/a_library glosses were paraphrases -> translations; write_date instruction ausgeschrieben contradicted the digit answers -> asks for the sentence, July seventh accepted with note; reply_birthday, reply_as_leila (instruction pinned to weekday + reopening day), speak_dates answers widened. NATIVE FLAGS: none."}

course:
  title: "Englisch A1"
  description: "Englisch auf A1-Niveau lernen, für Begrüßungen und kurze Gespräche im Alltag, mit ausführlichen deutschen Erklärungen."

units:
  en.a1.unit04.dates:
    title: "Tage, Monate und das Kalenderdatum"

lessons:
  en.a1.unit04.lesson01.weekdays: {title: "Tage der Woche"}
  en.a1.unit04.lesson02.months: {title: "Monate des Jahres"}
  en.a1.unit04.lesson03.calendar_dates: {title: "Nach dem Datum fragen und es nennen"}
  en.a1.unit04.lesson04.appointment_dialogue: {title: "Einen Termin vereinbaren: Daten im Gespräch"}

teaching:
  en.a1.unit04.lesson01.teach.monday: {title: "Monday", gloss: "Montag", note: "*Monday* bedeutet Montag; im Englischen werden Wochentage immer großgeschrieben, genau wie im Deutschen.", example_gloss: "Ich habe am Montag Zeit."}
  en.a1.unit04.lesson01.teach.tuesday: {title: "Tuesday", gloss: "Dienstag", note: "*Tuesday* bedeutet Dienstag.", example_gloss: "Ich habe am Dienstag Zeit."}
  en.a1.unit04.lesson01.teach.wednesday: {title: "Wednesday", gloss: "Mittwoch", note: "*Wednesday* bedeutet Mittwoch; das erste *d* wird nicht ausgesprochen.", example_gloss: "Ich habe am Mittwoch Zeit."}
  en.a1.unit04.lesson01.teach.thursday: {title: "Thursday", gloss: "Donnerstag", note: "*Thursday* bedeutet Donnerstag.", example_gloss: "Ich habe am Donnerstag Zeit."}
  en.a1.unit04.lesson01.teach.friday: {title: "Friday", gloss: "Freitag", note: "*Friday* bedeutet Freitag; im amerikanischen Kalender ein normaler Arbeitstag, kein freier Tag.", example_gloss: "Ich habe am Freitag Zeit."}
  en.a1.unit04.lesson01.teach.saturday: {title: "Saturday", gloss: "Samstag", note: "*Saturday* bedeutet Samstag; gehört im amerikanischen Kalender zum Wochenende.", example_gloss: "Ich habe am Samstag Zeit."}
  en.a1.unit04.lesson01.teach.sunday: {title: "Sunday", gloss: "Sonntag", note: "*Sunday* bedeutet Sonntag; im amerikanischen Kalender beginnt die Woche meist mit Sonntag, nicht mit Montag wie im Deutschen.", example_gloss: "Ich habe am Sonntag Zeit."}
  en.a1.unit04.lesson01.teach.what_day: {title: "What day is it today?", gloss: "Welcher Tag ist heute?", note: "*What day is it today?* fragt nach dem Wochentag, nicht nach dem vollständigen Datum."}

  en.a1.unit04.lesson02.teach.january: {title: "January", gloss: "Januar", note: "*January* ist der erste Monat des Jahres.", example_gloss: "Mein Geburtstag ist im Januar."}
  en.a1.unit04.lesson02.teach.march: {title: "March", gloss: "März", note: "*March* ist der dritte Monat des Jahres.", example_gloss: "Mein Geburtstag ist im März."}
  en.a1.unit04.lesson02.teach.july: {title: "July", gloss: "Juli", note: "*July* ist der siebte Monat des Jahres.", example_gloss: "Mein Geburtstag ist im Juli."}
  en.a1.unit04.lesson02.teach.september: {title: "September", gloss: "September", note: "*September* ist der neunte Monat des Jahres.", example_gloss: "Mein Geburtstag ist im September."}
  en.a1.unit04.lesson02.teach.december: {title: "December", gloss: "Dezember", note: "*December* ist der letzte Monat des Jahres.", example_gloss: "Mein Geburtstag ist im Dezember."}
  en.a1.unit04.lesson02.teach.which_month: {title: "Which month is it?", gloss: "Welcher Monat ist es?", note: "*Which month is it?* fragt nach dem aktuellen Monat."}

  en.a1.unit04.lesson03.teach.whats_the_date: {title: "What's today's date?", gloss: "Der Wievielte ist heute?", note: "*What's today's date?* fragt nach dem vollständigen Datum, nicht nur nach dem Wochentag."}
  en.a1.unit04.lesson03.teach.its_july_7: {title: "It's July 7th.", gloss: "Es ist der 7. Juli.", note: "Im amerikanischen Englisch steht der Monat VOR dem Tag: *July 7th*. Das ist genau umgekehrt zur deutschen Reihenfolge Tag, dann Monat (7. Juli)."}
  en.a1.unit04.lesson03.teach.its_tuesday_july_7: {title: "It's Tuesday, July 7th.", gloss: "Es ist Dienstag, der 7. Juli.", note: "Der Wochentag steht vor dem vollständigen Datum: [Wochentag], [Monat] [Tag]."}
  en.a1.unit04.lesson03.teach.numeric_form: {title: "You can also write it as 7/7.", gloss: "Man kann es auch als 7/7 schreiben.", note: "Achtung: In der amerikanischen Zahlenschreibweise ist das Format Monat/Tag (*7/7* = 7. Juli), nicht Tag/Monat wie im Deutschen (7.7.). Dieser Unterschied führt zu echter Verwirrung: *7/9* bedeutet 9. Juli, nicht 7. September."}
  en.a1.unit04.lesson03.teach.birthday_question: {title: "When's your birthday?", gloss: "Wann haben Sie Geburtstag?", note: "*When's your birthday?* fragt nach dem Geburtsdatum."}
  en.a1.unit04.lesson03.teach.birthday_answer: {title: "My birthday is March 3rd.", gloss: "Mein Geburtstag ist der 3. März.", note: "Beim Geburtstag steht das Verb *is*, genau wie beim heutigen Datum."}

  en.a1.unit04.lesson04.teach.opens: {title: "opens", gloss: "öffnet/geht auf", note: "*opens* ist die dritte Person Singular von *open* (öffnen).", example_gloss: "Die Bibliothek öffnet am Donnerstag."}
  en.a1.unit04.lesson04.teach.again: {title: "again", gloss: "wieder/erneut", note: "*again* bedeutet wieder oder erneut.", example_gloss: "Wir sehen uns bald wieder!"}
  en.a1.unit04.lesson04.teach.q_date: {title: "Daniel fragt nach dem Datum", gloss: "Daniel: Der Wievielte ist heute?", note: "Dieselbe Frage wie zuvor gelernt, jetzt in einem echten Gespräch."}
  en.a1.unit04.lesson04.teach.a_date: {title: "Antwort zum Datum", gloss: "Leila: Es ist Dienstag, der 7. Juli.", note: "Eine vollständige Antwort nennt sowohl den Wochentag als auch das Datum."}
  en.a1.unit04.lesson04.teach.q_library: {title: "Nach der Wiedereröffnung fragen", gloss: "Daniel: Wann ist die Bibliothek wieder geöffnet?", note: "*When's the library open again?* fragt nach dem Datum der Wiedereröffnung."}
  en.a1.unit04.lesson04.teach.a_library: {title: "Antwort zur Wiedereröffnung", gloss: "Leila: Sie öffnet am Donnerstag, dem 9. Juli.", note: "*It opens on Thursday, July 9th*; die Präposition *on* steht vor dem Wochentag."}
  en.a1.unit04.lesson04.teach.closing: {title: "Das Gespräch beenden", gloss: "Daniel sagt: Großartig, bis dann!", note: "*See you then* bedeutet, dass man sich zum genannten Zeitpunkt wiedersieht."}

exercises:
  en.a1.unit04.lesson01.exercise01.listen_weekday:
    instruction: "Hören Sie zu und wählen Sie den genannten Wochentag."
    correct_option: "Wednesday"
    distractors: ["Monday", "Tuesday", "Thursday"]
    accepted_answers: [{value: "Wednesday", status: "correct"}]
    feedback: "*Wednesday* bedeutet Mittwoch."
  en.a1.unit04.lesson01.exercise02.choose_weekend:
    instruction: "Wählen Sie den Tag, der im amerikanischen Kalender zum Wochenende gehört."
    correct_option: "Saturday"
    distractors: ["Monday", "Wednesday", "Friday"]
    accepted_answers: [{value: "Saturday", status: "correct"}]
    feedback: "*Saturday* (Samstag) gehört im amerikanischen Kalender zum Wochenende."
  en.a1.unit04.lesson01.exercise03.match_days:
    instruction: "Verbinden Sie jeden englischen Wochentag mit seiner deutschen Positionsangabe (Arbeitswoche bzw. Wochenende)."
    pairs:
      - {left: "Monday", right: "erster Arbeitstag"}
      - {left: "Tuesday", right: "zweiter Arbeitstag"}
      - {left: "Wednesday", right: "dritter Arbeitstag"}
      - {left: "Thursday", right: "vierter Arbeitstag"}
      - {left: "Friday", right: "fünfter Arbeitstag"}
      - {left: "Saturday", right: "erster Tag des Wochenendes"}
      - {left: "Sunday", right: "zweiter Tag des Wochenendes"}
    accepted_answers:
      - value:
          - {left: "Monday", right: "erster Arbeitstag"}
          - {left: "Tuesday", right: "zweiter Arbeitstag"}
          - {left: "Wednesday", right: "dritter Arbeitstag"}
          - {left: "Thursday", right: "vierter Arbeitstag"}
          - {left: "Friday", right: "fünfter Arbeitstag"}
          - {left: "Saturday", right: "erster Tag des Wochenendes"}
          - {left: "Sunday", right: "zweiter Tag des Wochenendes"}
        status: "correct"
    feedback: "Die Arbeitswoche: *Monday*, *Tuesday*, *Wednesday*, *Thursday*, *Friday*; das Wochenende: *Saturday*, *Sunday*."
  en.a1.unit04.lesson01.exercise04.order_question:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um nach dem Wochentag zu fragen."
    accepted_answers: [{value: ["What", "day", "is", "it", "today"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *What day is it today?*"
  en.a1.unit04.lesson01.exercise05.write_friday:
    instruction: "Schreiben Sie auf Englisch den Tag, der nach Donnerstag kommt."
    accepted_answers:
      - {value: "Friday", status: "correct"}
      - {value: "Friday.", status: "correct"}
    feedback: "Der Tag nach *Thursday* ist *Friday* (Freitag)."

  en.a1.unit04.lesson02.exercise01.listen_month:
    instruction: "Hören Sie zu und wählen Sie den genannten Monat."
    correct_option: "September"
    distractors: ["December", "January", "March"]
    accepted_answers: [{value: "September", status: "correct"}]
    feedback: "*September* bedeutet September."
  en.a1.unit04.lesson02.exercise02.choose_summer_month:
    instruction: "Wählen Sie den Monat, der auf der Nordhalbkugel ein Sommermonat ist."
    correct_option: "July"
    distractors: ["January", "March", "December"]
    accepted_answers: [{value: "July", status: "correct"}]
    feedback: "*July* (Juli) liegt mitten im Sommer auf der Nordhalbkugel."
  en.a1.unit04.lesson02.exercise03.match_months:
    instruction: "Verbinden Sie jeden englischen Monat oder Wochentag mit seiner deutschen Positionsangabe."
    pairs:
      - {left: "January", right: "erster Monat"}
      - {left: "March", right: "dritter Monat"}
      - {left: "July", right: "siebter Monat"}
      - {left: "December", right: "zwölfter Monat"}
      - {left: "September", right: "neunter Monat"}
      - {left: "Monday", right: "erster Arbeitstag"}
      - {left: "Tuesday", right: "zweiter Arbeitstag"}
      - {left: "Wednesday", right: "dritter Arbeitstag"}
      - {left: "Thursday", right: "vierter Arbeitstag"}
      - {left: "Friday", right: "fünfter Arbeitstag"}
      - {left: "Saturday", right: "erster Tag des Wochenendes"}
      - {left: "Sunday", right: "zweiter Tag des Wochenendes"}
    accepted_answers:
      - value:
          - {left: "January", right: "erster Monat"}
          - {left: "March", right: "dritter Monat"}
          - {left: "July", right: "siebter Monat"}
          - {left: "December", right: "zwölfter Monat"}
          - {left: "September", right: "neunter Monat"}
          - {left: "Monday", right: "erster Arbeitstag"}
          - {left: "Tuesday", right: "zweiter Arbeitstag"}
          - {left: "Wednesday", right: "dritter Arbeitstag"}
          - {left: "Thursday", right: "vierter Arbeitstag"}
          - {left: "Friday", right: "fünfter Arbeitstag"}
          - {left: "Saturday", right: "erster Tag des Wochenendes"}
          - {left: "Sunday", right: "zweiter Tag des Wochenendes"}
        status: "correct"
    feedback: "*January* ist der erste, *March* der dritte, *July* der siebte und *December* der zwölfte Monat; *Monday* ist der erste Arbeitstag der Woche."
  en.a1.unit04.lesson02.exercise04.order_month_question:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um nach dem Monat zu fragen."
    accepted_answers: [{value: ["Which", "month", "is", "it"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *Which month is it?*"
  en.a1.unit04.lesson02.exercise05.write_december:
    instruction: "Schreiben Sie den letzten Monat des Jahres auf Englisch."
    accepted_answers:
      - {value: "December", status: "correct"}
      - {value: "December.", status: "correct"}
    feedback: "Der letzte Monat ist *December*."

  en.a1.unit04.lesson03.exercise01.listen_date_question:
    instruction: "Hören Sie zu und wählen Sie die Frage, die Sie hören."
    correct_option: "What's today's date?"
    distractors: ["What day is it today?", "Which month is it?", "When's your birthday?"]
    accepted_answers: [{value: "What's today's date?", status: "correct"}]
    feedback: "*What's today's date?* fragt nach dem vollständigen heutigen Datum, nicht nur nach dem Wochentag oder dem Monat."
  en.a1.unit04.lesson03.exercise02.choose_date_answer:
    instruction: "Wählen Sie die richtige Antwort auf die Frage nach dem heutigen Datum."
    correct_option: "It's Tuesday, July 7th."
