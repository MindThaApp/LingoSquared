  en.a1.unit04.lesson04.exercise01.listen_today_date:
    instruction: "Hören Sie das Gespräch und wählen Sie das heutige Datum."
    correct_option: "Tuesday, July 7th"
    distractors: ["Thursday, July 9th", "Monday, July 7th", "Tuesday, July 9th"]
    accepted_answers: [{value: "Tuesday, July 7th", status: "correct"}]
