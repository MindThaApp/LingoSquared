teaching:
  en.a1.unit53.lesson01.teach.rent:
    title: rent
    gloss: mieten
    note: '*rent* bedeutet mieten oder vermieten. Im Englischen wird dasselbe Verb für beide Richtungen verwendet. Achten Sie deshalb auf den Zusammenhang, um zu erkennen, wer etwas von wem mietet.'
    example_gloss: Ich möchte ein Fahrrad mieten.
  en.a1.unit53.lesson01.teach.deposit:
    title: deposit
    gloss: Kaution
    note: '*deposit* bedeutet Kaution – Geld, das Sie im Voraus bezahlen und zurückbekommen, wenn Sie das Fahrrad unbeschädigt zurückbringen.'
    example_gloss: Die Kaution beträgt zwanzig Dollar.
  en.a1.unit53.lesson01.teach.return:
    title: return
    gloss: zurückbringen
    note: '*return* bedeutet hier, etwas zurückzubringen, nicht selbst zurückzukehren.'
    example_gloss: Bitte bringen Sie das Fahrrad heute zurück.
  en.a1.unit53.lesson01.teach.hour:
    title: hour
    gloss: Stunde
    note: '*hour* bedeutet Stunde.'
    example_gloss: Es kostet zehn Dollar pro Stunde.
  en.a1.unit53.lesson01.teach.size:
    title: size
    gloss: Größe
    note: '*size* bedeutet Größe.'
    example_gloss: Welche Größe benötigen Sie?
  en.a1.unit53.lesson01.teach.helmet:
    title: helmet
    gloss: Helm
    note: '*helmet* bedeutet Helm.'
    example_gloss: Haben Sie einen Helm?
  en.a1.unit53.lesson02.teach.id_like_to_rent_a_bike:
    title: I'd like to rent a bike, please.
    gloss: Ich möchte bitte ein Fahrrad mieten.
    note: '*I''d like to* (die Kurzform von *I would like to*) ist eine höfliche Art, um etwas zu bitten – freundlicher als das direkte *I want*.'
  en.a1.unit53.lesson02.teach.how_much_does_it_cost_per_hour:
    title: How much does it cost per hour?
    gloss: Wie viel kostet es pro Stunde?
    note: '*does it cost* verwendet das Hilfsverb *does*, weil *cost* das Vollverb ist – dieselbe Fragestruktur mit *do* wie bei anderen englischen Fragen.'
  en.a1.unit53.lesson02.teach.i_need_a_small_bike:
    title: I need a small bike.
    gloss: Ich brauche ein kleines Fahrrad.
    note: '*need a small bike* entspricht dem deutschen Satzbau mit „brauchen“: Auf das Verb folgt direkt das benötigte Objekt.'
  en.a1.unit53.lesson02.teach.can_i_have_a_helmet:
    title: Can I have a helmet, please?
    gloss: Kann ich bitte einen Helm bekommen?
    note: '*Can I have ...?* ist eine feste höfliche Wendung, mit der man in einem Geschäft um etwas bittet. Wörtlich heißt sie „Kann ich ... haben?“, wird im Deutschen aber oft natürlicher mit „Kann ich ... bekommen?“ wiedergegeben.'
  en.a1.unit53.lesson02.teach.when_do_i_need_to_return_it:
    title: When do I need to return it?
    gloss: Wann muss ich es zurückbringen?
    note: '*do I need to* verwendet ebenfalls das Hilfsverb *do*, um die Frage zu bilden.'
  en.a1.unit53.lesson02.teach.its_ten_dollars_an_hour:
    title: It's ten dollars an hour.
    gloss: Es kostet zehn Dollar pro Stunde.
    note: '*an hour* bedeutet hier pro Stunde. Der Artikel *an* hat in dieser Preisangabe die Bedeutung „pro“, ebenso wie *a* bei anderen Zeiteinheiten.'
  en.a1.unit53.lesson03.teach.dialogue_line1:
    title: Der Verleiher begrüßt sie
    gloss: 'Der Verleiher sagt: Hallo! Wie kann ich Ihnen heute helfen?'
    note: '*How can I help you today?* ist eine feste höfliche Begrüßung in Geschäften und bei Dienstleistungen.'
  en.a1.unit53.lesson03.teach.dialogue_line2:
    title: Mias Bitte
    gloss: 'Mia sagt: Wir möchten zwei Fahrräder mieten. Wir wollen am Fluss entlangfahren.'
    note: '*We''d like to rent* verwendet wieder das Verb *rent*, hier im Sinne von „bei dem Geschäft mieten“, nicht „vermieten“.'
  en.a1.unit53.lesson03.teach.dialogue_line3:
    title: Der Verleiher fragt nach der Größe
    gloss: 'Der Verleiher sagt: Natürlich. Welche Größe benötigen Sie?'
    note: '*What size do you need?* verwendet zur Bildung der Frage wieder das Hilfsverb *do*.'
  en.a1.unit53.lesson03.teach.dialogue_line4:
    title: Leilas Größe
    gloss: 'Leila sagt: Ich brauche ein kleines.'
    note: '*one* ersetzt hier das Wort *bike*, damit es nicht wiederholt werden muss. Im Deutschen übernimmt ein substantiviertes Adjektiv wie „ein kleines“ dieselbe Funktion; im Englischen steht dafür das eigene Wort *one*.'
  en.a1.unit53.lesson03.teach.dialogue_line5:
    title: Mias Größe
    gloss: 'Mia sagt: Und ich brauche ein mittelgroßes.'
    note: Auch hier steht *one* anstelle von *bike*, genau wie zuvor in Leilas Satz.
  en.a1.unit53.lesson03.teach.dialogue_line6:
    title: Der Preis und die Kaution
    gloss: 'Der Verleiher sagt: Prima, hier sind eure Fahrräder. Sie kosten zehn Dollar pro Stunde, und die Kaution beträgt zwanzig Dollar.'
    note: 'Dieser Satz enthält zwei getrennte Angaben: den Stundentarif und die Kaution. Verwechseln Sie sie nicht.'
  en.a1.unit53.lesson03.teach.dialogue_line7:
    title: Mia fragt nach der Rückgabe
    gloss: 'Mia sagt: Wann müssen wir sie zurückbringen?'
    note: '*them* bezieht sich hier auf die Fahrräder und steht deshalb im Plural.'
  en.a1.unit53.lesson03.teach.dialogue_line8:
    title: Die Rückgabezeit
    gloss: 'Der Verleiher sagt: Bitte bringt sie bis spätestens fünf Uhr zurück.'
    note: '*by five o''clock* bedeutet bis spätestens fünf Uhr, also nicht erst danach.'
  en.a1.unit53.lesson03.teach.dialogue_line9:
    title: Leila bedankt sich beim Verleiher
    gloss: 'Leila sagt: Prima, danke!'
    note: '*Great, thank you!* ist eine kurze, übliche Wendung, um ein Gespräch höflich abzuschließen.'
  en.a1.unit53.lesson04.teach.reading_passage:
    title: Text über eine Fahrradtour am Fluss entlang
    gloss: An einem warmen Nachmittag lud Mia Leila zu einer gemeinsamen Fahrradtour am Fluss in der Nähe ihrer Wohnung ein. Keine von beiden besaß ein Fahrrad, also gingen sie zusammen zu einem Fahrradverleih. Der Verleiher fragte, welche Größe sie brauchten. Leila nahm ein kleines Fahrrad und Mia ein mittelgroßes. Die Miete kostete zehn Dollar pro Stunde, und die Kaution für beide Fahrräder betrug zwanzig Dollar. Sie mussten die Fahrräder bis spätestens fünf Uhr zurückbringen. Die Fahrt am Fluss entlang war wunderschön, und sie sahen Menschen, die mit ihren Hunden spazieren gingen und das sonnige Wetter genossen. Sie brachten die Fahrräder pünktlich zurück und erhielten ihre Kaution wieder. Danach erzählten sie Daniel von der Tour, und er sagte, dass er das nächste Mal mitkommen wolle.
    note: '*owned* ist die Vergangenheitsform von *own* (besitzen). *Neither of them owned a bike* bedeutet, dass keine von beiden ein Fahrrad besaß.'
