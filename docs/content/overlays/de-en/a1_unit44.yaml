  en.a1.unit44.lesson03.teach.dialogue_line5:
    title: "Mias Antwort"
    gloss: 'Mia sagt: Die Blumen blühen, und ich fotografiere sie unheimlich gern für meinen Fotografiekurs.'
    note: '*I love taking photos* bedeutet: Ich fotografiere sehr gern.'
  en.a1.unit44.lesson03.teach.dialogue_line6:
    title: Leilas Frage
    gloss: 'Leila sagt: Das leuchtet ein! Ist der Frühling bei dir warm oder kalt?'
    note: '*That makes sense!* ist eine natürliche Reaktion auf eine gute Erklärung.'
  en.a1.unit44.lesson03.teach.dialogue_line7:
    title: "Mias Antwort"
    gloss: 'Mia sagt: Meistens warm, mit ein bisschen Regen. Perfekt, um draußen spazieren zu gehen.'
    note: '*with a little rain* bedeutet: mit ein bisschen Regen.'
  en.a1.unit44.lesson04.teach.reading_passage:
    title: Text über drei Lieblingsjahreszeiten
    gloss: Daniel, Leila und Mia haben alle eine andere Lieblingsjahreszeit. Daniels Lieblingsjahreszeit ist der Sommer. Er spielt gern Fußball und geht gern joggen, wenn das Wetter warm und sonnig ist. Leilas Lieblingsjahreszeit ist der Herbst, weil sie gern die Blätter malt, während sie sich verfärben. Mias Lieblingsjahreszeit ist der Frühling. Sie fotografiert die Blumen für ihren Fotografiekurs. Obwohl sie alle verschiedene Jahreszeiten mögen, finden sie immer Zeit, gemeinsam draußen die Natur zu genießen.
    note: '*even though* bedeutet: obwohl.'
