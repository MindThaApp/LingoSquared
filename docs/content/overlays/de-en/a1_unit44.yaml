  en.a1.unit44.lesson03.teach.dialogue_line2:
    title: "Leilas Antwort"
    gloss: 'Leila sagt: Der Herbst. Die Blätter verfärben sich, und es ist herrliches Wetter, um draußen zu malen.'
    note: '*great weather for painting outside* bedeutet: herrliches Wetter, um draußen zu malen.'
  en.a1.unit44.lesson03.teach.dialogue_line3:
    title: Mias Reaktion
    gloss: 'Mia sagt: Das klingt schön. Meine Lieblingsjahreszeit ist der Frühling.'
    note: '*My favorite season is spring* bedeutet: Meine Lieblingsjahreszeit ist der Frühling.'
  en.a1.unit44.lesson03.teach.dialogue_line4:
    title: Leilas Frage
