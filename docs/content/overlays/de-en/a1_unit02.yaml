course:
  title: "Englisch A1"
  description: "Englisch auf A1-Niveau lernen, für Begrüßungen und kurze Gespräche im Alltag, mit ausführlichen deutschen Erklärungen."

units:
  en.a1.unit02.introductions: {title: "Namen und grundlegende Angaben zur Person"}

lessons:
  en.a1.unit02.lesson01.exchange_names: {title: "Nach dem Namen fragen und ihn nennen"}
  en.a1.unit02.lesson02.exchange_roles: {title: "Nach einer Rolle oder Zugehörigkeit fragen"}
  en.a1.unit02.lesson03.library_dialogue: {title: "Namen, Rolle und Mitgliedschaft in einer Bibliothek austauschen"}

teaching:
  en.a1.unit02.lesson01.teach.whats_your_name: {title: "What's your name?", gloss: "Wie heißt du? / Wie heißen Sie?", note: "*What's your name?* funktioniert im Englischen sowohl formell als auch informell -- anders als im Deutschen gibt es hier keine Unterscheidung zwischen *Sie* und *du*."}
  en.a1.unit02.lesson01.teach.my_name_is: {title: "My name is Leila.", gloss: "Ich heiße Leila.", note: "Die Standardform, um den eigenen Namen zu nennen."}
  en.a1.unit02.lesson01.teach.im_leila: {title: "I'm Leila.", gloss: "Ich bin Leila. / Ich heiße Leila.", note: "Eine kürzere, ebenso übliche Alternative zu *My name is Leila*."}
  en.a1.unit02.lesson01.teach.nice_to_meet_you: {title: "Nice to meet you.", gloss: "Freut mich.", note: "Wird gesagt, wenn man jemanden zum ersten Mal trifft."}

  en.a1.unit02.lesson02.teach.i_am_student: {title: "I am a student.", gloss: "Ich bin Student/Studentin.", note: "*a* wird vor Berufs- oder Rollenbezeichnungen im Singular verwendet -- im Deutschen entfällt der Artikel hier (*Ich bin Student*, nicht *ein Student*)."}
  en.a1.unit02.lesson02.teach.are_you_teacher: {title: "Are you a teacher?", gloss: "Sind Sie Lehrer(in)? / Bist du Lehrer(in)?", note: "Die Frageform mit *Are you...?* funktioniert in jedem Register."}
  en.a1.unit02.lesson02.teach.yes_i_am: {title: "Yes, I am.", gloss: "Ja, das bin ich.", note: "Eine kurze, vollständige Antwort auf Fragen wie *Are you a teacher?*"}
  en.a1.unit02.lesson02.teach.no_im_student: {title: "No, I'm a student.", gloss: "Nein, ich bin Student/Studentin.", note: "Eine verneinte Antwort mit Korrektur der eigenen Rolle."}
  en.a1.unit02.lesson02.teach.are_you_member: {title: "Are you a new member?", gloss: "Sind Sie ein neues Mitglied?", note: "Fragt nach der Mitgliedschaft, zum Beispiel in einer Bibliothek oder einem Verein."}
  en.a1.unit02.lesson02.teach.he_is_teacher: {title: "He is a teacher.", gloss: "Er ist Lehrer.", note: "Dritte Person Singular männlich."}
  en.a1.unit02.lesson02.teach.she_is_engineer: {title: "She is an engineer.", gloss: "Sie ist Ingenieurin.", note: "Dritte Person Singular weiblich -- *an* statt *a*, weil *engineer* mit einem Vokal beginnt."}

  en.a1.unit02.lesson03.teach.library: {title: "library", gloss: "die Bibliothek", note: "Ein Ort, an dem man Bücher ausleihen kann.", example_gloss: "Ich bin in der Bibliothek."}
  en.a1.unit02.lesson03.teach.library_assistant: {title: "library assistant", gloss: "Bibliotheksassistent(in)", note: "Eine Person, die in einer Bibliothek arbeitet."}
  en.a1.unit02.lesson03.teach.opening: {title: "Daniel eröffnet das Gespräch", gloss: "Daniel sagt: Guten Tag. Ich bin Daniel.", note: "Eine formelle, freundliche Eröffnung."}
  en.a1.unit02.lesson03.teach.request: {title: "Daniel fragt nach dem Namen", gloss: "Daniel sagt: Wie heißen Sie?", note: "Direkt im Anschluss an die Vorstellung -- Daniel und Leila kennen sich noch nicht, deshalb bleibt das Gespräch im formellen *Sie*-Register."}
  en.a1.unit02.lesson03.teach.names: {title: "Leila antwortet", gloss: "Leila sagt: Hallo. Ich bin Leila. Ich bin Studentin. Freut mich.", note: "Leila nennt ihren Namen, ihre Rolle und die übliche Höflichkeitsfloskel."}
  en.a1.unit02.lesson03.teach.room_and_member: {title: "Daniel fragt nach der Mitgliedschaft", gloss: "Daniel sagt: Freut mich auch. Sind Sie ein neues Mitglied? Leila sagt: Ja, das bin ich.", note: "Daniel erwidert die Höflichkeitsfloskel und fragt nach der Mitgliedschaft, weiterhin im *Sie*-Register."}
  en.a1.unit02.lesson03.teach.role: {title: "Daniel nennt seinen Beruf", gloss: "Daniel sagt: Ich bin Ingenieur.", note: "Vor einem Beruf steht im Englischen *a* oder *an* (*I'm an engineer*); im Deutschen fällt der Artikel weg."}
  en.a1.unit02.lesson03.teach.closing: {title: "Daniel und Leila schließen das Gespräch ab", gloss: "Daniel sagt: Willkommen in der Bibliothek. Leila sagt: Danke.", note: "Ein freundlicher, höflicher Abschluss."}

exercises:
  en.a1.unit02.lesson01.exercise01.listen_name_question:
    instruction: "Hören Sie zu und wählen Sie die Frage aus, die Sie hören."
    correct_option: "What's your name?"
    distractors: ["Nice to meet you", "My name is Leila", "I'm Leila"]
    accepted_answers: [{value: "What's your name?", status: "correct"}]
    feedback: "*What's your name?* fragt nach dem Namen."
  en.a1.unit02.lesson01.exercise02.choose_name_answer:
    instruction: "Jemand fragt: 'What's your name?' Wie antworten Sie mit dem Namen Leila?"
    correct_option: "My name is Leila"
    distractors: ["Nice to meet you", "I am a student", "Are you a teacher"]
    accepted_answers: [{value: "My name is Leila", status: "correct"}]
    feedback: "*My name is Leila* nennt den Namen."
  en.a1.unit02.lesson01.exercise03.order_name:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um 'Mein Name ist Leila' zu sagen."
    accepted_answers: [{value: ["My", "name", "is", "Leila"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *My name is Leila*."
  en.a1.unit02.lesson01.exercise04.reply_name:
    instruction: "Jemand fragt: 'What's your name?' Antworten Sie, dass Sie Leila heißen."
    accepted_answers:
      - {value: "I'm Leila.", status: "correct"}
      - {value: "I'm Leila", status: "correct"}
      - {value: "My name is Leila.", status: "correct"}
      - {value: "My name is Leila", status: "correct"}
      - {value: "I am Leila.", status: "correct"}
      - {value: "My name's Leila.", status: "correct"}
    feedback: "*I'm Leila* nennt den Namen kurz und einfach."
  en.a1.unit02.lesson01.exercise05.write_intro:
    instruction: "Schreiben Sie, dass Ihr Name Leila ist."
    accepted_answers:
      - {value: "My name is Leila", status: "correct"}
      - {value: "My name is Leila.", status: "correct"}
      - {value: "My name's Leila.", status: "correct"}
      - {value: "I'm Leila.", status: "correct"}
      - {value: "I am Leila.", status: "correct"}
    feedback: "*My name is Leila* bedeutet: Mein Name ist Leila."

  en.a1.unit02.lesson02.exercise01.choose_i:
    instruction: "Welches Wort passt: '_ am a student.'?"
    correct_option: "I"
    distractors: ["You", "He", "She"]
    accepted_answers: [{value: "I", status: "correct"}]
    feedback: "*I am a student* bedeutet: Ich bin Student(in)."
  en.a1.unit02.lesson02.exercise02.choose_role_question:
    instruction: "Fragen Sie die andere Person nach ihrer Rolle."
    correct_option: "Are you a teacher"
    distractors: ["I am a student", "Yes, I am", "He is a teacher"]
    accepted_answers: [{value: "Are you a teacher", status: "correct"}]
    feedback: "*Are you a teacher?* fragt nach der Rolle der anderen Person."
  en.a1.unit02.lesson02.exercise03.choose_he:
    instruction: "Omid ist ein Mann. '_ is a teacher.'"
    correct_option: "He"
    distractors: ["I", "You", "She"]
    accepted_answers: [{value: "He", status: "correct"}]
    feedback: "*He is a teacher* bedeutet: Er ist Lehrer."
  en.a1.unit02.lesson02.exercise04.choose_she:
    instruction: "Sara ist eine Frau. '_ is an engineer.'"
    correct_option: "She"
    distractors: ["I", "You", "He"]
    accepted_answers: [{value: "She", status: "correct"}]
    feedback: "*She is an engineer* bedeutet: Sie ist Ingenieurin."
  en.a1.unit02.lesson02.exercise05.order_member:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um zu fragen, ob jemand ein neues Mitglied ist."
    accepted_answers: [{value: ["Are", "you", "a", "new", "member"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *Are you a new member?*"
  en.a1.unit02.lesson02.exercise06.reply_teacher:
    instruction: "Jemand fragt: 'Are you a teacher?' Antworten Sie verneinend und sagen Sie, dass Sie Student(in) sind."
    accepted_answers:
      - {value: "No, I'm a student.", status: "correct"}
      - {value: "No, I'm a student", status: "correct"}
      - {value: "No, I am a student.", status: "correct"}
      - {value: "No, I'm not. I'm a student.", status: "correct"}
      - {value: "No, I am not. I am a student.", status: "correct"}
      - {value: "No, I'm a student, not a teacher.", status: "correct"}
      - {value: "I'm not a teacher. I'm a student.", status: "acceptable_with_note", note: "Richtig und klar, aber länger als die gelernte kurze Antwort *No, I'm a student.*"}
    feedback: "*No, I'm a student* verneint und nennt die tatsächliche Rolle."
  en.a1.unit02.lesson02.exercise07.write_identity:
    instruction: "Schreiben Sie, dass Sie Student(in) sind."
    accepted_answers:
      - {value: "I am a student", status: "correct"}
      - {value: "I am a student.", status: "correct"}
      - {value: "I'm a student.", status: "correct"}
    feedback: "*I am a student* bedeutet: Ich bin Student(in)."

  en.a1.unit02.lesson03.exercise01.listen_names:
    instruction: "Hören Sie sich das Gespräch an. Welche Namen werden genannt?"
    correct_option: "Daniel and Leila"
    distractors: ["Anna and Felix", "Daniel and Anna", "Felix and Leila"]
    accepted_answers: [{value: "Daniel and Leila", status: "correct"}]
    feedback: "Die beiden Sprecher heißen Daniel und Leila."
  en.a1.unit02.lesson03.exercise02.listen_role:
    instruction: "Hören Sie zu und wählen Sie aus, was Daniel über seinen Beruf sagt."
    correct_option: "I'm an engineer"
    distractors: ["I am a student", "I am a new member", "I'm Leila"]
    accepted_answers: [{value: "I'm an engineer", status: "correct"}]
    feedback: "Daniel sagt: *I'm an engineer.*"
  en.a1.unit02.lesson03.exercise03.choose_name_question:
    instruction: "Fragen Sie Leila nach ihrem Namen."
    correct_option: "What's your name"
    distractors: ["Are you a new member", "I'm an engineer", "Nice to meet you"]
    accepted_answers: [{value: "What's your name", status: "correct"}]
    feedback: "*What's your name?* fragt nach dem Namen."
  en.a1.unit02.lesson03.exercise04.order_member_question:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um zu fragen, ob jemand ein neues Mitglied ist."
    accepted_answers: [{value: ["Are", "you", "a", "new", "member"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *Are you a new member?*"
  en.a1.unit02.lesson03.exercise05.reply_as_leila:
    instruction: "Daniel fragt: „Sind Sie ein neues Mitglied? Wie heißen Sie?“ Antworten Sie als Leila: Bestätigen Sie die Mitgliedschaft und nennen Sie Ihren Namen."
    accepted_answers:
      - {value: "Yes, I am. I'm Leila.", status: "correct"}
      - {value: "Yes, I am, I'm Leila.", status: "correct"}
      - {value: "Are you a new member Yes I am I'm Leila", status: "correct"}
      - {value: "Yes, I am. I am Leila.", status: "correct"}
      - {value: "Yes, I am. My name is Leila.", status: "correct"}
      - {value: "Yes, I am. My name's Leila.", status: "correct"}
      - {value: "Yes, I'm a new member. I'm Leila.", status: "correct"}
      - {value: "Yes, I'm Leila.", status: "acceptable_with_note", note: "In diesem Zusammenhang natürlich; vollständiger ist die Kurzantwort *Yes, I am.* vor dem Namen."}
    feedback: "Diese vollständige Antwort bestätigt die Mitgliedschaft und nennt den Namen."
  en.a1.unit02.lesson03.exercise06.who_is_daniel:
    instruction: "Hören Sie sich das Gespräch an. Was ist Daniel von Beruf?"
    correct_option: "Ingenieur."
    distractors: ["Lehrer.", "Student.", "Bibliotheksassistent."]
    accepted_answers: [{value: "Ingenieur.", status: "correct"}]
    feedback: "Daniel sagt: *I'm an engineer.* Er ist Ingenieur."
  en.a1.unit02.lesson03.exercise07.speak_exchange:
    instruction: "Antworten Sie laut in der Rolle von Leila: Nennen Sie Ihren Namen und Ihre Rolle als Studentin und bestätigen Sie, dass Sie ein neues Mitglied sind."
    accepted_answers:
      - {value: "I'm Leila. I'm a student. I'm a new member.", status: "correct"}
      - {value: "I'm Leila I'm a student I'm a new member", status: "correct"}
      - {value: "I am Leila. I am a student. I am a new member.", status: "correct"}
      - {value: "My name is Leila. I'm a student. I'm a new member.", status: "correct"}
      - {value: "My name's Leila. I'm a student. I'm a new member.", status: "correct"}
    feedback: "Diese vollständige Antwort deckt den Namen, die Rolle und die Mitgliedschaft ab."
