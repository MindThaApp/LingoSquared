  en.a1.unit56.lesson02.teach.can_i_order_now:
    title: Can I order now?
    gloss: Kann ich jetzt bestellen?
    note: '*Can I...?* ist eine direkte Art zu fragen – weniger förmlich als *could*.'
  en.a1.unit56.lesson02.teach.id_like_the_salad:
    title: I'd like the salad, please.
    gloss: Ich hätte bitte gern den Salat.
    note: '*I''d like* (Kurzform von *I would like*) ist die höfliche Art zu bestellen.'
  en.a1.unit56.lesson02.teach.how_much_is_the_salad:
    title: How much is the salad?
    gloss: Was kostet der Salat?
    note: '*How much is...?* fragt nach dem Preis.'
  en.a1.unit56.lesson02.teach.could_we_have_the_bill:
    title: Could we have the bill, please?
    gloss: Könnten wir bitte die Rechnung haben?
    note: '*Could we have...?* ist die höfliche Art zu fragen. Im Deutschen entspricht dem die Höflichkeitsform mit Konjunktiv (Könnten wir ...?); im Englischen übernimmt *could* diese Rolle.'
  en.a1.unit56.lesson02.teach.enjoy_your_meal:
    title: Enjoy your meal!
    gloss: Guten Appetit!
    note: '*Enjoy your meal!* ist eine feste Wendung, die ein Kellner sagt, bevor man zu essen beginnt. Wörtlich heißt es „Genießen Sie Ihre Mahlzeit“, aber das deutsche Guten Appetit! ist anders aufgebaut. Lernen Sie diesen Satz als Ganzes, nicht Wort für Wort.'
  en.a1.unit56.lesson03.teach.dialogue_line1:
    title: Leila fragt nach dem Tisch
    gloss: 'Leila sagt: Hallo! Ist dieser Tisch frei?'
    note: '*Is this table free?* verwendet *free* im Sinne von frei/unbesetzt.'
  en.a1.unit56.lesson03.teach.dialogue_line2:
    title: Der Kellner weist einen Tisch zu
    gloss: 'Der Kellner sagt: Ja, setzen Sie sich bitte hierher.'
    note: '*please sit here* ist eine kurze, höfliche Einladung.'
  en.a1.unit56.lesson03.teach.dialogue_line3:
    title: Mia fragt nach der Speisekarte
    gloss: 'Mia sagt: Könnte ich bitte die Speisekarte sehen?'
    note: '*Could I see...?* – wieder das höfliche *could*, wie bei *could we have the bill*.'
  en.a1.unit56.lesson03.teach.dialogue_line4:
    title: Der Kellner gibt die Speisekarte
    gloss: 'Der Kellner sagt: Natürlich, bitte sehr.'
    note: '*Of course, here you are* ist eine feste Wendung, wenn man jemandem etwas reicht.'
  en.a1.unit56.lesson03.teach.dialogue_line5:
    title: Leilas Bestellung
    gloss: 'Leila sagt: Ich hätte bitte gern das Hähnchen.'
    note: 'Eine einzelne Information: Leilas Bestellung ist Hähnchen.'
  en.a1.unit56.lesson03.teach.dialogue_line6:
    title: Mias Bestellung
    gloss: 'Mia sagt: Ich hätte bitte gern den Salat.'
    note: 'Eine einzelne Information: Mias Bestellung ist Salat.'
  en.a1.unit56.lesson03.teach.dialogue_line7:
    title: Der Kellner wünscht guten Appetit
    gloss: 'Der Kellner sagt: Gute Wahl! Guten Appetit!'
    note: '*Enjoy your meal!* – die feste Schlussformel, bevor die Gäste zu essen beginnen.'
  en.a1.unit56.lesson03.teach.dialogue_line8:
    title: Leila fragt nach dem Preis des Hähnchens
    gloss: 'Leila sagt: Was kostet das Hähnchen?'
    note: '*How much is...?* fragt nach dem Preis.'
  en.a1.unit56.lesson03.teach.dialogue_line9:
    title: Der Preis des Hähnchens
    gloss: 'Der Kellner sagt: Das Hähnchen kostet zwölf Dollar.'
    note: 'Eine einzelne Information: der Preis des Hähnchens, getrennt vom Salat und der Gesamtrechnung.'
  en.a1.unit56.lesson03.teach.dialogue_line10:
    title: Mia fragt nach dem Preis des Salats
    gloss: 'Mia sagt: Was kostet der Salat?'
    note: '*How much is...?* – dieselbe Frageform wie beim Hähnchen.'
  en.a1.unit56.lesson03.teach.dialogue_line11:
    title: Der Preis des Salats
    gloss: 'Der Kellner sagt: Der Salat kostet sieben Dollar.'
    note: 'Eine zweite eigene Information: der Preis des Salats.'
  en.a1.unit56.lesson03.teach.dialogue_line12:
    title: "Leila bittet um die Rechnung"
    gloss: 'Leila sagt: Könnten wir bitte die Rechnung haben?'
    note: '*Could we have...?* – wieder das höfliche *could*.'
  en.a1.unit56.lesson03.teach.dialogue_line13:
    title: Die Gesamtrechnung
    gloss: 'Der Kellner sagt: Das macht bitte neunzehn Dollar.'
    note: 'Eine dritte eigene Information: die Gesamtrechnung, etwas anderes als die Einzelpreise für Hähnchen und Salat.'
  en.a1.unit56.lesson04.teach.restaurant_menu:
    title: Speisekarte
    gloss: 'Speisekarte des Restaurants: Hähnchen - 12 $. Salat - 7 $. Pizza - 10 $. Saft - 3 $.'
    note: Die Speisekarte zeigt vier Gerichte mit ihren Preisen.
  en.a1.unit56.lesson04.teach.reading_passage:
    title: 'Text: Eine Mahlzeit im Restaurant'
    gloss: An einem Abend beschlossen Leila und Mia, ein neues Restaurant in der Innenstadt auszuprobieren. Ein Kellner führte sie zu einem Tisch am Fenster. Er brachte ihnen eine Speisekarte mit Hähnchen, Salat, Pizza und Saft. Leila bestellte das Hähnchen, und Mia bestellte den Salat. Das Hähnchen kostete zwölf Dollar und der Salat sieben Dollar. Beim Essen unterhielten sie sich über Mias Fotokurs. Als sie fertig waren, brachte der Kellner die Rechnung. Sie betrug neunzehn Dollar für beide zusammen. Leila sagte, das Restaurant sei ausgezeichnet, und Mia sagte, sie wolle beim nächsten Mal Daniel mitbringen.
    note: '*ordered* ist die Vergangenheitsform von *order* (bestellen).'
