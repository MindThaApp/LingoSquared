teaching:
  en.a1.unit39.lesson01.teach.neighborhood:
    title: neighborhood
    gloss: Viertel / Gegend
    note: '*neighborhood* bedeutet Viertel oder Gegend: das Gebiet rund um Ihr Zuhause, mit den Straßen und Gebäuden in der Nähe.'
    example_gloss: Ich liebe mein Viertel.
  en.a1.unit39.lesson01.teach.neighbor:
    title: neighbor
    gloss: Nachbar / Nachbarin
    note: '*neighbor* bedeutet Nachbar oder Nachbarin: jemand, der neben Ihnen oder in Ihrer Nähe wohnt.'
    example_gloss: Mein Nachbar ist sehr hilfsbereit.
  en.a1.unit39.lesson01.teach.nearby:
    title: nearby
    gloss: in der Nähe
    note: '*nearby* bedeutet in der Nähe.'
    example_gloss: Hier in der Nähe ist ein Park.
  en.a1.unit39.lesson01.teach.quiet:
    title: quiet
    gloss: ruhig / still
    note: '*quiet* bedeutet ruhig, ohne viel Lärm.'
    example_gloss: Meine Straße ist nachts sehr ruhig.
  en.a1.unit39.lesson01.teach.noisy:
    title: noisy
    gloss: laut
    note: '*noisy* bedeutet voller lauter Geräusche.'
    example_gloss: Die Straße neben meiner ist laut.
  en.a1.unit39.lesson01.teach.friendly:
    title: friendly
    gloss: freundlich
    note: '*friendly* bedeutet freundlich.'
    example_gloss: Meine Nachbarn sind sehr freundlich.
  en.a1.unit39.lesson02.teach.live_in_a_neighborhood:
    title: live in a neighborhood
    gloss: in einem Viertel wohnen
    note: '*live in a neighborhood* bedeutet in einem Viertel wohnen.'
    example_gloss: Ich wohne in einem ruhigen Viertel.
  en.a1.unit39.lesson02.teach.get_along_with_your_neighbors:
    title: get along with your neighbors
    gloss: sich mit seinen Nachbarn gut verstehen
    note: '*get along with your neighbors* bedeutet ein gutes, freundliches Verhältnis zu den Menschen haben, die in Ihrer Nähe wohnen.'
    example_gloss: Ich verstehe mich gut mit meinen Nachbarn.
  en.a1.unit39.lesson02.teach.close_to:
    title: close to
    gloss: nah bei
    note: '*close to* bedeutet nah bei (einem Ort).'
    example_gloss: Meine Wohnung ist nah bei einem Supermarkt.
  en.a1.unit39.lesson02.teach.a_five_minute_walk:
    title: a five-minute walk
    gloss: fünf Minuten zu Fuß
    note: '*a five-minute walk* ist ein festes englisches Muster: Zahl + Substantiv, mit Bindestrich, und das Substantiv bleibt im Singular (nicht *minutes*). Im Deutschen sagt man dagegen einfach ''fünf Minuten zu Fuß''.'
    example_gloss: Der Park ist fünf Minuten zu Fuß von meinem Haus entfernt.
  en.a1.unit39.lesson02.teach.say_hello_to:
    title: say hello to
    gloss: Hallo sagen zu
    note: '*say hello to* bedeutet jemanden begrüßen, Hallo zu jemandem sagen.'
    example_gloss: Ich sage morgens immer Hallo zu meinem Nachbarn.
  en.a1.unit39.lesson02.teach.whats_your_neighborhood_like_question:
    title: What's your neighborhood like?
    gloss: Wie ist dein Viertel?
    note: '*What''s ... like?* fragt nach einer Beschreibung, nicht nach einer Vorliebe.'
  en.a1.unit39.lesson03.teach.dialogue_line1:
    title: Leilas Frage
    gloss: 'Leila sagt: Ich ziehe vielleicht bald um. Wie ist dein Viertel, Mia?'
    note: '*might* + Verb drückt eine Möglichkeit aus: vielleicht ja, vielleicht nein.'
  en.a1.unit39.lesson03.teach.dialogue_line2:
    title: "Mias Antwort"
    gloss: 'Mia sagt: Es gefällt mir richtig gut. Es ist ruhig, und in der Nähe ist ein Park.'
    note: '*there''s a park nearby* bedeutet: In der Nähe ist ein Park.'
  en.a1.unit39.lesson03.teach.dialogue_line3:
    title: Leilas Frage
    gloss: 'Leila sagt: Das klingt schön. Ist es nah bei einem Supermarkt?'
    note: '*That sounds nice* ist eine natürliche Reaktion auf gute Neuigkeiten.'
  en.a1.unit39.lesson03.teach.dialogue_line4:
    title: "Mias Antwort"
    gloss: 'Mia sagt: Ja, einer ist nur fünf Minuten zu Fuß von meinem Haus entfernt.'
    note: '*just* bedeutet hier nur: Es betont, wie kurz die Entfernung ist.'
  en.a1.unit39.lesson03.teach.dialogue_line5:
    title: Leilas Frage
    gloss: 'Leila fragt: Und was ist mit deinen Nachbarn? Sind sie freundlich?'
    note: '*What about ...?* ist eine natürliche Art, ein neues Thema anzusprechen.'
  en.a1.unit39.lesson03.teach.dialogue_line6:
    title: "Mias Antwort"
    gloss: 'Mia sagt: Sehr freundlich! Mein Nachbar, Herr Lopez, gießt meine Pflanzen, wenn ich weg bin.'
    note: '*waters my plants* bedeutet gießt meine Pflanzen. Im Englischen ist *water* hier ein Verb.'
  en.a1.unit39.lesson03.teach.dialogue_line7:
    title: Leilas Reaktion
    gloss: 'Leila sagt: Wie lieb. Ich glaube, ich würde gern in deiner Nähe wohnen!'
    note: '*I''d like to* + Verb bedeutet: Ich würde gern + Verb.'
  en.a1.unit39.lesson04.teach.reading_passage:
    title: Text über drei Viertel
    gloss: Daniel, Leila und Mia wohnen alle in verschiedenen Vierteln. Daniels Viertel ist belebt, mit Restaurants und Geschäften nah bei seinem Wohnhaus. Er kennt mehrere seiner Nachbarn und sagt im Flur oft Hallo zu ihnen. Leila wohnt in einem ruhigen Viertel, nah beim Schwimmbad, wo sie schwimmt. Ihre Nachbarin auf der anderen Straßenseite hat einen großen Hund, der viel bellt. Auch Mias Viertel ist ruhig, mit einem Supermarkt nur fünf Minuten zu Fuß von ihrem Haus entfernt. Ihr Nachbar, Herr Lopez, ist sehr freundlich und gießt ihre Pflanzen, wenn sie weg ist. Nach dem Gespräch mit Mia hat Leila beschlossen, dass sie sich eine Wohnung in Mias Nähe suchen will.
    note: '*decided she wants to look for* bedeutet: hat beschlossen, dass sie suchen will.'
