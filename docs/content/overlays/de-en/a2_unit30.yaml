teaching:
  en.a2.unit30.lesson01.teach.experience: {title: "experience", gloss: "Erfahrung", note: "*experience* bedeutet Erfahrung, besonders Berufserfahrung.", example_gloss: "Ich habe zwei Jahre Erfahrung im Marketing."}
  en.a2.unit30.lesson01.teach.position: {title: "position", gloss: "Stelle", note: "*position* bedeutet die Stelle oder den Posten in einem Unternehmen.", example_gloss: "Diese Stelle ist für eine Marketingkoordinatorin bzw. einen Marketingkoordinator."}
  en.a2.unit30.lesson01.teach.availability: {title: "availability", gloss: "Verfügbarkeit", note: "*availability* bedeutet, wann man Zeit hat, zum Beispiel um mit der Arbeit anzufangen.", example_gloss: "Die Interviewerin hat mich nach meiner Verfügbarkeit gefragt."}
  en.a2.unit30.lesson01.teach.strength: {title: "strength", gloss: "Stärke", note: "*strength* bedeutet etwas, das man besonders gut kann.", example_gloss: "Eine meiner Stärken ist, dass ich gut organisiert bin."}
  en.a2.unit30.lesson01.teach.requirement: {title: "requirement", gloss: "Anforderung", note: "*requirement* bedeutet etwas, das für die Stelle verlangt wird.", example_gloss: "Zwei Jahre Berufserfahrung sind eine Anforderung für diese Stelle."}

  en.a2.unit30.lesson02.teach.two_years_experience: {title: "Die eigene Erfahrung beschreiben", gloss: "Ich habe zwei Jahre Erfahrung im Social-Media-Marketing.", note: "Mit diesem Satz beschreiben Sie im Bewerbungsgespräch Ihre Berufserfahrung."}
  en.a2.unit30.lesson02.teach.one_strength_organized: {title: "Eine Stärke nennen", gloss: "Eine meiner Stärken ist, dass ich gut organisiert bin.", note: "*One of my strengths is...* ist die übliche Art, im Bewerbungsgespräch eine Stärke zu nennen."}
  en.a2.unit30.lesson02.teach.available_next_monday: {title: "Die eigene Verfügbarkeit nennen", gloss: "Ich kann nächsten Montag anfangen.", note: "Mit *I'm available to start...* sagen Sie, ab wann Sie anfangen können."}

  en.a2.unit30.lesson03.teach.resume: {title: "resume", gloss: "Lebenslauf", note: "*resume* bedeutet Lebenslauf. Das Wort wird vor allem im amerikanischen Englisch verwendet.", example_gloss: "Bitte bringen Sie Ihren Lebenslauf zum Gespräch mit."}
  en.a2.unit30.lesson03.teach.deadline: {title: "deadline", gloss: "Abgabetermin / Frist", note: "*deadline* bedeutet die Frist, bis zu der etwas fertig sein muss. Im Deutschen sagt man oft auch \"Deadline\".", example_gloss: "Bei der Arbeit halte ich immer meine Fristen ein."}
  en.a2.unit30.lesson03.teach.posting_text: {title: "Text der Stellenanzeige", gloss: "Bright Path Marketing sucht eine Marketingkoordinatorin bzw. einen Marketingkoordinator. Anforderungen: zwei Jahre Berufserfahrung, gute Schreibkenntnisse und sofortige Verfügbarkeit. Bitte bringen Sie Ihren Lebenslauf zum Gespräch mit.", note: "Eine formelle Stellenanzeige mit Anforderungen und einer Anweisung."}
  en.a2.unit30.lesson03.teach.i_meet_deadlines: {title: "Über die eigene Arbeitsweise sprechen", gloss: "Ich halte meine Fristen ein und arbeite gut im Team.", note: "*I meet deadlines* und *I work well in a team* sind nützliche Sätze, um die eigene Arbeitsweise zu beschreiben."}

  en.a2.unit30.lesson04.teach.q_tell_me_experience: {title: "Die Interviewerin fragt nach der Erfahrung", gloss: "Die Interviewerin sagt: Danke, dass Sie heute gekommen sind. Können Sie mir etwas über Ihre Erfahrung erzählen?", note: "*Thank you for coming in today* ist eine höfliche Eröffnung eines Bewerbungsgesprächs."}
  en.a2.unit30.lesson04.teach.a_two_years_managed_team: {title: "Mias Antwort zur Erfahrung", gloss: "Mia sagt: Ich habe zwei Jahre Erfahrung im Social-Media-Marketing. Außerdem habe ich ein kleines Team geleitet.", note: "Derselbe Satz zur Erfahrung wie in Lektion 2, mit einem zusätzlichen Detail: Sie hat ein Team geleitet."}
  en.a2.unit30.lesson04.teach.q_what_strength: {title: "Nach einer Stärke fragen", gloss: "Die Interviewerin sagt: Das ist großartig. Was ist eine Ihrer Stärken?", note: "Die Interviewerin reagiert positiv und stellt dann die nächste Frage."}
  en.a2.unit30.lesson04.teach.a_organized_deadlines: {title: "Mias Antwort zu ihrer Stärke", gloss: "Mia sagt: Ich bin sehr gut organisiert und halte meine Fristen ein.", note: "Mia nennt ihre Stärke (organisiert) und ein konkretes Beispiel (Fristen einhalten)."}
  en.a2.unit30.lesson04.teach.q_have_questions: {title: "Fragen, ob es noch Fragen gibt", gloss: "Die Interviewerin fragt: Haben Sie noch Fragen zur Stelle?", note: "Eine feste Frage am Ende eines Bewerbungsgesprächs."}
  en.a2.unit30.lesson04.teach.a_wondering_typical_week: {title: "Mia stellt eine eigene Frage", gloss: "Mia sagt: Ja, mich würde interessieren, wie eine typische Arbeitswoche auf dieser Stelle aussieht.", note: "*I was wondering...* ist eine höfliche Art, selbst eine Frage zu stellen."}

