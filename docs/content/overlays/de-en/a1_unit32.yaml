  en.a1.unit32.lesson03.teach.dialogue_line1:
    title: Daniels Frage
    gloss: 'Daniel fragt: Mia, hast du Haustiere?'
    note: Für *any* gibt es in dieser Frage kein eigenes deutsches Wort, im Englischen darf es aber nicht weggelassen werden.
  en.a1.unit32.lesson03.teach.dialogue_line2:
    title: Mias Antwort
    gloss: 'Mia sagt: Ja, ich habe eine Katze. Sie heißt Luna.'
    note: Für die Katze stehen *she* und *her*, weil ihr weibliches Geschlecht bekannt ist. Das entspricht hier dem deutschen „sie“ und „ihr“.
  en.a1.unit32.lesson03.teach.dialogue_line3:
    title: Daniels nächste Frage
    gloss: 'Daniel sagt: Das ist schön! Spielt sie gern?'
    note: '*Does* ist hier das Hilfsverb zu *she*, wie auch in Fragen zum Aussehen.'
  en.a1.unit32.lesson03.teach.dialogue_line4:
    title: Mias Antwort
    gloss: 'Mia sagt: Ja, sie spielt sehr gern mit einem Ball. Und du?'
    note: '*What about you?* ist eine kurze, natürliche Art, dieselbe Frage zurückzustellen.'
  en.a1.unit32.lesson03.teach.dialogue_line5:
    title: Daniels Antwort
    gloss: 'Daniel sagt: Ich habe einen kleinen Fisch, aber ich möchte einen Hund.'
    note: '*but* verbindet hier zwei gegensätzliche Gedanken: Er hat bereits ein Haustier, möchte aber ein anderes Tier.'
  en.a1.unit32.lesson04.teach.reading_passage:
    title: Text über Leila und Daniel
    gloss: Leila hat einen Hund namens Max. Er ist groß und sehr freundlich. Sie geht jeden Morgen mit ihm Gassi. Daniel hat keinen Hund, aber er hat einen kleinen Fisch. Der Fisch muss nicht Gassi gehen, aber Daniel sieht ihm trotzdem gern beim Schwimmen zu.
    note: Für Max steht *he*, weil er ein männliches Tier ist. Wie im Deutschen richtet sich das Pronomen hier nach dem tatsächlichen Geschlecht.
