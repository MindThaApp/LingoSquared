    title: pet
    gloss: Haustier
    note: '*pet* bedeutet Haustier; *pets* ist der Plural. Achten Sie in der Frage *Do you have any pets?* auf *any*. Im Englischen verwendet man *any* in Fragen und Verneinungen bei Plural- und nicht zählbaren Wörtern. Im Deutschen kann die Frage einfach „Hast du Haustiere?“ lauten; im Englischen darf *any* hier nicht fehlen.'
    example_gloss: Hast du Haustiere?
  en.a1.unit32.lesson02.teach.name_is:
    title: Her name is Luna.
    gloss: Sie heißt Luna.
    note: 'Im Englischen verwendet man *her*/*his* und *she*/*he* für ein Tier, wenn sein Geschlecht bekannt ist. Das ist dem Deutschen ähnlich: *Her name is Luna* handelt von einem weiblichen Tier.'
  en.a1.unit32.lesson02.teach.play:
