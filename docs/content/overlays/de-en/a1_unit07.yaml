course:
  title: "Englisch A1"
  description: "Englisch auf A1-Niveau lernen, für Begrüßungen und kurze Gespräche im Alltag, mit ausführlichen deutschen Erklärungen."

units:
  en.a1.unit07.food:
    title: "Essen, Trinken und Bestellen"

lessons:
  en.a1.unit07.lesson01.food_drink_vocabulary: {title: "Übliches Essen und Trinken"}
  en.a1.unit07.lesson02.ordering_phrases: {title: "Höflich bestellen"}
  en.a1.unit07.lesson03.reading_a_menu: {title: "Eine einfache Speisekarte lesen"}
  en.a1.unit07.lesson04.cafe_dialogue: {title: "Im Café bestellen"}

teaching:
  en.a1.unit07.lesson01.teach.coffee: {title: "coffee", gloss: "Kaffee", note: "*coffee* bedeutet Kaffee.", example_gloss: "Ich möchte einen Kaffee, bitte."}
  en.a1.unit07.lesson01.teach.tea: {title: "tea", gloss: "Tee", note: "*tea* bedeutet Tee.", example_gloss: "Ich trinke gern Tee."}
  en.a1.unit07.lesson01.teach.water: {title: "water", gloss: "Wasser", note: "*water* bedeutet Wasser.", example_gloss: "Ich möchte ein Wasser, bitte."}
  en.a1.unit07.lesson01.teach.bread: {title: "bread", gloss: "Brot", note: "*bread* bedeutet Brot.", example_gloss: "Ich esse gern Brot."}
  en.a1.unit07.lesson01.teach.soup: {title: "soup", gloss: "Suppe", note: "*soup* bedeutet Suppe.", example_gloss: "Ich möchte eine Suppe, bitte."}
  en.a1.unit07.lesson01.teach.salad: {title: "salad", gloss: "Salat", note: "*salad* bedeutet Salat.", example_gloss: "Ich möchte einen Salat, bitte."}
  en.a1.unit07.lesson01.teach.sandwich: {title: "sandwich", gloss: "Sandwich", note: "*sandwich* schreibt man wie im Deutschen, nur klein: *sandwich*.", example_gloss: "Ich möchte ein Sandwich, bitte."}

  en.a1.unit07.lesson02.teach.id_like: {title: "I'd like a coffee, please.", gloss: "Ich möchte einen Kaffee, bitte.", note: "*I'd like* ist eine höfliche Bestellformel, ähnlich wie 'ich möchte'."}
  en.a1.unit07.lesson02.teach.can_i_have: {title: "Can I have a sandwich, please?", gloss: "Kann ich bitte ein Sandwich haben?", note: "*Can I have...?* ist eine weitere höfliche Bestellformel."}
  en.a1.unit07.lesson02.teach.anything_else: {title: "Anything else?", gloss: "Sonst noch etwas?", note: "*Anything else?* fragt, ob man noch mehr bestellen möchte."}
  en.a1.unit07.lesson02.teach.thats_all: {title: "No, that's all, thanks.", gloss: "Nein, das ist alles, danke.", note: "*that's all* bedeutet 'das ist alles.'"}
  en.a1.unit07.lesson02.teach.for_here_or_to_go: {title: "For here or to go?", gloss: "Für hier oder zum Mitnehmen?", note: "*For here* bedeutet 'für hier' (Sie essen oder trinken im Café), *to go* bedeutet 'zum Mitnehmen'."}
  en.a1.unit07.lesson03.teach.menu: {title: "menu", gloss: "Speisekarte", note: "*menu* bedeutet Speisekarte.", example_gloss: "Ich lese die Speisekarte."}
  en.a1.unit07.lesson03.teach.price: {title: "price", gloss: "Preis", note: "*price* bedeutet Preis.", example_gloss: "Der Preis ist gut."}
  en.a1.unit07.lesson03.teach.menu_text: {title: "Cafe Menu", gloss: "Café-Speisekarte: Kaffee - 3 Dollar. Tee - 2 Dollar. Suppe - 5 Dollar. Sandwich - 6 Dollar.", note: "Das Dollarzeichen steht VOR der Zahl (*$3*), anders als beim Euro-Zeichen, das NACH der Zahl steht."}
  en.a1.unit07.lesson04.teach.thats_x_dollars: {title: "That's nine dollars.", gloss: "Das macht neun Dollar.", note: "Im Englischen (US) zahlt man in *dollars*, nicht in Euro -- die Satzstruktur *That's X dollars* entspricht dem deutschen 'Das macht X Euro.'"}
  en.a1.unit07.lesson04.teach.q_order: {title: "Leila bestellt", gloss: "Leila: Hallo, ich möchte einen Kaffee und ein Sandwich, bitte.", note: "*Hi* ist eine lockere Begrüßung, passend für ein Café."}
  en.a1.unit07.lesson04.teach.a_anything_else: {title: "Nachfrage der Bedienung", gloss: "Bedienung: Klar. Sonst noch etwas?", note: "*Sure* bedeutet hier 'klar' oder 'gerne.'"}
  en.a1.unit07.lesson04.teach.reply_thats_all: {title: "Antwort von Leila", gloss: "Leila: Nein, das ist alles, danke.", note: "Eine vollständige Antwort bestätigt, dass die Bestellung komplett ist."}
  en.a1.unit07.lesson04.teach.q_for_here: {title: "Frage der Bedienung", gloss: "Bedienung: Für hier oder zum Mitnehmen?", note: "Diese Frage hört man in amerikanischen Cafés oft nach der Bestellung."}
  en.a1.unit07.lesson04.teach.reply_for_here: {title: "Antwort von Leila", gloss: "Leila: Für hier, bitte.", note: "*For here* zeigt, dass Leila im Café bleiben möchte."}
  en.a1.unit07.lesson04.teach.closing_price: {title: "Abschluss der Bedienung", gloss: "Bedienung: OK, das macht neun Dollar.", note: "*OK* leitet die abschließende Preisangabe ein."}

exercises:
  en.a1.unit07.lesson01.exercise01.listen_food:
    instruction: "Hören Sie zu und wählen Sie das genannte Wort."
    correct_option: "soup"
    distractors: ["sandwich", "salad", "bread"]
    accepted_answers: [{value: "soup", status: "correct"}]
    feedback: "*soup* bedeutet Suppe."
  en.a1.unit07.lesson01.exercise02.choose_drink:
    instruction: "Welches dieser Wörter ist ein heißes Getränk?"
    correct_option: "coffee"
    distractors: ["water", "bread", "salad"]
    accepted_answers: [{value: "coffee", status: "correct"}]
    feedback: "*coffee* bedeutet Kaffee."
  en.a1.unit07.lesson01.exercise03.choose_bread:
    instruction: "Welches Wort bedeutet Brot?"
    correct_option: "bread"
    distractors: ["soup", "salad", "water"]
    accepted_answers: [{value: "bread", status: "correct"}]
    feedback: "*bread* bedeutet Brot."
  en.a1.unit07.lesson01.exercise04.match_food_words:
    instruction: "Verbinden Sie jedes englische Wort mit der richtigen deutschen Beschreibung."
    pairs:
      - {left: "coffee", right: "heißes dunkles Getränk aus gerösteten Bohnen"}
      - {left: "tea", right: "heißes Getränk aus aufgegossenen Blättern"}
      - {left: "water", right: "geschmacksneutrales Getränk"}
      - {left: "bread", right: "gebackenes Grundnahrungsmittel aus Mehl"}
      - {left: "soup", right: "warme flüssige Speise"}
      - {left: "salad", right: "Gericht aus gemischtem Gemüse"}
      - {left: "sandwich", right: "belegtes Brot aus zwei Scheiben"}
    accepted_answers:
      - value:
          - {left: "coffee", right: "heißes dunkles Getränk aus gerösteten Bohnen"}
          - {left: "tea", right: "heißes Getränk aus aufgegossenen Blättern"}
          - {left: "water", right: "geschmacksneutrales Getränk"}
          - {left: "bread", right: "gebackenes Grundnahrungsmittel aus Mehl"}
          - {left: "soup", right: "warme flüssige Speise"}
          - {left: "salad", right: "Gericht aus gemischtem Gemüse"}
          - {left: "sandwich", right: "belegtes Brot aus zwei Scheiben"}
        status: "correct"
    feedback: "*coffee*=Kaffee, *tea*=Tee, *water*=Wasser, *bread*=Brot, *soup*=Suppe, *salad*=Salat, *sandwich*=Sandwich."
  en.a1.unit07.lesson01.exercise05.write_sandwich:
    instruction: "Schreiben Sie auf Englisch das Wort für ein belegtes Brot."
    accepted_answers:
      - {value: "sandwich", status: "correct"}
      - {value: "sandwich.", status: "correct"}
    feedback: "*sandwich* bedeutet Sandwich."

  en.a1.unit07.lesson02.exercise01.listen_order_phrase:
    instruction: "Hören Sie zu und wählen Sie den Satz, den Sie hören."
    correct_option: "I'd like a coffee, please"
    distractors: ["Can I have a sandwich, please?", "Anything else?", "For here or to go?"]
    accepted_answers: [{value: "I'd like a coffee, please", status: "correct"}]
    feedback: "*I'd like a coffee, please* bedeutet 'Ich möchte einen Kaffee, bitte.'"
  en.a1.unit07.lesson02.exercise02.choose_order:
    instruction: "Bestellen Sie höflich ein Sandwich."
    correct_option: "Can I have a sandwich, please?"
    distractors: ["I'd like a coffee, please.", "Anything else?", "For here or to go?"]
    accepted_answers: [{value: "Can I have a sandwich, please?", status: "correct"}]
    feedback: "*Can I have a sandwich, please?* bedeutet 'Kann ich bitte ein Sandwich haben?'"
  en.a1.unit07.lesson02.exercise03.order_id_like:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um höflich einen Kaffee zu bestellen."
    accepted_answers: [{value: ["I'd", "like", "a", "coffee", "please"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *I'd like a coffee, please.*"
  en.a1.unit07.lesson02.exercise04.reply_anything_else:
    instruction: "Antworten Sie auf 'Anything else?': Nein, das ist alles, danke."
    accepted_answers:
      - {value: "No, that's all, thanks.", status: "correct"}
      - {value: "No, that's all, thanks", status: "correct"}
      - {value: "No, that's all, thank you.", status: "correct"}
      - {value: "No, thanks, that's all.", status: "correct"}
      - {value: "No, that's all.", status: "acceptable_with_note", note: "Richtig, aber höflicher mit *thanks* am Ende: *No, that's all, thanks.*"}
      - {value: "That's all, thanks.", status: "acceptable_with_note", note: "Richtig; die vollständige Antwort beginnt mit *No*: *No, that's all, thanks.*"}
    feedback: "*No, that's all, thanks* bedeutet 'Nein, das ist alles, danke.'"
  en.a1.unit07.lesson02.exercise05.write_order:
    instruction: "Schreiben Sie auf Englisch, wie Sie höflich einen Kaffee bestellen."
    accepted_answers:
      - {value: "I'd like a coffee, please", status: "correct"}
      - {value: "I'd like a coffee, please.", status: "correct"}
      - {value: "Can I have a coffee, please?", status: "correct"}
      - {value: "I would like a coffee, please.", status: "correct"}
      - {value: "Hi, I'd like a coffee, please.", status: "correct"}
      - {value: "Can I have a coffee?", status: "acceptable_with_note", note: "Richtig, aber höflicher mit *please*: *Can I have a coffee, please?*"}
      - {value: "I'd like a coffee.", status: "acceptable_with_note", note: "Richtig, aber höflicher mit *please*: *I'd like a coffee, please.*"}
    feedback: "*I'd like a coffee, please* bedeutet 'Ich möchte einen Kaffee, bitte.'"

  en.a1.unit07.lesson03.exercise01.read_coffee_price:
    instruction: "Wie viel kostet der Kaffee?"
    correct_option: "$3"
    distractors: ["$2", "$5", "$6"]
    accepted_answers: [{value: "$3", status: "correct"}]
    feedback: "Die Speisekarte listet *Coffee - $3* -- der Kaffee kostet 3 Dollar."
  en.a1.unit07.lesson03.exercise02.read_soup_price:
    instruction: "Wie viel kostet die Suppe?"
    correct_option: "$5"
    distractors: ["$3", "$2", "$6"]
    accepted_answers: [{value: "$5", status: "correct"}]
    feedback: "Die Speisekarte listet *Soup - $5* -- die Suppe kostet 5 Dollar."
  en.a1.unit07.lesson03.exercise03.choose_cheapest:
    instruction: "Welcher Artikel auf der Speisekarte ist am billigsten?"
    correct_option: "Tea"
    distractors: ["Coffee", "Soup", "Sandwich"]
    accepted_answers: [{value: "Tea", status: "correct"}]
    feedback: "*Tea* für 2 Dollar ist der billigste Artikel auf dieser (amerikanischen) Speisekarte."
  en.a1.unit07.lesson03.exercise04.match_menu_prices:
    instruction: "Verbinden Sie jeden Artikel mit seinem Preis."
    accepted_answers:
      - value:
          - {left: "Coffee", right: "$3"}
          - {left: "Tea", right: "$2"}
          - {left: "Soup", right: "$5"}
          - {left: "Sandwich", right: "$6"}
        status: "correct"
    feedback: "Coffee=$3, Tea=$2, Soup=$5, Sandwich=$6."
  en.a1.unit07.lesson03.exercise05.write_menu_item:
    instruction: "Schreiben Sie auf Englisch den teuersten Artikel der Speisekarte und seinen Preis."
    accepted_answers:
      - {value: "Sandwich $6", status: "correct"}
      - {value: "Sandwich - $6", status: "correct"}
      - {value: "Sandwich 6 dollars", status: "correct"}
      - {value: "Sandwich six dollars", status: "correct"}
      - {value: "The sandwich is $6.", status: "correct"}
      - {value: "The sandwich is six dollars.", status: "correct"}
    feedback: "*Sandwich* für 6 Dollar ist der teuerste Artikel."

  en.a1.unit07.lesson04.exercise01.listen_order:
    instruction: "Hören Sie das Gespräch. Was bestellt Leila?"
    correct_option: "I'd like a coffee and a sandwich, please"
    distractors: ["I'd like a tea and a salad, please", "I'd like a coffee and a soup, please", "I'd like a tea and a sandwich, please"]
    accepted_answers: [{value: "I'd like a coffee and a sandwich, please", status: "correct"}]
    feedback: "Leila sagt: *I'd like a coffee and a sandwich, please* -- 'Ich möchte einen Kaffee und ein Sandwich, bitte.'"
  en.a1.unit07.lesson04.exercise02.listen_price:
    instruction: "Hören Sie noch einmal. Wie viel kostet die Bestellung laut der Bedienung?"
    correct_option: "That's nine dollars"
    distractors: ["That's six dollars", "That's five dollars", "That's three dollars"]
    accepted_answers: [{value: "That's nine dollars", status: "correct"}]
    feedback: "*That's nine dollars* bedeutet 'Das macht neun Dollar.' (Kaffee $3 + Sandwich $6 = $9.)"
  en.a1.unit07.lesson04.exercise03.choose_for_here_reply:
    instruction: "Leila möchte im Café essen, nicht das Essen mitnehmen. Was sagt sie?"
    correct_option: "For here, please."
    distractors: ["To go, please.", "Anything else?", "No, that's all, thanks."]
    accepted_answers: [{value: "For here, please.", status: "correct"}]
    feedback: "*For here, please* bedeutet 'Für hier, bitte.'"
  en.a1.unit07.lesson04.exercise04.order_for_here_question:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um zu fragen: Für hier oder zum Mitnehmen?"
    accepted_answers: [{value: ["For", "here", "or", "to", "go"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *For here or to go?*"
  en.a1.unit07.lesson04.exercise05.reply_as_leila:
    instruction: "Bestellen Sie einen Kaffee und ein Sandwich, sagen Sie, dass das alles ist, und sagen Sie, dass Sie hier essen möchten."
    accepted_answers:
      - {value: "I'd like a coffee and a sandwich, please. No, that's all, thanks. For here, please.", status: "correct"}
      - {value: "I'd like a coffee and a sandwich, please, and that's all, thanks -- for here, please.", status: "correct"}
      - {value: "I'd like a coffee and a sandwich please No that's all thanks For here please", status: "correct"}
      - {value: "Hi, I'd like a coffee and a sandwich, please. No, that's all, thanks. For here, please.", status: "correct"}
      - {value: "Can I have a coffee and a sandwich, please? No, that's all, thanks. For here, please.", status: "correct"}
      - {value: "Hi, can I have a coffee and a sandwich, please? No, that's all, thanks. For here, please.", status: "correct"}
      - {value: "I'd like a coffee and a sandwich, please. No, that's all, thank you. For here, please.", status: "correct"}
      - {value: "I would like a coffee and a sandwich, please. No, that's all, thanks. For here, please.", status: "correct"}
    feedback: "Eine vollständige Antwort bestellt beide Artikel, bestätigt, dass das alles ist, und sagt, dass man hier isst."
  en.a1.unit07.lesson04.exercise06.speak_order:
    instruction: "Bestellen Sie einen Kaffee und ein Sandwich, sagen Sie, dass das alles ist, und sagen Sie, dass Sie hier essen möchten."
    accepted_answers:
      - {value: "I'd like a coffee and a sandwich please No that's all thanks For here please", status: "correct"}
      - {value: "I'd like a coffee and a sandwich, please. No, that's all, thanks. For here, please.", status: "correct"}
      - {value: "Hi, I'd like a coffee and a sandwich, please. No, that's all, thanks. For here, please.", status: "correct"}
      - {value: "Can I have a coffee and a sandwich, please? No, that's all, thanks. For here, please.", status: "correct"}
      - {value: "Hi, can I have a coffee and a sandwich, please? No, that's all, thanks. For here, please.", status: "correct"}
      - {value: "I'd like a coffee and a sandwich, please. No, that's all, thank you. For here, please.", status: "correct"}
      - {value: "I would like a coffee and a sandwich, please. No, that's all, thanks. For here, please.", status: "correct"}
    feedback: "Diese vollständige Antwort deckt die Bestellung, die Bestätigung und die Antwort auf die Frage für hier oder zum Mitnehmen ab."
