teaching:
  en.a1.unit36.lesson01.teach.class:
    title: class
    gloss: Unterricht
    note: '*class* bedeutet Unterricht oder Kurs (ein Treffen, bei dem man etwas lernt).'
    example_gloss: Ich habe jeden Dienstagabend Unterricht.
  en.a1.unit36.lesson01.teach.course:
    title: course
    gloss: Lehrgang
    note: '*course* bedeutet Lehrgang oder Kurs (eine Reihe von Unterrichtsstunden zu einem Thema).'
    example_gloss: Er macht dieses Jahr einen Computerkurs.
  en.a1.unit36.lesson01.teach.student:
    title: student
    gloss: Schüler / Student
    note: '*student* bedeutet Schüler, Student oder Kursteilnehmer: jemand, der in der Schule oder in einem Kurs lernt.'
    example_gloss: Sie ist Studentin an einer Volkshochschule.
  en.a1.unit36.lesson01.teach.homework:
    title: homework
    gloss: Hausaufgaben
    note: '*homework* bedeutet Hausaufgaben.'
    example_gloss: Ich mache meine Hausaufgaben nach dem Abendessen.
  en.a1.unit36.lesson01.teach.subject:
    title: subject
    gloss: Fach
    note: '*subject* bedeutet Fach (ein Thema, das man lernt).'
    example_gloss: Mathe ist mein Lieblingsfach.
  en.a1.unit36.lesson01.teach.test:
    title: test
    gloss: Prüfung
    note: '*test* bedeutet Prüfung oder Test.'
    example_gloss: Wir haben am Freitag eine Prüfung.
  en.a1.unit36.lesson02.teach.take_a_class:
    title: take a class
    gloss: einen Kurs besuchen
    note: '*take a class* ist die feste englische Verbindung für "einen Kurs besuchen" oder "belegen". Übersetzen Sie das deutsche "besuchen" oder "belegen" nicht wörtlich (*visit a class* klingt im Englischen falsch); Sie verwenden immer *take*.'
    example_gloss: Ich besuche jeden Dienstagabend einen Kurs.
  en.a1.unit36.lesson02.teach.do_homework:
    title: do homework
    gloss: Hausaufgaben machen
    note: '*do homework*: Das Verb ist *do*, nicht *make*. Das ist eine Falle, denn im Deutschen sagt man "Hausaufgaben machen", und "machen" entspricht oft *make*.'
    example_gloss: Er macht seine Hausaufgaben nach dem Abendessen.
  en.a1.unit36.lesson02.teach.study_for_a_test:
    title: study for a test
    gloss: für eine Prüfung lernen
    note: '*study for a test* bedeutet für eine Prüfung lernen. *For* gibt hier das Ziel an (wofür man lernt).'
    example_gloss: Ich lerne jeden Freitag für eine Prüfung.
  en.a1.unit36.lesson02.teach.community_college:
    title: community college
    gloss: Volkshochschule (örtliche Bildungseinrichtung für Erwachsene)
    note: '*community college* ist eine amerikanische Bildungseinrichtung, an der vor allem Erwachsene neben ihrer Arbeit Kurse besuchen. Eine Volkshochschule kommt dem nahe, ist aber nicht dasselbe, denn ein *community college* bietet auch Abschlüsse an. Deshalb wird der englische Begriff oft einfach übernommen.'
    example_gloss: Sie studiert an einer Volkshochschule.
  en.a1.unit36.lesson02.teach.in_the_evening:
    title: in the evening
    gloss: abends
    note: '*in the evening* bedeutet abends oder am Abend.'
    example_gloss: Mein Kurs ist abends.
  en.a1.unit36.lesson02.teach.what_are_you_studying_question:
    title: What are you studying?
    gloss: Was lernst du gerade?
    note: Diese Frage verwendet das present continuous (*are you studying*) für etwas, womit man sich gerade in dieser Lebensphase beschäftigt. Im Deutschen genügt dafür das normale Präsens ("Was studierst du?"); im Englischen wählen Sie nicht die einfache Gegenwart.
  en.a1.unit36.lesson03.teach.dialogue_line1:
    title: Daniels Frage
    gloss: 'Daniel fragt: Hast du heute nach der Arbeit noch etwas vor?'
    note: '*anything* bedeutet hier "irgendetwas" und steht in einer Frage.'
  en.a1.unit36.lesson03.teach.dialogue_line2:
    title: "Mias Antwort"
    gloss: 'Mia sagt: Ja, ich habe heute Abend einen Fotokurs.'
    note: '*tonight* bedeutet heute Abend.'
  en.a1.unit36.lesson03.teach.dialogue_line3:
    title: Daniels Reaktion
    gloss: 'Daniel sagt: Oh, schön! Wo besuchst du den Kurs?'
    note: '*Where do you take it?*: Auch hier gehört *take* zum Besuchen eines Kurses, genau wie bei *take a class*.'
  en.a1.unit36.lesson03.teach.dialogue_line4:
    title: "Mias Antwort"
    gloss: 'Mia sagt: An der Volkshochschule in der Innenstadt. Er findet zweimal pro Woche statt.'
    note: '*twice a week*: Auch hier bedeutet *a* "pro".'
  en.a1.unit36.lesson03.teach.dialogue_line5:
    title: Daniels Frage
    gloss: 'Daniel sagt: Wie läuft es bisher?'
    note: '*so far* bedeutet bisher.'
  en.a1.unit36.lesson03.teach.dialogue_line6:
    title: "Mias Antwort"
    gloss: 'Mia sagt: Er gefällt mir richtig gut. Ich lerne, meine Kamera besser zu benutzen.'
    note: '*I''m learning how to ...*: present continuous für eine Fähigkeit, die man gerade entwickelt.'
  en.a1.unit36.lesson03.teach.dialogue_line7:
    title: Daniels letzte Bemerkung
    gloss: 'Daniel sagt: Super! Vielleicht kannst du es mir irgendwann mal beibringen.'
    note: '*sometime* bedeutet "irgendwann einmal": eine vage Zeitangabe in der Zukunft.'
  en.a1.unit36.lesson04.teach.reading_passage:
    title: Text über Daniel, Leila und Mia
    gloss: Daniel, Leila und Mia lernen alle etwas Neues neben der Arbeit. Daniel besucht montagabends einen Computerkurs, um neue Fähigkeiten für seinen Job zu lernen. Leila lernt Spanisch, weil sie irgendwann nach Mexiko reisen möchte. Mia hat zweimal pro Woche einen Fotokurs an der Volkshochschule, und sie macht schon deutlich bessere Fotos. Manchmal sprechen sie in der Mittagspause gemeinsam über ihre Kurse.
    note: '*takes a computer course*: Sie verwenden *take*, nicht *visit*; dieselbe Falle wie bei *take a class*.'
