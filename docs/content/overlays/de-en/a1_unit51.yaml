  en.a1.unit51.lesson03.teach.dialogue_line1:
    title: Der Apotheker begrüßt die Kunden
    gloss: 'Der Apotheker sagt: Hallo, kann ich Ihnen helfen?'
    note: '*Hi, can I help you?* bedeutet: Hallo, kann ich Ihnen helfen?'
  en.a1.unit51.lesson03.teach.dialogue_line2:
    title: Leilas Beschwerden
    gloss: 'Leila sagt: Ja, ich habe starken Husten und Schnupfen.'
    note: Wiederholung des zuvor gelernten Satzes.
  en.a1.unit51.lesson03.teach.dialogue_line3:
    title: Der Apotheker empfiehlt Hustensaft
    gloss: 'Der Apotheker sagt: Ich habe einen Hustensaft, der helfen sollte. Nehmen Sie ihn vor dem Schlafengehen ein.'
    note: '*before bed* bedeutet vor dem Schlafengehen – dies bezieht sich auf den Hustensaft, nicht auf die Tabletten.'
  en.a1.unit51.lesson03.teach.dialogue_line4:
    title: Daniels Frage
    gloss: 'Daniel fragt: Haben Sie auch etwas gegen Halsschmerzen?'
    note: '*too* am Satzende bedeutet auch.'
  en.a1.unit51.lesson03.teach.dialogue_line5:
    title: Der Apotheker empfiehlt Tabletten
    gloss: 'Der Apotheker sagt: Ja, diese Tabletten helfen gut gegen Halsschmerzen. Nehmen Sie alle vier Stunden eine.'
    note: 'Hier geht es um die Dosierung der Tabletten: alle vier Stunden. Der Hustensaft wird zu einem anderen Zeitpunkt eingenommen, nämlich vor dem Schlafengehen.'
  en.a1.unit51.lesson03.teach.dialogue_line6:
    title: Leilas Entscheidung
    gloss: 'Leila sagt: Gut, ich nehme beides. Wie viel kostet das?'
    note: '*I''ll take both.* bedeutet: Ich nehme beides.'
  en.a1.unit51.lesson03.teach.dialogue_line7:
    title: Der Preis
    gloss: 'Der Apotheker sagt: Das macht neun Dollar.'
    note: Wiederholung des zuvor gelernten Satzes.
  en.a1.unit51.lesson03.teach.dialogue_line8:
    title: Leila bezahlt
    gloss: 'Leila sagt: Bitte schön. Vielen Dank!'
    note: '*Here you go.* bedeutet hier bitte schön und wird verwendet, wenn man jemandem etwas gibt.'
  en.a1.unit51.lesson04.teach.reading_passage:
    title: Text über einen Besuch in der Apotheke
    gloss: 'Ein Besuch in der Apotheke: Ein paar Tage nach ihrem Ausflug mit Mia in die Berge erkältete sich Leila. Sie hatte starken Husten und Schnupfen, und auch ihr Hals tat weh. Daniel begleitete sie zur Apotheke in der Nähe ihrer Wohnung. Der Apotheker hörte sich Leilas Beschwerden an und empfahl Hustensaft und Tabletten. Er sagte, sie solle den Hustensaft vor dem Schlafengehen und alle vier Stunden eine Tablette einnehmen. Leila bezahlte neun Dollar für beides. Auf dem Heimweg kaufte Daniel ihr außerdem eine Packung Taschentücher. Leila nahm an diesem Abend die Medikamente ein, und bis zum Wochenende war ihr Husten schon viel besser.'
    note: '*by the weekend* bedeutet bis zum Wochenende.'
