    title: Mias Einladung
    gloss: 'Mia fragt: Ich mache heute Abend Pasta. Hast du Lust, mir beim Kochen zu helfen?'
    note: '*Do you want to help me* + Verb*?* ist eine natürliche Art, jemanden zum Mithelfen einzuladen.'
  en.a1.unit41.lesson03.teach.dialogue_line2:
    title: Daniels Reaktion
    gloss: 'Daniel sagt: Klar! Ich bin allerdings kein besonders guter Koch.'
    note: '*though* am Ende eines Satzes drückt einen leichten Gegensatz aus, ungefähr wie ''allerdings'' oder ''aber'' im Deutschen.'
  en.a1.unit41.lesson03.teach.dialogue_line3:
    title: Mias Ermutigung
    gloss: 'Mia sagt: Kein Problem, ich zeige es dir. Kannst du diese Zwiebeln hacken?'
    note: '*I''ll show you* bedeutet: Ich zeige es dir.'
  en.a1.unit41.lesson03.teach.dialogue_line4:
    title: Daniels Frage
    gloss: 'Daniel sagt: Kein Problem. Wie klein soll ich sie schneiden?'
    note: '*should* drückt die Bitte um einen Rat aus.'
  en.a1.unit41.lesson03.teach.dialogue_line5:
    title: Mias Erklärung
    gloss: 'Mia sagt: In kleine Stücke, so. Jetzt kochen wir die Nudeln.'
    note: '*like this* bedeutet: so, auf diese Weise.'
  en.a1.unit41.lesson03.teach.dialogue_line6:
    title: Daniels Reaktion
    gloss: 'Daniel sagt: Darf ich die Soße probieren? Sie ist köstlich!'
    note: '*Can I* + Verb*?* bittet um Erlaubnis.'
  en.a1.unit41.lesson03.teach.dialogue_line7:
    title: Mias Abschluss
    gloss: 'Mia sagt: Super! Das Abendessen ist gleich fertig.'
    note: '*almost ready* bedeutet fast fertig.'
  en.a1.unit41.lesson04.teach.reading_passage:
    title: Text über das gemeinsame Kochen
    gloss: Daniel, Leila und Mia können unterschiedlich gut kochen. Seit Leila in eine neue Wohnung in Mias Nähe gezogen ist, kochen die drei Freunde oft zusammen das Abendessen. Leila ist eine gute Köchin. Sie macht oft Pasta nach dem alten Rezept ihrer Mutter. Auch Mia kocht gern, und sie hat Daniel beigebracht, wie man Zwiebeln hackt, ohne sich in die Finger zu schneiden. Daniel ist noch kein toller Koch, aber er lernt schnell. Gestern Abend hat Mia Daniel gebeten, ihr beim Pastakochen zu helfen. Er hackte die Zwiebeln, während Mia die Nudeln kochte und die Soße machte. Daniel probierte die Soße und sagte, sie sei köstlich. Leila kam gerade an, als das Essen fertig war, und die drei aßen zusammen in Mias Küche.
    note: '*arrived just as dinner was ready* bedeutet: kam an, gerade als das Essen fertig war.'
