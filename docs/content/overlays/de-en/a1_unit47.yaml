  en.a1.unit47.lesson03.teach.dialogue_line1:
    title: Mias Frage
    gloss: 'Mia fragt: Leila, geht es Max gut? Er wirkt in letzter Zeit ein bisschen müde.'
    note: '*He seems a little tired lately.* bedeutet: Er wirkt in letzter Zeit ein bisschen müde.'
  en.a1.unit47.lesson03.teach.dialogue_line2:
    title: Leilas Erklärung
    gloss: 'Leila sagt: Ihm geht es gut, keine Sorge. Er ist nur bald zur jährlichen Untersuchung fällig. Ich sollte den Tierarzt anrufen.'
    note: '*due for* bedeutet "fällig für" und wird für etwas verwendet, das zu einem bestimmten Zeitpunkt erledigt werden muss.'
  en.a1.unit47.lesson03.teach.dialogue_line3:
    title: Leila ruft beim Tierarzt an
    gloss: 'Leila sagt: Hallo, ich möchte gern einen Termin für die Untersuchung meines Hundes vereinbaren.'
    note: '*I''d like to* ist höflicher als *I want to*; ebenso klingt "ich möchte" höflicher als "ich will".'
  en.a1.unit47.lesson03.teach.dialogue_line4:
    title: Mias Frage
    gloss: 'Mia fragt: Was haben sie gesagt?'
    note: '*did they say* verwendet *did* als Hilfsverb in der Vergangenheit.'
  en.a1.unit47.lesson03.teach.dialogue_line5:
    title: "Leilas Antwort"
    gloss: 'Leila sagt: Sie haben am Donnerstag um 15 Uhr Zeit.'
    note: '*at 3pm* verwendet *at* für eine genaue Uhrzeit.'
  en.a1.unit47.lesson03.teach.dialogue_line6:
    title: Mias Rückfrage
    gloss: 'Mia fragt: Passt dir die Uhrzeit?'
    note: '*Does that time work for you?* ist die Frageform von that time works for you, mit *do*-Umschreibung wie bei früheren Fragen.'
  en.a1.unit47.lesson03.teach.dialogue_line7:
    title: Leilas Bestätigung
    gloss: 'Leila sagt: Ja, das passt mir. Donnerstag um 15 Uhr -- danke! Max'' Termin ist bestätigt.'
    note: '*Max''s appointment* verwendet das Besitz-*''s*; im Deutschen entspricht dem "Max'' Termin" oder "der Termin von Max".'
  en.a1.unit47.lesson04.teach.reading_passage:
    title: Text über das Vereinbaren eines Termins
    gloss: 'So vereinbaren Sie einen Termin: Wenn Sie zu einem Arzt, einem Zahnarzt oder einem anderen Dienst müssen, brauchen Sie in der Regel zuerst einen Termin. Rufen Sie an und sagen Sie, dass Sie gern einen Termin vereinbaren möchten. Die Mitarbeiterin am Empfang nennt Ihnen, welche Tage und Uhrzeiten frei sind. Wählen Sie eine Zeit, die Ihnen passt, und man bestätigt Ihren Termin. Wenn sich etwas ändert, rufen Sie erneut an und bitten Sie darum, den Termin zu verschieben. Letzte Woche rief Leila beim Tierarzt an, um einen Termin für die jährliche Untersuchung ihres Hundes Max zu vereinbaren. Man hatte am Donnerstag um 15 Uhr Zeit, und Leila bestätigte die Uhrzeit. Auch Daniel hat einen Termin -- er geht am Montagmorgen zur Kontrolle zum Zahnarzt. Er sagte, er sei nicht nervös, nur diese Woche ein bisschen beschäftigt.'
    note: '*a little busy this week* bedeutet: diese Woche ein bisschen beschäftigt.'
