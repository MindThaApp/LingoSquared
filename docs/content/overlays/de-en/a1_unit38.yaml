teaching:
  en.a1.unit38.lesson01.teach.chore:
    title: chore
    gloss: Hausarbeit / Haushaltsaufgabe
    note: '*chore* bedeutet eine Aufgabe im Haushalt, die man regelmäßig erledigt, um die Wohnung sauber und ordentlich zu halten.'
    example_gloss: Geschirr spülen ist meine unbeliebteste Hausarbeit.
  en.a1.unit38.lesson01.teach.dishes:
    title: dishes
    gloss: Geschirr / Abwasch
    note: '*dishes* bedeutet Geschirr oder Abwasch: Teller, Tassen und Besteck, die man spült.'
    example_gloss: Ich spüle nach dem Abendessen das Geschirr.
  en.a1.unit38.lesson01.teach.laundry:
    title: laundry
    gloss: Wäsche
    note: '*laundry* bedeutet Wäsche: Kleidung, die man wäscht, trocknet und zusammenlegt.'
    example_gloss: Sie wäscht sonntags die Wäsche.
  en.a1.unit38.lesson01.teach.vacuum:
    title: vacuum
    gloss: staubsaugen
    note: '*vacuum* bedeutet staubsaugen.'
    example_gloss: Er saugt jeden Samstag das Wohnzimmer.
  en.a1.unit38.lesson01.teach.trash:
    title: trash
    gloss: Müll
    note: '*trash* bedeutet Müll.'
    example_gloss: Kannst du den Müll rausbringen?
  en.a1.unit38.lesson01.teach.clean:
    title: clean
    gloss: putzen
    note: '*clean* bedeutet putzen oder sauber machen.'
    example_gloss: Wir putzen die Wohnung zusammen.
  en.a1.unit38.lesson02.teach.wash_the_dishes:
    title: wash the dishes
    gloss: das Geschirr spülen
    note: '*wash the dishes* bedeutet wörtlich das Geschirr spülen. *Do the dishes* ist genauso gebräuchlich und bedeutet dasselbe (den Abwasch machen).'
    example_gloss: Ich spüle jeden Abend das Geschirr.
  en.a1.unit38.lesson02.teach.do_the_laundry:
    title: do the laundry
    gloss: die Wäsche machen
    note: '*do the laundry* bedeutet die Wäsche machen oder waschen.'
    example_gloss: Sie macht sonntags die Wäsche.
  en.a1.unit38.lesson02.teach.take_out_the_trash:
    title: take out the trash
    gloss: den Müll rausbringen
    note: '*take out the trash* verwendet *take out*, nicht *do*. Anders als bei *do the laundry* oder *do the dishes* können Sie hier also nicht *do* verwenden.'
    example_gloss: Kannst du den Müll rausbringen?
  en.a1.unit38.lesson02.teach.clean_the_bathroom:
    title: clean the bathroom
    gloss: das Badezimmer putzen
    note: '*clean the bathroom* bedeutet das Badezimmer putzen.'
    example_gloss: Er putzt am Wochenende das Badezimmer.
  en.a1.unit38.lesson02.teach.need_to:
    title: need to
    gloss: müssen
    note: '*need to* bedeutet etwas tun müssen.'
    example_gloss: Ich muss dieses Wochenende das Wohnzimmer saugen.
  en.a1.unit38.lesson02.teach.can_you_help_me_with_question:
    title: Can you help me with the dishes?
    gloss: Kannst du mir beim Geschirrspülen helfen?
    note: Eine höfliche Art, um Hilfe bei einer Hausarbeit zu bitten.
  en.a1.unit38.lesson03.teach.dialogue_line1:
    title: Mia's probleem
    gloss: 'Mia sagt: Meine Wohnung ist ein Chaos. Dieses Wochenende bekomme ich Besuch.'
    note: '*a mess* bedeutet ein Chaos oder eine Unordnung.'
  en.a1.unit38.lesson03.teach.dialogue_line2:
    title: Daniels Angebot
    gloss: 'Daniel fragt: Möchtest du Hilfe beim Putzen?'
    note: '*Do you want some help ...ing?* ist eine natürliche Art, Hilfe anzubieten.'
  en.a1.unit38.lesson03.teach.dialogue_line3:
    title: "Mias Antwort"
    gloss: 'Mia sagt: Ja, gern! Ich muss das Wohnzimmer saugen und das Geschirr spülen.'
    note: '*I need to* + Verb bedeutet "ich muss" + Verb.'
  en.a1.unit38.lesson03.teach.dialogue_line4:
    title: Daniels Angebot
    gloss: 'Daniel sagt: Ich kann für dich staubsaugen. Du kannst das Geschirr spülen.'
    note: '*for you* bedeutet hier "für dich" im Sinne von "an deiner Stelle".'
  en.a1.unit38.lesson03.teach.dialogue_line5:
    title: Mias Ergänzung
    gloss: 'Mia sagt: Danke! Ich muss auch noch die Wäsche machen.'
    note: '*still need to* bedeutet "muss noch".'
  en.a1.unit38.lesson03.teach.dialogue_line6:
    title: Daniels Angebot
    gloss: 'Daniel sagt: Dafür habe ich heute keine Zeit, aber ich kann den Müll rausbringen, bevor ich gehe.'
    note: '*before I leave* bedeutet "bevor ich gehe".'
  en.a1.unit38.lesson03.teach.dialogue_line7:
    title: Mias Dank
    gloss: 'Mia sagt: Das würde sehr helfen. Vielen herzlichen Dank!'
    note: '*That would help a lot* bedeutet "das würde sehr helfen". *Would* macht es hier höflicher.'
  en.a1.unit38.lesson04.teach.reading_passage:
    title: Text über Hausarbeit zu Hause
    gloss: Daniel, Leila und Mia haben alle ihre eigenen Gewohnheiten bei der Hausarbeit. Daniel spült jeden Abend nach dem Essen das Geschirr und saugt samstags seine Wohnung. Leila macht es nichts aus, die Wäsche zu machen, aber sie hasst es, das Badezimmer zu putzen. Mias Katze Luna verliert überall Haare, deshalb saugt Mia ihre Wohnung fast jeden Tag. Letztes Wochenende bekam Mia Besuch, also bot Daniel ihr seine Hilfe an. Er saugte das Wohnzimmer und brachte für sie den Müll raus. Mia war sehr dankbar für seine Hilfe.
    note: '*doesn''t mind* bedeutet "macht nichts aus" oder "hat nichts dagegen".'
