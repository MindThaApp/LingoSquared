course:
  title: "Englisch A1"
  description: "Englisch auf A1-Niveau lernen, für Begrüßungen und kurze Gespräche im Alltag, mit ausführlichen deutschen Erklärungen."

units:
  en.a1.unit05.time:
    title: "Die Uhrzeit sagen"

lessons:
  en.a1.unit05.lesson01.oclock_and_half: {title: "Volle und halbe Stunden"}
  en.a1.unit05.lesson02.quarter_times: {title: "Viertel nach und Viertel vor"}
  en.a1.unit05.lesson03.day_parts_schedules: {title: "Tageszeiten und einfache Öffnungszeiten"}
  en.a1.unit05.lesson04.schedule_dialogue: {title: "Bibliotheksöffnungszeiten: ein echtes Gespräch über den Zeitplan"}

teaching:
  en.a1.unit05.lesson01.teach.what_time: {title: "What time is it?", gloss: "Wie spät ist es?", note: "*What time is it?* fragt ganz allgemein nach der Uhrzeit."}
  en.a1.unit05.lesson01.teach.three_oclock: {title: "It's three o'clock.", gloss: "Es ist drei Uhr.", note: "*It's three o'clock.* nennt die volle Stunde."}
  en.a1.unit05.lesson01.teach.half_past: {title: "It's half past three.", gloss: "Es ist halb vier.", note: "Achtung, echte Falle: Auf Englisch zählt *half past three* die halbe Stunde NACH drei, also 3:30 -- im Deutschen sagt man halb vier (die Stunde, auf die man zusteuert), nicht halb drei. Wörtlich übersetzt klingt *half past three* wie 'halb nach drei', bedeutet aber genau 3:30, dieselbe Uhrzeit wie halb vier."}
  en.a1.unit05.lesson01.teach.five_oclock: {title: "It's five o'clock.", gloss: "Es ist fünf Uhr.", note: "*It's five o'clock.* nennt die volle Stunde 5:00."}

  en.a1.unit05.lesson02.teach.quarter_past: {title: "It's a quarter past three.", gloss: "Es ist Viertel nach drei.", note: "*It's a quarter past three.* bedeutet 3:15."}
  en.a1.unit05.lesson02.teach.quarter_to: {title: "It's a quarter to four.", gloss: "Es ist Viertel vor vier.", note: "*It's a quarter to four.* bedeutet 3:45."}
  en.a1.unit05.lesson02.teach.ten_past: {title: "It's ten past four.", gloss: "Es ist zehn nach vier.", note: "*It's ten past four.* bedeutet 4:10."}
  en.a1.unit05.lesson02.teach.ten_to: {title: "It's ten to five.", gloss: "Es ist zehn vor fünf.", note: "*It's ten to five.* bedeutet 4:50."}

  en.a1.unit05.lesson03.teach.morning: {title: "Morning", gloss: "Morgen", note: "*morning* bedeutet Morgen, etwa 6 bis 12 Uhr.", example_gloss: "Guten Morgen, Daniel!"}
  en.a1.unit05.lesson03.teach.afternoon: {title: "Afternoon", gloss: "Nachmittag", note: "*afternoon* bedeutet Nachmittag, etwa 12 bis 18 Uhr.", example_gloss: "Ich arbeite am Nachmittag."}
  en.a1.unit05.lesson03.teach.evening: {title: "Evening", gloss: "Abend", note: "*evening* bedeutet Abend, etwa 18 bis 22 Uhr.", example_gloss: "Guten Abend, Leila!"}
  en.a1.unit05.lesson03.teach.night: {title: "Night", gloss: "Nacht", note: "*night* bedeutet Nacht, etwa 22 bis 6 Uhr.", example_gloss: "Gute Nacht, Daniel!"}
  en.a1.unit05.lesson03.teach.at_nine_am: {title: "The store opens at nine in the morning.", gloss: "Der Laden öffnet um neun Uhr morgens.", note: "Im Amerikanischen steht *at* vor der Uhrzeit: *at nine*."}
  en.a1.unit05.lesson03.teach.at_six_pm: {title: "The store closes at six in the evening.", gloss: "Der Laden schließt um achtzehn Uhr (sechs Uhr abends).", note: "Im Englischen wird die Alltagszeit oft im 12-Stunden-Format mit Tageszeit gesagt (*six in the evening*), während das Deutsche für offizielle Öffnungszeiten oft das 24-Stunden-Format nutzt (achtzehn Uhr)."}

  en.a1.unit05.lesson04.teach.opens_at: {title: "Opens at", gloss: "öffnet um", note: "*opens at* + Uhrzeit bedeutet öffnet um + Uhrzeit.", example_gloss: "Die Bibliothek öffnet um neun."}
  en.a1.unit05.lesson04.teach.closes_at: {title: "Closes at", gloss: "schließt um", note: "*closes at* + Uhrzeit bedeutet schließt um + Uhrzeit.", example_gloss: "Die Bibliothek schließt um sechs."}
  en.a1.unit05.lesson04.teach.q_open: {title: "Daniel fragt nach der Öffnungszeit", gloss: "Daniel: Wann öffnet die Bibliothek?", note: "Dieselbe Frage wie zuvor gelernt, jetzt in einem echten Gespräch."}
  en.a1.unit05.lesson04.teach.a_open: {title: "Antwort zur Öffnungszeit", gloss: "Leila: Sie öffnet um neun Uhr morgens.", note: "Eine vollständige Antwort nennt die genaue Uhrzeit und die Tageszeit."}
  en.a1.unit05.lesson04.teach.q_close: {title: "Nach der Schließzeit fragen", gloss: "Daniel: Und wann schließt sie?", note: "*And* leitet die zweite Frage im selben Gespräch ein."}
  en.a1.unit05.lesson04.teach.a_close: {title: "Antwort zur Schließzeit", gloss: "Leila: Sie schließt um achtzehn Uhr (sechs Uhr abends).", note: "Eine vollständige Antwort nennt auch hier die genaue Uhrzeit."}
  en.a1.unit05.lesson04.teach.closing: {title: "Das Gespräch beenden", gloss: "Daniel: Großartig, bis um neun!", note: "*See you at nine!* bedeutet, dass man sich um neun Uhr wiedersieht."}

exercises:
  en.a1.unit05.lesson01.exercise01.listen_time_question:
    instruction: "Hören Sie zu und wählen Sie die Frage, die Sie hören."
    correct_option: "What time is it?"
    distractors: ["What day is it?", "Which month is it?", "How old are you?"]
    accepted_answers: [{value: "What time is it?", status: "correct"}]
    feedback: "*What time is it?* fragt allgemein nach der Uhrzeit."
  en.a1.unit05.lesson01.exercise02.choose_three_oclock:
    instruction: "Wählen Sie den passenden Satz zu 3:00."
    correct_option: "It's three o'clock."
    distractors: ["It's five o'clock.", "It's half past three.", "It's a quarter past three."]
    accepted_answers: [{value: "It's three o'clock.", status: "correct"}]
    feedback: "*It's three o'clock.* bedeutet Es ist drei Uhr."
  en.a1.unit05.lesson01.exercise03.choose_half_past:
    instruction: "Wählen Sie den passenden Satz zu 3:30."
    correct_option: "It's half past three."
    distractors: ["It's half past four.", "It's four o'clock.", "It's three o'clock."]
    accepted_answers: [{value: "It's half past three.", status: "correct"}]
    feedback: "*It's half past three.* bedeutet 3:30 -- anders als im Deutschen (halb vier) zählt das Englische die halbe Stunde NACH der genannten Stunde, nicht darauf zu."
  en.a1.unit05.lesson01.exercise04.order_five:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um 'It's five o'clock' zu sagen."
    accepted_answers: [{value: ["It's", "five", "o'clock"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *It's five o'clock.*"
  en.a1.unit05.lesson01.exercise05.write_time:
    instruction: "Schreiben Sie die Uhrzeit 3:00 in Worten auf Englisch."
    accepted_answers:
      - {value: "It's three o'clock", status: "correct"}
      - {value: "It's three o'clock.", status: "correct"}
    feedback: "3:00 schreibt man auf Englisch als *It's three o'clock.*"

  en.a1.unit05.lesson02.exercise01.listen_quarter:
    instruction: "Hören Sie zu und wählen Sie den Satz, den Sie hören."
    correct_option: "It's a quarter to four."
    distractors: ["It's a quarter past three.", "It's half past three.", "It's four o'clock."]
    accepted_answers: [{value: "It's a quarter to four.", status: "correct"}]
    feedback: "*It's a quarter to four.* bedeutet Es ist Viertel vor vier."
  en.a1.unit05.lesson02.exercise02.choose_quarter_past:
    instruction: "Wählen Sie den passenden Satz zu 3:15."
    correct_option: "It's a quarter past three."
    distractors: ["It's a quarter to three.", "It's half past three.", "It's three o'clock."]
    accepted_answers: [{value: "It's a quarter past three.", status: "correct"}]
    feedback: "*It's a quarter past three.* bedeutet Es ist Viertel nach drei."
  en.a1.unit05.lesson02.exercise03.choose_quarter_to:
    instruction: "Wählen Sie den passenden Satz zu 3:45."
    correct_option: "It's a quarter to four."
    distractors: ["It's a quarter past four.", "It's half past three.", "It's four o'clock."]
    accepted_answers: [{value: "It's a quarter to four.", status: "correct"}]
    feedback: "*It's a quarter to four.* bedeutet Es ist Viertel vor vier."
  en.a1.unit05.lesson02.exercise04.order_ten_past:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um 'It's ten past four' zu sagen."
    accepted_answers: [{value: ["It's", "ten", "past", "four"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *It's ten past four.*"
  en.a1.unit05.lesson02.exercise05.write_ten_to:
    instruction: "Schreiben Sie die Uhrzeit 4:50 in Worten auf Englisch."
    accepted_answers:
      - {value: "It's ten to five", status: "correct"}
      - {value: "It's ten to five.", status: "correct"}
    feedback: "4:50 schreibt man auf Englisch als *It's ten to five.*"

  en.a1.unit05.lesson03.exercise01.listen_day_part:
    instruction: "Hören Sie zu und wählen Sie die genannte Tageszeit."
    correct_option: "evening"
    distractors: ["morning", "afternoon", "night"]
    accepted_answers: [{value: "evening", status: "correct"}]
    feedback: "*evening* bedeutet Abend."
  en.a1.unit05.lesson03.exercise02.choose_open_time:
    instruction: "Wann öffnet der Laden?"
    correct_option: "The store opens at nine in the morning."
    distractors: ["The store closes at nine in the morning.", "The store opens at six in the evening.", "The store opens at nine at night."]
    accepted_answers: [{value: "The store opens at nine in the morning.", status: "correct"}]
    feedback: "*The store opens at nine in the morning.* bedeutet Der Laden öffnet um neun Uhr morgens."
  en.a1.unit05.lesson03.exercise03.choose_close_time:
    instruction: "Wann schließt der Laden?"
    correct_option: "The store closes at six in the evening."
    distractors: ["The store opens at six in the evening.", "The store closes at nine in the morning.", "The store closes at six in the morning."]
    accepted_answers: [{value: "The store closes at six in the evening.", status: "correct"}]
    feedback: "*The store closes at six in the evening.* bedeutet Der Laden schließt um achtzehn Uhr (sechs Uhr abends)."
  en.a1.unit05.lesson03.exercise04.match_day_parts:
    instruction: "Verbinden Sie jede Tageszeit mit ihrer ungefähren Uhrzeitspanne."
    accepted_answers:
      - value:
          - {left: "6 AM - 12 PM", right: "morning"}
          - {left: "12 PM - 5 PM", right: "afternoon"}
          - {left: "5 PM - 9 PM", right: "evening"}
          - {left: "9 PM - 6 AM", right: "night"}
        status: "correct"
    feedback: "*morning*=Morgen, *afternoon*=Nachmittag, *evening*=Abend, *night*=Nacht."
  en.a1.unit05.lesson03.exercise05.write_open_time:
    instruction: "Schreiben Sie, wann der Laden öffnet (9 Uhr morgens)."
    accepted_answers:
      - {value: "The store opens at nine in the morning", status: "correct"}
      - {value: "The store opens at nine in the morning.", status: "correct"}
    feedback: "*The store opens at nine in the morning.* bedeutet Der Laden öffnet um neun Uhr morgens."

  en.a1.unit05.lesson04.exercise01.listen_open_time:
    instruction: "Hören Sie das Gespräch. Wann öffnet die Bibliothek laut Leila?"
    accepted_answers: [{value: "It opens at nine in the morning", status: "correct"}]
    feedback: "Leila sagt: *It opens at nine in the morning.*"
  en.a1.unit05.lesson04.exercise02.listen_close_time:
    instruction: "Hören Sie noch einmal. Wann schließt die Bibliothek?"
    accepted_answers: [{value: "It closes at six in the evening", status: "correct"}]
    feedback: "Leila sagt: *It closes at six in the evening.*"
  en.a1.unit05.lesson04.exercise03.choose_open_question:
    instruction: "Fragen Sie, wann die Bibliothek öffnet."
    correct_option: "What time does the library open?"
    distractors: ["What time does the library close?", "What time is it?", "What time does the store open?"]
    accepted_answers: [{value: "What time does the library open?", status: "correct"}]
    feedback: "*What time does the library open?* bedeutet Wann öffnet die Bibliothek?"
  en.a1.unit05.lesson04.exercise04.order_close_question:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um zu fragen, wann sie schließt."
    accepted_answers: [{value: ["what", "time", "does", "it", "close"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *what time does it close?*"
  en.a1.unit05.lesson04.exercise05.reply_as_leila:
    instruction: "Antworten Sie als Leila: nennen Sie sowohl die Öffnungs- als auch die Schließzeit."
    accepted_answers:
      - {value: "It opens at nine in the morning. It closes at six in the evening.", status: "correct"}
      - {value: "It opens at nine in the morning, and it closes at six in the evening.", status: "correct"}
    feedback: "Eine vollständige Antwort nennt beide Uhrzeiten einzeln."
  en.a1.unit05.lesson04.exercise06.speak_hours:
    instruction: "Antworten Sie als Leila laut mit beiden Uhrzeiten."
    accepted_answers:
      - {value: "It opens at nine in the morning. It closes at six in the evening.", status: "correct"}
      - {value: "It opens at nine in the morning, and it closes at six in the evening.", status: "correct"}
      - {value: "It opens at nine in the morning It closes at six in the evening", status: "correct"}
    feedback: "Diese vollständige Antwort deckt sowohl die Öffnungs- als auch die Schließzeit ab."
