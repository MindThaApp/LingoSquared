teaching:
  en.a2.unit35.lesson01.teach.pharmacy: {title: "pharmacy", gloss: "Apotheke", note: "*pharmacy* ist das Geschäft, in dem man seine Medikamente bekommt.", example_gloss: "Neben der Arztpraxis gibt es eine Apotheke."}
  en.a2.unit35.lesson01.teach.pharmacist: {title: "pharmacist", gloss: "Apotheker / Apothekerin", note: "*pharmacist* ist die Person, die einem die Medikamente aushändigt.", example_gloss: "Der Apotheker hat mir erklärt, wie ich das Medikament einnehmen soll."}
  en.a2.unit35.lesson01.teach.tablet: {title: "tablet", gloss: "Tablette", note: "*tablet* ist ein einzelnes festes Stück Medikament, das man schluckt.", example_gloss: "Ich nehme morgens eine Tablette und abends noch eine."}
  en.a2.unit35.lesson01.teach.dose: {title: "dose", gloss: "Dosis", note: "*dose* ist die Menge Medikament, die man auf einmal einnimmt.", example_gloss: "Die Dosis ist eine Tablette, zweimal täglich."}
  en.a2.unit35.lesson01.teach.refill: {title: "refill", gloss: "Folgerezept / Nachschub", note: "*refill* ist eine neue Packung desselben Medikaments, ohne dass man erneut zum Arzt muss.", example_gloss: "Ich brauche Nachschub, denn meine Tabletten sind fast aufgebraucht."}
  en.a2.unit35.lesson01.teach.side_effects: {title: "side effects", gloss: "Nebenwirkungen", note: "*side effects* sind die zusätzlichen Wirkungen, die ein Medikament auf den Körper haben kann.", example_gloss: "Der Apotheker hat mir die Nebenwirkungen dieses Medikaments erklärt."}
  en.a2.unit35.lesson01.teach.grammar_frequency: {title: "Sagen, wie oft man etwas einnimmt", gloss: "einmal täglich, zweimal täglich, dreimal täglich, alle acht Stunden", note: "*once a day* = einmal täglich, *twice a day* = zweimal täglich, *three times a day* = dreimal täglich, *every eight hours* = alle acht Stunden."}

  en.a2.unit35.lesson02.teach.pick_up_prescription: {title: "Sagen, weshalb man am Tresen steht", gloss: "Ich möchte ein Rezept abholen.", note: "*I'd like to...* ist die höfliche Standardform, um zu sagen, was man möchte."}
  en.a2.unit35.lesson02.teach.take_one_tablet: {title: "Die Dosierung, die man zu hören bekommt", gloss: "Nehmen Sie zweimal täglich eine Tablette, zum Essen.", note: "*with food* bedeutet zum Essen, also nicht auf nüchternen Magen."}
  en.a2.unit35.lesson02.teach.ask_how_many_days: {title: "Fragen, wie lange man es einnehmen muss", gloss: "An wie vielen Tagen soll ich es einnehmen?", note: "*How many...?* verwendet man bei zählbaren Dingen wie Tagen."}
  en.a2.unit35.lesson02.teach.ask_side_effects: {title: "Nach Nebenwirkungen fragen", gloss: "Gibt es Nebenwirkungen?", note: "*Are there any...?* ist die übliche Art zu fragen, ob es etwas gibt."}
  en.a2.unit35.lesson02.teach.grammar_should: {title: "should und shouldn't für Anweisungen", gloss: "Sie sollten es zum Essen einnehmen. Sie sollten nicht zu früh damit aufhören.", note: "*should* gibt einen Rat oder eine Anweisung; *shouldn't* ist die verneinte Form."}

  en.a2.unit35.lesson03.teach.before_bed: {title: "before bed", gloss: "vor dem Schlafengehen", note: "*before bed* bedeutet, bevor man schlafen geht.", example_gloss: "Manche Medikamente wirken besser, wenn man sie vor dem Schlafengehen einnimmt."}
  en.a2.unit35.lesson03.teach.label_text: {title: "Das Apothekenetikett", gloss: "Erkältungsmittel. Zweimal täglich eine Tablette zum Essen einnehmen, fünf Tage lang. Die Tabletten nicht zu früh absetzen. Mögliche Nebenwirkungen: Sie können sich müde fühlen. Nachschub: einmal.", note: "Ein Apothekenetikett ist kurz und knapp: kurze Sätze und keine Höflichkeitsformen."}
  en.a2.unit35.lesson03.teach.do_not_stop_early: {title: "Der Warnhinweis auf dem Etikett", gloss: "Die Tabletten nicht zu früh absetzen.", note: "*Do not...* ist das Verbot in der Befehlsform, wie man es auf Etiketten und Schildern sieht."}

  en.a2.unit35.lesson04.teach.q_pick_up: {title: "Daniel meldet sich am Tresen", gloss: "Daniel sagt: Hallo, ich möchte ein Rezept abholen.", note: "*Hi* ist lockerer als *Hello*, am Tresen aber völlig üblich."}
  en.a2.unit35.lesson04.teach.a_what_is_your_name: {title: "Der Apotheker fragt nach dem Namen", gloss: "Der Apotheker sagt: Gern. Wie heißen Sie?", note: "*Of course* bedeutet hier: gern, kein Problem."}
  en.a2.unit35.lesson04.teach.q_doctor_gave_me_medicine: {title: "Daniel nennt den Grund für das Medikament", gloss: "Daniel sagt: Daniel. Der Arzt hat mir ein Mittel gegen eine starke Erkältung verschrieben.", note: "Das knüpft an den Arztbesuch aus Einheit 28 an: dieselbe Erkältung."}
  en.a2.unit35.lesson04.teach.a_here_it_is: {title: "Der Apotheker nennt die Dosierung", gloss: "Der Apotheker sagt: Bitte sehr. Nehmen Sie zweimal täglich eine Tablette, zum Essen.", note: "*Here it is* sagt man, wenn man jemandem etwas überreicht."}
  en.a2.unit35.lesson04.teach.q_how_many_days: {title: "Daniel fragt, wie lange", gloss: "Daniel fragt: An wie vielen Tagen soll ich es einnehmen?", note: "Dieselbe Frage wie in Lektion 2."}
  en.a2.unit35.lesson04.teach.a_five_days_no_stopping: {title: "Die Antwort des Apothekers", gloss: "Der Apotheker sagt: Fünf Tage lang. Setzen Sie die Tabletten nicht zu früh ab.", note: "Dieselbe Anweisung wie auf dem Etikett in Lektion 3."}
  en.a2.unit35.lesson04.teach.q_any_side_effects: {title: "Daniel fragt nach Nebenwirkungen", gloss: "Daniel fragt: Gibt es Nebenwirkungen?", note: "Dieselbe Frage wie in Lektion 2."}
  en.a2.unit35.lesson04.teach.a_you_may_feel_tired: {title: "Der Apotheker nennt die Nebenwirkung", gloss: "Der Apotheker sagt: Sie könnten sich müde fühlen, mehr nicht.", note: "*but that's all* bedeutet hier: aber mehr nicht."}
  en.a2.unit35.lesson04.teach.q_thank_you: {title: "Daniel bedankt sich beim Apotheker", gloss: "Daniel sagt: Vielen Dank.", note: "*very much* macht das Danken nachdrücklicher."}

