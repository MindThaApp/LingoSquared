course:
  title: "Englisch B1"
  description: "Englisch auf B1-Niveau lernen, für Pflichten, Möglichkeiten, hypothetische Situationen und Erzählungen im Alltag, mit ausführlichen deutschen Erklärungen."

units:
  en.b1.unit11.unreal_hypotheticals: {title: "If it were cheaper, I would sign up"}

lessons:
  en.b1.unit11.lesson01.unreal_hypothetical_vocabulary: {title: "Unwirkliche Situationen: would, if I were, regret"}
  en.b1.unit11.lesson02.unreal_present: {title: "If I had more time, I would"}
  en.b1.unit11.lesson03.reading_a_missed_opportunity: {title: "Lesen: eine verpasste Gelegenheit"}
  en.b1.unit11.lesson04.the_design_course_dialogue: {title: "Would you take the course?"}

teaching:
  en.b1.unit11.lesson01.teach.would: {title: "would", gloss: "würde", note: "*would* + Grundform drückt ein vorgestelltes Ergebnis oder eine höfliche Vorliebe aus.", example_gloss: "Ich würde mitmachen, wenn ich mehr Zeit hätte."}
  en.b1.unit11.lesson01.teach.would_rather: {title: "would rather", gloss: "lieber wollen, lieber tun", note: "*would rather* bedeutet, dass man etwas lieber tut als etwas anderes.", example_gloss: "Ich würde lieber den Wochenendkurs besuchen."}
  en.b1.unit11.lesson01.teach.if_i_were: {title: "if I were", gloss: "wenn ich wäre", note: "*if I were* leitet eine unwirkliche Situation über einen selbst ein.", example_gloss: "Wenn ich heute Abend frei wäre, würde ich hingehen."}
  en.b1.unit11.lesson01.teach.opportunity: {title: "opportunity", gloss: "Chance, Gelegenheit", note: "*opportunity* bedeutet eine gute Gelegenheit, etwas zu tun.", example_gloss: "Dieser Kurs ist eine gute Gelegenheit für Leila."}
  en.b1.unit11.lesson01.teach.regret: {title: "regret", gloss: "Bedauern, Reue", note: "*regret* bedeutet Bedauern oder Reue über eine Entscheidung in der Vergangenheit.", example_gloss: "Eines bedauert sie: dass sie nicht früher angefangen hat zu sparen."}
  en.b1.unit11.lesson01.teach.take_a_chance: {title: "take a chance", gloss: "etwas riskieren, es versuchen", note: "*take a chance* bedeutet, etwas zu versuchen, auch wenn der Erfolg nicht sicher ist.", example_gloss: "Wenn der Kurs billiger wäre, würde sie es riskieren."}

  en.b1.unit11.lesson02.teach.more_time_course: {title: "Eine unwirkliche Situation in der Gegenwart", gloss: "Wenn ich mehr Zeit hätte, würde ich einen Designkurs besuchen.", note: "Nach *if* steht für eine unwirkliche Situation in der Gegenwart die Vergangenheitsform: *If I had more time*. Das entspricht dem deutschen Konjunktiv II (hätte, wäre)."}
  en.b1.unit11.lesson02.teach.cheaper_sign_up: {title: "if it were cheaper", gloss: "Wenn er billiger wäre, würde ich mich heute anmelden.", note: "*were* klingt in einer unwirklichen Bedingung natürlich, auch bei *it*."}
  en.b1.unit11.lesson02.teach.grammar_unreal_present: {title: "Unwirkliche Bedingungen in der Gegenwart", gloss: "Wenn er billiger wäre, würde ich mich anmelden.", note: "Form: *if* + Vergangenheitsform, dann *would* + Grundform."}

  en.b1.unit11.lesson03.teach.sooner: {title: "sooner", gloss: "früher", note: "*sooner* bedeutet früher als zu dem Zeitpunkt, an dem es tatsächlich passiert ist.", example_gloss: "Wenn sie es früher gewusst hätte, hätte sie mehr Geld gespart."}
  en.b1.unit11.lesson03.teach.confident: {title: "confident", gloss: "selbstbewusst, zuversichtlich", note: "*confident* bedeutet, dass man das Gefühl hat, etwas gut zu können.", example_gloss: "Wenn Daniel mitmachen würde, würde Leila sich selbstbewusster fühlen."}
  en.b1.unit11.lesson03.teach.reading_passage: {title: "Lesetext: eine verpasste Gelegenheit", gloss: "Leila hat einen Designkurs gefunden, den sie unbedingt besuchen möchte. Er ist nützlich, aber teuer. Wenn er billiger wäre, würde sie sich heute anmelden. Wenn Daniel auch an dem Kurs teilnehmen würde, würde sie sich selbstbewusster fühlen. Ihr einziges Bedauern ist der Zeitpunkt: Wenn sie früher von dem Kurs gewusst hätte, hätte sie mehr Geld gespart.", note: "Ein kurzer Lesetext mit unwirklichen Bedingungen in Gegenwart und Vergangenheit."}

  en.b1.unit11.lesson04.teach.q_take_if_cheaper: {title: "Mia stellt eine hypothetische Frage", gloss: "Mia sagt: Leila, würdest du den Designkurs besuchen, wenn er billiger wäre?", note: "Eine höfliche, hypothetische Frage mit *would*."}
  en.b1.unit11.lesson04.teach.a_sign_up_today: {title: "Leila nennt das vorgestellte Ergebnis", gloss: "Leila sagt: Auf jeden Fall. Wenn er billiger wäre, würde ich mich heute anmelden.", note: "*If it were cheaper, I would...* beschreibt, was sie in einer anderen Situation tun würde."}
  en.b1.unit11.lesson04.teach.q_daniel_joined: {title: "Mia schlägt ein weiteres Szenario vor", gloss: "Mia sagt: Und wenn Daniel auch mitmachen würde?", note: "*What if...* leitet eine vorgestellte Möglichkeit ein."}
  en.b1.unit11.lesson04.teach.a_more_confident: {title: "Leila beschreibt ihr Gefühl", gloss: "Leila sagt: Wenn Daniel mitmachen würde, würde ich mich selbstbewusster fühlen.", note: "*joined* steht in der Vergangenheitsform, weil die Situation nur vorgestellt ist."}
  en.b1.unit11.lesson04.teach.q_would_rather_weekend: {title: "Mia nennt ihre Vorliebe", gloss: "Mia sagt: Ich würde lieber den Wochenendkurs besuchen als den Abendkurs.", note: "*would rather ... than ...* vergleicht zwei Vorlieben."}
  en.b1.unit11.lesson04.teach.a_known_sooner: {title: "Leila spricht über ein Bedauern in der Vergangenheit", gloss: "Leila sagt: Ich auch. Wenn ich früher davon gewusst hätte, hätte ich mehr Geld gespart.", note: "*if + past perfect, would have + Partizip* beschreibt eine unwirkliche Situation in der Vergangenheit."}

