teaching:
  en.b1.unit18.lesson01.teach.arrangement: {title: "arrangement", gloss: "Verabredung, feste Vereinbarung", note: "*arrangement* bedeutet einen Plan, der mit jemand anderem schon feststeht, zum Beispiel eine vereinbarte Uhrzeit.", example_gloss: "Mia hat am Freitag eine Verabredung mit Leila."}
  en.b1.unit18.lesson01.teach.intention: {title: "intention", gloss: "Absicht, Vorhaben", note: "*intention* bedeutet etwas, das man beschlossen hat zu tun, wofür man aber mit niemandem sonst schon eine Zeit festgelegt hat.", example_gloss: "Daniels Absicht ist es, das Projekt früh abzuschließen."}
  en.b1.unit18.lesson01.teach.prediction: {title: "prediction", gloss: "Vorhersage, Prognose", note: "*prediction* bedeutet eine Einschätzung dessen, was passieren wird, auf der Grundlage von Anzeichen.", example_gloss: "Meine Prognose ist, dass das Projekt rechtzeitig fertig wird."}
  en.b1.unit18.lesson01.teach.definitely: {title: "definitely", gloss: "auf jeden Fall, definitiv", note: "*definitely* zeigt, dass man sich völlig sicher ist, dass etwas passieren wird.", example_gloss: "Daniel macht den Bericht heute auf jeden Fall fertig."}
  en.b1.unit18.lesson01.teach.probably: {title: "probably", gloss: "wahrscheinlich", note: "*probably* zeigt, dass man ziemlich sicher ist, aber nicht völlig.", example_gloss: "Das Projekt dauert wahrscheinlich zwei Monate."}
  en.b1.unit18.lesson01.teach.might: {title: "might", gloss: "vielleicht, könnte", note: "*might* zeigt, dass etwas nur eine schwache Möglichkeit ist.", example_gloss: "Daniel bittet vielleicht Leila, ins Team zu kommen."}

  en.b1.unit18.lesson02.teach.meeting_leila_friday: {title: "I am + Verb-ing (feste Vereinbarung)", gloss: "Ich treffe mich am Freitag mit Leila zum Mittagessen.", note: "*I am meeting Leila for lunch on Friday* verwendet die present continuous (Verlaufsform) für eine feste Vereinbarung mit einer bestimmten, schon verabredeten Zeit."}
  en.b1.unit18.lesson02.teach.going_to_start_project: {title: "I am going to + Verb (Absicht)", gloss: "Ich werde mit dem Designteam ein neues Projekt starten.", note: "*I am going to start a new project* verwendet going to für eine Entscheidung, die schon getroffen ist, ohne feste Zeit."}
  en.b1.unit18.lesson02.teach.grammar_arrangements_vs_intentions: {title: "Feste Vereinbarungen und Absichten", gloss: "Verwenden Sie die present continuous (I am meeting Leila on Friday) für eine feste Vereinbarung: eine bestimmte Zeit, die schon mit jemand anderem abgesprochen ist. Verwenden Sie going to (I am going to start a new project) für eine Absicht oder Entscheidung, die Sie schon getroffen haben, auch ohne feste Zeit. Das deutsche Präsens deckt beides ab; im Englischen müssen Sie wählen.", note: "Form: Wählen Sie zwischen present continuous für eine feste Vereinbarung und going to für eine Absicht."}

  en.b1.unit18.lesson03.teach.on_time: {title: "on time", gloss: "pünktlich, rechtzeitig", note: "*on time* bedeutet genau zur geplanten Uhrzeit oder zum geplanten Datum.", example_gloss: "Daniel glaubt, dass das Projekt rechtzeitig fertig wird."}
  en.b1.unit18.lesson03.teach.confident: {title: "confident", gloss: "zuversichtlich", note: "*confident* bedeutet, sich sicher zu fühlen, dass etwas gut gehen wird.", example_gloss: "Daniel ist zuversichtlich, was das neue Projekt angeht."}
  en.b1.unit18.lesson03.teach.reading_passage: {title: "Lesetext: Daniels Pläne für nächsten Monat", gloss: "Daniel wird nächsten Monat mit dem Designteam ein neues Projekt starten. Er trifft sich am Freitagmorgen mit ihnen, um die ersten Schritte zu planen. Daniel ist zuversichtlich, was das Projekt angeht, aber er ist nicht ganz sicher, ob es rechtzeitig fertig wird. Er schätzt, dass es wahrscheinlich etwa zwei Monate dauern wird. Vielleicht bittet er Leila, ins Team zu kommen, weil sie nützliche Designerfahrung hat. Wenn sie zusagt, wird das Projekt auf jeden Fall schneller gehen.", note: "Ein kurzer Lesetext über Pläne und Vorhersagen."}

  en.b1.unit18.lesson04.teach.q_plans_next_month: {title: "Mia fragt nach Daniels Plänen", gloss: "Mia sagt: Daniel, was hast du nächsten Monat vor?", note: "Eine offene Frage, um das Gespräch zu eröffnen."}
  en.b1.unit18.lesson04.teach.a_going_to_start: {title: "Daniel nennt sein Vorhaben", gloss: "Daniel sagt: Ich werde mit dem Designteam ein neues Projekt starten.", note: "*going to* zeigt eine schon getroffene Entscheidung an."}
  en.b1.unit18.lesson04.teach.q_meeting_this_week: {title: "Mia fragt weiter", gloss: "Mia sagt: Das klingt spannend. Triffst du sie diese Woche?", note: "Eine Nachfrage zu einer festen Vereinbarung."}
  en.b1.unit18.lesson04.teach.a_meeting_friday_morning: {title: "Daniel bestätigt die feste Vereinbarung", gloss: "Daniel sagt: Ja, ich treffe sie am Freitagmorgen.", note: "*I am meeting... on Friday morning* ist die present continuous für eine feste Vereinbarung."}
  en.b1.unit18.lesson04.teach.q_finish_on_time: {title: "Mia fragt nach dem Termin", gloss: "Mia sagt: Glaubst du, dass das Projekt rechtzeitig fertig wird?", note: "Eine Frage nach einer Vorhersage."}
  en.b1.unit18.lesson04.teach.a_probably_two_months: {title: "Daniel gibt eine Vorhersage ab", gloss: "Daniel sagt: Ich bin nicht sicher, aber es dauert wahrscheinlich etwa zwei Monate.", note: "*probably* zeigt eine ziemliche, aber nicht vollständige Sicherheit."}
  en.b1.unit18.lesson04.teach.q_sure_it_will_go_well: {title: "Mia ist optimistisch", gloss: "Mia sagt: Na ja, ich bin sicher, dass es gut laufen wird.", note: "Eine aufmunternde Bemerkung."}
  en.b1.unit18.lesson04.teach.a_might_ask_leila: {title: "Daniel nennt eine schwache Möglichkeit", gloss: "Daniel sagt: Danke. Vielleicht frage ich Leila auch, ob sie ins Team kommt.", note: "*might* zeigt eine schwache Möglichkeit."}

