      - {value: "Oh no, I forgot! I should have done it last week.", status: "correct"}
      - {value: "Oh no, I forgot! I should've done it last week.", status: "correct"}
      - {value: "No, I forgot. I should have done that last week.", status: "correct"}
      - {value: "No, I forgot. I should've done that last week.", status: "correct"}
      - {value: "I forgot! I should have done that last week.", status: "correct"}
      - {value: "I forgot! I should've done that last week.", status: "correct"}
      - {value: "I forgot! I should have done it last week.", status: "correct"}
      - {value: "I forgot! I should've done it last week.", status: "correct"}
    feedback: "*Oh no, I forgot! I should have done that last week* ist die akzeptierte Antwort; *should've* ist ebenfalls korrekt."
  en.b1.unit01.lesson04.exercise06.speak_necessity_dialogue:
    instruction: "Leila sagt: Du musst sie heute anrufen, sonst zahlst du eine Verspätungsgebühr. Antworten Sie laut als Daniel: Sagen Sie, dass sie recht hat, dass Sie mit *have to* auch bis Freitag die Miete bezahlen müssen und dass Sie auch beim Zahnarzt anrufen sollten."
    accepted_answers:
