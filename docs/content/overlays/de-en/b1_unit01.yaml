  en.b1.unit01.lesson04.exercise05.reply_as_daniel:
    instruction: "Leila fragt: Daniel, hast du deine Mitgliedschaft im Fitnessstudio verlängert? Antworten Sie als Daniel mit *should have*: Sagen Sie, dass Sie es vergessen haben und dass Sie das letzte Woche hätten tun sollen."
