review: {status: "reviewed", required_next_reviewer: null, notes: "First de-en B1 overlay, authored against docs/content/realizations/en/b1_unit01_necessity.yaml. Existing de-en lane register followed: formal Sie in learner-facing instructions, informal du in character/example glosses where appropriate. nl-en B1 was consulted for structure only; all German text authored independently from the English realization. Dialogue/audio distractors checked against the tested speaker's unit audio lines. Review 2026-10-19: 7 fixes - lesson01 matching_pairs re-oriented to the 2026-08-04 word->definition shape with a German pairs override (validator error); lesson01 listen distractors reminder/dentist/membership were untaught until lessons 03/04, replaced with lesson01 words; unit title was unidiomatic German; must_not note now warns that must not is darf nicht, not muss nicht; grammar_past_regret title/note now also covers should have; lesson02 reply instruction contradicted the displayed prompt (diese Woche vs by Friday) and gained my-rent/By-Friday variants; lesson04 reply_as_daniel gained done-it and no-Oh-no variants. NATIVE FLAGS: reading gloss Telefon (Handy more colloquial); grammar_agreement gloss Sie müssen gehen is ambiguous between they and formal you."}

course:
  title: "Englisch B1"
  description: "Englisch auf B1-Niveau lernen, für Pflichten, Möglichkeiten, hypothetische Situationen und Erzählungen im Alltag, mit ausführlichen deutschen Erklärungen."

units:
  en.b1.unit01.necessity: {title: "Dinge, die ich tun muss oder tun sollte"}

lessons:
  en.b1.unit01.lesson01.necessity_vocabulary: {title: "Must, have to und should"}
  en.b1.unit01.lesson02.saying_what_you_must_do: {title: "I must, I have to, she has to"}
  en.b1.unit01.lesson03.past_regret_and_prohibition: {title: "Should have, must not, don't have to"}
  en.b1.unit01.lesson04.the_gym_membership_dialogue: {title: "You must not forget again"}

teaching:
  en.b1.unit01.lesson01.teach.must: {title: "must", gloss: "müssen (starke, persönliche Pflicht)", note: "*must* drückt eine starke persönliche Pflicht aus -- etwas, das man selbst für sehr wichtig hält.", example_gloss: "Ich muss diese Aufgabe heute fertig machen."}
  en.b1.unit01.lesson01.teach.have_to: {title: "have to", gloss: "müssen (Pflicht von außen)", note: "*have to* drückt eine Pflicht aus, die von außen kommt, zum Beispiel durch eine Regel oder einen Termin.", example_gloss: "Ich muss bis Freitag die Miete bezahlen."}
  en.b1.unit01.lesson01.teach.should: {title: "should", gloss: "sollte / solltest", note: "*should* ist eine Empfehlung, keine strikte Pflicht.", example_gloss: "Du solltest bald beim Zahnarzt anrufen."}
  en.b1.unit01.lesson01.teach.task: {title: "task", gloss: "Aufgabe", note: "*task* bedeutet eine Aufgabe oder Arbeit, die erledigt werden muss.", example_gloss: "Ich habe noch eine Aufgabe zu erledigen."}
  en.b1.unit01.lesson01.teach.rent: {title: "rent", gloss: "Miete", note: "*rent* bedeutet das Geld, das man fürs Wohnen bezahlt.", example_gloss: "Die Miete ist am Freitag fällig."}
  en.b1.unit01.lesson01.teach.appointment: {title: "appointment", gloss: "Termin", note: "*appointment* bedeutet einen festen Termin mit jemandem, zum Beispiel beim Arzt.", example_gloss: "Ich habe diese Woche einen Zahnarzttermin."}

  en.b1.unit01.lesson02.teach.must_finish_task: {title: "eine starke Pflicht ausdrücken", gloss: "Ich muss diese Aufgabe heute fertig machen.", note: "*I must* drückt eine starke, persönliche Pflicht aus."}
  en.b1.unit01.lesson02.teach.have_to_pay_rent: {title: "eine Pflicht von außen ausdrücken", gloss: "Ich muss bis Freitag die Miete bezahlen.", note: "*I have to* drückt eine Pflicht aus, die von außen kommt, wie eine Zahlungsfrist."}
  en.b1.unit01.lesson02.teach.she_has_to_make: {title: "Form bei 'she'", gloss: "Sie muss einen Termin machen.", note: "Bei *he/she/it* wird *have to* zu *has to*."}
  en.b1.unit01.lesson02.teach.you_should_call: {title: "eine Empfehlung geben", gloss: "Du solltest anrufen und den Termin bestätigen.", note: "*should* gibt eine Empfehlung, keine strikte Pflicht wie *must* oder *have to*."}
  en.b1.unit01.lesson02.teach.grammar_agreement: {title: "Formen von 'have to'", gloss: "Ich muss gehen. Sie muss gehen. Wir müssen gehen. Sie müssen gehen.", note: "Nur bei *he/she/it* wird *have* zu *has*; bei allen anderen Personen bleibt es *have to*."}

  en.b1.unit01.lesson03.teach.should_have_called: {title: "Reue über die Vergangenheit ausdrücken", gloss: "Ich hätte früher anrufen sollen.", note: "*should have* + Partizip drückt Reue über etwas aus, das man nicht getan hat.", example_gloss: "Ich hätte früher anrufen sollen."}
  en.b1.unit01.lesson03.teach.must_not: {title: "must not", gloss: "darf nicht", note: "*must not* bedeutet ein Verbot -- etwas ist absolut nicht erlaubt. Achtung: *must not* heißt nicht 'muss nicht', sondern 'darf nicht'; 'muss nicht' ist *don't have to*.", example_gloss: "Du darfst es nicht wieder vergessen."}
  en.b1.unit01.lesson03.teach.dont_have_to: {title: "don't have to", gloss: "muss nicht / braucht nicht", note: "*don't have to* bedeutet, dass etwas nicht verpflichtend ist; das ist anders als *must not* (Verbot).", example_gloss: "Du musst nicht kommen, wenn du beschäftigt bist."}
  en.b1.unit01.lesson03.teach.grammar_past_regret: {title: "Reue, Verbot und keine Pflicht", gloss: "Ich hätte anrufen sollen. Ich habe es vergessen. Du darfst es nicht wieder vergessen. Du musst nicht kommen.", note: "*should have* + Partizip drückt Reue über die Vergangenheit aus. *must not* ist ein Verbot; *don't have to* bedeutet keine Pflicht, aber es ist erlaubt."}
  en.b1.unit01.lesson03.teach.reading_passage: {title: "Lesetext: das Fitnessstudio", gloss: "Gestern vergaß Daniel, seine Mitgliedschaft im Fitnessstudio zu verlängern. Er hätte eine Erinnerung auf seinem Telefon einstellen sollen. Jetzt muss er eine Verspätungsgebühr bezahlen. Er darf es nächsten Monat nicht wieder vergessen.", note: "Ein kurzer Lesetext über Daniels Fehler und die Folgen davon."}

  en.b1.unit01.lesson04.teach.q_renew_gym: {title: "Leila fragt nach der Mitgliedschaft", gloss: "Leila sagt: Daniel, hast du deine Mitgliedschaft im Fitnessstudio verlängert?", note: "Eine direkte Frage, um zu prüfen, ob etwas schon erledigt wurde."}
  en.b1.unit01.lesson04.teach.a_forgot_should_have: {title: "Daniels Antwort: vergessen", gloss: "Daniel sagt: Oh nein, ich habe es vergessen! Ich hätte das letzte Woche tun sollen.", note: "*I should have done that* drückt Reue über etwas aus, das nicht erledigt wurde."}
  en.b1.unit01.lesson04.teach.q_call_today: {title: "Leila warnt Daniel", gloss: "Leila sagt: Du musst sie heute anrufen, sonst zahlst du eine Verspätungsgebühr.", note: "*must* steht hier für eine dringende persönliche Warnung."}
  en.b1.unit01.lesson04.teach.a_also_pay_rent: {title: "Daniel nennt weitere Pflichten", gloss: "Daniel sagt: Du hast recht. Ich muss auch bis Freitag die Miete bezahlen, und ich sollte auch beim Zahnarzt anrufen.", note: "Daniel kombiniert *have to* (Pflicht) mit *should* (Empfehlung) in einer Antwort."}
  en.b1.unit01.lesson04.teach.q_dont_have_to: {title: "Leila beruhigt Daniel", gloss: "Leila sagt: Du musst nicht alles heute erledigen. Aber du darfst das Fitnessstudio nicht wieder vergessen.", note: "Leila kontrastiert *don't have to* (keine Pflicht) mit *must not* (Verbot)."}
  en.b1.unit01.lesson04.teach.a_more_organized: {title: "Daniel fasst einen Vorsatz", gloss: "Daniel sagt: Ich weiß. Ich muss diesen Monat besser organisiert sein.", note: "*I must be* drückt hier einen persönlichen Vorsatz aus."}

exercises:
  en.b1.unit01.lesson01.exercise01.listen_word:
    instruction: "Hören Sie zu und wählen Sie das genannte Wort."
    correct_option: "appointment"
    distractors: ["task", "rent", "must"]
    accepted_answers: [{value: "appointment", status: "correct"}]
    feedback: "*appointment* bedeutet Termin."
  en.b1.unit01.lesson01.exercise02.choose_must_do_word:
    instruction: "Welches Wort bedeutet etwas, das man erledigen muss?"
    correct_option: "task"
    distractors: ["rent", "appointment", "should"]
    accepted_answers: [{value: "task", status: "correct"}]
    feedback: "*task* bedeutet Aufgabe."
  en.b1.unit01.lesson01.exercise03.choose_meeting_time_word:
    instruction: "Welches Wort bedeutet eine feste Zeit, um jemanden zu treffen, zum Beispiel beim Arzt?"
    correct_option: "appointment"
    distractors: ["task", "rent", "have to"]
    accepted_answers: [{value: "appointment", status: "correct"}]
    feedback: "*appointment* bedeutet Termin."
  en.b1.unit01.lesson01.exercise04.match_necessity_words:
    instruction: "Verbinden Sie jedes englische Wort bzw. jeden Ausdruck mit der passenden deutschen Bedeutung."
    pairs:
      - {left: "must", right: "müssen (starke, persönliche Pflicht)"}
      - {left: "have to", right: "müssen (Pflicht von außen)"}
      - {left: "should", right: "sollte (Empfehlung)"}
      - {left: "task", right: "Aufgabe"}
      - {left: "rent", right: "Miete"}
      - {left: "appointment", right: "Termin"}
    accepted_answers:
      - value:
          - {left: "must", right: "müssen (starke, persönliche Pflicht)"}
          - {left: "have to", right: "müssen (Pflicht von außen)"}
          - {left: "should", right: "sollte (Empfehlung)"}
          - {left: "task", right: "Aufgabe"}
          - {left: "rent", right: "Miete"}
          - {left: "appointment", right: "Termin"}
        status: "correct"
    feedback: "*must*=starke Pflicht, *have to*=Pflicht von außen, *should*=Empfehlung, *task*=Aufgabe, *rent*=Miete, *appointment*=Termin."
  en.b1.unit01.lesson01.exercise05.write_rent:
    instruction: "Schreiben Sie das Wort für Geld, das man fürs Wohnen bezahlt."
    accepted_answers:
      - {value: "rent", status: "correct"}
      - {value: "Rent", status: "correct"}
    feedback: "*rent* bedeutet Miete."

  en.b1.unit01.lesson02.exercise01.choose_daniels_task:
    instruction: "Daniel sagt, dass er heute etwas fertig machen muss. Was sagt er?"
    correct_option: "I must finish this task today."
    distractors: ["I have to pay the rent by Friday.", "She has to make an appointment.", "You should call and confirm the appointment."]
    accepted_answers: [{value: "I must finish this task today.", status: "correct"}]
    feedback: "*I must finish this task today* bedeutet, dass man diese Aufgabe heute fertig machen muss."
  en.b1.unit01.lesson02.exercise02.choose_correct_agreement:
    instruction: "Welcher Satz verwendet die richtige Verbform bei 'she'?"
    correct_option: "She has to make an appointment."
    distractors: ["She have to make an appointment.", "She must to make an appointment.", "She should to make an appointment."]
    accepted_answers: [{value: "She has to make an appointment.", status: "correct"}]
    feedback: "Bei *he/she/it* wird *have to* zu *has to*: *She has to make an appointment*."
  en.b1.unit01.lesson02.exercise03.order_have_to_pay_rent:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge für 'ich muss bis Freitag die Miete bezahlen'."
    accepted_answers: [{value: ["I", "have", "to", "pay", "the", "rent", "by", "Friday"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *I have to pay the rent by Friday*."
  en.b1.unit01.lesson02.exercise04.reply_what_must_you_do:
    instruction: "Ein Freund fragt, was Sie bis Freitag bezahlen müssen. Antworten Sie in einem ganzen Satz mit *have to*: Sie müssen bis Freitag die Miete bezahlen."
    accepted_answers:
      - {value: "I have to pay the rent by Friday.", status: "correct"}
      - {value: "I have to pay the rent by Friday", status: "correct"}
      - {value: "I have to pay my rent by Friday.", status: "correct"}
      - {value: "By Friday, I have to pay the rent.", status: "correct"}
    feedback: "*I have to pay the rent by Friday* bedeutet, dass Sie bis Freitag die Miete bezahlen müssen."
  en.b1.unit01.lesson02.exercise05.write_she_has_to:
    instruction: "Schreiben Sie mit *has to*, dass sie einen Termin machen muss."
    accepted_answers:
      - {value: "She has to make an appointment.", status: "correct"}
      - {value: "She has to make an appointment", status: "correct"}
    feedback: "*She has to make an appointment* bedeutet, dass sie einen Termin machen muss."

  en.b1.unit01.lesson03.exercise01.comprehend_what_daniel_forgot:
    instruction: "Was vergaß Daniel zu tun?"
    correct_option: "renew his gym membership"
    distractors: ["set a reminder", "pay a late fee", "call the dentist"]
    accepted_answers: [{value: "renew his gym membership", status: "correct"}]
    feedback: "Der Text sagt *renew his gym membership*."
  en.b1.unit01.lesson03.exercise02.comprehend_what_he_should_have_done:
    instruction: "Was hätte Daniel tun sollen?"
    correct_option: "set a reminder on his phone"
    distractors: ["renew his gym membership", "pay a late fee", "forget again next month"]
    accepted_answers: [{value: "set a reminder on his phone", status: "correct"}]
    feedback: "Der Text sagt *he should have set a reminder on his phone*."
  en.b1.unit01.lesson03.exercise03.recognize_should_have:
    instruction: "Welche Form beschreibt einen Fehler oder Reue über die Vergangenheit?"
    correct_option: "should have called"
    distractors: ["must not", "don't have to", "have to"]
    accepted_answers: [{value: "should have called", status: "correct"}]
    feedback: "*should have* + Partizip drückt Reue über etwas aus, das nicht getan wurde."
  en.b1.unit01.lesson03.exercise04.order_must_not_forget:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge für 'er darf es nicht wieder vergessen'."
    accepted_answers: [{value: ["He", "must", "not", "forget", "again"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *He must not forget again*."
  en.b1.unit01.lesson03.exercise05.write_should_have_called:
    instruction: "Schreiben Sie mit *should have*, dass Sie früher hätten anrufen sollen."
    accepted_answers:
      - {value: "I should have called earlier.", status: "correct"}
      - {value: "I should have called earlier", status: "correct"}
      - {value: "I should've called earlier.", status: "correct"}
      - {value: "I should've called earlier", status: "correct"}
    feedback: "*I should have called earlier* bedeutet, dass Sie früher hätten anrufen sollen; *should've* ist die gesprochene Kurzform von *should have*."

  en.b1.unit01.lesson04.exercise01.listen_what_daniel_forgot:
    instruction: "Hören Sie das Gespräch und wählen Sie, was Daniel vergessen hat."
    correct_option: "renew your gym membership"
