  en.b1.unit08.lesson01.teach.after: {title: "after", gloss: "nachdem, nach", note: "*after* bedeutet später als ein anderes Ereignis.", example_gloss: "Ruf mich an, nachdem du mit der Arbeit fertig bist."}
