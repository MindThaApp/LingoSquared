  en.b1.unit08.lesson01.teach.check_in: {title: "check in", gloss: "sich melden, dass man angekommen oder in Sicherheit ist", note: "*check in* bedeutet, jemandem kurz Bescheid zu geben, dass man da oder in Sicherheit ist.", example_gloss: "Melde dich kurz, wenn du im Hotel angekommen bist."}
  en.b1.unit08.lesson01.teach.lock_up: {title: "lock up", gloss: "abschließen", note: "*lock up* bedeutet, einen Raum oder ein Gebäude zu schließen und zu sichern.", example_gloss: "Ich schließe ab, bevor ich das Büro verlasse."}

  en.b1.unit08.lesson02.teach.as_soon_as_home: {title: "Etwas sofort danach tun", gloss: "Sobald ich zu Hause bin, rufe ich dich an.", note: "*as soon as* zeigt, dass die zweite Handlung sofort nach der ersten passiert."}
  en.b1.unit08.lesson02.teach.before_upstairs: {title: "Zuerst etwas tun", gloss: "Bitte sieh die Post durch, bevor du nach oben gehst.", note: "*before* zeigt, welche Handlung zuerst passieren muss."}
  en.b1.unit08.lesson02.teach.grammar_future_time_clause: {title: "Präsens in Zeitsätzen", gloss: "Wenn ich zu Hause bin, rufe ich dich an. Bitte sieh die Post durch, bevor du nach oben gehst.", note: "In englischen Zeitsätzen steht für das zukünftige Ereignis das Präsens: *when I get home*, nicht *when I will get home*."}

  en.b1.unit08.lesson03.teach.front_door: {title: "front door", gloss: "Haustür", note: "*front door* bedeutet die Haupttür an der Vorderseite eines Hauses oder Gebäudes.", example_gloss: "Daniel schließt die Haustür ab, nachdem er die Post durchgesehen hat."}
  en.b1.unit08.lesson03.teach.ready: {title: "ready", gloss: "fertig, bereit", note: "*ready* bedeutet vorbereitet oder bereit zur Verwendung.", example_gloss: "Bis Mia ankommt, ist das Essen fertig."}
  en.b1.unit08.lesson03.teach.reading_passage: {title: "Lesetext: der Abendplan", gloss: "Daniel hat eine sorgfältige Abendroutine. Wenn er nach Hause kommt, sieht er zuerst die Post durch. Nachdem er die Post durchgesehen hat, schließt er die Haustür ab. Bevor er mit dem Essen anfängt, wäscht er sich die Hände und räumt den Tisch ab. Bis Mia ankommt, ist die Küche aufgeräumt und das Essen warm.", note: "Ein kurzer Lesetext mit *when*, *after*, *before* und *by the time*."}

  en.b1.unit08.lesson04.teach.q_call_when_home: {title: "Leila bittet um einen Anruf", gloss: "Leila sagt: Daniel, kannst du mich anrufen, wenn du nach Hause kommst?", note: "Eine Frage mit *when*, um den Zeitpunkt der Handlung zu nennen."}
  en.b1.unit08.lesson04.teach.a_as_soon_as_home: {title: "Daniel verspricht, sofort anzurufen", gloss: "Daniel sagt: Klar. Sobald ich zu Hause bin, rufe ich dich an.", note: "*as soon as* macht deutlich, dass er sofort anruft."}
  en.b1.unit08.lesson04.teach.q_check_mail: {title: "Leila gibt eine erste Aufgabe", gloss: "Leila sagt: Bitte sieh die Post durch, bevor du nach oben gehst.", note: "*before* zeigt, dass die Post zuerst kommt."}
  en.b1.unit08.lesson04.teach.a_after_mail_lock: {title: "Daniel nennt den nächsten Schritt", gloss: "Daniel sagt: Mache ich. Nachdem ich die Post durchgesehen habe, schließe ich die Haustür ab.", note: "*after* zeigt die Reihenfolge zwischen zwei Handlungen."}
  en.b1.unit08.lesson04.teach.q_by_the_time_mia: {title: "Leila nennt den Zeitpunkt", gloss: "Leila sagt: Gut. Bis Mia ankommt, sollte alles fertig sein.", note: "*by the time* bedeutet, dass alles bis zu diesem Moment oder davor fertig sein soll."}
  en.b1.unit08.lesson04.teach.a_start_dinner: {title: "Daniel schließt den Plan ab", gloss: "Daniel sagt: Dann können wir mit dem Essen anfangen, wenn sie ankommt.", note: "*when she arrives* nennt den Zeitpunkt, an dem sie anfangen können."}

