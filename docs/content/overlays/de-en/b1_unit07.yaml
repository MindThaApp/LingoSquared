  en.b1.unit07.lesson03.teach.reading_passage: {title: "Lesetext: der Ersatzplan", gloss: "Daniel schreibt einen Ersatzplan für das Teammeeting. Wenn der Besprechungsraum frei ist, trifft sich das Team um zehn Uhr dort. Wenn der Raum belegt ist, treffen sie sich online. Wenn Leila nicht vor zehn Uhr dazukommt, verschiebt Daniel ihr Update auf morgen. Wenn der Bericht nicht fertig ist, schickt Mia stattdessen ein kürzeres Update.", note: "Ein kurzer Lesetext mit realen Bedingungen, Ergebnissen und *unless*."}

