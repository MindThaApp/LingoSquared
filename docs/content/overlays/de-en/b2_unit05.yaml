teaching:
  en.b2.unit05.lesson01.teach.register:
    title: Register
    gloss: Sprachebene, Grad der Förmlichkeit
    note: '*register* beschreibt, wie förmlich oder locker Sie klingen. Das Englische unterscheidet nicht zwischen du und Sie; der Ton steckt vor allem in der Formulierung.'
    example_gloss: Die Sprachebene ändert sich, wenn sich das Publikum ändert.
  en.b2.unit05.lesson01.teach.casual:
    title: casual
    gloss: locker, zwanglos
    note: '*casual* passt zu einem Freund oder Bekannten. Es ist direkter, aber nicht automatisch unhöflich.'
    example_gloss: Eine lockere Nachricht passt zu einem Freund.
  en.b2.unit05.lesson01.teach.professional:
    title: professional
    gloss: sachlich-höflich, beruflich angemessen
    note: '*professional* passt zu einem Kollegen: höflich und klar, aber nicht übertrieben förmlich.'
    example_gloss: Eine sachlich-höfliche Nachricht passt zu einem Kollegen.
  en.b2.unit05.lesson01.teach.formal:
    title: formal
    gloss: förmlich, offiziell
    note: '*formal* passt zu einer Einrichtung. Im Englischen erreicht man das oft durch längere, indirektere Bitten.'
    example_gloss: Eine förmliche Nachricht passt zu einer Einrichtung.
  en.b2.unit05.lesson01.teach.audience:
    title: audience
    gloss: Zielgruppe, Adressat, Publikum
    note: '*audience* ist die Person oder Gruppe, für die Sie schreiben oder sprechen.'
    example_gloss: Ihre Zielgruppe beeinflusst Ihre Wortwahl.
  en.b2.unit05.lesson01.teach.institution:
    title: institution
    gloss: Einrichtung, Organisation
    note: '*institution* ist eine Organisation wie eine Klinik, eine Bank oder eine Universität.'
    example_gloss: Eine Klinik ist eine Einrichtung.
  en.b2.unit05.lesson02.teach.formal_request:
    title: Förmliche Bitte
    gloss: Ich wäre Ihnen dankbar, wenn Sie bestätigen könnten, ob mein Termin auf Freitag verschoben werden kann.
    note: '*I would be grateful if you could...* ist förmlich. Das Englische braucht dafür kein anderes Wort für *you*; die Höflichkeit liegt in der ganzen Konstruktion.'
  en.b2.unit05.lesson02.teach.casual_request:
    title: Lockere Bitte
    gloss: Kannst du es auf Freitag verschieben?
    note: '*Can you...?* ist für einen Freund völlig in Ordnung, klingt aber gegenüber einer Einrichtung schnell zu direkt.'
  en.b2.unit05.lesson02.teach.professional_request:
    title: Sachlich-höfliche Bitte
    gloss: Können wir den Termin auf Freitag verschieben, wenn Freitag für dich noch passt?
    note: '*Could we...?* klingt für einen Kollegen kooperativ und höflich.'
  en.b2.unit05.lesson02.teach.to_whom:
    title: Dear scheduling team,
    gloss: Liebes Planungsteam,
    note: '*Dear...* ist eine ganz normale förmliche Anrede. Sie ist weniger steif als manche wörtlich übersetzten Briefanfänge im Deutschen, etwa "Sehr geehrte Damen und Herren".'
  en.b2.unit05.lesson02.teach.grammar_register_shift:
    title: Die Sprachebene wechseln
    gloss: Lassen Sie den Inhalt gleich, wenn Sie die Sprachebene wechseln. Lockeres Englisch kann direkte Fragen verwenden. Sachlich-höfliches Englisch verwendet oft could. Förmliches Englisch verwendet oft I would be grateful if you could.
    note: 'Denken Sie nicht nur an den deutschen Unterschied zwischen du und Sie: Im Englischen verändert sich der ganze Satz.'
  en.b2.unit05.lesson03.teach.stiff:
    title: stiff
    gloss: steif, zu förmlich
    note: '*stiff* bedeutet, dass eine Nachricht für die Situation unnötig förmlich klingt.'
    example_gloss: Eine steife Nachricht klingt für die Situation zu förmlich.
  en.b2.unit05.lesson03.teach.appropriate:
    title: appropriate
    gloss: angemessen, passend
    note: '*appropriate* bedeutet, dass die Formulierung zu Zielgruppe und Situation passt.'
    example_gloss: Eine angemessene Nachricht passt zur Zielgruppe.
  en.b2.unit05.lesson03.teach.reading_passage:
    title: 'Lesetext: dieselbe Nachricht, drei Adressatengruppen'
    gloss: 'Nina muss einen Termin auf Freitag verschieben. An einen Freund schreibt sie: Can you move it to Friday? Die Nachricht ist direkt und locker. An einen Kollegen schreibt sie: Could we move the appointment to Friday if that still works for you? Die Nachricht ist sachlich und höflich. An die Klinik schreibt sie: I would be grateful if you could confirm whether my appointment can be moved to Friday. Der Inhalt ist in allen drei Texten derselbe, aber die Sprachebene ändert sich mit dem Adressaten.'
    note: Im Englischen ändert sich die Sprachebene durch die Formulierung, nicht durch ein eigenes Wort für Sie.
  en.b2.unit05.lesson04.teach.q_need_ask:
    title: Nina fragt nach der Formulierung
    gloss: 'Nina sagt: Ich muss nachfragen, ob mein Termin verschoben werden kann. Kann ich einfach schreiben: ''Can you move it?'''
    note: '*just write* zeigt, dass sie unsicher ist, ob die direkte Form passt.'
  en.b2.unit05.lesson04.teach.a_too_casual:
    title: Oscar weist auf die Sprachebene hin
    gloss: 'Oscar sagt: An einen Freund, ja. An die Klinik klingt das zu locker.'
    note: Auch hier verwendet man im Englischen einfach *you*, aber der Satz selbst ist für die Klinik zu direkt.
  en.b2.unit05.lesson04.teach.q_colleague:
    title: Nina fragt nach dem Ton für Kollegen
    gloss: 'Nina fragt: Was würdest du einem Kollegen schreiben?'
    note: Ein Kollege verlangt einen sachlich-höflichen, nicht maximal förmlichen Ton.
  en.b2.unit05.lesson04.teach.a_colleague_request:
    title: Oscar nennt die Version für Kollegen
    gloss: 'Oscar sagt: Ich würde schreiben: ''Could we move the appointment to Friday if that still works for you?'''
    note: '*Could we* und *if that still works for you* machen die Bitte weicher.'
  en.b2.unit05.lesson04.teach.q_clinic:
    title: Nina fragt nach der Klinik
    gloss: 'Nina fragt: Und an die Klinik?'
    note: Eine Einrichtung verlangt eine förmlichere Bitte.
  en.b2.unit05.lesson04.teach.a_clinic_request:
    title: Oscar nennt die förmliche Version
    gloss: 'Oscar sagt: Ich würde schreiben: ''I would be grateful if you could confirm whether my appointment can be moved to Friday.'''
    note: Diese Version fordert nicht barsch zu einer Handlung auf, sondern bittet um Bestätigung.
  en.b2.unit05.lesson04.teach.q_same_message:
    title: Nina fasst zusammen
    gloss: 'Nina sagt: Dieselbe Nachricht, andere Sprachebene.'
    note: 'Der Inhalt bleibt gleich: den Termin auf Freitag verschieben.'
  en.b2.unit05.lesson04.teach.a_content_stays:
    title: Oscar stimmt zu
    gloss: 'Oscar sagt: Genau. Der Inhalt bleibt gleich, aber der Grad der Förmlichkeit ändert sich.'
    note: Das ist der Kern der Sprachebenen-Kontrolle auf B2.
