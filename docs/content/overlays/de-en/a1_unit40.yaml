teaching:
  en.a1.unit40.lesson01.teach.post_office:
    title: post office
    gloss: Postamt / Post
    note: '*post office* bedeutet Postamt oder Post (die Filiale).'
    example_gloss: Ich gehe zur Post, um Briefe zu verschicken.
  en.a1.unit40.lesson01.teach.letter:
    title: letter
    gloss: Brief
    note: '*letter* bedeutet Brief.'
    example_gloss: Ich schreibe einen Brief an meinen Freund.
  en.a1.unit40.lesson01.teach.package:
    title: package
    gloss: Päckchen / Paket
