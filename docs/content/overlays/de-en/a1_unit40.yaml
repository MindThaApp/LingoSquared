    gloss: eine Briefmarke kaufen
    note: '*buy a stamp* bedeutet eine Briefmarke kaufen.'
    example_gloss: Ich muss eine Briefmarke für diese Postkarte kaufen.
  en.a1.unit40.lesson02.teach.write_the_address:
    title: write the address
    gloss: die Adresse aufschreiben
    note: '*write the address* bedeutet die Adresse aufschreiben.'
    example_gloss: Bitte schreiben Sie die Adresse auf das Päckchen.
  en.a1.unit40.lesson02.teach.how_long_will_it_take:
    title: how long will it take
    gloss: Wie lange dauert es?
    note: '*how long will it take* bedeutet: Wie lange dauert es?'
    example_gloss: Wie lange dauert es, bis es ankommt?
  en.a1.unit40.lesson02.teach.express_mail:
    title: express mail
    gloss: Expressversand / Eilpost
    note: '*express mail* bedeutet Expressversand: schnellerer, teurerer Versand.'
    example_gloss: Expressversand ist schneller als normale Post.
  en.a1.unit40.lesson02.teach.how_much_does_it_cost_question:
    title: How much does it cost to send this?
    gloss: Was kostet es, das zu verschicken?
    note: '*How much does it cost to ...?* fragt nach dem Preis für eine Handlung.'
  en.a1.unit40.lesson03.teach.dialogue_line1:
    title: Daniels Anliegen
    gloss: 'Daniel sagt: Guten Tag, ich möchte dieses Päckchen gern verschicken, bitte.'
    note: '*I''d like to* + Verb ist eine höfliche Art, um etwas zu bitten. Es ist viel höflicher als *I want*, das am Schalter ziemlich schroff klingt.'
  en.a1.unit40.lesson03.teach.dialogue_line2:
    title: Der Angestellte fragt
    gloss: 'Der Angestellte sagt: Gern! Wohin soll es gehen?'
    note: '*Where is it going?* fragt nach dem Ziel.'
  en.a1.unit40.lesson03.teach.dialogue_line3:
    title: "Daniels Antwort"
    gloss: 'Daniel sagt: Nach Chicago. Es ist ein Geburtstagsgeschenk für meine Schwester.'
    note: '*It''s a birthday gift for my sister* bedeutet: Es ist ein Geburtstagsgeschenk für meine Schwester.'
  en.a1.unit40.lesson03.teach.dialogue_line4:
    title: Der Angestellte fragt
    gloss: 'Der Angestellte sagt: Möchten Sie normale Post oder Expressversand? Express dauert etwa zwei Tage.'
    note: '*regular or express mail* bedeutet normale Post oder Expressversand.'
  en.a1.unit40.lesson03.teach.dialogue_line5:
    title: Daniels Wahl
    gloss: 'Daniel sagt: Ich nehme Express, bitte. Was kostet das?'
    note: '*I''ll take ...* ist eine natürliche Art, sich bei einer Dienstleistung zu entscheiden.'
  en.a1.unit40.lesson03.teach.dialogue_line6:
    title: Der Angestellte antwortet
    gloss: 'Der Angestellte sagt: Das macht zwölf Dollar. Hier ist Ihr Beleg.'
    note: '*Here''s your receipt* bedeutet: Hier ist Ihr Beleg.'
  en.a1.unit40.lesson03.teach.dialogue_line7:
    title: Daniels Dank
    gloss: 'Daniel sagt: Vielen Dank! Einen schönen Tag noch.'
    note: '*Have a good day* ist ein höflicher Abschiedsgruß.'
  en.a1.unit40.lesson04.teach.reading_passage:
    title: Text über drei Besuche in der Post
    gloss: Daniel, Leila und Mia kennen sich alle in der Post aus. Letzte Woche hat Daniel ein Geburtstagspäckchen an seine Schwester in Chicago geschickt. Er hat für Expressversand bezahlt, weil es schnell ankommen sollte, und es hat nur zwei Tage gedauert. Leila macht sich bereit, in Mias Nähe zu ziehen, und ging deshalb zur Post, um ein paar alte Bücher an ihre Eltern zu schicken. Der Angestellte wog das Päckchen und gab ihr eine Briefmarke dafür. Leila fragte, wie lange das Päckchen brauchen würde, und der Angestellte sagte, etwa eine Woche, weil sie normale Post gewählt hatte. Mia verschickt nicht oft Päckchen, aber sie kauft immer eine Briefmarke für die Briefe, die sie ihrer Oma schreibt. Sie sagt, ein Brief mit Briefmarke fühlt sich persönlicher an als eine Textnachricht.
    note: '*getting ready to move* bedeutet: sich bereit machen umzuziehen.'
