teaching:
  en.b2.unit03.lesson01.teach.hedge:
    title: hedge
    gloss: vorsichtiger formulieren
    note: '*hedge* bedeutet, dass Sie eine Aussage weniger absolut machen. Übersetzen Sie „ein bisschen“ nicht automatisch mit *a little*.'
    example_gloss: Leila verwendet seems, um ihre Aussage über die Richtlinie vorsichtiger zu formulieren.
  en.b2.unit03.lesson01.teach.qualify:
    title: qualify
    gloss: einschränken oder nuancieren
    note: '*qualify* bedeutet, dass Sie eine Aussage durch eine Bedingung oder Ausnahme einschränken.'
    example_gloss: Der Ausdruck „provided we agree“ schränkt Leilas Unterstützung ein.
  en.b2.unit03.lesson01.teach.emphasize:
    title: emphasize
    gloss: hervorheben, betonen
    note: '*emphasize* bedeutet, dass Sie einen Teil Ihrer Aussage stärker machen.'
    example_gloss: Daniel hebt das Problem der Arbeitsbelastung hervor.
  en.b2.unit03.lesson01.teach.to_some_extent:
    title: to some extent
    gloss: bis zu einem gewissen Grad
    note: '*to some extent* klingt oft natürlicher, als überall *a little* zu verwenden.'
    example_gloss: Bis zu einem gewissen Grad geht die Richtlinie auf die Bedenken des Teams ein.
  en.b2.unit03.lesson01.teach.broadly:
    title: broadly
    gloss: im Großen und Ganzen, grundsätzlich
    note: '*broadly* drückt allgemeine Zustimmung oder allgemeine Gültigkeit aus, mit Raum für Ausnahmen.'
    example_gloss: Der Vorschlag ist im Großen und Ganzen nützlich, wenn auch nicht perfekt.
  en.b2.unit03.lesson01.teach.provided:
    title: provided
    gloss: vorausgesetzt, sofern
    note: '*provided* leitet eine Bedingung ein. Es entspricht etwa dem deutschen „vorausgesetzt“ und klingt im Englischen oft förmlich und professionell.'
    example_gloss: Wir können die Richtlinie unterstützen, vorausgesetzt, wir sind uns einig.
  en.b2.unit03.lesson02.teach.seems_but_does:
    title: Vorsicht plus Nachdruck
    gloss: Die Richtlinie scheint vernünftig, schafft aber durchaus zusätzliche Arbeit für das Team.
    note: '*seems* macht die positive Aussage vorsichtiger; *does create* betont, dass die zusätzliche Arbeit wirklich entsteht. Im Deutschen leistet das ein betontes „schon“ oder „durchaus“: Es schafft durchaus zusätzliche Arbeit.'
  en.b2.unit03.lesson02.teach.what_worries_me:
    title: Den Fokus auf eine Sorge legen
    gloss: Was mir Sorgen macht, ist die zusätzliche Arbeit für das Team.
    note: '*What worries me is...* stellt einen Punkt an den Anfang, um ihn hervorzuheben. Danach bleibt die englische Wortfolge: *is the extra work*.'
  en.b2.unit03.lesson02.teach.broadly_provided:
    title: Allgemeine Unterstützung mit Bedingung
    gloss: Es ist im Großen und Ganzen nützlich, vorausgesetzt, der Zeitplan wird angepasst.
    note: '*broadly useful, provided...* drückt Unterstützung mit einer klaren Bedingung aus.'
  en.b2.unit03.lesson02.teach.grammar_stance:
    title: Nuancierung und Nachdruck
    gloss: Verwenden Sie seems, broadly oder to some extent, um eine Aussage vorsichtiger oder eingeschränkter zu machen. Verwenden Sie do oder does vor dem Hauptverb, um zu betonen, dass etwas wirklich zutrifft. Verwenden Sie What matters is... oder What worries me is..., um die Aufmerksamkeit auf einen Punkt zu lenken.
    note: 'Neu für Deutschsprachige ist vor allem *does create*: Es ist keine Zeitform und bedeutet nicht „tut erschaffen“, sondern betont *create*. Im Deutschen verwendet man dafür Wörter wie „tatsächlich“ oder „durchaus“ oder betont das Verb mit der Stimme.'
  en.b2.unit03.lesson03.teach.overall:
    title: overall
    gloss: insgesamt, im Ganzen
    note: '*overall* betrachtet das Gesamtbild, auch wenn es Details oder Ausnahmen gibt.'
    example_gloss: Insgesamt unterstützt Leila die Richtlinie.
  en.b2.unit03.lesson03.teach.condition:
    title: condition
    gloss: Bedingung
    note: '*condition* ist etwas, das erfüllt sein muss, bevor etwas gilt.'
    example_gloss: Ihre Bedingung ist, dass der Zeitplan angepasst werden muss.
  en.b2.unit03.lesson03.teach.reading_passage:
    title: 'Lesetext: Unterstützung mit Bedingungen'
    gloss: 'Leilas Rückmeldung ist positiv, aber sorgfältig eingeschränkt. Sie sagt, die Prüfrichtlinie scheine insgesamt vernünftig, was die Aussage abschwächt und verhindert, dass sie absolut klingt. Sie sagt außerdem, sie sei im Großen und Ganzen nützlich, vorausgesetzt, der Zeitplan wird angepasst. Diese Bedingung schränkt ihre Unterstützung ein: Sie akzeptiert die Richtlinie nicht genau so, wie sie geschrieben ist. Daniel hebt mit einer Fokuskonstruktion einen anderen Punkt hervor: Was ihm Sorgen macht, ist die zusätzliche Arbeit für das Team. Beide unterstützen die Richtlinie grundsätzlich, aber ihre Sprache zeigt unterschiedlich starkes Engagement.'
    note: Der Text zeigt, wie man denselben Grundgehalt weicher, stärker oder bedingter formuliert.
  en.b2.unit03.lesson04.teach.q_policy_seems:
    title: Leila formuliert vorsichtig
    gloss: 'Leila sagt: Die neue Prüfrichtlinie scheint insgesamt vernünftig.'
    note: '*seems reasonable overall* ist positiver als Kritik, aber nicht absolut.'
  en.b2.unit03.lesson04.teach.a_not_fully_ready:
    title: Daniel hört die Vorsicht heraus
    gloss: 'Daniel sagt: Das klingt ein bisschen vorsichtig. Meinst du, sie ist noch nicht ganz fertig?'
    note: Daniel merkt, dass Leila nicht einfach *it is ready* sagt.
  en.b2.unit03.lesson04.teach.q_workable_deadlines:
    title: Leila nuanciert weiter
    gloss: 'Leila sagt: Genau. Sie ist vielleicht praktikabel, aber sie braucht klarere Fristen.'
    note: '*may be workable* lässt Raum für Zweifel; *but* nennt die Einschränkung.'
  en.b2.unit03.lesson04.teach.a_what_worries:
    title: Daniel setzt einen Fokus
    gloss: 'Daniel sagt: Da stimme ich zu. Was mir Sorgen macht, ist die zusätzliche Arbeit für das Team.'
    note: '*What worries me is...* legt den Fokus auf eine Sorge.'
  en.b2.unit03.lesson04.teach.q_does_create_checks:
    title: Leila betont mit does
    gloss: 'Leila sagt: Das stimmt. Die Richtlinie sorgt durchaus für bessere Qualitätskontrollen, fügt aber auch einen weiteren Genehmigungsschritt hinzu.'
    note: '*does create* betont, dass dieser Vorteil wirklich besteht, trotz der späteren Einschränkung.'
  en.b2.unit03.lesson04.teach.a_support_conditions:
    title: Daniel fasst die Bedingung zusammen
    gloss: 'Daniel sagt: Wir sollten sie also unter Bedingungen unterstützen?'
    note: Er fasst Leilas differenzierte Unterstützung zusammen.
  en.b2.unit03.lesson04.teach.q_broadly_useful:
    title: Leila gibt bedingte Unterstützung
    gloss: 'Leila sagt: Ja. Ich würde sagen, sie ist im Großen und Ganzen nützlich, vorausgesetzt, der Zeitplan wird angepasst.'
    note: '*provided* bedeutet hier „vorausgesetzt“: Die Unterstützung gilt nur, wenn die Bedingung erfüllt wird.'
  en.b2.unit03.lesson04.teach.same_content_triad:
    title: Derselbe Inhalt, drei Stärken
    gloss: Die Richtlinie schafft zusätzliche Arbeit. Die Richtlinie scheint zusätzliche Arbeit zu schaffen. Die Richtlinie schafft durchaus zusätzliche Arbeit.
    note: Die drei Sätze üben die neutrale Form, die vorsichtigere mit *seems to* und die nachdrücklichere mit *does*.
