teaching:
  en.b1.unit17.lesson01.teach.regret: {title: "regret", gloss: "Bedauern, Reue", note: "*regret* bedeutet ein Gefühl der Trauer über etwas, das man getan oder nicht getan hat.", example_gloss: "Daniel bedauerte, dass er die Frist verpasst hatte."}
  en.b1.unit17.lesson01.teach.wish: {title: "wish", gloss: "Wunsch", note: "*wish* bedeutet, sich zu wünschen, dass etwas anders gelaufen wäre, als es tatsächlich gelaufen ist.", example_gloss: "Daniel hatte einen Wunsch in Bezug auf die vergangene Woche."}
  en.b1.unit17.lesson01.teach.mistake: {title: "mistake", gloss: "Fehler", note: "*mistake* bedeutet etwas, das man aufgrund einer falschen Einschätzung falsch gemacht hat.", example_gloss: "So lange mit der Bitte um Hilfe zu warten, war ein Fehler."}
  en.b1.unit17.lesson01.teach.hindsight: {title: "hindsight", gloss: "im Nachhinein", note: "*hindsight* bedeutet die Einsicht in ein Ereignis, die man erst im Nachhinein hat.", example_gloss: "Im Nachhinein hätte Daniel früher etwas sagen sollen."}
  en.b1.unit17.lesson01.teach.procrastinate: {title: "procrastinate", gloss: "aufschieben", note: "*procrastinate* bedeutet, etwas aufzuschieben, das man tun sollte.", example_gloss: "Daniel schiebt Aufgaben oft auf, wenn sie sich schwierig anfühlen."}
  en.b1.unit17.lesson01.teach.delay: {title: "delay", gloss: "Verzögerung", note: "*delay* bedeutet einen Zeitraum, durch den etwas später kommt als geplant.", example_gloss: "Die Verzögerung führte dazu, dass Daniel seine erste Frist verpasste."}

  en.b1.unit17.lesson02.teach.wish_had_asked: {title: "I wish I had + Partizip", gloss: "Ich wünschte, ich hätte früher um Hilfe gebeten.", note: "*I wish I had asked* drückt einen Wunsch über etwas aus, das in der Vergangenheit nicht passiert ist."}
  en.b1.unit17.lesson02.teach.should_have_talked: {title: "I should have + Partizip", gloss: "Ich hätte früher mit meiner Teamleitung sprechen sollen.", note: "*I should have talked* sagt, was im Nachhinein die richtige Handlung gewesen wäre."}
  en.b1.unit17.lesson02.teach.if_i_had_asked_would_have_finished: {title: "if I had + Partizip, I would have + Partizip", gloss: "Wenn ich Mia in der ersten Woche um Hilfe gebeten hätte, wäre ich rechtzeitig fertig geworden.", note: "*if I had asked..., I would have finished...* beschreibt eine unwirkliche Folge in der Vergangenheit."}
  en.b1.unit17.lesson02.teach.grammar_past_hypothetical: {title: "Formen, um Bedauern über die Vergangenheit auszudrücken", gloss: "Um Bedauern über die Vergangenheit auszudrücken, verwendet man wish + Plusquamperfekt (I wish I had asked...), should have + Partizip (I should have talked...) oder if + Plusquamperfekt mit would have + Partizip (If I had asked..., I would have finished...). Alle drei beschreiben, was eigentlich nicht passiert ist.", note: "Form: Wählen Sie zwischen wish + had, should have oder if + had ... would have."}

  en.b1.unit17.lesson03.teach.looking_back: {title: "looking back", gloss: "im Rückblick", note: "*looking back* leitet eine Reflexion über die Vergangenheit ein.", example_gloss: "Im Rückblick bedauert Daniel, nicht früher um Hilfe gebeten zu haben."}
  en.b1.unit17.lesson03.teach.missed_deadline: {title: "missed deadline", gloss: "verpasste Frist", note: "*missed deadline* bedeutet einen Termin, der nicht eingehalten wurde.", example_gloss: "Daniel verpasste eine Frist, bevor er um Hilfe bat."}
  en.b1.unit17.lesson03.teach.reading_passage: {title: "Lesetext: Rückblick auf einen anstrengenden Monat", gloss: "Hallo Leila, im Rückblick wünschte ich, ich hätte früher um Hilfe gebeten. Ich hätte früher mit meiner Teamleitung über die Arbeitsbelastung sprechen sollen. Bis ich es tat, hatte ich schon eine Frist verpasst. Wenn ich Mia in der ersten Woche um Hilfe gebeten hätte, hätte ich beide Projekte rechtzeitig abgeschlossen. Es war ein Fehler, so lange zu warten. Daniel", note: "Eine kurze, nachdenkliche Nachricht."}

  en.b1.unit17.lesson04.teach.q_wish_asked_sooner: {title: "Daniel beginnt mit einer Reflexion", gloss: "Daniel sagt: Im Rückblick wünschte ich, ich hätte früher um Hilfe gebeten.", note: "*looking back* eröffnet ein nachdenkliches Gespräch."}
  en.b1.unit17.lesson04.teach.a_what_happened: {title: "Leila fragt nach", gloss: "Leila sagt: Was ist passiert?", note: "Eine kurze, offene Frage, um mehr zu erfahren."}
  en.b1.unit17.lesson04.teach.q_should_have_talked_missed: {title: "Daniel erklärt, was er hätte tun sollen", gloss: "Daniel sagt: Ich hätte früher mit meiner Teamleitung über die Arbeitsbelastung sprechen sollen. Bis ich es tat, hatte ich schon eine Frist verpasst.", note: "*should have talked* und *had already missed* verbinden Bedauern mit einer konkreten Folge."}
  en.b1.unit17.lesson04.teach.a_fair_regret_fixed: {title: "Leila beruhigt Daniel", gloss: "Leila sagt: Mach dir keine Sorgen, du hast es am Ende doch gelöst.", note: "*Don't worry* beruhigt jemanden, der sich schuldig fühlt."}
  en.b1.unit17.lesson04.teach.q_true_if_had_asked: {title: "Daniel beschreibt, was anders hätte sein können", gloss: "Daniel sagt: Stimmt. Wenn ich Mia in der ersten Woche um Hilfe gebeten hätte, hätte ich beide Projekte rechtzeitig abgeschlossen.", note: "*if I had asked..., I would have finished...* beschreibt eine unwirkliche Folge in der Vergangenheit."}
  en.b1.unit17.lesson04.teach.a_now_you_know: {title: "Leila schließt aufmunternd ab", gloss: "Leila sagt: Na ja, jetzt weißt du es fürs nächste Mal.", note: "Ein kurzer, positiver Abschluss des Gesprächs."}

