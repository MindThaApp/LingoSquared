  en.a1.unit57.lesson02.teach.what_time_does_the_film_start:
    title: What time does the film start?
    gloss: Wann beginnt der Film?
    note: '*does the film start* bildet die Frage mit dem Hilfsverb *does*, weil das Hauptverb *start* ist.'
  en.a1.unit57.lesson02.teach.two_tickets_for_the_seven_oclock_show:
    title: Two tickets for the seven o'clock show, please.
    gloss: Zwei Karten für die Vorstellung um sieben Uhr, bitte.
    note: '*for the seven o''clock show* bezieht die Karten auf eine bestimmte Vorstellung.'
  en.a1.unit57.lesson02.teach.can_i_have_some_popcorn:
    title: Can I have some popcorn, please?
    gloss: Kann ich bitte etwas Popcorn haben?
    note: '*Can I have...?* ist eine direkte, sehr gebräuchliche Art, etwas zu bestellen.'
  en.a1.unit57.lesson02.teach.how_much_is_that_in_total:
    title: How much is that in total?
    gloss: Wie viel macht das insgesamt?
    note: '*in total* bedeutet insgesamt und wird verwendet, um nach dem Endpreis zu fragen.'
  en.a1.unit57.lesson02.teach.thats_twenty_dollars:
    title: That's twenty dollars, please.
    gloss: Das macht zwanzig Dollar, bitte.
    note: '*That''s* + Preis ist eine feste Art, einen Betrag zu nennen.'
  en.a1.unit57.lesson02.teach.i_really_liked_it:
    title: I really liked it!
    gloss: Es hat mir richtig gut gefallen!
    note: Das Englische verwendet hier das Verb *like* mit dem Objekt *it*, wörtlich also etwa "Ich mochte es wirklich". Lernen Sie diesen Satz als Ganzes, nicht Wort für Wort.
  en.a1.unit57.lesson03.teach.dialogue_line1:
    title: Daniel fragt nach der Anfangszeit
    gloss: 'Daniel sagt: Hi! Wann beginnt der Film?'
    note: '*does the film start* bildet die Frage mit dem Hilfsverb *does*.'
  en.a1.unit57.lesson03.teach.dialogue_line2:
    title: Die Anfangszeit
    gloss: 'Der Kassierer sagt: Die nächste Vorstellung ist um sieben Uhr.'
    note: '*at seven o''clock* verwendet die Präposition *at* für eine Uhrzeit; im Deutschen sagt man dafür "um" (um sieben Uhr).'
  en.a1.unit57.lesson03.teach.dialogue_line3:
    title: Daniel bestellt Karten
    gloss: 'Daniel sagt: Super. Können wir bitte zwei Karten haben?'
    note: 'Eine einzelne Information: die Anzahl der Karten (zwei).'
  en.a1.unit57.lesson03.teach.dialogue_line4:
    title: Der Preis der Karten
    gloss: 'Der Kassierer sagt: Natürlich. Das macht sechzehn Dollar.'
    note: 'Eine einzelne Information: der Gesamtpreis der beiden Karten.'
  en.a1.unit57.lesson03.teach.dialogue_line5:
    title: Leila bestellt Popcorn
    gloss: 'Leila sagt: Können wir bitte etwas Popcorn haben?'
    note: Eine Bitte, keine neue Preisangabe.
  en.a1.unit57.lesson03.teach.dialogue_line6:
    title: Der Preis des Popcorns
    gloss: 'Der Kassierer sagt: Klar. Das Popcorn kostet vier Dollar.'
    note: 'Eine zweite einzelne Information: der Preis des Popcorns, getrennt von den Karten.'
  en.a1.unit57.lesson03.teach.dialogue_line7:
    title: Daniel fragt nach dem Gesamtbetrag
    gloss: 'Daniel sagt: Wie viel macht das insgesamt?'
    note: '*in total* fragt nach der Summe aller Preise.'
  en.a1.unit57.lesson03.teach.dialogue_line8:
    title: Der Gesamtbetrag
    gloss: 'Der Kassierer sagt: Das macht zwanzig Dollar, bitte.'
    note: 'Eine dritte einzelne Information: der Gesamtbetrag, anders als die Einzelpreise für Karten und Popcorn.'
  en.a1.unit57.lesson03.teach.dialogue_line9:
    title: Leila kann es kaum erwarten
    gloss: 'Leila sagt: Danke! Ich kann es kaum erwarten, ihn zu sehen.'
    note: '*I can''t wait to...* ist eine feste Wendung, um Vorfreude auszudrücken.'
  en.a1.unit57.lesson04.teach.cinema_schedule:
    title: Kinoprogramm
    gloss: 'Kinoprogramm: Star Journey - 7:00, $8. The Great Race - 5:00, $10. Funny Family - 9:00, $6.'
    note: Das Programm zeigt drei Filme mit Anfangszeit und Preis.
  en.a1.unit57.lesson04.teach.reading_passage:
    title: 'Text: Ein Abend im Kino'
    gloss: Eines Abends beschlossen Daniel und Leila, im Kino einen Film zu sehen. Sie fragten, wann er beginnt, und der Kassierer sagte, die nächste Vorstellung, Star Journey, sei um sieben Uhr. Sie kauften zwei Karten für sechzehn Dollar und eine Tüte Popcorn für vier Dollar. Das waren insgesamt zwanzig Dollar. Sie sahen sich den Film zusammen an, und er handelte von Weltraumforschern. Er war sehr lustig. Als er zu Ende war, sagte Leila, er habe ihr richtig gut gefallen, und Daniel sagte, er wolle sich den nächsten auch ansehen.
    note: '*watched* ist die Vergangenheitsform von *watch* (ansehen, zuschauen).'
