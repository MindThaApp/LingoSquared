  en.a1.unit48.lesson03.teach.dialogue_line1:
    title: Leilas Vorschlag
    gloss: 'Leila sagt: Ich muss dieses Buch in die Bibliothek zurückbringen. Kommst du mit?'
    note: '*Do you want to come with me?* bedeutet: Willst du mitkommen?'
  en.a1.unit48.lesson03.teach.dialogue_line2:
    title: Daniels Reaktion
    gloss: 'Daniel sagt: Klar! Ich glaube, ich habe noch nie ein Buch aus einer Bibliothek ausgeliehen.'
    note: '*I don''t think I''ve ever ...* bedeutet: Ich glaube nicht, dass ich je ... habe. Im Englischen steht hier das present perfect (*have ever*), im Deutschen das Perfekt.'
  en.a1.unit48.lesson03.teach.dialogue_line3:
    title: Leila am Schalter
    gloss: 'Leila sagt: Hallo, ich möchte dieses Buch gern zurückgeben und außerdem gern ein neues ausleihen.'
    note: '*and I''d like to ... too* bedeutet: und ich möchte auch gern ...'
  en.a1.unit48.lesson03.teach.dialogue_line4:
    title: Die Bibliothekarin fragt
    gloss: 'Die Bibliothekarin sagt: Prima, danke. Haben Sie Ihren Bibliotheksausweis dabei?'
    note: '*Do you have your library card?* bedeutet: Haben Sie Ihren Bibliotheksausweis dabei?'
  en.a1.unit48.lesson03.teach.dialogue_line5:
    title: "Leilas Antwort"
    gloss: 'Leila sagt: Ja, hier ist er.'
    note: '*here it is* bedeutet: Hier ist er/sie/es.'
  en.a1.unit48.lesson03.teach.dialogue_line6:
    title: Die Bibliothekarin erklärt
    gloss: 'Die Bibliothekarin sagt: Perfekt. Dieses neue Buch muss in drei Wochen zurück sein.'
    note: '*due back in three weeks* bedeutet: muss in drei Wochen zurück sein.'
  en.a1.unit48.lesson03.teach.dialogue_line7:
    title: Daniel möchte auch ausleihen
    gloss: 'Daniel sagt: Kann ich auch einen Bibliotheksausweis bekommen? Ich möchte gern ein Kochbuch ausleihen.'
    note: '*Can I get ... too?* bedeutet: Kann ich auch ... bekommen?'
  en.a1.unit48.lesson03.teach.dialogue_line8:
    title: Die Bibliothekarin hilft Daniel
    gloss: 'Die Bibliothekarin sagt: Natürlich! Füllen Sie einfach dieses Formular aus.'
    note: '*fill out this form* bedeutet: dieses Formular ausfüllen. Das Verb ist wie im Deutschen (ausfüllen) aus Verb und Zusatzwort zusammengesetzt.'
  en.a1.unit48.lesson04.teach.reading_passage:
    title: Text darüber, wie eine Bibliothek funktioniert
    gloss: 'Ein Besuch in der Bibliothek: In den meisten Bibliotheken können Sie Bücher und manchmal auch andere Medien für ein paar Wochen ausleihen. Um etwas auszuleihen, brauchen Sie in der Regel einen Bibliotheksausweis. Wenn Sie ein Buch ausleihen, nennt Ihnen die Bibliothekarin das Rückgabedatum -- den Tag, an dem Sie es zurückbringen müssen. Wenn Sie bis dahin noch nicht fertig sind, können Sie die Bibliothekarin oft um mehr Zeit bitten. Seit Leila in ihre neue Wohnung gezogen ist, besitzt sie nicht mehr so viele Bücher wie früher, deshalb leiht sie sie jetzt stattdessen in der Bibliothek aus. Letzte Woche brachte sie ein Buch zurück und holte ein neues ab, und ihr Freund Daniel kam mit. Er hatte noch nie ein Bibliotheksbuch ausgeliehen, also bekam er seinen eigenen Bibliotheksausweis und lieh sich ein Kochbuch aus, um die Rezepte zu üben, die Mia ihm beibringt. Die Bibliothekarin erinnerte beide daran, ihre Bücher vor dem Rückgabedatum zurückzubringen. Mia geht nicht oft in die Bibliothek, aber einmal hat sie ein Fotografiebuch für ihren Kurs ausgeliehen.'
    note: '*checked out a cookbook* bedeutet: lieh sich ein Kochbuch aus (*checked out* ist der feste englische Ausdruck für das Ausleihen in einer Bibliothek).'
