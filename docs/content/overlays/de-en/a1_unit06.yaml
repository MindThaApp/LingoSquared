course:
  title: "Englisch A1"
  description: "Englisch auf A1-Niveau lernen, für Begrüßungen und kurze Gespräche im Alltag, mit ausführlichen deutschen Erklärungen."

units:
  en.a1.unit06.family:
    title: "Familienmitglieder und Beziehungen"

lessons:
  en.a1.unit06.lesson01.immediate_family: {title: "Die engste Familie"}
  en.a1.unit06.lesson02.extended_family_possessives: {title: "Erweiterte Familie und Possessivpronomen"}
  en.a1.unit06.lesson03.describing_family: {title: "Die eigene Familie beschreiben"}
  en.a1.unit06.lesson04.family_photo_dialogue: {title: "Ein Familienfoto betrachten"}

teaching:
  en.a1.unit06.lesson01.teach.mother: {title: "Mother", gloss: "Mutter", note: "*mother* bedeutet Mutter.", example_gloss: "Das ist meine Mutter."}
  en.a1.unit06.lesson01.teach.father: {title: "Father", gloss: "Vater", note: "*father* bedeutet Vater.", example_gloss: "Das ist mein Vater."}
  en.a1.unit06.lesson01.teach.brother: {title: "Brother", gloss: "Bruder", note: "*brother* bedeutet Bruder.", example_gloss: "Das ist mein Bruder."}
  en.a1.unit06.lesson01.teach.sister: {title: "Sister", gloss: "Schwester", note: "*sister* bedeutet Schwester.", example_gloss: "Das ist meine Schwester."}
  en.a1.unit06.lesson01.teach.parents: {title: "Parents", gloss: "Eltern", note: "*parents* bedeutet Eltern (Vater und Mutter zusammen).", example_gloss: "Das sind meine Eltern."}
  en.a1.unit06.lesson01.teach.siblings: {title: "Siblings", gloss: "Geschwister", note: "*siblings* bedeutet Geschwister (Brüder und Schwestern zusammen).", example_gloss: "Das sind meine Geschwister."}

  en.a1.unit06.lesson02.teach.grandmother: {title: "Grandmother", gloss: "Großmutter", note: "*grandmother* bedeutet Großmutter.", example_gloss: "Das ist meine Großmutter."}
  en.a1.unit06.lesson02.teach.grandfather: {title: "Grandfather", gloss: "Großvater", note: "*grandfather* bedeutet Großvater.", example_gloss: "Das ist mein Großvater."}
  en.a1.unit06.lesson02.teach.aunt: {title: "Aunt", gloss: "Tante", note: "*aunt* bedeutet Tante.", example_gloss: "Das ist meine Tante."}
  en.a1.unit06.lesson02.teach.uncle: {title: "Uncle", gloss: "Onkel", note: "*uncle* bedeutet Onkel.", example_gloss: "Das ist mein Onkel."}
  en.a1.unit06.lesson02.teach.cousin: {title: "Cousin", gloss: "Cousin/Cousine", note: "Englisch hat nur EIN Wort, *cousin*, für beide Geschlechter -- Deutsch unterscheidet Cousin (männlich) und Cousine (weiblich).", example_gloss: "Das ist mein Cousin/meine Cousine."}
  en.a1.unit06.lesson02.teach.my_mother: {title: "My mother", gloss: "meine Mutter", note: "*my* entspricht mein/meine -- hier *meine*, weil Mutter feminin ist."}
  en.a1.unit06.lesson02.teach.your_father: {title: "Your father", gloss: "Ihr Vater / dein Vater", note: "*your* ist im Deutschen Ihr (förmlich, wie Sie) oder dein (informell) -- diese Wahl hängt vom Gesprächspartner ab, nicht vom Geschlecht. Unabhängig davon ändert sich die Endung je nach Geschlecht des Besitzten: hier *Ihr*/*dein* ohne -e, weil Vater maskulin ist (bei Mutter wäre es *Ihre*/*deine*)."}
  en.a1.unit06.lesson02.teach.his_sister: {title: "His sister", gloss: "seine Schwester", note: "*his* entspricht sein/seine -- hier *seine*, weil Schwester feminin ist, obwohl der Besitzer männlich ist."}
  en.a1.unit06.lesson02.teach.her_brother: {title: "Her brother", gloss: "ihr Bruder", note: "*her* entspricht ihr/ihre -- hier *ihr*, weil Bruder maskulin ist."}

  en.a1.unit06.lesson03.teach.this_is_my_sister: {title: "This is my sister.", gloss: "Das ist meine Schwester.", note: "*This is my sister.* stellt eine Person auf einem Foto vor."}
  en.a1.unit06.lesson03.teach.she_is_20: {title: "She's twenty years old.", gloss: "Sie ist zwanzig Jahre alt.", note: "*She's twenty years old.* nennt das Alter."}
  en.a1.unit06.lesson03.teach.i_have_two_brothers: {title: "I have two brothers.", gloss: "Ich habe zwei Brüder.", note: "*brothers* ist die Pluralform von *brother*."}
  en.a1.unit06.lesson03.teach.do_you_have_siblings: {title: "Do you have any siblings?", gloss: "Haben Sie Geschwister?", note: "*Do you have any siblings?* fragt allgemein nach Geschwistern."}
  en.a1.unit06.lesson03.teach.no_i_dont: {title: "No, I don't. I'm an only child.", gloss: "Nein. Ich bin Einzelkind.", note: "*an only child* bedeutet Einzelkind."}

  en.a1.unit06.lesson04.teach.photo: {title: "Photo", gloss: "Foto", note: "*photo* bedeutet Foto.", example_gloss: "Ich habe ein Foto."}
  en.a1.unit06.lesson04.teach.q_family: {title: "Leila fragt nach der Familie", gloss: "Leila: Ist das Ihre Familie?", note: "*Is this your family?* fragt, ob das Foto die eigene Familie zeigt."}
  en.a1.unit06.lesson04.teach.a_parents: {title: "Antwort über die Eltern", gloss: "Daniel: Ja. Das ist meine Mutter und das ist mein Vater.", note: "Eine vollständige Antwort nennt beide Elternteile einzeln."}
  en.a1.unit06.lesson04.teach.q_who: {title: "Nach einer Person fragen", gloss: "Leila: Wer ist das?", note: "*Who is this?* fragt nach der Identität der gezeigten Person."}
  en.a1.unit06.lesson04.teach.a_sister_teacher: {title: "Antwort über die Schwester", gloss: "Daniel: Das ist meine Schwester. Sie ist Lehrerin.", note: "*She's a teacher.* nennt den Beruf."}
  en.a1.unit06.lesson04.teach.q_brothers: {title: "Nach Brüdern fragen", gloss: "Leila: Haben Sie Brüder?", note: "*Do you have any brothers?* fragt speziell nach Brüdern, nicht allgemein nach Geschwistern."}
  en.a1.unit06.lesson04.teach.a_no_one_sister: {title: "Antwort über Geschwister", gloss: "Daniel: Nein. Ich habe nur eine Schwester.", note: "*I just have one sister.* schränkt die vorherige Antwort ein."}

exercises:
  en.a1.unit06.lesson01.exercise01.listen_mother:
    instruction: "Hören Sie zu und wählen Sie das genannte Familienwort."
    correct_option: "mother"
    distractors: ["father", "sister", "aunt"]
    accepted_answers: [{value: "mother", status: "correct"}]
    feedback: "*mother* bedeutet Mutter."
  en.a1.unit06.lesson01.exercise02.choose_brother:
    instruction: "Ein männliches Geschwisterteil nennt man auf Englisch..."
    correct_option: "brother"
    distractors: ["father", "sister", "uncle"]
    accepted_answers: [{value: "brother", status: "correct"}]
    feedback: "*brother* bedeutet Bruder."
  en.a1.unit06.lesson01.exercise03.choose_parents:
    instruction: "Ihre Mutter und Ihr Vater zusammen sind Ihre..."
    correct_option: "parents"
    distractors: ["siblings", "grandparents", "family"]
    accepted_answers: [{value: "parents", status: "correct"}]
    feedback: "*parents* bedeutet Eltern."
  en.a1.unit06.lesson01.exercise04.match_family_words:
    instruction: "Verbinden Sie jede Beschreibung mit dem richtigen Familienwort."
    accepted_answers:
      - value:
          - {left: "female parent", right: "mother"}
          - {left: "male parent", right: "father"}
          - {left: "male sibling", right: "brother"}
          - {left: "female sibling", right: "sister"}
          - {left: "mother and father together", right: "parents"}
          - {left: "brothers and sisters together", right: "siblings"}
          - {left: "your mother's sister", right: "aunt"}
          - {left: "your mother's or father's mother", right: "grandmother"}
          - {left: "your mother's or father's father", right: "grandfather"}
          - {left: "your father's brother", right: "uncle"}
          - {left: "your aunt or uncle's child", right: "cousin"}
        status: "correct"
    feedback: "*father*=Vater, *mother*=Mutter, *brother*=Bruder, *sister*=Schwester."
  en.a1.unit06.lesson01.exercise05.write_siblings:
    instruction: "Schreiben Sie das Wort für Brüder und Schwestern zusammen, auf Englisch."
    accepted_answers:
      - {value: "siblings", status: "correct"}
      - {value: "siblings.", status: "correct"}
    feedback: "*siblings* bedeutet Geschwister."

  en.a1.unit06.lesson02.exercise01.listen_extended:
    instruction: "Hören Sie zu und wählen Sie das genannte Familienwort."
    correct_option: "grandmother"
    distractors: ["grandfather", "aunt", "cousin"]
    accepted_answers: [{value: "grandmother", status: "correct"}]
    feedback: "*grandmother* bedeutet Großmutter."
  en.a1.unit06.lesson02.exercise02.choose_aunt:
    instruction: "Die Schwester Ihrer Mutter ist Ihre..."
    correct_option: "aunt"
    distractors: ["uncle", "cousin", "grandmother"]
    accepted_answers: [{value: "aunt", status: "correct"}]
    feedback: "*aunt* bedeutet Tante."
  en.a1.unit06.lesson02.exercise03.choose_his:
    instruction: "Daniel ist ein Mann. Das ist _ Schwester. (Welches englische Possessivpronomen?)"
    correct_option: "his"
    distractors: ["her", "your", "my"]
    accepted_answers: [{value: "his", status: "correct"}]
    feedback: "*his sister* bedeutet 'seine Schwester' -- im Englischen ändert sich *his* nicht mit dem Geschlecht des Besitzten, anders als im Deutschen (seine, nicht sein)."
  en.a1.unit06.lesson02.exercise04.choose_her:
    instruction: "Leila ist eine Frau. Das ist _ Bruder. (Welches englische Possessivpronomen?)"
    correct_option: "her"
    distractors: ["his", "your", "my"]
    accepted_answers: [{value: "her", status: "correct"}]
    feedback: "*her brother* bedeutet 'ihr Bruder' -- auch hier bleibt *her* unverändert, anders als das deutsche *ihr*, das mit dem Geschlecht des Besitzten übereinstimmt."
  en.a1.unit06.lesson02.exercise05.order_your_father:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um (mit dem Familienfoto) nach dem Vater einer anderen Person zu fragen: 'your father'."
    accepted_answers: [{value: ["your", "father"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *your father.*"
  en.a1.unit06.lesson02.exercise06.write_cousin:
    instruction: "Schreiben Sie das englische Wort für den Sohn oder die Tochter Ihrer Tante oder Ihres Onkels."
    accepted_answers:
      - {value: "cousin", status: "correct"}
      - {value: "cousin.", status: "correct"}
    feedback: "*cousin* bedeutet Cousin/Cousine -- Englisch verwendet nur ein Wort für beide Geschlechter."

  en.a1.unit06.lesson03.exercise01.choose_this_is:
    instruction: "Stellen Sie Ihre Schwester auf einem Foto vor."
    correct_option: "This is my sister."
    distractors: ["This is my brother.", "This is his sister.", "This are my sister."]
    accepted_answers: [{value: "This is my sister.", status: "correct"}]
    feedback: "*This is my sister* bedeutet 'Das ist meine Schwester.'"
  en.a1.unit06.lesson03.exercise02.order_have_siblings:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um zu fragen 'Do you have any siblings?'"
    accepted_answers: [{value: ["Do", "you", "have", "any", "siblings"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *Do you have any siblings?*"
  en.a1.unit06.lesson03.exercise03.reply_siblings:
    instruction: "Antworten Sie auf 'Do you have any siblings?': Sie haben zwei Brüder."
    accepted_answers:
      - {value: "I have two brothers.", status: "correct"}
      - {value: "I have two brothers", status: "correct"}
    feedback: "*I have two brothers* bedeutet 'Ich habe zwei Brüder.'"
  en.a1.unit06.lesson03.exercise04.reply_only_child:
    instruction: "Antworten Sie auf 'Do you have any siblings?': Nein, Sie sind Einzelkind."
    accepted_answers:
      - {value: "No, I don't. I'm an only child.", status: "correct"}
      - {value: "No, I don't, I'm an only child.", status: "correct"}
      - {value: "No, I don't, and I'm an only child.", status: "correct"}
      - {value: "No I don't I'm an only child", status: "correct"}
    feedback: "*No, I don't. I'm an only child* bedeutet 'Nein. Ich bin Einzelkind.'"
  en.a1.unit06.lesson03.exercise05.write_sister_age:
    instruction: "Schreiben Sie das Alter Ihrer Schwester: sie ist 20."
    accepted_answers:
      - {value: "She's twenty years old", status: "correct"}
      - {value: "She's twenty years old.", status: "correct"}
    feedback: "*She's twenty years old* bedeutet 'Sie ist zwanzig Jahre alt.'"

  en.a1.unit06.lesson04.exercise01.listen_parents:
    instruction: "Hören Sie das Gespräch. Wen nennt Daniel zuerst?"
    correct_option: "This is my mother and this is my father"
    distractors: ["She's a teacher", "Do you have any brothers?", "No, I don't. I just have one sister."]
    accepted_answers: [{value: "This is my mother and this is my father", status: "correct"}]
    feedback: "Daniel sagt: *This is my mother and this is my father.*"
  en.a1.unit06.lesson04.exercise02.listen_sister_job:
    instruction: "Hören Sie noch einmal. Was ist der Beruf von Daniels Schwester?"
    correct_option: "She's a teacher"
    distractors: ["This is my sister", "Do you have any brothers?", "No, I don't. I just have one sister."]
    accepted_answers: [{value: "She's a teacher", status: "correct"}]
    feedback: "*She's a teacher* bedeutet 'Sie ist Lehrerin.'"
  en.a1.unit06.lesson04.exercise03.choose_brothers_answer:
    instruction: "Hat Daniel Brüder?"
    correct_option: "No, I don't. I just have one sister."
    distractors: ["Yes, I have one brother.", "I don't have any siblings.", "She's a teacher."]
    accepted_answers: [{value: "No, I don't. I just have one sister.", status: "correct"}]
    feedback: "*No, I don't. I just have one sister* bedeutet 'Nein. Ich habe nur eine Schwester.'"
  en.a1.unit06.lesson04.exercise04.order_who_question:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um zu fragen 'Who is this?'"
    accepted_answers: [{value: ["Who", "is", "this"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *Who is this?*"
  en.a1.unit06.lesson04.exercise05.reply_as_daniel:
    instruction: "Antworten Sie als Daniel: nennen Sie beide Elternteile, dann Ihre Schwester."
    accepted_answers:
      - {value: "This is my mother and this is my father. This is my sister. She's a teacher.", status: "correct"}
      - {value: "This is my mother and this is my father, and this is my sister, who's a teacher.", status: "correct"}
      - {value: "This is my mother and this is my father This is my sister She's a teacher", status: "correct"}
    feedback: "Eine vollständige Antwort nennt beide Elternteile und dann die Schwester mit ihrem Beruf."
  en.a1.unit06.lesson04.exercise06.speak_family:
    instruction: "Antworten Sie als Daniel laut: nennen Sie beide Elternteile, Ihre Schwester und ob Sie Brüder haben."
    accepted_answers:
      - {value: "This is my mother and this is my father This is my sister She's a teacher No I don't I just have one sister", status: "correct"}
      - {value: "This is my mother and this is my father. This is my sister. She's a teacher. No, I don't. I just have one sister.", status: "correct"}
    feedback: "Diese vollständige Antwort deckt beide Elternteile, die Schwester und die Geschwisterfrage ab."
