teaching:
  en.a1.unit22.lesson01.teach.headache:
    title: headache
    gloss: Kopfschmerzen
    note: '*headache* bedeutet kopfschmerzen. Im Deutschen steht oft der Plural (''Ich habe Kopfschmerzen''); im Englischen sagen Sie *a headache*, also Singular mit Artikel.'
    example_gloss: Ich habe Kopfschmerzen.
  en.a1.unit22.lesson01.teach.stomachache:
    title: stomachache
    gloss: Bauchschmerzen
    note: '*stomachache* bedeutet Bauchschmerzen. Auch hier: Singular mit Artikel (*a stomachache*), nicht Plural.'
    example_gloss: Ich habe Bauchschmerzen.
  en.a1.unit22.lesson01.teach.fever:
    title: fever
    gloss: Fieber
    note: '*fever* bedeutet Fieber. Man sagt *have a fever*, nicht *have fever*.'
    example_gloss: Ich glaube, ich habe Fieber.
  en.a1.unit22.lesson01.teach.cough:
    title: cough
    gloss: Husten
    note: '*cough* bedeutet Husten. Das Wort ist Nomen und Verb: *a cough* (der Husten), *to cough* (husten).'
    example_gloss: Daniel hat starken Husten.
  en.a1.unit22.lesson01.teach.sore_throat:
    title: sore throat
    gloss: Halsschmerzen
    note: '*sore throat* bedeutet Halsschmerzen. *sore* heißt ''wund, schmerzend''; auch hier steht ein Artikel: *a sore throat*.'
    example_gloss: Ich habe Halsschmerzen.
  en.a1.unit22.lesson02.teach.whats_wrong:
    title: What's wrong?
    gloss: Was ist los?
    note: Mit *What's wrong?* fragen Sie nach einem Problem. *What's* ist die Kurzform von *What is*.
  en.a1.unit22.lesson02.teach.i_have_a_headache:
    title: I have a headache.
    gloss: Ich habe Kopfschmerzen.
    note: Mit *I have a...* nennen Sie eine Beschwerde. Das ist wörtlich 'Ich habe ...', genau wie im Deutschen.
  en.a1.unit22.lesson02.teach.i_feel_hot:
    title: I feel hot.
    gloss: Mir ist heiß.
    note: Mit *I feel...* sagen Sie, wie Sie sich körperlich fühlen. *I feel hot* heißt wörtlich 'Ich fühle mich heiß', gemeint ist 'Mir ist heiß'. Im Englischen ist das Subjekt *I*, nicht 'mir'.
  en.a1.unit22.lesson03.teach.rest:
    title: rest
    gloss: ausruhen
    note: '*rest* bedeutet ausruhen.'
    example_gloss: Ich muss mich ausruhen.
  en.a1.unit22.lesson03.teach.symptom_text:
    title: Text über Beschwerden
    gloss: Ich habe Kopfschmerzen und Halsschmerzen. Ich glaube, ich habe auch Fieber. Ich muss mich ausruhen.
    note: In diesem kurzen Text beschreibt jemand mehrere Beschwerden auf einmal.
  en.a1.unit22.lesson04.teach.see_a_doctor:
    title: You should see a doctor.
    gloss: Du solltest zum Arzt gehen.
    note: 'Mit *You should...* geben Sie einen einfachen Rat: ''du solltest ...''. Nach *should* folgt das Verb ohne *to*.'
  en.a1.unit22.lesson04.teach.q_dont_look_well:
    title: Fragen, wie es geht
    gloss: 'Leila sagt: Du siehst nicht gut aus. Was ist los?'
    note: '*You don''t look well* bedeutet: Du siehst nicht gut aus.'
  en.a1.unit22.lesson04.teach.a_headache_sore_throat:
    title: Daniels Antwort
    gloss: 'Daniel sagt: Ich habe Kopfschmerzen und Halsschmerzen.'
    note: Daniel nennt zwei Beschwerden zusammen.
  en.a1.unit22.lesson04.teach.q_do_you_have_fever:
    title: Nach Fieber fragen
    gloss: 'Leila fragt: Hast du Fieber?'
    note: Mit *Do you have a fever?* fragen Sie nach einer bestimmten Beschwerde.
  en.a1.unit22.lesson04.teach.a_not_sure_feel_hot:
    title: Daniels Antwort
    gloss: 'Daniel sagt: Ich bin nicht sicher, aber mir ist heiß.'
    note: Daniel ist nicht sicher, sagt aber, wie er sich fühlt.
  en.a1.unit22.lesson04.teach.a_rest_water_doctor:
    title: Leilas Rat
    gloss: 'Leila sagt: Du solltest dich ausruhen und Wasser trinken. Wenn es nicht besser wird, solltest du zum Arzt gehen.'
    note: Leila gibt zuerst einen einfachen Rat und sagt dann, wann Daniel zum Arzt gehen sollte.
  en.a1.unit22.lesson04.teach.a_okay_rest_today:
    title: Daniels letzte Antwort
    gloss: 'Daniel sagt: Okay, danke. Ich ruhe mich heute aus.'
    note: Daniel nimmt den Rat an und sagt, was er heute vorhat.
