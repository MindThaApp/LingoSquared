course:
  title: "Englisch A1"
  description: "Englisch auf A1-Niveau lernen, für Begrüßungen und kurze Gespräche im Alltag, mit ausführlichen deutschen Erklärungen."

units:
  en.a1.unit11.weather: {title: "Über das Wetter sprechen"}

lessons:
  en.a1.unit11.lesson01.weather_words: {title: "Übliche Wetterwörter"}
  en.a1.unit11.lesson02.describing_todays_weather: {title: "Das heutige Wetter beschreiben"}
  en.a1.unit11.lesson03.reading_a_forecast: {title: "Eine Wettervorhersage lesen"}
  en.a1.unit11.lesson04.weather_plan_dialogue: {title: "Pläne aufgrund des Wetters machen"}

teaching:
  en.a1.unit11.lesson01.teach.sunny: {title: "Sunny", gloss: "sonnig", note: "*sunny* bedeutet sonnig.", example_gloss: "Heute ist es sonnig."}
  en.a1.unit11.lesson01.teach.rainy: {title: "Rainy", gloss: "regnerisch", note: "*rainy* bedeutet regnerisch.", example_gloss: "Ich mag keine regnerischen Tage."}
  en.a1.unit11.lesson01.teach.cloudy: {title: "Cloudy", gloss: "bewölkt", note: "*cloudy* bedeutet bewölkt.", example_gloss: "Der Himmel ist bewölkt."}
  en.a1.unit11.lesson01.teach.cold: {title: "Cold", gloss: "kalt", note: "*cold* bedeutet kalt.", example_gloss: "Es ist sehr kalt draußen."}
  en.a1.unit11.lesson01.teach.hot: {title: "Hot", gloss: "heiß", note: "*hot* bedeutet heiß.", example_gloss: "Im Sommer ist es heiß."}
  en.a1.unit11.lesson01.teach.windy: {title: "Windy", gloss: "windig", note: "*windy* bedeutet windig.", example_gloss: "Heute ist es windig."}

  en.a1.unit11.lesson02.teach.whats_weather_like: {title: "What's the weather like today?", gloss: "Wie ist das Wetter heute?", note: "*What's the weather like?* ist die Standardfrage nach dem Wetter."}
  en.a1.unit11.lesson02.teach.its_sunny: {title: "It's sunny and warm.", gloss: "Es ist sonnig und warm.", note: "*It's* + Adjektiv beschreibt das aktuelle Wetter."}
  en.a1.unit11.lesson02.teach.its_raining: {title: "It's raining.", gloss: "Es regnet.", note: "*It's raining* steht im Present Progressive -- im Deutschen einfach 'Es regnet.'"}
  en.a1.unit11.lesson02.teach.take_umbrella: {title: "You should take an umbrella.", gloss: "Du solltest einen Regenschirm mitnehmen.", note: "*should* drückt eine Empfehlung aus, wie 'sollte(st)' im Deutschen."}

  en.a1.unit11.lesson03.teach.tomorrow: {title: "Tomorrow", gloss: "morgen", note: "*tomorrow* bedeutet morgen (der nächste Tag).", example_gloss: "Ich sehe dich morgen."}
  en.a1.unit11.lesson03.teach.forecast_text: {title: "Weather forecast", gloss: "Morgen wird es sonnig und warm. Am Samstag wird es regnen.", note: "*will* + Verb bildet die englische Zukunftsform, ähnlich wie 'werden' + Infinitiv im Deutschen."}

  en.a1.unit11.lesson04.teach.lets_go: {title: "Let's go to the park.", gloss: "Lass uns in den Park gehen.", note: "*Let's* + Verb bedeutet 'Lass uns...' -- ein Vorschlag."}
  en.a1.unit11.lesson04.teach.q_weather: {title: "Frage von Leila", gloss: "Leila: Wie ist das Wetter heute?", note: "Leila eröffnet das Gespräch mit einer Wetterfrage."}
  en.a1.unit11.lesson04.teach.a_sunny_warm: {title: "Antwort von Daniel", gloss: "Daniel: Es ist sonnig und warm.", note: "Daniel beschreibt das aktuelle Wetter."}
  en.a1.unit11.lesson04.teach.suggest_park: {title: "Vorschlag von Leila", gloss: "Leila: Toll, lass uns in den Park gehen.", note: "*Great* drückt Begeisterung über das gute Wetter aus."}
  en.a1.unit11.lesson04.teach.agree_rain_tomorrow: {title: "Antwort von Daniel", gloss: "Daniel: Gute Idee. Aber morgen wird es regnen, also lass uns heute gehen.", note: "*so* verbindet den Grund (Regen morgen) mit der Konsequenz (heute gehen)."}

exercises:
  en.a1.unit11.lesson01.exercise01.listen_condition:
    instruction: "Hören Sie zu und wählen Sie das genannte Wort."
    correct_option: "cloudy"
    distractors: ["warm", "snowy", "stormy"]
    accepted_answers: [{value: "cloudy", status: "correct"}]
    feedback: "*cloudy* bedeutet bewölkt."
  en.a1.unit11.lesson01.exercise02.choose_hot:
    instruction: "Das Gegenteil von kalt ist..."
    correct_option: "hot"
    distractors: ["cold", "windy", "cloudy"]
    accepted_answers: [{value: "hot", status: "correct"}]
    feedback: "*hot* bedeutet heiß, das Gegenteil von *cold* (kalt)."
  en.a1.unit11.lesson01.exercise03.choose_rainy:
    instruction: "Welches Wort beschreibt Wetter mit viel Regen?"
    correct_option: "rainy"
    distractors: ["sunny", "cloudy", "windy"]
    accepted_answers: [{value: "rainy", status: "correct"}]
    feedback: "*rainy* bedeutet regnerisch."
  en.a1.unit11.lesson01.exercise04.match_weather_words:
    instruction: "Verbinden Sie jedes englische Wetterwort mit der richtigen deutschen Beschreibung."
    pairs:
      - {left: "sunny", right: "sonnig"}
      - {left: "rainy", right: "regnerisch"}
      - {left: "cold", right: "niedrige Temperatur"}
      - {left: "windy", right: "stark bewegte Luft"}
      - {left: "cloudy", right: "bewölkt"}
      - {left: "hot", right: "hohe Temperatur"}
    accepted_answers:
      - value:
          - {left: "sunny", right: "sonnig"}
          - {left: "rainy", right: "regnerisch"}
          - {left: "cold", right: "niedrige Temperatur"}
          - {left: "windy", right: "stark bewegte Luft"}
          - {left: "cloudy", right: "bewölkt"}
          - {left: "hot", right: "hohe Temperatur"}
        status: "correct"
    feedback: "*sunny*=sonnig, *rainy*=regnerisch, *cold*=kalt, *windy*=windig, *cloudy*=bewölkt, *hot*=heiß."
  en.a1.unit11.lesson01.exercise05.write_cloudy:
    instruction: "Schreiben Sie das Wort für einen Himmel voller Wolken."
    accepted_answers:
      - {value: "cloudy", status: "correct"}
      - {value: "cloudy.", status: "correct"}
    feedback: "*cloudy* bedeutet bewölkt."

  en.a1.unit11.lesson02.exercise01.listen_weather_question:
    instruction: "Hören Sie zu und wählen Sie die Frage, die Sie hören."
    correct_option: "What's the weather like today"
    distractors: ["It's sunny and warm.", "It's raining.", "You should take an umbrella."]
    accepted_answers: [{value: "What's the weather like today", status: "correct"}]
    feedback: "*What's the weather like today?* bedeutet 'Wie ist das Wetter heute?'"
  en.a1.unit11.lesson02.exercise02.choose_weather_answer:
    instruction: "Wie ist das Wetter heute?"
    correct_option: "It's sunny and warm."
    distractors: ["It's raining.", "You should take an umbrella.", "It's cold and windy."]
    accepted_answers: [{value: "It's sunny and warm.", status: "correct"}]
    feedback: "*It's sunny and warm* bedeutet 'Es ist sonnig und warm.'"
  en.a1.unit11.lesson02.exercise03.order_its_raining:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um zu sagen, dass es regnet."
    accepted_answers: [{value: ["It's", "raining"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *It's raining.*"
  en.a1.unit11.lesson02.exercise04.reply_umbrella:
    instruction: "Jemand sagt: 'It's raining. What should I take?' Antworten Sie, dass die Person einen Regenschirm mitnehmen sollte."
    accepted_answers:
      - {value: "You should take an umbrella.", status: "correct"}
      - {value: "You should take an umbrella", status: "correct"}
    feedback: "*You should take an umbrella* bedeutet 'Du solltest einen Regenschirm mitnehmen.'"
  en.a1.unit11.lesson02.exercise05.write_weather:
    instruction: "Schreiben Sie, dass es heute sonnig und warm ist."
    accepted_answers:
      - {value: "It's sunny and warm", status: "correct"}
      - {value: "It's sunny and warm.", status: "correct"}
    feedback: "*It's sunny and warm* bedeutet 'Es ist sonnig und warm.'"

  en.a1.unit11.lesson03.exercise01.read_tomorrow_weather:
    instruction: "Wie wird das Wetter morgen sein?"
    correct_option: "sunny and warm"
    distractors: ["cold and windy", "rainy and cold", "cloudy all day"]
    accepted_answers: [{value: "sunny and warm", status: "correct"}]
    feedback: "Die Vorhersage sagt: *Tomorrow will be sunny and warm* -- morgen wird es sonnig und warm."
  en.a1.unit11.lesson03.exercise02.read_rain_day:
    instruction: "An welchem Tag wird es regnen?"
    correct_option: "Saturday"
    distractors: ["Sunday", "Monday", "Friday"]
    accepted_answers: [{value: "Saturday", status: "correct"}]
    feedback: "Die Vorhersage sagt: *It will rain on Saturday* -- am Samstag wird es regnen."
  en.a1.unit11.lesson03.exercise03.choose_umbrella_day:
    instruction: "An welchem Tag sollten Sie laut Vorhersage einen Regenschirm mitnehmen?"
    correct_option: "Saturday"
    distractors: ["Sunday", "Monday", "Friday"]
    accepted_answers: [{value: "Saturday", status: "correct"}]
    feedback: "Da es am Samstag regnen wird, braucht man dann einen Regenschirm."
  en.a1.unit11.lesson03.exercise04.order_forecast_sentence:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um zu sagen, dass es am Samstag regnen wird."
    accepted_answers: [{value: ["It", "will", "rain", "on", "Saturday"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *It will rain on Saturday.*"
  en.a1.unit11.lesson03.exercise05.write_forecast:
    instruction: "Schreiben Sie, dass es morgen sonnig und warm sein wird."
    accepted_answers:
      - {value: "Tomorrow will be sunny and warm", status: "correct"}
      - {value: "Tomorrow will be sunny and warm.", status: "correct"}
    feedback: "*Tomorrow will be sunny and warm* bedeutet 'Morgen wird es sonnig und warm sein.'"

  en.a1.unit11.lesson04.exercise01.listen_todays_weather:
    instruction: "Hören Sie das Gespräch. Wie ist das Wetter heute laut Daniel?"
    correct_option: "It's sunny and warm"
    distractors: ["it's going to rain tomorrow", "Let's go to the park.", "Take an umbrella."]
    accepted_answers: [{value: "It's sunny and warm", status: "correct"}]
    feedback: "Daniel sagt: *It's sunny and warm* -- 'Es ist sonnig und warm.'"
  en.a1.unit11.lesson04.exercise02.listen_tomorrow_weather:
    instruction: "Hören Sie noch einmal und wählen Sie, was Sie hören."
    correct_option: "it's going to rain tomorrow"
    distractors: ["it's going to snow tomorrow", "It's cold today.", "Take an umbrella."]
    accepted_answers: [{value: "it's going to rain tomorrow", status: "correct"}]
    feedback: "*it's going to rain tomorrow* bedeutet 'morgen wird es regnen.'"
  en.a1.unit11.lesson04.exercise03.choose_reason_go_today:
    instruction: "Warum entscheiden sie sich, heute statt morgen in den Park zu gehen?"
    correct_option: "it's going to rain tomorrow"
    distractors: ["it's too cold today", "the park is closed tomorrow", "they are busy today"]
    accepted_answers: [{value: "it's going to rain tomorrow", status: "correct"}]
    feedback: "Daniel sagt: *it's going to rain tomorrow, so let's go today* -- morgen soll es regnen, deshalb gehen sie heute."
  en.a1.unit11.lesson04.exercise04.order_suggest_park:
    instruction: "Bringen Sie die Wörter in die richtige Reihenfolge, um vorzuschlagen, in den Park zu gehen (mitten im Satz, nach 'Great,')."
    accepted_answers: [{value: ["let's", "go", "to", "the", "park"], status: "correct"}]
    feedback: "Die richtige Reihenfolge ist *let's go to the park* (klein geschrieben, da es nach 'Great,' mitten im Satz steht)."
  en.a1.unit11.lesson04.exercise05.reply_as_daniel:
    instruction: "Antworten Sie als Daniel auf Leilas Fragen: Sagen Sie, dass es sonnig und warm ist, stimmen Sie der Idee zu, sagen Sie aber, dass es morgen regnen wird, und schlagen Sie vor, heute zu gehen."
    accepted_answers:
      - {value: "It's sunny and warm. Good idea. But it's going to rain tomorrow, so let's go today.", status: "correct"}
      - {value: "It's sunny and warm, and good idea, but it's going to rain tomorrow, so let's go today.", status: "correct"}
      - {value: "It's sunny and warm Good idea But it's going to rain tomorrow so let's go today", status: "correct"}
    feedback: "Eine vollständige Antwort beschreibt das heutige Wetter, stimmt zu, nennt den Grund (Regen morgen) und schlägt vor, heute zu gehen."
  en.a1.unit11.lesson04.exercise06.speak_weather_plan:
    instruction: "Antworten Sie laut als Daniel auf Leilas Fragen: Sagen Sie, dass es sonnig und warm ist, stimmen Sie der Idee zu, sagen Sie aber, dass es morgen regnen wird, und schlagen Sie vor, heute zu gehen."
    accepted_answers:
      - {value: "It's sunny and warm Good idea But it's going to rain tomorrow so let's go today", status: "correct"}
      - {value: "It's sunny and warm. Good idea. But it's going to rain tomorrow, so let's go today.", status: "correct"}
      - {value: "It's sunny and warm, good idea, but it's going to rain tomorrow, so let's go today.", status: "correct"}
    feedback: "Diese vollständige Antwort deckt das Wetter, die Zustimmung, den Grund und den Vorschlag ab."
