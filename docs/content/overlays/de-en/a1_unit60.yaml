    title: Daniel hat Zeit
    gloss: 'Daniel sagt: Ja, ich habe Zeit.'
    note: '*I am free* bedeutet: Ich habe Zeit.'
  en.a1.unit60.lesson03.teach.dialogue_line3:
    title: Leila lädt Daniel ein
    gloss: 'Leila sagt: Möchtest du zum Abendessen kommen?'
    note: '*Would you like to come...?* ist höflich und freundlich.'
  en.a1.unit60.lesson03.teach.dialogue_line4:
