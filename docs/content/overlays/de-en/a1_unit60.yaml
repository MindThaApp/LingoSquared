  en.a1.unit60.lesson03.teach.dialogue_line7:
    title: Leila nennt sechs Uhr
    gloss: 'Leila sagt: Bis um sechs!'
    note: '*at six* verwendet *at* für eine Uhrzeit.'
  en.a1.unit60.lesson03.teach.dialogue_line8:
    title: Daniel bedankt sich bei Leila
    gloss: 'Daniel sagt: Super. Danke für die Einladung.'
    note: '*Thank you for...* verwendet *for* für den Grund des Dankes.'
  en.a1.unit60.lesson04.teach.invitation_message:
    title: Einladung
    gloss: 'Einladung zum Abendessen: Samstag um 6.00 Uhr. Bring bitte ein Getränk mit. Adresse: Park Street 18.'
    note: Die Einladung nennt den Tag, die Uhrzeit, was Daniel mitbringen soll, und die Adresse.
  en.a1.unit60.lesson04.teach.reading_passage:
    title: 'Text: Abendessen bei Leila zu Hause'
    gloss: 'Abendessen bei Leila zu Hause: Leila lud Daniel am Samstag zum Abendessen ein. Sie bat ihn, ein Getränk mitzubringen. Daniel sagte, er könne kommen. In der Einladung stand, dass das Essen um 6.00 Uhr in der Park Street 18 sei. Daniel schrieb die Adresse in sein Handy. Er wollte pünktlich ankommen. Leila freute sich, weil ihr Freund kommen konnte.'
    note: '*invited Daniel to dinner* bedeutet, dass Leila Daniel zum Abendessen eingeladen hat.'
