teaching:
  en.a1.unit23.lesson01.teach.teacher:
    title: teacher
    gloss: Lehrer, Lehrerin
    note: '*teacher* bedeutet Lehrer oder Lehrerin. Das Englische unterscheidet die Geschlechter hier nicht: *teacher* gilt für beide.'
    example_gloss: Leila ist Lehrerin.
  en.a1.unit23.lesson01.teach.nurse:
    title: nurse
    gloss: Krankenpfleger, Krankenschwester
    note: '*nurse* bedeutet Krankenpfleger oder Krankenschwester. Das Wort ist für Frauen und Männer gleich.'
    example_gloss: Ich bin Krankenpfleger/Krankenschwester.
  en.a1.unit23.lesson01.teach.engineer:
    title: engineer
    gloss: Ingenieur, Ingenieurin
    note: '*engineer* bedeutet Ingenieur oder Ingenieurin. Vor Vokalen steht *an*: *an engineer*.'
    example_gloss: Daniel ist Ingenieur.
  en.a1.unit23.lesson01.teach.cook:
    title: cook
    gloss: Koch, Köchin
    note: '*cook* bedeutet Koch oder Köchin; das Wort ist auch ein Verb (''kochen'').'
    example_gloss: Mein Bruder ist Koch.
  en.a1.unit23.lesson01.teach.driver:
    title: driver
    gloss: Fahrer, Fahrerin
    note: '*driver* bedeutet Fahrer oder Fahrerin. In *bus driver* wird es zusammen mit dem Fahrzeug genannt, das im Englischen vorangestellt wird.'
    example_gloss: Er ist Busfahrer.
  en.a1.unit23.lesson02.teach.what_do_you_do:
    title: What do you do?
    gloss: Was machen Sie beruflich?
    note: Mit *What do you do?* fragen Sie nach dem Beruf. Es heißt wörtlich 'Was tun Sie?', gemeint ist 'Was machen Sie beruflich?'.
  en.a1.unit23.lesson02.teach.im_a_nurse:
    title: I'm a nurse.
    gloss: Ich bin Krankenpfleger/Krankenschwester.
    note: 'Mit *I''m a...* nennen Sie Ihren Beruf. Achtung: Im Deutschen sagt man ''Ich bin Lehrer'' ohne Artikel; im Englischen steht vor dem Beruf *a* oder *an*.'
  en.a1.unit23.lesson02.teach.where_do_you_work:
    title: Where do you work?
    gloss: Wo arbeiten Sie?
    note: Mit *Where do you work?* fragen Sie nach dem Arbeitsplatz.
  en.a1.unit23.lesson03.teach.patients:
    title: patients
    gloss: Patienten
    note: '*patients* bedeutet Patienten (Mehrzahl). Das Wort wird *PAY-shents* gesprochen.'
    example_gloss: Ich helfe jeden Tag Patienten.
  en.a1.unit23.lesson03.teach.profile_text:
    title: Text über ein Berufsprofil
    gloss: Ich bin Krankenpfleger/Krankenschwester. Ich arbeite in einem Krankenhaus. Ich helfe Patienten und schreibe jeden Tag Berichte.
    note: In diesem kurzen Profil erzählt jemand von seinem Beruf und seiner täglichen Arbeit.
  en.a1.unit23.lesson04.teach.interesting_work:
    title: It's interesting work.
    gloss: Es ist eine interessante Arbeit.
    note: '*interesting* bedeutet interessant.'
  en.a1.unit23.lesson04.teach.q_what_do_you_do_daniel:
    title: Daniel nach dem Beruf fragen
    gloss: 'Leila fragt: Daniel, was machst du beruflich?'
    note: Dieselbe Frage wie in der zweiten Lektion, diesmal mit Namen.
  en.a1.unit23.lesson04.teach.a_engineer_small_company:
    title: Daniels Antwort
    gloss: 'Daniel sagt: Ich bin Ingenieur. Ich arbeite bei einer kleinen Firma in der Innenstadt.'
    note: Daniel nennt seinen Beruf und sagt, wo er arbeitet.
  en.a1.unit23.lesson04.teach.q_what_every_day:
    title: Nach den täglichen Aufgaben fragen
    gloss: 'Leila fragt: Was machst du jeden Tag?'
    note: Diese Frage geht um die täglichen Aufgaben.
  en.a1.unit23.lesson04.teach.a_reports_emails_clients:
    title: Daniels Antwort
    gloss: 'Daniel sagt: Ich schreibe Berichte und beantworte E-Mails. Manchmal treffe ich Kunden.'
    note: Daniel nennt ein paar Dinge, die er jeden Tag tut.
  en.a1.unit23.lesson04.teach.q_like_your_job:
    title: Fragen, ob Daniel sein Job gefällt
    gloss: 'Leila fragt: Gefällt dir dein Job?'
    note: Mit *Do you like your job?* fragen Sie, ob jemandem seine Arbeit gefällt.
  en.a1.unit23.lesson04.teach.a_yes_interesting:
    title: Daniels Antwort
    gloss: 'Daniel sagt: Ja, sehr. Es ist eine interessante Arbeit.'
    note: Daniel sagt ja und nennt auch den Grund.
