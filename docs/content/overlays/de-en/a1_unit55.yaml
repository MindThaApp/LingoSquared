    title: swim cap
    gloss: Badekappe
    note: '*swim cap* bedeutet Badekappe.'
    example_gloss: Bitte tragen Sie im Becken eine Badekappe.
  en.a1.unit55.lesson01.teach.rules:
    title: rules
    gloss: Regeln
    note: '*rules* bedeutet Regeln.'
    example_gloss: Lies die Schwimmbadregeln, bevor du schwimmen gehst.
  en.a1.unit55.lesson01.teach.lifeguard:
    title: lifeguard
    gloss: Bademeister / Rettungsschwimmer
    note: '*lifeguard* bedeutet Bademeister oder Rettungsschwimmer – die Person, die auf die Schwimmer aufpasst.'
    example_gloss: Der Bademeister beaufsichtigt das Schwimmbad jeden Tag.
  en.a1.unit55.lesson02.teach.id_like_to_buy_a_ticket:
    title: I'd like to buy a ticket, please.
    gloss: Ich möchte bitte eine Eintrittskarte kaufen.
    note: '*I''d like to* (Kurzform von *I would like to*) ist die höfliche Art, um etwas zu bitten.'
  en.a1.unit55.lesson02.teach.where_are_the_lockers:
    title: Where are the lockers?
    gloss: Wo sind die Schließfächer?
    note: '*Where are...?* hat die für englische Fragen typische umgekehrte Reihenfolge (Verb vor dem Subjekt).'
  en.a1.unit55.lesson02.teach.what_time_do_you_open:
    title: What time do you open?
    gloss: Wann öffnen Sie?
    note: '*do you open* verwendet für die Frageform das Hilfsverb *do*.'
  en.a1.unit55.lesson02.teach.its_five_dollars_for_one_ticket:
    title: It's five dollars for one ticket.
    gloss: Eine Eintrittskarte kostet fünf Dollar.
    note: '*for one ticket* bedeutet pro Eintrittskarte.'
  en.a1.unit55.lesson02.teach.do_i_need_a_swim_cap:
    title: Do I need a swim cap?
    gloss: Brauche ich eine Badekappe?
    note: '*Do I need...?* verwendet für die Frageform das Hilfsverb *do*.'
  en.a1.unit55.lesson02.teach.we_close_at_eight:
    title: We close at eight o'clock.
    gloss: Wir schließen um acht Uhr.
    note: '*at eight o''clock* – im Englischen steht *at* vor einer genauen Uhrzeit, so wie im Deutschen um.'
  en.a1.unit55.lesson03.teach.dialogue_line1:
    title: Der Bademeister begrüßt sie
    gloss: 'Der Bademeister sagt: Hallo! Seid ihr heute zum Schwimmen hier?'
    note: '*Are you here to swim today?* verwendet *to swim*, um einen Zweck auszudrücken – ähnlich wie im Deutschen zum Schwimmen oder um zu schwimmen.'
  en.a1.unit55.lesson03.teach.dialogue_line2:
    title: Daniels Eintrittskarten
    gloss: 'Daniel sagt: Ja, zwei Eintrittskarten, bitte.'
    note: Eine kurze, direkte Bitte um zwei Eintrittskarten.
  en.a1.unit55.lesson03.teach.dialogue_line3:
    title: Der Preis
    gloss: 'Der Bademeister sagt: Klar! Eine Eintrittskarte kostet fünf Dollar.'
    note: 'Eine einzelne Information: der Preis pro Eintrittskarte.'
  en.a1.unit55.lesson03.teach.dialogue_line4:
    title: Mia fragt nach der Badekappe
    gloss: 'Mia sagt: Brauchen wir eine Badekappe?'
    note: '*Do we need...?* – wieder das Hilfsverb *do* für die Frageform.'
  en.a1.unit55.lesson03.teach.dialogue_line5:
    title: Die Badekappenregel
    gloss: 'Der Bademeister sagt: Ja, im Becken ist eine Badekappe Pflicht.'
    note: '*swim caps are required* ist eine Passivform – eine formelle Art, eine Regel zu nennen, oft auf Schildern im Schwimmbad und beim Personal zu hören. Im Deutschen sagt man das ähnlich mit Pflicht (Badekappen sind Pflicht), mit einem Passiv (Badekappen müssen getragen werden) oder mit einem Modalverb (Sie müssen eine Badekappe tragen).'
  en.a1.unit55.lesson03.teach.dialogue_line6:
    title: Daniel fragt nach den Schließfächern
    gloss: 'Daniel sagt: Wo sind die Schließfächer?'
    note: Eine kurze Frage, keine neue Information zu Preis oder Zeit.
  en.a1.unit55.lesson03.teach.dialogue_line7:
    title: Der Ort der Schließfächer
    gloss: 'Der Bademeister sagt: Die Schließfächer sind beim Eingang.'
    note: 'Eine einzelne Information: wo die Schließfächer sind – etwas anderes als das, was die Schließfächer benötigen.'
  en.a1.unit55.lesson03.teach.dialogue_line8:
    title: Was die Schließfächer brauchen
    gloss: 'Der Bademeister sagt: Sie brauchen eine Dollarmünze.'
    note: '*a dollar coin* besteht aus zwei englischen Wörtern (*dollar* + *coin*), die getrennt geschrieben werden. Im Deutschen ist es ein zusammengesetztes Wort: Dollarmünze.'
  en.a1.unit55.lesson03.teach.dialogue_line9:
    title: Mia fragt nach der Schließzeit
    gloss: 'Mia sagt: Wann schließt ihr?'
    note: '*What time do you close?* verwendet für die Frageform das Hilfsverb *do*.'
  en.a1.unit55.lesson03.teach.dialogue_line10:
    title: Die Schließzeit
    gloss: 'Der Bademeister sagt: Wir schließen um acht Uhr.'
    note: 'Eine vierte, eigene Information: die Schließzeit.'
  en.a1.unit55.lesson04.teach.reading_passage:
    title: 'Text: Ein Tag im Schwimmbad'
    gloss: 'An einem heißen Julinachmittag beschlossen Daniel und Mia, sich im Freibad der Gemeinde abzukühlen. Am Eingang hing ein Schild mit den Schwimmbadregeln: nicht rennen, und im Becken ist eine Badekappe Pflicht. Sie baten den Bademeister um zwei Eintrittskarten. Eine Karte kostete fünf Dollar. Der Bademeister erklärte, die Schließfächer seien beim Eingang und brauchten eine Dollarmünze. Daniel und Mia packten ihre Taschen in ein Schließfach und schwammen fast zwei Stunden. Bevor sie gingen, schauten sie noch einmal auf das Schild: Das Schwimmbad schließt um acht Uhr. Mia sagte, sie wolle nächstes Wochenende wiederkommen und das Sprungbrett ausprobieren.'
    note: '*required* ist eine Passivform – *swim caps are required* bedeutet Badekappen sind Pflicht.'
