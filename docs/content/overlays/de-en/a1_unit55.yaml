teaching:
  en.a1.unit55.lesson01.teach.swimming_pool:
    title: swimming pool
    gloss: Schwimmbad
    note: '*swimming pool* bedeutet Schwimmbad.'
    example_gloss: Das Schwimmbad öffnet jeden Morgen.
  en.a1.unit55.lesson01.teach.ticket:
    title: ticket
    gloss: Eintrittskarte
    note: '*ticket* bedeutet Eintrittskarte.'
    example_gloss: Du brauchst eine Eintrittskarte, um ins Schwimmbad zu kommen.
  en.a1.unit55.lesson01.teach.locker:
    title: locker
    gloss: Schließfach
    note: '*locker* bedeutet Schließfach.'
    example_gloss: Pack deine Tasche in ein Schließfach.
