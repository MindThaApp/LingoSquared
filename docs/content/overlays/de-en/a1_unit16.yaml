teaching:
  en.a1.unit16.lesson01.teach.wake_up:
    title: Wake up
    gloss: aufwachen
    note: '*wake up* bedeutet aufwachen. Es besteht aus Verb und Partikel und wird getrennt geschrieben, wie ''aufwachen'' im Deutschen.'
  en.a1.unit16.lesson01.teach.get_dressed:
    title: Get dressed
    gloss: sich anziehen
    note: '*get dressed* bedeutet sich anziehen. Ein *sich* wie im Deutschen gibt es hier nicht: Man sagt nicht *get yourself dressed*.'
  en.a1.unit16.lesson01.teach.go_to_work:
    title: Go to work
    gloss: zur Arbeit gehen
    note: '*go to work* bedeutet zur Arbeit gehen. Vor *work* steht in dieser festen Wendung kein Artikel.'
  en.a1.unit16.lesson01.teach.have_dinner:
    title: Have dinner
    gloss: zu Abend essen
    note: '*have dinner* bedeutet zu Abend essen. Mahlzeiten stehen ohne Artikel: *have breakfast*, *have lunch*, *have dinner*.'
  en.a1.unit16.lesson01.teach.go_to_bed:
    title: Go to bed
    gloss: ins Bett gehen
    note: '*go to bed* bedeutet ins Bett gehen, um zu schlafen. Auch hier steht kein Artikel vor *bed*.'
  en.a1.unit16.lesson02.teach.what_time_wake_up:
    title: What time do you wake up?
    gloss: Um wie viel Uhr wachst du auf?
    note: 'Mit *What time do you wake up?* fragen Sie nach der Aufstehzeit. Die Frage mit *do* braucht das Hilfsverb: nicht *What time wake you up*.'
  en.a1.unit16.lesson02.teach.i_wake_up_at:
    title: I wake up at seven every day.
    gloss: Ich wache jeden Tag um sieben Uhr auf.
    note: '*every day* verwendet man für eine tägliche Gewohnheit. Es steht am Satzende oder am Satzanfang.'
  en.a1.unit16.lesson02.teach.in_the_morning:
    title: I get dressed in the morning.
    gloss: Ich ziehe mich morgens an.
    note: '*in the morning* nennt einen Tagesabschnitt, keine genaue Uhrzeit. Das deutsche ''morgens'' wird mit *in the morning* ausgedrückt.'
  en.a1.unit16.lesson02.teach.usually_at_night:
    title: I usually go to bed at eleven.
    gloss: Ich gehe normalerweise um elf Uhr ins Bett.
    note: '*usually* bedeutet normalerweise; es beschreibt eine Gewohnheit, die nicht immer exakt gleich ist. Achtung bei der Wortstellung: *usually* steht im Englischen vor dem Vollverb (*I usually go*). Anders als im Deutschen (''Ich gehe normalerweise ...'', ''Normalerweise gehe ich ...'') kann es nicht frei wandern; *I go usually to bed* ist falsch.'
  en.a1.unit16.lesson03.teach.then:
    title: Then
    gloss: dann/danach
    note: '*then* bedeutet dann oder danach; es zeigt die Reihenfolge von Ereignissen.'
    example_gloss: Ich frühstücke und gehe dann zur Arbeit.
  en.a1.unit16.lesson03.teach.routine_text:
    title: Text über einen Tagesablauf
    gloss: Jeden Tag wache ich um sieben Uhr auf. Dann ziehe ich mich an und frühstücke.
    note: Dies ist eine kurze Beschreibung eines Morgenablaufs.
  en.a1.unit16.lesson04.teach.after_that:
    title: What do you do after that?
    gloss: Was machst du danach?
    note: Mit *What do you do after that?* fragen Sie nach dem Fortgang eines Tagesablaufs.
  en.a1.unit16.lesson04.teach.q_wake_time:
    title: Nach der Aufwachzeit fragen
    gloss: 'Leila fragt: Um wie viel Uhr wachst du auf?'
    note: Dieselbe Frage wie zuvor.
  en.a1.unit16.lesson04.teach.a_wake_seven:
    title: Antwort zum Aufwachen
    gloss: 'Daniel sagt: Ich wache jeden Tag um sieben Uhr auf.'
    note: Eine vollständige Antwort nennt sowohl die Uhrzeit als auch die tägliche Wiederholung.
  en.a1.unit16.lesson04.teach.q_after_that:
    title: Nach dem Fortgang fragen
    gloss: 'Leila fragt: Was machst du danach?'
    note: Diese Frage ist eine natürliche Fortsetzung des Gesprächs über den Tagesablauf.
  en.a1.unit16.lesson04.teach.a_full_routine:
    title: Den ganzen Tagesablauf beschreiben
    gloss: 'Daniel sagt: Ich ziehe mich an, frühstücke und gehe zur Arbeit. Ich gehe normalerweise um elf Uhr ins Bett.'
    note: Daniel nennt mehrere Tätigkeiten nacheinander, in der richtigen Reihenfolge.
