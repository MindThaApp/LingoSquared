  ro.a1.unit30.timp_liber:
    title: Aficiones y tiempo libre
lessons:
  ro.a1.unit30.lesson01.cititul_sportul_si_gatitul:
    title: Leer, hacer deporte y cocinar
  ro.a1.unit30.lesson02.muzica_desen_si_jocuri:
    title: Música, dibujo y videojuegos
  ro.a1.unit30.lesson03.ce_faci_in_timpul:
    title: ¿Qué haces en tu tiempo libre?
  ro.a1.unit30.lesson04.ana_si_mihai_vorbesc:
    title: Ana y Mihai hablan de sus pasatiempos
  ro.a1.unit30.lesson05.mihai_si_ana_isi:
    title: Mihai y Ana comparan sus pasatiempos
  ro.a1.unit30.lesson06.planuim_impreuna_un_weekend:
    title: Planear un fin de semana juntos
teaching:
  ro.a1.unit30.lesson01.teach.a_citi_a:
    title: Leer, hacer deporte, cocinar
    gloss: leer, hacer deporte, cocinar
    note: 'Tres verbos de pasatiempos habituales: *a citi* (leer), *a face sport* (hacer deporte) y *a găti* (cocinar). Las formas de diccionario del rumano empiezan por *a*.'
    example_gloss:
    - Me gusta leer un libro.
    - Hago deporte los sábados.
    - Me gusta cocinar para mis amigos.
  ro.a1.unit30.lesson01.teach.timpul_liber:
    title: El tiempo libre
    gloss: tiempo libre
    note: '*Timpul liber* (tiempo libre) se forma con el sustantivo masculino *timp* con el artículo añadido al final. Es la expresión clave para hablar de pasatiempos.'
    example_gloss: En mi tiempo libre me gusta leer.
  ro.a1.unit30.lesson01.teach.in_timpul_liber:
    title: Decir qué haces en tu tiempo libre
    gloss: En mi tiempo libre me gusta leer.
    note: '*Citesc* es la forma de *eu* de *a citi* (leer); después de *îmi place să* el verbo mantiene la misma forma.'
  ro.a1.unit30.lesson02.teach.a_asculta_muzica:
    title: Música, dibujo y videojuegos
    gloss: escuchar música, dibujar, jugar a videojuegos
    note: 'Tres expresiones más de pasatiempos: *a asculta muzică* (escuchar música), *a desena* (dibujar) y *a juca jocuri video* (jugar a videojuegos).'
    example_gloss:
    - Me gusta escuchar música.
    - Dibujo a menudo.
    - Me gusta jugar a videojuegos con amigos.
  ro.a1.unit30.lesson02.teach.imi_place_sa:
    title: Decir que te gusta escuchar música
    gloss: Me gusta escuchar música.
    note: '*Îmi place să ascult muzică*: *îmi place* («me gusta») + *să* + un verbo es la forma habitual de decir que te gusta hacer algo.'
  ro.a1.unit30.lesson02.teach.imi_place_sa_2:
    title: Decir que te gusta jugar a videojuegos con amigos
    gloss: Me gusta jugar a videojuegos con amigos.
    note: '*Cu prietenii* significa «con los amigos»: *cu* («con») es la preposición y *prietenii* es el plural determinado.'
  ro.a1.unit30.lesson03.teach.mereu_des_uneori:
    title: Siempre, a menudo, a veces, nunca
    gloss: siempre, a menudo, a veces, nunca
    note: 'Los cuatro adverbios básicos de frecuencia: *mereu*, *des*, *uneori* y *niciodată*. Suelen ir después del verbo: *Citesc des*.'
    example_gloss:
    - Siempre hago deporte los sábados.
    - A menudo leo un libro.
    - A veces dibujo.
    - Nunca juego a videojuegos.
  ro.a1.unit30.lesson03.teach.in_fiecare_saptamana:
    title: Cada semana, cada fin de semana
    gloss: cada semana, cada fin de semana
    note: '*În fiecare săptămână* y *în fiecare weekend* significan ambas «cada»; *fiecare* nunca cambia, mira la tarjeta siguiente.'
    example_gloss:
    - Cocino para mis amigos cada semana.
    - Hago deporte cada fin de semana.
  ro.a1.unit30.lesson03.teach.cuvantul_fiecare_nu:
    title: Fiecare nunca cambia
    gloss: 'La palabra fiecare no cambia: în fiecare săptămână (cada semana), în fiecare weekend (cada fin de semana).'
    note: '*Fiecare* se mantiene igual delante de *săptămână* y de *weekend*, sea cual sea el sustantivo, así que no hay nada que elegir.'
  ro.a1.unit30.lesson03.teach.ce_faci_in:
    title: Preguntar por el tiempo libre
    gloss: ¿Qué haces en tu tiempo libre?
    note: 'Esta es la pregunta central de la unidad: úsala para preguntar a cualquiera por sus aficiones.'
  ro.a1.unit30.lesson04.teach.ana_ne_plimbam:
    title: Ana saca el tema de los pasatiempos
    gloss: 'Ana: A menudo paseamos juntos. Pero ¿qué más haces tú en tu tiempo libre, Mihai?'
    note: '*Ne plimbăm* («damos un paseo») es la forma de *noi* del verbo reflexivo *a se plimba*; se refiere a los paseos que disfrutan los dos amigos.'
  ro.a1.unit30.lesson04.teach.mihai_imi_place:
    title: Los pasatiempos de Mihai
    gloss: 'Mihai: Me gusta cocinar, también en casa. Y hago deporte a menudo.'
    note: '*Și acasă* (también en casa) aclara que Mihai cocina por gusto, no solo en su trabajo en el restaurante.'
  ro.a1.unit30.lesson04.teach.ana_gatesti_si:
    title: Ana se sorprende
    gloss: 'Ana: ¿Cocinas también en casa? ¡Si ya cocinas todo el día en el trabajo!'
    note: '*Toată ziua* (todo el día) subraya cuánto cocina ya Mihai en el trabajo; *deja* significa «ya».'
  ro.a1.unit30.lesson04.teach.mihai_da_dar:
    title: Mihai se explica
    gloss: 'Mihai: Sí, pero cocinar me parece relajante. Y tú, ¿qué te gusta hacer?'
    note: '*Gătitul mi se pare relaxant* significa literalmente «cocinar me parece relajante»: *mi se pare* es una forma habitual de dar una opinión.'
  ro.a1.unit30.lesson04.teach.ana_imi_place:
    title: Los pasatiempos de Ana
    gloss: 'Ana: Me gusta leer y escucho música a menudo.'
    note: Combina dos verbos de pasatiempos de las lecciones 1 y 2 en una sola frase con *și* (y).
  ro.a1.unit30.lesson04.teach.mihai_joci_si:
    title: Mihai pregunta por los videojuegos
    gloss: 'Mihai: ¿Tú también juegas a videojuegos?'
    note: Una pregunta corta de sí/no con *jocuri video* de la lección 2; *joci* es la forma de *tu* de *a juca*.
  ro.a1.unit30.lesson04.teach.ana_nu_nu:
    title: Ana responde
    gloss: 'Ana: No, nunca juego a videojuegos. ¡Pero a veces dibujo!'
    note: '*Niciodată* (nunca) y *uneori* (a veces) de la lección 3, contrastados en una misma respuesta; *nu ... niciodată* lleva doble negación, como «no ... nunca» en español.'
  ro.a1.unit30.lesson05.teach.mihai_si_cu:
    title: Comparar aficiones
    gloss: Mihai y yo paseamos a menudo juntos. Pero también tenemos otras aficiones. A Mihai le gusta cocinar, también en casa, y hace deporte a menudo. A mí me gusta leer y escucho música a menudo. A veces dibujo, pero nunca juego a videojuegos. ¿Qué te gusta hacer a ti en tu tiempo libre?
    note: El mensaje de Ana resume lo visto en la lección 4 y termina haciendo al lector la pregunta central de la unidad.
    glosses:
      plimbăm: pasea
      des: a menudo
      împreună: juntos
      alte: otros
      gătească: cocina
      place: le gusta
      acasă: en casa
      sport: hace deporte
      citesc: leer
      ascult: escucho
      muzică: música
      desenez: dibujo
      uneori: a veces
      joc: juego a videojuegos
      niciodată: nunca
      liber: libre
      timpul: tiempo
  ro.a1.unit30.lesson06.teach.mihai_ce_faci:
    title: Mihai pregunta por el fin de semana
    gloss: 'Mihai: ¿Qué haces este fin de semana?'
    note: '*În acest weekend* (este fin de semana) usa *acest* para «este».'
  ro.a1.unit30.lesson06.teach.ana_inca_nu:
    title: Ana está indecisa
    gloss: 'Ana: Todavía no lo sé. Me gusta leer, pero también quiero salir a la calle.'
    note: '*Să ies afară* (salir fuera) es una forma habitual de decir que quieres salir de casa; *vreau să* + un verbo significa «quiero ...».'
  ro.a1.unit30.lesson06.teach.mihai_hai_sa:
    title: Mihai propone un plan
    gloss: 'Mihai: ¿Paseamos juntos? Después cocino yo para nosotros.'
    note: '*După aceea* (después) es una expresión para ordenar acciones; *Hai să* + un verbo propone hacer algo juntos.'
  ro.a1.unit30.lesson06.teach.ana_buna_idee:
    title: Ana acepta
    gloss: 'Ana: ¡Buena idea! Me gusta tanto pasear como cocinar.'
    note: '*Și ..., și ...* («tanto ... como ...») muestra que a Ana le gustan las dos cosas por igual, no una más que la otra.'
  ro.a1.unit30.lesson06.teach.mihai_perfect_atunci:
    title: Mihai confirma
    gloss: 'Mihai: Perfecto. ¡Entonces nos vemos el sábado!'
    note: Una frase amistosa de cierre que confirma el plan para *sâmbătă* (el sábado); *ne vedem* significa «nos vemos».
