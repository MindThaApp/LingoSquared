teaching:
  ro.a1.unit13.lesson01.teach.reminder_cafea_ceai_paine:
    title: 'Repaso: cafea, ceai, pâine'
    gloss: cafea (café) · ceai (té) · pâine (pan)
    note: Ya las viste en la unidad 6; aquí se combinan con la gramática nueva de esta unidad para expresar gustos y disgustos.
  ro.a1.unit13.lesson01.teach.imi_place_vocab:
    title: Me gusta
    gloss: Îmi place (me gusta)
    note: 'Literalmente, «a mí me agrada»: *îmi* (a mí) más *place* (agrada), que no cambia. Para hablar de lo que te gusta en general, el rumano usa la forma definida del sustantivo (*cafeaua*, no la forma simple *cafea* que ya conoces de la unidad 6), igual que el español, que dice «me gusta el café».'
    example_gloss:
    - Me gusta el café.
  ro.a1.unit13.lesson01.teach.imi_place_cafeaua_phrase:
    title: Me gusta el café
    gloss: Îmi place cafeaua. (Me gusta el café.)
    note: 'La estructura completa: Îmi place + el sustantivo en forma definida.'
  ro.a1.unit13.lesson01.teach.imi_place_ceaiul_phrase:
    title: Me gusta el té
    gloss: Îmi place ceaiul. (Me gusta el té.)
    note: 'La misma estructura que *Îmi place cafeaua*, con otra bebida: *ceaiul* es la forma definida de *ceai*, que ya conoces de la unidad 6.'
  ro.a1.unit13.lesson01.teach.numi_place_vocab:
    title: No me gusta
    gloss: Nu-mi place (no me gusta)
    note: La negación de *Îmi place*. En el habla cotidiana el rumano contrae *nu îmi* en *nu-mi*, así que esta forma con guion es la manera natural de decirlo, no un simple atajo.
    example_gloss:
    - No me gusta el pan.
  ro.a1.unit13.lesson01.teach.numi_place_painea_phrase:
    title: No me gusta el pan
    gloss: Nu-mi place pâinea. (No me gusta el pan.)
    note: '*Pâinea* es la forma definida de *pâine*, que ya conoces de la unidad 6, con el mismo patrón que *cafeaua* y *ceaiul*.'
  ro.a1.unit13.lesson02.teach.reminder_imi_place_numi_place:
    title: 'Repaso: Îmi place, Nu-mi place'
    gloss: Îmi place (me gusta) · Nu-mi place (no me gusta)
    note: Las dos son de la primera lección de esta unidad; aquí se añade una forma interrogativa que las acompaña.
  ro.a1.unit13.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Repaso: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (el café) · ceaiul (el té) · pâinea (el pan)
    note: Todas son de la primera lección de esta unidad; aquí se reutilizan en las formas de pregunta y de preferencia.
  ro.a1.unit13.lesson02.teach.va_place_vocab:
    title: ¿Le gusta...?
    gloss: Vă place...? (¿Le gusta...?)
    note: 'La forma interrogativa formal de *Îmi place*: *vă* (a usted) sustituye a *îmi* (a mí), con el mismo registro de cortesía *dumneavoastră* que ya viste en *aveți* y *faceți*. Añade después un sustantivo en forma definida, o úsala sola cuando el tema ya esté claro.'
    example_gloss:
    - ¿Le gusta el café?
  ro.a1.unit13.lesson02.teach.va_place_cafeaua_phrase:
    title: ¿Le gusta el café?
    gloss: Vă place cafeaua? (¿Le gusta el café?)
    note: 'La estructura completa: Vă place + el sustantivo en forma definida, con entonación ascendente de pregunta.'
  ro.a1.unit13.lesson02.teach.prefer_vocab:
    title: prefiero
    gloss: Prefer (prefiero)
    note: 'Es un cognado transparente: no necesita la construcción «a mí me», y *prefer* funciona como un verbo normal, igual que en español. *Prefer* + lo que se prefiere, en forma definida, como con *Îmi place*.'
    example_gloss:
    - Prefiero el café.
  ro.a1.unit13.lesson02.teach.prefer_cafeaua_phrase:
    title: Prefiero el café
    gloss: Prefer cafeaua. (Prefiero el café.)
    note: Es una afirmación más fuerte que *Îmi place cafeaua*; resulta útil al elegir entre dos cosas.
  ro.a1.unit13.lesson02.teach.sau_vocab:
    title: o
    gloss: Sau (o)
    note: Une dos opciones al ofrecer o preguntar por una elección. No es lo mismo que *și* (y) de las unidades 10 y 12, que une dos cosas que son ciertas a la vez.
    example_gloss:
    - ¿Café o té?
  ro.a1.unit13.lesson02.teach.cafea_sau_ceai_phrase:
    title: ¿Café o té?
    gloss: Cafea sau ceai? (¿Café o té?)
    note: Una forma breve y natural de ofrecer una opción. Aquí se usan las formas simples (*cafea*, *ceai*), no las definidas *cafeaua* y *ceaiul*, porque es una oferta abierta y no una afirmación sobre el café o el té en general.
  ro.a1.unit13.lesson03.teach.reminder_va_place_prefer_sau:
    title: 'Repaso: Vă place, Prefer, Sau'
    gloss: Vă place? (¿Le gusta?) · Prefer (prefiero) · Sau (o)
    note: Todas son de la segunda lección de esta unidad; aquí Ana y Mihai las usan juntas.
  ro.a1.unit13.lesson03.teach.reminder_imi_place_numi_place_cafeaua_ceaiul_painea:
    title: 'Repaso: Îmi place, Nu-mi place, cafeaua, ceaiul, pâinea'
    gloss: Îmi place (me gusta) · Nu-mi place (no me gusta) · cafeaua (el café) · ceaiul (el té) · pâinea (el pan)
    note: Todas son de la primera lección de esta unidad; aquí Ana y Mihai dicen qué les gusta y qué no.
  ro.a1.unit13.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Repaso: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (hola) · mulțumesc (gracias) · la revedere (adiós) · Ana, Mihai (nombres)
    note: 'Todas ya aparecieron en unidades anteriores: es el mismo patrón amable de saludo y despedida que han usado todos los diálogos del curso.'
  ro.a1.unit13.lesson03.teach.line01:
    title: Saludar y preguntar por café o té
    gloss: Mihai saluda a Ana y le pregunta si le gusta el café o el té.
    note: Combina el *Vă place...?* de esta unidad con *sau* para ofrecer las dos opciones en una sola pregunta.
  ro.a1.unit13.lesson03.teach.line02:
    title: Expresar una preferencia y un disgusto
    gloss: Ana dice que prefiere el café y que no le gusta el té.
    note: 'Combina *Prefer* con *Nu-mi place*: su preferencia por el café coincide con su pedido habitual de las unidades 6 y 12.'
  ro.a1.unit13.lesson03.teach.line03:
    title: Expresar la preferencia contraria
    gloss: Mihai dice que le gusta el té y que no le gusta el café.
    note: Coincide con el pedido habitual de Mihai en las unidades 6 y 12 (ceai, nunca cafea).
  ro.a1.unit13.lesson03.teach.line04:
    title: Preguntar también por el pan
    gloss: Ana pregunta si a Mihai también le gusta el pan.
    note: Empieza con la pregunta breve *Și pâinea?* (¿Y el pan?) y luego pregunta completa con *Vă place...?* sobre un tema nuevo, *pâinea*.
  ro.a1.unit13.lesson03.teach.line05:
    title: Confirmar, agradecer y despedirse
    gloss: Mihai dice que sí, que le gusta el pan, da las gracias a Ana y se despide.
    note: Coincide con lo que pide Mihai desde la unidad 6 (pâine) y con el mismo cierre con el que terminan los diálogos de las unidades anteriores.
  ro.a1.unit13.lesson03.teach.line06:
    title: Cerrar la conversación
    gloss: Ana se despide también, usando el nombre de Mihai.
    note: El mismo cierre amable con el que han terminado los diálogos de las unidades anteriores.
