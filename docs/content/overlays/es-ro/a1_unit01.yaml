answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Rumano A1
  description: 'Aprende los saludos básicos del rumano y las presentaciones en un primer encuentro. La guía se centra en el contraste que más importa en esta etapa: el tu informal frente al dumneavoastră de cortesía, y las dos formas cotidianas de decir tu nombre (mă numesc.../mă cheamă...).'
units:
  ro.a1.unit01.greetings:
    title: Saludos y primeros encuentros
lessons:
  ro.a1.unit01.lesson01.tu_dumneavoastra_greetings:
    title: 'Saludos: tu y dumneavoastră'
  ro.a1.unit01.lesson02.names_introductions:
    title: ¿Cómo te llamas?
  ro.a1.unit01.lesson03.street_meeting:
    title: Un encuentro en la calle
teaching:
  ro.a1.unit01.lesson01.teach.buna:
    title: Saludo de todos los días
    gloss: hola
    note: Bună es el saludo cotidiano, algo informal, válido con amigos, compañeros y en la mayoría de los encuentros casuales durante el día.
    example_gloss: ¡Hola, Mihai!
  ro.a1.unit01.lesson01.teach.salut:
    title: Saludo informal
    gloss: hola; adiós
    note: Salut es informal y se usa entre amigos y personas de la misma edad. Sirve tanto para empezar como para terminar una conversación, pero no es la mejor opción con un adulto desconocido.
    example_gloss: ¡Hola, Ana!
  ro.a1.unit01.lesson01.teach.buna_ziua:
    title: Saludo formal
    gloss: buen día; hola (formal)
    note: Bună ziua es el saludo cortés y seguro para un adulto desconocido, un dependiente o cualquier persona a quien tratarías de dumneavoastră. Significa literalmente «buen día», pero se usa como saludo cortés general, no solo a mediodía.
    example_gloss: ¡Buen día, Ana!
  ro.a1.unit01.lesson01.teach.la_revedere:
    title: Despedida neutra
    gloss: adiós
    note: La revedere sirve tanto en situaciones formales como informales, igual que «adiós» en español.
    example_gloss: ¡Buen día! ¡Adiós!
  ro.a1.unit01.lesson01.teach.tu:
    title: Tú (singular informal)
    gloss: tú
    note: Como el tú del español, el tu rumano se dirige a un solo amigo, a un niño o a una persona con quien hay una relación explícitamente informal, y tiene sus propias formas verbales (faci, no faceți).
  ro.a1.unit01.lesson01.teach.dumneavoastra:
    title: Usted o ustedes / vosotros
    gloss: usted; ustedes
    note: Dumneavoastră es la opción segura para un adulto desconocido y también sirve para un grupo al que te diriges con cortesía; cumple una función parecida a la de usted en español. Viene de domnia voastră («vuestra señoría») y lleva las formas verbales del plural (faceți, numiți), incluso cuando se refiere a una sola persona; en cambio, usted usa la tercera persona del singular.
  ro.a1.unit01.lesson01.teach.ce_mai_faceti:
    title: Pregunta formal sobre cómo estás
    gloss: ¿Cómo está usted?
    note: Faceți es la forma de dumneavoastră del verbo a face (hacer). Es una pregunta cortés convencional, no una pregunta literal sobre lo que alguien está haciendo.
  ro.a1.unit01.lesson01.teach.ce_mai_faci:
    title: Pregunta informal sobre cómo estás
    gloss: ¿Cómo está usted?
    note: Faci es la forma de tu del verbo a face. Entre la versión cortés y la informal de esta pregunta solo cambia la terminación del verbo; ce mai se mantiene igual.
  ro.a1.unit01.lesson01.teach.bine_multumesc:
    title: Respuesta positiva habitual
    gloss: Bien, gracias.
    note: 'Bine, mulțumesc responde a ce mai faci/faceți sea cual sea el registro: la respuesta no cambia.'
    example_gloss: ¿Cómo estás? Bien, gracias.
  ro.a1.unit01.lesson01.teach.register_choice:
    title: Combinar saludo y relación
    gloss: Bună ziua con dumneavoastră; Salut con tu
    note: Son pautas útiles, no leyes absolutas. Bună ziua también puede abrir una conversación formal que luego continúe con dumneavoastră; combinar Salut con dumneavoastră suele enviar señales sociales contradictorias.
  ro.a1.unit01.lesson02.teach.ma_numesc:
    title: Di tu nombre (forma estándar)
    gloss: Me llamo Ana.
    note: 'Mă numesc significa literalmente «me nombro»: es la forma neutra, válida en cualquier situación, de decir tu nombre, con un registro similar al de «me llamo».'
    example_gloss: ¡Hola! Me llamo Ana.
  ro.a1.unit01.lesson02.teach.cum_va_numiti:
    title: Preguntar el nombre con cortesía
    gloss: ¿Cómo se llama usted?
    note: Numiți es la forma de dumneavoastră de a se numi (llamarse). Vă es el pronombre reflexivo que corresponde a dumneavoastră y es obligatorio aquí, igual que el se de «¿cómo se llama usted?».
  ro.a1.unit01.lesson02.teach.ma_cheama:
    title: Di tu nombre (forma conversacional)
    gloss: Me llamo Mihai.
    note: Mă cheamă es la forma más conversacional de decir el nombre; literalmente significa «me llama». Mă numesc y mă cheamă son correctas y frecuentes; mă cheamă es un poco más coloquial.
    example_gloss: ¡Hola! Me llamo Mihai.
  ro.a1.unit01.lesson02.teach.cum_te_cheama:
    title: Preguntar el nombre de manera informal
    gloss: ¿Cómo te llamas?
    note: Te es el pronombre reflexivo que corresponde a tu. Es la forma cotidiana en que amigos y compañeros se preguntan el nombre.
  ro.a1.unit01.lesson02.teach.imi_pare_bine:
    title: Conocer a alguien
    gloss: ¡Mucho gusto!
    note: 'Îmi pare bine significa literalmente «me parece bien»: es una expresión fija e idiomática. A diferencia de «encantado/encantada» en español, no cambia de forma según el género de quien habla.'
    example_gloss: Me llamo Mihai. ¡Mucho gusto!
  ro.a1.unit01.lesson02.teach.si_mie_imi_pare_bine:
    title: Devolver el gesto
    gloss: ¡Igualmente, mucho gusto!
    note: Și mie añade el sentido de «también» o «igualmente» al principio de la misma expresión fija con la que se abrió el intercambio.
  ro.a1.unit01.lesson02.teach.si_dumneavoastra:
    title: Devolver una pregunta con cortesía
    gloss: ¿Y usted?
    note: Usa dumneavoastră para mantener el registro cortés o para dirigirte a un grupo.
  ro.a1.unit01.lesson02.teach.si_tu:
    title: Devolver una pregunta de manera informal
    gloss: ¿Y usted?
    note: Usa tu después de și cuando hablas de manera informal con un amigo o un compañero.
  ro.a1.unit01.lesson03.teach.line01:
    title: Abrir el encuentro
    gloss: Ana saluda a Mihai con formalidad y dice su nombre.
    note: Ana empieza con el cortés bună ziua, apropiado para conocer a alguien que no conoce.
  ro.a1.unit01.lesson03.teach.line02:
    title: Abrir el encuentro, respuesta
    gloss: Mihai responde con la misma cortesía, dice su nombre y le pregunta cómo está.
    note: 'Mihai mantiene el mismo registro cortés con que empezó Ana: pregunta ce mai faceți, no ce mai faci.'
  ro.a1.unit01.lesson03.teach.line03:
    title: Responder y devolver la pregunta
    gloss: Ana dice que está bien y le hace la misma pregunta a Mihai, con cortesía.
    note: Și dumneavoastră mantiene la conversación en un registro formal, como empezó.
  ro.a1.unit01.lesson03.teach.line04:
    title: Responder y cerrar
    gloss: Mihai dice que él también está bien y se despide.
    note: La revedere es la despedida neutra, adecuada tanto si la conversación fue formal como informal.
  ro.a1.unit01.lesson03.teach.line05:
    title: Cerrar el encuentro
    gloss: Ana repite la misma despedida.
    note: Repetir la revedere es la manera natural de confirmar una despedida amistosa.
exercises:
  ro.a1.unit01.lesson01.exercise01.listen_buna:
    instruction: Escucha y elige la frase que oyes.
    correct_option: Bună!
    distractors:
    - Salut!
    - La revedere!
    accepted_answers:
    - Bună!
    - Bună
  ro.a1.unit01.lesson01.exercise02.choose_informal_pronoun:
    instruction: ¿Qué pronombre corresponde a este saludo informal?
    correct_option: tu
    distractors:
    - dumneavoastră
    accepted_answers:
    - tu
    feedback: Salut y tu forman una combinación informal coherente.
  ro.a1.unit01.lesson01.exercise04.order_polite_question:
    instruction: Ordena la pregunta formal sobre cómo está alguien.
    correct_response:
    - Ce
    - mai
    - faceți
  ro.a1.unit01.lesson01.exercise06.match_register:
    instruction: Relaciona cada saludo con su registro habitual de nivel principiante.
    correct_response:
      Bună ziua: dumneavoastră
      Salut: tu
    pairs:
    - left: Bună ziua
      right: dumneavoastră
    - left: Salut
      right: tu
  ro.a1.unit01.lesson01.exercise03.choose_polite_pronoun:
    instruction: Completa el saludo para un adulto desconocido.
    accepted_answers:
    - dumneavoastră
    feedback: Dumneavoastră es la opción segura y respetuosa con un adulto desconocido.
  ro.a1.unit01.lesson01.exercise05.listen_informal_question:
    instruction: Escribe la pregunta informal que oyes.
    accepted_answers:
    - Ce mai faci?
    - Ce mai faci
  ro.a1.unit01.lesson01.exercise07.complete_farewell:
    instruction: Completa la despedida neutra.
    accepted_answers:
    - revedere
  ro.a1.unit01.lesson01.exercise08.speak_greeting:
    instruction: Usa un saludo formal, pregunta cómo está la otra persona y cierra la conversación.
    accepted_answers:
    - Bună ziua. Ce mai faceți? La revedere.
    - Bună ziua, ce mai faceți? La revedere.
  ro.a1.unit01.lesson02.exercise02.listen_name_question:
    instruction: Escucha y selecciona la pregunta formal por el nombre.
    correct_option: Cum vă numiți?
    distractors:
    - Cum te cheamă?
    - Ce mai faceți?
    accepted_answers:
    - Cum vă numiți?
    - Cum va numiti?
  ro.a1.unit01.lesson02.exercise05.choose_reply_meaning:
    instruction: ¿Qué significa la respuesta de Mihai?
    correct_option: ¡Mucho gusto!
    distractors:
    - ¡Adiós!
    - ¿Cómo está usted?
    accepted_answers:
    - ¡Mucho gusto!
  ro.a1.unit01.lesson02.exercise01.order_self_intro:
    instruction: Forma la presentación de Ana.
    correct_response:
    - Mă
    - numesc
    - Ana
  ro.a1.unit01.lesson02.exercise07.match_introductions:
    instruction: Une cada pregunta sobre el nombre con su respuesta correspondiente.
    correct_response:
      Cum vă numiți?: Mă numesc Ana.
      Cum te cheamă?: Mă cheamă Mihai.
    pairs:
    - left: Cum vă numiți?
      right: Mă numesc Ana.
    - left: Cum te cheamă?
      right: Mă cheamă Mihai.
  ro.a1.unit01.lesson02.exercise03.informal_name_question:
    instruction: Tras el saludo informal, pregunta el nombre de la otra persona.
    accepted_answers:
    - Cum te cheamă?
    - Cum te cheama?
  ro.a1.unit01.lesson02.exercise04.complete_ma_cheama:
    instruction: Completa la frase con la que se dice el nombre de Mihai.
    accepted_answers:
    - Mă
  ro.a1.unit01.lesson02.exercise06.return_polite_question:
    instruction: Devuelve la pregunta sin cambiar del registro formal.
    accepted_answers:
    - Și dumneavoastră?
    - Si dumneavoastra?
  ro.a1.unit01.lesson02.exercise08.write_introduction:
    instruction: 'Eres Ana. Escribe: saluda con Bună, di tu nombre con mă numesc y luego di «Mucho gusto».'
    accepted_answers:
    - Bună. Mă numesc Ana. Îmi pare bine.
    - Buna. Ma numesc Ana. Imi pare bine.
  ro.a1.unit01.lesson03.exercise01.role_selection:
    instruction: En el diálogo, ¿qué hablante dice su nombre con esta frase?
    correct_option: Ana
    distractors:
    - Mihai
    - Ninguno de los dos
    accepted_answers:
    - Ana
  ro.a1.unit01.lesson03.exercise02.comprehend_register:
    instruction: ¿Qué pronombre usan Ana y Mihai entre ellos?
    correct_option: dumneavoastră
    distractors:
    - tu
    - te
    accepted_answers:
    - dumneavoastră
  ro.a1.unit01.lesson03.exercise03.comprehend_names:
    instruction: ¿Quién usa mă numesc y quién usa mă cheamă?
    correct_option: Ana uses mă numesc; Mihai uses mă cheamă.
    distractors:
    - Mihai uses mă numesc; Ana uses mă cheamă.
    - Los dos usan mă numesc.
    accepted_answers:
    - Ana uses mă numesc; Mihai uses mă cheamă.
    - Ana; Mihai
  ro.a1.unit01.lesson03.exercise05.order_closing:
    instruction: Forma la respuesta final y la despedida.
    correct_response:
    - Bine,
    - mulțumesc.
    - La
    - revedere!
  ro.a1.unit01.lesson03.exercise04.role_response:
    instruction: Haz el papel de Ana. Responde con cortesía y devuelve la pregunta.
    accepted_answers:
    - Bine, mulțumesc. Și dumneavoastră?
    - Bine, multumesc. Si dumneavoastra?
  ro.a1.unit01.lesson03.exercise06.speak_role:
    instruction: Haz el papel de Ana. Saluda a Mihai con formalidad, di tu nombre, responde a lo que él te dice y cierra el encuentro.
    accepted_answers:
    - Bună ziua. Mă numesc Ana. Îmi pare bine! La revedere!
    - Buna ziua. Ma numesc Ana. Imi pare bine! La revedere!
    - Bună ziua. Mă numesc Ana. Și mie îmi pare bine! La revedere!
  ro.a1.unit01.lesson01.exercise09.dictation_buna:
    instruction: Escribe lo que oyes.
    correct_option: Bună
    accepted_answers:
    - value: Bună
      status: correct
    orthography_strict: true
