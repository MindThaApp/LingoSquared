teaching:
  ro.a1.unit09.lesson01.teach.reminder_unde_este_locuri:
    title: 'Repaso: unde, este, gară, magazin, bancă, aproape'
    gloss: unde (dónde) · este (está) · gară (estación de tren) · magazin (tienda) · bancă (banco) · aproape (cerca)
    note: 'Todo ya visto: unde desde la Unidad 7, este desde las unidades 3 y 4, gară/magazin/bancă/aproape desde la Unidad 8. Aquí se combinan en las preguntas y los ejemplos para pedir direcciones de esta unidad.'
  ro.a1.unit09.lesson01.teach.cum_pot_sa_ajung:
    title: ¿Cómo puedo llegar a...?
    gloss: Cum pot să ajung...? (¿Cómo puedo llegar a...?)
    note: La forma habitual de preguntar cómo llegar a un lugar. *pot* (puedo) ya apareció en el *Unde pot să cumpăr...?* de la Unidad 7; *ajung* (llego) es nuevo.
  ro.a1.unit09.lesson01.teach.mergeti_vocab:
    title: Vaya
    gloss: 'Mergeți (vaya, vayan: orden formal)'
    note: '*Mergeți* es la forma de mandato de cortesía (dumneavoastră): la manera educada de decirle a alguien que vaya, igual que ya se tratan Ana y Mihai.'
    example_gloss:
    - Vaya todo recto.
  ro.a1.unit09.lesson01.teach.inainte_vocab:
    title: Todo recto
    gloss: înainte (todo recto)
    note: Se combina con *Mergeți* para dar la indicación más sencilla posible.
    example_gloss:
    - Vaya todo recto.
  ro.a1.unit09.lesson01.teach.mergeti_inainte_phrase:
    title: Ir todo recto
    gloss: Mergeți înainte. (Vaya todo recto.)
    note: 'Una indicación breve y completa: la respuesta más sencilla a *Cum pot să ajung...?*'
  ro.a1.unit09.lesson01.teach.cum_ajung_gara:
    title: ¿Cómo puedo llegar a la estación de tren?
    gloss: Cum pot să ajung la gară? (¿Cómo puedo llegar a la estación de tren?)
    note: 'Une *Cum pot să ajung...?* y *gară* en una pregunta completa: *la* (a) conecta la pregunta con el destino. Después de *la*, el lugar conserva su forma sin artículo: *la gară*, no *la gara*.'
  ro.a1.unit09.lesson01.teach.cum_ajung_banca:
    title: ¿Cómo puedo llegar al banco?
    gloss: Cum pot să ajung la bancă? (¿Cómo puedo llegar al banco?)
    note: 'El mismo patrón, ahora con el banco: una pregunta natural, ya que en la Unidad 8 vimos que el banco queda lejos.'
  ro.a1.unit09.lesson02.teach.dreapta_stanga_vocab:
    title: A la derecha, a la izquierda
    gloss: la dreapta (a la derecha) · la stânga (a la izquierda)
    note: 'Los dos giros básicos: aprende cada uno como pareja fija con *la* (a): *la dreapta*, *la stânga*.'
    example_gloss:
    - Vaya a la derecha.
    - Vaya a la izquierda.
  ro.a1.unit09.lesson02.teach.mergeti_dreapta_phrase:
    title: Ir a la derecha
    gloss: Mergeți la dreapta. (Vaya a la derecha.)
    note: El mismo mandato *Mergeți* que en *Mergeți înainte.*, ahora con un giro en lugar de seguir recto.
  ro.a1.unit09.lesson02.teach.mergeti_stanga_phrase:
    title: Ir a la izquierda
    gloss: Mergeți la stânga. (Vaya a la izquierda.)
    note: El giro opuesto, con el mismo patrón sencillo.
  ro.a1.unit09.lesson02.teach.aici_acolo_vocab:
    title: Aquí, allí
    gloss: aici (aquí) · acolo (allí)
    note: Una forma sencilla de señalar dónde está algo cuando ya has llegado o puedes verlo; es distinto de aproape/departe de la Unidad 8, que describen la distancia, no la posición.
    example_gloss:
    - La tienda está aquí.
    - La estación de tren está allí.
  ro.a1.unit09.lesson02.teach.magazinul_aici_phrase:
    title: La tienda está aquí
    gloss: Magazinul este aici. (La tienda está aquí.)
    note: 'Una frase corta y completa: *aici* señala algo que está justo donde tú estás.'
  ro.a1.unit09.lesson02.teach.gara_acolo_phrase:
    title: La estación de tren está allí
    gloss: Gara este acolo. (La estación de tren está allí.)
    note: '*Acolo* señala algo que se ve, pero que no está justo donde tú estás: es la forma natural de terminar unas indicaciones.'
  ro.a1.unit09.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Repaso: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (hola) · mulțumesc (gracias) · la revedere (adiós) · da (sí) · Ana, Mihai (nombres)
    note: Todo esto ya se vio en unidades anteriores. Aquí Ana le pide indicaciones a Mihai.
  ro.a1.unit09.lesson03.teach.apoi:
    title: Luego
    gloss: apoi (luego / después)
    note: 'Une dos pasos de un recorrido en una sola indicación: es la forma natural de dar más de un paso a la vez.'
    example_gloss:
    - Siga recto y luego gire a la derecha.
  ro.a1.unit09.lesson03.teach.line01:
    title: Saludar y preguntar cómo llegar a la estación de tren
    gloss: Ana saluda a Mihai y le pregunta cómo llegar a la estación de tren.
    note: Combina el *Cum pot să ajung* de esta unidad con el saludo de la Unidad 1.
  ro.a1.unit09.lesson03.teach.line02:
    title: Dar dos pasos de un recorrido
    gloss: Mihai le dice que siga recto y luego gire a la derecha.
    note: Reutiliza *Mergeți înainte* y *la dreapta* de esta unidad, unidos con *apoi*.
  ro.a1.unit09.lesson03.teach.line03:
    title: Preguntar si está cerca
    gloss: Ana pregunta si la estación de tren está cerca.
    note: Una breve pregunta de seguimiento que reutiliza *este* y *aproape* de la Unidad 8.
  ro.a1.unit09.lesson03.teach.line04:
    title: Confirmar y señalar el lugar
    gloss: Mihai confirma que está cerca y señala que la estación de tren está allí.
    note: Combina *aproape* y *acolo* (distancia y posición) en una sola frase.
  ro.a1.unit09.lesson03.teach.line05:
    title: Dar las gracias y despedirse
    gloss: Ana da las gracias a Mihai y se despide.
    note: Las mismas gracias de cierre que aparecieron en los diálogos de las Unidades 1 y 8.
  ro.a1.unit09.lesson03.teach.line06:
    title: Cerrar el encuentro
    gloss: Mihai se despide también, usando el nombre de Ana.
    note: La misma fórmula amistosa de cierre con la que terminaron los diálogos de las Unidades 1, 5, 6, 7 y 8.
