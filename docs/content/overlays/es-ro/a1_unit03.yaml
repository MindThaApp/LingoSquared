answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Day and month names are correctly lowercase in standard Romanian writing (except sentence-initially); accept a learner's answer regardless of the case they happen to type it in -- this unit teaches the lowercase convention as a fact to recognize, not a hard-graded spelling rule.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: Rumano A1
  description: Los días de la semana, los meses del año y cómo expresa el rumano la fecha (un número cardinal normal más el mes, salvo el día 1, que usa la palabra especial întâi), mientras seguimos a Ana y Mihai en la planificación de su próxima reunión.
units:
  ro.a1.unit03.dates:
    title: Días y fechas
lessons:
  ro.a1.unit03.lesson01.zilele_saptamanii:
    title: Días de la semana
  ro.a1.unit03.lesson02.lunile_si_datele:
    title: Los meses del año y cómo decimos la fecha
  ro.a1.unit03.lesson03.cand_ne_intalnim:
    title: ¿Cuándo nos vemos otra vez?
teaching:
  ro.a1.unit03.lesson01.teach.este:
    title: 'Recordatorio: este'
    gloss: es / está
    note: '*Este* ya apareció en la Unidad 2 (*Care este numărul...?*). Es invariable: es la misma palabra sea el sujeto un día, una fecha o cualquier otra cosa, y no cambia entre tú y dumneavoastră.'
  ro.a1.unit03.lesson01.teach.astazi_maine:
    title: Hoy, mañana
    gloss: astăzi (hoy) / mâine (mañana)
    note: Ambas son palabras de tiempo invariables que van al comienzo de la frase que indica qué día o fecha es.
    example_gloss:
    - Hoy es lunes.
    - Mañana es martes.
  ro.a1.unit03.lesson01.teach.luni_marti:
    title: Lunes, martes
    gloss: luni (lunes) / marți (martes)
    note: Para nombrar un día (Astăzi este luni), usa la forma simple que ves aquí. Los nombres de los días también tienen formas con artículo (lunea, marțea), que significan «los lunes», «los martes»; las verás más adelante.
    example_gloss:
    - Hoy es lunes.
    - Mañana es martes.
  ro.a1.unit03.lesson01.teach.miercuri_joi:
    title: Miércoles, jueves
    gloss: miercuri (miércoles) / joi (jueves)
    note: Como luni y marți, miercuri y joi tienen la misma forma en singular y en plural.
    example_gloss:
    - Hoy es miércoles.
    - Mañana es jueves.
  ro.a1.unit03.lesson01.teach.vineri_sambata:
    title: Viernes, sábado
    gloss: vineri (viernes) / sâmbătă (sábado)
    note: Sâmbătă conserva la â en medio de la palabra según la ortografía moderna, a diferencia de la antigua sîmbătă.
    example_gloss:
    - Hoy es viernes.
    - Mañana es sábado.
  ro.a1.unit03.lesson01.teach.duminica:
    title: Domingo
    gloss: Domingo
    note: Duminică completa la semana. Para decir qué día es, usa esta forma simple; la forma con artículo duminica significa «los domingos».
    example_gloss: Hoy es domingo.
  ro.a1.unit03.lesson01.teach.ce_zi_e_azi:
    title: Pregunta qué día es
    gloss: ¿Qué día es hoy?
    note: Es la forma habitual de preguntar qué día de la semana es. Zi (día) es la palabra nueva, junto a ce, este y astăzi, que ya conoces.
  ro.a1.unit03.lesson01.teach.saptamana_ieri:
    title: Semana, ayer, la semana pasada y la próxima
    gloss: săptămână (semana) / ieri (ayer) / săptămâna trecută (la semana pasada) / săptămâna viitoare (la semana próxima)
    note: 'Un vocabulario extra del mismo material que los nombres de los días: es útil para hablar de fechas en términos relativos, pero en los ejercicios de esta unidad no se practica tanto como los días de la semana.'
  ro.a1.unit03.lesson01.teach.lowercase_zile:
    title: Los días se escriben en minúscula
    gloss: 'Los días no se escriben con mayúscula inicial: luni, vineri.'
    note: 'Igual que en español, los nombres de los días de la semana no se escriben con mayúscula en medio de una frase: *luni*, no *Luni*, salvo cuando la palabra abre la oración.'
  ro.a1.unit03.lesson02.teach.ian_feb_mar:
    title: Enero, febrero, marzo
    gloss: enero / febrero / marzo
    note: A diferencia de los días de la semana, varios nombres de meses se parecen mucho a sus equivalentes en español.
    example_gloss:
    - Es enero.
    - Es febrero.
    - Es marzo.
  ro.a1.unit03.lesson02.teach.apr_mai_iun:
    title: Abril, mayo, junio
    gloss: abril / mayo / junio
    note: Mai (mayo) es corta, pero distinta del adverbio mai (más) que aparece en otras partes del curso (ce mai faci); el contexto siempre aclara cuál es.
    example_gloss:
    - Es abril.
    - Es mayo.
    - Es junio.
  ro.a1.unit03.lesson02.teach.iul_aug_sep:
    title: Julio, agosto, septiembre
    gloss: julio / agosto / septiembre
    note: 'August se parece mucho al español «agosto»: es uno de los cognados más transparentes de este grupo.'
    example_gloss:
    - Es julio.
    - Es agosto.
    - Es septiembre.
  ro.a1.unit03.lesson02.teach.oct_noi_dec:
    title: Octubre, noviembre, diciembre
    gloss: octubre / noviembre / diciembre
    note: Los tres últimos meses completan los doce; todos son sustantivos invariables.
    example_gloss:
    - Es octubre.
    - Es noviembre.
    - Es diciembre.
  ro.a1.unit03.lesson02.teach.intai:
    title: El primero (del mes)
    gloss: el primero
    note: 'Una regla propia del rumano: en el uso estándar, el primer día del mes no se dice *unu* (el número «uno» normal), sino con una palabra especial: *întâi*. (En el habla informal puede oírse *unu*, pero *întâi* es la forma que debes aprender.) Todas las demás fechas, a partir del día dos, usan el número cardinal normal.'
    example_gloss: Hoy es primero de agosto.
  ro.a1.unit03.lesson02.teach.date_rule:
    title: Cómo se dice una fecha en rumano
    gloss: 'Día 1: întâi · del 2 en adelante: el número normal (doi, trei, patru...)'
    note: A partir del día 2, las fechas en rumano son simplemente el número cardinal normal (ya visto) seguido del mes, sin forma ordinal ni palabra extra; por ejemplo, *trei aprilie* (tres de abril, literalmente «tres abril»).
  ro.a1.unit03.lesson02.teach.ce_data:
    title: Preguntar la fecha
    gloss: ¿Qué fecha es hoy?
    note: Dată (fecha) es una palabra nueva; el resto de la pregunta reutiliza ce, este y astăzi, igual que la pregunta sobre el día en la lección 1.
  ro.a1.unit03.lesson02.teach.raspuns_data:
    title: Decir una fecha
    gloss: Hoy es tres de abril.
    note: Trei (tres) es un número cardinal de la unidad 2; no lleva terminación ordinal ni se añade ninguna palabra antes de aprilie.
  ro.a1.unit03.lesson02.teach.la_multi_ani:
    title: Felicitar a alguien en un día especial
    gloss: ¡Feliz cumpleaños! / ¡Feliz Año Nuevo!
    note: 'Literalmente «(por) muchos años»: es la felicitación rumana más habitual para un cumpleaños, un santo o el Año Nuevo, y reutiliza *ani* (años) del contenido sobre la edad de la unidad 2.'
  ro.a1.unit03.lesson02.teach.lowercase_luni:
    title: Los meses también se escriben con minúscula
    gloss: 'Los meses no se escriben con mayúscula: enero, mayo.'
    note: 'Es la misma regla que para los días de la semana en la lección 1: los nombres de los meses en rumano van en minúscula en medio de una frase.'
  ro.a1.unit03.lesson03.teach.cand:
    title: ¿Cuándo?
    gloss: ¿cuándo?
    note: Când abre una pregunta sobre el momento, igual que «cuándo» en español.
    example_gloss: ¿Cuándo es la reunión?
  ro.a1.unit03.lesson03.teach.intalnirea:
    title: La reunión
    gloss: la reunión
    note: Întâlnirea es la forma con artículo (la reunión); el sustantivo sin artículo sería întâlnire.
    example_gloss: La reunión es el lunes.
  ro.a1.unit03.lesson03.teach.cand_e_intalnirea:
    title: Preguntar cuándo es algo
    gloss: ¿Cuándo es la reunión?
    note: Combina când con el ya conocido este y con întâlnirea, palabra nueva de esta lección.
  ro.a1.unit03.lesson03.teach.raspuns_intalnire:
    title: Decir la fecha de un evento
    gloss: La reunión es el viernes, primero de agosto.
    note: El día de la semana y la fecha se pueden decir juntos, separados por una coma, como en español; la diferencia es que en rumano no se añade «de» entre el día y el mes.
  ro.a1.unit03.lesson03.teach.fara_de:
    title: Sin «de» con días y fechas
    gloss: 'En rumano, los días y las fechas no llevan «de»: viernes, primero de agosto.'
    note: 'Un contraste útil con la regla de la unidad 2: los números a partir de 20 necesitan *de* antes de un sustantivo corriente (*treizeci de ani*), pero un día de la semana o una fecha se unen directamente, sin *de*.'
  ro.a1.unit03.lesson03.teach.line01:
    title: Preguntar cuándo es la reunión
    gloss: Ana le pregunta a Mihai cuándo es la reunión.
    note: 'Es una pregunta sencilla y neutra: este no cambia entre tú y dumneavoastră.'
  ro.a1.unit03.lesson03.teach.line02:
    title: Decir la fecha
    gloss: Mihai dice que la reunión es el viernes, primero de agosto.
    note: 'Mihai repite exactamente el patrón de fecha de la lección 2: día de la semana, luego întâi + mes, sin de.'
  ro.a1.unit03.lesson03.teach.line03:
    title: Agradecer y despedirse
    gloss: Ana le da las gracias y se despide.
    note: La revedere, que se aprendió en la unidad 1, cierra la conversación igual que siempre.
  ro.a1.unit03.lesson03.teach.line04:
    title: Cerrar el encuentro
    gloss: Mihai se despide también, usando el nombre de Ana.
    note: Repetir la revedere con el nombre de la otra persona es una forma natural y amable de despedirse.
