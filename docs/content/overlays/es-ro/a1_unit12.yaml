teaching:
  ro.a1.unit12.lesson01.teach.reminder_parc_cinema:
    title: 'Repaso: parc, cinema'
    gloss: parc (el parque) · cinema (el cine)
    note: Ambas ya se vieron en la Unidad 11; aquí se combinan con la nueva gramática del pasado de esta unidad.
  ro.a1.unit12.lesson01.teach.reminder_astazi_maine_duminica_sambata:
    title: 'Repaso: astăzi, mâine, duminică, sâmbătă'
    gloss: astăzi (hoy) · mâine (mañana) · duminică (domingo) · sâmbătă (sábado)
    note: Todas ya vistas en la Unidad 3 y la Unidad 11; aquí preparan el contraste con el nuevo *ieri* (ayer) de esta lección.
  ro.a1.unit12.lesson01.teach.am_fost_vocab:
    title: Estuve / Fui
    gloss: Am fost (estuve / fui)
    note: El perfect compus (pasado) de *a fi* (ser, estar). *Am* es la misma palabra auxiliar invariable para «yo» y «nosotros», y *fost* es la forma fija del pasado. Con un lugar, *am fost la...* es la forma cotidiana y natural de decir «fui a...»; en la lengua hablada se usa más que un verbo de movimiento literal.
    example_gloss:
    - Fui al parque.
  ro.a1.unit12.lesson01.teach.am_fost_parc_phrase:
    title: Fui al parque
    gloss: Am fost la parc. (Fui al parque.)
    note: 'El patrón completo: am fost + la + lugar.'
  ro.a1.unit12.lesson01.teach.am_fost_cinema_phrase:
    title: Fui al cine
    gloss: Am fost la cinema. (Fui al cine.)
    note: El mismo patrón que *Am fost la parc*, con otro lugar.
  ro.a1.unit12.lesson01.teach.ieri_vocab:
    title: Ayer
    gloss: Ieri (ayer)
    note: Ya visto en la Unidad 3 junto a *astăzi* (hoy) y *mâine* (mañana); ahora se usa con el pasado, al principio de la frase, para decir cuándo ocurrió algo.
    example_gloss:
    - Ayer fui al parque.
  ro.a1.unit12.lesson01.teach.ieri_am_fost_parc_phrase:
    title: Ayer fui al parque
    gloss: Ieri am fost la parc. (Ayer fui al parque.)
    note: Al poner *ieri* delante de *Am fost la parc* se indica exactamente cuándo.
  ro.a1.unit12.lesson02.teach.reminder_mananc_beau:
    title: 'Repaso: mănânc, beau'
    gloss: mănânc (como) · beau (bebo)
    note: Ambos ya vistos en la rutina diaria de la Unidad 10; esta lección los convierte en sus formas de pasado.
  ro.a1.unit12.lesson02.teach.reminder_paine_cafea_ceai_si:
    title: 'Repaso: pâine, cafea, ceai, și'
    gloss: pâine (pan) · cafea (café) · ceai (té) · și (y)
    note: Todas ya vistas en la Unidad 6 y la Unidad 10; se reutilizan aquí en las frases en pasado de esta lección.
  ro.a1.unit12.lesson02.teach.am_mancat_vocab:
    title: Comí
    gloss: Am mâncat (comí)
    note: 'El perfect compus de *a mânca* (comer), ya visto como *mănânc* (como, Unidad 10): el mismo verbo, en pasado. Am + mâncat, igual que *am fost*.'
    example_gloss:
    - Comí pan.
  ro.a1.unit12.lesson02.teach.am_mancat_paine_phrase:
    title: Comí pan
    gloss: Am mâncat pâine. (Comí pan.)
    note: 'El patrón completo: am mâncat + la comida.'
  ro.a1.unit12.lesson02.teach.am_baut_vocab:
    title: Bebí
    gloss: Am băut (bebí)
    note: 'El perfect compus de *a bea* (beber), ya visto como *beau* (bebo, Unidad 10): el mismo verbo, en pasado.'
    example_gloss:
    - Bebí té.
  ro.a1.unit12.lesson02.teach.am_baut_ceai_phrase:
    title: Bebí té
    gloss: Am băut ceai. (Bebí té.)
    note: 'El patrón completo: am băut + la bebida.'
  ro.a1.unit12.lesson02.teach.am_mancat_am_baut_phrase:
    title: Comí pan y bebí té
    gloss: Am mâncat pâine și am băut ceai. (Comí pan y bebí té.)
    note: Dos acciones en pasado unidas con *și*, el mismo conector que la Unidad 10 ya usó para las rutinas en presente.
  ro.a1.unit12.lesson03.teach.reminder_am_fost_ieri_parc_cinema:
    title: 'Repaso: am fost, ieri, parc, cinema'
    gloss: am fost (estuve / fui) · ieri (ayer) · parc (el parque) · cinema (el cine)
    note: Todas proceden de la primera lección de esta unidad; aquí preparan el resumen del domingo.
  ro.a1.unit12.lesson03.teach.reminder_am_mancat_am_baut:
    title: 'Repaso: am mâncat, am băut, pâine, cafea, ceai'
    gloss: am mâncat (comí) · am băut (bebí) · pâine (pan) · cafea (café) · ceai (té)
    note: Todas proceden de la segunda lección de esta unidad; aquí Ana y Mihai cuentan qué tomaron.
  ro.a1.unit12.lesson03.teach.reminder_cum_duminica_bine:
    title: 'Repaso: cum, duminică, bine, mulțumesc, la revedere, Ana, Mihai'
    gloss: cum (cómo, Unidad 1/Unidad 9) · duminică (domingo, Unidad 3) · bine (bien, Unidad 1) · mulțumesc (gracias) · la revedere (adiós) · Ana, Mihai (nombres)
    note: 'Todas ya vistas en unidades anteriores. *Cum* apareció primero al preguntar el nombre (Unidad 1) y las direcciones (Unidad 9); aquí abre otro tipo de pregunta: cómo fue algo.'
  ro.a1.unit12.lesson03.teach.a_fost_vocab:
    title: Fue
    gloss: A fost (fue)
    note: 'Otra persona del mismo verbo de *am fost*: *a* es el auxiliar de «él/ella/ello», no el de «yo/nosotros». Por ahora aprende *Cum a fost...?* y *A fost bine!* como expresiones fijas, no como un patrón para construir libremente.'
    example_gloss:
    - ¡Fue bien!
  ro.a1.unit12.lesson03.teach.a_fost_bine_phrase:
    title: ¡Fue bien!
    gloss: A fost bine! (¡Fue bien!)
    note: Una forma breve y natural de decir que algo salió bien; es la respuesta a *Cum a fost...?*
  ro.a1.unit12.lesson03.teach.cum_a_fost_duminica_phrase:
    title: ¿Cómo fue el domingo?
    gloss: Cum a fost duminică? (¿Cómo fue el domingo?)
    note: 'Una forma natural de iniciar una conversación sobre un día reciente, incluso con alguien que también estuvo allí: le invitas a contar cómo lo vivió o qué le llamó la atención.'
  ro.a1.unit12.lesson03.teach.line01:
    title: Saluda y pregunta cómo fue el domingo
    gloss: Mihai saluda a Ana y le pregunta cómo fue el domingo.
    note: Combina el *Cum a fost duminică?* de esta unidad con el ya conocido *Bună*.
  ro.a1.unit12.lesson03.teach.line02:
    title: Responde y di dónde
    gloss: Ana dice que fue bien y que fue al parque.
    note: Combina *A fost bine!* con el *Am fost la parc* de la primera lección.
  ro.a1.unit12.lesson03.teach.line03:
    title: Di qué comió y bebió
    gloss: Mihai dice que comió pan y bebió té.
    note: Retoma el *Am mâncat pâine și am băut ceai* de la segunda lección, respetando lo que Mihai ya tomaba en la Unidad 6 (pâine y ceai).
  ro.a1.unit12.lesson03.teach.line04:
    title: Di qué bebió ella
    gloss: Ana dice que bebió café.
    note: Coincide con lo que Ana ya tomaba en la Unidad 6 (cafea).
  ro.a1.unit12.lesson03.teach.line05:
    title: Da las gracias y despídete
    gloss: Mihai da las gracias a Ana y se despide.
    note: El mismo cierre con el que terminaba el diálogo de cada unidad anterior.
  ro.a1.unit12.lesson03.teach.line06:
    title: Cierra la conversación
    gloss: Ana se despide también, usando el nombre de Mihai.
    note: El mismo cierre amistoso con el que terminaba el diálogo de cada unidad anterior.
