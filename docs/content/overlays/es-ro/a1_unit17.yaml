teaching:
  ro.a1.unit17.lesson01.teach.reminder_este_la_mihai:
    title: 'Repaso: este, la, Mihai'
    gloss: este (es) · la (en) · Mihai (nombre)
    note: Este viene de las Unidades 3, 4 y 8; la viene de *la ora nouă* (a las nueve) de la Unidad 4; Mihai es el nombre del personaje, presente desde la Unidad 1. En esta unidad se reutilizan los tres para hablar de su trabajo.
  ro.a1.unit17.lesson01.teach.reminder_lucrez_lucreaza:
    title: 'Repaso: lucrez, lucrează'
    gloss: lucrez (trabajo) · lucrează (él/ella trabaja)
    note: Ambos vienen de la rutina diaria de la Unidad 10 (*Lucrez seara.*). Aquí se reutilizan para hablar de la profesión en lugar de la hora del día.
  ro.a1.unit17.lesson01.teach.inginer_vocab:
    title: Ingeniero
    gloss: ingeniero
    note: 'Masculino: en esta unidad solo lo usa Mihai (*Sunt inginer*), así que todavía no hace falta la forma femenina.'
    example_gloss:
    - Mihai es ingeniero.
  ro.a1.unit17.lesson01.teach.birou_vocab:
    title: Oficina
    gloss: oficina
    note: El lugar donde trabaja Mihai, con la preposición *la* (en) ya vista en la Unidad 4.
    example_gloss:
    - Trabaja en la oficina.
  ro.a1.unit17.lesson01.teach.mihai_este_inginer_lucreaza_la_birou_phrase:
    title: Mihai es ingeniero. Trabaja en la oficina.
    gloss: Mihai este inginer. Lucrează la birou.
    note: Todas las palabras ya se habían enseñado o se acaban de presentar, combinadas en dos oraciones nuevas sobre el trabajo de Mihai.
  ro.a1.unit17.lesson02.teach.reminder_sunt_unde_ana:
    title: 'Repaso: sunt, unde, Ana'
    gloss: sunt (soy) · unde (dónde) · Ana (nombre)
    note: Sunt es de la Unidad 16 (*Sunt bolnav*); unde es de las Unidades 7 y 8 (*Unde pot să cumpăr...?*, *Unde este...?*); Ana es el nombre del personaje, presente desde la Unidad 1. Esta unidad reutiliza las tres palabras para hablar del trabajo de Ana.
  ro.a1.unit17.lesson02.teach.profesoara_vocab:
    title: Profesora
    gloss: Profesora (femenino)
    note: 'Femenino: en esta unidad solo la usa Ana (*Sunt profesoară*), así que todavía no hace falta la forma masculina.'
    example_gloss:
    - Soy profesora.
  ro.a1.unit17.lesson02.teach.scoala_vocab:
    title: Escuela
    gloss: Escuela
    note: El lugar donde trabaja Ana; se usa con *la* igual que en *la birou*.
    example_gloss:
    - Trabajo en la escuela.
  ro.a1.unit17.lesson02.teach.sunt_profesoara_lucrez_la_scoala_phrase:
    title: Soy profesora. Trabajo en la escuela.
    gloss: Soy profesora. Trabajo en la escuela.
    note: La frase con la que Ana habla de su trabajo; combina las dos palabras nuevas de esta lección con *sunt*, ya visto en la Unidad 16.
  ro.a1.unit17.lesson02.teach.unde_lucrati_phrase:
    title: ¿Dónde trabaja usted?
    gloss: ¿Dónde trabaja usted?
    note: '*Lucrați* es la forma de cortesía de «usted trabaja», con la misma terminación -ați/-eți que ya viste en *aveți* y *faceți*. Sirve para preguntar a cualquiera por su trabajo.'
  ro.a1.unit17.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Repaso: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Hola · ¿Cómo está usted? · Bien, gracias
    note: Todo viene del saludo inicial de la Unidad 1 y se reutiliza aquí para empezar el diálogo de esta unidad.
  ro.a1.unit17.lesson03.teach.reminder_si_dumneavoastra_la_revedere:
    title: 'Repaso: Și dumneavoastră?, La revedere'
    gloss: ¿Y usted? · Adiós
    note: Ambas son de la Unidad 1 y se reutilizan aquí como pregunta de seguimiento natural y como despedida.
  ro.a1.unit17.lesson03.teach.line01:
    title: Saluda y pregunta cómo está
    gloss: Ana saluda a Mihai y le pregunta cómo está.
    note: Reutiliza el saludo *Ce mai faceți?* de la Unidad 1.
  ro.a1.unit17.lesson03.teach.line02:
    title: Responde y pregunta dónde trabaja ella
    gloss: Mihai responde y luego le pregunta a Ana dónde trabaja.
    note: Combina *Bine, mulțumesc* de la Unidad 1 con *Unde lucrați?*, nuevo en esta unidad.
  ro.a1.unit17.lesson03.teach.line03:
    title: Di tu profesión y tu lugar de trabajo, y pregunta de vuelta
    gloss: Ana dice que trabaja en una escuela como profesora y le hace la misma pregunta a Mihai.
    note: Combina la frase de la segunda lección de esta unidad con *Și dumneavoastră?* de la Unidad 1.
  ro.a1.unit17.lesson03.teach.line04:
    title: Di tu profesión y tu lugar de trabajo
    gloss: Mihai dice que trabaja en una oficina como ingeniero.
    note: Reutiliza casi igual la frase de la primera lección de esta unidad.
  ro.a1.unit17.lesson03.teach.line05:
    title: Cierra la conversación
    gloss: Ana se despide.
    note: Es la misma fórmula de cierre con la que terminan los diálogos de las unidades anteriores.
  ro.a1.unit17.lesson03.teach.line06:
    title: Despídete
    gloss: Mihai se despide.
    note: Es la misma fórmula de cierre con la que terminan los diálogos de las unidades anteriores.
