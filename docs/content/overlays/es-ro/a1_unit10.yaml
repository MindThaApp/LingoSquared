teaching:
  ro.a1.unit10.lesson01.teach.reminder_dimineata_seara_noaptea_cafea_paine:
    title: 'Repaso: dimineața, seara, noaptea, cafea, pâine'
    gloss: dimineața (por la mañana) · seara (por la tarde/noche) · noaptea (por la noche) · cafea (café) · pâine (pan)
    note: 'Todo esto ya se vio: dimineața/seara/noaptea desde la Unidad 4 y cafea/pâine desde la Unidad 6. Aquí se combinan en las frases de rutina diaria de esta unidad.'
  ro.a1.unit10.lesson01.teach.ma_trezesc_vocab:
    title: Me despierto
    gloss: Mă trezesc (me despierto)
    note: '*Mă* es el pronombre reflexivo que ya viste en *mă numesc* y *mă cheamă*. Como en español («despertarse»), el rumano usa un verbo reflexivo para «despertarse»: literalmente, «me despierto a mí mismo».'
    example_gloss:
    - Me despierto por la mañana.
  ro.a1.unit10.lesson01.teach.ma_trezesc_phrase:
    title: Me despierto por la mañana
    gloss: Mă trezesc dimineața. (Me despierto por la mañana.)
    note: 'Una frase corta y completa: la oración de rutina más sencilla posible.'
  ro.a1.unit10.lesson01.teach.mananc_vocab:
    title: Como
    gloss: Mănânc (como)
    note: 'No hace falta el pronombre «yo»: como en español, las terminaciones del verbo rumano ya indican quién habla, igual que ya viste con *vreau*, *cumpăr* y *aș dori*.'
    example_gloss:
    - Como pan por la mañana.
  ro.a1.unit10.lesson01.teach.beau_vocab:
    title: Bebo
    gloss: Beau (bebo)
    note: Combina de forma natural con bebidas que ya conoces, como *cafea* y *ceai*.
    example_gloss:
    - Por la mañana tomo café.
  ro.a1.unit10.lesson01.teach.mananc_beau_phrase:
    title: Como pan y bebo café por la mañana
    gloss: Mănânc pâine și beau cafea dimineața. (Como pan y bebo café por la mañana.)
    note: Une dos acciones con *și* (y), que ya conoces de *ora unu și jumătate* de la Unidad 4.
  ro.a1.unit10.lesson02.teach.lucrez_vocab:
    title: Trabajo
    gloss: Lucrez (trabajo)
    note: Es la forma de primera persona de *lucrează*, que ya viste en la Unidad 4 cuando Mihai trabaja por la noche.
    example_gloss:
    - Trabajo por la tarde.
  ro.a1.unit10.lesson02.teach.lucrez_phrase:
    title: Trabajo por la tarde
    gloss: Lucrez seara. (Trabajo por la tarde.)
    note: Una frase corta y completa sobre cuándo trabajas.
  ro.a1.unit10.lesson02.teach.merg_vocab:
    title: Voy
    gloss: Merg (voy)
    note: 'Es la forma de primera persona de *mergeți*, la forma de mandato vista antes: es el mismo verbo, pero en otra persona.'
    example_gloss:
    - Voy a casa.
  ro.a1.unit10.lesson02.teach.acasa_vocab:
    title: La casa
    gloss: Acasă (a casa / en casa)
    note: 'Se usa sin preposición: *merg acasă*, no *merg la acasă*. En español, en cambio, decimos «voy a casa», con la preposición «a».'
    example_gloss:
    - Voy a casa por la noche.
  ro.a1.unit10.lesson02.teach.merg_acasa_phrase:
    title: Voy a casa por la noche
    gloss: Merg acasă noaptea. (Voy a casa por la noche.)
    note: 'Una frase breve y completa: el final natural de una jornada de trabajo.'
  ro.a1.unit10.lesson02.teach.lucrez_merg_phrase:
    title: Trabajo por la tarde y voy a casa por la noche
    gloss: Lucrez seara și merg acasă noaptea. (Trabajo por la tarde y voy a casa por la noche.)
    note: Une las dos frases de esta lección en una sola con *și*.
  ro.a1.unit10.lesson03.teach.reminder_cursul_incepe_ora_apoi:
    title: 'Repaso: cursul, începe, la ora nouă, apoi'
    gloss: cursul (el curso) · începe (empieza) · la ora nouă (a las nueve) · apoi (luego)
    note: Cursul/începe/la ora nouă ya aparecieron en la Unidad 4 (el curso de Mihai empieza a las nueve de la mañana); apoi ya apareció en la Unidad 9. Aquí se combinan en el relato de la rutina de Mihai.
  ro.a1.unit10.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Repaso: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (hola) · mulțumesc (gracias) · la revedere (adiós) · da (sí) · Ana, Mihai (nombres)
    note: Todo esto ya se vio en unidades anteriores. Aquí Ana le pregunta a Mihai por su día.
  ro.a1.unit10.lesson03.teach.ma_culc_vocab:
    title: Me acuesto
    gloss: Mă culc (me acuesto)
    note: Otro verbo reflexivo, con el mismo patrón que *mă trezesc*; literalmente, «me pongo tumbado».
    example_gloss:
    - Me acuesto por la noche.
  ro.a1.unit10.lesson03.teach.ma_culc_phrase:
    title: Me acuesto por la noche
    gloss: Mă culc noaptea. (Me acuesto por la noche.)
    note: El final natural del día, que cierra la rutina iniciada con *mă trezesc dimineața*.
  ro.a1.unit10.lesson03.teach.line01:
    title: Saludar y preguntar cuándo empieza el curso
    gloss: Ana saluda a Mihai y le pregunta cuándo empieza su curso.
    note: Retoma la pregunta de la Unidad 4 sobre el curso de Mihai.
  ro.a1.unit10.lesson03.teach.line02:
    title: Responder con la hora del curso
    gloss: Mihai dice que su curso empieza a las nueve de la mañana.
    note: Es exactamente la misma respuesta que dio Mihai en la Unidad 4, ahora dentro de su rutina diaria completa.
  ro.a1.unit10.lesson03.teach.line03:
    title: Preguntar por la tarde
    gloss: 'Ana hace una breve pregunta de seguimiento: «¿Y por la tarde?».'
    note: Una forma natural y mínima de pedir más información sobre la rutina, sin una palabra interrogativa nueva.
  ro.a1.unit10.lesson03.teach.line04:
    title: Describir el resto del día
    gloss: Mihai dice que trabaja por la tarde y luego se acuesta por la noche.
    note: 'Combina *lucrez* y *mă culc* de esta unidad con *apoi*, y coincide con lo que ya sabemos desde la Unidad 4: Mihai trabaja por la tarde.'
  ro.a1.unit10.lesson03.teach.line05:
    title: Agradecer y despedirse
    gloss: Ana dice «¡Bien!», le da las gracias a Mihai y se despide.
    note: Es el mismo agradecimiento final que usaron los diálogos de las Unidades 1, 8 y 9.
  ro.a1.unit10.lesson03.teach.line06:
    title: Cerrar el encuentro
    gloss: Mihai se despide también, usando el nombre de Ana.
    note: Es la misma despedida amistosa con la que terminaron los diálogos de todas las unidades anteriores.
