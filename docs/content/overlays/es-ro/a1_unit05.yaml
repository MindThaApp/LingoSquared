answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: This unit's new "Ai frați?"/"Aveți frați?" and "Câți copii ai?"/"Câți copii aveți?" pairs are register-sensitive (tu vs. dumneavoastră, parallel to unit02's ai/aveți age questions) -- accept either register unless an exercise explicitly names one. Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: Rumano A1
  description: 'Hablar de la familia en rumano: padres, hermanos, hijos y estado civil, usando el par posesivo meu/mea y el mismo contraste de preguntas tú/usted (tu/dumneavoastră) de las preguntas sobre la edad de la unidad 2. Seguimos con Ana y Mihai mientras conocen a sus familias.'
units:
  ro.a1.unit05.family:
    title: La familia
lessons:
  ro.a1.unit05.lesson01.familia_mea:
    title: Mi familia
  ro.a1.unit05.lesson02.frati_si_copii:
    title: Hermanos e hijos
  ro.a1.unit05.lesson03.o_discutie_despre_familie:
    title: Una conversación sobre la familia
teaching:
  ro.a1.unit05.lesson01.teach.reminder_am_un_o_si_mare:
    title: 'Repaso: am, un, o, și, mare'
    gloss: am (tengo) · un/o (un/una) · și (y) · mare (grande)
    note: Las cinco palabras ya aparecieron en unidades anteriores (*și* en la unidad 1, *am* y *o* en la unidad 2, *mare* en la nota sobre las mayúsculas de la unidad 3, *un* en la unidad 4); aquí vuelven para hablar de la familia.
  ro.a1.unit05.lesson01.teach.familie:
    title: La familia
    gloss: familia
    note: 'Sustantivo femenino: se combina con *o* y un adjetivo como *mare* para decir «una familia grande».'
    example_gloss: Tengo una familia grande.
  ro.a1.unit05.lesson01.teach.mama:
    title: Madre
    gloss: madre
    note: La palabra básica de diccionario para «madre»; más adelante verás cómo decir «mi madre».
    example_gloss: Mihai tiene madre y padre.
  ro.a1.unit05.lesson01.teach.tata:
    title: Padre
    gloss: padre
    note: La palabra básica de diccionario para «padre».
    example_gloss: Mi padre es profesor.
  ro.a1.unit05.lesson01.teach.parintii:
    title: Padres
    gloss: padres
    note: Designa a los dos progenitores juntos, igual que «padres» en español.
    example_gloss: Mis padres viven en Rumanía.
  ro.a1.unit05.lesson01.teach.meu_mea:
    title: 'Mi: meu y mea'
    gloss: meu (mi, masculino) / mea (mi, femenino)
    note: 'La palabra rumana para «mi» concuerda con el género de lo poseído, no con el de quien habla: *meu* con un sustantivo masculino como *tată*, *mea* con uno femenino como *mamă*.'
  ro.a1.unit05.lesson01.teach.mama_mea:
    title: Mi madre
    gloss: mi madre
    note: Mamă pasa a mama (se añade el artículo) antes de unirse a mea; esta es la forma real de decir «mi madre», no una traducción palabra por palabra.
  ro.a1.unit05.lesson01.teach.tatal_meu:
    title: Mi padre
    gloss: mi padre
    note: Tată pasa a tatăl (se añade el artículo, de forma irregular con -l, ya que tată termina en -ă) antes de unirse a meu.
  ro.a1.unit05.lesson01.teach.mama_si_tatal:
    title: Mi madre y mi padre
    gloss: Mi madre y mi padre.
    note: Reúne los dos posesivos en una sola frase, cada uno con su concordancia de género correcta.
  ro.a1.unit05.lesson02.teach.reminder_cati_ai_aveti_doi_nu:
    title: 'Repaso: câți, ai, aveți, doi, nu'
    gloss: câți (cuántos) · ai/aveți (tienes/tiene, informal/formal) · doi (dos) · nu (no)
    note: '*Câți*, *ai* y *aveți* aparecieron por primera vez en la unidad 2 para preguntar la edad ("Câți ani ai?"); aquí sirven para preguntar por hermanos e hijos. *Doi* viene de los números de la unidad 2 y *nu*, de la unidad 3.'
  ro.a1.unit05.lesson02.teach.da:
    title: Sí
    gloss: sí
    note: La palabra cotidiana para «sí»; forma pareja con *nu* («no») de la unidad 3.
    example_gloss: Sí, tengo un hermano.
  ro.a1.unit05.lesson02.teach.frate_sora:
    title: Hermano, hermana
    gloss: hermano / hermana
    note: 'Sustantivos masculino y femenino para hermanos: se combinan con un/o igual que cualquier otro sustantivo.'
    example_gloss:
    - Tengo un hermano.
    - Tengo una hermana.
  ro.a1.unit05.lesson02.teach.frati_surori:
    title: Hermanos, hermanas
    gloss: hermanos / hermanas
    note: 'Son las formas plurales, usadas para PREGUNTAR por los hermanos en general: en rumano es habitual preguntar "Ai frați?" («¿Tienes hermanos?») con el sentido de «¿tienes hermanos o hermanas?», y a menudo se añade "Surori?" como comprobación aparte sobre las hermanas.'
    example_gloss: ¿Tienes hermanos o hermanas?
  ro.a1.unit05.lesson02.teach.ai_frati:
    title: ¿Tienes hermanos? (informal)
    gloss: ¿Tienes hermanos?
    note: La forma cotidiana e informal de preguntar; va con el registro de *tu* de la unidad 1.
  ro.a1.unit05.lesson02.teach.aveti_frati:
    title: ¿Tiene hermanos? (formal)
    gloss: ¿Tienes hermanos?
    note: La versión cortés, con el mismo *aveți* de la pregunta sobre la edad de la unidad 2.
  ro.a1.unit05.lesson02.teach.copil_copii:
    title: Hijo/niño, hijos/niños
    gloss: niño, hijo / niños, hijos
    note: 'Copil tiene uno de los plurales más difíciles del rumano: copii, que no sigue un final regular en -i o -e; conviene memorizarlo como forma propia.'
    example_gloss: Tengo dos hijos.
  ro.a1.unit05.lesson02.teach.fiu_fiica:
    title: Hijo, hija
    gloss: hijo / hija
    note: Las palabras específicas para «hijo» e «hija», distintas de la general copil/copii.
    example_gloss:
    - Tengo un hijo.
    - Tengo una hija.
  ro.a1.unit05.lesson02.teach.cati_copii_ai:
    title: ¿Cuántos hijos tienes?
    gloss: ¿Cuántos hijos tienes?
    note: 'Câți (cuántos) + copii (hijos) + ai (tienes): las tres palabras ya te resultan conocidas.'
  ro.a1.unit05.lesson02.teach.casatorit:
    title: Casado
    gloss: casado
    note: Pregunta personal habitual en las conversaciones cotidianas, igual que preguntar la edad.
    example_gloss: ¿Estás casado?
  ro.a1.unit05.lesson03.teach.reminder_bine_la_revedere:
    title: 'Repaso: bine, la revedere, Ana, Mihai'
    gloss: bine (bien) · la revedere (adiós) · Ana, Mihai (nombres)
    note: Repasa vocabulario ya enseñado en unidades anteriores y reutilizado en el diálogo de esta lección.
  ro.a1.unit05.lesson03.teach.line01:
    title: Preguntar por los hermanos
    gloss: Ana le pregunta a Mihai si tiene hermanos.
    note: Usa el *aveți* cortés, acorde con el registro que ya han establecido entre ellos.
  ro.a1.unit05.lesson03.teach.line02:
    title: Responder y devolver la pregunta
    gloss: Mihai dice que tiene un hermano y una hermana, y pregunta si Ana tiene hijos.
    note: Reutiliza el vocabulario de esta unidad, frate/soră y copii, en un solo intercambio.
  ro.a1.unit05.lesson03.teach.line03:
    title: Responder y devolver la pregunta
    gloss: Ana dice que tiene una hija y le hace la misma pregunta a Mihai.
    note: '*Și dumneavoastră?* («¿Y usted?») es exactamente el mismo patrón para devolver la pregunta de las presentaciones de la unidad 1.'
  ro.a1.unit05.lesson03.teach.line04:
    title: Responder
    gloss: Mihai dice que tiene un hijo.
    note: Una respuesta breve y directa con fiu, de esta unidad.
  ro.a1.unit05.lesson03.teach.line05:
    title: Reaccionar y despedirse
    gloss: Ana reacciona de forma positiva y se despide.
    note: Aquí *Bine!* es una breve reacción positiva, la misma palabra de *Bine, mulțumesc.* de la unidad 1.
  ro.a1.unit05.lesson03.teach.line06:
    title: Cerrar el encuentro
    gloss: Mihai también se despide, usando el nombre de Ana.
    note: La misma despedida amistosa con la que terminaron los diálogos de las unidades 1 y 4.
