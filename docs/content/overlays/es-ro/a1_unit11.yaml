answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's new words are all register-neutral -- mergem (first-person plural) and nu pot (first-person singular) don't change with tu/dumneavoastră, and atunci/sigur are invariant connective/response words with no person marking. No new second-person forms are introduced. Ana and Mihai's closing dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08/unit09/unit10.
course:
  title: Rumano A1
  description: 'Proponer, aceptar, rechazar y concretar un plan sencillo en rumano: mergem (vamos), nu pot (no puedo), atunci (entonces) y sigur (claro). Ana y Mihai siguen quedando para verse en el parque.'
units:
  ro.a1.unit11.plans:
    title: Planes
lessons:
  ro.a1.unit11.lesson01.mergem_la_cinema:
    title: ¿Vamos al cine?
  ro.a1.unit11.lesson02.nu_pot_atunci:
    title: No puedo. ¿Entonces?
  ro.a1.unit11.lesson03.planul_de_duminica:
    title: El plan del domingo
teaching:
  ro.a1.unit11.lesson01.teach.reminder_da_bine:
    title: 'Repaso: da, bine, nu, mulțumesc'
    gloss: da (sí) · bine (bien) · nu (no) · mulțumesc (gracias)
    note: Todo esto se vio desde la Unidad 6. Aquí se combina en la forma de aceptar un plan de esta unidad y en el ejercicio de repaso de vocabulario con parejas.
  ro.a1.unit11.lesson01.teach.mergem_vocab:
    title: Vamos / vamos a ir
    gloss: Mergem (vamos)
    note: 'Es la primera persona del plural de *a merge*, que ya viste como *merg* (voy, Unidad 10) y *mergeți* (el mandato formal, Unidad 9): es el mismo verbo, en otra persona y número. Dicho solo y con entonación ascendente, es una forma natural de proponer hacer algo juntos.'
    example_gloss:
    - ¿Vamos al cine?
  ro.a1.unit11.lesson01.teach.cinema_vocab:
    title: El cine
    gloss: Cinema (el cine)
    note: Se parece mucho al español «cine» (de «cinema»), así que es fácil de reconocer.
    example_gloss:
    - ¿Vamos al cine?
  ro.a1.unit11.lesson01.teach.mergem_cinema_phrase:
    title: ¿Vamos al cine?
    gloss: Mergem la cinema? (¿Vamos al cine?)
    note: 'Una invitación completa: no hace falta añadir «¿quieres?»; la entonación interrogativa basta para convertir «vamos» en una propuesta.'
  ro.a1.unit11.lesson01.teach.parc_vocab:
    title: El parque
    gloss: Parc (el parque)
    note: Otra palabra muy parecida al español, como *cinema*.
    example_gloss:
    - ¿Vamos al parque?
  ro.a1.unit11.lesson01.teach.mergem_parc_phrase:
    title: ¿Vamos al parque?
    gloss: Mergem la parc? (¿Vamos al parque?)
    note: Es el mismo patrón de invitación que *Mergem la cinema?*, pero con otro lugar.
  ro.a1.unit11.lesson01.teach.da_bine_phrase:
    title: ¡Sí, vale!
    gloss: Da, bine! (¡Sí, vale!)
    note: 'Una forma breve y natural de aceptar un plan: palabras que ya conoces, en una combinación nueva.'
  ro.a1.unit11.lesson02.teach.reminder_nu_pot:
    title: 'Repaso: nu, pot'
    gloss: nu (no) · pot (puedo)
    note: '*Nu* ya se vio en la Unidad 6; pot ya apareció en la Unidad 9, en *cum pot să ajung* (cómo puedo llegar). Colocado delante de un verbo, nu significa «no»: *nu pot* es «no puedo», la forma que usa esta unidad para rechazar un plan.'
  ro.a1.unit11.lesson02.teach.reminder_sambata_duminica:
    title: 'Repaso: sâmbătă, duminică'
    gloss: sâmbătă (sábado) · duminică (domingo)
    note: Ambas ya se vieron en los días de la semana de la Unidad 3.
  ro.a1.unit11.lesson02.teach.mergem_parc_sambata_phrase:
    title: ¿Vamos al parque el sábado?
    gloss: Mergem la parc sâmbătă? (¿Vamos al parque el sábado?)
    note: 'La invitación de la lección 1, ahora con un día: combina *Mergem la parc?* con el nombre de un día.'
  ro.a1.unit11.lesson02.teach.nu_pot_sambata_phrase:
    title: No puedo el sábado
    gloss: Nu pot sâmbătă. (No puedo el sábado.)
    note: 'Una negativa sencilla: *nu pot* más el día que se rechaza.'
  ro.a1.unit11.lesson02.teach.atunci_vocab:
    title: Entonces / en ese caso
    gloss: Atunci (entonces / en ese caso)
    note: 'Distinto de *apoi* (el «luego» de la Unidad 9, que ordena dos acciones): *atunci* propone una alternativa o saca una consecuencia; es la palabra natural para «en ese caso, ¿qué tal...?» al cambiar un plan.'
    example_gloss:
    - ¿Entonces, el domingo?
  ro.a1.unit11.lesson02.teach.atunci_duminica_phrase:
    title: ¿Entonces, el domingo?
    gloss: Atunci, duminică? (¿Entonces, el domingo?)
    note: 'Una contrapropuesta breve tras una negativa: basta con nombrar un nuevo día, sin repetir toda la invitación.'
  ro.a1.unit11.lesson02.teach.da_bine_duminica_phrase:
    title: ¡Sí, vale! El domingo.
    gloss: Da, bine! Duminică. (¡Sí, vale! El domingo.)
    note: Aceptar el nuevo día con el mismo patrón breve de *Da, bine!* de la lección 1.
  ro.a1.unit11.lesson03.teach.reminder_la_ce_ora_la_ora_patru:
    title: 'Repaso: la ce oră, la ora, patru'
    gloss: la ce oră (a qué hora) · la ora (a las ... en punto) · patru (cuatro)
    note: La ce oră y la ora ya se vieron en la Unidad 4 (preguntar y decir la hora); patru ya apareció en los números de la Unidad 2. Aquí se combinan para fijar la hora de la cita de esta unidad.
  ro.a1.unit11.lesson03.teach.reminder_buna_multumesc_la_revedere_da_ana_mihai:
    title: 'Repaso: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (hola) · mulțumesc (gracias) · la revedere (adiós) · da (sí) · Ana, Mihai (nombres)
    note: Todo esto ya se vio en unidades anteriores. Aquí Ana y Mihai acuerdan la hora de su plan.
  ro.a1.unit11.lesson03.teach.sigur_vocab:
    title: Claro
    gloss: Sigur (claro)
    note: Una forma habitual de confirmar un plan por sí sola, parecida a «¡Claro!» o «¡Por supuesto!» en español.
    example_gloss:
    - ¡Claro! A las cuatro.
  ro.a1.unit11.lesson03.teach.sigur_phrase:
    title: ¡Claro! A las cuatro.
    gloss: Sigur! La ora patru. (¡Claro! A las cuatro.)
    note: Confirma el plan y la hora exacta en una sola respuesta breve.
  ro.a1.unit11.lesson03.teach.line01:
    title: Saludar y proponer el parque
    gloss: Ana saluda a Mihai y le pregunta si van al parque el domingo.
    note: Combina la invitación *Mergem la parc?* de esta unidad con *duminică*.
  ro.a1.unit11.lesson03.teach.line02:
    title: Aceptar y preguntar la hora
    gloss: Mihai acepta y pregunta a qué hora.
    note: Reutiliza la pregunta *La ce oră?* de la Unidad 4.
  ro.a1.unit11.lesson03.teach.line03:
    title: Proponer una hora
    gloss: Ana propone las cuatro.
    note: Una pregunta breve que reutiliza el patrón *la ora* de la Unidad 4 con el *patru* de esta unidad.
  ro.a1.unit11.lesson03.teach.line04:
    title: Confirmar y dar las gracias
    gloss: Mihai confirma con «¡Claro!» y da las gracias a Ana.
    note: Combina el *sigur* de esta unidad con el ya conocido *mulțumesc*.
  ro.a1.unit11.lesson03.teach.line05:
    title: Despedirse
    gloss: Ana se despide.
    note: El mismo cierre con el que terminaron los diálogos de todas las unidades anteriores.
  ro.a1.unit11.lesson03.teach.line06:
    title: Cerrar el encuentro
    gloss: Mihai se despide a su vez, usando el nombre de Ana.
    note: El mismo cierre amistoso con el que terminaron los diálogos de todas las unidades anteriores.
