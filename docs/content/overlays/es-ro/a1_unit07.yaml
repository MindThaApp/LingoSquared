answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: '"Vreau" (I want, plain) and "Aș dori" (I would like, polite, established in unit06) are a genuine directness contrast, not interchangeable synonyms -- accept either for a general "I want/I would like" unless an exercise explicitly names one. "Vă rog" (formal) and "te rog" (informal, both established in unit06) remain a register-sensitive pair here too. Ana and Mihai''s market dialogue keeps their existing polite register with each other (vă rog, not te rog).'
course:
  title: Rumano A1
  description: 'Cómo preguntar precios y cantidades en rumano: la moneda leu/lei, scump/ieftin y la compra de productos del mercado como roșii (tomates) y cartofi (patatas) por kilo, con Ana y Mihai de compras en el mercado.'
units:
  ro.a1.unit07.shopping:
    title: De compras
lessons:
  ro.a1.unit07.lesson01.cat_costa:
    title: ¿Cuánto cuesta?
  ro.a1.unit07.lesson02.rosii_si_cartofi:
    title: Tomates y patatas
  ro.a1.unit07.lesson03.la_piata:
    title: En el mercado
teaching:
  ro.a1.unit07.lesson01.teach.reminder_un_numere:
    title: 'Repaso: un, doi, cinco, zece, douăzeci'
    gloss: un (uno) · doi (dos) · cinci (cinco) · zece (diez) · douăzeci (veinte)
    note: Todas aparecieron ya en unidades anteriores (*un* en la Unidad 4, los números en la Unidad 2); aquí vuelven para hablar de precios.
  ro.a1.unit07.lesson01.teach.cat_costa:
    title: ¿Cuánto cuesta?
    gloss: Cât costă? (¿Cuánto cuesta?)
    note: 'La forma cotidiana de preguntar un precio en rumano: se añade el nombre del producto después, o se usa sola así cuando el producto ya se sabe por el contexto.'
  ro.a1.unit07.lesson01.teach.leu:
    title: Leu (moneda)
    gloss: 'leu (la unidad monetaria de Rumanía; plural: lei)'
    note: La moneda de Rumanía. Leu es singular (un leu); el plural lei es irregular, no se forma añadiendo una terminación normal a leu.
    example_gloss: Cuesta un leu.
  ro.a1.unit07.lesson01.teach.costa_cinci_lei:
    title: Cuesta ocho lei
    gloss: Costă opt lei. (Cuesta ocho lei.)
    note: Del 2 al 19, lei va directamente después del número, sin ninguna palabra añadida.
  ro.a1.unit07.lesson01.teach.costa_douazeci_de_lei:
    title: Cuesta treinta lei
    gloss: Costă treizeci de lei. (Cuesta treinta lei.)
    note: A partir de 20, el rumano inserta *de* antes del sustantivo contado; es la misma regla que la Unidad 2 enseñó con *ani* (años), ahora aplicada a *lei*.
  ro.a1.unit07.lesson01.teach.leu_lei_de_rule:
    title: 'Regla: leu → lei, y cuándo añadir de'
    gloss: 'leu → lei · números 2-19: sin *de* · números 20+: con *de*'
    note: Es exactamente el mismo patrón que la regla de *ani* de la Unidad 2 (câți ani ai / am treizeci de ani); si la conoces para un sustantivo, funciona igual con lei.
  ro.a1.unit07.lesson01.teach.scump:
    title: Caro
    gloss: scump (caro)
    note: Una reacción habitual ante un precio que te parece demasiado alto.
    example_gloss: ¿Ocho lei? ¡Caro!
  ro.a1.unit07.lesson01.teach.ieftin:
    title: Barato
    gloss: ieftin (barato)
    note: 'Lo contrario de scump: un buen precio.'
    example_gloss: ¿Un leu? ¡Barato!
  ro.a1.unit07.lesson02.teach.reminder_un_o_si_as_dori_rog:
    title: 'Repaso: un, o, și, aș dori, vă rog, te rog'
    gloss: un/o (un, una) · și (y) · aș dori (quisiera) · vă rog (por favor, formal) · te rog (por favor, informal)
    note: '*Aș dori*, *vă rog* y *te rog* aparecieron por primera vez en la escena de la cafetería de la Unidad 6; aquí vuelven en el mercado.'
  ro.a1.unit07.lesson02.teach.piata:
    title: Mercado
    gloss: piață (mercado)
    note: 'Sustantivo femenino: el mercado, al aire libre o cubierto, donde se compran alimentos frescos.'
    example_gloss: ¿Cuánto cuesta en el mercado?
  ro.a1.unit07.lesson02.teach.rosii:
    title: Tomates
    gloss: roșii (tomates)
    note: Plural de roșie (un tomate); se dice en plural cuando se habla de comprarlos en general.
    example_gloss: Quisiera tomates.
  ro.a1.unit07.lesson02.teach.cartofi:
    title: Patatas
    gloss: cartofi (patatas)
    note: Plural de cartof (una patata), con el mismo patrón que roșii.
    example_gloss: Quisiera patatas.
  ro.a1.unit07.lesson02.teach.kilogram:
    title: Kilogram
    gloss: kilogram (kilogramo)
    note: 'La unidad habitual para comprar productos por peso. *De* lo une con lo que se compra: kilogram *de* roșii, «un kilo de tomates».'
    example_gloss: Un kilo de tomates.
  ro.a1.unit07.lesson02.teach.vreau:
    title: quiero
    gloss: vreau (quiero)
    note: Más sencillo y directo que *aș dori* («quisiera»); ambos sirven en el mercado, vreau es simplemente menos formal.
    example_gloss: Quiero patatas.
  ro.a1.unit07.lesson02.teach.unde_pot_sa_cumpar:
    title: ¿Dónde puedo comprar ...?
    gloss: Unde pot să cumpăr roșii? (¿Dónde puedo comprar tomates?)
    note: Una pregunta útil cuando no sabes dónde comprar; cambia roșii por cualquier otro producto que busques.
  ro.a1.unit07.lesson02.teach.cat_costa_kilogram_rosii:
    title: ¿Cuánto cuesta un kilo de tomates?
    gloss: Cât costă un kilogram de roșii? (¿Cuánto cuesta un kilo de tomates?)
    note: Une Cât costă y la construcción kilogram de ... en una pregunta completa.
  ro.a1.unit07.lesson02.teach.vreau_kilogram_cartofi:
    title: Quiero un kilo de patatas
    gloss: Vreau un kilogram de cartofi. (Quiero un kilo de patatas.)
    note: La misma construcción kilogram de ..., esta vez como afirmación con vreau en lugar de una pregunta.
  ro.a1.unit07.lesson03.teach.reminder_buna_multumesc_la_revedere:
    title: 'Repaso: bună, ziua, mulțumesc, bine, la revedere, Ana, Mihai'
    gloss: bună ziua (buenos días / hola) · mulțumesc (gracias) · bine (bien) · la revedere (adiós) · Ana, Mihai (nombres)
    note: Todo ello ya apareció en los diálogos de la Unidad 1 y de la Unidad 6; aquí Ana y Mihai se encuentran de nuevo, esta vez en el mercado.
  ro.a1.unit07.lesson03.teach.line01:
    title: Saludar y preguntar un precio
    gloss: Ana saluda a Mihai y pregunta el precio de un kilo de tomates.
    note: Combina el Cât costă de esta unidad con el saludo de la Unidad 1.
  ro.a1.unit07.lesson03.teach.line02:
    title: Decir el precio
    gloss: Mihai dice que cuesta ocho lei y reacciona diciendo que es barato.
    note: Reutiliza costă/opt lei/ieftin de esta unidad.
  ro.a1.unit07.lesson03.teach.line03:
    title: Pide con cortesía y añade un producto
    gloss: Ana acepta, pide con cortesía un kilo de tomates y añade que también quiere patatas.
    note: 'Combina aș dori, vă rog y vreau: los dos registros del vocabulario de esta unidad en una sola frase.'
  ro.a1.unit07.lesson03.teach.line04:
    title: Di el segundo precio
    gloss: Mihai dice que un kilo de patatas cuesta cinco lei.
    note: Reutiliza zece (diez) de la Unidad 2, ya repasado en la lesson01 de esta unidad.
  ro.a1.unit07.lesson03.teach.line05:
    title: Da las gracias y despídete
    gloss: Ana da las gracias a Mihai y se despide.
    note: '*Mulțumesc* aquí es un simple agradecimiento de despedida, la misma palabra de *Bine, mulțumesc.* de la Unidad 1.'
  ro.a1.unit07.lesson03.teach.line06:
    title: Cierra el encuentro
    gloss: Mihai se despide también, usando el nombre de Ana.
    note: Es la misma fórmula amable de cierre con la que terminaron los diálogos de las unidades 1, 5 y 6.
