answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching unit01''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Spoken answers are assessed for intelligibility, not written punctuation.
  register: tu and dumneavoastră (and their matching verb forms, ai/aveți) are never interchangeable answers for each other's exercises, the same discipline unit01 established.
course:
  title: Rumano A1
  description: Los números del cero al cien, con los patrones de formación de los números del once al diecinueve (-sprezece) y de las decenas (-zeci), el contraste de género doi/două y el uso de los números para preguntar y decir la edad y el número de teléfono, en continuación de Ana y Mihai de la unidad 1.
units:
  ro.a1.unit02.numbers:
    title: Los números
lessons:
  ro.a1.unit02.lesson01.zero_to_ten:
    title: Números del cero al diez
  ro.a1.unit02.lesson02.eleven_to_hundred:
    title: Los números del once al cien
  ro.a1.unit02.lesson03.age_and_phone:
    title: Edad y número de teléfono
teaching:
  ro.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: cero
    note: '*Zero* no cambia y también se usa para leer un dígito dentro de un número largo o de un número de teléfono.'
    example_gloss: Cero, uno, dos.
  ro.a1.unit02.lesson01.teach.unu:
    title: Uno
    gloss: uno
    note: '*Unu* es la forma que se usa al contar solo. Ante un sustantivo masculino o neutro se acorta a *un* (*un câine*, un perro); ante un sustantivo femenino pasa a ser *o* (*o sută*, cien).'
    example_gloss: Uno, dos, tres.
  ro.a1.unit02.lesson01.teach.doi:
    title: Dos (masculino)
    gloss: dos
    note: '*Doi* se usa con sustantivos masculinos (*doi bărbați*, dos hombres). Los sustantivos femeninos, y los neutros, que en plural se comportan como femeninos, llevan otra forma; mira la tarjeta siguiente.'
    example_gloss: Dos, tres, cuatro.
  ro.a1.unit02.lesson01.teach.doi_doua_gender:
    title: «Dos» cambia según el género
    gloss: doi (masculino) / două (femenino y neutro)
    note: A diferencia del español «dos», que no cambia, el rumano *doi* tiene una forma femenina distinta, *două*, obligatoria con sustantivos femeninos (*două femei*, dos mujeres) y también con los neutros, que son femeninos en plural (*două numere*, dos números). Aparte de uno (*un*/*o*) y dos, los números del *trei* al *zece* son iguales para todos los géneros.
  ro.a1.unit02.lesson01.teach.trei:
    title: Tres
    gloss: tres
    note: '*Trei* no cambia con ningún género.'
    example_gloss: Tres, cuatro, cinco.
  ro.a1.unit02.lesson01.teach.patru:
    title: Cuatro
    gloss: cuatro
    note: '*Patru* no cambia. Fíjate en su forma contraída irregular en los números del catorce al diecinueve: *paisprezece* (14), no *patrusprezece*.'
    example_gloss: Cuatro, cinco, seis.
  ro.a1.unit02.lesson01.teach.cinci:
    title: Cinco
    gloss: cinco
    note: '*Cinci* no cambia.'
    example_gloss: Cinco, seis, siete.
  ro.a1.unit02.lesson01.teach.sase:
    title: Seis
    gloss: seis
    note: '*Șase* no cambia.'
    example_gloss: Seis, siete, ocho.
  ro.a1.unit02.lesson01.teach.sapte:
    title: Siete
    gloss: siete
    note: '*Șapte* es invariable.'
    example_gloss: Siete, ocho, nueve.
  ro.a1.unit02.lesson01.teach.opt:
    title: Ocho
    gloss: ocho
    note: '*Opt* es invariable.'
    example_gloss: Ocho, nueve, diez.
  ro.a1.unit02.lesson01.teach.noua:
    title: Nueve
    gloss: nueve
    note: '*Nouă* es invariable. Sin su diacrítico sería idéntica a *noua* («la nueva», femenino); por eso escribe la *ă*: las respuestas escritas se comprueban con sus diacríticos.'
    example_gloss: Nueve, diez... ¡listo!
  ro.a1.unit02.lesson01.teach.zece:
    title: Diez
    gloss: diez
    note: '*Zece* es invariable y es la base de todos los números del once en adelante (*zece* + *-sprezece*).'
    example_gloss: ¡Diez! ¡Muy bien!
  ro.a1.unit02.lesson02.teach.unsprezece:
    title: Once
    gloss: once
    note: '*Unsprezece* se construye literalmente con *unu* + *spre* + *zece* («uno sobre diez»), el patrón que siguen todos los números del doce al diecinueve.'
    example_gloss: Diez, once, doce.
  ro.a1.unit02.lesson02.teach.teens_pattern:
    title: Del doce al diecinueve
    gloss: doisprezece (12), treisprezece (13), paisprezece (14), cincisprezece (15), șaisprezece (16), șaptesprezece (17), optsprezece (18), nouăsprezece (19)
    note: 'Cada número añade *-sprezece* a la forma normal del dígito: *doi* → *doisprezece*, *trei* → *treisprezece*, y así hasta *nouă* → *nouăsprezece*. Dos son irregulares: el catorce, donde *patru* se acorta en *pai-* (*paisprezece*, no *patrusprezece*), y el dieciséis, donde *șase* pasa a *șai-* (*șaisprezece*, no *șasesprezece*).'
  ro.a1.unit02.lesson02.teach.douazeci:
    title: Veinte
    gloss: veinte
    note: '*Douăzeci* («dos dieces») es una palabra propia y la base de todos los números del 21 al 29.'
    example_gloss: Diecinueve, veinte...
  ro.a1.unit02.lesson02.teach.douazeci_si_unu:
    title: Veintiuno
    gloss: veintiuno
    note: 'A partir del veintiuno, el rumano une la decena y la unidad con *și* («y»): *douăzeci și unu*, *douăzeci și doi*, etc. A diferencia de los números del doce al diecinueve, que se funden en una sola palabra.'
    example_gloss: Veinte, veintiuno, veintidós.
  ro.a1.unit02.lesson02.teach.tens_pattern:
    title: Del treinta al noventa
    gloss: treizeci (30), patruzeci (40), cincizeci (50), șaizeci (60), șaptezeci (70), optzeci (80), nouăzeci (90)
    note: 'Cada decena desde el treinta es el dígito más *-zeci* («dieces»): *trei* → *treizeci*, *patru* → *patruzeci*, etc. El único cambio de ortografía es el sesenta: *șase* pasa a *șai-* y da *șaizeci* (el mismo *șai-* de *șaisprezece*). El 70, el 80 y el 90 siguen el mismo patrón regular.'
  ro.a1.unit02.lesson02.teach.o_suta:
    title: Cien
    gloss: cien
    note: '*O sută* usa *o* (la forma femenina de «un/una») y no *un*, porque *sută* es un sustantivo femenino.'
    example_gloss: Noventa, ¡cien!
  ro.a1.unit02.lesson03.teach.cati_ani_ai:
    title: Preguntar la edad con tú
    gloss: ¿Qué edad tienes?
    note: Literalmente «¿cuántos años tienes?», con *avea* (tener), el mismo esquema que usan el *avoir* del francés y el «tener» del español para la edad, en lugar de «ser». *Câți* (cuántos, masculino) concuerda con *ani* (años, masculino).
  ro.a1.unit02.lesson03.teach.am_nouasprezece_ani:
    title: Di tu edad (menos de veinte)
    gloss: Tengo diecinueve años.
    note: '*Am* es la forma de *eu* del verbo *avea*. No hace falta *de* antes de *ani* con los números menores de veinte.'
  ro.a1.unit02.lesson03.teach.cati_ani_aveti:
    title: Preguntar la edad con usted
    gloss: ¿Qué edad tienes?
    note: '*Aveți* es la forma de *dumneavoastră* del verbo *avea*, acorde con el registro de cortesía presentado en la Unidad 1.'
  ro.a1.unit02.lesson03.teach.am_treizeci_de_ani:
    title: Di tu edad (veinte o más)
    gloss: Tengo treinta años.
    note: Aquí aparece *de* porque *treizeci* es veinte o más; la regla completa está en la tarjeta siguiente.
  ro.a1.unit02.lesson03.teach.de_insertion_rule:
    title: Cuándo añadir de antes de un sustantivo
    gloss: '2-19: sin de (doi ani) / 20 o más: con de (treizeci de ani)'
    note: 'Una regla propia del rumano: los números del 2 al 19 se unen directamente al sustantivo (*doi ani*, dos años; *nouăsprezece ani*, diecinueve años), pero del 20 en adelante se necesita *de* entre el número y el sustantivo (*treizeci de ani*, treinta años; *o sută de ani*, cien años). El uno es un caso aparte (*un an*, un año: singular, sin *de* en ningún caso).'
  ro.a1.unit02.lesson03.teach.care_e_numarul_tau:
    title: Pregunta el número de teléfono de manera informal
    gloss: ¿Cuál es tu número de teléfono?
    note: '*Care* (cuál) es la forma natural de pedir un número concreto que ya existe, no *ce*. *Număr* es un sustantivo neutro; en singular concuerda como un masculino, así que en *numărul tău* el posesivo es *tău*, no *ta*.'
  ro.a1.unit02.lesson03.teach.care_este_numarul_dvs:
    title: Pregunta el número de teléfono de manera formal
    gloss: ¿Cuál es tu número de teléfono?
    note: '*Este* es la forma plena de *e*, más habitual en el habla cuidada o formal. *Dumneavoastră* mantiene el trato cortés, la misma palabra de la Unidad 1.'
  ro.a1.unit02.lesson03.teach.raspuns_telefon:
    title: Di un número de teléfono dígito a dígito
    gloss: 'Es: cero, siete, dos, uno, cuatro, cinco, seis, siete, ocho, nueve.'
    note: En esta unidad se lee dígito a dígito, una convención sencilla como la que usó la Unidad 1 con los registros. Quien llama puede agrupar las cifras de dos en dos, pero los dígitos sueltos siempre se entienden.
