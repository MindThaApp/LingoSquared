answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (vreme, soare, cald, plouă, vânt, frig) is used only in person-invariant impersonal constructions ("Este soare," "Plouă," "Este vânt," "Este frig," "Cum este vremea?") with no register distinction of any kind. No new tu/ dumneavoastră form is introduced this unit; Ana and Mihai keep their existing formal register with each other in the dialogue's greeting/closing lines.
course:
  title: Rumano A1
  description: Cómo describir el tiempo básico en rumano -- Vreme (el tiempo), Soare (sol/soleado), Cald (cálido), Plouă (llueve), Vânt (viento) y Frig (frío) -- mientras Ana y Mihai consultan el pronóstico de mañana y deciden cuándo ir al parque.
units:
  ro.a1.unit19.weather:
    title: El tiempo
lessons:
  ro.a1.unit19.lesson01.vremea_de_azi:
    title: El tiempo de hoy
  ro.a1.unit19.lesson02.vremea_de_maine:
    title: El tiempo de mañana
  ro.a1.unit19.lesson03.planul_de_sambata:
    title: El plan del sábado
teaching:
  ro.a1.unit19.lesson01.teach.reminder_ana_este:
    title: 'Repaso: Ana, Este, Și'
    gloss: Ana (nombre) · Este (es / está) · Și (y)
    note: Ana es el nombre del personaje desde la Unidad 1; *este* viene del contenido de lugares de la Unidad 8; *și* es de la Unidad 5. Esta unidad reutiliza las tres palabras para describir el tiempo de hoy.
  ro.a1.unit19.lesson01.teach.reminder_astazi:
    title: 'Repaso: Astăzi'
    gloss: Astăzi (hoy)
    note: Viene del vocabulario de fechas de la Unidad 3; aquí se reutiliza para hablar del tiempo de hoy.
  ro.a1.unit19.lesson01.teach.vreme_vocab:
    title: El tiempo
    gloss: Vreme (tiempo atmosférico)
    note: '*Vremea* es la forma determinada de *vreme*, «el tiempo»: un sustantivo femenino terminado en -e añade -a, como *baie* → *baia* (el baño) en la Unidad 18.'
    example_gloss:
    - ¿Qué tiempo hace?
  ro.a1.unit19.lesson01.teach.cum_este_vremea_phrase:
    title: ¿Qué tiempo hace?
    gloss: Cum este vremea? (¿Qué tiempo hace?)
    note: La forma habitual de preguntar por el tiempo; *cum* aparece en las Unidades 1, 9 y 12.
  ro.a1.unit19.lesson01.teach.soare_vocab:
    title: Sol / soleado
    gloss: Soare (sol / soleado)
    note: 'Se usa con *este* para describir un día soleado: *Este soare* significa literalmente «es sol», es decir, «hace sol».'
    example_gloss:
    - Hoy hace sol.
  ro.a1.unit19.lesson01.teach.cald_vocab:
    title: Cálido / caluroso
    gloss: Cald (cálido / caluroso)
    note: 'Es una palabra invariable del tiempo: *Este cald* siempre usa esta misma forma, sin concordancia.'
    example_gloss:
    - Hoy hace calor.
  ro.a1.unit19.lesson01.teach.astazi_soare_cald_phrase:
    title: Hoy hace sol. Hace calor.
    gloss: Astăzi este soare. Este cald.
    note: Todas las palabras ya se habían enseñado o se acaban de introducir, y se combinan en dos oraciones nuevas que describen el tiempo de hoy.
  ro.a1.unit19.lesson02.teach.reminder_mihai_maine:
    title: 'Repaso: Mihai, Mâine'
    gloss: Mihai (nombre) · Mâine (mañana)
    note: Mihai es el nombre del personaje desde la Unidad 1; *mâine* viene de las Unidades 3 y 12. Esta unidad reutiliza ambos para describir el pronóstico de mañana.
  ro.a1.unit19.lesson02.teach.reminder_nu_mergem_la_parc:
    title: 'Repaso: Nu, Mergem, La parc'
    gloss: Nu (no) · Mergem (vamos) · La parc (al parque)
    note: Todo viene del vocabulario de la Unidad 11 para negociar planes; aquí se reutiliza para decidir si el tiempo permite ir al parque.
  ro.a1.unit19.lesson02.teach.ploua_vocab:
    title: Está lloviendo
    gloss: Plouă (llueve)
    note: 'Es una forma verbal impersonal: no necesita sujeto, igual que *Este cald* tampoco lo necesita.'
    example_gloss:
    - Mañana llueve.
  ro.a1.unit19.lesson02.teach.vant_vocab:
    title: Viento
    gloss: Vânt (viento)
    note: 'Se usa con *este* igual que *soare*: *Este vânt*, «hace viento».'
    example_gloss:
    - Mañana hace viento.
  ro.a1.unit19.lesson02.teach.frig_vocab:
    title: Frío
    gloss: Frig (frío)
    note: 'Se usa con *este*: *Este frig*, «hace frío».'
    example_gloss:
    - Mañana hace frío.
  ro.a1.unit19.lesson02.teach.maine_ploua_phrase:
    title: Mañana llueve. Hace viento y hace frío.
    gloss: Mâine plouă. Este vânt și este frig.
    note: Todas las palabras ya se habían enseñado o se acaban de introducir, y se combinan en un pronóstico completo para mañana.
  ro.a1.unit19.lesson02.teach.nu_mergem_phrase:
    title: Mañana no vamos al parque.
    gloss: Nu mergem la parc mâine. (Mañana no vamos al parque.)
    note: 'Es el plan según el tiempo al que apunta esta lección: reutiliza *mergem* y *la parc* de la Unidad 11 con *nu* delante.'
  ro.a1.unit19.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Repaso: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (hola) · Ce mai faceți? (¿cómo está usted?) · Bine, mulțumesc (bien, gracias)
    note: Todo viene del saludo inicial de la Unidad 1 y se reutiliza para empezar el diálogo de esta unidad.
  ro.a1.unit19.lesson03.teach.reminder_sambata_la_revedere:
    title: 'Repaso: Sâmbătă, La revedere'
    gloss: Sâmbătă (sábado) · La revedere (adiós)
    note: '*Sâmbătă* viene de las Unidades 3, 11 y 12; *la revedere* es de la Unidad 1. Ambas se reutilizan en el diálogo sobre el plan del fin de semana.'
  ro.a1.unit19.lesson03.teach.line01:
    title: Saluda a Mihai y pregúntale cómo está
    gloss: Ana saluda a Mihai y le pregunta cómo está.
    note: Reutiliza el saludo *Ce mai faceți?* de la Unidad 1.
  ro.a1.unit19.lesson03.teach.line02:
    title: Responde y pregunta por el tiempo de mañana
    gloss: Mihai responde y luego le pregunta a Ana qué tiempo hará mañana.
    note: Combina *Bine, mulțumesc* de la Unidad 1 con la frase de la primera lección de esta unidad, *Cum este vremea?*, añadiendo *mâine*.
  ro.a1.unit19.lesson03.teach.line03:
    title: Describe el pronóstico de mañana
    gloss: Ana le dice que lloverá, y que hará viento y frío.
    note: Reutiliza exactamente la frase de la segunda lección de esta unidad.
  ro.a1.unit19.lesson03.teach.line04:
    title: Propón no ir al parque e ir el sábado
    gloss: Mihai dice que mañana no irán al parque y pregunta si van el sábado.
    note: Combina la frase de la segunda lección de esta unidad con *mergem* de la Unidad 11 y *sâmbătă* de esta unidad.
  ro.a1.unit19.lesson03.teach.line05:
    title: Acepta, señalando que el sábado hará sol
    gloss: Ana dice que el sábado hará sol y acepta el plan.
    note: Combina *soare* con la expresión de acuerdo *Da, bine!* de la Unidad 11.
  ro.a1.unit19.lesson03.teach.line06:
    title: Despídete
    gloss: Mihai se despide.
    note: Es el mismo patrón de cierre con el que terminaron los diálogos de las unidades anteriores.
  ro.a1.unit19.lesson03.teach.line07:
    title: Despídete
    gloss: Ana se despide.
    note: Es el mismo patrón de cierre con el que terminaron los diálogos de las unidades anteriores.
