  ro.a1.unit35.lesson06.teach.andrei_atunci_alerg:
    title: El plan de Andrei
    gloss: 'Andrei: Entonces yo corro. Después también juego al fútbol.'
    note: '*După aceea* significa después; *joc* es la forma de *eu* de *a juca* (jugar).'
  ro.a1.unit35.lesson06.teach.elena_eu_prefer:
    title: El plan de Elena
    gloss: 'Elena: Yo prefiero nadar, pero yo también voy al parque.'
    note: '*Prefer să înot* significa prefiero nadar: *a prefera* + *să* + verbo.'
  ro.a1.unit35.lesson06.teach.ana_super_ne:
