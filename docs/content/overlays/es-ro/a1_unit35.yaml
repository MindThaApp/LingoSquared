    gloss: '*Mesaj* es un sustantivo neutro: *un mesaj* (uno), *două mesaje* (dos). El artículo determinado va al final: *mesajul*.'
    note: Une la palabra nueva con el sustantivo compuesto que ya se enseñó en la unidad del tiempo.
