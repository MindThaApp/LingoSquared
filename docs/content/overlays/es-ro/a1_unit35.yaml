    note: Amplía la fórmula de despedida de la unidad de saludos a un día concreto.
  ro.a1.unit35.lesson05.teach.ana_il_suna:
    title: ¿Quién usa qué?
    gloss: Ana llama a Mihai todos los días. Usa el teléfono, no una aplicación. Mihai no tiene ordenador en casa, pero usa internet en el teléfono. Andrei busca el pronóstico del tiempo cada mañana. Luego va a correr. Elena envía a menudo un mensaje a Ana. ¿Tú también usas el teléfono todos los días?
    note: Compara los hábitos tecnológicos de los cuatro personajes, con la misma forma que la lectura comparativa de la unidad de deportes.
