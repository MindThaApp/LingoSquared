    title: Las terminaciones del verbo cambian según la persona
    gloss: '*A căuta* (buscar) cambia según la persona: *eu caut*, *tu cauți*. *A folosi* funciona igual: *eu folosesc*, *tu folosești*.'
    note: La terminación indica quién hace la acción, así que, igual que en español, en rumano a menudo se omiten *eu* y *tu*.
