teaching:
  ro.a1.unit28.lesson01.teach.a_suna:
    title: Llamar
    gloss: llamar
    note: El infinitivo del verbo para hacer una llamada telefónica.
    example_gloss: Tengo que llamarte.
  ro.a1.unit28.lesson01.teach.te_sun:
    title: Decir que vas a llamar
    gloss: Te llamo.
    note: '*Sun* es la forma de *eu* de *a suna* (llamar); *te* ("te") va antes del verbo, y el rumano usa el presente donde el español usa "voy a llamar" o "llamaré".'
  ro.a1.unit28.lesson01.teach.alo_sunt_ana:
    title: Contestar al teléfono
    gloss: Hola, soy Ana.
    note: '*Alo* es como se contesta el teléfono; *sunt* + nombre dice quién eres, como "soy" en español.'
  ro.a1.unit28.lesson01.teach.alo_sunt_mihai:
    title: Mihai contesta igual
    gloss: Hola, soy Mihai.
    note: Es el mismo patrón *Alo, sunt* + nombre que en *Alo, sunt Ana*.
  ro.a1.unit28.lesson02.teach.cu_cine_vorbesc:
    title: Preguntar quién llama
    gloss: ¿Con quién hablo?
    note: '*Cu cine vorbesc?* (literalmente "¿con quién hablo?") es la forma habitual de preguntar quién es una persona desconocida que llama.'
  ro.a1.unit28.lesson02.teach.vorbiti_cu_ana:
    title: Identificarse de manera formal
    gloss: Está hablando con Ana.
    note: '*Vorbiți cu* + nombre es la respuesta formal: *vorbiți* es la forma de *dumneavoastră* de *a vorbi* (hablar).'
  ro.a1.unit28.lesson03.teach.poti_sa_repeti:
    title: Pedir que repitan
    gloss: ¿Puedes repetirlo?
    note: '*Poți să* ... (¿Puedes ...?) más *repeți* (repites) y *asta* (eso).'
  ro.a1.unit28.lesson03.teach.nu_vorbi_atat:
    title: Pedir a alguien que vaya más despacio
    gloss: No hables tan rápido, por favor.
    note: '*Nu vorbi* ("no hables") es *nu* + la forma de *tu*; *atât de repede* significa "tan rápido".'
  ro.a1.unit28.lesson03.teach.nu_te_aud:
    title: Decir que no oyes bien
    gloss: No te oigo bien.
    note: '*Nu te aud bine*: *aud* es "oigo", *te* ("te") va antes del verbo y *bine* significa "bien".'
  ro.a1.unit28.lesson04.teach.mesajul:
    title: Mensaje de texto
    gloss: el mensaje de texto
    note: '*Mesaj* es masculino en singular y femenino en plural (*un mesaj*, *două mesaje*); el artículo definido se pega al final: *mesajul*.'
    example_gloss: El mensaje es de Ana.
  ro.a1.unit28.lesson04.teach.iti_trimit_un:
    title: Decir que vas a enviar un mensaje
    gloss: Te envío un mensaje.
    note: '*Îți* ("te", "a ti") es un pronombre de dativo que va antes del verbo: *Îți trimit un mesaj*.'
  ro.a1.unit28.lesson04.teach.te_sun_inapoi:
    title: Decir que volverás a llamar
    gloss: Te vuelvo a llamar más tarde.
    note: '*Înapoi* ("de vuelta") va después del verbo: *te sun înapoi* es "te devuelvo la llamada", y *mai târziu* significa "más tarde".'
  ro.a1.unit28.lesson05.teach.mihai_salut_ana:
    title: Lee una conversación por mensajes
    gloss: 'Mihai: Hola, Ana, ¿puedes llamarme? Tengo que contarte algo. Ana: Sí, claro, te devuelvo la llamada en cinco minutos.'
    note: Fíjate en qué pide Mihai, por qué lo pide y cuándo dice Ana que volverá a llamar.
    glosses:
      Salut: hola
      poți: puedes
      suna: llamar
      Trebuie: deber / tener que
      ceva: algo
      spun: decir
      sigur: claro
      sun: llamar
      cinci: cinco
      minute: minutos
      înapoi: de vuelta
  ro.a1.unit28.lesson06.teach.mihai_alo_sunt:
    title: Mihai contesta la llamada
    gloss: 'Mihai: Hola, soy Mihai.'
    note: 'El mismo patrón *Alo, sunt* + nombre de la lección 1, ahora en una llamada real: quien contesta habla primero y dice su nombre.'
  ro.a1.unit28.lesson06.teach.ana_salut_mihai:
    title: Ana se identifica
    gloss: 'Ana: Hola, Mihai, soy Ana. Mihai: ¡Qué bien que llames!'
    note: '*Ce bine că* ... ("qué bien que ...") expresa una reacción positiva ante un hecho; *suni* es la forma de *tu* de *a suna*.'
  ro.a1.unit28.lesson06.teach.ana_cum_a:
    title: Ana pregunta por el turno
    gloss: 'Ana: ¿Cómo fue tu primer turno?'
    note: '*A fost* significa "fue" (pasado de *a fi*). Es un perfect compus, formado como *am mâncat*; mira la nota después de la siguiente línea.'
  ro.a1.unit28.lesson06.teach.mihai_a_mers:
    title: Mihai cuenta la buena noticia
    gloss: 'Mihai: Fue muy bien, mejor de lo que pensaba.'
    note: '*A mers* es el pasado de *a merge* (ir, aquí "salir" o "resultar"); *credeam* significa "yo pensaba" (una forma del pasado de *a crede*).'
  ro.a1.unit28.lesson06.teach.a_fost_a:
    title: 'Formas de pasado: a fost, a mers, credeam'
    gloss: fue → ser, fue → ir, pensaba → creer
    note: '*A fost* y *a mers* son formas del perfect compus (*a* + participio) y *credeam* es un imperfect. Por ahora, memorízalas como frases fijas en los contextos en que aparecen en esta lección; las reglas completas del pasado llegarán en un nivel posterior.'
  ro.a1.unit28.lesson06.teach.ana_ma_bucur:
    title: Ana está orgullosa
    gloss: 'Ana: ¡Me alegra oírlo! Estoy orgullosa de ti.'
    note: '*Mândră de* ("orgullosa de") es una combinación fija; *de* es obligatorio. Un hombre dice *mândru*.'
  ro.a1.unit28.lesson06.teach.mihai_iti_multumesc:
    title: Mihai se emociona
    gloss: 'Mihai: Gracias, significa mucho para mí.'
    note: '*Înseamnă* es la forma de él/ella/ello de *a însemna* (significar); *pentru mine* ("para mí") indica a quién le importa.'
  ro.a1.unit28.lesson06.teach.prima_lui_tura:
    title: Su
    gloss: Su primer turno salió muy bien.
    note: '*Lui* después del sustantivo significa "su" (de él): *prima lui tură*. (Para "de ella" se usa *ei*.)'
