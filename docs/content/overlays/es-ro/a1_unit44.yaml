    title: La construcción *Îmi place*
    gloss: '*Îmi place* + estación dice lo que te gusta: Me gusta el verano.'
    note: '*Îmi place* significa «me resulta agradable», como en español «me gusta»: lo que te gusta va después del verbo y el verbo se queda en *place* cuando es una sola cosa (*Îmi place vara*). La estación lleva el artículo al final de la palabra: *vară* pasa a ser *vara*.'
