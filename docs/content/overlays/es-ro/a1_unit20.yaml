teaching:
  ro.a1.unit20.lesson01.teach.reminder_vreau_un_ce:
    title: 'Repaso: Vreau, Un, Ce'
    gloss: Vreau (quiero) · Un (un/una, masc./neutro) · Ce (qué)
    note: '*Vreau* (quiero), *un* (un/una) y *ce* (qué, como en *Ce mai faceți?*) son palabras que ya conoces; aquí se reutilizan para pedir una prenda de ropa.'
  ro.a1.unit20.lesson01.teach.tricou_vocab:
    title: Camiseta
    gloss: Tricou (camiseta)
    note: 'Es un sustantivo neutro: lleva *un* (no *o*), igual que otros sustantivos neutros o masculinos que ya has visto, como *un leu*.'
    example_gloss:
    - Quiero una camiseta.
  ro.a1.unit20.lesson01.teach.culoare_vocab:
    title: Color
    gloss: Culoare (color)
    note: Es un sustantivo femenino, útil para preguntar de qué color es algo.
    example_gloss:
    - ¿De qué color?
  ro.a1.unit20.lesson01.teach.rosu_vocab:
    title: Rojo
    gloss: Roșu (rojo)
    note: 'Va después del sustantivo al que describe, que es el orden normal del adjetivo en rumano, como en español: *tricou roșu*, literalmente «camiseta roja».'
    example_gloss:
    - Quiero una camiseta roja.
  ro.a1.unit20.lesson01.teach.albastru_vocab:
    title: Azul
    gloss: Albastru (azul)
    note: 'Sigue el mismo patrón que *roșu*: va después del sustantivo, *tricou albastru*.'
    example_gloss:
    - Quiero una camiseta azul.
  ro.a1.unit20.lesson01.teach.vreau_tricou_rosu_phrase:
    title: Quiero una camiseta roja.
    gloss: Vreau un tricou roșu.
    note: 'La petición básica: *vreau* (quiero) + *un tricou* (una camiseta) + *roșu* (rojo), con el color después del sustantivo.'
  ro.a1.unit20.lesson02.teach.reminder_cat_costa_va_rog:
    title: 'Repaso: Cât, Costă, Vă, Rog'
    gloss: Cât costă? (¿Cuánto cuesta?) · Vă rog (por favor, formal)
    note: '*Cât costă?* viene de la lección del mercado; *vă rog* es el «por favor» formal. Aquí se reutilizan para preguntar el precio de una prenda y suavizar la petición.'
  ro.a1.unit20.lesson02.teach.reminder_mic_mica_mare:
    title: 'Repaso: Mic, Mică, Mare'
    gloss: Mic/Mică (pequeño/pequeña, masc.-neutro/fem.) · Mare (grande, misma forma para masculino y femenino singular)
    note: Las palabras de tamaño que ya conoces de comparar comida y bebida; aquí se reutilizan para las tallas de ropa.
  ro.a1.unit20.lesson02.teach.pantaloni_vocab:
    title: Pantalones
    gloss: Pantaloni (pantalones)
    note: 'Como en español, normalmente se usa en plural: *pantaloni* significa un solo pantalón (unos pantalones).'
    example_gloss:
    - Quiero unos pantalones.
  ro.a1.unit20.lesson02.teach.marime_vocab:
    title: Talla
    gloss: Mărime (talla)
    note: 'Es un sustantivo femenino: se combina con la forma femenina *mică* (pequeña), ya repasada arriba, y con *mare* (grande), que no cambia.'
    example_gloss:
    - ¿Qué talla?
  ro.a1.unit20.lesson02.teach.ce_marime_phrase:
    title: ¿Qué talla?
    gloss: Ce mărime? (¿Qué talla?)
    note: 'La pregunta habitual en el mostrador de una tienda: corta y sin verbo, con la misma forma elíptica que *Ce culoare?* (¿De qué color?).'
  ro.a1.unit20.lesson02.teach.marime_mica_va_rog_phrase:
    title: Talla pequeña, por favor.
    gloss: Mărime mică, vă rog.
    note: '*Mică* es la forma femenina de *mic* y concuerda con el femenino *mărime*; se combina con *vă rog*, ya repasado, para indicar tu talla con cortesía.'
  ro.a1.unit20.lesson02.teach.cat_costa_pantalonii_phrase:
    title: ¿Cuánto cuestan los pantalones?
    gloss: Cât costă pantalonii? (¿Cuánto cuestan los pantalones?)
    note: '*Pantalonii* es la forma determinada de *pantaloni* («los pantalones»): los sustantivos masculinos plurales añaden *-i* para expresar «el/la» (*pantaloni* → *pantalonii*). Se combina con *cât costă*, ya repasado.'
  ro.a1.unit20.lesson03.teach.reminder_buna_multumesc_bine_la_revedere_si:
    title: 'Repaso: Bună, Mulțumesc, Bine, La revedere, Și'
    gloss: Bună (hola) · Mulțumesc (gracias) · Bine (bien) · La revedere (adiós) · Și (y)
    note: Saludos cotidianos más *și* (y), que se reutilizan aquí para abrir y cerrar el diálogo en la tienda.
  ro.a1.unit20.lesson03.teach.reminder_zece_douazeci_de_lei:
    title: 'Repaso: Zece, Douăzeci, De, Lei'
    gloss: Zece (diez) · Douăzeci (veinte) · De (de, se usa antes de lei a partir de 20) · Lei (moneda, plural de leu)
    note: Los números y la moneda *leu/lei* que ya conoces; aquí se reutilizan para los precios de la camiseta y los pantalones.
  ro.a1.unit20.lesson03.teach.line01:
    title: Saluda a Mihai y pide una camiseta roja
    gloss: Ana saluda a Mihai y dice que quiere una camiseta roja.
    note: 'La frase para pedir de la primera lección: *Vreau un tricou roșu.*'
  ro.a1.unit20.lesson03.teach.line02:
    title: Pregunta la talla
    gloss: Mihai le pregunta qué talla quiere.
    note: 'La pregunta habitual en la tienda: *Ce mărime?* (¿Qué talla?).'
  ro.a1.unit20.lesson03.teach.line03:
    title: Indica la talla con cortesía y pregunta el precio
    gloss: Ana pide una talla pequeña y luego pregunta cuánto cuesta.
    note: '*Mărime mică, vă rog* (talla pequeña, por favor) y después *Cât costă?* (¿Cuánto cuesta?).'
  ro.a1.unit20.lesson03.teach.line04:
    title: Di el precio
    gloss: Mihai dice que cuesta cincuenta lei.
    note: Usa *cincizeci de lei*, que ya has repasado.
  ro.a1.unit20.lesson03.teach.line05:
    title: Acepta y pregunta también por los pantalones
    gloss: Ana acepta, luego dice que también quiere unos pantalones y pregunta su precio.
    note: 'Aquí *Și* significa «también»: *Vreau și pantaloni* -- «Quiero también unos pantalones».'
  ro.a1.unit20.lesson03.teach.line06:
    title: Di el precio de los pantalones
    gloss: Mihai dice que los pantalones cuestan ciento veinte lei.
    note: 'A partir de veinte, el rumano pone *de* entre el número y el sustantivo: *o sută douăzeci de lei*.'
  ro.a1.unit20.lesson03.teach.line07:
    title: Da las gracias a Mihai y despídete
    gloss: Ana le da las gracias y se despide.
    note: Un agradecimiento y una despedida educados.
  ro.a1.unit20.lesson03.teach.line08:
    title: Despídete
    gloss: Mihai se despide.
    note: Una despedida sencilla, con el nombre de Ana.
