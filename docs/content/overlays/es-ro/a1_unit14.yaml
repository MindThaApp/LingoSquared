answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (mic/mică, mai, decât) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing polite register with each other, matching every earlier unit; no new second-person form is introduced here (unlike unit13's Vă place...?).
course:
  title: Rumano A1
  description: 'Comparar cosas conocidas en rumano: Mare (grande), Mic/Mică (pequeño/pequeña) y la construcción comparativa Mai ... decât (más ... que), mientras Ana y Mihai comparan el tamaño de su café, su té y su pan.'
units:
  ro.a1.unit14.comparisons:
    title: Comparaciones
lessons:
  ro.a1.unit14.lesson01.mare_mic:
    title: Grande, pequeño
  ro.a1.unit14.lesson02.mai_mare_mai_mica:
    title: Más grande, más pequeño
  ro.a1.unit14.lesson03.cafeaua_mai_mare:
    title: ¿Cuál es más grande?
teaching:
  ro.a1.unit14.lesson01.teach.reminder_mare:
    title: 'Repaso: mare'
    gloss: mare (grande)
    note: 'Ya visto en la Unidad 3 (literă mare, letra mayúscula) y en la Unidad 5 (o familie mare, una familia grande); aquí tiene por fin un compañero de comparación: *mic/mică*.'
  ro.a1.unit14.lesson01.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Repaso: cafeaua, ceaiul, pâinea, cafea, ceai'
    gloss: cafeaua (el café) · ceaiul (el té) · pâinea (el pan) · cafea (café) · ceai (té)
    note: 'Todo viene de las Unidades 6 y 13: en esta unidad las formas determinadas son las cosas que se comparan por tamaño, y las formas indeterminadas reaparecen en el ejercicio de emparejar de esta lección.'
  ro.a1.unit14.lesson01.teach.mic_mica_vocab:
    title: Pequeño
    gloss: Mic (pequeño, masc./neutro) · Mică (pequeña, fem.)
    note: 'Los adjetivos rumanos concuerdan con el sustantivo al que describen: *ceai* (té) lleva la forma masculina/neutra *mic*, mientras que *cafea* (café) y *pâine* (pan) son femeninos y llevan *mică*. *Mare* (grande) tiene la misma forma para masculino y femenino en singular, por eso no necesitaba esta distinción.'
    example_gloss:
    - El té es pequeño.
    - El café es pequeño.
  ro.a1.unit14.lesson01.teach.ceaiul_e_mic_phrase:
    title: El té es pequeño
    gloss: Ceaiul e mic. (El té es pequeño.)
    note: '*Ceaiul* es neutro, así que lleva la forma masculina/neutra *mic*.'
  ro.a1.unit14.lesson01.teach.cafeaua_e_mica_phrase:
    title: El café es pequeño
    gloss: Cafeaua e mică. (El café es pequeño.)
    note: '*Cafeaua* es femenino, así que lleva la forma femenina *mică*.'
  ro.a1.unit14.lesson01.teach.painea_e_mica_phrase:
    title: El pan es pequeño
    gloss: Pâinea e mică. (El pan es pequeño.)
    note: '*Pâinea* también es femenino, así que lleva *mică* igual que *cafeaua*.'
  ro.a1.unit14.lesson02.teach.reminder_mare_mic_mica:
    title: 'Repaso: Mare, Mic, Mică'
    gloss: Mare (grande) · Mic (pequeño, masc./neutro) · Mică (pequeña, fem.)
    note: Todo viene de la primera lección de esta unidad; aquí aparecen en forma comparativa.
  ro.a1.unit14.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Repaso: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (el café) · ceaiul (el té) · pâinea (el pan)
    note: Todo viene de la Unidad 13 y se reutiliza aquí como las cosas que se comparan.
  ro.a1.unit14.lesson02.teach.mai_vocab:
    title: Más
    gloss: Mai (más, comparativo)
    note: 'No es el mes *mai* (mayo, Unidad 3). Es la misma palabrita que viste en Ce mai faceți? (Unidad 1), pero aquí cumple otra función como partícula comparativa: se coloca *mai* delante de un adjetivo para decir «más ___», la forma habitual de crear un comparativo en rumano.'
    example_gloss:
    - El café es más grande.
  ro.a1.unit14.lesson02.teach.mai_mare_phrase:
    title: El café es más grande
    gloss: Cafeaua e mai mare. (El café es más grande.)
    note: '*Mai* + el adjetivo; no hace falta ningún otro cambio.'
  ro.a1.unit14.lesson02.teach.decat_vocab:
    title: Que
    gloss: Decât (que, en comparaciones)
    note: 'Completa la comparación: *mai* + adjetivo + *decât* + la segunda cosa comparada.'
    example_gloss:
    - El café es más grande que el té.
  ro.a1.unit14.lesson02.teach.mai_mare_decat_phrase:
    title: El café es más grande que el té
    gloss: Cafeaua e mai mare decât ceaiul. (El café es más grande que el té.)
    note: 'El patrón comparativo completo: [cosa] + e + mai + [adjetivo] + decât + [segunda cosa].'
  ro.a1.unit14.lesson02.teach.mai_mica_decat_phrase:
    title: El pan es más pequeño que el café
    gloss: Pâinea e mai mică decât cafeaua. (El pan es más pequeño que el café.)
    note: El mismo patrón con *mică*, la forma femenina de «pequeño» de la primera lección de esta unidad.
  ro.a1.unit14.lesson03.teach.reminder_mai_decat_mare_mic_mica:
    title: 'Repaso: Mai, Decât, Mare, Mic, Mică'
    gloss: Mai (más) · Decât (que) · Mare (grande) · Mic (pequeño, masc./neutro) · Mică (pequeña, fem.)
    note: Todo viene de las dos primeras lecciones de esta unidad; aquí Ana y Mihai los usan juntos.
  ro.a1.unit14.lesson03.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Repaso: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (el café) · ceaiul (el té) · pâinea (el pan)
    note: 'Todo viene de la Unidad 13: las tres cosas que comparan Ana y Mihai.'
  ro.a1.unit14.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Repaso: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (hola) · mulțumesc (gracias) · la revedere (adiós) · Ana, Mihai (nombres)
    note: 'Todo ya visto en unidades anteriores: el mismo saludo y la misma despedida amables de todos los diálogos de este curso.'
  ro.a1.unit14.lesson03.teach.line01:
    title: Saludar y preguntar por el tamaño
    gloss: Mihai saluda a Ana y le pregunta si el café es grande o pequeño.
    note: Usa *mare sau mică* (grande o pequeña), propio de esta unidad, para abrir una pregunta sobre el tamaño, con la misma estructura «¿X o Y?» para ofrecer una elección que ya vimos con *cafea sau ceai?* en la Unidad 13.
  ro.a1.unit14.lesson03.teach.line02:
    title: Describir el tamaño de las dos bebidas
    gloss: Ana dice que el café es grande y el té es pequeño.
    note: 'Expone un simple hecho sobre el tamaño, no una preferencia: en este diálogo nadie dice qué bebida le gusta o pide, solo lo grande que es cada una.'
  ro.a1.unit14.lesson03.teach.line03:
    title: Preguntar para confirmar la comparación
    gloss: Mihai pregunta si el café es más grande que el té.
    note: Convierte los dos datos sueltos de Ana (línea 2) en una comparación directa con *mai mare decât*, la construcción central de esta unidad.
  ro.a1.unit14.lesson03.teach.line04:
    title: Confirmar y añadir el pan
    gloss: Ana confirma y luego dice que el pan es más pequeño que el café.
    note: 'Reutiliza *mai ... decât* con el tercer elemento, *pâinea*, esta vez con el comparativo de «pequeño»: *mai mică*.'
  ro.a1.unit14.lesson03.teach.line05:
    title: Confirmar, dar las gracias y despedirse
    gloss: Mihai confirma que el pan es pequeño, da las gracias a Ana y se despide.
    note: La misma despedida con la que terminó el diálogo de cada unidad anterior.
  ro.a1.unit14.lesson03.teach.line06:
    title: Cerrar la conversación
    gloss: Ana se despide de Mihai, también diciendo su nombre.
    note: Es la misma fórmula de despedida amistosa con la que terminó el diálogo de cada unidad anterior.
