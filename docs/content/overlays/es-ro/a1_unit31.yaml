answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Rumano A1
  description: 'Rumano para principiantes para describir el aspecto físico básico de una persona: impresiones de estatura y edad, color de pelo y de ojos, la pregunta clave Cum arată ...? y la comparación del aspecto de dos personas.'
units:
  ro.a1.unit31.aspect:
    title: Describir el aspecto
lessons:
  ro.a1.unit31.lesson01.inalt_scund_batran_si:
    title: Alto, bajo, viejo y joven
  ro.a1.unit31.lesson02.descrierea_parului:
    title: Describir el pelo
  ro.a1.unit31.lesson03.ochii_si_cum_arata:
    title: Los ojos y ¿cómo es alguien?
  ro.a1.unit31.lesson04.ana_o_descrie_pe:
    title: Ana describe a Nina
  ro.a1.unit31.lesson05.ii_comparam_pe_andrei:
    title: Comparamos a Andrei y Elena
  ro.a1.unit31.lesson06.mihai_o_recunoaste_pe:
    title: Mihai reconoce a Nina
teaching:
  ro.a1.unit31.lesson01.teach.inalt_scund:
    title: Alto y bajo
    gloss: alto / bajo
    note: '*Înalt* describe a una persona alta y *scund* a una persona baja. Ambos tienen forma femenina: *înaltă*, *scundă*.'
    example_gloss:
    - Elena es alta.
    - Andrei es bajo.
  ro.a1.unit31.lesson01.teach.batran_tanar:
    title: Viejo y joven
    gloss: viejo / joven
    note: '*Bătrân* y *tânăr* describen aquí una impresión general de edad, no un número exacto de años. Formas femeninas: *bătrână*, *tânără*.'
    example_gloss:
    - El abuelo es viejo.
    - Mihai es joven.
  ro.a1.unit31.lesson01.teach.pentru_varsta_exacta:
    title: 'Bătrân: una impresión o un número'
    gloss: Para la edad exacta preguntas Câți ani ai?, mientras que bătrân da una impresión general, como en Bunicul este bătrân.
    note: Puedes preguntar la edad exacta con *Câți ani ai?* Aquí *bătrân* describe qué edad PARECE tener alguien, sin ningún número.
  ro.a1.unit31.lesson01.teach.elena_este_inalta:
    title: Elena es alta y Andrei es bajo
    gloss: Elena es alta y Andrei es bajo.
    note: 'Una oración combinada sencilla con *și* (y), que prepara la comparación directa de la lección 5; el adjetivo concuerda con el sujeto: *înaltă* para Elena, *scund* para Andrei.'
  ro.a1.unit31.lesson02.teach.parul:
    title: El pelo
    gloss: el pelo
    note: '*Păr* es un sustantivo masculino; el artículo se añade al final: *părul* (el pelo).'
    example_gloss: Mihai tiene el pelo corto y negro.
  ro.a1.unit31.lesson02.teach.blond_maro_carunt:
    title: Rubio, castaño y gris
    gloss: rubio / castaño / gris
    note: Tres colores de pelo. Van después del sustantivo *păr* (masculino), así que se dice *părul blond*, *păr maro*, *păr cărunt*.
    example_gloss:
    - Ana tiene el pelo rubio.
    - Andrei tiene el pelo castaño.
    - El abuelo tiene el pelo gris.
  ro.a1.unit31.lesson02.teach.lung_scurt:
    title: Largo y corto (pelo)
    gloss: largo / corto (pelo)
    note: '*Lung* (largo) y *scurt* (corto) describen la longitud del pelo; igual que los colores, van después del sustantivo.'
    example_gloss:
    - Elena tiene el pelo largo.
    - Andrei tiene el pelo corto.
  ro.a1.unit31.lesson02.teach.adjectivul_vine_dupa:
    title: El adjetivo va después del sustantivo
    gloss: 'El adjetivo va después del sustantivo: păr scurt, păr lung, păr blond, păr maro, păr cărunt, păr negru.'
    note: En rumano el adjetivo de color y de longitud va DESPUÉS del sustantivo (*păr scurt*), como en español «pelo corto».
  ro.a1.unit31.lesson02.teach.posesivul_vine_dupa:
    title: «Su» (de él, de ella) va después del sustantivo
    gloss: 'El posesivo va después del sustantivo: părul ei (su pelo, de ella), ochii lui (sus ojos, de él).'
    note: '*Ei* significa «de ella» y *lui* significa «de él»; ambos van después del sustantivo: *părul ei*. El contexto indica de quién se habla.'
  ro.a1.unit31.lesson02.teach.mihai_are_parul:
    title: Mihai tiene el pelo corto y negro
    gloss: Mihai tiene el pelo corto y negro.
    note: '*Negru* (negro) es un adjetivo de color; va después del sustantivo: *păr negru*.'
  ro.a1.unit31.lesson02.teach.ana_are_parul:
    title: Ana tiene el pelo largo y rubio
    gloss: Ana tiene el pelo largo y rubio.
    note: Combina el vocabulario de longitud y de color de esta lección en una frase natural.
  ro.a1.unit31.lesson03.teach.ochii:
    title: Los ojos
    gloss: los ojos
    note: '*Ochi* (ojo/ojos) es igual en singular y plural; el artículo indica el número: *ochiul* (el ojo), *ochii* (los ojos).'
    example_gloss: Mihai tiene los ojos marrones.
  ro.a1.unit31.lesson03.teach.albastru_maro_verde:
    title: Azul, marrón y verde
    gloss: azul / marrón / verde
    note: '*Albastru* (azul), *maro* (marrón) y *verde* (verde) son adjetivos de color. *Maro* nunca cambia; *albastru* pasa a *albaștri* y *verde* a *verzi* en plural.'
    example_gloss:
    - Ana tiene los ojos azules.
    - Andrei tiene los ojos marrones.
    - Elena tiene los ojos verdes.
  ro.a1.unit31.lesson03.teach.la_plural_adjectivul:
    title: Adjetivos en plural
    gloss: 'En plural el adjetivo cambia: ochi albaștri, ochi maro, ochi verzi.'
    note: Con *ochi* en plural, el adjetivo toma la forma plural (*albaștri*, *verzi*); *maro* no cambia. Compara con el singular *păr albastru*.
  ro.a1.unit31.lesson03.teach.cum_arata_ana:
    title: ¿Cómo es Ana físicamente?
    gloss: ¿Cómo es Ana físicamente?
    note: '*Cum arată ...?* es la pregunta clave de esta unidad; úsala para preguntar por el aspecto de cualquier persona.'
  ro.a1.unit31.lesson03.teach.ana_are_parul:
    title: Ana tiene el pelo largo y rubio y los ojos azules
    gloss: Ana tiene el pelo largo y rubio y los ojos azules.
    note: Una respuesta modelo que combina pelo y ojos en una sola oración con *și*.
  ro.a1.unit31.lesson04.teach.ana_vine_o:
    title: Ana presenta a Nina
    gloss: 'Ana: Viene una chica nueva al café de idiomas. Se llama Nina.'
    note: '*Vine o fată nouă* («viene una chica nueva») presenta a alguien nuevo; *O cheamă Nina* indica su nombre.'
  ro.a1.unit31.lesson04.teach.mihai_bine_cum:
    title: Mihai pregunta cómo es ella
    gloss: 'Mihai: ¡Bien! ¿Cómo es?'
    note: 'Retoma la pregunta central de la unidad sin nombre: *Cum arată?* (se sabe de quién se habla por el contexto).'
  ro.a1.unit31.lesson04.teach.ana_este_scunda:
    title: Ana describe la estatura y el pelo de Nina
    gloss: 'Ana: Es bajita y tiene el pelo corto y rubio.'
    note: Combina *scundă* de la lección 1 con el vocabulario del pelo de la lección 2.
  ro.a1.unit31.lesson04.teach.mihai_si_ochii:
    title: Mihai pregunta por sus ojos
    gloss: 'Mihai: ¿Y los ojos?'
    note: '*Și ochii?* («¿Y los ojos?») es una pregunta breve de seguimiento; se sobrentiende de quién se habla por el contexto.'
  ro.a1.unit31.lesson04.teach.ana_are_ochi:
    title: Ana describe los ojos de Nina
    gloss: 'Ana: Tiene los ojos verdes.'
    note: Retoma *ochi verzi* de la lección 3.
  ro.a1.unit31.lesson04.teach.mihai_multumesc_atunci:
    title: Mihai la reconocerá
    gloss: 'Mihai: ¡Gracias! Entonces seguro que la reconozco.'
    note: '*O recunosc* significa «la reconozco»: *o* es el pronombre de objeto «la» y va antes del verbo.'
  ro.a1.unit31.lesson05.teach.andrei_si_elena:
    title: Comparamos a Andrei y Elena
    gloss: Andrei y Elena son hermanos, pero son físicamente diferentes. Andrei es bajo y tiene el pelo corto y castaño y los ojos marrones. Elena es más alta que Andrei y tiene el pelo largo y castaño y los ojos verdes. Y tú, ¿cómo eres?
    note: Una breve comparación que reúne todas las palabras de color y de longitud vistas hasta ahora y termina con la pregunta clave de la unidad dirigida al lector.
    glosses:
      frate: hermano
      soră: hermana
      arată: parecerse
      diferit: diferentes
      scund: bajo
      scurt: bajo
      maro: castaño
      părul: pelo
      ochi: ojos
      înaltă: más alta
      lung: largo
      verzi: verdes
      arăți: aspecto (como en «cómo eres físicamente»)
  ro.a1.unit31.lesson05.teach.comparativul_se_formeaza:
    title: Comparar con mai ... decât
    gloss: 'El comparativo se forma con mai + adjetivo + decât: Elena este mai înaltă decât Andrei.'
    note: 'El rumano pone *mai* («más») delante del adjetivo y *decât* («que») delante de la segunda persona: *mai înaltă decât Andrei*.'
  ro.a1.unit31.lesson05.teach.elena_are_parul:
    title: Elena tiene el pelo más largo que Andrei
    gloss: Elena tiene el pelo más largo que Andrei.
    note: '*Mai lung* funciona igual antes de *decât*: *părul mai lung decât Andrei*; el adjetivo sigue a *părul*.'
  ro.a1.unit31.lesson05.teach.am_parul_scurt:
    title: Tengo el pelo corto y castaño
    gloss: Tengo el pelo corto y castaño.
    note: Una oración modelo en primera persona con *Am ...*, lista para reutilizarla al describir tu propio aspecto.
  ro.a1.unit31.lesson06.teach.mihai_uite_ea:
    title: Mihai ve a Nina
    gloss: 'Mihai: Mira, ¿es esa Nina? Tiene el pelo corto y rubio y los ojos verdes.'
    note: '*Uite* (mira) llama la atención sobre algo; *ea e Nina?* significa «¿es ella Nina?».'
  ro.a1.unit31.lesson06.teach.ana_da_ea:
    title: Ana confirma
    gloss: 'Ana: ¡Sí, es Nina!'
    note: Una confirmación breve y natural.
  ro.a1.unit31.lesson06.teach.nina_salut_tu:
    title: Nina saluda a Mihai
    gloss: 'Nina: Hola, ¿eres Mihai?'
    note: 'Una pregunta de saludo sencilla e informal: *tu ești ...?*'
  ro.a1.unit31.lesson06.teach.mihai_da_ma:
    title: Mihai saluda a Nina
    gloss: 'Mihai: ¡Sí! Encantado de conocerte, Nina.'
    note: '*Mă bucur să te cunosc* («me alegro de conocerte») es la frase habitual en un primer encuentro.'
  ro.a1.unit31.lesson06.teach.nina_si_eu:
    title: Nina responde al saludo
    gloss: 'Nina: ¡Encantada de conocerte también!'
    note: 'Cierra el diálogo: Mihai reconoció a Nina gracias a la descripción de Ana.'
