teaching:
  ro.a1.unit08.lesson01.teach.reminder_unde_este:
    title: 'Repaso: unde, este'
    gloss: unde (dónde) · este (está)
    note: 'Ambas ya aparecieron: *unde* en *Unde pot să cumpăr ...?* de la Unidad 7 y *este* desde las unidades 3 y 4. Aquí se combinan en la pregunta clave de esta unidad para ubicar lugares.'
  ro.a1.unit08.lesson01.teach.unde_este_phrase:
    title: ¿Dónde está...?
    gloss: Unde este...? (¿Dónde está...?)
    note: 'Es la forma habitual de preguntar dónde está algo: añade el nombre del lugar después de *este*, o úsala sola, como aquí, cuando el lugar ya está claro por el contexto.'
  ro.a1.unit08.lesson01.teach.gara_magazin_banca:
    title: Estación de tren, tienda, banco
    gloss: gară (estación de tren) · magazin (tienda) · bancă (banco)
    note: 'Tres lugares comunes. Todos llevan el artículo determinado cuando se habla de uno concreto y conocido: *gara*, *magazinul*, *banca*.'
    example_gloss:
    - ¿Dónde está la estación de tren?
    - La tienda está cerca.
    - El banco está lejos.
  ro.a1.unit08.lesson01.teach.aproape_departe:
    title: Cerca, lejos
    gloss: aproape (cerca) · departe (lejos)
    note: Una forma sencilla de describir lo cerca o lejos que está un lugar, sin dar indicaciones exactas.
    example_gloss:
    - La tienda está cerca.
    - El banco está lejos.
  ro.a1.unit08.lesson01.teach.magazinul_aproape:
    title: La tienda está cerca
    gloss: Magazinul este aproape. (La tienda está cerca.)
    note: 'Una frase corta y completa: no hace falta el nombre del lugar después de *aproape* cuando ya está claro de cuál hablas.'
  ro.a1.unit08.lesson01.teach.banca_departe:
    title: El banco está lejos
    gloss: Banca este departe. (El banco está lejos.)
    note: Lo contrario de *aproape*, con la misma estructura sencilla.
  ro.a1.unit08.lesson01.teach.unde_este_gara:
    title: ¿Dónde está la estación de tren?
    gloss: Unde este gara? (¿Dónde está la estación de tren?)
    note: Une *Unde este...?* y *gara* en una pregunta completa.
  ro.a1.unit08.lesson02.teach.spital_posta_biblioteca_statie:
    title: Hospital, correos, biblioteca, parada de autobús
    gloss: spital (hospital) · poștă (correos) · bibliotecă (biblioteca) · stație de autobuz (parada de autobús)
    note: 'Cuatro lugares comunes más. Como gară/magazin/bancă, llevan el artículo determinado cuando se trata de uno concreto: *spitalul*, *poșta*, *biblioteca*, *stația de autobuz*.'
    example_gloss:
    - El hospital está enfrente de la tienda.
    - Correos está entre la tienda y el hospital.
    - La biblioteca está cerca de la estación de tren.
    - La parada de autobús está al lado de la biblioteca.
  ro.a1.unit08.lesson02.teach.langa_vizavi_intre:
    title: Al lado, enfrente, entre
    gloss: lângă (al lado de) · vizavi de (enfrente de) · între (entre)
    note: Tres formas de situar un lugar respecto a otro. *Vizavi de* lleva *de* y *între* usa *și* para unir con el segundo lugar; *lângă* se une directamente.
    example_gloss:
    - La tienda está al lado de la estación de tren.
    - El hospital está enfrente de la tienda.
    - Correos está entre la tienda y el hospital.
  ro.a1.unit08.lesson02.teach.magazinul_langa_gara:
    title: La tienda está al lado de la estación de tren
    gloss: Magazinul este lângă gară. (La tienda está al lado de la estación de tren.)
    note: '*Lângă* se une directamente al nombre del lugar, sin ninguna palabra añadida.'
  ro.a1.unit08.lesson02.teach.spitalul_vizavi_magazin:
    title: El hospital está enfrente de la tienda
    gloss: Spitalul este vizavi de magazin. (El hospital está enfrente de la tienda.)
    note: '*Vizavi de* lleva *de* antes del segundo lugar.'
  ro.a1.unit08.lesson02.teach.posta_intre:
    title: Correos está entre la tienda y el hospital
    gloss: Poșta este între magazin și spital. (Correos está entre la tienda y el hospital.)
    note: '*Între* nombra dos lugares unidos por *și* (y).'
  ro.a1.unit08.lesson02.teach.statia_langa_biblioteca:
    title: La parada de autobús está al lado de la biblioteca
    gloss: Stația de autobuz este lângă bibliotecă. (La parada de autobús está al lado de la biblioteca.)
    note: Es la misma estructura con *lângă* que la de la tienda y la estación de tren, ahora con la parada de autobús y la biblioteca.
  ro.a1.unit08.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Repaso: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (hola) · mulțumesc (gracias) · la revedere (adiós) · da (sí) · Ana, Mihai (nombres)
    note: 'Todo ya visto en unidades anteriores: aquí Ana y Mihai se encuentran de nuevo, esta vez en el barrio.'
  ro.a1.unit08.lesson03.teach.line01:
    title: Saludar y preguntar dónde está correos
    gloss: Ana saluda a Mihai y le pregunta dónde está correos.
    note: Combina el *Unde este* de esta unidad con el saludo de la Unidad 1.
  ro.a1.unit08.lesson03.teach.line02:
    title: Dar la ubicación
    gloss: Mihai dice que correos está entre la tienda y el hospital.
    note: Reutiliza la construcción *poșta*/*între ... și* de esta unidad.
  ro.a1.unit08.lesson03.teach.line03:
    title: Preguntar por la biblioteca
    gloss: Ana pregunta si la biblioteca está cerca.
    note: Una breve pregunta de seguimiento que reutiliza *este* y *aproape*.
  ro.a1.unit08.lesson03.teach.line04:
    title: Confirmar y añadir más
    gloss: Mihai confirma que la biblioteca está cerca de la estación de tren y añade que la parada de autobús está al lado de la biblioteca.
    note: Combina *aproape de* y *lângă*, dos preposiciones de esta unidad, en una sola frase.
  ro.a1.unit08.lesson03.teach.line05:
    title: Dar las gracias y despedirse
    gloss: Ana da las gracias a Mihai y se despide.
    note: Aquí *Mulțumesc* es un simple agradecimiento de cierre, la misma palabra del *Bine, mulțumesc.* de la Unidad 1.
  ro.a1.unit08.lesson03.teach.line06:
    title: Cerrar el encuentro
    gloss: Mihai se despide a su vez, usando el nombre de Ana.
    note: El mismo patrón de despedida amistosa con el que terminaron los diálogos de las unidades 1, 5, 6 y 7.
