teaching:
  ro.a1.unit29.lesson01.teach.cat_costa_in:
    title: Preguntar el precio total
    gloss: ¿Cuánto cuesta en total?
    note: '*În total* (en total) aclara que quieres el precio total, no el de un solo artículo; *Cât costă?* pregunta «¿cuánto cuesta?».'
  ro.a1.unit29.lesson01.teach.costa_douazeci_si:
    title: Decir el precio total
    gloss: Cuesta cien lei en total.
    note: '*Costă* es la forma de él/ella/ello de *a costa* (costar). Después de un número superior a 19, el rumano añade *de* antes del sustantivo: *o sută de lei*.'
  ro.a1.unit29.lesson02.teach.a_plati_cu:
    title: Pagar con tarjeta o en efectivo
    gloss: pagar con tarjeta, pagar en efectivo
    note: '*A plăti cu cardul* significa pagar con tarjeta y *a plăti în numerar* significa pagar en efectivo; *cu* significa «con» y *în* significa «en».'
    example_gloss:
    - ¿Puedo pagar con tarjeta aquí?
    - Pago en efectivo.
  ro.a1.unit29.lesson02.teach.pot_plati_cu:
    title: Preguntar si se puede pagar con tarjeta
    gloss: ¿Puedo pagar con tarjeta aquí?
    note: '*Pot plăti* (puedo pagar) es *a putea* + un verbo; *aici* (aquí) sitúa la pregunta en el lugar donde estás.'
  ro.a1.unit29.lesson02.teach.doriti_sa_platiti:
    title: Preguntar la forma de pago preferida
    gloss: ¿Quiere pagar en efectivo o con tarjeta?
    note: '*Doriți să plătiți ...?* es la versión formal con *dumneavoastră* que usa un cajero desconocido; con un amigo dirías *Vrei să plătești ...?*'
  ro.a1.unit29.lesson03.teach.nota:
    title: La cuenta
    gloss: la cuenta
    note: 'Es un sustantivo femenino: *o notă*, *nota* (el artículo se une al final).'
    example_gloss: ¿Dividimos la cuenta?
  ro.a1.unit29.lesson03.teach.hai_sa_impartim:
    title: Proponer dividir la cuenta
    gloss: ¿Dividimos la cuenta?
    note: '*Hai să* + un verbo propone hacer algo juntos.'
  ro.a1.unit29.lesson03.teach.pot_plati_separat:
    title: Pedir pagar por separado
    gloss: ¿Puedo pagar por separado?
    note: '*Separat* (por separado) va después de *a plăti*; *Pot plăti separat?* es la petición habitual cuando cada persona paga su parte.'
  ro.a1.unit29.lesson04.teach.restul:
    title: El cambio
    gloss: el cambio
    note: '*Restul* significa literalmente «el resto», que es como el rumano llama al cambio que te devuelven; el artículo se une al final.'
    example_gloss: Aquí tiene su cambio.
  ro.a1.unit29.lesson04.teach.poftiti_restul:
    title: Entregar el cambio
    gloss: Aquí tiene su cambio.
    note: '*Poftiți* es la forma formal con *dumneavoastră* que significa «aquí tiene», acorde con el registro formal en un mostrador.'
  ro.a1.unit29.lesson04.teach.nu_am_nevoie:
    title: Rechazar el cambio
    gloss: No necesito el cambio.
    note: '*A avea nevoie de* (necesitar) lleva *de*: *Nu am nevoie de rest*.'
  ro.a1.unit29.lesson05.teach.treizeci_si_cinci:
    title: Treinta y cinco
    gloss: treinta y cinco
    note: 'El rumano forma los números del 21 al 99 con *și*: *treizeci și cinci* (literalmente «treinta y cinco»), y añade *de* antes del sustantivo: *o sută treizeci și cinci de lei*.'
    example_gloss: Cuesta ciento treinta y cinco lei.
  ro.a1.unit29.lesson05.teach.nota_doua_feluri:
    title: Lee la cuenta de un restaurante
    gloss: 'Cuenta: dos platos principales y dos cafés. Total: ciento treinta y cinco lei. Pagado con tarjeta.'
    note: Fíjate en lo que se pidió, en el total y en cómo se pagó.
    glosses:
      Nota: cuenta
      două: dos
      feluri: platos principales
      cafele: cafés
      Total: total
      '135': ciento treinta y cinco
      lei: lei
      Plătit: pagado
      cardul: tarjeta
  ro.a1.unit29.lesson06.teach.ana_hai_sa:
    title: Ana pide la cuenta
    gloss: 'Ana: ¿Pedimos la cuenta?'
    note: '*A cere* (pedir) lleva *nota* como complemento directo; *Hai să cerem nota?* propone pedirla juntos.'
  ro.a1.unit29.lesson06.teach.mihai_da_buna:
    title: Mihai pregunta el total
    gloss: 'Mihai: Sí, buena idea. ¿Cuánto cuesta en total?'
    note: Retoma la pregunta *Cât costă în total?* de la lección 1.
  ro.a1.unit29.lesson06.teach.ana_sunt_treizeci:
    title: Ana dice el total
    gloss: 'Ana: Son ciento treinta y cinco lei. ¿Dividimos la cuenta?'
    note: '*Împărțim* es la forma de *noi* (nosotros) de *a împărți* (repartir); *nota* se sobrentiende por el contexto.'
  ro.a1.unit29.lesson06.teach.mihai_nu_lasa:
    title: Mihai insiste en pagar
    gloss: 'Mihai: No, deja que pague yo hoy. Me has ayudado muchísimo.'
    note: '*Lasă-mă să* ... (déjame ...) es la forma habitual de ofrecerse a hacer algo; *m-ai ajutat* («me has ayudado») es una forma del pasado.'
  ro.a1.unit29.lesson06.teach.ana_ce_dragut:
    title: Ana se emociona
    gloss: 'Ana: ¡Qué detalle por tu parte! Muchas gracias.'
    note: '*Ce drăguț din partea ta!* (qué amable de tu parte) es un cumplido cálido y frecuente ante un gesto generoso.'
  ro.a1.unit29.lesson06.teach.mihai_pot_plati:
    title: Mihai pregunta si puede pagar con tarjeta
    gloss: 'Mihai: ¿Puedo pagar con tarjeta aquí?'
    note: Retoma la pregunta *Pot plăti cu cardul aici?* de la lección 2, ahora en el restaurante de verdad.
  ro.a1.unit29.lesson06.teach.mihai_plateste_nota:
    title: 'Plătește: la forma de él/ella'
    gloss: Mihai paga la cuenta.
    note: '*Plătește* es la forma de él/ella de *a plăti* (pagar).'
