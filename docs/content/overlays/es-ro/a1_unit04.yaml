answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02/03''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: Rumano A1
  description: 'Cómo preguntar y decir la hora en rumano: horas en punto, y media, y cuarto y menos cuarto, partes del día y cómo preguntar cuándo empieza algo. Continuamos con Ana y Mihai mientras organizan cuándo empieza su clase de rumano.'
units:
  ro.a1.unit04.time:
    title: Decir la hora
lessons:
  ro.a1.unit04.lesson01.ora_fixa_si_jumatate:
    title: En punto y media
  ro.a1.unit04.lesson02.sferturi_si_intrebari:
    title: Un cuarto, y cómo preguntamos la hora
  ro.a1.unit04.lesson03.cand_incepe_cursul:
    title: ¿Cuándo empieza la clase?
teaching:
  ro.a1.unit04.lesson01.teach.este:
    title: 'Repaso: este'
    gloss: es / está
    note: '*Este* ya apareció en la Unidad 2 y la Unidad 3. Siempre es la misma palabra, ya indiques un número, un día, una fecha o, ahora, una hora.'
  ro.a1.unit04.lesson01.teach.ora:
    title: La hora
    gloss: ora (la hora)
    note: 'Sustantivo femenino: *ora* se coloca justo antes de un número para decir la hora del reloj, p. ej. *ora unu* (la una).'
    example_gloss: Es la una.
  ro.a1.unit04.lesson01.teach.ora_unu:
    title: La una
    gloss: la una en punto
    note: 'Literalmente «la hora uno»: primero va ora y después el número.'
  ro.a1.unit04.lesson01.teach.ora_doua:
    title: Las dos en punto
    gloss: las dos en punto
    note: Aquí el número toma su forma femenina, *două*, para concordar con el femenino *ora*; mira la siguiente tarjeta para ver el patrón completo.
  ro.a1.unit04.lesson01.teach.ora_gender_note:
    title: 'Una irregularidad real: unu sigue siendo unu'
    gloss: ora unu (no «ora una») / ora două (no «ora doi»)
    note: 'Los números que tienen forma femenina suelen usarla con un sustantivo femenino (*doi* → *două* con un sustantivo femenino como *ora*), pero *unu* es la excepción al decir la hora: siempre es *ora unu*, nunca *ora una*, aunque *ora* sea femenino.'
  ro.a1.unit04.lesson01.teach.ora_trei:
    title: Las tres en punto
    gloss: las tres en punto
    note: 'Trei no cambia de forma según el género, a diferencia de unu/una o doi/două: una cosa menos que recordar.'
  ro.a1.unit04.lesson01.teach.jumatate:
    title: Mitad
    gloss: jumătate (mitad, media)
    note: 'Se usa con și (y) para decir «y media»: X și jumătate.'
    example_gloss: La una y media.
  ro.a1.unit04.lesson01.teach.ora_unu_jumatate:
    title: La una y media
    gloss: Es la una y media.
    note: 'Literalmente «Es la hora uno y media»: igual que en español, se suma la media a la hora que acaba de pasar.'
  ro.a1.unit04.lesson01.teach.cat_e_ora:
    title: Preguntar la hora
    gloss: ¿Qué hora es?
    note: 'La forma habitual de preguntar la hora: cât (cuánto, pariente de câți de la Unidad 2) + este + ora (la hora).'
  ro.a1.unit04.lesson02.teach.sfert:
    title: Un cuarto
    gloss: un sfert (un cuarto)
    note: 'Un cuarto de hora: 15 minutos. Se combina con și (y) o fără (sin) para marcar «y cuarto» o «menos cuarto».'
    example_gloss: Es la una y cuarto.
  ro.a1.unit04.lesson02.teach.sfert_rule:
    title: și frente a fără con un cuarto o una media
    gloss: și un sfert = +15 minutos · fără un sfert = −15 minutos
    note: '*Și* (y) suma minutos a la hora que acaba de pasar; *fără* (sin) cuenta los minutos que faltan para la hora que viene, igual que en español «y cuarto» frente a «menos cuarto».'
  ro.a1.unit04.lesson02.teach.ora_doua_sfert:
    title: Las dos y cuarto
    gloss: Son las dos y cuarto.
    note: Ora două (2:00) más și un sfert (+15 minutos) = 2:15.
  ro.a1.unit04.lesson02.teach.fara:
    title: Sin / menos
    gloss: fără (sin, menos)
    note: Cuenta los minutos que faltan para la hora SIGUIENTE, igual que «menos» en «las tres menos cuarto».
    example_gloss: Son las tres menos cuarto.
  ro.a1.unit04.lesson02.teach.ora_trei_fara_sfert:
    title: Las tres menos cuarto
    gloss: Son las tres menos cuarto.
    note: 'Ora trei (3:00) menos fără un sfert (−15 minutos) = 2:45: el rumano nombra la hora hacia la que se cuenta, no la que acaba de pasar.'
  ro.a1.unit04.lesson02.teach.la_ce_ora:
    title: Preguntar a qué hora
    gloss: ¿A qué hora?
    note: 'La (a) + ce (qué) + oră (una hora, forma indefinida aquí en lugar de ora): la forma habitual de preguntar cuándo ocurre algo.'
  ro.a1.unit04.lesson02.teach.la_ora_noua:
    title: Decir cuándo ocurre algo
    gloss: A las nueve en punto.
    note: 'La (a) + ora (la hora, forma determinada aquí) + el número: el patrón de respuesta a «La ce oră?».'
  ro.a1.unit04.lesson02.teach.tarziu:
    title: Tarde
    gloss: târziu (tarde)
    note: Una palabra de reacción común y útil al mirar la hora.
    example_gloss: ¡Es tarde!
  ro.a1.unit04.lesson03.teach.cand:
    title: 'Repaso: când'
    gloss: ¿cuándo?
    note: Când ya apareció en la Unidad 3 para preguntar cuándo es un evento; aquí vuelve para preguntar cuándo empieza algo.
  ro.a1.unit04.lesson03.teach.zi_parts:
    title: Partes del día
    gloss: dimineața (la mañana) / după-amiaza (la tarde) / seara (el atardecer, la noche) / noaptea (la noche)
    note: 'Cada una es la forma determinada del sustantivo usada como adverbio: el rumano dice «por la mañana» de forma simple, sin preposición adicional.'
    example_gloss:
    - La clase es por la mañana.
    - La clase es por la tarde.
    - Mihai trabaja por la noche.
    - Ana duerme de noche.
  ro.a1.unit04.lesson03.teach.cursul:
    title: La clase
    gloss: cursul (la clase / el curso)
    note: La forma determinada de curs (una clase o un curso); aquí, la clase de rumano de Ana y Mihai.
    example_gloss: La clase empieza a las nueve.
  ro.a1.unit04.lesson03.teach.incepe:
    title: Empieza
    gloss: începe (empieza / comienza)
    note: 'La forma del presente para él, ella o ello: cualquier sujeto singular que no sea yo o tú, como cursul (la clase).'
    example_gloss: La clase empieza por la mañana.
  ro.a1.unit04.lesson03.teach.cand_incepe_cursul:
    title: Preguntar cuándo empieza la clase
    gloss: ¿Cuándo empieza la clase?
    note: Reúne când con începe y cursul, novedades de esta lección.
  ro.a1.unit04.lesson03.teach.raspuns_curs:
    title: Decir cuándo empieza la clase
    gloss: La clase empieza a las nueve, por la mañana.
    note: Un complemento de tiempo (dimineața) añadido al final, separado por una coma, igual que la Unidad 3 añadía una fecha tras un día de la semana.
  ro.a1.unit04.lesson03.teach.line01:
    title: Preguntar cuándo empieza la clase
    gloss: Ana le pregunta a Mihai cuándo empieza la clase.
    note: 'Una pregunta sencilla y de registro neutro: este y începe no cambian con tu o dumneavoastră.'
  ro.a1.unit04.lesson03.teach.line02:
    title: Decir la hora
    gloss: Mihai dice que la clase empieza a las nueve de la mañana.
    note: Mihai reutiliza exactamente el patrón de hora y parte del día de esta lección.
  ro.a1.unit04.lesson03.teach.line03:
    title: Agradecer y despedirse
    gloss: Ana le da las gracias y se despide.
    note: La revedere, que se vio en la Unidad 1, cierra el intercambio como siempre.
  ro.a1.unit04.lesson03.teach.line04:
    title: Cerrar el encuentro
    gloss: Mihai se despide también, usando el nombre de Ana.
    note: Repetir la revedere con el nombre de la otra persona es una forma natural y amable de despedirse.
