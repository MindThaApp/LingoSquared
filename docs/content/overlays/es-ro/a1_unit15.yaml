answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (tren, pleacă, bilet, peron, București, Drum bun) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing formal register with each other; no new tu/dumneavoastră form is introduced this unit.
course:
  title: Rumano A1
  description: 'Cómo desenvolverse en un viaje básico en tren en rumano: Tren (tren), Bilet (billete), Peron (andén) y Pleacă (sale/parte), mientras Mihai toma un tren a București y Ana lo despide en la gară.'
units:
  ro.a1.unit15.travel:
    title: De viaje
lessons:
  ro.a1.unit15.lesson01.trenul_pleaca:
    title: El tren sale
  ro.a1.unit15.lesson02.un_bilet_va_rog:
    title: Un billete, por favor
  ro.a1.unit15.lesson03.la_gara:
    title: En la estación de tren
teaching:
  ro.a1.unit15.lesson01.teach.reminder_gara_ora:
    title: 'Repaso: gară, este, la, ce, oră, ora, nouă'
    gloss: gară (estación de tren) · este (es/está) · la (a/en) · ce (qué) · oră (hora) · ora (la hora) · nouă (nueve)
    note: 'Gară viene de las unidades 8 y 9; este, la, ce, oră, ora y nouă son de la unidad 4 (la hora). Esta unidad reutiliza el patrón «la ce oră»/«la ora nouă» de la unidad 4 con otro fin: preguntar por un tren en lugar de por una clase.'
  ro.a1.unit15.lesson01.teach.tren_vocab:
    title: Tren
    gloss: Tren (tren)
    note: 'Neutro y terminado en consonante (en singular, los sustantivos neutros se comportan como los masculinos: *un tren*). Toma *-ul* para «el tren», igual que *magazin*->*magazinul*; los sustantivos en *-ă* como *gară* toman *-a* (*gara*).'
    example_gloss:
    - El tren está en la estación.
  ro.a1.unit15.lesson01.teach.pleaca_vocab:
    title: Sale / parte
    gloss: Pleacă (sale / parte, él/ella)
    note: 'El verbo para cuando un tren, un autobús o un avión se va. *Trenul pleacă*: no hace falta *este*, porque *pleacă* ya es un verbo completo.'
    example_gloss:
    - El tren sale.
  ro.a1.unit15.lesson01.teach.trenul_pleaca_ora_noua_phrase:
    title: El tren sale a las nueve
    gloss: Trenul pleacă la ora nouă. (El tren sale a las nueve.)
    note: Combina *trenul* + *pleacă* con el *la ora nouă* de la unidad 4; no se necesita vocabulario nuevo de la hora.
  ro.a1.unit15.lesson01.teach.la_ce_ora_pleaca_trenul_phrase:
    title: ¿A qué hora sale el tren?
    gloss: La ce oră pleacă trenul? (¿A qué hora sale el tren?)
    note: La pregunta *La ce oră...?* de la unidad 4, ahora sobre *trenul* en lugar de una clase.
  ro.a1.unit15.lesson01.teach.peron_vocab:
    title: Andén
    gloss: Peron (andén)
    note: El andén de una estación de tren. Es neutro y termina en consonante, así que «el andén» es *peronul*, con el mismo *-ul* de *tren*->*trenul*.
    example_gloss:
    - El tren está en el andén tres.
  ro.a1.unit15.lesson01.teach.de_la_ce_peron_phrase:
    title: ¿De qué andén sale el tren?
    gloss: De la ce peron pleacă trenul? (¿De qué andén sale el tren?)
    note: '*De la* (desde) + *ce peron* (qué andén): todas las palabras ya se habían enseñado y aquí se combinan en una pregunta nueva.'
  ro.a1.unit15.lesson02.teach.reminder_as_dori_va_rog_cat_costa:
    title: 'Repaso: aș dori, vă rog, cât costă, costă, lei'
    gloss: aș dori (quisiera) · vă rog (por favor, formal) · cât costă (cuánto cuesta) · costă (cuesta) · lei (lei, moneda)
    note: 'Todo viene de la unidad 6 (comida) y la unidad 7 (compras): esta unidad reutiliza las mismas peticiones corteses y el lenguaje de precios para comprar un billete de tren en lugar de comida.'
  ro.a1.unit15.lesson02.teach.bilet_vocab:
    title: Billete
    gloss: Bilet (billete)
    note: Un billete de tren. Es neutro (en singular lleva *un*, como un sustantivo masculino), así que «un billete» es *un bilet*.
    example_gloss:
    - Tengo un billete.
  ro.a1.unit15.lesson02.teach.bucuresti_vocab:
    title: Bucarest
    gloss: București (Bucarest)
    note: La capital de Rumanía, el destino de ejemplo natural en este curso.
    example_gloss:
    - El tren sale para Bucarest.
  ro.a1.unit15.lesson02.teach.as_dori_bilet_bucuresti_phrase:
    title: Quisiera un billete para Bucarest, por favor
    gloss: Aș dori un bilet la București, vă rog. (Quisiera un billete para Bucarest, por favor.)
    note: La fórmula de cortesía *Aș dori... vă rog* de las unidades 6 y 7, ahora para pedir un billete en lugar de comida.
  ro.a1.unit15.lesson02.teach.cat_costa_bilet_bucuresti_phrase:
    title: ¿Cuánto cuesta un billete a Bucarest?
    gloss: Cât costă un bilet la București? (¿Cuánto cuesta un billete a Bucarest?)
    note: La pregunta de precio *Cât costă...?* de la unidad 7, ahora sobre un billete en lugar de un kilo de patatas.
  ro.a1.unit15.lesson02.teach.costa_zece_lei_phrase:
    title: Cuesta cuarenta lei
    gloss: Costă patruzeci de lei. (Cuesta cuarenta lei.)
    note: Con los números del 2 al 19 no se necesita *de* antes de *lei*; patruzeci (cuarenta) sí lo lleva, porque supera el 19. Es la regla que ya se vio en la unidad 7.
  ro.a1.unit15.lesson03.teach.reminder_travel_words:
    title: 'Repaso: tren, pleacă, peron, bilet, București, trei, am'
    gloss: tren (tren) · pleacă (sale/parte) · peron (andén) · bilet (billete) · București (Bucarest) · trei (tres, de la unidad 2) · am (tengo, de la unidad 2)
    note: Tren, pleacă, peron, bilet y București son de las lecciones 1 y 2 de esta unidad; trei y am se repasan aquí desde la unidad 2 (números), porque Ana y Mihai usan ahora «peronul trei» y «am un bilet» juntos en la estación.
  ro.a1.unit15.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Repaso: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (hola) · mulțumesc (gracias) · la revedere (adiós) · Ana, Mihai (nombres)
    note: 'Todo ya visto en unidades anteriores: el mismo inicio y cierre amistoso que han tenido todos los diálogos de este curso.'
  ro.a1.unit15.lesson03.teach.drum_bun_vocab:
    title: Buen viaje
    gloss: Drum bun (Buen viaje)
    note: Una fórmula fija de despedida para quien está a punto de viajar. Literalmente significa «buen camino» y se usa como el español «buen viaje».
    example_gloss:
    - ¡Buen viaje, Mihai!
  ro.a1.unit15.lesson03.teach.line01:
    title: Saludar y preguntar por el tren
    gloss: Ana saluda a Mihai y le pregunta a qué hora sale el tren.
    note: Reutiliza la pregunta de la lección 1 de esta unidad, ahora dirigida directamente a Mihai.
  ro.a1.unit15.lesson03.teach.line02:
    title: Indica la hora de salida
    gloss: Mihai dice que el tren sale a las nueve.
    note: Reutiliza exactamente una frase de la lección 1 de esta unidad.
  ro.a1.unit15.lesson03.teach.line03:
    title: Pregunta por el andén
    gloss: Ana pregunta de qué andén.
    note: 'Una pregunta breve de seguimiento: *de la ce peron* ya se preguntó completa en la lección 1; aquí Ana la formula brevemente y espera que Mihai complete el resto.'
  ro.a1.unit15.lesson03.teach.line04:
    title: Indica el andén y el billete
    gloss: Mihai dice que es el andén tres y que tiene un billete a Bucarest.
    note: 'Combina en una sola respuesta el vocabulario de esta unidad: peron, bilet y București.'
  ro.a1.unit15.lesson03.teach.line05:
    title: Desea buen viaje y despídete
    gloss: Ana le desea buen viaje a Mihai y se despide.
    note: 'Usa el *Drum bun* de esta lección: una despedida propia de los viajes, en lugar de *la revedere* solo, como en el resto del curso.'
  ro.a1.unit15.lesson03.teach.line06:
    title: Dale las gracias y despídete
    gloss: Mihai le da las gracias a Ana y se despide.
    note: El mismo cierre con el que terminaron los diálogos de todas las unidades anteriores.
