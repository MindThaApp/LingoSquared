answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (doare, cap, stomac, simt, bolnav, nevoie, doctor, odihnă, multă) is used only in fixed first-person (Mihai's own "Nu mă simt bine"/"Sunt bolnav") or already-established formal ("Aveți nevoie de...?") forms. No informal-tu form is introduced this unit; Ana and Mihai keep their existing formal register with each other.
course:
  title: Rumano A1
  description: 'Cómo expresar un problema de salud básico en rumano: Doare (duele), Bolnav (enfermo) y Doctor (médico), mientras Mihai se siente mal y Ana se interesa por él y le aconseja.'
units:
  ro.a1.unit16.health:
    title: La salud
lessons:
  ro.a1.unit16.lesson01.ma_doare_capul:
    title: Me duele la cabeza
  ro.a1.unit16.lesson02.nu_ma_simt_bine:
    title: No me siento bien
  ro.a1.unit16.lesson03.mihai_este_bolnav:
    title: Mihai está enfermo
teaching:
  ro.a1.unit16.lesson01.teach.reminder_ma_va_ce_sau:
    title: 'Repaso: mă, vă, ce, sau'
    gloss: mă (me) · vă (le/usted) · ce (qué) · sau (o)
    note: 'Mă viene de las unidades 1 y 10 (mă numesc, mă trezesc); vă, de las unidades 1, 6, 7 y 13 (vă rog); ce, de las unidades 1, 3, 4 y 15; sau, de la unidad 13. Esta unidad reutiliza las cuatro con un nuevo fin: hablar de lo que duele.'
  ro.a1.unit16.lesson01.teach.doare_vocab:
    title: Duele
    gloss: Doare (duele)
    note: 'Verbo impersonal: en rumano se dice «me duele» (*mă doare*) y *Mă doare* solo significa «me duele (algo)». Añade la parte del cuerpo para decir qué duele: *Mă doare capul*.'
    example_gloss:
    - Duele.
  ro.a1.unit16.lesson01.teach.cap_vocab:
    title: Cabeza
    gloss: Cap (cabeza)
    note: 'Neutro y terminado en consonante: toma *-ul* para decir «la cabeza», la misma terminación que *tren*->*trenul* y *peron*->*peronul*.'
    example_gloss:
    - Me duele la cabeza.
  ro.a1.unit16.lesson01.teach.ce_va_doare_phrase:
    title: ¿Qué le duele?
    gloss: Ce vă doare? (¿Qué le duele?)
    note: '*Ce* (qué) + *vă* (le, trato formal) + *doare*: todas las palabras ya se habían visto o acaban de presentarse, combinadas en una pregunta nueva.'
  ro.a1.unit16.lesson01.teach.stomac_vocab:
    title: Estómago
    gloss: Stomac (estómago)
    note: Neutro y terminado en consonante, así que «el estómago» es *stomacul*, con la misma terminación *-ul* que *cap*->*capul*.
    example_gloss:
    - Me duele el estómago.
  ro.a1.unit16.lesson01.teach.ma_doare_capul_sau_stomacul_phrase:
    title: ¿Le duele la cabeza o el estómago?
    gloss: Vă doare capul sau stomacul? (¿Le duele la cabeza o el estómago?)
    note: '*Vă* (le, trato formal) en lugar de *mă* convierte la afirmación en una pregunta sobre la otra persona; *sau* (o, de la unidad 13) une las dos partes del cuerpo recién aprendidas.'
  ro.a1.unit16.lesson02.teach.reminder_nu_bine_am_un_de:
    title: 'Repaso: nu, bine, am, un, de'
    gloss: nu (no) · bine (bien) · am (tengo) · un (un, masculino/neutro) · de (de)
    note: Nu y bine vienen de las unidades 1, 6 y 11; am, de las unidades 2, 5 y 15; un y de, de las unidades 6, 7 y 15. Esta unidad reutiliza las cinco para hablar de no sentirse bien y de necesitar un médico.
  ro.a1.unit16.lesson02.teach.ma_simt_vocab:
    title: me siento
    gloss: Mă simt (me siento)
    note: 'Verbo reflexivo, literalmente «me siento a mí mismo»: el mismo patrón *mă* + verbo que *mă trezesc*/*mă culc* de la unidad 10.'
    example_gloss:
    - Me siento bien.
  ro.a1.unit16.lesson02.teach.nu_ma_simt_bine_phrase:
    title: No me siento bien
    gloss: Nu mă simt bine. (No me siento bien.)
    note: '*Nu* niega *mă simt bine*: la forma natural de decir que algo va mal sin nombrar todavía un síntoma concreto.'
  ro.a1.unit16.lesson02.teach.bolnav_vocab:
    title: Enfermo
    gloss: Bolnav (enfermo, masculino)
    note: Forma masculina del adjetivo, como la dice Mihai (*Sunt bolnav*). Una mujer dice *Sunt bolnavă* (la forma femenina).
    example_gloss:
    - Estoy enfermo.
  ro.a1.unit16.lesson02.teach.am_nevoie_de_un_doctor_phrase:
    title: Necesito un médico
    gloss: Am nevoie de un doctor. (Necesito un médico.)
    note: '*Am nevoie de* (necesito, literalmente «tengo necesidad de») + *un doctor*: una expresión fija, útil para pedir ayuda con cualquier cosa, no solo con médicos.'
  ro.a1.unit16.lesson02.teach.doctor_vocab:
    title: Doctor
    gloss: Doctor (médico)
    note: Masculino, así que «un médico» es *un doctor*.
    example_gloss:
    - Necesito un médico.
  ro.a1.unit16.lesson03.teach.reminder_ce_mai_faceti_aveti_da:
    title: 'Repaso: Ce mai faceți?, Aveți, Da'
    gloss: Ce mai faceți? (¿Cómo está usted?) · Aveți (usted tiene) · Da (sí)
    note: Ce mai faceți viene de la unidad 1; Aveți, de la unidad 5; Da, de las unidades 6 y 11. Todas se reutilizan en el diálogo de esta unidad.
  ro.a1.unit16.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Repaso: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (hola) · mulțumesc (gracias) · la revedere (adiós) · Ana, Mihai (nombres)
    note: 'Todo ello ya se vio en unidades anteriores: el mismo saludo y la misma despedida amistosos que han usado todos los diálogos de este curso.'
  ro.a1.unit16.lesson03.teach.reminder_spitalul_vizavi_magazin:
    title: 'Repaso: Spitalul este vizavi de magazin'
    gloss: Spitalul este vizavi de magazin. (El hospital está enfrente de la tienda.)
    note: 'Se retoma directamente de la unidad 8: la ubicación del hospital no ha cambiado, y la nota de lectura de esta unidad remite a ella.'
  ro.a1.unit16.lesson03.teach.odihna_vocab:
    title: Descanso
    gloss: Descanso
    note: 'Un sustantivo femenino: lo que te recomienda un médico (o un amigo) cuando no te encuentras bien.'
    example_gloss:
    - Necesitas descanso.
  ro.a1.unit16.lesson03.teach.multa_apa_vocab:
    title: Mucha agua
    gloss: Mucha agua
    note: '*Multă* (mucha, femenino) concuerda con el sustantivo femenino *apă* (agua, de la Unidad 6). Es una combinación fija, el tipo de consejo que daría un médico.'
    example_gloss:
    - Descanso y mucha agua.
  ro.a1.unit16.lesson03.teach.line01:
    title: Saluda y pregunta cómo está
    gloss: Ana saluda a Mihai y le pregunta cómo está.
    note: Retoma el saludo *Ce mai faceți?* de la Unidad 1.
  ro.a1.unit16.lesson03.teach.line02:
    title: Di que no te sientes bien
    gloss: Mihai dice que no se siente bien y que le duele la cabeza.
    note: Combina la frase de la lección 2 y la de la lección 1 de esta unidad.
  ro.a1.unit16.lesson03.teach.line03:
    title: Pregunta si necesita un médico
    gloss: Ana le pregunta si necesita un médico.
    note: Retoma como pregunta la frase de la lección 2 de esta unidad, con *aveți* de la Unidad 5.
  ro.a1.unit16.lesson03.teach.line04:
    title: Confirma que estás enfermo y necesitas un médico
    gloss: Mihai dice que sí, que está enfermo y que necesita un médico.
    note: Combina *sunt bolnav* y *am nevoie de un doctor* de esta unidad.
  ro.a1.unit16.lesson03.teach.line05:
    title: Da un consejo y despídete
    gloss: Ana le dice que descanse y beba mucha agua, y se despide.
    note: 'Usa *Odihnă și multă apă* de esta lección: un consejo de salud en lugar de la simple despedida habitual del curso.'
  ro.a1.unit16.lesson03.teach.line06:
    title: Dale las gracias y despídete
    gloss: Mihai da las gracias a Ana y se despide.
    note: El mismo cierre con el que terminaron los diálogos de todas las unidades anteriores.
