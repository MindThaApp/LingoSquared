teaching:
  ro.a1.unit32.lesson01.teach.animalul_un_animal:
    title: Animal, mascota
    gloss: el animal / una mascota
    note: '*Animal* es la palabra general; *animal de companie* («animal de compañía») significa concretamente mascota. El plural es *animale* (*un animal*, *două animale*).'
    example_gloss:
    - Un perro es un animal.
    - Un perro también es una mascota.
  ro.a1.unit32.lesson01.teach.cainele_pisica:
    title: Perro y gato
    gloss: el perro / el gato
    example_gloss:
    - Ana tiene un perro.
    - Andrei tiene un gato.
  ro.a1.unit32.lesson01.teach.pestele_pasarea:
    title: Pez y pájaro
    gloss: el pez / el pájaro
    example_gloss:
    - El abuelo tiene un pez.
    - Nina tiene un pájaro.
  ro.a1.unit32.lesson01.teach.ai_un_animal:
    title: ¿Tienes una mascota?
    gloss: ¿Tienes una mascota?
    note: 'El mismo patrón de pregunta *Ai ...?* que ya conoces: *a avea* (tener) + un sustantivo.'
  ro.a1.unit32.lesson01.teach.da_am_un:
    title: Sí, tengo un perro
    gloss: Sí, tengo un perro.
    note: Una respuesta afirmativa sencilla con el vocabulario nuevo de esta unidad.
  ro.a1.unit32.lesson01.teach.nu_nu_am:
    title: No, no tengo mascota
    gloss: No, no tengo mascota.
    note: Después de *nu am*, *niciun* («ni un solo») niega el sustantivo; consulta la nota de gramática.
  ro.a1.unit32.lesson01.teach.la_negatie_nu:
    title: 'Nu am: sin artículo'
    gloss: 'Después de nu am no se usa un ni o: Nu am timp, nu am niciun animal de companie.'
    note: 'Retoma el mismo patrón ya enseñado en *Nu am timp*: no es gramática nueva, solo un sustantivo nuevo al que aplicarlo.'
  ro.a1.unit32.lesson02.teach.a_scoate_la:
    title: Pasear (a un animal)
    gloss: pasear (a un animal)
    note: '*A scoate la plimbare* es una expresión fija; consulta la nota de gramática.'
    example_gloss: Paseo al perro todos los días.
  ro.a1.unit32.lesson02.teach.verbul_se_schimba:
    title: El verbo cambia según la persona
    gloss: 'El verbo cambia según la persona: eu scot, tu scoți, el scoate (saco, sacas, saca) al perro a pasear.'
    note: 'Los verbos rumanos cambian su terminación en cada persona, así que *a scoate la plimbare* se conjuga como un solo verbo: *scot*, *scoți*, *scoate*.'
  ro.a1.unit32.lesson02.teach.a_da_de:
    title: Dar de comer
    gloss: dar de comer
    example_gloss: Le doy de comer al gato todos los días.
  ro.a1.unit32.lesson02.teach.a_se_juca:
    title: Jugar con
    gloss: jugar con
    example_gloss: Andrei juega con su gato.
  ro.a1.unit32.lesson02.teach.scot_cainele_la:
    title: Paseo al perro todos los días
    gloss: Paseo al perro todos los días.
    note: Combina *a scoate la plimbare* con *în fiecare zi* (todos los días), ya conocido de una unidad anterior.
  ro.a1.unit32.lesson02.teach.dau_de_mancare:
    title: Le doy de comer al gato todos los días
    gloss: Le doy de comer al gato todos los días.
    note: 'Combina *a da de mâncare* con *în fiecare zi*; el animal va en dativo: *pisicii*.'
  ro.a1.unit32.lesson03.teach.plural_caine_caini:
    title: 'Plural: câine → câini'
    gloss: 'Plural: câine → câini, animal → animale, pisică → pisici.'
    note: El patrón regular del plural en rumano, presentado aquí por primera vez con sustantivos de animales como ejemplo.
  ro.a1.unit32.lesson03.teach.caini_pisici:
    title: Perros y gatos
    gloss: perros / gatos
    example_gloss:
    - Mihai ama a los perros.
    - Elena ama a los gatos.
  ro.a1.unit32.lesson03.teach.pesti_pasari:
    title: Peces y pájaros (plural)
    gloss: peces / pájaros
    example_gloss:
    - Adoro los peces.
    - El abuelo adora los pájaros.
  ro.a1.unit32.lesson03.teach.iubesc_animalele:
    title: Adoro a los animales
    gloss: Adoro a los animales.
    note: '*A iubi* («amar») lleva su complemento sin preposición: *Iubesc animalele*; el artículo *-le* indica que hablamos de los animales en general.'
  ro.a1.unit32.lesson03.teach.elena_iubeste_pisicile:
    title: Elena ama a los gatos, pero no tiene mascota
    gloss: Elena ama a los gatos, pero no tiene mascota.
    note: Prepara el contraste en torno al cual se construye la lectura de la lección 5.
  ro.a1.unit32.lesson04.teach.mihai_ai_un:
    title: Mihai pregunta por una mascota
    gloss: 'Mihai: ¿Tienes mascota, Ana?'
  ro.a1.unit32.lesson04.teach.ana_da_am:
    title: Ana tiene un perro
    gloss: 'Ana: Sí, tengo un perro.'
  ro.a1.unit32.lesson04.teach.mihai_cum_arata:
    title: Mihai pregunta cómo es
    gloss: 'Mihai: ¿Cómo es?'
    note: Retoma la pregunta *Cum arată ...?* de la unidad sobre el aspecto físico, ahora aplicada a un animal.
  ro.a1.unit32.lesson04.teach.ana_are_blana:
    title: Ana describe a su perro
    gloss: 'Ana: Tiene el pelo marrón y es pequeño.'
    note: Retoma el vocabulario de color del pelo y de tamaño de la unidad del aspecto físico, ahora para describir el pelaje de un animal y no el pelo de una persona.
  ro.a1.unit32.lesson04.teach.pentru_un_animal:
    title: El y ea para los animales
    gloss: 'Para un animal se usa el o ea, según su género: câinele es el, pisica es ea.'
    note: Todos los usos anteriores de *el* y *ea* en este curso se referían a personas; aquí se extienden a los animales, según el género del sustantivo.
  ro.a1.unit32.lesson04.teach.mihai_il_scoti:
    title: Mihai pregunta por los paseos
    gloss: 'Mihai: ¿Lo sacas a pasear todos los días?'
  ro.a1.unit32.lesson04.teach.ana_da_il:
    title: Ana describe su rutina
    gloss: 'Ana: Sí, lo saco a pasear todos los días y le doy de comer.'
  ro.a1.unit32.lesson05.teach.mihai_si_elena:
    title: Mihai, Elena y Andrei hablan de animales
    gloss: 'Mihai y Elena aman los animales, pero ninguno de los dos tiene mascota. Mihai ama a los perros y Elena ama a los gatos. Andrei, en cambio, sí tiene una mascota: un gato. Juega a menudo con su gato y le da de comer todos los días. ¿Tú tienes mascota?'
    note: Contrasta querer a los animales con tener uno de verdad, que es el objetivo comunicativo de la unidad.
    glosses:
      iubesc: adorar
      amândoi: los dos
      animalele: animales
      doi: los dos
      companie: mascota
      câinii: perros
      pisicile: gatos
      pisică: gato
      joacă: juega
      dă: da
      fiecare: cada
      mâncare: comida
  ro.a1.unit32.lesson05.teach.andrei_se_joaca:
    title: Andrei juega a menudo con su gato
    gloss: Andrei juega a menudo con su gato.
    note: '*Des* («a menudo») retoma la palabra de frecuencia de la unidad de pasatiempos; *a se juca cu* («jugar con») es un verbo reflexivo.'
  ro.a1.unit32.lesson05.teach.iubesc_cainii_nu:
    title: Adoro a los perros. No tengo mascota.
    gloss: Adoro a los perros. No tengo mascota.
    note: Una respuesta modelo de dos frases, lista para reutilizar en el ejercicio de escritura de la unidad.
  ro.a1.unit32.lesson06.teach.ana_nina_ai:
    title: Ana le pregunta a Nina
    gloss: 'Ana: Nina, ¿tú también tienes mascota?'
  ro.a1.unit32.lesson06.teach.nina_da_am:
    title: Nina tiene un pájaro llamado Pico
    gloss: 'Nina: Sí, tengo un pájaro. Se llama Pico.'
    note: '*O cheamă* («se llama») retoma el verbo *a chema* para dar nombres; pasăre es femenino, por eso el pronombre es *o*.'
  ro.a1.unit32.lesson06.teach.mihai_ce_frumos:
    title: Mihai reacciona
    gloss: 'Mihai: ¡Qué bonito! ¿Qué haces con ella todos los días?'
  ro.a1.unit32.lesson06.teach.nina_ii_dau:
    title: Nina le da de comer todos los días
    gloss: 'Nina: Le doy de comer todos los días.'
  ro.a1.unit32.lesson06.teach.mihai_iubesc_si:
    title: A Mihai también le encantan los pájaros
    gloss: 'Mihai: A mí también me encantan los pájaros.'
  ro.a1.unit32.lesson06.teach.ana_ce_frumos:
    title: Ana cierra la conversación
    gloss: 'Ana: ¡Qué bonito que a los tres nos encanten los animales!'
    note: Cierra el círculo con los datos sobre animales de los tres personajes de esta unidad.
