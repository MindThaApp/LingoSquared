teaching:
  ro.a1.unit18.lesson01.teach.reminder_ana_mare:
    title: 'Repaso: Ana, mare'
    gloss: Ana (nombre) · grande
    note: Ana es el nombre del personaje, presente desde la Unidad 1; *mare* es de las Unidades 5 y 14. Esta unidad reutiliza ambas para describir su casa.
  ro.a1.unit18.lesson01.teach.reminder_articole_trei:
    title: 'Repaso: un, o, și, trei'
    gloss: un/o (un, una) · y · tres
    note: '*Un*, *o* y *și* son de la Unidad 5; *trei* es del conteo de la Unidad 2. Esta unidad reutiliza las cuatro para contar y describir habitaciones.'
  ro.a1.unit18.lesson01.teach.are_vocab:
    title: Tiene
    gloss: Are (él/ella tiene)
    note: 'Una forma nueva de *a avea* (tener): ya conoces *am* (yo tengo, de las Unidades 2 y 5) y *aveți* (usted tiene). *Are* es la tercera persona del mismo verbo y sirve para decir lo que tiene alguien o algo.'
  ro.a1.unit18.lesson01.teach.casa_vocab:
    title: Casa
    gloss: Casa
    note: El lugar donde vive alguien.
    example_gloss:
    - Ana tiene una casa grande.
  ro.a1.unit18.lesson01.teach.camera_vocab:
    title: Habitación
    gloss: Habitación
    note: Palabra general para una habitación de una vivienda.
    example_gloss:
    - Ana tiene una habitación grande.
  ro.a1.unit18.lesson01.teach.camere_plural:
    title: Cameră → camere
    gloss: habitación · habitaciones
    note: El plural de *cameră* es *camere*, que se usa al contar más de una habitación.
  ro.a1.unit18.lesson01.teach.dormitor_vocab:
    title: Dormitorio
    gloss: Dormitorio
    note: La habitación donde alguien duerme.
    example_gloss:
    - Ana tiene un dormitorio.
  ro.a1.unit18.lesson01.teach.bucatarie_vocab:
    title: Cocina
    gloss: Cocina
    note: La habitación donde alguien cocina.
    example_gloss:
    - Ana tiene una cocina.
  ro.a1.unit18.lesson01.teach.baie_vocab:
    title: Baño
    gloss: Baño
    note: La habitación con bañera o ducha e inodoro.
    example_gloss:
    - Ana tiene un baño.
  ro.a1.unit18.lesson01.teach.casa_mare_phrase:
    title: 'Ana tiene una casa grande. Tiene tres habitaciones: un dormitorio, una cocina y un baño.'
    gloss: 'Ana tiene una casa grande. La casa tiene tres habitaciones: un dormitorio, una cocina y un baño.'
    note: 'Todas las palabras de aquí ya se han enseñado o se acaban de introducir, combinadas en dos frases nuevas sobre la casa de Ana. *Casa* es la forma determinada de *casă* («la casa»): un sustantivo femenino terminado en -ă cambia esa -ă por -a, como *banca* («el banco») en la Unidad 8.'
  ro.a1.unit18.lesson02.teach.reminder_mihai_mic:
    title: 'Repaso: Mihai, mic'
    gloss: Mihai (nombre) · pequeño
    note: Mihai es el nombre del personaje, presente desde la Unidad 1; *mic* es de la Unidad 14. Esta unidad reutiliza ambos para describir su apartamento.
  ro.a1.unit18.lesson02.teach.reminder_unde_este_doua:
    title: 'Repaso: unde, este, două'
    gloss: dónde · es/está · dos (femenino)
    note: '*Unde* y *este* son de las Unidades 8 y 9; *două* es la forma femenina de «dos» de la Unidad 2. Esta unidad reutiliza las tres para preguntar por las habitaciones y contarlas.'
  ro.a1.unit18.lesson02.teach.apartament_vocab:
    title: Apartamento
    gloss: Apartamento
    note: La vivienda de Mihai, una opción más pequeña que la casa de Ana.
    example_gloss:
    - Mihai tiene un apartamento pequeño.
  ro.a1.unit18.lesson02.teach.fereastra_vocab:
    title: Ventana
    gloss: Ventana
    note: '*Apartamentul* es la forma determinada de *apartament* («el apartamento»): un sustantivo neutro terminado en consonante añade -ul, como *magazinul* («la tienda») en la Unidad 8 (en cambio, el femenino *casă* pasa a *casa*).'
    example_gloss:
    - El apartamento tiene una ventana grande.
  ro.a1.unit18.lesson02.teach.apartament_mic_phrase:
    title: 'Mihai tiene un apartamento pequeño. Tiene dos habitaciones: un dormitorio y una cocina.'
    gloss: 'Mihai tiene un apartamento pequeño. El apartamento tiene dos habitaciones: un dormitorio y una cocina.'
    note: Todas las palabras de aquí ya se han enseñado o se acaban de introducir, combinadas en dos frases nuevas sobre el apartamento de Mihai.
  ro.a1.unit18.lesson02.teach.unde_este_baia_phrase:
    title: ¿Dónde está el baño?
    gloss: ¿Dónde está el baño?
    note: '*Baia* es la forma determinada de *baie* («el baño»). Es una pregunta muy útil cuando visitas la casa de alguien.'
  ro.a1.unit18.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Repaso: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Hola · ¿Cómo está usted? (formal) · Bien, gracias
    note: Todo viene del saludo inicial de la Unidad 1 y se reutiliza aquí para empezar el diálogo de esta unidad.
  ro.a1.unit18.lesson03.teach.reminder_la_revedere_mea_aproape_am:
    title: 'Repaso: La revedere, Mea, Aproape, Am'
    gloss: Adiós · mi (femenino) · cerca · tengo
    note: '*La revedere* es de la Unidad 1; *mea* viene de *Mama mea* de la Unidad 5; *aproape* viene de las respuestas a *Unde este...?* de las Unidades 8 y 9; *am* es de las Unidades 2 y 5. Todo se reutiliza aquí en el diálogo de la visita a casa.'
  ro.a1.unit18.lesson03.teach.line01:
    title: Saluda a Ana y pregúntale cómo está
    gloss: Mihai saluda a Ana y le pregunta cómo está.
    note: Reutiliza el saludo *Ce mai faceți?* de la Unidad 1.
  ro.a1.unit18.lesson03.teach.line02:
    title: Responde y describe tu casa
    gloss: Ana responde y luego le dice a Mihai que su casa es grande y tiene tres habitaciones.
    note: Combina *Bine, mulțumesc* de la Unidad 1 con la frase de la primera lección de esta unidad.
  ro.a1.unit18.lesson03.teach.line03:
    title: Pregunta dónde está el baño
    gloss: Mihai le pregunta a Ana dónde está el baño.
    note: Reutiliza casi igual la frase de la segunda lección de esta unidad.
  ro.a1.unit18.lesson03.teach.line04:
    title: Responde dónde está el baño
    gloss: Ana le dice que está cerca.
    note: Combina *baia* con *aproape*, el mismo patrón de respuesta a «¿dónde está...?» que ya vimos en las Unidades 8 y 9.
  ro.a1.unit18.lesson03.teach.line05:
    title: Describe tu apartamento y despídete
    gloss: Mihai dice que tiene un apartamento pequeño con dos habitaciones y luego se despide.
    note: Combina la frase de la segunda lección de esta unidad con la despedida de la Unidad 1.
  ro.a1.unit18.lesson03.teach.line06:
    title: Despídete
    gloss: Ana se despide.
    note: La misma despedida con la que terminó el diálogo de todas las unidades anteriores.
