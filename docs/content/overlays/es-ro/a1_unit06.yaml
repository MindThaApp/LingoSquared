answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's "Vă rog" (formal, sourced) and "Te rog" (informal, freshly authored) are register-sensitive parallels, matching unit02's ai/aveți and unit05's ai frați/aveți frați pattern -- accept either register for a general "please" unless an exercise explicitly names one. Ana and Mihai's closing café dialogue keeps their existing polite register with each other (both use "vă rog," not "te rog").
course:
  title: Rumano A1
  description: 'Pedir comida y bebidas en rumano: café, té, pan y más, con la frase central de pedido "Aș dori ..." (Quisiera ...) y el par de cortesía vă rog/te rog. Seguimos con Ana y Mihai, que se encuentran en una cafetería.'
units:
  ro.a1.unit06.food:
    title: Comida y bebidas
lessons:
  ro.a1.unit06.lesson01.bauturi:
    title: Bebidas
  ro.a1.unit06.lesson02.va_rog_si_mancare:
    title: Por favor y comida
  ro.a1.unit06.lesson03.la_cafenea:
    title: En el café
teaching:
  ro.a1.unit06.lesson01.teach.reminder_un_o_si:
    title: 'Repaso: un, o, și'
    gloss: un/o (un, una) · și (y)
    note: Las tres palabras ya aparecieron en unidades anteriores (*și* en la Unidad 1, *o* en la Unidad 2, *un* en la Unidad 4); aquí vuelven para hablar de comida y bebidas.
  ro.a1.unit06.lesson01.teach.as_dori:
    title: Quisiera ...
    gloss: Aș dori ... (Quisiera ...)
    note: 'La forma educada de pedir algo en rumano: es una forma condicional fija que no cambia según lo que le sigue.'
  ro.a1.unit06.lesson01.teach.apa:
    title: Agua
    gloss: apă (agua)
    note: 'Sustantivo femenino: no lleva artículo cuando no se especifica la cantidad, como en español "agua" en "quisiera agua".'
    example_gloss: Quisiera agua.
  ro.a1.unit06.lesson01.teach.cafea:
    title: Café
    gloss: cafea (café)
    note: 'Es femenino: se combina con *o* ("una") igual que cualquier otro sustantivo femenino.'
    example_gloss: Quisiera un café.
  ro.a1.unit06.lesson01.teach.ceai:
    title: Té
    gloss: ceai (té)
    note: 'Se combina con *un* ("un"), no con *o*: ceai es un sustantivo masculino/neutro.'
    example_gloss: Quisiera un té.
  ro.a1.unit06.lesson01.teach.suc:
    title: Jugo
    gloss: suc (jugo, zumo)
    note: También lleva *un*, igual que ceai.
    example_gloss: Quisiera un jugo.
  ro.a1.unit06.lesson01.teach.lapte:
    title: Leche
    gloss: lapte (leche)
    note: Como apă, normalmente se dice sin artículo cuando no se especifica la cantidad.
    example_gloss: Quisiera leche.
  ro.a1.unit06.lesson01.teach.mi_e_sete:
    title: Tengo sed
    gloss: Mi-e sete (Tengo sed)
    note: 'Es una expresión fija: literalmente se acerca más a "me es sed" que a "tengo sed".'
  ro.a1.unit06.lesson01.teach.as_dori_o_cafea:
    title: Quisiera un café
    gloss: Quisiera un café.
    note: Une la frase de pedido y un sustantivo femenino de bebida en una oración completa.
  ro.a1.unit06.lesson02.teach.reminder_multumesc_bine_da_nu:
    title: 'Repaso: mulțumesc, bine, da, nu'
    gloss: mulțumesc (gracias) · bine (bien) · da (sí) · nu (no)
    note: '*Mulțumesc* y *bine* aparecieron por primera vez en los saludos de la Unidad 1, y *da* y *nu* en la Unidad 3 y la Unidad 5; aquí vuelven en torno a la comida y la cortesía.'
  ro.a1.unit06.lesson02.teach.mi_e_foame:
    title: Tengo hambre
    gloss: Mi-e foame (Tengo hambre)
    note: La misma expresión fija que *Mi-e sete*, con foame (hambre) en lugar de sete (sed).
  ro.a1.unit06.lesson02.teach.paine:
    title: Pan
    gloss: pâine (pan)
    note: Normalmente se dice sin artículo, como en español "quisiera pan".
    example_gloss: Tengo hambre. Quisiera pan.
  ro.a1.unit06.lesson02.teach.mancare:
    title: La comida
    gloss: mâncare (comida)
    note: La palabra general para "comida", no un plato concreto.
    example_gloss: Quisiera comida.
  ro.a1.unit06.lesson02.teach.carne:
    title: Carne
    gloss: carne (carne)
    note: La palabra general para "carne"; los tipos concretos (carne de vită, carne de porc) añaden el tipo después.
    example_gloss: Quisiera carne.
  ro.a1.unit06.lesson02.teach.pui:
    title: Pollo
    gloss: pui (pollo)
    note: La palabra específica para el pollo (como comida), distinta de la general carne.
    example_gloss: Quisiera pollo.
  ro.a1.unit06.lesson02.teach.fructe:
    title: Fruta
    gloss: fructe (fruta)
    note: Es el plural de uso cotidiano, empleado para hablar de la fruta en general.
    example_gloss: Quisiera fruta.
  ro.a1.unit06.lesson02.teach.va_rog:
    title: Por favor (formal)
    gloss: vă rog (por favor, formal)
    note: La forma cortés de decir "por favor"; va con el registro de dumneavoastră visto en las Unidades 1 y 2.
    example_gloss: Un café, por favor.
  ro.a1.unit06.lesson02.teach.te_rog:
    title: Por favor (informal)
    gloss: te rog (por favor, informal)
    note: La versión cotidiana que se usa con amigos y con personas a quienes tratas de *tu*; va con el registro de tu de la Unidad 1.
    example_gloss: Un té, por favor.
  ro.a1.unit06.lesson03.teach.reminder_buna_ziua_bine_la_revedere:
    title: 'Repaso: bună, ziua, bine, la revedere, Ana, Mihai'
    gloss: bună ziua (buenos días / hola) · bine (bien) · la revedere (adiós) · Ana, Mihai (nombres)
    note: Todo esto ya apareció en los diálogos de las Unidades 1 y 5; aquí Ana y Mihai vuelven a encontrarse, esta vez en una cafetería.
  ro.a1.unit06.lesson03.teach.line01:
    title: Saluda y di que tienes hambre
    gloss: Ana saluda a Mihai y dice que tiene hambre.
    note: Usa el *Mi-e foame* de esta unidad en el propio saludo.
  ro.a1.unit06.lesson03.teach.line02:
    title: Pide comida
    gloss: Mihai dice que quisiera pan y pollo.
    note: Reutiliza el vocabulario pâine/pui de esta unidad con la frase Aș dori.
  ro.a1.unit06.lesson03.teach.line03:
    title: Pide una bebida con cortesía
    gloss: Ana dice que quisiera un café, por favor.
    note: 'Combina Aș dori, cafea y vă rog: tres elementos que esta unidad ya enseñó por separado.'
  ro.a1.unit06.lesson03.teach.line04:
    title: Pide también una bebida
    gloss: Mihai dice que quisiera un té, por favor.
    note: El mismo patrón que la frase de Ana, con ceai en lugar de cafea.
  ro.a1.unit06.lesson03.teach.line05:
    title: Da las gracias y despídete
    gloss: Ana da las gracias a Mihai y se despide.
    note: Aquí *Mulțumesc* es un simple agradecimiento de cierre, la misma palabra del *Bine, mulțumesc.* de la Unidad 1.
  ro.a1.unit06.lesson03.teach.line06:
    title: Cierra el encuentro
    gloss: Mihai se despide también, usando el nombre de Ana.
    note: El mismo patrón de despedida amable con el que terminaron los diálogos de la Unidad 1 y de la Unidad 5.
