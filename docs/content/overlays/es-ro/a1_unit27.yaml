teaching:
  ro.a1.unit27.lesson01.teach.fericit_trist_suparat:
    title: Contento, triste y enfadado
    gloss: contento, triste, enfadado
    note: 'Tres palabras básicas de sentimientos que se usan con *a fi* (ser/estar). Cada una tiene una forma femenina en *-ă*: *fericită*, *tristă*, *supărată*.'
    example_gloss:
    - Estoy contento.
    - Estoy triste.
    - Estoy enfadado.
  ro.a1.unit27.lesson01.teach.sunt_fericit:
    title: Decir que estás contento
    gloss: Estoy contento.
    note: '*Sunt* (de *a fi*, ser/estar) + un adjetivo de sentimiento es el esquema básico, igual que en español: «Estoy feliz». Una mujer dice *Sunt fericită*.'
  ro.a1.unit27.lesson01.teach.nu_sunt_suparat:
    title: Contrastar sentimientos
    gloss: No estoy enfadado, estoy triste.
    note: '*Nu* delante del verbo lo hace negativo: *Nu sunt supărat*. La segunda oración indica entonces el sentimiento real.'
  ro.a1.unit27.lesson02.teach.de_ce_esti:
    title: Preguntar por qué
    gloss: ¿Por qué estás contento?
    note: '*De ce* (por qué) es la pregunta habitual para pedir una razón.'
  ro.a1.unit27.lesson02.teach.sunt_fericit_pentru:
    title: Dar una razón
    gloss: Estoy contento porque tengo un apartamento nuevo.
    note: '*Pentru că* (porque) introduce la oración de causa; el orden de las palabras sigue siendo normal: *am un apartament nou*.'
  ro.a1.unit27.lesson02.teach.sunt_trist_pentru:
    title: Una razón negativa
    gloss: Estoy triste porque llueve.
    note: '*Plouă* (llueve) no lleva sujeto en rumano, así que funciona solo como oración de causa.'
  ro.a1.unit27.lesson03.teach.emotionat:
    title: Nervioso
    gloss: nervioso
    note: La palabra habitual para el nerviosismo.
    example_gloss: Estoy nervioso por mi primer turno.
  ro.a1.unit27.lesson03.teach.sunt_emotionat_pentru:
    title: Decir por qué estás nervioso
    gloss: Estoy nervioso por mi primer turno.
    note: '*Pentru* (literalmente «para/por») introduce el motivo del nerviosismo; en español solemos decir «por» o «ante», mientras que en rumano se usa pentru.'
  ro.a1.unit27.lesson03.teach.nu_ti_face:
    title: Tranquilizar a alguien
    gloss: No te preocupes.
    note: '*Nu-ți face griji* (literalmente «no te hagas preocupaciones») es la frase fija habitual para tranquilizar. A un desconocido: *Nu vă faceți griji*.'
  ro.a1.unit27.lesson04.teach.cum_se_simte:
    title: Preguntar cómo se siente alguien
    gloss: ¿Cómo se siente Mihai?
    note: '*A se simți* (sentirse) es reflexivo: *mă simt* (yo), *te simți* (tú), *se simte* (él/ella). Es la forma habitual de preguntar o hablar de sentimientos.'
  ro.a1.unit27.lesson04.teach.el_se_simte:
    title: Describir cómo se siente alguien
    gloss: Él se siente nervioso.
    note: '*Se* es el pronombre reflexivo de él/ella y va antes del verbo: *se simte*.'
  ro.a1.unit27.lesson04.teach.de_ce_se:
    title: Preguntar por qué alguien se siente así
    gloss: ¿Por qué se siente nervioso?
    note: Combina *de ce* con el esquema *se simte* de *El se simte emoționat*.
  ro.a1.unit27.lesson05.teach.salut_ana_sunt:
    title: Lee un mensaje sobre sentimientos
    gloss: Hola, Ana, estoy un poco nervioso por mi primer turno solo. Pero también estoy feliz, porque tengo un trabajo nuevo y un apartamento nuevo. Creo que todo saldrá bien.
    note: Fíjate en por qué está nervioso el autor, qué lo hace feliz y cómo ve el futuro en general.
    glosses:
      puțin: un poco
      emoționat: nervioso
      prima: primer
      tură: turno
      singur: solo
      fericit: contento
      fiindcă: porque
      nou: nuevo
      serviciu: trabajo
      apartament: apartamento
      cred: creo
      rezolvă: irá (bien)
  ro.a1.unit27.lesson06.teach.ana_salut_mihai:
    title: Ana pregunta cómo se siente Mihai
    gloss: 'Ana: Hola, Mihai, ¿cómo te sientes antes de tu primer turno?'
    note: '*Cum te simți* usa el reflexivo *te* («te»); en *prima ta tură* el posesivo *ta* concuerda con el femenino *tură*.'
  ro.a1.unit27.lesson06.teach.mihai_sunt_putin:
    title: Mihai admite que está nervioso
    gloss: 'Mihai: Estoy un poco nervioso, la verdad.'
    note: '*Sincer să fiu* (para ser sincero) suaviza la confesión.'
  ro.a1.unit27.lesson06.teach.ana_nu_ti:
    title: Ana lo tranquiliza
    gloss: 'Ana: No te preocupes, ¡lo harás bien!'
    note: '*O să te descurci bine* (literalmente «te desenvolverás bien») es una expresión fija de ánimo; *o să* + verbo forma el futuro.'
  ro.a1.unit27.lesson06.teach.mihai_multumesc_chiar:
    title: Mihai le da las gracias
    gloss: 'Mihai: Gracias, de verdad ayuda.'
    note: '*Ajută* es la forma de él/ella/ello de *a ajuta* (ayudar); aquí significa «ayuda».'
  ro.a1.unit27.lesson06.teach.ana_si_dupa:
    title: Ana predice el resultado
    gloss: 'Ana: Y después seguro que estarás muy feliz y orgulloso.'
    note: '*Sigur* (seguro) expresa una predicción confiada; *mândru* (orgulloso) es un adjetivo nuevo y útil (*mândră* para una mujer).'
  ro.a1.unit27.lesson06.teach.mihai_da_si:
    title: Mihai está de acuerdo
    gloss: 'Mihai: Sí, yo también lo creo.'
    note: '*Și eu cred asta* (literalmente «yo también creo esto») es la forma natural de estar de acuerdo con la opinión de alguien.'
  ro.a1.unit27.lesson06.teach.mihai_este_emotionat:
    title: Resumen con este, lui e îl
    gloss: Mihai está nervioso por su primer turno. Ana lo ayuda.
    note: '*Este* es la forma de él/ella de *a fi* (ser/estar); *lui* después del sustantivo significa «su» (de él); *îl* significa «lo» y va antes del verbo: *îl ajută*. Tres palabras pequeñas pero esenciales para hablar de otra persona.'
