answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: This unit's new "Ai frați?"/"Aveți frați?" and "Câți copii ai?"/"Câți copii aveți?" pairs are register-sensitive (tu vs. dumneavoastră, parallel to ユニット2's ai/aveți age questions) -- accept either register unless an exercise explicitly names one. Ana and Mihai's closing dialogue keeps the dumneavoastră register ユニット1 already established between them.
course:
  title: ルーマニア語 A1
  description: ルーマニア語で家族について話します。両親、きょうだい、子ども、結婚しているかどうかを、所有を表す meu/mea のペアと、ユニット2の年齢の質問で出てきた tu/dumneavoastră の使い分けを使って学びます。アナとミハイが互いの家族を知っていく場面が続きます。
units:
  ro.a1.unit05.family:
    title: 家族
lessons:
  ro.a1.unit05.lesson01.familia_mea:
    title: 私の家族
  ro.a1.unit05.lesson02.frati_si_copii:
    title: きょうだいと子ども
  ro.a1.unit05.lesson03.o_discutie_despre_familie:
    title: 家族についての会話
teaching:
  ro.a1.unit05.lesson01.teach.reminder_am_un_o_si_mare:
    title: 復習：am, un, o, și, mare
    gloss: am(私は持っている)・un/o(一つの)・și(と、そして)・mare(大きい)
    note: この5語はすべて前のユニットで登場済みです(*și* はユニット1、*am* と *o* はユニット2、*mare* はユニット3の「大文字」のメモ、*un* はユニット4)。ここでは家族の話題で再び使います。
  ro.a1.unit05.lesson01.teach.familie:
    title: 家族
    gloss: 家族
    note: 女性名詞です。*o* や *mare* のような形容詞と組み合わせて「大家族」と言えます。
    example_gloss: 私は大家族です。
  ro.a1.unit05.lesson01.teach.mama:
    title: 母
    gloss: 母
    note: 「母」を表す基本の辞書形です。「私の母」の言い方は、少し先のカードで学びます。
    example_gloss: ミハイには母と父がいます。
  ro.a1.unit05.lesson01.teach.tata:
    title: 父
    gloss: 父
    note: 「父」を表す基本の辞書形です。
    example_gloss: 私の父は教師です。
  ro.a1.unit05.lesson01.teach.parintii:
    title: 両親
    gloss: 両親
    note: 日本語の「両親」と同じように、父と母をまとめて指します。
    example_gloss: 私の両親はルーマニアに住んでいます。
  ro.a1.unit05.lesson01.teach.meu_mea:
    title: 私の：meu と mea
    gloss: meu(私の・男性名詞用)/ mea(私の・女性名詞用)
    note: ルーマニア語の「私の」は、持ち主ではなく、持たれるもの(名詞)の性に合わせて形が変わります。*tată* のような男性名詞には *meu*、*mamă* のような女性名詞には *mea* を使います。
  ro.a1.unit05.lesson01.teach.mama_mea:
    title: 私の母
    gloss: 私の母
    note: mamă は mea が付く前に mama の形(定冠詞が付いた形)になります。「私の母」はこの組み合わせの形で言い、語を一つずつ置き換えるわけではありません。
  ro.a1.unit05.lesson01.teach.tatal_meu:
    title: 私の父
    gloss: 私の父
    note: tată は meu が付く前に tatăl の形(定冠詞が付いた形)になります。語尾が -l になる不規則な形です。
  ro.a1.unit05.lesson01.teach.mama_si_tatal:
    title: 私の母と父
    gloss: 私の母と父。
    note: 二つの「私の」を一つの文にまとめます。それぞれ名詞の性に合った形になっています。
  ro.a1.unit05.lesson02.teach.reminder_cati_ai_aveti_doi_nu:
    title: 復習：câți, ai, aveți, doi, nu
    gloss: câți(いくつ、何人)・ai/aveți(あなたは持っている・親しい間柄/丁寧)・doi(二つ)・nu(いいえ、〜ない)
    note: '*Câți*、*ai*、*aveți* はユニット2で年齢を尋ねる「Câți ani ai?」に出てきました。ここではきょうだいや子どもの数を尋ねるのに使います。*Doi* はユニット2の数字、*nu* はユニット3で学びました。'
  ro.a1.unit05.lesson02.teach.da:
    title: はい
    gloss: はい
    note: 日常でよく使う「はい」です。ユニット3の *nu*(いいえ)と対になります。
    example_gloss: はい、兄(弟)がいます。
  ro.a1.unit05.lesson02.teach.frate_sora:
    title: 兄弟、姉妹
    gloss: 兄・弟 / 姉・妹
    note: 男性名詞と女性名詞のきょうだいを表す語です。ほかの名詞と同じように un/o と組み合わせます。
    example_gloss:
    - 私には兄(弟)がいます。
    - 私には姉(妹)がいます。
  ro.a1.unit05.lesson02.teach.frati_surori:
    title: 兄弟たち、姉妹たち
    gloss: 兄弟(複数)/ 姉妹(複数)
    note: きょうだいについて一般的に尋ねるときに使う複数形です。ルーマニアでは「Ai frați?」(兄弟はいますか)で「きょうだいはいますか」の意味を表すことがよくあり、そのあと姉妹について別に「Surori?」と確認することもあります。
    example_gloss: 兄弟か姉妹はいますか。
  ro.a1.unit05.lesson02.teach.ai_frati:
    title: きょうだいはいますか(親しい間柄)
    gloss: 兄弟はいますか。
    note: 日常的な、くだけた尋ね方です。ユニット1の *tu* の使い方と対応します。
  ro.a1.unit05.lesson02.teach.aveti_frati:
    title: きょうだいはいますか(丁寧)
    gloss: 兄弟はいますか。
    note: 丁寧な言い方です。ユニット2の年齢の質問と同じ *aveți* を使います。
  ro.a1.unit05.lesson02.teach.copil_copii:
    title: 子ども(単数・複数)
    gloss: 子ども(単数)/ 子どもたち(複数)
    note: copil はルーマニア語でも難しい複数形の一つで、規則的な -i や -e の語尾ではなく copii になります。この形をそのまま覚えましょう。
    example_gloss: 私には子どもが二人います。
  ro.a1.unit05.lesson02.teach.fiu_fiica:
    title: 息子、娘
    gloss: 息子 / 娘
    note: 息子と娘を specifically 表す語で、一般的な copil/copii とは区別されます。
    example_gloss:
    - 私には息子がいます。
    - 私には娘がいます。
  ro.a1.unit05.lesson02.teach.cati_copii_ai:
    title: お子さんは何人いますか。
    gloss: お子さんは何人いますか。
    note: Câți(いくつ)+ copii(子どもたち)+ ai(あなたは持っている)。三つとも既習の語です。
  ro.a1.unit05.lesson02.teach.casatorit:
    title: 結婚している
    gloss: 結婚している
    note: 年齢を尋ねるのと同じように、日常会話でよく聞かれる個人的な質問です。
    example_gloss: あなたは結婚していますか。
  ro.a1.unit05.lesson03.teach.reminder_bine_la_revedere:
    title: 復習：bine, la revedere, Ana, Mihai
    gloss: bine(良い、元気)・la revedere(さようなら)・Ana, Mihai(人名)
    note: 前のユニットで学んだ語の復習です。このレッスンの会話で再び使います。
  ro.a1.unit05.lesson03.teach.line01:
    title: きょうだいについて尋ねる
    gloss: アナがミハイにきょうだいがいるか尋ねます。
    note: 二人のこれまでの関係に合わせて、丁寧な *aveți* を使っています。
  ro.a1.unit05.lesson03.teach.line02:
    title: 答えて、尋ね返す
    gloss: ミハイは兄(弟)と姉(妹)がいると答え、アナに子どもがいるか尋ねます。
    note: このユニットの frate/soră と copii の語を一つのやり取りで使っています。
  ro.a1.unit05.lesson03.teach.line03:
    title: 答えて、同じ質問を返す
    gloss: アナは娘がいると答え、ミハイにも同じ質問を返します。
    note: '*Și dumneavoastră?*(あなたは？)は、ユニット1の自己紹介に出てきた聞き返しの表現と同じです。'
  ro.a1.unit05.lesson03.teach.line04:
    title: 答える
    gloss: ミハイは息子がいると答えます。
    note: このユニットの fiu を使った、短くて直接的な答えです。
  ro.a1.unit05.lesson03.teach.line05:
    title: 反応して、締めくくる
    gloss: アナは好意的に反応して、さようならと言います。
    note: ここでの *Bine!* は短い肯定的な反応で、ユニット1の *Bine, mulțumesc.* に出てきたのと同じ語です。
  ro.a1.unit05.lesson03.teach.line06:
    title: 出会いを締めくくる
    gloss: ミハイもアナの名前を呼んで、さようならと返します。
    note: ユニット1とユニット4の会話も最後はこのような親しみのあるあいさつで終わっていました。
