teaching:
  ro.a1.unit28.lesson01.teach.a_suna:
    title: 電話する
    gloss: 電話する
    note: 電話をかけることを表す動詞の不定詞です。
    example_gloss: あなたに電話しなければなりません。
  ro.a1.unit28.lesson01.teach.te_sun:
    title: 電話すると伝える
    gloss: あなたに電話します。
    note: '*Sun* は *a suna*(電話をかける)の *eu* の形です。*te*(「あなたに」)は動詞の前に置きます。日本語では「かけます」のように未来を現在形で言えますが、ルーマニア語でもここでは現在形を使います。'
  ro.a1.unit28.lesson01.teach.alo_sunt_ana:
    title: 電話に出る
    gloss: もしもし、アナです。
    note: '*Alo* は電話に出るときの言葉です。*sunt* + 名前で、自分が誰かを伝えます(「〜です」にあたります)。'
  ro.a1.unit28.lesson01.teach.alo_sunt_mihai:
    title: ミハイも同じように電話に出る
    gloss: もしもし、ミハイです。
    note: '*Alo, sunt Ana* と同じ、*Alo, sunt* + 名前の型です。'
  ro.a1.unit28.lesson02.teach.cu_cine_vorbesc:
    title: 誰からの電話か尋ねる
    gloss: どちら様ですか？
    note: '*Cu cine vorbesc?*(直訳：「誰と話していますか？」)は、知らない相手が誰かを尋ねる標準的な言い方です。'
  ro.a1.unit28.lesson02.teach.vorbiti_cu_ana:
    title: 丁寧に名乗る
    gloss: アナと話しています。
    note: '*Vorbiți cu* + 名前は丁寧な答え方です。*vorbiți* は *a vorbi*(話す)の *dumneavoastră* の形です。'
  ro.a1.unit28.lesson03.teach.poti_sa_repeti:
    title: もう一度言ってもらう
    gloss: それをもう一度言ってもらえますか？
    note: '*Poți să* ...(〜してくれますか？)+ *repeți*(繰り返す)+ *asta*(それ)。'
  ro.a1.unit28.lesson03.teach.nu_vorbi_atat:
    title: ゆっくり話してもらう
    gloss: そんなに速く話さないでください。
    note: '*Nu vorbi*(「話さないで」)は *nu* + *tu* の形です。*atât de repede* は「そんなに速く」という意味です。'
  ro.a1.unit28.lesson03.teach.nu_te_aud:
    title: よく聞こえないと伝える
    gloss: よく聞こえません。
    note: '*Nu te aud bine*:*aud* は「聞こえる」(私)、*te*(「あなたが」)は動詞の前に置き、*bine* は「よく」という意味です。'
  ro.a1.unit28.lesson04.teach.mesajul:
    title: メッセージ
    gloss: メッセージ
    note: '*Mesaj* は単数では男性名詞、複数では女性名詞です(*un mesaj*、*două mesaje*)。定冠詞は語末につきます：*mesajul*。'
    example_gloss: そのメッセージはアナからです。
  ro.a1.unit28.lesson04.teach.iti_trimit_un:
    title: メッセージを送ると伝える
    gloss: あなたにメッセージを送ります。
    note: '*Îți*(「あなたに」)は与格の代名詞で、動詞の前に置きます：*Îți trimit un mesaj*。'
  ro.a1.unit28.lesson04.teach.te_sun_inapoi:
    title: かけ直すと伝える
    gloss: 後でかけ直します。
    note: '*Înapoi*(「戻して」)は動詞の後ろに来ます。*te sun înapoi* は「かけ直します」、*mai târziu* は「後で」という意味です。'
  ro.a1.unit28.lesson05.teach.mihai_salut_ana:
    title: メッセージのやり取りを読む
    gloss: ミハイ：やあアナ、電話してくれる？話したいことがあるんだ。アナ：うん、もちろん。5分後にかけ直すね。
    note: ミハイが何を頼んでいるか、その理由、そしてアナがいつかけ直すと言っているかに注目しましょう。
    glosses:
      Salut: やあ
      poți: できる
      suna: 電話する
      Trebuie: ~しなければならない
      ceva: 何か
      spun: 伝える
      sigur: もちろん
      sun: 電話する
      cinci: '5'
      minute: 分
      înapoi: 折り返す
  ro.a1.unit28.lesson06.teach.mihai_alo_sunt:
    title: ミハイが電話に出る
    gloss: ミハイ：もしもし、ミハイです。
    note: レッスン1と同じ *Alo, sunt* + 名前の型を、実際の通話で使っています。電話に出た人が先に話し、名前を言います。
  ro.a1.unit28.lesson06.teach.ana_salut_mihai:
    title: アナが名乗る
    gloss: アナ：やあミハイ、アナだよ。ミハイ：電話をくれてうれしいよ！
    note: '*Ce bine că* ...(「〜でなんてよかった」)は、出来事への前向きな反応を表します。*suni* は *a suna* の *tu* の形です。'
  ro.a1.unit28.lesson06.teach.ana_cum_a:
    title: アナがシフトについて尋ねる
    gloss: アナ：初めてのシフトはどうだった？
    note: '*A fost* は「〜だった」という意味です(*a fi* の過去)。*am mâncat* と同じ作りの perfect compus です。次の行の後の説明を見てください。'
  ro.a1.unit28.lesson06.teach.mihai_a_mers:
    title: ミハイがうれしい報告をする
    gloss: ミハイ：とてもうまくいったよ。思っていたよりずっとよかった。
    note: '*A mers* は *a merge*(行く。ここでは「うまくいく」)の過去です。*credeam* は「思っていた」という意味です(*a crede* の過去の形)。'
  ro.a1.unit28.lesson06.teach.a_fost_a:
    title: 過去の形：a fost、a mers、credeam
    gloss: だった → a fi、行った → a merge、思っていた → a crede
    note: '*A fost* と *a mers* は perfect compus の形(*a* + 過去分詞)で、*credeam* は未完了過去の形です。今のところは、このレッスンに出てくる場面ごとの決まった言い方として覚えておきましょう。過去形の詳しい規則は、もっと上のレベルで学びます。'
  ro.a1.unit28.lesson06.teach.ana_ma_bucur:
    title: アナは誇らしく思っている
    gloss: アナ：それを聞いてうれしいわ。あなたのことを誇りに思うわ。
    note: '*Mândră de*(「〜を誇りに思う」)は決まった組み合わせで、*de* が必要です。男性は *mândru* と言います。'
  ro.a1.unit28.lesson06.teach.mihai_iti_multumesc:
    title: ミハイは感動している
    gloss: ミハイ：ありがとう、とてもうれしいよ。
    note: '*Înseamnă* は *a însemna*(意味する)の3人称単数形です。*pentru mine*(「私にとって」)は、誰にとって大切かを表します。'
  ro.a1.unit28.lesson06.teach.prima_lui_tura:
    title: 彼の
    gloss: 彼の初めてのシフトはとてもうまくいきました。
    note: '*Lui* は「彼の」の意味です：*prima lui tură*（*prima* と *tură* の間に入ります）。（「彼女の」は *ei* です。）'
