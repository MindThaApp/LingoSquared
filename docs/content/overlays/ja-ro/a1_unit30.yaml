  ro.a1.unit30.lesson01.cititul_sportul_si_gatitul:
    title: 読書、運動、料理
  ro.a1.unit30.lesson02.muzica_desen_si_jocuri:
    title: 音楽、絵、ゲーム
  ro.a1.unit30.lesson03.ce_faci_in_timpul:
    title: 自由時間には何をしますか？
  ro.a1.unit30.lesson04.ana_si_mihai_vorbesc:
    title: アナとミハイが趣味について話す
  ro.a1.unit30.lesson05.mihai_si_ana_isi:
    title: ミハイとアナが趣味を比べる
  ro.a1.unit30.lesson06.planuim_impreuna_un_weekend:
    title: 一緒に週末の予定を立てる
teaching:
  ro.a1.unit30.lesson01.teach.a_citi_a:
    title: 読書、運動、料理
    gloss: 読む、運動する／スポーツをする、料理する
    note: よく使う趣味の動詞を3つ紹介します。*a citi*(読む)、*a face sport*(運動する、スポーツをする)、*a găti*(料理する)です。ルーマニア語の辞書形は *a* で始まります。
    example_gloss:
    - 私は本を読むのが好きです。
    - 私は土曜日に運動します。
    - 私は友達のために料理するのが好きです。
  ro.a1.unit30.lesson01.teach.timpul_liber:
    title: 自由時間
    gloss: 空いている時間
    note: '*Timpul liber*(自由な時間)は、男性名詞 *timp* に冠詞が付いた形です。趣味の話をするときの重要な表現です。'
    example_gloss: 私は自由時間に読書をするのが好きです。
  ro.a1.unit30.lesson01.teach.in_timpul_liber:
    title: 自由時間にすることを伝える
    gloss: 私は自由時間に読書をするのが好きです。
    note: '*Citesc* は *a citi*(読む)の *eu* の形です。*îmi place să* のあとでも、動詞は同じ形のままです。'
  ro.a1.unit30.lesson02.teach.a_asculta_muzica:
    title: 音楽、絵、ゲーム
    gloss: 音楽を聴く、絵を描く、ゲームをする
    note: 趣味を表す表現をさらに3つ紹介します。*a asculta muzică*(音楽を聴く)、*a desena*(絵を描く)、*a juca jocuri video*(ビデオゲームをする)です。
    example_gloss:
    - 私は音楽を聴くのが好きです。
    - 私はよく絵を描きます。
    - 私は友達とゲームをするのが好きです。
  ro.a1.unit30.lesson02.teach.imi_place_sa:
    title: 音楽を聴くのが好きだと伝える
    gloss: 私は音楽を聴くのが好きです。
    note: '*Îmi place să ascult muzică*:*îmi place*(「私には好ましい」)+ *să* + 動詞は、何かをするのが好きだと言うときの普通の言い方です。'
  ro.a1.unit30.lesson02.teach.imi_place_sa_2:
    title: 友達とゲームをするのが好きだと伝える
    gloss: 私は友達とゲームをするのが好きです。
    note: '*Cu prietenii* は「友達と」という意味です。*cu*(「～と」)は前置詞で、*prietenii* は定冠詞の付いた複数形です。'
  ro.a1.unit30.lesson03.teach.mereu_des_uneori:
    title: いつも、よく、ときどき、決して～ない
    gloss: いつも、よく、ときどき、決して～ない
    note: 頻度を表す基本の副詞4つです。*mereu*、*des*、*uneori*、*niciodată*。ふつう動詞のあとに置きます:*Citesc des*。
    example_gloss:
    - 私は毎週土曜日に運動します。
    - 私はよく本を読みます。
    - 私はときどき絵を描きます。
    - 私はゲームをまったくしません。
  ro.a1.unit30.lesson03.teach.in_fiecare_saptamana:
    title: 毎週、毎週末
    gloss: 毎週、毎週末
    note: '*În fiecare săptămână* と *în fiecare weekend* はどちらも「毎～」という意味です。*fiecare* は変化しません。次のカードを見てください。'
    example_gloss:
    - 私は毎週、友達のために料理をします。
    - 私は毎週末、運動します。
  ro.a1.unit30.lesson03.teach.cuvantul_fiecare_nu:
    title: Fiecare は変化しない
    gloss: fiecare という語は変化しません:în fiecare săptămână(毎週)、în fiecare weekend(毎週末)。
    note: '*Fiecare* は *săptămână* や *weekend* の前でも、どんな名詞の前でも同じ形のままなので、選ぶ必要はありません。'
  ro.a1.unit30.lesson03.teach.ce_faci_in:
    title: 余暇の過ごし方を尋ねる
    gloss: 自由時間には何をしますか？
    note: これはこのユニットの中心となる質問です。相手の趣味を尋ねるときに使ってみましょう。
  ro.a1.unit30.lesson04.teach.ana_ne_plimbam:
    title: アナが趣味の話を切り出す
    gloss: アナ:私たちはよく一緒に散歩するよね。でも、ミハイは自由な時間にほかに何をしているの?
    note: '*Ne plimbăm*(「私たちは散歩する」)は、再帰動詞 *a se plimba* の *noi* の形です。二人が楽しんでいる散歩のことを指しています。'
  ro.a1.unit30.lesson04.teach.mihai_imi_place:
    title: ミハイの趣味
    gloss: ミハイ:料理が好きなんだ、家でもね。それに、よく運動もするよ。
    note: '*Și acasă*(家でも)は、ミハイがレストランの仕事としてだけでなく、楽しみとしても料理することをはっきり示しています。'
  ro.a1.unit30.lesson04.teach.ana_gatesti_si:
    title: アナは驚く
    gloss: アナ:家でも料理するの?仕事ですでに一日中料理してるのに!
    note: '*Toată ziua*(一日中)は、ミハイが仕事ですでにたくさん料理していることを強調しています。*deja* は「すでに」という意味です。'
  ro.a1.unit30.lesson04.teach.mihai_da_dar:
    title: ミハイが説明する
    gloss: ミハイ:はい、でも私は料理をするとリラックスできるんです。あなたは何をするのが好きですか。
    note: '*Gătitul mi se pare relaxant* は直訳すると「料理は私にはリラックスできるように思える」で、*mi se pare* は意見を言うときによく使う表現です。'
  ro.a1.unit30.lesson04.teach.ana_imi_place:
    title: アナの趣味
    gloss: アナ:私は読書が好きで、よく音楽も聴きます。
    note: レッスン1と2で習った趣味の動詞二つを、*și*(〜と)で一つの文にまとめています。
  ro.a1.unit30.lesson04.teach.mihai_joci_si:
    title: ミハイがゲームについて尋ねる
    gloss: ミハイ:あなたもゲームをしますか。
    note: レッスン2の *jocuri video* を使った短いはい・いいえ疑問文です。*joci* は *a juca* の *tu* の形です。
  ro.a1.unit30.lesson04.teach.ana_nu_nu:
    title: アナの答え
    gloss: アナ:いいえ、ゲームは一度もしません。でも、ときどき絵を描きます!
    note: レッスン3の *niciodată*(一度も〜ない)と *uneori*(ときどき)を一つの答えで対比しています。*nu ... niciodată* は二重否定です。
  ro.a1.unit30.lesson05.teach.mihai_si_cu:
    title: 趣味を比べる
    gloss: ミハイと私はよく一緒に散歩します。でも、ほかにも趣味があります。ミハイは料理が好きで、家でも作りますし、よく運動もします。私は読書が好きで、よく音楽を聴きます。ときどき絵を描きますが、ゲームは一度もしません。あなたは自由な時間に何をするのが好きですか。
    note: アナのメッセージはレッスン4の内容をまとめ、最後に、このユニットの中心となる質問を読み手に尋ねています。
    glosses:
      plimbăm: 散歩する
      des: よく
      împreună: 一緒に
      alte: ほかの
      gătească: 料理する
      place: ～するのが好き
      acasă: 家で
      sport: 運動する
      citesc: 読む
      ascult: 聴く
      muzică: 音楽
      desenez: 絵を描く
      uneori: 時々
      joc: ビデオゲームをする
      niciodată: 決して〜ない
      liber: 自由な
      timpul: 時間
  ro.a1.unit30.lesson06.teach.mihai_ce_faci:
    title: ミハイが週末の予定を尋ねる
    gloss: ミハイ:今週末は何をしますか。
    note: '*În acest weekend*(今週末)では、「この」を表すのに *acest* を使います。'
  ro.a1.unit30.lesson06.teach.ana_inca_nu:
    title: アナはまだ決めていない
    gloss: アナ:まだわかりません。読書も好きですが、外にも出かけたいです。
    note: '*Să ies afară*(外に出る)は、家から出たいときによく使う言い方です。*vreau să* + 動詞は「〜したい」という意味です。'
  ro.a1.unit30.lesson06.teach.mihai_hai_sa:
    title: ミハイが計画を提案する
    gloss: ミハイ:一緒に散歩しませんか。そのあと、私が二人のために料理しますよ。
    note: '*După aceea*(そのあと)は順序を表す言い方です。*Hai să* + 動詞は、一緒に何かをしようと誘うときに使います。'
  ro.a1.unit30.lesson06.teach.ana_buna_idee:
    title: アナが賛成する
    gloss: アナ:いい考えですね!散歩するのも料理するのも好きです。
    note: '*Și ..., și ...*(「〜も…も」)は、アナが二つのことを同じくらい好きだと表します。'
  ro.a1.unit30.lesson06.teach.mihai_perfect_atunci:
    title: ミハイが確認する
    gloss: ミハイ:いいですね。じゃあ、土曜日に会いましょう!
    note: '*sâmbătă*(土曜日)の予定を確認する、親しみのある締めくくりの一言です。*ne vedem* は「お互いに会う」、つまり「会いましょう」という意味です。'
