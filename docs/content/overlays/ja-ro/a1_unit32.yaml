  ro.a1.unit32.lesson06.nina_si_pasarea_ei:
    title: Ninaの鳥
teaching:
  ro.a1.unit32.lesson01.teach.animalul_un_animal:
    title: 動物、ペット
    gloss: 動物／ペット
    note: '*Animal* は動物一般を指す言葉で、*animal de companie*(「伴侶動物」)は特にペットを指します。複数形は *animale* です(*un animal*、*două animale*)。'
    example_gloss:
    - 犬は動物です。
    - 犬はペットでもあります。
  ro.a1.unit32.lesson01.teach.cainele_pisica:
    title: 犬と猫
    gloss: 犬／猫
    example_gloss:
    - アナは犬を飼っています。
    - アンドレイは猫を飼っています。
  ro.a1.unit32.lesson01.teach.pestele_pasarea:
    title: 魚と鳥
    gloss: 魚／鳥
    example_gloss:
    - おじいさんは魚を飼っています。
    - Ninaは鳥を飼っています。
  ro.a1.unit32.lesson01.teach.ai_un_animal:
    title: ペットを飼っていますか？
    gloss: ペットを飼っていますか？
    note: すでに知っている *Ai ...?* の質問の型です。*a avea*(持つ)+ 名詞になります。
  ro.a1.unit32.lesson01.teach.da_am_un:
    title: はい、犬を飼っています
    gloss: はい、犬を飼っています。
    note: このユニットの新しい語彙を使った、簡単な肯定の答えです。
  ro.a1.unit32.lesson01.teach.nu_nu_am:
    title: いいえ、ペットは飼っていません
    gloss: いいえ、ペットは飼っていません。
    note: '*nu am* の後ろでは、*niciun*(「1つも〜ない」)が名詞を否定します。文法メモを見てください。'
  ro.a1.unit32.lesson01.teach.la_negatie_nu:
    title: Nu am:冠詞なし
    gloss: nu am の後ろには un や o は使いません:Nu am timp, nu am niciun animal de companie.
    note: '*Nu am timp* ですでに学んだ型と同じです。新しい文法ではなく、新しい名詞に当てはめるだけです。'
  ro.a1.unit32.lesson02.teach.a_scoate_la:
    title: （動物を）散歩させる
    gloss: （動物を）散歩させる
    note: '*A scoate la plimbare* は決まった言い回しです。文法メモを見てください。'
    example_gloss: 私は毎日犬を散歩させます。
  ro.a1.unit32.lesson02.teach.verbul_se_schimba:
    title: 動詞は人称によって変わる
    gloss: 動詞は人称によって変わります:eu scot, tu scoți, el scoate(私は、あなたは、彼は)犬を散歩に連れて行く。
    note: ルーマニア語の動詞は人称ごとに語尾が変わるので、*a scoate la plimbare* は1つの動詞として活用します:*scot*、*scoți*、*scoate*。
  ro.a1.unit32.lesson02.teach.a_da_de:
    title: 餌を与える
    gloss: 餌をあげる
    example_gloss: 私は毎日猫に餌をあげます。
  ro.a1.unit32.lesson02.teach.a_se_juca:
    title: ～と遊ぶ
    gloss: ～と遊ぶ
    example_gloss: アンドレイは自分の猫と遊びます。
  ro.a1.unit32.lesson02.teach.scot_cainele_la:
    title: 私は毎日犬を散歩させます
    gloss: 私は毎日犬を散歩させます。
    note: '*a scoate la plimbare* と、前の単元で学んだ *în fiecare zi*(毎日)を組み合わせた文です。'
  ro.a1.unit32.lesson02.teach.dau_de_mancare:
    title: 私は毎日猫に餌を与えます
    gloss: 私は毎日猫に餌をあげます。
    note: '*a da de mâncare* と *în fiecare zi* を組み合わせた文です。動物は与格になります:*pisicii*。'
  ro.a1.unit32.lesson03.teach.plural_caine_caini:
    title: 'Plural: câine → câini'
    gloss: 複数形:câine → câini, animal → animale, pisică → pisici.
    note: 規則的なルーマニア語の複数形のパターンです。ここで初めて、動物の名詞を例にして学びます。
  ro.a1.unit32.lesson03.teach.caini_pisici:
    title: 犬と猫
    gloss: 犬／猫
    example_gloss:
    - ミハイは犬が大好きです。
    - エレナは猫が大好きです。
  ro.a1.unit32.lesson03.teach.pesti_pasari:
    title: 魚と鳥（複数形）
    gloss: 魚／鳥
    example_gloss:
    - 私は魚が大好きです。
    - おじいさんは鳥が大好きです。
  ro.a1.unit32.lesson03.teach.iubesc_animalele:
    title: 私は動物が大好きです
    gloss: 私は動物が大好きです。
    note: '*A iubi*(「愛する」)は前置詞なしで目的語を取ります:*Iubesc animalele*。冠詞 *-le* は、動物全般を指していることを表します。'
  ro.a1.unit32.lesson03.teach.elena_iubeste_pisicile:
    title: エレナは猫が好きだけれど、ペットはいない
    gloss: エレナは猫が大好きですが、ペットは飼っていません。
    note: 第5課の読解の中心となる対比を示しています。
  ro.a1.unit32.lesson04.teach.mihai_ai_un:
    title: ミハイがペットについてたずねる
    gloss: ミハイ:アナ、ペットを飼っていますか?
  ro.a1.unit32.lesson04.teach.ana_da_am:
    title: アナは犬を飼っています
    gloss: アナ:はい、犬を飼っています。
  ro.a1.unit32.lesson04.teach.mihai_cum_arata:
    title: ミハイがどんな見た目か尋ねる
    gloss: ミハイ:どんな見た目ですか?
    note: 外見の単元で学んだ *Cum arată ...?* という質問を、今度は動物について使っています。
  ro.a1.unit32.lesson04.teach.ana_are_blana:
    title: アナが自分の犬を説明する
    gloss: アナ:茶色い毛で、小さいです。
    note: 外見についてのユニットで学んだ髪の色や大きさの語彙を、人の髪ではなく動物の毛の説明に使っています。
  ro.a1.unit32.lesson04.teach.pentru_un_animal:
    title: 動物に使う el と ea
    gloss: 動物には性に応じて el か ea を使います。câinele は el、pisica は ea です。
    note: このコースでこれまで *el* と *ea* は人を指していましたが、ここでは名詞の性に合わせて動物にも使います。
  ro.a1.unit32.lesson04.teach.mihai_il_scoti:
    title: ミハイが散歩について尋ねる
    gloss: ミハイ:毎日散歩に連れて行っていますか?
  ro.a1.unit32.lesson04.teach.ana_da_il:
    title: アナが毎日の世話を説明する
    gloss: アナ:はい、毎日散歩に連れて行って、ごはんもあげています。
  ro.a1.unit32.lesson05.teach.mihai_si_elena:
    title: ミハイ、エレナ、アンドレイの動物の話
    gloss: ミハイとエレナは二人とも動物が大好きですが、どちらもペットを飼っていません。ミハイは犬が好きで、エレナは猫が好きです。一方アンドレイはペットを飼っています。猫です。よく猫と遊び、毎日ごはんをあげています。あなたはペットを飼っていますか?
    note: 動物が好きなことと、実際に飼っていることの違いを対比しています。これがこの学習目標で伝えたいポイントです。
    glosses:
      iubesc: 愛する
      amândoi: 両方とも
      animalele: 動物
      doi: 両方とも
      companie: ペット
      câinii: 犬たち
      pisicile: 猫たち
      pisică: 猫
      joacă: 遊ぶ
      dă: 与える
      fiecare: 毎～
      mâncare: 餌
  ro.a1.unit32.lesson05.teach.andrei_se_joaca:
    title: アンドレイはよく猫と遊びます
    gloss: アンドレイはよく自分の猫と遊びます。
    note: '*Des*(よく)は趣味の単元で学んだ頻度を表す語です。*a se juca cu*(「〜と遊ぶ」)は再帰動詞です。'
  ro.a1.unit32.lesson05.teach.iubesc_cainii_nu:
    title: 私は犬が大好きです。ペットは飼っていません。
    gloss: 私は犬が大好きです。ペットは飼っていません。
    note: このユニットの作文問題でそのまま応用できる、二文からなる解答例です。
  ro.a1.unit32.lesson06.teach.ana_nina_ai:
    title: アナがニナに尋ねる
    gloss: アナ:ニナ、あなたもペットを飼っていますか?
  ro.a1.unit32.lesson06.teach.nina_da_am:
    title: NinaはPicoという鳥を飼っています
    gloss: 'Nina: はい、鳥を飼っています。名前はPicoです。'
    note: '*O cheamă*(「名前は〜です」)は名前を言う動詞 *a chema* をまた使っています。鳥は女性名詞なので、代名詞は *o* です。'
  ro.a1.unit32.lesson06.teach.mihai_ce_frumos:
    title: ミハイが反応する
    gloss: 'Mihai: すてき!毎日その子と何をしていますか。'
  ro.a1.unit32.lesson06.teach.nina_ii_dau:
    title: Ninaは毎日小鳥に餌をあげます
    gloss: 'Nina: 毎日餌をあげています。'
  ro.a1.unit32.lesson06.teach.mihai_iubesc_si:
    title: ミハイも鳥が大好き
    gloss: ミハイ:私も鳥が大好きです。
  ro.a1.unit32.lesson06.teach.ana_ce_frumos:
    title: アナが会話を締めくくる
    gloss: アナ:三人とも動物が好きなんて、すてきですね!
    note: このユニットで登場した三人と動物についての話をまとめて、会話を締めくくっています。
