answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's new verbs are all first-person singular (mă trezesc, mănânc, beau, lucrez, merg, mă culc) and are register-neutral -- Romanian's first-person verb form is the same regardless of tu/dumneavoastră, and this unit introduces no second-person forms. Ana and Mihai's closing dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08/unit09.
course:
  title: ルーマニア語 A1
  description: ルーマニア語で簡単な毎日の生活を表現します。mă trezesc(起きます)、mănânc / beau(食べます/飲みます)、lucrez(働きます)、merg acasă(家に帰ります)、mă culc(寝ます)。アナがミハイに一日のことをたずねる、二人の物語の続きです。
units:
  ro.a1.unit10.routines:
    title: 毎日の生活
lessons:
  ro.a1.unit10.lesson01.dimineata:
    title: 朝に
  ro.a1.unit10.lesson02.lucrez_merg_acasa:
    title: 働く、家に帰る
  ro.a1.unit10.lesson03.rutina_mihai:
    title: ミハイの一日
teaching:
  ro.a1.unit10.lesson01.teach.reminder_dimineata_seara_noaptea_cafea_paine:
    title: 復習:dimineața, seara, noaptea, cafea, pâine
    gloss: dimineața(朝に)· seara(夕方に)· noaptea(夜に)· cafea(コーヒー)· pâine(パン)
    note: どれもすでに学んだ語です。dimineața/seara/noaptea はユニット4、cafea/pâine はユニット6で学びました。ここでは、このユニットの毎日の生活の文の中で組み合わせます。
  ro.a1.unit10.lesson01.teach.ma_trezesc_vocab:
    title: 起きます
    gloss: Mă trezesc(起きます)
    note: '*Mă* は、*mă numesc* や *mă cheamă* ですでに出てきた再帰代名詞です。ルーマニア語では「起きる」を再帰動詞で表し、直訳すると「私は自分を起こす」になります。'
    example_gloss:
    - 朝に起きます。
  ro.a1.unit10.lesson01.teach.ma_trezesc_phrase:
    title: 朝に起きます
    gloss: Mă trezesc dimineața.(朝に起きます。)
    note: 短くて完結した文です。毎日の生活を表す、もっとも簡単な文です。
  ro.a1.unit10.lesson01.teach.mananc_vocab:
    title: 食べます
    gloss: 私は食べます
    note: 「私は」にあたる代名詞は不要です。ルーマニア語では動詞の語尾で誰が話しているかが分かります。*vreau*/*cumpăr*/*aș dori*で見たパターンと同じです。
    example_gloss:
    - 朝にパンを食べます。
  ro.a1.unit10.lesson01.teach.beau_vocab:
    title: 飲みます
    gloss: 私は飲みます
    note: すでに知っている*cafea*や*ceai*などの飲み物とよく合います。
    example_gloss:
    - 私は朝にコーヒーを飲みます。
  ro.a1.unit10.lesson01.teach.mananc_beau_phrase:
    title: 朝はパンを食べてコーヒーを飲みます
    gloss: 朝はパンを食べてコーヒーを飲みます。
    note: '*și*(〜と、そして)で二つの動作をつなぎます。Unit 4の*ora unu și jumătate*で既に出てきました。'
  ro.a1.unit10.lesson02.teach.lucrez_vocab:
    title: 働きます
    gloss: 私は働きます
    note: '*lucrează*の一人称の形です。Unit 4でミハイの夕方の仕事を説明するときに出てきました。'
    example_gloss:
    - 夕方に働きます。
  ro.a1.unit10.lesson02.teach.lucrez_phrase:
    title: 夕方に働きます
    gloss: 夕方に働きます。
    note: いつ働くかを伝える、短くて完結した文です。
  ro.a1.unit10.lesson02.teach.merg_vocab:
    title: 行きます
    gloss: 私は行きます
    note: 以前学んだ命令形の*mergeți*の一人称の形です。同じ動詞で、人称が違うだけです。
    example_gloss:
    - 家に帰ります。
  ro.a1.unit10.lesson02.teach.acasa_vocab:
    title: 住まい
    gloss: 家へ、家に
    note: 前置詞を付けずに使います。*merg acasă*と言い、*merg la acasă*とは言いません。日本語の「家に帰る」の「に」にあたる語は不要だと覚えてください。
    example_gloss:
    - 夜に家に帰ります。
  ro.a1.unit10.lesson02.teach.merg_acasa_phrase:
    title: 夜に家に帰ります
    gloss: 夜に家に帰ります。
    note: 短くて完結した文です。一日の仕事の自然な締めくくりです。
  ro.a1.unit10.lesson02.teach.lucrez_merg_phrase:
    title: 夕方に働いて、夜に家に帰ります
    gloss: 夕方に働いて、夜に家に帰ります。
    note: このレッスンの二つの文を*și*で一つの文にまとめています。
  ro.a1.unit10.lesson03.teach.reminder_cursul_incepe_ora_apoi:
    title: 復習:cursul、începe、la ora nouă、apoi
    gloss: cursul(授業)・începe(始まる)・la ora nouă(9時に)・apoi(それから)
    note: Cursul/începe/la ora nouă はUnit 4で既習です(ミハイの授業は朝9時に始まります)。apoiはUnit 9で既習です。ここではそれらを組み合わせて、ミハイ自身の一日の説明にします。
  ro.a1.unit10.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 復習:bună、mulțumesc、la revedere、da、Ana、Mihai
    gloss: bună(こんにちは)・mulțumesc(ありがとう)・la revedere(さようなら)・da(はい)・Ana、Mihai(人名)
    note: すべて前のUnitで学んだ表現です。ここではアナがミハイに一日のことを尋ねます。
  ro.a1.unit10.lesson03.teach.ma_culc_vocab:
    title: 寝ます
    gloss: 私は寝ます
    note: '*mă trezesc*と同じパターンの再帰動詞です。直訳は「自分を横にする」です。'
    example_gloss:
    - 夜に寝ます。
  ro.a1.unit10.lesson03.teach.ma_culc_phrase:
    title: 夜に寝ます
    gloss: 夜に寝ます。
    note: 一日の自然な終わりで、*mă trezesc dimineața*で始まった日課を締めくくります。
  ro.a1.unit10.lesson03.teach.line01:
    title: 挨拶して、授業がいつ始まるか尋ねる
    gloss: アナはミハイに挨拶して、授業がいつ始まるか尋ねます。
    note: Unit 4のミハイの授業についての質問をもう一度使います。
  ro.a1.unit10.lesson03.teach.line02:
    title: 授業の時間を答える
    gloss: ミハイは、授業は朝の9時に始まると言います。
    note: Unit 4でミハイが答えたのと同じ答えです。ここではより詳しい一日の日課の一部として繰り返しています。
  ro.a1.unit10.lesson03.teach.line03:
    title: 夕方のことを尋ねる
    gloss: アナは短く聞き返します。「夕方は?」
    note: 新しい疑問詞を使わずに、日課の続きを尋ねる自然で簡単な言い方です。
  ro.a1.unit10.lesson03.teach.line04:
    title: 一日の残りを説明する
    gloss: ミハイは、夕方に働いて、それから夜に寝ると言います。
    note: このUnitの*lucrez*と*mă culc*を*apoi*でつないでいます。ミハイが夕方に働くというUnit 4の事実とも合っています。
  ro.a1.unit10.lesson03.teach.line05:
    title: お礼を言って終える
    gloss: アナは「いいね!」と言って、ミハイにお礼を言い、別れの挨拶をします。
    note: Unit 1、Unit 8、Unit 9の会話でも使った、同じお礼の締めくくりです。
  ro.a1.unit10.lesson03.teach.line06:
    title: 会話を締めくくる
    gloss: ミハイはアナの名前を呼んで、さようならと返します。
    note: これまでのどのUnitの会話でも使ってきた、親しみのある同じ締めくくりです。
