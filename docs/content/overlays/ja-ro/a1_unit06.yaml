  notes: 'Derived from en-ro by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Japanese string was translated and adapted. Needs native Japanese review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's "Vă rog" (formal, sourced) and "Te rog" (informal, freshly authored) are register-sensitive parallels, matching ユニット2's ai/aveți and ユニット5's ai frați/aveți frați pattern -- accept either register for a general "please" unless an exercise explicitly names one. Ana and Mihai's closing café dialogue keeps their existing polite register with each other (both use "vă rog," not "te rog").
course:
  title: ルーマニア語 A1
  description: ルーマニア語で食べ物や飲み物を注文します。コーヒー、紅茶、パンなどを、注文の基本表現「Aș dori ...」(…をください)と、丁寧さを表す vă rog / te rog を使って学びます。アナとミハイがカフェで会う場面の続きです。
units:
  ro.a1.unit06.food:
    title: 食べ物と飲み物
lessons:
  ro.a1.unit06.lesson01.bauturi:
    title: 飲み物
  ro.a1.unit06.lesson02.va_rog_si_mancare:
    title: 「お願いします」と食べ物
  ro.a1.unit06.lesson03.la_cafenea:
    title: カフェで
teaching:
  ro.a1.unit06.lesson01.teach.reminder_un_o_si:
    title: おさらい：un, o, și
    gloss: un/o(ひとつの)· și(と、そして)
    note: 3つとも前のユニットで登場済みです(*și* はユニット1、*o* はユニット2、*un* はユニット4)。ここでは食べ物と飲み物の話題で再登場します。
  ro.a1.unit06.lesson01.teach.as_dori:
    title: 〜をください
    gloss: Aș dori ...(…をください)
    note: ルーマニア語で何かを注文するときの、日常的で丁寧な表現です。固定の条件法の形で、後に続く語によって変わりません。
  ro.a1.unit06.lesson01.teach.apa:
    title: 水
    gloss: apă(水)
    note: 女性名詞です。量を特に示さないときは冠詞を付けません。
    example_gloss: 水をください。
  ro.a1.unit06.lesson01.teach.cafea:
    title: コーヒー
    gloss: cafea(コーヒー)
    note: 女性名詞なので、他の女性名詞と同じように *o*(「ひとつの」)と一緒に使います。
    example_gloss: コーヒーをください。
  ro.a1.unit06.lesson01.teach.ceai:
    title: 紅茶
    gloss: ceai(紅茶)
    note: '*o* ではなく *un*(「ひとつの」)と使います。ceai は男性・中性名詞です。'
    example_gloss: 紅茶をください。
  ro.a1.unit06.lesson01.teach.suc:
    title: ジュース
    gloss: suc(ジュース)
    note: こちらも *un* が付きます。ceai と同じパターンです。
    example_gloss: ジュースをください。
  ro.a1.unit06.lesson01.teach.lapte:
    title: 牛乳
    gloss: lapte(牛乳)
    note: apă と同じく、量を特に示さないときは普通、冠詞なしで言います。
    example_gloss: 牛乳をください。
  ro.a1.unit06.lesson01.teach.mi_e_sete:
    title: のどが渇いています
    gloss: Mi-e sete(のどが渇いています)
    note: 決まった言い回しです。直訳すると「私には渇きがある」に近く、「私は渇いている」という形ではありません。
  ro.a1.unit06.lesson01.teach.as_dori_o_cafea:
    title: コーヒーをください
    gloss: コーヒーをください。
    note: 注文の表現と女性名詞の飲み物を組み合わせた、ひとつの完全な文です。
  ro.a1.unit06.lesson02.teach.reminder_multumesc_bine_da_nu:
    title: おさらい：mulțumesc, bine, da, nu
    gloss: mulțumesc(ありがとう)· bine(よい、元気)· da(はい)· nu(いいえ)
    note: '*Mulțumesc* と *bine* はユニット1のあいさつ、*da* と *nu* はユニット3とユニット5で登場しました。ここでは食べ物や丁寧な表現の場面で再登場します。'
  ro.a1.unit06.lesson02.teach.mi_e_foame:
    title: お腹がすいています
    gloss: Mi-e foame(お腹がすいています)
    note: '*Mi-e sete* と同じ固定表現のパターンで、sete(渇き)の代わりに foame(空腹)を使います。'
  ro.a1.unit06.lesson02.teach.paine:
    title: パン
    gloss: pâine(パン)
    note: 普通は冠詞なしで言います。
    example_gloss: お腹がすいています。パンをください。
  ro.a1.unit06.lesson02.teach.mancare:
    title: 食べ物
    gloss: mâncare(食べ物)
    note: 「食べ物」を表す一般的な語で、特定の料理を指すわけではありません。
    example_gloss: 食べ物をください。
  ro.a1.unit06.lesson02.teach.carne:
    title: 肉
    gloss: carne(肉)
    note: 「肉」を表す一般的な語です。種類を示すときは、後ろに種類を付けます(carne de vită、carne de porc)。
    example_gloss: 肉をください。
  ro.a1.unit06.lesson02.teach.pui:
    title: 鶏肉
    gloss: pui(鶏肉)
    note: 食べ物としての鶏肉を表す具体的な語で、一般的な carne とは区別されます。
    example_gloss: 鶏肉をください。
  ro.a1.unit06.lesson02.teach.fructe:
    title: 果物
    gloss: fructe(果物)
    note: 日常的に使われる複数形で、果物全般を表すときに使います。
    example_gloss: 果物をください。
  ro.a1.unit06.lesson02.teach.va_rog:
    title: お願いします(丁寧)
    gloss: vă rog(お願いします、丁寧)
    note: 「お願いします」の丁寧な言い方で、ユニット1・2で学んだ dumneavoastral の丁寧な話し方と対になります。
    example_gloss: コーヒーを一つ、お願いします。
  ro.a1.unit06.lesson02.teach.te_rog:
    title: お願い(くだけた言い方)
    gloss: te rog(お願い、くだけた言い方)
    note: 友達や *tu* で話しかける相手に使う日常的な形で、ユニット1の tu の話し方と対になります。
    example_gloss: 紅茶をお願い。
  ro.a1.unit06.lesson03.teach.reminder_buna_ziua_bine_la_revedere:
    title: おさらい：bună, ziua, bine, la revedere, Ana, Mihai
    gloss: bună ziua(こんにちは)· bine(よい)· la revedere(さようなら)· Ana、Mihai(名前)
    note: どれもユニット1とユニット5の会話で既に出てきました。ここではアナとミハイがカフェで再会します。
  ro.a1.unit06.lesson03.teach.line01:
    title: あいさつして空腹を伝える
    gloss: アナはミハイにあいさつして、お腹がすいていると言います。
    note: このユニットで学ぶ *Mi-e foame* を、あいさつにそのまま使っています。
  ro.a1.unit06.lesson03.teach.line02:
    title: 食べ物を注文する
    gloss: ミハイはパンと鶏肉がほしいと言います。
    note: このユニットの pâine と pui を、Aș dori と組み合わせて使っています。
  ro.a1.unit06.lesson03.teach.line03:
    title: 丁寧に飲み物を注文する
    gloss: アナはコーヒーをお願いしますと言います。
    note: Aș dori、cafea、vă rog という、このユニットで別々に学んだ3つを組み合わせています。
  ro.a1.unit06.lesson03.teach.line04:
    title: 飲み物も注文する
    gloss: ミハイは紅茶をお願いしますと言います。
    note: アナの文と同じパターンで、cafea の代わりに ceai を使います。
  ro.a1.unit06.lesson03.teach.line05:
    title: お礼を言って締めくくる
    gloss: アナはミハイにお礼を言って、別れのあいさつをします。
    note: ここでの *Mulțumesc* は、ユニット1の *Bine, mulțumesc.* と同じ語で、締めくくりのお礼です。
  ro.a1.unit06.lesson03.teach.line06:
    title: 会話を締めくくる
    gloss: ミハイもアナの名前を呼んで、さようならと返します。
    note: ユニット1とユニット5の会話も終わりに使っていた、親しみのある締めくくりと同じ形です。
