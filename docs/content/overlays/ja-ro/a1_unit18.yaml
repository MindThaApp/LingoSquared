answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (casă, apartament, cameră, dormitor, bucătărie, baie, fereastră) is used only in person-invariant third-person statements ("Ana are...", "Mihai are...", "Unde este baia?", "Casa mea este mare"). No new tu/dumneavoastră form is introduced this unit; Ana and Mihai keep their existing formal register with each other in the dialogue's greeting lines.
course:
  title: ルーマニア語 A1
  description: ルーマニア語で基本的な住まいを話す:Casă(家)、Apartament(アパート)、Cameră(部屋)、Dormitor(寝室)、Bucătărie(台所)、Baie(バスルーム)、Fereastră(窓)。ミハイがアナの家を訪れ、二人がそれぞれの住まいについて話します。
units:
  ro.a1.unit18.housing:
    title: 住まい
lessons:
  ro.a1.unit18.lesson01.casa_anei:
    title: アナの家
  ro.a1.unit18.lesson02.apartamentul_lui_mihai:
    title: ミハイのアパート
  ro.a1.unit18.lesson03.vizita_la_ana:
    title: アナの家を訪問
teaching:
  ro.a1.unit18.lesson01.teach.reminder_ana_mare:
    title: 復習:Ana、mare
    gloss: Ana(名前)・mare(大きい)
    note: Ana は登場人物の名前で、ユニット1から登場しています。*mare* はユニット5・ユニット14で学びました。このユニットでは両方を使って、アナの家を説明します。
  ro.a1.unit18.lesson01.teach.reminder_articole_trei:
    title: 復習:un、o、și、trei
    gloss: un/o(一つの)・și(と、そして)・trei(三つ)
    note: '*Un*/*o*/*și* はユニット5、*trei* はユニット2の数え方で学びました。このユニットでは四つとも使って、部屋を数えたり説明したりします。'
  ro.a1.unit18.lesson01.teach.are_vocab:
    title: 持っている
    gloss: Are(彼・彼女・それは持っている)
    note: '*a avea*(持つ)の新しい形です。*am*(私は持っている、ユニット2・ユニット5)と *aveți*(あなたは持っている、丁寧)はすでに学びました。*are* は同じ動詞の三人称の形で、誰かや何かが何を持っているかを言うときに使います。'
  ro.a1.unit18.lesson01.teach.casa_vocab:
    title: 家
    gloss: Casă(家)
    note: 人が住む場所。
    example_gloss:
    - アナは大きな家を持っています。
  ro.a1.unit18.lesson01.teach.camera_vocab:
    title: 部屋
    gloss: Cameră(部屋)
    note: 家の中の部屋を表す一般的な言葉。
    example_gloss:
    - アナは大きな部屋を持っています。
  ro.a1.unit18.lesson01.teach.camere_plural:
    title: Cameră → camere
    gloss: cameră(部屋)・camere(部屋(複数))
    note: '*cameră* の複数形は *camere* です。部屋が二つ以上のときに使います。'
  ro.a1.unit18.lesson01.teach.dormitor_vocab:
    title: 寝室
    gloss: Dormitor(寝室)
    note: 寝るための部屋。
    example_gloss:
    - アナには寝室があります。
  ro.a1.unit18.lesson01.teach.bucatarie_vocab:
    title: 台所
    gloss: Bucătărie(台所)
    note: 料理をする部屋。
    example_gloss:
    - アナには台所があります。
  ro.a1.unit18.lesson01.teach.baie_vocab:
    title: バスルーム
    gloss: Baie(バスルーム)
    note: 浴槽やシャワー、トイレがある部屋。
    example_gloss:
    - アナにはバスルームがあります。
  ro.a1.unit18.lesson01.teach.casa_mare_phrase:
    title: アナは大きな家を持っています。その家には部屋が三つあります。寝室、台所、バスルームです。
    gloss: 'Ana are o casă mare. Casa are trei camere: un dormitor, o bucătărie și o baie.'
    note: どの単語もすでに学んだか、このユニットで導入したもので、アナの家についての二つの新しい文にまとめています。*Casa* は *casă* の定冠詞つきの形で「その家」の意味です。-ă で終わる女性名詞は -ă を -a に替えます。ユニット8の *banca*(その銀行)と同じです。
  ro.a1.unit18.lesson02.teach.reminder_mihai_mic:
    title: 復習:Mihai、mic
    gloss: Mihai(名前)・mic(小さい)
    note: Mihai は登場人物の名前で、ユニット1から登場しています。*mic* はユニット14で学びました。このユニットでは両方を使って、ミハイのアパートを説明します。
  ro.a1.unit18.lesson02.teach.reminder_unde_este_doua:
    title: 復習:unde、este、două
    gloss: unde(どこ)・este(である、ある)・două(二つ、女性形)
    note: '*Unde*/*este* はユニット8・ユニット9、*două* はユニット2で学んだ「二」の女性形です。このユニットでは三つとも使って、部屋について尋ねたり数えたりします。'
  ro.a1.unit18.lesson02.teach.apartament_vocab:
    title: アパート
    gloss: Apartament(アパート)
    note: ミハイの住まい。アナの家より小さめです。
    example_gloss:
    - ミハイは小さなアパートを持っています。
  ro.a1.unit18.lesson02.teach.fereastra_vocab:
    title: 窓
    gloss: Fereastră(窓)
    note: '*Apartamentul* は *apartament* の定冠詞つきの形で「そのアパート」の意味です。子音で終わる中性名詞には -ul を付けます。ユニット8の *magazinul*(その店)と同じです。女性名詞の *casă* は代わりに *casa* になります。'
    example_gloss:
    - そのアパートには大きな窓があります。
  ro.a1.unit18.lesson02.teach.apartament_mic_phrase:
    title: ミハイは小さなアパートを持っています。部屋は二つで、寝室と台所です。
    gloss: 'Mihai are un apartament mic. Apartamentul are două camere: un dormitor și o bucătărie.'
    note: どの単語もすでに学んだか、このユニットで導入したもので、ミハイのアパートについての二つの新しい文にまとめています。
  ro.a1.unit18.lesson02.teach.unde_este_baia_phrase:
    title: バスルームはどこですか。
    gloss: Unde este baia?(バスルームはどこですか。)
    note: '*Baia* は *baie* の定冠詞つきの形で「そのバスルーム」の意味です。人の家を訪ねたときに役立つ質問です。'
  ro.a1.unit18.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 復習:Bună、Ce mai faceți?、Bine, mulțumesc
    gloss: Bună(こんにちは)・Ce mai faceți?(お元気ですか、丁寧)・Bine, mulțumesc(元気です、ありがとう)
    note: すべてユニット1の最初のあいさつで学んだ表現で、このユニットの会話の始まりにも使います。
  ro.a1.unit18.lesson03.teach.reminder_la_revedere_mea_aproape_am:
    title: 復習:La revedere、Mea、Aproape、Am
    gloss: La revedere(さようなら)・Mea(私の、女性形)・Aproape(近く)・Am(私は持っている)
    note: '*La revedere* はユニット1、*mea* はユニット5の *Mama mea*、*aproape* はユニット8・ユニット9の *Unde este...?* の答え、*am* はユニット2・ユニット5で学びました。すべて、家を訪問する会話で再び使います。'
  ro.a1.unit18.lesson03.teach.line01:
    title: アナにあいさつして調子を尋ねる
    gloss: ミハイがアナにあいさつして、調子を尋ねます。
    note: ユニット1の *Ce mai faceți?* というあいさつをもう一度使います。
  ro.a1.unit18.lesson03.teach.line02:
    title: 答えて、自分の家を説明する
    gloss: アナは答えてから、自分の家は大きくて部屋が三つあるとミハイに話します。
    note: ユニット1の *Bine, mulțumesc* と、このユニットのレッスン1のフレーズを組み合わせています。
  ro.a1.unit18.lesson03.teach.line03:
    title: バスルームの場所を尋ねる
    gloss: ミハイがアナにバスルームの場所を尋ねます。
    note: このユニットのレッスン2のフレーズをほぼそのまま使います。
  ro.a1.unit18.lesson03.teach.line04:
    title: バスルームの場所を答える
    gloss: アナは近くにあると答えます。
    note: '*baia* と *aproape* を組み合わせます。ユニット8・ユニット9で学んだ「〜はどこ?」の答え方と同じパターンです。'
  ro.a1.unit18.lesson03.teach.line05:
    title: 自分のアパートを説明して、さよならを言う
    gloss: ミハイは、小さなアパートで部屋は二つだと話してから、さよならを言います。
    note: このユニットのレッスン2のフレーズと、ユニット1の締めくくりの一言を組み合わせています。
  ro.a1.unit18.lesson03.teach.line06:
    title: さよならを言う
    gloss: アナがさよならを言います。
    note: これまでのどのユニットの会話も、この形で終わっています。
