answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (mic/mică, mai, decât) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing polite register with each other, matching every earlier unit; no new second-person form is introduced here (unlike unit13's Vă place...?).
course:
  title: ルーマニア語 A1
  description: 身近なものをルーマニア語で比べます。Mare(大きい)、Mic/Mică(小さい)、そして Mai ... decât(〜より…)という比較の表現を、アナとミハイがコーヒー、お茶、パンの大きさを比べる場面で学びます。
units:
  ro.a1.unit14.comparisons:
    title: 比較
lessons:
  ro.a1.unit14.lesson01.mare_mic:
    title: 大きい、小さい
  ro.a1.unit14.lesson02.mai_mare_mai_mica:
    title: より大きい、より小さい
  ro.a1.unit14.lesson03.cafeaua_mai_mare:
    title: どちらが大きいですか。
teaching:
  ro.a1.unit14.lesson01.teach.reminder_mare:
    title: 復習:mare
    gloss: 大きい
    note: ユニット3("literă mare"、大文字)とユニット5("o familie mare"、大家族)で既に出てきました。ここでは比べる相手の *mic/mică* と一緒に登場します。
  ro.a1.unit14.lesson01.teach.reminder_cafeaua_ceaiul_painea:
    title: 復習:cafeaua, ceaiul, pâinea, cafea, ceai
    gloss: そのコーヒー · そのお茶 · そのパン · コーヒー · お茶
    note: すべてユニット6とユニット13で学んだ語です。このユニットでは、定冠詞のついた形を大きさを比べる対象として使い、冠詞のない形はこのレッスンのマッチング問題でもう一度使います。
  ro.a1.unit14.lesson01.teach.mic_mica_vocab:
    title: 小さい
    gloss: 小さい(男性・中性) · 小さい(女性)
    note: ルーマニア語の形容詞は、説明する名詞に合わせて形が変わります。*ceai*(お茶)は男性・中性の形 *mic* をとり、*cafea*(コーヒー)と *pâine*(パン)は女性名詞なので *mică* をとります。*Mare*(大きい)は単数では男性も女性も同じ形なので、これまでこの区別は必要ありませんでした。
    example_gloss:
    - お茶は小さいです。
    - コーヒーは小さいです。
  ro.a1.unit14.lesson01.teach.ceaiul_e_mic_phrase:
    title: お茶は小さい
    gloss: お茶は小さいです。
    note: '*Ceaiul* は中性名詞なので、男性・中性の形 *mic* をとります。'
  ro.a1.unit14.lesson01.teach.cafeaua_e_mica_phrase:
    title: コーヒーは小さい
    gloss: コーヒーは小さいです。
    note: '*Cafeaua* は女性名詞なので、女性の形 *mică* をとります。'
  ro.a1.unit14.lesson01.teach.painea_e_mica_phrase:
    title: パンは小さい
    gloss: パンは小さいです。
    note: '*Pâinea* も女性名詞なので、*cafeaua* と同じように *mică* をとります。'
  ro.a1.unit14.lesson02.teach.reminder_mare_mic_mica:
    title: 復習:Mare, Mic, Mică
    gloss: 大きい · 小さい(男性・中性) · 小さい(女性)
    note: すべてこのユニットの最初のレッスンで学んだ語です。ここでは比較の形で使います。
  ro.a1.unit14.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 復習:cafeaua, ceaiul, pâinea
    gloss: そのコーヒー · そのお茶 · そのパン
    note: すべてユニット13で学んだ語で、ここでも比べる対象として使います。
  ro.a1.unit14.lesson02.teach.mai_vocab:
    title: より〜
    gloss: より〜(比較)
    note: 月の名前の *mai*(5月、ユニット3)とは別の語です。"Ce mai faceți?"(ユニット1)で見た小さな語と同じ形ですが、ここでは比較を作る語として働きます。形容詞の前に *mai* を置くと「より〜」の意味になり、これがルーマニア語で比較を作る基本の方法です。
    example_gloss:
    - コーヒーのほうが大きいです。
  ro.a1.unit14.lesson02.teach.mai_mare_phrase:
    title: コーヒーのほうが大きい
    gloss: コーヒーのほうが大きいです。
    note: '*Mai* + 形容詞だけで、ほかに変えるところはありません。'
  ro.a1.unit14.lesson02.teach.decat_vocab:
    title: 〜より
    gloss: 〜より
    note: 比較を完成させる語です。*mai* + 形容詞 + *decât* + 比べる相手、の順に並べます。
    example_gloss:
    - コーヒーはお茶より大きいです。
  ro.a1.unit14.lesson02.teach.mai_mare_decat_phrase:
    title: コーヒーはお茶より大きい
    gloss: コーヒーはお茶より大きいです。
    note: 比較の完全な型:[もの] + e + mai + [形容詞] + decât + [比べる相手]。
  ro.a1.unit14.lesson02.teach.mai_mica_decat_phrase:
    title: パンはコーヒーより小さい
    gloss: パンはコーヒーより小さいです。
    note: 同じ型で、このユニットの最初のレッスンで学んだ女性形の *mică* を使います。
  ro.a1.unit14.lesson03.teach.reminder_mai_decat_mare_mic_mica:
    title: 復習:Mai, Decât, Mare, Mic, Mică
    gloss: Mai(もっと・より〜) · Decât(〜より) · Mare(大きい) · Mic(小さい・男性/中性) · Mică(小さい・女性)
    note: すべてこのユニットのレッスン1・レッスン2で学んだ表現です。ここではアナとミハイがまとめて使います。
  ro.a1.unit14.lesson03.teach.reminder_cafeaua_ceaiul_painea:
    title: おさらい:cafeaua, ceaiul, pâinea
    gloss: cafeaua(コーヒー) · ceaiul(お茶) · pâinea(パン)
    note: すべてユニット13で学んだ語で、アナとミハイが比べる3つのものです。
  ro.a1.unit14.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: おさらい:bună, mulțumesc, la revedere, Ana, Mihai
    gloss: bună(こんにちは) · mulțumesc(ありがとう) · la revedere(さようなら) · Ana, Mihai(名前)
    note: すべてこれまでのユニットで学んだ表現です。このコースのどの会話にも使われてきた、親しみのある始まりと終わりのパターンです。
  ro.a1.unit14.lesson03.teach.line01:
    title: あいさつして大きさをたずねる
    gloss: ミハイはアナにあいさつして、コーヒーが大きいか小さいかをたずねます。
    note: このユニットの *mare sau mică*(大きいか小さいか)を使って大きさをたずねます。ユニット13の *cafea sau ceai?* と同じ、「AかBか」と選択をたずねる形です。
  ro.a1.unit14.lesson03.teach.line02:
    title: 2つの飲み物の大きさを説明する
    gloss: アナは、コーヒーは大きくて、お茶は小さいと言います。
    note: 好みではなく、大きさについての事実をそのまま述べています。この会話では、誰がどちらを好むか、注文するかは出てきません。
  ro.a1.unit14.lesson03.teach.line03:
    title: 比較を確かめる
    gloss: ミハイは、コーヒーがお茶より大きいのかたずねます。
    note: アナの2つの別々の発言(line02)を、このユニットの中心となる表現 *mai mare decât* を使って、直接の比較にしています。
  ro.a1.unit14.lesson03.teach.line04:
    title: 肯定して、パンを加える
    gloss: アナは「そうです」と答え、パンはコーヒーより小さいと言います。
    note: 3つ目の *pâinea* にも *mai ... decât* を使います。今回は「小さい」の比較の形 *mai mică* です。
  ro.a1.unit14.lesson03.teach.line05:
    title: 肯定して、お礼を言い、別れを告げる
    gloss: ミハイはパンが小さいことに同意し、アナにお礼を言って別れのあいさつをします。
    note: これまでのどのユニットの会話でも使われてきた、同じ終わり方です。
  ro.a1.unit14.lesson03.teach.line06:
    title: 会話を終える
    gloss: アナはミハイの名前を呼んで、別れのあいさつを返します。
    note: これまでのどのユニットの会話でも使われてきた、親しみのある同じ終わり方です。
