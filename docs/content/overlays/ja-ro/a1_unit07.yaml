answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: '"Vreau" (I want, plain) and "Aș dori" (I would like, polite, established in unit06) are a genuine directness contrast, not interchangeable synonyms -- accept either for a general "I want/I would like" unless an exercise explicitly names one. "Vă rog" (formal) and "te rog" (informal, both established in unit06) remain a register-sensitive pair here too. Ana and Mihai''s market dialogue keeps their existing polite register with each other (vă rog, not te rog).'
course:
  title: ルーマニア語 A1
  description: ルーマニア語で値段や量をたずねます。通貨の leu/lei、scump/ieftin、そして roșii(トマト)や cartofi(じゃがいも)など市場の品をキロ単位で買う表現を学びます。アナとミハイが市場で買い物をする場面が続きます。
units:
  ro.a1.unit07.shopping:
    title: 買い物
lessons:
  ro.a1.unit07.lesson01.cat_costa:
    title: いくらですか?
  ro.a1.unit07.lesson02.rosii_si_cartofi:
    title: トマトとじゃがいも
  ro.a1.unit07.lesson03.la_piata:
    title: 市場で
teaching:
  ro.a1.unit07.lesson01.teach.reminder_un_numere:
    title: 復習:un、doi、cinci、zece、douăzeci
    gloss: un(1つの)・doi(2)・cinci(5)・zece(10)・douăzeci(20)
    note: どれも前のユニットで学習済みです(*un* はユニット4、数字はユニット2)。ここでは値段を言うために再び登場します。
  ro.a1.unit07.lesson01.teach.cat_costa:
    title: いくらですか?
    gloss: Cât costă?(いくらですか?)
    note: ルーマニア語で値段をたずねる日常的な言い方です。後ろに品物の名前を付けるか、品物が状況から明らかなときはこのように単独で使います。
  ro.a1.unit07.lesson01.teach.leu:
    title: Leu(通貨)
    gloss: leu(ルーマニアの通貨単位。複数形は lei)
    note: ルーマニアの通貨です。Leu は単数(1レウ)で、複数形の lei は不規則です。leu に普通の語尾を付けた形ではありません。
    example_gloss: 1レウです。
  ro.a1.unit07.lesson01.teach.costa_cinci_lei:
    title: 8レイです
    gloss: Costă opt lei.(8レイです。)
    note: 2〜19のときは lei の前に余計な語は要りません。
  ro.a1.unit07.lesson01.teach.costa_douazeci_de_lei:
    title: 30レイです
    gloss: Costă treizeci de lei.(30レイです。)
    note: 20以上では、数えるものの名詞の前に *de* を入れます。ユニット2で *ani*(年・歳)について学んだのと同じ規則を、今度は *lei* に使います。
  ro.a1.unit07.lesson01.teach.leu_lei_de_rule:
    title: 規則:leu → lei と de を付けるとき
    gloss: leu → lei・2〜19:*de* なし・20以上:*de* を付ける
    note: ユニット2の *ani* の規則(câți ani ai / am treizeci de ani)とまったく同じパターンです。1つの名詞で覚えれば、lei にも同じように使えます。
  ro.a1.unit07.lesson01.teach.scump:
    title: 高い
    gloss: scump(高い)
    note: 値段が高すぎると思ったときによく使う反応の言葉です。
    example_gloss: 8レイ?高い!
  ro.a1.unit07.lesson01.teach.ieftin:
    title: 安い
    gloss: ieftin(安い)
    note: scump の反対で、お買い得な値段を表します。
    example_gloss: 1レウ?安い!
  ro.a1.unit07.lesson02.teach.reminder_un_o_si_as_dori_rog:
    title: 復習:un、o、și、aș dori、vă rog、te rog
    gloss: un/o(1つの)・și(と、そして)・aș dori(〜をいただきたいです)・vă rog(お願いします・丁寧)・te rog(お願い・親しい相手に)
    note: '*Aș dori*、*vă rog*、*te rog* はユニット6のカフェの場面で最初に登場しました。ここでは市場で再び使います。'
  ro.a1.unit07.lesson02.teach.piata:
    title: 市場
    gloss: piață(市場)
    note: 女性名詞です。新鮮な食べ物を買う、屋外または屋内の市場を指します。
    example_gloss: 市場ではいくらですか?
  ro.a1.unit07.lesson02.teach.rosii:
    title: トマト
    gloss: roșii(トマト)
    note: roșie(トマト1個)の複数形です。トマトを買うことを一般的に話すときは複数形で言います。
    example_gloss: トマトをください。
  ro.a1.unit07.lesson02.teach.cartofi:
    title: じゃがいも
    gloss: cartofi(じゃがいも)
    note: cartof(じゃがいも1個)の複数形で、roșii と同じパターンです。
    example_gloss: じゃがいもをいただきたいです。
  ro.a1.unit07.lesson02.teach.kilogram:
    title: Kilogram
    gloss: kilogram(キログラム)
    note: 野菜などを量り売りで買うときの標準的な単位です。*De* が買うものと結びつけます。kilogram *de* roșii で「トマト1キロ」です。
    example_gloss: トマト1キロ。
  ro.a1.unit07.lesson02.teach.vreau:
    title: 私は〜がほしい
    gloss: vreau(私は〜がほしい)
    note: '*aș dori*(〜をいただきたいです)よりも率直な言い方です。市場ではどちらも使えますが、vreau のほうがくだけています。'
    example_gloss: じゃがいもがほしいです。
  ro.a1.unit07.lesson02.teach.unde_pot_sa_cumpar:
    title: 〜はどこで買えますか?
    gloss: Unde pot să cumpăr roșii?(トマトはどこで買えますか?)
    note: どこで買い物をすればよいかわからないときに便利な質問です。roșii を探している別の品物に替えて使えます。
  ro.a1.unit07.lesson02.teach.cat_costa_kilogram_rosii:
    title: トマト1キロはいくらですか?
    gloss: Cât costă un kilogram de roșii?(トマト1キロはいくらですか?)
    note: Cât costă と kilogram de ... の言い方を組み合わせた、完全な質問です。
  ro.a1.unit07.lesson02.teach.vreau_kilogram_cartofi:
    title: じゃがいも1キロがほしいです
    gloss: Vreau un kilogram de cartofi.(じゃがいも1キロがほしいです。)
    note: 同じ kilogram de ... の型を、今度は質問ではなく vreau を使った文で使います。
  ro.a1.unit07.lesson03.teach.reminder_buna_multumesc_la_revedere:
    title: 復習:bună、ziua、mulțumesc、bine、la revedere、Ana、Mihai
    gloss: bună ziua(こんにちは)・mulțumesc(ありがとう)・bine(良い・元気)・la revedere(さようなら)・Ana、Mihai(人名)
    note: どれもユニット1とユニット6の会話で学習済みです。ここでアナとミハイが再会しますが、今度は市場です。
  ro.a1.unit07.lesson03.teach.line01:
    title: あいさつして値段をたずねる
    gloss: アナはミハイにあいさつして、トマト1キロの値段をたずねます。
    note: このユニットの Cât costă と、ユニット1のあいさつを組み合わせています。
  ro.a1.unit07.lesson03.teach.line02:
    title: 値段を伝える
    gloss: ミハイは8レイだと言い、安いと伝えます。
    note: このユニットの costă/opt lei/ieftin を再び使っています。
  ro.a1.unit07.lesson03.teach.line03:
    title: 丁寧に注文して品物を足す
    gloss: アナは了承して、トマト1キロを丁寧に頼み、さらにじゃがいももほしいと付け加えます。
    note: aș dori、vă rog、vreau を組み合わせた一文です。このユニットで学んだ2つの丁寧さのレベルが、一つの文に入っています。
  ro.a1.unit07.lesson03.teach.line04:
    title: 2つ目の値段を言う
    gloss: ミハイは、ジャガイモ1キロが5レイだと言います。
    note: zece(10)は第2ユニットで学んだ語で、このユニットの最初のレッスンでも復習しました。
  ro.a1.unit07.lesson03.teach.line05:
    title: お礼を言って締めくくる
    gloss: アナはミハイにお礼を言って、さよならを言います。
    note: ここでの *Mulțumesc* は締めくくりの簡単なお礼で、第1ユニットの *Bine, mulțumesc.* に出てきたのと同じ語です。
  ro.a1.unit07.lesson03.teach.line06:
    title: やり取りを終える
    gloss: ミハイは、アナの名前を呼んでさよならを返します。
    note: 第1、第5、第6ユニットの会話も終わりに使っていた、同じ親しみのある結びの言い方です。
