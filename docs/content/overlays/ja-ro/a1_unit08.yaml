answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: No new register-sensitive forms in this unit -- este (is), the core verb every sentence here uses, does not change with tu or dumneavoastră (same standing note as unit03/unit04). Ana and Mihai's neighborhood dialogue keeps their existing polite register with each other, matching unit06/unit07.
course:
  title: ルーマニア語 A1
  description: ルーマニア語で身近な場所を言い表し、位置を伝えます。Unde este...?(〜はどこですか?)でたずね、aproape(近い)か departe(遠い)かを言い、lângă(〜の隣)、vizavi de(〜の向かい)、între(〜の間)を使って簡単な地域の様子を説明します。アナとミハイが町で道を案内し合う話が続きます。
units:
  ro.a1.unit08.places:
    title: 場所
lessons:
  ro.a1.unit08.lesson01.unde_este:
    title: 〜はどこですか?
  ro.a1.unit08.lesson02.langa_vizavi_intre:
    title: 隣、向かい、間
  ro.a1.unit08.lesson03.in_cartier:
    title: 近所で
teaching:
  ro.a1.unit08.lesson01.teach.reminder_unde_este:
    title: 復習:unde, este
    gloss: unde(どこ)· este(〜です・ある)
    note: どちらもすでに出てきました。*unde* は第7ユニットの *Unde pot să cumpăr ...?* に、*este* は第3・第4ユニットから登場しています。ここでは2つが組み合わさり、このユニットの中心となる場所の質問になります。
  ro.a1.unit08.lesson01.teach.unde_este_phrase:
    title: 〜はどこですか?
    gloss: Unde este...?(〜はどこですか?)
    note: 物の場所をたずねる日常的な言い方です。*este* の後に場所の名前を置きます。文脈で場所がわかっているときは、この形だけでも使えます。
  ro.a1.unit08.lesson01.teach.gara_magazin_banca:
    title: 駅、店、銀行
    gloss: gară(駅)· magazin(店)· bancă(銀行)
    note: よく使う3つの場所です。特定の知っている場所を言うときは、どれも定冠詞が付きます:*gara*, *magazinul*, *banca*。
    example_gloss:
    - 駅はどこですか?
    - 店は近いです。
    - 銀行は遠いです。
  ro.a1.unit08.lesson01.teach.aproape_departe:
    title: 近い、遠い
    gloss: aproape(近い)· departe(遠い)
    note: 詳しい道順を言わなくても、場所がどのくらい近いか遠いかを伝えられる簡単な言い方です。
    example_gloss:
    - 店は近いです。
    - 銀行は遠いです。
  ro.a1.unit08.lesson01.teach.magazinul_aproape:
    title: 店は近い
    gloss: Magazinul este aproape.(店は近いです。)
    note: 短く完結した文です。どの場所かがわかっているときは、*aproape* の後に場所の名前は要りません。
  ro.a1.unit08.lesson01.teach.banca_departe:
    title: 銀行は遠い
    gloss: Banca este departe.(銀行は遠いです。)
    note: '*aproape* の反対の意味で、同じ簡単な型で言えます。'
  ro.a1.unit08.lesson01.teach.unde_este_gara:
    title: 駅はどこですか?
    gloss: Unde este gara?(駅はどこですか?)
    note: '*Unde este...?* と *gara* を組み合わせた、完全な質問文です。'
  ro.a1.unit08.lesson02.teach.spital_posta_biblioteca_statie:
    title: 病院、郵便局、図書館、バス停
    gloss: spital(病院)· poștă(郵便局)· bibliotecă(図書館)· stație de autobuz(バス停)
    note: よく使う場所がさらに4つです。gară/magazin/bancă と同じく、特定の場所を言うときは定冠詞が付きます:*spitalul*, *poșta*, *biblioteca*, *stația de autobuz*。
    example_gloss:
    - 病院は店の向かいにあります。
    - 郵便局は店と病院の間にあります。
    - 図書館は駅の近くにあります。
    - バス停は図書館の隣にあります。
  ro.a1.unit08.lesson02.teach.langa_vizavi_intre:
    title: 隣、向かい、間
    gloss: lângă(〜の隣)· vizavi de(〜の向かい)· între(〜の間)
    note: ある場所を別の場所を基準にして示す3つの言い方です。*Vizavi de* は *de* を含む形で、*între* は2つの場所を *și* で結びます。*lângă* は直接場所の名前につながります。
    example_gloss:
    - 店は駅の隣にあります。
    - 病院は店の向かいにあります。
    - 郵便局は店と病院の間にあります。
  ro.a1.unit08.lesson02.teach.magazinul_langa_gara:
    title: 店は駅の隣にある
    gloss: Magazinul este lângă gară.(店は駅の隣にあります。)
    note: '*Lângă* は場所の名前に直接つながり、余分な語は要りません。'
  ro.a1.unit08.lesson02.teach.spitalul_vizavi_magazin:
    title: 病院は店の向かいにある
    gloss: Spitalul este vizavi de magazin.(病院は店の向かいにあります。)
    note: '*Vizavi de* は *de* の後に、基準になる場所を置きます。'
  ro.a1.unit08.lesson02.teach.posta_intre:
    title: 郵便局は店と病院の間にある
    gloss: Poșta este între magazin și spital.(郵便局は店と病院の間にあります。)
    note: '*Între* の後には、*și*(と)で結んだ2つの場所を置きます。'
  ro.a1.unit08.lesson02.teach.statia_langa_biblioteca:
    title: バス停は図書館の隣にある
    gloss: Stația de autobuz este lângă bibliotecă.(バス停は図書館の隣にあります。)
    note: 店や駅のときと同じ *lângă* の型です。今回はバス停と図書館で使います。
  ro.a1.unit08.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 復習：bună, mulțumesc, la revedere, da, Ana, Mihai
    gloss: bună(こんにちは)・mulțumesc(ありがとう)・la revedere(さようなら)・da(はい)・Ana, Mihai(人名)
    note: どれも前のユニットで学習済みです。ここではアナとミハイが、近所で再会します。
  ro.a1.unit08.lesson03.teach.line01:
    title: あいさつして郵便局の場所をたずねる
    gloss: アナはミハイにあいさつして、郵便局がどこにあるかたずねます。
    note: このユニットの *Unde este* と、ユニット1のあいさつを組み合わせています。
  ro.a1.unit08.lesson03.teach.line02:
    title: 場所を教える
    gloss: ミハイは、郵便局は店と病院の間にあると言います。
    note: このユニットの *poșta* と *între ... și* の表現をもう一度使っています。
  ro.a1.unit08.lesson03.teach.line03:
    title: 図書館についてたずねる
    gloss: アナは図書館が近いかどうかたずねます。
    note: '*este* と *aproape* を使った短い続きの質問です。'
  ro.a1.unit08.lesson03.teach.line04:
    title: 答えて、さらに付け加える
    gloss: ミハイは、図書館は駅の近くにあると答え、バス停は図書館の隣にあると付け加えます。
    note: このユニットの前置詞 *aproape de* と *lângă* を、1つの文で一緒に使っています。
  ro.a1.unit08.lesson03.teach.line05:
    title: お礼を言って終える
    gloss: アナはミハイにお礼を言って、さようならと言います。
    note: ここでの *Mulțumesc* は、ユニット1の *Bine, mulțumesc.* と同じ、終わりのあいさつとしてのシンプルなお礼です。
  ro.a1.unit08.lesson03.teach.line06:
    title: 出会いを締めくくる
    gloss: ミハイもアナの名前を呼んで、さようならと返します。
    note: ユニット1、5、6、7の会話も、同じような親しみのある別れのあいさつで終わっていました。
