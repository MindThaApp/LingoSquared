answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's new words are all register-neutral -- mergem (first-person plural) and nu pot (first-person singular) don't change with tu/dumneavoastră, and atunci/sigur are invariant connective/response words with no person marking. No new second-person forms are introduced. Ana and Mihai's closing dialogue keeps their existing polite register with each other, matching ユニット6/unit07/unit08/unit09/unit10.
course:
  title: ルーマニア語 A1
  description: ルーマニア語で簡単な予定を提案し、受け入れ、断り、日時を決める練習をします。mergem(行きましょう/行きます)、nu pot(できません)、atunci(それなら)、sigur(もちろん)を使い、AnaとMihaiが公園で会う約束をする場面の続きです。
units:
  ro.a1.unit11.plans:
    title: 予定
lessons:
  ro.a1.unit11.lesson01.mergem_la_cinema:
    title: 映画館に行きませんか?
  ro.a1.unit11.lesson02.nu_pot_atunci:
    title: 無理です。それなら?
  ro.a1.unit11.lesson03.planul_de_duminica:
    title: 日曜日の予定
teaching:
  ro.a1.unit11.lesson01.teach.reminder_da_bine:
    title: 復習:da, bine, nu, mulțumesc
    gloss: da(はい)· bine(よい/大丈夫)· nu(いいえ)· mulțumesc(ありがとう)
    note: どれもユニット6から学んだ語です。ここでは、このユニットならではの「予定を受け入れる言い方」と、このレッスンの語彙復習のマッチング問題で組み合わせて使います。
  ro.a1.unit11.lesson01.teach.mergem_vocab:
    title: 行きましょう/行きます
    gloss: Mergem(行きましょう/行きます)
    note: '*a merge* の一人称複数形です。すでに *merg*(私は行きます、ユニット10)と *mergeți*(丁寧な命令形、ユニット9)で出てきました。同じ動詞で、人称と数が違うだけです。語尾を上げて単独で言うと、一緒に何かをしようと誘う自然な言い方になります。'
    example_gloss:
    - 映画館に行きませんか?
  ro.a1.unit11.lesson01.teach.cinema_vocab:
    title: 映画館
    gloss: Cinema(映画館)
    note: 日本語の「シネマ」とよく似ているので、覚えやすい単語です。
    example_gloss:
    - 映画館に行きませんか?
  ro.a1.unit11.lesson01.teach.mergem_cinema_phrase:
    title: 映画館に行きませんか?
    gloss: Mergem la cinema?(映画館に行きませんか?)
    note: これだけで完全な誘いの文です。「〜したいですか」のような言葉を足さなくても、疑問符(上がり調子)だけで「行く」が提案になります。
  ro.a1.unit11.lesson01.teach.parc_vocab:
    title: 公園
    gloss: Parc(公園)
    note: '*cinema* と同じく、日本語の外来語に近くてわかりやすい単語です。'
    example_gloss:
    - 公園に行きませんか?
  ro.a1.unit11.lesson01.teach.mergem_parc_phrase:
    title: 公園に行きませんか?
    gloss: Mergem la parc?(公園に行きませんか?)
    note: '*Mergem la cinema?* と同じ誘いの型で、場所だけが違います。'
  ro.a1.unit11.lesson01.teach.da_bine_phrase:
    title: はい、いいですね!
    gloss: Da, bine!(はい、いいですね!)
    note: 予定を受け入れるときの短くて自然な言い方です。すでに知っている語を新しい組み合わせで使っています。
  ro.a1.unit11.lesson02.teach.reminder_nu_pot:
    title: 復習:nu, pot
    gloss: nu(いいえ/〜ない)· pot(私はできます)
    note: '*nu* はユニット6、pot はユニット9の *cum pot să ajung*(どうやって行けますか)で学びました。動詞の前に置くと nu は「〜ない」の意味になり、*nu pot* は「できません」です。このユニットでの、予定の断り方です。'
  ro.a1.unit11.lesson02.teach.reminder_sambata_duminica:
    title: 復習:sâmbătă, duminică
    gloss: sâmbătă(土曜日)· duminică(日曜日)
    note: どちらもユニット3の曜日で学んだ語です。
  ro.a1.unit11.lesson02.teach.mergem_parc_sambata_phrase:
    title: 土曜日に公園に行きませんか?
    gloss: Mergem la parc sâmbătă?(土曜日に公園に行きませんか?)
    note: レッスン1の誘いの文に曜日を加えた形です。*Mergem la parc?* に曜日の名前を組み合わせています。
  ro.a1.unit11.lesson02.teach.nu_pot_sambata_phrase:
    title: 土曜日は無理です
    gloss: Nu pot sâmbătă.(土曜日は無理です。)
    note: シンプルな断り方です。*nu pot* に、都合の悪い曜日を続けます。
  ro.a1.unit11.lesson02.teach.atunci_vocab:
    title: それなら
    gloss: Atunci(それなら)
    note: ユニット9の *apoi*(「それから」、2つの動作を順に並べる語)とは違います。*atunci* は別の案を出したり、前の話を受けて結論を述べたりする語で、日程を変えるときの「それなら〜はどうですか」にぴったりです。
    example_gloss:
    - それなら、日曜日は?
  ro.a1.unit11.lesson02.teach.atunci_duminica_phrase:
    title: それなら、日曜日は?
    gloss: Atunci, duminică?(それなら、日曜日は?)
    note: 断られたあとの短い代案です。新しい曜日を言うだけで十分で、誘いの文をもう一度全部言う必要はありません。
  ro.a1.unit11.lesson02.teach.da_bine_duminica_phrase:
    title: はい、いいですね!日曜日に。
    gloss: Da, bine! Duminică.(はい、いいですね!日曜日に。)
    note: 変更された日を受け入れる言い方で、レッスン1の *Da, bine!* と同じ短い型です。
  ro.a1.unit11.lesson03.teach.reminder_la_ce_ora_la_ora_patru:
    title: 復習:la ce oră, la ora, patru
    gloss: la ce oră(何時に)· la ora(〜時に)· patru(4)
    note: la ce oră と la ora はユニット4(時刻のたずね方と答え方)、patru はユニット2の数字で学びました。ここでは、会う時間を決めるために組み合わせて使います。
  ro.a1.unit11.lesson03.teach.reminder_buna_multumesc_la_revedere_da_ana_mihai:
    title: 復習:bună, mulțumesc, la revedere, da, Ana, Mihai
    gloss: bună(こんにちは)· mulțumesc(ありがとう)· la revedere(さようなら)· da(はい)· Ana, Mihai(人名)
    note: どれも前のユニットで学んだ語です。ここではAnaとMihaiが、約束の時間を決めます。
  ro.a1.unit11.lesson03.teach.sigur_vocab:
    title: もちろん
    gloss: Sigur(もちろん)
    note: 日本語の「もちろん」「いいですよ」のように、単独で約束を確認できるよく使う言い方です。
    example_gloss:
    - もちろん!4時ですね。
  ro.a1.unit11.lesson03.teach.sigur_phrase:
    title: もちろん!4時ですね。
    gloss: Sigur! La ora patru.(もちろん!4時ですね。)
    note: 約束と正確な時間を、短い返事ひとつで確認しています。
  ro.a1.unit11.lesson03.teach.line01:
    title: 挨拶して公園に誘う
    gloss: AnaはMihaiに挨拶して、日曜日に公園へ行かないかと誘います。
    note: このユニットの誘いの文 *Mergem la parc?* に *duminică* を組み合わせています。
  ro.a1.unit11.lesson03.teach.line02:
    title: 承諾して時間をたずねる
    gloss: Mihaiは受け入れて、何時かをたずねます。
    note: ユニット4の *La ce oră?* の質問をもう一度使っています。
  ro.a1.unit11.lesson03.teach.line03:
    title: 時間を提案する
    gloss: Anaは4時を提案します。
    note: 短い疑問文で、ユニット4の *la ora* の型に、このユニットの *patru* を合わせています。
  ro.a1.unit11.lesson03.teach.line04:
    title: 了承してお礼を言う
    gloss: Mihaiは「もちろん!」と答えて、Anaにお礼を言います。
    note: このユニットの *sigur* と、既習の *mulțumesc* を組み合わせています。
  ro.a1.unit11.lesson03.teach.line05:
    title: 別れの挨拶をする
    gloss: Anaが別れの挨拶をします。
    note: これまでのどのユニットの会話でも、最後に使ってきた同じ型です。
  ro.a1.unit11.lesson03.teach.line06:
    title: 会話を締めくくる
    gloss: MihaiもAnaの名前を呼んで、別れの挨拶を返します。
    note: これまでのどのユニットの会話でも、最後に使ってきた親しみのある同じ型です。
