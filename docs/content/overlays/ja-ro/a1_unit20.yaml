  ro.a1.unit20.lesson03.la_magazin:
    title: お店で
teaching:
  ro.a1.unit20.lesson01.teach.reminder_vreau_un_ce:
    title: 復習：Vreau、Un、Ce
    gloss: Vreau(欲しいです)· Un(ひとつの、男性・中性)· Ce(何の)
    note: '*Vreau*(欲しいです)、*un*(ひとつの)、*ce*(何、*Ce mai faceți?* のように)はすでに知っている単語です。ここでは服を頼むときに再利用します。'
  ro.a1.unit20.lesson01.teach.tricou_vocab:
    title: Tシャツ
    gloss: Tricou(Tシャツ)
    note: 中性名詞です。すでに出てきた *un leu* など他の男性名詞・中性名詞と同じく、*o* ではなく *un* を使います。
    example_gloss:
    - Tシャツが欲しいです。
  ro.a1.unit20.lesson01.teach.culoare_vocab:
    title: 色
    gloss: Culoare(色)
    note: 女性名詞です。何色があるかを尋ねるときに便利です。
    example_gloss:
    - 何色ですか？
  ro.a1.unit20.lesson01.teach.rosu_vocab:
    title: 赤
    gloss: Roșu(赤)
    note: 説明する名詞の後ろに置きます。これがルーマニア語の普通の形容詞の語順です。*tricou roșu* は、直訳すると「Tシャツ 赤」です。
    example_gloss:
    - 赤いTシャツが欲しいです。
  ro.a1.unit20.lesson01.teach.albastru_vocab:
    title: 青
    gloss: Albastru(青)
    note: '*roșu* と同じ型で、名詞の後ろに置きます：*tricou albastru*。'
    example_gloss:
    - 青いTシャツが欲しいです。
  ro.a1.unit20.lesson01.teach.vreau_tricou_rosu_phrase:
    title: 赤いTシャツが欲しいです。
    gloss: Vreau un tricou roșu.
    note: 基本の頼み方です。*vreau*(欲しいです)+ *un tricou*(Tシャツ)+ *roșu*(赤)で、色は名詞の後ろに置きます。
  ro.a1.unit20.lesson02.teach.reminder_cat_costa_va_rog:
    title: 復習：Cât、Costă、Vă、Rog
    gloss: Cât costă?(いくらですか？)· Vă rog(お願いします、丁寧な言い方)
    note: '*Cât costă?* は市場のレッスンで学んだ表現で、*vă rog* は丁寧な「お願いします」です。ここでは服の値段を尋ねたり、頼み方を丁寧にしたりするために再利用します。'
  ro.a1.unit20.lesson02.teach.reminder_mic_mica_mare:
    title: 復習：Mic、Mică、Mare
    gloss: Mic/Mică(小さい、男性・中性/女性)· Mare(大きい、男性・女性の単数で同じ形)
    note: 食べ物や飲み物を比べるときにすでに学んだ大きさの言葉です。ここでは服のサイズに再利用します。
  ro.a1.unit20.lesson02.teach.pantaloni_vocab:
    title: ズボン
    gloss: Pantaloni(ズボン)
    note: ルーマニア語では普通、複数形で使います。*pantaloni* で1本(1着)のズボンを表します。
    example_gloss:
    - ズボンが欲しいです。
  ro.a1.unit20.lesson02.teach.marime_vocab:
    title: サイズ
    gloss: Mărime(サイズ)
    note: 女性名詞です。上で復習した女性形の *mică*(小さい)や、形の変わらない *mare*(大きい)と組み合わせます。
    example_gloss:
    - 何サイズですか？
  ro.a1.unit20.lesson02.teach.ce_marime_phrase:
    title: 何サイズですか？
    gloss: Ce mărime?(サイズは？)
    note: 店のカウンターでよく使う質問です。短く動詞がなく、*Ce culoare?*(何色？)と同じ省略した形です。
  ro.a1.unit20.lesson02.teach.marime_mica_va_rog_phrase:
    title: 小さいサイズをお願いします。
    gloss: 小さいサイズをお願いします。
    note: '*Mică* は *mic* の女性形で、女性名詞 *mărime* に合わせた形です。覚えた *vă rog* と組み合わせて、丁寧にサイズを伝えます。'
  ro.a1.unit20.lesson02.teach.cat_costa_pantalonii_phrase:
    title: ズボンはいくらですか？
    gloss: ズボンはいくらですか？
    note: '*Pantalonii* は *pantaloni*(ズボン)に定冠詞がついた形です。男性複数名詞は *-i* を付けて定冠詞を表します(*pantaloni* → *pantalonii*)。復習した *cât costă* と組み合わせます。'
  ro.a1.unit20.lesson03.teach.reminder_buna_multumesc_bine_la_revedere_si:
    title: 復習：Bună, Mulțumesc, Bine, La revedere, Și
    gloss: Bună(こんにちは)· Mulțumesc(ありがとう)· Bine(よい/元気)· La revedere(さようなら)· Și(と、そして)
    note: 日常のあいさつと *și*(〜と、そして)です。ここでは店での会話の始めと終わりに使います。
  ro.a1.unit20.lesson03.teach.reminder_zece_douazeci_de_lei:
    title: 復習：Zece, Douăzeci, De, Lei
    gloss: Zece(10)· Douăzeci(20)· De(〜の。20以上の数で lei の前に使う)· Lei(通貨。leu の複数形)
    note: すでに学んだ数と通貨 *leu/lei* です。ここではTシャツとズボンの値段に使います。
  ro.a1.unit20.lesson03.teach.line01:
    title: ミハイにあいさつして、赤いTシャツがほしいと言う
    gloss: アナはミハイにあいさつして、赤いTシャツがほしいと言います。
    note: 最初のレッスンで学んだ、ほしいものを伝える表現です：*Vreau un tricou roșu.*
  ro.a1.unit20.lesson03.teach.line02:
    title: サイズをたずねる
    gloss: ミハイはどのサイズかをたずねます。
    note: 店でよく使う質問 *Ce mărime?*(どのサイズですか？)です。
  ro.a1.unit20.lesson03.teach.line03:
    title: サイズを丁寧に伝えて、値段をたずねる
    gloss: アナは小さいサイズを頼み、それからいくらかをたずねます。
    note: '*Mărime mică, vă rog*(小さいサイズをお願いします)、続いて *Cât costă?*(いくらですか？)です。'
  ro.a1.unit20.lesson03.teach.line04:
    title: 値段を伝える
    gloss: ミハイは50レイだと言います。
    note: 復習した *cincizeci de lei* を使います。
  ro.a1.unit20.lesson03.teach.line05:
    title: 承諾して、ズボンの値段もたずねる
    gloss: アナは承諾し、ズボンもほしいと言って、その値段をたずねます。
    note: ここでの *Și* は「も」の意味です：*Vreau și pantaloni* は「ズボンもほしいです」。
  ro.a1.unit20.lesson03.teach.line06:
    title: ズボンの値段を伝える
    gloss: ミハイはズボンが120レイだと言います。
    note: 20以上の数では、ルーマニア語は数と名詞の間に *de* を入れます：*o sută douăzeci de lei*。
  ro.a1.unit20.lesson03.teach.line07:
    title: ミハイにお礼を言って、別れのあいさつをする
    gloss: アナはお礼を言って、別れのあいさつをします。
    note: 丁寧なお礼と別れのあいさつです。
  ro.a1.unit20.lesson03.teach.line08:
    title: 別れのあいさつをする
    gloss: ミハイが別れのあいさつをします。
    note: アナの名前を添えた、簡単な別れのあいさつです。
