answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit introduces the course's first imperative form, "Mergeți" (go) -- the dumneavoastră/formal-plural imperative, matching the course's established dumneavoastră-as-safe-default policy. No tu-register imperative is taught or accepted here. Ana and Mihai's direction-giving dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08.
course:
  title: ルーマニア語 A1
  description: ルーマニア語で短い道案内をたずねたり、聞いて理解したりします。Cum pot să ajung...?(…へはどうやって行けばいいですか?)、Mergeți înainte(まっすぐ行ってください)、la dreapta / la stânga(右へ/左へ)、aici / acolo(ここ/あそこ)を学びます。アナがミハイに駅への行き方をたずねる場面で、二人の話が続きます。
units:
  ro.a1.unit09.directions:
    title: 道案内
lessons:
  ro.a1.unit09.lesson01.cum_ajung:
    title: …へはどうやって行けばいいですか?
  ro.a1.unit09.lesson02.dreapta_stanga:
    title: 右へ、左へ
  ro.a1.unit09.lesson03.pe_strada:
    title: 通りで
teaching:
  ro.a1.unit09.lesson01.teach.reminder_unde_este_locuri:
    title: 復習:unde, este, gară, magazin, bancă, aproape
    gloss: unde(どこ)・este(です・ある)・gară(駅)・magazin(店)・bancă(銀行)・aproape(近い)
    note: どれも学習済みです。unde はユニット7、este はユニット3・4、gară/magazin/bancă/aproape はユニット8で出てきました。ここでは、このユニットの道をたずねる質問や例文の中で組み合わせて使います。
  ro.a1.unit09.lesson01.teach.cum_pot_sa_ajung:
    title: …へはどうやって行けばいいですか?
    gloss: Cum pot să ajung...?(…へはどうやって行けばいいですか?)
    note: 場所への行き方をたずねるときの、ふだんよく使う言い方です。*pot*(できる)はユニット7の *Unde pot să cumpăr...?* にすでに出てきました。*ajung*(着く)は新しい語です。
  ro.a1.unit09.lesson01.teach.mergeti_vocab:
    title: 行ってください
    gloss: Mergeți(行ってください:丁寧な命令形)
    note: '*Mergeți* は dumneavoastră(丁寧な二人称)で使う命令形です。人に丁寧に「行ってください」と言う形で、アナとミハイがすでにお互いに使っている話し方に合っています。'
    example_gloss:
    - まっすぐ行ってください。
  ro.a1.unit09.lesson01.teach.inainte_vocab:
    title: まっすぐ
    gloss: înainte(まっすぐ)
    note: '*Mergeți* と組み合わせて、いちばん簡単な道案内になります。'
    example_gloss:
    - まっすぐ行ってください。
  ro.a1.unit09.lesson01.teach.mergeti_inainte_phrase:
    title: まっすぐ行く
    gloss: Mergeți înainte.(まっすぐ行ってください。)
    note: 短くても完結した道案内で、*Cum pot să ajung...?* へのいちばん簡単な答えです。
  ro.a1.unit09.lesson01.teach.cum_ajung_gara:
    title: 駅へはどうやって行けばいいですか?
    gloss: Cum pot să ajung la gară?(駅へはどうやって行けばいいですか?)
    note: '*Cum pot să ajung...?* と *gară* を1つの完全な質問にしています。*la*(〜へ)が質問と目的地をつなぎます。*la* の後ろでは、場所は冠詞のない形のままです。*la gara* ではなく *la gară* と言います。'
  ro.a1.unit09.lesson01.teach.cum_ajung_banca:
    title: 銀行へはどうやって行けばいいですか?
    gloss: Cum pot să ajung la bancă?(銀行へはどうやって行けばいいですか?)
    note: 同じ型で、今度は銀行です。ユニット8で銀行が遠いと学んだので、自然な質問です。
  ro.a1.unit09.lesson02.teach.dreapta_stanga_vocab:
    title: 右へ、左へ
    gloss: la dreapta(右へ)・la stânga(左へ)
    note: 基本の2つの曲がり方です。それぞれ *la*(〜へ)と組み合わせた決まった言い方として覚えましょう。*la dreapta*、*la stânga* です。
    example_gloss:
    - 右へ行ってください。
    - 左へ行ってください。
  ro.a1.unit09.lesson02.teach.mergeti_dreapta_phrase:
    title: 右へ行ってください
    gloss: Mergeți la dreapta.(右に行ってください。)
    note: '*Mergeți înainte.* と同じ *Mergeți* の命令表現で、まっすぐではなく曲がる方向を示します。'
  ro.a1.unit09.lesson02.teach.mergeti_stanga_phrase:
    title: 左に行く
    gloss: Mergeți la stânga.(左に行ってください。)
    note: 反対方向への曲がり方です。パターンは同じで簡単です。
  ro.a1.unit09.lesson02.teach.aici_acolo_vocab:
    title: ここ、あそこ
    gloss: aici(ここ)· acolo(あそこ)
    note: 目的地に着いたときや目に見えるときに、ものの場所を示す簡単な言い方です。距離(近い・遠い)を表すユニット8の aproape/departe とは異なり、位置を示します。
    example_gloss:
    - お店はここです。
    - 駅はあそこです。
  ro.a1.unit09.lesson02.teach.magazinul_aici_phrase:
    title: お店はここです
    gloss: Magazinul este aici.(お店はここです。)
    note: 短くて完結した文です。*aici* は今いる場所のすぐそばを指します。
  ro.a1.unit09.lesson02.teach.gara_acolo_phrase:
    title: 駅はあそこです
    gloss: Gara este acolo.(駅はあそこです。)
    note: '*Acolo* は、見えてはいるけれど今いる場所のすぐそばではないものを指します。道案内の締めくくりに自然な言い方です。'
  ro.a1.unit09.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 復習:bună, mulțumesc, la revedere, da, Ana, Mihai
    gloss: bună(こんにちは)· mulțumesc(ありがとう)· la revedere(さようなら)· da(はい)· Ana, Mihai(名前)
    note: どれも前のユニットで学んだ表現です。ここではアナがミハイに道をたずねます。
  ro.a1.unit09.lesson03.teach.apoi:
    title: それから
    gloss: apoi(それから・次に)
    note: 二つの道順をひとつの案内につなぎます。複数の手順をまとめて伝えるときの自然な言い方です。
    example_gloss:
    - まっすぐ行って、それから右に行ってください。
  ro.a1.unit09.lesson03.teach.line01:
    title: あいさつして、駅への行き方をたずねる
    gloss: アナはミハイにあいさつして、駅への行き方をたずねます。
    note: このユニットの *Cum pot să ajung* と、ユニット1のあいさつを組み合わせています。
  ro.a1.unit09.lesson03.teach.line02:
    title: 二つの道順を伝える
    gloss: ミハイは、まっすぐ行ってそれから右へ行くように言います。
    note: このユニットの *Mergeți înainte* と *la dreapta* を、*apoi* でつないでいます。
  ro.a1.unit09.lesson03.teach.line03:
    title: 近いかどうかをたずねる
    gloss: アナは駅が近いかどうかをたずねます。
    note: ユニット8の *este* と *aproape* を使った、短い追加の質問です。
  ro.a1.unit09.lesson03.teach.line04:
    title: 答えて場所を示す
    gloss: ミハイは近いと答え、駅があそこにあると教えます。
    note: '*aproape* と *acolo*、つまり距離と位置を、ひとつの文に組み合わせています。'
  ro.a1.unit09.lesson03.teach.line05:
    title: お礼を言って終える
    gloss: アナはミハイにお礼を言って、さよならを言います。
    note: ユニット1とユニット8の会話で使ったのと同じ、お礼の締めくくりです。
  ro.a1.unit09.lesson03.teach.line06:
    title: 会話を締めくくる
    gloss: ミハイはアナの名前を呼んで、さよならを返します。
    note: ユニット1・5・6・7・8の会話がどれも最後に使っていたのと同じ、親しみのある締めくくりのパターンです。
