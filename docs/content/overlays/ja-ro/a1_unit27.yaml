teaching:
  ro.a1.unit27.lesson01.teach.fericit_trist_suparat:
    title: うれしい、悲しい、怒っている
    gloss: うれしい、悲しい、怒っている
    note: '*a fi*(である)といっしょに使う、基本的な気持ちを表す3つの単語です。それぞれ *-ă* の女性形があります：*fericită*、*tristă*、*supărată*。'
    example_gloss:
    - 私はうれしいです。
    - 私は悲しいです。
    - 私は怒っています。
  ro.a1.unit27.lesson01.teach.sunt_fericit:
    title: うれしいと言う
    gloss: 私はうれしいです。
    note: '*Sunt*(*a fi*「である」の活用形)+気持ちを表す形容詞が基本の型で、日本語の「私は〜です」にあたります。女性は *Sunt fericită* と言います。'
  ro.a1.unit27.lesson01.teach.nu_sunt_suparat:
    title: 気持ちを対比させる
    gloss: 私は怒っていません、悲しいんです。
    note: 動詞の前に *Nu* を置くと否定になります：*Nu sunt supărat*。続く2つ目の節で、本当の気持ちを述べます。
  ro.a1.unit27.lesson02.teach.de_ce_esti:
    title: 理由をたずねる
    gloss: どうしてうれしいの？
    note: '*De ce*(なぜ)は、理由をたずねるときの基本の表現です。'
  ro.a1.unit27.lesson02.teach.sunt_fericit_pentru:
    title: 理由を言う
    gloss: 新しいアパートがあるので、私はうれしいです。
    note: '*Pentru că*(〜なので)が理由の節を導きます。語順は普通のままです：*am un apartament nou*。'
  ro.a1.unit27.lesson02.teach.sunt_trist_pentru:
    title: よくない理由
    gloss: 雨が降っているので、私は悲しいです。
    note: '*Plouă*(雨が降る)はルーマニア語では主語を必要としないので、それだけで理由の節になります。'
  ro.a1.unit27.lesson03.teach.emotionat:
    title: 緊張している
    gloss: 緊張している
    note: 緊張を表す基本的な言葉です。
    example_gloss: 初めてのシフトの前で、私は緊張しています。
  ro.a1.unit27.lesson03.teach.sunt_emotionat_pentru:
    title: 何に緊張しているかを言う
    gloss: 初めてのシフトの前で、私は緊張しています。
    note: '*Pentru*(直訳は「〜のために」)は、緊張の対象を表します。日本語では「〜について」「〜のことで」にあたる場面で使います。'
  ro.a1.unit27.lesson03.teach.nu_ti_face:
    title: 相手を安心させる
    gloss: 心配しないで。
    note: '*Nu-ți face griji*(直訳は「自分のために心配を作るな」)は、安心させるときの定番の決まり文句です。知らない人には *Nu vă faceți griji* と言います。'
  ro.a1.unit27.lesson04.teach.cum_se_simte:
    title: 相手の気持ちをたずねる
    gloss: ミハイはどう感じていますか？
    note: '*A se simți*(感じる)は再帰動詞です：*mă simt*(私)、*te simți*(あなた)、*se simte*(彼/彼女)。気持ちをたずねたり述べたりする基本の言い方です。'
  ro.a1.unit27.lesson04.teach.el_se_simte:
    title: 人の気持ちを説明する
    gloss: 彼は緊張しています。
    note: '*Se* は彼/彼女に使う再帰代名詞で、動詞の前に置きます：*se simte*。'
  ro.a1.unit27.lesson04.teach.de_ce_se:
    title: 人がなぜそう感じるのかをたずねる
    gloss: なぜ彼は緊張しているのですか。
    note: '*de ce* を、*El se simte emoționat* で学んだ *se simte* の型と組み合わせています。'
  ro.a1.unit27.lesson05.teach.salut_ana_sunt:
    title: 気持ちについてのメッセージを読む
    gloss: こんにちは、アナ。初めて一人で入るシフトに、少し緊張しています。でも、新しい仕事と新しいアパートがあるので、うれしくもあります。きっとうまくいくと思います。
    note: 書き手が何に緊張しているか、何がうれしいのか、全体としてどう見通しているかをつかみましょう。
    glosses:
      puțin: 少し
      emoționat: 緊張している
      prima: 最初の
      tură: シフト
      singur: ひとりで
      fericit: うれしい
      fiindcă: なぜなら
      nou: 新しい
      serviciu: 仕事
      apartament: アパート
      cred: 思う
      rezolvă: うまくいく
  ro.a1.unit27.lesson06.teach.ana_salut_mihai:
    title: アナがミハイの気持ちをたずねる
    gloss: アナ：こんにちは、ミハイ。初めてのシフトの前、どんな気持ち？
    note: '*Cum te simți* では再帰代名詞 *te*(「自分を」)を使っています。*prima ta tură* では、所有を表す *ta* が女性名詞 *tură* に合わせた形です。'
  ro.a1.unit27.lesson06.teach.mihai_sunt_putin:
    title: ミハイが緊張していると打ち明ける
    gloss: ミハイ：正直に言うと、少し緊張しています。
    note: '*Sincer să fiu*(正直に言うと)は、打ち明ける言葉をやわらげます。'
  ro.a1.unit27.lesson06.teach.ana_nu_ti:
    title: アナが彼を安心させる
    gloss: アナ：心配しないで、きっとうまくやれるよ！
    note: '*O să te descurci bine*(直訳は「あなたはうまくやっていくだろう」)は励ましの決まり文句です。*o să* +動詞で未来を表します。'
  ro.a1.unit27.lesson06.teach.mihai_multumesc_chiar:
    title: ミハイがお礼を言う
    gloss: ミハイ：ありがとう、本当に助かるよ。
    note: '*Ajută* は *a ajuta*(助ける)の彼/彼女/それの形で、ここでは「助けになる」という意味です。'
  ro.a1.unit27.lesson06.teach.ana_si_dupa:
    title: アナが結果を予想する
    gloss: アナ：それに、その後はきっととてもうれしくて、誇らしい気持ちになるよ。
    note: '*Sigur*(きっと)は、自信をもった予想を表します。*mândru*(誇らしい)は新しく出てきた便利な形容詞です(女性は *mândră*)。'
  ro.a1.unit27.lesson06.teach.mihai_da_si:
    title: ミハイが同意する
    gloss: ミハイ：うん、僕もそう思う。
    note: '*Și eu cred asta*(直訳は「私もこれを思う」)は、相手の意見に同意するときの自然な言い方です。'
  ro.a1.unit27.lesson06.teach.mihai_este_emotionat:
    title: este、lui、îl のまとめ
    gloss: ミハイは初めてのシフトに緊張しています。アナが彼を助けます。
    note: '*Este* は *a fi*（〜である）の三人称単数形です。*lui* は「彼の」の意味で、ここでは *prima* と *tură* の間に入ります。*îl* は「彼を」の意味で、動詞の前に置きます：*îl ajută*。他の人について話すための、小さくても欠かせない3つの単語です。'
