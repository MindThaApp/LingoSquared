answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit introduces the formal Vă place...? question (dative vă, matching Mihai's own established faceți/aveți-style formal verb endings) alongside first-person Îmi place/Nu-mi place/Prefer, which are person-invariant and carry no register distinction of their own. Ana and Mihai's dialogue keeps their existing polite register with each other, matching every earlier unit.
course:
  title: ルーマニア語 A1
  description: ルーマニア語で好き嫌いや好みを言う表現 ― Îmi place(好きです)、Nu-mi place(好きではありません)、Vă place...?(~はお好きですか)、Prefer(~のほうが好きです)、Sau(または)― を、アナとミハイがコーヒーか紅茶かを決める場面で学びます。
units:
  ro.a1.unit13.preferences:
    title: 好み
lessons:
  ro.a1.unit13.lesson01.imi_place:
    title: 好きです
  ro.a1.unit13.lesson02.va_place_prefer:
    title: お好きですか/~のほうが好きです
  ro.a1.unit13.lesson03.cafea_sau_ceaiul:
    title: コーヒーか紅茶か
teaching:
  ro.a1.unit13.lesson01.teach.reminder_cafea_ceai_paine:
    title: 復習：cafea、ceai、pâine
    gloss: cafea(コーヒー)・ceai(紅茶)・pâine(パン)
    note: どれもユニット6で学習済みです。ここでは、このユニットの新しい「好き・嫌い」の表現と組み合わせます。
  ro.a1.unit13.lesson01.teach.imi_place_vocab:
    title: 好きです
    gloss: Îmi place(好きです)
    note: 直訳は「私にとって喜ばしい」で、*îmi*(私に)と変化しない *place*(気に入る)でできています。ルーマニア語では、何かを一般的に好きだと言うとき、名詞の定冠詞つきの形(ユニット6で学んだ *cafea* ではなく *cafeaua*)を使います。日本語では「コーヒーが好きです」と特に限定しませんが、ルーマニア語ではこの形にします。
    example_gloss:
    - コーヒーが好きです。
  ro.a1.unit13.lesson01.teach.imi_place_cafeaua_phrase:
    title: コーヒーが好きです
    gloss: Îmi place cafeaua.(コーヒーが好きです。)
    note: 完全な型：Îmi place + 定冠詞つきの名詞。
  ro.a1.unit13.lesson01.teach.imi_place_ceaiul_phrase:
    title: 紅茶が好きです
    gloss: Îmi place ceaiul.(紅茶が好きです。)
    note: '*Îmi place cafeaua* と同じ型で、飲み物だけが違います。*ceaiul* は、ユニット6で学んだ *ceai* の定冠詞つきの形です。'
  ro.a1.unit13.lesson01.teach.numi_place_vocab:
    title: 好きではありません
    gloss: Nu-mi place(好きではありません)
    note: '*Îmi place* の否定形です。日常会話では *nu îmi* が *nu-mi* に縮まるので、ハイフンのついたこの短い形が自然な言い方です。単なる省略形ではありません。'
    example_gloss:
    - パンは好きではありません。
  ro.a1.unit13.lesson01.teach.numi_place_painea_phrase:
    title: パンは好きではありません
    gloss: Nu-mi place pâinea.(パンは好きではありません。)
    note: '*Pâinea* は、ユニット6で学んだ *pâine* の定冠詞つきの形で、*cafeaua*/*ceaiul* と同じ型です。'
  ro.a1.unit13.lesson02.teach.reminder_imi_place_numi_place:
    title: 復習：Îmi place、Nu-mi place
    gloss: Îmi place(好きです)・Nu-mi place(好きではありません)
    note: どちらもこのユニットの最初のレッスンで学びました。ここでは、これらに対応する疑問の形を学びます。
  ro.a1.unit13.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 復習：cafeaua、ceaiul、pâinea
    gloss: cafeaua(そのコーヒー)・ceaiul(その紅茶)・pâinea(そのパン)
    note: どれもこのユニットの最初のレッスンで学びました。ここでは、疑問文や好みの表現でも使います。
  ro.a1.unit13.lesson02.teach.va_place_vocab:
    title: ~はお好きですか
    gloss: Vă place...?(~はお好きですか)
    note: '*Îmi place* の丁寧な疑問の形です。*îmi*(私に)の代わりに *vă*(あなたに、丁寧な形)を使います。*aveți*/*faceți* で使った *dumneavoastră* と同じ丁寧さです。後ろに定冠詞つきの名詞を置きます。話題がすでに明らかなときは、これだけでも使えます。'
    example_gloss:
    - コーヒーはお好きですか。
  ro.a1.unit13.lesson02.teach.va_place_cafeaua_phrase:
    title: コーヒーはお好きですか。
    gloss: Vă place cafeaua?(コーヒーはお好きですか。)
    note: 完全な型：Vă place + 定冠詞つきの名詞。文末は上げ調子で言います。
  ro.a1.unit13.lesson02.teach.prefer_vocab:
    title: ~のほうが好きです
    gloss: Prefer(~のほうが好きです)
    note: 「私に」を使う構文は不要で、*prefer* は ふつうの動詞として使います。*Prefer* の後ろに、好むものを *Îmi place* と同じように定冠詞つきの形で置きます。
    example_gloss:
    - コーヒーのほうが好きです。
  ro.a1.unit13.lesson02.teach.prefer_cafeaua_phrase:
    title: コーヒーのほうが好きです
    gloss: Prefer cafeaua.(コーヒーのほうが好きです。)
    note: '*Îmi place cafeaua* より強い言い方です。二つのものから選ぶときに便利です。'
  ro.a1.unit13.lesson02.teach.sau_vocab:
    title: または
    gloss: Sau(または)
    note: 選択肢を示したり、選択をたずねたりするときに二つをつなぎます。ユニット10・12の *și*(と)は両方が同時に成り立つものをつなぐので、使い方が異なります。
    example_gloss:
    - コーヒーか紅茶か
  ro.a1.unit13.lesson02.teach.cafea_sau_ceai_phrase:
    title: コーヒーか紅茶か
    gloss: Cafea sau ceai?(コーヒーですか、紅茶ですか。)
    note: 選択肢を示す短く自然な言い方です。ここでは、コーヒーや紅茶について一般的に述べるのではなく、自由に選んでもらう申し出なので、*cafeaua*/*ceaiul* ではなく、冠詞のない *cafea*、*ceai* を使います。
  ro.a1.unit13.lesson03.teach.reminder_va_place_prefer_sau:
    title: 復習：Vă place、Prefer、Sau
    gloss: Vă place?(お好きですか)・Prefer(~のほうが好きです)・Sau(または)
    note: どれもこのユニットの2番目のレッスンで学びました。ここでは、アナとミハイがこれらを一緒に使います。
  ro.a1.unit13.lesson03.teach.reminder_imi_place_numi_place_cafeaua_ceaiul_painea:
    title: 復習：Îmi place、Nu-mi place、cafeaua、ceaiul、pâinea
    gloss: Îmi place(好きです)・Nu-mi place(好きではありません)・cafeaua(そのコーヒー)・ceaiul(その紅茶)・pâinea(そのパン)
    note: どれもこのユニットの最初のレッスンで学びました。ここでは、アナとミハイがそれぞれ好きなものと好きではないものを言います。
  ro.a1.unit13.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 復習：bună、mulțumesc、la revedere、Ana、Mihai
    gloss: bună(こんにちは)・mulțumesc(ありがとう)・la revedere(さようなら)・Ana、Mihai(名前)
    note: どれもこれまでのユニットで学習済みです。このコースのすべての会話で使ってきた、親しみのある始まりと終わりの型です。
  ro.a1.unit13.lesson03.teach.line01:
    title: あいさつして、コーヒーか紅茶かをたずねる
    gloss: ミハイがアナにあいさつして、コーヒーと紅茶のどちらが好きかたずねます。
    note: このユニットの *Vă place...?* と *sau* を組み合わせて、一つの質問で両方の選択肢を示しています。
  ro.a1.unit13.lesson03.teach.line02:
    title: 好みと好きではないものを言う
    gloss: アナは、コーヒーのほうが好きで、紅茶は好きではないと言います。
    note: '*Prefer* と *Nu-mi place* を組み合わせています。コーヒーが好きという彼女の好みは、ユニット6・12で出てきた注文と一致します。'
  ro.a1.unit13.lesson03.teach.line03:
    title: 反対の好みを言う
    gloss: ミハイは、紅茶が好きで、コーヒーは好きではないと言います。
    note: ユニット6・12で出てきたミハイの注文(いつも ceai で、cafea ではない)と一致します。
  ro.a1.unit13.lesson03.teach.line04:
    title: パンについてもたずねる
    gloss: アナは、ミハイがパンも好きかどうかたずねます。
    note: まず短い *Și pâinea?*(パンは？)で聞き、次に *Vă place...?* を使って、新しい話題 *pâinea* について完全な形でたずねます。
  ro.a1.unit13.lesson03.teach.line05:
    title: 答えて、お礼を言い、さよならを言う
    gloss: ミハイは、はい、パンは好きですと答え、アナにお礼を言って、さよならを言います。
    note: ユニット6で出てきたミハイの注文(pâine)と一致します。これまでのユニットの会話と同じ終わり方です。
  ro.a1.unit13.lesson03.teach.line06:
    title: 会話を終える
    gloss: アナもミハイの名前を呼んで、さよならを返します。
    note: これまでの各ユニットの会話も、同じ親しみのあるあいさつで終わっていました。
