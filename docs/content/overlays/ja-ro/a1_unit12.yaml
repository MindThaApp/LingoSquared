  notes: 'Derived from en-ro by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Japanese string was translated and adapted. Needs native Japanese review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's new grammar is entirely 1st-person (am fost/am mâncat/ am băut, invariant for singular and plural) plus one fixed 3rd- person formulaic pair (Cum a fost...?/A fost bine!) taught only as an unanalyzed set phrase. No new second-person forms are introduced. Ana and Mihai's dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08/unit09/ unit10/unit11.
course:
  title: ルーマニア語 A1
  description: ルーマニア語で最近終わった出来事を話す練習です。am fost(いました/行きました)、am mâncat(食べました)、am băut(飲みました)、そして「どうでしたか」「よかったです」のやりとり Cum a fost...?/A fost bine! を学びます。アナとミハイが日曜日の公園での出来事を振り返る話の続きです。
units:
  ro.a1.unit12.past_events:
    title: 昨日
lessons:
  ro.a1.unit12.lesson01.am_fost_la_parc:
    title: 公園に行きました
  ro.a1.unit12.lesson02.am_mancat_am_baut:
    title: 食べて、飲みました
  ro.a1.unit12.lesson03.cum_a_fost_duminica:
    title: 日曜日はどうでしたか?
teaching:
  ro.a1.unit12.lesson01.teach.reminder_parc_cinema:
    title: 復習:parc、cinema
    gloss: parc(公園)・cinema(映画館)
    note: どちらも第11課で学習済みです。ここでは、この課で新しく学ぶ過去形と組み合わせます。
  ro.a1.unit12.lesson01.teach.reminder_astazi_maine_duminica_sambata:
    title: 復習:astăzi、mâine、duminică、sâmbătă
    gloss: astăzi(今日)・mâine(明日)・duminică(日曜日)・sâmbătă(土曜日)
    note: どれも第3課・第11課で学習済みです。ここでは、この課で新しく学ぶ *ieri*(昨日)と対比させます。
  ro.a1.unit12.lesson01.teach.am_fost_vocab:
    title: いました/行きました
    gloss: Am fost(いました/行きました)
    note: '*a fi*(~である、いる)の複合過去(過去形)です。*am* は「私」にも「私たち」にも使われる変化しない助動詞で、*fost* は固定された過去分詞です。場所とともに使う *am fost la...* は「~に行きました」と言うときの日常的で自然な表現で、会話では「歩いて行った」「移動した」などの動詞を使うより一般的です。'
    example_gloss:
    - 公園に行きました。
  ro.a1.unit12.lesson01.teach.am_fost_parc_phrase:
    title: 公園に行きました
    gloss: Am fost la parc.(公園に行きました。)
    note: 完全な型:am fost + la + 場所。
  ro.a1.unit12.lesson01.teach.am_fost_cinema_phrase:
    title: 映画館に行きました
    gloss: Am fost la cinema.(映画館に行きました。)
    note: '*Am fost la parc* と同じ型で、場所だけが違います。'
  ro.a1.unit12.lesson01.teach.ieri_vocab:
    title: 昨日
    gloss: Ieri(昨日)
    note: 第3課で *astăzi*(今日)、*mâine*(明日)と一緒に学習済みです。ここでは過去形と合わせ、文の最初に置いて「いつ」のことかを表します。
    example_gloss:
    - 昨日、公園に行きました。
  ro.a1.unit12.lesson01.teach.ieri_am_fost_parc_phrase:
    title: 昨日、公園に行きました
    gloss: Ieri am fost la parc.(昨日、公園に行きました。)
    note: '*Am fost la parc* の前に *ieri* を付けると、いつのことかがはっきりします。'
  ro.a1.unit12.lesson02.teach.reminder_mananc_beau:
    title: 復習:mănânc、beau
    gloss: mănânc(食べます)・beau(飲みます)
    note: どちらも第10課の日課で学習済みです。この課ではこれらを過去形にします。
  ro.a1.unit12.lesson02.teach.reminder_paine_cafea_ceai_si:
    title: 復習:pâine、cafea、ceai、și
    gloss: pâine(パン)・cafea(コーヒー)・ceai(お茶)・și(と、そして)
    note: どれも第6課・第10課で学習済みです。この課の過去形の文でも使います。
  ro.a1.unit12.lesson02.teach.am_mancat_vocab:
    title: 食べました
    gloss: Am mâncat(食べました)
    note: '*a mânca*(食べる)の複合過去です。第10課で *mănânc*(食べます)として学習した同じ動詞の過去形です。am + mâncat で、*am fost* と同じ型です。'
    example_gloss:
    - パンを食べました。
  ro.a1.unit12.lesson02.teach.am_mancat_paine_phrase:
    title: パンを食べました
    gloss: Am mâncat pâine.(パンを食べました。)
    note: 完全な型:am mâncat + 食べ物。
  ro.a1.unit12.lesson02.teach.am_baut_vocab:
    title: 飲みました
    gloss: Am băut(飲みました)
    note: '*a bea*(飲む)の複合過去です。第10課で *beau*(飲みます)として学習した同じ動詞の過去形です。'
    example_gloss:
    - お茶を飲みました。
  ro.a1.unit12.lesson02.teach.am_baut_ceai_phrase:
    title: お茶を飲みました
    gloss: Am băut ceai.(お茶を飲みました。)
    note: 完全な型:am băut + 飲み物。
  ro.a1.unit12.lesson02.teach.am_mancat_am_baut_phrase:
    title: パンを食べて、お茶を飲みました
    gloss: Am mâncat pâine și am băut ceai.(パンを食べて、お茶を飲みました。)
    note: 過去の二つの動作を *și* でつなぎます。第10課で現在の日課をつなぐのに使ったのと同じ接続の言葉です。
  ro.a1.unit12.lesson03.teach.reminder_am_fost_ieri_parc_cinema:
    title: 復習:am fost、ieri、parc、cinema
    gloss: am fost(いました/行きました)・ieri(昨日)・parc(公園)・cinema(映画館)
    note: どれもこの課のレッスン1で学んだ言葉です。ここでは日曜日の振り返りの導入に使います。
  ro.a1.unit12.lesson03.teach.reminder_am_mancat_am_baut:
    title: 復習:am mâncat、am băut、pâine、cafea、ceai
    gloss: am mâncat(食べました)・am băut(飲みました)・pâine(パン)・cafea(コーヒー)・ceai(お茶)
    note: どれもこの課のレッスン2で学んだ言葉です。ここではアナとミハイがそれぞれ何を食べたか、飲んだかを話します。
  ro.a1.unit12.lesson03.teach.reminder_cum_duminica_bine:
    title: 復習:cum、duminică、bine、mulțumesc、la revedere、Ana、Mihai
    gloss: cum(どう、どのように。第1課・第9課)・duminică(日曜日。第3課)・bine(よい、元気。第1課)・mulțumesc(ありがとう)・la revedere(さようなら)・Ana、Mihai(名前)
    note: どれも前の課で学習済みです。*cum* は第1課で名前をたずねるとき、第9課で道をたずねるときに出てきました。ここでは、物事がどうだったかをたずねる別の質問を始めます。
  ro.a1.unit12.lesson03.teach.a_fost_vocab:
    title: でした
    gloss: A fost(でした)
    note: '*am fost* と同じ動詞の別の人称です。*a* は「それ/彼/彼女」に使う助動詞で、「私/私たち」の am ではありません。今のところ *Cum a fost...?* と *A fost bine!* は、自由に組み立てるのではなく、決まった表現として覚えましょう。'
    example_gloss:
    - よかったです!
  ro.a1.unit12.lesson03.teach.a_fost_bine_phrase:
    title: よかったです!
    gloss: A fost bine!(よかったです!)
    note: うまくいったことを伝える短くて自然な言い方で、*Cum a fost...?* への答えになります。
  ro.a1.unit12.lesson03.teach.cum_a_fost_duminica_phrase:
    title: 日曜日はどうでしたか?
    gloss: Cum a fost duminică?(日曜日はどうでしたか?)
    note: その場に一緒にいた相手にも使える、最近の一日についての自然な会話の切り出し方です。相手の感想や印象に残ったことを聞くことができます。
  ro.a1.unit12.lesson03.teach.line01:
    title: あいさつして日曜日のことをたずねる
    gloss: ミハイがアナにあいさつして、日曜日はどうだったかをたずねます。
    note: この課の *Cum a fost duminică?* と、学習済みの *Bună* を組み合わせます。
  ro.a1.unit12.lesson03.teach.line02:
    title: 答えて、場所を言う
    gloss: アナは、よかったこと、そして公園に行ったことを話します。
    note: '*A fost bine!* と、レッスン1の *Am fost la parc* を組み合わせます。'
  ro.a1.unit12.lesson03.teach.line03:
    title: 食べたものと飲んだものを言う
    gloss: ミハイは、パンを食べてお茶を飲んだと話します。
    note: レッスン2の *Am mâncat pâine și am băut ceai* を使います。第6課で出てきたミハイの好み(パンとお茶)に合わせています。
  ro.a1.unit12.lesson03.teach.line04:
    title: 飲んだものを言う
    gloss: アナは、コーヒーを飲んだと話します。
    note: 第6課で出てきたアナの好み(コーヒー)に合わせています。
  ro.a1.unit12.lesson03.teach.line05:
    title: お礼を言って別れのあいさつをする
    gloss: ミハイはアナにお礼を言って、さようならと言います。
    note: これまでの課の会話も、同じ終わり方でした。
  ro.a1.unit12.lesson03.teach.line06:
    title: 会話を終える
    gloss: アナは、ミハイの名前を呼んで、さようならと返します。
    note: これまでの課の会話も、同じ親しみのある終わり方でした。
