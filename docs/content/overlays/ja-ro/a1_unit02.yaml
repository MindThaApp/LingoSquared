answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching ユニット1''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Spoken answers are assessed for intelligibility, not written punctuation.
  register: tu and dumneavoastră (and their matching verb forms, ai/aveți) are never interchangeable answers for each other's exercises, the same discipline ユニット1 established.
course:
  title: ルーマニア語 A1
  description: 0から100までの数字を学びます。11〜19(-sprezece)と10の位(-zeci)の作り方、doi/două の性による使い分け、そして年齢や電話番号のたずね方と答え方も扱います。ユニット1 に続いて Ana と Mihai が登場します。
units:
  ro.a1.unit02.numbers:
    title: 数
lessons:
  ro.a1.unit02.lesson01.zero_to_ten:
    title: 0から10までの数
  ro.a1.unit02.lesson02.eleven_to_hundred:
    title: 11から100までの数字
  ro.a1.unit02.lesson03.age_and_phone:
    title: 年齢と電話番号
teaching:
  ro.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: ゼロ
    note: '*Zero* は形が変わらず、長い数字や電話番号の中で数字を1つずつ読み上げるときにも使います。'
    example_gloss: ゼロ、1、2。
  ro.a1.unit02.lesson01.teach.unu:
    title: 一
    gloss: 一
    note: '*Unu* は単独で数えるときの形です。男性名詞・中性名詞の前では *un* に短くなり(*un câine*、犬1匹)、女性名詞の前では *o* になります(*o sută*、100)。'
    example_gloss: 1、2、3。
  ro.a1.unit02.lesson01.teach.doi:
    title: 2(男性形)
    gloss: 二
    note: '*Doi* は男性名詞に使います(*doi bărbați*、男性2人)。女性名詞と、複数形で女性名詞と同じ扱いになる中性名詞には別の形を使います。次のカードを見てください。'
    example_gloss: 2、3、4。
  ro.a1.unit02.lesson01.teach.doi_doua_gender:
    title: 2は性によって形が変わる
    gloss: 2(男性形/女性・中性形)
    note: 日本語の「2」は名詞の性によって形が変わりませんが、ルーマニア語の *doi* には女性形 *două* があります。女性名詞(*două femei*、女性2人)と、複数形で女性名詞と同じ扱いになる中性名詞(*două numere*、2つの数)には două を使います。1(*un*/*o*)と2を除けば、*trei* から *zece* までは性に関係なく同じ形です。
  ro.a1.unit02.lesson01.teach.trei:
    title: 三
    gloss: 三
    note: '*Trei* はどの性でも形が変わりません。'
    example_gloss: 3、4、5。
  ro.a1.unit02.lesson01.teach.patru:
    title: 四
    gloss: 四
    note: '*Patru* は形が変わりません。ただし、11〜19では不規則に縮む点に注意しましょう:14は *patrusprezece* ではなく *paisprezece* です。'
    example_gloss: 4、5、6。
  ro.a1.unit02.lesson01.teach.cinci:
    title: 五
    gloss: 五
    note: '*Cinci* は形が変わりません。'
    example_gloss: 5、6、7。
  ro.a1.unit02.lesson01.teach.sase:
    title: 六
    gloss: 六
    note: '*Șase* は形が変わりません。'
    example_gloss: 6、7、8。
  ro.a1.unit02.lesson01.teach.sapte:
    title: 七
    gloss: '7'
    note: '*Șapte* は形が変わりません。'
    example_gloss: 7、8、9。
  ro.a1.unit02.lesson01.teach.opt:
    title: 八
    gloss: 八
    note: '*Opt* は不変化の語です。'
    example_gloss: 8、9、10。
  ro.a1.unit02.lesson01.teach.noua:
    title: 九
    gloss: 九
    note: '*Nouă* は不変化の語です。*ă* を付けずに書くと *noua*(「その新しいもの」の女性形)と同じ綴りになってしまうので、ă をきちんと入力してください。入力した答えは、発音記号付きの文字も含めて判定されます。'
    example_gloss: 9、10…できた!
  ro.a1.unit02.lesson01.teach.zece:
    title: 十
    gloss: 十
    note: '*Zece* は不変化の語で、11以降の「十いくつ」の数すべての土台になります(*zece* + *-sprezece*)。'
    example_gloss: 10! よくできました!
  ro.a1.unit02.lesson02.teach.unsprezece:
    title: 十一
    gloss: 十一
    note: '*Unsprezece* は、もともと *unu* + *spre* + *zece*(「十の上に1」)からできています。これ以降の13〜19も同じ仕組みです。'
    example_gloss: 10、11、12。
  ro.a1.unit02.lesson02.teach.teens_pattern:
    title: 12から19まで
    gloss: doisprezece(12)、treisprezece(13)、paisprezece(14)、cincisprezece(15)、șaisprezece(16)、șaptesprezece(17)、optsprezece(18)、nouăsprezece(19)
    note: 「十いくつ」の数は、1桁の数のふつうの形に *-sprezece* を付けて作ります。*doi* → *doisprezece*、*trei* → *treisprezece*、*nouă* → *nouăsprezece* まで同じです。例外は2つあります。14では *patru* が *pai-* に縮み(*patrusprezece* ではなく *paisprezece*)、16では *șase* が *șai-* になります(*șasesprezece* ではなく *șaisprezece*)。
  ro.a1.unit02.lesson02.teach.douazeci:
    title: 二十
    gloss: 二十
    note: '*Douăzeci*(「2つの十」)はそれだけで独立した語で、21から29までの数の土台になります。'
    example_gloss: 19、20…
  ro.a1.unit02.lesson02.teach.douazeci_si_unu:
    title: '21'
    gloss: '21'
    note: 21以降は、十の位と一の位を *și*(「と」)でつなぎます。*douăzeci și unu*、*douăzeci și doi* のようになります。十いくつの数が1語につながるのとは違います。
    example_gloss: 20、21、22。
  ro.a1.unit02.lesson02.teach.tens_pattern:
    title: treizeci(30)、patruzeci(40)、cincizeci(50)、șaizeci(60)、șaptezeci(70)、optzeci(80)、nouăzeci(90)
    gloss: treizeci(30)、patruzeci(40)、cincizeci(50)、șaizeci(60)、șaptezeci(70)、optzeci(80)、nouăzeci(90)
    note: 30以上の十の位は、1桁の数に *-zeci*(「十」の複数)を付けて作ります。*trei* → *treizeci*、*patru* → *patruzeci* のようになります。綴りが変わるのは60だけで、*șase* が *șai-* になって *șaizeci* です(*șaisprezece* と同じ *șai-* です)。70、80、90も、20を単位に数えるような特別な言い方はなく、ほかの十の位と同じように作ります。
  ro.a1.unit02.lesson02.teach.o_suta:
    title: 百
    gloss: '100'
    note: '*O sută* では *un* ではなく *o*(「1つの」の女性形)を使います。*sută* が女性名詞だからです。'
    example_gloss: 90、100!
  ro.a1.unit02.lesson03.teach.cati_ani_ai:
    title: くだけた言い方で年齢をたずねる
    gloss: 何歳ですか。
    note: 直訳は「あなたはいくつの年を持っていますか」です。年齢を言うとき、ルーマニア語は「である」ではなく *avea*(持つ)を使い、フランス語の *avoir* と同じ型です。*Câți*(いくつの・男性形)は *ani*(年・男性形)に合わせた形です。
  ro.a1.unit02.lesson03.teach.am_nouasprezece_ani:
    title: 年齢を言う(20歳未満)
    gloss: 19歳です。
    note: '*Am* は *avea* の *eu* の形です。20未満の数では、*ani* の前に *de* は要りません。'
  ro.a1.unit02.lesson03.teach.cati_ani_aveti:
    title: 丁寧に年齢をたずねる
    gloss: 何歳ですか。
    note: '*Aveți* は *avea* の *dumneavoastră* の形で、第1単元で学んだ丁寧な言い方に合わせたものです。'
  ro.a1.unit02.lesson03.teach.am_treizeci_de_ani:
    title: 年齢を言う(20歳以上)
    gloss: 30歳です。
    note: ここで *De* が入るのは、*treizeci* が20以上の数だからです。詳しい規則は次のカードで確認しましょう。
  ro.a1.unit02.lesson03.teach.de_insertion_rule:
    title: 名詞の前に de を付けるとき
    gloss: 2〜19:de なし(doi ani)/ 20以上:de を付ける(treizeci de ani)
    note: ルーマニア語に特有の規則です。2から19までの数は名詞にそのまま付きます(*doi ani*:2年、*nouăsprezece ani*:19年)。20以上になると、数と名詞の間に *de* が必要です(*treizeci de ani*:30年、*o sută de ani*:100年)。1は別扱いで、*un an*(1年)のように単数形になり、どちらの場合も *de* は付きません。
  ro.a1.unit02.lesson03.teach.care_e_numarul_tau:
    title: 電話番号をくだけた言い方で尋ねる
    gloss: 電話番号は何番ですか。
    note: 特定の既存の番号をたずねるときは *ce* ではなく *Care*(どれ・何)を使うのが自然です。*Număr* は中性名詞で、単数では男性名詞と同じ一致をします。そのため *numărul* に続く「あなたの」は *tău* で、*ta* ではありません。
  ro.a1.unit02.lesson03.teach.care_este_numarul_dvs:
    title: 電話番号を丁寧な言い方で尋ねる
    gloss: 電話番号は何番ですか。
    note: '*Este* は *e* の完全な形で、改まった話し方や丁寧な場面でよく使われます。*Dumneavoastră* は第1単元で学んだ語で、やりとりを丁寧に保ちます。'
  ro.a1.unit02.lesson03.teach.raspuns_telefon:
    title: 電話番号を1桁ずつ言う
    gloss: 0、7、2、1、4、5、6、7、8、9です。
    note: この単元では、1桁ずつ読む簡単な方法だけを扱います。実際には2桁ずつまとめて言う人もいますが、1桁ずつ言えば必ず通じます。
