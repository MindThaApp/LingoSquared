answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (doare, cap, stomac, simt, bolnav, nevoie, doctor, odihnă, multă) is used only in fixed first-person (Mihai's own "Nu mă simt bine"/"Sunt bolnav") or already-established formal ("Aveți nevoie de...?") forms. No informal-tu form is introduced this unit; Ana and Mihai keep their existing formal register with each other.
course:
  title: ルーマニア語 A1
  description: ルーマニア語で基本的な体調不良を伝える -- Doare(痛い)、Bolnav(病気の)、Doctor(医者) -- ミハイの具合が悪く、アナが様子をたずねてアドバイスをします。
units:
  ro.a1.unit16.health:
    title: 健康
lessons:
  ro.a1.unit16.lesson01.ma_doare_capul:
    title: 頭が痛いです
  ro.a1.unit16.lesson02.nu_ma_simt_bine:
    title: 具合が悪いです
  ro.a1.unit16.lesson03.mihai_este_bolnav:
    title: ミハイは具合が悪い
teaching:
  ro.a1.unit16.lesson01.teach.reminder_ma_va_ce_sau:
    title: 復習:mă, vă, ce, sau
    gloss: mă(私を・私に)· vă(あなたを・あなたに、丁寧)· ce(何)· sau(または)
    note: Mă は第1課・第10課(mă numesc, mă trezesc)、vă は第1課・第6課・第7課・第13課(vă rog)、ce は第1課・第3課・第4課・第15課、sau は第13課の語です。この単元ではこの4語を、どこが痛いかを話すという新しい目的で使います。
  ro.a1.unit16.lesson01.teach.doare_vocab:
    title: 痛い
    gloss: Doare(痛い、痛む)
    note: 主語のない動詞です。ルーマニア語では「私が痛む」ではなく「それが私に痛い」(*mă doare*)と言います。*Mă doare* だけで「(私は)痛い」という意味になり、痛む場所を足すと何が痛いかを表せます:*Mă doare capul*。
    example_gloss:
    - 痛いです。
  ro.a1.unit16.lesson01.teach.cap_vocab:
    title: 頭
    gloss: 頭
    note: 中性名詞で、子音で終わります。「その頭」は *-ul* を付けて表し、*tren*→*trenul*、*peron*→*peronul* と同じ語尾です。
    example_gloss:
    - 頭が痛いです。
  ro.a1.unit16.lesson01.teach.ce_va_doare_phrase:
    title: どこが痛いですか。
    gloss: どこが痛みますか。
    note: '*Ce*(何)+ *vă*(あなたを、丁寧な言い方の目的語)+ *doare* です。ここの単語はどれも既習か今回出てきたもので、それを組み合わせて新しい疑問文になっています。'
  ro.a1.unit16.lesson01.teach.stomac_vocab:
    title: 胃
    gloss: 胃
    note: 中性名詞で子音で終わるので、「その胃」は *stomacul* になります。*cap*→*capul* と同じ *-ul* の語尾です。
    example_gloss:
    - おなかが痛いです。
  ro.a1.unit16.lesson01.teach.ma_doare_capul_sau_stomacul_phrase:
    title: 頭か胃が痛みますか
    gloss: 頭か胃が痛みますか。
    note: '*mă* の代わりに *vă*(あなた、丁寧な言い方)を使うと、相手について尋ねる疑問文になります。*sau*(または、ユニット13で学習)が、今習った二つの体の部位をつないでいます。'
  ro.a1.unit16.lesson02.teach.reminder_nu_bine_am_un_de:
    title: 復習:nu, bine, am, un, de
    gloss: 〜ない・いいえ · 元気に・よく · 私は持っている · 一つの(男性・中性) · 〜の・〜から
    note: nu と bine はユニット1・6・11、am はユニット2・5・15、un と de はユニット6・7・15で出てきました。このユニットでは、この5つをすべて使って、具合が悪いことや医者が必要なことを伝えます。
  ro.a1.unit16.lesson02.teach.ma_simt_vocab:
    title: 私は感じる
    gloss: (私は)感じる
    note: 再帰動詞で、直訳は「私は自分を感じる」です。ユニット10の *mă trezesc*、*mă culc* と同じ、*mă* +動詞の形です。
    example_gloss:
    - 気分がいいです。
  ro.a1.unit16.lesson02.teach.nu_ma_simt_bine_phrase:
    title: 具合が悪いです
    gloss: 具合が悪いです。
    note: '*Nu* が *mă simt bine* を否定しています。具体的な症状を言う前に、どこかおかしいと伝える自然な言い方です。'
  ro.a1.unit16.lesson02.teach.bolnav_vocab:
    title: 病気の
    gloss: 病気の(男性)
    note: 形容詞の男性形で、ミハイが言う形(*Sunt bolnav*)です。女性は *Sunt bolnavă*(女性形)と言います。
    example_gloss:
    - 私は病気です。
  ro.a1.unit16.lesson02.teach.am_nevoie_de_un_doctor_phrase:
    title: 医者が必要です
    gloss: 医者が必要です。
    note: '*Am nevoie de*(必要です、直訳は「〜の必要を持つ」)+ *un doctor* です。決まった言い回しで、医者に限らず、何かの助けを求めるときに使えます。'
  ro.a1.unit16.lesson02.teach.doctor_vocab:
    title: Doctor
    gloss: 医者
    note: 男性名詞なので、「一人の医者」は *un doctor* です。
    example_gloss:
    - 医者が必要です。
  ro.a1.unit16.lesson03.teach.reminder_ce_mai_faceti_aveti_da:
    title: 復習:Ce mai faceți?, Aveți, Da
    gloss: お元気ですか(丁寧) · あなたは持っています(丁寧) · はい
    note: Ce mai faceți はユニット1、Aveți はユニット5、Da はユニット6・11で出てきました。どれもこのユニットの確認の会話で再び使います。
  ro.a1.unit16.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 復習:bună, mulțumesc, la revedere, Ana, Mihai
    gloss: こんにちは · ありがとうございます · さようなら · アナ、ミハイ(名前)
    note: どれも前のユニットですでに学習した表現です。このコースのどの会話にもある、親しみやすい始まりと終わりの型です。
  ro.a1.unit16.lesson03.teach.reminder_spitalul_vizavi_magazin:
    title: 復習:Spitalul este vizavi de magazin
    gloss: 病院は店の向かいにあります。
    note: ユニット8の文をそのまま再利用しています。病院の場所は変わっておらず、このユニットの読解メモもそこにつながっています。
  ro.a1.unit16.lesson03.teach.odihna_vocab:
    title: 休息
    gloss: 休息
    note: 女性名詞です。具合が悪いときに、医者や友人が勧めてくれるものです。
    example_gloss:
    - 休息が必要です。
  ro.a1.unit16.lesson03.teach.multa_apa_vocab:
    title: たっぷりの水
    gloss: たくさんの水
    note: '*Multă*(たくさんの、女性形)は、女性名詞の *apă*(水、ユニット6)に合わせた形です。医者が勧めそうな、決まった組み合わせです。'
    example_gloss:
    - 休息とたっぷりの水を。
  ro.a1.unit16.lesson03.teach.line01:
    title: あいさつして調子を尋ねる
    gloss: アナはミハイにあいさつして、調子を尋ねます。
    note: ユニット1の *Ce mai faceți?* というあいさつを再利用しています。
  ro.a1.unit16.lesson03.teach.line02:
    title: 具合が悪いと伝える
    gloss: ミハイは、具合が悪くて頭が痛いと言います。
    note: このユニットのレッスン2の表現とレッスン1の表現を組み合わせています。
  ro.a1.unit16.lesson03.teach.line03:
    title: 医者が必要か尋ねる
    gloss: アナは、医者が必要かどうか尋ねます。
    note: このユニットのレッスン2の表現を、ユニット5の *aveți* を使って疑問文にしています。
  ro.a1.unit16.lesson03.teach.line04:
    title: 病気で医者が必要だと答える
    gloss: ミハイは、はい、病気なので医者が必要だと言います。
    note: このユニットの *sunt bolnav* と *am nevoie de un doctor* を組み合わせています。
  ro.a1.unit16.lesson03.teach.line05:
    title: アドバイスをして別れを告げる
    gloss: アナは、休んでたっぷり水を飲むように言って、別れのあいさつをします。
    note: このレッスンの *Odihnă și multă apă* を使っています。いつもの別れのあいさつだけでなく、健康のためのアドバイスが加わっています。
  ro.a1.unit16.lesson03.teach.line06:
    title: お礼を言って別れを告げる
    gloss: ミハイは、アナにお礼を言って別れのあいさつをします。
    note: これまでのどのユニットの会話も、この同じ締めくくりで終わっています。
