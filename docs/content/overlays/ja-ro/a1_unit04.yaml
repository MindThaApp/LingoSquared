answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02/03''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: ルーマニア語 A1
  description: ルーマニア語で時刻を尋ねたり答えたりする方法を学びます。ちょうどの時刻、30分、15分過ぎ、15分前、一日の時間帯、何かが始まる時刻の尋ね方を扱い、アナとミハイがルーマニア語のクラスの開始時間を決める場面の続きです。
units:
  ro.a1.unit04.time:
    title: 時刻の伝え方
lessons:
  ro.a1.unit04.lesson01.ora_fixa_si_jumatate:
    title: ちょうどの時刻と30分
  ro.a1.unit04.lesson02.sferturi_si_intrebari:
    title: 15分と時刻の尋ね方
  ro.a1.unit04.lesson03.cand_incepe_cursul:
    title: クラスは何時に始まりますか?
teaching:
  ro.a1.unit04.lesson01.teach.este:
    title: 復習:este
    gloss: ~です/~である
    note: '*Este* はユニット2とユニット3にも出てきました。数、曜日、日付、そして今回の時刻を言うときも、まったく同じ形のままです。'
  ro.a1.unit04.lesson01.teach.ora:
    title: 時
    gloss: 時、時刻
    note: 女性名詞です。*ora* は時刻を言うとき数字の直前に置きます。例:*ora unu*(1時)。
    example_gloss: 1時です。
  ro.a1.unit04.lesson01.teach.ora_unu:
    title: 1時
    gloss: 1時
    note: 直訳は「その時 1」。ora が先で、あとに数字が来ます。
  ro.a1.unit04.lesson01.teach.ora_doua:
    title: 2時
    gloss: 2時
    note: ここでは数字が女性形の *două* になり、女性名詞の *ora* に合わせています。全体のパターンは次のカードで確認します。
  ro.a1.unit04.lesson01.teach.ora_gender_note:
    title: 本当の例外:unu は unu のまま
    gloss: 1時(ora una ではない)/2時(ora doi ではない)
    note: 女性形を持つ数字は、ふつう女性名詞と一緒に女性形になります(*doi* → 女性名詞 *ora* には *două*)。ただし時刻では *unu* だけが例外で、*ora* が女性名詞でも、いつも *ora unu* であり *ora una* とは言いません。
  ro.a1.unit04.lesson01.teach.ora_trei:
    title: 3時
    gloss: 3時
    note: Trei は性によって形が変わりません。unu/una や doi/două と違い、覚えることが一つ少なくて済みます。
  ro.a1.unit04.lesson01.teach.jumatate:
    title: 半分
    gloss: 半分
    note: și(~と)と一緒に使って「~時半」を表します。X și jumătate。
    example_gloss: 1時半です。
  ro.a1.unit04.lesson01.teach.ora_unu_jumatate:
    title: 1時半
    gloss: 1時半です。
    note: 直訳は「1時と半分」。次の時刻に向かって半分という言い方をする言語もありますが、ルーマニア語はそうではなく、とても単純です。
  ro.a1.unit04.lesson01.teach.cat_e_ora:
    title: 時刻をたずねる
    gloss: 何時ですか？
    note: 時計の時刻を尋ねる日常的な言い方です。cât(いくつ。ユニット2の câți の仲間)+ este + ora(時)。
  ro.a1.unit04.lesson02.teach.sfert:
    title: 15分
    gloss: 4分の1、15分
    note: 1時間の4分の1、つまり15分のことです。și(~と)または fără(~なしで)と組み合わせて、「15分過ぎ」「15分前」を表します。
    example_gloss: 1時15分です。
  ro.a1.unit04.lesson02.teach.sfert_rule:
    title: 15分や30分での și と fără
    gloss: și un sfert = 15分過ぎ ・ fără un sfert = 15分前
    note: '*Și*(~と)は過ぎたばかりの時刻に分を足し、*fără*(~なしで)はこれから来る時刻から分をさかのぼって数えます。日本語の「~時15分」と「~時15分前」の違いに似た考え方です。'
  ro.a1.unit04.lesson02.teach.ora_doua_sfert:
    title: 2時15分
    gloss: 2時15分です。
    note: Ora două(2時)+ și un sfert(15分を足す)= 2時15分。
  ro.a1.unit04.lesson02.teach.fara:
    title: ~なしで/~前
    gloss: ~なしで、~前
    note: 次の時刻からさかのぼって分を数えます。日本語の「3時15分前」の「前」にあたる役割です。
    example_gloss: 3時15分前です。
  ro.a1.unit04.lesson02.teach.ora_trei_fara_sfert:
    title: 3時15分前
    gloss: 3時15分前です。
    note: Ora trei(3時)から fără un sfert(15分引く)= 2時45分。ルーマニア語では、過ぎたばかりの時刻ではなく、向かっていく時刻を基準に言います。
  ro.a1.unit04.lesson02.teach.la_ce_ora:
    title: 何時にかを尋ねる
    gloss: 何時に？
    note: La(~に)+ ce(何)+ oră(時。ここでは ora ではなく不定の形)。何かがいつ起こるかを尋ける日常的な言い方です。
  ro.a1.unit04.lesson02.teach.la_ora_noua:
    title: いつ起こるかを答える
    gloss: 9時に。
    note: La(~に)+ ora(時。ここでは定の形)+ 数字。'La ce oră?' に対する答え方です。
  ro.a1.unit04.lesson02.teach.tarziu:
    title: 遅れて
    gloss: 遅い
    note: 時刻を確認したときによく使う、便利な反応の言葉です。
    example_gloss: 遅い!
  ro.a1.unit04.lesson03.teach.cand:
    title: 復習:când
    gloss: いつ?
    note: Când はユニット3で行事がいつかを尋ねるときに出てきました。ここでは、何かがいつ始まるかを尋ねるのに再び使います。
  ro.a1.unit04.lesson03.teach.zi_parts:
    title: 一日の時間帯
    gloss: 朝/午後/夕方/夜
    note: これらはどれも名詞の定の形が副詞のように使われたものです。ルーマニア語では「朝に」を、日本語の「朝」のように前置詞なしで簡単に言えます。
    example_gloss:
    - クラスは朝です。
    - クラスは午後です。
    - ミハイは夕方に働きます。
    - アナは夜に寝ます。
  ro.a1.unit04.lesson03.teach.cursul:
    title: クラス
    gloss: クラス/講座
    note: curs(クラス、講座)の定の形です。ここではアナとミハイのルーマニア語のクラスを指します。
    example_gloss: クラスは9時に始まります。
  ro.a1.unit04.lesson03.teach.incepe:
    title: 始まる
    gloss: 始まる
    note: 彼・彼女・それに対応する現在形です。cursul(クラス)のように、私とあなた以外の単数の主語に使います。
    example_gloss: クラスは朝に始まります。
  ro.a1.unit04.lesson03.teach.cand_incepe_cursul:
    title: クラスがいつ始まるか尋ねる
    gloss: クラスは何時に始まりますか?
    note: când に、このレッスンで新しく出た începe と cursul を組み合わせた文です。
  ro.a1.unit04.lesson03.teach.raspuns_curs:
    title: クラスがいつ始まるか答える
    gloss: クラスは朝9時に始まります。
    note: 曜日のあとに日付を加えたユニット3と同じように、時間帯の副詞(dimineața)をコンマで区切って最後に添えています。
  ro.a1.unit04.lesson03.teach.line01:
    title: クラスがいつ始まるか尋ねる
    gloss: アナはミハイにクラスがいつ始まるか尋ねます。
    note: 丁寧さに偏りのない普通の質問です。este と începe は tu でも dumneavoastră でも形が変わりません。
  ro.a1.unit04.lesson03.teach.line02:
    title: 時刻を答える
    gloss: ミハイは、クラスは朝9時に始まると言います。
    note: ミハイは、このレッスンの「時刻+時間帯」のパターンをそのまま使っています。
  ro.a1.unit04.lesson03.teach.line03:
    title: お礼を言って締めくくる
    gloss: アナはお礼を言って、別れの挨拶をします。
    note: ユニット1で習った La revedere は、いつもと同じようにやり取りを締めくくります。
  ro.a1.unit04.lesson03.teach.line04:
    title: 会話を締めくくる
    gloss: ミハイもアナの名前を呼んで別れの挨拶を返します。
    note: la revedere に相手の名前を添えて返すのは、自然で親しみのある締めくくり方です。
