answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (tren, pleacă, bilet, peron, București, Drum bun) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing formal register with each other; no new tu/dumneavoastră form is introduced this unit.
course:
  title: ルーマニア語 A1
  description: ルーマニア語で基本的な列車の旅をこなします。Tren(列車)、Bilet(切符)、Peron(プラットホーム)、Pleacă(出発する)を使い、ミハイがブカレスト行きの列車に乗り、アナが gară(駅)で見送ります。
units:
  ro.a1.unit15.travel:
    title: 旅行
lessons:
  ro.a1.unit15.lesson01.trenul_pleaca:
    title: 列車が出発します
  ro.a1.unit15.lesson02.un_bilet_va_rog:
    title: 切符をお願いします
  ro.a1.unit15.lesson03.la_gara:
    title: 駅で
teaching:
  ro.a1.unit15.lesson01.teach.reminder_gara_ora:
    title: おさらい：gară, este, la, ce, oră, ora, nouă
    gloss: gară(駅) · este(〜です) · la(〜に・〜へ) · ce(何・どの) · oră(時間) · ora(その時刻) · nouă(9)
    note: Gară はユニット8・ユニット9、este/la/ce/oră/ora/nouă はユニット4(時刻)で学びました。このユニットでは、ユニット4の "la ce oră"/"la ora nouă" の型を、授業ではなく列車についてたずねるという新しい目的で使います。
  ro.a1.unit15.lesson01.teach.tren_vocab:
    title: 列車
    gloss: Tren(列車)
    note: 中性名詞で、子音で終わります(単数では、中性名詞は男性名詞と同じように扱われます：*un tren*)。「その列車」は *-ul* を付けて作ります。*magazin*->*magazinul* と同じ語尾です。*gară* のように *-ă* で終わる名詞は、代わりに *-a* を付けます(*gara*)。
    example_gloss:
    - 電車は駅にいます。
  ro.a1.unit15.lesson01.teach.pleaca_vocab:
    title: 出発する
    gloss: Pleacă(出発する・3人称単数)
    note: 列車やバス、飛行機が出発することを表す動詞です。*Trenul pleacă* -- *pleacă* はそれだけで完全な動詞なので、*este* は要りません。
    example_gloss:
    - 列車が出発します。
  ro.a1.unit15.lesson01.teach.trenul_pleaca_ora_noua_phrase:
    title: 列車は9時に出発します
    gloss: Trenul pleacă la ora nouă.(列車は9時に出発します。)
    note: '*trenul* と *pleacă* に、ユニット4の *la ora nouă* を組み合わせています。新しい時刻の語は必要ありません。'
  ro.a1.unit15.lesson01.teach.la_ce_ora_pleaca_trenul_phrase:
    title: 電車は何時に出ますか？
    gloss: La ce oră pleacă trenul?(列車は何時に出発しますか。)
    note: ユニット4の *La ce oră...?* という質問の型を、授業ではなく *trenul* についてたずねるのに使います。
  ro.a1.unit15.lesson01.teach.peron_vocab:
    title: プラットホーム
    gloss: Peron(プラットホーム)
    note: 駅の列車のホームです。中性名詞で子音で終わるので、「そのホーム」は *peronul* になります。*tren*->*trenul* と同じ *-ul* の語尾です。
    example_gloss:
    - 列車は3番ホームにあります。
  ro.a1.unit15.lesson01.teach.de_la_ce_peron_phrase:
    title: 列車はどのホームから出発しますか
    gloss: De la ce peron pleacă trenul?(列車はどのホームから出発しますか。)
    note: '*De la*(〜から)+ *ce peron*(どのホーム)-- ここの語はすべて学習済みで、組み合わせて新しい質問にしただけです。'
  ro.a1.unit15.lesson02.teach.reminder_as_dori_va_rog_cat_costa:
    title: おさらい：aș dori, vă rog, cât costă, costă, lei
    gloss: aș dori(〜がほしいのですが) · vă rog(お願いします・丁寧) · cât costă(いくらですか) · costă(〜の値段です) · lei(レイ・通貨)
    note: すべてユニット6(食べ物)とユニット7(買い物)で学びました。このユニットでは、同じ丁寧な依頼の表現と値段の表現を、食べ物ではなく列車の切符を買うために使います。
  ro.a1.unit15.lesson02.teach.bilet_vocab:
    title: 切符
    gloss: Bilet(切符)
    note: 電車の切符です。中性名詞で、単数では男性名詞と同じ *un* を取るので、「1枚の切符」は *un bilet* です。
    example_gloss:
    - 切符を持っています。
  ro.a1.unit15.lesson02.teach.bucuresti_vocab:
    title: ブカレスト
    gloss: București(ブカレスト)
    note: ルーマニアの首都です。このコースでは、行き先の例としてよく使います。
    example_gloss:
    - 電車はブカレストに向けて出発します。
  ro.a1.unit15.lesson02.teach.as_dori_bilet_bucuresti_phrase:
    title: ブカレストまでの切符をお願いします
    gloss: Aș dori un bilet la București, vă rog.(ブカレストまでの切符をお願いします。)
    note: 第6課・第7課で学んだ丁寧な依頼の表現 *Aș dori... vă rog* を、今度は食べ物ではなく切符を頼むときに使います。
  ro.a1.unit15.lesson02.teach.cat_costa_bilet_bucuresti_phrase:
    title: ブカレストまでの切符はいくらですか
    gloss: Cât costă un bilet la București?(ブカレストまでの切符はいくらですか。)
    note: 第7課の値段のたずね方 *Cât costă...?* を、今度はジャガイモ1キロではなく切符について使います。
  ro.a1.unit15.lesson02.teach.costa_zece_lei_phrase:
    title: 40レイです
    gloss: Costă patruzeci de lei.(40レイです。)
    note: Zece(10)は2〜19の範囲に入るので、*lei* の前に *de* は要りません。第7課で学んだ規則と同じです。
  ro.a1.unit15.lesson03.teach.reminder_travel_words:
    title: 復習：tren, pleacă, peron, bilet, București, trei, am
    gloss: tren(電車)· pleacă(出発する)· peron(ホーム)· bilet(切符)· București(ブカレスト)· trei(3、第2課)· am(私は持っている、第2課)
    note: Tren/pleacă/peron/bilet/București はこの単元のレッスン1・2の語です。trei と am は第2課(数字)の語で、駅でアナとミハイが「peronul trei」と「am un bilet」を一緒に使うので、ここでもう一度取り上げます。
  ro.a1.unit15.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 復習：bună, mulțumesc, la revedere, Ana, Mihai
    gloss: bună(こんにちは)· mulțumesc(ありがとう)· la revedere(さようなら)· Ana, Mihai(人名)
    note: どれもこれまでの単元で学んだ語です。このコースの会話はいつも、こうした親しみのあるあいさつで始まり、終わります。
  ro.a1.unit15.lesson03.teach.drum_bun_vocab:
    title: 良い旅を
    gloss: Drum bun(良い旅を/道中ご無事で)
    note: これから旅に出る人にかける決まった別れの言葉です。直訳は「良い道」ですが、日本語の「良い旅を」「道中ご無事で」のように使います。
    example_gloss:
    - ミハイ、良い旅を！
  ro.a1.unit15.lesson03.teach.line01:
    title: あいさつして電車のことをたずねる
    gloss: アナはミハイにあいさつして、電車が何時に出発するかをたずねます。
    note: この単元のレッスン1の質問を、今度はミハイに直接話しかける形で使います。
  ro.a1.unit15.lesson03.teach.line02:
    title: 出発時刻を伝える
    gloss: ミハイは、電車は9時に出発すると答えます。
    note: この単元のレッスン1の表現をそのまま使います。
  ro.a1.unit15.lesson03.teach.line03:
    title: ホームをたずねる
    gloss: アナは、どのホームからかをたずねます。
    note: 短い追加の質問です。*de la ce peron* はレッスン1で完全な形が出ました。ここではアナが短くたずね、残りはミハイが補って答えてくれると期待しています。
  ro.a1.unit15.lesson03.teach.line04:
    title: ホームと切符を伝える
    gloss: ミハイは、3番ホームであること、そしてブカレストまでの切符を持っていることを伝えます。
    note: この単元の peron と bilet/București の語彙を、ひとつの答えにまとめています。
  ro.a1.unit15.lesson03.teach.line05:
    title: 良い旅を願ってさよならを言う
    gloss: アナはミハイに良い旅を願い、別れのあいさつをします。
    note: このレッスンの *Drum bun* を使います。いつもの *la revedere* だけでなく、旅立ちの人に向けた別れの言葉です。
  ro.a1.unit15.lesson03.teach.line06:
    title: お礼を言ってさよならを言う
    gloss: ミハイはアナにお礼を言い、別れのあいさつをします。
    note: これまでの単元の会話と同じ、いつもの締めくくりです。
