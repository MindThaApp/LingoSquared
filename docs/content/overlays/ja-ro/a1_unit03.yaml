answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Day and month names are correctly lowercase in standard Romanian writing (except sentence-initially); accept a learner's answer regardless of the case they happen to type it in -- this unit teaches the lowercase convention as a fact to recognize, not a hard-graded spelling rule.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register ユニット1 already established between them.
course:
  title: ルーマニア語 A1
  description: 曜日、月の名前、そしてルーマニア語での日付の言い方(ふつうの基数+月。ただし1日だけは特別な語 întâi を使います)を学びます。アナとミハイが次の会う予定を相談する場面が続きます。
units:
  ro.a1.unit03.dates:
    title: 曜日と日付
lessons:
  ro.a1.unit03.lesson01.zilele_saptamanii:
    title: 曜日
  ro.a1.unit03.lesson02.lunile_si_datele:
    title: 月の名前と日付の言い方
  ro.a1.unit03.lesson03.cand_ne_intalnim:
    title: 次はいつ会いましょうか。
teaching:
  ro.a1.unit03.lesson01.teach.este:
    title: 復習:este
    gloss: ~です / ~である
    note: '*Este* は第2単元の *Care este numărul...?* ですでに出てきました。主語が曜日でも日付でもほかのものでも同じ形で、tu と dumneavoastră で変わることもありません。'
  ro.a1.unit03.lesson01.teach.astazi_maine:
    title: 今日、明日
    gloss: astăzi(今日)/ mâine(明日)
    note: どちらも不変化の時を表す語で、何曜日か、何日かを述べる文の先頭に置かれます。
    example_gloss:
    - 今日は月曜日です。
    - 明日は火曜日です。
  ro.a1.unit03.lesson01.teach.luni_marti:
    title: 月曜日、火曜日
    gloss: luni(月曜日)/ marți(火曜日)
    note: 曜日を言うとき(Astăzi este luni)は、ここに示した何も付かない形を使います。曜日名には冠詞の付いた形(lunea、marțea)もあり、「毎週月曜日に」「毎週火曜日に」の意味になります。これは後で学びます。
    example_gloss:
    - 今日は月曜日です。
    - 明日は火曜日です。
  ro.a1.unit03.lesson01.teach.miercuri_joi:
    title: 水曜日、木曜日
    gloss: miercuri(水曜日)/ joi(木曜日)
    note: luni や marți と同じく、miercuri と joi も単数と複数で形が変わりません。
    example_gloss:
    - 今日は水曜日です。
    - 明日は木曜日です。
  ro.a1.unit03.lesson01.teach.vineri_sambata:
    title: 金曜日、土曜日
    gloss: vineri(金曜日)/ sâmbătă(土曜日)
    note: 現代の正書法では、sâmbătă は語の中ほどに â を使って綴ります。古い綴りの sîmbătă とは異なります。
    example_gloss:
    - 今日は金曜日です。
    - 明日は土曜日です。
  ro.a1.unit03.lesson01.teach.duminica:
    title: 日曜日
    gloss: 日曜日
    note: Duminică で一週間の曜日がそろいます。何曜日かを言うときはこの何も付かない形を使います。冠詞の付いた形 duminica は「毎週日曜日に」の意味です。
    example_gloss: 今日は日曜日です。
  ro.a1.unit03.lesson01.teach.ce_zi_e_azi:
    title: 何曜日か尋ねる
    gloss: 今日は何曜日ですか？
    note: 曜日を尋ねるときの日常的な言い方です。zi(日)が新しい語で、ce、este、astăzi はすでに学んだ語です。
  ro.a1.unit03.lesson01.teach.saptamana_ieri:
    title: 週、昨日、先週・来週
    gloss: săptămână(週)/ ieri(昨日)/ săptămâna trecută(先週)/ săptămâna viitoare(来週)
    note: 曜日の名前と合わせて覚えておくと便利な語です。日付を「昨日」「先週」「来週」のように相対的に言うときに役立ちます。この単元の練習では、曜日ほど繰り返しません。
  ro.a1.unit03.lesson01.teach.lowercase_zile:
    title: 曜日は小文字で書く
    gloss: 曜日名は大文字で始めません:luni、vineri。
    note: ルーマニア語の曜日名は、文の途中では大文字で始めません。*Luni* ではなく *luni* と書きます。文の最初に来るときだけ大文字になります。
  ro.a1.unit03.lesson02.teach.ian_feb_mar:
    title: 1月、2月、3月
    gloss: ianuarie(1月)/februarie(2月)/martie(3月)
    note: 曜日の名前と違って、月の名前にはラテン語系の語に由来する、見ればそれとわかる似た形の語がいくつかあります。
    example_gloss:
    - 1月です。
    - 2月です。
    - 3月です。
  ro.a1.unit03.lesson02.teach.apr_mai_iun:
    title: 4月、5月、6月
    gloss: aprilie(4月)/mai(5月)/iunie(6月)
    note: mai(5月)は短い語ですが、このコースの別の場面で使う副詞の mai(もっと。ce mai faci など)とは別の語です。文脈で必ず区別できます。
    example_gloss:
    - 4月です。
    - 5月です。
    - 6月です。
  ro.a1.unit03.lesson02.teach.iul_aug_sep:
    title: 7月、8月、9月
    gloss: iulie(7月)/august(8月)/septembrie(9月)
    note: august はラテン語系の月名の形をそのまま残した語で、この中でも特に意味の見当がつけやすい語です。
    example_gloss:
    - 7月です。
    - 8月です。
    - 9月です。
  ro.a1.unit03.lesson02.teach.oct_noi_dec:
    title: 10月、11月、12月
    gloss: octombrie(10月)/noiembrie(11月)/decembrie(12月)
    note: 最後の3つで12か月がそろいます。どれも形が変わらない名詞です。
    example_gloss:
    - 10月です。
    - 11月です。
    - 12月です。
  ro.a1.unit03.lesson02.teach.intai:
    title: 1日(月の初日)
    gloss: 1日
    note: ルーマニア語特有の決まりです。標準的な言い方では、月の1日には普通の「1」の *unu* を使わず、専用の語 *întâi* を使います。(くだけた会話では *unu* も聞かれますが、覚えるのは *întâi* です。)2日以降は、普通の基数をそのまま使います。
    example_gloss: 今日は8月1日です。
  ro.a1.unit03.lesson02.teach.date_rule:
    title: ルーマニア語の日付の言い方
    gloss: 1日:întâi ・ 2日以降:普通の数(doi, trei, patru...)
    note: 2日以降の日付は、これまでに学んだ基数に月を続けるだけです。序数の形も余分な語も要りません。例:*trei aprilie*(4月3日。直訳は「3 4月」)。
  ro.a1.unit03.lesson02.teach.ce_data:
    title: 日付をたずねる
    gloss: 今日は何月何日ですか?
    note: dată(日付)はここで初めて出る語です。それ以外の ce、este、astăzi は、レッスン1の曜日の質問と同じように使われています。
  ro.a1.unit03.lesson02.teach.raspuns_data:
    title: 日付を言う
    gloss: 今日は4月3日です。
    note: trei(3)はユニット2で学んだ基数です。序数の語尾も余分な語も付けず、そのまま aprilie の前に置きます。
  ro.a1.unit03.lesson02.teach.la_multi_ani:
    title: 特別な日にお祝いを言う
    gloss: お誕生日おめでとう!/明けましておめでとう!
    note: 直訳は「(これからも)多くの年を」。誕生日、霊名の祝日、新年のいずれにも使える、最もよく使われるお祝いの言葉です。ユニット2の年齢の表現で学んだ *ani*(年)が使われています。
  ro.a1.unit03.lesson02.teach.lowercase_luni:
    title: 月名も小文字で書く
    gloss: 月の名前は大文字で書き始めません:ianuarie、mai。
    note: レッスン1の曜日名と同じ決まりです。ルーマニア語の月名は、文中では小文字のままです。
  ro.a1.unit03.lesson03.teach.cand:
    title: いつ?
    gloss: いつ?
    note: Când は、時を尋ねる疑問文の文頭に置く語です。日本語の「いつ」にあたります。
    example_gloss: 会議はいつですか。
  ro.a1.unit03.lesson03.teach.intalnirea:
    title: 会議
    gloss: 会議
    note: Întâlnirea は定冠詞が付いた形(その会議)です。冠詞のない形は întâlnire です。
    example_gloss: 会議は月曜日です。
  ro.a1.unit03.lesson03.teach.cand_e_intalnirea:
    title: いつかを尋ねる
    gloss: 会議はいつですか。
    note: când に、すでに学んだ este と、このレッスンの新出語 întâlnirea を組み合わせた文です。
  ro.a1.unit03.lesson03.teach.raspuns_intalnire:
    title: 行事の日付を言う
    gloss: 会議は8月1日の金曜日です。
    note: 曜日と日付は、コンマで区切って続けて言うことができます。日本語の「8月1日の金曜日」と違い、ルーマニア語では曜日を先に言います。
  ro.a1.unit03.lesson03.teach.fara_de:
    title: 曜日と日付には de は要らない
    gloss: 曜日と日付には「de」は要りません:vineri, întâi august。
    note: ユニット2の決まりと比べると役立ちます。20以上の数は普通の名詞の前に *de* が必要です(*treizeci de ani*)が、曜日や日付には *de* を付けず、そのままつなげます。
  ro.a1.unit03.lesson03.teach.line01:
    title: 会議がいつか尋ねる
    gloss: アナはミハイに、会議がいつか尋ねます。
    note: 丁寧さに偏りのない普通の質問です。este は tu でも dumneavoastră でも変わりません。
  ro.a1.unit03.lesson03.teach.line02:
    title: 日付を答える
    gloss: ミハイは、会議は8月1日の金曜日だと答えます。
    note: ミハイはレッスン2とまったく同じ日付の型を使っています。曜日、次に întâi と月で、de は付けません。
  ro.a1.unit03.lesson03.teach.line03:
    title: 返事をして会話を終える
    gloss: アナはお礼を言って、別れの挨拶をします。
    note: ユニット1で学んだ La revedere は、いつもと同じように会話を締めくくります。
  ro.a1.unit03.lesson03.teach.line04:
    title: 会話を締めくくる
    gloss: ミハイもアナの名前を添えて、別れの挨拶を返します。
    note: la revedere に相手の名前を添えて返すのは、自然で親しみのある終わり方です。
