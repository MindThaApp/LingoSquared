answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: ルーマニア語 A1
  description: 人の基本的な外見を描写する初級ルーマニア語:身長や年齢の印象、髪と目の色、基本の質問 Cum arată ...?、2人の外見の比較。
units:
  ro.a1.unit31.aspect:
    title: 外見を説明する
lessons:
  ro.a1.unit31.lesson01.inalt_scund_batran_si:
    title: 背が高い、背が低い、年を取った、若い
  ro.a1.unit31.lesson02.descrierea_parului:
    title: 髪について説明する
  ro.a1.unit31.lesson03.ochii_si_cum_arata:
    title: 目と人の外見の尋ね方
  ro.a1.unit31.lesson04.ana_o_descrie_pe:
    title: アナがニーナの外見を説明する
  ro.a1.unit31.lesson05.ii_comparam_pe_andrei:
    title: アンドレイとエレナを比べる
  ro.a1.unit31.lesson06.mihai_o_recunoaste_pe:
    title: ミハイがニーナを見つける
teaching:
  ro.a1.unit31.lesson01.teach.inalt_scund:
    title: 背が高い、背が低い
    gloss: 背が高い／背が低い
    note: '*Înalt* は背が高い人、*scund* は背が低い人を表します。どちらにも女性形があります:*înaltă*、*scundă*。'
    example_gloss:
    - エレナは背が高いです。
    - アンドレイは背が低いです。
  ro.a1.unit31.lesson01.teach.batran_tanar:
    title: 年を取った、若い
    gloss: 年を取った／若い
    note: '*Bătrân* と *tânăr* は、ここでは正確な年数ではなく、年齢の全体的な印象を表します。女性形:*bătrână*、*tânără*。'
    example_gloss:
    - おじいさんは年を取っています。
    - ミハイは若いです。
  ro.a1.unit31.lesson01.teach.pentru_varsta_exacta:
    title: Bătrân:印象か、数字か
    gloss: 正確な年齢は Câți ani ai? で尋ね、bătrân は Bunicul este bătrân. のように全体的な印象を表します。
    note: 正確な年齢は *Câți ani ai?* で尋ねられます。ここでの *bătrân* は、数字を示さず、その人が何歳くらいに「見えるか」を表します。
  ro.a1.unit31.lesson01.teach.elena_este_inalta:
    title: エレナは背が高く、アンドレイは背が低い
    gloss: エレナは背が高く、アンドレイは背が低いです。
    note: '*și*(〜と、そして)を使った簡単な複文で、レッスン5の直接の比較につながります。形容詞は主語に合わせて変わります:エレナは *înaltă*、アンドレイは *scund*。'
  ro.a1.unit31.lesson02.teach.parul:
    title: 髪
    gloss: 髪
    note: '*Păr* は男性名詞で、冠詞が語末につきます:*părul*(その髪)。'
    example_gloss: ミハイは短い黒髪です。
  ro.a1.unit31.lesson02.teach.blond_maro_carunt:
    title: 金色、茶色、灰色
    gloss: 金色の／茶色の／灰色の
    note: 髪の色を表す3つの語です。名詞 *păr*(男性)の後に置かれ、*părul blond*、*păr maro*、*păr cărunt* のように言います。
    example_gloss:
    - アナは金髪です。
    - アンドレイは茶色の髪です。
    - おじいさんは白髪です。
  ro.a1.unit31.lesson02.teach.lung_scurt:
    title: 長い髪と短い髪
    gloss: 長い／短い（髪）
    note: '*Lung*(長い)と *scurt*(短い)は髪の長さを表します。色と同じく、名詞の後に置きます。'
    example_gloss:
    - エレナは長い髪です。
    - アンドレイは短い髪です。
  ro.a1.unit31.lesson02.teach.adjectivul_vine_dupa:
    title: 形容詞は名詞のあとに置く
    gloss: 形容詞は名詞の後に来ます:păr scurt、păr lung、păr blond、păr maro、păr cărunt、păr negru。
    note: ルーマニア語では形容詞は名詞の「後」に来ます(*păr scurt*)。日本語で「短い髪」と形容詞が名詞の前に来るのとは語順が逆です。
  ro.a1.unit31.lesson02.teach.posesivul_vine_dupa:
    title: 「彼の」「彼女の」は名詞の後に来る
    gloss: 所有を表す語は名詞の後に来ます:părul ei(彼女の髪)、ochii lui(彼の目)。
    note: '*Ei* は「彼女の」、*lui* は「彼の」の意味で、どちらも名詞の後に置きます:*părul ei*。誰のことかは文脈で分かります。'
  ro.a1.unit31.lesson02.teach.mihai_are_parul:
    title: ミハイは短い黒髪です
    gloss: ミハイは短い黒髪です。
    note: '*Negru*(黒い)は色の形容詞で、名詞の後に置きます:*păr negru*。'
  ro.a1.unit31.lesson02.teach.ana_are_parul:
    title: アナは長い金髪です
    gloss: アナは長い金髪です。
    note: このレッスンで学ぶ長さと色の語彙を、自然な1つの文に組み合わせています。
  ro.a1.unit31.lesson03.teach.ochii:
    title: 目
    gloss: 目
    note: '*Ochi*(目)は単数と複数で同じ形です。数は冠詞で分かります:*ochiul*(その目)、*ochii*(それらの目)。'
    example_gloss: ミハイは茶色の目をしています。
  ro.a1.unit31.lesson03.teach.albastru_maro_verde:
    title: 青、茶色、緑
    gloss: 青い／茶色い／緑色の
    note: '*Albastru*(青い)、*maro*(茶色の)、*verde*(緑の)は色の形容詞です。*Maro* は変化しません。複数では *albastru* は *albaștri*、*verde* は *verzi* になります。'
    example_gloss:
    - アナは青い目をしています。
    - アンドレイは茶色の目をしています。
    - エレナは緑の目をしています。
  ro.a1.unit31.lesson03.teach.la_plural_adjectivul:
    title: 複数の形容詞
    gloss: 複数では形容詞の形が変わります:ochi albaștri、ochi maro、ochi verzi。
    note: 複数の *ochi* には形容詞も複数形(*albaștri*、*verzi*)がつきます。*maro* は変わりません。単数の *păr albastru* と比べてみましょう。
  ro.a1.unit31.lesson03.teach.cum_arata_ana:
    title: アナはどんな外見ですか?
    gloss: アナはどんな外見ですか?
    note: '*Cum arată ...?* はこのユニットの中心となる質問です。誰の外見を尋ねるときにも使えます。'
  ro.a1.unit31.lesson03.teach.ana_are_parul:
    title: アナは長い金髪で、青い目をしています
    gloss: アナは長い金髪で、青い目をしています。
    note: 髪と目を *și* でつないで一文にした模範的な答えです。
  ro.a1.unit31.lesson04.teach.ana_vine_o:
    title: アナがニーナを紹介する
    gloss: アナ:語学カフェに新しい女の子が来るの。名前はニーナだよ。
    note: '*Vine o fată nouă*(「新しい女の子が来る」)は初めての人を紹介する表現で、*O cheamă Nina* で名前を伝えます。'
  ro.a1.unit31.lesson04.teach.mihai_bine_cum:
    title: ミハイが外見を尋ねる
    gloss: ミハイ:いいね!どんな外見?
    note: 名前を言わずに、このユニットの中心の質問を使っています:*Cum arată?*(誰のことかは文脈で分かります)。
  ro.a1.unit31.lesson04.teach.ana_este_scunda:
    title: アナがニーナの身長と髪を説明する
    gloss: アナ:背が低くて、短い金髪だよ。
    note: レッスン1の *scundă* とレッスン2の髪の語彙を組み合わせています。
  ro.a1.unit31.lesson04.teach.mihai_si_ochii:
    title: ミハイが目について尋ねる
    gloss: ミハイ:目は?
    note: '*Și ochii?*(「目は?」)は短い追加の質問で、誰のことかは文脈で分かります。'
  ro.a1.unit31.lesson04.teach.ana_are_ochi:
    title: アナがニーナの目を説明する
    gloss: アナ:緑の目だよ。
    note: レッスン3の *ochi verzi* をもう一度使っています。
  ro.a1.unit31.lesson04.teach.mihai_multumesc_atunci:
    title: ミハイは彼女が分かる
    gloss: ミハイ:ありがとう!それなら絶対に分かるよ。
    note: '*O recunosc* は「彼女だと分かる」という意味です。*o* は「彼女を」にあたる目的語の代名詞で、動詞の前に置きます。'
  ro.a1.unit31.lesson05.teach.andrei_si_elena:
    title: アンドレイとエレナを比べる
    gloss: アンドレイとエレナは兄妹ですが、見た目は違います。アンドレイは背が低く、短い茶色の髪で、茶色の目をしています。エレナはアンドレイより背が高く、長い茶色の髪で、緑の目をしています。あなたはどんな外見ですか?
    note: これまでに学んだ色や長さを表す語を使って人の見た目を比べ、最後に自分の見た目について答えます。
    glosses:
      frate: 兄弟
      soră: 姉妹
      arată: ～に見える
      diferit: 異なる
      scund: 背が低い
      scurt: 背が低い
      maro: 茶色の
      părul: 髪
      ochi: 目
      înaltă: より背が高い
      lung: 長い
      verzi: 緑色の
      arăți: 見える、(〜な)外見をしている
  ro.a1.unit31.lesson05.teach.comparativul_se_formeaza:
    title: mai ... decât で比べる
    gloss: 比較は mai + 形容詞 + decât で作ります:Elena este mai înaltă decât Andrei.
    note: ルーマニア語では、形容詞の前に *mai*(「より」)、比べる相手の前に *decât*(「〜よりも」)を置きます:*mai înaltă decât Andrei*。
  ro.a1.unit31.lesson05.teach.elena_are_parul:
    title: エレナはアンドレイより髪が長いです
    gloss: エレナはアンドレイより髪が長いです。
    note: '*Mai lung* も *decât* の前で同じように使います:*părul mai lung decât Andrei*。形容詞は今までどおり *părul* の後に来ます。'
  ro.a1.unit31.lesson05.teach.am_parul_scurt:
    title: 私は短い茶色の髪をしています
    gloss: 私は短い茶色の髪をしています。
    note: '*Am ...* を使った一人称の模範文です。自分の外見を説明するときにそのまま使えます。'
  ro.a1.unit31.lesson06.teach.mihai_uite_ea:
    title: ミハイがニーナを見つける
    gloss: ミハイ:ほら、あの子がニーナ?短い金髪で、緑の目だね。
    note: '*Uite*(ほら)は注意を引く言葉で、*ea e Nina?* は「あの子がニーナ?」と尋ねています。'
  ro.a1.unit31.lesson06.teach.ana_da_ea:
    title: アナが確認する
    gloss: アナ:うん、あの子がニーナだよ!
    note: 短く自然に、そうだと伝える表現です。
  ro.a1.unit31.lesson06.teach.nina_salut_tu:
    title: ニーナがミハイにあいさつする
    gloss: ニーナ:こんにちは、あなたがミハイ?
    note: くだけたあいさつの簡単な質問です:*tu ești ...?*
  ro.a1.unit31.lesson06.teach.mihai_da_ma:
    title: ミハイもあいさつを返す
    gloss: ミハイ:うん!はじめまして、ニーナ。
    note: '*Mă bucur să te cunosc*(「お会いできてうれしいです」)は、初対面のときの定番の表現です。'
  ro.a1.unit31.lesson06.teach.nina_si_eu:
    title: Ninaもあいさつを返します
    gloss: Nina：こちらこそ、はじめまして！
    note: ダイアログの締めくくりです。ミハイはアナの説明のおかげでニーナだと分かりました。
