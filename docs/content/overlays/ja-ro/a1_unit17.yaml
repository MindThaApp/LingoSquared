answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (inginer, birou, profesoară, școală) is used only in fixed first-person forms (Mihai's own "Sunt inginer", Ana's own "Sunt profesoară"). The one new conjugated verb form, "lucrați," reuses the already-established formal -ați/-eți ending. No informal-tu form is introduced this unit; Ana and Mihai keep their existing formal register with each other.
course:
  title: ルーマニア語 A1
  description: ミハイとアナが働く場所について話しながら、ルーマニア語で基本的な職業と職場の言い方を学びます。Inginer(エンジニア)、Profesoară(教師)、Birou(オフィス)、Școală(学校)。
units:
  ro.a1.unit17.work:
    title: 仕事
lessons:
  ro.a1.unit17.lesson01.mihai_este_inginer:
    title: ミハイはエンジニアです
  ro.a1.unit17.lesson02.ana_este_profesoara:
    title: アナは教師です
  ro.a1.unit17.lesson03.unde_lucrati_dialog:
    title: どこで働いていますか。
teaching:
  ro.a1.unit17.lesson01.teach.reminder_este_la_mihai:
    title: 復習：este、la、Mihai
    gloss: este(~です)・la(~で、~に)・Mihai(人名)
    note: Este はユニット3・4・8、la はユニット4の *la ora nouă*(9時に)で学びました。Mihai は第1ユニットから登場している人物の名前です。このユニットでは、この3つを使って彼の仕事について話します。
  ro.a1.unit17.lesson01.teach.reminder_lucrez_lucreaza:
    title: 復習：lucrez、lucrează
    gloss: lucrez(私は働く)・lucrează(彼/彼女は働く)
    note: どちらもユニット10の日課(*Lucrez seara.*)で学びました。このユニットでは、時間帯ではなく職業について話すのに使います。
  ro.a1.unit17.lesson01.teach.inginer_vocab:
    title: エンジニア
    gloss: Inginer(エンジニア)
    note: 男性形です。このユニットで使うのはミハイだけ(*Sunt inginer*)なので、女性形はまだ必要ありません。
    example_gloss:
    - ミハイはエンジニアです。
  ro.a1.unit17.lesson01.teach.birou_vocab:
    title: オフィス
    gloss: Birou(オフィス)
    note: ミハイが働く場所です。ユニット4で学んだ前置詞 *la*(~で)に続けて使います。
    example_gloss:
    - 彼はオフィスで働いています。
  ro.a1.unit17.lesson01.teach.mihai_este_inginer_lucreaza_la_birou_phrase:
    title: ミハイはエンジニアです。オフィスで働いています。
    gloss: Mihai este inginer. Lucrează la birou.
    note: ここの単語はすべて既習か今回の新出語で、ミハイの仕事についての2つの新しい文になっています。
  ro.a1.unit17.lesson02.teach.reminder_sunt_unde_ana:
    title: 復習：sunt、unde、Ana
    gloss: sunt(私は~です)・unde(どこ)・Ana(人名)
    note: Sunt はユニット16(*Sunt bolnav*)、unde はユニット7・8(*Unde pot să cumpăr...?*、*Unde este...?*)で学びました。Ana は第1ユニットから登場している人物の名前です。このユニットでは、この3つを使ってアナの仕事について話します。
  ro.a1.unit17.lesson02.teach.profesoara_vocab:
    title: 教師
    gloss: Profesoară(教師・女性)
    note: 女性形です。このユニットで使うのはアナだけ(*Sunt profesoară*)なので、男性形はまだ必要ありません。
    example_gloss:
    - 私は教師です。
  ro.a1.unit17.lesson02.teach.scoala_vocab:
    title: 学校
    gloss: Școală(学校)
    note: アナが働く場所です。*la birou* と同じように *la* を使います。
    example_gloss:
    - 私は学校で働いています。
  ro.a1.unit17.lesson02.teach.sunt_profesoara_lucrez_la_scoala_phrase:
    title: 私は教師です。学校で働いています。
    gloss: Sunt profesoară. Lucrez la școală.
    note: アナ自身の仕事の紹介です。今回の新出語2つと、ユニット16で学んだ *sunt* を組み合わせています。
  ro.a1.unit17.lesson02.teach.unde_lucrati_phrase:
    title: どこで働いていますか。
    gloss: Unde lucrați?(どこで働いていらっしゃいますか。丁寧)
    note: '*Lucrați* は丁寧な「あなたは働く」の形です。*aveți*、*faceți* で見た -ați/-eți の語尾と同じで、誰かの仕事を尋ねるときに使えます。'
  ro.a1.unit17.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 復習：Bună、Ce mai faceți?、Bine, mulțumesc
    gloss: Bună(こんにちは)・Ce mai faceți?(お元気ですか。丁寧)・Bine, mulțumesc(元気です、ありがとう)
    note: どれもユニット1の最初のあいさつで学んだ表現で、このユニットの会話の始まりに使います。
  ro.a1.unit17.lesson03.teach.reminder_si_dumneavoastra_la_revedere:
    title: 復習：Și dumneavoastră?、La revedere
    gloss: Și dumneavoastră?(あなたは？丁寧)・La revedere(さようなら)
    note: どちらもユニット1で学んだ表現で、ここでは自然な聞き返しと結びの言葉として使います。
  ro.a1.unit17.lesson03.teach.line01:
    title: あいさつして調子を尋ねる
    gloss: アナはミハイにあいさつして、調子を尋ねます。
    note: ユニット1の *Ce mai faceți?* のあいさつを再び使います。
  ro.a1.unit17.lesson03.teach.line02:
    title: 答えて、どこで働いているか尋ねる
    gloss: ミハイは答えてから、アナにどこで働いているか尋ねます。
    note: ユニット1の *Bine, mulțumesc* と、このユニットの *Unde lucrați?* を組み合わせています。
  ro.a1.unit17.lesson03.teach.line03:
    title: 職業と職場を言って、聞き返す
    gloss: アナは学校で教師として働いていると答え、ミハイに同じ質問を返します。
    note: このユニットの第2課のフレーズと、ユニット1の *Și dumneavoastră?* を組み合わせています。
  ro.a1.unit17.lesson03.teach.line04:
    title: 職業と職場を言う
    gloss: ミハイはオフィスでエンジニアとして働いていると言います。
    note: このユニットの第1課のフレーズをほぼそのまま使います。
  ro.a1.unit17.lesson03.teach.line05:
    title: 会話を終える
    gloss: アナがさようならを言います。
    note: これまでの各ユニットの会話と同じ、結びの型です。
  ro.a1.unit17.lesson03.teach.line06:
    title: さようならを言う
    gloss: ミハイがさようならを言います。
    note: これまでの各ユニットの会話と同じ、結びの型です。
