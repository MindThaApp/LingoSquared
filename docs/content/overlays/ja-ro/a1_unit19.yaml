answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (vreme, soare, cald, plouă, vânt, frig) is used only in person-invariant impersonal constructions ("Este soare," "Plouă," "Este vânt," "Este frig," "Cum este vremea?") with no register distinction of any kind. No new tu/ dumneavoastră form is introduced this unit; Ana and Mihai keep their existing formal register with each other in the dialogue's greeting/closing lines.
course:
  title: ルーマニア語 A1
  description: ルーマニア語で基本的な天気を表現します。Vreme(天気)、Soare(太陽/晴れ)、Cald(暖かい)、Plouă(雨が降る)、Vânt(風)、Frig(寒い)を学びながら、アナとミハイが明日の天気予報を確認し、いつ公園に行くか決めます。
units:
  ro.a1.unit19.weather:
    title: 天気
lessons:
  ro.a1.unit19.lesson01.vremea_de_azi:
    title: 今日の天気
  ro.a1.unit19.lesson02.vremea_de_maine:
    title: 明日の天気
  ro.a1.unit19.lesson03.planul_de_sambata:
    title: 土曜日の予定
teaching:
  ro.a1.unit19.lesson01.teach.reminder_ana_este:
    title: 復習：Ana, Este, Și
    gloss: Ana(名前)・Este(〜です)・Și(と、そして)
    note: Ana は第1ユニットから登場している登場人物の名前です。*este* は第8ユニットの場所の表現、*și* は第5ユニットで学びました。このユニットでは、この三つを使って今日の天気を説明します。
  ro.a1.unit19.lesson01.teach.reminder_astazi:
    title: 復習：Astăzi
    gloss: Astăzi(今日)
    note: 第3ユニットの日付の語彙で学びました。ここでは今日の天気を話すために再び使います。
  ro.a1.unit19.lesson01.teach.vreme_vocab:
    title: 天気
    gloss: Vreme(天気)
    note: '*Vremea* は *vreme* の定冠詞つきの形で、「その天気」を表します。-e で終わる女性名詞は -a がつきます。第18ユニットの *baie* → *baia*(バスルーム)と同じです。'
    example_gloss:
    - 天気はどうですか。
  ro.a1.unit19.lesson01.teach.cum_este_vremea_phrase:
    title: 天気はどうですか。
    gloss: Cum este vremea?(天気はどうですか。)
    note: 天気をたずねるときの日常的な言い方です。*cum* は第1・第9・第12ユニットで学びました。
  ro.a1.unit19.lesson01.teach.soare_vocab:
    title: 太陽/晴れ
    gloss: Soare(太陽/晴れ)
    note: '*este* と一緒に使って晴れの天気を表します。*Este soare* は直訳すると「太陽である」で、「晴れです」という意味です。'
    example_gloss:
    - 今日は晴れです。
  ro.a1.unit19.lesson01.teach.cald_vocab:
    title: 暖かい/暑い
    gloss: Cald(暖かい/暑い)
    note: 天気を表すときは形が変わらない語です。*Este cald* では常にこの同じ形を使い、性や数による変化はありません。
    example_gloss:
    - 今日は暖かいです。
  ro.a1.unit19.lesson01.teach.astazi_soare_cald_phrase:
    title: 今日は晴れです。暖かいです。
    gloss: Astăzi este soare. Este cald.
    note: すでに学んだ語や今回出てきた語を組み合わせて、今日の天気を表す二つの新しい文を作りました。
  ro.a1.unit19.lesson02.teach.reminder_mihai_maine:
    title: 復習：Mihai, Mâine
    gloss: Mihai(名前)・Mâine(明日)
    note: Mihai は第1ユニットから登場している登場人物の名前です。*mâine* は第3・第12ユニットで学びました。このユニットでは、どちらも明日の天気予報を話すために使います。
  ro.a1.unit19.lesson02.teach.reminder_nu_mergem_la_parc:
    title: 復習：Nu, Mergem, La parc
    gloss: Nu(いいえ/〜ない)・Mergem(私たちは行く)・La parc(公園へ)
    note: すべて第11ユニットの予定を相談する語彙です。ここでは、天気しだいで公園に行けるかどうかを決めるために使います。
  ro.a1.unit19.lesson02.teach.ploua_vocab:
    title: 雨が降っている
    gloss: Plouă(雨が降る)
    note: 非人称の動詞形です。*Este cald* に主語が要らないのと同じように、主語は必要ありません。
    example_gloss:
    - 明日は雨です。
  ro.a1.unit19.lesson02.teach.vant_vocab:
    title: 風
    gloss: Vânt(風)
    note: '*soare* と同じように *este* と一緒に使います。*Este vânt* は「風が強いです」という意味です。'
    example_gloss:
    - 明日は風が強いです。
  ro.a1.unit19.lesson02.teach.frig_vocab:
    title: 寒い
    gloss: Frig(寒い)
    note: '*este* と一緒に使います。*Este frig* は「寒いです」という意味です。'
    example_gloss:
    - 明日は寒いです。
  ro.a1.unit19.lesson02.teach.maine_ploua_phrase:
    title: 明日は雨です。風が強くて寒いです。
    gloss: Mâine plouă. Este vânt și este frig.
    note: すでに学んだ語や今回出てきた語を組み合わせて、明日の天気予報を一通り表現しました。
  ro.a1.unit19.lesson02.teach.nu_mergem_phrase:
    title: 明日は公園に行きません。
    gloss: Nu mergem la parc mâine.(明日は公園に行きません。)
    note: このレッスンの目標である、天気に合わせた予定の立て方です。第11ユニットの *mergem* と *la parc* の前に *nu* を置いています。
  ro.a1.unit19.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 復習：Bună, Ce mai faceți?, Bine, mulțumesc
    gloss: Bună(こんにちは)・Ce mai faceți?(お元気ですか。丁寧な言い方)・Bine, mulțumesc(元気です、ありがとう)
    note: すべて第1ユニットの最初のあいさつで学びました。ここでは、このユニットの会話の冒頭で再び使います。
  ro.a1.unit19.lesson03.teach.reminder_sambata_la_revedere:
    title: 復習：Sâmbătă, La revedere
    gloss: Sâmbătă(土曜日)・La revedere(さようなら)
    note: '*Sâmbătă* は第3・第11・第12ユニット、*la revedere* は第1ユニットで学びました。どちらも週末の予定の会話で再び使います。'
  ro.a1.unit19.lesson03.teach.line01:
    title: ミハイにあいさつして調子をたずねる
    gloss: アナはミハイにあいさつして、調子をたずねます。
    note: 第1ユニットの *Ce mai faceți?* というあいさつを再び使います。
  ro.a1.unit19.lesson03.teach.line02:
    title: 答えて、明日の天気をたずねる
    gloss: ミハイは答えてから、明日の天気はどうかをアナにたずねます。
    note: 第1ユニットの *Bine, mulțumesc* と、このユニットのレッスン1のフレーズ *Cum este vremea?* に *mâine* を加えたものです。
  ro.a1.unit19.lesson03.teach.line03:
    title: 明日の天気予報を伝える
    gloss: アナは、明日は雨で、風が強くて寒いと伝えます。
    note: この単元のレッスン2のフレーズをそのまま再利用しています。
  ro.a1.unit19.lesson03.teach.line04:
    title: 公園はやめて土曜日に行こうと提案する
    gloss: ミハイは、明日は公園に行かないと言い、代わりに土曜日はどうかと尋ねます。
    note: この単元のレッスン2のフレーズに、単元11の *mergem* と、この単元の *sâmbătă* を組み合わせています。
  ro.a1.unit19.lesson03.teach.line05:
    title: 土曜日は晴れる予報だと言って同意する
    gloss: アナは、土曜日は晴れると言い、その計画に賛成します。
    note: '*soare* に、単元11の同意の表現 *Da, bine!* を組み合わせています。'
  ro.a1.unit19.lesson03.teach.line06:
    title: さよならを言う
    gloss: ミハイがさよならを言います。
    note: これまでのどの単元の会話も、この形で締めくくられています。
  ro.a1.unit19.lesson03.teach.line07:
    title: さよならを言う
    gloss: アナがさよならを言います。
    note: これまでのどの単元の会話も、この形で締めくくられています。
