answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: ルーマニア語 A1
  description: ルーマニア語の基本的なあいさつと、初対面の自己紹介を学びます。この段階で特に大切な、くだけた tu と丁寧な dumneavoastră の使い分けや、名前を言う日常的な2通りの言い方(mă numesc.../mă cheamă...)を重点的に扱います。
units:
  ro.a1.unit01.greetings:
    title: あいさつと初対面
lessons:
  ro.a1.unit01.lesson01.tu_dumneavoastra_greetings:
    title: あいさつ：tu と dumneavoastră
  ro.a1.unit01.lesson02.names_introductions:
    title: お名前は？
  ro.a1.unit01.lesson03.street_meeting:
    title: 道ばたでの出会い
teaching:
  ro.a1.unit01.lesson01.teach.buna:
    title: 日常のあいさつ
    gloss: やあ；こんにちは
    note: Bună は日常的で少しくだけたあいさつです。友人や同年代の人、昼間のたいていのカジュアルな場面で安心して使えます。
    example_gloss: やあ、Mihai!
  ro.a1.unit01.lesson01.teach.salut:
    title: くだけたあいさつ
    gloss: やあ、じゃあね
    note: Salut は友人や同年代の間で使うくだけたあいさつです。会ったときにも別れるときにも使えますが、知らない大人への最初のあいさつには向きません。日本語の「やあ」「じゃあね」に近い感覚です。
    example_gloss: やあ、Ana!
  ro.a1.unit01.lesson01.teach.buna_ziua:
    title: 改まったあいさつ
    gloss: こんにちは(丁寧)
    note: Bună ziua は、知らない大人や店の人、dumneavoastră で呼びかける相手に使える、安全で丁寧なあいさつです。直訳は「良い日」ですが、昼だけでなく丁寧なあいさつ全般として使います。
    example_gloss: こんにちは、Ana さん！
  ro.a1.unit01.lesson01.teach.la_revedere:
    title: 基本の別れのあいさつ
    gloss: さようなら
    note: La revedere は、丁寧な場面でもくだけた場面でも使えます。日本語の「さようなら」「失礼します」のように、場面を選ばず使える別れのあいさつです。
    example_gloss: こんにちは！さようなら！
  ro.a1.unit01.lesson01.teach.tu:
    title: 親しい相手への「あなた」(単数)
    gloss: きみ・あなた(親しい相手一人に)
    note: ルーマニア語の tu は、親しい友人や子ども、くだけた間柄の1人に呼びかけるときに使い、動詞も専用の形をとります(faci であり、faceți ではありません)。日本語では敬語の有無で相手との距離を表しますが、ルーマニア語では代名詞そのものを使い分けます。
  ro.a1.unit01.lesson01.teach.dumneavoastra:
    title: 丁寧な「あなた」または複数の「あなたたち」
    gloss: あなた(丁寧・単数)、あなたたち(複数)
    note: Dumneavoastră は、知らない大人1人に対して使える安全な選択で、丁寧に呼びかける複数の相手にも使えます。domnia voastră(閣下)に由来し、1人を指す場合でも複数形の動詞(faceți, numiți)を使います。
  ro.a1.unit01.lesson01.teach.ce_mai_faceti:
    title: 丁寧な体調のたずね方
    gloss: お元気ですか。
    note: Faceți は a face(する・作る)の dumneavoastră に対する形です。これは決まった丁寧な質問で、相手が今していることを文字どおり尋ねているわけではありません。
  ro.a1.unit01.lesson01.teach.ce_mai_faci:
    title: 親しい相手への体調のたずね方
    gloss: お元気ですか。
    note: Faci は a face の tu に対する形です。この質問は、丁寧な言い方でもくだけた言い方でも動詞の語尾が変わるだけで、ce mai はどちらも同じです。
  ro.a1.unit01.lesson01.teach.bine_multumesc:
    title: 定番の肯定の返事
    gloss: 元気です、ありがとう。
    note: Bine, mulțumesc は、ce mai faci/faceți に対して丁寧さに関係なく使えます。返事そのものは変わりません。
    example_gloss: お元気ですか？元気です、ありがとう。
  ro.a1.unit01.lesson01.teach.register_choice:
    title: あいさつと関係を合わせる
    gloss: 改まった相手には丁寧なあいさつ、親しい相手にはくだけたあいさつ
    note: 絶対の決まりではなく、目安として覚えましょう。Bună ziua は改まった会話の最初に使い、その後 dumneavoastră で続けることもできます。一方、Salut と dumneavoastră を組み合わせると、たいてい相反する印象を与えます。
  ro.a1.unit01.lesson02.teach.ma_numesc:
    title: 名前を言う(標準的な言い方)
    gloss: 私の名前は Ana です。
    note: Mă numesc は直訳すると「私は自分を名づける」という意味で、どんな場面でも使える中立的な名乗り方です。丁寧さは日本語の「〜といいます」に近いです。
    example_gloss: こんにちは！私の名前は Ana です。
  ro.a1.unit01.lesson02.teach.cum_va_numiti:
    title: 丁寧に名前をたずねる
    gloss: お名前は何ですか。
    note: Numiți は a se numi(〜という名前である)の dumneavoastră に対する形です。Vă は dumneavoastră に対応する再帰代名詞で、この文では必ず必要です。
  ro.a1.unit01.lesson02.teach.ma_cheama:
    title: 名前を言う(会話的な言い方)
    gloss: 私は Mihai といいます。
    note: Mă cheamă は名前を言うときの、より会話的な言い方で、直訳は「それが私を呼ぶ」です。mă numesc と mă cheamă はどちらも正しくよく使われますが、mă cheamă のほうが少しくだけています。
    example_gloss: こんにちは！Mihai といいます。
  ro.a1.unit01.lesson02.teach.cum_te_cheama:
    title: 親しい相手に名前をたずねる
    gloss: お名前は？
    note: Te は tu に対応する再帰代名詞です。友人や同年代の人どうしが名前をたずねる、日常的な言い方です。
  ro.a1.unit01.lesson02.teach.imi_pare_bine:
    title: 人と会ったとき
    gloss: はじめまして！
    note: Îmi pare bine は直訳すると「私には良く思われる」という意味の決まった慣用表現で、単語ごとに訳せるものではありません。話し手の性別によって形が変わることもありません。
    example_gloss: Mihai といいます。はじめまして！
  ro.a1.unit01.lesson02.teach.si_mie_imi_pare_bine:
    title: 同じ気持ちを返す
    gloss: こちらこそ、はじめまして！
    note: Și mie は「私も」という意味で、最初に使った決まり文句の前に付け足します。
  ro.a1.unit01.lesson02.teach.si_dumneavoastra:
    title: 丁寧に聞き返す
    gloss: あなたは？
    note: 丁寧な話し方を保つときや、複数の相手に呼びかけるときは dumneavoastră を使います。
  ro.a1.unit01.lesson02.teach.si_tu:
    title: くだけた聞き返し
    gloss: あなたは？
    note: 親しい友人や同年代の1人にくだけて話すときは、și のあとに tu を使います。
  ro.a1.unit01.lesson03.teach.line01:
    title: 会話のきっかけ
    gloss: Ana は Mihai に丁寧にあいさつして、名前を名乗ります。
    note: Ana は、知らない相手に会うので、丁寧な bună ziua であいさつを始めています。
  ro.a1.unit01.lesson03.teach.line02:
    title: 会話のきっかけ・返事
    gloss: Mihai は同じ気持ちを返し、名前を名乗って、彼女の調子をたずねます。
    note: Mihai は Ana が最初に使った丁寧な話し方を保っています。ce mai faci ではなく、ce mai faceți とたずねています。
  ro.a1.unit01.lesson03.teach.line03:
    title: 答えて、質問を返す
    gloss: Ana は元気だと答え、同じ質問を Mihai に丁寧に返します。
    note: Și dumneavoastră によって、会話は始まりと同じく丁寧なまま続きます。
  ro.a1.unit01.lesson03.teach.line04:
    title: 答えて、会話を終える
    gloss: Mihai も元気だと答え、別れのあいさつをします。
    note: La revedere は中立的な別れのあいさつで、丁寧な会話にもくだけた会話にも合います。
  ro.a1.unit01.lesson03.teach.line05:
    title: 出会いを締めくくる
    gloss: Ana も同じ別れのあいさつを返します。
    note: la revedere を相手に返すのは、気持ちよく会話を終えるための自然な言い方です。
exercises:
  ro.a1.unit01.lesson01.exercise01.listen_buna:
    instruction: 音声を聞いて、聞こえたフレーズを選んでください。
    correct_option: Bună!
    distractors:
    - Salut!
    - La revedere!
    accepted_answers:
    - Bună!
    - Bună
  ro.a1.unit01.lesson01.exercise02.choose_informal_pronoun:
    instruction: このくだけたあいさつに合う代名詞はどれですか。
    correct_option: tu
    distractors:
    - dumneavoastră
    accepted_answers:
    - tu
    feedback: Salut と tu は、どちらもくだけた場面で使う組み合わせです。
  ro.a1.unit01.lesson01.exercise04.order_polite_question:
    instruction: ていねいな体調のたずね方を、正しい順に並べてください。
    correct_response:
    - Ce
    - mai
    - faceți
  ro.a1.unit01.lesson01.exercise06.match_register:
    instruction: それぞれのあいさつを、初級でよく使う丁寧さのレベルに合わせて結んでください。
    correct_response:
      Bună ziua: dumneavoastră
      Salut: 君、あなた(親しい間柄で)
    pairs:
    - left: Bună ziua
      right: dumneavoastră
    - left: Salut
      right: 君、あなた(親しい間柄で)
  ro.a1.unit01.lesson01.exercise03.choose_polite_pronoun:
    instruction: 初対面の大人一人に対するあいさつになるように、空所を埋めてください。
    accepted_answers:
    - dumneavoastră
    feedback: Dumneavoastră は、知らない大人に対して使える、敬意のある安全な選択です。
  ro.a1.unit01.lesson01.exercise05.listen_informal_question:
    instruction: 聞こえた親しい言い方の質問を入力しましょう。
    accepted_answers:
    - Ce mai faci?
    - Ce mai faci
  ro.a1.unit01.lesson01.exercise07.complete_farewell:
    instruction: ふつうの別れのあいさつになるように、空所を埋めてください。
    accepted_answers:
    - revedere
  ro.a1.unit01.lesson01.exercise08.speak_greeting:
    instruction: ていねいにあいさつし、相手の調子をたずね、会話を終えてください。
    accepted_answers:
    - Bună ziua. Ce mai faceți? La revedere.
    - Bună ziua, ce mai faceți? La revedere.
  ro.a1.unit01.lesson02.exercise02.listen_name_question:
    instruction: 音声を聞いて、ていねいに名前をたずねる文を選んでください。
    correct_option: Cum vă numiți?
    distractors:
    - Cum te cheamă?
    - Ce mai faceți?
    accepted_answers:
    - Cum vă numiți?
    - Cum va numiti?
  ro.a1.unit01.lesson02.exercise05.choose_reply_meaning:
    instruction: Mihai の返事はどういう意味ですか？
    correct_option: はじめまして！
    distractors:
    - さようなら！
    - お元気ですか。
    accepted_answers:
    - はじめまして！
  ro.a1.unit01.lesson02.exercise01.order_self_intro:
    instruction: Ana の自己紹介を組み立てましょう。
    correct_response:
    - Mă
    - numesc
    - Ana
  ro.a1.unit01.lesson02.exercise07.match_introductions:
    instruction: 名前をたずねる質問と、それに合う答えを組み合わせましょう。
    correct_response:
      Cum vă numiți?: Mă numesc Ana.
      Cum te cheamă?: Mă cheamă Mihai.
    pairs:
    - left: Cum vă numiți?
      right: Mă numesc Ana.
    - left: Cum te cheamă?
      right: Mă cheamă Mihai.
  ro.a1.unit01.lesson02.exercise03.informal_name_question:
    instruction: くだけたあいさつに続けて、相手の名前をたずねてください。
    accepted_answers:
    - Cum te cheamă?
    - Cum te cheama?
  ro.a1.unit01.lesson02.exercise04.complete_ma_cheama:
    instruction: Mihai の名前を言うフレーズを完成させましょう。
    accepted_answers:
    - Mă
  ro.a1.unit01.lesson02.exercise06.return_polite_question:
    instruction: ていねいな言い方のまま、同じ質問を相手に返してください。
    accepted_answers:
    - Și dumneavoastră?
    - Si dumneavoastra?
  ro.a1.unit01.lesson02.exercise08.write_introduction:
    instruction: あなたは Ana です。Bună であいさつし、mă numesc で名前を言い、最後に「はじめまして」と言いましょう。
    accepted_answers:
    - Bună. Mă numesc Ana. Îmi pare bine.
    - Buna. Ma numesc Ana. Imi pare bine.
  ro.a1.unit01.lesson03.exercise01.role_selection:
    instruction: 会話の中で、このフレーズを使って名前を言っているのはどちらですか？
    correct_option: Ana
    distractors:
    - Mihai
    - どちらでもない
    accepted_answers:
    - Ana
  ro.a1.unit01.lesson03.exercise02.comprehend_register:
    instruction: Ana と Mihai はお互いにどの代名詞を使っていますか？
    correct_option: dumneavoastră
    distractors:
    - 君、あなた(親しい間柄で)
    - te
    accepted_answers:
    - dumneavoastră
  ro.a1.unit01.lesson03.exercise03.comprehend_names:
    instruction: mă numesc を使っているのはどちらで、mă cheamă を使っているのはどちらですか？
    correct_option: Ana uses mă numesc; Mihai uses mă cheamă.
    distractors:
    - Mihai uses mă numesc; Ana uses mă cheamă.
    - 二人とも mă numesc を使っている。
    accepted_answers:
    - Ana uses mă numesc; Mihai uses mă cheamă.
    - Ana; Mihai
  ro.a1.unit01.lesson03.exercise05.order_closing:
    instruction: 締めの返事と別れのあいさつを組み立てましょう。
    correct_response:
    - Bine,
    - mulțumesc.
    - La
    - revedere!
  ro.a1.unit01.lesson03.exercise04.role_response:
    instruction: Ana の立場で、丁寧に答えて、同じ質問を返しましょう。
    accepted_answers:
    - Bine, mulțumesc. Și dumneavoastră?
    - Bine, multumesc. Si dumneavoastra?
  ro.a1.unit01.lesson03.exercise06.speak_role:
    instruction: Ana の立場で、Mihai に丁寧にあいさつし、名前を言い、彼のあいさつに応えて、会話を締めくくりましょう。
    accepted_answers:
    - Bună ziua. Mă numesc Ana. Îmi pare bine! La revedere!
    - Buna ziua. Ma numesc Ana. Imi pare bine! La revedere!
    - Bună ziua. Mă numesc Ana. Și mie îmi pare bine! La revedere!
  ro.a1.unit01.lesson01.exercise09.dictation_buna:
    instruction: 聞こえた内容を入力してください。
    correct_option: Bună
    accepted_answers:
    - value: Bună
      status: correct
    orthography_strict: true
