teaching:
  ro.a1.unit29.lesson01.teach.cat_costa_in:
    title: 合計金額をたずねる
    gloss: 合計でいくらですか?
    note: '*În total*(「合計で」)は、1品ではなく全部を合わせた金額を知りたいことをはっきりさせます。*Cât costă?* は「いくらですか?」と尋ねる表現です。'
  ro.a1.unit29.lesson01.teach.costa_douazeci_si:
    title: 合計金額を伝える
    gloss: 合計で100レイです。
    note: '*Costă* は *a costa*(値段が〜である)の3人称単数形です。19より大きい数の後では、ルーマニア語は名詞の前に *de* を入れます:*o sută de lei*。'
  ro.a1.unit29.lesson02.teach.a_plati_cu:
    title: カードや現金で支払う
    gloss: カードで支払う、現金で支払う
    note: '*A plăti cu cardul* はカードで支払うこと、*a plăti în numerar* は現金で支払うことです。*cu* は「〜を使って」、*în* は「〜の形で」という意味です。'
    example_gloss:
    - ここでカードで支払えますか?
    - 現金で支払います。
  ro.a1.unit29.lesson02.teach.pot_plati_cu:
    title: カードが使えるかたずねる
    gloss: ここでカードで支払えますか?
    note: '*Pot plăti*(払えます)は *a putea* + 動詞です。*aici*(ここ)を付けると、今いる場所での質問になります。'
  ro.a1.unit29.lesson02.teach.doriti_sa_platiti:
    title: 支払い方法の希望をたずねる
    gloss: 現金とカード、どちらでお支払いですか?
    note: '*Doriți să plătiți ...?* は *dumneavoastră* を使う丁寧な形で、初対面のレジ係が使います。友達には *Vrei să plătești ...?* と言います。'
  ro.a1.unit29.lesson03.teach.nota:
    title: お会計
    gloss: お会計
    note: 女性名詞です:*o notă*、*nota*(冠詞は語末につきます)。
    example_gloss: 割り勘にしましょうか?
  ro.a1.unit29.lesson03.teach.hai_sa_impartim:
    title: 割り勘を提案する
    gloss: 割り勘にしましょうか?
    note: '*Hai să* + 動詞は、一緒に何かをしようと誘う表現です。'
  ro.a1.unit29.lesson03.teach.pot_plati_separat:
    title: 別々に支払いたいとたずねる
    gloss: 別々に支払ってもいいですか?
    note: '*Separat*(別々に)は *a plăti* の後ろに置きます。*Pot plăti separat?* は、各自が自分の分を払うときによく使う頼み方です。'
  ro.a1.unit29.lesson04.teach.restul:
    title: おつり
    gloss: おつり
    note: '*Restul* は文字どおりには「残り」で、ルーマニア語ではこれで受け取るおつりを表します。冠詞は語末につきます。'
    example_gloss: こちらがおつりです。
  ro.a1.unit29.lesson04.teach.poftiti_restul:
    title: おつりを渡す
    gloss: こちらがおつりです。
    note: '*Poftiți* は「どうぞ」を意味する *dumneavoastră* の丁寧な形で、カウンターでの丁寧な場面に合っています。'
  ro.a1.unit29.lesson04.teach.nu_am_nevoie:
    title: おつりを断る
    gloss: おつりはいりません。
    note: '*A avea nevoie de*(必要とする)は *de* を取ります:*Nu am nevoie de rest*。'
  ro.a1.unit29.lesson05.teach.treizeci_si_cinci:
    title: '35'
    gloss: '35'
    note: ルーマニア語の21から99までの数は *și* でつなぎます:*treizeci și cinci*(文字どおりには「30と5」)。また名詞の前に *de* を入れます:*o sută treizeci și cinci de lei*。
    example_gloss: 135レイです。
  ro.a1.unit29.lesson05.teach.nota_doua_feluri:
    title: レストランのお会計を読む
    gloss: 会計:メインディッシュ2つとコーヒー2つ。合計:135レイ。カード払い済み。
    note: 注文した物、合計金額、支払い方法に注目しましょう。
    glosses:
      Nota: お会計
      două: '2'
      feluri: メインディッシュ
      cafele: コーヒー
      Total: 合計
      '135': '135'
      lei: レイ
      Plătit: 支払い済み
      cardul: カード
  ro.a1.unit29.lesson06.teach.ana_hai_sa:
    title: アナが会計を頼む
    gloss: アナ:お会計をお願いしましょうか?
    note: '*A cere*(頼む、求める)は *nota* を直接目的語に取ります。*Hai să cerem nota?* は、一緒に頼もうという誘いです。'
  ro.a1.unit29.lesson06.teach.mihai_da_buna:
    title: ミハイが合計を尋ねる
    gloss: ミハイ:うん、いい考えだね。合計でいくら?
    note: 第1課の *Cât costă în total?* という質問をもう一度使っています。
  ro.a1.unit29.lesson06.teach.ana_sunt_treizeci:
    title: アナが合計を伝える
    gloss: アナ:135レイだよ。割り勘にする?
    note: '*Împărțim* は *a împărți*(分ける)の *noi*(私たち)の形です。*nota* は文脈から分かるので省略されています。'
  ro.a1.unit29.lesson06.teach.mihai_nu_lasa:
    title: ミハイは自分が払うと言い張る
    gloss: ミハイ:いいえ、今日は私に払わせてください。たくさん助けてもらいましたから。
    note: '*Lasă-mă să* ...(「～させて」)は、何かを申し出るときの標準的な言い方です。*m-ai ajutat*(「あなたは私を助けてくれた」)は過去形です。'
  ro.a1.unit29.lesson06.teach.ana_ce_dragut:
    title: アナは感激する
    gloss: アナ:優しいのね!ありがとう。
    note: '*Ce drăguț din partea ta!*(「なんて優しいの」)は、気前のよい行いに対して使う、温かくてよく使われるほめ言葉です。'
  ro.a1.unit29.lesson06.teach.mihai_pot_plati:
    title: ミハイがカード払いについて尋ねる
    gloss: ミハイ:ここでカードで払えますか?
    note: 第2課で出てきた質問 *Pot plăti cu cardul aici?* を、今度は実際のレストランで使っています。
  ro.a1.unit29.lesson06.teach.mihai_plateste_nota:
    title: Plătește:3人称単数の形
    gloss: ミハイは会計を払います。
    note: '*Plătește* は *a plăti*(支払う)の3人称単数(彼/彼女)の形です。'
