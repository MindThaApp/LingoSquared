teaching:
  hi.a1.unit29.lesson01.teach.kul_kitna_hua:
    title: Asking the total price
    gloss: How much does it cost in total?
    note: '*कुल* means ''total'', and *कितना हुआ?* (''how much has it come to?'') is the everyday way to ask the total.'
  hi.a1.unit29.lesson01.teach.kul_pachchees_rupye:
    title: Stating a total price
    gloss: It costs twenty-five rupees in total.
    note: '*हुए* agrees with the plural *रुपये*: *कुल पच्चीस रुपये हुए* is literally ''in all, twenty-five rupees came''.'
  hi.a1.unit29.lesson02.teach.kard_se_pement:
    title: Paying by card or in cash
    gloss: to pay by card, to pay cash
    note: Hindi says *कार्ड से पेमेंट करना* ('to do payment by card') and *नकद पेमेंट करना*; *से* marks the means of payment.
    example_gloss:
    - Can I pay by card here?
    - I'm paying in cash.
  hi.a1.unit29.lesson02.teach.kya_main_yahan:
    title: Asking if card payment is possible
    gloss: Can I pay by card here?
    note: '*यहाँ* (''here'') sets the place, and *सकता हूँ* (''can'') comes after the main phrase; a woman says *सकती हूँ*.'
  hi.a1.unit29.lesson02.teach.ap_nakad_pement:
    title: Asking about payment preference
    gloss: Would you like to pay cash or by card?
    note: '*आप ... करेंगे* is the polite future question a cashier uses, and *आप* takes the plural verb *करेंगे*.'
  hi.a1.unit29.lesson03.teach.bil:
    title: The bill
    gloss: the bill
    note: '*बिल* is a masculine noun: *एक बिल*, *बिल का*.'
    example_gloss: Shall we split the bill?
  hi.a1.unit29.lesson03.teach.bil_bant_len:
    title: Suggesting to split the bill
    gloss: Shall we split the bill?
    note: '*बाँट लें?* (''shall we split?'') suggests a shared plan without saying *हम*; *लें* is the ''let''s'' form of *लेना*.'
  hi.a1.unit29.lesson03.teach.kya_main_alag:
    title: Asking to pay separately
    gloss: May I pay separately?
    note: '*अलग से* means ''separately'' and comes before *पेमेंट कर सकता हूँ*.'
  hi.a1.unit29.lesson04.teach.bakee_paise:
    title: The change
    gloss: the change
    note: '*बाकी पैसे* (''the remaining money'') is plural and means the change you get back.'
    example_gloss: Here's your change.
  hi.a1.unit29.lesson04.teach.ye_rahe_apke:
    title: Handing over change
    gloss: Here's your change.
    note: '*आपके* is the polite ''your'' (*आप* + *के*), agreeing with the plural *पैसे*.'
  hi.a1.unit29.lesson04.teach.mujhe_bakee_paise:
    title: Declining change
    gloss: I don't need change.
    note: '*मुझे ... नहीं चाहिए* (''to me ... not needed'') is how Hindi says ''I don''t need''; *नहीं* comes before *चाहिए*.'
  hi.a1.unit29.lesson05.teach.paintees:
    title: Thirty-five
    gloss: thirty-five
    note: '*पैंतीस* is 35; Hindi number words have to be learned one by one.'
    example_gloss: It costs thirty-five rupees.
  hi.a1.unit29.lesson05.teach.bil_do_thalee:
    title: Read a restaurant bill
    gloss: 'Bill: two thalis and two teas. Total: thirty-five rupees. Paid by card.'
    note: Track what was ordered, the total, and how it was paid.
    glosses:
      बिल: bill
      दो: two
      थाली: thalis
      चाय: teas
      कुल: total
      पैंतीस: thirty-five
      रुपये: rupees
      पेमेंट: payment
      कार्ड: card
  hi.a1.unit29.lesson06.teach.priya_bil_mang:
    title: Priya asks for the bill
    gloss: 'Priya: Shall we ask for the bill?'
    note: '*माँग लें?* (''shall we ask for it?'') uses the ''let''s'' form of *लेना* again, and *माँगना* means ''to ask for''.'
  hi.a1.unit29.lesson06.teach.arjun_han_achchha:
    title: Arjun asks the total
    gloss: 'Arjun: Yes, good idea. How much does it cost in total?'
    note: '*कुल कितना हुआ?* is the total question from earlier, now asked at the table.'
  hi.a1.unit29.lesson06.teach.priya_paintees_rupye:
    title: Priya states the total
    gloss: 'Priya: It''s thirty-five rupees. Shall we split it?'
    note: '*पैंतीस रुपये हुए* states the total, and *बाँट लें?* asks ''shall we split it?'''
  hi.a1.unit29.lesson06.teach.arjun_naheen_aj:
    title: Arjun insists on paying
    gloss: 'Arjun: No, let me pay today. You''ve helped me so much.'
    note: '*मुझे पेमेंट करने दो* means ''let me pay'', and *तुमने मेरी बहुत मदद की है* uses *ने* because the verb is in the past.'
  hi.a1.unit29.lesson06.teach.priya_tum_kitne:
    title: Priya is touched
    gloss: 'Priya: That''s sweet of you! Thank you.'
    note: '*तुम कितने अच्छे हो!* (''how kind you are'') is a warm compliment, and *शुक्रिया* means ''thanks''.'
  hi.a1.unit29.lesson06.teach.arjun_kya_main:
    title: Arjun asks about paying by card
    gloss: 'Arjun: Can I pay by card here?'
    note: The question *क्या मैं यहाँ कार्ड से पेमेंट कर सकता हूँ?* is used again, now in a real restaurant.
  hi.a1.unit29.lesson06.teach.arjun_bil_deta:
    title: 'देता है: he pays'
    gloss: Arjun pays the bill.
    note: '*देता है* is the *वह* form of *देना* (''to give''); Hindi says ''gives the bill'' for ''pays the bill''.'
