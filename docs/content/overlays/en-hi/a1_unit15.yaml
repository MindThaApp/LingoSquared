answer_policy:
  mujhe_verb_hai: >-
    This unit's central grammar point is the दात-subject obligation
    construction "X + verb-infinitive + है" (मुझे/तुम्हें/हमें/आपको +
    infinitive + है = "X needs/has to ___"). A typed answer that drops है
    entirely, or that appends हैं instead of है (है is invariant here --
    it agrees with the infinitive verb, not the दात subject), should be
    marked incorrect -- this is the exact point being tested.
  kitne_ka_gender: >-
    "टिकट कितने का है?" (how much is the ticket) uses का, not की, because
    टिकट is grammatically masculine -- the same कितने का/की gender-
    agreement rule unit07 already established. A typed answer using की
    with टिकट should be marked incorrect as a real agreement error, not
    tolerated as a minor typo.
  train_gender: >-
    ट्रेन is grammatically feminine, so every habitual-present verb form
    describing it in this unit uses जाती है, never जाता है. A typed answer
    using जाता है for the train should be marked incorrect as a real
    agreement error.
  nasalization_marks: >-
    Display and teach the correct chandrabindu/anusvara distinction. This
    unit's one new nasalized word, हमें, uses anusvara, verified against a
    direct codepoint check -- consistent with the already-established
    तुम्हें convention. In typed A1 answers, accept a variant that drops a
    nasalization mark entirely or substitutes anusvara for chandrabindu
    (or vice versa) when every other character is correct. Do not extend
    this tolerance to a wrong vowel or consonant, which changes the actual
    word.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question marks
    (?) may likewise be omitted, but the fully punctuated form remains the
    model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or nasalization marks. For any exercise asking the learner
    to state their own travel request, accept any of this unit's taught
    phrasings that fit the prompt, not only the single model sentence given
    in `accepted_answers`.

course:
  title: "Hindi A1"

units:
  hi.a1.unit15.travel:
    title: "Travel"

lessons:
  hi.a1.unit15.lesson01.station_jana:
    title: "I need to go to the station"
  hi.a1.unit15.lesson02.platform_samay:
    title: "Platform number and time"
  hi.a1.unit15.lesson03.priya_arjun_station:
    title: "Priya and Arjun: at the station"

teaching:
  hi.a1.unit15.lesson01.teach.station_mujhe_hai_review:
    title: "Review: station, to me, is"
    gloss: "station, to me / for me, is"
    note: "A quick review of the place noun and the copula needed to build this lesson's obligation construction."
    example_gloss:
      - "The station is here."
      - "I have work."

  hi.a1.unit15.lesson01.teach.jaana:
    title: "To go"
    gloss: "to go (infinitive)"
    note: "The infinitive form of the verb already known as the तुम-imperative *jao* (unit 9) -- this lesson introduces the base infinitive itself."
    example_gloss: "I need to go."

  hi.a1.unit15.lesson01.teach.grammar_mujhe_verb_hai:
    title: "Mujhe + verb + hai = need to"
    gloss: "'Mujhe' was already learned with 'chahiye' (unit 6, with a noun) and with 'hai' (unit 11, like 'mujhe kaam hai', I have work). Now it also comes with a verb: 'mujhe jana hai' means 'I need to go'. Note -- 'hai' always stays the same, it never becomes 'hain', because it agrees with the verb 'jana', not with the speaker."
    note: "Discloses the third use of an already-taught pronoun+copula pattern, naming both prior uses by unit number before introducing the new verb slot."

  hi.a1.unit15.lesson01.teach.mujhe_station_jana_hai_phrase:
    title: "I need to go to the station."
    gloss: "I need to go to the station."
    note: "The unit's first full example of the obligation construction."

  hi.a1.unit15.lesson01.teach.tiket:
    title: "Ticket"
    gloss: "ticket"
    note: "A new noun, needed throughout this travel unit."
    example_gloss: "Where is my ticket?"

  hi.a1.unit15.lesson01.teach.chahiye_review:
    title: "Review: want / need"
    gloss: "want / need"
    note: "First taught in unit 6 with drinks, reused here with a ticket."
    example_gloss: "I would like tea."

  hi.a1.unit15.lesson01.teach.mujhe_tiket_chahiye_phrase:
    title: "I need a ticket."
    gloss: "I need a ticket."
    note: "The already-established *mujhe...chahiye* pattern applied to this unit's own new noun."

  hi.a1.unit15.lesson01.teach.train:
    title: "Train"
    gloss: "train"
    note: "A new noun."
    example_gloss: "The train is big."

  hi.a1.unit15.lesson01.teach.delhi_ka_review:
    title: "Review: Delhi, of / 's"
    gloss: "Delhi, of / 's (possessive marker)"
    note: "Delhi first taught in unit 5; the possessive marker *ka* already used throughout the course (e.g. unit 5-14) -- reused here to name a ticket's destination."
    example_gloss:
      - "My brother lives in Delhi."
      - "This is Arjun's bag."

  hi.a1.unit15.lesson01.teach.mujhe_delhi_ka_tiket_chahiye_phrase:
    title: "I need a ticket to Delhi."
    gloss: "I need a ticket to Delhi."
    note: "Combines this lesson's noun with the possessive-marker pattern to name a specific destination."

  hi.a1.unit15.lesson01.teach.kahan_tumhein_review:
    title: "Review: where, to you"
    gloss: "where, to you / for you"
    note: "Both already taught (unit 8 and unit 6) -- reused here to ask where someone needs to go."
    example_gloss:
      - "Where is the bank?"
      - "What would you like?"

  hi.a1.unit15.lesson02.teach.number_review:
    title: "Review: number"
    gloss: "number"
    note: "First taught in unit 2 for phone numbers -- reused here for a platform number."
    example_gloss: "What is your phone number?"

  hi.a1.unit15.lesson02.teach.platform:
    title: "Platform"
    gloss: "platform"
    note: "A new noun, the standard Hindi railway-station word (a common English loanword, same pattern as *phone* in unit 2)."
    example_gloss: "The platform is big."

  hi.a1.unit15.lesson02.teach.platform_number_kya_hai_phrase:
    title: "What is the platform number?"
    gloss: "What is the platform number?"
    note: "Reuses the already-established *kya hai* question pattern (e.g. phone number, price, age) for a new topic."

  hi.a1.unit15.lesson02.teach.platform_number_teen_hai_phrase:
    title: "Platform number is 3."
    gloss: "The platform number is 3."
    note: "The natural full-sentence answer to the question above."

  hi.a1.unit15.lesson02.teach.jaana_habitual_grammar:
    title: "Jaati hai (feminine agreement)"
    gloss: "'Jaati hai' uses unit 10's -ta/-ti/-te + hai/hain rule, with the new verb 'jana'. 'Train' is grammatically feminine, so it's 'jaati hai', not 'jaata hai'."
    note: "A direct, explicit extension of the already-established habitual-present agreement pattern, applied to a new verb and a new (grammatically feminine) noun."

  hi.a1.unit15.lesson02.teach.se_review:
    title: "Review: from"
    gloss: "from"
    note: "First taught in unit 9 for directions -- reused here for the platform the train departs from."
    example_gloss: "Go straight from here."

  hi.a1.unit15.lesson02.teach.train_platform_se_jaati_hai_phrase:
    title: "The train leaves from platform number 3."
    gloss: "The train leaves from platform number 3."
    note: "Combines this lesson's habitual-present verb form with the already-taught 'from' postposition."

  hi.a1.unit15.lesson02.teach.kitne_baje_review:
    title: "Review: what time"
    gloss: "what time"
    note: "First taught in unit 4 for telling time -- reused here to ask about a departure time."
    example_gloss: "What time is it?"

  hi.a1.unit15.lesson02.teach.train_kitne_baje_jaati_hai_phrase:
    title: "What time does the train leave?"
    gloss: "What time does the train leave?"
    note: "The 'what time' question applied to a scheduled departure rather than the current time."

  hi.a1.unit15.lesson02.teach.train_chhah_baje_jaati_hai_phrase:
    title: "The train leaves at 6."
    gloss: "The train leaves at 6."
    note: "The natural full-sentence answer, reusing unit 4's plural *baje* form (six is not the *baja* exception, which only applies to one o'clock)."

  hi.a1.unit15.lesson02.teach.tiket_kitne_ka_hai_phrase:
    title: "How much is the ticket?"
    gloss: "How much is the ticket?"
    note: "Reuses unit 7's *kitne ka/ki* price question, masculine form since *ticket* is grammatically masculine."

  hi.a1.unit15.lesson02.teach.rupaye_review:
    title: "Review: rupees, fifty"
    gloss: "rupees, fifty"
    note: "Both first taught in unit 2 for prices and quantities -- reused here for a ticket price."
    example_gloss: "I have fifty rupees."

  hi.a1.unit15.lesson02.teach.tiket_pachaas_rupaye_ka_hai_phrase:
    title: "The ticket is 50 rupees."
    gloss: "The ticket is 50 rupees."
    note: "The natural full-sentence answer to the price question above."

  hi.a1.unit15.lesson03.teach.hum_hamein:
    title: "We, to us"
    gloss: "we, to us / for us"
    note: "'Hum' (we) was already introduced in unit 11 as the course's first first-person-plural pronoun; 'hamein' is its dative form, needed here for the joint-travel dialogue."
    example_gloss:
      - "We are fine."
      - "We need to go to the station."

  hi.a1.unit15.lesson03.teach.hamein_grammar:
    title: "Hamein: the fourth dative pronoun"
    gloss: "'Hamein' is the dative form of 'hum' (unit 11), just like 'mujhe' (main) and 'tumhein' (tum). Here too 'hai' stays the same, it never becomes 'hain', because it agrees with 'jana', not with 'hum'/'hamein'."
    note: "Names all three prior dative pronouns by unit number before adding the fourth, and re-flags the same is-agrees-with-the-verb point from lesson 1's own grammar note."

  hi.a1.unit15.lesson03.teach.hamein_station_jana_hai_phrase:
    title: "We need to go to the station."
    gloss: "We need to go to the station."
    note: "The obligation construction with the new plural dative pronoun."

  hi.a1.unit15.lesson03.teach.ki_review:
    title: "Review: of / 's (feminine)"
    gloss: "of / 's (possessive marker, feminine)"
    note: "First taught in unit 7 alongside *ka*/*kitne* -- reused here because 'train' is grammatically feminine, so its possessive form is 'ki', not 'ka'."
    example_gloss: "This is the Delhi train."

  hi.a1.unit15.lesson03.teach.dialogue.line01:
    title: "Arjun says they need to go"
    gloss: "Priya, we need to go to the station."
  hi.a1.unit15.lesson03.teach.dialogue.line02:
    title: "Priya needs a ticket to Delhi"
    gloss: "OK. I need a ticket to Delhi."
  hi.a1.unit15.lesson03.teach.dialogue.line03:
    title: "Arjun asks the price"
    gloss: "Me too. How much is the ticket?"
  hi.a1.unit15.lesson03.teach.dialogue.line04:
    title: "Priya gives the price"
    gloss: "The ticket is 50 rupees."
  hi.a1.unit15.lesson03.teach.dialogue.line05:
    title: "Arjun asks the departure time"
    gloss: "Good. What time does the train leave?"
  hi.a1.unit15.lesson03.teach.dialogue.line06:
    title: "Priya gives the time and platform"
    gloss: "The train leaves at 6, from platform number 3."
  hi.a1.unit15.lesson03.teach.dialogue.line07:
    title: "Arjun understands and says let's go"
    gloss: "Got it. Let's go!"
  hi.a1.unit15.lesson03.teach.dialogue.line08:
    title: "Priya agrees"
    gloss: "Let's go!"

  hi.a1.unit15.lesson03.teach.grammar_summary:
    title: "Three main rules"
    gloss: "This unit's three main rules: (1) 'mujhe/tumhein/hamein + verb + hai' means 'need to ___'; (2) 'X kitne ka/ki hai?' asks the price; (3) 'X [time] baje [place] se jaati hai' gives a journey's time and place."
    note: "A closing summary tying the whole unit's grammar together, mirroring unit 14's own paradigm-tying grammar note."

  hi.a1.unit15.lesson03.teach.tiket_reading:
    title: "Reading a ticket"
    gloss: "Ticket: Delhi. Platform number 3. 6 o'clock."
    note: "A short, fragmentary ticket-stub text (no full sentences, matching how a real ticket reads) restating exactly the facts already established in the dialogue, no new claims."
    glosses:
      टिकट: "ticket"
      प्लेटफ़ॉर्म: "platform"
      नंबर: "number"
      बजे: "o'clock"

exercises:
