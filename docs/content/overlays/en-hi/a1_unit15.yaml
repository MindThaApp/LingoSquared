  hi.a1.unit15.lesson02.exercise08.order_tiket_pachaas_rupaye_ka_hai:
    instruction: "Put the sentence in order: The ticket is 50 rupees."
    correct_response: ["टिकट", "पचास", "रुपये", "का", "है"]

  hi.a1.unit15.lesson02.exercise09.fill_train_platform_se:
    instruction: "Complete the sentence: The train leaves FROM platform number 3."
    accepted_answers: ["से"]
