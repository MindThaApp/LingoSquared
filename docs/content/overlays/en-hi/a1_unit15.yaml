  hi.a1.unit15.lesson01.exercise07.order_mujhe_station_jana_hai:
    instruction: "Put the sentence in order: I need to go to the station."
    correct_response: ["मुझे", "स्टेशन", "जाना", "है"]

  hi.a1.unit15.lesson01.exercise08.order_mujhe_delhi_ka_tiket_chahiye:
    instruction: "Put the sentence in order: I need a ticket to Delhi."
    correct_response: ["मुझे", "दिल्ली", "का", "टिकट", "चाहिए"]

  hi.a1.unit15.lesson01.exercise09.fill_mujhe_station_jana:
    instruction: "Complete the sentence: I need to go to the station."
    accepted_answers: ["जाना"]
    feedback: "Mujhe station jana hai -- 'jana' (to go) plus 'hai' is how you say you need to go somewhere."

  hi.a1.unit15.lesson01.exercise10.fill_mujhe_delhi_ka_tiket:
    instruction: "Complete the sentence: I need a ticket to Delhi."
    accepted_answers: ["दिल्ली"]
    feedback: "Mujhe Dilli ka tiket chahiye -- 'Dilli ka tiket' is 'a ticket to Delhi'."

  hi.a1.unit15.lesson01.exercise11.reply_tumhein_kahan_jana_hai:
    instruction: "Answer: I need to go to the station."
    accepted_answers:
      - "मुझे स्टेशन जाना है।"
      - "मुझे स्टेशन जाना है"

  hi.a1.unit15.lesson01.exercise12.fix_mujhe_tiket_chahiye:
    instruction: "Correct the sentence -- 'chahiye' is never followed by 'hai'."
    accepted_answers:
      - "मुझे टिकट चाहिए।"
      - "मुझे टिकट चाहिए"
    feedback: "Mujhe tiket chahiye -- 'chahiye' is already a complete word on its own, unlike 'jana hai', which needs 'hai'."

  hi.a1.unit15.lesson01.exercise13.speak_mujhe_station_jana_hai:
