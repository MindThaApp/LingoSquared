    instruction: "What does this word mean?"
    correct_option: "ticket"
    distractors: ["train", "station"]
    accepted_answers: ["ticket"]

  hi.a1.unit15.lesson01.exercise02.select_train_meaning:
    instruction: "What does this word mean?"
    correct_option: "train"
    distractors: ["ticket", "platform"]
    accepted_answers: ["train"]

  hi.a1.unit15.lesson01.exercise03.select_mujhe_station_jana_hai_meaning:
    instruction: "What does this sentence mean?"
    correct_option: "I need to go to the station."
    distractors: ["I am at the station.", "I have a ticket."]
    accepted_answers: ["I need to go to the station."]

  hi.a1.unit15.lesson01.exercise04.listen_mujhe_station_jana_hai:
    instruction: "Listen and choose what you hear."
    correct_option: "I need to go to the station."
    distractors: ["I need to go to the bank.", "I need a ticket."]
