  notes: 'English overlay written from the realization. Drafted by Claude Sonnet. Grammar: past habitual (-ता था / -ती थी / -ते थे / -ती थीं) with no ne, frequency words, past of ''to be'' for descriptions (था/थी/थे/थीं), होता था, contrast with present and with one-time perfective. Canon: Arjun and Priya are friends using tum; Arjun''s childhood in ''a small town'' is deliberately unnamed so no canon fact is invented. OPEN NATIVE QUESTIONS: (1) is ''हम सब साथ खाना खाते थे'' natural for a family meal? (2) is अब भी खेलते हो natural vs अब भी खेलते हो क्या?; (3) कभी-कभी hyphenation style.'
answer_policy:
  punctuation: Hindi text is shown with the danda as the sentence-final mark. In typed answers, accept the danda, a plain period, or the mark omitted entirely as equivalent. Question marks may likewise be omitted.
  gender_agreement: Where the speaker or addressee is a named man or woman, the verb must agree with that person. Where the speaker is just 'I' (gender unspecified), both the masculine and the feminine form are accepted. Wrong agreement with a named person is a real grammar error, not a typo.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation.
course:
  title: Hindi A2
  description: Intermediate Hindi continuing the Priya and Arjun storyline, now with a grammar-led block on talking about the past.
units:
  hi.a2.unit78.bachpan_ki_aadatein:
    title: Childhood Habits
    description: Describe how life used to be, in childhood or in an earlier home, and say how it differs from now.
lessons:
  hi.a2.unit78.bachpan_ki_aadatein.lesson01.bachpan_mein:
    title: In Childhood
  hi.a2.unit78.bachpan_ki_aadatein.lesson02.roz_aur_kabhi_kabhi:
    title: Every Day and Sometimes
  hi.a2.unit78.bachpan_ki_aadatein.lesson03.pehle_aur_ab:
    title: Before and Now
  hi.a2.unit78.bachpan_ki_aadatein.lesson04.ghar_kaisa_tha:
    title: What Was It Like?
  hi.a2.unit78.bachpan_ki_aadatein.lesson05.mera_bachpan:
    title: My Childhood
  hi.a2.unit78.bachpan_ki_aadatein.lesson06.bachpan_ki_baatein:
    title: Talking About Childhood
teaching:
  hi.a2.unit78.bachpan_ki_aadatein.lesson01.teach.samay_shabd:
    title: Then and now
    gloss: childhood / earlier, in the past / now
    note: '*बचपन में* means ''in childhood''. *पहले* looks back at an earlier time; *अब* is now.'
    example_gloss:
    - As a child Arjun used to play in the street.
    - Earlier Priya used to go to her grandmother's house.
    - Now Priya goes to the office.
  hi.a2.unit78.bachpan_ki_aadatein.lesson01.teach.kriyayen:
    title: Everyday verbs
    gloss: to play / to read / to sleep / to live
    note: These verbs are used here with the helper *था* to say what used to happen.
    example_gloss:
    - Arjun used to play cricket in the street.
    - Priya used to read a book every day.
    - We used to live in a small town.
    - She used to live in a small town.
    - Arjun used to read a book too.
    - The children used to go to sleep early.
  hi.a2.unit78.bachpan_ki_aadatein.lesson01.teach.gn_ta_tha:
    title: The habitual past
    gloss: 'to play: used to play (man), (woman), (several men or mixed), (several women)'
    note: 'Take the verb stem (*खेल*) and add *-ता / -ती / -ते* plus *था / थी / थे / थीं*. Both parts agree with the person doing it: man *खेलता था*, woman *खेलती थी*, several people *खेलते थे*, several women *खेलती थीं*.'
  hi.a2.unit78.bachpan_ki_aadatein.lesson01.teach.gn_bina_ne:
    title: No ne in the habitual
    gloss: Yesterday Arjun drank tea. Every day Arjun used to drink tea. Priya used to drink tea. The children used to drink milk.
    note: Unlike the simple past (*अर्जुन ने चाय पी*), the habitual past never uses *ने*, even with an object. The verb agrees with the person, not with the tea.
  hi.a2.unit78.bachpan_ki_aadatein.lesson02.teach.kitni_baar:
    title: How often
    gloss: every day / every evening / every Sunday / sometimes / often
    note: These words go before the verb. *हर* means 'every' and the noun after it stays singular.
    example_gloss:
    - Arjun used to play in the street every evening.
    - Priya used to go to her grandmother's every Sunday.
    - We used to go to the cinema sometimes.
    - He often used to go to bed late.
  hi.a2.unit78.bachpan_ki_aadatein.lesson02.teach.dost_khel:
    title: Friends and questions
    gloss: friend / with / what
    note: '*के साथ* means ''together with''. *क्या* before the verb asks what.'
    example_gloss:
    - Arjun used to play with his friends.
    - What did you use to do as a child?
  hi.a2.unit78.bachpan_ki_aadatein.lesson02.teach.gn_nahin_tha:
    title: Not used to
    gloss: Arjun didn't use to drink tea. Arjun used to get up early in the morning. Priya didn't use to get up early in the morning.
    note: 'Put *नहीं* right before the verb: *नहीं पीता था*. Both parts of the verb keep their agreement.'
  hi.a2.unit78.bachpan_ki_aadatein.lesson02.teach.gn_kya_tum:
    title: Yes/no question
    gloss: Did you play cricket every day? Yes, I played every day.
    note: Start with *क्या*. With *तुम* a man is asked *खेलते थे*; a woman is asked *खेलती थीं*. The answer uses *मैं* and the singular form.
  hi.a2.unit78.bachpan_ki_aadatein.lesson02.teach.gn_kya_karte:
    title: What did you use to do?
    gloss: What did you use to do as a child? I used to play with friends.
    note: '*क्या करते थे* asks about habits. Answer with a short sentence and the habitual verb.'
  hi.a2.unit78.bachpan_ki_aadatein.lesson03.teach.ab_shabd:
    title: Now
    gloss: still / coffee / gym
    note: '*अब भी* means ''even now, still''. *पहले ... अब ...* sets the old habit against the new one.'
    example_gloss:
    - Priya still drinks tea now.
    - Before, Arjun drank tea; now he drinks coffee.
    - Now Arjun goes to the gym.
  hi.a2.unit78.bachpan_ki_aadatein.lesson03.teach.gn_pehle_ab:
    title: Before and now
    gloss: Before I drank tea; now I drink coffee.
    note: 'Old habit: verb + *था*. Present habit: verb + *है / हूँ / हो*. The pair *पहले ... अब ...* shows the change.'
  hi.a2.unit78.bachpan_ki_aadatein.lesson03.teach.gn_roz_kal:
    title: A habit or one time
    gloss: As a child I played cricket every day. Yesterday I played cricket.
    note: 'A repeated habit uses *खेलता था* with no *ने*. A single event uses the simple past: *मैंने खेला* with *ने*. Words like *रोज़* and *हर शाम* point to a habit.'
  hi.a2.unit78.bachpan_ki_aadatein.lesson03.teach.gn_ab_nahin:
    title: Not any more
    gloss: Now I don't play cricket. Now she doesn't play cricket.
    note: 'In the present habit, *नहीं* goes before the verb and *है / हूँ* is dropped: *नहीं खेलता*. The ending agrees with the person.'
  hi.a2.unit78.bachpan_ki_aadatein.lesson04.teach.ghar_mohalla:
    title: Describing a place
    gloss: home / tree / neighbourhood / small / big / quiet
    note: 'Adjectives that end in *-आ* change with gender: *छोटा घर* (masculine), *छोटी गली* (feminine), *छोटे कमरे* (masculine plural).'
    example_gloss:
    - Our house was small.
    - There was a big tree near the house.
    - The neighbourhood was quiet.
  hi.a2.unit78.bachpan_ki_aadatein.lesson04.teach.dukaan_gali:
    title: More places
    gloss: shop / market / room / lane
    note: A plural noun needs a plural *थे* or *थीं*.
    example_gloss:
    - Our lane was small.
    - There were two shops in the lane.
    - There were three rooms in the house.
  hi.a2.unit78.bachpan_ki_aadatein.lesson04.teach.gn_tha_thi:
    title: था, थी, थे, थीं
    gloss: The house was small. The lane was small. The rooms were small. The shops were small.
    note: '*था* is for a masculine singular noun, *थी* for a feminine singular noun, *थे* for a masculine plural, *थीं* for a feminine plural. The adjective agrees in the same way.'
  hi.a2.unit78.bachpan_ki_aadatein.lesson04.teach.gn_hota_tha:
    title: होता था for regular happenings
    gloss: Every Sunday there used to be a market there. At night the lane used to be quiet.
    note: '*होता था / होती थी* says what used to happen regularly. *बाज़ार* is masculine, so *होता था*; *गली* is feminine, so *होती थी*.'
  hi.a2.unit78.bachpan_ki_aadatein.lesson04.teach.gn_pehle_ab_ghar:
    title: Old house, new house
    gloss: Before the house was small; now the house is big.
    note: Use *था* for the past state and *है* for the present state. Add *पहले* and *अब* to show the change.
  hi.a2.unit78.bachpan_ki_aadatein.lesson05.teach.padhne_ke_shabd:
    title: Words for the text
    gloss: grandmother / my childhood / big city
    note: '*बड़े शहर में*: the adjective takes *-े* before *में*.'
    example_gloss:
    - Every Sunday we used to go to our grandmother's house.
    - This is my childhood.
    - Now I live in a big city.
  hi.a2.unit78.bachpan_ki_aadatein.lesson05.teach.gn_hum_jaate:
    title: 'We: then and now'
    gloss: Every Sunday we used to go to grandmother's house. Now we go sometimes.
    note: 'For *हम* the verb uses the plural: *जाते थे*, *जाते हैं*.'
  hi.a2.unit78.bachpan_ki_aadatein.lesson05.teach.padho_mera_bachpan:
    title: Arjun writes about his childhood
    gloss: As a child I lived in a small town. Our house was small, but there was a big tree near the house. Every evening I played cricket with my friends in the lane. Every Sunday we went to grandmother's house. Now I live in a big city. Now I don't play cricket; I go to the gym. Arjun
    note: Notice how the text moves from habits in the past (*रहता था, खेलता था*) to the present (*रहता हूँ, जाता हूँ*).
  hi.a2.unit78.bachpan_ki_aadatein.lesson06.teach.d1:
    title: Priya asks
    gloss: 'Priya: Arjun, what did you use to do as a child?'
  hi.a2.unit78.bachpan_ki_aadatein.lesson06.teach.d2:
    title: Arjun answers
    gloss: 'Arjun: Every evening I used to play cricket in the lane with my friends.'
  hi.a2.unit78.bachpan_ki_aadatein.lesson06.teach.d3:
    title: Priya asks about now
    gloss: 'Priya: And now? Do you still play?'
  hi.a2.unit78.bachpan_ki_aadatein.lesson06.teach.d4:
    title: Arjun says what changed
    gloss: 'Arjun: No, now I don''t play cricket. Now I go to the gym.'
  hi.a2.unit78.bachpan_ki_aadatein.lesson06.teach.d5:
    title: Priya shares
    gloss: 'Priya: As a child I used to go to my grandmother''s house every Sunday.'
  hi.a2.unit78.bachpan_ki_aadatein.lesson06.teach.d6:
    title: Arjun asks
    gloss: 'Arjun: Oh nice! What used to happen there?'
  hi.a2.unit78.bachpan_ki_aadatein.lesson06.teach.d7:
    title: Priya answers
    gloss: 'Priya: We all used to eat together there.'
