course: {title: "Hindi B2"}
units:
  hi.b2.unit05.register: {title: "Adapting language to the audience", description: "Shift between respectful professional Hindi and familiar Hindi while preserving the message."}
lessons:
  hi.b2.unit05.lesson01.aap_aur_tum: {title: "आप and तुम"}
  hi.b2.unit05.lesson02.namrata: {title: "Polite requests"}
  hi.b2.unit05.lesson03.seedhapan: {title: "Directness and familiarity"}
  hi.b2.unit05.lesson04.likhit_register: {title: "Register in writing"}
  hi.b2.unit05.lesson05.padhkar_badlo: {title: "One message, two audiences"}
  hi.b2.unit05.lesson06.mulyankan: {title: "Adapt for the audience"}
teaching:
  hi.b2.unit05.lesson01.teach.aap_tum: {title: "Respectful and familiar", gloss: "To a manager: Please sit. To a friend: Sit.", note: "Use *बैठिए* with *आप* and *बैठो* with *तुम*."}
  hi.b2.unit05.lesson01.teach.grammar_register: {title: "Register agreement", gloss: "Respectful and familiar verb forms must match the audience.", note: "*देखिए/भेजिए* are respectful; *देखो/भेजो* are familiar."}
  hi.b2.unit05.lesson02.teach.requests: {title: "A softened request", gloss: "Could you send the report? Please send it today. Could you take a look? Please tell me.", note: "*क्या आप...सकते हैं?* frames a request as a polite question."}
  hi.b2.unit05.lesson02.teach.softener: {title: "How softening works", gloss: "The question frame softens the request; दीजिए adds respect.", note: "*दीजिए* adds respectful distance."}
  hi.b2.unit05.lesson03.teach.informal: {title: "A message to Priya", gloss: "Priya, send the report. Have a look when you have time.", note: "*दो* and *लेना* suit a close colleague here."}
  hi.b2.unit05.lesson03.teach.tone: {title: "Direct but friendly", gloss: "These forms sound easygoing with a close colleague but too direct with a senior person.", note: "Audience determines whether *दो* feels warm or abrupt."}
  hi.b2.unit05.lesson04.teach.email: {title: "Formal email", gloss: "Respected sir, please see the attached report. Respectfully, Priya.", note: "*आदरणीय* and *सादर* frame formal correspondence."}
  hi.b2.unit05.lesson04.teach.message: {title: "Casual message", gloss: "Arjun, have a look at the report. Thanks!", note: "The same request is shorter for a close colleague."}
  hi.b2.unit05.lesson05.teach.reading: {title: "Compare Priya's messages", gloss: "Priya writes the same request differently to her manager and Arjun.", note: "The purpose stays constant while the register changes."}
  hi.b2.unit05.lesson06.teach.dialogue: {title: "Arjun: Priya, send the report.", gloss: "Arjun: Priya, send the report.", note: "Arjun uses familiar *दो* with Priya."}
  hi.b2.unit05.lesson06.teach.dialogue_priya_ask: {title: "Priya: Okay. What should I write to the manager?", gloss: "Priya: Okay. What should I write to the manager?"}
  hi.b2.unit05.lesson06.teach.dialogue_arjun_formal: {title: "Arjun: Write, 'Please see the attached report.'", gloss: "Arjun: Write, 'Please see the attached report.'", note: "Respectful *देखिए* for the manager."}
  hi.b2.unit05.lesson06.teach.dialogue_priya_friend: {title: "Priya: And to a friend?", gloss: "Priya: And to a friend?"}
  hi.b2.unit05.lesson06.teach.dialogue_arjun_informal: {title: "Arjun: Just write, 'Have a look at the report.'", gloss: "Arjun: Just write, 'Have a look at the report.'", note: "Casual *देख लेना* for a friend."}
exercises:
  hi.b2.unit05.lesson01.exercise01.recognize_formal: {instruction: "Which audience best fits this phrase?", options: ["a manager", "a close friend", "a young child"], correct_option: "a manager", accepted_answers: [{value: "a manager", status: correct}], feedback: "*कृपया बैठिए* is respectful."}
  hi.b2.unit05.lesson01.exercise02.match_register: {instruction: "Match each Hindi form to its English function.", accepted_answers: [{value: [{left: "कृपया बैठिए", right: "formal request to sit"}, {left: "बैठो", right: "informal request to sit"}, {left: "देखिए", right: "formal request to look"}, {left: "देखो", right: "informal request to look"}, {left: "भेजिए", right: "formal request to send"}, {left: "भेजो", right: "informal request to send"}], status: correct}], feedback: "The *-इए* forms are respectful; the shorter forms are familiar."}
  hi.b2.unit05.lesson01.exercise03.order_formal: {instruction: "Arrange the respectful request.", correct_response: "कृपया रिपोर्ट देखिए", feedback: "*कृपया रिपोर्ट देखिए* is respectful."}
  hi.b2.unit05.lesson01.exercise04.order_informal: {instruction: "Arrange the familiar request.", correct_response: "रिपोर्ट देखो", feedback: "*रिपोर्ट देखो* suits *तुम*."}
  hi.b2.unit05.lesson01.exercise05.translate_formal: {instruction: "Translate for a manager: Please sit.", accepted_answers: [{value: "कृपया बैठिए", status: correct}, {value: "कृपया बैठें", status: correct}], feedback: "Use *बैठिए* for respectful address."}
  hi.b2.unit05.lesson01.exercise06.translate_informal: {instruction: "Translate for a friend: Sit.", accepted_answers: [{value: "बैठो", status: correct}, {value: "बैठ जाओ", status: correct}], feedback: "Use *बैठो* with *तुम*."}
  hi.b2.unit05.lesson01.exercise07.write_pair: {instruction: "Write the formal form 'please look', then the informal form 'look', separated by a space.", accepted_answers: [{value: "कृपया देखिए देखो", status: correct}], feedback: "The requested sequence is *कृपया देखिए देखो*."}
  hi.b2.unit05.lesson01.exercise08.dictation_formal: {instruction: "Listen and type exactly what you hear.", correct_response: "कृपया रिपोर्ट भेजिए", orthography_strict: true, feedback: "The sentence was *कृपया रिपोर्ट भेजिए*."}
  hi.b2.unit05.lesson02.exercise01.choose_polite: {instruction: "What does this sentence do?", options: ["makes a polite request", "reports a completed action", "refuses a request"], correct_option: "makes a polite request", accepted_answers: [{value: "makes a polite request", status: correct}], feedback: "*क्या आप...सकते हैं?* makes a polite request."}
  hi.b2.unit05.lesson02.exercise02.match_requests: {instruction: "Match each Hindi item to its English clue.", accepted_answers: [{value: [{left: "क्या आप", right: "polite question opening"}, {left: "कृपया", right: "please"}, {left: "दीजिए", right: "respectful give or do form"}, {left: "भेजिए", right: "respectful send form"}, {left: "देखिए", right: "respectful look form"}, {left: "बताइए", right: "respectful tell form"}], status: correct}], feedback: "Each item contributes a distinct respectful function."}
  hi.b2.unit05.lesson02.exercise03.order_request: {instruction: "Arrange the polite question.", correct_response: "क्या आप रिपोर्ट भेज सकते हैं", feedback: "*क्या आप रिपोर्ट भेज सकते हैं?* asks politely."}
  hi.b2.unit05.lesson02.exercise04.order_please: {instruction: "Arrange the respectful request.", correct_response: "कृपया आज ही भेज दीजिए", feedback: "*कृपया...दीजिए* marks respect."}
  hi.b2.unit05.lesson02.exercise05.translate_request: {instruction: "Translate politely: Could you send the report?", accepted_answers: [{value: "क्या आप रिपोर्ट भेज सकते हैं", status: correct}, {value: "क्या आप रिपोर्ट भेज सकती हैं", status: correct}, {value: "क्या आप कृपया रिपोर्ट भेज सकते हैं", status: correct}, {value: "क्या आप कृपया रिपोर्ट भेज सकती हैं", status: correct}], feedback: "The named frame is *क्या आप...सकते हैं?*"}
  hi.b2.unit05.lesson02.exercise06.write_please: {instruction: "Using कृपया and दीजिए, write: Please send it today.", accepted_answers: [{value: "कृपया आज ही भेज दीजिए", status: correct}, {value: "कृपया आज भेज दीजिए", status: correct}, {value: "कृपया इसे आज ही भेज दीजिए", status: correct}, {value: "कृपया इसे आज भेज दीजिए", status: correct}], feedback: "*कृपया आज ही भेज दीजिए* uses both required forms."}
  hi.b2.unit05.lesson02.exercise07.speak_request: {instruction: "Ask a manager: Could you look at the report?", accepted_answers: [{value: "क्या आप रिपोर्ट देख सकते हैं", status: correct}, {value: "क्या आप रिपोर्ट देख सकती हैं", status: correct}, {value: "क्या आप कृपया रिपोर्ट देख सकते हैं", status: correct}, {value: "क्या आप कृपया रिपोर्ट देख सकती हैं", status: correct}], feedback: "The respectful question is *क्या आप रिपोर्ट देख सकते हैं?*"}
  hi.b2.unit05.lesson03.exercise01.recognize_informal: {instruction: "Who best fits this request?", options: ["Priya, a close colleague", "an unfamiliar director", "a customer you have just met"], correct_option: "Priya, a close colleague", accepted_answers: [{value: "Priya, a close colleague", status: correct}], feedback: "*भेज दो* is familiar and direct."}
  hi.b2.unit05.lesson03.exercise02.match_tone: {instruction: "Match each Hindi form to its register.", accepted_answers: [{value: [{left: "भेज दो", right: "friendly direct send request"}, {left: "भेज दीजिए", right: "respectful send request"}, {left: "देख लेना", right: "casual reminder to look"}, {left: "देखिए", right: "respectful look request"}, {left: "बैठो", right: "informal sit request"}, {left: "बैठिए", right: "respectful sit request"}], status: correct}], feedback: "Short imperatives suit familiar address; respectful forms suit formal address."}
  hi.b2.unit05.lesson03.exercise03.order_send: {instruction: "Arrange Arjun's request to Priya.", correct_response: "प्रिया रिपोर्ट भेज दो", feedback: "*प्रिया, रिपोर्ट भेज दो* is familiar."}
  hi.b2.unit05.lesson03.exercise04.order_reminder: {instruction: "Arrange the casual reminder.", correct_response: "समय मिले तो देख लेना", feedback: "*लेना* makes this a casual reminder."}
  hi.b2.unit05.lesson03.exercise05.translate_friend: {instruction: "Translate for Priya: Send the report.", accepted_answers: [{value: "रिपोर्ट भेज दो", status: correct}, {value: "रिपोर्ट भेजो", status: correct}], feedback: "Use *दो* with this close colleague."}
  hi.b2.unit05.lesson03.exercise06.write_reminder: {instruction: "Using लेना, write: Have a look when you have time.", accepted_answers: [{value: "समय मिले तो देख लेना", status: correct}, {value: "जब समय मिले तो देख लेना", status: correct}], feedback: "The required form is *समय मिले तो देख लेना*."}
  hi.b2.unit05.lesson03.exercise07.dictation_informal: {instruction: "Listen and type exactly what you hear.", correct_response: "रिपोर्ट भेज दो", orthography_strict: true, feedback: "The sentence was *रिपोर्ट भेज दो*."}
  hi.b2.unit05.lesson04.exercise01.choose_opening: {instruction: "Where does this opening belong?", options: ["a formal email", "a quick note to Arjun", "a family group chat"], correct_option: "a formal email", accepted_answers: [{value: "a formal email", status: correct}], feedback: "*आदरणीय महोदय* is a formal opening."}
  hi.b2.unit05.lesson04.exercise02.match_writing: {instruction: "Match each Hindi item to its correspondence function.", accepted_answers: [{value: [{left: "आदरणीय", right: "respected formal opening"}, {left: "महोदय", right: "sir in formal correspondence"}, {left: "सादर", right: "respectful formal closing"}, {left: "संलग्न", right: "attached"}, {left: "कृपया", right: "please"}, {left: "धन्यवाद", right: "thanks"}], status: correct}], feedback: "These items distinguish opening, request, attachment, thanks, and closing."}
  hi.b2.unit05.lesson04.exercise03.order_email: {instruction: "Arrange the formal email request.", correct_response: "कृपया संलग्न रिपोर्ट देखिए", feedback: "*संलग्न* means attached."}
  hi.b2.unit05.lesson04.exercise04.order_message: {instruction: "Arrange the casual message.", correct_response: "अर्जुन रिपोर्ट देख लेना", feedback: "This version addresses Arjun familiarly."}
  hi.b2.unit05.lesson04.exercise05.translate_formal_email: {instruction: "Translate for a formal email: Please see the attached report.", accepted_answers: [{value: "कृपया संलग्न रिपोर्ट देखिए", status: correct}, {value: "कृपया संलग्न रिपोर्ट देखें", status: correct}], feedback: "Use *देखिए* in formal writing."}
  hi.b2.unit05.lesson04.exercise06.write_closing: {instruction: "Write: Respectfully, Priya.", accepted_answers: [{value: "सादर प्रिया", status: correct}, {value: "सादर, प्रिया", status: correct}], feedback: "The formal closing is *सादर, प्रिया*."}
  hi.b2.unit05.lesson04.exercise07.write_informal: {instruction: "Write to Arjun: Arjun, have a look at the report.", accepted_answers: [{value: "अर्जुन रिपोर्ट देख लेना", status: correct}, {value: "अर्जुन, रिपोर्ट देख लेना", status: correct}], feedback: "The casual message is *अर्जुन, रिपोर्ट देख लेना*."}
  hi.b2.unit05.lesson05.exercise01.read_audience: {instruction: "Who receives Priya's first message?", options: ["her manager", "Arjun", "a family member"], correct_option: "her manager", accepted_answers: [{value: "her manager", status: correct}], feedback: "The text says *अपने मैनेजर को*."}
  hi.b2.unit05.lesson05.exercise02.read_goal: {instruction: "What stays the same across both messages?", options: ["the purpose", "the greeting", "the verb form"], correct_option: "the purpose", accepted_answers: [{value: "the purpose", status: correct}], feedback: "*दोनों संदेशों का उद्देश्य एक है*."}
  hi.b2.unit05.lesson05.exercise03.match_audience: {instruction: "Match each Hindi item to its function.", accepted_answers: [{value: [{left: "आदरणीय महोदय", right: "formal addressee opening"}, {left: "कृपया", right: "polite softener"}, {left: "देखिए", right: "respectful look form"}, {left: "सादर", right: "formal closing"}, {left: "देख लेना", right: "casual reminder"}, {left: "भेज दो", right: "friendly direct request"}], status: correct}], feedback: "The first four cue formal writing; the last two cue familiar language."}
  hi.b2.unit05.lesson05.exercise04.order_contrast: {instruction: "Arrange the principle from the reading.", correct_response: "भाषा श्रोता के अनुसार बदलती है", feedback: "Language changes with the audience."}
  hi.b2.unit05.lesson05.exercise05.translate_principle: {instruction: "Translate: Language changes according to the audience.", accepted_answers: [{value: "भाषा श्रोता के अनुसार बदलती है", status: correct}], feedback: "*के अनुसार* means according to."}
  hi.b2.unit05.lesson05.exercise06.write_manager: {instruction: "Using आदरणीय and कृपया, write: Respected sir, please see the attached report.", accepted_answers: [{value: "आदरणीय महोदय कृपया संलग्न रिपोर्ट देखिए", status: correct}, {value: "आदरणीय महोदय, कृपया संलग्न रिपोर्ट देखिए", status: correct}], feedback: "The formal version is *आदरणीय महोदय, कृपया संलग्न रिपोर्ट देखिए*."}
  hi.b2.unit05.lesson05.exercise07.write_friend: {instruction: "Adapt it for Arjun: Arjun, have a look at the report.", accepted_answers: [{value: "अर्जुन रिपोर्ट देख लेना", status: correct}, {value: "अर्जुन, रिपोर्ट देख लेना", status: correct}], feedback: "The familiar version is *अर्जुन, रिपोर्ट देख लेना*."}
  hi.b2.unit05.lesson06.exercise01.dialogue_audience: {instruction: "Whom is Priya preparing the respectful message for?", options: ["the manager", "Arjun", "a childhood friend"], correct_option: "the manager", accepted_answers: [{value: "the manager", status: correct}], feedback: "Priya asks what to write to the manager."}
  hi.b2.unit05.lesson06.exercise02.dialogue_formal: {instruction: "Which message does Arjun suggest for the manager?", options: ["Please see the attached report.", "Just look at the report when you can.", "Thank you for your help."], correct_option: "Please see the attached report.", accepted_answers: [{value: "Please see the attached report.", status: correct}], feedback: "He says *कृपया संलग्न रिपोर्ट देखिए*."}
  hi.b2.unit05.lesson06.exercise03.dialogue_informal: {instruction: "Which message does Arjun suggest for a friend?", options: ["Have a look at the report.", "Respected sir, see the report.", "Could you kindly send the report?"], correct_option: "Have a look at the report.", accepted_answers: [{value: "Have a look at the report.", status: correct}], feedback: "He says *रिपोर्ट देख लेना*."}
  hi.b2.unit05.lesson06.exercise04.match_final: {instruction: "Match each Hindi form to its function.", accepted_answers: [{value: [{left: "कृपया", right: "polite softener"}, {left: "बैठिए", right: "respectful sit form"}, {left: "बैठो", right: "informal sit form"}, {left: "भेज दीजिए", right: "respectful completed request"}, {left: "भेज दो", right: "friendly direct request"}, {left: "सादर", right: "formal sign-off"}], status: correct}], feedback: "The contrast is audience-based."}
  hi.b2.unit05.lesson06.exercise05.speak_two_audiences: {instruction: "Say 'Send the report' first to a manager with कृपया...दीजिए, then to Priya with ...दो.", accepted_answers: [{value: "कृपया रिपोर्ट भेज दीजिए रिपोर्ट भेज दो", status: correct}, {value: "कृपया रिपोर्ट भेज दीजिए। रिपोर्ट भेज दो।", status: correct}], feedback: "The paired delivery is *कृपया रिपोर्ट भेज दीजिए। रिपोर्ट भेज दो।*"}
  hi.b2.unit05.lesson06.exercise06.write_formal: {instruction: "Write a formal message with these exact parts, in order: the opening 'Respected sir', the request 'Please see the attached report', and the closing 'Respectfully, Priya'.", accepted_answers: [{value: "आदरणीय महोदय कृपया संलग्न रिपोर्ट देखिए सादर प्रिया", status: correct}, {value: "आदरणीय महोदय, कृपया संलग्न रिपोर्ट देखिए। सादर, प्रिया", status: correct}], feedback: "A full model is *आदरणीय महोदय, कृपया संलग्न रिपोर्ट देखिए। सादर, प्रिया*."}
  hi.b2.unit05.lesson06.exercise07.write_informal: {instruction: "Adapt the content as a casual message to Arjun: Arjun, have a look at the report. Thanks.", accepted_answers: [{value: "अर्जुन रिपोर्ट देख लेना धन्यवाद", status: correct}, {value: "अर्जुन, रिपोर्ट देख लेना। धन्यवाद!", status: correct}], feedback: "The casual version is *अर्जुन, रिपोर्ट देख लेना। धन्यवाद!*"}
