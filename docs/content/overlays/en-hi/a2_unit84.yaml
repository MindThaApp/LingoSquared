teaching:
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson01.teach.hunar_shabd:
    title: Skills
    gloss: to swim / to sing / to cook / to drive / to speak Hindi
    note: To say that someone has learned a skill, use the infinitive plus *आता है*.
    example_gloss:
    - I know how to swim.
    - Priya knows how to sing.
    - Arjun knows how to cook.
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson01.teach.gn_aata_hai:
    title: 'Know how to: आता है'
    gloss: I know how to swim. Priya knows how to sing. Do you know how to swim?
    note: Person + *को* (*मुझे*, *तुम्हें*, *प्रिया को*) + infinitive + *आता है*. The verb *आता* stays the same because it agrees with the infinitive.
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson01.teach.gn_nahin_aata:
    title: Do not know how
    gloss: I do not know how to drive. Arjun does not know how to cook.
    note: 'Put *नहीं* before *आता*. The final *है* is dropped in the negative: *नहीं आता*.'
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson01.teach.gn_hindi_aati:
    title: A language or a verb
    gloss: I know Hindi. I know how to speak Hindi.
    note: 'With a feminine noun like *हिंदी* the verb agrees with the noun: *आती है*. With an infinitive it stays *आता है*.'
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson02.teach.madad_shabd:
    title: Words for helping
    gloss: to help / work / evening / today
    note: '*मुझे काम है* = I have work. The person takes *को* here too.'
    example_gloss:
    - Can you help?
    - I have work this evening.
    - I can come today.
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson02.teach.gn_tum_sakte:
    title: Can with तुम
    gloss: You can come (to a man). You can come (to a woman). Can you help?
    note: With *तुम* the ending is *सकते हो* (man) or *सकती हो* (woman).
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson02.teach.gn_nahin_sakta_kaam:
    title: Can and cannot today
    gloss: Today I cannot come, I have work. I can come tomorrow.
    note: '*सकना* says whether circumstances allow it. A reason often follows: *मुझे काम है*.'
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson03.teach.dard_shabd:
    title: Words for a problem
    gloss: pain / hand / leg / but
    note: '*हाथ में दर्द है* = my hand hurts (literally: there is pain in the hand).'
    example_gloss:
    - My hand hurts.
    - My leg hurts.
    - I know how to swim, but today I cannot swim.
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson03.teach.gn_nahin_aata_nahin_sakta:
    title: Two different ideas
    gloss: I do not know how to swim. I am not able to swim.
    note: '*नहीं आता* = you never learned it. *नहीं सकता* = something stops you now, such as pain or no time.'
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson03.teach.gn_aata_lekin:
    title: Both in one sentence
    gloss: I know how to swim, but today I cannot swim.
    note: A learned skill (*आता है*) can still be blocked today (*नहीं सकता*). Note that the verb before *सकना* is the bare stem *तैर*, not *तैरना*.
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson04.teach.khali_shabd:
    title: Availability
    gloss: Saturday / Sunday / free / busy
    note: '*खाली* and *व्यस्त* do not change for gender.'
    example_gloss:
    - On Saturday I am free.
    - On Sunday I am busy.
    - On Saturday Priya is free.
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson04.teach.gn_khali:
    title: Describing your time
    gloss: On Saturday I am free. On Sunday I am busy.
    note: Day + *को* + person + *खाली / व्यस्त* + *है / हूँ*.
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson04.teach.gn_ho_sakta:
    title: May happen
    gloss: It may rain. Arjun may come late.
    note: '*सकना* also says that something is possible. The subject agrees as usual: *बारिश* is feminine (*सकती*), *अर्जुन* is masculine (*सकता*).'
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson05.teach.padhne_shabd:
    title: Words for the message
    gloss: picnic / so, therefore / help
    note: '*इसलिए* = ''so, for that reason''.'
    example_gloss:
    - I can help at the picnic.
    - It may rain, so I will bring an umbrella.
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson05.teach.padho_message:
    title: Priya writes to Arjun
    gloss: Arjun, I can help at the picnic. I know how to swim, but I do not know how to drive. On Saturday I am busy, but on Sunday I am free. It may rain on Sunday, so I can bring an umbrella. Priya
    note: Notice which sentences are about a skill (*आता है*) and which are about what she can do (*सकती हूँ*).
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson06.teach.d1:
    title: Arjun asks
    gloss: 'Arjun: Priya, do you know how to swim?'
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson06.teach.d2:
    title: Priya answers
    gloss: 'Priya: Yes, I know how to swim, but I do not know how to drive.'
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson06.teach.d3:
    title: Arjun asks about Saturday
    gloss: 'Arjun: Never mind. Can you come on Saturday?'
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson06.teach.d4:
    title: Priya gives her time
    gloss: 'Priya: On Saturday I am busy, but on Sunday I am free.'
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson06.teach.d5:
    title: Arjun warns
    gloss: 'Arjun: All right. It may rain on Sunday.'
  hi.a2.unit84.mujhe_tairna_aata_hai.lesson06.teach.d6:
    title: Priya offers
    gloss: 'Priya: Never mind, I can bring an umbrella.'
