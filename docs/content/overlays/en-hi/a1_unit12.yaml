review:
  status: unreviewed
  required_next_reviewer: codex
  notes: >-
    Twelfth en-hi overlay, written for hi/a1_unit12_past_events.yaml
    (schema_version 1.1, §19 vocabulary-example format from the start; see
    that file's own generation_provenance for the full, honest
    source-access account, the spine-outcome confirmation against
    universal_spine.yaml, the six disclosed central grammar decisions
    (था/थी as a direct extension of the already-taught copula paradigm;
    गया/गई and मिला/मिली as intransitive-only past tense, deliberately
    avoiding the ने-ergative construction transitive verbs would require;
    से's dual "from"/"with" usage; कैसा completing the already-taught
    कैसे/कैसी paradigm; थे/गए/मिले taught receptively only, mirroring the
    course's recognition-before-production discipline at the grammar-
    paradigm level; क्या's dual yes/no-marker/"what" usage), the
    same-speaker-distractor check, the cross-unit fact check, the
    disclosed nasalization/spelling discipline, the word_order
    duplicate-token check, and the confirmed-not-reset-per-lesson
    tokenizer behavior). Both files are freshly authored from established
    Modern Standard Hindi, same as units 01-11. No sibling-direction
    overlay exists yet for this unit (hi-en hasn't been authored), so the
    sibling-isolation rule (AUTHORING_GUIDE §8) doesn't apply here --
    noted for whoever authors hi-en next: do not open this file for
    structure/phrasing reference when doing so.

answer_policy:
  gender_agreement: >-
    This unit's central grammar point is subject-gender agreement on past-
    tense verbs (था/थी, गया/गई, मिला/मिली). Typed answers that use the
    wrong-gender form for a NAMED subject whose gender is already
    established (Arjun = masculine, Priya = feminine) should be marked
    incorrect -- this is the exact point being tested. For open-ended
    "describe your own day" prompts (writing_prompt/speak_response) where
    the learner's own gender isn't known, accept either gender's form as
    equally correct.
  intransitive_only: >-
    This unit deliberately teaches only intransitive past-tense verbs
    (जाना -> गया/गई, मिलना -> मिला/मिली) plus the copula (था/थी) -- no
    ने-marked transitive past tense (e.g. "मैंने खाना खाया") appears
    anywhere in this unit's accepted answers, by design.
  nasalization_marks: >-
    Display and teach the correct chandrabindu/anusvara distinction. This
    unit introduces no new nasalized vocabulary at all -- the only
    nasalized forms used anywhere in this unit are हूँ/हैं and वहाँ, all
    reused unchanged from their already-settled spellings. In typed A1
    answers, accept a variant that drops a nasalization mark entirely or
    substitutes anusvara for chandrabindu (or vice versa) when every other
    character is correct. Do not extend this tolerance to a wrong vowel or
    consonant, which changes the actual word.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question
    marks (?), exclamation marks, and commas may likewise be omitted,
    but the fully punctuated form remains the model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or nasalization marks. For any exercise asking the
    learner to describe their own recent day, accept any of this unit's
    taught phrasings that fit the prompt, not only the single model
    sentence given in `accepted_answers`.

course:
  title: "Hindi A1"

units:
  hi.a1.unit12.past_events:
    title: "Yesterday"

lessons:
  hi.a1.unit12.lesson01.tha_thi:
    title: "How was yesterday?"
  hi.a1.unit12.lesson02.gaya_gai_mila_mili:
    title: "I went to the market"
  hi.a1.unit12.lesson03.arjun_priya_kal:
    title: "Arjun and Priya: yesterday"

teaching:
  hi.a1.unit12.lesson01.teach.vyast_review:
    title: "Review: busy"
    gloss: "busy"
    note: "A quick review of unit 11's adjective -- this unit reuses it to practice the new past-tense copula."
    example_gloss: "Arjun is busy."

  hi.a1.unit12.lesson01.teach.tha_thi:
    title: "Was (masculine / feminine)"
    gloss: "was"
    note: "The past tense of the copula (is/am/are), the direct past-tense counterpart of hai/hoon/hain. 'Tha' agrees with a masculine subject, 'thi' with a feminine subject."
    example_gloss:
      - "Arjun was busy yesterday."
      - "Priya was busy yesterday."

  hi.a1.unit12.lesson01.teach.tha_thi_grammar:
    title: "Tha vs. thi"
    gloss: "'Tha' goes with a masculine subject, 'thi' with a feminine subject -- exactly like 'hai'/'hoon': Arjun was busy, Priya was busy."
    note: "States the gender-agreement pattern explicitly, extending the already-familiar copula paradigm into the past tense."

  hi.a1.unit12.lesson01.teach.kal_review:
    title: "Review: yesterday"
    gloss: "yesterday"
    note: "First taught in unit 4, where 'kal' was flagged as meaning both 'tomorrow' and 'yesterday', disambiguated only by the verb's tense. This is the course's first unit to actually use its past-tense ('yesterday') sense."
    example_gloss: "Yesterday was Saturday."

  hi.a1.unit12.lesson01.teach.kaisa:
    title: "How (masculine)"
    gloss: "how"
    note: "Completes a paradigm this course already has two-thirds of -- 'kaise' and 'kaisi' (both from unit 1's 'how are you') were already taught; this is simply the missing masculine-singular form, used with subjects like 'din' (day)."
    example_gloss: "How was the day?"

  hi.a1.unit12.lesson01.teach.kal_kaisa_tha_phrase:
    title: "How was yesterday?"
    gloss: "How was yesterday?"
    note: "This unit's central recurring question, combining every word taught so far in this lesson."

  hi.a1.unit12.lesson01.teach.din_achha_tha_phrase:
    title: "The day was good."
    gloss: "The day was good."
    note: "A ready-to-use answer to 'How was yesterday?', using the masculine form (din is masculine)."

  hi.a1.unit12.lesson01.teach.filma_achi_thi:
    title: "The movie was good."
    gloss: "The movie was good."
    note: "The same pattern with a feminine subject (film is feminine), callback to unit 11's vocabulary."

  hi.a1.unit12.lesson01.teach.kaisa_kaisi_grammar:
    title: "Kaisa, kaisi, kaise"
    gloss: "'Kaisa' goes with a masculine singular subject (How was the day?), 'kaisi' with feminine (How was the tea?), and 'kaise' is used to ask aap/tum (How are you?) -- all three are the same word."
    note: "Ties together the full paradigm for the first time -- kaise/kaisi were already known from unit 1, kaisa is this lesson's own addition."

  hi.a1.unit12.lesson02.teach.names_mai_review:
    title: "Review: I, Arjun, Priya"
    gloss: "I, Arjun, Priya"
    note: "A quick review before this lesson's first-person past-tense examples."
    example_gloss:
      - "I am Arjun."
      - "I am Priya."

  hi.a1.unit12.lesson02.teach.jaana_gaya_gai:
    title: "Went (masculine / feminine)"
    gloss: "went"
    note: "The past tense of 'jaana' (to go), the same root already taught as the imperative 'jao' (go!) in unit 9. Agrees with the subject's gender, just like 'tha'/'thi'."
    example_gloss:
      - "Arjun went to the market."
      - "Priya went home."

  hi.a1.unit12.lesson02.teach.jaana_grammar:
    title: "Gaya/gai = past of jaana"
    gloss: "'Gaya'/'gai' is the past tense of 'jaana' (to go, jao in unit 9), and changes with the subject's gender -- just like 'tha'/'thi'."
    note: "Explicitly ties the new past tense back to the already-known imperative root."

  hi.a1.unit12.lesson02.teach.bazaar_ghar_review:
    title: "Review: market, home"
    gloss: "market, home"
    note: "A quick review of two place words from unit 7/8, needed to say where someone went."
    example_gloss:
      - "This is the market."
      - "This is home."

  hi.a1.unit12.lesson02.teach.milna_mila_mili:
    title: "Met (masculine / feminine)"
    gloss: "met"
    note: "The past tense of 'milna' (to meet), the same root already taught as the habitual 'milte hain' (unit 1/4/10/11's closings). Agrees with the subject's gender."
    example_gloss:
      - "Arjun met Priya."
      - "Priya met Arjun."

  hi.a1.unit12.lesson02.teach.milna_se_grammar:
    title: "Se = 'with' here, not 'from'"
    gloss: "Here 'se' doesn't mean 'from' -- 'X se milna' means 'to meet WITH X', the same way 'main Bharat se hoon' used 'se' to mean 'from'."
    note: "A genuine dual usage of an already-taught word, disclosed explicitly."

  hi.a1.unit12.lesson02.teach.wahan_review:
    title: "Review: there"
    gloss: "there"
    note: "A quick review from unit 8/9, used here to say where a meeting happened."
    example_gloss: "The school is there."

  hi.a1.unit12.lesson02.teach.kal_bazaar_gaya_phrase:
    title: "I went to the market yesterday."
    gloss: "I went to the market yesterday."
    note: "Combines this lesson's new past tense with 'kal' from lesson 1."

  hi.a1.unit12.lesson02.teach.wahan_priya_se_mila_phrase:
    title: "I met Priya there."
    gloss: "I met Priya there."
    note: "Combines this lesson's 'mila' with 'se' ('with') and 'wahan' (there)."

  hi.a1.unit12.lesson02.teach.saath_review:
    title: "Review: together"
    gloss: "together"
    note: "A quick review from unit 11."
    example_gloss: "We drink tea together."

  hi.a1.unit12.lesson03.teach.chai_dukaan_khana_review:
    title: "Review: tea, shop, food"
    gloss: "tea, shop, food"
    note: "A quick review of three nouns from units 6/7, needed for this lesson's dialogue and reading note."
    example_gloss:
      - "The tea is good."
      - "The shop is good."
      - "The food is good."

  hi.a1.unit12.lesson03.teach.ka_kaisi_review:
    title: "Review: 'of' (ka), how (feminine)"
    gloss: "of / 's (ka), how (feminine, kaisi)"
    note: "'Ka' (already taught in unit 2's 'iski keemat') and 'kaisi' (already taught in unit 1) are both reused here, not new grammar."
    example_gloss:
      - "Yesterday's day was good."
      - "How was the tea shop?"

  hi.a1.unit12.lesson03.teach.dialogue.line01:
    title: "Arjun asks how yesterday was"
    gloss: "Priya, how was yesterday?"
  hi.a1.unit12.lesson03.teach.dialogue.line02:
    title: "Priya says it was good"
    gloss: "Very good! We met."
  hi.a1.unit12.lesson03.teach.dialogue.line03:
    title: "Arjun mentions the market"
    gloss: "Yes! I also went to the market first."
  hi.a1.unit12.lesson03.teach.dialogue.line04:
    title: "Priya asks about the market"
    gloss: "Good! What was at the market?"
  hi.a1.unit12.lesson03.teach.dialogue.line05:
    title: "Arjun answers"
    gloss: "The food was good."
  hi.a1.unit12.lesson03.teach.dialogue.line06:
    title: "Priya asks about the tea shop"
    gloss: "Good! And how was the tea shop?"
  hi.a1.unit12.lesson03.teach.dialogue.line07:
    title: "Arjun answers"
    gloss: "The tea shop was very good."
  hi.a1.unit12.lesson03.teach.dialogue.line08:
    title: "Priya closes"
    gloss: "Good! So, shall we meet again tomorrow?"

  hi.a1.unit12.lesson03.teach.mile_grammar:
    title: "Tum/hum/ve take the plural-shaped past form"
    gloss: "'Tum', 'hum', and 've' take the same form in the past tense that they do in the present with '-te': 'the' (instead of 'tha'), 'gaye' (instead of 'gaya'), 'mile' (instead of 'mila') -- like 'hum milte hain' becomes 'hum mile'."
    note: "States the fuller paradigm for genuine comprehension, though only 'mile' is actively drilled in this unit's exercises -- 'the'/'gaye' are recognition-only, appearing solely in this note's own explanation."

  hi.a1.unit12.lesson03.teach.priya_note:
    title: "Priya's note"
    gloss: "Arjun, yesterday was very good. The food was good and the tea shop was good too. - Priya"
    note: "A short written note restating the facts the dialogue just established, no new vocabulary."
    glosses:
      कल: "yesterday"
      दिन: "day"
      अच्छा: "good (masculine)"
      था: "was (masculine)"
      खाना: "food"
      दुकान: "shop"
      अच्छी: "good (feminine)"
      थी: "was (feminine)"

