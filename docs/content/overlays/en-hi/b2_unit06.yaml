  hi.b2.unit06.lesson03.kaaran:
    title: कारण और परिणाम
  hi.b2.unit06.lesson04.santulan:
    title: मूल्यों में तनाव
  hi.b2.unit06.lesson05.path:
    title: तर्कपूर्ण पाठ
  hi.b2.unit06.lesson06.mulyankan:
    title: एक अमूर्त विचार पर तर्क
teaching:
  hi.b2.unit06.lesson01.teach.values:
    title: Naming values
    gloss: "Freedom, equality, and justice are important values."
    note: "*मूल्य* means a value; *महत्वपूर्ण* (important) marks which values matter."
  hi.b2.unit06.lesson01.teach.opinion:
    title: Stating an opinion
    gloss: "In my view, freedom is necessary. For me, justice is most important."
    note: "Open an opinion with *मेरे विचार से* (in my view) or *मेरे लिए* (for me)."
  hi.b2.unit06.lesson02.teach.definition:
    title: Defining a term
    gloss: "Justice means that every person is treated fairly."
    note: "Define an abstract term with *X का अर्थ है कि...* (X means that...)."
  hi.b2.unit06.lesson02.teach.means:
    title: Refining a definition
    gloss: "Equality does not mean merely being the same, but rather getting equal opportunity."
    note: "*का मतलब* (means) with *केवल...नहीं, बल्कि...* (not merely..., but rather...) refines a definition."
  hi.b2.unit06.lesson03.teach.reason:
    title: Giving a reason
    gloss: "Responsibility is necessary because our every decision affects others, and our decisions are important."
    note: "Introduce a reason with *क्योंकि* (because)."
  hi.b2.unit06.lesson03.teach.result:
    title: Stating a result
    gloss: "People trust one another, therefore society becomes strong."
    note: "*इसलिए* (therefore) marks the result that follows from a cause."
  hi.b2.unit06.lesson04.teach.tension:
    title: A tension between values
    gloss: "Freedom is important; nevertheless, other people's rights are its limit."
    note: "*फिर भी* (nevertheless) adds a qualification that limits a value."
  hi.b2.unit06.lesson04.teach.balance:
    title: Balancing values
    gloss: "A balance is needed between individual freedom and social responsibility; both values must be kept in mind."
    note: "*के बीच संतुलन चाहिए* (a balance is needed between) weighs two competing values."
  hi.b2.unit06.lesson05.teach.reading:
    title: A reasoned passage
    gloss: "Freedom gives us the right to make our own decisions. But every decision also affects others. Therefore freedom and responsibility are not opposing values. Justice is for everyone. In my view, a just society should have a balance between the two."
    note: "The passage builds an argument: a claim, a qualification with *लेकिन* (but), and a conclusion with *इसलिए* (therefore)."
  hi.b2.unit06.lesson06.teach.dialogue:
    title: "Priya: In my view, freedom is the most important."
    gloss: "Priya: In my view, freedom is the most important."
  hi.b2.unit06.lesson06.teach.dialogue_arjun_agree:
    title: "Arjun: I agree, but responsibility is just as important."
    gloss: "Arjun: I agree, but responsibility is just as important."
    note: "Partial agreement uses *मैं सहमत हूँ, लेकिन...* (I agree, but...) before adding a counter-point."
  hi.b2.unit06.lesson06.teach.dialogue_priya_reason:
    title: "Priya: That's right, because freedom without responsibility can harm others."
    gloss: "Priya: That's right, because freedom without responsibility can harm others."
  hi.b2.unit06.lesson06.teach.dialogue_arjun_balance:
    title: "Arjun: That's why a balance between both values is needed."
    gloss: "Arjun: That's why a balance between both values is needed."
