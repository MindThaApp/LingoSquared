course:
  title: Hindi B2
units:
  hi.b2.unit06.amurt_vichar:
    title: Abstract ideas and values
    description: Define values, explain reasons, weigh tensions, and give a supported view.
lessons:
  hi.b2.unit06.lesson01.moolya:
    title: मूल्यों पर राय
