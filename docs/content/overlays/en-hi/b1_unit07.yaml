answer_policy:
  chahiye_advice: >-
    "*Tumhein*...*chahiye*" ("you should") is a direct advice form,
    reusing the same obligation construction taught for self-obligation
    earlier in the course, now aimed at someone else.
  transitive_infinitive_agreement: >-
    With a transitive verb like *peena* ("to drink"), the infinitive
    before *chahiye* agrees with the OBJECT's gender ("*peeni*" agreeing
    with feminine *coffee*), not the subject -- don't accept the
    unagreed masculine "*peena*" where the exercise specifically targets
    this agreement. Intransitive verbs like *sona* ("to sleep") do not
    inflect this way.
  agar_tumhari_jagah: >-
    "*Agar mein tumhari jagah hota, to...*" ("if I were you, I would...")
    reuses the *agar*...*to* conditional construction and the *hota*
    auxiliary already taught, with genuinely new vocabulary (*jagah*,
    *tumhari*). Unlike unit 9's ergative *kiya hota*, this *hota* is the
    intransitive copula and genuinely agrees with the SPEAKER's own
    gender. lesson02.exercise10 (`fix_hota_not_hoti_male_speaker`) is
    pinned to Arjun (masculine) as the speaker, so the feminine "*hoti*"
    is correctly rejected there ONLY. Everywhere else the learner answers
    as themselves with no pinned gender (e.g.
    lesson02.exercise11/lesson01.exercise11's
    `reply_mujhe_neend_nahi_aati_kya_karoon`), so both "*hota*" and
    "*hoti*" must be accepted.
  kyon_na: >-
    "*Kyon na tum...?*" ("why don't you...?") is a suggestion form using
    the subjunctive (*soo*, tum-form of "to sleep").
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question
    marks (?) may likewise be omitted, but the fully punctuated form
    remains the model answer. For the two-sentence culminating writing
    exercise, also accept the internal sentence-boundary period being
    replaced by a comma, or omitted with a space, as equivalent.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

