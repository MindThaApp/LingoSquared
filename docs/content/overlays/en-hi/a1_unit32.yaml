teaching:
  hi.a1.unit32.lesson01.teach.janvar_paltoo_janvar:
    title: Animal, a pet
    gloss: the animal / a pet
    note: '*जानवर* is the general word for an animal, and *पालतू जानवर* (''tame animal'') means a pet.'
    example_gloss:
    - A dog is an animal.
    - A dog is also a pet.
  hi.a1.unit32.lesson01.teach.kutta_billee:
    title: Dog and cat
    gloss: the dog / the cat
    example_gloss:
    - Priya has a dog.
    - Vikram has a cat.
  hi.a1.unit32.lesson01.teach.machhlee_chiriya:
    title: Fish and bird
    gloss: the fish / the bird
    example_gloss:
    - Grandpa has a fish.
    - Nina has a bird.
  hi.a1.unit32.lesson01.teach.kya_tumhare_pas:
    title: Do you have a pet?
    gloss: Do you have a pet?
    note: '*तुम्हारे पास ... है?* (''with you ... is?'') asks ''do you have ...?'', and *कोई* (''any'') keeps it open.'
  hi.a1.unit32.lesson01.teach.han_mere_pas:
    title: Yes, I have a dog
    gloss: Yes, I have a dog.
    note: A simple affirmative answer using this unit's new vocabulary.
  hi.a1.unit32.lesson01.teach.naheen_mere_pas:
    title: No, I don't have a pet
    gloss: No, I don't have a pet.
    note: '*कोई ... नहीं है* (''there is no ...'') says that you have none.'
  hi.a1.unit32.lesson01.teach.mere_pas_koee:
    title: कोई ... नहीं
    gloss: I do not have a pet.
    note: '*कोई* (''any'') plus *नहीं है* negates having something: *मेरे पास कोई पालतू जानवर नहीं है*.'
  hi.a1.unit32.lesson02.teach.ghumane_le_jana:
    title: To walk (an animal)
    gloss: to walk (an animal)
    note: '*घुमाने ले जाना* (''to take out for a walk'') is how Hindi says ''to walk an animal''; *घुमाने* is followed by *ले जाना*.'
    example_gloss: I walk the dog every day.
  hi.a1.unit32.lesson02.teach.vah_kutte_ko:
    title: घुमाने ले जाना
    gloss: She takes the dog for a walk.
    note: The animal takes *को* (*कुत्ते को*), and *घुमाने ले जाती है* comes last; *ले जाना* ('to take along') stays together as two words.
  hi.a1.unit32.lesson02.teach.khana_dena:
    title: To feed
    gloss: to feed
    example_gloss: I feed the cat every day.
  hi.a1.unit32.lesson02.teach.ke_sath_khelna:
    title: To play with
    gloss: to play with
    example_gloss: Vikram plays with his cat.
  hi.a1.unit32.lesson02.teach.main_roz_kutte:
    title: I walk the dog every day
    gloss: I walk the dog every day.
    note: '*रोज़* (''every day'') comes before the object: *रोज़ कुत्ते को घुमाने ले जाता हूँ*.'
  hi.a1.unit32.lesson02.teach.main_roz_billee:
    title: I feed the cat every day
    gloss: I feed the cat every day.
    note: '*खाना देना* (''to give food'') marks who gets the food with *को*: *बिल्ली को खाना देता हूँ*.'
  hi.a1.unit32.lesson03.teach.ek_kutta_do:
    title: Plural forms
    gloss: One dog, two dogs; one cat, two cats. A masculine noun ending in *-आ* changes to *-ए* in the plural (*कुत्ता* to *कुत्ते*), while a feminine noun ending in *-ई* adds *-याँ* (*बिल्ली* to *बिल्लियाँ*).
    note: The regular Hindi plural pattern, introduced here for the first time with animal nouns as the example set.
  hi.a1.unit32.lesson03.teach.kutte_billiyan:
    title: Dogs and cats
    gloss: dogs / cats
    example_gloss:
    - Arjun loves dogs.
    - Neha loves cats.
  hi.a1.unit32.lesson03.teach.machhliyan_chiriyan:
    title: Fish and birds (plural)
    gloss: fish (plural) / birds
    example_gloss:
    - I love fish.
    - Grandpa loves birds.
  hi.a1.unit32.lesson03.teach.mujhe_janvar_bahut:
    title: I love animals
    gloss: I love animals.
    note: '*मुझे जानवर बहुत पसंद हैं* (''to me, animals are very liked'') says ''I love animals''; *हैं* is plural because *जानवर* is plural.'
  hi.a1.unit32.lesson03.teach.neha_ko_billiyan:
    title: Neha loves cats, but has no pet
    gloss: Neha loves cats, but she doesn't have a pet.
    note: Sets up the contrast lesson05's reading is built around.
  hi.a1.unit32.lesson04.teach.arjun_kya_tumhare:
    title: Arjun asks about a pet
    gloss: 'Arjun: Do you have a pet, Priya?'
  hi.a1.unit32.lesson04.teach.priya_han_mere:
    title: Priya has a dog
    gloss: 'Priya: Yes, I have a dog.'
  hi.a1.unit32.lesson04.teach.arjun_vah_kaisa:
    title: Arjun asks what it looks like
    gloss: 'Arjun: What does he look like?'
    note: '*वह कैसा दिखता है?* works for animals too, and *कैसा* is masculine because the dog is male.'
  hi.a1.unit32.lesson04.teach.priya_uske_bal:
    title: Priya describes her dog
    gloss: 'Priya: He has brown hair and he''s small.'
    note: Reuses hair-color and size vocabulary from the appearance unit, now describing an animal's fur instead of a person's hair.
  hi.a1.unit32.lesson04.teach.vah_mera_kutta:
    title: वह for animals
    gloss: That is my dog. I really like him.
    note: '*वह* and *उसे* are used for animals as well as for people; Hindi has no separate word for ''it'' here.'
  hi.a1.unit32.lesson04.teach.arjun_kya_tum:
    title: Arjun asks about walks
    gloss: 'Arjun: Do you walk him every day?'
  hi.a1.unit32.lesson04.teach.priya_han_main:
    title: Priya describes her routine
    gloss: 'Priya: Yes, I walk him every day and I feed him.'
  hi.a1.unit32.lesson05.teach.arjun_aur_neha:
    title: Arjun, Neha, and Vikram on animals
    gloss: 'Arjun and Neha both love animals, but neither of them has a pet. Arjun loves dogs and Neha loves cats. Vikram does have a pet: a cat. He often plays with his cat and feeds the cat every day. Do you have a pet?'
    note: Contrasts loving an animal with actually owning one -- the outcome's own communicative point.
    glosses:
      पसंद: love
      दोनों: both
      जानवर: animals
      किसी: any of them
      पालतू: pet
      कुत्ते: dogs
      बिल्लियाँ: cats
      बिल्ली: cat
      खेलता: plays
      देता: gives
      रोज़: every
      खाना: food
  hi.a1.unit32.lesson05.teach.vikram_aksar_apnee:
    title: Vikram often plays with his cat
    gloss: Vikram often plays with his cat.
    note: '*अक्सर* (''often'') comes before the verb, and *अपनी* agrees with the feminine *बिल्ली*.'
  hi.a1.unit32.lesson05.teach.mujhe_kutte_bahut:
    title: I love dogs. I don't have a pet.
    gloss: I love dogs. I don't have a pet.
    note: A model two-sentence answer, ready to reuse for the unit's writing prompt.
  hi.a1.unit32.lesson06.teach.priya_neena_kya:
    title: Priya asks Nina
    gloss: 'Priya: Nina, do you have a pet too?'
  hi.a1.unit32.lesson06.teach.neena_han_mere:
    title: Nina has a bird named Pico
    gloss: 'Nina: Yes, I have a bird. His name is Pico.'
    note: '*उसका नाम पिको है* (''his name is Pico'') uses *का* because *नाम* is masculine.'
  hi.a1.unit32.lesson06.teach.arjun_vah_kitna:
    title: Arjun reacts
    gloss: 'Arjun: How nice! What do you do with him every day?'
  hi.a1.unit32.lesson06.teach.neena_main_use:
    title: Nina feeds him every day
    gloss: 'Nina: I feed him every day.'
  hi.a1.unit32.lesson06.teach.arjun_mujhe_bhee:
    title: Arjun loves birds too
    gloss: 'Arjun: I love birds too.'
  hi.a1.unit32.lesson06.teach.priya_kitna_achchha:
    title: Priya closes the conversation
    gloss: 'Priya: Nice that the three of us love animals!'
    note: Closes the loop across all three characters' animal facts from this unit.
