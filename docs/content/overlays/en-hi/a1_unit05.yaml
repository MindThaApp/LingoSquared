answer_policy:
  nasalization_marks: >-
    Display and teach the correct chandrabindu/anusvara distinction.
    This unit's own new vocabulary needs no new nasalization-mark
    decisions -- it only reuses already-settled spellings (हैं/नहीं's
    anusvara from units 01/03/04). In typed A1 answers, accept a
    variant that drops a nasalization mark entirely or substitutes
    anusvara for chandrabindu when every other character is correct.
    Do not extend this tolerance to a wrong vowel or consonant, which
    changes the actual word.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question
    marks (?) and exclamation marks may likewise be omitted, but the
    fully punctuated form remains the model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    (aap vs. tum) rather than written punctuation or nasalization marks.

