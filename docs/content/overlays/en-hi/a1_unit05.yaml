teaching:
  hi.a1.unit05.lesson01.teach.parivar:
    title: "Family"
    gloss: "family"
    note: "The general word for family, used throughout this unit."
    example_gloss: "My family is in India."

  hi.a1.unit05.lesson01.teach.pita_maa:
    title: "Father, mother"
    gloss: "father, mother"
    note: >-
      Both take the respectful plural form *hain* instead of *hai*
      when introducing them, and *pita* takes *mere* instead of *mera*
      -- see the honorific note later in this lesson.
    example_gloss:
      - "This is my father."
      - "This is my mother."

  hi.a1.unit05.lesson01.teach.bhai_behan:
    title: "Brother, sister"
    gloss: "brother, sister"
    note: "This unit's core pair for the mera/meri agreement contrast: *mera bhai*, *meri behan*."
    example_gloss:
      - "I have a brother."
      - "I have a sister."

  hi.a1.unit05.lesson01.teach.ek_as_article:
    title: "Ek as 'a/an'"
    gloss: "*Ek* means 'one' in counting and also works as 'a/an': *mera ek bhai hai*."
    note: "The same word already taught as the number 1 -- Hindi doesn't have a separate indefinite article."

  hi.a1.unit05.lesson01.teach.mata_pita:
    title: "Parents"
    gloss: "parents"
    note: "A compound of *mata* (mother, formal) and *pita* (father) -- the standard word for 'parents.'"
    example_gloss: "My parents live in Delhi."

  hi.a1.unit05.lesson01.teach.mera_meri_note:
    title: "Mera vs. meri"
    gloss: "*Mera* goes with masculine words, *meri* with feminine words: *mera bhai*, *meri behan*."
    note: "The core grammar point of this unit -- the possessive agrees with the person or thing possessed, not with the speaker."

  hi.a1.unit05.lesson01.teach.mere_honorific_note:
    title: "Mere for respected elders"
    gloss: "Out of respect for elders, *mera* becomes *mere* and *hai* becomes *hain*, even for one person: *yeh mere pita hain* (This is my father)."
    note: >-
      A real, genuine convention, not an error -- respected singular
      family elders (father, grandfather) take this plural-looking
      form. Mothers and grandmothers keep *meri* but the verb still
      goes plural (*hain*) for the same reason.

  hi.a1.unit05.lesson01.teach.yah_mera_bhai_hai:
    title: "This is my brother"
    gloss: "This is my brother."
    note: "The straightforward masculine form -- no honorific needed for a brother."

  hi.a1.unit05.lesson01.teach.yah_meri_behan_hai:
    title: "This is my sister"
    gloss: "This is my sister."
    note: "The straightforward feminine form, agreeing with *behan*."

  hi.a1.unit05.lesson01.teach.yah_kaun_hai:
    title: "Who is this?"
    gloss: "Who is this?"
    note: "A simple, useful question for introducing family members."

  hi.a1.unit05.lesson02.teach.dada_dadi:
    title: "Paternal grandfather, grandmother"
    gloss: "paternal grandfather, paternal grandmother"
    note: "Your father's parents specifically -- see the note later in this lesson contrasting these with your mother's parents."
    example_gloss:
      - "My grandfather lives in Delhi."
      - "My grandmother lives in Delhi."

  hi.a1.unit05.lesson02.teach.nana_nani:
    title: "Maternal grandfather, grandmother"
    gloss: "maternal grandfather, maternal grandmother"
    note: "Your mother's parents -- Hindi uses an entirely different word pair than for your father's parents."
    example_gloss:
      - "My grandfather (mother's side) lives in Mumbai."
      - "My grandmother (mother's side) lives in Mumbai."

  hi.a1.unit05.lesson02.teach.dilli_mumbai:
    title: "Delhi, Mumbai"
    gloss: "Delhi, Mumbai"
    note: "Two major Indian cities, used in this lesson's examples of where family members live."
    example_gloss:
      - "My family lives in Delhi."
      - "My brother lives in Mumbai."

  hi.a1.unit05.lesson02.teach.dada_nana_note:
    title: "Two grandparent pairs"
    gloss: "Father's parents: *dada-dadi*. Mother's parents: *nana-nani*."
    note: "Unlike English's single 'grandfather/grandmother,' Hindi has entirely separate words depending on which side of the family."

  hi.a1.unit05.lesson02.teach.rehna_verb:
    title: "Lives (rehna)"
    gloss: "lives (masculine / feminine / honorific-plural)"
    note: "The verb for 'to live/reside' -- *rehta hai* for a man, *rehti hai* for a woman, *rehte hain* for more than one person or a respected elder."
    example_gloss:
      - "My brother lives in Delhi."
      - "My sister lives in Mumbai."
      - "My grandparents live in Delhi."

  hi.a1.unit05.lesson02.teach.tumhara_tumhari:
    title: "Your (informal)"
    gloss: "your (informal, masculine / feminine)"
    note: "The informal *tum*-register possessive, agreeing with the possessed noun exactly like *mera/meri*."
    example_gloss:
      - "Where does your brother live?"
      - "Where does your sister live?"

  hi.a1.unit05.lesson02.teach.mera_tumhara_note:
    title: "Mera and tumhara together"
    gloss: "*Mera* and *tumhara* both go with masculine words; *meri* and *tumhari* both go with feminine words: *mera bhai*/*tumhara bhai*, *meri behan*/*tumhari behan*."
    note: "The same agreement pattern from lesson 1, now shown to apply to *tumhara* too."

  hi.a1.unit05.lesson03.teach.bada_badi:
    title: "Older / big"
    gloss: "older, big (masculine / feminine)"
    note: "Hindi marks an older sibling with this agreeing adjective rather than a separate word like English 'older brother.'"
    example_gloss:
      - "My older brother lives in Delhi."
      - "My older sister lives in Mumbai."

  hi.a1.unit05.lesson03.teach.chota_choti:
    title: "Younger / small"
    gloss: "younger, small (masculine / feminine)"
    note: "The counterpart to *bada/badi*, for a younger sibling."
    example_gloss:
      - "My younger brother is a student right now."
      - "My younger sister is a student right now."

  hi.a1.unit05.lesson03.teach.bada_chota_note:
    title: "Bada/chota agreement"
    gloss: "*Bada* and *chota* go with masculine words, *badi* and *choti* with feminine words: *bada bhai*, *badi behan*."
    note: "The same masculine/feminine adjective agreement already seen with *mera/meri*, now applied to age-describing words."

  hi.a1.unit05.lesson03.teach.aur_lekin_bhi:
    title: "And, but, also"
    gloss: "and, but, also"
    note: "Three basic connecting words, reused throughout this lesson's closing dialogue."
    example_gloss:
      - "My brother and my sister live in Delhi."
      - "My brother lives in Delhi, but my sister lives in Mumbai."
      - "I also have a sister."

  hi.a1.unit05.lesson03.teach.accha_phir_milenge:
    title: "Okay, see you again"
    gloss: "Okay! See you again."
    note: "A friendly closing, reused from unit 1's own farewell vocabulary."

  hi.a1.unit05.lesson03.teach.theek_hai_phir_milte_hain:
    title: "Alright, see you soon"
    gloss: "Alright, see you soon!"
    note: "The informal-register reply to the closing above, matching earlier units' own closing exchanges."

  hi.a1.unit05.lesson03.teach.dialogue.line01:
    title: "Arjun asks about Priya's family"
    gloss: "Arjun asks where Priya's family lives."
    note: "Reuses this unit's own *parivar kahan rehta hai* pattern."
  hi.a1.unit05.lesson03.teach.dialogue.line02:
    title: "Priya describes her parents and brother"
    gloss: "Priya says her parents live in Delhi and she also has an older brother."
    note: "Combines *mata-pita*, *rehte hain*, and *bada bhai bhi hai*."
  hi.a1.unit05.lesson03.teach.dialogue.line03:
    title: "Arjun asks back"
    gloss: "Arjun says nice, and asks about Priya's family in return."
    note: "A short, natural turn-passing question reusing *tumhara parivar*."
  hi.a1.unit05.lesson03.teach.dialogue.line04:
    title: "Priya describes both sets of grandparents"
    gloss: "Priya says her paternal grandparents live in Delhi, but her maternal grandparents live in Mumbai."
    note: "Uses *lekin* to contrast the two grandparent pairs' cities, reinforcing the dada-dadi/nana-nani distinction from lesson 2."
  hi.a1.unit05.lesson03.teach.dialogue.line05:
    title: "Arjun mentions his own sister"
    gloss: "Arjun says he also has a younger sister."
    note: "Reuses *bhi* and *choti behan*."
  hi.a1.unit05.lesson03.teach.dialogue.line06:
    title: "Priya closes the conversation"
    gloss: "Priya says nice, see you again."
    note: "Reuses this lesson's own closing phrase."
  hi.a1.unit05.lesson03.teach.dialogue.line07:
    title: "Arjun replies"
    gloss: "Arjun agrees and says see you soon."
    note: "Reuses this lesson's own reply phrase."

exercises:
  hi.a1.unit05.lesson01.exercise01.select_bhai:
    instruction: "Which word means brother?"
    correct_option: "भाई"
    distractors: ["बहन", "पिता"]
    accepted_answers: ["भाई"]

  hi.a1.unit05.lesson01.exercise02.select_behan:
    instruction: "Which word means sister?"
    correct_option: "बहन"
    distractors: ["भाई", "माँ"]
    accepted_answers: ["बहन"]

  hi.a1.unit05.lesson01.exercise03.select_mere_pita_meaning:
    instruction: "What does this sentence mean?"
    correct_option: "This is my father."
    distractors: ["This is my brother.", "This is my mother."]
    accepted_answers: ["This is my father."]

  hi.a1.unit05.lesson01.exercise04.match_immediate_family:
    instruction: "Match each Hindi family word to its English meaning."
    correct_response:
      "परिवार": "family"
      "पिता": "father"
      "माँ": "mother"
      "भाई": "brother"
      "बहन": "sister"
      "माता-पिता": "parents"

  hi.a1.unit05.lesson01.exercise05.order_yah_mera_bhai_hai:
    instruction: "Put the sentence in order: This is my brother."
    correct_response: ["यह", "मेरा", "भाई", "है"]

  hi.a1.unit05.lesson01.exercise06.order_yah_meri_behan_hai:
    instruction: "Put the sentence in order: This is my sister."
    correct_response: ["यह", "मेरी", "बहन", "है"]

  hi.a1.unit05.lesson01.exercise07.fill_mera_bhai:
    instruction: "Complete the sentence: This is my brother."
    accepted_answers: ["मेरा"]
    feedback: "Yeh mera bhai hai -- mera agrees with the masculine bhai."

  hi.a1.unit05.lesson01.exercise08.fill_meri_behan:
    instruction: "Complete the sentence: This is my sister."
    accepted_answers: ["मेरी"]
    feedback: "Yeh meri behan hai -- meri agrees with the feminine behan."

  hi.a1.unit05.lesson01.exercise09.fix_behan_agreement:
    instruction: "Correct the sentence -- behan is feminine, so 'my' needs the feminine form."
    accepted_answers:
      - "यह मेरी बहन है।"
      - "यह मेरी बहन है"
    feedback: "Yeh meri behan hai -- mera is masculine and doesn't agree with the feminine behan."

  hi.a1.unit05.lesson01.exercise10.reply_who_is_this:
    instruction: "Answer that this is your brother."
    accepted_answers:
      - "यह मेरा भाई है।"
      - "यह मेरा भाई है"
      - "यह मेरी बहन है।"
      - "यह मेरी बहन है"

  hi.a1.unit05.lesson01.exercise11.speak_about_sibling:
    instruction: "Say that you have a brother (or a sister)."
    accepted_answers:
      - "मेरा एक भाई है।"
      - "मेरा एक भाई है"
      - "मेरी एक बहन है।"
      - "मेरी एक बहन है"

  hi.a1.unit05.lesson02.exercise01.select_dada:
    instruction: "Which word means paternal grandfather?"
    correct_option: "दादा"
    distractors: ["नाना", "पिता"]
    accepted_answers: ["दादा"]

  hi.a1.unit05.lesson02.exercise02.select_nani:
    instruction: "Which word means maternal grandmother?"
    correct_option: "नानी"
    distractors: ["दादी", "माँ"]
    accepted_answers: ["नानी"]

  hi.a1.unit05.lesson02.exercise03.select_dada_nana_note_meaning:
    instruction: "What does this sentence mean?"
    correct_option: "Father's parents are called dada-dadi."
    distractors: ["Mother's parents are called dada-dadi.", "Dada and nana mean the same thing."]
    accepted_answers: ["Father's parents are called dada-dadi."]

  hi.a1.unit05.lesson02.exercise04.match_extended_family:
    instruction: "Match each Hindi word to its English meaning."
    correct_response:
      "दादा": "paternal grandfather"
      "दादी": "paternal grandmother"
      "नाना": "maternal grandfather"
      "नानी": "maternal grandmother"
      "दिल्ली": "Delhi"
      "मुंबई": "Mumbai"
      "भाई": "brother"
      "बहन": "sister"
      "माता-पिता": "parents"

  hi.a1.unit05.lesson02.exercise05.order_tumhara_bhai_kahan_rehta_hai:
    instruction: "Put the question in order: Where does your brother live?"
    correct_response: ["तुम्हारा", "भाई", "कहाँ", "रहता", "है"]

  hi.a1.unit05.lesson02.exercise06.order_meri_behan_mumbai_mein_rehti_hai:
    instruction: "Put the sentence in order: My sister lives in Mumbai."
    correct_response: ["मेरी", "बहन", "मुंबई", "में", "रहती", "है"]

  hi.a1.unit05.lesson02.exercise07.fill_dada_rehte:
    instruction: "Complete the sentence: My grandfather lives in Delhi."
    accepted_answers: ["रहते"]
    feedback: "Mere dada Dilli mein rehte hain -- rehte hain shows respect for a family elder."

  hi.a1.unit05.lesson02.exercise08.fill_tumhari_behan:
    instruction: "Complete the question, based on tumhari agreeing with a feminine word."
    accepted_answers: ["बहन"]
    feedback: "Tumhari behan kahan rehti hai? -- tumhari agrees with the feminine behan."

  hi.a1.unit05.lesson02.exercise09.fix_nani_agreement:
    instruction: "Correct the sentence -- nani is feminine, so 'your' needs the feminine form."
    accepted_answers:
      - "यह तुम्हारी नानी है।"
      - "यह तुम्हारी नानी है"
