  hi.a1.unit05.lesson02.exercise10.reply_bhai_kahan_rehta_hai:
    instruction: "Answer that your brother lives in Delhi."
    accepted_answers:
      - "मेरा भाई दिल्ली में रहता है।"
      - "मेरा भाई दिल्ली में रहता है"

  hi.a1.unit05.lesson02.exercise11.speak_about_grandparents:
    instruction: "Say where your grandfather lives."
    accepted_answers:
      - "मेरे दादा दिल्ली में रहते हैं।"
      - "मेरे दादा दिल्ली में रहते हैं"
      - "मेरे नाना मुंबई में रहते हैं।"
      - "मेरे नाना मुंबई में रहते हैं"

  hi.a1.unit05.lesson03.exercise01.select_bada_bhai_meaning:
    instruction: "What does this phrase mean?"
    correct_option: "older brother"
    distractors: ["younger brother", "older sister"]
