  hi.a2.unit23.lesson01.teach.grammar_se_duration:
    title: "The third sense of se: duration"
    gloss: "'Se' has three senses: where someone is from (unit 3, 'main Bharat se hoon' = from), who someone is with (unit 12, 'X se milna' = with), and now 'since when' (duration) -- '[time] se' means 'for/since [time]': 'mujhe teen din se bukhar hai' = 'I've had a fever for three days.'"
    note: "This unit's first new grammar point, disclosed against the two senses already taught rather than silently overloading a familiar word."

  hi.a2.unit23.lesson01.teach.mujhe_teen_din_se_bukhar_hai_phrase:
    title: "I've had a fever for three days"
    gloss: "I've had a fever for three days."
    note: "The first live example of the duration sense of *se*."

  hi.a2.unit23.lesson02.teach.dawa:
