answer_policy:
  se_duration: >-
    *Se* has three distinct senses taught across this course: "from" (a
    place, unit 3), "with" (a person, unit 12), and now "for/since" (a
    duration, this unit) -- "*[time] se*" states how long a condition has
    lasted: "*teen din se bukhar hai*" (I've had a fever for three days).
    A typed answer omitting *se* in this construction is marked incorrect
    as a real grammar error, the exact contrast lesson01's own
    grammar_check exercise targets.
  chahiye_modal: >-
    *Chahiye* governs a verb infinitive to mean "should", not just a noun
    object (unit 6's "*mujhe dawa chahiye*"): "*aapko aaraam karna
    chahiye*" (you should rest). This unit deliberately only exercises the
    invariant masculine form (*karna*, since *aaraam* is masculine) --
    real Hindi can also gender-agree the governed infinitive with its own
    object (e.g. *dawa leni chahiye*, feminine), disclosed in this unit's
    own grammar note and shown once in the dialogue, but not tested live
    here.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question marks
    (?) may likewise be omitted, but the fully punctuated form remains the
    model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

