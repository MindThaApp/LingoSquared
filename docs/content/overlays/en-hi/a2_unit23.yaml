  hi.a2.unit23.lesson02.teach.grammar_chahiye_modal:
    title: "Chahiye + infinitive means 'should'"
    gloss: "'Chahiye' isn't only used with a noun ('mujhe dawa chahiye') -- it can also govern a VERB and mean 'should': 'aapko aaraam karna chahiye' (You should rest). Note: the governed infinitive can sometimes agree with its own object's gender (e.g. 'aapko yah dawa leni chahiye', 'leni' agreeing with feminine 'dawa') -- this unit only exercises the invariant masculine 'karna' form, to teach one new rule at a time."
    note: "This unit's second new grammar point."

  hi.a2.unit23.lesson02.teach.aapko_aaram_karna_chahiye_phrase:
    title: "You should rest (formal)"
    gloss: "You should rest."
    note: "The formal-register version, using *aapko*."

  hi.a2.unit23.lesson02.teach.tumhein_aaram_chahiye_review:
