realization_key: hi.b2
review:
  status: unreviewed
course:
  title: Hindi B2
units:
  hi.b2.unit07.baatcheet:
    title: Negotiating and resolving disagreement
    description: State terms, decline politely, offer a conditional concession, and reach agreement.
lessons:
  hi.b2.unit07.lesson01.prastaav:
    title: Making a proposal
  hi.b2.unit07.lesson02.vinamra_asahmati:
    title: Disagreeing politely
  hi.b2.unit07.lesson03.shart:
    title: A conditional concession
  hi.b2.unit07.lesson04.vikalp:
    title: Offering an alternative
  hi.b2.unit07.lesson05.likhit_samjhauta:
    title: Understanding a written agreement
  hi.b2.unit07.lesson06.mulyankan:
    title: Completing a negotiation
teaching:
  hi.b2.unit07.lesson01.prastaav.teach.models:
    title: Negotiation models
    gloss: My suggestion is that we divide the work. Why not split the costs equally?
    note: 'Notice the Hindi move: proposal, refusal, condition, alternative, or agreement.'
  hi.b2.unit07.lesson02.vinamra_asahmati.teach.models:
    title: Negotiation models
    gloss: This suggestion is not possible for me. I do not agree with this point.
    note: 'Notice the Hindi move: proposal, refusal, condition, alternative, or agreement.'
  hi.b2.unit07.lesson03.shart.teach.models:
    title: Negotiation models
    gloss: I agree provided that you arrive on time. If you shop, Arjun will cook.
    note: 'Notice the Hindi move: proposal, refusal, condition, alternative, or agreement.'
  hi.b2.unit07.lesson04.vikalp.teach.models:
    title: Negotiation models
    gloss: Instead, we can adopt another method. Priya will do half and Arjun the rest.
    note: 'Notice the Hindi move: proposal, refusal, condition, alternative, or agreement.'
  hi.b2.unit07.lesson05.likhit_samjhauta.teach.models:
    title: Negotiation models
    gloss: In the end, both agreed to divide the work equally. The shopping issue remained open.
    note: 'Notice the Hindi move: proposal, refusal, condition, alternative, or agreement.'
  hi.b2.unit07.lesson06.mulyankan.teach.models:
    title: Negotiation models
    gloss: My suggestion is that we divide the work equally. This is not possible for me, but I agree provided that you shop.
    note: 'Notice the Hindi move: proposal, refusal, condition, alternative, or agreement.'
