teaching:
  hi.a1.unit06.lesson01.teach.khana:
    title: "Food"
    gloss: "food, meal"
    note: "The general word for food, used throughout this unit."
    example_gloss: "My food is ready now."

  hi.a1.unit06.lesson01.teach.chai_coffee:
    title: "Tea, coffee"
    gloss: "tea, coffee"
    note: "Two common drinks, used throughout this unit to practice the *mujhe ... chahiye* pattern."
    example_gloss:
      - "I would like tea."
      - "I would like coffee."

  hi.a1.unit06.lesson01.teach.pani_juice:
    title: "Water, juice"
    gloss: "water, juice"
    note: "Two more common drinks, no gender agreement needed since *chahiye* is invariant."
    example_gloss:
      - "I would like water."
      - "I would like juice."

  hi.a1.unit06.lesson01.teach.chahiye_note:
    title: "Mujhe ... chahiye"
    gloss: "*Mujhe ... chahiye* means 'I would like ...'. It doesn't change for the speaker's gender (unlike *chahta/chahti*), and it never takes *hai* afterward."
    note: >-
      The core grammar point of this unit -- a very common real
      learner mistake is adding *hai* after *chahiye*, since almost
      every other sentence taught so far ends that way. *Chahiye* is
      already a complete predicate on its own.

  hi.a1.unit06.lesson01.teach.aapko_kya_chahiye:
    title: "What would you like? (formal)"
    gloss: "What would you like?"
    note: "The formal *aap*-register question, used by a server or host addressing someone politely."

  hi.a1.unit06.lesson01.teach.tumhein_kya_chahiye:
    title: "What would you like? (informal)"
    gloss: "What would you like?"
    note: "The informal *tum*-register dative pronoun, parallel to *mujhe* and to unit 5's own *tumhara/tumhari*."

  hi.a1.unit06.lesson01.teach.chai_chahiye_shukriya:
    title: "I'd like tea, thanks"
    gloss: "I would like tea, thanks."
    note: "A natural, polite ordering response, reusing *shukriya* from earlier units."

  hi.a1.unit06.lesson01.teach.bahut:
    title: "Very"
    gloss: "very, much"
    note: "A common intensifier, used throughout this unit to describe food and drink."
    example_gloss: "This tea is very good."

  hi.a1.unit06.lesson01.teach.swadisht:
    title: "Delicious"
    gloss: "delicious, tasty"
    note: "A useful word for reacting to food -- see this unit's own grammar note in lesson 3 about why it never changes for gender."
    example_gloss: "This food is very delicious."

  hi.a1.unit06.lesson02.teach.roti_chawal:
    title: "Bread, rice"
    gloss: "flatbread, rice"
    note: "Two staple foods of an everyday Indian meal."
    example_gloss:
      - "I would like bread."
      - "I would like rice."

  hi.a1.unit06.lesson02.teach.sabzi_daal:
    title: "Vegetable dish, lentils"
    gloss: "vegetable dish, lentils (dal)"
    note: "Two more staple dishes, commonly eaten together with roti and rice."
    example_gloss:
      - "I would like the vegetable dish."
      - "I would like lentils."

  hi.a1.unit06.lesson02.teach.kap_gilas_plate:
    title: "Cup, glass, plate"
    gloss: "cup, glass, plate"
    note: "Common containers used with *ek* ('one/a') to specify a quantity when ordering."
    example_gloss:
      - "I would like a cup of tea."
      - "I would like a glass of water."
      - "I would like a plate of rice."

  hi.a1.unit06.lesson02.teach.kripya:
    title: "Please"
    gloss: "please"
    note: "A simple politeness word, added to the end of a request."
    example_gloss: "I would like a cup of tea, please."

  hi.a1.unit06.lesson02.teach.kuch_aur_chahiye:
    title: "Anything else?"
    gloss: "Anything else? / Would you like something more?"
    note: "The natural follow-up question a server asks after taking part of an order."

  hi.a1.unit06.lesson02.teach.nahin_bas_shukriya:
    title: "No, that's all, thanks"
    gloss: "No, that's all, thanks."
    note: "A natural, polite way to end an order, reusing *nahin* and *shukriya* from earlier units."

  hi.a1.unit06.lesson02.teach.sabzi_swadisht_phrase:
    title: "This vegetable dish is very delicious"
    gloss: "This vegetable dish is very delicious."
    note: "Reuses this unit's own *bahut* and *swadisht* with a new food noun, in preparation for lesson 3's grammar note about *swadisht* never changing for gender."

  hi.a1.unit06.lesson03.teach.chalo_khate_hain:
    title: "Let's eat something!"
    gloss: "Let's eat something!"
    note: "A friendly, fixed way to suggest eating together, opening this unit's closing dialogue."

  hi.a1.unit06.lesson03.teach.ya:
    title: "Or"
    gloss: "or"
    note: "A simple connecting word, used to offer a choice between two things."
    example_gloss: "Would you like tea or coffee?"

  hi.a1.unit06.lesson03.teach.haan:
    title: "Yes"
    gloss: "yes"
    note: "A simple affirmative, reused throughout this unit's closing dialogue."
    example_gloss: "Yes, I would like tea."

  hi.a1.unit06.lesson03.teach.swadisht_invariant_note:
    title: "Swadisht never changes"
    gloss: "*Swadisht* stays the same with both masculine and feminine words -- it doesn't change the way *achha/achhi* does."
    note: >-
      A real, load-bearing exception: unlike the agreeing adjectives
      already taught (achha/achhi, bada/badi, mera/meri), adjectives
      ending in a consonant like *swadisht* never inflect for gender.

  hi.a1.unit06.lesson03.teach.accha_phir_milenge:
    title: "Okay, see you again"
    gloss: "Okay! See you again."
    note: "A friendly closing, reused from earlier units' own farewell vocabulary."

  hi.a1.unit06.lesson03.teach.theek_hai_phir_milte_hain:
    title: "Alright, see you soon"
    gloss: "Alright, see you soon!"
    note: "The informal-register reply to the closing above, matching earlier units' own closing exchanges."

  hi.a1.unit06.lesson03.teach.dialogue.line01:
    title: "Arjun suggests eating"
    gloss: "Arjun says let's eat something."
    note: "Reuses this unit's own opening phrase."
  hi.a1.unit06.lesson03.teach.dialogue.line02:
    title: "Priya asks what he wants"
    gloss: "Priya agrees and asks what Arjun would like."
    note: "Reuses the informal *tumhein kya chahiye* question from lesson 1."
  hi.a1.unit06.lesson03.teach.dialogue.line03:
    title: "Arjun orders food"
    gloss: "Arjun says he would like a plate of roti and vegetable dish."
    note: "Combines this unit's food nouns, the *ek plate* container pattern, and *chahiye*."
  hi.a1.unit06.lesson03.teach.dialogue.line04:
    title: "Priya offers a drink choice"
    gloss: "Priya says nice, and asks if Arjun would like tea or coffee."
    note: "Uses this unit's own *ya* to offer a choice between two drinks."
  hi.a1.unit06.lesson03.teach.dialogue.line05:
    title: "Arjun chooses coffee"
    gloss: "Arjun says he would like coffee, please."
    note: "Reuses *kripya* from lesson 2."
  hi.a1.unit06.lesson03.teach.dialogue.line06:
    title: "Priya comments on the food"
    gloss: "Priya says okay, and that this food is very delicious."
    note: "Reuses *bahut swadisht* from lesson 1."
  hi.a1.unit06.lesson03.teach.dialogue.line07:
    title: "Arjun agrees"
    gloss: "Arjun says yes, thanks very much."
    note: "Reuses *haan* and *shukriya*."
  hi.a1.unit06.lesson03.teach.dialogue.line08:
    title: "Priya closes the conversation"
    gloss: "Priya says nice, see you again."
    note: "Reuses this lesson's own closing phrase."
  hi.a1.unit06.lesson03.teach.dialogue.line09:
    title: "Arjun replies"
    gloss: "Arjun agrees and says see you soon."
    note: "Reuses this lesson's own reply phrase."

