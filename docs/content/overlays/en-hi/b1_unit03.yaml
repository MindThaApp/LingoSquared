review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    Third en-hi B1 overlay, written for hi/b1_unit03_agar_to.yaml -- see
    that file's own generation_provenance/review notes for the full
    account (real/likely future conditions with future-future अगर...तो,
    contrasted with the tenseless unreal/counterfactual अगर...होता,
    तो... construction). No sibling-direction overlay (hi-en) exists yet,
    so §8 doesn't apply. Not yet reviewed -- status left honestly as
    unreviewed.

    Asterisk convention (§15): every inline romanized-Hindi word inside a
    `note`/`gloss` field below is wrapped in single asterisks.

answer_policy:
  real_vs_unreal: >-
    Hindi marks this contrast by VERB FORM, not just context: a real/
    likely future condition uses future tense in both clauses (*hoga/
    hogi* ... *-oonga/enge*), while an unreal/counterfactual condition
    (present or past) uses the SAME *-ta/ti/te* participle form in both
    clauses (*hota* ... *jaata/aata*) regardless of whether the unreality
    is about now or the past -- Hindi doesn't grammatically distinguish
    unreal-present from unreal-past here, only context/adverbs do. A
    typed answer using future-tense forms where the unreal construction
    is called for (or vice versa) is marked incorrect as a real grammar
    error, not a typo.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question marks
    (?) may likewise be omitted, but the fully punctuated form remains the
    model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

