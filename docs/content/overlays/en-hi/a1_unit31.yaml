    title: Arjun recognizes Nina
teaching:
  hi.a1.unit31.lesson01.teach.lanba_chhota:
    title: Tall and short
    gloss: tall / short
    note: '*लंबा* and *छोटा* describe height and usually go with *कद* (''height''): *नेहा का कद लंबा है*. They end in *-ा* for a masculine noun and *-ी* for a feminine one.'
    example_gloss:
    - Neha is tall.
    - Vikram is short.
  hi.a1.unit31.lesson01.teach.boorha_javan:
    title: Old and young
    gloss: old / young
    note: '*बूढ़ा* and *जवान* describe how old someone looks, without any number.'
    example_gloss:
    - Grandpa is old.
    - Arjun is young.
  hi.a1.unit31.lesson01.teach.tumharee_umr_kitnee:
    title: उम्र and बूढ़ा
    gloss: How old are you? Grandpa is old.
    note: To ask an exact age Hindi uses *उम्र* ('age'), while *बूढ़ा* describes an old person without any number.
  hi.a1.unit31.lesson01.teach.neha_ka_kad:
    title: Neha is tall and Vikram is short
    gloss: Neha is tall and Vikram is short.
    note: '*और* (''and'') links the two descriptions, and each *का कद* agrees with the masculine *कद*.'
  hi.a1.unit31.lesson02.teach.bal:
    title: Hair
    gloss: the hair
    note: '*बाल* (''hair'') is masculine and plural in Hindi, so words that describe it end in *-े*: *लंबे बाल*.'
    example_gloss: Arjun has short black hair.
  hi.a1.unit31.lesson02.teach.sunahre_bhoore_safed:
    title: Blond, brown, and white
    gloss: blond / brown / white
    note: 'Three hair colors: *सुनहरे*, *भूरे* and *सफ़ेद*; before *बाल* they end in *-े*.'
    example_gloss:
    - Priya has blond hair.
    - Vikram has brown hair.
    - Grandpa has white hair.
  hi.a1.unit31.lesson02.teach.lanbe_chhote:
    title: Long and short (hair)
    gloss: long / short (hair)
    note: '*लंबे* (''long'') and *छोटे* (''short'') describe hair, and they end in *-े* because *बाल* is plural.'
    example_gloss:
    - Neha has long hair.
    - Vikram has short hair.
  hi.a1.unit31.lesson02.teach.lanbe_bal_chhote:
    title: Adjectives before बाल
    gloss: Long hair, short hair, golden hair, brown hair, white hair, black hair.
    note: '*बाल* is masculine plural, so the adjective before it ends in *-े*: *लंबे बाल*, *भूरे बाल*.'
  hi.a1.unit31.lesson02.teach.uske_bal_lanbe:
    title: 'उसके: his or her'
    gloss: His or her hair is long.
    note: '*उसके* means both ''his'' and ''her'', so only the context tells you which is meant; here it agrees with the plural *बाल*.'
  hi.a1.unit31.lesson02.teach.arjun_ke_bal:
    title: Arjun has short black hair
    gloss: Arjun has short black hair.
    note: '*काले* is used again, now for hair, and it ends in *-े* because *बाल* is plural.'
  hi.a1.unit31.lesson02.teach.priya_ke_bal:
    title: Priya has long blond hair
    gloss: Priya has long blond hair.
    note: Combines this lesson's length and color vocabulary in one natural sentence.
  hi.a1.unit31.lesson03.teach.ankhen:
    title: Eyes
    gloss: the eyes
    note: '*आँखें* (''eyes'') is a feminine plural noun; the singular is *आँख*.'
    example_gloss: Arjun has brown eyes.
  hi.a1.unit31.lesson03.teach.neela_bhoora_hara:
    title: Blue, brown, and green
    gloss: blue / brown / green
    note: 'Three eye colors: *नीला*, *भूरा* and *हरा*; before the feminine *आँखें* they become *नीली*, *भूरी* and *हरी*.'
    example_gloss:
    - Priya has blue eyes.
    - Vikram has brown eyes.
    - Neha has green eyes.
  hi.a1.unit31.lesson03.teach.neelee_ankhen_bhooree:
    title: Adjectives before आँखें
    gloss: Blue eyes, brown eyes, green eyes.
    note: '*आँखें* is feminine, so the adjective before it ends in *-ी*: *नीली आँखें*.'
  hi.a1.unit31.lesson03.teach.priya_kaisee_dikhtee:
    title: What does Priya look like?
    gloss: What does Priya look like?
    note: '*कैसी दिखती है?* (''how does she look?'') is the core question: *कैसी* and *दिखती* are feminine for a woman, and *कैसा* and *दिखता* are masculine for a man.'
  hi.a1.unit31.lesson03.teach.priya_ke_bal:
    title: Priya has long blond hair and blue eyes
    gloss: Priya has long blond hair and blue eyes.
    note: 'A model answer: hair and eyes joined with *और*. The owner takes *के* for the plural *बाल* and *की* for the feminine *आँखें*.'
  hi.a1.unit31.lesson04.teach.priya_bhasha_kaife:
    title: Priya introduces Nina
    gloss: 'Priya: A new girl is coming to the language café. Her name is Nina.'
    note: '*आ रही है* (''is coming'') introduces someone new, and *उसका नाम ... है* gives the name.'
  hi.a1.unit31.lesson04.teach.arjun_oke_vah:
    title: Arjun asks what she looks like
    gloss: 'Arjun: Okay! What does she look like?'
    note: '*वह देखने में कैसी है?* asks ''what is she like to look at''; *वह* means both ''he'' and ''she''.'
  hi.a1.unit31.lesson04.teach.priya_uska_kad:
    title: Priya describes Nina's height and hair
    gloss: 'Priya: She is short and she has short blond hair.'
    note: 'This joins the height and the hair: *उसका कद छोटा है और उसके बाल छोटे और सुनहरे हैं*.'
  hi.a1.unit31.lesson04.teach.arjun_aur_uskee:
    title: Arjun asks about her eyes
    gloss: 'Arjun: And her eyes?'
    note: '*उसकी आँखें* means ''her eyes''; *उसकी* is feminine to agree with *आँखें*.'
  hi.a1.unit31.lesson04.teach.priya_uskee_ankhen:
    title: Priya describes Nina's eyes
    gloss: 'Priya: She has green eyes.'
    note: '*हरी* ends in *-ी* because *आँखें* is feminine.'
  hi.a1.unit31.lesson04.teach.arjun_shukriya_tab:
    title: Arjun will recognize her
    gloss: 'Arjun: Thanks! Then I''ll recognize her.'
    note: '*पहचान लूँगा* (''I will recognize'') is the future of *पहचानना*, and *उसे* means ''her''.'
  hi.a1.unit31.lesson05.teach.vikram_aur_neha:
    title: Comparing Vikram and Neha
    gloss: Vikram and Neha are brother and sister, but they look different. Vikram is short and has short brown hair and brown eyes. Neha is taller than Vikram and has long brown hair and green eyes. What do you look like?
    note: A short comparison reusing every color/length word taught so far, ending with the unit's core question directed at the reader.
    glosses:
      भाई: brother
      बहन: sister
      दिखते: look
      अलग: different
      छोटा: short
      छोटे: short
      भूरे: brown
      बाल: hair
      भूरी: brown
      आँखें: eyes
      लंबी: taller
      लंबे: long
      हरी: green
      कैसे: how (as in 'what do you look like')
  hi.a1.unit31.lesson05.teach.vikram_neha_se:
    title: Comparing with से
    gloss: Vikram is shorter than Neha.
    note: '*से* means ''than'' here and goes after the person you compare with: *नेहा से छोटा*, and the adjective comes just before the verb.'
  hi.a1.unit31.lesson05.teach.neha_ke_bal:
    title: Neha has longer hair than Vikram
    gloss: Neha has longer hair than Vikram.
    note: '*लंबे* agrees with the plural *बाल*, and *विक्रम से* gives the comparison.'
  hi.a1.unit31.lesson05.teach.mere_bal_chhote:
    title: I have short brown hair
    gloss: I have short brown hair.
    note: '*मेरे बाल छोटे और भूरे हैं* (''my hair is short and brown'') is a model sentence for describing yourself; *मेरे* agrees with the plural *बाल*.'
  hi.a1.unit31.lesson06.teach.arjun_dekho_kya:
    title: Arjun spots Nina
    gloss: 'Arjun: Look, is that Nina? She has short blond hair and green eyes.'
    note: '*देखो* (''look'') is the informal command to a friend.'
  hi.a1.unit31.lesson06.teach.priya_han_vahee:
    title: Priya confirms
    gloss: 'Priya: Yes, that''s Nina!'
    note: A short, natural confirmation.
  hi.a1.unit31.lesson06.teach.neena_hay_kya:
    title: Nina greets Arjun
    gloss: 'Nina: Hi, are you Arjun?'
    note: '*क्या तुम अर्जुन हो?* is a simple informal question to someone your own age.'
  hi.a1.unit31.lesson06.teach.arjun_han_tumse:
    title: Arjun greets Nina back
    gloss: 'Arjun: Yes! Nice to meet you, Nina.'
    note: '*तुमसे मिलकर अच्छा लगा* is the standard phrase for meeting someone for the first time; the feeling happens ''to'' you, so no word for ''I'' is needed.'
  hi.a1.unit31.lesson06.teach.neena_mujhe_bhee:
    title: Nina returns the greeting
    gloss: 'Nina: Nice to meet you too!'
    note: Closes the dialogue -- Arjun successfully recognized Nina from Priya's earlier description.
