    शिक्षिका/दफ़्तर/इंजीनियर -- इंजीनियर is this unit's one genuine
    nasalization decision, anusvara not chandrabindu, disclosed in full),
    the confirmed accumulates-across-lessons-within-one-file tokenizer
    behavior, the word-order duplicate-token check, and the §17
    fill_in_blank ambiguity check (including the deliberate
