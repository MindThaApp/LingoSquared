answer_policy:
  occupation_identity: >-
    "मैं + occupation + हूँ" states identity, e.g. "मैं शिक्षक हूँ" (I am a
    teacher). *Shikshak* (male) and *shikshika* (female) are NOT
    interchangeable typed answers -- when an exercise's context establishes
    a specific speaker's gender (e.g. Priya, established female), only the
    matching form should be marked correct, not both.
  workplace_mein: >-
    "[place] + में + काम करता/करती हूँ" states where someone works. A typed
    answer that drops *mein* entirely (e.g. "मैं दफ़्तर काम करता हूँ") is
    the exact ungrammatical error this unit's own grammar_check exercise
    targets, and should be marked incorrect, not tolerated as a minor typo.
  addressee_gender_verbs: >-
    *Karte*/*karti*/*karta* agree with either the addressee (तुम-form) or
    the speaker (मैं-form), matching unit 10's already-established -ता/-ती/
    -ते rule. A typed answer using the wrong gender-agreement form for an
    exercise anchored to a named, established-gender character (Arjun =
    male, Priya = female) should be marked incorrect as a real grammar
    error, not tolerated.
  nasalization_marks: >-
    Display and teach the correct chandrabindu/anusvara distinction.
    इंजीनियर uses anusvara (ं), verified via direct codepoint check --
    accept only the anusvara form, not a chandrabindu substitution, since
    the two mark structurally different phonological patterns (nasal-before-
    consonant vs. nasalized word-final vowel) and this course's own
    established convention (हूँ/नहीं/हाँ) uses chandrabindu only for the
    latter.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question marks
    (?) may likewise be omitted, but the fully punctuated form remains the
    model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation. For any exercise asking the learner to state their own
    occupation or workplace, accept any of this unit's taught phrasings
    that fit the prompt, not only the single model sentence given in
    `accepted_answers`.

course:
  title: "Hindi A1"

units:
  hi.a1.unit17.work:
    title: "Work"

lessons:
  hi.a1.unit17.lesson01.shikshak_shikshika_engineer:
    title: "Teacher and engineer"
  hi.a1.unit17.lesson02.school_aspatal_daftar:
    title: "School, hospital, and office"
  hi.a1.unit17.lesson03.priya_arjun_kaam:
    title: "Priya and Arjun: what work do you do?"

teaching:
  hi.a1.unit17.lesson01.teach.tum_tumhara_kya_review:
    title: "Review: you, your, what"
    gloss: "you (informal), your (informal), what"
    note: "A quick review of the words needed to ask a friend about their job."
    example_gloss: "What is your name?"

  hi.a1.unit17.lesson01.teach.arjun_priya_review:
    title: "Review: Arjun, Priya"
    gloss: "Arjun, Priya"
    note: "A reminder of both characters' names before this lesson uses them to anchor gendered questions."
    example_gloss:
      - "My name is Arjun."
      - "My name is Priya."

  hi.a1.unit17.lesson01.teach.copula_review:
    title: "Review: I, am, is, are"
    gloss: "I, am, is, are (informal you)"
    note: "The full small copula set needed for this unit's identity sentences."
    example_gloss:
      - "Are you OK?"
      - "I am OK."

  hi.a1.unit17.lesson01.teach.kaam_review:
    title: "Review: work"
    gloss: "work"
    note: "First taught in unit 10/11 -- reused here as the topic word for the whole unit."
    example_gloss: "I have work."

  hi.a1.unit17.lesson01.teach.karte_karti_karta_verb:
    title: "Do (you, male / you, female / I)"
    gloss: "do (you, male informal), do (you, female informal), do (I)"
    note: "Extends unit 10's already-taught -ta/-ti/-te agreement rule (also seen in unit 1's *kya tum yog karti ho?*) to the verb *karna* (to do)."
    example_gloss:
      - "What do you do?"
      - "I have breakfast."

  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karte_ho_phrase:
    title: "What work do you do? (to a man)"
    gloss: "What work do you do?"
    note: "This lesson's opening question, addressed to a male friend."

  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karti_ho_phrase:
    title: "What work do you do? (to a woman)"
    gloss: "What work do you do?"
    note: "The same question, addressed to a female friend -- only the verb ending changes."

  hi.a1.unit17.lesson01.teach.shikshak_shikshika:
    title: "Teacher (male / female)"
    gloss: "teacher (male), teacher (female)"
    note: "A new occupation noun pair. Unlike most nouns taught so far, this one changes with the SPEAKER's own gender -- see this lesson's own grammar note."
    example_gloss:
      - "I am a teacher (male)."
      - "I am a teacher (female)."

  hi.a1.unit17.lesson01.teach.grammar_occupation_gender:
    title: "Mein + occupation + hoon"
    gloss: "'Mein + occupation + hoon' states a job, the same old 'mein...hoon' frame from unit 1. Some occupations change with the speaker's own gender -- 'shikshak' (male), 'shikshika' (female), just like the -ta/-ti verb ending changed in unit 10. 'Doctor' and 'engineer' don't change -- the same word for either gender."
    note: "Discloses the two-way split (gender-agreeing nouns vs. invariant loanwords) explicitly before any exercise relies on it."

  hi.a1.unit17.lesson01.teach.doctor_review:
    title: "Review: doctor"
    gloss: "doctor"
    note: "First taught in unit 16 -- reused here as a gender-invariant occupation."
    example_gloss: "He/she is a doctor."

  hi.a1.unit17.lesson01.teach.mein_doctor_hoon_phrase:
    title: "I am a doctor."
    gloss: "I am a doctor."
    note: "The identity pattern applied to a review word."

  hi.a1.unit17.lesson01.teach.engineer:
    title: "Engineer"
    gloss: "engineer"
    note: "A new occupation noun, gender-invariant like *doctor*."
    example_gloss: "He/she is an engineer."

  hi.a1.unit17.lesson01.teach.mein_engineer_hoon_phrase:
    title: "I am an engineer."
    gloss: "I am an engineer."
    note: "The identity pattern applied to this lesson's second new occupation."

  hi.a1.unit17.lesson02.teach.kahan_review:
    title: "Review: where"
    gloss: "where"
    note: "First taught in unit 8 -- reused here to ask about a workplace."
    example_gloss: "Where is the hospital?"

  hi.a1.unit17.lesson02.teach.mein_review:
    title: "Review: in / at"
    gloss: "in / at"
    note: "First taught in unit 1 -- reused here to name a workplace."
    example_gloss: "I live in London."

  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karte_ho_phrase:
    title: "Where do you work? (to a man)"
    gloss: "Where do you work?"
    note: "This lesson's opening question, addressed to a male friend."

  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karti_ho_phrase:
    title: "Where do you work? (to a woman)"
    gloss: "Where do you work?"
    note: "The same question, addressed to a female friend."

  hi.a1.unit17.lesson02.teach.school_review:
    title: "Review: school"
    gloss: "school"
    note: "First taught in unit 8 -- this lesson's first workplace."
    example_gloss: "I work at school (female speaker)."

  hi.a1.unit17.lesson02.teach.mein_school_mein_kaam_karti_hoon_phrase:
    title: "I work at school."
    gloss: "I work at school."
    note: "The workplace pattern applied to school, female form."

  hi.a1.unit17.lesson02.teach.hospital_review:
    title: "Review: hospital"
    gloss: "hospital"
    note: "First taught in unit 8 -- this lesson's second workplace, paired with the doctor occupation."
    example_gloss: "The doctor works at the hospital."

  hi.a1.unit17.lesson02.teach.daftar:
    title: "Office"
    gloss: "office"
    note: "A new noun, this lesson's third workplace, paired with the engineer occupation."
    example_gloss: "I work at the office (male speaker)."

  hi.a1.unit17.lesson02.teach.mein_daftar_mein_kaam_karta_hoon_phrase:
    title: "I work at the office."
    gloss: "I work at the office."
    note: "The workplace pattern applied to the office, male form."

  hi.a1.unit17.lesson02.teach.grammar_workplace:
    title: "Place + mein + kaam karta/karti hoon"
    gloss: "'[Place] + mein + kaam karta/karti hoon' combines three already-known pieces: 'mein' (unit 1, 'London mein rehta hoon'), 'kaam' (unit 10/11), and 'karna's -ta/-ti/-te form (unit 10's 'nashta karta hoon', and unit 1's 'kya tum yog karti ho?'). This isn't new grammar -- it's the three pieces combined into one sentence for the first time."
    note: "Names each already-taught piece by unit number before combining them, matching the disclosure style of every prior grammar note."

  hi.a1.unit17.lesson03.teach.roz_review:
    title: "Review: every day"
    gloss: "every day"
    note: "First taught in unit 10 -- reused here to describe a daily work routine."
    example_gloss: "I work every day."

  hi.a1.unit17.lesson03.teach.jaana_forms_review:
    title: "Review: go (you, female / you, male / I, male)"
    gloss: "go (you, female informal), go (you, male informal), go (I, male)"
    note: "The already-taught -ta/-ti/-te forms of *jana* (to go), first declared in unit 10, reused here for the daily commute to work."
    example_gloss:
      - "I go to school every day (female speaker)."
      - "Do you go to the office every day? (to a man)"

  hi.a1.unit17.lesson03.teach.bhi_haan_review:
    title: "Review: also, yes"
    gloss: "also, yes"
    note: "Both already taught (unit 1 and unit 1/6/13) -- reused in this lesson's dialogue."
    example_gloss: "Yes, I liked that too."

  hi.a1.unit17.lesson03.teach.dialogue.line01:
    title: "Arjun asks Priya about her job"
    gloss: "Priya, what work do you do?"
  hi.a1.unit17.lesson03.teach.dialogue.line02:
    title: "Priya says she is a teacher at a school"
    gloss: "I am a teacher. I work at a school."
  hi.a1.unit17.lesson03.teach.dialogue.line03:
    title: "Arjun asks if she goes to school every day"
    gloss: "Nice! Do you go to school every day?"
  hi.a1.unit17.lesson03.teach.dialogue.line04:
    title: "Priya confirms and asks Arjun the same question"
    gloss: "Yes, I go to school every day. What work do you do?"
  hi.a1.unit17.lesson03.teach.dialogue.line05:
    title: "Arjun says he is an engineer at an office"
    gloss: "I am an engineer. I work at an office."
  hi.a1.unit17.lesson03.teach.dialogue.line06:
    title: "Priya asks if he also goes to the office every day"
    gloss: "Very nice! Do you also go to the office every day?"
  hi.a1.unit17.lesson03.teach.dialogue.line07:
    title: "Arjun confirms"
    gloss: "Yes, I go to the office every day."
  hi.a1.unit17.lesson03.teach.dialogue.line08:
    title: "Priya thanks him"
    gloss: "OK, thanks."

  hi.a1.unit17.lesson03.teach.grammar_summary:
    title: "Three main rules"
    gloss: "This unit's three main rules: (1) 'mein + occupation + hoon' states a job (e.g. 'mein shikshika hoon'), and some occupations change with the speaker's own gender; (2) '[place] + mein + kaam karta/karti hoon' states a workplace (e.g. 'mein daftar mein kaam karta hoon'); (3) 'roz [place] jata/jati hoon' states a daily habit, the same -ta/-ti rule from unit 10."
    note: "A closing summary tying the whole unit's grammar together, mirroring unit 15/16's own paradigm-tying grammar note."

  hi.a1.unit17.lesson03.teach.work_profile_reading:
    title: "Reading a short profile"
    gloss: "Priya is a teacher. She works at a school. Arjun is an engineer. He works at an office."
    note: "A short, direct profile (no new narrative framing) restating exactly the facts already established in the dialogue, no new claims -- directly serves this outcome's own 'read a short work profile' requirement."
    glosses:
      शिक्षिका: "teacher (female)"
      स्कूल: "school"
      काम: "work"
      करती: "does / works (feminine, from करना)"
      इंजीनियर: "engineer"
      दफ़्तर: "office"
      करता: "does / works (masculine, from करना)"

