  hi.a1.unit51.lesson06.exercise01.listen_kya_vah_kapron:
    instruction: Listen and choose what Priya asks.
    correct_option: Hey Nina, is that laundry basket heavy?
    distractors:
    - Hey Nina, did you buy a new scooter?
    - Hey Nina, are you going to the pharmacy?
    - Hey Nina, do you need help with your bag?
    accepted_answers:
    - value: Hey Nina, is that laundry basket heavy?
      status: correct
    feedback: Priya says *अरे नीना, क्या वह कपड़ों की टोकरी भारी है?* *कपड़े* becomes *कपड़ों* before *की*, and *की* agrees with feminine *टोकरी*.
  hi.a1.unit51.lesson06.exercise02.comprehend_main_apne_kapre:
    instruction: Listen to the dialogue and choose what Nina is doing at the launderette.
    correct_option: Picking up her laundry.
    distractors:
    - Buying a new laundry basket.
    - Meeting Sonia for coffee.
    - She doesn't say.
    accepted_answers:
    - value: Picking up her laundry.
      status: correct
    feedback: Nina says *हाँ, मैं अपने कपड़े लेने आई हूँ।* *आई* is feminine because Nina is a woman; *लेने आना* is "to come to pick up".
  hi.a1.unit51.lesson06.exercise03.comprehend_budhvar_ko_sath:
    instruction: Listen to the dialogue and choose what Priya suggests.
    correct_option: Going to the launderette together on Wednesday.
    distractors:
    - Watching a film together.
    - Going to the scooter showroom together.
    - She doesn't suggest anything.
    accepted_answers:
    - value: Going to the launderette together on Wednesday.
      status: correct
    feedback: Priya says *बुधवार को साथ चलें?* *को* after a weekday means "on", and *चलें* is the "shall we" form.
