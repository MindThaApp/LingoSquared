teaching:
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson01.teach.jagahen:
    title: Places
    gloss: Jaipur / Goa / mountain / sea
    note: Names of cities do not change. *पहाड़ों पर* means 'in the mountains'.
    example_gloss:
    - Priya has been to Jaipur.
    - Arjun has been to Goa.
    - They have been to the mountains.
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson01.teach.kitni_baar:
    title: How many times
    gloss: once / twice / several times
    note: '*बार* means ''time, occasion''. It comes after the number.'
    example_gloss:
    - I have been to Jaipur once.
    - Priya has been to Goa twice.
    - Arjun has been to the mountains several times.
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson01.teach.gn_gaya_hoon:
    title: I have been
    gloss: I have been (man). I have been (woman). He has been. She has been. They have been.
    note: 'The present perfect is the past participle plus *हूँ / है / हैं*. For *जाना* there is no *ने*, so both parts follow the doer: *गया हूँ* (man), *गई हूँ* (woman), *गया है / गई है*, and *गए हैं* for several people.'
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson01.teach.gn_kal_gaya:
    title: A time or an experience
    gloss: Arjun went to Jaipur yesterday. Arjun has been to Jaipur.
    note: 'A definite time (*कल*) takes the simple past *गया*. When you speak of an experience in life, add the helper: *गया है*.'
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson02.teach.anubhav:
    title: Experiences
    gloss: Taj Mahal / camel ride / momos / film
    note: '*सवारी करना* = to ride. *मोमोज़* is plural, masculine.'
    example_gloss:
    - I have seen the Taj Mahal.
    - Priya has ridden a camel.
    - Arjun has eaten momos.
    - You have seen this film.
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson02.teach.pronoun_ne:
    title: Pronouns with ने
    gloss: I / you / he, she / we / they
    note: These pronouns already contain *ने*. Do not add another one.
    example_gloss:
    - I have seen the film.
    - You have seen the film.
    - He or she has seen the film.
    - We have seen the film.
    - They have seen the film.
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson02.teach.gn_ne_hai:
    title: ने + the helper
    gloss: I have seen the sea. I have seen a film. I have eaten momos.
    note: 'With *ने* the participle and the helper follow the OBJECT: *समुद्र* is masculine singular (*देखा है*), *फ़िल्म* is feminine singular (*देखी है*), *मोमोज़* is masculine plural (*खाए हैं*).'
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson02.teach.gn_gaya_vs_dekha:
    title: Two patterns
    gloss: She has been to Jaipur. She has seen Jaipur.
    note: 'Remember the split: *जाना* has no *ने* and agrees with the doer; *देखना* has *ने* and agrees with the object.'
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson03.teach.kabhi_shabd:
    title: Ever and never
    gloss: ever / never / first time
    note: '*कभी* in a question means ''ever''. *कभी ... नहीं* means ''never''. *पहली बार* = the first time.'
    example_gloss:
    - Have you ever been to Jaipur?
    - I have never been to Goa.
    - I have been to Goa for the first time.
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson03.teach.gn_kya_tum_kabhi:
    title: Have you ever been
    gloss: Priya, have you ever been to Goa? Arjun, have you ever been to Goa?
    note: With *तुम* the helper is *हो*. A woman is asked *गई हो*, a man *गए हो*.
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson03.teach.gn_kabhi_nahin:
    title: Never
    gloss: I have never been to Goa. I have never ridden a camel.
    note: 'Put *कभी नहीं* before the verb. The helper *हूँ / है* may be kept or dropped in speech: *मैं कभी गोवा नहीं गया* is also normal.'
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson03.teach.gn_chhote_uttar:
    title: Short answers
    gloss: Yes, once. No, never.
    note: 'In speech a short answer is enough: *हाँ, एक बार* or *नहीं, कभी नहीं*.'
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson04.teach.pahle_hi:
    title: Already, yet, so far
    gloss: already / until now, yet / so far / to book a ticket
    note: '*पहले ही* = ''already''. *अभी तक ... नहीं* = ''not yet''. *अब तक* = ''so far''.'
    example_gloss:
    - I have already booked the ticket.
    - Priya has not booked the ticket yet.
    - So far I have been to Jaipur twice.
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson04.teach.gn_pahle_hi:
    title: Already
    gloss: I have already booked the ticket. Priya has already eaten.
    note: '*पहले ही* goes before the object or the verb. The sentence is an ordinary present perfect.'
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson04.teach.gn_abhi_tak:
    title: Not yet
    gloss: Priya has not booked the ticket yet. I have not been to Jaipur yet.
    note: '*अभी तक* goes at the start or before *नहीं*. Use the present perfect, the same as for an experience in life.'
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson04.teach.gn_ab_tak:
    title: So far
    gloss: Have you booked the ticket yet? So far I have been to Jaipur twice.
    note: '*अब तक* looks at the whole time up to now and it needs the present perfect.'
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson05.teach.padhne_shabd:
    title: Words for the message
    gloss: so far / several places / only
    note: '*सिर्फ़* = only. *जगह* is feminine, so *कई जगह* (several places).'
    example_gloss:
    - So far I have been to several places.
    - I have only seen the Taj Mahal.
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson05.teach.padho_soochi:
    title: Priya writes her list
    gloss: Hi Arjun! So far I have been to several places. I have been to Jaipur once and I rode a camel there. I have seen the sea, but I have never been to the mountains. I have not booked the ticket yet. You tell me, have you ever been to Jaipur? Priya
    note: 'Notice the three patterns: *गई हूँ* (no ने), *देखा है / की है* (ने) and *नहीं ... है* for what has not happened.'
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson06.teach.d1:
    title: Arjun asks
    gloss: 'Arjun: Priya, have you ever been to Jaipur?'
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson06.teach.d2:
    title: Priya answers
    gloss: 'Priya: Yes, I have been to Jaipur once. And you?'
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson06.teach.d3:
    title: Arjun has not
    gloss: 'Arjun: I have never been to Jaipur. I have only seen the Taj Mahal.'
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson06.teach.d4:
    title: Priya asks
    gloss: 'Priya: Have you ever ridden a camel?'
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson06.teach.d5:
    title: Arjun replies
    gloss: 'Arjun: No, never. Have you?'
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson06.teach.d6:
    title: Priya suggests
    gloss: 'Priya: Yes! I rode a camel in Jaipur. Come on, let''s go next month!'
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson06.teach.d7:
    title: Arjun agrees
    gloss: 'Arjun: Okay! I''ll book the tickets today.'
