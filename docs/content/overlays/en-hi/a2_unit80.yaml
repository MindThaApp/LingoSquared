  notes: 'English overlay written from the realization. Drafted by drafting tool A. Grammar: present perfect (गया हूँ / गई हूँ / गए हैं; with ने: देखा है, देखी है, खाए हैं), कभी and कभी नहीं, एक बार / दो बार / पहली बार, पहले ही, अभी तक, अब तक. The helper है/हैं in ने-sentences agrees with the object, as the participle does. Canon: Priya and Arjun are friends using tum; Priya has been to Jaipur and Arjun has not (invented for this unit only). OPEN NATIVE QUESTIONS: (1) is मैं कभी जयपुर नहीं गया (without हूँ) the preferred spoken negative? (2) ऊँट की सवारी की है vs ऊँट की सवारी करी है; (3) मोमोज़ spelling.'
answer_policy:
  punctuation: Hindi text is shown with the danda as the sentence-final mark. In typed answers, accept the danda, a plain period, or the mark omitted entirely as equivalent. Question marks may likewise be omitted.
  gender_agreement: Where the speaker or addressee is a named man or woman, the verb must agree with that person. Where the speaker is just 'I' (gender unspecified), both the masculine and the feminine form are accepted. Wrong agreement with a named person is a real grammar error, not a typo.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation.
course:
  title: Hindi A2
  description: Intermediate Hindi continuing the Priya and Arjun storyline, now with a grammar-led block on talking about the past.
units:
  hi.a2.unit80.kya_tum_kabhi_gaye:
    title: Have You Ever Been?
    description: Ask and say what you have and have never done, and whether you have already done something or not yet.
lessons:
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson01.main_gaya_hoon:
    title: I Have Been
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson02.mainne_dekha_hai:
    title: I Have Seen
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson03.kya_kabhi:
    title: Ever?
  hi.a2.unit80.kya_tum_kabhi_gaye.lesson04.pahle_hi_abhi_tak:
