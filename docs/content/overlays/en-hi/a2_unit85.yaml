teaching:
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson01.teach.kafe_shabd:
    title: Café words
    gloss: please / just, a little / tea / water / menu
    note: '*कृपया* is a formal ''please''. *ज़रा* is a soft word that makes a request lighter.'
    example_gloss:
    - Please give tea.
    - Please bring some water.
    - Please give the menu.
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson01.teach.gn_ie:
    title: The polite request in -इए
    gloss: Give tea. Bring water. Sit here. Tell the name.
    note: 'For someone you address as *आप*, drop *-ना* from the verb and add *-इए*: *लाना → लाइए*, *बैठना → बैठिए*, *बताना → बताइए*. Three verbs are irregular: *देना → दीजिए*, *लेना → लीजिए*, *करना → कीजिए*.'
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson01.teach.gn_kripya_zara:
    title: Softening words
    gloss: Please give tea. Please bring a little water.
    note: Add *कृपया* or *ज़रा* before the request to make it softer. *ज़रा* is common in speech.
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson02.teach.dhire_shabd:
    title: Words for asking again
    gloss: slowly / again / to speak / to tell / door
    note: A question with *सकना* is the softest way to ask for something.
    example_gloss:
    - Could you speak slowly?
    - Could you tell me again?
    - Could you open the door? (to a woman)
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson02.teach.gn_kya_aap:
    title: Could you ...?
    gloss: Could you give water? Could you open the door? (to a woman)
    note: '*क्या आप* + verb stem + *सकते हैं* (to a man) or *सकती हैं* (to a woman). The stem of *देना* is *दे*.'
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson02.teach.gn_do_tarike:
    title: Order or question
    gloss: Give water. Could you give water?
    note: Both are polite. The question sounds even softer, because the other person can say yes or no.
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson02.teach.gn_zaroor:
    title: Saying yes
    gloss: Could you open the door? Yes, certainly.
    note: '*जी, ज़रूर* is a warm ''yes, of course''.'
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson03.teach.madad_shabd:
    title: Words for offers
    gloss: help / bag / to lift / thank you / fine, OK
    note: '*आपकी मदद* = your help. *मदद* is feminine, so *आपकी*.'
    example_gloss:
    - May I help you? (man)
    - May I lift your bag? (woman)
    - Yes, thank you.
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson03.teach.gn_main_aapki:
    title: Offering with सकना
    gloss: May I help you? May I lift your bag?
    note: To offer help use *क्या मैं ... सकता / सकती हूँ?* *आपकी* goes with feminine nouns (*मदद*), *आपका* with masculine nouns (*बैग*).
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson03.teach.gn_lenge:
    title: Offering food or drink
    gloss: Will you have tea? Yes, please. No, thank you.
    note: 'For food and drink the offer uses the future with *आप*: *लेंगे*. Accept with *जी हाँ, कृपया*. Decline with *जी नहीं, धन्यवाद*.'
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson04.teach.dost_shabd:
    title: Who you ask
    gloss: friend / waiter / son, dear (to a younger person)
    note: Use *आप* forms with strangers and elders. Use *तुम* forms with close friends.
    example_gloss:
    - Waiter, please bring water.
    - Arjun, bring some water.
    - Son, sit here.
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson04.teach.gn_tum_aadesh:
    title: Requests to a friend
    gloss: Give water. Bring tea. Sit here.
    note: 'For *तुम*, drop *-ना* and add *-ओ*: *देना → दो*, *लाना → लाओ*, *बैठना → बैठो*. Use these with close friends and younger people.'
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson04.teach.gn_tum_aap:
    title: Same request, two forms
    gloss: Arjun, bring water. Waiter, bring water.
    note: 'Choose the form by the person you are speaking to: *तुम* form for a friend, *-इए* form for the waiter.'
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson05.teach.padhne_shabd:
    title: Words for the note
    gloss: aunty (an elder woman) / market / to tell
    note: '*आंटी* is a polite way to address an older woman you know.'
    example_gloss:
    - Hello, Aunty.
    - Tomorrow I will go to the market.
    - Please tell me what to bring.
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson05.teach.padho_sandesh:
    title: Arjun writes to a neighbour
    gloss: Sharma Aunty, hello. Tomorrow I will go to the market. May I help you? Please tell me what to bring. Arjun
    note: Find the offer of help and the polite request.
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson06.teach.d1:
    title: Arjun offers
    gloss: 'Arjun: Hello, Aunty. May I help you?'
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson06.teach.d2:
    title: Aunty asks
    gloss: 'Aunty: Yes, son. Could you bring milk from the market?'
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson06.teach.d3:
    title: Arjun agrees
    gloss: 'Arjun: Yes, certainly. Anything else?'
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson06.teach.d4:
    title: Aunty answers
    gloss: 'Aunty: Just milk, thank you.'
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson06.teach.d5:
    title: Arjun asks politely
    gloss: 'Arjun: All right. Please give me the money.'
  hi.a2.unit85.kya_aap_madad_kar_sakte.lesson06.teach.d6:
    title: Aunty hands over the money
    gloss: 'Aunty: Here you are, son. Thank you.'
