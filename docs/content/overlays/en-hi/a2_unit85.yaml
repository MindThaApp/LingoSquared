  notes: 'English overlay written from the realization. Drafted by Claude Sonnet. Grammar: polite imperative in -इए (दीजिए, लाइए, बैठिए, बताइए), कृपया and ज़रा, क्या आप ... सकते हैं? for requests, क्या मैं आपकी मदद कर सकता हूँ? and क्या आप चाय लेंगे? for offers, जी हाँ, कृपया / जी नहीं, धन्यवाद for accepting and declining, tum imperatives (दो, लाओ, बैठो). Elder neighbour Sharma Aunty uses tum with Arjun and he uses aap with her. OPEN NATIVE QUESTIONS: (1) is ''ज़रा पानी लाइए'' natural as a request to a waiter; (2) is ''हाँ बेटा'' fine from an elder neighbour; (3) is ''ये लो बेटा'' the right register for her.'
answer_policy:
  punctuation: Hindi text is shown with the danda as the sentence-final mark. In typed answers, accept the danda, a plain period, or the mark omitted entirely as equivalent. Question marks may likewise be omitted.
  gender_agreement: Where the speaker or addressee is a named man or woman, the verb must agree with that person. Where the speaker is just 'I' (gender unspecified), both the masculine and the feminine form are accepted. Wrong agreement with a named person is a real grammar error, not a typo.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation.
course:
  title: Hindi A2
  description: Intermediate Hindi continuing the Priya and Arjun storyline, now with grammar-led units on predictions, rules, ability, requests, advice and habits.
units:
  hi.a2.unit85.kya_aap_madad_kar_sakte:
    title: Could You Help Me?
    description: Make a polite request, offer help, and accept or decline an offer or request politely.
