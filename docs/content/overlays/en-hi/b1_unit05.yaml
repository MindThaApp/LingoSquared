  hi.b1.unit05.lesson02.teach.grammar_ho_gaya:
    title: "Ho gaya's second meaning"
    gloss: "\"Gaya/gai\" here doesn't mean \"went\" (unit 12's meaning) -- in \"ho gaya/gai\" it's a completive helper verb, meaning \"has become / has happened.\" \"Project pura ho gaya hai\" means \"the project has become complete.\" This is another genuine second use of a word you already know, like \"dekhna.\""
