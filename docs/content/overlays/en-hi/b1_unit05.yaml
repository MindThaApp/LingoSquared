  hi.b1.unit05.lesson03.teach.grammar_summary:
    title: "The full pattern"
    gloss: "This unit's three main rules: (1) 'zimmedari' and 'kaam dekhna' describe a responsibility. (2) 'chal raha hai' (in progress), 'pura/puri ho gaya/gai hai' (complete), 'der ho rahi hai' (delayed) give a status update. (3) 'kya aap meri madad kar sakte hain?' asks a colleague for help."
