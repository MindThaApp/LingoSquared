  hi.b1.unit05.lesson02.teach.raha_rahi_rahe:
    title: "Continuous marker (masc./fem./pl.)"
    gloss: "continuous marker: masc./fem./pl."
    example_gloss:
      - "The work is in progress."
      - "The report is running late."
  hi.b1.unit05.lesson02.teach.grammar_continuous:
    title: "The continuous construction"
    gloss: "To describe an action happening right now, add 'raha' (masc.)/'rahi' (fem.)/'rahe' (pl.) to the verb stem, then 'hai'/'hain' -- \"chal raha hai\" means \"is going on / in progress.\" This construction is new in this unit."
  hi.b1.unit05.lesson02.teach.kaam_chal_raha_hai_phrase:
    title: "The work is in progress"
    gloss: "The work is in progress."
  hi.b1.unit05.lesson02.teach.pura_puri_review:
    title: "Complete (masc./fem.)"
    gloss: "complete (masc./fem.)"
    example_gloss:
      - "The project is complete."
      - "The report is complete."
  hi.b1.unit05.lesson02.teach.gaya_gai_review:
    title: "Review: became/went (masc./fem.)"
    gloss: "became / went (masc./fem.)"
    note: "First taught (as \"went\") in A1."
