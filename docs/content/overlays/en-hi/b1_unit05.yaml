review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    Fifth en-hi B1 overlay, written for hi/b1_unit05_zimmedariyan.yaml -- see
    that file's own generation_provenance/review notes for the full account
    (ज़िम्मेदारी/प्रोजेक्ट/टीम + देखना's dual "look after" sense, the new
    -रहा/रही/रहे continuous construction applied to in-progress/complete/
    delayed status updates, and सकते-based help-asking with a colleague). No
    sibling-direction overlay (hi-en) exists yet, so §8 doesn't apply. Not
    yet reviewed -- status left honestly as unreviewed.

    Asterisk convention (§15): every inline romanized-Hindi word inside a
    `note`/`gloss` field below is wrapped in single asterisks.

answer_policy:
  dekhna_dual_use: >-
    *Dekhna* usually means "to see/watch" but in "*team ka kaam dekhta
    hoon*" it means "to look after / be in charge of" -- a genuine second
    sense of the same verb, not a mistake.
  continuous_aspect: >-
    "*-raha/rahi/rahe hai/hain*" marks an action in progress right now
    ("*chal raha hai*" -- is going on / in progress). Don't accept a bare
    habitual-present form (e.g. *chalta hai* without *raha*) as equivalent
    where the exercise specifically targets the continuous.
  ho_gaya_dual_use: >-
    *Gaya/gai* in "*ho gaya/gai hai*" is a completive light verb ("has
    become/happened"), distinct from its literal "went" sense taught
    earlier in the course.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question marks
    (?) may likewise be omitted, but the fully punctuated form remains the
    model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

