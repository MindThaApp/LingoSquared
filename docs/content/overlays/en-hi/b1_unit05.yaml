      - "My name is Priya."
  hi.b1.unit05.lesson01.teach.grammar_dekhna:
    title: "Dekhna's second meaning"
    gloss: "\"Dekhna\" usually means \"to see/watch\" (as in \"film dekhte hain\"), but here it means \"to take responsibility for / look after\" -- \"team ka kaam dekhna\" means \"to be in charge of / look after the team's work.\" These are two genuine, common uses of the same word -- just like *se* (from/with) or *kya* (what / yes-no marker)."
  hi.b1.unit05.lesson01.teach.yah_review:
    title: "Review: this"
    gloss: "this"
    example_gloss: "This is my book."
  hi.b1.unit05.lesson01.teach.meri_zimmedari_phrase:
