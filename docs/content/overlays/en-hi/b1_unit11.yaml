  notes: >-
    Eleventh en-hi B1 overlay, written for hi/b1_unit11_saransh.yaml --
    see that file's own generation_provenance/review notes for the full
    account of the three summarizing tools ("mukhya baat yah hai ki" for
    the main point, "sabse pehle...phir...aakhir mein" for ordered
    retelling, "sankshep mein" for a condensed summary) and why every
    production exercise here gives the exact English content to render
    rather than asking for an open-ended original summary. No sibling-
    direction overlay (hi-en) exists yet, so §8 doesn't apply.

    Asterisk convention (§15): every inline romanized-Hindi word inside a
    `note`/`gloss` field below is wrapped in single asterisks.

    Not yet fresh-context reviewed -- status left honestly as unreviewed.

answer_policy:
  mukhya_baat: >-
    "*Mukhya baat yah hai ki*..." ("the main point is that...") pulls
    the single most important point out of a longer statement. It is a
    fixed discourse marker with no gender agreement at all.
  sabse_pehle_phir: >-
    "*Sabse pehle*...*phir*...*aakhir mein*..." ("first...then...
    finally...") retells a sequence of events in their correct order.
    Arjun's own model sentence uses *utha* (masculine, his own
    established gender) and *kiya* (agreeing with the masculine object
    *naashta*, "breakfast") -- neither is a first-person gender-agreeing
    form that would need a feminine variant.
  sankshep_mein: >-
    "*Sankshep mein*..." ("in short/to summarize") condenses a longer
    passage into its main points, dropping incidental detail (here, the
    exact weather) while keeping what matters (that Priya met her
    parents and had a good time despite the delay).
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Internal
    commas separating clauses may also be replaced by " and " (और) or
    omitted with a space where noted per exercise.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

