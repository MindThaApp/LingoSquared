      जाइए: go
      एग्ज़िट: exit (emergency exit)
      मदद: help
      चाहिए: needed / wanted
      फ़ोन: phone (to call)
      ब्रिगेड: brigade (fire brigade)
      सब: all (everyone)
      बाहर: outside
