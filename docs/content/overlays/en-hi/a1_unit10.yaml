answer_policy:
  gender_agreement: >-
    This unit's central grammar point (habitual present, verb stem +
    -ता/-ती/-ते + हूँ/हो/है/हैं) is grammatically gendered by the
    subject. For any exercise where the subject is a NAMED character with
    an established gender (Arjun: masculine: Priya: feminine),
    `accepted_answers` contains only that character's single correct
    gendered form. For any exercise where the subject is the LEARNER
    themselves (a self-description prompt phrased with "तुम"/"अपनी"),
    `accepted_answers` deliberately includes BOTH the masculine and the
    feminine conjugated forms as equally correct -- the app has no signal
    of the learner's own gender, and marking only one form correct would
    wrongly fail roughly half of all learners regardless of which
    gendered form the exercise happened to be authored around first.
  nasalization_marks: >-
    Display and teach the correct chandrabindu/anusvara distinction. This
    unit introduces no new nasalized vocabulary at all -- the only
    nasalized form used anywhere in this unit is हूँ, reused unchanged
    from its already-settled unit01 spelling. In typed A1 answers, accept
    a variant that drops a nasalization mark entirely or substitutes
    anusvara for chandrabindu (or vice versa) when every other character
    is correct. Do not extend this tolerance to a wrong vowel or
    consonant, which changes the actual word.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question
    marks (?), exclamation marks, and commas may likewise be omitted,
    but the fully punctuated form remains the model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation, nasalization marks, or (for self-description prompts)
    which grammatically correct gendered form the learner produces.

course:
  title: "Hindi A1"

units:
  hi.a1.unit10.routines:
    title: "Daily routine"

lessons:
  hi.a1.unit10.lesson01.uthna_nashta_kaam:
    title: "Get up, breakfast, go to work"
  hi.a1.unit10.lesson02.tum_kab_uthte_ho:
    title: "When do you get up?"
  hi.a1.unit10.lesson03.priya_arjun_dincharya:
    title: "Priya and Arjun: daily routine"

teaching:
  hi.a1.unit10.lesson01.teach.review_time:
    title: "Review: o'clock, morning, afternoon, evening, night, at"
    gloss: "o'clock, morning, afternoon, evening, night, at (general time)"
    note: "A quick review of the time words from unit 4 -- this unit reuses them heavily."
    example_gloss:
      - "It's 8 in the morning now."
      - "There's no class at night."

  hi.a1.unit10.lesson01.teach.uthna:
    title: "I get up"
    gloss: "I get up (male / female speaker)"
    note: "The first habitual-present verb of this unit -- extends the -ta/-tee pattern first seen in unit 5 (rahta hai/rahtee hai) to the first person, with hoon."
    example_gloss:
      - "I get up at 7 in the morning."
      - "I get up at 6 in the morning."

  hi.a1.unit10.lesson01.teach.roz:
    title: "Every day"
    gloss: "every day"
    note: "A new adverb for describing routines."
    example_gloss: "I get up in the morning every day."

  hi.a1.unit10.lesson01.teach.nashta_karna:
    title: "I have breakfast"
    gloss: "I have breakfast (male / female speaker)"
    note: "'Nashta' (breakfast) combines with 'karta/kartee hoon' (I do)."
    example_gloss:
      - "In the morning I have breakfast."
      - "In the morning I have breakfast."

  hi.a1.unit10.lesson01.teach.kaam_par_jaana:
    title: "I go to work"
    gloss: "I go to work (male / female speaker)"
    note: "'Kaam par jaana' (go to work) needs the word 'par' (on/at) -- a fixed expression, unlike 'school jaana' later this unit, which needs no extra word."
    example_gloss:
      - "Then I go to work."
      - "Then I go to work."

  hi.a1.unit10.lesson01.teach.habitual_paradigm_note:
    title: "The habitual-present pattern"
    gloss: "To describe a daily habit, the verb takes -ta/-tee/-te, and hoon/ho/hai/hain is added depending on the subject: I get up (male/female) 'hoon', you get up 'ho', he/she gets up 'hai', they get up 'hain'."
    note: "States the whole pattern up front (already glimpsed incidentally back in unit 1's own dialogue, and formalized for third person in unit 5) so this lesson's own exercises aren't asking the learner to guess an untaught form."

  hi.a1.unit10.lesson01.teach.full_routine_phrase:
    title: "My morning, step by step"
    gloss: "I get up at 7 every morning, then I have breakfast, then I go to work."
    note: "Combines this lesson's three routine verbs into one natural sequenced sentence."

  hi.a1.unit10.lesson02.teach.sona:
    title: "I sleep"
    gloss: "I sleep (male / female speaker)"
    note: "The same -ta/-tee + hoon pattern applied to a new verb."
    example_gloss:
      - "I sleep at 11 at night."
      - "I sleep at 10 at night."

  hi.a1.unit10.lesson02.teach.school_jaana:
    title: "I go to school"
    gloss: "I go to school (male / female speaker)"
    note: "Unlike 'kaam par jaana', 'school jaana' needs no extra word before 'jaana'."
    example_gloss:
      - "I go to school at 8 every morning."
      - "I go to school at 8 every morning."

  hi.a1.unit10.lesson02.teach.tum_form_note:
    title: "The tum-form: -te/-tee + ho"
    gloss: "With 'tum' (you, informal), the verb takes -te/-tee and 'ho': you get up (asking a man) / you get up (asking a woman), you sleep (asking a man) / you sleep (asking a woman)."
    note: "The second-person slice of the same paradigm introduced in lesson 1."

  hi.a1.unit10.lesson02.teach.addressee_gender_note:
    title: "Whose gender does tum-form agree with?"
    gloss: "The tum-form verb agrees with the gender of the person being asked, not the speaker -- asking Priya: 'When do you get up?' (feminine form); asking Arjun: 'When do you get up?' (masculine form)."
    note: "A genuinely easy-to-miss point, verified against every tum-form line in lesson 3's own dialogue."

  hi.a1.unit10.lesson02.teach.kab_uthte_ho_phrase:
    title: "When do you get up?"
    gloss: "When do you get up? (asking a man)"
    note: "A ready-to-use question using this lesson's new tum-form."

  hi.a1.unit10.lesson02.teach.pahle_phir_routine:
    title: "First I get up, then I have breakfast"
    gloss: "First I get up, then I have breakfast."
    note: "Reuses 'pahle'/'phir' (first/then) from unit 9's direction-sequencing to sequence routine steps instead."

  hi.a1.unit10.lesson02.teach.kaam_idiom_note:
    title: "Kaam par vs. school"
    gloss: "'Kaam par jaana' (go to work) needs 'par', but 'school jaana' (go to school) needs no extra word -- both are correct and common."
    note: "A real idiomatic difference, not one blanket rule with an exception."

  hi.a1.unit10.lesson03.teach.vaapas:
    title: "Back"
    gloss: "back"
    note: "Used with 'aana' (come) for 'come back'."
    example_gloss: "I go back."

  hi.a1.unit10.lesson03.teach.aana:
    title: "I come"
    gloss: "I come (male / female speaker)"
    note: "A new verb, following the same already-established habitual-present pattern."
    example_gloss:
      - "I come back in the evening."
      - "I come back in the evening."

  hi.a1.unit10.lesson03.teach.khana_verb:
    title: "I eat (food)"
    gloss: "I eat food (male / female speaker)"
    note: "'Khana' the noun (food, from unit 6) plus 'khana' the verb (to eat) -- a natural Hindi doubling, not a typo."
    example_gloss:
      - "I eat food at night."
      - "I eat food at night."

  hi.a1.unit10.lesson03.teach.raat_ka_khana:
    title: "Dinner"
    gloss: "dinner (literally: 'night's food')"
    note: "Reuses 'raat' (night), 'ka' (possessive), and 'khana' (food), all already taught."
    example_gloss: "Dinner is very delicious."

  hi.a1.unit10.lesson03.teach.dialogue.line01:
    title: "Arjun asks when Priya gets up"
    gloss: "Arjun asks Priya what time she gets up every day."
    note: "Uses the feminine tum-form, correctly addressing Priya."
  hi.a1.unit10.lesson03.teach.dialogue.line02:
    title: "Priya answers"
    gloss: "Priya says: I get up at 6 every morning. Then I have breakfast."
  hi.a1.unit10.lesson03.teach.dialogue.line03:
    title: "Arjun shares his own routine"
    gloss: "Arjun says: nice! I get up at 7. I also have breakfast, then go to work."
  hi.a1.unit10.lesson03.teach.dialogue.line04:
    title: "Priya asks when Arjun comes back"
    gloss: "Priya asks Arjun when he comes back."
    note: "Uses the masculine tum-form, correctly addressing Arjun. Introduces 'vaapas aana' in context."
  hi.a1.unit10.lesson03.teach.dialogue.line05:
    title: "Arjun describes his evening"
    gloss: "Arjun says: I come back at 6 in the evening. Then I eat dinner, then I sleep."
  hi.a1.unit10.lesson03.teach.dialogue.line06:
    title: "Priya describes her evening"
    gloss: "Priya says: I also come back in the evening, then I eat."
  hi.a1.unit10.lesson03.teach.dialogue.line07:
    title: "Arjun asks when Priya sleeps"
    gloss: "Arjun asks what time Priya sleeps."
    note: "Feminine tum-form again, correctly addressing Priya."
  hi.a1.unit10.lesson03.teach.dialogue.line08:
    title: "Priya answers and closes"
    gloss: "Priya says: I sleep at 11 at night. OK, see you tomorrow!"
  hi.a1.unit10.lesson03.teach.dialogue.line09:
    title: "Arjun closes"
    gloss: "Arjun says: OK, see you again!"

