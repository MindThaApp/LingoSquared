    correct_option: "I get up"
    distractors: ["I sleep", "I eat"]
    accepted_answers: ["उठता हूँ"]

  hi.a1.unit10.lesson01.exercise02.select_nashta_meaning:
    instruction: "What does this word mean?"
    correct_option: "breakfast"
    distractors: ["dinner", "work"]
