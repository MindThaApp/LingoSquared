answer_policy:
  concessive_connector: >-
    "*Haalaanki* [a true but weaker point], *phir bhi* [your real point/
    result]" concedes the other side's point before restating your own
    position -- clearer and stronger than a simple "*lekin*" (but).
  stronger_contrastive: >-
    "*X nahin hai, balki Y hai*" negates a wrongly assumed claim and
    replaces it with the true one. "*Balki*" is stronger than "*lekin*":
    "*lekin*" merely adds a contrast, "*balki*" corrects and replaces the
    prior claim entirely. "*Balki*" always follows a negation (*nahin*).
  debate_dialogue: >-
    Lesson03's exchange models the full outcome: Priya states a position,
    Arjun concedes her point with *haalaanki*...*phir bhi* before
    restating his own, and Priya then uses *balki* to correct an
    overgeneralization and restate a more nuanced position of her own.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Internal
    commas separating clauses may also be replaced by " and " (और) or
    omitted with a space where noted per exercise.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

