teaching:
  hi.a2.unit88.der_se_kyon_aaye.lesson01.teach.shabd_kyonki:
    title: Words for reasons
    gloss: ill / fever / at home / late / bus / because
    note: '*देर से* means late (not on time). *आई* is the feminine past of *आना* because *बस* is feminine.'
    example_gloss:
    - I am at home because I am ill.
    - Priya is at home because she has a fever.
    - Arjun came late because the bus came late.
  hi.a2.unit88.der_se_kyon_aaye.lesson01.teach.gn_kyonki:
    title: Giving a reason with क्योंकि
    gloss: I am at home because I am ill. Arjun came late because the bus came late.
    note: 'Say what happened first, then *क्योंकि* and the reason: *… क्योंकि …*.'
  hi.a2.unit88.der_se_kyon_aaye.lesson01.teach.gn_bukhar:
    title: Having a fever
    gloss: I have a fever. You have a fever. She has a fever.
    note: 'Hindi says to me a fever is: *मुझे / तुम्हें / उसे* + *बुखार है*. There is no word for have here.'
  hi.a2.unit88.der_se_kyon_aaye.lesson02.teach.shabd_isliye:
    title: Words for results
    gloss: so, therefore / arrived / rain / outside / today
    note: '*पहुँचा* is masculine, *पहुँची* feminine: they agree with the person who arrives.'
    example_gloss:
    - I have a fever, so I am at home.
    - The bus was late, so I arrived late.
    - It is rainy today, so I will not go outside. (man speaking)
  hi.a2.unit88.der_se_kyon_aaye.lesson02.teach.gn_isliye:
    title: Giving a result with इसलिए
    gloss: I have a fever, so I am at home. The bus was late, so I arrived late.
    note: 'Say the reason first, then *इसलिए* and the result: *… इसलिए …*.'
  hi.a2.unit88.der_se_kyon_aaye.lesson02.teach.gn_dono:
    title: क्योंकि or इसलिए
    gloss: I am at home because I have a fever. I have a fever, so I am at home.
    note: The meaning is the same. *क्योंकि* is followed by the reason; *इसलिए* is followed by the result.
  hi.a2.unit88.der_se_kyon_aaye.lesson03.teach.shabd_kyon:
    title: Words for asking why
    gloss: why / office / went (fem.) / came (you) / was (masc.) / was (fem.)
    note: '*तुम देर से क्यों आए?* is said to a friend. *था* is masculine, *थी* is feminine.'
    example_gloss:
    - Why did you come late?
    - Why did Priya not go to the office today?
    - Because she was ill.
  hi.a2.unit88.der_se_kyon_aaye.lesson03.teach.gn_kyon_jawab:
    title: Why? Because …
    gloss: Why did you come late? Because the bus was late. Why did Priya not go to the office today? Because she has a fever.
    note: '*क्यों* asks for a reason. The answer can begin with *क्योंकि*.'
  hi.a2.unit88.der_se_kyon_aaye.lesson03.teach.gn_nahin_tha:
    title: A reason for not doing
    gloss: I did not go to the office because I was ill (man). Priya did not go to the office because she was ill.
    note: '*नहीं* comes before the verb, then *क्योंकि* and the reason. *था* and *थी* agree with the person who was ill.'
  hi.a2.unit88.der_se_kyon_aaye.lesson04.teach.shabd_yojana:
    title: Words for plans
    gloss: park / tired / very / we / tomorrow / early
    note: '*थका हुआ* is for a man or a masculine word; *थकी हुई* is for a woman.'
    example_gloss:
    - It is rainy today, so we will not go to the park.
    - We will go to the park tomorrow because it is rainy today.
    - Priya is very tired, so she will sleep early today.
    - I am very tired, so I will sleep early today. (man speaking)
  hi.a2.unit88.der_se_kyon_aaye.lesson04.teach.gn_yojana:
    title: Reasons for a changed plan
    gloss: It is rainy today, so we will not go to the park. We will go to the park tomorrow because it is rainy today.
    note: Both orders work. Use *इसलिए* after the reason, or *क्योंकि* before it.
  hi.a2.unit88.der_se_kyon_aaye.lesson04.teach.gn_thaka:
    title: 'Tired: man or woman'
    gloss: I am tired (man). I am tired (woman). Priya is very tired.
    note: '*थका हुआ* (masculine) changes to *थकी हुई* (feminine). *बहुत* (very) goes before it.'
  hi.a2.unit88.der_se_kyon_aaye.lesson05.teach.shabd_sandesh:
    title: Words for the message
    gloss: also / came / will come (I, fem.) / office
    note: '*भी* goes after the word it adds to: *बारिश भी है*.'
    example_gloss:
    - I did not come to the office today. (woman speaking)
    - It is rainy as well.
    - Tomorrow I will come to the office. (woman speaking)
  hi.a2.unit88.der_se_kyon_aaye.lesson05.teach.padho_sandesh:
    title: Priya writes to Arjun
    gloss: Arjun, I did not come to the office today because I have a fever. It is rainy as well, so I will not go outside. Tomorrow I will come to the office. Priya
    note: Find the reason (*क्योंकि*) and the result (*इसलिए*).
  hi.a2.unit88.der_se_kyon_aaye.lesson06.teach.d1:
    title: Priya asks why
    gloss: 'Priya: Arjun, why did you come late?'
  hi.a2.unit88.der_se_kyon_aaye.lesson06.teach.d2:
    title: Arjun explains
    gloss: 'Arjun: The bus was late, so I arrived late.'
  hi.a2.unit88.der_se_kyon_aaye.lesson06.teach.d3:
    title: Priya asks again
    gloss: 'Priya: Why did you not call?'
  hi.a2.unit88.der_se_kyon_aaye.lesson06.teach.d4:
    title: Arjun gives a reason
    gloss: 'Arjun: Because my phone was switched off.'
  hi.a2.unit88.der_se_kyon_aaye.lesson06.teach.d5:
    title: Priya forgives him
    gloss: 'Priya: No problem. Come on, let us have tea.'
  hi.a2.unit88.der_se_kyon_aaye.lesson06.teach.d6:
    title: Arjun agrees
    gloss: 'Arjun: Yes, let us go. I am very tired.'
