review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  notes: 'English overlay written from the realization. Drafted by Claude Sonnet. Grammar: reason with क्योंकि (reason follows), result with इसलिए (result follows), asking why with क्यों and answering with क्योंकि, मुझे/उसे बुखार है, था/थी, adjective agreement (थका हुआ / थकी हुई). Priya and Arjun use tum. OPEN NATIVE QUESTIONS: (1) is the comma before क्योंकि and इसलिए optional in a beginner text, and is accepting both in typed answers right; (2) is ''बस देर से आई, इसलिए मैं देर से पहुँचा'' the most natural way to give the excuse; (3) is ''मेरा फ़ोन बंद था'' natural for ''my phone was switched off''.'
answer_policy:
  punctuation: Hindi text is shown with the danda as the sentence-final mark. In typed answers, accept the danda, a plain period, or the mark omitted entirely as equivalent. Question marks may likewise be omitted.
  gender_agreement: Where the speaker or addressee is a named man or woman, the verb must agree with that person. Where the speaker is just 'I' (gender unspecified), both the masculine and the feminine form are accepted. Wrong agreement with a named person is a real grammar error, not a typo.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation.
course:
  title: Hindi A2
  description: Intermediate Hindi continuing the Priya and Arjun storyline, now with grammar-led units on reasons, sequencing, purpose, conditions, indirect questions and passing on messages.
units:
  hi.a2.unit88.der_se_kyon_aaye:
    title: Why Were You Late?
    description: Give a reason and a result in one message, such as an excuse or a change of plan, using क्योंकि and इसलिए.
