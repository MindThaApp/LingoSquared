  hi.a2.unit22.lesson02.teach.aapne_dastavez_laaye_phrase:
    title: "I filled out two forms"
    gloss: "I filled out two forms."
    note: "*Bhare* -- the PLURAL ne-ergative agreement form, because the object (*do form*, two forms) is plural. *Form* itself doesn't change in the plural; *do* (two) shows the number. See this lesson's own grammar note."

  hi.a2.unit22.lesson02.teach.grammar_ne_plural:
    title: "Ne-ergative agreement also marks number"
    gloss: "After 'ne', the verb also agrees with the object's NUMBER, not just its gender -- 'maine ek form bhara' (singular object) vs. 'maine do form bhare' (plural object) -- not 'bhara', but 'bhare'. Remember: 'laana' never takes 'ne' (unit 20) -- 'kya aap pehchaan patra laaye?', 'haan, main pehchaan patra laaya.'"
    note: "This unit's central new grammar point, extending unit 20's gender-only rule."

