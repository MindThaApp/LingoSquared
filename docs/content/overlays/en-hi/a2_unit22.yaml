answer_policy:
  ne_ergative_number: >-
    Extends unit 20's *ne*-ergative rule: the past-tense verb agrees with
    the object's NUMBER as well as its gender. *Maine khaata khola* (I
    opened the account, masc. sg.) vs. *kya aapne dastavez laaye?* (Did
    you bring the documents? masc. pl. -- *laaye*, not *laaya*). A typed
    answer using the wrong number-agreement form is marked incorrect as a
    real grammar error, the exact contrast lesson02's own grammar_check
    exercise targets.
  apna_reflexive: >-
    *Apna/apni/apne* ("one's own") agrees with the noun it modifies, not
    the subject -- *khaata* is masculine, so *apna khaata*, never *apni
    khaata*. Reused from unit 20.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question marks
    (?) may likewise be omitted, but the fully punctuated form remains the
    model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

