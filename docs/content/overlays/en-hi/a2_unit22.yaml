    title: "Review: the ne-ergative past tense"
    gloss: "Unit 20's rule again: a transitive verb's past-tense subject takes 'ne', and the verb agrees with the object -- 'maine khaata khola', 'khola' agrees with the masculine singular 'khaata'."
    note: "A refresher before this lesson's own new nuance (number agreement)."

  hi.a2.unit22.lesson02.teach.maine_khaata_khola_phrase:
    title: "I opened the account"
