    Not yet reviewed -- status left honestly as unreviewed.

answer_policy:
  sakna_modal: >-
    *Sakna* ("can / be able to") governs the BARE VERB STEM, not the full
    infinitive -- "*kar sakta hoon*" (I can do), stem *kar* + *sakta*, not
    "*karna sakta hoon*". This is the reverse of *chahiye* (unit 23),
    which governs the full infinitive ("*karna chahiye*"). A typed answer
    that swaps in the infinitive where the bare stem belongs is marked
    incorrect as a real grammar error, the exact contrast this unit's own
    grammar_check exercise targets. This unit only exercises the
    masculine singular form, *sakta* -- the feminine (*sakti*) and plural/
    informal (*sakte*) forms exist (shown once in this unit's own dialogue
    as the interviewer's आप-directed question) but are never required as
    a typed or spoken answer here.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question marks
    (?) may likewise be omitted, but the fully punctuated form remains the
    model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

