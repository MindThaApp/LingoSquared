  hi.a2.unit25.lesson02.teach.grammar_sakna:
    title: "Sakna governs the bare stem"
    gloss: "'Sakna' (can / be able to) governs the verb's bare STEM, not the full infinitive -- 'kar sakta hoon' (stem 'kar'), not 'karna sakta hoon'. This is the reverse of 'chahiye' (unit 23), which governs the full infinitive ('karna chahiye'). 'Sakta' agrees with the subject's gender/number (sakta/sakti/sakte), but this unit only practices the masculine singular 'sakta'."
    note: "This unit's whole reason for existing."

  hi.a2.unit25.lesson02.teach.mein_somvar_ko_shuru_kar_sakta_hoon_phrase:
