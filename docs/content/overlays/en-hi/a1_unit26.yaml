teaching:
  hi.a1.unit26.lesson01.teach.jaiket_svetar:
    title: Coat, sweater
    gloss: the coat, the sweater
    note: '*जैकेट* is feminine and *स्वेटर* is masculine, which you see in the words that go with them: *मेरी जैकेट*, *मेरा स्वेटर*.'
    example_gloss:
    - I am looking for a coat.
    - I have a sweater.
  hi.a1.unit26.lesson01.teach.paint_joote:
    title: Pants, shoes
    gloss: the pants/trousers, the shoes
    note: '*पैंट* is a single word for one pair of trousers (*मेरी पैंट*), and *जूते* is the plural of *जूता*: a masculine noun ending in *-आ* changes to *-ए* in the plural.'
    example_gloss:
    - I am looking for pants.
    - I am looking for shoes.
  hi.a1.unit26.lesson01.teach.main_ek_jaiket:
    title: Saying what you're looking for
    gloss: I am looking for a coat.
    note: 'The verb comes last: *मैं एक जैकेट ढूँढ़ रहा हूँ*. *रहा हूँ* gives the ''am looking'' (happening now) sense, and *रहा* is the masculine form (a woman says *रही*).'
  hi.a1.unit26.lesson02.teach.saiz:
    title: Size
    gloss: the size
    note: '*साइज़* is a masculine noun, so words that go with it are masculine too: *मेरा साइज़*.'
    example_gloss: What size do you wear?
  hi.a1.unit26.lesson02.teach.apka_saiz_kya:
    title: Asking about size
    gloss: What size do you wear?
    note: '*कौन सा* (''which'') asks about one choice from a set, and *सा* agrees with the noun: *कौन सा साइज़*, but *कौन सी जैकेट*. *आप* is the polite ''you'' for a shop assistant.'
  hi.a1.unit26.lesson02.teach.mera_saiz_em:
    title: Stating your size
    gloss: I am a size M.
    note: 'Hindi does not use a verb for ''have'' here: *मेरा साइज़ एम है* is literally ''my size is M'', and *मेरा* agrees with the masculine *साइज़*.'
  hi.a1.unit26.lesson03.teach.kala_neela:
    title: Black, blue
    gloss: black, blue
    note: The two base color adjectives in this lesson.
    example_gloss:
    - I want the coat in black.
    - Do you also have this in blue?
  hi.a1.unit26.lesson03.teach.mujhe_vah_jaiket:
    title: Requesting a color
    gloss: I want the coat in black.
    note: '*मुझे ... चाहिए* is how Hindi says ''I want'': the wish happens ''to me'' (*मुझे*), and the thing wanted comes right before *चाहिए*.'
  hi.a1.unit26.lesson03.teach.kya_apke_pas:
    title: Asking about another color
    gloss: Do you also have this in blue?
    note: '*आपके पास ... है?* (''with you ... is?'') is the polite way to ask ''do you have ...?'', and *भी* (''also'') follows the word it adds to.'
  hi.a1.unit26.lesson04.teach.kya_yah_jaiket:
    title: Asking about fit
    gloss: Does this coat fit?
    note: 'Hindi says clothes ''come right'': *ठीक आती है*. The verb agrees with the thing, so a feminine *जैकेट* gives *आती*, and a masculine *स्वेटर* would give *आता*.'
  hi.a1.unit26.lesson04.teach.yah_ekdam_theek:
    title: Confirming a good fit
    gloss: It fits well.
    note: '*एकदम* (''completely'') makes it ''fits perfectly''; *आती है* agrees with the feminine *जैकेट*.'
  hi.a1.unit26.lesson04.teach.yah_bahut_chhotee:
    title: Too small
    gloss: It is too small.
    note: '*बहुत* goes before the adjective and here gives the ''too'' sense: *बहुत छोटी*. The adjective agrees with the feminine *जैकेट*.'
  hi.a1.unit26.lesson04.teach.yah_bahut_baree:
    title: Too big
    gloss: It is too big.
    note: 'Same pattern with *बड़ी*: *बड़ा* changes to *बड़ी* for a feminine noun, so *बहुत बड़ी*.'
  hi.a1.unit26.lesson05.teach.nabbe:
    title: Nine hundred
    gloss: nine hundred
    note: '*नौ सौ* is the number 900, used in the jacket''s price.'
    example_gloss: The coat costs nine hundred rupees.
  hi.a1.unit26.lesson05.teach.jaiket_kee_keemat:
    title: Stating a price
    gloss: The coat costs nine hundred rupees.
    note: 'Hindi says ''the price of the jacket is ...'': *जैकेट की कीमत नौ सौ रुपये है*. *की* agrees with the feminine *कीमत*, not with *जैकेट*.'
  hi.a1.unit26.lesson05.teach.sardee_kee_jaiket:
    title: Read a store receipt
    gloss: 'Winter coat: size M, color black. Price: nine hundred rupees. This coat fits well and is warm.'
    note: Track the size, color, price, and the two qualities mentioned about the coat.
    glosses:
      सर्दी: winter (jacket)
      साइज़: size
      रंग: color
      काला: black
      कीमत: price
      नौ: nine
      सौ: hundred
      रुपये: rupees
      जैकेट: coat
      आती: fits
      गर्म: warm
  hi.a1.unit26.lesson06.teach.priya_yah_jaiket:
    title: Priya notices the coat
    gloss: 'Priya: This coat is nice! What size are you?'
    note: '*अच्छी* agrees with the feminine *जैकेट*. *तुम्हारा* is the informal ''your'', used between friends.'
  hi.a1.unit26.lesson06.teach.arjun_mera_saiz:
    title: Arjun asks to try it on
    gloss: 'Arjun: I am a size M. May I try it on?'
    note: '*पहनकर देखना* (''to wear and see'') is how Hindi says ''try on''. *सकता हूँ* means ''can'' or ''may'', and a woman says *सकती हूँ*.'
  hi.a1.unit26.lesson06.teach.priya_zaroor_kya:
    title: Priya asks about the fit
    gloss: 'Priya: Of course. Does it fit well?'
    note: '*यह* means ''it'' or ''this'', and *आती* agrees with the feminine *जैकेट*.'
  hi.a1.unit26.lesson06.teach.arjun_han_yah:
    title: Arjun confirms
    gloss: 'Arjun: Yes, it fits well and it''s warm.'
    note: Matches the receipt read in lesson05 exactly -- this is the same coat.
  hi.a1.unit26.lesson06.teach.priya_barhiya_tum:
    title: Priya asks about color
    gloss: 'Priya: Great! Do you want it in black or in blue?'
    note: '*या* (''or'') offers a choice. The second *रंग* can be dropped: *काले रंग में ... या नीले में*. *तुम* is informal.'
  hi.a1.unit26.lesson06.teach.arjun_main_ise:
    title: Arjun decides
    gloss: 'Arjun: I''ll take it in black.'
    note: '*लूँगा* is the future of *लेना* (''to take''), the usual verb for deciding on something in a shop. A woman says *लूँगी*.'
  hi.a1.unit26.lesson06.teach.main_leta_hoon:
    title: लेता हूँ and लेता है
    gloss: I take, he takes.
    note: '*-ता* is the habitual ending and agrees with the subject, while *हूँ* goes with *मैं* and *है* goes with *वह*.'
