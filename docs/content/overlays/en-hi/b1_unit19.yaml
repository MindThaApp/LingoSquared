    title: "Where I currently live"
    gloss: "where I currently live"
    example_gloss: "This is the city where I currently live."
  hi.b1.unit19.lesson03.teach.grammar_jahan_place:
    title: "*Jahaan* -- the simpler place-relative"
    gloss: "\"*Jahaan*\" (\"where\") is another easy relative form for places, related to but distinct from \"*jismein*\": \"*vah shahar jahaan main abhi rahta hoon*\" -- note this is the CURRENT city, not the birth city from lesson02; the two facts should never be merged."
