    example_gloss: "He is very good."
  hi.b1.unit19.lesson02.teach.phrase_aadmi_jiske_saath:
    title: "The man with whom I work is very good"
    gloss: "The man with whom I work is very good."
  hi.b1.unit19.lesson02.teach.shahar:
