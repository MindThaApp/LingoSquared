  hi.b1.unit19.lesson02.teach.grammar_jis_oblique:
    title: "*Jo* + a preposition becomes *jis-*"
    gloss: "When \"*jo*\" combines with a postposition (*saath*, *mein*, *se*), it becomes the oblique form \"*jis*\" (singular) or \"*jin*\" (plural): \"*jo*\" + \"*ke saath*\" = \"*jiske saath*\" (with whom), \"*jo*\" + \"*mein*\" = \"*jismein*\" (in which), \"*jo*\" + \"*se*\" = \"*jisse*\" (from/with which)."
