  hi.b1.unit19.lesson01.teach.phrase_larka_gaa_raha:
    title: "That boy who is singing is my friend"
    gloss: "That boy who is singing is my friend."
  hi.b1.unit19.lesson01.teach.larki_gaa_rahi:
