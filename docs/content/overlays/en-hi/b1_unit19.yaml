answer_policy:
  jo_vah_subject_relative: >-
    "*Jo* [does something], *vah* [the real point]" combines two facts
    about a person into one sentence: "*vah larka jo* [is singing],
    *mera dost hai*." "*Jo*" itself never changes for gender/number --
    only the verb inside the clause and the possessive/predicate outside
    it agree with the antecedent's gender.
  jis_oblique_with_preposition: >-
    When "*jo*" combines with a postposition (*saath*, *mein*, *se*), it
    becomes the oblique form "*jis*" (singular) or "*jin*" (plural):
    "*jiske saath*" (with whom), "*jismein*" (in which), "*jisse*"
    (from/with which).
  jahan_place: >-
    "*Jahaan*" ("where") is the simpler relative form used for places,
    distinct from "*jismein*" -- both can describe a place, but they are
    not interchangeable within one sentence describing two different
    facts about it (e.g. birthplace vs. current residence).
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Internal
    commas separating clauses may also be replaced by " and " (और) or
    omitted with a space where noted per exercise.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

