  hi.a1.unit42.lesson03.teach.kisee_ko_kaisa:
    title: Giving an opinion with *लगता है*
    gloss: '*मुझे* + person + trait + *लगता है* says what you think someone is like: *मुझे नेहा जिज्ञासु लगती है* (I find Neha curious).'
    note: 'The opinion happens ''to'' you, so you say *मुझे*. *लगता* or *लगती* agrees with the person described: *लगती* for a woman.'
