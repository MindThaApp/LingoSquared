  hi.b2.unit02.lesson03.exercise03.match_guess_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"अंदाज़ा": guess, "पक्का अनुमान": "a sure deduction", "मुमकिन है": "it's possible", "मुझे पता नहीं।": "I don't know.", "अंदाज़ा लगाना": "to guess / make a guess", "बीमार": sick}
        status: correct
    feedback: "These are this lesson's guess-versus-deduction words."
  hi.b2.unit02.lesson03.exercise04.order_mumkin:
    instruction: "Put the words in order: It's possible that he's sick."
    accepted_answers:
      - {value: "मुमकिन है कि वह बीमार हो", status: correct}
    feedback: "*मुमकिन है कि वह बीमार हो* means it's possible that he's sick."
  hi.b2.unit02.lesson03.exercise05.translate_mumkin:
    instruction: "Translate into Hindi, about Arjun: It's possible that he's sick."
    accepted_answers:
      - {value: "मुमकिन है कि वह बीमार हो", status: correct}
