    feedback: "*इसलिए वह बीमार होगा* means so he must be sick."
  hi.b2.unit02.lesson02.exercise07.write_fansa_hoga:
    instruction: "Write in Hindi, about Arjun: He must be stuck in traffic."
    accepted_answers:
      - {value: "वह ट्रैफ़िक में फंसा होगा", status: correct}
      - {value: "वह ट्रैफिक में फंसा होगा", status: correct}
    feedback: "*वह ट्रैफ़िक में फंसा होगा* means he must be stuck in traffic."
  hi.b2.unit02.lesson02.exercise08.dictation_fansa_hoga:
    instruction: "Type what you hear."
    correct_response: "वह ट्रैफ़िक में फंसा होगा"
    accepted_answers:
      - {value: "वह ट्रैफ़िक में फंसा होगा", status: correct}
      - {value: "वह ट्रैफिक में फंसा होगा", status: correct}
    orthography_strict: true
    feedback: "You heard *वह ट्रैफ़िक में फंसा होगा* -- he must be stuck in traffic."

  hi.b2.unit02.lesson03.exercise01.recognize_andaza:
    instruction: "What does this word mean?"
    correct_option: guess
    distractors: ["a sure deduction", "a fact", "an order"]
    accepted_answers: [{value: guess, status: correct}]
    feedback: "*अंदाज़ा* means a guess -- not backed by real evidence."
  hi.b2.unit02.lesson03.exercise02.listen_mumkin:
    instruction: "Listen and select what you hear."
