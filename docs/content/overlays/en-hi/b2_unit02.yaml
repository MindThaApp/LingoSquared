      - value: {"फंसना": "to be stuck", "...होगा": "must be (deduction)", "...नहीं हो सकता": "cannot be", "छुट्टी": holiday, "इसलिए": "therefore / so", "बीमार": sick, "क्योंकि": because, "वजह": reason}
