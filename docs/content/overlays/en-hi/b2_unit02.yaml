course:
  title: Hindi B2
  description: >-
    Upper-intermediate Hindi: defend a position in a discussion, and
    speculate about causes and consequences with graded certainty --
    say what may, might, must, or cannot be the case (present and past),
    and distinguish deduction from guesswork.

units:
  hi.b2.unit02.anuman:
    title: "Speculation"
    description: Speculate about causes and consequences with graded certainty -- say what may, might, must, or cannot be the case, in the present and the past, and tell a confident deduction apart from a bare guess.

lessons:
  hi.b2.unit02.lesson01.kitna_yakeen:
    title: "How certain are you?"
  hi.b2.unit02.lesson02.pakka_anuman:
    title: "Deduction: it must be that way"
  hi.b2.unit02.lesson03.andaza_ya_anuman:
    title: "A guess or a sure deduction?"
  hi.b2.unit02.lesson04.beete_hue_ka_anuman:
    title: "Speculating about the past"
  hi.b2.unit02.lesson05.tathya_ya_anuman:
    title: "Fact or speculation?"
  hi.b2.unit02.lesson06.baatcheet_mein_anuman:
    title: "Speculating in a conversation"

teaching:
  hi.b2.unit02.lesson01.teach.arjun_nahin_aaya:
    title: "Arjun hasn't come today."
    gloss: "Arjun hasn't come today."
    note: "Today's scenario: Arjun is absent, and this unit speculates about why -- the real reason is only revealed in lesson06."
  hi.b2.unit02.lesson01.teach.vah:
    title: "he / she / that"
    gloss: "he / she / that (3rd person, gender-neutral in form)"
    note: "*वह* covers both 'he' and 'she' -- Hindi's 3rd-person singular pronoun doesn't mark gender itself; a verb agreeing with *वह* takes its gender from whoever *वह* refers to. In this unit, *वह* always refers to Arjun (masculine)."
    example_gloss: "He is my colleague."
  hi.b2.unit02.lesson01.teach.vajah:
    title: reason
    gloss: "reason / cause"
    example_gloss: "What is the reason for this?"
  hi.b2.unit02.lesson01.teach.shayad:
    title: maybe
    gloss: "maybe / perhaps (low certainty)"
    example_gloss: "Maybe he is tired."
  hi.b2.unit02.lesson01.teach.ho_sakta_hai:
    title: "it could be that..."
    gloss: "it could be that... / it's possible that..."
    note: "*हो सकता है कि...* takes the subjunctive *हो* in the clause that follows -- an invariant form that never changes for person or gender."
    example_gloss: "It could be that he is outside."
  hi.b2.unit02.lesson01.teach.zaroor:
    title: surely
    gloss: "surely / certainly (high certainty)"
    example_gloss: "Surely there's some reason."
  hi.b2.unit02.lesson01.teach.nishchit_roop_se:
    title: definitely
    gloss: "definitely (highest certainty)"
  hi.b2.unit02.lesson01.teach.traffic:
    title: traffic
    gloss: traffic
    example_gloss: "There's a lot of traffic on the road today."
  hi.b2.unit02.lesson01.teach.grammar_yakeen:
    title: "Maybe the reason is traffic. It could be that the reason is traffic. Surely the reason is traffic. Definitely the reason is traffic."
    gloss: "Maybe the reason is traffic. It could be that the reason is traffic. Surely the reason is traffic. Definitely the reason is traffic."
    note: "A certainty scale, low to high: *शायद* < *हो सकता है कि* < *ज़रूर* < *निश्चित रूप से*. Every version here keeps the same simple *वजह ट्रैफ़िक है* clause -- only the certainty word changes, so no verb ever needs to agree with a person."

  hi.b2.unit02.lesson02.teach.fasna:
    title: "to be stuck"
    gloss: "to be stuck / to get trapped"
    example_gloss: "He is stuck in traffic."
  hi.b2.unit02.lesson02.teach.hoga:
    title: "must be"
    gloss: "must be (deduction, present)"
    note: "*...होगा* is literally the future tense of *होना* ('will be'), but used here to mean 'must be' -- a confident deduction, not a statement about the future. It agrees with the subject's gender/number: *होगा* (masculine), *होगी* (feminine)."
  hi.b2.unit02.lesson02.teach.nahin_ho_sakta:
    title: "cannot be"
    gloss: "cannot be / it's not possible that"
    note: "*...नहीं हो सकता* is the opposite of *हो सकता है* -- ruling something out, not just being unsure about it."
  hi.b2.unit02.lesson02.teach.chhutti:
    title: holiday
    gloss: "holiday / day off"
    example_gloss: "Today is a holiday at the office."
  hi.b2.unit02.lesson02.teach.isliye:
    title: "therefore / so"
    gloss: "therefore / so"
    example_gloss: "Today is a holiday, so the office is closed."
  hi.b2.unit02.lesson02.teach.beemaar:
    title: sick
    gloss: sick
    note: "*बीमार* never changes form for gender -- it stays the same whoever it describes."
    example_gloss: "He was sick yesterday."
  hi.b2.unit02.lesson02.teach.grammar_deduction:
    title: "He must be stuck in traffic. This can't be traffic, because today is a holiday. So he must be sick."
    gloss: "He must be stuck in traffic. This can't be traffic, because today is a holiday. So he must be sick."
    note: "*वह* here refers to Arjun (masculine), so *फंसा* and *होगा* both take masculine agreement -- fixed by the story, not by the learner. Every deduction sentence in this lesson works the same way."

  hi.b2.unit02.lesson03.teach.andaza:
    title: "to guess"
    gloss: "a guess / to make a guess"
    note: "*अंदाज़ा लगाना* = 'to make a guess' -- a guess based on no real evidence, contrasted with *पक्का अनुमान* (a confident deduction) in this lesson."
    example_gloss: "He is guessing."
  hi.b2.unit02.lesson03.teach.mumkin_hai:
    title: "it's possible"
    gloss: "it's possible"
    note: "*मुमकिन है* is another way to say 'it's possible', alongside *हो सकता है* from lesson01 -- both are invariant."
    example_gloss: "This is possible."
  hi.b2.unit02.lesson03.teach.pakka:
    title: "a sure deduction"
    gloss: "sure / firm (पक्का अनुमान = a sure/confident deduction)"
    note: "*पक्का अनुमान* is a deduction backed by real evidence -- the opposite of a bare *अंदाज़ा* (guess)."
    example_gloss: "This is just a guess, not a sure deduction."
  hi.b2.unit02.lesson03.teach.pata_nahin:
    title: "I don't know."
    gloss: "I don't know. / No idea."
    note: "*मुझे पता नहीं* is copula-less and invariant -- it never changes for who is speaking."
  hi.b2.unit02.lesson03.teach.grammar_andaza:
    title: "This is a guess, not a sure deduction. It's possible that he is sick. I don't know. He is guessing."
    gloss: "This is a guess, not a sure deduction. It's possible that he is sick. I don't know. He is guessing."
    note: "A *अंदाज़ा* (bare guess) is not backed by evidence; a *पक्का अनुमान* (sure deduction) is. Naming which one you're making is part of speculating precisely."

  hi.b2.unit02.lesson04.teach.chhootna:
    title: "to be missed (left behind)"
    gloss: "to be missed / left behind (a vehicle, an opportunity)"
    example_gloss: "His train was missed."
  hi.b2.unit02.lesson04.teach.bus:
    title: bus
    gloss: bus
    note: "*बस* is grammatically feminine -- any adjective or verb describing it takes feminine agreement (*छूट गई*, *होगी*), regardless of who is speaking."
    example_gloss: "I go by bus every day."
  hi.b2.unit02.lesson04.teach.sona:
    title: "to sleep"
    gloss: "to sleep / to fall asleep"
    example_gloss: "He fell asleep early."
  hi.b2.unit02.lesson04.teach.hogi:
    title: "must have been"
    gloss: "must have been / must be (feminine)"
    note: "*...होगी* is the feminine form of *...होगा* -- it agrees with a feminine noun (like *बस*), never with the speaker's own gender."
  hi.b2.unit02.lesson04.teach.bhoolna:
    title: "to forget"
    gloss: "to forget"
    example_gloss: "He often forgets things."
  hi.b2.unit02.lesson04.teach.meeting:
    title: meeting
    gloss: meeting
    example_gloss: "There was a meeting this morning."
  hi.b2.unit02.lesson04.teach.uski:
    title: "his / her"
    gloss: "his / her"
    note: "*उसकी* agrees with the THING possessed (feminine here, like *बस*), not with the possessor's gender -- Hindi possessives never reveal or require the speaker's own gender."
    example_gloss: "Her book is on the table."
  hi.b2.unit02.lesson04.teach.grammar_beeta:
    title: "His bus must have been missed. He must have forgotten the meeting. Maybe he fell asleep."
    gloss: "His bus must have been missed. He must have forgotten the meeting. Maybe he fell asleep."
    note: "Past deduction = perfective verb + *होगा*/*होगी* ('must have...'). All three examples here are about Arjun (fixed masculine subject) or a feminine object noun (*बस*) -- never about the learner's own gender."

  hi.b2.unit02.lesson05.teach.reading:
    title: "Reading: fact or speculation?"
    gloss: "Arjun didn't come to the office today. It could be that the reason is traffic, but today is a holiday, so it can't be traffic. Maybe his bus was missed, or it's possible that he is sick. This is just a guess, not a sure deduction. Right now, nobody knows."
    glosses:
      सिर्फ़: "only / just"
      कोई: "any / some (कोई पक्का अनुमान नहीं = not any sure deduction)"
      अभी: "right now / currently"
      किसी: "anyone (oblique form of कोई, used before को)"
      को: "to (dative marker)"

  hi.b2.unit02.lesson06.teach.tum_kyon_nahin_aaye:
    title: "Why didn't you come to office yesterday?"
    gloss: "Why didn't you come to office yesterday?"
    note: "*आए* is the तुम-form of the past tense, addressed to Arjun (masculine) -- if addressing a woman with तुम, this would be *आईं*."
  hi.b2.unit02.lesson06.teach.meri_bus_chhoot:
    title: "My bus was missed."
    gloss: "My bus was missed. / I missed my bus."
    note: "*मेरी* agrees with *बस* (feminine), not with the speaker -- Arjun says *मेरी बस* exactly the way Priya would."
  hi.b2.unit02.lesson06.teach.humein_laga:
    title: "We thought you might be sick."
    gloss: "We thought you might be sick."
    note: "*होगे* is the तुम-form of *...होगा*, used here addressing Arjun (masculine)."
  hi.b2.unit02.lesson06.teach.dialogue_priya_ask:
    title: "Priya: Why didn't you come to office yesterday?"
    gloss: "Priya: Why didn't you come to office yesterday?"
  hi.b2.unit02.lesson06.teach.dialogue_arjun_bus:
    title: "Arjun: My bus was missed."
    gloss: "Arjun: My bus was missed."
  hi.b2.unit02.lesson06.teach.dialogue_priya_guess:
    title: "Priya: We thought you might be sick."
    gloss: "Priya: We thought you might be sick."
  hi.b2.unit02.lesson06.teach.dialogue_arjun_no:
    title: "Arjun: No, I was just late because of the bus."
    gloss: "Arjun: No, I was just late because of the bus."
    note: "*देर हो गई* = 'became late' -- a common, gender-invariant way to say someone was delayed."
  hi.b2.unit02.lesson06.teach.grammar_baatcheet:
    title: "Maybe the reason is traffic. No, it can't be traffic, because today is a holiday. Surely his bus must have been missed."
    gloss: "Maybe the reason is traffic. No, it can't be traffic, because today is a holiday. Surely his bus must have been missed."
    note: "A full speculation moves from a low-certainty guess, through ruling out one cause with evidence, to a confident deduction -- exactly what the speaking and writing tasks in this lesson require."

exercises:
  hi.b2.unit02.lesson01.exercise01.recognize_shayad:
    instruction: "What does this word mean?"
    correct_option: maybe
    distractors: [surely, definitely, because]
    accepted_answers: [{value: maybe, status: correct}]
    feedback: "*शायद* means maybe -- the lowest certainty level."
  hi.b2.unit02.lesson01.exercise02.listen_zaroor:
    instruction: "Listen and select what you hear."
    correct_option: "Surely the reason is traffic."
    distractors: ["Maybe the reason is traffic.", "Surely the reason is not traffic.", "Surely the reason is the weather."]
    accepted_answers: [{value: "Surely the reason is traffic.", status: correct}]
    feedback: "*ज़रूर वजह ट्रैफ़िक है* means surely the reason is traffic."
  hi.b2.unit02.lesson01.exercise03.match_certainty_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"शायद": maybe, "हो सकता है कि...": "it could be that...", "ज़रूर": surely, "निश्चित रूप से": definitely, "वजह": reason, "ट्रैफ़िक": traffic, "आज": today, "नहीं आया": "hasn't come / didn't come"}
        status: correct
    feedback: "These are this lesson's certainty words, from low (शायद) to high (निश्चित रूप से)."
  hi.b2.unit02.lesson01.exercise04.order_nishchit:
    instruction: "Put the words in order: Definitely the reason is traffic."
    accepted_answers:
      - {value: "निश्चित रूप से वजह ट्रैफ़िक है", status: correct}
    feedback: "*निश्चित रूप से वजह ट्रैफ़िक है* means definitely the reason is traffic."
  hi.b2.unit02.lesson01.exercise05.translate_shayad:
    instruction: "Translate into Hindi: Maybe the reason is traffic."
    accepted_answers:
      - {value: "शायद वजह ट्रैफ़िक है", status: correct}
      - {value: "शायद वजह ट्रैफिक है", status: correct}
    feedback: "*शायद वजह ट्रैफ़िक है* means maybe the reason is traffic."
  hi.b2.unit02.lesson01.exercise06.speak_zaroor:
    instruction: "Say aloud in Hindi, using ज़रूर: Surely the reason is traffic."
    accepted_answers:
      - {value: "ज़रूर वजह ट्रैफ़िक है", status: correct}
      - {value: "जरूर वजह ट्रैफिक है", status: correct}
    feedback: "*ज़रूर वजह ट्रैफ़िक है* means surely the reason is traffic."
  hi.b2.unit02.lesson01.exercise07.write_arjun_nahin_aaya:
    instruction: "Write in Hindi: Arjun hasn't come today."
    accepted_answers:
      - {value: "अर्जुन आज नहीं आया", status: correct}
    feedback: "*अर्जुन आज नहीं आया* means Arjun hasn't come today."
  hi.b2.unit02.lesson01.exercise08.dictation_nishchit:
    instruction: "Type what you hear."
