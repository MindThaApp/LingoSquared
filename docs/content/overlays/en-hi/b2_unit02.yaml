    feedback: "*यह ट्रैफ़िक नहीं हो सकता, क्योंकि आज छुट्टी है* means this can't be traffic, because today is a holiday."
  hi.b2.unit02.lesson02.exercise06.translate_beemaar_hoga:
    instruction: "Translate into Hindi, about Arjun: So he must be sick."
    accepted_answers:
      - {value: "इसलिए वह बीमार होगा", status: correct}
