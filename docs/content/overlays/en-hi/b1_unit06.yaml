  hi.b1.unit06.lesson01.teach.grammar_jab_tab:
    title: "Jab...tab: background and main event"
    gloss: "\"Jab\" (when) ... \"tab\" (then, at that point) come together: \"jab [background action, -raha tha/rahi thi], tab [main event].\" This combines \"-raha hai\" (unit 5) with \"tha\"/\"thi\" -- \"raha tha\"/\"rahi thi\" means an action that was ongoing in the past, like \"was doing.\" \"Kya hua?\" means \"What happened?\""
  hi.b1.unit06.lesson01.teach.shaam:
    title: "Evening"
    gloss: "evening"
    example_gloss: "The weather was good this evening."
  hi.b1.unit06.lesson01.teach.ja_stem_review:
    title: "Go (stem)"
    gloss: "go (verb stem)"
    example_gloss: "I am going home."
  hi.b1.unit06.lesson01.teach.ko_ghar_review:
    title: "Review: at/to (time marker), home"
    gloss: "at (time marker), home"
    example_gloss: "I go home in the evening."
  hi.b1.unit06.lesson01.teach.jab_shaam_ko_ghar_ja_rahi_thi_phrase:
    title: "When I was going home in the evening..."
    gloss: "When I was going home in the evening..."
  hi.b1.unit06.lesson01.teach.mili_review:
    title: "Review: met (feminine)"
    gloss: "met (feminine)"
    note: "First taught in A1."
    example_gloss: "I met Priya there."
  hi.b1.unit06.lesson01.teach.se_review:
    title: "Review: from / with"
    gloss: "from / with"
    note: "First taught in A1, both as \"from\" and in the \"with\" sense (X se milna)."
    example_gloss: "Arjun met with Priya."
  hi.b1.unit06.lesson01.teach.tab_mein_arjun_se_mili_phrase:
    title: "...then I met Arjun"
    gloss: "...then I met Arjun."
  hi.b1.unit06.lesson01.teach.full_phrase:
    title: "The full sentence"
    gloss: "When I was going home in the evening, then I met Arjun."

  hi.b1.unit06.lesson02.teach.phir:
    title: "Then"
    gloss: "then"
    example_gloss: "I went to the shop. Then I went home."
  hi.b1.unit06.lesson02.teach.grammar_phir_dual_use:
    title: "Phir's second meaning"
    gloss: "\"Phir\" here means \"then\" (the next event in a sequence) -- a distinct, genuine use from unit 2's \"phir se\" (again). These are two real, common uses of the same word, like \"dekhna\" and \"gaya\" (unit 5)."
  hi.b1.unit06.lesson02.teach.usne:
    title: "He/she (ergative)"
    gloss: "he/she (ergative form)"
    note: "The *ne*-marked ergative form of \"vah\" (he/she), used before a past-tense transitive verb like *kaha* -- reuses the same ergative MECHANISM already established for \"tumne\" (unit 4), just applied to the third person."
    example_gloss: "He/she said that this is good."
  hi.b1.unit06.lesson02.teach.kaha_ki_review:
    title: "Review: said, that"
    gloss: "said, that (conjunction)"
    note: "First taught in unit 4."
    example_gloss: "He/she said that he/she will come."
  hi.b1.unit06.lesson02.teach.grammar_usne_kaha:
    title: "Usne kaha ki: reported speech"
    gloss: "\"Usne kaha ki...\" (he/she said that...) uses the same ne+kaha+ki pattern that unit 4's \"tumne kaha ki...\" used -- just the second person (tum) is replaced by the third person (vah/usne). It's the same grammatical pattern; the only new word is \"usne.\""
  hi.b1.unit06.lesson02.teach.bazaar_review:
    title: "Review: market"
    gloss: "market"
    note: "First taught in A1."
    example_gloss: "This is the market."
  hi.b1.unit06.lesson02.teach.ja_stem_review:
