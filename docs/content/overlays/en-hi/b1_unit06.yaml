answer_policy:
  jab_tab_background: >-
    "*Jab* [background, *-raha tha/rahi thi*], *tab* [main event]" marks an
    action that was already IN PROGRESS when the main event happened --
    don't accept a plain simple-past background clause (dropping *raha/
    rahi*) as equivalent where the exercise specifically targets this
    construction.
  phir_dual_use: >-
    Bare *phir* means "then" (the next event in a sequence) here, distinct
    from *phir se* ("again") taught earlier in the course.
  usne_kaha_ki: >-
    "*Usne kaha ki*..." (he/she said that...) extends the same *ne*-
    ergative + *kaha* + *ki* pattern already taught for "*tumne kaha
    ki*..." to the third person -- don't accept a version that drops *ki*
    and states the reported content directly.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question marks
    (?) may likewise be omitted, but the fully punctuated form remains the
    model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

course:
