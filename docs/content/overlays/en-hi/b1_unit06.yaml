    gloss: "That was fun!"
  hi.b1.unit06.lesson03.teach.grammar_summary:
    title: "The full pattern"
    gloss: "This unit's three main rules: (1) 'jab [-raha tha/rahi thi], tab [main event]' links a background action to a main event. (2) 'phir' marks the next event. (3) 'usne kaha ki...' reports what someone else said."
  hi.b1.unit06.lesson03.teach.reading_passage:
