    gloss: "What happened?"
  hi.b1.unit06.lesson03.teach.dialogue.line03:
    title: "Priya sets the background"
    gloss: "When I was going to the shop, then I met [my] neighbour."
  hi.b1.unit06.lesson03.teach.dialogue.line04:
    title: "Arjun asks for the next event"
    gloss: "OK, then what happened?"
  hi.b1.unit06.lesson03.teach.dialogue.line05:
