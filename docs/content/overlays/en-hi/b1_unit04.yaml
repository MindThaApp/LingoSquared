review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    Fourth en-hi B1 overlay, written for hi/b1_unit04_sahmati.yaml -- see
    that file's own generation_provenance/review notes for the full
    account (सहमत/असहमत + क्योंकि reason-giving, plus the embedded कि-
    clause referencing another's stated opinion). No sibling-direction
    overlay (hi-en) exists yet, so §8 doesn't apply. Not yet reviewed --
    status left honestly as unreviewed.

    Asterisk convention (§15): every inline romanized-Hindi word inside a
    `note`/`gloss` field below is wrapped in single asterisks.

answer_policy:
  agree_disagree: >-
    *Sahmat*/*asahmat* ("agree"/"disagree") are adjectives used with the
    copula (*sahmat hoon*, literally "am agreeing"), not verbs of their
    own -- don't accept a bare *sahmat*/*asahmat* with no copula as a full
    sentence answer where a complete statement is asked for.
  embedded_ki_clause: >-
    "*Mujhe lagta hai ki*..." and "*tumne kaha ki*..." both embed a full
    clause after *ki* ("that"), referencing an opinion or statement --
    distinct from simply stating an opinion directly (A2's own
    opinion-giving unit). A typed answer that drops *ki* and just states
    the embedded content directly is marked incorrect when the exercise
    specifically targets this construction.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question marks
    (?) may likewise be omitted, but the fully punctuated form remains the
    model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

