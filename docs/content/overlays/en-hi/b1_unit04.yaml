    correct_response: ["मैं", "तुमसे", "असहमत", "हूँ", "क्योंकि", "यह", "महंगा", "है"]

  hi.b1.unit04.lesson01.exercise08.fill_asahmat:
    instruction: "Complete: I disagree with you, because this is expensive."
    accepted_answers: ["असहमत"]
