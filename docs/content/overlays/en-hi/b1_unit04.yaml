    distractors: ["I disagree with you, because you're wrong.", "You agree with me, because I'm right."]
    accepted_answers: ["मैं तुमसे सहमत हूँ, क्योंकि तुम सही कहते हो"]

  hi.b1.unit04.lesson01.exercise04.listen_mein_tumse_asahmat_hoon:
