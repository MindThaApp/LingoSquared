teaching:
  hi.a1.unit28.lesson01.teach.fon_karna:
    title: To call
    gloss: to call
    note: The infinitive of the verb for making a phone call.
    example_gloss: I have to call you.
  hi.a1.unit28.lesson01.teach.main_tumhen_fon:
    title: Saying you'll call
    gloss: I'll call you.
    note: '*करूँगा* is the future of *करना*, and Hindi uses it where English says ''I''ll''. The person called takes *तुम्हें* (''to you'').'
  hi.a1.unit28.lesson01.teach.hailo_main_priya:
    title: Answering the phone
    gloss: Hello, this is Priya.
    note: On the phone you say *मैं ... बोल रही हूँ* ('I am speaking'); *रही* is feminine because Priya is a woman.
  hi.a1.unit28.lesson01.teach.hailo_main_arjun:
    title: Arjun answers the same way
    gloss: Hello, this is Arjun.
    note: 'Same pattern with the masculine *रहा*: *मैं अर्जुन बोल रहा हूँ*, because Arjun is a man.'
  hi.a1.unit28.lesson02.teach.main_kisse_bat:
    title: Asking who's calling
    gloss: Who am I speaking with?
    note: '*किससे* (''with whom'') is *कौन* (''who'') plus *से*, and *से* marks the person you talk with.'
  hi.a1.unit28.lesson02.teach.ap_priya_se:
    title: Identifying yourself formally
    gloss: You're speaking with Priya.
    note: '*आप* is the polite ''you'' for a stranger. *प्रिया से बात कर रहे हैं* puts *से* after the name, and *हैं* goes with *आप*.'
  hi.a1.unit28.lesson03.teach.kya_tum_yah:
    title: Asking for repetition
    gloss: Can you repeat that?
    note: '*सकते हो* means ''can'' and follows the main verb: *कह सकते हो*. *क्या* at the start makes it a question.'
  hi.a1.unit28.lesson03.teach.itna_tez_mat:
    title: Asking someone to slow down
    gloss: Don't speak so fast, please.
    note: '*मत बोलो* is the friendly ''don''t speak'' with *तुम*, and *इतना तेज़* means ''so fast''.'
  hi.a1.unit28.lesson03.teach.mujhe_tumharee_avaz:
    title: Saying you can't hear well
    gloss: I can't hear you well.
    note: 'Hindi says ''your voice is not coming'': *मुझे तुम्हारी आवाज़ नहीं आ रही है*. The speaker gets *मुझे*, and the voice is the subject.'
  hi.a1.unit28.lesson04.teach.maisej:
    title: Text message
    gloss: the text message
    note: '*मैसेज* is a common loan word and masculine: *एक मैसेज*, *यह मैसेज ... का है*.'
    example_gloss: The text message is from Priya.
  hi.a1.unit28.lesson04.teach.main_tumhen_ek:
    title: Saying you'll send a text
    gloss: I'll send you a text.
    note: 'The order is person, then thing, then verb: *तुम्हें एक मैसेज भेजूँगा*. *भेजना* means ''to send''.'
  hi.a1.unit28.lesson04.teach.main_tumhen_bad:
    title: Saying you'll call back
    gloss: I'll call you back later.
    note: '*वापस फ़ोन करना* means ''to call back'', with *वापस* before *फ़ोन करना*; *बाद में* means ''later''.'
  hi.a1.unit28.lesson05.teach.arjun_hay_priya:
    title: Read a text exchange
    gloss: 'Arjun: Hi Priya, can you call me? I need to tell you something. Priya: Yes of course, I''ll call you back in five minutes.'
    note: Track what Arjun asks for, why, and when Priya says she'll call back.
    glosses:
      हाय: hi
      सकती: can
      फ़ोन: call
      ज़रूरी: 'important (as in: something important to tell)'
      कुछ: something
      बतानी: tell
      ज़रूर: of course
      करूँगी: will call
      पाँच: five
      मिनट: minutes
      वापस: back
  hi.a1.unit28.lesson06.teach.arjun_hailo_main:
    title: Arjun answers the call
    gloss: 'Arjun: Hello, this is Arjun.'
    note: The person who answers says their name first with *मैं ... बोल रहा हूँ*, here with the masculine *रहा*.
  hi.a1.unit28.lesson06.teach.priya_hay_arjun:
    title: Priya identifies herself
    gloss: 'Priya: Hi Arjun, this is Priya. Arjun: Nice that you''re calling!'
    note: '*अच्छा हुआ तुमने फ़ोन किया* means ''good that you called''; *तुमने ... किया* is the past with *ने*.'
  hi.a1.unit28.lesson06.teach.priya_tumharee_pahlee:
    title: Priya asks about the shift
    gloss: 'Priya: How was your first shift?'
    note: '*कैसी रही* asks ''how was it''; *कैसी* is feminine because *शिफ़्ट* is feminine.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_achchhee:
    title: Arjun reports good news
    gloss: 'Arjun: It went really well, better than I thought.'
    note: '*अच्छी रही* (''went well'') agrees with the feminine *शिफ़्ट*, and *जितना मैंने सोचा था उससे भी बेहतर* means ''even better than I thought''.'
  hi.a1.unit28.lesson06.teach.vah_narvas_tha:
    title: 'था and थी: was'
    gloss: He was nervous, she was happy.
    note: '*था* is ''was'' for a masculine subject and *थी* for a feminine one; the ending agrees with who or what is described.'
  hi.a1.unit28.lesson06.teach.priya_yah_sunkar:
    title: Priya is proud
    gloss: 'Priya: How nice to hear! I''m proud of you.'
    note: '*तुम पर गर्व है* (''pride is on you'') uses *पर*, and the proud person gets *मुझे*.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_shukriya:
    title: Arjun is touched
    gloss: 'Arjun: Thank you, that means a lot to me.'
    note: '*मेरे लिए* means ''for me'', and *इसका बहुत मतलब है* is ''it means a lot''.'
  hi.a1.unit28.lesson06.teach.uskee_pahlee_shift:
    title: His
    gloss: His first shift went really well.
    note: '*उसकी* means ''his'' or ''her'' (the same word for both) and agrees with the feminine *शिफ़्ट*.'
