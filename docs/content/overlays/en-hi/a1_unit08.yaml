      - "स्कूल के पीछे"

  hi.a1.unit08.lesson03.exercise05.order_dakghar_bank_ke_paas_hai:
    instruction: "Put the sentence in order: The post office is near the bank."
    correct_response: ["डाकघर", "बैंक", "के", "पास", "है"]

  hi.a1.unit08.lesson03.exercise06.order_aspatal_station_ke_samne_hai:
    instruction: "Put the sentence in order: The hospital is in front of the station."
    correct_response: ["अस्पताल", "स्टेशन", "के", "सामने", "है"]

  hi.a1.unit08.lesson03.exercise07.match_places_review:
    instruction: "Match each Hindi word to its English meaning."
    correct_response:
      "घर": "home / house"
      "स्कूल": "school"
      "अस्पताल": "hospital"
      "बैंक": "bank"
      "पार्क": "park"
      "स्टेशन": "station"
      "डाकघर": "post office"
      "पास": "near"
      "दूर": "far"
      "सामने": "in front of"
