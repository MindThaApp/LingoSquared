teaching:
  hi.a1.unit08.lesson01.teach.ghar_school:
    title: "Home, school"
    gloss: "home / house, school"
    note: "Two common places, used throughout this unit."
    example_gloss:
      - "This is a house."
      - "This is a school."

  hi.a1.unit08.lesson01.teach.aspatal_bank:
    title: "Hospital, bank"
    gloss: "hospital, bank"
    note: "Two more common places you might need to find in a neighborhood."
    example_gloss:
      - "This is a hospital."
      - "This is a bank."

  hi.a1.unit08.lesson01.teach.park_station:
    title: "Park, station"
    gloss: "park, station"
    note: "The last two common places for this unit."
    example_gloss:
      - "This is a park."
      - "This is a station."

  hi.a1.unit08.lesson01.teach.yahan_wahan:
    title: "Here, there"
    gloss: "here, there"
    note: "A basic pair for pointing out where something is."
    example_gloss:
      - "The school is here."
      - "The bank is there."

  hi.a1.unit08.lesson01.teach.school_kahan_hai:
    title: "Where is the school?"
    gloss: "Where is the school?"
    note: "Reuses *kahaan* (where), first taught back in unit 1, now asking about a place instead of a person's origin."

  hi.a1.unit08.lesson01.teach.school_yahan_hai:
    title: "The school is here"
    gloss: "The school is here."
    note: "A sample answer using *yahaan*."

  hi.a1.unit08.lesson01.teach.bank_kahan_hai:
    title: "Where is the bank?"
    gloss: "Where is the bank?"
    note: "The same question pattern, with a different place."

  hi.a1.unit08.lesson01.teach.bank_wahan_hai:
    title: "The bank is there"
    gloss: "The bank is there."
    note: "A sample answer using *wahaan*."

  hi.a1.unit08.lesson02.teach.paas:
    title: "Near"
    gloss: "near"
    note: "Formally introduced here for the first time -- it appeared only in unit 2's example sentences (*mere paas*, 'I have', literally 'near me') without ever being taught as its own word until now."
    example_gloss: "The bank is near."

  hi.a1.unit08.lesson02.teach.door:
    title: "Far"
    gloss: "far"
    note: "The opposite of *paas*."
    example_gloss: "The station is far."

  hi.a1.unit08.lesson02.teach.ke_paas_note:
    title: "Ke paas"
    gloss: "'Ke paas' means near a place, like 'school bank ke paas hai' (the school is near the bank). It's the same 'paas' that appeared earlier in 'mere paas' (I have), but there it meant 'in my possession', and here it means 'nearby' -- one word, two different uses."
    note: "A new postposition built on an already-seen word, with its earlier sense flagged explicitly so the two uses don't get confused."

  hi.a1.unit08.lesson02.teach.school_bank_ke_paas_hai:
    title: "The school is near the bank"
    gloss: "The school is near the bank."
    note: "A sample sentence using *ke paas*."

  hi.a1.unit08.lesson02.teach.samne_peeche:
    title: "In front of, behind"
    gloss: "in front of, behind"
    note: "A second pair of location words, also used with *ke*."
    example_gloss:
      - "The hospital is in front of the station."
      - "The park is behind the school."

  hi.a1.unit08.lesson02.teach.samne_peeche_note:
    title: "Samne and peeche"
    gloss: "'Samne' and 'peeche' also come with 'ke', just like 'paas' -- and they're opposites of each other: 'paark school ke peeche hai' and 'school paark ke samne hai' both describe the exact same real relationship, just from two different points of view."
    note: "The same fact, stated two ways -- a real, useful grammar point about how the two words relate."

  hi.a1.unit08.lesson02.teach.school_park_ke_samne_hai:
    title: "The school is in front of the park"
    gloss: "The school is in front of the park."
    note: "The other side of the same fact as *paark school ke peeche hai* above."

  hi.a1.unit08.lesson03.teach.dakghar:
    title: "Post office"
    gloss: "post office"
    note: "A new common place for this unit's closing dialogue."
    example_gloss: "The post office is near the bank."

  hi.a1.unit08.lesson03.teach.dakghar_kahan_hai:
    title: "Where is the post office?"
    gloss: "Where is the post office?"
    note: "Opens this unit's closing dialogue."

  hi.a1.unit08.lesson03.teach.dialogue.line01:
    title: "Arjun asks about the post office"
    gloss: "Arjun asks Priya where the post office is."
    note: "Reuses this lesson's own opening phrase."
  hi.a1.unit08.lesson03.teach.dialogue.line02:
    title: "Priya answers"
    gloss: "Priya says it's near the bank."
    note: "Reuses *ke paas* from lesson 2."
  hi.a1.unit08.lesson03.teach.dialogue.line03:
    title: "Arjun asks about the hospital"
    gloss: "Arjun says okay, and asks where the hospital is."
    note: "Reuses *theek hai* from earlier units."
  hi.a1.unit08.lesson03.teach.dialogue.line04:
    title: "Priya answers"
    gloss: "Priya says the hospital is in front of the station."
    note: "Reuses *ke samne* from lesson 2."
  hi.a1.unit08.lesson03.teach.dialogue.line05:
    title: "Arjun asks if it's far"
    gloss: "Arjun asks: is the station far?"
    note: "Reuses *door* from lesson 2."
  hi.a1.unit08.lesson03.teach.dialogue.line06:
    title: "Priya confirms and contrasts"
    gloss: "Priya says yes, a little far -- the bank is near."
    note: "Introduces *thoda* (a bit), and stays consistent with the station being far while the bank stays near."
  hi.a1.unit08.lesson03.teach.dialogue.line07:
    title: "Arjun asks about the park"
    gloss: "Arjun says okay, and asks where the park is."
  hi.a1.unit08.lesson03.teach.dialogue.line08:
    title: "Priya answers"
    gloss: "Priya says the park is behind the school."
    note: "Reuses *ke peeche* from lesson 2."
  hi.a1.unit08.lesson03.teach.dialogue.line09:
    title: "Arjun works it out"
    gloss: "Arjun says: so the school is in front of the park!"
    note: "Introduces *to* (so/then), and connects the fact to lesson 2's *samne*/*peeche* grammar note."
  hi.a1.unit08.lesson03.teach.dialogue.line10:
    title: "Priya confirms"
    gloss: "Priya says yes, that's right!"
    note: "Introduces *sahi* (right/correct)."
  hi.a1.unit08.lesson03.teach.dialogue.line11:
    title: "Arjun thanks Priya"
    gloss: "Arjun says thanks a lot, Priya!"
    note: "Reuses *bahut* (very/a lot) and *shukriya* from earlier units."
  hi.a1.unit08.lesson03.teach.dialogue.line12:
    title: "Priya closes"
    gloss: "Priya says no problem! See you again."
    note: "Reuses this course's own standard closing phrases from earlier units."

exercises:
  hi.a1.unit08.lesson01.exercise01.select_ghar_meaning:
    instruction: "Which word means home or house?"
    correct_option: "घर"
    distractors: ["स्कूल", "बैंक"]
    accepted_answers: ["घर"]

  hi.a1.unit08.lesson01.exercise02.select_school_meaning:
    instruction: "Which word means school?"
    correct_option: "स्कूल"
    distractors: ["घर", "पार्क"]
    accepted_answers: ["स्कूल"]

  hi.a1.unit08.lesson01.exercise03.select_aspatal_meaning:
    instruction: "What does this word mean?"
    correct_option: "hospital"
    distractors: ["bank", "station"]
    accepted_answers: ["अस्पताल"]

  hi.a1.unit08.lesson01.exercise04.select_yahan_meaning:
    instruction: "What does this word mean?"
    correct_option: "here"
    distractors: ["there", "where"]
    accepted_answers: ["यहाँ"]

  hi.a1.unit08.lesson01.exercise05.match_place_words:
    instruction: "Match each Hindi word to its English meaning."
    correct_response:
      "घर": "home / house"
      "स्कूल": "school"
      "अस्पताल": "hospital"
      "बैंक": "bank"
      "पार्क": "park"
      "स्टेशन": "station"
      "यहाँ": "here"
      "वहाँ": "there"

  hi.a1.unit08.lesson01.exercise06.order_school_kahan_hai:
    instruction: "Put the question in order: Where is the school?"
    correct_response: ["स्कूल", "कहाँ", "है"]

  hi.a1.unit08.lesson01.exercise07.order_bank_yahan_hai:
    instruction: "Put the sentence in order: The bank is here."
    correct_response: ["बैंक", "यहाँ", "है"]

  hi.a1.unit08.lesson01.exercise08.fill_yah_aspatal_school_nahin:
    instruction: "Complete the sentence: This is a hospital, not a school."
    accepted_answers: ["अस्पताल"]
    feedback: "Yah aspatal hai, school nahin -- aspatal is hospital."

  hi.a1.unit08.lesson01.exercise09.fill_bank_kahan:
    instruction: "Complete the question: Where is the bank?"
    accepted_answers: ["कहाँ"]
    feedback: "Bank kahaan hai? -- kahaan is the question word for 'where'."

  hi.a1.unit08.lesson01.exercise10.reply_school_kahan_hai:
    instruction: "Answer that the school is there."
    accepted_answers:
      - "स्कूल वहाँ है।"
      - "स्कूल वहाँ है"

  hi.a1.unit08.lesson01.exercise11.speak_where_is_park:
    instruction: "Say where the park is."
    accepted_answers:
      - "पार्क यहाँ है।"
      - "पार्क यहाँ है"
      - "पार्क वहाँ है।"
      - "पार्क वहाँ है"

  hi.a1.unit08.lesson02.exercise01.select_door_meaning:
    instruction: "What does this word mean?"
    correct_option: "far"
    distractors: ["near", "here"]
    accepted_answers: ["दूर"]

  hi.a1.unit08.lesson02.exercise02.select_samne_meaning:
    instruction: "What does this word mean?"
    correct_option: "in front of"
    distractors: ["behind", "near"]
    accepted_answers: ["सामने"]

  hi.a1.unit08.lesson02.exercise03.select_peeche_meaning:
    instruction: "What does this word mean?"
    correct_option: "behind"
    distractors: ["in front of", "far"]
    accepted_answers: ["पीछे"]

  hi.a1.unit08.lesson02.exercise04.match_spatial_words:
    instruction: "Match each Hindi word to its English meaning."
    correct_response:
      "पास": "near"
      "दूर": "far"
      "सामने": "in front of"
      "पीछे": "behind"
      "यहाँ": "here"
      "वहाँ": "there"
      "कहाँ": "where"

  hi.a1.unit08.lesson02.exercise05.order_school_bank_ke_paas_hai:
    instruction: "Put the sentence in order: The school is near the bank."
    correct_response: ["स्कूल", "बैंक", "के", "पास", "है"]

  hi.a1.unit08.lesson02.exercise06.order_park_school_ke_peeche_hai:
    instruction: "Put the sentence in order: The park is behind the school."
    correct_response: ["पार्क", "स्कूल", "के", "पीछे", "है"]

  hi.a1.unit08.lesson02.exercise07.fill_school_park_ke_samne:
    instruction: "Complete the sentence: The school is in front of the park."
    accepted_answers: ["सामने"]
    feedback: "School paark ke samne hai -- samne is 'in front of'."

  hi.a1.unit08.lesson02.exercise08.fill_bank_paas_station_door:
    instruction: "Complete the sentence: The bank is near, the station is far."
    accepted_answers: ["पास"]
    feedback: "Bank paas hai, station door hai -- paas and door are opposites."

  hi.a1.unit08.lesson02.exercise09.fix_missing_ke_samne:
    instruction: "Correct the sentence -- samne needs 'ke' before it."
    accepted_answers:
      - "अस्पताल स्टेशन के सामने है।"
      - "अस्पताल स्टेशन के सामने है"
    feedback: "Aspatal station ke samne hai -- samne (and peeche, paas) always take 'ke' before them."

  hi.a1.unit08.lesson02.exercise10.reply_park_kahan_hai:
    instruction: "Answer where the park is, based on this lesson's content."
    accepted_answers:
      - "पार्क स्कूल के पीछे है।"
      - "पार्क स्कूल के पीछे है"

  hi.a1.unit08.lesson02.exercise11.speak_bank_location:
    instruction: "Say where the bank is."
    accepted_answers:
      - "बैंक पास है।"
      - "बैंक पास है"
      - "स्कूल बैंक के पास है।"
      - "स्कूल बैंक के पास है"

  hi.a1.unit08.lesson03.exercise01.select_dakghar_meaning:
    instruction: "Which word means post office?"
    correct_option: "डाकघर"
    distractors: ["बैंक", "स्टेशन"]
