teaching:
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson01.teach.shuru_shabd:
    title: Things you start
    gloss: to run / to do yoga / to play the guitar / start
    note: '*शुरू करना* = to begin. The activity comes before it as an infinitive: *दौड़ना शुरू करना*.'
    example_gloss:
    - I started running.
    - Priya started doing yoga.
    - Arjun started playing the guitar.
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson01.teach.gn_shuru_kiya:
    title: 'Started: ने ... शुरू किया'
    gloss: I started running. Priya started doing yoga.
    note: In the past, *करना* takes *ने* with the doer. The infinitive (*दौड़ना*) is masculine, so the verb stays *किया*.
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson01.teach.gn_shuru_nahin:
    title: Did not start
    gloss: Arjun did not start playing the guitar. I have not started running yet.
    note: Put *नहीं* before *किया*. *अभी* adds the sense 'yet'.
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson02.teach.band_shabd:
    title: Things you stop
    gloss: sweets / at night / to look at the phone / stop, off
    note: '*बंद कर दिया* = stopped (for good). The helper *दिया* adds the feeling that it is finished.'
    example_gloss:
    - Priya stopped eating sweets.
    - Arjun stopped looking at his phone at night.
    - I stopped drinking tea.
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson02.teach.gn_band_kar_diya:
    title: 'Stopped: बंद कर दिया'
    gloss: I stopped drinking tea. Priya stopped eating sweets.
    note: Doer + *ने* + infinitive + *बंद कर दिया*. The verb ending stays the same, because the infinitive is masculine.
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson02.teach.gn_ab_nahin:
    title: Now I no longer
    gloss: Now I do not drink tea. Now Priya does not eat sweets.
    note: 'After stopping, you describe the new habit with *अब* and the habitual present: *नहीं पीता* (man), *नहीं खाती* (woman).'
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson02.teach.gn_pehle_ab:
    title: Before and now
    gloss: I used to drink tea every day. Now I do not drink tea.
    note: '*पहले ... था* and *अब ... नहीं ...ता* show the change in a habit.'
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson03.teach.koshish_shabd:
    title: Trying
    gloss: attempt, effort / morning / (to) get up / (to) sleep / (to) run
    note: '*कोशिश करना* = to try. *कोशिश* is feminine, so the past is *कोशिश की*.'
    example_gloss:
    - I tried to get up early.
    - Priya tries to run every day.
    - Arjun tried to sleep early.
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson03.teach.gn_ne_ki_koshish:
    title: 'Try to: -ने की कोशिश'
    gloss: I tried to sleep early. I try to run every day.
    note: 'Before *की कोशिश* the infinitive changes its ending: *सोना → सोने*, *दौड़ना → दौड़ने*. In the past, *कोशिश* is feminine, so *की*.'
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson03.teach.gn_soka:
    title: Tried but could not
    gloss: I tried, but I could not sleep. Priya tried, but she could not get up.
    note: '*सका* (man) and *सकी* (woman) are the past of *सकना*. They are used after a bare verb stem: *सो नहीं सका*.'
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson04.teach.bhool_shabd:
    title: Things you forget
    gloss: forget (stem) / shoes / key / to take medicine / to phone
    note: '*भूल जाना* = to forget (to do something). Here *भूल* is the stem and *गया / गई / गए* follows.'
    example_gloss:
    - I forgot to take the medicine. (man)
    - Priya forgot to phone.
    - They forgot to bring the shoes.
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson04.teach.gn_bhool_gaya:
    title: 'Forgot: भूल गया / गई / गए'
    gloss: Arjun forgot to take the medicine. Priya forgot to take the medicine. They forgot to take the medicine.
    note: '*भूल जाना* has no *ने*. The ending agrees with the person who forgot: *गया* (man), *गई* (woman), *गए* (several).'
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson04.teach.gn_bhool_nahin_kiya:
    title: Forgot or did not
    gloss: I forgot to phone. I did not phone.
    note: The first sentence tells why it did not happen. The second only states that it did not happen.
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson05.teach.padhne_shabd:
    title: Time words
    gloss: last month / one day / today / yesterday
    note: '*पिछले महीने* = last month. Here *कल* with a past verb means ''yesterday''.'
    example_gloss:
    - Last month I started running.
    - Yesterday I could not sleep. (man)
    - Today I forgot to bring the shoes. (man)
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson05.teach.padho_diary:
    title: Arjun's diary
    gloss: Last month I started running. I stopped looking at my phone at night. I tried to sleep early every day, but yesterday I could not sleep. Today I forgot to bring my shoes. Arjun
    note: 'Sort the four things: one started, one stopped, one tried, one forgotten.'
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson06.teach.d1:
    title: Priya asks
    gloss: 'Priya: Arjun, what did you start last month?'
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson06.teach.d2:
    title: Arjun answers
    gloss: 'Arjun: I started running and stopped looking at my phone at night.'
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson06.teach.d3:
    title: Priya asks about trying
    gloss: 'Priya: Very good! Did you try to run every day?'
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson06.teach.d4:
    title: Arjun admits
    gloss: 'Arjun: Yes, but yesterday I forgot to bring my shoes.'
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson06.teach.d5:
    title: Priya shares
    gloss: 'Priya: Oh! I also started doing yoga.'
  hi.a2.unit87.maine_daudna_shuru_kiya.lesson06.teach.d6:
    title: Arjun suggests
    gloss: 'Arjun: Very good! Tomorrow we will run together.'
