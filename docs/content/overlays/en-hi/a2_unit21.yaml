answer_policy:
  lagna_agreement: >-
    "Mujhe [thing] [adjective] lagti/lagta hai" ("I find [thing]
    [adjective]") agrees with the GENDER of the thing being evaluated, the
    same dative-experiencer shape as *pasand hai/hain* (unit 13) and the
    same -a/-i adjective agreement already taught for *bada/badi* (unit
    14) and *thanda/thandi* (unit 19). *Film* is feminine, so *acchi
    lagti hai* is correct; a typed answer using the wrong gender form is
    marked incorrect as a real grammar error, the exact contrast lesson01's
    own grammar_check exercise targets.
  lagta_hai_ki_fixed_form: >-
    "Mujhe lagta hai ki [full sentence]" ("I think that...") is a
    DIFFERENT, fixed idiom -- *lagta* never changes here, regardless of
    gender, because it doesn't grammatically agree with anything (what
    follows *ki* is a full subordinate clause, not a simple noun). Do not
    conflate this with the lagna_agreement rule above. A typed answer using
    *lagti* instead of the invariant *lagta* in this specific construction
    is marked incorrect as a real grammar error, the exact contrast
    lesson02's own grammar_check exercise targets.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question marks
    (?) may likewise be omitted, but the fully punctuated form remains the
    model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation. Opinion prompts name the exact opinion to give, because
    answers are matched against the listed accepted sentences.

course:
  title: "Hindi A2"

units:
  hi.a2.unit21.raay:
    title: "Opinions"

lessons:
  hi.a2.unit21.lesson01.mujhe_lagta_hai:
    title: "I find it..."
  hi.a2.unit21.lesson02.kyonki:
    title: "Because"
  hi.a2.unit21.lesson03.priya_arjun_film_par_raay:
    title: "Priya and Arjun: opinions on the film"

teaching:
  hi.a2.unit21.lesson01.teach.film_review:
    title: "Review: film"
    gloss: "film"
    note: "First taught in unit 11 -- this whole unit's own recurring topic."
    example_gloss: "We watch a film."

  hi.a2.unit21.lesson01.teach.yah_review:
    title: "Review: this"
    gloss: "this"
    note: "First taught in unit 1."
    example_gloss: "This house is big."

  hi.a2.unit21.lesson01.teach.kaisi_review:
    title: "Review: how (fem.)"
    gloss: "how / what ... like (feminine)"
    note: "The feminine form of *kaisa* (already known from *aap kaisi hain?* in unit 1), agreeing with the feminine *film*. *Tumhein yah film kaisi lagti hai?* = How do you find this film?"
    example_gloss: "What's this film like?"

  hi.a2.unit21.lesson01.teach.lagna:
    title: "To seem / to feel"
    gloss: "to seem / to feel"
    note: "A new verb, this unit's central grammar point -- see this lesson's own grammar note."
    example_gloss: "I find this film good."

  hi.a2.unit21.lesson01.teach.mujhe_yah_film_acchi_lagti_hai_phrase:
    title: "I find this film good"
    gloss: "I find this film good. (Literally: 'this film feels good to me.')"
    note: "The first live example of the lagna-agreement pattern just introduced."

  hi.a2.unit21.lesson01.teach.grammar_lagna:
    title: "Lagna agrees with the thing being evaluated"
    gloss: "'Lagna' (to seem/feel) is used as 'mujhe...lagta/lagti/lagte hai/hain', just like 'pasand hai' (unit 13) -- the verb agrees with the thing the opinion is ABOUT, not with 'mujhe' (I). 'Film' is feminine, so 'acchi lagti hai' -- the same -a/-i rule (unit 14) already taught for 'bada'/'badi'."
    note: "This unit's first new grammar point."

  hi.a2.unit21.lesson01.teach.kahani:
    title: "Story"
    gloss: "story"
    note: "A new noun, feminine."
    example_gloss: "The story is good."

  hi.a2.unit21.lesson01.teach.majedaar:
    title: "Fun / entertaining"
    gloss: "fun / entertaining"
    note: "A new adjective. Doesn't end in -a, so it never changes for gender -- a disclosed contrast against *acchi/buri*, which do."
    example_gloss: "This film is fun."

  hi.a2.unit21.lesson02.teach.pasand_review:
    title: "Review: liked"
    gloss: "liked"
    note: "First taught in unit 13 -- reused here alongside *kyonki* to give a reason."
    example_gloss: "I like tea."

  hi.a2.unit21.lesson02.teach.kyonki:
    title: "Because"
    gloss: "because"
    note: "A new connector, this unit's second central grammar point -- joins an opinion to its reason."
    example_gloss: "I like this film because the story is good."

  hi.a2.unit21.lesson02.teach.mujhe_pasand_hai_kyonki_phrase:
    title: "I like this film because the story is good"
    gloss: "I like this film because the story is good."
    note: "The first live example of opinion + kyonki + reason."

  hi.a2.unit21.lesson02.teach.grammar_kyonki:
    title: "Kyonki joins an opinion to its reason"
    gloss: "'Kyonki' (because) joins an opinion to its reason: '[opinion] + kyonki + [reason]' -- e.g. 'mujhe yah film pasand hai kyonki kahani acchi hai.'"
    note: "This unit's second new grammar point -- use it to support an opinion with a reason."

  hi.a2.unit21.lesson02.teach.bahut_review:
    title: "Review: very"
    gloss: "very"
    note: "First taught in unit 6 -- reused here to intensify an opinion."
    example_gloss: "The story is very good."

  hi.a2.unit21.lesson02.teach.lagta_hai_ki_phrase:
    title: "I think that..."
    gloss: "I think that this film is good."
    note: "'Mujhe lagta hai ki...' -- a DIFFERENT, fixed idiom from lesson 1's agreeing 'lagti/lagta hai' -- see this lesson's own grammar note."

  hi.a2.unit21.lesson02.teach.grammar_ki_clause:
    title: "Mujhe lagta hai ki... is a fixed form"
    gloss: "'Mujhe lagta hai ki...' (I think that...) is a separate, fixed form -- 'lagta' always stays the same here, never changing for gender, because what follows 'ki' is a full sentence, not a simple noun. This is a DIFFERENT rule from the previous lesson's 'mujhe...lagti/lagta hai' (which DOES agree with the thing being described) -- don't mix the two up."
    note: "Keep the two patterns apart -- this lesson's correction exercise tests exactly this contrast."

  hi.a2.unit21.lesson02.teach.buri_review:
    title: "Bad (fem.)"
    gloss: "bad (feminine)"
    note: "The feminine form of *bura* (unit 19, taught there only in its masculine form) -- predictable from the already-established -a/-i rule, now exercised live for the first time, agreeing with the feminine *kahani*."
    example_gloss: "This film is bad."

  hi.a2.unit21.lesson03.teach.nahin_review:
    title: "Review: no / not"
    gloss: "no / not"
    note: "First taught in unit 1."
    example_gloss: "I don't like coffee."

  hi.a2.unit21.lesson03.teach.kitaab:
    title: "Book / books"
    gloss: "book (sg.) / books (pl.)"
    note: "Reviewed from unit 13 -- reused with plural 'pasand hain', reinforcing unit 13's own is/are-by-number rule for 'pasand'."
    example_gloss: "I like books."

  hi.a2.unit21.lesson03.teach.arjun_priya_review:
    title: "Review: Arjun, Priya"
    gloss: "Arjun, Priya"
    note: "This course's two recurring characters."
    example_gloss:
      - "Arjun went to the Aadhaar center."
      - "Priya went home."

  hi.a2.unit21.lesson03.teach.dialogue.line01:
    title: "Priya asks Arjun's opinion"
    gloss: "What do you think of this film?"
  hi.a2.unit21.lesson03.teach.dialogue.line02:
    title: "Arjun gives his opinion and reason"
    gloss: "I really like this film because the story is fun."
  hi.a2.unit21.lesson03.teach.dialogue.line03:
    title: "Priya disagrees"
    gloss: "I don't think so. I think the story is bad."
  hi.a2.unit21.lesson03.teach.dialogue.line04:
    title: "Arjun asks what Priya likes instead"
    gloss: "Really? What do you like?"
  hi.a2.unit21.lesson03.teach.dialogue.line05:
    title: "Priya states her preference"
    gloss: "I like books, not films."
  hi.a2.unit21.lesson03.teach.dialogue.line06:
    title: "Arjun accepts the difference"
    gloss: "OK!"

  hi.a2.unit21.lesson03.teach.grammar_summary:
    title: "Two main rules"
    gloss: "This unit's two main rules: (1) 'mujhe [thing] [adjective] lagti/lagta hai' agrees with the gender of the thing being evaluated, like 'pasand hai'. (2) 'mujhe lagta hai ki [sentence]' is a fixed form -- 'lagta' doesn't change. 'Kyonki' joins an opinion to its reason."
    note: "A closing summary tying the whole unit's grammar together."

  hi.a2.unit21.lesson03.teach.reading:
    title: "Reading about Priya and Arjun's opinions"
    gloss: "Priya and Arjun watched a film. Arjun likes the film because the story is fun. Priya doesn't like the film -- Priya thinks the story is bad. Priya likes books."
    note: "A short, direct profile restating exactly the facts already established in the dialogue, using 'Priya' by name instead of a third-person pronoun (not taught yet)."
    glosses:
      फ़िल्म: "film"
      देखी: "watched (from देखना)"
      पसंद: "liked / pleasing"
      क्योंकि: "because"
      कहानी: "story"
      मज़ेदार: "fun / entertaining"
      लगता: "seems / thinks (from लगना)"
      बुरी: "bad (feminine)"
      किताबें: "books"

