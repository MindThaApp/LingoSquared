answer_policy:
  sakna_agreement: >-
    Unlike *chahiye* (unit 1), which agrees with the OBJECT, *sakna*
    agrees with the SUBJECT: *sakta* (masc.), *sakti* (fem.), *sakte*
    (plural/informal *tum*). A typed answer with the wrong subject
    agreement is marked incorrect as a real grammar error.
  embedded_ability: >-
    "*Ho sakta hai ki* + subject + *sakoon/sake*..." embeds a genuine
    subjunctive clause -- "it's possible that I/they can/may..." -- rather
    than a bare "*sakta hoon*" statement. This unit only exercises the
    1st-person subjunctive *sakoon*; the 3rd-person *sake* appears once
    in the reading passage but is never a required answer.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question marks
    (?) may likewise be omitted, but the fully punctuated form remains the
    model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

