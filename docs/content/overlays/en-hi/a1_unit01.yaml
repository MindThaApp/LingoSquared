answer_policy:
  nasalization_marks: >-
    Display and teach the correct chandrabindu/anusvara distinction
    (हूँ, हाँ, कहाँ vs. मैं, हैं, में, मिलेंगे). In typed A1 answers,
    accept a variant that drops the nasalization mark entirely or
    substitutes anusvara for chandrabindu (हूं for हूँ, हां for हाँ)
    when every other character is correct -- these marks are small,
    easy to miss on a virtual keyboard, and near-homophonous in casual
    speech; this is a beginner course, not a spelling test. Do not
    extend this tolerance to a wrong vowel or consonant, which changes
    the actual word.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark, matching how it is actually printed and
    taught. In typed answers, accept the danda, a plain period (.), or
    the mark omitted entirely as equivalent -- most everyday Hindi
    typed on phones/keyboards uses a plain period, and this distinction
    carries no meaning difference. Question marks (?) and exclamation
    marks may likewise be omitted, but the fully punctuated form
    remains the model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    (aap vs. tum) rather than written punctuation or nasalization marks.

course:
  title: "Hindi A1"
  description: >-
    Learn to greet people, ask how someone is doing, introduce
    yourself, and exchange basic personal information in Hindi.
    English-specific guidance highlights the aap/tum formality system
    (a real grammatical distinction English doesn't mark) and Hindi's
    gender-agreeing adjectives and verb forms, which have no English
    equivalent.

units:
  hi.a1.unit01.greetings:
    title: "Namaste and first meetings"

lessons:
  hi.a1.unit01.lesson01.aap_and_tum:
    title: "Aap and tum: asking how someone is"
  hi.a1.unit01.lesson02.greetings_and_farewells:
    title: "Greetings and farewells"
  hi.a1.unit01.lesson03.names_origin_and_dialogue:
    title: "Names, origin, and a first meeting at a yoga class"

teaching:
  hi.a1.unit01.lesson01.teach.aap:
    title: "Formal/respectful you"
    gloss: "you (formal, respectful)"
    note: >-
      English uses "you" for everyone. Hindi marks a real social
      choice: *aap* is used with someone older, unfamiliar, or in a
      professionally respectful relationship. It's grammatically
      treated as plural even for one person -- verbs agreeing with
      *aap* take the same -en/hain-type endings used for "they."

  hi.a1.unit01.lesson01.teach.tum:
    title: "Informal you"
    gloss: "you (informal, familiar)"
    note: >-
      *Tum* is used with a friend, peer, younger person, or family
      member -- a genuinely informal relationship, but still
      respectful (not the same as the even more intimate *tu*, which
      this course doesn't teach). *Tum* takes its own distinct verb
      endings, different from both *aap* and *tu*.

  hi.a1.unit01.lesson01.teach.aap_kaise_hain:
    title: "Formal wellbeing question, to a man"
    gloss: "How are you? (formal, asking a man)"
    note: >-
      *Kaise* agrees with the GENDER OF THE PERSON BEING ASKED, not
      the speaker -- this form is used when addressing a man. English
      "how are you" never changes this way.

  hi.a1.unit01.lesson01.teach.aap_kaisi_hain:
    title: "Formal wellbeing question, to a woman"
    gloss: "How are you? (formal, asking a woman)"
    note: >-
      Same question, same *aap* register -- only *kaisi* changes from
      *kaise*, agreeing with a female addressee. The verb *hain*
      itself never changes; only the adjective form does.

  hi.a1.unit01.lesson01.teach.tum_kaise_ho:
    title: "Informal wellbeing question"
    gloss: "How are you? (informal)"
    note: >-
      With *tum*, the verb is *ho*, not *hain* -- compare formal
      *Aap kaise/kaisi hain?* with informal *Tum kaise ho?*. This is
      the clearest minimal pair for hearing the aap-vs-tum distinction
      in the verb itself.

  hi.a1.unit01.lesson01.teach.main_theek_hoon:
    title: "A standard reply"
    gloss: "I'm fine, thank you."
    note: >-
      *Theek* ("fine/okay") does not change for gender or register --
      unlike *kaise/kaisi*, it stays the same no matter who's speaking
      or who's being addressed.

  hi.a1.unit01.lesson01.teach.aur_aap:
    title: "Return the formal question"
    gloss: "And you? (formal)"
    note: "A short way to return the question in the respectful aap register."

  hi.a1.unit01.lesson01.teach.aur_tum:
    title: "Return the informal question"
    gloss: "And you? (informal)"
    note: "Use tum to return the question to a friend or peer."

  hi.a1.unit01.lesson02.teach.namaste:
    title: "All-purpose greeting"
    gloss: "hello; hi (also used for goodbye)"
    note: >-
      *Namaste* works at any time of day, in both formal and informal
      settings, and for both opening and closing an exchange --
      genuinely all-purpose, unlike English, which splits greetings
      and farewells into separate words.
    example_gloss: "Hello! How are you?"

  hi.a1.unit01.lesson02.teach.namaskar:
    title: "Respectful greeting"
    gloss: "hello (more formal/respectful than namaste)"
    note: >-
      *Namaskar* means essentially the same thing as *namaste* but
      carries a more formal, respectful tone -- appropriate for an
      elder, a large audience, or a professional setting.
    example_gloss: "Namaskar! And you?"

  hi.a1.unit01.lesson02.teach.phir_milenge:
    title: "See you again (future)"
    gloss: "see you again; see you later"
    note: >-
      Literally "[we] will meet again" -- a standard, neutral way to
      say goodbye when you expect to see the person again.

  hi.a1.unit01.lesson02.teach.alvida:
    title: "Formal farewell"
    gloss: "goodbye; farewell"
    note: >-
      *Alvida* is a real, correctly-used Hindi word for goodbye, but
      it carries a more final, formal, even slightly dramatic tone in
      everyday use than *namaste* or *phir milenge* -- closer to
      "farewell" than a casual "bye."
    example_gloss: "Goodbye! See you again."

  hi.a1.unit01.lesson02.teach.phir_milte_hain:
    title: "See you (casual/habitual)"
    gloss: "see you; see you around"
    note: >-
      Literally "[we] meet again," using the ongoing/habitual verb
      form instead of the future -- a slightly more casual everyday
      equivalent of *phir milenge*.

  hi.a1.unit01.lesson02.teach.shubh_ratri:
    title: "Good night"
    gloss: "good night"
    note: >-
      Said when someone is leaving for the night or going to bed --
      like English "good night," this is a farewell, never an opening
      greeting, unlike *namaste*.

  hi.a1.unit01.lesson02.teach.shubh_din:
    title: "Polite closing wish"
    gloss: "Have a nice day."
    note: >-
      Literally "may your day remain good" -- a polite closing wish
      appropriate when parting from someone respectfully, whether the
      relationship is formal or informal.

  hi.a1.unit01.lesson03.teach.aapka_naam_kya_hai:
    title: "Ask a name, formally"
    gloss: "What is your name? (formal)"
    note: >-
      *Aapka* ("your") agrees with the masculine noun *naam* ("name")
      -- Hindi possessives change form to agree with the thing owned,
      not the owner, which has no English equivalent.

  hi.a1.unit01.lesson03.teach.tumhara_naam_kya_hai:
    title: "Ask a name, informally"
    gloss: "What is your name? (informal)"
    note: >-
      Same pattern with *tumhara* ("your," informal) in place of
      *aapka*. Compare formal *Aapka naam kya hai?* with informal
      *Tumhara naam kya hai?*.

  hi.a1.unit01.lesson03.teach.mera_naam_priya_hai:
    title: "Give your name"
    gloss: "My name is Priya."
    note: >-
      *Mera* ("my") also agrees with *naam* being masculine -- notice
      it matches the same masculine ending as *aapka*/*tumhara* above,
      since all three modify the same noun.

  hi.a1.unit01.lesson03.teach.aapse_milkar_khushi_hui:
    title: "Pleasure at meeting someone, formally"
    gloss: "Nice to meet you. (formal)"
    note: >-
      Literally "having met you, happiness happened" -- a fixed,
      widely-used expression for a respectful first meeting.

  hi.a1.unit01.lesson03.teach.mujhe_bhi:
    title: "Return the sentiment"
    gloss: "Me too."
    note: "A short, natural reply to Aapse milkar khushi hui or Tumse milkar accha laga."

  hi.a1.unit01.lesson03.teach.aap_kahan_se_hain:
    title: "Ask origin, formally"
    gloss: "Where are you from? (formal)"
    note: "Kahan means \"where\"; se means \"from.\""

  hi.a1.unit01.lesson03.teach.main_bharat_se_hoon:
    title: "State your origin"
    gloss: "I am from India."
    note: "Bharat is the Hindi name for India, used constantly in everyday speech."

  hi.a1.unit01.lesson03.teach.tum_kahan_se_ho:
    title: "Ask origin, informally"
    gloss: "Where are you from? (informal)"
    note: >-
      Same question with *tum* and *ho* in place of *aap* and *hain* --
      the same formal/informal verb-ending pattern seen throughout
      this unit.

  hi.a1.unit01.lesson03.teach.dialogue.line01:
    title: "Opening the encounter"
    gloss: "Priya greets Arjun and asks if this is his first time here."
    note: >-
      Both speakers use the informal *tum* register from the start --
      natural for two peers meeting casually at a community class.
      *Tumhari* ("your") agrees with the feminine noun *baar* ("time,"
      as in "occasion"), not with either speaker's own gender.
  hi.a1.unit01.lesson03.teach.dialogue.line02:
    title: "Opening the encounter, reply"
    gloss: "Arjun says yes, it's his first time, and that he wants to learn yoga."
    note: >-
      *Chahta hoon* ("I want") takes the masculine form here because
      Arjun, the speaker, is male -- this verb agrees with the
      SPEAKER's gender, unlike *kaisi*/*kaise* earlier, which agreed
      with the person being ADDRESSED.

  hi.a1.unit01.lesson03.teach.dialogue.line03:
    title: "Exchange names"
    gloss: "Priya says \"me too!\", gives her name, and asks Arjun's."
    note: >-
      *Main bhi!* ("me too!") answers Arjun's *main ... chahta hoon*:
      when the other person's sentence has *main* as its subject,
      "me too" is *main bhi*. *Mujhe bhi* is the reply to a *mujhe*-type
      sentence such as *Tumse milkar accha laga*. *Mera naam...hai* is
      the natural, simple way to give a name.
  hi.a1.unit01.lesson03.teach.dialogue.line04:
    title: "Exchange names, reply"
    gloss: "Arjun gives his name and says it's nice to meet her, informally."
    note: >-
      *Tumse milkar accha laga* is the informal counterpart to this
      lesson's formal *Aapse milkar khushi hui* -- both mean roughly
      "nice to meet you," matched to register.

  hi.a1.unit01.lesson03.teach.dialogue.line05:
    title: "Ask about origin"
    gloss: "Priya returns the sentiment and asks where Arjun is from."
    note: "Tum kahan se ho asks about origin using the informal register already taught."
  hi.a1.unit01.lesson03.teach.dialogue.line06:
    title: "Ask about origin, reply"
    gloss: "Arjun is from India but currently lives in London, then asks the same question back."
    note: >-
      *Rahta hoon* ("I live") is masculine, agreeing with Arjun as
      speaker -- the same subject-agreement pattern as *chahta hoon*
      in line02. *Lekin* ("but") links the contrast between origin and
      current residence.

  hi.a1.unit01.lesson03.teach.dialogue.line07:
    title: "Discuss origin and an interest"
    gloss: "Priya says she's from America and also wants to learn yoga."
    note: >-
      *Chahti hoon* is the feminine form of the same verb Arjun used
      in line02 (*chahta hoon*) -- notice both agree with their own
      speaker's gender, giving a direct minimal pair to compare.

  hi.a1.unit01.lesson03.teach.dialogue.line08:
    title: "Ask about the shared activity"
    gloss: "Arjun reacts positively and asks if Priya does yoga."
    note: >-
      *Karti ho* ("do you do") is feminine, agreeing with Priya as the
      person being asked -- like *kaisi* earlier, this verb form
      tracks the ADDRESSEE's gender, not the speaker's.

  hi.a1.unit01.lesson03.teach.dialogue.line09:
    title: "Ask about the shared activity, reply"
    gloss: "Priya says no, it's her first time, and she's still learning."
    note: >-
      *Seekh rahi hoon* ("I am learning") uses the feminine continuous
      form, agreeing with Priya as speaker -- the present-continuous
      counterpart to *chahti hoon*.

  hi.a1.unit01.lesson03.teach.dialogue.line10:
    title: "Close the exchange"
    gloss: "Arjun agrees to begin, then says see you later."
    note: >-
      *Chalo shuru karte hain* ("let's begin") is a fixed, natural way
      to propose starting something together. *Phir milte hain* closes
      the exchange with the casual farewell taught in lesson 2.

exercises:
  hi.a1.unit01.lesson01.exercise01.select_aap:
    instruction: "Which word is the formal, respectful way to say \"you\"?"
    correct_option: "आप"
    distractors: ["तुम", "और"]
    accepted_answers: ["आप"]
    feedback: "Aap is used with someone older, unfamiliar, or in a respectful relationship."

  hi.a1.unit01.lesson01.exercise02.select_tum:
    instruction: "Which word addresses one friend or peer informally?"
    correct_option: "तुम"
    distractors: ["आप", "और"]
    accepted_answers: ["तुम"]
    feedback: "Tum is used with friends, peers, and other informal-but-respectful relationships."

  hi.a1.unit01.lesson01.exercise03.select_aap_kaisi_hain_meaning:
    instruction: "What does this question ask, and who is it addressed to?"
    correct_option: "How are you? (formal, asking a woman)"
    distractors:
      - "How are you? (formal, asking a man)"
      - "And you?"
    accepted_answers: ["How are you? (formal, asking a woman)"]
    feedback: "Kaisi agrees with a female addressee; kaise would be used for a man."

  hi.a1.unit01.lesson01.exercise04.order_aap_kaise_hain:
    instruction: "Put the formal wellbeing question (to a man) in order."
    correct_response: ["आप", "कैसे", "हैं"]

  hi.a1.unit01.lesson01.exercise05.order_tum_kaise_ho:
    instruction: "Put the informal wellbeing question in order."
    correct_response: ["तुम", "कैसे", "हो"]

  hi.a1.unit01.lesson01.exercise06.return_formal:
    instruction: "Return the question, keeping the respectful register."
    correct_option: "और आप?"
    distractors: ["और तुम?", "तुम कैसे हो?"]
    accepted_answers: ["और आप?", "और आप"]
    feedback: "Aur aap? keeps the formal register when returning the question."

  hi.a1.unit01.lesson01.exercise07.return_informal:
    instruction: "Return the question to a friend or peer."
    correct_option: "और तुम?"
    distractors: ["और आप?", "आप कैसे हैं?"]
    accepted_answers: ["और तुम?", "और तुम"]
    feedback: "Aur tum? is the informal way to return the question."

  hi.a1.unit01.lesson01.exercise08.correct_informal_agreement:
    instruction: "Correct the informal question -- it mixes tum with the wrong verb ending."
    accepted_answers:
      - "तुम कैसे हो?"
      - "तुम कैसे हो"
    feedback: "Tum takes the ending ho, not hain -- hain is only used with aap."

  hi.a1.unit01.lesson01.exercise09.reply_formally:
    instruction: "Reply politely: say you're fine and thank them."
    accepted_answers:
      - "मैं ठीक हूँ, शुक्रिया।"
      - "मैं ठीक हूँ, शुक्रिया"
      - "मैं ठीक हूं, शुक्रिया।"
      - "मैं ठीक हूँ, शुक्रिया। और आप?"
      - "मैं ठीक हूँ, शुक्रिया, और आप?"
      - "मैं ठीक हूं, शुक्रिया। और आप?"
      - "मैं ठीक हूं, शुक्रिया, और आप?"

  hi.a1.unit01.lesson01.exercise10.speak_informally:
    instruction: "Answer informally, thank the speaker, and return the question."
    accepted_answers:
      - "मैं ठीक हूँ, शुक्रिया। और तुम?"
      - "मैं ठीक हूँ, शुक्रिया, और तुम?"
      - "मैं ठीक हूँ, शुक्रिया। और तुम"
      - "मैं ठीक हूं, शुक्रिया। और तुम?"
      - "मैं ठीक हूं, शुक्रिया, और तुम?"

  hi.a1.unit01.lesson02.exercise01.select_namaste:
    instruction: "Which word can mean both hello and goodbye?"
    correct_option: "नमस्ते"
    distractors: ["अलविदा", "शुभ रात्रि"]
    accepted_answers: ["नमस्ते"]

  hi.a1.unit01.lesson02.exercise02.select_alvida:
    instruction: "Which word means a formal, final-sounding goodbye?"
    correct_option: "अलविदा"
    distractors: ["नमस्ते", "फिर मिलेंगे"]
    accepted_answers: ["अलविदा"]

  hi.a1.unit01.lesson02.exercise03.select_shubh_ratri_meaning:
    instruction: "What does this phrase mean?"
    correct_option: "Good night."
    distractors: ["Good morning.", "See you."]
    accepted_answers: ["Good night."]
    feedback: "Shubh raatri is a farewell said when someone is leaving for the night, not a greeting."

  hi.a1.unit01.lesson02.exercise04.order_phir_milenge:
    instruction: "Put the see-you-again farewell in order."
    correct_response: ["फिर", "मिलेंगे"]

  hi.a1.unit01.lesson02.exercise05.order_shubh_ratri:
    instruction: "Put the good-night farewell in order."
    correct_response: ["शुभ", "रात्रि"]

  hi.a1.unit01.lesson02.exercise06.order_phir_milte_hain:
    instruction: "Put the casual see-you farewell in order."
    correct_response: ["फिर", "मिलते", "हैं"]

  hi.a1.unit01.lesson02.exercise07.order_shubh_din:
    instruction: "Build the polite closing wish."
    correct_response: ["आपका", "दिन", "अच्छा", "रहे"]

  hi.a1.unit01.lesson02.exercise08.reply_to_namaskar:
    instruction: "Return the same greeting, then turn the question back with the short formal \"And you?\""
    accepted_answers:
      - "नमस्कार! और आप?"
      - "नमस्कार, और आप?"
      - "नमस्कार! और आप"

  hi.a1.unit01.lesson02.exercise09.reply_with_goodbye:
    instruction: "Say the formal, final-sounding goodbye, then add \"See you again\" (literally \"we will meet again\")."
    accepted_answers:
      - "अलविदा! फिर मिलेंगे।"
      - "अलविदा, फिर मिलेंगे।"
      - "अलविदा। फिर मिलेंगे।"

  hi.a1.unit01.lesson02.exercise10.speak_friendly_closing:
    instruction: "Say a casual see-you farewell."
    accepted_answers:
      - "फिर मिलते हैं।"
      - "फिर मिलते हैं"

  hi.a1.unit01.lesson03.exercise01.select_formal_name_question:
    instruction: "Which question formally asks someone's name?"
    correct_option: "आपका नाम क्या है?"
    distractors: ["तुम्हारा नाम क्या है?", "आप कहाँ से हैं?"]
    accepted_answers: ["आपका नाम क्या है?", "आपका नाम क्या है"]

  hi.a1.unit01.lesson03.exercise02.select_informal_name_question:
    instruction: "Which question informally asks a friend's name?"
    correct_option: "तुम्हारा नाम क्या है?"
    distractors: ["आपका नाम क्या है?", "तुम कहाँ से हो?"]
    accepted_answers: ["तुम्हारा नाम क्या है?", "तुम्हारा नाम क्या है"]

  hi.a1.unit01.lesson03.exercise03.comprehend_origin:
    instruction: "Read the line. Where is Arjun from, and where does he live?"
    correct_option: "He is from India and lives in London."
    distractors:
      - "He is from America and lives in London."
      - "He is from India and lives in America."
    accepted_answers:
      - "He is from India and lives in London."
      - "India; London"

  hi.a1.unit01.lesson03.exercise04.comprehend_still_learning:
    instruction: "Read the line. What does Priya say about her yoga experience?"
    correct_option: "It's her first time, and she's still learning."
    distractors:
      - "She has done yoga many times before."
      - "She doesn't want to learn yoga."
    accepted_answers: ["It's her first time, and she's still learning."]

  hi.a1.unit01.lesson03.exercise05.order_informal_origin_question:
    instruction: "Put the informal origin question in order."
    correct_response: ["तुम", "कहाँ", "से", "हो"]

  hi.a1.unit01.lesson03.exercise06.order_from_india:
    instruction: "Build the statement of Indian origin."
    correct_response: ["मैं", "भारत", "से", "हूँ"]

  hi.a1.unit01.lesson03.exercise07.order_meet_you_informal:
