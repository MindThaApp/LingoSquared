  hi.a1.unit34.lesson04.teach.safar_ke_sadhan:
    title: से marks the vehicle
    gloss: 'The vehicle takes *से* ("by"): *साइकिल से*, *ट्रेन से*, *कार से*. The noun itself does not change: *मैं साइकिल से काम पर जाता हूँ।*'
    note: 'One pattern is enough for every vehicle: vehicle + *से* + *जाना*.'
