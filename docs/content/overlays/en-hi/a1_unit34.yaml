    title: अक्सर and हर दिन come before the verb
    gloss: 'Time words such as *अक्सर* (often) and *हर दिन* (every day) also work for travel, and they stand before the verb: *मैं अक्सर साइकिल से जाता हूँ*, *मैं हर दिन ट्रेन से सफ़र करता हूँ*.'
