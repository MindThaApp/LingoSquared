    title: Who travels how?
    gloss: Priya travels by train to work every day. Arjun usually cycles, but when it rains he also takes the train. Vikram prefers to drive the car. Neha lives nearby and walks to work. How do you travel to work?
    note: 'Contrasts four ways of getting to work and one condition (rain: *बारिश हो तो*).'
