answer_policy:
  weather_existential: >-
    "Aaj/kal + [weather word] + hai" states the current or a stated day's
    weather -- *dhoop hai* ("it's sunny"), *baarish hai* ("it's raining"),
    *hawa hai* ("it's windy") are each stated as a bare existential
    sentence, not a progressive verb form. A typed answer using the
    correct weather noun with *hai* is accepted; using *hain* where the
    sentence's own subject is singular (or vice versa) is judged as a real
    grammar error, the exact contrast this unit's own grammar_check
    exercises target -- not tolerated as a minor typo.
  garm_invariant_thanda_agrees: >-
    *Garm* ("hot") never changes for gender or number -- "mausam garm hai"
    always uses *garm*. *Thanda*/*thandi* ("cold") DOES change with the
    noun's gender, the same "-a"/"-i" pattern already taught for
    *bada*/*badi* (unit 14) -- masculine *mausam* takes *thanda*, a
    feminine noun would take *thandi*. Every exercise in this unit pairs
    *thanda*/*thandi* with *mausam* only, so only *thanda* is ever actually
    required as a typed answer here; a typed answer using the wrong gender
    form where one IS tested is marked incorrect as a real grammar error,
    not tolerated as a typo.
  kal_context_ambiguity: >-
    *Kal* means both "yesterday" (as taught in units 4/12) and "tomorrow"
    (as used throughout this unit) -- genuinely ambiguous in real Hindi,
    disambiguated only by the sentence's own tense/context. This unit's own
    sentences are all future/plan-making in context, so *kal* consistently
    means "tomorrow" here; don't mark a learner's own free sentence wrong
    merely for using *kal* to mean "yesterday" in a DIFFERENT context than
    this unit's own scenario, since both meanings are equally correct
    Hindi.
  suggestion_pattern: >-
    "Chalo" + a habitual-plural verb form (e.g. *jaate hain*, *chalte
    hain*) makes a "Let's ___" suggestion, the same pattern already used
    for "chalo, kuch khaate hain!" (unit 6) and "chalo, kuch kharidte
    hain!" (unit 7). *Jaate hain* here is the same "-te hain" habitual
    form applied to *jaana* ("to go," unit 15's infinitive), not a new
    verb.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question
    marks (?) may likewise be omitted, but the fully punctuated form
    remains the model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation. For any exercise asking the learner to describe today's
    or tomorrow's weather, accept any of this unit's taught phrasings that
    fit the prompt, not only the single model sentence given in
    `accepted_answers`.

course:
  title: "Hindi A1"

units:
  hi.a1.unit19.weather:
    title: "Weather"

lessons:
  hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa:
    title: "Weather, sun, rain, and wind"
  hi.a1.unit19.lesson02.garam_thanda_baadal:
    title: "Hot, cold, and clouds"
  hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam:
    title: "Priya and Arjun: what's tomorrow's weather like?"

teaching:
  hi.a1.unit19.lesson01.teach.aaj_review:
    title: "Review: today"
    gloss: "today"
    note: "First taught in unit 3 -- this whole unit's own recurring time word, alongside *kal* (tomorrow) in lesson 3."
    example_gloss: "Today is the third."

  hi.a1.unit19.lesson01.teach.mausam:
    title: "Weather"
    gloss: "weather"
    note: "A new noun, this whole unit's topic word. Masculine -- see this unit's own gender-agreement grammar notes."
    example_gloss: "What's the weather like today?"

  hi.a1.unit19.lesson01.teach.kaisa_review:
    title: "Review: what kind of / what's it like"
    gloss: "what kind of / what's it like"
    note: "First taught in unit 12 -- reused here to ask about the weather."
    example_gloss: "What's your house like?"

  hi.a1.unit19.lesson01.teach.hai_hain_review:
    title: "Review: is, are"
    gloss: "is (singular), are (plural)"
    note: "The singular/plural copula pair this unit's whole weather-existential pattern depends on."
    example_gloss:
      - "The weather is good today."
      - "There are three rooms in the house."

  hi.a1.unit19.lesson01.teach.dhoop:
    title: "Sun / sunshine"
    gloss: "sun / sunshine"
    note: "A new noun. Stated as a bare existential: *aaj dhoop hai* = \"it's sunny today\" (literally \"today there is sunshine\")."
    example_gloss: "It's sunny today."

  hi.a1.unit19.lesson01.teach.baarish:
    title: "Rain"
    gloss: "rain"
    note: "A new noun. Stated as a bare existential: *aaj baarish hai* = \"it's raining today\"."
    example_gloss: "It's raining today."

  hi.a1.unit19.lesson01.teach.hawa:
    title: "Wind"
    gloss: "wind"
    note: "A new noun. Stated as a bare existential: *aaj hawa hai* = \"it's windy today\"."
    example_gloss: "It's windy today."

  hi.a1.unit19.lesson01.teach.grammar_mausam_existential:
    title: "The weather-existential pattern"
    gloss: "To describe the weather, say 'aaj/kal + [weather word] + hai' -- e.g. 'aaj dhoop hai', 'aaj baarish hai', 'aaj hawa hai'. This is the same hai/hain pattern already learned for the house (unit 18), but here without a number, directly as the subject."
    note: "This unit's first grammar note, tying the new vocabulary to an already-known sentence pattern."

  hi.a1.unit19.lesson02.teach.mausam_review:
    title: "Review: weather"
    gloss: "weather"
    note: "Reused from this unit's own lesson 1."
    example_gloss: "What's the weather like today?"

  hi.a1.unit19.lesson02.teach.garam:
    title: "Hot"
    gloss: "hot"
    note: "A new adjective. Doesn't change for gender -- see this lesson's own grammar note."
    example_gloss: "The weather is hot today."

  hi.a1.unit19.lesson02.teach.thanda_thandi:
    title: "Cold (masc. / fem.)"
    gloss: "cold (masculine), cold (feminine)"
    note: "A new adjective. DOES change for gender, unlike *garm* -- masculine *mausam* takes *thanda*, feminine nouns (like *rasoi*, unit 18) take *thandi* -- see this lesson's own grammar note."
    example_gloss:
      - "The weather is cold today."
      - "The kitchen is cold today."

  hi.a1.unit19.lesson02.teach.grammar_garam_thanda:
    title: "Invariant vs. gender-agreeing adjectives"
    gloss: "'Garm' is a consonant-ending adjective and doesn't change for gender -- 'mausam garm hai' always uses 'garm'. But 'thanda'/'thandi' is an '-a'-ending adjective that DOES change for gender, just like 'bada'/'badi' (unit 14) -- masculine 'mausam' takes 'thanda', a feminine noun takes 'thandi'."
    note: "This unit's central disclosed grammar contrast, tying a new adjective pair to unit 14's already-taught rule."

  hi.a1.unit19.lesson02.teach.baadal:
    title: "Cloud(s)"
    gloss: "cloud(s)"
    note: "A new noun, used only in its natural plural existential form this unit: *aaj baadal hain* = \"there are clouds today\" / \"it's cloudy today\"."
    example_gloss: "There are clouds today."

  hi.a1.unit19.lesson02.teach.accha_review:
    title: "Review: good"
    gloss: "good"
    note: "First taught in unit 9 -- reused here to describe the weather."
    example_gloss: "The weather is good today."

  hi.a1.unit19.lesson02.teach.bura:
    title: "Bad"
    gloss: "bad"
    note: "A new adjective, paired against the already-taught *accha* (good). Used only in its masculine form this unit, matching *mausam*."
    example_gloss: "The weather is bad today."

  hi.a1.unit19.lesson02.teach.bahut_review:
    title: "Review: very"
    gloss: "very"
    note: "First taught in unit 6 -- reused here to intensify a weather description."
    example_gloss: "The weather is very cold today."

  hi.a1.unit19.lesson03.teach.kal_review:
    title: "Review: tomorrow (also: yesterday)"
    gloss: "tomorrow (also means \"yesterday\" depending on context)"
    note: "First taught in unit 4, reused for \"yesterday\" in unit 12 -- genuinely ambiguous in real Hindi, disambiguated only by context. This unit's own sentences are all future/plan-making, so 'kal' means \"tomorrow\" here."
    example_gloss: "It will rain tomorrow."

  hi.a1.unit19.lesson03.teach.ghar_review:
    title: "Review: house / home"
    gloss: "house / home"
    note: "First taught in unit 8 -- reused here for the resulting plan (stay home)."
    example_gloss: "This is a house."

  hi.a1.unit19.lesson03.teach.mein_review:
    title: "Review: in / at"
    gloss: "in / at"
    note: "First taught in unit 1 -- reused here in \"ghar mein\" (at home)."
    example_gloss: "There are three rooms in the house."

  hi.a1.unit19.lesson03.teach.hum_review:
    title: "Review: we"
    gloss: "we"
    note: "First taught in unit 11 -- reused here as this lesson's plan-making subject."
    example_gloss: "We watch a film."

  hi.a1.unit19.lesson03.teach.rehte_hain_review:
    title: "Review: [they/we] stay / live"
    gloss: "[they/we] stay / live"
    note: "First taught in unit 5 (with a singular grandfather, via masculine-plural respect agreement) -- this unit is the first to use it with a genuinely plural subject, 'hum' (we), the same verb form applied more simply."
    example_gloss: "My grandfather lives in Delhi."

  hi.a1.unit19.lesson03.teach.chalo_review:
    title: "Review: let's / come on"
    gloss: "let's / come on"
    note: "First taught in unit 1, reused in units 6/7/11 with a habitual-plural verb to mean \"Let's ___\" -- reused the same way here."
    example_gloss: "Let's eat something!"

  hi.a1.unit19.lesson03.teach.jaana_review:
    title: "Review: to go"
    gloss: "to go"
    note: "First taught in unit 15 as a bare infinitive -- this lesson extends it to the habitual-plural form 'jaate hain' (we go), the same derivation unit 11 already used for 'dekhte hain'/'peete hain'."
    example_gloss: "I need to go to the station."

  hi.a1.unit19.lesson03.teach.aur_review:
    title: "Review: and"
    gloss: "and"
    note: "First taught in unit 1 -- reused here to join tomorrow's weather and temperature."
    example_gloss: "It will rain tomorrow and the weather will be cold."

  hi.a1.unit19.lesson03.teach.bahar:
    title: "Outside"
    gloss: "outside"
    note: "A new word, this lesson's own resulting-plan vocabulary."
    example_gloss: "Let's go outside!"

  hi.a1.unit19.lesson03.teach.jaate_hain_phrase:
    title: "Let's go outside!"
    gloss: "Let's go outside!"
    note: "'Chalo' + the habitual-plural 'jaate hain' (from 'jaana', to go) -- the same 'Let's ___' pattern already established in units 1/6/7/11."

  hi.a1.unit19.lesson03.teach.dialogue.line01:
    title: "Arjun asks Priya about today's weather"
    gloss: "Priya, what's the weather like today?"
  hi.a1.unit19.lesson03.teach.dialogue.line02:
    title: "Priya describes today's weather"
    gloss: "It's sunny today and the weather is hot."
  hi.a1.unit19.lesson03.teach.dialogue.line03:
    title: "Arjun suggests going outside"
    gloss: "Great! Let's go outside."
  hi.a1.unit19.lesson03.teach.dialogue.line04:
    title: "Priya asks about tomorrow's weather"
    gloss: "OK! And what's tomorrow's weather like?"
  hi.a1.unit19.lesson03.teach.dialogue.line05:
    title: "Arjun describes tomorrow's weather"
    gloss: "It will rain tomorrow and the weather will be cold."
  hi.a1.unit19.lesson03.teach.dialogue.line06:
    title: "Priya suggests staying home"
    gloss: "So we'll stay home tomorrow?"
  hi.a1.unit19.lesson03.teach.dialogue.line07:
    title: "Arjun agrees"
    gloss: "Yes, we'll stay home tomorrow."
  hi.a1.unit19.lesson03.teach.dialogue.line08:
    title: "Priya agrees"
    gloss: "OK!"

  hi.a1.unit19.lesson03.teach.grammar_summary:
    title: "Three main rules"
    gloss: "This unit's three main rules: (1) 'aaj/kal + [weather word] + hai/hain' describes the weather; (2) 'garm' doesn't change for gender, but 'thanda'/'thandi' does, just like 'bada'/'badi'; (3) 'chalo' + a habitual-plural verb (like 'jaate hain') makes a suggestion -- 'chalo, bahar jaate hain!'."
    note: "A closing summary tying the whole unit's grammar together, mirroring unit 15-18's own paradigm-tying grammar note."

  hi.a1.unit19.lesson03.teach.weather_reading:
    title: "Reading about today and tomorrow"
    gloss: "The weather is hot today and it's sunny. Let's go outside! It will rain tomorrow and the weather will be cold. We'll stay home tomorrow."
    note: "A short, direct profile (no new narrative framing) restating exactly the facts already established in the dialogue, no new claims -- directly serves this outcome's own 'read a short weather forecast' requirement."

