teaching:
  hi.a2.unit71.lesson01.teach.skreen:
    title: The screen
    gloss: the screen
    note: '*स्क्रीन* is treated as a feminine noun in everyday Hindi: *मेरी स्क्रीन*, *अपनी स्क्रीन*.'
    example_gloss: I often look at my screen.
  hi.a2.unit71.lesson01.teach.main_apna_phon:
    title: Saying you use your phone often
    gloss: I use my phone often.
    note: '*अक्सर* (often) usually comes before the verb, after the subject and object: *मैं अपना फोन अक्सर इस्तेमाल करता हूँ*. *अपना* (one''s own) refers back to the subject; *फोन* is masculine, so it is *अपना*.'
  hi.a2.unit71.lesson01.teach.tum_soshal_meediya:
    title: Asking how often someone uses social media
    gloss: How often do you use social media?
    note: '*सोशल मीडिया* is used just like in English. *कितनी बार* (literally ''how many times'') asks how often.'
  hi.a2.unit71.lesson02.teach.aip:
    title: The app
    gloss: the app
    note: '*ऐप* is an English loan that is treated as feminine in everyday Hindi: *एक ऐप*, *कौन सी ऐप*.'
    example_gloss: I use an app to chat.
  hi.a2.unit71.lesson02.teach.main_aksar_apne:
    title: Saying you chat with friends
    gloss: I often chat with friends on my phone.
    note: '*चैट करना* (to chat) is a compound verb made of the English loan *चैट* and *करना*. Only *करना* changes: *चैट करता हूँ*, *चैट करते हैं*.'
  hi.a2.unit71.lesson02.teach.tum_kaun_see:
    title: Asking which apps someone uses most
    gloss: Which apps do you use most?
    note: '*सबसे ज्यादा* (the most) is the superlative used here to ask about the top choice. *कौन सी* (which) agrees with the feminine *ऐप*.'
  hi.a2.unit71.lesson03.teach.skreen_taim:
    title: Screen time
    gloss: screen time
    note: '*स्क्रीन टाइम* is a compound of the English loans *स्क्रीन* (screen) and *टाइम* (time). It is masculine: *मेरा स्क्रीन टाइम*.'
    example_gloss: I have too much screen time this week.
  hi.a2.unit71.lesson03.teach.mujhe_lagta_hai:
    title: Giving an opinion about your own screen time
    gloss: I think I have too much screen time.
    note: '*मुझे लगता है कि ...* (I think that ...) is the standard way to introduce an opinion. *लगना* works with *मुझे* (to me): literally ''it seems to me that''.'
  hi.a2.unit71.lesson03.teach.yah_tumharee_ankhon:
    title: Saying something isn't good for your eyes
    gloss: It's not good for your eyes.
    note: '*तुम्हारी आँखें* uses the informal *तुम्हारी* (your), matching this unit''s informal register. *आँखें* is feminine, so the possessive is *तुम्हारी*.'
  hi.a2.unit71.lesson04.teach.adat:
    title: The habit
    gloss: the habit
    note: '*आदत* (habit) is a feminine noun: *बुरी आदत*, *अच्छी आदत*.'
    example_gloss: It's a bad habit to keep checking your phone.
  hi.a2.unit71.lesson04.teach.mere_khayal_se:
    title: Giving an opinion with मेरे खयाल से
    gloss: In my opinion, you should spend less time on your phone.
    note: '*मेरे खयाल से* (in my opinion, literally ''from my thought'') is another standard way to introduce a personal opinion, alongside *मुझे लगता है कि*. *चाहिए* after an infinitive means ''should'': *बिताना चाहिए*.'
  hi.a2.unit71.lesson04.teach.main_isse_sahmat:
    title: Agreeing with someone's opinion
    gloss: I agree with that.
    note: '*सहमत होना* (to agree) is the set phrase: *मैं इससे सहमत हूँ*. *इससे* (''with this'') refers back to what was just said.'
  hi.a2.unit71.lesson05.teach.kaee_log_apna:
    title: Reading a blog post about screen time
    gloss: Many people use their phone more than four hours a day. Social media is fun, but too much screen time isn't healthy. Try spending an hour every evening without your phone. That's good for your eyes and your sleep.
    note: '*बिताने की कोशिश करो* (try to spend ...) shows the usual construction for ''try to'': the infinitive in the form *-ने* + *की* + *कोशिश करना*. With *तुम*, a command ends in *-ो*.'
    glosses:
      कई: many / a lot of
      लोग: people
      इस्तेमाल: use (इस्तेमाल करना means to use)
      अपना: their own (one's own)
      फोन: phone
      ज्यादा: more
      से: than (से ज्यादा means more than)
      चार: four
      घंटे: hour(s)
      दिन: day
      सोशल: social
      मीडिया: media
      है: is, are
      मजेदार: fun / nice
      लेकिन: but
      बहुत: very, a lot (बहुत ज्यादा means too much)
      स्क्रीन: screen (स्क्रीन टाइम = screen time)
      नहीं: not
      सेहत: health (सेहत के लिए अच्छा = healthy)
      कोशिश: try (कोशिश करना means to try)
      हर: every / each
      शाम: evening
      बिना: without
      बिताने: to spend, to pass (time)
      यह: this
      अच्छा: good
      आँखों: eyes
      नींद: sleep
  hi.a2.unit71.lesson06.teach.arjun_tum_soshal:
    title: Arjun asks how often
    gloss: 'Arjun: How often do you use social media, Priya?'
  hi.a2.unit71.lesson06.teach.priya_asal_men:
    title: Priya answers with a number
    gloss: 'Priya: Actually pretty often. I do look at my screen about three hours a day.'
  hi.a2.unit71.lesson06.teach.arjun_yah_to:
    title: Arjun questions the amount
    gloss: 'Arjun: That''s quite a lot. Don''t you think that''s too much?'
  hi.a2.unit71.lesson06.teach.priya_han_mujhe:
    title: Priya agrees it's too much
    gloss: 'Priya: Yes, I actually think it''s too much. I want to spend less time on my phone.'
  hi.a2.unit71.lesson06.teach.arjun_shayad_tum:
    title: Arjun suggests putting the phone away
    gloss: 'Arjun: Maybe you could put your phone away in the evenings.'
  hi.a2.unit71.lesson06.teach.priya_achchha_aidiya:
    title: Priya agrees to try it
    gloss: 'Priya: Good idea. I''ll try that starting today.'
  hi.a2.unit71.lesson06.teach.priya_ko_lagta:
    title: 'Third person: को लगता है, उसका, वह'
    gloss: Priya thinks she has too much screen time. She wants to spend less time on her phone.
    note: '*प्रिया को लगता है* (literally ''to Priya it seems'') is how Hindi says she thinks. *उसका* (her) agrees with the thing owned: *स्क्रीन टाइम* is masculine, so *उसका*. *वह* means she, and the verb shows the gender: *चाहती है* (feminine).'
