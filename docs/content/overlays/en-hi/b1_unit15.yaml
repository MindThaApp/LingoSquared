  hi.b1.unit15.lesson01.teach.grammar_reported_question:
    title: "Reporting a yes/no question"
    gloss: "To report someone's yes/no question: \"X ne poochha ki kya...\" (X asked whether the meeting is tomorrow). \"Poochha\" always stays masculine singular here regardless of who's asking, because its direct object is a whole clause (\"ki...\"), not a noun. This is different from ordinary object agreement, as in \"Priya ne phone khareeda,\" where \"phone\" is a real noun object."
  hi.b1.unit15.lesson01.teach.taiyaar:
    title: "Is ready"
    gloss: "is ready"
    example_gloss: "The report is ready."
  hi.b1.unit15.lesson01.teach.phrase_meeting:
    title: "Arjun asked whether the meeting is tomorrow"
    gloss: "Arjun asked whether the meeting is tomorrow."
  hi.b1.unit15.lesson01.teach.phrase_report:
    title: "Priya asked whether the report is ready"
    gloss: "Priya asked whether the report is ready."

  hi.b1.unit15.lesson02.teach.kab_review:
    title: "Review: when is the meeting"
    gloss: "when the meeting is"
    example_gloss: "When is the meeting?"
  hi.b1.unit15.lesson02.teach.kahaan_review:
    title: "Review: where Priya is"
    gloss: "where Priya is"
    example_gloss: "Where is Priya?"
  hi.b1.unit15.lesson02.teach.grammar_reported_wh_question:
    title: "Reporting a wh-question"
    gloss: "To report a wh-question (when, where, why), just attach the question after \"ki,\" keeping the SAME word order as the direct question: \"X ne poochha ki meeting kab hai\" (word order stays exactly like \"meeting kab hai?\", only \"ki\" is added before it)."
  hi.b1.unit15.lesson02.teach.phrase_meeting_kab:
    title: "Priya asked when the meeting is"
    gloss: "Priya asked when the meeting is."
  hi.b1.unit15.lesson02.teach.phrase_priya_kahaan:
    title: "Arjun asked where Priya is"
    gloss: "Arjun asked where Priya is."

