    example_gloss: "I'm free today."
  hi.b1.unit15.lesson03.teach.reading_passage:
    title: "Reading: the manager's message"
    gloss: "The manager sent a message. He said the report was good. Then he asked whether Arjun could come to tomorrow's meeting. Arjun replied that he would definitely come."
  hi.b1.unit15.lesson03.teach.grammar_ne_diya_bheja_agreement:
    title: "Two kinds of ने-agreement"
    gloss: "\"Manager ne sandesh bheja\" (bheja agrees with sandesh, masc.) and \"Arjun ne jawaab diya\" (diya agrees with jawaab, masc.) both have a real noun object, so the verb agrees with it. This differs from \"usne kaha ki...\" and \"usne poochha ki...,\" where the object is a whole clause and the verb always stays masculine singular."

