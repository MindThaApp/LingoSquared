answer_policy:
  reported_yes_no_question: >-
    "*X ne poochha ki kya*..." (X asked whether...) reports a yes/no
    question. "*Poochha*" stays in the default masculine singular form
    regardless of the asker's own gender, because its direct object is
    the embedded clause itself (*ki*...), not a noun phrase -- contrast
    with an ordinary object-agreement sentence like "*Priya ne phone
    khareeda*," where *phone* is a real object the verb must agree with.
  reported_wh_question: >-
    To report a wh-question (when/where/why), simply attach the
    question after *ki*, keeping the SAME word order as the direct
    question ("*meeting kab hai?*" becomes "*X ne poochha ki meeting kab
    hai*") -- no word-order inversion.
  ne_object_agreement_contrast: >-
    Lesson03 pairs two genuine NP-object agreements ("*manager ne
    sandesh bheja*," "*Arjun ne jawaab diya*," both agreeing with their
    real noun object) against the clause-object "*kaha ki*"/"*poochha
    ki*" forms, which never change for gender -- keep the two patterns
    distinct.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Internal
    commas separating clauses may also be replaced by " and " (और) or
    omitted with a space where noted per exercise.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

