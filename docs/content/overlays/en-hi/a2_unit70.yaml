teaching:
  hi.a2.unit70.lesson01.teach.deree:
    title: The delay
    gloss: the delay
    note: '*देरी* is a feminine noun. *देरी होना* means to be late or delayed: *ट्रेन में देरी है*.'
    example_gloss: There's a delay of ten minutes.
  hi.a2.unit70.lesson01.teach.meree_tren_let:
    title: Reporting your train is delayed
    gloss: My train is delayed.
    note: '*लेट* is the everyday English loan for a train or bus that is running late: *ट्रेन लेट है*. *ट्रेन* is feminine in Hindi, so *मेरी* (not *मेरा*) goes with it.'
  hi.a2.unit70.lesson01.teach.deree_ka_karan:
    title: Asking the reason for a delay
    gloss: What's the reason for the delay?
    note: '*कारण* (reason) is masculine: *देरी का कारण*. The *का* agrees with *कारण*, not with *देरी*.'
  hi.a2.unit70.lesson02.teach.signal_kee_kharabee:
    title: The signal failure
    gloss: the signal failure
    note: '*सिग्नल की खराबी* is the standard way railways describe a signal fault. *खराबी* is feminine, so *की* links it to *सिग्नल*.'
    example_gloss: My train is cancelled because of a signal failure.
  hi.a2.unit70.lesson02.teach.meree_tren_signal:
    title: Reporting your train is cancelled
    gloss: My train is cancelled because of a signal failure.
    note: '*रद्द हो गई* (has been cancelled) is *रद्द* plus *हो गई*. The verb agrees with *ट्रेन*, which is feminine; for a masculine noun it would be *हो गया*: *कार्यक्रम रद्द हो गया*.'
  hi.a2.unit70.lesson02.teach.aglee_tren_kab:
    title: Asking when the next train leaves
    gloss: When does the next train leave?
    note: '*चलना* (to run, to go) is used for trains and buses running on a schedule, not just for walking: *अगली ट्रेन कब चलेगी?* The future *चलेगी* is feminine to match *ट्रेन*.'
  hi.a2.unit70.lesson03.teach.kanekting_tren:
    title: The connection
    gloss: the connection
    note: '*कनेक्टिंग ट्रेन* is the everyday phrase for the next train in a journey that you need to catch.'
    example_gloss: I'm missing my connection in Delhi.
  hi.a2.unit70.lesson03.teach.deree_kee_vajah:
    title: Reporting a missed connection
    gloss: I'm missing my connection because of the delay.
    note: '*छूटना* (to be missed) is a verb with the train as its subject: *मेरी ट्रेन छूट रही है*, literally ''my train is slipping away''. Hindi does not say ''I miss the train'' with a direct object.'
  hi.a2.unit70.lesson03.teach.kya_main_doosree:
    title: Asking about taking another train
    gloss: Can I take another train?
    note: '*दूसरी* (another) agrees with *ट्रेन*, so it is feminine: *दूसरी ट्रेन*. Compare the masculine *दूसरा रास्ता*.'
  hi.a2.unit70.lesson04.teach.poochhtachh_kauntar:
    title: The service desk
    gloss: the service desk
    note: '*पूछताछ काउंटर* is the enquiry counter at a station. *पर* (at) follows the noun: *काउंटर पर*.'
    example_gloss: I'm going to the service desk for help.
  hi.a2.unit70.lesson04.teach.kya_ap_mujhe:
    title: Asking for help with an alternative
    gloss: Can you help me with an alternative connection?
    note: '*क्या आप ... सकते हैं?* is the polite way to ask whether someone can do something. *आप* takes the plural verb *सकते हैं*, even for one person.'
  hi.a2.unit70.lesson04.teach.ap_intarsitee_se:
    title: Being told an alternative route
    gloss: You can travel with the intercity via Agra.
    note: '*होकर* (via, passing through) follows the stopover: *आगरा होकर*. It introduces the intermediate stop of an alternative route.'
  hi.a2.unit70.lesson05.teach.jarooree_soochna_signal:
    title: Reading a disruption notice
    gloss: 'Important notice: due to a signal failure, no trains are running between Delhi and Jaipur. Travelers can reroute via Agra. The delay is expected to last until about three o''clock. We advise travelers to check the journey planner.'
    note: '*तीन बजे तक* means until three o''clock. Indian railway notices often use the 24-hour clock (15:00), but people say *तीन बजे* aloud.'
    glosses:
      जरूरी: important
      सूचना: notice, announcement
      कारण: reason (के कारण = because of)
      खराबी: fault, failure (सिग्नल की खराबी = signal failure)
      चल: run, go (of trains; चल रही है = is running)
      बीच: between
      कोई: no, not any
      ट्रेन: train
      यात्री: travelers, passengers
      सकते: can, are able to
      जा: go, travel (जा सकते हैं = can go)
      होकर: via, by way of
      देरी: delay
      रहेगी: will last (from रहना, to stay)
      तक: until
      लगभग: about, approximately
      तीन: three
      बजे: o'clock; hour
      हम: we
      सलाह: advice (सलाह देना = to advise)
      यात्रियों: travelers, passengers
      प्लानर: journey planner
      देखने: to consult, check
  hi.a2.unit70.lesson06.teach.karmacharee_relve_poochhtachh:
    title: Employee opens the conversation
    gloss: 'Employee: Railway Enquiry, hello. How can I help you?'
  hi.a2.unit70.lesson06.teach.priya_namste_jaypur:
    title: Priya reports the cancellation
    gloss: 'Priya: Hello, my train to Jaipur is cancelled. I''d like to know how to get there now.'
  hi.a2.unit70.lesson06.teach.karmacharee_jee_han:
    title: Employee explains the cause
    gloss: 'Employee: There is indeed a signal failure. You can reroute via Agra.'
  hi.a2.unit70.lesson06.teach.priya_vah_tren:
    title: Priya asks the departure time
    gloss: 'Priya: What time does that train leave?'
  hi.a2.unit70.lesson06.teach.karmacharee_das_minat:
    title: Employee gives the platform and time
    gloss: 'Employee: In ten minutes, from platform four.'
  hi.a2.unit70.lesson06.teach.priya_bahut_dhanyavad:
    title: Priya decides to send a message
    gloss: 'Priya: Thank you. I''ll just send a message that I''m coming later.'
  hi.a2.unit70.lesson06.teach.uskee_tren_radd:
    title: 'उसकी and वह: her and she'
    gloss: Her train is cancelled. She can reroute.
    note: '*उसकी* (her) agrees with the thing owned, not with the owner: *ट्रेन* is feminine, so *उसकी ट्रेन*. *वह* (she or he) is the same for both genders, and the verb shows the gender: *वह जा सकती है* (she can go), *वह जा सकता है* (he can go).'
