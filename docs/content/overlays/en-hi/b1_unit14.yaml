answer_policy:
  habitual_time_clause: >-
    "*Jab* [a habitual/routine action], *to* [its usual follow-up
    action]" -- BOTH clauses in the habitual present tense, for a
    regular routine. Distinct from the past-continuous "*jab*...*raha
    tha*, *tab*..." construction from an earlier unit.
  past_time_clause: >-
    "*Jab* [a completed past event], *to* [the completed event that
    followed]" -- both clauses in the PERFECTIVE past, for two
    sequential completed events (not one continuous background action
    interrupted by another). "*Arjun ne report bheji*" -- the ergative
    *ne* construction agrees with the direct object *report* (feminine:
    *bheji*), never with Arjun.
  habitual_vs_past_contrast: >-
    Lesson03's reading passage puts both registers side by side on
    purpose: "*aamtaur par*..." (usually...) signals the habitual
    register, "*kal jab*..." (yesterday when...) signals the past one --
    the same *jab*...*to* frame works in either tense.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Internal
    commas separating clauses may also be replaced by " and " (और) or
    omitted with a space where noted per exercise.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

course:
  title: "Hindi B1"

units:
  hi.b1.unit14.samay_kram:
    title: "Time sequence"
    description: Describe when one event happens relative to another using a time-clause construction, across everyday routines and past narratives, distinguishing a habitual/present time clause from a past one.

