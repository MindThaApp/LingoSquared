  hi.b1.unit14.lesson03.teach.grammar_contrast:
    title: "Habit vs. a specific past event"
    gloss: "\"Aamtaur par, jab...uthta hai, to...karta hai\" describes a habit (habitual present). \"Kal jab vah utha, to usne...dekha\" describes one specific day's completed event (perfective past). The same jab...to frame works in either tense."

