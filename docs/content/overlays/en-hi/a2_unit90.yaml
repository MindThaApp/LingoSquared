review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  notes: 'English overlay written from the realization. Drafted by Claude Sonnet. Grammar: noun / pronoun + के लिए (मेरे / तुम्हारे / उसके / हमारे लिए), infinitive + के लिए (-ने before के लिए), ताकि + subjunctive (पहुँचूँ, समझो, समझे, खाएँ, पहुँचें, ख़रीदूँ). Priya and Arjun use tum. OPEN NATIVE QUESTIONS: (1) the subjunctive after ताकि is introduced as plain forms (मैं पहुँचूँ, वह समझे) with no theory; is that enough for A2, and is ''ताकि मैं समय पर पहुँचूँ'' the most natural example; (2) is ''मैं दूध लेने के लिए बाज़ार जाता हूँ'' natural, or should it be ''दूध लाने के लिए''; (3) typed answers accept both मैं-dropped and full forms of the second clause (मैं नया फ़ोन ख़रीदूँ / नया फ़ोन ख़रीदूँ): is that right.'
answer_policy:
  punctuation: Hindi text is shown with the danda as the sentence-final mark. In typed answers, accept the danda, a plain period, or the mark omitted entirely as equivalent. Question marks may likewise be omitted.
  gender_agreement: Where the speaker or addressee is a named man or woman, the verb must agree with that person. Where the speaker is just 'I' (gender unspecified), both the masculine and the feminine form are accepted. Wrong agreement with a named person is a real grammar error, not a typo.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation.
course:
  title: Hindi A2
  description: Intermediate Hindi continuing the Priya and Arjun storyline, now with grammar-led units on reasons, sequencing, purpose, conditions, indirect questions and passing on messages.
units:
  hi.a2.unit90.paise_bachane_ke_liye:
    title: To Save Money
    description: Say what you do something for, using के लिए with nouns and infinitives and ताकि with a short clause.
