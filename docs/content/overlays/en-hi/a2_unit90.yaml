teaching:
  hi.a2.unit90.paise_bachane_ke_liye.lesson01.teach.shabd_liye:
    title: Words for purpose
    gloss: for / market / milk / gift / mother
    note: '*तुम्हारे लिए* = for you; *मेरे लिए* = for me.'
    example_gloss:
    - This gift is for you. (to a friend)
    - I go to the market for milk. (man speaking)
    - Priya makes tea for her mother.
  hi.a2.unit90.paise_bachane_ke_liye.lesson01.teach.gn_liye_sarvanam:
    title: के लिए with pronouns
    gloss: This gift is for you. This tea is for me. This milk is for him or her. This food is for us.
    note: 'The pronoun changes before *के लिए*: *मैं → मेरे*, *तुम → तुम्हारे*, *वह → उसके*, *हम → हमारे*.'
  hi.a2.unit90.paise_bachane_ke_liye.lesson01.teach.gn_liye_sangya:
    title: के लिए with a noun
    gloss: I go to the market for milk. Priya makes tea for her mother.
    note: A noun goes directly before *के लिए*. It names the thing you go for or the person you do it for.
  hi.a2.unit90.paise_bachane_ke_liye.lesson02.teach.shabd_kriya:
    title: Words for goals
    gloss: to learn / English / class / book / to buy / to study / to take
    note: '*लेना* here means to get (milk).'
    example_gloss:
    - I go to class to learn English. (woman speaking)
    - Arjun goes to the market to get milk.
    - Priya buys a book to study.
  hi.a2.unit90.paise_bachane_ke_liye.lesson02.teach.gn_kriya_liye:
    title: Verb + के लिए
    gloss: Arjun goes to the market to get milk. Priya buys a book to study.
    note: 'Before *के लिए* the infinitive ends in *-ने*: *लेना → लेने*, *पढ़ना → पढ़ने*, *सीखना → सीखने*. It means in order to.'
  hi.a2.unit90.paise_bachane_ke_liye.lesson02.teach.gn_sangya_ya_kriya:
    title: Noun or verb
    gloss: I go to the market for milk. I go to the market to get milk.
    note: With a noun use *दूध के लिए*. With a verb use *लेने के लिए*. The meaning is the same.
  hi.a2.unit90.paise_bachane_ke_liye.lesson03.teach.shabd_taaki:
    title: Words for so that
    gloss: so that / on time / slowly / to speak / to understand / together
    note: '*ताकि* joins two clauses: what you do, and why.'
    example_gloss:
    - I get up early so that I arrive on time. (man speaking)
    - Priya speaks slowly so that Arjun understands.
    - We cook together so that we eat early.
    - We get up early so that we arrive on time.
    - I speak slowly so that you understand. (man speaking)
  hi.a2.unit90.paise_bachane_ke_liye.lesson03.teach.gn_taaki:
    title: ताकि + a new clause
    gloss: I get up early so that I arrive on time. Priya speaks slowly so that Arjun understands.
    note: 'After *ताकि* the second clause has its own subject. Its verb is not the usual present form: *पहुँचूँ*, *समझे*.'
  hi.a2.unit90.paise_bachane_ke_liye.lesson03.teach.gn_taaki_rup:
    title: Forms after ताकि
    gloss: so that I arrive; so that you understand; so that he or she understands; so that we eat; so that we arrive
    note: 'Learn these endings: *मैं -ऊँ*, *तुम -ओ*, *वह -ए*, *हम -एँ*. *पहुँचना → मैं पहुँचूँ, हम पहुँचें*.'
  hi.a2.unit90.paise_bachane_ke_liye.lesson04.teach.shabd_paise:
    title: Words for saving
    gloss: money / to save / new phone / to eat out / less
    note: '*पैसे* is plural (masculine), so verbs agree in the plural.'
    example_gloss:
    - I save money to buy a new phone. (man speaking)
    - To save money we eat out less.
    - Priya saves money so that she buys a new phone.
  hi.a2.unit90.paise_bachane_ke_liye.lesson04.teach.gn_pehle_uddeshya:
    title: Purpose first or last
    gloss: To save money we eat out less. I save money so that I buy a new phone.
    note: The purpose with *के लिए* can come first. With *ताकि* it follows the main clause.
  hi.a2.unit90.paise_bachane_ke_liye.lesson04.teach.gn_liye_ya_taaki:
    title: के लिए or ताकि
    gloss: I save money to buy a phone. I save money so that I buy a phone.
    note: When the same person does both things, *-ने के लिए* is simpler. *ताकि* is used when the second clause has its own subject or its own full verb.
  hi.a2.unit90.paise_bachane_ke_liye.lesson05.teach.shabd_diary:
    title: Words for the diary
    gloss: every / Saturday / so
    note: '*हर शनिवार* = every Saturday.'
    example_gloss:
    - I go to class every Saturday. (man speaking)
    - I eat out less, so I save money. (man speaking)
  hi.a2.unit90.paise_bachane_ke_liye.lesson05.teach.padho_diary:
    title: Arjun writes about his goals
    gloss: I save money to buy a new phone. So I eat out less. Every Saturday I go to class to learn English. I get up early so that I arrive on time. Arjun
    note: Find the three purposes and what Arjun does for each one.
  hi.a2.unit90.paise_bachane_ke_liye.lesson06.teach.d1:
    title: Priya asks why
    gloss: 'Priya: Arjun, why will you go to the market tomorrow?'
  hi.a2.unit90.paise_bachane_ke_liye.lesson06.teach.d2:
    title: Arjun answers
    gloss: 'Arjun: I will go to the market to buy a book.'
  hi.a2.unit90.paise_bachane_ke_liye.lesson06.teach.d3:
    title: Priya asks more
    gloss: 'Priya: Who is the book for?'
  hi.a2.unit90.paise_bachane_ke_liye.lesson06.teach.d4:
    title: Arjun explains
    gloss: 'Arjun: It is for you. I will go early so that I arrive on time.'
  hi.a2.unit90.paise_bachane_ke_liye.lesson06.teach.d5:
    title: Priya thanks him
    gloss: 'Priya: Thank you, Arjun!'
