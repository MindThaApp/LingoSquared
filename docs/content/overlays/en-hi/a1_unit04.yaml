answer_policy:
  nasalization_marks: >-
    Display and teach the correct chandrabindu/anusvara distinction.
    This unit's own new vocabulary needs no new nasalization-mark
    decisions -- it only reuses already-settled spellings (पाँच's
    chandrabindu from unit02, नहीं/हैं's anusvara from units 01/03).
    In typed A1 answers, accept a variant that drops a nasalization
    mark entirely or substitutes anusvara for chandrabindu when every
    other character is correct. Do not extend this tolerance to a
    wrong vowel or consonant, which changes the actual word.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question
    marks (?) and exclamation marks may likewise be omitted, but the
    fully punctuated form remains the model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    (aap vs. tum) rather than written punctuation or nasalization marks.

course:
  title: "Hindi A1"

units:
  hi.a1.unit04.time:
    title: "Time"

lessons:
  hi.a1.unit04.lesson01.kitne_baje_hain:
    title: "What time is it?"
  hi.a1.unit04.lesson02.din_ka_samay:
    title: "Times of day"
  hi.a1.unit04.lesson03.agli_class_ka_samay:
    title: "The time of the next class"

teaching:
  hi.a1.unit04.lesson01.teach.baje:
    title: "O'clock"
    gloss: "o'clock (two or more)"
    note: "Used with any hour except one -- see the special form for *one o'clock* later in this lesson."
    example_gloss: "It's five o'clock now."

  hi.a1.unit04.lesson01.teach.abhi:
    title: "Now"
    gloss: "now"
    note: "A simple time word you'll use constantly when telling the current time."
    example_gloss: "It's ten o'clock now."

  hi.a1.unit04.lesson01.teach.ek_do_teen:
    title: "One, two, three"
    gloss: "one, two, three"
    note: >-
      Reused from unit 2, needed here to tell time -- notice *ek* takes
      the special *baja*, while *do* and *teen* take the regular *baje*.
    example_gloss:
      - "It's one o'clock now."
      - "It's two o'clock now."
      - "It's three o'clock now."

  hi.a1.unit04.lesson01.teach.chaar_paanch_chhah:
    title: "Four, five, six"
    gloss: "four, five, six"
    note: "Reused from unit 2 -- all three take the regular *baje*."
    example_gloss:
      - "It's four o'clock now."
      - "It's five o'clock now."
      - "It's six o'clock now."

  hi.a1.unit04.lesson01.teach.saat_aath_nau:
    title: "Seven, eight, nine"
    gloss: "seven, eight, nine"
    note: "Reused from unit 2."
    example_gloss:
      - "It's seven o'clock now."
      - "It's eight o'clock now."
      - "It's nine o'clock now."

  hi.a1.unit04.lesson01.teach.das_gyaarah_baarah:
    title: "Ten, eleven, twelve"
    gloss: "ten, eleven, twelve"
    note: "Reused from unit 2 -- the last of the hour numbers you'll need."
    example_gloss:
      - "It's ten o'clock now."
      - "It's eleven o'clock now."
      - "It's twelve o'clock now."

  hi.a1.unit04.lesson01.teach.baja_grammar_note:
    title: "Baja vs. baje"
    gloss: "*Baja* goes with *one*, *baje* goes with every other number: *ek baja hai*, *do baje hain*."
    note: >-
      A real, load-bearing agreement exception, not a simplification --
      *ek baja hai* is the only hour that uses the singular form.

  hi.a1.unit04.lesson01.teach.kitne_baje_hain:
    title: "Asking the time"
    gloss: "What time is it?"
    note: "Literally \"how many o'clock are there\" -- the standard way to ask the time."

  hi.a1.unit04.lesson01.teach.abhi_paanch_baje_hain:
    title: "Telling the time"
    gloss: "It's five o'clock now."
    note: "The natural full-sentence answer to *Kitne baje hain?*"

  hi.a1.unit04.lesson02.teach.yoga_class_reprise:
    title: "Yoga class"
    gloss: "yoga class"
    note: "Reused from unit 1 -- this lesson's running example for scheduling."
    example_gloss: "Yoga class is today."

  hi.a1.unit04.lesson02.teach.subah:
    title: "Morning"
    gloss: "morning"
    note: "One of four time-of-day words this lesson teaches."
    example_gloss: "Yoga class is in the morning."

  hi.a1.unit04.lesson02.teach.dopahar:
    title: "Afternoon / noon"
    gloss: "afternoon, noon"
    note: "Covers both midday (noon) and the early afternoon."
    example_gloss: "There's no class in the afternoon."

  hi.a1.unit04.lesson02.teach.shaam:
    title: "Evening"
    gloss: "evening"
    note: "The stretch of day after *dopahar* and before *raat*."
    example_gloss: "The next class is at five in the evening."

  hi.a1.unit04.lesson02.teach.raat:
    title: "Night"
    gloss: "night"
    note: "The last of the four time-of-day words."
    example_gloss: "There's no class at night."

  hi.a1.unit04.lesson02.teach.ko_reprise:
    title: "Ko with a general time"
    gloss: "*Ko* goes with a time-of-day word when no specific hour is given: *dopahar ko*, *raat ko*."
    note: >-
      The same *ko* that marks a day of the week (unit 3) now marking a
      general time period -- a real, natural construction, not the only
      one this unit teaches (see the next note for the specific-hour form).

  hi.a1.unit04.lesson02.teach.time_of_day_baje_note:
    title: "A time-of-day word directly before baje"
    gloss: "For a specific hour, the time-of-day word goes directly before *baje*, with nothing in between: *subah saat baje*, *shaam paanch baje*."
    note: >-
      No *ko* here -- that's reserved for a general time period without
      a specific hour, as the previous note explains.

  hi.a1.unit04.lesson02.teach.class_kitne_baje_hai:
    title: "Asking when class is"
    gloss: "What time is class?"
    note: "The same *kitne baje* pattern from lesson 1, now asking about an event instead of the current time."

  hi.a1.unit04.lesson02.teach.class_subah_saat_baje_hai:
    title: "Stating an event's time"
    gloss: "Class is at seven in the morning."
    note: "Combines *subah* directly with *saat baje*, per the grammar note above."

  hi.a1.unit04.lesson03.teach.kal:
    title: "Tomorrow / yesterday"
    gloss: "tomorrow, yesterday"
    note: >-
      Hindi uses one word for both -- context (and the verb tense) tells
      you which is meant. In this lesson it always means "tomorrow."
    example_gloss: "Class is at five in the evening tomorrow."

  hi.a1.unit04.lesson03.teach.agli_reprise:
    title: "Next"
    gloss: "next"
    note: "Reused from unit 3 -- feminine form, agreeing with feminine *class*."
    example_gloss: "The next class is tomorrow."

  hi.a1.unit04.lesson03.teach.theek_hai_shukriya_reprise:
    title: "Okay, thanks"
    gloss: "Okay, thanks!"
    note: "Both words reused from unit 1's own farewell vocabulary."

  hi.a1.unit04.lesson03.teach.milte_hain_reprise:
    title: "We'll meet / see you"
    gloss: "we'll meet / see you"
    note: "Reused from unit 3's closing farewell, now paired with *kal* for \"see you tomorrow.\""

  hi.a1.unit04.lesson03.teach.agli_class_kitne_baje_hai:
    title: "Asking when the next class is"
    gloss: "What time is the next class?"
    note: "Combines *agli* (feminine, agreeing with class) with this unit's own *kitne baje* pattern."

  hi.a1.unit04.lesson03.teach.agli_class_shaam_paanch_baje_hai:
    title: "Stating the next class's time"
    gloss: "The next class is at five in the evening."
    note: "The natural full-sentence answer to the question above."

  hi.a1.unit04.lesson03.teach.kal_milte_hain:
    title: "Closing with a plan to meet tomorrow"
    gloss: "Okay, see you tomorrow!"
    note: "The natural way to close a conversation once a time has been agreed."

  hi.a1.unit04.lesson03.teach.dialogue.line01:
    title: "Arjun asks about the next class"
    gloss: "Arjun asks what time the next class is."
    note: "Reuses this lesson's own question exactly."
  hi.a1.unit04.lesson03.teach.dialogue.line02:
    title: "Priya gives the time"
    gloss: "Priya says the next class is at five in the evening."
    note: "Reuses this lesson's own answer sentence exactly."
  hi.a1.unit04.lesson03.teach.dialogue.line03:
    title: "Arjun thanks her"
    gloss: "Arjun says okay, thanks."
    note: "Reused from unit 1's vocabulary."
  hi.a1.unit04.lesson03.teach.dialogue.line04:
    title: "Priya closes the conversation"
    gloss: "Priya agrees and says see you tomorrow."
    note: "Reuses this lesson's own closing line exactly."

exercises:
  hi.a1.unit04.lesson01.exercise01.select_paanch_baje:
    instruction: "Which shows 5 o'clock?"
    correct_option: "पाँच बजे"
    distractors: ["दो बजे", "नौ बजे"]
    accepted_answers: ["पाँच बजे"]

  hi.a1.unit04.lesson01.exercise02.select_baarah_baje:
    instruction: "Which shows 12 o'clock?"
    correct_option: "बारह बजे"
    distractors: ["दस बजे", "एक बजा"]
    accepted_answers: ["बारह बजे"]

  hi.a1.unit04.lesson01.exercise03.select_kitne_baje_hain_meaning:
    instruction: "What does this question ask?"
    correct_option: "What time is it?"
    distractors: ["What day is it today?", "What is the date today?"]
    accepted_answers: ["What time is it?"]

  hi.a1.unit04.lesson01.exercise04.match_hours:
    instruction: "Match each Hindi time to its English meaning."
    correct_response:
      "एक बजा": "1 o'clock"
      "दो बजे": "2 o'clock"
      "तीन बजे": "3 o'clock"
