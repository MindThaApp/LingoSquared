      "पाँच बजे": "5 o'clock"
      "छह बजे": "6 o'clock"
      "सात बजे": "7 o'clock"
      "आठ बजे": "8 o'clock"
      "नौ बजे": "9 o'clock"
      "दस बजे": "10 o'clock"
      "ग्यारह बजे": "11 o'clock"
      "बारह बजे": "12 o'clock"

  hi.a1.unit04.lesson01.exercise05.order_kitne_baje_hain:
    instruction: "Put the question in order: What time is it?"
    correct_response: ["कितने", "बजे", "हैं"]

  hi.a1.unit04.lesson01.exercise06.order_abhi_paanch_baje_hain:
    instruction: "Put the sentence in order: It's five o'clock now."
    correct_response: ["अभी", "पाँच", "बजे", "हैं"]

  hi.a1.unit04.lesson01.exercise07.fill_current_hour:
    instruction: "Complete the sentence: it's ten o'clock now."
    accepted_answers: ["दस"]
