teaching:
  hi.a2.unit91.agar_baarish_hogi_to.lesson01.teach.shabd_agar:
    title: Words for conditions
    gloss: if / then / it will rain / it will be sunny / we will stay at home / we will go to the park / tomorrow
    note: '*अगर* starts the condition and *तो* starts the result.'
    example_gloss:
    - If it rains tomorrow, we will stay at home.
    - If it is sunny tomorrow, we will go to the park.
    - If Priya comes, Arjun will make tea.
  hi.a2.unit91.agar_baarish_hogi_to.lesson01.teach.gn_agar_to:
    title: अगर ... तो ... with the future
    gloss: If it rains tomorrow, we will stay at home. If it is sunny tomorrow, we will go to the park.
    note: 'For something that may really happen, use *अगर* + future, then *तो* + future. *बारिश* is feminine: *होगी*. *धूप* is feminine too.'
  hi.a2.unit91.agar_baarish_hogi_to.lesson01.teach.gn_agar_baad:
    title: The condition can come last
    gloss: We will stay at home if it rains tomorrow. We will go to the park if it is sunny tomorrow.
    note: If the *अगर* clause comes second, *तो* is not used.
  hi.a2.unit91.agar_baarish_hogi_to.lesson02.teach.shabd_thake:
    title: Words for present conditions
    gloss: tired (m) / tired (f) / need / fever / rest / call
    note: '*थके हो* is for a man you call *तुम*; *थकी हो* is for a woman.'
    example_gloss:
    - If you are tired, rest. (to a man, friend)
    - If you have a fever, go to the doctor. (to a friend)
    - If you need something, call me. (to a friend)
  hi.a2.unit91.agar_baarish_hogi_to.lesson02.teach.gn_agar_vartaman:
    title: A condition that is true now
    gloss: If you have a fever, go to the doctor. If you need something, call me.
    note: 'If the condition is true now, use the present after *अगर*. The result can be a command: *जाओ*, *करो*.'
  hi.a2.unit91.agar_baarish_hogi_to.lesson02.teach.gn_thake_thaki:
    title: थके or थकी
    gloss: If you are tired, rest. (to a man) If you are tired, rest. (to a woman)
    note: 'The adjective agrees with the person: *थके हो* for a man, *थकी हो* for a woman.'
  hi.a2.unit91.agar_baarish_hogi_to.lesson03.teach.shabd_dukaan:
    title: Words for shop rules
    gloss: shop / item, goods / faulty / receipt / to return / money back / you have / you will get
    note: In a shop people use *आप*. *आपके पास रसीद है* = you have a receipt.
    example_gloss:
    - If the item is faulty, you can return it.
    - If you have the receipt, you will get your money back.
    - If you come tomorrow, the shop will be open.
  hi.a2.unit91.agar_baarish_hogi_to.lesson03.teach.gn_dukaan_sakna:
    title: A rule with सकते हैं
    gloss: If the item is faulty, you can return it.
    note: 'Shops use *आप* and *सकते हैं* (can). The condition is in the present: *ख़राब है*.'
  hi.a2.unit91.agar_baarish_hogi_to.lesson03.teach.gn_dukaan_milna:
    title: The result in the future
    gloss: If you have the receipt, you will get your money back.
    note: '*आपको … मिलेंगे* = you will get. The condition is present (*रसीद है*), the result is future.'
  hi.a2.unit91.agar_baarish_hogi_to.lesson04.teach.shabd_nahin:
    title: Words for negative conditions
    gloss: picnic / alone (m) / alone (f) / weather / good / we will eat / not
    note: '*अकेला* is for a man, *अकेली* for a woman.'
    example_gloss:
    - If it does not rain, we will go on a picnic.
    - If you do not come, I will go alone. (man speaking, to a man)
    - If the weather is good, we will eat outside.
    - If Priya does not come, I will go alone. (man speaking)
  hi.a2.unit91.agar_baarish_hogi_to.lesson04.teach.gn_agar_nahin:
    title: A negative condition
    gloss: If it does not rain, we will go on a picnic. If Priya does not come, I will go alone.
    note: 'Put *नहीं* before the verb inside the *अगर* clause: *नहीं होगी*, *नहीं आएगी*.'
  hi.a2.unit91.agar_baarish_hogi_to.lesson04.teach.gn_akela_akeli:
    title: अकेला or अकेली
    gloss: If you do not come, I will go alone (man). If you do not come, I will go alone (woman).
    note: '*तुम आओगे* (to a man) and *तुम आओगी* (to a woman) differ. *अकेला / अकेली* and *जाऊँगा / जाऊँगी* agree with the speaker.'
  hi.a2.unit91.agar_baarish_hogi_to.lesson05.teach.shabd_plan:
    title: Words for the plan
    gloss: film / we will watch / I will bring (woman) / food
    note: '*फ़िल्म देखना* = to watch a film.'
    example_gloss:
    - We will watch a film at home.
    - I will bring food. (woman speaking)
  hi.a2.unit91.agar_baarish_hogi_to.lesson05.teach.padho_plan:
    title: Priya writes to Arjun
    gloss: Arjun, if the weather is good tomorrow, we will go on a picnic. If it rains, we will stay at home and watch a film. If you come, I will bring food. Priya
    note: Find both plans and the condition for each.
  hi.a2.unit91.agar_baarish_hogi_to.lesson06.teach.d1:
    title: Arjun asks
    gloss: 'Arjun: Priya, if it rains tomorrow, what will you do?'
  hi.a2.unit91.agar_baarish_hogi_to.lesson06.teach.d2:
    title: Priya answers
    gloss: 'Priya: If it rains, I will stay at home and watch a film.'
  hi.a2.unit91.agar_baarish_hogi_to.lesson06.teach.d3:
    title: Arjun asks again
    gloss: 'Arjun: And if it is sunny?'
  hi.a2.unit91.agar_baarish_hogi_to.lesson06.teach.d4:
    title: Priya asks
    gloss: 'Priya: If it is sunny, I will go to the park. Will you come?'
  hi.a2.unit91.agar_baarish_hogi_to.lesson06.teach.d5:
    title: Arjun agrees
    gloss: 'Arjun: Yes, if I come early from the office, I will certainly come.'
