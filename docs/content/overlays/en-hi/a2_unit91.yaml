  required_next_reviewer: native_speaker_review
  notes: 'English overlay written from the realization. Drafted by Claude Sonnet. Grammar: real conditions with अगर ... तो; future in both clauses (अगर कल बारिश होगी, तो हम घर पर रहेंगे), present condition + imperative (अगर तुम थके हो, तो आराम करो), shop rules with आप, negative conditions (अगर बारिश नहीं होगी), agreement of थके / थकी, अकेला / अकेली. Only real conditions; no unreal conditions (अगर ... होता). Priya and Arjun use tum; shop rules use आप. OPEN NATIVE QUESTIONS: (1) the unit uses the future after अगर (अगर बारिश होगी) rather than the very common अगर बारिश हुई; is the future form natural enough for beginners, and should अगर बारिश हुई तो be added; (2) is dropping तो acceptable (typed answers accept both); (3) is ''अगर आपके पास रसीद है, तो आपको पैसे वापस मिलेंगे'' natural for a shop rule.'
answer_policy:
  punctuation: Hindi text is shown with the danda as the sentence-final mark. In typed answers, accept the danda, a plain period, or the mark omitted entirely as equivalent. Question marks may likewise be omitted.
  gender_agreement: Where the speaker or addressee is a named man or woman, the verb must agree with that person. Where the speaker is just 'I' (gender unspecified), both the masculine and the feminine form are accepted. Wrong agreement with a named person is a real grammar error, not a typo.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation.
course:
  title: Hindi A2
  description: Intermediate Hindi continuing the Priya and Arjun storyline, now with grammar-led units on reasons, sequencing, purpose, conditions, indirect questions and passing on messages.
units:
