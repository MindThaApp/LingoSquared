  hi.b1.unit17.lesson03.teach.grammar_sakte_the_softened_suggestion:
    title: "*Sakte the* -- a softened suggestion alone"
    gloss: "\"*Sakte the*\" (masc.) / \"*sakti thin*\" (fem.) alone states a softened suggestion or mild regret -- \"*tum thoda aaraam kar sakte the*\" means \"you could have rested, but didn't,\" with no if-clause added."
  hi.b1.unit17.lesson03.teach.phrase_chahoongi_aaraam:
    title: "I would like you to rest a little -- you could have rested"
    gloss: "I would like you to rest a little -- you could have rested."

