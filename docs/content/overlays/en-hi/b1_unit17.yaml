    gloss: "would have gotten (feminine)"
    example_gloss: "I would have gotten the job."
  hi.b1.unit17.lesson01.teach.grammar_ergative_unreal_past:
    title: "Unreal past condition with a *ne*-ergative verb"
    gloss: "\"[subject] + *ne* + [verb]-*i*/*aa* + *hoti*/*hota*\" states an unreal past condition. The verb form is decided by the grammatical OBJECT's gender, not the *ne*-marked subject: \"*mehnat*\" is feminine, so \"*ki hoti*\" -- whether \"*maine*\" refers to a man or a woman makes no difference."
  hi.b1.unit17.lesson01.teach.phrase_maine_mehnat:
    title: "If I had worked harder, I would have gotten the job"
    gloss: "If I had worked harder, I would have gotten the job."
  hi.b1.unit17.lesson01.teach.usne_kiya_hota:
    title: "Review: would have done (counterfactual)"
    gloss: "he/she would have done ___ (counterfactual past)"
    example_gloss: "If he had tried, he would have won."
  hi.b1.unit17.lesson01.teach.prayaas:
    title: "Effort / attempt"
    gloss: "effort / attempt"
    example_gloss: "He made only one attempt."
  hi.b1.unit17.lesson01.teach.pariksha_pass:
    title: "Would have passed the exam"
    gloss: "would have passed the exam"
    example_gloss: "He passed the exam."
  hi.b1.unit17.lesson01.teach.grammar_masculine_object_contrast:
    title: "Compare: masculine object"
    gloss: "Compare: \"*Agar usne prayaas kiya hota, to vah pariksha mein paas ho jaata*.\" Here the object \"*prayaas*\" is masculine, so \"*kiya hota*\" is masculine -- same rule, just a different object gender."
  hi.b1.unit17.lesson01.teach.phrase_usne_prayaas:
    title: "If he had made the effort, he would have passed the exam"
    gloss: "If he had made the effort, he would have passed the exam."

  hi.b1.unit17.lesson02.teach.kaash:
    title: "If only / I wish"
    gloss: "if only / I wish"
    example_gloss: "If only I were there."
  hi.b1.unit17.lesson02.teach.paisa_bachaya_hota:
    title: "Had saved money"
    gloss: "had saved money"
    example_gloss: "If only I had saved money."
  hi.b1.unit17.lesson02.teach.ghar_khareed_lete:
    title: "Would have bought a house"
    gloss: "would have bought a house"
    example_gloss: "We would have bought a house."
  hi.b1.unit17.lesson02.teach.grammar_kaash_wish:
    title: "*Kaash* -- alone or with *agar*"
    gloss: "\"*Kaash*\" alone states an unreal wish or regret (\"*kaash aisa hota*\" -- \"if only it were so\"), and it can also lead a full sentence: \"*kaash mainne paisa bachaya hota, to hum ghar khareed lete*.\""
  hi.b1.unit17.lesson02.teach.phrase_paisa_bachaya:
    title: "If only I had saved money, we would have bought a house"
    gloss: "If only I had saved money, we would have bought a house."
  hi.b1.unit17.lesson02.teach.samay_par_bataya_hota:
    title: "Had told in time"
    gloss: "had told in time"
    example_gloss: "If only you had told me in time."
  hi.b1.unit17.lesson02.teach.madad_kar_dete:
    title: "Would have helped"
    gloss: "would have helped"
    example_gloss: "We would have helped."
  hi.b1.unit17.lesson02.teach.grammar_tumne_object_agreement:
    title: "No real object -- default masculine"
    gloss: "In \"*tumne samay par bataya hota*\" the object is not a real noun but a hidden idea/statement, so the verb stays in the default masculine singular (*bataya*) -- the same rule learned earlier for \"*kaha*\"/\"*poochha*\"."
  hi.b1.unit17.lesson02.teach.phrase_samay_par_bataya:
    title: "If only you had told me in time, we would have helped"
    gloss: "If only you had told me in time, we would have helped."

  hi.b1.unit17.lesson03.teach.main_tum_ki:
