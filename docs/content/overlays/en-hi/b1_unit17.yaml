answer_policy:
  ergative_unreal_past: >-
    "[subject] + *ne* + [verb]-*i*/*aa* + *hoti*/*hota*" states an unreal
    past condition built on a transitive perfective verb. The verb form
    agrees with the grammatical OBJECT's gender, never the *ne*-marked
    subject: "*maine mehnat KI hoti*" (मेहनत is feminine) vs. "*usne
    prayaas KIYA hota*" (प्रयास is masculine) -- same rule, object gender
    just differs.
  kaash_wish: >-
    "*Kaash*" ("if only"/"I wish") can stand alone as an unreal wish or
    lead a full *kaash*...*hota*, *to*... sentence pairing an unreal
    past condition with its unreal past result.
  softened_conditional_alone: >-
    "*Main chahoonga/chahoongi ki*..." ("I would like...") softens a
    request or preference with NO if-clause at all -- distinct from
    *chahiye* (unit01), which marks obligation/necessity, not a softened
    wish. "*Sakte the*" (masc.) / "*sakti thin*" (fem., with *tum*) alone expresses a
    softened suggestion or mild regret ("could have ___, but didn't"),
    also with no if-clause.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Internal
    commas separating clauses may also be replaced by " and " (और) or
    omitted with a space where noted per exercise.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

course:
  title: "Hindi B1"

units:
  hi.b1.unit17.kaash_hota:
    title: "If Only"
    description: Express hypothetical or unreal situations and wishes using a conditional-mood construction ("would" + verb) together with an unreal "if"-clause in a past/irrealis form, and use the conditional alone to soften a suggestion, request, or preference.

