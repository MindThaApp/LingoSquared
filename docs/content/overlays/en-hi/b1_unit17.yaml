    title: "Would like (masc. speaker)"
    gloss: "would like (masculine speaker)"
    example_gloss: "I would like you to come early."
  hi.b1.unit17.lesson03.teach.kaam_jaldi_bhejo:
    title: "Send the work soon"
    gloss: "send the work soon"
    example_gloss: "Please send the work soon."
  hi.b1.unit17.lesson03.teach.grammar_chahoonga_softener:
    title: "*Chahoonga* -- a softener alone"
    gloss: "\"*Main chahoonga ki*...\" is not an if-sentence -- it alone softens a request or preference, just as English \"I would like...\" is more polite than a direct command. This differs from the earlier \"*chahiye*\" (necessity/duty) -- \"*chahoonga*\" just softly states a wish, with no obligation."
  hi.b1.unit17.lesson03.teach.phrase_chahoonga:
    title: "I would like you to send the work soon"
