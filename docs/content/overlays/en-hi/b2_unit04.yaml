  hi.b2.unit04.lesson01.teach.grammar_prishthbhoomi:
    title: "That day, Priya was working from home. Outside, it was raining, and everything was calm."
    gloss: "That day, Priya was working from home. Outside, it was raining, and everything was calm."
    note: "This is the BACKGROUND of the story -- the ongoing situation before anything happens. The continuous past (*कर रही थी*, *हो रही थी*) sets the scene; the next lesson introduces the event that interrupts it."

  hi.b2.unit04.lesson02.teach.achanak:
    title: suddenly
    gloss: suddenly
    example_gloss: "Suddenly the rain started."
  hi.b2.unit04.lesson02.teach.bijli:
    title: "power / electricity"
    gloss: "power / electricity"
    note: "*बिजली* is grammatically feminine, so *चली गई* ('went away') agrees with it."
    example_gloss: "The power went out last night."
  hi.b2.unit04.lesson02.teach.usi_samay:
    title: "at that very moment"
    gloss: "at that very moment"
  hi.b2.unit04.lesson02.teach.phone:
    title: phone
    gloss: phone
    note: "*फोन* is grammatically masculine, so *बजा* ('rang') agrees with it -- opposite gender from *बिजली*."
