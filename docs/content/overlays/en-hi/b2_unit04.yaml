  hi.b2.unit04.lesson02.teach.bajna:
    title: "started to ring"
    gloss: "started to ring"
  hi.b2.unit04.lesson02.teach.ghabrana:
    title: "to get flustered / panic"
    gloss: "to get flustered / to panic"
