  hi.b2.unit04.lesson02.teach.grammar_ghatna:
    title: "Suddenly the power went out. At that very moment the phone also started ringing. Priya got flustered."
    gloss: "Suddenly the power went out. At that very moment the phone also started ringing. Priya got flustered."
    note: "This is the FOREGROUNDED, interrupting event -- told with the simple past (*चली गई*, *बजने लगा*, *घबरा गई*), not the continuous past used for background in lesson01."

  hi.b2.unit04.lesson03.teach.jab_tab:
    title: "when..., then..."
    gloss: "when..., then..."
