course:
  title: Hindi B2
  description: >-
    Upper-intermediate Hindi: defend a position, speculate about causes
    and consequences, express nuance, and recount a complex sequence of
    events with shifting time reference -- background versus foreground,
    an event before other past events, keeping the timeline unambiguous.

units:
  hi.b2.unit04.ghatnakram:
    title: "Sequence of events"
    description: Recount a complex sequence of events with shifting time reference -- background versus foreground, and an event that happened before other past events -- keeping the timeline unambiguous.

