    note: "*कर रही थी* is the past continuous, feminine -- the standard way to set BACKGROUND in a story ('was doing X when...'). This whole unit narrates Priya's day, so it stays feminine throughout, never the learner's own gender."
  hi.b2.unit04.lesson01.teach.baahar:
