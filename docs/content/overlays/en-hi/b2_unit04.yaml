  hi.b2.unit04.lesson03.teach.jabki:
    title: "whereas / while"
    gloss: "whereas / while (contrasting two things happening at once)"
    example_gloss: "Whereas he was at home, I was at the office."
  hi.b2.unit04.lesson03.teach.grammar_jab:
    title: "When the power went out, Priya was in the meeting. As soon as the phone rang, Priya got flustered. Whereas Priya was in the meeting, Arjun was in the office."
    gloss: "When the power went out, Priya was in the meeting. As soon as the phone rang, Priya got flustered. Whereas Priya was in the meeting, Arjun was in the office."
    note: "*जब...तब...*, *जैसे ही*, and *जबकि* all relate two events in time -- useful for keeping a complex timeline unambiguous."

  hi.b2.unit04.lesson04.teach.ne:
    title: "(ergative marker)"
    gloss: "(no English equivalent -- a grammatical marker, not a word with its own meaning)"
    note: "*ने* marks the subject of most past-tense transitive verbs (verbs with a direct object). *प्रिया ने काम पूरा किया* = 'Priya did/completed the work' -- English has nothing corresponding to *ने* itself; it just marks who did the action."
    example_gloss: "Priya completed the work."
  hi.b2.unit04.lesson04.teach.pehle:
    title: "already / beforehand"
    gloss: "already / beforehand (पहले ही = already, emphatically)"
    example_gloss: "I had already seen this before."
  hi.b2.unit04.lesson04.teach.bhejna:
    title: "to send"
    gloss: "to send"
    example_gloss: "I sent an email."
  hi.b2.unit04.lesson04.teach.to:
    title: "then / so"
    gloss: "then / so (marks the consequence in a jab...to... pair)"
    example_gloss: "If it rains, then we'll stay home."
  hi.b2.unit04.lesson04.teach.hui:
    title: "happened / occurred (feminine)"
    gloss: "happened / occurred (feminine, agrees with समस्या, problem)"
    example_gloss: "No problem occurred."
  hi.b2.unit04.lesson04.teach.grammar_ateet:
    title: "Priya had already sent the report. So, when the power went out, no problem occurred."
    gloss: "Priya had already sent the report. So, when the power went out, no problem occurred."
    note: "This is the PRE-PAST -- an event completed BEFORE the interrupting event of lesson02, marked with *पहले ही* + perfective (*भेज दी थी*, 'had already sent'). This is what keeps the timeline unambiguous: the report was sent before the power cut, not after."

  hi.b2.unit04.lesson05.teach.reading:
    title: "Reading: what happened first?"
    gloss: "That day, Priya was working from home. Outside it was raining, and everything was calm. Priya had already sent the report, so she was ready for the meeting. As soon as the meeting began, suddenly the power went out. At that very moment the phone also started ringing. Priya got flustered, but she had already sent the report, so there was no problem."
    glosses:
      तैयार: ready
      शुरू: "start / began"
      उसने: "she (ergative form, used before a past transitive verb)"

  hi.b2.unit04.lesson06.teach.kya_hua_tha:
    title: "What happened in the meeting yesterday?"
    gloss: "What happened in the meeting yesterday?"
  hi.b2.unit04.lesson06.teach.maine:
    title: "I (ergative)"
    gloss: "I (ergative form, used before a past transitive verb)"
    note: "*मैंने* is *मैं* + *ने* -- required here because *भेजना* ('to send') is transitive and this is a past-tense sentence."
    example_gloss: "I had already sent the report."
  hi.b2.unit04.lesson06.teach.acchi_baat:
    title: "the good thing was that..."
    gloss: "the good thing was that..."
  hi.b2.unit04.lesson06.teach.dialogue_arjun_ask:
    title: "Arjun: What happened in the meeting yesterday?"
    gloss: "Arjun: What happened in the meeting yesterday?"
  hi.b2.unit04.lesson06.teach.dialogue_priya_background:
    title: "Priya: I was working from home, and suddenly the power went out."
    gloss: "Priya: I was working from home, and suddenly the power went out."
  hi.b2.unit04.lesson06.teach.dialogue_arjun_then:
    title: "Arjun: Then what happened?"
    gloss: "Arjun: Then what happened?"
  hi.b2.unit04.lesson06.teach.dialogue_priya_prepast:
    title: "Priya: The good thing was that I had already sent the report."
    gloss: "Priya: The good thing was that I had already sent the report."
  hi.b2.unit04.lesson06.teach.grammar_poori_kahani:
    title: "Priya was working from home. Suddenly the power went out. But she had already sent the report."
    gloss: "Priya was working from home. Suddenly the power went out. But she had already sent the report."
    note: "A complete complex narrative has three layers: background (*कर रही थी*), the foregrounded interrupting event (*चली गई*), and the pre-past (*भेज दी थी*, an event completed before the interruption). This is exactly what the speaking and writing tasks in this lesson require, told about Priya."

