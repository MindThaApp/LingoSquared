answer_policy:
  se_comparative: >-
    This unit's central grammar point is से + adjective = "than" (X, Y से
    ADJ है = "X is more ADJ than Y"). A typed answer that drops से entirely
    from a comparative sentence, or substitutes a different postposition,
    should be marked incorrect -- this is the exact point being tested.
  subject_agreement: >-
    The comparative adjective (बड़ा/बड़ी, छोटा/छोटी, सस्ता/सस्ती,
    महंगा/महंगी, नया/नई) always agrees with the SENTENCE'S SUBJECT, never
    the से-marked compared item -- e.g. "प्रिया अर्जुन से छोटी है" uses
    छोटी because प्रिया (feminine) is the subject, regardless of अर्जुन's
    gender. A typed answer using the wrong gender for the actual subject
    should be marked incorrect as a real structural error, not tolerated as
    a minor typo.
  zyada_intensifier: >-
    ज़्यादा placed directly before the adjective in a comparative sentence
    ("X, Y से ज़्यादा ADJ है") just makes "more" explicit (same meaning,
    not "even more") and is never grammatically REQUIRED -- से + adjective alone is
    already a complete, correct comparative. Accept both the plain and the
    ज़्यादा form as equally correct for any open-ended
    "compare these two things" prompt (e.g. writing_prompt/speak_response),
    unless the exercise specifically targets the ज़्यादा form.
  nasalization_marks: >-
    Display and teach the correct chandrabindu/anusvara distinction. This
    unit's one new nasalized word pair, लंबा/लंबी, uses anusvara, verified
    against a direct codepoint check -- consistent with the
    already-established हैं/मुझे/तुम्हें/पसंद/संगीत convention. नया/नई
    carry no nasalization at all. In typed A1 answers, accept a variant
    that drops a nasalization mark entirely or substitutes anusvara for
    chandrabindu (or vice versa) when every other character is correct. Do
    not extend this tolerance to a wrong vowel or consonant, which changes
    the actual word.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question marks
    (?) may likewise be omitted, but the fully punctuated form remains the
    model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or nasalization marks. For any exercise asking the learner
    to state their own comparison, accept any of this unit's taught
    phrasings that fit the prompt, not only the single model sentence given
    in `accepted_answers`.

course:
  title: "Hindi A1"

units:
  hi.a1.unit14.comparisons:
    title: "Comparisons"

lessons:
  hi.a1.unit14.lesson01.se_tulna:
    title: "Priya is older than Arjun"
  hi.a1.unit14.lesson02.vastu_tulna:
    title: "The hat is cheaper than the bag"
  hi.a1.unit14.lesson03.arjun_priya_tulna:
    title: "Arjun and Priya: comparisons"

teaching:
  hi.a1.unit14.lesson01.teach.arjun_priya_review:
    title: "Review: Arjun, Priya, is"
    gloss: "Arjun, Priya, is"
    note: "A quick review of the two characters' names and the copula 'hai', needed to build comparative sentences in this unit."
    example_gloss:
      - "Arjun is fine."
      - "Priya is fine."

  hi.a1.unit14.lesson01.teach.bada_badi_review:
    title: "Review: big / older"
    gloss: "big / older (masculine / feminine)"
    note: "First taught in unit 5 for sibling age -- this unit extends it to comparing any two people or things directly."
    example_gloss:
      - "My older brother lives in Delhi."
      - "My older sister lives in Delhi."

  hi.a1.unit14.lesson01.teach.chota_choti_review:
    title: "Review: small / younger"
    gloss: "small / younger (masculine / feminine)"
    note: "First taught in unit 5 for sibling age -- reused here the same way as bada/badi."
    example_gloss:
      - "My younger brother is a student now."
      - "My younger sister is a student now."

  hi.a1.unit14.lesson01.teach.se_comparative_grammar:
    title: "Se = than"
    gloss: "'Se' was already learned as 'from' (unit 9, 'yahan se seedhe jao') and as 'with' (unit 12, 'Priya se mila'). Now it also means comparison: 'X, Y se ADJ hai' means 'X is more ADJ than Y' -- like 'Priya Arjun se badi hai'."
    note: "Discloses the third sense of an already-taught word, naming both prior senses by unit number before introducing the new one."

  hi.a1.unit14.lesson01.teach.arjun_bada_phrase:
    title: "Priya is older than Arjun."
    gloss: "Priya is older than Arjun."
    note: "The unit's first full example of the se-comparative pattern."

  hi.a1.unit14.lesson01.teach.lamba_lambi:
    title: "Tall / long"
    gloss: "tall / long (masculine / feminine)"
    note: "A new adjective pair, following the already-established -a/-i masculine/feminine agreement pattern (bada/badi, chota/choti)."
    example_gloss:
      - "My brother is tall."
      - "My sister is tall."

  hi.a1.unit14.lesson01.teach.agreement_grammar:
    title: "Adjective agrees with the subject"
    gloss: "In a comparative sentence, the adjective (like bada/badi, chota/choti) always agrees with the gender of the SUBJECT, not the word after 'se' -- e.g. in 'Arjun Priya se chota hai', 'chota' agrees with Arjun (the masculine subject), not with Priya."
    note: "A direct, explicit extension of the already-established -a/-i adjective agreement pattern, applied specifically to comparative sentences."

  hi.a1.unit14.lesson01.teach.priya_chota_phrase:
    title: "Arjun is younger than Priya."
    gloss: "Arjun is younger than Priya."
    note: "The complementary restatement of the same fact from the other direction -- demonstrates subject agreement with a masculine subject."

  hi.a1.unit14.lesson01.teach.kaun_ya_review:
    title: "Review: who, or"
    gloss: "who, or"
    note: "Both already taught (unit 5 and unit 6/13) -- reused here to ask a comparison question."
    example_gloss: "Who is older, Arjun or Priya?"

  hi.a1.unit14.lesson02.teach.topi_bag_review:
    title: "Review: hat, bag"
    gloss: "hat, bag"
    note: "Both nouns first taught in unit 7's shopping unit -- reused here as the two things being compared."
    example_gloss:
      - "This hat is nice."
      - "This bag is nice."

  hi.a1.unit14.lesson02.teach.sasta_mehnga_review:
    title: "Review: cheap, expensive"
    gloss: "cheap, expensive"
    note: "First taught in unit 7 -- reused here for object comparisons."
    example_gloss:
      - "The bag is cheap."
      - "The bag is expensive."

  hi.a1.unit14.lesson02.teach.sasti_mehngi_note:
    title: "Feminine forms: sasti, mehngi"
    gloss: "'Sasta' and 'mehnga' become 'sasti' and 'mehngi' with feminine words -- like 'topi sasti hai' (the hat is cheap)."
    note: "A quick reminder of unit 7's own gender-agreement rule, needed since 'topi' (hat) is feminine."

  hi.a1.unit14.lesson02.teach.se_object_phrase:
    title: "The hat is cheaper than the bag."
    gloss: "The hat is cheaper than the bag."
    note: "The se-comparative pattern applied to two objects rather than two people."

  hi.a1.unit14.lesson02.teach.zyada_review:
    title: "Review: more"
    gloss: "more"
    note: "First taught in unit 13 only with 'pasand hai' (to express a preference) -- this lesson generalizes its use."
    example_gloss: "I like tea more."

  hi.a1.unit14.lesson02.teach.zyada_mehnga_grammar:
    title: "Zyada with any comparison"
    gloss: "'Zyada' was only learned with 'pasand hai' before (unit 13). Now it can also go before ANY adjective in a comparison -- 'bag topi se zyada mehnga hai' means 'the bag is more expensive than the hat', exactly like 'bag topi se mehnga hai'. 'Zyada' is optional; it just says 'more' explicitly."
    note: "A disclosed generalization of an already-taught word's placement rule, not a new grammar point."

  hi.a1.unit14.lesson02.teach.zyada_mehnga_phrase:
    title: "The bag is more expensive than the hat."
    gloss: "The bag is more expensive than the hat."
    note: "The same se-comparative pattern with the optional zyada (more) spelled out."

  hi.a1.unit14.lesson02.teach.naya_nai:
    title: "New"
    gloss: "new (masculine / feminine)"
    note: "A new adjective pair, following the same -a/-i agreement pattern as every other adjective in this unit."
    example_gloss:
      - "The bag is new."
      - "The hat is new."

  hi.a1.unit14.lesson02.teach.topi_nai_phrase:
    title: "The hat is newer than the bag."
    gloss: "The hat is newer than the bag."
    note: "A second comparative attribute (age/newness) between the same two objects, consistent with the price comparison already established."

  hi.a1.unit14.lesson03.teach.review_words:
    title: "Review: big, small, tall, new"
    gloss: "big/older, small/younger, tall/long, new"
    note: "A quick review of this unit's key adjectives, needed for the dialogue and reading note."
    example_gloss:
      - "Priya is older."
      - "Arjun is younger."
      - "Arjun is tall."
      - "The bag is new."

  hi.a1.unit14.lesson03.teach.main_hun_review:
    title: "Review: I, am"
    gloss: "I, am"
    note: "First taught in unit 1 ('main theek hun') -- needed for Arjun to talk about himself in the dialogue."
    example_gloss: "I am fine."

  hi.a1.unit14.lesson03.teach.aur_bhi_review:
    title: "Review: and, also"
    gloss: "and, also"
    note: "Both words have appeared in earlier dialogue text but are formally introduced as testable vocabulary here for the first time."
    example_gloss:
      - "I like tea and coffee."
      - "I like it too."

  hi.a1.unit14.lesson03.teach.ka_review:
    title: "Review: 's (possessive)"
    gloss: "'s (possessive marker)"
    note: "The possessive marker already used throughout the course (e.g. unit 5-11) -- reused here to talk about whose bag is being compared."
    example_gloss: "Arjun's bag is new."

  hi.a1.unit14.lesson03.teach.dialogue.line01:
    title: "Arjun shows his new bag"
    gloss: "Priya, this is my new bag."
  hi.a1.unit14.lesson03.teach.dialogue.line02:
    title: "Priya says the hat is cheaper"
    gloss: "Nice bag! But the hat is cheaper than a bag."
  hi.a1.unit14.lesson03.teach.dialogue.line03:
    title: "Arjun agrees his bag is expensive"
    gloss: "Yes. My bag is expensive -- it's more expensive than a hat."
  hi.a1.unit14.lesson03.teach.dialogue.line04:
    title: "Priya asks who is older"
    gloss: "OK, OK! Arjun, who is older, you or I?"
  hi.a1.unit14.lesson03.teach.dialogue.line05:
    title: "Arjun answers"
    gloss: "You are older, but I am tall!"
  hi.a1.unit14.lesson03.teach.dialogue.line06:
    title: "Priya says the hat is also newer"
    gloss: "OK, OK! But the hat is also newer than the bag."
  hi.a1.unit14.lesson03.teach.dialogue.line07:
    title: "Arjun agrees and closes"
    gloss: "Yes, that's true. Shall we meet again tomorrow?"
  hi.a1.unit14.lesson03.teach.dialogue.line08:
    title: "Priya closes"
    gloss: "OK! See you tomorrow."

  hi.a1.unit14.lesson03.teach.grammar_summary:
    title: "Three main rules"
    gloss: "This unit's three main rules: (1) 'X, Y se ADJ hai' means 'X is more ADJ than Y'; (2) ADJ always agrees with the gender of the subject (X), not Y; (3) 'zyada' can also go before ADJ, like 'X, Y se zyada ADJ hai' -- the meaning stays the same ('more ADJ than')."
    note: "A closing summary tying the whole unit's grammar together, mirroring unit 13's own paradigm-tying grammar note."

  hi.a1.unit14.lesson03.teach.priya_note:
    title: "Priya's note"
    gloss: "I am older than Arjun, but Arjun is tall. And my hat is nice -- the hat is cheaper than the bag, and the hat is also newer than the bag. - Priya"
    note: "A short written note restating exactly the facts already established in the dialogue, no new claims."
    glosses:
      बड़ी: "older (feminine)"
      लंबा: "tall"
      टोपी: "hat"
      अच्छी: "nice / good (feminine)"
      बैग: "bag"
      सस्ती: "cheaper / cheap (feminine)"
      नई: "newer / new (feminine)"

