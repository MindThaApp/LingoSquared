  notes: >-
    Fourteenth en-hi overlay, written for hi/a1_unit14_comparisons.yaml
    (schema_version 1.1, §19 vocabulary-example format from the start; see
    that file's own generation_provenance for the full, honest
    source-access account, the spine-outcome confirmation against
