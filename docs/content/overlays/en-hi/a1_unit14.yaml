    (से's third sense as "than", added to its already-taught "from"/"with"
    senses; the deliberate avoidance of pronoun-oblique comparatives,
    keeping every से-marked comparison target a bare common noun or proper
    name; comparative adjective agreement targeting the SUBJECT, not the
    से-marked item; ज़्यादा generalizing beyond पसंद है to intensify any
    comparative), the same-speaker-distractor check, the cross-unit fact
    check (six comparative facts, all mutually consistent, none
    contradicted), the disclosed nasalization/spelling discipline (verified
    via direct codepoint hex dump for लंबा/लंबी/नया/नई), the
    confirmed-not-reset-per-lesson-but-reset-per-file tokenizer behavior,
    the word-order duplicate-token check, and the §17 fill_in_blank
    ambiguity check (including the directly-inherited ज़्यादा-blank
    avoidance, the same consideration unit13 already made once for its own
    ज़्यादा/बहुत ambiguity). Both files are freshly authored from
    established Modern Standard Hindi, same as units 01-13. No
    sibling-direction overlay exists yet for this unit (hi-en hasn't been
