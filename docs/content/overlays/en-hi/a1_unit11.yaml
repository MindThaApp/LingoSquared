answer_policy:
  decline_pattern: >-
    This unit's decline pattern ("माफ़ करना, मैं व्यस्त हूँ। मुझे काम
    है।") deliberately avoids a new modal "can" construction, reusing
    already-established copula (हूँ) and dative-possession (मुझे...है)
    grammar instead. Accept the reason sentence with or without "मुझे
    काम है" attached -- both a bare "माफ़ करना, मैं व्यस्त हूँ।" and the
    fuller form with the reason are equally natural, complete declines.
  nasalization_marks: >-
    Display and teach the correct chandrabindu/anusvara distinction. This
    unit introduces no new nasalized vocabulary at all -- the only
    nasalized forms used anywhere in this unit are हूँ and हैं, both
    reused unchanged from their already-settled unit01/unit10 spellings.
    In typed A1 answers, accept a variant that drops a nasalization mark
    entirely or substitutes anusvara for chandrabindu (or vice versa) when
    every other character is correct. Do not extend this tolerance to a
    wrong vowel or consonant, which changes the actual word.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question
    marks (?), exclamation marks, and commas may likewise be omitted,
    but the fully punctuated form remains the model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or nasalization marks. For any exercise asking the
    learner to propose, accept, decline, or schedule their own plan,
    accept any of this unit's taught phrasings that fit the prompt, not
    only the single model sentence given in `accepted_answers`.

course:
  title: "Hindi A1"

units:
  hi.a1.unit11.plans:
    title: "Making plans"

lessons:
  hi.a1.unit11.lesson01.prastaav_aur_sweekriti:
    title: "Watching a movie, drinking tea"
  hi.a1.unit11.lesson02.hum_kab_milte_hain:
    title: "When do we meet?"
  hi.a1.unit11.lesson03.priya_arjun_yojana:
    title: "Priya and Arjun: a plan"

teaching:
  hi.a1.unit11.lesson01.teach.review_chai_kaafi:
    title: "Review: tea, coffee"
    gloss: "tea, coffee"
    note: "A quick review of the drink words from unit 6 -- this unit reuses them to propose plans."
    example_gloss:
      - "I want tea."
      - "I want coffee."

  hi.a1.unit11.lesson01.teach.filma:
    title: "Movie"
    gloss: "movie"
    note: "A new noun for this unit's plan-making topic."
    example_gloss: "This movie is good."

  hi.a1.unit11.lesson01.teach.dekhna:
    title: "We watch / let's watch"
    gloss: "(we) watch / let's watch"
    note: "The habitual-plural form of 'dekhna' (to watch), used here to propose an activity together."
    example_gloss: "We watch a movie."

  hi.a1.unit11.lesson01.teach.chalo_film_phrase:
    title: "Let's watch a movie!"
    gloss: "Let's watch a movie!"
    note: "'Chalo' + a habitual-plural verb is the everyday way to propose doing something together -- already used incidentally back in units 1, 6, and 7 ('chalo shuru karte hain', 'chalo, kuch khaate hain', 'chalo, kuch khareedte hain'); this unit formalizes and extends the pattern."

  hi.a1.unit11.lesson01.teach.saath:
    title: "Together"
    gloss: "together"
    note: "Used to propose doing an activity jointly."
    example_gloss: "Let's watch a movie together!"

  hi.a1.unit11.lesson01.teach.peena:
    title: "We drink / let's drink"
    gloss: "(we) drink / let's drink"
    note: "The habitual-plural form of 'peena' (to drink), the same pattern as 'dekhte hain'."
    example_gloss: "We drink tea."

  hi.a1.unit11.lesson01.teach.chalo_chai_phrase:
    title: "Let's drink tea together!"
    gloss: "Let's drink tea together!"
    note: "Combines this lesson's 'saath' and 'peete hain' into a second proposal, using the same 'chalo' pattern as the movie proposal."

  hi.a1.unit11.lesson01.teach.chalo_grammar_note:
    title: "Chalo + verb-te + hain = Let's ___"
    gloss: "To suggest doing something together, say 'chalo' + verb-te + hain: Let's watch a movie! Let's drink tea together!"
    note: "States the whole pattern explicitly, formalizing what has already appeared incidentally three times in earlier units."

  hi.a1.unit11.lesson01.teach.achha_vichar:
    title: "Good idea!"
    gloss: "Good idea!"
    note: "A ready-to-use way to accept a proposal enthusiastically."

  hi.a1.unit11.lesson02.teach.vyast:
    title: "Busy"
    gloss: "busy"
    note: "A new adjective, used with the already-known copula (hoon/ho/hai) to describe being unavailable."
    example_gloss: "I'm busy today."

  hi.a1.unit11.lesson02.teach.maaf_karna:
    title: "Sorry / excuse me"
    gloss: "sorry / excuse me"
    note: "A fixed polite expression, used to soften a decline."
    example_gloss: "Sorry, I'm busy."

  hi.a1.unit11.lesson02.teach.maaf_vyast_phrase:
    title: "Sorry, I'm busy."
    gloss: "Sorry, I'm busy."
    note: "The basic decline sentence, combining this lesson's two new expressions."

  hi.a1.unit11.lesson02.teach.mujhe_kaam_hai:
    title: "I have work."
    gloss: "I have work."
    note: "Reuses the 'mujhe...hai' (I have...) pattern covered earlier's 'mujhe...chahiye' (I want/need), here giving a reason for declining."

  hi.a1.unit11.lesson02.teach.decline_grammar_note:
    title: "How to decline politely"
    gloss: "To politely decline a plan, say 'maaf karna' (sorry) followed by your situation (e.g. 'I'm busy') or a reason (e.g. 'I have work')."
    note: "Deliberately reuses already-taught grammar (the copula and the dative-possession pattern) rather than introducing a new 'can' construction."

  hi.a1.unit11.lesson02.teach.hum_pronoun:
    title: "We"
    gloss: "we"
    note: "This course's first formal first-person-plural pronoun. Its habitual-present verb form (-te + hain) is the same one already taught for ve (they) -- no new conjugation, just a new pronoun. (Tum also takes -te, but with 'ho': tum milte ho.)"
    example_gloss: "We meet every day."

  hi.a1.unit11.lesson02.teach.kab_milte_phrase:
    title: "When do we meet?"
    gloss: "When do we meet?"
    note: "Combines 'hum' with 'kab' (unit 10) and 'milte hain' (used since unit 1's closings, where the subject was usually dropped)."

  hi.a1.unit11.lesson02.teach.din_review:
    title: "Review: Saturday, Sunday"
    gloss: "Saturday, Sunday"
    note: "A quick review of two weekday names from unit 3, needed for scheduling a plan."
    example_gloss:
      - "Today is Saturday."
      - "Tomorrow is Sunday."

  hi.a1.unit11.lesson02.teach.samay_review:
    title: "Review: 4 o'clock, what time"
    gloss: "4 o'clock, what time"
    note: "A quick review of the time words from unit 4, needed for scheduling a plan."
    example_gloss:
      - "It's 4 o'clock now."
      - "What time is it now?"

  hi.a1.unit11.lesson02.teach.kya_ravivar_thik_phrase:
    title: "Is Sunday OK?"
    gloss: "Is Sunday OK?"
    note: "Reuses 'kya' as a yes/no question marker, already established since unit 1 ('kya yeh tumhari pahli baar hai?', 'kya tum yoga karti ho?'), rather than a new 'which day' interrogative."

  hi.a1.unit11.lesson03.teach.sandesh:
    title: "Message"
    gloss: "message"
    note: "A new noun, used for the written-invitation part of this lesson."
    example_gloss: "This is Arjun's message."

  hi.a1.unit11.lesson03.teach.dialogue.line01:
    title: "Arjun proposes a movie on Saturday"
    gloss: "Priya, let's watch a movie on Saturday?"
  hi.a1.unit11.lesson03.teach.dialogue.line02:
    title: "Priya declines with a reason"
    gloss: "Sorry, I'm busy Saturday. I have work."
  hi.a1.unit11.lesson03.teach.dialogue.line03:
    title: "Arjun asks when they can meet"
    gloss: "OK. When do we meet?"
  hi.a1.unit11.lesson03.teach.dialogue.line04:
    title: "Priya proposes Sunday instead"
    gloss: "Is Sunday OK? Let's drink tea together!"
  hi.a1.unit11.lesson03.teach.dialogue.line05:
    title: "Arjun accepts and asks the time"
    gloss: "Good idea! What time on Sunday?"
  hi.a1.unit11.lesson03.teach.dialogue.line06:
    title: "Priya suggests a time"
    gloss: "Is 4 o'clock OK?"
  hi.a1.unit11.lesson03.teach.dialogue.line07:
    title: "Arjun confirms"
    gloss: "Yes, 4 o'clock is fine. See you then!"
  hi.a1.unit11.lesson03.teach.dialogue.line08:
    title: "Priya closes"
    gloss: "OK, see you Sunday!"

  hi.a1.unit11.lesson03.teach.invitation_message:
    title: "Priya's message"
    gloss: "Hi Arjun, let's meet on Sunday at 4 and drink tea. OK? - Priya"
    note: "A short written invitation, restating the plan the dialogue just confirmed."
    glosses:
      चलो: "let's"
      रविवार: "Sunday"
      मिलते: "meet (from मिलना)"
      चाय: "tea"
      पीते: "drink (from पीना)"
      ठीक: "OK / fine"

