teaching:
  hi.a1.unit27.lesson01.teach.khush_udas_naraz:
    title: Happy, sad, and angry
    gloss: happy, sad, angry
    note: '*खुश*, *उदास* and *नाराज़* are basic feeling words that go with *हूँ* or *है* (''am'', ''is''); they do not change for gender.'
    example_gloss:
    - I am happy.
    - I am sad.
    - I am angry.
  hi.a1.unit27.lesson01.teach.main_khush_hoon:
    title: Saying you're happy
    gloss: I am happy.
    note: '*मैं खुश हूँ* follows the pattern *मैं* + feeling + *हूँ*, just like ''I am ...''.'
  hi.a1.unit27.lesson01.teach.main_naraz_naheen:
    title: Contrasting feelings
    gloss: I am not angry, I am sad.
    note: '*नहीं* goes right before *हूँ*: *नाराज़ नहीं हूँ*. The second part then names the real feeling.'
  hi.a1.unit27.lesson02.teach.tum_khush_kyon:
    title: Asking why
    gloss: Why are you happy?
    note: '*क्यों* (''why'') comes before the main word: *तुम खुश क्यों हो?*. *तुम* is the informal ''you''.'
  hi.a1.unit27.lesson02.teach.main_khush_hoon:
    title: Giving a reason
    gloss: I am happy because I have a new apartment.
    note: '*क्योंकि* introduces the reason. *मेरे पास ... है* means ''I have'', and the verb *है* comes last.'
  hi.a1.unit27.lesson02.teach.main_udas_hoon:
    title: A negative reason
    gloss: I am sad because it is raining.
    note: '*बारिश हो रही है* is ''it is raining'' (literally ''rain is happening'').'
  hi.a1.unit27.lesson03.teach.narvas:
    title: Nervous
    gloss: nervous
    note: The standard word for nervousness.
    example_gloss: I am nervous about my first shift.
  hi.a1.unit27.lesson03.teach.main_apnee_pahlee:
    title: Stating what you're nervous about
    gloss: I am nervous about my first shift.
    note: '*को लेकर* means ''about'' and comes after the noun: *शिफ़्ट को लेकर*. *अपनी* (''my own'') agrees with the feminine *शिफ़्ट*.'
  hi.a1.unit27.lesson03.teach.chinta_mat_karo:
    title: Reassuring someone
    gloss: Don't worry.
    note: '*चिंता मत करो* is the friendly ''don''t worry'': *मत* + *करो* is the *तुम* command with ''don''t''.'
  hi.a1.unit27.lesson04.teach.arjun_kaisa_mahsoos:
    title: Asking how someone feels
    gloss: How does Arjun feel?
    note: '*कैसा महसूस कर रहा है* asks ''how does he feel''. *कैसा* agrees with the person, so a woman gets *कैसी*.'
  hi.a1.unit27.lesson04.teach.vah_narvas_mahsoos:
    title: Describing how someone feels
    gloss: He feels nervous.
    note: 'Hindi has no separate word for ''himself'' here: *वह नर्वस महसूस कर रहा है* simply uses *वह* and *रहा है*.'
  hi.a1.unit27.lesson04.teach.vah_narvas_kyon:
    title: Asking why someone feels a certain way
    gloss: Why does he feel nervous?
    note: '*क्यों* comes right before the verb phrase: *वह नर्वस क्यों महसूस कर रहा है?*'
  hi.a1.unit27.lesson05.teach.hay_priya_main:
    title: Read a message about feelings
    gloss: Hi Priya, I'm a little nervous about my first shift alone. But I'm also happy, because I have a new job and a new apartment. I think it'll be fine.
    note: Track what the writer is nervous about, what makes him happy, and his overall outlook.
    glosses:
      थोड़ा: a little
      नर्वस: nervous
      पहली: first
      शिफ़्ट: shift
      अकेले: alone
      खुश: happy
      क्योंकि: because
      नई: new
      नौकरी: job
      नया: new
      फ़्लैट: apartment
      लगता: think
      होगा: 'turns out (here: will be fine)'
  hi.a1.unit27.lesson06.teach.priya_hay_arjun:
    title: Priya asks how Arjun feels
    gloss: 'Priya: Hi Arjun, how are you feeling about your first shift?'
    note: '*को लेकर* is used again: *अपनी पहली शिफ़्ट को लेकर* (''about your first shift''). *तुम* is informal.'
  hi.a1.unit27.lesson06.teach.arjun_sach_kahoon:
    title: Arjun admits he's nervous
    gloss: 'Arjun: I''m a bit nervous, honestly.'
    note: '*सच कहूँ तो* (''if I tell the truth'') softens an admission.'
  hi.a1.unit27.lesson06.teach.priya_chinta_mat:
    title: Priya reassures him
    gloss: 'Priya: Don''t worry, you can do it well!'
    note: '*तुम यह अच्छे से कर सकते हो* means ''you can do this well'', and *अच्छे से* is ''well''.'
  hi.a1.unit27.lesson06.teach.arjun_shukriya_isse:
    title: Arjun thanks her
    gloss: 'Arjun: Thanks, that really helps.'
    note: '*इससे मदद मिलती है* is literally ''from this, help is received'': the helper is marked with *से*.'
  hi.a1.unit27.lesson06.teach.priya_aur_bad:
    title: Priya predicts the outcome
    gloss: 'Priya: And afterward you''ll definitely be very happy and proud.'
    note: '*ज़रूर* (''definitely'') makes the prediction confident, and *तुम्हें गर्व होगा* is ''you will feel pride''.'
  hi.a1.unit27.lesson06.teach.arjun_han_mujhe:
    title: Arjun agrees
    gloss: 'Arjun: Yes, I think so too.'
    note: '*मुझे भी ऐसा ही लगता है* (''to me too it seems so'') is the natural way to agree, and *मुझे* marks who feels it.'
  hi.a1.unit27.lesson06.teach.arjun_narvas_hai:
    title: 'Pronouns: उसकी'
    gloss: Arjun is nervous. Priya helps him.
    note: '*उसकी* means ''his'' or ''her'' and agrees with the feminine *मदद*, so *उसकी मदद करना* is ''to help him''; *है* and *करती है* are the verbs for the third person.'
