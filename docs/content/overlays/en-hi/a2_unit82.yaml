  hi.a2.unit82.kal_baarish_hogi.lesson05.arjun_ka_message:
    title: Arjun's Message
  hi.a2.unit82.kal_baarish_hogi.lesson06.phone_par:
    title: On the Phone
teaching:
  hi.a2.unit82.kal_baarish_hogi.lesson01.teach.mausam_shabd:
    title: Weather words
    gloss: tomorrow / weather / rain / sunshine / cold / clouds / good
    note: '*कल* means both ''tomorrow'' and ''yesterday''; the verb shows which. Here it is tomorrow.'
    example_gloss:
    - Tomorrow it will rain.
    - Tomorrow it will be sunny.
    - Tonight it will be cold.
  hi.a2.unit82.kal_baarish_hogi.lesson01.teach.gn_hoga:
    title: The future of 'to be'
    gloss: The weather will be good. It will rain. There will be clouds. The nights will be cold.
    note: '*होगा* (masculine singular), *होगी* (feminine singular), *होंगे* (masculine plural), *होंगी* (feminine plural). The ending agrees with the thing that will happen: *बारिश* is feminine, *मौसम* is masculine.'
  hi.a2.unit82.kal_baarish_hogi.lesson01.teach.gn_nahin_hoga:
    title: 'No: नहीं'
    gloss: Tomorrow it will rain. Tomorrow it will not rain. Tomorrow it will not be cold.
    note: Put *नहीं* before *होगी* to say that something will not happen.
  hi.a2.unit82.kal_baarish_hogi.lesson02.teach.kriya_shabd:
    title: Verbs for plans
    gloss: to come / to go / to do / phone / home
    note: '*फ़ोन करना* = to phone. The future ending is added to the verb stem.'
    example_gloss:
    - Arjun will come tomorrow.
    - Priya will go home tomorrow.
    - Arjun will phone.
  hi.a2.unit82.kal_baarish_hogi.lesson02.teach.gn_main_vah:
    title: I and he or she
    gloss: I will go (man). I will go (woman). He will go. She will go.
    note: With *मैं* the future ends in *-ऊँगा* (man) or *-ऊँगी* (woman). With *वह* or a name it ends in *-एगा* (masculine) or *-एगी* (feminine).
  hi.a2.unit82.kal_baarish_hogi.lesson02.teach.gn_karna:
    title: Irregular-looking stems
    gloss: I will phone (man). I will phone (woman). Priya will phone. Arjun will phone.
    note: '*करना* gives *करूँगा / करूँगी / करेगा / करेगी*. The vowel of the stem shifts slightly, but the endings are the same.'
  hi.a2.unit82.kal_baarish_hogi.lesson03.teach.shayad_shabd:
    title: Sure or not sure
    gloss: perhaps / certainly / not
    note: '*शायद* shows that you are not sure. *ज़रूर* shows that you are sure.'
    example_gloss:
    - Perhaps it will rain tomorrow.
    - It will certainly rain tomorrow.
    - Perhaps Arjun will not come.
  hi.a2.unit82.kal_baarish_hogi.lesson03.teach.gn_shayad:
    title: Perhaps and certainly
    gloss: Perhaps it will rain. It will certainly rain.
    note: Both words go before the verb or near the start of the sentence. The verb stays in the future in both.
  hi.a2.unit82.kal_baarish_hogi.lesson03.teach.gn_nahin_aaega:
    title: The negative future
    gloss: Arjun will not come. Priya will not go. I will not go.
    note: '*नहीं* comes right before the verb. The future ending does not change.'
  hi.a2.unit82.kal_baarish_hogi.lesson04.teach.vaada_shabd:
    title: Words for promises
    gloss: promise / late / on time / to forget
    note: '*वादा* at the end of a sentence turns it into a promise.'
    example_gloss:
    - I will come on time, I promise.
    - I will not come late.
    - I will not forget your birthday.
  hi.a2.unit82.kal_baarish_hogi.lesson04.teach.gn_tum_hum:
    title: Other persons
    gloss: You will come (to a man). You will come (to a woman). We will go. They will come. You will come (formal).
    note: With *तुम* the ending is *-ओगे* (man) or *-ओगी* (woman). *हम*, *वे* and *आप* all take *-एँगे*.
  hi.a2.unit82.kal_baarish_hogi.lesson04.teach.gn_prashn_vaada:
    title: Asking and promising
    gloss: Will you come tomorrow? Yes, I will certainly come.
    note: Questions are made with *क्या* at the start; the verb form does not change. The answer repeats the verb with *मैं*.
  hi.a2.unit82.kal_baarish_hogi.lesson05.teach.padhne_shabd:
    title: Words for the message
    gloss: Sunday / morning / afternoon / umbrella / to bring
    note: '*रविवार को* = on Sunday. *दोपहर में* = in the afternoon.'
    example_gloss:
    - Perhaps it will rain on Sunday.
    - In the morning it will be sunny.
    - I will bring an umbrella.
  hi.a2.unit82.kal_baarish_hogi.lesson05.teach.padho_message:
    title: Arjun writes to Priya
    gloss: Priya, perhaps it will rain on Sunday. In the morning it will be sunny, but in the afternoon there will be clouds. I will bring an umbrella, I promise. You will not be late, will you? Arjun
    note: Look for what Arjun predicts (the weather) and what he promises (the umbrella).
  hi.a2.unit82.kal_baarish_hogi.lesson06.teach.d1:
    title: Priya asks
    gloss: 'Priya: Arjun, how will the weather be tomorrow?'
  hi.a2.unit82.kal_baarish_hogi.lesson06.teach.d2:
    title: Arjun predicts
    gloss: 'Arjun: Perhaps it will be sunny in the morning, but it will rain in the afternoon.'
  hi.a2.unit82.kal_baarish_hogi.lesson06.teach.d3:
    title: Priya asks about the park
    gloss: 'Priya: So will we go to the park tomorrow?'
  hi.a2.unit82.kal_baarish_hogi.lesson06.teach.d4:
    title: Arjun agrees
    gloss: 'Arjun: Yes, but I will bring an umbrella. You will bring one too, won''t you?'
  hi.a2.unit82.kal_baarish_hogi.lesson06.teach.d5:
    title: Priya promises
    gloss: 'Priya: Yes, I will certainly bring one. You will not be late, will you?'
  hi.a2.unit82.kal_baarish_hogi.lesson06.teach.d6:
    title: Arjun promises
    gloss: 'Arjun: No, I will come on time, I promise.'
