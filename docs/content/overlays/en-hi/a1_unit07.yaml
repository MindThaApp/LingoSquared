    (AUTHORING_GUIDE §8) doesn't apply here -- noted for whoever
    authors hi-en next: do not open this file for structure/phrasing
    reference when doing so.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked with hi/a1_unit07_shopping.yaml. Fixes:
    lesson02.teach.kitne_ka_ki_note gloss restated to match the corrected
    realization note; lesson03.exercise03/04 correct options were the only
    ones with romanized word + parenthesis ('Kameez (shirt)', 'Topi
    (hat)'), giving the answer away -> plain 'Shirt'/'Hat';
    lesson02.exercise10 missing the taught 'यह (टोपी) पचास रुपये की है'
