answer_policy:
  nasalization_marks: >-
    Display and teach the correct chandrabindu/anusvara distinction.
    This unit's own new vocabulary needs one new, explicitly disclosed
    spelling decision: महंगा/महंगी ("expensive") uses अनुस्वार (ं), not
    चंद्रबिंदु -- this is a class-nasal-before-a-stop-consonant case
    (the same pattern as गंगा/मंगल), not an application of the existing
    word-final vowel-height convention that governs हूँ/हाँ/मैं/हैं/में.
    In typed A1 answers, accept a variant that drops a nasalization
    mark entirely or substitutes anusvara for chandrabindu (or vice
    versa) when every other character is correct. Do not extend this
    tolerance to a wrong vowel or consonant, which changes the actual
    word.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question
    marks (?), exclamation marks, and commas may likewise be omitted,
    but the fully punctuated form remains the model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    (aap vs. tum) rather than written punctuation or nasalization marks.

course:
  title: "Hindi A1"

units:
  hi.a1.unit07.shopping:
    title: "Shopping"

lessons:
  hi.a1.unit07.lesson01.dukaan_mein:
    title: "At the shop"
  hi.a1.unit07.lesson02.keemat_aur_matra:
    title: "Price and quantity"
  hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari:
    title: "Priya and Arjun go shopping"

teaching:
  hi.a1.unit07.lesson01.teach.dukaan_bazaar:
    title: "Shop, market"
    gloss: "shop, market"
    note: "Two common places to buy things, used throughout this unit."
    example_gloss:
      - "This is a shop."
      - "This is a market."

  hi.a1.unit07.lesson01.teach.dukaandaar:
    title: "Shopkeeper"
    gloss: "shopkeeper"
    note: "A new character for this unit -- the person who runs a shop, addressed with aap since they're a stranger."
    example_gloss: "This is the shopkeeper."

  hi.a1.unit07.lesson01.teach.kameez_bag_topi:
    title: "Shirt, bag, hat"
    gloss: "shirt, bag, hat"
    note: "Three common shopping items, used throughout this unit to practice the *mujhe ... chahiye* pattern from the food unit."
    example_gloss:
      - "I would like a shirt."
      - "I would like a bag."
      - "I would like a hat."

  hi.a1.unit07.lesson01.teach.mujhe_yah_chahiye:
    title: "I would like this"
    gloss: "I would like this."
    note: "A general-purpose phrase for wanting an item, reusing *mujhe ... chahiye* from the food unit with *yah* (this)."

  hi.a1.unit07.lesson01.teach.ji:
    title: "Ji (polite title)"
    gloss: "a polite/respectful particle, like adding 'sir' or 'ma'am'"
    note: "Added after a name or title to sound more polite, common when addressing a stranger like a shopkeeper."
    example_gloss: "Hello, shopkeeper."

  hi.a1.unit07.lesson01.teach.sirf:
    title: "Only"
    gloss: "only, just"
    note: "Used to say you want just one thing, not several."
    example_gloss: "I would like only one shirt."

  hi.a1.unit07.lesson01.teach.aapko_aur_kuch_chahiye:
    title: "Would you like anything else? (formal)"
    gloss: "Would you like anything else?"
    note: "The natural formal follow-up question a shopkeeper asks after taking part of an order, reusing *aapko* and *chahiye*."

  hi.a1.unit07.lesson01.teach.ji_nahin_sirf_yah:
    title: "No, just this"
    gloss: "No, just this."
    note: "A natural, polite way to decline more items, reusing *ji* and *sirf* from this lesson."

  hi.a1.unit07.lesson01.teach.tumhein_kya_chahiye_bataao:
    title: "Tell me what you'd like"
    gloss: "Tell me what you would like."
    note: "The informal practice-instruction phrase this course uses to prompt a spoken answer, matching the food unit's own version."

  hi.a1.unit07.lesson02.teach.keemat:
    title: "Price"
    gloss: "price"
    note: "Reused from unit 2's own numbers/price content, re-taught here for this unit's own shopping context."
    example_gloss: "What is its price?"

  hi.a1.unit07.lesson02.teach.rupaye:
    title: "Rupees"
    gloss: "rupees"
    note: "The currency word, reused from unit 2, now practiced with two different prices."
    example_gloss:
      - "Its price is twenty rupees."
      - "Its price is fifty rupees."

  hi.a1.unit07.lesson02.teach.iski_keemat_kya_hai:
    title: "What is its price?"
    gloss: "What is its price?"
    note: "The standard way to ask a price, reused directly from unit 2."

  hi.a1.unit07.lesson02.teach.iski_keemat_bees_rupaye_hai:
    title: "Its price is twenty rupees"
    gloss: "Its price is twenty rupees."
    note: "A sample answer to the price question above."

  hi.a1.unit07.lesson02.teach.kitne_ka_ki_note:
    title: "Kitne ka / kitne ki"
    gloss: "'Yah kitne ka hai?' is for masculine things, and 'Yah kitne ki hai?' is for feminine things -- *kitne* itself never changes -- only *ka/ki* changes, the same -a/-i alternation you already know from *mera/meri* and *tumhara/tumhari*."
    note: >-
      A second, very common way to ask a price, built on the same
      gender-agreement pattern already learned from the possessives --
      only the ka/ki particle changes, not kitne.

  hi.a1.unit07.lesson02.teach.yeh_kitne_ka_hai:
    title: "How much is this? (masculine)"
    gloss: "How much is this?"
    note: "Used for a masculine item, like a bag."

  hi.a1.unit07.lesson02.teach.yeh_kitne_ki_hai:
    title: "How much is this? (feminine)"
    gloss: "How much is this?"
    note: "Used for a feminine item, like a hat."

  hi.a1.unit07.lesson02.teach.sasta_mehenga:
    title: "Cheap, expensive"
    gloss: "cheap, expensive"
    note: "A common adjective pair for reacting to a price, masculine forms shown here."
    example_gloss:
      - "This bag is cheap."
      - "This bag is expensive."

  hi.a1.unit07.lesson02.teach.sasti_mehengi_note:
    title: "Sasti and mehengi"
    gloss: "'Sasta' and 'mehenga' also change for masculine and feminine like 'mera/meri' -- with feminine words we say 'sasti' and 'mehengi', like 'yah topi sasti hai' (this hat is cheap) or 'yah kameez mehengi hai' (this shirt is expensive)."
    note: "A second real instance of the same gender-agreement pattern this course keeps flagging explicitly."

  hi.a1.unit07.lesson03.teach.khareedna:
    title: "To buy"
    gloss: "to buy"
    note: "Reuses the 'V + na chahta/chahti hun' (I want to ...) construction first taught in unit 1 for learning yoga, now applied to buying."
    example_gloss:
      - "I want to buy this shirt."
      - "I want to buy this hat."

  hi.a1.unit07.lesson03.teach.chalo_kuch_khareedte_hain:
    title: "Let's buy something!"
    gloss: "Let's buy something!"
    note: "A friendly, fixed way to suggest shopping together, opening this unit's closing dialogue, matching the food unit's own 'chalo, kuch khate hain!' pattern."

  hi.a1.unit07.lesson03.teach.dialogue.line01:
    title: "Arjun suggests shopping"
    gloss: "Arjun says let's buy something."
    note: "Reuses this unit's own opening phrase."
  hi.a1.unit07.lesson03.teach.dialogue.line02:
    title: "Priya agrees"
    gloss: "Priya agrees and wonders: a shirt or a hat?"
    note: "Introduces *ya* (or) to offer a choice between two items."
  hi.a1.unit07.lesson03.teach.dialogue.line03:
    title: "The shopkeeper greets them"
    gloss: "The shopkeeper says hello and asks what they'd like."
    note: "The formal aap-register greeting, reusing *aapko kya chahiye* from lesson 1."
  hi.a1.unit07.lesson03.teach.dialogue.line04:
    title: "Priya asks about a shirt"
    gloss: "Priya greets the shopkeeper politely and asks for a shirt, then asks its price."
    note: "Combines *ji*, *mujhe ... chahiye*, and *iski keemat kya hai*."
  hi.a1.unit07.lesson03.teach.dialogue.line05:
    title: "The shopkeeper gives the price"
    gloss: "The shopkeeper says its price is thirty rupees."
    note: "Reuses the *iski keemat ... rupaye hai* pattern with a new number."
  hi.a1.unit07.lesson03.teach.dialogue.line06:
    title: "Priya reacts and decides"
    gloss: "Priya says thirty rupees, that's cheap! I'd like this shirt."
    note: "Reuses *sasti* from lesson 2's grammar note."
  hi.a1.unit07.lesson03.teach.dialogue.line07:
    title: "Arjun asks about a hat"
    gloss: "Arjun says he'd like a hat, and asks how much it is."
    note: "Reuses the feminine *kitne ki hai* form from lesson 2."
  hi.a1.unit07.lesson03.teach.dialogue.line08:
    title: "The shopkeeper answers"
    gloss: "The shopkeeper says the hat is fifty rupees."
    note: "Reuses *pachaas* (fifty) from lesson 2."
  hi.a1.unit07.lesson03.teach.dialogue.line09:
    title: "Arjun reacts and decides anyway"
    gloss: "Arjun says fifty rupees, that's expensive! Okay, I'd like this hat."
    note: "Reuses *mehengi* from lesson 2's grammar note, then decides to buy it anyway."
  hi.a1.unit07.lesson03.teach.dialogue.line10:
    title: "The shopkeeper asks if that's all"
    gloss: "The shopkeeper says okay, would you like anything else?"
    note: "Reuses *aapko aur kuch chahiye* from lesson 1."
  hi.a1.unit07.lesson03.teach.dialogue.line11:
    title: "Priya closes the order"
    gloss: "Priya says no, just this, thanks!"
    note: "Reuses *ji nahin, sirf yah* from lesson 1 plus *shukriya*."
  hi.a1.unit07.lesson03.teach.dialogue.line12:
    title: "The shopkeeper says goodbye"
    gloss: "The shopkeeper says thanks, see you again."
    note: "Reuses this course's own standard closing phrase."

exercises:
  hi.a1.unit07.lesson01.exercise01.select_dukaan:
    instruction: "Which word means shop?"
    correct_option: "दुकान"
    distractors: ["बाज़ार", "टोपी"]
    accepted_answers: ["दुकान"]

  hi.a1.unit07.lesson01.exercise02.select_bazaar:
    instruction: "Which word means market?"
    correct_option: "बाज़ार"
    distractors: ["दुकान", "बैग"]
    accepted_answers: ["बाज़ार"]

  hi.a1.unit07.lesson01.exercise03.select_dukaandaar_meaning:
    instruction: "What does this word mean?"
    correct_option: "shopkeeper"
    distractors: ["market", "shirt"]
    accepted_answers: ["shopkeeper"]

  hi.a1.unit07.lesson01.exercise04.match_shop_words:
    instruction: "Match each Hindi word to its English meaning."
    correct_response:
      "दुकान": "shop"
      "बाज़ार": "market"
      "दुकानदार": "shopkeeper"
      "कमीज़": "shirt"
      "बैग": "bag"
      "टोपी": "hat"
      "जी": "polite title (like sir/ma'am)"
      "सिर्फ़": "only"

  hi.a1.unit07.lesson01.exercise05.order_mujhe_kameez_chahiye:
    instruction: "Put the sentence in order: I would like a shirt."
    correct_response: ["मुझे", "कमीज़", "चाहिए"]

  hi.a1.unit07.lesson01.exercise06.order_mujhe_sirf_ek_kameez_chahiye:
    instruction: "Put the sentence in order: I would like only one shirt."
    correct_response: ["मुझे", "सिर्फ़", "एक", "कमीज़", "चाहिए"]

  hi.a1.unit07.lesson01.exercise07.fill_mujhe_bag:
    instruction: "Complete the sentence: I would like a bag."
    accepted_answers: ["बैग"]
    feedback: "Mujhe baig chahiye -- baig is a common shopping item."

  hi.a1.unit07.lesson01.exercise08.fill_aapko_aur:
    instruction: "Complete the question: Would you like anything else?"
    accepted_answers: ["कुछ"]
    feedback: "Aapko aur kuch chahiye? -- the polite way a shopkeeper checks if you want more."

  hi.a1.unit07.lesson01.exercise09.fix_chahiye_hai_topi:
    instruction: "Correct the sentence -- chahiye is already complete, it doesn't need hai."
    accepted_answers:
      - "मुझे यह टोपी चाहिए।"
      - "मुझे यह टोपी चाहिए"
    feedback: "Mujhe yah topi chahiye -- chahiye never takes hai/hain afterward."

  hi.a1.unit07.lesson01.exercise10.reply_aapko_aur_kuch:
    instruction: "Answer that no, just this."
    accepted_answers:
      - "जी नहीं, सिर्फ़ यह।"
      - "जी नहीं सिर्फ़ यह"
      - "नहीं, सिर्फ़ यह।"
      - "जी नहीं, सिर्फ यह।"
      - "नहीं, सिर्फ यह।"

  hi.a1.unit07.lesson01.exercise11.speak_what_you_want_shop:
    instruction: "Say what you would like to buy at the shop."
    accepted_answers:
      - "मुझे टोपी चाहिए।"
      - "मुझे टोपी चाहिए"
      - "मुझे कमीज़ चाहिए।"
      - "मुझे कमीज़ चाहिए"
      - "मुझे बैग चाहिए।"
      - "मुझे बैग चाहिए"
      - "मुझे कमीज चाहिए।"

  hi.a1.unit07.lesson02.exercise01.select_keemat:
    instruction: "Which word means price?"
    correct_option: "कीमत"
    distractors: ["रुपये", "कितने"]
    accepted_answers: ["कीमत"]

  hi.a1.unit07.lesson02.exercise02.select_sasta_meaning:
    instruction: "What does this word mean?"
    correct_option: "cheap"
    distractors: ["expensive", "price"]
    accepted_answers: ["cheap"]

  hi.a1.unit07.lesson02.exercise03.select_mehenga_meaning:
    instruction: "What does this word mean?"
    correct_option: "expensive"
    distractors: ["cheap", "rupees"]
    accepted_answers: ["expensive"]

  hi.a1.unit07.lesson02.exercise04.match_price_words:
    instruction: "Match each Hindi word to its English meaning."
    correct_response:
      "कीमत": "price"
      "रुपये": "rupees"
      "कितने": "how much"
      "सस्ता": "cheap (m.)"
      "महंगा": "expensive (m.)"
      "सस्ती": "cheap (f.)"
      "महंगी": "expensive (f.)"

  hi.a1.unit07.lesson02.exercise05.order_iski_keemat_bees_rupaye_hai:
    instruction: "Put the sentence in order: Its price is twenty rupees."
    correct_response: ["इसकी", "कीमत", "बीस", "रुपये", "है"]

  hi.a1.unit07.lesson02.exercise06.order_yeh_kitne_ka_hai:
    instruction: "Put the question in order: How much is this? (masculine item)"
    correct_response: ["यह", "कितने", "का", "है"]

  hi.a1.unit07.lesson02.exercise07.fill_iski_keemat_kya:
    instruction: "Complete the question: What is its price?"
    accepted_answers: ["क्या"]
    feedback: "Iski keemat kya hai? -- the standard way to ask a price."

  hi.a1.unit07.lesson02.exercise08.fill_yeh_kitne_ki:
    instruction: "Complete the question, asking the price of a feminine item like a hat."
    accepted_answers: ["की"]
    feedback: "Yah kitne ki hai? -- ki agrees with a feminine item; kitne itself never changes."

  hi.a1.unit07.lesson02.exercise09.fix_sasta_agreement:
    instruction: "Correct the sentence -- sasta/sasti agrees with the noun's gender, and topi is feminine."
    accepted_answers:
      - "यह टोपी सस्ती है।"
      - "यह टोपी सस्ती है"
    feedback: "Yah topi sasti hai -- topi is feminine, so it takes sasti, not sasta."

  hi.a1.unit07.lesson02.exercise10.reply_yeh_topi_kitne_ki_hai:
    instruction: "Answer that its price is fifty rupees."
    accepted_answers:
      - "इसकी कीमत पचास रुपये है।"
      - "इसकी कीमत पचास रुपये है"
      - "यह पचास रुपये की है।"
      - "यह टोपी पचास रुपये की है।"
      - "इसकी क़ीमत पचास रुपये है।"

  hi.a1.unit07.lesson02.exercise11.speak_bag_price:
    instruction: "Say the price of the bag: twenty rupees."
    accepted_answers:
      - "यह बीस रुपये का है।"
      - "यह बीस रुपये का है"
      - "इसकी कीमत बीस रुपये है।"
      - "इसकी कीमत बीस रुपये है"
      - "यह बैग बीस रुपये का है।"
      - "इसकी क़ीमत बीस रुपये है।"

  hi.a1.unit07.lesson03.exercise01.select_chalo_kuch_khareedte_hain_meaning:
    instruction: "What does this phrase mean?"
    correct_option: "Let's buy something!"
    distractors: ["What would you like?", "Anything else?"]
    accepted_answers: ["Let's buy something!"]

  hi.a1.unit07.lesson03.exercise02.select_khareedna_meaning:
    instruction: "What does this word mean?"
    correct_option: "to buy"
    distractors: ["to eat", "to want"]
    accepted_answers: ["to buy"]

  hi.a1.unit07.lesson03.exercise03.comprehend_priya_item:
    instruction: "Read the line. What item does Priya ask for?"
    correct_option: "Shirt"
    distractors:
      - "Bag"
      - "Hat"
    accepted_answers: ["Shirt"]

  hi.a1.unit07.lesson03.exercise04.comprehend_arjun_item:
    instruction: "Read the line. What item does Arjun ask for?"
    correct_option: "Hat"
    distractors:
      - "Shirt"
      - "Bag"
    accepted_answers: ["Hat"]

  hi.a1.unit07.lesson03.exercise05.order_iski_keemat_tees_rupaye_hai:
    instruction: "Put the sentence in order: Its price is thirty rupees."
    correct_response: ["इसकी", "कीमत", "तीस", "रुपये", "है"]

  hi.a1.unit07.lesson03.exercise06.order_yeh_topi_pachaas_rupaye_ki_hai:
    instruction: "Put the sentence in order: This hat is fifty rupees."
    correct_response: ["यह", "टोपी", "पचास", "रुपये", "की", "है"]

  hi.a1.unit07.lesson03.exercise07.match_shopping_review:
    instruction: "Match each Hindi word to its English meaning."
    correct_response:
      "दुकान": "shop"
      "बाज़ार": "market"
      "कमीज़": "shirt"
      "बैग": "bag"
      "टोपी": "hat"
      "कीमत": "price"
      "रुपये": "rupees"
      "सस्ता": "cheap (m.)"
      "महंगा": "expensive (m.)"
      "खरीदना": "to buy"

  hi.a1.unit07.lesson03.exercise08.fill_tees_rupaye:
    instruction: "Complete the sentence: Its price is thirty rupees."
    accepted_answers: ["तीस"]
    feedback: "Iski keemat tees rupaye hai -- tees is thirty."

  hi.a1.unit07.lesson03.exercise09.fix_mehengi_agreement:
    instruction: "Correct the sentence -- mehenga/mehengi agrees with the noun's gender, and topi is feminine."
    accepted_answers:
      - "यह टोपी महंगी है।"
      - "यह टोपी महंगी है"
      - "यह टोपी महँगी है।"
    feedback: "Yah topi mehengi hai -- topi is feminine, so it takes mehengi, not mehenga."

  hi.a1.unit07.lesson03.exercise10.reply_aapko_aur_kuch_chahiye:
    instruction: "Answer that no, just this, based on the dialogue."
    accepted_answers:
      - "जी नहीं, सिर्फ़ यह।"
      - "जी नहीं सिर्फ़ यह"
      - "नहीं, सिर्फ़ यह।"
      - "जी नहीं, सिर्फ यह।"
      - "नहीं, सिर्फ यह।"

  hi.a1.unit07.lesson03.exercise11.write_about_shopping:
    instruction: "Write one or two sentences about something you'd like to buy and its price."
