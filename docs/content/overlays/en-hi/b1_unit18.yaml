answer_policy:
  register_shift: >-
    This unit's dialogue uses "*aap*" (formal "you") for the FIRST time
    as Arjun/Priya's own address term -- but only toward their manager,
    in this workplace/meeting context. They still address each other
    with "*tum*" everywhere else, unchanged.
  softened_professional_request: >-
    "*Main sujhaav dena chahoonga/chahoongi ki*..." ("I would like to
    suggest that...") is the formal-register version of unit17's
    softened conditional, used to make a professional suggestion with no
    direct command. With "*aap*" as the addressee, the verb takes the
    plural/formal agreement ("*sakenge*", not "*sakoge*").
  professional_email_shape: >-
    A brief professional message follows: "*Priya [Name] ji*" (Dear
    ___) to open, the softened suggestion in the body, and
    "*dhanyavaad*" (thank you) to close.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Internal
    commas separating clauses may also be replaced by " and " (और) or
    omitted with a space where noted per exercise.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

