teaching:
  hi.a2.unit75.lesson01.teach.chhuttee_garmee_kee:
    title: Holidays
    gloss: the holiday / the summer holiday
    note: '*छुट्टी* is a day off or a break; *गर्मी की छुट्टियाँ* (plural) is the long summer break.'
    example_gloss:
    - In August I have a holiday.
    - The summer holiday starts in July.
  hi.a2.unit75.lesson01.teach.agle_haphte_agle:
    title: When something happens
    gloss: next week / next year / soon
    note: '*अगले* is used with masculine nouns: *अगले हफ्ते*, *अगले साल*. *जल्द ही* means ''soon''.'
    example_gloss:
    - Next week I have an appointment.
    - Next year I want to go to Goa.
    - Soon I have a holiday.
  hi.a2.unit75.lesson01.teach.yatra_karna_buk:
    title: Three travel verbs
    gloss: to travel / to book / to stay
    note: These are infinitives. *बुक* is an English loan word, so the verb is *बुक करना*; *यात्रा करना* is 'to travel' and *रुकना* is 'to stay'.
    example_gloss:
    - I like travelling by train.
    - I want to book a room.
    - I'm staying for a week.
  hi.a2.unit75.lesson01.teach.hotal_kainp:
    title: Where to stay
    gloss: the hotel / the campsite
    note: Both are English loan words. You stay *होटल में* (in a hotel) and *कैंप में* (in a camp).
    example_gloss:
    - The hotel is close to the beach.
    - We sleep on the campsite.
  hi.a2.unit75.lesson01.teach.tumhen_garmee_kee:
    title: Asking about holiday plans
    gloss: What are you going to do in the summer holiday?
    note: 'Hindi asks about plans with *तुम्हें ... करना है* (''what is there for you to do''): the question word comes before the verb *करना* and *है* closes the sentence.'
  hi.a2.unit75.lesson01.teach.agst_men_mujhe:
    title: 'Near plans: मुझे ... है'
    gloss: In August I am going to travel to Manali. I am going to book a hotel.
    note: 'To say what you are going to do, use *मुझे* + the plan + the infinitive + *है*: *मुझे एक होटल बुक करना है*. The infinitive agrees with its object: *बुक करना* (masculine) but *यात्रा करनी* (feminine). *मुझे* is the same for men and women, so you do not have to choose a gender here. A time word can come first: *अगले हफ्ते मुझे एक होटल बुक करना है*.'
  hi.a2.unit75.lesson01.teach.mujhe_ek_hotal:
    title: Booking a hotel
    gloss: I am going to book a hotel.
  hi.a2.unit75.lesson02.teach.kors_karna_ghar:
    title: Three plans for later
    gloss: to take a course / to move house / to save money
    note: '*कोर्स करना* is the usual phrase for taking a course. *घर बदलना* is moving to a new home.'
    example_gloss:
    - I want to take a course.
    - My uncle wants to move house.
    - I want to save for a new bike.
  hi.a2.unit75.lesson02.teach.bad_men_ek:
    title: Further ahead
    gloss: later / in a month
    note: '*एक महीने बाद* means ''a month from now''. It works with other periods too: *एक हफ्ते बाद*.'
    example_gloss:
    - Later I want to buy a house.
    - In a month my course starts.
  hi.a2.unit75.lesson02.teach.ek_maheene_bad:
    title: A course that starts
    gloss: In a month my course starts.
  hi.a2.unit75.lesson02.teach.mera_ek_kors:
    title: 'Intentions: मेरा ... करने का इरादा है'
    gloss: I plan to take a course.
    note: 'To say what you intend to do, use *मेरा ... का इरादा है*. The verb before *का* ends in *-ने*: *कोर्स करने का*. *मेरा* agrees with *इरादा* (masculine), so the sentence is the same for men and women. Use it for things you wish to do, not for fixed arrangements.'
  hi.a2.unit75.lesson02.teach.mera_ghar_badalne:
    title: Planning to move house
    gloss: I plan to move house.
  hi.a2.unit75.lesson02.teach.mera_paise_bachane:
    title: Planning to save
    gloss: I plan to save money.
  hi.a2.unit75.lesson02.teach.kal_mujhe_bajar:
    title: मुझे ... है or इरादा?
    gloss: Tomorrow I am going to the market. Later I plan to move house.
    note: 'Use *मुझे ... है* for the near, settled future: *कल मुझे बाजार जाना है*. Use *इरादा* for an intention that is further away or less certain: *बाद में मेरा घर बदलने का इरादा है*.'
  hi.a2.unit75.lesson03.teach.shayad_pakka:
    title: Maybe and certainly
    gloss: maybe / certainly
    note: '*शायद* expresses doubt. *पक्का* means ''for sure''.'
    example_gloss:
    - Maybe it will rain tomorrow.
    - That is certainly fun.
  hi.a2.unit75.lesson03.teach.is_sal_is:
    title: This year, this summer
    gloss: this year / this summer
    note: '*इस* (''this'') stays the same before any noun here: *इस साल*, *इस गर्मी*.'
    example_gloss:
    - This year I am not going on holiday.
    - This summer I am staying at home.
  hi.a2.unit75.lesson03.teach.is_garmee_mujhe:
    title: Staying at home
    gloss: This summer I am staying at home.
  hi.a2.unit75.lesson03.teach.kal_mujhe_kam:
    title: शायद and the verb
    gloss: Tomorrow I am going to work. Maybe I will go to the cinema later.
    note: 'After *शायद* the verb takes its *-ऊँ* form for ''I'': *शायद मैं बाद में सिनेमा जाऊँ*, not *जाता हूँ*. This form has no masculine or feminine change. As in every Hindi sentence, the verb comes last. A plain plan with *मुझे ... है* needs no *शायद*: *कल मुझे काम करना है*.'
  hi.a2.unit75.lesson03.teach.mujhe_chhuttee_par:
    title: Saying you are not going to
    gloss: I am not going on holiday. I do not plan to move house.
    note: 'Put *नहीं* right before the infinitive: *मुझे छुट्टी पर नहीं जाना है*. With *इरादा*, put *नहीं* before *है*: *मेरा घर बदलने का इरादा नहीं है*.'
  hi.a2.unit75.lesson04.teach.kiske_sath_kitne:
    title: Two question phrases
    gloss: with whom / how long
    note: '*किसके साथ* asks about a person you do something with. *कितने दिन* asks about a period of time.'
    example_gloss:
    - Who are you going to the beach with?
    - How long are you staying?
  hi.a2.unit75.lesson04.teach.tumhen_kahan_jana:
    title: Where are you going?
    gloss: Where are you going (to)?
    note: '*कहाँ* stands before the verb and covers both ''where'' and ''where to'': *तुम्हें कहाँ जाना है?*'
  hi.a2.unit75.lesson04.teach.tumhen_kiske_sath:
    title: Who with?
    gloss: Who are you going on holiday with?
  hi.a2.unit75.lesson04.teach.tumhen_vahan_kitne:
    title: How long?
    gloss: How long are you staying there?
  hi.a2.unit75.lesson04.teach.mujhe_apnee_bahan:
    title: Answering
    gloss: I am going with my sister.
  hi.a2.unit75.lesson04.teach.ek_haphta_do:
    title: Weeks
    gloss: one week / two weeks
    note: '*हफ्ता* (one week) becomes *हफ्ते* after a number above one: *दो हफ्ते*.'
    example_gloss:
    - I am staying for a week.
    - We are staying for two weeks.
  hi.a2.unit75.lesson04.teach.tumhen_kahan_jana_2:
    title: Questions with तुम्हें ... है
    gloss: Where are you going? Who are you going with? How long are you going to stay?
    note: 'Hindi does not move the question word to the front: it stays inside the sentence, before the verb. *तुम्हें कहाँ जाना है?* *तुम्हें किसके साथ जाना है?* *तुम्हें कितने दिन रुकना है?* The verb is an infinitive and *है* is last.'
  hi.a2.unit75.lesson05.teach.hay_priya_jald:
    title: A message from Neha
    gloss: Hi Priya! Soon I have a holiday. In August I am going to Goa with my sister. We are going to stay in a hotel for a week. After that I am going to my parents' for two days. Next year I plan to take a course. Maybe I will move house then too. What are you going to do?
    note: 'Neha describes near plans with *मुझे ... है* and a longer-term intention with *इरादा*. Notice that each sentence ends with its verb: *रुकेंगे*, *करने का इरादा है*, *जाना है*.'
    glosses:
      जल्द: soon
      छुट्टी: holiday
      अगस्त: August
      बहन: sister
      जाना: to go (जाना है = is going to)
      गोवा: Goa
      होटल: hotel
      रुकेंगे: will stay
      बाद: after (उसके बाद = after that)
      माता-पिता: parents
      दिन: days
      अगले: next
      साल: year
      इरादा: intention (मेरा ... का इरादा है = I plan to)
      कोर्स: course
      करने: to do (a course)
      शायद: maybe
      बदलूँ: may move house
      तब: then
      भी: also
  hi.a2.unit75.lesson06.teach.hay_arjun_kya:
    title: Priya asks Arjun about his plans
    gloss: 'Priya: Hi Arjun! Do you have plans for the summer holiday yet?'
  hi.a2.unit75.lesson06.teach.han_agst_men:
    title: Arjun answers
    gloss: 'Arjun: Yes! In August I am going to Manali. I am going to book a hotel.'
  hi.a2.unit75.lesson06.teach.barhiya_tumhen_kiske:
    title: Priya asks who he is going with
    gloss: 'Priya: Nice! Who are you going with?'
  hi.a2.unit75.lesson06.teach.apne_chacha_ke:
    title: Arjun says who and how long
    gloss: 'Arjun: With my uncle. We are going to stay for a week.'
  hi.a2.unit75.lesson06.teach.aur_bad_men:
    title: Priya asks about later
    gloss: 'Priya: And later? What do you plan to do?'
  hi.a2.unit75.lesson06.teach.agle_sal_mera:
    title: Arjun names an intention and asks back
    gloss: 'Arjun: Next year I plan to take a course. And you?'
  hi.a2.unit75.lesson06.teach.julaee_men_mujhe:
    title: Priya answers
    gloss: 'Priya: In July I am going to work. Maybe I will go to my parents'' after that.'
