    feedback: '*मेरा घर बदलने का इरादा है* = I plan to move house. The verb before *का* ends in *-ने*, and *मेरा* agrees with *इरादा*.'
  hi.a2.unit75.lesson02.exercise02.listen_mera_ek_kors:
