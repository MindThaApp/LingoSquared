  hi.a2.unit75.lesson02.exercise01.choose_mera_ghar_badalne:
    instruction: Choose the Hindi sentence meaning 'I plan to move house.'
    correct_option: मेरा घर बदलने का इरादा है।
    distractors:
    - मेरा घर बदलना का इरादा है।
    - मैं घर बदलने का इरादा है।
    - मेरी घर बदलने का इरादा है।
    accepted_answers:
