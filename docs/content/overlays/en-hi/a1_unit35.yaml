    title: Do you have internet at home?
    gloss: Do you have internet at home?
  hi.a1.unit35.lesson01.teach.main_har_din:
    title: I use my phone every day
    gloss: I use my phone every day.
    note: '*हर दिन* ("every day") is a time phrase that goes before the verb.'
  hi.a1.unit35.lesson02.teach.aip:
    title: The app
    gloss: the app
    example_gloss: I have an app for the weather forecast.
  hi.a1.unit35.lesson02.teach.maisej:
    title: The message
    gloss: the message
    example_gloss: I'll send a message through the app.
  hi.a1.unit35.lesson02.teach.maisej_bhejte_bhee:
    title: The verb follows the person
    gloss: 'A *मैसेज* can be sent or read, and the verb ending follows the person: *मैं भेजता हूँ*, *तुम पढ़ते हो*, *वह पढ़ता है*.'
    note: Ties the new word to the already-taught compound noun from the weather unit.
  hi.a1.unit35.lesson02.teach.priya_aip_se:
    title: Priya sends a message through the app
    gloss: Priya sends a message through the app.
    note: '*ऐप से* means "through the app": *से* marks the tool you use.'
  hi.a1.unit35.lesson02.teach.arjun_maisej_parhta:
    title: Arjun reads the message
    gloss: Arjun reads the message.
  hi.a1.unit35.lesson03.teach.chek_karna:
    title: To look up
    gloss: to look up
    example_gloss: I look up the weather forecast.
  hi.a1.unit35.lesson03.teach.chek_karna_men:
    title: Only करना changes
    gloss: 'In *चेक करना* the word *चेक* stays the same and only *करना* changes with the person: *मैं चेक करता हूँ*, *तुम चेक करते हो*. *इस्तेमाल करना* works the same way.'
    note: 'Many Hindi verbs are a noun or loan word plus *करना*: learn the first word once and change only *करना*.'
  hi.a1.unit35.lesson03.teach.vikram_mausam_ka:
    title: Vikram looks up the weather forecast
    gloss: Vikram looks up the weather forecast.
  hi.a1.unit35.lesson03.teach.phir_vah_daurne:
    title: Then he goes running
    gloss: Then he goes running.
    note: '*दौड़ने जाना* ("to go for a run") puts the verb in the *-ने* form before *जाना*.'
  hi.a1.unit35.lesson04.teach.priya_chalo_shanivar:
    title: Priya proposes
    gloss: 'Priya: Shall we exercise Saturday at ten?'
  hi.a1.unit35.lesson04.teach.arjun_achchha_aidiya:
    title: Arjun agrees
    gloss: 'Arjun: Good idea! I''ll look up the weather forecast.'
    note: '*अच्छा आइडिया!* is a quick, friendly "good idea".'
  hi.a1.unit35.lesson04.teach.arjun_shanivar_ko:
    title: Arjun checks the weather
    gloss: 'Arjun: It''s sunny on Saturday!'
    note: 'There is no "it": Hindi says *शनिवार को धूप है* ("on Saturday sunshine is").'
  hi.a1.unit35.lesson04.teach.vikram_mujhe_maisej:
    title: Vikram sees the message
    gloss: 'Vikram: I see the message. See you Saturday!'
  hi.a1.unit35.lesson04.teach.phir_milenge_yah:
    title: फिर मिलेंगे vs day + को
    gloss: 'You know *फिर मिलेंगे!* ("see you again"). To name a day, put *को* after it: *शनिवार को मिलते हैं!*, *सोमवार को मिलते हैं!*'
    note: Extends the greetings unit's farewell pattern to a specific day.
  hi.a1.unit35.lesson05.teach.priya_har_din:
    title: Who uses what?
    gloss: Priya calls Arjun every day. She uses her phone, not an app. Arjun has no computer at home, but he uses internet on his phone. Vikram looks up the weather forecast every morning. Then he goes running. Neha often sends Priya a message. Do you also use your phone every day?
    note: Compares all four characters' device habits, mirroring the sports unit's comparison-reading shape.
    glosses:
      कॉल: calls
      हर: every
      दिन: day
      इस्तेमाल: uses
      फ़ोन: phone
      ऐप: app
      कंप्यूटर: computer
      घर: at home
      इंटरनेट: internet
      चेक: looks up
      सुबह: morning
      अनुमान: weather forecast
      जाता: goes
      दौड़ने: running
      भेजती: sends
      अक्सर: often
      मैसेज: message
      करते: use
  hi.a1.unit35.lesson05.teach.vikram_har_subah:
    title: Vikram looks up the forecast every morning
    gloss: Vikram looks up the weather forecast every morning.
  hi.a1.unit35.lesson05.teach.neha_aksar_priya:
    title: Neha often messages Priya
