  hi.a1.unit35.lesson06.teach.arjun_han_aur:
    title: Arjun confirms the weather
    gloss: 'Arjun: Yes, and it''s sunny on Saturday!'
  hi.a1.unit35.lesson06.teach.vikram_tab_main:
    title: Vikram's plan
    gloss: 'Vikram: I''ll run then. Afterward I''ll also play football.'
    note: '*उसके बाद* ("after that") starts the second step, and *भी* means "also".'
  hi.a1.unit35.lesson06.teach.neha_mujhe_tairna:
    title: Neha's plan
    gloss: 'Neha: I''d rather swim, but I''m coming to the park too.'
    note: Preferring is a *मुझे ... पसंद है* sentence, and *ज़्यादा* adds "more".
  hi.a1.unit35.lesson06.teach.priya_barhiya_shanivar:
    title: Priya closes the conversation
    gloss: 'Priya: Nice! See you Saturday in the park!'
    note: Closes both this unit's messaging thread and the sports unit's plan in one line.
