teaching:
  hi.a2.unit92.kya_aapko_pata_hai.lesson01.teach.shabd_pata:
    title: Words for asking where
    gloss: knowledge, to know (पता है) / where / station / bank / that / over there / post office / hospital
    note: '*पता है* is know: the person comes first with *को* (*मुझे, तुम्हें, आपको*).'
    example_gloss:
    - Do you know where the station is? (to a friend)
    - Do you know where the bank is? (to someone you call आप)
    - I know that the bank is over there.
  hi.a2.unit92.kya_aapko_pata_hai.lesson01.teach.gn_pata_hai:
    title: Do you know where ...?
    gloss: Do you know where the station is? Do you know where the bank is?
    note: 'Say *क्या तुम्हें पता है कि …* to a friend and *क्या आपको पता है कि …* to a stranger. After *कि* the question word stays where it normally is: *स्टेशन कहाँ है*.'
  hi.a2.unit92.kya_aapko_pata_hai.lesson01.teach.gn_mujhe_pata:
    title: I know / I do not know
    gloss: I know that the bank is over there. I do not know where the bank is.
    note: '*मुझे पता है* = I know. *मुझे नहीं पता* = I do not know. *कि* joins the two parts.'
  hi.a2.unit92.kya_aapko_pata_hai.lesson02.teach.shabd_kab:
    title: Words for asking when
    gloss: when / at what time / opens / train / meeting / shop / o’clock / library / school / exam
    note: '*कितने बजे* = at what time. *सात बजे* = at seven o’clock.'
    example_gloss:
    - Do you know when the shop opens? (to a friend)
    - Do you know what time the train comes? (to someone you call आप)
    - I do not know when the meeting is.
    - The train comes at seven o’clock.
  hi.a2.unit92.kya_aapko_pata_hai.lesson02.teach.gn_kab:
    title: Asking when
    gloss: Do you know when the shop opens? I do not know when the meeting is.
    note: '*कब* stays in place after *कि*. The verb still agrees with its own subject: *दुकान … खुलती है* (feminine).'
  hi.a2.unit92.kya_aapko_pata_hai.lesson02.teach.gn_kitne_baje:
    title: What time?
    gloss: Do you know what time the train comes? The train comes at seven o’clock.
    note: 'Ask with *कितने बजे* and answer with a number and *बजे*. *ट्रेन* is feminine: *आती है*.'
  hi.a2.unit92.kya_aapko_pata_hai.lesson03.teach.shabd_bata:
    title: Words for polite requests
    gloss: to tell / can (formal) / can (to a man friend) / can (to a woman friend) / how much (price) / this
    note: '*यह कितने का है?* asks the price of one thing.'
    example_gloss:
    - Can you tell me where the bank is? (to a stranger)
    - Can you tell me how much this is? (to a stranger)
    - Can you tell me when the meeting is? (to a man, friend)
    - Can you tell me when the meeting is? (to a woman, friend)
  hi.a2.unit92.kya_aapko_pata_hai.lesson03.teach.gn_bata_sakte:
    title: Can you tell me ...?
    gloss: Can you tell me where the bank is? Can you tell me when the shop opens?
    note: '*क्या आप बता सकते हैं कि …?* is more polite than *क्या आपको पता है कि …?* because it asks for help.'
  hi.a2.unit92.kya_aapko_pata_hai.lesson03.teach.gn_sakte_sakti:
    title: सकते हो or सकती हो
    gloss: Can you tell me when the meeting is? (to a man) Can you tell me when the meeting is? (to a woman)
    note: 'For a friend you call *तुम*, the verb agrees with the friend: *सकते हो* (man), *सकती हो* (woman).'
  hi.a2.unit92.kya_aapko_pata_hai.lesson04.teach.shabd_doosre:
    title: Words for who knows
    gloss: to live / comes / does not know / (I) do not know
    note: '*मुझे पता नहीं* and *मुझे नहीं पता* both mean I do not know.'
    example_gloss:
    - Priya knows when the meeting is.
    - Arjun does not know what time the train comes.
    - I do not know where he lives.
  hi.a2.unit92.kya_aapko_pata_hai.lesson04.teach.gn_ko_pata:
    title: Who knows
    gloss: Priya knows when the meeting is. Arjun does not know what time the train comes.
    note: 'For a named person use *को*: *प्रिया को पता है*, *अर्जुन को नहीं पता*. The part after *कि* is a normal clause.'
  hi.a2.unit92.kya_aapko_pata_hai.lesson04.teach.gn_prashn_ya_kathan:
    title: Statement or question
    gloss: I know that the station is over there. Do you know where the station is?
    note: The order of words is the same. A question begins with *क्या* and ends with a question mark.
  hi.a2.unit92.kya_aapko_pata_hai.lesson05.teach.shabd_sandesh:
    title: Words for the message
    gloss: tomorrow / it, he, she / message
    note: '*वह* can mean it when it refers to a thing (here, the meeting).'
    example_gloss:
    - The meeting is tomorrow.
    - I do not know where it is.
  hi.a2.unit92.kya_aapko_pata_hai.lesson05.teach.padho_sandesh:
    title: Priya writes to Arjun
    gloss: Arjun, do you know when the meeting is tomorrow? I do not know where it is. Can you tell me what time the train comes? Priya
    note: Count the three questions and say what Priya wants to know.
  hi.a2.unit92.kya_aapko_pata_hai.lesson06.teach.d1:
    title: Priya asks
    gloss: 'Priya: Excuse me, do you know where the bank is?'
  hi.a2.unit92.kya_aapko_pata_hai.lesson06.teach.d2:
    title: The stranger answers
    gloss: 'Stranger: Yes, the bank is over there.'
  hi.a2.unit92.kya_aapko_pata_hai.lesson06.teach.d3:
    title: Priya asks more
    gloss: 'Priya: Can you tell me when the bank opens?'
  hi.a2.unit92.kya_aapko_pata_hai.lesson06.teach.d4:
    title: The stranger answers again
    gloss: 'Stranger: I know that the bank opens at ten o’clock.'
  hi.a2.unit92.kya_aapko_pata_hai.lesson06.teach.d5:
    title: Priya thanks him
    gloss: 'Priya: Thank you very much!'
