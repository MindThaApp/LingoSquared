  notes: 'English overlay written from the realization. Drafted by Claude Sonnet. Grammar: क्या आपको / तुम्हें पता है कि + question word (कहाँ, कब, कितने बजे), मुझे (नहीं) पता है कि, X को (नहीं) पता है कि, क्या आप बता सकते हैं कि ... / क्या तुम बता सकते हो कि ...; word order is the same as in a normal statement after कि. Priya and Arjun use tum; strangers use आप. OPEN NATIVE QUESTIONS: (1) is क्या आपको पता है कि ... the best A2 model for a polite indirect question, or is क्या आप जानते हैं कि ... more natural; (2) is ''बैंक वहाँ है'' natural as a stranger''s reply or should it be ''बैंक उधर है''; (3) the stranger speaker is labelled राहगीर: acceptable label for a dialogue speaker.'
answer_policy:
  punctuation: Hindi text is shown with the danda as the sentence-final mark. In typed answers, accept the danda, a plain period, or the mark omitted entirely as equivalent. Question marks may likewise be omitted.
  gender_agreement: Where the speaker or addressee is a named man or woman, the verb must agree with that person. Where the speaker is just 'I' (gender unspecified), both the masculine and the feminine form are accepted. Wrong agreement with a named person is a real grammar error, not a typo.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation.
course:
  title: Hindi A2
  description: Intermediate Hindi continuing the Priya and Arjun storyline, now with grammar-led units on reasons, sequencing, purpose, conditions, indirect questions and passing on messages.
units:
  hi.a2.unit92.kya_aapko_pata_hai:
    title: Do You Know Where ...?
    description: 'Ask politely for information with an embedded question: क्या आपको पता है कि ... कहाँ / कब / कितने बजे ...?'
