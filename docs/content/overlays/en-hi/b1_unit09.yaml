answer_policy:
  chahiye_tha: >-
    "...*chahiye tha/thi*" ("should have...") marks an unfulfilled past
    obligation -- reuses unit 1's *chahiye* combined with *tha/thi*
    (unit 12). The infinitive before it agrees with the object's gender
    ("*karni*" agreeing with feminine *report*), and *tha/thi* agrees
    with that same object.
  kaash_kiya_hota: >-
    "*Kaash*...*kiya hota*" ("if only.../I wish I had...") is a
    counterfactual wish about the past -- *kaash* is a dedicated wish
    particle, and *kiya hota* combines the past participle *kiya* with
    the *hota* auxiliary (unit 3). *Hota* agrees with the SPEAKER's own
    gender; Arjun (masculine) is the speaker throughout this unit's own
    dialogue, so *hota*, not *hoti*, where the exercise specifically
    targets this agreement.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question
    marks (?) may likewise be omitted, but the fully punctuated form
    remains the model answer. For the two-sentence culminating writing
    exercise, also accept the internal sentence-boundary period being
    replaced by a comma, or omitted with a space, as equivalent, and
    accept the feminine *karni chahiye thi*/*kiya hoti* variant for a
    learner answering as herself (the exercise doesn't pin a specific
    speaker gender for the learner's own answer).
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

