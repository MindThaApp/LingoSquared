    title: What sport do you do?
    gloss: What sport do you do?
  hi.a1.unit33.lesson01.teach.main_futbol_khelta:
    title: I play football
    gloss: I play football.
    note: 'Hindi uses the verb that fits the sport: *खेलना* (''to play'') for football, so *मैं फ़ुटबॉल खेलता हूँ*.'
  hi.a1.unit33.lesson01.teach.futbol_khelna_yog:
    title: खेलना or करना
    gloss: 'To play football, to do yoga. Hindi picks the verb by the sport: *खेलना* for games like football and *करना* for things like yoga, and the sport comes before the verb.'
    note: One construction covers every sport -- no need to learn a separate verb per sport at this level.
  hi.a1.unit33.lesson02.teach.hafte_men_do:
    title: Times a week
    gloss: times a week
    example_gloss: I do yoga twice a week.
  hi.a1.unit33.lesson02.teach.main_hafte_men:
    title: हफ़्ते में दो बार
    gloss: I run twice a week. *हफ़्ते में दो बार* ('in a week, two times') is a more specific way to say how often than *रोज़* or *अक्सर*, and it comes before the verb.
    note: Extends the frequency vocabulary already established in the hobbies unit.
  hi.a1.unit33.lesson02.teach.main_hafte_men_2:
    title: I do yoga twice a week
    gloss: I do yoga twice a week.
  hi.a1.unit33.lesson02.teach.arjun_aksar_futbol:
    title: Arjun often plays football
    gloss: Arjun often plays football.
    note: '*अक्सर* (''often'') comes before the verb: *अर्जुन अक्सर फ़ुटबॉल खेलता है*.'
  hi.a1.unit33.lesson03.teach.main_kasrat_karta:
    title: कसरत करना or खेलना
    gloss: I exercise. I play football.
    note: '*कसरत करना* is general exercise, while *फ़ुटबॉल खेलना* names the specific sport.'
