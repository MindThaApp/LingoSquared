  hi.a1.unit33.lesson06.teach.chalo_sath_men:
    title: चलो + खेलें
    gloss: Come on, let's play together. *चलो* plus the *-एँ* form (*खेलें*) proposes doing something together, which is how Hindi says 'shall we'.
