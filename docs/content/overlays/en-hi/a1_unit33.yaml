  hi.a1.unit33.lesson04.teach.arjun_vah_main:
    title: Arjun reacts
    gloss: 'Arjun: How nice, I often play football there.'
  hi.a1.unit33.lesson05.teach.priya_hafte_men:
    title: Priya and Neha on sport
    gloss: Priya does yoga twice a week. She loves moving calmly. Neha doesn't do yoga, but she loves swimming. Neha swims often, almost every week. What sport do you do?
    note: 'This text contrasts two sports and two ways to say how often: *हफ़्ते में दो बार* and *अक्सर, लगभग हर हफ़्ते*; the verbs *करती है* and *तैरती है* are feminine.'
    glosses:
      करती: does
      दो: two
      बार: times
      हफ़्ते: week
      योग: yoga
      पसंद: loves
      आराम: calmly
      कसरत: exercise
      तैरना: swimming
      तैरती: swims
      अक्सर: often
      लगभग: almost
      कौन: which
      खेल: sport
  hi.a1.unit33.lesson05.teach.neha_aksar_tairtee:
