    gloss: "Arjun: Okay, I'll look again."
  hi.b2.unit03.lesson06.teach.grammar_baariki_baatcheet:
    title: "Maybe there are, to some extent, mistakes in the report. There are definitely mistakes in the report."
    gloss: "Maybe there are, to some extent, mistakes in the report. There are definitely mistakes in the report."
    note: "The exact same claim -- 'there are mistakes in the report' -- delivered first hedged (*शायद*, *कुछ हद तक*), then emphatic (*निश्चित रूप से*), once Arjun asks Priya to be clearer. This is exactly what the speaking and writing tasks in this lesson require."

