  hi.b2.unit03.lesson06.teach.dialogue_priya_hedge:
    title: "Priya: Maybe there are, to some extent, mistakes in the report."
    gloss: "Priya: Maybe there are, to some extent, mistakes in the report."
  hi.b2.unit03.lesson06.teach.dialogue_arjun_why:
    title: "Arjun: Why do you think that?"
    gloss: "Arjun: Why do you think that?"
  hi.b2.unit03.lesson06.teach.dialogue_priya_emphatic:
    title: "Priya: Okay, actually, there are definitely mistakes in the report."
    gloss: "Priya: Okay, actually, there are definitely mistakes in the report."
  hi.b2.unit03.lesson06.teach.dialogue_arjun_agree:
