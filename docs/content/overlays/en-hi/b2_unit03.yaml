course:
  title: Hindi B2
  description: >-
    Upper-intermediate Hindi: defend a position, speculate about causes
    and consequences, and express nuance -- soften or strengthen a
    statement (hedging, qualification, emphasis, and focus) so the same
    content can be delivered tentatively, neutrally, or emphatically.

units:
  hi.b2.unit03.baarikiyaan:
    title: "Nuance"
    description: Soften or strengthen a statement -- hedge, qualify, emphasize, and focus -- so the same content can be delivered tentatively, neutrally, or emphatically.

