  hi.b2.unit03.lesson01.teach.lambi:
    title: long
    gloss: "long (feminine agreement)"
    note: "*प्रेज़ेंटेशन* (presentation) is grammatically feminine in Hindi, so any adjective describing it takes the feminine form: *लंबी*, not *लंबा*."
    example_gloss: "The meeting was very long."
  hi.b2.unit03.lesson01.teach.thoda:
    title: "a little / somewhat"
    gloss: "a little / somewhat (of quantity or degree)"
    example_gloss: "This is a little difficult."
  hi.b2.unit03.lesson01.teach.kuch_had_tak:
    title: "to some extent"
    gloss: "to some extent"
    note: "*कुछ हद तक* softens how TRUE a statement is, distinct from *थोड़ा* which softens quantity/degree -- English 'a little' covers both, Hindi keeps them separate."
  hi.b2.unit03.lesson01.teach.zara:
    title: "a bit"
    gloss: "a bit (mild softener)"
    example_gloss: "This is a bit expensive."
  hi.b2.unit03.lesson01.teach.aur_chahiye:
    title: "more time is needed"
    gloss: "more time is needed / we needed more time"
    note: "*हमें और समय चाहिए था* -- *चाहिए* never changes for gender; *था* agrees with *समय* (time, masculine), never with the speaker."
  hi.b2.unit03.lesson01.teach.grammar_naram:
    title: "This presentation was a bit long. This is true to some extent. It seems to me that we needed more time."
    gloss: "This presentation was a bit long. This is true to some extent. It seems to me that we needed more time."
    note: "Softening a statement: *थोड़ा* (a little), *कुछ हद तक* (to some extent), and *ज़रा* (a bit) all lower how strong or absolute a claim sounds, without changing what it says."

  hi.b2.unit03.lesson02.teach.kharaab:
    title: bad
    gloss: bad
    example_gloss: "This idea isn't bad."
  hi.b2.unit03.lesson02.teach.balki:
    title: rather
    gloss: "rather / but rather"
    example_gloss: "This isn't easy, rather it is difficult."
  hi.b2.unit03.lesson02.teach.aisa_nahin_balki:
    title: "it's not that..., rather..."
    gloss: "it's not that..., rather..."
    note: "*ऐसा नहीं है कि..., बल्कि...* is a fixed contrast frame for softening a criticism -- deny the harsher reading, then state the milder truth."
  hi.b2.unit03.lesson02.teach.poori_tarah_se:
    title: "completely / entirely"
    gloss: "completely / entirely"
    example_gloss: "I am completely ready."
  hi.b2.unit03.lesson02.teach.grammar_savdhani:
    title: "It's not that it was bad, rather it was a bit long. I don't completely agree."
    gloss: "It's not that it was bad, rather it was a bit long. I don't completely agree."
    note: "Formulating carefully means denying the strong/blunt reading before giving the softer, more accurate one -- *ऐसा नहीं है कि...बल्कि...* and *पूरी तरह से...नहीं* both do this."

  hi.b2.unit03.lesson03.teach.bilkul:
    title: absolutely
    gloss: "absolutely / totally"
    example_gloss: "This is absolutely the right place."
  hi.b2.unit03.lesson03.teach.sachmuch:
    title: "really / truly"
    gloss: "really / truly"
    example_gloss: "This is really good."
  hi.b2.unit03.lesson03.teach.shaandaar:
    title: "wonderful / excellent"
    gloss: "wonderful / excellent"
    example_gloss: "That is a wonderful idea."
  hi.b2.unit03.lesson03.teach.vichaar:
    title: idea
    gloss: idea
    example_gloss: "I like this idea."
  hi.b2.unit03.lesson03.teach.pasand:
    title: "is liked"
    gloss: "is liked / likes"
    note: "*X को Y पसंद है* literally means 'to X, Y is pleasing' -- *पसंद* never changes for who is speaking, so *मुझे...पसंद है* ('I like...') is safe for any speaker."
  hi.b2.unit03.lesson03.teach.hi_emphasis:
    title: "precisely / only"
    gloss: "precisely / only / exactly (emphasis particle)"
    note: "*ही* attaches directly to the word it emphasizes: *यह* + *ही* = *यही* ('this very thing'). English marks this with stress in speech; Hindi marks it with a word."
    example_gloss: "This very thing is the right answer."
  hi.b2.unit03.lesson03.teach.sabse_accha_hissa:
    title: "the best part"
    gloss: "the best part"
    note: "*सबसे* ('the most') plus an adjective makes a superlative: *सबसे अच्छा* = 'the best'."
  hi.b2.unit03.lesson03.teach.grammar_zor:
    title: "This presentation was absolutely wonderful. I really like this idea. This very thing was the best part."
    gloss: "This presentation was absolutely wonderful. I really like this idea. This very thing was the best part."
    note: "Emphasizing a statement: *बिल्कुल* (absolutely), *सचमुच* (really), and *ही* (precisely) all strengthen a claim without changing what it says."

  hi.b2.unit03.lesson04.teach.asal_mein:
    title: "actually / in fact"
    gloss: "actually / in fact"
    example_gloss: "Actually, I'm a bit tired."
  hi.b2.unit03.lesson04.teach.mukhya_samasya:
    title: "the main problem"
    gloss: "the main problem"
  hi.b2.unit03.lesson04.teach.zaroori:
    title: "important / necessary"
    gloss: "important / necessary"
    example_gloss: "It's important to come on time."
  hi.b2.unit03.lesson04.teach.sabse_zaroori_baat:
    title: "the most important thing is that..."
    gloss: "the most important thing is that..."
  hi.b2.unit03.lesson04.teach.sirf_yahi:
    title: "this is the only problem"
    gloss: "this is the only problem"
    note: "*सिर्फ़* ('only') plus *यही* ('this very thing') together focus attention narrowly on one point, ruling out others."
  hi.b2.unit03.lesson04.teach.grammar_focus:
    title: "Actually, this isn't the main problem. The most important thing is that we needed time. This is the only problem."
    gloss: "Actually, this isn't the main problem. The most important thing is that we needed time. This is the only problem."
    note: "Focusing means directing attention to exactly one point -- *असल में* (actually), *सबसे ज़रूरी बात* (the most important thing), and *सिर्फ़...ही* (only...) all narrow the focus."

  hi.b2.unit03.lesson05.teach.reading:
    title: "Reading: a presentation review"
    gloss: "This presentation was good to some extent. Actually, the most important thing is that the information was correct. It's not that it was bad, rather it was a bit long. I really liked some parts, but I don't completely agree that it was absolutely perfect."
    glosses:
