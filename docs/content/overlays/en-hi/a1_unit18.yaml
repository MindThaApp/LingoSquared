answer_policy:
  existential_quantity: >-
    "[Place] + में + [number] + [noun] + है/हैं" states what's in a home
    and how many. The verb must agree with the NUMBER (है for one, हैं
    for more than one), not with the place -- a typed answer mismatching
    singular/plural verb agreement (e.g. "घर में तीन कमरा है") is the
    exact ungrammatical error this unit's own grammar_check exercises
    target, and should be marked incorrect, not tolerated as a minor
    typo.
  masculine_plural: >-
    *Kamra* (one room) becomes *kamre* (more than one room) -- the "-आ"
    ending masculine noun plural rule. A typed answer using the singular
    form where the sentence's own number word calls for plural (or vice
    versa) is a real grammar error, not a typo.
  feminine_plural: >-
    *Kursi* (one chair) becomes *kursiyan* (more than one chair);
    *khidki* (one window) becomes *khidkiyan* (more than one window) --
    the "-ई" ending feminine noun plural rule, a genuinely different
    pattern from the masculine rule above. Judge the same way: wrong
    number agreement is a grammar error, not a typo.
  scope_note: >-
    *Mez* (table), *bistar* (bed), *bathroom*, and *bedroom* are kept
    singular-only in this unit's own exercises by design (their own
    plural rules aren't taught yet) -- don't expect or accept a plural
    form of these four words as a typed answer here.
  gender_agreement: >-
    *Bada*/*chota* (big/small) agree with the noun's own gender --
    masculine घर takes *bada*/*chota* (not *badi*/*choti*), feminine
    रसोई takes *badi* (not *bada*), matching unit 14's already-taught
    gender-agreement rule. A typed answer using the wrong gender form is
    marked incorrect as a real grammar error, not tolerated.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question
    marks (?) may likewise be omitted, but the fully punctuated form
    remains the model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation. For any exercise asking the learner to describe their
    own home, accept any of this unit's taught phrasings that fit the
    prompt, not only the single model sentence given in
    `accepted_answers`.

course:
  title: "Hindi A1"

units:
  hi.a1.unit18.housing:
    title: "Housing"

lessons:
  hi.a1.unit18.lesson01.kamra_rasoi_bathroom_bedroom:
    title: "Room, kitchen, bathroom, and bedroom"
  hi.a1.unit18.lesson02.mez_kursi_bistar_khidki:
    title: "Table, chair, bed, and window"
  hi.a1.unit18.lesson03.priya_arjun_ghar:
    title: "Priya and Arjun: what's the house like?"

teaching:
  hi.a1.unit18.lesson01.teach.ghar_review:
    title: "Review: house / home"
    gloss: "house / home"
    note: "First taught in unit 8 -- this whole unit's topic word."
    example_gloss: "This is a house."

  hi.a1.unit18.lesson01.teach.mein_review:
    title: "Review: in / at"
    gloss: "in / at"
    note: "First taught in unit 1 -- used throughout this unit to place rooms and objects."
    example_gloss: "I work at the office."

  hi.a1.unit18.lesson01.teach.hai_hain_review:
    title: "Review: is, are"
    gloss: "is (singular), are (plural)"
    note: "The singular/plural copula pair this unit's whole quantity pattern depends on."
    example_gloss:
      - "This is a house."
      - "My grandfather lives in Delhi."

  hi.a1.unit18.lesson01.teach.numbers_review:
    title: "Review: how many, one, two, three"
    gloss: "how many, one, two, three"
    note: "First taught in units 2/7 -- reused here to count rooms."
    example_gloss:
      - "I have three brothers."
      - "How many rooms are in the house?"

  hi.a1.unit18.lesson01.teach.kamra_kamre:
    title: "Room (singular / plural)"
    gloss: "room, rooms"
    note: "A new noun. Watch the plural: *kamra* (one) becomes *kamre* (more than one) -- see this lesson's own grammar note."
    example_gloss:
      - "There is one room in the house."
      - "There are three rooms in the house."

  hi.a1.unit18.lesson01.teach.grammar_room_plural:
    title: "Masculine -a -> -e plural"
    gloss: "Masculine nouns ending in '-a' change to '-e' in the plural -- 'kamra' (one) becomes 'kamre' (more than one). The verb also changes with the number: 'hai' for one, 'hain' for more than one -- e.g. 'ghar mein ek kamra hai' but 'ghar mein teen kamre hain'."
    note: "This course's first formally taught noun-plural rule, disclosed before any exercise relies on it."

  hi.a1.unit18.lesson01.teach.rasoi:
    title: "Kitchen"
    gloss: "kitchen"
    note: "A new noun, this unit's first room word."
    example_gloss: "There is a kitchen in the house."

  hi.a1.unit18.lesson01.teach.bathroom:
    title: "Bathroom"
    gloss: "bathroom"
    note: "A common English loanword in everyday spoken Hindi, same pattern as *doctor*/*engineer* (unit 16/17)."
    example_gloss: "There is a bathroom in the house."

  hi.a1.unit18.lesson01.teach.bedroom:
    title: "Bedroom"
    gloss: "bedroom"
    note: "Also a common loanword, invariant like *bathroom* -- doesn't take its own plural suffix, only the numeral + *hain* pattern."
    example_gloss: "There are two bedrooms in the house."

  hi.a1.unit18.lesson01.teach.ghar_mein_kitne_kamre_phrase:
    title: "How many rooms are in the house?"
    gloss: "How many rooms are in the house?"
    note: "This lesson's opening question."

  hi.a1.unit18.lesson01.teach.ghar_mein_teen_kamre_phrase:
    title: "There are three rooms in the house."
    gloss: "There are three rooms in the house."
    note: "A model answer to this lesson's opening question."

  hi.a1.unit18.lesson02.teach.aur_review:
    title: "Review: and"
    gloss: "and"
    note: "First taught in unit 1 -- reused here to list furniture together."
    example_gloss: "I liked that too, and you?"

  hi.a1.unit18.lesson02.teach.mez:
    title: "Table"
    gloss: "table"
    note: "A new noun, kept singular-only in this unit's exercises (its own plural rule isn't taught yet)."
    example_gloss: "There is a table in the kitchen."

  hi.a1.unit18.lesson02.teach.kursi_kursiyan:
    title: "Chair (singular / plural)"
    gloss: "chair, chairs"
    note: "A new noun. Watch the plural: *kursi* (one) becomes *kursiyan* (more than one) -- a different rule from *kamra*/*kamre*, see this lesson's own grammar note."
    example_gloss:
      - "There is a chair in the kitchen."
      - "There are four chairs in the kitchen."

  hi.a1.unit18.lesson02.teach.chaar_review:
    title: "Review: four"
    gloss: "four"
    note: "First taught in unit 2 -- reused here to count chairs."
    example_gloss: "There are four chairs in the kitchen."

  hi.a1.unit18.lesson02.teach.grammar_feminine_plural:
    title: "Feminine -i -> -iyan plural"
    gloss: "Feminine nouns ending in '-i' change to '-iyan' in the plural -- 'kursi' (one) becomes 'kursiyan' (more than one), the same way 'kamra' became 'kamre' earlier in this unit under the masculine rule -- but the rule here is different, because this word is feminine and ends in '-i'."
    note: "The second plural rule this unit, deliberately taught right after the first so the contrast is easy to see."

  hi.a1.unit18.lesson02.teach.bistar:
    title: "Bed"
    gloss: "bed"
    note: "A new noun, kept singular-only in this unit's exercises."
    example_gloss: "There is a bed in the bedroom."

  hi.a1.unit18.lesson02.teach.khidki_khidkiyan:
    title: "Window (singular / plural)"
    gloss: "window, windows"
    note: "Follows the same '-i' -> '-iyan' feminine plural rule as *kursi*/*kursiyan*."
    example_gloss:
      - "There is a window in the bedroom."
      - "There are two windows in the bedroom."

  hi.a1.unit18.lesson02.teach.rasoi_mein_mez_phrase:
    title: "There is a table in the kitchen."
    gloss: "There is a table in the kitchen."
    note: "The place + object pattern applied to the kitchen."

  hi.a1.unit18.lesson02.teach.bedroom_mein_bistar_phrase:
    title: "There is a bed in the bedroom."
    gloss: "There is a bed in the bedroom."
    note: "The place + object pattern applied to the bedroom."

  hi.a1.unit18.lesson03.teach.kaisa_review:
    title: "Review: what kind of / what's it like"
    gloss: "what kind of / what's it like"
    note: "First taught in unit 12 -- reused here to ask about a home."
    example_gloss: "What's your house like?"

  hi.a1.unit18.lesson03.teach.bada_chota_review:
    title: "Review: big, small"
    gloss: "big (masc.), big (fem.), small (masc.), small (fem.)"
    note: "First taught in unit 14 -- reused here to describe a home. Agrees with the noun's own gender: masculine *ghar* takes *bada*/*chota*, feminine *rasoi* takes *badi*."
    example_gloss:
      - "My house is small."
      - "This is a big kitchen."

  hi.a1.unit18.lesson03.teach.ya_review:
    title: "Review: or"
    gloss: "or"
    note: "First taught in unit 14 -- reused here to ask a choice question."
    example_gloss: "Is your house big or small?"

  hi.a1.unit18.lesson03.teach.arjun_priya_review:
    title: "Review: Arjun, Priya"
    gloss: "Arjun, Priya"
    note: "A reminder of both characters' names before this lesson's word_order/grammar_check exercises use them to name whose home is being described."
    example_gloss:
      - "My name is Arjun."
      - "My name is Priya."

  hi.a1.unit18.lesson03.teach.ka_review:
    title: "Review: 's (possessive)"
    gloss: "'s (possessive, masculine noun)"
    note: "First taught in units 7/10/12/14/15 -- reused here to name whose house is being described, kept in its plain nominative form throughout this unit (see this file's own scope-narrowing note)."
    example_gloss: "Priya's house is small."

  hi.a1.unit18.lesson03.teach.dialogue.line01:
    title: "Arjun asks Priya about her house"
    gloss: "Priya, is your house big or small?"
  hi.a1.unit18.lesson03.teach.dialogue.line02:
    title: "Priya says her house is small"
    gloss: "My house is small. There are two rooms in the house, a kitchen and a bathroom."
  hi.a1.unit18.lesson03.teach.dialogue.line03:
    title: "Priya asks Arjun the same question"
    gloss: "And your house, Arjun?"
  hi.a1.unit18.lesson03.teach.dialogue.line04:
    title: "Arjun says his house is big"
    gloss: "My house is big. There are three bedrooms in the house and a big kitchen."
  hi.a1.unit18.lesson03.teach.dialogue.line05:
    title: "Priya asks what's in the bedroom"
    gloss: "Wow! What's in the bedroom?"
  hi.a1.unit18.lesson03.teach.dialogue.line06:
    title: "Arjun describes the bedroom"
    gloss: "There is a bed and two windows in the bedroom."
  hi.a1.unit18.lesson03.teach.dialogue.line07:
    title: "Priya reacts"
    gloss: "Very nice!"
  hi.a1.unit18.lesson03.teach.dialogue.line08:
    title: "Arjun thanks her"
    gloss: "Thanks!"

  hi.a1.unit18.lesson03.teach.grammar_summary:
    title: "Three main rules"
    gloss: "This unit's three main rules: (1) '[place] + mein + [number] + [noun] + hai/hain' states what's in a home and how many; (2) masculine nouns ending in '-a' become '-e' in the plural (kamra -> kamre); (3) feminine nouns ending in '-i' become '-iyan' in the plural (kursi -> kursiyan, khidki -> khidkiyan)."
    note: "A closing summary tying the whole unit's grammar together, mirroring unit 15-17's own paradigm-tying grammar note."

  hi.a1.unit18.lesson03.teach.home_reading:
    title: "Reading about two homes"
    gloss: "Priya's house is small. There are two rooms in the house, a kitchen and a bathroom. Arjun's house is big. There are three bedrooms in the house and a big kitchen."
    note: "A short, direct profile (no new narrative framing) restating exactly the facts already established in the dialogue, no new claims -- directly serves this outcome's own 'read a short housing description' requirement."
    glosses:
      घर: "house / home"
      छोटा: "small"
      कमरे: "rooms"
      रसोई: "kitchen"
      बाथरूम: "bathroom"
      बड़ा: "big"
      बेडरूम: "bedrooms"
      बड़ी: "big (feminine)"

