    home: small, 2 rooms = kitchen + bathroom; Arjun's home: big, 3
    bedrooms + 1 big kitchen, bedroom has 1 bed + 2 windows -- all
    mutually consistent, none contradicted), the disclosed nasalization/
    nuqta discipline (verified via direct codepoint hex dump for मेज़
    against रोज़'s ज़, खिड़की/खिड़कियाँ against बड़ा's ड़, and
    कुर्सियाँ/खिड़कियाँ's chandrabindu against हूँ's chandrabindu -- all
    exact codepoint matches, zero anusvara decisions needed this unit),
    the confirmed accumulates-across-lessons-within-one-file tokenizer
    behavior, the word-order duplicate-token check, and the §17
    fill_in_blank ambiguity check (five blanks, each disambiguated by an
    explicit English instruction naming the intended word, not
    `interchangeable: true`, since every candidate pair is genuinely
    different vocabulary sharing only the same slot SHAPE). Both files
