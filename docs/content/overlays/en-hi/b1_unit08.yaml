answer_policy:
  register: >-
    This unit's dialogue is between Priya and an unnamed shopkeeper
    (दुकानदार), addressed with *aap* (polite) throughout -- a
    deliberate register shift from Priya/Arjun's established *tum*
    conversations, matching a service complaint's appropriate register.
  kripya_karein: >-
    "*Kripya*...*karein*" ("please...[do]") is the polite *aap*-register
    imperative used to request a resolution -- don't accept the
    informal *tum*-imperative "*karo*" where the exercise specifically
    targets this polite request form.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question
    marks (?) may likewise be omitted, but the fully punctuated form
    remains the model answer. For the two-sentence culminating writing
    exercise, also accept the internal sentence-boundary period being
    replaced by a comma, or omitted with a space, as equivalent.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

