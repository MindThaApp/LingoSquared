answer_policy:
  nasalization_marks: >-
    Display and teach the correct chandrabindu/anusvara distinction. No
    new spelling AMBIGUITY was needed for this unit's own new vocabulary
    -- बाएँ/दाएँ/जाऊँ all follow the already-established
    non-ascending-vowel-sign chandrabindu rule from units 01-08 (यहाँ,
    वहाँ, कहाँ). In typed A1 answers, accept a variant that drops a
    nasalization mark entirely or substitutes anusvara for chandrabindu
    (or vice versa) when every other character is correct. Do not
    extend this tolerance to a wrong vowel or consonant, which changes
    the actual word.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question
    marks (?), exclamation marks, and commas may likewise be omitted,
    but the fully punctuated form remains the model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or nasalization marks.

course:
  title: "Hindi A1"

units:
  hi.a1.unit09.directions:
    title: "Directions"

lessons:
  hi.a1.unit09.lesson01.seedhe_baaen_daaen:
    title: "Straight, left, right"
  hi.a1.unit09.lesson02.yahan_se_kaise_jaun:
    title: "How do I get there?"
  hi.a1.unit09.lesson03.priya_arjun_rasta_poochna:
    title: "Priya and Arjun: asking the way"

teaching:
  hi.a1.unit09.lesson01.teach.review_places:
    title: "Review: places"
    gloss: "bank, school, hospital, park, station, post office"
    note: "A quick review of the place words from the previous unit -- this unit reuses them heavily."
    example_gloss:
      - "The bank is here."
      - "The post office is near the bank."

  hi.a1.unit09.lesson01.teach.review_function_words:
    title: "Review: is, where, here, there, from, of, OK"
    gloss: "is, where, here, there, from, of/'s, OK"
    note: "A quick review of small function words from earlier units that this unit's exercises reuse."
    example_gloss:
      - "Where is the bank?"
      - "The park is there."

  hi.a1.unit09.lesson01.teach.seedhe_baaen_daaen:
    title: "Straight, left, right"
    gloss: "straight ahead, left, right"
    note: "The three core direction words for this unit."
    example_gloss:
      - "Go straight ahead."
      - "Turn left."

  hi.a1.unit09.lesson01.teach.jao_muro:
    title: "Go!, turn!"
    gloss: "go!, turn! (informal command)"
    note: "Tum-form commands -- the natural register for two friends giving each other directions."
    example_gloss:
      - "Go straight ahead."
      - "Turn right."

  hi.a1.unit09.lesson01.teach.yahan_se_seedhe_jao:
    title: "Go straight from here"
    gloss: "Go straight ahead from here."
    note: "Combines this lesson's new words with 'yahaan se' (from here)."

  hi.a1.unit09.lesson01.teach.baaen_muro_phrase:
    title: "Turn left"
    gloss: "Turn left."
    note: "A standalone command, ready to use on its own."

  hi.a1.unit09.lesson01.teach.daaen_muro_phrase:
    title: "Turn right"
    gloss: "Turn right."
    note: "The mirror command to 'baaen muro'."

  hi.a1.unit09.lesson01.teach.imperative_note:
    title: "The -o command ending"
    gloss: "'Jaao' and 'muro' are tum-form commands, like 'bataao' and 'gino' -- they all end in '-o'."
    note: "Flags the shared informal-command pattern against two words already taught in earlier units (bataao in unit 7, gino in unit 2)."

  hi.a1.unit09.lesson02.teach.bank_kaise_jaun:
    title: "How do I get to the bank?"
    gloss: "How do I get to the bank?"
    note: "The core question for asking directions, using the first-person 'should I go' form."

  hi.a1.unit09.lesson02.teach.tak:
    title: "Until / up to"
    gloss: "until / up to"
    note: "Already seen in unit 2 for counting ('zero se das tak'); reused here in its equally real spatial sense."
    example_gloss: "Go straight until the bank."

  hi.a1.unit09.lesson02.teach.bank_tak_seedhe_jao:
    title: "Go straight until the bank"
    gloss: "Go straight until the bank."
    note: "A sample sentence using 'tak' spatially."

  hi.a1.unit09.lesson02.teach.pahle_phir:
    title: "First, then"
    gloss: "first, then"
    note: "A pair of words used to sequence two direction steps."
    example_gloss:
      - "First go straight ahead."
      - "Then turn left."

  hi.a1.unit09.lesson02.teach.pahle_seedhe_phir_baaen:
    title: "First straight, then left"
    gloss: "First go straight ahead, then turn left."
    note: "Combines 'pahle' and 'phir' into one two-step instruction."

  hi.a1.unit09.lesson02.teach.pahle_phir_note:
    title: "Pahle and phir"
    gloss: "'Pahle' and 'phir' link two steps -- the first action goes with 'pahle', the second with 'phir', like 'pahle seedhe jaao, phir baaen muro.'"
    note: "A real, useful grammar point about how to sequence multi-step directions."

  hi.a1.unit09.lesson03.teach.nukkad:
    title: "Street corner"
    gloss: "street corner"
    note: "A new place word for this lesson's closing dialogue, used with 'par' (at/on)."
    example_gloss:
      - "The bank is at the corner."
      - "The park is behind the school."

  hi.a1.unit09.lesson03.teach.bas:
    title: "Just / only"
    gloss: "just / only"
    note: "Also a common loanword for 'bus' (the vehicle), but that sense is never taught in this course, so there's no real ambiguity here."
    example_gloss: "Just go a little more."

  hi.a1.unit09.lesson03.teach.samajh_gaya:
    title: "Understood / got it"
    gloss: "understood / got it"
    note: "A common two-word expression: 'samajh' (the stem of 'samajhna', to understand) plus 'gaya' (went), which marks the action as done. This is the male form -- Priya would say 'samajh gayi'."
    example_gloss: "I understood. / Got it."

  hi.a1.unit09.lesson03.teach.accha_bahut_shukriya:
    title: "OK! Thanks a lot!"
    gloss: "OK! Thanks a lot!"
    note: "Reuses 'accha', 'bahut', and 'shukriya' from earlier units."

  hi.a1.unit09.lesson03.teach.koi_baat_nahin_phir_milenge:
    title: "No problem! See you again."
    gloss: "No problem! See you again."
    note: "This course's own standard closing phrase, reused verbatim from Unit 8."

  hi.a1.unit09.lesson03.teach.dialogue.line01:
    title: "Arjun asks about the post office"
    gloss: "Arjun asks Priya how to get to the post office."
    note: "Reuses this lesson's own opening question pattern from lesson 2."
  hi.a1.unit09.lesson03.teach.dialogue.line02:
    title: "Priya starts the directions"
    gloss: "Priya says: from here, first go straight ahead."
    note: "Reuses 'yahaan se' and 'pahle' from earlier in this unit."
  hi.a1.unit09.lesson03.teach.dialogue.line03:
    title: "Arjun asks what's next"
    gloss: "Arjun says OK, and asks what's next."
  hi.a1.unit09.lesson03.teach.dialogue.line04:
    title: "Priya continues"
    gloss: "Priya says: then turn left at the bank's corner."
    note: "Introduces 'nukkad' (street corner) in context."
  hi.a1.unit09.lesson03.teach.dialogue.line05:
    title: "Arjun confirms and asks again"
    gloss: "Arjun repeats 'left', confirms OK, and asks what's next."
  hi.a1.unit09.lesson03.teach.dialogue.line06:
    title: "Priya finishes the first route"
    gloss: "Priya says: just go a little more -- the post office is there, near the bank."
    note: "Introduces 'bas' (just/only), and stays consistent with Unit 8's own established fact that the post office is near the bank."
  hi.a1.unit09.lesson03.teach.dialogue.line07:
    title: "Arjun understands and asks about the park"
    gloss: "Arjun says he understood, and asks how to get to the park."
    note: "Introduces the 'samajh gaya' idiom."
  hi.a1.unit09.lesson03.teach.dialogue.line08:
    title: "Priya gives the second route"
    gloss: "Priya says: the park? First go straight ahead, then turn right -- the park is behind the school."
    note: "Stays consistent with Unit 8's own established fact that the park is behind the school."
  hi.a1.unit09.lesson03.teach.dialogue.line09:
    title: "Arjun thanks Priya"
    gloss: "Arjun says he understood, and thanks Priya a lot."
  hi.a1.unit09.lesson03.teach.dialogue.line10:
    title: "Priya closes"
    gloss: "Priya says no problem, see you again."
    note: "The same closing line as Unit 8's dialogue, reused verbatim."

exercises:
