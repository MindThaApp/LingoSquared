answer_policy:
  nasalization_marks: >-
    Display and teach the correct chandrabindu/anusvara distinction.
    This unit's own new vocabulary needs no new nasalization marks
    beyond हैं, already established in unit01 -- the policy from
    units 01/02 carries forward unchanged: in typed A1 answers, accept
    a variant that drops a nasalization mark entirely or substitutes
    anusvara for chandrabindu when every other character is correct.
    Do not extend this tolerance to a wrong vowel or consonant, which
    changes the actual word.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question
    marks (?) and exclamation marks may likewise be omitted, but the
    fully punctuated form remains the model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    (aap vs. tum) rather than written punctuation or nasalization marks.

course:
  title: "Hindi A1"

units:
  hi.a1.unit03.dates:
    title: "Days and dates"

lessons:
  hi.a1.unit03.lesson01.days_of_week:
    title: "Days of the week"
  hi.a1.unit03.lesson02.months_and_dates:
    title: "Months and asking the date"
  hi.a1.unit03.lesson03.next_class_and_birthday:
    title: "The next class, and birthdays"

teaching:
  hi.a1.unit03.lesson01.teach.aaj:
    title: "Today"
    gloss: "today"
    note: "The word you'll reuse in almost every sentence in this lesson."
    example_gloss: "The weather is nice today."

  hi.a1.unit03.lesson01.teach.somvar:
    title: "Monday"
    gloss: "Monday"
    note: "Named after सोम (the Moon) -- like English Monday, the moon's day."
    example_gloss: "Yoga class is on Monday."

  hi.a1.unit03.lesson01.teach.mangalvar:
    title: "Tuesday"
    gloss: "Tuesday"
    note: "Named after मंगल (Mars), the same pattern most Hindi weekday names follow."
    example_gloss: "Today is Tuesday."

  hi.a1.unit03.lesson01.teach.budhvar:
    title: "Wednesday"
    gloss: "Wednesday"
    note: "Named after बुध (Mercury)."
    example_gloss: "Today is Wednesday."

  hi.a1.unit03.lesson01.teach.guruvar:
    title: "Thursday"
    gloss: "Thursday"
    note: "Named after गुरु (Jupiter)."
    example_gloss: "Today is Thursday."

  hi.a1.unit03.lesson01.teach.shukravar:
    title: "Friday"
    gloss: "Friday"
    note: "Named after शुक्र (Venus)."
    example_gloss: "There's no yoga class on Friday."

  hi.a1.unit03.lesson01.teach.shanivar:
    title: "Saturday"
    gloss: "Saturday"
    note: "Named after शनि (Saturn)."
    example_gloss: "Today is Saturday."

  hi.a1.unit03.lesson01.teach.ravivar:
    title: "Sunday"
    gloss: "Sunday"
    note: "Named after रवि, a Sanskrit name for the sun -- like English Sunday, the sun's day."
    example_gloss: "Today is Sunday."

  hi.a1.unit03.lesson01.teach.kaun_sa_din_hai:
    title: "Asking what day it is"
    gloss: "What day is it today?"
    note: >-
      *Kaun sa* ("which") agrees with the masculine noun *din* ("day") --
      you'll see the feminine form, *kaun si*, with feminine nouns later.

  hi.a1.unit03.lesson01.teach.yoga_class_monday:
    title: "Saying an event is on a day"
    gloss: "Yoga class is on Monday."
    note: >-
      *Ko* after a day name means "on" -- *somvar ko* is "on Monday,"
      the same pattern for every day of the week.

  hi.a1.unit03.lesson01.teach.no_class_friday:
    title: "Saying an event isn't on a day"
    gloss: "There's no yoga class on Friday."
    note: "Nahin negates the sentence; ko still marks the day, right at the front here for emphasis."

  hi.a1.unit03.lesson02.teach.jan_feb_mar:
    title: "January, February, March"
    gloss: "January, February, March"
    note: >-
      Hindi month names are mostly borrowed and instantly recognizable
      once you know the pattern -- no new grammar here, just vocabulary.
    example_gloss:
      - "My birthday is in January."
      - "The next holiday is in February."
      - "My birthday is in March."

  hi.a1.unit03.lesson02.teach.apr_may_jun:
    title: "April, May, June"
    gloss: "April, May, June"
    note: "Same recognizable pattern as the first three months."
    example_gloss:
      - "The next holiday is in April."
      - "My birthday is in May."
      - "The next holiday is in June."

  hi.a1.unit03.lesson02.teach.jul_aug_sep:
    title: "July, August, September"
    gloss: "July, August, September"
    note: "Sitambar is written here with an anusvara (सितंबर); the spelling with a half m (सितम्बर) is also common and equally correct."
    example_gloss:
      - "My birthday is in July."
      - "The next holiday is in August."
      - "My birthday is in September."

  hi.a1.unit03.lesson02.teach.oct_nov_dec:
    title: "October, November, December"
    gloss: "October, November, December"
    note: "Navambar and disambar use the same anusvara spelling as sitambar; नवम्बर and दिसम्बर (with a half m) are also common and equally correct."
    example_gloss:
      - "The next holiday is in October."
      - "My birthday is in November."
      - "The next holiday is in December."

  hi.a1.unit03.lesson02.teach.tareekh:
    title: "Date"
    gloss: "date"
    note: >-
      *Tareekh* is a feminine noun -- its question word takes the
      feminine form (*kitni tareekh*, never *kitna tareekh*), the same
      agreement pattern unit 2 taught with *keemat* and *umra*.
    example_gloss: "Today is the third."

  hi.a1.unit03.lesson02.teach.mein_postposition:
    title: "In (with a month)"
    gloss: "in -- used with a month name"
    note: >-
      *Mein* marks a month the way *ko* marks a day: *janvari mein* is
      "in January," never *janvari ko*.

  hi.a1.unit03.lesson02.teach.aaj_kitni_tareekh_hai:
    title: "Asking the date"
    gloss: "What is the date today?"
    note: "Literally \"how many is today's date\" -- kitni agrees with the feminine tareekh."

  hi.a1.unit03.lesson02.teach.aaj_teen_tareekh_hai:
    title: "Stating the date, by number alone"
    gloss: "Today is the third."
    note: >-
      Hindi states a date with a plain cardinal number (*teen*, "three"),
      not an ordinal like English "third" -- there's no separate
      "date word" to learn, just the numbers you already know.

  hi.a1.unit03.lesson02.teach.aaj_teen_january_hai:
    title: "Stating the date, with the month"
    gloss: "Today is January third."
    note: "The same cardinal-number pattern, now with the month name added after it."

  hi.a1.unit03.lesson03.teach.kab:
    title: "When"
    gloss: "when"
    note: "A simple, high-frequency question word."
    example_gloss: "When is the next class?"

  hi.a1.unit03.lesson03.teach.agli:
    title: "Next"
    gloss: "next"
    note: >-
      *Agli* is the feminine form -- *class* (क्लास) is treated as a
      feminine noun in everyday Hindi, so it takes *agli*, not the
      masculine *agla*.
    example_gloss: "The next class is on Tuesday."

  hi.a1.unit03.lesson03.teach.das_reprise:
    title: "Ten"
    gloss: "ten"
    note: "Reused from unit 2 -- needed here for a real date."
    example_gloss: "The next class is on the tenth."

  hi.a1.unit03.lesson03.teach.janmadin:
    title: "Birthday"
    gloss: "birthday"
    note: "A masculine noun -- mera janmadin, never meri janmadin."
    example_gloss: "My birthday is in December."

  hi.a1.unit03.lesson03.teach.tumhara_janmadin_kab_hai:
    title: "Asking someone's birthday, informally"
    gloss: "When is your birthday? (informal)"
    note: "Tumhara agrees with the masculine janmadin."

  hi.a1.unit03.lesson03.teach.mera_janmadin_january_mein_hai:
    title: "Stating your birthday"
    gloss: "My birthday is in January."
    note: "The natural full-sentence answer to Tumhara janmadin kab hai?"

  hi.a1.unit03.lesson03.teach.agli_class_kab_hai:
    title: "Asking when the next class is"
    gloss: "When is the next class?"
    note: "Combines agli (feminine, agreeing with class) with kab."

  hi.a1.unit03.lesson03.teach.agli_class_mangalvar_das_march:
    title: "Stating a full day-and-date"
    gloss: "The next class is Tuesday, March tenth."
    note: >-
      Weekday and date together, joined the same natural way English
      does it -- day first, then the numbered date and month.

  hi.a1.unit03.lesson03.teach.dialogue.line01:
    title: "Arjun asks about the next class"
    gloss: "Arjun asks when the next yoga class is."
    note: "Reuses this lesson's own question exactly, with yog added for clarity."
  hi.a1.unit03.lesson03.teach.dialogue.line02:
    title: "Priya gives the day and date"
    gloss: "Priya says the next class is Tuesday, March tenth."
    note: "Reuses this lesson's own day-and-date sentence exactly."
  hi.a1.unit03.lesson03.teach.dialogue.line03:
    title: "Arjun thanks her"
    gloss: "Arjun says okay, thanks."
    note: "Theek hai and shukriya both reuse vocabulary from unit 1."
  hi.a1.unit03.lesson03.teach.dialogue.line04:
    title: "Priya responds"
    gloss: "Priya says it's no trouble."
    note: "Koi baat nahin is a very common, natural way to say \"you're welcome\" or \"no problem.\""
  hi.a1.unit03.lesson03.teach.dialogue.line05:
    title: "Arjun asks Priya's birthday"
    gloss: "Arjun asks when Priya's birthday is."
    note: "Reuses this lesson's own informal birthday question exactly."
  hi.a1.unit03.lesson03.teach.dialogue.line06:
    title: "Priya answers"
    gloss: "Priya says her birthday is in January."
    note: "Reuses this lesson's own answer sentence exactly."
  hi.a1.unit03.lesson03.teach.dialogue.line07:
    title: "Arjun reacts and shares his own"
    gloss: "Arjun reacts positively, then says his own birthday is in December."
    note: "Accha reuses unit 1's vocabulary; December was already taught in lesson 2 of this unit."
  hi.a1.unit03.lesson03.teach.dialogue.line08:
    title: "Priya closes the conversation"
    gloss: "Priya agrees and says a casual see-you."
    note: "Theek hai and phir milte hain both reuse unit 1's farewell vocabulary."

exercises:
  hi.a1.unit03.lesson01.exercise01.select_budhvar:
    instruction: "Which word means Wednesday?"
    correct_option: "बुधवार"
    distractors: ["मंगलवार", "गुरुवार"]
    accepted_answers: ["बुधवार"]

  hi.a1.unit03.lesson01.exercise02.select_ravivar:
    instruction: "Which word means Sunday?"
    correct_option: "रविवार"
    distractors: ["शनिवार", "सोमवार"]
    accepted_answers: ["रविवार"]

  hi.a1.unit03.lesson01.exercise03.select_kaun_sa_din_meaning:
    instruction: "What does this question ask?"
    correct_option: "What day is it today?"
    distractors: ["What is the date today?", "What is your name?"]
    accepted_answers: ["What day is it today?"]

  hi.a1.unit03.lesson01.exercise04.match_days:
    instruction: "Match each Hindi day of the week to its English meaning."
    correct_response:
      "सोमवार": "Monday"
      "मंगलवार": "Tuesday"
      "बुधवार": "Wednesday"
      "गुरुवार": "Thursday"
      "शुक्रवार": "Friday"
      "शनिवार": "Saturday"
      "रविवार": "Sunday"

  hi.a1.unit03.lesson01.exercise05.order_kaun_sa_din:
    instruction: "Put the question in order: What day is it today?"
    correct_response: ["आज", "कौन", "सा", "दिन", "है"]

  hi.a1.unit03.lesson01.exercise06.order_yoga_monday:
    instruction: "Put the sentence in order: Yoga class is on Monday."
    correct_response: ["योग", "क्लास", "सोमवार", "को", "है"]

  hi.a1.unit03.lesson01.exercise07.fill_yoga_day:
    instruction: "Complete the sentence with the word that means \"on.\""
    accepted_answers: ["को"]
    feedback: "Somvar ko -- ko marks the day something happens on."

  hi.a1.unit03.lesson01.exercise08.fix_missing_ko:
    instruction: "This sentence is missing a word -- add it to correctly say \"There's no yoga class on Friday.\""
    accepted_answers:
      - "शुक्रवार को योग क्लास नहीं है।"
      - "शुक्रवार को योग क्लास नहीं है"
    feedback: "Shukravar ko yog class nahin hai -- ko is needed to mark Friday as the day."

  hi.a1.unit03.lesson01.exercise09.reply_today_wednesday:
    instruction: "Answer that today is Wednesday."
    accepted_answers:
      - "आज बुधवार है।"
      - "आज बुधवार है"

  hi.a1.unit03.lesson01.exercise10.speak_today_monday:
    instruction: "Say that today is Monday."
    accepted_answers:
      - "आज सोमवार है।"
      - "आज सोमवार है"

  hi.a1.unit03.lesson02.exercise01.select_april:
    instruction: "Which word means April?"
    correct_option: "अप्रैल"
    distractors: ["अगस्त", "जून"]
    accepted_answers: ["अप्रैल"]

  hi.a1.unit03.lesson02.exercise02.select_december:
    instruction: "Which word means December?"
    correct_option: "दिसंबर"
    distractors: ["नवंबर", "अक्टूबर"]
    accepted_answers: ["दिसंबर"]

  hi.a1.unit03.lesson02.exercise03.match_months:
    instruction: "Match each Hindi month to its English meaning."
    correct_response:
      "जनवरी": "January"
      "फ़रवरी": "February"
      "मार्च": "March"
      "अप्रैल": "April"
      "मई": "May"
      "जून": "June"
      "जुलाई": "July"
      "अगस्त": "August"
      "सितंबर": "September"
      "अक्टूबर": "October"
      "नवंबर": "November"
      "दिसंबर": "December"

  hi.a1.unit03.lesson02.exercise04.order_date_question:
    instruction: "Put the question in order: What is the date today?"
    correct_response: ["आज", "कितनी", "तारीख़", "है"]

  hi.a1.unit03.lesson02.exercise05.fill_date_january:
    instruction: "Complete the date you learned earlier in this lesson: today is January third."
    accepted_answers: ["तीन"]
    feedback: "Aaj teen janvari hai -- today is January third."

  hi.a1.unit03.lesson02.exercise06.fix_tareekh_agreement:
    instruction: "Correct the question -- tareekh is feminine, so its question word needs the feminine form."
    accepted_answers:
      - "आज कितनी तारीख़ है?"
      - "आज कितनी तारीख़ है"
      - "आज कितनी तारीख है?"
    feedback: "Aaj kitni tareekh hai? -- kitna is masculine and doesn't agree with the feminine tareekh."

  hi.a1.unit03.lesson02.exercise07.reply_date:
    instruction: "Answer in a full sentence that today is January third, writing the number in words."
    accepted_answers:
      - "आज तीन जनवरी है।"
      - "आज तीन जनवरी है"

  hi.a1.unit03.lesson02.exercise08.speak_date:
    instruction: "Say that today is January third."
    accepted_answers:
      - "आज तीन जनवरी है।"
      - "आज तीन जनवरी है"
      - "आज 3 जनवरी है"

  hi.a1.unit03.lesson03.exercise01.select_agli_class_kab:
    instruction: "Which question asks when the next class is?"
    correct_option: "अगली क्लास कब है?"
    distractors: ["तुम्हारा जन्मदिन कब है?", "आज कौन सा दिन है?"]
    accepted_answers: ["अगली क्लास कब है?", "अगली क्लास कब है"]

  hi.a1.unit03.lesson03.exercise02.select_tumhara_janmadin_kab:
    instruction: "Which question asks a friend when their birthday is?"
    correct_option: "तुम्हारा जन्मदिन कब है?"
    distractors: ["अगली क्लास कब है?", "आज कितनी तारीख़ है?"]
    accepted_answers: ["तुम्हारा जन्मदिन कब है?", "तुम्हारा जन्मदिन कब है"]

  hi.a1.unit03.lesson03.exercise03.comprehend_next_class_date:
    instruction: "Read the line. When is the next class?"
    correct_option: "Tuesday, March 10"
    distractors:
      - "Tuesday, March 12"
      - "Thursday, March 10"
    accepted_answers: ["Tuesday, March 10"]

  hi.a1.unit03.lesson03.exercise04.comprehend_priya_birthday:
    instruction: "Read the line. Which month is Priya's birthday in?"
    correct_option: "January"
    distractors:
      - "December"
      - "March"
    accepted_answers: ["January"]

  hi.a1.unit03.lesson03.exercise05.order_agli_class_kab:
    instruction: "Put the question in order: When is the next class?"
    correct_response: ["अगली", "क्लास", "कब", "है"]

  hi.a1.unit03.lesson03.exercise06.order_mera_janmadin:
    instruction: "Put the sentence in order: My birthday is in January."
    correct_response: ["मेरा", "जन्मदिन", "जनवरी", "में", "है"]

  hi.a1.unit03.lesson03.exercise07.match_questions_and_answers:
    instruction: "Match each line with its natural response."
    correct_response:
      "अगली क्लास कब है?": "अगली क्लास मंगलवार, दस मार्च को है।"
      "तुम्हारा जन्मदिन कब है?": "मेरा जन्मदिन जनवरी में है।"
      "ठीक है, शुक्रिया!": "कोई बात नहीं!"
      "अच्छा! और मेरा जन्मदिन दिसंबर में है।": "ठीक है, फिर मिलते हैं!"

  hi.a1.unit03.lesson03.exercise08.fill_next_class_date:
    instruction: "Complete the date of the next class from the dialogue, in words."
    accepted_answers: ["दस"]
    feedback: "Agli class mangalvar, das march ko hai -- the next class is Tuesday, March tenth."

  hi.a1.unit03.lesson03.exercise09.fix_birthday_postposition:
    instruction: "Correct the sentence -- a month name needs mein, not ko."
    accepted_answers:
      - "मेरा जन्मदिन जनवरी में है।"
      - "मेरा जन्मदिन जनवरी में है"
    feedback: "Mera janmadin janvari mein hai -- ko marks a day, mein marks a month."

  hi.a1.unit03.lesson03.exercise10.reply_own_birthday:
    instruction: "Answer that your birthday is in December."
    accepted_answers:
      - "मेरा जन्मदिन दिसंबर में है।"
      - "मेरा जन्मदिन दिसंबर में है"
      - "मेरा जन्मदिन दिसम्बर में है।"

  hi.a1.unit03.lesson03.exercise11.write_next_class_date:
    instruction: "Write the day and date of the next class, based on the dialogue, with the number in words."
    accepted_answers:
      - "मंगलवार, दस मार्च"
      - "मंगलवार दस मार्च"
      - "मंगलवार, दस मार्च को"
      - "अगली क्लास मंगलवार, दस मार्च को है।"

  hi.a1.unit03.lesson03.exercise12.speak_own_birthday:
    instruction: "Say that your birthday is in January, following the pattern from the dialogue."
    accepted_answers:
      - "मेरा जन्मदिन जनवरी में है।"
      - "मेरा जन्मदिन जनवरी में है"
