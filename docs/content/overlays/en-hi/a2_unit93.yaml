teaching:
  hi.a2.unit93.vah_kehta_hai_ki.lesson01.teach.shabd_kehta:
    title: Words for saying
    gloss: to say / says (man) / says (woman) / that / he, she / at home / in the office
    note: '*कहता है* is for a man, *कहती है* for a woman: the verb agrees with the person who speaks.'
    example_gloss:
    - Arjun says that he is at home.
    - Priya says that she is at the office.
  hi.a2.unit93.vah_kehta_hai_ki.lesson01.teach.gn_kehta_hai:
    title: Reporting with कहता है कि
    gloss: Arjun says that he is at home. Priya says that she is at the office.
    note: Use *कहता है कि* for a man and *कहती है कि* for a woman, then the message. The present tense stays the present.
  hi.a2.unit93.vah_kehta_hai_ki.lesson01.teach.gn_mein_vah:
    title: मैं becomes वह
    gloss: Arjun says, I am at home. Arjun says that he is at home.
    note: When you pass the message on, *मैं* becomes *वह* and *हूँ* becomes *है*.
  hi.a2.unit93.vah_kehta_hai_ki.lesson02.teach.shabd_uska:
    title: Words for his and her
    gloss: his, her (masc. thing) / his, her (fem. thing) / to him, to her / fever / mother / ill / phone is off
    note: '*उसका फ़ोन* (masculine thing), *उसकी माँ* (feminine thing): *उसका / उसकी* agree with the thing, not with the owner.'
    example_gloss:
    - Priya says that she has a fever.
    - Arjun says that his phone is off.
    - Priya says that her mother is ill.
  hi.a2.unit93.vah_kehta_hai_ki.lesson02.teach.gn_uska_uski:
    title: उसका or उसकी
    gloss: Arjun says that his phone is off. Priya says that her mother is ill.
    note: '*उसका* goes with a masculine thing (*फ़ोन*), *उसकी* with a feminine thing (*माँ*). *मेरा फ़ोन → उसका फ़ोन*, *मेरी माँ → उसकी माँ*.'
  hi.a2.unit93.vah_kehta_hai_ki.lesson02.teach.gn_mujhe_use:
    title: मुझे becomes उसे
    gloss: Priya says, I have a fever. Priya says that she has a fever.
    note: In the passed-on message *मुझे* becomes *उसे*.
  hi.a2.unit93.vah_kehta_hai_ki.lesson03.teach.shabd_poochta:
    title: Words for asking
    gloss: to ask / asks (man) / asks (woman) / whether / where / meeting / at what time
    note: After *पूछता है कि* a question word (*कहाँ, कब, कितने बजे*) stays as it is. For yes or no, use *क्या*.
    example_gloss:
    - Arjun asks where the meeting is.
    - Priya asks what time the train comes.
    - Arjun asks whether Priya will come.
    - Priya asks whether Arjun will come.
  hi.a2.unit93.vah_kehta_hai_ki.lesson03.teach.gn_poochta:
    title: Passing on a question
    gloss: Arjun asks where the meeting is. Priya asks what time the train comes.
    note: '*पूछता है कि* (man) and *पूछती है कि* (woman) are followed by a normal clause with the question word. There is no question mark.'
  hi.a2.unit93.vah_kehta_hai_ki.lesson03.teach.gn_poochta_kya:
    title: Yes or no questions
    gloss: Arjun asks whether Priya will come.
    note: For a question with the answer yes or no, put *क्या* after *कि*.
  hi.a2.unit93.vah_kehta_hai_ki.lesson04.teach.shabd_batata:
    title: Words for telling
    gloss: to tell / tells (man) / tells (woman) / at ten o’clock / closed / today / tell (to a friend)
    note: '*बताता है कि* is close to *कहता है कि*; it often passes on information.'
    example_gloss:
    - Priya says that the meeting is at ten o’clock.
    - Arjun says that the shop is closed today.
    - Tell Arjun that the meeting is at ten o’clock. (to a friend)
  hi.a2.unit93.vah_kehta_hai_ki.lesson04.teach.gn_batata:
    title: बताता है कि
    gloss: Priya says that the meeting is at ten. Arjun says that the shop is closed today.
    note: '*बताता / बताती है कि* works like *कहता / कहती है कि*.'
  hi.a2.unit93.vah_kehta_hai_ki.lesson04.teach.gn_bataao:
    title: Asking someone to pass it on
    gloss: Tell Arjun that the meeting is at ten.
    note: To ask a friend to pass on a message, say *… को बताओ कि …*.
  hi.a2.unit93.vah_kehta_hai_ki.lesson05.teach.shabd_sandesh:
    title: Words for the message
    gloss: message / three / for you / when / you will come (to a woman)
    note: '*आओगी* is for a woman you call *तुम*.'
    example_gloss:
    - There are three messages for you.
    - When will you come? (to a woman)
  hi.a2.unit93.vah_kehta_hai_ki.lesson05.teach.padho_sandesh:
    title: Neha leaves messages for Priya
    gloss: Priya, there are three messages for you. Your mother asks when you will come. Arjun says that his phone is off. He says that the meeting is at ten. Neha
    note: Find who says or asks each thing.
  hi.a2.unit93.vah_kehta_hai_ki.lesson06.teach.d1:
    title: Neha passes on a question
    gloss: 'Neha: Priya, Arjun is on the phone. He asks where you are.'
  hi.a2.unit93.vah_kehta_hai_ki.lesson06.teach.d2:
    title: Priya replies
    gloss: 'Priya: Tell him that I am at the office.'
  hi.a2.unit93.vah_kehta_hai_ki.lesson06.teach.d3:
    title: Neha passes on another question
    gloss: 'Neha: All right. He also asks whether you will come today.'
  hi.a2.unit93.vah_kehta_hai_ki.lesson06.teach.d4:
    title: Priya replies again
    gloss: 'Priya: Tell him that I will come late today.'
  hi.a2.unit93.vah_kehta_hai_ki.lesson06.teach.d5:
    title: Neha passes on his answer
    gloss: 'Neha: All right. Arjun says that he will make tea.'
