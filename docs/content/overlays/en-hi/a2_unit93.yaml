  notes: 'English overlay written from the realization. Drafted by drafting tool A. Grammar: reporting in the present with कहता / कहती है कि, पूछता / पूछती है कि (question word or क्या), बताता / बताती है कि, and the request X को बताओ कि ...; person shift (मैं → वह, मुझे → उसे, मेरा → उसका / उसकी, तुम stays तुम when speaking to the addressee); the reporting verb agrees with the speaker (man / woman). Present tense reporting only (no past reports). Priya, Arjun and Neha use tum. OPEN NATIVE QUESTIONS: (1) is ''वह पूछता है कि क्या तुम आज आओगी'' natural for a yes/no report, or is ''वह पूछता है कि तुम आज आओगी या नहीं'' better; (2) is कहता है कि / बताता है कि interchangeable at this level (typed answers accept both for ''says''); (3) is ''उसे बताओ कि मैं ऑफ़िस में हूँ'' the right way to ask a friend to pass on a message.'
answer_policy:
  punctuation: Hindi text is shown with the danda as the sentence-final mark. In typed answers, accept the danda, a plain period, or the mark omitted entirely as equivalent. Question marks may likewise be omitted.
  gender_agreement: Where the speaker or addressee is a named man or woman, the verb must agree with that person. Where the speaker is just 'I' (gender unspecified), both the masculine and the feminine form are accepted. Wrong agreement with a named person is a real grammar error, not a typo.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation.
course:
  title: Hindi A2
  description: Intermediate Hindi continuing the Priya and Arjun storyline, now with grammar-led units on reasons, sequencing, purpose, conditions, indirect questions and passing on messages.
units:
  hi.a2.unit93.vah_kehta_hai_ki:
    title: He Says That ...
    description: 'Pass on what someone says or asks, using the present tense only: कहता है कि, पूछता है कि, बताता है कि.'
