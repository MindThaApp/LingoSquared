teaching:
  hi.a2.unit76.lesson01.teach.badalna_radd_karna:
    title: Changing an appointment
    gloss: to move (an appointment) / to cancel
    note: '*अपॉइंटमेंट बदलना* means to move it to another time. *रद्द करना* means to cancel it completely.'
    example_gloss:
    - I want to move my appointment.
    - I have to cancel my appointment.
  hi.a2.unit76.lesson01.teach.aphsos_maf_keejie:
    title: Saying you are sorry
    gloss: unfortunately / sorry
    note: '*अफसोस* is a polite way to give bad news. *माफ़ कीजिए* is the polite apology (the *आप* form).'
    example_gloss:
    - Unfortunately I cannot come.
    - Sorry, I am too late.
  hi.a2.unit76.lesson01.teach.sailoon:
    title: The hairdresser's
    gloss: the hairdresser's (salon)
    note: '*सैलून* is the place; *हेयरस्टाइलिस्ट* is the person.'
    example_gloss: The salon is open from nine to six.
  hi.a2.unit76.lesson01.teach.kya_mera_apointment:
    title: Asking to move an appointment
    gloss: Can I move my appointment?
    note: 'A polite request can use the passive: *क्या मेरा अपॉइंटमेंट बदला जा सकता है?* *बदला जा सकता है* means ''can be changed'' and is the same for everyone.'
  hi.a2.unit76.lesson01.teach.aphsos_mera_ana:
    title: Saying you cannot come
    gloss: Unfortunately I cannot come.
  hi.a2.unit76.lesson01.teach.guruvar_ko_mera:
    title: 'Can: सकना and polite forms'
    gloss: I cannot come on Thursday. Can I move the appointment?
    note: 'Hindi has two easy ways to say ''can'' politely. For ''I cannot come'', say *मेरा आना नहीं हो पाएगा* (''my coming will not be possible''). For a request, use the passive: *बदला जा सकता है*. With *आप* use verb stem + *सकते हैं*: *क्या आप सोमवार को आ सकते हैं?* In a negative sentence *नहीं* stands before the last verb group: *गुरुवार को मेरा आना नहीं हो पाएगा*.'
  hi.a2.unit76.lesson02.teach.doosra_din:
    title: Another day
    gloss: another day
    note: '*दूसरा दिन* becomes *दूसरे दिन* before a postposition: *किसी दूसरे दिन* (''on some other day'').'
    example_gloss: Can it also be on another day?
  hi.a2.unit76.lesson02.teach.kya_somvar_ko:
    title: Suggesting a day
    gloss: Can it also be Monday?
    note: 'A weekday takes *को*: *सोमवार को*. A yes/no question starts with *क्या*: *क्या सोमवार को हो सकता है?*'
  hi.a2.unit76.lesson02.teach.kya_apke_lie:
    title: Does it suit you?
    gloss: Does Friday suit you? (formal)
    note: 'Hindi has no verb ''to suit''. Say *ठीक रहेगा* (''will be fine''): *क्या आपके लिए शुक्रवार ठीक रहेगा?* *आप* is the polite ''you'' for someone you do not know well; *आपके लिए* means ''for you''.'
  hi.a2.unit76.lesson02.teach.jee_han_yah:
    title: Saying yes
    gloss: Yes, that suits me well.
  hi.a2.unit76.lesson02.teach.jee_naheen_aphsos:
    title: Saying no politely
    gloss: Unfortunately not.
  hi.a2.unit76.lesson02.teach.kya_apke_lie_2:
    title: Does it suit you?
    gloss: Does Friday suit you? Yes, that suits me well. No, unfortunately not.
    note: 'To ask whether a time suits someone, use *आपके लिए ... ठीक रहेगा?* (to a friend: *तुम्हारे लिए*). Answer *जी हाँ, यह मेरे लिए ठीक रहेगा* to agree, or *जी नहीं, अफसोस* as a polite refusal. The word *जी* makes an answer more respectful.'
  hi.a2.unit76.lesson03.teach.kyonki_mujhe_khed:
    title: Because and I am sorry
    gloss: because / I am sorry
    note: '*क्योंकि* joins two full sentences and gives the reason. *मुझे खेद है* is a more careful apology than *सॉरी*.'
    example_gloss:
    - I cannot come, because I am ill.
    - I am sorry.
  hi.a2.unit76.lesson03.teach.asuvidha:
    title: Inconvenience
    gloss: the inconvenience
    note: '*असुविधा के लिए माफ़ कीजिए* is a polite phrase after you have caused someone extra trouble.'
    example_gloss: Sorry for the inconvenience.
  hi.a2.unit76.lesson03.teach.mera_ana_naheen:
    title: 'Reason: work'
    gloss: I cannot come, because I have to work.
  hi.a2.unit76.lesson03.teach.mera_ana_naheen_2:
    title: 'Reason: another appointment'
    gloss: I cannot come, because I have another appointment.
  hi.a2.unit76.lesson03.teach.mera_ana_naheen_3:
    title: 'Because: want'
    gloss: I cannot come, because I am ill.
    note: '*क्योंकि* introduces the reason. The reason is an ordinary sentence that ends with its verb. Put a comma before *क्योंकि*: *मेरा आना नहीं हो पाएगा, क्योंकि मैं बीमार हूँ।*'
  hi.a2.unit76.lesson04.teach.tay_karna_pahle:
    title: Agreeing and in advance
    gloss: to arrange / in advance
    note: '*तय करना* is to agree on a time or place together. *पहले से* means ''beforehand'', ''in advance''.'
    example_gloss:
    - Shall we arrange something?
    - Call a day in advance.
  hi.a2.unit76.lesson04.teach.somvar_ko_das:
    title: Accepting a time
    gloss: Monday at ten o'clock is fine.
  hi.a2.unit76.lesson04.teach.kya_ap_somvar:
    title: Asking if a time works
    gloss: Can you come on Monday at ten o'clock? (formal)
    note: '*आप ... सकते हैं* is the polite form of *तुम ... सकते हो*. The main verb *आ* comes right before *सकते हैं*, at the end.'
  hi.a2.unit76.lesson04.teach.to_somvar_ko:
    title: Closing the arrangement
    gloss: Then I will see you on Monday.
  hi.a2.unit76.lesson04.teach.to_ham_ek:
    title: Making a new appointment
    gloss: Then I will make a new appointment.
  hi.a2.unit76.lesson04.teach.somvar_ko_das_2:
    title: Day first, then time
    gloss: Monday at ten o'clock is fine. Can you come on Monday at ten o'clock?
    note: 'When you give a day and a time, say the day with *को*, then the time with *बजे*: *सोमवार को दस बजे*. In a polite question use *क्या आप ... सकते हैं?*'
  hi.a2.unit76.lesson05.teach.priy_arjun_apka:
    title: A message from the salon
    gloss: Dear Arjun, your appointment has been moved. Your new appointment is Monday at ten o'clock. Does this not suit you? Then please call us a day in advance. Then we will make a new appointment. See you Monday! Sharma Salon
    note: This is a typical short message from a business, so it uses the polite *आप* forms (*आपका*, *कीजिए*). *बदल दिया गया है* means 'has been changed'.
    glosses:
      प्रिय: dear
      अर्जुन: Arjun
      आपका: your (formal)
      अपॉइंटमेंट: appointment
      बदल: changed
      नया: new
      सोमवार: Monday
      दस: ten
      बजे: o'clock
      ठीक: fine, suits (ठीक रहेगा)
      यह: this
      नहीं: not
      रहेगा: (part of ठीक रहेगा)
      फोन: phone (call)
      हमें: us
      तब: then
      पहले: before (एक दिन पहले = a day in advance)
      बना: make
      हम: we
      मिलते: see you (मिलते हैं)
      सैलून: salon
      शर्मा: Sharma
  hi.a2.unit76.lesson06.teach.sharma_sailoon_namste:
    title: The salon answers
    gloss: 'Hairdresser: Sharma Salon, hello.'
  hi.a2.unit76.lesson06.teach.namste_main_arjun:
    title: Arjun explains and asks
    gloss: 'Arjun: Good afternoon, you are speaking to Arjun. I have an appointment on Thursday, but unfortunately I cannot come. Can I move the appointment?'
  hi.a2.unit76.lesson06.teach.jee_bilkul_kya:
    title: The hairdresser suggests Friday
    gloss: 'Hairdresser: Of course. Does Friday suit you?'
  hi.a2.unit76.lesson06.teach.jee_naheen_aphsos:
    title: Arjun suggests Monday
    gloss: 'Arjun: Unfortunately not, because I have to work. Can it also be Monday?'
  hi.a2.unit76.lesson06.teach.somvar_ko_das:
    title: The hairdresser agrees
    gloss: 'Hairdresser: Monday at ten o''clock is fine.'
  hi.a2.unit76.lesson06.teach.yah_mere_lie:
    title: Arjun accepts and apologises
    gloss: 'Arjun: That suits me well. Thank you very much and sorry for the inconvenience.'
  hi.a2.unit76.lesson06.teach.koee_bat_naheen:
    title: The hairdresser closes
    gloss: 'Hairdresser: No problem. See you Monday!'
