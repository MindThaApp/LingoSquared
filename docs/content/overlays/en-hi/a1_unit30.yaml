teaching:
  hi.a1.unit30.lesson01.teach.parhna_kasrat_karna:
    title: Reading, exercising, cooking
    gloss: to read, to exercise / play sports, to cook
    note: 'Hindi names hobbies with a verb ending in *-ना*: *पढ़ना*, *कसरत करना* and *खाना बनाना* (''to read'', ''to exercise'', ''to cook'').'
    example_gloss:
    - I like reading a book.
    - I exercise on Saturdays.
    - I like cooking for friends.
  hi.a1.unit30.lesson01.teach.khalee_samay:
    title: Free time
    gloss: free time
    note: '*खाली समय* (''empty time'') is the key phrase for talking about hobbies, and *में* gives ''in'': *खाली समय में*.'
    example_gloss: In my free time, I like to read.
  hi.a1.unit30.lesson01.teach.mujhe_khalee_samay:
    title: Saying what you do in your free time
    gloss: In my free time, I like to read.
    note: '*मुझे ... पढ़ना पसंद है* (''to me, reading is liked'') is how Hindi says ''I like to read''; *मुझे* marks who likes it.'
  hi.a1.unit30.lesson02.teach.sangeet_sunna_chitr:
    title: Music, drawing, gaming
    gloss: to listen to music, to draw, to game
    note: 'Three more hobbies: *संगीत सुनना*, *चित्र बनाना* and *गेम खेलना*; *गेम* is an English loan word.'
    example_gloss:
    - I like listening to music.
    - I often draw.
    - I like gaming with friends.
  hi.a1.unit30.lesson02.teach.mujhe_sangeet_sunna:
    title: Saying you like listening to music
    gloss: I like listening to music.
    note: '*संगीत सुनना* (''to hear music'') needs no extra word: the object goes straight before the verb.'
  hi.a1.unit30.lesson02.teach.mujhe_doston_ke:
    title: Saying you like gaming with friends
    gloss: I like gaming with friends.
    note: '*दोस्तों के साथ* (''with friends'') puts *दोस्त* in the oblique plural (*दोस्तों*) because it comes before *के साथ*.'
  hi.a1.unit30.lesson03.teach.hamesha_aksar_kabheekbhee:
    title: Always, often, sometimes, never
    gloss: always, often, sometimes, never
    note: Frequency words such as *हमेशा*, *अक्सर*, *कभी-कभी* and *कभी नहीं* usually come before the verb, and *कभी नहीं* means 'never'.
    example_gloss:
    - I always exercise on Saturdays.
    - I often read a book.
    - I sometimes draw.
    - I never game.
  hi.a1.unit30.lesson03.teach.har_hafte_har:
    title: Every week, every weekend
    gloss: every week, every weekend
    note: '*हर* (''every'') never changes, and the time word after it stays simple: *हर हफ़्ते*, *हर वीकेंड*.'
    example_gloss:
    - I cook for friends every week.
    - I exercise every weekend.
  hi.a1.unit30.lesson03.teach.har_hafte_har_2:
    title: हर stays the same
    gloss: Every week, every weekend.
    note: '*हर* stays the same whatever noun follows it, so there is no form to choose: *हर हफ़्ते*, *हर वीकेंड*.'
  hi.a1.unit30.lesson03.teach.tum_khalee_samay:
    title: Asking about free time
    gloss: What do you do in your free time?
    note: This is the core question of this unit -- reuse it to ask anyone about their hobbies.
  hi.a1.unit30.lesson04.teach.priya_ham_aksar:
    title: Priya brings up hobbies
    gloss: 'Priya: We often walk together. But what else do you do in your free time, Arjun?'
    note: '*टहलते हैं* is plural because *हम* (''we'') is the subject, and *अक्सर* comes before the verb.'
  hi.a1.unit30.lesson04.teach.arjun_mujhe_khana:
    title: Arjun's hobbies
    gloss: 'Arjun: I like cooking, at home too. And I exercise often.'
    note: '*घर पर भी* (''at home too'') shows that Arjun cooks for fun, not only at work.'
  hi.a1.unit30.lesson04.teach.priya_tum_ghar:
    title: Priya is surprised
    gloss: 'Priya: You cook at home too? You already cook all day at your job!'
    note: '*पूरा दिन* (''the whole day'') stresses how much he already cooks at work, and *तो* adds emphasis.'
  hi.a1.unit30.lesson04.teach.arjun_han_lekin:
    title: Arjun explains
    gloss: 'Arjun: Yes, but I find cooking relaxing. And you, what do you like doing?'
    note: '*खाना बनाने से सुकून मिलता है* means ''cooking relaxes me'' (literally ''from cooking, calm is received''); *बनाना* becomes *बनाने* before *से*.'
  hi.a1.unit30.lesson04.teach.priya_mujhe_parhna:
    title: Priya's hobbies
    gloss: 'Priya: I like reading and I often listen to music.'
    note: '*और* (''and'') joins two hobbies, and *सुनती हूँ* is feminine because Priya is speaking.'
  hi.a1.unit30.lesson04.teach.arjun_kya_tum:
    title: Arjun asks about gaming
    gloss: 'Arjun: Do you also game?'
    note: 'A short yes/no question: *क्या* opens it, and *खेलती हो* is feminine because Arjun is asking Priya.'
  hi.a1.unit30.lesson04.teach.priya_naheen_main:
    title: Priya answers
    gloss: 'Priya: No, I never game. But I sometimes draw!'
    note: '*कभी ... नहीं* (''never'') and *कभी-कभी* (''sometimes'') are contrasted in one answer.'
  hi.a1.unit30.lesson05.teach.arjun_aur_main:
    title: Comparing hobbies
    gloss: Arjun and I often walk together. But we also have other hobbies. Arjun likes cooking, at home too, and he exercises often. I like reading and I often listen to music. I sometimes draw, but I never game. What do you like doing in your free time?
    note: Priya's message recaps facts from lesson04 and ends by asking the reader the unit's core question.
    glosses:
      टहलते: walk
      अक्सर: often
      साथ: together
      और: other
      बनाना: making (cooking)
      पसंद: likes to
      घर: at home
      कसरत: exercises
      पढ़ना: read
      सुनती: listen
      संगीत: music
      चित्र: picture (drawing)
      कभी-कभी: sometimes
      गेम: play video games
      कभी: never (with नहीं)
      खाली: free
      समय: time
  hi.a1.unit30.lesson06.teach.arjun_tum_is:
    title: Arjun asks about the weekend
    gloss: 'Arjun: What are you doing this weekend?'
    note: '*इस वीकेंड* (''this weekend'') puts *इस* before the noun, and *कर रही हो* is the ongoing ''are you doing'', feminine because Priya is addressed.'
  hi.a1.unit30.lesson06.teach.priya_abhee_pata:
    title: Priya is undecided
    gloss: 'Priya: I don''t know yet. I like reading, but I also want to go outside.'
    note: '*बाहर जाना चाहती हूँ* means ''I want to go outside''; *चाहती* is feminine and comes after *जाना*.'
  hi.a1.unit30.lesson06.teach.arjun_chalo_sath:
    title: Arjun suggests a plan
    gloss: 'Arjun: Shall we walk together? I''ll cook for us afterward.'
    note: '*उसके बाद* (''after that'') puts the two plans in order, and *चलो ... टहलें* suggests the first one.'
  hi.a1.unit30.lesson06.teach.priya_achchha_aidiya:
    title: Priya agrees
    gloss: 'Priya: Good idea! I like both walking and cooking.'
    note: '*दोनों पसंद हैं* shows that Priya likes both equally, and the verb is plural *हैं*.'
  hi.a1.unit30.lesson06.teach.arjun_barhiya_to:
    title: Arjun confirms
    gloss: 'Arjun: Perfect. Then I''ll see you Saturday!'
    note: '*शनिवार को मिलते हैं* (''we meet on Saturday'') uses the present tense for a fixed plan, and *को* marks the day.'
