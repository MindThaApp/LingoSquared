  notes: 'English overlay written from the realization. Drafted by Claude Sonnet. Grammar: advice with चाहिए (infinitive agrees with the object: आराम करना, दवा लेनी, पैसे बचाने), negative advice with नहीं ... चाहिए, softer advice with बेहतर होगा कि + तुम -ओ form or आप -एँ form, asking for and answering advice (मुझे क्या करना चाहिए?). Priya and Arjun use tum. OPEN NATIVE QUESTIONS: (1) colloquial speech often uses the unchanged form (पैसे बचाना चाहिए, दवा लेना चाहिए); the unit teaches the agreeing form and accepts the unchanged form only in translation answers; is that the right policy; (2) is ''बेहतर होगा कि आप डॉक्टर के पास जाएँ'' the right formal pattern; (3) is ''तुम्हारे सिर में दर्द है'' natural when stated by a friend as advice context.'
answer_policy:
  punctuation: Hindi text is shown with the danda as the sentence-final mark. In typed answers, accept the danda, a plain period, or the mark omitted entirely as equivalent. Question marks may likewise be omitted.
  gender_agreement: Where the speaker or addressee is a named man or woman, the verb must agree with that person. Where the speaker is just 'I' (gender unspecified), both the masculine and the feminine form are accepted. Wrong agreement with a named person is a real grammar error, not a typo.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation.
course:
  title: Hindi A2
  description: Intermediate Hindi continuing the Priya and Arjun storyline, now with grammar-led units on predictions, rules, ability, requests, advice and habits.
units:
  hi.a2.unit86.aapko_aaram_karna_chahiye:
    title: You Should Rest
    description: Give and respond to simple advice about a problem such as health, study or money.
lessons:
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson01.chahiye_masc:
    title: You Should
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson02.chahiye_fem:
    title: Matching the Object
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson03.behtar_hoga:
    title: It Would Be Better If ...
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson04.salah_mangna:
    title: Asking and Answering Advice
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson05.arjun_ki_salah:
    title: Arjun's Advice
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson06.dost_se_salah:
    title: Advice from a Friend
teaching:
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson01.teach.salah_shabd:
    title: Words for advice
    gloss: to rest / to sleep / early / more / to drink water
    note: '*जल्दी* means ''early'' or ''quickly''. *ज़्यादा* = more, a lot.'
    example_gloss:
    - You should rest.
    - You should sleep early.
    - You should drink more water.
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson01.teach.gn_chahiye_salah:
    title: Advice with चाहिए
    gloss: You should rest. You should sleep early. Priya should drink water.
    note: Person + *को* (*तुम्हें*, *आपको*, *प्रिया को*) + infinitive + *चाहिए*. *तुम्हें* is for a friend, *आपको* for someone you address as *आप*.
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson01.teach.gn_kam_zyada:
    title: More and less
    gloss: You should drink more water. You should eat less.
    note: '*ज़्यादा* (more) and *कम* (less) go before the thing they describe.'
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson02.teach.chai_dawa:
    title: Feminine things
    gloss: tea / medicine / walk / every day
    note: '*चाय*, *दवा* and *सैर* are feminine. The verb in the advice must agree with them.'
    example_gloss:
    - You should take the medicine.
    - You should go for a walk every day.
    - You should drink less tea.
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson02.teach.gn_lani_chahiye:
    title: The infinitive agrees
    gloss: You should take the medicine. You should go for a walk. You should drink water.
    note: If the thing is feminine, the infinitive ends in *-नी* (*लेनी*, *करनी*, *पीनी*). If it is masculine, it ends in *-ना* (*पीना*).
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson02.teach.gn_nahin_chahiye:
    title: Advice not to
    gloss: You should not drink too much tea. You should not drink too much water.
    note: 'Put *नहीं* before the infinitive: *नहीं पीनी चाहिए* means ''should not drink''.'
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson03.teach.behtar_shabd:
    title: Words for gentle advice
    gloss: better / that / doctor / to, near
    note: '*डॉक्टर के पास जाना* = to go to the doctor.'
    example_gloss:
    - It would be better if you rested.
    - It would be better if you went to the doctor.
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson03.teach.gn_behtar_tum:
    title: Gentle advice for a friend
    gloss: It would be better if you rested. It would be better if you slept early.
    note: 'After *बेहतर होगा कि* use the *तुम* form without -ना: *करो*, *सोओ*, *जाओ*.'
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson03.teach.gn_behtar_aap:
    title: Gentle advice for a stranger
    gloss: It would be better if you rested. It would be better if you went to the doctor.
    note: 'For *आप* the verb ends in *-एँ* or *-ें*: *करें*, *जाएँ*.'
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson03.teach.gn_chahiye_behtar:
    title: Two strengths
    gloss: You should rest. It would be better if you rested.
    note: '*चाहिए* is direct. *बेहतर होगा कि* is gentler and sounds more like a suggestion.'
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson04.teach.salah_paise:
    title: Words for advice
    gloss: advice / money / to save / to study / like this, so
    note: '*पैसे* is masculine plural, so the infinitive ends in *-ने*: *बचाने*.'
    example_gloss:
    - You should save money.
    - You should study every day.
    - I will do just that.
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson04.teach.gn_kya_karna:
    title: What should I do?
    gloss: What should I do? You should save money.
    note: To ask for advice, say *मुझे क्या करना चाहिए?* The advice then uses *तुम्हें ... चाहिए*.
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson04.teach.gn_uttar_salah:
    title: Answering advice
    gloss: That is good advice, thank you. All right, I will do just that.
    note: 'To accept advice: *अच्छी सलाह है* and then say what you will do with the future.'
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson05.teach.padhne_shabd:
    title: Words for the message
    gloss: head / your / so / and
    note: '*तुम्हारे सिर में दर्द है* = you have a headache.'
    example_gloss:
    - I have a headache.
    - You have a headache, so rest.
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson05.teach.padho_salah:
    title: Arjun writes to Priya
    gloss: Priya, you have a headache, so you should rest. You should drink more water and less tea. It would be better if you went to the doctor. Arjun
    note: Find the three pieces of advice and see how the verb agrees with *पानी* and *चाय*.
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson06.teach.d1:
    title: Priya asks for advice
    gloss: 'Priya: Arjun, I have a headache. What should I do?'
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson06.teach.d2:
    title: Arjun advises
    gloss: 'Arjun: You should rest and drink more water.'
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson06.teach.d3:
    title: Priya agrees
    gloss: 'Priya: All right. I will drink less tea.'
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson06.teach.d4:
    title: Arjun adds
    gloss: 'Arjun: Very good. It would be better if you slept early today.'
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson06.teach.d5:
    title: Priya plans
    gloss: 'Priya: Yes, I will sleep early today. Tomorrow I will go to the doctor.'
  hi.a2.unit86.aapko_aaram_karna_chahiye.lesson06.teach.d6:
    title: Arjun closes
    gloss: 'Arjun: That is good advice. Rest.'
