teaching:
  hi.a2.unit83.kya_main_baith_sakta.lesson01.teach.anumati_shabd:
    title: Words for asking permission
    gloss: to sit / to drink / to open / here / window / water
    note: 'Before *सकना* the bare verb stem is used: *बैठ*, *पी*, *खोल*.'
    example_gloss:
    - May I sit here? (man)
    - May I drink some water? (woman)
    - May I open the window? (man)
  hi.a2.unit83.kya_main_baith_sakta.lesson01.teach.gn_sakta_sakti:
    title: 'सकना: can, may'
    gloss: I can sit (man). I can sit (woman). You can sit (formal). She can sit.
    note: '*सकना* follows the verb stem and changes like an ordinary verb: *सकता हूँ* (man), *सकती हूँ* (woman), *सकते हैं* (formal ''you''), *सकती है* (she).'
  hi.a2.unit83.kya_main_baith_sakta.lesson01.teach.gn_prashn_uttar:
    title: Ask and answer
    gloss: May I sit? Yes, you may sit. No, you may not sit.
    note: Start with *क्या* to ask permission. The answer says *आप ... सकते हैं*, and *नहीं* goes before the stem or before *सकते*.
  hi.a2.unit83.kya_main_baith_sakta.lesson02.teach.niyam_shabd:
    title: Words for rules
    gloss: card / to show / to switch off / to talk / to use / necessary / forbidden
    note: A rule is often an infinitive followed by *ज़रूरी है* (necessary) or *मना है* (forbidden).
    example_gloss:
    - Showing the card is necessary.
    - Talking is not allowed here.
    - Switching off the phone is necessary.
  hi.a2.unit83.kya_main_baith_sakta.lesson02.teach.gn_zaroori_mana:
    title: A rule with an infinitive
    gloss: Showing the card is necessary. Talking is forbidden.
    note: The infinitive (*दिखाना*, *करना*) acts like a noun, and *है* follows the rule word. It does not change for gender or number.
  hi.a2.unit83.kya_main_baith_sakta.lesson02.teach.gn_zaroori_nahin:
    title: Not necessary and forbidden
    gloss: Showing the card is not necessary. Bringing a bag is not necessary. Talking is forbidden.
    note: '*ज़रूरी नहीं है* means you do not have to; it is allowed but not required. *मना है* means you must not.'
  hi.a2.unit83.kya_main_baith_sakta.lesson02.teach.gn_nahin_sakte:
    title: Another way to say it
    gloss: You cannot talk here. You cannot eat here.
    note: '*नहीं सकते* gives the same rule in a personal form: *बात करना मना है* and *आप बात नहीं कर सकते* mean about the same.'
  hi.a2.unit83.kya_main_baith_sakta.lesson03.teach.javab_shabd:
    title: Words for answers
    gloss: to read / to eat / inside / yes (polite) / no (polite)
    note: '*जी हाँ* and *जी नहीं* are polite ways to say yes and no to someone you address as *आप*.'
    example_gloss:
    - You can read here.
    - You cannot eat here.
    - Yes, you may come in.
  hi.a2.unit83.kya_main_baith_sakta.lesson03.teach.gn_haan_nahin:
    title: Yes or no to a request
    gloss: Yes, you may sit. No, you may not use the phone.
    note: Start the answer with *जी हाँ* or *जी नहीं*, then repeat the idea with *आप ... सकते हैं*.
  hi.a2.unit83.kya_main_baith_sakta.lesson03.teach.gn_mana_ya_nahin:
    title: Two ways, one rule
    gloss: Eating here is forbidden. You cannot eat here.
    note: Use the infinitive pattern for a notice on the wall; use *आप ... नहीं सकते* when you talk to someone.
  hi.a2.unit83.kya_main_baith_sakta.lesson04.teach.zimmedari_shabd:
    title: Words for duties
    gloss: to me / to you (formal) / bag / to bring / should
    note: '*मुझे* and *आपको* introduce the person who has to do something.'
    example_gloss:
    - I have to bring a bag.
    - You have to bring the card.
    - You should switch off your phone.
  hi.a2.unit83.kya_main_baith_sakta.lesson04.teach.gn_mujhe_hai:
    title: Have to
    gloss: I have to show the card. You have to switch off your phone.
    note: Person + *को* (*मुझे*, *आपको*) + infinitive + *है* = a duty that belongs to that person.
  hi.a2.unit83.kya_main_baith_sakta.lesson04.teach.gn_chahiye:
    title: Should
    gloss: You should switch off your phone. You should show the card.
    note: '*चाहिए* gives a softer rule than *है*: it means ''ought to''. It does not change for person or number.'
  hi.a2.unit83.kya_main_baith_sakta.lesson05.teach.padhne_shabd:
    title: Words for the notice
    gloss: rules / library / of
    note: '*के नियम* = the rules of. *लाइब्रेरी के नियम* = the library rules.'
    example_gloss:
    - These are the library rules.
    - The library rules are here.
  hi.a2.unit83.kya_main_baith_sakta.lesson05.teach.padho_niyam:
    title: The notice
    gloss: Library rules. Talking is not allowed here. Switching off the phone is necessary. You may drink water here, but you cannot eat. Bringing a bag is not necessary.
    note: 'Sort the rules into three groups: forbidden, necessary and allowed.'
  hi.a2.unit83.kya_main_baith_sakta.lesson06.teach.d1:
    title: Arjun asks
    gloss: 'Arjun: Hello, may I sit here?'
  hi.a2.unit83.kya_main_baith_sakta.lesson06.teach.d2:
    title: The librarian answers
    gloss: 'Librarian: Yes, you may sit. But switching off the phone is necessary.'
  hi.a2.unit83.kya_main_baith_sakta.lesson06.teach.d3:
    title: Arjun asks about water
    gloss: 'Arjun: All right. May I drink water?'
  hi.a2.unit83.kya_main_baith_sakta.lesson06.teach.d4:
    title: The librarian explains
    gloss: 'Librarian: Yes, you may drink water, but eating is not allowed.'
  hi.a2.unit83.kya_main_baith_sakta.lesson06.teach.d5:
    title: Arjun asks about the card
    gloss: 'Arjun: Do I have to show the card?'
  hi.a2.unit83.kya_main_baith_sakta.lesson06.teach.d6:
    title: The librarian answers
    gloss: 'Librarian: No, showing the card is not necessary.'
