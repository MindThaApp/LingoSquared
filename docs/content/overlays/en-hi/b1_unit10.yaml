review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    Tenth en-hi B1 overlay, written for hi/b1_unit10_yojanaen.yaml --
    see that file's own generation_provenance/review notes for the full
    account of the three certainty-degree constructions ("...ka irada
    hai" firm plan, "...ke baare mein soch raha/rahi hoon" tentative
    intention, "shayad...hoga/hogi/-oonga/-oongi" uncertain prediction)
    and the per-construction gender-agreement analysis. No sibling-
    direction overlay (hi-en) exists yet, so §8 doesn't apply.

    Asterisk convention (§15): every inline romanized-Hindi word inside a
    `note`/`gloss` field below is wrapped in single asterisks.

    Not yet fresh-context reviewed -- status left honestly as unreviewed.

answer_policy:
  ka_irada_hai: >-
    "...*ka irada hai*" states a firm, already-decided plan. *Mera*
    agrees with *irada* (a masculine noun), NOT with the speaker's own
    gender -- it is the same "*mera*" whether Arjun or Priya is
    speaking. No feminine variant exists or is ever needed for this
    construction.
  soch_raha_rahi_hoon: >-
    "...*soch raha/rahi hoon*" ("I'm thinking about...") states a
    weaker, still-tentative intention -- less committed than "*ka irada
    hai*". This progressive DOES agree with the SPEAKER's own gender:
    *raha* (masculine speaker) or *rahi* (feminine speaker). Both are
    valid, and any exercise asking the learner to express this about
    themselves (rather than repeating a fixed model sentence) accepts
    both variants.
  shayad_future: >-
    "*Shayad*" + a future-tense verb states an uncertain prediction,
    the weakest of the three certainty degrees taught in this unit.
    "*Shayad kal baarish hogi*" -- *hogi* agrees with *baarish* ("rain",
    a feminine noun), independent of the speaker's own gender. "*Shayad
    main...soonga/soongi*" (future of *sona*, "to sleep", 1st person)
    DOES agree with the speaker, the same way *karoonga/karoongi* does --
    masculine *soonga*, feminine *soongi*.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. For the
    three-sentence culminating writing exercise, also accept internal
    sentence-boundary periods being replaced by commas, or omitted with
    a space, as equivalent.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

