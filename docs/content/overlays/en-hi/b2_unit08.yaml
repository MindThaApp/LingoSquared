teaching:
  hi.b2.unit08.lesson01.srot.teach.models:
    title: Attributing claims to sources
    gloss: According to the first report, the bus service is fast. The second report claims that the fare increased.
    note: "*के अनुसार* attributes the first claim to its report, while *दावा है कि* introduces the second report's assertion without presenting it as the writer's own view. *स्रोत* = 'source' -- each report is a source."
  hi.b2.unit08.lesson02.sahamati.teach.models:
    title: Marking agreement between sources
    gloss: Both sources agree that the service is fast. Both reach the same conclusion.
    note: "*दोनों स्रोत इस बात पर सहमत हैं* identifies a shared position, and *एक समान निष्कर्ष* signals that the sources converge on the same conclusion."
  hi.b2.unit08.lesson03.matbhed.teach.models:
    title: Marking conflict between sources
    gloss: The first report calls the fare low, whereas the second calls it high. The sources disagree on price.
    note: "*जबकि* places the two price claims in direct contrast; *कीमत पर असहमत हैं* then names the precise point of disagreement. *मतभेद* = 'difference of opinion'."
  hi.b2.unit08.lesson04.saakshya.teach.models:
    title: Evaluating the strength of evidence
    gloss: The second report is more solid because data have been given in it. The first report's claim is less substantiated.
    note: "*अधिक ठोस है क्योंकि उसमें आँकड़े दिए गए हैं* supports an evaluation with evidence, while *कम प्रमाणित* marks the first report's claim as less substantiated. Words for weighing sources: *साक्ष्य* = 'evidence', *कारण* = 'reason', *विश्वसनीय* = 'credible'."
  hi.b2.unit08.lesson05.do_report.teach.models:
    title: Reading two reports together
    gloss: The first report says the new bus service is fast and inexpensive. The second agrees it is fast but gives data showing a fare increase.
    note: "*पहली रिपोर्ट कहती है कि* and *दूसरी रिपोर्ट मानती है कि* keep the claims tied to their sources; *लेकिन* pivots from shared speed to the second report's contrasting fare evidence."
  hi.b2.unit08.lesson06.mulyankan.teach.models:
    title: Completing a reasoned synthesis
    gloss: Both sources agree on the speed of the service but disagree on the price. According to the second report, the fare has increased. The second report is more credible because it gives fare data.
    note: "*गति पर सहमत हैं लेकिन कीमत पर असहमत हैं* summarizes agreement and conflict together; *अधिक विश्वसनीय है क्योंकि* adds a reasoned judgment based on the fare data."
  hi.b2.unit08.lesson06.mulyankan.teach.dialogue_priya_first:
    title: "Priya: The first report says that the bus service is fast and cheap."
    gloss: "Priya: The first report says that the bus service is fast and cheap."
  hi.b2.unit08.lesson06.mulyankan.teach.dialogue_arjun_second:
    title: "Arjun: The second report also agrees on speed, but according to it the fare has gone up."
    gloss: "Arjun: The second report also agrees on speed, but according to it the fare has gone up."
    note: "*उसके अनुसार* = 'according to it' -- here *उसके* points back to the second report."
  hi.b2.unit08.lesson06.mulyankan.teach.dialogue_priya_ask:
    title: "Priya: Which report is more credible?"
    gloss: "Priya: Which report is more credible?"
    note: "*कौन सी* = 'which' (before a feminine noun such as *रिपोर्ट*)."
  hi.b2.unit08.lesson06.mulyankan.teach.dialogue_arjun_answer:
    title: "Arjun: The second, because it gives fare data."
    gloss: "Arjun: The second, because it gives fare data."
