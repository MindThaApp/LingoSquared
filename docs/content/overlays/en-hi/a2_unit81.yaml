  notes: 'English overlay written from the realization. Drafted by Claude Sonnet. Understanding is the main aim, with simple production. Grammar: past perfect (गया था / गई थी / गए थे; with ने: खरीदा था), contrast with present perfect, से पहले / के बाद with a time or a verbal noun (पहुँचने से पहले), जब ... तब तक ..., negative and question forms, one recognition card for जा चुकी थी, क्योंकि. The station clerk uses aap with Arjun. OPEN NATIVE QUESTIONS: (1) is ''वह तो आपके पहुँचने से पहले चली गई थी'' natural, with तो? (2) जयपुर वाली ट्रेन vs जयपुर की ट्रेन; (3) is the clerk''s टिकट खिड़की पर जाइए the right register or should it be पर जाएँ?'
answer_policy:
  punctuation: Hindi text is shown with the danda as the sentence-final mark. In typed answers, accept the danda, a plain period, or the mark omitted entirely as equivalent. Question marks may likewise be omitted.
  gender_agreement: Where the speaker or addressee is a named man or woman, the verb must agree with that person. Where the speaker is just 'I' (gender unspecified), both the masculine and the feminine form are accepted. Wrong agreement with a named person is a real grammar error, not a typo.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation.
course:
  title: Hindi A2
  description: Intermediate Hindi continuing the Priya and Arjun storyline, now with a grammar-led block on talking about the past.
units:
  hi.a2.unit81.train_chali_gayi_thi:
    title: The Train Had Already Left
    description: Explain that something had already happened before a certain point, for example that a train had left before you arrived.
lessons:
  hi.a2.unit81.train_chali_gayi_thi.lesson01.chali_gayi_thi:
    title: It Had Left
  hi.a2.unit81.train_chali_gayi_thi.lesson02.se_pehle_ke_baad:
    title: Before and After
  hi.a2.unit81.train_chali_gayi_thi.lesson03.jab_tab_tak:
    title: By the Time I Arrived
  hi.a2.unit81.train_chali_gayi_thi.lesson04.kyonki_ya_nahin:
    title: Because, or Not Yet
  hi.a2.unit81.train_chali_gayi_thi.lesson05.arjun_ka_sandesh:
    title: Arjun's Message
  hi.a2.unit81.train_chali_gayi_thi.lesson06.station_par:
    title: At the Station
teaching:
  hi.a2.unit81.train_chali_gayi_thi.lesson01.teach.station_shabd:
    title: At the station
    gloss: station / train / platform
    note: '*था / थी* after the past participle puts the event earlier than another past moment. *चली गई* = has left, is gone.'
    example_gloss:
    - The train had left.
    - Priya had reached the station.
    - Arjun had reached the platform.
  hi.a2.unit81.train_chali_gayi_thi.lesson01.teach.tikat_saman:
    title: Ticket and luggage
    gloss: ticket / luggage / to buy / to put
    note: '*सामान* (luggage) is masculine singular.'
    example_gloss:
    - Arjun had bought the ticket.
    - Priya had put the luggage down.
    - They had eaten.
  hi.a2.unit81.train_chali_gayi_thi.lesson01.teach.gn_gaya_tha:
    title: The past perfect
    gloss: had gone (man) / (woman) / (several men or mixed) / (several women)
    note: 'Past participle + *था / थी / थे / थीं*. For a verb of going or arriving, there is no *ने*: the participle and *था* follow the doer, as in *प्रिया पहुँची थी* and *अर्जुन पहुँचा था*.'
  hi.a2.unit81.train_chali_gayi_thi.lesson01.teach.gn_ne_tha:
    title: With ने
    gloss: Arjun had bought the ticket. Priya had bought a sari. They had bought tickets. Priya had caught the bus.
    note: 'With *ने* the participle and *था* follow the OBJECT: *टिकट* is masculine singular (*खरीदा था*), *साड़ी* and *बस* are feminine (*खरीदी थी*, *पकड़ी थी*), and plural *टिकट* takes *खरीदे थे*.'
  hi.a2.unit81.train_chali_gayi_thi.lesson01.teach.gn_hai_ya_tha:
    title: Has gone or had gone
    gloss: The train has gone. The train had gone.
    note: '*है* connects the event to now. *थी* connects it to an earlier moment in the past, which the story has already named.'
  hi.a2.unit81.train_chali_gayi_thi.lesson02.teach.pehle_baad:
    title: Before, after, already
    gloss: before / after / already
    note: '*से पहले* and *के बाद* come after the word they refer to. *पहले ही* = ''already''.'
    example_gloss:
    - The train had left before eight o'clock.
    - After eating, Arjun went to the station.
    - The train had already left.
  hi.a2.unit81.train_chali_gayi_thi.lesson02.teach.kriya_ne:
    title: The verb as a noun
    gloss: reaching / coming / going / eating
    note: 'Add *-ने* to the verb stem to make it a noun: *पहुँच + ने = पहुँचने*. It is followed by *से पहले* or *के बाद*.'
    example_gloss:
    - The train had left before I arrived.
    - Priya reached the station before the train came.
    - After eating, they went to the station.
  hi.a2.unit81.train_chali_gayi_thi.lesson02.teach.gn_samay_se_pehle:
    title: With a time
    gloss: The train had left before eight. Arjun arrived after nine.
    note: After a time or a noun use *से पहले* or *के बाद*. For the event that came first use *था* (past perfect); for the later event the simple past is enough.
  hi.a2.unit81.train_chali_gayi_thi.lesson02.teach.gn_pahunchne:
    title: With a verb
    gloss: The train had left before I arrived. The train had left before you arrived.
    note: 'The doer comes before the verb noun and takes *के*: *मेरे*, *तुम्हारे*, *आपके*, *प्रिया के*. So: *मेरे पहुँचने से पहले* = before my arriving.'
  hi.a2.unit81.train_chali_gayi_thi.lesson02.teach.gn_khane_baad:
    title: Same doer or not
    gloss: After eating, Arjun went to the station. Before the train came, Priya reached the station.
    note: 'If the same person does both things, no doer is needed in the first part: *खाना खाने के बाद अर्जुन गया*. If the doers differ, name the first doer: *ट्रेन के आने से पहले*.'
  hi.a2.unit81.train_chali_gayi_thi.lesson03.teach.tab_tak:
    title: By then
    gloss: by then / still, yet / late / on time
    note: '*तब तक* = ''by then, by that time''. It often follows *जब ... पहुँचा*.'
    example_gloss:
    - By the time I arrived, the train had left.
    - I had left on time.
    - Priya had left on time.
    - He arrived late.
  hi.a2.unit81.train_chali_gayi_thi.lesson03.teach.gn_jab_tab_tak:
    title: जब ... तब तक ...
    gloss: By the time Arjun reached the station, the train had left.
    note: The *जब* clause names the later moment in the simple past. After *तब तक* use the past perfect for what had happened earlier.
  hi.a2.unit81.train_chali_gayi_thi.lesson03.teach.gn_anya_kram:
    title: Two events in order
    gloss: Priya had reached the station. Then Arjun arrived.
    note: The earlier event takes *था / थी*; the next event in the story takes the simple past.
  hi.a2.unit81.train_chali_gayi_thi.lesson03.teach.gn_chuka:
    title: A second way (to recognise)
    gloss: The train had left. The train had already gone.
    note: You will hear *जा चुकी थी* for 'had already gone'. It stresses that the event was completely finished. Understanding it is enough for now; *चली गई थी* is the form to say.
  hi.a2.unit81.train_chali_gayi_thi.lesson04.teach.karan_shabd:
    title: Reasons
    gloss: because / bag / was left at home
    note: '*रह जाना* = to be left behind. *क्योंकि* introduces the reason and the reason clause often uses *था*.'
    example_gloss:
    - I arrived late because my bag had been left at home.
    - Priya went back because she had forgotten her ticket.
  hi.a2.unit81.train_chali_gayi_thi.lesson04.teach.gn_nahin_tha:
    title: Had not yet
    gloss: The train had not come yet. I had not eaten yet.
    note: Put *नहीं* before the participle and keep *था / थी*. *अभी* adds 'yet'.
  hi.a2.unit81.train_chali_gayi_thi.lesson04.teach.gn_prashn_tha:
    title: Questions
    gloss: Had you bought the ticket? Had the train left?
    note: Start with *क्या*. The verb keeps the same form as in a statement.
  hi.a2.unit81.train_chali_gayi_thi.lesson04.teach.gn_kyonki_tha:
    title: Giving the reason
    gloss: I arrived late because my bag had been left at home. I left on time, but I arrived late.
    note: 'The reason comes after *क्योंकि*. It is earlier than the arrival, so it takes the past perfect: *रह गया था*.'
  hi.a2.unit81.train_chali_gayi_thi.lesson05.teach.padhne_shabd:
    title: Words for the message
    gloss: the one for (Jaipur) / next / to tell
    note: '*जयपुर वाली ट्रेन* means ''the Jaipur train''. *वाली* agrees with the noun: *ट्रेन* is feminine.'
    example_gloss:
    - The Jaipur train had left.
    - The next train is at ten.
    - When is the next train? At what time is the train?
    - This is the Jaipur ticket.
  hi.a2.unit81.train_chali_gayi_thi.lesson05.teach.padho_sandesh:
    title: Arjun writes to Priya
    gloss: Priya, I reached the station late. The Jaipur train had left before I arrived. I had left home on time, but there was a big jam on the road. I had already bought the ticket. The next train is at ten. Arjun
    note: 'Look for what Arjun says had happened *before* he arrived: the train had left, he had set out on time and he had bought the ticket.'
  hi.a2.unit81.train_chali_gayi_thi.lesson06.teach.d1:
    title: Arjun asks
    gloss: 'Arjun: Hello! Where is the Jaipur train?'
  hi.a2.unit81.train_chali_gayi_thi.lesson06.teach.d2:
    title: The clerk answers
    gloss: 'Clerk: The Jaipur train? It had left before you arrived.'
  hi.a2.unit81.train_chali_gayi_thi.lesson06.teach.d3:
    title: Arjun is surprised
    gloss: 'Arjun: What? It leaves at eight, doesn''t it? I arrived five minutes late.'
  hi.a2.unit81.train_chali_gayi_thi.lesson06.teach.d4:
    title: The clerk explains
    gloss: 'Clerk: Yes, the train had left at eight. The next train is at ten.'
  hi.a2.unit81.train_chali_gayi_thi.lesson06.teach.d5:
    title: Arjun asks about the ticket
    gloss: 'Arjun: All right. Can I change my ticket?'
  hi.a2.unit81.train_chali_gayi_thi.lesson06.teach.d6:
    title: The clerk helps
    gloss: 'Clerk: Yes, you can. Please go to the ticket window.'
