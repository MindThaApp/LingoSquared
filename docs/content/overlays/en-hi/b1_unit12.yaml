answer_policy:
  ke_liye: >-
    "...*ke liye*" ("in order to/for") + an oblique infinitive states
    the purpose behind an action. The main clause's habitual verb DOES
    agree with the speaker's own gender: masculine *karta*, feminine
    *karti*. Both are valid, and any exercise asking the learner to
    express this about themselves accepts both variants.
  taaki: >-
    "*Taaki*" ("so that") introduces a subjunctive clause of purpose.
    The subjunctive verb itself (*sakoon*, 1st singular; *saken*, 1st
    plural) is invariant for gender in Hindi -- it never changes between
    a male and a female speaker. Only the main clause's own habitual
    verb (e.g. *sota/soti hoon*, "I sleep") agrees with the speaker's
    gender; the *taaki* clause that follows it does not.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. For the
    two-sentence culminating writing exercise, also accept the internal
    sentence-boundary period being replaced by a comma, or omitted with
    a space, as equivalent.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

