teaching:
  hi.a2.unit72.lesson01.teach.taimtebal:
    title: The schedule
    gloss: the schedule/timetable
    note: '*टाइमटेबल* is the English loan for a class or work timetable. It is masculine: *मेरा टाइमटेबल*.'
    example_gloss: I check my schedule every week.
  hi.a2.unit72.lesson01.teach.somvar_ko_main:
    title: Naming two different days' activities
    gloss: On Monday I work, and on Wednesday I have a course.
    note: 'A weekday takes *को* for ''on'': *सोमवार को*, *बुधवार को*. The weekday itself does not change before *को*.'
  hi.a2.unit72.lesson01.teach.tum_am_taur:
    title: Asking what someone usually does during the week
    gloss: What do you usually do during the week?
    note: '*सोमवार से शुक्रवार* (from Monday to Friday) names the working week as a block, in contrast with *वीकेंड*. *आम तौर पर* means ''usually''.'
  hi.a2.unit72.lesson02.teach.kram:
    title: The order/sequence
    gloss: the order/sequence
    note: '*क्रम* (order, sequence) is a masculine noun, used for the order events happen in: *दिन का क्रम*.'
    example_gloss: The order of my day is always the same.
  hi.a2.unit72.lesson02.teach.pahle_main_kam:
    title: Sequencing with पहले and फिर
    gloss: First I work, then I go exercise.
    note: '*पहले* (first) and *फिर* (after that, then) are the two most common sequencing words in Hindi.'
  hi.a2.unit72.lesson02.teach.akhir_men_main:
    title: Sequencing with आखिर में
    gloss: Finally I cook something for dinner.
    note: '*आखिर में* (finally) closes a sequence started with *पहले* and continued with *फिर*.'
  hi.a2.unit72.lesson03.teach.kamkajee_din:
    title: The weekday
    gloss: the weekday
    note: '*कामकाजी दिन* (working day) is a masculine noun phrase, contrasted with *वीकेंड*.'
    example_gloss: On a weekday I get up early.
  hi.a2.unit72.lesson03.teach.somvar_se_shukravar:
    title: Contrasting weekdays and the weekend
    gloss: During the week I get up early, but on the weekend I sleep in.
    note: '*देर तक सोना* (to sleep in) and *जल्दी उठना* (to get up early) are built from plain verbs. *तक* means ''until'' or ''for a long while''.'
  hi.a2.unit72.lesson03.teach.tumhare_kamkajee_dinon:
    title: Asking about the difference
    gloss: What's the difference between your weekdays and the weekend?
    note: '*X और Y में फर्क* (the difference between X and Y) is the standard comparison frame. *में* follows the second item: *कामकाजी दिनों और वीकेंड में*.'
  hi.a2.unit72.lesson04.teach.shedyool:
    title: The schedule/planner
    gloss: the schedule/planner
    note: '*शेड्यूल* is the English loan for a personal planner or a list of commitments. It is masculine: *मेरा शेड्यूल*.'
    example_gloss: My schedule is completely full this week.
  hi.a2.unit72.lesson04.teach.is_haphte_mera:
    title: Saying your schedule is completely full
    gloss: My schedule is completely full this week.
    note: '*भरा हुआ* (literally ''filled'') is the usual way to say a schedule is fully booked. *बिल्कुल* means ''completely''.'
  hi.a2.unit72.lesson04.teach.is_haphte_meree:
    title: Saying you have no free evening
    gloss: I have no free evening this week.
    note: '*खाली शाम* (free evening) uses *खाली* (empty, free). *कोई ... नहीं* means ''not any'': *कोई शाम खाली नहीं है*.'
  hi.a2.unit72.lesson04.teach.agle_haphte_mere:
    title: Looking ahead to next week
    gloss: Next week I'll have more time.
    note: '*अगले हफ्ते* (next week) contrasts with *इस हफ्ते* (this week), used earlier in this lesson. *अगला* (next) becomes *अगले* before *हफ्ते*.'
  hi.a2.unit72.lesson05.teach.neena_ka_haphta:
    title: Reading about Nina's busy week
    gloss: Nina's week looks busy. On Monday and Tuesday she works at the library. On Wednesday evening she has a language course. On Thursday she exercises with friends, and on Friday she cooks for her family. On the weekend she rests and reads a book.
    note: '*व्यस्त दिखता है* (looks busy) uses *दिखना* (to look, to appear). The verb agrees with *हफ्ता*, which is masculine.'
    glosses:
      दिखता: looks, appears (from दिखना)
      व्यस्त: busy
      हफ्ता: week
      सोमवार: Monday
      मंगलवार: Tuesday
      काम: work (काम करना means to work)
      लाइब्रेरी: library
      बुधवार: Wednesday
      होती: has, takes place (from होना, to be)
      क्लास: class (भाषा की क्लास = language class)
      गुरुवार: Thursday
      कसरत: exercise (कसरत करना means to exercise)
      दोस्तों: friends
      शुक्रवार: Friday
      बनाती: makes, cooks (from बनाना)
      अपने: her own
      परिवार: family
      वीकेंड: weekend
      आराम: rest (आराम करना means to rest)
      पढ़ती: reads (from पढ़ना)
      किताब: book
  hi.a2.unit72.lesson06.teach.tumhara_haphta_kaisa:
    title: Priya asks about Arjun's week
    gloss: 'Priya: What does your week look like, Arjun?'
  hi.a2.unit72.lesson06.teach.kaphee_vyast_pahle:
    title: Arjun describes his work schedule
    gloss: 'Arjun: Pretty busy. First I work from Monday to Thursday, then I have Friday off.'
  hi.a2.unit72.lesson06.teach.chhuttee_ke_din:
    title: Priya asks about his day off
    gloss: 'Priya: What do you do on your day off?'
  hi.a2.unit72.lesson06.teach.shukravar_ko_main:
    title: Arjun describes Friday
    gloss: 'Arjun: On Fridays I usually exercise, and in the evening I cook something tasty.'
  hi.a2.unit72.lesson06.teach.aur_veekend_par:
    title: Priya asks about the weekend
    gloss: 'Priya: And on the weekend?'
  hi.a2.unit72.lesson06.teach.veekend_par_main:
    title: Arjun describes the weekend
    gloss: 'Arjun: On the weekend I rest. During the week I just don''t have time.'
  hi.a2.unit72.lesson06.teach.vah_pahle_kam:
    title: Third-person sequencing with पहले, फिर, आखिर में
    gloss: She works first. Then she exercises. Finally she rests.
    note: 'The same *पहले / फिर / आखिर में* connectors from lesson 2 work with a third-person subject (*वह*). Only the verb ending changes: *करती है* (she does) instead of *करता हूँ* (I do).'
