answer_policy:
  apna_reflexive: '*Apna/apni/apne* ("one''s own") is used for something belonging to the sentence''s own subject, regardless of who that subject is (I/you/he/ she/we) -- it changes for gender/number exactly like *mera/tumhara*: *apna* (masc. sg.), *apni* (fem.), *apne* (plural or respect). A typed answer using the wrong gender form (e.g. *apni pata* for the masculine noun *pata*) is marked incorrect as a real grammar error, the exact contrast this unit''s own grammar_check exercises target -- not tolerated as a minor typo.'
  ne_ergative: 'Hindi marks the subject of a past-tense TRANSITIVE verb (e.g. *bharna* "to fill", *badalna* "to change") with *ne* -- the verb then agrees with the object, not the subject, when the object has no postposition of its own. Every exercise in this unit pairs a *ne*-marked verb with a masculine-singular object (*form*, *pata*), so only the masculine-singular past-participle form (*bhara/badla*) is ever actually required as a typed answer here. A typed answer omitting *ne* before a transitive verb, or using the wrong object-agreement form, is marked incorrect as a real grammar error, not tolerated as a typo -- the exact contrast lesson02/lesson03''s grammar_check exercises target. Intransitive verbs (e.g. *jaana* "to go", already taught unit 9/12) never take *ne*, even in the past tense. *Laana* ("to bring") is the well-known exception among transitive verbs: it never takes *ne*, so the subject stays direct and the verb agrees with it (*kya aap aadhaar card laaye?* / *haan, main aadhaar card laaya/laai*).'
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation.
