teaching:
  hi.a2.unit74.lesson01.teach.veekend_pichhla_veekend:
    title: The weekend / last weekend
    gloss: the weekend / last weekend (the one that just ended)
    note: '*वीकेंड* is an English loan and masculine. *पिछला वीकेंड* means the weekend that has just passed, so it is the natural phrase for ''last weekend''; before *वीकेंड* with no postposition, *पिछला* becomes *पिछले*.'
    example_gloss:
    - The weekend starts on Saturday.
    - Last weekend I worked.
  hi.a2.unit74.lesson01.teach.shanivar_ravivar:
    title: Saturday and Sunday
    gloss: Saturday / Sunday
    note: 'Day names are plain nouns in Hindi. *को* means ''on'': *शनिवार को*.'
    example_gloss:
    - On Saturday I'm free.
    - On Sundays I sleep in.
  hi.a2.unit74.lesson01.teach.khareedaree_karna:
    title: Doing errands
    gloss: to do the shopping / run errands
    note: '*खरीदारी करना* is the fixed phrase for shopping. *खरीदारी* is feminine, so the past form agrees with it: *मैंने खरीदारी की*.'
    example_gloss: Every Saturday I do the shopping.
  hi.a2.unit74.lesson01.teach.milne_jana:
    title: Going to visit someone
    gloss: to go and visit (someone)
    note: '*मिलने जाना* means to go and visit someone; add *से*: *चाचा से मिलने जाना*. To say you went to someone''s house, use *के घर*: *चाचा के घर गया*.'
    example_gloss: I often go and visit my uncle.
  hi.a2.unit74.lesson01.teach.bajar_park_sinema:
    title: Places to go at the weekend
    gloss: the market / the park / the cinema
    note: '*बाजार*, *पार्क* and *सिनेमा* are masculine nouns. *में* (in) follows them: *बाजार में*, *पार्क में*; with *जाना* no extra word is needed: *बाजार गया*.'
    example_gloss:
    - I buy vegetables at the market.
    - I like walking in the park.
    - On Saturday I'm going to the cinema.
  hi.a2.unit74.lesson01.teach.kam_karna_pakana:
    title: Four everyday verbs
    gloss: to work / to cook / to eat / to drink
    note: These are the infinitives. Later in this unit you will build their past forms.
    example_gloss:
    - I have to work today.
    - I can cook well.
    - I'd like to eat.
    - Would you like to drink coffee?
  hi.a2.unit74.lesson01.teach.tumne_pichhle_veekend:
    title: Asking what someone did last weekend
    gloss: What did you do last weekend?
    note: This is the standard question. *किया* is the past of *करना*, and *तुमने* uses *ने* because *करना* takes an object. *क्या* (what) comes right before the verb.
  hi.a2.unit74.lesson01.teach.shanivar_ko_mainne:
    title: 'The past tense: ने and agreement'
    gloss: On Saturday I did the shopping. On Sunday I went to my uncle's.
    note: 'Hindi has no helper verb for the simple past: the verb itself changes. There are two patterns. With a verb that takes an object, the doer takes *ने* and the verb agrees with the object: *मैंने खरीदारी की* (*खरीदारी* is feminine, so *की*). With a verb of going or staying there is no *ने*, and the verb agrees with the doer: *मैं चाचा के घर गया* (a woman says *गई*). Lesson 3 explains when each pattern applies.'
  hi.a2.unit74.lesson02.teach.sair_karna_saikil:
    title: Four weekend activities
    gloss: to walk / to cycle / to play / to do sports
    note: '*खेलना* is used for games and sports with a ball: *फुटबॉल खेलना*. *कसरत करना* means exercising in general, and *सैर करना* means going for a walk.'
    example_gloss:
    - Shall we go for a walk?
    - Tomorrow I'm going to cycle.
    - The children want to play outside.
    - I want to exercise more often.
  hi.a2.unit74.lesson02.teach.kam_karna_kam:
    title: 'Past forms: -ा, -ई and the verb करना'
    gloss: work → worked, cook → cooked, walk → walked, play → played, cycle → cycled
    note: 'Regular verbs drop *-ना* and add *-ा* (masculine) or *-ई* (feminine). Stems that end in a vowel add *-या* instead: *खेलना → खेला*, *पकाना → पकाया*, *चलाना → चलाई*. After *ने* the ending agrees with the object, not with the speaker: *खाना* (masculine) takes *पकाया*, *साइकिल* (feminine) takes *चलाई*. The verb *करना* (to do) is irregular: *किया* (masculine) and *की* (feminine): *काम किया*, *कसरत की*, *सैर की*.'
  hi.a2.unit74.lesson02.teach.main_kasrat_karta:
    title: Present and past of करना
    gloss: I exercise. I exercised.
    note: In the present, *मैं कसरत करता हूँ* agrees with the speaker. In the past, *मैंने कसरत की* agrees with the object *कसरत* and does not change for a male or female speaker.
  hi.a2.unit74.lesson02.teach.mainne_park_men:
    title: Walking in the park
    gloss: I walked in the park.
    note: '*सैर करना* is a noun plus *करना*, so the past is *सैर की*, feminine to agree with *सैर*.'
  hi.a2.unit74.lesson02.teach.mainne_phutbol_khela:
    title: Playing football
    gloss: I played football.
    note: '*फुटबॉल* is masculine, so the verb ends in *-ा*: *फुटबॉल खेला*. A feminine game such as *कबड्डी* takes *-ई*: *कबड्डी खेली*.'
  hi.a2.unit74.lesson03.teach.hona_rahna:
    title: Being and staying
    gloss: to be / to stay
    note: '*होना* (to be) and *रहना* (to stay, to remain) are two of the most useful verbs. Their past forms are *हुआ* and *रहा*, and neither takes *ने*.'
    example_gloss:
    - I want to stay at home.
    - It can be fun.
  hi.a2.unit74.lesson03.teach.dekhna_dekha_parhna:
    title: 'Irregular past forms: learn them as whole words'
    gloss: see → saw, read → read, eat → ate, drink → drank, buy → bought, do → did, take → took
    note: 'Most verbs simply replace *-ना* with *-ा*: *देखा, पढ़ा, खाया, खरीदा*. A few have a special form that you learn as a whole word: *करना → किया*, *पीना → पिया*, *लेना → लिया* (and *देना → दिया*). In the feminine these become *की, पी, ली, दी*: *मैंने कॉफी पी*.'
  hi.a2.unit74.lesson03.teach.mainne_ek_philm:
    title: Watching a film
    gloss: I saw a film.
    note: '*फिल्म देखना* is used both for watching a film at the cinema and at home. *फिल्म* is feminine, so the past is *देखी*: *मैंने फिल्म देखी*.'
  hi.a2.unit74.lesson03.teach.main_der_tak:
    title: Two verbs in one sentence
    gloss: I slept for a long time and read a book.
    note: '*और* joins two actions. The first verb (*सोया*, no *ने*) agrees with the speaker; the second (*मैंने ... पढ़ी*) takes *ने* and agrees with the object: *मैं देर तक सोया और मैंने एक किताब पढ़ी*.'
  hi.a2.unit74.lesson03.teach.main_apne_chacha:
    title: 'Meeting someone: मिलना'
    gloss: I met my uncle.
    note: '*मिलना* (to meet) takes no *ने* and is followed by *से*: *मैं अपने चाचा से मिला*. With *मुलाकात करना* you use *ने*: *मैंने चाचा से मुलाकात की*. The two sentences mean nearly the same.'
  hi.a2.unit74.lesson03.teach.mainne_ek_philm_2:
    title: ने or no ने?
    gloss: I saw a film. I went to my uncle's. I stayed at home. I was at my uncle's. It got late.
    note: 'A verb with an object (*देखना, पढ़ना, खाना, करना*) takes *ने* in the past: *मैंने फिल्म देखी*, and the verb agrees with the object. A verb of going, coming, staying, sleeping or being (*जाना, आना, रहना, सोना, होना*) takes no *ने*, and the verb agrees with the doer: *मैं गया* (a woman says *मैं गई*). Quick test: can you ask ''what?'' after the verb? If so, use *ने*. *देर हो गई* (it got late) uses *होना*, so no *ने*. *था* is the past of *है*: *मैं चाचा के यहाँ था*.'
  hi.a2.unit74.lesson03.teach.jana_gaya_ana:
    title: 'Verbs without ने: going, coming, staying, sleeping, being'
    gloss: go → went, come → came, stay → stayed, sleep → slept, be → was / happened
    note: 'These five verbs never take *ने*: *मैं गया, मैं आया, मैं रहा, मैं सोया, यह हुआ*. *गया* and *हुआ* are irregular; *आया, रहा, सोया* follow the regular pattern. A woman says *गई, आई, रही, सोई*, and a masculine plural subject takes *-ए*: *वे गए*.'
  hi.a2.unit74.lesson04.teach.pahle_phir:
    title: First and then
    gloss: first / after that
    note: '*पहले* and *फिर* put actions in order. They are the connectors you need to tell a weekend story in sequence.'
    example_gloss:
    - First I work, then I go and exercise.
    - First I eat, then I drink coffee.
  hi.a2.unit74.lesson04.teach.pahle_main_bajar:
    title: 'Telling it in order: पहले, फिर'
    gloss: First I went to the market, then I cooked.
    note: 'Hindi keeps subject-object-verb order in each part, so the order words just go at the start: *पहले मैं बाजार गया, फिर मैंने खाना पकाया*. Notice that the first part has no *ने* (*गया*) and the second part has (*मैंने ... पकाया*).'
  hi.a2.unit74.lesson04.teach.mainne_kam_naheen:
    title: 'Saying what you did not do: नहीं'
    gloss: I didn't work. I didn't read the book. I didn't go to my uncle's.
    note: '*नहीं* goes directly before the verb: *मैंने काम नहीं किया*, *मैंने किताब नहीं पढ़ी*, *मैं चाचा के घर नहीं गया*. The verb agrees exactly as in a positive sentence. In the past, never drop *ने* with these verbs: *मैंने ... नहीं किया*, not *मैं ... नहीं किया*.'
  hi.a2.unit74.lesson04.teach.mainne_koee_kophee:
    title: 'Saying you had none: कोई ... नहीं'
    gloss: I didn't drink any coffee. I didn't have time.
    note: 'Use *कोई ... नहीं* (''not any'') with a noun to say you did or had none: *कोई फिल्म नहीं देखी*, *कोई कॉफी नहीं पी*. To say you did not have something in the past, use *मेरे पास ... नहीं था*: *मेरे पास समय नहीं था*.'
  hi.a2.unit74.lesson04.teach.kya_tumne_kasrat:
    title: Priya asks about exercise
    gloss: 'Priya: Did you exercise?'
    note: 'In a yes/no question you can put *क्या* at the start: *क्या तुमने कसरत की?* The verb is still *की*, feminine to agree with *कसरत*.'
  hi.a2.unit74.lesson04.teach.naheen_mainne_kasrat:
    title: Arjun says no
    gloss: 'Arjun: No, I didn''t exercise.'
  hi.a2.unit74.lesson05.teach.hay_priya_veekend:
    title: A message from Neha
    gloss: Hi Priya! It was a quiet weekend. On Saturday morning I went to the market and bought bread. In the afternoon I walked in the park. In the evening I cooked. I didn't exercise and I didn't see a film. On Sunday I stayed at home. I slept for a long time and read a book.
    note: 'Neha is telling Priya about her weekend in order: Saturday morning, afternoon and evening, then Sunday. Neha is a woman, so her verbs without *ने* end in *-ई*: *गई, रही, सोई*. Her verbs with *ने* agree with the object: *ब्रेड खरीदी, सैर की, खाना बनाया, किताब पढ़ी*. *दोपहर में* and *शाम को* mean ''in the afternoon'' and ''in the evening''.'
    glosses:
      हाय: hi
      आराम: ease, calm (आराम से = comfortably)
      वीकेंड: weekend
      बीता: went by, passed (from बीतना)
      सुबह: morning
      बाजार: market
      ब्रेड: bread
      खरीदी: bought (feminine, agrees with ब्रेड)
      दोपहर: afternoon
      पार्क: park
      सैर: walk, stroll (सैर करना means to go for a walk)
      शाम: evening
      बनाया: made, cooked (from बनाना)
      नहीं: not
      कसरत: exercise (कसरत करना means to exercise)
      कोई: no, not any
      फिल्म: film
      देखी: saw, watched (feminine, agrees with फिल्म)
      रविवार: Sunday
      रही: stayed, remained (fem.; from रहना)
      देर: late; a while (देर तक = for a long time)
      सोई: slept (feminine, from सोना)
      किताब: book
      पढ़ी: read (feminine, agrees with किताब)
  hi.a2.unit74.lesson06.teach.hay_arjun_tumne:
    title: Priya asks Arjun about his weekend
    gloss: 'Priya: Hi Arjun! What did you do last weekend?'
  hi.a2.unit74.lesson06.teach.shanivar_ko_main:
    title: Arjun describes Saturday
    gloss: 'Arjun: On Saturday I went to my uncle''s in Pune. I ate at my uncle''s.'
    note: '*के घर* means ''to the house of'': *चाचा के घर गया* (went to my uncle''s). Here the city comes first: *पुणे में अपने चाचा के घर*.'
  hi.a2.unit74.lesson06.teach.barhiya_aur_ravivar:
    title: Priya asks about Sunday
    gloss: 'Priya: Nice! And Sunday?'
  hi.a2.unit74.lesson06.teach.ravivar_ko_main:
    title: Arjun describes Sunday and asks back
    gloss: 'Arjun: On Sunday I stayed at home. I slept for a long time and I didn''t exercise. And you?'
  hi.a2.unit74.lesson06.teach.main_apne_mammee:
    title: Priya describes her weekend
    gloss: 'Priya: I went to my parents''. I didn''t do any shopping, but I cooked.'
