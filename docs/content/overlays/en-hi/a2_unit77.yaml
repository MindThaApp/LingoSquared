  required_next_reviewer: native_speaker_review
  notes: 'English overlay written from the realization. Drafted by Claude Sonnet. Grammar: the perfective with and without ने (intransitive vs transitive), irregular perfectives (किया, लिया, दिया, गया), compound perfective with जाना (छूट गई, भूल गया), tum-forms (निकले/निकलीं). Canon: Priya and Arjun are friends using tum. Hindi is the sole target-language source. OPEN NATIVE QUESTIONS: (1) is मेरी बस छूट गई the most natural way to say ''I missed my bus''? (2) is the order पहले ... फिर ... उसके बाद ... आख़िर में natural in a spoken account? (3) साढ़े छह बजे as a teaching example; (4) टैक्सी ली vs टैक्सी की/पकड़ी.'
answer_policy:
  punctuation: Hindi text is shown with the danda as the sentence-final mark. In typed answers, accept the danda, a plain period, or the mark omitted entirely as equivalent. Question marks may likewise be omitted.
  gender_agreement: Where the speaker or addressee is a named man or woman, the verb must agree with that person. Where the speaker is just 'I' (gender unspecified), both the masculine and the feminine form are accepted. Wrong agreement with a named person is a real grammar error, not a typo.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation.
course:
  title: Hindi A2
  description: Intermediate Hindi continuing the Priya and Arjun storyline, now with a grammar-led block on talking about the past.
units:
  hi.a2.unit77.vyast_subah:
    title: A Busy Morning
    description: Tell a morning or a commute step by step in the past, from getting up to arriving, and say where it went differently.
lessons:
  hi.a2.unit77.vyast_subah.lesson01.pehle_kya_kiya:
    title: What Did You Do First?
  hi.a2.unit77.vyast_subah.lesson02.samay_aur_jagah:
    title: Time and Place
  hi.a2.unit77.vyast_subah.lesson03.kuchh_gadbad:
    title: Something Went Wrong
  hi.a2.unit77.vyast_subah.lesson04.tum_kab_nikle:
    title: When Did You Leave?
  hi.a2.unit77.vyast_subah.lesson05.priya_ka_sandesh:
    title: Priya's Message
  hi.a2.unit77.vyast_subah.lesson06.arjun_aur_priya:
    title: Arjun and Priya Talk
teaching:
  hi.a2.unit77.vyast_subah.lesson01.teach.subah_ke_kaam:
    title: Morning steps
    gloss: to get up / to bathe / to get ready / to leave home
    note: 'These verbs do not take an object, so in the past the verb agrees with the person doing it: *उठी* for Priya, *नहाया* and *निकला* for Arjun.'
    example_gloss:
    - Priya got up at six.
    - Arjun bathed at half past six.
    - Priya got ready at seven.
    - Arjun left home at eight.
  hi.a2.unit77.vyast_subah.lesson01.teach.chai_nashta_bas:
    title: Things you do to something
    gloss: to drink tea / to have breakfast / to catch a bus
    note: Here the verb has an object (tea, breakfast, the bus), so the doer takes *ने*.
    example_gloss:
    - Arjun drank tea.
    - Priya had breakfast.
    - Priya caught the bus.
  hi.a2.unit77.vyast_subah.lesson01.teach.pehle_phir:
    title: Order words
    gloss: first / then / after that / finally
    note: 'These four words keep a story in order. *उसने* is *उस* + *ने*: the doer ''she'' or ''he'' in a past sentence with an object.'
    example_gloss:
    - First Priya got up.
    - Then she drank tea.
    - After that she left home.
    - Finally she caught the bus.
  hi.a2.unit77.vyast_subah.lesson01.teach.gn_bina_ne:
    title: 'No ने: the verb follows the doer'
    gloss: Priya got up. Arjun got up. Priya and Arjun got up.
    note: 'With verbs of going, getting up and arriving there is no *ने*. The past verb agrees with the doer: *उठा* (man), *उठी* (woman), *उठे* (several people, or a mixed group).'
  hi.a2.unit77.vyast_subah.lesson01.teach.gn_ne:
    title: 'With ने: the verb follows the object'
    gloss: Arjun drank tea. Priya had breakfast. Priya caught the bus.
    note: 'When the verb has an object, the doer takes *ने* and the verb agrees with the OBJECT, not the doer: *चाय* and *बस* are feminine, so *पी* and *पकड़ी*; *नाश्ता* is masculine, so *किया*.'
  hi.a2.unit77.vyast_subah.lesson02.teach.jagahen:
    title: Places and ways to travel
    gloss: bus stop / office / taxi / on foot / to arrive
    note: '*पैदल* is an adverb: it does not change. *पहुँचना* (to arrive) takes no *ने*.'
    example_gloss:
    - Arjun went to the bus stop on foot.
    - Priya took a taxi.
    - Priya reached the office at nine.
    - Arjun also reached the office at nine.
  hi.a2.unit77.vyast_subah.lesson02.teach.lena_dena_karna:
    title: Taking, giving, calling
    gloss: ticket / phone / money / to take / to give
    note: '*पैसे* (money) is always plural in Hindi, so the past verb is *दिए*.'
    example_gloss:
    - Priya took two tickets.
    - Arjun gave the money.
    - Arjun called the office.
  hi.a2.unit77.vyast_subah.lesson02.teach.gn_kiya_liya:
    title: Five irregular pasts
    gloss: 'to do: did / to take: took / to give: gave / to go: went / to be, to become: became'
    note: 'These five are irregular: *किया, लिया, दिया, गया, हुआ*. Feminine: *की, ली, दी, गई, हुई*. Plural masculine: *किए, लिए, दिए, गए, हुए*. Learn them as whole words.'
  hi.a2.unit77.vyast_subah.lesson02.teach.gn_bahuvachan:
    title: Object decides the ending
    gloss: Priya took a taxi. Priya took two tickets. Arjun took a ticket.
    note: 'With *ने* the ending follows the object: *टैक्सी* (feminine) gives *ली*, *दो टिकट* (masculine plural) gives *लिए*, *एक टिकट* (masculine singular) gives *लिया*. The doer does not matter.'
  hi.a2.unit77.vyast_subah.lesson03.teach.gadbad:
    title: When things go wrong
    gloss: it got late / the bus was missed / it rained
    note: '*हो गई* here means ''happened, came about''. *बस छूट गई* literally means ''the bus got left behind''.'
    example_gloss:
    - This morning it got late.
    - I missed my bus.
    - It rained in the morning.
  hi.a2.unit77.vyast_subah.lesson03.teach.bhoolna:
    title: Forgetting things
    gloss: key / umbrella / to forget
    note: '*भूलना* (to forget) takes *गया* in the past and no *ने*: the verb agrees with the person who forgot.'
    example_gloss:
    - Arjun forgot his key.
    - Priya forgot her umbrella.
    - They forgot their phone.
  hi.a2.unit77.vyast_subah.lesson03.teach.lekin_isliye:
    title: But and so
    gloss: but / so, therefore / early, quickly
    note: '*इसलिए* gives the result of what came before; *लेकिन* shows something went differently from the plan.'
    example_gloss:
    - The bus left, so Priya took a taxi.
    - Arjun left early, but it rained.
  hi.a2.unit77.vyast_subah.lesson03.teach.gn_chhoot_gayi:
    title: Whose bus got missed
    gloss: Priya missed her bus. Arjun missed his train.
    note: 'Hindi says it the other way round: ''Priya''s bus got left behind''. The verb agrees with the bus (*बस* is feminine, *ट्रेन* is feminine), so *छूट गई*, whoever the person is.'
  hi.a2.unit77.vyast_subah.lesson03.teach.gn_bhool_gaya:
    title: 'भूल गया: no ने'
    gloss: Arjun forgot his key. Priya forgot her umbrella. They forgot their phone.
    note: 'With *भूल गया* the verb agrees with the PERSON who forgot: *गया* (man), *गई* (woman), *गए* (several people). Compare *ने* verbs, where the object decides.'
  hi.a2.unit77.vyast_subah.lesson03.teach.gn_isliye:
    title: Two parts of a story
    gloss: The bus left, so Priya took a taxi. Arjun left early, but it rained.
    note: Put a comma between the two parts. *इसलिए* introduces the result; *लेकिन* introduces the surprise.
  hi.a2.unit77.vyast_subah.lesson04.teach.prashn_shabd:
    title: Question words
    gloss: when / how / why / where / at what time
    note: 'Put the question word right before the verb. *कितने बजे* asks the time: ''at what o''clock''.'
    example_gloss:
    - When did you leave?
    - How did you reach the office?
    - Why didn't you have breakfast?
    - Where did you go?
    - Priya, where did you go?
    - At what time did you get up?
  hi.a2.unit77.vyast_subah.lesson04.teach.der_se:
    title: Late, on time, by taxi
    gloss: late / on time / by taxi
    note: '*से* after a vehicle means ''by'': *टैक्सी से*. *देर से* means ''late''.'
    example_gloss:
    - Arjun arrived on time.
    - Priya arrived late.
    - I arrived by taxi.
  hi.a2.unit77.vyast_subah.lesson04.teach.gn_tum_nikle:
    title: Asking a friend (तुम)
    gloss: Arjun, when did you leave? Priya, when did you leave?
    note: 'With *तुम* and a verb without *ने*, the ending shows whom you are asking: *निकले* for a man, *निकलीं* for a woman. Both are plural-style endings because *तुम* grammatically takes a plural verb.'
  hi.a2.unit77.vyast_subah.lesson04.teach.gn_kya_tumne:
    title: Yes/no questions with ने
    gloss: Did you have breakfast? No, I didn't have breakfast.
    note: 'A yes/no question starts with *क्या*. For a negative answer put *नहीं* right before the verb. The verb ending does not change: *नाश्ता* is masculine, so *किया*.'
  hi.a2.unit77.vyast_subah.lesson04.teach.gn_kaise_se:
    title: How did you get there?
    gloss: How did you arrive? I arrived by taxi.
    note: Answer *कैसे* with a noun plus *से*. The question to a man uses *पहुँचे*; the answer uses *पहुँचा* for a man speaking and *पहुँची* for a woman.
  hi.a2.unit77.vyast_subah.lesson05.teach.sandesh_shabd:
    title: Words for the message
    gloss: on the way / mess, trouble / finally
    note: '*गड़बड़* is feminine, so the verb is *हुई*.'
    example_gloss:
    - It rained on the way.
    - A lot went wrong today.
    - Finally I reached the office.
  hi.a2.unit77.vyast_subah.lesson05.teach.gn_kram:
    title: Steps in order
    gloss: First I drank tea, then I bathed. After that I left home.
    note: 'In a story, mix both patterns freely: *मैंने चाय पी* (with *ने*, object decides) and *मैं नहाई* (no *ने*, the speaker decides, here a woman).'
  hi.a2.unit77.vyast_subah.lesson05.teach.padho_sandesh:
    title: Priya writes to Arjun
    gloss: Hi Arjun! This morning a lot went wrong. I got up at seven. First I drank tea, then I bathed. After that I left home, but my bus left without me. So I took a taxi. On the way it rained and I forgot my umbrella. Finally I reached the office at ten. Priya
    note: 'Notice the steps: each one is a short past sentence, and the two things that went wrong use *लेकिन* and *इसलिए*.'
  hi.a2.unit77.vyast_subah.lesson06.teach.d1:
    title: Arjun asks
    gloss: 'Arjun: Priya, what happened this morning? You arrived late.'
  hi.a2.unit77.vyast_subah.lesson06.teach.d2:
    title: Priya starts
    gloss: 'Priya: A lot went wrong this morning. I got up at seven and quickly drank my tea.'
  hi.a2.unit77.vyast_subah.lesson06.teach.d3:
    title: Arjun asks what next
    gloss: 'Arjun: What happened then?'
  hi.a2.unit77.vyast_subah.lesson06.teach.d4:
    title: The bus
    gloss: 'Priya: I left home, but my bus left without me. So I took a taxi.'
  hi.a2.unit77.vyast_subah.lesson06.teach.d5:
    title: Arjun asks the time
    gloss: 'Arjun: What time did you reach the office?'
  hi.a2.unit77.vyast_subah.lesson06.teach.d6:
    title: The rain
    gloss: 'Priya: At ten. On the way it rained and I forgot my umbrella.'
  hi.a2.unit77.vyast_subah.lesson06.teach.d7:
    title: Arjun helps
    gloss: 'Arjun: Oh! I made tea for you.'
exercises:
  hi.a2.unit77.vyast_subah.lesson01.exercise01.choose_uthi:
    instruction: Choose the Hindi sentence meaning 'Priya got up at six.'
    correct_option: प्रिया छह बजे उठी।
    distractors:
    - प्रिया ने छह बजे उठी।
    - प्रिया छह बजे उठा।
    - अर्जुन छह बजे उठी।
    accepted_answers:
    - value: प्रिया छह बजे उठी।
      status: correct
    feedback: '*प्रिया छह बजे उठी* = Priya got up at six. No *ने*, and the verb is feminine because Priya is a woman.'
  hi.a2.unit77.vyast_subah.lesson01.exercise02.choose_chai_pi:
    instruction: Choose the Hindi sentence meaning 'Arjun drank tea.'
    correct_option: अर्जुन ने चाय पी।
    distractors:
    - अर्जुन ने चाय किया।
    - अर्जुन चाय पी।
    - प्रिया ने चाय पी।
    accepted_answers:
    - value: अर्जुन ने चाय पी।
      status: correct
    feedback: '*चाय* is feminine, so the verb is *पी*.'
