  hi.a1.unit43.lesson03.teach.kaun_sa_rang:
    title: Saying which color you want
    gloss: '*मुझे* + color + *चाहिए* says which color you want: *मुझे गुलाबी चाहिए* (I''d like pink).'
    note: '*चाहिए* never changes. Colors ending in *-आ*, like *पीला*, change with the noun (*पीले फूल*), but *लाल*, *गुलाबी* and *सफ़ेद* stay the same.'
