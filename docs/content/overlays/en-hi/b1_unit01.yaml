answer_policy:
  chahiye_agreement: >-
    *Chahiye* itself never changes form, but the infinitive immediately
    before it agrees with the thing being acted on: *karna* (masc.),
    *karni* (fem.), *karne* (masc. plural) -- "*mujhe yeh kaam karna
    chahiye*" (I should do this work) vs. "*mujhe yeh report poori karni
    chahiye*" (I should finish this report, *report* is feminine). A typed
    answer using the wrong agreement form is marked incorrect as a real
    grammar error, not a typo.
  past_regret: >-
    *Chahiye tha/thi* ("should have ...") is a genuine regret construction
    about something left undone -- *tha/thi* itself ALSO agrees the same
    way the infinitive does (*...karni chahiye thi* for a feminine
    complement). Don't confuse this with plain present necessity
    (*chahiye* alone).
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question marks
    (?) may likewise be omitted, but the fully punctuated form remains the
    model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

course:
  title: "Hindi B1"
  description: >-
    Intermediate Hindi: expressing necessity, obligation, and past regret
    about an unfulfilled obligation, using चाहिए with its infinitive's
    gender/number agreement.

units:
  hi.b1.unit01.necessity:
    title: "Necessity and Obligation"
    description: Express what you should do, should have done, or should not do, using चाहिए and its agreeing infinitive.

