  hi.b1.unit01.lesson01.teach.kaam:
    title: "Work / task"
    gloss: "work / task"
    note: "Masculine, and invariant between singular and plural -- 'yeh kaam' (this task) vs. 'ye kaam' (these tasks) look the same, distinguished by the demonstrative."
