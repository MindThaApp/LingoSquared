    title: "To do (fem. agreement)"
    gloss: "to do (fem. agreement)"
    note: "This unit's central new grammar point -- see this lesson's own grammar note."
    example_gloss: "I need to have this conversation."
  hi.b1.unit01.lesson01.teach.grammar_agreement:
    title: "I should do this work. I should finish this report. I should do these tasks."
    gloss: "I should do this work. I should finish this report. I should do these tasks."
    note: "*Chahiye* itself is invariant, but the infinitive right before it agrees with the object: *karna* (masculine singular, matching *kaam*), *karni* (feminine, matching *report*), *karne* (masculine plural, matching *ye kaam*). Hindi A2 taught only the masculine singular form -- this is the deferred rule."
  hi.b1.unit01.lesson01.teach.phrase_report:
    title: "I should finish this report"
    gloss: "I should finish this report."
    note: "The feminine-agreement example, tying report + poori + karni together."
  hi.b1.unit01.lesson01.teach.phrase_kaam_pl:
    title: "I should do these tasks"
    gloss: "I should do these tasks."
    note: "The masculine-plural-agreement example."

  hi.b1.unit01.lesson02.teach.kal:
