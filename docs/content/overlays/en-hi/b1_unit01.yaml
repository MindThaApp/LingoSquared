    note: "*Chahiye tha/thi* = should have (but didn't) -- a genuine regret about something left undone. *Tha/thi* agrees the same way the infinitive does: *karna chahiye tha* (masc.) vs. *poori karni chahiye thi* (fem., matching *report*). Don't confuse this with plain present *chahiye* -- the added *tha/thi* is what marks it as past regret, not present necessity."
