course:
  title: Hindi B2
  description: >-
    Upper-intermediate Hindi: defend a position in a discussion -- state
    a claim, support it with reasons and evidence (पहली बात, उदाहरण के
    लिए, शोध से पता चलता है कि), acknowledge the strongest opposing
    point (एक तरफ़...दूसरी तरफ़..., हालांकि, यह सच है), and rebut it
    without conceding (फिर भी, लेकिन, इसका मतलब यह नहीं कि, कुल
    मिलाकर), around the everyday debate of working from home.

units:
  hi.b2.unit01.tark:
    title: "Argumentation"
    description: Defend a position on an everyday issue -- state a claim, support it with reasons and evidence, acknowledge the strongest objection, and rebut it without giving up your claim.

lessons:
  hi.b2.unit01.lesson01.apni_raay:
    title: "Taking a position"
  hi.b2.unit01.lesson02.kaaran_aur_saboot:
    title: "Giving reasons and evidence"
  hi.b2.unit01.lesson03.doosri_taraf:
    title: "Acknowledging the other side"
  hi.b2.unit01.lesson04.jawaab_dena:
    title: "Rebutting"
  hi.b2.unit01.lesson05.tark_padhna:
    title: "Reading an argument"
  hi.b2.unit01.lesson06.poori_daleel:
    title: "Delivering the full argument"

teaching:
  hi.b2.unit01.lesson01.teach.ghar_se_kaam:
    title: "working from home"
    gloss: "working from home / to work from home"
    note: "*घर से काम करना* is the everyday phrase for working from home -- literally 'to do work from home'. It is the topic this whole unit argues about."
    example_gloss: "Working from home is very common these days."
  hi.b2.unit01.lesson01.teach.daftar_mein_kaam:
    title: "working at the office"
    gloss: "to work at the office"
    note: "The opposite pole of the debate. *दफ़्तर* means 'office'; *में* is 'in/at'."
  hi.b2.unit01.lesson01.teach.raay:
    title: "an opinion / a view"
    gloss: "an opinion / a point of view"
    note: "*राय* is the plain word for an opinion -- the thing an argument defends."
    example_gloss: "Everyone has their own opinion."
  hi.b2.unit01.lesson01.teach.mujhe_lagta_hai_ki:
    title: "I think that..."
    gloss: "I think that... / it seems to me that..."
    note: "*मुझे लगता है कि...* literally means 'to me it seems that...' -- *लगता* agrees with an implicit 'it', never with the speaker, so this phrase never changes for who is speaking."
  hi.b2.unit01.lesson01.teach.mere_khayal_se:
    title: "in my opinion..."
    gloss: "in my opinion... / from my thinking..."
    note: "*मेरे ख़याल से* is a softer, very common way to open an opinion, literally 'from my thought'."
  hi.b2.unit01.lesson01.teach.behtar:
    title: better
    gloss: better
    example_gloss: "This method is better."
  hi.b2.unit01.lesson01.teach.se_behtar:
    title: "...is better than"
    gloss: "...is better than"
    note: "*से* here means 'than' in a comparison: *X से बेहतर है* = 'is better than X'. The same word *से* also means 'from' (as in *घर से*) -- context tells you which."
  hi.b2.unit01.lesson01.teach.claim_model:
    title: "I think that working from home is better than working at the office."
    gloss: "I think that working from home is better than working at the office."
    note: "The model claim for this unit. *करने से* uses the oblique infinitive *करने* before *से* ('than doing')."
  hi.b2.unit01.lesson01.teach.sahmat_hoon:
    title: "I agree with it."
    gloss: "I agree with it."
    note: "*सहमत होना* = 'to agree'. *हूँ* (am) never changes for gender, so this phrase is identical for any speaker."
  hi.b2.unit01.lesson01.teach.grammar_standpunt:
    title: "I think that working from home is better. In my opinion too, this is better."
    gloss: "I think that working from home is better. In my opinion too, this is better."
    note: "A claim is the position you will defend. Both *मुझे लगता है कि...* and *मेरे ख़याल से...* signal that what follows is your opinion, not a stated fact -- the starting point of every argument in this unit."

  hi.b2.unit01.lesson02.teach.kyonki:
    title: because
    gloss: because
    note: "*क्योंकि* gives a reason for the clause before it."
    example_gloss: "I like this, because it is easy."
  hi.b2.unit01.lesson02.teach.pahli_baat_doosri_baat:
    title: "firstly..., secondly..."
    gloss: "firstly..., secondly..."
    note: "*पहली बात..., दूसरी बात...* number your reasons so an argument is easy to follow -- the classic way to signpost support."
  hi.b2.unit01.lesson02.teach.iske_alaawa:
    title: "in addition"
    gloss: "in addition / besides"
    note: "*इसके अलावा* adds a further reason on top of the first."
    example_gloss: "In addition, it is comfortable too."
  hi.b2.unit01.lesson02.teach.udaharan_ke_liye:
    title: "for example"
    gloss: "for example"
    note: "*उदाहरण के लिए* introduces a concrete example that backs up a reason."
  hi.b2.unit01.lesson02.teach.shodh_se_pata_chalta:
    title: "research shows that..."
    gloss: "research shows that..."
    note: "*शोध से पता चलता है कि...* is how you cite evidence in an argument -- literally 'from research it becomes known that...'."
  hi.b2.unit01.lesson02.teach.samay:
    title: time
    gloss: time
    example_gloss: "This saves a lot of time."
  hi.b2.unit01.lesson02.teach.samay_bachta_hai:
    title: "this saves time"
    gloss: "this saves time / time is saved by this"
    note: "*इससे समय बचता है* literally means 'from this, time is saved' -- *बचता* agrees with *समय* (time, masculine), never with the person saying it. This is a safe, generic way to state a benefit without naming who benefits."
  hi.b2.unit01.lesson02.teach.utpadak:
    title: productive
    gloss: productive
    note: "*उत्पादक* doesn't change for gender or number -- it stays the same in every sentence."
    example_gloss: "Working from home is more productive."
  hi.b2.unit01.lesson02.teach.zyada:
    title: more
    gloss: "more / a lot"
    example_gloss: "This is better (literally: more good)."
  hi.b2.unit01.lesson02.teach.aur:
    title: and
    gloss: and
    example_gloss: "This saves time, and it is productive too."
  hi.b2.unit01.lesson02.teach.grammar_kaaran:
    title: "Firstly, this saves time. In addition, working from home is more productive, because it is peaceful at home."
    gloss: "Firstly, this saves time. In addition, working from home is more productive, because it is peaceful at home."
    note: "Support = the reasons and evidence behind your claim. Number them (*पहली बात*, *दूसरी बात*), add more (*इसके अलावा*), give examples (*उदाहरण के लिए*), and cite evidence (*शोध से पता चलता है कि*) so the argument is easy to follow."

  hi.b2.unit01.lesson03.teach.ek_taraf_doosri_taraf:
    title: "on the one hand..., on the other hand..."
    gloss: "on the one hand..., on the other hand..."
    note: "*एक तरफ़...* opens a balanced view; it is almost always paired with *दूसरी तरफ़...* to introduce the opposing point you are about to acknowledge."
  hi.b2.unit01.lesson03.teach.haalaanki:
    title: although
    gloss: although
    note: "*हालांकि* concedes a point up front; it sets up a contrast the rest of the sentence will answer."
    example_gloss: "Although it is easy, it still feels difficult."
  hi.b2.unit01.lesson03.teach.yah_sach_hai:
    title: "That's true."
    gloss: "That's true. / This is true."
    note: "*यह सच है* grants that the other side has a real point -- you acknowledge it honestly, then rebut it in the next breath."
  hi.b2.unit01.lesson03.teach.kuch_logon_ko_lagta:
    title: "some people feel that..."
    gloss: "some people feel that..."
    note: "*कुछ लोगों को लगता है कि...* introduces a common objection without owning it yourself, so you can then answer it. *लोगों* is the oblique (with-postposition) form of *लोग* (people)."
  hi.b2.unit01.lesson03.teach.sahkarmi:
    title: colleague
    gloss: colleague
    note: "*सहकर्मी* is used identically for a male or a female colleague -- it never changes form for gender."
    example_gloss: "My colleagues are very helpful."
  hi.b2.unit01.lesson03.teach.yaad_aana:
    title: "to be missed / remembered"
    gloss: "to be missed / to come to mind"
    note: "*X की याद आना* literally means 'the memory of X comes' -- *आती* agrees with *याद* (memory, feminine), NEVER with the person who is missing X. That makes it a safe, generic way to say someone is missed, regardless of who is speaking."
    example_gloss: "Sometimes I miss home."
  hi.b2.unit01.lesson03.teach.kabhi_kabhi:
    title: sometimes
    gloss: sometimes
    example_gloss: "Sometimes there is too much work."
  hi.b2.unit01.lesson03.teach.accha:
    title: "to feel nice"
    gloss: "good / nice (feels good)"
    note: "*अच्छा लगना* = 'to feel nice/pleasant'. *अच्छा* itself just means 'good'."
    example_gloss: "I like this song. (This song feels good to me.)"
  hi.b2.unit01.lesson03.teach.grammar_sweekaar:
    title: "Although working from home feels nice, colleagues are sometimes missed. That's true."
    gloss: "Although working from home feels nice, colleagues are sometimes missed. That's true."
    note: "Acknowledging the other side = naming the strongest point against you fairly, before you answer it. *एक तरफ़...दूसरी तरफ़...*, *हालांकि*, and *यह सच है* all do this without giving up your own position."

  hi.b2.unit01.lesson04.teach.phir_bhi:
    title: "still / yet"
    gloss: "still / yet / even so"
    note: "*फिर भी* answers a concession: you grant the objection, then *फिर भी...* ('still, ...') reasserts your claim. It is the core rebuttal word of this unit."
    example_gloss: "It was raining, still he went."
  hi.b2.unit01.lesson04.teach.iske_viprit:
    title: "on the contrary / by contrast"
    gloss: "on the contrary / by contrast"
    note: "*इसके विपरीत* sets one thing directly against another. Stronger and more formal than *लेकिन*."
    example_gloss: "The office is noisy; by contrast, home is peaceful."
  hi.b2.unit01.lesson04.teach.lekin:
    title: but
    gloss: but
    note: "*लेकिन* is the everyday contrast word. It pivots from the acknowledged point back to your claim."
    example_gloss: "This is easy, but not perfect."
  hi.b2.unit01.lesson04.teach.iska_matlab_yah_nahin:
    title: "that does not mean that..."
    gloss: "that does not mean that..."
    note: "*इसका मतलब यह नहीं कि...* is a set B2 rebuttal frame: you accept the objection, but say it does not undo your claim."
  hi.b2.unit01.lesson04.teach.kul_milaakar:
    title: "in short / altogether"
    gloss: "in short / altogether / on the whole"
    note: "*कुल मिलाकर* signposts your conclusion -- it wraps the argument up."
    example_gloss: "Altogether, it was a good day."
  hi.b2.unit01.lesson04.teach.fayde:
    title: advantages
    gloss: "advantages (फायदों is the oblique form, used before postpositions like से)"
    example_gloss: "Working from home has many advantages."
  hi.b2.unit01.lesson04.teach.nuksaan:
    title: disadvantages
    gloss: "disadvantages / harm"
    example_gloss: "Everything also has some disadvantages."
  hi.b2.unit01.lesson04.teach.bhaari_padna:
    title: "to weigh heavier / outweigh"
    gloss: "to weigh heavier / to outweigh"
    note: "*भारी पड़ना* means 'to carry more weight' in an argument. *पड़ते* agrees with *फायदे*/*नुकसान* (masculine plural, whichever is the grammatical subject), never with the speaker."
    example_gloss: "This time the advantages outweighed the disadvantages."
  hi.b2.unit01.lesson04.teach.ke_fayde_hain:
    title: "has advantages"
    gloss: "has advantages"
    note: "*...के फायदे हैं* = '...has advantages', literally 'the advantages of... exist'."
  hi.b2.unit01.lesson04.teach.grammar_jawaab:
    title: "That's true, but that does not mean that the disadvantages outweigh the advantages. Altogether, the advantages outweigh the disadvantages."
    gloss: "That's true, but that does not mean that the disadvantages outweigh the advantages. Altogether, the advantages outweigh the disadvantages."
    note: "Rebutting = answering the acknowledged objection without giving up your claim. *फिर भी*, *लेकिन*, *इसके विपरीत*, and *इसका मतलब यह नहीं कि...* all pivot back to your position; *कुल मिलाकर* signposts the conclusion."

  hi.b2.unit01.lesson05.teach.reading:
    title: "Reading: working from home is a good change"
    gloss: "Nowadays, more and more people work from home. I am fully convinced that this is a good change. Firstly, this saves time, and research shows that working from home is more productive. Some people feel that colleagues are missed. That's true, but that does not mean that the disadvantages outweigh the advantages. Altogether, the advantages outweigh the disadvantages."
    glosses:
      आजकल: "nowadays"
      ज़्यादा: "more (ज़्यादा से ज़्यादा = more and more)"
      से: "than / from (here, part of ज़्यादा से ज़्यादा)"
      लोग: "people"
      करते: "do / work (habitual, plural/generic -- करते हैं = they work)"
      मुझे: "to me"
      पूरा: "full / complete"
      यकीन: "conviction / certainty"
      है: is
      कि: that
      यह: this
      एक: a / one
      अच्छा: good
      बदलाव: change
      पहली: first
      बात: "thing / matter (पहली बात = firstly)"
      इससे: "from this / by this"
      समय: time
      बचता: "is saved (agrees with समय, never the speaker)"
      शोध: research
      पता: "known (शोध से पता चलता है = research shows / it becomes known from research)"
      चलता: "becomes known / turns out"
      उत्पादक: productive
      होता: "is (states a general truth; agrees with its subject, घर से काम करना)"
      कुछ: some
      लोगों: "people (oblique form, before को)"
      को: "to (dative marker)"
      लगता: "seems / feels"
      सहकर्मियों: "colleagues (oblique form, before की)"
      की: "of (possessive)"
      याद: "memory (याद आती है = is missed)"
      आती: "comes (agrees with याद, feminine)"
      सच: "true"
      लेकिन: but
      इसका: "its / of this"
      मतलब: meaning
      नहीं: not
      नुकसान: disadvantages
      फायदों: "advantages (oblique form, before से)"
      भारी: heavy
      पड़ते: "fall / weigh (agrees with फायदे/नुकसान, never the speaker)"
      कुल: total
      मिलाकर: "combining / altogether"
      फायदे: advantages

  hi.b2.unit01.lesson06.teach.tumhein_aisa_kyon:
    title: "Why do you think that?"
    gloss: "Why do you think that?"
    note: "*तुम्हें ऐसा क्यों लगता है?* asks a debating partner (addressed as *तुम*, matching Priya and Arjun's usual register) to support their claim -- the cue to give your reasons and evidence."
  hi.b2.unit01.lesson06.teach.ismein_kuch_baat:
    title: "There's something to that."
    gloss: "There's something to that. / You have a point."
    note: "*इसमें कुछ बात तो है* concedes that the other person's argument is reasonable -- a natural way to acknowledge a good point in discussion."
  hi.b2.unit01.lesson06.teach.dialogue_priya_claim:
    title: "Priya: I think working from home is better than working at the office."
    gloss: "Priya: I think working from home is better than working at the office."
  hi.b2.unit01.lesson06.teach.dialogue_arjun_why:
    title: "Arjun: Why do you think that?"
    gloss: "Arjun: Why do you think that?"
  hi.b2.unit01.lesson06.teach.dialogue_priya_support:
    title: "Priya: Firstly, this saves time, and research shows that working from home is more productive."
    gloss: "Priya: Firstly, this saves time, and research shows that working from home is more productive."
  hi.b2.unit01.lesson06.teach.dialogue_arjun_objection:
    title: "Arjun: On the other hand, colleagues are sometimes missed."
    gloss: "Arjun: On the other hand, colleagues are sometimes missed."
  hi.b2.unit01.lesson06.teach.dialogue_priya_rebuttal:
    title: "Priya: That's true, but that does not mean that the disadvantages outweigh the advantages. Altogether, the advantages outweigh the disadvantages."
    gloss: "Priya: That's true, but that does not mean that the disadvantages outweigh the advantages. Altogether, the advantages outweigh the disadvantages."
  hi.b2.unit01.lesson06.teach.dialogue_arjun_concede:
    title: "Arjun: There's something to that."
    gloss: "Arjun: There's something to that."
  hi.b2.unit01.lesson06.teach.grammar_poora_tark:
    title: "I think working from home is better. Firstly, this saves time. Sometimes colleagues are missed. Still, the advantages outweigh the disadvantages."
    gloss: "I think working from home is better. Firstly, this saves time. Sometimes colleagues are missed. Still, the advantages outweigh the disadvantages."
    note: "A complete argument has four moves: claim (*मुझे लगता है कि...*), support (*पहली बात...*), acknowledged objection (*कभी-कभी...*), and rebuttal (*फिर भी...*). This is exactly what you produce in the speaking and writing tasks of this lesson."

exercises:
  hi.b2.unit01.lesson01.exercise01.recognize_raay:
    instruction: "What does this word mean?"
    correct_option: "an opinion / a view"
    distractors: ["a question", "an answer", "an agreement"]
    accepted_answers: [{value: "an opinion / a view", status: correct}]
    feedback: "*राय* means an opinion or a view -- the claim you defend."
  hi.b2.unit01.lesson01.exercise02.listen_claim:
    instruction: "Listen and select what you hear."
    correct_option: "I think that working from home is better than working at the office."
    distractors: ["I think that working at the office is better than working from home.", "I think that working from home is nicer than travelling.", "I know that working from home is better than working at the office."]
    accepted_answers: [{value: "I think that working from home is better than working at the office.", status: correct}]
    feedback: "*मुझे लगता है कि घर से काम करना दफ़्तर में काम करने से बेहतर है* means I think that working from home is better than working at the office."
  hi.b2.unit01.lesson01.exercise03.match_claim_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"घर से काम करना": "working from home", "दफ़्तर में काम करना": "working at the office", "राय": "an opinion / a view", "मुझे लगता है कि...": "I think that...", "मेरे ख़याल से...": "in my opinion...", "बेहतर": better, "सहमत": "agreeing / in agreement", "मैं इससे सहमत हूँ।": "I agree with it."}
        status: correct
    feedback: "These are this lesson's claim-stating words."
  hi.b2.unit01.lesson01.exercise04.order_claim:
    instruction: "Put the words in order: I think that working from home is better."
    accepted_answers:
      - {value: "मुझे लगता है कि घर से काम करना बेहतर है", status: correct}
    feedback: "*मुझे लगता है कि घर से काम करना बेहतर है* means I think that working from home is better."
  hi.b2.unit01.lesson01.exercise05.translate_mere_khayal_se:
    instruction: "Translate into Hindi, using मेरे ख़याल से: In my opinion, working from home is better."
    accepted_answers:
      - {value: "मेरे ख़याल से घर से काम करना बेहतर है", status: correct}
      - {value: "मेरे खयाल से घर से काम करना बेहतर है", status: correct}
