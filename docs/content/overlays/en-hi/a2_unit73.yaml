teaching:
  hi.a2.unit73.lesson01.teach.hedphon:
    title: The headphones
    gloss: the headphones
    note: '*हेडफोन* is used in the plural in Hindi, as in English: *ये हेडफोन खराब हैं* (these headphones are broken). The verb is plural too: *हैं*.'
    example_gloss: I bought new headphones.
  hi.a2.unit73.lesson01.teach.ye_hedphon_kharab:
    title: Reporting the headphones are broken
    gloss: These headphones are broken.
    note: '*खराब* (broken, bad) describes any object that no longer works, from electronics to furniture. It does not change for gender: *हेडफोन खराब हैं*, *फोन खराब है*.'
  hi.a2.unit73.lesson01.teach.bayan_hissa_kam:
    title: Describing which side doesn't work
    gloss: The left side doesn't work.
    note: '*काम नहीं कर रहा है* (is not working) is the standard phrase for a device or part that has stopped working. *कर रहा है* agrees with *हिस्सा*, which is masculine singular.'
  hi.a2.unit73.lesson02.teach.paise_vapas:
    title: The money back
    gloss: the money back/refund
    note: '*पैसे वापस* is a fixed phrase for a refund. *पैसे* (money) is masculine plural, so it is *मेरे पैसे* or *अपने पैसे*.'
    example_gloss: I would like my money back.
  hi.a2.unit73.lesson02.teach.mujhe_apne_paise:
    title: Requesting a refund
    gloss: I would like my money back.
    note: '*मुझे ... चाहिए* (literally ''to me ... is needed'') is the usual polite way to say what you want, and it does not depend on whether you are a man or a woman: *मुझे अपने पैसे वापस चाहिए*. *अपने* (one''s own) refers back to the speaker.'
  hi.a2.unit73.lesson02.teach.kya_inhen_badla:
    title: Asking about exchange or refund
    gloss: Can I exchange it or get my money back?
    note: '*बदलना* (to exchange) and *पैसे वापस मिलना* (to get the money back) are the two standard resolutions to a complaint. *मिलना* works with *मुझे*: *मुझे पैसे वापस मिल सकते हैं*.'
  hi.a2.unit73.lesson03.teach.raseed:
    title: The receipt
    gloss: the receipt
    note: '*रसीद* (receipt) is a feminine noun. In shops you may also hear *बिल*.'
    example_gloss: I still have the receipt, here it is.
  hi.a2.unit73.lesson03.teach.kya_raseed_ab:
    title: Asking if the customer has the receipt
    gloss: Do you still have the receipt?
    note: '*अब भी* (still) checks whether the customer still has the receipt. *आपके पास* (with you) is how Hindi expresses having: *रसीद आपके पास है*.'
  hi.a2.unit73.lesson03.teach.mainne_inhen_ath:
    title: Saying when you bought something
    gloss: I bought it eight days ago.
    note: '*पहले* after a time period means ''ago'': *आठ दिन पहले*. *मैंने इन्हें खरीदा था* is a past statement with *ने*; the verb stays masculine singular because the object *इन्हें* already carries an ending (*-हें*).'
  hi.a2.unit73.lesson04.teach.vapsee_neeti:
    title: The return policy
    gloss: the return policy
    note: '*वापसी नीति* (return policy) is a feminine noun phrase, because *नीति* is feminine: *इस दुकान की वापसी नीति*.'
    example_gloss: What's this shop's return policy?
  hi.a2.unit73.lesson04.teach.ap_koee_bhee:
    title: Stating the return window
    gloss: You can return an item within thirty days.
    note: '*तीस दिन के अंदर* (within thirty days) is the standard construction for a deadline: number + *दिन* + *के अंदर*.'
  hi.a2.unit73.lesson04.teach.yah_main_apke:
    title: Offering to arrange something
    gloss: I'll arrange that for you.
    note: '*यह मैं आपके लिए कर देता हूँ* (I''ll do this for you) is a common, reassuring phrase used by staff. *कर देना* adds the sense of doing something for someone.'
  hi.a2.unit73.lesson05.teach.vapsee_neeti_ap:
    title: Reading a return policy notice
    gloss: 'Return policy: you can return an item within thirty days of purchase. Bring the receipt. For a defective item, you''ll get your money back or you can exchange it for a new one.'
    note: '*खराब सामान पर* (for a defective item) introduces the specific case covered by this part of the policy. *पर* means ''on'' or ''for'' here.'
    glosses:
      नीति: policy
      सकते: can, are able to
      सामान: item / article
      अंदर: within
      तीस: thirty
      दिन: days
      बाद: after
      खरीदने: buying (खरीदने के बाद = after buying)
      लौटा: return, give back (from लौटाना)
      लाइए: bring (polite command from लाना)
      रसीद: receipt
      साथ: along, with you
      पर: in the case of / for
      खराब: defective / faulty
      मिलेंगे: will get (from मिलना, to get)
      आपको: you, to you (formal)
      पैसे: money
      वापस: back
      या: or
      बदल: to exchange
      से: with (नए पीस से = with a new piece)
      नए: new
      पीस: unit / copy (of a product)
  hi.a2.unit73.lesson06.teach.namste_main_apkee:
    title: Employee opens the conversation
    gloss: 'Employee: Hello, how can I help you?'
  hi.a2.unit73.lesson06.teach.namste_ye_hedphon:
    title: Arjun reports the problem
    gloss: 'Arjun: Hello, these headphones are broken. The left side doesn''t work.'
  hi.a2.unit73.lesson06.teach.are_yah_to:
    title: Employee asks for the receipt
    gloss: 'Employee: That''s annoying. Do you still have the receipt?'
  hi.a2.unit73.lesson06.teach.jee_yah_leejie:
    title: Arjun confirms and gives the purchase date
    gloss: 'Arjun: Yes, here it is. I bought it eight days ago.'
  hi.a2.unit73.lesson06.teach.koee_bat_naheen:
    title: Employee confirms it's within the window
    gloss: 'Employee: That''s not a problem, that''s within the thirty days. Would you like to exchange it or get your money back?'
  hi.a2.unit73.lesson06.teach.mujhe_apne_paise:
    title: Arjun chooses a refund
    gloss: 'Arjun: I would like my money back.'
  hi.a2.unit73.lesson06.teach.theek_hai_yah:
    title: Employee confirms it's arranged
    gloss: 'Employee: Great, I''ll arrange that for you.'
  hi.a2.unit73.lesson06.teach.usne_hedphon_khareede:
    title: 'Third person: उसने and उसे'
    gloss: He bought the headphones. She got her money back.
    note: '*उसने* (he or she, with *ने*) goes with a past verb that has an object: *उसने हेडफोन खरीदे*. The verb agrees with the object (*हेडफोन* is masculine plural, so *खरीदे*). *उसे अपने पैसे वापस मिल गए* works like *मुझे*: *मिलना* never takes *ने*.'
