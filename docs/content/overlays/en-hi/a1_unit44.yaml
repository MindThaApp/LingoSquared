    title: Giving an opinion about a season
    gloss: '*मुझे* + season + quality + *लगता है* says what you think of a season: *मुझे गर्मी अच्छी लगती है* (I like summer).'
    note: '*लगता* agrees with the season you like, not with you: *पतझड़* is masculine (*लगता*), *गर्मी* and *सर्दी* are feminine (*लगती*), and *अच्छा* changes the same way (*अच्छी*).'
