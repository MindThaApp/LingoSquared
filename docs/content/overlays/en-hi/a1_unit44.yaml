  hi.a1.unit44.lesson05.teach.abhee_vasant_hai:
    title: A conversation about seasons
    gloss: 'It is now spring. The flowers are beautiful. Nina asks: Which season do you find beautiful? Arjun says: I like summer. In summer we swim. Priya says: I like winter. In winter we skate.'
    note: Recaps lesson04's language café conversation via direct-quote narration, mirroring the household/neighborhood/post/cooking/personality/colors units' own comparison-reading shape.
    glosses:
      वसंत: spring
      फूल: flowers
      सुंदर: beautiful
      पूछती: asks
      मौसम: season
      लगता: seems / feels (to me)
      कहता: says
      गर्मी: summer
      अच्छी: nice (fem.)
      तैरते: swim
      सर्दी: winter
      स्केटिंग: ice-skate
