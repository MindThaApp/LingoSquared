answer_policy:
  number_agreement: >-
    This unit's central grammar point is that 'है'/'हैं' after *पसंद*
    agrees with the NUMBER of the liked thing (not the speaker's or the
    liked thing's gender) -- e.g. *चाय पसंद है* (tea, singular) vs.
    *किताबें पसंद हैं* (books, plural). A typed answer using the wrong
    number's copula for a thing whose number is already fixed by the
    sentence (e.g. *किताबें* is always plural) should be marked incorrect
    -- this is the exact point being tested. For open-ended "what do you
    like" prompts (writing_prompt/speak_response) where the learner picks
    their own liked thing, accept either singular or plural framing as
    long as है/हैं internally agrees with whichever noun the learner
    chose.
  chahiye_vs_pasand: >-
    This unit deliberately distinguishes *चाहिए* (unit 6, "want/need",
    takes no है after it, invariant) from *पसंद है/हैं* (this unit,
    "like", always requires a है/हैं copula that agrees in number with
    the liked thing) -- a typed answer that drops the है/हैं after पसंद,
    or that adds है after चाहिए, should be marked incorrect as a real
    structural error, not tolerated as a minor typo.
  nasalization_marks: >-
    Display and teach the correct chandrabindu/anusvara distinction. This
    unit's new nasalized words (पसंद, संगीत, and किताबें's plural ending)
    all use anusvara, verified against a direct codepoint check --
    consistent with the already-established हैं/मुझे/तुम्हें convention.
    In typed A1 answers, accept a variant that drops a nasalization mark
    entirely or substitutes anusvara for chandrabindu (or vice versa)
    when every other character is correct. Do not extend this tolerance
    to a wrong vowel or consonant, which changes the actual word.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question
    marks (?) may likewise be omitted, but the fully punctuated form
    remains the model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation or nasalization marks. For any exercise asking the
    learner to state their own likes/dislikes/preferences, accept any of
    this unit's taught phrasings that fit the prompt, not only the single
    model sentence given in `accepted_answers`.

course:
  title: "Hindi A1"

units:
  hi.a1.unit13.preferences:
    title: "Preferences"

lessons:
  hi.a1.unit13.lesson01.pasand_hai:
    title: "I like"
  hi.a1.unit13.lesson02.tumhein_kya_pasand:
    title: "What do you like?"
  hi.a1.unit13.lesson03.arjun_priya_pasand:
    title: "Arjun and Priya: preferences"

teaching:
  hi.a1.unit13.lesson01.teach.chai_coffee_review:
    title: "Review: tea, coffee"
    gloss: "tea, coffee"
    note: "A quick review of unit 6's vocabulary, needed to talk about likes and dislikes in this unit."
    example_gloss:
      - "I want tea."
      - "I want coffee."

  hi.a1.unit13.lesson01.teach.mujhe_review:
    title: "Review: to me"
    gloss: "to me"
    note: "The dative pronoun covered earlier and used throughout units 6/7/11 -- this unit gives it a new predicate to pair with."
    example_gloss: "I want tea."

  hi.a1.unit13.lesson01.teach.pasand:
    title: "Liking / liked"
    gloss: "liking / liked"
    note: "A noun meaning 'liking' (not 'favorite') -- paired with a dative subject (mujhe/tumhein) and a hai/hain copula, it builds the phrase for 'I like...'"
    example_gloss: "I like tea."

  hi.a1.unit13.lesson01.teach.pasand_hai_grammar:
    title: "Pasand hai = I like"
    gloss: "'Pasand hai' means 'X is pleasing to me', i.e. 'I like X'. It starts with mujhe/tumhein just like 'mujhe...chahiye' (unit 6), but unlike 'chahiye' (which takes no 'hai' after it), 'pasand' always needs 'hai' or 'hain' after it."
    note: "States the structural distinction between chahiye (want/need) and pasand hai (like) explicitly, so the two constructions aren't confused."

  hi.a1.unit13.lesson01.teach.sangeet:
    title: "Music"
    gloss: "music"
    note: "A new noun, used to practice the pasand hai construction with a singular, uncountable subject."
    example_gloss: "I like music."

  hi.a1.unit13.lesson01.teach.haan_nahi_review:
    title: "Review: yes, not"
    gloss: "yes, not"
    note: "A quick review of two early words, needed to answer and negate preference questions in this unit."
    example_gloss:
      - "Yes, I like music."
      - "No, I don't like coffee."

  hi.a1.unit13.lesson01.teach.pasand_nahi_hai_phrase:
    title: "I don't like coffee."
    gloss: "I don't like coffee."
    note: "Negation works exactly like other hai-sentences already taught (e.g. unit 3's 'yoga class nahin hai') -- nahin goes directly before hai."

  hi.a1.unit13.lesson01.teach.kitab_kitaben:
    title: "Book / books"
    gloss: "book / books"
    note: "A new noun pair, singular and plural, used to demonstrate that 'hai'/'hain' after pasand agrees with the liked thing's number."
    example_gloss:
      - "I like the book."
      - "I like books."

  hi.a1.unit13.lesson01.teach.number_agreement_grammar:
    title: "Hai vs. hain after pasand"
    gloss: "'Hai' or 'hain' after 'pasand' agrees with the NUMBER of the liked thing -- exactly like 'mere paas...hai/hain' (unit 2): tea/music pasand hai (singular), books pasand hain (plural)."
    note: "Directly extends unit 2's already-taught hai/hain number-agreement rule to a new context, rather than introducing a new grammar concept."

  hi.a1.unit13.lesson02.teach.tumhein_review:
    title: "Review: to you (informal)"
    gloss: "to you (informal)"
    note: "First taught in unit 6 with chahiye ('tumhein...chahiye?') -- this unit reuses the same dative pronoun with pasand hai instead."
    example_gloss: "Do you like music?"

  hi.a1.unit13.lesson02.teach.kya_tumhein_pasand_hai_grammar:
    title: "Kya tumhein...pasand hai?"
    gloss: "'Kya' at the start of a question is the yes/no-question marker (unit 1); 'tumhein' repeats the same dative-subject frame already used with 'tumhein...chahiye?' (unit 6) -- here 'pasand hai' replaces 'chahiye'."
    note: "Confirms this is a reapplication of an already-known question frame, not a new grammar point."

  hi.a1.unit13.lesson02.teach.khel:
    title: "Sport / game"
    gloss: "sport / game"
    note: "A new noun. Paired with 'yah' (this) in examples to keep number agreement unambiguous, since 'khel' doesn't change form between singular and plural on its own."
    example_gloss: "I like this sport."

  hi.a1.unit13.lesson02.teach.yah_review:
    title: "Review: this"
    gloss: "this"
    note: "First taught in unit 7 ('mujhe yah chahiye') -- reused here to make singular reference to 'khel' unambiguous."
    example_gloss: "This book is good."

  hi.a1.unit13.lesson02.teach.ya_review:
    title: "Review: or"
    gloss: "or"
    note: "First taught in unit 6/7 for ordering food and goods -- reused here to ask a choice question about likes."
    example_gloss: "Tea or coffee?"

  hi.a1.unit13.lesson02.teach.chai_ya_coffee_phrase:
    title: "Do you like tea or coffee?"
    gloss: "Do you like tea or coffee?"
    note: "Combines this lesson's tumhein question frame with the already-taught ya (or) to ask the learner to choose."

  hi.a1.unit13.lesson02.teach.zyada:
    title: "More"
    gloss: "more"
    note: "A new word placed directly before 'pasand hai' to express a preference between two things already named."
    example_gloss: "I like tea more."

  hi.a1.unit13.lesson02.teach.zyada_pasand_grammar:
    title: "Zyada pasand hai = prefer"
    gloss: "'X zyada pasand hai' means preferring one of two things -- 'mujhe chai zyada pasand hai' means 'I like tea more' / 'I prefer tea'."
    note: "A lexical extension, not new grammar -- 'zyada' simply modifies the already-taught 'pasand hai'."

  hi.a1.unit13.lesson03.teach.review_words:
    title: "Review: music, sport, books"
    gloss: "music, sport/game, books"
    note: "A quick review of this unit's key nouns, needed for the dialogue and reading note."
    example_gloss:
      - "I like music."
      - "I don't like this sport."
      - "I like books."

  hi.a1.unit13.lesson03.teach.dialogue.line01:
    title: "Arjun asks about music"
    gloss: "Priya, do you like music?"
  hi.a1.unit13.lesson03.teach.dialogue.line02:
    title: "Priya says she likes it a lot"
    gloss: "Yes, I like music a lot. You?"
  hi.a1.unit13.lesson03.teach.dialogue.line03:
    title: "Arjun agrees and adds sports"
    gloss: "Me too! And I like sports too."
  hi.a1.unit13.lesson03.teach.dialogue.line04:
    title: "Priya prefers books to this game"
    gloss: "Nice! I don't like this game. I like books."
  hi.a1.unit13.lesson03.teach.dialogue.line05:
    title: "Arjun asks tea or coffee"
    gloss: "Okay. Do you like tea or coffee?"
  hi.a1.unit13.lesson03.teach.dialogue.line06:
    title: "Priya prefers tea"
    gloss: "I like tea more."
  hi.a1.unit13.lesson03.teach.dialogue.line07:
    title: "Arjun agrees"
    gloss: "Very good! I like tea too."
  hi.a1.unit13.lesson03.teach.dialogue.line08:
    title: "Priya closes"
    gloss: "Okay! Shall we meet again tomorrow?"

  hi.a1.unit13.lesson03.teach.chahiye_pasand_zyada_grammar:
    title: "Three related patterns"
    gloss: "This unit's three patterns: 'chahiye' (want/need, unit 6) takes no 'hai' after it; 'pasand hai/hain' (this unit) changes with the thing's number; 'zyada pasand hai' means preferring one of two things."
    note: "A closing summary tying the whole unit's grammar together, mirroring unit 12's own paradigm-tying grammar note."

  hi.a1.unit13.lesson03.teach.priya_note:
    title: "Priya's note"
    gloss: "Arjun, I like music a lot. I also like books. I don't like this game. I like tea more. - Priya"
    note: "A short written note restating exactly the facts the dialogue already established, no new claims."
    glosses:
      संगीत: "music"
      बहुत: "very much"
      पसंद: "liked / pleasing"
      किताबें: "books"
      खेल: "game"
      नहीं: "not"
      चाय: "tea"
      ज़्यादा: "more / preferably"

