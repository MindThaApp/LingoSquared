  hi.a1.unit16.lesson02.exercise07.order_mujhe_doctor_ke_paas_jana_hai:
    instruction: "Put the sentence in order: I need to go to the doctor."
    correct_response: ["मुझे", "डॉक्टर", "के", "पास", "जाना", "है"]

  hi.a1.unit16.lesson02.exercise08.order_aaraam_karo_aur_doctor_ke_paas_jaao:
    instruction: "Put the sentence in order: Rest and go to the doctor."
    correct_response: ["आराम", "करो", "और", "डॉक्टर", "के", "पास", "जाओ"]

  hi.a1.unit16.lesson02.exercise09.fill_tumhein_aaraam_chahiye:
    instruction: "Complete the sentence: You need rest."
    accepted_answers: ["आराम"]
    feedback: "Tumhein aaraam chahiye -- 'aaraam' is 'rest'."

  hi.a1.unit16.lesson02.exercise10.fill_mujhe_doctor_ke_paas_jana:
    instruction: "Complete the sentence: I need to GO to the doctor."
    accepted_answers: ["जाना"]
    feedback: "Mujhe doctor ke paas jana hai -- 'jana' (to go) plus 'hai' is how you say you need to go somewhere."

  hi.a1.unit16.lesson02.exercise11.reply_tumhein_kya_chahiye:
    instruction: "Answer: I need medicine."
    accepted_answers:
      - "मुझे दवा चाहिए।"
      - "मुझे दवा चाहिए"

  hi.a1.unit16.lesson02.exercise12.fix_mujhe_doctor_ke_paas_jana_hai:
    instruction: "Correct the sentence so that it means: I need to go to the doctor."
    accepted_answers:
      - "मुझे डॉक्टर के पास जाना है।"
      - "मुझे डॉक्टर के पास जाना है"
      - "मुझे डॉक्टर के पास जाना चाहिए"
    feedback: "Mujhe doctor ke paas jana hai -- use either 'jana hai' or 'jana chahiye', not 'chahiye hai' together."

  hi.a1.unit16.lesson02.exercise13.speak_tumhein_aaraam_chahiye:
    instruction: "Say: You need rest."
    accepted_answers:
      - "तुम्हें आराम चाहिए।"
      - "तुम्हें आराम चाहिए"

  hi.a1.unit16.lesson03.exercise01.comprehend_arjun_symptoms:
    instruction: "Read the line. What symptom does Arjun mention besides a headache?"
    correct_option: "A fever"
    distractors:
      - "A stomachache"
      - "A sore throat"
    accepted_answers: ["A fever"]

  hi.a1.unit16.lesson03.exercise02.comprehend_doctor_destination:
    instruction: "Read the line. Where does Arjun need to go?"
    correct_option: "The doctor"
    distractors:
      - "The station"
      - "The bank"
    accepted_answers: ["The doctor"]

  hi.a1.unit16.lesson03.exercise03.select_tumhein_doctor_ke_paas_jana_hai_meaning:
    instruction: "What does this sentence mean?"
    correct_option: "You need to go to the doctor."
    distractors: ["You are at the doctor's.", "You need a doctor's medicine."]
    accepted_answers: ["You need to go to the doctor."]

  hi.a1.unit16.lesson03.exercise04.read_advice_first:
    instruction: "Read the advice. What should Arjun do first?"
    correct_option: "Rest"
    distractors:
      - "Go to work"
      - "Eat food"
    accepted_answers: ["Rest"]

  hi.a1.unit16.lesson03.exercise05.read_advice_second:
    instruction: "Read the advice. What is the second instruction?"
    correct_option: "Go to the doctor"
    distractors:
      - "Go to the station"
      - "Go to the bank"
    accepted_answers: ["Go to the doctor"]

  hi.a1.unit16.lesson03.exercise06.listen_tumhein_aaraam_chahiye:
    instruction: "Listen and choose what you hear."
    correct_option: "You need rest."
    distractors: ["You need medicine.", "You need a doctor."]
    accepted_answers: ["You need rest."]

  hi.a1.unit16.lesson03.exercise07.match_lesson03_review:
    instruction: "Match each Hindi word to its English meaning."
    correct_response:
      "सिर दर्द": "headache"
      "बुखार": "fever"
      "आराम": "rest"
      "दवा": "medicine"
      "डॉक्टर": "doctor"
      "करो": "do! (command)"
      "के पास": "near / to (a person)"
      "चाहिए": "want / need"
      "तुम्हें": "to you"

  hi.a1.unit16.lesson03.exercise08.order_tumhein_doctor_ke_paas_jana_hai:
    instruction: "Put the sentence in order: You need to go to the doctor."
    correct_response: ["तुम्हें", "डॉक्टर", "के", "पास", "जाना", "है"]

  hi.a1.unit16.lesson03.exercise09.order_mujhe_sir_dard_aur_bukhar_hai:
    instruction: "Put the sentence in order: I have a headache and a fever."
    correct_response: ["मुझे", "सिर", "दर्द", "और", "बुखार", "है"]

  hi.a1.unit16.lesson03.exercise10.fill_sir_dard_aur_bukhar:
    instruction: "Complete the sentence: I have a headache AND a fever."
    accepted_answers: ["और"]
    feedback: "Mujhe sir dard aur bukhar hai -- 'aur' (and) joins the two symptoms."

  hi.a1.unit16.lesson03.exercise11.fix_mujhe_bukhar_hai:
    instruction: "Correct the sentence -- 'hai' never becomes 'hain' here."
    accepted_answers:
      - "मुझे बुखार है।"
      - "मुझे बुखार है"
    feedback: "Mujhe bukhar hai -- 'hai' agrees with 'bukhar', not with the speaker, so it never becomes 'hain'."

  hi.a1.unit16.lesson03.exercise12.reply_tum_theek_ho_full:
    instruction: "Answer: No, I have a headache and a fever."
    accepted_answers:
      - "नहीं, मुझे सिर दर्द और बुखार है।"
      - "नहीं मुझे सिर दर्द और बुखार है"
      - "नहीं मुझे सिरदर्द और बुखार है"
      - "नहीं मुझे बुखार और सिर दर्द है"
      - "नहीं मुझे बुखार और सिरदर्द है"

  hi.a1.unit16.lesson03.exercise13.write_tumhein_kya_chahiye:
    instruction: "Answer the question in Hindi, saying you need medicine or rest."
    accepted_answers:
      - "मुझे दवा चाहिए।"
      - "मुझे दवा चाहिए"
      - "मुझे आराम चाहिए।"
      - "मुझे आराम चाहिए"

  hi.a1.unit16.lesson03.exercise14.speak_mujhe_sir_dard_hai:
    instruction: "Say: I have a headache."
    accepted_answers:
      - "मुझे सिर दर्द है।"
      - "मुझे सिर दर्द है"
      - "मुझे सिरदर्द है"
