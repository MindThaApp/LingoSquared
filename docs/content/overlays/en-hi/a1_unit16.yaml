    correct_option: "I need to go to the doctor."
    distractors: ["I am at the doctor's.", "I need a doctor's medicine."]
    accepted_answers: ["I need to go to the doctor."]

  hi.a1.unit16.lesson02.exercise03.select_tumhein_aaraam_chahiye_meaning:
    instruction: "What does this sentence mean?"
    correct_option: "You need rest."
    distractors: ["You need medicine.", "You are resting."]
    accepted_answers: ["You need rest."]

  hi.a1.unit16.lesson02.exercise04.listen_mujhe_doctor_ke_paas_jana_hai:
    instruction: "Listen and choose what you hear."
    correct_option: "I need to go to the doctor."
    distractors: ["I need to go to the station.", "I need to go to the bank."]
    accepted_answers: ["I need to go to the doctor."]

  hi.a1.unit16.lesson02.exercise05.select_tumhein_dawa_chahiye_meaning:
    instruction: "What does this sentence mean?"
    correct_option: "You need medicine."
    distractors: ["You need rest.", "You need a doctor."]
    accepted_answers: ["You need medicine."]

  hi.a1.unit16.lesson02.exercise06.match_lesson02_words:
    instruction: "Match each Hindi word to its English meaning."
    correct_response:
      "डॉक्टर": "doctor"
      "आराम": "rest"
      "दवा": "medicine"
      "करो": "do! (command)"
      "के पास": "near / to (a person)"
      "चाहिए": "want / need"
      "तुम्हें": "to you"
