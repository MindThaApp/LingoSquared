review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Sixteenth en-hi overlay, written for hi/a1_unit16_health.yaml (schema_
    version 1.1, §19 vocabulary-example format from the start; see that
    file's own generation_provenance for the full, honest source-access
    account, the spine-outcome confirmation against universal_spine.yaml,
    the four disclosed central grammar decisions (the दात + noun + है
    symptom construction reusing unit11's "मुझे काम है" pattern; के पास's
    third disclosed sense, "at a person's place," alongside unit08's
    already-disclosed "near"/"possession" senses; करो as a direct,
    regular-formation reuse of unit09's तुम-imperative -ओ rule applied to
    unit11's already-known करना; and the deliberate scope-narrowing to two
    symptoms/three pieces of advice, including the audit finding that हाथ
    is NOT actually course-wide taught vocabulary despite appearing in an
    example sentence in unit02), the same-speaker-distractor check, the
    cross-unit fact check (five health facts, all mutually consistent,
    none contradicted), the disclosed nasalization/spelling discipline
    (verified via direct codepoint hex dump for सिर/दर्द/बुखार/डॉक्टर/
    आराम/दवा/करो -- none nasalized), the confirmed
    accumulates-across-lessons-within-one-file tokenizer behavior, the
    word-order duplicate-token check, and the §17 fill_in_blank ambiguity
    check. Both files are freshly authored from established Modern
    Standard Hindi, same as units 01-15. No sibling-direction overlay
    exists yet for this unit (hi-en hasn't been authored), so the
    sibling-isolation rule (AUTHORING_GUIDE §8) doesn't apply here --
    noted for whoever authors hi-en next: do not open this file for
    structure/phrasing reference when doing so.

    Asterisk-convention note (AUTHORING_GUIDE §15): following unit15's
    corrected precedent (not unit14's lapse), every inline romanized-Hindi
    word inside a `note`/`gloss` field below is wrapped in single
    asterisks (e.g. *mujhe*, *chahiye*, *ke paas*).

    Fresh-context review 2026-10-17 (content-reviewer.md checklist): checked
    with hi/a1_unit16_health.yaml. Fixes: lesson02.exercise12 instruction
    claimed 'chahiye is never followed by hai' and rejected the valid
    correction 'मुझे डॉक्टर के पास जाना चाहिए' -> instruction pinned to the
    meaning ('I need to go to the doctor') and जाना चाहिए accepted;
    lesson01.exercise12 instruction did not pin the meaning (dropping है
    gives 'I want a headache') -> pinned to 'I have a headache';
    lesson03.exercise13 instruction 'Write: I need medicine' while also
    accepting 'मुझे आराम चाहिए' -> instruction now asks to answer 'what do
    you need?' with medicine or rest; added the standard closed compound
    spelling सिरदर्द to lesson01 ex11/ex12/ex14 and lesson03 ex12/ex14 (also
    important for speech transcripts), plus the बुखार-first order in
    lesson03 ex12; teach.mujhe_hai_review example_gloss 'I have water'
    follows the realization example change to 'मुझे काम है' / 'I have work';
    answer_policy 'दात' typo -> 'dative'. Native-speaker check needed:
    whether 'मुझे सिर दर्द है' vs 'मेरे सिर में दर्द है' should both be
    taught/accepted; whether दवाई should be accepted alongside दवा.

    Second-pass review 2026-10-19: 4 fixes - matching rights मुझे/तुम्हें
    no longer gloss as 'I have' / 'you need'; के पास right -> 'near / to
    (a person)'; grammar_ke_paas_third_sense unit attribution (possession
    was unit 2); lesson03.exercise12 accepts बुखार और सिरदर्द.

answer_policy:
  mujhe_noun_hai_symptom: >-
    This unit's central grammar point extends the dative + noun + है
    construction (मुझे/तुम्हें + noun + है) to symptom statements, e.g.
    "मुझे सिर दर्द है" (I have a headache). A typed answer that drops है
    entirely, or that appends हैं instead of है (है is invariant here --
    it agrees with the following noun, not the दात subject), should be
    marked incorrect -- this is the exact point being tested.
  ke_paas_sense: >-
    "डॉक्टर के पास जाना है" uses के पास in its third disclosed sense (at
    a person's place), distinct from unit08's "near" and "possession"
    senses. A typed answer omitting के पास entirely (e.g. just "मुझे
    डॉक्टर जाना है") should be marked incorrect, since के पास is the
    load-bearing piece that makes the sentence mean "to the doctor('s)"
    rather than something ungrammatical.
  karo_imperative: >-
    "करो" is a regular तुम-imperative (कर + ओ), the same formation rule
    already taught for जाओ/मुड़ो/बताओ/गिनो in unit 9. A typed answer using
    a different, unlearned imperative form should be marked incorrect as
    a real error, not tolerated as a minor typo.
  nasalization_marks: >-
    Display and teach the correct chandrabindu/anusvara distinction. None
    of this unit's new words (सिर, दर्द, बुखार, डॉक्टर, आराम, दवा, करो)
    carry any nasalization mark at all, verified via direct codepoint
    check -- no tolerance rule is needed for a nasalization mark that was
    never present.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question marks
    (?) may likewise be omitted, but the fully punctuated form remains the
    model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation. For any exercise asking the learner to state their own
    symptom or need, accept any of this unit's taught phrasings that fit
    the prompt, not only the single model sentence given in
    `accepted_answers`.

course:
  title: "Hindi A1"

units:
  hi.a1.unit16.health:
    title: "Health"

lessons:
  hi.a1.unit16.lesson01.sir_dard_bukhar:
    title: "Headache and fever"
  hi.a1.unit16.lesson02.doctor_dawa:
    title: "Doctor and medicine"
  hi.a1.unit16.lesson03.priya_arjun_theek_ho:
    title: "Priya and Arjun: are you OK?"

teaching:
  hi.a1.unit16.lesson01.teach.tum_ho_review:
    title: "Review: you, fine, are"
    gloss: "you (informal), fine / well, are"
    note: "A quick review of the words needed to ask a friend how they're feeling."
    example_gloss: "How are you?"

  hi.a1.unit16.lesson01.teach.mujhe_hai_review:
    title: "Review: to me, is"
    gloss: "to me / for me, is"
    note: "The copula needed to build this lesson's symptom construction."
    example_gloss: "I have work."

  hi.a1.unit16.lesson01.teach.tum_theek_ho_phrase:
    title: "Are you OK?"
    gloss: "Are you OK?"
    note: "The unit's opening question, used to check on a friend."

  hi.a1.unit16.lesson01.teach.main_hoon_nahin_review:
    title: "Review: I, am, no / not"
    gloss: "I, am, no / not"
    note: "Needed to answer 'Are you OK?' in the negative."
    example_gloss: "I am fine."

  hi.a1.unit16.lesson01.teach.sir:
    title: "Head"
    gloss: "head"
    note: "A new noun, needed for this unit's first symptom."
    example_gloss: "My head is big."

  hi.a1.unit16.lesson01.teach.dard:
    title: "Pain / ache"
    gloss: "pain / ache"
    note: "A new noun. Combined with a body part, it names a specific ache -- see this unit's own grammar note."
    example_gloss: "I have pain."

  hi.a1.unit16.lesson01.teach.mujhe_sir_dard_hai_phrase:
    title: "I have a headache."
    gloss: "I have a headache."
    note: "The unit's first full symptom sentence."

  hi.a1.unit16.lesson01.teach.grammar_symptom_hai:
    title: "Mujhe + symptom + hai"
    gloss: "'Mujhe + noun + hai' was already learned in unit 11 ('mujhe kaam hai' = I have work). Now it's also used for symptoms: 'mujhe sir dard hai' means 'I have a headache' -- 'sir dard' (sir = head, dard = pain) together make 'headache'. This isn't new grammar, it's the same pattern as before."
    note: "Discloses the second use of an already-taught dative+noun+hai pattern, naming the prior unit before applying it to symptoms."

  hi.a1.unit16.lesson01.teach.bukhar:
    title: "Fever"
    gloss: "fever"
    note: "A new noun, this unit's second symptom."
    example_gloss: "Do you have a fever?"

  hi.a1.unit16.lesson01.teach.mujhe_bukhar_hai_phrase:
    title: "I have a fever."
    gloss: "I have a fever."
    note: "The same dative+noun+hai pattern applied to this lesson's second symptom."

  hi.a1.unit16.lesson02.teach.tumhein_jaana_review:
    title: "Review: to you, to go"
    gloss: "to you / for you, to go"
    note: "Both already taught (unit 6 and unit 15) -- reused here to talk about going to the doctor."
    example_gloss:
      - "What would you like?"
      - "I need to go to the station."

  hi.a1.unit16.lesson02.teach.ke_paas_review:
    title: "Review: near / at"
    gloss: "near / at (a place)"
    note: "First taught in unit 8 -- reused here, and given a third sense on this lesson's own grammar note."
    example_gloss: "The bank is near the school."

  hi.a1.unit16.lesson02.teach.doctor:
    title: "Doctor"
    gloss: "doctor"
    note: "A new noun, this lesson's main topic."
    example_gloss: "The doctor is good."

  hi.a1.unit16.lesson02.teach.mujhe_doctor_ke_paas_jana_hai_phrase:
    title: "I need to go to the doctor."
    gloss: "I need to go to the doctor."
    note: "Combines *ke paas* with unit 15's *mujhe...jana hai* obligation construction."

  hi.a1.unit16.lesson02.teach.grammar_ke_paas_third_sense:
    title: "Ke paas: a third sense"
    gloss: "'Ke paas's first two senses were taught earlier -- near (unit 8: 'bank school ke paas hai') and possession (unit 2: 'mere paas ek kitab hai'). Now a third use: going to be near a PERSON, meaning going to see them -- 'doctor ke paas jana hai' means 'need to go to the doctor'. The same 'mujhe...jana hai' frame is also reused from unit 15."
    note: "Names both prior senses by unit number before introducing the third, and re-flags the obligation construction's own reuse."

  hi.a1.unit16.lesson02.teach.aaraam:
    title: "Rest"
    gloss: "rest"
    note: "A new noun, this unit's first piece of advice."
    example_gloss: "I need rest."

  hi.a1.unit16.lesson02.teach.chahiye_review:
    title: "Review: want / need"
    gloss: "want / need"
    note: "First taught in unit 6, reused here to state what someone needs."
    example_gloss: "I would like tea."

  hi.a1.unit16.lesson02.teach.tumhein_aaraam_chahiye_phrase:
    title: "You need rest."
    gloss: "You need rest."
    note: "The already-established *tumhein...chahiye* pattern applied to this lesson's own new noun."

  hi.a1.unit16.lesson02.teach.dawa:
    title: "Medicine"
    gloss: "medicine"
    note: "A new noun, this unit's second piece of advice."
    example_gloss: "I need medicine."

  hi.a1.unit16.lesson02.teach.tumhein_dawa_chahiye_phrase:
    title: "You need medicine."
    gloss: "You need medicine."
    note: "The same *chahiye* pattern applied to medicine."

  hi.a1.unit16.lesson02.teach.jaao_aur_review:
    title: "Review: go!, and"
    gloss: "go!, and"
    note: "Both already taught (unit 9 and unit 1/2) -- reused here to link two pieces of advice."
    example_gloss:
      - "Go straight."
      - "I'd like tea and coffee."

  hi.a1.unit16.lesson02.teach.karo_grammar:
    title: "Karo: reusing the -o imperative rule"
    gloss: "'Karo' uses the same tum-imperative rule already taught in unit 9 ('jao', 'muro', 'batao', 'gino' -- all end in '-o'). Here it's built from 'karna' (unit 11's 'maaf karna'), whose stem 'kar' plus '-o' gives 'karo', meaning 'do!'. 'Aaraam karo' means 'Rest!'"
    note: "A direct, explicit extension of the already-established imperative rule, applied to a verb the learner already knows as an infinitive."

  hi.a1.unit16.lesson02.teach.aaraam_karo_phrase:
    title: "Rest!"
    gloss: "Rest!"
    note: "The new imperative applied to this unit's first piece of advice."

  hi.a1.unit16.lesson02.teach.aaraam_karo_aur_doctor_ke_paas_jaao_phrase:
    title: "Rest and go to the doctor."
    gloss: "Rest and go to the doctor."
    note: "Combines this lesson's two pieces of advice into one natural instruction, previewing lesson 3's reading card."

  hi.a1.unit16.lesson03.teach.dialogue.line01:
    title: "Priya asks if Arjun is OK"
    gloss: "Arjun, are you OK?"
  hi.a1.unit16.lesson03.teach.dialogue.line02:
    title: "Arjun says he has a headache and a fever"
    gloss: "No, I have a headache and a fever."
  hi.a1.unit16.lesson03.teach.dialogue.line03:
    title: "Priya says he needs rest"
    gloss: "That's not good. You need rest."
  hi.a1.unit16.lesson03.teach.dialogue.line04:
    title: "Arjun also wants medicine"
    gloss: "Yes, but I also need medicine."
  hi.a1.unit16.lesson03.teach.dialogue.line05:
    title: "Priya says he needs to go to the doctor"
    gloss: "OK. You need to go to the doctor."
  hi.a1.unit16.lesson03.teach.dialogue.line06:
    title: "Arjun thanks Priya"
    gloss: "OK, thanks."
  hi.a1.unit16.lesson03.teach.dialogue.line07:
    title: "Priya tells him to rest"
    gloss: "Rest!"
  hi.a1.unit16.lesson03.teach.dialogue.line08:
    title: "Arjun agrees"
    gloss: "OK."

  hi.a1.unit16.lesson03.teach.grammar_summary:
    title: "Three main rules"
    gloss: "This unit's three main rules: (1) 'mujhe/tumhein + symptom + hai' states a health problem (e.g. 'mujhe bukhar hai'); (2) 'tumhein/mujhe + thing + chahiye' states a need (e.g. 'tumhein aaraam chahiye'); (3) 'X ke paas jana hai' says who it's necessary to go see (e.g. 'doctor ke paas jana hai')."
    note: "A closing summary tying the whole unit's grammar together, mirroring unit 15's own paradigm-tying grammar note."

  hi.a1.unit16.lesson03.teach.advice_reading:
    title: "Reading some advice"
    gloss: "Rest. Go to the doctor."
    note: "A short, direct instruction (no full narrative framing, matching how real spoken advice sounds) restating exactly the facts already established in the dialogue, no new claims."
    glosses:
      आराम: "rest"
      करो: "do (imperative, from करना)"
      डॉक्टर: "doctor"
      जाओ: "go (imperative, from जाना)"

exercises:
  hi.a1.unit16.lesson01.exercise01.select_sir_meaning:
    instruction: "What does this word mean?"
    correct_option: "head"
    distractors: ["fever", "pain"]
    accepted_answers: ["head"]

  hi.a1.unit16.lesson01.exercise02.select_dard_meaning:
    instruction: "What does this word mean?"
    correct_option: "pain / ache"
    distractors: ["head", "fever"]
    accepted_answers: ["pain / ache"]

  hi.a1.unit16.lesson01.exercise03.select_mujhe_sir_dard_hai_meaning:
    instruction: "What does this sentence mean?"
    correct_option: "I have a headache."
    distractors: ["I have a fever.", "My head is big."]
    accepted_answers: ["I have a headache."]

  hi.a1.unit16.lesson01.exercise04.listen_mujhe_sir_dard_hai:
    instruction: "Listen and choose what you hear."
    correct_option: "I have a headache."
    distractors: ["I have a fever.", "I need rest."]
    accepted_answers: ["I have a headache."]

  hi.a1.unit16.lesson01.exercise05.select_mujhe_bukhar_hai_meaning:
    instruction: "What does this sentence mean?"
    correct_option: "I have a fever."
    distractors: ["I have a headache.", "I am fine."]
    accepted_answers: ["I have a fever."]

  hi.a1.unit16.lesson01.exercise06.match_lesson01_words:
    instruction: "Match each Hindi word to its English meaning."
    correct_response:
      "सिर": "head"
      "दर्द": "pain / ache"
      "बुखार": "fever"
      "ठीक": "fine / well"
      "मुझे": "to me"
      "है": "is"
      "तुम": "you (informal)"
      "नहीं": "no / not"

  hi.a1.unit16.lesson01.exercise07.order_mujhe_sir_dard_hai:
    instruction: "Put the sentence in order: I have a headache."
    correct_response: ["मुझे", "सिर", "दर्द", "है"]

  hi.a1.unit16.lesson01.exercise08.order_main_theek_nahin_hoon:
    instruction: "Put the sentence in order: I am not fine."
    correct_response: ["मैं", "ठीक", "नहीं", "हूँ"]

  hi.a1.unit16.lesson01.exercise09.fill_mujhe_sir_dard:
    instruction: "Complete the sentence: I have a HEADACHE."
    accepted_answers: ["दर्द"]
    feedback: "Mujhe sir dard hai -- 'dard' (pain) after 'sir' (head) names the specific ache."

  hi.a1.unit16.lesson01.exercise10.fill_mujhe_bukhar:
    instruction: "Complete the sentence: I have a fever."
    accepted_answers: ["बुखार"]
    feedback: "Mujhe bukhar hai -- 'bukhar' is 'fever'."

  hi.a1.unit16.lesson01.exercise11.reply_tum_theek_ho:
    instruction: "Answer: I have a headache."
    accepted_answers:
      - "मुझे सिर दर्द है।"
      - "मुझे सिर दर्द है"
      - "मुझे सिरदर्द है"
  hi.a1.unit16.lesson01.exercise14.dictation_mujhe_sir_dard_hai:
    instruction: "Type what you hear."
    correct_option: "मुझे सिर दर्द है"
    accepted_answers: [{value: "मुझे सिर दर्द है", status: correct}, {value: "मुझे सिरदर्द है", status: correct}]
    orthography_strict: true


  hi.a1.unit16.lesson01.exercise12.fix_mujhe_sir_dard_hai:
    instruction: "Correct the sentence so that it means: I have a headache."
    accepted_answers:
      - "मुझे सिर दर्द है।"
      - "मुझे सिर दर्द है"
      - "मुझे सिरदर्द है"
    feedback: "Mujhe sir dard hai -- the symptom construction only needs 'hai', not 'chahiye hai' together."

  hi.a1.unit16.lesson01.exercise13.speak_mujhe_bukhar_hai:
    instruction: "Say: I have a fever."
    accepted_answers:
      - "मुझे बुखार है।"
      - "मुझे बुखार है"

  hi.a1.unit16.lesson02.exercise01.select_doctor_meaning:
    instruction: "What does this word mean?"
    correct_option: "doctor"
    distractors: ["medicine", "rest"]
    accepted_answers: ["doctor"]

  hi.a1.unit16.lesson02.exercise02.select_mujhe_doctor_ke_paas_jana_hai_meaning:
