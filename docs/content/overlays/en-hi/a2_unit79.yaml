  notes: 'English overlay written from the realization. Drafted by drafting tool A. Grammar: past progressive (-रहा था / -रही थी / -रहे थे / -रही थीं), negative and question forms, जब ... तभी ... for an interrupting event (simple perfective, with ने where the verb has an object), जब ... तब ... for two simultaneous activities. Canon: Priya and Arjun are friends using tum; Priya takes the bus to the office (as in unit 77). OPEN NATIVE QUESTIONS: (1) is तभी or उसी समय more natural after जब-clauses in speech? (2) is ''माफ़ करना'' fine between friends? (3) ''बारिश शुरू हो गई'' vs ''बारिश होने लगी''.'
answer_policy:
  punctuation: Hindi text is shown with the danda as the sentence-final mark. In typed answers, accept the danda, a plain period, or the mark omitted entirely as equivalent. Question marks may likewise be omitted.
  gender_agreement: Where the speaker or addressee is a named man or woman, the verb must agree with that person. Where the speaker is just 'I' (gender unspecified), both the masculine and the feminine form are accepted. Wrong agreement with a named person is a real grammar error, not a typo.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation.
course:
  title: Hindi A2
  description: Intermediate Hindi continuing the Priya and Arjun storyline, now with a grammar-led block on talking about the past.
units:
  hi.a2.unit79.tabhi_baarish_shuru:
    title: Then the Rain Started
    description: Say what you were doing when something else happened, such as a phone call, a power cut, rain or a traffic jam.
lessons:
  hi.a2.unit79.tabhi_baarish_shuru.lesson01.kya_kar_rahe_the:
    title: What Were You Doing?
  hi.a2.unit79.tabhi_baarish_shuru.lesson02.tum_kahan_the:
    title: What Were You Doing, Then?
  hi.a2.unit79.tabhi_baarish_shuru.lesson03.jab_tabhi:
    title: When ... Just Then ...
  hi.a2.unit79.tabhi_baarish_shuru.lesson04.sadak_par_jaam:
    title: A Traffic Jam
  hi.a2.unit79.tabhi_baarish_shuru.lesson05.kal_shaam:
