teaching:
  hi.a2.unit79.tabhi_baarish_shuru.lesson01.teach.kriyayen:
    title: Everyday actions
    gloss: to make / to watch / to listen to
    note: '*रही थी* shows the action was in progress at a past moment.'
    example_gloss:
    - Priya was cooking.
    - Arjun was watching the news.
    - The children were listening to songs.
  hi.a2.unit79.tabhi_baarish_shuru.lesson01.teach.us_samay:
    title: At that time
    gloss: at that time / in the room / to talk
    note: '*उस समय* names the past moment you are talking about.'
    example_gloss:
    - At that time Priya was reading in the room.
    - At that time Arjun was watching TV at home.
    - At that time we were talking.
  hi.a2.unit79.tabhi_baarish_shuru.lesson01.teach.gn_raha_tha:
    title: The past progressive
    gloss: was doing (man) / (woman) / (several men or mixed) / (several women)
    note: 'Verb stem + *रहा / रही / रहे / रही* + *था / थी / थे / थीं*. Both parts agree with the person doing it: *देख रहा था* (man), *देख रही थी* (woman), *देख रहे थे* (several), *देख रही थीं* (several women).'
  hi.a2.unit79.tabhi_baarish_shuru.lesson01.teach.gn_hai_tha:
    title: Now or then
    gloss: She is cooking. She was cooking.
    note: 'Change only the last word: *है* for the present moment, *थी* for a past moment. The rest of the verb stays the same.'
  hi.a2.unit79.tabhi_baarish_shuru.lesson01.teach.gn_bina_ne:
    title: Finished or in progress
    gloss: Priya cooked (and finished). Priya was cooking.
    note: 'A finished action uses the simple past with *ने*: *प्रिया ने खाना बनाया*. An action in progress uses *रही थी* and has no *ने*.'
  hi.a2.unit79.tabhi_baarish_shuru.lesson02.teach.aur_kriyayen:
    title: More actions in progress
    gloss: to sleep / to work / to wait / to walk
    note: '*का इंतज़ार करना* = to wait for.'
    example_gloss:
    - I was sleeping.
    - Priya was waiting for the bus.
    - Arjun was walking along the road.
    - They were working in the office.
  hi.a2.unit79.tabhi_baarish_shuru.lesson02.teach.sadak_dafter:
    title: Where were you
    gloss: road / office / then, at that time
    note: '*तब* here means ''at that time''. *था* alone, without a verb, says where a man was.'
    example_gloss:
    - Where were you then?
    - Then I was on the road.
    - Then I was in the office.
  hi.a2.unit79.tabhi_baarish_shuru.lesson02.teach.gn_nahin_raha:
    title: Was not doing
    gloss: I was not sleeping. Priya was not working.
    note: 'Put *नहीं* before the progressive verb: *सो नहीं रहा था*, *नहीं कर रही थी*. The agreement stays the same.'
  hi.a2.unit79.tabhi_baarish_shuru.lesson02.teach.gn_prashn_rahe:
    title: Asking what someone was doing
    gloss: What were you doing? Were you sleeping?
    note: Use *क्या* for both kinds of question. To a man or a mixed group the form is *कर रहे थे*; to a woman it is *कर रही थीं*.
  hi.a2.unit79.tabhi_baarish_shuru.lesson02.teach.gn_uttar:
    title: Where were you
    gloss: Where were you then? Then I was on the road. Where was Priya? She was in the office.
    note: '*था / थी* alone tells where someone was. A man says *था*, a woman *थी*.'
  hi.a2.unit79.tabhi_baarish_shuru.lesson03.teach.achanak:
    title: Something happened
    gloss: the power went out / the phone rang / the rain started
    note: '*तभी* means ''just then''. It points to the moment when the second event happened.'
    example_gloss:
    - Priya was cooking, and just then the power went out.
    - Arjun was sleeping, and just then the phone rang.
    - We were walking, and just then the rain started.
  hi.a2.unit79.tabhi_baarish_shuru.lesson03.teach.jab_shabd:
    title: When ... just then
    gloss: when / just then
    note: '*जब* opens the background; *तभी* opens the interrupting event.'
    example_gloss:
    - When Arjun was sleeping, just then Priya phoned.
  hi.a2.unit79.tabhi_baarish_shuru.lesson03.teach.gn_jab_tabhi:
    title: Background and interruption
    gloss: When Priya was cooking, just then the power went out.
    note: 'The long, continuing action is in the *जब* clause with *रही थी*. The short event after *तभी* is in the simple past: *चली गई*.'
  hi.a2.unit79.tabhi_baarish_shuru.lesson03.teach.gn_jab_ne:
    title: The interruption with ने
    gloss: When Arjun was sleeping, just then Priya phoned.
    note: 'If the short event has an object (*फ़ोन*), the doer takes *ने* as usual: *प्रिया ने फ़ोन किया*. The background clause never takes *ने*.'
  hi.a2.unit79.tabhi_baarish_shuru.lesson03.teach.gn_kram_badla:
    title: Order can change
    gloss: Arjun was sleeping when Priya phoned.
    note: You can also put the background first and *जब* in the middle. The meaning stays the same; only the order changes.
  hi.a2.unit79.tabhi_baarish_shuru.lesson04.teach.jaam_mausam:
    title: Traffic and weather
    gloss: traffic jam / traffic / heavy rain / cold wind
    note: '*हवा चलना* is the usual verb for wind blowing. *बारिश हो रही थी* = it was raining.'
    example_gloss:
    - There was a big traffic jam on the road.
    - There was a lot of traffic.
    - It was raining hard.
    - A cold wind was blowing and it was raining.
  hi.a2.unit79.tabhi_baarish_shuru.lesson04.teach.aana_jaana:
    title: Coming home
    gloss: from the office to home / to go / to arrive
    note: Use *तब* in the second part when you describe the situation at that time.
    example_gloss:
    - When I was going home from the office, there was a big jam on the road.
    - When I reached home, it was raining.
    - When Priya reached home, it was raining.
  hi.a2.unit79.tabhi_baarish_shuru.lesson04.teach.gn_jab_tab:
    title: जब ... तब ...
    gloss: When I was going home, there was a big jam on the road.
    note: '*जब ... तब ...* ties two situations together in time. The second part often uses *था / थी* (a state) or another progressive.'
  hi.a2.unit79.tabhi_baarish_shuru.lesson04.teach.gn_do_kaam:
    title: Two things at once
    gloss: While Arjun was studying, Priya was listening to songs.
    note: For two activities at the same time, put a progressive on both sides of *जब ... तब ...*.
  hi.a2.unit79.tabhi_baarish_shuru.lesson04.teach.gn_tabhi_tab:
    title: तभी or तब
    gloss: We were walking, and just then the rain started. While we were walking, it was raining at that time.
    note: '*तभी* = a new event happens at that very moment. *तब* = describes the situation at that time. Compare *शुरू हो गई* (new event) with *हो रही थी* (already going on).'
  hi.a2.unit79.tabhi_baarish_shuru.lesson05.teach.padhne_shabd:
    title: Words for the message
    gloss: to get off / window / people / to close
    note: '*बस से उतरना* = to get off the bus. *खिड़कियाँ* is feminine plural.'
    example_gloss:
    - When I got off the bus, it was still raining.
    - People were closing the windows.
    - Arjun got off the bus.
  hi.a2.unit79.tabhi_baarish_shuru.lesson05.teach.padho_kal_shaam:
    title: Priya writes about yesterday evening
    gloss: Yesterday evening I was going home from the office. There was a big jam on the road. I was listening to songs on the bus when heavy rain started. People were closing the windows. When I got off the bus, it was still raining. I had no umbrella. Priya
    note: 'Notice the pattern: background actions with *रही थी* and one sudden event after *तभी*.'
  hi.a2.unit79.tabhi_baarish_shuru.lesson06.teach.d1:
    title: Arjun asks
    gloss: 'Arjun: Priya, I phoned you yesterday evening. Why didn''t you pick up?'
  hi.a2.unit79.tabhi_baarish_shuru.lesson06.teach.d2:
    title: Priya apologises
    gloss: 'Priya: Sorry! At that time I was on the bus.'
  hi.a2.unit79.tabhi_baarish_shuru.lesson06.teach.d3:
    title: Arjun asks
    gloss: 'Arjun: What were you doing?'
  hi.a2.unit79.tabhi_baarish_shuru.lesson06.teach.d4:
    title: Priya explains
    gloss: 'Priya: I was listening to songs when heavy rain started.'
  hi.a2.unit79.tabhi_baarish_shuru.lesson06.teach.d5:
    title: Arjun asks
    gloss: 'Arjun: What happened then?'
  hi.a2.unit79.tabhi_baarish_shuru.lesson06.teach.d6:
    title: Priya finishes
    gloss: 'Priya: When I got off the bus, it was still raining. I had no umbrella.'
