    Asterisk convention (§15): every inline romanized-Hindi word inside a
    `note`/`gloss` field below is wrapped in single asterisks.

    Not yet reviewed -- status left honestly as unreviewed.

answer_policy:
  hoga_future: >-
    *Hoga* is the future-tense form of *hai* (is), scope-narrowed in this
    unit to the masculine singular ("*yah kal theek hoga*" -- it will be
    fixed tomorrow). The feminine (*hogi*) and plural (*honge*) forms
    exist and are shown once in this unit's own maintenance-notice reading
    card, but are not tested -- a typed answer only ever needs the
    masculine *hoga* form to be marked correct in this unit's exercises.
  kharab_invariant: >-
    *Kharab* (broken / not working) never changes form for gender, unlike
    *bada/badi* or *chota/choti* (unit 18) -- the same word is used
    regardless of the noun it describes.
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Question marks
    (?) may likewise be omitted, but the fully punctuated form remains the
    model answer.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

