teaching:
  hi.a2.unit89.khaane_se_pehle.lesson01.teach.shabd_pehle:
    title: Words for before
    gloss: to eat / to wash hands / to brush teeth / to sleep / breakfast / at night / before
    note: '*ब्रश करना* is the usual way to say to brush your teeth.'
    example_gloss:
    - I wash my hands before eating. (man speaking)
    - Priya brushes her teeth before sleeping.
    - We drink tea before going to the office.
  hi.a2.unit89.khaane_se_pehle.lesson01.teach.gn_pehle_kriya:
    title: से पहले after a verb
    gloss: I wash my hands before eating. Priya brushes her teeth before sleeping.
    note: 'Before *से पहले* the infinitive ends in *-ने*: *खाना → खाने*, *सोना → सोने*, *जाना → जाने*.'
  hi.a2.unit89.khaane_se_pehle.lesson01.teach.gn_pehle_sangya:
    title: से पहले after a noun
    gloss: Before breakfast I take a bath. Before the meeting Priya makes a phone call.
    note: A masculine noun ending in *-आ* changes to *-े* (*नाश्ता → नाश्ते से पहले*). Other nouns do not change (*मीटिंग से पहले*).
  hi.a2.unit89.khaane_se_pehle.lesson02.teach.shabd_baad:
    title: Words for after
    gloss: after / to get up / to bathe / to go for a stroll / first / then
    note: '*पहले … फिर …* means first … then ….'
    example_gloss:
    - After getting up I take a bath. (man speaking)
    - Priya drinks tea after breakfast.
    - After eating we go for a stroll.
    - First I take a bath, then I have breakfast. (man speaking)
  hi.a2.unit89.khaane_se_pehle.lesson02.teach.gn_baad:
    title: के बाद
    gloss: After getting up I take a bath. After eating we go for a stroll.
    note: '*के बाद* works like *से पहले*: the infinitive ends in *-ने* (*उठने के बाद*) and a noun like *नाश्ता* becomes *नाश्ते के बाद*.'
  hi.a2.unit89.khaane_se_pehle.lesson02.teach.gn_pehle_phir:
    title: पहले … फिर …
    gloss: First I take a bath, then I have breakfast.
    note: '*पहले* (first) and *फिर* (then) put two actions in order. The verb keeps its present form in both parts.'
  hi.a2.unit89.khaane_se_pehle.lesson03.teach.shabd_jab:
    title: Words for when
    gloss: when / then / to reach / to stay at home / (rain) happens
    note: '*बारिश होती है* means it rains (literally rain happens).'
    example_gloss:
    - When I reach home, I drink tea. (man speaking)
    - When it rains, we stay at home.
    - When Priya reaches the office, she drinks tea first.
  hi.a2.unit89.khaane_se_pehle.lesson03.teach.gn_jab_tab:
    title: जब ... तब ...
    gloss: When I reach home, I drink tea. When it rains, we stay at home.
    note: '*जब* starts the first clause and *तब* the second. Both verbs are in the present when you talk about a habit.'
  hi.a2.unit89.khaane_se_pehle.lesson03.teach.gn_tab_hatana:
    title: Leaving out तब
    gloss: When it rains, we stay at home. When Priya reaches the office, she drinks tea first.
    note: In speech *तब* is often left out. The meaning stays the same.
  hi.a2.unit89.khaane_se_pehle.lesson04.teach.shabd_vidhi:
    title: Words for a recipe
    gloss: to heat / tea leaves / milk / sugar / to add / to mix / finally
    note: '*डालना* = to put in. *मिलाना* = to mix in.'
    example_gloss:
    - First heat the water. (to a friend)
    - Then add the tea leaves. (to a friend)
    - After that, mix in the milk. (to a friend)
    - Finally add the sugar. (to a friend)
  hi.a2.unit89.khaane_se_pehle.lesson04.teach.gn_vidhi:
    title: Steps in order
    gloss: First heat the water. Then add the tea leaves. After that, mix in the milk.
    note: 'Use *पहले*, *फिर*, *उसके बाद* and *आख़िर में* to number the steps. To a friend, the verb ends in *-ओ*: *करो, डालो, मिलाओ*.'
  hi.a2.unit89.khaane_se_pehle.lesson04.teach.gn_vidhi_baad:
    title: Same order, two ways
    gloss: Add the tea leaves before mixing in the milk. Mix in the milk after adding the tea leaves.
    note: '*से पहले* and *के बाद* can say the same order from two sides.'
  hi.a2.unit89.khaane_se_pehle.lesson05.teach.shabd_subah:
    title: Words for the morning
    gloss: morning / to make tea / to check email
    note: '*बनाना* = to make. *देखना* = to look at, to check.'
    example_gloss:
    - In the morning I get up. (man speaking)
    - I make tea. (man speaking)
    - I check my email. (man speaking)
  hi.a2.unit89.khaane_se_pehle.lesson05.teach.padho_subah:
    title: Arjun describes his morning
    gloss: In the morning I get up. After getting up I take a bath. Before breakfast I make tea. When I reach the office, I check my email first. Arjun
    note: Put the four actions in order.
  hi.a2.unit89.khaane_se_pehle.lesson06.teach.d1:
    title: Priya asks
    gloss: 'Priya: Arjun, what do you do in the morning after getting up?'
  hi.a2.unit89.khaane_se_pehle.lesson06.teach.d2:
    title: Arjun answers
    gloss: 'Arjun: First I take a bath, then I make tea.'
  hi.a2.unit89.khaane_se_pehle.lesson06.teach.d3:
    title: Priya asks more
    gloss: 'Priya: And after breakfast?'
  hi.a2.unit89.khaane_se_pehle.lesson06.teach.d4:
    title: Arjun goes on
    gloss: 'Arjun: After breakfast I go to the office. When I arrive, I check my email first.'
  hi.a2.unit89.khaane_se_pehle.lesson06.teach.d5:
    title: Priya shares hers
    gloss: 'Priya: Very good! I brush my teeth before sleeping and drink tea after breakfast.'
