teaching:
  hi.a2.unit20.lesson01.teach.pata:
    title: "Address"
    gloss: "address"
    note: "A new noun, masculine, this whole unit's own topic word."
    example_gloss: "This is my new address."

  hi.a2.unit20.lesson01.teach.naya_review:
    title: "Review: new"
    gloss: "new (masc. / fem.)"
    note: "First taught in unit 14 (comparisons) -- reused here for 'a new address'."
    example_gloss:
      - "This is my new house."
      - "The cap is new."

  hi.a2.unit20.lesson01.teach.mera_review:
    title: "Review: my"
    gloss: "my"
    note: "First taught in unit 1 -- reused here for 'my new address'."
    example_gloss: "This is my new address."

  hi.a2.unit20.lesson01.teach.apna:
    title: "One's own (masc. / fem. / pl.)"
    gloss: "one's own (agrees with the noun it modifies)"
    note: "A new grammar word -- see this lesson's own grammar note. Always refers back to the sentence's own subject, unlike *mera*/*tumhara*, which refer to a fixed person."
    example_gloss:
      - "I need to change my address."
      - "This is my own shop."

  hi.a2.unit20.lesson01.teach.badalna:
    title: "To change"
    gloss: "to change"
    note: "A new verb, this unit's central action. Transitive -- reused in lesson 2/3 with the *ne* construction."
    example_gloss: "I need to change my address."

  hi.a2.unit20.lesson01.teach.mujhe_apna_pata_badalna_hai_phrase:
    title: "I need to change my address"
    gloss: "I need to change my address."
    note: "Reuses the already-taught *mujhe ... hai* + infinitive pattern (unit 15) with this lesson's two new words."

  hi.a2.unit20.lesson01.teach.aadhaar_card:
    title: "Aadhaar card"
    gloss: "Aadhaar card"
    note: "A new compound noun -- India's national ID card, this unit's whole scenario."
    example_gloss: "I have an Aadhaar card."

  hi.a2.unit20.lesson01.teach.kendra:
    title: "Center"
    gloss: "center"
    note: "A new noun, masculine. Reused throughout this unit as *aadhaar kendra* (Aadhaar center)."
    example_gloss: "Where is the Aadhaar center?"

  hi.a2.unit20.lesson01.teach.mujhe_aadhaar_kendra_jaana_hai_phrase:
    title: "I need to go to the Aadhaar center"
    gloss: "I need to go to the Aadhaar center."
    note: "Reuses *jaana* (unit 9/15) with this lesson's new vocabulary."

  hi.a2.unit20.lesson01.teach.grammar_apna:
    title: "The reflexive possessive apna/apni/apne"
    gloss: "'Apna' is used for the subject's own thing, no matter who the subject is (I/you/he/she/we) -- it changes just like 'mera'/'tumhara': 'apna' (masc. sg.), 'apni' (fem.), 'apne' (plural or respect). In 'mujhe apna pata badalna hai', 'apna' agrees with 'pata' (masculine)."
    note: "This unit's first new grammar point, introduced ahead of the ne-ergative construction so that construction's own examples don't need two new grammar points at once."

  hi.a2.unit20.lesson02.teach.dastavez:
    title: "Document"
    gloss: "document"
    note: "A new noun, masculine."
    example_gloss: "I need documents."

  hi.a2.unit20.lesson02.teach.form:
    title: "Form"
    gloss: "form"
    note: "A new noun, masculine, borrowed from English."
    example_gloss: "Where is the form?"

  hi.a2.unit20.lesson02.teach.bharna:
    title: "To fill"
    gloss: "to fill (out)"
    note: "A new transitive verb, shown first as a bare infinitive (no *ne* needed yet) -- see this lesson's own grammar note for its past-tense form."
    example_gloss: "I need to fill out the form."

  hi.a2.unit20.lesson02.teach.mujhe_form_bharna_hai_phrase:
    title: "I need to fill out the form"
    gloss: "I need to fill out the form."
    note: "The infinitive form, before the past-tense *ne* construction is introduced on the very next card."

  hi.a2.unit20.lesson02.teach.grammar_ne_ergative:
    title: "The ne-ergative past tense"
    gloss: "A transitive verb's past tense (like 'bharna', 'laana') marks the subject with 'ne' -- e.g. 'maine form bhara.' Here the verb agrees with the OBJECT ('form', masculine singular), not the subject ('main'/I) -- so 'bhara', never 'bhari' or 'bhare'. Intransitive verbs (like 'jaana' -> 'gaya', unit 12) never take 'ne'."
    note: "This unit's central new grammar point -- the whole reason this unit exists at the A2 level. Genuinely new: unit 12's past tense only ever used intransitive verbs."

  hi.a2.unit20.lesson02.teach.maine_form_bhara_phrase:
    title: "I filled out the form"
    gloss: "I filled out the form."
    note: "The first live example of the *ne*-ergative construction just introduced."

  hi.a2.unit20.lesson02.teach.laana:
    title: "To bring"
    gloss: "to bring"
    note: "A second new transitive verb, reinforcing the *ne* construction. Irregular past participle: *laaya/laai/laaye*."
    example_gloss: "Did you bring the Aadhaar card?"

  hi.a2.unit20.lesson02.teach.aapne_aadhaar_card_laaya_phrase:
    title: "Did you bring the Aadhaar card?"
    gloss: "Did you bring the Aadhaar card?"
    note: "*Aapne* is the formal *aap* + *ne*, the same ergative marking applied to the formal pronoun."

  hi.a2.unit20.lesson02.teach.haan_review:
    title: "Review: yes"
    gloss: "yes"
    note: "Already-known plain *haan*, reused here for a formal-register reply (a separate, more formal *ji haan* exists in real Hindi but isn't part of this corpus yet)."
    example_gloss: "Yes, I brought the Aadhaar card."

  hi.a2.unit20.lesson02.teach.maine_pata_badla_phrase:
    title: "I changed my address"
    gloss: "I changed my address."
    note: "The ne-ergative past tense of *badalna* (to change) -- *badla* agrees with the masculine *pata*, reinforcing the same pattern as *maine form bhara*."

  hi.a2.unit20.lesson03.teach.aapko_review:
    title: "Review: to you (formal)"
    gloss: "to you (formal)"
    note: "The formal counterpart of *tumhein*, already known -- this unit's first formal-register official uses it."
    example_gloss: "What do you need?"

  hi.a2.unit20.lesson03.teach.arjun_priya_review:
    title: "Review: Arjun, Priya"
    gloss: "Arjun, Priya"
    note: "This course's two recurring characters, reviewed here since Arjun is named directly in this lesson's exercises for the first time this unit."
    example_gloss:
      - "Arjun went to the Aadhaar center."
      - "Priya went home."

  hi.a2.unit20.lesson03.teach.clerk:
    title: "Clerk"
    gloss: "clerk"
    note: "A new noun, this unit's stranger character -- doesn't change for gender, like *doctor*/*engineer* (unit 17)."
    example_gloss: "The clerk is in the office."

  hi.a2.unit20.lesson03.teach.gandhi_road_delhi:
    title: "Gandhi Road, Delhi"
    gloss: "Gandhi Road, Delhi"
    note: "A concrete street/city name for Arjun's new address, used in the dialogue and this lesson's closing speak_response exercise."
    example_gloss: "My address is Gandhi Road, Delhi."

  hi.a2.unit20.lesson03.teach.dialogue.line01:
    title: "The clerk greets Arjun"
    gloss: "Hello! What do you need?"
  hi.a2.unit20.lesson03.teach.dialogue.line02:
    title: "Arjun states his reason"
    gloss: "Hello! I need to change my address."
  hi.a2.unit20.lesson03.teach.dialogue.line03:
    title: "The clerk asks for the Aadhaar card"
    gloss: "OK. Did you bring the Aadhaar card?"
  hi.a2.unit20.lesson03.teach.dialogue.line04:
    title: "Arjun hands over his documents"
    gloss: "Yes, I brought the Aadhaar card. Here's the form -- I filled it out."
  hi.a2.unit20.lesson03.teach.dialogue.line05:
    title: "The clerk asks for the new address"
    gloss: "Very good. What's your new address?"
  hi.a2.unit20.lesson03.teach.dialogue.line06:
    title: "Arjun gives his new address"
    gloss: "My new address is Gandhi Road, Delhi."
  hi.a2.unit20.lesson03.teach.dialogue.line07:
    title: "The clerk confirms the change"
    gloss: "Thank you. I changed your address."
  hi.a2.unit20.lesson03.teach.dialogue.line08:
    title: "Arjun thanks the clerk"
    gloss: "Thank you very much!"

  hi.a2.unit20.lesson03.teach.grammar_summary:
    title: "Two main rules"
    gloss: "This unit's two main rules: (1) 'apna/apni/apne' is used for the subject's own thing, changing just like 'mera/tumhara'. (2) In the past tense, a transitive verb's subject takes 'ne', and the verb agrees with the object, not the subject -- 'maine form bhara', 'maine aapka pata badla'."
    note: "A closing summary tying the whole unit's grammar together."

  hi.a2.unit20.lesson03.teach.reading:
    title: "Reading about Arjun's visit"
    gloss: "Arjun went to the Aadhaar center. Arjun brought the Aadhaar card and the form. The clerk changed Arjun's address. Arjun was very happy."
    note: "A short, direct profile restating exactly the facts already established in the dialogue -- directly serves this outcome's own 'read a short official notice' requirement, using Arjun's name instead of a third-person possessive pronoun (not yet taught anywhere in this corpus)."

