answer_policy:
  habitual_condition: >-
    "*Agar* [general/habitual fact], *to* [its usual result]" uses the
    habitual PRESENT tense in both clauses to state a general truth or
    habit, distinct from the future-tense "*agar baarish hogi*" pattern
    from an earlier unit. "*Pahunchta*" (masc.) and "*pahunchti*" (fem.)
    agree with the subject's gender.
  negated_condition: >-
    "if not" is formed by placing the negator *nahin* directly before the
    verb inside the *agar*-clause, never right after *agar* itself:
    "*agar baarish nahin hogi*..." (if it will not rain...), not "*agar
    nahin baarish hogi*."
  planning_dialogue: >-
    Arjun and Priya's Saturday-planning exchange covers all three
    variants together: an affirmative real condition ("*agar mausam
    accha hoga*..."), its opposite affirmative branch ("*agar baarish
    hogi*..."), and the negated branch ("*agar baarish nahin hogi*...").
  punctuation: >-
    Hindi text is shown with the traditional danda (।) as the
    sentence-final mark. In typed answers, accept the danda, a plain
    period (.), or the mark omitted entirely as equivalent. Internal
    commas separating clauses may also be replaced by " and " (और) or
    omitted with a space where noted per exercise.
  spoken_answers: >-
    Judge spoken responses by intelligibility rather than written
    punctuation.

