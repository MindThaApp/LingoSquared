    feedback: 'Nina says: *हमें दो स्कूप चाहिए।* *चाहिए* says what is wanted, and the person who wants takes the *हमें* form ("to us"), so Hindi says "two scoops are wanted by us".'
  hi.a1.unit66.lesson05.exercise02.comprehend_chalees_rupye_hue:
    instruction: Listen to the dialogue and choose how much two scoops cost.
