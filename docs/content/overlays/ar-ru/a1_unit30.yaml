  ru.a1.unit30.lesson06.teach.nastya_ya_vizhu:
    title: ناستيا تؤكد الخطة
    gloss: 'ناستيا: أرى الرسالة. هل نمارس الرياضة يوم السبت في العاشرة في الحديقة؟'
  ru.a1.unit30.lesson06.teach.dima_da_i:
    title: ديما يؤكد حالة الطقس
    gloss: 'ديما: نعم، والجو مشمس يوم السبت أيضًا!'
  ru.a1.unit30.lesson06.teach.igor_ya_togda:
    title: خطة إيغور
    gloss: 'إيغور: سأركض إذن. وبعد ذلك سألعب كرة القدم أيضًا.'
    note: '*Потом* (بعد ذلك) تضع الخطة الثانية بعد الأولى، و*побегаю* فعل تام: «سأركض قليلًا».'
  ru.a1.unit30.lesson06.teach.lena_ya_luchshe:
    title: خطة لينا
    gloss: 'لينا: أفضّل السباحة، لكنني سآتي إلى الحديقة أيضًا.'
    note: '*Я лучше поплаваю* تعني «الأفضل أن أسبح» أي «أفضّل أن أسبح». و*лучше* قبل الفعل تعبّر عن التفضيل.'
  ru.a1.unit30.lesson06.teach.nastya_zdorovo_do:
    title: ناستيا تنهي الحديث
    gloss: 'ناستيا: رائع! إلى اللقاء يوم السبت في الحديقة!'
    note: تُنهي في سطر واحد سلسلة الرسائل في هذه الوحدة وخطة وحدة الرياضة.
