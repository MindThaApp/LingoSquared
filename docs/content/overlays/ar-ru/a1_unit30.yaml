  ru.a1.unit30.lesson02.teach.prognoz_pogody_slovo:
    title: Прогноз погоды وكلمة сообщение
    gloss: '*Прогноз погоды* كلمتان، والثانية *погоды* في حالة الإضافة (المضاف إليه)، كما في المضاف إليه بالعربية. أما *Сообщение* فهي رسالة يمكنك إرسالها أو قراءتها.'
    note: تربط الكلمة الجديدة بالاسم المركب الذي تعلمته في وحدة الطقس.
  ru.a1.unit30.lesson02.teach.nastya_otpravlyaet_soobshchenie:
