  ru.a1.unit30.lesson04.teach.nastya_davay_v:
    title: ناستيا تقترح
    gloss: 'ناستيا: هل نمارس الرياضة يوم السبت في العاشرة؟'
  ru.a1.unit30.lesson04.teach.dima_khoroshaya_ideya:
    title: ديما يوافق
    gloss: 'ديما: فكرة جيدة! سأبحث عن توقعات الطقس.'
    note: '*Хорошая идея*: الصفة مؤنثة لأن الاسم مؤنث. و*Поищу* مستقبل تام (التام)، أي «سأبحث».'
  ru.a1.unit30.lesson04.teach.dima_v_subbotu:
    title: ديما يتحقق من الطقس
    gloss: 'ديما: الجو مشمس يوم السبت!'
    note: '*Солнечно* كلمة للحديث عن الطقس. لا حاجة إلى فعل «يكون»: *В субботу солнечно*.'
  ru.a1.unit30.lesson04.teach.igor_ya_vizhu:
    title: إيغور يرى الرسالة
    gloss: 'إيغور: أرى الرسالة. أراك يوم السبت!'
  ru.a1.unit30.lesson04.teach.ty_uzhe_znaesh:
    title: До مع حالة الإضافة
    gloss: 'أنت تعرف *До свидания!* ويمكنك أيضًا ذكر اليوم: *До субботы!*، *До завтра!* بعد *до* يأتي الاسم في حالة الإضافة (المضاف إليه).'
    note: توسّع نمط التوديع من وحدة التحيات ليشمل يومًا محددًا.
  ru.a1.unit30.lesson05.teach.nastya_kazhdyy_den:
    title: من يستخدم ماذا؟
    gloss: ناستيا تتصل بديما كل يوم. تستخدم الهاتف لا التطبيق. ليس لدى ديما حاسوب في البيت، لكنه يستخدم الإنترنت على هاتفه. إيغور يبحث كل صباح عن توقعات الطقس. ثم يذهب للجري. لينا ترسل إلى ناستيا رسالة في كثير من الأحيان. وأنت، هل تستخدم هاتفك كل يوم أيضًا؟
    note: تقارن عادات الشخصيات الأربع في استخدام الأجهزة، على غرار قراءة المقارنة في وحدة الرياضة.
