    gloss: يتطلب *Пользоваться* حالة الأداة (حالة الأداة) مثل *пользоваться телефоном*، بينما يتطلب *искать* حالة النصب (المفعول به) مثل *искать прогноз*.
    note: 'كلا الفعلين منتظم: *я пользуюсь, ты пользуешься*؛ *я ищу, ты ищешь*.'
