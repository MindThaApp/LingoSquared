    example_gloss: تعمل النادلة في مطعم.
  ru.a1.unit07.lesson01.teach.stol_svoboden:
    title: Этот столик свободен?
    gloss: هل هذه الطاولة شاغرة؟
    note: столик تصغير لكلمة стол («طاولة») ويشيع استخدامه لطاولة المطعم؛ وсвободен («شاغر/فارغ») يتوافق مع الاسم المذكّر.
  ru.a1.unit07.lesson01.teach.da_saditites:
    title: Да, садитесь, пожалуйста.
    gloss: نعم، تفضّلوا بالجلوس من فضلكم.
    note: садитесь صيغة الأمر للمخاطب المحترم أو للجمع من садиться («جلس»)، وتُستخدم مع вы.
  ru.a1.unit07.lesson01.teach.chto_budete_zakazyvat:
    title: Что будете заказывать?
    gloss: ماذا ستطلبون؟
    note: будете заказывать عبارة بصيغة المستقبل («ستطلبون») يستخدمها النادل ليسأل الزبون عمّا يريد.
  ru.a1.unit07.lesson02.teach.ya_khochu:
    title: Я хочу ...
    gloss: أريد ...
    note: хочу صيغة المتكلم المفرد من الفعل хотеть («أراد»)، وتُستخدم لطلب الطعام والشراب.
  ru.a1.unit07.lesson02.teach.chay_kofe:
    title: чай, кофе
    gloss: شاي، قهوة
    note: чай وкофе من المشروبات الشائعة الطلب؛ وкофе لا يتصرف وهو مذكّر نحويًا رغم نهايته بـ -е.
    example_gloss:
    - أريد شايًا.
    - أريد قهوة.
  ru.a1.unit07.lesson02.teach.khleb_borshch:
