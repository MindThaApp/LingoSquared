    gloss: هذا ...
    note: تُستخدم Это للتعريف بشخص أو شيء أو الإشارة إليه، بغض النظر عن جنسه النحوي.
  ru.a1.unit06.lesson01.teach.mat_otets:
    title: мать, отец
    gloss: أم، أب
    note: мать من القلة القليلة من الأسماء المؤنثة في الروسية التي تنتهي بالياء الناعمة (-ь).
    example_gloss:
    - هذه أمي.
    - هذا أبي.
  ru.a1.unit06.lesson01.teach.brat_sestra:
    title: брат, сестра
    gloss: أخ، أخت
    note: брат هي الكلمة نفسها التي عددتَ بها في الوحدة 3 ("У меня два брата")؛ أما сестра فهي مقابلها المؤنث.
    example_gloss:
    - هذا أخي.
    - لدي أخت.
  ru.a1.unit06.lesson01.teach.moy_moya:
    title: мой, моя
    gloss: my (مذكر)، my (مؤنث)
    note: تُستخدم мой مع الأسماء المذكرة مثل отец وbрат، وتُستخدم моя مع الأسماء المؤنثة مثل мать وсестра.
  ru.a1.unit06.lesson02.teach.babushka_dedushka:
    title: бабушка, дедушка
    gloss: جدة، جد
    note: 'كلتاهما تنتهي بـ -а، لكن дедушка يدل على رجل ويتفق معه ما يصفه كمذكر: мой дедушка، لكن моя бабушка.'
    example_gloss:
    - هذه جدّتي.
    - هذا جدّي.
  ru.a1.unit06.lesson02.teach.muzh_zhena:
    title: муж, жена
    gloss: زوج، زوجة
    note: муж مذكر وжена مؤنث، وفق النمط المعتاد لنهايات الأسماء بحسب الجنس.
    example_gloss:
    - هذا زوجي.
    - هذه زوجتي.
  ru.a1.unit06.lesson02.teach.syn_doch:
    title: сын, дочь
    gloss: ابن، ابنة
    note: дочь، مثل мать، اسم مؤنث ينتهي بالياء الناعمة (-ь).
    example_gloss: لديّ ابن وابنة.
  ru.a1.unit06.lesson02.teach.deti:
    title: дети
    gloss: أطفال
    note: дети جمع شاذ للكلمة ребёнок ("طفل")، فالمفرد والجمع كلمتان مختلفتان تمامًا.
    example_gloss: هل لديكم أطفال؟
  ru.a1.unit06.lesson02.teach.u_vas_est:
    title: У вас есть ...?
    gloss: هل لديكم ...؟ (رسمي)
    note: تستخدم вас الدالّة على الاحترام، بما يوافق صيغة вы التي مرّت في الوحدة 2.
  ru.a1.unit06.lesson03.teach.kto_eto:
    title: Кто это?
    gloss: من هذا؟
    note: الطريقة المعتادة للسؤال عن هوية شخص، مثلًا عند النظر إلى صورة.
  ru.a1.unit06.lesson03.teach.eyo_zovut:
    title: Её зовут Анна.
    gloss: اسمها آنا.
    note: 'حرفيًا: "يسمّونها آنا" — الضمير Её ("ها") مفعول به للفعل зовут وليس فاعلًا.'
