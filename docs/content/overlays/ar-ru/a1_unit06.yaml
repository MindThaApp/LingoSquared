    title: أولغا تذكر ثلاثة من أفراد عائلتها
    gloss: 'أولغا: هذا أبي، وهذه أمي، وهذا أخي.'
    note: تمهّد Вот ("هنا / هذا هو") للقائمة؛ وكل ضمير ملكية (мой/моя) يتفق مع الاسم الذي بعده.
  ru.a1.unit06.lesson03.teach.maksim_a_kto_devochka:
    title: مكسيم يسأل عن الفتاة
    gloss: 'مكسيم: ومن هذه الفتاة؟'
    note: تصل А سؤال مكسيم التالي بالكلام السابق، وهو عن شخص رابع في الصورة.
  ru.a1.unit06.lesson03.teach.olga_eto_moya_doch:
    title: أولغا تذكر اسم ابنتها
    gloss: 'أولغا: هذه ابنتي. اسمها آنا.'
    note: تجيب أولغا بـ моя дочь ثم تذكر الاسم بـ Её зовут Анна.
