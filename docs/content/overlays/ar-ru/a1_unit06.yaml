teaching:
  ru.a1.unit06.lesson01.teach.u_menya_est:
    title: У меня есть ...
    gloss: لديّ ...
    note: 'حرفيًا: "عندي (يوجد) ..." وهي الطريقة الروسية المعتادة للتعبير عن الملكية. استخدمت الوحدة 3 التركيب نفسه في У меня два брата؛ وغالبًا ما تُحذف есть عندما يدور الكلام على عدد ما لديك.'
  ru.a1.unit06.lesson01.teach.eto:
