    title: مكسيم يسأل عن الصورة
    gloss: 'مكسيم: من هذا في الصورة؟'
    note: 'يبدأ مكسيم بالإشارة إلى الصورة ويسأل: Кто это на фото?'
  ru.a1.unit06.lesson03.teach.olga_moya_semya:
    title: أولغا تقدّم عائلتها
    gloss: 'أولغا: هذه عائلتي.'
    note: في Это моя семья الكلمة семья ("عائلة") اسم مؤنث، لذلك تتفق معه моя.
