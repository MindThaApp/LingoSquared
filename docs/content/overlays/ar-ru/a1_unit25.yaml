teaching:
  ru.a1.unit25.lesson01.teach.chitat_zanimatsya_sportom:
    title: القراءة، ممارسة الرياضة، الطبخ
    gloss: يقرأ، يمارس الرياضة، يطبخ
    note: 'ثلاثة أفعال شائعة للهوايات: *читать* (يقرأ)، و*заниматься спортом* (يمارس الرياضة)، و*готовить* (يطبخ).'
    example_gloss:
    - أحب قراءة كتاب.
    - أمارس الرياضة أيام السبت.
    - أحب الطبخ للأصدقاء.
  ru.a1.unit25.lesson01.teach.svobodnoe_vremya:
    title: وقت الفراغ
    gloss: وقت الفراغ
    note: '*Свободное время* عبارة أساسية للحديث عن الهوايات. تنتهي الصفة *свободное* بـ *-ое* لتتفق مع *время*.'
    example_gloss: في وقت فراغي، أحب القراءة.
  ru.a1.unit25.lesson01.teach.v_svobodnoe_vremya:
    title: قول ما تفعله في وقت فراغك
    gloss: في وقت فراغي، أحب القراءة.
    note: '*Люблю* هي صيغة *я* من الفعل *любить* (يحب). وبعدها يبقى الفعل الثاني في المصدر: *люблю читать*.'
  ru.a1.unit25.lesson02.teach.slushat_muzyku_risovat:
    title: الموسيقى، الرسم، ألعاب الفيديو
    gloss: يستمع إلى الموسيقى، يرسم، يلعب ألعاب الفيديو
    note: 'ثلاث هوايات أخرى: *слушать музыку* (يستمع إلى الموسيقى)، و*рисовать* (يرسم)، و*играть в игры* (يلعب الألعاب).'
    example_gloss:
    - أحب الاستماع إلى الموسيقى.
    - أرسم كثيرًا.
    - أحب لعب ألعاب الفيديو مع الأصدقاء.
  ru.a1.unit25.lesson02.teach.ya_lyublyu_slushat:
    title: قول إنك تحب الاستماع إلى الموسيقى
    gloss: أحب الاستماع إلى الموسيقى.
    note: 'يأخذ الفعل *слушать* مفعوله مباشرةً: *музыку* هي المنصوب من *музыка*، بالنهاية *-у*.'
  ru.a1.unit25.lesson02.teach.ya_lyublyu_igrat:
    title: قول إنك تحب لعب ألعاب الفيديو مع الأصدقاء
    gloss: أحب لعب ألعاب الفيديو مع الأصدقاء.
    note: '*С друзьями* (مع الأصدقاء): تأتي بعد حرف الجر *с* الحالة الأداتية، ومن هنا *друзьями*.'
  ru.a1.unit25.lesson03.teach.vsegda_chasto_inogda:
    title: دائمًا، غالبًا، أحيانًا، أبدًا
    gloss: دائمًا، غالبًا، أحيانًا، أبدًا
    note: 'أربعة ظروف أساسية للتكرار: *всегда*، *часто*، *иногда*، *никогда*. وهي لا تتغير صيغتها أبدًا.'
    example_gloss:
    - أمارس الرياضة دائمًا أيام السبت.
    - غالبًا ما أقرأ كتابًا.
    - أرسم أحيانًا.
    - لا ألعب ألعاب الفيديو أبدًا.
  ru.a1.unit25.lesson03.teach.kazhduyu_nedelyu_kazhdye:
    title: كل أسبوع، كل عطلة أسبوع
    gloss: كل أسبوع، كل عطلة أسبوع
    note: '*Каждую неделю* و*каждые выходные* كلتاهما تعني «كل»، لكن النهاية تتبع الاسم: انظر البطاقة التالية.'
    example_gloss:
    - أطبخ للأصدقاء كل أسبوع.
    - أمارس الرياضة كل عطلة أسبوع.
  ru.a1.unit25.lesson03.teach.nedelya_zhenskogo_roda:
    title: '«كل»: المؤنث والجمع'
    gloss: '*Неделя* مؤنثة، لذا تأتي *каждую неделю*. و*Выходные* جمع، لذا تأتي *каждые выходные*.'
    note: 'يتفق *Каждый* مع اسمه كأي صفة: *каждый день* (مذكر)، *каждую неделю* (مؤنث، منصوب)، *каждые выходные* (جمع).'
  ru.a1.unit25.lesson03.teach.chto_ty_delaesh:
    title: السؤال عن وقت الفراغ
    gloss: ماذا تفعل في وقت فراغك؟
    note: هذا هو السؤال الأساسي في هذه الوحدة، استخدمه لتسأل أي شخص عن هواياته.
  ru.a1.unit25.lesson04.teach.nastya_my_chasto:
    title: ناستيا تفتح موضوع الهوايات
    gloss: 'ناستيا: نتمشى معًا كثيرًا. ولكن ماذا تفعل أيضًا في وقت فراغك يا ديما؟'
    note: '*Мы часто гуляем вместе*: مع *мы* (نحن) تأخذ الأفعال النهاية *-ем*، ويعني *гулять* التمشي للمتعة.'
  ru.a1.unit25.lesson04.teach.dima_ya_lyublyu:
    title: هوايات ديما
    gloss: 'ديما: أحب الطبخ، وفي البيت أيضًا. وأمارس الرياضة كثيرًا.'
    note: '*И дома тоже* (وفي البيت أيضًا): التركيب *и ... тоже* يبيّن أن ديما يطبخ للمتعة، لا في العمل فحسب.'
  ru.a1.unit25.lesson04.teach.nastya_ty_i:
    title: ناستيا مندهشة
    gloss: 'ناستيا: أتطبخ في البيت أيضًا؟ أنت تطبخ طوال اليوم في عملك أصلًا!'
    note: تؤكد عبارة *Весь день* (طوال اليوم) كم يطبخ ديما أصلًا في العمل. وتتفق *Весь* مع الاسم المذكّر *день*.
  ru.a1.unit25.lesson04.teach.dima_da_no:
    title: ديما يشرح
    gloss: 'ديما: نعم، لكنّ الطبخ يريحني. وأنتِ، ماذا تحبين أن تفعلي؟'
    note: 'تضع جملة *Готовить меня расслабляет* النشاط في البداية: حرفيًا «الطبخ يريحني»، وتأتي *меня* في حالة المفعول به (винительный).'
  ru.a1.unit25.lesson04.teach.nastya_ya_lyublyu:
    title: هوايات ناستيا
    gloss: 'ناستيا: أحب القراءة وأستمع إلى الموسيقى كثيرًا.'
    note: 'يُربط فعلا هواية من الدروس السابقة بالحرف *и* (و): *люблю читать и часто слушаю музыку*.'
  ru.a1.unit25.lesson04.teach.dima_ty_tozhe:
    title: ديما يسأل عن الألعاب
    gloss: 'ديما: هل تلعبين الألعاب أنتِ أيضًا؟'
    note: 'سؤال قصير جوابه نعم أو لا: تبقى الكلمات في ترتيبها في الروسية ولا تتغير إلا نبرة الصوت التي ترتفع: *Ты тоже играешь в игры?*'
  ru.a1.unit25.lesson04.teach.nastya_net_ya:
    title: ناستيا تجيب
    gloss: 'ناستيا: لا، أنا لا ألعب الألعاب أبدًا. لكنني أرسم أحيانًا!'
    note: تتطلب *Никогда не* (أبدًا) وجود *не* إضافية قبل الفعل. أما *Иногда* (أحيانًا) فهي المقابل.
  ru.a1.unit25.lesson05.teach.my_s_dimoy:
    title: مقارنة الهوايات
    gloss: أنا وديما نتمشى معًا كثيرًا. لكن لدينا هوايات أخرى أيضًا. ديما يحب الطبخ، في البيت أيضًا، ويمارس الرياضة كثيرًا. أنا أحب القراءة وأستمع إلى الموسيقى كثيرًا. أرسم أحيانًا، لكنني لا ألعب الألعاب أبدًا. ماذا تحب أن تفعل في وقت فراغك؟
    note: تلخّص رسالة ناستيا معلومات من الدرس الرابع وتنتهي بسؤال القارئ السؤال الأساسي في هذه الوحدة.
    glosses:
      гуляем: يتنزه
      часто: غالبًا
      вместе: معًا
      другие: أخرى
      готовить: يطبخ
      любит: يحب
      дома: في البيت
      занимается: يمارس الرياضة
      читать: القراءة
      слушаю: أستمع
      музыку: موسيقى
      рисую: أرسم
      иногда: أحيانًا
      играю: ألعب ألعاب الفيديو
      никогда: أبدًا
      свободное: فراغ
      время: وقت
  ru.a1.unit25.lesson06.teach.dima_chto_ty:
    title: ديما يسأل عن عطلة نهاية الأسبوع
    gloss: 'ديما: ماذا ستفعلين في عطلة نهاية الأسبوع هذه؟'
    note: '*В эти выходные* (في عطلة نهاية الأسبوع هذه): الكلمة *выходные* جمع، لذا تأتي *эти* جمعًا أيضًا، ويتبع *в* مع الوقت حالة المفعول به (винительный).'
  ru.a1.unit25.lesson06.teach.nastya_poka_ne:
    title: ناستيا لم تقرّر بعد
    gloss: 'ناستيا: لا أعرف بعد. أحب القراءة، لكنني أريد أيضًا أن أخرج إلى الشارع.'
    note: تعني *Хочу ещё выйти на улицу* «أريد أيضًا أن أخرج إلى الشارع». و*Хочу* هي صيغة المتكلم *я* من الفعل *хотеть*.
  ru.a1.unit25.lesson06.teach.dima_davay_pogulyaem:
    title: ديما يقترح خطة
    gloss: 'ديما: هيا نتمشى معًا؟ وبعد ذلك أطبخ لنا طعامًا.'
    note: '*Давай погуляем* هي الطريقة المعتادة لاقتراح فعل شيء معًا، و*потом* (بعد ذلك) ترتّب الخطوة التالية.'
  ru.a1.unit25.lesson06.teach.nastya_khoroshaya_ideya:
    title: ناستيا توافق
    gloss: 'ناستيا: فكرة جيدة! أحب المشي والطبخ كليهما.'
    note: 'تعني *Мне нравится* حرفيًا «لي يُعجب»: يأتي الشخص في حالة الجر بـ«إلى» (дательный) وهي *мне*، ويليه الشيء المحبوب.'
  ru.a1.unit25.lesson06.teach.dima_otlichno_togda:
    title: ديما يؤكد الموعد
    gloss: 'ديما: ممتاز. إذن نلتقي يوم السبت!'
    note: '*Увидимся в субботу* (نلتقي يوم السبت): يتبع *в* مع أيام الأسبوع حالة المفعول به (винительный)، فتصبح *суббота* هكذا *субботу*.'
