    gloss: الساعة الآن الواحدة.
    note: كلمة «час» وحدها تعني «الساعة الواحدة»؛ فلا تقول الروسية «один час» هنا، بخلاف نمط الأعداد من اثنين فما فوق.
    example_gloss: كم الساعة؟ — الساعة الواحدة.
  ru.a1.unit05.lesson01.teach.dva_tri_chasa:
    title: два часа, три часа
