    gloss: الساعة الخامسة، الساعة العاشرة
    note: ابتداءً من пять فما فوق تأتي كلمة час بصيغة الجمع المجرور часов، وفق نمط الوحدة 3 للعدد خمسة فأكثر.
    example_gloss:
    - الساعة الآن الخامسة.
    - الساعة الآن العاشرة.
