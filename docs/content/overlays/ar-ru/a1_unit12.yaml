teaching:
  ru.a1.unit12.lesson01.teach.davay:
    title: Давай пойдём...
    gloss: هيا نذهب...
    note: «Давай» أداة اقتراح غير رسمية بمعنى «هيا»، و«пойдём» صيغة المتكلمين («نحن») من فعل «يذهب»، وتُستعملان معًا لاقتراح نشاط.
  ru.a1.unit12.lesson01.teach.kino:
    title: кино
    gloss: السينما
    note: «кино» اسم محايد (مذكر/مؤنث لا ينطبق) غير متصرّف، أي لا يتغير شكله، ويعني «السينما».
    example_gloss: هيا نذهب إلى السينما.
  ru.a1.unit12.lesson01.teach.zavtra_subbotu:
    title: завтра, в субботу
    gloss: غدًا، يوم السبت
    note: «завтра» تعني «غدًا»؛ وفي «в субботу» تُستعمل в مع المفعول به (الأكوزاتيف) للدلالة على يوم من أيام الأسبوع.
    example_gloss: هيا نذهب إلى السينما غدًا.
  ru.a1.unit12.lesson02.teach.soglasen:
    title: Хорошо, я согласен.
    gloss: حسنًا، أنا موافق.
    note: يقول الرجل «согласен» (موافق)، وتقول المرأة «согласна».
  ru.a1.unit12.lesson02.teach.ne_mogu:
    title: К сожалению, я не могу.
    gloss: للأسف، لا أستطيع.
    note: «К сожалению» («للأسف») تخفف وقع الرفض، و«не могу» تعني «لا أستطيع».
  ru.a1.unit12.lesson02.teach.vo_skolko:
    title: Во сколько мы встретимся?
    gloss: في أي ساعة سنلتقي؟
    note: «Во сколько» تسأل عن الساعة، و«встретимся» صيغة «نحن» المستقبلية من فعل «يلتقي».
    example_gloss: لنقل في الساعة السابعة.
  ru.a1.unit12.lesson03.teach.nastya_davay_poydyom:
    title: ناستيا تقترح خطة
    gloss: 'ناستيا: هيا نذهب إلى السينما يوم السبت.'
    note: 'تبدأ Настя بقولها: Давай пойдём в кино в субботу.'
  ru.a1.unit12.lesson03.teach.dima_horosho_soglasen:
    title: ديما يوافق ويسأل عن الموعد
    gloss: 'ديما: حسنًا، أنا موافق. في أي ساعة سنلتقي؟'
    note: 'يوافق Дима، ثم يسأل: Во сколько мы встретимся?'
  ru.a1.unit12.lesson03.teach.nastya_davay_v_sem:
    title: ناستيا تقترح الوقت والمكان
    gloss: 'ناستيا: لنتفق على الساعة السابعة، عند السينما.'
    note: تعني у кинотеатра «عند السينما / بجانبها»، وتُستخدم у مع المجرور (حالة المضاف إليه).
  ru.a1.unit12.lesson03.teach.dima_otlichno:
    title: ديما يؤكد الموعد
    gloss: 'ديما: ممتاز، إلى اللقاء يوم السبت.'
    note: 'تُختتم بها المحادثة: Отлично, до субботы؛ وдо субботы تعني حرفيًا «حتى السبت».'
