  ru.a1.unit27.lesson01.teach.zhivotnoe_domashnee_zhivotnoe:
    title: حيوان، حيوان أليف
    gloss: الحيوان / الحيوان الأليف
    note: '*Животное* هي الكلمة العامة لـ«حيوان». أما *Домашнее животное* (حرفيًا «حيوان منزلي») فتعني تحديدًا الحيوان الأليف.'
    example_gloss:
    - الكلب حيوان.
    - الكلب أيضًا حيوان أليف.
  ru.a1.unit27.lesson01.teach.sobaka_koshka:
