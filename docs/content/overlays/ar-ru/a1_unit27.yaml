    - لدى إيغور قطة.
  ru.a1.unit27.lesson01.teach.ryba_ptitsa:
    title: السمكة والطائر
    gloss: السمكة / الطائر
    example_gloss:
    - لدى الجد سمكة.
    - لدى Nina طائر.
  ru.a1.unit27.lesson01.teach.u_tebya_est:
    title: هل لديك حيوان أليف؟
    gloss: هل لديك حيوان أليف؟
    note: '*У тебя есть ...?* هو سؤال «هل لديك ...؟»: *у тебя* («عندك») + *есть* + الشيء.'
  ru.a1.unit27.lesson01.teach.da_u_menya:
    title: نعم، لدي كلب
    gloss: نعم، لدي كلب.
    note: إجابة بسيطة بالإيجاب باستخدام مفردات هذه الوحدة الجديدة.
  ru.a1.unit27.lesson01.teach.net_u_menya:
    title: لا، ليس لدي حيوان أليف
    gloss: لا، ليس لدي حيوان أليف.
    note: '*Нет* + حالة الجر (родительный) تعني أنك لا تملك شيئًا: *у меня нет домашнего животного*. راجع ملاحظة القواعد.'
  ru.a1.unit27.lesson01.teach.posle_net_slovo:
    title: нет مع حالة الجر
    gloss: 'بعد *нет* يأتي الشيء المفقود في حالة الجر (родительный): *у меня нет времени*، *у меня нет домашнего животного*.'
    note: 'قارن بالإثبات: *у меня есть собака* (حالة الرفع/الاسم) لكن *у меня нет собаки* (حالة الجر).'
  ru.a1.unit27.lesson02.teach.gulyat_s_sobakoy:
    title: يُخرج حيوانًا للتنزه
    gloss: يُخرج (حيوانًا) للتنزه
    note: '*Гулять с собакой* تستخدم *с* مع حالة الأداة (творительный)، *собакой*. راجع ملاحظة القواعد.'
    example_gloss: أُخرج الكلب للتنزه كل يوم.
  ru.a1.unit27.lesson02.teach.posle_s_slovo:
    title: с مع حالة الأداة
    gloss: 'بعد *с* (مع) يأتي الاسم في حالة الأداة (творительный): *гулять с собакой*، *играть с кошкой*.'
    note: 'تنتهي الأسماء المؤنثة في حالة الأداة بـ *-ой* أو *-ей*: *собакой*، *кошкой*.'
  ru.a1.unit27.lesson02.teach.kormit:
    title: يُطعم
    gloss: يُطعم
    example_gloss: أُطعم القط كل يوم.
  ru.a1.unit27.lesson02.teach.igrat_s:
    title: يلعب مع
    gloss: يلعب مع
    example_gloss: يلعب إيغور مع قطته.
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den:
    title: أُخرج الكلب للتنزه كل يوم
    gloss: أُخرج الكلب للتنزه كل يوم.
    note: '*Каждый день* (كل يوم) تعبير زمني بلا حرف جر: *Я каждый день гуляю с собакой*.'
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den_2:
    title: أُطعم القط كل يوم
    gloss: أُطعم القط كل يوم.
    note: 'يأخذ الفعل *Кормить* الحيوان مفعولًا به مباشرًا في حالة النصب (винительный): تصبح *кошка* ← *кошку*.'
  ru.a1.unit27.lesson03.teach.posle_lyubit_zhivotnoe:
    title: الحيوانات بعد любить
    gloss: 'بعد *любить* يأتي اسم الحيوان في حالة النصب (винительный)، وهي في الجمع للأسماء الحية مثل حالة الجر: *собак*، *кошек*، *птиц*، *рыб*.'
    note: نمط الجمع الروسي المنتظم، يُقدَّم هنا لأول مرة بأسماء الحيوانات مثالًا.
  ru.a1.unit27.lesson03.teach.sobak_koshek:
    title: الكلاب والقطط
    gloss: كلاب / قطط
    example_gloss:
    - ديما يحب الكلاب.
    - تحب Lena القطط.
  ru.a1.unit27.lesson03.teach.ryb_ptits:
    title: الأسماك والطيور (جمع)
    gloss: أسماك / طيور
    example_gloss:
    - أحب الأسماك.
    - يحب الجد الطيور.
  ru.a1.unit27.lesson03.teach.ya_lyublyu_zhivotnykh:
    title: أحب الحيوانات
    gloss: أحب الحيوانات.
    note: '*Люблю* + حالة النصب: *Я люблю животных*. في جمع الأسماء الحية تشبه حالة النصب حالة الجر.'
  ru.a1.unit27.lesson03.teach.lena_lyubit_koshek:
    title: Lena تحب القطط، لكن ليس لديها حيوان أليف
    gloss: Lena تحب القطط، لكن ليس لديها حيوان أليف.
