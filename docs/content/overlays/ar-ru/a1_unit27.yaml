  ru.a1.unit27.lesson04.teach.dima_u_tebya:
    title: ديما يسأل عن حيوان أليف
    gloss: 'ديما: هل لديكِ حيوان أليف يا ناستيا؟'
  ru.a1.unit27.lesson04.teach.nastya_da_u:
    title: لدى ناستيا كلب
    gloss: 'ناستيا: نعم، لديّ كلب.'
  ru.a1.unit27.lesson04.teach.dima_kak_on:
    title: ديما يسأل عن شكله
    gloss: 'ديما: كيف يبدو؟'
    note: السؤال *Как он выглядит?* يصلح للحيوانات أيضًا. و*Он* (هو) يُستخدم للحيوان الأليف الذكر.
  ru.a1.unit27.lesson04.teach.nastya_u_nego:
    title: ناستيا تصف كلبها
    gloss: 'ناستيا: فروه بني وهو صغير.'
    note: يعيد مفردات لون الشعر والحجم من وحدة المظهر، وهنا لوصف فرو حيوان بدل شعر شخص.
  ru.a1.unit27.lesson04.teach.o_zhivotnom_mozhno:
    title: «он» و«она» مع الحيوانات
    gloss: 'يمكن وصف الحيوان الأليف بـ *он* أو *она* كما يُوصف الإنسان: *У меня собака, он маленький* (عندي كلب، وهو صغير).'
    note: كلمة *собака* مؤنثة نحويًا، لكن الروس كثيرًا ما يقولون *он* حين يعرفون أن الحيوان ذكر.
  ru.a1.unit27.lesson04.teach.dima_ty_gulyaesh:
    title: ديما يسأل عن المشي
    gloss: 'ديما: هل تتمشى معه كل يوم؟'
  ru.a1.unit27.lesson04.teach.nastya_da_ya:
    title: ناستيا تصف روتينها
    gloss: 'ناستيا: نعم، أتمشى معه كل يوم وأطعمه.'
  ru.a1.unit27.lesson05.teach.dima_i_lena:
    title: ديما ولينا وإيغور والحيوانات
    gloss: 'ديما ولينا كلاهما يحب الحيوانات، لكن ليس لدى أي منهما حيوان أليف. ديما يحب الكلاب ولينا تحب القطط. أما إيغور فلديه حيوان أليف: قطة. يلعب كثيرًا مع قطته ويعطيها الطعام كل يوم. هل لديك حيوان أليف؟'
    note: يقابل بين حب الحيوان وامتلاكه فعلًا، وهذا هو الهدف التواصلي للوحدة.
    glosses:
      любят: يحب
      оба: كلاهما
      животных: حيوانات
      обоих: كلاهما
      домашнего: حيوان أليف
      собак: كلاب
      кошек: قطط
      кошка: قط
      играет: يلعب
      даёт: يعطي
      каждый: كل
      корм: طعام
  ru.a1.unit27.lesson05.teach.igor_chasto_igraet:
    title: إيغور يلعب كثيرًا مع قطته
    gloss: إيغور يلعب كثيرًا مع قطته.
    note: '*Со своей кошкой*: تصبح *с* إلى *со* قبل تجمّع من الحروف الساكنة، و*своей* تعني «الخاصة به» وتعود على فاعل الجملة.'
  ru.a1.unit27.lesson05.teach.ya_lyublyu_sobak:
    title: أحب الكلاب. ليس لدي حيوان أليف.
    gloss: أحب الكلاب. ليس لدي حيوان أليف.
    note: إجابة نموذجية من جملتين، جاهزة لإعادة استعمالها في مهمة الكتابة في الوحدة.
  ru.a1.unit27.lesson06.teach.nastya_nina_u:
    title: ناستيا تسأل نينا
    gloss: 'ناستيا: نينا، هل لديكِ أنتِ أيضًا حيوان أليف؟'
  ru.a1.unit27.lesson06.teach.nina_da_u:
    title: نينا لديها طائر اسمه بيكو
    gloss: 'نينا: نعم، لدي طائر. اسمه بيكو.'
    note: معنى *Его зовут Пико* حرفيًا «يسمّونه بيكو». هكذا يذكر الروسية الاسم.
  ru.a1.unit27.lesson06.teach.dima_kak_zdorovo:
    title: ديما يتفاعل
    gloss: 'ديما: رائع! ماذا تفعلين معه كل يوم؟'
  ru.a1.unit27.lesson06.teach.nina_ya_kazhdyy:
    title: نينا تُطعمه كل يوم
    gloss: 'نينا: أُطعمه كل يوم.'
  ru.a1.unit27.lesson06.teach.dima_ya_tozhe:
    title: ديما يحب الطيور أيضًا
    gloss: 'ديما: أنا أيضًا أحب الطيور.'
  ru.a1.unit27.lesson06.teach.nastya_kak_khorosho:
    title: ناستيا تختم الحديث
    gloss: 'ناستيا: كم هو جميل أننا نحن الثلاثة نحب الحيوانات!'
    note: يختم الحديث بجمع المعلومات عن الحيوانات لدى الشخصيات الثلاث في هذه الوحدة.
