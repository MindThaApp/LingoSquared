    note: '«Да» تعني التأكيد، ثم يعيد فيكتور ذكر اليوم والتاريخ. وللتعبير عن التاريخ الذي يقع فيه حدث ما يوضع العدد الترتيبي نفسه في حالة الجر: девятого января («في التاسع من يناير»)، قارن: Сегодня девятое января («اليوم هو التاسع من يناير»).'
