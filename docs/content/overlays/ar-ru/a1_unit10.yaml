teaching:
  ru.a1.unit10.lesson01.teach.kak_doyti:
    title: Как дойти до...?
    gloss: كيف أصل إلى...؟
    note: Как дойти до...? هي الطريقة المهذبة المعتادة لسؤال غريب عن الطريق إلى مكان ما، ويأتي بعدها المقصد في حالة المضاف إليه (الجر).
  ru.a1.unit10.lesson01.teach.muzeya:
    title: музей
    gloss: متحف
    note: музей مذكّر؛ وмузея صيغة المضاف إليه (الجر) التي تأتي بعد до («إلى / حتى»).
    example_gloss: كيف أصل إلى المتحف؟
  ru.a1.unit10.lesson01.teach.pryamo:
    title: прямо
    gloss: إلى الأمام مباشرة
    note: прямо تصف السير إلى الأمام مباشرة؛ وИдите صيغة الأمر المهذبة من فعل «ذهب / مشى».
    example_gloss: سر إلى الأمام مباشرة.
  ru.a1.unit10.lesson01.teach.napravo:
    title: направо
    gloss: إلى اليمين
    note: направо تدل على اتجاه الحركة (الانعطاف إلى اليمين)؛ وпотом تعني «ثم».
    example_gloss: امشِ إلى الأمام مباشرة ثم إلى اليمين.
  ru.a1.unit10.lesson02.teach.nalevo:
    title: налево
    gloss: إلى اليسار
    note: налево تدل على اتجاه الحركة، وهي عكس направо.
    example_gloss: انعطف يسارًا.
  ru.a1.unit10.lesson02.teach.povernite:
    title: поверните
    gloss: انعطف (أمر مهذب)
    note: поверните هي صيغة الأمر المهذبة من повернуть («انعطف»)؛ وза углом تعني «عند المنعطف».
    example_gloss: انعطف يسارًا عند المنعطف.
  ru.a1.unit10.lesson02.teach.kvartal_daleko:
    title: квартал, далеко
    gloss: مجمّع سكني (بين شارعين)، بعيد
    note: квартал هو القسم من المدينة بين شارعين (квартала بعد два)؛ وдалеко تعني «بعيد»، وотсюда تعني «من هنا».
    example_gloss:
    - امشِ مسافة شارعين.
    - هل هذا بعيد من هنا؟
  ru.a1.unit10.lesson03.teach.tourist_prostite:
