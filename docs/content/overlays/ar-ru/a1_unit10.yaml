  ru.a1.unit10.lesson03.teach.prokhozhiy_eto_prosto:
    title: المارّ يعطي الاتجاهات
    gloss: 'المارّ: الأمر بسيط جدًا. امشِ مستقيمًا مسافة شارعين ثم انعطف يمينًا.'
