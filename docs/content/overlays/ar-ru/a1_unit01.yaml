teaching:
  ru.a1.unit01.lesson01.teach.direction:
    title: اتجاه القراءة
    gloss: يُقرأ الأبجدية الروسية من اليسار إلى اليمين.
    note: تُكتب العربية من اليمين إلى اليسار، أما الروسية (بالأبجدية السيريلية) فتُكتب وتُقرأ من اليسار إلى اليمين. انتبه إلى هذا الاتجاه الجديد، وتعلّم معه أشكال الحروف وأصواتها.
  ru.a1.unit01.lesson01.teach.letter_z:
    title: З з
    gloss: حرف Z (زاي)
    note: يُنطق مثل «ز» في كلمة «زهرة». ويشبه شكلُه الصغير з الرقم 3.
  ru.a1.unit01.lesson01.teach.letter_d:
    title: Д д
    gloss: حرف D (دال)
    note: يُنطق مثل «د» في كلمة «دار». وشكله الصغير д نسخة مصغّرة من الكبير مع «قدمين» قصيرتين تحت السطر، ولا يشبه الحرف اللاتيني d إطلاقًا، فتعلّم شكله من جديد.
  ru.a1.unit01.lesson01.teach.letter_r:
    title: Р р
    gloss: حرف R (راء)
    note: يُنطق راءً مرتعشة (مكرَّرة) قريبة من الراء العربية. يشبه الحرف اللاتيني P، وهو شكل مخادع، فلا تقرأه «p».
  ru.a1.unit01.lesson01.teach.letter_a:
    title: А а
    gloss: حرف A (ألف)
    note: يُنطق مثل الفتحة الممدودة في «باب». يطابق الحرف اللاتيني A/a شكلًا، ويقاربه نطقًا.
  ru.a1.unit01.lesson01.teach.letter_v:
    title: В в
    gloss: حرف V (في)
    note: يُنطق مثل صوت v (فاء مجهورة، كالفاء المنطوقة بصوت). يشبه الحرف اللاتيني B، وهو شكل مخادع آخر.
  ru.a1.unit01.lesson01.teach.letter_s:
    title: С с
    gloss: حرف S (إس)
    note: يُنطق مثل «س» في كلمة «سمك». يشبه الحرف اللاتيني C/c شكلًا ونطقًا، لكنه لا يُنطق «ك» أبدًا في الروسية.
  ru.a1.unit01.lesson01.teach.letter_t:
    title: Т т
    gloss: حرف T (تي)
    note: يُنطق مثل «ت» في كلمة «تين». يُكتب т الصغير أحيانًا بخط اليد كأنه m صغيرة، لكن ابدأ بتعلّم الشكل المطبوع هنا.
  ru.a1.unit01.lesson01.teach.letter_u:
    title: У у
    gloss: حرف U (أو)
    note: يُنطق مثل الواو الممدودة في «نور». يشبه الحرف اللاتيني y، فشكله لا يدلّ على نطقه.
  ru.a1.unit01.lesson01.teach.letter_ye:
    title: Е е
    gloss: حرف Ye (يِه)
    note: يُنطق «يِه» في أول الكلمة أو المقطع. يطابق الحرف اللاتيني E/e شكلًا، لكن نطقه مختلف تمامًا.
  ru.a1.unit01.lesson01.teach.hard_sign_note:
    title: 'ъ و ь: العلامة الصلبة والعلامة الليّنة'
    gloss: العلامة الصلبة ъ والعلامة الليّنة ь لا صوت لهما بنفسيهما، بل تغيّران نطق الحرف المجاور.
    note: 'لا تمثّل هاتان العلامتان صوتًا مستقلًا: ь تلطّف الحرف الساكن الذي قبلها، وъ تفصل بين صوتين فصلًا واضحًا. سنعود إليهما عندما نصادفهما في كلمات حقيقية.'
  ru.a1.unit01.lesson01.teach.letter_short_i:
    title: Й й
    gloss: حرف I القصير (ي قصيرة)
    note: يُنطق مثل الياء الانزلاقية في «بَيْت»، أي صوت سريع وليس حركة كاملة. وهو موجود في Здравствуйте، الكلمة التي يقودنا إليها هذا الدرس.
  ru.a1.unit01.lesson01.teach.zdravstvuyte_shape:
    title: Здравствуйте
    gloss: مرحبًا (رسمي)
    note: هي التحية الرسمية الكاملة، مبنية من الحروف التي تعرّفنا عليها للتو. تبدو طويلة وكثيرة الحروف الساكنة، لكن كل حرف فيها مرّ بك في هذا الدرس.
    example_gloss: مرحبًا! اسمي فيكتور.
  ru.a1.unit01.lesson02.teach.zdravstvuyte_privet:
    title: Здравствуйте, Привет
    gloss: مرحبًا (رسمي)؛ أهلًا (غير رسمي)
    note: Здравствуйте تحية رسمية آمنة تصلح لكل وقت ولأي شخص غريب. أما Привет فتحية عفوية تُقال للأصدقاء والأقران.
    example_gloss:
    - مرحبًا! كيف حالك؟ (رسمي)
    - أهلًا! كيف الحال؟ (غير رسمي)
  ru.a1.unit01.lesson02.teach.dobroe_utro:
    title: Доброе утро!
    gloss: صباح الخير
    note: تُقال في الصباح، تقريبًا حتى أواخر الضحى.
  ru.a1.unit01.lesson02.teach.dobryy_den:
    title: Добрый день!
    gloss: طاب يومك / مرحبًا
    note: التحية المعتادة في النهار، وتصلح من أواخر الضحى حتى بعد الظهر.
  ru.a1.unit01.lesson02.teach.dobryy_vecher:
    title: Добрый вечер!
    gloss: مساء الخير
    note: تُقال عند الوصول إلى مكان ما في المساء، فهي تحية لقاء وليست وداعًا.
  ru.a1.unit01.lesson02.teach.register_note:
    title: اختيار التحية
    gloss: Здравствуйте تصلح في أي وقت من اليوم ومع من تخاطبه باحترام. أما Привет فغير رسمية، وتُقال بين الأصدقاء.
    note: إذا لم تكن متأكدًا من الوقت أو من هوية مخاطَبك، فـ Здравствуйте آمنة دائمًا؛ وPривет مخصّصة لمن تعرفهم جيدًا.
  ru.a1.unit01.lesson03.teach.kak_dela:
    title: Как дела?
    gloss: كيف حالك؟ (غير رسمي)
    note: الطريقة اليومية غير الرسمية للسؤال عن الحال، تُستخدم مع الأصدقاء والأقران.
  ru.a1.unit01.lesson03.teach.kak_pozhivaete:
    title: Как поживаете?
    gloss: كيف حالك؟ (رسمي)
    note: الطريقة الرسمية للسؤال عن الحال، وتناسب صيغة الاحترام вы.
  ru.a1.unit01.lesson03.teach.horosho_spasibo:
    title: Хорошо, спасибо
    gloss: بخير، شكرًا
    note: جواب بسيط وإيجابي يصلح في المقامين الرسمي وغير الرسمي.
    example_gloss: كيف حالك؟ — بخير، شكرًا.
  ru.a1.unit01.lesson03.teach.tak_sebe:
    title: Так себе
    gloss: عادي / لا بأس
    note: جواب بين المحايد والسلبي قليلًا، يُقال حين لا يكون الحال جيدًا ولا سيئًا.
    example_gloss: كيف حالك؟ — عادي.
  ru.a1.unit01.lesson03.teach.a_u_tebya:
    title: А у тебя?
    gloss: وأنت؟ (غير رسمي)
    note: الطريقة غير الرسمية لإعادة السؤال إلى المخاطَب، وتناسب صيغة ты.
  ru.a1.unit01.lesson03.teach.do_svidaniya:
    title: До свидания!
    gloss: إلى اللقاء (محايد/رسمي)
    note: عبارة الوداع المعتادة لكل المقامات، ومعناها الحرفي قريب من «إلى أن نرى بعضنا مجددًا».
  ru.a1.unit01.lesson03.teach.poka:
    title: Пока!
    gloss: إلى اللقاء (غير رسمي)
    note: طريقة عفوية شائعة جدًا للوداع بين الأصدقاء والمعارف.
  ru.a1.unit01.lesson03.teach.do_zavtra:
    title: До завтра!
    gloss: أراك غدًا
    note: وداع ودّي يُقال حين تتوقع أن ترى الشخص مجددًا في اليوم التالي.
  ru.a1.unit01.lesson03.teach.anna:
    title: آنا تحيّي مكسيم
    gloss: 'تقول آنا: يومك سعيد! كيف حالك؟'
    note: آنا ومكسيم زميلان يتبادلان التحية في النهار، وكلمة дела توحي بدرجة من الألفة (مقام غير رسمي).
  ru.a1.unit01.lesson03.teach.maksim_reply:
    title: مكسيم يجيب ويسأل بدوره
    gloss: 'يقول مكسيم: بخير، شكرًا. وأنت؟'
    note: يجيب مكسيم ويعيد السؤال بصيغة غير رسمية، مراعيًا مقام آنا.
  ru.a1.unit01.lesson03.teach.anna_close:
    title: آنا تُنهي الحديث
    gloss: 'تقول آنا: وأنا بخير أيضًا. حسنًا، أراك غدًا!'
    note: تُنهي آنا الحديث القصير وتنتقل إلى وداع ودّي.
  ru.a1.unit01.lesson03.teach.maksim_close:
    title: مكسيم يودّع
    gloss: 'يقول مكسيم: أراك غدًا!'
    note: يردّد مكسيم وداع آنا ليُنهي الحديث.
