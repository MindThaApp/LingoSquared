teaching:
  ru.a1.unit02.lesson01.teach.kak_vas_zovut:
    title: Как вас зовут?, Как тебя зовут?
    gloss: ما اسمك؟ (رسمي)؛ ما اسمك؟ (غير رسمي)
    note: «Как вас зовут?» تستخدم вас الرسمية، وتُقال للغرباء أو في المواقف المهذبة. أما «Как тебя зовут?» فتستخدم тебя غير الرسمية، وتُقال للأصدقاء والأطفال ومن هم في سنك.
    example_gloss:
    - مرحبًا! ما اسمك؟
    - أهلًا! ما اسمك؟
  ru.a1.unit02.lesson01.teach.menya_zovut:
    title: Меня зовут Виктор.
    gloss: اسمي فيكتور.
    note: '«Меня зовут» (حرفيًا: «يسمّونني») هي الطريقة المعتادة لذكر اسمك بالروسية، في أي مقام كان.'
  ru.a1.unit02.lesson01.teach.menya_zovut_anna:
    title: Меня зовут Анна.
    gloss: اسمي آنا.
    note: النمط نفسه «Меня зовут ...» مع اسم مختلف؛ وهذه العبارة لا تتغير بحسب جنس المتكلم.
  ru.a1.unit02.lesson01.teach.register_note:
    title: اختيار السؤال المناسب
    gloss: «Как вас зовут?» للمقام المهذب أو للغرباء. و«Как тебя зовут?» للأصدقاء والأطفال ومن هم في سنك.
    note: هذا التمييز بين الرسمي وغير الرسمي يوازي التمييز بين вы وты الذي يُشرح كاملًا في الدرس الثاني؛ فـ вас وтебя هما صيغتا المفعول به من вы وты.
  ru.a1.unit02.lesson02.teach.vy_ty:
    title: вы, ты
    gloss: أنتم/أنتَ (رسمي)؛ أنتَ (غير رسمي)
    note: في العربية الفصحى ضمير المخاطب «أنتَ» يُستعمل غالبًا مع الجميع، أما في الروسية فيُستعمل вы مع الغرباء وكبار السن وفي أجواء العمل، وты مع الأصدقاء والعائلة والأطفال.
    example_gloss:
    - من أين أنت؟ (رسمي)
    - من أين أنت؟ (غير رسمي)
  ru.a1.unit02.lesson02.teach.vy_ty_rule:
    title: متى نستخدم كلًّا منهما
    gloss: 'Вы رسمية: مع الغرباء، وفي العمل، ومع كبار السن. Ты غير رسمية: مع الأصدقاء والعائلة والأطفال.'
    note: قد يبدو استخدام ты مع من يتوقع вы تجاوزًا للحدود أو حتى فظاظة؛ فإذا ترددت فابدأ بـ вы.
  ru.a1.unit02.lesson02.teach.mozhno_na_ty:
    title: Можно на ты?
    gloss: هل يمكننا الانتقال إلى صيغة ты غير الرسمية؟
    note: طريقة مهذبة لاقتراح الانتقال من صيغة вы الرسمية إلى صيغة ты غير الرسمية عندما تصبح العلاقة ودّية بما يكفي.
  ru.a1.unit02.lesson02.teach.davayte_pereydyom:
    title: Давайте перейдём на ты.
    gloss: لننتقل إلى صيغة ты غير الرسمية.
    note: طريقة أكثر مباشرة ودعوةً لاقتراح الانتقال نفسه الذي في «Можно на ты?»
  ru.a1.unit02.lesson02.teach.otkuda_vy:
    title: Откуда вы?
    gloss: من أين أنت؟ (رسمي)
    note: تستخدم вы الرسمية، بما يناسب اللقاء الأول أو أجواء العمل.
  ru.a1.unit02.lesson02.teach.otkuda_ty:
    title: Откуда ты?
    gloss: من أين أنت؟ (غير رسمي)
    note: النظير غير الرسمي، ويُستخدم مع شخص تعرفه جيدًا.
  ru.a1.unit02.lesson02.teach.ya_iz_kanady:
    title: Я из Канады.
    gloss: أنا من كندا.
    note: تأتي بعد «из» («من») صيغة الجر (родительный падеж)، فتصبح Канада هنا Канады؛ وهذا نمط جدير بالملاحظة رغم أن قواعد الحالات الكاملة تأتي لاحقًا.
  ru.a1.unit02.lesson02.teach.ya_iz_moskvy:
    title: Я из Москвы.
    gloss: أنا من موسكو.
    note: 'النمط نفسه في «Я из Канады»: تصبح Москва Москвы بعد «из».'
  ru.a1.unit02.lesson03.teach.davayte_poznakomimsya:
    title: Давайте познакомимся.
    gloss: لنتعارف.
    note: طريقة مهذبة شائعة لبدء التعارف بين شخصين يلتقيان للمرة الأولى.
  ru.a1.unit02.lesson03.teach.ochen_priyatno:
    title: Очень приятно
    gloss: تشرفنا
    note: ردّ مهذب معتاد بعد أن يذكر الشخص اسمه.
    example_gloss: اسمي جون. -- تشرفنا.
  ru.a1.unit02.lesson03.teach.irina_greeting:
    title: إيرينا بتروفنا تبدأ التعارف
    gloss: 'تقول إيرينا بتروفنا: مرحبًا! لنتعارف. اسمي إيرينا بتروفنا.'
    note: تلتقي إيرينا بتروفنا بجون للمرة الأولى في مكتب رسمي، لذلك تستخدم «Здравствуйте» المهذبة وصيغة вы طوال الحوار.
  ru.a1.unit02.lesson03.teach.john_reply:
    title: جون يردّ بذكر اسمه
    gloss: 'يقول جون: تشرفنا. اسمي جون.'
    note: يجاري جون أسلوب إيرينا بتروفنا الرسمي المهذب بقوله «Очень приятно».
  ru.a1.unit02.lesson03.teach.irina_question:
    title: إيرينا بتروفنا تسأل جون من أين هو
    gloss: 'تسأل إيرينا بتروفنا: من أين أنت يا جون؟'
    note: تستخدم «Откуда вы» الرسمية، بما يتفق مع أجواء المكتب.
  ru.a1.unit02.lesson03.teach.john_answer:
    title: جون يجيب ثم يسأل بدوره
    gloss: 'يقول جون: أنا من كندا. ومن أين أنتِ؟'
    note: يذكر جون بلده ثم يعيد السؤال بأدب بقوله «А вы откуда?»
  ru.a1.unit02.lesson03.teach.irina_answer:
    title: إيرينا بتروفنا تجيب
    gloss: 'تقول إيرينا بتروفنا: أنا من موسكو.'
    note: تُنهي الحوار بنمط الجر الدال على الأصل الذي مرّ في الدرس الثاني.
