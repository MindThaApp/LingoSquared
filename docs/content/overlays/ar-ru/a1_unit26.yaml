teaching:
  ru.a1.unit26.lesson01.teach.vysokiy_nevysokiy:
    title: طويل وقصير
    gloss: طويل / قصير
    note: 'تصف كلمة *Высокий* الشخص الطويل، وتصف *невысокий* الشخص القصير (حرفيًا: «غير طويل»). تتغير النهاية بحسب الجنس: *высокая*، *невысокая*.'
    example_gloss:
    - لينا طويلة.
    - إيغور قصير القامة.
  ru.a1.unit26.lesson01.teach.staryy_molodoy:
    title: كبير في السن وشاب
    gloss: كبير في السن / شاب
    note: تصف الكلمتان *Старый* و*молодой* هنا انطباعًا عامًا عن العمر، لا عددًا محددًا من السنين.
    example_gloss:
    - الجد كبير في السن.
    - ديما شاب.
  ru.a1.unit26.lesson01.teach.prilagatelnoe_menyaetsya_po:
    title: تتغير الصفات بحسب الجنس
    gloss: 'تتغير الصفة بحسب الشخص: *он высокий, она высокая*؛ *он старый, она старая*.'
    note: تنتهي الصفات المذكّرة بـ *-ый* أو *-ий* أو *-ой* (*высокий*، *молодой*)، وتنتهي المؤنثة بـ *-ая* (*высокая*، *молодая*).
  ru.a1.unit26.lesson01.teach.lena_vysokaya_a:
    title: لينا طويلة وإيغور قصير
    gloss: لينا طويلة وإيغور قصير.
    note: 'تُوضَع جملتان جنبًا إلى جنب بالأداة *а* (بينما، و): *Лена высокая, а Игорь невысокий*.'
  ru.a1.unit26.lesson02.teach.volosy:
    title: الشعر
    gloss: الشعر
    note: 'كلمة *Волосы* (الشعر) جمع في الروسية: *У Насти светлые волосы*، ولا تُستعمل مفردة.'
    example_gloss: شعر ديما قصير وأسود.
  ru.a1.unit26.lesson02.teach.svetlye_kashtanovye_sedye:
    title: أشقر وبني ورمادي
    gloss: أشقر / بني / رمادي
    note: 'ثلاثة ألوان للشعر بصيغة الجمع لتتطابق مع *волосы*: *светлые*، *каштановые*، *седые*.'
    example_gloss:
    - شعر ناستيا أشقر.
    - شعر إيغور بنّي.
    - شعر الجد رمادي.
  ru.a1.unit26.lesson02.teach.dlinnye_korotkie:
    title: طويل وقصير (للشعر)
    gloss: طويل / قصير (للشعر)
    note: تتطابق *Длинные* (طويل) و*короткие* (قصير) أيضًا مع الجمع *волосы*.
    example_gloss:
    - لدى لينا شعر طويل.
    - شعر إيغور قصير.
  ru.a1.unit26.lesson02.teach.volosy_stoyat_vo:
    title: الصفات تتطابق مع волосы
    gloss: '*Волосы* جمع، لذا تكون الصفة جمعًا أيضًا: *длинные волосы*، *короткие волосы*، *светлые волосы*، *чёрные волосы*.'
    note: تنتهي صفات الجمع بـ *-ые* أو *-ие*. وستجد النهاية نفسها مع *глаза* في الدرس القادم.
  ru.a1.unit26.lesson02.teach.posle_u_imya:
    title: у مع المضاف إليه (الجر)
    gloss: 'بعد *у* يأتي صاحب الشيء في حالة المضاف إليه (الجر): *у Насти* (لدى ناستيا)، *у Димы* (لدى ديما)، *у неё* (لديها).'
    note: 'هكذا تعبّر الروسية عن الملكية: *у* + الاسم في حالة الجر + الشيء المملوك. ولا يوجد فعل «يملك» لهذا المعنى.'
  ru.a1.unit26.lesson02.teach.u_dimy_korotkie:
    title: شعر ديما قصير وأسود
    gloss: شعر ديما قصير وأسود.
    note: تتطابق *Чёрные* (أسود) مع الجمع *волосы*. ويُكتب الحرف *ё* دائمًا في هذه الدورة.
  ru.a1.unit26.lesson02.teach.u_nasti_dlinnye:
    title: شعر ناستيا طويل وأشقر
    gloss: شعر ناستيا طويل وأشقر.
    note: تجمع في جملة طبيعية واحدة مفردات الطول والألوان من هذا الدرس.
  ru.a1.unit26.lesson03.teach.glaza:
    title: العيون
    gloss: العيون
    note: '*Глаза* (العينان/العيون) جمع *глаз*؛ وعلامة الجمع هي *-а*.'
    example_gloss: عينا ديما بنيتان.
  ru.a1.unit26.lesson03.teach.golubye_karie_zelyonye:
    title: أزرق وبني وأخضر
    gloss: أزرق / بني / أخضر
    note: '*Голубые* هو الأزرق الفاتح، و*карие* هو البنّي للعيون فقط، و*зелёные* هو الأخضر. والثلاثة جموع.'
    example_gloss:
    - عينا ناستيا زرقاوان.
    - عينا إيغور بنيتان.
    - لدى لينا عينان خضراوان.
  ru.a1.unit26.lesson03.teach.glaza_stoyat_vo:
    title: الصفات تتطابق مع глаза
    gloss: '*Глаза* جمع، لذا تكون الصفة جمعًا أيضًا: *голубые глаза*، *карие глаза*، *зелёные глаза*.'
    note: 'العيون البنية هي *карие* لا *коричневые*، والشعر البنّي هو *каштановые*: فالروسية تستعمل كلمات مختلفة للعيون وللشعر.'
  ru.a1.unit26.lesson03.teach.kak_vyglyadit_nastya:
    title: كيف تبدو ناستيا؟
    gloss: كيف تبدو ناستيا؟
    note: '*Как выглядит ...?* هو السؤال الأساسي في هذه الوحدة. ويتطابق الفعل *выглядит* مع فاعل مفرد.'
  ru.a1.unit26.lesson03.teach.u_nasti_dlinnye:
    title: شعر ناستيا طويل وأشقر وعيناها زرقاوان
    gloss: شعر ناستيا طويل وأشقر وعيناها زرقاوان.
    note: 'تربط الإجابة النموذجية بين الشعر والعينين بالحرف *и*: *У Насти длинные светлые волосы и голубые глаза*.'
  ru.a1.unit26.lesson04.teach.nastya_v_yazykovoe:
    title: ناستيا تقدّم نينا
    gloss: 'ناستيا: ستأتي فتاة جديدة إلى مقهى اللغات. اسمها نينا.'
    note: '*Придёт* (ستأتي) فعل مستقبل تام. و*Её зовут Нина* حرفيًا: «يسمّونها نينا».'
  ru.a1.unit26.lesson04.teach.dima_khorosho_kak:
    title: ديما يسأل عن مظهرها
    gloss: 'ديما: حسنًا! كيف تبدو؟'
    note: السؤال الأساسي نفسه، لكن مع *она* (هي) بدل الاسم.
  ru.a1.unit26.lesson04.teach.nastya_ona_nevysokaya:
    title: ناستيا تصف طول نينا وشعرها
    gloss: 'ناستيا: هي قصيرة القامة وشعرها قصير وأشقر.'
    note: تجمع بين *невысокая* من الدرس الأول وكلمات الشعر من الدرس الثاني. وتضيف *И у неё* معلومة ثانية.
  ru.a1.unit26.lesson04.teach.dima_a_kakie:
    title: ديما يسأل عن عينيها
    gloss: 'ديما: وعيناها؟'
    note: تستعمل *Какие у неё глаза?* التعبير *у неё* («لديها»). و*Неё* هي صيغة *она* بعد حرف الجر *у*.
  ru.a1.unit26.lesson04.teach.nastya_u_neyo:
    title: ناستيا تصف عيني نينا
    gloss: 'ناستيا: عيناها خضراوان.'
    note: تعيد استعمال *зелёные глаза* من الدرس الثالث، مع *у неё* بمعنى «لديها».
  ru.a1.unit26.lesson04.teach.dima_spasibo_togda:
    title: ديما سيتعرّف عليها
    gloss: 'ديما: شكرًا! إذن سأتعرّف عليها.'
    note: '*Я её узнаю* (سأتعرّف عليها): *её* هي صيغة المفعول به من *она*، لأن نينا هي المفعول به.'
  ru.a1.unit26.lesson05.teach.igor_i_lena:
    title: مقارنة بين إيغور ولينا
    gloss: إيغور ولينا أخ وأخت، لكنهما يختلفان في المظهر. إيغور قصير القامة، وشعره قصير بنّي وعيناه بنيتان. أما لينا فأطول من إيغور، وشعرها طويل بنّي وعيناها خضراوان. كيف تبدو أنت؟
    note: مقارنة قصيرة تعيد استعمال كل كلمات الألوان والطول التي تعلمناها، وتنتهي بسؤال الوحدة الأساسي موجهًا إلى القارئ.
    glosses:
      брат: أخ
      сестра: أخت
      выглядят: مظهر
      по-разному: مختلف
      невысокий: قصير
      короткие: قصير
      каштановые: بني
      волосы: الشعر
      карие: بني
      глаза: العيون
      выше: أطول
      длинные: طويل
      зелёные: أخضر
      выглядишь: تبدو / تظهر (كما في «как ты выглядишь?»)
  ru.a1.unit26.lesson05.teach.posle_vyshe_stoit:
    title: المقارنة بـ выше
    gloss: 'بعد *выше* (أطول) يأتي الشخص المقارَن به في حالة المضاف إليه (الجر): *Лена выше Игоря*.'
    note: صيغة التفضيل *выше* لا تتغير بحسب الجنس. ويأتي الشخص المقارَن به في حالة الجر، أو بعد *чем*.
  ru.a1.unit26.lesson05.teach.u_leny_volosy:
    title: شعر لينا أطول من شعر إيغور
    gloss: شعر لينا أطول من شعر إيغور.
    note: '*У Лены волосы длиннее, чем у Игоря*: لا تتغير *длиннее* أبدًا، و*чем* («من») تبدأ الجزء الثاني.'
  ru.a1.unit26.lesson05.teach.u_menya_korotkie:
    title: لدي شعر قصير بني
    gloss: لدي شعر قصير بني.
    note: 'جملة نموذجية لوصف مظهرك أنت: *У меня* («لديّ») + صفة + اسم.'
  ru.a1.unit26.lesson06.teach.dima_smotri_eto:
    title: ديما يلمح نينا
    gloss: 'ديما: انظري، هل هذه نينا؟ شعرها قصير وأشقر وعيناها خضراوان.'
    note: '*Смотри* (انظر) صيغة الأمر غير الرسمية، وتُستعمل بالطريقة نفسها في الحوارات السابقة.'
  ru.a1.unit26.lesson06.teach.nastya_da_eto:
    title: ناستيا تؤكد
    gloss: 'ناستيا: نعم، هذه نينا!'
    note: تأكيد قصير وطبيعي.
  ru.a1.unit26.lesson06.teach.nina_privet_ty:
    title: نينا تحيّي ديما
    gloss: 'نينا: مرحبًا، هل أنت ديما؟'
    note: 'سؤال بسيط غير رسمي: لا تحتاج الروسية إلى فعل «كان» في الحاضر، فنقول ببساطة *Ты Дима?*'
  ru.a1.unit26.lesson06.teach.dima_da_priyatno:
    title: ديما يردّ التحية على نينا
    gloss: 'ديما: نعم! تشرّفت بمعرفتك يا نينا.'
    note: '*Приятно познакомиться* هي العبارة المعتادة عند لقاء شخص للمرة الأولى. و*Познакомиться* تعني التعرّف على شخص جديد.'
  ru.a1.unit26.lesson06.teach.nina_mne_tozhe:
    title: Nina تردّ التحية
    gloss: 'Nina: تشرفت بمعرفتك أنا أيضًا!'
    note: 'تختتم الحوار: فقد تعرّف ديما على نينا بفضل وصف ناستيا السابق.'
