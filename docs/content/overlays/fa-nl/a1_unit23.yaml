teaching:
  nl.a1.unit23.lesson01.teach.hoeveel_totaal:
    title: پرسیدن قیمت کل
    gloss: در مجموع چقدر می‌شود؟
    note: '*In totaal* (در مجموع) روشن می‌کند که قیمت کل را می‌خواهید، نه قیمت یک مورد.'
  nl.a1.unit23.lesson01.teach.kost_vijfentwintig:
    title: گفتن قیمت کل
    gloss: در مجموع بیست‌وپنج یورو می‌شود.
    note: '*Kost* صورت سوم شخص مفرد *kosten* (هزینه داشتن) است.'
  nl.a1.unit23.lesson02.teach.pinnen_contant:
    title: پرداخت با کارت یا نقدی
    gloss: با کارت پرداخت کردن، نقدی پرداخت کردن
    note: '*Pinnen* فعل مخصوص هلندی برای پرداخت با کارت است و از رمز (PIN) گرفته شده؛ *contant betalen* (پرداخت نقدی) معادل نقدی آن است و *contant* مثل قید پیش از *betalen* می‌آید.'
    example_gloss:
    - می‌شود اینجا با کارت پرداخت کنم؟
    - نقدی پرداخت می‌کنم.
  nl.a1.unit23.lesson02.teach.kan_ik_pinnen:
    title: پرسیدن امکان پرداخت با کارت
    gloss: می‌شود اینجا با کارت پرداخت کنم؟
    note: '*Hier* (اینجا) سؤال را به همین مکان مربوط می‌کند.'
  nl.a1.unit23.lesson02.teach.wilt_u_betalen:
    title: پرسیدن درباره روش پرداخت
    gloss: می‌خواهید نقدی پرداخت کنید یا با کارت؟
    note: '*Wilt u* ...؟ شکل رسمی *wil je* ...؟ است که اینجا صندوقدارِ ناآشنا به کار می‌برد.'
  nl.a1.unit23.lesson03.teach.rekening:
    title: صورت‌حساب
    gloss: صورت‌حساب
    note: 'اسمی با جنس عام: *de rekening*.'
    example_gloss: صورت‌حساب را تقسیم کنیم؟
  nl.a1.unit23.lesson03.teach.rekening_delen:
    title: پیشنهاد تقسیم صورت‌حساب
    gloss: صورت‌حساب را تقسیم کنیم؟
    note: الگوی *Zullen we* ...؟ همان الگوی پیشنهاد برنامه در واحدهای ۱۱ و ۱۹ است.
  nl.a1.unit23.lesson03.teach.apart_afrekenen:
    title: درخواست پرداخت جداگانه
    gloss: می‌شود جداگانه پرداخت کنم؟
    note: '*Apart* (جداگانه) قید فعل *afrekenen* (حساب کردن) است؛ فعلی نزدیک به *betalen* که مخصوصاً برای تسویه‌ی پرداخت به کار می‌رود.'
  nl.a1.unit23.lesson04.teach.wisselgeld:
    title: باقی‌مانده پول
    gloss: باقی‌مانده پول
    note: 'اسمی با حرف تعریف het: *het wisselgeld*؛ ترکیبی از *wisselen* (عوض کردن) و *geld* (پول).'
    example_gloss: بفرمایید، این هم باقی‌مانده پولتان.
  nl.a1.unit23.lesson04.teach.hier_wisselgeld:
    title: دادن باقی‌مانده پول
    gloss: بفرمایید، این هم باقی‌مانده پولتان.
    note: '*Uw* صورت رسمی «شما» برای مالکیت است و با لحن رسمی پشت صندوق یا باجه جور است.'
  nl.a1.unit23.lesson04.teach.geen_wisselgeld_nodig:
    title: نپذیرفتن باقی‌مانده پول
    gloss: باقی‌مانده پول را لازم ندارم.
    note: '*Nodig hebben* (نیاز داشتن) همان الگوی *rugzak nodig hebben* در واحد ۱۴ است.'
  nl.a1.unit23.lesson05.teach.vijfendertig:
    title: سی‌وپنج
    gloss: سی‌وپنج
    note: در هلندی، در عددهای مرکب یکان قبل از دهگان می‌آید؛ *vijfendertig* به‌معنای تحت‌اللفظی «پنج و سی» است، در حالی که در فارسی می‌گوییم «سی و پنج».
    example_gloss: سی‌وپنج یورو قیمت دارد.
  nl.a1.unit23.lesson05.teach.bonnetje:
    title: خواندن صورت‌حساب رستوران
    gloss: 'صورت‌حساب: دو غذای اصلی و دو قهوه. مجموع: سی‌وپنج یورو. پرداخت با کارت.'
    note: به این توجه کنید که چه چیزی سفارش داده شده، مجموع چقدر است و چطور پرداخت شده است.
    glosses:
      Rekening: صورت‌حساب
      twee: دو
      hoofdgerechten: غذاهای اصلی
      koffies: قهوه‌ها
      Totaal: مجموع
      vijfendertig: سی‌وپنج
      euro: یورو
      Betaald: پرداخت‌شده
      pin: کارت
  nl.a1.unit23.lesson06.teach.lotte_ask_bill:
    title: Lotte صورت‌حساب را می‌خواهد
    gloss: 'Lotte: صورت‌حساب را بخواهیم؟'
    note: فعل *vragen* (خواستن، درخواست کردن) مفعول مستقیمش *de rekening* است.
  nl.a1.unit23.lesson06.teach.omar_ask_total:
    title: Omar جمع کل را می‌پرسد
    gloss: 'Omar: بله، فکر خوبی است. در مجموع چقدر می‌شود؟'
    note: همان پرسش *hoeveel kost het in totaal?* از درس اول است.
  nl.a1.unit23.lesson06.teach.lotte_state_total:
    title: Lotte جمع کل را می‌گوید
    gloss: 'Lotte: سی و پنج یورو می‌شود. نصف کنیم؟'
    note: '*Delen* (تقسیم کردن) در اینجا از روی موقعیت به *de rekening* اشاره دارد.'
  nl.a1.unit23.lesson06.teach.omar_offer_pay:
    title: Omar اصرار دارد خودش پرداخت کند
    gloss: 'Omar: نه، بگذار امروز من حساب کنم. شما این‌قدر به من کمک کردید.'
    note: '*Laat mij* ... (بگذار من ...) روش رایج پیشنهاد دادن برای انجام کاری است؛ *geholpen* اسم مفعول فعل *helpen* (کمک کردن) است.'
  nl.a1.unit23.lesson06.teach.lotte_thanks:
    title: Lotte تحت تأثیر قرار می‌گیرد
    gloss: 'Lotte: لطف دارید! ممنون.'
    note: '*Lief van je* (لطف شماست) تعریفی گرم و رایج برای کار بزرگوارانه است.'
  nl.a1.unit23.lesson06.teach.omar_ask_card:
    title: Omar درباره‌ی پرداخت با کارت می‌پرسد
    gloss: 'Omar: می‌شود اینجا با کارت حساب کرد؟'
    note: همان پرسش *kan ik hier pinnen?* از درس دوم است، این بار در خود رستوران.
  nl.a1.unit23.lesson06.teach.betaalt_form:
    title: 'Betaalt: شکل سوم‌شخص'
    gloss: Omar صورت‌حساب را پرداخت می‌کند.
    note: '*Betaalt* شکل سوم‌شخص مفرد فعل *betalen* (پرداخت کردن) است.'
