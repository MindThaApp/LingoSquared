    note: '*Vindt* و *heeft* شکل‌های سوم شخص مفرد فعل‌های *vinden* (فکر کردن/دانستن) و *hebben* (داشتن) هستند؛ *zij* (او، مؤنث) و *haar* (مال او) هم ضمیرهای سوم شخص مؤنث مربوط‌اند که اینجا برای خلاصه کردن حرف‌های خود لوته به‌صورت سوم شخص به کار رفته‌اند.'
