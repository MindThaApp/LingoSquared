    gloss: خیلی از مردم بیشتر از چهار ساعت در روز از گوشی‌شان استفاده می‌کنند. شبکه‌های اجتماعی سرگرم‌کننده‌اند، ولی زمان زیاد پای صفحه‌نمایش برای سلامتی خوب نیست. سعی کنید هر شب یک ساعت بدون گوشی بگذرانید. این برای چشم‌ها و خواب شما خوب است.
