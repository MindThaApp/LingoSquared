teaching:
  nl.a2.unit84.lesson01.teach.reiswoorden:
    title: کشورها، غذا و سفر
    gloss: بلژیک / آلمان / مصر / سوشی / مصری / سفر کردن / خوردن / قایق‌سواری کردن
    note: این‌ها واژه‌های سفر و غذا در این درس هستند.
    example_gloss:
    - من سفر کردن را دوست دارم.
    - من خوردن سوشی را دوست دارم.
    - من قایق‌سواری کرده‌ام.
  nl.a2.unit84.lesson01.teach.ervaringswoorden:
    title: واژه‌های تجربه
    gloss: تا حالا (در پرسش) / تا الان هیچ‌وقت / بوده / خورده / سفر کرده
    note: '*ooit* را در پرسش‌ها به کار ببرید و *nog nooit* را وقتی چیزی تا الان هرگز اتفاق نیفتاده است.'
    example_gloss:
    - تا حالا به بلژیک رفته‌اید؟
    - تا حالا سوشی نخورده‌ام.
  nl.a2.unit84.lesson01.teach.gn_vragen:
    title: پرسش‌های تجربه با گذشته‌ی نقلی
    gloss: تا حالا سوشی خورده‌اید؟ تا حالا به بلژیک رفته‌اید؟
    note: 'برای پرسیدن درباره‌ی یک کار از *hebben* استفاده کنید: *Heb je ooit ... gegeten?* برای پرسیدن درباره‌ی رفتن یا بودن در جایی از *zijn* استفاده کنید: *Ben je ooit ... geweest?* اسم مفعول در آخر جمله می‌آید.'
  nl.a2.unit84.lesson01.teach.gn_antwoorden:
    title: جواب‌های کوتاه
    gloss: بله، قبلاً این کار را کرده‌ام. نه، تا حالا هیچ‌وقت.
    note: '*Al eens* یعنی قبلاً اتفاق افتاده است. *Nog nooit* یعنی تا الان در هیچ زمانی اتفاق نیفتاده است.'
  nl.a2.unit84.lesson02.teach.activiteiten:
    title: فعالیت‌های سفر
    gloss: قایق‌سواری کردن / بازدید از موزه / خوابیدن در هتل / دو بار کار کردن
    note: این مصدرها در کارت بعدی به تجربه‌هایی در گذشته‌ی نقلی تبدیل می‌شوند.
    example_gloss:
    - من قایق‌سواری می‌کنم.
    - من از یک موزه بازدید می‌کنم.
  nl.a2.unit84.lesson02.teach.voltooide_ervaringen:
    title: اسم مفعول‌ها برای تجربه‌ها
    gloss: انجام داده / بازدید کرده / خوابیده / کار کرده
    note: 'این‌ها را با *hebben* به کار ببرید: *heb gemaakt, heeft bezocht, heb geslapen, heb gewerkt*.'
    example_gloss:
    - من قایق‌سواری کرده‌ام.
    - من در هتل خوابیده‌ام.
  nl.a2.unit84.lesson02.teach.gn_al_nog_niet:
    title: قبلاً در برابر هنوز نه
    gloss: قبلاً این کار را کرده‌ام. هنوز این کار را نکرده‌ام.
    note: '*Al* نشان‌دهنده‌ی تجربه‌ای است که انجام شده. *Nog niet* یعنی تا الان اتفاق نیفتاده، ولی ممکن است بعداً اتفاق بیفتد. هر دو پیش از اسم مفعول می‌آیند.'
  nl.a2.unit84.lesson02.teach.gn_positie:
    title: جای واژه‌ی تجربه در جمله
    gloss: قبلاً دو بار کار کرده‌ام. تا حالا به آلمان نرفته‌ام.
    note: 'با *hebben*، *al/twee keer* را پیش از اسم مفعول بگذارید. با *zijn ... geweest*، *nog nooit* پیش از عبارت مکان می‌آید: *nog nooit in Duitsland geweest*.'
  nl.a2.unit84.lesson03.teach.tijdwoorden:
    title: قیدهای زمان مشخص در گذشته
    gloss: دیروز / پارسال / آن موقع / اغلب
    note: '*Gisteren, vorig jaar* و *toen* به یک موقعیت مشخص در گذشته اشاره می‌کنند، و برای تعریف کردن اتفاق‌ها معمولاً گذشته‌ی ساده لازم است.'
    example_gloss:
    - دیروز کار کردم.
    - پارسال اغلب سفر می‌کردم.
  nl.a2.unit84.lesson03.teach.verhaalvormen:
    title: شکل‌های گذشته‌ی ساده
    gloss: خورد / بود / بازدید کرد / سفر کرد
    note: این شکل‌ها درباره‌ی یک زمان مشخص در گذشته حرف می‌زنند. گذشته‌ی ساده‌ی باقاعده در درس ۸۲ و شکل‌های بی‌قاعده در درس ۸۳ آمد.
    example_gloss:
    - دیروز سوشی خوردم.
    - پارسال در آلمان بودم.
  nl.a2.unit84.lesson03.teach.gn_contrast:
    title: تجربه در برابر رویدادی با زمان مشخص
    gloss: تا حالا سوشی خورده‌اید؟ دیروز سوشی خوردم.
    note: برای پرسیدن اینکه آیا تجربه‌ای اتفاق افتاده از گذشته‌ی نقلی استفاده کنید. برای تعریف ماجرایی که به یک زمان مشخص در گذشته وصل است از گذشته‌ی ساده استفاده کنید.
  nl.a2.unit84.lesson03.teach.gn_rule:
    title: قاعده‌ی سرانگشتی
    gloss: 'تجربه: سوشی خورده‌ام. ماجرای مشخص: دیروز سوشی خوردم.'
    note: بپرسید «آیا این کار تا حالا در زندگی کسی اتفاق افتاده؟» و گذشته‌ی نقلی را انتخاب کنید. اگر دارید تعریف می‌کنید که در یک زمان مشخص در گذشته چه شد، گذشته‌ی ساده را انتخاب کنید.
  nl.a2.unit84.lesson04.teach.vragenlijst:
    title: پرسش‌نامه
    gloss: پرسش‌نامه / غذای مصری / قایق‌سواری کردن / بازدید از موزه
    note: دوستان از این موضوع‌ها برای مقایسه‌ی تجربه‌هایشان استفاده می‌کنند.
    example_gloss:
    - ما پرسشنامه را پر می‌کنیم.
    - می‌خواهم غذای مصری بخورم.
  nl.a2.unit84.lesson04.teach.gn_kort_antwoord:
    title: جواب دادن به سؤال با hebben
    gloss: تا حالا غذای مصری خورده‌اید؟ بله، قبلاً یک بار این کار را کرده‌ام. نه، هیچ‌وقت.
    note: در جواب کوتاه و کامل از *dat heb ik ... gedaan* استفاده می‌کنیم تا به همان کار اشاره کنیم.
  nl.a2.unit84.lesson04.teach.gn_zijn_antwoord:
    title: جواب دادن به سؤال با zijn
    gloss: تا حالا به مصر رفته‌اید؟ نه، من هیچ‌وقت به مصر نرفته‌ام.
    note: '*zijn* را همراه *geweest* به کار ببرید. ترتیب خنثی این است: *nog nooit + place + geweest* (مکان را می‌شود اول هم آورد: *in Egypte nog nooit*).'
  nl.a2.unit84.lesson05.teach.noor_profiel:
    title: پروفایل سفر نور
    gloss: نور سفر و غذا را دوست دارد. او دو بار به آلمان رفته و یک بار هم آنجا در یک هتل کوچک خوابیده است. او اغلب نان آلمانی خورده است. او هیچ‌وقت به مصر نرفته و هیچ‌وقت قایق‌سواری نکرده است. یک موزه در بلژیک را هم قبلاً دیده است.
    note: این پروفایل تجربه‌های انجام‌شده (*al, al eens, twee keer, vaak*) را با تجربه‌هایی که هیچ‌وقت اتفاق نیفتاده‌اند (*nog nooit*) مقایسه می‌کند.
    glosses:
      houdt: عاشق است
      reizen: مسافرت کردن
      twee: دو
      keer: بار
      klein: کوچک
      Duits: آلمانی
      brood: نان
      boottocht: قایق‌سواری
      museum: موزه
      bezocht: بازدید کرده
  nl.a2.unit84.lesson06.teach.lotte_egyptisch:
    title: لوته درباره‌ی غذا می‌پرسد
    gloss: 'لوته: تا حالا سوشی خورده‌ای؟'
  nl.a2.unit84.lesson06.teach.omar_eten_reizen:
    title: عمر جواب می‌دهد و می‌پرسد
    gloss: 'عمر: آره، خیلی وقت‌ها خورده‌ام. تا حالا مصر رفته‌ای؟'
  nl.a2.unit84.lesson06.teach.lotte_duitsland:
    title: لوته تجربه‌ها را مقایسه می‌کند
    gloss: 'لوته: نه، هیچ‌وقت. ولی یک بار آلمان رفته‌ام.'
  nl.a2.unit84.lesson06.teach.omar_boot:
    title: عمر درباره‌ی قایق‌سواری می‌پرسد
    gloss: 'عمر: آنجا قایق‌سواری کردی؟'
  nl.a2.unit84.lesson06.teach.lotte_nog_niet:
    title: لوته می‌گوید هنوز نه
    gloss: 'لوته: نه، هنوز این کار را نکرده‌ام. تو چی؟'
  nl.a2.unit84.lesson06.teach.omar_al_eens:
    title: عمر می‌گوید که انجام داده است
    gloss: 'عمر: آره، قبلاً یک بار این کار را کرده‌ام.'
