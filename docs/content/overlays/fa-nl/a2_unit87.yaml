course:
  title: هلندی A2
  description: هلندی سطح A2 با تمرکز بر دستور زبان، برای صحبت دربارهٔ قوانین و اجازه.
  learning_goal: با mogen، moeten و hoeven niet te بپرسید چیزی مجاز است یا نه و بگویید چه کاری باید یا لازم نیست انجام شود.
units:
  nl.a2.unit87.wat_mag_en_moet:
    title: چه چیزی مجاز است و چه چیزی الزامی
    description: با mogen، moeten و hoeven niet te اجازه بخواهید و قوانین داخلی را بیان کنید.
lessons:
  nl.a2.unit87.lesson01.mag_dat:
    title: این مجاز است؟
  nl.a2.unit87.lesson02.dat_moet:
    title: این الزامی است
  nl.a2.unit87.lesson03.hoeven_niet_te:
    title: این لازم نیست
  nl.a2.unit87.lesson04.zwembad_en_sportschool:
    title: استخر و باشگاه
  nl.a2.unit87.lesson05.huisregels_bibliotheek:
    title: قوانین داخلی کتابخانه
  nl.a2.unit87.lesson06.lotte_en_omar:
    title: لوته و عمر در باشگاه
teaching:
  nl.a2.unit87.lesson01.teach.plekken:
    title: جاهایی که قانون دارند
    gloss: کتابخانه / استخر / باشگاه ورزشی
    note: این‌ها سه جا هستند که قانون در آن‌ها مهم است.
    example_gloss:
    - من در کتابخانه کتاب می‌خوانم.
    - نور در استخر شنا می‌کند.
    - عمر در باشگاه است.
  nl.a2.unit87.lesson01.teach.handelingen:
    title: کارهایی که اجازه دارید یا ندارید انجام بدهید
    gloss: شنا کردن / غذا خوردن / تلفن کردن / سیگار کشیدن / امانت گرفتن
    note: مصدر فعل‌های هلندی به -en ختم می‌شود. مصدر همان شکلی است که آخر جمله می‌گذارید.
    example_gloss:
    - من می‌خواهم در استخر شنا کنم.
    - لوته می‌خواهد یک ساندویچ بخورد.
    - نور به عمر زنگ می‌زند.
    - عمر سیگار نمی‌کشد.
    - من یک کتاب امانت می‌گیرم.
  nl.a2.unit87.lesson01.teach.plaatsen:
    title: اینجا، داخل، بیرون
    gloss: اینجا / داخل / بیرون
    note: قانون‌ها اغلب به مکان بستگی دارند.
    example_gloss:
    - من اینجا هستم.
    - داخل گرم است.
    - بیرون باران می‌آید.
  nl.a2.unit87.lesson01.teach.gn_mogen:
    title: 'Mogen: اجازه داشتن'
    gloss: من اجازه دارم / تو اجازه داری / او اجازه دارد / ما اجازه داریم / شما اجازه دارید / آن‌ها اجازه دارند
    note: '*Mogen* یعنی اجازه داشتن. همهٔ شکل‌های مفرد *mag* هستند: *ik mag, jij mag, je mag, hij mag*. جمع آن *mogen* است.'
  nl.a2.unit87.lesson01.teach.gn_tweede_plaats:
    title: فعل کمکی در جایگاه دوم، مصدر در آخر
    gloss: من اجازه دارم اینجا شنا کنم. اجازه دارم اینجا شنا کنم؟
    note: 'در جملهٔ خبری، فعل کمکی در جایگاه دوم می‌آید و مصدر در آخر جمله: *Ik mag hier zwemmen.* در پرسش بله/خیر، فعل کمکی اول می‌آید، ولی مصدر باز هم آخر است: *Mag ik hier zwemmen?*'
  nl.a2.unit87.lesson01.teach.antwoorden:
    title: جواب‌های کوتاه
    gloss: بله، اشکالی ندارد. نه، اجازه ندارید.
  nl.a2.unit87.lesson01.teach.vragen:
    title: اجازه خواستن
    gloss: اینجا می‌شود غذا خورد؟ اینجا می‌شود تلفن کرد؟ اینجا می‌شود سیگار کشید؟
  nl.a2.unit87.lesson02.teach.regels:
    title: قانون‌ها و کارت‌ها
    gloss: قانون / قوانین داخلی / کارت
    note: '*Huisregels* جمع است: همهٔ قانون‌های یک ساختمان را نام می‌برد.'
    example_gloss:
    - این یک قانون است.
    - قوانین داخلی را بخوانید.
    - من کارتم را دارم.
  nl.a2.unit87.lesson02.teach.handeling2:
    title: کارهایی که باید انجام بدهید
    gloss: پول دادن / نشان دادن / دوش گرفتن
    note: '*Laten zien* دو کلمه است. با هم یعنی نشان دادن.'
    example_gloss:
    - عمر با کارتش پول می‌دهد.
    - می‌خوام کارتم را نشان بدهم.
    - لوته می‌خواد اول دوش بگیره.
  nl.a2.unit87.lesson02.teach.afval:
    title: تفکیک زباله
    gloss: زباله / جدا کردن (تفکیک کردن)
    note: در هلند زباله را به شیشه، کاغذ و پلاستیک تفکیک می‌کنند.
    example_gloss:
    - ما زباله را تفکیک می‌کنیم.
    - شما باید شیشه، کاغذ و پلاستیک را جدا کنید.
  nl.a2.unit87.lesson02.teach.materialen:
    title: مواد
    gloss: کاغذ / شیشه / پلاستیک
    note: زباله بر اساس جنس تفکیک می‌شود.
    example_gloss:
    - این کاغذ است.
    - این شیشه است.
    - این پلاستیک است.
  nl.a2.unit87.lesson02.teach.gn_moeten:
    title: 'Moeten: باید'
    gloss: من باید / تو باید / او باید / ما باید / شما باید / آن‌ها باید
    note: '*Moeten* یعنی «باید». همهٔ شکل‌های مفرد *moet* هستند: *ik moet, jij moet, je moet, hij moet*. شکل جمع *moeten* است.'
  nl.a2.unit87.lesson02.teach.gn_moeten_zin:
    title: Moeten مثل mogen کار می‌کند
    gloss: شما باید کارتتان را نشان بدهید. آیا من باید پرداخت کنم؟
    note: '*Moeten* مثل *mogen* است: در جملهٔ خبری در جایگاه دوم می‌آید (بعد از اولین بخش جمله)، سؤال بله/خیر را شروع می‌کند و مصدر در آخر جمله می‌آید. در *laten zien* هر دو کلمه کنار هم در آخر جمله می‌مانند.'
  nl.a2.unit87.lesson02.teach.zinnen:
    title: دو قاعده
    gloss: من باید کارتم را نشان بدهم. ما باید زباله را تفکیک کنیم.
  nl.a2.unit87.lesson03.teach.tijd:
    title: امروز، حالا، همیشه
    gloss: امروز / حالا / همیشه
    note: این کلمه‌ها اغلب در قوانین می‌آیند.
    example_gloss:
    - استخر امروز باز است.
    - من الان توی باشگاه هستم.
    - عمر همیشه سر وقت می‌رسه.
  nl.a2.unit87.lesson03.teach.gn_hoeven:
    title: 'Hoeven: لازم نبودن'
    gloss: من لازم نیست / تو لازم نیست / او لازم نیست / ما لازم نیست / شما لازم نیست / آن‌ها لازم نیست
    note: '*Hoeven* معمولاً با *niet* یا *geen* و *te* + مصدر به کار می‌رود. یعنی چیزی لازم نیست. شکل‌ها: *ik hoef, jij hoeft, hij hoeft, wij hoeven*. در سؤال بعد از *jij* حرف t می‌افتد: *hoef jij*.'
  nl.a2.unit87.lesson03.teach.gn_hoeven_niet_te:
    title: Hoeven niet te + مصدر
    gloss: لازم نیست پرداخت کنید. آیا امروز لازم نیست پرداخت کنم؟
    note: '*niet te* را درست قبل از مصدر بگذارید: *Je hoeft niet te betalen.* فعل کمکی *hoeft* در جایگاه دوم است و *te* + مصدر در آخر جمله.'
  nl.a2.unit87.lesson03.teach.gn_hoeven_geen:
    title: Niet یا geen
    gloss: لازم نیست کارتتان را نشان بدهید. لازم نیست کارتی نشان بدهید.
    note: 'بعد از مفعول معین مثل *je kaart*، *niet* بعد از مفعول می‌آید: *Je hoeft je kaart niet te laten zien.* با اسم نامعین از *geen* استفاده کنید: *Je hoeft geen kaart te laten zien.* *Te* قبل از *laten zien* می‌آید.'
  nl.a2.unit87.lesson03.teach.gn_contrast:
    title: الزامی، اختیاری، ممنوع
    gloss: این الزامی است. این لازم نیست. این ممنوع است. این مجاز است.
    note: '*Dat moet* = الزامی است. *Dat hoeft niet* = لازم نیست و می‌توانید انتخاب کنید. *Dat mag niet* = ممنوع است. برای ممنوع بودن از *mag niet* استفاده کنید، نه *hoeft niet*.'
  nl.a2.unit87.lesson04.teach.kleedkamer:
    title: کلمه‌های استخر و باشگاه
    gloss: حوله / رختکن / اول
    note: '*Eerst* یعنی «اول» و اغلب همراه یک قانون می‌آید.'
    example_gloss:
    - حولهٔ من توی رختکن است.
    - اول دوش بگیرید، بعد شنا کنید.
    - لوته اول به باشگاه می‌آید.
  nl.a2.unit87.lesson04.teach.gn_voorop:
    title: یک کلمهٔ دیگر در اول جمله
    gloss: اینجا نمی‌توانید غذا بخورید. در استخر باید اول دوش بگیرید.
    note: 'می‌توانید جمله را با کلمهٔ مکان شروع کنید. فعل کمکی در جایگاه دوم می‌ماند، پس فاعل بعد از آن می‌آید: *Hier mag je niet eten.* مصدر همچنان در آخر است.'
  nl.a2.unit87.lesson04.teach.gn_vraagwoord:
    title: کلمه‌های پرسشی
    gloss: چه کار باید بکنم؟ کجا اجازه دارم غذا بخورم؟
    note: 'کلمهٔ پرسشی اول می‌آید. بعد فعل کمکی، بعد فاعل و مصدر در آخر: *Wat moet ik doen?* *Waar mag ik eten?*'
  nl.a2.unit87.lesson04.teach.scenario:
    title: در استخر
    gloss: اینجا اجازه دارم شنا کنم؟ بله، باید اول دوش بگیرید.
  nl.a2.unit87.lesson05.teach.nieuw:
    title: جدید، سه، آمدن
    gloss: جدید / سه / آمدن
    note: 'بعد از *de* یا *het* صفت -e می‌گیرد: *nieuw* در *de nieuwe bibliotheek* به *nieuwe* تبدیل می‌شود. *Boeken* جمع *boek* است.'
    example_gloss:
    - کتابخانهٔ جدید قشنگ است.
    - من سه کتاب امانت می‌گیرم.
    - تو هم می‌آیی؟
  nl.a2.unit87.lesson05.teach.reading:
    title: یک پیام برای لوته
    gloss: سلام لوته، من توی کتابخانهٔ جدید هستم. باید کارتت را نشان بدهی. می‌توانی سه کتاب امانت بگیری. اینجا نمی‌شود غذا خورد و نمی‌شود تلفنی صحبت کرد. لازم نیست پولی بدهی. تو هم می‌آیی؟
    note: 'دنبال این‌ها بگردید: چه چیزی الزامی است، چه چیزی مجاز است، چه چیزی ممنوع است و چه چیزی لازم نیست.'
    glosses:
      nieuwe: جدید
      drie: سه
      boeken: کتاب‌ها
      lenen: امانت گرفتن
      betalen: پول دادن
  nl.a2.unit87.lesson06.teach.lotte_vraag:
    title: لوته می‌پرسد
    gloss: 'لوته: سلام عمر، من توی باشگاه تازه‌واردم. چه کار باید بکنم؟'
  nl.a2.unit87.lesson06.teach.omar_kaart:
    title: عمر اولین قانون را می‌گوید
    gloss: 'عمر: اول باید کارتت را نشان بدهی.'
  nl.a2.unit87.lesson06.teach.lotte_bellen:
    title: لوته اجازه می‌خواهد
    gloss: 'لوته: اینجا اجازه دارم تلفنی صحبت کنم؟'
  nl.a2.unit87.lesson06.teach.omar_buiten:
    title: عمر جواب منفی می‌دهد
    gloss: 'عمر: نه، ممنوعه. باید بیرون صحبت کنی.'
  nl.a2.unit87.lesson06.teach.lotte_betalen:
    title: لوته دربارهٔ پرداخت می‌پرسد
    gloss: 'لوته: امروز باید پول بدهم؟'
  nl.a2.unit87.lesson06.teach.omar_hoeft:
    title: عمر جواب می‌دهد
    gloss: 'عمر: نه، امروز لازم نیست پول بدهی.'
exercises:
  nl.a2.unit87.lesson01.exercise01.choose_eat:
    instruction: جملهٔ پرسشی هلندی را انتخاب کنید.
    correct_option: Mag ik hier eten?
    distractors:
    - Mag eten ik hier?
    - Ik hier mag eten?
    - Mag hier ik eten?
    accepted_answers:
    - value: Mag ik hier eten?
      status: correct
    feedback: در سؤال بله/خیر، فعل کمکی *mag* اول می‌آید و مصدر *eten* در آخر جمله قرار می‌گیرد.
    prompt_blocks:
    - اینجا می‌شود غذا خورد؟
  nl.a2.unit87.lesson01.exercise02.choose_no:
    instruction: پاسخ هلندی را انتخاب کنید.
    correct_option: Nee, dat mag niet.
    distractors:
    - Ja, dat mag.
    - Nee, dat mag.
    - Nee, dat niet mag.
    accepted_answers:
    - value: Nee, dat mag niet.
      status: correct
    feedback: '*Nee, dat mag niet* پاسخ کوتاه برای «ممنوع است» است.'
    prompt_blocks:
    - نه، اجازه ندارید.
  nl.a2.unit87.lesson01.exercise03.match_words:
    instruction: هر کلمهٔ هلندی را به معنی فارسی‌اش وصل کنید.
    accepted_answers:
    - value:
      - left: zwemmen
        right: شنا کردن
      - left: eten
        right: خوردن
      - left: bellen
        right: زنگ زدن
      - left: roken
        right: سیگار کشیدن
      - left: lenen
        right: امانت گرفتن
      - left: de bibliotheek
        right: کتابخانه
      - left: het zwembad
        right: استخر
      - left: de sportschool
        right: باشگاه
      status: correct
    feedback: این کلمه‌ها پایهٔ درخواست اجازه کردن هستند.
    pairs:
    - left: zwemmen
      right: شنا کردن
    - left: eten
      right: خوردن
    - left: bellen
      right: زنگ زدن
    - left: roken
      right: سیگار کشیدن
    - left: lenen
