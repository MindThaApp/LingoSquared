    - left: de sportschool
      right: باشگاه
  nl.a2.unit87.lesson01.exercise04.order_swim:
    instruction: کلمه‌ها را مرتب کنید تا بگویید «اینجا اجازه دارم شنا کنم.»
    correct_option: Ik mag hier zwemmen
    accepted_answers:
    - value: Ik mag hier zwemmen
      status: correct
    - value: Hier mag ik zwemmen
      status: correct
    feedback: '*Ik mag hier zwemmen*: فعل کمکی در جایگاه دوم و مصدر در آخر است. *Hier mag ik zwemmen* هم درست است.'
  nl.a2.unit87.lesson01.exercise05.complete_mogen:
    instruction: 'با شکل جمع درست فعل «اجازه داشتن» کامل کنید: ما اینجا اجازه داریم شنا کنیم.'
    correct_option: mogen
    accepted_answers:
    - value: mogen
      status: correct
    feedback: با *wij* شکل جمع *mogen* است.
  nl.a2.unit87.lesson01.exercise06.translate_smoke:
    instruction: به هلندی ترجمه کنید.
    accepted_answers:
    - value: Mag ik hier roken?
      status: correct
    - value: Mag ik hier roken
      status: correct
    feedback: '*Mag ik hier roken?* مصدر *roken* در آخر جمله است.'
    prompt_blocks:
    - اینجا می‌شود سیگار کشید؟
  nl.a2.unit87.lesson01.exercise07.write_call:
    instruction: 'به هلندی بنویسید: بپرسید آیا اینجا اجازه دارید تلفنی صحبت کنید.'
    correct_option: Mag ik hier bellen?
    accepted_answers:
    - value: Mag ik hier bellen?
      status: correct
    - value: Mag ik hier bellen
      status: correct
    feedback: '*Mag ik hier bellen?* = اینجا اجازه دارم تلفنی صحبت کنم؟'
    prompt_blocks:
    - 'به هلندی بنویسید: بپرسید که اینجا اجازه دارید تلفن کنید یا نه.'
  nl.a2.unit87.lesson02.exercise01.choose_card:
    instruction: جملهٔ خبری هلندی را انتخاب کنید.
    correct_option: Je moet je kaart laten zien.
    distractors:
    - Je moet laten zien je kaart.
    - Je laten zien moet je kaart.
    - Je moeten je kaart laten zien.
    accepted_answers:
    - value: Je moet je kaart laten zien.
      status: correct
    feedback: فعل کمکی *moet* در جایگاه دوم است و *laten zien* در آخر جمله می‌آید.
    prompt_blocks:
    - باید کارتتان را نشان بدهید.
  nl.a2.unit87.lesson02.exercise02.choose_waste:
    instruction: جملهٔ هلندی درست را انتخاب کنید.
    correct_option: Wij moeten het afval scheiden.
    distractors:
    - Wij moet het afval scheiden.
    - Wij moeten scheiden het afval.
    - Wij mogen het afval scheiden.
    accepted_answers:
    - value: Wij moeten het afval scheiden.
      status: correct
    feedback: با *wij* شکل فعل *moeten* است و مصدر *scheiden* در آخر می‌آید.
    prompt_blocks:
    - ما باید زباله را تفکیک کنیم.
  nl.a2.unit87.lesson02.exercise03.match_words:
    instruction: هر کلمهٔ هلندی را به معنی فارسی‌اش وصل کنید.
    accepted_answers:
    - value:
      - left: de kaart
        right: کارت
      - left: de regel
        right: قانون
      - left: de huisregels
        right: قوانین داخلی
      - left: het afval
        right: زباله (با حرف تعریف)
      - left: het papier
        right: کاغذ
      - left: het glas
        right: شیشه
      - left: betalen
        right: پول دادن
      - left: scheiden
        right: تفکیک کردن
      - left: douchen
        right: دوش گرفتن
      status: correct
