course:
  title: هلندی A2
  description: هلندیِ سطح A2 با تمرکز بر دستور زبان، برای صحبت درباره‌ی شروع کردن، ترک کردن و تلاش برای عادت‌ها.
  learning_goal: با te + مصدر، stoppen met و staan/zitten/liggen te بگویید چه کاری را شروع کرده‌اید، ترک کرده‌اید، سعی کرده‌اید انجام بدهید یا فراموش کرده‌اید.
units:
  nl.a2.unit91.beginnen_stoppen_proberen:
    title: شروع کردن، ترک کردن، تلاش کردن
    description: بگویید چه کاری را شروع کرده‌اید، ترک کرده‌اید، سعی کرده‌اید انجام بدهید یا فراموش کرده‌اید، و بگویید یک نفر مشغول چه کاری است.
lessons:
  nl.a2.unit91.lesson01.ik_begin_te_sporten:
    title: من شروع می‌کنم به ورزش کردن
  nl.a2.unit91.lesson02.stoppen_met:
    title: ترک کردن
  nl.a2.unit91.lesson03.proberen_en_vergeten:
    title: تلاش کردن و فراموش کردن
  nl.a2.unit91.lesson04.hij_zit_te_lezen:
    title: او نشسته و دارد می‌خواند
  nl.a2.unit91.lesson05.noors_plan:
    title: برنامه‌ی نور
  nl.a2.unit91.lesson06.lotte_en_omar_sporten:
    title: لوته و عمر ورزش می‌کنند
teaching:
  nl.a2.unit91.lesson01.teach.gewoontes:
    title: عادت‌ها
    gloss: ورزش کردن / خوابیدن / خوردن / سالم / زودتر
    note: این کلمه‌ها عادت‌هایی را نام می‌برند که در این درس درباره‌شان صحبت می‌کنید.
    example_gloss:
    - من می‌خواهم ورزش کنم.
    - من می‌خواهم سالم غذا بخورم.
    - من می‌خواهم زودتر بخوابم.
  nl.a2.unit91.lesson01.teach.sportschool:
    title: در باشگاه
    gloss: باشگاه ورزشی / هر روز / اغلب
    note: '*Vaak* یعنی «اغلب»؛ *elke dag* یعنی «هر روز».'
    example_gloss:
    - من هر روز می‌روم باشگاه.
    - نور اغلب می‌رود باشگاه.
    - من اغلب ورزش می‌کنم.
  nl.a2.unit91.lesson01.teach.gn_beginnen_te:
    title: beginnen + te + مصدر
    gloss: من شروع می‌کنم به ورزش کردن. من شروع می‌کنم سالم غذا بخورم. نور شروع می‌کند زودتر بخوابد.
    note: بعد از *beginnen*، کلمه‌ی *te* درست قبل از مصدر می‌آید. مصدر (*sporten, eten, slapen*) آخر جمله است. می‌گوییم *ik begin* ولی *Noor begint*.
  nl.a2.unit91.lesson01.teach.gn_te_achteraan:
    title: کلمه‌های دیگر قبل از te می‌آیند
    gloss: من شروع می‌کنم هر روز بروم باشگاه. او اغلب شروع می‌کند به ورزش کردن.
    note: کلمه‌های دیگر (*elke dag, naar de sportschool, vaak*) بین *beginnen* و *te* قرار می‌گیرند. جفتِ *te* + مصدر آخر جمله و کنار هم می‌ماند.
  nl.a2.unit91.lesson01.teach.zin:
    title: دو کار
    gloss: من شروع می‌کنم به ورزش کردن و سالم غذا خوردن.
    note: وقتی دو کار داریم، در هلندی معمولاً *te* قبل از هر مصدر تکرار می‌شود؛ در فارسی چنین کلمه‌ای لازم نیست.
  nl.a2.unit91.lesson02.teach.schermtijd:
    title: عادت‌هایی که باید ترک کرد
    gloss: سیگار کشیدن / شیرینی و تنقلات خوردن / بازی کردن / تلفن / زمان استفاده از صفحه‌ی نمایش
    note: '*Snoepen* یعنی خوردن شیرینی یا تنقلات.'
    example_gloss:
    - سیگار کشیدن سالم نیست.
    - من هر روز شیرینی می‌خورم.
    - من اغلب با گوشی بازی می‌کنم.
    - زمان استفاده‌ی من از صفحه‌ی نمایش زیاد است.
  nl.a2.unit91.lesson02.teach.minder:
    title: دیگر نه، کمتر
    gloss: ترک کردن / شروع کردن / دیگر ... نه / کمتر
    note: '*Niet meer* یعنی «دیگر ... نه».'
    example_gloss:
    - من دیگر سیگار نمی‌کشم.
    - من کمتر گیم می‌کنم.
    - من شیرینی کمتری می‌خورم.
  nl.a2.unit91.lesson02.teach.gn_stoppen_met:
    title: Stoppen met
    gloss: من سیگار کشیدن را ترک می‌کنم. نور دیگر گیم نمی‌کند. او دیگر تنقلات نمی‌خورد.
    note: 'بعد از *stoppen* از *met* و بعدش اسم یا مصدر استفاده می‌کنیم. اینجا *te* نمی‌آید: نه *stoppen te roken*. می‌گوییم *ik stop* ولی *Noor stopt*.'
  nl.a2.unit91.lesson02.teach.gn_beginnen_met:
    title: Beginnen met
    gloss: من ورزش کردن را شروع می‌کنم. نور شروع می‌کند به سالم غذا خوردن.
    note: '*Beginnen* را هم می‌شود با *met* + مصدر یا اسم به کار برد، بدون *te*. *Ik begin te sporten* و *Ik begin met sporten* یک معنی دارند.'
  nl.a2.unit91.lesson02.teach.zin:
    title: کمتر و دیگر نه
    gloss: من شیرینی کمتری می‌خورم و دیگر گیم نمی‌کنم.
    note: '*Minder* و *niet meer* نشان می‌دهند که عادتتان را تا چه اندازه تغییر داده‌اید.'
  nl.a2.unit91.lesson03.teach.proberen:
    title: تلاش کردن و فراموش کردن
    gloss: سعی کردن / فراموش کردن / تلفن زدن / خواندن
    note: '*Bellen* یعنی به کسی تلفن زدن.'
    example_gloss:
    - من سعی‌اش را می‌کنم.
    - من اغلب فراموشش می‌کنم.
    - من به لوته زنگ می‌زنم.
    - نور هر روز مطالعه می‌کند.
  nl.a2.unit91.lesson03.teach.gn_proberen_te:
    title: Proberen + te
    gloss: سعی می‌کنم زودتر بخوابم. سعی می‌کنم کمتر گیم کنم. نور سعی می‌کند ورزش کند.
    note: بعد از *proberen* از *te* + مصدر استفاده می‌کنیم و مصدر آخر جمله می‌آید. می‌گوییم *ik probeer* ولی *Noor probeert*.
  nl.a2.unit91.lesson03.teach.gn_vergeten_te:
    title: Vergeten + te
    gloss: من اغلب یادم می‌رود زنگ بزنم. یادم رفت زنگ بزنم. یادم رفت به لوته زنگ بزنم.
    note: '*Vergeten* هم با *te* + مصدر می‌آید. مفعول کوتاه (*Lotte*) قبل از *te* می‌آید: *Lotte te bellen*.'
  nl.a2.unit91.lesson03.teach.gn_om_te:
    title: om ... te اختیاری
    gloss: سعی می‌کنم زودتر بخوابم. یادم رفت زنگ بزنم.
    note: 'بعد از *proberen* و *vergeten* می‌توانید *om* هم اضافه کنید: *om ... te*. معنی فرقی نمی‌کند. در این درس بیشتر از شکل کوتاه‌تر، بدون *om*، استفاده می‌شود.'
  nl.a2.unit91.lesson03.teach.gn_perfectum:
    title: گذشته نقلی
    gloss: شروع کردم به ورزش کردن. سیگار را ترک کردم. سعی کردم زودتر بخوابم. یادم رفت زنگ بزنم.
    note: در گذشته‌ی نقلی، *beginnen, stoppen* و *vergeten* با *zijn* می‌آیند، ولی *proberen* با *hebben* می‌آید. با *ik* می‌گوییم *ben* و *heb*. *te* + مصدر (یا *met* + فعالیت) همیشه آخر جمله می‌آید.
  nl.a2.unit91.lesson03.teach.gn_modaal:
    title: با te یا بدون te
    gloss: می‌خواهم ورزش کنم. سعی می‌کنم ورزش کنم. باید بخوابم. سعی می‌کنم بخوابم.
    note: بعد از *willen* و *moeten* مصدر تنها می‌آید، بدون *te*. بعد از *beginnen, proberen* و *vergeten* باید *te* بیاورید.
  nl.a2.unit91.lesson04.teach.posities:
    title: ایستادن، نشستن، دراز کشیدن
    gloss: ایستادن / نشستن / دراز کشیدن / مبل / تخت / در
    note: در هلندی معمولاً مشخص می‌کنند که کسی ایستاده است، نشسته است یا دراز کشیده است.
    example_gloss:
    - او روی مبل نشسته است.
    - او توی تخت دراز کشیده است.
    - او کنار در ایستاده است.
  nl.a2.unit91.lesson04.teach.tv:
    title: صفحه‌نمایش و کتاب
    gloss: تماشا کردن / تلویزیون / کتاب
    note: '*Kijken naar* یعنی نگاه کردن به چیزی یا تماشا کردن.'
    example_gloss:
    - او تلویزیون تماشا می‌کند.
    - او کتاب می‌خواند.
  nl.a2.unit91.lesson04.teach.uren:
    title: ساعت‌هاست
    gloss: از قبل، قبلاً / ساعت‌ها
    note: '*Al uren* یعنی «ساعت‌هاست که».'
    example_gloss:
    - ساعت‌هاست که روی مبل نشسته است.
    - ساعت‌هاست که دارم گیم می‌کنم.
  nl.a2.unit91.lesson04.teach.gn_staan_te:
    title: Staan, zitten, liggen + te
    gloss: او (نشسته) دارد مطالعه می‌کند. او (دراز کشیده) خواب است. او (ایستاده) دارد تلفن می‌زند. او (نشسته) دارد گیم می‌کند.
    note: '*Staan, zitten* یا *liggen* + *te* + مصدر می‌گوید کسی همین الان چه کاری می‌کند. فعل اول حالت بدن را نشان می‌دهد: *zit, ligt, staat*.'
  nl.a2.unit91.lesson04.teach.gn_plaats:
    title: مکان قبل از te
    gloss: او روی مبل دارد مطالعه می‌کند. او توی تخت خواب است. او کنار در دارد تلفن می‌زند.
    note: 'معمولاً مکان قبل از *te* + مصدر می‌آید. در گفتار بعد از آن را هم می‌شنوید: *Hij zit te lezen op de bank*.'
  nl.a2.unit91.lesson04.teach.zin:
    title: او چه کار می‌کند؟
    gloss: او چه کار می‌کند؟ ساعت‌هاست که نشسته و دارد گیم می‌کند.
    note: '*Al uren* قبل از *te gamen* می‌آید و نشان می‌دهد این کار چه مدتی است ادامه دارد.'
  nl.a2.unit91.lesson05.teach.reading:
    title: برنامه‌ی نور
    gloss: سلام لوته، من یک برنامه دارم. هر شب ساعت‌ها می‌نشینم و گیم می‌کنم و این سالم نیست. حالا گیم را ترک می‌کنم. سعی می‌کنم زودتر بخوابم. دوشنبه شروع می‌کنم به ورزش کردن. دیروز یادم رفت به تو زنگ بزنم، ببخش! فردا بهت زنگ می‌زنم.
    note: پیدا کنید نور چه چیزی را ترک می‌کند، به چه چیزی سعی می‌کند، چه چیزی را شروع می‌کند و چه چیزی را فراموش می‌کند.
    glosses:
      plan: برنامه
      avond: شب
      uren: ساعت‌های کاری
      dat: که
      Nu: حالا
      Maandag: دوشنبه
      Gisteren: دیروز
      je: تو
      sorry: ببخشید
      Morgen: فردا
      heb: دارم
  nl.a2.unit91.lesson06.teach.lotte_vraag:
    title: لوته می‌پرسد
    gloss: 'لوته: سلام عمر، شروع کردی به ورزش کردن؟'
  nl.a2.unit91.lesson06.teach.omar_gym:
    title: عمر جواب می‌دهد
    gloss: 'عمر: آره، شروع کردم! سعی می‌کنم هفته‌ای سه بار به باشگاه بروم.'
  nl.a2.unit91.lesson06.teach.lotte_snoepen:
    title: لوته درباره‌ی تنقلات می‌پرسد
    gloss: 'لوته: آفرین! و تنقلات خوردن را ترک کردی؟'
  nl.a2.unit91.lesson06.teach.omar_nee:
    title: عمر اعتراف می‌کند
    gloss: 'عمر: نه، هنوز نمی‌شود. هر شب روی مبل می‌نشینم و تنقلات می‌خورم.'
  nl.a2.unit91.lesson06.teach.lotte_vergeten:
    title: لوته تعریف می‌کند
    gloss: 'لوته: حیف! من هم امروز یادم رفت ورزش کنم.'
  nl.a2.unit91.lesson06.teach.omar_samen:
    title: عمر پیشنهاد می‌دهد
    gloss: 'عمر: پس فردا با هم امتحانش می‌کنیم!'
exercises:
  nl.a2.unit91.lesson01.exercise01.choose_begin:
    instruction: جملهٔ هلندی درست را انتخاب کنید.
    correct_option: Ik begin te sporten.
    distractors:
    - Ik begin sporten.
    - Ik begin te sport.
    - Ik begin sporten te.
    accepted_answers:
    - value: Ik begin te sporten.
      status: correct
    feedback: 'بعد از *beginnen* باید *te* + مصدر بیاید: *Ik begin te sporten.*'
    prompt_blocks:
    - من شروع می‌کنم به ورزش کردن.
  nl.a2.unit91.lesson01.exercise02.choose_ze_begint:
    instruction: جملهٔ هلندی درست را انتخاب کنید.
    correct_option: Ze begint gezond te eten.
    distractors:
    - Ze begin gezond te eten.
    - Ze begint te gezond eten.
    - Ze begint gezond eten te.
    accepted_answers:
    - value: Ze begint gezond te eten.
      status: correct
    feedback: 'با *ze/hij/Noor* فعل به -t ختم می‌شود: *begint*. *Te* درست قبل از مصدر *eten* می‌آید.'
    prompt_blocks:
    - او شروع می‌کند به سالم غذا خوردن.
  nl.a2.unit91.lesson01.exercise03.match_gewoontes:
    instruction: هر کلمهٔ هلندی را به معنی فارسی‌اش وصل کنید.
    accepted_answers:
    - value:
      - left: sporten
        right: ورزش کردن
      - left: slapen
        right: خوابیدن
      - left: eten
        right: خوردن
      - left: gezond
        right: سالم
      - left: vroeger
        right: زودتر
      - left: de sportschool
        right: باشگاه
      status: correct
    feedback: این‌ها واژه‌های مربوط به عادت‌ها در این درس هستند.
    pairs:
    - left: sporten
      right: ورزش کردن
    - left: slapen
      right: خوابیدن
    - left: eten
      right: خوردن
    - left: gezond
      right: سالم
    - left: vroeger
      right: زودتر
    - left: de sportschool
      right: باشگاه
  nl.a2.unit91.lesson01.exercise04.order_noor:
    instruction: کلمه‌ها را مرتب کنید تا بگویید «نور شروع می‌کند زودتر بخوابد.»
    correct_option: Noor begint vroeger te slapen
    accepted_answers:
    - value: Noor begint vroeger te slapen
      status: correct
    feedback: '*Noor begint vroeger te slapen*: *te* + مصدر آخر جمله می‌آید.'
  nl.a2.unit91.lesson01.exercise05.complete_te:
    instruction: جمله را با یک کلمه کامل کنید.
    correct_option: te
    accepted_answers:
    - value: te
      status: correct
    feedback: '*Ik begin elke dag naar de sportschool te gaan.* کلمه‌ی *te* قبل از مصدر *gaan* می‌آید.'
  nl.a2.unit91.lesson01.exercise06.translate_eat:
    instruction: به هلندی ترجمه کنید. از beginnen + te استفاده کنید.
    accepted_answers:
    - value: Ik begin gezond te eten
      status: correct
    - value: Ik begin gezond te eten.
      status: correct
    feedback: '*Ik begin gezond te eten* = شروع می‌کنم سالم غذا بخورم.'
    prompt_blocks:
    - من شروع می‌کنم سالم غذا بخورم. از beginnen + te استفاده کنید.
  nl.a2.unit91.lesson01.exercise07.write_sleep:
    instruction: جملهٔ هلندی خواسته‌شده را بنویسید.
    correct_option: Ik begin vroeger te slapen.
    accepted_answers:
    - value: Ik begin vroeger te slapen
      status: correct
    - value: Ik begin vroeger te slapen.
      status: correct
    feedback: '*Ik begin vroeger te slapen* = شروع می‌کنم زودتر بخوابم.'
    prompt_blocks:
    - 'با beginnen + te به هلندی بنویسید: من شروع می‌کنم زودتر بخوابم.'
  nl.a2.unit91.lesson02.exercise01.choose_stop:
    instruction: جملهٔ هلندی درست را انتخاب کنید.
    correct_option: Ik stop met roken.
    distractors:
    - Ik stop te roken.
    - Ik stop roken.
    - Ik stop met te roken.
    accepted_answers:
    - value: Ik stop met roken.
      status: correct
    feedback: '*Stoppen* با *met* می‌آید و *te* ندارد.'
    prompt_blocks:
    - من سیگار را ترک می‌کنم.
  nl.a2.unit91.lesson02.exercise02.choose_ze_stopt:
    instruction: جملهٔ هلندی درست را انتخاب کنید.
    correct_option: Ze stopt met snoepen.
    distractors:
    - Ze stopt te snoepen.
    - Ze stop met snoepen.
    - Ze stopt snoepen met.
    accepted_answers:
    - value: Ze stopt met snoepen.
      status: correct
    feedback: '*Ze stopt met snoepen*: با *ze* فعل به -t ختم می‌شود و *met* قبل از فعالیت می‌آید.'
    prompt_blocks:
    - او شیرینی خوردن را ترک می‌کند.
  nl.a2.unit91.lesson02.exercise03.match_stoppen:
    instruction: هر عبارت هلندی را به معنی فارسی‌اش وصل کنید.
    accepted_answers:
    - value:
      - left: stoppen met roken
        right: ترک کردن سیگار
      - left: stoppen met snoepen
        right: ترک کردن شیرینی‌خوری
      - left: stoppen met gamen
        right: ترک کردن بازی
      - left: beginnen met sporten
        right: شروع کردن به ورزش
      - left: niet meer
        right: دیگر نه
      - left: minder
        right: کمتر
      status: correct
    feedback: بعد از *Stoppen met* و *beginnen met* فعالیت می‌آید.
    pairs:
    - left: stoppen met roken
      right: ترک کردن سیگار
