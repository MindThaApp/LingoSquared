teaching:
  nl.a2.unit27.lesson01.teach.huisarts:
    title: پزشک خانواده
    gloss: پزشک خانواده
    note: 'اسمی با حرف تعریف de: de huisarts؛ در درس‌های سلامت واحد ۱۶ هم آمده بود.'
    example_gloss: می‌خواهم از پزشک خانواده وقت بگیرم.
  nl.a2.unit27.lesson01.teach.afspraak_huisarts:
    title: درخواست وقت
    gloss: می‌خواهم از پزشک خانواده وقت بگیرم.
    note: الگوی afspraak maken از دیدار با شهرداری در واحد ۲۴ این‌جا با bij de huisarts تکرار شده است.
  nl.a2.unit27.lesson01.teach.reden_bezoek:
    title: منشی دلیلش را می‌پرسد
    gloss: دلیل مراجعه‌ی شما چیست؟
    note: سؤال رسمی و رایج هنگام گرفتن وقت پزشکی.
  nl.a2.unit27.lesson01.teach.paar_dagen_niet_lekker:
    title: گفتن اینکه چند وقت است حالتان خوب نیست
    gloss: چند روز است که حالم خوب نیست.
    note: Al een paar dagen (چند روز است) عبارت voel me niet lekker از واحد ۱۶ را با مدت زمان کامل می‌کند.
  nl.a2.unit27.lesson02.teach.klachten:
    title: علائم / شکایت‌ها
    gloss: علائم / شکایت‌ها
    note: 'اسم جمع با حرف تعریف de: de klachten، اصطلاح رایج پزشکی برای علائم بیماری.'
    example_gloss: چه علائمی دارید؟
  nl.a2.unit27.lesson02.teach.wat_zijn_klachten:
    title: پزشک درباره‌ی علائم می‌پرسد
    gloss: چه علائمی دارید؟
    note: سؤال رسمی شروع ویزیت.
  nl.a2.unit27.lesson02.teach.drie_dagen_klachten:
    title: توصیف علائم همراه با مدت
    gloss: سه روز است که سردرد و تب دارم.
    note: Al drie dagen (سه روز است) با زمان حال heb می‌آید تا علامتی را که ادامه دارد بیان کند؛ ساختارش مثل sinds vorige maand در واحد ۲۴ است.
  nl.a2.unit27.lesson02.teach.hoe_erg_pijn:
    title: پرسیدن درباره‌ی شدت
    gloss: درد چقدر شدید است؟
    note: Hoe erg (چقدر شدید) درباره‌ی شدت می‌پرسد و سؤال بعدیِ طبیعی است.
  nl.a2.unit27.lesson03.teach.griepje:
    title: سرماخوردگی خفیف
    gloss: یک سرماخوردگی خفیف
    note: 'اسمی با حرف تعریف het: het griepje، تصغیر griep (آنفلوآنزا). تصغیر آن را به چیزی کوچک تبدیل می‌کند، نه بیماری جدی.'
    example_gloss: احتمالاً یک سرماخوردگی خفیف دارید.
  nl.a2.unit27.lesson03.teach.waarschijnlijk_griepje:
    title: گفتن تشخیص احتمالی
    gloss: احتمالاً یک سرماخوردگی خفیف دارید.
    note: Waarschijnlijk (احتمالاً) تشخیص را مناسب نرم می‌کند، چون پزشک پیش از آزمایش‌های بیشتر حرف می‌زند.
  nl.a2.unit27.lesson03.teach.niet_ernstig:
    title: اطمینان دادن درباره‌ی شدت
    gloss: جدی نیست.
    note: Ernstig (جدی) صفتی کلیدی برای گفتن شدت یک بیماری است.
  nl.a2.unit27.lesson03.teach.geen_zorgen_formeel:
    title: دلداری دادن به‌صورت رسمی
    gloss: نگران نباش.
    note: شکل رسمیِ maak je geen zorgen در واحد ۲۱ است که به جای je از u/zich استفاده می‌کند.
  nl.a2.unit27.lesson04.teach.recept:
    title: نسخه
    gloss: نسخه
    note: 'اسمی با حرف تعریف het: het recept.'
    example_gloss: برایتان دارو می‌نویسم.
  nl.a2.unit27.lesson04.teach.schrijf_voor:
    title: پزشک دارو تجویز می‌کند
    gloss: برایتان دارو می‌نویسم.
    note: Voorschrijven (تجویز کردن) فعلی جداشدنی است؛ voor به آخر جمله می‌رود.
  nl.a2.unit27.lesson04.teach.pillen_innemen:
    title: مصرف دارو
    gloss: قرص‌ها را روزی دو بار بخورید و خوب استراحت کنید.
    note: Innemen (خوردن دارو) فعلی جداشدنی است و با nemen تنها فرق دارد؛ in به آخر جمله می‌رود.
  nl.a2.unit27.lesson04.teach.terugkomen_als:
    title: دستور پیگیری شرطی
    gloss: اگر بهتر نشدید، یک هفته‌ی دیگر برگردید.
    note: Als (اگر) شرط را بیان می‌کند؛ terugkomen (برگشتن) فعل جداشدنی است و terug آخر جمله می‌آید.
  nl.a2.unit27.lesson04.teach.infinitives_note:
    title: شکل‌های مصدر
    gloss: «خوردن قرص‌ها» و «برگشتن» مصدر این دو فعل جداشدنی هستند.
    note: Innemen و terugkomen شکل مصدر (شکل فرهنگ لغت) هستند، نه شکل‌های امری صرف‌شده (neem ... in، kom ... terug) که در جاهای دیگر این درس آمده‌اند.
  nl.a2.unit27.lesson05.teach.samenvatting:
    title: خواندن خلاصه‌ی ویزیت
    gloss: 'تشخیص: آنفلوآنزای خفیف. توصیه: خوب استراحت کنید و آب زیاد بنوشید. قرص‌های تجویزشده را روزی دو بار بخورید. اگر بعد از یک هفته هنوز حالتان بهتر نشده، یک وقت جدید بگیرید.'
    note: 'به این موارد دقت کنید: تشخیص، دو توصیه‌ی مربوط به شیوه‌ی زندگی، دستور مصرف دارو و شرط مراجعه‌ی بعدی.'
    glosses:
      Diagnose: تشخیص
      griepje: یک آنفلوآنزای خفیف (شکل تصغیر griepje که آن را کم‌اهمیت نشان می‌دهد)
      Advies: توصیه
      rust: استراحت کنید (امری؛ همراه با uit یعنی کامل استراحت کنید)
      uit: قید فعل «rust uit» (استراحت کردن)
      drink: بنوشید (امری از drinken)
      veel: زیاد، بسیار
      Neem: بخورید (امری از nemen)
      voorgeschreven: تجویزشده (صفت مفعولی از voorschrijven)
      pillen: قرص‌ها
      keer: بار (twee keer یعنی دو بار)
      dag: روز (per dag یعنی در روز)
      in: جزء جداشدنی فعل innemen (خوردن دارو)
      Voelt: احساس کردن (Voelt u zich یعنی احساس می‌کنید)
      zich: خودتان (ضمیر انعکاسی)
      na: بعد از
      nog: هنوز (در nog steeds یعنی هنوز هم)
      steeds: هنوز (در nog steeds یعنی هنوز هم)
      beter: بهتر
      Maak: بگیرید، ترتیب بدهید (امری از maken)
      dan: آن‌وقت، در آن صورت
      nieuwe: جدید
      afspraak: وقت ملاقات
  nl.a2.unit27.lesson06.teach.huisarts_ask_symptoms:
    title: پزشک مشاوره را شروع می‌کند
    gloss: 'پزشک: صبح بخیر، چه مشکلی دارید؟'
    note: سؤال wat zijn uw klachten? از درس دوم دوباره به کار رفته است.
  nl.a2.unit27.lesson06.teach.omar_symptoms:
    title: عمر علائمش را توضیح می‌دهد
    gloss: 'عمر: سه روز است که سردرد و تب دارم.'
    note: دقیقاً مثل مثال آموزشی درس دوم است؛ این همان ویزیت خود عمر است.
  nl.a2.unit27.lesson06.teach.huisarts_react_diagnose:
    title: پزشک واکنش نشان می‌دهد و تشخیص می‌دهد
    gloss: 'پزشک: ناراحت‌کننده است. احتمالاً آنفلوآنزای خفیفی دارید.'
    note: Klinkt (به نظر می‌رسد) همان الگوی dat klinkt fijn در درس ۱۸ است، این بار با vervelend (ناخوشایند).
  nl.a2.unit27.lesson06.teach.omar_ask_serious:
    title: عمر می‌پرسد جدی است یا نه
    gloss: 'عمر: جدی است؟'
    note: یک سؤال کوتاه و مستقیم با ernstig از درس سوم.
  nl.a2.unit27.lesson06.teach.huisarts_reassure_prescribe:
    title: پزشک خیالش را راحت می‌کند و نسخه می‌نویسد
    gloss: 'پزشک: نه، جدی نیست. برایتان نسخه می‌نویسم.'
    note: آرام‌کردن بیمار از درس سوم با الگوی نسخه‌نوشتن از درس چهارم ترکیب شده است.
  nl.a2.unit27.lesson06.teach.omar_thanks_doctor:
    title: عمر از پزشک تشکر می‌کند
    gloss: 'عمر: ممنون، آقای دکتر.'
    note: Dokter روش رایج و کمی غیررسمی برای خطاب مستقیم به پزشک است و با huisarts (عنوان حرفه‌ای) فرق دارد.
  nl.a2.unit27.lesson06.teach.huisarts_final_instructions:
    title: پزشک آخرین توصیه‌ها را می‌گوید
    gloss: 'پزشک: قرص‌ها را روزی دو بار بخورید و خوب استراحت کنید. نگران نباشید.'
    note: دستور مصرف دارو از درس چهارم با جمله‌ی رسمی دلداری از درس سوم ترکیب شده است.
  nl.a2.unit27.lesson06.teach.summary_grammar:
    title: خلاصه‌ی ویزیت
    gloss: عمر آنفلوآنزای خفیفی دارد. او باید قرص‌ها را روزی دو بار بخورد.
    note: moet + مصدر (moet ... innemen) ضرورت را بیان می‌کند و جزء in در آخر جمله به innemen چسبیده می‌ماند.
