teaching:
  nl.a2.unit79.lesson01.teach.vakantie:
    title: تعطیلات
    gloss: تعطیلات / تعطیلات تابستان
    note: هر دو کلمه de هستند. *Vakantie* واژه‌ی کلی است؛ *de zomervakantie* تعطیلات طولانی تابستان است.
    example_gloss:
    - در ماه اوت تعطیلات دارم.
    - تعطیلات تابستان در ماه ژوئیه شروع می‌شود.
  nl.a2.unit79.lesson01.teach.volgende_week:
    title: زمان وقوع کارها
    gloss: هفته‌ی آینده / سال آینده / به‌زودی
    note: '*Week* کلمه‌ی de است، پس می‌شود *volgende week*. *Jaar* کلمه‌ی het است، پس می‌شود *volgend jaar* (بدون -e آخر).'
    example_gloss:
    - هفته‌ی آینده یک قرار دارم.
    - سال آینده می‌خواهم به بلژیک بروم.
    - به‌زودی تعطیلات دارم.
  nl.a2.unit79.lesson01.teach.reizen_boeken:
    title: سه فعل سفر
    gloss: سفر کردن / رزرو کردن / ماندن
    note: این‌ها مصدر هستند. *Boeken* به‌عنوان اسم یعنی «کتاب‌ها» هم هست، ولی اینجا فعل «رزرو کردن» است.
    example_gloss:
    - دوست دارم با قطار سفر کنم.
    - می‌خواهم یک اتاق رزرو کنم.
    - یک هفته می‌مانم.
  nl.a2.unit79.lesson01.teach.hotel_camping:
    title: جای اقامت
    gloss: هتل / کمپینگ
    note: '*Het hotel* کلمه‌ی het است؛ *de camping* کلمه‌ی de است. می‌گویید *op de camping* ولی *in een hotel*.'
    example_gloss:
    - هتل نزدیک ساحل است.
    - ما در کمپینگ می‌خوابیم.
  nl.a2.unit79.lesson01.teach.vraag:
    title: پرسیدن درباره‌ی برنامه‌های تعطیلات
    gloss: در تعطیلات تابستان می‌خواهی چه کار کنی؟
    note: 'اینجا *gaan* فعل کمکی است: *ga* در جایگاه دوم و مصدر *doen* در آخر جمله.'
  nl.a2.unit79.lesson01.teach.gn_gaan:
    title: 'برنامه‌های نزدیک: gaan + مصدر'
    gloss: در ماه اوت می‌خواهم به آلمان سفر کنم. می‌خواهم یک هتل رزرو کنم.
    note: 'برای گفتن کاری که می‌خواهید انجام دهید، یکی از شکل‌های *gaan* را در جایگاه دوم بگذارید و مصدر را در آخر جمله بیاورید: *Ik ga een hotel boeken*. بقیه‌ی چیزها (زمان، مکان، مفعول) میان این دو می‌آیند. اگر قید زمان اول جمله بیاید، *ga* باز هم در جایگاه دوم می‌ماند: *Volgende week ga ik een hotel boeken*.'
  nl.a2.unit79.lesson01.teach.hotel_boeken:
    title: رزرو هتل
    gloss: می‌خواهم یک هتل رزرو کنم.
  nl.a2.unit79.lesson02.teach.cursus_verhuizen:
    title: سه برنامه برای بعد
    gloss: در یک دوره شرکت کردن / اسباب‌کشی کردن / پس‌انداز کردن
    note: '*Een cursus volgen* عبارت ثابت برای شرکت در یک دوره است. *Verhuizen* یعنی رفتن به خانه‌ی جدید.'
    example_gloss:
    - می‌خواهم در یک دوره شرکت کنم.
    - دایی‌ام می‌خواهد اسباب‌کشی کند.
    - می‌خواهم برای یک دوچرخه‌ی جدید پس‌انداز کنم.
  nl.a2.unit79.lesson02.teach.later_over:
    title: آینده‌ی دورتر
    gloss: بعداً / یک ماه دیگر
    note: '*Over een maand* یعنی «یک ماه دیگر»، یعنی یک ماه از الان. با بازه‌های زمانی دیگر هم کار می‌کند: *over een week*.'
    example_gloss:
    - بعداً می‌خواهم یک خانه بخرم.
    - یک ماه دیگر دوره‌ام شروع می‌شود.
  nl.a2.unit79.lesson02.teach.cursus_begint:
    title: دوره‌ای که شروع می‌شود
    gloss: یک ماه دیگر دوره‌ام شروع می‌شود.
  nl.a2.unit79.lesson02.teach.gn_van_plan:
    title: 'قصد و نیت: van plan zijn om ... te'
    gloss: قصد دارم یک دوره بگذرانم.
    note: 'برای گفتن کاری که قصد انجامش را دارید، از *ik ben van plan om* و بعد بقیه‌ی جمله استفاده کنید. مصدر آخر جمله می‌آید و *te* درست قبل از آن قرار می‌گیرد: *een cursus te volgen*. این ساختار برای کارهایی است که دوست دارید انجام بدهید، نه برای قرارهای قطعی.'
  nl.a2.unit79.lesson02.teach.verhuizen:
    title: قصد اسباب‌کشی
    gloss: قصد دارم اسباب‌کشی کنم.
  nl.a2.unit79.lesson02.teach.sparen:
    title: قصد پس‌انداز
    gloss: قصد دارم پس‌انداز کنم.
  nl.a2.unit79.lesson02.teach.gn_contrast:
    title: gaan یا van plan zijn؟
    gloss: فردا می‌روم بازار. بعداً قصد دارم اسباب‌کشی کنم.
    note: 'برای آینده‌ی نزدیک و قطعی از *gaan* استفاده کنید: *Morgen ga ik naar de markt*. برای قصدی که دورتر یا کمتر قطعی است از *van plan zijn* استفاده کنید: *Later ben ik van plan om te verhuizen*.'
  nl.a2.unit79.lesson03.teach.misschien:
    title: شاید و حتماً
    gloss: شاید / حتماً
    note: '*Misschien* تردید را نشان می‌دهد. *Zeker* یعنی «حتماً» یا «قطعاً».'
    example_gloss:
    - شاید فردا باران بیاید.
    - این حتماً خیلی باحال است.
  nl.a2.unit79.lesson03.teach.dit_jaar:
    title: امسال، این تابستان
    gloss: امسال / این تابستان
    note: '*Jaar* کلمه‌ی het است، پس *dit jaar*. *Zomer* کلمه‌ی de است، پس *deze zomer*.'
    example_gloss:
    - امسال به تعطیلات نمی‌روم.
    - این تابستان در خانه می‌مانم.
  nl.a2.unit79.lesson03.teach.blijf_thuis:
    title: ماندن در خانه
    gloss: این تابستان در خانه می‌مانم.
  nl.a2.unit79.lesson03.teach.gn_misschien:
    title: Misschien و ترتیب کلمات
    gloss: فردا می‌روم سر کار. شاید بعداً بروم سینما.
    note: '*Misschien* اول جمله به‌عنوان اولین جزء جمله حساب می‌شود، برای همین فعل درست بعد از آن می‌آید: *Misschien ga ik later naar de bioscoop*، نه *Misschien ik ga*. بعد از هر قید زمان هم همین‌طور است: *Morgen ga ik werken*.'
  nl.a2.unit79.lesson03.teach.gn_niet:
    title: گفتن اینکه قصد ندارید
    gloss: به تعطیلات نمی‌روم. قصد اسباب‌کشی ندارم.
    note: '*niet* را بعد از *ga* یا *ben* و قبل از بقیه‌ی برنامه بگذارید: *Ik ga niet op vakantie*. با *van plan zijn*، *niet* قبل از *van plan* می‌آید: *Ik ben niet van plan om te verhuizen*.'
  nl.a2.unit79.lesson04.teach.met_wie:
    title: دو عبارت پرسشی
    gloss: با چه کسی / چه مدت
    note: '*Met wie* درباره‌ی کسی می‌پرسد که با او کاری انجام می‌دهید. *Hoe lang* درباره‌ی یک مدت زمان می‌پرسد.'
    example_gloss:
    - با چه کسی به ساحل می‌روی؟
    - چه مدت می‌مانی؟
  nl.a2.unit79.lesson04.teach.waar_naartoe:
    title: کجا می‌روی؟
    gloss: کجا می‌روی؟
    note: '*Naartoe* آخر جمله‌ی پرسشی می‌آید و جهت را نشان می‌دهد.'
  nl.a2.unit79.lesson04.teach.met_wie_vakantie:
    title: با چه کسی؟
    gloss: با چه کسی به تعطیلات می‌روید؟
  nl.a2.unit79.lesson04.teach.hoe_lang_daar:
    title: چه مدت؟
    gloss: چقدر آنجا می‌مانید؟
  nl.a2.unit79.lesson04.teach.met_mijn_zus:
    title: جواب دادن
    gloss: با خواهرم می‌روم.
  nl.a2.unit79.lesson04.teach.wij_blijven:
    title: ما
    gloss: دو هفته می‌مانیم.
  nl.a2.unit79.lesson04.teach.weken:
    title: هفته‌ها
    gloss: یک هفته / دو هفته
    note: جمع *week* می‌شود *weken*.
    example_gloss:
    - یک هفته می‌مانم.
    - دو هفته می‌مانیم.
  nl.a2.unit79.lesson04.teach.gn_vragen:
    title: جمله‌های پرسشی با gaan
    gloss: کجا می‌روی؟ با چه کسی می‌روی؟ چه مدت می‌خواهی بمانی؟
    note: 'اول کلمه‌ی پرسشی را بگذارید، بعد *ga* در جایگاه دوم، بعد *je*. مصدر، اگر باشد، آخر جمله می‌آید: *Hoe lang ga je blijven?*'
  nl.a2.unit79.lesson05.teach.noor_bericht:
    title: پیامی از Noor
    gloss: سلام Lotte! به‌زودی تعطیلات دارم. در اوت با خواهرم به بلژیک می‌روم. یک هفته در هتل می‌مانیم. بعدش دو روز می‌روم پیش پدر و مادرم. سال بعد قصد دارم یک دوره بگذرانم. شاید آن موقع اسباب‌کشی هم بکنم. تو چه کار می‌کنی؟
    note: 'Noor برنامه‌های نزدیک را با *gaan* و قصد بلندمدت را با *van plan zijn* بیان می‌کند. دقت کنید که هر مصدر آخر جمله‌اش آمده است: *blijven*، *te volgen*، *verhuizen*.'
    glosses:
      binnenkort: به‌زودی
      vakantie: تعطیلات
      augustus: اوت
      zus: خواهر
      naar: به
      belgië: بلژیک
      hotel: هتل
      blijven: ماندن
      daarna: بعد از اون
      ouders: پدر و مادر
      dagen: روزها
      volgend: بعدی
      jaar: سال
      plan: قصد (van plan zijn = قصد داشتن)
      cursus: دوره
      volgen: گذراندن (دوره)
      misschien: شاید
      verhuizen: اسباب‌کشی کردن
      dan: آن موقع
      ook: همچنین
  nl.a2.unit79.lesson06.teach.lotte_vraag:
    title: Lotte از Omar درباره‌ی برنامه‌هایش می‌پرسد
    gloss: 'Lotte: سلام Omar! برای تعطیلات تابستان برنامه‌ای داری؟'
  nl.a2.unit79.lesson06.teach.omar_duitsland:
    title: عمر جواب می‌دهد
    gloss: 'Omar: آره! در اوت می‌روم آلمان. می‌خواهم یک هتل رزرو کنم.'
  nl.a2.unit79.lesson06.teach.lotte_met_wie:
    title: Lotte می‌پرسد با چه کسی می‌رود
    gloss: 'Lotte: چه خوب! با کی می‌روی؟'
  nl.a2.unit79.lesson06.teach.omar_oom:
    title: Omar می‌گوید با چه کسی و چه مدت
    gloss: 'Omar: با عمویم. یک هفته می‌مانیم.'
  nl.a2.unit79.lesson06.teach.lotte_later:
    title: Lotte درباره‌ی بعدتر می‌پرسد
    gloss: 'Lotte: بعدش چی؟ چه قصدی داری؟'
  nl.a2.unit79.lesson06.teach.omar_cursus:
    title: Omar قصدش را می‌گوید و می‌پرسد
    gloss: 'Omar: سال بعد قصد دارم یک دوره بگذرانم. تو چی؟'
  nl.a2.unit79.lesson06.teach.lotte_antwoord:
    title: لوته جواب می‌دهد
    gloss: 'Lotte: در ژوئیه می‌روم سر کار. شاید بعدش بروم پیش پدر و مادرم.'
