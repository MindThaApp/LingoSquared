teaching:
  nl.a2.unit78.lesson01.teach.weekend:
    title: آخر هفته / آخر هفتهٔ گذشته
    gloss: آخر هفته / آخر هفتهٔ گذشته (همان که تازه تمام شده)
    note: '*Het weekend* اسمی با حرف تعریف het است. *Afgelopen weekend* یعنی آخر هفته‌ای که تازه گذشته؛ برای تعریف کردن ماجرای «آخر هفتهٔ گذشته» عبارت طبیعی همین است.'
    example_gloss:
    - آخر هفته از شنبه شروع می‌شود.
    - آخر هفتهٔ گذشته کار کردم.
  nl.a2.unit78.lesson01.teach.zaterdag_zondag:
    title: شنبه و یکشنبه
    gloss: شنبه / یکشنبه
    note: در هلندی نام روزهای هفته با حرف کوچک نوشته می‌شود، مگر اینکه اولِ جمله بیاید.
    example_gloss:
    - شنبه بیکارم.
    - یکشنبه‌ها دیر بیدار می‌شوم.
  nl.a2.unit78.lesson01.teach.boodschappen:
    title: خرید و کارهای روزمره
    gloss: خرید کردن / کارهای بیرون از خانه را انجام دادن
    note: '*Boodschappen doen* عبارت ثابتی برای خرید مواد غذایی و کارهای کوچک بیرون از خانه است. *Boodschappen* جمع است و حرف تعریف نمی‌گیرد.'
    example_gloss: هر شنبه خرید می‌کنم.
  nl.a2.unit78.lesson01.teach.op_bezoek:
    title: رفتن به دیدن کسی
    gloss: به دیدن (کسی) رفتن
    note: '*Op bezoek gaan* یعنی به خانهٔ کسی رفتن؛ بعدش *bij* و اسم آن شخص می‌آید: *op bezoek bij mijn oom*.'
    example_gloss: من اغلب به دیدن دایی‌ام می‌روم.
  nl.a2.unit78.lesson01.teach.uitjes:
    title: جاهایی برای رفتن در آخر هفته
    gloss: بازار / پارک / سینما
    note: '*De markt* و *de bioscoop* با de می‌آیند؛ *het park* با het می‌آید.'
    example_gloss:
    - من سبزی را از بازار می‌خرم.
    - دوست دارم در پارک قدم بزنم.
    - شنبه می‌روم سینما.
  nl.a2.unit78.lesson01.teach.werken_koken:
    title: چهار فعل روزمره
    gloss: کار کردن / آشپزی کردن / خوردن / نوشیدن
    note: این‌ها مصدر هستند. بعداً در همین درس شکل گذشتهٔ آن‌ها را می‌سازید.
    example_gloss:
    - امروز باید کار کنم.
    - من خوب می‌توانم آشپزی کنم.
    - دلم می‌خواهد چیزی بخورم.
    - قهوه میل دارید؟
  nl.a2.unit78.lesson01.teach.vraag:
    title: پرسیدن اینکه کسی آخر هفتهٔ گذشته چه کار کرده
    gloss: آخر هفتهٔ گذشته چه کار کردی؟
    note: این سؤال رایج است. *Gedaan* اسم مفعولِ *doen* است و درست آخر جمله می‌آید.
  nl.a2.unit78.lesson01.teach.gn_frame:
    title: 'perfectum: heb/ben + اسم مفعول'
    gloss: شنبه خرید کردم. یکشنبه به خانهٔ دایی‌ام رفتم.
    note: '*perfectum* شکل رایج برای حرف زدن درباره کارهایی است که انجام داده‌اید. دو بخش دارد: یکی از شکل‌های *hebben* یا *zijn* در جای دوم جمله، و *اسم مفعول* (*gedaan*، *gegaan*) در آخر جمله. بقیهٔ اجزا (روز، مفعول، مکان) قبل از آن‌ها یا بینشان می‌آیند، اما *heb/ben* همیشه (در جملهٔ خبری) در جای دوم می‌ماند: *Zaterdag heb ik boodschappen gedaan.* بیشتر فعل‌ها با *hebben* می‌آیند؛ *gaan* با *zijn* می‌آید. درس ۳ توضیح می‌دهد کی.'
  nl.a2.unit78.lesson02.teach.weekend_verbs:
    title: چهار فعالیت آخر هفته
    gloss: قدم زدن / دوچرخه‌سواری کردن / بازی کردن / ورزش کردن
    note: '*Spelen* برای بازی‌ها، ورزش‌های توپی و نواختن ساز به کار می‌رود: *voetbal spelen*. *Sporten* یعنی به‌طور کلی ورزش کردن.'
    example_gloss:
    - بریم قدم بزنیم؟
    - فردا دوچرخه‌سواری می‌کنم.
    - بچه‌ها می‌خواهند بیرون بازی کنند.
    - می‌خواهم بیشتر ورزش کنم.
  nl.a2.unit78.lesson02.teach.gn_regular:
    title: 'اسم مفعول‌های باقاعده: ge- + ریشه + -t یا -d'
    gloss: کار کردن ← کار کرده، آشپزی کردن ← آشپزی کرده، قدم زدن ← قدم زده، بازی کردن ← بازی کرده، دوچرخه‌سواری کردن ← دوچرخه‌سواری کرده
    note: 'فعل‌های باقاعده اسم مفعول را این‌طور می‌سازند: *ge-* + ریشه + *-t* یا *-d*. ریشه همان شکلِ *ik* است: *werk*، *kook*، *wandel*، *speel*، *fiets*. پایانه کدام است؟ آخرین حرف ریشه را با آزمون *''t kofschip* بسنجید (فعلاً یک نگاه کوتاه؛ قاعدهٔ کامل بعداً می‌آید): اگر یکی از *t, k, f, s, ch, p* بود، *-t* بگیرید (*werk → gewerkt*، *kook → gekookt*، *fiets → gefietst*). برای هر حرف دیگر *-d* بگیرید (*wandel → gewandeld*، *speel → gespeeld*). آزمون را روی ریشه (شکل *ik*) انجام می‌دهید. یک استثنا برای بعد: اگر مصدر *v* یا *z* دارد (*leven, reizen*)، *-d* بگیرید: *geleefd, gereisd*.'
  nl.a2.unit78.lesson02.teach.gn_stem_t:
    title: وقتی ریشه از قبل به -t ختم می‌شود
    gloss: ورزش می‌کنم. ورزش کرده‌ام / ورزش کردم.
    note: 'اگر ریشه از قبل به *-t* (یا *-d*) ختم شود، چیزی اضافه نمی‌کنید: *sport → gesport*، نه *gesportt*. باز هم *ge-* را اول می‌آورید.'
  nl.a2.unit78.lesson02.teach.park_gewandeld:
    title: قدم زدن در پارک
    gloss: در پارک قدم زدم.
    note: '*Wandelen* اینجا با *hebben* می‌آید، چون مقصدی در کار نیست و فقط گشت و گذار است.'
  nl.a2.unit78.lesson02.teach.voetbal_gespeeld:
    title: فوتبال بازی کردن
    gloss: فوتبال بازی کردم.
    note: 'برای ورزش‌ها *gespeeld* می‌آید: *voetbal spelen → ik heb voetbal gespeeld*.'
  nl.a2.unit78.lesson03.teach.hebben_zijn:
    title: دو فعل کمکی
    gloss: داشتن / بودن
    note: 'در perfectum، *hebben* و *zijn* فعل کمکی هستند. شکل‌هایشان: *ik heb, ik ben*؛ *het heeft, het is*.'
    example_gloss:
    - دلم می‌خواهد دوچرخه هم داشته باشم.
    - ممکن است سرگرم‌کننده باشد.
  nl.a2.unit78.lesson03.teach.gn_irregular:
    title: 'اسم مفعول‌های بی‌قاعده: آن‌ها را به‌صورت کلمهٔ کامل یاد بگیرید'
    gloss: دیدن ← دیده، خواندن ← خوانده، خوابیدن ← خوابیده، خوردن ← خورده، نوشیدن ← نوشیده، خریدن ← خریده، انجام دادن ← انجام داده
    note: 'فعل‌های بی‌قاعده از قاعدهٔ *-t/-d* پیروی نمی‌کنند. بیشترشان باز هم با *ge-* شروع می‌شوند و خیلی‌هایشان به *-en* ختم می‌شوند: *gezien, gelezen, geslapen, gegeten, gedronken, gedaan*. تعدادی مثل *kopen → gekocht* به *-t* ختم می‌شوند ولی داخل کلمه عوض می‌شود. آزمون سریع: اگر اسم مفعول از افزودن یک *-t* یا *-d* معمولی به ریشه ساخته نشده، بی‌قاعده است و باید آن را به‌صورت کلمهٔ کامل یاد بگیرید.'
  nl.a2.unit78.lesson03.teach.film_gezien:
    title: تماشای فیلم
    gloss: یک فیلم دیدم.
    note: در هلندی برای رفتن به سینما و هم برای تماشای فیلم در خانه می‌گویند *een film zien* (دیدن فیلم).
  nl.a2.unit78.lesson03.teach.lang_geslapen:
    title: دو اسم مفعول در یک جمله
    gloss: مدت زیادی خوابیدم و کتاب خواندم.
    note: 'وقتی دو کار با یک *heb* دارید، می‌توانید *heb* دوم را حذف کنید: *Ik heb lang geslapen en een boek gelezen.*'
  nl.a2.unit78.lesson03.teach.bezocht:
    title: اسم مفعول بدون ge-
    gloss: به دیدن دایی‌ام رفتم.
    note: 'فعل‌هایی که با پیشوند بدون تکیه‌ای مثل *be-*، *ver-* یا *ont-* شروع می‌شوند، *ge-* نمی‌گیرند: *bezoeken → bezocht* (دیدن، ملاقات کردن). این یکی هم بی‌قاعده است. *Ik heb mijn oom bezocht* و *Ik ben op bezoek geweest bij mijn oom* تقریباً یک معنی دارند.'
  nl.a2.unit78.lesson03.teach.gn_aux:
    title: hebben یا zijn؟
    gloss: یک فیلم دیدم. به خانهٔ دایی‌ام رفتم. در خانه ماندم. خانهٔ دایی‌ام بودم. دیر شد.
    note: '*Hebben* فعل کمکیِ پیش‌فرض است: *Ik heb gewerkt, ik heb een film gezien*. *Zijn* را برای دو گروه به کار ببرید: (۱) رفتن به مکانی تازه، مثل *gaan* و *komen*، و (۲) بودن یا تغییر کردن، مثل *zijn, blijven, worden*. آزمون سریع: آیا خودِ فعل دربارهٔ رفتن یا آمدن به جایی، ماندن (*blijven*)، بودن (*zijn*) یا شدن (*worden*) است؟ پس *zijn*. توجه کنید که *het* با *is* می‌آید: *Het is laat geworden* (دیر شد). حرکت بدون مقصد با *hebben* می‌آید: *Ik heb in het park gewandeld*، ولی با مقصد با *zijn* می‌آید.'
  nl.a2.unit78.lesson03.teach.zijn_verbs:
    title: فعل‌های حرکت و تغییر (با zijn)
    gloss: رفتن ← رفته، آمدن ← آمده، ماندن ← مانده، شدن ← شده، بودن ← بوده
    note: 'این پنج فعل perfectum را با *zijn* می‌سازند: *ik ben gegaan, ik ben gekomen, ik ben gebleven, het is geworden, ik ben geweest*. اسم مفعول هر پنج فعل بی‌قاعده است.'
  nl.a2.unit78.lesson04.teach.eerst_daarna:
    title: اول و بعد
    gloss: اول / بعد از آن
    note: '*Eerst* و *daarna* کارها را به ترتیب می‌چینند. برای تعریف کردن آخر هفته به‌صورت پشت‌سرهم به این دو کلمه نیاز دارید.'
    example_gloss:
    - اول کار می‌کنم، بعد می‌روم ورزش.
    - اول غذا می‌خورم، بعد قهوه می‌نوشم.
  nl.a2.unit78.lesson04.teach.gn_order:
    title: 'تعریف کردن به ترتیب: eerst، daarna'
    gloss: اول به بازار رفتم، بعد آشپزی کردم.
    note: 'بعد از *eerst* یا *daarna*، فعل کمکی بلافاصله می‌آید و قبل از *ik* قرار می‌گیرد: *Daarna heb ik gekookt*، نه *Daarna ik heb gekookt*. اسم مفعول در هر بخش آخر آن بخش می‌ماند.'
  nl.a2.unit78.lesson04.teach.gn_niet:
    title: 'گفتن اینکه کاری را نکرده‌اید: niet'
    gloss: کار نکردم. کتاب را نخواندم. به خانهٔ دایی‌ام نرفتم.
    note: 'در perfectum، *niet* جلوی اسم مفعول می‌آید: *Ik heb niet gewerkt*. اگر جمله مفعولِ مشخصی دارد (*het boek*)، اول مفعول می‌آید و *niet* بعد از آن: *Ik heb het boek niet gelezen*. قبل از مکان یا جهت، *niet* جلوی آن می‌آید: *Ik ben niet naar mijn oom gegaan*. قید زمان مثل *zaterdag* قبل از *niet* می‌آید: *Ik heb zaterdag niet gewerkt*. هرگز *niet* را بعد از اسم مفعول نگذارید.'
  nl.a2.unit78.lesson04.teach.gn_geen:
    title: 'گفتن اینکه هیچ نداشتید: geen'
    gloss: قهوه نخوردم. وقت نداشتم.
    note: '*Geen* را جلوی اسم، به‌جای *een* یا به‌جای نبودنِ حرف تعریف به کار ببرید: *een film → geen film*، *koffie → geen koffie*، *tijd → geen tijd*. *Niet* را برای فعل‌ها، چیزهای مشخص (*het boek*) و مکان‌ها به کار ببرید. *Gehad* اسم مفعولِ *hebben* است.'
  nl.a2.unit78.lesson04.teach.lotte_gesport:
    title: لوته دربارهٔ ورزش می‌پرسد
    gloss: 'لوته: ورزش کردی؟'
    note: 'در سؤال بله/خیر فعل کمکی اول می‌آید: *Heb je gesport?*'
  nl.a2.unit78.lesson04.teach.omar_niet_gesport:
    title: عمر جواب منفی می‌دهد
    gloss: 'عمر: نه، ورزش نکردم.'
  nl.a2.unit78.lesson05.teach.noor_bericht:
    title: پیامی از نور
    gloss: سلام لوته! آخر هفتهٔ آرامی بود. شنبه صبح رفتم بازار و نان خریدم. بعدازظهر در پارک قدم زدم. عصر آشپزی کردم. ورزش نکردم و فیلم هم ندیدم. یکشنبه در خانه ماندم. خیلی خوابیدم و یک کتاب خواندم.
    note: 'نور به ترتیب برای لوته از آخر هفته‌اش می‌گوید: شنبه صبح، بعدازظهر و عصر، بعد یکشنبه. دقت کنید اسم مفعول در هر جمله کجا می‌آید: همیشه آخر جمله. *''s Middags* و *''s Avonds* یعنی «بعدازظهر» و «عصر».'
    glosses:
      hoi: سلام
      rustig: آرام
      weekend: آخر هفته
      geweest: بوده (اسم مفعول فعل «بودن»)
      zaterdagochtend: شنبه صبح
      markt: بازار
      brood: نان
      gekocht: خریده (اسم مفعول فعل «خریدن»)
      middags: بعدازظهر
      park: پارک
      gewandeld: قدم زده (اسم مفعول فعل «قدم زدن»)
      avonds: عصر
      gekookt: آشپزی کرده (اسم مفعول فعل «آشپزی کردن»)
      niet: نه / نیست
      gesport: ورزش کرده (اسم مفعول فعل «ورزش کردن»)
      geen: هیچ، نه
      film: فیلم
      gezien: دیده (اسم مفعول فعل «دیدن»)
      zondag: یکشنبه
      thuisgebleven: در خانه ماند
      lang: طولانی، مدت زیاد
      geslapen: خوابید
      boek: کتاب
      gelezen: خواند
  nl.a2.unit78.lesson06.teach.lotte_vraag:
    title: Lotte از آخر هفتهٔ Omar می‌پرسد
    gloss: 'Lotte: سلام Omar! آخر هفتهٔ پیش چه کار کردی؟'
  nl.a2.unit78.lesson06.teach.omar_zaterdag:
    title: Omar شنبه‌اش را تعریف می‌کند
    gloss: 'Omar: شنبه رفتم خونهٔ عموم تو آمستردام. اونجا ناهار خوردم.'
    note: '*Bij mijn oom* یعنی «خونهٔ عموی من، پیش عموم». *Naar mijn oom* جهت حرکت را نشان می‌دهد و *bij mijn oom* مکان را.'
  nl.a2.unit78.lesson06.teach.lotte_zondag:
    title: Lotte دربارهٔ یکشنبه می‌پرسد
    gloss: 'Lotte: چه خوب! یکشنبه چی؟'
  nl.a2.unit78.lesson06.teach.omar_zondag:
    title: Omar یکشنبه‌اش را تعریف می‌کند و می‌پرسد
    gloss: 'Omar: یکشنبه خونه موندم. خیلی خوابیدم و ورزش نکردم. تو چی؟'
  nl.a2.unit78.lesson06.teach.lotte_antwoord:
    title: Lotte آخر هفته‌اش را تعریف می‌کند
    gloss: 'Lotte: من رفتم پیش پدر و مادرم. خرید نکردم، ولی آشپزی کردم.'
exercises:
  nl.a2.unit78.lesson01.exercise01.choose_saturday_shopping:
    instruction: جملهٔ هلندی‌ای را انتخاب کنید که یعنی «شنبه خرید کردم.»
    correct_option: Zaterdag heb ik boodschappen gedaan.
    distractors:
