teaching:
  nl.a1.unit29.lesson01.teach.hobbies_set1:
    title: مطالعه، ورزش، آشپزی
    gloss: خواندن، ورزش کردن، آشپزی کردن
    note: 'سه فعل رایج سرگرمی: *lezen* (خواندن)، *sporten* (ورزش کردن) و *koken* (آشپزی کردن).'
    example_gloss:
    - دوست دارم کتاب بخونم.
    - شنبه‌ها ورزش می‌کنم.
    - دوست دارم برای دوستام آشپزی کنم.
  nl.a1.unit29.lesson01.teach.vrije_tijd:
    title: اوقات فراغت
    gloss: اوقات فراغت
    note: '*De vrije tijd* اسمی با حرف تعریف مشترک است: *de vrije tijd*. این عبارت کلیدی برای صحبت دربارهٔ سرگرمی‌هاست.'
    example_gloss: توی اوقات فراغتم دوست دارم کتاب بخونم.
  nl.a1.unit29.lesson01.teach.in_vrije_tijd:
    title: گفتن اینکه در اوقات فراغتتان چه کار می‌کنید
    gloss: توی اوقات فراغتم دوست دارم کتاب بخونم.
    note: '*Lees* صورت اول‌شخص مفرد فعل *lezen* (خواندن) است.'
  nl.a1.unit29.lesson02.teach.hobbies_set2:
    title: موسیقی، نقاشی، بازی ویدیویی
    gloss: گوش دادن به موسیقی، نقاشی کردن، بازی ویدیویی کردن
    note: 'سه فعل سرگرمی دیگر: *muziek luisteren* (موسیقی گوش دادن)، *tekenen* (نقاشی کشیدن) و *gamen* (بازی ویدئویی کردن)، که وام‌واژه‌ای رایج در هلندی است.'
    example_gloss:
    - دوست دارم به موسیقی گوش بدم.
    - من اغلب نقاشی می‌کشم.
    - دوست دارم با دوستام بازی ویدیویی کنم.
  nl.a1.unit29.lesson02.teach.luister_muziek:
    title: گفتن اینکه دوست دارید به موسیقی گوش بدید
    gloss: دوست دارم به موسیقی گوش بدم.
    note: '*Luisteren naar* (گوش دادن به) همیشه پیش از مفعولش *naar* می‌گیرد.'
  nl.a1.unit29.lesson02.teach.game_vrienden:
    title: گفتن اینکه دوست دارید با دوستانتان بازی ویدیویی کنید
    gloss: دوست دارم با دوستام بازی ویدیویی کنم.
    note: '*Met vrienden* (با دوستان) واژه‌ی *vrienden* را از درس اول دوباره به کار می‌برد.'
  nl.a1.unit29.lesson03.teach.frequency_set1:
    title: همیشه، اغلب، گاهی، هرگز
    gloss: همیشه، اغلب، گاهی، هرگز
    note: چهار قید اصلی تکرار. *Vaak* قبلاً در واحد ۵ در جمله‌ی *Zie je hem vaak?* آمده بود؛ سه‌تای دیگر در اینجا تازه‌اند.
    example_gloss:
    - من شنبه‌ها همیشه ورزش می‌کنم.
    - من اغلب کتاب می‌خونم.
    - من گاهی نقاشی می‌کشم.
    - من هرگز بازی ویدیویی نمی‌کنم.
  nl.a1.unit29.lesson03.teach.frequency_set2:
    title: هر هفته، هر آخر هفته
    gloss: هر هفته، هر آخر هفته
    note: '*Elke week* و *elk weekend* هر دو یعنی «هر»، اما شکل آن بسته به اسم عوض می‌شود؛ کارت بعدی را ببینید.'
    example_gloss:
    - من هر هفته برای دوستام آشپزی می‌کنم.
    - من هر آخر هفته ورزش می‌کنم.
  nl.a1.unit29.lesson03.teach.elke_elk_grammar:
    title: Elke و elk
    gloss: با اسم‌های de مثل week از elke استفاده می‌کنید. با اسم‌های het مثل weekend از elk استفاده می‌کنید.
    note: '*Week* اسمی با de است (*de week*)، پس *elke* می‌گیرد؛ *weekend* اسمی با het است (*het weekend*)، پس *elk* می‌گیرد؛ همان تفاوت de و het که در واحد ۲۳ بین *de rekening* و *het wisselgeld* دیدید.'
  nl.a1.unit29.lesson03.teach.vrije_tijd_vraag:
    title: پرسیدن دربارهٔ اوقات فراغت
    gloss: توی وقت آزادت چی کار می‌کنی؟
    note: این سؤال اصلی این درس است؛ با آن می‌توانید از هر کسی دربارهٔ سرگرمی‌هاش بپرسید.
  nl.a1.unit29.lesson04.teach.lotte_callback:
    title: Lotte بحث سرگرمی‌ها را پیش می‌کشد
    gloss: 'Lotte: ما اغلب با هم پیاده‌روی می‌کنیم. ولی تو در اوقات فراغتت دیگر چه کار می‌کنی، Omar؟'
    note: جمله‌ی *We wandelen vaak samen* به واحد ۱۳ برمی‌گردد، جایی که هم Lotte و هم Omar گفتند *wandelen* را دوست دارند.
  nl.a1.unit29.lesson04.teach.omar_cook_sport:
    title: سرگرمی‌های Omar
    gloss: 'Omar: من آشپزی را دوست دارم، توی خانه هم. و زیاد ورزش می‌کنم.'
    note: عبارت *Ook thuis* (توی خانه هم) روشن می‌کند که Omar فقط در کار رستورانش آشپزی نمی‌کند، بلکه برای تفریح هم می‌پزد.
  nl.a1.unit29.lesson04.teach.lotte_surprised:
    title: Lotte تعجب می‌کند
    gloss: 'Lotte: توی خانه هم آشپزی می‌کنی؟ تو که تمام روز سر کارت آشپزی می‌کنی!'
    note: عبارت *Al de hele dag* (از قبل تمام روز) تأکید می‌کند که Omar همین حالا هم سر کار خیلی آشپزی می‌کند.
  nl.a1.unit29.lesson04.teach.omar_relaxing:
    title: Omar توضیح می‌دهد
    gloss: 'Omar: آره، ولی به نظر من آشپزی آرامش‌بخش است. تو چی؟ تو چه کاری را دوست داری؟'
    note: در *Koken vind ik ontspannend* مفعول یعنی *koken* برای تأکید اول جمله آمده است؛ تقریباً یعنی «آشپزی، آن را آرامش‌بخش می‌دانم».
  nl.a1.unit29.lesson04.teach.lotte_reads_music:
    title: سرگرمی‌های Lotte
    gloss: 'Lotte: من کتاب خواندن را دوست دارم و زیاد به موسیقی گوش می‌دهم.'
    note: در این جمله دو فعل سرگرمی از درس‌های ۱ و ۲ با *en* (و) به هم وصل شده‌اند.
  nl.a1.unit29.lesson04.teach.omar_ask_game:
    title: Omar درباره‌ی بازی ویدیویی می‌پرسد
    gloss: 'Omar: تو هم بازی ویدیویی می‌کنی؟'
    note: یک سؤال کوتاه بله/نه با فعل *gamen* از درس ۲.
  nl.a1.unit29.lesson04.teach.lotte_no_game_draw:
    title: جواب Lotte
    gloss: 'Lotte: نه، من هیچ‌وقت بازی ویدیویی نمی‌کنم. ولی گاهی نقاشی می‌کشم!'
    note: '*Nooit* (هیچ‌وقت) و *soms* (گاهی) از درس ۳، که در یک جواب کنار هم آمده‌اند.'
  nl.a1.unit29.lesson05.teach.vergelijking:
    title: مقایسهٔ سرگرمی‌ها
    gloss: من و Omar زیاد با هم پیاده‌روی می‌کنیم. ولی سرگرمی‌های دیگری هم داریم. Omar آشپزی را دوست دارد، توی خانه هم، و زیاد ورزش می‌کند. من کتاب خواندن را دوست دارم و زیاد به موسیقی گوش می‌دهم. گاهی نقاشی می‌کشم، ولی هیچ‌وقت بازی ویدیویی نمی‌کنم. تو توی اوقات فراغتت چه کاری را دوست داری؟
    note: پیام Lotte مطالب درس ۴ را مرور می‌کند و با سؤال اصلی این واحد از خواننده تمام می‌شود.
    glosses:
      wandelen: قدم می‌زنیم
      vaak: اغلب
      samen: با هم
      andere: دیگر
      kookt: آشپزی می‌کند
      graag: دوست دارد
      thuis: توی خانه
      sport: ورزش می‌کند
      lees: بخوانم
      luister: گوش می‌دهم
      muziek: موسیقی
      teken: نقاشی می‌کشم
      soms: گاهی
      game: بازی ویدیویی می‌کنم
      nooit: هرگز
      vrije: آزاد
      tijd: وقت
  nl.a1.unit29.lesson06.teach.omar_ask_weekend:
    title: Omar درباره‌ی آخر هفته می‌پرسد
    gloss: 'Omar: این آخر هفته چه کار می‌کنی؟'
    note: عبارت *Dit weekend* (این آخر هفته) همان عبارت زمانی واحد ۱۹ است.
  nl.a1.unit29.lesson06.teach.lotte_unsure:
    title: Lotte مطمئن نیست
    gloss: 'Lotte: هنوز نمی‌دانم. کتاب خواندن را دوست دارم، ولی دلم می‌خواهد بروم بیرون هم.'
    note: عبارت *Naar buiten* (بیرون؛ تقریباً «به سمت بیرون») راه رایجی است برای گفتن اینکه می‌خواهید از خانه بیرون بروید.
  nl.a1.unit29.lesson06.teach.omar_suggest_walk_cook:
    title: Omar یک برنامه پیشنهاد می‌دهد
    gloss: 'Omar: بیا با هم پیاده‌روی کنیم؟ بعدش من برای ما غذا می‌پزم.'
    note: کلمه‌ی *Daarna* (بعدش) همان کلمه‌ی ترتیبی *eerst, dan, daarna* از واحد ۱۰ است.
  nl.a1.unit29.lesson06.teach.lotte_agree_both:
    title: Lotte موافقت می‌کند
    gloss: 'Lotte: ایده‌ی خوبی است! پیاده‌روی و آشپزی را هر دو دوست دارم.'
    note: '*Allebei* (هر دو) نشان می‌دهد Lotte دو کار را به یک اندازه دوست دارد، نه یکی را بیشتر از دیگری.'
  nl.a1.unit29.lesson06.teach.omar_confirm_saturday:
    title: Omar قرار را تأیید می‌کند
    gloss: 'Omar: عالی. پس شنبه می‌بینمت!'
    note: یک جمله‌ی دوستانه‌ی پایانی که قرار *zaterdag* (شنبه) را تأیید می‌کند.
