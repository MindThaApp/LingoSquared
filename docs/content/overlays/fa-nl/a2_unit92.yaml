course:
  title: هلندی A2
  description: هلندی سطح A2 با تمرکز بر دستور زبان، برای گفتن دلیل و نتیجه.
  learning_goal: با omdat، want و dus در یک پیام هم دلیل را بگویید و هم نتیجه را.
units:
  nl.a2.unit92.omdat_want_dus:
    title: چون، زیرا، پس
    description: با گفتن دلیل و نتیجه، بهانه یا تغییر برنامه‌تان را توضیح بدهید.
lessons:
  nl.a2.unit92.lesson01.reden_en_gevolg:
    title: دلیل و نتیجه
  nl.a2.unit92.lesson02.omdat_werkwoord_achteraan:
    title: 'omdat: فعل آخر جمله'
  nl.a2.unit92.lesson03.omdat_want_of_dus:
    title: omdat، want یا dus؟
  nl.a2.unit92.lesson04.afspraak_verzetten:
    title: عوض کردن قرار
  nl.a2.unit92.lesson05.noors_bericht:
    title: پیام Noor
  nl.a2.unit92.lesson06.lotte_en_omar:
    title: Lotte و Omar
teaching:
  nl.a2.unit92.lesson01.teach.klachten:
    title: دلیل‌هایی برای نیامدن
    gloss: بیمار / خسته / سرشلوغ / سردرد
    note: این کلمه‌ها اغلب برای گفتن دلیل به کار می‌روند.
    example_gloss:
    - من بیمارم.
    - Omar خسته است.
    - Lotte سرش شلوغ است.
    - سردرد دارم.
  nl.a2.unit92.lesson01.teach.plannen:
    title: قرار، کار و آب‌وهوا
    gloss: قرار / کار / آب‌وهوا / قطار
    note: قرار، کار و آب‌وهوا دلیل‌های رایجی برای تغییر برنامه‌اند.
    example_gloss:
    - با Noor قرار دارم.
    - کار زیادی دارم.
    - هوا بد است.
    - باران می‌بارد.
    - قطار دیر کرده.
  nl.a2.unit92.lesson01.teach.gevolgen:
    title: پیامد
    gloss: ماندن / آمدن / خانه / بعداً / نه
    note: این کلمه‌ها می‌گویند به‌خاطر یک دلیل چه کاری می‌کنید.
    example_gloss:
    - من خونه می‌مونم.
    - عمر خونه می‌مونه.
    - من بعداً می‌آم.
    - من نمی‌آم.
  nl.a2.unit92.lesson01.teach.gn_reden_gevolg:
    title: دلیل و نتیجه
    gloss: 'پیامد: من خونه می‌مونم. دلیل: بارون می‌آد. یک پیام هم دلیل را می‌گه، هم پیامد را.'
    note: دلیل می‌گوید چرا. پیامد می‌گوید به‌خاطر آن دلیل چه اتفاقی می‌افتد. در این درس هر دو را در یک پیام می‌گذارید.
  nl.a2.unit92.lesson01.teach.gn_want:
    title: want دلیل را می‌رساند
    gloss: 'با want دلیل را می‌گویید. ترتیب کلمه‌ها عوض نمی‌شود: من خونه می‌مونم، چون بارون می‌آد.'
    note: '*Want* دو جمله‌ی اصلیِ معمولی را به هم وصل می‌کند. هر جمله ترتیب معمول خودش را نگه می‌دارد: در *het regent* فعل در جایگاه دوم است.'
  nl.a2.unit92.lesson01.teach.gn_dus:
    title: dus پیامد را می‌رساند
    gloss: 'با dus پیامد را می‌گویید: بارون می‌آد، پس من خونه می‌مونم.'
    note: '*Dus* دو جمله‌ی اصلی را به هم وصل می‌کند: *het regent, dus ik blijf thuis*. در این درس الگوی *dus ik ...* را تمرین می‌کنید.'
  nl.a2.unit92.lesson01.teach.zinnen:
    title: دو پیام کامل
    gloss: خسته‌ام، پس خونه می‌مونم. نمی‌آم، چون سرم درد می‌کنه.
  nl.a2.unit92.lesson02.teach.waarom:
    title: چرا و چون
    gloss: چرا / چون
    note: '*Waarom* دلیل را می‌پرسد؛ *omdat* جواب را شروع می‌کند.'
    example_gloss:
    - چرا نمی‌آی؟
    - چون مریضم.
    - چرا خونه می‌مونی؟
    - چون بارون می‌آد.
  nl.a2.unit92.lesson02.teach.modaal:
    title: باید، می‌توانم و امشب
    gloss: باید / توانستن / کار کردن / امشب
    note: این فعل‌ها در بهانه‌آوردن خیلی رایج‌اند.
    example_gloss:
    - من باید کار کنم.
    - امشب نمی‌تونم بیام.
    - عمر باید کار کنه.
  nl.a2.unit92.lesson02.teach.gn_omdat:
    title: omdat فعل را به آخر جمله می‌فرستد
    gloss: 'بعد از omdat فعل صرف‌شده آخر جمله می‌آید: چون بارون می‌آد؛ چون مریضم؛ چون قرار دارم.'
    note: '*Omdat* یک جمله‌ی وابسته شروع می‌کند. فعل صرف‌شده به آخر جمله می‌رود: *omdat ik ziek ben*، نه *omdat ik ben ziek*.'
  nl.a2.unit92.lesson02.teach.gn_omdat_modaal:
    title: دو فعل در آخر جمله
    gloss: 'با moeten یا kunnen دو فعل آخر جمله می‌آیند: چون باید کار کنم؛ چون نمی‌تونم بیام.'
    note: 'در جمله‌ی وابسته هر دو فعل آخر جمله می‌آیند و فعل کمکی اول است: *moet werken*، *kan komen*.'
  nl.a2.unit92.lesson02.teach.zinnen:
    title: دو جمله با omdat
    gloss: خونه می‌مونم چون مریضم. نمی‌آم چون باید کار کنم.
  nl.a2.unit92.lesson03.teach.woorden:
    title: زمان و ابراز تأسف
    gloss: امروز / فردا / متأسفانه / حیف
    note: '*Helaas* و *jammer* معمولاً بهانه را شروع می‌کنند.'
    example_gloss:
    - امروز خونه می‌مونم.
    - فردا دیرتر می‌آم.
    - متأسفانه سرم درد می‌کنه.
    - حیف شد، نمی‌تونم بیام.
  nl.a2.unit92.lesson03.teach.gn_contrast:
    title: omdat در مقابل want و dus
    gloss: 'Omdat: فعل آخر جمله می‌آید. Want: ترتیب کلمه‌ها عوض نمی‌شود. Dus: پیامد را می‌رساند.'
    note: '*Omdat* و *want* یک معنی دارند، اما ترتیب کلمه‌هایشان فرق می‌کند: *omdat ik ziek ben* ولی *want ik ben ziek*.'
  nl.a2.unit92.lesson03.teach.gn_voorop:
    title: جمله‌ی omdat در اول جمله
    gloss: 'اگر جمله‌ی omdat اول بیاید، جمله‌ی اصلی اول با فعل و بعد با نهاد شروع می‌شود: چون بارون می‌آد، خونه می‌مونم.'
    note: 'بعد از جمله‌ی *omdat* که اول آمده، جمله‌ی اصلی جای فعل و نهاد را عوض می‌کند: *blijf ik thuis*. *Want* این کار را نمی‌کند: *want ik blijf thuis*، نه *want blijf ik thuis*.'
  nl.a2.unit92.lesson03.teach.zinnen:
    title: اول جمله‌ی omdat
    gloss: چون بارون می‌آد، خونه می‌مونم. چون قطار دیر کرده، دیرتر می‌آم.
  nl.a2.unit92.lesson04.teach.verzetten:
    title: عوض کردن یک برنامه
    gloss: ببخشید / همکار / جابه‌جا کردن / وقت
    note: با این کلمه‌ها می‌تونید مؤدبانه قرار را لغو کنید و زمان جدیدی پیشنهاد بدید.
    example_gloss:
    - ببخشید، نمی‌تونم بیام.
    - همکارم مریضه.
    - می‌شود قرار را عوض کنیم؟
    - فردا وقت داری؟
  nl.a2.unit92.lesson04.teach.gn_bericht:
    title: پیامی با دلیل و پیامد
    gloss: 'یک پیام خوب شامل عذرخواهی، پیامد، دلیل و یک سؤال است: ببخشید، نمی‌تونم بیام، چون باید کار کنم. می‌شه قرار را جابه‌جا کنیم؟'
    note: اول پیامد را بگذارید (*ik kan niet komen*)، بعد دلیل را با *omdat* یا *want* اضافه کنید، و آخر یک سؤال بپرسید.
  nl.a2.unit92.lesson04.teach.collega:
    title: اول دلیل، بعد پیامد
    gloss: همکارم مریضه، پس من باید کار کنم.
  nl.a2.unit92.lesson05.teach.woorden:
    title: کلمه‌هایی برای پیام
    gloss: هم / شدید / پس‌فردا / فعلاً (خداحافظی صمیمی)
    note: این کلمه‌ها در پیام نورا آمده‌اند.
    example_gloss:
    - بارون هم می‌آد.
    - بارون شدید می‌آد.
    - پس‌فردا وقت دارید؟
    - فعلاً، عمر.
  nl.a2.unit92.lesson05.teach.reading:
    title: نورا برنامه را عوض می‌کند
    gloss: سلام لوته، ببخشید، امشب نمی‌تونم بیام، چون سرم درد می‌کنه. بارون شدیدی هم می‌آد، پس خونه می‌مونم. فردا هم نمی‌تونم، چون باید کار کنم. پس‌فردا وقت داری؟ می‌شه قرار را جابه‌جا کنیم؟ فعلاً، نورا
    note: در هر جمله دلیل و پیامد را پیدا کنید.
    glosses:
      Hoi: سلام
      vanavond: امشب
      hoofdpijn: سردرد
      ook: همچنین
      hard: شدید
      overmorgen: پس‌فردا
      groetjes: فعلاً
      verzetten: جابه‌جا کردن
  nl.a2.unit92.lesson06.teach.lotte_vraagt:
    title: لوته می‌پرسد
    gloss: سلام عمر، امشب می‌آی؟
  nl.a2.unit92.lesson06.teach.omar_nee:
    title: عمر نه می‌گوید
    gloss: نه، ببخشید، نمی‌تونم بیام.
  nl.a2.unit92.lesson06.teach.lotte_waarom:
    title: لوته می‌پرسد چرا
    gloss: چرا نمی‌آی؟
  nl.a2.unit92.lesson06.teach.omar_reden:
    title: عمر دلیل و پیامد را می‌گوید
    gloss: چون همکارم مریضه. اون نمی‌تونه کار کنه، پس من امشب کار می‌کنم.
  nl.a2.unit92.lesson06.teach.lotte_verzetten:
    title: لوته تغییر پیشنهاد می‌دهد
    gloss: حیف شد! می‌شه قرار را جابه‌جا کنیم؟
  nl.a2.unit92.lesson06.teach.omar_graag:
    title: عمر قبول می‌کند و می‌پرسد
    gloss: آره، خوشحال می‌شم. تو فردا وقت داری؟
  nl.a2.unit92.lesson06.teach.lotte_morgen:
    title: لوته روی یک روز موافقت می‌کند
    gloss: آره، فردا وقت دارم.
exercises:
  nl.a2.unit92.lesson01.exercise01.choose_want:
    instruction: جمله‌ی هلندی‌ای را انتخاب کنید که معنی جمله‌ی داده‌شده را می‌رساند.
    correct_option: Ik blijf thuis, want ik ben ziek.
    distractors:
    - Ik blijf thuis, dus ik ben ziek.
    - Ik ben ziek, want ik blijf thuis.
    - Ik blijf thuis, want ik ben niet ziek.
    accepted_answers:
    - value: Ik blijf thuis, want ik ben ziek.
      status: correct
    feedback: '*Want ik ben ziek* دلیل را می‌گوید؛ جمله‌ی اصلی *Ik blijf thuis* می‌گوید چه اتفاقی می‌افتد.'
    prompt_blocks:
    - من در خانه می‌مانم چون بیمارم.
  nl.a2.unit92.lesson01.exercise02.choose_dus:
    instruction: جمله‌ی هلندی‌ای را انتخاب کنید که معنی جمله‌ی داده‌شده را می‌رساند.
    correct_option: Het regent, dus ik blijf thuis.
    distractors:
