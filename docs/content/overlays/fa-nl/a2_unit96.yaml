course:
  title: هلندی A2
  description: هلندی سطح A2 با تمرکز بر دستور زبان برای پرسیدن مؤدبانه‌ی اطلاعات.
  learning_goal: با waar، wanneer، hoe laat، wie، wat و of سؤال‌های غیرمستقیم مؤدبانه بپرسید؛ فعل در آخر جمله‌ی پیرو می‌آید.
units:
  nl.a2.unit96.weet_u_waar:
    title: می‌دانید ... کجاست؟
    description: با سؤال‌های غیرمستقیم، در ایستگاه، اداره و موزه مؤدبانه اطلاعات بپرسید.
lessons:
  nl.a2.unit96.lesson01.weet_u_waar:
    title: می‌دانید ایستگاه کجاست؟
  nl.a2.unit96.lesson02.wanneer_en_hoe_laat:
    title: کی و چه ساعتی
  nl.a2.unit96.lesson03.weet_u_of:
    title: می‌دانید باز است یا نه؟
  nl.a2.unit96.lesson04.kunt_u_mij_zeggen:
    title: می‌توانید به من بگویید ...؟
  nl.a2.unit96.lesson05.omars_bericht:
    title: پیام عمر
  nl.a2.unit96.lesson06.lotte_en_omar:
    title: لوته و عمر در موزه
teaching:
  nl.a2.unit96.lesson01.teach.plaatsen:
    title: مکان‌ها
    gloss: ایستگاه / اداره / موزه / کتابخانه / باجه / خروجی
    note: این‌ها جاهایی هستند که اغلب درباره‌شان سؤال می‌کنید.
    example_gloss:
    - ایستگاه کجاست؟
    - خروجی کجاست؟
  nl.a2.unit96.lesson01.teach.weten:
    title: دانستن و کجا
    gloss: دانستن / کجا / شما (رسمی) / تو (صمیمی) / تو (صمیمی، با تأکید)
    note: '*Weet* شکل فعل بعد از u، je و jij است.'
    example_gloss:
    - می‌دانید؟ (رسمی)
    - می‌دانی؟ (صمیمی)
    - می‌دانی؟ (صمیمی)
  nl.a2.unit96.lesson01.teach.open:
    title: باز و بسته
    gloss: باز / بسته
    example_gloss:
    - موزه باز است.
    - اداره بسته است.
  nl.a2.unit96.lesson01.teach.gn_indirect:
    title: از سؤال مستقیم تا غیرمستقیم
    gloss: یک سؤال مستقیم و همان سؤال به‌صورت غیرمستقیم.
    note: 'در سؤال مستقیم، فعل در جایگاه دوم است: *Waar IS het station?* بعد از *Weet u ...* سؤال به جمله‌ی پیرو تبدیل می‌شود و فعل به آخر همان جمله می‌رود: *Weet u waar het station IS?*'
  nl.a2.unit96.lesson01.teach.gn_u_je:
    title: u یا je
    gloss: راه‌های رسمی و صمیمی برای پرسیدن یک چیز.
    note: با غریبه‌ها و در اداره‌ها از *u* و با دوستان از *je* یا *jij* استفاده کنید. شکل فعل، یعنی *weet*، تغییر نمی‌کند. لوته و عمر از *je* استفاده می‌کنند.
  nl.a2.unit96.lesson01.teach.zinnen:
    title: دو سؤال
    gloss: می‌دانید موزه کجاست؟ می‌دانی کتابخانه کجاست؟
  nl.a2.unit96.lesson02.teach.vraagwoorden:
    title: کلمه‌های پرسشی
    gloss: کی / چه ساعتی / چه کسی / چه چیزی
    note: این کلمه‌های پرسشی در سؤال غیرمستقیم مثل *waar* کار می‌کنند.
    example_gloss:
    - موزه کی باز است؟
    - ساعت چند است؟
    - او کیست؟ او لوته است.
    - این چیست؟ این یک موزه است.
  nl.a2.unit96.lesson02.teach.werkwoorden:
    title: فعل‌های کاربردی
    gloss: باز شدن / بسته شدن / حرکت کردن / قیمت داشتن
    example_gloss:
    - موزه ساعت ده باز می‌شود.
    - اداره ساعت پنج بسته می‌شود.
    - قطار ساعت نه حرکت می‌کند.
    - بلیت ده یورو قیمت دارد.
  nl.a2.unit96.lesson02.teach.tijd:
    title: قطار و ساعت
    gloss: قطار / بلیت / ساعت / فردا / امروز / ده / پنج / نه
    example_gloss:
    - بلیت چند است؟ ده یورو.
    - قطار کی حرکت می‌کند؟ فردا.
    - او نوئر است.
    - اداره نزدیک ایستگاه است.
  nl.a2.unit96.lesson02.teach.gn_wanneer:
    title: Wanneer و hoe laat
    gloss: سؤال‌های غیرمستقیم با wanneer و hoe laat.
    note: 'کلمه‌ی پرسشی در ابتدا می‌ماند و فعل به آخر می‌رود: *wanneer het museum opent*، *hoe laat de trein vertrekt*. برای روز یا زمان کلی از *wanneer* و برای ساعت از *hoe laat* استفاده کنید.'
  nl.a2.unit96.lesson02.teach.gn_wie_wat:
    title: Wie و wat
    gloss: سؤال‌های غیرمستقیم با wie و wat.
    note: '*Wie* و *wat* از همین الگو پیروی می‌کنند. فعل در آخر است: *wie dat is*، *wat het kaartje kost*.'
  nl.a2.unit96.lesson02.teach.zinnen:
    title: دو سؤال
    gloss: می‌دانی اداره ساعت چند بسته می‌شود؟ می‌دانید موزه کی باز می‌شود؟
  nl.a2.unit96.lesson03.teach.of:
    title: Of, ja, nee
    gloss: آیا / بله / نه / نه (برای منفی کردن)
    example_gloss:
    - موزه باز است؟ بله.
    - اداره باز است؟ نه.
  nl.a2.unit96.lesson03.teach.gn_of:
    title: 'سؤال بله/خیر: of'
    gloss: سؤال بله/خیر که با of غیرمستقیم پرسیده می‌شود.
    note: 'سؤال بله/خیر کلمه‌ی پرسشی ندارد، برای همین سؤال غیرمستقیم با *of* («آیا») شروع می‌شود. فعل به آخر می‌رود: *of de bibliotheek open IS*.'
  nl.a2.unit96.lesson03.teach.gn_contrast:
    title: waar یا of؟
    gloss: مقایسه‌ی سؤال با کلمه‌ی پرسشی و سؤال بله/خیر.
    note: اگر کلمه‌ی پرسشی (*waar, wanneer, hoe laat, wie, wat*) وجود دارد، همان را نگه دارید. اگر جواب سؤال *ja* یا *nee* است، از *of* استفاده کنید. هرگز هر دو را با هم نیاورید.
  nl.a2.unit96.lesson03.teach.gn_weet_niet:
    title: Ik weet niet ...
    gloss: گفتن اینکه نمی‌دانید.
    note: 'بعد از *Ik weet niet* همان جمله‌ی پیرو می‌آید و فعل در آخر است. برای جواب کوتاه بگویید: *Ik weet het niet.*'
  nl.a2.unit96.lesson03.teach.zinnen:
    title: دو پاسخ
    gloss: نمی‌دانم. نمی‌دانم اداره باز است یا نه.
  nl.a2.unit96.lesson04.teach.richting:
    title: مسیریابی
    gloss: مستقیم / چپ / راست / چطور / می‌آیم / به، نزدیکِ
    note: '*Hoe kom ik bij ...?* برای پرسیدن آدرس است.'
    example_gloss:
    - ایستگاه مستقیم است.
    - خروجی سمت چپ است.
    - اداره سمت راست است.
    - چطور به ایستگاه برسم؟
  nl.a2.unit96.lesson04.teach.beleefd:
    title: کلمه‌های مؤدبانه
    gloss: ببخشید / می‌توانید (رسمی) / می‌توانی (صمیمی) / به من / به من (بدون تأکید) / گفتن / می‌خواهم / با کمال میل (دوست دارم) / دانستن
    note: '*Mij* و *me* هر دو یعنی «به من». *Kunt u* با u می‌آید و *kun je* با je.'
    example_gloss:
    - ببخشید، باجه کجاست؟
    - دوست دارم بدانم باجه کجاست.
  nl.a2.unit96.lesson04.teach.uitje:
    title: یک گردش
    gloss: ما / رفتن / به
    example_gloss:
    - فردا به موزه می‌رویم.
    - می‌دانید کی به موزه می‌رویم؟
  nl.a2.unit96.lesson04.teach.gn_kunt_u:
    title: Kunt u mij zeggen ...?
    gloss: راهی مؤدبانه برای پرسیدن اطلاعات.
    note: 'در این سؤال فعل اول می‌آید: *Kunt u* / *Kun je*. بعد *mij zeggen* و سؤال غیرمستقیم می‌آید که فعلش در آخر است. با je شکل معمول *kun je* است.'
  nl.a2.unit96.lesson04.teach.gn_wil_weten:
    title: Ik wil graag weten ...
    gloss: یک جمله‌ی خبری مؤدبانه به‌جای سؤال.
    note: '*Ik wil graag weten* جمله‌ای خبری و مؤدبانه برای درخواست اطلاعات است. بعد از آن سؤال غیرمستقیم با فعلِ آخر می‌آید.'
  nl.a2.unit96.lesson04.teach.gn_hoe_kom:
    title: Hoe ik ... kom
    gloss: پرسیدن آدرس به‌صورت غیرمستقیم.
    note: '*Hoe kom ik bij het station?* می‌شود *hoe ik bij het station kom*: فعل *kom* بعد از *bij het station* به آخر جمله می‌رود.'
  nl.a2.unit96.lesson04.teach.zinnen:
    title: در ایستگاه
    gloss: ببخشید، می‌توانید بگویید باجه کجاست؟ دوست دارم بدانم قطار ساعت چند حرکت می‌کند.
  nl.a2.unit96.lesson05.teach.reading:
    title: پیام عمر به لوته
    gloss: سلام لوته، فردا به موزه می‌رویم. نمی‌دانم موزه کجاست. می‌دانی چطور به ایستگاه برسم؟ دوست دارم بدانم قطار ساعت چند حرکت می‌کند. می‌دانی موزه باز است یا نه؟ با سلام، عمر
    note: دقت کنید که عمر برای سؤال‌هایش از سه شروع‌کننده‌ی متفاوت استفاده می‌کند.
    glosses:
      Hoi: سلام
      Groeten: با احترام
      ook: همچنین
  nl.a2.unit96.lesson06.teach.omar_vraagt_waar:
    title: عمر صحبت می‌کند
    gloss: سلام لوته، می‌دانی موزه کجاست؟
  nl.a2.unit96.lesson06.teach.lotte_wijst:
    title: لوته صحبت می‌کند
    gloss: بله، مستقیم برو و بعد چپ.
  nl.a2.unit96.lesson06.teach.omar_vraagt_tijd:
    title: عمر صحبت می‌کند
    gloss: می‌دانی ساعت چند باز می‌شود؟
  nl.a2.unit96.lesson06.teach.lotte_tijd:
    title: لوته صحبت می‌کند
    gloss: ساعت ده باز می‌شود.
  nl.a2.unit96.lesson06.teach.omar_vraagt_open:
    title: عمر صحبت می‌کند
    gloss: تو هم می‌دونی امروز موزه باز هست یا نه؟
  nl.a2.unit96.lesson06.teach.lotte_weet_niet:
    title: لوته صحبت می‌کند
    gloss: نمی‌دونم امروز باز هست یا نه.
