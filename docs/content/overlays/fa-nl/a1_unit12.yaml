teaching:
  nl.a1.unit12.lesson01.teach.completed_event:
    title: گذشتهٔ روزمرهٔ هلندی
    gloss: در گفت‌وگو، برای رویداد تمام‌شده معمولاً از hebben یا zijn به‌اضافهٔ اسم مفعول استفاده می‌شود.
    note: در هلندی گفتاری، برای رویداد تمام‌شده معمولاً همین ساختار با فعل کمکی و اسم مفعول به کار می‌رود. *Ik heb koffie gedronken* یعنی «قهوه خوردم»؛ معنایش فقط «قهوه خورده‌ام» نیست.
  nl.a1.unit12.lesson01.teach.drinken_model:
    title: قهوه خوردم
    gloss: نوشیدن → قهوه خوردم.
    note: '*Heb* فعل کمکی و *gedronken* اسم مفعولِ *drinken* است.'
  nl.a1.unit12.lesson01.teach.gaan_model:
    title: به سوپرمارکت رفتم
    gloss: رفتن → به سوپرمارکت رفتم.
    note: '*Gaan* با *zijn* می‌آید: *ik ben gegaan*.'
  nl.a1.unit12.lesson01.teach.word_order:
    title: اسم مفعول آخر جمله می‌آید
    gloss: 'اسم مفعول آخر جمله می‌آید: Ik heb koffie gedronken. به جایگاه آخرِ op در Ik sta op فکر کنید.'
    note: در واحد 10 تمرین کردید که به عنصر مهمِ آخر جمله گوش بدهید. اینجا عنصر آخر، اسم مفعول است.
  nl.a1.unit12.lesson02.teach.hebben_rule:
    title: بیشتر فعل‌ها با hebben می‌آیند
    gloss: بیشتر فعل‌ها با hebben می‌آیند.
    note: در این واحد، *hebben* را با *drinken*، *eten*، *werken* و *kopen* به کار ببرید.
  nl.a1.unit12.lesson02.teach.drinken:
    title: Drinken با hebben
    gloss: نوشیدن → قهوه خوردم.
    note: 'الگوی کامل این است: *ik + heb + مفعول + gedronken*.'
  nl.a1.unit12.lesson02.teach.eten:
    title: Eten با hebben
    gloss: خوردن → نان خوردم.
    note: اسم مفعولِ *eten*، *gegeten* است.
  nl.a1.unit12.lesson02.teach.werken:
    title: Werken با hebben
    gloss: کار کردن → کار کردم.
    note: اسم مفعولِ *werken*، *gewerkt* است.
  nl.a1.unit12.lesson02.teach.kopen:
    title: Kopen با hebben
    gloss: خریدن → سیب خریدم.
    note: اسم مفعولِ *kopen*، *gekocht* است.
  nl.a1.unit12.lesson03.teach.zijn_rule:
    title: Gaan و komen با zijn می‌آیند
    gloss: با gaan و komen از zijn استفاده کنید.
    note: این دو فعل حرکتیِ پرکاربرد در ساختار رویداد تمام‌شده‌ای که اینجا یاد می‌گیرید، *zijn* می‌گیرند، نه *hebben*.
  nl.a1.unit12.lesson03.teach.gaan:
    title: Gaan با zijn
    gloss: رفتن → به سوپرمارکت رفتم.
    note: با *ik* از *ben* استفاده کنید و *gegaan* را آخر جمله بگذارید.
  nl.a1.unit12.lesson03.teach.komen:
    title: Komen با zijn
    gloss: آمدن → به کافهٔ زبان آمدم.
    note: با *ik* از *ben* استفاده کنید و *gekomen* را آخر جمله بگذارید.
  nl.a1.unit12.lesson03.teach.auxiliary_contrast:
    title: مقایسهٔ فعل‌های کمکی
    gloss: کار کردم، ولی به سوپرمارکت رفتم.
    note: '*Werken* با *hebben* و *gaan* با *zijn* می‌آید.'
  nl.a1.unit12.lesson04.teach.gisteren_vanmorgen:
    title: دیروز، امروز صبح
    gloss: دیروز، امروز صبح
    note: '*Gisteren* روز قبل از امروز را نشان می‌دهد؛ *vanmorgen* به صبح امروز اشاره دارد.'
    example_gloss:
    - دیروز کار کردم.
    - امروز صبح ساعت هشت قهوه خوردم.
  nl.a1.unit12.lesson04.teach.yesterday_work:
    title: دیروز کار کردم
    gloss: دیروز کار کردم.
    note: وقتی جمله با *gisteren* شروع می‌شود، *heb* قبل از *ik* می‌آید.
  nl.a1.unit12.lesson04.teach.morning_coffee:
    title: قهوه امروز صبح
    gloss: امروز صبح ساعت هشت قهوه خوردم.
    note: این جمله دوباره از *om acht uur* در نظام ساعت درس ۴ استفاده می‌کند.
  nl.a1.unit12.lesson04.teach.time_order:
    title: زمان در ابتدا ترتیب را عوض می‌کند
    gloss: 'بعد از Gisteren یا Vanmorgen، فعل قبل از ik می‌آید: Gisteren heb ik ...'
    note: این همان ترتیبِ فعل قبل از *ik* است که در درس ۱۰ بعد از *daarna* دیدید.
  nl.a1.unit12.lesson05.teach.recent_text:
    title: گزارش یک اتفاق اخیر
    gloss: امروز صبح به سوپرمارکت رفتم. سیب خریدم. بعد از آن به کافهٔ زبان رفتم. آنجا قهوه خوردم.
    note: متن را بخوانید و به یک اشارهٔ زمانی، مکان‌ها و هر کار انجام‌شده توجه کنید.
    glosses:
      Vanmorgen: امروز صبح
      supermarkt: سوپرمارکت
      gegaan: رفته / رفتم
      appels: سیب‌ها
      gekocht: خریده / خریدم
      Daarna: بعد از اون
      taalcafé: کافهٔ زبان
      Daar: آنجا
      koffie: قهوه
      gedronken: خورده / خوردم
  nl.a1.unit12.lesson06.teach.question:
    title: دیروز چیکار کردی؟
    gloss: 'لوته: دیروز چه کار کردی، عمر؟'
    note: '*Wat heb je ... gedaan?* سؤال معمولی و دوستانه برای پرسیدن دربارهٔ کاری است که کسی انجام داده.'
  nl.a1.unit12.lesson06.teach.answer:
    title: سه کار عمر
    gloss: 'عمر: کار کردم. بعد به سوپرمارکت رفتم. سیب خریدم.'
    note: پاسخ، سه کار ساده و انجام‌شده را در جمله‌های جداگانه می‌گوید.
  nl.a1.unit12.lesson06.teach.morning_question:
    title: و امروز صبح؟
    gloss: 'لوته: و امروز صبح چه کار کردی؟'
    note: '*gisteren* را با *vanmorgen* عوض کنید تا دربارهٔ زمان اخیر دیگری بپرسید.'
  nl.a1.unit12.lesson06.teach.morning_answer:
    title: عمر به کافهٔ زبان آمد
    gloss: 'عمر: امروز صبح ساعت هشت به کافهٔ زبان آمدم.'
    note: '*Komen* با *zijn* می‌آید: *ben ... gekomen*.'
  nl.a1.unit12.lesson06.teach.lotte_answer:
    title: لوته قهوه خورد
    gloss: 'لوته: عالیه. من امروز صبح قهوه خوردم.'
    note: '*Drinken* با *hebben* می‌آید: *heb ... gedronken*.'
