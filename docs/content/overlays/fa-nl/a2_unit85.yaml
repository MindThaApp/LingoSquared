  nl.a2.unit85.lesson06.teach.lotte_tas:
    title: Lotte دربارهٔ کیف می‌پرسد
    gloss: 'Lotte: کیفت چی؟'
  nl.a2.unit85.lesson06.teach.omar_tas:
    title: Omar دربارهٔ کیف گم‌شده توضیح می‌دهد
    gloss: 'Omar: اون را توی قطار قبلی جا گذاشته بودم، ولی باجهٔ اشیای گمشده هنوز باز نشده بود.'
