    gloss: بعد از اینکه قطار رفته بود، به عمر زنگ زدم.
    note: 'Vertrekken با zijn می‌آید، پس بند با vertrokken was تمام می‌شود. بندی که اول جمله می‌آید باعث جابه‌جایی فعل و فاعل می‌شود: belde ik.'
  nl.a2.unit85.lesson05.teach.reading:
    title: چتر گم‌شدهٔ نور
    gloss: نور دیر به ایستگاه رسید. قطارش از قبل رفته بود. چترش را در قطار قبلی جا گذاشته بود. کنار باجهٔ اشیای گم‌شده شنید که کسی چتر را پیدا کرده است.
    note: 'دو رویداد قبلی را دنبال کنید: قطار رفته بود و Noor پیش از رسیدن به باجه، چتر را فراموش کرده بود.'
    glosses:
      laat: دیر
      vertrokken: چپ
      paraplu: چتر
      vergeten: فراموش‌شده
      voorwerpen: اشیای گمشده
      gevonden: پیداشده
  nl.a2.unit85.lesson05.teach.gn_reading:
    title: پیدا کردن رویداد قبلی
    gloss: گذشتهٔ بعید با had یا was و اسم مفعول، رویدادی را پیش از یک لحظهٔ بعدی در گذشته قرار می‌دهد.
    note: در داستان Noor، *was vertrokken* و *had vergeten* رویدادهایی را نشان می‌دهند که در لحظه‌های بعدیِ مرجع از قبل تمام شده بودند.
