    gloss: بعد از اینکه غذا خورده بودم، به ایستگاه رفتم.
    note: 'در بند نادات، اسم مفعول قبل از فعل کمکی و در آخر جمله می‌آید: gegeten had. جملهٔ اصلیِ بعدی با فعل شروع می‌شود: ging ik.'
  nl.a2.unit85.lesson04.teach.gn_zijn:
