course:
  title: هلندی A2
  description: هلندی A2 مبتنی بر دستور زبان برای خواندن، شنیدن و بازگو کردن یک داستان کوتاه.
  learning_goal: یک داستان کوتاه را در زمان imperfectum بخوانید یا بشنوید و با کلمات ترتیب و voltooid tegenwoordige tijd به‌ترتیب بازگو کنید.
units:
  nl.a2.unit108.een_kort_verhaal:
    title: یک داستان کوتاه
    description: یک داستان کوتاه درباره‌ی یک روز بیرون از خانه بخوانید یا بشنوید و آن را به‌ترتیب بازگو کنید.
lessons:
  nl.a2.unit108.lesson01.eerst_daarna_toen:
    title: اول، بعد، بعدش
  nl.a2.unit108.lesson02.verhaal_in_het_imperfectum:
    title: تعریف کردن داستان
  nl.a2.unit108.lesson03.opschrijven_of_vertellen:
    title: نوشتن یا تعریف کردن
  nl.a2.unit108.lesson04.een_boottocht:
    title: یک گردش با قایق
  nl.a2.unit108.lesson05.een_dag_in_het_pretpark:
    title: یک روز در شهربازی
  nl.a2.unit108.lesson06.vertel_eens:
    title: تعریف کن!
teaching:
  nl.a2.unit108.lesson01.teach.uitjes:
    title: گردش‌های یک‌روزه
    gloss: باغ‌وحش / گردش با قایق / شهربازی / ترن هوایی
    note: این‌ها گردش‌های این درس هستند.
    example_gloss:
    - ما داریم می‌ریم باغ‌وحش.
    - گردش با قایق خیلی خوش می‌گذره.
    - لوته ترن هوایی را دوست دارد.
  nl.a2.unit108.lesson01.teach.dieren:
    title: حیوانات باغ‌وحش
    gloss: میمون / فیل / شیر / پنگوئن
    note: 'جمع‌ها: *apen, olifanten, leeuwen, pinguïns*.'
    example_gloss:
    - میمون‌ها بامزه‌اند.
    - فیل‌ها بزرگ‌اند.
    - شیرها خوابیده‌اند.
  nl.a2.unit108.lesson01.teach.dingen:
    title: چیزهای یک روز گردش
    gloss: عکس / بستنی / قایق / کانال
    note: چیزهای کوچکی که در داستان‌ها دوباره پیدا می‌شوند.
    example_gloss:
    - نور عکس می‌گیرد.
    - عمر بستنی می‌خورد.
    - قایق از کانال می‌گذرد.
  nl.a2.unit108.lesson01.teach.volgorde_woorden:
    title: کلمات ترتیب رویدادها
    gloss: اول / بعد از آن / بعد / بعدش / بعداً / سرانجام
    note: این کلمات رویدادهای یک داستان را به‌ترتیب می‌چینند. در داستان، *toen* یعنی «بعد». این با *toen* به معنی «وقتی که» فرق دارد.
    example_gloss:
    - اول بلیت می‌خریم.
    - بعد از آن بستنی می‌خوریم.
    - آخرش می‌ریم خونه.
  nl.a2.unit108.lesson01.teach.gn_volgorde:
    title: اول کلمه‌ی ترتیب، بعد فعل
    gloss: اول رفتیم باغ‌وحش. بعد میمون‌ها را دیدیم.
    note: 'وقتی کلمه‌ی ترتیب اول جمله می‌آید، فعل بلافاصله بعد از آن می‌آید و نهاد پس از فعل: *Eerst gingen we*، *Daarna zagen we*. کلمه‌ی ترتیب را می‌توانید جای دیگری هم بگذارید: *We gingen eerst naar de dierentuin*.'
  nl.a2.unit108.lesson01.teach.verhaal:
    title: یک داستان کوتاه به‌ترتیب
    gloss: اول لوته، عمر و نور رفتند باغ‌وحش. بعد میمون‌ها را دیدند. بعد بستنی خوردند. آخرش با اتوبوس برگشتند خانه.
  nl.a2.unit108.lesson02.teach.dingen2:
    title: دم ورودی
    gloss: بلیت / قهوه / صف
    note: 'جمع: *kaartjes*.'
    example_gloss:
    - من بلیت دارم.
    - عمر قهوه می‌خورد.
    - صف طولانی است.
  nl.a2.unit108.lesson02.teach.werkwoorden:
    title: فعل‌های یک روز گردش
    gloss: رفتن / دیدن / خوردن / گرفتن / راه رفتن / نوشیدن / خریدن / ساختن / منتظر ماندن / خندیدن
    note: دو کارت بعدی شکل‌های imperfectum را نشان می‌دهند.
    example_gloss:
    - ما می‌ریم باغ‌وحش.
    - من شیرها را می‌بینم.
    - نور منتظر قایق است.
  nl.a2.unit108.lesson02.teach.gn_onregelmatig:
    title: 'روایت: imperfectum بی‌قاعده'
    gloss: رفتن ← رفت؛ دیدن ← دید؛ خوردن ← خورد؛ گرفتن ← گرفت؛ راه رفتن ← راه رفت؛ نوشیدن ← نوشید؛ بودن ← بود/بودند
    note: داستان‌ها در زمان imperfectum نوشته می‌شوند. شکل مفرد با *ik*، *jij/je*، *hij*، *zij* (او، مؤنث) و یک اسم تنها مثل *Noor* می‌آید؛ شکل جمع با *we*، *jullie* و *ze* (آن‌ها). این‌ها را یک‌جا یاد بگیرید.
  nl.a2.unit108.lesson02.teach.gn_regelmatig:
    title: 'روایت: imperfectum باقاعده'
    gloss: ساختن ← ساخت؛ منتظر ماندن ← منتظر ماند؛ خندیدن ← خندید؛ خریدن ← خرید
    note: 'بسیاری از فعل‌های باقاعده به ریشه‌ی فعل *-te* (مفرد) یا *-ten* (جمع) اضافه می‌کنند؛ اینجا ریشه‌ها به صدایی ختم می‌شوند که *-te(n)* می‌گیرد. فعل‌های باقاعده‌ی دیگر *-de(n)* می‌گیرند که بعداً می‌آید. *Kopen* یک مورد خاص است: *kocht, kochten*.'
  nl.a2.unit108.lesson02.teach.zinnen:
    title: رویدادهای کوچک در imperfectum
    gloss: لوته بلیت‌ها را خرید. عمر قهوه نوشید. نور خندید. آن‌ها مدت زیادی در صف منتظر ماندند.
  nl.a2.unit108.lesson03.teach.woorden:
    title: حرف زدن درباره‌ی دیروز
    gloss: دیروز / با هم / خوب، باحال / خیلی، زیاد / حیوانات
    note: وقتی به دوستتان می‌گویید چه کار کرده‌اید، به کارتان می‌آید.
    example_gloss:
    - دیروز ما باغ‌وحش بودیم.
    - ما با هم باغ‌وحش بودیم.
    - خوش گذشت.
    - من حیوانات زیادی دیدم.
    - حیوانات بزرگ بودند.
  nl.a2.unit108.lesson03.teach.gn_perfectum:
    title: 'تعریف کردن برای دوست: voltooid tegenwoordige tijd'
    gloss: اول رفتیم باغ‌وحش. بعد میمون‌ها را دیدیم.
    note: 'در گفت‌وگو معمولاً کارهایی را که کرده‌اید با *hebben* یا *zijn* به‌اضافه‌ی صفت مفعولی تعریف می‌کنید. فعل کمکی در جای دوم می‌آید و صفت مفعولی آخر جمله: *Eerst zijn we … gegaan*، *Daarna hebben we … gezien*.'
  nl.a2.unit108.lesson03.teach.gn_deelwoorden:
    title: صفت‌های مفعولی با hebben
    gloss: دیده / خورده / گرفته / نوشیده / خریده / ساخته / منتظر مانده / خندیده
    note: 'بیشتر صفت‌های مفعولی با *ge-* شروع می‌شوند. فعل‌های باقاعده به *-t* ختم می‌شوند (*gemaakt, gewacht*)؛ فعل‌های بی‌قاعده به *-en* (*gezien, gegeten, genomen, gedronken*). *Gekocht* با اینکه *kopen* در imperfectum بی‌قاعده است به *-t* ختم می‌شود، و *lachen* استثنا است: *gelachen*.'
  nl.a2.unit108.lesson03.teach.gn_hulpwerkwoord:
    title: hebben یا zijn؟
    gloss: من میمون‌ها را دیدم. نور قهوه نوشید. ما خندیدیم. من رفتم شهربازی. عمر باغ‌وحش بود. ما آمدیم.
    note: 'بیشتر فعل‌ها با *hebben* می‌آیند. فعل‌های رفتن و آمدن (حرکت به یک مکان) و خود *zijn* با *zijn* می‌آیند: *gegaan, gekomen, geweest*. شکل‌ها: *ik heb / ben, Noor heeft / is, wij hebben / zijn*.'
  nl.a2.unit108.lesson03.teach.gn_contrast:
    title: داستان یا گفت‌وگو؟
    gloss: اول آن‌ها رفتند باغ‌وحش. اول ما رفتیم باغ‌وحش.
    note: داستان نوشتاری از imperfectum استفاده می‌کند (*gingen*). وقتی به دوستتان می‌گویید چه کار کرده‌اید، معمولاً از voltooid tegenwoordige tijd استفاده می‌کنید (*zijn … gegaan*). ترتیب رویدادها در هر دو با همان کلمات نشان داده می‌شود.
  nl.a2.unit108.lesson03.teach.zinnen:
    title: تعریف کردن درباره‌ی دیروز
    gloss: دیروز با هم رفتیم باغ‌وحش. حیوانات زیادی دیدیم. خوش گذشت.
  nl.a2.unit108.lesson04.teach.plaatsen:
    title: در گردش با قایق
    gloss: شهر / پل
    note: هر دو را از روی قایق می‌بینید.
    example_gloss:
    - شهر قشنگ است.
    - پل قدیمی است.
    - ما پل را می‌بینیم.
  nl.a2.unit108.lesson04.teach.gn_stappen:
    title: یک صفت مفعولی دیگر با zijn
    gloss: نور سوار قایق شد. عمر از پل عکس گرفت.
    note: '*Stappen* (قدم گذاشتن، سوار شدن) باقاعده است: *gestapt*. چون حرکت به داخل جایی را نشان می‌دهد، با *zijn* می‌آید. *Een foto maken* با *hebben* می‌آید: *gemaakt*.'
  nl.a2.unit108.lesson04.teach.verhaal:
    title: گردش با قایق به‌ترتیب
    gloss: دیروز عمر و نور یک گردش با قایق کردند. اول بلیت خریدند. بعد سوار قایق شدند. بعد از پل عکس گرفتند. بعدش شهر را دیدند. بعداً قهوه نوشیدند. آخرش رفتند خانه.
  nl.a2.unit108.lesson05.teach.lees:
    title: یک روز در شهربازی
    gloss: شنبه لوته، عمر و نور رفتند شهربازی. اول بلیت خریدند. بعد سوار ترن هوایی شدند. نور می‌ترسید، ولی عمر می‌خندید. بعد بستنی خوردند. بعداً مدت زیادی در صف منتظر ماندند. بعد از اینکه منتظر مانده بودند، یک بار دیگر سوار ترن هوایی شدند. آخرش با اتوبوس برگشتند خانه.
    note: داستان در زمان imperfectum نوشته می‌شود. دنبال کلمات ترتیب بگردید تا ترتیب رویدادها را دنبال کنید. در یک جمله *hadden gewacht* آمده است (فقط برای خواندن).
    glosses:
      Zaterdag: شنبه
      bang: ترسیده
      maar: ولی
      Nadat: بعد از
      hadden: داشتند
      gewacht: منتظر مانده (صفت مفعولی)
      nog: یک بار دیگر
      keer: وقت
  nl.a2.unit108.lesson05.teach.gn_voltooid_verleden:
    title: 'شناسایی: چیزی که قبلاً اتفاق افتاده بود (فقط برای خواندن)'
    gloss: بعد از اینکه منتظر مانده بودند، یک بار دیگر سوار ترن هوایی شدند.
    note: '*Hadden gewacht* (فعل کمکی «داشتن» به‌اضافه‌ی صفت مفعولی) voltooid verleden tijd است. نشان می‌دهد چیزی پیش از یک لحظه‌ی دیگر در گذشته تمام شده بود. بعد از *nadat* فعل‌ها به آخر بند می‌روند و جمله‌ی اصلی بعدی با فعل شروع می‌شود: *gingen ze*. فقط لازم است هنگام خواندن یا شنیدن آن را تشخیص بدهید؛ وقتی خودتان داستان تعریف می‌کنید، از imperfectum یا voltooid tegenwoordige tijd استفاده کنید.'
  nl.a2.unit108.lesson06.teach.beurt1:
    title: لوته می‌پرسد
    gloss: 'لوته: سلام عمر، دیروز چه کار کردی؟'
  nl.a2.unit108.lesson06.teach.beurt2:
    title: عمر جواب می‌دهد
    gloss: 'عمر: من و نور یک گردش با قایق کردیم.'
  nl.a2.unit108.lesson06.teach.beurt3:
    title: لوته می‌پرسد اول چه شد
    gloss: 'لوته: خوب بود! اول چه کار کردید؟'
  nl.a2.unit108.lesson06.teach.beurt4:
    title: عمر اولین اتفاق‌ها را تعریف می‌کند
    gloss: 'عمر: اول بلیت خریدیم. بعد سوار قایق شدیم.'
  nl.a2.unit108.lesson06.teach.beurt5:
    title: لوته می‌پرسد بعدش چه شد
    gloss: 'لوته: بعدش؟'
  nl.a2.unit108.lesson06.teach.beurt6:
    title: عمر داستان را تمام می‌کند
    gloss: 'عمر: بعد شهر را دیدیم. آخرش قهوه نوشیدیم.'
exercises:
  nl.a2.unit108.lesson01.exercise01.hoor_begin:
    instruction: گوش کنید و چیزی را که می‌شنوید انتخاب کنید.
    correct_option: Eerst gingen ze naar de dierentuin.
    distractors:
    - Daarna gingen ze naar de dierentuin.
    - Eerst zagen ze de apen.
    - Uiteindelijk gingen ze naar de dierentuin.
    accepted_answers:
    - value: Eerst gingen ze naar de dierentuin.
      status: correct
    feedback: 'شنیدید: *Eerst gingen ze naar de dierentuin.* کلمه‌ی اول نشان می‌دهد این اولین رویداد است.'
  nl.a2.unit108.lesson01.exercise02.kies_laatste:
    instruction: کلمه‌ی هلندی را انتخاب کنید.
