  nl.a1.unit31.lesson05.teach.tekst:
    title: عمر، فنا و ساندر درباره حیوانات
    gloss: 'عمر و فنا هر دو حیوانات را دوست دارند، ولی هیچ‌کدامشان حیوان خانگی ندارد. عمر عاشق سگ‌هاست و فنا عاشق گربه‌ها. ساندر اتفاقاً حیوان خانگی دارد: یک گربه. او اغلب با گربه‌اش بازی می‌کند و هر روز به گربه غذا می‌دهد. شما حیوان خانگی دارید؟'
    note: دوست داشتنِ یک حیوان را با داشتنِ واقعی‌اش مقایسه می‌کند؛ همان نکته‌ی اصلیِ ارتباطی این درس.
    glosses:
      houden: خیلی دوست دارد
      allebei: هر دو
      dieren: حیوان‌ها
      beiden: هر دو
      huisdier: حیوان خانگی
      honden: سگ‌ها
      katten: گربه‌ها
      kat: گربه
      speelt: بازی می‌کند
      geeft: می‌دهد
      elke: هر
      eten: غذا
  nl.a1.unit31.lesson05.teach.sander_speelt:
    title: ساندر اغلب با گربه‌اش بازی می‌کند
    gloss: ساندر اغلب با گربه‌اش بازی می‌کند.
    note: کلمه *vaak* (اغلب) که قبلاً در یک درس قبلی برای برنامه روزانه عمر آمده بود، دوباره به کار رفته است.
  nl.a1.unit31.lesson05.teach.ik_houd_geen:
    title: من سگ‌ها را خیلی دوست دارم. حیوان خانگی ندارم.
    gloss: من سگ‌ها را خیلی دوست دارم. حیوان خانگی ندارم.
    note: یک پاسخ نمونه‌ی دوجمله‌ای که برای تمرین نوشتاری این درس می‌توانید از آن استفاده کنید.
  nl.a1.unit31.lesson06.teach.lotte_vraagt_nina:
    title: لوته از نینا می‌پرسد
    gloss: 'لوته: نینا، تو هم حیوان خانگی داری؟'
