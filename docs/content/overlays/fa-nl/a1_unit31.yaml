    example_gloss: من هر روز سگ را به پیاده‌روی می‌برم.
  nl.a1.unit31.lesson02.teach.separable_note:
    title: Uitlaten جداشدنی است
    gloss: 'Uitlaten جداشدنی است، درست مثل opstaan و aankleden از درس قبل: ik laat de hond uit.'
    note: همان الگوی فعل‌های جداشدنی (ریشهٔ فعل در جای خودش و پیشوند در آخر جمله) که قبلاً با فعل‌های برنامهٔ روزانه یاد گرفته‌اید.
  nl.a1.unit31.lesson02.teach.eten_geven:
    title: غذا دادن
    gloss: غذا دادن
    example_gloss: من هر روز به گربه غذا می‌دهم.
  nl.a1.unit31.lesson02.teach.spelen_met:
    title: بازی کردن با
    gloss: بازی کردن با
    example_gloss: سندر با گربه‌اش بازی می‌کند.
  nl.a1.unit31.lesson02.teach.uitlaten_phrase:
    title: من هر روز سگ را به پیاده‌روی می‌برم
    gloss: من هر روز سگ را به پیاده‌روی می‌برم.
    note: '*uitlaten* را با *elke dag* (هر روز) که از درس قبل می‌دانید ترکیب می‌کند.'
  nl.a1.unit31.lesson02.teach.eten_phrase:
    title: من هر روز به گربه غذا می‌دهم
    gloss: من هر روز به گربه غذا می‌دهم.
    note: '*eten geven* را با *elke dag* ترکیب می‌کند.'
  nl.a1.unit31.lesson03.teach.meervoud_note:
    title: 'جمع: hond -> honden'
    gloss: 'جمع با -en: hond -> honden، dier -> dieren. اگر صدادار کوتاه باشد، همخوان دو برابر می‌شود: kat -> katten.'
    note: الگوی جمع منظم در هلندی که اینجا برای اولین بار با اسم‌های حیوانات به‌عنوان نمونه معرفی می‌شود.
  nl.a1.unit31.lesson03.teach.honden_katten:
    title: سگ‌ها و گربه‌ها
    gloss: سگ‌ها / گربه‌ها
    example_gloss:
    - عمر عاشق سگ‌هاست.
    - فنا عاشق گربه‌هاست.
  nl.a1.unit31.lesson03.teach.vissen_vogels:
    title: ماهی‌ها و پرنده‌ها (جمع)
    gloss: ماهی‌ها / پرنده‌ها
    example_gloss:
    - من ماهی‌ها را خیلی دوست دارم.
    - پدربزرگ پرنده‌ها را خیلی دوست دارد.
  nl.a1.unit31.lesson03.teach.ik_houd_van_dieren:
    title: من حیوان‌ها را خیلی دوست دارم
    gloss: من حیوان‌ها را خیلی دوست دارم.
    note: عبارت *houden van* از درس سلیقه‌ها در یک درس قبلی دوباره آمده و حالا درباره حیوانات به کار رفته است.
  nl.a1.unit31.lesson03.teach.fenna_katten_geen:
