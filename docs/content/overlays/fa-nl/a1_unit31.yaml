    - Nina یک پرنده دارد.
  nl.a1.unit31.lesson01.teach.heb_je_huisdier:
    title: حیوان خانگی دارید؟
    gloss: حیوان خانگی داری؟
    note: همان الگوی سؤال *Heb je ...?* که از درس‌های قبل می‌شناسید.
  nl.a1.unit31.lesson01.teach.antwoord_ja:
    title: بله، من یک سگ دارم
    gloss: بله، یک سگ دارم.
    note: یک پاسخ مثبت ساده با واژه‌های تازه‌ی این درس.
  nl.a1.unit31.lesson01.teach.antwoord_nee_geen:
    title: نه، من حیوان خانگی ندارم
    gloss: نه، من حیوان خانگی ندارم.
    note: '*Geen* اسم نامعین *een huisdier* را منفی می‌کند -- به نکتهٔ دستوری نگاه کنید.'
  nl.a1.unit31.lesson01.teach.geen_note:
    title: 'Geen: منفی کردن اسم نامعین'
    gloss: Geen اسم نامعین را منفی می‌کند، مثل Ik heb geen tijd (که از قبل می‌دانید) و اینجا Ik heb geen huisdier.
    note: دقیقاً همان الگوی *geen* است که در *Ik heb geen tijd* یاد گرفتید -- دستور تازه‌ای نیست، فقط اسم تازه‌ای است.
  nl.a1.unit31.lesson02.teach.uitlaten:
