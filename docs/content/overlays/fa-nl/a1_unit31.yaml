course:
  title: هلندی A1
  description: 'هلندی مقدماتی برای صحبت دربارهٔ حیوان‌های خانگی و حیوان‌های رایج: اسم بردن از آن‌ها، مراقبت ساده (بیرون بردن، غذا دادن، بازی کردن)، گفتن اینکه چه حیوان‌هایی را دوست دارید حتی اگر حیوانی نداشته باشید، و جمع بستن منظم در هلندی.'
