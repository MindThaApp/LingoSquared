    gloss: 'Nina: آره، یه پرنده دارم. اسمش Pico‌ـه.'
    note: فعل *heet* (اسمش ... است) همان فعل معرفی‌کردن از همان درس اول است.
  nl.a1.unit31.lesson06.teach.omar_wat_leuk:
    title: واکنش عمر
    gloss: 'عمر: چه خوب! هر روز با او چه کار می‌کنی؟'
  nl.a1.unit31.lesson06.teach.nina_geeft_eten:
    title: Nina هر روز غذا می‌دهد
    gloss: 'Nina: هر روز بهش غذا می‌دم.'
  nl.a1.unit31.lesson06.teach.omar_houd_ook:
    title: عمر پرنده‌ها را هم دوست دارد
    gloss: 'عمر: من پرنده‌ها را هم دوست دارم.'
  nl.a1.unit31.lesson06.teach.lotte_afsluiting:
    title: لوته گفت‌وگو را تمام می‌کند
    gloss: 'لوته: چه خوب که هر سه‌تایمان حیوانات را دوست داریم!'
    note: حرف‌های هر سه شخصیت درباره‌ی حیوان‌ها در این درس را کنار هم جمع‌بندی می‌کند.
