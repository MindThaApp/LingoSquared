  nl.a1.unit31.lesson04.teach.lotte_beschrijft:
    title: لوته سگش را توصیف می‌کند
    gloss: 'لوته: موهایش قهوه‌ای است و کوچک است.'
    note: واژه‌های رنگ مو و اندازه از درس ظاهر تکرار شده‌اند، این بار برای توصیف پشم و موی حیوان به جای موی آدم.
  nl.a1.unit31.lesson04.teach.pronoun_note:
    title: hij و hem برای حیوان
    gloss: Hij (او) و hem (او را) را برای حیوان هم می‌شود به کار برد، نه فقط برای آدم.
    note: در همه درس‌های قبلی این دوره hij و hem فقط درباره آدم‌ها به کار رفته بود؛ اینجا صریحاً به حیوانات هم گسترش پیدا می‌کند.
  nl.a1.unit31.lesson04.teach.omar_laat_je_uit:
    title: عمر درباره قدم زدن با سگ می‌پرسد
    gloss: 'عمر: هر روز او را بیرون می‌بری؟'
  nl.a1.unit31.lesson04.teach.lotte_ja_zorg:
