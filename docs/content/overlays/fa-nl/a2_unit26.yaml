teaching:
  nl.a2.unit26.lesson01.teach.bankrekening:
    title: حساب بانکی
    gloss: حساب بانکی
    note: 'اسمی با جنس مشترک: de bankrekening، ترکیبی از bank (بانک) و rekening (حساب).'
    example_gloss: می‌خواهم یک حساب بانکی باز کنم.
  nl.a2.unit26.lesson01.teach.rekening_openen:
    title: درخواست باز کردن حساب
    gloss: می‌خواهم یک حساب بانکی باز کنم.
    note: graag درخواست را مؤدبانه‌تر می‌کند؛ همین الگو در سراسر این دوره دوباره به کار می‌رود.
  nl.a2.unit26.lesson01.teach.welke_rekening:
    title: کارمند می‌پرسد چه نوعی
    gloss: چه نوع حسابی می‌خواهید باز کنید؟
    note: Wat voor + اسم یعنی «چه نوعی از»؛ مصدر openen بعد از فعل کمکی wilt به آخر جمله‌ی پرسشی می‌رود.
  nl.a2.unit26.lesson02.teach.betaalrekening:
    title: حساب جاری
    gloss: حساب جاری
    note: 'اسمی با جنس مشترک: de betaalrekening، همان حساب جاری رایج و روزمره در هلند.'
    example_gloss: یک حساب جاری برای حقوقم می‌خواهم.
  nl.a2.unit26.lesson02.teach.salaris:
    title: حقوق
    gloss: حقوق
    note: 'اسمی با جنس خنثی: het salaris.'
    example_gloss: کارفرمای شما حقوقتان را به این حساب واریز می‌کند.
  nl.a2.unit26.lesson02.teach.betaalrekening_salaris:
    title: بیان هدف حساب
    gloss: یک حساب جاری برای حقوقم می‌خواهم.
    note: Voor mijn salaris هدف حساب را مشخص می‌کند.
  nl.a2.unit26.lesson02.teach.werkgever_stort:
    title: حقوق چطور به حساب می‌رسد
    gloss: کارفرمای شما حقوقتان را به این حساب واریز می‌کند.
    note: Storten (واریز کردن) فعل استاندارد برای انتقال پول به حساب است؛ op deze rekening مقصد را مشخص می‌کند.
  nl.a2.unit26.lesson02.teach.storten_infinitive:
    title: شکل مصدر
    gloss: Storten مصدرِ stort است.
    note: شکل مصدر همان شکلی است که در فرهنگ لغت می‌آید و با شکل صرف‌شده‌ی سوم‌شخص در جمله‌ی بالا فرق دارد.
  nl.a2.unit26.lesson03.teach.identiteitsbewijs:
    title: مدرک شناسایی
    gloss: مدرک شناسایی
    note: 'اسمی با جنس خنثی: het identiteitsbewijs، اصطلاح کلی هلندی که پاسپورت و کارت شناسایی را در بر می‌گیرد.'
    example_gloss: شماره‌ی BSN و یک مدرک شناسایی معتبر همراهتان هست؟
  nl.a2.unit26.lesson03.teach.bsn_nodig:
    title: کارمند مدارک را می‌خواهد
    gloss: شماره‌ی BSN و یک مدرک شناسایی معتبر همراهتان هست؟
    note: Bij zich hebben (همراه داشتن) همان الگوی رسمی بازدید از شهرداری در درس ۲۴ را دوباره به کار می‌برد.
  nl.a2.unit26.lesson03.teach.hier_is:
    title: تحویل دادن مدارک
    gloss: بله، این پاسپورتم و شماره‌ی BSN‌ام.
    note: Hier is (بفرمایید / این است) در هلندی روش طبیعی برای دادن چیزی به کسی است.
  nl.a2.unit26.lesson04.teach.bankpas:
    title: کارت بانکی
    gloss: کارت بانکی
    note: 'اسمی با جنس مشترک: de bankpas، کارت دبیت هلندی.'
    example_gloss: کارت بانکی‌تان را ظرف یک هفته با پست دریافت می‌کنید.
  nl.a2.unit26.lesson04.teach.bankpas_uitleg:
    title: توضیح درباره‌ی ارسال کارت
    gloss: کارت بانکی‌تان را ظرف یک هفته با پست دریافت می‌کنید.
    note: Binnen een week (ظرف یک هفته) بازه‌ی زمانی را بیان می‌کند؛ الگوی ontvangt... per post از شماره‌ی BSN در درس ۲۴ دوباره آمده است.
  nl.a2.unit26.lesson04.teach.mobiel_bankieren:
    title: معرفی بانکداری موبایلی
    gloss: با اپلیکیشن می‌توانید بانکداری موبایلی هم انجام دهید.
    note: Mobiel bankieren (بانکداری موبایلی) اصطلاح استاندارد هلندی برای کار بانکی با اپلیکیشن گوشی است.
  nl.a2.unit26.lesson05.teach.folder:
    title: خواندن یک بروشور حساب بانکی
    gloss: برای باز کردن حساب جاری به یک مدرک شناسایی معتبر و شماره‌ی BSN‌تان نیاز دارید. کارفرمای شما از این حساب برای واریز حقوقتان استفاده می‌کند. بعد از باز شدن حساب، ظرف یک هفته یک کارت بانکی با پست دریافت می‌کنید.
    note: به مدارک لازم، هدف حساب و زمان رسیدن کارت دقت کنید.
    glosses:
      betaalrekening: حساب جاری
      openen: باز کردن
      heeft: دارید (شکل رسمی؛ «heeft u ... nodig» یعنی نیاز دارید)
      geldig: معتبر
      identiteitsbewijs: مدرک شناسایی
      BSN-nummer: شماره‌ی شهروندی (شناسه‌ی اجتماعی و مالیاتی در هلند)
      nodig: لازم («nodig hebben» یعنی نیاز داشتن)
      werkgever: کارفرما
      gebruikt: استفاده می‌کند (سوم‌شخص مفرد فعل gebruiken)
      rekening: حساب
      salaris: حقوق
      storten: واریز کردن (انتقال پول)
      opening: باز شدن (حساب)
      ontvangt: دریافت کردن
      binnen: ظرف
      week: هفته
      bankpas: کارت بانکی
      post: پست
  nl.a2.unit26.lesson05.teach.ik_heb_nodig:
    title: گفتن اینکه خودتان چه چیزی لازم دارید
    gloss: من یک مدرک شناسایی معتبر و شماره BSN لازم دارم.
    note: Heb شکل «من» (ik) فعل hebben است. اینجا به‌جای عبارت رسمی heeft u ... nodig در بروشور آمده تا همان نیاز را از زبان خودتان بگویید.
  nl.a2.unit26.lesson06.teach.medewerker_greet:
    title: کارمند به عمر خوش‌آمد می‌گوید
    gloss: 'کارمند: صبح بخیر، چطور می‌تونم کمکتون کنم؟'
    note: Waarmee kan ik u helpen? همان جمله‌ی رسمی و رایج خوش‌آمدگویی در ادارات است که در بازدید از شهرداری در درس ۲۴ هم دیدید.
  nl.a2.unit26.lesson06.teach.omar_state_purpose:
    title: عمر هدفش را می‌گوید
    gloss: 'عمر: صبح بخیر، می‌خوام برای حقوقم یک حساب جاری باز کنم.'
    note: این جمله درخواست‌های درس اول و درس دوم را در یک جمله‌ی طبیعیِ شروع گفتگو کنار هم می‌آورد.
  nl.a2.unit26.lesson06.teach.medewerker_ask_documents:
    title: کارمند مدارک را می‌خواهد
    gloss: 'کارمند: البته. شماره BSN و یک مدرک شناسایی معتبر همراهتون هست؟'
    note: دقیقاً همان عبارتی است که در درس سوم یاد گرفتید.
  nl.a2.unit26.lesson06.teach.omar_hand_over:
    title: عمر مدارک را می‌دهد
    gloss: 'عمر: بله، این پاسپورت و شماره BSN من.'
    note: همان شماره BSN است که عمر در درس ۲۴ گرفته بود.
  nl.a2.unit26.lesson06.teach.medewerker_confirm:
    title: کارمند تأیید می‌کند
    gloss: 'کارمند: متشکرم. کارت بانکی‌تون ظرف یک هفته با پست می‌رسه و با اپلیکیشن هم می‌تونید بانکداری موبایلی انجام بدید.'
    note: 'این جمله دو نکته‌ی درس چهارم را با هم می‌آورد: ارسال کارت و بانکداری موبایلی.'
  nl.a2.unit26.lesson06.teach.omar_thanks:
    title: عمر از کارمند تشکر می‌کند
    gloss: 'عمر: عالی، خیلی ممنون از کمکتون!'
    note: این جمله‌ی پایانی، dank u wel voor uw hulp، همان است که در بازدید از شهرداری در درس ۲۴ هم بود.
  nl.a2.unit26.lesson06.teach.summary_grammar:
    title: خلاصه‌ی این مراجعه
    gloss: عمر یک حساب بانکی باز کرد. کارت بانکی‌اش با پست به دستش می‌رسه.
    note: Heeft ... geopend ماضی نقلی فعل openen است (geopend صفت مفعولی آن است). zijn در اینجا یعنی «مال او» (مذکر).
