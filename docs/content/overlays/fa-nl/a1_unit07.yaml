    note: چون از جمله قبل معلوم است که صحبت از سیب است، لوته می‌تواند فقط بگوید *een kilo*.
  nl.a1.unit07.lesson06.teach.payment:
    title: پرداخت با کارت
    gloss: 'فروشنده: می‌شود دو یورو و پنجاه سنت. لوته: می‌توانم با کارت پرداخت کنم؟ فروشنده: بله، حتماً.'
    note: '*Kan ik pinnen?* سؤال معمولی و کاربردی در لحظه پرداخت است.'
  nl.a1.unit07.lesson06.teach.closing:
