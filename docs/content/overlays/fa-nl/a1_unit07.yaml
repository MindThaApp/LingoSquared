    note: بعد از عدد، در هلندی اینجا *gram* می‌آید، نه *grammen*. در هلندی روزمره *een pond* یعنی 500 گرم؛ این واحد قدیمی و غیررسمی است و جزو واحدهای رسمی متریک نیست. *Per stuk* یعنی هر عدد قیمت جداگانه دارد؛ وقتی تعداد بیشتر از یک را تنها می‌گویید، *stuks* به کار می‌رود، مثل *twee stuks*.
