    example_gloss: یک کیلو سیب می‌خواهم.
  nl.a1.unit07.lesson02.teach.per_kilo:
    title: Per kilo
    gloss: کیلویی
    note: روی برچسب‌های بازار معمولاً قیمت کیلویی نوشته می‌شود.
