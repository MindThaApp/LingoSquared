    gloss: 'سیب: کیلویی ۲٫۵۰ یورو. گلابی: کیلویی ۳٫۰۰ یورو. گوجه‌فرنگی: کیلویی ۲٫۰۰ یورو. فلفل دلمه‌ای: عددی ۱٫۰۰ یورو.'
    note: '*per kilo* یعنی «کیلویی» و *per stuk* یعنی «عددی». در برچسب‌های هلندی برای قیمت‌ها ممیز به‌شکل کاما نوشته می‌شود، مثل فارسی که «٫» می‌نویسیم.'
    glosses:
      Appels: سیب‌ها
      kilo: کیلوگرم
