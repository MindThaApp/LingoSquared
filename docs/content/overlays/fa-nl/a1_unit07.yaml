    - دارم می‌رم مغازه.
    - این غرفه سیب می‌فروشد.
  nl.a1.unit07.lesson01.teach.appels_peren_tomaten_paprikas:
    title: سیب، گلابی، گوجه‌فرنگی، فلفل دلمه‌ای
    gloss: سیب‌ها، گلابی‌ها، گوجه‌فرنگی‌ها، فلفل دلمه‌ای‌ها
    note: مفرد *appel* است و جمع آن *appels*. مفرد *peer* است و جمع آن *peren*. مفرد *tomaat* است و جمع آن *tomaten*. در هلندی *paprika* یعنی فلفل دلمه‌ای و جمع نوشتاری آن *paprika's* است. در هلندی جمع با پسوندهایی مثل s- و en- ساخته می‌شود، نه با «ها» ثابت مثل فارسی.
    example_gloss:
    - سیب می‌خواهم.
    - گلابی می‌خواهم.
    - گوجه‌فرنگی می‌خواهم.
    - فلفل دلمه‌ای می‌خواهم.
  nl.a1.unit07.lesson02.teach.kilo:
