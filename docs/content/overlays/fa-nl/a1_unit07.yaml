  nl.a1.unit07.lesson01.teach.markt_winkel_kraam:
    title: بازار، مغازه، غرفه
    gloss: بازار، مغازه، غرفه
    note: '*De markt* می‌تواند به معنی بازار به‌طور کلی یا بازار روباز و هفتگی باشد. *De winkel* مغازه یا فروشگاه است. *Kraam* غرفه‌ای در بازار روباز است.'
