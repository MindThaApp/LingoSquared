    note: '*Hoeveel kost ...?* قیمت را می‌پرسد. اینجا چیزی که قیمت دارد *een kilo* است، پس فعل مفرد *kost* به کار می‌رود.'
  nl.a1.unit07.lesson02.teach.answer_apples:
