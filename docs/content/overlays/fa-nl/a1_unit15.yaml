teaching:
  nl.a1.unit15.lesson01.teach.kaartje:
    title: بلیت
    gloss: بلیت
    note: '*Het kaartje* اسم خنثی است؛ از *het* استفاده کنید، نه *de*.'
    example_gloss: یک بلیت به اوترشت می‌خواستم.
  nl.a1.unit15.lesson01.teach.wil_graag:
    title: درخواست بلیت
    gloss: یک بلیت به اوترشت می‌خواستم.
    note: '*Wil graag* درخواست را مؤدبانه‌تر می‌کند؛ همان الگویی که در درس ۶ برای سفارش غذا یاد گرفتید.'
  nl.a1.unit15.lesson01.teach.enkele_of_retour:
    title: مسئول می‌پرسد چه نوع بلیتی
    gloss: بلیت یک‌طرفه می‌خواهید یا رفت و برگشت؟
    note: '*Wilt u* شکل رسمی «شما» برای فعل *willen* است و اینجا برای کارمند ناآشنای ایستگاه به کار می‌رود.'
  nl.a1.unit15.lesson01.teach.retour_alstublieft:
    title: جواب مؤدبانه دادن
    gloss: رفت و برگشت، لطفاً.
    note: '*Alstublieft* «لطفاً»ی رسمی است و با لحن رسمی *u* در این گفتگو جور است.'
  nl.a1.unit15.lesson01.teach.register_note:
    title: سطح رسمی پشت باجه
    gloss: کنار باجه معمولاً از شکل مؤدبانهٔ u استفاده می‌کنید.
    note: 'ادامهٔ تفاوت *jij*/*je* و *u* از درس ۱: با غریبه‌هایی که خدمات می‌دهند معمولاً از *u* استفاده می‌شود.'
  nl.a1.unit15.lesson02.teach.perron:
    title: سکو
    gloss: سکوی قطار
    note: '*Het perron* اسم خنثی است؛ از *het* استفاده کنید، نه *de*.'
    example_gloss: قطار اوترشت از کدام سکو حرکت می‌کند؟
  nl.a1.unit15.lesson02.teach.welk_perron:
    title: پرسیدن شمارهٔ سکو
    gloss: قطار اوترشت از کدام سکو حرکت می‌کند؟
    note: '*Van welk perron* مشخصاً دربارهٔ سکو می‌پرسد، نه دربارهٔ یک مکان عمومی.'
  nl.a1.unit15.lesson02.teach.vertrektijd:
    title: گفتن جزئیات حرکت
    gloss: قطار ساعت ده منهای یک ربع از سکوی پنج حرکت می‌کنه.
    note: '*Kwart voor tien* همان الگوی گفتن ساعت در درس ۴ است.'
  nl.a1.unit15.lesson02.teach.hoe_laat_aan:
    title: پرسیدن ساعت رسیدن
    gloss: قطار چه ساعتی می‌رسه؟
    note: '*Komt ... aan* فعل جداشدنی است (*aankomen*)؛ *aan* به آخر جمله می‌رود.'
  nl.a1.unit15.lesson02.teach.aankomsttijd:
    title: گفتن ساعت رسیدن
    gloss: قطار ساعت یازده می‌رسه.
    note: '*Komt aan* دوباره نشان می‌دهد دو بخش فعل جداشدنی در جمله از هم جدا می‌شوند.'
  nl.a1.unit15.lesson03.teach.op_tijd_de_vertraging:
    title: سر وقت / تأخیر
    gloss: سر وقت؛ تأخیر
    note: '*Op tijd* عبارتی ثابت است برای چیزی که طبق برنامه انجام می‌شود. *De vertraging* (تأخیر) اسمی با artikel de است.'
    example_gloss:
    - قطار سر وقت حرکت نمی‌کنه.
    - 'توجه: قطار اوترشت تأخیر دارد.'
  nl.a1.unit15.lesson03.teach.let_op:
    title: یک اعلامیه
    gloss: 'توجه: قطار اوترشت تأخیر دارد.'
    note: '*Let op* (تحت‌اللفظی «حواستان باشد») شروع اعلام‌های ایستگاه است، مثل «توجه، مسافران محترم».'
  nl.a1.unit15.lesson03.teach.niet_op_tijd:
    title: منفی کردن «سر وقت»
    gloss: قطار سر وقت حرکت نمی‌کنه.
    note: '*Niet* درست قبل از *op tijd* می‌آید و کل عبارت را منفی می‌کند.'
  nl.a1.unit15.lesson03.teach.ander_perron:
    title: تغییر سکو
    gloss: قطار به جای سکوی پنج از سکوی سه حرکت می‌کنه.
    note: '*In plaats van* یعنی «به‌جای».'
  nl.a1.unit15.lesson03.teach.tien_minuten_vertraging:
    title: گفتن مدت تأخیر
    gloss: قطار ده دقیقه تأخیر داره.
    note: '*Heeft vertraging* (تحت‌اللفظی «تأخیر دارد») روش طبیعی گفتن تأخیر داشتن است، در کنار صفت *vertraagd*.'
  nl.a1.unit15.lesson04.teach.ingang_uitgang_wachtruimte:
    title: ورودی، خروجی، سالن انتظار
    gloss: ورودی؛ خروجی؛ سالن انتظار
    note: '*De ingang*، *de uitgang* و *de wachtruimte* همه با de می‌آیند.'
    example_gloss:
    - ورودی کجاست؟
    - خروجی کجاست؟
    - سالن انتظار کجاست؟
  nl.a1.unit15.lesson04.teach.waar_perron_zeven:
    title: پرسیدن جای یک سکو
    gloss: سکوی هفت کجاست؟
    note: این همان الگوی *Waar is...?* از درس‌های مسیریابی درس ۹ است.
  nl.a1.unit15.lesson04.teach.rechtdoor_rechts:
    title: راه نشان دادن
    gloss: مستقیم برید و بعد به راست.
    note: '*Rechtdoor* و *rechts* همان کلمه‌های جهت درس ۹ هستند که اینجا در ایستگاه به کار رفته‌اند.'
  nl.a1.unit15.lesson04.teach.waar_wachtruimte:
    title: پرسیدن جای سالن انتظار
    gloss: سالن انتظار کجاست؟
    note: همان الگوی سؤال برای یک مکان تازه.
  nl.a1.unit15.lesson05.teach.kaartje_tekst:
    title: خواندن یک بلیت چاپی
    gloss: 'بلیت: از آمستردام سنترال به اوترشت سنترال. حرکت: ده و ده دقیقه، سکوی هفت. رسیدن: ده دقیقه به یازده. رفت‌وبرگشت. قیمت: دوازده یورو و چهل سنت.'
    note: به ساعت و سکوی حرکت، ساعت رسیدن، نوع بلیت و قیمت توجه کنید.
    glosses:
      Kaartje: بلیت
      Vertrek: حرکت
      tien: ده
      perron: سکو
      zeven: هفت
      Aankomst: رسیدن
      elf: یازده
      Retour: بلیت رفت و برگشت
      Prijs: قیمت
      twaalf: دوازده
      euro: یورو
      veertig: چهل
  nl.a1.unit15.lesson06.teach.omar_open:
    title: عمر برنامه را می‌گوید
    gloss: 'عمر: باید به سکوی هفت برویم. قطار ساعت ده و ده دقیقه حرکت می‌کند.'
    note: '*Moeten* (باید) اینجا یک ضرورت عملی را می‌رساند، نه اجبار جدی.'
  nl.a1.unit15.lesson06.teach.lotte_sign:
    title: لوته تابلو را می‌خواند
    gloss: 'لوته: ببین، تابلو اونجاست: تأخیر، ده دقیقه.'
    note: '*Daar staat* (تحت‌اللفظی «آنجا ایستاده») روش طبیعی گفتن این است که تابلو چیزی را نشان می‌دهد.'
  nl.a1.unit15.lesson06.teach.omar_coffee:
    title: عمر آرام می‌ماند
    gloss: 'عمر: مشکلی نیست، هنوز برای یک قهوه وقت داریم.'
    note: '*Geen probleem* جملهٔ دلگرم‌کنندهٔ رایج و دوستانه‌ای است.'
  nl.a1.unit15.lesson06.teach.lotte_train_arrives:
    title: قطار می‌رسه
    gloss: 'لوته: فکر خوبیه. اوه، قطار که همین الان اومد. سکوی هفت، دقیقاً!'
    note: '*Al* (قبلاً/همین حالا) نشان می‌دهد با وجود تأخیری که اعلام شد، قطار زودتر از انتظار رسیده است.'
  nl.a1.unit15.lesson06.teach.omar_board:
    title: سوار قطار می‌شن
    gloss: 'عمر: بیا، سوار شیم. اوترشت، داریم میایم!'
    note: '*Stappen in* (سوار شدن) فعل جداشدنی است؛ *in* به آخر جمله می‌رود. *We komen eraan* (تحت‌اللفظی «داریم به آن می‌آییم») روش طبیعی هلندی برای «داریم می‌آییم» است و ترجمهٔ کلمه‌به‌کلمه‌اش عجیب به نظر می‌رسد.'
