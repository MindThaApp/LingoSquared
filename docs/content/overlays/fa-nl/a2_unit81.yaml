  nl.a2.unit81.lesson01.ge_in_het_midden:
    title: ge- در وسط
  nl.a2.unit81.lesson02.stappen_op_volgorde:
    title: مراحل به ترتیب
  nl.a2.unit81.lesson03.wel_of_geen_ge:
    title: با ge- یا بدون آن؟
  nl.a2.unit81.lesson04.de_ochtend_ging_mis:
    title: صبح خراب شد
  nl.a2.unit81.lesson05.noors_bericht:
    title: پیام نور
  nl.a2.unit81.lesson06.lotte_en_noor:
    title: لوته و نور بعد از کار صحبت می‌کنند
teaching:
  nl.a2.unit81.lesson01.teach.ochtend_reis:
    title: صبح و رفت‌وآمد
    gloss: صبح، ساعت زنگ‌دار، اتوبوس، دوچرخه، کیف
    note: واژه‌های اصلی برای آماده شدن و رفت‌وآمد.
    example_gloss:
    - صبح زود شروع می‌شود.
    - ساعت زنگ‌دارم ساعت هفت زنگ می‌زند.
    - اتوبوس در ایستگاه است.
    - دوچرخه‌ام بیرون است.
    - کیفم آماده است.
  nl.a2.unit81.lesson01.teach.verbindingswoorden:
    title: مراحل را به ترتیب بگویید
    gloss: اول، بعد از آن، سپس، در آخر
    note: این حرف‌های ربط، شرح قدم‌به‌قدم را منظم می‌کنند. وقتی یکی از آن‌ها اول جمله‌ی اصلی بیاید، فعل صرف‌شده قبل از نهاد می‌آید.
    example_gloss:
    - اول صبحانه می‌خورم.
    - بعد از آن کیفم را جمع می‌کنم.
    - سپس بیرون می‌روم.
    - در آخر سوار اتوبوس می‌شوم.
  nl.a2.unit81.lesson01.teach.gn_midden:
    title: صفت مفعولی دور ge- را می‌گیرد
    gloss: بلند شدن ← بلند شد؛ رسیدن ← رسید؛ پیاده شدن ← پیاده شد؛ سوار شدن ← سوار شد
    note: 'در فعل جدا‌شدنی، *ge-* بین پیشوند و فعل می‌نشیند: *op-ge-staan*، *aan-ge-komen*، *uit-ge-stapt*، *in-ge-stapt*.'
  nl.a2.unit81.lesson01.teach.gn_zinnen:
    title: مراحل تمام‌شده‌ی صبح
    gloss: من زود بلند شدم. اتوبوس خیلی دیر رسید. من در ایستگاه پیاده شدم.
    note: این فعل‌های حرکت و تغییر مکان در ماضی نقلی با *zijn* می‌آیند.
  nl.a2.unit81.lesson01.teach.gn_hulpwerkwoord:
    title: این فعل‌ها با zijn می‌آیند
    gloss: من بلند شدم؛ اتوبوس رسید؛ من سوار شدم و پیاده شدم.
    note: در این رویدادهای تمام‌شده‌ی حرکت یا تغییر مکان، از *ben/is* به‌علاوه‌ی صفت مفعولی استفاده کنید.
  nl.a2.unit81.lesson02.teach.klaarmaken:
    title: آماده شدن
    gloss: لباس پوشیدن، مرتب کردن، ظرف شستن، با خود بردن
    note: هر چهار فعل جدا‌شدنی هستند.
    example_gloss:
    - امروز لباس پوشیدن سریع است.
    - بعد از صبحانه مرتب می‌کنم.
    - بعد از غذا ظرف‌ها را می‌شویم.
    - با خودت ببری یا در خانه بگذاری؟
  nl.a2.unit81.lesson02.teach.gn_participles:
    title: صفت‌های مفعولی جدا‌شدنی بیشتر
    gloss: لباس پوشیده؛ مرتب‌شده؛ شسته‌شده؛ با خود برده‌شده
    note: 'پیشوند جلو می‌ماند و *ge-* در وسط می‌آید: *aan-ge-kleed*، *op-ge-ruimd*، *af-ge-wassen*، *mee-ge-nomen*.'
  nl.a2.unit81.lesson02.teach.stappen:
    title: یک روال چهار مرحله‌ای
    gloss: اول بلند شدم. بعد از آن لباس پوشیدم. سپس فنجانم را شستم. در آخر کیفم را با خودم بردم.
    note: هر حرف ربط مرحله‌ی تمام‌شده‌ی بعدی را نشان می‌دهد.
  nl.a2.unit81.lesson03.teach.contrastwerkwoorden:
    title: سه فعل بدون ge- اضافه
    gloss: فراموش کردن، حرکت کردن، صبحانه خوردن
    note: این فعل‌ها با پیشوندهای جدا‌نشدنی شروع می‌شوند و صفت مفعولی‌شان را بدون *ge-* اضافه می‌سازند.
    example_gloss:
    - فراموش کردن انسانی است.
    - می‌خواهیم ساعت هشت حرکت کنیم.
    - من در خانه صبحانه می‌خورم.
  nl.a2.unit81.lesson03.teach.gn_contrast:
    title: جدا‌شدنی در برابر جدا‌نشدنی
    gloss: 'جدا‌شدنی: بلند شدن ← بلند شد. جدا‌نشدنی: فراموش کردن ← فراموش کرد، حرکت کردن ← حرکت کرد، صبحانه خوردن ← صبحانه خورد.'
    note: '*opgestaan* را بگویید، اما *vergeten*، *vertrokken* و *ontbeten* را بدون *ge-* دیگر.'
  nl.a2.unit81.lesson03.teach.contrastzinnen:
    title: شکل‌ها را مقایسه کنید
    gloss: بلند شدم و صبحانه خوردم. بعد از آن راه افتادم. کیفم را فراموش کردم.
    note: فقط در فعل جدا‌شدنی *opstaan* است که *ge-* بعد از پیشوند می‌آید.
  nl.a2.unit81.lesson03.teach.gn_modal:
    title: فعل جدا‌شدنی بعد از فعل کمکی
    gloss: می‌خواهم زود بلند شوم. باید آشپزخانه را مرتب کنم. می‌توانم در ایستگاه پیاده شوم.
    note: 'بعد از *wil, moet,* یا *kan* در زمان حال، مصدر چسبیده می‌ماند و آخر جمله می‌آید: *opstaan, opruimen, uitstappen*.'
  nl.a2.unit81.lesson04.teach.op_tijd_snel:
    title: صبح چطور گذشت
    gloss: سر وقت، سریع، با این حال
    note: با این واژه‌ها زمان‌بندی و نتیجه‌ی موفق غیرمنتظره را توضیح دهید.
    example_gloss:
    - می‌خواهم سر وقت برسم.
    - اتوبوس سریع می‌رود.
    - باران می‌آید، ولی با این حال می‌روم.
  nl.a2.unit81.lesson04.teach.gn_negatie:
    title: مراحل منفی
    gloss: کیفم را با خودم نبردم. سر وقت بلند نشدم.
    note: '*niet* را قبل از بخشی بگذارید که منفی می‌شود: صفت مفعولی جدا‌شدنی یا عبارت *op tijd*.'
  nl.a2.unit81.lesson04.teach.gn_dat:
    title: ماضی نقلی در جمله‌واره‌ی dat
    gloss: گفتم که زود بلند شدم. شنیدم که اتوبوس خیلی دیر رسید.
    note: 'بعد از *dat* هر دو جزء فعل به آخر جمله می‌روند: *ben opgestaan*، *is aangekomen*.'
  nl.a2.unit81.lesson04.teach.scenario:
    title: صبحی که خراب شد
    gloss: اول سر وقت بلند نشدم. بعد از آن سریع لباس پوشیدم. سپس کیفم را نبردم. در آخر سوار اتوبوس شدم.
    note: حرف‌های ربط به مرحله‌های ناموفق و تمام‌شده ترتیبی روشن می‌دهند.
  nl.a2.unit81.lesson05.teach.noor_bericht:
    title: صبح شلوغ نور
    gloss: سلام لوته! صبحم خیلی شلوغ بود. اول دیر بلند شدم. بعد از آن سریع لباس پوشیدم و صبحانه خوردم. سپس آشپزخانه را مرتب کردم، ولی ناهارم را با خودم نبردم. با دوچرخه تا ایستگاه اتوبوس رفتم و سوار اتوبوس شدم. در آخر با این حال سر وقت به محل کارم رسیدم.
    note: به ترتیب رویدادها و تنها چیزی که نور با خود نبرد دقت کنید.
    glosses:
      erg: خیلی
      druk: شلوغ
      bushalte: ایستگاه اتوبوس
      lunch: ناهار
      toch: هنوز / با این حال
  nl.a2.unit81.lesson06.teach.lotte_vraag:
    title: لوته از صبح نور می‌پرسد
    gloss: 'لوته: سلام نور، صبحت چطور گذشت؟'
  nl.a2.unit81.lesson06.teach.noor_eerst:
    title: نور اولین مشکل را می‌گوید
    gloss: 'نور: زیاد خوب نبود. اول اینکه دیر از خواب بیدار شدم.'
  nl.a2.unit81.lesson06.teach.lotte_daarna:
    title: لوته می‌پرسد بعد چه شد
    gloss: 'لوته: وای نه! بعدش چی؟'
  nl.a2.unit81.lesson06.teach.noor_tas:
    title: نور مراحل بعدی را می‌گوید
    gloss: 'نور: بعدش زود لباس پوشیدم، ولی کیفم را با خودم نبردم.'
  nl.a2.unit81.lesson06.teach.lotte_reis:
    title: لوته درباره‌ی وسیله‌ی رفت‌وآمد می‌پرسد
    gloss: 'لوته: چطور به سر کارت رفتی؟'
  nl.a2.unit81.lesson06.teach.noor_aankomst:
    title: نور ماجرا را تمام می‌کند
    gloss: 'نور: سوار اتوبوس شدم. آخرش با این‌حال سر وقت رسیدم.'
  nl.a2.unit81.lesson06.teach.vraag:
    title: یک سؤال
    gloss: سؤال
    note: '*Een vraag stellen* یعنی سؤال پرسیدن.'
    example_gloss: لوته درباره‌ی صبح یک سؤال می‌پرسد.
