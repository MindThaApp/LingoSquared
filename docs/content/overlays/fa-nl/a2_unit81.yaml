units:
  nl.a2.unit81.een_drukke_ochtend:
    title: یک صبح شلوغ
    description: یک صبح یا مسیر رفت‌وآمد را قدم‌به‌قدم با فعل‌های جدا‌شدنی در ماضی نقلی توصیف کنید.
