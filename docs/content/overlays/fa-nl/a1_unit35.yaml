  nl.a1.unit35.lesson05.teach.tekst:
    title: چه کسی چه می‌خواند؟
    gloss: Sander فقط کار نمی‌کند، درس هم می‌خواند. او در آموزشگاه آموزش بزرگسالان در یک دوره‌ی اسپانیایی شرکت می‌کند. هر هفته کلمه‌های تازه یاد می‌گیرد. Fenna در کالج یک دوره‌ی آموزشی می‌گذراند. او آنجا مراقبت‌های بهداشتی می‌خواند. هر دو از درس خواندن لذت می‌برند. شما چه می‌خوانید، یا دوست دارید چه چیزی یاد بگیرید؟
    note: تحصیل Sander و Fenna را با هم مقایسه می‌کند، مثل متن مقایسه‌ای درس فناوری.
