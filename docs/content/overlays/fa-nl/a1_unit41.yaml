    title: Nina درباره‌ی همه می‌شنود
    gloss: نینا در تاالکافه تازه‌وارد است. از عمر می‌پرسد بقیه چه جور آدم‌هایی هستند. عمر برایش تعریف می‌کند. لوته مهربان و صبور است؛ پرستار است. ساندر بامزه است و کلاس اسپانیایی می‌رود. فنا کنجکاو است؛ دوست دارد چیزهای تازه یاد بگیرد. خود عمر آرام است.
    note: ویژگی‌های شخصیتی اعضای گروه را مرور می‌کند.
