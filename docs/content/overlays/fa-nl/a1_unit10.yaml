teaching:
  nl.a1.unit10.lesson01.teach.opstaan:
    title: از خواب بلند شدن
    gloss: از خواب بلند شدن ← از خواب بلند می‌شم
    note: '*Opstaan* در جمله‌ی خبری جدا می‌شود: *Ik sta op*. پیشوند *op* به آخر جمله می‌رود.'
  nl.a1.unit10.lesson01.teach.aankleden:
    title: لباس پوشیدن
    gloss: لباس پوشیدن ← لباس می‌پوشم
    note: '*Zich aankleden* هم بازتابی است و هم جداشدنی. با *ik* از *me* استفاده می‌کنیم و *aan* را به آخر می‌بریم: *Ik kleed me aan*.'
  nl.a1.unit10.lesson01.teach.ontbijten:
    title: صبحانه خوردن
    gloss: صبحانه خوردن ← صبحانه می‌خورم
    note: '*Ontbijten* جدا نمی‌شود: *Ik ontbijt*.'
  nl.a1.unit10.lesson01.teach.werken:
    title: کار
    gloss: کار کردن ← کار می‌کنم
    note: '*Werken* جدا نمی‌شود: *Ik werk*.'
  nl.a1.unit10.lesson01.teach.eten:
    title: غذا خوردن
    gloss: غذا خوردن ← غذا می‌خورم
    note: 'شکل *ik* برای *eten* می‌شود *eet*: *Ik eet*.'
  nl.a1.unit10.lesson01.teach.afwassen:
    title: ظرف شستن
    gloss: ظرف شستن ← ظرف می‌شورم
    note: '*Afwassen* جدا می‌شود: *Ik was af*. پیشوند *af* به آخر جمله می‌رود.'
  nl.a1.unit10.lesson01.teach.slapen:
    title: خوابیدن
    gloss: خوابیدن ← می‌خوابم
    note: '*Slapen* جدا نمی‌شود. شکل *ik* آن مصوت بلند دارد: *Ik slaap*.'
  nl.a1.unit10.lesson02.teach.split_rule:
    title: الگوی جدا شدن
    gloss: 'در جمله‌ی خبری معمولی، بخش اول به آخر جمله می‌رود: opstaan → Ik sta op.'
    note: نگویید *Ik opsta*. فعل اصلی را صرف کنید و پیشوند کوتاه را آخر جمله بگذارید.
  nl.a1.unit10.lesson02.teach.opstaan_split:
    title: Opstaan در جمله
    gloss: 'از خواب بلند شدن: ساعت هفت از خواب بلند می‌شم.'
    note: قید زمان بین *sta* و پیشوند پایانی *op* می‌آید.
  nl.a1.unit10.lesson02.teach.aankleden_split:
    title: Aankleden در جمله
    gloss: 'لباس پوشیدن: لباس می‌پوشم.'
    note: 'الگو این است: *Ik* + *kleed* + *me* + *aan*. *Aan* آخر جمله می‌ماند.'
  nl.a1.unit10.lesson02.teach.afwassen_split:
    title: Afwassen در جمله
    gloss: 'ظرف شستن: بعد از غذا ظرف می‌شورم.'
    note: '*Na het eten* بین *was* و پیشوند پایانی *af* می‌آید.'
  nl.a1.unit10.lesson02.teach.contrast:
    title: فعل‌های جداناشدنی
    gloss: 'جداناشدنی: صبحانه می‌خورم. کار می‌کنم. می‌خوابم. هیچ بخشی آخر جمله نمی‌رود.'
    note: '*Ontbijten*، *werken* و *slapen* در این جمله‌های خبری یک شکل واحد می‌مانند.'
  nl.a1.unit10.lesson03.teach.get_up_time:
    title: ساعت هفت و نیم از خواب بلند شدن
    gloss: ساعت ۷:۳۰ از خواب بلند می‌شم.
    note: 'شیوه‌ی ساعت‌گویی هلندی را به یاد بیاورید: *half acht* یعنی نیمه‌ی راه تا هشت، یعنی ۰۷:۳۰. در فارسی می‌گوییم «هفت و نیم»، اما در هلندی به ساعت بعدی اشاره می‌شود. *Op* همچنان آخر جمله می‌ماند.'
  nl.a1.unit10.lesson03.teach.dress_time:
    title: ساعت یه ربع به هشت لباس پوشیدن
    gloss: ساعت ۷:۴۵ لباس می‌پوشم.
    note: ساعت پیش از پیشوند جداشدنی پایانی *aan* می‌آید.
  nl.a1.unit10.lesson03.teach.breakfast_time:
    title: ساعت هشت صبحانه خوردن
    gloss: ساعت هشت صبحانه می‌خورم.
    note: پیش از ساعت از *om* استفاده کنید. *Ontbijt* جدا نمی‌شود.
  nl.a1.unit10.lesson03.teach.work_time:
    title: از نه تا پنج کار کردن
    gloss: از ساعت نه تا ساعت پنج کار می‌کنم.
    note: '*Van ... tot ...* ساعت شروع و پایان را می‌گوید.'
  nl.a1.unit10.lesson03.teach.eat_time:
    title: ساعت شش و نیم غذا خوردن
    gloss: ساعت ۶:۳۰ بعدازظهر غذا می‌خورم.
    note: '*''s Avonds* شب را روشن می‌کند، پس *half zeven* اینجا ۱۸:۳۰ است.'
  nl.a1.unit10.lesson03.teach.sleep_time:
    title: ساعت یازده خوابیدن
    gloss: ساعت یازده می‌خوابم.
    note: 'پیش از ساعت از *om* استفاده کنید: *om elf uur*.'
  nl.a1.unit10.lesson04.teach.eerst_dan_daarna:
    title: اول، بعدش، بعد از اون
    gloss: اول، بعدش، بعد از اون
    note: '*Eerst* اولین کار را نشان می‌دهد، *dan* به کار بعدی می‌رود و *daarna* به چیزی که قبلاً گفته شد وصل می‌شود.'
    example_gloss:
    - اول از خواب بلند می‌شم.
    - بعدش لباس می‌پوشم.
    - بعد از اون صبحانه می‌خورم.
  nl.a1.unit10.lesson04.teach.sequence:
    title: یه صبح سه‌مرحله‌ای
    gloss: اول از خواب بلند می‌شم. بعدش لباس می‌پوشم. بعد از اون صبحانه می‌خورم.
    note: 'پیشوندهای جداشدنی هنوز آخر جمله‌شان می‌آیند: *sta ik op*؛ *kleed ik me aan*.'
  nl.a1.unit10.lesson04.teach.sequence_order_note:
    title: فعل قبل از ik
    gloss: 'بعد از eerst، dan و daarna فعل قبل از ik می‌آید: Daarna ontbijt ik.'
    note: شروع جمله با کلمه‌ی ترتیب، *Ik ontbijt* را به *Daarna ontbijt ik* تبدیل می‌کند.
  nl.a1.unit10.lesson05.teach.routine_text:
    title: روز من
    gloss: روز من — ساعت ۷:۳۰ از خواب بلند می‌شم. بعد از اون لباس می‌پوشم و ساعت هشت صبحانه می‌خورم. از نه تا پنج کار می‌کنم. ساعت ۶:۳۰ بعدازظهر غذا می‌خورم. بعد از اون ظرف می‌شورم. ساعت یازده می‌خوابم.
    note: هم به ترتیب کارها و هم به ساعت‌هایشان توجه کنید. به *op*، *aan* و *af* در آخر جمله‌های دارای فعل جداشدنی دقت کنید.
    glosses:
      Mijn: من
      dag: روز
      sta: بلند شدن (با op)
      half: نیمه‌ی راه تا ساعت بعدی (half acht = ۷:۳۰)
      acht: هشت
      Daarna: بعد از اون
      kleed: لباس پوشیدن (با me ... aan)
      uur: ساعت
      ontbijt: صبحانه خوردن
      werk: کار کردن
      negen: نُه
      vijf: پنج
      zeven: هفت
      avonds: عصر / شب
      eet: غذا خوردن
      was: ظرف شستن (با af)
      elf: یازده
      slaap: خوابیدن
  nl.a1.unit10.lesson06.teach.question:
    title: پرسیدن درباره‌ی یک روز
    gloss: 'لوته: روزت چه شکلی است، عمر؟'
    note: '*Hoe ziet jouw dag eruit?* روشی دوستانه است برای اینکه از کسی بخواهیم روزش را توضیح بدهد. *Eruitzien* جداشدنی است: *ziet ... eruit*.'
  nl.a1.unit10.lesson06.teach.morning:
    title: صبح عمر
    gloss: 'عمر: ساعت هفت و نیم بلند می‌شوم. بعدش لباس می‌پوشم و ساعت هشت صبحانه می‌خورم.'
    note: عمر سه کار صبح را به هم وصل می‌کند و *op* و *aan* را آخر جمله‌شان نگه می‌دارد.
  nl.a1.unit10.lesson06.teach.work:
    title: روز کاری عمر
    gloss: 'لوته: کِی کار می‌کنی؟ عمر: از ساعت نه تا پنج کار می‌کنم.'
    note: لوته و عمر با هم از *je* غیررسمی استفاده می‌کنند.
  nl.a1.unit10.lesson06.teach.evening:
    title: شب عمر
    gloss: 'عمر: ساعت شش و نیم عصر شام می‌خورم. بعدش ظرف‌ها را می‌شویم. ساعت یازده می‌خوابم.'
    note: 'شروع جمله با ساعت یا *daarna* فعل را قبل از *ik* می‌آورد: *eet ik*، *was ik*، *slaap ik*. *Af* آخر جمله می‌ماند.'
  nl.a1.unit10.lesson06.teach.lotte:
    title: صبح لوته
    gloss: 'لوته: ساعت شش بلند می‌شوم، ولی تا شش و نیم صبحانه نمی‌خورم.'
    note: '*Pas* اینجا یعنی «تازه، نه زودتر». لوته ساعت بلند شدنش را با ساعت صبحانه‌اش مقایسه می‌کند.'
