  nl.a2.unit73.lesson01.teach.solliciteren_voor:
    title: درخواست کار برای یه آگهی استخدام
    gloss: من می‌خوام برای این آگهی استخدام درخواست کار بدم.
    note: Wil graag درخواست را مؤدبانه‌تر می‌کنه؛ solliciteren voor ترکیب ثابت فعل و حرف اضافه برای درخواست کار دادن برای یه چیزه.
  nl.a2.unit73.lesson01.teach.kantoor_bloem_zoekt:
    title: شرکت نیازش را اعلام می‌کنه
    gloss: Kantoor Bloem دنبال یه کارمند اداری می‌گرده.
    note: Zoekt (از zoeken، یعنی «دنبال چیزی گشتن») فعلیه که آگهی‌های استخدام معمولاً برای اعلام یه موقعیت شغلی به کار می‌برن.
  nl.a2.unit73.lesson02.teach.sollicitatiegesprek:
    title: مصاحبهٔ کاری
    gloss: مصاحبهٔ کاری
    note: 'اسمی از دستهٔ het: het sollicitatiegesprek، که تحت‌اللفظی یعنی «گفت‌وگوی درخواست کار».'
    example_gloss: مصاحبهٔ کاری هفتهٔ بعده.
  nl.a2.unit73.lesson02.teach.afspraak_maken:
    title: درخواست وقت
    gloss: می‌شه برای مصاحبهٔ کاری وقت بگیرم؟
    note: Een afspraak maken voor همون الگوی وقت گرفتن واحد ۴۶ رو دوباره به کار می‌بره.
  nl.a2.unit73.lesson02.teach.natuurlijk_dinsdag:
    title: تعیین زمان
    gloss: البته، می‌تونید سه‌شنبه ساعت ده سر بزنید؟
    note: Langskomen (سر زدن) همون فعل جداشدنی تماس woningcorporatie در واحد ۲۸ هست.
  nl.a2.unit73.lesson03.teach.ervaring:
    title: تجربه
    gloss: تجربه
    note: 'این اسم جزو اسم‌های «de» است: de ervaring.'
    example_gloss: من به‌عنوان داوطلب تجربه دارم.
  nl.a2.unit73.lesson03.teach.vaardigheid:
    title: مهارت
    gloss: مهارت
    note: 'این اسم جزو اسم‌های «de» است: de vaardigheid.'
    example_gloss: تایپ کردن یه مهارت مهمه.
  nl.a2.unit73.lesson03.teach.ervaring_bibliotheek:
    title: گفتن تجربهٔ مشخص
    gloss: من توی کتابخونه سابقهٔ کار داوطلبانه دارم.
    note: Als vrijwilliger (به‌عنوان داوطلب) نقش را مشخص می‌کند؛ in de bibliotheek همان کتابخانه‌ای است که در درس ۴۷ دیدید.
  nl.a2.unit73.lesson03.teach.goede_vaardigheden:
    title: گفتن مهارت‌های کلی
    gloss: من مهارت‌های خوبی دارم.
    note: Vaardigheden شکل جمع vaardigheid است.
  nl.a2.unit73.lesson04.teach.beschikbaar:
    title: در دسترس
    gloss: در دسترس؛ خالی
    note: صفت است و چه قبل از zijn بیاید چه بعد از آن، تغییر نمی‌کند.
    example_gloss: نینا از دوشنبه در دسترس است.
  nl.a2.unit73.lesson04.teach.werktijden:
    title: ساعت‌های کار
    gloss: ساعت کار
    note: 'اسم جمع است: de werktijden همیشه به‌صورت جمع به کار می‌رود.'
    example_gloss: ساعت کار چیه؟
  nl.a2.unit73.lesson04.teach.beschikbaar_dagen:
    title: گفتن روزهای مشخصِ در دسترس بودن
    gloss: من دوشنبه، چهارشنبه و جمعه آزادم.
    note: Op + فهرست روزها نشان می‌دهد که کدام روزها وقت آزاد دارید.
  nl.a2.unit73.lesson04.teach.werktijden_precies:
    title: پرسیدن سؤال برای روشن شدن موضوع
    gloss: ساعت‌های کار دقیقاً چیست؟
    note: Precies (دقیقاً) سؤال را مشخص‌تر می‌کند و در مصاحبه، پرسش تکمیلیِ طبیعی‌ای است.
  nl.a2.unit73.lesson05.teach.vacature_tekst:
    title: خواندن یک آگهی استخدام
    gloss: 'دفتر Bloem یک کارمند اداری استخدام می‌کند. تجربهٔ ارتباط با مشتری یک امتیاز است. ساعت‌های کار: دوشنبه، چهارشنبه و جمعه، از ساعت نه تا پنج. برای مصاحبهٔ استخدامی تماس بگیرید.'
    note: به عنوان شغلی، تجربهٔ ترجیحی و روزها و ساعت‌ها دقت کنید.
    glosses:
      zoekt: دنبال ... می‌گردد (از zoeken)
      administratief: اداری
      medewerker: کارمند / همکار
      Ervaring: تجربه
      klantcontact: ارتباط با مشتری
      pre: یک امتیاز / یک مزیت (اصطلاح رایج در آگهی‌های استخدام هلندی)
      Werktijden: ساعت‌های کار
      maandag: دوشنبه
      woensdag: چهارشنبه
      vrijdag: جمعه
      negen: نُه
      tot: تا
      vijf: پنج
      uur: ساعت
      Bel: تماس بگیرید (امر از bellen)
      sollicitatiegesprek: مصاحبهٔ استخدامی
  nl.a2.unit73.lesson05.teach.ervaring_klantcontact:
    title: گفتن تجربهٔ مرتبط
    gloss: من در ارتباط با مشتری تجربه دارم.
    note: Klantcontact (ارتباط با مشتری) دقیقاً همان کلمه‌ای است که در آگهی استخدام آمده بود.
  nl.a2.unit73.lesson06.teach.jansen_greet:
    title: خانم Jansen به نینا سلام می‌کند
    gloss: 'خانم Jansen: صبح بخیر، به دفتر Bloem خوش آمدید. لطفاً دربارهٔ تجربهٔ خودتان بگویید.'
    note: Vertelt u eens over... یک روش رسمی و رایج برای شروع سؤال در مصاحبه است.
  nl.a2.unit73.lesson06.teach.nina_ervaring:
    title: نینا دربارهٔ تجربهٔ خودش می‌گوید
    gloss: 'نینا: صبح بخیر. من در کتابخانه تجربهٔ کار داوطلبانه دارم. آنجا زیاد با مشتری‌ها در ارتباط بودم.'
    note: Had گذشتهٔ ساده‌ی hebben است و اینجا برای دوره‌ای از کار داوطلبانه به کار رفته که تمام شده است.
  nl.a2.unit73.lesson06.teach.jansen_beschikbaar:
    title: خانم Jansen دربارهٔ در دسترس بودن می‌پرسد
    gloss: 'خانم Jansen: خوب است. دوشنبه، چهارشنبه و جمعه در دسترس هستید؟'
    note: تقریباً همان جمله‌ای است که قبلاً یاد گرفتید، این بار به شکل سؤال.
  nl.a2.unit73.lesson06.teach.nina_dat_kan:
    title: نینا تأیید می‌کند و خودش سؤال می‌پرسد
    gloss: 'نینا: بله، مشکلی نیست. ساعت‌های کار دقیقاً چیست؟'
    note: Dat kan (مشکلی نیست / ممکن است) راهی طبیعی برای تأیید در دسترس بودن، پیش از پرسیدن سؤال بعدی است.
  nl.a2.unit73.lesson06.teach.jansen_uren_contact:
    title: خانم Jansen جواب می‌دهد و صحبت را تمام می‌کند
    gloss: 'خانم Jansen: از ساعت نه تا پنج. ما همین هفته با شما تماس می‌گیریم.'
    note: Contact met u op nemen همان ساختار فعل جداشدنی‌ای است که در درس ۲۸، در تماس با woningcorporatie دیدید.
  nl.a2.unit73.lesson06.teach.nina_dank_gesprek:
    title: نینا از خانم Jansen تشکر می‌کند
    gloss: 'نینا: از شما برای مصاحبه متشکرم.'
    note: Dank u wel همان تشکر رسمی‌ای است که در سراسر دورهٔ A2 به کار رفته است.
  nl.a2.unit73.lesson06.teach.summary_grammar:
    title: خلاصهٔ مصاحبه
    gloss: نینا برای دفتر Bloem درخواست کار داده است. او در کتابخانه تجربهٔ کار داوطلبانه دارد.
    note: Heeft ... gesolliciteerd ماضی نقلی فعل solliciteren است (gesolliciteerd اسم مفعول است)؛ zij ضمیر سومشخص مفرد مؤنث، یعنی «او» است.
