teaching:
  nl.a1.unit16.lesson01.teach.niet_lekker:
    title: احساس ناخوشی
    gloss: حالم خوب نیست.
    note: '*Voelen* در اینجا بازتابی است (*je*/*me voelen*)؛ *niet lekker* روش کلی و ملایم برای گفتن این است که حال آدم خوب نیست.'
  nl.a1.unit16.lesson01.teach.ziek:
    title: بیمار
    gloss: بیمار
    note: صفت پایه که با *zijn* (بودن) می‌آید.
    example_gloss: من بیمارم.
  nl.a1.unit16.lesson01.teach.ben_ziek:
    title: بیمار بودن
    gloss: من بیمارم.
    note: '*Ziek* حالتی کلی‌تر و شدیدتر از *niet lekker* را نشان می‌دهد.'
  nl.a1.unit16.lesson01.teach.hoofdpijn:
    title: سردرد
    gloss: سردرد
    note: 'بعد از *hebben* بدون حرف تعریف می‌آید: *Ik heb hoofdpijn*، نه *Ik heb een hoofdpijn*.'
    example_gloss: سردرد دارم.
  nl.a1.unit16.lesson01.teach.heb_hoofdpijn:
    title: سردرد داشتن
    gloss: سردرد دارم.
    note: در هلندی نشانه‌های بیماری معمولاً با *hebben* (داشتن) می‌آیند؛ در فارسی هم می‌گوییم «سردرد دارم».
  nl.a1.unit16.lesson01.teach.buikpijn:
    title: دل‌درد
    gloss: دل‌درد
    note: همان الگوی بدون حرف تعریفِ *hoofdpijn*.
    example_gloss: دل‌درد دارم.
  nl.a1.unit16.lesson01.teach.heb_buikpijn:
    title: دل‌درد داشتن
    gloss: دل‌درد دارم.
    note: از همان الگوی *hebben* در *hoofdpijn* پیروی می‌کند.
  nl.a1.unit16.lesson02.teach.wat_is_er:
    title: پرسیدن به شکل کلی
    gloss: چی شده؟
    note: روشی کلی و همه‌کاره برای پرسیدن اینکه مشکلی هست یا نه.
  nl.a1.unit16.lesson02.teach.wat_scheelt:
    title: یک عبارت رایج
    gloss: چته؟ / چی شده؟
    note: '*Scheelt eraan* یک اصطلاح ثابت است؛ آن را کلمه‌به‌کلمه ترجمه نکنید.'
  nl.a1.unit16.lesson02.teach.keelpijn:
    title: گلودرد
    gloss: گلودرد
    note: همان الگوی بدون حرف تعریفِ *hoofdpijn* و *buikpijn*.
    example_gloss: گلودرد دارم.
  nl.a1.unit16.lesson02.teach.heb_keelpijn:
    title: گلودرد داشتن
    gloss: گلودرد دارم.
    note: از همان الگوی *hebben* در بقیه‌ی نشانه‌ها پیروی می‌کند.
  nl.a1.unit16.lesson02.teach.gaat_het:
    title: حال کسی را پرسیدن
    gloss: خوبی؟ نه، حالم خوب نیست.
    note: '*Gaat het?* پرسش بسیار رایج و خودمانی برای حال‌پرسی بین دوستان است.'
  nl.a1.unit16.lesson03.teach.koorts:
    title: تب
    gloss: تب
    note: مثل بقیه‌ی نشانه‌ها بعد از *hebben* بدون حرف تعریف می‌آید.
    example_gloss: تب دارم.
  nl.a1.unit16.lesson03.teach.heb_koorts:
    title: تب داشتن
    gloss: تب دارم.
    note: از الگوی *hebben* پیروی می‌کند.
  nl.a1.unit16.lesson03.teach.verkouden:
    title: سرما خوردن
    gloss: سرما خورده / سرما خوردن
    note: verkouden صفت است و با *zijn* می‌آید، نه اسمی که با *hebben* بیاید؛ زبان‌آموزان اغلب اینجا اشتباه می‌کنند.
    example_gloss: سرما خورده‌ام.
  nl.a1.unit16.lesson03.teach.ben_verkouden:
    title: گفتن اینکه سرما خورده‌اید
    gloss: سرما خورده‌ام.
    note: هلندی از *zijn* + *verkouden* استفاده می‌کند (یعنی «سرما خورده‌ام»)؛ نگویید *Ik heb een verkouden*.
  nl.a1.unit16.lesson03.teach.zijn_note:
    title: انتخاب zijn یا hebben به نوع واژه بستگی دارد، نه به مدت بیماری
    gloss: 'Ziek و verkouden صفت‌اند و با zijn می‌آیند: ik ben ziek، ik ben verkouden. Koorts و hoofdpijn اسم‌اند و با hebben می‌آیند.'
    note: انتخاب بین *zijn* و *hebben* به نوع دستوری واژه (صفت یا اسمِ نشانه) بستگی دارد، نه به موقتی بودن حالت؛ *koorts* (اسم) به اندازه‌ی *verkouden* (صفت) موقتی است، اما باز هم با *hebben* می‌آید، نه *zijn*.
  nl.a1.unit16.lesson04.teach.apotheek:
    title: داروخانه
    gloss: داروخانه
    note: 'اسمی با حرف تعریف de: *de apotheek*.'
    example_gloss: دارم می‌روم داروخانه.
  nl.a1.unit16.lesson04.teach.waarmee_helpen:
    title: احوال‌پرسی داروساز
    gloss: چه کمکی از من برمی‌آید؟
    note: '*Waarmee kan ik u helpen?* جمله‌ی رسمی و استاندارد خوشامدگویی در خدمات است و همان سطح رسمی *u* را از درس‌های ۱ و ۱۵ ادامه می‌دهد.'
  nl.a1.unit16.lesson04.teach.iets_tegen:
    title: چیزی برای یک علامت خواستن
    gloss: برای سردرد چیزی دارید؟
    note: '*Iets tegen* + نشانه، روش طبیعی برای درخواست دارو است.'
  nl.a1.unit16.lesson04.teach.tablet:
    title: یک قرص
    gloss: قرص
    note: 'اسمی با حرف تعریف het: *het tablet*، هرچند اینجا نکره و به شکل *een tablet* آمده است.'
    example_gloss: یک قرص می‌خورم.
  nl.a1.unit16.lesson04.teach.neem_tablet:
    title: دستور مصرف
    gloss: روزی دو بار یک قرص بخورید.
    note: '*Neem* امر از فعل *nemen* (گرفتن، خوردن) است و برای دستورالعمل‌ها به کار می‌رود.'
  nl.a1.unit16.lesson04.teach.register_note:
    title: لحن مناسب در داروخانه
    gloss: در داروخانه از شکل محترمانه‌ی u استفاده می‌کنید.
    note: داروساز یک بزرگسالِ ناآشنا در نقش خدمات‌دهنده است؛ همان قاعده‌ی رسمی گیشه‌ی بلیت در درس ۱۵.
  nl.a1.unit16.lesson05.teach.advies:
    title: خواندن یک توصیه‌نامه‌ی داروخانه
    gloss: 'توصیه: روزی دو بار یک قرص با آب بخورید. خوب استراحت کنید و آب زیاد بنوشید. بعد از سه روز هنوز حالتان خوب نیست؟ پس به پزشک مراجعه کنید.'
    note: به مقدار مصرف دارو، دو توصیه‌ی غیردارویی و زمان مراجعه به پزشک دقت کنید.
    glosses:
      Advies: توصیه
      neem: بخور
      keer: بار
      dag: روز
      tablet: قرص
      Rust: استراحت کن
      drink: بنوش
      Voel: احساس کردن
      steeds: هنوز
      lekker: خوب
      huisarts: پزشک
  nl.a1.unit16.lesson06.teach.lotte_ask:
    title: لوته حال‌پرسی می‌کند
    gloss: 'لوته: سلام عمر، حالت چطوره؟ بهتر شدی؟'
    note: '*Al* (تا حالا/از قبل) نشان می‌دهد لوته می‌پرسد آیا از آخرین صحبتشان عمر بهتر شده است.'
  nl.a1.unit16.lesson06.teach.omar_still_bad:
    title: عمر هنوز بیمار است
    gloss: 'عمر: هنوز نه خیلی. هنوز سردرد دارم و خسته‌ام.'
    note: '*Nog steeds* (هنوز هم) نشان می‌دهد سردرد قبلی از بین نرفته است؛ *moe* (خسته) صفت جدید و مفیدی است.'
  nl.a1.unit16.lesson06.teach.lotte_ask_tablet:
    title: لوته درباره‌ی دارو می‌پرسد
    gloss: 'لوته: قرص خوردی؟'
    note: '*Genomen* اسم مفعول *nemen* است و از همان الگوی *heb* + اسم مفعول درس ۱۲ پیروی می‌کند.'
  nl.a1.unit16.lesson06.teach.omar_took_tablet:
    title: عمر تأیید می‌کند
    gloss: 'عمر: آره، قرص خوردم. الان می‌خوام استراحت کنم.'
    note: '*Ga nu rusten* (الان می‌خواهم استراحت کنم) از الگوی آینده‌ی نزدیک *gaan* + مصدر استفاده می‌کند.'
  nl.a1.unit16.lesson06.teach.lotte_wish:
    title: لوته برایش آرزوی بهبودی می‌کند
    gloss: 'لوته: فکر خوبیه. خوب استراحت کن. زودتر خوب شی!'
    note: '*Beterschap!* عبارت ثابت و رایج برای آرزوی بهبودی سریع است.'
  nl.a1.unit16.lesson06.teach.omar_thanks:
    title: عمر خداحافظی می‌کند
    gloss: 'عمر: ممنون، فردا می‌بینمت!'
    note: '*Tot morgen!* همان الگوی *tot* + زمان را در خداحافظی‌های درس‌های قبل دوباره به کار می‌برد.'
