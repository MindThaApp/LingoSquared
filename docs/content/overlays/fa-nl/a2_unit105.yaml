      right: آشپزی کردن
    - left: afwassen
      right: ظرف شستن
    - left: schoonmaken
      right: تمیز کردن
    - left: bellen
      right: تلفن زدن
    - left: lezen
      right: خواندن
    - left: slapen
      right: خوابیدن
