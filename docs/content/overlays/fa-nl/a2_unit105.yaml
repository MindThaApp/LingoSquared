      status: correct
    - value: Omar is soep aan het koken.
      status: correct
    - value: Omar is soep aan het koken
      status: correct
    feedback: '*Omar is soep aan het maken* (یا *aan het koken*).'
    prompt_blocks:
    - Omar دارد سوپ درست می‌کند. از aan het استفاده کنید.
  nl.a2.unit105.lesson03.exercise01.choose_now:
    instruction: جمله‌ای را انتخاب کنید که درباره‌ی همین الان است.
    correct_option: Omar is nu aan het koken.
    distractors:
    - Omar kookt elke dag.
    - Lotte belt vaak haar moeder.
    - Ik doe elke zaterdag de was.
    accepted_answers:
    - value: Omar is nu aan het koken.
      status: correct
    feedback: '*Nu* و *aan het koken* نشان می‌دهند که کار همین لحظه در حال انجام است.'
    prompt_blocks:
    - کدام جمله می‌گوید همین الان چه اتفاقی دارد می‌افتد؟
  nl.a2.unit105.lesson03.exercise02.listen_habit:
