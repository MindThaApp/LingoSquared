      right: Omar دارد سوپ درست می‌کند
    - left: نور داره آشپزخونه رو تمیز می‌کنه
      right: Noor دارد آشپزخانه را تمیز می‌کند
    - left: لوته داره به مادرش زنگ می‌زنه
      right: Lotte دارد به مادرش زنگ می‌زند
    - left: Wij zijn de afwas aan het doen
      right: ما داریم ظرف می‌شوییم
    - left: Jij bent het eten aan het koken
      right: شما دارید غذا می‌پزید
