course:
  title: هلندی A2
  description: هلندی A2 با تمرکز بر دستور زبان، برای توصیف کارهایی که همین الان در جریان‌اند.
  learning_goal: با aan het + مصدر و zitten/staan/liggen/lopen te بگویید خودتان یا کس دیگری وسط چه کاری است.
units:
  nl.a2.unit105.ik_ben_aan_het_koken:
    title: دارم آشپزی می‌کنم
    description: 'بگویید همین الان چه خبر است: aan het + مصدر، و نشسته، ایستاده، دراز کشیده یا در حال راه رفتن کاری کردن.'
lessons:
  nl.a2.unit105.lesson01.wat_ben_je_aan_het_doen:
    title: چه کار می‌کنی؟
  nl.a2.unit105.lesson02.met_een_object:
    title: با مفعول
  nl.a2.unit105.lesson03.nu_of_altijd:
    title: الان یا هر روز؟
  nl.a2.unit105.lesson04.zitten_staan_liggen_lopen:
    title: نشستن، ایستادن، دراز کشیدن، راه رفتن
  nl.a2.unit105.lesson05.omars_bericht:
    title: پیام Omar
  nl.a2.unit105.lesson06.lotte_en_omar_bellen:
    title: لوته و عمر پای تلفن
teaching:
  nl.a2.unit105.lesson01.teach.huishouden:
    title: کارهای خانه
    gloss: آشپزی کردن / ظرف شستن / تمیز کردن / لباس‌ها (رخت‌ها) / انجام دادن
    note: '*De was doen* یعنی لباس شستن؛ *doen* فعل جمله‌ی *wat ben je aan het doen?* است.'
    example_gloss:
    - عمر خوب آشپزی می‌کند.
    - من دارم می‌روم ظرف بشویم.
    - نور می‌خواهد تمیزکاری کند.
  nl.a2.unit105.lesson01.teach.telefoon:
    title: تلفن و وقت آزاد
    gloss: تلفن زدن / خواندن / خوابیدن / تلفن / با / من (مال من) / مادر / خواهر
    note: '*Bellen* یعنی به کسی تلفن زدن؛ برای گفتن اینکه با چه کسی صحبت می‌کنید، *met* را اضافه کنید.'
    example_gloss:
    - لوته با مادرش تلفنی صحبت می‌کند.
    - من یک کتاب می‌خوانم.
    - خواهرم خواب است.
  nl.a2.unit105.lesson01.teach.wie:
    title: آدم‌ها، الان و در خانه
    gloss: من / تو (با تأکید) / تو / او (مذکر) / او (مؤنث) / چه / الان / خانه / لوته / عمر / نور
    note: '*Jij* شکل تأکیدی *je* است؛ هر دو برای دوست یعنی «تو».'
    example_gloss:
    - من خانه هستم.
    - او الان خانه است.
    - Noor دارد چه کار می‌کند؟
  nl.a2.unit105.lesson01.teach.aanhet:
    title: Aan het + مصدر
    gloss: دارم آشپزی می‌کنم. دارم تلفن می‌زنم. دارم می‌خوانم.
    note: برای کاری که همین الان وسط انجامش هستید، از *zijn* + *aan het* + مصدر استفاده کنید. مصدر آخر جمله می‌آید.
  nl.a2.unit105.lesson01.teach.vraag:
    title: پرسیدن اینکه کسی چه‌کار می‌کند
    gloss: چه‌کار می‌کنی؟ دارم آشپزی می‌کنم.
    note: 'در جمله‌ی پرسشی فعل قبل از فاعل می‌آید: *ben je*. در جمله‌ی خبری ترتیب این است: *je bent*.'
  nl.a2.unit105.lesson02.teach.zijn:
    title: فعل zijn
    gloss: دارم آشپزی می‌کنم. تو داری می‌خوانی. او دارد تلفن می‌زند. ما داریم ظرف می‌شوییم. داری آشپزی می‌کنی؟ بله، دارم آشپزی می‌کنم.
    note: '*Zijn* با فاعل تغییر می‌کند: *ben, bent, is, zijn*. در جمله‌ی پرسشی با *je*، حرف t حذف می‌شود: *ben je*.'
  nl.a2.unit105.lesson02.teach.eten:
    title: غذا و آشپزخانه
    gloss: غذا / سوپ / آشپزخانه / ظرف‌های کثیف / درست کردن
    note: '*De afwas doen* معمول‌ترین راه برای گفتن «ظرف می‌شویم» است.'
    example_gloss:
    - غذا آماده است.
    - سوپ داغ است.
    - من چای درست می‌کنم.
  nl.a2.unit105.lesson02.teach.object:
    title: مفعول قبل از aan het
    gloss: دارم لباس می‌شویم. عمر دارد سوپ درست می‌کند. نور دارد آشپزخانه را تمیز می‌کند.
    note: 'مفعول بین شکل فعل *zijn* و *aan het* قرار می‌گیرد: *ik ben de was aan het doen*. *Aan het* و مصدر کنار هم در آخر جمله می‌مانند.'
  nl.a2.unit105.lesson02.teach.moeder:
    title: تلفن زدن به کسی
    gloss: لوته دارد به مادرش تلفن می‌زند. ما داریم غذا درست می‌کنیم. تو داری ظرف می‌شویی.
    note: 'با *bellen* کسی که به او زنگ می‌زنید مفعول است: *haar moeder aan het bellen*.'
  nl.a2.unit105.lesson03.teach.tijd:
    title: کی؟
    gloss: هر روز / اغلب / در این لحظه / هر شنبه / الان
    note: '*Elke dag, vaak* و *elke zaterdag* به یک عادت اشاره می‌کنند. *Nu* و *op dit moment* به زمان حال و همین لحظه اشاره می‌کنند.'
    example_gloss:
    - هر روز با روز دیگر فرق دارد.
    - اغلب شلوغ است.
    - در این لحظه آرام است.
  nl.a2.unit105.lesson03.teach.presens:
    title: زمان حال ساده
    gloss: من هر روز آشپزی می‌کنم. او هر روز آشپزی می‌کند. من اغلب تلفن می‌زنم. او اغلب تلفن می‌زند. من لباس می‌شویم. او لباس می‌شوید.
    note: زمان حال ساده (*ik kook, hij kookt*) برای عادت‌ها و واقعیت‌هاست. برای *hij/ze/het* پایان -t اضافه می‌شود، و برای *jij/je* هم وقتی قبل از فعل بیاید (*jij kookt*).
  nl.a2.unit105.lesson03.teach.contrast:
    title: عادت یا همین الان؟
    gloss: من هر روز آشپزی می‌کنم. الان دارم آشپزی می‌کنم. لوته اغلب به مادرش تلفن می‌زند. الان دارد به مادرش تلفن می‌زند.
    note: 'زمان حال ساده: کاری که به‌طور منظم اتفاق می‌افتد. *Zijn* + *aan het* + مصدر: کاری که همین لحظه در حال انجام است.'
  nl.a2.unit105.lesson03.teach.nu_voorop:
    title: nu در اول جمله
    gloss: الان دارم لباس می‌شویم. در این لحظه عمر دارد آشپزی می‌کند.
    note: 'وقتی *nu* یا *op dit moment* اول جمله بیاید، فعل در جایگاه دوم می‌ماند: *nu ben ik*. هر دو ترتیب درست است: *ik ben nu de was aan het doen*.'
  nl.a2.unit105.lesson04.teach.plekken:
    title: مکان‌ها و چیزها
    gloss: کاناپه / روزنامه / تخت / در تخت / باغ
    note: '*Op de bank* = روی کاناپه؛ *in bed* = در تخت.'
    example_gloss:
    - کاناپه بزرگ است.
    - او روزنامه می‌خواند.
    - باغ قشنگ است.
  nl.a2.unit105.lesson04.teach.houdingen:
    title: فعل‌های حالت بدن
    gloss: نشستن / ایستادن / دراز کشیدن / راه رفتن / منتظر ماندن
    note: 'این فعل‌ها نشان می‌دهند کسی کاری را در چه حالتی انجام می‌دهد: نشسته، ایستاده، دراز کشیده یا در حال راه رفتن.'
    example_gloss:
    - می‌خواهم بنشینم.
    - او می‌خواهد بایستد.
    - او باید منتظر بماند.
  nl.a2.unit105.lesson04.teach.te:
    title: zitten, staan, liggen, lopen + te
    gloss: او نشسته و دارد تلفن می‌زند. او ایستاده و دارد آشپزی می‌کند. او دراز کشیده و خواب است. او راه می‌رود و دارد تلفن می‌زند.
    note: برای گفتن اینکه کسی در حالت نشسته، ایستاده، دراز کشیده یا در حال راه رفتن مشغول کاری است، از *zit / staat / ligt / loopt* + *te* + مصدر استفاده کنید. این ساختار در هلندی محاوره‌ای خیلی رایج است.
  nl.a2.unit105.lesson04.teach.object_te:
    title: مفعول و مکان قبل از te
    gloss: او نشسته و دارد روزنامه می‌خواند. عمر در آشپزخانه ایستاده و دارد سوپ درست می‌کند. لوته روی کاناپه نشسته و دارد کتاب می‌خواند.
    note: 'مفعول‌ها و مکان‌ها قبل از *te* می‌آیند و مصدر آخر است. فعل صرف‌شده در جایگاه دوم می‌ماند: *Hij zit ... te lezen.*'
  nl.a2.unit105.lesson04.teach.vergelijk:
    title: aan het یا zitten te
    gloss: او دارد می‌خواند. او نشسته و دارد می‌خواند. او دارد آشپزی می‌کند. او ایستاده و دارد آشپزی می‌کند.
    note: هر دو شکل نشان می‌دهند که کاری در جریان است. *Zit/staat/ligt/loopt te* حالت بدن را هم نشان می‌دهد؛ پس فعلی را انتخاب کنید که با کار واقعی آن شخص جور باشد.
  nl.a2.unit105.lesson05.teach.reading:
    title: پیام عمر به لوته
    gloss: سلام لوته! من خانه‌ام. دارم سوپ درست می‌کنم. خواهرم روی کاناپه نشسته و دارد به مادرم تلفن می‌زند. نور دارد ظرف می‌شوید. تو چی؟ تو چه‌کار می‌کنی؟
    note: پیدا کنید چه کسی همین الان چه‌کار می‌کند.
    glosses:
      zus: خواهر
      moeder: مادر
      afwas: ظرف‌های کثیف
      soep: سوپ
      bank: کاناپه
  nl.a2.unit105.lesson06.teach.beurt1:
    title: لوته از عمر می‌پرسد
    gloss: 'لوته: سلام عمر، چه‌کار می‌کنی؟'
  nl.a2.unit105.lesson06.teach.beurt2:
    title: عمر جواب می‌دهد و می‌پرسد
    gloss: 'عمر: دارم سوپ درست می‌کنم. تو چی؟'
  nl.a2.unit105.lesson06.teach.beurt3:
    title: لوته جواب می‌دهد
    gloss: 'لوته: دارم لباس می‌شویم.'
  nl.a2.unit105.lesson06.teach.beurt4:
    title: عمر درباره‌ی نور می‌پرسد
    gloss: 'عمر: نور چه‌کار می‌کند؟'
  nl.a2.unit105.lesson06.teach.beurt5:
    title: لوته نور را توصیف می‌کند
    gloss: 'لوته: نور روی کاناپه نشسته و دارد تلفن می‌زند.'
exercises:
  nl.a2.unit105.lesson01.exercise01.choose_koken:
    instruction: جملهٔ هلندی درست را انتخاب کنید.
    correct_option: Ik ben aan het koken.
    distractors:
    - Ik ben aan het bellen.
    - Ik ben aan het slapen.
    - Ik ben aan het lezen.
    accepted_answers:
    - value: Ik ben aan het koken.
      status: correct
    feedback: '*Aan het koken* = وسط آشپزی بودن.'
    prompt_blocks:
    - دارم آشپزی می‌کنم.
  nl.a2.unit105.lesson01.exercise02.choose_question:
    instruction: پرسش هلندی درست را انتخاب کنید.
    correct_option: Wat ben je aan het doen?
    distractors:
    - Wat je ben aan het doen?
    - Wat ben je doen aan het?
    - Wat is je aan het doen؟
    accepted_answers:
    - value: Wat ben je aan het doen?
      status: correct
    feedback: در جمله‌ی پرسشی، *ben* بلافاصله بعد از *wat* می‌آید، بعد *je*، و بعد *aan het doen*.
    prompt_blocks:
    - جمله‌ای را انتخاب کنید که یعنی «چه کار می‌کنی؟»
  nl.a2.unit105.lesson01.exercise03.match_verbs:
