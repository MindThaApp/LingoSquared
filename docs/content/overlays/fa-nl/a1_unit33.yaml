    gloss: لوته هر روز با قطار به سر کار می‌رود. عمر معمولاً با دوچرخه می‌رود، ولی وقتی باران می‌بارد او هم با قطار می‌رود. ساندر ترجیح می‌دهد با ماشین برود. فنا نزدیک کارش زندگی می‌کند و پیاده می‌رود. شما چطور به سر کار می‌روید؟
    note: چهار شیوهٔ مختلف رفت‌وآمد و یک حالت شرطی (باران) را در برابر هم می‌گذارد.
