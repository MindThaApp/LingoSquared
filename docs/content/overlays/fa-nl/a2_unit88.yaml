course:
  title: هلندی A2
  description: دورهٔ دستورمحور هلندی A2 برای صحبت دربارهٔ توانایی و امکان.
  learning_goal: بگویید چه کارهایی می‌تونید یا نمی‌تونید بکنید و چه چیزی ممکنه اتفاق بیفته؛ با kunnen، ترکیب فعل‌های کمکی و misschien.
units:
  nl.a2.unit88.wat_kan_ik:
    title: چه کارهایی از من برمی‌آد؟
    description: بگویید چه کارهایی می‌تونید و نمی‌تونید بکنید، فعل‌های کمکی را با هم ترکیب کنید و دربارهٔ چیزهایی که ممکنه اتفاق بیفتن حرف بزنید.
lessons:
  nl.a2.unit88.lesson01.dit_kan_ik:
    title: این کارها از من برمی‌آد
  nl.a2.unit88.lesson02.kun_je_dat:
    title: می‌تونی این کار رو بکنی؟
  nl.a2.unit88.lesson03.kunnen_willen_moeten:
    title: توانستن، خواستن، باید
  nl.a2.unit88.lesson04.twee_werkwoorden:
    title: دو فعل پشت سر هم
  nl.a2.unit88.lesson05.misschien_kan_het:
    title: شاید ممکن باشه
  nl.a2.unit88.lesson06.lotte_en_omar:
    title: Lotte و Omar قرار می‌گذارند
teaching:
  nl.a2.unit88.lesson01.teach.vaardigheden:
    title: مهارت‌ها
    gloss: آشپزی کردن / شنا کردن / دوچرخه‌سواری کردن / نقاشی کشیدن / آواز خواندن / گیتار زدن
    note: این مصدرها کارهایی را نام می‌برن که می‌شه انجام داد. همه‌شون به -en ختم می‌شن.
    example_gloss:
    - Omar خوب می‌تونه آشپزی کنه.
    - Lotte می‌تونه دوچرخه‌سواری کنه.
    - Noor می‌تونه آواز بخونه.
  nl.a2.unit88.lesson01.teach.kleine_woorden:
    title: کلمه‌های کوچک
    gloss: من / تو / تو / او / او / ما / شما (جمع) / هم / نه / خوب / خیلی / یه کم
    note: این کلمه‌های کوچک توی هر درس تکرار می‌شن. *Jij* و *je* هر دو یعنی «تو»؛ *je* شکل بی‌تکیه است.
    example_gloss:
    - نمی‌تونم آواز بخونم.
    - خیلی خوب می‌تونی دوچرخه‌سواری کنی.
    - ما هم می‌تونیم آشپزی کنیم.
    - اون یه کم می‌تونه نقاشی بکشه.
  nl.a2.unit88.lesson01.teach.vrienden:
    title: سه دوست
    gloss: Lotte / Omar / Noor
    note: دوستان این دوره در سراسر این واحد دیده می‌شن.
    example_gloss:
    - Lotte و Omar و Noor دوست هستن.
  nl.a2.unit88.lesson01.teach.gn_kunnen:
    title: 'Kunnen: زمان حال'
    gloss: من می‌تونم، تو می‌تونی، او می‌تونه، او می‌تونه، ما می‌تونیم، شما می‌تونید، اونا می‌تونن
    note: '*Kunnen* (توانستن) بی‌قاعده است. مفرد: *ik kan*، *jij kunt*، *hij/zij kan*؛ جمع همیشه *kunnen* است. در گفتار روزمره *jij kan* هم رایج است. در جملهٔ پرسشی با جابه‌جایی فاعل و فعل، -t حذف می‌شه: *kun je?*'
  nl.a2.unit88.lesson01.teach.gn_infinitief:
    title: فعل دوم مصدر است و آخر جمله می‌آد
    gloss: می‌تونم آشپزی کنم. خوب می‌تونم آشپزی کنم. نمی‌تونم شنا کنم.
    note: بعد از *kunnen*، فعل دوم مصدر است و به آخر جمله می‌ره. کلمه‌هایی مثل *goed* و *niet* قبل از اون می‌آن.
  nl.a2.unit88.lesson01.teach.zinnen:
    title: سه جمله
    gloss: Omar خوب می‌تونه آشپزی کنه. من یه کم می‌تونم گیتار بزنم. ما نمی‌تونیم آواز بخونیم.
  nl.a2.unit88.lesson02.teach.meer_vaardigheden:
    title: زبان‌ها و فناوری
    gloss: انگلیسی صحبت کردن / تایپ کردن / تعمیر کردن کامپیوتر
    note: چند کار دیگه که می‌تونید یا نمی‌تونید انجام بدید. *Snel* یعنی «سریع».
    example_gloss:
    - می‌تونی انگلیسی صحبت کنی؟
    - می‌تونید تند تایپ کنید؟
    - من می‌تونم کامپیوتر تعمیر کنم.
  nl.a2.unit88.lesson02.teach.scheidbaar:
    title: فعل‌های جداشدنی کاربردی
    gloss: رفتن دنبال کسی / پاسخ تماس دادن / با خودش آوردن
    note: این فعل‌ها پیشوند جداشدنی دارند (*op-, terug-, mee-*). *Me* یعنی «من/مرا» و *je* هم می‌تونه به معنی «تو/تو را» (مفعول) باشه.
    example_gloss:
    - می‌تونم بیام دنبالت.
    - می‌تونی دوباره بهم زنگ بزنی؟
    - Lotte می‌تونه گیتار رو با خودش بیاره.
  nl.a2.unit88.lesson02.teach.antwoorden:
    title: جواب‌های کوتاه
    gloss: بله، امکانش هست. نه، نمی‌تونم این کار رو بکنم. بله، می‌تونم این کار رو بکنم.
    note: '*Wel* تأکید می‌کنه که کاری شدنیه: *Dat kan ik wel.*'
  nl.a2.unit88.lesson02.teach.gn_vraag:
    title: سؤال با kunnen
    gloss: آشپزی بلدی؟ آشپزی بلدی؟ شما (جمع) آشپزی بلدید؟
    note: 'در سؤال بله/خیر، فعل اول جمله میاد. با *je/jij* فعل *kun* است (بدون t): *Kun je koken?* در گفتار محاوره‌ای *Kan je koken?* هم رایجه.'
  nl.a2.unit88.lesson02.teach.gn_scheidbaar:
    title: فعل کمکی به‌همراه فعل جداشدنی
    gloss: می‌تونم بیام دنبالت. می‌تونی بهم زنگ بزنی؟
    note: 'با فعل کمکی، فعل جداشدنی جدا نمی‌شه: به‌صورت مصدر و کامل آخر جمله می‌مونه. بدون فعل کمکی پیشوند جدا می‌شه (*Ik haal je op*)، ولی با فعل کمکی فعل کامل می‌مونه: *Ik kan je ophalen*.'
  nl.a2.unit88.lesson03.teach.beschikbaar:
    title: آزاد بودن
    gloss: شنبه / یکشنبه / فردا / امشب / وقت / آمدن / کار کردن
    note: با این کلمه‌ها می‌گید کی آزاد یا مشغولید. *Geen tijd* یعنی «وقت ندارم».
    example_gloss:
    - شنبه وقت ندارم.
    - می‌تونید فردا بیایید؟
    - امشب باید کار کنم.
  nl.a2.unit88.lesson03.teach.verbinders:
    title: گفتن دلیل
    gloss: چون / چون / پس
    note: '*Want* و *omdat* هر دو دلیل می‌آورند؛ *dus* نتیجه رو می‌گه. بعد از *want* و *dus* ترتیب کلمات عادیه (اول نهاد، بعد فعل)؛ بعد از *omdat* فعل‌ها می‌رن آخر جمله.'
    example_gloss:
    - نمی‌تونم بیام، چون باید کار کنم.
    - نمی‌تونم بیام، چون باید کار کنم.
    - وقت ندارم، پس نمی‌تونم بیام.
  nl.a2.unit88.lesson03.teach.gn_drie_modalen:
    title: سه فعل کمکی
    gloss: من می‌تونم، من می‌خوام، من باید؛ ما می‌تونیم، ما می‌خواهیم، ما باید
    note: '*Kunnen, willen* و *moeten* هم به همین شکل کار می‌کنند: فعل کمکی صرف‌شده در جایگاه دوم جمله می‌آید و مصدر در آخر جمله قرار می‌گیرد. هرکدام معنی را عوض می‌کنند: توانایی یا امکان، خواسته، الزام.'
  nl.a2.unit88.lesson03.teach.gn_zonder_infinitief:
    title: Kunnen بدون مصدر
    gloss: شنبه نمی‌تونم. یکشنبه می‌تونی؟ بله، یکشنبه می‌تونم.
    note: 'وقتی از زمینهٔ جمله معلومه کدوم فعل مدنظره (اینجا *komen*)، در هلندی معمولاً مصدر حذف می‌شه: *Ik kan zaterdag niet.*'
  nl.a2.unit88.lesson03.teach.zin_contrast:
    title: خواستن در برابر باید
    gloss: می‌خوام بیام، ولی باید کار کنم.
    note: '*Maar* یعنی «ولی/اما».'
  nl.a2.unit88.lesson04.teach.plannen:
    title: بهتر شدن
    gloss: یاد گرفتن / تمرین کردن / بهتر / بیشتر / هفتهٔ بعد / بعداً / با کمال میل
    note: '*Graag* به *willen* معنی «با کمال میل» اضافه می‌کنه: *Ik wil graag ...* = دوست دارم ...'
    example_gloss:
    - دوست دارم بیشتر تمرین کنم.
    - هفتهٔ بعد می‌تونم بیام.
    - بعداً می‌خوام بهتر آشپزی کنم.
  nl.a2.unit88.lesson04.teach.gn_wil_kunnen:
    title: Wil kunnen
    gloss: می‌خوام بتونم شنا کنم. می‌خوام بتونم بهتر آشپزی کنم.
    note: 'می‌شه چند فعل کمکی رو پشت هم آورد. فقط اولی صرف می‌شه و در جایگاه دوم می‌مونه (*wil*). بقیه مصدرن و آخر جمله میان، به این ترتیب: اول فعل کمکی دوم، آخر فعل اصلی: *kunnen zwemmen*.'
  nl.a2.unit88.lesson04.teach.gn_zou_moeten:
    title: Zou moeten
    gloss: باید بیشتر تمرین کنید. ما باید بیشتر تمرین کنیم.
    note: '*Zou moeten* برای توصیه است: «باید / بهتره». *Zou* فعل صرف‌شده است (مفرد *zou*، جمع *zouden*)؛ *moeten* و فعل اصلی آخر جمله می‌آیند.'
  nl.a2.unit88.lesson04.teach.gn_zal_kunnen:
    title: Zal kunnen
    gloss: شنبه می‌تونم بیام. می‌تونم بیام دنبالتون. هفتهٔ بعد باید کار کنم.
    note: '*Ik/hij/zij zal*؛ *jij zult* (و *jij zal*)؛ *wij/jullie/zij zullen*. این فعل به آینده اشاره می‌کنه. بعدش دو مصدر آخر جمله میاد. فعل جداشدنی مثل *ophalen* کامل می‌مونه. *Jou* شکل تأکیدی *je* است: *Ik zal jou kunnen ophalen.*'
  nl.a2.unit88.lesson04.teach.zin_terugbellen:
    title: زنجیرهٔ فعل با فعل جداشدنی
    gloss: فردا می‌تونم بهتون زنگ بزنم.
  nl.a2.unit88.lesson05.teach.woorden:
    title: کلمه‌هایی برای امکان
    gloss: شاید / دانستن / با هم / ما / ساعت / دو / در
    note: '*We* شکل بدون تکیهٔ *wij* است. *Om twee uur* یعنی «ساعت دو».'
    example_gloss:
    - نمی‌دونم.
    - می‌تونیم با هم آشپزی کنیم.
    - می‌تونید ساعت دو بیایید؟
  nl.a2.unit88.lesson05.teach.gn_misschien:
    title: Misschien
    gloss: شاید بتونم بیام. شاید بتونم بیام.
    note: '*Misschien* می‌گه کاری شدنیه ولی قطعی نیست. اول جمله که باشه جای فعل و نهاد عوض می‌شه (فعل قبل از نهاد)؛ بعد از فعل، ترتیب کلمات عادی می‌مونه.'
  nl.a2.unit88.lesson05.teach.gn_het_kan_zijn:
    title: Het kan zijn dat
    gloss: ممکنه مجبور باشم کار کنم. ممکنه فردا بارون بیاد.
    note: '*Het kan zijn dat ...* یک احتمال رو معرفی می‌کنه. بعد از *dat* گروه فعل می‌ره آخر جمله: *dat ik moet werken*؛ اینجا فعل صرف‌شده *moet* قبل از مصدر *werken* میاد. *Kunnen* به‌تنهایی هم می‌تونه احتمال رو برسونه: *Het kan regenen.*'
  nl.a2.unit88.lesson05.teach.reading:
    title: نور برای لوته می‌نویسه
    gloss: سلام لوته، شاید شنبه نتونم بیام. ممکنه مجبور باشم کار کنم. یکشنبه می‌فهمم. شاید یکشنبه بتونیم با هم دوچرخه‌سواری کنیم. ساعت دو می‌تونم. موفق باشی، نور
    note: ببینید نور چطور قطعیت (*ik kan om twee uur*) و احتمال (*misschien*، *het kan zijn dat*) رو با هم می‌آره.
    glosses:
      misschien: شاید
      weet: دانستن
      samen: با هم
      uur: ساعت
  nl.a2.unit88.lesson06.teach.vraag:
    title: لوته می‌پرسد
    gloss: 'لوته: سلام عمر، شنبه می‌تونی بیای؟'
  nl.a2.unit88.lesson06.teach.antw:
    title: عمر نامطمئنه
    gloss: 'عمر: هنوز نمی‌دونم. ممکنه مجبور باشم کار کنم.'
  nl.a2.unit88.lesson06.teach.terugbellen:
    title: لوته درخواست تماس مجدد می‌کنه
    gloss: 'لوته: پس می‌تونی بهم زنگ بزنی؟'
  nl.a2.unit88.lesson06.teach.ja_dat_kan:
    title: عمر موافقت می‌کند
    gloss: 'عمر: آره، می‌شه. فردا می‌تونم بهت زنگ بزنم.'
  nl.a2.unit88.lesson06.teach.ophalen:
    title: لوته دربارهٔ یکشنبه می‌پرسه
    gloss: 'لوته: عالیه! یکشنبه می‌تونی بیای دنبالم؟'
  nl.a2.unit88.lesson06.teach.zondag:
    title: عمر ساعت پیشنهاد می‌ده
    gloss: 'عمر: یکشنبه می‌تونم. ساعت دو می‌تونم بیام دنبالت.'
exercises:
  nl.a2.unit88.lesson01.exercise01.choose_cook:
    instruction: جملهٔ هلندی درست را انتخاب کنید.
    correct_option: Omar kan goed koken.
    distractors:
    - Omar kunnen goed koken.
    - Omar kan koken goed.
    - Omar kunt goed koken.
    accepted_answers:
    - value: Omar kan goed koken.
      status: correct
    feedback: '*Omar* با *kan* میاد و مصدر *koken* آخر جمله است.'
    prompt_blocks:
    - Omar خوب می‌تونه آشپزی کنه.
  nl.a2.unit88.lesson01.exercise02.choose_swim:
    instruction: جملهٔ هلندی درست را انتخاب کنید.
    correct_option: Ik kan niet zwemmen.
    distractors:
    - Ik kan zwemmen niet.
    - Ik kunt niet zwemmen.
    - Ik kunnen niet zwemmen.
    accepted_answers:
    - value: Ik kan niet zwemmen.
      status: correct
    feedback: '*Niet* قبل از مصدر میاد: *Ik kan niet zwemmen.*'
    prompt_blocks:
    - من نمی‌تونم شنا کنم.
  nl.a2.unit88.lesson01.exercise03.match_skills:
    instruction: هر مصدر هلندی رو به معنی فارسی‌اش وصل کنید.
    accepted_answers:
    - value:
      - left: koken
        right: آشپزی کردن
      - left: zwemmen
        right: شنا کردن
      - left: fietsen
        right: دوچرخه‌سواری کردن
      - left: tekenen
        right: نقاشی کردن
      - left: zingen
        right: آواز خواندن
      - left: gitaar spelen
        right: گیتار زدن
      status: correct
    feedback: این‌ها مهارت‌هایی هستن که در این درس استفاده شدن.
    pairs:
    - left: koken
      right: آشپزی کردن
    - left: zwemmen
      right: شنا کردن
    - left: fietsen
      right: دوچرخه‌سواری کردن
    - left: tekenen
      right: نقاشی کردن
    - left: zingen
      right: آواز خواندن
    - left: gitaar spelen
      right: گیتار زدن
  nl.a2.unit88.lesson01.exercise04.order_sing:
    instruction: کلمه‌ها رو مرتب کنید تا بگید «نور خوب می‌تونه آواز بخونه.»
    correct_option: Noor kan goed zingen
    accepted_answers:
    - value: Noor kan goed zingen
      status: correct
    feedback: '*Noor kan goed zingen*: مصدر *zingen* آخر جمله است.'
  nl.a2.unit88.lesson01.exercise05.complete_kunt:
    instruction: جای خالی رو با شکل زمان حال فعل kunnen برای jij پر کنید.
    correct_option: kunt
    accepted_answers:
    - value: kunt
      status: correct
    - value: kan
      status: correct
    feedback: '*Jij kunt* شکل استاندارده؛ *jij kan* در گفتار رایجه.'
  nl.a2.unit88.lesson01.exercise06.translate_cycle:
    instruction: به هلندی ترجمه کنید.
    accepted_answers:
    - value: Ik kan fietsen.
      status: correct
    - value: Ik kan fietsen
      status: correct
    feedback: '*Ik kan fietsen* = می‌تونم دوچرخه‌سواری کنم.'
    prompt_blocks:
    - من می‌تونم دوچرخه‌سواری کنم.
  nl.a2.unit88.lesson01.exercise07.write_draw:
    instruction: جملهٔ هلندی خواسته‌شده را بنویسید.
    correct_option: Lotte kan goed tekenen.
    accepted_answers:
    - value: Lotte kan goed tekenen.
      status: correct
    - value: Lotte kan goed tekenen
      status: correct
    feedback: '*Lotte kan goed tekenen* = لوته خوب می‌تونه نقاشی بکشه.'
    prompt_blocks:
    - 'به هلندی بنویسید: Lotte خوب می‌تونه نقاشی بکشه.'
  nl.a2.unit88.lesson02.exercise01.choose_guitar:
    instruction: پرسش هلندی درست را انتخاب کنید.
    correct_option: Kun je gitaar spelen?
    distractors:
    - Kunt je gitaar spelen?
    - Kun je spelen gitaar?
    - Je kun gitaar spelen?
    accepted_answers:
    - value: Kun je gitaar spelen?
      status: correct
    feedback: فعل اول جمله میاد و در شکل وارونه *kun je* است.
    prompt_blocks:
    - می‌تونی گیتار بزنی؟
  nl.a2.unit88.lesson02.exercise02.choose_no:
    instruction: پاسخ هلندی درست را انتخاب کنید.
    correct_option: Nee, dat kan ik niet.
    distractors:
    - Nee, dat ik kan niet.
    - Nee, dat niet kan ik.
    - Nee, dat kunnen ik niet.
    accepted_answers:
