teaching:
  nl.a1.unit11.lesson01.teach.samen:
    title: با هم
    gloss: با هم
    note: '*Samen* روشن می‌کند که چند نفر کار را با هم انجام می‌دهند.'
    example_gloss: با هم قهوه بخوریم؟
  nl.a1.unit11.lesson01.teach.koffie_drinken:
    title: قهوه خوردن
    gloss: قهوه خوردن
    note: 'در هلندی فعل drinken (نوشیدن) به کار می‌رود: *koffie drinken*؛ ولی در فارسی معمولاً می‌گوییم «قهوه خوردن».'
  nl.a1.unit11.lesson01.teach.naar_de_film:
    title: رفتن به سینما
    gloss: رفتن به سینما
    note: '*Naar de film gaan* راه رایجی برای گفتن رفتن به سینماست، بدون اینکه واژهٔ تازه‌ای برای مکان لازم باشد.'
  nl.a1.unit11.lesson01.teach.zullen_we:
    title: قهوه بخوریم؟
    gloss: قهوه بخوریم؟
    note: '*Zullen we ...?* الگوی معمول هلندی برای پیشنهاد یک کار مشترک است.'
  nl.a1.unit11.lesson01.teach.zullen_note:
    title: کاربرد Zullen we
    gloss: Zullen we + فعالیت؟ راه معمول پیشنهاد انجام کاری با هم است.
    note: 'فعالیت را بعد از *we* بگذارید و فعل را آخر جمله: *Zullen we koffie drinken?*'
  nl.a1.unit11.lesson01.teach.zin_om:
    title: حال داری بریم سینما؟
    gloss: حال داری بریم سینما؟
    note: '*Heb je zin om ...?* به شکل غیررسمی می‌پرسد طرف مقابل میل به انجام کاری دارد یا نه. اینجا قبل از *gaan* از *te* استفاده کنید.'
  nl.a1.unit11.lesson02.teach.ja_leuk:
    title: آره، عالیه!
    gloss: آره، عالیه!
    note: '*Ja, leuk!* پذیرفتنی کوتاه و با ذوق و شوق است.'
  nl.a1.unit11.lesson02.teach.goed_idee:
    title: فکر خوبیه
    gloss: فکر خوبیه!
    note: '*Goed idee!* پیشنهاد را با نظر مثبت می‌پذیرد.'
  nl.a1.unit11.lesson02.teach.goed_plan:
    title: برنامهٔ خوبیه
    gloss: برنامهٔ خوبیه.
    note: این پاسخ مثبتِ کمی کامل‌تری است.
  nl.a1.unit11.lesson02.teach.sorry_reason:
    title: رد کردن با ذکر دلیل
    gloss: متأسفم، نمی‌تونم، چون کار دارم.
    note: '*Sorry* رد کردن را نرم‌تر می‌کند و *want* دلیل کوتاه را می‌آورد.'
  nl.a1.unit11.lesson02.teach.no_time:
    title: وقت ندارم
    gloss: وقت ندارم.
    note: '*Ik heb geen tijd* دلیلی مستقیم اما معمولی برای رد کردن است.'
  nl.a1.unit11.lesson02.teach.polite_decline:
    title: رد کردن مؤدبانه
    gloss: Sorry + نمی‌توانم + یک دلیل کوتاه، رد کردن را دوستانه می‌کند.
    note: گفتن دلیل در گفت‌وگو الزامی نیست، ولی جمله را کامل‌تر و مؤدبانه‌تر می‌کند.
