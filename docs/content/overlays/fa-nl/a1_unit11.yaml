    note: بعد از *Zullen we*، فعل *afspreken* یک کلمه نوشته می‌شود. در *We spreken vrijdag af* به *spreken* و *af* جدا می‌شود.
    example_gloss: جمعه ساعت ۲:۳۰ همدیگر را ببینیم؟
  nl.a1.unit11.lesson03.teach.friday_half_three:
