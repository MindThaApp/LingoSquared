    note: '*Bericht* پیام کوتاه نوشتاری یا دیجیتالی است، *uitnodiging* از کسی می‌خواهد به یک فعالیت یا مراسم بپیوندد، و *taalcafé* (یک کلمهٔ مرکب، با همان نشانهٔ روی حرف آخر) محل دیدار گروه است.'
