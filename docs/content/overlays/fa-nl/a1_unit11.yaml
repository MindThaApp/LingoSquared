  nl.a1.unit11.lesson03.teach.half_three_review:
    title: half drie یعنی 2:30
    gloss: half drie = 2:30؛ om half drie ساعت قرار را می‌گوید.
    note: 'هلندی به سمت ساعت بعدی می‌شمارد: *half drie* یعنی نیمه‌راهِ رسیدن به سه، پس 2:30 است. در فارسی برعکس می‌گوییم «دو و نیم».'
