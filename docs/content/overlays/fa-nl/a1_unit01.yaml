teaching:
  nl.a1.unit01.lesson01.teach.hallo_hoi:
    title: سلام و سلام صمیمی
    gloss: سلام
    note: '*Hallo* خنثی است و هم در موقعیت‌های دوستانه و هم رسمی به کار می‌رود. *Hoi* رایج و غیررسمی است.'
    example_gloss:
    - سلام، شما اینجا تازه‌وارد هستید؟
    - سلام، من نور هستم.
  nl.a1.unit01.lesson01.teach.jij_je_u:
    title: '«شما/تو»: شکل‌های غیررسمی و رسمی'
    gloss: تو (غیررسمی، تأکیدی) / تو (غیررسمی، بدون تأکید) / شما (رسمی)
    note: '*Jij* ضمیر مفرد غیررسمی است و وقتی تأکید یا تقابل مطرح باشد به کار می‌رود. *Je* شکل بدون تأکیدِ معمول در گفتار روزمره است. *U* فاصله و احترام را نشان می‌دهد. در هلند استفاده از آن با بعضی غریبه‌های مسن و در روابط کاملاً رسمی طبیعی است، ولی jij/je هم بین بزرگسالان در خیلی از مغازه‌ها و محل‌های کار رایج است.'
    example_gloss:
    - تو اینجا تازه‌وارد هستی؟ (غیررسمی، با تأکید)
    - تو اینجا تازه‌وارد هستی. (غیررسمی، بدون تأکید)
    - شما اینجا تازه‌وارد هستید؟ (رسمی)
  nl.a1.unit01.lesson01.teach.informal_new:
    title: پرسیدن از هم‌سن‌وسال که تازه‌وارد است یا نه
    gloss: تو اینجا تازه‌وارد هستی؟
    note: 'در جملهٔ پرسشی *jij bent* به *ben jij* تبدیل می‌شود: وقتی *jij* بعد از فعل بیاید، -t حذف می‌شود.'
  nl.a1.unit01.lesson01.teach.formal_new:
    title: پرسیدن رسمی که کسی تازه‌وارد است یا نه
    gloss: شما اینجا تازه‌وارد هستید؟
    note: با *u* باید *bent u* گفت. -t می‌ماند.
  nl.a1.unit01.lesson01.teach.register_rule:
    title: انتخاب شکل «شما/تو»
    gloss: 'jij/je: غیررسمی · u: رسمی یا مؤدبانه'
    note: '*jij/je* را با دوستان، هم‌سن‌وسال‌ها، بچه‌ها و در خیلی از موقعیت‌های راحتِ امروزی به کار ببرید. *u* را وقتی به کار ببرید که رابطه احترام یا فاصله می‌خواهد؛ سلیقه‌ها فرق می‌کند، پس از طرف مقابل پیروی کنید.'
  nl.a1.unit01.lesson02.teach.goedemorgen_tot_goedenavond:
    title: سلام‌های صبح، بعدازظهر و عصر
    gloss: صبح بخیر / ظهر بخیر، بعدازظهر بخیر / عصر بخیر
    note: '*Goedemorgen* صبح‌ها و معمولاً تا حدود ظهر گفته می‌شود. *Goedemiddag* از حدود ظهر تا آخر بعدازظهر به کار می‌رود. *Goedenavond* سلام عصر و شب است.'
    example_gloss:
    - صبح بخیر! حال شما چطوره؟
    - بعدازظهر بخیر، حال شما چطوره؟ (رسمی)
    - عصر بخیر! شما اینجا تازه‌وارد هستید؟
  nl.a1.unit01.lesson02.teach.hoe_gaat_het:
    title: اوضاع چطوره؟
    gloss: حال شما چطوره؟
    note: '*Hoe gaat het?* یک روش رایج و خنثی برای حال‌پرسی است.'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_je:
    title: حالت چطوره؟ غیررسمی
    gloss: حال شما چطوره؟
    note: '*Met je* مخاطب را مشخص می‌کند و غیررسمی است.'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_u:
    title: حال شما چطوره؟ رسمی
    gloss: حال شما چطوره؟
    note: وقتی موقعیت خطاب رسمی می‌خواهد، *met u* را به کار ببرید.
  nl.a1.unit01.lesson02.teach.goed_dank_je:
    title: 'خوبم، مرسی: غیررسمی'
    gloss: خوبم، ممنون.
    note: '*Dank je* با خطاب غیررسمی جور است.'
  nl.a1.unit01.lesson02.teach.goed_dank_u:
    title: 'خوبم، متشکرم: رسمی'
    gloss: خوبم، ممنون.
    note: '*Dank u* با خطاب رسمی جور است.'
  nl.a1.unit01.lesson02.teach.prima:
    title: عالی
    gloss: عالی / خوب
    note: '*Prima* یک جواب کوتاه و مثبت است.'
    example_gloss: عالی، متشکرم.
  nl.a1.unit01.lesson02.teach.niet_slecht:
    title: بد نیست
    gloss: بد نیست
    note: '*Niet slecht* معمولاً جواب نسبتاً مثبتی است.'
  nl.a1.unit01.lesson02.teach.en_met_jou:
    title: و تو؟ غیررسمی
    gloss: شما چطور؟
    note: '*Jou* شکل تأکیدیِ غیررسمی بعد از *met* است.'
  nl.a1.unit01.lesson02.teach.en_met_u:
    title: و شما؟ رسمی
    gloss: شما چطور؟
    note: '*U* سؤال متقابل را هم رسمی نگه می‌دارد.'
  nl.a1.unit01.lesson03.teach.hoe_heet_je:
    title: پرسیدن اسم به شکل صمیمی
    gloss: اسم شما چیه؟
    note: '*Hoe heet je?* سؤال معمولِ غیررسمی برای پرسیدن اسم است.'
  nl.a1.unit01.lesson03.teach.hoe_heet_u:
    title: پرسیدن اسم به شکل رسمی
    gloss: اسم شما چیه؟
    note: '*Hoe heet u?* مؤدبانه است؛ *Wat is uw naam?* گزینهٔ رسمیِ دیگری است که کمی اداری به نظر می‌رسد و اینجا تمرین نمی‌شود.'
  nl.a1.unit01.lesson03.teach.ik_heet_noor:
    title: گفتن اسم خودتان
    gloss: اسم من نور است.
    note: '*Ik heet ...* روشی مستقیم و استاندارد برای گفتن اسم است.'
  nl.a1.unit01.lesson03.teach.ik_ben_noor:
    title: طبیعی خودتان را معرفی کنید
    gloss: من نور هستم.
    note: '*Ik ben ...* مخصوصاً در معرفی‌های گفتاری رایج است.'
  nl.a1.unit01.lesson03.teach.mijn_naam:
    title: اسم من ... است
    gloss: اسم من نور است.
    note: '*Mijn naam is ...* درست است ولی کمی صریح‌تر از *Ik ben ...* یا *Ik heet ...* است.'
  nl.a1.unit01.lesson03.teach.leuk_ontmoeten:
    title: از آشنایی خوشحالم
    gloss: از آشنایی‌تون خوشبختم.
    note: این جمله در اولین دیدار صمیمی و طبیعی است.
  nl.a1.unit01.lesson03.teach.aangenaam:
    title: خوشبختم
    gloss: خوشبختم
    note: '*Aangenaam* قالبی است و از *Leuk je te ontmoeten* رسمی‌تر است.'
    example_gloss: خوشبختم! من نور هستم.
  nl.a1.unit01.lesson04.teach.where_from_informal:
    title: پرسیدن اینکه کسی اهل کجاست
    gloss: شما اهل کجایید؟
    note: '*Kom je* شکل پرسشیِ غیررسمی است.'
  nl.a1.unit01.lesson04.teach.where_from_formal:
    title: پرسیدن رسمی اینکه کسی اهل کجاست
    gloss: شما اهل کجایید؟
    note: 'با *u* فعل *komt* می‌شود: *Waar komt u vandaan?*'
  nl.a1.unit01.lesson04.teach.from_netherlands:
    title: اهل هلند
    gloss: من اهل هلند هستم.
    note: قبل از کشور مبدأ از *uit* استفاده کنید.
  nl.a1.unit01.lesson04.teach.from_belgium:
    title: اهل بلژیک
    gloss: من اهل بلژیک هستم.
    note: در *België* روی حرف e دوم نشانهٔ تره قرار دارد.
  nl.a1.unit01.lesson04.teach.from_germany:
    title: اهل آلمان
    gloss: من اهل آلمان هستم.
    note: '*Duitsland* اسم کشور است؛ *Duits* اسم زبان است.'
  nl.a1.unit01.lesson04.teach.dutch_nationality:
    title: ملیت هلندی
    gloss: من هلندی هستم.
    note: '*Nederlands* هم می‌تواند ملیت را بیان کند و هم زبان هلندی را.'
  nl.a1.unit01.lesson04.teach.belgian_nationality:
    title: ملیت بلژیکی
    gloss: من بلژیکی هستم.
    note: '*Belgisch* اینجا ملیت بلژیکی را بیان می‌کند.'
  nl.a1.unit01.lesson04.teach.speak_dutch:
    title: هلندی صحبت کردن
    gloss: من هلندی صحبت می‌کنم.
    note: در هلندی اسم زبان‌ها با حرف بزرگ نوشته می‌شود؛ در فارسی حرف بزرگ نداریم.
  nl.a1.unit01.lesson04.teach.speak_english:
    title: انگلیسی صحبت کردن
    gloss: من انگلیسی صحبت می‌کنم.
    note: '*Engels* در هلندی یعنی زبان انگلیسی.'
  nl.a1.unit01.lesson04.teach.speak_german:
    title: آلمانی صحبت کردن
    gloss: من آلمانی صحبت می‌کنم.
    note: '*Duits* در هلندی یعنی زبان آلمانی.'
  nl.a1.unit01.lesson05.teach.taalcafe_bibliotheek:
    title: کافهٔ زبان و کتابخانه
    gloss: کافهٔ زبان / کتابخانه
    note: '*taalcafé* دورهمی بی‌استرسی برای تمرین هلندی با بقیه است. کتابخانه‌های عمومی هلند اغلب فعالیت‌های محلی برگزار می‌کنند، از جمله کافهٔ زبان.'
    example_gloss:
    - من برای کافهٔ زبان اینجا هستم.
    - من در کتابخانه هلندی یاد می‌گیرم.
  nl.a1.unit01.lesson05.teach.location:
    title: محل دیدار
    gloss: کافهٔ زبان در کتابخانه است.
    note: این جمله فضای صحنه را مشخص می‌کند.
  nl.a1.unit01.lesson05.teach.here_for:
    title: پرسیدن دربارهٔ فعالیت مشترک
    gloss: تو برای کافهٔ زبان اینجایی؟
    note: وقتی دو نفر برای یک فعالیت می‌آیند، این شروع صحبتِ غیررسمیِ طبیعی است.
  nl.a1.unit01.lesson05.teach.yes_here_for:
    title: تأیید کردن فعالیت
    gloss: بله، من برای کافهٔ زبان اینجا هستم.
    note: جواب، فعالیت را به‌روشنی تکرار می‌کند.
  nl.a1.unit01.lesson05.teach.learning:
    title: گفتن اینکه چه چیزی یاد می‌گیرید
    gloss: من دارم هلندی یاد می‌گیرم.
    note: '*Leer* صرف اول‌شخصِ فعل *leren* به معنی یاد گرفتن است.'
  nl.a1.unit01.lesson05.teach.me_too:
    title: من هم
    gloss: من هم.
    note: '*Ik ook* روشی کوتاه و طبیعی برای گفتن یک اشتراک است.'
  nl.a1.unit01.lesson05.teach.first_time:
    title: پرسیدن اینکه اولین بارش است یا نه
    gloss: اولین باری است که می‌آیی؟
    note: این یک گپ دوستانه در فعالیتی است که مرتب برگزار می‌شود.
  nl.a1.unit01.lesson05.teach.first_time_answer:
    title: گفتن اینکه اولین بارتان است
    gloss: بله، این اولین باره که میام.
    note: '*Mijn* یعنی «مالِ من» و برای نشان دادن تعلق به کار می‌رود، مثل «اسمِ من».'
  nl.a1.unit01.lesson06.teach.lotte_opening:
    title: لوته گفتگو را شروع می‌کند
    gloss: 'لوته: سلام، من لوته‌ام. اسمت چیه؟'
    note: لوته در این جمع صمیمی از *je* ی غیررسمی استفاده می‌کند.
  nl.a1.unit01.lesson06.teach.omar_name:
    title: عمر اسمش را می‌گوید
    gloss: 'عمر: من عمرم. از آشنایی باهات خوشحالم.'
    note: او به سؤال اسم جواب می‌دهد و از آشنایی ابراز خوشحالی می‌کند.
  nl.a1.unit01.lesson06.teach.lotte_origin_question:
    title: لوته درباره‌ی محل تولد و کشورش می‌پرسد
    gloss: 'لوته: من هم همین‌طور! اهل کجایی؟'
    note: '*Jou ook!* جواب کوتاه و طبیعی برای *Leuk je te ontmoeten* است.'
  nl.a1.unit01.lesson06.teach.omar_origin:
    title: عمر می‌گوید اهل کجاست
    gloss: 'عمر: من اهل مصرم. تو چی؟'
    note: '*En jij?* همان سؤال را به‌صورت غیررسمی برمی‌گرداند.'
  nl.a1.unit01.lesson06.teach.lotte_context:
    title: لوته گپ را ادامه می‌دهد
    gloss: 'لوته: من اهل هلندم. اولین باره که به کافه‌ی زبان میای؟'
    note: '*Bij het taalcafé* یعنی «در کافه‌ی زبان» به‌عنوان یک فعالیت.'
  nl.a1.unit01.lesson06.teach.omar_language:
    title: عمر جواب می‌دهد و می‌گوید چه چیزی یاد می‌گیرد
    gloss: 'عمر: بله، این اولین باره که میام. دارم هلندی یاد می‌گیرم.'
    note: او اول به سؤال لوته جواب می‌دهد و بعد یک اطلاعات ساده‌ی دیگر درباره‌ی خودش اضافه می‌کند.
  nl.a1.unit01.lesson06.teach.tot_ziens:
    title: خداحافظی
    gloss: خداحافظ!
    note: '*Tot ziens* یک خداحافظی معمولی و خنثی است.'
  nl.a1.unit01.lesson06.teach.closing:
    title: یک پایان طبیعی
    gloss: 'لوته: عالیه! هفته‌ی بعد می‌بینمت. عمر: هفته‌ی بعد می‌بینمت!'
    note: وقتی هر دو نفر انتظار دارند دوباره بیایند، تکرار *Tot volgende week* طبیعی است.
exercises:
  nl.a1.unit01.lesson01.exercise01.choose_informal:
    instruction: کدام گزینه شامل دو شکل غیررسمیِ مفرد برای «تو» است؟
    correct_option: jij / je
    distractors:
    - u
    - jij / u
    - je / u
    accepted_answers:
    - value: jij / je
      status: correct
    feedback: Jij و je غیررسمی و مفردند؛ u رسمی است.
  nl.a1.unit01.lesson01.exercise02.choose_formal:
    instruction: ضمیر رسمی را برای کامل کردن پرسش انتخاب کنید.
    correct_option: u
    distractors:
    - jij
    - je
    - ik
    accepted_answers:
    - value: u
      status: correct
    feedback: Bent u nieuw hier? خطاب رسمی است.
  nl.a1.unit01.lesson01.exercise03.listen_formal:
    instruction: گوش کنید و موقعیتی را انتخاب کنید که با این پرسش جور است.
    correct_option: از کسی که با او رسمی صحبت می‌شود پرسیده می‌شود که اینجا تازه‌وارد است یا نه.
    distractors:
    - از یک هم‌سن‌وسال پرسیده می‌شود که اینجا تازه‌وارد است یا نه.
    - از کسی که با او رسمی صحبت می‌شود پرسیده می‌شود که اینجا زندگی می‌کند یا نه.
    - از کسی که با او رسمی صحبت می‌شود پرسیده می‌شود که اهل اینجا هست یا نه.
    accepted_answers:
    - value: از کسی که با او رسمی صحبت می‌شود پرسیده می‌شود که اینجا تازه‌وارد است یا نه.
      status: correct
    feedback: Bent u nieuw hier? برای خطاب رسمی از u و bent استفاده می‌کند.
  nl.a1.unit01.lesson01.exercise04.match_register:
    instruction: هر شکل هلندی را با سطح رسمی بودنش جفت کنید.
    accepted_answers:
    - value:
      - left: jij / je
        right: informeel
      - left: u
        right: formeel of beleefd
      status: correct
    feedback: Jij/je غیررسمی است؛ u رسمی یا مؤدبانه است.
    pairs:
    - left: jij / je
      right: informeel
    - left: u
      right: formeel of beleefd
  nl.a1.unit01.lesson01.exercise05.order_formal:
    instruction: کلمه‌ها را مرتب کنید تا پرسش رسمیِ «اینجا تازه‌وارد هستید؟» ساخته شود.
    accepted_answers:
    - value:
      - Bent
      - u
      - nieuw
      - hier
      status: correct
    feedback: 'پرسش رسمی این است: Bent u nieuw hier?'
  nl.a1.unit01.lesson01.exercise06.listen_order_informal:
    instruction: گوش کنید و پرسش غیررسمی را مرتب کنید.
    accepted_answers:
    - value:
      - Ben
      - jij
      - nieuw
