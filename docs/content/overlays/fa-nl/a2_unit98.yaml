course:
  title: هلندی A2
  description: هلندی سطح A2 با تمرکز بر دستور زبان، برای معرفی افراد و اشیا با جمله‌های موصولی.
  learning_goal: معرفی یک شخص یا یک چیز با die یا dat و جمله‌ی موصولی که فعل در آخر آن می‌آید.
units:
  nl.a2.unit98.degene_die_en_dat:
    title: مردی که، کتابی که
    description: معرفی افراد در محل کار و چیزهای گم‌شده یا خریده‌شده با جمله‌های موصولی با die و dat.
lessons:
  nl.a2.unit98.lesson01.mensen_en_spullen:
    title: آدم‌ها و چیزها
  nl.a2.unit98.lesson02.die_of_dat:
    title: die یا dat؟
  nl.a2.unit98.lesson03.wie_doet_wat:
    title: چه کسی چه کاری می‌کند؟
  nl.a2.unit98.lesson04.in_de_winkel:
    title: جست‌وجو در مغازه
  nl.a2.unit98.lesson05.noors_bericht:
    title: پیام Noor
  nl.a2.unit98.lesson06.lotte_en_omar:
    title: Lotte و Omar در مغازه
teaching:
  nl.a2.unit98.lesson01.teach.mensen:
    title: آدم‌ها در محل کار
    gloss: مرد / زن / همکار / مشتری / رئیس / آشپز
    note: همه‌ی این کلمه‌ها با de می‌آیند.
    example_gloss:
    - مشتری یک مرد است.
    - همکار یک زن است.
    - آشپز و رئیس اینجا کار می‌کنند.
  nl.a2.unit98.lesson01.teach.winkel_werk:
    title: مغازه و فعل‌های کار
    gloss: مغازه / کار کردن / کمک کردن / دنبال چیزی گشتن / خریدن
    note: '*Kocht* شکل گذشته‌ی ساده‌ی *kopen* است.'
    example_gloss:
    - من در مغازه کار می‌کنم.
    - همکار به مشتری کمک می‌کند.
    - دنبال یک کیف می‌گردم.
    - من یک کتاب خریدم.
  nl.a2.unit98.lesson01.teach.spullen:
    title: چیزهای مغازه، چیزهایی که گم می‌کنید
    gloss: کلید / کیف / کیف پول / گوشی / کت / عینک / ساعت / کتاب / کفش / پلیور / هدیه
    note: 'دقت کنید کدام کلمه‌ها با *de* و کدام با *het* می‌آیند: *het horloge, het boek, het cadeau*. *De schoenen* جمع است.'
    example_gloss:
    - کلید توی کیف است.
    - ساعت نو است.
    - هدیه یک کتاب است.
  nl.a2.unit98.lesson01.teach.kwijt:
    title: گم‌شده و پیداشده
    gloss: گم‌شده / گم کردن / پیدا کردن
    note: '*Verloor* و *vond* شکل گذشته‌ی ساده‌ی *verliezen* و *vinden* هستند.'
    example_gloss:
    - کلیدم را گم کرده‌ام.
    - عینکم را گم کردم.
    - مشتری گوشی من را پیدا کرد.
  nl.a2.unit98.lesson01.teach.zinnen:
    title: جمله‌های کوتاه
    gloss: کیفم را گم کرده‌ام. همکار به من کمک می‌کند. مشتری گوشی من را پیدا کرد.
  nl.a2.unit98.lesson01.teach.dit_is:
    title: این است، آن است
    gloss: این کتاب است. آن مرد است.
  nl.a2.unit98.lesson01.teach.gn_patroon:
    title: Die و dat به یک اسم قبل از خودشان برمی‌گردند
    gloss: مردی که در مغازه کار می‌کند / کتابی که خریدم
    note: '*Die* و *dat* یک جمله‌ی کوتاه اضافی را به اسمِ قبل از خودشان وصل می‌کنند. فعل معمولاً به آخر همان جمله می‌رود: *die in de winkel werkt*، *dat ik kocht*.'
  nl.a2.unit98.lesson02.teach.meer_spullen:
    title: چیزهای بیشتر و چند جمع
    gloss: دوچرخه / چتر / بلیط؛ کلیدها / کیف‌ها / کتاب‌ها / ساعت‌ها / پلیورها
    note: 'همه‌ی جمع‌ها با *de* می‌آیند، حتی جمعِ کلمه‌هایی که با het هستند: *het boek* می‌شود *de boeken*.'
    example_gloss:
    - چتر آبی است.
    - بلیط کوچک است.
  nl.a2.unit98.lesson02.teach.adjectieven:
    title: صفت‌ها
    gloss: نو / زیبا / کهنه / آبی / سیاه
    note: 'بعد از *de* یا *het* صفت یک *-e* می‌گیرد: *de nieuwe tas*، *het mooie boek*.'
    example_gloss:
    - کیف نو سیاه است.
    - کتاب زیبا قدیمی است.
  nl.a2.unit98.lesson02.teach.gn_de_het:
    title: die برای کلمه‌های de و جمع‌ها، dat برای کلمه‌های het
    gloss: کیفی که / کفش‌هایی که / ساعتی که / هدیه‌ای که
    note: 'بعد از کلمه‌ی de و بعد از هر جمع از *die* استفاده کنید. *dat* فقط بعد از کلمه‌ی het در مفرد می‌آید: *het horloge dat*، اما *de horloges die*.'
  nl.a2.unit98.lesson02.teach.zinnen2:
    title: دو جمله
    gloss: دنبال کلیدهایی می‌گردم که گم کردم. بلیطی که پیدا کردم کهنه است.
    note: جمله‌ی موصولی می‌تواند درست بعد از نهاد هم بیاید. در این حالت کل این گروه نهاد است، پس فعل اصلی بعد از آن می‌آید. گذاشتن ویرگول بعد از جمله‌ی موصولی رایج است، ولی اجباری نیست.
  nl.a2.unit98.lesson03.teach.werkwoorden:
    title: فعل‌های بیشتر
    gloss: زنگ زدن / دیدن / شناختن
    note: '*Belde* و *zag* شکل گذشته‌ی ساده‌ی *bellen* و *zien* هستند.'
    example_gloss:
    - به رئیس زنگ می‌زنم.
    - همکار را می‌بینم.
    - مشتری را می‌شناسم.
  nl.a2.unit98.lesson03.teach.gn_onderwerp_voorwerp:
    title: چه کسی کار را انجام می‌دهد؟
    gloss: زنی که مرا می‌بیند / زنی که من او را می‌بینم
    note: در *de vrouw die mij ziet* زن کسی است که می‌بیند. در *de vrouw die ik zie* من کسی هستم که می‌بیند. بعد از *die* یا *dat* یا بلافاصله یک فعل می‌آید (*die werkt*) یا یک نهاد تازه (*die ik zie*).
  nl.a2.unit98.lesson03.teach.gn_werkwoord_achteraan:
    title: فعل به آخر جمله می‌رود
    gloss: مرد در مغازه کار می‌کند. / مردی که در مغازه کار می‌کند
    note: در جمله‌ی معمولی فعل در جای دوم می‌آید. در جمله‌ی موصولی فعل معمولاً به آخر می‌رود، بعد از مفعول و هر عبارت کوتاهی مثل *in de winkel*.
  nl.a2.unit98.lesson03.teach.zinnen3:
    title: دو عبارت متضاد
    gloss: مشتری‌ای که به من زنگ زد / مشتری‌ای که من به او زنگ زدم
  nl.a2.unit98.lesson04.teach.zoeken:
    title: اشیای گم‌شده
    gloss: کیف پولم را گم کرده‌ام. دنبال کیفی می‌گردم که گم کردم. این‌ها کلیدهایی هستند که گم کردم.
  nl.a2.unit98.lesson04.teach.hier:
    title: کمک در مغازه
    gloss: مردی که اینجا کار می‌کند به من کمک کرد. او مشتری‌ای است که گوشی من را پیدا کرد.
  nl.a2.unit98.lesson04.teach.gn_modaal:
    title: دو فعل در آخر جمله
    gloss: کتی که می‌خواهم بخرم / کیفی که می‌خواهم داشته باشم
    note: 'وقتی فعل کمکی و مصدر با هم هستند، هر دو به آخر جمله می‌روند. اول فعل کمکی می‌آید و بعد مصدر: *die ik wil kopen*.'
  nl.a2.unit98.lesson04.teach.gn_degene:
    title: 'Degene die: کسی که'
    gloss: دنبال کسی می‌گردم که کیف مرا پیدا کرد.
    note: '*Degene die* یعنی «کسی که». وقتی دقیقاً نمی‌دانید آن شخص کیست، از آن استفاده می‌کنید. در این درس بعد از آن دوباره *die* می‌آید.'
  nl.a2.unit98.lesson05.teach.woorden:
    title: کلمه‌های کوچک کاربردی
    gloss: دیروز / آنجا / دوباره / پس / حالا / هم
    example_gloss:
    - کیف را دیروز خریدم.
    - حالا کلید را دوباره دارم.
  nl.a2.unit98.lesson05.teach.reading:
    title: Noor به Lotte می‌نویسد
    gloss: سلام Lotte، کیفم را گم کرده‌ام. همان کیفی است که دیروز خریدم. توی مغازه دنبالش گشتم. زنی که آنجا کار می‌کند به من کمک کرد. مشتری‌ای که کیف را دیده بود به رئیس زنگ زد. حالا دوباره کیفم را دارم. کتابی که توی کیف بود هم برگشته است. با آرزوی بهترین‌ها، Noor
    note: به هر جمله‌ی موصولی و اسمی که به آن برمی‌گردد دقت کنید.
    glosses:
      zocht: جست‌وجو کرد
      hielp: کمک کرد
      zat: بود (در)
      zag: دید
      Groetjes: با آرزوی بهترین‌ها
  nl.a2.unit98.lesson05.teach.gn_zin_in_zin:
    title: جملهٔ موصولی داخل جمله
    gloss: زنی که اون‌جا کار می‌کنه، به من کمک کرد.
    note: وقتی جملهٔ موصولی بعد از نهاد میاد، فعل اصلی بعد از اون می‌آد. گذاشتن ویرگول بعد از جملهٔ موصولی رایجه، ولی اجباری نیست. جملهٔ موصولی بخشی از نهاده.
  nl.a2.unit98.lesson06.teach.lotte_kwijt:
    title: حرف لوته (جملهٔ ۱)
    gloss: 'لوته: سلام عمر، ژاکتم رو گم کردم.'
  nl.a2.unit98.lesson06.teach.omar_gisteren:
    title: حرف عمر (جملهٔ ۲)
    gloss: 'عمر: وای نه! همون ژاکتیه که دیروز خریدی؟'
  nl.a2.unit98.lesson06.teach.lotte_blauw:
    title: حرف لوته (جملهٔ ۳)
    gloss: 'لوته: نه، ژاکت آبی‌ایه که هفتهٔ پیش خریدم.'
  nl.a2.unit98.lesson06.teach.omar_man:
    title: حرف عمر (جملهٔ ۴)
    gloss: 'عمر: مردی که توی مغازه کار می‌کنه، یه ژاکت آبی پیدا کرد.'
  nl.a2.unit98.lesson06.teach.lotte_dank:
    title: حرف لوته (جملهٔ ۵)
    gloss: 'لوته: واقعاً؟ ممنون عمر! پس می‌رم مغازه.'
  nl.a2.unit98.lesson06.teach.omar_succes:
    title: حرف عمر (جملهٔ ۶)
    gloss: 'عمر: موفق باشی! سراغ مردی رو بگیر که ژاکت رو پیدا کرد.'
exercises:
  nl.a2.unit98.lesson01.exercise01.choose_man_winkel:
    instruction: عبارت هلندی درست را انتخاب کنید.
    correct_option: De man die in de winkel werkt.
    distractors:
    - De man dat in de winkel werkt.
    - De man die in de winkel werken.
    - Het man die in de winkel werkt.
    accepted_answers:
    - value: De man die in de winkel werkt.
      status: correct
    feedback: '*De man die in de winkel werkt*: بعد از کلمه‌های de از *die* استفاده می‌شه و فعل *werkt* می‌ره آخر جمله.'
    prompt_blocks:
    - مردی که در مغازه کار می‌کند.
  nl.a2.unit98.lesson01.exercise02.choose_boek:
    instruction: عبارت هلندی درست را انتخاب کنید.
    correct_option: Het boek dat ik kocht.
    distractors:
    - Het boek die ik kocht.
    - Het boek dat kocht ik.
    - De boek dat ik kocht.
    accepted_answers:
    - value: Het boek dat ik kocht.
      status: correct
    feedback: '*Het boek dat ik kocht*: بعد از کلمه‌های het از *dat* استفاده می‌شه و فعل *kocht* می‌ره آخر جمله.'
    prompt_blocks:
    - کتابی که من خریدم.
  nl.a2.unit98.lesson01.exercise03.match_phrases:
    instruction: هر عبارت هلندی را به معنی فارسی‌اش وصل کنید.
    accepted_answers:
    - value:
      - left: de man die in de winkel werkt
        right: مردی که در مغازه کار می‌کند
      - left: de tas die ik zoek
        right: کیفی که دنبالش می‌گردم
      - left: het boek dat ik kocht
        right: کتابی که خریدم
      - left: de klant die mijn telefoon vond
        right: مشتری‌ای که تلفن مرا پیدا کرد
      - left: het horloge dat ik verloor
        right: ساعتی که گم کردم
      - left: de collega die mij helpt
        right: همکاری که به من کمک می‌کند
      status: correct
    feedback: 'هر عبارت اول یه شخص یا چیز رو نام می‌بره و بعد می‌گه کدوم یکی: *die* یا *dat*، و آخرش فعل میاد.'
    pairs:
    - left: de man die in de winkel werkt
      right: مردی که در مغازه کار می‌کند
    - left: de tas die ik zoek
      right: کیفی که دنبالش می‌گردم
    - left: het boek dat ik kocht
      right: کتابی که خریدم
    - left: de klant die mijn telefoon vond
      right: مشتری‌ای که تلفن مرا پیدا کرد
    - left: het horloge dat ik verloor
      right: ساعتی که گم کردم
    - left: de collega die mij helpt
      right: همکاری که به من کمک می‌کند
  nl.a2.unit98.lesson01.exercise04.order_dit_is:
    instruction: کلمه‌ها رو مرتب کنید تا بگید «این کتابیه که خریدم.»
    correct_option: Dit is het boek dat ik kocht
    accepted_answers:
    - value: Dit is het boek dat ik kocht
      status: correct
    feedback: '*Dit is het boek dat ik kocht.* فعل *kocht* آخر جمله‌ست.'
  nl.a2.unit98.lesson01.exercise05.complete_die:
    instruction: جمله رو با ضمیر موصولی درست کامل کنید.
    correct_option: die
    accepted_answers:
    - value: die
      status: correct
    feedback: '*Man* کلمهٔ de است، پس *die*.'
  nl.a2.unit98.lesson01.exercise06.translate_vrouw:
    instruction: به هلندی ترجمه کنید.
    accepted_answers:
    - value: De vrouw die in de winkel werkt, is mijn collega.
      status: correct
    - value: De vrouw die in de winkel werkt, is mijn collega
      status: correct
    - value: De vrouw die in de winkel werkt is mijn collega
      status: correct
    - value: De vrouw die in de winkel werkt is mijn collega.
      status: correct
    - value: De vrouw die werkt in de winkel, is mijn collega.
      status: correct
    - value: De vrouw die werkt in de winkel is mijn collega.
      status: correct
    - value: Mijn collega is de vrouw die in de winkel werkt.
      status: correct
    - value: Mijn collega is de vrouw die in de winkel werkt
      status: correct
    feedback: '*De vrouw die in de winkel werkt, is mijn collega.* یعنی: زنی که توی مغازه کار می‌کند، همکار من است.'
    prompt_blocks:
    - زنی که در مغازه کار می‌کند همکار من است.
  nl.a2.unit98.lesson01.exercise07.write_boek:
    instruction: عبارت هلندی رو بنویسید.
    correct_option: Het boek dat ik kocht
    accepted_answers:
    - value: Het boek dat ik kocht
      status: correct
    - value: het boek dat ik kocht
      status: correct
    - value: Het boek dat ik kocht.
      status: correct
    - value: het boek dat ik kocht.
      status: correct
    feedback: '*Het boek dat ik kocht.*'
    prompt_blocks:
    - عبارت هلندیِ «کتابی که من خریدم» را بنویسید. از dat و فعل گذشتهٔ kocht استفاده کنید.
  nl.a2.unit98.lesson02.exercise01.choose_schoenen:
    instruction: عبارت هلندی درست را انتخاب کنید.
    correct_option: De schoenen die ik kocht.
    distractors:
    - De schoenen dat ik kocht.
    - Het schoenen die ik kocht.
    - De schoenen die kocht ik.
    accepted_answers:
    - value: De schoenen die ik kocht.
      status: correct
    feedback: '*Schoenen* جمعه، پس *die*.'
    prompt_blocks:
    - کفش‌هایی که من خریدم.
  nl.a2.unit98.lesson02.exercise02.choose_horloge:
    instruction: عبارت هلندی درست را انتخاب کنید.
    correct_option: Het horloge dat ik zoek.
    distractors:
    - Het horloge die ik zoek.
    - De horloge dat ik zoek.
    - Het horloge dat zoek ik.
    accepted_answers:
    - value: Het horloge dat ik zoek.
      status: correct
    feedback: '*Horloge* کلمهٔ het است، پس *dat*.'
    prompt_blocks:
