course:
  title: هلندی A2
  description: هلندی A2 مبتنی بر دستور زبان برای دعوت کردن، قبول کردن و رد کردن.
  learning_goal: دعوت کردن از کسی و قبول یا رد کردن دعوت با ذکر دلیل و پیشنهاد جایگزین، با استفاده از افعال کمکی، omdat/want و gaan/zullen.
units:
  nl.a2.unit107.uitnodigen_en_afslaan:
    title: دعوت کردن و رد کردن دعوت
    description: از دوستتان دعوت کنید، با شوق دعوت را قبول کنید یا مؤدبانه با ذکر دلیل و یک برنامه‌ی جایگزین رد کنید.
lessons:
  nl.a2.unit107.lesson01.een_uitnodiging:
    title: یک دعوت
  nl.a2.unit107.lesson02.ja_graag:
    title: بله، با کمال میل!
  nl.a2.unit107.lesson03.helaas_ik_kan_niet:
    title: متأسفانه نمی‌توانم
  nl.a2.unit107.lesson04.zullen_we_zondag:
    title: یکشنبه بریم؟
  nl.a2.unit107.lesson05.noors_uitnodiging:
    title: دعوت نور
  nl.a2.unit107.lesson06.lotte_en_omar_plannen:
    title: لوته و عمر برنامه می‌ریزند
teaching:
  nl.a2.unit107.lesson01.teach.plekken:
    title: مکان‌ها و مناسبت‌ها
    gloss: مهمانی / تولد / سینما / کنسرت / تئاتر
    note: این‌ها مناسبت‌ها و جاهایی هستند که برایشان از کسی دعوت می‌کنید.
    example_gloss:
    - لوته شنبه مهمانی دارد.
    - نور یکشنبه تولد دارد.
    - امشب می‌رویم سینما.
    - شنبه یک کنسرت هست.
    - تئاتر در مرکز شهر است.
  nl.a2.unit107.lesson01.teach.film:
    title: فیلم، اجرا، بلیت
    gloss: فیلم / اجرا / بلیت / امشب / شنبه / یکشنبه
    note: '*Voorstelling* به اجرا گفته می‌شود، مثلاً در تئاتر.'
    example_gloss:
    - فیلم ساعت هشت شروع می‌شود.
    - اجرا شنبه است.
    - من دو بلیت دارم.
    - امشب یک فیلم هست.
  nl.a2.unit107.lesson01.teach.gn_zin:
    title: Heb je zin om ... te ...?
    gloss: شنبه حال و حوصله‌ی رفتن به سینما را داری؟
    note: برای دعوت کردن از *Heb je zin om ... te + infinitive?* استفاده کنید. مصدر (*gaan*) بعد از *te* و درست در آخر جمله می‌آید.
    example_gloss:
    - حال و حوصله‌ی رفتن به کنسرت را داری؟
    - امشب حال و حوصله‌ی رفتن به تئاتر را داری؟
  nl.a2.unit107.lesson01.teach.gn_kom_je:
    title: Kom je ook naar ...?
    gloss: تو هم به مهمانی می‌آیی؟ تو هم به سینما می‌آیی؟
    note: '*Kom je ook naar ...?* یک دعوت کوتاه و دوستانه است. *Jij* شکل تأکیدی *je* است؛ اینجا هر دو درست‌اند.'
    example_gloss:
    - تو هم به مهمانی نور می‌آیی؟
  nl.a2.unit107.lesson01.teach.gn_wil_je_mee:
    title: Wil je mee naar ...?
    gloss: می‌خواهی با ما به کنسرت بیایی؟ می‌خواهی با ما به تئاتر بیایی؟
    note: '*Mee* یعنی «همراه». *Wil je mee naar ...?* به مصدر نیازی ندارد: حرکت از قبل در *mee naar* هست.'
    example_gloss:
    - می‌خواهی با ما به سینما بیایی؟
  nl.a2.unit107.lesson01.teach.zinnen:
    title: سه دعوت
    gloss: امشب حال و حوصله‌ی رفتن به سینما را داری؟ تو هم به مهمانی می‌آیی؟ می‌خواهی با ما به کنسرت بیایی؟
  nl.a2.unit107.lesson02.teach.leuk:
    title: جواب مثبت دادن
    gloss: خوب / دلنشین و خودمانی / با کمال میل / ایده‌ی خوب
    note: '*Gezellig* فضای دلپذیر و خودمانی را توصیف می‌کند. *Graag* یعنی «با کمال میل».'
    example_gloss:
    - چه خوب!
    - به نظرم خوب است.
    - بله، با کمال میل!
    - ایده خوبیه!
  nl.a2.unit107.lesson02.teach.gn_ja:
    title: قبول کردن دعوت
    gloss: چه خوب! بله، با کمال میل! من هم می‌آیم. با کمال میل می‌آیم.
    note: 'با یک واکنش کوتاه (*Leuk!*، *Ja, graag!*) قبول کنید و بعد تأیید کنید: *Ik ga mee* یا *Ik kom graag*.'
    example_gloss:
    - با کمال میل به مهمانی می‌آیم.
    - بله، با شما به سینما می‌آیم.
  nl.a2.unit107.lesson02.teach.gn_lijkt:
    title: Dat lijkt me ...
    gloss: به نظرم خوب می‌آید. به نظرم دلنشین می‌آید.
    note: '*Dat lijkt me ...* راه رایجی برای گفتن این است که برنامه‌ای را می‌پسندید. فعل *lijkt* در جای دوم جمله می‌ماند.'
    example_gloss:
    - به نظرم ایده‌ی خوبی است.
  nl.a2.unit107.lesson02.teach.tijd:
    title: پرسیدن ساعت
    gloss: چه ساعتی شروع می‌شود؟ ساعت هشت شروع می‌شود.
    note: بعد از قبول کردن، با *Hoe laat begint het?* ساعت را بپرسید و با *om ... uur* جواب بدهید.
    example_gloss:
    - فیلم ساعت نه شروع می‌شود.
    - اجرا ساعت هشت شروع می‌شود.
  nl.a2.unit107.lesson03.teach.helaas:
    title: رد کردن و دلیل آوردن
    gloss: متأسفانه / نه / ولی / کار کردن / خسته / بیمار / قرار / وقت نداشتن
    note: '*Helaas* رد کردن را ملایم‌تر می‌کند. *Geen tijd* یعنی «وقت نداشتن».'
    example_gloss:
    - متأسفانه نمی‌توانم.
    - دلم می‌خواهد، ولی وقت ندارم.
    - باید کار کنم.
    - خسته‌ام.
    - مریضم.
    - قرار دارم.
  nl.a2.unit107.lesson03.teach.gn_modals:
    title: توانستن، باید، خواستن
    gloss: نمی‌توانم بیایم. باید کار کنم. دلم می‌خواهد، ولی وقت ندارم.
    note: '*Kunnen*، *moeten* و *willen* معمولاً یک فعل دوم به شکل مصدر دارند که آخر جمله می‌آید: *Ik kan niet komen*؛ *Ik moet werken*.'
    example_gloss:
    - نمی‌توانم به مهمانی بیایم.
    - شنبه باید کار کنم.
  nl.a2.unit107.lesson03.teach.gn_want:
    title: want دلیل می‌آورد
    gloss: متأسفانه نمی‌توانم بیایم، چون باید کار کنم.
    note: '*Want* دو جمله‌ی مستقل را به هم وصل می‌کند، برای همین ترتیب کلمات عادی می‌ماند: اول نهاد، بعد فعل (*want ik moet werken*).'
    example_gloss:
    - نمی‌توانم بیایم، چون بیمارم.
  nl.a2.unit107.lesson03.teach.gn_omdat:
    title: omdat فعل را به آخر جمله می‌برد
    gloss: نمی‌آیم، چون قرار دارم.
    note: 'بعد از *omdat* فعل به آخر جمله می‌رود: *omdat ik een afspraak heb*. با فعل کمکی، هر دو فعل در آخر کنار هم می‌مانند و فعل صرف‌شده اول می‌آید: *omdat ik moet werken*.'
    example_gloss:
    - متأسفانه نمی‌توانم بیایم، چون باید کار کنم.
  nl.a2.unit107.lesson03.teach.gn_contrast:
    title: want در برابر omdat
    gloss: نمی‌آیم، چون قرار دارم. (هر دو جمله)
    note: هر دو دلیل می‌آورند. در *Want ik heb* فعل در جای دوم می‌ماند؛ در *omdat ik ... heb* فعل آخر می‌آید.
  nl.a2.unit107.lesson03.teach.zin:
    title: یک جواب منفی مؤدبانه
    gloss: متأسفانه نمی‌توانم، چون باید کار کنم.
  nl.a2.unit107.lesson04.teach.alt:
    title: پیشنهاد یک چیز دیگر
    gloss: به جای آن / پس / هفته‌ی بعد / فردا / خوب / (کلمه‌ی نرم‌کننده)
    note: '*In plaats daarvan* یعنی «به جای آن». *Wel* اینجا تأکید می‌کند که این گزینه جور است.'
    example_gloss:
    - به جایش یکشنبه برویم؟
    - آن موقع وقت دارم.
    - هفته‌ی بعد برایم خوب است.
    - فردا می‌روم سر کار.
    - عالی است.
  nl.a2.unit107.lesson04.teach.gn_zullen:
    title: Zullen we ...?
    gloss: یکشنبه برویم سینما؟ به جایش یکشنبه برویم سینما؟
    note: '*Zullen we ...?* یک برنامه را با هم پیشنهاد می‌کند. فعل برنامه (*gaan*) در آخر جمله می‌آید.'
    example_gloss:
    - فردا برویم کنسرت؟
  nl.a2.unit107.lesson04.teach.gn_gaan:
    title: gaan برای آینده
    gloss: شنبه می‌خواهم کار کنم. یکشنبه می‌رویم سینما.
    note: '*Gaan* + مصدر درباره‌ی برنامه‌ها حرف می‌زند: *Ik ga zaterdag werken*. مصدر در آخر می‌ماند. اگر اول جمله قید زمان بیاید، فعل در جای دوم می‌ماند: *Zondag gaan wij ...*.'
    example_gloss:
    - فردا می‌روم تئاتر.
    - یکشنبه می‌رویم کنسرت.
  nl.a2.unit107.lesson04.teach.gn_zal:
    title: zullen برای قول دادن
    gloss: فردا بهت زنگ می‌زنم.
    note: '*Zullen* را برای گفتن برنامه یا قول هم می‌شود به کار برد: *Ik zal je morgen bellen*. *Zal ik ...?* پیشنهاد کمک است؛ *Zullen we ...?* پیشنهاد برنامه‌ی مشترک است.'
    example_gloss:
    - یکشنبه می‌آیم.
  nl.a2.unit107.lesson04.teach.zinnen:
    title: نه، با پیشنهاد جایگزین
    gloss: متأسفانه نمی‌توانم، چون باید کار کنم. یکشنبه برویم؟
  nl.a2.unit107.lesson05.teach.woorden:
    title: کلمات یک پیام
    gloss: دعوت / ممنون / با مهر / از قبل / قرار گذاشتن
    note: '*Groetjes* پایان یک پیام دوستانه است.'
    example_gloss:
    - ممنون بابت دعوت!
    - با مهر، لوته
    - من از قبل قرار دارم.
  nl.a2.unit107.lesson05.teach.gn_voltooid:
    title: heb + اسم مفعول (فقط برای خواندن)
    gloss: با پدر و مادرم قرار گذاشته‌ام. کار کرده‌ام.
    note: در بیشتر فعل‌ها، *heb + اسم مفعول* (*afgesproken*، *gewerkt*) می‌گوید چه چیزی قبلاً اتفاق افتاده است. فعلاً فقط موقع خواندن آن را تشخیص بدهید؛ لازم نیست هنوز بنویسید.
  nl.a2.unit107.lesson05.teach.reading:
    title: نور و لوته می‌نویسند
    gloss: سلام لوته، شنبه حال و حوصله‌ی آمدن به تئاتر را داری؟ اجرا ساعت هشت شروع می‌شود. تو هم می‌آیی؟ با مهر، نور. سلام نور، ممنون از دعوتت! متأسفانه نمی‌توانم، چون از قبل با پدر و مادرم قرار گذاشته‌ام. یکشنبه برویم سینما؟ آن موقع وقت دارم. با مهر، لوته
    note: دعوت، جواب، دلیل و پیشنهاد جایگزین را پیدا کنید.
    glosses:
      afgesproken: قرار گذاشته
      ouders: پدر و مادر
      uitnodiging: دعوت
      groetjes: با مهر
  nl.a2.unit107.lesson06.teach.beurt1:
    title: لوته از عمر دعوت می‌کند
    gloss: 'لوته: سلام عمر، شنبه حال و حوصله‌ی آمدن به کنسرت را داری؟'
  nl.a2.unit107.lesson06.teach.beurt2:
    title: عمر با ذکر دلیل رد می‌کند
    gloss: 'عمر: متأسفانه نمی‌تونم، چون باید کار کنم.'
  nl.a2.unit107.lesson06.teach.beurt3:
    title: لوته یه پیشنهاد دیگه می‌ده
    gloss: 'لوته: حیف شد! یکشنبه بریم سینما؟'
  nl.a2.unit107.lesson06.teach.beurt4:
    title: عمر قبول می‌کنه و ساعت رو می‌پرسه
    gloss: 'عمر: یکشنبه می‌تونم. فیلم ساعت چند شروع می‌شه؟'
  nl.a2.unit107.lesson06.teach.beurt5:
    title: لوته ساعت رو می‌گه
    gloss: 'لوته: ساعت هشت.'
  nl.a2.unit107.lesson06.teach.beurt6:
    title: عمر قبول می‌کنه
    gloss: 'عمر: عالیه، با کمال میل! منم میام.'
exercises:
  nl.a2.unit107.lesson01.exercise01.kies_concert:
    instruction: دعوت هلندی‌ای رو انتخاب کنید که با جمله‌ی فارسی جور باشه.
    correct_option: Wil je mee naar het concert?
    distractors:
    - Kom je ook naar het feest?
    - Heb je zin om het concert?
    - Wil je naar het concert mee zin?
    accepted_answers:
    - value: Wil je mee naar het concert?
      status: correct
    feedback: '*Wil je mee naar het concert?* = می‌خوای با ما بیای کنسرت؟'
    prompt_blocks:
    - می‌خواهی با ما به کنسرت بیایی؟
  nl.a2.unit107.lesson01.exercise02.kies_zin:
    instruction: پرسش هلندی درست را انتخاب کنید.
    correct_option: Heb je zin om naar de bioscoop te gaan?
    distractors:
    - Heb je zin om naar de bioscoop gaan?
    - Hebben je zin om naar de bioscoop te gaan?
    - Heb je zin om te naar de bioscoop gaan?
    accepted_answers:
    - value: Heb je zin om naar de bioscoop te gaan?
      status: correct
    feedback: '*Heb je zin om ... te gaan?*: فعل مصدری *gaan* آخر جمله و بعد از *te* میاد.'
    prompt_blocks:
    - حوصله‌ی رفتن به سینما را داری؟
  nl.a2.unit107.lesson01.exercise03.match_plekken:
    instruction: هر کلمهٔ هلندی را به معنی فارسی‌اش وصل کنید.
    accepted_answers:
    - value:
      - left: het feest
        right: مهمانی
      - left: de bioscoop
        right: سینما
      - left: het concert
        right: کنسرت
      - left: het theater
        right: تئاتر (با «ال»)
      - left: het kaartje
        right: بلیت
      - left: de voorstelling
        right: اجرا (نمایش)
      status: correct
    feedback: این‌ها مناسبت‌ها و جاهایی هستند که برایشان از کسی دعوت می‌کنید.
    pairs:
    - left: het feest
      right: مهمانی
    - left: de bioscoop
      right: سینما
    - left: het concert
      right: کنسرت
    - left: het theater
      right: تئاتر (با «ال»)
    - left: het kaartje
      right: بلیت
    - left: de voorstelling
      right: اجرا (نمایش)
  nl.a2.unit107.lesson01.exercise04.order_mee:
    instruction: کلمه‌ها رو مرتب کنید تا بپرسید «می‌خوای با ما بیای کنسرت؟»
    correct_option: Wil je mee naar het concert
    accepted_answers:
    - value: Wil je mee naar het concert
      status: correct
    feedback: '*Wil je mee naar het concert?*'
  nl.a2.unit107.lesson01.exercise05.vul_om:
    instruction: دعوت رو کامل کنید.
    correct_option: om
    accepted_answers:
    - value: om
      status: correct
    feedback: '*Heb je zin om ... te gaan?*'
  nl.a2.unit107.lesson01.exercise06.vertaal_kom_je:
    instruction: به هلندی ترجمه کنید.
    accepted_answers:
    - value: Kom je ook naar het feest?
      status: correct
    - value: Kom je ook naar het feest
      status: correct
    - value: Kom jij ook naar het feest?
      status: correct
    - value: Kom jij ook naar het feest
      status: correct
    feedback: '*Kom je ook naar het feest?*'
    prompt_blocks:
    - تو هم به مهمانی می‌آیی؟
  nl.a2.unit107.lesson01.exercise07.schrijf_mee:
    instruction: دعوت رو با *Wil je mee naar ...?* بنویسید.
    correct_option: Wil je mee naar het theater?
    accepted_answers:
    - value: Wil je mee naar het theater?
      status: correct
    - value: Wil je mee naar het theater
      status: correct
    feedback: '*Wil je mee naar het theater?*'
    prompt_blocks:
    - 'با wil je mee به هلندی بنویسید: از یک دوست بپرسید می‌خواهد با شما به تئاتر بیاید یا نه.'
  nl.a2.unit107.lesson02.exercise01.kies_ja:
    instruction: جوابی رو انتخاب کنید که دعوت رو قبول می‌کنه.
    correct_option: Ja, graag! Dat lijkt me gezellig.
    distractors:
    - Kom je ook naar het feest?
    - Wil je mee naar het concert?
    - Hoe laat begint de film?
    accepted_answers:
    - value: Ja, graag! Dat lijkt me gezellig.
      status: correct
    feedback: هم *Ja, graag!* و هم *Dat lijkt me gezellig* دعوت رو قبول می‌کنن.
    prompt_blocks:
    - 'لوته می‌پرسد: «Heb je zin om naar de film te gaan؟» جوابی را انتخاب کنید که بله می‌گوید.'
  nl.a2.unit107.lesson02.exercise02.kies_lijkt:
    instruction: جملهٔ هلندی درست را انتخاب کنید.
    correct_option: Dat lijkt me leuk.
    distractors:
    - Dat lijkt me graag.
    - Dat leuk lijkt me.
    - Dat lijk ik leuk.
    accepted_answers:
    - value: Dat lijkt me leuk.
      status: correct
    feedback: '*Dat lijkt me leuk.*'
    prompt_blocks:
    - به نظرم خوب است.
  nl.a2.unit107.lesson02.exercise03.match_ja:
    instruction: هر عبارت هلندی را به معنی فارسی‌اش وصل کنید.
    accepted_answers:
    - value:
      - left: Ja, graag!
        right: بله، با کمال میل!
      - left: Goed idee!
        right: ایده خوبیه!
      - left: Wat leuk!
        right: چه خوب!
      - left: Dat lijkt me gezellig.
