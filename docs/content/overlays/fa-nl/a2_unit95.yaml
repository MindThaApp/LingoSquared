course:
  title: هلندی A2
  description: هلندی A2 با تمرکز بر دستور زبان برای صحبت درباره‌ی شرط‌های واقعی.
  learning_goal: بگویید اگر شرطی برقرار باشد چه اتفاقی می‌افتد یا خواهد افتاد؛ با als + زمان حال، فعل در آخر جمله‌واره‌ی als و جابه‌جایی فاعل و فعل در جمله‌ی اصلی.
units:
  nl.a2.unit95.als_dan:
    title: اگر ... آن‌وقت
    description: 'درباره‌ی برنامه‌های مربوط به آب‌وهوا و قوانین فروشگاه با شرط‌های واقعی صحبت کنید: als + زمان حال، با dan یا بدون آن.'
lessons:
  nl.a2.unit95.lesson01.als_het_regent:
    title: اگر باران بیاید
  nl.a2.unit95.lesson02.werkwoord_achteraan:
    title: فعل در آخر جمله
  nl.a2.unit95.lesson03.voorop_of_achteraan:
    title: اول یا آخر
  nl.a2.unit95.lesson04.regels_in_de_winkel:
    title: قوانین فروشگاه
  nl.a2.unit95.lesson05.noors_bericht:
    title: پیام نور
  nl.a2.unit95.lesson06.lotte_en_omar:
    title: لوته و عمر برنامه می‌ریزند
teaching:
  nl.a2.unit95.lesson01.teach.weer:
    title: آب‌وهوا
    gloss: آب‌وهوا / خورشید / تابیدن / باران آمدن / خوب / سرد / گرم
    note: 'جمله‌های مربوط به آب‌وهوا با *het* ساخته می‌شوند: *Het regent*، *Het is koud*. خورشید فاعل فعل *schijnen* است: *De zon schijnt*.'
    example_gloss:
    - هوا خوب است.
    - خورشید می‌تابد.
    - باران می‌آید.
    - هوا سرده.
    - هوا گرمه.
  nl.a2.unit95.lesson01.teach.plannen:
    title: برنامه‌ها
    gloss: خانه ماندن / قدم زدن / به پارک رفتن / به ساحل رفتن
    note: 'با *ik* انتهای مصدر حذف می‌شود: *blijven* می‌شود *ik blijf* و *gaan* می‌شود *ik ga*. با *we* فعل همان شکل مصدر را دارد: *we blijven, we gaan*.'
    example_gloss:
    - من خانه می‌مانم.
    - من به پارک می‌روم.
    - ما به ساحل می‌رویم.
    - ما خانه می‌مانیم.
    - ما در پارک قدم می‌زنیم.
  nl.a2.unit95.lesson01.teach.vraag:
    title: پرسیدن درباره‌ی برنامه
    gloss: اگر باران بیاید چه کار می‌کنی؟
    note: '*Als* یعنی «اگر». در این سؤال، بند *als* در آخر جمله آمده است.'
  nl.a2.unit95.lesson01.teach.gn_als_basis:
    title: als برای شرط‌های واقعی
    gloss: اگر باران بیاید، خانه می‌مانم. اگر خورشید بتابد، به پارک می‌روم.
    note: برای چیزی که واقعاً ممکن است اتفاق بیفتد، *als* + زمان حال به کار ببرید. بند *als* شرط را می‌گوید و بند دیگر می‌گوید چه اتفاقی می‌افتد یا شما چه کار می‌کنید. این درس فقط شرط‌های واقعی را پوشش می‌دهد، نه شرط‌های خیالی را.
  nl.a2.unit95.lesson01.teach.zinnen:
    title: دو برنامه
    gloss: اگر هوا سرد باشد، خانه می‌مانم. اگر هوا گرم باشد، به ساحل می‌رویم.
  nl.a2.unit95.lesson02.teach.tijd:
    title: وقت و تماس تلفنی
    gloss: وقت داشتن / تلفن زدن / همراه آمدن
    note: '*Hebben* و *komen* با فاعل تغییر می‌کنند: *ik heb, je hebt, hij heeft*؛ *ik kom, je komt, hij komt*. هر وقت *je* بعد از فعل بیاید (در سؤال، یا در بند اصلیِ بعد از بند *als*)، *-t* حذف می‌شود: *heb je, kom je*.'
    example_gloss:
    - من وقت دارم.
    - وقت داری؟
    - عمر وقت دارد.
    - من به لوته زنگ می‌زنم.
    - عمر به لوته زنگ می‌زند.
    - تو هم می‌آیی؟
    - او هم می‌آید.
  nl.a2.unit95.lesson02.teach.drinken:
    title: نوشیدنی‌ها
    gloss: نوشیدن / چای / آب / قهوه
    example_gloss:
    - من چای می‌نوشم.
    - ما قهوه می‌نوشیم.
    - من آب می‌نوشم.
  nl.a2.unit95.lesson02.teach.gn_werkwoord_achteraan:
    title: فعل در بند als آخر می‌آید
    gloss: اگر وقت داشته باشم، به Lotte زنگ می‌زنم.
    note: در بند *als* فعلِ صرف‌شده به آخر بند می‌رود (در جمله‌های ساده‌ی این درس، آخرین کلمه است). بگویید *als ik tijd heb*، نه *als ik heb tijd*. در *als het koud is* و *als de zon schijnt* هم همین‌طور است.
  nl.a2.unit95.lesson02.teach.gn_personen:
    title: فاعل‌های دیگر
    gloss: اگر وقت داشته باشی، می‌آیی. اگر عمر وقت داشته باشد، او می‌آید.
    note: 'داخل بند *als* فعل آخر می‌آید و با فاعلش مطابقت دارد: *je hebt*، *Omar heeft*. در بند اصلیِ بعد از بند *als*، فعل اول می‌آید و فاعل بعد از آن: *kom je*، *komt hij*.'
  nl.a2.unit95.lesson02.teach.zinnen:
    title: نوشیدنی و آب‌وهوا
    gloss: اگر هوا گرم باشد، آب می‌نوشم. اگر هوا سرد باشد، چای می‌نوشم.
  nl.a2.unit95.lesson03.teach.plaatsen:
    title: روزها و مکان‌ها
    gloss: فردا / شنبه / موزه / بازار
    example_gloss:
    - فردا به بازار می‌روم.
    - شنبه به موزه می‌رویم.
    - موزه خوب است.
  nl.a2.unit95.lesson03.teach.gn_inversie:
    title: 'اول بند als: فعل قبل از فاعل'
    gloss: اگر باران ببارد، به موزه می‌روم.
    note: 'وقتی بند *als* اول جمله می‌آید، جای اول جمله را پر می‌کند. بند اصلی بعد از آن با فعل شروع می‌شود و فاعل بعدش می‌آید: *ga ik*، نه *ik ga*. بعد از بند *als* ویرگول بگذارید.'
  nl.a2.unit95.lesson03.teach.gn_dan:
    title: dan اختیاری
    gloss: اگر باران بیاید، آن‌وقت به موزه می‌روم.
    note: 'می‌توانید بعد از ویرگول *dan* («آن‌وقت») اضافه کنید. این کار اختیاری است. فعل باز هم درست بعد از *dan* و قبل از فاعل می‌آید: *dan ga ik*.'
  nl.a2.unit95.lesson03.teach.gn_achteraan:
    title: اول بند اصلی
    gloss: اگر باران بیاید، به موزه می‌روم.
    note: می‌توانید جمله را با بند اصلی هم شروع کنید. در این حالت ترتیب کلمات عادی است (*ik ga*)، جابه‌جایی فعل و فاعل نداریم و معمولاً ویرگول هم نمی‌گذارید. معنی با *Als het regent, ga ik naar het museum.* یکی است.
  nl.a2.unit95.lesson03.teach.zinnen:
    title: هر دو ترتیب
    gloss: اگر خورشید بتابد، آن‌وقت به ساحل می‌رویم. اگر هوا خوب باشد، به بازار می‌رویم.
  nl.a2.unit95.lesson04.teach.winkel:
    title: در فروشگاه
    gloss: فروشگاه / رسید / پول / تخفیف / رایگان
    note: '*De bon* رسیدی است که در فروشگاه می‌گیرید. *Geen* قبل از اسم یعنی «هیچ» یا «نه»: *geen geld*.'
    example_gloss:
    - من در فروشگاه هستم.
    - رسید را دارم.
    - من پول ندارم.
    - تخفیف خوب است.
  nl.a2.unit95.lesson04.teach.werkwoorden:
    title: فعل‌های خرید
    gloss: خریدن / پرداخت کردن / گرفتن / پس
    note: '*Je krijgt je geld terug* = پولت را پس می‌گیری. با *ik* فعل پایانی ندارد؛ با *je* به *-t* ختم می‌شود، مگر وقتی *je* بعد از فعل بیاید: *krijg je*.'
    example_gloss:
    - من دو تا می‌خرم.
    - شما پنجاه یورو پرداخت می‌کنید.
    - شما تخفیف می‌گیرید.
    - پولتان را پس می‌گیرید.
  nl.a2.unit95.lesson04.teach.bedragen:
    title: عدد و ارسال
    gloss: دو / پنجاه / یورو / بیشتر از / ارسال / نه
    example_gloss:
    - ارسال رایگان است.
    - من بیشتر از پنجاه یورو پرداخت می‌کنم.
    - من رسید را ندارم.
  nl.a2.unit95.lesson04.teach.gn_regels:
    title: قوانین فروشگاه از als + زمان حال استفاده می‌کنند
    gloss: اگر رسید را داشته باشید، پولتان را پس می‌گیرید.
    note: 'فروشگاه‌ها قوانینشان را به شکل شرط‌های واقعی می‌نویسند: *als* + زمان حال، فعل در آخر بند *als*، و در بند اصلیِ بعد از آن فعل قبل از فاعل می‌آید. خیلی از فروشگاه‌ها به جای *je* از *u* استفاده می‌کنند، ولی ساختار همان است.'
  nl.a2.unit95.lesson04.teach.zinnen:
    title: دو قانون فروشگاه
    gloss: اگر دو تا بخرید، تخفیف می‌گیرید. اگر رسید را نداشته باشید، پولتان را پس نمی‌گیرید.
  nl.a2.unit95.lesson04.teach.gn_wanneer:
    title: als یا wanneer؟
    gloss: کی به فروشگاه برویم؟
    note: در هلندیِ روزمره، *als* کلمه‌ی معمول برای «اگر» در شرط است. *Wanneer* بیشتر در سؤال به معنی «کی؟» به کار می‌رود. برای شرط‌های این درس از *wanneer* استفاده نکنید.
  nl.a2.unit95.lesson05.teach.reading:
    title: برنامه‌های نور
    gloss: سلام لوته و عمر! شنبه اگر خورشید بتابد به ساحل می‌رویم. اگر باران بیاید به موزه می‌رویم. اگر هوا سرد باشد چای می‌نوشیم. اگر شما وقت داشته باشید، می‌آیید؟ سلام و دوستی، نور
    note: دقت کنید کدام برنامه به کدام شرط مربوط است. به فعلِ آخر هر بند *als* توجه کنید.
    glosses:
      Hoi: سلام
      jullie: شما (جمع)
      Groetjes: سلام و دوستی
  nl.a2.unit95.lesson06.teach.lotte_vraag:
    title: لوته درباره‌ی شنبه می‌پرسد
    gloss: 'لوته: سلام عمر، شنبه چه کار می‌کنی؟'
  nl.a2.unit95.lesson06.teach.omar_strand:
    title: عمر یک شرط می‌گوید
    gloss: 'عمر: اگر هوا خوب باشد، به ساحل می‌روم.'
  nl.a2.unit95.lesson06.teach.lotte_regen:
    title: لوته درباره‌ی باران می‌پرسد
    gloss: 'لوته: و اگر باران بیاید؟'
  nl.a2.unit95.lesson06.teach.omar_museum:
    title: عمر یک برنامه و یک دعوت پیشنهاد می‌دهد
    gloss: 'عمر: آن‌وقت به موزه می‌روم. اگر وقت داشته باشی، می‌آیی؟'
  nl.a2.unit95.lesson06.teach.lotte_mee:
    title: لوته با یک شرط قبول می‌کند
    gloss: 'لوته: آره، شنبه مرخصی‌ام. اگر خورشید بتابد، می‌آیم.'
  nl.a2.unit95.lesson06.teach.omar_tot:
    title: عمر گفت‌وگو را تمام می‌کند
    gloss: 'عمر: عالیه! شنبه می‌بینمت!'
exercises:
  nl.a2.unit95.lesson01.exercise01.choose_regent_thuis:
    instruction: جملهٔ هلندی‌ای را که با معنی فارسی می‌خواند انتخاب کنید.
    correct_option: Als het regent, blijf ik thuis.
    distractors:
    - Als de zon schijnt, blijf ik thuis.
    - Als het regent, ga ik naar het park.
    - اگر هوا سرد باشد، به ساحل می‌روم.
    accepted_answers:
    - value: Als het regent, blijf ik thuis.
      status: correct
    feedback: '*Als het regent* = اگر باران بیاید؛ *blijf ik thuis* = خانه می‌مانم.'
    prompt_blocks:
    - اگر باران ببارد، در خانه می‌مانم.
  nl.a2.unit95.lesson01.exercise02.choose_zon_park:
    instruction: جملهٔ هلندی‌ای را که با معنی فارسی می‌خواند انتخاب کنید.
    correct_option: Als de zon schijnt, gaan we naar het park.
    distractors:
    - Als het regent, gaan we naar het park.
    - Als de zon schijnt, blijven we thuis.
    - اگر هوا سرد باشد، به پارک می‌رویم.
    accepted_answers:
    - value: Als de zon schijnt, gaan we naar het park.
      status: correct
    feedback: '*Als de zon schijnt* = اگر خورشید بتابد؛ *gaan we* = می‌رویم.'
    prompt_blocks:
    - اگر آفتاب باشد، به پارک می‌رویم.
  nl.a2.unit95.lesson01.exercise03.match_condities:
    instruction: هر عبارت هلندی را به معنی فارسی‌اش وصل کنید.
    accepted_answers:
    - value:
      - left: het regent
        right: باران می‌بارد
      - left: de zon schijnt
        right: آفتاب می‌تابد
      - left: هوا سرده
        right: هوا سرد است
      - left: هوا گرمه
        right: هوا گرم است
      - left: هوا خوبه
        right: هوا خوب است
      - left: we blijven thuis
        right: در خانه می‌مانیم
      status: correct
    feedback: این عبارت‌ها قطعات سازنده‌ی جمله‌های این درس هستند.
    pairs:
    - left: het regent
      right: باران می‌بارد
    - left: de zon schijnt
      right: آفتاب می‌تابد
    - left: هوا سرده
      right: هوا سرد است
    - left: هوا گرمه
      right: هوا گرم است
    - left: هوا خوبه
      right: هوا خوب است
    - left: we blijven thuis
      right: در خانه می‌مانیم
    localize_pair_lefts: 'yes'
  nl.a2.unit95.lesson01.exercise04.order_regent:
    instruction: کلمه‌ها را مرتب کنید تا بگویید «اگر باران بیاید، خانه می‌مانم.»
    correct_option: Als het regent blijf ik thuis
    accepted_answers:
    - value: Als het regent blijf ik thuis
      status: correct
    - value: Ik blijf thuis als het regent
      status: correct
    feedback: '*Als het regent, blijf ik thuis.* می‌توانید بند *als* را آخر جمله هم بگذارید: *Ik blijf thuis als het regent.*'
  nl.a2.unit95.lesson01.exercise05.complete_regent:
    instruction: 'جمله را کامل کنید: «اگر باران بیاید، خانه می‌مانم.»'
    correct_option: regent
    accepted_answers:
    - value: regent
      status: correct
    feedback: '*Het regent* = باران می‌آید.'
  nl.a2.unit95.lesson01.exercise06.translate_zon_park:
    instruction: به هلندی ترجمه کنید.
    accepted_answers:
    - value: Als de zon schijnt, ga ik naar het park.
      status: correct
    - value: Als de zon schijnt ga ik naar het park.
      status: correct
    - value: Ik ga naar het park als de zon schijnt.
      status: correct
    - value: Ik ga naar het park, als de zon schijnt.
      status: correct
    feedback: '*Als de zon schijnt, ga ik naar het park.*'
    prompt_blocks:
    - اگر آفتاب باشد، به پارک می‌روم.
  nl.a2.unit95.lesson01.exercise07.write_koud:
    instruction: جملهٔ هلندی خواسته‌شده را بنویسید.
    correct_option: Als het koud is, blijf ik thuis.
    accepted_answers:
    - value: Als het koud is, blijf ik thuis.
      status: correct
    - value: Als het koud is blijf ik thuis.
      status: correct
    - value: Ik blijf thuis als het koud is.
      status: correct
    - value: Ik blijf thuis, als het koud is.
      status: correct
    feedback: درسته! *Als het koud is, blijf ik thuis.* یعنی «وقتی هوا سرده، من تو خونه می‌مونم.»
    prompt_blocks:
    - 'به هلندی بنویسید: اگر هوا سرد باشد، در خانه می‌مانم.'
  nl.a2.unit95.lesson02.exercise01.choose_tijd_bel:
    instruction: جمله‌ای را انتخاب کنید که فعل در جای درست قرار دارد.
    correct_option: Als ik tijd heb, bel ik Lotte.
    distractors:
    - Als ik heb tijd, bel ik Lotte.
    - Als ik tijd heb, ik bel Lotte.
    - Als ik tijd heb, ik Lotte bel.
    accepted_answers:
    - value: Als ik tijd heb, bel ik Lotte.
      status: correct
    feedback: 'در جملهٔ *als* فعل آخر می‌آید: *als ik tijd heb*. بعد جملهٔ اصلی با فعل شروع می‌شود: *bel ik*.'
    prompt_blocks:
    - اگر وقت داشته باشم، به Lotte زنگ می‌زنم.
  nl.a2.unit95.lesson02.exercise02.choose_omar:
    instruction: جمله‌ای را انتخاب کنید که فعل‌ها در جای درست قرار دارند.
    correct_option: Als Omar tijd heeft, komt hij mee.
    distractors:
    - Als Omar heeft tijd, komt hij mee.
    - Als Omar tijd heeft, hij komt mee.
    - Als Omar tijd heeft, komt mee hij.
    accepted_answers:
    - value: Als Omar tijd heeft, komt hij mee.
      status: correct
    feedback: '*Heeft* آخر جملهٔ *als* آمده است؛ *komt hij mee* با فعل شروع می‌شود.'
    prompt_blocks:
    - اگر Omar وقت داشته باشد، همراه ما می‌آید.
  nl.a2.unit95.lesson02.exercise03.match_clauses:
    instruction: هر جملهٔ شرطیِ هلندی با als را به معنی فارسی‌اش وصل کنید.
