    prompt_blocks:
    - باید استراحت کنی.
  nl.a2.unit90.lesson01.exercise02.kies_dokter:
    instruction: جمله‌ی هلندی‌ای را انتخاب کنید که یعنی «باید پیش دکتر بروی.»
