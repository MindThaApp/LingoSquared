course:
  title: هلندی A2
  description: هلندی سطح A2 با تمرکز بر دستور زبان، برای دادن و پاسخ دادن به توصیه‌های ساده.
  learning_goal: با je moet، je zou ... moeten، het is beter om ... te و waarom ... niet توصیه بدهید و به توصیه پاسخ بدهید.
units:
  nl.a2.unit90.goede_raad:
    title: توصیهٔ خوب
    description: دربارهٔ مشکلات سلامتی، درسی و مالی توصیه‌های ساده بدهید و به آن‌ها پاسخ بدهید.
lessons:
  nl.a2.unit90.lesson01.je_moet_rusten:
    title: باید استراحت کنی
  nl.a2.unit90.lesson02.je_zou_moeten:
    title: بهتره
  nl.a2.unit90.lesson03.moet_zou_of_beter:
    title: باید، بهتره یا بهتر است
  nl.a2.unit90.lesson04.waarom_niet:
    title: چرا که نه؟
  nl.a2.unit90.lesson05.bericht_van_lotte:
    title: پیامی از لوته
  nl.a2.unit90.lesson06.lotte_en_omar:
    title: لوته و عمر
teaching:
  nl.a2.unit90.lesson01.teach.gezondheid:
    title: واژه‌های سلامتی
    gloss: سردرد / دکتر / داروخانه / بیمار / خسته
    note: این واژه‌ها یک مشکل کوچک سلامتی را توصیف می‌کنند.
    example_gloss:
    - سردرد دارم.
    - من بیمارم.
    - خسته‌ام.
  nl.a2.unit90.lesson01.teach.werkwoorden:
    title: فعل‌ها برای توصیه کردن
    gloss: استراحت کردن / خوابیدن / نوشیدن / رفتن / آب
    note: بعد از *moet*، فعل اصلی به شکل مصدر می‌آید و معمولاً آخر جمله قرار می‌گیرد.
    example_gloss:
    - من آب می‌نوشم.
    - من به داروخانه می‌روم.
    - من زیاد می‌خوابم.
  nl.a2.unit90.lesson01.teach.gn_je_moet:
    title: توصیه‌ی قاطع با je moet
    gloss: باید استراحت کنید. باید آب بنوشید. باید پیش دکتر بروید.
    note: 'توصیه‌ی قاطع و مستقیم: *je moet* + بقیه‌ی جمله + مصدر در آخرِ جمله. *Moeten* مصدر است؛ با *je* می‌شود *moet*.'
  nl.a2.unit90.lesson01.teach.jij:
    title: Je یا jij
    gloss: باید استراحت کنی. تو هم باید استراحت کنی.
    note: '*Je* و *jij* هر دو یعنی «تو»؛ *jij* کمی تأکید بیشتری دارد.'
  nl.a2.unit90.lesson01.teach.vraag:
    title: درخواست توصیه
    gloss: چه کار کنم؟ (درخواست توصیه)
    note: '*Doen* مصدر است و آخر جمله می‌آید.'
  nl.a2.unit90.lesson02.teach.studie:
    title: واژه‌های درس و تحصیل
    gloss: امتحان / تکلیف / درس خواندن، یاد گرفتن / تمرین کردن / هر روز / فردا
    note: '*Leren* هم می‌تواند به معنی درس خواندن باشد و هم یاد گرفتن.'
    example_gloss:
    - من فردا امتحان دارم.
    - دارم تکلیفم را انجام می‌دهم.
  nl.a2.unit90.lesson02.teach.geld:
    title: واژه‌های پول
    gloss: پول / پس‌انداز کردن / خرج کردن / کمتر / بیشتر / کم
    note: با این کلمه‌ها می‌توانید درباره‌ی مشکلات مالی صحبت کنید.
    example_gloss:
    - من پول کمی دارم.
    - می‌خواهم بیشتر پس‌انداز کنم.
  nl.a2.unit90.lesson02.teach.gn_zou_moeten:
    title: 'توصیه‌ی ملایم‌تر: je zou ... moeten'
    gloss: بهتر است استراحت کنی. بهتر است آب بنوشی. بهتر است کمتر پول خرج کنی.
    note: 'توصیه‌ی ملایم‌تر: *je zou* + بقیه‌ی جمله + *moeten* + مصدر. *Moeten* و مصدر آخر جمله کنار هم می‌آیند: *moeten drinken*، *moeten uitgeven*.'
  nl.a2.unit90.lesson02.teach.problemen:
    title: دو مشکل
    gloss: من پول کمی دارم. فردا امتحان دارم.
  nl.a2.unit90.lesson03.teach.tijd:
    title: کلمه‌های زمان
    gloss: زود / دیر / هفته / امروز / تخت
    note: برای خوابیدن از *naar bed gaan* استفاده کنید.
    example_gloss:
    - امروز زود می‌خوابم.
    - من هر هفته پس‌انداز می‌کنم.
  nl.a2.unit90.lesson03.teach.gn_beter_om:
    title: Het is beter om ... te (توصیه)
    gloss: بهتر است زود بخوابید. بهتر است هر هفته پس‌انداز کنید.
    note: 'توصیه‌ی آرام و خنثی: *Het is beter om* + بقیه‌ی جمله + *te* + مصدر در آخر. کلمه‌ی *te* درست قبل از مصدر می‌آید.'
  nl.a2.unit90.lesson03.teach.gn_contrast:
    title: سه روش برای توصیه کردن
    gloss: باید استراحت کنی. بهتر است استراحت کنی. استراحت کردن بهتر است.
    note: 'سه سطح توصیه: *je moet* قاطع است، *je zou ... moeten* ملایم‌تر است و *het is beter om ... te* آرام و خنثی است. وقتی مطمئن نیستید، با دوستانتان از شکل‌های ملایم‌تر استفاده کنید.'
  nl.a2.unit90.lesson03.teach.voorbeelden:
    title: مثال‌های بیشتر
    gloss: نوشیدن آب بهتر است. هر روز تمرین کردن بهتر است.
  nl.a2.unit90.lesson04.teach.woorden:
    title: مشکل، توصیه، نکته
    gloss: مشکل / توصیه / نکته
    note: '*Advies* کلمه‌ی عمومی برای توصیه است؛ برای یک توصیه‌ی کوچک معمولاً می‌گویند *een tip*.'
    example_gloss:
    - من یک مشکل دارم.
    - این نکته‌ی خوبی است.
  nl.a2.unit90.lesson04.teach.gn_waarom_niet:
    title: Waarom ... niet? به عنوان توصیه
    gloss: چرا پیش دکتر نمی‌روی؟ چرا کمی بیشتر پس‌انداز نمی‌کنی؟ چرا هر روز تمرین نمی‌کنی؟
    note: 'روشی دوستانه برای پیشنهاد دادن: *Waarom* + فعل + *je* + *niet* + بقیه. فعل درست بعد از *waarom* و قبل از *je* می‌آید.'
  nl.a2.unit90.lesson04.teach.gn_reageren:
    title: واکنش به توصیه
    gloss: فکر خوبی است. انجامش می‌دهم. بابت نکته ممنون.
    note: 'چند پاسخ کوتاه به توصیه: *Goed idee* (خوشتان آمده)، *Dat doe ik* (انجامش می‌دهید)، *Bedankt voor de tip* (از طرف تشکر می‌کنید).'
  nl.a2.unit90.lesson04.teach.zin:
    title: کمک خواستن
    gloss: من یک مشکل دارم. چه کار کنم؟
  nl.a2.unit90.lesson05.teach.lezen:
    title: توصیه‌های لوته
    gloss: سلام عمر، بابت پیامت ممنون. سرت درد می‌کند و خسته‌ای. امروز باید استراحت کنی و آب زیادی بنوشی. بهتر است قهوه‌ی کمتری هم بنوشی. بهتر است زود بخوابی. چرا فردا پیش دکتر نمی‌روی؟ با آرزوی بهترین‌ها، لوته
    note: لوته در جواب عمر هر سه نوع توصیه و یک پیشنهاد با *waarom ... niet?* می‌دهد.
  nl.a2.unit90.lesson06.teach.omar_probleem:
    title: عمر مشکلش را می‌گوید
    gloss: 'عمر: سلام لوته، من یک مشکل دارم. سرم درد می‌کند.'
  nl.a2.unit90.lesson06.teach.lotte_rusten:
    title: لوته توصیه‌ی قاطع می‌کند
    gloss: 'لوته: چه بد! باید استراحت کنی و آب بنوشی.'
  nl.a2.unit90.lesson06.teach.omar_idee:
    title: عمر می‌پذیرد و مشکل دومی را می‌گوید
    gloss: 'عمر: فکر خوبی است. پول هم کم دارم.'
  nl.a2.unit90.lesson06.teach.lotte_geld:
    title: لوته توصیه‌ی ملایم‌تر و خنثی می‌کند
    gloss: 'لوته: بهتر است کمتر پول خرج کنی. بهتر است هر هفته پس‌انداز کنی.'
  nl.a2.unit90.lesson06.teach.omar_bedankt:
    title: عمر قول می‌دهد و تشکر می‌کند
    gloss: 'عمر: انجامش می‌دهم. بابت نکته‌ها ممنون!'
  nl.a2.unit90.lesson06.teach.lotte_bed:
    title: لوته با یک پیشنهاد تمام می‌کند
    gloss: 'لوته: خواهش می‌کنم! چرا زود نمی‌خوابی؟'
exercises:
