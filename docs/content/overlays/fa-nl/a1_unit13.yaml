teaching:
  nl.a1.unit13.lesson01.teach.lekker_vinden:
    title: Lekker vinden برای خوراکی و نوشیدنی
    gloss: برای خوراکی و نوشیدنی، در هلندی معمولاً از lekker vinden استفاده می‌شود.
    note: در هلندی برای «دوست داشتن» فقط یک عبارت وجود ندارد. برای مزه بگویید *Ik vind ... lekker*، یعنی تقریباً «آن را خوشمزه می‌دانم».
  nl.a1.unit13.lesson01.teach.koffie:
    title: دوست داشتن قهوه
    gloss: من قهوه را دوست دارم.
    note: خوراکی یا نوشیدنی بین *vind* و *lekker* می‌آید.
  nl.a1.unit13.lesson01.teach.thee:
    title: دوست نداشتن چای
    gloss: من چای را دوست ندارم.
    note: برای نپسندیدن مزه، *niet* را پیش از *lekker* بگذارید.
  nl.a1.unit13.lesson01.teach.question:
    title: پرسیدن درباره‌ی مزه
    gloss: سوپ گوجه‌فرنگی را دوست داری؟
    note: در پرسش غیررسمی، *vind* پیش از *je* می‌آید. این ادامه‌ی همان سبک *jij/je* در این دوره است.
  nl.a1.unit13.lesson02.teach.leuk_vinden:
    title: Leuk vinden برای فعالیت‌ها
    gloss: 'برای فعالیت‌ها در هلندی معمولاً از leuk vinden استفاده می‌شود: دوچرخه‌سواری را دوست دارم.'
    note: برای فعالیتی مثل دوچرخه‌سواری از *leuk* استفاده کنید، نه *lekker*.
  nl.a1.unit13.lesson02.teach.walking:
    title: دوست داشتن پیاده‌روی
    gloss: من پیاده‌روی را دوست دارم.
    note: فعالیت، یعنی *wandelen*، بین *vind* و *leuk* می‌آید.
  nl.a1.unit13.lesson02.teach.dislike:
    title: دوست نداشتن خرید کردن
    gloss: من خرید کردن را دوست ندارم.
    note: '*Niet* پیش از *leuk* می‌آید.'
  nl.a1.unit13.lesson02.teach.activity_question:
    title: پرسیدن درباره‌ی فعالیت‌ها
    gloss: چه کارهایی را دوست داری انجام بدهی؟
    note: '*Wat vind je leuk om te doen?* پرسشی طبیعی و کلی درباره‌ی کارهای مورد علاقه‌ی کسی است.'
  nl.a1.unit13.lesson03.teach.strong_like:
    title: علاقه‌ی قوی‌تر یا کلی
    gloss: Houden van علاقه‌ی قوی یا کلی را بیان می‌کند.
    note: آن را با احتیاط به کار ببرید. برای واکنش‌های معمولی به یک غذا یا فعالیت، *lekker vinden* یا *leuk vinden* طبیعی‌تر است.
  nl.a1.unit13.lesson03.teach.music:
    title: علاقه داشتن به موسیقی
    gloss: من عاشق موسیقی‌ام / خیلی به موسیقی علاقه دارم.
    note: '*Houd* صورت *ik* از فعل *houden* است و *van* بعد از آن می‌آید.'
  nl.a1.unit13.lesson03.teach.films:
    title: دوست نداشتن فیلم
    gloss: من فیلم دوست ندارم.
    note: در جمله‌ی منفی، *niet* بین *houd* و *van* قرار می‌گیرد.
  nl.a1.unit13.lesson03.teach.contrast:
    title: عبارت طبیعی را انتخاب کنید
    gloss: 'برای یک مزه‌ی معمولی بگویید: قهوه را دوست دارم. برای یک فعالیت: پیاده‌روی را دوست دارم.'
    note: هر «دوست داشتن» فارسی را مکانیکی با *houden van* نگویید.
  nl.a1.unit13.lesson04.teach.choice_question:
    title: پیشنهاد دو گزینه
    gloss: قهوه می‌خواهید یا چای؟
    note: '*Wil je ... of ...?* از طرف مقابل می‌خواهد یکی را انتخاب کند.'
  nl.a1.unit13.lesson04.teach.want_prefer:
    title: گفتن اینکه ترجیح می‌دهید چه بخورید
    gloss: ترجیح می‌دم چای بخورم.
    note: در این الگوی معمولیِ انتخاب، *liever* بعد از *wil* می‌آید.
  nl.a1.unit13.lesson04.teach.have_prefer:
    title: ترجیح دادن یک چیز
    gloss: من پلیور آبی را ترجیح می‌دم.
    note: وقتی یک چیز را به چیز دیگری ترجیح می‌دهید، *Ik heb liever ...* هم طبیعی است.
  nl.a1.unit13.lesson04.teach.liever_note:
    title: Liever گزینهٔ ترجیحی را نشان می‌دهد
    gloss: Liever نشان می‌دهد که شما یک گزینه را به گزینهٔ دیگر ترجیح می‌دهید.
    note: وقتی هر دو گزینه از گفتگو روشن است، می‌شود مقایسه را نگفت.
  nl.a1.unit13.lesson05.teach.message:
    title: خواندنِ چند ترجیح
    gloss: سلام لوته، فیلم به نظرم خوبه، ولی عمر از فیلم خوشش نمیاد. ترجیح می‌ده بره پارک. من پیاده‌روی رو هم دوست دارم.
    note: دقت کنید چه کسی فیلم را دوست دارد، چه کسی فیلم را رد می‌کند و عمر کدام جایگزین را انتخاب می‌کند.
    glosses:
      Hoi: سلام
      vind: دوست داشتن / به نظر رسیدن
      film: فیلم
      leuk: خوب / دلپذیر
      maar: ولی
      houdt: دوست دارد
      films: فیلم‌ها
      wil: می‌خواهد
      liever: ترجیحاً / ترجیح می‌دهد
      park: پارک
      wandelen: پیاده‌روی
  nl.a1.unit13.lesson06.teach.food_question:
    title: لوته دو غذا پیشنهاد می‌دهد
    gloss: 'لوته: عمر، چی می‌خوای بخوری؟ نان می‌خوای یا سوپ گوجه‌فرنگی؟'
    note: سؤال دوم دو گزینه را مطرح می‌کند.
  nl.a1.unit13.lesson06.teach.omar_choice:
    title: عمر سوپ را انتخاب می‌کند
    gloss: 'عمر: ترجیح می‌دم سوپ گوجه‌فرنگی بخورم. سوپ گوجه‌فرنگی بهم می‌چسبه. تو چی؟'
    note: عمر اول با *liever* انتخاب می‌کند، بعد با *lekker* سلیقه‌اش را توضیح می‌دهد.
  nl.a1.unit13.lesson06.teach.lotte_choice:
    title: لوته نان را انتخاب می‌کند
    gloss: 'لوته: من نان رو ترجیح می‌دم. سوپ گوجه‌فرنگی خیلی خوشمزه نیست به نظرم.'
    note: '*Niet zo lekker* نفی را ملایم‌تر می‌کند و در گفتگوی دوستانه طبیعی است.'
  nl.a1.unit13.lesson06.teach.activity:
    title: انتخاب کار بعدی
    gloss: 'عمر: بعد از غذا می‌خوای چی کار کنی؟ لوته: پیاده‌روی رو دوست دارم.'
    note: '*Leuk* فعالیتِ *wandelen* را توصیف می‌کند.'
  nl.a1.unit13.lesson06.teach.plan:
    title: آن‌ها یک ترجیح مشترک دارند
    gloss: 'عمر: منم همین‌طور. عاشق پیاده‌روی‌ام. بریم پارک؟ لوته: فکر خوبیه.'
    note: این به زبان غیررسمیِ برنامه‌ریزی در درس ۱۱ برمی‌گردد.
