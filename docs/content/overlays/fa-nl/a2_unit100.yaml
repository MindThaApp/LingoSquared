course:
  title: هلندی A2
  description: هلندی سطح A2 با تمرکز بر دستور زبان برای توصیف چیزها.
  learning_goal: یک شیء را با اندازه، رنگ، جنس و صاحبش دقیق توصیف کنید و پایانهٔ درست صفت را به کار ببرید.
units:
  nl.a2.unit100.een_mooie_rode_jas:
    title: یک کت قرمز زیبا
    description: 'توصیف اشیا با صفت: چه وقت صفت -e می‌گیرد و چه وقت نمی‌گیرد.'
lessons:
  nl.a2.unit100.lesson01.kleren_en_kleuren:
    title: لباس، رنگ و وسایل
  nl.a2.unit100.lesson02.de_rode_jas_het_rode_huis:
    title: کت قرمز، خانهٔ قرمز
  nl.a2.unit100.lesson03.een_rood_huis_een_rode_jas:
    title: یک خانهٔ قرمز، یک کت قرمز
  nl.a2.unit100.lesson04.groot_oud_van_hout:
    title: بزرگ، قدیمی و چوبی
  nl.a2.unit100.lesson05.noors_bericht:
    title: پیام نور
  nl.a2.unit100.lesson06.jas_kwijt:
    title: لوته کتش را گم کرده است
teaching:
  nl.a2.unit100.lesson01.teach.kleding:
    title: لباس
    gloss: کت / پلیور / شلوار / شال / پیراهن / کفش
    note: واژه‌های لباس از A1 دوباره می‌آیند. همهٔ آن‌ها کلمه‌های *de* هستند. جمع *schoen* می‌شود *schoenen*.
    example_gloss:
    - من یک کت دارم.
    - پلیور آبی است.
    - شلوار بلند است.
    - کفش‌ها سیاه‌اند.
  nl.a2.unit100.lesson01.teach.kleuren:
    title: رنگ‌ها
    gloss: قرمز / آبی / سبز / زرد / سیاه / سفید
    note: واژه‌های رنگ صفت هستند. در این درس یاد می‌گیرید چه وقت پایانه می‌گیرند.
    example_gloss:
    - کت قرمز است.
    - کیف سیاه است.
    - کاغذ سفید است.
  nl.a2.unit100.lesson01.teach.grootte:
    title: سایز
    gloss: بزرگ / کوچک / بلند / کوتاه
    example_gloss:
    - خانه بزرگ است.
    - کلید کوچک است.
    - شال بلند است.
    - پیراهن کوتاه است.
  nl.a2.unit100.lesson01.teach.huis:
    title: در خانه
    gloss: میز / صندلی / لامپ / تخت / خانه / کتاب / کاغذ
    note: 'هر اسم را همراه با *de* یا *het* یاد بگیرید. از این به بعد این برای صفت‌ها مهم است: *bed, huis, boek* و *papier* اسم‌های *het* هستند.'
    example_gloss:
    - میز بزرگ است.
    - تخت کوچک است.
    - کتاب آبی است.
    - لامپ زرد است.
  nl.a2.unit100.lesson01.teach.kwijt:
    title: وسایل گم‌شده
    gloss: کیف / کلید / چتر / کیف پول / گم‌شده
    note: '*Kwijt zijn* یعنی چیزی را گم کرده‌اید و نمی‌دانید کجاست.'
    example_gloss:
    - کیفم را گم کرده‌ام.
    - کلید کوچک است.
    - چتر سبز است.
    - کیف پول قرمز است.
  nl.a2.unit100.lesson01.teach.gn_na_zijn:
    title: بعد از zijn پایانه نمی‌آید
    gloss: کت قرمز است. خانه بزرگ است. کت‌ها قرمزند.
    note: 'بعد از *zijn* صفت همان‌طور که هست می‌ماند و *-e* نمی‌گیرد: *de jas is rood, het huis is groot, de jassen zijn rood*. *-e* فقط وقتی می‌آید که صفت قبل از اسم بیاید.'
  nl.a2.unit100.lesson02.teach.eigenschappen:
    title: صفت‌های بیشتر
    gloss: زیبا / قدیمی / جدید / گرم / نرم
    example_gloss:
    - لامپ زیباست.
    - خانه قدیمی است.
    - پلیور جدید است.
    - شال گرم است.
    - تخت نرم است.
  nl.a2.unit100.lesson02.teach.gn_bepaald:
    title: 'بعد از de یا het: همیشه -e'
    gloss: کت قرمز، کیف بزرگ، پلیور آبی؛ خانهٔ قرمز، تخت بزرگ، کاغذ سفید
    note: 'بعد از *de* یا *het* صفتی که قبل از اسم می‌آید همیشه به *-e* ختم می‌شود، چه برای کلمه‌های *de* و چه برای کلمه‌های *het*: *de rode jas* و *het rode huis*.'
  nl.a2.unit100.lesson02.teach.gn_spelling:
    title: تغییرهای املایی
    gloss: 'قرمز، بزرگ، سفید، زرد: املای آن‌ها قبل از اسم'
    note: 'اضافه کردن *-e* ممکن است املا را عوض کند. مصوت بلندی که دوبار نوشته شده یک حرفش را از دست می‌دهد: *rood → rode, groot → grote, geel → gele*. مصوت کوتاه قبل از یک همخوان پایانی، آن همخوان را دوبار می‌نویسد: *wit → witte*.'
  nl.a2.unit100.lesson02.teach.gn_regelmatig:
    title: بیشتر صفت‌ها فقط -e می‌گیرند
    gloss: آبی، سیاه، سبز، جدید، قدیمی، زیبا، کوچک، بلند، کوتاه، گرم، نرم
    note: بیشتر صفت‌ها فقط *-e* می‌گیرند، بدون هیچ تغییر املایی.
  nl.a2.unit100.lesson02.teach.zinnen:
    title: سه جمله
    gloss: کت قرمز زیباست. کاغذ سفید جدید است. صندلی سبز قدیمی است.
    note: 'صفتی که قبل از اسم می‌آید *-e* می‌گیرد؛ بعد از *is* ساده می‌ماند: *de jas is mooi*.'
  nl.a2.unit100.lesson03.teach.hebben:
    title: داشتن چیزها
    gloss: من یک تخت بزرگ دارم. او یک کیف بزرگ دارد. او کفش قرمز دارد. او یک کتاب آبی دارد.
    note: '*Zij* و *ze* هر دو یعنی «او» (برای زن). به پایانه‌ها دقت کنید: *groot bed* ولی *grote tas*.'
  nl.a2.unit100.lesson03.teach.gn_een:
    title: با een
    gloss: یک کت قرمز، یک کیف بزرگ؛ یک خانهٔ قرمز، یک تخت بزرگ
    note: بعد از *een* کلمهٔ *de* همچنان *-e* می‌گیرد (*een rode jas*)، ولی کلمهٔ *het* پایانه نمی‌گیرد (*een rood huis*). پس *het rode huis* ولی *een rood huis*.
  nl.a2.unit100.lesson03.teach.gn_zonder:
    title: بدون حرف تعریف
    gloss: کاغذ سفید، کاغذ قرمز؛ کت‌های قرمز، خانه‌های قرمز، کیف‌های بزرگ
    note: کلمهٔ *het* مفرد بدون حرف تعریف پایانه نمی‌گیرد (*wit papier*). جمع همیشه *-e* دارد (*rode jassen, rode huizen*)، هر اسمی که باشد.
  nl.a2.unit100.lesson03.teach.gn_contrast:
    title: کلمهٔ het یا کلمهٔ de؟
    gloss: het rode huis ← een rood huis؛ de rode jas ← een rode jas
    note: 'قبل از اسم، فقط در یک حالت صفت *-e* نمی‌گیرد: کلمهٔ مفرد با *het* همراه *een* یا بدون حرف تعریف. در بقیهٔ حالت‌ها صفت به *-e* ختم می‌شود.'
  nl.a2.unit100.lesson04.teach.materiaal:
    title: جنس
    gloss: چوبی / پشمی / نخی / چرمی
    note: برای گفتن جنس چیزی، از *van* و بعد نام ماده استفاده می‌شود.
    example_gloss:
    - میز چوبی است.
    - این پلیور پشمی است.
    - کیف چرمی است.
    - شلوار نخی است.
  nl.a2.unit100.lesson04.teach.bezit:
    title: مالک
    gloss: مال من / مال تو / مال او (مرد) / مال او (زن)
    note: '*Je* و *jouw* هر دو برای یک دوست به معنی «تو/ات» هستند.'
    example_gloss:
    - میز قدیمی من چوبی است.
    - کت جدید شما پشمی است.
    - کتاب کوچک او تازه است.
    - کیف بزرگ او سیاه است.
  nl.a2.unit100.lesson04.teach.gn_bezit:
    title: کلمه‌های مالکیت مثل de یا het رفتار می‌کنند
    gloss: خانهٔ قرمز من، کیف بزرگ او (زن)، کتاب قدیمی او (مرد)، کت جدید تو
    note: 'بعد از *mijn, jouw, je, zijn* و *haar* صفت به *-e* ختم می‌شود، حتی برای کلمه‌های *het*: *mijn rode huis*، *zijn oude boek*.'
  nl.a2.unit100.lesson04.teach.gn_volgorde:
    title: اندازه، رنگ، جنس
    gloss: یک کیف چرمی قرمز بزرگ؛ خانهٔ سفید کوچک
    note: 'وقتی چند صفت پشت هم می‌آیند، هرکدام همین پایانه را می‌گیرد. اندازه قبل از رنگ می‌آید: *een grote rode tas*. جنس بعد از اسم و با *van* می‌آید: *een tas van leer*.'
  nl.a2.unit100.lesson04.teach.zinnen:
    title: دو جمله
    gloss: عمر یک کیف چرمی سیاه بزرگ دارد. پلیور او پشمی است.
  nl.a2.unit100.lesson05.teach.bericht:
    title: نور کیفش را گم کرده
    gloss: سلام لوته، کیفم گم شده! یک کیف چرمی سیاه کوچک است. توی کیف یک کیف پول قرمز و یک کلید هست. کلید خانهٔ من است. شال پشمی زرد بلندم هم گم شده. چتر من سبز و نو است. می‌شود کمکم کنی؟ با مهر، نور
    note: 'به پایانه‌ها دقت کنید: *kleine zwarte tas*، ولی *paraplu is groen*.'
    glosses:
      weg: گم‌شده
      helpen: کمک کردن
      mij: به من
      Groetjes: با مهر
      zit: هست (داخل)
      Ook: همچنین
  nl.a2.unit100.lesson06.teach.vraag:
    title: عمر می‌پرسد چه شده
    gloss: 'عمر: لوته، چی شده؟'
  nl.a2.unit100.lesson06.teach.jas_kwijt:
    title: لوته می‌گوید کتش را گم کرده
    gloss: 'لوته: کتم گم شده.'
  nl.a2.unit100.lesson06.teach.wat_voor:
    title: عمر می‌پرسد چه جور کتی است
    gloss: 'عمر: چه جور کتی است؟'
  nl.a2.unit100.lesson06.teach.beschrijving:
    title: لوته کت را توصیف می‌کند
    gloss: 'لوته: یک کت پشمی سبز بلند.'
  nl.a2.unit100.lesson06.teach.oud_of_nieuw:
    title: عمر می‌پرسد قدیمی است یا جدید
    gloss: 'عمر: کت قدیمی‌ات است یا کت جدیدت؟'
  nl.a2.unit100.lesson06.teach.nieuwe_jas:
    title: لوته می‌گوید کت جدید است
    gloss: 'لوته: کت جدیدم. سبز است و خیلی قشنگ.'
exercises:
