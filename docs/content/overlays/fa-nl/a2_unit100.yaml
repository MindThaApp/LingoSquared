    correct_option: De jas is rood.
    distractors:
    - De jas is blauw.
    - De jas is groot.
    - De tas is rood.
    accepted_answers:
    - value: De jas is rood.
      status: correct
    feedback: '*Rood* یعنی قرمز، *jas* یعنی کت.'
    prompt_blocks:
