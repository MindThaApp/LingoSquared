        right: هوا (وضع هوا)
      - left: zon
        right: خورشید
      - left: morgen
        right: فردا
      - left: vandaag
        right: امروز
      - left: koud
        right: سرد
      - left: warm
        right: گرم
      - left: regenen
        right: باریدن
      - left: schijnen
        right: تابیدن
      status: correct
    feedback: این‌ها کلمه‌های اصلی پیش‌بینی هوا هستند.
    pairs:
    - left: weer
      right: هوا (وضع هوا)
    - left: zon
      right: خورشید
    - left: morgen
      right: فردا
    - left: vandaag
      right: امروز
    - left: koud
      right: سرد
    - left: warm
      right: گرم
    - left: regenen
      right: باریدن
    - left: schijnen
      right: تابیدن
  nl.a2.unit86.lesson01.exercise04.volgorde_koud:
    instruction: کلمه‌ها را مرتب کنید تا بگویید «فردا هوا سرد می‌شود.»
    correct_option: Het zal morgen koud zijn
    accepted_answers:
    - value: Het zal morgen koud zijn
      status: correct
    - value: Morgen zal het koud zijn
      status: correct
    feedback: '*Zal* در جایگاه دوم است و *zijn* آخر جمله. وقتی *Morgen* اول می‌آید، فاعل بعد از *zal* می‌آید.'
  nl.a2.unit86.lesson01.exercise05.vul_zal:
    instruction: با شکل مفرد فعل zullen جای خالی را پر کنید.
    correct_option: zal
    accepted_answers:
    - value: zal
      status: correct
    feedback: '*Het zal morgen regenen.*'
  nl.a2.unit86.lesson01.exercise06.vertaal_warm:
    instruction: با استفاده از zullen به هلندی ترجمه کنید.
    accepted_answers:
    - value: Het zal morgen warm zijn.
      status: correct
    - value: Het zal morgen warm zijn
      status: correct
    - value: Morgen zal het warm zijn.
      status: correct
    - value: Morgen zal het warm zijn
      status: correct
    feedback: '*Het zal morgen warm zijn* یا *Morgen zal het warm zijn*.'
    prompt_blocks:
    - فردا هوا گرم خواهد بود.
  nl.a2.unit86.lesson01.exercise07.schrijf_zon:
    instruction: جملهٔ هلندیِ خواسته‌شده را با zullen بنویسید.
    correct_option: De zon zal morgen schijnen.
    accepted_answers:
    - value: De zon zal morgen schijnen.
      status: correct
    - value: De zon zal morgen schijnen
      status: correct
    - value: Morgen zal de zon schijnen.
      status: correct
    - value: Morgen zal de zon schijnen
      status: correct
    feedback: '*De zon zal morgen schijnen.*'
    prompt_blocks:
    - 'به هلندی بنویسید: فردا آفتاب می‌تابد.'
  nl.a2.unit86.lesson02.exercise01.kies_helpen:
    instruction: جملهٔ هلندی درست را انتخاب کنید.
    correct_option: Ik zal je helpen.
    distractors:
    - Ik zal je bellen.
    - Ik zal het doen.
    - Ik zal het niet vergeten.
    accepted_answers:
    - value: Ik zal je helpen.
      status: correct
    feedback: '*Ik zal je helpen* = کمکت می‌کنم.'
    prompt_blocks:
    - من کمکت می‌کنم.
  nl.a2.unit86.lesson02.exercise02.kies_vergeten:
    instruction: جملهٔ هلندی درست را انتخاب کنید.
    correct_option: Ik zal het niet vergeten.
    distractors:
    - Ik zal het vergeten.
    - Ik zal het doen.
    - Ik zal op tijd komen.
    accepted_answers:
    - value: Ik zal het niet vergeten.
      status: correct
    feedback: '*Niet* قبل از مصدرِ پایانی می‌آید.'
    prompt_blocks:
    - من فراموشش نمی‌کنم.
  nl.a2.unit86.lesson02.exercise03.beloftes:
    instruction: هر قول هلندی را به معنی فارسی‌اش وصل کنید.
    accepted_answers:
    - value:
      - left: Ik zal je helpen
        right: من به شما کمک می‌کنم
      - left: Ik zal je bellen
        right: من به شما زنگ می‌زنم
      - left: Ik zal het doen
        right: من انجامش می‌دهم
      - left: Ik zal het niet vergeten
        right: من فراموشش نمی‌کنم
      - left: Ik zal op tijd komen
        right: من سر وقت می‌آیم
      - left: Ik beloof het
        right: قول می‌دهم
      status: correct
