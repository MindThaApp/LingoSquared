course:
  title: هلندی A2
  description: هلندی A2 با تمرکز بر دستور زبان برای پیش‌بینی و قول دادن.
  learning_goal: با zullen پیش‌بینی کنید چه اتفاقی می‌افتد و قول بدهید، آن را با gaan مقایسه کنید و با misschien تردید را بیان کنید.
units:
  nl.a2.unit86.voorspellingen_en_beloftes:
    title: پیش‌بینی‌ها و قول‌ها
    description: پیش‌بینی هوا را بگویید، قول بدهید و بگویید چه اتفاقی ممکن است بیفتد.
lessons:
  nl.a2.unit86.lesson01.het_weer_van_morgen:
    title: هوای فردا
  nl.a2.unit86.lesson02.ik_zal_het_doen:
    title: من انجامش می‌دهم
  nl.a2.unit86.lesson03.zullen_of_gaan:
    title: zullen یا gaan؟
  nl.a2.unit86.lesson04.misschien:
    title: شاید
  nl.a2.unit86.lesson05.bericht_en_mededeling:
    title: یک پیام و یک اطلاعیه
  nl.a2.unit86.lesson06.lotte_en_omar_beloven:
    title: لوته و عمر قول می‌دهند
teaching:
  nl.a2.unit86.lesson01.teach.weer:
    title: آب‌وهوا
    gloss: هوا / خورشید / فردا / امروز / سرد / گرم
    note: این واژه‌ها هوا و روز را توصیف می‌کنند.
    example_gloss:
    - امروز هوا گرم است.
    - خورشید دارد می‌تابد.
    - فردا هوا سرد است.
  nl.a2.unit86.lesson01.teach.werkwoorden:
    title: فعل‌های هوا
    gloss: باریدن / تابیدن / بودن
    note: '*Regent* و *schijnt* شکل‌های زمان حال برای امروز هستند. این درس آینده را اضافه می‌کند.'
    example_gloss:
    - امروز باران می‌بارد.
    - امروز خورشید می‌تابد.
    - هوا گرمه.
  nl.a2.unit86.lesson01.teach.verwachting:
    title: پیش‌بینی هوا
    gloss: پیش‌بینی هوا / طبق
    note: '*Volgens* منبع یک پیش‌بینی را معرفی می‌کند.'
    example_gloss:
    - پیش‌بینی هوا خوب است.
    - طبق پیش‌بینی هوا، فردا هوا گرم است.
  nl.a2.unit86.lesson01.teach.gn_zullen_vormen:
    title: 'Zullen: شکل‌های فعل'
    gloss: من خواهم … / تو خواهی … / او خواهد … / ما، آن‌ها خواهیم، خواهند …
    note: '*Zullen* فعل پیش‌بینی و قول است. شکل مفرد *zal* است (با *jij/je* شکل *zult* هم هست) و شکل جمع *zullen* است. در گفتار کوتاه‌شده: *we, ze, je*.'
  nl.a2.unit86.lesson01.teach.gn_zullen_zin:
    title: Zullen + مصدر
    gloss: فردا باران خواهد بارید. فردا باران خواهد بارید.
    note: '*Zal* فعل صرف‌شده است و در جایگاه دوم جمله می‌ماند؛ مصدر در آخر جمله می‌آید. اگر قید زمان اول بیاید، فاعل بعد از *zal* می‌آید: *Morgen zal het regenen*. برای پیش‌بینی از *zullen* استفاده کنید.'
  nl.a2.unit86.lesson01.teach.zinnen:
    title: جمله‌های پیش‌بینی
    gloss: طبق پیش‌بینی هوا، فردا خورشید خواهد تابید. هوا سرد خواهد بود.
  nl.a2.unit86.lesson02.teach.beloftes:
    title: واژه‌های قول
    gloss: قول دادن / قول / انجام دادن / کمک کردن / زنگ زدن
    note: این فعل‌ها در قول دادن رایج هستند.
    example_gloss:
    - قول می‌دهم.
    - این یک قول است.
    - می‌توانم به شما کمک کنم.
    - به من زنگ می‌زنید؟
  nl.a2.unit86.lesson02.teach.afspraken:
    title: تعهدها
    gloss: سر وقت / حتماً / فراموش کردن / آمدن / نه، نیست (نفی)
    note: '*Op tijd* یعنی سر وقت، نه دیر.'
    example_gloss:
    - او سر وقت می‌آید.
    - من آن را فراموش نکرده‌ام.
    - من حتماً این کار را انجام می‌دهم.
  nl.a2.unit86.lesson02.teach.gn_belofte:
    title: Zullen برای قول
    gloss: انجامش می‌دهم. به شما کمک می‌کنم. به شما زنگ می‌زنم.
    note: با *ik*، فعل *zal* می‌تواند قول یا تعهدی قاطع بسازد. مصدر (*doen, helpen, bellen*) در آخر جمله می‌آید.
  nl.a2.unit86.lesson02.teach.gn_niet:
    title: Niet و op tijd
    gloss: فراموشش نمی‌کنم. سر وقت می‌آیم.
    note: '*Niet* معمولاً بعد از *het* و پیش از مصدر پایانی می‌آید: *het niet vergeten*. عبارتی مثل *op tijd* هم پیش از مصدر پایانی می‌آید.'
  nl.a2.unit86.lesson02.teach.zinnen:
    title: جمله‌های قول
    gloss: ما سر وقت می‌آییم. من حتماً انجامش می‌دهم.
  nl.a2.unit86.lesson03.teach.signalen:
    title: نشانه‌ها و برنامه‌ها
    gloss: ببین / ابر / تیره / امشب / کار کردن / آشپزی کردن
    note: '*Kijk* توجه را به چیزی که می‌بینید جلب می‌کند.'
    example_gloss:
    - ببین، ابرها تیره‌اند.
    - عمر امروز کار می‌کند.
    - می‌خواهم امشب آشپزی کنم.
  nl.a2.unit86.lesson03.teach.gn_gaan_plan:
    title: Gaan برای برنامه
    gloss: من فردا می‌خواهم کار کنم. عمر امشب می‌خواهد آشپزی کند.
    note: '*Gaan* + مصدر می‌گوید کسی برنامه دارد چه کاری انجام بدهد. مصدر در آخر جمله است.'
  nl.a2.unit86.lesson03.teach.gn_gaan_zicht:
    title: Gaan برای چیزی که می‌بینید
    gloss: ببین، ابرها تیره‌اند. دارد باران می‌گیرد.
    note: 'وقتی نشانه را همین الان می‌بینید از *gaan* استفاده کنید: ابرهای تیره، پس *Het gaat regenen*.'
  nl.a2.unit86.lesson03.teach.gn_contrast:
    title: Zullen در برابر gaan
    gloss: فردا باران خواهد بارید (پیش‌بینی). ببین، دارد باران می‌گیرد (می‌بینم). فردا می‌خواهم کار کنم (برنامه). انجامش می‌دهم (قول).
    note: 'در این درس: *zullen* برای پیش‌بینی یا قول، و *gaan* برای برنامه یا چیزی که نشانه‌اش را می‌بینید. در گفتار روزمره *gaan* برای پیش‌بینی و حتی قول هم رایج است (*Ik ga het doen*)؛ *zullen* بیشتر در پیش‌بینی‌ها، اطلاعیه‌ها و قول‌های رسمی می‌آید.'
  nl.a2.unit86.lesson03.teach.zinnen:
    title: جمله‌های gaan
    gloss: ببین، دارد باران می‌گیرد. من فردا می‌خواهم کار کنم.
  nl.a2.unit86.lesson04.teach.misschien_woorden:
    title: شاید و دیر
    gloss: شاید / بعداً / دیر / خیلی دیر
    note: '*Misschien* نشان می‌دهد که مطمئن نیستید.'
    example_gloss:
    - شاید بعداً بیایم.
    - دیر شده است.
    - اتوبوس دیر کرده است.
  nl.a2.unit86.lesson04.teach.week:
    title: کار و قرار ملاقات
    gloss: قرار ملاقات / کار / همکار / دوشنبه / جمعه / شنبه
    note: در هلندی نام روزهای هفته با حرف کوچک نوشته می‌شود، مثل maandag و vrijdag.
    example_gloss:
    - لوته جمعه قرار ملاقات دارد.
    - عمر دوشنبه کار دارد.
    - نور شنبه کار می‌کند.
  nl.a2.unit86.lesson04.teach.gn_misschien_voorop:
    title: اول «شاید»
    gloss: شاید نور فردا بیاید. شاید باران بیاید.
    note: 'وقتی *misschien* اول جمله می‌آید، فعل درست بعد از آن می‌آید و فاعل بعد از فعل: *komt Noor*، *regent het*. فاعل را قبل از فعل نگذارید.'
  nl.a2.unit86.lesson04.teach.gn_misschien_midden:
    title: «شاید» بعد از فعل
    gloss: نور شاید فردا بیاید. شاید باران بیاید.
    note: '*Misschien* می‌تواند بعد از فعل هم بیاید. فعل همچنان در جایگاه دوم می‌ماند و معنی فرقی نمی‌کند.'
  nl.a2.unit86.lesson04.teach.gn_zeker:
    title: «حتماً» یا «شاید»
    gloss: حتماً باران می‌آید. شاید باران بیاید.
    note: '*Zeker* نشان می‌دهد که مطمئن هستید و *misschien* نشان می‌دهد که مطمئن نیستید. هر دو با *zal* به کار می‌روند.'
  nl.a2.unit86.lesson04.teach.zinnen:
    title: جمله‌های با «شاید»
    gloss: شاید دیر برسم. شاید عمر وقت داشته باشد. شاید هوا سرد باشد.
  nl.a2.unit86.lesson05.teach.bericht_woorden:
    title: کلمه‌های پیام
    gloss: ماندن / خریدن / قهوه / بیسکویت / هم، همچنین / پس، آن موقع / تا / در خانه
    note: '*Tot zaterdag* یعنی شنبه می‌بینمت.'
    example_gloss:
    - من در خانه می‌مانم.
    - می‌خواهم قهوه بخرم.
    - فردا می‌بینمت!
  nl.a2.unit86.lesson05.teach.mededeling_woorden:
    title: کلمه‌های اطلاعیه
    gloss: اطلاعیه / جلسه / ساعت نه / همه / آنجا
    note: '*Om negen uur* ساعت را می‌گوید. *Er zal koffie zijn* یعنی قهوه خواهد بود.'
    example_gloss:
    - این یک اطلاعیه است.
    - جلسه امروز است.
    - همه آنجا هستند.
  nl.a2.unit86.lesson05.teach.gn_weerbericht:
    title: سبک پیش‌بینی هوا
    gloss: صبح خورشید می‌تابد. بعدازظهر باران می‌آید.
    note: در پیش‌بینی هوا و اطلاعیه‌ها اغلب از *zullen* استفاده می‌شود. وقتی عبارت زمان اول جمله می‌آید، *zal* بعد از آن می‌آید و فاعل بعد از zal.
  nl.a2.unit86.lesson05.teach.lezen_bericht:
    title: پیام نور
    gloss: سلام لوته و عمر، طبق پیش‌بینی هوا شنبه باران می‌آید. شاید آن روز در خانه بمانیم. من قهوه و بیسکویت می‌خرم. من هم به‌موقع می‌آیم. شنبه می‌بینمتان! نور
    note: پیش‌بینی، برنامهٔ نامطمئن و قول‌ها را پیدا کنید.
    glosses:
      volgens: طبق
      weersverwachting: پیش‌بینی هوا
      blijven: ماندن
      koffie: قهوه
      koekjes: کلوچه
      kopen: می‌خرند
      tot: تا / به امید دیدار
  nl.a2.unit86.lesson05.teach.lezen_mededeling:
    title: یک اطلاعیه
    gloss: اطلاعیه. فردا جلسه ساعت نه شروع می‌شود. همه به‌موقع می‌آیند. قهوه هم هست.
    note: اطلاعیه می‌گوید چه اتفاقی خواهد افتاد.
    glosses:
      vergadering: جلسه
      negen: نُه
      uur: ساعت
      iedereen: همه
      koffie: قهوه
  nl.a2.unit86.lesson06.teach.lotte1:
    title: لوته دربارهٔ شنبه می‌پرسد
    gloss: 'لوته: سلام عمر، شنبه کار می‌کنی؟'
  nl.a2.unit86.lesson06.teach.omar1:
    title: عمر مطمئن نیست
    gloss: 'عمر: شاید شنبه کار کنم. بهت زنگ می‌زنم.'
  nl.a2.unit86.lesson06.teach.lotte2:
    title: لوته پیش‌بینی هوا را می‌گوید
    gloss: 'لوته: طبق پیش‌بینی هوا شنبه باران می‌آید.'
  nl.a2.unit86.lesson06.teach.omar2:
    title: عمر برنامه می‌ریزد
    gloss: 'عمر: پس شاید در خانه بمانم. می‌خواهم آشپزی کنم.'
  nl.a2.unit86.lesson06.teach.lotte3:
    title: لوته پیشنهاد می‌دهد بیسکویت بخرد
    gloss: 'لوته: عالیه! من بیسکویت می‌خرم.'
  nl.a2.unit86.lesson06.teach.omar3:
    title: عمر قول می‌خواهد
    gloss: 'عمر: قول می‌دهی؟'
  nl.a2.unit86.lesson06.teach.lotte4:
    title: لوته قول می‌دهد
    gloss: 'لوته: قول می‌دهم.'
exercises:
  nl.a2.unit86.lesson01.exercise01.kies_regenen:
    instruction: جملهٔ هلندی درست را انتخاب کنید.
    correct_option: Het zal morgen regenen.
    distractors:
    - Het regent vandaag.
    - Het zal morgen koud zijn.
    - De zon schijnt vandaag.
    accepted_answers:
    - value: Het zal morgen regenen.
      status: correct
    feedback: '*Het zal morgen regenen* = فردا باران می‌آید.'
    prompt_blocks:
    - فردا باران می‌بارد.
  nl.a2.unit86.lesson01.exercise02.kies_zon:
    instruction: جملهٔ هلندی درست را انتخاب کنید.
    correct_option: De zon zal schijnen.
    distractors:
    - De zon schijnt vandaag.
    - Het zal koud zijn.
    - Het zal morgen regenen.
    accepted_answers:
    - value: De zon zal schijnen.
      status: correct
    feedback: '*De zon zal schijnen* = خورشید می‌تابد.'
    prompt_blocks:
    - آفتاب می‌تابد.
  nl.a2.unit86.lesson01.exercise03.woordenschat:
    instruction: هر کلمهٔ هلندی را به معنی فارسی‌اش وصل کنید.
