  nl.a1.unit19.lesson01.teach.wat_voor_weer:
    title: پرسیدن درباره‌ی هوا
    gloss: هوا چطوره؟
    note: '*Wat voor* + اسم یعنی «چه جور…»؛ یک سؤال عمومی و بسیار رایج.'
  nl.a1.unit19.lesson01.teach.zonnig:
    title: آفتابی
    gloss: هوا آفتابیه.
    note: '*Het is* + صفتِ هوا الگوی استاندارد است و *het* در آن بی‌شخص است.'
  nl.a1.unit19.lesson01.teach.regent:
    title: بارانی
    gloss: باران می‌آد.
    note: 'فعل *regenen* (باریدن) بی‌شخص به کار می‌رود: *het regent*، بدون نیاز به صفت جدا.'
  nl.a1.unit19.lesson01.teach.bewolkt:
    title: ابری
    gloss: هوا ابریه.
    note: از همان الگوی *het is* + صفت پیروی می‌کند، مثل *zonnig*.
  nl.a1.unit19.lesson02.teach.koud:
    title: سرد
    gloss: امروز هوا سرده.
    note: '*Vandaag* (امروز) توصیف هوا را به زمان مشخصی وصل می‌کند.'
  nl.a1.unit19.lesson02.teach.warm:
    title: Warm
    gloss: امروز هوا گرمه.
    note: '*Warm* در صحبت‌های روزمرهٔ هلندی دربارهٔ هوا هم «گرم» را پوشش می‌دهد و هم «داغ» را.'
  nl.a1.unit19.lesson02.teach.niet_koud:
    title: مقایسه‌ی دما
    gloss: هوا سرد نیست، گرمه.
    note: '*Niet* درست پیش از صفتِ *koud* می‌آید و آن را منفی می‌کند.'
  nl.a1.unit19.lesson03.teach.weerbericht:
    title: پیش‌بینی هوا
    gloss: پیش‌بینی هوا
    note: 'اسمی خنثی: *het weerbericht*، ترکیبی از *weer* (هوا) و *bericht* (گزارش).'
    example_gloss: پیش‌بینی هوا چیه؟
  nl.a1.unit19.lesson03.teach.morgen_zonnig:
    title: هوای فردا
    gloss: فردا هوا آفتابیه.
    note: '*Morgen* (فردا) اول جمله می‌آید، برای همین بعد از آن *is het* جابه‌جا می‌شود.'
  nl.a1.unit19.lesson03.teach.zaterdag_zondag:
    title: پیش‌بینی دو روز
    gloss: شنبه هوا آفتابی و گرمه، ولی یکشنبه تمام روز بارون می‌آد.
    note: '*De hele dag* (تمام روز) بر طولانی بودن بارش تأکید می‌کند.'
  nl.a1.unit19.lesson04.teach.wandeling:
    title: قدم‌زدن
    gloss: قدم‌زدن
    note: 'اسمی با حرف تعریف de: *de wandeling*.'
    example_gloss: بریم قدم بزنیم؟
  nl.a1.unit19.lesson04.teach.zullen_we_wandeling:
    title: پیشنهاد پیاده‌روی
    gloss: بریم قدم بزنیم؟
    note: '*Zullen we...?* همان الگوی پیشنهاد برنامه در واحد ۱۱ است؛ *een wandeling maken* (تحت‌اللفظی «یک قدم‌زدن ساختن») عبارت ثابت برای «پیاده‌روی رفتن» است.'
  nl.a1.unit19.lesson04.teach.binnen_blijven:
    title: برنامه‌ای مشروط
    gloss: اگه بارون بیاد، تو خونه می‌مونیم.
    note: '*Als* (اگر) شرط را می‌آورد؛ چون جملهٔ شرطی اول آمده، در جملهٔ اصلی یعنی *blijven we binnen* فعل و فاعل جابه‌جا شده‌اند.'
  nl.a1.unit19.lesson04.teach.goed_idee_laten:
    title: موافقت و پیشنهاد
    gloss: فکر خوبیه! بریم قدم بزنیم.
    note: '*Laten we...* (بیایید...) راه رایج دیگری برای پیشنهاد یک کار است، در کنار *Zullen we...?* از واحد ۱۱.'
  nl.a1.unit19.lesson05.teach.weerbericht_tekst:
    title: خواندن پیش‌بینی دو روز
    gloss: 'پیش‌بینی هوا: شنبه هوا آفتابی و گرمه. یکشنبه تمام روز بارون می‌آد.'
    note: دقت کنید کدام روز چه وضعیتی دارد.
    glosses:
      Weerbericht: پیش‌بینی هوا
      zaterdag: شنبه
      zonnig: آفتابی
      warm: گرم
      Zondag: یکشنبه
      regent: باران می‌آید
      hele: تمام
      dag: روز
  nl.a1.unit19.lesson06.teach.lotte_ask_weather:
    title: Lotte دربارهٔ آخر هفته می‌پرسد
    gloss: 'Lotte: این آخر هفته هوا چطوره؟'
    note: '*Dit weekend* (این آخر هفته) سؤال را در آیندهٔ نزدیک قرار می‌دهد.'
  nl.a1.unit19.lesson06.teach.omar_forecast:
    title: Omar پیش‌بینی هوا را می‌گوید
    gloss: 'Omar: شنبه آفتابی و گرمه، ولی یکشنبه تمام روز بارون می‌باره.'
    note: دقیقاً همان پیش‌بینی‌ای است که در درس خواندیم.
  nl.a1.unit19.lesson06.teach.lotte_suggest_walk:
    title: Lotte یک برنامه پیشنهاد می‌کند
    gloss: 'Lotte: پس شنبه بریم پیاده‌روی؟'
    note: '*Dan* (پس) پیشنهاد را مستقیم به هوای خوبی که Omar گفت وصل می‌کند.'
  nl.a1.unit19.lesson06.teach.omar_agree:
    title: Omar موافقت می‌کند و برای یکشنبه برنامه می‌ریزد
    gloss: 'Omar: فکر خوبیه. یکشنبه هم خوش و خرم تو خونه می‌مونیم.'
    note: '*Lekker* اینجا یک کلمهٔ تکیه‌ای است، تقریباً به معنی «خوش و خرم»، که پیش از صفت یا فعل می‌آید تا جذاب‌تر به نظر برسد.'
  nl.a1.unit19.lesson06.teach.lotte_closing:
    title: Lotte برنامه را نهایی می‌کند
    gloss: 'Lotte: عالیه، پس فیلم تماشا می‌کنیم.'
    note: '*Kijken* (تماشا کردن) به‌طور طبیعی با *een film* (یک فیلم) می‌آید.'
