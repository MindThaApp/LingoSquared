  nl.a2.unit76.lesson01.teach.rooster:
    title: برنامه‌ی سینما
    gloss: برنامه‌ی کاری/زمان‌بندی
    note: '*Het rooster* اسمی خنثی (het) است و برای برنامه‌ی کاری یا جدول زمانی کلاس‌ها به کار می‌رود.'
