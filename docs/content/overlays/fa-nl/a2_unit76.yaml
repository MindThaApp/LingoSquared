    gloss: در آخر برای شام چیزی می‌پزم.
    note: '*Ten slotte* (در آخر) ترتیبی را که با *eerst* شروع و با *daarna* ادامه پیدا کرده، تمام می‌کند.'
  nl.a2.unit76.lesson03.teach.doordeweekse_dag:
