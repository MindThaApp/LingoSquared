    note: '*De doordeweekse dag* گروه اسمی با حرف تعریف de است و در برابر *het weekend* قرار می‌گیرد.'
    example_gloss: در روزهای کاری هفته زود بلند می‌شوم.
  nl.a2.unit76.lesson03.teach.vroeg_op_uitslapen:
    title: مقایسه‌ی روزهای کاری و آخر هفته
    gloss: در طول هفته زود بلند می‌شوم، ولی آخر هفته تا دیروقت می‌خوابم.
    note: '*Uitslapen* (تا دیروقت خوابیدن) فعلی جداشدنی است؛ *uit* در جمله به آخر می‌رود.'
  nl.a2.unit76.lesson03.teach.wat_is_verschil:
