    gloss: تفاوت روزهای کاری هفته‌ی شما با آخر هفته چیست؟
    note: '*Het verschil tussen ... en ...* (تفاوت بین ... و ...) قالب معمول برای مقایسه است.'
  nl.a2.unit76.lesson04.teach.agenda:
