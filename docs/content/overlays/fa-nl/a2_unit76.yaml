  nl.a2.unit76.lesson05.teach.ninas_week:
    title: خواندن درباره‌ی هفته‌ی شلوغ نینا
    gloss: هفته‌ی نینا شلوغ به نظر می‌رسد. دوشنبه و سه‌شنبه در کتابخانه کار می‌کند. چهارشنبه شب کلاس زبان دارد. پنجشنبه با دوستانش ورزش می‌کند و جمعه برای خانواده‌اش غذا می‌پزد. آخر هفته استراحت می‌کند و کتاب می‌خواند.
    note: '*Ziet er druk uit* (شلوغ به نظر می‌رسد) از فعل *eruitzien* (به نظر رسیدن) ساخته شده که جداشدنی است؛ *er ... uit* توصیف را در بر می‌گیرد.'
    glosses:
      ziet: به نظر می‌رسد (سوم شخص مفرد zien؛ بخشی از ziet ... uit)
      druk: شلوغ
      uit: پیشوند جداشدنی در اینجا (ziet...uit = به نظر می‌رسد؛ rust...uit = استراحت می‌کند)
      maandag: دوشنبه
      dinsdag: سه‌شنبه
      werkt: کار می‌کند (سوم شخص مفرد werken)
      bibliotheek: کتابخانه
      woensdagavond: چهارشنبه شب
      heeft: دارد (سوم شخص مفرد hebben)
      taalcursus: کلاس زبان
      donderdag: پنجشنبه
      sport: ورزش می‌کند (سوم شخص مفرد sporten)
      vrienden: دوستان
      vrijdag: جمعه
      kookt: غذا می‌پزد (سوم شخص مفرد koken)
      haar: 'او (مالکیت: ـش)'
      familie: خانواده
      weekend: آخر هفته
      rust: استراحت می‌کند (سوم شخص مفرد rusten)
      leest: می‌خواند (سوم شخص مفرد lezen)
      boek: کتاب
