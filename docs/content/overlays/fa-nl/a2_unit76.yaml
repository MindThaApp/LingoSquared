    gloss: دوشنبه‌ها کار می‌کنم و چهارشنبه‌ها کلاس دارم.
    note: در هلندی برای گفتن «در» یک روز مشخص هفته، معمولاً *op* را قبل از نام روز می‌آورند.
  nl.a2.unit76.lesson01.teach.wat_doe_je:
    title: پرسیدن این که کسی معمولاً در طول هفته چه کار می‌کند
    gloss: شما معمولاً در طول هفته چه کار می‌کنید؟
    note: '*Door de week* (در طول هفته، یعنی روزهای کاری هفته) به مجموعه‌ی روزهای کاری اشاره دارد و در برابر *het weekend* قرار می‌گیرد.'
  nl.a2.unit76.lesson02.teach.volgorde:
    title: ترتیب
    gloss: ترتیب
    note: '*De volgorde* اسمی با حرف تعریف de است و برای ترتیب اتفاق‌ها به کار می‌رود.'
    example_gloss: ترتیب کارهای روزم همیشه یکسان است.
  nl.a2.unit76.lesson02.teach.eerst_daarna:
    title: ترتیب دادن با eerst و daarna
    gloss: اول کار می‌کنم، بعد می‌روم ورزش.
    note: '*Eerst* (اول) و *daarna* (بعد از آن) دو واژه‌ی پیوندی رایج برای نشان دادن ترتیب در هلندی هستند.'
  nl.a2.unit76.lesson02.teach.ten_slotte:
