teaching:
  nl.a1.unit14.lesson01.teach.comparative_rule:
    title: ساختن صفت تفضیلی
    gloss: در مقایسه‌ها معمولاً به صفت -er اضافه می‌کنید و از dan استفاده می‌کنید.
    note: '*Dan* در جمله‌های مقایسه‌ای معادل «از» است و همیشه بعد از صفت تفضیلی می‌آید.'
  nl.a1.unit14.lesson01.teach.groot_klein:
    title: بزرگ، کوچک
    gloss: بزرگ، کوچک
    note: '*Groot* و *klein* صفت‌های پایه‌اند، پیش از اضافه شدن -er.'
    example_gloss:
    - کوله‌پشتی بزرگ است.
    - کیف کوچک است.
  nl.a1.unit14.lesson01.teach.rugzak_groter:
    title: کوله‌پشتی بزرگ‌تر است
    gloss: کوله‌پشتی از کیف بزرگ‌تر است.
    note: '*Groter* همان *groot* + *er* است؛ *dan* مورد دوم مقایسه را معرفی می‌کند.'
  nl.a1.unit14.lesson01.teach.tas_kleiner:
    title: کیف کوچک‌تر است
    gloss: کیف از کوله‌پشتی کوچک‌تر است.
    note: '*Kleiner* همان *klein* + *er* است، با همان الگو.'
  nl.a1.unit14.lesson02.teach.rugzak_price:
    title: قیمت کوله‌پشتی
    gloss: کوله‌پشتی چهل‌وپنج یورو قیمت دارد.
    note: '*Kost* سوم شخص مفرد فعل *kosten* به معنی «قیمت داشتن» است.'
  nl.a1.unit14.lesson02.teach.tas_price:
    title: قیمت کیف
    gloss: کیف بیست یورو قیمت دارد.
    note: قیمتی پایین‌تر از کوله‌پشتی، زمینه‌ای برای مقایسه‌ی بعدی.
  nl.a1.unit14.lesson02.teach.duur_goedkoop:
    title: گران، ارزان
    gloss: گران، ارزان
    note: '*Duur* و *goedkoop* صفت‌های پایه‌اند، پیش از اضافه شدن *-der*/*-er*.'
    example_gloss:
    - کوله‌پشتی گران است.
    - کیف ارزان است.
  nl.a1.unit14.lesson02.teach.rugzak_duurder:
    title: کوله‌پشتی گران‌تر است
    gloss: کوله‌پشتی از کیف گران‌تر است.
    note: '*Duurder* از *duur* + *der* ساخته می‌شود. وقتی صفت از قبل به «ر» ختم شده باشد، در هلندی به‌جای *-er* پسوند *-der* اضافه می‌شود.'
  nl.a1.unit14.lesson02.teach.tas_goedkoper:
    title: کیف ارزان‌تر است
    gloss: کیف از کوله‌پشتی ارزان‌تر است.
    note: '*Goedkoper* همان *goedkoop* + *er* است، قرینه‌ی جمله‌ی قبلی.'
  nl.a1.unit14.lesson03.teach.equality_rule:
    title: مقایسه‌ی برابر
    gloss: برای برابر دانستن دو چیز، net zo و بعد صفت و بعد als را به کار ببرید.
    note: این الگو در هلندی معادل ساختار «به‌اندازه‌ی ... » در فارسی است.
  nl.a1.unit14.lesson03.teach.mooi:
    title: به همان اندازه قشنگ
    gloss: این کوله‌پشتی به‌اندازه‌ی آن کیف قشنگ است.
    note: '*Mooi* (قشنگ، زیبا) بدون تغییر بین *net zo* و *als* می‌آید و در این الگو پسوند -er نمی‌گیرد.'
  nl.a1.unit14.lesson03.teach.praktisch:
    title: به همان اندازه کاربردی
    gloss: کوله‌پشتی به‌اندازه‌ی کیف کاربردی است.
    note: هر صفت ساده‌ای می‌تواند جای خالی *net zo ... als* را پر کند.
  nl.a1.unit14.lesson04.teach.superlative_rule:
    title: ساختن صفت عالی
    gloss: برای صفت عالی معمولاً het و بعد صفت و بعد st را به کار می‌برید.
    note: این شکل خبری (بعد از *is*) صرف‌نظر از جنس اسم، *het* می‌گیرد.
  nl.a1.unit14.lesson04.teach.duurst:
    title: گران‌ترین از بین دو تا
    gloss: از بین این دو تا، کوله‌پشتی گران‌تر است.
    note: '*Duurst* از *duur* + *st* ساخته می‌شود. در هلندی حتی وقتی فقط دو گزینه را مقایسه می‌کنید هم می‌شود از صفت عالی استفاده کرد.'
  nl.a1.unit14.lesson04.teach.irregular_rule:
    title: 'بی‌قاعده: goed, beter, best'
    gloss: 'Goed, beter, best بی‌قاعده‌اند: این بهترین انتخاب است. Veel, meer, meest هم به همین شکل کار می‌کند.'
    note: هیچ‌کدام از این دو زنجیره (*goed/beter/best* و *veel/meer/meest*) از الگوی منظم -er/-st پیروی نمی‌کنند.
  nl.a1.unit14.lesson04.teach.beste_keuze:
    title: بهترین انتخاب برای سفر
    gloss: این کوله‌پشتی بهترین انتخاب برای یک سفر طولانی با قطار است.
    note: '*Beste* شکل پیش از اسم است و پسوند -e می‌گیرد؛ صفت‌های هلندی معمولاً پیش از اسم این پسوند را می‌گیرند.'
  nl.a1.unit14.lesson04.teach.meer_ruimte:
    title: جای بیشتر
    gloss: کوله‌پشتی از کیف جای بیشتری دارد.
    note: '*Meer* صورت تفضیلی بی‌قاعده‌ی *veel* (زیاد) است.'
  nl.a1.unit14.lesson05.teach.advertentie:
    title: خواندن یک آگهی فروشگاه
    gloss: 'کوله‌پشتی Bergsport: چهل‌وپنج یورو. این کوله‌پشتی بزرگ و محکم است. کیف دوشی Stad: بیست یورو. این کیف از کوله‌پشتی کوچک‌تر و سبک‌تر است، ولی کم‌دوام‌تر. برای یک سفر طولانی، کوله‌پشتی بهترین انتخاب است، چون محکم‌تر است و جای بیشتری دارد.'
    note: قیمت و اندازه‌ی دو محصول را دنبال کنید و ببینید آگهی کدام را پیشنهاد می‌کند و چرا.
    glosses:
      Rugzak: کوله‌پشتی
      vijfenveertig: چهل‌وپنج
      euro: یورو
      groot: بزرگ
      sterk: قوی
      Schoudertas: کیف دوشی
      twintig: بیست
      tas: کیف
      kleiner: کوچک‌تر
      lichter: سبک‌تر
      minder: کمتر
      lange: بلند
      reis: سفر
      beste: بهترین
      keuze: انتخاب
      sterker: قوی‌تر
      ruimte: جا / فضا
  nl.a1.unit14.lesson06.teach.lotte_open:
    title: لوته اندازه را نشان می‌دهد
    gloss: 'لوته: ببین، این کوله‌پشتی از اون کیف بزرگ‌تره.'
    note: '*Kijk* (ببین) راهی رایج برای جلب توجه کسی به چیزی است.'
  nl.a1.unit14.lesson06.teach.omar_room:
    title: عمر توضیح می‌دهد چرا به آن نیاز دارد
    gloss: 'عمر: آره، و جای بیشتری هم داره. برای سفر با قطار یه کیف بزرگ لازم دارم.'
    note: '*Nodig hebben* (نیاز داشتن) یک ترکیب ثابت است؛ چیزی که به آن نیاز دارید بین *hebben* و *nodig* می‌آید.'
  nl.a1.unit14.lesson06.teach.lotte_best_choice:
    title: لوته انتخاب را تأیید می‌کند
    gloss: 'لوته: پس کوله‌پشتی بهترین انتخاب برای توئه.'
    note: '*Dan* در اینجا یعنی «در آن صورت»، نه *dan* مقایسه‌ای که قبلاً دیدید؛ املای هر دو یکی است.'
  nl.a1.unit14.lesson06.teach.omar_question:
    title: عمر نظر لوته را می‌پرسد
    gloss: 'عمر: دقیقاً. به نظر تو کدوم کیف از همه قشنگ‌تره؟'
    note: '*Vind jij het mooist* از همان الگوی بیان نظر در درس‌های *vinden* در واحد 13 استفاده می‌کند.'
  nl.a1.unit14.lesson06.teach.lotte_choice:
    title: لوته کیف دوشی را انتخاب می‌کند
    gloss: 'لوته: به نظر من این کیف دوشی از همه قشنگ‌تره. تازه سبکه هم.'
    note: '*Licht* (سبک از نظر وزن) صفت تازه و به‌دردبخوری برای توصیف کیف و چمدان است.'
  nl.a1.unit14.lesson06.teach.omar_close:
    title: آن‌ها تصمیم را نهایی می‌کنند
    gloss: 'عمر: خوبه، پس من کوله‌پشتی رو می‌خرم و تو کیف دوشی رو.'
    note: در جمله‌ی دوم فعل تکراری *koop* حذف شده است؛ در هلندی گفتاری وقتی از متن روشن باشد، این کار طبیعی است.
  nl.a1.unit14.lesson06.teach.koopt_form:
    title: Koop و koopt
    gloss: Koop صورت «من» از kopen (خریدن) است؛ koopt صورت «او» است.
    note: 'الگوی منظم زمان حال: *ik koop*، *jij/hij/zij koopt*.'
