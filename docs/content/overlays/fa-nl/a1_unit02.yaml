teaching:
  nl.a1.unit02.lesson01.teach.zero_to_four:
    title: صفر تا چهار
    gloss: ۰ — صفر، ۱ — یک، ۲ — دو، ۳ — سه، ۴ — چهار
    note: nul در هلندی یعنی صفر و در شمارهٔ تلفن هم برای رقم اول همین گفته می‌شود. علامت‌های روی حرف در één عدد را از حرف تعریفِ een در نوشتار جدا می‌کنند؛ در متن‌های معمولی هلندی وقتی معنی روشن باشد گاهی این علامت‌ها نوشته نمی‌شوند.
    example_gloss:
    - من صفر یورو دارم.
    - من یک کتاب دارم.
    - من دو صندلی دارم.
    - من سه کتاب دارم.
    - چهار نفر آنجا هستند.
  nl.a1.unit02.lesson01.teach.five_to_eight:
    title: پنج تا هشت
    gloss: ۵ — پنج، ۶ — شش، ۷ — هفت، ۸ — هشت
    note: vijf و zes و zeven و acht از همان الگوی ساده‌ای پیروی می‌کنند که صفر تا چهار.
    example_gloss:
    - من پنج یورو دارم.
    - من شش کتاب دارم.
    - من هفت صندلی دارم.
    - هشت نفر آنجا هستند.
  nl.a1.unit02.lesson01.teach.nine_to_twelve:
    title: نه تا دوازده
    gloss: ۹ — نه، ۱۰ — ده، ۱۱ — یازده، ۱۲ — دوازده
    note: negen و tien و elf و twaalf اعداد تا دوازده را کامل می‌کنند.
    example_gloss:
    - من نه یورو دارم.
    - من ده صندلی دارم.
    - من یازده کتاب دارم.
    - دوازده نفر آنجا هستند.
  nl.a1.unit02.lesson01.teach.how_many:
    title: پرسیدن «چند تا؟»
    gloss: چند تا؟ / چقدر؟
    note: Hoeveel برای پرسیدن دربارهٔ تعداد یا مقدار به کار می‌رود.
  nl.a1.unit02.lesson02.teach.teens:
    title: اعداد سیزده تا نوزده
    gloss: '۱۳ تا ۱۹: سیزده، چهارده، پانزده، شانزده، هفده، هجده، نوزده'
    note: شکل‌های هلندی از سیزده تا نوزده همه به -tien ختم می‌شوند.
    example_gloss:
    - من سیزده سال دارم.
    - من چهارده یورو دارم.
    - من پانزده سال دارم.
    - من شانزده کتاب دارم.
    - هفده نفر آنجا هستند.
    - من هجده سال دارم.
    - من نوزده صندلی دارم.
  nl.a1.unit02.lesson02.teach.tens:
    title: دهگان‌ها
    gloss: '۲۰ تا ۹۰: بیست، سی، چهل، پنجاه، شصت، هفتاد، هشتاد، نود'
    note: این دهگان‌ها را به‌عنوان پایهٔ ساختن اعداد دورقمی بزرگ‌تر یاد بگیرید.
    example_gloss:
    - من بیست سال دارم.
    - این سی یورو است.
    - من چهل یورو دارم.
    - پنجاه نفر آنجا هستند.
    - من شصت سال دارم.
    - این هفتاد یورو است.
    - هشتاد نفر آنجا هستند.
    - من نود یورو دارم.
  nl.a1.unit02.lesson02.teach.inversion_rule:
    title: اول یکان، بعد دهگان
    gloss: '۲۱ تا ۹۹، به‌جز ۳۰ و ۴۰ و بقیهٔ دهگان‌های کامل: یکان + en + دهگان'
    note: 'در فارسی اول دهگان می‌آید (چهل و دو)، اما در هلندی معمولاً اول یکان گفته می‌شود: ۴۲ تحت‌اللفظی یعنی «دو و چهل». دهگان‌های کامل فقط با خودِ کلمهٔ دهگان گفته می‌شوند.'
  nl.a1.unit02.lesson02.teach.twenty_one:
    title: بیست و یک
    gloss: ۲۱ — بیست و یک
    note: eenentwintig از een + en + twintig ساخته شده و در نوشتار یک کلمه است.
    example_gloss: کافهٔ زبان در سالن شمارهٔ بیست و یک است.
  nl.a1.unit02.lesson02.teach.twenty_two:
    title: بیست و دو
    gloss: ۲۲ — بیست و دو
    note: دو نقطهٔ روی ë در tweeëntwintig نشان می‌دهد که دو حرف صدادارِ کنار هم در هجاهای جدا خوانده می‌شوند.
    example_gloss: من بیست و دو سال دارم.
  nl.a1.unit02.lesson02.teach.thirty_two:
    title: سی و دو
    gloss: ۳۲ — سی و دو
    note: tweeëndertig یک کلمه نوشته می‌شود و روی ë که دو بخش را به هم وصل می‌کند دو نقطه دارد.
    example_gloss: Omar سی و دو سال دارد.
  nl.a1.unit02.lesson02.teach.forty_two:
    title: چهل و دو
    gloss: ۴۲ می‌شود چهل و دو.
    note: 'در هلندی اول یکان را می‌گویند و بعد دهگان را: twee-en-veertig، که سرهم نوشته می‌شود: tweeënveertig.'
  nl.a1.unit02.lesson02.teach.forty_eight:
    title: چهل و هشت
    gloss: ۴۸ — چهل و هشت
    note: Achtenveertig از acht + en + veertig ساخته شده و سرهم نوشته می‌شود.
    example_gloss: من در پلاک چهل و هشت زندگی می‌کنم.
  nl.a1.unit02.lesson02.teach.seventy_five:
    title: هفتاد و پنج
    gloss: ۷۵ — هفتاد و پنج
    note: در vijfenzeventig اول vijf می‌آید و بعد zeventig.
    example_gloss: این هفتاد و پنج سنت قیمت دارد.
  nl.a1.unit02.lesson02.teach.ninety_nine:
    title: نود و نه
    gloss: ۹۹ — نود و نه
    note: Negenennegentig یک کلمهٔ مرکب است و سرهم نوشته می‌شود.
    example_gloss: من نود و نه سال دارم.
  nl.a1.unit02.lesson03.teach.ask_phone:
    title: پرسیدنِ شماره تلفن
    gloss: شمارهٔ تلفنت چیست؟
    note: je پرسش را خودمانی نگه می‌دارد، مثل فضای کافهٔ زبان لوته و عمر.
  nl.a1.unit02.lesson03.teach.phone_number:
    title: گفتن شمارهٔ موبایل هلندی
    gloss: شمارهٔ تلفنم ۰۶ ۲۱ ۴۳ ۶۵ ۸۷ است.
    note: شمارهٔ موبایل در هلند با ۰۶ شروع می‌شود و معمولاً به صورت ۰۶ و بعد هشت رقم نوشته می‌شود.
  nl.a1.unit02.lesson03.teach.phone_spoken:
    title: گفتن شمارهٔ تلفن به صورت گروهی
    gloss: صفر شش، بیست و یک، چهل و سه، شصت و پنج، هشتاد و هفت
    note: آدم‌ها رقم‌های تلفن را به شکل‌های مختلف گروه‌بندی می‌کنند. در این درس ۰۶ و بعد گروه‌های دورقمی را می‌گوییم؛ گفتن تک‌تک رقم‌ها هم عادی است، مخصوصاً وقتی وضوح مهم باشد.
  nl.a1.unit02.lesson03.teach.ask_house_number:
    title: پرسیدن شمارهٔ خانه
    gloss: شمارهٔ خانه‌ات چند است؟
    note: Huisnummer شماره‌ای است که بخشی از نشانی خیابان است.
  nl.a1.unit02.lesson03.teach.house_number:
    title: گفتن شمارهٔ خانه
    gloss: شمارهٔ خانه‌ام ۴۸ است.
    note: در نشانی یا فرم نوشتاری، استفاده از رقم طبیعی است.
  nl.a1.unit02.lesson03.teach.live_number:
    title: گفتن محل زندگی با شماره
    gloss: من در پلاک چهل و هشت زندگی می‌کنم.
    note: وقتی خیابان از قبل معلوم است، Op nummer ... راه طبیعی گفتن شمارهٔ خانه است.
  nl.a1.unit02.lesson03.teach.repeat:
    title: درخواستِ تکرار
    gloss: می‌شه اون رو تکرار کنی؟
    note: وقتی شمارهٔ تلفن را خیلی تند گفته‌اند و نشنیده‌اید، به کار می‌آید.
  nl.a1.unit02.lesson04.teach.ask_age:
    title: پرسیدن سن به شکل خودمانی
    gloss: چند سالته؟
    note: اینجا je خودمانی به کار رفته است؛ پرسیدن سن فقط وقتی مناسب است که موقعیت اجازه بدهد.
  nl.a1.unit02.lesson04.teach.age_twenty_eight:
    title: گفتن سن
    gloss: من بیست و هشت سال دارم.
    note: در هلندی می‌گویند Ik ben ... jaar، یعنی تحت‌اللفظی «من ... سال هستم»؛ در فارسی می‌گوییم «... سال دارم».
  nl.a1.unit02.lesson04.teach.age_thirty_two:
    title: گفتن سن عمر
    gloss: عمر سی و دو سال دارد.
    note: هنگام گفتن سن، بعد از عدد، jaar علامت جمع نمی‌گیرد.
  nl.a1.unit02.lesson04.teach.how_many_people:
    title: پرسیدن تعداد افراد
    gloss: چند نفر هستند؟
    note: Hoeveel درست قبل از اسم mensen می‌آید.
  nl.a1.unit02.lesson04.teach.twelve_people:
    title: گفتن تعداد افراد
    gloss: دوازده نفر هستند.
    note: Er zijn ساختار معمول جمع برای «... وجود دارند / ... هستند» است.
  nl.a1.unit02.lesson04.teach.three_books:
    title: شمردن کتاب‌ها
    gloss: من سه کتاب دارم.
    note: بعد از عددهای بزرگ‌تر از یک، boek به شکل جمع boeken می‌آید.
  nl.a1.unit02.lesson04.teach.seven_chairs:
    title: شمردن صندلی‌ها
    gloss: هفت صندلی
    note: Stoelen جمع stoel است.
  nl.a1.unit02.lesson05.teach.euro:
    title: Euro
    gloss: یورو
    note: 'Euro بعد از مقدار معمولاً مفرد می‌ماند: twee euro، نه twee euro''s.'
    example_gloss: این دو یورو قیمت دارد.
  nl.a1.unit02.lesson05.teach.cent:
    title: Cent
    gloss: سنت
    note: Cent هم در قیمت‌ها بعد از عدد معمولاً مفرد می‌ماند.
    example_gloss: این پنجاه سنت است.
  nl.a1.unit02.lesson05.teach.ask_price:
    title: پرسیدن قیمت
    gloss: این چنده؟
    note: Hoeveel مقدار را می‌پرسد و kost یعنی «قیمت دارد».
  nl.a1.unit02.lesson05.teach.two_fifty:
    title: دو یورو و پنجاه سنت
    gloss: ۲٫۵۰ یورو — دو یورو و پنجاه سنت
    note: در هلندی برای اعشار ویرگول می‌نویسند. در گفتار روزمره €2,50 را معمولاً twee euro vijftig می‌گویند، بدون en.
  nl.a1.unit02.lesson05.teach.seventy_five_cents:
    title: هفتاد و پنج سنت
    gloss: ۰٫۷۵ یورو — هفتاد و پنج سنت
    note: وقتی مبلغ کمتر از یک یورو است، فقط گفتن سنت طبیعی است.
  nl.a1.unit02.lesson05.teach.twelve_euros:
    title: دوازده یورو
    gloss: ۱۲ یورو — دوازده یورو
    note: برای قیمت یورویِ کامل، نیازی به گفتن سنت نیست.
  nl.a1.unit02.lesson05.teach.four_fifty:
    title: چهار یورو و پنجاه سنت
    gloss: ۴٫۵۰ یورو — چهار یورو و پنجاه سنت
    note: همین الگوی گفتاری برای قیمت‌های دیگر با یورو و سنت هم کار می‌کند.
  nl.a1.unit02.lesson05.teach.costs:
    title: گفتن قیمت
    gloss: این دو یورو و پنجاه سنت قیمت دارد.
    note: Dat kost ... مستقیماً جواب Hoeveel kost dit? است.
  nl.a1.unit02.lesson06.teach.opening:
    title: عمر ثبت‌نام می‌کند
    gloss: 'کارمند: ظهر بخیر. برای کافهٔ زبان آمده‌اید؟ عمر: بله، می‌خواهم ثبت‌نام کنم.'
    note: این صحنه ادامهٔ رفت‌وآمدهای عمر به کافهٔ زبان کتابخانه از درس ۱ است.
  nl.a1.unit02.lesson06.teach.phone_turn:
    title: گفتنِ شماره تلفن
    gloss: 'کارمند: عالی. شمارهٔ تلفنت چیست؟ عمر: ۰۶ ۲۱ ۴۳ ۶۵ ۸۷.'
    note: عمر شماره را با گروه‌های دورقمی که قبلاً تمرین شد می‌گوید.
  nl.a1.unit02.lesson06.teach.house_turn:
    title: گفتن شمارهٔ خانه
    gloss: 'کارمند: شمارهٔ خانه‌ات چند است؟ عمر: چهل و هشت.'
    note: وقتی سؤال زمینه را روشن کرده، جواب کوتاه فقط با عدد طبیعی است.
  nl.a1.unit02.lesson06.teach.fee_turn:
    title: فهمیدن هزینهٔ عضویت
    gloss: 'کارمند: هزینهٔ عضویت دو یورو و پنجاه سنت است. عمر: باشه.'
    note: قیمت در گفتار از الگوی روزمرهٔ یورو به‌علاوهٔ سنت پیروی می‌کند.
  nl.a1.unit02.lesson06.teach.group_turn:
    title: پرسیدن تعداد اعضای گروه
    gloss: 'عمر: در گروه چند نفر هستند؟ کارمند: دوازده نفر.'
    note: این صحنه دوباره از الگوی پرسش Hoeveel mensen ... که در همین درس آموخته شد استفاده می‌کند.
  nl.a1.unit02.lesson06.teach.room_turn:
    title: پیدا کردن شمارهٔ سالن
    gloss: 'کارمند: کافهٔ زبان در سالن بیست و یک است.'
    note: Zaal سالن یا اتاقی است که برای یک فعالیت استفاده می‌شود.
  nl.a1.unit02.lesson06.teach.lotte_turn:
    title: پیدا کردن میز لوته
    gloss: 'لوته: سلام عمر! ما پشت میز هفت نشسته‌ایم.'
    note: گفتگو با پیوستن دوبارهٔ عمر به لوته در همان فضای خودمانی تمام می‌شود.
