teaching:
  nl.a1.unit22.lesson01.teach.bellen:
    title: زنگ زدن
    gloss: زنگ زدن
    note: مصدر فعلی که برای تماس تلفنی به کار می‌رود.
    example_gloss: باید بهت زنگ بزنم.
  nl.a1.unit22.lesson01.teach.ik_bel_je:
    title: گفتن اینکه زنگ می‌زنید
    gloss: بهت زنگ می‌زنم.
    note: '*Bel* شکل ik فعل *bellen* (زنگ زدن) است؛ هلندی اینجا از زمان حال استفاده می‌کند، مثل فارسی که می‌گوییم «بهت زنگ می‌زنم».'
  nl.a1.unit22.lesson01.teach.met_lotte:
    title: جواب دادن به تلفن
    gloss: سلام، من لوته هستم.
    note: در هلندی برای معرفی خودتان پشت تلفن معمولاً می‌گویند *met* + اسم (یعنی «با اسم ...»). در فارسی می‌گوییم «من ... هستم» یا «با ... صحبت می‌کنید»، ولی در هلندی ساختار met + اسم رایج است.
  nl.a1.unit22.lesson01.teach.met_omar:
    title: امار هم همین‌طور جواب می‌دهد
    gloss: سلام، من عمر هستم.
    note: همان ساختار *met* + اسم است که در *Hallo, met Lotte* دیدید.
  nl.a1.unit22.lesson02.teach.met_wie:
    title: پرسیدن اینکه چه کسی زنگ زده
    gloss: با کی صحبت می‌کنم؟
    note: '*Met wie spreek ik?* جمله‌ی رسمی و رایج برای وقتی است که تماس‌گیرنده را نمی‌شناسید.'
  nl.a1.unit22.lesson02.teach.u_spreekt_met:
    title: معرفی رسمی خود
    gloss: با لوته صحبت می‌کنید.
    note: '*U spreekt met* + اسم، شکل رسمیِ *met* + اسم در حالت غیررسمی است.'
  nl.a1.unit22.lesson03.teach.kun_je_herhalen:
    title: خواستن تکرار
    gloss: می‌شه اون رو تکرار کنی؟
    note: '*Kun je* ...؟ (می‌توانی ...؟) به‌همراه *herhalen* (تکرار کردن) و *dat* (آن).'
  nl.a1.unit22.lesson03.teach.spreek_niet_snel:
    title: خواستن از کسی که آهسته‌تر حرف بزند
    gloss: لطفاً این‌قدر تند حرف نزن.
    note: '*Niet zo* + صفت، میزان را منفی می‌کند نه خود فعل را: یعنی «آن‌قدر سریع نه»، نه «صحبت نکن».'
  nl.a1.unit22.lesson03.teach.hoor_niet_goed:
    title: گفتن اینکه خوب نمی‌شنوید
    gloss: صدات رو خوب نمی‌شنوم.
    note: '*Horen* (شنیدن) با *niet goed* (خوب نه) مشکل شنیدن را نشان می‌دهد و با *verstaan* (فهمیدن حرف) فرق دارد.'
  nl.a1.unit22.lesson04.teach.sms:
    title: پیامک
    gloss: پیامک
    note: 'اسمی با جنس عام: *de sms*، که مستقیم از مخفف بین‌المللی گرفته شده است.'
    example_gloss: پیامک از طرف لوته است.
  nl.a1.unit22.lesson04.teach.stuur_sms:
    title: گفتن اینکه پیامک می‌فرستید
    gloss: برایتان پیامک می‌فرستم.
    note: '*Sturen* (فرستادن) اول مفعول غیرمستقیم (*je*) و بعد مفعول مستقیم (*een sms*) می‌گیرد.'
  nl.a1.unit22.lesson04.teach.bel_later_terug:
    title: گفتن اینکه بعداً زنگ می‌زنید
    gloss: بعداً بهت زنگ می‌زنم.
    note: '*Terug* (دوباره، پس) در انتهای جمله می‌آید و از فعل جداشدنی است؛ *bellen* + *terug* یعنی «دوباره تماس گرفتن». در فارسی هم می‌گوییم «بهت زنگ می‌زنم»، ولی در هلندی terug جدا و آخر جمله می‌آید.'
  nl.a1.unit22.lesson05.teach.sms_gesprek:
    title: خواندن گفتگوی پیامکی
    gloss: 'عمر: سلام لوته، می‌شه بهم زنگ بزنی؟ باید یه چیزی بهت بگم. لوته: آره حتماً، پنج دقیقه دیگه بهت زنگ می‌زنم.'
    note: دقت کنید عمر چه می‌خواهد، چرا، و لوته چه موقع می‌گوید دوباره زنگ می‌زند.
    glosses:
      Hoi: سلام
      kun: می‌تونی
      bellen: زنگ زدن
      moet: باید
      iets: یه چیزی
      vertellen: گفتن
      natuurlijk: حتماً
      bel: زنگ زدن
      vijf: پنج
      minuten: دقیقه
      terug: پس دادن
  nl.a1.unit22.lesson06.teach.lotte_open_call:
    title: عمر تلفن را جواب می‌دهد
    gloss: 'عمر: سلام، من عمر هستم.'
    note: 'همان ساختار *met* + اسم از درس اول، حالا در یک تماس واقعی: کسی که گوشی را برمی‌دارد اول حرف می‌زند و اسمش را می‌گوید.'
  nl.a1.unit22.lesson06.teach.omar_answer_glad:
    title: لوته خودش را معرفی می‌کند
    gloss: 'لوته: سلام عمر، من لوته‌ام. عمر: چه خوب که زنگ زدی!'
    note: '*Fijn dat* ... (چه خوب که ...) واکنشی مثبت به یک اتفاق را بیان می‌کند.'
  nl.a1.unit22.lesson06.teach.lotte_ask_shift:
    title: لوته درباره‌ی شیفت می‌پرسد
    gloss: 'لوته: اولین شیفتت چطور بود؟'
    note: '*Was* گذشته‌ی ساده‌ی *zijn* است؛ این ساختار با زمان ماضی نقلی (hebben/zijn + اسم مفعول، مثل *Ik heb gewerkt*) که در واحد ۱۲ آمد فرق دارد. یادداشت بعد از خط بعدی را ببینید.'
  nl.a1.unit22.lesson06.teach.omar_report_good:
    title: عمر خبر خوب می‌دهد
    gloss: 'عمر: خیلی خوب پیش رفت، بهتر از چیزی که فکر می‌کردم.'
    note: '*Ging* گذشته‌ی ساده‌ی *gaan* است (رفتن؛ اینجا یعنی «پیش رفتن»)؛ *dacht* گذشته‌ی ساده‌ی *denken* (فکر کردن) است.'
  nl.a1.unit22.lesson06.teach.simple_past_note:
    title: Was، ging و dacht شکل‌های گذشته‌ی ساده هستند
    gloss: was ← بودن، ging ← رفتن، dacht ← فکر کردن
    note: '*Was*، *ging* و *dacht* شکل‌های بی‌قاعده‌ی گذشته‌ی ساده (verleden tijd) هستند؛ الگویی که هنوز رسماً آموزش داده نشده و با ماضی نقلی واحد ۱۲ (hebben/zijn + اسم مفعول) فرق دارد. فعلاً فقط همین‌ها را به‌صورت عبارت ثابت در موقعیت‌های همین درس به خاطر بسپارید؛ قواعد کامل صرف گذشته‌ی ساده در سطح‌های بعدی می‌آید.'
  nl.a1.unit22.lesson06.teach.lotte_proud:
    title: لوته به تو افتخار می‌کند
    gloss: 'لوته: چه خوب که این را می‌شنوم! به تو افتخار می‌کنم.'
    note: '*Trots op* (افتخار کردن به) ترکیبی ثابت است؛ حرف اضافه‌ی *op* لازم است، نه *van*.'
  nl.a1.unit22.lesson06.teach.omar_thanks_means:
    title: عمر احساساتی می‌شود
    gloss: 'عمر: ممنون، این برایم خیلی ارزش دارد.'
    note: '*Betekent* صورت سوم شخص مفرد *betekenen* (معنا داشتن) است؛ *voor me* (برای من) نشان می‌دهد برای چه کسی مهم است.'
  nl.a1.unit22.lesson06.teach.zijn_possessive:
    title: مال او
    gloss: اولین شیفتش خیلی خوب گذشت.
    note: '*Zijn* در اینجا صفت ملکی «او (مرد)» است، نه فعل «بودن»؛ این دو کلمه‌ی هم‌شکل را از روی بافت جمله تشخیص می‌دهید.'
