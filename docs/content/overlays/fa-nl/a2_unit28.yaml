    note: '*De woningcorporatie* شرکت مسکنی است که آپارتمان‌های اجاره‌ای را در هلند مدیریت می‌کند.'
    glosses:
      Bevestiging: تأییدیه
      melding: گزارش / اعلام مشکل
      verwarming: سیستم گرمایش
      ontvangen: دریافت شده (اسم مفعول ontvangen، یعنی دریافت کردن)
      monteur: تعمیرکار
      komt: می‌آید (از komen)
      morgenochtend: فردا صبح
      tussen: بین
      negen: نُه
      elf: یازده
      uur: 'ساعت (تحت‌اللفظی: ساعت)'
      langs: سر زدن / آمدن (جزء جداشدنی langskomen، یعنی سر زدن)
      Bent: هستید (از zijn؛ Bent u = هستید؟)
      thuis: (در) خانه
      Bel: تماس بگیرید (امر از bellen، یعنی زنگ زدن)
      woningcorporatie: شرکت مسکن
