    note: این همان ساختار نظر *Ik vind X Y* است که قبلاً یاد گرفته‌اید (Ik vind koffie lekker, Ik vind Fenna nieuwsgierig)؛ قواعد تازه‌ای نیست، فقط کاربرد تازه‌ای است. *vind* اینجا بدون -t می‌ماند، چون فاعل *Ik* است (اول شخص). در جملهٔ پرسشی *Welk seizoen vind jij mooi?* هم چون *jij* بعد از فعل می‌آید، -t ندارد. شکل سوم شخص *vindt* (مثل *Omar vindt ...*) نکتهٔ دستوری جداگانه‌ای است که بعداً می‌آید.
