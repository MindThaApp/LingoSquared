  nl.a2.unit102.lesson01.exercise04.order_geen_tijd:
    instruction: کلمه‌ها را مرتب کنید و بگویید «وقت ندارم.»
    correct_option: Ik heb geen tijd
    accepted_answers:
    - value: Ik heb geen tijd
      status: correct
    - value: Geen tijd heb ik
      status: correct
    feedback: '*Geen tijd* = بدون وقت، وقت ندارم.'
  nl.a2.unit102.lesson01.exercise05.complete_geen:
    instruction: جمله را کامل کنید و بگویید وقت ملاقات ندارید.
    correct_option: geen
    accepted_answers:
    - value: geen
      status: correct
    feedback: '*Een afspraak* می‌شود *geen afspraak*.'
  nl.a2.unit102.lesson01.exercise06.translate_no_time:
    instruction: به هلندی ترجمه کنید.
    accepted_answers:
    - value: Ik heb geen tijd.
      status: correct
    - value: Ik heb geen tijd
      status: correct
    feedback: '*Ik heb geen tijd* = وقت ندارم.'
    prompt_blocks:
    - من وقت ندارم.
  nl.a2.unit102.lesson01.exercise07.write_dont_know:
    instruction: جملهٔ هلندی خواسته‌شده را بنویسید.
    correct_option: Ik ken het hotel niet.
    accepted_answers:
    - value: Ik ken het hotel niet.
      status: correct
    - value: Ik ken het hotel niet
      status: correct
    - value: Het hotel ken ik niet.
      status: correct
    - value: Het hotel ken ik niet
      status: correct
    feedback: '*Het hotel* معرفه است، پس *niet* بعد از آن می‌آید.'
    prompt_blocks:
    - 'به هلندی بنویسید: من هتل را نمی‌شناسم.'
  nl.a2.unit102.lesson02.exercise01.choose_groot:
    instruction: جمله‌ای را انتخاب کنید که niet جای درستی دارد.
    correct_option: De kamer is niet groot.
    distractors:
    - De kamer is groot niet.
    - De kamer niet is groot.
    - Niet de kamer is groot.
    accepted_answers:
    - value: De kamer is niet groot.
      status: correct
    feedback: '*Niet* قبل از صفت *groot* می‌آید.'
    prompt_blocks:
    - اتاق بزرگ نیست.
  nl.a2.unit102.lesson02.exercise02.choose_morgen:
    instruction: جمله‌ای را انتخاب کنید که niet جای درستی دارد.
    correct_option: Ik kan morgen niet komen.
    distractors:
    - Ik kan morgen komen niet.
    - Ik niet kan morgen komen.
    - Niet ik kan morgen komen.
    accepted_answers:
    - value: Ik kan morgen niet komen.
      status: correct
    feedback: اول قید زمان *morgen* می‌آید، بعد *niet*، بعد فعل دوم *komen*.
    prompt_blocks:
    - من فردا نمی‌توانم بیایم.
  nl.a2.unit102.lesson02.exercise03.match_niet:
    instruction: هر جملهٔ هلندی را به معنی فارسی‌اش وصل کنید.
    accepted_answers:
    - value:
      - left: اتاق بزرگ نیست.
        right: اتاق بزرگ نیست.
      - left: Ik ken het hotel niet.
        right: من هتل را نمی‌شناسم.
      - left: Ik ga niet naar het restaurant.
        right: من به رستوران نمی‌روم.
      - left: Ik kan niet komen.
        right: من نمی‌توانم بیایم.
      - left: Ik heb de kamer niet geboekt.
        right: من اتاق را رزرو نکرده‌ام.
      - left: رستوران باز نیست.
        right: رستوران باز نیست.
      status: correct
    feedback: ببینید *niet* در هر جمله کجا آمده است.
    pairs:
    - left: اتاق بزرگ نیست.
      right: اتاق بزرگ نیست.
    - left: Ik ken het hotel niet.
      right: من هتل را نمی‌شناسم.
    - left: Ik ga niet naar het restaurant.
      right: من به رستوران نمی‌روم.
    - left: Ik kan niet komen.
      right: من نمی‌توانم بیایم.
    - left: Ik heb de kamer niet geboekt.
      right: من اتاق را رزرو نکرده‌ام.
    - left: رستوران باز نیست.
      right: رستوران باز نیست.
    localize_pair_lefts: 'yes'
  nl.a2.unit102.lesson02.exercise04.order_geboekt:
    instruction: کلمه‌ها را مرتب کنید و بگویید «اتاق را رزرو نکرده‌ام.»
    correct_option: Ik heb de kamer niet geboekt
    accepted_answers:
    - value: Ik heb de kamer niet geboekt
      status: correct
    - value: De kamer heb ik niet geboekt
      status: correct
    feedback: مفعول معرفه *de kamer* قبل از *niet* می‌آید؛ *geboekt* آخر جمله است.
  nl.a2.unit102.lesson02.exercise05.complete_naar:
    instruction: جمله را کامل کنید و بگویید به رستوران نمی‌روید.
    correct_option: niet
    accepted_answers:
    - value: niet
      status: correct
    feedback: '*Niet* قبل از گروه حرف اضافه‌ای *naar het restaurant* می‌آید.'
  nl.a2.unit102.lesson02.exercise06.translate_today:
    instruction: به هلندی ترجمه کنید.
    accepted_answers:
    - value: Ik kan vandaag niet komen.
      status: correct
    - value: Ik kan vandaag niet komen
      status: correct
    - value: Vandaag kan ik niet komen.
      status: correct
    - value: Vandaag kan ik niet komen
      status: correct
    feedback: '*Vandaag* قبل از *niet* می‌آید و *komen* آخر جمله است.'
    prompt_blocks:
    - من امروز نمی‌توانم بیایم.
  nl.a2.unit102.lesson02.exercise07.write_called:
    instruction: جملهٔ هلندی خواسته‌شده را بنویسید.
    correct_option: Ik heb niet gebeld.
    accepted_answers:
    - value: Ik heb niet gebeld.
      status: correct
    - value: Ik heb niet gebeld
      status: correct
    feedback: '*Niet* قبل از صفت مفعولی *gebeld* می‌آید.'
    prompt_blocks:
    - 'به هلندی بنویسید: من زنگ نزده‌ام.'
  nl.a2.unit102.lesson03.exercise01.choose_kamers:
    instruction: جملهٔ درست هلندی را برای «اتاقی نیست.» انتخاب کنید.
    correct_option: Er zijn geen kamers.
    distractors:
    - Er zijn niet kamers.
    - Er zijn kamers niet.
