  notes: 'Derived from en-nl by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Farsi (Iran) string was translated and adapted. Needs native Farsi (Iran) review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
course:
  title: هلندی A2
  description: هلندی سطح A2 با تمرکز بر دستور زبان، برای رفع سوءتفاهم‌ها با niet و geen.
  learning_goal: 'گفتن «هنوز نه»، «دیگر نه» و «هیچ»: niet را درست در جمله بگذارید، بین niet و geen درست انتخاب کنید و nog niet، niet meer و geen ... meer را به کار ببرید.'
units:
  nl.a2.unit102.nog_niet_geen_meer:
    title: هنوز نه، هیچ، دیگر نه
    description: سوءتفاهم دربارهٔ رزرو، سفارش و قرار ملاقات را با niet، geen، nog niet، niet meer و geen ... meer اصلاح کنید.
lessons:
  nl.a2.unit102.lesson01.niet_en_geen:
    title: Niet و geen
  nl.a2.unit102.lesson02.plaats_van_niet:
    title: niet کجا می‌آید؟
  nl.a2.unit102.lesson03.niet_of_geen:
    title: انتخاب بین niet و geen
  nl.a2.unit102.lesson04.nog_niet_nog_geen:
    title: هنوز نه
  nl.a2.unit102.lesson05.niet_meer_geen_meer:
    title: دیگر نه، دیگر هیچ
  nl.a2.unit102.lesson06.lotte_en_omar_kamer:
    title: Lotte، Omar و اتاق
teaching:
  nl.a2.unit102.lesson01.teach.restaurant:
    title: در رستوران
    gloss: رستوران / میز / رزرو / سفارش
    note: این چهار اسم در کل این درس بارها تکرار می‌شوند.
    example_gloss:
    - من در رستوران میز دارم.
    - Omar رزرو دارد.
    - Noor سفارش دارد.
  nl.a2.unit102.lesson01.teach.hotel:
    title: در هتل
    gloss: هتل / اتاق / رزرو
    note: '*Hotel* کلمهٔ het است؛ *kamer* و *boeking* کلمهٔ de هستند.'
    example_gloss:
    - هتل در Utrecht است.
    - Lotte اتاق دارد.
    - من رزرو را می‌شناسم.
  nl.a2.unit102.lesson01.teach.afspraak:
    title: قرار ملاقات و پیام
    gloss: قرار ملاقات / دکتر / وقت / پیام
    note: '*Tijd* در این معنی جمع ندارد: زمان را به‌طور کلی می‌گوید.'
    example_gloss:
    - من با دکتر قرار دارم.
    - Omar وقت دارد.
    - Noor پیام دارد.
  nl.a2.unit102.lesson01.teach.gn_niet_einde:
    title: Niet در آخر جمله
    gloss: من کار نمی‌کنم. من رستوران را نمی‌شناسم.
    note: در جملهٔ کوتاه، *niet* آخر جمله می‌آید. مفعول معرفه (*het restaurant*، *de dokter*) قبل از *niet* می‌آید.
  nl.a2.unit102.lesson01.teach.gn_geen:
    title: Geen به‌جای een
    gloss: من یک میز دارم. من میز ندارم.
    note: '*Geen* جای *een* می‌نشیند و اسم را منفی می‌کند. معمولاً *niet een* گفته نمی‌شود.'
  nl.a2.unit102.lesson01.teach.zinnen:
    title: سه جملهٔ منفی
    gloss: من رزرو ندارم. من هتل را نمی‌شناسم. من وقت ندارم.
  nl.a2.unit102.lesson02.teach.eigenschappen:
    title: کلمه‌های توصیفی
    gloss: باز / آماده / گران / بزرگ / خالی
    note: این کلمه‌ها بعد از *is* اسم را توصیف می‌کنند.
    example_gloss:
    - رستوران باز است.
    - اتاق بزرگ است.
    - میز خالی است.
  nl.a2.unit102.lesson02.teach.werkwoorden:
    title: فعل‌های مربوط به رزرو
    gloss: زنگ زدن / رزرو کردن / آمدن / توانستن / رفتن؛ زنگ زده / رزرو کرده
    note: 'بسیاری از فعل‌ها ماضی نقلی را با *heb* + صفت مفعولی می‌سازند: *Ik heb gebeld*. بعد از *kan* فعل دوم به شکل مصدر می‌آید: *Ik kan komen*.'
    example_gloss:
    - Lotte زنگ زده است.
    - من اتاق را رزرو کرده‌ام.
    - من می‌توانم بیایم.
    - من دارم به رستوران می‌روم.
  nl.a2.unit102.lesson02.teach.tijd:
    title: کلمه‌های زمان
    gloss: امروز / فردا / اغلب
    note: قید زمان معمولاً قبل از *niet* می‌آید.
    example_gloss:
    - امروز می‌آیم.
    - Omar فردا زنگ می‌زند.
    - Noor اغلب زنگ می‌زند.
  nl.a2.unit102.lesson02.teach.gn_niet_voor:
    title: Niet قبل از ...
    gloss: اتاق بزرگ نیست. به رستوران نمی‌روم. نمی‌توانم بیایم. زنگ نزده‌ام.
    note: '*Niet* قبل از صفت (*niet groot*)، قبل از گروه حرف اضافه‌ای (*niet naar het restaurant*) و قبل از فعل دوم (*niet komen*، *niet gebeld*) می‌آید.'
  nl.a2.unit102.lesson02.teach.gn_niet_na:
    title: Niet بعد از ...
    gloss: اتاق را رزرو نکرده‌ام. فردا نمی‌آیم.
    note: مفعول معرفه (*de kamer*) و قید زمان (*morgen*، *vandaag*) قبل از *niet* می‌آیند. اگر بعدش صفت مفعولی یا فعل دوم باشد، *niet* قبل از آن قرار می‌گیرد؛ در جملهٔ ساده‌ای مثل *Ik kom morgen niet*، *niet* آخر جمله است.
  nl.a2.unit102.lesson03.teach.meervoud:
    title: جمع و اسم‌های نشمردنی
    gloss: اتاق‌ها / میزها / جا / پول / قهوه
    note: '*Kamers* و *tafels* جمع هستند. *Geld* و *koffie* در این کاربرد نه *een* می‌گیرند و نه جمع بسته می‌شوند.'
    example_gloss:
    - اتاق هست.
    - قهوه هست.
    - ما میز داریم.
    - من پول دارم.
  nl.a2.unit102.lesson03.teach.gn_geen_regels:
    title: چه وقت از geen استفاده کنیم
    gloss: وقت ملاقات ندارم. اتاقی نیست. وقت ندارم.
    note: 'وقتی اسم *een* دارد، بدون حرف تعریف است یا جمع است، از *geen* استفاده کنید: *een afspraak*، *tijd*، *kamers*.'
  nl.a2.unit102.lesson03.teach.gn_niet_regels:
    title: Niet یا geen؟
    gloss: دکتر را نمی‌شناسم. قهوه گران نیست. اینجا رستوران نیست.
    note: برای اسم معرفه (*de dokter*)، برای صفت (*duur*) و برای فعل‌ها از *niet* استفاده کنید. *Het is een restaurant* می‌شود *Het is geen restaurant*.
  nl.a2.unit102.lesson04.teach.betalen:
    title: پرداخت و تأیید
    gloss: صورت‌حساب / تأییدیه / پرداخت‌شده / سفارش‌داده‌شده / آنجا
    note: '*Betaald* و *besteld* صفت مفعولی هستند، مثل *gebeld* و *geboekt*.'
    example_gloss:
    - صورت‌حساب را پرداخت کرده‌ام.
    - تأییدیه اینجاست.
    - Noor قهوه سفارش داده است.
  nl.a2.unit102.lesson04.teach.gn_nog_niet:
    title: Nog niet = هنوز نه
    gloss: هنوز اتاق را رزرو نکرده‌ام. اتاق هنوز آماده نیست.
    note: '*Nog niet* یعنی هنوز نه: هنوز در راه است. جای آن مثل *niet* است و *nog* جلوی آن می‌آید.'
  nl.a2.unit102.lesson04.teach.gn_nog_geen:
    title: Nog geen = هنوز ... نه
    gloss: هنوز اتاقی رزرو نکرده‌ام. هنوز پیامی نداریم.
    note: '*Nog geen* + اسم یعنی هنوز ... نه. *Nog* قبل از *geen* می‌آید.'
  nl.a2.unit102.lesson04.teach.antwoord:
    title: جواب‌های کوتاه
    gloss: اتاق آماده است؟ هنوز نه. میز داری؟ هنوز نه.
  nl.a2.unit102.lesson05.teach.woorden:
    title: واژه‌های کاربردی
    gloss: بیشتر / متأسفانه / پر / می‌خواهد / پس
    note: '*Meer* واژهٔ کلیدی این درس است.'
    example_gloss:
    - متأسفانه هتل پر است.
    - Omar یک اتاق می‌خواهد.
    - من دیگر وقت ندارم.
  nl.a2.unit102.lesson05.teach.gn_niet_meer:
    title: Niet meer = دیگر نه
    gloss: رستوران دیگر باز نیست. من دیگر کار نمی‌کنم.
    note: '*Niet meer* یعنی قبلاً این‌طور بوده، ولی حالا نه. جای آن مثل *niet* است.'
  nl.a2.unit102.lesson05.teach.gn_geen_meer:
    title: Geen ... meer = دیگر ... نیست
    gloss: دیگر اتاقی نمانده. دیگر وقتی ندارم.
    note: '*Geen ... meer* یعنی چیزی باقی نمانده. *Meer* بعد از اسم می‌آید.'
  nl.a2.unit102.lesson05.teach.gn_contrast:
    title: Nog niet یا niet meer؟
    gloss: اتاق هنوز خالی نیست. اتاق دیگر خالی نیست.
    note: '*Nog niet*: قرار است بشود. *Niet meer*: تمام شده. این دو عکس هم هستند.'
  nl.a2.unit102.lesson05.teach.reading:
    title: Lotte اتاق لازم دارد
    gloss: Lotte می‌خواهد فردا یک اتاق رزرو کند. به هتل زنگ می‌زند، ولی متأسفانه هتل پر است. دیگر اتاقی نمانده. Lotte هنوز اتاق دیگری ندارد. برای همین به هتل دیگری زنگ می‌زند، ولی آن هتل دیگر باز نیست. پس Lotte هنوز اتاقی ندارد.
  nl.a2.unit102.lesson06.teach.ask_kamer:
    title: لوته می‌پرسد
    gloss: 'Lotte: سلام Omar، اتاق را رزرو کردی؟'
  nl.a2.unit102.lesson06.teach.nog_niet:
    title: عمر جواب می‌دهد
    gloss: 'Omar: هنوز نه. امروز وقت ندارم.'
  nl.a2.unit102.lesson06.teach.tafel:
    title: Lotte بررسی می‌کند
    gloss: 'Lotte: تو در رستوران میز داری، درسته؟'
  nl.a2.unit102.lesson06.teach.klopt_niet:
    title: Omar اصلاحش می‌کند
    gloss: 'Omar: نه، درست نیست. میز ندارم. رستوران پر است.'
  nl.a2.unit102.lesson06.teach.geen_meer:
    title: Lotte دوباره می‌پرسد
    gloss: 'Lotte: دیگر میزی نمانده؟'
  nl.a2.unit102.lesson06.teach.helaas:
    title: Omar تمامش می‌کند
    gloss: 'Omar: نه، متأسفانه نه. فردا زنگ می‌زنم.'
exercises:
  nl.a2.unit102.lesson01.exercise01.choose_geen:
    instruction: جملهٔ درست هلندی را برای «رزرو ندارم.» انتخاب کنید.
    correct_option: Ik heb geen reservering.
    distractors:
    - Ik heb niet reservering.
    - Ik heb reservering niet.
    - Ik niet heb een reservering.
    accepted_answers:
    - value: Ik heb geen reservering.
      status: correct
    feedback: '*Een reservering* می‌شود *geen reservering*.'
    prompt_blocks:
    - من رزرو ندارم.
  nl.a2.unit102.lesson01.exercise02.choose_niet:
    instruction: جملهٔ درست هلندی را برای «هتل را نمی‌شناسم.» انتخاب کنید.
    correct_option: Ik ken het hotel niet.
    distractors:
    - Ik ken geen het hotel.
    - Ik niet ken het hotel.
    - Ik ken het hotel geen.
    accepted_answers:
    - value: Ik ken het hotel niet.
      status: correct
    feedback: با مفعول معرفه (*het hotel*)، *niet* را بعد از آن بیاورید.
    prompt_blocks:
    - من هتل را نمی‌شناسم.
  nl.a2.unit102.lesson01.exercise03.match_words:
    instruction: هر اسم هلندی را به معنی فارسی‌اش وصل کنید.
    accepted_answers:
    - value:
      - left: de tafel
        right: میز
      - left: de reservering
        right: رزرو
      - left: de bestelling
        right: سفارش
      - left: de kamer
        right: آن اتاق
      - left: de afspraak
        right: نوبت
