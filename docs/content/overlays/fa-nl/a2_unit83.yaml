course:
  title: هلندی A2
  description: هلندی سطح A2 با تمرکز بر دستور زبان برای صحبت درباره‌ی اتفاق‌های گذشته.
  learning_goal: یک موقعیت پس‌زمینه و یک رویداد را با شکل‌های بی‌قاعده‌ی گذشته‌ی ساده، toen و terwijl به هم وصل کنید.
units:
  nl.a2.unit83.wat_gebeurde_er:
    title: چه اتفاقی افتاد؟
    description: یک اتفاق کوچک، تغییر هوا یا مشکل ترافیکی را با گذشته‌ی ساده توصیف کنید.
lessons:
  nl.a2.unit83.lesson01.onregelmatige_vormen:
    title: چه اتفاقی افتاد؟
  nl.a2.unit83.lesson02.vormen_combineren:
    title: ترکیب شکل‌ها
  nl.a2.unit83.lesson03.toen_en_terwijl:
    title: Toen و terwijl
  nl.a2.unit83.lesson04.een_klein_incident:
    title: یک اتفاق کوچک
  nl.a2.unit83.lesson05.noors_bericht:
    title: پیام نور
  nl.a2.unit83.lesson06.lotte_en_omar:
    title: لوته و عمر در راه
teaching:
  nl.a2.unit83.lesson01.teach.incidenten:
    title: اتفاق‌های کوچک
    gloss: لاستیک پنچر / رگبار / تأخیر
    note: این اسم‌ها مشکل‌های این درس را نام می‌برند.
    example_gloss:
    - لاستیک دوچرخه‌ام پنچر است.
    - ناگهان یک رگبار آمد.
    - اتوبوس تأخیر داشت.
  nl.a2.unit83.lesson01.teach.verkeer:
    title: در راه
    gloss: دوچرخه / اتوبوس / ایستگاه اتوبوس / در راه
    note: '*Onderweg* یعنی وسط سفر یا مسیر بودن.'
    example_gloss:
    - دوچرخه‌ام در ایستگاه اتوبوس بود.
    - اتوبوس دیر رسید.
    - در راه باران شروع شد.
  nl.a2.unit83.lesson01.teach.weer:
    title: هوا و زمان
    gloss: باریدن / شدید / ناگهان / دیر
    note: '*Hard regenen* یعنی باران شدید باریدن.'
    example_gloss:
    - باران شدید شروع شد.
    - ناگهان اتوبوس رسید.
    - اتوبوس دیر رسید.
  nl.a2.unit83.lesson01.teach.gn_irregular_basis:
    title: شش فعل بی‌قاعده در گذشته‌ی ساده
    gloss: بودن ← بود/بودند؛ داشتن ← داشت؛ رفتن ← رفت؛ آمدن ← آمد؛ دیدن ← دید؛ گفتن ← گفت
    note: 'این شکل‌های گذشته‌ی ساده را یک‌جا یاد بگیرید. مفرد و جمع اغلب فرق دارند: *was/waren, ging/gingen, kwam/kwamen*.'
  nl.a2.unit83.lesson01.teach.gn_irregular_set:
    title: شش شکل بی‌قاعده‌ی دیگر
    gloss: گرفتن ← گرفت؛ دادن ← داد؛ ایستادن ← ایستاد؛ نشستن ← نشست؛ پیاده رفتن ← پیاده رفت؛ راندن ← راند
    note: 'شکل‌های مفرد این‌ها هستند: *nam, gaf, stond, zat, liep,* و *reed*.'
  nl.a2.unit83.lesson01.teach.vraag:
    title: پرسیدن از ماجرا
    gloss: در راه چه اتفاقی افتاد؟
    note: '*Gebeurde* گذشته‌ی ساده‌ی *gebeuren* است.'
  nl.a2.unit83.lesson01.teach.zinnen:
    title: شکل‌های بی‌قاعده در متن
    gloss: در راه بودم. اتوبوس تأخیر داشت. یک رگبار دیدم و سوار اتوبوس شدم.
  nl.a2.unit83.lesson02.teach.handeling:
    title: فعل‌های اتفاق
    gloss: منتظر ماندن / زنگ زدن / دوچرخه‌سواری کردن / شروع کردن / گرفتن
    note: این فعل‌ها پس‌زمینه و رویداد را می‌سازند.
    example_gloss:
    - باید منتظر اتوبوس بمانم.
    - لوته می‌خواهد به من زنگ بزند.
    - می‌خواهم با دوچرخه به خانه بروم.
    - ممکن است باران شروع شود.
    - ممکن است لاستیکم پنچر شود.
  nl.a2.unit83.lesson02.teach.regular_review:
    title: گذشته‌ی ساده‌ی باقاعده و بی‌قاعده
    gloss: منتظر ماند / زنگ زد / دوچرخه‌سواری کرد / اتفاق افتاد / شروع شد / گرفت
    note: شکل‌های باقاعده‌ی *wachtte, belde,* و *fietste* از قاعده‌ی واحد ۸۲ پیروی می‌کنند. *Begon* و *kreeg* بی‌قاعده هستند.
  nl.a2.unit83.lesson02.teach.phrases:
    title: چهار جمله درباره‌ی یک اتفاق
    gloss: داشتم با دوچرخه به خانه می‌رفتم. لوته زنگ زد. باران شروع شد. لاستیکم پنچر شد.
  nl.a2.unit83.lesson03.teach.connectors:
    title: ربط‌های زمانی
    gloss: وقتی / در حالی که / کنار
    note: برای یک لحظهٔ مشخص در گذشته از *toen* و برای موقعیت‌های همزمان از *terwijl* استفاده کنید.
    example_gloss:
    - وقتی به خانه رسیدم، Lotte زنگ زد.
    - وقتی منتظر بودم، باران می‌بارید.
    - کنار دوچرخه‌ام ایستاده بودم.
  nl.a2.unit83.lesson03.teach.gn_toen:
    title: Toen و فعل در آخر جمله
    gloss: وقتی داشتم با دوچرخه به خانه می‌رفتم، باران شروع شد.
    note: 'بعد از *toen*، فعل جملهٔ وابسته به آخر جمله می‌رود: *ik naar huis fietste*.'
  nl.a2.unit83.lesson03.teach.gn_terwijl:
    title: Terwijl برای موقعیت پس‌زمینه
    gloss: وقتی منتظر اتوبوس بودم، Lotte زنگ زد.
    note: 'بعد از *terwijl*، فعل آخر جمله می‌آید: *ik op de bus wachtte*.'
  nl.a2.unit83.lesson03.teach.gn_inversion:
    title: جابه‌جایی فعل و فاعل بعد از بند آغازین
    gloss: 'بعد از بند آغازین با toen یا terwijl، فعل صرف‌شده پیش از فاعل می‌آید: شروع شد آن؛ زنگ زد Lotte.'
    note: ویرگول بند وابسته را می‌بندد؛ جملهٔ اصلی با *begon het* یا *belde Lotte* شروع می‌شود.
  nl.a2.unit83.lesson03.teach.gn_contrast:
    title: Toen در برابر terwijl
    gloss: Toen لحظه‌ای را که چیزی اتفاق افتاد نام می‌برد. Terwijl دو موقعیت را که همزمان در جریان بودند به هم وصل می‌کند.
    note: در این درس همهٔ کارهای روایت‌شده در گذشتهٔ ساده می‌آیند.
  nl.a2.unit83.lesson04.teach.halte:
    title: در ایستگاه
    gloss: ایستگاه / در خانه / کنار دوچرخه
    note: '*Halte* می‌تواند ایستگاه اتوبوس یا تراموا باشد.'
    example_gloss:
    - در ایستگاه منتظر ماندم.
    - دیر به خانه رسیدم.
    - کنار دوچرخه ایستاده بودم.
  nl.a2.unit83.lesson04.teach.regende:
    title: هوا در پس‌زمینه
    gloss: وقتی کنار دوچرخه‌ام ایستاده بودم، باران شدیدی می‌بارید.
  nl.a2.unit83.lesson04.teach.reeks:
    title: یک اتفاق کوتاه
    gloss: وقتی داشتم به خانه می‌رفتم، لاستیک دوچرخه‌ام پنچر شد. تا ایستگاه پیاده رفتم و سوار اتوبوس شدم.
  nl.a2.unit83.lesson05.teach.reading:
    title: مسیر Noor تا خانه
    gloss: دیروز Noor بعد از کار با دوچرخه به خانه می‌رفت. وقتی از مسیر دوچرخه می‌گذشت، لاستیکش پنچر شد. وقتی کنار ایستگاه ایستاده بود، اتوبوس دیر رسید. بیست دقیقه در اتوبوس نشست. وقتی به خانه رسید، به Lotte زنگ زد.
    note: موقعیت‌های پس‌زمینه و اتفاق‌هایی را که در آن‌ها افتاد دنبال کنید.
    glosses:
      Gisteren: دیروز
      reed: با دوچرخه رفت
      fietspad: مسیر دوچرخه
      lekke: پنچر
      band: لاستیک
      halte: ایستگاه
      twintig: بیست
      minuten: دقیقه
  nl.a2.unit83.lesson06.teach.lotte_vraag:
    title: لوته می‌پرسد
    gloss: 'Lotte: سلام Omar، تو راه چی شد؟'
  nl.a2.unit83.lesson06.teach.omar_band:
    title: Omar اتفاق را می‌گوید
    gloss: 'Omar: وقتی داشتم با دوچرخه به خونه می‌رفتم، لاستیکم پنچر شد.'
  nl.a2.unit83.lesson06.teach.lotte_toen:
    title: Lotte می‌پرسد بعدش چه شد
    gloss: 'Lotte: وای نه! بعدش؟'
  nl.a2.unit83.lesson06.teach.omar_regen:
    title: Omar تغییر هوا را اضافه می‌کند
    gloss: 'Omar: وقتی کنار دوچرخه‌ام ایستاده بودم، باران شدیدی شروع شد.'
  nl.a2.unit83.lesson06.teach.lotte_thuis:
    title: Lotte می‌پرسد چطور به خانه رسیده
    gloss: 'Lotte: چطوری به خونه رسیدی؟'
  nl.a2.unit83.lesson06.teach.omar_bus:
    title: Omar ماجرا را تمام می‌کند
    gloss: 'Omar: تا ایستگاه اتوبوس پیاده رفتم و سوار اتوبوس شدم.'
exercises:
  nl.a2.unit83.lesson01.exercise01.choose_had:
    instruction: جمله‌ی هلندی در زمان گذشته‌ی ساده را انتخاب کنید.
    correct_option: De bus had vertraging.
    distractors:
    - De bus heeft vertraging.
    - De bus waren vertraging.
    - De bus hadden vertraging.
    accepted_answers:
    - value: De bus had vertraging.
      status: correct
    feedback: '*Had* گذشتهٔ ساده‌ی مفرد فعل *hebben* است.'
    prompt_blocks:
    - اتوبوس تأخیر داشت.
  nl.a2.unit83.lesson01.exercise02.choose_saw:
    instruction: جمله‌ی هلندی در زمان گذشته‌ی ساده را انتخاب کنید.
    correct_option: Ik zag een regenbui.
    distractors:
    - Ik zie een regenbui.
    - Ik zagen een regenbui.
    - Ik was een regenbui.
    accepted_answers:
    - value: Ik zag een regenbui.
      status: correct
    feedback: '*Zag* گذشتهٔ ساده‌ی مفرد فعل *zien* است.'
    prompt_blocks:
    - یک رگبار دیدم.
  nl.a2.unit83.lesson01.exercise03.match_forms:
    instruction: هر مصدر را با شکل گذشته‌ی ساده‌ی مفردش جفت کنید.
    accepted_answers:
    - value:
      - left: zijn
        right: was
      - left: hebben
        right: had
      - left: gaan
        right: ging
      - left: komen
        right: kwam
      - left: zien
        right: zag
      - left: nemen
        right: nam
      status: correct
    feedback: این شش فعل پرکاربرد در گذشتهٔ ساده بی‌قاعده‌اند.
    pairs:
    - left: zijn
      right: was
    - left: hebben
      right: had
    - left: gaan
      right: ging
    - left: komen
      right: kwam
    - left: zien
      right: zag
    - left: nemen
      right: nam
  nl.a2.unit83.lesson01.exercise04.order_delay:
    instruction: کلمه‌ها را مرتب کنید تا بگویید «اتوبوس تأخیر داشت.»
    correct_option: De bus had vertraging
    accepted_answers:
    - value: De bus had vertraging
      status: correct
    feedback: '*De bus had vertraging* از *had* در گذشتهٔ ساده استفاده می‌کند.'
  nl.a2.unit83.lesson01.exercise05.complete_saw:
    instruction: جمله را با گذشتهٔ ساده‌ی مفرد فعل zien کامل کنید.
    correct_option: zag
    accepted_answers:
    - value: zag
      status: correct
    feedback: '*Ik zag een regenbui* = یک رگبار دیدم.'
  nl.a2.unit83.lesson01.exercise06.translate_took_bus:
    instruction: به هلندی ترجمه کنید. از گذشتهٔ ساده‌ی فعل nemen استفاده کنید.
    accepted_answers:
    - value: Ik nam de bus.
      status: correct
    - value: Ik nam de bus
      status: correct
    feedback: '*Ik nam de bus* = سوار اتوبوس شدم.'
    prompt_blocks:
    - سوار اتوبوس شدم.
  nl.a2.unit83.lesson01.exercise07.write_was_underway:
    instruction: جملهٔ هلندی خواسته‌شده را با گذشتهٔ ساده‌ی فعل zijn بنویسید.
    correct_option: Ik was onderweg.
    accepted_answers:
    - value: Ik was onderweg.
      status: correct
    - value: Ik was onderweg
      status: correct
    feedback: '*Ik was onderweg* = تو راه بودم.'
    prompt_blocks:
    - 'با گذشته‌ی ساده‌ی zijn به هلندی بنویسید: من در راه بودم.'
  nl.a2.unit83.lesson02.exercise01.choose_cycled:
    instruction: جملهٔ هلندی در گذشتهٔ ساده را انتخاب کنید.
    correct_option: Ik fietste naar huis.
    distractors:
    - Ik fiets naar huis.
    - Ik fietsten naar huis.
    - Ik reed de bus.
    accepted_answers:
    - value: Ik fietste naar huis.
      status: correct
    feedback: '*Fietste* گذشتهٔ ساده‌ی مفرد فعل *fietsen* است.'
    prompt_blocks:
    - داشتم با دوچرخه به خانه می‌رفتم.
  nl.a2.unit83.lesson02.exercise02.choose_got_flat:
    instruction: جمله‌ای را انتخاب کنید که یعنی «لاستیکم پنچر شد.»
    correct_option: Ik kreeg een lekke band.
    distractors:
    - Ik krijg een lekke band.
    - Ik kregen een lekke band.
    - Ik had vertraging.
    accepted_answers:
    - value: Ik kreeg een lekke band.
      status: correct
    feedback: '*Kreeg* گذشتهٔ ساده‌ی مفرد فعل *krijgen* است.'
    prompt_blocks:
    - لاستیک دوچرخه‌ام پنچر شد.
  nl.a2.unit83.lesson02.exercise03.match_past:
    instruction: هر مصدر را با شکل گذشته‌ی ساده‌ی مفردش جفت کنید.
    accepted_answers:
    - value:
      - left: wachten
        right: wachtte
      - left: bellen
        right: belde
      - left: fietsen
        right: fietste
      - left: beginnen
        right: begon
      - left: krijgen
        right: kreeg
      - left: gebeuren
        right: gebeurde
      status: correct
    feedback: سه فعل اول باقاعده‌اند؛ *begon* و *kreeg* بی‌قاعده‌اند.
    pairs:
    - left: wachten
      right: wachtte
    - left: bellen
      right: belde
    - left: fietsen
      right: fietste
    - left: beginnen
      right: begon
    - left: krijgen
      right: kreeg
    - left: gebeuren
      right: gebeurde
  nl.a2.unit83.lesson02.exercise04.order_flat:
    instruction: کلمه‌ها را مرتب کنید تا بگویید «لاستیکم پنچر شد.»
    correct_option: Ik kreeg een lekke band
    accepted_answers:
    - value: Ik kreeg een lekke band
      status: correct
    feedback: '*Ik kreeg een lekke band* از *kreeg* در گذشتهٔ ساده استفاده می‌کند.'
  nl.a2.unit83.lesson02.exercise05.complete_rain:
    instruction: با گذشتهٔ ساده‌ی مفرد فعل beginnen کامل کنید.
    correct_option: begon
    accepted_answers:
    - value: begon
      status: correct
    feedback: '*Het begon te regenen* = باران شروع شد.'
  nl.a2.unit83.lesson02.exercise06.translate_lotte_called:
    instruction: با گذشتهٔ ساده‌ی فعل bellen به هلندی ترجمه کنید.
    accepted_answers:
    - value: Lotte belde.
      status: correct
    - value: Lotte belde
      status: correct
    feedback: '*Lotte belde* = Lotte زنگ زد.'
    prompt_blocks:
    - لوته زنگ زد. از گذشته‌ی ساده استفاده کنید.
  nl.a2.unit83.lesson02.exercise07.write_cycled_home:
    instruction: جملهٔ خواسته‌شده را با گذشتهٔ ساده‌ی فعل fietsen بنویسید.
    correct_option: Ik fietste naar huis.
    accepted_answers:
    - value: Ik fietste naar huis.
      status: correct
    - value: Ik fietste naar huis
      status: correct
    feedback: '*Ik fietste naar huis* = داشتم با دوچرخه به خانه می‌رفتم.'
    prompt_blocks:
    - 'با گذشته‌ی ساده‌ی fietsen به هلندی بنویسید: داشتم با دوچرخه به خانه می‌رفتم.'
  nl.a2.unit83.lesson03.exercise01.choose_toen:
    instruction: ترتیب درست کلمه‌ها بعد از toen را انتخاب کنید.
    correct_option: Toen ik naar huis fietste, begon het te regenen.
    distractors:
    - Toen ik fietste naar huis, het begon te regenen.
    - Toen fietste ik naar huis, begon het te regenen.
    - Toen ik naar huis fietste, het begon te regenen.
    accepted_answers:
    - value: Toen ik naar huis fietste, begon het te regenen.
      status: correct
    feedback: 'فعل جملهٔ وابسته در *toen ik naar huis fietste* آخر می‌آید و بعد از آن فعل و فاعل جابه‌جا می‌شوند: *begon het*.'
    prompt_blocks:
    - جمله‌ای را انتخاب کنید که toen دارد و فعل در جمله‌ی پیرو آخر جمله می‌آید.
  nl.a2.unit83.lesson03.exercise02.listen_while:
    instruction: گوش کنید و چیزی را که می‌شنوید انتخاب کنید.
    correct_option: Terwijl ik op de bus wachtte, belde Lotte.
    distractors:
    - Toen ik naar huis fietste, begon het te regenen.
    - Terwijl ik naast mijn fiets stond, kwam de bus.
    - Toen ik de bus zag, liep ik naar de halte.
    accepted_answers:
    - value: Terwijl ik op de bus wachtte, belde Lotte.
      status: correct
    feedback: 'شنیدید: *Terwijl ik op de bus wachtte, belde Lotte*.'
  nl.a2.unit83.lesson03.exercise03.match_links:
    instruction: هر بند toen یا terwijl را به معنی فارسی‌اش وصل کنید.
    accepted_answers:
    - value:
      - left: Toen ik naar huis fietste
        right: وقتی داشتم با دوچرخه به خانه می‌رفتم
      - left: Terwijl ik op de bus wachtte
        right: وقتی منتظر اتوبوس بودم
