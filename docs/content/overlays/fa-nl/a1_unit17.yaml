teaching:
  nl.a1.unit17.lesson01.teach.wat_doe_je:
    title: پرسیدن درباره‌ی شغل کسی
    gloss: شغل شما چیست؟
    note: راهی استاندارد و دوستانه برای پرسیدن شغل کسی.
  nl.a1.unit17.lesson01.teach.beroep_kok:
    title: شغل / آشپز
    gloss: شغل؛ آشپز
    note: '*Het beroep* (شغل) اسمی با حرف تعریف het است. *Kok* (آشپز) برای هر جنسیتی به کار می‌رود: *een kok*، *de kok*.'
    example_gloss:
    - شغلت چیه؟
    - من آشپز هستم.
  nl.a1.unit17.lesson01.teach.werk_als_kok:
    title: گفتن اینکه آشپز هستید
    gloss: من آشپز هستم.
    note: '*Werken als* + شغل الگوی معمول برای گفتن شغل است و قبل از اسمِ شغل حرف تعریف نمی‌آید.'
  nl.a1.unit17.lesson01.teach.verpleegkundige:
    title: پرستار
    gloss: پرستار
    note: اصطلاح امروزی و بی‌جنسیت برای این حرفه که برای هر جنسی به کار می‌رود.
    example_gloss: من پرستار هستم.
  nl.a1.unit17.lesson01.teach.werk_als_verpleegkundige:
    title: گفتن اینکه پرستار هستید
    gloss: من پرستار هستم.
    note: همان الگوی *werken als* است که با *kok* دیدید.
  nl.a1.unit17.lesson02.teach.waar_werk_je:
    title: پرسیدن درباره‌ی محل کار
    gloss: کجا کار می‌کنید؟
    note: این سؤالِ بعدیِ مستقیم برای *Wat doe je voor werk?* است.
  nl.a1.unit17.lesson02.teach.werk_restaurant:
    title: کار در رستوران
    gloss: من در یک رستوران کار می‌کنم.
    note: اینجا *een restaurant* با حرف تعریف نامعین می‌آید، چون یکی از رستوران‌های متعدد است.
  nl.a1.unit17.lesson02.teach.ziekenhuis:
    title: بیمارستان
    gloss: بیمارستان (معرفه)
    note: 'اسمی با حرف تعریف het: *het ziekenhuis*.'
    example_gloss: من در بیمارستان کار می‌کنم.
  nl.a1.unit17.lesson02.teach.werk_ziekenhuis:
    title: کار در بیمارستان
    gloss: من در بیمارستان کار می‌کنم.
    note: '*Het ziekenhuis* با حرف تعریف معین می‌آید، چون در هلندی نهادی مشخص و شناخته‌شده به حساب می‌آید.'
  nl.a1.unit17.lesson02.teach.kantoor:
    title: کار در دفتر
    gloss: برخی افراد در یک دفتر کار می‌کنند.
    note: '*Op kantoor* (در دفتر) عبارتی ثابت و بدون حرف تعریف است، برخلاف *in een restaurant* و *in het ziekenhuis*.'
  nl.a1.unit17.lesson03.teach.begin_negen:
    title: ساعت شروع
    gloss: من ساعت نه شروع می‌کنم.
    note: '*Begin* شکل ik از *beginnen* (شروع کردن) است و الگوی گفتن ساعت از درس ۴ تکرار شده است.'
  nl.a1.unit17.lesson03.teach.maandag_vrijdag:
    title: روزهای کار
    gloss: من از دوشنبه تا جمعه کار می‌کنم.
    note: '*Van... tot...* همان الگوی بازه‌ی روزهای هفته از درس ۳ است.'
  nl.a1.unit17.lesson03.teach.pauze:
    title: استراحت
    gloss: استراحت
    note: 'اسمی با حرف تعریف de: *de pauze*.'
    example_gloss: ساعت دوازده یک استراحت دارم.
  nl.a1.unit17.lesson03.teach.heb_pauze:
    title: استراحت داشتن
    gloss: ساعت دوازده یک استراحت دارم.
    note: '*Pauze hebben* (استراحت داشتن) الگوی ثابت و طبیعی است.'
  nl.a1.unit17.lesson03.teach.stop_vijf:
    title: ساعت پایان
    gloss: من ساعت پنج تمام می‌کنم.
    note: '*Stop* شکل ik از *stoppen* (تمام کردن، متوقف شدن) است.'
  nl.a1.unit17.lesson03.teach.begin_en_stop:
    title: یک روز کاری کامل
    gloss: من ساعت نه شروع می‌کنم و ساعت پنج تمام می‌کنم.
    note: '*Begin* و *stop* با *en* در یک جمله می‌آیند تا یک روز کاری کامل را توصیف کنند.'
  nl.a1.unit17.lesson04.teach.third_person_rule:
    title: پایان فعل برای سوم شخص
    gloss: 'با «او» (مذکر یا مؤنث) فعل معمولاً یک -t اضافه می‌گیرد: او کار می‌کند.'
    note: '*Werk* برای *hij* و *zij* به *werkt* تبدیل می‌شود. این الگوی منظمِ سوم شخص در زمان حال هلندی است.'
  nl.a1.unit17.lesson04.teach.lotte_werkt:
    title: شغل لوته
    gloss: لوته پرستار است.
    note: '*Werkt* (نه *werk*) چون فاعل اسم یک شخص و سوم شخص است، نه *ik*.'
  nl.a1.unit17.lesson04.teach.omar_werkt:
    title: شغل عمر
    gloss: عمر آشپز است.
    note: همان -t سوم شخص در *Lotte werkt als verpleegkundige*.
  nl.a1.unit17.lesson04.teach.pronouns_workplaces:
    title: استفاده از ضمیر
    gloss: او در بیمارستان کار می‌کند. او در یک رستوران کار می‌کند.
    note: '*Zij* و *hij* جای نام‌های لوته و عمر می‌نشینند، ولی فعل همان شکل سوم شخص با -t را حفظ می‌کند.'
  nl.a1.unit17.lesson05.teach.profiel:
    title: خواندن دو معرفی شغلی
    gloss: لوته در بیمارستان پرستار است. ساعت هفت شروع می‌کند و از دوشنبه تا جمعه کار می‌کند. عمر در یک رستوران آشپز است. ساعت یازده شروع می‌کند و ساعت چهار استراحت دارد.
    note: شغل، محل کار و برنامه‌ی هر نفر را جداگانه دنبال کنید.
    glosses:
      werkt: کار می‌کند
      verpleegkundige: پرستار
      ziekenhuis: بیمارستان
      begint: شروع می‌شه
      zeven: هفت
      maandag: دوشنبه
      vrijdag: جمعه
      kok: آشپز / سرآشپز
      restaurant: رستوران
      elf: یازده
      pauze: استراحت
  nl.a1.unit17.lesson06.teach.lotte_curious:
    title: لوته درباره‌ی کار می‌پرسد
    gloss: 'لوته: سلام عمر! کنجکاوم بدونم، تو اصلاً چه کاره‌ای؟'
    note: '*Eigenlijk* (اصلاً، در واقع) سؤال را از حالت بازجویی درمی‌آورد و حالتی دوستانه و کنجکاوانه به آن می‌دهد.'
  nl.a1.unit17.lesson06.teach.omar_answer:
    title: عمر جواب می‌دهد
    gloss: 'عمر: من در یک رستوران آشپزم. تو چی؟'
    note: '*En jij?* روش معمول برای برگرداندن سؤال به طرف مقابل است.'
  nl.a1.unit17.lesson06.teach.lotte_answer:
    title: لوته جواب می‌دهد
    gloss: 'لوته: من در بیمارستان پرستارم.'
    note: با شغل و محل کاری که قبلاً در درس‌های قبل آمد هماهنگ است.
  nl.a1.unit17.lesson06.teach.omar_ask_hours:
    title: عمر درباره‌ی ساعت کاری می‌پرسد
    gloss: 'عمر: ساعت کاریت چطوره؟'
    note: '*Uren maken* (تحت‌اللفظی «ساعت ساختن») اصطلاحی ثابت برای گفتن برنامه‌ی ساعت کاری است.'
  nl.a1.unit17.lesson06.teach.lotte_hours:
    title: لوته ساعت کاری‌اش را می‌گوید
    gloss: 'لوته: ساعت هفت شروع می‌کنم و از دوشنبه تا جمعه کار می‌کنم.'
    note: با برنامه‌ای که قبلاً در متن خواندنی آمد هماهنگ است.
  nl.a1.unit17.lesson06.teach.omar_reaction:
    title: واکنش عمر
    gloss: 'عمر: چه زود! من دیرتر شروع می‌کنم، ساعت یازده.'
    note: با ساعت شروع عمر که قبلاً در درس پنجم آمده بود هم‌خوانی دارد.
  nl.a1.unit17.lesson06.teach.lotte_closing:
    title: لوته بحث را تمام می‌کند
    gloss: 'لوته: فکر کنم هر شغلی ریتم خودش را دارد.'
    note: یک جمله‌ی پایانی طبیعی و تأملی است؛ کافی است معنایش را بفهمید و لازم نیست دقیقاً آن را تکرار کنید.
