teaching:
  nl.a2.unit25.lesson01.teach.fietspad:
    title: مسیر دوچرخه
    gloss: مسیر دوچرخه
    note: 'اسمی با حرف تعریف het: het fietspad، ترکیبی از fiets (دوچرخه) و pad (مسیر).'
    example_gloss: مسیر دوچرخه جدید است.
  nl.a2.unit25.lesson01.teach.wat_vind_je:
    title: پرسیدن نظر
    gloss: نظرتون درباره‌ی مسیر دوچرخه‌ی جدید چیه؟
    note: Vinden van (تحت‌اللفظی «پیدا کردن از») روش معمول برای پرسیدن یا گفتن نظر درباره‌ی یک چیز مشخص است.
  nl.a2.unit25.lesson01.teach.wat_is_mening:
    title: پرسیدن مستقیم نظر
    gloss: نظر تو چیه؟
    note: Mening (نظر) شکل اسمی و مستقیم است و وقتی vinden van زیادی غیرمستقیم به نظر برسد، به کار می‌رود.
  nl.a2.unit25.lesson02.teach.volgens_mij_goed:
    title: بیان نظر
    gloss: به نظر من مسیر دوچرخه ایده‌ی خوبی است.
    note: Volgens mij (به نظر من) رایج‌ترین راه برای شروع بیان یک نظر شخصی در هلندی است.
  nl.a2.unit25.lesson02.teach.gevaarlijk:
    title: خطرناک
    gloss: خطرناک
    note: صفتی رایج برای توصیف خطر.
    example_gloss: بعضی‌ها مسیر دوچرخه را خطرناک می‌دانند.
  nl.a2.unit25.lesson02.teach.volgens_mij_gevaarlijk:
    title: نظر به‌همراه دلیل
    gloss: به نظر من مسیر دوچرخه خطرناکه، چون خیلی باریکه.
    note: Omdat (چون) جمله‌ی دلیل را شروع می‌کند؛ فعل در آن جمله به آخر می‌رود (is بعد از te smal می‌آید).
  nl.a2.unit25.lesson03.teach.ben_het_eens:
    title: موافقت کردن
    gloss: من با تو موافقم.
    note: Het eens zijn met (تحت‌اللفظی «آن را هم‌نظر بودن با») عبارت ثابت برای موافقت است.
  nl.a2.unit25.lesson03.teach.niet_eens:
    title: مخالفت کردن
    gloss: من با شما موافق نیستم.
    note: 'Niet این عبارت ثابت را منفی می‌کند: het niet met je eens zijn.'
  nl.a2.unit25.lesson03.teach.gedeeltelijk_eens:
    title: موافقت جزئی
    gloss: من تا حدی موافقم.
    note: Gedeeltelijk (تا حدی) داخل همان عبارت ثابت het met je eens zijn قرار می‌گیرد و برای پاسخ‌های ظریف‌تر مفید است.
  nl.a2.unit25.lesson04.teach.veiliger_kinderen:
    title: آوردن نکته‌ی مقابل
    gloss: از طرف دیگر، مسیر دوچرخه برای بچه‌ها امن‌تر است.
    note: Aan de andere kant (از طرف دیگر) نکته‌ای متضاد را مطرح می‌کند؛ wel در اینجا تضاد را تأکید می‌کند و یک «بله» ساده نیست.
  nl.a2.unit25.lesson04.teach.duur_bespaart:
    title: سنجیدن هزینه و فایده
    gloss: گران است، ولی از طرف دیگر در وقت صرفه‌جویی می‌کند.
    note: Maar (ولی) همراه با aan de andere kant یک تضاد کلاسیک بین مزایا و معایب می‌سازد.
  nl.a2.unit25.lesson05.teach.voetgangers:
    title: عابران پیاده
    gloss: عابران پیاده
    note: 'اسم جمع با حرف تعریف de: de voetgangers، از voet (پا) و gangers (رونده‌ها).'
    example_gloss: مسیر دوچرخه برای عابران پیاده باریک است.
  nl.a2.unit25.lesson05.teach.forumbericht:
    title: خواندن یک پست انجمن
    gloss: به نظرم مسیر دوچرخه‌ی جدید ایده‌ی بدی است. خیلی باریک است و جای کافی برای عابران پیاده نیست. از طرف دیگر، می‌فهمم که شهرداری می‌خواهد دوچرخه‌سوارهای بیشتری باشند. به نظر من باید مسیر را پهن‌تر کنند.
    note: به نظر نویسنده، دلیلش، نکته‌ی مقابلی که قبول می‌کند و پیشنهادش دقت کنید.
    glosses:
      vind: فکر کردن (درباره‌ی) / دانستن — برای بیان نظر
      nieuwe: جدید
      fietspad: مسیر دوچرخه
      slecht: بد
      idee: ایده
      te: خیلی (بیش از حد)
      smal: باریک
      weinig: کم
      ruimte: جا / فضا
      voetgangers: عابران پیاده
      andere: دیگر
      kant: طرف (aan de andere kant = از طرف دیگر)
      snap: فهمیدن (از snappen، محاوره‌ای)
      gemeente: شهرداری
      meer: بیشتر
      fietsers: دوچرخه‌سوارها
      wil: می‌خواهد (از willen)
      Volgens: طبق، به نظر (Volgens mij = به نظر من)
      moeten: باید
      pad: مسیر
      breder: پهن‌تر (صفت تفضیلی breed)
      maken: ساختن، کردن
  nl.a2.unit25.lesson06.teach.lotte_ask:
    title: Lotte نظر Omar را می‌پرسد
    gloss: 'Lotte: نظرت درباره‌ی مسیر دوچرخه‌ی جدید چیه، Omar؟'
    note: الگوی wat vind je van ...? از درس اول دوباره آمده است، این بار مستقیم خطاب به Omar.
  nl.a2.unit25.lesson06.teach.omar_opinion:
    title: Omar نظرش را می‌گوید
    gloss: 'Omar: به نظر من ایده‌ی خوبی است، چون برای دوچرخه‌سوارها امن‌تر است.'
    note: volgens mij را با دلیلی که با omdat می‌آید ترکیب می‌کند، مثل الگوی درس دوم.
  nl.a2.unit25.lesson06.teach.lotte_disagree:
    title: Lotte تا حدی مخالف است
    gloss: 'Lotte: من کاملاً با این موافق نیستم. برای عابران پیاده نسبتاً باریک است.'
    note: 'Daar (آنجا / با آن) به نظر Omar برمی‌گردد؛ helemaal (کاملاً) مخالفت را ملایم می‌کند: یعنی «نه کاملاً»، نه یک رد قاطع.'
  nl.a2.unit25.lesson06.teach.omar_concede:
    title: Omar حرف او را می‌پذیرد و جواب می‌دهد
    gloss: 'Omar: می‌فهمم، ولی از طرف دیگر الان ماشین‌های کمتری در خیابان هست.'
    note: Dat snap ik (این را می‌فهمم) حرف Lotte را می‌پذیرد، قبل از اینکه با aan de andere kant نکته‌ی مقابل را بیاورد.
  nl.a2.unit25.lesson06.teach.lotte_agree_maybe:
    title: Lotte موضعش را نرم‌تر می‌کند
    gloss: 'Lotte: درسته. شاید اگه عریض‌ترش کنن بهتر بشه.'
    note: Als (اگر) یک جمله‌ی شرطی می‌سازد؛ wordt زمان حال worden (شدن) است.
  nl.a2.unit25.lesson06.teach.omar_final_agree:
    title: عمر موافقت می‌کند
    gloss: 'عمر: بله، من هم همین‌طور فکر می‌کنم.'
    note: عبارت dat denk ik ook را از تماس تلفنی درس ۲۲ دوباره می‌بینید.
  nl.a2.unit25.lesson06.teach.vindt_form:
    title: 'Vindt: شکل سوم‌شخص مفرد'
    gloss: Omar فکر می‌کنه مسیر دوچرخه ایده‌ی خوبیه.
    note: Vindt شکل سوم‌شخص مفرد vinden (نظر داشتن، فکر کردن) است و وقتی نظر یک نفر دیگر را بیان می‌کنیم به کار می‌رود.
