course:
  title: هلندی A2
  description: هلندی سطح A2 با تمرکز بر دستور زبان، برای صحبت درباره احساسات و مراقبت از خود.
  learning_goal: فعل‌های انعکاسی را با الگوی کامل me, je, zich, ons, je, zich به کار ببرید تا بگویید چه احساسی دارید و برای مراقبت از خودتان چه می‌کنید.
units:
  nl.a2.unit103.zorg_voor_jezelf:
    title: مراقبت از خود
    description: با فعل‌های انعکاسی توضیح دهید چه احساسی دارید و برای مراقبت از خودتان چه می‌کنید.
lessons:
  nl.a2.unit103.zorg_voor_jezelf.lesson01.hoe_voel_je_je:
    title: حالتان چطور است؟ / چه احساسی دارید؟
  nl.a2.unit103.zorg_voor_jezelf.lesson02.het_hele_rijtje:
    title: کل مجموعه
  nl.a2.unit103.zorg_voor_jezelf.lesson03.wassen_of_zich_wassen:
    title: wassen یا zich wassen؟
  nl.a2.unit103.zorg_voor_jezelf.lesson04.bij_de_kapper_en_thuis:
    title: پیش آرایشگر و در خانه
  nl.a2.unit103.zorg_voor_jezelf.lesson05.noors_bericht:
    title: پیام Noor
  nl.a2.unit103.zorg_voor_jezelf.lesson06.lotte_en_omar:
    title: Lotte و Omar
teaching:
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.gezondheid:
    title: سلامت
    gloss: بیمار / سالم / خسته / درد / سر / شکم / پزشک
    note: این واژه‌ها حال بدن شما را توصیف می‌کنند.
    example_gloss:
    - Noor بیمار است.
    - Lotte سالم است.
    - Omar خسته است.
    - سرم درد می‌کند.
    - شکمم درد می‌کند.
    - Noor پیش پزشک می‌رود.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.gevoelens:
    title: احساسات
    gloss: خوشحال / عصبانی / ترسیده / غمگین / آرام / مضطرب
    note: این صفت‌ها احساسات را نام می‌برند. آن‌ها را بعد از یکی از شکل‌های zijn یا بعد از voelen + ضمیر انعکاسی به کار ببرید.
    example_gloss:
    - Omar خوشحال است.
    - Noor عصبانی است.
    - Lotte مضطرب است.
    - من می‌ترسم.
    - او غمگین است.
    - ما آرام هستیم.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.verzorging:
    title: آراستگی و بهداشت شخصی
    gloss: آرایشگر / مو / ریش / دست
    note: واژه‌هایی برای رسیدگی به ظاهر.
    example_gloss:
    - Omar پیش آرایشگر می‌رود.
    - Lotte موهای بلندی دارد.
    - این مرد ریش دارد.
    - من یک دست دارم.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.gn_voelen:
    title: 'Zich voelen: الگوی کامل'
    gloss: من احساس می‌کنم / تو احساس می‌کنی / او (مرد) احساس می‌کند / او (زن) احساس می‌کند / ما احساس می‌کنیم / شما احساس می‌کنید / آن‌ها احساس می‌کنند
    note: 'Zich voelen یک فعل انعکاسی است: ضمیر انعکاسی همیشه با فاعل مطابقت دارد. Ik: me. Jij: je. Hij, zij: zich. Wij: ons. Jullie: je. Zij (آن‌ها): zich.'
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.vraag:
    title: پرسیدن حال کسی
    gloss: حالت چطور است؟ حالم خوب است.
    note: 'هر دو je لازم است: اولی فاعل است و دومی ضمیر انعکاسی.'
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.zinnen:
    title: احساسات در بافت جمله
    gloss: احساس خستگی می‌کنم. او احساس بیماری می‌کند. ما احساس خوشحالی می‌کنیم. Lotte بیمار است. او حالش خوب نیست.
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.werkwoorden:
    title: سه فعل انعکاسی
    gloss: خود را شستن / عجله کردن / اصلاح کردن
    note: در فرهنگ لغت این فعل‌ها با zich آمده‌اند. در جمله، zich با فاعل عوض می‌شود.
    example_gloss:
    - من هر صبح خودم را می‌شویم.
    - Noor با عجله به سر کارش می‌رود.
    - Omar امروز اصلاح می‌کند.
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.tijd:
    title: زمان و سرعت
    gloss: هر صبح / امروز / امشب / همیشه / سریع / کار
    note: قید زمان اغلب اول جمله می‌آید.
    example_gloss:
    - هر صبح عجله می‌کنم.
    - امروز حالم خوب است.
    - امشب خانه‌ام.
    - تو همیشه عجله داری.
    - ما سریع خودمان را می‌شوییم.
    - لوته سر کار می‌رود.
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.gn_rijtje:
    title: 'ضمیرهای بازتابی: me، je، zich، ons'
    gloss: من عجله می‌کنم / تو عجله می‌کنی / او (مرد) عجله می‌کند / او (زن) عجله می‌کند / ما عجله می‌کنیم / شما عجله می‌کنید / آن‌ها عجله می‌کنند
    note: 'ضمیر بازتابی بعد از فاعل می‌آید: ik: me؛ jij: je؛ hij, zij, het: zich؛ wij: ons؛ jullie: je؛ zij (آن‌ها): zich. به پایان فعل هم دقت کنید: ik haast, jij haast, wij haasten.'
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.gn_zich:
    title: zich برای اسم‌ها و اسم‌های جمع هم به کار می‌رود
    gloss: لوته خودش را می‌شوید. بچه‌ها خودشان را می‌شویند. تو صورتت را اصلاح می‌کنی. ما خودمان را می‌شوییم.
    note: 'بعد از اسم خاص یا اسم عام (Lotte, de kinderen) هم مثل hij، zij یا het از zich استفاده می‌کنیم. فقط ik، jij، wij و jullie شکل خودشان را دارند: me، je، ons، je.'
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.zinnen:
    title: چهار جمله‌ی کوتاه
    gloss: من خودم را می‌شویم. تو خودت را می‌شویی. او اصلاح می‌کند. ما عجله می‌کنیم.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.lichaam:
    title: چیزهایی که می‌شود شست
    gloss: صورت / دست‌ها / دندان‌ها / ماشین / نوزاد / بچه‌ها
    note: وقتی اسم عضو بدن را می‌آورید، از mijn، je یا zijn استفاده کنید (عضو بدن خودتان مفعول بازتابی نیست).
    example_gloss:
    - دست‌هایم را می‌شویم.
    - تو صورتت را می‌شویی.
    - او دندان‌های قشنگی دارد.
    - Lotte ماشین را می‌شوید.
    - عمر نوزاد را می‌شوید.
    - بچه‌ها خانه‌اند.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.gn_lichaam:
    title: عضو بدن یا کل آدم
    gloss: من دست‌هایم را می‌شویم. من خودم را می‌شویم. تو صورتت را می‌شویی. تو خودت را می‌شویی.
    note: 'اگر اسم عضو بدن را بیاورید، از صفت ملکی (mijn، je، zijn) استفاده کنید و ضمیر بازتابی نمی‌آید. اگر اسم عضو را نیاورید، ضمیر بازتابی می‌آید. حواستان باشد: je می‌تواند «مال تو» باشد (je gezicht) یا «خودت» (wast je).'
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.gn_ander:
    title: شخص دیگر یا خودتان
    gloss: لوته ماشین را می‌شوید. لوته خودش را می‌شوید. او ریشش را اصلاح می‌کند. او خودش را اصلاح می‌کند.
    note: zich فقط وقتی می‌آید که فاعل و مفعول یک نفر باشند. اگر مفعول چیز دیگری باشد (de auto, zijn baard)، zich نمی‌آید.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.altijd_zich:
    title: همیشه بازتابی
    gloss: اشتباه کردن / حوصله‌ی کسی سر رفتن
    note: در این معناها این دو فعل همیشه با zich می‌آیند (vervelen می‌تواند به معنی «اذیت کردن کسی» هم باشد، ولی در این درس نه). ضمیر جزئی از فعل است.
    example_gloss:
    - ببخشید، اشتباه می‌کنم.
    - او امروز حوصله‌اش سر رفته.
    - حوصله‌ام سر رفته.
    - تو اشتباه نمی‌کنی.
    - ما هیچ‌وقت حوصله‌مان سر نمی‌رود.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.gn_voelen_pijn:
    title: voelen با me و بدون me
    gloss: احساس می‌کنم مریضم. درد را حس می‌کنم.
    note: وقتی voelen حال و وضع خودتان را بیان می‌کند، بازتابی است (ik voel me ziek). وقتی چیزی را حس می‌کنید، مثل de pijn، بازتابی نیست.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.gn_zelf:
    title: تأکید با -zelf
    gloss: من خودم را می‌شویم. تو خودت را می‌شویی. او خودش را می‌شوید.
    note: -zelf را فقط برای تأکید اضافه کنید، مثلاً وقتی معمولاً کس دیگری این کار را می‌کند. در جمله‌های عادی me، je و zich کافی است.
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.ontspannen:
    title: آرامش و آرایشگاه
    gloss: آرام شدن / کوتاه کردن / وان / گرم
    note: zich ontspannen هم مثل فعل‌های دیگر این درس بازتابی است.
    example_gloss:
    - در یک وان آب گرم آرام می‌شوم.
    - آرایشگر موهایم را کوتاه می‌کند.
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.volgorde_woorden:
    title: ترتیب و زمان
    gloss: اول / بعد / بعدش / شنبه / آخر هفته / چرا / هیچ‌وقت
    note: از eerst، dan و daarna برای گفتن یک برنامه‌ی کوتاه به ترتیب استفاده کنید.
    example_gloss:
    - اول اصلاح می‌کنم.
    - بعد پیش آرایشگر می‌روم.
    - بعدش خانه‌ام.
    - شنبه پیش آرایشگر می‌روم.
    - آخر هفته استراحت می‌کنم.
    - چرا او عجله دارد؟
    - هیچ‌وقت حوصله‌ام سر نمی‌رود.
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.gn_vraag:
    title: سؤال با فعل بازتابی
    gloss: حالت خوب است؟ او عجله می‌کند؟ حوصله‌ات سر رفته؟ چرا او عجله می‌کند؟
    note: 'در سؤال بله/خیر اول فعل می‌آید، بعد فاعل، بعد ضمیر بازتابی: voel jij je. با کلمه‌ی پرسشی (waarom) اول کلمه‌ی پرسشی می‌آید، بعد فعل. وقتی jij بعد از فعل می‌آید، -t آخر فعل حذف می‌شود (jij voelt، ولی voel jij).'
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.gn_voorop:
    title: اول قید زمان
    gloss: بعدش آرام می‌شوم. اول اصلاح می‌کنم. امروز احساس خستگی می‌کنم.
    note: 'وقتی جمله با قید زمان شروع می‌شود، فعل در جای دوم می‌ماند و فاعل بعد از آن می‌آید. ضمیر بازتابی هم باز بعد از فاعل است: ontspan ik me.'
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.gn_bijzin:
    title: ضمیر بازتابی بعد از dat
    gloss: فکر می‌کنم او عجله دارد. فکر می‌کنم تو اشتباه می‌کنی.
    note: 'بعد از dat، ضمیر بازتابی بعد از فاعل می‌آید و فعل صرف‌شده می‌رود آخر جمله: dat hij zich haast.'
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.bevel:
    title: گفتن اینکه کسی چه کار کند
    gloss: عجله کن! آرام باش!
    note: در امر با jij، فعل -t ندارد و ضمیر بازتابی je بعد از آن می‌آید.
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.scenario:
    title: برنامه‌ی یک شنبه
    gloss: شنبه پیش آرایشگر می‌روم. آرایشگر موهایم را کوتاه می‌کند. بعدش در خانه استراحت می‌کنم.
  nl.a2.unit103.zorg_voor_jezelf.lesson05.teach.reading:
    title: پیام Noor
    gloss: سلام لوته و عمر، این هفته حالم خوب نیست. خسته‌ام و سرم درد می‌کند. هر صبح با عجله می‌روم سر کار. امشب در یک وان آب گرم استراحت می‌کنم. شما هم احساس خستگی می‌کنید؟ با بهترین آرزوها، نور
    note: همه‌ی فعل‌های بازتابی و ضمیر هر کدام را پیدا کنید.
    glosses:
      deze: این
      week: هفته
      ook: هم
      groetjes: با بهترین آرزوها
  nl.a2.unit103.zorg_voor_jezelf.lesson05.teach.extra:
    title: کلمه‌های پیام
    gloss: این هفته / هم / با بهترین آرزوها
    note: groetjes راهی دوستانه برای تمام کردن پیام به دوستان است.
    example_gloss:
    - این هفته خسته‌ام.
    - تو هم احساس خستگی می‌کنی؟
    - با بهترین آرزوها، لوته
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt1:
    title: لوته از عمر می‌پرسد چه حسی دارد
    gloss: 'لوته: سلام عمر، امروز حالت چطور است؟'
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt2:
    title: عمر می‌گوید خسته است
    gloss: 'عمر: احساس خستگی می‌کنم. هر صبح با عجله می‌روم سر کار.'
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt3:
    title: لوته نصیحت می‌کند
    gloss: 'لوته: پس آخر هفته استراحت کن!'
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt4:
    title: عمر برنامه می‌ریزد
    gloss: 'عمر: آره، شنبه پیش آرایشگر می‌روم. بعدش در خانه استراحت می‌کنم.'
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt5:
    title: لوته درباره‌ی بی‌حوصلگی می‌پرسد
    gloss: 'لوته: آن موقع حوصله‌ات سر نمی‌رود؟'
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt6:
    title: عمر جواب می‌دهد
    gloss: 'عمر: نه، من هیچ‌وقت حوصله‌ام سر نمی‌رود.'
exercises:
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise01.kies_moe:
    instruction: جملهٔ هلندی درست را انتخاب کنید.
    correct_option: Ik voel me moe.
    distractors:
    - Ik voel moe.
    - Ik ben me moe.
    - Ik voel je moe.
    accepted_answers:
    - value: Ik voel me moe.
      status: correct
    feedback: 'وقتی voelen حال خودتان را بیان می‌کند، ضمیر بازتابی *me* لازم است: *Ik voel me moe*.'
    prompt_blocks:
    - احساس خستگی می‌کنم.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise02.kies_blij:
    instruction: جملهٔ هلندی درست را انتخاب کنید.
    correct_option: Omar voelt zich blij.
    distractors:
    - Omar voelt me blij.
    - Omar voelt ons blij.
    - Omar voelt je blij.
    accepted_answers:
    - value: Omar voelt zich blij.
      status: correct
    feedback: با hij، zij یا یک اسم خاص، ضمیر بازتابی *zich* است.
    prompt_blocks:
    - Omar احساس خوشحالی می‌کند.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise03.match_gevoelens:
    instruction: هر کلمهٔ هلندی را به معنی فارسی‌اش وصل کنید.
    accepted_answers:
    - value:
      - left: ziek
        right: بیمار
      - left: moe
        right: خسته
      - left: blij
        right: خوشحال
      - left: boos
        right: عصبانی
      - left: bang
        right: ترسیده
      - left: rustig
        right: آرام
      status: correct
    feedback: این‌ها کلمه‌های سلامتی و احساس‌اند که بعد از *voelen* به کار می‌برید.
    pairs:
    - left: ziek
      right: بیمار
    - left: moe
      right: خسته
    - left: blij
      right: خوشحال
    - left: boos
      right: عصبانی
    - left: bang
      right: ترسیده
    - left: rustig
      right: آرام
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise04.volgorde_hoe:
    instruction: کلمه‌ها را مرتب کنید تا بپرسید «حالت چطور است؟»
    correct_option: Hoe voel je je
    accepted_answers:
    - value: Hoe voel je je
      status: correct
    feedback: '*Hoe voel je je?* = حالت چطور است؟'
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise05.vul_ons:
    instruction: با ضمیر بازتابی مناسب wij جمله را کامل کنید.
    correct_option: ons
    accepted_answers:
    - value: ons
      status: correct
    feedback: ضمیر بازتابی *wij*، *ons* است.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise06.vertaal_hoe:
