course:
  title: هلندی A2
  description: هلندی سطح A2 با تمرکز بر دستور زبان، برای اشاره به چیزها و مشخص کردن آن‌ها.
  learning_goal: هنگام خرید یا انتخاب، با dit، dat، deze و die به چیزها اشاره کنید و آن‌ها را مشخص کنید و از شکل تصغیر استفاده کنید.
units:
  nl.a2.unit101.deze_die_dit_dat:
    title: این یکی، آن یکی
    description: با dit، dat، deze، die و شکل تصغیر در بازار، نانوایی، گل‌فروشی و کتاب‌فروشی به چیزها اشاره کنید و انتخاب کنید.
lessons:
  nl.a2.unit101.lesson01.dit_en_deze:
    title: 'این (نزدیک): dit و deze'
  nl.a2.unit101.lesson02.die_en_dat:
    title: 'آن (دور) و جمع: die و dat'
  nl.a2.unit101.lesson03.verkleinwoorden:
    title: 'چیزهای کوچک: تصغیر با -je'
  nl.a2.unit101.lesson04.winkelen:
    title: 'خرید: پرسیدن قیمت و انتخاب کردن'
  nl.a2.unit101.lesson05.bericht_van_noor:
    title: 'خواندن: پیامی از Noor'
  nl.a2.unit101.lesson06.lotte_en_omar:
    title: 'گفت‌وگو: Lotte و Omar در بازار'
teaching:
  nl.a2.unit101.lesson01.teach.markt:
    title: در بازار
    gloss: بازار / غرفه / سیب / گوجه‌فرنگی / پنیر
    note: 'هر اسم را همراه حرف تعریفش یاد بگیرید: de یا het. همهٔ اسم‌های این کارت با de می‌آیند.'
    example_gloss:
    - من در بازار هستم.
    - یه غرفه می‌بینم.
    - من یک سیب برمی‌دارم.
  nl.a2.unit101.lesson01.teach.bakker:
    title: پیش نانوا
    gloss: نانوا / نان / کیک / بیسکویت
    note: '*Brood* با het می‌آید؛ بقیه با de.'
    example_gloss:
    - من پیش نانوا هستم.
    - نان تازه‌ست.
    - کیک خوشمزه است.
  nl.a2.unit101.lesson01.teach.bloemist:
    title: پیش گل‌فروش
    gloss: گل‌فروش / گل رز / دسته‌گل
    note: '*Boeket* با het می‌آید؛ *roos* با de.'
    example_gloss:
    - در گل‌فروشی یک گل رز می‌بینم.
    - دسته‌گل قشنگه.
    - من یک دسته‌گل برمی‌دارم.
  nl.a2.unit101.lesson01.teach.boekwinkel:
    title: در کتاب‌فروشی
    gloss: کتاب‌فروشی / کتاب / رمان / روزنامه
    note: '*Boek* با het می‌آید؛ بقیه با de.'
    example_gloss:
    - در کتاب‌فروشی دنبال یک کتاب می‌گردم.
    - دنبال یک رمان می‌گردم.
    - روزنامه گران است.
  nl.a2.unit101.lesson01.teach.bijvoeglijk:
    title: توصیف چیزها
    gloss: تازه / خوشمزه / زیبا / ارزان / گران / بزرگ / کوچک
    note: این واژه‌ها بعد از *is* می‌آیند و تغییر نمی‌کنند.
    example_gloss:
    - گوجه‌فرنگی کوچک است.
    - کتاب ارزان است.
    - غرفه بزرگ است.
  nl.a2.unit101.lesson01.teach.gn_dit_deze:
    title: 'این: dit یا deze'
    gloss: het brood ← این نان؛ de taart ← این کیک؛ de roos ← این گل رز؛ het boek ← این کتاب.
    note: 'برای اشاره به چیزی که نزدیک شماست، با اسم‌های het از *dit* و با اسم‌های de از *deze* استفاده کنید. پس باید حرف تعریف اسم را بدانید: *dit brood* (het brood)، *deze taart* (de taart).'
  nl.a2.unit101.lesson01.teach.zinnen:
    title: دو جمله
    gloss: این نان تازه است. این کیک خوشمزه است.
  nl.a2.unit101.lesson02.teach.meervoud:
    title: جمع
    gloss: سیب‌ها / گوجه‌فرنگی‌ها / گل‌های رز / کتاب‌ها / روزنامه‌ها
    note: 'اسم‌های جمع به -s یا -en ختم می‌شوند. *Het boek* می‌شود *de boeken*: در جمع، همهٔ اسم‌ها *de* می‌گیرند.'
    example_gloss:
    - سیب‌ها ارزان‌اند.
    - گوجه‌فرنگی‌ها خوشمزه‌اند.
    - گل‌های رز زیبا هستند.
  nl.a2.unit101.lesson02.teach.gn_die_dat:
    title: 'آن: dat یا die'
    gloss: het brood ← آن نان؛ de taart ← آن کیک؛ het boek ← آن کتاب؛ de roos ← آن گل رز.
    note: 'برای اشاره به چیزی که دورتر است، با اسم‌های het از *dat* و با اسم‌های de از *die* استفاده کنید. الگو همان *dit* و *deze* است: *dit/dat* برای اسم‌های het و *deze/die* برای اسم‌های de.'
  nl.a2.unit101.lesson02.teach.gn_meervoud:
    title: 'جمع: همیشه deze یا die'
    gloss: این سیب‌ها، این کتاب‌ها؛ آن گل‌های رز، آن کتاب‌ها.
    note: 'با اسم جمع همیشه از *deze* (نزدیک) یا *die* (دور) استفاده می‌کنید، حتی اگر مفرد اسم با het بیاید: *dit boek*، اما *deze boeken*. پیش از اسم، *dit* و *dat* فقط برای اسم‌های مفرد het هستند (اما به‌تنهایی، مثل *Wat is dat?*، می‌توانند به هر چیزی اشاره کنند).'
  nl.a2.unit101.lesson02.teach.zinnen:
    title: سه جمله
    gloss: آن کیک بزرگ است. آن نان کوچک است. آن سیب‌ها ارزان‌اند.
  nl.a2.unit101.lesson03.teach.verkleinwoorden:
    title: چیزهای کوچک
    gloss: نان کوچک / کتابچه / بیسکویت کوچولو / گل رز کوچولو / سیب کوچولو / دسته‌گل کوچک
    note: شکل تصغیر چیزی کوچک یا دوست‌داشتنی را نام می‌برد. نانواها، گل‌فروش‌ها و کتاب‌فروشی‌ها مدام از آن استفاده می‌کنند.
    example_gloss:
    - این نان کوچک خوشمزه است.
    - دسته‌گل کوچک زیباست.
    - کتابچه ارزان است.
  nl.a2.unit101.lesson03.teach.gn_je:
    title: 'تصغیر: -je'
    gloss: نان ← نان کوچک؛ کتاب ← کتابچه؛ کلوچه ← کلوچهٔ کوچک؛ گل رز ← گل رز کوچک؛ گوجه‌فرنگی ← گوجه‌فرنگی کوچک.
    note: 'بیشتر کلمه‌ها فقط -je می‌گیرند: *brood* می‌شود *broodje* و *boek* می‌شود *boekje*.'
  nl.a2.unit101.lesson03.teach.bijzonder:
    title: دو اسم دیگر
    gloss: درخت / میز
    example_gloss:
    - من یک درخت می‌بینم.
    - میز بزرگ است.
  nl.a2.unit101.lesson03.teach.gn_tje_pje:
    title: 'تصغیر: -tje و -pje'
    gloss: سیب ← سیب کوچک؛ میز ← میز کوچک؛ درخت ← درخت کوچک؛ غرفه ← غرفهٔ کوچک؛ گل ← دسته‌گل کوچک.
    note: بعد از -el باید -tje بیاورید (*appeltje*). بعد از -m با مصوت بلند، -pje می‌آید (*boompje*، *kraampje*). چند کلمه تغییر بیشتری می‌کنند، مثل *bloem* که می‌شود *bloemetje*. این‌ها را همین‌طور که به آن‌ها برمی‌خورید یاد بگیرید.
  nl.a2.unit101.lesson03.teach.gn_het:
    title: تصغیر همیشه کلمهٔ het است
    gloss: 'سیب ← سیب کوچک: این سیب کوچک، آن سیب کوچک. گل رز ← گل رز کوچک: این گل رز کوچک، آن گل رز کوچک.'
    note: هر تصغیری کلمهٔ het است، حتی اگر کلمهٔ اصلی de باشد. پس *de appel* می‌شود *het appeltje* و می‌گویید *dit appeltje* و *dat appeltje*، نه *deze appeltje*.
  nl.a2.unit101.lesson03.teach.gn_meervoud_je:
    title: جمع تصغیر
    gloss: 'نان کوچک ← نان‌های کوچک: این نان‌های کوچک. کتابچه ← کتابچه‌ها: آن کتابچه‌ها. دسته‌گل کوچک ← دسته‌گل‌های کوچک. گل رز کوچک ← گل‌های رز کوچک.'
    note: 'جمع تصغیر به -jes ختم می‌شود: *broodjes*، *boekjes*، *appeltjes*، *roosjes*. در جمع مثل همیشه از *deze* و *die* استفاده می‌کنید.'
  nl.a2.unit101.lesson04.teach.prijzen:
    title: قیمت‌ها
    gloss: قیمتش چقدر است / قیمتشان چقدر است / یورو / دو / سه / چهار / پنج
    note: برای یک چیز از *kost* و برای بیشتر از یک چیز از *kosten* استفاده کنید.
    example_gloss:
    - این نان کوچک دو یورو است.
    - این گل‌های رز پنج یورو هستند.
    - آن کتاب سه یورو است.
  nl.a2.unit101.lesson04.teach.gn_kost:
    title: Kost یا kosten
    gloss: این نان کوچک چند است؟ این نان‌های کوچک چند است؟
    note: 'فعل با اسمی که به آن اشاره می‌کنید هماهنگ می‌شود: یک چیز *kost* می‌گیرد و چند چیز *kosten*.'
  nl.a2.unit101.lesson04.teach.kiezen:
    title: انتخاب کردن و پرسیدن
    gloss: من آن کتابچه را برمی‌دارم. دنبال یک رمان می‌گردم. این دسته‌گل کوچک دو یورو است.
  nl.a2.unit101.lesson04.teach.gn_alleen:
    title: Dit و dat به‌تنهایی
    gloss: آن چیست؟ آن یک گل رز است.
    note: 'وقتی بدون اسم اشاره می‌کنید و می‌پرسید چیزی چیست، از *dit* یا *dat* استفاده می‌کنید، حتی اگر آن چیز کلمهٔ de باشد: *Wat is dat? Dat is een roos.*'
  nl.a2.unit101.lesson05.teach.reading:
    title: پیام Noor
    gloss: سلام Lotte! من توی بازارم. این سیب‌ها ارزان‌اند و آن گوجه‌فرنگی‌ها خوشمزه‌اند. توی نانوایی این نان کوچک است، ولی آن نان بزرگ است. من این نان کوچک را برمی‌دارم. آن گل‌های رز قشنگ‌اند، ولی این دسته‌گل کوچک ارزان است. این دسته‌گل کوچک را برای تو برمی‌دارم!
    note: 'ببینید Noor با هر اسم از کدام کلمه استفاده می‌کند: با کلمه‌های het از dit/dat و با کلمه‌های de و جمع‌ها از deze/die.'
    glosses:
      hoi: سلام
      maar: ولی
      voor: برای
      jou: تو
      bij: در / کنار
  nl.a2.unit101.lesson06.teach.lotte_brood:
    title: Lotte نان را نشان می‌دهد
    gloss: 'Lotte: Omar، ببین! این نان تازه است.'
  nl.a2.unit101.lesson06.teach.omar_broodje:
    title: Omar به یک نان کوچک دورتر اشاره می‌کند
    gloss: 'Omar: آره، و آن نان کوچک ارزان است.'
  nl.a2.unit101.lesson06.teach.lotte_neemt:
    title: Lotte انتخاب می‌کند
    gloss: 'Lotte: پس من آن نان کوچک را برمی‌دارم. تو چی؟'
  nl.a2.unit101.lesson06.teach.omar_taart:
    title: Omar انتخاب می‌کند
    gloss: 'Omar: من این کیک و این کلوچه را برمی‌دارم.'
  nl.a2.unit101.lesson06.teach.lotte_bloemetje:
    title: Lotte دسته‌گل را می‌بیند
    gloss: 'Lotte: ببین، این دسته‌گل کوچک قشنگ است!'
  nl.a2.unit101.lesson06.teach.omar_rozen:
    title: Omar به گل‌های رز اشاره می‌کند
    gloss: 'Omar: آره، و آن گل‌های رز هم قشنگ‌اند.'
