      seinstoring: خرابی سیستم سیگنال
      rijden: حرکت می‌کنند (قطار)؛ رانندگی کردن
      tussen: بین
      geen: هیچ، نه
      treinen: قطارها
      Reizigers: مسافران
      kunnen: می‌توانند
