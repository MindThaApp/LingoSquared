teaching:
  nl.a2.unit74.lesson01.teach.vertraging:
    title: تأخیر
    gloss: تأخیر
    note: '*De vertraging* اسمی از نوع de است.'
    example_gloss: ده دقیقه تأخیر داریم.
  nl.a2.unit74.lesson01.teach.trein_vertraging:
    title: گفتن اینکه قطارتان تأخیر دارد
    gloss: قطار من تأخیر دارد.
    note: '*Vertraging hebben* (تحت‌اللفظی «تأخیر داشتن») روش معمول برای گفتن این است که قطار یا اتوبوس دیر می‌رسد.'
  nl.a2.unit74.lesson01.teach.reden_vertraging:
    title: پرسیدن دلیل تأخیر
    gloss: دلیل تأخیر چیست؟
    note: '*De reden* (دلیل) اسمی از نوع de است.'
  nl.a2.unit74.lesson02.teach.seinstoring:
    title: خرابی سیگنال
    gloss: خرابی سیگنال
    note: '*De seinstoring* اصطلاح استاندارد راه‌آهن هلند (NS) برای خرابی فنی در سیستم سیگنال‌دهی قطار است.'
    example_gloss: قطار من به‌خاطر خرابی سیگنال لغو شده است.
  nl.a2.unit74.lesson02.teach.trein_valt_uit:
    title: اعلام لغو شدن قطار
    gloss: قطار من به‌خاطر خرابی سیگنال لغو شده است.
    note: '*Uitvallen* (لغو شدن/از کار افتادن) فعل جدا‌شدنی است؛ *uit* به آخر جمله می‌رود.'
  nl.a2.unit74.lesson02.teach.volgende_trein:
    title: پرسیدن زمان حرکت قطار بعدی
    gloss: قطار بعدی کی حرکت می‌کنه؟
    note: '*Rijden* (راندن/حرکت کردن) فقط برای رانندگی با ماشین نیست؛ برای قطار و اتوبوسی که طبق برنامه حرکت می‌کنند هم به کار می‌رود.'
  nl.a2.unit74.lesson03.teach.aansluiting:
    title: ارتباط (قطار بعدی)
    gloss: اتصال بین قطارها
    note: '*De aansluiting* اسمی با حرف تعریف de است و برای قطار یا اتوبوس ارتباطی به کار می‌رود.'
    example_gloss: من در اوترخت به قطار ارتباطی‌ام نمی‌رسم.
  nl.a2.unit74.lesson03.teach.aansluiting_missen:
    title: اعلام از دست دادن قطار ارتباطی
    gloss: به‌خاطر تأخیر، به قطار بعدی‌ام نمی‌رسم.
    note: فعل *missen* (از دست دادن) در هلندی مفعول مستقیم می‌گیرد، یعنی مثل فارسی که می‌گوییم «قطار را از دست دادم»، مفعول بدون حرف اضافه می‌آید.
  nl.a2.unit74.lesson03.teach.andere_trein:
    title: پرسیدن درباره سوار شدن قطار دیگر
    gloss: می‌شه قطار دیگری سوار شم؟
    note: در *Een andere trein* (قطار دیگر) از *andere* استفاده می‌شود، شکل استاندارد صفت پیش از کلمه‌ای با حرف تعریف *de*.
  nl.a2.unit74.lesson04.teach.servicebalie:
    title: باجه خدمات
    gloss: باجهٔ خدمات
    note: '*De servicebalie* اسمی با حرف تعریف de است و کلمه استاندارد برای باجه راهنمایی در ایستگاه است.'
    example_gloss: برای کمک می‌رم باجه خدمات.
  nl.a2.unit74.lesson04.teach.help_alternatief:
    title: درخواست کمک برای مسیر جایگزین
    gloss: می‌توانید در پیدا کردن مسیر جایگزین به من کمک کنید؟
    note: '*Kunt u* شکل رسمی و مؤدبانهٔ فعل *kunnen* (توانستن) است که با *u* به کار می‌رود.'
  nl.a2.unit74.lesson04.teach.via_amsterdam:
    title: شنیدن مسیر جایگزین
    gloss: می‌تونید با قطار اینترسیتی از طریق آمرسفورت سفر کنید.
    note: '*Via* (از طریق) ایستگاه میانی مسیر جایگزین را معرفی می‌کند.'
  nl.a2.unit74.lesson05.teach.mededeling:
    title: خواندن اطلاعیهٔ اختلال
    gloss: 'اطلاعیهٔ مهم: به دلیل خرابی سیستم سیگنال، بین اوترخت و آرنهم قطاری حرکت نمی‌کند. مسافران می‌توانند از طریق آمرسفورت مسیر را عوض کنند. تأخیر تا حدود ساعت سه بعدازظهر ادامه دارد. به مسافران توصیه می‌کنیم از مسیریاب سفر استفاده کنند.'
    note: '*Vijftien uur* شکل ساعت ۲۴ ساعته برای ساعت سه بعدازظهر است و در اطلاعیه‌های عمومی هلند استاندارد است؛ در فارسی هم گاهی ساعت ۱۵ گفته می‌شود، ولی در گفتار معمولاً «سه بعدازظهر» می‌گوییم.'
    glosses:
