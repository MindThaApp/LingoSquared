  nl.a2.unit74.lesson06.teach.lotte_uitgevallen:
    title: لوته لغو شدن قطار را اعلام می‌کند
    gloss: 'لوته: ظهر بخیر، قطار من به مقصد آرنهم لغو شده. می‌خوام بدونم الان چطور می‌تونم برم اونجا.'
  nl.a2.unit74.lesson06.teach.medewerker_seinstoring:
    title: کارمند علت را توضیح می‌دهد
    gloss: 'کارمند: بله، واقعاً خرابی سیستم سیگنال داریم. می‌تونید از طریق آمرسفورت برید.'
  nl.a2.unit74.lesson06.teach.lotte_ask_time:
