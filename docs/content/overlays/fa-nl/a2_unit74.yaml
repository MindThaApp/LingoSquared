  nl.a2.unit74.lesson06.teach.medewerker_platform:
    title: کارمند شمارهٔ ریل و زمان را می‌گوید
    gloss: 'کارمند: ده دقیقه دیگه، از ریل چهار.'
  nl.a2.unit74.lesson06.teach.lotte_bericht_sturen:
    title: لوته تصمیم می‌گیرد پیام بفرستد
    gloss: 'لوته: ممنونم. یه پیام می‌فرستم که دیرتر می‌رسم.'
  nl.a2.unit74.lesson06.teach.grammar_uitgevallen:
    title: گذشتهٔ نقلی فعل uitvallen و haar/zij
    gloss: قطارش لغو شده. اون می‌تونه مسیر را عوض کنه.
    note: '*Is uitgevallen* گذشتهٔ نقلی فعل *uitvallen* (لغو شدن) است و چون تغییر وضعیت را نشان می‌دهد با *zijn* ساخته می‌شود. *Haar* (او، صفت ملکی) و *zij* (او، فاعل) شکل‌های سوم‌شخص مؤنث هستند که هنگام خلاصه کردن ماجرای لوته به کار می‌روند.'
