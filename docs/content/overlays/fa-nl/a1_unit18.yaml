teaching:
  nl.a1.unit18.lesson01.teach.appartement_woonkamer_slaapkamer:
    title: آپارتمان، اتاق نشیمن، اتاق خواب
    gloss: آپارتمان، اتاق نشیمن، اتاق خواب
    note: '*Het appartement* اسم خنثی است؛ *de woonkamer* و *de slaapkamer* اسم‌هایی از جنس غیرخنثی (عام) هستند.'
    example_gloss:
    - من یک آپارتمان دارم.
    - من یک اتاق نشیمن دارم.
    - من یک اتاق خواب دارم.
  nl.a1.unit18.lesson01.teach.keuken_badkamer:
    title: آشپزخانه، حمام
    gloss: آشپزخانه، حمام
    note: هر دوی *De keuken* و *de badkamer* اسم‌هایی از جنس غیرخنثی (عام) هستند.
    example_gloss:
    - من آشپزخانه دارم.
    - من حمام دارم.
  nl.a1.unit18.lesson01.teach.appartement_utrecht:
    title: گفتن اینکه آپارتمان دارید
    gloss: من یک آپارتمان دارم.
    note: '*Hebben* (داشتن) فعل طبیعی برای گفتن این است که چه خانه‌ای دارید؛ در فارسی هم همین‌طور با «داشتن» می‌گوییم. این یک مثال کلی است؛ آپارتمان خاص Omar (در Utrecht) بعداً در همین واحد معرفی می‌شود.'
  nl.a1.unit18.lesson01.teach.rooms_list:
    title: شمردن همهٔ اتاق‌ها
    gloss: من یک اتاق پذیرایی، یک اتاق خواب، یک آشپزخانه و یک حمام دارم.
    note: هر چهار اتاقِ واژگان این درس در یک جمله آمده‌اند، با ویرگول از هم جدا شده‌اند و پیش از آخری *en* آمده است.
  nl.a1.unit18.lesson02.teach.hoeveel_kamers:
    title: پرسیدن تعداد اتاق‌ها
    gloss: چند تا اتاق داری؟
    note: '*Hoeveel* (چند / چقدر) همان الگوی پرسش دربارهٔ مقدار را دارد که در درس‌های عدد قبلی دیدید.'
  nl.a1.unit18.lesson02.teach.twee_slaapkamers:
    title: گفتن تعداد اتاق‌ها
    gloss: من دو اتاق خواب دارم.
    note: '*Slaapkamers* جمع *slaapkamer* است که به‌طور قاعده‌مند با -s ساخته می‌شود.'
  nl.a1.unit18.lesson02.teach.drie_kamers:
    title: گفتن تعداد کل اتاق‌ها
    gloss: آپارتمان سه اتاق دارد.
    note: '*Kamers* واژه‌ای کلی برای اتاق‌هاست، نه فقط اتاق‌خواب‌ها.'
  nl.a1.unit18.lesson03.teach.balkon_tuin:
    title: بالکن، باغ
    gloss: بالکن، باغ
    note: '*Het balkon* خنثی است؛ *de tuin* اسمی از جنس غیرخنثی (عام) است.'
    example_gloss:
    - یک بالکن هست.
    - باغ ندارد.
  nl.a1.unit18.lesson03.teach.er_is_balkon:
    title: گفتن اینکه چیزی وجود دارد
    gloss: یک بالکن هست.
    note: '*Er is* ساختار معمول هلندی برای بیان وجود چیزی است، مثل «... هست» در فارسی.'
  nl.a1.unit18.lesson03.teach.geen_tuin:
    title: گفتن اینکه چیزی وجود ندارد
    gloss: باغ ندارد.
    note: '*Geen* اسم نامعین را منفی می‌کند -- *geen tuin*، نه *niet een tuin*.'
  nl.a1.unit18.lesson04.teach.gezellig:
    title: دنج
    gloss: دنج
    note: صفتی بسیار رایج و خاصِ هلندی برای فضایی گرم و دلپذیر؛ معادل دقیق تک‌کلمه‌ای در فارسی ندارد.
    example_gloss: آپارتمان کوچک ولی دنج است.
  nl.a1.unit18.lesson04.teach.klein_maar_gezellig:
    title: یک الگوی رایج برای توصیف
    gloss: آپارتمان کوچک ولی دنج است.
    note: '*Klein maar gezellig* روشی بسیار رایج و طبیعی است که هلندی‌زبان‌ها یک خانهٔ کوچک را مثبت توصیف می‌کنند.'
  nl.a1.unit18.lesson04.teach.woonkamer_groot:
    title: توصیف اندازهٔ یک اتاق
    gloss: اتاق پذیرایی بزرگ است.
    note: '*Groot* دربارهٔ یک اتاق مشخص است، نه کل خانه.'
  nl.a1.unit18.lesson04.teach.keuken_klein:
    title: توصیف اندازهٔ اتاقی دیگر
    gloss: آشپزخانه کوچک است.
    note: همان الگوی کارت قبلی با *groot*، این بار برای اتاقی دیگر و با *klein*.
  nl.a1.unit18.lesson05.teach.advertentie:
    title: خواندن یک آگهی مسکن
    gloss: 'آپارتمان در Utrecht: یک اتاق خواب، یک اتاق نشیمن، یک آشپزخانه و یک حمام. بالکن دارد، اما باغچه ندارد. آپارتمان کوچک ولی دنج است.'
    note: به تعداد اتاق‌ها، امکاناتی که هست یا نیست و برداشت کلی از خانه توجه کنید.
    glosses:
      Appartement: آپارتمان
      slaapkamer: اتاق خواب
      woonkamer: اتاق نشیمن
      keuken: آشپزخونه
      badkamer: حمام
      balkon: بالکن
      tuin: باغ
      klein: کوچک
      gezellig: دنج
  nl.a1.unit18.lesson06.teach.lotte_ask:
    title: Lotte دربارهٔ آپارتمان می‌پرسد
    gloss: 'Lotte: سلام Omar، آپارتمان جدیدت در Utrecht چطوره؟'
    note: '*Nieuwe* شکل صرف‌شدهٔ *nieuw* (جدید) است که پیش از اسم می‌آید.'
  nl.a1.unit18.lesson06.teach.omar_describe:
    title: Omar آن را توصیف می‌کند
    gloss: 'Omar: کوچیکه ولی دنجه. یک اتاق خواب، یک اتاق نشیمن، یک آشپزخونه و یک حمام دارم.'
    note: دقیقاً با آگهی مسکنی که در درس پنجم خواندید یکی است -- این آپارتمان واقعی Omar است.
  nl.a1.unit18.lesson06.teach.lotte_ask_balcony:
    title: Lotte دربارهٔ بالکن می‌پرسد
    gloss: 'Lotte: بالکن داری؟'
    note: یک سؤال مستقیم بله/خیر که *heb je ...?* را از واحدهای قبلی دوباره به کار می‌برد.
  nl.a1.unit18.lesson06.teach.omar_balcony_answer:
    title: Omar جواب می‌دهد
    gloss: 'Omar: آره، بالکن دارم، ولی باغچه ندارم.'
    note: با اطلاعات بالکن و نبودِ باغ در آگهی درس پنجم یکی است.
  nl.a1.unit18.lesson06.teach.hij_pronoun_note:
    title: استفاده از hij برای Omar
    gloss: 'به‌جای Omar می‌توانید hij هم بگویید: او بالکن دارد.'
    note: '*Hij* (او) وقتی Omar در گفتگو معرفی شد، می‌تواند جای اسمش بیاید.'
  nl.a1.unit18.lesson06.teach.lotte_reaction:
    title: Lotte با گرمی واکنش نشان می‌دهد
    gloss: 'Lotte: چه خوب! به‌زودی یه سر بهت می‌زنم.'
    note: '*Komen langs* (سر زدن) فعل جداشدنی است؛ *langs* به آخر جمله می‌رود.'
  nl.a1.unit18.lesson06.teach.omar_welcome:
    title: Omar از او استقبال می‌کند
    gloss: 'Omar: عالیه، همیشه خوش اومدی.'
    note: '*Altijd welkom* روشی گرم و طبیعی برای دعوت دوبارهٔ کسی است.'
