teaching:
  nl.a1.unit30.lesson01.teach.lang_klein:
    title: قدبلند و قدکوتاه
    gloss: قدبلند / قدکوتاه
    note: '*Lang* برای آدم قدبلند به کار می‌رود و *klein* برای آدم قدکوتاه (همان کلمه‌ای که در جاهای دیگر این دوره برای یک شیء کوچک هم استفاده می‌شود).'
    example_gloss:
    - فنا قدبلند است.
    - ساندر قدکوتاه است.
  nl.a1.unit30.lesson01.teach.oud_jong:
    title: مسن و جوان
    gloss: مسن / جوان
    note: '*Oud* و *jong* در اینجا تصور کلی از ظاهر را می‌گویند، نه تعداد دقیق سال.'
    example_gloss:
    - پدربزرگ مسنه.
    - عمر جوان است.
  nl.a1.unit30.lesson01.teach.oud_note:
    title: 'Oud: یک عدد یا یک تصور کلی'
    gloss: Oud می‌تواند تعداد دقیق سال‌ها را برساند، مثل Hoe oud ben je?، یا یک تصور کلی بدون عدد، مثل Opa is oud.
    note: '*oud* را از پرسیدن سن دقیق آدم‌ها می‌شناسید (*Hoe oud ben je?*). اینجا یعنی یک نفر چند ساله «به نظر می‌رسد»، بدون هیچ عددی.'
  nl.a1.unit30.lesson01.teach.fenna_sander_phrase:
    title: فنا قدبلند است و ساندر قدکوتاه
    gloss: فنا قدبلند است و ساندر قدکوتاه.
    note: یک جمله‌ی ساده‌ی ترکیبی با *en* (و)، که زمینه را برای مقایسه‌ی مستقیم در درس 5 آماده می‌کند.
  nl.a1.unit30.lesson02.teach.haar_noun:
    title: مو
    gloss: مو
    note: '*Haar* واژه‌ی het است: *het haar*.'
    example_gloss: عمر موهای کوتاه مشکی دارد.
  nl.a1.unit30.lesson02.teach.haar_kleuren:
    title: بلوند، قهوه‌ای و خاکستری
    gloss: بلوند / قهوه‌ای / خاکستری
    note: سه رنگ مو. *Zwart* (مشکی) قبلاً برای لباس آمده بود و اینجا برای مو دوباره به کار می‌رود.
    example_gloss:
    - لوته موهای بور دارد.
    - ساندر موهای قهوه‌ای دارد.
    - پدربزرگ موهای خاکستری داره.
  nl.a1.unit30.lesson02.teach.haar_lengte:
    title: بلند و کوتاه (مو)
    gloss: بلند / کوتاه (مو)
    note: '*Lang* (بلند) همان واژه‌ی قد در درس 1 است که اینجا برای طول مو به کار می‌رود. *Kort* (کوتاه) در اینجا تازه است.'
    example_gloss:
    - فنا موهای بلند دارد.
    - ساندر موهای کوتاه دارد.
  nl.a1.unit30.lesson02.teach.haar_agreement_note:
    title: قبل از haar صفت بدون پایانه می‌آید
    gloss: 'Haar یک واژه‌ی het است و حرف تعریف ندارد، برای همین صفت بدون پایانه می‌ماند: kort haar, lang haar, blond haar, bruin haar, grijs haar, zwart haar.'
    note: در این حالت نامعین و بدون حرف تعریف، قبل از *haar* پایانه‌ی -e نمی‌آید؛ این را با *ogen* در درس 3 مقایسه کنید که -e می‌گیرد.
  nl.a1.unit30.lesson02.teach.haar_homoniem_note:
    title: 'Haar: دو معنی'
    gloss: 'Haar دو معنی دارد: «مو» (اسم تازه‌ی این درس) و «او / مال او» (صفت ملکی از واحد 5، مثل haar moeder). از بقیه‌ی جمله می‌فهمید کدام منظور است.'
    note: 'یک هم‌نویسه‌ی واقعی در هلندی: *haar* به معنی مو (اسم) و *haar* به معنی «مال او» (صفت ملکی) دقیقاً یک‌جور نوشته می‌شوند. بقیه‌ی جمله همیشه روشن می‌کند کدام منظور است.'
    target_text: 'کلمه‌ی Haar دو معنی دارد: «مو» (اسم جدید این درس) و «او/اش» (ملکی، مثلاً haar moeder). از روی بافت جمله می‌فهمید کدام معنی است.'
  nl.a1.unit30.lesson02.teach.omar_kort_zwart:
    title: عمر موهای کوتاه مشکی دارد
    gloss: عمر موهای کوتاه مشکی دارد.
    note: '*zwart* (مشکی) را از واحد لباس‌ها، یعنی واحد 20، دوباره به کار می‌برد.'
  nl.a1.unit30.lesson02.teach.lotte_lang_blond:
    title: لوته موهای بلند بور دارد
    gloss: لوته موهای بلند بور دارد.
    note: واژه‌های طول و رنگ این درس در یک جمله‌ی طبیعی کنار هم آمده‌اند.
  nl.a1.unit30.lesson03.teach.ogen_noun:
    title: چشم‌ها
    gloss: چشم‌ها
    note: '*Ogen* جمع *het oog* است؛ جمع همیشه با *de* می‌آید.'
    example_gloss: عمر چشم‌های قهوه‌ای دارد.
  nl.a1.unit30.lesson03.teach.oog_kleuren:
    title: آبی، قهوه‌ای و سبز
    gloss: آبی / قهوه‌ای / سبز
    note: '*Blauw* (آبی) قبلاً برای لباس آمده بود؛ *bruin* (قهوه‌ای) همین الان در درس 2 برای مو یاد گرفتید؛ *groen* (سبز) اینجا تازه است.'
    example_gloss:
    - لوته چشم‌های آبی دارد.
    - ساندر چشم‌های قهوه‌ای دارد.
    - فنا چشم‌های سبز دارد.
  nl.a1.unit30.lesson03.teach.ogen_agreement_note:
    title: Ogen پایانه‌ی -e می‌گیرد
    gloss: 'با ogen (جمع) صفت یک -e اضافه می‌گیرد: blauwe ogen, bruine ogen, groene ogen.'
    note: این را با *haar* در درس 2 مقایسه کنید که صفت را بدون پایانه نگه می‌دارد؛ جمع‌ها همیشه -e می‌گیرند، چه واژه‌ی de باشد چه het.
  nl.a1.unit30.lesson03.teach.hoe_ziet_eruit:
    title: لوته چه شکلی است؟
    gloss: لوته چه شکلی است؟
    note: '*Hoe ziet ... eruit?* سؤال اصلی این واحد است؛ با آن می‌توانید درباره‌ی ظاهر هر کسی بپرسید.'
  nl.a1.unit30.lesson03.teach.antwoord_patroon:
    title: لوته موهای بلند بور و چشم‌های آبی دارد
    gloss: لوته موهای بلند بور و چشم‌های آبی دارد.
    note: یک پاسخ نمونه که مو و چشم را با *en* در یک جمله می‌آورد.
  nl.a1.unit30.lesson04.teach.lotte_intro_nina:
    title: لوته نینا را معرفی می‌کند
    gloss: 'لوته: یک دختر تازه به کافه‌ی زبان می‌آید. اسمش نینا است.'
    note: '*Er komt* (یکی می‌آید) برای معرفی کسی تازه در صحنه به کار می‌رود.'
  nl.a1.unit30.lesson04.teach.omar_ask_eruit:
    title: عمر می‌پرسد او چه شکلی است
    gloss: 'عمر: باشه! چه شکلی است؟'
    note: سؤال اصلی این واحد دوباره آمده، این بار با *ze* (او) به جای اسم.
  nl.a1.unit30.lesson04.teach.lotte_klein_kort_blond:
    title: لوته قد و موی نینا را توصیف می‌کند
    gloss: 'لوته: قدکوتاه است و موهای کوتاه بور دارد.'
    note: '*klein* از درس 1 را با واژه‌های مو از درس 2 ترکیب می‌کند.'
  nl.a1.unit30.lesson04.teach.omar_ask_ogen:
    title: عمر درباره‌ی چشم‌هایش می‌پرسد
    gloss: 'عمر: چشم‌هایش چطور؟'
    note: '*Haar* اینجا یعنی «مال او» (صفت ملکی از واحد 5)، نه «مو»؛ به یادداشت هم‌نویسه در درس 2 نگاه کنید.'
  nl.a1.unit30.lesson04.teach.lotte_groene_ogen:
    title: لوته چشم‌های نینا را توصیف می‌کند
    gloss: 'لوته: چشم‌های سبز دارد.'
    note: '*groene ogen* از درس 3 دوباره به کار رفته است.'
  nl.a1.unit30.lesson04.teach.omar_bedankt_herken:
    title: عمر او را می‌شناسد
    gloss: 'عمر: مرسی! پس او را می‌شناسم.'
    note: '*Herken ik haar wel* یعنی «مشکلی نیست، او را می‌شناسم»؛ *haar* اینجا باز هم ضمیر «او» (مفعول) است، نه «مو».'
  nl.a1.unit30.lesson05.teach.vergelijking:
    title: مقایسه‌ی ساندر و فنا
    gloss: ساندر و فنا برادر و خواهرند، ولی ظاهرشان فرق دارد. ساندر قدکوتاه است و موهای کوتاه قهوه‌ای و چشم‌های قهوه‌ای دارد. فنا از ساندر قدبلندتر است و موهای بلند قهوه‌ای و چشم‌های سبز دارد. شما چه شکلی هستید؟
    note: یک مقایسه‌ی کوتاه که همه‌ی واژه‌های رنگ و طولِ تا اینجا را دوباره به کار می‌برد و با سؤال اصلی این بخش خطاب به خواننده تمام می‌شود.
    glosses:
      broer: برادر
      zus: خواهر
      zien: به نظر رسیدن
      anders: متفاوت
      klein: کوتاه‌قد
      kort: کوتاه‌قد
      bruin: قهوه‌ای
      haar: مو
      bruine: قهوه‌ای
      ogen: چشم‌ها
      langer: قدبلندتر
      lang: بلند
      groene: سبز
      eruit: (بخشی از «eruit zien» = ظاهر داشتن / به نظر رسیدن)
  nl.a1.unit30.lesson05.teach.comparatief_note:
    title: استفادهٔ دوبارهٔ الگوی مقایسه
    gloss: 'این الگو را از مقایسه‌ها می‌شناسید: صفت + er + dan. اینجا آن را برای آدم‌ها به کار می‌برید: Fenna is langer dan Sander.'
    note: همان الگوی دقیق *صفت + -er + dan* از واحد 14 (خرید کوله‌پشتی) که حالا برای توصیف آدم‌ها به کار می‌رود، نه اشیا.
  nl.a1.unit30.lesson05.teach.langer_haar:
    title: فنا موهای بلندتری از ساندر دارد
    gloss: فنا موهای بلندتری از ساندر دارد.
    note: '*Langer* قبل از *haar* (واژه‌ی het) بدون پایانه می‌ماند، همان قاعده‌ی یادداشت درس 2، حتی در صفت تفضیلی.'
  nl.a1.unit30.lesson05.teach.ik_heb_haar:
    title: موی من کوتاه و قهوه‌ای است
    gloss: موی من کوتاه و قهوه‌ای است.
    note: یک جمله‌ی نمونه با اول شخص و *Ik heb ...*، آماده برای وقتی که ظاهر خودتان را توصیف می‌کنید.
  nl.a1.unit30.lesson06.teach.omar_kijk_is_dat_nina:
    title: عمر نینا را می‌بیند
    gloss: 'عمر: ببین، این نینا است؟ موهای کوتاه بور و چشم‌های سبز دارد.'
    note: '*Kijk* (ببین) قبلاً در گفت‌وگوی واحد 14 هم همین‌طور به کار رفته بود.'
  nl.a1.unit30.lesson06.teach.lotte_ja_dat_is_nina:
    title: لوته تأیید می‌کند
    gloss: 'لوته: آره، این نینا است!'
    note: یک تأیید کوتاه و طبیعی.
  nl.a1.unit30.lesson06.teach.nina_ben_jij_omar:
    title: نینا به عمر سلام می‌کند
    gloss: 'نینا: سلام، شما عمر هستی؟'
    note: 'یک سؤال ساده‌ی دوستانه برای احوال‌پرسی: *ben jij ...?*'
  nl.a1.unit30.lesson06.teach.omar_leuk_je_te_zien:
    title: عمر جواب سلام نینا را می‌دهد
    gloss: 'عمر: آره! از آشنایی با تو خوشحالم، نینا.'
    note: '*Leuk je te ontmoeten* عبارت رایج برای اولین دیدار واقعی است (واحد 1 را ببینید)، نه *leuk je te zien* که برای کسی است که از قبل می‌شناسید.'
  nl.a1.unit30.lesson06.teach.nina_leuk_je_ook:
    title: نینا هم همین را می‌گوید
    gloss: 'نینا: منم از آشنایی باهات خوشحالم!'
    note: گفت‌وگو تمام می‌شود؛ عمر نینا را از روی توصیف قبلی لوته شناخت.
