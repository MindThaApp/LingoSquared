course:
  title: هلندی A1
  description: 'هلندیِ مقدماتی برای توصیف ظاهر ساده‌ی آدم‌ها: تصور کلی از قد و سن، رنگ مو و چشم، سؤال اصلی Hoe ziet ... eruit? و مقایسه‌ی ظاهر دو نفر.'
