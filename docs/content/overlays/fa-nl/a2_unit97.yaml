course:
  title: هلندی A2
  description: هلندی سطح A2 با تمرکز بر دستور زبان برای انتقال پیام.
  learning_goal: با zegt dat، vraagt of و laat weten حرف یا سؤال کسی را منتقل کنید.
units:
  nl.a2.unit97.doorgeven_wat_iemand_zegt:
    title: منتقل کردن حرف دیگران
    description: با zegt dat، vraagt of و laat weten در زمان حال یک پیام را منتقل کنید.
lessons:
  nl.a2.unit97.lesson01.wat_zegt_hij:
    title: او چه می‌گوید؟
  nl.a2.unit97.lesson02.ze_vraagt_of:
    title: او می‌پرسد که آیا ...
  nl.a2.unit97.lesson03.van_ik_naar_hij:
    title: از «من» تا «او»
  nl.a2.unit97.lesson04.een_bericht_doorgeven:
    title: منتقل کردن یک پیام
  nl.a2.unit97.lesson05.een_briefje_lezen:
    title: خواندن یک یادداشت
  nl.a2.unit97.lesson06.de_collega_belt:
    title: همکار زنگ می‌زند
teaching:
  nl.a2.unit97.lesson01.teach.berichten:
    title: پیام‌ها و یادداشت‌ها
    gloss: پیام / یادداشت / تلفن / تماس گرفتن
    note: Het bericht کلمهٔ عمومی برای «پیام» است؛ het briefje یک یادداشت کوتاه نوشتنی است.
    example_gloss:
    - نور به عمر زنگ می‌زند.
    - من یک پیام دارم.
    - یادداشت خانه است.
  nl.a2.unit97.lesson01.teach.tijd:
    title: چه وقت و کجا
    gloss: بعداً / امروز / فردا / امشب / در خانه
    note: این کلمه‌های کوچک تقریباً در هر پیامی هستند.
    example_gloss:
    - من بعداً می‌آیم.
    - لوته امروز کار می‌کند.
    - فردا من خانه‌ام.
    - امشب من وقت دارم.
  nl.a2.unit97.lesson01.teach.voornaamwoorden:
    title: چه کسی حرف می‌زند
    gloss: او (مرد) / او (زن) / او (زن) / من / تو / تو
    note: Ze و zij در اینجا هر دو یعنی «او» برای یک زن. Je و jij هم هر دو بین دوستان یعنی «تو»؛ jij شکل تأکیدی است و je شکل رایج هر روز.
    example_gloss:
    - او امروز کار می‌کند.
    - او بعداً می‌آید.
    - من خانه‌ام.
  nl.a2.unit97.lesson01.teach.werkwoorden:
    title: فعل‌هایی برای پیام
    gloss: آمدن / کار کردن / گفتن / پرسیدن / هم / نه
    note: Zeggen و vragen دو فعل اصلی‌اند که برای منتقل کردن یک پیام لازم دارید.
    example_gloss:
    - من کار نمی‌کنم.
    - او هم می‌آید.
  nl.a2.unit97.lesson01.teach.gn_dat:
    title: Zeggen با dat
    gloss: 'عمر می‌گوید: «من بعداً می‌آیم.» عمر می‌گوید که او بعداً می‌آید.'
    note: برای منتقل کردن یک جمله از zegt dat استفاده کنید. حرف گوینده بعد از dat تبدیل به یک جملهٔ پیرو می‌شود و فعل (همان که با نهاد مطابقت دارد) به آخر این جمله می‌رود. ik گوینده هم به hij یا ze تبدیل می‌شود.
  nl.a2.unit97.lesson01.teach.zinnen:
    title: دو جملهٔ منتقل‌شده
    gloss: عمر می‌گوید که او بعداً می‌آید. نور می‌گوید که او امروز کار می‌کند.
  nl.a2.unit97.lesson02.teach.werk:
    title: کلمه‌های محل کار
    gloss: قرار / جلسه / همکار / کار / وقت
    note: 'Tijd بدون حرف تعریف یعنی «وقت» به طور کلی: Ik heb tijd.'
    example_gloss:
    - جلسه امروز است.
    - همکار من فردا کار می‌کند.
    - من وقت دارم.
  nl.a2.unit97.lesson02.teach.vraagwoorden:
    title: کلمه‌های پرسشی
    gloss: کجا / کی / چه کسی / آیا / است / دارد / منتظر است
    note: در نقل‌قول غیرمستقیم، برای پرسش‌های بله/خیر از of استفاده می‌شود.
    example_gloss:
    - همکار کیست؟
    - عمر کجاست؟
    - لوته کی می‌آید؟
    - آیا نور وقت دارد؟
    - آیا عمر فردا کار می‌کند؟
    - نور کجا منتظر است؟
  nl.a2.unit97.lesson02.teach.gn_of:
    title: Vragen با of
    gloss: 'او می‌پرسد: «نور وقت دارد؟» او می‌پرسد که آیا نور وقت دارد.'
    note: یک پرسش بله/خیر به of به‌اضافهٔ یک جملهٔ پیرو تبدیل می‌شود که فعلش در آخر جمله می‌آید. ترتیب کلمات پرسشی (فعل در ابتدا) از بین می‌رود.
  nl.a2.unit97.lesson02.teach.gn_vraagwoord:
    title: Vragen با waar و wanneer
    gloss: 'او می‌پرسد: «جلسه کجاست؟» او می‌پرسد جلسه کجاست.'
    note: در پرسشی که کلمهٔ پرسشی دارد، همان کلمه (waar، wanneer) می‌ماند و فعل به آخر می‌رود. کلمهٔ اضافه‌ای مثل dat یا of اضافه نمی‌شود.
  nl.a2.unit97.lesson02.teach.zinnen:
    title: دو پرسش منتقل‌شده
    gloss: او می‌پرسد که آیا عمر وقت دارد. او می‌پرسد جلسه کجاست.
  nl.a2.unit97.lesson03.teach.modaal:
    title: کلمه‌های کوچکی که تغییر می‌کنند
    gloss: می‌تواند / می‌خواهد / باید / مال من / مال او (مرد) / مال او (زن)
    note: Zijn می‌تواند به معنی «بودن» هم باشد، اما قبل از اسم، مثل zijn telefoon، یعنی «مال او (مرد)».
    example_gloss:
    - من می‌توانم بیایم.
    - من می‌خواهم کار کنم.
    - من باید کار کنم.
    - تلفن او (زن) در خانه است.
    - قرار من امروز است.
  nl.a2.unit97.lesson03.teach.gn_voornaamwoord:
    title: ضمیرها را عوض کنید
    gloss: 'عمر می‌گوید: «من تلفنم را دارم.» عمر می‌گوید که او تلفنش را دارد.'
    note: 'وقتی پیامی را منتقل می‌کنید، ik به hij یا ze تبدیل می‌شود و mijn به zijn (برای مرد) یا haar (برای زن). فعل هم عوض می‌شود: ik heb می‌شود hij heeft.'
  nl.a2.unit97.lesson03.teach.gn_contrast:
    title: نقل‌قول مستقیم در برابر منتقل کردن حرف
    gloss: 'عمر می‌گوید: «من بعداً می‌آیم.» عمر می‌گوید که او بعداً می‌آید.'
    note: 'نقل‌قول مستقیم: دو نقطه، حرف خود گوینده، و فعل در جایگاه دوم (ik kom). منتقل کردن حرف: dat، hij به‌جای ik، و فعل در آخر (hij later komt).'
  nl.a2.unit97.lesson03.teach.gn_modaal:
    title: دو فعل در آخر جمله
    gloss: 'عمر می‌گوید: «من نمی‌توانم بیایم.» عمر می‌گوید که او نمی‌تواند بیاید.'
    note: 'با kan، wil یا moet دو فعل داریم. در جملهٔ پیرو با dat هر دو در آخر جمله می‌آیند و فعل کمکی (فعل صرف‌شده) قبل از مصدر می‌آید: dat hij niet kan komen.'
  nl.a2.unit97.lesson03.teach.zinnen:
    title: دو جملهٔ منتقل‌شدهٔ دیگر
    gloss: نور می‌گوید که تلفنش در خانه است. عمر می‌گوید که او نمی‌تواند بیاید.
  nl.a2.unit97.lesson04.teach.doorgeven:
    title: منتقل کردن
    gloss: منتقل کردن / خبر دادن / از / آنجا
    note: 'Laten weten یعنی «به کسی خبر دادن». در جمله: Lotte laat weten dat ...'
    example_gloss:
    - می‌خواهم پیام را منتقل کنم.
    - یک پیام از نور هست.
    - لوته به ما خبر می‌دهد که می‌آید.
  nl.a2.unit97.lesson04.teach.gn_opening:
    title: چطور شروع کنیم
    gloss: یک پیام از نور هست. او می‌گوید که امشب خانه است.
    note: با Er is een bericht van ... شروع کنید و بعد محتوا را با zegt dat یا vraagt of منتقل کنید. بعد از جملهٔ اول می‌توانید از hij یا ze استفاده کنید.
  nl.a2.unit97.lesson04.teach.gn_laat_weten:
    title: Laten weten
    gloss: نور به ما خبر می‌دهد که فردا می‌آید. عمر به ما خبر می‌دهد که آیا وقت دارد یا نه.
    note: 'Laat weten dat راه خوبی برای منتقل کردن خبر در یک پیام است. مثل zegt dat کار می‌کند: فعل به آخر جمله می‌رود. Laat weten of منتقل می‌کند که چیزی درست است یا نه، مثل Omar laat weten of hij tijd heeft.'
  nl.a2.unit97.lesson04.teach.zinnen:
    title: یک انتقال پیام کوتاه
    gloss: یک پیام از عمر هست. او به ما خبر می‌دهد که فردا کار می‌کند.
  nl.a2.unit97.lesson05.teach.reading:
    title: یک یادداشت از عمر
    gloss: سلام لوته، یک پیام از نور هست. او می‌گوید که امشب نمی‌تواند بیاید، چون باید کار کند. او می‌پرسد که شما فردا وقت دارید یا نه. یک همکار خبر می‌دهد که جلسه ساعت نه است.
    note: 'عمر در این یادداشت دو پیام را منتقل می‌کند: پیام نور و پیام یک همکار.'
  nl.a2.unit97.lesson06.teach.d01:
    title: عمر دربارهٔ تماس تلفنی به لوته می‌گوید
    gloss: 'عمر: سلام لوته، همکار زنگ می‌زند.'
  nl.a2.unit97.lesson06.teach.d02:
    title: لوته می‌پرسد او چه می‌گوید
    gloss: 'لوته: آه، جدی؟ چه می‌گوید؟'
  nl.a2.unit97.lesson06.teach.d03:
    title: عمر پیام را منتقل می‌کند
    gloss: 'عمر: می‌گوید جلسه فردا ساعت نه است.'
  nl.a2.unit97.lesson06.teach.d04:
    title: لوته دربارهٔ یک سؤال می‌پرسد
    gloss: 'لوته: آیا می‌پرسد که من وقت دارم یا نه؟'
  nl.a2.unit97.lesson06.teach.d05:
    title: عمر تأیید می‌کند
    gloss: 'عمر: بله، می‌پرسد که شما فردا وقت دارید یا نه.'
  nl.a2.unit97.lesson06.teach.d06:
    title: لوته جواب می‌دهد
    gloss: 'لوته: خوب، من وقت دارم. به همکار خبر می‌دهم که می‌آیم.'
