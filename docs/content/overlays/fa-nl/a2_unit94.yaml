course:
  title: هلندی A2
  description: هلندی سطح A2 با تمرکز بر دستور زبان، برای گفتن اینکه کاری را برای چه انجام می‌دهید.
  learning_goal: با ساختار om ... te بگویید کاری را برای چه انجام می‌دهید، از جمله با فعل‌های جدا‌شدنی، و zodat را تشخیص بدهید.
units:
  nl.a2.unit94.om_te_en_zodat:
    title: برای اینکه
    description: 'بگویید کاری را برای چه انجام می‌دهید: کارهای بیرون از خانه، یادگیری و پس‌انداز.'
lessons:
  nl.a2.unit94.lesson01.sparen_om_te:
    title: پس‌انداز برای خرید
  nl.a2.unit94.lesson02.scheidbare_werkwoorden:
    title: 'مرتب کردن: فعل‌های جدا‌شدنی'
  nl.a2.unit94.lesson03.omdat_en_zodat:
    title: omdat یا zodat
  nl.a2.unit94.lesson04.een_lijstje:
    title: فهرست کارهای امروز
  nl.a2.unit94.lesson05.noors_dag:
    title: روز پر مشغله‌ی نور
  nl.a2.unit94.lesson06.lotte_en_omar:
    title: لوته و عمر کارهای بیرون را انجام می‌دهند
teaching:
  nl.a2.unit94.lesson01.teach.sparen:
    title: پس‌انداز و خرید
    gloss: پس‌انداز کردن / پول / خریدن / دوچرخه
    note: این‌ها اولین کلمه‌هایی هستند که برای صحبت درباره‌ی یک هدف لازم دارید.
    example_gloss:
    - من پول پس‌انداز می‌کنم.
    - من یک دوچرخه می‌خرم.
  nl.a2.unit94.lesson01.teach.boodschappen:
    title: کارهای بیرون از خانه
    gloss: بانک / پستخانه / سوپرمارکت / نان / نامه / بسته
    note: مکان‌ها و چیزهایی که برای کارهای روزمره لازم هستند.
    example_gloss:
    - من می‌روم بانک.
    - من می‌روم پستخانه.
    - من از سوپرمارکت نان می‌خرم.
  nl.a2.unit94.lesson01.teach.leren:
    title: یادگیری
    gloss: یاد گرفتن / هلندی / صحبت کردن / در یک دوره شرکت کردن
    note: '*Een cursus volgen* یعنی در یک دوره شرکت کردن.'
    example_gloss:
    - من هلندی یاد می‌گیرم.
    - من در یک دوره شرکت می‌کنم.
    - من با لوته صحبت می‌کنم.
  nl.a2.unit94.lesson01.teach.gn_om_te:
    title: 'om ... te: برای چه کاری را انجام می‌دهید'
    gloss: پس‌انداز می‌کنم تا یک دوچرخه بخرم.
    note: 'از *om ... te* + مصدر برای گفتن هدف یک کار استفاده می‌شود. در این درس مصدر (*kopen*) آخر عبارت می‌آید و *te* درست قبل از آن قرار می‌گیرد: *om een fiets te kopen*. فاعل همان فاعل بخش اول است (اینجا: *ik*).'
  nl.a2.unit94.lesson01.teach.zinnen:
    title: سه هدف
    gloss: من به سوپرمارکت می‌روم تا نان بخرم. من به پستخانه می‌روم تا نامه‌ای بفرستم. من هلندی یاد می‌گیرم تا با لوته صحبت کنم.
    note: '*Sturen* یعنی فرستادن.'
  nl.a2.unit94.lesson02.teach.scheidbaar:
    title: فعل‌هایی با جزء جدا‌شدنی
    gloss: پول برداشتن / بسته‌ای را تحویل گرفتن / قرار گذاشتن / مرتب کردن / زنگ زدن
    note: 'در جمله‌ی اصلی، کلمه‌ی کوچک (*op*، *af*) به آخر جمله می‌رود: *Ik neem geld op.* (*Bellen* کلمه‌ی کوچک ندارد.)'
    example_gloss:
    - من پول برمی‌دارم.
    - من یک بسته تحویل می‌گیرم.
    - من با لوته قرار می‌گذارم.
    - من مرتب می‌کنم.
    - من به لوته زنگ می‌زنم.
  nl.a2.unit94.lesson02.teach.gn_scheidbaar:
    title: te بین جزء جدا‌شدنی و فعل می‌آید
    gloss: برداشتن؛ تحویل گرفتن؛ قرار گذاشتن؛ مرتب کردن
    note: 'در فعل جدا‌شدنی، *te* بین جزء و فعل می‌آید: *op te nemen*، *af te spreken*. فعل‌های بدون جزء فقط *te* را قبل از خودشان می‌گیرند: *te kopen*، *te sturen*.'
  nl.a2.unit94.lesson02.teach.zinnen:
    title: چهار کار بیرون از خانه
    gloss: من به بانک می‌روم تا پول بردارم. من به پستخانه می‌روم تا یک بسته تحویل بگیرم. من به لوته زنگ می‌زنم تا قرار بگذاریم. من به خانه می‌روم تا مرتب کنم.
  nl.a2.unit94.lesson03.teach.vragen:
    title: چرا و برای چه
    gloss: چرا / برای چه / چون / تا / لازم
    note: '*Waarom* دلیل را می‌پرسد؛ *waarvoor* هدف را می‌پرسد.'
    example_gloss:
    - چرا پس‌انداز می‌کنی؟
    - برای چه پس‌انداز می‌کنی؟
    - من به پول نیاز دارم.
  nl.a2.unit94.lesson03.teach.gn_omdat:
    title: omdat دلیل را بیان می‌کند
    gloss: چرا پس‌انداز می‌کنی؟ چون به یک دوچرخه نیاز دارم.
    note: '*Omdat* دلیل را بیان می‌کند، نه هدف را. فعل صرف‌شده به آخر بند *omdat* می‌رود: *omdat ik een fiets nodig heb*. این بند فاعل و فعل خودش را دارد.'
  nl.a2.unit94.lesson03.teach.gn_doel:
    title: om ... te هدف را بیان می‌کند
    gloss: برای چه پس‌انداز می‌کنی؟ برای اینکه دوچرخه بخرم.
    note: '*Om ... te* به پرسش *waarvoor?* جواب می‌دهد و هدف را می‌گوید. فاعل جدایی ندارد: کسی که کار را انجام می‌دهد همان فاعل بخش اصلی جمله است.'
  nl.a2.unit94.lesson03.teach.gn_zodat:
    title: 'zodat: شخص دیگر'
    gloss: من به عمر کمک می‌کنم تا او به موقع آماده باشد. من آن را یادداشت می‌کنم تا تو فراموش نکنی.
    note: '*Zodat* هم هدف را بیان می‌کند، معمولاً با فاعل جدید (*hij*، *jij*)، و فعل صرف‌شده به آخر بند خودش می‌رود. فعلاً فقط آن را تشخیص بدهید؛ وقتی خودتان کار را انجام می‌دهید بیشتر از *om ... te* استفاده می‌کنید.'
  nl.a2.unit94.lesson04.teach.lijstje:
    title: فهرست من
    gloss: فهرست / امروز / اول / بعد / نانوایی / دوچرخه‌فروشی
    note: '*Eerst* و *daarna* کارهای شما را به ترتیب می‌چینند.'
    example_gloss:
    - فهرست من برای امروز.
    - من از نانوایی نان می‌خرم.
    - من از دوچرخه‌فروشی یک دوچرخه‌ی جدید می‌خرم.
  nl.a2.unit94.lesson04.teach.gn_voorop:
    title: اول عبارت om
    gloss: برای برداشتن پول به بانک می‌روم. برای خرید نان به نانوایی می‌روم.
    note: 'می‌توانید جمله را با عبارت *om ... te* شروع کنید. در این صورت فعل بلافاصله بعد از آن و قبل از فاعل می‌آید: *Om brood te kopen ga ik ...*، نه *Om brood te kopen ik ga ...*.'
  nl.a2.unit94.lesson04.teach.zinnen:
    title: کارها به ترتیب
    gloss: اول به بانک می‌روم تا پول بردارم. بعد به نانوایی می‌روم تا نان بخرم.
    note: 'بعد از *eerst* یا *daarna* در ابتدای جمله، فعل در جایگاه دوم می‌ماند: *ga ik*.'
  nl.a2.unit94.lesson05.teach.reading:
    title: فهرست نور
    gloss: نور کار زیادی دارد. اول به بانک می‌رود تا پول بردارد. بعد به پستخانه می‌رود تا یک بسته بفرستد. او هر ماه پول پس‌انداز می‌کند تا یک دوچرخه‌ی جدید بخرد. لوته به او کمک می‌کند تا به موقع آماده باشد.
  nl.a2.unit94.lesson06.teach.beurt1:
    title: لوته می‌پرسد
    gloss: 'لوته: سلام عمر، داری می‌ری پستخانه؟'
  nl.a2.unit94.lesson06.teach.beurt2:
    title: Omar توضیح می‌دهد
    gloss: 'عمر: آره، دارم می‌رم پستخانه تا یک بسته تحویل بگیرم.'
  nl.a2.unit94.lesson06.teach.beurt3:
    title: لوته کارش را می‌گوید
    gloss: 'لوته: من دارم می‌رم بانک تا پول بردارم.'
  nl.a2.unit94.lesson06.teach.beurt4:
    title: عمر می‌پرسد برای چه
    gloss: 'عمر: برای چی پول لازم داری؟'
  nl.a2.unit94.lesson06.teach.beurt5:
    title: لوته هدفش را می‌گوید
    gloss: 'لوته: دارم پس‌انداز می‌کنم تا یک دوچرخه‌ی جدید بخرم.'
  nl.a2.unit94.lesson06.teach.beurt6:
    title: عمر پیشنهاد می‌کند منتظر بماند
    gloss: 'عمر: عالیه! منتظرت می‌مانم تا با هم برویم.'
exercises:
