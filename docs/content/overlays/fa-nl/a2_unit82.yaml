  nl.a2.unit82.lesson01.exercise07.translate_contrast:
    instruction: به هلندی ترجمه کنید. در بخش گذشته از گذشتهٔ ساده و باقاعدهٔ مفرد wonen و در بخش «الان» از woon در زمان حال استفاده کنید.
    accepted_answers:
    - value: Vroeger woonde ik in een klein huis, nu woon ik in een flat.
      status: correct
    - value: Vroeger woonde ik in een klein huis. Nu woon ik in een flat.
      status: correct
    feedback: '*Vroeger woonde ik in een klein huis, nu woon ik in een flat.*'
    prompt_blocks:
    - من قبلاً در یک خانه‌ی کوچک زندگی می‌کردم؛ حالا در یک آپارتمان زندگی می‌کنم.
  nl.a2.unit82.lesson02.exercise01.choose_fietste:
    instruction: گذشتهٔ ساده و باقاعدهٔ مفرد fietsen را انتخاب کنید.
