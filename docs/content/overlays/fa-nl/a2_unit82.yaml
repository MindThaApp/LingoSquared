    feedback: 'ریشهٔ *speel* به صدای ''t kofschip ختم نمی‌شود، پس *-de* می‌گیرد: *speelde*.'
    prompt_blocks:
    - گذشته‌ی ساده‌ی باقاعده‌ی (imperfectum) فعل spelen را برای ik انتخاب کنید.
  nl.a2.unit82.lesson02.exercise03.match_forms:
