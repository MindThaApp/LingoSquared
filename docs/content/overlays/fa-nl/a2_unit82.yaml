course:
  title: هلندی A2
  description: دوره‌ی هلندی سطح متوسط که داستان لوته و عمر را ادامه می‌دهد و حالا یک بخش درباره‌ی دستور زبان و صحبت از گذشته هم دارد.
unit:
  content_key: nl.a2.unit82.hoe_het_vroeger_was
  title: How things used to be
  description: Describe repeated past habits with the regular Dutch imperfectum and contrast earlier life with the present.
teaching:
  nl.a2.unit82.lesson01.teach.tijdwoorden:
    title: قبلاً و حالا
    gloss: در گذشته، آن موقع، حالا، امروزه
    note: '*vroeger* را برای یک دوره‌ی کلی در گذشته و *toen* را برای یک زمان مشخص به کار ببرید.'
    example_gloss:
    - من قبلاً در اوترخت زندگی می‌کردم.
    - آن موقع من جوان بودم.
    - حالا من در یک آپارتمان زندگی می‌کنم.
    - امروزه من با دوچرخه سر کار می‌روم.
  nl.a2.unit82.lesson01.teach.huisvesting:
    title: خانه و اندازه
    gloss: خانه، آپارتمان، کوچک، بزرگ
    note: '*Flat* یعنی آپارتمان، به‌ویژه آپارتمانی در یک ساختمان چندطبقه.'
    example_gloss:
    - خانه کوچک است.
    - آپارتمان بزرگ است.
  nl.a2.unit82.lesson01.teach.gn_vorm:
    title: گذشته‌ی ساده‌ی باقاعده (imperfectum)
    gloss: wonen → woonde؛ werken → werkte
    note: شکل مفرد گذشته‌ی باقاعده از ریشه‌ی فعل به اضافه‌ی *-te* یا *-de* ساخته می‌شود.
  nl.a2.unit82.lesson01.teach.contrast:
    title: مقایسه‌ی قبلاً و حالا
    gloss: من قبلاً در یک خانه‌ی کوچک زندگی می‌کردم؛ حالا در یک آپارتمان زندگی می‌کنم.
    note: در بخش گذشته *woonde* و در بخش حال *woon* به کار می‌رود.
  nl.a2.unit82.lesson02.teach.werkwoorden:
    title: فعل‌های روزمره
    gloss: دوچرخه‌سواری کردن، انجام دادن/ساختن، بازی کردن، یاد گرفتن، زندگی کردن، کار کردن
    note: با این فعل‌های باقاعده می‌توانید هر دو پایانِ گذشته را تمرین کنید.
    example_gloss:
    - من با دوچرخه به مدرسه می‌روم.
    - من تکلیفم را انجام می‌دهم.
    - بچه‌ها بیرون بازی می‌کنند.
    - ما هلندی یاد می‌گیریم.
    - ما در اوترخت زندگی می‌کنیم.
    - من در بیمارستان کار می‌کنم.
  nl.a2.unit82.lesson02.teach.schoolwoorden:
    title: مدرسه و محل کار
    gloss: مدرسه، تکلیف، بیرون، بیمارستان
    note: واژه‌هایی کاربردی برای توصیف یک برنامه‌ی روزمره‌ی قدیمی.
    example_gloss:
    - من با دوچرخه به مدرسه می‌روم.
    - بعد از مدرسه تکلیفم را انجام می‌دهم.
    - ما بیرون بازی می‌کنیم.
    - لوته در بیمارستان کار می‌کند.
  nl.a2.unit82.lesson02.teach.gn_kofschip:
    title: قاعده‌ی 't kofschip
    gloss: ریشه‌ای که به t، k، f، s، ch یا p ختم شود ← -te؛ در غیر این صورت ← -de
    note: 'به آخرین صدای ریشه‌ی فعل نگاه کنید: *werk-te*، *fiets-te*، ولی *woon-de* و *leer-de*.'
  nl.a2.unit82.lesson02.teach.vormen:
    title: شش شکل مفرد
    gloss: کار می‌کردم، دوچرخه‌سواری می‌کردم، می‌ساختم، بازی می‌کردم، یاد می‌گرفتم، زندگی می‌کردم.
    note: همین شکل مفرد با *ik*، *jij* و *hij/zij* به کار می‌رود.
  nl.a2.unit82.lesson02.teach.elke_dag:
    title: هر روز
    gloss: من هر روز با دوچرخه به مدرسه می‌رفتم.
    note: '*Elke* با اسم‌هایی به کار می‌رود که حرف تعریفشان de است: *elke dag*.'
  nl.a2.unit82.lesson03.teach.gewoonte:
    title: عبارت‌های زمانیِ عادت
    gloss: همیشه، هر روز، هر تابستان، اغلب
    note: این عبارت‌ها تکرارشدنِ یک عادت در گذشته را روشن می‌کنند.
    example_gloss:
    - من همیشه با دوچرخه به مدرسه می‌رفتم.
    - من هر روز تکلیفم را انجام می‌دادم.
    - ما هر تابستان پیش پدربزرگ و مادربزرگ می‌ماندیم.
    - ما اغلب بیرون بازی می‌کردیم.
  nl.a2.unit82.lesson03.teach.familie:
    title: خانواده و محله
    gloss: پدربزرگ و مادربزرگ؛ محله
    note: '*Bij opa en oma* یعنی خانه‌ی پدربزرگ و مادربزرگ.'
    example_gloss:
    - پدربزرگ و مادربزرگ در اوترخت زندگی می‌کردند.
    - محله آرام بود.
  nl.a2.unit82.lesson03.teach.logeren:
    title: مهمان بودن
    gloss: شب مهمان ماندن / مهمان بودن
    note: '*Logeren bij* برای ماندن در خانه‌ی کسی به کار می‌رود.'
    example_gloss: ما پیش پدربزرگ و مادربزرگ می‌مانیم.
  nl.a2.unit82.lesson03.teach.gn_number:
    title: مفرد و جمع
    gloss: ik woonde؛ wij woonden
    note: 'شکل جمعِ باقاعده با افزودن *-n* به گذشته‌ی مفرد ساخته می‌شود: *werkte → werkten*، *woonde → woonden*.'
  nl.a2.unit82.lesson03.teach.chunks:
    title: چهار عبارت بی‌قاعده‌ی کاربردی
    gloss: بودم؛ داشتم؛ رفتم؛ آمدم
    note: فعلاً *was*، *had*، *ging* و *kwam* را همراه با *stond* و *deed* که در متن و گفتگو آمده‌اند، مثل واژه‌های ثابت یاد بگیرید. قاعده‌ی آن‌ها بعداً می‌آید.
  nl.a2.unit82.lesson03.teach.plural:
    title: یک عادتِ گذشته در جمع
    gloss: ما در یک محله‌ی آرام زندگی می‌کردیم و اغلب بیرون بازی می‌کردیم.
    note: 'هر دو فعلِ جمع به *-en* ختم می‌شوند: *woonden*، *speelden*.'
  nl.a2.unit82.lesson04.teach.plaats:
    title: مکان‌ها و فاصله
    gloss: نزدیکِ، دور از، مغازه، زمین بازی
    note: قبل از یک مکان از *dicht bij* و *ver van* استفاده می‌کنیم.
    example_gloss:
    - مدرسه نزدیک خانهٔ من است.
    - بیمارستان از خانهٔ من دور است.
    - مغازه در همین محله است.
    - بچه‌ها در پارک بازی مشغول بازی هستند.
  nl.a2.unit82.lesson04.teach.gn_habit:
    title: چرا اینجا گذشتهٔ ساده؟
    gloss: قبلاً هر روز با دوچرخه به مدرسه می‌رفتم.
    note: در این درس، گذشتهٔ ساده (imperfectum) برای عادت‌ها و موقعیت‌های تکراری در گذشته به کار می‌رود؛ اینجا آن را با گذشتهٔ نقلی (perfectum) مقایسه نمی‌کنیم.
  nl.a2.unit82.lesson04.teach.buurtzin:
    title: محلهٔ قدیمی
    gloss: قبلاً نزدیک مدرسه زندگی می‌کردم و همیشه در پارک بازی بازی می‌کردم.
    note: 'بعد از *en*، نهاد مشترک بعد از فعل گذشتهٔ دوم می‌آید: *en speelde ik*.'
  nl.a2.unit82.lesson04.teach.nuzin:
    title: وضعیت الان
    gloss: الان دور از مدرسه زندگی می‌کنم و در بیمارستان کار می‌کنم.
    note: هر دو فعل حال هستند، چون *nu* زمان حال را مشخص می‌کند.
  nl.a2.unit82.lesson05.teach.jeugd:
    title: کودکی
    gloss: کودکی؛ بعد از مدرسه
    note: '*Jeugd* دوره‌ای است که آدم جوان است.'
    example_gloss:
    - کودکی‌ام خوب بود.
    - بعد از مدرسه تکلیف می‌نوشتم.
  nl.a2.unit82.lesson05.teach.reading:
    title: 'متن: کودکی لوته'
    gloss: وقتی لوته کوچک بود، با پدر و مادرش در اوترخت زندگی می‌کرد. خانه‌شان کوچک بود و نزدیک مدرسه‌اش قرار داشت. هر روز با دوچرخه به مدرسه می‌رفت. بعد از مدرسه بیرون بازی می‌کرد و تکلیفش را می‌نوشت. هر تابستان لوته و پدر و مادرش پیش پدربزرگ و مادربزرگ می‌ماندند. این روزها لوته در یک آپارتمان زندگی می‌کند و به عنوان پرستار در بیمارستان کار می‌کند.
    note: عادت‌های تکراری را که با *elke dag* و *elke zomer* مشخص شده‌اند پیدا کنید، بعد تضاد با امروز را که با *tegenwoordig* مشخص شده.
  nl.a2.unit82.lesson06.teach.omar01:
    title: عمر دربارهٔ اوترخت می‌پرسد
    gloss: 'عمر: تو قبلاً هم در اوترخت زندگی می‌کردی؟'
  nl.a2.unit82.lesson06.teach.lotte01:
    title: لوته خانهٔ قدیمی‌اش را توصیف می‌کند
    gloss: 'لوته: بله، با پدر و مادرم در یک خانهٔ کوچک زندگی می‌کردم.'
  nl.a2.unit82.lesson06.teach.omar02:
    title: عمر دربارهٔ برنامهٔ روزانه می‌پرسد
    gloss: 'عمر: بعد از مدرسه چه کار می‌کردی؟'
  nl.a2.unit82.lesson06.teach.lotte02:
    title: لوته سه عادت را می‌گوید
    gloss: 'لوته: با دوچرخه به خانه می‌رفتم، بیرون بازی می‌کردم و بعد تکلیفم را می‌نوشتم.'
  nl.a2.unit82.lesson06.teach.lotte03:
    title: لوته امروز را با گذشته مقایسه می‌کند
    gloss: 'لوته: الان در یک آپارتمان زندگی می‌کنم و در بیمارستان کار می‌کنم.'
  nl.a2.unit82.lesson06.teach.gn_recap:
    title: قبلاً و حالا
    gloss: vroeger + گذشتهٔ ساده؛ nu + زمان حال
    note: برای موقعیت تکراری در گذشته از گذشتهٔ ساده و برای تضاد با وضعیت فعلی از زمان حال استفاده کنید.
