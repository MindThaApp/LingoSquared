    correct_option: werkte
    accepted_answers:
    - value: werkte
      status: correct
    feedback: ریشه به *k* ختم می‌شود، پس شکل درست *werkte* است.
  nl.a2.unit82.lesson02.exercise06.translate_played:
    instruction: به هلندی ترجمه کنید. از گذشتهٔ ساده و باقاعدهٔ مفرد spelen استفاده کنید.
    accepted_answers:
