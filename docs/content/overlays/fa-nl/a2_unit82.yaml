    instruction: جملهٔ هلندی‌ای را انتخاب کنید که به معنی «قبلاً در یک خانهٔ کوچک زندگی می‌کردم» است.
    correct_option: Vroeger woonde ik in een klein huis.
    distractors:
    - Vroeger woon ik in een klein huis.
    - Nu woonde ik in een klein huis.
    - Vroeger werkte ik in een klein huis.
