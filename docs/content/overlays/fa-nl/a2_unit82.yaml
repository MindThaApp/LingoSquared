      status: correct
    feedback: 'ریشهٔ *woon* به صدای ''t kofschip ختم نمی‌شود، پس *-de* می‌گیرد: *woonde*.'
    prompt_blocks:
    - گذشته‌ی ساده‌ی باقاعده‌ی (imperfectum) فعل wonen را برای ik انتخاب کنید.
  nl.a2.unit82.lesson01.exercise06.complete_woonde:
    instruction: جمله را با گذشتهٔ ساده و باقاعدهٔ مفرد wonen کامل کنید.
    correct_option: woonde
    accepted_answers:
