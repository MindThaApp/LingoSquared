course:
  title: هلندی A2
  description: هلندی A2 با تمرکز بر دستور زبان برای ترتیب رویدادها با voordat، nadat، wanneer و als.
  learning_goal: رویدادها را با بندهای «قبل از»، «بعد از» و «وقتی» مرتب کنید؛ با فعل در آخر بند پیرو و جابه‌جایی فعل و فاعل در جملهٔ اصلی.
units:
  nl.a2.unit93.voordat_nadat_wanneer:
    title: قبل، بعد، وقتی
    description: رویدادهای روزمره و سفر را با voordat، nadat، wanneer و als مرتب کنید.
lessons:
  nl.a2.unit93.lesson01.voordat_ik_ga:
    title: قبل از اینکه بروم
  nl.a2.unit93.lesson02.nadat_ik_gegeten_heb:
    title: بعد از اینکه غذا خوردم
  nl.a2.unit93.lesson03.voordat_of_nadat:
    title: Voordat یا nadat؟
  nl.a2.unit93.lesson04.wanneer_en_als:
    title: Wanneer و als
  nl.a2.unit93.lesson05.een_reisdag:
    title: یک روز سفر
  nl.a2.unit93.lesson06.lotte_en_omar:
    title: لوته و عمر سفر را برنامه‌ریزی می‌کنند
teaching:
  nl.a2.unit93.lesson01.teach.dagelijks:
    title: کارهای روزانه
    gloss: دوش گرفتن / صبحانه خوردن / خوردن / آشپزی کردن / مرتب کردن / تلفن زدن
    note: 'فعل *opruimen* جداشدنی است: *ik ruim op*.'
    example_gloss:
    - دوش می‌گیرم و صبحانه می‌خورم.
    - یک ساندویچ می‌خورم و چای می‌نوشم.
    - آشپزی می‌کنم و آشپزخانه را مرتب می‌کنم.
    - به لوته زنگ می‌زنم.
  nl.a2.unit93.lesson01.teach.plaatsen:
    title: مکان‌ها و زمان‌ها
    gloss: کار / به خانه (جهت) / در خانه / مغازه / به رختخواب
    note: '*Naar huis* جهت را نشان می‌دهد؛ *thuis* نشان می‌دهد کجا هستید.'
    example_gloss:
    - سر کار می‌روم.
    - به خانه می‌روم.
    - ساعت شش خانه هستم.
    - به مغازه می‌روم.
    - ساعت یازده می‌خوابم.
  nl.a2.unit93.lesson01.teach.voordat:
    title: Voordat
    gloss: قبل از اینکه
    note: '*Voordat* رویدادی را معرفی می‌کند که دومین اتفاق است.'
    example_gloss:
    - قبل از اینکه غذا بخورم، به لوته زنگ می‌زنم.
    - قبل از اینکه آشپزی کنم، به مغازه می‌روم.
    - قبل از اینکه بخوابم، چای می‌نوشم.
  nl.a2.unit93.lesson01.teach.gn_voordat:
    title: Voordat و فعل در آخر جمله
    gloss: قبل از اینکه به سر کار بروم، صبحانه می‌خورم.
    note: 'بعد از *voordat* فعل صرف‌شده به آخر جمله‌واره می‌رود: *ik naar mijn werk ga*.'
  nl.a2.unit93.lesson01.teach.gn_inversie:
    title: جابه‌جایی فعل و فاعل بعد از جمله‌واره آغازین
    gloss: بعد از voordat فعل در آخر می‌آید. اگر جمله‌واره پیرو اول بیاید، جمله اصلی با فعل صرف‌شده شروع می‌شود و بعد فاعل می‌آید.
    note: 'ویرگول جمله‌واره پیرو را می‌بندد. بعد جمله اصلی با فعل شروع می‌شود: *ontbijt ik*، نه *ik ontbijt*.'
  nl.a2.unit93.lesson01.teach.zinnen:
    title: دو جمله با voordat
    gloss: قبل از اینکه صبحانه بخورم، دوش می‌گیرم. قبل از اینکه به خانه بروم، به لوته زنگ می‌زنم.
  nl.a2.unit93.lesson02.teach.deelwoorden:
    title: اسم مفعول
    gloss: خوردن – خورده؛ آشپزی کردن – آشپزی کرده؛ دوش گرفتن – دوش گرفته؛ زنگ زدن – زنگ زده؛ کار کردن – کار کرده؛ مرتب کردن – مرتب کرده
    note: 'فعل‌های باقاعده اسم مفعول را با *ge-* و *-t* یا *-d* می‌سازند؛ *eten* بی‌قاعده است (*gegeten*)؛ در *opruimen* پیشوند *ge* وسط می‌آید: *opgeruimd*.'
    example_gloss:
    - خورده‌ام.
    - آشپزی کرده‌ام.
    - به لوته زنگ زده‌ام.
    - کار کرده‌ام و دوش گرفته‌ام.
    - آشپزخانه را مرتب کرده‌ام.
  nl.a2.unit93.lesson02.teach.aankomen:
    title: رسیدن
    gloss: رسیدن – رسیده
    note: 'فعل *aankomen* جداشدنی است: *ik kom aan*.'
    example_gloss:
    - ساعت شش می‌رسم.
    - ساعت شش رسیدم.
  nl.a2.unit93.lesson02.teach.nadat:
    title: Nadat
    gloss: بعد از
    note: '*Nadat* رویدادی را معرفی می‌کند که اول اتفاق افتاده است.'
    example_gloss:
    - بعد از اینکه غذا خوردم، میز را جمع می‌کنم.
    - بعد از اینکه کار کردم، دوش می‌گیرم.
    - بعد از اینکه آشپزی کردم، غذا می‌خورم.
  nl.a2.unit93.lesson02.teach.gn_nadat:
    title: Nadat با ماضی نقلی
    gloss: بعد از اینکه غذا خوردم، میز را جمع می‌کنم.
    note: 'بعد از *nadat* ماضی نقلی (perfectum) می‌آید و هر دو فعل در آخر جمله‌اند: *gegeten heb*.'
  nl.a2.unit93.lesson02.teach.gn_nadat_regel:
    title: قاعده‌ی nadat
    gloss: بعد از nadat ماضی نقلی (در زمان حال) به کار می‌رود. اسم مفعول و heb در آخر جمله‌اند. جمله اصلی هم با فعل صرف‌شده شروع می‌شود.
    note: 'جابه‌جایی مثل بعد از *voordat* است: *Nadat ik gegeten heb, ruim ik op* (نه *ik ruim op*).'
  nl.a2.unit93.lesson02.teach.gn_volgorde:
    title: دو ترتیب ممکن برای فعل‌ها
    gloss: 'این هم درست است: بعد از اینکه غذا خوردم، مرتب می‌کنم.'
    note: در جمله‌واره پیرو هر دو شکل *gegeten heb* و *heb gegeten* درست است. در این درس بیشتر *gegeten heb* را می‌بینید.
  nl.a2.unit93.lesson02.teach.gn_aankomen:
    title: Ben با aankomen
    gloss: بعد از اینکه رسیدم، به لوته زنگ می‌زنم.
    note: '*Aankomen* با *zijn* می‌آید، نه *hebben*: *aangekomen ben*.'
  nl.a2.unit93.lesson03.teach.reis_woorden:
    title: واژه‌های سفر
    gloss: قطار / ایستگاه / بلیت / چمدان
    note: '*Het kaartje* بلیت قطار است.'
    example_gloss:
    - قطار در ایستگاه است.
    - بلیط می‌خرم.
    - چمدانم آماده است.
  nl.a2.unit93.lesson03.teach.reis_werkwoorden:
    title: فعل‌های سفر
    gloss: حرکت کردن – حرکت کرده؛ بستن (چمدان) – بسته؛ خریدن – خریده
    note: '*Vertrekken* با *zijn* می‌آید (*vertrokken ben*)؛ *inpakken* و *kopen* با *hebben* می‌آیند. *Inpakken* جداشدنی است: *ik pak in*.'
    example_gloss:
    - قطار ساعت نه حرکت می‌کند.
    - ساعت نه راه می‌افتم.
    - چمدانم را می‌بندم.
    - یک بلیت خریده‌ام.
  nl.a2.unit93.lesson03.teach.gn_voordat_reis:
    title: 'Voordat: رویداد دوم'
    gloss: قبل از اینکه راه بیفتم، چمدانم را می‌بندم.
    note: 'جمله‌واره‌ی *voordat* رویداد دوم است: اول چمدان بستن، بعد رفتن.'
  nl.a2.unit93.lesson03.teach.gn_nadat_reis:
    title: 'Nadat: رویداد اول'
    gloss: بعد از اینکه چمدانم را بستم، راه می‌افتم.
    note: 'جمله‌واره‌ی *nadat* رویداد اول است: اول چمدان بستن، بعد رفتن. ترتیب رویدادها همان قبلی است، فقط حرف ربط فرق می‌کند.'
  nl.a2.unit93.lesson03.teach.gn_vergelijk:
    title: voordat یا nadat
    gloss: Voordat رویدادی را می‌گوید که بعداً می‌آید. Nadat رویدادی را می‌گوید که زودتر اتفاق می‌افتد.
    note: از خودتان بپرسید کدام رویداد از نظر زمانی اول است. در زمان حال، در این درس بعد از *nadat* ماضی نقلی می‌آید و بعد از *voordat* حال ساده.
  nl.a2.unit93.lesson03.teach.gn_hoofdzin_eerst:
    title: جمله اصلی اول
    gloss: قبل از اینکه راه بیفتم، چمدانم را می‌بندم.
    note: 'اگر جمله اصلی اول بیاید، جابه‌جایی فعل و فاعل نداریم: *Ik pak ...*، و جمله‌واره پیرو با فعل در آخر بعدش می‌آید.'
  nl.a2.unit93.lesson03.teach.gn_had:
    title: Nadat در داستانی درباره گذشته
    gloss: بعد از اینکه غذا خورده بودم، به لوته زنگ زدم.
    note: 'در داستانی درباره گذشته، *had* جای *heb* می‌آید (و *was* جای *ben*): *gegeten had*. جمله اصلی هم در گذشته است (*belde*).'
  nl.a2.unit93.lesson04.teach.toestand:
    title: خسته، زود، دیر، گرسنه
    gloss: خسته / زود / دیر / گرسنگی
    note: '*Honger hebben* یعنی گرسنه بودن.'
    example_gloss:
    - خسته‌ام.
    - زود می‌خوابم.
    - دیر به خانه می‌رسم.
    - گرسنه‌ام.
  nl.a2.unit93.lesson04.teach.gewoonte:
    title: عادت‌ها
    gloss: به خانه آمدن / دوچرخه / گرفتن / باریدن (باران)
    note: '*Thuiskomen* جداشدنی است: *ik kom thuis*؛ در جمله‌واره پیرو یک کلمه است: *als ik thuiskom*.'
    example_gloss:
    - ساعت شش به خانه می‌آیم.
    - با دوچرخه می‌روم.
    - سوار اتوبوس می‌شوم.
    - باران می‌بارد.
  nl.a2.unit93.lesson04.teach.wanneer_als:
    title: Wanneer و als
    gloss: هر وقت / وقتی
    note: 'در این کاربرد *wanneer* و *als* یک معنی دارند: هر بار که چیزی تکرار می‌شود.'
    example_gloss:
    - هر وقت خسته‌ام، زود می‌خوابم.
    - وقتی گرسنه‌ام، یک ساندویچ می‌خورم.
    - هر وقت باران می‌بارد، با اتوبوس می‌روم.
  nl.a2.unit93.lesson04.teach.gn_als:
    title: Als با زمان حال
    gloss: وقتی خسته‌ام، زود می‌خوابم.
    note: 'عادت در زمان حال بیان می‌شود. فعل به آخر جمله‌واره می‌رود: *ik moe ben*.'
  nl.a2.unit93.lesson04.teach.gn_wanneer_regel:
    title: قاعده‌ی wanneer و als
    gloss: با wanneer یا als می‌گویید چه چیزی مدام اتفاق می‌افتد یا چه چیزی بعداً اتفاق می‌افتد. فعل در آخر جمله‌واره است و جمله اصلی با فعل صرف‌شده شروع می‌شود.
    note: 'حواستون باشه: *als* می‌تونه معنی *اگر* هم بده. *Wanneer* فقط یعنی *وقتی*.'
  nl.a2.unit93.lesson04.teach.gn_toen:
    title: Toen در برابر als
    gloss: وقتی به خانه آمدم، لوته زنگ زد. وقتی به خانه می‌رسم، به لوته زنگ می‌زنم.
    note: '*Toen* به یک لحظه مشخص در گذشته مربوط است و با گذشته ساده (imperfectum) می‌آید. *Wanneer* و *als* به عادت‌ها و زمان حال مربوط‌اند.'
  nl.a2.unit93.lesson04.teach.gn_toen_regel:
    title: انتخاب بین toen و wanneer
    gloss: toen را برای یک لحظه در گذشته به کار می‌برید. wanneer یا als را برای یک عادت یا برای زمان حال.
    note: Toen در درس قبلی آموزش داده شده بود؛ این فقط یک یادآوری کوتاه است.
  nl.a2.unit93.lesson05.teach.lezen:
    title: روز سفر نور
    gloss: نور فردا با قطار می‌رود. قبل از اینکه راه بیفتد، چمدانش را می‌بندد. بعد از اینکه چمدانش را بست، صبحانه می‌خورد. به ایستگاه می‌رود و بلیت می‌خرد. قبل از اینکه قطار حرکت کند، قهوه می‌نوشد. وقتی می‌رسد، به لوته زنگ می‌زند.
    note: 'ترتیب رویدادها را دنبال کنید: کدام جمله‌واره می‌گوید چه چیزی اول اتفاق می‌افتد؟'
    glosses:
      morgen: فردا
      met: با
      pakt: می‌بندد
      heeft: دارد
      koopt: می‌خرد
      drinkt: می‌نوشد
      koffie: قهوه
      aankomt: می‌رسد
      belt: زنگ می‌زند
      haar: او
  nl.a2.unit93.lesson06.teach.lotte_vertrek:
    title: لوته دربارهٔ فردا می‌پرسد
    gloss: 'لوته: سلام عمر، فردا ساعت چند حرکت می‌کنی؟'
  nl.a2.unit93.lesson06.teach.omar_koffer:
    title: عمر برنامه‌اش را می‌گوید
    gloss: 'عمر: ساعت نه. قبل از اینکه حرکت کنم، چمدانم را می‌بندم.'
  nl.a2.unit93.lesson06.teach.lotte_bel:
    title: لوته می‌خواهد زنگ بزند
    gloss: 'لوته: بعد از اینکه رسیدی، به من زنگ می‌زنی؟'
  nl.a2.unit93.lesson06.teach.omar_ja:
    title: عمر موافقت می‌کند
    gloss: 'عمر: آره، بعد از اینکه رسیدم، به تو زنگ می‌زنم.'
  nl.a2.unit93.lesson06.teach.lotte_te_laat:
    title: لوته دربارهٔ تأخیر می‌پرسد
    gloss: 'لوته: اگر قطار دیر کند، چه کار می‌کنی؟'
  nl.a2.unit93.lesson06.teach.omar_koffie:
    title: عمر جواب می‌دهد
    gloss: 'عمر: اگر قطار دیر کند، قهوه می‌خورم.'
exercises:
  nl.a2.unit93.lesson01.exercise01.kies_werk:
    instruction: ترجمهٔ درست هلندی جملهٔ «قبل از اینکه بروم سر کار، صبحانه می‌خورم.» را انتخاب کنید.
    correct_option: Voordat ik naar mijn werk ga, ontbijt ik.
    distractors:
    - Voordat ik naar mijn werk ga, ik ontbijt.
    - Voordat ik ga naar mijn werk, ontbijt ik.
    - Voordat ik ontbijt, ga ik naar mijn werk.
    accepted_answers:
    - value: Voordat ik naar mijn werk ga, ontbijt ik.
      status: correct
    feedback: 'بعد از بندِ آغازینِ *voordat*، جمله‌ی اصلی با فعل شروع می‌شود: *ontbijt ik*. گزینه‌ی آخر ترتیب کارها را برعکس می‌گوید.'
    prompt_blocks:
    - قبل از اینکه به سر کار بروم، صبحانه می‌خورم.
  nl.a2.unit93.lesson01.exercise02.kies_douche:
    instruction: ترجمهٔ درست هلندی جملهٔ «قبل از اینکه صبحانه بخورم، دوش می‌گیرم.» را انتخاب کنید.
    correct_option: Voordat ik ontbijt, douche ik.
    distractors:
    - Voordat ik ontbijt, ik douche.
    - Voordat ontbijt ik, douche ik.
    - Voordat ik douche, ontbijt ik.
    accepted_answers:
    - value: Voordat ik ontbijt, douche ik.
      status: correct
    feedback: '*Voordat ik ontbijt, douche ik* = قبل از اینکه صبحانه بخورم، دوش می‌گیرم. گزینهٔ آخر ترتیب کارها را برعکس کرده است.'
    prompt_blocks:
    - قبل از اینکه صبحانه بخورم، دوش می‌گیرم.
  nl.a2.unit93.lesson01.exercise03.match_voordat:
    instruction: هر جملهٔ فرعی هلندیِ voordat را به معنی فارسی‌اش وصل کنید.
    accepted_answers:
    - value:
      - left: voordat ik ontbijt
        right: قبل از اینکه صبحانه بخورم
      - left: voordat ik naar mijn werk ga
        right: قبل از اینکه به سر کار بروم
      - left: voordat ik kook
        right: قبل از اینکه آشپزی کنم
      - left: voordat ik naar bed ga
        right: قبل از اینکه بخوابم
      - left: voordat ik naar huis ga
        right: قبل از اینکه به خانه بروم
      - left: voordat ik Lotte bel
        right: قبل از اینکه به لوته زنگ بزنم
      status: correct
    feedback: فعل در پایان هر جملهٔ voordat می‌آید.
    pairs:
    - left: voordat ik ontbijt
      right: قبل از اینکه صبحانه بخورم
    - left: voordat ik naar mijn werk ga
      right: قبل از اینکه به سر کار بروم
    - left: voordat ik kook
      right: قبل از اینکه آشپزی کنم
    - left: voordat ik naar bed ga
      right: قبل از اینکه بخوابم
    - left: voordat ik naar huis ga
      right: قبل از اینکه به خانه بروم
    - left: voordat ik Lotte bel
      right: قبل از اینکه به لوته زنگ بزنم
  nl.a2.unit93.lesson01.exercise04.order_douche:
    instruction: کلمه‌ها را مرتب کنید تا بگویید «قبل از اینکه صبحانه بخورم، دوش می‌گیرم.»
