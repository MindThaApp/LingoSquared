course:
  title: هلندی A2
  description: هلندی سطح A2 با تمرکز بر دستور زبان برای درخواست، پیشنهاد و پاسخ مؤدبانه.
  learning_goal: با zou je/u ... kunnen درخواست مؤدبانه کنید، با zal ik پیشنهاد کمک بدهید، با even و eens دستورها را نرم‌تر کنید و پیشنهادها را بپذیرید یا رد کنید.
units:
  nl.a2.unit89.beleefd_vragen:
    title: درخواست‌های مؤدبانه
    description: با دوستان، همسایه‌ها و کارکنان مغازه‌ها کمک بخواهید، پیشنهاد کمک بدهید و مؤدبانه بپذیرید یا رد کنید.
lessons:
  nl.a2.unit89.lesson01.zou_je_kunnen:
    title: می‌شود به من کمک کنید؟
  nl.a2.unit89.lesson02.je_of_u:
    title: je یا u؟
  nl.a2.unit89.lesson03.zal_ik:
    title: انجامش بدهم؟
  nl.a2.unit89.lesson04.even_en_eens:
    title: even و eens
  nl.a2.unit89.lesson05.graag_of_nee_hoor:
    title: بله لطفاً یا نه، ممنون
  nl.a2.unit89.lesson06.koffie_bij_lotte:
    title: قهوه خانهٔ Lotte
teaching:
  nl.a2.unit89.lesson01.teach.buren:
    title: همسایه‌ها و مغازه‌ها
    gloss: همسایه (مرد) / همسایه (زن) / مغازه / سوپرمارکت
    note: این کلمه‌ها نام آدم‌ها و جاهایی هستند که در این درس می‌آیند.
    example_gloss:
    - همسایهٔ من مهربان است.
    - همسایه به مغازه می‌رود.
    - سوپرمارکت باز است.
  nl.a2.unit89.lesson01.teach.spullen:
    title: چیزهایی که دربارهٔ‌شان درخواست می‌کنید
    gloss: کیف / کلید / بسته / خرید
    note: '*Boodschappen* همیشه جمع است: یعنی خرید.'
    example_gloss:
    - کیف سنگین است.
    - کلید کجاست؟
    - بسته بزرگ است.
    - من خرید زیادی دارم.
  nl.a2.unit89.lesson01.teach.werkwoorden:
    title: فعل‌های درخواست
    gloss: کمک کردن / آوردن / رفتن و آوردن / خریدن
    note: '*Halen* یعنی رفتن و چیزی را آوردن.'
    example_gloss:
    - من به همسایه کمک می‌کنم.
    - من بسته را می‌آورم.
    - من می‌روم نان می‌آورم.
    - من قهوه می‌خرم.
  nl.a2.unit89.lesson01.teach.gn_zou_je:
    title: درخواست مؤدبانه با zou je ... kunnen
    gloss: می‌شود به من کمک کنید؟
    note: Zou je + چیزی که می‌خواهید + kunnen + فعل اصلی. فعل اصلی به آخر جمله می‌رود.
  nl.a2.unit89.lesson01.teach.zinnen:
    title: سه درخواست مؤدبانه
    gloss: می‌شود کلید را بیاوری؟ می‌شود بسته را بیاوری؟ می‌شود خرید را بخری؟
  nl.a2.unit89.lesson01.teach.natuurlijk:
    title: قبول کردن یک درخواست
    gloss: بله، حتماً.
  nl.a2.unit89.lesson02.teach.diensten:
    title: آدم‌ها و خدمات
    gloss: آقا / خانم / نانوا / اداره پست
    note: '*Meneer* و *mevrouw* را برای کسانی به کار ببرید که خوب نمی‌شناسیدشان.'
    example_gloss:
    - صبح بخیر، آقا.
    - بعدازظهر بخیر، خانم.
    - نانوا نان دارد.
    - اداره پست همین نزدیکی است.
  nl.a2.unit89.lesson02.teach.brood:
    title: در نانوایی و پست‌خانه
    gloss: نان / این / وزن کردن / بریدن / بسته‌بندی کردن
    note: '*Dit* به چیزی اشاره می‌کند که نزدیک شماست.'
    example_gloss:
    - نان تازه‌ست.
    - این بسته سنگین است.
  nl.a2.unit89.lesson02.teach.gn_u:
    title: je یا u
    gloss: می‌شه به من کمک کنی؟ (به دوست) / می‌شه به من کمک کنید؟ (به غریبه)
    note: با دوستان و اعضای خانواده از *je* استفاده کنید. با غریبه‌ها، افراد مسن‌تر و در خیلی از مغازه‌ها و ادارات از *u* استفاده کنید. فقط ضمیر عوض می‌شود و بقیهٔ جمله همان می‌ماند.
  nl.a2.unit89.lesson02.teach.gn_alstublieft:
    title: '«لطفاً»: alsjeblieft یا alstublieft'
    gloss: لطفاً می‌شه این رو وزن کنی؟ (دوست) / لطفاً می‌شه این رو وزن کنید؟ (رسمی)
    note: '*Alsjeblieft* با *je* می‌آید و *alstublieft* با *u*.'
  nl.a2.unit89.lesson02.teach.zinnen:
    title: درخواست‌های رسمی
    gloss: می‌شه نان رو ببرید؟ می‌شه این بسته رو وزن کنید؟ می‌شه این رو بسته‌بندی کنید؟
  nl.a2.unit89.lesson03.teach.werkwoorden:
    title: فعل‌ها برای پیشنهاد کمک
    gloss: حمل کردن / دم کردن (قهوه) / پرداخت کردن / قهوه / برای
    note: '*Koffie zetten* یعنی قهوه درست کردن.'
    example_gloss:
    - من کیف را حمل می‌کنم.
    - من برای همسایه قهوه درست می‌کنم.
    - من پول قهوه را می‌دهم.
  nl.a2.unit89.lesson03.teach.gn_zal:
    title: پیشنهاد کمک با zal ik
    gloss: کیف را بردارم؟
    note: '*Zal ik ...?* برای پیشنهاد دادن کاری است که خودتان انجام می‌دهید. فعل اصلی به آخر جمله می‌رود.'
  nl.a2.unit89.lesson03.teach.gn_voor:
    title: voor je یا voor u
    gloss: برات قهوه درست کنم؟ (دوست) / براتون قهوه درست کنم؟ (رسمی)
    note: برای گفتن اینکه کمک برای کیست، با دوست *voor je* و با غریبه *voor u* اضافه کنید.
  nl.a2.unit89.lesson03.teach.gn_contrast:
    title: درخواست یا پیشنهاد
    gloss: می‌شه کیف را ببری؟ کیف را من ببرم؟
    note: '*Zou je ... kunnen?* از طرف مقابل می‌خواهد کاری بکند. *Zal ik ...?* پیشنهاد انجام دادن کار توسط خودتان است.'
  nl.a2.unit89.lesson03.teach.zinnen:
    title: سه پیشنهاد
    gloss: قهوه درست کنم؟ خرید را من بیاورم؟ من حساب کنم؟
  nl.a2.unit89.lesson04.teach.werkwoorden:
    title: کارهای کوچک دم در
    gloss: داخل / نشستن / منتظر ماندن / نگاه کردن / دادن
    note: '*Binnen* با *komen* می‌آید (تو آمدن).'
    example_gloss:
    - همسایه می‌آید تو.
    - من روی صندلی می‌نشینم.
    - من منتظر همسایه می‌مانم.
    - من به بسته نگاه می‌کنم.
    - من کلید را می‌دهم.
  nl.a2.unit89.lesson04.teach.gn_imperatief:
    title: امر
    gloss: بیا تو. بشین. صبر کن. نگاه کن. کلید را بده.
    note: 'فعل امر همان ریشهٔ فعل است، بدون *je*: *komen* می‌شود *kom*، *gaan* می‌شود *ga*، *geven* می‌شود *geef*.'
  nl.a2.unit89.lesson04.teach.gn_even_eens:
    title: even و eens دستور را نرم‌تر می‌کنند
    gloss: بیا تو، لطفاً. بفرما بشین. یک لحظه صبر کن. یه نگاه بنداز.
    note: '*Even* و *eens* دستور را دوستانه‌تر می‌کنند. *Even* اغلب فقط درخواست را نرم می‌کند و می‌تواند کوتاه بودن کار را هم برساند.'
  nl.a2.unit89.lesson04.teach.gn_u_imperatief:
    title: دعوت مؤدبانه با u
    gloss: بفرمایید داخل. بفرمایید بنشینید.
    note: 'برای مؤدب بودن با کسی که به او *u* می‌گویید، فعل صرف‌شده را قبل از *u* بگذارید: *komt u، gaat u*.'
  nl.a2.unit89.lesson04.teach.zinnen:
    title: even در درخواست‌ها
    gloss: یه لحظه کلید را بده به من. می‌شه یه لحظه صبر کنی؟
    note: '*Me* شکل کوتاه *mij* است.'
  nl.a2.unit89.lesson05.teach.woorden:
    title: دم در
    gloss: در / باز کردن / سنگین / زیاد
    note: '*Opendoen* یک فعل است: *Zal ik de deur opendoen?*'
    example_gloss:
    - کیف سنگین است.
    - من خرید زیادی دارم.
    - در را باز کنم؟
  nl.a2.unit89.lesson05.teach.gn_accept:
    title: قبول کردن پیشنهاد
    gloss: بله لطفاً، مرسی. (دوست) / بله لطفاً، متشکرم. (رسمی)
    note: '*Graag* یعنی «بله، لطفاً». با دوستان *dank je* و در موقعیت‌های رسمی *dank u* اضافه کنید.'
  nl.a2.unit89.lesson05.teach.gn_decline:
    title: رد کردن مؤدبانهٔ پیشنهاد
    gloss: نه، ممنون، خودم از پسش برمی‌آیم.
    note: '*Het lukt wel* یعنی «از پسش برمی‌آیم». *Hoor* باعث می‌شود *nee* دوستانه به نظر برسد.'
  nl.a2.unit89.lesson05.teach.gn_verzoek:
    title: جواب دادن به درخواست
    gloss: البته. ببخشید، نمی‌شه.
    note: به یک درخواست با *Natuurlijk* بله بگویید. با *Sorry, dat lukt niet.* نه بگویید.
  nl.a2.unit89.lesson05.teach.reading:
    title: نور و همسایه‌هایش
    gloss: 'نور از سوپرمارکت بیرون می‌آید. خرید زیادی دارد و یک کیف سنگین. همسایه او را می‌بیند و می‌پرسد: کیف را من ببرم؟ نور می‌گوید: بله لطفاً، متشکرم. بعد همسایهٔ خانم می‌پرسد: در را باز کنم؟ نور می‌گوید: نه، ممنون، خودم از پسش برمی‌آیم.'
    note: دقت کنید نور کدام پیشنهاد را قبول می‌کند و کدام را رد می‌کند.
    glosses:
      uit: از (بیرون)
      zware: سنگین
      ziet: می‌بیند
      vraagt: می‌پرسه
      zegt: می‌گوید
      dan: بعد
  nl.a2.unit89.lesson06.teach.welkom:
    title: لوته از عمر استقبال می‌کند
    gloss: 'لوته: سلام عمر، بیا تو یه لحظه.'
  nl.a2.unit89.lesson06.teach.boodschappen:
    title: عمر خرید زیادی دارد
    gloss: 'عمر: مرسی. من خرید زیادی دارم.'
  nl.a2.unit89.lesson06.teach.tas:
    title: Lotte پیشنهاد کمک می‌دهد
    gloss: 'لوته: کیف را من ببرم؟'
  nl.a2.unit89.lesson06.teach.koffie:
    title: عمر رد می‌کند و درخواست می‌کند
    gloss: 'عمر: نه، ممنون، خودم از پسش برمی‌آیم. می‌شه قهوه درست کنی؟'
  nl.a2.unit89.lesson06.teach.brood:
    title: لوته قبول می‌کند و پیشنهاد بیشتری می‌دهد
    gloss: 'لوته: البته. یه لحظه بشین. نان را هم ببرم؟'
  nl.a2.unit89.lesson06.teach.graag:
    title: عمر قبول می‌کند
    gloss: 'عمر: بله لطفاً، مرسی.'
