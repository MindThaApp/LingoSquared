    note: '*Kwart voor drie* یعنی ۱۴:۴۵، مطابق برنامه.'
  nl.a1.unit04.lesson06.teach.arrival_turn:
    title: گفتن ساعت رسیدن
    gloss: 'لوته: خوب است. پس من ساعت دو آنجا هستم.'
    note: لوته برنامه دارد ساعت ۱۴:۰۰ برسد، یعنی پانزده دقیقه قبل از شروع ۱۴:۱۵.
  nl.a1.unit04.lesson06.teach.close_turn:
