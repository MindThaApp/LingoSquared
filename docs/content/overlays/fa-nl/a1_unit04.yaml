    gloss: ۱۴:۰۰ — ساعت چهارده
    note: در برنامه‌ها و اعلام‌ها معمولاً از ساعت ۲۴ ساعته استفاده می‌شود. *Veertien uur* خواندن گفتاریِ بدون ابهام برای ۱۴:۰۰ است.
  nl.a1.unit04.lesson04.teach.eighteen_hour:
    title: هجده
    gloss: ۱۸:۰۰ — ساعت هجده
    note: '*Achttien uur* شکل ساعت ۲۴ ساعته برای ۶ عصر است.'
  nl.a1.unit04.lesson04.teach.morning:
    title: هفت صبح
    gloss: ۷:۰۰ — ساعت هفت صبح
    note: '*''s Ochtends* یعنی صبح‌ها یا در صبح. *''s* در ابتدای آن جزو عبارت ثابت است.'
  nl.a1.unit04.lesson04.teach.afternoon:
    title: دو بعدازظهر
    gloss: ۱۴:۰۰ — ساعت دو بعدازظهر
    note: '*''s Middags* بعدازظهر را می‌پوشاند و از حدود ظهر شروع می‌شود؛ در گفتار ۱۲ ساعته، ۱۴:۰۰ را از ۰۲:۰۰ جدا می‌کند.'
  nl.a1.unit04.lesson04.teach.evening:
    title: هشت شب
    gloss: ۲۰:۰۰ — ساعت هشت شب
    note: '*''s Avonds* برای ساعت‌های شب به کار می‌رود، تقریباً از اواخر بعدازظهر تا نیمه‌شب.'
  nl.a1.unit04.lesson04.teach.night:
    title: دو نیمه‌شب
    gloss: ۲:۰۰ — ساعت دو نیمه‌شب
    note: '*''s Nachts* برای ساعت‌های دل شب به کار می‌رود؛ ساعت ۰۲:۰۰ طبیعتاً *twee uur ''s nachts* است.'
