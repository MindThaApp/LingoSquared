  nl.a1.unit04.lesson06.teach.start_turn:
    title: تأیید ساعت کافهٔ زبان
    gloss: 'لوته: کافهٔ زبان جمعه ساعت چند شروع می‌شود؟ عمر: ساعت دو و ربع، یعنی ساعت ۱۴:۱۵.'
    note: 'عمر هر دو شکل را صریح می‌گوید: *kwart over twee* و ۱۴.۱۵ یک زمان‌اند، مطابق ساعت خوشامدگویی در برنامه.'
