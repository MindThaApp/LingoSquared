    gloss: صبح · بعدازظهر · عصر/شب · دل شب
    note: 'مرز این بخش‌ها در هلندی تقریبی است: *ochtend* تا حدود ظهر ادامه دارد، *middag* از ظهر تا پایان بعدازظهر، *avond* تا پایان شب و *nacht* ساعت‌های دل شب را در بر می‌گیرد.'
    example_gloss:
    - من صبح‌ها قهوه می‌خورم.
    - کافهٔ زبان بعدازظهر است.
    - من عصرها کتاب می‌خوانم.
    - من شب‌ها می‌خوابم.
