    title: ساعت دو
    gloss: 2:00 — ساعت دو
    note: برای ساعتِ تمام، عدد را بگویید و بعد از آن *uur* را بیاورید.
  nl.a1.unit04.lesson01.teach.three_oclock:
    title: ساعت سه
    gloss: 3:00 — ساعت سه
    note: '*Drie uur* دقیقاً 3:00 است.'
  nl.a1.unit04.lesson01.teach.half_three:
    title: نیمهٔ راه تا سه
    gloss: 2:30 — دو و نیم
    note: 'تفاوت مهم: *half drie* ساعتِ بعدی را نام می‌برد، نه ساعتِ قبلی را. یعنی 2:30 است، نه 3:30؛ مثل «نیمِ مانده به سه»، نه «سه و نیم».'
  nl.a1.unit04.lesson01.teach.half_rule:
    title: half به ساعتِ بعدی اشاره می‌کند
    gloss: نیمِ سه = نیمهٔ راه تا ساعت سه = 2:30
    note: '*half* + ساعت را «نیمهٔ راه تا آن ساعت» بخوانید. پس *half vier* یعنی 3:30.'
  nl.a1.unit04.lesson01.teach.half_four:
    title: نیمهٔ راه تا چهار
    gloss: 3:30 — سه و نیم
    note: '*Half vier* نیمهٔ راه تا چهار است، پس یعنی 3:30.'
  nl.a1.unit04.lesson01.teach.time_answer:
    title: گفتن نیم‌ساعت
    gloss: ساعت دو و نیم است.
    note: '*Het is ...* قالب معمول برای گفتن ساعتِ حالاست.'
  nl.a1.unit04.lesson02.teach.quarter:
    title: یک ربع
    gloss: یک ربع
    note: '*Kwart* در عبارت‌های ثابتِ ساعت یعنی *kwart over* و *kwart voor* به کار می‌رود.'
    example_gloss: یک ربع پانزده دقیقه است.
  nl.a1.unit04.lesson02.teach.quarter_past_two:
    title: دو و ربع
    gloss: 2:15 — دو و ربع
    note: '*Kwart over twee* یعنی پانزده دقیقه بعد از دو.'
  nl.a1.unit04.lesson02.teach.past_rule:
    title: over یعنی بعد از
    gloss: بعد از = پس از ساعتِ تمام
    note: در عبارت‌های ساعت، *over* از ساعتی که تازه گذشته به جلو می‌شمارد.
  nl.a1.unit04.lesson02.teach.quarter_to_three:
    title: یک ربع به سه
    gloss: 2:45 — یک ربع به سه
    note: '*Kwart voor drie* پانزده دقیقه قبل از سه است، پس 2:45 می‌شود.'
  nl.a1.unit04.lesson02.teach.to_rule:
    title: voor یعنی مانده به
    gloss: مانده به = قبل از ساعتِ تمامِ بعدی
    note: در عبارت‌های ساعت، *voor* به سمت ساعتِ بعدی اشاره می‌کند.
  nl.a1.unit04.lesson02.teach.quarter_past_three:
    title: سه و ربع
    gloss: 3:15 — سه و ربع
    note: '*Over* ساعتی را نگه می‌دارد که تازه گذشته است: *kwart over drie*.'
  nl.a1.unit04.lesson02.teach.quarter_to_four:
    title: ساعت چهار الا یک‌ربع
    gloss: ۳:۴۵ — چهار الا یک‌ربع
    note: '*Voor* ساعتی را نام می‌برد که نزدیک است: *kwart voor vier* یعنی ۳:۴۵.'
  nl.a1.unit04.lesson03.teach.ask_time:
    title: پرسیدن ساعت
    gloss: ساعت چند است؟
    note: '*Hoe laat is het?* سؤال معمول و روزمره برای پرسیدن ساعت فعلی است.'
  nl.a1.unit04.lesson03.teach.tell_time:
    title: گفتن ساعت
    gloss: ساعت دو و نیم است.
    note: یادتان باشد که در هلندی، کلمهٔ ساعتِ *drie* این زمان را ۲:۳۰ می‌کند، یعنی نیم ساعت مانده به سه.
  nl.a1.unit04.lesson03.teach.ask_start:
    title: پرسیدن زمان شروع یک برنامه
    gloss: کافهٔ زبان ساعت چند شروع می‌شود؟
    note: '*Hoe laat* شروع سؤالی است که ساعت را می‌پرسد.'
  nl.a1.unit04.lesson03.teach.at_quarter:
    title: ساعت دو و ربع
    gloss: ساعت دو و ربع.
    note: وقتی می‌گویید یک اتفاق چه ساعتی می‌افتد، قبل از ساعت از *om* استفاده کنید.
  nl.a1.unit04.lesson03.teach.at_rule:
    title: استفاده از om برای زمان یک رویداد
    gloss: 'در + ساعت: ساعت دو، ساعت دو و نیم'
    note: وقتی فقط ساعت فعلی را با *Het is* می‌گویید، از *om* استفاده نکنید.
  nl.a1.unit04.lesson03.teach.late:
    title: پرسیدن اینکه دیر کرده‌اید
    gloss: من دیر کرده‌ام؟
    note: '*Laat* اینجا یعنی دیر؛ این عبارت در گفت‌وگو دربارهٔ زمان‌بندی کاملاً طبیعی است.'
  nl.a1.unit04.lesson03.teach.on_time:
    title: گفتن اینکه کسی سر وقت است
    gloss: نه، شما سر وقت هستید.
    note: '*Op tijd* یعنی سر وقت. *Je* گفت‌وگو را خودمانی نگه می‌دارد.'
  nl.a1.unit04.lesson04.teach.twenty_four_hour:
