    gloss: او (مرد) هدفون را خرید. او (زن) پولش را پس گرفت.
    note: '*Heeft* صرف سوم شخص مفرد فعل *hebben* (داشتن) است که همراه با اسم مفعول برای ساختن زمان گذشته‌ی نقلی به کار می‌رود؛ *hij* (او، مرد) و *zij* (او، زن) به‌همراه *haar* (مال او، زن) ضمیرهایی هستند که برای خلاصه کردن ماجرا به کار می‌روند.'
