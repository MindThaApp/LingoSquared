  nl.a2.unit77.lesson01.teach.koptelefoon:
    title: هدفون
    gloss: هدفون
    note: '*De koptelefoon* اسمی با حرف تعریف de است و در هلندی مفرد به کار می‌رود، یعنی یک هدفون.'
