  nl.a2.unit77.lesson01.teach.koptelefoon_kapot:
    title: گفتن اینکه هدفون خراب است
    gloss: این هدفون خراب است.
    note: '*Kapot* (خراب) برای هر چیزی گفته می‌شود که دیگر کار نمی‌کند، از وسایل برقی گرفته تا مبلمان.'
  nl.a2.unit77.lesson01.teach.linkerkant_doet_het_niet:
    title: توضیح اینکه کدام سمت کار نمی‌کند
    gloss: سمت چپ کار نمی‌کند.
    note: '*Doet het niet* (به معنای تحت‌اللفظی «آن را نمی‌کند») عبارت رایج برای دستگاه یا قطعه‌ای است که کار نمی‌کند.'
  nl.a2.unit77.lesson02.teach.geld_terug:
    title: پس گرفتن پول
    gloss: پس گرفتن پول / بازپرداخت
    note: '*Het geld terug* عبارتی ثابت است که برای بازپرداخت پول به کار می‌رود.'
    example_gloss: می‌خواهم پولم را پس بگیرم.
  nl.a2.unit77.lesson02.teach.graag_geld_terug:
    title: درخواست بازپرداخت
    gloss: می‌خواهم پولم را پس بگیرم.
    note: '*Graag* (با کمال میل / لطفاً) درخواست را مؤدبانه‌تر می‌کند و در هلندی برای درخواست مؤدبانه رایج است.'
  nl.a2.unit77.lesson02.teach.ruilen_of_geld:
    title: پرسیدن درباره‌ی تعویض یا بازپرداخت
    gloss: می‌شود عوضش کنم یا پولم را پس بگیرم؟
    note: '*Ruilen* (عوض کردن) و *het geld terugkrijgen* (پول را پس گرفتن) دو راه‌حل معمول برای یک شکایت هستند.'
