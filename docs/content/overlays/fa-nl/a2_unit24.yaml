  description: 'هلندیِ سطح مقدماتیِ بالا برای انجام یک قرار رسمی ثبت‌نام در مراجع محلی: وقت گرفتن، فهمیدن مدارک لازم و دنبال کردن یک گفت‌وگوی واقعی در gemeente.'
