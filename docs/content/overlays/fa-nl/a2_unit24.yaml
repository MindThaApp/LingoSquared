teaching:
  nl.a2.unit24.lesson01.teach.inschrijven:
    title: ثبت‌نام کردن
    gloss: ثبت‌نام کردن
    note: 'یک فعل انعکاسیِ جداشدنی: zich inschrijven. ضمیر انعکاسی با فاعل عوض می‌شود (me، je، zich و ...).'
    example_gloss: می‌خواهم در شهرداری ثبت‌نام کنم.
  nl.a2.unit24.lesson01.teach.afspraak_maken:
    title: درخواست وقت ملاقات
    gloss: می‌خواهم برای ثبت‌نام وقت ملاقات بگیرم.
    note: ساختار om ... te به‌علاوهٔ مصدر برای بیان هدف است («برای اینکه»)؛ در me in te schrijven فعل جداشدنیِ inschrijven دور ضمیر انعکاسی از هم جدا می‌شود.
  nl.a2.unit24.lesson01.teach.wanneer_tijd:
    title: پرسیدن دربارهٔ زمان آزاد
    gloss: کی وقت دارید؟
    note: یک راه مستقیم و کاربردی برای پرسیدن دربارهٔ زمان‌بندی، با ضمیر رسمی u.
  nl.a2.unit24.lesson01.teach.zou_schikken:
    title: شرطیِ مؤدبانه
    gloss: چهارشنبه ساعت ده برایتان مناسب است؟
    note: Zou به‌علاوهٔ مصدر شرطیِ مؤدبانه است و از جملهٔ خبریِ مستقیم ملایم‌تر است؛ نشانهٔ سبک رسمی در سطح A2.
  nl.a2.unit24.lesson01.teach.komt_goed_uit:
    title: تأیید مناسب بودن ساعت
    gloss: بله، خوب است.
    note: Komt goed uit (تحت‌اللفظی «خوب درمی‌آید») راه طبیعی برای تأیید این است که زمان یا برنامهٔ پیشنهادی برایتان مناسب است.
  nl.a2.unit24.lesson02.teach.paspoort:
    title: گذرنامه
    gloss: پاسپورت
    note: 'یک اسم خنثی: het paspoort.'
    example_gloss: گذرنامه‌تان همراهتان است؟
  nl.a2.unit24.lesson02.teach.huurcontract:
    title: قرارداد اجاره
    gloss: اجاره‌نامه
    note: 'یک اسم خنثی: het huurcontract، ترکیبی از huren (اجاره کردن) و *contract*.'
    example_gloss: قرارداد اجاره دارید؟
  nl.a2.unit24.lesson02.teach.geboorteakte:
    title: شناسنامهٔ تولد
    gloss: شناسنامه
    note: 'یک اسم با جنسیت عام (غیرخنثی): de geboorteakte.'
    example_gloss: آیا شناسنامه‌ام را هم باید بیاورم؟
  nl.a2.unit24.lesson02.teach.wat_heb_ik_nodig:
    title: پرسیدن دربارهٔ مدارک لازم
    gloss: برای ثبت‌نام چه چیزهایی لازم دارم؟
    note: اینجا هم om ... te به‌علاوهٔ مصدر برای بیان هدف آمده است، همان الگوی درس اول.
  nl.a2.unit24.lesson02.teach.paspoort_huurcontract:
    title: بیان رسمی مدارک لازم
    gloss: شما به پاسپورت معتبر و اجاره‌نامهٔ خودتان نیاز دارید.
    note: U heeft ... nodig (تحت‌اللفظی «شما ... لازم دارید») شکل استانداردِ رسمی برای بیان یک شرط یا مدرک لازم است.
  nl.a2.unit24.lesson02.teach.moet_ik_meenemen:
    title: پرسیدن دربارهٔ یک مدرک اضافه
    gloss: آیا شناسنامه‌ام را هم باید بیاورم؟
    note: Meenemen (همراه آوردن) یک فعل جداشدنی است؛ اینجا بعد از moet به شکل مصدر در آخر جمله می‌ماند.
  nl.a2.unit24.lesson03.teach.mag_ik_zien:
    title: درخواست برای دیدن مدارک
    gloss: می‌توانم پاسپورت و اجاره‌نامهٔ شما را ببینم؟
    note: Mag ik ... zien? راه مؤدبانهٔ معمول برای این است که یک مأمور بخواهد مدارک را بررسی کند.
  nl.a2.unit24.lesson03.teach.sinds_wanneer:
    title: پرسیدن «از کی»
    gloss: از کی در این آدرس زندگی می‌کنید؟
    note: Sinds wanneer («از کی») راه رسمی و دقیقی برای پرسیدن دربارهٔ مدت است و در مصاحبه‌های اداری رایج است.
  nl.a2.unit24.lesson03.teach.sinds_vorige_maand:
    title: گفتن نقطهٔ شروع
    gloss: از ماه پیش اینجا زندگی می‌کنم.
    note: Sinds به‌علاوهٔ عبارت زمانی نشان می‌دهد وضعیتی که هنوز ادامه دارد از کی شروع شده است؛ فعل با زمان حال woon می‌آید (نه گذشته)، چون زندگی کردن ادامه دارد.
  nl.a2.unit24.lesson04.teach.bsn:
    title: شمارهٔ BSN
    gloss: شمارهٔ BSN (شمارهٔ خدمات شهروندی)
    note: 'یک اسم خنثی: het BSN-nummer، شمارهٔ شناسایی شخصی ملی در هلند.'
    example_gloss: شمارهٔ BSN چیست؟
  nl.a2.unit24.lesson04.teach.wat_is_bsn:
    title: پرسیدن اینکه BSN چیست
    gloss: شمارهٔ BSN چیست؟
    note: یک سؤال ساده برای پرسیدن تعریف یک چیز، که برای هر اصطلاح اداریِ ناآشنا به کار می‌آید.
  nl.a2.unit24.lesson04.teach.bsn_uitleg:
    title: توضیح دادن BSN
    gloss: شمارهٔ BSN شمارهٔ شخصی شما نزد دولت است.
    note: Bij de overheid («نزد دولت») مشخص می‌کند این شماره متعلق به کدام نهاد است.
  nl.a2.unit24.lesson04.teach.nodig_voor:
    title: شمردن کاربردهای آن
    gloss: برای کار، بانک و پزشک خانواده به آن نیاز دارید.
    note: Nodig hebben voor («برای ... لازم داشتن») همان الگوی nodig hebben است و voor هر کاربرد را معرفی می‌کند.
  nl.a2.unit24.lesson04.teach.digid:
    title: معرفی DigiD
    gloss: با DigiD می‌توانید کارهایتان را آنلاین انجام دهید.
    note: DigiD سامانهٔ هویت دیجیتال هلند برای خدمات دولتی است؛ zaken regelen («کارها را راه انداختن») عبارتی عمومی و رایج برای انجام امور اداری است.
  nl.a2.unit24.lesson05.teach.brief:
    title: خواندن یک نامهٔ رسمی دربارهٔ ثبت‌نام
    gloss: 'برای ثبت‌نام در شهرداری به مدارک زیر نیاز دارید: یک گذرنامهٔ معتبر، قرارداد اجاره‌تان و در صورت لزوم، شناسنامهٔ تولدتان. از قبل وقت بگیرید. بعد از ثبت‌نام، ظرف چند روز شمارهٔ BSN شما با پست به دستتان می‌رسد.'
    note: به مدارک لازم، کارهایی که باید از قبل انجام دهید و اتفاقی که بعداً می‌افتد دقت کنید.
    glosses:
      Om: برای اینکه (om ... te برای بیان هدف است)
      schrijven: ثبت‌نام کردن (اینجا بخشی از فعل جداشدنیِ inschrijven که به شکل in te schrijven جدا شده است)
      gemeente: شهرداری / شورای محلی
      volgende: زیر / بعدی
      documenten: مدارک
      nodig: لازم (heeft ... nodig = «نیاز دارد»)
      geldig: معتبر
      paspoort: گذرنامه
      huurcontract: قرارداد اجاره
      indien: اگر / در صورتی که (رسمی)
      toepassing: کاربرد / موضوعیت (indien van toepassing = «در صورت لزوم»)
      geboorteakte: شناسنامهٔ تولد
      Maak: بگیرید / انجام دهید (امر از maken)
      vooraf: از قبل / پیشاپیش
      afspraak: وقت ملاقات
      Na: بعد از
      inschrijving: ثبت‌نام
      ontvangt: دریافت می‌کنید (از ontvangen)
      binnen: ظرف / داخل
      enkele: چند / تعدادی
      BSN-nummer: شمارهٔ BSN (شمارهٔ خدمات شهروندی)
      post: پست
  nl.a2.unit24.lesson06.teach.ambtenaar_greet:
    title: کارمند به عمر سلام می‌کند
    gloss: 'کارمند: بعدازظهر بخیر، چه کمکی از من برمی‌آید؟'
    note: Waarmee kan ik u helpen? جملهٔ استانداردِ رسمی برای شروع خدمت‌رسانی است و همان لحن u درس‌های قبلیِ مواجهه‌های خدماتی را ادامه می‌دهد.
  nl.a2.unit24.lesson06.teach.omar_state_reason:
    title: عمر دلیل آمدنش را می‌گوید
    gloss: 'عمر: بعدازظهر بخیر، من برای ثبت‌نام در آدرس جدیدم وقت دارم.'
    note: Op mijn nieuwe adres («در آدرس جدیدم») مشخص می‌کند این ثبت‌نام برای کدام آدرس است.
  nl.a2.unit24.lesson06.teach.ambtenaar_ask_documents:
    title: کارمند مدارک را می‌خواهد
    gloss: 'کارمند: ممکن است گذرنامه و قرارداد اجاره‌تان را ببینم؟'
    note: همان الگوی mag ik ... zien? از درس سوم است و alstublieft برای مؤدب‌تر شدن به آن اضافه شده است.
  nl.a2.unit24.lesson06.teach.omar_hand_over:
    title: عمر مدارک را تحویل می‌دهد
    gloss: 'عمر: بفرمایید. من از ماه پیش در اوتریخت زندگی می‌کنم.'
    note: این جمله با مثال آموزشیِ درس سوم دربارهٔ sinds vorige maand همخوان است.
  nl.a2.unit24.lesson06.teach.ambtenaar_confirm:
    title: کارمند تأیید می‌کند
    gloss: 'کارمند: ممنون. همه‌چیز مرتب است. شمارهٔ BSN شما ظرف چند روز با پست به دستتان می‌رسد.'
    note: Alles is in orde («همه‌چیز مرتب است») عبارت استانداردی برای تأیید بعد از بررسی مدارک است.
  nl.a2.unit24.lesson06.teach.omar_thanks:
    title: عمر از کارمند تشکر می‌کند
    gloss: 'عمر: عالی شد، خیلی ممنون از کمکتان!'
    note: Voor uw hulp («بابت کمکتان») گفت‌وگوی رسمی را مؤدبانه تمام می‌کند.
  nl.a2.unit24.lesson06.teach.summary_grammar:
    title: خلاصهٔ این مراجعه
    gloss: عمر در gemeente ثبت‌نام کرد. شمارهٔ BSN او با پست برایش می‌رسد.
    note: Heeft ... ingeschreven شکل ماضی نقلیِ zich inschrijven است (ingeschreven اسم مفعول است)؛ zijn اینجا صفت ملکیِ «او» (مال او) است، نه فعل «بودن».
