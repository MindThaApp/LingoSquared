course:
  title: هلندی A2
  description: هلندی سطح A2 با تمرکز بر دستور زبان، برای مقایسه و انتخاب بین گزینه‌ها.
  learning_goal: چند گزینه را مقایسه کنید و بهترین را انتخاب کنید؛ با -er، -st، meer، het meest، even ... als و niet zo ... als.
units:
  nl.a2.unit99.de_beste_en_meest:
    title: بهترین، ارزان‌ترین، بیشترین
    description: خانه، گوشی و تعطیلات را مقایسه کنید و بگویید کدام بهترین است.
lessons:
  nl.a2.unit99.lesson01.groter_dan:
    title: بزرگ‌تر از
  nl.a2.unit99.lesson02.het_grootste:
    title: بزرگ‌ترین
  nl.a2.unit99.lesson03.even_en_niet_zo:
    title: به اندازهٔ ... و نه به اندازهٔ ...
  nl.a2.unit99.lesson04.meer_en_meest:
    title: بیشتر و بیشترین
  nl.a2.unit99.lesson05.noor_kiest_een_hotel:
    title: نور یک هتل انتخاب می‌کند
  nl.a2.unit99.lesson06.een_telefoon_kiezen:
    title: انتخاب یک گوشی
teaching:
  nl.a2.unit99.lesson01.teach.eigenschappen:
    title: کلمه‌های توصیفی
    gloss: بزرگ / کوچک / زیبا / گران / ارزان / بلند یا طولانی
    note: این شش صفت پایهٔ همهٔ مقایسه‌های این درس هستند.
    example_gloss:
    - خانه بزرگ و زیباست.
    - گوشی گران است، ولی هتل ارزان است.
    - سفر طولانی است و اتاق کوچک است.
  nl.a2.unit99.lesson01.teach.wonen:
    title: خانه و مسکن
    gloss: خانه / آپارتمان / اتاق / آشپزخانه / باغ
    note: کلمه‌های مربوط به مسکن از دورهٔ اول آشنا هستند؛ اینجا چیزهایی‌اند که با هم مقایسه می‌کنیم.
    example_gloss:
    - خانه باغ دارد.
    - آشپزخانه توی آپارتمان است.
    - اتاق کوچک است.
  nl.a2.unit99.lesson01.teach.telefoon:
    title: گوشی‌ها
    gloss: گوشی / باتری / دوربین
    note: کلمه‌های مربوط به گوشی برای مقایسهٔ مدل‌ها. *Goed* یعنی خوب.
    example_gloss:
    - گوشی من دوربین دارد.
    - باتری خوب است.
    - من یک گوشی دارم.
  nl.a2.unit99.lesson01.teach.vakantie:
    title: تعطیلات
    gloss: تعطیلات / هتل / ساحل / شهر / سفر
    note: کلمه‌های سفر از دورهٔ اول؛ اینجا برای مقایسهٔ گزینه‌های تعطیلات به کار می‌روند.
    example_gloss:
    - هتل نزدیک ساحل است.
    - تعطیلات طولانی است.
    - شهر بزرگ است.
  nl.a2.unit99.lesson01.teach.gn_groter:
    title: 'صفت تفضیلی: اضافه کردن -er'
    gloss: بزرگ، بزرگ‌تر؛ کوچک، کوچک‌تر؛ زیبا، زیباتر؛ گران، گران‌تر؛ ارزان، ارزان‌تر؛ بلند، بلندتر
    note: 'به صفت -er اضافه کنید. مراقب املا باشید: در *groot* یک o حذف می‌شود (*groter*)، در *goedkoop* هم یک o حذف می‌شود (*goedkoper*)، و در *duur* قبل از -er یک d اضافه می‌شود (*duurder*). *Mooi* ساده می‌شود *mooier*.'
  nl.a2.unit99.lesson01.teach.gn_dan:
    title: مقایسه با dan
    gloss: خانه بزرگ‌تر از آپارتمان است. اتاق من کوچک‌تر از اتاق شماست.
    note: بعد از صفت تفضیلی (شکل -er)، چیزی که با آن مقایسه می‌کنید بعد از *dan* (از) می‌آید.
  nl.a2.unit99.lesson01.teach.zin_duurder:
    title: یک مقایسهٔ گوشی
    gloss: گوشی من از گوشی تو گران‌تره.
    note: '*Mijn* یعنی «من» (مال من) و *jouw* یعنی «تو» (مال تو، غیررسمی). در گفتار روزمره *jouw* معمولاً به شکل بی‌تکیهٔ *je* می‌آید: *je telefoon*.'
  nl.a2.unit99.lesson02.teach.kiezen:
    title: کلمه‌های انتخاب
    gloss: کدام / این (کلمهٔ de) / این (کلمهٔ het) / آن / از بین همه
    note: '*Deze* با کلمه‌های de در مفرد (deze telefoon) و با جمع‌ها می‌آید، *dit* با کلمه‌های het در مفرد (dit hotel). *Die* یعنی آن (die telefoon).'
    example_gloss:
    - کدام گوشی گران است؟
    - این گوشی گران است و آن گوشی ارزان.
    - این هتل زیباست و آن گوشی گران است.
  nl.a2.unit99.lesson02.teach.gn_superlatief:
    title: 'صفت عالی: het + صفت + -st'
    gloss: بزرگ، بزرگ‌ترین؛ کوچک، کوچک‌ترین؛ زیبا، زیباترین؛ گران، گران‌ترین؛ ارزان، ارزان‌ترین؛ بلند، بلندترین
    note: 'بعد از *is* از *het* استفاده کنید و -st اضافه کنید. تغییرهای املایی -er اینجا لازم نیست: مصوت دوتایی می‌ماند (*het grootst*، *het goedkoopst*).'
  nl.a2.unit99.lesson02.teach.gn_superlatief_e:
    title: 'صفت عالی قبل از اسم: -ste'
    gloss: این گران‌ترین گوشی است. این کوچک‌ترین خانه است. این ارزان‌ترین اتاق است. این زیباترین باغ است.
    note: 'قبل از اسم، -ste اضافه کنید: *de duurste telefoon*، *het kleinste huis*. بعد از *is* و بدون اسم، هم *het goedkoopst* درست است و هم *het goedkoopste*.'
  nl.a2.unit99.lesson02.teach.gn_onregelmatig:
    title: 'بی‌قاعده: goed و veel'
    gloss: خوب، بهتر، بهترین؛ زیاد، بیشتر، بیشترین. گوشی من از گوشی شما بهتر است. این بهترین دوربین است. این هتل بیشترین اتاق را دارد.
    note: '*Goed* و *veel* از قاعده پیروی نمی‌کنند: *goed - beter - best* و *veel - meer - meest*. قبل از اسم آخرش -e می‌گیرد: *de beste camera*، *de meeste kamers* (با کلمهٔ het: *het beste huis*).'
  nl.a2.unit99.lesson02.teach.zin_goedkoopst:
    title: از بین همهٔ هتل‌ها
    gloss: از بین همهٔ هتل‌ها، این هتل از همه ارزون‌تره.
    note: '*Van alle* گروهی را نام می‌برد که از بینشان انتخاب می‌کنید.'
  nl.a2.unit99.lesson03.teach.gelijk:
    title: برابر و نابرابر
    gloss: به همان اندازه / نه به اندازهٔ / مثل
    note: '*Even ... als* می‌گوید دو چیز برابرند؛ *niet zo ... als* می‌گوید اولی کمتر است.'
    example_gloss:
    - خانهٔ من به اندازهٔ خانهٔ شما بزرگ است.
    - هتل به اندازهٔ آپارتمان گران نیست.
    - آشپزخانه به اندازهٔ باغ زیباست.
  nl.a2.unit99.lesson03.teach.gn_even:
    title: 'برابری: even ... als'
    gloss: گوشی من به اندازهٔ گوشی شما گران است.
    note: 'بین *even* و *als* از صفت ساده (بدون -er) استفاده کنید: *even duur als*.'
  nl.a2.unit99.lesson03.teach.gn_niet_zo:
    title: 'کمتر: niet zo ... als'
    gloss: هتل به اندازهٔ آپارتمان بزرگ نیست.
    note: 'باز هم صفت ساده: *niet zo groot als*. چیز دوم بزرگ‌تر است.'
  nl.a2.unit99.lesson03.teach.gn_dan_als:
    title: dan یا als؟
    gloss: هتل از آپارتمان ارزان‌تر است. هتل به اندازهٔ آپارتمان ارزان است.
    note: 'صفت تفضیلی (-er) با *dan* می‌آید. *Even* و *niet zo* با صفت ساده و *als* می‌آیند. هیچ‌وقت آن‌ها را قاطی نکنید: *even goedkoper als* غلط است.'
  nl.a2.unit99.lesson04.teach.lange_woorden:
    title: صفت‌های بلندتر
    gloss: جالب / کاربردی / مدرن / راحت
    note: این صفت‌های بلندتر معمولاً همان‌هایی هستند که *meer* و *het meest* می‌گیرند.
    example_gloss:
    - سفر به شهر جالب است.
    - گوشی کاربردی است.
    - آپارتمان مدرن و راحت است.
  nl.a2.unit99.lesson04.teach.gn_meer:
    title: 'صفت‌های بلند: meer و het meest'
    gloss: جالب، جالب‌تر، جالب‌ترین؛ مدرن، مدرن‌تر، مدرن‌ترین
    note: در هلندی، با صفت‌های بلندتر *meer* (بیشتر) یا *het meest* (بیشترین) قبل از صفتِ بدون تغییر می‌آید. این الگویی است که اینجا یاد می‌گیرید؛ شکل‌هایی مثل *interessanter* هم در هلندی روزمره دیده می‌شوند.
  nl.a2.unit99.lesson04.teach.gn_kort_lang:
    title: کوتاه یا بلند؟
    gloss: 'کوتاه: گران، گران‌تر، گران‌ترین. بلند: راحت، راحت‌تر، راحت‌ترین.'
    note: صفت‌های کوتاه -er و -st می‌گیرند. صفت‌های بلندتر، به‌ویژه آن‌هایی که به -ant، -isch، -eel یا -abel ختم می‌شوند، معمولاً *meer* و *het meest* می‌گیرند. در هر دو الگو بعد از صفت تفضیلی باز هم *dan* می‌آید.
  nl.a2.unit99.lesson04.teach.zin_comfortabel:
    title: انتخاب هتل
    gloss: کدام هتل راحت‌ترین است؟ این هتل راحت‌ترین است، ولی گران‌ترین هم هست.
    note: '*Welk* با کلمه‌های het در مفرد می‌آید (welk hotel)؛ *welke* با کلمه‌های de و همهٔ جمع‌ها.'
  nl.a2.unit99.lesson05.teach.reading:
    title: جست‌وجوی هتل نور
    gloss: نور دنبال یک هتل برای تعطیلاتش می‌گردد. هتل استرند گران‌ترین است، ولی زیباترین هم هست. هتل شتاد از هتل استرند ارزان‌تر است، ولی به اندازهٔ آن راحت نیست. هتل تاین به اندازهٔ هتل شتاد ارزان است. نور هتل تاین را انتخاب می‌کند، چون اتاق‌هایش بزرگ‌تر است.
    note: دقت کنید که سه هتل چطور با هم مقایسه شده‌اند.
    glosses:
      zoekt: دنبال ... می‌گردد
      voor: برای
      haar: او (مال او)
      kiest: انتخاب می‌کند
      want: چون
      kamers: اتاق‌ها
      zijn: هستند
  nl.a2.unit99.lesson06.teach.beurt01:
    title: لوته نظر عمر را می‌پرسد
    gloss: 'لوته: سلام عمر، به نظر تو کدام گوشی از همه بهتر است؟'
  nl.a2.unit99.lesson06.teach.beurt02:
    title: عمر یک مزیت و یک عیب را می‌گوید
    gloss: 'عمر: این گوشی بهترین دوربین را دارد، ولی گران‌ترین هم هست.'
  nl.a2.unit99.lesson06.teach.beurt03:
    title: لوته یک گوشی ارزان‌تر پیشنهاد می‌دهد
    gloss: 'لوته: آن گوشی از این یکی ارزان‌تر است، و باتری‌اش هم به همان اندازه خوب است.'
  nl.a2.unit99.lesson06.teach.beurt04:
    title: عمر دربارهٔ ظاهر می‌پرسد
    gloss: 'عمر: آن گوشی هم مثل این قشنگ است؟'
  nl.a2.unit99.lesson06.teach.beurt05:
    title: لوته جواب می‌دهد
    gloss: 'لوته: نه، به قشنگیِ این نیست، ولی خیلی ارزان‌تر است.'
  nl.a2.unit99.lesson06.teach.beurt06:
    title: عمر تصمیم می‌گیرد
    gloss: 'عمر: باشه، من اون گوشی رو انتخاب می‌کنم.'
exercises:
  nl.a2.unit99.lesson01.exercise01.choose_kleiner:
    instruction: جملهٔ هلندی‌ای را که با معنی فارسی می‌خواند انتخاب کنید.
    correct_option: Het appartement is kleiner dan het huis.
    distractors:
    - Het huis is kleiner dan het appartement.
    - Het appartement is klein dan het huis.
    - Het appartement is kleinste dan het huis.
    accepted_answers:
    - value: Het appartement is kleiner dan het huis.
      status: correct
    feedback: '*Kleiner* صفت تفضیلیِ *klein* است و بعد از آن *dan* می‌آید.'
    prompt_blocks:
    - آپارتمان از خونه کوچک‌تره.
  nl.a2.unit99.lesson01.exercise02.choose_duurder:
    instruction: جملهٔ هلندی‌ای را که با معنی فارسی می‌خواند انتخاب کنید.
    correct_option: Mijn telefoon is duurder dan jouw telefoon.
    distractors:
    - Jouw telefoon is duurder dan mijn telefoon.
    - Mijn telefoon is duur dan jouw telefoon.
    - Mijn telefoon is goedkoper dan jouw telefoon.
    accepted_answers:
    - value: Mijn telefoon is duurder dan jouw telefoon.
      status: correct
    feedback: '*Duurder dan* یعنی گران‌تر از.'
    prompt_blocks:
    - گوشی من از گوشی تو گران‌تره.
  nl.a2.unit99.lesson01.exercise03.match_vergelijking:
    instruction: هر صفت را به صفت تفضیلی‌اش وصل کنید.
    accepted_answers:
    - value:
      - left: groot
        right: groter
      - left: klein
        right: kleiner
      - left: mooi
        right: mooier
      - left: duur
        right: duurder
      - left: goedkoop
        right: goedkoper
      - left: lang
        right: langer
      status: correct
    feedback: 'پسوند -er اضافه می‌شود و باید قواعد املا را هم در نظر بگیرید: groter، goedkoper، duurder.'
    pairs:
    - left: groot
      right: groter
    - left: klein
      right: kleiner
    - left: mooi
      right: mooier
    - left: duur
      right: duurder
    - left: goedkoop
      right: goedkoper
    - left: lang
      right: langer
  nl.a2.unit99.lesson01.exercise04.order_groter:
    instruction: کلمه‌ها را مرتب کنید تا جمله‌ی «خانه بزرگ‌تر از آپارتمان است.» ساخته شود.
    correct_option: Het huis is groter dan het appartement
    accepted_answers:
    - value: Het huis is groter dan het appartement
      status: correct
    feedback: 'جمله درست: *Het huis is groter dan het appartement.*'
  nl.a2.unit99.lesson01.exercise05.complete_groter:
    instruction: جمله را کامل کنید تا یعنی «آشپزخانه بزرگ‌تر از اتاق است.» از صفت تفضیلی استفاده کنید.
    correct_option: groter
    accepted_answers:
    - value: groter
      status: correct
    feedback: '*Groter* صفت تفضیلیِ *groot* است.'
  nl.a2.unit99.lesson01.exercise06.translate_goedkoper:
    instruction: به هلندی ترجمه کنید.
    correct_option: Het hotel is goedkoper dan het appartement.
    accepted_answers:
    - value: Het hotel is goedkoper dan het appartement.
      status: correct
    - value: Het hotel is goedkoper dan het appartement
      status: correct
    feedback: 'ترجمه درست: *Het hotel is goedkoper dan het appartement.*'
    prompt_blocks:
    - هتل از آپارتمان ارزون‌تره.
  nl.a2.unit99.lesson01.exercise07.write_kleiner:
    instruction: جملهٔ هلندی خواسته‌شده را بنویسید.
    correct_option: Mijn kamer is kleiner dan jouw kamer.
    accepted_answers:
    - value: Mijn kamer is kleiner dan jouw kamer.
      status: correct
    - value: Mijn kamer is kleiner dan jouw kamer
      status: correct
    - value: Mijn kamer is kleiner dan je kamer.
      status: correct
    - value: Mijn kamer is kleiner dan je kamer
      status: correct
    feedback: 'نمونه جمله درست: *Mijn kamer is kleiner dan jouw kamer.*'
    prompt_blocks:
    - 'با صفت تفضیلی و dan به هلندی بنویسید: اتاق من از اتاق تو کوچک‌تره.'
  nl.a2.unit99.lesson02.exercise01.choose_duurste:
    instruction: جملهٔ هلندی‌ای را که با معنی فارسی می‌خواند انتخاب کنید.
    correct_option: Dit is de duurste telefoon.
    distractors:
    - Dit is de duurder telefoon.
    - Dit is duurste telefoon.
    - Dit is de goedkoopste telefoon.
    accepted_answers:
    - value: Dit is de duurste telefoon.
      status: correct
    feedback: 'قبل از اسم، صفت عالی به -ste ختم می‌شود: *de duurste telefoon*.'
    prompt_blocks:
    - این گران‌ترین گوشیه.
  nl.a2.unit99.lesson02.exercise02.choose_goedkoopst:
    instruction: جملهٔ هلندی‌ای را که با معنی فارسی می‌خواند انتخاب کنید.
    correct_option: Van alle hotels is dit hotel het goedkoopst.
    distractors:
    - Van alle hotels is dit hotel goedkoper.
    - Van alle hotels is dit hotel het goedkoper.
    - Van alle hotels is dit hotel het duurst.
    accepted_answers:
    - value: Van alle hotels is dit hotel het goedkoopst.
      status: correct
    feedback: '*Het goedkoopst* یعنی ارزان‌ترین. صفت تفضیلی مثل *goedkoper* به *dan* نیاز دارد، نه *van alle*.'
    prompt_blocks:
    - از بین همهٔ هتل‌ها، این هتل از همه ارزون‌تره.
  nl.a2.unit99.lesson02.exercise03.match_superlatief:
    instruction: هر صفت را به صفت عالی‌اش وصل کنید.
    accepted_answers:
    - value:
      - left: groot
        right: het grootst
      - left: klein
        right: het kleinst
      - left: mooi
        right: het mooist
      - left: duur
        right: het duurst
      - left: goedkoop
        right: het goedkoopst
      - left: lang
        right: het langst
      - left: goed
        right: het best
      - left: veel
