teaching:
  nl.a1.unit21.lesson01.teach.blij_verdrietig_boos:
    title: خوشحال، ناراحت و عصبانی
    gloss: خوشحال، ناراحت، عصبانی
    note: سه واژهٔ پرکاربرد و پایه برای احساسات که با zijn (بودن) برای بیان حال و احساس به کار می‌روند.
    example_gloss:
    - من خوشحالم.
    - غمگینم.
    - من عصبانی هستم.
  nl.a1.unit21.lesson01.teach.ben_blij:
    title: گفتن اینکه خوشحالید
    gloss: من خوشحالم.
    note: الگوی پایه، *zijn* (بودن) + صفت احساس است؛ در فارسی هم می‌گوییم «من خوشحالم»، یعنی فعل «بودن» + صفت.
  nl.a1.unit21.lesson01.teach.niet_boos:
    title: مقایسه‌ی احساسات
    gloss: من عصبانی نیستم، ناراحتم.
    note: '*Niet* مستقیم *boos* را منفی می‌کند؛ بعد در جملهٔ دوم احساس واقعی گفته می‌شود.'
  nl.a1.unit21.lesson02.teach.waarom_blij:
    title: پرسیدن دلیل
    gloss: چرا خوشحالی؟
    note: '*Waarom* (چرا) واژهٔ پرسشی معمول برای پرسیدن دلیل است.'
  nl.a1.unit21.lesson02.teach.blij_omdat_appartement:
    title: گفتن دلیل
    gloss: من خوشحالم چون آپارتمان جدیدی دارم.
    note: '*Omdat* (چون، زیرا) جملهٔ دلیل را شروع می‌کند؛ در این جمله فعل به آخر می‌رود (*heb* بعد از *appartement* می‌آید).'
  nl.a1.unit21.lesson02.teach.verdrietig_omdat_regent:
    title: یک دلیل منفی
    gloss: من ناراحتم چون دارد باران می‌آید.
    note: '*regent* (باران می‌بارد) از درس آب‌وهوا دوباره به‌عنوان جملهٔ دلیل به کار رفته است.'
  nl.a1.unit21.lesson03.teach.zenuwachtig:
    title: مضطرب
    gloss: مضطرب
    note: کلمه‌ی معمول برای استرس و دلهره.
    example_gloss: از اولین شیفت کاری‌ام استرس دارم.
  nl.a1.unit21.lesson03.teach.eerste_dienst:
    title: گفتن اینکه برای چه چیزی دلشوره دارید
    gloss: از اولین شیفت کاری‌ام استرس دارم.
    note: '*Voor* (در اصل «برای») نشان می‌دهد نگرانی دربارهٔ چیست؛ در فارسی معمولاً از «برای» یا «دربارهٔ» استفاده می‌کنیم.'
  nl.a1.unit21.lesson03.teach.geen_zorgen:
    title: دلداری دادن به کسی
    gloss: نگران نباش.
    note: '*Maak je geen zorgen* (در اصل «برای خودت نگرانی درست نکن») عبارت ثابت و رایج برای دلداری دادن است.'
  nl.a1.unit21.lesson04.teach.hoe_voelt_omar:
    title: پرسیدن حال کسی
    gloss: عمر چه حسی دارد؟
    note: '*Voelen zich* (احساس کردن، بازتابی) روش معمول برای پرسیدن یا گفتن حالت روحی است؛ با *voelen* جسمی در درس‌های سلامت واحد ۱۶ فرق دارد.'
  nl.a1.unit21.lesson04.teach.hij_voelt_zich:
    title: توصیف حال کسی
    gloss: او استرس دارد.
    note: '*Zich* ضمیر بازتابی سوم‌شخص است و همراه *voelt* می‌آید.'
  nl.a1.unit21.lesson04.teach.waarom_voelt_hij:
    title: پرسیدن دلیل حال کسی
    gloss: چرا استرس دارد؟
    note: '*waarom* را با الگوی *voelt zich* از جملهٔ *Hij voelt zich zenuwachtig* ترکیب می‌کند.'
