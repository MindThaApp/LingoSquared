    title: خواندن یک پیام درباره‌ی احساسات
    gloss: سلام لوته، برای اولین شیفت تنهایم کمی مضطربم. ولی خوشحال هم هستم، چون کار جدید و آپارتمان جدید دارم. فکر می‌کنم همه‌چیز درست می‌شود.
    note: دقت کنید نویسنده برای چه چیزی دلشوره دارد، چه چیزی او را خوشحال می‌کند و دید کلی‌اش چیست.
    glosses:
      beetje: یک کم
      zenuwachtig: عصبی
      eerste: اولین
      dienst: شیفت
      alleen: تنها
      blij: خوشحال
      want: چون
      nieuwe: جدید
      baan: شغل
      nieuw: جدید
      appartement: آپارتمان
      denk: فکر کردن
      komt: 'درست می‌شود (اینجا: همه‌چیز درست می‌شود)'
  nl.a1.unit21.lesson06.teach.lotte_ask_feeling:
    title: لوته از عمر می‌پرسد چه حسی دارد
    gloss: 'لوته: سلام عمر، برای اولین شیفتت چه حسی داری؟'
    note: '*Voor je eerste dienst* (برای اولین شیفتت) الگوی *voor* + اسم را از درس سوم دوباره به کار می‌برد.'
  nl.a1.unit21.lesson06.teach.omar_admit_nervous:
    title: عمر اعتراف می‌کند که مضطرب است
    gloss: 'عمر: راستش را بخواهی، کمی مضطربم.'
    note: '*Eerlijk gezegd* (راستش، صادقانه بگویم) اعتراف را نرم‌تر می‌کند.'
  nl.a1.unit21.lesson06.teach.lotte_reassure:
    title: لوته به او دلداری می‌دهد
    gloss: 'لوته: نگران نباش، از پسش برمی‌آیی!'
    note: '*Je kunt het goed* (در اصل «تو این را خوب می‌توانی») عبارت ثابت تشویق‌کننده است.'
  nl.a1.unit21.lesson06.teach.omar_thanks_helps:
    title: عمر از او تشکر می‌کند
    gloss: 'عمر: ممنون، واقعاً کمک می‌کند.'
    note: '*Helpt* شکل سوم‌شخص مفرد فعل *helpen* (کمک کردن) است.'
  nl.a1.unit21.lesson06.teach.lotte_predict:
    title: لوته پایان کار را پیش‌بینی می‌کند
    gloss: 'لوته: و بعدش حتماً خیلی خوشحال و سرافراز می‌شوی.'
    note: '*Vast* (حتماً، مطمئناً) پیش‌بینی با اطمینان را نشان می‌دهد؛ *trots* (سرافراز، مغرور به خود) صفت جدید و مفیدی است.'
  nl.a1.unit21.lesson06.teach.omar_agree:
    title: عمر موافقت می‌کند
    gloss: 'عمر: بله، من هم همین‌طور فکر می‌کنم.'
    note: '*Dat denk ik ook* (در اصل «آن را من هم فکر می‌کنم») روش طبیعی موافقت با نظر کسی است.'
  nl.a1.unit21.lesson06.teach.summary_pronouns:
    title: خلاصه کردن با is و zijn و hem
    gloss: عمر برای اولین شیفتش مضطرب است. لوته به او کمک می‌کند.
    note: '*Is* شکل سوم‌شخص مفرد *zijn* (بودن) است؛ *zijn* در اینجا یعنی «مال او» (صفت ملکی)؛ *hem* یعنی «او را/به او» (ضمیر مفعولی) — سه واژهٔ کوچک اما ضروری برای صحبت دربارهٔ شخص دیگر.'
