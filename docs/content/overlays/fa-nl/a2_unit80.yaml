teaching:
  nl.a2.unit80.lesson01.teach.verzetten:
    title: تغییر دادن قرار
    gloss: جابه‌جا کردن (قرار) / لغو کردن
    note: '*Een afspraak verzetten* یعنی قرار را به زمان دیگری منتقل کردن. *Annuleren* یعنی قرار را کاملاً لغو کردن.'
    example_gloss:
    - می‌خواهم قرارم را جابه‌جا کنم.
    - باید قرارم را لغو کنم.
  nl.a2.unit80.lesson01.teach.helaas_sorry:
    title: عذرخواهی کردن
    gloss: متأسفانه / ببخشید
    note: '*Helaas* روشی مؤدبانه برای دادن خبر بد است. *Sorry* عذرخواهی روزمره است.'
    example_gloss:
    - متأسفانه نمی‌توانم بیایم.
    - ببخشید، دیر کرده‌ام.
  nl.a2.unit80.lesson01.teach.kapsalon:
    title: آرایشگاه
    gloss: آرایشگاه
    note: '*Het kapsalon* خود مکان است؛ *de kapper* خود شخص است. اغلب برای هر دو می‌گویند *naar de kapper*.'
    example_gloss: آرایشگاه از ساعت نه تا شش باز است.
  nl.a2.unit80.lesson01.teach.kan_verzetten:
    title: درخواست برای جابه‌جا کردن قرار
    gloss: می‌شه قرارم را جابه‌جا کنم؟
    note: 'سؤال بله/خیر با فعل شروع می‌شود: *Kan ik ...?* مصدر *verzetten* در آخر جمله می‌آید.'
  nl.a2.unit80.lesson01.teach.helaas_niet_komen:
    title: گفتن اینکه نمی‌توانید بیایید
    gloss: متأسفانه نمی‌توانم بیایم.
  nl.a2.unit80.lesson01.teach.gn_kan:
    title: Kan + مصدر
    gloss: پنجشنبه نمی‌توانم بیایم. می‌توانم قرار را جابه‌جا کنم؟
    note: 'بعد از *kan* فعل دوم به شکل مصدر در آخر جمله می‌آید. در جملهٔ خبری، *niet* قبل از آن مصدر قرار می‌گیرد: *Ik kan donderdag niet komen*. کلمهٔ زمان مثل *donderdag* قبل از *niet* می‌آید. در جملهٔ پرسشی، *kan* اول می‌آید: *Kan ik de afspraak verzetten?*'
  nl.a2.unit80.lesson02.teach.andere_dag:
    title: یک روز دیگر
    gloss: یک روز دیگه
    note: '*Andere* در اینجا بعد از *een* به -e ختم می‌شود، چون *dag* کلمهٔ de است.'
    example_gloss: می‌شود یک روز دیگر باشد؟
  nl.a2.unit80.lesson02.teach.kan_ook_maandag:
    title: پیشنهاد یک روز
    gloss: می‌شه دوشنبه هم باشه؟
    note: 'در هلندی اینجا قبل از نام روز هفته حرف اضافه نمی‌آید: *maandag*، نه *op maandag*.'
  nl.a2.unit80.lesson02.teach.kan_ook_dinsdag:
    title: یک روز دیگر
    gloss: می‌شه سه‌شنبه هم باشه؟
  nl.a2.unit80.lesson02.teach.komt_uit:
    title: برای شما مناسب است؟
    gloss: جمعه برای شما مناسب است؟ (رسمی)
    note: '*Uitkomen* یعنی «مناسب بودن». این فعل جداشدنی است، پس *uit* به آخر جمله می‌رود: *Komt vrijdag u uit?* برای کسی که خوب نمی‌شناسید، *u* مؤدبانه به کار می‌رود.'
  nl.a2.unit80.lesson02.teach.komt_goed_uit:
    title: گفتن بله
    gloss: بله، مناسبه.
  nl.a2.unit80.lesson02.teach.helaas_niet:
    title: مؤدبانه نه گفتن
    gloss: متأسفانه نه.
  nl.a2.unit80.lesson02.teach.gn_uitkomen:
    title: برای شما مناسب است؟
    gloss: جمعه برای شما مناسب است؟ بله، برای من خوب است. نه، متأسفانه نه.
    note: '*Uitkomen* فعل جداشدنی است: در زمان حال، *uit* به آخر جمله می‌رود. سؤال با فعل شروع می‌شود: *Komt vrijdag u uit?* جملهٔ *Ja, dat komt goed uit* تأیید است. رد مؤدبانه این است: *Nee, helaas niet*.'
  nl.a2.unit80.lesson03.teach.want:
    title: چون و متأسفم
    gloss: چون / متأسفم
    note: '*Want* دو جملهٔ کامل را به هم وصل می‌کند و دلیل را می‌گوید. *Het spijt me* عذرخواهی محتاطانه‌تری از *sorry* است.'
    example_gloss:
    - نمی‌تونم بیام، چون مریضم.
    - متأسفم.
  nl.a2.unit80.lesson03.teach.ongemak:
    title: زحمت
    gloss: زحمت
    note: '*Sorry voor het ongemak* عبارتی مؤدبانه است برای وقتی که برای کسی زحمت اضافه درست کرده‌اید.'
    example_gloss: ببخشید بابت زحمت.
  nl.a2.unit80.lesson03.teach.werken:
    title: 'دلیل: کار'
    gloss: نمی‌توانم بیایم، چون باید کار کنم.
  nl.a2.unit80.lesson03.teach.andere_afspraak:
    title: 'دلیل: قرار دیگر'
    gloss: نمی‌تونم بیام، چون قرار دیگه‌ای دارم.
  nl.a2.unit80.lesson03.teach.gn_want:
    title: 'چون: want'
    gloss: نمی‌تونم بیام، چون مریضم.
    note: 'بعد از *want* ترتیب کلمات همان ترتیب معمولی است: اول نهاد، بعد فعل. قبل از *want* ویرگول بگذارید: *Ik kan niet komen, want ik ben ziek.* با *omdat* مقایسه کنید که فعل را به آخر جمله می‌برد؛ اینجا از *want* استفاده کنید.'
  nl.a2.unit80.lesson04.teach.afspreken:
    title: قرار گذاشتن و از قبل
    gloss: قرار گذاشتن / از قبل
    note: '*Afspreken* یعنی با هم دربارهٔ زمان یا مکان توافق کردن. *Van tevoren* یعنی «از قبل» و «پیشاپیش».'
    example_gloss:
    - قراری بگذاریم؟
    - یک روز قبل زنگ بزنید.
  nl.a2.unit80.lesson04.teach.maandag_tien:
    title: پذیرفتن یک زمان
    gloss: دوشنبه ساعت ده خوبه.
  nl.a2.unit80.lesson04.teach.kunt_u:
    title: پرسیدن اینکه زمان مناسب است یا نه
    gloss: می‌توانید دوشنبه ساعت ده بیایید؟ (رسمی)
    note: '*Kunt u* شکل مؤدبانهٔ *kun je* است. مصدر *komen* در آخر جمله است.'
  nl.a2.unit80.lesson04.teach.zie_u_maandag:
    title: جمع‌بندی قرار
    gloss: پس دوشنبه می‌بینمتون.
  nl.a2.unit80.lesson04.teach.nieuwe_afspraak:
    title: گذاشتن یک قرار جدید
    gloss: پس یک قرار جدید می‌گذارم.
  nl.a2.unit80.lesson04.teach.gn_tijd:
    title: اول روز، بعد ساعت
    gloss: دوشنبه ساعت ده خوب است. می‌توانید دوشنبه ساعت ده بیایید؟
    note: 'وقتی روز و ساعت را می‌گویید، اول روز می‌آید و بعد *om* + ساعت: *maandag om tien uur*. در سؤال مؤدبانه از *Kunt u ...?* استفاده کنید و مصدر را در آخر جمله بگذارید.'
  nl.a2.unit80.lesson05.teach.kapsalon_bericht:
    title: پیامی از آرایشگاه
    gloss: عمر عزیز، قرار شما جابه‌جا شده است. قرار جدید شما دوشنبه ساعت ده است. اگر برایتان مناسب نیست، یک روز قبل با ما تماس بگیرید. بعد یک قرار جدید می‌گذاریم. دوشنبه می‌بینمتان! آرایشگاه جانسن
    note: این یک پیام کوتاه و معمولی از طرف یک مجموعهٔ کاری است، برای همین از *u* و *uw* مؤدبانه استفاده می‌کند. *Is verzet* یعنی «جابه‌جا شده است».
    glosses:
      beste: عزیز
      omar: عمر
      uw: شما، مال شما (رسمی)
      afspraak: وقت ملاقات
      verzet: جابه‌جا شده
      nieuwe: جدید
      maandag: دوشنبه
      tien: ده
      uur: ساعت
      komt: مناسب است (komt ... uit)
      dit: این
      niet: نه / نیست
      uit: (بخشی از komt ... uit)
      bel: زنگ زدن
      ons: ما را
      dan: پس، آن‌وقت
      tevoren: از قبل
      maken: می‌گذاریم، درست می‌کنیم
      we: ما
      tot: تا، به امید دیدار
      kapsalon: آرایشگاه
      jansen: جانسن
  nl.a2.unit80.lesson06.teach.kapper_opening:
    title: آرایشگاه جواب می‌دهد
    gloss: 'آرایشگر: آرایشگاه جانسن، عصر بخیر.'
  nl.a2.unit80.lesson06.teach.omar_vraagt:
    title: عمر توضیح می‌دهد و می‌پرسد
    gloss: 'عمر: عصر بخیر، عمر صحبت می‌کنم. پنجشنبه قرار دارم، ولی متأسفانه نمی‌توانم بیایم. می‌توانم قرار را جابه‌جا کنم؟'
  nl.a2.unit80.lesson06.teach.kapper_vrijdag:
    title: آرایشگر جمعه را پیشنهاد می‌دهد
    gloss: 'آرایشگر: حتماً. جمعه براتون خوبه؟'
  nl.a2.unit80.lesson06.teach.omar_maandag:
    title: عمر دوشنبه را پیشنهاد می‌دهد
    gloss: 'عمر: متأسفانه نه، چون باید کار کنم. دوشنبه هم می‌شه؟'
  nl.a2.unit80.lesson06.teach.kapper_tien:
    title: آرایشگر موافقت می‌کند
    gloss: 'آرایشگر: دوشنبه ساعت ده خوبه.'
  nl.a2.unit80.lesson06.teach.omar_dank:
    title: عمر می‌پذیرد و عذرخواهی می‌کند
    gloss: 'عمر: برای من خیلی خوبه. خیلی ممنون و ببخشید بابت زحمتی که افتاد.'
  nl.a2.unit80.lesson06.teach.kapper_einde:
    title: آرایشگر گفت‌وگو را تمام می‌کند
    gloss: 'آرایشگر: مشکلی نیست. دوشنبه می‌بینمتون!'
