course:
  title: هلندی A2
  description: هلندی سطح A2 با تمرکز بر دستور زبان، برای اشاره دوباره به آدم‌ها و چیزها.
  learning_goal: با ضمیرهای مفعولی و er به آدم‌ها و چیزها اشاره کنید، بدون اینکه آن‌ها را تکرار کنید.
units:
  nl.a2.unit104.hem_haar_ze_er:
    title: او، آن‌ها و er
    description: از ضمیرهای مفعولی و er (با عدد و حرف اضافه) استفاده کنید تا درباره هدیه، قرض گرفتن و پس دادن چیزها حرف بزنید، بدون اینکه تکرار کنید.
lessons:
  nl.a2.unit104.lesson01.cadeaus_en_boeken:
    title: هدیه و کتاب
  nl.a2.unit104.lesson02.hem_haar_het_ze:
    title: Hem، haar، het و ze
  nl.a2.unit104.lesson03.mij_of_me:
    title: Mij یا me؟ Jou یا je؟
  nl.a2.unit104.lesson04.hoeveel_er:
    title: چند تا؟ Ik heb er drie
  nl.a2.unit104.lesson05.erover_ermee:
    title: Erover، ervan، ermee، ernaar
  nl.a2.unit104.lesson06.boeken_terugbrengen:
    title: پس دادن کتاب‌ها
teaching:
  nl.a2.unit104.lesson01.teach.plaatsen:
    title: جاها و جشن‌ها
    gloss: مغازه / کتابخانه / تولد / مهمانی
    note: شاید این کلمه‌ها را از A1 بلد باشید؛ اینجا زمینه را برای هدیه دادن و قرض گرفتن می‌سازند.
    example_gloss:
    - من به کتابخانه می‌روم.
    - Noor مهمانی دارد.
    - در مغازه یک هدیه می‌خرم.
  nl.a2.unit104.lesson01.teach.cadeaus:
    title: هدیه‌ها و چیزهای قرضی
    gloss: هدیه / کتاب / گل / خودکار / چتر
    note: '*Het cadeau* و *het boek* کلمه‌های het هستند؛ *de pen* و *de paraplu* کلمه‌های de هستند. *De bloemen* جمع است.'
    example_gloss:
    - یک هدیه برای نور دارم.
    - می‌شه خودکارتون را قرض بگیرم؟
    - گل می‌خرم.
  nl.a2.unit104.lesson01.teach.werkwoorden:
    title: خریدن، دادن، قرض گرفتن، برگرداندن
    gloss: خریدن / دادن / قرض گرفتن / پس آوردن / پس دادن
    note: '*Lenen* اینجا یعنی قرض گرفتن. *Terugbrengen* و *teruggeven* جداشدنی هستند: *ik breng het terug*، *ik geef het terug*.'
    example_gloss:
    - گل می‌خرم.
    - می‌شه خودکار را قرض بگیرم؟
    - کتاب را پس می‌آورم.
    - آن را پس می‌دهم.
  nl.a2.unit104.lesson01.teach.vrienden:
    title: سه دوست
    gloss: لوته، عمر و نور دوست هستند.
  nl.a2.unit104.lesson01.teach.gn_objectvormen:
    title: ضمیرهای مفعولی
    gloss: مرا؛ تو را؛ او را (مرد)؛ او را (زن)؛ آن را؛ ما را؛ شما را؛ آن‌ها را
    note: 'بعد از فعل از شکل مفعولی استفاده می‌کنی: *Ik zie hem*. *Me/je/ze* شکل‌های معمول گفتاری هستند؛ *mij/jou* شکل‌های تأکیدی‌اند. برای چند نفر یا چند چیز *ze* می‌گویی. *Hen* و *hun* هم وجود دارند، ولی بیشتر در نوشتار به کار می‌روند؛ در گفتار می‌شود از آن‌ها پرهیز کرد.'
  nl.a2.unit104.lesson01.teach.gn_nadruk:
    title: با تأکید یا بدون تأکید
    gloss: تو را می‌بینم. تو را می‌بینم، نه او را. او مرا می‌بیند. او مرا می‌بیند، نه او (زن) را.
    note: در حالت عادی از *me* و *je* استفاده کن. وقتی می‌خواهی روی یک نفر تأکید کنی یا او را در مقابل دیگری بگذاری، *mij* و *jou* را به کار ببر.
  nl.a2.unit104.lesson01.teach.zinnen:
    title: ضمیرها در جمله
    gloss: او یک هدیه به من می‌دهد. من به او گل می‌دهم. لوته ما را می‌بیند.
  nl.a2.unit104.lesson02.teach.spullen:
    title: چیزهای بیشتر و یک کلمه پرسشی
    gloss: دوچرخه / کیف / کیک / کارت / کجا
    note: '*Taart* و *kaart* برای تولد و مهمانی به کار می‌آیند.'
    example_gloss:
    - کیف کجاست؟
    - کیک برای مهمانی است.
    - یک کارت برای لوته دارم.
  nl.a2.unit104.lesson02.teach.bezit:
    title: مال من و مال تو
    gloss: من، ـم / تو، ـت / از، مال
    note: '*Je* هم می‌تواند «تو را» باشد و هم «ـت» (مال تو): *Ik zie je* (تو را) و *je boek* (کتاب تو).'
    example_gloss:
    - خودکارم را دارم.
    - کتاب تو پیش من است.
    - کتاب نور.
  nl.a2.unit104.lesson02.teach.gn_het_hem:
    title: het برای کلمه‌های het، hem برای کلمه‌های de
    gloss: کتاب؟ دارمش. خودکار؟ دارمش. کیف؟ می‌بینمش.
    note: 'برای چیزها، هلندی ضمیر را بر اساس حرف تعریف انتخاب می‌کند: کلمه‌ی het به *het* تبدیل می‌شود و کلمه‌ی de مفرد به *hem*. برای کلمه‌ی de از *het* استفاده نکن.'
  nl.a2.unit104.lesson02.teach.gn_ze:
    title: ze برای جمع
    gloss: گل‌ها؟ آن‌ها را می‌خرم. لوته و عمر؟ آن‌ها را می‌بینم.
    note: '*Ze* در گفتار به چند چیز یا چند نفر اشاره می‌کند. *Hen* هم برای آدم‌ها وجود دارد، ولی بیشتر در نوشتار به کار می‌رود.'
  nl.a2.unit104.lesson02.teach.zinnen:
    title: چهار ضمیر مفعولی
    gloss: او را می‌بینم. او (زن) را می‌بینم. آن را می‌بینم. آن‌ها را می‌بینم.
  nl.a2.unit104.lesson03.teach.werkwoorden:
    title: فعل‌ها و حرف‌های اضافه با آدم‌ها
    gloss: زنگ زدن / کمک کردن / شناختن / برای / با
    note: '*Kennen* برای شناختن یک آدم است.'
    example_gloss:
    - به تو زنگ می‌زنم.
    - می‌تونی به من کمک کنی؟
    - او را نمی‌شناسم.
    - هدیه برای اوست.
    - من با شما می‌روم.
  nl.a2.unit104.lesson03.teach.gn_contrast:
    title: me/je یا mij/jou؟
    gloss: به تو کمک می‌کنم. به تو کمک می‌کنم، نه به او.
    note: 'در حالت عادی از *me* و *je* استفاده کن. وقتی روی یک نفر تأکید می‌کنی یا او را در مقابل دیگری می‌گذاری، *mij* و *jou* بگو: *Ik help jou, niet hem.*'
  nl.a2.unit104.lesson03.teach.gn_voorzetsel:
    title: بعد از حرف اضافه
    gloss: هدیه برای من است. هدیه برای تو است. با او می‌روم.
    note: بعد از حرف اضافه (*voor, met, naar, van*) شکل استاندارد *mij* و *jou* است. در گفتار بدون تأکید، *me* و *je* هم خیلی رایج‌اند (*voor me*، *met je*).
  nl.a2.unit104.lesson03.teach.gn_jullie:
    title: تو، شما، آن‌ها
    gloss: به تو زنگ می‌زنم. به شما زنگ می‌زنم. به آن‌ها زنگ می‌زنم.
    note: '*Je* یک نفر است. *Jullie* بیش از یک نفر است که با آن‌ها حرف می‌زنی. *Ze* بیش از یک نفر است که درباره‌شان حرف می‌زنی.'
  nl.a2.unit104.lesson04.teach.getallen:
    title: عددها و مقدار
    gloss: یک / دو / سه / چهار / پنج / هیچ، بدون / چند تا
    note: '*Geen* یعنی هیچ یا «بدون».'
    example_gloss:
    - من دو تا کتاب دارم.
    - خودکار ندارم.
    - چند تا کتاب داری؟
    - سه تا خودکار دارم.
  nl.a2.unit104.lesson04.teach.gn_er_getal:
    title: er + عدد
    gloss: چند تا کتاب داری؟ سه تا دارم.
    note: 'وقتی اسم را نمی‌گویی و فقط عدد می‌آوری، *er* را قبل از عدد می‌گذاری: *Ik heb er drie.* بدون *er* جمله ناقص است.'
  nl.a2.unit104.lesson04.teach.gn_er_geen:
    title: Er + één / geen
    gloss: خودکار داری؟ بله، یکی دارم. کیف داری؟ نه، هیچ‌کدام ندارم.
    note: '*Een* با *er* به *één* تبدیل می‌شود و *geen* هم بعد از *er* می‌آید: *Ik heb er geen.*'
  nl.a2.unit104.lesson04.teach.gn_er_ze:
    title: ze یا er؟
    gloss: کتاب‌ها؟ آن‌ها را دارم. کتاب؟ سه تا دارم.
    note: '*Ze* را برای چیزهای مشخصی به کار ببر که هر دو می‌شناسید. وقتی تعداد آن‌ها را می‌گویی، *er* را به کار ببر.'
  nl.a2.unit104.lesson04.teach.gn_er_kopen:
    title: er با فعل‌های دیگر
    gloss: می‌خواهم دو تا بخرم. پنج تا قرض می‌گیرم.
    note: '*Er* نزدیک فعل می‌ماند. با *willen* قبل از عدد و مصدر می‌آید: *Ik wil er twee kopen.*'
  nl.a2.unit104.lesson05.teach.werkwoorden:
    title: فعل‌ها با حرف اضافه
    gloss: صحبت کردن / نگاه کردن / نوشتن / دوست داشتن، نگه داشتن / خوشحال / درباره / به
    note: '*Praten over* = درباره‌ی چیزی صحبت کردن، *kijken naar* = به چیزی نگاه کردن، *schrijven met* = با چیزی نوشتن، *houden van* = دوست داشتن، *blij zijn met* = از چیزی خوشحال بودن.'
    example_gloss:
    - درباره‌ی هدیه صحبت می‌کنم.
    - به کتاب نگاه می‌کنم.
    - با خودکار می‌نویسم.
    - گل دوست دارم.
    - از هدیه خوشحالم.
  nl.a2.unit104.lesson05.teach.gn_er_voorzetsel:
    title: er + حرف اضافه برای چیزها
    gloss: هدیه؟ درباره‌اش صحبت می‌کنم. کتاب؟ نگاهش می‌کنم. خودکار؟ با آن می‌نویسم. گل؟ دوستشان دارم.
    note: 'برای چیزها *over het* و *met hem* نمی‌گویی. *er* و حرف اضافه را به هم وصل کن: *erover, ernaar, ermee, ervan*.'
  nl.a2.unit104.lesson05.teach.gn_gesplitst:
    title: er و حرف اضافه می‌توانند از هم جدا شوند
    gloss: از آن خوشحالم. فردا درباره‌اش صحبت کنیم؟
    note: 'در خیلی از جمله‌ها *er* زود می‌آید و حرف اضافه آخر جمله: *Ik ben er blij mee.* *Ik ben ermee blij* هم ممکن است، ولی شکل خنثایی که اینجا یاد می‌گیری *Ik ben er blij mee* است.'
  nl.a2.unit104.lesson05.teach.gn_personen:
    title: برای آدم‌ها حرف اضافه می‌ماند
    gloss: درباره‌ی نور صحبت می‌کنم. درباره‌ی او صحبت می‌کنم. به عمر نگاه می‌کنم. به او نگاه می‌کنم.
    note: 'برای آدم‌ها از *er* استفاده نمی‌شود: حرف اضافه را با *hem, haar, ze* به کار ببر. *Erover* و شکل‌های مشابه به چیزها و موضوع‌ها اشاره می‌کنند.'
  nl.a2.unit104.lesson05.teach.lezen:
    title: پیام نور
    gloss: سلام عمر، بابت گل‌ها ممنون! دوستشان دارم. کتاب لوته قشنگ است، ازش خوشحالم. خودکار تو هنوز پیش من است. فردا پسش می‌آورم. لوته چترت را دارد و جمعه پسش می‌آورد.
    note: پیدا کن هر ضمیر به کدام چیز برمی‌گردد.
    glosses:
      bedankt: ممنون
      vrijdag: جمعه
      mooi: قشنگ، زیبا
      nog: هنوز
  nl.a2.unit104.lesson06.teach.lotte_bibliotheek:
    title: لوته می‌گوید کجا می‌رود
    gloss: 'لوته: سلام عمر، فردا می‌روم کتابخانه.'
  nl.a2.unit104.lesson06.teach.omar_boeken:
    title: عمر یک خواهش دارد
    gloss: 'عمر: می‌تونی کتاب‌های من را پس بیاوری؟ سه تا دارم.'
  nl.a2.unit104.lesson06.teach.lotte_ja:
    title: لوته قبول می‌کند و درباره‌ی هدیه می‌پرسد
    gloss: 'لوته: حتماً، فردا پسشان می‌آورم. برای نور هم هدیه داری؟'
  nl.a2.unit104.lesson06.teach.omar_bloemen:
    title: عمر هدیه را می‌گوید
    gloss: 'عمر: آره، برایش گل می‌خرم. دوستشان دارد.'
  nl.a2.unit104.lesson06.teach.lotte_later:
    title: لوته پیشنهاد می‌کند بعداً صحبت کنند
    gloss: 'لوته: عالیه! بعداً درباره‌اش صحبت کنیم؟'
  nl.a2.unit104.lesson06.teach.omar_bel:
    title: عمر قول زنگ زدن می‌دهد
    gloss: 'عمر: باشه، امشب بهت زنگ می‌زنم.'
exercises:
  nl.a2.unit104.lesson01.exercise01.kies_geeft:
    instruction: 'جمله‌ای را انتخاب کن که یعنی: او یک هدیه به من می‌دهد.'
    correct_option: Hij geeft me een cadeau.
    distractors:
    - Hij geeft ik een cadeau.
    - Hij geeft jij een cadeau.
    - Hij geeft hij een cadeau.
    accepted_answers:
    - value: Hij geeft me een cadeau.
      status: correct
    feedback: '*Hij geeft me een cadeau* = او یک هدیه به من می‌دهد. بعد از فعل به شکل مفعولی *me* نیاز داری.'
    prompt_blocks:
    - او به من یک هدیه می‌دهد.
  nl.a2.unit104.lesson01.exercise02.kies_haar:
    instruction: 'جمله‌ای را انتخاب کن که یعنی: من به او گل می‌دهم.'
    correct_option: Ik geef haar bloemen.
    distractors:
    - Ik geef hem bloemen.
    - Ik geef ons bloemen.
    - Ik geef jullie bloemen.
    accepted_answers:
    - value: Ik geef haar bloemen.
      status: correct
    feedback: '*Haar* شکل مفعولی برای یک زن است: *Ik geef haar bloemen*.'
    prompt_blocks:
    - من به او گل می‌دهم.
  nl.a2.unit104.lesson01.exercise03.koppel_zinnen:
    instruction: هر جملهٔ هلندی را به معنی فارسی‌اش وصل کنید.
    accepted_answers:
    - value:
      - left: Ik zie hem.
        right: من او را می‌بینم. (مرد)
      - left: Ik zie haar.
        right: من او را می‌بینم.
      - left: Hij ziet ons.
        right: او ما را می‌بیند.
      - left: Hij ziet jullie.
        right: او شما را می‌بیند. (چند نفر)
      - left: Hij ziet me.
        right: او من را می‌بیند.
      - left: Hij ziet je.
        right: او تو را می‌بیند. (یک نفر)
      status: correct
    feedback: '*Hem, haar, ons, jullie, me* و *je* همه شکل مفعولی هستند.'
    pairs:
    - left: Ik zie hem.
      right: من او را می‌بینم. (مرد)
    - left: Ik zie haar.
      right: من او را می‌بینم.
    - left: Hij ziet ons.
      right: او ما را می‌بیند.
    - left: Hij ziet jullie.
      right: او شما را می‌بیند. (چند نفر)
    - left: Hij ziet me.
      right: او من را می‌بیند.
    - left: Hij ziet je.
      right: او تو را می‌بیند. (یک نفر)
  nl.a2.unit104.lesson01.exercise04.volgorde_cadeau:
    instruction: 'کلمه‌ها را به ترتیب بچین تا بگویی: او یک هدیه به من می‌دهد.'
    correct_option: Hij geeft me een cadeau
    accepted_answers:
    - value: Hij geeft me een cadeau
      status: correct
    feedback: '*Hij geeft me een cadeau.*'
  nl.a2.unit104.lesson01.exercise05.vul_hem:
    instruction: جمله را با ضمیر مفعولی درست کامل کن.
    correct_option: hem
    accepted_answers:
    - value: hem
      status: correct
    feedback: عمر مرد است، پس با *hem* به او اشاره می‌کنی.
  nl.a2.unit104.lesson01.exercise06.vertaal_haar:
    instruction: به هلندی ترجمه کنید.
    correct_option: null
    accepted_answers:
    - value: Ik zie haar.
      status: correct
    - value: Ik zie haar
      status: correct
    feedback: '*Ik zie haar* = او (زن) را می‌بینم.'
    prompt_blocks:
    - من او را می‌بینم.
  nl.a2.unit104.lesson01.exercise07.schrijf_bloemen:
    instruction: جملهٔ هلندی خواسته‌شده را بنویسید.
    correct_option: Hij geeft me bloemen.
    accepted_answers:
    - value: Hij geeft me bloemen.
      status: correct
    - value: Hij geeft me bloemen
      status: correct
    - value: Hij geeft mij bloemen.
      status: correct
    - value: Hij geeft mij bloemen
      status: correct
    feedback: '*Hij geeft me bloemen* (یا *mij*) = او به من گل می‌دهد.'
    prompt_blocks:
    - 'به هلندی بنویسید: او به من گل می‌دهد.'
  nl.a2.unit104.lesson02.exercise01.kies_pen:
    instruction: 'جمله‌ای را انتخاب کن که یعنی: خودکار؟ دارمش.'
    correct_option: De pen? Ik heb hem.
    distractors:
    - De pen? Ik heb het.
    - De pen? Ik heb ze.
    - De pen? Ik heb ons.
    accepted_answers:
    - value: De pen? Ik heb hem.
      status: correct
