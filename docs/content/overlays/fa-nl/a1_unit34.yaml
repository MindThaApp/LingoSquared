  nl.a1.unit34.lesson05.teach.tekst:
    title: چه کسی از چه استفاده می‌کند؟
    gloss: لوته هر روز به عمر زنگ می‌زند. او از تلفنش استفاده می‌کند، نه از اپلیکیشن. عمر در خانه کامپیوتر ندارد، ولی روی تلفنش از اینترنت استفاده می‌کند. ساندر هر صبح پیش‌بینی هوا را نگاه می‌کند. بعد می‌رود دویدن. فنا اغلب برای لوته پیام می‌فرستد. شما هم هر روز از تلفنتان استفاده می‌کنید؟
    note: عادت‌های استفاده از دستگاه را در هر چهار شخصیت مقایسه می‌کند، مثل متن مقایسه‌ای درس ورزش.
