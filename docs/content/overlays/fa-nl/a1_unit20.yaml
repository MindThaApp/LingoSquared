teaching:
  nl.a1.unit20.lesson01.teach.jas_trui:
    title: پالتو، پلیور
    gloss: پالتو، پلیور
    note: '*De jas* و *de trui* هر دو با de به کار می‌روند.'
    example_gloss:
    - دنبال یک پالتو می‌گردم.
    - من یک پلیور دارم.
  nl.a1.unit20.lesson01.teach.broek_schoenen:
    title: شلوار، کفش
    gloss: شلوار، کفش‌ها
    note: '*Broek* در هلندی مفرد است: برای یک شلوار می‌گویند *een broek*، نه *broeken*. *Schoenen* جمع *schoen* است و کفش را معمولاً به‌صورت جمع (جفت) به کار می‌برند.'
    example_gloss:
    - دنبال یک شلوار می‌گردم.
    - دنبال کفش می‌گردم.
  nl.a1.unit20.lesson01.teach.zoek_jas:
    title: گفتن اینکه دنبال چه چیزی می‌گردید
    gloss: دنبال یک پالتو می‌گردم.
    note: '*Zoeken* (دنبال چیزی گشتن) در اینجا مفعول را مستقیم و بدون حرف اضافه می‌گیرد: Ik zoek een jas. (*Zoeken naar* هم وجود دارد، ولی ساده‌ترین الگو همین است.)'
  nl.a1.unit20.lesson02.teach.maat:
    title: سایز
    gloss: سایز
    note: 'اسمی که با de می‌آید: *de maat*.'
    example_gloss: چه سایزی می‌پوشید؟
  nl.a1.unit20.lesson02.teach.welke_maat:
    title: پرسیدن دربارهٔ سایز
    gloss: چه سایزی می‌پوشید؟
    note: '*Welke* (کدام) به کار می‌رود چون برای *maat* مجموعه‌ی کوچکی از پاسخ‌ها وجود دارد (S، M، L یا یک عدد).'
  nl.a1.unit20.lesson02.teach.heb_maat_m:
    title: گفتن سایز خودتان
    gloss: من سایز M هستم.
    note: 'در هلندی برای گفتن سایز از *hebben* (داشتن) استفاده می‌شود: Ik heb maat M.'
  nl.a1.unit20.lesson03.teach.zwart_blauw:
    title: مشکی، آبی
    gloss: مشکی، آبی
    note: دو صفت رنگ پایه در این درس.
    example_gloss:
    - پالتو را به رنگ مشکی می‌خواهم.
    - این را به رنگ آبی هم دارید؟
  nl.a1.unit20.lesson03.teach.wil_in_zwart:
    title: درخواست یک رنگ
    gloss: پالتو را به رنگ مشکی می‌خواهم.
    note: '*In het* + رنگ روش معمول برای مشخص کردن رنگ لباس هنگام سفارش یا درخواست است.'
  nl.a1.unit20.lesson03.teach.ook_in_blauw:
    title: پرسیدن دربارهٔ رنگ دیگر
    gloss: این را به رنگ آبی هم دارید؟
    note: '*Ook* (هم، همچنین) می‌پرسد که رنگ دیگری هم موجود است یا نه؛ اینجا با شکل محترمانه‌ی *u* آمده است.'
  nl.a1.unit20.lesson04.teach.past_deze_jas:
    title: پرسیدن دربارهٔ اندازه بودن
    gloss: این پالتو اندازه است؟
    note: '*Passen* (اندازه بودن) فعل طبیعی برای اندازه‌ی لباس است؛ این فعل با *passen* به معنی «پرو کردن» هم‌شکل است ولی معنایش فرق دارد.'
  nl.a1.unit20.lesson04.teach.past_goed:
    title: تأیید اندازه بودن
    gloss: اندازه‌ام است.
    note: '*Goed* (خوب) نشان می‌دهد لباس چقدر اندازه است.'
  nl.a1.unit20.lesson04.teach.te_klein:
    title: خیلی کوچک است
    gloss: خیلی کوچک است.
    note: '*Te* (زیادی، بیش از حد) قبل از صفت می‌آید و زیادی بودن را نشان می‌دهد.'
  nl.a1.unit20.lesson04.teach.te_groot:
    title: خیلی بزرگ است
    gloss: خیلی بزرگ است.
    note: همان الگوی *te* + صفت در کارت قبلی، یعنی *te klein*.
  nl.a1.unit20.lesson05.teach.negentig:
    title: نود
    gloss: نود
    note: '*Negentig* عدد 90 است که اینجا در قیمت کت آمده.'
    example_gloss: پالتو نود یورو قیمت دارد.
  nl.a1.unit20.lesson05.teach.kost_negentig:
    title: گفتن قیمت
    gloss: پالتو نود یورو قیمت دارد.
    note: '*Kost* شکل سوم‌شخص مفرد *kosten* (قیمت داشتن) است.'
  nl.a1.unit20.lesson05.teach.bonnetje:
    title: خواندن رسید فروشگاه
    gloss: 'پالتو زمستانی: سایز M، رنگ مشکی. قیمت: نود یورو. این پالتو اندازه است و گرم است.'
    note: به سایز، رنگ، قیمت و دو ویژگی‌ای که دربارهٔ پالتو آمده توجه کنید.
    glosses:
      Winterjas: پالتو زمستانی
      maat: سایز
      kleur: رنگ
      zwart: مشکی
      Prijs: قیمت
      negentig: نود
      euro: یورو
      jas: پالتو
      past: اندازه است
      warm: گرم
  nl.a1.unit20.lesson06.teach.lotte_notice:
    title: لوته کت را می‌بیند
    gloss: 'لوته: این کت قشنگه! تو چه سایزی هستی؟'
    note: '*Mooi* (قشنگ) یک واکنش مثبت عمومی است که از درس‌های قبل آمده.'
  nl.a1.unit20.lesson06.teach.omar_ask_try:
    title: عمر می‌خواهد کت را پرو کند
    gloss: 'عمر: من سایز M هستم. می‌شه پروش کنم؟'
    note: '*Mag ik ...?* (می‌شه ...؟) روش مؤدبانه‌ی معمول برای اجازه گرفتن است؛ *passen* اینجا یعنی «پرو کردن»، نه «اندازه بودن».'
  nl.a1.unit20.lesson06.teach.lotte_ask_fit:
    title: لوته درباره‌ی اندازه‌ی کت می‌پرسد
    gloss: 'لوته: البته. خوب اندازه‌ست؟'
    note: '*Hij* (او، آن) به *de jas* برمی‌گردد که با de می‌آید.'
  nl.a1.unit20.lesson06.teach.omar_confirm_fit:
    title: عمر تأیید می‌کند
    gloss: 'عمر: آره، خوب اندازه‌ست و گرمه.'
    note: دقیقاً با رسیدی که در درس پنجم خواندید یکی است؛ این همان پالتو است.
  nl.a1.unit20.lesson06.teach.lotte_ask_color:
    title: لوته درباره‌ی رنگ می‌پرسد
    gloss: 'لوته: عالیه! رنگ مشکی‌اش را می‌خوای یا آبی‌اش را؟'
    note: '*Wil je... of...?* همان الگوی پیشنهاد انتخاب از درس‌های سلیقه‌ها در واحد 13 است.'
  nl.a1.unit20.lesson06.teach.omar_choose_black:
    title: عمر تصمیم می‌گیرد
    gloss: 'عمر: مشکی‌اش را برمی‌دارم.'
    note: '*Nemen* (برداشتن) فعل طبیعی برای نهایی کردن انتخاب خرید است و با رنگ ذکرشده در رسید می‌خواند.'
  nl.a1.unit20.lesson06.teach.neemt_form:
    title: Neem و neemt
    gloss: Neem شکل «من» از nemen (برداشتن) است؛ neemt شکل «او» است.
    note: 'الگوی منظم زمان حال: *ik neem, jij/hij/zij neemt*.'
