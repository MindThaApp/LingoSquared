course:
  title: هلندی A2
  description: هلندی سطح A2 با تمرکز بر دستور زبان، برای نوشتن به دوستان.
  learning_goal: 'یک پیام کوتاه و دوستانه به یک دوست بنویسید: چه اتفاقی افتاد، بعدش چه می‌شود و چرا.'
units:
  nl.a2.unit106.een_bericht_aan_een_vriend:
    title: پیام به یک دوست
    description: خواندن و نوشتن پیام‌های دوستانه با سلام، اتفاق‌های گذشته، برنامه‌ها، دلیل‌ها و پایان‌بندی.
lessons:
  nl.a2.unit106.lesson01.hoi_lotte_groetjes:
    title: سلام لوته، ارادتمند
  nl.a2.unit106.lesson02.wat_is_er_gebeurd:
    title: چه اتفاقی افتاد؟
  nl.a2.unit106.lesson03.wat_gaan_we_doen:
    title: چه کار می‌خواهیم بکنیم؟
  nl.a2.unit106.lesson04.omdat_want_dus:
    title: چون، چون، پس
  nl.a2.unit106.lesson05.berichten_lezen:
    title: خواندن پیام‌ها
  nl.a2.unit106.lesson06.een_bericht_schrijven:
    title: نوشتن یک پیام
teaching:
  nl.a2.unit106.lesson01.teach.groeten:
    title: شروع یک پیام
    gloss: سلام لوته / هی عمر / سلام نور
    note: پیام به دوست را با Hoi یا Hé، بعد اسم و یک ویرگول شروع کنید.
    example_gloss:
    - سلام لوته، حالت چطوره؟
    - هی عمر، بابت پیامت ممنون!
  nl.a2.unit106.lesson01.teach.afsluiten:
    title: پایان یک پیام
    gloss: ارادتمند (دوستانه) / با محبت / به زودی می‌بینمت
    note: پیام را با یکی از این‌ها تمام کنید، بعد ویرگول و اسمتان. Liefs گرم است و برای دوستان صمیمی به کار می‌رود.
    example_gloss:
    - ارادتمند، عمر
    - با محبت، لوته
    - به زودی می‌بینمت، نور
  nl.a2.unit106.lesson01.teach.bericht:
    title: نوشتن به یک دوست
    gloss: پیام / دوست (پسر) / دوست (دختر) / نوشتن
    note: Vriend دوست پسر (مذکر) است و vriendin دوست دختر (مؤنث).
    example_gloss:
    - من به دوستم (دختر) پیام می‌نویسم.
    - لوته دوست عمر است.
    - عمر دوست نور است.
  nl.a2.unit106.lesson01.teach.gebeurtenissen:
    title: چیزهایی برای نوشتن
    gloss: آخر هفته / مهمانی / فیلم / سینما / باغ‌وحش / پارک / عصر
    note: این‌ها موضوع‌های رایج برای پیامی درباره‌ی آخر هفته‌تان هستند.
    example_gloss:
    - آخر هفته خوب بود.
    - مهمانی بامزه بود.
    - دارم توی سینما فیلم می‌بینم.
  nl.a2.unit106.lesson01.teach.bijvoeglijk:
    title: چطور بود؟ حالتان چطوره؟
    gloss: خوب، باحال / صمیمی و دلنشین / خسته / مریض / شلوغ، پرمشغله
    note: Gezellig حال‌وهوای صمیمی و شاد را توصیف می‌کند، مثلاً در یک مهمانی.
    example_gloss:
    - فیلم خوب بود.
    - خسته‌ام.
    - Omar مریض است.
    - Lotte سرش شلوغه.
  nl.a2.unit106.lesson01.teach.tijd:
    title: کی؟
    gloss: دیروز / هفته‌ی پیش / فردا / هفته‌ی بعد / شاید / شنبه
    note: کلمه‌های زمان به دوستتان می‌گویند چیزی کی اتفاق افتاده یا کی اتفاق می‌افتد. Misschien یعنی «شاید».
    example_gloss:
    - دیروز مهمانی بود.
    - فردا آخر هفته است.
    - شاید فیلم خوب باشد.
  nl.a2.unit106.lesson01.teach.gn_opbouw:
    title: ساختار یک پیام به دوست
    gloss: سلام Lotte، حالت چطوره؟ دارم برات یه پیام می‌نویسم. با آرزوی بهترین‌ها، Omar
    note: 'یک پیام دوستانه چهار بخش دارد: شروع (Hoi یا Hé و بعد اسم)، اتفاقی که افتاده، برنامه‌ی بعدی، و پایان (Groetjes، Liefs یا Tot snel و بعد اسم شما). هر جا لازم بود، با omdat یا want دلیل اضافه کنید.'
  nl.a2.unit106.lesson01.teach.gn_je:
    title: je برای دوست
    gloss: حالت چطوره؟ ممنون از پیامت!
    note: 'برای دوست می‌نویسید je (یا jij)، هرگز u. Je معنی «ـت» (مال تو) هم می‌دهد: je bericht یعنی «پیامت».'
  nl.a2.unit106.lesson01.teach.zin:
    title: یک پیام کوتاه
    gloss: سلام Lotte، ممنون از پیامت! به زودی می‌بینمت، Omar
  nl.a2.unit106.lesson02.teach.voltooid_ww:
    title: فعل‌ها و صفت مفعولی‌شان
    gloss: دیدن - دیده / خریدن - خریده / زنگ زدن - زنگ زده / پیاده‌روی کردن - پیاده‌روی کرده / رقصیدن - رقصیده / خوردن - خورده / رفتن - رفته / بودن - بوده
    note: شکل دوم هر جفت، صفت مفعولی است که در ماضی نقلی به کار می‌رود.
    example_gloss:
    - من یک فیلم دیدم.
    - ما رقصیدیم.
    - به پارک رفتم.
  nl.a2.unit106.lesson02.teach.gn_hebben:
    title: ماضی نقلی با hebben
    gloss: دیروز یک فیلم دیدم. ما در مهمانی رقصیدیم. به Noor زنگ زدم.
    note: برای گفتن اتفاقی که افتاده، heb یا hebben را با صفت مفعولی به کار ببرید. در جمله‌ی ساده، صفت مفعولی درست آخر جمله می‌آید. در هلندی این ساختار اغلب جای همان چیزی را می‌گیرد که در فارسی با گذشته‌ی ساده می‌گوییم، مثل «دیدم» یا «زنگ زدم».
  nl.a2.unit106.lesson02.teach.gn_zijn:
    title: ماضی نقلی با zijn
    gloss: به پارک رفتم. در مهمانی بودم. ما به سینما رفتیم.
    note: 'فعل‌های gaan و zijn ماضی نقلی را با zijn می‌سازند، نه با hebben: ik ben gegaan، ik ben geweest. Komen هم همین‌طور است (ik ben gekomen). بیشتر فعل‌های دیگر با hebben می‌آیند. فعل کمکی را همراه صفت مفعولی یاد بگیرید.'
  nl.a2.unit106.lesson02.teach.gn_was_had:
    title: توصیف با was و had
    gloss: مهمانی باحال بود. فیلم خوب بود. شب خوبی داشتم.
    note: 'برای گفتن اینکه چیزی چطور بود، از گذشته‌ی ساده‌ی فعل‌های آشنا استفاده کنید: was و had. برای خود اتفاق‌ها ماضی نقلی و برای توصیف was یا had را به کار ببرید. دو سه جزئیات از این دست، پیامتان را زنده می‌کند.'
  nl.a2.unit106.lesson02.teach.zinnen:
    title: چه اتفاقی افتاد
    gloss: دیروز یک فیلم دیدم. خوب بود. به مهمانی رفتم.
  nl.a2.unit106.lesson03.teach.plan_ww:
    title: کلمه‌هایی برای برنامه‌ها
    gloss: دیدار کردن / آشپزی کردن / تماشا کردن / عمو یا دایی / برنامه
    note: Oom یعنی عمو یا دایی. Plan یعنی برنامه؛ van plan zijn یعنی قصد داشتن.
    example_gloss:
    - به دیدن عمویم در آمستردام می‌روم.
    - Omar برای Lotte آشپزی می‌کند.
    - داریم فیلم تماشا می‌کنیم.
  nl.a2.unit106.lesson03.teach.gn_gaan:
    title: برنامه با gaan
    gloss: می‌خواهم به دیدن عمویم بروم. Omar فردا می‌خواهد آشپزی کند. ما می‌خواهیم برویم فیلم ببینیم.
    note: برای برنامه یا کاری که قصد انجامش را دارید، gaan را با مصدر به کار ببرید. مصدر در آخر بند می‌آید.
  nl.a2.unit106.lesson03.teach.gn_voorop:
    title: قید زمان در ابتدای جمله
    gloss: فردا آشپزی می‌کنم. هفته‌ی بعد می‌رویم عمویم را ببینیم. شاید بروم سینما.
    note: 'وقتی یک کلمه‌ی زمان مثل morgen یا volgende week، یا misschien در ابتدای جمله می‌آید، فعل بعد از آن می‌آید و فاعل بعد از فعل: Morgen ga ik koken. مصدر باز هم در آخر می‌ماند.'
  nl.a2.unit106.lesson03.teach.gn_plan:
    title: Van plan zijn om ... te
    gloss: قصد دارم به باغ‌وحش بروم. قصد دارم عمویم را ببینم.
    note: 'Ik ben van plan om ... te + مصدر می‌گوید قصد انجام چه کاری را دارید. مصدر همراه te در آخر می‌آید: om mijn oom te bezoeken. این ساختار کمی سنجیده‌تر از gaan است.'
  nl.a2.unit106.lesson03.teach.gn_zullen:
    title: zullen برای قول دادن
    gloss: فردا بهت زنگ می‌زنم. ما بهت زنگ می‌زنیم.
    note: 'Ik zal و wij zullen با مصدر، قول یا پیشنهاد را بیان می‌کنند: Ik zal je bellen. برای برنامه از gaan استفاده کنید و وقتی به دوستتان قول می‌دهید از zullen.'
  nl.a2.unit106.lesson03.teach.zinnen:
    title: برنامه‌ی بعدی
    gloss: هفته‌ی بعد می‌روم عمویم را در آمستردام ببینم. بهت زنگ می‌زنم.
  nl.a2.unit106.lesson04.teach.redenwoorden:
    title: کلمه‌هایی برای دلیل آوردن
    gloss: چون / چون / پس / وقت / هیچ، بدون / نه، نیست / آمدن / ماندن
    note: Omdat و want هر دو یعنی «چون» و dus یعنی «پس». ترتیب کلمه‌ها در آن‌ها فرق دارد؛ یادداشت‌های بعدی را ببینید.
    example_gloss:
    - وقت ندارم.
    - در خانه می‌مانم.
    - نمی‌آیم.
  nl.a2.unit106.lesson04.teach.gn_omdat:
    title: 'Omdat: فعل می‌رود آخر'
    gloss: در خانه می‌مانم، چون مریضم. چون خسته‌ام، به خانه می‌روم.
    note: 'بعد از omdat فعل به آخر بند خودش می‌رود: omdat ik ziek ben. اگر بند omdat اول بیاید، بند اصلی بعد از آن با فعل شروع می‌شود، درست بعد از ویرگول: Omdat ik moe ben, ga ik naar huis.'
  nl.a2.unit106.lesson04.teach.gn_want:
    title: 'Want: ترتیب عادی کلمه‌ها'
    gloss: در خانه می‌مانم، چون مریضم. نمی‌آیم، چون وقت ندارم.
    note: 'بعد از want ترتیب کلمه‌ها عادی می‌ماند: want ik ben ziek. Want فقط دو بند اصلی را به هم وصل می‌کند، برای همین هیچ‌وقت اول جمله نمی‌آید.'
  nl.a2.unit106.lesson04.teach.gn_dus:
    title: 'Dus: نتیجه'
    gloss: مریضم، پس در خانه می‌مانم. شلوغه، پس نمی‌آیم.
    note: 'Dus نتیجه را بیان می‌کند. حرف ربط است، پس ترتیب کلمه‌های بندی را که به آن وصل می‌شود عوض نمی‌کند: Ik ben ziek, dus ik blijf thuis. جابه‌جا کردن فعل و فاعل هم خیلی رایج و درست است: Ik ben ziek, dus blijf ik thuis. Omdat دلیل را می‌گوید؛ dus نتیجه را.'
  nl.a2.unit106.lesson04.teach.gn_verleden:
    title: دلیل در گذشته
    gloss: مریض بودم، پس به مهمانی نرفتم. نیامدم، چون خسته بودم.
    note: دلیل اتفاق‌های گذشته را هم همین‌طور بگویید. دلیل را با was یا had توصیف کنید (Ik was ziek) و خود اتفاق را با ماضی نقلی (ik ben niet gekomen).
  nl.a2.unit106.lesson05.teach.leeswoorden:
    title: کلمه‌هایی برای خواندن
    gloss: بلیت / قبلاً، از قبل / خیلی / زیاد / هم، همچنین / اما، ولی / آن / او / زندگی کردن
    note: این کلمه‌ها در دو پیام زیر آمده‌اند.
    example_gloss:
    - زیاد رقصیدم.
    - مهمانی خیلی باحال بود.
    - عموی من در آمستردام زندگی می‌کند.
    - او هم در پارک است.
    - می‌آیم، ولی این مشکلی نیست.
  nl.a2.unit106.lesson05.teach.gn_voltooid_verleden:
    title: had به‌اضافه‌ی صفت مفعولی (برای خواندن)
    gloss: از قبل بلیت خریده بودم. Lotte از قبل به Omar زنگ زده بود.
    note: 'Had یا hadden همراه صفت مفعولی به چیزی اشاره می‌کند که پیش از یک لحظه‌ی دیگر در گذشته اتفاق افتاده است: «از قبل بلیت خریده بودم». فقط کافی است هنگام خواندن آن را بشناسید. در پیام‌های خودتان ماضی نقلی کافی است.'
  nl.a2.unit106.lesson05.teach.lees_noor:
    title: پیام Noor به Lotte
    gloss: سلام Lotte، ممنون از پیامت! دیروز به مهمانی رفتم. خیلی باحال بود و کلی رقصیدم. فردا می‌روم باغ‌وحش، چون وقت دارم. شاید هفته‌ی بعد بروم سینما. به زودی می‌بینمت، Noor
  nl.a2.unit106.lesson05.teach.lees_omar:
    title: پیام Omar به Lotte
    gloss: سلام Lotte، حالت چطوره؟ دیروز مریض بودم، برای همین به سینما نرفتم. از قبل بلیت خریده بودم، ولی اشکالی نداشت. هفته‌ی بعد می‌روم عمویم را ببینم. او در آمستردام زندگی می‌کند. فردا بهت زنگ می‌زنم. با آرزوی بهترین‌ها، Omar
  nl.a2.unit106.lesson06.teach.lotte_vraag:
    title: Lotte حرف می‌زند
    gloss: 'Lotte: سلام Omar، آخر هفته‌ات چطور بود؟'
  nl.a2.unit106.lesson06.teach.omar_feestje:
    title: Omar حرف می‌زند
    gloss: 'Omar: خوب بود! شنبه به مهمانی رفتم و کلی رقصیدم.'
  nl.a2.unit106.lesson06.teach.lotte_plan:
    title: Lotte حرف می‌زند
    gloss: 'Lotte: چه خوب! هفته‌ی بعد می‌خواهی چه کار کنی؟'
  nl.a2.unit106.lesson06.teach.omar_oom:
    title: Omar حرف می‌زند
    gloss: 'Omar: می‌روم عمویم را در آمستردام ببینم، چون وقت دارم.'
  nl.a2.unit106.lesson06.teach.lotte_bellen:
    title: Lotte حرف می‌زند
    gloss: 'Lotte: چه باحال! بهت زنگ می‌زنم. به زودی می‌بینمت!'
exercises:
  nl.a2.unit106.lesson01.exercise01.kies_tot_snel:
    instruction: پایانی را انتخاب کنید که یعنی «به زودی می‌بینمت».
    correct_option: Tot snel
    distractors:
    - Hoi
    - Groetjes
    - Bedankt
    accepted_answers:
    - value: Tot snel
      status: correct
    feedback: '*Tot snel* = به زودی می‌بینمت. *Groetjes* پایان دیگری است: با آرزوی بهترین‌ها.'
    prompt_blocks:
    - کدام پایان‌بندی یعنی «به زودی می‌بینمت»؟
  nl.a2.unit106.lesson01.exercise02.match_berichtwoorden:
    instruction: هر واژه یا عبارت هلندی را با معنی‌اش جفت کنید.
