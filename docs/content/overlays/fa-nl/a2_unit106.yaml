      - left: de vriendin
        right: دوست دختر (دوست خانم)
      - left: het feestje
        right: مهمانی
      status: correct
    feedback: Hoi پیام را شروع می‌کند؛ Groetjes، Liefs و Tot snel آن را تمام می‌کنند.
    pairs:
    - left: Hoi
      right: سلام
    - left: Groetjes
      right: ارادتمند (پایان‌بندی دوستانه)
    - left: Liefs
      right: با محبت (پایان‌بندی برای دوستان صمیمی)
    - left: Tot snel
      right: به‌زودی می‌بینمتان
    - left: Bedankt
      right: ممنون
    - left: het bericht
      right: پیام
    - left: de vriendin
      right: دوست دختر (دوست خانم)
    - left: het feestje
      right: مهمانی
  nl.a2.unit106.lesson01.exercise03.kies_opening:
    instruction: شروع مناسب یک پیام به Lotte را انتخاب کنید.
    correct_option: Hoi Lotte,
    distractors:
    - Tot snel, Lotte
    - Liefs, Lotte
    - Groetjes, Lotte
    accepted_answers:
    - value: Hoi Lotte,
      status: correct
    feedback: '*Hoi Lotte,* شروع پیام است. بقیه پایان پیام هستند.'
    prompt_blocks:
    - می‌خواهید برای دوستتان لوته پیام بنویسید. کدام شروع درست است؟
  nl.a2.unit106.lesson01.exercise04.volgorde_bedankt:
    instruction: کلمه‌ها را مرتب کنید تا بگویید «ممنون از پیامت.»
    correct_option: Bedankt voor je bericht
    accepted_answers:
    - value: Bedankt voor je bericht
