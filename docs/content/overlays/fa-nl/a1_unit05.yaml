teaching:
  nl.a1.unit05.lesson01.teach.vader_moeder:
    title: پدر و مادر
    gloss: پدر / مادر
    note: '*Vader* واژهٔ استاندارد و خنثی برای «پدر» است. *Moeder* واژهٔ استاندارد و خنثی برای «مادر» است.'
    example_gloss:
    - این پدر من است.
    - او مادر من است.
  nl.a1.unit05.lesson01.teach.ouders_broer_zus:
    title: پدر و مادر، برادر و خواهر
    gloss: پدر و مادر / برادر / خواهر
    note: '*Ouders* در این معنا همیشه جمع است. *de broer* و *de zus* هر دو با *de* می‌آیند.'
    example_gloss:
    - پدر و مادر من در اوترخت زندگی می‌کنند.
    - من یک برادر دارم.
    - من یک خواهر دارم.
  nl.a1.unit05.lesson01.teach.kind_kinderen:
    title: بچه و بچه‌ها
    gloss: بچه / بچه‌ها
    note: '*Kind* کلمه‌ی het است: *het kind*. جمع آن یعنی *kinderen* با *de* می‌آید، با اینکه مفرد *kind* با *het* می‌آید.'
    example_gloss:
    - خواهر من یک بچه دارد.
    - عمو و زن‌عموی من دو بچه دارند.
  nl.a1.unit05.lesson01.teach.have_sentence:
    title: من یک برادر و یک خواهر دارم
    gloss: من یک برادر و یک خواهر دارم.
    note: '*Ik heb ...* روش معمول برای گفتن این است که چه اعضای خانواده‌ای دارید.'
  nl.a1.unit05.lesson02.teach.opa_oma_oom_tante:
    title: پدربزرگ، مادربزرگ، عمو/دایی و عمه/خاله
    gloss: پدربزرگ / مادربزرگ / عمو یا دایی / عمه یا خاله
    note: '*Opa* کلمه‌ی رایج روزمره برای پدربزرگ است. *grootvader* رسمی‌تر و نوشتاری است. *Oma* کلمه‌ی رایج روزمره برای مادربزرگ است. *grootmoeder* رسمی‌تر و نوشتاری است. *De oom*. *De tante*.'
    example_gloss:
    - پدربزرگ و مادربزرگ من در روتردام زندگی می‌کنند.
    - مادربزرگ من نود و نه سال دارد.
    - عموی من در آمستردام زندگی می‌کند.
    - عمو و زن‌عموی من دو بچه دارند.
  nl.a1.unit05.lesson02.teach.neef_nicht_note:
    title: neef و nicht دو معنا دارند
    gloss: neef = پسرعمو/پسردایی/... یا برادرزاده/خواهرزاده؛ nicht = دخترعمو/دخترخاله/... یا برادرزاده/خواهرزاده (دختر)
    note: در هلندی برای پسرعمو/دخترعمو و برادرزاده/خواهرزاده کلمه‌ی جدایی وجود ندارد و معنا از موقعیت مشخص می‌شود. فارسی برعکس این کار را می‌کند و برای هر کدام کلمه‌ی جدا دارد. در این درس تمرینی از این بخش نیست؛ فقط برای این آمده که بعداً کلمه‌ها را بشناسید.
    target_text: neef = پسرعمو، پسرخاله، پسردایی یا برادرزاده/خواهرزادهٔ پسر؛ nicht = دخترعمو، دخترخاله، دخترعمه یا برادرزاده/خواهرزادهٔ دختر
  nl.a1.unit05.lesson02.teach.gezin:
    title: خانواده (اهل خانه)
    gloss: خانواده (اهل خانه)
    note: '*Gezin* به اهل خانه‌ای می‌گویند که با هم زندگی می‌کنید (معمولاً پدر و مادر و بچه‌ها). *familie* کلمه‌ی کلی‌تری است و برای فامیل و خویشاوندان به‌طور کلی به کار می‌رود.'
    example_gloss: خانواده‌ی من در اوترخت زندگی می‌کند.
  nl.a1.unit05.lesson02.teach.opa_oma_sentence:
    title: پدربزرگ و مادربزرگ من در روتردام زندگی می‌کنند
    gloss: پدربزرگ و مادربزرگ من در روتردام زندگی می‌کنند.
    note: '*Wonen in* + اسم شهر برای گفتن محل زندگی کسی به کار می‌رود.'
  nl.a1.unit05.lesson02.teach.oom_tante_sentence:
    title: عمو و زن‌عموی من دو بچه دارند
    gloss: عمو و زن‌عموی من دو بچه دارند.
    note: از *hebben* استفاده می‌کنیم، چون *oom en tante* به دو نفر اشاره دارد.
  nl.a1.unit05.lesson03.teach.mijn_je_jouw:
    title: «مال من» و «مال تو» (بی‌تکیه و تکیه‌دار)
    gloss: مال من / مال تو (بی‌تکیه) / مال تو (تکیه‌دار)
    note: '*Mijn* همیشه شکل ثابتی دارد، چه قبل از اسم‌های de و het و چه مفرد یا جمع. *Je* شکل غیررسمی و معمول است، وقتی روی اینکه مال چه کسی است تأکید نمی‌کنید؛ آن هم قبل از هر اسمی همین شکل را دارد. *Jouw* قوی‌تر از *je* است و وقتی عضو خانواده‌ی یک نفر را با دیگری مقایسه می‌کنید لازم است؛ آن هم قبل از هر اسمی ثابت است.'
    example_gloss:
    - این برادر من است.
    - این خواهر توست؟
    - آن خواهر توست؟
  nl.a1.unit05.lesson03.teach.je_jouw_note:
    title: je یا jouw
    gloss: je و jouw هر دو یعنی «مال تو» در حالت غیررسمی
    note: وقتی تأکید خاصی ندارید از *je* استفاده کنید. وقتی روی اینکه مال چه کسی است تأکید دارید، مخصوصاً در مقایسه، از *jouw* استفاده کنید. شکل کامل *jouw* بدون مقایسه هم ممکن است، ولی آنجا *je* رایج‌تر است.
    target_text: je و jouw هر دو یعنی «مالِ تو» در حالت غیررسمی. je بدون تأکید معمول است؛ jouw قوی‌تر است و برای تقابل لازم می‌شود. هر دو قبل از همهٔ اسم‌ها یک شکل دارند.
  nl.a1.unit05.lesson03.teach.dit_is_mijn_broer:
    title: این برادر من است
    gloss: این برادر من است.
    note: '*Dit is ...* برای معرفی کسی که نزدیک است به کار می‌رود.'
  nl.a1.unit05.lesson03.teach.is_dat_jouw_zus:
    title: آن خواهر توست؟
    gloss: آن خواهر توست؟
    note: '*Dat is ...* برای کسی است که دورتر است یا قبلاً از او حرف زده شده.'
  nl.a1.unit05.lesson04.teach.zijn_haar:
    title: «مال او» (مرد) و «مال او» (زن)
    gloss: مال او (مرد) / مال او (زن)
    note: '*Zijn* مثل *mijn*، *je* و *jouw* همیشه شکل ثابتی دارد. *Haar* هم همیشه شکل ثابتی دارد.'
    example_gloss:
    - این پدر اوست.
    - آن مادر اوست.
  nl.a1.unit05.lesson04.teach.zijn_haar_note:
    title: zijn یا haar
    gloss: zijn = مال او (مرد)، haar = مال او (زن)
    note: 'در این مثال‌ها، برای صاحبِ مرد از *zijn* و برای صاحبِ زن از *haar* استفاده کنید. کلمه‌ی خانوادگی بعدی در انتخاب تأثیری ندارد: *zijn vader* و *zijn moeder*؛ *haar vader* و *haar moeder*.'
    target_text: zijn = مالِ او (مرد)، haar = مالِ او (زن)؛ هر دو با هر اسمی که بعدشان بیاید تغییر نمی‌کنند.
  nl.a1.unit05.lesson04.teach.dit_is_zijn_vader:
    title: این پدر اوست
    gloss: این پدر اوست.
    note: '*Zijn vader* یعنی پدرِ او (مرد).'
  nl.a1.unit05.lesson04.teach.dat_is_haar_moeder:
    title: آن مادر اوست
    gloss: آن مادر اوست.
    note: '*Haar moeder* یعنی مادرِ او (زن).'
  nl.a1.unit05.lesson05.teach.heet:
    title: اسمش است / نامیده می‌شود
    gloss: اسمش است
    note: '*Ik heet...* / *Hij heet...* روش معمول گفتن اسم کسی است که در درس اول هم دیدید.'
    example_gloss: اسم من لوته است.
  nl.a1.unit05.lesson05.teach.sander_fenna_jan_marieke:
    title: 'اسم اعضای خانواده: Sander، Fenna، Jan و Marieke'
    gloss: ساندر (اسم پسر هلندی) / فنا (اسم دختر هلندی) / یان (اسم پسر هلندی) / ماریکه (اسم دختر هلندی)
    note: هر چهار اسم، اسم‌های کوچک رایج هلندی هستند. Sander و Jan اسم پسر و Fenna و Marieke اسم دختر هستند.
    example_gloss:
    - اسم برادر من ساندر است.
    - اسم خواهر من فنا است.
    - اسم پدر من یان است.
    - اسم مادر من ماریکه است.
  nl.a1.unit05.lesson05.teach.rotterdam:
    title: Rotterdam
    gloss: روتردام
    note: یکی از شهرهای بزرگ هلند.
    example_gloss: پدربزرگ و مادربزرگ لوته در روتردام زندگی می‌کنند.
  nl.a1.unit05.lesson05.teach.profile:
    title: معرفی خانواده‌ی لوته
    gloss: اسم من لوته است. من یک برادر و یک خواهر دارم. اسم برادرم ساندر و اسم خواهرم فنا است. اسم پدرم یان و اسم مادرم ماریکه است. پدربزرگ و مادربزرگ من در روتردام زندگی می‌کنند.
    note: یک معرفی کوتاه و گفتاری از خانواده‌ی لوته که از واژه‌های درس‌های قبلی همین واحد استفاده می‌کند.
  nl.a1.unit05.lesson06.teach.egypte:
    title: مصر
    gloss: مصر
    note: کشور عمر، مثل واحدهای قبلی.
    example_gloss: پدر و مادر من در مصر زندگی می‌کنند.
  nl.a1.unit05.lesson06.teach.elke_maand:
    title: هر ماه
    gloss: هر ماه
    note: '*Elke* + اسم مفرد یعنی «هر ...».'
    example_gloss: بله، هر ماه.
  nl.a1.unit05.lesson06.teach.lines01_04:
    title: برادر یا خواهر دارید؟
    gloss: 'لوته: تو برادر یا خواهر داری، عمر؟ عمر: بله، من دو خواهر دارم. برادر ندارم. تو چی؟ لوته: من یک برادر و یک خواهر دارم.'
    note: '*Broers of zussen* یعنی برادرها یا خواهرها، با شکل جمع.'
  nl.a1.unit05.lesson06.teach.lines05_08:
    title: پدر و مادرت هم در هلند زندگی می‌کنند؟
    gloss: 'عمر: پدر و مادرت هم در هلند زندگی می‌کنند؟ لوته: بله، پدر و مادرم در اوترخت زندگی می‌کنند. خانواده‌ی تو چی؟ عمر: پدر و مادرم در مصر زندگی می‌کنند، ولی عمویم اینجا در آمستردام زندگی می‌کند.'
    note: '*Wonen ook in* یعنی «هم ... زندگی می‌کنند»؛ برای پرسیدن اینکه آیا همین وضع برای فرد دیگری هم صدق می‌کند.'
  nl.a1.unit05.lesson06.teach.lines09_10:
    title: زیاد می‌بینیش؟
    gloss: 'لوته: چه خوب! زیاد می‌بینیش؟ عمر: بله، هر ماه.'
    note: '*Zie je hem vaak?* روشی طبیعی و رایج برای پرسیدن از تعداد دفعات دیدار است.'
