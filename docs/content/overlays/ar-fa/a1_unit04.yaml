teaching:
  fa.a1.unit04.lesson01.teach.madar:
    title: الأم
    gloss: أم
    note: مادر هي الكلمة المحايدة، الفصيحة والمكتوبة، للأم.
    example_gloss: أمي لطيفة.
  fa.a1.unit04.lesson01.teach.maman:
    title: ماما
    gloss: ماما
    note: مامان هي الكلمة المحكية اليومية التي تستعملها معظم العائلات فعلًا.
    example_gloss: ماما، أنا جائع.
  fa.a1.unit04.lesson01.teach.pedar:
    title: الأب
    gloss: أب
    note: پدر هي الكلمة المحايدة، الفصيحة والمكتوبة، للأب.
    example_gloss: أبي طبيب.
  fa.a1.unit04.lesson01.teach.baba:
    title: بابا
    gloss: بابا
    note: بابا هي الكلمة المحكية اليومية التي تستعملها معظم العائلات فعلًا.
    example_gloss: بابا، أين أنت؟
  fa.a1.unit04.lesson01.teach.baradar:
    title: الأخ
    gloss: أخ
    note: برادر هي الكلمة القياسية للأخ؛ أما الصيغة المحكية الودّية داداش فستأتي لاحقًا في هذه الوحدة.
    example_gloss: عندي أخ واحد.
  fa.a1.unit04.lesson01.teach.khahar:
    title: الأخت
    gloss: أخت
    note: خواهر هي الكلمة القياسية للأخت.
    example_gloss: أختي طالبة جامعية.
  fa.a1.unit04.lesson01.teach.register_note:
    title: الكلمات الرسمية والكلمات اليومية
    gloss: «مامان» و«بابا» مثل «مادر» و«پدر»، لكنهما أكثر عفوية.
    note: في الفارسية مستويان فعليان للحديث عن الوالدين، وليس بينهما فصل صارم بين الرسمي وغير الرسمي؛ فمامان/بابا هما ما يستعمله معظم الناس لمناداة والديهم، حتى في المقامات المهذّبة.
  fa.a1.unit04.lesson02.teach.daram:
    title: عندي
    gloss: عندي
    note: '*دارم* هي صيغة المتكلم المفرد من الفعل *داشتن* («امتلك / عنده») وهو الفعل الأساسي لوصف العائلة.'
  fa.a1.unit04.lesson02.teach.yek:
    title: واحد
    gloss: واحد
    note: یک تُستعمل قبل الاسم المعدود، مثل یک برادر (أخ واحد).
    example_gloss: عندي أخت واحدة.
  fa.a1.unit04.lesson02.teach.one_brother:
    title: عندي أخ واحد.
    gloss: عندي أخ واحد.
    note: 'ترتيب الكلمات: الفاعل، ثم العدد + الاسم، ثم الفعل، وهو الترتيب الفارسي المعتاد (فاعل ـ مفعول ـ فعل).'
  fa.a1.unit04.lesson02.teach.no_sister:
    title: ليست لدي أخت.
    gloss: ليست لدي أخت.
    note: ندارم هو نفي دارم؛ ولا حاجة إلى كلمة مستقلة بمعنى «واحد».
  fa.a1.unit04.lesson02.teach.family_big:
    title: عائلتي كبيرة.
    gloss: أسرتي كبيرة.
    note: بزرگه صيغة محكية مختصرة من «بزرگ است» (كبير).
  fa.a1.unit04.lesson02.teach.family_small:
    title: عائلتنا صغيرة.
    gloss: عائلتنا صغيرة.
    note: کوچیکه صيغة محكية مختصرة من «کوچک است» (صغير)، بنطق عامي کوچیک بدل الصيغة المكتوبة کوچک.
  fa.a1.unit04.lesson03.teach.pedarbozorg:
    title: الجد
    gloss: جد
    note: پدربزرگ، وحرفيًا «الأب الكبير»، ويُستعمل للجد من جهة الأب أو الأم.
    example_gloss: جدي مسنّ.
  fa.a1.unit04.lesson03.teach.madarbozorg:
    title: الجدة
    gloss: جدة
    note: مادربزرگ، وحرفيًا «الأم الكبيرة»، وتُستعمل للجدة من جهة الأب أو الأم.
    example_gloss: جدتي لطيفة.
  fa.a1.unit04.lesson03.teach.amoo:
    title: العم (أخو الأب)
    gloss: العم (أخو الأب)
    note: عمو تعني تحديدًا أخا الأب، وليست كلمة عامة لكل «عم» أو «خال».
    example_gloss: عمي يسكن في طهران.
  fa.a1.unit04.lesson03.teach.amme:
    title: العمّة
    gloss: عمّة (أخت الأب)
    note: تعني كلمة عمه تحديدًا أخت الأب.
    example_gloss: عمّتي معلّمة.
  fa.a1.unit04.lesson03.teach.dayi:
    title: الخال
    gloss: خال (أخو الأم)
    note: تعني كلمة دایی تحديدًا أخو الأم. والفارسية، مثل العربية، تميّز بين جهة الأب وجهة الأم في الأعمام والعمّات والأخوال والخالات، فلكل منهم كلمة خاصة.
    example_gloss: خالي مهندس.
  fa.a1.unit04.lesson03.teach.khale:
    title: الخالة
    gloss: خالة (أخت الأم)
    note: تعني كلمة خاله تحديدًا أخت الأم.
    example_gloss: خالتي تعيش في أصفهان.
  fa.a1.unit04.lesson03.teach.register_note:
    title: جهة الأب وجهة الأم
    gloss: العم والعمّة من جهة الأب، والخال والخالة من جهة الأم.
    note: 'هذا التقسيم الرباعي (عمو/عمه مقابل دایی/خاله) يوازي العربية: عمّ وعمّة من جهة الأب، وخال وخالة من جهة الأم.'
  fa.a1.unit04.lesson04.teach.chand_ta:
    title: كم عدد
    gloss: كم
    note: چند تا تُستخدم في الكلام العادي قبل عدّ الأشخاص أو الأشياء.
    example_gloss: كم أختًا لديكم؟
  fa.a1.unit04.lesson04.teach.polite_question:
    title: كم عدد إخوتك وأخواتك؟ (بصيغة مهذبة)
    gloss: كم أخًا وأختًا لديك؟
    note: دارید هي صيغة المخاطب المهذّبة أو الجمع للفعل «يملك/لدى»، وتناسب شما.
  fa.a1.unit04.lesson04.teach.spoken_question:
    title: كم عدد إخوتك وأخواتك؟ (بصيغة غير رسمية)
    gloss: كم أخًا وأختًا لديك؟
    note: داری هي صيغة المفرد غير الرسمية، وتُستخدم مع من هو في سنّك أو أصغر منك.
  fa.a1.unit04.lesson04.teach.family_size_question:
    title: كم عدد أفراد أسرتك؟
    gloss: كم عدد أفراد أسرتكم؟
    note: نفر هي كلمة العدّ للأشخاص، ونفرن صيغة محكية مختصرة من «نفر هستند» (هم ... أشخاص).
  fa.a1.unit04.lesson04.teach.answer_example:
    title: 'نحن أربعة: أنا وأمي وأبي وأخي.'
    gloss: 'نحن أربعة: أنا وأمي وأبي وأخي.'
    note: نفریم صيغة محكية مختصرة من «نفر هستیم» (نحن ... أشخاص).
  fa.a1.unit04.lesson05.teach.showhar:
    title: الزوج
    gloss: زوج
    note: شوهر هي الكلمة المعتادة للزوج.
    example_gloss: زوجي مهندس.
  fa.a1.unit04.lesson05.teach.zan:
    title: الزوجة
    gloss: زوجة
    note: تعني زن أيضًا «امرأة» بوجه عام، ويوضّح السياق المعنى.
    example_gloss: زوجتي معلّمة.
  fa.a1.unit04.lesson05.teach.motahel:
    title: متزوج
    gloss: متزوّج
    note: متأهل صفة محايدة شائعة الاستخدام للحالة الاجتماعية.
    example_gloss: هو متزوّج / هي متزوّجة.
  fa.a1.unit04.lesson05.teach.mojarad:
    title: الأعزب
    gloss: أعزب (غير متزوّج)
    note: مجرد هي الكلمة المعتادة لغير المتزوّج.
    example_gloss: أنا أعزب / أنا عزباء.
  fa.a1.unit04.lesson05.teach.i_am_single:
    title: أنا أعزب / أنا عزباء.
    gloss: أنا أعزب / أنا عزباء.
    note: مجردم = مجرد + م («أنا»)، وهو نمط اللاحقة نفسه للمتكلم في خوبم («أنا بخير»).
  fa.a1.unit04.lesson05.teach.i_am_married:
    title: أنا متزوّج / أنا متزوّجة.
    gloss: أنا متزوّج / أنا متزوّجة.
    note: متأهلم = متأهل + م («أنا»)، بالنمط نفسه في مجردم.
  fa.a1.unit04.lesson05.teach.nave:
    title: الحفيد
    gloss: حفيد / حفيدة
    note: تشمل كلمة نوه الحفيد والحفيدة معًا؛ فالفارسية لا تحتاج إلى تحديد الجنس هنا.
    example_gloss: لديه / لديها حفيد واحد.
  fa.a1.unit04.lesson05.teach.example:
    title: أخي متزوّج، ولديه ابن واحد.
    gloss: أخي متزوّج، ولديه ابن واحد.
    note: متأهله صيغة محكية مختصرة من «متأهل است» (متزوّج)، وداره صيغة محكية من «دارد» (لديه).
  fa.a1.unit04.lesson06.teach.in_photo:
    title: هل هذه صورة عائلتك؟
    gloss: هل هذه صورة عائلتك؟
    note: خانواده‌ته صيغة محكية مختصرة من «خانواده‌ی تو است» (هي عائلتك)، وهو نمط شائع جدًّا في الكلام.
  fa.a1.unit04.lesson06.teach.yes_mom_dad:
    title: نعم. هذه أمي، وهذا أبي.
    gloss: نعم. هذه أمي، وهذا أبي.
    note: '*آره* هي «نعم» في الكلام المحكي (مقابل *بله* الرسمية). و*مامانمه* هي *مامانم* («أمي») مع نهاية «هو/هي» المحكية.'
  fa.a1.unit04.lesson06.teach.who_is_he:
    title: من هذا الرجل؟
    gloss: من هذا الرجل؟
    note: کیه صيغة محكية مختصرة من «کی است» (من هو).
  fa.a1.unit04.lesson06.teach.brother_answer:
    title: إنه أخي. لدي أخ واحد وليست لدي أخت.
    gloss: إنه أخي. لدي أخ واحد وليست لدي أخت.
    note: داداش كلمة ودّية ويومية بمعنى «أخ»، استُخدمت هنا بدل برادر الأكثر حيادًا التي وردت في الدرس الأول.
  fa.a1.unit04.lesson06.teach.opposite_family:
    title: عائلتي على العكس؛ لدي أختان وليس لدي أخ.
    gloss: عائلتي على العكس؛ لدي أختان وليس لدي أخ.
    note: برعکسه صيغة مختصرة من «برعکس است» (هي على العكس).
  fa.a1.unit04.lesson06.teach.closing:
    title: إذن عائلتك أيضًا مليئة بالحيوية!
    gloss: إذن عائلتك أيضًا مليئة بالحيوية!
    note: شلوغه صيغة مختصرة من «شلوغ است» (مزدحمة/حيوية)، وهي طريقة دافئة وشائعة لوصف عائلة فيها عدّة أبناء.
  fa.a1.unit04.lesson06.teach.formal_register_note:
    title: 'الصيغة الرسمية: يملك / لا يملك / هو'
    gloss: 'في الكلام: داره، نداره. في الكتابة الرسمية: دارد، ندارد؛ هو أخي: او برادرم است.'
    note: دارد/ندارد/است هي الصيغ المكتوبة الرسمية المقابلة لصيغ الكلام داره/نداره المستخدمة في هذا الحوار. لاحظ أن الكتابة الرسمية تستبدل أيضًا داداش الودّية بـ برادر المحايدة.
