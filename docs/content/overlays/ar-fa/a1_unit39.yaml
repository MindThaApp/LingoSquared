  fa.a1.unit39.lesson01.teach.review_komak:
    title: 'مراجعة: المساعدة'
    gloss: مساعدة
    note: سبق تقديم كلمة *کمک* («مساعدة»).
  fa.a1.unit39.lesson01.teach.lazame:
    title: لازم
    gloss: مطلوب
    note: '*لازمه* كلمة واحدة تعني «مطلوب/لازم»، وتُبنى مثل *قشنگه* («جميل») و*گرمه* («حار»).'
    example_gloss: المساعدة مطلوبة!
  fa.a1.unit39.lesson01.teach.polis:
    title: الشرطة
    gloss: الشرطة
    note: '*پلیس* تعني «الشرطة»، وهي كلمة دخيلة مستعملة في الكلام اليومي.'
    example_gloss: الشرطة مطلوبة!
  fa.a1.unit39.lesson01.teach.ambulance:
    title: الإسعاف
    gloss: سيارة إسعاف
    note: '*آمبولانس* تعني «سيارة الإسعاف».'
    example_gloss: الإسعاف مطلوب!
  fa.a1.unit39.lesson02.teach.atashneshani:
    title: الإطفاء
    gloss: الإطفاء
    note: '*آتش‌نشانی* تعني «إدارة الإطفاء» أو «فرقة الإطفاء».'
    example_gloss: الإطفاء مطلوب!
  fa.a1.unit39.lesson02.teach.atash:
    title: حريق
    gloss: حريق
    note: '*آتش* تعني «نار/حريق»، وهي أصل كلمة *آتش‌نشانی* («الإطفاء»).'
    example_gloss: حريق! الإطفاء مطلوب!
  fa.a1.unit39.lesson02.teach.khatar:
    title: خطر
    gloss: خطر
    note: '*خطر* تعني «خطر».'
    example_gloss: خطر! الشرطة مطلوبة!
  fa.a1.unit39.lesson03.teach.review_ken_konid:
    title: 'مراجعة: الأمر بصيغة الاحترام وبصيغة الألفة'
    gloss: افعلوا! (احترام) / افعل! (ألفة)
    note: '*کنید* هي نهاية الأمر للاحترام أو للجمع. أما *کن* الودّية، التي استعملتها مع الأصدقاء في *استراحت کن* («استرح!»)، فهي للشخص الواحد الذي تعرفه جيدًا.'
  fa.a1.unit39.lesson03.teach.komak_konid:
    title: النجدة!
    gloss: النجدة!
    note: '*کمک کنید!* هي الطريقة المهذبة لطلب النجدة، وتناسب الغرباء وفرق الطوارئ.'
  fa.a1.unit39.lesson03.teach.tasadof:
    title: حادث
    gloss: حادث
    note: '*تصادف* تعني «حادث».'
    example_gloss: حادث! النجدة!
  fa.a1.unit39.lesson03.teach.orjans:
    title: طوارئ
    gloss: طوارئ
    note: '*اورژانس* تعني «طوارئ»، وهي الكلمة نفسها المستعملة لقسم الطوارئ في المستشفى.'
    example_gloss: إنها حالة طارئة! النجدة!
  fa.a1.unit39.lesson04.teach.review_alo_bashe_mamnoon:
    title: 'مراجعة: ألو / حسنًا / شكرًا'
    gloss: ألو (في الهاتف) / حسنًا / شكرًا
    note: سبق تقديم *الو* و*باشه* و*ممنون*.
  fa.a1.unit39.lesson04.teach.review_miad:
    title: قادم
    gloss: قادم/ة
    note: '*میاد* («هو/هي قادم/ة») يتبع نمط نهايات الشخص نفسه الذي في *میام* («أنا قادم/ة»)، وقد تعلمتَه سابقًا.'
  fa.a1.unit39.lesson04.teach.zud_biayid:
    title: تعالوا بسرعة!
    gloss: تعالوا بسرعة!
    note: '*زود* تعني «بسرعة»؛ و*بیایید* هو الأمر المهذب «تعالوا!»'
  fa.a1.unit39.lesson04.teach.zang_bezanid:
    title: اتصلوا!
    gloss: اتصلوا!
    note: '*زنگ بزنید!* هو الأمر المهذب من *زنگ زدن* («الاتصال هاتفيًا»)، وقد تعلمتَه سابقًا.'
  fa.a1.unit39.lesson04.teach.dialogue_line1:
    title: 'نيما: ألو! النجدة! الشرطة مطلوبة!'
    gloss: ألو! النجدة! الشرطة مطلوبة!
  fa.a1.unit39.lesson04.teach.dialogue_line2:
    title: 'سارا: حسنًا. الشرطة قادمة.'
    gloss: حسنًا. الشرطة قادمة.
  fa.a1.unit39.lesson04.teach.dialogue_line3:
    title: 'نيما: شكرًا! تعالوا بسرعة!'
    gloss: شكرًا! تعالوا بسرعة!
  fa.a1.unit39.lesson04.teach.dialogue_line4:
    title: 'سارا: حسنًا!'
    gloss: حسنًا!
  fa.a1.unit39.lesson05.teach.reading_note:
    title: عن هذا الإشعار
    gloss: حادث / خطر / حريق
    note: 'في الإشعار يأتي بعد كل نوع من الطوارئ علامة استفهام، كأنه يسأل: «في حالة حادث؟». وتأتي الجهة التي يجب الاتصال بها بعده مباشرة.'
  fa.a1.unit39.lesson05.teach.reading_text:
    title: 'قراءة: إشعار طوارئ'
    gloss: حادث؟ الإسعاف مطلوب! خطر؟ الشرطة مطلوبة! حريق؟ الإطفاء مطلوب! اتصلوا بسرعة!
    note: إشعار قصير يذكر الجهة التي يجب الاتصال بها لكل نوع من الطوارئ.
  fa.a1.unit39.lesson06.teach.review_polis_komak:
    title: الشرطة مطلوبة! النجدة!
    gloss: الشرطة مطلوبة! النجدة!
    note: جملة مراجعة مكوّنة من كلمات هذه الوحدة فقط.
  fa.a1.unit39.lesson06.teach.review_orjans_biayid:
    title: إنها حالة طارئة! تعالوا بسرعة!
    gloss: إنها حالة طارئة! تعالوا بسرعة!
  fa.a1.unit39.lesson06.teach.summary_services:
