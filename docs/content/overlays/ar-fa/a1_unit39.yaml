course:
  title: الفارسية A1
  description: 'الفارسية الإيرانية للمبتدئين: تسمية خدمات الطوارئ الثلاث (الشرطة والإسعاف والإطفاء)، والتعبير عمّا هو مطلوب، وطلب المساعدة بأوامر مهذبة، وحوار لإجراء مكالمة طوارئ، وقراءة إشعار قصير عن الطوارئ.'
