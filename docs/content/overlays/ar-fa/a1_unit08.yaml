    title: اسأل عن سعر شيء
    gloss: بكم هذا؟
    note: این چنده؟ هي الطريقة المحكية المعتادة للسؤال عن السعر، وهي اختصار لـ این چند است.
  fa.a1.unit08.lesson02.teach.per_kilo_price:
    title: ذكر السعر للكيلوغرام
    gloss: الكيلو بثلاثين تومانًا.
    note: تذكر کیلویی سی تومنه السعر للكيلو باستخدام الصيغة المحكية المختصرة بـ -e (تومنه = تومن است).
  fa.a1.unit08.lesson02.teach.contraction_note:
    title: الاختصار المحكي بـ -e (مراجعة)
    gloss: تومنه هي الصيغة المحكية اليومية المختصرة من تومن است.
    note: هذا هو نمط الاختصار نفسه الذي مرّ معنا في كلمات الطقس مثل آفتابیه.
  fa.a1.unit08.lesson03.teach.one_kilo:
    title: اطلب كيلو من التفاح
    gloss: أريد كيلو من التفاح.
    note: تستخدم یک کیلو سیب می‌خوام كلمة کیلو وحدةً للعدّ.
  fa.a1.unit08.lesson03.teach.half_kilo:
    title: اطلب نصف كيلو
    gloss: أريد نصف كيلو.
    note: في عبارة نصف کیلو می‌خوام تحلّ كلمة نصف (أي النصف) محلّ الكيلو الكامل.
  fa.a1.unit08.lesson04.teach.discount_question:
    title: اطلب تخفيضًا في السعر
    gloss: هل تمنحني تخفيضًا؟
    note: سؤال تخفیف می‌دید؟ سؤال طبيعي وشائع في الأسواق والمحلات الإيرانية، فالمساومة جزء عادي ومتوقَّع من ثقافة التسوّق، وليست وقاحة ولا أمرًا غريبًا.
  fa.a1.unit08.lesson04.teach.discount_offer:
    title: البائع يعرض سعرًا أقل
    gloss: سأحسبها عليك بثمانية وعشرين تومانًا.
    note: عبارة برات بیست و هشت تومن حساب می‌کنم تعرض تخفيضًا بسيطًا عن السعر الأصلي، وهو 30 تومانًا.
  fa.a1.unit08.lesson05.teach.pay_cash:
    title: قل إنك ستدفع نقدًا
    gloss: سأدفع نقدًا.
    note: عبارة نقدی حساب می‌کنم تذكر طريقة الدفع باستخدام كلمة نقدی (أي نقدًا).
  fa.a1.unit08.lesson05.teach.card_question:
    title: اسأل عن الدفع بالبطاقة
    gloss: هل تقبلون البطاقات؟
    note: عبارة کارت می‌گیرید؟ تسأل عمّا إذا كان الدفع بالبطاقة مقبولًا.
  fa.a1.unit08.lesson06.teach.please_review:
    title: تفضّل / تفضّلوا (مراجعة)
    gloss: تفضّل
    note: وردت كلمة بفرمایید في وحدة التحيات، وهنا يستخدمها البائع لدعوة الزبون.
  fa.a1.unit08.lesson06.teach.thanks_review:
    title: شكرًا (مراجعة)
    gloss: شكرًا
    note: وردت كلمة ممنون في وحدة التحيات.
  fa.a1.unit08.lesson06.teach.no_worries_review:
    title: لا داعي للشكر (مراجعة)
    gloss: لا داعي للشكر / عفوًا
    note: عبارة قابلی نداره طريقة متواضعة وشائعة للرد على الشكر، وقد مرّت معنا في وحدة سابقة.
  fa.a1.unit08.lesson06.teach.turn01:
    title: البائع يرحّب بالزبون
    gloss: البائع يرحّب بالزبون ويدعوه إلى التفضّل.
    note: كلمة بفرمایید تدعو الزبون إلى التجوّل أو إلى أن يسأل عمّا يريد.
  fa.a1.unit08.lesson06.teach.turn02:
    title: الزبون يسأل عن السعر
    gloss: الزبون يلقي التحية على البائع ويسأل عن سعر التفاح.
    note: عبارة این چنده؟ من الدرس الثاني، وقد طُبّقت هنا على سیب‌ها (التفاحات).
  fa.a1.unit08.lesson06.teach.turn03:
    title: البائع يذكر السعر
    gloss: البائع يقول إن الكيلو بثلاثين تومانًا.
    note: عبارة کیلویی سی تومنه من الدرس الثاني.
  fa.a1.unit08.lesson06.teach.turn04:
    title: الزبون يطلب كمية ويسأل عن التخفيض
    gloss: الزبون يقول إنه يريد كيلو ويسأل عن التخفيض.
    note: تجمع هذه الجملة بين نمط الكمية في الدرس الثالث وسؤال التخفيض في الدرس الرابع.
  fa.a1.unit08.lesson06.teach.turn05:
    title: البائع يوافق على سعر أقل
    gloss: البائع يوافق ويعرض ثمانية وعشرين تومانًا.
    note: كلمة باشه (حسنًا) تدل على الموافقة قبل ذكر السعر المخفَّض.
  fa.a1.unit08.lesson06.teach.turn06:
    title: الزبون يشكر ويدفع
    gloss: الزبون يشكر البائع ويقول إنه سيدفع نقدًا.
    note: تجمع هذه الجملة بين مفردات الدفع في الدرس الخامس وعبارة شكر بسيطة.
  fa.a1.unit08.lesson06.teach.turn07:
    title: البائع يختم التعامل
    gloss: البائع يردّ على الشكر ويدعو الزبون إلى التفضّل.
    note: عبارة قابلی نداره، بفرمایید تختم عملية الشراء بلطف.
