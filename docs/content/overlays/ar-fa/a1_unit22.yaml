    example_gloss: لديّ رسالة.
  fa.a1.unit22.lesson01.teach.call_word:
    title: الاتصال
    gloss: يتصل
    note: زنگ زدن (حرفيًا «قرع الجرس») هو الفعل الشائع للاتصال بشخص ما.
    example_gloss: اتصل بي.
  fa.a1.unit22.lesson01.teach.voice_word:
    title: الصوت
    gloss: صوت
    note: صدا تعني الصوت، وتُستخدم لوصف صوت المتكلم في المكالمة.
    example_gloss: صوتك جيد.
  fa.a1.unit22.lesson01.teach.va_word:
    title: و
    gloss: و
    note: و هي أداة الربط الشائعة، وقد مرّت في وحدات سابقة.
    target_text: و (واو العطف)
  fa.a1.unit22.lesson02.teach.hello_phone:
    title: ألو (في الهاتف)
    gloss: ألو، تفضّل
    note: الو تحية خاصة بالهاتف (لا تُستخدم وجهًا لوجه)، وبفرمایید تعني هنا «تفضّل، أنا أسمعك».
  fa.a1.unit22.lesson02.teach.its_me:
    title: أنا نرگس
    gloss: مرحبًا، أنا نرگس
    note: '*منم* هي *من* (أنا) مع لاحقة الفعل -م («أكون»)، فمعناها «هذه أنا»، وهي طريقة شائعة جدًا للتعريف بنفسك في المكالمة. (وقد تعني الكتابة نفسها «وأنا أيضًا» وهي *من هم*، لكن السياق هنا يوضّح المقصود.)'
  fa.a1.unit22.lesson03.teach.can_you_repeat:
    title: هل يمكنك إعادة ذلك؟
    gloss: هل يمكنك أن تكرّر؟
    note: می‌شه (عامية من می‌شود، «هل يمكن») + تکرار کنید (كرّروا) هي صيغة الطلب المهذّب المعتادة.
  fa.a1.unit22.lesson03.teach.speak_slower:
    title: تكلّم ببطء أكثر من فضلك
    gloss: تكلّموا ببطء أكثر من فضلكم
    note: آهسته‌تر صيغة التفضيل من آهسته (ببطء)، أي «ببطء أكثر».
  fa.a1.unit22.lesson04.teach.message_for_you:
    title: لديّ رسالة لك
    gloss: لديّ رسالة لك
    note: برات اختصار برای («لـ») + ت (ضمير المخاطب في العامية).
  fa.a1.unit22.lesson04.teach.tomorrow_four:
    title: تعال إلى المقهى غدًا في الساعة الرابعة
    gloss: تعال إلى المقهى غدًا في الساعة الرابعة
    note: بیا هي صيغة الأمر غير الرسمية من الفعل آمدن (يأتي)، وتُبنى من جذر الفعل المجرّد، وهو النمط نفسه الذي مرّ معنا في أوامر أخرى في المستوى A1.
  fa.a1.unit22.lesson05.teach.goodbye_call:
    title: وداعًا، سنتحدث لاحقًا
    gloss: وداعًا، سنتحدث لاحقًا
    note: 'بعداً تعني «لاحقًا»، وصحبت می‌کنیم هي المضارع الذي يدل على الحاضر والمستقبل: «نتحدث / سنتحدث».'
  fa.a1.unit22.lesson05.teach.better_now:
    title: هل أصبح الصوت أفضل الآن؟
    gloss: هل أصبح أفضل الآن؟
    note: 'الان تعني «الآن»، وبهتر شد تعني حرفيًا «صار أفضل» بصيغة الماضي، وهذه هي الصياغة الطبيعية في الفارسية للاطمئنان على الأمر، بينما نستعمل في العربية عادةً صيغة المضارع أو الماضي: «هل تحسّن الآن؟».'
  fa.a1.unit22.lesson06.teach.how_are_you:
    title: مرحبًا نرگس، كيف حالك؟
    gloss: مرحبًا نرگس، كيف حالك؟
    note: '*چطوری* هي صيغة «كيف حالك؟» غير الرسمية، وهي مناسبة هنا لأن علي ونرگس صديقان.'
  fa.a1.unit22.lesson06.teach.cutting_out:
    title: صوتك يتقطع
    gloss: صوتك يتقطع
    note: قطع و وصل می‌شه تعني حرفيًا «ينقطع ويتصل»، وهو التعبير الفارسي الطبيعي عن تقطّع الاتصال الهاتفي.
  fa.a1.unit22.lesson06.teach.turn01:
    title: علي يردّ على الهاتف
    gloss: 'علي: ألو، تفضّل.'
  fa.a1.unit22.lesson06.teach.turn02:
    title: نرگس تعرّف بنفسها
    gloss: 'نرگس: مرحبًا يا علي، أنا نرگس.'
  fa.a1.unit22.lesson06.teach.turn03:
    title: علي يردّ التحية
    gloss: 'علي: مرحبًا نرگس، كيف حالك؟'
  fa.a1.unit22.lesson06.teach.turn04:
    title: نرگس تطلب منه أن يتكلم ببطء
    gloss: 'نرگس: بخير، شكرًا. هل يمكنك أن تتكلم ببطء أكثر من فضلك؟ صوتك يتقطع.'
  fa.a1.unit22.lesson06.teach.turn05:
    title: علي يتأكد
    gloss: 'علي: حسنًا، هل أصبح أفضل الآن؟'
  fa.a1.unit22.lesson06.teach.turn06:
    title: نرگس تعطيه الرسالة
    gloss: 'نرگس: نعم، أفضل. عندي رسالة لك: تعال إلى المقهى غدًا في الساعة الرابعة.'
  fa.a1.unit22.lesson06.teach.they_go:
    title: هم يذهبون (عامّي)
    gloss: هم يذهبون (صيغة محكية)
    note: '*می‌رن* هي الصيغة المحكية غير الرسمية من *می‌روند* (هم يذهبون)، وهي في المستوى اللغوي المحكي نفسه الذي يعتمده بقية هذه الدورة.'
    target_text: می‌رن (يذهبون، بالعامية)
  fa.a1.unit22.lesson06.teach.turn07:
    title: علي يؤكد
    gloss: 'علي: حسنًا، سآتي بالتأكيد.'
  fa.a1.unit22.lesson06.teach.turn08:
    title: نرگس تنهي المكالمة
    gloss: 'نرگس: وداعًا، سنتحدث لاحقًا.'
  fa.a1.unit22.lesson06.teach.turn09:
    title: علي يودّع
    gloss: 'علي: وداعًا.'
