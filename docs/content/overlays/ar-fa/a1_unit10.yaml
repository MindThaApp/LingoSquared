    gloss: اليوم
    note: امروز تعني «اليوم».
    example_gloss: ما تاريخ اليوم؟
  fa.a1.unit10.lesson04.teach.give_full_date:
    title: اليوم الخميس، العاشر من أرديبهشت.
    gloss: اليوم الخميس، العاشر من أرديبهشت.
    note: امروز پنجشنبه، دهم اردیبهشته تجمع في جملة واحدة اسم اليوم والتاريخ الترتيبي واسم الشهر، مع صيغة الاختصار المحكية (اردیبهشته = اردیبهشت است).
  fa.a1.unit10.lesson04.teach.tarikh_word:
    title: التاريخ
    gloss: تاريخ
    note: '*تاریخ* تعني «التاريخ»، وهي الكلمة العامة للتاريخ في التقويم، كما في *تاریخ جلسه* (تاريخ الاجتماع).'
    example_gloss: ما هو تاريخ اليوم؟
  fa.a1.unit10.lesson05.teach.which_day_meeting:
