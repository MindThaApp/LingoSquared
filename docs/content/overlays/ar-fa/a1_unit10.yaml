  fa.a1.unit10.lesson05.teach.which_date:
    title: ما تاريخ يوم الثلاثاء في أرديبهشت؟
    gloss: ما تاريخ يوم الثلاثاء في أرديبهشت؟
    note: سه‌شنبه چندم اردیبهشته؟ سؤال عن التاريخ الرقمي المحدد ليوم معيّن.
  fa.a1.unit10.lesson06.teach.hashtom:
