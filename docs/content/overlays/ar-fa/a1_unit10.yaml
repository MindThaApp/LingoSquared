  fa.a1.unit10.lesson06.teach.turn01:
    title: رضا، في أيّ يوم الاجتماع؟
    gloss: رضا، في أيّ يوم الاجتماع؟
    note: تبدأ مريم الحوار بسؤال رضا مباشرةً مناديةً إياه باسمه.
  fa.a1.unit10.lesson06.teach.turn02:
    title: أظن أنه يوم الثلاثاء.
    gloss: أظن أنه يوم الثلاثاء.
    note: فکر کنم (أظن) تخفف من حدة جواب رضا وتدل على أنه غير متأكد تمامًا.
  fa.a1.unit10.lesson06.teach.turn03:
    title: ما تاريخ يوم الثلاثاء في أرديبهشت؟
    gloss: ما تاريخ يوم الثلاثاء في أرديبهشت؟
    note: تتابع مريم بسؤال عن التاريخ الرقمي المحدد.
  fa.a1.unit10.lesson06.teach.turn04:
    title: الثلاثاء هو الثامن من أرديبهشت.
    gloss: الثلاثاء هو الثامن من أرديبهشت.
    note: يذكر رضا التاريخ المحدد.
  fa.a1.unit10.lesson06.teach.turn05:
    title: حسنًا، جيد. ماذا عن الجمعة، هل لديك وقت؟
    gloss: حسنًا، جيد. ماذا عن الجمعة، هل لديك وقت؟
    note: تؤكد مريم التاريخ ثم تسأل عن يوم آخر.
  fa.a1.unit10.lesson06.teach.turn06:
    title: لا، أنا مشغول يوم الجمعة.
    gloss: لا، أنا مشغول يوم الجمعة.
    note: سرم شلوغه (حرفيًا «رأسي مزدحم») هي الطريقة العامية الإيرانية الطبيعية للقول إنك مشغول.
  fa.a1.unit10.lesson06.teach.turn07:
    title: لا مشكلة، أراك يوم الثلاثاء.
    gloss: لا مشكلة، أراك يوم الثلاثاء.
    note: مشکلی نیست (لا مشكلة) تقبل اعتذار رضا بلطف، وتعني می‌بینمت «سأراك»، وبذلك يتأكد يوم الثلاثاء موعدًا للاجتماع كما ورد سابقًا في الحوار.
  fa.a1.unit10.lesson06.teach.va_and:
    title: و
    gloss: و
    note: '*و* تعني «و». يمكنها الربط بين يومين، كما في *دوشنبه و سه‌شنبه*، أو بين سؤالين مترابطين، كما في *جلسه کدوم روزه و چندم اردیبهشته؟*'
    example_gloss: لديّ حصة يوم الاثنين والثلاثاء.
