    note: دوشنبه وسه‌شنبه يأتيان بعد شنبه ويكشنبه.
    example_gloss:
    - عندي درس يوم الاثنين.
    - عندي موعد يوم الثلاثاء.
  fa.a1.unit10.lesson01.teach.chaharshanbe_panjshanbe:
    title: الأربعاء، الخميس
    gloss: الأربعاء، الخميس
    note: چهارشنبه وپنجشنبه من أيام منتصف الأسبوع وآخره.
    example_gloss:
    - أعمل يوم الأربعاء.
    - سأراك يوم الخميس.
  fa.a1.unit10.lesson01.teach.jome:
    title: الجمعة
    gloss: الجمعة
    note: جمعه آخر أيام الأسبوع، وهو يوم العطلة الأسبوعية التقليدي في إيران.
    example_gloss: الجمعة عطلة.
  fa.a1.unit10.lesson01.teach.weekend_note:
    title: العطلة الأسبوعية
    gloss: الجمعة هي يوم العطلة الأسبوعية.
    note: جمعه (الجمعة) هو يوم الراحة الأسبوعي التقليدي في إيران، مع أن بعض أماكن العمل الحديثة تغلق الآن أيضًا بعد ظهر الخميس.
  fa.a1.unit10.lesson02.teach.farvardin:
    title: فروردين (الشهر الأول)
    gloss: فروردين، الشهر الأول من السنة الشمسية الإيرانية
    note: فروردين يبدأ به العام الشمسي الإيراني، تقريبًا في أواخر مارس (قرابة الاعتدال الربيعي وعيد النوروز).
    example_gloss: فروردين هو الشهر الأول من السنة.
  fa.a1.unit10.lesson02.teach.ordibehesht:
    title: أرديبهشت (الشهر الثاني)
    gloss: أرديبهشت، الشهر الثاني
    note: اردیبهشت يأتي بعد فروردین، تقريبًا في أبريل – مايو.
    example_gloss: الطقس جميل في أرديبهشت.
  fa.a1.unit10.lesson02.teach.khordad:
    title: خرداد (الشهر الثالث)
    gloss: خرداد، الشهر الثالث
    note: خرداد يأتي بعد اردیبهشت، تقريبًا في مايو – يونيو.
    example_gloss: وُلدت في شهر خرداد.
  fa.a1.unit10.lesson02.teach.calendar_note:
    title: التقويم الشمسي الإيراني
    gloss: تستخدم إيران التقويم الهجري الشمسي (الفارسي).
    note: '*ایران از تقویم هجری شمسی استفاده می‌کنه* تعني أن إيران تستخدم هذا التقويم في التواريخ اليومية، وهو نظام التقويم نفسه المستخدم في أفغانستان، لكن بأسماء أشهر فارسية الأصل بدل الأسماء المشتقة من العربية المستخدمة في أفغانستان.'
  fa.a1.unit10.lesson03.teach.what_day_today:
    title: أي يوم اليوم؟
    gloss: أيّ يوم اليوم؟
    note: امروز چندشنبه‌ست؟ تعني حرفيًا «اليوم أيّ يوم من أيام الأسبوع؟»، وهي صيغة محكية مختصرة من چندشنبه است.
  fa.a1.unit10.lesson03.teach.today_word:
