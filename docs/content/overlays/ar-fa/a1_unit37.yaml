    note: جملة مراجعة كاملة لا تستخدم إلا كلمات تعلّمتها في الوحدات السابقة.
  fa.a1.unit37.lesson06.teach.ask_favorite_color:
    title: ما اللون الذي تحبه؟
    gloss: ما اللون الذي تحبه؟
    note: '*چه رنگی* («أي لون») + *دوست داری* («تحب» للمخاطب، وقد سبق تعلّمها في وحدة التفضيلات في *کدوم رو بیشتر دوست داری؟*).'
  fa.a1.unit37.lesson06.teach.review_all_colors:
    title: أصفر / برتقالي / وردي / بنفسجي / رمادي -- الألوان الخمسة الجديدة في هذه الوحدة
