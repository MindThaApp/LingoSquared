  fa.a1.unit37.lesson01.teach.review_known_colors:
    title: 'ألوان تعرفها من قبل: أبيض / أسود / أحمر / أزرق / أخضر / بني'
    gloss: لون / أبيض / أسود / أحمر / أزرق / أخضر / بني
    note: سبق أن تعلّمت *رنگ* («لون») و*سفید* و*سیاه* و*قرمز* و*آبی* في وحدة الملابس، وتعلّمت *سبز* و*قهوه‌ای* في وحدة المظهر. تعيد هذه الوحدة استخدامها جميعًا دون شرحها من جديد.
    target_text: رنگ (لون) / سفید (أبيض) / سیاه (أسود) / قرمز (أحمر) / آبی (أزرق) / سبز (أخضر) / قهوه‌ای (بنّي) -- سبق أن تعلمتها في وحدات سابقة
  fa.a1.unit37.lesson02.teach.banafsh:
