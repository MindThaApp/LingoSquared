    gloss: بنفسجي
    note: '*بنفش* تصف شيئًا لونه بنفسجي.'
    example_gloss: كتابي بنفسجي.
  fa.a1.unit37.lesson02.teach.khakestari:
    title: رمادي
    gloss: رمادي
    note: '*خاکستری* تصف شيئًا لونه رمادي.'
    example_gloss: الطاولة رمادية.
  fa.a1.unit37.lesson02.teach.review_negation:
    title: السيارة ليست سوداء، بل بيضاء
    gloss: السيارة ليست سوداء، بل بيضاء.
    note: '*نیست* تنفي الرابطة الملتصقة بالكلمة، وقد سبق تعلّمها في وحدة المشاعر، وهو النمط نفسه في *تنبل نیست* («ليس كسولًا/كسولة») من وحدة الشخصية.'
    target_text: ماشین سیاه نیست، سفیده. (السيارة ليست سوداء، بل بيضاء.)
  fa.a1.unit37.lesson03.teach.rangesh_chiye:
    title: ما لونه؟
    gloss: ما لونه؟
    note: تضيف *رنگش* اللاحقة الدالة على الملكية *ش* («ـه/ـها») إلى *رنگ* («لون»)، وهو النمط نفسه في *شخصیتش* و*موهاش* و*چشماش*. وقد سبق تعلّم *چیه؟* («ما هو؟») في وحدة التعارف (*اسم شما چیه؟*).
  fa.a1.unit37.lesson03.teach.che_rangiye:
    title: ما لونه؟ (صيغة أخرى)
    gloss: ما لونه؟
    note: '*چه رنگیه؟* صيغة أخرى شائعة بالقدر نفسه للسؤال ذاته، وهي على نمط *چه جوریه؟* من وحدة الشخصية.'
  fa.a1.unit37.lesson03.teach.answer_rang_mashinam:
    title: لون سيارتي أزرق
    gloss: لون سيارتي أزرق.
    note: تضيف *ماشینم* اللاحقة *م* («ـي») إلى *ماشین* («سيارة»)، وهو النمط نفسه في *اسمم* و*پدرم*.
  fa.a1.unit37.lesson03.teach.review_ask_color:
    title: طريقتان للسؤال عن لون شيء ما
    gloss: ما لونه؟ / ما لونه؟
    note: تسأل *رنگش چیه؟* و*چه رنگیه؟* السؤال نفسه، ويمكن استعمال إحداهما مكان الأخرى في الكلام اليومي.
    target_text: رنگش چیه؟ (ما لونه؟ -- اللاحقة ش ضمير ملكية، مثل شخصیتش/موهاش/چشماش) / چه رنگیه؟ (صيغة بديلة على نمط چه جوریه؟)
  fa.a1.unit37.lesson04.teach.ketabet:
    title: ما لون كتابك؟
    gloss: ما لون كتابك؟
    note: تضيف *کتابت* اللاحقة غير الرسمية *ت* («ـك») إلى *کتاب* («كتاب»)، وهو نمط مخاطبة *تو* نفسه في *شخصیتت* من وحدة الشخصية.
  fa.a1.unit37.lesson04.teach.mashinet:
    title: ما لون سيارتك؟
    gloss: ما لون سيارتك؟
    note: تضيف *ماشینت* اللاحقة غير الرسمية *ت* نفسها إلى *ماشین* («سيارة»).
  fa.a1.unit37.lesson04.teach.review_dislike_like:
    title: أحب اللون الأزرق
    gloss: أحب اللون الأزرق.
    note: سبق تعلّم *دوست دارم* («أحب») و*رو* (علامة المفعول به) في وحدة التفضيلات.
    target_text: رنگ آبی رو دوست دارم. (أحب اللون الأزرق.)
  fa.a1.unit37.lesson04.teach.dialogue_line1:
    title: 'نيما: سارا، ما لون كتابك؟'
    gloss: سارا، ما لون كتابك؟
  fa.a1.unit37.lesson04.teach.dialogue_line2:
    title: 'سارا: إنه بنفسجي. وما لون سيارتك؟'
    gloss: إنه بنفسجي. وما لون سيارتك؟
  fa.a1.unit37.lesson04.teach.dialogue_line3:
    title: 'نيما: إنها زرقاء. أحب اللون الأزرق كثيرًا.'
    gloss: إنها زرقاء. أحب اللون الأزرق كثيرًا.
  fa.a1.unit37.lesson04.teach.dialogue_line4:
    title: 'سارا: وأنا أيضًا أحب اللون البنفسجي.'
    gloss: وأنا أيضًا أحب اللون البنفسجي.
  fa.a1.unit37.lesson04.teach.dialogue_line5:
    title: 'نيما: رائع!'
    gloss: رائع!
  fa.a1.unit37.lesson05.teach.roo_word:
    title: على / فوق
    gloss: على / فوق
    note: تعني *روی* «على» أو «فوق»، وهي حرف جر جديد في هذه الوحدة.
    target_text: روی (على / فوق)
  fa.a1.unit37.lesson05.teach.reading_text:
    title: 'قراءة: بيتي'
    gloss: بيتي أبيض. في البيت طاولة رمادية. على الطاولة كتاب أحمر وكتاب أصفر. وقطتي أيضًا هناك، إنها برتقالية.
    note: تصف القراءة ألوان عدة أشياء يومية في بيت.
  fa.a1.unit37.lesson05.teach.reading_note:
    title: يوجد / هناك
    gloss: يوجد
    note: تعني *هست* «يوجد/هناك»، وقد سبق تعلّمها في حوار الاتجاهات في وحدة الأماكن (*یه رستوران هست*، «يوجد مطعم»).
  fa.a1.unit37.lesson06.teach.self_color_preference:
