course:
  title: الفارسية A1
  description: 'فارسية إيرانية للمبتدئين: التعرّف على مفهوم الهواية ووقت الفراغ، وأربعة أنشطة يومية (القراءة، الاستماع إلى الموسيقى، مشاهدة الأفلام، الرياضة/كرة القدم)، والحديث عن عدد مرات ممارستها، وسؤال شخص عمّا يفعله في وقت فراغه، ونص قراءة قصير عن هوايات نيما، وحوار ختامي بين نيما وسارا.'
