    note: ابری تصف الطقس الغائم.
    example_gloss: الطقس غائم.
  fa.a1.unit07.lesson01.teach.snowy:
    title: مثلج
    gloss: مثلج
    note: برفی تصف الطقس المثلج.
    example_gloss: الطقس مثلج في الشتاء.
  fa.a1.unit07.lesson01.teach.or_word:
    title: أو
    gloss: أو
    note: یا تربط بين حالتين مختلفتين للطقس على سبيل الاختيار.
    target_text: یا (أو)
  fa.a1.unit07.lesson02.teach.hot:
    title: الحرّ
    gloss: حارّ
    note: گرم تصف الطقس الحار أو الحرارة عمومًا.
    example_gloss: الطقس حار اليوم.
  fa.a1.unit07.lesson02.teach.cold:
    title: بارد
    gloss: بارد
    note: سرد تصف الطقس البارد أو البرودة عمومًا.
    example_gloss: الطقس بارد في الشتاء.
  fa.a1.unit07.lesson02.teach.cool:
    title: معتدل البرودة
    gloss: معتدل البرودة
    note: خنک تصف الطقس اللطيف المائل إلى البرودة، وهو بين گرم وسرد.
    example_gloss: الجو منعش في المساءات.
  fa.a1.unit07.lesson03.teach.weather_word:
    title: الطقس
    gloss: الطقس
    note: هوا هي الكلمة العامة للطقس (وتعني أيضًا الهواء).
    example_gloss: كيف الطقس اليوم؟
  fa.a1.unit07.lesson03.teach.weather_question:
    title: اسأل عن الطقس
    gloss: كيف الطقس؟
    note: هوا چطوره؟ تستخدم چطوره، وهي كلمة السؤال العامية «كيف» نفسها التي ظهرت في حالتون چطوره؟ في الوحدة 1.
  fa.a1.unit07.lesson03.teach.today_word:
    title: اليوم
    gloss: اليوم
    note: امروز تدل على اليوم الحالي.
    example_gloss: الطقس جميل اليوم.
  fa.a1.unit07.lesson03.teach.tomorrow_word:
    title: غدًا
    gloss: غدًا
    note: فردا تدل على اليوم التالي.
    example_gloss: أراك غدًا.
  fa.a1.unit07.lesson04.teach.today_sunny:
    title: قل إن الطقس مشمس اليوم
    gloss: الطقس اليوم مشمس.
    note: امروز هوا آفتابیه تستخدم اختصار ـه العامي (آفتابیه = آفتابی است) الذي ورد سابقًا في هذه الدورة.
  fa.a1.unit07.lesson04.teach.today_cold:
    title: قل إن الجو بارد اليوم
    gloss: الجو بارد اليوم.
    note: امروز سرده تتبع نمط الاختصار نفسه.
  fa.a1.unit07.lesson04.teach.contraction_note:
    title: اختصار ـه العامي
    gloss: آفتابیه هي الصيغة المختصرة المحكية الشائعة لـ آفتابی است.
    note: 'ينطبق هذا النمط نفسه (الصفة + ه) على أي كلمة طقس: سرده، گرمه، بارونیه، ابریه، برفیه.'
  fa.a1.unit07.lesson04.teach.today_rainy:
    title: قل إن الجو ماطر اليوم
    gloss: اليوم ماطر.
    note: امروز بارونیه تطبق اختصار ـه نفسه على بارونی.
  fa.a1.unit07.lesson05.teach.because_word:
    title: لأنّ
    gloss: لأنّ
    note: چون تُدخل سببًا لاقتراح ما.
    example_gloss: أرتدي معطفًا لأن الجو بارد.
  fa.a1.unit07.lesson05.teach.better_to:
    title: اقترح أخذ مظلة
    gloss: من الأفضل أن نأخذ مظلة.
    note: بهتره چتر ببریم تستخدم بهتره العامية (من الأفضل) لتقديم اقتراح لطيف.
  fa.a1.unit07.lesson05.teach.full_suggestion:
    title: اجمع بين السبب والاقتراح
    gloss: بما أن الجو ماطر، من الأفضل أن نأخذ مظلة.
    note: چون بارونیه، بهتره چتر ببریم تربط بين سبب متعلق بالطقس واقتراح.
  fa.a1.unit07.lesson05.teach.coat_suggestion:
    title: اقترح ارتداء معطف
    gloss: بما أن الجو بارد، من الأفضل أن نرتدي معطفًا.
    note: چون سرده، بهتره کت بپوشیم تتبع نمط السبب + الاقتراح نفسه، مطبقًا على الطقس البارد.
  fa.a1.unit07.lesson06.teach.coat_review:
    title: اقترح ارتداء معطف
    gloss: من الأفضل أن نرتدي معطفًا
    note: کت بپوشیم تتبع نمط بهتره + الفعل نفسه كما في چتر ببریم، مطبقًا على الطقس البارد.
    example_gloss: الجو بارد، لنرتدِ معطفًا.
  fa.a1.unit07.lesson06.teach.turn01:
    title: سارا تسأل عن طقس اليوم
    gloss: سارا تسأل كيف الطقس اليوم.
    note: هوا چطوره؟ هو سؤال الدرس الثالث نفسه.
  fa.a1.unit07.lesson06.teach.turn02:
    title: رضا يقول إن الجو ماطر
    gloss: رضا يقول إنه يظن أن الجو ماطر.
    note: فکر کنم (أظن) تخفف العبارة، لأنه يخمّن وليس متأكدًا.
  fa.a1.unit07.lesson06.teach.turn03:
    title: سارا تقترح أخذ مظلة
    gloss: تقول سارا إن الأفضل أن يأخذا مظلة إذن.
    note: تربط پس (إذن / لذلك) بين حال الطقس والاقتراح.
  fa.a1.unit07.lesson06.teach.turn04:
    title: رضا يوافق ويسأل عن الغد
    gloss: 'يوافق رضا ويسأل: وماذا عن الغد؟'
    note: فردا چی؟ طريقة طبيعية ومختصرة للسؤال عن اليوم التالي.
  fa.a1.unit07.lesson06.teach.turn05:
    title: سارا تصف طقس الغد
    gloss: تقول سارا إن الغد سيكون مشمسًا وحارًا.
    note: في آفتابیه و گرمه تجتمع صيغتان محكيتان للطقس بواسطة و (و).
  fa.a1.unit07.lesson06.teach.turn06:
    title: رضا يقترح الذهاب إلى الحديقة
    gloss: يقول رضا إن هذا رائع، فلنذهب إلى الحديقة.
    note: تعبّر عالیه (رائع) عن ردّ فعل إيجابي قبل اقتراح الخطة.
  fa.a1.unit07.lesson06.teach.turn07:
    title: سارا توافق وتودّعه
    gloss: توافق سارا وتقول إنها ستراه غدًا.
    note: باشه (حسنًا) طريقة محكية شائعة للموافقة على خطة.
