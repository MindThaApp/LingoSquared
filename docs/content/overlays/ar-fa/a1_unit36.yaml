    example_gloss: نيما مضحك.
  fa.a1.unit36.lesson01.teach.khejalati:
    title: خجول
    gloss: خجول
    note: تصف كلمة *خجالتی* شخصًا خجولًا.
    example_gloss: هو/هي خجول قليلًا.
  fa.a1.unit36.lesson01.teach.jeddi:
    title: جادّ
    gloss: جادّ
    note: تصف كلمة *جدی* شخصًا جادًّا.
    example_gloss: معلمنا جادّ.
  fa.a1.unit36.lesson01.teach.review_copula_fusion:
    title: كيف تتصل «هو/هي» المدمجة بكلمات الشخصية
    gloss: هو/هي لطيف / مضحك / خجول (الرابطة المدمجة)
    note: تدمج *مهربونه* كلمة *مهربون* مع *است* مباشرة لأن *مهربون* تنتهي بحرف صامت. أما *بامزه‌ست* فتُكتب بنصف مسافة (ZWNJ) قبل *ست* لأن *بامزه* تنتهي أصلًا بحرف العلة *ه*. وتُلحق *خجالتیه* الحرف *ه* مباشرة بكلمة تنتهي بالياء *ی*، وهو النمط نفسه في *قهوه‌ایه* من وحدة المظهر.
    target_text: مهربونه = مهربون + است (فعل «يكون» مدمج، بعد حرف ساكن) / بامزه‌ست = بامزه + است (بعد حرف علة، مع فاصل ZWNJ) / خجالتیه = خجالتی + ه (بعد ی)
  fa.a1.unit36.lesson02.teach.zerang:
    title: ذكي
    gloss: ذكي / فطن
    note: تصف كلمة *زرنگ* شخصًا ذكيًا أو فطنًا، وخاصة من يحسن التصرف عمليًا.
    example_gloss: مريم ذكية جدًا.
  fa.a1.unit36.lesson02.teach.tanbal:
    title: كسول
    gloss: كسول
    note: تصف كلمة *تنبل* شخصًا كسولًا.
    example_gloss: أنا كسول قليلًا اليوم.
  fa.a1.unit36.lesson02.teach.zahmatkesh:
    title: مجتهد
    gloss: مجتهد
    note: تصف كلمة *زحمت‌کش* شخصًا يعمل بجدّ ويبذل جهدًا حقيقيًا.
    example_gloss: والدي مجتهد جدًا.
  fa.a1.unit36.lesson02.teach.sabur:
    title: صبور
    gloss: صبور
    note: تصف كلمة *صبور* شخصًا صبورًا.
    example_gloss: معلمنا صبور جدًا.
  fa.a1.unit36.lesson02.teach.review_negation:
    title: نفي صفة الشخصية
    gloss: هو/هي ليس كسولًا
    note: 'تنفي *نیست* الرابطة المدمجة: *تنبل نیست* تعني «هو/هي ليس كسولًا»، وهي *نیست* نفسها التي تعلمناها في نفي المشاعر.'
    target_text: تنبل نیست (هو/هي ليس كسولاً / ليست كسولة)
  fa.a1.unit36.lesson03.teach.shakhsiat_word:
    title: الشخصية
    gloss: شخصية
    note: تعني *شخصیت* «الشخصية» أو «الطباع».
    example_gloss: شخصيته/شخصيتها جيدة جدًا.
  fa.a1.unit36.lesson03.teach.ask_shakhsiat:
    title: كيف هي شخصيته/شخصيتها؟
    gloss: كيف هي شخصيته/شخصيتها؟
    note: سبق أن تعلمنا *چطوره؟* («كيف هو...؟») في وحدة التحيات؛ و*ش* لاحقة الملكية التي تعني «ـه/ـها» وتتصل بكلمة *شخصیت* («شخصية»).
  fa.a1.unit36.lesson03.teach.answer_mehrabun_zerang:
    title: هو/هي لطيف وذكي جدًا
    gloss: هو/هي لطيف وذكي جدًا
    note: تعني *و* «و» وتربط بين كلمتين من كلمات الشخصية.
  fa.a1.unit36.lesson03.teach.che_joriye:
    title: كيف هو/هي؟
    gloss: كيف هو/هي؟
    note: '*چه جوریه؟* طريقة عامية شائعة للسؤال «كيف هو/هي؟»، وهي بديل لـ *شخصیتش چطوره؟*.'
  fa.a1.unit36.lesson03.teach.review_shakhsiat_words:
    title: الشخصية / كيف هو...؟ / كيف يكون...؟
    gloss: شخصية / كيف هي...؟ / كيف هو...؟
    note: تتيح لك هذه العبارات الثلاث السؤال عن شخصية أحدهم وذكر صفاتها.
    target_text: شخصیت (الشخصية) / چطوره؟ (كيف هو...؟) / چه جوریه؟ (كيف هو...؟ / على أي نحو هو...؟)
  fa.a1.unit36.lesson04.teach.review_dialogue_words:
    title: نيما / سارا / مريم / أبدًا / فقط / رائع
    gloss: نيما / سارا / مريم / أبدًا / فقط / رائع
    note: '*مریم* صديقة *سارا*، وقد ظهرت في وحدة المظهر. تعني *اصلاً* «أبدًا». وتعني *فقط* «فقط». وتعني *باحال* «رائع/لطيف».'
  fa.a1.unit36.lesson04.teach.get_to_know:
    title: أودّ أن أتعرف عليها أكثر
    gloss: أودّ أن أتعرف عليها أكثر
    note: تعني *بیشتر* «أكثر». وتعني *باهاش* «معه/معها». وتعني *آشنا بشم* «أن أتعرف».
  fa.a1.unit36.lesson04.teach.dialogue_line1:
    title: 'نيما: سارا، كيف هي مريم؟'
    gloss: سارا، كيف هي مريم؟
  fa.a1.unit36.lesson04.teach.dialogue_line2:
    title: 'سارا: هي لطيفة وذكية جدًا.'
    gloss: هي لطيفة وذكية جدًا.
  fa.a1.unit36.lesson04.teach.dialogue_line3:
    title: 'نيما: ألا تكون كسولة؟'
    gloss: ألا تكون كسولة؟
  fa.a1.unit36.lesson04.teach.dialogue_line4:
    title: 'سارا: لا، أبدًا، بل هي مجتهدة جدًا أيضًا. هي فقط خجولة قليلًا.'
    gloss: لا، أبدًا، بل هي مجتهدة جدًا أيضًا. هي فقط خجولة قليلًا.
  fa.a1.unit36.lesson04.teach.dialogue_line5:
    title: 'نيما: هذا رائع، أودّ أن أتعرف عليها أكثر.'
    gloss: هذا رائع، أودّ أن أتعرف عليها أكثر.
  fa.a1.unit36.lesson05.teach.reading_text:
    title: 'قراءة: شخصية مريم'
    gloss: مريم صديقة سارا. هي لطيفة وذكية جدًا. وهي مجتهدة في عملها أيضًا، ولا تكون كسولة أبدًا. هي فقط خجولة قليلًا، ولهذا لا تتكلم كثيرًا في التجمعات الكبيرة.
    note: يصف النص شخصية مريم بصيغة الغائبة، بالصفات نفسها التي وردت في الحوار.
  fa.a1.unit36.lesson05.teach.reading_note:
    title: أبدًا (مع فعل منفي)
    gloss: أبدًا
    note: تأتي *هیچ‌وقت* مع فعل منفي (*نیست*، *نمی‌زنه*) لتعني «أبدًا»، فالفعل في الفارسية يبقى منفيًا مع هذه الكلمة، وهذا يشبه قولنا في العربية «لا ... أبدًا».
  fa.a1.unit36.lesson06.teach.self_description:
    title: أظن أنني مجتهد جدًا، لكنني كسول قليلًا أيضًا
    gloss: أظن أنني مجتهد جدًا، لكنني كسول قليلًا أيضًا
    note: تعني *فکر می‌کنم* «أظن». وتدمج *زحمت‌کشم* كلمة *زحمت‌کش* مع *هستم* («أنا»). و*هستم* هي الصيغة الكاملة غير المدمجة لـ «أنا»، وتُستعمل هنا بعد *هم* («أيضًا») للتأكيد.
  fa.a1.unit36.lesson06.teach.friend_request:
    title: كيف هي شخصيتك؟
    gloss: كيف هي شخصيتك؟
    note: تُلحق *شخصیتت* لاحقة الملكية العامية *ت* («ـك») بكلمة *شخصیت*، وهي صيغة المخاطب بـ *تو* مقابل *شخصیتش*.
  fa.a1.unit36.lesson06.teach.review_trait_words:
    title: لطيف / مضحك / خجول / جادّ / ذكي / كسول / مجتهد / صبور
    gloss: لطيف / مضحك / خجول / جادّ / ذكي / كسول / مجتهد / صبور
    note: هذه هي كلمات الشخصية الثماني الأساسية في هذه الوحدة.
