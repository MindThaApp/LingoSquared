  fa.a1.unit30.lesson01.teach.mikhonam_pattern:
    title: دراسة/قراءة + أنا = أدرس/أقرأ
    gloss: يدرس/يقرأ + أنا = أدرس/أقرأ
    note: '*خوندن* («القراءة» أو «الدراسة»، كما في *کتاب خوندن*) تأخذ لاحقة المضارع نفسها *-م* التي تأخذها *می‌کنم*، فنحصل على *می‌خونم* أي «أدرس» أو «أقرأ».'
    target_text: خوندن (يدرس/يقرأ) + م = می‌خونم (أدرس/أقرأ)
