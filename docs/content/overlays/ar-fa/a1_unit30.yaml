    note: '*رشته* تعني «تخصصًا» جامعيًا أو مجال دراسة. وفي *رشته‌ی من* («تخصصي») تربط الياء الإضافية *ی* الاسم بـ*من*.'
    example_gloss: تخصصي اللغة.
  fa.a1.unit30.lesson02.teach.review_engelisi:
    title: الإنجليزية
    gloss: الإنجليزية
