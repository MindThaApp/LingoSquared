    title: 'قراءة: دراسة نيما وسارا'
    gloss: يدرس نيما الرياضيات في الجامعة. الرياضيات صعبة لكنها ممتعة. تدرس سارا اللغة الإنجليزية. وهي تذهب إلى الجامعة كل يوم.
    note: تعيد هذه القراءة سرد الحوار بصيغة الغائب. لا يوجد فيها مفردات جديدة تقريبًا، فهي تدريب على التعرف إلى الكلمات داخل نص متصل.
