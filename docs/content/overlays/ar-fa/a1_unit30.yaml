course:
  title: الفارسية A1
  description: 'فارسية إيران للمبتدئين: تسمية كلمات الجامعة والدراسة (جامعة، طالب، درس/مادة، لغة)، والحديث عن المادة التي تدرسها أو تتعلمها (الرياضيات، التخصص، اللغة الإنجليزية كمادة)، والسؤال عن مكان الدراسة والإجابة عنه (*کجا درس می‌خونی؟*) وعن عدد مرات الذهاب، ونص قراءة عن دراسة *نیما* و*سارا*، وحوار ختامي بين *نیما* و*سارا* عن موادهما وشعورهما تجاهها (صعبة لكنها مثيرة للاهتمام).'
