teaching:
  fa.a1.unit21.lesson01.teach.money_word:
    title: المال
    gloss: المال
    note: پول هي الكلمة العامة للمال.
    example_gloss: أين مالي؟
  fa.a1.unit21.lesson01.teach.bank_word:
    title: البنك
    gloss: مصرف
    note: بانک هي الكلمة العامة للبنك.
    example_gloss: البنك قريب.
  fa.a1.unit21.lesson01.teach.dollar_word:
    title: الدولار
    gloss: دولار
    note: دلار هي كلمة الدولار (الأمريكي)، وهو أكثر العملات الأجنبية ذكرًا في محادثات الصرف اليومية.
    example_gloss: عندي دولارات.
  fa.a1.unit21.lesson01.teach.exchange_word:
    title: التحويل
    gloss: تحويل / صرف
    note: تبدیل تعني تحويل/صرف، وتُستعمل مع کردن (فعل «يفعل») في تبدیل کردن.
    example_gloss: أريد أن أصرف (المال).
  fa.a1.unit21.lesson01.teach.va_word:
    title: و
    gloss: و
    note: و هي أداة الربط الشائعة، وقد مرّت في وحدات سابقة.
    target_text: و (واو العطف)
  fa.a1.unit21.lesson02.teach.want_exchange:
    title: قل إنك تريد صرف عملة
    gloss: أريد تحويل الدولارات إلى تومان.
    note: في می‌خوام دلار به تومن تبدیل کنم تدل به (إلى) على العملة المطلوبة.
  fa.a1.unit21.lesson02.teach.how_much_dollar:
    title: اسأل عن عدد الدولارات
    gloss: كم دولارًا لديكم؟
    note: تستعمل *چقدر دلار دارید؟* كلمة *چقدر* (كم)، وقد رأيتها في أسئلة الكمية السابقة.
  fa.a1.unit21.lesson03.teach.atm_word:
    title: الصرّاف الآلي
    gloss: صرّاف آلي
    note: خودپرداز تعني حرفيًا «الدافع بنفسه»، وهي الكلمة المعتادة للصرّاف الآلي.
    example_gloss: الصرّاف الآلي هناك.
  fa.a1.unit21.lesson03.teach.withdraw_phrase:
    title: قل إنك تريد سحب المال
    gloss: أريد سحب المال من الصرّاف الآلي.
    note: تستعمل می‌خوام از خودپرداز پول بردارم كلمة از (من) و بردارم (أسحب).
  fa.a1.unit21.lesson04.teach.change_question:
    title: اطلب الفكّة
    gloss: هل لديكم فكّة؟
    note: تستعمل پول خرد دارید؟ كلمة خرد (صغير/فكّة) بعد پول (المال).
  fa.a1.unit21.lesson04.teach.here_you_are:
    title: تفضّل (مراجعة)
    gloss: تفضّل / تفضّلوا
    note: سبق أن تعلّمتَ *بفرمایید* في وحدة سابقة؛ وتُستخدم هنا عند تسليم شيء لشخص ما.
  fa.a1.unit21.lesson05.teach.rate_word:
    title: سعر الصرف
    gloss: سعر الصرف
    note: نرخ هي الكلمة الدالّة على سعر (صرف العملة).
    example_gloss: كم سعر الصرف اليوم؟
  fa.a1.unit21.lesson05.teach.per_dollar_rate:
    title: ذكر سعر الدولار الواحد
    gloss: الدولار الواحد بثلاثين تومانًا.
    note: تستخدم هر دلار سی تومنه كلمة هر (كل) والصيغة المحكية المختصرة -e (*تومنه* = *تومن است*) التي مرّت بك سابقًا.
  fa.a1.unit21.lesson06.teach.hundred_word:
    title: مئة
    gloss: مئة
    note: صد هو العدد 100.
    example_gloss: لديّ مئة دولار.
  fa.a1.unit21.lesson06.teach.please_do:
    title: من فضلك، قم بذلك
    gloss: من فضلكم، حوّلوه
    note: لطفاً تبدیل کنید صيغة أمر مهذّبة من الفعل تبدیل کردن (حوّل / صرف).
  fa.a1.unit21.lesson06.teach.turn01:
    title: سارا تطلب صرف العملة
    gloss: تُلقي سارا التحية على الموظف وتقول إنها تريد تحويل الدولارات إلى تومان.
    note: 'تعيد استخدام جملة الدرس الثاني: می‌خوام دلار به تومن تبدیل کنم.'
  fa.a1.unit21.lesson06.teach.turn02:
    title: الموظف يسأل كم دولارًا لديها
    gloss: يُلقي الموظف التحية على سارا ويسأل كم دولارًا لديها.
    note: 'تعيد استخدام جملة الدرس الثاني: چقدر دلار دارید؟'
  fa.a1.unit21.lesson06.teach.turn03:
    title: سارا تذكر المبلغ وتسأل عن سعر الصرف
    gloss: تقول سارا إن لديها مئة دولار وتسأل عن سعر الصرف اليوم.
    note: صد (مئة) كلمة جديدة؛ أما نرخ امروز چنده؟ فتعيد سؤال الدرس الخامس عن السعر.
  fa.a1.unit21.lesson06.teach.turn04:
    title: الموظف يذكر سعر الصرف
    gloss: يقول الموظف إن الدولار الواحد بثلاثين تومانًا.
    note: 'تعيد استخدام جملة الدرس الخامس: هر دلار سی تومنه.'
  fa.a1.unit21.lesson06.teach.turn05:
    title: سارا توافق وتطلب من الموظف المتابعة
    gloss: توافق سارا وتطلب من الموظف أن يصرف المبلغ من فضلك.
    note: لطفاً تبدیل کنید، وقد تعلّمتَها في بداية هذا الدرس.
  fa.a1.unit21.lesson06.teach.turn06:
    title: الموظف يسلّم المبلغ الإجمالي
    gloss: تفضّلي، ثلاثة آلاف تومان.
    note: '*سه هزار تومن* = 100 دولار × 30 تومانًا للدولار. وكلمة *هزار* (ألف) مراجعة من وحدة الأعداد.'
  fa.a1.unit21.lesson06.teach.turn07:
    title: سارا تشكر الموظف وتطلب فكّة أيضًا
    gloss: شكرًا. هل لديكم فكّة أيضًا؟
    note: 'تعيد استخدام جملة الدرس الرابع: پول خرد دارید؟ مع هم (أيضًا).'
  fa.a1.unit21.lesson06.teach.turn08:
    title: الموظف يؤكد ويسلّم الفكّة
    gloss: نعم، تفضّلي.
    note: بله (نعم) كلمة سبقت مراجعتها؛ وبفرمایید تُختم بها عملية الصرف.
