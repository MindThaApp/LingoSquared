  description: 'فارسية إيران للمبتدئين: تسمية الأجهزة اليومية (الهاتف، الحاسوب، الإنترنت، التطبيق)، وأفعال الهاتف (إرسال رسالة، الاتصال، التقاط صورة، تنزيل تطبيق)، والسؤال عن عدد مرات استخدام الهاتف والإجابة عنه (*هر روز چند بار از گوشیت استفاده می‌کنی؟*)، ونص قراءة عن عادات *نیما* و*سارا* في استخدام الأجهزة، وحوار ختامي بين *نیما* و*سارا* عن كيفية استخدام كل منهما للتكنولوجيا.'
