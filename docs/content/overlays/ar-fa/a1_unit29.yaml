    gloss: تستخدم سارا هاتفها كثيرًا. تلتقط الصور وترسل الرسائل. وتستخدم سارا الحاسوب في البيت أيضًا. ويستخدم نيما الإنترنت كل يوم.
    note: تعيد هذه القراءة سرد الحوار بصيغة الغائب. لا توجد مفردات جديدة تقريبًا، لذا فهي تدريب على التعرّف على الكلمات في نص متصل.
