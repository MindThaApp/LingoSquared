course:
  title: الفارسية A1
  description: 'فارسية إيرانية للمبتدئين: تسمية كلمات الاحتفال وعيد الميلاد (عيد الميلاد، الحفلة، الكعكة، الهدية)، والسؤال عن موعد عيد ميلادك والإجابة عنه (*تولدت کِیه؟*) باستخدام مفردات الشهور والأعداد الترتيبية التي سبق تعلمها، ودعوة شخص إلى حفلة وقبول دعوة (*میای به مهمونی؟* / *آره، حتماً میام*)، وحوار بين نيما وسارا عن عيد الميلاد يقدّم عبارة *تولدت مبارک* («عيد ميلاد سعيد»)، ونص قراءة عن عيد ميلاد نيما، ومراجعة ختامية تسمّي فيها الاحتفالات التي تحبها وتكتب دعوتك أو رسالة التهنئة الخاصة بك.'
