  fa.a1.unit03.lesson01.teach.three:
    title: ثلاثة
    gloss: 3 — ثلاثة
    note: سه تعني ثلاثة.
    example_gloss: لديه ثلاثة إخوة.
  fa.a1.unit03.lesson01.teach.four:
    title: أربعة
    gloss: ٤ — أربعة
    note: چهار تعني «أربعة».
    example_gloss: الساعة الرابعة.
  fa.a1.unit03.lesson01.teach.five:
    title: خمسة
    gloss: ٥ — خمسة
    note: پنج تعني «خمسة».
    example_gloss: انتظروا خمس دقائق.
  fa.a1.unit03.lesson01.teach.six:
    title: ستة
    gloss: ٦ — ستة
    note: شش تعني «ستة».
    example_gloss: يوجد ستة كراسي.
  fa.a1.unit03.lesson01.teach.seven:
    title: سبعة
    gloss: ٧ — سبعة
    note: هفت تعني «سبعة».
    example_gloss: في الأسبوع سبعة أيام.
  fa.a1.unit03.lesson01.teach.eight:
    title: ثمانية
    gloss: ٨ — ثمانية
    note: هشت تعني «ثمانية».
    example_gloss: سأراكم في الساعة الثامنة.
  fa.a1.unit03.lesson01.teach.nine:
    title: تسعة
    gloss: ٩ — تسعة
    note: نه تعني «تسعة»، وهي أيضًا الكلمة المعتادة لـ«لا». والسياق (سماعها ضمن عدّ أو رقم) يحدد المعنى المقصود.
    example_gloss: يوجد تسعة طلاب هنا.
  fa.a1.unit03.lesson01.teach.ten:
    title: عشرة
    gloss: ١٠ — عشرة
    note: ده تعني «عشرة».
    example_gloss: لدي عشرة أصابع.
  fa.a1.unit03.lesson02.teach.eleven:
    title: أحد عشر
    gloss: ١١ — أحد عشر
    note: یازده تعني «أحد عشر».
    example_gloss: عندي حصة في الساعة الحادية عشرة.
  fa.a1.unit03.lesson02.teach.twelve:
    title: اثنا عشر
    gloss: ١٢ — اثنا عشر
    note: دوازده تعني «اثنا عشر».
    example_gloss: في السنة اثنا عشر شهرًا.
  fa.a1.unit03.lesson02.teach.thirteen:
    title: ثلاثة عشر
    gloss: ١٣ — ثلاثة عشر
    note: سیزده تعني «ثلاثة عشر».
    example_gloss: عمره ثلاث عشرة سنة.
  fa.a1.unit03.lesson02.teach.fourteen:
    title: أربعة عشر
    gloss: ١٤ — أربعة عشر
    note: چهارده تعني «أربعة عشر».
    example_gloss: سآتي بعد أربعة عشر يومًا.
  fa.a1.unit03.lesson02.teach.fifteen:
    title: خمسة عشر
    gloss: ١٥ — خمسة عشر
    note: پانزده تعني «خمسة عشر».
    example_gloss: عنده خمسة عشر كتابًا.
  fa.a1.unit03.lesson02.teach.sixteen:
    title: ستة عشر
    gloss: ١٦ — ستة عشر
    note: شانزده تعني «ستة عشر»، ولا يمكن توقعها من شش (ستة) + ده (عشرة)، لذا من الأفضل حفظها ككلمة مستقلة.
    example_gloss: عمره ست عشرة سنة.
  fa.a1.unit03.lesson02.teach.seventeen:
    title: سبعة عشر
    gloss: ١٧ — سبعة عشر
    note: هفده تعني «سبعة عشر».
    example_gloss: جاء سبعة عشر شخصًا.
  fa.a1.unit03.lesson02.teach.eighteen:
    title: ثمانية عشر
    gloss: ١٨ — ثمانية عشر
    note: هجده تعني «ثمانية عشر».
    example_gloss: عمره ثماني عشرة سنة.
  fa.a1.unit03.lesson02.teach.nineteen:
    title: تسعة عشر
    gloss: ١٩ — تسعة عشر
    note: نوزده تعني «تسعة عشر».
    example_gloss: بقي تسعة عشر يومًا.
  fa.a1.unit03.lesson02.teach.twenty:
    title: عشرون
    gloss: ٢٠ — عشرون
    note: بیست تعني «عشرون».
    example_gloss: عندي عشرون كتابًا.
  fa.a1.unit03.lesson02.teach.thirty:
    title: ثلاثون
    gloss: ٣٠ — ثلاثون
    note: سی تعني «ثلاثون».
    example_gloss: هذا الشهر ثلاثون يومًا.
  fa.a1.unit03.lesson02.teach.forty_to_ninety:
    title: من أربعين إلى تسعين
    gloss: 40, 50, 60, 70, 80, 90
    note: چهل، پنجاه، شصت، هفتاد، هشتاد، نود هي بقية العقود.
    example_gloss:
    - عمره أربعون سنة.
    - يوجد خمسون كرسيًا.
    - ستون دقيقة تساوي ساعة واحدة.
    - هذا الكتاب فيه سبعون صفحة.
    - عنده ثمانون كتابًا.
    - عمره تسعون سنة.
  fa.a1.unit03.lesson02.teach.combining:
    title: الجمع بين العقود والآحاد
    gloss: خمسة وعشرون
    note: 'بیست و پنج حرفيًا «عشرون وخمسة»: كلمة العقد، ثم و، ثم كلمة الآحاد.'
  fa.a1.unit03.lesson03.teach.shomare:
    title: رقم (الشيء)
    gloss: رقم
    note: تُستخدم شماره للرقم الذي يعرّف شيئًا ما، مثل رقم الهاتف أو رقم المنزل، وتختلف عن المعنى العام لـ عدد أي «عدد».
    example_gloss: هذا رقم هاتفي.
  fa.a1.unit03.lesson03.teach.telefon:
    title: الهاتف
    gloss: هاتف
    note: تلفن تشمل الهواتف عمومًا، بما فيها الهواتف المحمولة.
    example_gloss: ليس عندي هاتف.
  fa.a1.unit03.lesson03.teach.digit_by_digit:
    title: طلب رقم هاتف
    gloss: ما رقم هاتفك؟
    note: شماره تلفنتون چنده؟ هي الطريقة المهذبة المعتادة لسؤال شخص عن رقم هاتفه. قراءة الرقم خانةً خانةً مفهومة دائمًا وهي الأسلم للمبتدئ؛ أما جمع الأرقام في مجموعات فشائع أيضًا في الكلام الحقيقي، لكن هذا الدرس يتدرب أولًا على الطريقة الأبسط، أي قراءة الرقم رقمًا رقمًا.
  fa.a1.unit03.lesson03.teach.chande:
    title: كم / ما هو؟
    gloss: ما هو؟ / كم هو؟
    note: چنده؟ اختصار لـ چند است، ويُسأل بها عن رقم أو كمية أو سعر بحسب السياق.
  fa.a1.unit03.lesson03.teach.read_number:
    title: قراءة الرقم خانةً خانةً
    gloss: صفر، تسعة، واحد، اثنان، ثلاثة، أربعة، خمسة، ستة، سبعة، ثمانية، ثمانية
    note: يتدرب هذا الدرس على قراءة الأرقام رقمًا رقمًا. رقم الهاتف المحمول الإيراني الحقيقي مكوّن من ١١ رقمًا ويبدأ بالصفر، مثل 0912 345 6788.
  fa.a1.unit03.lesson04.teach.sal:
    title: السنة
    gloss: سنة
    note: تُستخدم سال للسنوات التقويمية ولذكر العمر أيضًا.
    example_gloss: عمري عشرون عامًا.
  fa.a1.unit03.lesson04.teach.man_recap:
    title: أنا (مراجعة)
    gloss: أنا
    note: تذكير سريع بكلمة من «أنا»، فنحتاجها هنا لذكر عمرك في جملة كاملة.
  fa.a1.unit03.lesson04.teach.chand_saale:
    title: السؤال عن عمر شخص (بصيغة غير رسمية)
    gloss: كم عمرك؟
    note: چند سالته؟ صيغة غير رسمية للمفرد، أما چند سالتونه؟ فهي الصيغة المهذبة المقابلة.
  fa.a1.unit03.lesson04.teach.salame:
    title: قل عمرك
    gloss: عمري ٢٥ سنة.
    note: سالمه تلصق ضمير الملكية ـم (ي) مباشرة بكلمة سال، ثم تضيف الرابطة العامية ـه (هو/يكون) — حرفيًا «سنتي هي».
  fa.a1.unit03.lesson04.teach.ta:
    title: وحدة العدّ
    gloss: (كلمة عدّ خاصة، ليس لها مقابل مباشر في العربية)
    note: 'تا هي كلمة العدّ العامة عند عدّ معظم الأشياء: العدد + تا + الاسم.'
  fa.a1.unit03.lesson04.teach.sib:
    title: تفاحة
    gloss: تفاحة
    note: سیب تعني «تفاحة».
    example_gloss: أحب التفاح.
  fa.a1.unit03.lesson04.teach.ketab:
    title: كتاب
    gloss: كتاب
    note: کتاب تعني «كتاب».
    example_gloss: هذا كتاب جيد.
  fa.a1.unit03.lesson04.teach.do_ta_sib:
    title: طلب كمية
    gloss: أريد تفاحتين.
    note: دو تا سیب می‌خوام تضع الكمية المعدودة قبل الاسم، كما هو المعتاد مع تا.
  fa.a1.unit03.lesson05.teach.gheymat:
    title: السعر
    gloss: السعر
    note: قیمت هي الكلمة العامة للسعر.
    example_gloss: كم سعر هذا؟
  fa.a1.unit03.lesson05.teach.toman:
    title: تومان
    gloss: تومان (العملة الإيرانية في الاستخدام اليومي)
    note: العملة الرسمية في إيران هي الريال، لكن الأسعار في الكلام اليومي تُذكر غالبًا بالتومان (١ تومان = ١٠ ريالات).
    example_gloss: هذا بعشرة آلاف تومان.
  fa.a1.unit03.lesson05.teach.hezar:
    title: ألف
    gloss: ألف
    note: هزار تعني «ألف»؛ وتُذكر الأسعار عادةً بآلاف التومانات.
    example_gloss: معي ألف تومان.
  fa.a1.unit03.lesson05.teach.ask_price:
    title: اسأل عن السعر
    gloss: بكم هذا؟
    note: این چنده؟ هي الطريقة المعتادة للسؤال عن سعر شيء أمامك.
  fa.a1.unit03.lesson05.teach.price_answer:
    title: اذكر السعر
    gloss: سعره ٣٠٠٠٠ تومان.
    note: 'تومنه اختصار لـ تومن است؛ والنمط الكامل هو: العدد + هزار + تومنه.'
  fa.a1.unit03.lesson06.teach.practice_together:
    title: سارا تقترح التدرب معًا
    gloss: تقول سارا إنها تريد أن يتدربا على الفارسية معًا، وتسأل مينا عن رقم هاتفها.
    note: باهم تعني «معًا»؛ و می‌خوام ... تمرین کنیم تعني «أريد أن نتدرب». أما تمرین کنیم وحدها في صيغة سؤال فقد تعني أيضًا «هل نتدرب؟»
  fa.a1.unit03.lesson06.teach.mina_gives_number:
    title: مينا تعطي رقمها
    gloss: توافق مينا وتقرأ رقمها المكوّن من ١١ رقمًا رقمًا رقمًا.
    note: شماره‌ام اختصار لـ شماره من، و هشته اختصار لـ هشت است، وبها يكتمل العدّ.
  fa.a1.unit03.lesson06.teach.sara_confirms:
    title: سارا تتأكد من أنها دوّنت الرقم بشكل صحيح
    gloss: تطلب سارا من مينا الانتظار ريثما تكتب الرقم، ثم تقرؤه عليها للتأكد.
    note: درسته؟ («هل هذا صحيح؟») طريقة شائعة للتأكد من رقم أو معلومة سمعتها للتو.
  fa.a1.unit03.lesson06.teach.mina_confirms_asks:
    title: مينا تؤكد وتسأل بالمقابل
    gloss: تؤكد مينا أن الرقم صحيح وتسأل عن رقم سارا.
    note: كلمة آره تعني «نعم» بأسلوب غير رسمي، وهي أكثر عفوية من بله.
  fa.a1.unit03.lesson06.teach.sara_gives_number:
    title: سارا تقول رقمها
    gloss: تقرأ سارا رقمها المكوّن من 11 خانة، رقمًا رقمًا.
    note: يَكه صيغة مختصرة من يک است، وبها ينتهي العدّ كما انتهى بـ هشته في رقم مينا.
  fa.a1.unit03.lesson06.teach.mina_will_call:
    title: مينا توافق على الاتصال
    gloss: تقول مينا إنها ستتصل بسارا غدًا.
    note: 'زنگ می‌زنم بهت تعني «سأتصل بك»، وحرفيًا: «أضرب الجرس لك».'
