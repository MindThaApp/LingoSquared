course:
  title: الفارسية A1
  description: 'فارسية إيرانية للمبتدئين: تسمية الحيوانات الأليفة الشائعة (كلب، قطة، طائر، سمكة)، والسؤال «هل لديك حيوان أليف؟»، وذكر اسم الحيوان الأليف وإطعامه، ووصف لونه وحجمه، ونص قراءة قصير عن قطة سارا پشمک، وحوار ختامي بين سارا ونیما يُعجبان فيه بـپشمک.'
