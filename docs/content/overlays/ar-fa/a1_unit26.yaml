    gloss: واحد / (أداة تنكير)
    note: تُستخدم *یک* هنا للتنكير، أي للدلالة على اسم نكرة غير محدد.
  fa.a1.unit26.lesson05.teach.va_review:
    title: و
    gloss: و
    note: '*و* تعني «و» العاطفة، وقد استُخدمت بهذا المعنى في الوحدات 14 و24 و25.'
  fa.a1.unit26.lesson05.teach.pashmak_name:
    title: پشمک
    gloss: پشمک
    note: '*پشمک* (حرفيًا «غزل البنات») اسم شائع فعلًا للحيوانات الأليفة في إيران، وهو اسم قطة سارا.'
    example_gloss: اسم قطة سارا پشمک.
  fa.a1.unit26.lesson05.teach.har_rooz_review:
    title: كل يوم
    gloss: كل يوم
    note: تُستخدم *هر روز* بالطريقة نفسها هنا لإطعام الحيوان الأليف.
  fa.a1.unit26.lesson05.teach.mide_word:
    title: يُعطي / يُطعم (هو أو هي)
    gloss: يُعطي / يُطعم (هو أو هي)
    note: '*می‌ده* هي صيغة الغائب العامية للفعل نفسه في *می‌دم* (أُعطي / أُطعم) من الدرس الثالث.'
  fa.a1.unit26.lesson05.teach.reading_text:
    title: 'قراءة: قطة سارا'
    gloss: عند سارا قطة. اسمها پشمک. پشمک بيضاء وصغيرة. سارا تُطعم پشمک كل يوم.
    note: تعيد هذه القطعة استخدام كل التراكيب من الدروس 1–4، دون مفردات جديدة تقريبًا، لتتدرب على التعرف عليها في نص متصل.
  fa.a1.unit26.lesson06.teach.in_word:
    title: هذا
    gloss: هذا
    note: '*این* تعني «هذا».'
  fa.a1.unit26.lesson06.teach.kiye_review:
    title: لمن هو؟
    gloss: لمن هو؟
    note: تُستخدم *کیه* هنا للسؤال عن صاحب الحيوان الأليف.
  fa.a1.unit26.lesson06.teach.mane_word:
    title: هو لي
    gloss: هو لي
    note: '*منه* اختصار عامي لـ*من است*، أي «هو لي». و*گربه‌ی منه* تعني «إنها قطتي».'
  fa.a1.unit26.lesson06.teach.sagame_word:
    title: إنه كلبي
    gloss: إنه كلبي
    note: تجمع *سگمه* بين *سگم* (كلبي) من الدرس الثالث ونهاية «يكون» *-ه* نفسها في *منه*، ومعناها «إنه كلبي».
  fa.a1.unit26.lesson06.teach.khoshgel_word:
    title: جميل
    gloss: جميل
    note: '*خوشگل* تعني لطيفًا أو جميلًا. و*خیلی* تعني «جدًّا».'
    example_gloss: قطة سارا جميلة جدًّا.
  fa.a1.unit26.lesson06.teach.mamnoon_review:
    title: شكرًا
    gloss: شكرًا
    note: تظهر *ممنون* هنا مجددًا كعبارة ختامية طبيعية.
  fa.a1.unit26.lesson06.teach.dialogue_line1:
    title: 'نيما: لمن هذه القطة؟'
    gloss: لمن هذه القطة؟
  fa.a1.unit26.lesson06.teach.dialogue_line2:
    title: 'سارا: إنها قطتي. اسمها پشمک.'
    gloss: إنها قطتي. اسمها پشمک.
  fa.a1.unit26.lesson06.teach.dialogue_line3:
    title: 'نيما: ما لونها؟'
    gloss: ما لونها؟
  fa.a1.unit26.lesson06.teach.dialogue_line4:
    title: 'سارا: بيضاء وصغيرة.'
    gloss: بيضاء وصغيرة.
  fa.a1.unit26.lesson06.teach.dialogue_line5:
    title: 'نيما: جميلة جدًّا!'
    gloss: جميلة جدًّا!
  fa.a1.unit26.lesson06.teach.dialogue_line6:
    title: 'سارا: شكرًا!'
    gloss: شكرًا!
