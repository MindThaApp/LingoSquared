    note: سبق أن تعلمت *من* جيدًا، وتظهر هنا من جديد للحديث عن حيوانك الأليف.
  fa.a1.unit26.lesson01.teach.oo_review:
    title: هو / هي
    gloss: هو / هي
    note: تظهر *او* هنا من جديد.
  fa.a1.unit26.lesson01.teach.daram_family_review:
    title: عندي / عنده-عندها / ليس عندي
    gloss: عندي / عنده-عندها / ليس عندي
    note: تُستخدم *دارم*/*داره* بالطريقة نفسها مع الحيوان الأليف. أما *ندارم* (ليس عندي) و*نداره* (ليس عنده/عندها) فهما صيغتا النفي المقابلتان، وقد وردتا معًا في حوار العائلة في الوحدة 4.
  fa.a1.unit26.lesson01.teach.heyvan_word:
    title: حيوان
    gloss: حيوان
    note: تعني *حیوان* «حيوان».
    example_gloss: القطة حيوان.
  fa.a1.unit26.lesson01.teach.heyvane_khoonegi_phrase:
    title: حيوان أليف
    gloss: حيوان أليف
    note: تعني *حیوان خونگی* حرفيًا «حيوان البيت»، وهي العبارة المعتادة للتعبير عن «حيوان أليف».
  fa.a1.unit26.lesson01.teach.sag_word:
    title: كلب
    gloss: كلب
    note: '*سگ* تعني «كلب».'
    example_gloss: عندي كلب.
  fa.a1.unit26.lesson01.teach.gorbe_word:
    title: قطة
    gloss: قطة
    note: '*گربه* تعني «قطة».'
    example_gloss: عنده قطة.
  fa.a1.unit26.lesson02.teach.parande_word:
    title: طائر
    gloss: طائر
    note: '*پرنده* تعني «طائر».'
    example_gloss: عندها طائر.
  fa.a1.unit26.lesson02.teach.mahi_word:
    title: السمك
    gloss: سمك
    note: '*ماهی* تعني «سمكة».'
    example_gloss: عندي سمكة.
  fa.a1.unit26.lesson02.teach.dari_review:
    title: عندك
    gloss: عندك
    note: تظهر *داری* هنا مجددًا بصيغة المخاطَب في الأسلوب العامي.
  fa.a1.unit26.lesson02.teach.have_a_pet_question:
    title: هل لديك حيوان أليف؟
    gloss: هل عندك حيوان أليف؟
    note: تجمع *حیوان خونگی داری؟* بين *حیوان خونگی* من الدرس الأول و*داری*، وهي الطريقة الطبيعية لسؤال شخص عمّا إذا كان عنده حيوان أليف.
  fa.a1.unit26.lesson02.teach.are_review:
    title: أجل
    gloss: أجل
    note: '*آره* هي الكلمة العامية اليومية لقول «نعم».'
  fa.a1.unit26.lesson03.teach.esm_review:
    title: اسم
    gloss: اسم
    note: تُستخدم *اسم* بالطريقة نفسها لاسم الحيوان الأليف.
  fa.a1.unit26.lesson03.teach.esmesh_chiye_phrase:
    title: ما اسمه؟
    gloss: ما اسمه؟
    note: 'تجمع *اسمش چیه؟* بين لاحقة الملكية *-ش* (التي ظهرت في *قدش* و*موهاش* في الوحدة 25) و*چیه؟* من الوحدة 2، ومعناها: «ما اسمه / ما اسمها؟»'
  fa.a1.unit26.lesson03.teach.ghaza_word:
    title: الطعام
    gloss: طعام
    note: '*غذا* هي الكلمة نفسها المستخدمة لطعام الحيوانات الأليفة.'
    example_gloss: أحب الطعام.
  fa.a1.unit26.lesson03.teach.midam_word:
    title: أُعطي / أُطعم
    gloss: أُعطي / أُطعم
    note: '*می‌دم* (حرفيًا «أُعطي»)، التي مرّت بنا في *گوش می‌دم* في الوحدة 24، هي الفعل الطبيعي لإطعام حيوان أليف عند اقترانها بـ*غذا*.'
  fa.a1.unit26.lesson03.teach.sagam_word:
    title: كلبي
    gloss: كلبي
    note: تجمع *سگم* بين *سگ* ولاحقة الملكية *-م* ومعناها «كلبي»، وهو النمط الملتصق نفسه في *اسمم* من الوحدة 2.
  fa.a1.unit26.lesson03.teach.feed_my_dog_phrase:
    title: أُطعم كلبي.
    gloss: أُطعم كلبي.
    note: تستخدم *سگم رو غذا می‌دم* الأداة *رو* (علامة المفعول به، التي ظهرت في *قهوه رو بیشتر دوست دارم* في الوحدة 14) للدلالة على أن *سگم* هو المُطعَم.
  fa.a1.unit26.lesson04.teach.che_rangiye_review:
    title: ما لونه؟
    gloss: ما لونه؟
    note: تُستخدم *چه رنگیه؟* بالطريقة نفسها لوصف لون الحيوان الأليف.
  fa.a1.unit26.lesson04.teach.sefid_word:
    title: أبيض
    gloss: أبيض
    note: تظهر *سفید* هنا مجددًا للون الحيوان الأليف. و*گربه‌ی* هي صيغة الإضافة من *گربه* قبل المالك، كما في *گربه‌ی من* (قطتي) — النمط نفسه في *خونه‌ی من* من الوحدة 19، وتُستخدم مع الأسماء المنتهية بحرف علة بدل اللاحقة الملتصقة.
    example_gloss: قطتي بيضاء.
  fa.a1.unit26.lesson04.teach.koochik_word:
    title: صغير
    gloss: صغير
    note: تظهر *کوچیک* هنا مجددًا لحجم الحيوان الأليف.
    example_gloss: سمكتي صغيرة.
  fa.a1.unit26.lesson04.teach.bozorg_word:
    title: كبير
    gloss: كبير
    note: تظهر *بزرگ* هنا مجددًا لحجم الحيوان الأليف.
    example_gloss: كلبي كبير.
  fa.a1.unit26.lesson05.teach.sara_review:
    title: سارا
    gloss: سارا
    note: تظهر هنا مجددًا *سارا*، الشخصية التي عرفناها منذ الوحدة 2.
    example_gloss: عند سارا قطة.
  fa.a1.unit26.lesson05.teach.yek_review:
