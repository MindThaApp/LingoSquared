teaching:
  fa.a1.unit01.lesson01.teach.rtl:
    title: الفارسية تُكتب من اليمين إلى اليسار
    gloss: تُكتب الفارسية من اليمين إلى اليسار.
    note: اقرأ الفارسية من الطرف الأيمن نحو الأيسر.
  fa.a1.unit01.lesson01.teach.seen:
    title: الحرف س
    gloss: س (s)
    note: يمثّل الحرف س عادةً صوت s (السين).
  fa.a1.unit01.lesson01.teach.lam:
    title: الحرف ل
    gloss: ل (l)
    note: يمثّل الحرف ل صوت l (اللام) ويتصل بالحروف المجاورة.
  fa.a1.unit01.lesson01.teach.alef:
    title: الحرف ا
    gloss: ā / a (ألف)
    note: كثيرًا ما يدل الحرف ا على الصوت الطويل ā، ولا يتصل بالحرف الذي يليه.
  fa.a1.unit01.lesson01.teach.mim:
    title: الحرف م
    gloss: م (m)
    note: يمثّل الحرف م صوت m (الميم) ويتغيّر شكله عند الوصل.
  fa.a1.unit01.lesson01.teach.salam_shape:
    title: ركّب كلمة سلام
    gloss: مرحبًا
    note: تُنطق سلام salâm. وعادةً لا تُكتب الحركات القصيرة في الكتابة الفارسية.
    example_gloss: مرحبًا! أنا نيما.
  fa.a1.unit01.lesson02.teach.salam:
    title: مرحبًا
    gloss: مرحبًا
    note: سلام تحية تصلح في المواقف الرسمية وغير الرسمية.
    example_gloss: مرحبًا، كيف حالكم؟
  fa.a1.unit01.lesson02.teach.sobh_bekheyr:
    title: صباح الخير
    gloss: صباح الخير
    note: صبح بخیر تحية صباحية مهذبة ومحايدة.
  fa.a1.unit01.lesson02.teach.asr_bekheyr:
    title: مساء الخير (بعد الظهر أو في المساء)
    gloss: طاب يومك / مساء الخير
    note: تُستخدم عصر بخیر من أواخر ما بعد الظهر حتى المساء.
  fa.a1.unit01.lesson02.teach.khodahafez:
    title: الوداع
    gloss: مع السلامة
    note: تُنطق خداحافظ khodâhâfez وهي تحية الوداع العامة المعتادة.
    example_gloss: وداعًا، أراك لاحقًا!
  fa.a1.unit01.lesson02.teach.mamnoon:
    title: شكرًا
    gloss: شكرًا
    note: ممنون شائعة وطبيعية؛ أما متشکرم فهي أكثر رسمية قليلًا.
    example_gloss: شكرًا جزيلًا.
  fa.a1.unit01.lesson02.teach.khahesh_mikonam:
    title: عفوًا
    gloss: عفوًا / على الرحب والسعة
    note: خواهش می‌کنم هي الرد المعتاد على الشكر.
  fa.a1.unit01.lesson02.teach.hale_shoma:
    title: كيف حالك؟ الصيغة المهذبة المحكية
    gloss: كيف حالك؟
    note: حالتون چطوره؟ صيغة محكية مهذبة ومحايدة في فارسية إيران. أما حال شما چطور است؟ فهي مقابلها الأكثر رسمية أو الكتابية.
  fa.a1.unit01.lesson02.teach.khoobam:
    title: أنا بخير
    gloss: أنا بخير
    note: خوبم تجمع بين خوب ولاحقة المتكلم ـم.
  fa.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: طاب يومك
    gloss: نهارك سعيد
    note: روز بخیر مهذبة، لكنها أقل شيوعًا من سلام في الكلام العادي.
  fa.a1.unit01.lesson03.teach.shab_bekheyr:
    title: تصبح على خير
    gloss: تصبح على خير
    note: شب بخیر تُقال عادةً عند الوداع أو قبل النوم، وليست تحية افتتاحية.
  fa.a1.unit01.lesson03.teach.khosh_amadeed:
    title: أهلًا وسهلًا
    gloss: أهلًا وسهلًا
    note: خوش آمدید صيغة مهذبة تُقال لضيف واحد أو لعدة ضيوف.
  fa.a1.unit01.lesson03.teach.be_omide_didar:
    title: أتمنى لقاءك
    gloss: أتمنى أن نلتقي / إلى اللقاء
    note: به امید دیدار تحية وداع أنيقة، مهذبة ومحايدة.
  fa.a1.unit01.lesson03.teach.fealan:
    title: إلى اللقاء الآن
    gloss: إلى اللقاء الآن
    note: فعلاً محكية وأقل رسمية من خداحافظ.
  fa.a1.unit01.lesson03.teach.rooze_khoobi:
    title: أتمنى لك يومًا سعيدًا
    gloss: أتمنى لك يومًا سعيدًا
    note: تدل باشید على صيغة المخاطب المهذب في هذه العبارة الثابتة للوداع.
  fa.a1.unit01.lesson04.teach.formal_question:
    title: الصيغة المحكية المهذبة المحايدة
    gloss: كيف حالك؟
    note: استخدم حالتون چطوره؟ مع شخص بالغ لا تعرفه أو في حديث مهذب عادي. أما الصيغة الرسمية أو الكتابية فهي حال شما چطور است؟
  fa.a1.unit01.lesson04.teach.informal_question:
    title: غير رسمي
    gloss: كيف حالك؟
    note: چطوری؟ صيغة محكية تناسب الأصدقاء والعائلة والأقران إذا سمحت العلاقة بذلك.
  fa.a1.unit01.lesson04.teach.to:
    title: ضمير المخاطب غير الرسمي
    gloss: أنتَ / أنتِ
    note: تو للمفرد وغير رسمية؛ فلا تستخدمها تلقائيًا مع شخص بالغ لا تعرفه.
  fa.a1.unit01.lesson04.teach.very_well:
    title: بخير جدًا
    gloss: أنا بخير جدًا
    note: خیلی تقوّي معنى خوبم.
  fa.a1.unit01.lesson04.teach.not_bad:
    title: لا بأس
    gloss: لا بأس بحالي، شكرًا
    note: بد نیستم جواب معتدل وطبيعي، وليست شكوى سلبية.
  fa.a1.unit01.lesson04.teach.and_you_formal:
    title: وأنت؟ الصيغة المهذبة
    gloss: وأنت؟
    note: استخدم شما چطور؟ لإعادة السؤال بأدب.
  fa.a1.unit01.lesson04.teach.and_you_informal:
    title: وأنت؟ (غير رسمي)
    gloss: وأنت؟
    note: تو چطور؟ تناسب العلاقة غير الرسمية.
  fa.a1.unit01.lesson05.teach.chai:
    title: شاي
    gloss: شاي
    note: '*چای* هو المشروب المعروف. ستسمعها في عرض *چای بفرمایید* (تفضّل بعض الشاي).'
    example_gloss: تفضّل، هل تود بعض الشاي؟
  fa.a1.unit01.lesson05.teach.befarmaeed:
    title: تفضّل
    gloss: تفضّل / تفضّل بالدخول / خذ هذا
    note: 'يتغيّر معنى *بفرمایید* بحسب الموقف: فقد تعني تفضّل (عند تقديم الشاي)، أو تفضّل بالدخول (عند الباب)، أو بعدك.'
  fa.a1.unit01.lesson05.teach.lotf_dareed:
    title: أنتم كرماء
    gloss: هذا من لطفكم الكبير
    note: لطف دارید رد مهذب على المجاملة.
  fa.a1.unit01.lesson05.teach.zahmat_nakeshid:
    title: أرجوك لا تتكلّف العناء
    gloss: أرجوك لا تتكبّد العناء
    note: قد تكون زحمت نکشید رفضًا صادقًا، وقد تكون ردًّا أوليًّا مهذبًا على عرض فعلي.
  fa.a1.unit01.lesson05.teach.mamnoon_lotf:
    title: شكرًا على لطفكم
    gloss: شكرًا على لطفكم
    note: هذه العبارة أدفأ وأوضح من ممنون وحدها.
  fa.a1.unit01.lesson05.teach.cultural_pattern:
    title: التعارف
    gloss: أعراف المجاملة الإيرانية الحسّاسة للسياق
    note: التعارف هو مجموعة أعراف تتعلق بتقديم العروض ورفضها والشكر وإظهار الاحترام، وتتأثر بالسياق. وتختلف الممارسة بحسب العلاقة والجيل والمنطقة والموقف؛ ولا يوجد عدد ثابت من مرات الرفض أو التكرار يحدد ما إذا كان العرض صادقًا.
  fa.a1.unit01.lesson06.teach.line01:
    title: أهلًا وسهلًا
    gloss: علي يرحّب بنرگس.
    note: يبدأ الحوار بالتحية قبل التعارف.
  fa.a1.unit01.lesson06.teach.line02:
    title: أهلًا وسهلًا، الرد
    gloss: نرگس ترد عليه التحية وتشكره.
    note: ممنون (شكرًا) رد طبيعي على الترحيب.
  fa.a1.unit01.lesson06.teach.line03:
    title: تبادل الأسماء
    gloss: علي يذكر من هو.
    note: '*من علی هستم* تعني: أنا علي. و*هستم* (أنا) تأتي في آخر الجملة.'
  fa.a1.unit01.lesson06.teach.line04:
    title: تبادل الأسماء، الردّ
    gloss: نرگس تذكر من هي.
    note: النمط نفسه *من ... هستم* الذي استخدمه علي للتو.
  fa.a1.unit01.lesson06.teach.line05:
    title: تشرفت بمعرفتك
    gloss: علي يقول إنه سعيد بلقائها.
    note: '*خوشوقتم* تعني: يسرّني. ومع *از آشنایی با شما* تكوّن العبارة المهذبة المعتادة عند لقاء شخص ما.'
  fa.a1.unit01.lesson06.teach.line06:
    title: سررتُ بلقائك، الرد
    gloss: نرگس تبادله الشعور نفسه.
    note: 'همین‌طور تعني: وكذلك أنا، في هذا الرد.'
  fa.a1.unit01.lesson06.teach.line07:
    title: السؤال عن حال أحدهم
    gloss: علي يسألها بأدب عن حالها.
    note: يستخدم علي صيغة ـتون المحكية المهذبة المحايدة لأن هذا لقاء أول مهذب.
  fa.a1.unit01.lesson06.teach.line08:
    title: السؤال عن حال أحدهم، الرد
    gloss: نرگس تجيب وتعيد السؤال.
    note: تستخدم عبارة شما چطور؟ السؤالَ نفسه لتعيده على محدّثك، وهو اختصار شائع.
  fa.a1.unit01.lesson06.teach.line09:
    title: دعوة
    gloss: يقول علي إنه بخير أيضًا ويدعو نرجس إلى الدخول.
    note: تعني *بفرمایید داخل* تفضّل بالدخول. وتبيّن كلمة *داخل* (الداخل) ما يُعرَض عليها.
  fa.a1.unit01.lesson06.teach.line10:
    title: رفض مهذّب
    gloss: تشكره نرجس وتوضّح أن عليها أن تغادر.
    note: يبدأ الاعتذار المهذّب بالشكر قبل الرفض. وتعني *ولی باید برم* لكن عليّ أن أذهب.
  fa.a1.unit01.lesson06.teach.line11:
    title: إنهاء الحديث
    gloss: يردّ علي على كلامها ويأمل أن يلتقيا مجددًا.
    note: بعد رفض الدعوة ننتقل بسلاسة إلى عبارة الوداع.
  fa.a1.unit01.lesson06.teach.line12:
    title: إنهاء الحديث، الردّ
    gloss: تودّع نرجس.
    note: '*خداحافظ* هي عبارة الوداع العامة المعتادة.'
