teaching:
  fa.a1.unit09.lesson01.teach.hour_word:
    title: ساعة
    gloss: ساعة
    note: تعني كلمة ساعت «الساعة» (وحدة الزمن) و«الساعة» (الجهاز) معًا، وهي الكلمة الأساسية لذكر الوقت.
    example_gloss: كم الساعة؟
  fa.a1.unit09.lesson01.teach.minute_word:
    title: دقيقة
    gloss: دقيقة
    note: دقیقه هي كلمة «دقيقة».
    example_gloss: انتظر خمس دقائق.
  fa.a1.unit09.lesson01.teach.half_word:
    title: النصف
    gloss: نصف
    note: تعني نیم «نصف»، وتُستخدم للنصف ساعة.
    example_gloss: الساعة السابعة والنصف.
  fa.a1.unit09.lesson01.teach.quarter_word:
    title: ربع
    gloss: ربع
    note: تعني ربع «ربع»، وتُستخدم للربع ساعة.
    example_gloss: الثامنة إلا ربعًا.
  fa.a1.unit09.lesson01.teach.va_word:
    title: و
    gloss: و
    note: و أداة الربط الشائعة المستخدمة في هذه الوحدة كلها.
    target_text: و (و العطف)
  fa.a1.unit09.lesson02.teach.what_time_question:
    title: اسأل عن الوقت
    gloss: كم الساعة؟
    note: ساعت چنده؟ هي الطريقة العامية اليومية للسؤال عن الوقت.
  fa.a1.unit09.lesson02.teach.contraction_note:
    title: اختصار «-e» العامي (مراجعة)
    gloss: چنده هي الصيغة المختصرة المنطوقة اليومية من چند است.
    note: هذا هو نمط الاختصار نفسه الذي رأيناه مع كلمات الطقس والتسوّق مثل آفتابیه وتومنه.
  fa.a1.unit09.lesson03.teach.three_oclock_half:
    title: قل إن الساعة الثالثة والنصف
    gloss: الساعة الثالثة والنصف.
    note: تجمع ساعت سه و نیمه بين الساعة، وو (العطف)، وصيغة نیمه المختصرة (نصف).
  fa.a1.unit09.lesson03.teach.contraction_note2:
    title: اختصار «-e» العامي مطبَّقًا على نیم
    gloss: نیمه هي الصيغة المختصرة المنطوقة اليومية من نیم است.
    note: النمط نفسه كما في چنده، لكنه مطبَّق على نیم بدل چند.
  fa.a1.unit09.lesson04.teach.sobh:
    title: الصباح
    gloss: صباح
    note: تدل كلمة صبح على فترة الصباح من اليوم.
    example_gloss: أستيقظ باكرًا في الصباح.
  fa.a1.unit09.lesson04.teach.zohr:
    title: الظهر
    gloss: ظهر
    note: تدل كلمة ظهر على وقت الظهيرة.
    example_gloss: أتناول الغداء عند الظهر.
  fa.a1.unit09.lesson04.teach.asr:
    title: العصر
    gloss: بعد الظهر
    note: تدل كلمة عصر على فترة ما بعد الظهر وبداية المساء.
    example_gloss: أعمل بعد الظهر.
  fa.a1.unit09.lesson04.teach.shab:
    title: الليل
    gloss: ليل
    note: تدل كلمة شب على الليل.
    example_gloss: أنام باكرًا في الليل.
  fa.a1.unit09.lesson05.teach.appointment_word:
    title: موعد
    gloss: موعد
    note: قرار هي الكلمة العامة للموعد أو اللقاء المتفق عليه.
    example_gloss: لدي موعد.
  fa.a1.unit09.lesson05.teach.appointment_question:
    title: السؤال عن وقت الموعد
    gloss: في أي ساعة الموعد؟
    note: تطبّق عبارة قرار ساعت چنده؟ سؤال الوقت من الدرس الثاني على موعد محدد.
  fa.a1.unit09.lesson05.teach.four_oclock:
    title: ذكر الوقت مع جزء من اليوم
    gloss: الساعة الرابعة عصرًا
    note: تجمع عبارة ساعت چهار عصر بين الساعة وكلمة عصر لتمييز الصباح من العصر.
  fa.a1.unit09.lesson06.teach.tomorrow_review:
    title: غدًا (مراجعة)
    gloss: غدًا
    note: سبق أن تعلمتَ كلمة فردا في وحدة سابقة، وتُستخدم هنا لتحديد موعد اللقاء.
    example_gloss: لدي موعد غدًا.
  fa.a1.unit09.lesson06.teach.late_word:
    title: قول إنك ستتأخر قليلًا
    gloss: سأتأخر قليلًا.
    note: تستخدم عبارة *یکم دیر می‌شه* الكلمة العامية *یکم* (قليلًا) وكلمة *دیر* (متأخر).
  fa.a1.unit09.lesson06.teach.turn01:
    title: نيغار تسأل عن وقت موعد الغد
    gloss: تسأل نيغار في أي ساعة موعد الغد.
    note: تجمع عبارة قرار فردا ساعت چنده؟ بين سؤال الموعد من الدرس الخامس وكلمة فردا (غدًا).
  fa.a1.unit09.lesson06.teach.turn02:
    title: آراش يجيب وهو غير متأكد
    gloss: يقول آراش إنه يظن أن الموعد في الساعة الرابعة.
    note: عبارة فکر کنم (أظن) تخفف الجواب لأنه غير متأكد تمامًا.
  fa.a1.unit09.lesson06.teach.turn03:
    title: 'نيغار تسأل: صباحًا أم عصرًا؟'
    gloss: تسأل نيغار هل الساعة الرابعة عصرًا أم صباحًا.
    note: يزيل هذا السؤال اللبس المحتمل، لأن ساعت چهار وحدها لا تحدد أي رابعة هي.
  fa.a1.unit09.lesson06.teach.turn04:
    title: آراش يوضّح
    gloss: 'يقول آراش: عصرًا.'
    note: الجواب بكلمة واحدة طبيعي بعد أن تحدد السياق في السؤال.
  fa.a1.unit09.lesson06.teach.turn05:
    title: نيغار توافق وتعدّل وقت وصولها
    gloss: توافق نيغار وتقول إنها ستأتي في الرابعة والربع.
    note: تجمع عبارة ساعت چهار و ربع بين الساعة وكلمة ربع.
  fa.a1.unit09.lesson06.teach.turn06:
    title: آراش يسأل عن سبب الربع الإضافي
    gloss: يسأل آراش لماذا تقول «والربع».
    note: '*چرا ربع؟* طريقة مختصرة للسؤال: «لماذا الربع؟»'
  fa.a1.unit09.lesson06.teach.turn07:
    title: نيغار تشرح أنها ستتأخر قليلًا
    gloss: توضح نيغار أنها ستتأخر قليلًا عند خروجها من العمل.
    note: تقدّم كلمة *چون* (لأن) السبب، وتستخدم عبارة *یکم دیر می‌شه* (سأتأخر قليلًا) التي تعلمتَها في هذا الدرس.
  fa.a1.unit09.lesson06.teach.turn08:
    title: آراش يطمئنها
    gloss: 'يقول آراش: حسنًا، لا مشكلة.'
    note: عبارة مشکلی نیست (لا مشكلة) تطمئن نيغار بأن التأخر البسيط لا يضر.
