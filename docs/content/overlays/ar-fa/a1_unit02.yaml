course:
  title: الفارسية A1
  description: فارسية إيرانية للمبتدئين، تركّز على قراءة الكتابة الفارسية وفهم الكلام اليومي والتعامل مع المحادثات العملية بأدب.
units:
  fa.a1.unit02.introductions:
    title: الأسماء والأصول والتعارف
lessons:
  fa.a1.unit02.lesson01.script_ramp:
    title: اقرأ الحروف المستخدمة في التعارف
  fa.a1.unit02.lesson02.names:
    title: اسأل عن الاسم وقله
  fa.a1.unit02.lesson03.pronouns_and_boodan:
    title: الضمائر المفردة وفعل الكينونة
  fa.a1.unit02.lesson04.countries_nationalities:
    title: البلدان والجنسيات
  fa.a1.unit02.lesson05.origin:
    title: اسأل من أين شخص ما
  fa.a1.unit02.lesson06.language_class_dialogue:
    title: لقاء في صف اللغة الفارسية
teaching:
  fa.a1.unit02.lesson01.teach.noon_te:
    title: الحرفان ن و ت
    gloss: ن وت
    note: يمثّل الحرف ن صوت n، ويمثّل الحرف ت صوت t؛ وكلاهما يتصل بما قبله وما بعده.
  fa.a1.unit02.lesson01.teach.sheen_che:
    title: الحرفان ش وچ
    gloss: ش (sh) وچ (ch)
    note: يمثّل الحرف ش صوت sh، ويمثّل الحرف چ صوت ch (مثل «تش»).
  fa.a1.unit02.lesson01.teach.ye_he:
    title: الحرفان ی وه
    gloss: ي (y أو i طويلة) وه (h)
    note: ی يُنطق مثل y أو مثل كسرة طويلة ī. أما ه فهو صوت h ويتغيّر شكله عند الاتصال بما قبله أو بعده.
  fa.a1.unit02.lesson01.teach.ke_gaf:
    title: الحرفان ک وگ
    gloss: ک (k) وگ (g)
    note: يمثّل الحرف ک صوت k؛ وعند الكتابة على لوحة المفاتيح استخدم الكاف الفارسية ک، لا الكاف العربية المشابهة لها في الشكل. أما گ فهو ک مع خط إضافي، ويمثّل صوت g (مثل «غ» المشدّدة في «غ» القاهرية للجيم).
  fa.a1.unit02.lesson01.teach.jim_dal:
    title: الحرفان ج וد
    gloss: ج (j) וد (d)
    note: يمثّل الحرف ج صوت j. ويمثّل الحرف د صوت d ولا يتصل بالحرف الذي بعده.
  fa.a1.unit02.lesson01.teach.re_fe:
    title: الحرفان ر وف
    gloss: ر (r) وف (f)
    note: يمثّل الحرف ر صوت r ولا يتصل بالحرف الذي بعده؛ ويمثّل الحرف ف صوت f.
  fa.a1.unit02.lesson01.teach.vav_be:
    title: الحرفان و وب
    gloss: v أو o أو u (و) وb (ب)
    note: قد يمثّل الحرف و صوت v أو حركة صائتة، ولا يتصل بالحرف الذي بعده. ويمثّل الحرف ب صوت b.
  fa.a1.unit02.lesson01.teach.khe_ze:
    title: الحرفان خ وز
    gloss: خ (kh) وز (z)
    note: الحرف خ هو الصوت الذي يُكتب عادةً kh، وهو كالخاء العربية؛ ويمثّل الحرف ز صوت z.
  fa.a1.unit02.lesson02.teach.esm:
    title: الاسم
    gloss: اسم
    note: تُقرأ كلمة اسم esm في الفارسية الإيرانية المعتادة.
    example_gloss: اسمي سارا.
  fa.a1.unit02.lesson02.teach.man:
    title: أنا
    gloss: أنا
    note: من هو ضمير المتكلم المفرد.
  fa.a1.unit02.lesson02.teach.sara:
    title: سارا
    gloss: سارا
    note: سارا اسم علم إيراني شائع.
    example_gloss: سارا صديقتي.
  fa.a1.unit02.lesson02.teach.formal_name:
    title: تعريف رسمي أو مكتوب بالنفس
    gloss: اسمي سارا.
    note: الجملة *اسم من سارا است* صحيحة لكنها رسمية؛ وستراها في الغالب في الكتابة.
  fa.a1.unit02.lesson02.teach.spoken_name:
    title: تعريف بالنفس بأسلوب المحادثة الطبيعي
    gloss: اسمي سارا.
    note: اسمم هي اختصار اسم من، أما ساراست فتجمع سارا وast في كلمة واحدة.
  fa.a1.unit02.lesson02.teach.polite_question:
    title: السؤال عن الاسم بتهذيب
    gloss: ما اسمك؟
    note: اسم شما چیه؟ عبارة عادية مهذّبة بالمستوى المحكي في الفارسية الإيرانية.
  fa.a1.unit02.lesson02.teach.informal_question:
    title: السؤال عن الاسم بصيغة غير رسمية
    gloss: ما اسمك؟
    note: اسمت چیه؟ للمفرد وبصيغة غير رسمية؛ لا تستخدمها إلا حين تسمح العلاقة بذلك.
  fa.a1.unit02.lesson03.teach.man:
    title: أنا
    gloss: أنا
    note: لا يتغيّر من بحسب الجنس النحوي؛ فهو للمذكر والمؤنث.
  fa.a1.unit02.lesson03.teach.to:
    title: أنتَ/أنتِ للمفرد، بصيغة غير رسمية
    gloss: أنت
    note: تو للمفرد وبصيغة غير رسمية؛ أما في المخاطبة المهذّبة فيُستخدم شما عادةً.
  fa.a1.unit02.lesson03.teach.oo:
    title: هو أو هي
    gloss: هو / هي
    note: او لا يميّز بين المذكر والمؤنث، ويمكن أن يشير إلى «هو» أو «هي».
  fa.a1.unit02.lesson03.teach.man_hastam:
    title: أنا (فعل الكينونة)
    gloss: أنا (كائن/موجود)
    note: هستم هي الصيغة الكاملة لفعل بودن مع ضمير المتكلم المفرد.
  fa.a1.unit02.lesson03.teach.to_hasti:
    title: أنتَ/أنتِ (فعل الكينونة)
    gloss: أنتم؛ أنتَ (للتوقير)
    note: هستی تتوافق مع الضمير المفرد غير الرسمي تو.
  fa.a1.unit02.lesson03.teach.oo_hast:
    title: هو أو هي (فعل الكينونة)
    gloss: هو/هي كائن؛ هو/هي موجود
    note: هست هي الصيغة الكاملة للغائب المفرد، وكثيرًا ما تدل على الوجود أو التوكيد.
  fa.a1.unit02.lesson03.teach.oo_ast:
    title: الخبر في جملة تعريف رسمية
    gloss: هو إيراني / هي إيرانية.
    note: في جملة التعريف الرسمية المكتوبة المحايدة، تكون است رابطة الغائب المفرد المعتادة.
  fa.a1.unit02.lesson03.teach.spoken_copula:
    title: الخبر في جملة تعريف محكية
    gloss: هو إيراني / هي إيرانية.
    note: ایرانیه هي الاختصار المحكي الطبيعي لـ ایرانی است.
  fa.a1.unit02.lesson04.teach.iran:
    title: إيران
    gloss: إيران
    note: ایران اسم دولة.
    example_gloss: أنا من إيران.
  fa.a1.unit02.lesson04.teach.iranian:
    title: إيراني
    gloss: إيراني
    note: قد تدل کلمة ایرانی على الجنسية أو الأصل.
    example_gloss: أنا إيراني / أنا إيرانية.
  fa.a1.unit02.lesson04.teach.england:
    title: إنجلترا
    gloss: إنجلترا
    note: تعني *انگلیس* عادةً إنجلترا؛ وفي الكلام اليومي كثيرًا ما يستخدمها الإيرانيون للدلالة على المملكة المتحدة كلها.
    example_gloss: أنا من إنجلترا.
  fa.a1.unit02.lesson04.teach.english:
    title: إنجليزي
    gloss: إنجليزي / الإنجليزية
    note: قد تدل کلمة انگلیسی على الجنسية أو اللغة أو على شيء مرتبط بإنجلترا؛ ويحدّد السياق المعنى.
    example_gloss: أنا إنجليزي / أنا إنجليزية.
  fa.a1.unit02.lesson04.teach.france:
    title: فرنسا
    gloss: فرنسا
    note: فرانسه هو اسم دولة فرنسا.
    example_gloss: أنا من فرنسا.
  fa.a1.unit02.lesson04.teach.french:
    title: فرنسي
    gloss: فرنسي / الفرنسية
    note: قد تدل کلمة فرانسوی على الجنسية أو على شيء مرتبط بفرنسا.
    example_gloss: أنا فرنسي / أنا فرنسية.
  fa.a1.unit02.lesson04.teach.country:
    title: بلد
    gloss: بلد
    note: کشور هي الكلمة العامة للدلالة على البلد.
    example_gloss: إيران بلد.
  fa.a1.unit02.lesson04.teach.nationality:
    title: الجنسية
    gloss: جنسية
    note: ملیت اسم رسمي بمعنى الجنسية.
    example_gloss: ما جنسيتك؟
  fa.a1.unit02.lesson05.teach.ahl:
    title: من أو أصله من
    gloss: من / أصله من
    note: تربط کلمة اهل الشخص بمكان أصله؛ ولا تعني ببساطة أنه يقيم في مكان ما حاليًا.
    example_gloss: هو من إنجلترا / هي من إنجلترا.
  fa.a1.unit02.lesson05.teach.koja:
    title: أين
    gloss: أين
    note: کجا يُسأل بها عن المكان.
    example_gloss: من أين أنت؟
  fa.a1.unit02.lesson05.teach.formal_question:
    title: سؤال رسمي معياري
    gloss: من أين أنت؟
    note: اهل کجا هستید؟ بالفارسية المعيارية المهذّبة، وتناسب الكلام الرسمي أو القراءة الدقيقة.
  fa.a1.unit02.lesson05.teach.polite_spoken_question:
    title: سؤال مهذّب محايد بالمستوى المحكي
    gloss: من أين أنت؟
    note: اهل کجا هستین؟ هي الصيغة المحكية المهذّبة المعتادة في الفارسية الإيرانية.
  fa.a1.unit02.lesson05.teach.informal_question:
    title: سؤال غير رسمي
    gloss: من أين أنت؟
    note: اهل کجایی؟ للمفرد وبصيغة غير رسمية.
  fa.a1.unit02.lesson05.teach.origin_answer:
    title: ذكر بلد الأصل
    gloss: أنا من إيران.
    note: تذكر الجملة من اهل ایران هستم بلد الأصل لا مكان الإقامة الحالي.
  fa.a1.unit02.lesson05.teach.nationality_answer:
    title: جواب قصير عن الجنسية
    gloss: أنا إيراني / أنا إيرانية.
    note: تضيف *ایرانی‌ام* اللاحقة *ـام* (أنا) إلى *ایرانی*، وتُكتب بمسافة صغيرة فاصلة قبل اللاحقة.
  fa.a1.unit02.lesson06.teach.arrival:
    title: التأكد من المكان
    gloss: تسأل سارا هل هذا هو صف اللغة الفارسية.
    note: ببخشید عبارة تُستخدم للفت الانتباه بلطف قبل طرح سؤال عملي.
  fa.a1.unit02.lesson06.teach.yes:
    title: نعم
    gloss: نعم
    note: بله هي كلمة «نعم» المحايدة المهذّبة.
    example_gloss: نعم، بالطبع.
  fa.a1.unit02.lesson06.teach.meet_mina:
    title: مينا تُعرّف بنفسها
    gloss: تؤكد مينا المكان، وتُعرّف بنفسها، وتسأل سارا عن اسمها.
    note: يناسب السؤال المهذّب بالمستوى المحكي شخصين بالغين يلتقيان في صف دراسي.
  fa.a1.unit02.lesson06.teach.sara_name:
    title: سارا تذكر اسمها
    gloss: اسمي سارا.
    note: تستخدم سارا الصيغة المحكية المختصرة التي تعلمناها سابقًا.
  fa.a1.unit02.lesson06.teach.ask_origin:
    title: مينا تسأل عن الأصل
    gloss: من أين أنت؟
    note: تحافظ صيغة هستین على أسلوب مهذب وفي الوقت نفسه قريب من لغة الحديث.
  fa.a1.unit02.lesson06.teach.exchange_origins_sara:
    title: تبادل معلومات عن الأصل
    gloss: تقول سارا إنها من إنجلترا وتسأل مينا إن كانت من إيران.
    note: يستخدم المتحدثان صيغ الاحترام لأنهما تعارفا للتو.
  fa.a1.unit02.lesson06.teach.exchange_origins_mina:
    title: تبادل بلدان الأصل، الرد
    gloss: تؤكد مينا أنها إيرانية.
    note: '*ایرانی‌ام* هي الصيغة المختصرة من *ایرانی هستم* (أنا إيرانية / أنا إيراني).'
  fa.a1.unit02.lesson06.teach.pleased:
    title: الرد على التعارف
    gloss: تقول سارا إنها سعيدة بلقاء مينا.
    note: تُعدّ عبارة از آشنایی با شما خوشوقتم ختامًا طبيعيًا لحوارهما.
  fa.a1.unit02.lesson06.teach.pleased_and_enter:
    title: رد التحية ودخول الصف
    gloss: تقول مينا إنها سعيدة أيضًا وتدعو سارا إلى الدخول.
    note: عبارة من هم همین‌طور ترد على تحية سارا المهذبة قبل أن تنقل عبارة بفرمایید داخل المشهد إلى داخل الصف.
