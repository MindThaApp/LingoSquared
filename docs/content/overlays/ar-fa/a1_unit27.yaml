    title: 'قراءة: رياضات نيما'
    gloss: نيما يحب الرياضة. يلعب كرة القدم ثلاث مرات كل أسبوع. وأحيانًا يذهب أيضًا إلى المسبح ويسبح.
    note: يعيد هذا النص استخدام كل التراكيب من الدروس 1-4 مع *می‌ره* من الدرس 5، دون مفردات جديدة تقريبًا؛ الهدف التعرّف عليها في نص متصل.
