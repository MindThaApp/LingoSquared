course:
  title: الفارسية A1
  description: 'فارسية إيران للمبتدئين: تسمية الرياضات (كرة القدم، كرة السلة، كرة الطائرة، السباحة)، والسؤال «ما الرياضة التي تحبها؟»، وقول مكان ممارسة الرياضة (النادي الرياضي، المسبح، الحديقة)، والحديث عن عدد المرات (كل يوم، كل أسبوع، أحيانًا، عدد من المرات)، ونص قراءة قصير عن روتين نیما الرياضي، وحوار ختامي بين نیما وسارا يقارنان فيه الرياضات التي يمارسها كل منهما وعدد المرات والمكان.'
