  fa.a1.unit27.lesson06.teach.miri_word:
    title: تذهب
    gloss: تذهب
    note: '*می‌ری* هي صيغة المخاطَب غير الرسمية للفعل نفسه في *می‌رم* (أذهب) من الدرس 3 و*می‌ره* (هو/هي يذهب) من الدرس 5.'
  fa.a1.unit27.lesson06.teach.aaleeye_word:
    title: رائع / ممتاز
    gloss: رائع / ممتاز
    note: '*عالیه* طريقة محكية شائعة للقول «رائع» أو «ممتاز».'
    example_gloss: هذا النادي رائع.
  fa.a1.unit27.lesson06.teach.dialogue_line1:
    title: 'نيما: ما الرياضة التي تحبها؟'
    gloss: ما الرياضة التي تحبها؟
  fa.a1.unit27.lesson06.teach.dialogue_line2:
    title: 'سارا: أحب السباحة. أذهب إلى المسبح ثلاث مرات كل أسبوع. وأنت؟'
    gloss: أحب السباحة. أذهب إلى المسبح ثلاث مرات كل أسبوع. وأنت؟
  fa.a1.unit27.lesson06.teach.dialogue_line3:
    title: 'نيما: أحب كرة القدم. أذهب إلى الحديقة كل يوم وألعب.'
    gloss: أحب كرة القدم. أذهب إلى الحديقة كل يوم وألعب.
  fa.a1.unit27.lesson06.teach.dialogue_line4:
    title: 'سارا: ما أجمل هذا! هل تذهب إلى النادي الرياضي أيضًا؟'
    gloss: ما أجمل هذا! هل تذهب إلى النادي الرياضي أيضًا؟
  fa.a1.unit27.lesson06.teach.dialogue_line5:
    title: 'نيما: نعم، أذهب إلى النادي الرياضي أحيانًا أيضًا.'
    gloss: نعم، أذهب إلى النادي الرياضي أحيانًا أيضًا.
  fa.a1.unit27.lesson06.teach.dialogue_line6:
    title: 'سارا: رائع!'
    gloss: رائع!
