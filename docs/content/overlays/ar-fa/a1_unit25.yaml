teaching:
  fa.a1.unit25.lesson01.teach.oo_review:
    title: هو / هي
    gloss: هو / هي
    note: تظهر الكلمة *او* هنا مجددًا بوصفها فاعلًا في أوصاف المظهر.
  fa.a1.unit25.lesson01.teach.ghad_review:
    title: الطول (القامة)
    gloss: القامة
    note: تظهر *قد* هنا وحدها. أما *قدش* فتضيف لاحقة الملكية *-ش* (قامته/قامتها)، وهو النمط نفسه في *امتحانش* من الوحدة 20.
    example_gloss: نيما طويل القامة.
  fa.a1.unit25.lesson01.teach.boland_word:
    title: طويل
    gloss: طويل
    note: تعني *بلند* طويل. وعبارة *قدش بلنده* تعني حرفيًا «قامته طويلة»، وهي الطريقة المحكية الطبيعية للقول إن الشخص طويل.
    example_gloss: قامته طويلة.
  fa.a1.unit25.lesson01.teach.kotah_word:
    title: قصير
    gloss: قصير
    note: تعني *کوتاه* قصير.
    example_gloss: قامته قصيرة.
  fa.a1.unit25.lesson02.teach.mo_word:
    title: الشعر
    gloss: شعر
    note: تعني *مو* شعر. و*موی* صيغة الإضافة (الكسرة الرابطة) التي تُستعمل قبل الصفة، كما في *موی بلند* (شعر طويل).
    example_gloss: لديه شعر طويل.
  fa.a1.unit25.lesson02.teach.moohash_word:
    title: شعره / شعرها
    gloss: شعره / شعرها
    note: تجمع *موهاش* بين الجمع *موها* (الشعر) ولاحقة الملكية *-ش*، فتعني «شعره/شعرها».
  fa.a1.unit25.lesson02.teach.meshki_word:
    title: أسود
    gloss: أسود
    note: '*مشکی* هي الكلمة المحكية الشائعة للشعر والعينين السوداوين، وهي أنسب هنا من *سیاه* في الوحدة 20 التي تلائم الملابس أكثر من الشعر.'
    example_gloss: شعرها أسود.
  fa.a1.unit25.lesson02.teach.bolond_word:
    title: أشقر
    gloss: أشقر
    note: '*بلوند* (كلمة دخيلة) تعني أشقر.'
    example_gloss: شعرها أشقر.
  fa.a1.unit25.lesson03.teach.cheshm_word:
    title: عين
    gloss: عين
    note: تعني *چشم* عين. و*چشمای* صيغة الجمع المحكية مع الإضافة (عيونُ...)، كما في *چشمای آبی* (عيون زرقاء).
    example_gloss: لديه عيون بنية.
  fa.a1.unit25.lesson03.teach.cheshmash_word:
    title: عيناه / عيناها
    gloss: عيناه / عيناها
    note: تجمع *چشماش* بين الجمع المحكي *چشما* ولاحقة الملكية *-ش*، فتعني «عيناه/عيناها». لاحظ أن *چشماش آبیه* تستعمل النهاية المفردة *-ه* مع أن *چشما* جمع، وهذا طبيعي في الفارسية، إذ يأخذ جمع غير العاقل عادةً فعلًا مفردًا.
  fa.a1.unit25.lesson03.teach.ghahveei_word:
    title: بني
    gloss: بني
    note: تعني *قهوه‌ای* (حرفيًا «بلون القهوة») بني.
    example_gloss: عيناها بنيتان.
  fa.a1.unit25.lesson03.teach.sabz_word:
    title: أخضر
    gloss: أخضر
    note: تعني *سبز* أخضر.
    example_gloss: عيناها خضراوان.
  fa.a1.unit25.lesson03.teach.abi_review:
    title: أزرق
    gloss: أزرق
    note: تظهر *آبی* هنا مجددًا للدلالة على لون العينين.
    example_gloss: عيناها زرقاوان.
  fa.a1.unit25.lesson04.teach.man_review:
    title: أنا
    gloss: أنا
    note: '*من* كلمة مألوفة لديك، وتظهر هنا مجددًا لوصف النفس.'
    example_gloss: لدي شعر بني.
  fa.a1.unit25.lesson04.teach.daram_review:
    title: لدي / لديه (لديها)
    gloss: لدي / لديه (لديها)
    note: 'تُستعمل *دارم*/*داره* بالطريقة نفسها مع الصفات الجسدية: *موی مشکی دارم* تعني «لدي شعر أسود».'
  fa.a1.unit25.lesson04.teach.eynak_word:
    title: نظارة
    gloss: نظارة
    note: تعني *عینک* النظارة.
    example_gloss: يرتدي نظارة.
  fa.a1.unit25.lesson04.teach.mizane_word:
    title: يرتدي / ترتدي
    gloss: يرتدي / ترتدي
    note: '*می‌زنه* (حرفيًا «يضرب») هو الفعل الطبيعي لارتداء النظارة، فـ*عینک می‌زنه* تعني «يرتدي نظارة»، وهو فعل مختلف عن *می‌کنم* (أفعل) في الوحدتين 8 و24.'
  fa.a1.unit25.lesson04.teach.che_shekliye_phrase:
    title: كيف يبدو شكله (شكلها)؟
    gloss: كيف يبدو شكله (شكلها)؟
    note: تعني *چه شکلیه؟* حرفيًا «ما شكله؟»، وهي الطريقة المحكية المعتادة للسؤال عن مظهر شخص ما.
  fa.a1.unit25.lesson04.teach.va_review:
    title: و
    gloss: و
    note: تعني *و* «و» العطف، وقد استُعملت هكذا سابقًا في الوحدتين 14 و24.
    example_gloss: قامته طويلة وشعره أسود.
  fa.a1.unit25.lesson05.teach.nima_review:
    title: نيما
    gloss: نيما
    note: '*نیما* شخصية قُدِّمت في الوحدة 11، وتظهر هنا مجددًا.'
    example_gloss: نيما صديق سارا.
  fa.a1.unit25.lesson05.teach.reading_text:
    title: 'قراءة: مظهر نيما'
    gloss: نيما طويل القامة. شعره أسود وعيناه بنيتان. يرتدي نظارة.
    note: يعيد هذا النص استعمال كل التراكيب من الدروس 1-4، دون مفردات جديدة تقريبًا، والهدف التعرّف عليها في نص متصل.
  fa.a1.unit25.lesson06.teach.maryam_name:
    title: مريم
    gloss: مريم
    note: '*مریم* شخصية جديدة، وهي صديقة سارا التي لم يلتقِ بها نيما بعد.'
    example_gloss: مريم صديقة سارا.
  fa.a1.unit25.lesson06.teach.alan_review:
    title: الآن
    gloss: الآن
    note: تظهر *الان* هنا مجددًا.
    example_gloss: مريم قادمة الآن.
  fa.a1.unit25.lesson06.teach.miad_word:
    title: يأتي / تأتي
    gloss: يأتي / تأتي
    note: '*میاد* هي صيغة المضارع المحكية من الفعل *آمدن* (أتى).'
    example_gloss: مريم قادمة الآن.
  fa.a1.unit25.lesson06.teach.rangiye_phrase:
    title: ما لونه؟
    gloss: ما لونه؟
    note: تجمع *چه رنگیه؟* بين *چه* (ماذا، من الدرس 4) و*رنگی* (ذو لون، من *رنگ* + *-ی*) + *-ه* (فعل الكينونة)، فتعني «ما لونه؟».
  fa.a1.unit25.lesson06.teach.bashe_mamnoon_review:
    title: حسنًا، شكرًا
    gloss: حسنًا، شكرًا
    note: سبق أن تعلمت *باشه* و*ممنون*، وتجتمعان هنا في عبارة ختامية طبيعية.
  fa.a1.unit25.lesson06.teach.dialogue_line1:
    title: 'سارا: مريم قادمة الآن.'
    gloss: مريم قادمة الآن.
  fa.a1.unit25.lesson06.teach.dialogue_line2:
    title: 'نيما: كيف تبدو مريم؟'
    gloss: كيف تبدو مريم؟
  fa.a1.unit25.lesson06.teach.dialogue_line3:
    title: 'سارا: هي طويلة وشعرها أسود.'
    gloss: قامتها طويلة وشعرها أسود.
  fa.a1.unit25.lesson06.teach.dialogue_line4:
    title: 'نيما: ما لون عينيها؟'
    gloss: ما لون عينيها؟
  fa.a1.unit25.lesson06.teach.dialogue_line5:
    title: 'سارا: عيناها بنيتان.'
    gloss: عيناها بنيتان.
  fa.a1.unit25.lesson06.teach.dialogue_line6:
    title: 'نيما: حسنًا، شكرًا.'
    gloss: حسنًا، شكرًا.
