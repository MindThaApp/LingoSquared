  description: 'فارسية إيرانية للمبتدئين: وصف طول الشخص (طويل/قصير)، وشعره (الطول واللون: أسود، أشقر)، ولون العينين (بني، أخضر، أزرق)، وهل يرتدي نظارة، وسؤال «كيف يبدو شكله/شكلها؟»، ونص قراءة قصير عن مظهر نيما، وحوار ختامي بين نيما وسارا حول التعرّف على مريم صديقة سارا.'
