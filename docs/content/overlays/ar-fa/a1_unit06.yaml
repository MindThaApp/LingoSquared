teaching:
  fa.a1.unit06.lesson01.teach.naan:
    title: خبز
    gloss: خبز
    note: نان طعام أساسي في كل وجبة إيرانية، وهو خبز مسطح يُقدَّم مع أي طبق تقريبًا.
    example_gloss: أحب الخبز.
  fa.a1.unit06.lesson01.teach.berenj:
    title: الأرز
    gloss: أرز
    note: برنج جزء أساسي من معظم الأطباق الرئيسية الإيرانية.
    example_gloss: الأرز مع الدجاج لذيذ.
  fa.a1.unit06.lesson01.teach.morgh:
    title: الدجاج
    gloss: دجاج
    note: مرغ تعني الطائر ولحمه معًا.
    example_gloss: أنا آكل الدجاج.
  fa.a1.unit06.lesson01.teach.ab:
    title: الماء
    gloss: ماء
    note: آب هي الكلمة المعتادة للماء.
    example_gloss: أريد ماءً.
  fa.a1.unit06.lesson01.teach.chai:
    title: شاي
    gloss: شاي
    note: چای هو المشروب الافتراضي الذي يُقدَّم تقريبًا في كل مكان في إيران، وقد مرّ بنا في درس التعارف (taarof) في الوحدة 1.
    example_gloss: شايًا واحدًا، من فضلك.
  fa.a1.unit06.lesson01.teach.ghahve:
    title: قهوة
    gloss: قهوة
    note: قهوه أصبحت شائعة أكثر فأكثر في المدن الإيرانية إلى جانب الشاي.
    example_gloss: القهوة ساخنة.
  fa.a1.unit06.lesson01.teach.mive:
    title: الفاكهة
    gloss: فواكه
    note: میوه كلمة عامة تشمل أي نوع من الفاكهة.
    example_gloss: أحب الفاكهة.
  fa.a1.unit06.lesson01.teach.va_ya:
    title: و / أو
    gloss: و (and) تعني «و»، یا (or) تعني «أو»
    note: كلتاهما أداتا ربط شائعتان تُستخدمان للجمع بين الأطعمة والمشروبات في الطلب.
    target_text: و (و)، یا (أو)
  fa.a1.unit06.lesson02.teach.mikhastam_chai:
    title: اطلب شايًا بأدب
    gloss: أودّ شايًا.
    note: می‌خواستم هي في الأصل صيغة ماضية من فعل «أراد»، لكنها تعمل كطلب مهذّب مخفَّف النبرة، وهي الصيغة المناسبة للنادل أو البائع الذي لا تعرفه.
  fa.a1.unit06.lesson02.teach.lotfan:
    title: من فضلك
    gloss: من فضلك
    note: يمكن إضافة لطفاً لتلطيف أي طلب تقريبًا.
    example_gloss: ساعدني من فضلك.
  fa.a1.unit06.lesson02.teach.mikham_informal:
    title: اطلب شايًا بصيغة غير رسمية
    gloss: أريد شايًا.
    note: تستخدم یه چای می‌خوام الصيغة العامية غير الرسمية یه (واحد) و می‌خوام (أريد). اقتصر عليها مع صديق مقرّب أو أحد أفراد الأسرة، لا مع نادل التقيتَه للتو.
  fa.a1.unit06.lesson02.teach.register_note:
    title: اختيار فعل الطلب المناسب
    gloss: استخدم می‌خواستم مع الغريب أو النادل، واستخدم می‌خوام مع الصديق المقرّب فقط.
    note: هذه هي النسخة الخاصة بالطلب من التفريق في مستوى الكلام الذي رأيناه في التحيات في الوحدة 1.
  fa.a1.unit06.lesson02.teach.mikhastam_naan:
    title: اطلب خبزًا بأدب
    gloss: أودّ بعض الخبز.
    note: ينطبق نمط می‌خواستم نفسه على أي اسم طعام أو شراب.
  fa.a1.unit06.lesson03.teach.menu_word:
    title: قائمة الطعام
    gloss: قائمة الطعام
    note: منو كلمة مستعارة (من الفرنسية)، وتُستخدم بمعنى «قائمة الطعام» كما في كثير من اللغات، ومنها العربية في الاستعمال الحديث.
    example_gloss: قائمة الطعام، من فضلك.
  fa.a1.unit06.lesson03.teach.menu_question:
    title: اطلب قائمة الطعام
    gloss: هل لديكم قائمة طعام؟
    note: منو دارید؟ تعني حرفيًا «هل لديكم قائمة طعام؟»، وهي الطريقة المعتادة لطلبها.
  fa.a1.unit06.lesson03.teach.recommend_question:
    title: اطلب توصية
    gloss: بماذا تنصح؟
    note: چی توصیه می‌کنید؟ سؤال طبيعي وشائع يُوجَّه إلى النادل.
  fa.a1.unit06.lesson03.teach.waiter_question:
    title: ما يسألك عنه النادل
    gloss: ماذا تريد؟
    note: چی میل دارید؟ طريقة مهذّبة ومعتادة يبدأ بها النادل حديث الطلب.
  fa.a1.unit06.lesson03.teach.jooje_kabab:
    title: كباب الدجاج
    gloss: كباب دجاج
    note: جوجه‌کباب (دجاج متبّل مشوي) من أكثر الأطباق شيوعًا في قوائم الطعام الإيرانية.
    example_gloss: سأطلب كباب الدجاج.
  fa.a1.unit06.lesson03.teach.khoobe:
    title: النادل يوصي بالطبق
    gloss: كباب الدجاج جيد جدًا اليوم.
    note: خوبه هي الصيغة المحكية المختصرة من خوب است، وهي طبيعية في توصية النادل العفوية.
  fa.a1.unit06.lesson03.teach.bale_befarmaeed:
    title: نعم، تفضّل
    gloss: نعم، تفضّل.
    note: بله تعني «نعم»؛ أما بفرمایید (التي مرّت في درس التعارف في الوحدة 1) فتُستخدم هنا أيضًا عند تسليم شيء لأحد، مثل قائمة الطعام.
  fa.a1.unit06.lesson04.teach.yek_livan:
    title: كوب شاي
    gloss: كوب شاي
    note: لیوان (كوب) هي كلمة العدّ للمشروبات التي تُقدَّم في كوب.
  fa.a1.unit06.lesson04.teach.do_ta_naan:
    title: رغيفان من الخبز
    gloss: رغيفان من الخبز
    note: تا كلمة عدّ تُوضع بعد الرقم عند عدّ معظم الأشياء المعدودة العادية، وهنا رغيفان من الخبز.
  fa.a1.unit06.lesson04.teach.yek_boshghab:
    title: طبق أرز
    gloss: طبق أرز
    note: بشقاب (طبق) هي كلمة العدّ للطعام الذي يُقدَّم في طبق.
  fa.a1.unit06.lesson04.teach.combined_order:
    title: اجمع طلبًا كاملًا
    gloss: طبق أرز ورغيفان من الخبز، من فضلك.
    note: يمكن ربط عدة عبارات للكمّيات بـ و (and) في طلب واحد.
  fa.a1.unit06.lesson04.teach.se_ta:
    title: كلمة العدّ تا
    gloss: 'تُوضع تا بعد الرقم مع الأشياء المعدودة: دو تا (اثنان)، سه تا (ثلاثة).'
    note: هذا هو نمط العدّ العام نفسه الذي دُرس مع الأرقام في الوحدة 3، مطبَّقًا هنا على طلب الطعام.
  fa.a1.unit06.lesson05.teach.hesab_word:
    title: الفاتورة
    gloss: الفاتورة / الحساب
    note: صورت‌حساب هي الكلمة المعتادة لفاتورة المطعم.
    example_gloss: الحساب من فضلك.
  fa.a1.unit06.lesson05.teach.bill_request:
    title: اطلب الفاتورة
    gloss: هل تتفضّل بإحضار الفاتورة؟
    note: صورت‌حساب رو لطف می‌کنید؟ طريقة مهذّبة وطبيعية لطلب الحساب في المطعم.
  fa.a1.unit06.lesson05.teach.khoshmaze:
    title: قل إن الطعام كان لذيذًا
    gloss: كان لذيذًا جدًا.
    note: خیلی خوشمزه بود مجاملة طبيعية تُقال للنادل أو للمضيف بعد الوجبة.
  fa.a1.unit06.lesson05.teach.nooshe_jan:
    title: بالهناء والعافية
    gloss: بالهناء والعافية
    note: نوش جان تُقال لمن يأكل أو يهمّ بالأكل، وهي تقابل «بالهناء والعافية»؛ ولا يقولها الآكل عن طعامه هو.
  fa.a1.unit06.lesson05.teach.chashm:
    title: ردّ النادل المهذّب
    gloss: حالًا.
    note: چشم، الان میارم طريقة محترمة يرد بها العاملون على الطلب ويقولون إنهم سيحضرونه فورًا.
  fa.a1.unit06.lesson06.teach.restaurant_word:
    title: المطعم
    gloss: مطعم
    note: رستوران هي الكلمة المعتادة للمطعم، وهو مكان حوار هذه الوحدة.
    example_gloss: هذا المطعم جيد.
  fa.a1.unit06.lesson06.teach.turn01:
    title: النادل يستقبل الزبون
    gloss: النادل يرحّب بالزبون ويسأله عمّا يرغب به.
    note: چی میل دارید؟ هو سؤال الافتتاح المهذّب نفسه من الدرس 3.
  fa.a1.unit06.lesson06.teach.turn02:
    title: الزبون يطلب قائمة الطعام
    gloss: الزبون يحيّي النادل ويطلب قائمة الطعام.
    note: منو دارید؟ تبدأ بها محادثة الطلب.
  fa.a1.unit06.lesson06.teach.turn03:
    title: النادل يقدّم قائمة الطعام
    gloss: النادل يوافق ويسلّم القائمة.
    note: بفرمایید هي كلمة العرض المهذّبة نفسها من الوحدة 1، وتُستخدم هنا عند تسليم شيء لأحد.
  fa.a1.unit06.lesson06.teach.turn04:
    title: الزبون يطلب توصية
    gloss: الزبون يسأل النادل عمّا يوصي به.
    note: چی توصیه می‌کنید؟ من الدرس 3.
  fa.a1.unit06.lesson06.teach.turn05:
    title: النادل يوصي بطبق
    gloss: النادل يقول إن كباب الدجاج جيد جدًا اليوم.
    note: تستخدم جوجه‌کباب امروز خیلی خوبه الصيغة غير الرسمية خوبه، وهي طبيعية في التوصيات المحكية.
  fa.a1.unit06.lesson06.teach.turn06:
    title: الزبون يقدّم طلبًا كاملًا
    gloss: الزبون يوافق ويطلب كباب دجاج مع أرز، إضافةً إلى شاي.
    note: تُستخدم هنا می‌خواستم، وهي مناسبة لنادل لا يعرفه الزبون شخصيًا.
  fa.a1.unit06.lesson06.teach.turn07:
    title: النادل يؤكد استلام الطلب
    gloss: النادل يقول إنه سيحضره حالًا.
    note: چشم، الان میارم من الدرس 5.
  fa.a1.unit06.lesson06.teach.turn08:
    title: الزبون يمدح الطعام ويطلب الفاتورة
    gloss: الزبون يقول إن الطعام كان لذيذًا ويطلب الفاتورة.
    note: كلتا العبارتين تعيدان مباشرةً استخدام مفردات الدرس 5.
  fa.a1.unit06.lesson06.teach.turn09:
    title: النادل يحضر الفاتورة
    gloss: النادل يوافق ويقول إنه سيحضرها حالًا.
    note: البته (بالطبع) ردّ إيجابي مهذّب وطبيعي هنا.
