course:
  title: الفارسية A1
  description: 'فارسية إيرانية للمبتدئين: مفردات الطعام والشراب، والطلب بأدب في المطعم، والسؤال عن قائمة الطعام والتوصيات، والكميات، وآداب المطعم بما فيها طلب الحساب.'
