review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit45 (emergencies), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1, every teaching card with a realization example: has a matching example_gloss:. Contrastive-grammar points, deliberately different from ones already used in this direction: (1) There's a fire! uses the dummy existential subject there (referring to nothing concrete) plus is -- Persian expresses the same event with a plain subjectless verb (آتیش گرفته / آتش‌سوزی شده, roughly 'it caught fire'), with no equivalent placeholder word at all, so learners must add a grammatically required word that translates nothing; (2) Send the police, please. -- police is grammatically PLURAL in English despite having no -s (the police ARE coming, not is), a genuine agreement trap distinct from ordinary singular/plural marking; Persian پلیس has no such hidden plural behavior, so this is flagged as an English-internal quirk to memorize rather than a direct translation issue; (3) What's your emergency? uses a possessive (YOUR emergency, treating the emergency as something the caller owns) where Persian naturally asks with the verb داشتن instead (چه اورژانسی دارین؟, literally 'what emergency do you have'), so the note flags the possessive-pronoun-vs-verb-have structural difference. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, NOT translated Persian lefts, per the established compiler-driven precedent. lesson03/lesson04 multiple_choice and listen_select distractor sets copied verbatim from the realization's own review notes documenting the exact invented, never-spoken-in-this-unit values already verified safe. Strong sibling-isolation rule applied -- nl-en/prs-en overlays for this unit were not consulted. Needs the mandatory fresh-context review before shipping."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit45.emergencies: {title: "مقابله با وضعیت اضطراری"}

lessons:
  en.a1.unit45.lesson01.emergency_vocabulary: {title: "کلمات وضعیت اضطراری"}
  en.a1.unit45.lesson02.asking_for_help: {title: "درخواست کمک"}
  en.a1.unit45.lesson03.dialogue_kitchen_fire: {title: "گفتگو: آتیش‌سوزی توی آشپزخونه"}
  en.a1.unit45.lesson04.emergency_notice: {title: "متن: توی وضعیت اضطراری چیکار کنیم"}

teaching:
  en.a1.unit45.lesson01.teach.emergency: {title: "emergency", gloss: "وضعیت اضطراری", note: "*emergency* یعنی وضعیت اضطراری -- یه موقعیت خطرناک که نیاز به اقدام فوری داره.", example_gloss: "این یه وضعیت اضطراریه!"}
  en.a1.unit45.lesson01.teach.help: {title: "help", gloss: "کمک", note: "*help* یعنی کمک.", example_gloss: "من کمک لازم دارم!"}
  en.a1.unit45.lesson01.teach.police: {title: "police", gloss: "پلیس", note: "*police* یعنی پلیس. دقت کنین توی انگلیسی این کلمه با فعل جمع میاد: *the police ARE coming*، نه *is*.", example_gloss: "با پلیس تماس بگیر!"}
  en.a1.unit45.lesson01.teach.ambulance: {title: "ambulance", gloss: "آمبولانس", note: "*ambulance* یعنی آمبولانس -- ماشینی که آدمای زخمی رو به بیمارستان می‌بره.", example_gloss: "ما یه آمبولانس لازم داریم!"}
  en.a1.unit45.lesson01.teach.fire_department: {title: "fire department", gloss: "آتش‌نشانی", note: "*fire department* یعنی آتش‌نشانی.", example_gloss: "آتش‌نشانی رسید."}

  en.a1.unit45.lesson02.teach.call_911: {title: "Call 911!", gloss: "با ۹۱۱ تماس بگیر!", note: "*Call 911!* -- شمارهٔ اورژانس آمریکا ۹۱۱ه؛ فعل امری *call* بدون فاعل، مثل فارسی."}
  en.a1.unit45.lesson02.teach.i_need_help: {title: "I need help!", gloss: "من کمک لازم دارم!", note: "*I need help!* -- جملهٔ ساده برای درخواست فوری کمک."}
  en.a1.unit45.lesson02.teach.send_the_police: {title: "Send the police, please.", gloss: "لطفاً پلیس رو بفرستین.", note: "*Send THE police* -- دقت کنین *police* با فعل جمع میاد (*the police ARE...*) حتی بدون -s."}
  en.a1.unit45.lesson02.teach.send_an_ambulance: {title: "Send an ambulance, please.", gloss: "لطفاً آمبولانس بفرستین.", note: "*Send an ambulance* -- *an* چون *ambulance* با صدای مصوت شروع می‌شه."}
  en.a1.unit45.lesson02.teach.theres_a_fire: {title: "There's a fire!", gloss: "آتیش گرفته!", note: "*There's a fire!* -- *there's* یه ساختار توخالیه که فقط برای گرامر جمله لازمه، به هیچی اشاره نمی‌کنه؛ فارسی برای همین معنی هیچ کلمهٔ معادلی نداره -- فقط «آتیش گرفته» یا «آتش‌سوزی شده»."}
  en.a1.unit45.lesson02.teach.whats_your_emergency: {title: "What's your emergency?", gloss: "وضعیت اضطراریتون چیه؟", note: "*What's YOUR emergency?* -- انگلیسی از ضمیر ملکی *your* استفاده می‌کنه؛ فارسی معمولاً با فعل «داشتن» می‌پرسه: «چه اورژانسی دارین؟»."}

  en.a1.unit45.lesson03.teach.dialogue_line1: {title: "نگرانی لیلا", gloss: "لیلا می‌پرسه چیزی داره می‌سوزه -- بوی دود میاد!", note: "*Is something burning?* -- سؤال با *something* برای یه چیز نامشخص."}
  en.a1.unit45.lesson03.teach.dialogue_line2: {title: "جواب دنیل", gloss: "دنیل می‌گه وای نه، ماهیتابه آتیش گرفت! داشت شام درست می‌کرد.", note: "*the pan caught fire* -- *catch fire* یه عبارت ثابت برای آتیش گرفتن."}
  en.a1.unit45.lesson03.teach.dialogue_line3: {title: "دستور لیلا", gloss: "لیلا می‌گه آروم باش. اجاق رو خاموش کن! خودش زنگ می‌زنه کمک بخواد.", note: "*Stay calm* و *Turn off the stove!* -- دو تا فعل امری پشت سر هم."}
  en.a1.unit45.lesson03.teach.dialogue_line4: {title: "نگرانی دنیل", gloss: "دنیل می‌گه عجله کن، آتیش داره بزرگ‌تر می‌شه!", note: "*is getting bigger* -- حال استمراری برای نشون دادن تغییر تدریجی."}
  en.a1.unit45.lesson03.teach.dialogue_line5: {title: "تماس لیلا", gloss: "لیلا می‌گه سلام، این یه وضعیت اضطراریه. توی آشپزخونهٔ دوستم آتیش گرفته. لطفاً آتش‌نشانی رو بفرستین.", note: "*Please send the fire department* -- درخواست مؤدبانه با *please* + فعل امری."}
  en.a1.unit45.lesson03.teach.dialogue_line6: {title: "خیال دنیل راحت می‌شه", gloss: "دنیل می‌گه خدا رو شکر. فکر کنم الان خاموش شده، ولی بیا بیرون منتظر بمونیم، هر چی باشه.", note: "*just in case* -- عبارتی به‌معنی «هر چی باشه» یا «برای اطمینان»."}
  en.a1.unit45.lesson03.teach.dialogue_line7: {title: "موافقت لیلا", gloss: "لیلا می‌گه فکر خوبیه. بیرون موندن تا رسیدنشون امن‌تره.", note: "*It's safer to wait outside* -- صفت تفضیلی *safer* + مصدر."}

  en.a1.unit45.lesson04.teach.reading_passage: {title: "متن: توی وضعیت اضطراری چیکار کنیم", gloss: "اگه آتیش گرفت: اول، آروم باشین. دوم، سریع از ساختمون بیرون برین. از آسانسور استفاده نکنین؛ از پله‌ها برین. سوم، وقتی بیرون رسیدین، با ۹۱۱ تماس بگیرین و آدرستونو بدین. در آخر، بیرون منتظر بمونین تا آتش‌نشانی برسه. بعد از آتیش‌سوزی توی آشپزخونهٔ دنیل، اون و لیلا دقیقاً طبق همین دستورالعمل بیرون منتظر موندن. آتش‌نشانی سریع رسید و مطمئن شد همه‌چیز امنه. بعداً، میا اومد سراغشونو بگیره و خیلی خوشحال شد که کسی آسیب ندیده.", note: "دقت کنین دستورالعمل‌ها با فعل امری میان: *stay calm*، *leave the building*، *use the stairs* -- بدون فاعل، مثل فارسی."}

exercises:
  en.a1.unit45.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "police"
    distractors: ["emergency", "help", "ambulance", "fire department"]
    accepted_answers: [{value: "police", status: "correct"}]
    feedback: "*police* یعنی پلیس."
  en.a1.unit45.lesson01.exercise02.choose_ambulance_meaning:
    instruction: "کدوم کلمه یعنی ماشینی که آدمای زخمی رو به بیمارستان می‌بره؟"
    correct_option: "ambulance"
    distractors: ["police", "fire department", "help"]
    accepted_answers: [{value: "ambulance", status: "correct"}]
    feedback: "*ambulance* یعنی آمبولانس."
  en.a1.unit45.lesson01.exercise03.match_emergency_words:
    instruction: "هر توضیح رو به کلمهٔ درستش وصل کنین."
    accepted_answers: [{value: [{left: "emergency", right: "a sudden, dangerous situation that needs quick action"}, {left: "help", right: "what you ask for when you need someone to come quickly"}, {left: "police", right: "who you call about a crime"}, {left: "ambulance", right: "the vehicle that takes injured people to the hospital"}, {left: "fire department", right: "who you call to put out a fire"}], status: "correct"}]
    feedback: "emergency=وضعیت اضطراری، help=کمک، police=پلیس، ambulance=آمبولانس، fire department=آتش‌نشانی."
  en.a1.unit45.lesson01.exercise04.order_ambulance_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["We", "need", "an", "ambulance."], status: "correct"}]
    feedback: "ترتیب درست: *We need an ambulance.*"
  en.a1.unit45.lesson01.exercise05.write_help_word:
    instruction: "کلمه‌ای رو بنویسین که وقتی کسی سریع لازمتونه فریاد می‌زنین."
    accepted_answers: [{value: "help", status: "correct"}]
    feedback: "*help* یعنی کمک."

  en.a1.unit45.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "There's a fire!"
    distractors: ["Call 911!", "I need help!", "Send the police, please.", "Send an ambulance, please."]
    accepted_answers: [{value: "There's a fire!", status: "correct"}]
    feedback: "*There's a fire!* یعنی آتیش گرفته."
  en.a1.unit45.lesson02.exercise02.choose_send_ambulance_meaning:
    instruction: "کدوم عبارت درخواست همون وسیله‌ای رو می‌کنه که آدمای زخمی رو به بیمارستان می‌بره؟"
    correct_option: "Send an ambulance, please."
    distractors: ["Call 911!", "There's a fire!", "What's your emergency?"]
    accepted_answers: [{value: "Send an ambulance, please.", status: "correct"}]
    feedback: "*Send an ambulance, please.* یعنی لطفاً آمبولانس بفرستین."
  en.a1.unit45.lesson02.exercise03.choose_whats_your_emergency_meaning:
    instruction: "معمولاً اپراتور اورژانس اول کدوم عبارتو می‌پرسه؟"
    correct_option: "What's your emergency?"
    distractors: ["Call 911!", "I need help!", "There's a fire!"]
    accepted_answers: [{value: "What's your emergency?", status: "correct"}]
    feedback: "*What's your emergency?* یعنی وضعیت اضطراریتون چیه؟"
  en.a1.unit45.lesson02.exercise04.order_send_police_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["Send", "the", "police,", "please."], status: "correct"}]
    feedback: "ترتیب درست: *Send the police, please.*"
  en.a1.unit45.lesson02.exercise05.translate_i_need_help:
    instruction: "ترجمه کنین: «من کمک لازم دارم!»"
    accepted_answers: [{value: "I need help!", status: "correct"}, {value: "I need help", status: "correct"}]
    feedback: "*I need help!*"

  en.a1.unit45.lesson03.exercise01.comprehension_leila_smells:
    instruction: "طبق گفتگو، لیلا بوی چی رو حس می‌کنه؟"
    correct_option: "smoke"
    distractors: ["gas", "food", "perfume"]
    accepted_answers: [{value: "smoke", status: "correct"}]
    feedback: "لیلا می‌گه بوی دود میاد."
  en.a1.unit45.lesson03.exercise02.comprehension_daniel_why_fire:
    instruction: "طبق گفتگو، دنیل موقعی که ماهیتابه آتیش گرفت داشت چیکار می‌کرد؟"
    correct_option: "cooking dinner"
    distractors: ["washing dishes", "cleaning the stove", "talking on the phone"]
    accepted_answers: [{value: "cooking dinner", status: "correct"}]
    feedback: "دنیل می‌گه داشت شام درست می‌کرد."
  en.a1.unit45.lesson03.exercise03.listen_dialogue_leila_request:
    instruction: "طبق گفتگو، لیلا از اپراتور اورژانس می‌خواد کیو بفرسته؟"
    correct_option: "the fire department"
    distractors: ["the police", "an ambulance", "a taxi"]
    accepted_answers: [{value: "the fire department", status: "correct"}]
    feedback: "لیلا می‌گه لطفاً آتش‌نشانی رو بفرستین."
  en.a1.unit45.lesson03.exercise04.respond_own_emergency_request:
    instruction: "بگین کمک لازم دارین، یا بگین کدوم سازمان باید فرستاده بشه."
    accepted_answers: ["I need help", "I need help.", "Call the police", "Call the police.", "Call an ambulance", "Call an ambulance.", "There's a fire", "There's a fire.", "Send the fire department", "Send the fire department.", "What's your emergency?"]
    feedback: "می‌تونین از الگوی *I need help* یا *Send the ...* استفاده کنین."

  en.a1.unit45.lesson04.exercise01.reading_first_step:
    instruction: "طبق دستورالعمل، اگه آتیش گرفت اول باید چیکار کنین؟"
    correct_option: "stay calm"
    distractors: ["call your friends", "grab your things", "open the windows"]
    accepted_answers: [{value: "stay calm", status: "correct"}]
    feedback: "دستورالعمل می‌گه اول آروم باشین."
  en.a1.unit45.lesson04.exercise02.reading_use_instead_of_elevator:
    instruction: "طبق دستورالعمل، به‌جای آسانسور باید از چی استفاده کنین؟"
    correct_option: "the stairs"
    distractors: ["the window", "the fire escape ladder", "the back door"]
    accepted_answers: [{value: "the stairs", status: "correct"}]
    feedback: "دستورالعمل می‌گه از پله‌ها استفاده کنین."
  en.a1.unit45.lesson04.exercise03.reading_who_checked_on_them:
    instruction: "طبق متن، بعد از آتیش‌سوزی کی سراغ دنیل و لیلا رو گرفت؟"
    correct_option: "Mia"
    distractors: ["a neighbor", "a firefighter", "no one"]
    accepted_answers: [{value: "Mia", status: "correct"}]
    feedback: "متن می‌گه میا سراغشونو گرفت."
  en.a1.unit45.lesson04.exercise04.write_own_emergency_message:
    instruction: "یه پیام کوتاه بنویسین: بگین وضعیت اضطراریه و چه کمکی لازم دارین."
    accepted_answers: ["There's a fire. Send the fire department.", "There's a fire. Send the fire department, please.", "There's a fire, send the fire department.", "There's a fire, and send the fire department.", "I need help. Send an ambulance.", "I need help. Send an ambulance, please.", "I need help, send an ambulance.", "I need help, and send an ambulance.", "There's an emergency. Send the police.", "There's an emergency. Send the police, please.", "There's an emergency, send the police.", "There's an emergency, and send the police."]
    feedback: "می‌تونین از الگوی *There's a fire. Send the fire department.* استفاده کنین."
