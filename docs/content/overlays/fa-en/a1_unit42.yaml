review: {status: "reviewed", required_next_reviewer: null, notes: "New overlay against the shared English realization unit42 (personality), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1, every teaching card with a realization example: has a matching example_gloss:. Contrastive-grammar points, deliberately different from ones already used in this direction: (1) What's he like? (asking for a description of character) versus the surface-similar What does he like? (asking about preferences) -- a genuine minimal-pair trap that Persian's own separate question forms (اون چجور آدمیه؟ vs چی دوست داره؟) don't create, since Persian never reuses one verb for both meanings the way English overloads 'like'; flagged explicitly so learners memorize the description sense rather than reasoning from the more common preference sense they likely learned first; (2) warm up quickly as a fixed idiom extending a literal temperature verb (warm) to a social meaning (become more comfortable/friendly) -- Persian's parallel idiom uses a completely different metaphor, باز شدن ('opening up'), so this must be memorized as a whole chunk rather than translated word-for-word through the temperature metaphor; (3) the two-part time-framing pattern a little shy AT FIRST, but ... ONCE he knows you -- contrasting an initial-encounter time marker with a conditional-familiarity time marker in the same sentence, a pattern Persian builds similarly (اول ... ولی وقتی که می‌شناستت) but with different clause-ordering flexibility, flagged as worth drilling as a fixed two-part frame. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, NOT translated Persian lefts, per the established compiler-driven precedent. lesson03/lesson04 multiple_choice and listen_select distractor sets copied verbatim from the realization's own review notes documenting the exact invented, never-spoken-in-this-unit values already verified safe. Strong sibling-isolation rule applied -- nl-en/prs-en overlays for this unit were not consulted. Needs the mandatory fresh-context review before shipping.\n\nfa-en review 2026-10-19: Checked notes, glosses, Persian style, distractors, answers, canon and sequencing. 13 fixes: false warm-up note (Persian has the similar گرم گرفتن), reading note that did not match its example, nervous rendered as عصبی (angry) in the shy prompt, calm/shy match definitions, translation of gender-neutral اون now accepts she/What is, 6 untaught distractors replaced (serious, organized, lazy, careless, sell), missing answers added."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit42.personality: {title: "توصیف شخصیت"}

lessons:
  en.a1.unit42.lesson01.personality_vocabulary: {title: "کلمات شخصیت"}
  en.a1.unit42.lesson02.talking_about_someones_character: {title: "صحبت دربارهٔ شخصیت یکی"}
  en.a1.unit42.lesson03.dialogue_what_is_daniel_like: {title: "گفتگو: دنیل چجور آدمیه؟"}
  en.a1.unit42.lesson04.three_friends_three_personalities: {title: "متن: سه دوست، سه شخصیت"}

teaching:
  en.a1.unit42.lesson01.teach.friendly: {title: "friendly", gloss: "مهربون / خوش‌برخورد", note: "*friendly* یعنی مهربون و راحت برای حرف زدن.", example_gloss: "همسایه‌م خیلی مهربونه."}
  en.a1.unit42.lesson01.teach.funny: {title: "funny", gloss: "بامزه / بانمک", note: "*funny* یعنی کسی که بقیه رو می‌خندونه.", example_gloss: "برادرم واقعاً بامزه‌ست."}
  en.a1.unit42.lesson01.teach.hardworking: {title: "hardworking", gloss: "زحمتکش / سخت‌کوش", note: "*hardworking* یعنی کسی که سخت کار می‌کنه و زود بی‌خیال نمی‌شه.", example_gloss: "اون یه کارمند زحمتکشه."}
  en.a1.unit42.lesson01.teach.shy: {title: "shy", gloss: "خجالتی", note: "*shy* یعنی کسی که موقع آشنایی با آدمای جدید خجالت می‌کشه.", example_gloss: "اون اولش یه‌کم خجالتیه."}
  en.a1.unit42.lesson01.teach.calm: {title: "calm", gloss: "آروم / خونسرد", note: "*calm* یعنی کسی که زود ناراحت یا عصبی نمی‌شه.", example_gloss: "مادرم خیلی خونسرده."}
  en.a1.unit42.lesson01.teach.talkative: {title: "talkative", gloss: "پرحرف / اهل‌حرف", note: "*talkative* یعنی کسی که خیلی حرف می‌زنه.", example_gloss: "خواهرم خیلی پرحرفه."}

  en.a1.unit42.lesson02.teach.a_little_shy: {title: "a little shy", gloss: "یه‌کم خجالتی", note: "*a little shy* -- *a little* قبل از صفت میاد و شدتشو کم می‌کنه.", example_gloss: "اون اولش یه‌کم خجالتیه، ولی زود صمیمی می‌شه."}
  en.a1.unit42.lesson02.teach.very_hardworking: {title: "very hardworking", gloss: "خیلی زحمتکش", note: "*very hardworking* -- *very* شدت صفت رو زیاد می‌کنه.", example_gloss: "همکارم خیلی زحمتکشه."}
  en.a1.unit42.lesson02.teach.have_a_great_sense_of_humor: {title: "have a great sense of humor", gloss: "حس شوخ‌طبعی خوبی داشتن", note: "*have a great sense of humor* -- کل عبارت با فعل *have* میاد، نه فعل جداگونه‌ای برای «بامزه بودن».", example_gloss: "دنیل حس شوخ‌طبعی خیلی خوبی داره."}
  en.a1.unit42.lesson02.teach.get_along_with_everyone: {title: "get along with everyone", gloss: "با همه خوب کنار اومدن", note: "*get along with everyone* -- همون فعل عبارتی *get along with* که قبلاً دیدیم، این‌بار با *everyone* (همه).", example_gloss: "میا سر کار با همه خوب کنار میاد."}
  en.a1.unit42.lesson02.teach.warm_up_quickly: {title: "warm up quickly", gloss: "زود صمیمی شدن", note: "*warm up* یعنی «گرم شدن»، ولی اینجا یه اصطلاحه به‌معنی زود راحت و صمیمی شدن با کسی -- تقریباً مثل «گرم گرفتن» یا «یخش باز شدن» توی فارسی. کل عبارت رو با هم حفظ کنین.", example_gloss: "اون خجالتیه، ولی وقتی بشناستت زود صمیمی می‌شه."}
  en.a1.unit42.lesson02.teach.whats_he_like_question: {title: "What's he like?", gloss: "اون چجور آدمیه؟", note: "*What's he LIKE?* یعنی «شخصیتش چجوریه؟» -- با *What does he LIKE?* (چی دوست داره؟) قاطی نشه؛ فارسی این دو تا سؤال کلمهٔ کاملاً جدا دارن (چجور آدمیه / چی دوست داره)، ولی انگلیسی از یه کلمهٔ *like* برای هر دو استفاده می‌کنه."}

  en.a1.unit42.lesson03.teach.dialogue_line1: {title: "سؤال میا", gloss: "میا می‌گه هفتهٔ بعد با دنیل یه پروژهٔ جدید شروع می‌کنه و می‌پرسه اون چجور آدمیه.", note: "*What's he like?* -- سؤال دربارهٔ شخصیت، نه علاقه."}
  en.a1.unit42.lesson03.teach.dialogue_line2: {title: "جواب لیلا", gloss: "لیلا می‌گه اون خیلی مهربونه، و واقعاً بامزه هم هست.", note: "*too* آخر جمله یعنی «هم» -- اضافه کردن یه ویژگی دیگه."}
  en.a1.unit42.lesson03.teach.dialogue_line3: {title: "سؤال میا", gloss: "میا می‌گه خوشحاله که این رو می‌شنوه و می‌پرسه کار کردن باهاش راحته یا نه.", note: "*That's good to hear!* -- ابراز خوشحالی از یه خبر خوب."}
  en.a1.unit42.lesson03.teach.dialogue_line4: {title: "جواب لیلا", gloss: "لیلا می‌گه آره، خیلی هم زحمتکشه -- همیشه کاراشو سر وقت تموم می‌کنه.", note: "*He always finishes his tasks on time* -- قید *always* با فعل حال ساده."}
  en.a1.unit42.lesson03.teach.dialogue_line5: {title: "سؤال میا", gloss: "میا می‌پرسه اون توی جلسه‌ها گاهی خجالتی می‌شه؟", note: "*Is he ever shy...?* -- *ever* یعنی «هیچ‌وقت/گاهی»، توی سؤال."}
  en.a1.unit42.lesson03.teach.dialogue_line6: {title: "جواب لیلا", gloss: "لیلا می‌گه یه‌کم، ولی وقتی کسی رو بشناسه راحت‌تر می‌شه.", note: "*once he knows you* -- *once* اینجا یعنی «به‌محض اینکه»، نه عدد یک بار."}
  en.a1.unit42.lesson03.teach.dialogue_line7: {title: "جواب میا", gloss: "میا تشکر می‌کنه و می‌گه حالا دربارهٔ پروژه خیالش راحت‌تره.", note: "*I feel more relaxed* -- حس کردن یه حالت با فعل *feel*."}

  en.a1.unit42.lesson04.teach.reading_passage: {title: "متن: سه دوست، سه شخصیت", gloss: "دنیل، لیلا و میا دوستای صمیمی‌ان، ولی شخصیت‌های خیلی متفاوتی دارن. دنیل مهربون و بامزه‌ست -- همیشه دوستاشو می‌خندونه. اون موقع آشنایی با آدمای جدید یه‌کم خجالتیه، ولی زود صمیمی می‌شه. لیلا آروم و خلاقه. اون عاشق نقاشیه چون کمکش می‌کنه آروم بشه، و به‌ندرت از چیزی ناراحت می‌شه. میا برون‌گرا و منظمه. اون دوست داره برای گروه برنامه بریزه، و وقتی به دوستاش چیز جدیدی یاد می‌ده خیلی صبوره -- اون بود که به دنیل آشپزی یاد داد. با اینکه هر سه تاشون متفاوتن، با همه خوب کنار میان و از وقت گذروندن با هم لذت می‌برن.", note: "دقت کنین بعد از *like* و *love* می‌شه فعل رو با *-ing* آورد: *She likes making plans*، *She loves painting*."}

exercises:
  en.a1.unit42.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "hardworking"
    distractors: ["friendly", "funny", "shy", "calm"]
    accepted_answers: [{value: "hardworking", status: "correct"}]
    feedback: "*hardworking* یعنی زحمتکش."
  en.a1.unit42.lesson01.exercise02.choose_shy_meaning:
    instruction: "کدوم کلمه یعنی کسی که موقع آشنایی با آدمای جدید معذبه و استرس داره؟"
    correct_option: "shy"
    distractors: ["funny", "calm", "talkative"]
    accepted_answers: [{value: "shy", status: "correct"}]
    feedback: "*shy* یعنی خجالتی."
  en.a1.unit42.lesson01.exercise03.match_personality_words:
    instruction: "هر واژه یا عبارت انگلیسی رو به توضیح فارسی درستش وصل کنین."
    pairs:
      - {left: "friendly", right: "مهربون و راحت برای هم‌صحبتی"}
      - {left: "funny", right: "کسی که بقیه رو می‌خندونه"}
      - {left: "hardworking", right: "کسی که سخت کار می‌کنه و زود تسلیم نمی‌شه"}
      - {left: "shy", right: "کنار آدمای جدید معذب یا کم‌حرف"}
      - {left: "calm", right: "کسی که آروم می‌مونه و زود ناراحت نمی‌شه"}
      - {left: "talkative", right: "کسی که زیاد حرف می‌زنه"}
    accepted_answers:
      - value:
          - {left: "friendly", right: "مهربون و راحت برای هم‌صحبتی"}
          - {left: "funny", right: "کسی که بقیه رو می‌خندونه"}
          - {left: "hardworking", right: "کسی که سخت کار می‌کنه و زود تسلیم نمی‌شه"}
          - {left: "shy", right: "کنار آدمای جدید معذب یا کم‌حرف"}
          - {left: "calm", right: "کسی که آروم می‌مونه و زود ناراحت نمی‌شه"}
          - {left: "talkative", right: "کسی که زیاد حرف می‌زنه"}
        status: "correct"
    feedback: "friendly=مهربون، funny=بامزه، hardworking=زحمتکش، shy=خجالتی، calm=آروم، talkative=پرحرف."
  en.a1.unit42.lesson01.exercise04.order_hardworking_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["She", "is", "a", "hardworking", "employee."], status: "correct"}]
    feedback: "ترتیب درست: *She is a hardworking employee.*"
  en.a1.unit42.lesson01.exercise05.write_calm_word:
    instruction: "کلمه‌ای رو بنویسین که یعنی کسی که زود ناراحت یا عصبی نمی‌شه."
    accepted_answers: [{value: "calm", status: "correct"}]
    feedback: "*calm* یعنی آروم."

  en.a1.unit42.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "get along with everyone"
    distractors: ["a little shy", "very hardworking", "have a great sense of humor", "warm up quickly"]
    accepted_answers: [{value: "get along with everyone", status: "correct"}]
    feedback: "*get along with everyone* یعنی با همه خوب کنار اومدن."
  en.a1.unit42.lesson02.exercise02.choose_sense_of_humor_meaning:
    instruction: "کدوم عبارت یعنی کسی خیلی بامزه‌ست و بقیه رو می‌خندونه؟"
    correct_option: "have a great sense of humor"
    distractors: ["a little shy", "very hardworking", "get along with everyone"]
    accepted_answers: [{value: "have a great sense of humor", status: "correct"}]
    feedback: "*have a great sense of humor* یعنی حس شوخ‌طبعی خوبی داشتن."
  en.a1.unit42.lesson02.exercise03.choose_warm_up_quickly_meaning:
    instruction: "کدوم عبارت یعنی کسی زود بعد از آشنایی با آدمای جدید راحت می‌شه؟"
    correct_option: "warm up quickly"
    distractors: ["a little shy", "very hardworking", "have a great sense of humor"]
    accepted_answers: [{value: "warm up quickly", status: "correct"}]
    feedback: "*warm up quickly* یعنی زود صمیمی شدن."
  en.a1.unit42.lesson02.exercise04.order_coworker_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["My", "coworker", "is", "very", "hardworking."], status: "correct"}]
    feedback: "ترتیب درست: *My coworker is very hardworking.*"
  en.a1.unit42.lesson02.exercise05.translate_whats_he_like:
    instruction: "ترجمه کنین: «اون چجور آدمیه؟»"
    accepted_answers: [{value: "What's he like?", status: "correct"}, {value: "What's he like", status: "correct"}, {value: "What's she like?", status: "correct"}, {value: "What's she like", status: "correct"}, {value: "What is he like?", status: "correct"}, {value: "What is she like?", status: "correct"}]
    feedback: "*What's he like?*"

  en.a1.unit42.lesson03.exercise01.comprehension_leila_daniel_personality:
    instruction: "طبق گفتگو، لیلا دربارهٔ شخصیت دنیل چی می‌گه؟"
    correct_option: "friendly and funny"
    distractors: ["shy and quiet", "calm and talkative", "quiet and calm"]
    accepted_answers: [{value: "friendly and funny", status: "correct"}]
    feedback: "لیلا می‌گه دنیل مهربون و بامزه‌ست."
  en.a1.unit42.lesson03.exercise02.comprehension_leila_daniel_work:
    instruction: "طبق گفتگو، لیلا دربارهٔ عادت‌های کاری دنیل چی می‌گه؟"
    correct_option: "hardworking"
    distractors: ["talkative", "slow", "calm"]
    accepted_answers: [{value: "hardworking", status: "correct"}]
    feedback: "لیلا می‌گه دنیل خیلی زحمتکشه."
  en.a1.unit42.lesson03.exercise03.listen_dialogue_meetings:
    instruction: "طبق گفتگو، لیلا دربارهٔ دنیل توی جلسه‌ها چی می‌گه؟"
    correct_option: "a little shy"
    distractors: ["very talkative", "always late", "not very friendly"]
    accepted_answers: [{value: "a little shy", status: "correct"}]
    feedback: "لیلا می‌گه یه‌کم خجالتیه."
  en.a1.unit42.lesson03.exercise04.respond_own_personality:
    instruction: "دربارهٔ شخصیت خودتون یه چیزی بگین، یا بپرسین کسی چجور آدمیه."
    accepted_answers: ["I'm friendly and funny", "I'm friendly and funny.", "I'm hardworking", "I'm hardworking.", "I'm a little shy", "I'm a little shy.", "I'm calm", "I'm calm.", "I'm friendly", "I'm friendly.", "I'm funny", "I'm funny.", "I'm talkative", "I'm talkative.", "What's she like?", "What's he like?", "I am friendly.", "I am calm.", "I am hardworking.", "I'm very friendly.", "I'm a little shy at first.", "What is he like?", "What is she like?"]
    feedback: "می‌تونین از الگوی *I'm ...* یا *What's he/she like?* استفاده کنین."

  en.a1.unit42.lesson04.exercise01.reading_daniel_traits:
    instruction: "طبق متن، دو تا ویژگی دنیل چیه؟"
    correct_option: "friendly and funny"
    distractors: ["calm and organized", "shy and quiet", "calm and talkative"]
    accepted_answers: [{value: "friendly and funny", status: "correct"}]
    feedback: "متن می‌گه دنیل مهربون و بامزه‌ست."
  en.a1.unit42.lesson04.exercise02.reading_leila_hobby_reason:
    instruction: "طبق متن، چرا لیلا نقاشی رو دوست داره؟"
    correct_option: "it helps her relax"
    distractors: ["it's her job", "her mother taught her", "it's easy for her"]
    accepted_answers: [{value: "it helps her relax", status: "correct"}]
    feedback: "متن می‌گه نقاشی کمکش می‌کنه آروم بشه."
  en.a1.unit42.lesson04.exercise03.reading_mia_taught_daniel:
    instruction: "طبق متن، میا با صبر و حوصله به دنیل چی یاد داد؟"
    correct_option: "how to cook"
    distractors: ["how to paint", "how to swim", "how to drive"]
    accepted_answers: [{value: "how to cook", status: "correct"}]
    feedback: "متن می‌گه میا به دنیل آشپزی یاد داد."
  en.a1.unit42.lesson04.exercise04.write_own_personality_sentence:
    instruction: "یه جمله دربارهٔ شخصیت خودتون بنویسین، با «I'm...» یا «I am...»."
    accepted_answers: ["I'm friendly", "I'm friendly.", "I am friendly", "I am friendly.", "I'm funny", "I'm funny.", "I'm hardworking", "I'm hardworking.", "I'm a little shy", "I'm a little shy.", "I'm calm", "I'm calm.", "I'm talkative", "I'm talkative.", "I am funny.", "I am hardworking.", "I am a little shy.", "I am calm.", "I am talkative.", "I'm friendly and funny.", "I'm very friendly.", "I'm very hardworking.", "I'm very calm.", "I'm very talkative.", "I'm really funny.", "I'm a little shy at first."]
    feedback: "می‌تونین از الگوی *I'm ...* یا *I am ...* استفاده کنین."
