course:
  title: "انگلیسی A2"
  description: "آموزش انگلیسی سطح A2 برای موقعیت‌های رسمی‌تر، با توضیحات دقیق فارسی."

units:
  en.a2.unit36.document_correction: {title: "اصلاح یک اشتباه در یک مدرک رسمی"}

lessons:
  en.a2.unit36.lesson01.document_vocabulary: {title: "گواهی، اشتباه و کپی"}
  en.a2.unit36.lesson02.asking_for_a_correction: {title: "درخواست اصلاح"}
  en.a2.unit36.lesson03.reading_a_correction_notice: {title: "خواندن اطلاعیهٔ اصلاح"}
  en.a2.unit36.lesson04.correction_dialogue: {title: "پشت باجهٔ ادارهٔ ثبت‌نام"}

teaching:
  en.a2.unit36.lesson01.teach.certificate: {title: "certificate", gloss: "گواهی", note: "*certificate* یعنی برگهٔ رسمی‌ای که یه اداره بهتون می‌ده؛ *registration certificate* یعنی گواهی ثبت‌نام.", example_gloss: "گواهی ثبت‌نامم دو هفته بعد از قرار ملاقات رسید."}
  en.a2.unit36.lesson01.teach.mistake: {title: "mistake", gloss: "اشتباه", note: "*mistake* یعنی چیزی که اشتباه نوشته شده.", example_gloss: "توی آدرسم روی این فرم یه اشتباه هست."}
  en.a2.unit36.lesson01.teach.spelled: {title: "spelled", gloss: "املا شده", note: "*spelled* می‌گه یه کلمه با چه حروفی و به چه ترتیبی نوشته شده.", example_gloss: "اسمم با یه «ل» نوشته می‌شه، نه با دوتا."}
  en.a2.unit36.lesson01.teach.correct: {title: "correct", gloss: "اصلاح کردن", note: "*correct* اینجا فعله: چیزی رو که غلطه درست کردن.", example_gloss: "کارمند می‌تونه امروز نام خانوادگی‌ام رو اصلاح کنه."}
  en.a2.unit36.lesson01.teach.copy: {title: "copy", gloss: "کپی", note: "*copy* یعنی یه نسخهٔ دوم و کاملاً یکسان از یه مدرک.", example_gloss: "اداره از هر مدرک یه کپی نگه می‌داره."}
  en.a2.unit36.lesson01.teach.passport: {title: "passport", gloss: "پاسپورت", note: "*passport* یعنی مدرک سفری که عکستون توشه.", example_gloss: "همیشه پاسپورتم رو به قرار ملاقات رسمی می‌برم."}
  en.a2.unit36.lesson01.teach.grammar_there_is_there_are: {title: "there is و there are", gloss: "روی گواهی‌ام یه اشتباه هست. روی گواهی‌ام دو تا اشتباه هست.", note: "*there is* رو برای یه چیز و *there are* رو برای بیشتر از یکی به کار می‌برین."}

  en.a2.unit36.lesson02.teach.there_is_a_mistake: {title: "گفتن اینکه یه اشتباه وجود داره", gloss: "روی گواهی ثبت‌نامم یه اشتباه هست.", note: "*There is a mistake on...* شکل بی‌طرف و رسمیِ اعلام یه اشتباهه."}
  en.a2.unit36.lesson02.teach.name_spelled_wrong: {title: "گفتن اینکه دقیقاً چی غلطه", gloss: "نام خانوادگی‌ام اشتباه املا شده.", note: "*last name* یعنی نام خانوادگی؛ *first name* یعنی نام کوچک."}
  en.a2.unit36.lesson02.teach.could_you_correct_it: {title: "درخواست اصلاح", gloss: "می‌تونید لطفاً اصلاحش کنید؟", note: "*Could you...?* مؤدبانه‌تر از *Can you...?* است و به باجهٔ اداری می‌خوره."}
  en.a2.unit36.lesson02.teach.how_long_correction: {title: "پرسیدن اینکه چقدر طول می‌کشه", gloss: "اصلاحش چقدر طول می‌کشه؟", note: "*How long...?* دربارهٔ مدت زمان می‌پرسه، نه دربارهٔ طول."}
  en.a2.unit36.lesson02.teach.grammar_polite_request: {title: "دو شکل درخواست مؤدبانه", gloss: "می‌تونید لطفاً اصلاحش کنید؟ امکانش هست یه گواهی جدید بگیرم؟", note: "*Could you...?* یه کار رو می‌خواد؛ *Would it be possible to...?* محتاطانه‌تره و می‌پرسه که اصلاً امکانش هست یا نه."}

  en.a2.unit36.lesson03.teach.working_days: {title: "working days", gloss: "روزهای کاری", note: "*working days* یعنی روزهای دوشنبه تا جمعه، بدون آخر هفته.", example_gloss: "اداره هر نامه رو ظرف پنج روز کاری جواب می‌ده."}
  en.a2.unit36.lesson03.teach.notice_text: {title: "متن اطلاعیهٔ اصلاح", gloss: "درخواست اصلاح دریافت شد. گواهی ثبت‌نام شما ظرف پنج روز کاری اصلاح می‌شه. لطفاً پاسپورت و این اطلاعیه رو به اداره بیارید. شمارهٔ پیگیری ۳۰۹۲.", note: "یه اطلاعیهٔ رسمی کوتاه و اداریه: چی شده، چی قراره بشه، و شما چیکار باید بکنین."}
  en.a2.unit36.lesson03.teach.bring_passport_and_notice: {title: "چیزی که باید همراهتون بیارید", gloss: "لطفاً پاسپورت و این اطلاعیه رو به اداره بیارید.", note: "*bring ... to ...* یعنی چیزی رو به یه جا بردن."}

  en.a2.unit36.lesson04.teach.q_there_is_a_mistake: {title: "لیلا اشتباه رو اعلام می‌کنه", gloss: "لیلا می‌گه: سلام، روی گواهی ثبت‌نامم یه اشتباه هست.", note: "*Hello* رسمی‌تر از *Hi* است و به باجهٔ اداری بهتر می‌خوره."}
  en.a2.unit36.lesson04.teach.a_what_is_wrong: {title: "کارمند بیشتر می‌پرسه", gloss: "کارمند می‌گه: متوجه شدم. مشکلش چیه؟", note: "*I see* اینجا یعنی متوجه شدم، دارم گوش می‌دم."}
  en.a2.unit36.lesson04.teach.q_name_spelled_wrong: {title: "لیلا اشتباه رو توضیح می‌ده و درخواست می‌کنه", gloss: "لیلا می‌گه: نام خانوادگی‌ام اشتباه املا شده. می‌تونید لطفاً اصلاحش کنید؟", note: "همون دو جمله‌ای که در درس دوم یاد گرفتین، حالا پشت سر هم."}
  en.a2.unit36.lesson04.teach.a_do_you_have_passport: {title: "کارمند پاسپورت رو می‌خواد", gloss: "کارمند می‌گه: البته. پاسپورتتون همراهتونه؟", note: "*Do you have ... with you?* یعنی همین الان همراهتون هست؟"}
  en.a2.unit36.lesson04.teach.q_here_it_is: {title: "لیلا پاسپورتش رو می‌ده", gloss: "لیلا می‌گه: بله، بفرمایید.", note: "*Here it is* رو موقع دادن چیزی به کسی می‌گین."}
  en.a2.unit36.lesson04.teach.a_copy_and_send: {title: "کارمند توضیح می‌ده چیکار می‌کنه", gloss: "کارمند می‌گه: ممنون. یه کپی می‌گیرم و اصلاح رو امروز می‌فرستم.", note: "*make a copy* یه ترکیب ثابته: کپی گرفتن."}
  en.a2.unit36.lesson04.teach.q_how_long: {title: "لیلا می‌پرسه چقدر طول می‌کشه", gloss: "لیلا می‌پرسه: اصلاحش چقدر طول می‌کشه؟", note: "همون سوالی که در درس دوم یاد گرفتین."}
  en.a2.unit36.lesson04.teach.a_within_five_working_days: {title: "جواب کارمند", gloss: "کارمند می‌گه: ظرف پنج روز کاری. لطفاً پاسپورت و این اطلاعیه رو به اداره بیارید.", note: "*within* یعنی ظرف یه مدت مشخص، یعنی حداکثر تا پنج روز کاری."}
  en.a2.unit36.lesson04.teach.q_thank_you: {title: "لیلا تشکر می‌کنه", gloss: "لیلا می‌گه: خیلی ممنون.", note: "*very much* تشکر رو کمی پررنگ‌تر می‌کنه."}

exercises:
  en.a2.unit36.lesson01.exercise01.listen_word:
    instruction: "گوش کنید و کلمه‌ای که گفته شد رو انتخاب کنید."
    correct_option: "certificate"
    distractors: ["mistake", "copy", "passport"]
    accepted_answers: [{value: "certificate", status: "correct"}]
    feedback: "*certificate* یعنی گواهی."
  en.a2.unit36.lesson01.exercise02.choose_mistake_word:
    instruction: "کدوم کلمه یعنی چیزی که اشتباه نوشته شده؟"
    correct_option: "mistake"
    distractors: ["copy", "certificate", "passport"]
    accepted_answers: [{value: "mistake", status: "correct"}]
    feedback: "*mistake* یعنی اشتباه."
  en.a2.unit36.lesson01.exercise03.choose_copy_word:
    instruction: "کدوم کلمه یعنی یه نسخهٔ دوم و کاملاً یکسان از یه مدرک؟"
    correct_option: "copy"
    distractors: ["mistake", "certificate", "form"]
    accepted_answers: [{value: "copy", status: "correct"}]
    feedback: "*copy* یعنی کپی."
  en.a2.unit36.lesson01.exercise04.match_document_words:
    instruction: "هر معنی رو به کلمهٔ درست انگلیسی وصل کنید."
    accepted_answers:
      - value:
          - {left: "certificate", right: "the official paper the office gives you"}
          - {left: "mistake", right: "something that is written wrong"}
          - {left: "spelled", right: "written with these letters, in this order"}
          - {left: "correct", right: "to change something wrong into something right"}
          - {left: "copy", right: "a second, identical version of a document"}
          - {left: "passport", right: "the travel document with your photo in it"}
          - {left: "document", right: "any official paper with information on it"}
          - {left: "form", right: "the paper you fill in with your details"}
        status: "correct"
    feedback: "*certificate*=گواهی، *mistake*=اشتباه، *spelled*=املا شده، *correct*=اصلاح کردن، *copy*=کپی، *passport*=پاسپورت، *document*=مدرک، *form*=فرم."
  en.a2.unit36.lesson01.exercise05.write_certificate:
    instruction: "کلمه‌ای رو بنویسید که یعنی برگهٔ رسمی‌ای که اداره بهتون می‌ده."
    accepted_answers:
      - {value: "certificate", status: "correct"}
      - {value: "Certificate", status: "correct"}
    feedback: "*certificate* یعنی گواهی."

  en.a2.unit36.lesson02.exercise01.listen_problem:
    instruction: "گوش کنید و جمله‌ای که گفته شد رو انتخاب کنید."
    correct_option: "My last name is spelled wrong"
    distractors: ["There is a mistake on my registration certificate.", "Could you correct it, please?", "How long will the correction take?"]
    accepted_answers: [{value: "My last name is spelled wrong", status: "correct"}]
    feedback: "این یعنی: نام خانوادگی‌ام اشتباه املا شده."
  en.a2.unit36.lesson02.exercise02.choose_report_mistake:
    instruction: "پشت باجهٔ ادارهٔ ثبت‌نام ایستادین. چطور رسمی می‌گین که گواهی‌تون اشتباه داره؟"
    correct_option: "There is a mistake on my registration certificate."
    distractors: ["My last name is spelled wrong.", "Could you correct it, please?", "How long will the correction take?"]
    accepted_answers: [{value: "There is a mistake on my registration certificate.", status: "correct"}]
    feedback: "*There is a mistake on...* اول اعلام می‌کنه که اشتباهی وجود داره؛ جزئیاتش رو بعد می‌گین."
  en.a2.unit36.lesson02.exercise03.choose_ask_how_long:
    instruction: "کارمند قبول می‌کنه که تغییرش بده. می‌خواین بدونین چقدر زمان می‌بره. چی می‌پرسین؟"
    correct_option: "How long will the correction take?"
    distractors: ["Could you correct it, please?", "My last name is spelled wrong.", "There is a mistake on my registration certificate."]
    accepted_answers: [{value: "How long will the correction take?", status: "correct"}]
    feedback: "*How long will the correction take?* دربارهٔ مدت زمان می‌پرسه."
  en.a2.unit36.lesson02.exercise04.order_name_spelled_wrong:
    instruction: "کلمه‌ها رو طوری مرتب کنید که «نام خانوادگی‌ام اشتباه املا شده» بشه."
    accepted_answers: [{value: ["My", "last", "name", "is", "spelled", "wrong"], status: "correct"}]
    feedback: "ترتیب درست *My last name is spelled wrong* است."
  en.a2.unit36.lesson02.exercise05.order_could_you_correct_it:
    instruction: "کلمه‌ها رو طوری مرتب کنید که «می‌تونید لطفاً اصلاحش کنید؟» بشه."
    accepted_answers: [{value: ["Could", "you", "correct", "it", "please"], status: "correct"}]
    feedback: "ترتیب درست *Could you correct it please* است."
  en.a2.unit36.lesson02.exercise06.reply_ask_how_long:
    instruction: "کارمند می‌گه که اصلاح رو امروز می‌فرسته. حالا بپرسید که اصلاحش چقدر طول می‌کشه."
    accepted_answers:
      - {value: "How long will the correction take?", status: "correct"}
      - {value: "How long will the correction take", status: "correct"}
    feedback: "*How long will the correction take?* همون سوالیه که توی این درس یاد گرفتین."
  en.a2.unit36.lesson02.exercise07.write_there_is_a_mistake:
    instruction: "بنویسید که روی گواهی ثبت‌نامتون یه اشتباه هست."
    accepted_answers:
      - {value: "There is a mistake on my registration certificate.", status: "correct"}
      - {value: "There is a mistake on my registration certificate", status: "correct"}
    feedback: "*There is a mistake on my registration certificate* یعنی روی گواهی ثبت‌نامم یه اشتباه هست."

  en.a2.unit36.lesson03.exercise01.read_how_long:
    instruction: "طبق اطلاعیه، اصلاح چقدر طول می‌کشه؟"
    correct_option: "within five working days"
    distractors: ["within two working days", "within ten working days", "within one month"]
    accepted_answers: [{value: "within five working days", status: "correct"}]
    feedback: "توی اطلاعیه نوشته *within five working days*."
  en.a2.unit36.lesson03.exercise02.read_what_to_bring:
    instruction: "طبق اطلاعیه، چی باید به اداره بیارید؟"
    correct_option: "your passport and this notice"
    distractors: ["your passport and a photo", "this notice and a copy of the form", "your passport and the old certificate"]
    accepted_answers: [{value: "your passport and this notice", status: "correct"}]
    feedback: "توی اطلاعیه نوشته *your passport and this notice*."
  en.a2.unit36.lesson03.exercise03.read_reference_number:
    instruction: "شمارهٔ پیگیری توی اطلاعیه چنده؟"
    correct_option: "3092"
    distractors: ["3029", "9302", "3920"]
    accepted_answers: [{value: "3092", status: "correct"}]
    feedback: "پایین اطلاعیه نوشته *Reference number 3092*."
  en.a2.unit36.lesson03.exercise04.choose_true_statement:
    instruction: "طبق اطلاعیه کدوم جمله درسته؟"
    correct_option: "Correction request received"
    distractors: ["Correction request refused", "A new appointment is needed", "The certificate has already been corrected"]
    accepted_answers: [{value: "Correction request received", status: "correct"}]
    feedback: "اطلاعیه با *Correction request received* شروع می‌شه -- یعنی درخواست رسیده، ولی هنوز انجام نشده."
  en.a2.unit36.lesson03.exercise05.order_bring_passport:
    instruction: "کلمه‌ها رو طوری مرتب کنید که «لطفاً پاسپورت و این اطلاعیه رو به اداره بیارید» بشه."
    accepted_answers: [{value: ["Please", "bring", "your", "passport", "and", "this", "notice", "to", "the", "office"], status: "correct"}]
    feedback: "ترتیب درست *Please bring your passport and this notice to the office* است."
  en.a2.unit36.lesson03.exercise06.write_corrected_within_five_days:
    instruction: "جملهٔ اطلاعیه دربارهٔ زمان اصلاح شدن گواهی رو بنویسید."
    accepted_answers:
      - {value: "Your registration certificate will be corrected within five working days.", status: "correct"}
      - {value: "Your registration certificate will be corrected within five working days", status: "correct"}
    feedback: "*Your registration certificate will be corrected within five working days* یعنی گواهی ثبت‌نام شما ظرف پنج روز کاری اصلاح می‌شه."

  en.a2.unit36.lesson04.exercise01.listen_the_problem:
    instruction: "گفتگو رو گوش کنید و انتخاب کنید که دقیقاً چی غلطه."
    correct_option: "My last name is spelled wrong"
    distractors: ["My first name is spelled wrong", "My address is wrong", "The number on the certificate is wrong"]
    accepted_answers: [{value: "My last name is spelled wrong", status: "correct"}]
    feedback: "لیلا می‌گه *My last name is spelled wrong*."
  en.a2.unit36.lesson04.exercise02.listen_how_long:
    instruction: "گوش کنید و انتخاب کنید که اصلاح چقدر طول می‌کشه."
    correct_option: "Within five working days"
    distractors: ["Within two working days", "Within ten working days", "Within one month"]
    accepted_answers: [{value: "Within five working days", status: "correct"}]
    feedback: "کارمند می‌گه *Within five working days*."
  en.a2.unit36.lesson04.exercise03.choose_what_clerk_does:
    instruction: "کارمند با پاسپورت لیلا چیکار می‌کنه؟"
    correct_option: "make a copy"
    distractors: ["keep it until Friday", "send it to another office", "put it in the file"]
    accepted_answers: [{value: "make a copy", status: "correct"}]
    feedback: "کارمند می‌گه *I will make a copy and send the correction today*."
  en.a2.unit36.lesson04.exercise04.order_how_long_correction:
    instruction: "کلمه‌ها رو طوری مرتب کنید که «اصلاحش چقدر طول می‌کشه؟» بشه."
    accepted_answers: [{value: ["How", "long", "will", "the", "correction", "take"], status: "correct"}]
    feedback: "ترتیب درست *How long will the correction take* است."
  en.a2.unit36.lesson04.exercise05.reply_here_it_is:
    instruction: "کارمند می‌پرسه پاسپورتتون همراهتونه یا نه. اون رو بدین و بگین: بله، بفرمایید."
    accepted_answers:
      - {value: "Yes, here it is.", status: "correct"}
      - {value: "Yes, here it is", status: "correct"}
      - {value: "Yes here it is", status: "correct"}
    feedback: "*Yes, here it is* رو موقع دادن چیزی به کسی می‌گین."
  en.a2.unit36.lesson04.exercise06.speak_correction_dialogue:
    instruction: "نقش لیلا رو پشت باجه بازی کنید: اعلام کنید که گواهی‌تون اشتباه داره، بگید چی غلطه، و درخواست اصلاح کنید."
