    feedback: "What do you do in your free time؟ یعنی توی اوقات فراغتت چیکار می‌کنی؟"

  en.a1.unit30.lesson03.exercise01.comprehension_daniel_hobby:
    instruction: "طبق گفتگو، دنیل اغلب چیکار می‌کنه؟"
