course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit30.hobbies: {title: "صحبت دربارهٔ سرگرمی‌ها"}

lessons:
  en.a1.unit30.lesson01.free_time_activities: {title: "فعالیت‌های اوقات فراغت"}
  en.a1.unit30.lesson02.how_often: {title: "هر چند وقت یه بار؟ قیدهای تکرار"}
  en.a1.unit30.lesson03.dialogue_free_time: {title: "گفتگو: اوقات فراغت"}
  en.a1.unit30.lesson04.comparing_hobbies: {title: "مقایسهٔ سرگرمی‌ها"}

teaching:
  en.a1.unit30.lesson01.teach.reading: {title: "reading", gloss: "کتاب‌خوانی", note: "reading یعنی کتاب‌خوانی. انگلیسی برای اسم سرگرمی‌ها از فعل + ing استفاده می‌کنه (read → reading)، درست مثل اسم مصدر فارسی «خوندن» یا «کتاب‌خوانی». پس می‌گیم Reading is my hobby، نه Read is my hobby.", example_gloss: "کتاب‌خوانی سرگرمی موردعلاقهٔ منه."}
  en.a1.unit30.lesson01.teach.cooking: {title: "cooking", gloss: "آشپزی", note: "cooking یعنی آشپزی.", example_gloss: "خواهرم عاشق آشپزیه."}
  en.a1.unit30.lesson01.teach.painting: {title: "painting", gloss: "نقاشی", note: "painting یعنی نقاشی.", example_gloss: "او آخر هفته رو با نقاشی می‌گذرونه."}
  en.a1.unit30.lesson01.teach.running: {title: "running", gloss: "دویدن", note: "running یعنی دویدن.", example_gloss: "او هر روز صبح می‌دوه."}
  en.a1.unit30.lesson01.teach.video_games: {title: "video games", gloss: "بازی‌های ویدیویی", note: "video games یعنی بازی‌های ویدیویی.", example_gloss: "برادرم بعد از مدرسه بازی ویدیویی می‌کنه."}

  en.a1.unit30.lesson02.teach.always: {title: "always", gloss: "همیشه", note: "always یعنی همیشه. نکتهٔ مهم: توی انگلیسی، قید تکرار قبل از فعل اصلی میاد (I always go)، ولی توی فارسی می‌تونه اول یا آخر جمله هم بیاد (همیشه می‌رم / می‌رم همیشه). این جابه‌جایی محل قید یکی از خطاهای رایج فارسی‌زبان‌هاست.", example_gloss: "من همیشه شنبه‌ها می‌دوم."}
  en.a1.unit30.lesson02.teach.often: {title: "often", gloss: "اغلب", note: "often یعنی اغلب؛ باز هم قبل از فعل اصلی میاد.", example_gloss: "او اغلب برای خانواده‌اش شام می‌پزه."}
  en.a1.unit30.lesson02.teach.sometimes: {title: "sometimes", gloss: "گاهی", note: "sometimes یعنی گاهی؛ این یکی توی انگلیسی هم می‌تونه اول جمله بیاد (Sometimes we play...) هم قبل از فعل.", example_gloss: "ما گاهی با هم بازی ویدیویی می‌کنیم."}
  en.a1.unit30.lesson02.teach.rarely: {title: "rarely", gloss: "به‌ندرت", note: "rarely یعنی به‌ندرت.", example_gloss: "او زمستون‌ها به‌ندرت نقاشی می‌کنه."}
  en.a1.unit30.lesson02.teach.never: {title: "never", gloss: "هرگز", note: "never یعنی هرگز.", example_gloss: "من هرگز شب‌ها بازی ویدیویی نمی‌کنم."}
  en.a1.unit30.lesson02.teach.free_time_question: {title: "What do you do in your free time?", gloss: "توی اوقات فراغتت چیکار می‌کنی؟", note: "توی این سؤال دو تا do هست: اولی (What do you...) فعل کمکی برای ساختن سؤاله و دومی (...do in your free time) فعل اصلی به معنی «انجام دادن». فارسی برای سؤال فعل کمکی نداره، پس ساختن سؤال با do برای فارسی‌زبان‌ها باید تمرین بشه."}

  en.a1.unit30.lesson03.teach.i_like_pattern: {title: "I like reading.", gloss: "من کتاب‌خوانی رو دوست دارم.", note: "بعد از like معمولاً فرم -ing میاد (I like reading)، نه فرم ساده فعل؛ فارسی‌زبان‌ها گاهی اشتباهاً می‌گن I like read."}
  en.a1.unit30.lesson03.teach.dialogue_line1: {title: "سؤال لیلا", gloss: "لیلا می‌پرسه توی اوقات فراغتت چیکار می‌کنی، دنیل؟", note: "شروع گفتگو با سؤال، طبیعیه."}
  en.a1.unit30.lesson03.teach.dialogue_line2: {title: "جواب دنیل", gloss: "دنیل می‌گه اغلب می‌دوم. و گاهی هم آشپزی می‌کنم. تو چی؟", note: "دنیل دو تا سرگرمی رو با قیدهای تکرار مختلف بیان می‌کنه."}
  en.a1.unit30.lesson03.teach.dialogue_line3: {title: "جواب لیلا", gloss: "لیلا می‌گه عاشق نقاشی‌ام. تقریباً هر آخر هفته نقاشی می‌کشم.", note: "almost every weekend یعنی تقریباً هر آخر هفته."}
  en.a1.unit30.lesson03.teach.dialogue_line4: {title: "سؤال دنیل", gloss: "دنیل می‌گه عالیه! هیچ‌وقت بازی ویدیویی می‌کنی؟", note: "Do you ever...؟ یعنی «اصلاً/هیچ‌وقت ... می‌کنی؟» و برای پرسیدن اینکه کسی گاهی یه کاری رو انجام می‌ده یا نه استفاده می‌شه."}
  en.a1.unit30.lesson03.teach.dialogue_line5: {title: "جواب لیلا", gloss: "لیلا می‌گه به‌ندرت. کتاب‌خوانی رو ترجیح می‌دم.", note: "prefer یعنی ترجیح دادن."}

  en.a1.unit30.lesson04.teach.reading_passage: {title: "متن مقایسهٔ سرگرمی‌ها", gloss: "دنیل و لیلا سرگرمی‌های متفاوتی دارن. دنیل همیشه صبح‌های شنبه می‌دوه و گاهی هم برای دوستاش شام می‌پزه. لیلا هرگز نمی‌دوه، ولی اغلب توی آخر هفته نقاشی می‌کنه. هر دو بازی ویدیویی رو دوست دارن، ولی به‌ندرت با هم بازی می‌کنن.", note: "این متن قیدهای تکرار (always/never/often/sometimes) رو توی جملات واقعی نشون می‌ده."}

exercises:
  en.a1.unit30.lesson01.exercise01.listen_hobby:
    instruction: "گوش کنین و سرگرمی گفته‌شده رو انتخاب کنین."
    correct_option: "painting"
    distractors: ["reading", "cooking", "running"]
    accepted_answers: [{value: "painting", status: "correct"}]
    feedback: "painting یعنی نقاشی."
  en.a1.unit30.lesson01.exercise02.choose_reading_meaning:
    instruction: "کدوم سرگرمی یعنی نگاه‌کردن به کتاب و فهمیدن کلمات؟"
    correct_option: "reading"
    distractors: ["cooking", "painting", "running"]
    accepted_answers: [{value: "reading", status: "correct"}]
    feedback: "reading یعنی کتاب‌خوانی."
  en.a1.unit30.lesson01.exercise03.match_hobbies:
    instruction: "هر واژه یا عبارت انگلیسی رو به توضیح فارسی درستش وصل کنین."
    pairs:
      - {left: "reading", right: "نگاه کردن به کتاب و فهمیدن نوشته‌هاش"}
      - {left: "cooking", right: "آماده کردن غذا برای خوردن"}
      - {left: "painting", right: "کشیدن تصویر با قلم‌مو"}
      - {left: "running", right: "دویدن"}
      - {left: "video games", right: "بازی‌های ویدیویی"}
    accepted_answers:
      - value:
          - {left: "reading", right: "نگاه کردن به کتاب و فهمیدن نوشته‌هاش"}
          - {left: "cooking", right: "آماده کردن غذا برای خوردن"}
          - {left: "painting", right: "کشیدن تصویر با قلم‌مو"}
          - {left: "running", right: "دویدن"}
          - {left: "video games", right: "بازی‌های ویدیویی"}
        status: "correct"
    feedback: "reading=کتاب‌خوانی، cooking=آشپزی، painting=نقاشی، running=دویدن، video games=بازی ویدیویی."
  en.a1.unit30.lesson01.exercise04.order_running_sentence:
    instruction: "کلمات رو برای گفتن «او هر روز صبح می‌دوه» مرتب کنین."
    accepted_answers: [{value: ["He", "goes", "running", "every", "morning"], status: "correct"}]
    feedback: "ترتیب درست He goes running every morning است."
  en.a1.unit30.lesson01.exercise05.write_hobby:
    instruction: "اسم سرگرمی‌ای رو بنویسین که یعنی آماده کردن غذا برای خوردن."
    accepted_answers:
      - {value: "cooking", status: "correct"}
      - {value: "Cooking", status: "correct"}
    feedback: "cooking یعنی آشپزی."

  en.a1.unit30.lesson02.exercise01.listen_frequency:
    instruction: "گوش کنین و کلمهٔ گفته‌شده رو انتخاب کنین."
    correct_option: "often"
    distractors: ["always", "sometimes", "never"]
    accepted_answers: [{value: "often", status: "correct"}]
    feedback: "often یعنی اغلب."
  en.a1.unit30.lesson02.exercise02.choose_never_meaning:
    instruction: "کدوم کلمه یعنی صفر بار، هیچ‌وقت؟"
    correct_option: "never"
    distractors: ["always", "often", "rarely"]
    accepted_answers: [{value: "never", status: "correct"}]
    feedback: "never یعنی هرگز."
  en.a1.unit30.lesson02.exercise03.choose_most_frequent:
    instruction: "کدوم کلمه یعنی همیشه، صد در صد؟"
    correct_option: "always"
    distractors: ["sometimes", "rarely", "never"]
    accepted_answers: [{value: "always", status: "correct"}]
    feedback: "always یعنی همیشه."
  en.a1.unit30.lesson02.exercise04.order_frequency_sentence:
    instruction: "کلمات رو برای گفتن «او اغلب برای خانواده‌اش شام می‌پزه» مرتب کنین."
    accepted_answers: [{value: ["She", "often", "cooks", "dinner", "for", "her", "family"], status: "correct"}]
    feedback: "ترتیب درست She often cooks dinner for her family است -- often قبل از فعل اصلی cooks میاد."
  en.a1.unit30.lesson02.exercise05.translate_free_time_question:
    instruction: "ترجمه کنین: «توی اوقات فراغتت چیکار می‌کنی؟»"
