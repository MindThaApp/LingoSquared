      - {value: "Despite the distractions, Daniel finishes his report on time", status: "correct"}
    feedback: "متن می‌گه: Despite the distractions, Daniel finishes his report on time."
  en.b1.unit12.lesson02.exercise05.write_despite_report:
    instruction: "بنویسین که با وجود حواس‌پرتی‌ها، دنیل گزارشش رو سر وقت تموم می‌کنه."
    accepted_answers:
      - {value: "Despite the distractions, Daniel finishes his report on time.", status: "correct"}
      - {value: "Despite the distractions, Daniel finishes his report on time", status: "correct"}
