  en.b1.unit12.lesson04.exercise06.speak_concession_dialogue:
    instruction: "به نقش لیلا، با صدای بلند به میا جواب بدین."
    accepted_answers:
      - {value: "Despite our different preferences, we finish everything on time.", status: "correct"}
