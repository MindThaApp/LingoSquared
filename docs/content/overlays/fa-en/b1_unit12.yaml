  en.b1.unit12.lesson01.concession_vocabulary: {title: "although، despite و however"}
  en.b1.unit12.lesson02.concession_clauses: {title: "although، despite و یک جملهٔ کامل"}
  en.b1.unit12.lesson03.reading_where_to_work: {title: "متن: کجا کار کنیم"}
  en.b1.unit12.lesson04.the_workplace_debate_dialogue: {title: "نکتهٔ خوبیه، however..."}

teaching:
  en.b1.unit12.lesson01.teach.although: {title: "although", gloss: "با این که، اگرچه", note: "although یک جملهٔ کامل رو معرفی می‌کنه که با ادامهٔ جمله در تضاده.", example_gloss: "با این که اتاق کار ساکته، میا ترجیح می‌ده از خونه کار کنه."}
  en.b1.unit12.lesson01.teach.even_though: {title: "even though", gloss: "با این که (تأکید بیشتر)", note: "even though یه تضاد قوی‌تر از although رو نشون می‌ده.", example_gloss: "با این که آپارتمانش کوچیکه، لیلا تمرکزش رو حفظ می‌کنه."}
  en.b1.unit12.lesson01.teach.despite: {title: "despite", gloss: "با وجود، علی‌رغم", note: "despite قبل از یه اسم یا فعل با ing میاد، نه یه جملهٔ کامل.", example_gloss: "با وجود حواس‌پرتی‌ها، دنیل گزارشش رو سر وقت تموم می‌کنه."}
  en.b1.unit12.lesson01.teach.however: {title: "however", gloss: "با این حال، اما", note: "however یه جملهٔ جدید و جدا رو شروع می‌کنه.", example_gloss: "اتاق کار ساکته. با این حال، میا ترجیح می‌ده از خونه کار کنه."}
  en.b1.unit12.lesson01.teach.valid_point: {title: "valid point", gloss: "نکتهٔ درست، حرف منطقی", note: "valid point یعنی حرفی که کسی می‌زنه و منطقیه.", example_gloss: "این یه نکتهٔ درسته دربارهٔ تمرکز."}
  en.b1.unit12.lesson01.teach.convince: {title: "convince", gloss: "متقاعد کردن", note: "convince یعنی کسی رو راضی کنین که با شما موافقت کنه.", example_gloss: "لیلا سعی کرد میا رو متقاعد کنه که برگرده اتاق کار."}

  en.b1.unit12.lesson02.teach.office_quiet_home: {title: "Although the office is quiet, Mia prefers working from home.", gloss: "با این که اتاق کار ساکته، میا ترجیح می‌ده از خونه کار کنه.", note: "بعد از *although* یه جملهٔ کامل میاد: *the office is quiet*."}
  en.b1.unit12.lesson02.teach.distractions_report: {title: "Despite the distractions, Daniel finishes his report on time.", gloss: "با وجود حواس‌پرتی‌ها، دنیل گزارشش رو سر وقت تموم می‌کنه.", note: "بعد از *despite* یه اسم میاد، نه یه جملهٔ کامل: *the distractions*."}
  en.b1.unit12.lesson02.teach.grammar_concession: {title: "بیان تضاد با although، despite و however", gloss: "با این که اتاق کار ساکته، میا خونه رو ترجیح می‌ده. با وجود حواس‌پرتی‌ها، دنیل گزارشش رو تموم می‌کنه.", note: "although و even though قبل از یه جملهٔ کامل میان. despite قبل از یه اسم یا فعل با ing میاد، نه جمله. however یه جملهٔ جدید رو بعد از نقطه یا نقطه‌ویرگول شروع می‌کنه."}

  en.b1.unit12.lesson03.teach.flexibility: {title: "flexibility", gloss: "انعطاف‌پذیری", note: "flexibility یعنی توانایی راحت عوض کردن برنامه یا روش کار.", example_gloss: "میا و لیلا هر دو موافق‌ان که انعطاف‌پذیری مهمه."}
  en.b1.unit12.lesson03.teach.teamwork: {title: "teamwork", gloss: "کار تیمی", note: "teamwork یعنی با هم کار کردن آدم‌ها برای رسیدن به یه هدف.", example_gloss: "لیلا فکر می‌کنه اتاق کار، کار تیمی بهتری می‌سازه."}
  en.b1.unit12.lesson03.teach.reading_passage: {title: "متن: کجا کار کنیم", gloss: "میا و لیلا دربارهٔ این که کجا کار کنن اختلاف نظر دارن. میا از خونه کار می‌کنه چون ساکت و راحته. با این که دلش برای همکاراش تنگ می‌شه، توی خونه کار بیشتری انجام می‌ده. لیلا اتاق کار رو ترجیح می‌ده. با وجود سروصدا، دوست داره سر استراحت با همکارها صحبت کنه. با این که میا نکتهٔ درستی دربارهٔ تمرکز می‌گه، لیلا بازم فکر می‌کنه اتاق کار، کار تیمی بهتری می‌سازه. با این حال، هر دو موافق‌ان که انعطاف‌پذیری مهمه.", note: "این متن تضاد رو با although، despite، even though و however نشون می‌ده."}

  en.b1.unit12.lesson04.teach.q_although_nice_home: {title: "حرف میا", gloss: "میا می‌گه لیلا، با این که اتاق کار خوبه، من توی خونه کار بیشتری انجام می‌دم.", note: "*although* اینجا یه جملهٔ کامل رو معرفی می‌کنه: *the office is nice*."}
  en.b1.unit12.lesson04.teach.a_despite_noise_breaks: {title: "جواب لیلا", gloss: "لیلا می‌گه می‌فهمم، ولی با وجود سروصدا، واقعاً از صحبت با آدم‌ها سر استراحت لذت می‌برم.", note: "*despite the noise* یه اسم بعد از despite هست، نه یه جمله."}
  en.b1.unit12.lesson04.teach.q_valid_point_however: {title: "جواب میا", gloss: "میا می‌گه این یه نکتهٔ درسته. با این حال، بازم فکر می‌کنم تنها بهتر تمرکز می‌کنم.", note: "*however* یه جملهٔ جدا رو بعد از نقطه شروع می‌کنه."}
  en.b1.unit12.lesson04.teach.a_even_though_convince: {title: "حرف لیلا", gloss: "لیلا می‌گه با این که اتاق کار رو ترجیح می‌دم، نمی‌تونم تو رو متقاعد کنم نظرت رو عوض کنی، نه؟", note: "*even though* یه تضاد قوی‌تر رو نشون می‌ده."}
  en.b1.unit12.lesson04.teach.q_however_flexibility: {title: "جواب میا", gloss: "میا می‌گه احتمالاً نه! با این حال، می‌تونیم موافقت کنیم که انعطاف‌پذیری از همه چیز مهم‌تره.", note: "*however* اینجا هم یه جملهٔ جدید رو شروع می‌کنه."}
  en.b1.unit12.lesson04.teach.a_despite_preferences_time: {title: "جمع‌بندی لیلا", gloss: "لیلا می‌گه با وجود ترجیح‌های متفاوتمون، همه‌چیز رو سر وقت تموم می‌کنیم.", note: "*despite our different preferences* یه اسم بعد از despite هست."}

exercises:
  en.b1.unit12.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شده انتخاب کنین."
    correct_option: "convince"
    distractors: ["although", "despite", "however"]
    accepted_answers: [{value: "convince", status: "correct"}]
    feedback: "convince یعنی متقاعد کردن."
  en.b1.unit12.lesson01.exercise02.choose_despite:
    instruction: "کدام کلمه یه تضاد رو با یه اسم یا فعل با ing نشون می‌ده، نه یه جملهٔ کامل؟"
    correct_option: "despite"
    distractors: ["although", "however", "even though"]
    accepted_answers: [{value: "despite", status: "correct"}]
    feedback: "despite یعنی با وجود، علی‌رغم."
  en.b1.unit12.lesson01.exercise03.choose_however:
    instruction: "کدام کلمه یه تضاد رو به‌صورت یه جملهٔ جدا نشون می‌ده؟"
    correct_option: "however"
    distractors: ["despite", "although", "even though"]
    accepted_answers: [{value: "however", status: "correct"}]
    feedback: "however یعنی با این حال، اما."
  en.b1.unit12.lesson01.exercise04.match_concession_words:
    instruction: "هر معنی را به کلمه یا عبارت انگلیسی درست وصل کنید."
    accepted_answers: [{value: [{left: "although", right: "introduces a contrast using a full clause inside one sentence"}, {left: "even though", right: "emphasizes a stronger contrast than although"}, {left: "despite", right: "introduces a contrast using a noun or -ing form, not a full clause"}, {left: "however", right: "introduces a contrast as a separate sentence"}, {left: "valid point", right: "a reasonable point someone makes"}, {left: "convince", right: "to persuade someone to agree with you"}], status: "correct"}]
    feedback: "although=با این که، even though=با این که (تأکید بیشتر)، despite=با وجود، however=با این حال، valid point=نکتهٔ درست، convince=متقاعد کردن."
  en.b1.unit12.lesson01.exercise05.write_convince:
    instruction: "کلمه‌ای را بنویسین که یعنی کسی را متقاعد کنین که با شما موافقت کنه."
    accepted_answers:
      - {value: "convince", status: "correct"}
      - {value: "Convince", status: "correct"}
    feedback: "convince یعنی متقاعد کردن."

  en.b1.unit12.lesson02.exercise01.choose_although_clause:
    instruction: "کدام جمله از although برای معرفی یه جملهٔ کامل تضاد استفاده می‌کنه؟"
    correct_option: "Although the office is quiet, Mia prefers working from home."
    distractors: ["Despite the distractions, Daniel finishes his report on time.", "The office is quiet. However, Mia prefers home.", "Mia works from home because it is quiet."]
    accepted_answers: [{value: "Although the office is quiet, Mia prefers working from home.", status: "correct"}]
    feedback: "Although the office is quiet یعنی با این که اتاق کار ساکته."
  en.b1.unit12.lesson02.exercise02.choose_despite_noun:
    instruction: "کدام جمله از despite قبل از یه عبارت اسمی استفاده می‌کنه؟"
    correct_option: "Despite the distractions, Daniel finishes his report on time."
    distractors: ["Although the office is quiet, Mia prefers working from home.", "The office is quiet. However, Mia prefers home.", "Daniel finishes his report because he stays focused."]
    accepted_answers: [{value: "Despite the distractions, Daniel finishes his report on time.", status: "correct"}]
    feedback: "Despite the distractions یعنی با وجود حواس‌پرتی‌ها."
  en.b1.unit12.lesson02.exercise03.order_although_office:
    instruction: "کلمات را برای گفتن «با این که اتاق کار ساکته، میا ترجیح می‌ده از خونه کار کنه.» مرتب کنین."
    accepted_answers: [{value: ["Although", "the", "office", "is", "quiet", "Mia", "prefers", "working", "from", "home"], status: "correct"}]
    feedback: "ترتیب درست: Although the office is quiet, Mia prefers working from home."
  en.b1.unit12.lesson02.exercise04.reply_why_finish_on_time:
    instruction: "دنیل با وجود حواس‌پرتی‌ها چیکار می‌کنه؟"
    accepted_answers:
