  en.b1.unit12.lesson04.exercise04.order_despite_preferences:
    instruction: "کلمات را برای گفتن «با وجود ترجیح‌های متفاوتمون، همه‌چیز رو سر وقت تموم می‌کنیم.» مرتب کنین."
    accepted_answers: [{value: ["Despite", "our", "different", "preferences", "we", "finish", "everything", "on", "time"], status: "correct"}]
    feedback: "ترتیب درست: Despite our different preferences, we finish everything on time."
  en.b1.unit12.lesson04.exercise05.reply_as_mia:
    instruction: "لیلا می‌گه: می‌فهمم، ولی با وجود سروصدا، واقعاً از صحبت با آدم‌ها سر استراحت لذت می‌برم."
    accepted_answers:
      - {value: "That is a valid point. However, I still think I focus better alone.", status: "correct"}
      - {value: "That is a valid point. However, I still think I focus better alone", status: "correct"}
