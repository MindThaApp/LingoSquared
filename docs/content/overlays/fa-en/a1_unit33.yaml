    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "drive", "my", "car", "to", "work."], status: "correct"}]
    feedback: "ترتیب درست: I drive my car to work. -- برای ماشین فعل drive به‌کار می‌ره، نه take."
