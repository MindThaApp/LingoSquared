review: {status: "reviewed", required_next_reviewer: null, notes: "New overlay against the shared English realization unit33 (transportation), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start, every teaching card that has a realization example: got a matching example_gloss:. Two new contrastive-grammar points, deliberately different from ones already used in this direction (frequency-adverb placement, gerund-after-like, do-support in questions, adjective-before-noun/ezafe, wear/zadan mismatch): (1) English's dummy/expletive subject it with duration verbs (It takes twenty minutes) has no equivalent in Persian, where the time period itself is the grammatical subject of طول کشیدن (بیست دقیقه طول می‌کشه -- literally twenty minutes takes-length, no it); (2) English lexicalizes a different verb per transport mode (take the bus/train, drive a car, ride a bike, walk with no object) while Persian generalizes with با + noun + رفتن (go by/with X) for any vehicle, so Persian speakers must memorize the English verb-mode pairing rather than reuse one pattern. Strong sibling-isolation rule applied -- nl-en/prs-en overlays for this same unit were not opened while authoring this file. Needs the mandatory fresh-context review before shipping.\n\nfa-en review 2026-10-19: full checklist. 9 fixes: notes no longer call take/drive/ride auxiliaries, say do starts the question, or say take is never used for a car (car note + reading note); dialogue_line4 gloss (asks Leila back, not about her); 3 untaught distractors replaced (When, slow/traffic, neither/same time); missing ZWNJ in می‌رم/می‌ره/می‌ری (17 spots, 1 fix)."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit33.transportation: {title: "رفت‌وآمد توی شهر"}

lessons:
  en.a1.unit33.lesson01.transport_vocabulary: {title: "راه‌های رفت‌وآمد"}
  en.a1.unit33.lesson02.describing_commutes: {title: "چطور می‌رین سر کار"}
  en.a1.unit33.lesson03.dialogue_commute_talk: {title: "گفتگو: صحبت دربارهٔ رفت‌وآمد"}
  en.a1.unit33.lesson04.two_commuters: {title: "متن: دو مسافر روزانه"}

teaching:
  en.a1.unit33.lesson01.teach.bus: {title: "bus", gloss: "اتوبوس", note: "bus یعنی اتوبوس. با فعل take میاد: take the bus -- توجه: فارسی برای هر وسیلهٔ نقلیه از یه ساختار یکسان استفاده می‌کنه (با اتوبوس رفتن)، ولی انگلیسی برای هر وسیله یه فعل جدا داره (take، drive، ride)، که باید جدا جدا یاد گرفته بشن.", example_gloss: "من با اتوبوس می‌رم."}
  en.a1.unit33.lesson01.teach.train: {title: "train", gloss: "قطار", note: "train یعنی قطار. مثل bus، با فعل take میاد: take the train.", example_gloss: "اون با قطار می‌ره."}
  en.a1.unit33.lesson01.teach.car: {title: "car", gloss: "ماشین", note: "car یعنی ماشین. وقتی خودتون پشت فرمونین، فعل drive میاد: drive my car -- نه take.", example_gloss: "من با ماشینم می‌رم سر کار."}
  en.a1.unit33.lesson01.teach.bike: {title: "bike", gloss: "دوچرخه", note: "bike یعنی دوچرخه. فعلش هم فرق داره: ride a bike (نه take و نه drive).", example_gloss: "من هر روز با دوچرخه‌ام سر کار می‌رم."}
  en.a1.unit33.lesson01.teach.walk: {title: "walk", gloss: "پیاده رفتن", note: "walk یعنی پیاده رفتن. اینجا فعل دیگه‌ای مثل take/drive/ride لازم نیست، چون walk خودش فعله: I walk to work.", example_gloss: "من پیاده می‌رم سر کار."}

  en.a1.unit33.lesson02.teach.how_get_to: {title: "How do you get to work?", gloss: "چطور می‌ری سر کار؟", note: "توی این سؤال بعد از How فعل کمکی do میاد، چون فعل اصلی get هست. فارسی برای این سؤال به فعل کمکی نیاز نداره."}
  en.a1.unit33.lesson02.teach.usually: {title: "usually", gloss: "معمولاً", note: "usually یعنی معمولاً. قید تکرار توی جملهٔ انگلیسی معمولاً بین فاعل و فعل اصلی میاد: I usually take the bus -- نه بعد از فعل مثل بعضی جاهای فارسی.", example_gloss: "من معمولاً با اتوبوس می‌رم."}
  en.a1.unit33.lesson02.teach.minutes: {title: "minutes", gloss: "دقیقه", note: "minutes یعنی دقیقه. جملهٔ It takes twenty minutes یه ساختار خاصه: it اینجا فاعل مجازیه و معنی مستقلی نداره، فقط جای فاعل رو پر می‌کنه. فارسی چنین فاعل مجازی‌ای نداره -- می‌گیم «بیست دقیقه طول می‌کشه»، یعنی خودِ «بیست دقیقه» فاعل جمله‌س، نه یه کلمهٔ اضافه مثل it.", example_gloss: "بیست دقیقه طول می‌کشه."}
  en.a1.unit33.lesson02.teach.late: {title: "late", gloss: "دیر", note: "late یعنی دیر (رسیدن بعد از زمان موردانتظار). The bus is often late.", example_gloss: "اتوبوس اغلب دیر می‌رسه."}
  en.a1.unit33.lesson02.teach.faster: {title: "faster", gloss: "سریع‌تر", note: "faster یعنی سریع‌تر، صفت تفضیلی fast با پسوند -er. با than برای مقایسه میاد: faster than the bus.", example_gloss: "قطار از اتوبوس سریع‌تره."}

  en.a1.unit33.lesson03.teach.dialogue_line1: {title: "سؤال لیلا", gloss: "لیلا می‌پرسه دنیل چطور می‌ره سر کار.", note: "شروع گفتگو با سؤال How do you get to work؟"}
  en.a1.unit33.lesson03.teach.dialogue_line2: {title: "جواب دنیل", gloss: "دنیل می‌گه معمولاً با اتوبوس می‌ره. حدود بیست دقیقه طول می‌کشه.", note: "دو نکته با هم: فعل take برای اتوبوس، و فاعل مجازی it توی It takes about twenty minutes."}
  en.a1.unit33.lesson03.teach.dialogue_line3: {title: "سؤال لیلا", gloss: "لیلا می‌پرسه ازش خوشش میاد؟", note: "سؤال بله/خیر با Do."}
  en.a1.unit33.lesson03.teach.dialogue_line4: {title: "جواب دنیل", gloss: "دنیل می‌گه بد نیست، ولی اغلب دیر می‌رسه. بعد از لیلا هم می‌پرسه: تو چی؟", note: "How about you؟ یعنی «تو چی؟» -- یه سؤال کوتاه برای برگردوندن سؤال."}
  en.a1.unit33.lesson03.teach.dialogue_line5: {title: "جواب لیلا", gloss: "لیلا می‌گه با ماشین می‌ره. سریع‌تره، ولی پارک‌کردن سخته.", note: "اینجا فعل drive برای ماشین به‌کار رفته، نه take."}

  en.a1.unit33.lesson04.teach.reading_passage: {title: "متن: لیلا و دنیل", gloss: "لیلا هر روز با ماشین می‌ره سر کار. حدود پونزده دقیقه طول می‌کشه، ولی پارک‌کردن نزدیک دفترش سخته. دنیل ماشین نداره، پس با اتوبوس می‌ره. اتوبوسش بیست دقیقه طول می‌کشه و بعضی‌وقتا دیر می‌رسه، ولی لازم نیست نگران پارک باشه.", note: "این متن همهٔ کلمات این درس رو توی جملات واقعی به‌کار می‌بره -- توجه کنین: برای اتوبوس و قطار take میاد و وقتی خودتون رانندگی می‌کنین drive."}

exercises:
  en.a1.unit33.lesson01.exercise01.listen_mode:
    instruction: "گوش کنین و وسیلهٔ نقلیه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "train"
    distractors: ["bus", "car", "bike", "walk"]
    accepted_answers: [{value: "train", status: "correct"}]
    feedback: "train یعنی قطار."
  en.a1.unit33.lesson01.exercise02.choose_fastest:
    instruction: "معمولاً برای مسافت طولانی توی شهر کدوم وسیله سریع‌تره؟"
    correct_option: "car"
    distractors: ["bike", "walk", "bus"]
    accepted_answers: [{value: "car", status: "correct"}]
    feedback: "car (ماشین) معمولاً برای مسافت طولانی توی شهر سریع‌تره."
  en.a1.unit33.lesson01.exercise03.match_modes:
    instruction: "هر واژه یا عبارت انگلیسی رو به توضیح فارسی درستش وصل کنین."
