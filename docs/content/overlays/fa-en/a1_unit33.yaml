      - {left: "train", right: "وسیله‌ای که روی ریل حرکت می‌کنه"}
      - {left: "car", right: "وسیله‌ای که خودتون می‌رونین"}
      - {left: "bike", right: "وسیله‌ای که با رکاب زدن حرکت می‌کنه"}
      - {left: "walk", right: "رفتن بدون هیچ وسیلهٔ نقلیه‌ای"}
    accepted_answers:
