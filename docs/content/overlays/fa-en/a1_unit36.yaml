review: {status: "reviewed", required_next_reviewer: null, notes: "New overlay against the shared English realization unit36 (education/studies), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1, every teaching card with a realization example: has a matching example_gloss:. Contrastive-grammar points, deliberately different from ones already used in this direction: (1) the English present continuous for ongoing study (What are you studying? / I'm learning how to use my camera) maps to Persian's داشتن-progressive (دارم یاد می‌گیرم), not the simple present -- the am/is/are + -ing structure itself is new and the note ties it to the familiar دارم construction; (2) English 'twice a week' uses the indefinite article a to mean 'per' (twice A week = هفته‌ای دو بار) -- a genuinely untranslatable use of the article, since Persian marks it with ـی on the time word instead; also continues the fixed-collocation thread (take a class, do homework, study FOR a test -- the preposition for has no counterpart in «برای امتحان خوندن»'s literal shape and must be memorized). matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, NOT translated Persian lefts -- deliberate, grading-motivated deviation from the older X-en overlay pattern (the compiler copies prompt.pairs from the realization only, so a translated-left answer key can never grade correct; verified against compile output + backend canonical_pairs() this session). Do not 'fix' this back to translated lefts in review. Strong sibling-isolation rule applied -- nl-en/prs-en overlays for this unit were not consulted for content. Needs the mandatory fresh-context review before shipping.\n\nfa-en review 2026-10-19: realization + overlay read in full. 11 fixes: class/course matching rights (example fragment -> definition; register); take a class glossed کلاس رفتن/برداشتن instead of ambiguous کلاس گرفتن (lesson title too); translate prompt tightened to «داری چی درس می‌خونی؟» (was ambiguous with reading); untaught distractors replaced (Spanish before lesson04, once, online, English, moving to Spain); I'm-contraction and subject variants added to both open tasks. Native flag: کلاس رفتن/برداشتن for take a class. Shared-en r2 review 2026-10-22: answer lists and wording follow the realization change (dialogue line 6 'much better' -> 'better' (unnatural with 'learning how to use'), media transcript and overlay glosses updated)."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit36.education: {title: "صحبت دربارهٔ درس و کلاس"}

lessons:
  en.a1.unit36.lesson01.education_vocabulary: {title: "کلاس و یادگیری"}
  en.a1.unit36.lesson02.taking_a_class: {title: "کلاس رفتن"}
  en.a1.unit36.lesson03.dialogue_photography_class: {title: "گفتگو: کلاس عکاسی"}
  en.a1.unit36.lesson04.learning_something_new: {title: "متن: یادگیری یه چیز جدید"}

teaching:
  en.a1.unit36.lesson01.teach.class: {title: "class", gloss: "کلاس", note: "*class* یعنی کلاس، یه جلسهٔ منظم یادگیری. *I have a class* -- کلاس دارم.", example_gloss: "من هر سه‌شنبه عصر کلاس دارم."}
  en.a1.unit36.lesson01.teach.course: {title: "course", gloss: "دوره", note: "*course* یعنی دوره: یه مجموعه کلاس دربارهٔ یه موضوع. دقت کنین: *He is taking a course* -- زمان حال استمراری با *is + -ing*، مثل «داره یه دوره می‌گذرونه» با «داره» توی فارسی.", example_gloss: "اون امسال داره یه دورهٔ کامپیوتر می‌گذرونه."}
  en.a1.unit36.lesson01.teach.student: {title: "student", gloss: "دانشجو / شاگرد", note: "*student* یعنی دانشجو یا شاگرد، هر کسی که داره جایی درس می‌خونه.", example_gloss: "اون دانشجوی کالج محلیه."}
  en.a1.unit36.lesson01.teach.homework: {title: "homework", gloss: "تکلیف", note: "*homework* یعنی تکلیف. فعلش *do* هست: *do my homework* -- انجام دادن تکلیف؛ نه *make* و نه *write*.", example_gloss: "من تکلیفم رو بعد از شام انجام می‌دم."}
  en.a1.unit36.lesson01.teach.subject: {title: "subject", gloss: "درس / موضوع درسی", note: "*subject* یعنی درس یا موضوع درسی، مثل ریاضی یا تاریخ. *favorite* یعنی موردعلاقه.", example_gloss: "ریاضی درس موردعلاقهٔ منه."}
  en.a1.unit36.lesson01.teach.test: {title: "test", gloss: "امتحان", note: "*test* یعنی امتحان. برای روز هفته حرف اضافهٔ *on* میاد: *a test on Friday* -- امتحان روز جمعه.", example_gloss: "ما جمعه امتحان داریم."}

  en.a1.unit36.lesson02.teach.take_a_class: {title: "take a class", gloss: "کلاس رفتن / کلاس برداشتن", note: "*take a class* یعنی سر یه کلاس رفتن یا توی یه کلاس ثبت‌نام کردن. فعل *take* اینجا «بردن» نیست -- یکی دیگه از ترکیب‌های ثابتیه که باید همون‌طوری حفظ بشه.", example_gloss: "من هر سه‌شنبه عصر کلاس می‌رم."}
  en.a1.unit36.lesson02.teach.do_homework: {title: "do homework", gloss: "تکلیف انجام دادن", note: "*do homework* یعنی تکلیف انجام دادن. با فاعل سوم‌شخص *do* به *does* تبدیل می‌شه: *He does his homework*.", example_gloss: "اون تکلیفش رو بعد از شام انجام می‌ده."}
  en.a1.unit36.lesson02.teach.study_for_a_test: {title: "study for a test", gloss: "برای امتحان خوندن", note: "*study for a test* یعنی برای امتحان درس خوندن. حرف اضافه‌ش *for* هست و جزء همون ترکیب ثابته: *study for*، نه *study to*.", example_gloss: "من هر جمعه برای امتحان درس می‌خونم."}
  en.a1.unit36.lesson02.teach.community_college: {title: "community college", gloss: "کالج محلی", note: "*community college* یعنی کالج محلی: یه مدرسهٔ آمریکایی که خیلی از بزرگسال‌ها کنار کارشون پاره‌وقت اونجا کلاس می‌گیرن.", example_gloss: "اون توی یه کالج محلی درس می‌خونه."}
  en.a1.unit36.lesson02.teach.in_the_evening: {title: "in the evening", gloss: "عصر / شب", note: "*in the evening* یعنی موقع عصر. برای بخش‌های روز حرف اضافهٔ *in* میاد: *in the morning*، *in the evening*.", example_gloss: "کلاس من عصره."}
  en.a1.unit36.lesson02.teach.what_are_you_studying_question: {title: "What are you studying?", gloss: "چی داری می‌خونی؟", note: "*What are you studying?* -- زمان حال استمراری با *are + -ing* ساخته می‌شه، درست مثل ساختار «داری ... می‌خونی» با «داشتن» توی فارسی. برای کاری که همین دوره داره انجام می‌شه."}

  en.a1.unit36.lesson03.teach.dialogue_line1: {title: "سؤال دنیل", gloss: "دنیل می‌پرسه امروز بعد از کار برنامه‌ای داره؟", note: "*Are you doing anything...?* -- سؤال حال استمراری با *are* شروع می‌شه. *anything* توی سؤال یعنی «کاری / چیزی»."}
  en.a1.unit36.lesson03.teach.dialogue_line2: {title: "جواب میا", gloss: "میا می‌گه آره، امشب کلاس عکاسی داره.", note: "*tonight* یعنی امشب. *a photography class* -- اسم *photography* مثل صفت قبل از *class* اومده."}
  en.a1.unit36.lesson03.teach.dialogue_line3: {title: "سؤال دنیل", gloss: "دنیل می‌گه چه خوب! و می‌پرسه کجا کلاس می‌ره.", note: "*Where do you take it?* -- سؤال با *where* یعنی کجا، و *it* به کلاس برمی‌گرده."}
  en.a1.unit36.lesson03.teach.dialogue_line4: {title: "جواب میا", gloss: "میا می‌گه توی کالج محلی مرکز شهر. هفته‌ای دو بار.", note: "*twice a week* یعنی هفته‌ای دو بار -- حرف تعریف *a* اینجا معنی «هر / ـی» می‌ده، مثل «هفته‌ای» توی فارسی. این کاربرد *a* رو نمی‌شه کلمه‌به‌کلمه ترجمه کرد."}
  en.a1.unit36.lesson03.teach.dialogue_line5: {title: "سؤال دنیل", gloss: "دنیل می‌پرسه تا حالا چطور پیش رفته؟", note: "*How's it going so far?* یعنی «تا الان چطور پیش می‌ره؟» -- یه سؤال رایج برای احوال‌پرسی از یه کار در جریان."}
  en.a1.unit36.lesson03.teach.dialogue_line6: {title: "جواب میا", gloss: "میا می‌گه خیلی دوستش داره و داره یاد می‌گیره بهتر از دوربینش استفاده کنه.", note: "*I'm learning how to use my camera* -- حال استمراری *I'm learning* یعنی «دارم یاد می‌گیرم»، و *how to* یعنی «طرزِ / چطور»."}
  en.a1.unit36.lesson03.teach.dialogue_line7: {title: "واکنش دنیل", gloss: "دنیل می‌گه عالیه! شاید میا یه وقت بتونه به اون هم یاد بده.", note: "*Maybe you can teach me sometime* -- *sometime* یعنی یه وقتی، یه زمانی در آینده."}

  en.a1.unit36.lesson04.teach.reading_passage: {title: "متن: سه همکار", gloss: "دنیل، لیلا و میا هر سه دارن بیرون از کار یه چیز جدید یاد می‌گیرن. دنیل دوشنبه‌شب‌ها یه دورهٔ کامپیوتر می‌گذرونه تا مهارت‌های جدیدی برای کارش یاد بگیره. لیلا داره اسپانیایی می‌خونه چون می‌خواد یه روزی بره سفر مکزیک. میا هفته‌ای دو بار توی کالج محلی کلاس عکاسی داره و همین الانش هم داره عکس‌های خیلی بهتری می‌گیره. بعضی‌وقتا سر ناهار با هم دربارهٔ کلاس‌هاشون حرف می‌زنن.", note: "دقت کنین به فرق سادهٔ *takes a course* (کار همیشگی) و استمراری *is studying* (کاری که این دوره در جریانه)."}

