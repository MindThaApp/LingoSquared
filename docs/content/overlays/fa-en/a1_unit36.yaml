review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit36 (education/studies), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1, every teaching card with a realization example: has a matching example_gloss:. Contrastive-grammar points, deliberately different from ones already used in this direction: (1) the English present continuous for ongoing study (What are you studying? / I'm learning how to use my camera) maps to Persian's داشتن-progressive (دارم یاد می‌گیرم), not the simple present -- the am/is/are + -ing structure itself is new and the note ties it to the familiar دارم construction; (2) English 'twice a week' uses the indefinite article a to mean 'per' (twice A week = هفته‌ای دو بار) -- a genuinely untranslatable use of the article, since Persian marks it with ـی on the time word instead; also continues the fixed-collocation thread (take a class, do homework, study FOR a test -- the preposition for has no counterpart in «برای امتحان خوندن»'s literal shape and must be memorized). matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, NOT translated Persian lefts -- deliberate, grading-motivated deviation from the older X-en overlay pattern (the compiler copies prompt.pairs from the realization only, so a translated-left answer key can never grade correct; verified against compile output + backend canonical_pairs() this session). Do not 'fix' this back to translated lefts in review. Strong sibling-isolation rule applied -- nl-en/prs-en overlays for this unit were not consulted for content. Needs the mandatory fresh-context review before shipping."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit36.education: {title: "صحبت دربارهٔ درس و کلاس"}

lessons:
  en.a1.unit36.lesson01.education_vocabulary: {title: "کلاس و یادگیری"}
  en.a1.unit36.lesson02.taking_a_class: {title: "کلاس گرفتن"}
  en.a1.unit36.lesson03.dialogue_photography_class: {title: "گفتگو: کلاس عکاسی"}
  en.a1.unit36.lesson04.learning_something_new: {title: "متن: یادگیری یه چیز جدید"}

teaching:
  en.a1.unit36.lesson01.teach.class: {title: "class", gloss: "کلاس", note: "*class* یعنی کلاس، یه جلسهٔ منظم یادگیری. *I have a class* -- کلاس دارم.", example_gloss: "من هر سه‌شنبه عصر کلاس دارم."}
  en.a1.unit36.lesson01.teach.course: {title: "course", gloss: "دوره", note: "*course* یعنی دوره: یه مجموعه کلاس دربارهٔ یه موضوع. دقت کنین: *He is taking a course* -- زمان حال استمراری با *is + -ing*، مثل «داره یه دوره می‌گذرونه» با «داره» توی فارسی.", example_gloss: "اون امسال داره یه دورهٔ کامپیوتر می‌گذرونه."}
  en.a1.unit36.lesson01.teach.student: {title: "student", gloss: "دانشجو / شاگرد", note: "*student* یعنی دانشجو یا شاگرد، هر کسی که داره جایی درس می‌خونه.", example_gloss: "اون دانشجوی کالج محلیه."}
  en.a1.unit36.lesson01.teach.homework: {title: "homework", gloss: "تکلیف", note: "*homework* یعنی تکلیف. فعلش *do* هست: *do my homework* -- انجام دادن تکلیف؛ نه *make* و نه *write*.", example_gloss: "من تکلیفم رو بعد از شام انجام می‌دم."}
  en.a1.unit36.lesson01.teach.subject: {title: "subject", gloss: "درس / موضوع درسی", note: "*subject* یعنی درس یا موضوع درسی، مثل ریاضی یا تاریخ. *favorite* یعنی موردعلاقه.", example_gloss: "ریاضی درس موردعلاقهٔ منه."}
  en.a1.unit36.lesson01.teach.test: {title: "test", gloss: "امتحان", note: "*test* یعنی امتحان. برای روز هفته حرف اضافهٔ *on* میاد: *a test on Friday* -- امتحان روز جمعه.", example_gloss: "ما جمعه امتحان داریم."}

  en.a1.unit36.lesson02.teach.take_a_class: {title: "take a class", gloss: "کلاس گرفتن / کلاس رفتن", note: "*take a class* یعنی کلاس گرفتن. فعل *take* اینجا «بردن» نیست -- یکی دیگه از ترکیب‌های ثابتیه که باید همون‌طوری حفظ بشه.", example_gloss: "من هر سه‌شنبه عصر کلاس می‌رم."}
  en.a1.unit36.lesson02.teach.do_homework: {title: "do homework", gloss: "تکلیف انجام دادن", note: "*do homework* یعنی تکلیف انجام دادن. با فاعل سوم‌شخص *do* به *does* تبدیل می‌شه: *He does his homework*.", example_gloss: "اون تکلیفش رو بعد از شام انجام می‌ده."}
  en.a1.unit36.lesson02.teach.study_for_a_test: {title: "study for a test", gloss: "برای امتحان خوندن", note: "*study for a test* یعنی برای امتحان درس خوندن. حرف اضافه‌ش *for* هست و جزء همون ترکیب ثابته: *study for*، نه *study to*.", example_gloss: "من هر جمعه برای امتحان درس می‌خونم."}
  en.a1.unit36.lesson02.teach.community_college: {title: "community college", gloss: "کالج محلی", note: "*community college* یعنی کالج محلی: یه مدرسهٔ آمریکایی که خیلی از بزرگسال‌ها کنار کارشون پاره‌وقت اونجا کلاس می‌گیرن.", example_gloss: "اون توی یه کالج محلی درس می‌خونه."}
  en.a1.unit36.lesson02.teach.in_the_evening: {title: "in the evening", gloss: "عصر / شب", note: "*in the evening* یعنی موقع عصر. برای بخش‌های روز حرف اضافهٔ *in* میاد: *in the morning*، *in the evening*.", example_gloss: "کلاس من عصره."}
  en.a1.unit36.lesson02.teach.what_are_you_studying_question: {title: "What are you studying?", gloss: "چی داری می‌خونی؟", note: "*What are you studying?* -- زمان حال استمراری با *are + -ing* ساخته می‌شه، درست مثل ساختار «داری ... می‌خونی» با «داشتن» توی فارسی. برای کاری که همین دوره داره انجام می‌شه."}

  en.a1.unit36.lesson03.teach.dialogue_line1: {title: "سؤال دنیل", gloss: "دنیل می‌پرسه امروز بعد از کار برنامه‌ای داره؟", note: "*Are you doing anything...?* -- سؤال حال استمراری با *are* شروع می‌شه. *anything* توی سؤال یعنی «کاری / چیزی»."}
  en.a1.unit36.lesson03.teach.dialogue_line2: {title: "جواب میا", gloss: "میا می‌گه آره، امشب کلاس عکاسی داره.", note: "*tonight* یعنی امشب. *a photography class* -- اسم *photography* مثل صفت قبل از *class* اومده."}
  en.a1.unit36.lesson03.teach.dialogue_line3: {title: "سؤال دنیل", gloss: "دنیل می‌گه چه خوب! و می‌پرسه کجا کلاس می‌ره.", note: "*Where do you take it?* -- سؤال با *where* یعنی کجا، و *it* به کلاس برمی‌گرده."}
  en.a1.unit36.lesson03.teach.dialogue_line4: {title: "جواب میا", gloss: "میا می‌گه توی کالج محلی مرکز شهر. هفته‌ای دو بار.", note: "*twice a week* یعنی هفته‌ای دو بار -- حرف تعریف *a* اینجا معنی «هر / ـی» می‌ده، مثل «هفته‌ای» توی فارسی. این کاربرد *a* رو نمی‌شه کلمه‌به‌کلمه ترجمه کرد."}
  en.a1.unit36.lesson03.teach.dialogue_line5: {title: "سؤال دنیل", gloss: "دنیل می‌پرسه تا حالا چطور پیش رفته؟", note: "*How's it going so far?* یعنی «تا الان چطور پیش می‌ره؟» -- یه سؤال رایج برای احوال‌پرسی از یه کار در جریان."}
  en.a1.unit36.lesson03.teach.dialogue_line6: {title: "جواب میا", gloss: "میا می‌گه خیلی دوستش داره و داره یاد می‌گیره خیلی بهتر از دوربینش استفاده کنه.", note: "*I'm learning how to use my camera* -- حال استمراری *I'm learning* یعنی «دارم یاد می‌گیرم»، و *how to* یعنی «طرزِ / چطور»."}
  en.a1.unit36.lesson03.teach.dialogue_line7: {title: "واکنش دنیل", gloss: "دنیل می‌گه عالیه! شاید یه وقت بتونه به اونم یاد بده.", note: "*Maybe you can teach me sometime* -- *sometime* یعنی یه وقتی، یه زمانی در آینده."}

  en.a1.unit36.lesson04.teach.reading_passage: {title: "متن: سه همکار", gloss: "دنیل، لیلا و میا هر سه دارن بیرون از کار یه چیز جدید یاد می‌گیرن. دنیل دوشنبه‌شب‌ها یه دورهٔ کامپیوتر می‌گذرونه تا مهارت‌های جدیدی برای کارش یاد بگیره. لیلا داره اسپانیایی می‌خونه چون می‌خواد یه روزی بره سفر مکزیک. میا هفته‌ای دو بار توی کالج محلی کلاس عکاسی داره و همین الانش هم داره عکس‌های خیلی بهتری می‌گیره. بعضی‌وقتا سر ناهار با هم دربارهٔ کلاس‌هاشون حرف می‌زنن.", note: "دقت کنین به فرق سادهٔ *takes a course* (کار همیشگی) و استمراری *is studying* (کاری که این دوره در جریانه)."}

exercises:
  en.a1.unit36.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "homework"
    distractors: ["class", "course", "student", "test"]
    accepted_answers: [{value: "homework", status: "correct"}]
    feedback: "*homework* یعنی تکلیف."
  en.a1.unit36.lesson01.exercise02.choose_student_meaning:
    instruction: "کدوم کلمه یعنی کسی که داره توی مدرسه یا کلاس درس می‌خونه؟"
    correct_option: "student"
    distractors: ["subject", "test", "homework"]
    accepted_answers: [{value: "student", status: "correct"}]
    feedback: "*student* یعنی دانشجو یا شاگرد."
  en.a1.unit36.lesson01.exercise03.match_education_words:
    instruction: "هر توضیح انگلیسی رو به کلمهٔ درستش وصل کنین."
    accepted_answers: [{value: [{left: "a regular meeting where you learn something, often once a week", right: "class"}, {left: "a series of classes on one subject, sometimes with a certificate at the end", right: "course"}, {left: "a person who is learning at a school or class", right: "student"}, {left: "school work you do at home, not in class", right: "homework"}, {left: "a topic you study, like math or history", right: "subject"}, {left: "a short exam that checks what you have learned", right: "test"}], status: "correct"}]
    feedback: "class=کلاس، course=دوره، student=دانشجو، homework=تکلیف، subject=درس، test=امتحان."
  en.a1.unit36.lesson01.exercise04.order_subject_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["Math", "is", "my", "favorite", "subject."], status: "correct"}]
    feedback: "ترتیب درست: *Math is my favorite subject.* -- صفت *favorite* قبل از اسم میاد."
  en.a1.unit36.lesson01.exercise05.write_subject_word:
    instruction: "کلمه‌ای رو بنویسین که یعنی موضوعی که می‌خونین، مثل ریاضی یا تاریخ."
    accepted_answers: [{value: "subject", status: "correct"}]
    feedback: "*subject* یعنی درس یا موضوع درسی."

  en.a1.unit36.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "community college"
    distractors: ["take a class", "do homework", "study for a test"]
    accepted_answers: [{value: "community college", status: "correct"}]
    feedback: "*community college* یعنی کالج محلی."
  en.a1.unit36.lesson02.exercise02.choose_community_college_meaning:
    instruction: "کدوم عبارت یعنی مدرسه‌ای که خیلی از بزرگسال‌ها پاره‌وقت اونجا کلاس می‌گیرن؟"
    correct_option: "community college"
    distractors: ["take a class", "in the evening", "do homework"]
    accepted_answers: [{value: "community college", status: "correct"}]
    feedback: "*community college* یعنی کالج محلی، جایی که بزرگسال‌ها کنار کار کلاس می‌گیرن."
  en.a1.unit36.lesson02.exercise03.choose_in_the_evening_meaning:
    instruction: "کدوم عبارت یعنی آخرهای روز، نه صبح؟"
    correct_option: "in the evening"
    distractors: ["study for a test", "take a class", "community college"]
    accepted_answers: [{value: "in the evening", status: "correct"}]
    feedback: "*in the evening* یعنی عصر، آخرهای روز."
  en.a1.unit36.lesson02.exercise04.order_homework_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["He", "does", "his", "homework", "after", "dinner."], status: "correct"}]
    feedback: "ترتیب درست: *He does his homework after dinner.* -- برای تکلیف فعل *do/does* به‌کار می‌ره."
  en.a1.unit36.lesson02.exercise05.translate_what_are_you_studying:
    instruction: "ترجمه کنین: «چی داری می‌خونی؟»"
    accepted_answers: [{value: "What are you studying?", status: "correct"}, {value: "What are you studying", status: "correct"}]
    feedback: "*What are you studying?* -- حال استمراری با *are + -ing*، مثل «داری می‌خونی»."

  en.a1.unit36.lesson03.exercise01.comprehension_mia_class:
    instruction: "طبق گفتگو، میا چه کلاسی می‌ره؟"
    correct_option: "a photography class"
    distractors: ["a computer course", "a Spanish class", "a cooking class"]
    accepted_answers: [{value: "a photography class", status: "correct"}]
    feedback: "میا می‌گه امشب کلاس عکاسی داره."
  en.a1.unit36.lesson03.exercise02.comprehension_mia_frequency:
    instruction: "طبق گفتگو، کلاس میا چند وقت یه بار برگزار می‌شه؟"
    correct_option: "Twice a week"
    distractors: ["Once a week", "Every day", "Once a month"]
    accepted_answers: [{value: "Twice a week", status: "correct"}]
    feedback: "میا می‌گه هفته‌ای دو باره: *It's twice a week.*"
  en.a1.unit36.lesson03.exercise03.listen_dialogue_where:
    instruction: "طبق گفتگو، میا کلاسش رو کجا می‌ره؟"
    correct_option: "the community college downtown"
    distractors: ["a school near her house", "her office", "an online course"]
    accepted_answers: [{value: "the community college downtown", status: "correct"}]
    feedback: "میا می‌گه توی کالج محلی مرکز شهر."
  en.a1.unit36.lesson03.exercise04.respond_own_study:
    instruction: "یه چیزی که می‌خونین یا دارین یاد می‌گیرین رو بگین."
    accepted_answers: ["I take a class", "I take a class.", "I am a student", "I am a student.", "I study English", "I study English.", "I do my homework", "I do my homework.", "I am taking a course", "I am taking a course.", "I am learning something new", "I am learning something new."]
    feedback: "می‌تونین بگین *I study English* یا *I am taking a course* -- ساده برای کار همیشگی، استمراری برای همین دوره."

  en.a1.unit36.lesson04.exercise01.reading_daniel_course:
    instruction: "طبق متن، دنیل دوشنبه‌شب‌ها چه دوره‌ای می‌گذرونه؟"
    correct_option: "a computer course"
    distractors: ["a photography class", "a Spanish course", "an English course"]
    accepted_answers: [{value: "a computer course", status: "correct"}]
    feedback: "متن می‌گه دنیل دوشنبه‌شب‌ها دورهٔ کامپیوتر می‌گذرونه."
  en.a1.unit36.lesson04.exercise02.reading_leila_reason:
    instruction: "طبق متن، لیلا چرا داره اسپانیایی می‌خونه؟"
    correct_option: "she wants to travel to Mexico someday"
    distractors: ["she needs it for her job", "her family speaks Spanish", "she is moving to Spain"]
    accepted_answers: [{value: "she wants to travel to Mexico someday", status: "correct"}]
    feedback: "متن می‌گه لیلا می‌خواد یه روزی بره سفر مکزیک."
  en.a1.unit36.lesson04.exercise03.reading_mia_class:
    instruction: "طبق متن، میا هفته‌ای دو بار چه کلاسی داره؟"
    correct_option: "photography"
    distractors: ["computers", "Spanish", "painting"]
    accepted_answers: [{value: "photography", status: "correct"}]
    feedback: "متن می‌گه میا هفته‌ای دو بار کلاس عکاسی داره."
  en.a1.unit36.lesson04.exercise04.write_own_study_sentence:
    instruction: "یه جمله دربارهٔ چیزی که می‌خونین یا دارین یاد می‌گیرین بنویسین، با *I study*، *I am learning* یا *I am taking a class in*."
    accepted_answers: ["I study English", "I study English.", "I am learning English", "I am learning English.", "I am taking a class in English", "I am taking a class in English.", "I am learning something new", "I am learning something new."]
    feedback: "می‌تونین از الگوی *I study...*، *I am learning...* یا *I am taking a class in...* استفاده کنین."
