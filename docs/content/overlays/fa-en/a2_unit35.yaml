review: {status: "reviewed", required_next_reviewer: null, notes: "Iranian Persian overlay for the new a2_unit35_prescription realization, authored 2026-07-22. Register is the colloquial spoken Persian pinned for this lane in docs/content/CLAUDE.md (می‌شه/می‌ده/رو/الان/می‌تونین), with polite شما when addressing the learner. Vocabulary is deliberately Iranian, not Afghan: داروخانه، دارو، دکتر، قرص، شماره، الان، با، اینجا. Continuity with this lane's own a2_unit28 glossary kept exactly: دارو = medicine, نسخه = prescription. AUTHORING NOTE FOR THE REVIEWER: this file was written by the same session that also wrote the prs-en overlay of the same realization; the Dari file was completed and closed FIRST and this file was then written against fa-en's own established A2 glossary, but a reviewer should still spot-check specifically for Dari leakage (استه، می‌تانین، همرای، نمبر، دواخانه، گولی، کمره، قطی، معاش، فرمایش) -- a programmatic grep for those strings is the cheapest check. Every listen_select/dialogue distractor checked against the full audio text of its own media asset -- none is spoken anywhere in that audio. PENDING a fresh-context review.\n\nfa-en review 2026-10-19: Checked notes, glosses, Persian style/ZWNJ, leakage, distractors, accepted answers, canon (Daniel's cold from u28) and sequencing. 2 fixes: untaught distractor 'hungry' replaced (headache, taught in u28); added 'I would like...' answers to the writing task. Valid alternate order 'Take one tablet with food twice a day' left unaccepted (validator warns on permutations)."}

course:
  title: "انگلیسی A2"
  description: "آموزش انگلیسی سطح A2 برای موقعیت‌های رسمی‌تر، با توضیحات دقیق فارسی."

units:
  en.a2.unit35.prescription: {title: "گرفتن نسخه از داروخانه"}

lessons:
  en.a2.unit35.lesson01.pharmacy_vocabulary: {title: "قرص، دوز و عوارض جانبی"}
  en.a2.unit35.lesson02.asking_at_the_counter: {title: "پرسیدن دربارهٔ دوز و عوارض جانبی"}
  en.a2.unit35.lesson03.reading_a_pharmacy_label: {title: "خواندن برچسب داروخانه"}
  en.a2.unit35.lesson04.pharmacy_dialogue: {title: "پشت پیشخوان داروخانه"}

teaching:
  en.a2.unit35.lesson01.teach.pharmacy: {title: "pharmacy", gloss: "داروخانه", note: "*pharmacy* یعنی مغازه‌ای که دارو می‌فروشه.", example_gloss: "کنار مطب دکتر یه داروخانه هست."}
  en.a2.unit35.lesson01.teach.pharmacist: {title: "pharmacist", gloss: "داروساز", note: "*pharmacist* یعنی کسی که توی داروخانه داروتون رو بهتون می‌ده.", example_gloss: "داروساز توضیح داد که دارو رو چطور مصرف کنم."}
  en.a2.unit35.lesson01.teach.tablet: {title: "tablet", gloss: "قرص", note: "*tablet* یعنی یه قرص که قورتش می‌دین.", example_gloss: "صبح یه قرص می‌خورم و شب یکی دیگه."}
  en.a2.unit35.lesson01.teach.dose: {title: "dose", gloss: "دوز", note: "*dose* یعنی هر بار چقدر دارو مصرف می‌کنین.", example_gloss: "دوزش روزی دو بار، هر بار یه قرصه."}
  en.a2.unit35.lesson01.teach.refill: {title: "refill", gloss: "تکرار نسخه", note: "*refill* یعنی همون دارو رو دوباره از داروخانه بگیرین، بدون اینکه دوباره پیش دکتر برین.", example_gloss: "تکرار نسخه لازم دارم، چون قرص‌هام تقریباً تموم شده."}
  en.a2.unit35.lesson01.teach.side_effects: {title: "side effects", gloss: "عوارض جانبی", note: "*side effects* یعنی اثرهای دیگهٔ یه دارو روی بدنتون.", example_gloss: "داروساز دربارهٔ عوارض جانبی این دارو بهم گفت."}
  en.a2.unit35.lesson01.teach.grammar_frequency: {title: "گفتن اینکه چند بار دارو می‌خورین", gloss: "روزی یه بار، روزی دو بار، روزی سه بار، هر هشت ساعت", note: "*once a day* یعنی روزی یه بار، *twice a day* یعنی روزی دو بار، *three times a day* یعنی روزی سه بار، *every eight hours* یعنی هر هشت ساعت."}

  en.a2.unit35.lesson02.teach.pick_up_prescription: {title: "گفتن اینکه برای چی اومدین", gloss: "می‌خواستم داروی نسخه‌ام رو بگیرم.", note: "*I'd like to...* یه شکل مؤدبانه برای گفتن خواستتونه، مثل واحد ۲۹."}
  en.a2.unit35.lesson02.teach.take_one_tablet: {title: "دوزی که بهتون گفته می‌شه", gloss: "روزی دو بار، هر بار یه قرص، همراه غذا مصرف کنین.", note: "*with food* یعنی همراه غذا، نه با معدهٔ خالی."}
  en.a2.unit35.lesson02.teach.ask_how_many_days: {title: "پرسیدن اینکه چند روز", gloss: "چند روز باید مصرفش کنم؟", note: "*How many...?* رو برای چیزهایی که شمرده می‌شن، مثل روزها، به کار می‌برین."}
  en.a2.unit35.lesson02.teach.ask_side_effects: {title: "پرسیدن دربارهٔ عوارض جانبی", gloss: "عوارض جانبی داره؟", note: "*Are there any...?* شکل معمول پرسیدن اینه که چیزی وجود داره یا نه."}
  en.a2.unit35.lesson02.teach.grammar_should: {title: "should و shouldn't برای دستور و توصیه", gloss: "باید همراه غذا مصرفش کنین. نباید زودتر از موعد قطعش کنین.", note: "*should* یه توصیه یا دستور می‌ده؛ *shouldn't* شکل منفی همونه."}

  en.a2.unit35.lesson03.teach.before_bed: {title: "before bed", gloss: "قبل از خواب", note: "*before bed* یعنی قبل از اینکه بخوابین.", example_gloss: "بعضی داروها اگه قبل از خواب مصرف بشن بهتر اثر می‌کنن."}
  en.a2.unit35.lesson03.teach.label_text: {title: "متن برچسب داروخانه", gloss: "داروی سرماخوردگی. روزی دو بار، هر بار یه قرص همراه غذا، به مدت پنج روز مصرف کنین. زودتر از موعد قرص‌ها رو قطع نکنین. عوارض جانبی احتمالی: ممکنه احساس خستگی کنین. تکرار نسخه: یه بار.", note: "برچسب واقعی داروخانه کوتاه و دستوریه -- جمله‌های کوتاه، بدون شکل‌های مؤدبانه."}
  en.a2.unit35.lesson03.teach.do_not_stop_early: {title: "هشدار برچسب", gloss: "زودتر از موعد قرص‌ها رو قطع نکنین.", note: "*Do not...* شکل امری منفیه که روی برچسب‌ها و تابلوها می‌بینین."}

  en.a2.unit35.lesson04.teach.q_pick_up: {title: "دنیل خودش رو معرفی می‌کنه", gloss: "دنیل می‌گه: سلام، می‌خواستم داروی نسخه‌ام رو بگیرم.", note: "*Hi* غیررسمی‌تر از *Hello* است، ولی پشت پیشخوان کاملاً معمولیه."}
  en.a2.unit35.lesson04.teach.a_what_is_your_name: {title: "داروساز اسمش رو می‌پرسه", gloss: "داروساز می‌گه: البته. اسمتون چیه؟", note: "*Of course* اینجا یعنی البته، مشکلی نیست."}
  en.a2.unit35.lesson04.teach.q_doctor_gave_me_medicine: {title: "دنیل می‌گه دارو برای چیه", gloss: "دنیل می‌گه: دنیل. دکتر برای یه سرماخوردگی شدید بهم دارو داده.", note: "همون سرماخوردگی‌ای که دکتر در واحد ۲۸ تشخیص داد."}
  en.a2.unit35.lesson04.teach.a_here_it_is: {title: "داروساز دوز رو می‌گه", gloss: "داروساز می‌گه: بفرمایید. روزی دو بار، هر بار یه قرص، همراه غذا مصرف کنین.", note: "*Here it is* رو موقع دادن چیزی به کسی می‌گین."}
  en.a2.unit35.lesson04.teach.q_how_many_days: {title: "دنیل می‌پرسه چند روز", gloss: "دنیل می‌پرسه: چند روز باید مصرفش کنم؟", note: "همون سوالی که در درس دوم یاد گرفتین."}
  en.a2.unit35.lesson04.teach.a_five_days_no_stopping: {title: "جواب داروساز", gloss: "داروساز می‌گه: به مدت پنج روز. زودتر از موعد قرص‌ها رو قطع نکنین.", note: "همون دستوری که روی برچسب درس سوم بود."}
  en.a2.unit35.lesson04.teach.q_any_side_effects: {title: "دنیل دربارهٔ عوارض جانبی می‌پرسه", gloss: "دنیل می‌پرسه: عوارض جانبی داره؟", note: "همون سوالی که در درس دوم یاد گرفتین."}
  en.a2.unit35.lesson04.teach.a_you_may_feel_tired: {title: "داروساز عارضه رو می‌گه", gloss: "داروساز می‌گه: ممکنه احساس خستگی کنین، ولی همین.", note: "*but that's all* اینجا یعنی و دیگه چیزی نیست."}
  en.a2.unit35.lesson04.teach.q_thank_you: {title: "دنیل تشکر می‌کنه", gloss: "دنیل می‌گه: خیلی ممنون.", note: "*very much* تشکر رو کمی پررنگ‌تر می‌کنه."}

