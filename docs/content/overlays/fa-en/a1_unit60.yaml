  en.a1.unit60.lesson02.teach.are_you_free: {title: "پرسیدن دربارهٔ وقت آزاد", gloss: "شنبه وقت داری؟", note: "*Are you free ...?* برای پرسیدن اینه که کسی وقت داره یا نه."}
  en.a1.unit60.lesson02.teach.would_you_like_dinner: {title: "دعوت مؤدبانه به شام", gloss: "دوست داری برای شام بیایی؟", note: "*Would you like to ...?* شکل مؤدبانه و طبیعی دعوت کردنه."}
  en.a1.unit60.lesson02.teach.bring_a_drink: {title: "درخواست آوردن نوشیدنی", gloss: "لطفاً یه نوشیدنی بیار.", note: "*Please bring ...* یعنی لطفاً چیزی رو همراه خودت بیار."}
  en.a1.unit60.lesson02.teach.i_can_come: {title: "قبول کردن دعوت", gloss: "می‌تونم بیام.", note: "*I can come* یه پاسخ ساده برای قبول کردن دعوته."}
  en.a1.unit60.lesson02.teach.cant_come: {title: "رد کردن دعوت", gloss: "متأسفم، نمی‌تونم بیام.", note: "*Sorry, I can't come* یه روش کوتاه و مؤدبانه برای رد کردن دعوته."}
  en.a1.unit60.lesson02.teach.see_you_at_six: {title: "گفتن زمان دیدار", gloss: "ساعت شش می‌بینمت.", note: "*See you at six* یعنی قراره ساعت شش همدیگه رو ببینیم."}

  en.a1.unit60.lesson03.teach.dialogue_line1: {title: "دعوت لیلا", gloss: "لیلا می‌گه: سلام دنیل! شنبه وقت داری؟", note: "لیلا با پرسیدن وقت آزاد، زمینهٔ دعوت رو فراهم می‌کنه."}
  en.a1.unit60.lesson03.teach.dialogue_line2: {title: "پاسخ دنیل", gloss: "دنیل می‌گه: بله، وقت دارم.", note: "*Yes, I am free* یعنی بله، وقت دارم."}
  en.a1.unit60.lesson03.teach.dialogue_line3: {title: "دعوت به شام", gloss: "لیلا می‌پرسه: دوست داری برای شام بیایی؟", note: "*Would you like to come to dinner?* دعوتی مؤدبانه و دوستانه‌ست."}
  en.a1.unit60.lesson03.teach.dialogue_line4: {title: "قبول دعوت", gloss: "دنیل می‌گه: بله، خیلی دوست دارم.", note: "*I'd love to* پاسخ گرم و طبیعی برای قبول دعوته."}
  en.a1.unit60.lesson03.teach.dialogue_line5: {title: "درخواست لیلا", gloss: "لیلا می‌گه: لطفاً یه نوشیدنی بیار.", note: "لیلا با *Please bring ...* چیزی رو که باید همراه بیاره مشخص می‌کنه."}
  en.a1.unit60.lesson03.teach.dialogue_line6: {title: "سؤال دنیل", gloss: "دنیل می‌گه: حتماً. چه ساعتی؟", note: "*What time?* پرسشی کوتاه برای زمان برنامه‌ست."}
  en.a1.unit60.lesson03.teach.dialogue_line7: {title: "زمان برنامه", gloss: "لیلا می‌گه: ساعت شش می‌بینمت.", note: "*at six* یعنی ساعت شش."}
  en.a1.unit60.lesson03.teach.dialogue_line8: {title: "تشکر دنیل", gloss: "دنیل می‌گه: عالیه. از دعوتت ممنونم.", note: "*Thank you for the invitation* تشکر مستقیم برای دعوته."}

  en.a1.unit60.lesson04.teach.invitation_message: {title: "متن: پیام دعوت", gloss: "دعوت به شام: شنبه ساعت ۶:۰۰. لطفاً یه نوشیدنی بیارین. نشانی: خیابان پارک، پلاک ۱۸.", note: "این پیام روز، ساعت، چیزی که باید بیارین، و نشانی رو مشخص می‌کنه."}
  en.a1.unit60.lesson04.teach.reading_passage: {title: "متن: شام در خانهٔ لیلا", gloss: "شام در خانهٔ لیلا: لیلا دنیل رو برای شنبه به شام دعوت کرد. اون از دنیل خواست یه نوشیدنی بیاره. دنیل گفت می‌تونه بیاد. دعوت‌نامه گفت شام ساعت ۶:۰۰ در خیابان پارک، پلاک ۱۸ه. دنیل نشانی رو در تلفنش نوشت. اون می‌خواست به‌موقع برسه. لیلا خوشحال بود چون دوستش می‌تونست بیاد.", note: "این متن جزئیات دعوت و پاسخ دنیل رو توضیح می‌ده."}

