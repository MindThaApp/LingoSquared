  en.a1.unit60.lesson01.teach.invitation: {title: "invitation", gloss: "دعوت / دعوت‌نامه", note: "*invitation* یعنی پیامی که از کسی می‌خواد به جایی یا برنامه‌ای بیاد.", example_gloss: "از دعوت شما متشکرم."}
  en.a1.unit60.lesson01.teach.party: {title: "party", gloss: "مهمانی", note: "*party* یعنی مهمانی یا برنامه‌ای دوستانه با چند نفر.", example_gloss: "مهمانی روز شنبه‌ست."}
  en.a1.unit60.lesson01.teach.dinner: {title: "dinner", gloss: "شام", note: "*dinner* یعنی وعدهٔ غذایی عصر یا شب.", example_gloss: "برای شام بیا."}
  en.a1.unit60.lesson01.teach.picnic: {title: "picnic", gloss: "پیک‌نیک", note: "*picnic* یعنی غذا خوردن در فضای بیرون، معمولاً به شکل دوستانه.", example_gloss: "می‌تونیم پیک‌نیک داشته باشیم."}
  en.a1.unit60.lesson01.teach.bring: {title: "bring", gloss: "آوردن", note: "*bring* یعنی چیزی رو همراه‌تون بیارین.", example_gloss: "لطفاً یه نوشیدنی بیارین."}
