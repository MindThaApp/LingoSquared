teaching:
  en.a1.unit60.lesson01.teach.invitation: {title: "invitation", gloss: "دعوت / دعوت‌نامه", note: "*invitation* یعنی پیامی که از کسی می‌خواهد به جایی یا برنامه‌ای بیاید.", example_gloss: "از دعوت شما متشکرم."}
  en.a1.unit60.lesson01.teach.party: {title: "party", gloss: "مهمانی", note: "*party* یعنی مهمانی یا برنامه‌ای دوستانه با چند نفر.", example_gloss: "مهمانی روز شنبه است."}
  en.a1.unit60.lesson01.teach.dinner: {title: "dinner", gloss: "شام", note: "*dinner* یعنی وعدهٔ غذایی عصر یا شب.", example_gloss: "برای شام بیا."}
  en.a1.unit60.lesson01.teach.picnic: {title: "picnic", gloss: "پیک‌نیک", note: "*picnic* یعنی غذا خوردن در فضای بیرون، معمولاً به شکل دوستانه.", example_gloss: "می‌توانیم پیک‌نیک داشته باشیم."}
  en.a1.unit60.lesson01.teach.bring: {title: "bring", gloss: "آوردن", note: "*bring* یعنی چیزی را همراه خود بیاورید.", example_gloss: "لطفاً یک نوشیدنی بیاورید."}
  en.a1.unit60.lesson01.teach.free: {title: "free", gloss: "آزاد / وقت داشتن", note: "*free* در این درس یعنی وقت داشتن و گرفتار نبودن، نه رایگان بودن.", example_gloss: "وقت داری؟"}

  en.a1.unit60.lesson02.teach.are_you_free: {title: "پرسیدن دربارهٔ وقت آزاد", gloss: "شنبه وقت داری؟", note: "*Are you free ...?* برای پرسیدن این است که کسی وقت دارد یا نه."}
  en.a1.unit60.lesson02.teach.would_you_like_dinner: {title: "دعوت مؤدبانه به شام", gloss: "دوست داری برای شام بیایی؟", note: "*Would you like to ...?* شکل مؤدبانه و طبیعی دعوت کردن است."}
  en.a1.unit60.lesson02.teach.bring_a_drink: {title: "درخواست آوردن نوشیدنی", gloss: "لطفاً یک نوشیدنی بیاور.", note: "*Please bring ...* یعنی لطفاً چیزی را همراه خود بیاور."}
  en.a1.unit60.lesson02.teach.i_can_come: {title: "قبول کردن دعوت", gloss: "می‌توانم بیایم.", note: "*I can come* یک پاسخ ساده برای قبول کردن دعوت است."}
  en.a1.unit60.lesson02.teach.cant_come: {title: "رد کردن دعوت", gloss: "متأسفم، نمی‌توانم بیایم.", note: "*Sorry, I can't come* یک روش کوتاه و مؤدبانه برای رد کردن دعوت است."}
  en.a1.unit60.lesson02.teach.see_you_at_six: {title: "گفتن زمان دیدار", gloss: "ساعت شش می‌بینمت.", note: "*See you at six* یعنی قرار است ساعت شش همدیگر را ببینیم."}

  en.a1.unit60.lesson03.teach.dialogue_line1: {title: "دعوت لیلا", gloss: "لیلا می‌گوید: سلام دنیل! شنبه وقت داری؟", note: "لیلا با پرسیدن وقت آزاد، زمینهٔ دعوت را فراهم می‌کند."}
  en.a1.unit60.lesson03.teach.dialogue_line2: {title: "پاسخ دنیل", gloss: "دنیل می‌گوید: بله، وقت دارم.", note: "*Yes, I am free* یعنی بله، وقت دارم."}
  en.a1.unit60.lesson03.teach.dialogue_line3: {title: "دعوت به شام", gloss: "لیلا می‌پرسد: دوست داری برای شام بیایی؟", note: "*Would you like to come to dinner?* دعوتی مؤدبانه و دوستانه است."}
  en.a1.unit60.lesson03.teach.dialogue_line4: {title: "قبول دعوت", gloss: "دنیل می‌گوید: بله، خیلی دوست دارم.", note: "*I'd love to* پاسخ گرم و طبیعی برای قبول دعوت است."}
  en.a1.unit60.lesson03.teach.dialogue_line5: {title: "درخواست لیلا", gloss: "لیلا می‌گوید: لطفاً یک نوشیدنی بیاور.", note: "لیلا با *Please bring ...* چیزی را که باید همراه آورد مشخص می‌کند."}
  en.a1.unit60.lesson03.teach.dialogue_line6: {title: "سؤال دنیل", gloss: "دنیل می‌گوید: حتماً. چه ساعتی؟", note: "*What time?* پرسشی کوتاه برای زمان برنامه است."}
  en.a1.unit60.lesson03.teach.dialogue_line7: {title: "زمان برنامه", gloss: "لیلا می‌گوید: ساعت شش می‌بینمت.", note: "*at six* یعنی ساعت شش."}
  en.a1.unit60.lesson03.teach.dialogue_line8: {title: "تشکر دنیل", gloss: "دنیل می‌گوید: عالی است. از دعوتت ممنونم.", note: "*Thank you for the invitation* تشکر مستقیم برای دعوت است."}

  en.a1.unit60.lesson04.teach.invitation_message: {title: "متن: پیام دعوت", gloss: "دعوت به شام: شنبه ساعت ۶:۰۰. لطفاً یک نوشیدنی بیاورید. نشانی: خیابان پارک، پلاک ۱۸.", note: "این پیام روز، ساعت، چیزی که باید آورد، و نشانی را مشخص می‌کند."}
  en.a1.unit60.lesson04.teach.reading_passage: {title: "متن: شام در خانهٔ لیلا", gloss: "شام در خانهٔ لیلا: لیلا دنیل را برای شنبه به شام دعوت کرد. او از دنیل خواست یک نوشیدنی بیاورد. دنیل گفت می‌تواند بیاید. دعوت‌نامه گفت شام ساعت ۶:۰۰ در خیابان پارک، پلاک ۱۸ است. دنیل نشانی را در تلفنش نوشت. او می‌خواست به‌موقع برسد. لیلا خوشحال بود چون دوستش می‌توانست بیاید.", note: "این متن جزئیات دعوت و پاسخ دنیل را توضیح می‌دهد."}

exercises:
  en.a1.unit60.lesson01.exercise01.listen_word:
    instruction: "گوش کنید و کلمه‌ای را که گفته شد انتخاب کنید."
    correct_option: "invitation"
    distractors: ["address", "calendar", "restaurant", "ticket"]
    accepted_answers: [{value: "invitation", status: "correct"}]
    feedback: "*invitation* یعنی دعوت یا دعوت‌نامه."
  en.a1.unit60.lesson01.exercise02.choose_free_meaning:
    instruction: "کدام کلمه یعنی وقت داشتن و گرفتار نبودن؟"
    correct_option: "free"
    distractors: ["party", "dinner", "bring"]
    accepted_answers: [{value: "free", status: "correct"}]
    feedback: "*free* اینجا یعنی آزاد و دارای وقت."
  en.a1.unit60.lesson01.exercise03.match_invitation_words:
    instruction: "هر توضیح انگلیسی را به کلمهٔ درست وصل کنید."
    accepted_answers: [{value: [{left: "a message asking someone to come", right: "invitation"}, {left: "a friendly event with people", right: "party"}, {left: "the evening meal", right: "dinner"}, {left: "a meal outside", right: "picnic"}, {left: "take something with you", right: "bring"}, {left: "available and not busy", right: "free"}], status: "correct"}]
    feedback: "invitation=دعوت، party=مهمانی، dinner=شام، picnic=پیک‌نیک، bring=آوردن، free=وقت داشتن."
  en.a1.unit60.lesson01.exercise04.order_party_sentence:
    instruction: "کلمات را به ترتیب درست بچینید."
    accepted_answers: [{value: ["The", "party", "is", "on", "Saturday."], status: "correct"}]
    feedback: "ترتیب درست: *The party is on Saturday.*"
  en.a1.unit60.lesson01.exercise05.write_picnic:
    instruction: "کلمه‌ای را بنویسید که یعنی غذا خوردن در فضای بیرون."
    accepted_answers: [{value: "picnic", status: "correct"}]
    feedback: "*picnic* یعنی پیک‌نیک."

  en.a1.unit60.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنید و عبارتی را که شنیدید انتخاب کنید."
    correct_option: "Would you like to come to dinner?"
    distractors: ["Would you like some coffee?", "Do you live near here?", "Can you write the address?"]
    accepted_answers: [{value: "Would you like to come to dinner?", status: "correct"}]
    feedback: "*Would you like to come to dinner?* یعنی دوست داری برای شام بیایی؟"
  en.a1.unit60.lesson02.exercise02.choose_invitation_question:
    instruction: "کدام عبارت کسی را به شام دعوت می‌کند؟"
    correct_option: "Would you like to come to dinner?"
    distractors: ["Are you free on Saturday?", "Please bring a drink.", "Sorry, I can't come."]
    accepted_answers: [{value: "Would you like to come to dinner?", status: "correct"}]
    feedback: "*Would you like to come to dinner?* دعوت به شام است."
  en.a1.unit60.lesson02.exercise03.choose_acceptance:
    instruction: "کدام عبارت دعوت را قبول می‌کند؟"
    correct_option: "I can come."
    distractors: ["Sorry, I can't come.", "Please bring a drink.", "Are you free on Saturday?"]
    accepted_answers: [{value: "I can come.", status: "correct"}]
    feedback: "*I can come* یعنی می‌توانم بیایم."
  en.a1.unit60.lesson02.exercise04.order_bring_sentence:
    instruction: "کلمات را به ترتیب درست بچینید."
    accepted_answers: [{value: ["Please", "bring", "a", "drink."], status: "correct"}]
    feedback: "ترتیب درست: *Please bring a drink.*"
  en.a1.unit60.lesson02.exercise05.translate_see_you:
    instruction: "ترجمه کنید: «ساعت شش می‌بینمت.»"
    accepted_answers: [{value: "See you at six.", status: "correct"}, {value: "See you at six", status: "correct"}]
    feedback: "*See you at six* یعنی ساعت شش می‌بینمت."

  en.a1.unit60.lesson03.exercise01.comprehension_day:
    instruction: "طبق گفتگو، لیلا چه روزی را نام می‌برد؟"
    correct_option: "Saturday"
    distractors: ["Friday", "Sunday", "Monday"]
    accepted_answers: [{value: "Saturday", status: "correct"}]
    feedback: "لیلا روز شنبه را نام می‌برد."
  en.a1.unit60.lesson03.exercise02.comprehension_time:
    instruction: "طبق گفتگو، لیلا چه ساعتی را می‌گوید؟"
    correct_option: "six"
    distractors: ["five", "seven", "eight"]
    accepted_answers: [{value: "six", status: "correct"}]
    feedback: "لیلا می‌گوید ساعت شش."
  en.a1.unit60.lesson03.exercise03.listen_dialogue_invitation:
    instruction: "لیلا کدام دعوت را می‌گوید؟"
    correct_option: "Would you like to come to dinner?"
    distractors: ["Would you like to see a film?", "Can you meet me tomorrow?", "Do you want to study together?"]
    accepted_answers: [{value: "Would you like to come to dinner?", status: "correct"}]
    feedback: "لیلا می‌گوید: *Would you like to come to dinner?*"
  en.a1.unit60.lesson03.exercise04.respond_own_invitation:
    instruction: "کسی را دعوت کنید، دعوت را قبول کنید، یا بگویید چه چیزی باید بیاورد."
    accepted_answers: ["Would you like to come to dinner", "Would you like to come to dinner?", "I can come", "I can come.", "Please bring a drink", "Please bring a drink.", "See you at six", "See you at six."]
    feedback: "می‌توانید بگویید *Would you like to come to dinner?* یا *I can come.*"

  en.a1.unit60.lesson04.exercise01.message_day:
    instruction: "طبق دعوت‌نامه، شام چه روزی است؟"
    correct_option: "Saturday"
    distractors: ["Friday", "Sunday", "Monday"]
    accepted_answers: [{value: "Saturday", status: "correct"}]
    feedback: "دعوت‌نامه می‌گوید شام شنبه است."
  en.a1.unit60.lesson04.exercise02.message_time:
    instruction: "طبق دعوت‌نامه، شام چه ساعتی است؟"
    correct_option: "6:00"
    distractors: ["5:00", "7:00", "8:00"]
    accepted_answers: [{value: "6:00", status: "correct"}]
    feedback: "دعوت‌نامه می‌گوید شام ساعت ۶:۰۰ است."
  en.a1.unit60.lesson04.exercise03.message_address:
    instruction: "طبق دعوت‌نامه، نشانی چیست؟"
    correct_option: "18 Park Street"
    distractors: ["16 Park Street", "18 Lake Street", "20 Park Street"]
    accepted_answers: [{value: "18 Park Street", status: "correct"}]
    feedback: "نشانی دعوت‌نامه *18 Park Street* است."
  en.a1.unit60.lesson04.exercise04.reading_what_to_bring:
    instruction: "طبق متن، دنیل باید چه چیزی بیاورد؟"
    correct_option: "a drink"
    distractors: ["a book", "a ticket", "a card"]
    accepted_answers: [{value: "a drink", status: "correct"}]
    feedback: "لیلا از دنیل خواست یک نوشیدنی بیاورد."
  en.a1.unit60.lesson04.exercise05.write_own_invitation_message:
    instruction: "یک پیام کوتاه بنویسید: زمان شام را بگویید و بگویید چه چیزی باید آورد."
    accepted_answers: ["Dinner is at 6:00. Please bring a drink.", "Dinner is at 6:00, and please bring a drink.", "Dinner is at 6:00 and please bring a drink."]
    feedback: "می‌توانید بنویسید: *Dinner is at 6:00. Please bring a drink.*"
