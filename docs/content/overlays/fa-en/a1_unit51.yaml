review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit51 (buying over-the-counter medicine at the pharmacy). Authored fully at schema_version 1.1, every kind: vocabulary teaching card has a matching example_gloss:. Contrastive-grammar points for this unit: (1) dosage instructions with 'every' -- 'Take one tablet every four hours' places the frequency phrase (every four hours) at the END of the sentence, while Farsi naturally places the same frequency phrase BEFORE the verb (هر چهار ساعت یک قرص بخورین) -- flagged on the dosage phrase card so the learner doesn't default to Farsi word order. (2) 'something for a sore throat' -- English for here marks purpose (medicine intended for a symptom), a sense distinct from for meaning duration (unit50's 'for two nights') or price ('for nine dollars', later in this same unit) -- Farsi's برای covers all three senses with one word, so English's for can feel deceptively simple until a learner meets all three uses; flagged on the phrase card. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, not translated Farsi lefts, per the established fa-en convention. Every listen_select/multiple_choice distractor in lesson03/lesson04 is an invented value never stated elsewhere in this unit (invented symptoms, invented prices, invented items) -- checked the dialogue's own lines (Pharmacist: 4 lines; Leila: 'Yes, I have a bad cough and a runny nose.', 'Great, I'll take both. How much is that?'; Daniel: 'Do you have something for a sore throat too?', 'Here you go. Thank you!') to confirm no distractor reuses a fact the tested speaker states elsewhere in the same audio. Strong sibling-isolation rule applied -- nl-en/prs-en overlays and the concurrent units 39-48 dispatch were not consulted. Needs the mandatory fresh-context review before shipping, and inherits the underlying realization's own still-unreviewed status."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit51.pharmacy: {title: "خرید دارو از داروخونه"}

lessons:
  en.a1.unit51.lesson01.pharmacy_vocabulary: {title: "کلمات داروخونه"}
  en.a1.unit51.lesson02.phrases_at_the_pharmacy: {title: "عبارت‌های داروخونه"}
  en.a1.unit51.lesson03.dialogue_at_the_pharmacy: {title: "گفتگو: در داروخونه"}
  en.a1.unit51.lesson04.a_trip_to_the_pharmacy: {title: "متن: رفتن به داروخونه"}

teaching:
  en.a1.unit51.lesson01.teach.pharmacist: {title: "pharmacist", gloss: "داروساز", note: "*pharmacist* یعنی کسی که تو داروخونه کمکتون می‌کنه داروی درست رو پیدا کنین.", example_gloss: "داروساز خیلی کمک‌کننده‌ست."}
  en.a1.unit51.lesson01.teach.medicine: {title: "medicine", gloss: "دارو", note: "*medicine* یعنی چیزی که برای بهتر شدن حالتون مصرف می‌کنین.", example_gloss: "برای سرفه‌م دارو لازم دارم."}
  en.a1.unit51.lesson01.teach.cough_syrup: {title: "cough syrup", gloss: "شربت سرفه", note: "*cough syrup* یعنی داروی مایعی که برای سرفه می‌خورین.", example_gloss: "این شربت سرفه خوب جواب می‌ده."}
  en.a1.unit51.lesson01.teach.tablet: {title: "tablet", gloss: "قرص", note: "*tablet* یعنی یه تیکه دارو جامد که قورت می‌دین.", example_gloss: "یه قرص با آب بخورین."}
  en.a1.unit51.lesson01.teach.runny_nose: {title: "runny nose", gloss: "آبریزش بینی", note: "*runny nose* یعنی وقتی از بینی‌تون مایع میاد بیرون.", example_gloss: "امروز آبریزش بینی دارم."}
  en.a1.unit51.lesson01.teach.sore_throat: {title: "sore throat", gloss: "گلودرد", note: "*sore throat* یعنی درد تو گلو، وقتی مریضین.", example_gloss: "گلودرد هم دارم."}

  en.a1.unit51.lesson02.teach.can_i_help_you: {title: "Can I help you?", gloss: "می‌تونم کمکتون کنم؟"}
  en.a1.unit51.lesson02.teach.i_have_a_bad_cough_and_a_runny_nose: {title: "I have a bad cough and a runny nose.", gloss: "یه سرفهٔ بد و آبریزش بینی دارم."}
  en.a1.unit51.lesson02.teach.do_you_have_something_for_a_sore_throat: {title: "Do you have something for a sore throat?", gloss: "برای گلودرد چیزی دارین؟", note: "*for* اینجا یعنی «برای» به معنی هدف (داروی مخصوص یه علامت) -- همون *for* که تو *for two nights* (مدت) یا *nine dollars* (قیمت) هم دیدین، ولی معنیش هر بار فرق می‌کنه؛ فارسی هر سه معنی رو با «برای» می‌رسونه."}
  en.a1.unit51.lesson02.teach.take_one_tablet_every_four_hours: {title: "Take one tablet every four hours.", gloss: "هر چهار ساعت یک قرص بخورین.", note: "دقت کنین انگلیسی *every four hours* رو آخر جمله می‌ذاره، ولی فارسی معمولاً اون رو اول جمله می‌گه."}
  en.a1.unit51.lesson02.teach.how_much_is_that: {title: "How much is that?", gloss: "این چقدر می‌شه؟"}
  en.a1.unit51.lesson02.teach.thats_nine_dollars: {title: "That's nine dollars.", gloss: "قیمتش نه دلاره."}

  en.a1.unit51.lesson03.teach.dialogue_line1: {title: "خوش‌آمدگویی داروساز", gloss: "داروساز می‌گه سلام، می‌تونم کمکتون کنم؟"}
  en.a1.unit51.lesson03.teach.dialogue_line2: {title: "جواب لیلا", gloss: "لیلا می‌گه بله، یه سرفهٔ بد و آبریزش بینی دارم."}
  en.a1.unit51.lesson03.teach.dialogue_line3: {title: "پیشنهاد داروساز", gloss: "داروساز می‌گه یه شربت سرفه دارم که باید کمک کنه، و می‌گه قبل از خواب بخورش."}
  en.a1.unit51.lesson03.teach.dialogue_line4: {title: "سؤال دنیل", gloss: "دنیل می‌پرسه برای گلودرد هم چیزی دارین؟"}
  en.a1.unit51.lesson03.teach.dialogue_line5: {title: "توضیح داروساز دربارهٔ قرص‌ها", gloss: "داروساز می‌گه بله، این قرص‌ها برای گلودرد خوبه، و می‌گه هر چهار ساعت یکی بخورین."}
  en.a1.unit51.lesson03.teach.dialogue_line6: {title: "تصمیم لیلا", gloss: "لیلا می‌گه عالی، هر دوتاش رو برمی‌دارم، و می‌پرسه این چقدر می‌شه."}
  en.a1.unit51.lesson03.teach.dialogue_line7: {title: "جواب داروساز دربارهٔ قیمت", gloss: "داروساز می‌گه نه دلار می‌شه."}
  en.a1.unit51.lesson03.teach.dialogue_line8: {title: "پرداخت دنیل", gloss: "دنیل پول رو می‌ده و تشکر می‌کنه."}

  en.a1.unit51.lesson04.teach.reading_passage: {title: "متن: رفتن به داروخونه", gloss: "رفتن به داروخونه: چند روز بعد از سفرشون به کوه‌ها، لیلا سرما خورد. یه سرفهٔ بد و آبریزش بینی داشت، و گلوش هم درد می‌کرد. دنیل باهاش تا داروخونهٔ نزدیک آپارتمانش پیاده رفت. داروساز به علائم لیلا گوش داد و شربت سرفه و قرص پیشنهاد داد. گفت شربت سرفه رو قبل از خواب بخوره و هر چهار ساعت یه قرص. لیلا برای هر دوتاش نه دلار پرداخت کرد. سر راه خونه، دنیل یه بسته دستمال کاغذی هم براش خرید. لیلا اون شب دارو رو خورد، و تا آخر هفته سرفه‌ش خیلی بهتر شد."}

exercises:
  en.a1.unit51.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "tablet"
    distractors: ["pharmacist", "medicine", "cough syrup", "runny nose"]
    accepted_answers: [{value: "tablet", status: "correct"}]
    feedback: "*tablet* یعنی قرص."
  en.a1.unit51.lesson01.exercise02.choose_pharmacist_meaning:
    instruction: "کدوم کلمه یعنی کسی که کمکتون می‌کنه داروی درست رو تو داروخونه پیدا کنین؟"
    correct_option: "pharmacist"
    distractors: ["medicine", "tablet", "cough syrup"]
    accepted_answers: [{value: "pharmacist", status: "correct"}]
    feedback: "*pharmacist* یعنی داروساز."
  en.a1.unit51.lesson01.exercise03.match_pharmacy_words:
    instruction: "هر توضیح انگلیسی رو به کلمهٔ درستش وصل کنین."
    accepted_answers: [{value: [{left: "a person who helps you find the right medicine at a store", right: "pharmacist"}, {left: "something you take to help you feel better when you are sick", right: "medicine"}, {left: "a liquid medicine you drink for a cough", right: "cough syrup"}, {left: "a small, solid piece of medicine you swallow", right: "tablet"}, {left: "when liquid keeps coming out of your nose", right: "runny nose"}, {left: "pain in your throat, often when you're sick", right: "sore throat"}], status: "correct"}]
    feedback: "pharmacist=داروساز، medicine=دارو، cough syrup=شربت سرفه، tablet=قرص، runny nose=آبریزش بینی، sore throat=گلودرد."
  en.a1.unit51.lesson01.exercise04.order_medicine_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "need", "medicine", "for", "my", "cough."], status: "correct"}]
    feedback: "ترتیب درست: *I need medicine for my cough.*"
  en.a1.unit51.lesson01.exercise05.write_pharmacist:
    instruction: "کلمه‌ای رو بنویسین که یعنی کسی که کمکتون می‌کنه داروی درست رو تو یه فروشگاه پیدا کنین."
    accepted_answers: [{value: "pharmacist", status: "correct"}]
    feedback: "*pharmacist* یعنی داروساز."

  en.a1.unit51.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "Do you have something for a sore throat?"
    distractors: ["Can I help you?", "Take one tablet every four hours.", "How much is that?"]
    accepted_answers: [{value: "Do you have something for a sore throat?", status: "correct"}]
    feedback: "*Do you have something for a sore throat?* یعنی برای گلودرد چیزی دارین؟"
  en.a1.unit51.lesson02.exercise02.choose_greeting_meaning:
    instruction: "کدوم عبارت رو داروساز برای خوش‌آمدگویی به مشتری می‌گه؟"
    correct_option: "Can I help you?"
    distractors: ["How much is that?", "Take one tablet every four hours.", "That's nine dollars."]
    accepted_answers: [{value: "Can I help you?", status: "correct"}]
    feedback: "*Can I help you?* یعنی می‌تونم کمکتون کنم؟"
  en.a1.unit51.lesson02.exercise03.choose_dosage_meaning:
    instruction: "کدوم عبارت می‌گه هر چند وقت باید قرص‌ها رو بخورین؟"
    correct_option: "Take one tablet every four hours."
    distractors: ["Can I help you?", "Do you have something for a sore throat?", "How much is that?"]
    accepted_answers: [{value: "Take one tablet every four hours.", status: "correct"}]
    feedback: "*Take one tablet every four hours.* یعنی هر چهار ساعت یک قرص بخورین. دقت کنین انگلیسی *every four hours* رو آخر جمله می‌ذاره، ولی فارسی معمولاً اون رو اول جمله می‌گه."
  en.a1.unit51.lesson02.exercise04.order_how_much_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["How", "much", "is", "that?"], status: "correct"}]
    feedback: "ترتیب درست: *How much is that?*"
  en.a1.unit51.lesson02.exercise05.translate_price:
    instruction: "ترجمه کنین: «قیمتش نه دلاره.»"
    accepted_answers:
      - {value: "That's nine dollars.", status: "correct"}
      - {value: "That's nine dollars", status: "correct"}
    feedback: "*That's nine dollars.* یعنی قیمتش نه دلاره."

  en.a1.unit51.lesson03.exercise01.comprehension_leila_symptoms:
    instruction: "طبق گفتگو، لیلا چه علائمی داره؟"
    correct_option: "a cough and a runny nose"
    distractors: ["a headache and a fever", "a stomachache", "a broken arm"]
    accepted_answers: [{value: "a cough and a runny nose", status: "correct"}]
    feedback: "لیلا می‌گه سرفه و آبریزش بینی داره."
  en.a1.unit51.lesson03.exercise02.comprehension_tablet_dosage:
    instruction: "طبق گفتگو، لیلا هر چند وقت باید قرص‌ها رو بخوره؟"
    correct_option: "every four hours"
    distractors: ["every two hours", "every day", "once a week"]
    accepted_answers: [{value: "every four hours", status: "correct"}]
    feedback: "داروساز می‌گه هر چهار ساعت یکی."
  en.a1.unit51.lesson03.exercise03.listen_dialogue_price:
    instruction: "طبق گفتگو، دارو چقدر قیمت داره؟"
    correct_option: "nine dollars"
    distractors: ["five dollars", "twelve dollars", "twenty dollars"]
    accepted_answers: [{value: "nine dollars", status: "correct"}]
    feedback: "داروساز می‌گه نه دلاره."
  en.a1.unit51.lesson03.exercise04.respond_own_pharmacy_statement:
    instruction: "بگین لیلا چه علائمی داره، یا بگین دارو چقدر قیمت داره."
    accepted_answers: ["I have a bad cough and a runny nose", "I have a bad cough and a runny nose.", "Take one every four hours", "Take one every four hours.", "That's nine dollars", "That's nine dollars.", "Do you have something for a sore throat", "Do you have something for a sore throat?"]
    feedback: "می‌تونین بگین *I have a bad cough and a runny nose* یا *That's nine dollars*."

  en.a1.unit51.lesson04.exercise01.reading_price:
    instruction: "طبق متن، لیلا برای دارو چقدر پرداخت کرد؟"
    correct_option: "nine dollars"
    distractors: ["five dollars", "twelve dollars", "twenty dollars"]
    accepted_answers: [{value: "nine dollars", status: "correct"}]
    feedback: "متن می‌گه لیلا نه دلار پرداخت کرد."
  en.a1.unit51.lesson04.exercise02.reading_syrup_dosage:
    instruction: "طبق متن، لیلا کِی باید شربت سرفه رو بخوره؟"
    correct_option: "before bed"
    distractors: ["after breakfast", "every morning", "with lunch"]
    accepted_answers: [{value: "before bed", status: "correct"}]
    feedback: "متن می‌گه باید قبل از خواب بخوره."
  en.a1.unit51.lesson04.exercise03.reading_what_daniel_bought:
    instruction: "طبق متن، دنیل سر راه خونه برای لیلا چی خرید؟"
    correct_option: "tissues"
    distractors: ["flowers", "cough syrup", "a book"]
    accepted_answers: [{value: "tissues", status: "correct"}]
    feedback: "متن می‌گه دنیل یه بسته دستمال کاغذی خرید."
  en.a1.unit51.lesson04.exercise04.write_own_pharmacy_message:
    instruction: "یه پیام کوتاه بنویسین: بگین لیلا چه علائمی داشت، و بگین چقدر پرداخت کرد."
    accepted_answers: ["She had a cough and a runny nose. She paid nine dollars.", "She had a cough and a runny nose, and she paid nine dollars.", "She had a cough and a runny nose, she paid nine dollars."]
    feedback: "می‌تونین بگین *She had a cough and a runny nose, and she paid nine dollars.*"
