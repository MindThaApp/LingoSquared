    instruction: "گوش کنین و کلمه‌ای که گفته شده را انتخاب کنین."
    correct_option: "weekend"
    distractors: ["rain", "free time", "paint"]
    accepted_answers: [{value: "weekend", status: "correct"}]
    feedback: "weekend یعنی آخر هفته."
  en.b1.unit03.lesson01.exercise02.choose_water_from_sky_word:
    instruction: "کدام کلمه به معنای آبیه که از آسمون می‌باره؟"
    correct_option: "rain"
    distractors: ["weekend", "free time", "paint"]
    accepted_answers: [{value: "rain", status: "correct"}]
