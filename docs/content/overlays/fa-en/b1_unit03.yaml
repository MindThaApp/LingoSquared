course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح میانی (B1) برای فارسی‌زبان‌ها، با تمرکز بر بیان ضرورت، توانایی، شرط، بحث و کار، همراه با توضیحات دقیق فارسی."

units:
  en.b1.unit03.hypotheticals: {title: "اگه بارون بیاد، اگه وقت داشتم"}

lessons:
  en.b1.unit03.lesson01.conditional_vocabulary: {title: "if، rain و free time"}
  en.b1.unit03.lesson02.real_conditions: {title: "اگه بارون بیاد، خونه می‌مونیم"}
  en.b1.unit03.lesson03.reading_more_free_time: {title: "متن: اگه وقت آزاد بیشتری داشت"}
  en.b1.unit03.lesson04.the_weekend_plans_dialogue: {title: "اگه یکی دیگه بود، باید بری"}

teaching:
  en.b1.unit03.lesson01.teach.if: {title: "if", gloss: "اگه", note: "if یه شرط رو معرفی می‌کنه.", example_gloss: "اگه بارون بیاد، خونه می‌مونیم."}
  en.b1.unit03.lesson01.teach.rain: {title: "rain", gloss: "بارون", note: "rain یعنی آبی که از آسمون می‌باره.", example_gloss: "ممکنه این آخر هفته بارون بیاد."}
  en.b1.unit03.lesson01.teach.stay_home: {title: "stay home", gloss: "خونه موندن", note: "stay home یعنی بیرون نرفتن و توی خونه موندن.", example_gloss: "اگه بارون بیاد، خونه می‌مونیم."}
  en.b1.unit03.lesson01.teach.weekend: {title: "weekend", gloss: "آخر هفته", note: "weekend یعنی شنبه و یکشنبه.", example_gloss: "برنامه‌ات برای آخر هفته چیه؟"}
  en.b1.unit03.lesson01.teach.free_time: {title: "free time", gloss: "وقت آزاد", note: "free time یعنی ساعت‌هایی که کار یا مشغله ندارین.", example_gloss: "این روزها وقت آزاد زیادی ندارم."}
  en.b1.unit03.lesson01.teach.paint: {title: "paint", gloss: "نقاشی کردن", note: "paint یعنی با رنگ یه تصویر درست کردن.", example_gloss: "لیلا آخر هفته‌ها عاشق نقاشی کردنه."}

  en.b1.unit03.lesson02.teach.if_rains_stay_home: {title: "If it rains tomorrow, we will stay home.", gloss: "اگه فردا بارون بیاد، خونه می‌مونیم.", note: "شرط واقعی/ممکن: if + زمان حال ساده، will + فعل ساده در جملهٔ نتیجه."}
  en.b1.unit03.lesson02.teach.if_have_free_time_paint: {title: "If I have free time this weekend, I will paint.", gloss: "اگه این آخر هفته وقت آزاد داشته باشم، نقاشی می‌کنم.", note: "همون ساختار if + حال ساده، will + فعل ساده -- برای یه احتمال واقعی در آینده."}
  en.b1.unit03.lesson02.teach.grammar_real_condition: {title: "شرط واقعی/ممکن", gloss: "اگه بارون بیاد، خونه می‌مونیم. اگه وقت داشته باشم، نقاشی می‌کنم.", note: "این شرط دربارهٔ چیزیه که واقعاً ممکنه اتفاق بیفته -- برخلاف شرط غیرواقعی که توی درس بعدی می‌بینین."}

  en.b1.unit03.lesson03.teach.would: {title: "would", gloss: "بود/می‌شد (فرضی)", note: "would برای بیان نتیجهٔ یه شرط فرضی یا غیرواقعی استفاده می‌شه.", example_gloss: "اگه وقت بیشتری داشتم، هر روز نقاشی می‌کردم."}
  en.b1.unit03.lesson03.teach.class: {title: "class", gloss: "کلاس", note: "class یعنی یه درس سازمان‌یافته با یه معلم.", example_gloss: "یه کلاس نقاشی نزدیک خونه‌اش بود."}
  en.b1.unit03.lesson03.teach.reading_passage: {title: "متن: اگه وقت آزاد بیشتری داشت", gloss: "لیلا عاشق نقاشیه، ولی وقت آزاد زیادی نداره. اگه وقت آزاد بیشتری داشت، هر روز نقاشی می‌کرد. ماه پیش، یه کلاس نقاشی نزدیک خونه‌اش بود. اگه زودتر ازش خبردار می‌شد، ثبت‌نام می‌کرد. حالا هر هفته دنبال کلاس‌های جدید می‌گرده.", note: "این متن شرط غیرواقعی حال (اگه وقت داشت...) رو با شرط غیرواقعی گذشته (اگه زودتر خبردار می‌شد...) مقایسه می‌کنه."}

  en.b1.unit03.lesson04.teach.q_weekend_plans: {title: "پرسش دنیل", gloss: "دنیل می‌پرسه برنامه‌ات برای آخر هفته چیه؟", note: "این یه سؤال معمولی برای شروع صحبت دربارهٔ برنامه‌هاست."}
  en.b1.unit03.lesson04.teach.a_walk_or_stay_home: {title: "جواب لیلا", gloss: "لیلا می‌گه اگه بارون نیاد، پیاده‌روی می‌کنم. اگه بارون بیاد، خونه می‌مونم و نقاشی می‌کنم.", note: "این جمله دو شرط واقعی/ممکن رو با هم مقایسه می‌کنه: بارون نیاد در برابر بارون بیاد."}
  en.b1.unit03.lesson04.teach.q_take_class: {title: "پرسش دنیل", gloss: "دنیل می‌گه چه خوب. اون کلاس نقاشی ماه پیش رو رفتی؟", note: "این سؤال دربارهٔ یه رویداد گذشته‌ست."}
  en.b1.unit03.lesson04.teach.a_would_have_signed_up: {title: "جواب لیلا", gloss: "لیلا می‌گه نه، نرفتم. اگه زودتر ازش خبردار می‌شدم، ثبت‌نام می‌کردم.", note: "شرط غیرواقعی گذشته: if + گذشتهٔ کامل (had known)، would have + قسمت سوم فعل (signed up) -- افسوس از یه فرصت ازدست‌رفته."}
  en.b1.unit03.lesson04.teach.q_should_join: {title: "پیشنهاد دنیل", gloss: "دنیل می‌گه حیف شد. اگه یه کلاس دیگه باشه، باید بری.", note: "این یه شرط واقعی/ممکن برای آینده‌ست، همراه با should برای توصیه."}
  en.b1.unit03.lesson04.teach.a_will_sign_up: {title: "جواب لیلا", gloss: "لیلا می‌گه حق با توئه. اگه یکی رو ببینم، فوراً ثبت‌نام می‌کنم.", note: "این جمله به شرط واقعی/ممکن برمی‌گرده: if + حال ساده، will + فعل ساده."}

exercises:
