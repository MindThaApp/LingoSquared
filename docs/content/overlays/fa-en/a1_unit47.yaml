review: {status: "reviewed", required_next_reviewer: null, notes: "New overlay against the shared English realization unit47 (appointments), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1, every teaching card with a realization example: has a matching example_gloss:. Contrastive-grammar points, deliberately different from ones already used in this direction: (1) That time works for me idiomatically uses work to mean 'be convenient/suitable' -- Persian's natural equivalent (برام خوبه, literally 'is good for me') is built on the adjective خوب, not a work-related verb, so the note flags that translating work here as کار کردن would be wrong and the whole idiom must be learned as a chunk; (2) Your appointment is confirmed is a be + past-participle passive describing a current STATE -- Persian's passive is built on شدن ('become') rather than بودن ('be'), so a literal calque tends toward a completed-event reading (تأیید شد, 'became confirmed') rather than a state reading, and the note flags this aux-verb mismatch as the reason a word-for-word passive translation can feel subtly off; (3) the preposition paradigm across recent units -- Are you available ON Friday? (day) versus in the summer (unit44, season) versus at 3pm (unit05, clock time) -- English picks a different preposition depending on the TIME GRANULARITY named, a three-way system Persian doesn't mirror at all (جمعه وقت داری؟ needs no preposition whatsoever), so the note explicitly cross-references the on/in/at paradigm as one system worth drilling together rather than memorizing on Friday in isolation. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, NOT translated Persian lefts, per the established compiler-driven precedent. lesson03/lesson04 multiple_choice and listen_select distractor sets copied verbatim from the realization's own review notes documenting the exact invented, never-spoken-in-this-unit values already verified safe (lesson03.exercise03's distractors were invented fresh here, matching the realization's own note that no other time value appears anywhere else in this dialogue). Strong sibling-isolation rule applied -- nl-en/prs-en overlays for this unit were not consulted. Needs the mandatory fresh-context review before shipping.\n\nfa-en review 2026-10-19: Checked notes, glosses, Persian style, distractors vs taught vocabulary, answer keys, canon. 12 fixes: on-Friday note claimed 'at 3pm' was already taught (it comes in lesson03); reading gloss tense (said) and 'service' wording; 7 untaught distractors replaced (sick/vaccine/noon/reminder/email/collar/haircut); speak_response and writing-prompt variants added (book an appointment, Is Thursday available?, What time works for you?). Shared-en r2 review 2026-10-22: accepted answers widened to match the realization (lesson01.exercise05, lesson02.exercise05, lesson03.exercise04, lesson04.exercise04)."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit47.appointments: {title: "گرفتن نوبت"}

lessons:
  en.a1.unit47.lesson01.appointments_vocabulary: {title: "کلمات نوبت گرفتن"}
  en.a1.unit47.lesson02.making_an_appointment: {title: "گرفتن نوبت"}
  en.a1.unit47.lesson03.dialogue_booking_a_vet_appointment: {title: "گفتگو: گرفتن نوبت دامپزشک"}
  en.a1.unit47.lesson04.how_to_make_an_appointment: {title: "متن: چطور نوبت بگیریم"}

teaching:
  en.a1.unit47.lesson01.teach.appointment: {title: "appointment", gloss: "نوبت / قرار ملاقات", note: "*appointment* یعنی یه قرار ملاقات از پیش تعیین‌شده.", example_gloss: "پنج‌شنبه یه نوبت دارم."}
  en.a1.unit47.lesson01.teach.available: {title: "available", gloss: "آزاد / در دسترس", note: "*available* یعنی آزاد بودن برای یه کاری توی یه زمان خاص.", example_gloss: "پنج‌شنبه آزادین؟"}
  en.a1.unit47.lesson01.teach.book: {title: "book", gloss: "رزرو کردن", note: "*book* اینجا فعله، یعنی رزرو کردن؛ با *book* به‌معنی کتاب قاطی نشه.", example_gloss: "می‌خوام یه نوبت رزرو کنم."}
  en.a1.unit47.lesson01.teach.confirm: {title: "confirm", gloss: "تأیید کردن", note: "*confirm* یعنی تأیید کردن -- گفتن اینکه چیزی قطعیه.", example_gloss: "می‌تونین ساعتشو تأیید کنین؟"}
  en.a1.unit47.lesson01.teach.reschedule: {title: "reschedule", gloss: "زمان یه چیزو عوض کردن", note: "*reschedule* یعنی زمان یه چیز از قبل برنامه‌ریزی‌شده رو تغییر دادن.", example_gloss: "می‌شه برای جمعه عوضش کنیم؟"}

  en.a1.unit47.lesson02.teach.id_like_to_make_an_appointment: {title: "I'd like to make an appointment.", gloss: "می‌خوام یه نوبت بگیرم.", note: "*I'd like to make an appointment* -- عبارت رسمی و مؤدبانه برای شروع گرفتن نوبت."}
  en.a1.unit47.lesson02.teach.are_you_available_on_friday: {title: "Are you available on Friday?", gloss: "جمعه وقت آزاد دارین؟", note: "*ON Friday* -- انگلیسی برای اسم روزها از حرف اضافهٔ *on* استفاده می‌کنه (برخلاف فصل‌ها که با *in* میان، مثل *in the summer*)؛ فارسی هیچ حرف اضافه‌ای نمی‌خواد -- فقط «جمعه»."}
  en.a1.unit47.lesson02.teach.what_time_works_for_you: {title: "What time works for you?", gloss: "چه ساعتی براتون خوبه؟", note: "*works for you* -- اصطلاحه، یعنی «مناسبته»؛ فارسی از صفت «خوب» استفاده می‌کنه، نه فعلی مثل «کار کردن»."}
  en.a1.unit47.lesson02.teach.that_time_works_for_me: {title: "That time works for me.", gloss: "اون ساعت برام خوبه.", note: "*works for me* -- همون اصطلاح، این‌بار برای اول‌شخص."}
  en.a1.unit47.lesson02.teach.can_we_reschedule_for_monday: {title: "Can we reschedule for Monday?", gloss: "می‌شه برای دوشنبه عوضش کنیم؟", note: "*Can we...?* -- درخواست مؤدبانه برای یه کار مشترک."}
  en.a1.unit47.lesson02.teach.your_appointment_is_confirmed: {title: "Your appointment is confirmed.", gloss: "نوبتتون تأیید شد.", note: "*is confirmed* -- فعل مجهول با *be* + اسم مفعولی، برای توصیف یه وضعیت؛ فارسی مجهولشو با فعل «شدن» می‌سازه («تأیید شد»)، نه «بودن» -- ترجمهٔ کلمه‌به‌کلمه این ساختارو اشتباه می‌کنه."}

  en.a1.unit47.lesson03.teach.dialogue_line1: {title: "نگرانی میا", gloss: "میا می‌پرسه مکس خوبه؟ اخیراً یه‌کم خسته به‌نظر می‌رسه.", note: "*seems a little tired* -- فعل *seem* برای بیان یه برداشت، نه یه واقعیت قطعی."}
  en.a1.unit47.lesson03.teach.dialogue_line2: {title: "جواب لیلا", gloss: "لیلا می‌گه حالش خوبه، نگران نباش. فقط وقت چکاپ سالانه‌شه. باید زنگ بزنه دامپزشک.", note: "*He's just due for his yearly checkup* -- *due for* یعنی وقتشه."}
  en.a1.unit47.lesson03.teach.dialogue_line3: {title: "تماس لیلا", gloss: "لیلا می‌گه سلام، می‌خوام برای چکاپ سگم نوبت بگیرم.", note: "*I'd like to make an appointment for...* -- الگوی مؤدبانه که تازه یاد گرفتیم."}
  en.a1.unit47.lesson03.teach.dialogue_line4: {title: "سؤال میا", gloss: "میا می‌پرسه چی گفتن؟", note: "*What did they say?* -- سؤال با گذشتهٔ ساده."}
  en.a1.unit47.lesson03.teach.dialogue_line5: {title: "جواب لیلا", gloss: "لیلا می‌گه پنج‌شنبه ساعت سه بعدازظهر آزادن.", note: "*They're available on Thursday at 3pm* -- ترکیب *on* برای روز و *at* برای ساعت."}
  en.a1.unit47.lesson03.teach.dialogue_line6: {title: "سؤال میا", gloss: "میا می‌پرسه اون ساعت براش خوبه؟", note: "*Does that time work for you?* -- سؤال با فعل کمکی *does* چون *time* سوم‌شخص مفرده."}
  en.a1.unit47.lesson03.teach.dialogue_line7: {title: "تأیید لیلا", gloss: "لیلا می‌گه آره، برام خوبه. پنج‌شنبه ساعت سه -- ممنون! نوبت مکس تأیید شد.", note: "*Max's appointment is confirmed* -- فعل مجهول که تازه یاد گرفتیم."}

  en.a1.unit47.lesson04.teach.reading_passage: {title: "متن: چطور نوبت بگیریم", gloss: "چطور نوبت بگیریم: اگه باید برین دکتر، دندون‌پزشک یا یه جای خدماتی دیگه، معمولاً اول باید نوبت بگیرین. زنگ بزنین و بگین می‌خواین نوبت بگیرین. مسئول پذیرش می‌گه کدوم روزا و ساعتا آزادن. یه ساعتی که براتون خوبه انتخاب کنین، و اونا نوبتتونو تأیید می‌کنن. اگه چیزی تغییر کرد، دوباره زنگ بزنین و بخواین عوضش کنن. هفتهٔ پیش، لیلا به دامپزشک زنگ زد تا برای چکاپ سالانهٔ سگش مکس نوبت بگیره. پنج‌شنبه ساعت سه بعدازظهر آزاد بودن، و لیلا اون ساعتو تأیید کرد. دنیل هم یه نوبت داره -- دوشنبه صبح برای چکاپ می‌ره دندون‌پزشک. گفت استرس نداره، فقط این هفته یه‌کم سرش شلوغه.", note: "دقت کنین *will tell you* و *will confirm* هر دو با *will* آینده رو نشون می‌دن -- پیش‌بینی یه کار بعدی."}

