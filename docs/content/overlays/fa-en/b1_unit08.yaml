course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح میانی (B1) برای فارسی‌زبان‌ها، با تمرکز بر شرط، توالی رویدادها، نقل قول غیرمستقیم، هدف و فرض‌های غیرواقعی."

units:
  en.b1.unit08.sequencing: {title: "قبل از، بعد از و به‌محض این که"}

lessons:
  en.b1.unit08.lesson01.sequencing_vocabulary: {title: "before، after و by the time"}
  en.b1.unit08.lesson02.present_and_future_sequences: {title: "وقتی برسم خونه، زنگ می‌زنم"}
  en.b1.unit08.lesson03.reading_an_evening_routine: {title: "متن: برنامهٔ عصرانه"}
  en.b1.unit08.lesson04.the_evening_plan_dialogue: {title: "به‌محض این که برسم خونه"}

teaching:
  en.b1.unit08.lesson01.teach.before: {title: "before", gloss: "قبل از، پیش از", note: "before یعنی یک اتفاق زودتر از اتفاق دیگر رخ می‌ده.", example_gloss: "قبل از این که آشپزی کنی، دست‌هات رو بشور."}
  en.b1.unit08.lesson01.teach.after: {title: "after", gloss: "بعد از", note: "after یعنی یک اتفاق دیرتر از اتفاق دیگر رخ می‌ده.", example_gloss: "بعد از این که کارت تموم شد، به من زنگ بزن."}
  en.b1.unit08.lesson01.teach.as_soon_as: {title: "as soon as", gloss: "به‌محض این که", note: "as soon as یعنی کاری فوراً بعد از اتفاقی دیگر انجام می‌شه.", example_gloss: "به‌محض این که برسم، بهت پیام می‌دم."}
  en.b1.unit08.lesson01.teach.by_the_time: {title: "by the time", gloss: "تا وقتی که، تا زمانی که", note: "by the time یعنی چیزی حداکثر تا لحظهٔ رخ دادن اتفاقی دیگر انجام یا آماده شده.", example_gloss: "تا وقتی میا برسه، شام آماده‌ست."}
  en.b1.unit08.lesson01.teach.check_in: {title: "check in", gloss: "خبر دادن از رسیدن یا سلامت", note: "check in یعنی به کسی خبر بدین که رسیدین یا حالتون خوبه.", example_gloss: "لطفاً وقتی به هتل رسیدی خبر بده."}
  en.b1.unit08.lesson01.teach.lock_up: {title: "lock up", gloss: "قفل کردن و ایمن کردن", note: "lock up یعنی اتاق یا ساختمان رو ببندین و قفل کنین.", example_gloss: "قبل از ترک اداره، درها رو قفل می‌کنم."}

  en.b1.unit08.lesson02.teach.as_soon_as_home: {title: "As soon as I get home, I will call you.", gloss: "به‌محض این که برسم خونه، بهت زنگ می‌زنم.", note: "در عبارت‌های زمانی دربارهٔ آینده، بعد از *as soon as* زمان حال ساده میاد: *I get home*، نه will get home."}
  en.b1.unit08.lesson02.teach.before_upstairs: {title: "Before you go upstairs, please check the mail.", gloss: "قبل از این که بری طبقهٔ بالا، لطفاً صندوق پست رو چک کن.", note: "*Before you go upstairs* کاری رو مشخص می‌کنه که باید قبل از رفتن به طبقهٔ بالا انجام بشه."}
  en.b1.unit08.lesson02.teach.grammar_future_time_clause: {title: "حال ساده در عبارت زمانی آینده", gloss: "وقتی برسم خونه، زنگ می‌زنم.", note: "در انگلیسی بعد از *when*، *before*، *after* و *as soon as* برای آینده معمولاً حال ساده میاد، و نتیجه با *will* ساخته می‌شه."}

  en.b1.unit08.lesson03.teach.front_door: {title: "front door", gloss: "درِ ورودی", note: "front door یعنی در اصلی ورودی خونه یا ساختمان.", example_gloss: "دنیل بعد از چک کردن صندوق پست، در ورودی رو قفل می‌کنه."}
  en.b1.unit08.lesson03.teach.ready: {title: "ready", gloss: "آماده", note: "ready یعنی چیزی آمادهٔ استفاده یا انجام شده.", example_gloss: "تا وقتی میا برسه، شام آماده‌ست."}
  en.b1.unit08.lesson03.teach.reading_passage: {title: "متن: برنامهٔ عصرانه", gloss: "دنیل یک برنامهٔ عصرانهٔ منظم داره. وقتی به خونه می‌رسه، اول صندوق پست رو چک می‌کنه. بعد از این که صندوق پست رو چک می‌کنه، در ورودی رو قفل می‌کنه. قبل از این که شام رو شروع کنه، دست‌هاش رو می‌شوره و میز رو خالی می‌کنه. تا وقتی میا می‌رسه، آشپزخونه آماده‌ست و غذا گرمه.", note: "این متن ترتیب چند کار رو با *when*، *after*، *before* و *by the time* نشان می‌ده."}

  en.b1.unit08.lesson04.teach.q_call_when_home: {title: "درخواست لیلا", gloss: "لیلا می‌پرسه دنیل، وقتی رسیدی خونه، می‌تونی به من زنگ بزنی؟", note: "*when you get home* زمان تماس رو مشخص می‌کنه."}
  en.b1.unit08.lesson04.teach.a_as_soon_as_home: {title: "جواب دنیل", gloss: "دنیل می‌گه حتماً. به‌محض این که برسم خونه، بهت زنگ می‌زنم.", note: "*As soon as* یعنی تماس فوراً بعد از رسیدن انجام می‌شه."}
  en.b1.unit08.lesson04.teach.q_check_mail: {title: "درخواست دوم لیلا", gloss: "لیلا می‌گه لطفاً قبل از این که بری طبقهٔ بالا، صندوق پست رو چک کن.", note: "*before* نشان می‌ده چک کردن صندوق پست باید اول انجام بشه."}
  en.b1.unit08.lesson04.teach.a_after_mail_lock: {title: "برنامهٔ دنیل", gloss: "دنیل می‌گه انجام می‌دم. بعد از این که صندوق پست رو چک کنم، در ورودی رو قفل می‌کنم.", note: "*After I check the mail* ترتیب کار بعدی رو مشخص می‌کنه."}
  en.b1.unit08.lesson04.teach.q_by_the_time_mia: {title: "جمع‌بندی لیلا", gloss: "لیلا می‌گه عالیه. تا وقتی میا برسه، همه‌چیز باید آماده باشه.", note: "*By the time Mia arrives* یعنی آماده بودن باید تا لحظهٔ رسیدن میا کامل شده باشه."}
  en.b1.unit08.lesson04.teach.a_start_dinner: {title: "جواب پایانی دنیل", gloss: "دنیل می‌گه اون‌وقت وقتی اون برسه، می‌تونیم شام رو شروع کنیم.", note: "در *when she arrives* هم برای آینده از حال ساده استفاده شده."}

