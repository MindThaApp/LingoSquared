course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit63.asking_for_help: {title: "کمک خواستن"}

lessons:
  en.a1.unit63.lesson01.help_words: {title: "واژه‌های کمک"}
  en.a1.unit63.lesson02.help_phrases: {title: "عبارت‌های کمک خواستن"}
  en.a1.unit63.lesson03.dialogue_helping_with_a_bag: {title: "گفتگو: کمک با یک کیف"}
