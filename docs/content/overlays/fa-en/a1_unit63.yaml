teaching:
  en.a1.unit63.lesson01.teach.help: {title: "help", gloss: "کمک کردن / کمک", note: "*help* یعنی برای کسی کاری مفید انجام دادن.", example_gloss: "می‌توانی به من کمک کنی؟"}
  en.a1.unit63.lesson01.teach.carry: {title: "carry", gloss: "حمل کردن", note: "*carry* یعنی چیزی رو برداشتن و جابه‌جا کردن.", example_gloss: "می‌تونم اونو حمل کنم."}
  en.a1.unit63.lesson01.teach.heavy: {title: "heavy", gloss: "سنگین", note: "*heavy* یعنی چیزی که بلند کردنش سخته.", example_gloss: "این سنگینه."}
  en.a1.unit63.lesson01.teach.bag: {title: "bag", gloss: "کیف / ساک", note: "*bag* یعنی چیزی که برای حمل وسایل استفاده می‌کنین.", example_gloss: "این کیف سنگینه."}
  en.a1.unit63.lesson01.teach.door: {title: "door", gloss: "در", note: "*door* یعنی بخشی از اتاق یا ساختمان که باز و بسته می‌شه.", example_gloss: "در رو باز کنین."}
  en.a1.unit63.lesson01.teach.shelf: {title: "shelf", gloss: "قفسه", note: "*shelf* یعنی جای صاف روی دیوار یا داخل کمد که وسایل روی اون قرار می‌گیرن.", example_gloss: "اونو روی قفسه بذارین."}

  en.a1.unit63.lesson02.teach.can_you_help: {title: "درخواست کمک", gloss: "می‌توانی به من کمک کنی؟", note: "*Can you help me?* یه روش ساده و مستقیم برای کمک خواستنه."}
  en.a1.unit63.lesson02.teach.bag_heavy: {title: "توضیح مشکل", gloss: "این کیف سنگینه.", note: "*This bag is heavy* دلیل نیاز به کمک رو توضیح می‌ده."}
  en.a1.unit63.lesson02.teach.open_door: {title: "درخواست باز کردن در", gloss: "می‌تونی در رو باز کنی؟", note: "*Could you ...?* از *Can you ...?* کمی مؤدبانه‌تره."}
  en.a1.unit63.lesson02.teach.i_can_help: {title: "پیشنهاد کمک", gloss: "می‌تونم کمک کنم.", note: "*I can help* یعنی من می‌تونم کمک کنم."}
  en.a1.unit63.lesson02.teach.thank_you_help: {title: "تشکر بابت کمک", gloss: "از کمکت ممنونم.", note: "*Thank you for your help* تشکر روشن و مستقیم برای کمکه."}
  en.a1.unit63.lesson02.teach.put_on_shelf: {title: "گذاشتن روی قفسه", gloss: "اونو روی قفسه بذار.", note: "*Put it on the shelf* می‌گه چیزی رو کجا قرار بدین."}

  en.a1.unit63.lesson03.teach.dialogue_line1: {title: "درخواست لیلا", gloss: "لیلا می‌گه: سلام دنیل. می‌تونی به من کمک کنی؟", note: "لیلا با *Can you help me?* مستقیم کمک می‌خواد."}
  en.a1.unit63.lesson03.teach.dialogue_line2: {title: "پاسخ دنیل", gloss: "دنیل می‌گه: البته. چی لازم داری؟", note: "*Of course* یعنی البته یا حتماً."}
  en.a1.unit63.lesson03.teach.dialogue_line3: {title: "توضیح لیلا", gloss: "لیلا می‌گه: این کیف سنگینه.", note: "لیلا دلیل کمک خواستن رو توضیح می‌ده."}
  en.a1.unit63.lesson03.teach.dialogue_line4: {title: "پیشنهاد دنیل", gloss: "دنیل می‌گه: می‌تونم اونو حمل کنم.", note: "*I can carry it* یعنی من می‌تونم اونو جابه‌جا کنم."}
  en.a1.unit63.lesson03.teach.dialogue_line5: {title: "درخواست دوم لیلا", gloss: "لیلا می‌پرسه: می‌تونی در رو هم باز کنی؟", note: "*too* یعنی هم؛ لیلا درخواست دیگه‌ای اضافه می‌کنه."}
  en.a1.unit63.lesson03.teach.dialogue_line6: {title: "سؤال دنیل", gloss: "دنیل می‌گه: بله. کیف رو روی قفسه بذارم؟", note: "دنیل دربارهٔ جای کیف سؤال می‌کنه."}
  en.a1.unit63.lesson03.teach.dialogue_line7: {title: "تشکر لیلا", gloss: "لیلا می‌گه: بله، لطفاً. از کمکت ممنونم.", note: "لیلا هم تأیید می‌کنه و هم تشکر می‌کنه."}
  en.a1.unit63.lesson03.teach.dialogue_line8: {title: "پاسخ دنیل", gloss: "دنیل می‌گه: مشکلی نیست.", note: "*No problem* پاسخ طبیعی به تشکره."}

  en.a1.unit63.lesson04.teach.help_note: {title: "متن: یادداشت کمک", gloss: "یادداشت کمک: کیف آبی سنگینه. لطفاً اونو روی قفسه نزدیک در بذارین.", note: "این یادداشت رنگ کیف، مشکل، و جای درست کیف رو مشخص می‌کنه."}
  en.a1.unit63.lesson04.teach.reading_passage: {title: "متن: همسایهٔ کمک‌کننده", gloss: "همسایهٔ کمک‌کننده: لیلا یه کیف آبی سنگین داشت. اون دنیل رو نزدیک در دید و کمک خواست. دنیل کیف رو به داخل حمل کرد. لیلا از اون خواست در رو هم باز کنه. سپس دنیل کیف رو روی قفسه نزدیک در گذاشت. لیلا از دنیل بابت کمکش تشکر کرد. دنیل گفت: مشکلی نیست. بعداً، لیلا یه یادداشت کوتاه نوشت: کیف آبی روی قفسه‌ست.", note: "این متن توضیح می‌ده لیلا چه کمکی خواست و دنیل چه کاری انجام داد."}

exercises:
  en.a1.unit63.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "heavy"
    distractors: ["light", "empty", "small", "ready"]
    accepted_answers: [{value: "heavy", status: "correct"}]
    feedback: "*heavy* یعنی سنگین."
  en.a1.unit63.lesson01.exercise02.choose_shelf_meaning:
    instruction: "کدوم کلمه یعنی جای صاف روی دیوار یا داخل کمد که وسایل روی اون قرار می‌گیرن؟"
    correct_option: "shelf"
    distractors: ["bag", "door", "carry"]
    accepted_answers: [{value: "shelf", status: "correct"}]
    feedback: "*shelf* یعنی قفسه."
  en.a1.unit63.lesson01.exercise03.match_help_words:
    instruction: "هر توضیح انگلیسی رو به کلمهٔ درستش وصل کنین."
    accepted_answers: [{value: [{left: "do something useful for someone", right: "help"}, {left: "hold and move something", right: "carry"}, {left: "hard to lift", right: "heavy"}, {left: "something you use to hold things", right: "bag"}, {left: "the part of a room you open to enter", right: "door"}, {left: "a flat place where things sit", right: "shelf"}], status: "correct"}]
    feedback: "help=کمک، carry=حمل کردن، heavy=سنگین، bag=کیف/ساک، door=در، shelf=قفسه."
  en.a1.unit63.lesson01.exercise04.order_heavy_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["This", "bag", "is", "heavy."], status: "correct"}]
    feedback: "ترتیب درست: *This bag is heavy.*"
  en.a1.unit63.lesson01.exercise05.write_carry:
    instruction: "کلمه‌ای رو بنویسین که یعنی چیزی رو برداشتن و جابه‌جا کردن."
    accepted_answers: [{value: "carry", status: "correct"}]
    feedback: "*carry* یعنی حمل کردن."

  en.a1.unit63.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "Can you help me?"
    distractors: ["Can you call me?", "Can you meet me?", "Can you hear me?"]
    accepted_answers: [{value: "Can you help me?", status: "correct"}]
    feedback: "*Can you help me?* یعنی می‌توانی به من کمک کنی؟"
  en.a1.unit63.lesson02.exercise02.choose_help_request:
    instruction: "کدوم عبارت درخواست کمک می‌کنه؟"
    correct_option: "Can you help me?"
    distractors: ["I can help.", "This bag is heavy.", "Thank you for your help."]
    accepted_answers: [{value: "Can you help me?", status: "correct"}]
    feedback: "*Can you help me?* درخواست کمکه."
  en.a1.unit63.lesson02.exercise03.choose_door_request:
    instruction: "کدوم عبارت از کسی می‌خواد در رو باز کنه؟"
    correct_option: "Could you open the door?"
    distractors: ["Can you help me?", "Put it on the shelf.", "I can help."]
    accepted_answers: [{value: "Could you open the door?", status: "correct"}]
    feedback: "*Could you open the door?* یعنی می‌تونی در رو باز کنی؟"
  en.a1.unit63.lesson02.exercise04.order_shelf_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["Put", "it", "on", "the", "shelf."], status: "correct"}]
    feedback: "ترتیب درست: *Put it on the shelf.*"
  en.a1.unit63.lesson02.exercise05.translate_bag_heavy:
    instruction: "ترجمه کنین: «این کیف سنگینه.»"
    accepted_answers: [{value: "This bag is heavy.", status: "correct"}, {value: "This bag is heavy", status: "correct"}]
    feedback: "*This bag is heavy* یعنی این کیف سنگینه."

  en.a1.unit63.lesson03.exercise01.comprehension_item:
    instruction: "طبق گفتگو، چی سنگینه؟"
    correct_option: "bag"
    distractors: ["door", "shelf", "phone"]
    accepted_answers: [{value: "bag", status: "correct"}]
    feedback: "لیلا می‌گه کیف سنگینه."
  en.a1.unit63.lesson03.exercise02.comprehension_place:
    instruction: "طبق گفتگو، دنیل می‌تونه کیف رو کجا بذاره؟"
    correct_option: "shelf"
    distractors: ["door", "floor", "table"]
    accepted_answers: [{value: "shelf", status: "correct"}]
    feedback: "دنیل دربارهٔ گذاشتن کیف روی قفسه سؤال می‌کنه."
  en.a1.unit63.lesson03.exercise03.listen_dialogue_help_request:
    instruction: "لیلا کدوم درخواست رو می‌گه؟"
    correct_option: "Can you help me?"
    distractors: ["Can you call me?", "Can you wait here?", "Can you write this?"]
    accepted_answers: [{value: "Can you help me?", status: "correct"}]
    feedback: "لیلا می‌گه: *Can you help me?*"
  en.a1.unit63.lesson03.exercise04.respond_own_help_request:
    instruction: "کمک بخواین، مشکل رو توضیح بدین، یا از کسی تشکر کنین."
    accepted_answers: ["Can you help me", "Can you help me?", "This bag is heavy", "This bag is heavy.", "Could you open the door", "Could you open the door?", "Thank you for your help", "Thank you for your help."]
    feedback: "می‌تونین بگین *Can you help me?* یا *Thank you for your help.*"

  en.a1.unit63.lesson04.exercise01.note_bag_color:
    instruction: "طبق یادداشت، کیف چه رنگیه؟"
    correct_option: "blue"
    distractors: ["red", "green", "black"]
    accepted_answers: [{value: "blue", status: "correct"}]
    feedback: "یادداشت می‌گه کیف آبیه."
  en.a1.unit63.lesson04.exercise02.note_bag_place:
    instruction: "طبق یادداشت، کیف باید کجا بره؟"
    correct_option: "shelf"
    distractors: ["door", "table", "floor"]
    accepted_answers: [{value: "shelf", status: "correct"}]
    feedback: "یادداشت می‌گه کیف باید روی قفسه گذاشته بشه."
  en.a1.unit63.lesson04.exercise03.reading_who_helped:
    instruction: "طبق متن، کی به لیلا کمک کرد؟"
    correct_option: "Daniel"
    distractors: ["Mia", "Leila", "the clerk"]
    accepted_answers: [{value: "Daniel", status: "correct"}]
    feedback: "متن می‌گه دنیل به لیلا کمک کرد."
  en.a1.unit63.lesson04.exercise04.reading_what_did_daniel_do:
    instruction: "طبق متن، دنیل چه کار کرد؟"
    correct_option: "carried the bag"
    distractors: ["called Mia", "checked a balance", "sent a message"]
    accepted_answers: [{value: "carried the bag", status: "correct"}]
    feedback: "متن می‌گه دنیل کیف رو حمل کرد."
  en.a1.unit63.lesson04.exercise05.write_own_help_message:
    instruction: "یه پیام کوتاه بنویسین: بگین کیف سنگینه و کمک بخواین."
    accepted_answers: ["This bag is heavy. Can you help me?", "This bag is heavy, can you help me?", "This bag is heavy and can you help me?"]
    feedback: "می‌تونین بنویسین: *This bag is heavy. Can you help me?*"
