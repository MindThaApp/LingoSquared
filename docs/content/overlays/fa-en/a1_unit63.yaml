teaching:
  en.a1.unit63.lesson01.teach.help: {title: "help", gloss: "کمک کردن / کمک", note: "*help* یعنی برای کسی کاری مفید انجام دادن.", example_gloss: "می‌توانی به من کمک کنی؟"}
  en.a1.unit63.lesson01.teach.carry: {title: "carry", gloss: "حمل کردن", note: "*carry* یعنی چیزی را برداشتن و جابه‌جا کردن.", example_gloss: "می‌توانم آن را حمل کنم."}
  en.a1.unit63.lesson01.teach.heavy: {title: "heavy", gloss: "سنگین", note: "*heavy* یعنی چیزی که بلند کردنش سخت است.", example_gloss: "این سنگین است."}
  en.a1.unit63.lesson01.teach.bag: {title: "bag", gloss: "کیف / ساک", note: "*bag* یعنی چیزی که برای حمل وسایل استفاده می‌کنید.", example_gloss: "این کیف سنگین است."}
  en.a1.unit63.lesson01.teach.door: {title: "door", gloss: "در", note: "*door* یعنی بخشی از اتاق یا ساختمان که باز و بسته می‌شود.", example_gloss: "در را باز کنید."}
  en.a1.unit63.lesson01.teach.shelf: {title: "shelf", gloss: "قفسه", note: "*shelf* یعنی جای صاف روی دیوار یا داخل کمد که وسایل روی آن قرار می‌گیرند.", example_gloss: "آن را روی قفسه بگذارید."}

  en.a1.unit63.lesson02.teach.can_you_help: {title: "درخواست کمک", gloss: "می‌توانی به من کمک کنی؟", note: "*Can you help me?* یک روش ساده و مستقیم برای کمک خواستن است."}
  en.a1.unit63.lesson02.teach.bag_heavy: {title: "توضیح مشکل", gloss: "این کیف سنگین است.", note: "*This bag is heavy* دلیل نیاز به کمک را توضیح می‌دهد."}
  en.a1.unit63.lesson02.teach.open_door: {title: "درخواست باز کردن در", gloss: "می‌توانی در را باز کنی؟", note: "*Could you ...?* از *Can you ...?* کمی مؤدبانه‌تر است."}
  en.a1.unit63.lesson02.teach.i_can_help: {title: "پیشنهاد کمک", gloss: "می‌توانم کمک کنم.", note: "*I can help* یعنی من می‌توانم کمک کنم."}
  en.a1.unit63.lesson02.teach.thank_you_help: {title: "تشکر بابت کمک", gloss: "از کمکت ممنونم.", note: "*Thank you for your help* تشکر روشن و مستقیم برای کمک است."}
  en.a1.unit63.lesson02.teach.put_on_shelf: {title: "گذاشتن روی قفسه", gloss: "آن را روی قفسه بگذار.", note: "*Put it on the shelf* می‌گوید چیزی را کجا قرار دهید."}

  en.a1.unit63.lesson03.teach.dialogue_line1: {title: "درخواست لیلا", gloss: "لیلا می‌گوید: سلام دنیل. می‌توانی به من کمک کنی؟", note: "لیلا با *Can you help me?* مستقیم کمک می‌خواهد."}
  en.a1.unit63.lesson03.teach.dialogue_line2: {title: "پاسخ دنیل", gloss: "دنیل می‌گوید: البته. چه لازم داری؟", note: "*Of course* یعنی البته یا حتماً."}
  en.a1.unit63.lesson03.teach.dialogue_line3: {title: "توضیح لیلا", gloss: "لیلا می‌گوید: این کیف سنگین است.", note: "لیلا دلیل کمک خواستن را توضیح می‌دهد."}
  en.a1.unit63.lesson03.teach.dialogue_line4: {title: "پیشنهاد دنیل", gloss: "دنیل می‌گوید: می‌توانم آن را حمل کنم.", note: "*I can carry it* یعنی من می‌توانم آن را جابه‌جا کنم."}
  en.a1.unit63.lesson03.teach.dialogue_line5: {title: "درخواست دوم لیلا", gloss: "لیلا می‌پرسد: می‌توانی در را هم باز کنی؟", note: "*too* یعنی هم؛ لیلا درخواست دیگری اضافه می‌کند."}
  en.a1.unit63.lesson03.teach.dialogue_line6: {title: "سؤال دنیل", gloss: "دنیل می‌گوید: بله. کیف را روی قفسه بگذارم؟", note: "دنیل دربارهٔ جای کیف سؤال می‌کند."}
  en.a1.unit63.lesson03.teach.dialogue_line7: {title: "تشکر لیلا", gloss: "لیلا می‌گوید: بله، لطفاً. از کمکت ممنونم.", note: "لیلا هم تأیید می‌کند و هم تشکر می‌کند."}
  en.a1.unit63.lesson03.teach.dialogue_line8: {title: "پاسخ دنیل", gloss: "دنیل می‌گوید: مشکلی نیست.", note: "*No problem* پاسخ طبیعی به تشکر است."}

  en.a1.unit63.lesson04.teach.help_note: {title: "متن: یادداشت کمک", gloss: "یادداشت کمک: کیف آبی سنگین است. لطفاً آن را روی قفسه نزدیک در بگذارید.", note: "این یادداشت رنگ کیف، مشکل، و جای درست کیف را مشخص می‌کند."}
  en.a1.unit63.lesson04.teach.reading_passage: {title: "متن: همسایهٔ کمک‌کننده", gloss: "همسایهٔ کمک‌کننده: لیلا یک کیف آبی سنگین داشت. او دنیل را نزدیک در دید و کمک خواست. دنیل کیف را به داخل حمل کرد. لیلا از او خواست در را هم باز کند. سپس دنیل کیف را روی قفسه نزدیک در گذاشت. لیلا از دنیل بابت کمکش تشکر کرد. دنیل گفت: مشکلی نیست. بعداً، لیلا یک یادداشت کوتاه نوشت: کیف آبی روی قفسه است.", note: "این متن توضیح می‌دهد لیلا چه کمکی خواست و دنیل چه کاری انجام داد."}

exercises:
  en.a1.unit63.lesson01.exercise01.listen_word:
    instruction: "گوش کنید و کلمه‌ای را که گفته شد انتخاب کنید."
    correct_option: "heavy"
    distractors: ["light", "empty", "small", "ready"]
    accepted_answers: [{value: "heavy", status: "correct"}]
    feedback: "*heavy* یعنی سنگین."
  en.a1.unit63.lesson01.exercise02.choose_shelf_meaning:
    instruction: "کدام کلمه یعنی جای صاف روی دیوار یا داخل کمد که وسایل روی آن قرار می‌گیرند؟"
    correct_option: "shelf"
    distractors: ["bag", "door", "carry"]
    accepted_answers: [{value: "shelf", status: "correct"}]
    feedback: "*shelf* یعنی قفسه."
  en.a1.unit63.lesson01.exercise03.match_help_words:
    instruction: "هر توضیح انگلیسی را به کلمهٔ درست وصل کنید."
    accepted_answers: [{value: [{left: "do something useful for someone", right: "help"}, {left: "hold and move something", right: "carry"}, {left: "hard to lift", right: "heavy"}, {left: "something you use to hold things", right: "bag"}, {left: "the part of a room you open to enter", right: "door"}, {left: "a flat place where things sit", right: "shelf"}], status: "correct"}]
    feedback: "help=کمک، carry=حمل کردن، heavy=سنگین، bag=کیف/ساک، door=در، shelf=قفسه."
  en.a1.unit63.lesson01.exercise04.order_heavy_sentence:
    instruction: "کلمات را به ترتیب درست بچینید."
    accepted_answers: [{value: ["This", "bag", "is", "heavy."], status: "correct"}]
    feedback: "ترتیب درست: *This bag is heavy.*"
  en.a1.unit63.lesson01.exercise05.write_carry:
    instruction: "کلمه‌ای را بنویسید که یعنی چیزی را برداشتن و جابه‌جا کردن."
    accepted_answers: [{value: "carry", status: "correct"}]
    feedback: "*carry* یعنی حمل کردن."

  en.a1.unit63.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنید و عبارتی را که شنیدید انتخاب کنید."
    correct_option: "Can you help me?"
    distractors: ["Can you call me?", "Can you meet me?", "Can you hear me?"]
    accepted_answers: [{value: "Can you help me?", status: "correct"}]
    feedback: "*Can you help me?* یعنی می‌توانی به من کمک کنی؟"
  en.a1.unit63.lesson02.exercise02.choose_help_request:
    instruction: "کدام عبارت درخواست کمک می‌کند؟"
    correct_option: "Can you help me?"
    distractors: ["I can help.", "This bag is heavy.", "Thank you for your help."]
    accepted_answers: [{value: "Can you help me?", status: "correct"}]
    feedback: "*Can you help me?* درخواست کمک است."
  en.a1.unit63.lesson02.exercise03.choose_door_request:
    instruction: "کدام عبارت از کسی می‌خواهد در را باز کند؟"
    correct_option: "Could you open the door?"
    distractors: ["Can you help me?", "Put it on the shelf.", "I can help."]
    accepted_answers: [{value: "Could you open the door?", status: "correct"}]
    feedback: "*Could you open the door?* یعنی می‌توانی در را باز کنی؟"
  en.a1.unit63.lesson02.exercise04.order_shelf_sentence:
    instruction: "کلمات را به ترتیب درست بچینید."
    accepted_answers: [{value: ["Put", "it", "on", "the", "shelf."], status: "correct"}]
    feedback: "ترتیب درست: *Put it on the shelf.*"
  en.a1.unit63.lesson02.exercise05.translate_bag_heavy:
    instruction: "ترجمه کنید: «این کیف سنگین است.»"
    accepted_answers: [{value: "This bag is heavy.", status: "correct"}, {value: "This bag is heavy", status: "correct"}]
    feedback: "*This bag is heavy* یعنی این کیف سنگین است."

  en.a1.unit63.lesson03.exercise01.comprehension_item:
    instruction: "طبق گفتگو، چه چیزی سنگین است؟"
    correct_option: "bag"
    distractors: ["door", "shelf", "phone"]
    accepted_answers: [{value: "bag", status: "correct"}]
    feedback: "لیلا می‌گوید کیف سنگین است."
  en.a1.unit63.lesson03.exercise02.comprehension_place:
    instruction: "طبق گفتگو، دنیل می‌تواند کیف را کجا بگذارد؟"
    correct_option: "shelf"
    distractors: ["door", "floor", "table"]
    accepted_answers: [{value: "shelf", status: "correct"}]
    feedback: "دنیل دربارهٔ گذاشتن کیف روی قفسه سؤال می‌کند."
  en.a1.unit63.lesson03.exercise03.listen_dialogue_help_request:
    instruction: "لیلا کدام درخواست را می‌گوید؟"
    correct_option: "Can you help me?"
    distractors: ["Can you call me?", "Can you wait here?", "Can you write this?"]
    accepted_answers: [{value: "Can you help me?", status: "correct"}]
    feedback: "لیلا می‌گوید: *Can you help me?*"
  en.a1.unit63.lesson03.exercise04.respond_own_help_request:
    instruction: "کمک بخواهید، مشکل را توضیح دهید، یا از کسی تشکر کنید."
    accepted_answers: ["Can you help me", "Can you help me?", "This bag is heavy", "This bag is heavy.", "Could you open the door", "Could you open the door?", "Thank you for your help", "Thank you for your help."]
    feedback: "می‌توانید بگویید *Can you help me?* یا *Thank you for your help.*"

  en.a1.unit63.lesson04.exercise01.note_bag_color:
    instruction: "طبق یادداشت، کیف چه رنگی است؟"
    correct_option: "blue"
    distractors: ["red", "green", "black"]
    accepted_answers: [{value: "blue", status: "correct"}]
    feedback: "یادداشت می‌گوید کیف آبی است."
  en.a1.unit63.lesson04.exercise02.note_bag_place:
    instruction: "طبق یادداشت، کیف باید کجا برود؟"
    correct_option: "shelf"
    distractors: ["door", "table", "floor"]
    accepted_answers: [{value: "shelf", status: "correct"}]
    feedback: "یادداشت می‌گوید کیف باید روی قفسه گذاشته شود."
  en.a1.unit63.lesson04.exercise03.reading_who_helped:
    instruction: "طبق متن، چه کسی به لیلا کمک کرد؟"
    correct_option: "Daniel"
    distractors: ["Mia", "Leila", "the clerk"]
    accepted_answers: [{value: "Daniel", status: "correct"}]
    feedback: "متن می‌گوید دنیل به لیلا کمک کرد."
  en.a1.unit63.lesson04.exercise04.reading_what_did_daniel_do:
    instruction: "طبق متن، دنیل چه کار کرد؟"
    correct_option: "carried the bag"
    distractors: ["called Mia", "checked a balance", "sent a message"]
    accepted_answers: [{value: "carried the bag", status: "correct"}]
    feedback: "متن می‌گوید دنیل کیف را حمل کرد."
  en.a1.unit63.lesson04.exercise05.write_own_help_message:
    instruction: "یک پیام کوتاه بنویسید: بگویید کیف سنگین است و کمک بخواهید."
    accepted_answers: ["This bag is heavy. Can you help me?", "This bag is heavy, can you help me?", "This bag is heavy and can you help me?"]
    feedback: "می‌توانید بنویسید: *This bag is heavy. Can you help me?*"
