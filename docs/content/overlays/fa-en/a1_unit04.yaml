exercises:
  en.a1.unit04.lesson01.exercise01.listen_weekday:
    instruction: "گوش کنید و روز هفتهٔ گفته‌شده را انتخاب کنید."
    correct_option: "چهارشنبه"
    distractors: ["دوشنبه", "جمعه", "یکشنبه"]
    accepted_answers: [{value: "چهارشنبه", status: "correct"}]
    feedback: "Wednesday یعنی چهارشنبه."
  en.a1.unit04.lesson01.exercise02.choose_weekend:
    instruction: "روزی را انتخاب کنید که در آمریکا جزو آخر هفته است."
    correct_option: "Saturday"
    distractors: ["Monday", "Wednesday", "Friday"]
    accepted_answers: [{value: "Saturday", status: "correct"}]
    feedback: "Saturday (شنبه) در تقویم آمریکایی جزو weekend است."
  en.a1.unit04.lesson01.exercise03.match_days:
    instruction: "هر روز هفته را به ترتیب درست آن وصل کنید."
    accepted_answers: [{value: [{left: "1st weekday", right: "Monday"}, {left: "2nd weekday", right: "Tuesday"}, {left: "3rd weekday", right: "Wednesday"}, {left: "4th weekday", right: "Thursday"}], status: "correct"}]
    feedback: "ترتیب هفته کاری: Monday، Tuesday، Wednesday، Thursday."
  en.a1.unit04.lesson01.exercise04.order_question:
    instruction: "واژه‌ها را برای پرسیدن «امروز چه روزیه؟» مرتب کنید."
    accepted_answers: [{value: ["What", "day", "is", "it", "today"], status: "correct"}]
    feedback: "ترتیب درست What day is it today? است."
  en.a1.unit04.lesson01.exercise05.write_friday:
    instruction: "روزی را که بعد از پنجشنبه می‌آید به انگلیسی بنویسید."
    accepted_answers:
      - {value: "Friday", status: "correct"}
      - {value: "Friday.", status: "correct"}
    feedback: "روز بعد از Thursday، Friday (جمعه) است."

  en.a1.unit04.lesson02.exercise01.listen_month:
    instruction: "گوش کنید و ماه گفته‌شده را انتخاب کنید."
    correct_option: "سپتامبر"
    distractors: ["ژانویه", "مارس", "دسامبر"]
    accepted_answers: [{value: "سپتامبر", status: "correct"}]
    feedback: "September یعنی سپتامبر."
  en.a1.unit04.lesson02.exercise02.choose_summer_month:
    instruction: "ماهی را انتخاب کنید که در نیمکرهٔ شمالی تابستان است."
    correct_option: "July"
    distractors: ["January", "March", "December"]
    accepted_answers: [{value: "July", status: "correct"}]
    feedback: "July (جولای) در نیمکرهٔ شمالی وسط تابستان است."
  en.a1.unit04.lesson02.exercise03.match_months:
    instruction: "هر ماه را به شمارهٔ درست آن در سال وصل کنید."
    accepted_answers: [{value: [{left: "1st month", right: "January"}, {left: "3rd month", right: "March"}, {left: "7th month", right: "July"}, {left: "12th month", right: "December"}], status: "correct"}]
    feedback: "January اول، March سوم، July هفتم و December دوازدهمین ماه سال است."
  en.a1.unit04.lesson02.exercise04.order_month_question:
    instruction: "واژه‌ها را برای پرسیدن «الان چه ماهیه؟» مرتب کنید."
    accepted_answers: [{value: ["Which", "month", "is", "it"], status: "correct"}]
    feedback: "ترتیب درست Which month is it? است."
  en.a1.unit04.lesson02.exercise05.write_december:
    instruction: "آخرین ماه سال را به انگلیسی بنویسید."
    accepted_answers:
      - {value: "December", status: "correct"}
      - {value: "December.", status: "correct"}
    feedback: "آخرین ماه سال December (دسامبر) است."

  en.a1.unit04.lesson03.exercise01.listen_date_question:
    instruction: "گوش کنید و مشخص کنید چه چیزی پرسیده می‌شود."
    correct_option: "تاریخ کامل امروز"
    distractors: ["روز هفته", "ماه جاری", "سن مخاطب"]
    accepted_answers: [{value: "تاریخ کامل امروز", status: "correct"}]
    feedback: "What's today's date؟ کل تاریخ (روز هفته، ماه و روز ماه) را می‌پرسد."
  en.a1.unit04.lesson03.exercise02.choose_date_answer:
    instruction: "پاسخ درست به پرسش تاریخ امروز را انتخاب کنید."
    correct_option: "It's Tuesday, July 7th."
    distractors: ["It's ten dollars.", "My birthday is March 3rd.", "It opens on Thursday."]
    accepted_answers: [{value: "It's Tuesday, July 7th.", status: "correct"}]
    feedback: "It's Tuesday, July 7th یعنی «سه‌شنبه، هفتم جولای است»."
  en.a1.unit04.lesson03.exercise03.order_birthday_question:
    instruction: "واژه‌ها را برای پرسیدن «تولدت کیه؟» مرتب کنید."
    accepted_answers: [{value: ["When's", "your", "birthday"], status: "correct"}]
    feedback: "ترتیب درست When's your birthday? است."
  en.a1.unit04.lesson03.exercise04.reply_birthday:
    instruction: "به این پرسش دربارهٔ تولدتان پاسخ دهید (تاریخ سوم مارس)."
    accepted_answers:
      - {value: "My birthday is March 3rd.", status: "correct"}
      - {value: "My birthday is March 3rd", status: "correct"}
    feedback: "My birthday is March 3rd یعنی «تولدم سوم مارسه»."
  en.a1.unit04.lesson03.exercise05.write_date:
    instruction: "تاریخ هفتم جولای را با حروف به انگلیسی بنویسید."
    accepted_answers:
      - {value: "It's July 7th.", status: "correct"}
      - {value: "It's July 7th", status: "correct"}
      - {value: "July 7th", status: "acceptable_with_note", note: "معنا درست است، اما جملهٔ کامل‌تر با It's شروع می‌شود."}
    feedback: "هفتم جولای به انگلیسی July 7th نوشته می‌شود."

  en.a1.unit04.lesson04.exercise01.listen_today_date:
    instruction: "گفت‌وگو را گوش کنید و مشخص کنید امروز چه تاریخی است."
    correct_option: "سه‌شنبه، هفتم جولای"
    distractors: ["پنجشنبه، نهم جولای", "دوشنبه، هفتم جولای", "سه‌شنبه، نهم جولای"]
    accepted_answers: [{value: "سه‌شنبه، هفتم جولای", status: "correct"}]
    feedback: "لیلا می‌گوید It's Tuesday, July 7th."
  en.a1.unit04.lesson04.exercise02.listen_open_date:
    instruction: "گوش کنید و مشخص کنید کتابخانه چه روزی دوباره باز می‌شود."
    correct_option: "پنجشنبه، نهم جولای"
    distractors: ["سه‌شنبه، هفتم جولای", "جمعه، دهم جولای", "پنجشنبه، هفتم جولای"]
    accepted_answers: [{value: "پنجشنبه، نهم جولای", status: "correct"}]
    feedback: "لیلا می‌گوید It opens on Thursday, July 9th."
  en.a1.unit04.lesson04.exercise03.choose_reopen_date:
    instruction: "پاسخ درست دربارهٔ بازگشایی کتابخانه را انتخاب کنید."
    correct_option: "Thursday, July 9th"
    distractors: ["Tuesday, July 7th", "Monday, July 6th", "Friday, July 10th"]
    accepted_answers: [{value: "Thursday, July 9th", status: "correct"}]
    feedback: "کتابخانه پنجشنبه نهم جولای دوباره باز می‌شود."
  en.a1.unit04.lesson04.exercise04.order_reopen_question:
    instruction: "واژه‌ها را برای پرسیدن زمان بازگشایی کتابخانه مرتب کنید."
    accepted_answers: [{value: ["When's", "the", "library", "open", "again"], status: "correct"}]
    feedback: "ترتیب درست When's the library open again? است."
  en.a1.unit04.lesson04.exercise05.reply_as_leila:
    instruction: "در نقش لیلا، به هر دو پرسش (تاریخ امروز و زمان بازگشایی) پاسخ دهید."
    accepted_answers:
      - {value: "It's Tuesday, July 7th. It opens on Thursday, July 9th.", status: "correct"}
      - {value: "It's Tuesday, July 7th, and it opens on Thursday, July 9th.", status: "correct"}
    feedback: "پاسخ کامل هر دو تاریخ را جداگانه بیان می‌کند."
  en.a1.unit04.lesson04.exercise06.speak_dates:
    instruction: "در نقش لیلا، با صدای بلند به هر دو پرسش پاسخ دهید."
    accepted_answers:
      - {value: "It's Tuesday, July 7th. It opens on Thursday, July 9th.", status: "correct"}
      - {value: "It's Tuesday, July 7th, and it opens on Thursday, July 9th.", status: "correct"}
    feedback: "پاسخ کامل هر دو تاریخ (امروز و بازگشایی) را پوشش می‌دهد."
