  en.a1.unit13.lesson04.exercise02.listen_happy_reason:
    instruction: "گوش کنید و مشخص کنید چرا دنیل خوشحال است."
    correct_option: "کلاس تقریباً تمام شده"
    distractors: ["امتحان راحت است", "کلاس جدید شروع می‌شود", "معلم جدید دارد"]
    accepted_answers: [{value: "کلاس تقریباً تمام شده", status: "correct"}]
