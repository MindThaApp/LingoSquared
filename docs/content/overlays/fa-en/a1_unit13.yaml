    instruction: "پاسخ درست به سوال احساس امروز را انتخاب کنید."
    correct_option: "I'm a little worried because I have a big test tomorrow."
    distractors: ["It's sunny and warm.", "Do you have it in blue?", "I have two brothers."]
    accepted_answers: [{value: "I'm a little worried because I have a big test tomorrow.", status: "correct"}]
    feedback: "این جمله یعنی «کمی نگرانم چون فردا یک امتحان مهم دارم»."
  en.a1.unit13.lesson02.exercise03.order_happy_because:
    instruction: "واژه‌ها را برای گفتن «خوشحالم چون کلاس تقریباً تمام شده» مرتب کنید."
    accepted_answers: [{value: ["I'm", "happy", "because", "the", "class", "is", "almost", "over"], status: "correct"}]
    feedback: "ترتیب درست I'm happy because the class is almost over است."
  en.a1.unit13.lesson02.exercise04.reply_feeling_reason:
    instruction: "به این سوال پاسخ دهید که کمی نگرانید چون فردا امتحان دارید."
