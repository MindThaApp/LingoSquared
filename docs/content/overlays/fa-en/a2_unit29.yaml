  en.a2.unit29.lesson03.teach.confirmation_text: {title: "متن اعلامیهٔ تعمیر", gloss: "درخواست تعمیر شما دریافت شده. یک لوله‌کش فردا بین ساعت ۲ تا ۴ بعدازظهر میاد. شمارهٔ تعمیر ۶۱۸۰ است.", note: "این یک اعلامیهٔ رسمی واقعی با وضعیت، زمان، و شماره است -- سطح A2."}

