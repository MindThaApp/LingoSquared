course:
  title: "انگلیسی A2"
  description: "آموزش انگلیسی سطح A2 برای موقعیت‌های رسمی‌تر، با توضیحات دقیق فارسی."

units:
  en.a2.unit29.maintenance: {title: "گزارش یک مشکل تعمیراتی"}

lessons:
  en.a2.unit29.lesson01.repair_vocabulary: {title: "سینک و تعمیرات"}
  en.a2.unit29.lesson02.calling_to_report_a_problem: {title: "تماس برای گزارش یک مشکل"}
  en.a2.unit29.lesson03.reading_a_repair_notice: {title: "خواندن اعلامیهٔ تعمیر"}
