teaching:
  en.a2.unit29.lesson01.teach.leaking: {title: "leaking", gloss: "چکه می‌کنه", note: "*leaking* یعنی آب از جایی که نباید بیاد، بیرون می‌زنه.", example_gloss: "سینک آشپزخونه چکه می‌کنه."}
  en.a2.unit29.lesson01.teach.sink: {title: "sink", gloss: "سینک", note: "*sink* یعنی سینکی که ظرف‌ها رو توش می‌شورید.", example_gloss: "از سینک آب چکه می‌کنه."}
  en.a2.unit29.lesson01.teach.building_manager: {title: "building manager", gloss: "مدیر ساختمان", note: "*building manager* یعنی کسی که مسئول نگهداری ساختمانه.", example_gloss: "باید دربارهٔ نشتی به مدیر ساختمان زنگ بزنم."}
  en.a2.unit29.lesson01.teach.plumber: {title: "plumber", gloss: "لوله‌کش", note: "*plumber* یعنی کسی که مشکلات آب و لوله رو تعمیر می‌کنه.", example_gloss: "مدیر ساختمان یه لوله‌کش فرستاد که درستش کنه."}
  en.a2.unit29.lesson01.teach.repair: {title: "repair", gloss: "تعمیر", note: "*repair* یعنی درست کردن چیزی که خرابه.", example_gloss: "تعمیر فردا بعدازظهر انجام می‌شه."}
  en.a2.unit29.lesson01.teach.reused_home_words: {title: "کلمات خانه", gloss: "آشپزخانه، آپارتمان، حمام", note: "این کلمات رو قبلاً در واحد ۲۴ یاد گرفتید -- اینجا دوباره مرور می‌کنیم.", example_gloss: ["نشتی توی آشپزخونه‌ست.", "آپارتمان من دو تا اتاق خواب داره.", "حموم درست کنار آشپزخونه‌ست."]}

  en.a2.unit29.lesson02.teach.report_problem: {title: "گزارش یک مشکل", gloss: "می‌خواستم یک مشکل با سینک آشپزخانه‌ام رو گزارش بدم.", note: "این یک درخواست مؤدبانه و رسمی برای گزارش یک مشکله."}
  en.a2.unit29.lesson02.teach.leaking_since_morning: {title: "گفتن مدت زمان مشکل", gloss: "از امروز صبح داره چکه می‌کنه.", note: "*It's been leaking* یعنی *It has been leaking* (*present perfect continuous*): کاری که از یک زمان شروع شده و هنوز ادامه داره، شبیه *I've had* در واحد ۲۸. فارسی اینجا زمان حال به کار می‌بره («از صبح داره چکه می‌کنه»)، ولی انگلیسی نمی‌گه *It is leaking since this morning*."}
  en.a2.unit29.lesson02.teach.ask_repair_timing: {title: "When can someone come to fix it?", gloss: "کِی کسی می‌تونه بیاد درستش کنه؟", note: "*someone* یعنی یه نفر؛ دنیل نمی‌دونه چه کسی برای تعمیر میاد."}

  en.a2.unit29.lesson03.teach.between_2_4: {title: "between 2pm and 4pm", gloss: "بین ساعت ۲ تا ۴ بعدازظهر", note: "*between 2pm and 4pm* یعنی بین ساعت ۲ تا ۴ بعدازظهر.", example_gloss: "لوله‌کش بین ساعت ۲ تا ۴ بعدازظهر می‌رسه."}
  en.a2.unit29.lesson03.teach.confirmation_text: {title: "متن اعلامیهٔ تعمیر", gloss: "گزارش شما دربارهٔ چکه کردن سینک آشپزخانه دریافت شده. یک لوله‌کش فردا بین ساعت ۲ تا ۴ بعدازظهر میاد. شمارهٔ تعمیر ۶۱۸۰ است.", note: "این یک اعلامیهٔ رسمیه که وضعیت، زمان و شماره رو می‌گه."}

  en.a2.unit29.lesson04.teach.q_report_problem: {title: "گزارش مشکل به مدیر", gloss: "دنیل می‌گه: می‌خواستم یک مشکل با سینک آشپزخانه‌ام رو گزارش بدم.", note: "همون جمله‌ای که در درس دوم یاد گرفتیم."}
  en.a2.unit29.lesson04.teach.q_whats_wrong_sink: {title: "پرسیدن دربارهٔ مشکل سینک", gloss: "مدیر می‌پرسه: سینک چه مشکلی داره؟", note: "همون شکل سوالی که دکتر در واحد ۲۸ پرسید (*What's wrong?*)، این بار دربارهٔ سینک نه سلامتی."}
  en.a2.unit29.lesson04.teach.a_leaking_since_morning_and_ask_timing: {title: "جواب دنیل دربارهٔ مدت زمان و پرسیدن دربارهٔ تعمیر", gloss: "دنیل می‌گه: از امروز صبح داره چکه می‌کنه. کِی کسی میاد درستش کنه؟", note: "همون دو جمله‌ای که در درس دوم یاد گرفتیم، این بار با هم."}
  en.a2.unit29.lesson04.teach.a_send_plumber: {title: "جواب مدیر دربارهٔ لوله‌کش", gloss: "مدیر می‌گه: متوجه شدم. فردا بین ساعت ۲ تا ۴ بعدازظهر یک لوله‌کش می‌فرستم.", note: "مدیر بعد از شنیدن مشکل، وقت تعمیر رو مشخص می‌کنه."}
  en.a2.unit29.lesson04.teach.q_need_to_be_home: {title: "پرسیدن دربارهٔ حضور در خانه", gloss: "دنیل می‌پرسه: باید خونه باشم؟", note: "دنیل بعد از شنیدن وقت تعمیر، دربارهٔ حضورش می‌پرسه."}
  en.a2.unit29.lesson04.teach.a_confirm_window_number: {title: "تأیید نهایی مدیر", gloss: "مدیر می‌گه: بله، لطفاً بین ساعت ۲ تا ۴ بعدازظهر خونه باشید. شمارهٔ تعمیرتون اینه: ۶۱۸۰.", note: "مدیر هم زمان دقیق و هم شمارهٔ تعمیر رو با هم می‌گه."}
  en.a2.unit29.lesson04.teach.a_thank_you: {title: "تشکر پایانی", gloss: "دنیل می‌گه: خیلی ممنون.", note: "*Thank you very much* یک شکل رسمی و مؤدبانهٔ تشکره، مثل پایان گفتگوی واحد ۲۵."}

