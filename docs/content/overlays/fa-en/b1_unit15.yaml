    distractors: ["a refund as soon as possible", "a replacement next month", "a repair as soon as possible"]
    accepted_answers: [{value: "a replacement as soon as possible", status: "correct"}]
    feedback: "متن می‌گه: I would like a replacement as soon as possible."
  en.b1.unit15.lesson03.exercise03.recognize_desk_chair:
    instruction: "کدوم عبارت اون وسیله‌ای رو که میا سفارش داد نام می‌بره؟"
    correct_option: "desk chair"
    distractors: ["refund", "replacement", "issue"]
    accepted_answers: [{value: "desk chair", status: "correct"}]
    feedback: "desk chair یعنی صندلی میز کار."
  en.b1.unit15.lesson03.exercise04.order_replacement_soon:
    instruction: "کلمه‌ها رو برای گفتن «هر چه زودتر یه کالای جایگزین می‌خوام.» مرتب کنین."
    accepted_answers: [{value: ["I", "would", "like", "a", "replacement", "as", "soon", "as", "possible"], status: "correct"}]
    feedback: "ترتیب درست: I would like a replacement as soon as possible."
  en.b1.unit15.lesson03.exercise05.write_ordered_desk_chair:
    instruction: "بنویسین که یه صندلی میز کار برای اتاق کارتون توی خونه سفارش دادین؛ جمله رو با «I ordered» شروع کنین."
    accepted_answers:
      - {value: "I ordered a desk chair for my home office.", status: "correct"}
      - {value: "I ordered a desk chair for my home office", status: "correct"}
    feedback: "I ordered a desk chair for my home office. یعنی یه صندلی میز کار برای اتاق کارم توی خونه سفارش دادم."

  en.b1.unit15.lesson04.exercise01.listen_calling_to_complain:
    instruction: "به گفتگو گوش کنین و بگین میا برای چی زنگ زده."
    correct_option: "calling to complain about a desk chair I ordered"
    distractors: ["calling to complain about a refund I never got", "calling to ask about a delivery date", "calling to cancel my order"]
    accepted_answers: [{value: "calling to complain about a desk chair I ordered", status: "correct"}]
    feedback: "میا می‌گه: I'm calling to complain about a desk chair I ordered."
  en.b1.unit15.lesson04.exercise02.listen_broken_wheel:
    instruction: "گوش کنین و بگین مشکل صندلی میا چیه."
    correct_option: "It arrived with a broken wheel"
    distractors: ["It arrived the wrong color", "It arrived without a manual", "It arrived a week late"]
    accepted_answers: [{value: "It arrived with a broken wheel", status: "correct"}]
    feedback: "میا می‌گه: It arrived with a broken wheel, so I can't use it."
  en.b1.unit15.lesson04.exercise03.choose_agent_offer:
    instruction: "اپراتور چه چیزی به میا پیشنهاد می‌ده؟"
    correct_option: "a refund or a replacement"
    distractors: ["a repair or a refund", "a discount or a replacement", "an apology or a replacement"]
    accepted_answers: [{value: "a refund or a replacement", status: "correct"}]
    feedback: "اپراتور می‌گه: Would you like a refund or a replacement?"
  en.b1.unit15.lesson04.exercise04.order_prefer_replacement:
    instruction: "کلمه‌ها رو برای گفتن «ترجیح می‌دم کالای جایگزین بگیرم، اگه امکانش باشه.» مرتب کنین."
    accepted_answers: [{value: ["I", "would", "prefer", "a", "replacement", "if", "that's", "possible"], status: "correct"}, {value: ["if", "that's", "possible", "I", "would", "prefer", "a", "replacement"], status: "correct"}]
    feedback: "ترتیب درست: I would prefer a replacement if that's possible."
  en.b1.unit15.lesson04.exercise05.reply_as_mia:
    instruction: "اپراتور می‌گه: متوجه‌ام. برگشت پول می‌خواین یا کالای جایگزین؟ به‌جای میا جواب بدین: مؤدبانه بگین اگه امکانش هست، کالای جایگزین رو ترجیح می‌دین."
    accepted_answers:
      - {value: "I would prefer a replacement, if that's possible.", status: "correct"}
      - {value: "I would prefer a replacement, if that's possible", status: "correct"}
      - {value: "I would prefer a replacement if that's possible.", status: "correct"}
      - {value: "I would prefer a replacement if that's possible", status: "correct"}
      - {value: "I'd prefer a replacement, if that's possible.", status: "correct"}
      - {value: "I would prefer a replacement, if that is possible.", status: "correct"}
      - {value: "If that's possible, I would prefer a replacement.", status: "correct"}
    feedback: "این جواب کالای جایگزین رو با یه لحن مؤدبانه ترجیح می‌ده."
  en.b1.unit15.lesson04.exercise06.speak_complaint_dialogue:
    instruction: "در نقش میا با صدای بلند به اپراتور جواب بدین: بگین صندلی با یه چرخ شکسته رسیده، برای همین نمی‌تونین ازش استفاده کنین."
    accepted_answers:
      - {value: "It arrived with a broken wheel, so I can't use it.", status: "correct"}
      - {value: "It arrived with a broken wheel, so I can't use it", status: "correct"}
      - {value: "It arrived with a broken wheel, so I cannot use it.", status: "correct"}
    feedback: "این جواب مشکل صندلی و نتیجه‌اش رو توضیح می‌ده."
