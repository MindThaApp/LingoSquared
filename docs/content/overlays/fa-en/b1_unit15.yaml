review: {status: "reviewed", required_next_reviewer: null, notes: "Launch-gate content; needs fresh-context review before import.\n\nfa-en review 2026-10-19: full checklist pass. 10 fixes: refund glossed as بازپرداخت (loan repayment) -> برگشت پول throughout; grammar note said the three parts come 'always' in this order (English: usually); calqued 'دارم می‌نویسم که...' -> 'این پیام رو می‌نویسم تا...'; 'هر چه زودتر ممکن' -> 'هر چه زودتر'; shared en realization: emptied 3 English prompt blocks that printed the answer (reply_complain_desk_chair, write_would_like_refund, write_ordered_desk_chair); reply_as_mia was underdetermined (a refund is also a valid reply) -> cued; speak item cued; two write instructions reworded; added variants; را/کدام -> رو/کدوم. Native flag: صندلی میز کار for desk chair."}

course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح میانی (B1) برای فارسی‌زبان‌ها، با تمرکز بر شرط، توالی رویدادها، نقل قول غیرمستقیم، هدف و فرض‌های غیرواقعی."

units:
  en.b1.unit15.complaints: {title: "I'm writing to complain about..."}

lessons:
  en.b1.unit15.lesson01.complaints_vocabulary: {title: "کلمات برای شکایت کردن"}
  en.b1.unit15.lesson02.complaint_sentences: {title: "I'm writing to complain about a damaged product"}
  en.b1.unit15.lesson03.reading_a_complaint_email: {title: "متن: شکایت دربارهٔ یه صندلی"}
  en.b1.unit15.lesson04.the_complaint_call_dialogue: {title: "Would you like a refund or a replacement?"}

teaching:
  en.b1.unit15.lesson01.teach.complain: {title: "complain", gloss: "شکایت کردن", note: "complain یعنی رسماً بگین چیزی اشتباهه یا رضایت‌بخش نیست.", example_gloss: "میا تصمیم گرفت دربارهٔ صندلی خراب شکایت کنه."}
  en.b1.unit15.lesson01.teach.damaged: {title: "damaged", gloss: "خراب، آسیب‌دیده", note: "damaged یعنی وضعیت یه محصول که شکسته یا آسیب دیده.", example_gloss: "صندلی خراب به دستش رسید."}
  en.b1.unit15.lesson01.teach.refund: {title: "refund", gloss: "برگشت پول", note: "refund یعنی پولی که بابت یه محصول برگشتی یا خراب پس داده می‌شه.", example_gloss: "میا درخواست برگشت پول کرد."}
  en.b1.unit15.lesson01.teach.replacement: {title: "replacement", gloss: "کالای جایگزین", note: "replacement یعنی یه کالای جدید که به‌جای کالای خراب داده می‌شه.", example_gloss: "شرکت به‌جاش یه کالای جایگزین پیشنهاد داد."}
  en.b1.unit15.lesson01.teach.resolve: {title: "resolve", gloss: "حل کردن", note: "resolve یعنی یه مشکل رو کاملاً حل و فصل کنین.", example_gloss: "اپراتور قول داد مشکل رو سریع حل کنه."}
  en.b1.unit15.lesson01.teach.issue: {title: "issue", gloss: "مشکل", note: "issue یعنی یه مشکلی که باید بهش رسیدگی بشه.", example_gloss: "میا مشکل رو واضح توضیح داد."}

  en.b1.unit15.lesson02.teach.writing_to_complain: {title: "I'm writing to complain about a damaged product.", gloss: "این پیام رو می‌نویسم تا دربارهٔ یه کالای خراب شکایت کنم.", note: "*I'm writing to complain about* شروع مؤدبانهٔ یه شکایت کتبیه."}
  en.b1.unit15.lesson02.teach.would_like_refund: {title: "I would like a refund for this item.", gloss: "برگشت پول این کالا رو می‌خوام.", note: "*I would like a refund for* یه درخواست مشخص برای برگشت پوله."}
  en.b1.unit15.lesson02.teach.grammar_complaint_structure: {title: "ساختار یه شکایت مؤدبانه", gloss: "یه شکایت کتبی مؤدبانه معمولاً سه بخش داره: گفتن مشکل (I'm writing to complain about...)، گفتن این که چه اتفاقی افتاده (it arrived damaged)، و خواستن یه راه‌حل مشخص (I would like a refund / I would like a replacement).", note: "یه شکایت کتبی مؤدبانه معمولاً همین سه بخش رو به همین ترتیب داره."}

  en.b1.unit15.lesson03.teach.desk_chair: {title: "desk chair", gloss: "صندلی میز کار", note: "desk chair یعنی صندلی‌ای که برای کار پشت میز استفاده می‌شه.", example_gloss: "میا یه صندلی میز کار جدید برای اتاق کارش توی خونه سفارش داد."}
  en.b1.unit15.lesson03.teach.as_soon_as_possible: {title: "as soon as possible", gloss: "هر چه زودتر", note: "as soon as possible یعنی به محض این که بشه.", example_gloss: "میا هر چه زودتر یه کالای جایگزین خواست."}
  en.b1.unit15.lesson03.teach.reading_passage: {title: "متن: شکایت دربارهٔ یه صندلی", gloss: "تیم عزیز گرین‌دسک، این پیام رو می‌نویسم تا دربارهٔ یه کالای خراب شکایت کنم. هفتهٔ پیش یه صندلی میز کار سفارش دادم، ولی با یه چرخ شکسته به دستم رسید. هر چه زودتر یه کالای جایگزین می‌خوام. لطفاً بگین چطور ادامه بدم. ممنون، میا", note: "این متن نشون می‌ده چطور مشکل، اتفاق و درخواست رو توی یه ایمیل شکایت مطرح کنین."}

  en.b1.unit15.lesson04.teach.q_calling_to_complain: {title: "حرف میا", gloss: "میا می‌گه سلام، زنگ زدم که دربارهٔ یه صندلی میز کار که سفارش دادم شکایت کنم.", note: "*I'm calling to complain about* شروع یه شکایت تلفنیه."}
  en.b1.unit15.lesson04.teach.a_whats_the_issue: {title: "جواب اپراتور", gloss: "اپراتور می‌گه متأسفم که این رو می‌شنوم. مشکلش چیه؟", note: "*What's the issue with it?* یعنی مشکلش چیه."}
  en.b1.unit15.lesson04.teach.q_broken_wheel_cant_use: {title: "حرف میا", gloss: "میا می‌گه با یه چرخ شکسته به دستم رسید، برای همین نمی‌تونم ازش استفاده کنم.", note: "*so I can't use it* نتیجهٔ خراب بودن رو نشون می‌ده."}
  en.b1.unit15.lesson04.teach.a_refund_or_replacement: {title: "جواب اپراتور", gloss: "اپراتور می‌گه متوجه‌ام. برگشت پول می‌خواین یا کالای جایگزین؟", note: "*Would you like a refund or a replacement?* دو گزینه رو پیشنهاد می‌ده."}
  en.b1.unit15.lesson04.teach.q_prefer_replacement: {title: "حرف میا", gloss: "میا می‌گه ترجیح می‌دم کالای جایگزین بگیرم، اگه امکانش باشه.", note: "*I would prefer* + اسم یعنی ترجیح دادن یه گزینه."}
  en.b1.unit15.lesson04.teach.a_resolve_send_friday: {title: "جمع‌بندی اپراتور", gloss: "اپراتور می‌گه البته. این رو حل می‌کنیم و تا جمعه یه صندلی جدید می‌فرستیم.", note: "*We'll resolve this and send a new chair by Friday* یه وعدهٔ مشخصه."}

exercises:
  en.b1.unit15.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای رو که گفته می‌شه انتخاب کنین."
    correct_option: "damaged"
    distractors: ["complain", "refund", "resolve"]
    accepted_answers: [{value: "damaged", status: "correct"}]
    feedback: "damaged یعنی خراب، آسیب‌دیده."
  en.b1.unit15.lesson01.exercise02.choose_complain:
    instruction: "کدوم کلمه یعنی رسماً بگین چیزی اشتباهه یا رضایت‌بخش نیست؟"
    correct_option: "complain"
    distractors: ["issue", "resolve", "replacement"]
    accepted_answers: [{value: "complain", status: "correct"}]
    feedback: "complain یعنی شکایت کردن."
  en.b1.unit15.lesson01.exercise03.choose_issue:
    instruction: "کدوم کلمه یعنی مشکلی که باید بهش رسیدگی بشه؟"
    correct_option: "issue"
    distractors: ["complain", "refund", "damaged"]
    accepted_answers: [{value: "issue", status: "correct"}]
    feedback: "issue یعنی مشکل."
  en.b1.unit15.lesson01.exercise04.match_complaint_words:
    instruction: "هر کلمه یا عبارت انگلیسی رو به توضیح فارسی درست وصل کنین."
    pairs:
      - {left: "complain", right: "شکایت کردن"}
      - {left: "damaged", right: "خراب، آسیب‌دیده"}
      - {left: "refund", right: "برگشت پول"}
      - {left: "replacement", right: "کالای جایگزین"}
      - {left: "resolve", right: "حل کردن"}
      - {left: "issue", right: "مشکل"}
    accepted_answers:
      - value:
          - {left: "complain", right: "شکایت کردن"}
          - {left: "damaged", right: "خراب، آسیب‌دیده"}
          - {left: "refund", right: "برگشت پول"}
          - {left: "replacement", right: "کالای جایگزین"}
          - {left: "resolve", right: "حل کردن"}
          - {left: "issue", right: "مشکل"}
        status: "correct"
    feedback: "complain=شکایت کردن، damaged=خراب، refund=برگشت پول، replacement=کالای جایگزین، resolve=حل کردن، issue=مشکل."
  en.b1.unit15.lesson01.exercise05.write_issue:
    instruction: "کلمه‌ای رو بنویسین که یعنی مشکلی که باید بهش رسیدگی بشه."
    accepted_answers:
      - {value: "issue", status: "correct"}
      - {value: "Issue", status: "correct"}
    feedback: "issue یعنی مشکل."

  en.b1.unit15.lesson02.exercise01.choose_writing_to_complain:
    instruction: "کدوم جمله مؤدبانه یه شکایت کتبی دربارهٔ یه کالای خراب رو شروع می‌کنه؟"
    correct_option: "I'm writing to complain about a damaged product."
    distractors: ["I would like a refund for this item.", "I ordered a desk chair for my home office.", "Please let me know how to proceed."]
    accepted_answers: [{value: "I'm writing to complain about a damaged product.", status: "correct"}]
    feedback: "I'm writing to complain about a damaged product. یعنی این پیام رو می‌نویسم تا دربارهٔ یه کالای خراب شکایت کنم."
  en.b1.unit15.lesson02.exercise02.choose_would_like_refund:
    instruction: "کدوم جمله مؤدبانه برگشت پول یه کالا رو می‌خواد؟"
    correct_option: "I would like a refund for this item."
    distractors: ["I'm writing to complain about a damaged product.", "I would prefer a replacement, if that's possible.", "It arrived with a broken wheel."]
    accepted_answers: [{value: "I would like a refund for this item.", status: "correct"}]
    feedback: "I would like a refund for this item. یعنی برگشت پول این کالا رو می‌خوام."
  en.b1.unit15.lesson02.exercise03.order_writing_to_complain:
    instruction: "کلمه‌ها رو برای گفتن «این پیام رو می‌نویسم تا دربارهٔ یه کالای خراب شکایت کنم.» مرتب کنین."
    accepted_answers: [{value: ["I'm", "writing", "to", "complain", "about", "a", "damaged", "product"], status: "correct"}]
    feedback: "ترتیب درست: I'm writing to complain about a damaged product."
  en.b1.unit15.lesson02.exercise04.reply_complain_desk_chair:
    instruction: "مؤدبانه یه شکایت کتبی دربارهٔ یه کالای خراب رو شروع کنین، و جواب رو با «I'm writing to complain about» شروع کنین."
    accepted_answers:
      - {value: "I'm writing to complain about a damaged product.", status: "correct"}
      - {value: "I'm writing to complain about a damaged product", status: "correct"}
    feedback: "I'm writing to complain about a damaged product. یه شروع مؤدبانهٔ شکایت کتبیه."
  en.b1.unit15.lesson02.exercise05.write_would_like_refund:
    instruction: "مؤدبانه بنویسین که می‌خواین پول این کالا رو پس بگیرین؛ جمله رو با «I would like a refund for» شروع کنین."
    accepted_answers:
      - {value: "I would like a refund for this item.", status: "correct"}
      - {value: "I would like a refund for this item", status: "correct"}
    feedback: "I would like a refund for this item. یعنی برگشت پول این کالا رو می‌خوام."

  en.b1.unit15.lesson03.exercise01.comprehend_broken_wheel:
    instruction: "مشکل صندلی میز کاری که میا سفارش داد چیه؟"
    correct_option: "it arrived with a broken wheel"
    distractors: ["it arrived the wrong color", "it arrived without instructions", "it arrived a week late"]
    accepted_answers: [{value: "it arrived with a broken wheel", status: "correct"}]
    feedback: "متن می‌گه: it arrived with a broken wheel."
  en.b1.unit15.lesson03.exercise02.comprehend_wants_replacement:
    instruction: "میا چه راه‌حلی می‌خواد، و چه زمانی؟"
