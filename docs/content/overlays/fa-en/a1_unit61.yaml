teaching:
  en.a1.unit61.lesson01.teach.sorry: {title: "sorry", gloss: "متأسف / معذرت‌خواه", note: "*sorry* برای عذرخواهی یا نشان دادن تأسف به کار می‌رود.", example_gloss: "متأسفم."}
  en.a1.unit61.lesson01.teach.late: {title: "late", gloss: "دیر", note: "*late* یعنی دیر و نه به‌موقع.", example_gloss: "من دیر کرده‌ام."}
  en.a1.unit61.lesson01.teach.excuse: {title: "excuse", gloss: "بهانه / دلیل", note: "*excuse* یعنی دلیلی که برای یک مشکل یا اشتباه می‌آورید.", example_gloss: "این بهانهٔ من است."}
  en.a1.unit61.lesson01.teach.traffic: {title: "traffic", gloss: "ترافیک", note: "*traffic* یعنی رفت‌وآمد خودروها در خیابان.", example_gloss: "ترافیک بد است."}
  en.a1.unit61.lesson01.teach.mistake: {title: "mistake", gloss: "اشتباه", note: "*mistake* یعنی کاری که اشتباه انجام شده است.", example_gloss: "من اشتباه کردم."}
  en.a1.unit61.lesson01.teach.problem: {title: "problem", gloss: "مشکل", note: "*problem* یعنی چیزی که درست نیست یا دشوار است.", example_gloss: "مشکلی نیست."}

  en.a1.unit61.lesson02.teach.im_sorry: {title: "عذرخواهی ساده", gloss: "متأسفم.", note: "*I'm sorry* کوتاه‌ترین و رایج‌ترین شکل عذرخواهی ساده است."}
  en.a1.unit61.lesson02.teach.im_late: {title: "گفتن دیر رسیدن", gloss: "دیر کرده‌ام.", note: "*I'm late* یعنی دیر رسیده‌ام یا به‌موقع نیستم."}
  en.a1.unit61.lesson02.teach.bus_is_late: {title: "گفتن دلیل تأخیر", gloss: "اتوبوس دیر کرده است.", note: "*The bus is late* یک دلیل ساده برای دیر رسیدن است."}
  en.a1.unit61.lesson02.teach.thats_okay: {title: "پذیرفتن عذرخواهی", gloss: "اشکالی ندارد.", note: "*That's okay* یعنی مشکلی نیست و عذرخواهی را می‌پذیرید."}
  en.a1.unit61.lesson02.teach.no_problem: {title: "گفتن مشکلی نیست", gloss: "مشکلی نیست.", note: "*No problem* پاسخ کوتاه و دوستانه برای پذیرفتن عذرخواهی است."}
  en.a1.unit61.lesson02.teach.made_mistake: {title: "گفتن اشتباه کردن", gloss: "من اشتباه کردم.", note: "*I made a mistake* یعنی من کاری را اشتباه انجام دادم."}

  en.a1.unit61.lesson03.teach.dialogue_line1: {title: "عذرخواهی دنیل", gloss: "دنیل می‌گوید: سلام میا. متأسفم دیر کردم.", note: "دنیل هم سلام می‌کند و هم دلیل صحبت را با عذرخواهی شروع می‌کند."}
  en.a1.unit61.lesson03.teach.dialogue_line2: {title: "پاسخ میا", gloss: "میا می‌گوید: اشکالی ندارد.", note: "*That's okay* یعنی عذرخواهی پذیرفته شده است."}
  en.a1.unit61.lesson03.teach.dialogue_line3: {title: "دلیل دنیل", gloss: "دنیل می‌گوید: اتوبوس دیر کرده است.", note: "دنیل با این جمله یک دلیل ساده برای تأخیر می‌دهد."}
  en.a1.unit61.lesson03.teach.dialogue_line4: {title: "دلگرمی میا", gloss: "میا می‌گوید: مشکلی نیست. می‌توانیم صبر کنیم.", note: "*We can wait* یعنی می‌توانیم منتظر بمانیم."}
  en.a1.unit61.lesson03.teach.dialogue_line5: {title: "اشتباه دنیل", gloss: "دنیل می‌گوید: دربارهٔ زمان اشتباه کردم.", note: "*with the time* یعنی مربوط به زمان."}
  en.a1.unit61.lesson03.teach.dialogue_line6: {title: "زمان کلاس", gloss: "میا می‌گوید: اشکالی ندارد. کلاس ساعت سه شروع می‌شود.", note: "*starts at three* یعنی ساعت سه شروع می‌شود."}
  en.a1.unit61.lesson03.teach.dialogue_line7: {title: "تشکر دنیل", gloss: "دنیل می‌گوید: ممنون که منتظر ماندی.", note: "*Thank you for waiting* یعنی از اینکه منتظر ماندی ممنونم."}

  en.a1.unit61.lesson04.teach.class_note: {title: "متن: یادداشت کلاس", gloss: "یادداشت کلاس: کلاس ساعت ۳:۰۰ شروع می‌شود. لطفاً به‌موقع بیایید. اگر دیر کردید، پیام بفرستید.", note: "این یادداشت زمان کلاس و کار لازم هنگام تأخیر را توضیح می‌دهد."}
  en.a1.unit61.lesson04.teach.reading_passage: {title: "متن: عذرخواهی پیش از کلاس", gloss: "عذرخواهی پیش از کلاس: دنیل برای کلاس دیر کرد چون اتوبوس دیر کرده بود. او بیرون کلاس میا را دید. دنیل گفت متأسف است. همچنین گفت دربارهٔ زمان اشتباه کرده است. میا گفت اشکالی ندارد چون کلاس ساعت ۳:۰۰ شروع می‌شد. دنیل یک پیام کوتاه برای معلم فرستاد. پیام می‌گفت: متأسفم دیر کردم. اتوبوس دیر کرده است.", note: "این متن عذرخواهی، دلیل تأخیر، و پیام کوتاه دنیل را نشان می‌دهد."}

exercises:
  en.a1.unit61.lesson01.exercise01.listen_word:
    instruction: "گوش کنید و کلمه‌ای را که گفته شد انتخاب کنید."
    correct_option: "sorry"
    distractors: ["happy", "early", "ready", "busy"]
    accepted_answers: [{value: "sorry", status: "correct"}]
    feedback: "*sorry* یعنی متأسف یا معذرت‌خواه."
  en.a1.unit61.lesson01.exercise02.choose_late_meaning:
    instruction: "کدام کلمه یعنی به‌موقع نبودن؟"
    correct_option: "late"
    distractors: ["sorry", "traffic", "problem"]
    accepted_answers: [{value: "late", status: "correct"}]
    feedback: "*late* یعنی دیر."
  en.a1.unit61.lesson01.exercise03.match_apology_words:
    instruction: "هر توضیح انگلیسی را به کلمهٔ درست وصل کنید."
    accepted_answers: [{value: [{left: "what you say after doing something wrong", right: "sorry"}, {left: "not on time", right: "late"}, {left: "a reason for a problem", right: "excuse"}, {left: "many cars on the road", right: "traffic"}, {left: "something done wrong", right: "mistake"}, {left: "something that is wrong or difficult", right: "problem"}], status: "correct"}]
    feedback: "sorry=متأسف، late=دیر، excuse=بهانه/دلیل، traffic=ترافیک، mistake=اشتباه، problem=مشکل."
  en.a1.unit61.lesson01.exercise04.order_sorry_sentence:
    instruction: "کلمات را به ترتیب درست بچینید."
    accepted_answers: [{value: ["I'm", "sorry."], status: "correct"}]
    feedback: "ترتیب درست: *I'm sorry.*"
  en.a1.unit61.lesson01.exercise05.write_mistake:
    instruction: "کلمه‌ای را بنویسید که یعنی کاری که اشتباه انجام شده است."
    accepted_answers: [{value: "mistake", status: "correct"}]
    feedback: "*mistake* یعنی اشتباه."

  en.a1.unit61.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنید و عبارتی را که شنیدید انتخاب کنید."
    correct_option: "The bus is late."
    distractors: ["The train is full.", "The class is quiet.", "The door is open."]
    accepted_answers: [{value: "The bus is late.", status: "correct"}]
    feedback: "*The bus is late* یعنی اتوبوس دیر کرده است."
  en.a1.unit61.lesson02.exercise02.choose_apology:
    instruction: "کدام عبارت یک عذرخواهی ساده است؟"
    correct_option: "I'm sorry."
    distractors: ["I'm late.", "That's okay.", "No problem."]
    accepted_answers: [{value: "I'm sorry.", status: "correct"}]
    feedback: "*I'm sorry* یعنی متأسفم."
  en.a1.unit61.lesson02.exercise03.choose_acceptance:
    instruction: "کدام عبارت عذرخواهی را می‌پذیرد؟"
    correct_option: "That's okay."
    distractors: ["I'm sorry.", "I'm late.", "I made a mistake."]
    accepted_answers: [{value: "That's okay.", status: "correct"}]
    feedback: "*That's okay* یعنی اشکالی ندارد."
  en.a1.unit61.lesson02.exercise04.order_bus_sentence:
    instruction: "کلمات را به ترتیب درست بچینید."
    accepted_answers: [{value: ["The", "bus", "is", "late."], status: "correct"}]
    feedback: "ترتیب درست: *The bus is late.*"
  en.a1.unit61.lesson02.exercise05.translate_no_problem:
    instruction: "ترجمه کنید: «مشکلی نیست.»"
    accepted_answers: [{value: "No problem.", status: "correct"}, {value: "No problem", status: "correct"}]
    feedback: "*No problem* یعنی مشکلی نیست."

  en.a1.unit61.lesson03.exercise01.comprehension_reason:
    instruction: "طبق گفتگو، چرا دنیل دیر کرده است؟"
    correct_option: "The bus is late."
    distractors: ["The class is full.", "The phone is broken.", "The bank is closed."]
    accepted_answers: [{value: "The bus is late.", status: "correct"}]
    feedback: "دنیل می‌گوید اتوبوس دیر کرده است."
  en.a1.unit61.lesson03.exercise02.comprehension_class_time:
    instruction: "طبق گفتگو، کلاس چه ساعتی شروع می‌شود؟"
    correct_option: "three"
    distractors: ["two", "four", "five"]
    accepted_answers: [{value: "three", status: "correct"}]
    feedback: "میا می‌گوید کلاس ساعت سه شروع می‌شود."
  en.a1.unit61.lesson03.exercise03.listen_dialogue_apology:
    instruction: "دنیل کدام عذرخواهی را می‌گوید؟"
    correct_option: "I'm sorry I'm late."
    distractors: ["I'm sorry I forgot.", "I'm sorry I called late.", "I'm sorry I lost it."]
    accepted_answers: [{value: "I'm sorry I'm late.", status: "correct"}]
    feedback: "دنیل می‌گوید: *I'm sorry I'm late.*"
  en.a1.unit61.lesson03.exercise04.respond_own_apology:
    instruction: "عذرخواهی کنید، دلیل بیاورید، یا عذرخواهی را بپذیرید."
    accepted_answers: ["I'm sorry I'm late", "I'm sorry I'm late.", "The bus is late", "The bus is late.", "That's okay", "That's okay.", "No problem", "No problem."]
    feedback: "می‌توانید بگویید *I'm sorry I'm late* یا *No problem*."

  en.a1.unit61.lesson04.exercise01.note_class_time:
    instruction: "طبق یادداشت، کلاس چه ساعتی شروع می‌شود؟"
    correct_option: "3:00"
    distractors: ["2:00", "4:00", "5:00"]
    accepted_answers: [{value: "3:00", status: "correct"}]
    feedback: "یادداشت می‌گوید کلاس ساعت ۳:۰۰ شروع می‌شود."
  en.a1.unit61.lesson04.exercise02.note_late_action:
    instruction: "طبق یادداشت، اگر دیر کردید باید چه کار کنید؟"
    correct_option: "send a message"
    distractors: ["call a friend", "open the door", "check your balance"]
    accepted_answers: [{value: "send a message", status: "correct"}]
    feedback: "یادداشت می‌گوید اگر دیر کردید پیام بفرستید."
  en.a1.unit61.lesson04.exercise03.reading_reason:
    instruction: "طبق متن، چرا دنیل دیر کرده بود؟"
    correct_option: "the bus was late"
    distractors: ["the class was full", "the phone was broken", "the bank was closed"]
    accepted_answers: [{value: "the bus was late", status: "correct"}]
    feedback: "متن می‌گوید دنیل دیر کرد چون اتوبوس دیر کرده بود."
  en.a1.unit61.lesson04.exercise04.reading_who_waited:
    instruction: "طبق متن، چه کسی بیرون کلاس دنیل را دید؟"
    correct_option: "Mia"
    distractors: ["Leila", "Daniel", "the teacher"]
    accepted_answers: [{value: "Mia", status: "correct"}]
    feedback: "متن می‌گوید دنیل بیرون کلاس میا را دید."
  en.a1.unit61.lesson04.exercise05.write_own_apology_message:
    instruction: "یک پیام کوتاه بنویسید: برای دیر کردن عذرخواهی کنید و دلیل را بگویید."
    accepted_answers: ["I'm sorry I'm late. The bus is late.", "I'm sorry I'm late, and the bus is late.", "I'm sorry I'm late and the bus is late."]
    feedback: "می‌توانید بنویسید: *I'm sorry I'm late. The bus is late.*"
