      - {value: "By Friday, I have to pay the rent", status: "correct"}
      - {value: "I must pay the rent by Friday.", status: "correct"}
      - {value: "I must pay the rent by Friday", status: "correct"}
      - {value: "I must pay my rent by Friday.", status: "correct"}
      - {value: "I must pay my rent by Friday", status: "correct"}
    feedback: "I have to pay the rent by Friday یعنی باید تا جمعه اجاره رو پرداخت کنم."
  en.b1.unit01.lesson02.exercise05.write_she_has_to:
    instruction: "بنویسین که او (زن) باید یه قرار ملاقات بگیره."
    accepted_answers:
      - {value: "She has to make an appointment.", status: "correct"}
      - {value: "She has to make an appointment", status: "correct"}
    feedback: "She has to make an appointment یعنی او باید یه قرار ملاقات بگیره."

  en.b1.unit01.lesson03.exercise01.comprehend_what_daniel_forgot:
    instruction: "دنیل چه کاری رو فراموش کرد انجام بده؟"
    correct_option: "renew his gym membership"
    distractors: ["pay the rent", "call the dentist", "finish his task"]
    accepted_answers: [{value: "renew his gym membership", status: "correct"}]
    feedback: "متن می‌گه: forgot to renew his gym membership."
  en.b1.unit01.lesson03.exercise02.comprehend_what_he_should_have_done:
    instruction: "دنیل چه کاری رو باید انجام می‌داد؟"
    correct_option: "set a reminder on his phone"
    distractors: ["pay a late fee", "call the gym twice", "cancel his membership"]
    accepted_answers: [{value: "set a reminder on his phone", status: "correct"}]
    feedback: "متن می‌گه: He should have set a reminder on his phone."
  en.b1.unit01.lesson03.exercise03.recognize_should_have:
    instruction: "کدام عبارت یک اشتباه یا افسوس دربارهٔ گذشته رو توصیف می‌کنه؟"
    correct_option: "should have called"
    distractors: ["must not", "don't have to", "have to"]
    accepted_answers: [{value: "should have called", status: "correct"}]
    feedback: "should have called یعنی باید زودتر تماس می‌گرفتم -- یک افسوس از گذشته."
  en.b1.unit01.lesson03.exercise04.order_must_not_forget:
