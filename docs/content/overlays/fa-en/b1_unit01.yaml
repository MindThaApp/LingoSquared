course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح میانی (B1) برای فارسی‌زبان‌ها، با تمرکز بر بیان ضرورت، توانایی، شرط، بحث و کار، همراه با توضیحات دقیق فارسی."

units:
  en.b1.unit01.necessity: {title: "کارهایی که باید انجام بدم"}

lessons:
  en.b1.unit01.lesson01.necessity_vocabulary: {title: "must، have to و should"}
  en.b1.unit01.lesson02.saying_what_you_must_do: {title: "من باید، او باید"}
  en.b1.unit01.lesson03.past_regret_and_prohibition: {title: "افسوس گذشته و ممنوعیت"}
  en.b1.unit01.lesson04.the_gym_membership_dialogue: {title: "دیگه فراموش نکن"}

teaching:
  en.b1.unit01.lesson01.teach.must: {title: "must", gloss: "باید (تعهد شخصی قوی)", note: "must یعنی یک ضرورت یا تعهد قوی که از خود شخص میاد.", example_gloss: "باید امروز این کار رو تموم کنم."}
  en.b1.unit01.lesson01.teach.have_to: {title: "have to", gloss: "باید (تعهد بیرونی)", note: "have to هم به معنی باید هست، ولی بیشتر برای تعهدی که از بیرون میاد (قانون، قرارداد و غیره) استفاده می‌شه.", example_gloss: "باید تا جمعه اجاره رو پرداخت کنم."}
  en.b1.unit01.lesson01.teach.should: {title: "should", gloss: "باید (توصیه)", note: "should یک توصیه یا پیشنهاده، نه یه تعهد قطعی.", example_gloss: "بهتره زودتر با دندون‌پزشک تماس بگیری."}
  en.b1.unit01.lesson01.teach.task: {title: "task", gloss: "کار، وظیفه", note: "task یعنی یک کار یا وظیفه‌ای که باید انجام بشه.", example_gloss: "یه کار دیگه هم مونده که باید تمومش کنم."}
  en.b1.unit01.lesson01.teach.rent: {title: "rent", gloss: "اجاره", note: "rent یعنی پولی که هر ماه برای زندگی توی یه جا پرداخت می‌کنین.", example_gloss: "اجاره جمعه سررسیدشه."}
  en.b1.unit01.lesson01.teach.appointment: {title: "appointment", gloss: "قرار ملاقات", note: "appointment یعنی یک زمان مشخص برای دیدن کسی، مثل دکتر.", example_gloss: "این هفته یه قرار ملاقات با دندون‌پزشک دارم."}

  en.b1.unit01.lesson02.teach.must_finish_task: {title: "I must finish this task today.", gloss: "باید امروز این کار رو تموم کنم.", note: "must + فعل ساده برای بیان یک ضرورت شخصی و قوی استفاده می‌شه."}
  en.b1.unit01.lesson02.teach.have_to_pay_rent: {title: "I have to pay the rent by Friday.", gloss: "باید تا جمعه اجاره رو پرداخت کنم.", note: "have to + فعل ساده هم برای ضرورت استفاده می‌شه، به‌خصوص وقتی تعهد از بیرون میاد."}
  en.b1.unit01.lesson02.teach.she_has_to_make: {title: "She has to make an appointment.", gloss: "او باید یه قرار ملاقات بگیره.", note: "با he/she/it، have تبدیل به has می‌شه -- has to. خود must و should هیچ‌وقت تغییر نمی‌کنن."}
  en.b1.unit01.lesson02.teach.you_should_call: {title: "You should call and confirm the appointment.", gloss: "بهتره زنگ بزنی و قرار ملاقات رو تأیید کنی.", note: "دو فعل با and به هم وصل شدن: call و confirm، هر دو بعد از should."}
  en.b1.unit01.lesson02.teach.grammar_agreement: {title: "صرف have to برای اشخاص مختلف", gloss: "من باید برم. او باید بره. ما باید بریم. اونا باید برن.", note: "*have to* برای I/we/they/you ثابت می‌مونه، ولی برای he/she/it می‌شه *has to*. برخلاف have to، خود must و should برای هیچ شخصی تغییر نمی‌کنن."}

  en.b1.unit01.lesson03.teach.should_have_called: {title: "should have called", gloss: "باید زودتر تماس می‌گرفتم (افسوس)", note: "should have + قسمت سوم فعل (called) برای افسوس از کاری که در گذشته انجام ندادین استفاده می‌شه.", example_gloss: "باید زودتر تماس می‌گرفتم."}
  en.b1.unit01.lesson03.teach.must_not: {title: "must not", gloss: "نباید (ممنوعیت)", note: "must not یعنی یک کار قطعاً ممنوعه، نه فقط ضرورت نداشتنش.", example_gloss: "دیگه نباید فراموش کنی."}
  en.b1.unit01.lesson03.teach.dont_have_to: {title: "don't have to", gloss: "لازم نیست", note: "don't have to یعنی هیچ ضرورتی وجود نداره -- کاملاً متفاوت از must not (که یعنی ممنوعه).", example_gloss: "اگه سرت شلوغه، لازم نیست بیای."}
  en.b1.unit01.lesson03.teach.grammar_past_regret: {title: "افسوس گذشته و ممنوعیت", gloss: "باید تماس می‌گرفتم. فراموش کردم. دیگه نباید فراموش کنی. لازم نیست بیای.", note: "*should have called* افسوس از گذشته‌ست، *must not* یعنی ممنوعه، و *don't have to* یعنی لازم نیست -- هر سه با هم اشتباه گرفته می‌شن ولی معنی‌شون کاملاً فرق داره."}
  en.b1.unit01.lesson03.teach.reading_passage: {title: "متن: تمدید نکردن عضویت باشگاه", gloss: "دیروز، دنیل فراموش کرد عضویت باشگاهش رو تمدید کنه. باید یه یادآور توی گوشیش تنظیم می‌کرد. حالا باید جریمهٔ دیرکرد بپردازه. دیگه نباید ماه بعد فراموش کنه.", note: "این متن هم *should have* (افسوس گذشته) و هم *must* (ضرورت الان) و هم *must not* (ممنوعیت آینده) رو با هم نشون می‌ده."}

  en.b1.unit01.lesson04.teach.q_renew_gym: {title: "پرسش لیلا", gloss: "لیلا می‌پرسه دنیل، عضویت باشگاهت رو تمدید کردی؟", note: "did you...? برای پرسیدن دربارهٔ یک کار انجام‌شده یا انجام‌نشده در گذشته استفاده می‌شه."}
  en.b1.unit01.lesson04.teach.a_forgot_should_have: {title: "جواب دنیل", gloss: "دنیل می‌گه اوه نه، فراموش کردم! باید هفتهٔ پیش این کار رو انجام می‌دادم.", note: "should have done یعنی افسوس از کاری که هفتهٔ پیش باید انجام می‌داد ولی نداد."}
  en.b1.unit01.lesson04.teach.q_call_today: {title: "هشدار لیلا", gloss: "لیلا می‌گه باید امروز باهاشون تماس بگیری، وگرنه جریمهٔ دیرکرد می‌دی.", note: "or یعنی «وگرنه» -- نتیجهٔ منفی رو نشون می‌ده اگه کار انجام نشه."}
  en.b1.unit01.lesson04.teach.a_also_pay_rent: {title: "جواب دنیل دربارهٔ کارهای دیگه", gloss: "دنیل می‌گه حق با توئه. باید تا جمعه اجاره رو هم پرداخت کنم و بهتره با دندون‌پزشک هم تماس بگیرم.", note: "این جمله must have to (اجاره) و should (دندون‌پزشک) رو در کنار هم به کار می‌بره."}
  en.b1.unit01.lesson04.teach.q_dont_have_to: {title: "لیلا او رو آروم می‌کنه", gloss: "لیلا می‌گه لازم نیست همه چیز رو امروز انجام بدی. ولی دیگه نباید عضویت باشگاه رو فراموش کنی.", note: "don't have to (لازم نیست) در برابر must not (نباید) -- دو معنی کاملاً متفاوت در یک جمله."}
  en.b1.unit01.lesson04.teach.a_more_organized: {title: "جواب پایانی دنیل", gloss: "دنیل می‌گه می‌دونم. باید این ماه منظم‌تر باشم.", note: "must be یعنی باید (یک حالت/ویژگی) باشم، نه یک کار مشخص."}

exercises:
  en.b1.unit01.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شده را انتخاب کنین."
    correct_option: "appointment"
    distractors: ["must", "have to", "task"]
    accepted_answers: [{value: "appointment", status: "correct"}]
    feedback: "appointment یعنی قرار ملاقات."
  en.b1.unit01.lesson01.exercise02.choose_must_do_word:
    instruction: "کدام کلمه به معنای کاری است که باید انجام بدین؟"
    correct_option: "task"
    distractors: ["rent", "appointment", "should"]
    accepted_answers: [{value: "task", status: "correct"}]
    feedback: "task یعنی کار یا وظیفه."
  en.b1.unit01.lesson01.exercise03.choose_meeting_time_word:
    instruction: "کدام کلمه به معنای یک زمان مشخص برای دیدن کسیه، مثل دکتر؟"
    correct_option: "appointment"
    distractors: ["task", "rent", "must"]
    accepted_answers: [{value: "appointment", status: "correct"}]
    feedback: "appointment یعنی قرار ملاقات."
  en.b1.unit01.lesson01.exercise04.match_necessity_words:
    instruction: "هر کلمه یا عبارت انگلیسی رو به توضیح فارسی درست وصل کنین."
    pairs:
      - {left: "must", right: "باید (تعهد شخصی قوی)"}
      - {left: "have to", right: "باید (تعهد بیرونی)"}
      - {left: "should", right: "باید (توصیه)"}
      - {left: "task", right: "کار، وظیفه"}
      - {left: "rent", right: "اجاره"}
      - {left: "appointment", right: "قرار ملاقات"}
    accepted_answers:
      - value:
          - {left: "must", right: "باید (تعهد شخصی قوی)"}
          - {left: "have to", right: "باید (تعهد بیرونی)"}
          - {left: "should", right: "باید (توصیه)"}
          - {left: "task", right: "کار، وظیفه"}
          - {left: "rent", right: "اجاره"}
          - {left: "appointment", right: "قرار ملاقات"}
        status: "correct"
    feedback: "must=باید (شخصی)، have to=باید (بیرونی)، should=بهتره، task=کار، rent=اجاره، appointment=قرار ملاقات."
  en.b1.unit01.lesson01.exercise05.write_rent:
    instruction: "کلمه‌ای که به معنای پولیه که برای زندگی توی یه جا پرداخت می‌کنین را بنویسین."
    accepted_answers:
      - {value: "rent", status: "correct"}
      - {value: "Rent", status: "correct"}
    feedback: "rent یعنی اجاره."

  en.b1.unit01.lesson02.exercise01.choose_daniels_task:
    instruction: "دنیل می‌گه باید امروز یه کاری رو تموم کنه. چی می‌گه؟"
    correct_option: "I must finish this task today."
    distractors: ["I have to pay the rent by Friday.", "She has to make an appointment.", "You should call and confirm the appointment."]
    accepted_answers: [{value: "I must finish this task today.", status: "correct"}]
    feedback: "I must finish this task today یعنی باید امروز این کار رو تموم کنم."
  en.b1.unit01.lesson02.exercise02.choose_correct_agreement:
    instruction: "کدام جمله فعل درست را برای «she» به کار می‌بره؟"
    correct_option: "She has to make an appointment."
    distractors: ["She have to make an appointment.", "She must to make an appointment.", "She should to make an appointment."]
    accepted_answers: [{value: "She has to make an appointment.", status: "correct"}]
    feedback: "با he/she/it، have تبدیل به has می‌شه: has to."
  en.b1.unit01.lesson02.exercise03.order_have_to_pay_rent:
    instruction: "کلمات را برای گفتن «باید تا جمعه اجاره رو پرداخت کنم.» مرتب کنین."
    accepted_answers: [{value: ["I", "have", "to", "pay", "the", "rent", "by", "Friday"], status: "correct"}, {value: ["by", "Friday", "I", "have", "to", "pay", "the", "rent"], status: "correct"}]
