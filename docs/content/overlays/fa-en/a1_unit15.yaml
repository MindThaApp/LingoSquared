  en.a1.unit15.lesson01.teach.card: {title: "کارت", gloss: "کارت", note: "card واژهٔ عمومی برای هر نوع کارت پرداخت پلاستیکی است."}
  en.a1.unit15.lesson01.teach.credit_card: {title: "کارت اعتباری", gloss: "کارت اعتباری", note: "credit card یعنی کارتی که با آن پول قرض می‌گیرید و بعداً پس می‌دهید."}
  en.a1.unit15.lesson01.teach.debit_card: {title: "کارت بانکی", gloss: "کارت بانکی/کارت خرید مستقیم", note: "debit card یعنی کارتی که مستقیماً از حساب بانکی شما پول کم می‌کند."}
  en.a1.unit15.lesson01.teach.total: {title: "جمع کل", gloss: "جمع کل", note: "total یعنی مبلغ کل چیزی که باید پرداخت کنید."}

  en.a1.unit15.lesson02.teach.do_you_take_cards: {title: "کارت اعتباری قبول می‌کنید؟", gloss: "کارت اعتباری قبول می‌کنید؟", note: "Do you take credit cards؟ پرسش رایج پیش از پرداخت است."}
  en.a1.unit15.lesson02.teach.cash_only: {title: "ببخشید، فقط نقد", gloss: "ببخشید، فقط نقد قبول می‌کنیم", note: "Sorry, cash only پاسخ رایج فروشگاه‌هایی است که کارت قبول نمی‌کنند."}
