  en.b1.unit11.lesson04.exercise04.order_if_daniel_joined:
    instruction: "کلمات را برای گفتن «اگر دنیل شرکت می‌کرد، اعتمادبه‌نفس بیشتری پیدا می‌کردم.» مرتب کنین."
    accepted_answers: [{value: ["If", "Daniel", "joined", "I", "would", "feel", "more", "confident"], status: "correct"}]
    feedback: "ترتیب درست: If Daniel joined, I would feel more confident."
