course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح میانی (B1) برای فارسی‌زبان‌ها، با تمرکز بر شرط، توالی رویدادها، نقل قول غیرمستقیم، هدف و فرض‌های غیرواقعی."

units:
  en.b1.unit11.unreal_hypotheticals: {title: "اگه ارزون‌تر بود، ثبت‌نام می‌کردم"}

lessons:
  en.b1.unit11.lesson01.unreal_hypothetical_vocabulary: {title: "would، if I were و regret"}
  en.b1.unit11.lesson02.unreal_present: {title: "اگه وقت بیشتری داشتم، شرکت می‌کردم"}
  en.b1.unit11.lesson03.reading_a_missed_opportunity: {title: "متن: یک فرصت ازدست‌رفته"}
  en.b1.unit11.lesson04.the_design_course_dialogue: {title: "اگه ارزون‌تر بود، دوره رو برمی‌داشتی؟"}

teaching:
  en.b1.unit11.lesson01.teach.would: {title: "would", gloss: "می‌کردم / می‌شد (نتیجهٔ فرضی)", note: "would نتیجهٔ یک موقعیت خیالی یا ترجیح مؤدبانه را نشان می‌ده.", example_gloss: "اگر وقت بیشتری داشتم، شرکت می‌کردم."}
  en.b1.unit11.lesson01.teach.would_rather: {title: "would rather", gloss: "ترجیح می‌دادم", note: "would rather یعنی ترجیح دادن یک گزینه نسبت به گزینهٔ دیگر.", example_gloss: "ترجیح می‌دادم کلاس آخر هفته را بردارم."}
  en.b1.unit11.lesson01.teach.if_i_were: {title: "if I were", gloss: "اگر من بودم / اگر من ... بودم", note: "if I were برای معرفی یک وضعیت غیرواقعی دربارهٔ خودتون استفاده می‌شه.", example_gloss: "اگر امشب آزاد بودم، می‌رفتم."}
  en.b1.unit11.lesson01.teach.opportunity: {title: "opportunity", gloss: "فرصت", note: "opportunity یعنی موقعیت خوبی برای انجام کاری.", example_gloss: "این دوره برای لیلا یک فرصت خوبه."}
  en.b1.unit11.lesson01.teach.regret: {title: "regret", gloss: "حسرت، پشیمانی", note: "regret یعنی ناراحتی از یک انتخاب یا اتفاق گذشته.", example_gloss: "او یک حسرت دارد: زودتر پول پس‌انداز نکرد."}
  en.b1.unit11.lesson01.teach.take_a_chance: {title: "take a chance", gloss: "ریسک کردن، شانس خود را امتحان کردن", note: "take a chance یعنی کاری را امتحان کنین، حتی اگر موفقیتش قطعی نباشه.", example_gloss: "اگر دوره ارزان‌تر بود، شانسش را امتحان می‌کرد."}

  en.b1.unit11.lesson02.teach.more_time_course: {title: "If I had more time, I would take a design course.", gloss: "اگه وقت بیشتری داشتم، یک دورهٔ طراحی برمی‌داشتم.", note: "برای فرض غیرواقعی در زمان حال، بعد از *if* گذشتهٔ ساده میاد و نتیجه با *would* + فعل ساده ساخته می‌شه."}
  en.b1.unit11.lesson02.teach.cheaper_sign_up: {title: "If it were cheaper, I would sign up today.", gloss: "اگه ارزون‌تر بود، امروز ثبت‌نام می‌کردم.", note: "*were* اینجا برای وضعیت فرضی استفاده شده؛ دوره در واقع به اندازهٔ کافی ارزان نیست."}
  en.b1.unit11.lesson02.teach.grammar_unreal_present: {title: "شرط غیرواقعی حال", gloss: "اگه ارزون‌تر بود، ثبت‌نام می‌کردم.", note: "ساختار رایج: *if* + گذشتهٔ ساده، سپس *would* + فعل ساده. این دربارهٔ وضعیتی خیالی یا خلاف واقع در زمان حاله."}

  en.b1.unit11.lesson03.teach.sooner: {title: "sooner", gloss: "زودتر", note: "sooner یعنی در زمان قبلی یا زودتر از زمان واقعی.", example_gloss: "اگر زودتر خبر داشت، پول بیشتری پس‌انداز کرده بود."}
  en.b1.unit11.lesson03.teach.confident: {title: "confident", gloss: "بااعتمادبه‌نفس، مطمئن", note: "confident یعنی احساس کنین می‌تونین کاری را خوب انجام بدین.", example_gloss: "اگر دنیل هم شرکت می‌کرد، لیلا اعتمادبه‌نفس بیشتری پیدا می‌کرد."}
  en.b1.unit11.lesson03.teach.reading_passage: {title: "متن: یک فرصت ازدست‌رفته", gloss: "لیلا یک دورهٔ طراحی پیدا کرده که واقعاً می‌خواد برداره. دوره مفیده، ولی گرونه. اگر ارزان‌تر بود، امروز ثبت‌نام می‌کرد. اگر دنیل هم در کلاس شرکت می‌کرد، لیلا اعتمادبه‌نفس بیشتری پیدا می‌کرد. تنها حسرتش زمان‌بندیه: اگر زودتر دربارهٔ دوره خبر داشت، پول بیشتری پس‌انداز کرده بود.", note: "این متن شرط غیرواقعی حال (*If it were cheaper*) و شرط غیرواقعی گذشته (*If she had known*) را کنار هم نشان می‌ده."}

  en.b1.unit11.lesson04.teach.q_take_if_cheaper: {title: "پرسش میا", gloss: "میا می‌پرسه لیلا، اگه دورهٔ طراحی ارزون‌تر بود، برش می‌داشتی؟", note: "*would you take...?* یک سؤال فرضی و نرم‌تر دربارهٔ انتخاب لیلاست."}
  en.b1.unit11.lesson04.teach.a_sign_up_today: {title: "جواب لیلا", gloss: "لیلا می‌گه قطعاً. اگه ارزون‌تر بود، امروز ثبت‌نام می‌کردم.", note: "لیلا نتیجهٔ فرضی را با *I would sign up* بیان می‌کنه."}
  en.b1.unit11.lesson04.teach.q_daniel_joined: {title: "پرسش دوم میا", gloss: "میا می‌پرسه اگه دنیل هم شرکت می‌کرد چی؟", note: "*What if...?* یک راه کوتاه برای پرسیدن دربارهٔ یک فرض جدیده."}
  en.b1.unit11.lesson04.teach.a_more_confident: {title: "جواب لیلا دربارهٔ اعتمادبه‌نفس", gloss: "لیلا می‌گه اگه دنیل شرکت می‌کرد، اعتمادبه‌نفس بیشتری پیدا می‌کردم.", note: "اینجا *joined* گذشتهٔ ساده است، ولی معنی حال/آیندهٔ فرضی داره."}
  en.b1.unit11.lesson04.teach.q_would_rather_weekend: {title: "ترجیح میا", gloss: "میا می‌گه ترجیح می‌دادم کلاس آخر هفته را بردارم تا کلاس عصرانه را.", note: "*would rather ... than ...* برای مقایسهٔ دو ترجیح استفاده می‌شه."}
  en.b1.unit11.lesson04.teach.a_known_sooner: {title: "حسرت لیلا", gloss: "لیلا می‌گه من هم همین‌طور. اگر زودتر درباره‌اش خبر داشتم، پول بیشتری پس‌انداز کرده بودم.", note: "این شرط غیرواقعی گذشته‌ست: *If I had known* + *I would have saved*."}

exercises:
  en.b1.unit11.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و عبارتی را که گفته شده انتخاب کنین."
    correct_option: "would rather"
    distractors: ["opportunity", "if I were", "regret"]
    accepted_answers: [{value: "would rather", status: "correct"}]
    feedback: "would rather یعنی ترجیح می‌دادم."
  en.b1.unit11.lesson01.exercise02.choose_opportunity:
    instruction: "کدام کلمه یعنی یک فرصت خوب برای انجام کاری؟"
    correct_option: "opportunity"
    distractors: ["regret", "would rather", "take a chance"]
    accepted_answers: [{value: "opportunity", status: "correct"}]
    feedback: "opportunity یعنی فرصت."
  en.b1.unit11.lesson01.exercise03.choose_regret:
    instruction: "کدام کلمه یعنی ناراحتی از یک انتخاب گذشته؟"
    correct_option: "regret"
    distractors: ["opportunity", "confident", "would"]
    accepted_answers: [{value: "regret", status: "correct"}]
    feedback: "regret یعنی حسرت یا پشیمانی."
  en.b1.unit11.lesson01.exercise04.match_unreal_words:
    instruction: "هر معنی را به کلمه یا عبارت انگلیسی درست وصل کنید."
    accepted_answers:
      - value:
          - {left: "marks an imagined result or polite preference", right: "would"}
          - {left: "means would prefer to", right: "would rather"}
          - {left: "a good chance to do something", right: "opportunity"}
          - {left: "sadness about a past choice", right: "regret"}
        status: "correct"
    feedback: "هر تعریف به یک واژه یا عبارت انگلیسی اشاره می‌کنه."
  en.b1.unit11.lesson01.exercise05.write_would_rather:
    instruction: "عبارتی را بنویسین که یعنی «ترجیح می‌دادم»."
    accepted_answers:
      - {value: "would rather", status: "correct"}
      - {value: "Would rather", status: "correct"}
    feedback: "would rather یعنی ترجیح می‌دادم."

  en.b1.unit11.lesson02.exercise01.choose_more_time:
    instruction: "کدام جمله یک وضعیت متفاوت و خیالی در زمان حال را تصور می‌کنه؟"
    correct_option: "If I had more time, I would take a design course."
    distractors: ["If it rains tomorrow, we will stay home.", "I am taking an evening class in order to improve my English.", "Mia said that she was available after lunch."]
    accepted_answers: [{value: "If I had more time, I would take a design course.", status: "correct"}]
    feedback: "If I had more time...I would... یک شرط غیرواقعی حاله."
  en.b1.unit11.lesson02.exercise02.choose_cheaper_course:
    instruction: "کدام جمله تصور می‌کنه اگر دوره کم‌هزینه‌تر بود چه اتفاقی می‌افتاد؟"
    correct_option: "If it were cheaper, I would sign up today."
    distractors: ["If the report is not ready, we will reschedule the review.", "I study every night so that I can remember more vocabulary.", "Leila told me that the room was busy."]
    accepted_answers: [{value: "If it were cheaper, I would sign up today.", status: "correct"}]
    feedback: "If it were cheaper یعنی اگر ارزان‌تر بود؛ این یک وضعیت فرضیه."
  en.b1.unit11.lesson02.exercise03.order_if_more_time:
    instruction: "کلمات را برای گفتن «اگه وقت بیشتری داشتم، یک دورهٔ طراحی برمی‌داشتم.» مرتب کنین."
    accepted_answers: [{value: ["If", "I", "had", "more", "time", "I", "would", "take", "a", "design", "course"], status: "correct"}]
    feedback: "ترتیب درست: If I had more time, I would take a design course."
  en.b1.unit11.lesson02.exercise04.reply_if_more_time:
    instruction: "اگر وقت بیشتری داشتین، چیکار می‌کردین؟"
    accepted_answers:
      - {value: "If I had more time, I would take a design course.", status: "correct"}
      - {value: "If I had more time, I would take a design course", status: "correct"}
      - {value: "If I had more time, I'd take a design course.", status: "correct"}
      - {value: "If I had more time, I'd take a design course", status: "correct"}
    feedback: "این جواب یک شرط غیرواقعی حال و نتیجهٔ فرضی را بیان می‌کنه."
  en.b1.unit11.lesson02.exercise05.write_if_cheaper:
    instruction: "بنویسین که اگر ارزان‌تر بود، امروز ثبت‌نام می‌کردین."
    accepted_answers:
      - {value: "If it were cheaper, I would sign up today.", status: "correct"}
      - {value: "If it were cheaper, I would sign up today", status: "correct"}
      - {value: "If it were cheaper, I'd sign up today.", status: "correct"}
      - {value: "If it were cheaper, I'd sign up today", status: "correct"}
    feedback: "If it were cheaper یعنی اگر ارزان‌تر بود."

  en.b1.unit11.lesson03.exercise01.comprehend_if_cheaper:
    instruction: "اگر دوره ارزان‌تر بود، لیلا چیکار می‌کرد؟"
