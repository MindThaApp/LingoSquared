    accepted_answers:
      - {value: "If I had known sooner, I would have saved more money.", status: "correct"}
      - {value: "If I had known sooner, I would have saved more money", status: "correct"}
      - {value: "If I had known sooner, I would've saved more money.", status: "correct"}
      - {value: "If I had known sooner, I would've saved more money", status: "correct"}
    feedback: "would have saved برای نتیجهٔ فرضی در گذشته استفاده شده."

  en.b1.unit11.lesson04.exercise01.listen_if_cheaper:
    instruction: "گفتگو را گوش کنین و بگین لیلا اگر دوره ارزان‌تر بود چیکار می‌کرد."
    correct_option: "I would sign up today"
    distractors: ["I would wait until summer", "I would ask for a discount", "I would choose the evening class"]
    accepted_answers: [{value: "I would sign up today", status: "correct"}]
