    accepted_answers:
      - {value: "Definitely. If it were cheaper, I would sign up today.", status: "correct"}
      - {value: "Definitely, if it were cheaper, I would sign up today.", status: "correct"}
      - {value: "Definitely. If it were cheaper, I'd sign up today.", status: "correct"}
      - {value: "Definitely, if it were cheaper, I'd sign up today.", status: "correct"}
    feedback: "این جواب هم پاسخ مثبت می‌ده و هم نتیجهٔ فرضی را با would بیان می‌کنه."
  en.b1.unit11.lesson04.exercise06.speak_unreal_hypothetical_dialogue:
    instruction: "به نقش لیلا، با صدای بلند به میا جواب بدین."
    accepted_answers:
      - {value: "Me too. If I had known about it sooner, I would have saved more money.", status: "correct"}
      - {value: "Me too. If I had known about it sooner, I would've saved more money.", status: "correct"}
    feedback: "این جواب حسرت گذشته را با If I had known و would have saved بیان می‌کنه."
