  en.a1.unit68.lesson04.exercise03.reading_charger:
    instruction: "طبق متن، کی شارژر لازم داشت؟"
    correct_option: "Mia"
    distractors: ["Leila", "Daniel", "the pharmacist"]
    accepted_answers: [{value: "Mia", status: "correct"}]
    feedback: "متن می‌گه میا شارژر لازم داشت."
  en.a1.unit68.lesson04.exercise04.reading_why_note:
