  en.a1.unit68.lesson02.teach.return_tomorrow: {title: "درخواست پس دادن", gloss: "لطفاً فردا پسش بدین.", note: "*Please return it tomorrow* زمان پس دادن رو روشن می‌کنه."}
  en.a1.unit68.lesson02.teach.thanks_lending: {title: "تشکر بابت قرض دادن", gloss: "ممنون که قرضش دادی.", note: "*Thank you for lending it* برای تشکر از قرض دادن چیزیه."}
  en.a1.unit68.lesson02.teach.need_today: {title: "نیاز داشتن امروز", gloss: "امروز لازمش دارم.", note: "*I need it today* یعنی همین امروز به اون چیز نیاز دارم."}

  en.a1.unit68.lesson03.teach.dialogue_line1: {title: "درخواست لیلا", gloss: "لیلا می‌گه: سلام میا. می‌تونم چترت رو قرض بگیرم؟", note: "لیلا با *Can I borrow ...?* مؤدبانه چتر می‌خواد."}
  en.a1.unit68.lesson03.teach.dialogue_line2: {title: "قبول میا", gloss: "میا می‌گه: بله، می‌تونم اونو بهت قرض بدم.", note: "میا با *I can lend it to you* قبول می‌کنه."}
  en.a1.unit68.lesson03.teach.dialogue_line3: {title: "دلیل لیلا", gloss: "لیلا می‌گه: ممنون. امروز بارون میاد.", note: "لیلا دلیل نیاز به چتر رو می‌گه."}
  en.a1.unit68.lesson03.teach.dialogue_line4: {title: "زمان پس دادن", gloss: "میا می‌گه: لطفاً فردا پسش بده.", note: "میا زمان برگشت دادن چتر رو مشخص می‌کنه."}
  en.a1.unit68.lesson03.teach.dialogue_line5: {title: "پیشنهاد لیلا", gloss: "لیلا می‌گه: حتماً. شارژر لازم داری؟", note: "لیلا بعد از قبول کردن، دربارهٔ شارژر می‌پرسه."}
  en.a1.unit68.lesson03.teach.dialogue_line6: {title: "درخواست میا", gloss: "میا می‌گه: بله، می‌تونی یک شارژر بهم قرض بدی؟", note: "میا هم با *lend me* درخواست قرض گرفتن می‌کنه."}
  en.a1.unit68.lesson03.teach.dialogue_line7: {title: "قبول لیلا", gloss: "لیلا می‌گه: حتماً. می‌تونم یکی بهت قرض بدم.", note: "لیلا قرض دادن شارژر رو قبول می‌کنه."}

  en.a1.unit68.lesson04.teach.borrowing_note: {title: "متن: یادداشت قرضی", gloss: "یادداشت قرضی: لیلا امروز چتر میا رو داره. فردا پسش بده. میا شارژر لیلا رو داره.", note: "این یادداشت می‌گه هر کس چی رو قرض گرفته و کی باید پس بده."}
  en.a1.unit68.lesson04.teach.reading_passage: {title: "متن: دوستانی که وسایل‌شون رو شریک می‌شن", gloss: "دوستانی که وسایل‌شون رو شریک می‌شن: بارون می‌اومد، پس لیلا از میا چتر خواست. میا گفت می‌تونه اون رو به لیلا قرض بده. میا از لیلا خواست فردا پسش بده. بعد میا شارژر لازم داشت. لیلا یک شارژر به میا قرض داد. هر دو دوست یک یادداشت کوتاه نوشتن تا یادشون بمونه چی رو باید پس بدن.", note: "این متن قرض گرفتن چتر و قرض دادن شارژر بین دو دوست رو روایت می‌کنه."}
  en.a1.unit68.lesson04.teach.borrowed_umbrella: {title: "I borrowed your umbrella.", gloss: "چترت رو قرض گرفتم.", note: "*borrowed* گذشتهٔ فعل *borrow* است."}
  en.a1.unit68.lesson04.teach.will_return_tomorrow: {title: "I will return it tomorrow.", gloss: "فردا پسش می‌دم.", note: "*will* + فعل ساده، زمان آینده رو نشون می‌ده."}

exercises:
  en.a1.unit68.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "umbrella"
    distractors: ["raincoat", "backpack", "wallet", "notebook"]
    accepted_answers: [{value: "umbrella", status: "correct"}]
    feedback: "*umbrella* یعنی چتر."
  en.a1.unit68.lesson01.exercise02.choose_borrow_meaning:
    instruction: "کدوم کلمه یعنی چیزی رو استفاده کنین و بعداً پس بدین؟"
    correct_option: "borrow"
    distractors: ["lend", "return", "tomorrow"]
    accepted_answers: [{value: "borrow", status: "correct"}]
    feedback: "*borrow* یعنی قرض گرفتن."
  en.a1.unit68.lesson01.exercise03.match_borrowing_words:
    instruction: "هر توضیح انگلیسی رو به کلمهٔ درستش وصل کنین."
    accepted_answers: [{value: [{left: "use something and give it back later", right: "borrow"}, {left: "give something for someone to use for a short time", right: "lend"}, {left: "something you use in rain", right: "umbrella"}, {left: "a cable or plug for a phone battery", right: "charger"}, {left: "give something back", right: "return"}, {left: "the day after today", right: "tomorrow"}], status: "correct"}]
    feedback: "borrow=قرض گرفتن، lend=قرض دادن، umbrella=چتر، charger=شارژر، return=پس دادن، tomorrow=فردا."
  en.a1.unit68.lesson01.exercise04.order_borrow_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["Can", "I", "borrow", "your", "umbrella?"], status: "correct"}]
    feedback: "ترتیب درست: *Can I borrow your umbrella?*"
  en.a1.unit68.lesson01.exercise05.write_charger:
    instruction: "کلمه‌ای رو بنویسین که یعنی کابل یا دوشاخه برای باتری گوشی."
    accepted_answers: [{value: "charger", status: "correct"}]
    feedback: "*charger* یعنی شارژر."

  en.a1.unit68.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "Can I borrow your umbrella?"
    distractors: ["Can I borrow your jacket?", "Can I borrow your phone?", "Can I borrow your notebook?"]
    accepted_answers: [{value: "Can I borrow your umbrella?", status: "correct"}]
    feedback: "*Can I borrow your umbrella?* یعنی می‌تونم چترت رو قرض بگیرم؟"
  en.a1.unit68.lesson02.exercise02.choose_borrow_request:
    instruction: "کدوم عبارت از کسی می‌خواد چترش رو قرض بده؟"
    correct_option: "Can I borrow your umbrella?"
    distractors: ["Can you lend me a charger?", "Please return it tomorrow.", "I need it today."]
    accepted_answers: [{value: "Can I borrow your umbrella?", status: "correct"}]
    feedback: "*Can I borrow your umbrella?* درخواست قرض گرفتن چتره."
  en.a1.unit68.lesson02.exercise03.choose_return_request:
    instruction: "کدوم عبارت از کسی می‌خواد فردا چیزی رو پس بده؟"
    correct_option: "Please return it tomorrow."
    distractors: ["Can I borrow your umbrella?", "I can lend it to you.", "I need it today."]
    accepted_answers: [{value: "Please return it tomorrow.", status: "correct"}]
    feedback: "*Please return it tomorrow* یعنی لطفاً فردا پسش بدین."
  en.a1.unit68.lesson02.exercise04.order_lend_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["Can", "you", "lend", "me", "a", "charger?"], status: "correct"}]
    feedback: "ترتیب درست: *Can you lend me a charger?*"
  en.a1.unit68.lesson02.exercise05.translate_today:
    instruction: "ترجمه کنین: «امروز لازمش دارم.»"
    accepted_answers: [{value: "I need it today.", status: "correct"}, {value: "I need it today", status: "correct"}]
    feedback: "*I need it today* یعنی امروز لازمش دارم."

  en.a1.unit68.lesson03.exercise01.comprehension_item:
    instruction: "طبق گفتگو، لیلا چی رو قرض می‌گیره؟"
    correct_option: "umbrella"
    distractors: ["charger", "jacket", "bag"]
    accepted_answers: [{value: "umbrella", status: "correct"}]
    feedback: "لیلا از میا چتر قرض می‌گیره."
  en.a1.unit68.lesson03.exercise02.comprehension_return_time:
    instruction: "طبق گفتگو، لیلا کی باید چتر رو پس بده؟"
    correct_option: "tomorrow"
    distractors: ["today", "soon", "next week"]
    accepted_answers: [{value: "tomorrow", status: "correct"}]
    feedback: "میا می‌گه لطفاً فردا پسش بده."
  en.a1.unit68.lesson03.exercise03.listen_dialogue_borrow:
    instruction: "لیلا کدوم درخواست رو می‌گه؟"
    correct_option: "Can I borrow your umbrella?"
    distractors: ["Can I borrow your charger?", "Can I borrow your jacket?", "Can I borrow your bag?"]
    accepted_answers: [{value: "Can I borrow your umbrella?", status: "correct"}]
    feedback: "لیلا می‌گه: *Can I borrow your umbrella?*"
  en.a1.unit68.lesson03.exercise04.respond_own_borrow_request:
    instruction: "درخواست قرض گرفتن کنین، چیزی رو قرض بدین، یا پس دادن چیزی رو بخواین."
