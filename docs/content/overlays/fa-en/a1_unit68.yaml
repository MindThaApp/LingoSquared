    accepted_answers: [{value: "to remember what to return", status: "correct"}]
    feedback: "متن می‌گه یادداشت نوشتن تا یادشون بمونه چی رو باید پس بدن."
  en.a1.unit68.lesson04.exercise05.write_own_borrowing_note:
    instruction: "یک یادداشت کوتاه بنویسین: بگین چتر قرض گرفتین و کی پسش می‌دین."
