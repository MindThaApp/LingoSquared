  en.a1.unit68.lesson02.teach.lend_charger: {title: "درخواست قرض دادن شارژر", gloss: "می‌تونی یک شارژر بهم قرض بدی؟", note: "*Can you lend me ...?* یعنی از کسی می‌خواین چیزی رو موقتاً به شما بده."}
