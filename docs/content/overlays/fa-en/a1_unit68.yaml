  en.a1.unit68.lesson04.exercise02.note_return_time:
    instruction: "طبق یادداشت، لیلا کی باید چتر رو پس بده؟"
    correct_option: "tomorrow"
    distractors: ["today", "soon", "next week"]
    accepted_answers: [{value: "tomorrow", status: "correct"}]
