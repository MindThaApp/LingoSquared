review: {status: "reviewed", required_next_reviewer: null, notes: "New overlay against the shared English realization unit44 (seasons), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1, every teaching card with a realization example: has a matching example_gloss:. Contrastive-grammar points, deliberately different from ones already used in this direction: (1) 'fall' with a bare, article-free time expression IN the season name (in fall / in the fall are both heard, but this realization consistently uses 'in the fall' pattern via 'in the summer' etc. for the phrase-lesson card) -- Persian's equivalent پاییز needs no preposition-plus-article combination at all when used adverbially (پاییز برگ‌ها رنگ عوض می‌کنن, no equivalent of 'in the'), so the whole prepositional frame in the ___ is flagged as an English-only addition with no word-for-word Persian counterpart; (2) flowers bloom as a bare intransitive verb with no object -- Persian's natural equivalent گل‌ها شکوفا می‌شن also intransitive, but built on a compound verb (شکوفا شدن, literally 'blossoming become') rather than a single verb root, so English's single-word bloom compresses what Persian expresses with an adjective-plus-auxiliary; (3) it snows as an impersonal/dummy-subject construction (it, referring to nothing) -- Persian has no equivalent dummy subject at all, weather statements are simply subjectless verb forms (برف می‌باره, literally just 'snow falls' with بارش/برف as the real subject or no subject marker), so English's semantically empty it is flagged as a pure grammar requirement with nothing to translate. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, NOT translated Persian lefts, per the established compiler-driven precedent. lesson03/lesson04 multiple_choice and listen_select distractor sets copied verbatim from the realization's own review notes documenting the exact invented, never-spoken-in-this-unit values already verified safe. Strong sibling-isolation rule applied -- nl-en/prs-en overlays for this unit were not consulted. Needs the mandatory fresh-context review before shipping.\n\nfa-en review 2026-10-19: Checked notes, glosses, Persian style, distractors, answers, canon and sequencing. 10 fixes: false note that seasons always take the (the unit itself teaches in spring/in winter), dialogue gloss for painting outside, a partly-correct distractor (warm and sunny) and 8 untaught distractors replaced (vacation, planting, run, picnic, ends, starts, picks, sells), What is / autumn answers added."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit44.seasons: {title: "صحبت دربارهٔ فصل‌ها"}

lessons:
  en.a1.unit44.lesson01.seasons_vocabulary: {title: "کلمات فصل‌ها"}
  en.a1.unit44.lesson02.talking_about_seasons: {title: "صحبت دربارهٔ فصل‌ها"}
  en.a1.unit44.lesson03.dialogue_favorite_seasons: {title: "گفتگو: فصل موردعلاقه"}
  en.a1.unit44.lesson04.three_friends_three_favorite_seasons: {title: "متن: سه دوست، سه فصل موردعلاقه"}

teaching:
  en.a1.unit44.lesson01.teach.spring: {title: "spring", gloss: "بهار", note: "*spring* یعنی بهار.", example_gloss: "گل‌ها بهار شکوفا می‌شن."}
  en.a1.unit44.lesson01.teach.summer: {title: "summer", gloss: "تابستون", note: "*summer* یعنی تابستون.", example_gloss: "تابستون‌ها می‌رم ساحل."}
  en.a1.unit44.lesson01.teach.fall: {title: "fall", gloss: "پاییز", note: "*fall* یعنی پاییز (توی انگلیسی آمریکایی؛ *autumn* هم همینو می‌گه ولی این دوره از *fall* استفاده می‌کنه).", example_gloss: "پاییز برگ‌ها رنگ عوض می‌کنن."}
  en.a1.unit44.lesson01.teach.winter: {title: "winter", gloss: "زمستون", note: "*winter* یعنی زمستون.", example_gloss: "زمستونا برف می‌باره."}
  en.a1.unit44.lesson01.teach.season: {title: "season", gloss: "فصل", note: "*season* یعنی فصل -- یه بخش از سال با آب‌وهوای مخصوص خودش.", example_gloss: "فصل موردعلاقه‌ت چیه؟"}

  en.a1.unit44.lesson02.teach.in_the_summer: {title: "in the summer", gloss: "توی تابستون", note: "*in the summer* -- با فصل‌ها هم *in the summer* درسته هم *in summer* (مثل *It snows in winter*)؛ *the* اینجا اختیاریه. فارسی فقط می‌گه «تابستون» یا «توی تابستون».", example_gloss: "ما تابستونا می‌ریم ساحل."}
  en.a1.unit44.lesson02.teach.leaves_change_color: {title: "the leaves change color", gloss: "برگ‌ها رنگ عوض می‌کنن", note: "*the leaves change color* -- فعل *change* اینجا متعدیه (رنگشونو عوض می‌کنن).", example_gloss: "توی پاییز، برگ‌ها رنگ عوض می‌کنن."}
  en.a1.unit44.lesson02.teach.it_snows_a_lot: {title: "it snows a lot", gloss: "خیلی برف می‌باره", note: "*it snows* -- ضمیر *it* اینجا معنی خاصی نداره، فقط برای درست بودن گرامر جمله لازمه؛ فارسی هیچ ضمیر معادلی نمی‌خواد -- فقط «برف می‌باره».", example_gloss: "زمستونا خیلی برف می‌باره."}
  en.a1.unit44.lesson02.teach.flowers_bloom: {title: "flowers bloom", gloss: "گل‌ها شکوفا می‌شن", note: "*bloom* یه فعل ساده و تک‌کلمه‌ست؛ فارسی همون معنی رو با فعل مرکب «شکوفا شدن» می‌سازه.", example_gloss: "گل‌ها بهار شکوفا می‌شن."}
  en.a1.unit44.lesson02.teach.whats_your_favorite_season: {title: "What's your favorite season?", gloss: "فصل موردعلاقه‌ت چیه؟", note: "*What's your favorite ...?* -- الگوی سؤال آشنا از درسای قبلی."}
  en.a1.unit44.lesson02.teach.my_favorite_season_is: {title: "My favorite season is fall.", gloss: "فصل موردعلاقه‌م پاییزه.", note: "*My favorite ... is ...* -- الگوی جواب آشنا."}

  en.a1.unit44.lesson03.teach.dialogue_line1: {title: "سؤال میا", gloss: "میا از لیلا می‌پرسه فصل موردعلاقه‌ش چیه.", note: "*What's your favorite season, Leila?* -- سؤال مستقیم با اسم مخاطب."}
  en.a1.unit44.lesson03.teach.dialogue_line2: {title: "جواب لیلا", gloss: "لیلا می‌گه پاییز -- برگ‌ها رنگ عوض می‌کنن و هوا برای نقاشی کردن توی فضای باز عالیه.", note: "*great weather for painting outside* -- *for* + فعل *-ing* برای هدف."}
  en.a1.unit44.lesson03.teach.dialogue_line3: {title: "جواب میا", gloss: "میا می‌گه به‌نظر قشنگ میاد -- فصل موردعلاقه‌ش بهاره.", note: "*That sounds nice* -- ابراز پسندیدن یه چیزی که شنیدین."}
  en.a1.unit44.lesson03.teach.dialogue_line4: {title: "سؤال لیلا", gloss: "لیلا می‌پرسه چرا بهار؟", note: "*Why spring?* -- سؤال کوتاه بدون فعل کامل، فقط با کلمهٔ سؤالی."}
  en.a1.unit44.lesson03.teach.dialogue_line5: {title: "جواب میا", gloss: "میا می‌گه گل‌ها شکوفا می‌شن، و اون عاشق عکس گرفتن ازشون برای کلاس عکاسیشه.", note: "*I love taking photos* -- فعل *love* + فعل *-ing*."}
  en.a1.unit44.lesson03.teach.dialogue_line6: {title: "جواب لیلا", gloss: "لیلا می‌گه منطقیه! و می‌پرسه بهار جایی که عکس می‌گیره گرمه یا سرد.", note: "*That makes sense!* -- تأیید منطقی بودن یه حرف."}
  en.a1.unit44.lesson03.teach.dialogue_line7: {title: "جواب میا", gloss: "میا می‌گه معمولاً گرمه، با یه‌کم بارون -- عالیه برای قدم زدن بیرون.", note: "*Perfect for walking around outside* -- جملهٔ کوتاه بدون فعل کامل."}

  en.a1.unit44.lesson04.teach.reading_passage: {title: "متن: سه دوست، سه فصل موردعلاقه", gloss: "دنیل، لیلا و میا هر سه فصل موردعلاقهٔ متفاوتی دارن. فصل موردعلاقهٔ دنیل تابستونه. اون وقتی هوا گرم و آفتابیه عاشق فوتبال بازی کردن و دویدنه. فصل موردعلاقهٔ لیلا پاییزه، چون عاشق نقاشی کردن برگ‌هاییه که دارن رنگ عوض می‌کنن. فصل موردعلاقهٔ میا بهاره. اون از گل‌ها برای کلاس عکاسیش عکس می‌گیره. با اینکه هر سه‌شون فصل‌های متفاوتی دوست دارن، همیشه وقت پیدا می‌کنن با هم از فضای بیرون لذت ببرن.", note: "دقت کنین *loves playing* و *going running* هر دو فعل *-ing* بعد از فعل *loves* میارن -- الگوی معمول بعد از فعل‌های ابراز علاقه."}

exercises:
  en.a1.unit44.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "fall"
    distractors: ["spring", "summer", "winter", "season"]
    accepted_answers: [{value: "fall", status: "correct"}]
    feedback: "*fall* یعنی پاییز."
  en.a1.unit44.lesson01.exercise02.choose_winter_meaning:
    instruction: "کدوم فصل سردترینه و برف می‌باره؟"
    correct_option: "winter"
    distractors: ["spring", "summer", "fall"]
    accepted_answers: [{value: "winter", status: "correct"}]
    feedback: "*winter* یعنی زمستون."
  en.a1.unit44.lesson01.exercise03.match_season_words:
    instruction: "هر واژه یا عبارت انگلیسی رو به توضیح فارسی درستش وصل کنین."
    pairs:
      - {left: "spring", right: "وقتی گل‌ها شکوفه می‌دن"}
      - {left: "summer", right: "وقتی هوا گرمه و مردم به ساحل می‌رن"}
      - {left: "fall", right: "وقتی برگ‌ها تغییر رنگ می‌دن"}
      - {left: "winter", right: "وقتی اغلب برف میاد"}
      - {left: "season", right: "بخشی از سال با آب‌وهوای مخصوص خودش"}
    accepted_answers:
      - value:
          - {left: "spring", right: "وقتی گل‌ها شکوفه می‌دن"}
          - {left: "summer", right: "وقتی هوا گرمه و مردم به ساحل می‌رن"}
          - {left: "fall", right: "وقتی برگ‌ها تغییر رنگ می‌دن"}
          - {left: "winter", right: "وقتی اغلب برف میاد"}
          - {left: "season", right: "بخشی از سال با آب‌وهوای مخصوص خودش"}
        status: "correct"
    feedback: "spring=بهار، summer=تابستون، fall=پاییز، winter=زمستون، season=فصل."
  en.a1.unit44.lesson01.exercise04.order_winter_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["It", "snows", "in", "winter."], status: "correct"}]
    feedback: "ترتیب درست: *It snows in winter.*"
  en.a1.unit44.lesson01.exercise05.write_spring_word:
    instruction: "اسم فصلی رو بنویسین که گل‌ها شکوفا می‌شن."
    accepted_answers: [{value: "spring", status: "correct"}]
    feedback: "*spring* یعنی بهار."

  en.a1.unit44.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "the leaves change color"
    distractors: ["in the summer", "it snows a lot", "flowers bloom"]
    accepted_answers: [{value: "the leaves change color", status: "correct"}]
    feedback: "*the leaves change color* یعنی برگ‌ها رنگ عوض می‌کنن."
  en.a1.unit44.lesson02.exercise02.choose_flowers_bloom_meaning:
    instruction: "کدوم عبارت اتفاقی که برای گیاه‌ها توی بهار میفته رو توصیف می‌کنه؟"
    correct_option: "flowers bloom"
    distractors: ["in the summer", "the leaves change color", "it snows a lot"]
    accepted_answers: [{value: "flowers bloom", status: "correct"}]
    feedback: "*flowers bloom* یعنی گل‌ها شکوفا می‌شن."
  en.a1.unit44.lesson02.exercise03.choose_it_snows_a_lot_meaning:
    instruction: "کدوم عبارت آب‌وهوای معمول زمستونو توصیف می‌کنه؟"
    correct_option: "it snows a lot"
    distractors: ["in the summer", "the leaves change color", "flowers bloom"]
    accepted_answers: [{value: "it snows a lot", status: "correct"}]
    feedback: "*it snows a lot* یعنی خیلی برف می‌باره."
  en.a1.unit44.lesson02.exercise04.order_spring_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["Flowers", "bloom", "in", "the", "spring."], status: "correct"}]
    feedback: "ترتیب درست: *Flowers bloom in the spring.*"
  en.a1.unit44.lesson02.exercise05.translate_favorite_season_question:
    instruction: "ترجمه کنین: «فصل موردعلاقه‌ت چیه؟»"
    accepted_answers: [{value: "What's your favorite season?", status: "correct"}, {value: "What's your favorite season", status: "correct"}, {value: "What is your favorite season?", status: "correct"}, {value: "What is your favorite season", status: "correct"}]
    feedback: "*What's your favorite season?*"

  en.a1.unit44.lesson03.exercise01.comprehension_leila_favorite_season:
    instruction: "طبق گفتگو، فصل موردعلاقهٔ لیلا چیه؟"
    correct_option: "fall"
    distractors: ["spring", "summer", "winter"]
    accepted_answers: [{value: "fall", status: "correct"}]
    feedback: "لیلا می‌گه پاییز رو دوست داره."
  en.a1.unit44.lesson03.exercise02.comprehension_mia_spring_reason:
    instruction: "طبق گفتگو، چرا میا بهار رو دوست داره؟"
    correct_option: "flowers bloom"
    distractors: ["it snows a lot", "she goes to the beach", "the leaves change color"]
    accepted_answers: [{value: "flowers bloom", status: "correct"}]
    feedback: "میا می‌گه گل‌ها شکوفا می‌شن."
  en.a1.unit44.lesson03.exercise03.listen_dialogue_mia_spring_activity:
    instruction: "طبق گفتگو، میا با گل‌های بهاری چیکار می‌کنه؟"
    correct_option: "taking photos"
    distractors: ["painting them", "buying them", "sending them to friends"]
    accepted_answers: [{value: "taking photos", status: "correct"}]
    feedback: "میا می‌گه عاشق عکس گرفتن ازشونه."
  en.a1.unit44.lesson03.exercise04.respond_own_favorite_season:
    instruction: "فصل موردعلاقه‌تونو بگین، یا از کسی بپرسین فصل موردعلاقه‌ش چیه."
    accepted_answers: ["My favorite season is fall", "My favorite season is fall.", "My favorite season is spring", "My favorite season is spring.", "My favorite season is summer", "My favorite season is summer.", "My favorite season is winter", "My favorite season is winter.", "What's your favorite season?", "What is your favorite season?", "My favorite season is autumn."]
    feedback: "می‌تونین از الگوی *My favorite season is ...* یا *What's your favorite season?* استفاده کنین."

  en.a1.unit44.lesson04.exercise01.reading_daniel_favorite_season:
    instruction: "طبق متن، فصل موردعلاقهٔ دنیل چیه؟"
    correct_option: "summer"
    distractors: ["winter", "fall", "spring"]
    accepted_answers: [{value: "summer", status: "correct"}]
    feedback: "متن می‌گه فصل موردعلاقهٔ دنیل تابستونه."
  en.a1.unit44.lesson04.exercise02.reading_leila_fall_reason:
    instruction: "طبق متن، چرا پاییز فصل موردعلاقهٔ لیلاست؟"
    correct_option: "painting the leaves"
    distractors: ["it's warm and sunny", "it snows a lot", "it's her birthday"]
    accepted_answers: [{value: "painting the leaves", status: "correct"}]
    feedback: "متن می‌گه اون عاشق نقاشی کردن برگ‌هاست."
  en.a1.unit44.lesson04.exercise03.reading_mia_spring_activity:
    instruction: "طبق متن، میا با گل‌های بهاری چیکار می‌کنه؟"
    correct_option: "takes photos"
    distractors: ["buys them", "paints them", "sends them to Leila"]
    accepted_answers: [{value: "takes photos", status: "correct"}]
    feedback: "متن می‌گه میا ازشون عکس می‌گیره."
  en.a1.unit44.lesson04.exercise04.write_own_favorite_season_sentence:
    instruction: "یه جمله دربارهٔ فصل موردعلاقهٔ خودتون بنویسین، با «My favorite season is...»."
    accepted_answers: ["My favorite season is spring", "My favorite season is spring.", "My favorite season is summer", "My favorite season is summer.", "My favorite season is fall", "My favorite season is fall.", "My favorite season is winter", "My favorite season is winter.", "My favorite season is autumn", "My favorite season is autumn."]
    feedback: "می‌تونین از الگوی *My favorite season is ...* استفاده کنین."
