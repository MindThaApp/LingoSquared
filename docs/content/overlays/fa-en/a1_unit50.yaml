review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit50 (checking into a hotel). Authored fully at schema_version 1.1, every kind: vocabulary teaching card has a matching example_gloss:. Contrastive-grammar points for this unit: (1) possessive 's in 'What's the name on the reservation?' -- English marks possession/identity with an apostrophe-s contraction fused onto the question word (What's = What is), a construction with no direct Farsi analogue (فارسی برای این سؤال از یک فعل کامل و مستقل استفاده می‌کنه: اسم روی رزرو چیه؟); flagged on that dialogue-line card. (2) 'for two nights' -- English marks duration with the preposition for before a bare number+noun, while Farsi states the duration with no preposition at all (دو شب رزرو داریم، بدون حرف اضافه); flagged on the reservation vocabulary card. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, not translated Farsi lefts, per the established fa-en convention. Every listen_select/multiple_choice distractor in lesson03/lesson04 is an invented value never stated elsewhere in this unit (invented room features, invented dates/times) per CLAUDE.md's standing listen_select-distractor footgun -- checked the dialogue's own lines (Mia: 'Hi, we have a reservation for two nights.', 'Does the room have wifi?'; Receptionist: four lines; Leila: 'It's under my name, Leila.', 'Thank you! What time is check-out?') to confirm no distractor value used here is something the tested speaker also says elsewhere in the same audio. Strong sibling-isolation rule applied -- nl-en/prs-en overlays and the concurrent units 39-48 dispatch were not consulted. Needs the mandatory fresh-context review before shipping, and inherits the underlying realization's own still-unreviewed status."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit50.accommodation: {title: "چک این کردن در هتل"}

lessons:
  en.a1.unit50.lesson01.accommodation_vocabulary: {title: "کلمات چک این کردن"}
  en.a1.unit50.lesson02.checking_in_at_the_front_desk: {title: "چک این کردن در پذیرش"}
  en.a1.unit50.lesson03.dialogue_checking_in_for_the_weekend: {title: "گفتگو: چک این برای آخر هفته"}
  en.a1.unit50.lesson04.a_weekend_at_the_guesthouse: {title: "متن: یک آخر هفته در مهمان‌خونه"}

teaching:
  en.a1.unit50.lesson01.teach.hotel: {title: "hotel", gloss: "هتل", note: "*hotel* یعنی جایی که مسافرها پول می‌دن و شب می‌مونن.", example_gloss: "ما تو یه هتل کوچیک اقامت داریم."}
  en.a1.unit50.lesson01.teach.room: {title: "room", gloss: "اتاق", note: "*room* یعنی جایی که تخت داره و مهمون توش می‌خوابه.", example_gloss: "اتاق ما دو تا تخت داره."}
  en.a1.unit50.lesson01.teach.reservation: {title: "reservation", gloss: "رزرو", note: "*reservation* یعنی از قبل هماهنگ کردن برای داشتن یه اتاق. *for two nights* یعنی برای دو شب -- دقت کنین فارسی برای مدت زمان هیچ حرف اضافه‌ای نمی‌ذاره، ولی انگلیسی از *for* استفاده می‌کنه.", example_gloss: "ما برای دو شب رزرو داریم."}
  en.a1.unit50.lesson01.teach.wifi: {title: "wifi", gloss: "وای‌فای", note: "*wifi* یعنی اینترنت بی‌سیم.", example_gloss: "اتاق وای‌فای داره؟"}
  en.a1.unit50.lesson01.teach.breakfast: {title: "breakfast", gloss: "صبحونه", note: "*breakfast* یعنی وعدهٔ غذایی صبح.", example_gloss: "صبحونه شامل قیمته؟"}
  en.a1.unit50.lesson01.teach.check_out: {title: "check-out", gloss: "تسویه حساب و ترک هتل", note: "*check-out* یعنی زمانی که باید اتاق رو ترک کنین و حساب کنین.", example_gloss: "تسویه حساب ساعت یازده‌ست."}

  en.a1.unit50.lesson02.teach.do_you_have_a_reservation: {title: "Do you have a reservation?", gloss: "رزرو دارین؟"}
  en.a1.unit50.lesson02.teach.i_have_a_reservation_for_two_nights: {title: "I have a reservation for two nights.", gloss: "برای دو شب رزرو دارم."}
  en.a1.unit50.lesson02.teach.does_the_room_have_wifi: {title: "Does the room have wifi?", gloss: "اتاق وای‌فای داره؟"}
  en.a1.unit50.lesson02.teach.what_time_is_check_out: {title: "What time is check-out?", gloss: "تسویه حساب ساعت چنده؟"}
  en.a1.unit50.lesson02.teach.breakfast_is_included: {title: "Breakfast is included.", gloss: "صبحونه شامل قیمته."}
  en.a1.unit50.lesson02.teach.heres_your_key: {title: "Here's your key.", gloss: "بفرمایید کلیدتون.", note: "*Here's* مخفف *Here is*ه."}

  en.a1.unit50.lesson03.teach.dialogue_line1: {title: "معرفی میا", gloss: "میا می‌گه سلام، ما برای دو شب رزرو داریم."}
  en.a1.unit50.lesson03.teach.dialogue_line2: {title: "خوش‌آمدگویی پذیرش", gloss: "پذیرش خوش‌آمد می‌گه و می‌پرسه رزرو به چه اسمیه.", note: "*What's the name...?* یعنی به چه اسمیه؟ -- انگلیسی اینجا *is* رو مستقیم به کلمهٔ سؤالی می‌چسبونه (*What's* = *What is*)، ولی فارسی یه فعل کامل و جدا داره (اسم روی رزرو چیه؟)."}
  en.a1.unit50.lesson03.teach.dialogue_line3: {title: "جواب لیلا", gloss: "لیلا می‌گه به اسم خودشه، لیلا."}
  en.a1.unit50.lesson03.teach.dialogue_line4: {title: "تحویل کلید", gloss: "پذیرش می‌گه عالیه، کلیدتون رو می‌ده و می‌گه اتاقتون دو تا تخت داره."}
  en.a1.unit50.lesson03.teach.dialogue_line5: {title: "سؤال میا دربارهٔ وای‌فای", gloss: "میا می‌پرسه اتاق وای‌فای داره؟"}
  en.a1.unit50.lesson03.teach.dialogue_line6: {title: "توضیح پذیرش دربارهٔ صبحونه", gloss: "پذیرش می‌گه بله، و صبحونه طبقهٔ پایینه، از ساعت هفت تا ده."}
  en.a1.unit50.lesson03.teach.dialogue_line7: {title: "سؤال لیلا دربارهٔ تسویه حساب", gloss: "لیلا تشکر می‌کنه و می‌پرسه تسویه حساب ساعت چنده."}
  en.a1.unit50.lesson03.teach.dialogue_line8: {title: "جواب پذیرش دربارهٔ تسویه حساب", gloss: "پذیرش می‌گه تسویه حساب ساعت یازده‌ست."}

  en.a1.unit50.lesson04.teach.reading_passage: {title: "متن: یه آخر هفته تو مهمان‌خونه", gloss: "یه آخر هفته تو مهمان‌خونه: میا و لیلا یه سفر کوتاه به کوه‌ها رفتن برای آخر هفته. میا عاشق عکس گرفتنه، و لیلا عاشق نقاشیه، برای همین اونجا بهترین جا برای استراحت بود. وقتی رسیدن به مهمان‌خونه، به پذیرش گفتن که برای دو شب رزرو دارن، از ۱۴ تا ۱۶ نوامبر. پذیرش اسم روی رزرو رو پرسید، و لیلا گفت به اسم خودشه. اتاقشون دو تا تخت و وای‌فای داشت، و صبحونه هر روز صبح از ساعت هفت تا ده شامل قیمت بود. تسویه حساب ساعت یازده بود. میا از کوه‌ها عکس‌های زیادی گرفت، و لیلا یه نقاشی کوچیک از منظرهٔ بیرون پنجره‌شون کشید. دنیل اون آخر هفته خونه موند و برای خودش شام درست کرد، با یه دستورپخت از کتاب آشپزی‌ای که از کتابخونه امانت گرفته بود. وقتی میا و لیلا برگشتن، عکس‌هاشون و نقاشی رو بهش نشون دادن، و اون عاشقشون شد."}

exercises:
  en.a1.unit50.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "wifi"
    distractors: ["hotel", "room", "reservation", "breakfast"]
    accepted_answers: [{value: "wifi", status: "correct"}]
    feedback: "*wifi* یعنی اینترنت بی‌سیم."
  en.a1.unit50.lesson01.exercise02.choose_reservation_meaning:
    instruction: "کدوم کلمه یعنی از قبل برای داشتن یه اتاق هماهنگ کردن؟"
    correct_option: "reservation"
    distractors: ["hotel", "room", "check-out"]
    accepted_answers: [{value: "reservation", status: "correct"}]
    feedback: "*reservation* یعنی رزرو."
  en.a1.unit50.lesson01.exercise03.match_accommodation_words:
    instruction: "هر واژه یا عبارت انگلیسی رو به توضیح فارسی درستش وصل کنین."
    pairs:
      - {left: "hotel", right: "جایی که مسافرها برای یک یا چند شب خوابیدن پول می‌دن"}
      - {left: "room", right: "فضایی با تخت که مهمون توش می‌خوابه"}
      - {left: "reservation", right: "هماهنگی از قبل برای داشتن اتاق"}
      - {left: "wifi", right: "اتصال بی‌سیم به اینترنت"}
      - {left: "breakfast", right: "غذای صبح"}
      - {left: "check-out", right: "زمانی که باید اتاق رو تحویل بدین و حساب کنین"}
    accepted_answers:
      - value:
          - {left: "hotel", right: "جایی که مسافرها برای یک یا چند شب خوابیدن پول می‌دن"}
          - {left: "room", right: "فضایی با تخت که مهمون توش می‌خوابه"}
          - {left: "reservation", right: "هماهنگی از قبل برای داشتن اتاق"}
          - {left: "wifi", right: "اتصال بی‌سیم به اینترنت"}
          - {left: "breakfast", right: "غذای صبح"}
          - {left: "check-out", right: "زمانی که باید اتاق رو تحویل بدین و حساب کنین"}
        status: "correct"
    feedback: "hotel=هتل، room=اتاق، reservation=رزرو، wifi=وای‌فای، breakfast=صبحونه، check-out=تسویه حساب."
  en.a1.unit50.lesson01.exercise04.order_reservation_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["We", "have", "a", "reservation", "for", "two", "nights."], status: "correct"}]
    feedback: "ترتیب درست: *We have a reservation for two nights.*"
  en.a1.unit50.lesson01.exercise05.write_check_out:
    instruction: "کلمه‌ای رو بنویسین که یعنی زمانی که باید اتاقتون رو ترک کنین."
    accepted_answers: [{value: "check-out", status: "correct"}]
    feedback: "*check-out* یعنی تسویه حساب و ترک اتاق."

  en.a1.unit50.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "Does the room have wifi?"
    distractors: ["Do you have a reservation?", "What time is check-out?", "Breakfast is included."]
    accepted_answers: [{value: "Does the room have wifi?", status: "correct"}]
    feedback: "*Does the room have wifi?* یعنی اتاق وای‌فای داره؟"
  en.a1.unit50.lesson02.exercise02.choose_reservation_question_meaning:
    instruction: "کدوم عبارت رو پذیرش می‌گه تا ببینه شما از قبل رزرو کردین یا نه؟"
    correct_option: "Do you have a reservation?"
    distractors: ["Does the room have wifi?", "What time is check-out?", "Here's your key."]
    accepted_answers: [{value: "Do you have a reservation?", status: "correct"}]
    feedback: "*Do you have a reservation?* یعنی رزرو دارین؟"
  en.a1.unit50.lesson02.exercise03.choose_checkout_time_meaning:
    instruction: "کدوم عبارت می‌پرسه چه ساعتی باید اتاق رو ترک کنین؟"
    correct_option: "What time is check-out?"
    distractors: ["Do you have a reservation?", "Breakfast is included.", "Here's your key."]
    accepted_answers: [{value: "What time is check-out?", status: "correct"}]
    feedback: "*What time is check-out?* یعنی تسویه حساب ساعت چنده؟"
  en.a1.unit50.lesson02.exercise04.order_key_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["Here's", "your", "key."], status: "correct"}]
    feedback: "ترتیب درست: *Here's your key.*"
  en.a1.unit50.lesson02.exercise05.translate_breakfast_included:
    instruction: "ترجمه کنین: «صبحونه شامل قیمته.»"
    accepted_answers: [{value: "Breakfast is included.", status: "correct"}]
    feedback: "*Breakfast is included.* یعنی صبحونه شامل قیمته."

  en.a1.unit50.lesson03.exercise01.comprehension_nights_stayed:
    instruction: "طبق گفتگو، میا و لیلا چند شب می‌مونن؟"
    correct_option: "two nights"
    distractors: ["one night", "three nights", "a week"]
    accepted_answers: [{value: "two nights", status: "correct"}]
    feedback: "میا می‌گه برای دو شب رزرو دارن."
  en.a1.unit50.lesson03.exercise02.comprehension_room_features:
    instruction: "طبق گفتگو، پذیرش می‌گه اتاق چی داره؟"
    correct_option: "two beds"
    distractors: ["a balcony", "a kitchen", "one bed"]
    accepted_answers: [{value: "two beds", status: "correct"}]
    feedback: "پذیرش می‌گه اتاق دو تا تخت داره."
  en.a1.unit50.lesson03.exercise03.listen_dialogue_checkout_time:
    instruction: "طبق گفتگو، تسویه حساب ساعت چنده؟"
    correct_option: "eleven o'clock"
    distractors: ["nine o'clock", "eight o'clock", "noon"]
    accepted_answers: [{value: "eleven o'clock", status: "correct"}]
    feedback: "پذیرش می‌گه تسویه حساب ساعت یازده‌ست."
  en.a1.unit50.lesson03.exercise04.respond_own_checkin_statement:
    instruction: "بگین تسویه حساب چه ساعتیه، یا بگین اتاق چی داره."
    accepted_answers: ["Check-out is at eleven o'clock", "Check-out is at eleven o'clock.", "The room has two beds", "The room has two beds.", "Does the room have wifi", "Does the room have wifi?", "Breakfast is downstairs from seven to ten", "Breakfast is downstairs from seven to ten."]
    feedback: "می‌تونین بگین *Check-out is at eleven o'clock* یا *The room has two beds*."

  en.a1.unit50.lesson04.exercise01.reading_nights_stayed:
    instruction: "طبق متن، میا و لیلا چند شب تو مهمان‌خونه موندن؟"
    correct_option: "two nights"
    distractors: ["one night", "three nights", "a week"]
    accepted_answers: [{value: "two nights", status: "correct"}]
    feedback: "متن می‌گه اونا برای دو شب رزرو داشتن."
  en.a1.unit50.lesson04.exercise02.reading_checkout_time:
    instruction: "طبق متن، تسویه حساب ساعت چند بود؟"
    correct_option: "eleven o'clock"
    distractors: ["nine o'clock", "eight o'clock", "noon"]
    accepted_answers: [{value: "eleven o'clock", status: "correct"}]
    feedback: "متن می‌گه تسویه حساب ساعت یازده بود."
  en.a1.unit50.lesson04.exercise03.reading_who_painted:
    instruction: "طبق متن، کی از منظره یه نقاشی کشید؟"
    correct_option: "Leila"
    distractors: ["Mia", "Daniel", "the receptionist"]
    accepted_answers: [{value: "Leila", status: "correct"}]
    feedback: "متن می‌گه لیلا از منظره یه نقاشی کوچیک کشید."
  en.a1.unit50.lesson04.exercise04.write_own_checkin_message:
    instruction: "یه پیام کوتاه بنویسین: بگین چند شب موندن، و بگین تسویه حساب ساعت چند بود."
    accepted_answers: ["They stayed two nights. Check-out was at eleven o'clock.", "They stayed two nights, and check-out was at eleven o'clock.", "They stayed two nights, check-out was at eleven o'clock."]
    feedback: "می‌تونین بگین *They stayed two nights, and check-out was at eleven o'clock.*"
