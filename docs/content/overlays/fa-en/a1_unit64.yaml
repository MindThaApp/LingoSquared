  en.a1.unit64.lesson03.teach.dialogue_line2: {title: "تشکر لیلا", gloss: "لیلا می‌گه: ممنون، میا.", note: "لیلا به تعریف میا جواب کوتاه و مؤدبانه می‌ده."}
  en.a1.unit64.lesson03.teach.dialogue_line3: {title: "تعریف از ژاکت", gloss: "میا می‌گه: من از ژاکت سبزت خوشم میاد.", note: "میا با *I like your ...* از لباس لیلا تعریف می‌کنه."}
  en.a1.unit64.lesson03.teach.dialogue_line4: {title: "پاسخ لیلا", gloss: "لیلا می‌گه: خیلی لطف داری.", note: "*That is very kind* پاسخ طبیعی به تعریفه."}
  en.a1.unit64.lesson03.teach.dialogue_line5: {title: "تعریف دوم", gloss: "میا می‌گه: چه لبخند قشنگی هم داری. ببین، این عکس منه.", note: "*too* یعنی هم؛ میا یه تعریف دیگه اضافه می‌کنه."}
  en.a1.unit64.lesson03.teach.dialogue_line6: {title: "تعریف لیلا", gloss: "لیلا می‌گه: خیلی ممنونم. عکست قشنگه.", note: "لیلا هم تشکر می‌کنه و هم از عکس میا تعریف می‌کنه."}
  en.a1.unit64.lesson03.teach.dialogue_line7: {title: "پاسخ میا", gloss: "میا می‌گه: ممنون. این برای دنیله.", note: "میا دربارهٔ عکس توضیح کوتاهی می‌ده."}

  en.a1.unit64.lesson04.teach.message: {title: "متن: پیام مهربانانه", gloss: "پیام مهربانانه: ژاکت سبزت خیلی قشنگه. عکست قشنگه. ممنون که مهربونی.", note: "این پیام چند تعریف کوتاه و یک تشکر رو کنار هم میاره."}
  en.a1.unit64.lesson04.teach.reading_passage: {title: "متن: تعریفی برای یک دوست", gloss: "تعریفی برای یک دوست: میا لیلا رو با یک ژاکت سبز دید. میا گفت لیلا عالی به نظر میاد. او همچنین گفت لیلا لبخند قشنگی داره. لیلا از میا تشکر کرد. بعد لیلا به عکس میا نگاه کرد و گفت قشنگه. میا خوشحال بود چون عکس برای دنیل بود. بعداً، لیلا یک پیام کوتاه نوشت: ژاکت سبزت خیلی قشنگه.", note: "این متن نشان می‌ده میا و لیلا چطور از هم تعریف می‌کنن."}

