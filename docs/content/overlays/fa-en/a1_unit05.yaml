  en.a1.unit05.lesson01.teach.half_past: {title: "نیم بعد از سه", gloss: "ساعت سه و نیم است", note: "half past three یعنی سه و نیم؛ انگلیسی می‌گه «نیم گذشته از سه»، در حالی که فارسی می‌گه «سه و نیم»."}
