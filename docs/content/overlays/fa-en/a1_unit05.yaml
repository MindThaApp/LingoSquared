  en.a1.unit05.lesson04.teach.closes_at: {title: "بسته شدن در ساعت", gloss: "در ساعت ... بسته می‌شه", note: "closes at پیش از عدد ساعت میاد.", example_gloss: "کتابخانه ساعت شش بسته می‌شه."}
  en.a1.unit05.lesson04.teach.q_open: {title: "پرسیدن زمان باز شدن", gloss: "دنیل می‌پرسه کتابخانه چه ساعتی باز می‌شه", note: "What time does the library open? ساختار پرسشی با does برای فعل‌های عادت/برنامه است."}
