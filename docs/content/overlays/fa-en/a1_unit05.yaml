  en.a1.unit05.lesson04.teach.q_close: {title: "پرسیدن زمان بسته شدن", gloss: "دنیل می‌پرسه چه ساعتی بسته می‌شه", note: "And what time does it close? ادامهٔ طبیعی پرسش قبلی است."}
