course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح میانی (B1) برای فارسی‌زبان‌ها، با تمرکز بر بیان ضرورت، توانایی، شرط، بحث و کار، همراه با توضیحات دقیق فارسی."

units:
  en.b1.unit06.narrative: {title: "داستان پنچر شدن لاستیک"}

lessons:
  en.b1.unit06.lesson01.narrative_vocabulary: {title: "while، flat tire و stranger"}
  en.b1.unit06.lesson02.sequencing_with_while_and_when: {title: "در حالی که رانندگی می‌کردم، وقتی که ایستادم"}
  en.b1.unit06.lesson03.reading_the_flat_tire_story: {title: "متن: داستان پنچر شدن لاستیک"}
  en.b1.unit06.lesson04.telling_daniel_the_story: {title: "دیر کردی! چی شد؟"}

teaching:
  en.b1.unit06.lesson01.teach.while: {title: "while", gloss: "در حالی که، همون موقع که", note: "while یعنی هم‌زمان با یه اتفاق دیگه.", example_gloss: "در حالی که رانندگی می‌کردم، بارون شروع شد."}
  en.b1.unit06.lesson01.teach.flat_tire: {title: "flat tire", gloss: "لاستیک پنچر", note: "flat tire یعنی لاستیکی که هوا نداره و از کار افتاده.", example_gloss: "لاستیکم توی بزرگراه پنچر شد."}
  en.b1.unit06.lesson01.teach.pull_over: {title: "pull over", gloss: "کنار زدن (ماشین)", note: "pull over یعنی ماشین رو کنار جاده متوقف کردن.", example_gloss: "مجبور شدم فوراً کنار بزنم."}
  en.b1.unit06.lesson01.teach.stranger: {title: "stranger", gloss: "غریبه", note: "stranger یعنی کسی که نمی‌شناسینش.", example_gloss: "یه غریبه ایستاد تا کمکم کنه."}
  en.b1.unit06.lesson01.teach.mechanic: {title: "mechanic", gloss: "مکانیک", note: "mechanic یعنی کسی که ماشین رو تعمیر می‌کنه.", example_gloss: "مکانیک لاستیکم رو سریع درست کرد."}
  en.b1.unit06.lesson01.teach.said_that: {title: "said that", gloss: "گفت که (نقل قول غیرمستقیم)", note: "said that برای نقل قول غیرمستقیم حرف کسی استفاده می‌شه.", example_gloss: "گفت که می‌تونه کمک کنه."}

  en.b1.unit06.lesson02.teach.while_driving_tire_went_flat: {title: "While I was driving to work, my tire went flat.", gloss: "در حالی که داشتم به سر کار می‌رفتم، لاستیکم پنچر شد.", note: "while + گذشتهٔ استمراری (was driving) برای بیان یه کار در حال انجام که یه اتفاق دیگه وسطش پیش اومد."}
  en.b1.unit06.lesson02.teach.when_pulled_over_stranger_helped: {title: "When I pulled over, a stranger stopped to help.", gloss: "وقتی کنار زدم، یه غریبه ایستاد تا کمک کنه.", note: "when + گذشتهٔ ساده (pulled over) برای معرفی رویداد بعدی توی داستان."}
  en.b1.unit06.lesson02.teach.grammar_while_when_sequencing: {title: "ترتیب رویدادها با while و when", gloss: "در حالی که رانندگی می‌کردم، لاستیکم پنچر شد. وقتی کنار زدم، یه غریبه کمکم کرد.", note: "*while* + گذشتهٔ استمراری پس‌زمینهٔ داستان رو نشون می‌ده؛ *when* + گذشتهٔ ساده رویداد اصلی بعدی رو معرفی می‌کنه."}

  en.b1.unit06.lesson03.teach.had_already_called: {title: "had already called", gloss: "قبلاً تماس گرفته بودم", note: "had already + قسمت سوم فعل (called) یعنی کاری که قبل از یه رویداد دیگهٔ گذشته انجام شده بود.", example_gloss: "تا وقتی که اون رسید، من قبلاً به دنیل زنگ زده بودم."}
  en.b1.unit06.lesson03.teach.kept_his_word: {title: "kept his word", gloss: "به قولش عمل کرد", note: "kept his word یعنی کاری رو که قول داده بود واقعاً انجام داد.", example_gloss: "به قولش عمل کرد و توی ده دقیقه درستش کرد."}
  en.b1.unit06.lesson03.teach.reading_passage: {title: "متن: داستان پنچر شدن لاستیک", gloss: "دیروز صبح، در حالی که لیلا داشت به سر کار می‌رفت، لاستیکش ناگهان پنچر شد. کنار یه خیابون آروم زد. یه غریبه ماشینش رو نگه داشت و پیشنهاد کمک داد. تا وقتی که مکانیک رسید، لیلا قبلاً به دنیل زنگ زده بود تا بگه دیر می‌رسه. مکانیک گفت که می‌تونه لاستیک رو توی ده دقیقه درست کنه. به قولش عمل کرد، و لیلا فقط بیست دقیقه دیر به سر کار رسید.", note: "این متن سه ساختار رو با هم نشون می‌ده: while (پس‌زمینه)، had already (کاری قبل از یه رویداد گذشتهٔ دیگه)، و نقل قول غیرمستقیم (said that)."}

  en.b1.unit06.lesson04.teach.q_youre_late_what_happened: {title: "پرسش دنیل", gloss: "دنیل می‌گه دیر کردی! چی شد؟", note: "این یه سؤال طبیعی برای شروع پرسیدن دربارهٔ یه اتفاقه."}
  en.b1.unit06.lesson04.teach.a_tire_went_flat_suddenly: {title: "جواب لیلا", gloss: "لیلا می‌گه در حالی که داشتم به سر کار می‌رفتم، لاستیکم ناگهان پنچر شد.", note: "while + گذشتهٔ استمراری پس‌زمینهٔ داستان رو معرفی می‌کنه."}
  en.b1.unit06.lesson04.teach.q_oh_no_what_did_you_do: {title: "واکنش دنیل", gloss: "دنیل می‌گه وای نه! چیکار کردی؟", note: "این سؤال ادامهٔ داستان رو می‌خواد."}
  en.b1.unit06.lesson04.teach.a_pulled_over_stranger_helped: {title: "جواب لیلا", gloss: "لیلا می‌گه کنار زدم، و یه غریبه ایستاد تا کمکم کنه.", note: "این جمله رویداد اصلی بعدی داستان رو با and معرفی می‌کنه."}
  en.b1.unit06.lesson04.teach.q_kind_of_him_call_mechanic: {title: "واکنش دنیل", gloss: "دنیل می‌گه چه لطفی کرد. به مکانیک زنگ زدی؟", note: "That was kind of him یه راه معمول برای تحسین کار خوب یه غریبه‌ست."}
  en.b1.unit06.lesson04.teach.a_had_already_called_mechanic_said: {title: "جواب پایانی لیلا", gloss: "لیلا می‌گه آره، قبل از این که اون برسه قبلاً بهش زنگ زده بودم. مکانیک گفت که می‌تونه توی ده دقیقه درستش کنه، و همین‌کارم کرد!", note: "این جمله had already (کاری قبل از رسیدن مکانیک) رو با نقل قول غیرمستقیم (said that) ترکیب می‌کنه."}

exercises:
  en.b1.unit06.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شده را انتخاب کنین."
    correct_option: "stranger"
    distractors: ["mechanic", "flat tire", "pull over"]
    accepted_answers: [{value: "stranger", status: "correct"}]
    feedback: "stranger یعنی غریبه."
  en.b1.unit06.lesson01.exercise02.choose_stop_car_phrase:
    instruction: "کدام عبارت به معنای متوقف کردن ماشین کنار جاده‌ست؟"
    correct_option: "pull over"
    distractors: ["flat tire", "stranger", "said that"]
    accepted_answers: [{value: "pull over", status: "correct"}]
    feedback: "pull over یعنی کنار زدن ماشین."
  en.b1.unit06.lesson01.exercise03.choose_someone_you_dont_know_word:
    instruction: "کدام کلمه به معنای کسیه که نمی‌شناسینش؟"
    correct_option: "stranger"
    distractors: ["mechanic", "pull over", "while"]
    accepted_answers: [{value: "stranger", status: "correct"}]
    feedback: "stranger یعنی غریبه."
  en.b1.unit06.lesson01.exercise04.match_narrative_words:
    instruction: "هر معنی را به کلمه یا عبارت انگلیسی درست وصل کنید."
    accepted_answers:
      - value:
          - {left: "while", right: "at the same time as something else happens"}
          - {left: "flat tire", right: "a tire with no air, that stopped working"}
          - {left: "pull over", right: "to stop your car by the side of the road"}
          - {left: "stranger", right: "someone you don't know"}
          - {left: "mechanic", right: "person for a flat tire"}
          - {left: "said that", right: "reporting what someone else said"}
        status: "correct"
    feedback: "while=در حالی که، flat tire=لاستیک پنچر، pull over=کنار زدن، stranger=غریبه، mechanic=مکانیک، said that=گفت که."
  en.b1.unit06.lesson01.exercise05.write_mechanic:
    instruction: "کلمه‌ای که به معنای کسیه که ماشین رو تعمیر می‌کنه را بنویسین."
    accepted_answers:
      - {value: "mechanic", status: "correct"}
      - {value: "Mechanic", status: "correct"}
