  en.b1.unit06.lesson02.exercise01.choose_background_action:
    instruction: "کدام جمله از while برای نشون دادن یه کار در حال انجام که یه اتفاق دیگه وسطش پیش اومد استفاده می‌کنه؟"
    correct_option: "While I was driving to work, my tire went flat."
    distractors: ["When I pulled over, a stranger stopped to help.", "The mechanic said that he could fix it.", "He kept his word."]
    accepted_answers: [{value: "While I was driving to work, my tire went flat.", status: "correct"}]
    feedback: "While I was driving...my tire went flat یعنی پس‌زمینهٔ داستان (رانندگی) و رویداد اصلی (پنچر شدن) رو نشون می‌ده."
  en.b1.unit06.lesson02.exercise02.choose_when_sentence:
    instruction: "کدام جمله از when برای معرفی رویداد بعدی داستان استفاده می‌کنه؟"
