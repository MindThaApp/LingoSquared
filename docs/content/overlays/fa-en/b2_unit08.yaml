    instruction: "کدام کلمه یعنی اطلاعات بیش از یک منبع را با هم ترکیب کنین؟"
    correct_option: "synthesize"
    distractors: ["evaluate", "conflict", "judgment"]
    accepted_answers: [{value: "synthesize", status: "correct"}]
    feedback: "synthesize یعنی ترکیب کردن اطلاعات منابع."
  en.b2.unit08.lesson01.exercise02_choose_conflict:
    instruction: "کدام کلمه یعنی منابع با هم اختلاف دارن؟"
    correct_option: "conflict"
    distractors: ["agreement", "source", "support"]
    accepted_answers: [{value: "conflict", status: "correct"}]
    feedback: "conflict یعنی اختلاف یا ناسازگاری بین منابع."
  en.b2.unit08.lesson01.exercise03_match_synthesis_terms:
    instruction: "هر واژهٔ synthesis را به معنی درستش وصل کنین."
    accepted_answers: [{value: [{left: "provides information", right: "source"}, {left: "combine information from sources", right: "synthesize"}, {left: "judge how strong something is", right: "evaluate"}, {left: "sources say the same thing", right: "agreement"}, {left: "sources disagree", right: "conflict"}, {left: "reasoned decision about support", right: "judgment"}], status: "correct"}]
    feedback: "در synthesis باید رابطهٔ منابع را نام ببرین: agreement، conflict و judgment."
  en.b2.unit08.lesson01.exercise04_write_evaluate:
    instruction: "کلمه‌ای را بنویسین که یعنی قضاوت کنین چیزی چقدر قوی است."
    accepted_answers:
      - {value: "evaluate", status: "correct"}
      - {value: "Evaluate", status: "correct"}
