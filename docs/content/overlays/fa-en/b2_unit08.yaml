course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح پیشرفته‌تر (B2) برای فارسی‌زبان‌ها، با تمرکز روی روایت زمان، لحن، ایده‌های انتزاعی، مذاکره و ترکیب منابع."

units:
  en.b2.unit08.synthesis: {title: "منابع کجا هم‌نظرن و کجا اختلاف دارن"}

lessons:
  en.b2.unit08.lesson01_source_relationships: {title: "هم‌نظری، اختلاف و پشتوانه"}
  en.b2.unit08.lesson02_linking_sources: {title: "Both sources agree, but..."}
  en.b2.unit08.lesson03.reading_two_sources: {title: "متن: نظرسنجی و گزارش اپراتور"}
  en.b2.unit08.lesson04.the_synthesis_dialogue: {title: "کدوم روایت پشتوانهٔ بهتری داره؟"}

teaching:
  en.b2.unit08.lesson01.teach.source: {title: "source", gloss: "منبع", note: "source اطلاعات می‌ده. در synthesis باید رابطهٔ چند منبع رو توضیح بدین، نه فقط هرکدوم رو جدا خلاصه کنین.", example_gloss: "یک source اطلاعات فراهم می‌کنه."}
  en.b2.unit08.lesson01.teach.synthesize: {title: "synthesize", gloss: "ترکیب کردن اطلاعات منابع", note: "synthesize یعنی اطلاعات چند منبع رو کنار هم بگذارین و رابطه‌شان رو نشون بدین.", example_gloss: "synthesize یعنی اطلاعات منابع رو ترکیب کردن."}
  en.b2.unit08.lesson01.teach.evaluate: {title: "evaluate", gloss: "ارزیابی کردن", note: "evaluate یعنی قضاوت کنین یک منبع یا ادعا چقدر قویه.", example_gloss: "evaluate یعنی قضاوت کردن که چیزی چقدر قویه."}
  en.b2.unit08.lesson01.teach.agreement: {title: "agreement", gloss: "هم‌نظری، توافق", note: "agreement یعنی منابع یک چیز رو می‌گن. در انگلیسی می‌گیم Both sources agree that...", example_gloss: "agreement یعنی منابع یک حرف می‌زنن."}
  en.b2.unit08.lesson01.teach.conflict: {title: "conflict", gloss: "اختلاف، ناسازگاری", note: "conflict یعنی منابع دربارهٔ یک نکته اختلاف دارن. فارسی «اما به گفتهٔ...» زیاد استفاده می‌شه، اما انگلیسی بهتره رابطه رو دقیق نام ببره: conflict about the cause.", example_gloss: "conflict یعنی منابع با هم مخالفن."}
  en.b2.unit08.lesson01.teach.judgement: {title: "judgment", gloss: "قضاوت مستدل", note: "judgment یعنی تصمیم توضیح‌دار دربارهٔ اینکه کدوم منبع پشتوانهٔ بهتری داره.", example_gloss: "یک judgment توضیح می‌ده کدوم منبع قوی‌تره."}

  en.b2.unit08.lesson02.teach_agree_conflict: {title: "Both sources agree that demand increased, but they disagree about the cause.", gloss: "هر دو منبع قبول دارن که تقاضا بیشتر شده، اما دربارهٔ علت اختلاف دارن.", note: "Both sources agree that... بهتره تا اینکه «به گفتهٔ منبع اول/دوم» رو تکرار کنین؛ رابطهٔ منابع رو مستقیم نشون می‌ده."}
  en.b2.unit08.lesson02.teach_by_contrast: {title: "By contrast, the operator report includes staffing records.", gloss: "در مقابل، گزارش اپراتور سوابق کارکنان رو هم آورده.", note: "By contrast برای تضاد روشن بین دو منبع به کار می‌ره. اون رو مثل «به گفتهٔ» برای هر جمله استفاده نکنین."}
  en.b2.unit08.lesson02.teach_better_supported: {title: "The operator report is better supported on the cause.", gloss: "گزارش اپراتور دربارهٔ علت پشتوانهٔ بهتری داره.", note: "better supported یعنی شواهد قوی‌تری پشتش هست، نه اینکه حتماً از هر نظر بهتر باشد."}
  en.b2.unit08.lesson02.teach_grammar_synthesis: {title: "ساختن synthesis", gloss: "یک synthesis باید بگه منابع کجا هم‌نظرن، کجا اختلاف دارن، و کدوم روایت پشتوانهٔ بهتری داره.", note: "برای فارسی‌زبان‌ها دام رایج اینه که با «به گفتهٔ» چند خلاصهٔ جدا بسازن؛ در انگلیسی این درس لینک‌هایی مثل Both sources agree، by contrast، although و better supported مهمن."}

  en.b2.unit08.lesson03.teach_survey: {title: "survey", gloss: "نظرسنجی", note: "survey می‌تونه نظر یا تجربهٔ افراد زیادی رو جمع کنه، اما همیشه علت رو ثابت نمی‌کنه.", example_gloss: "یک survey می‌تونه نظرهای زیادی جمع کنه."}
  en.b2.unit08.lesson03.teach_account: {title: "account", gloss: "روایت، گزارش از اتفاق", note: "account یعنی توضیحی از اینکه چه اتفاقی افتاده یا چرا افتاده.", example_gloss: "یک account توضیح می‌ده چه اتفاقی افتاده."}
  en.b2.unit08.lesson03.teach.source_a: {title: "Source A", gloss: "منبع A: نظرسنجی مسافران می‌گه بعد از افتتاح بیمارستان جدید، دیر رسیدن اتوبوس‌ها رایج‌تر شده. خیلی از مسافرها می‌گن مسیر حالا شلوغ شده، مخصوصاً صبح‌ها. نظرسنجی استدلال می‌کنه علت اصلی تقاضای بیشتره.", note: "این منبع تجربهٔ مسافرها رو خوب نشون می‌ده، اما برای علت اصلی فقط نظر/کامنت داره."}
  en.b2.unit08.lesson03.teach.source_b: {title: "Source B", gloss: "منبع B: گزارش اپراتور هم قبول داره که بعد از افتتاح بیمارستان تقاضا بیشتر شده، اما کمبود راننده رو علت اصلی دیر رسیدن سرویس‌ها معرفی می‌کنه. گزارش سوابق کارکنان همون دوره رو هم آورده.", note: "این منبع هم‌نظری دربارهٔ افزایش تقاضا داره، اما دربارهٔ علت با منبع A اختلاف داره."}

  en.b2.unit08.lesson04.teach.q_survey: {title: "Tessa", gloss: "دو روایت دربارهٔ دیر رسیدن اتوبوس‌ها خوندم. نظرسنجی مسافران می‌گه بعد از افتتاح بیمارستان جدید، تقاضا بیشتر شده.", note: "two accounts یعنی دو روایت/گزارش، نه دو حساب بانکی."}
  en.b2.unit08.lesson04.teach.a_operator: {title: "Rowan", gloss: "گزارش اپراتور قبول داره که تقاضا بیشتر شده، اما می‌گه مشکل اصلی کمبود راننده بوده.", note: "agrees that... but it says... هم‌نظری و اختلاف رو در یک جمله می‌سازه."}
  en.b2.unit08.lesson04.teach.q_agree_conflict: {title: "Tessa", gloss: "پس منابع دربارهٔ تقاضای بیشتر هم‌نظرن، اما دربارهٔ علت اختلاف دارن.", note: "agree on و conflict about لینک‌های دقیق synthesis هستن."}
  en.b2.unit08.lesson04.teach.a_better_supported: {title: "Rowan", gloss: "کدوم روایت پشتوانهٔ بهتری داره؟", note: "better supported یعنی شواهدش قوی‌تره."}
  en.b2.unit08.lesson04.teach.q_evidence_compare: {title: "Tessa", gloss: "نظرسنجی کامنت‌های زیادی از مسافرها داره، اما گزارش اپراتور سوابق کارکنان رو هم آورده.", note: "but اینجا مقایسهٔ نوع شواهد رو می‌سازد."}
  en.b2.unit08.lesson04.teach.a_judgement_question: {title: "Rowan", gloss: "پس قضاوتت چیه؟", note: "judgment باید بعد از مقایسهٔ شواهد بیاد."}
  en.b2.unit08.lesson04.teach.q_final_judgement: {title: "Tessa", gloss: "گزارش اپراتور دربارهٔ علت پشتوانهٔ بهتری داره، هرچند نظرسنجی برای نشون دادن تجربهٔ مسافرها مفیده.", note: "although اجازه می‌ده یک منبع رو قوی‌تر بدونین و هم‌زمان ارزش منبع دیگه رو هم حفظ کنین."}

