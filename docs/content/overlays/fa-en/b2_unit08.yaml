course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح پیشرفته‌تر (B2) برای فارسی‌زبان‌ها، با تمرکز روی روایت زمان، لحن، ایده‌های انتزاعی، مذاکره و ترکیب منابع."

units:
  en.b2.unit08.synthesis: {title: "منابع کجا هم‌نظرن و کجا اختلاف دارن"}

lessons:
  en.b2.unit08.lesson01_source_relationships: {title: "هم‌نظری، اختلاف و پشتوانه"}
  en.b2.unit08.lesson02_linking_sources: {title: "Both sources agree, but..."}
  en.b2.unit08.lesson03.reading_two_sources: {title: "متن: نظرسنجی و گزارش اپراتور"}
  en.b2.unit08.lesson04.the_synthesis_dialogue: {title: "کدام روایت پشتوانهٔ بهتری دارد؟"}

teaching:
  en.b2.unit08.lesson01.teach.source: {title: "source", gloss: "منبع", note: "source اطلاعات می‌ده. در synthesis باید رابطهٔ چند منبع را توضیح بدین، نه فقط هر کدام را جدا خلاصه کنین.", example_gloss: "یک source اطلاعات فراهم می‌کنه."}
  en.b2.unit08.lesson01.teach.synthesize: {title: "synthesize", gloss: "ترکیب کردن اطلاعات منابع", note: "synthesize یعنی اطلاعات چند منبع را کنار هم بگذارین و رابطه‌شان را نشان بدین.", example_gloss: "synthesize یعنی اطلاعات منابع را ترکیب کردن."}
  en.b2.unit08.lesson01.teach.evaluate: {title: "evaluate", gloss: "ارزیابی کردن", note: "evaluate یعنی قضاوت کنین یک منبع یا ادعا چقدر قوی است.", example_gloss: "evaluate یعنی قضاوت کردن که چیزی چقدر قوی است."}
  en.b2.unit08.lesson01.teach.agreement: {title: "agreement", gloss: "هم‌نظری، توافق", note: "agreement یعنی منابع یک چیز را می‌گن. در انگلیسی می‌گیم Both sources agree that...", example_gloss: "agreement یعنی منابع یک حرف می‌زنند."}
  en.b2.unit08.lesson01.teach.conflict: {title: "conflict", gloss: "اختلاف، ناسازگاری", note: "conflict یعنی منابع دربارهٔ یک نکته اختلاف دارن. فارسی «اما به گفتهٔ...» زیاد استفاده می‌شه، اما انگلیسی B2 بهتره رابطه را دقیق نام ببرد: conflict about the cause.", example_gloss: "conflict یعنی منابع با هم مخالف‌اند."}
  en.b2.unit08.lesson01.teach.judgement: {title: "judgment", gloss: "قضاوت مستدل", note: "judgment یعنی تصمیم توضیح‌دار دربارهٔ اینکه کدام منبع پشتوانهٔ بهتری دارد.", example_gloss: "یک judgment توضیح می‌ده کدام منبع قوی‌تر است."}

  en.b2.unit08.lesson02.teach_agree_conflict: {title: "Both sources agree that demand increased, but they disagree about the cause.", gloss: "هر دو منبع قبول دارن که تقاضا بیشتر شده، اما دربارهٔ علت اختلاف دارن.", note: "Both sources agree that... بهتر از تکرار «به گفتهٔ منبع اول/دوم» است؛ رابطهٔ منابع را مستقیم نشان می‌ده."}
  en.b2.unit08.lesson02.teach_by_contrast: {title: "By contrast, the operator report includes staffing records.", gloss: "در مقابل، گزارش اپراتور سوابق کارکنان را شامل می‌شه.", note: "By contrast برای تضاد روشن بین دو منبع است. آن را مثل «به گفتهٔ» برای هر جمله استفاده نکنین."}
  en.b2.unit08.lesson02.teach_better_supported: {title: "The operator report is better supported on the cause.", gloss: "گزارش اپراتور دربارهٔ علت پشتوانهٔ بهتری دارد.", note: "better supported یعنی شواهد قوی‌تری پشتش هست، نه اینکه حتماً از هر نظر بهتر باشد."}
  en.b2.unit08.lesson02.teach_grammar_synthesis: {title: "ساختن synthesis", gloss: "یک synthesis باید بگه منابع کجا هم‌نظرن، کجا اختلاف دارن، و کدام روایت پشتوانهٔ بهتری دارد.", note: "برای فارسی‌زبان‌ها دام رایج اینه که با «به گفتهٔ» چند خلاصهٔ جدا بسازن؛ در انگلیسی این درس لینک‌هایی مثل Both sources agree، by contrast، although و better supported مهم‌اند."}

  en.b2.unit08.lesson03.teach_survey: {title: "survey", gloss: "نظرسنجی", note: "survey می‌تونه نظر یا تجربهٔ افراد زیادی را جمع کنه، اما همیشه علت را ثابت نمی‌کنه.", example_gloss: "یک survey می‌تونه نظرهای زیادی جمع کنه."}
  en.b2.unit08.lesson03.teach_account: {title: "account", gloss: "روایت، گزارش از اتفاق", note: "account یعنی توضیحی از اینکه چه اتفاقی افتاده یا چرا افتاده.", example_gloss: "یک account توضیح می‌ده چه اتفاقی افتاده."}
  en.b2.unit08.lesson03.teach.source_a: {title: "Source A", gloss: "منبع A: نظرسنجی مسافران می‌گه بعد از افتتاح بیمارستان جدید، اتوبوس‌های دیرکرده رایج‌تر شدن. خیلی از مسافرها می‌گن مسیر حالا شلوغ شده، مخصوصاً صبح‌ها. نظرسنجی استدلال می‌کنه علت اصلی تقاضای بیشتره.", note: "این منبع تجربهٔ مسافرها را خوب نشان می‌ده، اما برای علت اصلی فقط نظر/کامنت دارد."}
  en.b2.unit08.lesson03.teach.source_b: {title: "Source B", gloss: "منبع B: گزارش اپراتور هم قبول داره که بعد از افتتاح بیمارستان تقاضا بیشتر شده، اما کمبود راننده را علت اصلی سرویس‌های دیرکرده معرفی می‌کنه. گزارش سوابق کارکنان همان دوره را شامل می‌شه.", note: "این منبع هم‌نظری دربارهٔ افزایش تقاضا دارد، اما دربارهٔ علت با منبع A اختلاف دارد."}

  en.b2.unit08.lesson04.teach.q_survey: {title: "Tessa", gloss: "دو روایت دربارهٔ سرویس اتوبوس دیرکرده خوندم. نظرسنجی مسافران می‌گه بعد از افتتاح بیمارستان جدید، تقاضا بیشتر شده.", note: "two accounts یعنی دو روایت/گزارش، نه دو حساب بانکی."}
  en.b2.unit08.lesson04.teach.a_operator: {title: "Rowan", gloss: "گزارش اپراتور قبول داره که تقاضا بیشتر شده، اما می‌گه مشکل اصلی کمبود راننده بوده.", note: "agrees that... but it says... هم‌نظری و اختلاف را در یک جمله می‌سازه."}
  en.b2.unit08.lesson04.teach.q_agree_conflict: {title: "Tessa", gloss: "پس منابع دربارهٔ تقاضای بیشتر هم‌نظرن، اما دربارهٔ علت اختلاف دارن.", note: "agree on و conflict about لینک‌های دقیق synthesis هستند."}
  en.b2.unit08.lesson04.teach.a_better_supported: {title: "Rowan", gloss: "کدام روایت پشتوانهٔ بهتری دارد؟", note: "better supported یعنی شواهدش قوی‌تر است."}
  en.b2.unit08.lesson04.teach.q_evidence_compare: {title: "Tessa", gloss: "نظرسنجی کامنت‌های زیادی از مسافرها دارد، اما گزارش اپراتور سوابق کارکنان را شامل می‌شود.", note: "but اینجا مقایسهٔ نوع شواهد را می‌سازد."}
  en.b2.unit08.lesson04.teach.a_judgement_question: {title: "Rowan", gloss: "پس قضاوتت چیه؟", note: "judgment باید بعد از مقایسهٔ شواهد بیاد."}
  en.b2.unit08.lesson04.teach.q_final_judgement: {title: "Tessa", gloss: "گزارش اپراتور دربارهٔ علت پشتوانهٔ بهتری دارد، هرچند نظرسنجی برای نشان دادن تجربهٔ مسافرها مفیده.", note: "although اجازه می‌ده یک منبع را قوی‌تر بدونین و هم‌زمان ارزش منبع دیگر را هم حفظ کنین."}

exercises:
