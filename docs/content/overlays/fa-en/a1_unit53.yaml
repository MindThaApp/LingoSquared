review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit53 (renting a bicycle). Authored fully at schema_version 1.1, every kind: vocabulary teaching card has a matching example_gloss:. Contrastive-grammar points for this unit: (1) the pronoun 'one' substituting for an already-mentioned noun -- 'I need a small one'/'And I need a medium one' both drop the noun bike and replace it with the placeholder one, a construction Farsi has no direct equivalent for (فارسی معمولاً یا اسم رو تکرار می‌کنه یا کاملاً حذفش می‌کنه: یه دوچرخهٔ کوچیک لازم دارم، بدون کلمهٔ جایگزین)؛ flagged on both dialogue lines that use it. (2) 'per hour' -- English marks a rate with the preposition per before the unit (ten dollars per hour), while Farsi expresses the same rate with a possessive-like construction with no direct preposition (ده دلار در ساعت، یا ساعتی ده دلار) -- flagged on the price phrase card. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, not translated Farsi lefts, per the established fa-en convention. Every listen_select/multiple_choice distractor in lesson03/lesson04 is an invented value never stated elsewhere in this unit (invented sizes, invented times, invented reasons) -- checked the dialogue's own lines (Rental Clerk: 3 lines; Mia: 'We'd like to rent two bikes...', 'And I need a medium one.', 'When do we need to return them?'; Leila: 'I need a small one.', 'Great, thank you!') to confirm no distractor reuses a fact the tested speaker states elsewhere in the same audio. Strong sibling-isolation rule applied -- nl-en/prs-en overlays and the concurrent units 39-48 dispatch were not consulted. Needs the mandatory fresh-context review before shipping, and inherits the underlying realization's own still-unreviewed status."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit53.bike_rental: {title: "کرایه کردن دوچرخه"}

lessons:
  en.a1.unit53.lesson01.bike_rental_vocabulary: {title: "کلمات کرایهٔ دوچرخه"}
  en.a1.unit53.lesson02.phrases_for_renting_a_bike: {title: "عبارت‌های کرایهٔ دوچرخه"}
  en.a1.unit53.lesson03.dialogue_at_the_rental_shop: {title: "گفتگو: در مغازهٔ کرایهٔ دوچرخه"}
  en.a1.unit53.lesson04.a_bike_ride_along_the_river: {title: "متن: دوچرخه‌سواری کنار رودخونه"}

teaching:
  en.a1.unit53.lesson01.teach.rent: {title: "rent", gloss: "کرایه کردن", note: "*rent* یعنی پول دادن برای استفاده از یه چیز برای مدتی، و بعد پس دادنش.", example_gloss: "می‌خوام یه دوچرخه کرایه کنم."}
  en.a1.unit53.lesson01.teach.deposit: {title: "deposit", gloss: "ودیعه", note: "*deposit* یعنی پولی که اول می‌دین و وقتی چیزی رو سالم پس بدین، بهتون برمی‌گرده.", example_gloss: "ودیعه بیست دلاره."}
  en.a1.unit53.lesson01.teach.return: {title: "return", gloss: "پس دادن / برگردوندن", note: "*return* یعنی چیزی رو برگردوندن.", example_gloss: "لطفاً دوچرخه رو امروز پس بدین."}
  en.a1.unit53.lesson01.teach.hour: {title: "hour", gloss: "ساعت (واحد زمان)", note: "*hour* یعنی یه واحد زمان، شصت دقیقه. *an hour* یعنی هر ساعت -- دقت کنین انگلیسی از حرف اضافهٔ *per* برای نرخ استفاده می‌کنه، فارسی از عبارتی مثل «در ساعت».", example_gloss: "قیمتش ده دلار در ساعته."}
  en.a1.unit53.lesson01.teach.size: {title: "size", gloss: "اندازه", note: "*size* یعنی بزرگی یا کوچیکی یه چیز.", example_gloss: "چه اندازه‌ای لازم دارین؟"}
  en.a1.unit53.lesson01.teach.helmet: {title: "helmet", gloss: "کلاه ایمنی", note: "*helmet* یعنی کلاه سختی که سرتون رو موقع دوچرخه‌سواری محافظت می‌کنه.", example_gloss: "کلاه ایمنی دارین؟"}
exercises:
  en.a1.unit53.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "deposit"
    distractors: ["rent", "return", "hour", "size"]
    accepted_answers: [{value: "deposit", status: "correct"}]
    feedback: "*deposit* یعنی ودیعه."
  en.a1.unit53.lesson01.exercise02.choose_return_meaning:
    instruction: "کدوم کلمه یعنی چیزی رو برگردوندن؟"
    correct_option: "return"
    distractors: ["rent", "deposit", "size"]
    accepted_answers: [{value: "return", status: "correct"}]
    feedback: "*return* یعنی برگردوندن."
  en.a1.unit53.lesson01.exercise03.match_bike_rental_words:
    instruction: "هر توضیح انگلیسی رو به کلمهٔ درستش وصل کنین."
    accepted_answers: [{value: [{left: "a vehicle you pedal, often rented for a short time", right: "bike"}, {left: "to pay to use something for a while, then give it back", right: "rent"}, {left: "money you pay first and get back when you return something undamaged", right: "deposit"}, {left: "to bring something back", right: "return"}, {left: "a unit of time, sixty minutes", right: "hour"}, {left: "how big or small something is", right: "size"}, {left: "a hard hat that protects your head while riding", right: "helmet"}], status: "correct"}]
    feedback: "bike=دوچرخه، rent=کرایه کردن، deposit=ودیعه، return=برگردوندن، hour=ساعت، size=اندازه، helmet=کلاه ایمنی."
  en.a1.unit53.lesson01.exercise04.order_rent_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "want", "to", "rent", "a", "bike."], status: "correct"}]
    feedback: "ترتیب درست: *I want to rent a bike.*"
  en.a1.unit53.lesson01.exercise05.write_deposit:
    instruction: "کلمه‌ای رو بنویسین که یعنی پولی که قبل از کرایه می‌دین و بعداً پس می‌گیرین."
    accepted_answers: [{value: "deposit", status: "correct"}]
    feedback: "*deposit* یعنی ودیعه."

  en.a1.unit53.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "How much does it cost per hour?"
    distractors: ["I'd like to rent a bike, please.", "I need a small bike.", "When do I need to return it?"]
    accepted_answers: [{value: "How much does it cost per hour?", status: "correct"}]
    feedback: "*How much does it cost per hour?* یعنی قیمتش در ساعت چقدره؟"
  en.a1.unit53.lesson02.exercise02.choose_request_meaning:
    instruction: "کدوم عبارت رو مشتری برای درخواست کرایهٔ دوچرخه می‌گه؟"
    correct_option: "I'd like to rent a bike, please."
    distractors: ["Can I have a helmet, please?", "When do I need to return it?", "It's ten dollars an hour."]
    accepted_answers: [{value: "I'd like to rent a bike, please.", status: "correct"}]
    feedback: "*I'd like to rent a bike, please.* یعنی می‌خوام یه دوچرخه کرایه کنم، لطفاً."
  en.a1.unit53.lesson02.exercise03.choose_return_question_meaning:
    instruction: "کدوم عبارت می‌پرسه کِی باید دوچرخه رو پس بدین؟"
    correct_option: "When do I need to return it?"
    distractors: ["How much does it cost per hour?", "I need a small bike.", "Can I have a helmet, please?"]
    accepted_answers: [{value: "When do I need to return it?", status: "correct"}]
    feedback: "*When do I need to return it?* یعنی کِی باید پسش بدم؟"
  en.a1.unit53.lesson02.exercise04.order_price_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["It's", "ten", "dollars", "an", "hour."], status: "correct"}]
    feedback: "ترتیب درست: *It's ten dollars an hour.*"
  en.a1.unit53.lesson02.exercise05.translate_helmet_request:
    instruction: "ترجمه کنین: «می‌شه یه کلاه ایمنی داشته باشم، لطفاً؟»"
    accepted_answers: [{value: "Can I have a helmet, please?", status: "correct"}]
    feedback: "*Can I have a helmet, please?* یعنی می‌شه یه کلاه ایمنی داشته باشم؟"

  en.a1.unit53.lesson03.exercise01.comprehension_reason:
    instruction: "طبق گفتگو، چرا میا و لیلا می‌خوان دوچرخه کرایه کنن؟"
    correct_option: "to ride along the river"
    distractors: ["to go to work", "to visit a friend", "to go shopping"]
    accepted_answers: [{value: "to ride along the river", status: "correct"}]
    feedback: "میا می‌گه می‌خوان کنار رودخونه دوچرخه‌سواری کنن."
  en.a1.unit53.lesson03.exercise02.comprehension_leila_size:
    instruction: "طبق گفتگو، لیلا چه اندازه دوچرخه‌ای لازم داره؟"
    correct_option: "small"
    distractors: ["medium", "large", "extra small"]
    accepted_answers: [{value: "small", status: "correct"}]
    feedback: "لیلا می‌گه یه دوچرخهٔ کوچیک لازم داره."
  en.a1.unit53.lesson03.exercise03.listen_dialogue_deposit:
    instruction: "طبق گفتگو، ودیعه چقدره؟"
    correct_option: "twenty dollars"
    distractors: ["ten dollars", "fifteen dollars", "thirty dollars"]
    accepted_answers: [{value: "twenty dollars", status: "correct"}]
    feedback: "کارمند می‌گه ودیعه بیست دلاره."
  en.a1.unit53.lesson03.exercise04.respond_own_bike_statement:
    instruction: "بگین لیلا یا میا چه اندازه دوچرخه‌ای لازم دارن، یا بگین ودیعه چقدره."
    accepted_answers: ["I need a small one", "I need a small one.", "I need a medium one", "I need a medium one.", "It's ten dollars an hour", "It's ten dollars an hour.", "The deposit is twenty dollars", "The deposit is twenty dollars.", "Please return them by five o'clock", "Please return them by five o'clock."]
    feedback: "می‌تونین بگین *I need a small one* یا *The deposit is twenty dollars*."

  en.a1.unit53.lesson04.exercise01.reading_rental_reason:
    instruction: "طبق متن، چرا میا و لیلا به مغازهٔ کرایه رفتن؟"
    correct_option: "neither of them owned a bike"
    distractors: ["their bikes were broken", "they wanted new bikes", "the shop was having a sale"]
    accepted_answers: [{value: "neither of them owned a bike", status: "correct"}]
    feedback: "متن می‌گه هیچ‌کدومشون دوچرخه نداشتن."
  en.a1.unit53.lesson04.exercise02.reading_return_time:
    instruction: "طبق متن، اونا باید چه ساعتی دوچرخه‌ها رو پس می‌دادن؟"
    correct_option: "five o'clock"
    distractors: ["four o'clock", "six o'clock", "seven o'clock"]
    accepted_answers: [{value: "five o'clock", status: "correct"}]
    feedback: "متن می‌گه باید تا ساعت پنج پسشون می‌دادن."
  en.a1.unit53.lesson04.exercise03.reading_told_daniel:
    instruction: "طبق متن، اونا دربارهٔ دوچرخه‌سواری به کی گفتن؟"
    correct_option: "Daniel"
    distractors: ["Leila's sister", "the rental clerk", "Mia's neighbor"]
    accepted_answers: [{value: "Daniel", status: "correct"}]
    feedback: "متن می‌گه به دنیل گفتن."
  en.a1.unit53.lesson04.exercise04.write_own_bike_ride_message:
    instruction: "یه پیام کوتاه بنویسین: بگین لیلا چه اندازه دوچرخه‌ای برداشت، و بگین چه ساعتی دوچرخه‌ها رو پس دادن."
    accepted_answers: ["Leila took a small bike, and they returned the bikes by five o'clock.", "Leila took a small bike. They returned the bikes by five o'clock.", "Leila took a small bike and they returned the bikes by five o'clock."]
    feedback: "می‌تونین بگین *Leila took a small bike, and they returned the bikes by five o'clock.*"
