review: {status: "reviewed", required_next_reviewer: null, notes: "New overlay against the shared English realization unit53 (renting a bicycle). Authored fully at schema_version 1.1, every kind: vocabulary teaching card has a matching example_gloss:. Contrastive-grammar points for this unit: (1) the pronoun 'one' substituting for an already-mentioned noun -- 'I need a small one'/'And I need a medium one' both drop the noun bike and replace it with the placeholder one, a construction Farsi has no direct equivalent for (فارسی معمولاً یا اسم رو تکرار می‌کنه یا کاملاً حذفش می‌کنه: یه دوچرخهٔ کوچیک لازم دارم، بدون کلمهٔ جایگزین)؛ flagged on both dialogue lines that use it. (2) 'per hour' -- English marks a rate with the preposition per before the unit (ten dollars per hour), while Farsi expresses the same rate with a possessive-like construction with no direct preposition (ده دلار در ساعت، یا ساعتی ده دلار) -- flagged on the price phrase card. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, not translated Farsi lefts, per the established fa-en convention. Every listen_select/multiple_choice distractor in lesson03/lesson04 is an invented value never stated elsewhere in this unit (invented sizes, invented times, invented reasons) -- checked the dialogue's own lines (Rental Clerk: 3 lines; Mia: 'We'd like to rent two bikes...', 'And I need a medium one.', 'When do we need to return them?'; Leila: 'I need a small one.', 'Great, thank you!') to confirm no distractor reuses a fact the tested speaker states elsewhere in the same audio. Strong sibling-isolation rule applied -- nl-en/prs-en overlays and the concurrent units 39-48 dispatch were not consulted. Needs the mandatory fresh-context review before shipping, and inherits the underlying realization's own still-unreviewed status.\n\nfa-en review 2026-10-19: Checked notes, glosses, distractors, accepted answers, sequencing, Persian style. 11 fixes: two confusing per/an-hour notes, helmet gloss and translate prompt calque (plus variants), محافظت کردن از, reading-gloss style, untaught distractors (shopping, extra, broken, sale), write prompt now asks 'by' time, added variants."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit53.bike_rental: {title: "کرایه کردن دوچرخه"}

lessons:
  en.a1.unit53.lesson01.bike_rental_vocabulary: {title: "کلمات کرایهٔ دوچرخه"}
  en.a1.unit53.lesson02.phrases_for_renting_a_bike: {title: "عبارت‌های کرایهٔ دوچرخه"}
  en.a1.unit53.lesson03.dialogue_at_the_rental_shop: {title: "گفتگو: در مغازهٔ کرایهٔ دوچرخه"}
  en.a1.unit53.lesson04.a_bike_ride_along_the_river: {title: "متن: دوچرخه‌سواری کنار رودخونه"}

teaching:
  en.a1.unit53.lesson01.teach.rent: {title: "rent", gloss: "کرایه کردن", note: "*rent* یعنی پول دادن برای استفاده از یه چیز برای مدتی، و بعد پس دادنش.", example_gloss: "می‌خوام یه دوچرخه کرایه کنم."}
  en.a1.unit53.lesson01.teach.deposit: {title: "deposit", gloss: "ودیعه", note: "*deposit* یعنی پولی که اول می‌دین و وقتی چیزی رو سالم پس بدین، بهتون برمی‌گرده.", example_gloss: "ودیعه بیست دلاره."}
  en.a1.unit53.lesson01.teach.return: {title: "return", gloss: "پس دادن / برگردوندن", note: "*return* یعنی چیزی رو برگردوندن.", example_gloss: "لطفاً دوچرخه رو امروز پس بدین."}
  en.a1.unit53.lesson01.teach.hour: {title: "hour", gloss: "ساعت (واحد زمان)", note: "*hour* یعنی یه واحد زمان، شصت دقیقه. تو *ten dollars an hour*، *an hour* یعنی «هر ساعت» (= *per hour*)؛ فارسی می‌گه «ساعتی» یا «در ساعت».", example_gloss: "ساعتی ده دلار می‌شه."}
  en.a1.unit53.lesson01.teach.size: {title: "size", gloss: "اندازه", note: "*size* یعنی بزرگی یا کوچیکی یه چیز.", example_gloss: "چه اندازه‌ای لازم دارین؟"}
  en.a1.unit53.lesson01.teach.helmet: {title: "helmet", gloss: "کلاه ایمنی", note: "*helmet* یعنی کلاه سفتی که موقع دوچرخه‌سواری از سرتون محافظت می‌کنه.", example_gloss: "کلاه ایمنی دارین؟"}

  en.a1.unit53.lesson02.teach.id_like_to_rent_a_bike: {title: "I'd like to rent a bike, please.", gloss: "می‌خوام یه دوچرخه کرایه کنم، لطفاً."}
  en.a1.unit53.lesson02.teach.how_much_does_it_cost_per_hour: {title: "How much does it cost per hour?", gloss: "قیمتش در ساعت چقدره؟", note: "*per hour* یعنی «در ساعت» یا «ساعتی». *per* قبل از واحد میاد و نرخ رو نشون می‌ده؛ *ten dollars an hour* هم همین معنی رو داره."}
  en.a1.unit53.lesson02.teach.i_need_a_small_bike: {title: "I need a small bike.", gloss: "یه دوچرخهٔ کوچیک لازم دارم."}
  en.a1.unit53.lesson02.teach.can_i_have_a_helmet: {title: "Can I have a helmet, please?", gloss: "می‌شه یه کلاه ایمنی بهم بدین؟"}
  en.a1.unit53.lesson02.teach.when_do_i_need_to_return_it: {title: "When do I need to return it?", gloss: "کِی باید پسش بدم؟"}
  en.a1.unit53.lesson02.teach.its_ten_dollars_an_hour: {title: "It's ten dollars an hour.", gloss: "ده دلار در ساعته."}

  en.a1.unit53.lesson03.teach.dialogue_line1: {title: "خوش‌آمدگویی کارمند", gloss: "کارمند می‌گه سلام! امروز چطور می‌تونم کمکتون کنم؟"}
  en.a1.unit53.lesson03.teach.dialogue_line2: {title: "درخواست میا", gloss: "میا می‌گه می‌خوایم دو تا دوچرخه کرایه کنیم، و می‌گه می‌خوایم کنار رودخونه دوچرخه‌سواری کنیم."}
  en.a1.unit53.lesson03.teach.dialogue_line3: {title: "سؤال کارمند", gloss: "کارمند می‌پرسه چه اندازه‌ای لازم دارین؟"}
  en.a1.unit53.lesson03.teach.dialogue_line4: {title: "جواب لیلا", gloss: "لیلا می‌گه یه اندازهٔ کوچیک لازم دارم.", note: "*one* اینجا به جای تکرار کردن اسم *bike* اومده -- فارسی معمولاً یا اسم رو تکرار می‌کنه یا کاملاً حذفش می‌کنه، کلمهٔ جایگزینی مثل *one* نداره."}
  en.a1.unit53.lesson03.teach.dialogue_line5: {title: "جواب میا", gloss: "میا می‌گه منم یه اندازهٔ متوسط لازم دارم.", note: "دوباره *one* به جای اسم *bike* اومده، همون نکتهٔ خط قبل."}
  en.a1.unit53.lesson03.teach.dialogue_line6: {title: "توضیح کارمند دربارهٔ قیمت", gloss: "کارمند می‌گه عالی، بفرمایید دوچرخه‌هاتون، و می‌گه ده دلار در ساعته، و ودیعه‌ش بیست دلاره."}
  en.a1.unit53.lesson03.teach.dialogue_line7: {title: "سؤال میا دربارهٔ برگردوندن", gloss: "میا می‌پرسه کِی باید پسشون بدیم؟"}
  en.a1.unit53.lesson03.teach.dialogue_line8: {title: "جواب کارمند دربارهٔ زمان", gloss: "کارمند می‌گه لطفاً تا ساعت پنج پسشون بدین."}
  en.a1.unit53.lesson03.teach.dialogue_line9: {title: "تشکر لیلا", gloss: "لیلا می‌گه عالی، ممنون!"}

  en.a1.unit53.lesson04.teach.reading_passage: {title: "متن: دوچرخه‌سواری کنار رودخونه", gloss: "دوچرخه‌سواری کنار رودخونه: یه بعدازظهر گرم، میا از لیلا دعوت کرد کنار رودخونهٔ نزدیک آپارتمانش دوچرخه‌سواری کنن. هیچ‌کدومشون دوچرخه نداشتن، برای همین با هم به یه مغازهٔ کرایه رفتن. کارمند پرسید چه اندازه‌ای لازم دارن، و لیلا یه دوچرخهٔ کوچیک برداشت و میا یه دوچرخهٔ متوسط. کرایه‌ش ده دلار در ساعت بود، و ودیعه‌ش برای هر دو دوچرخه بیست دلار بود. باید تا ساعت پنج دوچرخه‌ها رو پس می‌دادن. دوچرخه‌سواری کنار رودخونه خیلی قشنگ بود، و اونا آدم‌هایی رو دیدن که سگ‌هاشون رو گردش می‌بردن و از هوای آفتابی لذت می‌بردن. دوچرخه‌ها رو دقیقاً سر وقت پس دادن و ودیعه‌شون رو پس گرفتن. بعدش، ماجرای دوچرخه‌سواری رو به دنیل گفتن، و اون گفت دفعهٔ بعد می‌خواد باهاشون بیاد."}

exercises:
