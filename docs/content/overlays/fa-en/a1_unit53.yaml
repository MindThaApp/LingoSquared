          - {left: "rent", right: "پول دادن برای استفادهٔ موقت از چیزی و بعد پس دادنش"}
          - {left: "deposit", right: "پولی که اول می‌دین و اگر چیزی سالم پس داده بشه پس می‌گیرین"}
          - {left: "return", right: "چیزی رو پس آوردن"}
          - {left: "hour", right: "واحد زمانی برابر با شصت دقیقه"}
          - {left: "size", right: "اینکه چیزی چقدر بزرگ یا کوچیکه"}
          - {left: "helmet", right: "کلاه سفتی که موقع دوچرخه‌سواری از سرتون محافظت می‌کنه"}
        status: "correct"
    feedback: "bike=دوچرخه، rent=کرایه کردن، deposit=ودیعه، return=برگردوندن، hour=ساعت، size=اندازه، helmet=کلاه ایمنی."
  en.a1.unit53.lesson01.exercise04.order_rent_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
