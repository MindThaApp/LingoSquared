course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح میانی (B1) برای فارسی‌زبان‌ها، با تمرکز بر شرط، توالی رویدادها، نقل قول غیرمستقیم، هدف و فرض‌های غیرواقعی."

units:
  en.b1.unit07.conditions: {title: "اگه این اتفاق بیفته، این کار رو می‌کنیم"}

lessons:
  en.b1.unit07.lesson01.condition_vocabulary: {title: "if، unless، condition و result"}
  en.b1.unit07.lesson02.real_conditions: {title: "اگه جلسه دیر شروع بشه، پیام می‌دم"}
  en.b1.unit07.lesson03.reading_a_meeting_plan: {title: "متن: برنامهٔ جایگزین"}
  en.b1.unit07.lesson04.the_meeting_plan_dialogue: {title: "اگه اتاق اشغال باشه، آنلاین جلسه می‌ذاریم"}

teaching:
  en.b1.unit07.lesson01.teach.if: {title: "if", gloss: "اگر، اگه", note: "if یک شرط یا موقعیت ممکن رو معرفی می‌کنه.", example_gloss: "اگه اتوبوس دیر کنه، بهت زنگ می‌زنم."}
  en.b1.unit07.lesson01.teach.unless: {title: "unless", gloss: "مگر این که، اگه ... نه", note: "unless یعنی «اگر نه» یا «به‌جز وقتی که»؛ بعد از اون معمولاً شرط منفی در معنی میاد، ولی خود جمله مثبت نوشته می‌شه.", example_gloss: "مگر این که برنامه عوض بشه، ساعت ده همدیگه رو می‌بینیم."}
  en.b1.unit07.lesson01.teach.condition: {title: "condition", gloss: "شرط، موقعیت لازم", note: "condition یعنی چیزی که اول باید اتفاق بیفته تا نتیجهٔ بعدی ممکن بشه.", example_gloss: "شرط روشنه: اگر همه برسن، شروع می‌کنیم."}
  en.b1.unit07.lesson01.teach.result: {title: "result", gloss: "نتیجه", note: "result یعنی چیزی که به‌خاطر یک شرط اتفاق می‌افته.", example_gloss: "نتیجه اینه که آنلاین جلسه می‌ذاریم."}
  en.b1.unit07.lesson01.teach.delay: {title: "delay", gloss: "تأخیر", note: "delay یعنی چیزی دیرتر از زمان برنامه‌ریزی‌شده اتفاق بیفته.", example_gloss: "یک تأخیر می‌تونه همه رو دیر برسونه."}
  en.b1.unit07.lesson01.teach.reschedule: {title: "reschedule", gloss: "زمان جدید تعیین کردن", note: "reschedule یعنی برای یک جلسه یا قرار، زمان تازه‌ای انتخاب کنین.", example_gloss: "اگه دکتر سرش شلوغ باشه، قرار رو به زمان دیگه‌ای منتقل می‌کنیم."}

  en.b1.unit07.lesson02.teach.if_meeting_late: {title: "If the meeting starts late, I will send everyone a message.", gloss: "اگه جلسه دیر شروع بشه، به همه پیام می‌دم.", note: "برای شرط واقعی دربارهٔ آینده، بعد از *if* زمان حال ساده میاد: *If the meeting starts late*، نه will start."}
  en.b1.unit07.lesson02.teach.if_not_ready: {title: "If the report is not ready, we will reschedule the review.", gloss: "اگه گزارش آماده نباشه، جلسهٔ مرور رو به زمان دیگه‌ای منتقل می‌کنیم.", note: "*If ... is not ready* یک شرط منفی واقعی رو معرفی می‌کنه؛ نتیجه با *will* میاد."}
  en.b1.unit07.lesson02.teach.grammar_real_condition: {title: "شرط واقعی برای آینده", gloss: "اگه دیر شروع بشه، پیام می‌دم.", note: "در انگلیسی برای شرط واقعی آینده، جملهٔ شرطی با حال ساده ساخته می‌شه و نتیجه معمولاً با *will* میاد."}

  en.b1.unit07.lesson03.teach.backup_plan: {title: "backup plan", gloss: "برنامهٔ جایگزین", note: "backup plan یعنی برنامه‌ای اضافی که اگر برنامهٔ اصلی جواب نداد ازش استفاده می‌کنین.", example_gloss: "اگه اتاق اشغال باشه، به یک برنامهٔ جایگزین نیاز داریم."}
  en.b1.unit07.lesson03.teach.move_update: {title: "move the update", gloss: "گزارش پیشرفت را جابه‌جا کردن", note: "move the update یعنی زمان ارائه یا بررسی یک گزارش پیشرفت رو به وقت دیگری منتقل کردن.", example_gloss: "اگه لیلا دیر کنه، گزارش پیشرفتش رو به فردا منتقل می‌کنیم."}
  en.b1.unit07.lesson03.teach.reading_passage: {title: "متن: برنامهٔ جایگزین", gloss: "دنیل برای جلسهٔ تیم یک برنامهٔ جایگزین می‌نویسه. اگر اتاق کنفرانس آزاد باشه، تیم ساعت ده آنجا جلسه می‌ذاره. اگر اتاق اشغال باشه، آنلاین جلسه می‌ذارن. مگر این که لیلا تا ساعت ده وارد جلسه بشه، دنیل گزارش پیشرفت او را به فردا منتقل می‌کنه. اگر گزارش آماده نباشه، میا به‌جاش یک گزارش پیشرفت کوتاه‌تر می‌فرسته.", note: "این متن تفاوت *if* و *unless* رو در یک برنامهٔ کاری واقعی نشان می‌ده."}

  en.b1.unit07.lesson04.teach.q_if_meeting_late: {title: "پرسش میا", gloss: "میا می‌پرسه دنیل، اگه جلسه دیر شروع بشه، باید چیکار کنیم؟", note: "این سؤال با *if* دربارهٔ یک مشکل ممکن در آینده می‌پرسه."}
  en.b1.unit07.lesson04.teach.a_send_message: {title: "جواب دنیل", gloss: "دنیل می‌گه اگه دیر شروع بشه، به همه پیام می‌دم.", note: "دنیل اول شرط رو می‌گه و بعد نتیجه رو با *will* بیان می‌کنه."}
  en.b1.unit07.lesson04.teach.q_if_leila_cannot_join: {title: "پرسش بعدی میا", gloss: "میا می‌پرسه و اگه لیلا نتونه وارد جلسه بشه؟", note: "این یک شرط دوم در همان برنامهٔ جلسه‌ست."}
  en.b1.unit07.lesson04.teach.a_unless_she_joins: {title: "جواب دنیل با unless", gloss: "دنیل می‌گه مگر این که او تا ساعت ده وارد جلسه بشه، گزارش پیشرفتش رو به فردا منتقل می‌کنیم.", note: "*Unless she joins by ten* یعنی اگر تا ساعت ده وارد جلسه نشه."}
  en.b1.unit07.lesson04.teach.q_room_busy: {title: "پیشنهاد میا", gloss: "میا می‌گه منطقیه. اگه اتاق هنوز اشغال باشه، باید آنلاین جلسه بگذاریم؟", note: "اینجا *if* برای یک مشکل عملی در همان روز استفاده شده."}
  en.b1.unit07.lesson04.teach.a_meet_online: {title: "جواب پایانی دنیل", gloss: "دنیل می‌گه بله، اگه اتاق اشغال باشه، به‌جاش آنلاین جلسه می‌گذاریم.", note: "*instead* یعنی به‌جای برنامهٔ اصلی."}

exercises:
