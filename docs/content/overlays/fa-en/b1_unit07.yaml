    instruction: "گوش کنین و کلمه یا عبارتی را که گفته شده انتخاب کنین."
    correct_option: "unless"
    distractors: ["if", "condition", "result"]
    accepted_answers: [{value: "unless", status: "correct"}]
    feedback: "unless یعنی مگر این که / اگر نه."
  en.b1.unit07.lesson01.exercise02.choose_condition_word:
    instruction: "کدام کلمه به معنای موقعیتی است که باید اول اتفاق بیفته؟"
    correct_option: "condition"
    distractors: ["result", "delay", "reschedule"]
    accepted_answers: [{value: "condition", status: "correct"}]
    feedback: "condition یعنی شرط یا موقعیت لازم."
  en.b1.unit07.lesson01.exercise03.choose_reschedule_word:
    instruction: "کدام کلمه یعنی برای یک جلسه یا قرار، زمان جدید انتخاب کردن؟"
    correct_option: "reschedule"
    distractors: ["delay", "result", "condition"]
    accepted_answers: [{value: "reschedule", status: "correct"}]
    feedback: "reschedule یعنی زمان جدید تعیین کردن."
  en.b1.unit07.lesson01.exercise04.match_condition_words:
    instruction: "هر معنی را به کلمه یا عبارت انگلیسی درست وصل کنید."
    accepted_answers:
      - value:
          - {left: "if", right: "condition"}
          - {left: "unless", right: "means if not, except if"}
          - {left: "result", right: "what happens because of a condition"}
