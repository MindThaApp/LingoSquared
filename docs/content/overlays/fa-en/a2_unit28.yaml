teaching:
  en.a2.unit28.lesson01.teach.medicine: {title: "medicine", gloss: "دارو", note: "*medicine* یعنی دارو.", example_gloss: "دکتر برای سردردم بهم دارو داد."}
  en.a2.unit28.lesson01.teach.prescription: {title: "prescription", gloss: "نسخه", note: "*prescription* یعنی نسخه‌ای که دکتر می‌نویسه.", example_gloss: "دکتر برای اون دارو برام نسخه نوشت."}
  en.a2.unit28.lesson01.teach.follow_up_appointment: {title: "follow-up appointment", gloss: "قرار ملاقات بعدی", note: "*follow-up appointment* یعنی یک قرار ملاقات دیگه برای بررسی وضعیت شما.", example_gloss: "اگه بهتر نشه، به یه ویزیت بعدی نیاز دارین."}
  en.a2.unit28.lesson01.teach.getting_worse: {title: "getting worse", gloss: "بدتر شدن", note: "*getting worse* یعنی یک علامت داره بدتر می‌شه.", example_gloss: "سردردم داره بدتر می‌شه، نه بهتر."}
  en.a2.unit28.lesson01.teach.insurance_card: {title: "insurance card", gloss: "کارت بیمه", note: "*insurance card* یعنی کارتی که کمک می‌کنه هزینهٔ ویزیت دکتر رو بپردازید.", example_gloss: "لطفاً کارت بیمه‌تون رو برای قرار ملاقات بیارین."}
  en.a2.unit28.lesson01.teach.reused_symptoms: {title: "علائم قبلی", gloss: "سردرد، گلودرد، تب", note: "این کلمات رو قبلاً در واحد ۲۲ یاد گرفتید -- اینجا دوباره مرور می‌کنیم.", example_gloss: ["سردرد دارم.", "گلودرد دارم.", "تب دارم."]}

  en.a2.unit28.lesson02.teach.appointment_request: {title: "درخواست قرار ملاقات", gloss: "می‌خواستم یک قرار ملاقات برای دیدن دکتر بگیرم، لطفاً.", note: "این یک درخواست مؤدبانه و رسمی برای گرفتن قرار ملاقاته."}
  en.a2.unit28.lesson02.teach.symptom_duration: {title: "توضیح مدت و شدت علامت", gloss: "سه روزه که سردرد و گلودرد دارم، و داره بدتر می‌شه.", note: "این جمله با ساختار *present perfect* (*I've had*) مدت زمان رو نشون می‌ده، مثل واحد ۲۵. فارسی اینجا زمان حال به کار می‌بره («سه روزه که ... دارم»)، ولی انگلیسی present perfect با *for* می‌خواد؛ نگین *I have a headache for three days*."}

  en.a2.unit28.lesson03.teach.arrive_early: {title: "arrive ten minutes early", gloss: "ده دقیقه زودتر برسید", note: "*arrive ten minutes early* یعنی ده دقیقه قبل از وقت ملاقات برسید.", example_gloss: "لطفاً ده دقیقه زودتر از وقت ملاقات‌تون برسین."}
  en.a2.unit28.lesson03.teach.confirmation_text: {title: "متن تأیید قرار ملاقات", gloss: "قرار ملاقات شما برای ساعت سهٔ امروز تأیید شده. لطفاً کارت بیمه‌تون رو بیارید و ده دقیقه زودتر برسید. شمارهٔ تأیید ۷۷۲۴ است.", note: "این یک پیام تأیید رسمی واقعی با زمان، دستور، و شماره است -- سطح A2."}

  en.a2.unit28.lesson04.teach.i_see: {title: "I see.", gloss: "متوجه شدم.", note: "*I see* یک عبارت رایج برای نشون دادن اینکه چیزی رو فهمیدید."}
  en.a2.unit28.lesson04.teach.q_whats_wrong: {title: "پرسیدن دربارهٔ مشکل", gloss: "دکتر می‌پرسه: چی شده؟", note: "همون سوالی که لیلا در واحد ۲۲ پرسید، این بار از زبان دکتر."}
  en.a2.unit28.lesson04.teach.a_symptoms_duration: {title: "جواب دنیل دربارهٔ علائم", gloss: "دنیل می‌گه: سه روزه که سردرد و گلودرد دارم، و داره بدتر می‌شه.", note: "همون جمله‌ای که در درس دوم یاد گرفتیم."}
  en.a2.unit28.lesson04.teach.a_bad_cold: {title: "تشخیص دکتر", gloss: "دکتر می‌گه: متوجه شدم. شما سرماخوردگی شدیدی دارین.", note: "این یک تشخیص ساده و معمولیه، نه یک بیماری جدی."}
  en.a2.unit28.lesson04.teach.q_medicine: {title: "پرسیدن دربارهٔ دارو", gloss: "دنیل می‌پرسه: باید دارو مصرف کنم؟", note: "دنیل بعد از شنیدن تشخیص، دربارهٔ درمان می‌پرسه."}
  en.a2.unit28.lesson04.teach.a_medicine_instructions: {title: "دستور مصرف دارو", gloss: "دکتر می‌گه: بله، این دارو رو روزی دو بار به مدت پنج روز مصرف کنید، و آب زیاد بخورید.", note: "دستور دقیق: دو بار در روز، پنج روز."}
  en.a2.unit28.lesson04.teach.q_follow_up: {title: "پرسیدن دربارهٔ ویزیت بعدی", gloss: "دنیل می‌پرسه: اگه بهتر نشد باید برگردم؟", note: "دنیل از همون ساختار شرطی (*if it doesn't get better*) که لیلا در واحد ۲۲ گفته بود استفاده می‌کنه."}
  en.a2.unit28.lesson04.teach.a_followup_appointment: {title: "جواب دکتر دربارهٔ ویزیت بعدی", gloss: "دکتر می‌گه: بله، اگه ظرف یک هفته بهتر نشد، برای یک ویزیت بعدی برگردید.", note: "این جواب شرط دقیق برگشتن رو مشخص می‌کنه -- ظرف یک هفته."}

