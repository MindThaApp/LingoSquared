  en.a1.unit66.lesson03.teach.dialogue_line1: {title: "علامت اول لیلا", gloss: "لیلا می‌گه: سلام. سرفه دارم.", note: "لیلا اول سرفه رو به عنوان علامت بیماری می‌گه."}
  en.a1.unit66.lesson03.teach.dialogue_line2: {title: "سؤال داروساز", gloss: "داروساز می‌پرسه: تب دارین؟", note: "داروساز دربارهٔ تب سؤال می‌کنه."}
  en.a1.unit66.lesson03.teach.dialogue_line3: {title: "پاسخ لیلا", gloss: "لیلا می‌گه: نه، تب ندارم. گلوم درد می‌کنه.", note: "لیلا می‌گه تب نداره، اما گلوش درد می‌کنه."}
  en.a1.unit66.lesson03.teach.dialogue_line4: {title: "سؤال دربارهٔ سردرد", gloss: "داروساز می‌پرسه: سردرد دارین؟", note: "داروساز دربارهٔ یک علامت دیگه سؤال می‌کنه."}
  en.a1.unit66.lesson03.teach.dialogue_line5: {title: "تأیید لیلا", gloss: "لیلا می‌گه: بله، سردرد دارم.", note: "لیلا می‌گه سردرد هم داره."}
  en.a1.unit66.lesson03.teach.dialogue_line6: {title: "راهنمایی داروساز", gloss: "داروساز می‌گه: این دارو رو با آب مصرف کنین. اگر حال‌تون بدتر شد، لطفاً از پزشک بپرسین.", note: "داروساز مصرف دارو با آب و پرسیدن از پزشک در صورت بدتر شدن رو می‌گه."}
  en.a1.unit66.lesson03.teach.dialogue_line7: {title: "تشکر لیلا", gloss: "لیلا می‌گه: ممنون.", note: "لیلا برای کمک داروساز تشکر می‌کنه."}

  en.a1.unit66.lesson04.teach.pharmacy_note: {title: "متن: یادداشت داروخانه", gloss: "یادداشت داروخانه: سرفه و گلودرد. بدون تب. دارو رو با آب مصرف کنین. اگر بدتر شد، از پزشک بپرسین.", note: "این یادداشت علائم و راهنمایی سادهٔ مصرف دارو رو خلاصه می‌کنه."}
  en.a1.unit66.lesson04.teach.reading_passage: {title: "متن: مراجعه به داروخانه", gloss: "مراجعه به داروخانه: لیلا به داروخانه رفت چون سرفه داشت و گلوش درد می‌کرد. داروساز پرسید آیا تب داره. لیلا گفت تب نداره، اما سردرد داره. داروساز بهش دارو داد و گفت اونو با آب مصرف کنه. یادداشت گفت اگر حالش بدتر شد، از پزشک بپرسه.", note: "این متن گفتگوی داروخانه و علائم لیلا رو روایت می‌کنه."}

