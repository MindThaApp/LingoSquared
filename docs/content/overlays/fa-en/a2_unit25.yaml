    correct_option: "since last month"
    distractors: ["since last year", "since last week", "since yesterday"]
    accepted_answers: [{value: "since last month", status: "correct"}]
    feedback: "متن می‌گه you have lived at your new address since last month."
  en.a2.unit25.lesson03.exercise04.order_bring_photo_id:
    instruction: "کلمات را برای گفتن «لطفاً یه کارت شناسایی عکس‌دار و یه مدرک اقامت بیارین» مرتب کنین."
    accepted_answers: [{value: ["please", "bring", "a", "photo", "ID", "and", "one", "proof", "of", "residency"], status: "correct"}]
    feedback: "ترتیب درست please bring a photo ID and one proof of residency است."
