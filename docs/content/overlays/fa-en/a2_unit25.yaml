    instruction: "بنویسین که یه کارت شناسایی عکس‌دار و یه قبض آب و برق میارین."
    accepted_answers:
      - {value: "I will bring a photo ID and a utility bill.", status: "correct"}
      - {value: "I will bring a photo ID and a utility bill", status: "correct"}
    feedback: "I will bring a photo ID and a utility bill یعنی یه کارت شناسایی عکس‌دار و یه قبض آب و برق میارم."

  en.a2.unit25.lesson04.exercise01.listen_since_when_answer:
    instruction: "گفتگو را گوش کنین و معلوم کنین دنیل از چه وقتی توی آدرس جدید زندگی می‌کنه."
    correct_option: "since last month"
    distractors: ["since last year", "since last week", "since yesterday"]
    accepted_answers: [{value: "since last month", status: "correct"}]
    feedback: "دنیل می‌گه Since last month."
  en.a2.unit25.lesson04.exercise02.listen_required_documents:
    instruction: "گوش کنین و مدارک لازم را انتخاب کنین."
