    accepted_answers: [{value: "Friday at 10am", status: "correct"}]
    feedback: "کارمند می‌گه Friday at 10am works."
  en.a2.unit25.lesson04.exercise04.order_since_when_question:
    instruction: "کلمات را برای گفتن «از چه وقتی توی آدرس جدید زندگی می‌کنین؟» مرتب کنین."
    accepted_answers: [{value: ["Since", "when", "have", "you", "lived", "at", "the", "new", "address"], status: "correct"}]
    feedback: "ترتیب درست Since when have you lived at the new address؟ است."
  en.a2.unit25.lesson04.exercise05.reply_as_daniel:
    instruction: "کارمند می‌پرسه: از چه وقتی توی آدرس جدید زندگی می‌کنین؟"
    accepted_answers:
      - {value: "Since last month. Could you tell me what I need to bring? Would it be possible to come this Friday?", status: "correct"}
    feedback: "جواب کامل تاریخ اقامت، پرسیدن مدارک لازم، و درخواست وقت را با هم بیان می‌کنه -- سه لحظهٔ جدا از گفتگو."
  en.a2.unit25.lesson04.exercise06.speak_bureaucracy_dialogue:
