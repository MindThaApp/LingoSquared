  en.a2.unit25.lesson01.teach.appointment: {title: "appointment", gloss: "قرار ملاقات", note: "appointment یعنی قرار ملاقات.", example_gloss: "من جمعه در ادارهٔ راهنمایی و رانندگی قرار ملاقات دارم."}
  en.a2.unit25.lesson01.teach.document: {title: "document", gloss: "مدرک", note: "document یعنی مدرک.", example_gloss: "لطفاً یک مدرک به‌عنوان مدرک اقامت بیاورید."}
  en.a2.unit25.lesson01.teach.proof_of_residency: {title: "proof of residency", gloss: "مدرک اقامت", note: "proof of residency یعنی مدرکی که محل زندگی را نشون می‌ده.", example_gloss: "قبض آب و برق می‌تواند به‌عنوان مدرک اقامت استفاده شود."}
  en.a2.unit25.lesson01.teach.form: {title: "form", gloss: "فرم", note: "form یعنی فرم.", example_gloss: "لطفاً قبل از قرار ملاقات این فرم را پر کنید."}
  en.a2.unit25.lesson01.teach.confirmation_number: {title: "confirmation number", gloss: "شمارهٔ تأیید", note: "confirmation number یعنی شماره‌ای که قرار ملاقات را تأیید می‌کنه.", example_gloss: "شمارهٔ تأیید شما ۴۴۷۱ است."}

  en.a2.unit25.lesson02.teach.i_was_wondering_whether: {title: "I was wondering whether I could make an appointment.", gloss: "می‌خواستم بدونم آیا می‌تونم یه قرار ملاقات بگیرم.", note: "I was wondering whether...، یک شکل مؤدبانه و رسمی برای درخواست است."}
  en.a2.unit25.lesson02.teach.would_it_be_possible: {title: "Would it be possible to come this Friday?", gloss: "امکانش هست جمعهٔ این هفته بیام؟", note: "Would it be possible...؟ یک درخواست بسیار مؤدبانه است."}
  en.a2.unit25.lesson02.teach.because_i_moved: {title: "I need to update my address because I moved last month.", gloss: "باید آدرسم رو به‌روز کنم چون ماه پیش نقل مکان کردم.", note: "because برای بیان دلیل با جملهٔ فرعی استفاده می‌شه -- یک ساختار سطح A2."}

  en.a2.unit25.lesson03.teach.photo_id: {title: "photo ID", gloss: "کارت شناسایی عکس‌دار", note: "photo ID یعنی کارت شناسایی با عکس.", example_gloss: "شما به یک کارت شناسایی عکس‌دار و یک مدرک اقامت نیاز دارید."}
  en.a2.unit25.lesson03.teach.utility_bill: {title: "utility bill", gloss: "قبض آب و برق", note: "utility bill یعنی قبض خدمات شهری (آب، برق، گاز).", example_gloss: "قبض آب و برق نمونهٔ رایجی از مدرک اقامت است."}
  en.a2.unit25.lesson03.teach.notice_text: {title: "متن اطلاعیه", gloss: "برای به‌روز کردن آدرستون، لطفاً یه کارت شناسایی عکس‌دار و یه مدرک اقامت، مثل قبض آب و برق، بیارین. شما از ماه پیش توی آدرس جدیدتون زندگی می‌کنین، پس لطفاً قرارداد اجاره‌تون رو هم بیارین.", note: "این یک اطلاعیهٔ رسمی واقعی با شرط و دلیل است -- سطح A2."}
  en.a2.unit25.lesson03.teach.i_will_bring: {title: "I will bring a photo ID.", gloss: "یه کارت شناسایی عکس‌دار میارم.", note: "will برای بیان زمان آینده استفاده می‌شه."}

  en.a2.unit25.lesson04.teach.could_you_tell_me: {title: "Could you tell me what I need to bring?", gloss: "می‌تونین بهم بگین چی باید بیارم؟", note: "Could you tell me...؟ یک سوال غیرمستقیم و مؤدبانه است."}
  en.a2.unit25.lesson04.teach.q_since_when: {title: "پرسیدن از چه زمانی", gloss: "کارمند می‌پرسه از چه وقتی توی آدرس جدید زندگی می‌کنین؟", note: "Since when...؟ برای پرسیدن دربارهٔ نقطهٔ شروع یک وضعیت استفاده می‌شه."}
  en.a2.unit25.lesson04.teach.a_since_last_month: {title: "جواب دنیل", gloss: "دنیل می‌گه از ماه پیش.", note: "Since last month یعنی از ماه پیش -- جواب دقیق به سوال بالا."}
  en.a2.unit25.lesson04.teach.q_would_it_be_possible: {title: "پرسیدن دربارهٔ وقت", gloss: "دنیل می‌پرسه امکانش هست جمعهٔ این هفته بیام؟", note: "همون سوال آموزش‌دیده در درس دوم."}
  en.a2.unit25.lesson04.teach.a_friday_works_confirmation: {title: "جواب کارمند", gloss: "کارمند می‌گه بله، جمعه ساعت ۱۰ صبح خوبه. شمارهٔ تأیید شما ۴۴۷۱ است.", note: "کارمند هم وقت را تأیید می‌کنه و هم شمارهٔ تأیید را می‌ده."}

exercises:
  en.a2.unit25.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شده را انتخاب کنین."
    correct_option: "proof of residency"
    distractors: ["appointment", "document", "form"]
    accepted_answers: [{value: "proof of residency", status: "correct"}]
    feedback: "proof of residency یعنی مدرک اقامت."
  en.a2.unit25.lesson01.exercise02.choose_scheduled_visit_word:
    instruction: "کدام کلمه به معنای یک زمان برنامه‌ریزی‌شده برای مراجعه به یک اداره است؟"
    correct_option: "appointment"
    distractors: ["document", "form", "confirmation number"]
    accepted_answers: [{value: "appointment", status: "correct"}]
    feedback: "appointment یعنی قرار ملاقات."
  en.a2.unit25.lesson01.exercise03.choose_paper_that_shows_address:
    instruction: "کدام عبارت به معنای مدرکی است که محل زندگی شما را نشون می‌ده؟"
    correct_option: "proof of residency"
    distractors: ["confirmation number", "form", "appointment"]
    accepted_answers: [{value: "proof of residency", status: "correct"}]
    feedback: "proof of residency یعنی مدرک اقامت."
  en.a2.unit25.lesson01.exercise04.match_registration_words:
    instruction: "هر توضیح را به عبارت انگلیسی درست وصل کنید."
    accepted_answers: [{value: [{left: "a scheduled time to visit an office", right: "appointment"}, {left: "official paper you provide as evidence", right: "document"}, {left: "a paper you fill out with your information", right: "form"}, {left: "the number that confirms your appointment", right: "confirmation number"}, {left: "a document that shows where you live", right: "proof of residency"}, {left: "identification with your photo on it", right: "photo ID"}, {left: "a bill, such as for electricity, used as an example of proof of residency", right: "utility bill"}, {left: "used to give a reason", right: "because"}], status: "correct"}]
    feedback: "appointment=قرار ملاقات، document=مدرک، form=فرم، confirmation number=شمارهٔ تأیید."
  en.a2.unit25.lesson01.exercise05.write_confirmation_number:
    instruction: "عبارتی که به معنای شماره‌ای است که قرار ملاقات شما را تأیید می‌کنه را بنویسین."
    accepted_answers:
      - {value: "confirmation number", status: "correct"}
      - {value: "Confirmation number", status: "correct"}
    feedback: "confirmation number یعنی شمارهٔ تأیید."

  en.a2.unit25.lesson02.exercise01.listen_request:
    instruction: "گوش کنین و جملهٔ گفته‌شده را انتخاب کنین."
    correct_option: "I was wondering whether I could make an appointment."
    distractors: ["Would it be possible to come this Friday?", "I need to update my address.", "Could you tell me what I need to bring?"]
    accepted_answers: [{value: "I was wondering whether I could make an appointment.", status: "correct"}]
    feedback: "I was wondering whether I could make an appointment یعنی می‌خواستم بدونم آیا می‌تونم یه قرار ملاقات بگیرم."
  en.a2.unit25.lesson02.exercise02.choose_polite_appointment_request:
    instruction: "می‌خواین رسمی با یک اداره تماس بگیرین و درخواست قرار ملاقات کنین. چی می‌گین؟"
    correct_option: "I was wondering whether I could make an appointment."
    distractors: ["Since when have you lived at the new address?", "Your confirmation number is 4471.", "You'll need a photo ID."]
    accepted_answers: [{value: "I was wondering whether I could make an appointment.", status: "correct"}]
    feedback: "I was wondering whether...، یک شکل مؤدبانه و رسمی برای درخواست است."
  en.a2.unit25.lesson02.exercise03.order_would_it_be_possible:
    instruction: "کلمات را برای گفتن «امکانش هست جمعهٔ این هفته بیام؟» مرتب کنین."
    accepted_answers: [{value: ["Would", "it", "be", "possible", "to", "come", "this", "Friday"], status: "correct"}]
    feedback: "ترتیب درست Would it be possible to come this Friday؟ است."
  en.a2.unit25.lesson02.exercise04.reply_why_update_address:
    instruction: "چرا باید آدرسم رو به‌روز کنم؟"
    accepted_answers:
      - {value: "I need to update my address because I moved last month.", status: "correct"}
    feedback: "I need to update my address because I moved last month یعنی باید آدرسم رو به‌روز کنم چون ماه پیش نقل مکان کردم."
  en.a2.unit25.lesson02.exercise05.write_formal_reason:
    instruction: "بنویسین که باید آدرستون رو به‌روز کنین چون ماه پیش نقل مکان کردین."
    accepted_answers:
      - {value: "I need to update my address because I moved last month.", status: "correct"}
      - {value: "I need to update my address because I moved last month", status: "correct"}
    feedback: "I need to update my address because I moved last month یعنی باید آدرسم رو به‌روز کنم چون ماه پیش نقل مکان کردم."

  en.a2.unit25.lesson03.exercise01.read_required_id:
    instruction: "چه نوع شناسایی لازمه؟"
    correct_option: "a photo ID"
    distractors: ["a confirmation number", "a form", "an appointment"]
    accepted_answers: [{value: "a photo ID", status: "correct"}]
    feedback: "متن می‌گه please bring a photo ID."
  en.a2.unit25.lesson03.exercise02.read_example_proof:
