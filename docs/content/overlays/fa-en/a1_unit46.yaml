review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit46 (lost items), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1, every teaching card with a realization example: has a matching example_gloss:. Contrastive-grammar points, deliberately different from ones already used in this direction: (1) the present perfect Have you seen my keys? (an action with present relevance, no specific past time named) -- Persian has no exact present-perfect equivalent and typically phrases the same real-world situation with simple past (کلیدامو ندیدی؟, 'didn't you see my keys'), so the have + past-participle pairing must be learned as its own English structure, not mapped one-to-one onto a Persian tense; (2) lost and found as a fixed two-participle compound noun naming a physical place/service -- Persian's equivalent (دفتر اشیای گمشده, literally 'office of lost items') is an ordinary possessive noun phrase built completely differently, so this idiom must be memorized whole rather than decomposed word-by-word; (3) the affirmatively-phrased open question Has anyone found a backpack? -- colloquial Persian often phrases the same real-world question with a NEGATIVE verb (کسی ... پیدا نکرده؟, literally 'hasn't anyone found...'), so the note flags that English keeps this specific question grammatically affirmative even though a Farsi speaker's instinct may be to negate it. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, NOT translated Persian lefts, per the established compiler-driven precedent. lesson03/lesson04 multiple_choice and listen_select distractor sets copied verbatim from the realization's own review notes documenting the exact invented, never-spoken-in-this-unit values already verified safe. Strong sibling-isolation rule applied -- nl-en/prs-en overlays for this unit were not consulted. Needs the mandatory fresh-context review before shipping."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit46.lost_items: {title: "گزارش وسیلهٔ گم‌شده"}

lessons:
  en.a1.unit46.lesson01.lost_items_vocabulary: {title: "کلمات وسیله‌های گم‌شده"}
  en.a1.unit46.lesson02.reporting_a_lost_item: {title: "گزارش وسیلهٔ گم‌شده"}
  en.a1.unit46.lesson03.dialogue_missing_backpack: {title: "گفتگو: کوله‌پشتی گم‌شده"}
  en.a1.unit46.lesson04.lost_and_found_notice: {title: "متن: دفتر اشیای گمشده"}

teaching:
  en.a1.unit46.lesson01.teach.lost: {title: "lost", gloss: "گم‌شده", note: "*lost* یعنی گم‌شده -- دیگه پیشتون نیست و نمی‌دونین کجاست.", example_gloss: "کیف پولمو گم کردم."}
  en.a1.unit46.lesson01.teach.found: {title: "found", gloss: "پیدا شده", note: "*found* یعنی پیدا شده -- کسی بعد از گم شدن پیداش کرده.", example_gloss: "کلیداتو پیدا کردم!"}
  en.a1.unit46.lesson01.teach.keys: {title: "keys", gloss: "کلیدها", note: "*keys* یعنی کلیدها.", example_gloss: "این کلیدای منن."}
  en.a1.unit46.lesson01.teach.wallet: {title: "wallet", gloss: "کیف پول", note: "*wallet* یعنی کیف پول.", example_gloss: "این کیف پول توئه؟"}
  en.a1.unit46.lesson01.teach.backpack: {title: "backpack", gloss: "کوله‌پشتی", note: "*backpack* یعنی کوله‌پشتی.", example_gloss: "کوله‌پشتیم مشکیه."}

  en.a1.unit46.lesson02.teach.i_lost_my_wallet: {title: "I lost my wallet.", gloss: "کیف پولمو گم کردم.", note: "*I lost my wallet* -- زمان گذشتهٔ ساده برای فعل *lose*."}
  en.a1.unit46.lesson02.teach.have_you_seen_my_keys: {title: "Have you seen my keys?", gloss: "کلیدامو ندیدی؟", note: "*Have you seen...?* حال کامله؛ فارسی معمولاً همین وضعیتو با گذشتهٔ ساده می‌پرسه («ندیدی؟»)، چون معادل مستقیم برای *have* + اسم مفعولی نداره -- این ساختارو به‌عنوان یه الگوی جدا حفظ کنین."}
  en.a1.unit46.lesson02.teach.has_anyone_found_a_backpack: {title: "Has anyone found a backpack?", gloss: "کسی یه کوله‌پشتی پیدا نکرده؟", note: "*Has anyone found...?* توی انگلیسی به‌شکل مثبت میاد، ولی فارسی محاوره‌ای همین سؤالو معمولاً با فعل منفی می‌پرسه («کسی ... پیدا نکرده؟») -- دقت کنین انگلیسی رو منفی نکنین."}
  en.a1.unit46.lesson02.teach.its_black_with_a_red_strap: {title: "It's black with a red strap.", gloss: "مشکیه با یه بند قرمز.", note: "*It's black with a red strap* -- *with* برای اضافه کردن یه جزئیات توصیفی."}
  en.a1.unit46.lesson02.teach.wheres_the_lost_and_found: {title: "Where's the lost and found?", gloss: "دفتر اشیای گمشده کجاست؟", note: "*the lost and found* یه اسم مرکب ثابته -- محل/دفتری که وسایل گم‌شدهٔ پیدا‌شده رو نگه می‌داره. فارسی این مفهومو با یه عبارت اضافی می‌سازه («دفتر اشیای گمشده»)، نه دو تا اسم مفعولی کنار هم -- کل عبارت انگلیسی رو یه‌جا حفظ کنین."}
  en.a1.unit46.lesson02.teach.yes_we_found_it: {title: "Yes, we found it!", gloss: "آره، پیداش کردیم!", note: "*we found it* -- زمان گذشتهٔ ساده برای فعل *find*."}

  en.a1.unit46.lesson03.teach.dialogue_line1: {title: "سؤال دنیل", gloss: "دنیل می‌پرسه کوله‌پشتی میا کجاست -- کنار فواره داشتش.", note: "*You had it by the fountain* -- زمان گذشته برای وضعیت قبلی."}
  en.a1.unit46.lesson03.teach.dialogue_line2: {title: "جواب میا", gloss: "میا می‌گه وای نه، راست می‌گی! پیشم نیست. دوربینم توشه!", note: "*My camera is inside!* -- جملهٔ کوتاه برای نگرانی فوری."}
  en.a1.unit46.lesson03.teach.dialogue_line3: {title: "پیشنهاد دنیل", gloss: "دنیل می‌گه نگران نباش، بیا با دفتر پارک تماس بگیریم و بپرسیم.", note: "*let's call...* -- پیشنهاد یه کار مشترک."}
  en.a1.unit46.lesson03.teach.dialogue_line4: {title: "تماس دنیل", gloss: "دنیل می‌گه سلام، ما یه کوله‌پشتی مشکی نزدیک فواره گم کردیم. کسی پیداش نکرده؟", note: "*Has anyone found one?* -- سؤال مثبت که تازه یاد گرفتیم."}
  en.a1.unit46.lesson03.teach.dialogue_line5: {title: "سؤال میا", gloss: "میا می‌پرسه چی گفتن؟", note: "*What did they say?* -- سؤال با گذشتهٔ ساده دربارهٔ حرف کسی."}
  en.a1.unit46.lesson03.teach.dialogue_line6: {title: "جواب دنیل", gloss: "دنیل می‌گه پیداش کردن! مشکیه با یه بند زرد، درسته؟ دم پذیرش نگهش داشتن.", note: "*right?* آخر جمله -- برای تأیید گرفتن از طرف مقابل."}
  en.a1.unit46.lesson03.teach.dialogue_line7: {title: "خوشحالی میا", gloss: "میا می‌گه آره، همونه! بیا الان بریم بگیریمش. خدا رو شکر.", note: "*Thank goodness* -- ابراز راحتی خیال."}

  en.a1.unit46.lesson04.teach.reading_passage: {title: "متن: دفتر اشیای گمشده", gloss: "دفتر اشیای گمشده: اگه توی پارک چیزی گم کردین، اول به یاد بیارین آخرین بار کجا پیشتون بوده. بعد به دفتر پارک نزدیک دروازهٔ اصلی برین و وسیله رو توصیف کنین -- رنگش و هر جزئیات خاصی رو بگین. اسم و شمارهٔ تلفنتونو بدین تا اگه بعداً پیداش کردن باهاتون تماس بگیرن. بعد از اینکه میا کوله‌پشتیشو نزدیک فواره گم کرد، خودش و دنیل سریع با دفتر پارک تماس گرفتن. کارکنان دفتر از قبل پیداش کرده بودن و دم پذیرش نگهش داشته بودن. میا خیلی خوشحال شد که دوربینشو سالم پس گرفت. بعداً، به لیلا کل ماجرا رو تعریف کرد، و لیلا گفت کمکش می‌کنه دفعهٔ بعد بهتر مراقب وسایلش باشه.", note: "دقت کنین *had already found* حالت گذشتهٔ کامله -- برای کاری که قبل از یه اتفاق دیگه توی گذشته تموم شده بود."}

exercises:
  en.a1.unit46.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "keys"
    distractors: ["lost", "found", "wallet", "backpack"]
    accepted_answers: [{value: "keys", status: "correct"}]
    feedback: "*keys* یعنی کلیدها."
  en.a1.unit46.lesson01.exercise02.choose_wallet_meaning:
    instruction: "کدوم کلمه یعنی کیف کوچیکی که پول و کارت‌هاتونو توش می‌ذارین؟"
    correct_option: "wallet"
    distractors: ["keys", "backpack", "lost"]
    accepted_answers: [{value: "wallet", status: "correct"}]
    feedback: "*wallet* یعنی کیف پول."
  en.a1.unit46.lesson01.exercise03.match_lost_items_words:
    instruction: "هر توضیح رو به کلمهٔ درستش وصل کنین."
    accepted_answers:
      - value:
          - {left: "not with you anymore; you don't know where it is", right: "lost"}
          - {left: "someone discovered it after it was missing", right: "found"}
          - {left: "what you use to open a door or start a car", right: "keys"}
          - {left: "a small case for money and cards", right: "wallet"}
          - {left: "a bag for books", right: "backpack"}
        status: "correct"
    feedback: "lost=گم‌شده، found=پیدا شده، keys=کلیدها، wallet=کیف پول، backpack=کوله‌پشتی."
  en.a1.unit46.lesson01.exercise04.order_lost_wallet_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "lost", "my", "wallet."], status: "correct"}]
    feedback: "ترتیب درست: *I lost my wallet.*"
  en.a1.unit46.lesson01.exercise05.write_keys_word:
    instruction: "کلمه‌ای رو بنویسین که یعنی چیزی که برای باز کردن در یا روشن کردن ماشین استفاده می‌کنین."
    accepted_answers: [{value: "keys", status: "correct"}]
    feedback: "*keys* یعنی کلیدها."

  en.a1.unit46.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "Where's the lost and found?"
    distractors: ["I lost my wallet.", "Have you seen my keys?", "Has anyone found a backpack?", "It's black with a red strap."]
    accepted_answers: [{value: "Where's the lost and found?", status: "correct"}]
    feedback: "*Where's the lost and found?* یعنی دفتر اشیای گمشده کجاست؟"
  en.a1.unit46.lesson02.exercise02.choose_has_anyone_found_meaning:
    instruction: "کدوم عبارت می‌پرسه کس دیگه‌ای کیف شما رو پیدا کرده یا نه؟"
    correct_option: "Has anyone found a backpack?"
    distractors: ["I lost my wallet.", "Have you seen my keys?", "It's black with a red strap."]
    accepted_answers: [{value: "Has anyone found a backpack?", status: "correct"}]
    feedback: "*Has anyone found a backpack?* یعنی کسی یه کوله‌پشتی پیدا نکرده؟"
  en.a1.unit46.lesson02.exercise03.choose_its_black_meaning:
    instruction: "کدوم عبارت ظاهر یه وسیلهٔ گم‌شده رو توصیف می‌کنه؟"
    correct_option: "It's black with a red strap."
    distractors: ["I lost my wallet.", "Have you seen my keys?", "Has anyone found a backpack?"]
    accepted_answers: [{value: "It's black with a red strap.", status: "correct"}]
    feedback: "*It's black with a red strap.* یعنی مشکیه با یه بند قرمز."
  en.a1.unit46.lesson02.exercise04.order_have_you_seen_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["Have", "you", "seen", "my", "keys?"], status: "correct"}]
    feedback: "ترتیب درست: *Have you seen my keys?*"
  en.a1.unit46.lesson02.exercise05.translate_i_lost_my_wallet:
    instruction: "ترجمه کنین: «کیف پولمو گم کردم.»"
    accepted_answers: [{value: "I lost my wallet.", status: "correct"}, {value: "I lost my wallet", status: "correct"}]
    feedback: "*I lost my wallet.*"

  en.a1.unit46.lesson03.exercise01.comprehension_whats_inside:
    instruction: "طبق گفتگو، داخل کوله‌پشتی میا چیه؟"
    correct_option: "camera"
    distractors: ["wallet", "keys", "phone"]
    accepted_answers: [{value: "camera", status: "correct"}]
    feedback: "میا می‌گه دوربینش توشه."
  en.a1.unit46.lesson03.exercise02.comprehension_where_they_were:
    instruction: "طبق گفتگو، دنیل و میا وقتی کوله‌پشتی گم شد کجا بودن؟"
    correct_option: "near the fountain"
    distractors: ["at the park office", "at the front desk", "near the entrance"]
    accepted_answers: [{value: "near the fountain", status: "correct"}]
    feedback: "کوله‌پشتی نزدیک فواره گم شد."
  en.a1.unit46.lesson03.exercise03.listen_dialogue_strap_color:
    instruction: "طبق گفتگو، بند کوله‌پشتی میا چه رنگیه؟"
    correct_option: "yellow"
    distractors: ["red", "blue", "green"]
    accepted_answers: [{value: "yellow", status: "correct"}]
    feedback: "دنیل می‌گه بندش زرده."
  en.a1.unit46.lesson03.exercise04.respond_own_lost_item_report:
    instruction: "بگین یه وسیله گم کردین، یا بپرسین کسی پیداش کرده یا نه."
    accepted_answers: ["I lost my wallet", "I lost my wallet.", "I lost my keys", "I lost my keys.", "I lost my backpack", "I lost my backpack.", "Have you seen my keys?", "Has anyone found a backpack?", "Where's the lost and found?"]
    feedback: "می‌تونین از الگوی *I lost my ...* یا *Has anyone found ...?* استفاده کنین."

  en.a1.unit46.lesson04.exercise01.reading_first_step:
    instruction: "طبق متن، اگه توی پارک چیزی گم کردین اول باید چیکار کنین؟"
    correct_option: "think about where you last had it"
    distractors: ["call the police", "buy a new one", "post about it online"]
    accepted_answers: [{value: "think about where you last had it", status: "correct"}]
    feedback: "متن می‌گه اول به یاد بیارین آخرین بار کجا پیشتون بوده."
  en.a1.unit46.lesson04.exercise02.reading_what_to_describe:
    instruction: "طبق متن، دربارهٔ وسیلهٔ گم‌شده باید چی رو توصیف کنین؟"
    correct_option: "its color and special details"
    distractors: ["its price", "its brand name", "when you bought it"]
    accepted_answers: [{value: "its color and special details", status: "correct"}]
    feedback: "متن می‌گه باید رنگش و جزئیات خاصشو بگین."
  en.a1.unit46.lesson04.exercise03.reading_who_mia_told:
    instruction: "طبق متن، میا بعداً کل ماجرا رو به کی تعریف کرد؟"
    correct_option: "Leila"
    distractors: ["Daniel", "her mother", "a stranger"]
    accepted_answers: [{value: "Leila", status: "correct"}]
    feedback: "متن می‌گه میا به لیلا تعریف کرد."
  en.a1.unit46.lesson04.exercise04.write_own_lost_item_message:
    instruction: "یه پیام کوتاه بنویسین: بگین یه وسیله گم کردین و بپرسین کسی پیداش کرده یا نه."
    accepted_answers: ["I lost my keys. Have you seen them?", "I lost my keys. Have you seen them.", "I lost my keys, have you seen them?", "I lost my keys, and have you seen them?", "I lost my wallet. Has anyone found it?", "I lost my wallet. Has anyone found it.", "I lost my wallet, has anyone found it?", "I lost my wallet, and has anyone found it?", "I lost my backpack. Have you seen it?", "I lost my backpack. Have you seen it.", "I lost my backpack, have you seen it?", "I lost my backpack, and have you seen it?"]
    feedback: "می‌تونین از الگوی *I lost my ... . Has anyone found it?* استفاده کنین."
