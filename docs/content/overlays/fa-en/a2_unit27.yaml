  en.a2.unit27.lesson04.teach.a_no_fee_condition: {title: "جواب کارمند دربارهٔ کارمزد", gloss: "کارمند می‌گه اگه حداقل موجودی ۵۰۰ دلاری داشته باشین، کارمزد ماهانه نمی‌گیریم.", note: "کارمند شرط دقیق برای معافیت از کارمزد را می‌ده، مطابق با متن درس سوم."}
  en.a2.unit27.lesson04.teach.q_when_card: {title: "پرسیدن دربارهٔ زمان رسیدن کارت", gloss: "دنیل می‌گه خیلی خوبه. کارت بانکیم کِی می‌رسه؟", note: "دنیل رضایتش را نشون می‌ده و بعد سوال بعدی را می‌پرسه."}
  en.a2.unit27.lesson04.teach.a_five_to_seven_days: {title: "جواب کارمند دربارهٔ کارت", gloss: "کارمند می‌گه ظرف پنج تا هفت روز کاری می‌رسه.", note: "این جواب مطابق با متن درس سوم است -- پنج تا هفت روز کاری."}

