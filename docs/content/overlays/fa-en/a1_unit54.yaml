review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit54 (using a self-service laundromat). Authored fully at schema_version 1.1, every kind: vocabulary teaching card has a matching example_gloss:. Contrastive-grammar points for this unit: (1) 'How long does the wash cycle take?' -- English idiomatically uses take + duration to ask/state how long something lasts (the cycle takes thirty minutes), a fixed collocation Farsi expresses with طول کشیدن (چقدر طول می‌کشه؟) -- structurally similar but not a word-for-word match (Farsi's طول کشیدن literally means 'to pull length', with no verb corresponding one-to-one to take); flagged on that phrase card so the learner treats it as a fixed expression, not a literal translation. (2) 'a few things' -- the quantifier a few obligatorily takes a PLURAL countable noun in English (a few things, never a few thing), while Farsi's equivalent quantifier چند is followed by a SINGULAR noun (چند تا لباس, not a plural form) -- flagged on the wash-request phrase card since this is a common source of a genuine number-agreement error for Farsi speakers. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, not translated Farsi lefts, per the established fa-en convention. Every listen_select/multiple_choice distractor in lesson03/lesson04 is an invented value never stated elsewhere in this unit (invented reasons, invented prices, invented times) -- checked the dialogue's own lines (Attendant: 5 lines; Leila: 'Yes, please. My washing machine at home is broken.', 'Yes, I have quarters.'; Daniel: 'I have a small load too...', 'And how much does it cost?') to confirm no distractor reuses a fact the tested speaker states elsewhere in the same audio. Strong sibling-isolation rule applied -- nl-en/prs-en overlays and the concurrent units 39-48 dispatch were not consulted. Needs the mandatory fresh-context review before shipping, and inherits the underlying realization's own still-unreviewed status."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit54.laundry: {title: "لباس‌شویی در لاندرومت"}

lessons:
  en.a1.unit54.lesson01.laundromat_vocabulary: {title: "کلمات لاندرومت"}
  en.a1.unit54.lesson02.phrases_for_the_laundromat: {title: "عبارت‌های لاندرومت"}
  en.a1.unit54.lesson03.dialogue_at_the_laundromat: {title: "گفتگو: در لاندرومت"}
  en.a1.unit54.lesson04.a_trip_to_the_laundromat: {title: "متن: رفتن به لاندرومت"}

teaching:
  en.a1.unit54.lesson01.teach.laundromat: {title: "laundromat", gloss: "لاندرومت (لباس‌شویی عمومی)", note: "*laundromat* یعنی جایی که با ماشین‌های عمومی و با پرداخت پول لباس می‌شورین.", example_gloss: "امروز میرم لاندرومت."}
  en.a1.unit54.lesson01.teach.washing_machine: {title: "washing machine", gloss: "ماشین لباسشویی", note: "*washing machine* یعنی ماشینی که لباس‌ها رو می‌شوره.", example_gloss: "ماشین لباسشویی خرابه."}
  en.a1.unit54.lesson01.teach.dryer: {title: "dryer", gloss: "خشک‌کن", note: "*dryer* یعنی ماشینی که بعد از شستن، لباس‌ها رو خشک می‌کنه.", example_gloss: "لباس‌هاتون رو تو خشک‌کن بذارین."}
  en.a1.unit54.lesson01.teach.quarters: {title: "quarters", gloss: "سکه‌های بیست‌وپنج‌سنتی", note: "*quarters* سکه‌های آمریکایی به ارزش بیست‌وپنج سنتن، معمولاً برای ماشین‌های لباسشویی لازمن.", example_gloss: "ماشین‌ها سکهٔ بیست‌وپنج‌سنتی می‌گیرن."}
  en.a1.unit54.lesson01.teach.detergent: {title: "detergent", gloss: "پودر یا مایع لباسشویی", note: "*detergent* یعنی صابونی که برای شستن لباس استفاده می‌کنین.", example_gloss: "برای تمیز کردن لباس‌هاتون پودر لباسشویی لازم دارین."}
  en.a1.unit54.lesson01.teach.load: {title: "load", gloss: "یک نوبت لباس", note: "*load* یعنی مقدار لباسی که یک‌بار با هم می‌شورین.", example_gloss: "یه نوبت لباس زیاد دارم."}
exercises:
  en.a1.unit54.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "detergent"
    distractors: ["laundromat", "washing machine", "dryer", "quarters"]
    accepted_answers: [{value: "detergent", status: "correct"}]
    feedback: "*detergent* یعنی پودر یا مایع لباسشویی."
  en.a1.unit54.lesson01.exercise02.choose_dryer_meaning:
    instruction: "کدوم کلمه یعنی ماشینی که لباس‌ها رو خشک می‌کنه؟"
    correct_option: "dryer"
    distractors: ["washing machine", "laundromat", "load"]
    accepted_answers: [{value: "dryer", status: "correct"}]
    feedback: "*dryer* یعنی خشک‌کن."
  en.a1.unit54.lesson01.exercise03.match_laundry_words:
    instruction: "هر توضیح انگلیسی رو به کلمهٔ درستش وصل کنین."
    accepted_answers: [{value: [{left: "a place with machines to wash and dry your clothes for a fee", right: "laundromat"}, {left: "the machine that washes your clothes", right: "washing machine"}, {left: "the machine that dries your clothes after washing", right: "dryer"}, {left: "U.S. coins worth twenty-five cents, often needed for laundry machines", right: "quarters"}, {left: "the soap you use to wash clothes", right: "detergent"}, {left: "the amount of laundry you wash at one time", right: "load"}, {left: "to make something free of dirt", right: "clean"}], status: "correct"}]
    feedback: "laundromat=لاندرومت، washing machine=ماشین لباسشویی، dryer=خشک‌کن، quarters=سکهٔ بیست‌وپنج‌سنتی، detergent=پودر لباسشویی، load=یک نوبت لباس، clean=تمیز کردن."
  en.a1.unit54.lesson01.exercise04.order_load_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "have", "a", "big", "load", "of", "laundry."], status: "correct"}]
    feedback: "ترتیب درست: *I have a big load of laundry.*"
  en.a1.unit54.lesson01.exercise05.write_quarters:
    instruction: "کلمه‌ای رو بنویسین که یعنی سکه‌های آمریکایی که معمولاً برای ماشین‌های لباسشویی لازمن."
    accepted_answers: [{value: "quarters", status: "correct"}]
    feedback: "*quarters* یعنی سکه‌های بیست‌وپنج‌سنتی."

  en.a1.unit54.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "How long does the wash cycle take?"
    distractors: ["I'd like to wash a few things, please.", "Do you have change for the machines?", "What time do you close?"]
    accepted_answers: [{value: "How long does the wash cycle take?", status: "correct"}]
    feedback: "*How long does the wash cycle take?* یعنی چرخهٔ شستشو چقدر طول می‌کشه؟"
  en.a1.unit54.lesson02.exercise02.choose_request_meaning:
    instruction: "کدوم عبارت رو مشتری برای درخواست شستن چند تا لباس می‌گه؟"
    correct_option: "I'd like to wash a few things, please."
    distractors: ["Do you have change for the machines?", "What time do you close?", "It's three dollars for one load."]
    accepted_answers: [{value: "I'd like to wash a few things, please.", status: "correct"}]
    feedback: "*I'd like to wash a few things, please.* یعنی می‌خوام چند تا لباس بشورم، لطفاً. دقت کنین بعد از *a few* همیشه اسم جمع میاد، ولی فارسی بعد از «چند» اسم مفرده."
  en.a1.unit54.lesson02.exercise03.choose_close_question_meaning:
    instruction: "کدوم عبارت می‌پرسه لاندرومت چه ساعتی بسته می‌شه؟"
    correct_option: "What time do you close?"
    distractors: ["How long does the wash cycle take?", "Do you have change for the machines?", "Please pick up your laundry by nine o'clock."]
    accepted_answers: [{value: "What time do you close?", status: "correct"}]
    feedback: "*What time do you close?* یعنی چه ساعتی می‌بندین؟"
  en.a1.unit54.lesson02.exercise04.order_price_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["It's", "three", "dollars", "for", "one", "load."], status: "correct"}]
    feedback: "ترتیب درست: *It's three dollars for one load.*"
  en.a1.unit54.lesson02.exercise05.translate_pickup_time:
    instruction: "ترجمه کنین: «لطفاً لباس‌هاتون رو تا ساعت نه بردارین.»"
    accepted_answers: [{value: "Please pick up your laundry by nine o'clock.", status: "correct"}]
    feedback: "*Please pick up your laundry by nine o'clock.* یعنی لطفاً لباس‌هاتون رو تا ساعت نه بردارین."

  en.a1.unit54.lesson03.exercise01.comprehension_reason:
    instruction: "طبق گفتگو، چرا لیلا باید از لاندرومت استفاده کنه؟"
    correct_option: "washing machine at home is broken"
    distractors: ["she doesn't have a washing machine", "her apartment doesn't allow laundry", "she wants to save money"]
    accepted_answers: [{value: "washing machine at home is broken", status: "correct"}]
    feedback: "لیلا می‌گه ماشین لباسشوییش تو خونه خرابه."
  en.a1.unit54.lesson03.exercise02.comprehension_daniel_load_size:
    instruction: "طبق گفتگو، دنیل چه اندازه نوبت لباسی داره؟"
    correct_option: "small"
    distractors: ["large", "medium", "extra large"]
    accepted_answers: [{value: "small", status: "correct"}]
    feedback: "دنیل می‌گه نوبت لباس کوچیکی داره."
  en.a1.unit54.lesson03.exercise03.listen_dialogue_cost:
    instruction: "طبق گفتگو، شستشو چقدر قیمت داره؟"
    correct_option: "three dollars"
    distractors: ["five dollars", "seven dollars", "ten dollars"]
    accepted_answers: [{value: "three dollars", status: "correct"}]
    feedback: "متصدی می‌گه سه دلاره."
  en.a1.unit54.lesson03.exercise04.respond_own_laundry_statement:
    instruction: "بگین لاندرومت چه ساعتی می‌بنده، شستشو چقدر قیمت داره، یا چرخه چقدر طول می‌کشه."
    accepted_answers: ["The laundromat closes at nine", "The laundromat closes at nine.", "It's three dollars for one load", "It's three dollars for one load.", "The wash cycle takes thirty minutes", "The wash cycle takes thirty minutes.", "My washing machine at home is broken", "My washing machine at home is broken."]
    feedback: "می‌تونین بگین *The laundromat closes at nine* یا *It's three dollars for one load*."

  en.a1.unit54.lesson04.exercise01.reading_break_reason:
    instruction: "طبق متن، چرا لیلا به لاندرومت رفت؟"
    correct_option: "Leila's washing machine broke"
    distractors: ["her apartment doesn't have a machine", "she wanted to try a new place", "her dryer broke"]
    accepted_answers: [{value: "Leila's washing machine broke", status: "correct"}]
    feedback: "متن می‌گه ماشین لباسشویی لیلا خراب شد."
  en.a1.unit54.lesson04.exercise02.reading_daniel_reason:
    instruction: "طبق متن، چرا دنیل هم همراه لیلا رفت؟"
    correct_option: "he had a small load of laundry too"
    distractors: ["he wanted to help her carry bags", "his machine was also broken", "he wanted coffee"]
    accepted_answers: [{value: "he had a small load of laundry too", status: "correct"}]
    feedback: "متن می‌گه دنیل هم یه نوبت لباس کوچیک داشت."
  en.a1.unit54.lesson04.exercise03.reading_closing_time:
    instruction: "طبق متن، لاندرومت چه ساعتی می‌بنده؟"
    correct_option: "nine o'clock"
    distractors: ["seven o'clock", "eight o'clock", "ten o'clock"]
    accepted_answers: [{value: "nine o'clock", status: "correct"}]
    feedback: "متن می‌گه لاندرومت ساعت نه می‌بنده."
  en.a1.unit54.lesson04.exercise04.write_own_laundromat_message:
    instruction: "یه پیام کوتاه بنویسین: بگین چرا لیلا به لاندرومت رفت، و بگین چه ساعتی می‌بنده."
    accepted_answers: ["Leila's washing machine broke, and the laundromat closes at nine.", "Leila's washing machine broke. The laundromat closes at nine.", "Leila's washing machine broke and the laundromat closes at nine."]
    feedback: "می‌تونین بگین *Leila's washing machine broke, and the laundromat closes at nine.*"
