review: {status: "reviewed", required_next_reviewer: null, notes: "New overlay against the shared English realization unit54 (using a self-service laundromat). Authored fully at schema_version 1.1, every kind: vocabulary teaching card has a matching example_gloss:. Contrastive-grammar points for this unit: (1) 'How long does the wash cycle take?' -- English idiomatically uses take + duration to ask/state how long something lasts (the cycle takes thirty minutes), a fixed collocation Farsi expresses with طول کشیدن (چقدر طول می‌کشه؟) -- structurally similar but not a word-for-word match (Farsi's طول کشیدن literally means 'to pull length', with no verb corresponding one-to-one to take); flagged on that phrase card so the learner treats it as a fixed expression, not a literal translation. (2) 'a few things' -- the quantifier a few obligatorily takes a PLURAL countable noun in English (a few things, never a few thing), while Farsi's equivalent quantifier چند is followed by a SINGULAR noun (چند تا لباس, not a plural form) -- flagged on the wash-request phrase card since this is a common source of a genuine number-agreement error for Farsi speakers. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, not translated Farsi lefts, per the established fa-en convention. Every listen_select/multiple_choice distractor in lesson03/lesson04 is an invented value never stated elsewhere in this unit (invented reasons, invented prices, invented times) -- checked the dialogue's own lines (Attendant: 5 lines; Leila: 'Yes, please. My washing machine at home is broken.', 'Yes, I have quarters.'; Daniel: 'I have a small load too...', 'And how much does it cost?') to confirm no distractor reuses a fact the tested speaker states elsewhere in the same audio. Strong sibling-isolation rule applied -- nl-en/prs-en overlays and the concurrent units 39-48 dispatch were not consulted. Needs the mandatory fresh-context review before shipping, and inherits the underlying realization's own still-unreviewed status.\n\nfa-en review 2026-10-19: Checked notes, glosses, distractors, accepted answers, sequencing, Persian style. 9 fixes: take-note wording, load example gloss, untaught distractors (allow, save money, extra, try, carry), added answers for translate (your clothes, by nine), write and speak prompts."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit54.laundry: {title: "لباس‌شویی در لاندرومت"}

lessons:
  en.a1.unit54.lesson01.laundromat_vocabulary: {title: "کلمات لاندرومت"}
  en.a1.unit54.lesson02.phrases_for_the_laundromat: {title: "عبارت‌های لاندرومت"}
  en.a1.unit54.lesson03.dialogue_at_the_laundromat: {title: "گفتگو: در لاندرومت"}
  en.a1.unit54.lesson04.a_trip_to_the_laundromat: {title: "متن: رفتن به لاندرومت"}

teaching:
  en.a1.unit54.lesson01.teach.laundromat: {title: "laundromat", gloss: "لاندرومت (لباس‌شویی عمومی)", note: "*laundromat* یعنی جایی که با ماشین‌های عمومی و با پرداخت پول لباس می‌شورین.", example_gloss: "امروز میرم لاندرومت."}
  en.a1.unit54.lesson01.teach.washing_machine: {title: "washing machine", gloss: "ماشین لباسشویی", note: "*washing machine* یعنی ماشینی که لباس‌ها رو می‌شوره.", example_gloss: "ماشین لباسشویی خرابه."}
  en.a1.unit54.lesson01.teach.dryer: {title: "dryer", gloss: "خشک‌کن", note: "*dryer* یعنی ماشینی که بعد از شستن، لباس‌ها رو خشک می‌کنه.", example_gloss: "لباس‌هاتون رو تو خشک‌کن بذارین."}
  en.a1.unit54.lesson01.teach.quarters: {title: "quarters", gloss: "سکه‌های بیست‌وپنج‌سنتی", note: "*quarters* سکه‌های آمریکایی به ارزش بیست‌وپنج سنتن، معمولاً برای ماشین‌های لباسشویی لازمن.", example_gloss: "ماشین‌ها سکهٔ بیست‌وپنج‌سنتی می‌گیرن."}
  en.a1.unit54.lesson01.teach.detergent: {title: "detergent", gloss: "پودر یا مایع لباسشویی", note: "*detergent* یعنی صابونی که برای شستن لباس استفاده می‌کنین.", example_gloss: "برای تمیز کردن لباس‌هاتون پودر لباسشویی لازم دارین."}
  en.a1.unit54.lesson01.teach.load: {title: "load", gloss: "یک نوبت لباس", note: "*load* یعنی مقدار لباسی که یک‌بار با هم می‌شورین.", example_gloss: "یه عالمه لباس برای شستن دارم."}

  en.a1.unit54.lesson02.teach.id_like_to_wash_a_few_things: {title: "I'd like to wash a few things, please.", gloss: "می‌خوام چند تا لباس بشورم، لطفاً.", note: "دقت کنین بعد از *a few* همیشه اسم جمع میاد (a few things)، ولی فارسی بعد از «چند» اسم مفرده (چند تا لباس)."}
  en.a1.unit54.lesson02.teach.do_you_have_change: {title: "Do you have change for the machines?", gloss: "پول خرد برای ماشین‌ها دارین؟", note: "*change* اینجا یعنی پول خرد (سکه)، نه «تغییر»."}
  en.a1.unit54.lesson02.teach.how_long_does_the_cycle_take: {title: "How long does the wash cycle take?", gloss: "چرخهٔ شستشو چقدر طول می‌کشه؟", note: "انگلیسی از فعل *take* برای بیان مدت‌زمان استفاده می‌کنه -- یه ترکیب ثابت که باید کامل حفظش کنین، نه ترجمهٔ کلمه‌به‌کلمه؛ فارسی همین معنی رو با «طول کشیدن» می‌گه که هیچ فعل مشترکی با take نداره."}
  en.a1.unit54.lesson02.teach.its_three_dollars_for_one_load: {title: "It's three dollars for one load.", gloss: "سه دلار برای یه نوبت لباسه."}
  en.a1.unit54.lesson02.teach.what_time_do_you_close: {title: "What time do you close?", gloss: "چه ساعتی می‌بندین؟"}
  en.a1.unit54.lesson02.teach.please_pick_up_by_nine: {title: "Please pick up your laundry by nine o'clock.", gloss: "لطفاً لباس‌هاتون رو تا ساعت نه بردارین."}

  en.a1.unit54.lesson03.teach.dialogue_line1: {title: "سلام متصدی", gloss: "متصدی می‌گه: سلام! ماشین لباسشویی لازم دارین؟"}
  en.a1.unit54.lesson03.teach.dialogue_line2: {title: "دلیل لیلا", gloss: "لیلا می‌گه: بله، لطفاً. ماشین لباسشوییم تو خونه خرابه."}
  en.a1.unit54.lesson03.teach.dialogue_line3: {title: "درخواست دنیل", gloss: "دنیل می‌گه: منم یه نوبت لباس کوچیک دارم. می‌تونم از یه ماشین استفاده کنم؟"}
  en.a1.unit54.lesson03.teach.dialogue_line4: {title: "توضیح دربارهٔ سکه‌ها", gloss: "متصدی می‌گه: البته! ماشین‌ها سکهٔ بیست‌وپنج‌سنتی می‌گیرن.", note: "*take* اینجا یعنی «(به‌عنوان پول) قبول کردن». دقت کنین که پایین‌تر تو *the wash cycle takes thirty minutes* همین فعل یعنی «طول کشیدن»."}
  en.a1.unit54.lesson03.teach.dialogue_line5: {title: "تأیید لیلا", gloss: "لیلا می‌گه: بله، سکه دارم."}
  en.a1.unit54.lesson03.teach.dialogue_line6: {title: "مدت چرخهٔ شستشو", gloss: "متصدی می‌گه: چرخهٔ شستشو سی دقیقه طول می‌کشه.", note: "همون فعل *take* اینجا با معنی «طول کشیدن» اومده -- یه معنی کاملاً متفاوت از *take quarters* بالا."}
  en.a1.unit54.lesson03.teach.dialogue_line7: {title: "سؤال دنیل دربارهٔ قیمت", gloss: "دنیل می‌گه: و چقدر قیمت داره؟"}
  en.a1.unit54.lesson03.teach.dialogue_line8: {title: "قیمت", gloss: "متصدی می‌گه: سه دلار برای یه نوبت لباسه."}
  en.a1.unit54.lesson03.teach.dialogue_line9: {title: "ساعت بستن", gloss: "متصدی می‌گه: لاندرومت ساعت نه می‌بنده، پس لطفاً لباس‌هاتون رو قبل از اون بردارین.", note: "*so* اینجا یعنی «پس» -- ساعت بستن رو به دستور برداشتن لباس‌ها وصل می‌کنه."}

  en.a1.unit54.lesson04.teach.reading_passage: {title: "متن: رفتن به لاندرومت", gloss: "یه روز بعدازظهر، ماشین لباسشویی تو ساختمون آپارتمان لیلا خراب شد. اون تصمیم گرفت بره لاندرومتی که ته خیابون بود. دنیل هم باهاش رفت چون خودشم یه نوبت لباس کوچیک داشت. تو لاندرومت، متصدی توضیح داد که ماشین‌ها سکهٔ بیست‌وپنج‌سنتی می‌گیرن، و چرخهٔ شستشو سی دقیقه طول می‌کشه. قیمتش هم سه دلار برای هر نوبت لباس بود. وقتی لباس‌هاشون داشت شسته می‌شد، دنیل و لیلا حرف زدن و تو یه کافهٔ کنار لاندرومت قهوه خوردن. لاندرومت ساعت نه می‌بنده، برای همین حواسشون بود لباس‌هاشون رو قبل از اون وقت بردارن. لیلا از اینکه دنیل باهاش بود ممنون بود، و گفت احتمالاً ماشین خونه تا آخر هفته درست می‌شه.", note: "*would probably be fixed* یعنی احتمالاً درست می‌شه -- یه پیش‌بینی احتمالی برای آینده، نه یه وعدهٔ قطعی."}

