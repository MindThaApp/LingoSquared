teaching:
  en.a1.unit31.lesson01.teach.tall: {title: "tall", gloss: "قدبلند", note: "tall یعنی قدبلند. ساختار جمله is + adjective: My brother is tall.", example_gloss: "برادرم قدبلنده."}
  en.a1.unit31.lesson01.teach.short: {title: "short", gloss: "قدکوتاه", note: "short یعنی قدکوتاه (برای قد؛ توجه: همین کلمه برای 'کوتاه' هم به‌کار می‌ره، پس با متن مشخص می‌شه منظور قده یا طوله).", example_gloss: "خواهرم قدکوتاهه."}
  en.a1.unit31.lesson01.teach.hair: {title: "hair", gloss: "مو", note: "hair یعنی مو. با فعل have/has میاد: She has long hair. نکتهٔ مهم برای فارسی‌زبان‌ها: توی فارسی می‌گیم 'موهاش بلنده' (اسم اول، صفت بعد)، ولی انگلیسی صفت رو قبل از اسم میاره: long hair نه hair long.", example_gloss: "موهاش بلنده."}
  en.a1.unit31.lesson01.teach.blond: {title: "blond", gloss: "بلوند، موطلایی", note: "blond یعنی موطلایی. باز هم صفت قبل از اسم: blond hair، نه hair blond -- این جابه‌جایی صفت و اسم یکی از خطاهای رایج فارسی‌زبان‌هاست چون توی فارسی با اضافه می‌گیم 'موی بلوند' (اسم اول).", example_gloss: "موهاش بلونده."}
  en.a1.unit31.lesson01.teach.curly: {title: "curly", gloss: "فرفری", note: "curly یعنی فرفری. curly hair یعنی موی فرفری.", example_gloss: "لیلا موهای فرفری داره."}

  en.a1.unit31.lesson02.teach.eyes: {title: "eyes", gloss: "چشم‌ها", note: "eyes یعنی چشم‌ها (جمع). با have/has میاد: I have brown eyes.", example_gloss: "من چشمای قهوه‌ای دارم."}
  en.a1.unit31.lesson02.teach.blue: {title: "blue", gloss: "آبی", note: "blue یعنی آبی. با فعل are (چون eyes جمعه): Her eyes are blue.", example_gloss: "چشماش آبیه."}
  en.a1.unit31.lesson02.teach.brown: {title: "brown", gloss: "قهوه‌ای", note: "brown یعنی قهوه‌ای؛ هم برای رنگ چشم هم برای رنگ مو به‌کار می‌ره.", example_gloss: "چشمای من قهوه‌ایه."}
  en.a1.unit31.lesson02.teach.green: {title: "green", gloss: "سبز", note: "green یعنی سبز.", example_gloss: "اون چشمای سبز داره."}
  en.a1.unit31.lesson02.teach.glasses: {title: "glasses", gloss: "عینک", note: "glasses یعنی عینک. نکتهٔ فعل: انگلیسی می‌گه wear glasses (پوشیدن عینک)، ولی فارسی می‌گه 'عینک زدن' -- فعل‌های متفاوتی به‌کار می‌رن، پس این یه خطای رایج ترجمه‌ایه.", example_gloss: "پدرم عینک می‌زنه."}
  en.a1.unit31.lesson02.teach.what_look_like: {title: "What does she look like?", gloss: "قیافه‌اش چه‌جوریه؟", note: "این سؤال با فعل کمکی does شروع می‌شه چون فعل اصلی look هست، نه does خودش. فارسی برای سؤال به فعل کمکی نیاز نداره ('قیافه‌اش چه‌جوریه؟')، پس ساختن این سؤال با does باید تمرین بشه -- یکی از سخت‌ترین بخش‌های گرامر انگلیسی برای فارسی‌زبان‌ها."}

  en.a1.unit31.lesson03.teach.dialogue_line1: {title: "حرف اول لیلا", gloss: "لیلا می‌گه امروز یه همکار جدید داریم. اسمش میاست.", note: "شروع گفتگو با معرفی موضوع."}
  en.a1.unit31.lesson03.teach.dialogue_line2: {title: "سؤال دنیل", gloss: "دنیل می‌پرسه قیافه‌اش چه‌جوریه؟", note: "سؤال با What does...look like؟"}
  en.a1.unit31.lesson03.teach.dialogue_line3: {title: "جواب لیلا", gloss: "لیلا می‌گه قدبلنده و موهای فرفری بلوند داره.", note: "دو تا ویژگی ظاهری با and وصل شدن."}
  en.a1.unit31.lesson03.teach.dialogue_line4: {title: "سؤال دنیل", gloss: "دنیل می‌پرسه عینک می‌زنه؟", note: "سؤال بله/خیر با Does."}
  en.a1.unit31.lesson03.teach.dialogue_line5: {title: "جواب لیلا", gloss: "لیلا می‌گه آره، می‌زنه. چشمای سبز هم داره.", note: "Yes, she does. جواب کوتاه با فعل کمکی does، نه yes ساده -- فارسی معمولاً فقط 'آره' می‌گه بدون تکرار فعل."}
  en.a1.unit31.lesson03.teach.dialogue_line6: {title: "حرف آخر دنیل", gloss: "دنیل می‌گه باشه، فکر کنم الان دم در می‌بینمش.", note: "جمع‌بندی گفتگو."}

  en.a1.unit31.lesson04.teach.reading_passage: {title: "متن: دنیل و لیلا", gloss: "دنیل و لیلا دوستای خوبی‌ان، ولی شبیه هم نیستن. دنیل قدبلنده و موی کوتاه مشکی داره. اون عینک می‌زنه. لیلا قدکوتاهه و موی بلند فرفری قهوه‌ای داره. اون چشمای آبی داره و دنیل چشمای قهوه‌ای داره. هر دوشون خیلی می‌خندن.", note: "این متن همهٔ کلمات ظاهری این درس رو توی جملات واقعی به‌کار می‌بره."}

exercises:
  en.a1.unit31.lesson01.exercise01.listen_trait:
    instruction: "گوش کنین و ویژگی گفته‌شده رو انتخاب کنین."
    correct_option: "curly"
    distractors: ["tall", "short", "blond"]
    accepted_answers: [{value: "curly", status: "correct"}]
    feedback: "curly یعنی فرفری."
  en.a1.unit31.lesson01.exercise02.choose_short_meaning:
    instruction: "کدوم کلمه یعنی کسی که قدبلند نیست؟"
    correct_option: "short"
    distractors: ["tall", "curly", "blond"]
    accepted_answers: [{value: "short", status: "correct"}]
    feedback: "short یعنی قدکوتاه."
  en.a1.unit31.lesson01.exercise03.match_traits:
    instruction: "هر واژه یا عبارت انگلیسی رو به توضیح فارسی درستش وصل کنین."
    pairs:
      - {left: "tall", right: "قد بلند داشتن"}
      - {left: "short", right: "قد کوتاه داشتن"}
      - {left: "hair", right: "چیزی که روی سرتون رشد می‌کنه"}
      - {left: "curly", right: "مویی با حلقه‌ها یا موج‌های زیاد"}
    accepted_answers:
      - value:
          - {left: "tall", right: "قد بلند داشتن"}
          - {left: "short", right: "قد کوتاه داشتن"}
          - {left: "hair", right: "چیزی که روی سرتون رشد می‌کنه"}
          - {left: "curly", right: "مویی با حلقه‌ها یا موج‌های زیاد"}
        status: "correct"
    feedback: "هر تعریف به یک واژه یا عبارت انگلیسی اشاره می‌کنه."
  en.a1.unit31.lesson01.exercise04.order_hair_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: "She has long hair.", status: "correct"}]
    feedback: "ترتیب درست: She has long hair. -- توجه: صفت long قبل از اسم hair میاد، نه بعدش."
  en.a1.unit31.lesson01.exercise05.write_trait:
    instruction: "کلمه‌ای رو بنویسین که یعنی کسی قد بلندی داره."
    accepted_answers: [{value: "tall", status: "correct"}]
    feedback: "tall یعنی قدبلند."

  en.a1.unit31.lesson02.exercise01.listen_eyes:
    instruction: "گوش کنین و رنگ چشم گفته‌شده رو انتخاب کنین."
    correct_option: "green eyes"
    distractors: ["blue eyes", "brown eyes", "glasses"]
    accepted_answers: [{value: "green eyes", status: "correct"}]
    feedback: "green eyes یعنی چشمای سبز."
  en.a1.unit31.lesson02.exercise02.choose_glasses_meaning:
    instruction: "کدوم کلمه یعنی وسیله‌ای که برای بهتر دیدن روی صورت می‌ذارن؟"
    correct_option: "glasses"
    distractors: ["eyes", "hair", "blue"]
    accepted_answers: [{value: "glasses", status: "correct"}]
    feedback: "glasses یعنی عینک."
  en.a1.unit31.lesson02.exercise03.choose_eye_color:
    instruction: "کدوم یکی رنگ چشمه؟"
    correct_option: "blue"
    distractors: ["glasses", "hair", "tall"]
    accepted_answers: [{value: "blue", status: "correct"}]
    feedback: "blue یعنی آبی، یه رنگ چشمه."
  en.a1.unit31.lesson02.exercise04.order_eyes_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: "Her eyes are blue.", status: "correct"}]
    feedback: "ترتیب درست: Her eyes are blue. -- چون eyes جمعه، فعل are به‌کار می‌ره نه is."
  en.a1.unit31.lesson02.exercise05.translate_look_like:
    instruction: "ترجمه کنین: «قیافه‌اش چه‌جوریه؟»"
    accepted_answers: [{value: "What does she look like?", status: "correct"}, {value: "What does he look like?", status: "correct"}]
    feedback: "What does she/he look like? -- این سؤال با فعل کمکی does شروع می‌شه."

  en.a1.unit31.lesson03.exercise01.comprehension_mia_hair:
    instruction: "طبق گفتگو، موی میا چه‌جوریه؟"
    correct_option: "curly, blond hair"
    distractors: ["short, black hair", "long, brown hair", "no hair"]
    accepted_answers: [{value: "curly, blond hair", status: "correct"}]
    feedback: "لیلا می‌گه میا موهای فرفری بلوند داره."
  en.a1.unit31.lesson03.exercise02.comprehension_mia_eyes:
    instruction: "چشمای میا چه رنگیه؟"
    correct_option: "green"
    distractors: ["blue", "brown", "gray"]
    accepted_answers: [{value: "green", status: "correct"}]
    feedback: "لیلا می‌گه میا چشمای سبز داره."
  en.a1.unit31.lesson03.exercise03.listen_dialogue_height:
    instruction: "طبق گفتگو، قد میا چه‌جوریه؟"
    correct_option: "tall"
    distractors: ["short", "medium", "not mentioned"]
    accepted_answers: [{value: "tall", status: "correct"}]
    feedback: "لیلا می‌گه میا قدبلنده."
  en.a1.unit31.lesson03.exercise04.respond_describe_someone:
    instruction: "یه دوست یا فامیل رو توی یه جمله توصیف کنین."
    accepted_answers: ["She has brown hair", "She has brown hair.", "He has brown hair", "He has brown hair.", "She has blond hair", "She has blond hair.", "He has blond hair", "He has blond hair.", "She is tall", "She is tall.", "He is tall", "He is tall.", "She has blue eyes", "She has blue eyes.", "He has blue eyes", "He has blue eyes."]
    feedback: "می‌تونین از الگوی has/is استفاده کنین، مثل She has brown hair یا He is tall."

  en.a1.unit31.lesson04.exercise01.reading_daniel_hair:
    instruction: "طبق متن، موی دنیل چه‌جوریه؟"
    correct_option: "short, black hair"
    distractors: ["curly, blond hair", "long, brown hair", "no hair"]
    accepted_answers: [{value: "short, black hair", status: "correct"}]
    feedback: "متن می‌گه دنیل موی کوتاه مشکی داره."
  en.a1.unit31.lesson04.exercise02.reading_who_wears_glasses:
    instruction: "طبق متن، کی عینک می‌زنه؟"
    correct_option: "Daniel"
    distractors: ["Leila", "both of them", "neither of them"]
    accepted_answers: [{value: "Daniel", status: "correct"}]
    feedback: "متن می‌گه دنیل عینک می‌زنه."
  en.a1.unit31.lesson04.exercise03.reading_leila_eyes:
    instruction: "طبق متن، چشمای لیلا چه رنگیه؟"
    correct_option: "blue"
    distractors: ["green", "brown", "gray"]
    accepted_answers: [{value: "blue", status: "correct"}]
    feedback: "متن می‌گه لیلا چشمای آبی داره."
  en.a1.unit31.lesson04.exercise04.write_own_description:
    instruction: "یه جمله دربارهٔ قیافهٔ خودتون بنویسین، با «I have» یا «I am»."
    accepted_answers: ["I have brown hair", "I have brown hair.", "I have black hair", "I have black hair.", "I have blond hair", "I have blond hair.", "I have blue eyes", "I have blue eyes.", "I have green eyes", "I have green eyes.", "I have brown eyes", "I have brown eyes.", "I am tall", "I am tall.", "I am short", "I am short."]
    feedback: "می‌تونین بگین I have... (برای مو و چشم) یا I am... (برای قد)."
