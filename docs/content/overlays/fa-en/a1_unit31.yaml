course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit31.appearance: {title: "توصیف ظاهر افراد"}

lessons:
  en.a1.unit31.lesson01.height_and_hair: {title: "قد و مو"}
  en.a1.unit31.lesson02.eyes_and_description: {title: "رنگ چشم و توصیف افراد"}
  en.a1.unit31.lesson03.dialogue_new_coworker: {title: "گفتگو: همکار جدید"}
