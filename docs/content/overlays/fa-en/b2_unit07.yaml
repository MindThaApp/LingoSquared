course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح پیشرفته‌تر (B2) برای فارسی‌زبان‌ها، با تمرکز روی روایت زمان، لحن، ایده‌های انتزاعی، مذاکره و ترکیب منابع."

units:
  en.b2.unit07.negotiation: {title: "به شرطی که محدودهٔ کار کمتر بشه"}

lessons:
  en.b2.unit07.lesson01_terms_and_concessions: {title: "بندهای توافق، رد کردن و امتیاز دادن"}
  en.b2.unit07.lesson02_conditional_terms: {title: "I can agree on condition that..."}
  en.b2.unit07.lesson03.reading_revised_terms: {title: "متن: روی چی توافق شد؟"}
  en.b2.unit07.lesson04.the_negotiation_dialogue: {title: "توافق، با شرط"}

teaching:
  en.b2.unit07.lesson01.teach.term: {title: "term", gloss: "بند یا شرط توافق", note: "term در مذاکره یعنی یک بخش مشخص از توافق، نه فقط «کلمه».", example_gloss: "یک term یک بخش از توافق است."}
  en.b2.unit07.lesson01.teach.proposal: {title: "proposal", gloss: "پیشنهاد", note: "proposal یعنی شرایط پیشنهادی برای توافق.", example_gloss: "یک proposal شرایط ممکن را پیشنهاد می‌کند."}
  en.b2.unit07.lesson01.teach.refusal: {title: "refusal", gloss: "رد کردن، نپذیرفتن", note: "refusal یعنی روشن بگین یک شرط قابل قبول نیست. در انگلیسی کاری بهتره مستقیم اما محترمانه باشه.", example_gloss: "refusal می‌گه یک شرط قابل قبول نیست."}
  en.b2.unit07.lesson01.teach.concession: {title: "concession", gloss: "امتیاز دادن، کوتاه آمدن مشروط", note: "concession یعنی بخشی از موضع خودتون را واگذار می‌کنین، معمولاً در برابر یک شرط.", example_gloss: "concession یعنی بخشی از موضع را رها کردن."}
  en.b2.unit07.lesson01.teach.scope: {title: "scope", gloss: "محدودهٔ کار", note: "scope یعنی چه مقدار کار داخل توافق است. در پروژه‌ها، scope زیاد یعنی کار بیشتر.", example_gloss: "scope مقدار کاریه که شامل می‌شه."}
  en.b2.unit07.lesson01.teach.condition: {title: "condition", gloss: "شرط", note: "condition چیزی است که باید برقرار شود تا توافق کار کند.", example_gloss: "condition باید برآورده بشه تا توافق جواب بده."}

  en.b2.unit07.lesson02.teach.condition_deadline: {title: "I can agree to the earlier deadline on condition that the scope is reduced.", gloss: "می‌تونم با مهلت زودتر موافقت کنم، به شرطی که محدودهٔ کار کمتر بشه.", note: "on condition that رسمی و روشنه. فارسی تعارف می‌تونه رد کردن را مبهم کنه، اما انگلیسی مذاکره‌ای شرط را دقیق می‌گه."}
  en.b2.unit07.lesson02.teach.cannot_agree: {title: "I cannot agree to Tuesday with the full scope.", gloss: "با سه‌شنبه و محدودهٔ کامل کار نمی‌تونم موافقت کنم.", note: "I cannot agree واضح اما محترمانه است. لازم نیست با تعارف طولانی آن را نرم کنین؛ دلیل بعدی کمک می‌کنه محترمانه بماند."}
  en.b2.unit07.lesson02.teach.accept_if: {title: "I can accept that if the full appendix follows next week.", gloss: "می‌تونم این را قبول کنم اگر پیوست کامل هفتهٔ بعد بیاد.", note: "I can accept that if... پذیرش مشروطه، نه موافقت بی‌قید."}
  en.b2.unit07.lesson02.teach.grammar_concession: {title: "رد روشن و امتیاز مشروط", gloss: "برای رد کردن روشن از I cannot agree استفاده کنین؛ برای امتیاز مشروط از I can agree on condition that استفاده کنین.", note: "در انگلیسی B2 مذاکره‌ای، نرم بودن یعنی شرط و دلیل را واضح بگین، نه اینکه جواب را مبهم کنین."}

  en.b2.unit07.lesson03.teach.executive_summary: {title: "executive summary", gloss: "خلاصهٔ مدیریتی", note: "executive summary بخش کوتاهی از گزارش است که نکات اصلی را می‌دهد.", example_gloss: "executive summary نکات اصلی گزارش رو می‌ده."}
  en.b2.unit07.lesson03.teach.charts: {title: "charts", gloss: "نمودارها", note: "charts اطلاعات را به شکل دیداری نشان می‌دن.", example_gloss: "charts اطلاعات را تصویری نشان می‌دن."}
  en.b2.unit07.lesson03.teach.reading_passage: {title: "متن: شرایط بازنگری‌شده", gloss: "پریا اول پنج‌شنبه را برای گزارش کامل پیشنهاد کرد. مارکوس مخالفت کرد چون مشتری چیزی زودتر لازم داشت. پریا سه‌شنبه را با محدودهٔ کامل رد کرد، چون کیفیت را به خطر می‌انداخت. بعد یک امتیاز مشروط داد: سه‌شنبه ممکن بود اگر محدودهٔ کار به خلاصهٔ مدیریتی و نمودارها کاهش پیدا می‌کرد. مارکوس آن شرط را پذیرفت، اما یک بند اضافه کرد: پیوست کامل باید هفتهٔ بعد بیاد. نتیجهٔ توافق این بود: سه‌شنبه برای خلاصه و نمودارها، و هفتهٔ بعد برای پیوست.", note: "به تفاوت refusal و concession دقت کنین: اول «نمی‌تونم قبول کنم»، بعد «می‌تونم قبول کنم به شرطی که...»."}

  en.b2.unit07.lesson04.teach.q_thursday: {title: "Priya", gloss: "اگر محدودهٔ کار طبق برنامه بمونه، می‌تونیم گزارش را تا پنج‌شنبه تحویل بدیم.", note: "if the scope stays as planned شرط پیشنهاد اولیه است."}
  en.b2.unit07.lesson04.teach.a_tuesday: {title: "Marcus", gloss: "پنج‌شنبه برای مشتری خیلی دیره. می‌تونین تا سه‌شنبه تحویل بدین؟", note: "Marcus فشار زمانی را روشن می‌گه."}
  en.b2.unit07.lesson04.teach.q_cannot_tuesday: {title: "Priya", gloss: "با سه‌شنبه و محدودهٔ کامل نمی‌تونم موافقت کنم. این کیفیت را به خطر می‌اندازه.", note: "رد کردن مستقیم با دلیل، در انگلیسی کاری محترمانه و قابل پیگیری است."}
  en.b2.unit07.lesson04.teach.a_what_possible: {title: "Marcus", gloss: "چی باعث می‌شه سه‌شنبه ممکن بشه؟", note: "این سؤال راه را برای concession باز می‌کنه."}
  en.b2.unit07.lesson04.teach.q_condition: {title: "Priya", gloss: "می‌تونم با موعد زودتر موافقت کنم، به شرطی که محدودهٔ کار به خلاصهٔ مدیریتی و نمودارها کاهش پیدا کنه.", note: "on condition that شرط دقیق امتیاز را معرفی می‌کنه."}
  en.b2.unit07.lesson04.teach.a_accept_appendix: {title: "Marcus", gloss: "می‌تونم این را قبول کنم اگر پیوست کامل هفتهٔ بعد بیاد.", note: "Marcus هم پذیرش را مشروط می‌کنه."}
  en.b2.unit07.lesson04.teach.q_agreed: {title: "Priya", gloss: "توافق شد. سه‌شنبه برای خلاصه و نمودارها، و هفتهٔ بعد برای پیوست.", note: "Agreed جمع‌بندی نهایی شرایط است."}

exercises:
  en.b2.unit07.lesson01.exercise01_choose_concession:
    instruction: "کدام کلمه یعنی در مذاکره بخشی از موضع خودتون را واگذار کنین؟"
    correct_option: "concession"
    distractors: ["refusal", "scope", "proposal"]
    accepted_answers: [{value: "concession", status: "correct"}]
    feedback: "concession یعنی امتیاز دادن یا کوتاه آمدن."
  en.b2.unit07.lesson01.exercise02_choose_scope:
    instruction: "کدام کلمه یعنی مقدار کاری که شامل توافق می‌شه؟"
    correct_option: "scope"
    distractors: ["term", "condition", "proposal"]
    accepted_answers: [{value: "scope", status: "correct"}]
    feedback: "scope یعنی محدودهٔ کار."
  en.b2.unit07.lesson01.exercise03_match_terms:
    instruction: "هر واژهٔ مذاکره را به معنی درستش وصل کنین."
    accepted_answers: [{value: [{left: "one part of an agreement", right: "term"}, {left: "suggested terms", right: "proposal"}, {left: "saying a term is not acceptable", right: "refusal"}, {left: "giving up part of a position", right: "concession"}, {left: "amount of work included", right: "scope"}, {left: "something that must be met", right: "condition"}], status: "correct"}]
    feedback: "term بند توافق است، proposal پیشنهاد، refusal رد کردن، concession امتیاز، scope محدوده، condition شرط."
  en.b2.unit07.lesson01.exercise04_write_refusal:
    instruction: "کلمه‌ای را بنویسین که یعنی گفتن اینکه یک شرط قابل قبول نیست."
    accepted_answers:
      - {value: "refusal", status: "correct"}
      - {value: "Refusal", status: "correct"}
    feedback: "refusal یعنی رد کردن."
  en.b2.unit07.lesson01.exercise05_write_proposal:
    instruction: "کلمه‌ای را بنویسین که یعنی شرایط پیشنهادی."
    accepted_answers:
      - {value: "proposal", status: "correct"}
      - {value: "Proposal", status: "correct"}
    feedback: "proposal یعنی پیشنهاد."

  en.b2.unit07.lesson02.exercise01_choose_refusal:
    instruction: "کدام جمله یک شرط غیرقابل قبول را روشن و محترمانه رد می‌کنه؟"
    correct_option: "I cannot agree to Tuesday with the full scope."
    distractors: ["I can agree to the earlier deadline on condition that the scope is reduced.", "I can accept that if the full appendix follows next week.", "Tuesday is possible if the scope is reduced."]
    accepted_answers: [{value: "I cannot agree to Tuesday with the full scope.", status: "correct"}]
    feedback: "I cannot agree... رد روشن است."
  en.b2.unit07.lesson02.exercise02_choose_condition:
    instruction: "کدام جمله با on condition that یک امتیاز مشروط پیشنهاد می‌کنه؟"
    correct_option: "I can agree to the earlier deadline on condition that the scope is reduced."
    distractors: ["I cannot agree to Tuesday with the full scope.", "That would risk the quality.", "The agreed outcome was Tuesday for the summary and charts."]
    accepted_answers: [{value: "I can agree to the earlier deadline on condition that the scope is reduced.", status: "correct"}]
    feedback: "on condition that شرط امتیاز را روشن می‌کنه."
  en.b2.unit07.lesson02.exercise03_order_condition:
    instruction: "کلمات را برای ساختن امتیاز مشروط مرتب کنین."
    accepted_answers: [{value: ["I", "can", "agree", "to", "the", "earlier", "deadline", "on", "condition", "that", "the", "scope", "is", "reduced"], status: "correct"}]
    feedback: "ترتیب درست: I can agree to the earlier deadline on condition that the scope is reduced."
  en.b2.unit07.lesson02.exercise04_reply_refusal:
    instruction: "این رد کردن را دقیق بنویسین: I cannot agree to Tuesday with the full scope."
    accepted_answers:
      - {value: "I cannot agree to Tuesday with the full scope.", status: "correct"}
      - {value: "I cannot agree to Tuesday with the full scope", status: "correct"}
      - {value: "I can't agree to Tuesday with the full scope.", status: "correct"}
      - {value: "I can't agree to Tuesday with the full scope", status: "correct"}
    feedback: "این جمله مستقیم است اما بی‌ادبانه نیست."
  en.b2.unit07.lesson02.exercise05_write_conditional:
    instruction: "این امتیاز مشروط را دقیق بنویسین: I can agree to the earlier deadline on condition that the scope is reduced."
    accepted_answers:
      - {value: "I can agree to the earlier deadline on condition that the scope is reduced.", status: "correct"}
      - {value: "I can agree to the earlier deadline on condition that the scope is reduced", status: "correct"}
    feedback: "شرط باید با on condition that روشن بماند."

  en.b2.unit07.lesson03.exercise01_choose_refused_term:
    instruction: "پریا کدام شرط را رد کرد؟"
    correct_option: "Tuesday with the full scope"
    distractors: ["Thursday for the full report", "Tuesday for the summary and charts", "next week for the appendix"]
    accepted_answers: [{value: "Tuesday with the full scope", status: "correct"}]
    feedback: "او سه‌شنبه را فقط با scope کامل رد کرد."
  en.b2.unit07.lesson03.exercise02_choose_agreed_outcome:
    instruction: "کدام نتیجه مورد توافق قرار گرفت؟"
    correct_option: "Tuesday for the summary and charts, and next week for the appendix"
    distractors: ["Thursday for the full report", "Tuesday with the full scope", "next week for the summary and charts"]
    accepted_answers: [{value: "Tuesday for the summary and charts, and next week for the appendix", status: "correct"}]
    feedback: "توافق نهایی scope را تقسیم کرد."
  en.b2.unit07.lesson03.exercise03_match_negotiation_roles:
    instruction: "هر نقش مذاکره را به بخش درست از متن وصل کنین."
    accepted_answers: [{value: [{left: "Priya's first proposal", right: "Thursday for the full report"}, {left: "Marcus's requested deadline", right: "Tuesday"}, {left: "Priya's refusal", right: "not Tuesday with the full scope"}, {left: "Priya's condition", right: "scope reduced to the summary and charts"}, {left: "Marcus's added term", right: "the appendix follows next week"}, {left: "final agreement", right: "Tuesday for the summary and charts"}], status: "correct"}]
    feedback: "پیشنهاد، رد، شرط اضافه و توافق نهایی را جدا کنین."
  en.b2.unit07.lesson03.exercise04_write_agreed_outcome:
    instruction: "دقیق بنویسین: The agreed outcome was Tuesday for the summary and charts, and next week for the appendix."
    accepted_answers:
      - {value: "The agreed outcome was Tuesday for the summary and charts, and next week for the appendix.", status: "correct"}
      - {value: "The agreed outcome was Tuesday for the summary and charts and next week for the appendix.", status: "correct"}
    feedback: "agreed outcome یعنی نتیجهٔ نهایی توافق."
  en.b2.unit07.lesson03.exercise05_write_open_condition:
    instruction: "دقیق بنویسین: Tuesday is possible if the scope is reduced to the executive summary and the charts."
    accepted_answers:
      - {value: "Tuesday is possible if the scope is reduced to the executive summary and the charts.", status: "correct"}
      - {value: "Tuesday is possible if the scope is reduced to the executive summary and the charts", status: "correct"}
    feedback: "possible if یعنی امکان فقط با شرط کاهش scope وجود داره."

  en.b2.unit07.lesson04.exercise01_choose_refusal:
    instruction: "کدام جمله رد کردن پریاست؟"
    correct_option: "I cannot agree to Tuesday with the full scope."
    distractors: ["I can agree to the earlier deadline on condition that the scope is reduced.", "I can accept that if the full appendix follows next week.", "Agreed. Tuesday for the summary and charts."]
    accepted_answers: [{value: "I cannot agree to Tuesday with the full scope.", status: "correct"}]
    feedback: "این جمله شرط غیرقابل قبول را رد می‌کنه."
  en.b2.unit07.lesson04.exercise02_listen_condition:
    instruction: "گوش کنین و شرطی را انتخاب کنین که سه‌شنبه را ممکن می‌کنه."
    correct_option: "the scope is reduced to the executive summary and the charts"
    distractors: ["the full appendix follows next week", "the client waits until Thursday", "the quality risk is ignored"]
    accepted_answers: [{value: "the scope is reduced to the executive summary and the charts", status: "correct"}]
    feedback: "شرط پریا کاهش scope به summary و charts است."
  en.b2.unit07.lesson04.exercise03_order_agreed:
    instruction: "کلمات را برای جمع‌بندی توافق مرتب کنین."
    accepted_answers: [{value: ["Tuesday", "for", "the", "summary", "and", "charts", "and", "next", "week", "for", "the", "appendix"], status: "correct"}]
    feedback: "ترتیب درست: Tuesday for the summary and charts and next week for the appendix."
  en.b2.unit07.lesson04.exercise04_reply_as_priya:
    instruction: "با رد کردن پریا و دلیلش جواب بدین: I cannot agree to Tuesday with the full scope. That would risk the quality."
    accepted_answers:
      - {value: "I cannot agree to Tuesday with the full scope. That would risk the quality.", status: "correct"}
      - {value: "I can't agree to Tuesday with the full scope. That would risk the quality.", status: "correct"}
    feedback: "رد روشن همراه با دلیل، مذاکره را جلو می‌بره."
  en.b2.unit07.lesson04.exercise05_speak_negotiate:
    instruction: "با صدای بلند مذاکره کنین: سه‌شنبه با محدودهٔ کامل را رد کنین، امتیاز مشروط بدین، و توافق نهایی را بگین."
    accepted_answers:
      - {value: "I cannot agree to Tuesday with the full scope. I can agree to the earlier deadline on condition that the scope is reduced to the executive summary and the charts. Agreed: Tuesday for the summary and charts, and next week for the appendix.", status: "correct"}
    feedback: "سه بخش لازم‌اند: رد کردن، امتیاز مشروط، و توافق نهایی."
  en.b2.unit07.lesson04.exercise06_write_negotiation_reply:
    instruction: "این پاسخ کامل مذاکره را بنویسین: I cannot agree to Tuesday with the full scope. I can agree to the earlier deadline on condition that the scope is reduced to the executive summary and the charts. Agreed: Tuesday for the summary and charts, and next week for the appendix."
    accepted_answers:
      - {value: "I cannot agree to Tuesday with the full scope. I can agree to the earlier deadline on condition that the scope is reduced to the executive summary and the charts. Agreed: Tuesday for the summary and charts, and next week for the appendix.", status: "correct"}
      - {value: "I can't agree to Tuesday with the full scope. I can agree to the earlier deadline on condition that the scope is reduced to the executive summary and the charts. Agreed: Tuesday for the summary and charts, and next week for the appendix.", status: "correct"}
    feedback: "شرط‌ها باید دقیق بمانند تا توافق مبهم نشه."
