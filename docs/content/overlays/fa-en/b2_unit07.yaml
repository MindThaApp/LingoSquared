course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح پیشرفته‌تر (B2) برای فارسی‌زبان‌ها، با تمرکز روی روایت زمان، لحن، ایده‌های انتزاعی، مذاکره و ترکیب منابع."

units:
  en.b2.unit07.negotiation: {title: "به شرطی که محدودهٔ کار کمتر بشه"}

lessons:
  en.b2.unit07.lesson01_terms_and_concessions: {title: "بندهای توافق، رد کردن و امتیاز دادن"}
  en.b2.unit07.lesson02_conditional_terms: {title: "I can agree on condition that..."}
  en.b2.unit07.lesson03.reading_revised_terms: {title: "متن: روی چی توافق شد؟"}
  en.b2.unit07.lesson04.the_negotiation_dialogue: {title: "توافق، با شرط"}

teaching:
  en.b2.unit07.lesson01.teach.term: {title: "term", gloss: "بند یا شرط توافق", note: "term در مذاکره یعنی یک بخش مشخص از توافق، نه فقط «کلمه».", example_gloss: "یک term یک بخش از توافقه."}
  en.b2.unit07.lesson01.teach.proposal: {title: "proposal", gloss: "پیشنهاد", note: "proposal یعنی شرایط پیشنهادی برای توافق.", example_gloss: "یک proposal شرایط ممکن رو پیشنهاد می‌کنه."}
  en.b2.unit07.lesson01.teach.refusal: {title: "refusal", gloss: "رد کردن، نپذیرفتن", note: "refusal یعنی روشن بگین یک شرط قابل قبول نیست. در انگلیسی کاری بهتره مستقیم اما محترمانه باشه.", example_gloss: "refusal می‌گه یک شرط قابل قبول نیست."}
  en.b2.unit07.lesson01.teach.concession: {title: "concession", gloss: "امتیاز دادن، کوتاه آمدن مشروط", note: "concession یعنی بخشی از موضع خودتون رو واگذار می‌کنین، معمولاً در برابر یک شرط.", example_gloss: "concession یعنی بخشی از موضع رو رها کردن."}
  en.b2.unit07.lesson01.teach.scope: {title: "scope", gloss: "محدودهٔ کار", note: "scope یعنی چه مقدار کار داخل توافقه. در پروژه‌ها، scope زیاد یعنی کار بیشتر.", example_gloss: "scope مقدار کاریه که شامل می‌شه."}
  en.b2.unit07.lesson01.teach.condition: {title: "condition", gloss: "شرط", note: "condition چیزیه که باید برقرار بشه تا توافق کار کنه.", example_gloss: "condition باید برآورده بشه تا توافق جواب بده."}

  en.b2.unit07.lesson02.teach.condition_deadline: {title: "I can agree to the earlier deadline on condition that the scope is reduced.", gloss: "می‌تونم با مهلت زودتر موافقت کنم، به شرطی که محدودهٔ کار کمتر بشه.", note: "on condition that رسمی و روشنه. فارسی تعارف می‌تونه رد کردن رو مبهم کنه، اما انگلیسی مذاکره‌ای شرط رو دقیق می‌گه."}
  en.b2.unit07.lesson02.teach.cannot_agree: {title: "I cannot agree to Tuesday with the full scope.", gloss: "با سه‌شنبه و محدودهٔ کامل کار نمی‌تونم موافقت کنم.", note: "I cannot agree واضح اما محترمانه‌ست. لازم نیست با تعارف طولانی اون رو نرم کنین؛ دلیل بعدی کمک می‌کنه محترمانه بمونه."}
  en.b2.unit07.lesson02.teach.accept_if: {title: "I can accept that if the full appendix follows next week.", gloss: "می‌تونم این رو قبول کنم اگر پیوست کامل هفتهٔ بعد بیاد.", note: "I can accept that if... پذیرش مشروطه، نه موافقت بی‌قید."}
  en.b2.unit07.lesson02.teach.grammar_concession: {title: "رد روشن و امتیاز مشروط", gloss: "برای رد کردن روشن از I cannot agree استفاده کنین؛ برای امتیاز مشروط از I can agree on condition that استفاده کنین.", note: "در انگلیسی مذاکره‌ای، نرم بودن یعنی شرط و دلیل رو واضح بگین، نه اینکه جواب رو مبهم کنین."}

  en.b2.unit07.lesson03.teach.executive_summary: {title: "executive summary", gloss: "خلاصهٔ مدیریتی", note: "executive summary بخش کوتاهی از گزارشه که نکات اصلی رو می‌ده.", example_gloss: "executive summary نکات اصلی گزارش رو می‌ده."}
  en.b2.unit07.lesson03.teach.charts: {title: "charts", gloss: "نمودارها", note: "charts اطلاعات رو به شکل دیداری نشون می‌دن.", example_gloss: "charts اطلاعات رو تصویری نشون می‌دن."}
  en.b2.unit07.lesson03.teach.reading_passage: {title: "متن: شرایط بازنگری‌شده", gloss: "پریا اول پنج‌شنبه رو برای گزارش کامل پیشنهاد کرد. مارکوس مخالفت کرد چون مشتری چیزی زودتر لازم داشت. پریا سه‌شنبه رو با محدودهٔ کامل رد کرد، چون کیفیت رو به خطر می‌انداخت. بعد یک امتیاز مشروط داد: سه‌شنبه ممکن بود اگر محدودهٔ کار به خلاصهٔ مدیریتی و نمودارها کاهش پیدا می‌کرد. مارکوس اون شرط رو پذیرفت، اما یک بند اضافه کرد: پیوست کامل باید هفتهٔ بعد بیاد. نتیجهٔ توافق این بود: سه‌شنبه برای خلاصه و نمودارها، و هفتهٔ بعد برای پیوست.", note: "به تفاوت refusal و concession دقت کنین: اول «نمی‌تونم قبول کنم»، بعد «می‌تونم قبول کنم به شرطی که...»."}

  en.b2.unit07.lesson04.teach.q_thursday: {title: "Priya", gloss: "اگر محدودهٔ کار طبق برنامه بمونه، می‌تونیم گزارش رو تا پنج‌شنبه تحویل بدیم.", note: "if the scope stays as planned شرط پیشنهاد اولیه‌ست."}
  en.b2.unit07.lesson04.teach.a_tuesday: {title: "Marcus", gloss: "پنج‌شنبه برای مشتری خیلی دیره. می‌تونین تا سه‌شنبه تحویل بدین؟", note: "Marcus فشار زمانی رو روشن می‌گه."}
  en.b2.unit07.lesson04.teach.q_cannot_tuesday: {title: "Priya", gloss: "با سه‌شنبه و محدودهٔ کامل نمی‌تونم موافقت کنم. این کیفیت رو به خطر می‌اندازه.", note: "رد کردن مستقیم با دلیل، در انگلیسی کاری محترمانه و قابل پیگیریه."}
  en.b2.unit07.lesson04.teach.a_what_possible: {title: "Marcus", gloss: "چی باعث می‌شه سه‌شنبه ممکن بشه؟", note: "این سؤال راه رو برای concession باز می‌کنه."}
  en.b2.unit07.lesson04.teach.q_condition: {title: "Priya", gloss: "می‌تونم با مهلت زودتر موافقت کنم، به شرطی که محدودهٔ کار به خلاصهٔ مدیریتی و نمودارها کاهش پیدا کنه.", note: "on condition that شرط دقیق امتیاز رو معرفی می‌کنه."}
  en.b2.unit07.lesson04.teach.a_accept_appendix: {title: "Marcus", gloss: "می‌تونم این رو قبول کنم اگر پیوست کامل هفتهٔ بعد بیاد.", note: "Marcus هم پذیرش رو مشروط می‌کنه."}
  en.b2.unit07.lesson04.teach.q_agreed: {title: "Priya", gloss: "توافق شد. سه‌شنبه برای خلاصه و نمودارها، و هفتهٔ بعد برای پیوست.", note: "Agreed جمع‌بندی نهایی شرایطه."}

