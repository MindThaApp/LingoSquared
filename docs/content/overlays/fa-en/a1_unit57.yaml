review: {status: "reviewed", required_next_reviewer: null, notes: "New overlay against the shared English realization unit57 (going to the cinema), the final unit in this dispatch's 49-57 range. Authored fully at schema_version 1.1, every kind: vocabulary teaching card has a matching example_gloss:. Contrastive-grammar points for this unit: (1) 'What time does the film start?' -- English needs dummy-auxiliary do-support to question a plain present-tense main verb (does...start), while Farsi questions the same fact with no auxiliary verb at all, just rising intonation/a question word (فیلم کِی شروع می‌شه؟) -- flagged on that phrase card, the same do-support pattern already flagged for unit55's 'Do I need...?' but worth re-flagging here since it's a genuinely recurring, high-value error source across many English questions. (2) inflected 'watched' vs. base 'watch' -- Farsi verbs don't have a separate simple-past SUFFIX the way English -ed marks it; the reading passage and its own writing_prompt both need the inflected form watched (not the dialogue's base form watch), so the note on the reading card flags that English marks past tense by changing the verb's own ending, a form Farsi expresses by changing the verb's whole stem/ending pattern rather than adding one consistent suffix. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, not translated Farsi lefts, per the established fa-en convention. Every listen_select/multiple_choice distractor in lesson03/lesson04 is an invented value never stated elsewhere in this unit EXCEPT lesson04's schedule-reading exercises, which deliberately reuse the schedule card's own OTHER listed films/showtimes/prices as distractors (The Great Race 5:00 $10, Funny Family 9:00 $6) since a schedule-reading check is supposed to test the whole schedule, matching the realization's own review notes and the same precedent unit56 set for its menu card; every OTHER distractor was checked against the dialogue's own lines (Daniel: 4 lines; Cashier: 4 lines; Leila: 2 lines) to confirm none reuses a fact the tested speaker states elsewhere in the same audio. Strong sibling-isolation rule applied -- nl-en/prs-en overlays and the concurrent units 39-48 dispatch were not consulted. Needs the mandatory fresh-context review before shipping, and inherits the underlying realization's own still-unreviewed status. This overlay completes the 49-57 dispatch range assigned to this session; units 39-48 were a separate, concurrent dispatch.\n\nfa-en review 2026-10-19: checked notes, glosses, Persian style, distractors, accepted answers, canon and sequencing. 12 fixes: false past-tense note (Persian does not change the whole root; English has irregulars) rewritten; showtime glossed سانس/ساعت نمایش (زمان اکران is release period); What time = ساعت چند; calqued 'I can't wait' and popcorn-request glosses made natural; تنقلات wording; untaught distractors eighteen/twenty-four replaced; added answer variants. Native flag: evening as شب."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit57.cinema: {title: "رفتن به سینما"}

lessons:
  en.a1.unit57.lesson01.cinema_vocabulary: {title: "کلمات سینما"}
  en.a1.unit57.lesson02.phrases_for_the_cinema: {title: "عبارت‌های سینما"}
  en.a1.unit57.lesson03.dialogue_at_the_cinema: {title: "گفتگو: در سینما"}
  en.a1.unit57.lesson04.an_evening_at_the_cinema: {title: "متن: یک شب در سینما"}

teaching:
  en.a1.unit57.lesson01.teach.cinema: {title: "cinema", gloss: "سینما", note: "*cinema* یعنی جایی که مردم برای دیدن فیلم می‌رن.", example_gloss: "این سینما خیلی محبوبه."}
  en.a1.unit57.lesson01.teach.ticket: {title: "ticket", gloss: "بلیت", note: "*ticket* یعنی کارتی که برای ورود به سالن سینما می‌خرین.", example_gloss: "باید یه بلیت بخرم."}
  en.a1.unit57.lesson01.teach.showtime: {title: "showtime", gloss: "ساعت نمایش / سانس", note: "*showtime* یعنی زمانی که فیلم شروع می‌شه.", example_gloss: "سانس این فیلم ساعت چنده؟"}
  en.a1.unit57.lesson01.teach.seat: {title: "seat", gloss: "صندلی", note: "*seat* یعنی جایی که برای دیدن فیلم می‌شینین.", example_gloss: "این صندلی خالیه؟"}
  en.a1.unit57.lesson01.teach.screen: {title: "screen", gloss: "پرده / صفحهٔ نمایش", note: "*screen* یعنی صفحهٔ صاف و بزرگی که فیلم روش دیده می‌شه.", example_gloss: "پرده خیلی بزرگه."}
  en.a1.unit57.lesson01.teach.popcorn: {title: "popcorn", gloss: "پاپ‌کورن", note: "*popcorn* یعنی خوراکی‌ای که خیلی‌ها موقع تماشای فیلم می‌خورن.", example_gloss: "ما همیشه تو سینما پاپ‌کورن می‌خریم."}

  en.a1.unit57.lesson02.teach.what_time_does_the_film_start: {title: "What time does the film start?", gloss: "فیلم ساعت چند شروع می‌شه؟", note: "انگلیسی برای این سؤال از فعل کمکی *does* استفاده می‌کنه (does...start)، چون این یه فعل ساده و اصلیه؛ فارسی هیچ فعل کمکی‌ای لازم نداره، فقط با لحن سؤالی یا کلمهٔ پرسشی مثل «ساعت چند» سؤال می‌سازه."}
  en.a1.unit57.lesson02.teach.two_tickets_for_the_seven_oclock_show: {title: "Two tickets for the seven o'clock show, please.", gloss: "دو تا بلیت برای سانس ساعت هفت، لطفاً."}
  en.a1.unit57.lesson02.teach.can_i_have_some_popcorn: {title: "Can I have some popcorn, please?", gloss: "می‌شه یه‌کم پاپ‌کورن بگیرم، لطفاً؟"}
  en.a1.unit57.lesson02.teach.how_much_is_that_in_total: {title: "How much is that in total?", gloss: "روی‌هم‌رفته چقدر می‌شه؟"}
  en.a1.unit57.lesson02.teach.thats_twenty_dollars: {title: "That's twenty dollars, please.", gloss: "بیست دلار می‌شه، لطفاً."}
  en.a1.unit57.lesson02.teach.i_really_liked_it: {title: "I really liked it!", gloss: "خیلی ازش خوشم اومد!"}

  en.a1.unit57.lesson03.teach.dialogue_line1: {title: "سؤال دنیل", gloss: "دنیل می‌گه: سلام! فیلم ساعت چند شروع می‌شه؟"}
  en.a1.unit57.lesson03.teach.dialogue_line2: {title: "سانس بعدی", gloss: "صندوق‌دار می‌گه: سانس بعدی ساعت هفته."}
  en.a1.unit57.lesson03.teach.dialogue_line3: {title: "درخواست بلیت", gloss: "دنیل می‌گه: عالیه. می‌شه دو تا بلیت بدین، لطفاً؟"}
  en.a1.unit57.lesson03.teach.dialogue_line4: {title: "قیمت بلیت‌ها", gloss: "صندوق‌دار می‌گه: البته. شونزده دلار می‌شه."}
  en.a1.unit57.lesson03.teach.dialogue_line5: {title: "درخواست پاپ‌کورن", gloss: "لیلا می‌گه: می‌شه یه‌کم پاپ‌کورن بدین، لطفاً؟"}
  en.a1.unit57.lesson03.teach.dialogue_line6: {title: "قیمت پاپ‌کورن", gloss: "صندوق‌دار می‌گه: حتماً. پاپ‌کورن چهار دلاره."}
  en.a1.unit57.lesson03.teach.dialogue_line7: {title: "سؤال دنیل دربارهٔ کل قیمت", gloss: "دنیل می‌گه: روی‌هم‌رفته چقدر می‌شه؟"}
  en.a1.unit57.lesson03.teach.dialogue_line8: {title: "کل قیمت", gloss: "صندوق‌دار می‌گه: بیست دلار می‌شه، لطفاً."}
  en.a1.unit57.lesson03.teach.dialogue_line9: {title: "تشکر لیلا", gloss: "لیلا می‌گه: ممنون! خیلی مشتاقم ببینمش."}

  en.a1.unit57.lesson04.teach.cinema_schedule: {title: "برنامهٔ سینما", gloss: "برنامهٔ سینما: Star Journey - ساعت ۷:۰۰، ۸ دلار. The Great Race - ساعت ۵:۰۰، ۱۰ دلار. Funny Family - ساعت ۹:۰۰، ۶ دلار."}
  en.a1.unit57.lesson04.teach.reading_passage: {title: "متن: یک شب در سینما", gloss: "یه شب، دنیل و لیلا تصمیم گرفتن تو سینما یه فیلم ببینن. اونا پرسیدن فیلم ساعت چند شروع می‌شه، و صندوق‌دار گفت سانس بعدی، Star Journey، ساعت هفته. اونا دو تا بلیت به قیمت شونزده دلار و یه پاکت پاپ‌کورن به قیمت چهار دلار خریدن. روی‌هم‌رفته بیست دلار شد. اونا با هم فیلم رو تماشا کردن، و دربارهٔ فضانوردا بود. خیلی هم بامزه بود. وقتی تموم شد، لیلا گفت خیلی ازش خوشش اومد، و دنیل گفت می‌خواد قسمت بعدیش رو هم ببینه.", note: "*watched* شکل گذشتهٔ *watch* هست. خیلی از فعل‌های انگلیسی گذشته رو با پسوند *-ed* می‌سازن (watch → watched، ask → asked)، ولی بعضی‌ها بی‌قاعده‌ان، مثل *buy → bought* و *say → said* تو همین متن. فارسی گذشته رو با بن ماضی و شناسه می‌سازه (تماشا کردم، تماشا کردن) و شکل فعل با فاعل عوض می‌شه، ولی گذشتهٔ سادهٔ انگلیسی برای همهٔ فاعل‌ها یکیه (I/he/they watched)."}

