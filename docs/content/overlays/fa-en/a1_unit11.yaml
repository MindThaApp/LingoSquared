exercises:
  en.a1.unit11.lesson01.exercise01.listen_condition:
    instruction: "گوش کنید و واژهٔ گفته‌شده را انتخاب کنید."
    correct_option: "ابری"
    distractors: ["آفتابی", "بارانی", "بادی"]
    accepted_answers: [{value: "ابری", status: "correct"}]
    feedback: "cloudy یعنی ابری."
  en.a1.unit11.lesson01.exercise02.choose_hot:
    instruction: "خلاف سرد چیست؟"
    correct_option: "hot"
    distractors: ["cold", "rainy", "windy"]
    accepted_answers: [{value: "hot", status: "correct"}]
    feedback: "hot (گرم) خلاف cold (سرد) است."
  en.a1.unit11.lesson01.exercise03.choose_rainy:
    instruction: "کدام واژه هوایی با باران زیاد را توصیف می‌کند؟"
    correct_option: "rainy"
    distractors: ["sunny", "cloudy", "windy"]
    accepted_answers: [{value: "rainy", status: "correct"}]
    feedback: "rainy یعنی بارانی."
  en.a1.unit11.lesson01.exercise04.match_weather_words:
    instruction: "هر توضیح را به واژهٔ انگلیسی درست وصل کنید."
    accepted_answers: [{value: [{left: "clear sky, lots of sun", right: "sunny"}, {left: "a lot of rain", right: "rainy"}, {left: "low temperature", right: "cold"}, {left: "strong moving air", right: "windy"}], status: "correct"}]
    feedback: "sunny=آفتابی، rainy=بارانی، cold=سرد، windy=بادی."
  en.a1.unit11.lesson01.exercise05.write_cloudy:
    instruction: "واژهٔ انگلیسی برای آسمان پر از ابر را بنویسید."
    accepted_answers:
      - {value: "cloudy", status: "correct"}
      - {value: "Cloudy", status: "correct"}
    feedback: "cloudy یعنی ابری."

  en.a1.unit11.lesson02.exercise01.listen_weather_question:
    instruction: "گوش کنید و مشخص کنید چه چیزی پرسیده می‌شود."
    correct_option: "آب‌وهوای امروز"
    distractors: ["تاریخ امروز", "ساعت الان", "قیمت یک چیز"]
    accepted_answers: [{value: "آب‌وهوای امروز", status: "correct"}]
    feedback: "What's the weather like today؟ دربارهٔ آب‌وهوای امروز می‌پرسد."
  en.a1.unit11.lesson02.exercise02.choose_weather_answer:
    instruction: "پاسخ درست به سوال آب‌وهوای امروز را انتخاب کنید."
    correct_option: "It's sunny and warm."
    distractors: ["It's raining.", "It's cold.", "It's windy."]
    accepted_answers: [{value: "It's sunny and warm.", status: "correct"}]
    feedback: "It's sunny and warm یعنی «آفتابیه و گرمه»."
  en.a1.unit11.lesson02.exercise03.order_its_raining:
    instruction: "واژه‌ها را برای گفتن «داره بارون میاد» مرتب کنید."
    accepted_answers: [{value: ["It's", "raining"], status: "correct"}]
    feedback: "ترتیب درست It's raining است."
  en.a1.unit11.lesson02.exercise04.reply_umbrella:
    instruction: "به این سوال پاسخ دهید که هوا بارانی است و باید چتر برداشت."
    accepted_answers:
      - {value: "It's raining. You should take an umbrella.", status: "correct"}
      - {value: "It's raining, and you should take an umbrella.", status: "correct"}
    feedback: "پاسخ کامل هم شرایط هوا و هم توصیه را بیان می‌کند."
  en.a1.unit11.lesson02.exercise05.write_weather:
    instruction: "بنویسید امروز آفتابی و گرم است."
    accepted_answers:
      - {value: "It's sunny and warm.", status: "correct"}
      - {value: "It's sunny and warm", status: "correct"}
    feedback: "It's sunny and warm یعنی «آفتابیه و گرمه»."

  en.a1.unit11.lesson03.exercise01.read_tomorrow_weather:
    instruction: "پیش‌بینی را بخوانید و آب‌وهوای فردا را بگویید."
    correct_option: "آفتابی و گرم"
    distractors: ["بارانی", "ابری", "سرد"]
    accepted_answers: [{value: "آفتابی و گرم", status: "correct"}]
    feedback: "متن می‌گوید Tomorrow will be sunny and warm."
  en.a1.unit11.lesson03.exercise02.read_rain_day:
    instruction: "پیش‌بینی را بخوانید و روزی که بارون می‌بارد را بگویید."
    correct_option: "شنبه"
    distractors: ["یکشنبه", "جمعه", "فردا"]
    accepted_answers: [{value: "شنبه", status: "correct"}]
    feedback: "متن می‌گوید It will rain on Saturday."
  en.a1.unit11.lesson03.exercise03.choose_umbrella_day:
    instruction: "طبق پیش‌بینی، کدام روز باید چتر برداشت؟"
    correct_option: "Saturday"
    distractors: ["Sunday", "Friday", "today"]
    accepted_answers: [{value: "Saturday", status: "correct"}]
    feedback: "چون طبق پیش‌بینی شنبه بارون می‌بارد، چتر لازم است."
  en.a1.unit11.lesson03.exercise04.order_forecast_sentence:
    instruction: "واژه‌ها را برای گفتن «شنبه بارون می‌بارد» مرتب کنید."
    accepted_answers: [{value: ["It", "will", "rain", "on", "Saturday"], status: "correct"}]
    feedback: "ترتیب درست It will rain on Saturday است."
  en.a1.unit11.lesson03.exercise05.write_forecast:
    instruction: "بنویسید فردا آفتابی و گرم خواهد بود."
    accepted_answers:
      - {value: "Tomorrow will be sunny and warm.", status: "correct"}
      - {value: "Tomorrow will be sunny and warm", status: "correct"}
    feedback: "Tomorrow will be sunny and warm یعنی «فردا آفتابی و گرم خواهد بود»."

  en.a1.unit11.lesson04.exercise01.listen_todays_weather:
    instruction: "گفت‌وگو را گوش کنید و مشخص کنید آب‌وهوای امروز چطور است."
    correct_option: "آفتابی و گرم"
    distractors: ["بارانی و سرد", "ابری و بادی", "سرد و بادی"]
    accepted_answers: [{value: "آفتابی و گرم", status: "correct"}]
    feedback: "دنیل می‌گوید It's sunny and warm."
  en.a1.unit11.lesson04.exercise02.listen_tomorrow_weather:
    instruction: "گوش کنید و مشخص کنید فردا چه اتفاقی می‌افتد."
    correct_option: "بارون می‌بارد"
    distractors: ["آفتابی می‌شود", "بادی می‌شود", "ابری می‌شود"]
    accepted_answers: [{value: "بارون می‌بارد", status: "correct"}]
    feedback: "دنیل می‌گوید it's going to rain tomorrow."
  en.a1.unit11.lesson04.exercise03.choose_reason_go_today:
    instruction: "چرا آن‌ها تصمیم می‌گیرند امروز به‌جای فردا به پارک بروند؟"
    correct_option: "it's going to rain tomorrow"
    distractors: ["today is sunny", "the park is closed tomorrow", "Leila is busy tomorrow"]
    accepted_answers: [{value: "it's going to rain tomorrow", status: "correct"}]
    feedback: "چون فردا بارون می‌بارد، بهتر است امروز بروند."
  en.a1.unit11.lesson04.exercise04.order_suggest_park:
    instruction: "واژه‌ها را برای پیشنهاد رفتن به پارک مرتب کنید."
    accepted_answers: [{value: ["let's", "go", "to", "the", "park"], status: "correct"}]
    feedback: "ترتیب درست let's go to the park است."
  en.a1.unit11.lesson04.exercise05.reply_as_daniel:
    instruction: "در نقش دنیل، دربارهٔ آب‌وهوای امروز و فردا پاسخ دهید."
    accepted_answers:
      - {value: "It's sunny and warm. Good idea. But it's going to rain tomorrow, so let's go today.", status: "correct"}
    feedback: "پاسخ کامل هم آب‌وهوای امروز و هم دلیل رفتن امروز را بیان می‌کند."
  en.a1.unit11.lesson04.exercise06.speak_weather_plan:
    instruction: "در نقش دنیل، با صدای بلند دربارهٔ آب‌وهوا پاسخ دهید."
    accepted_answers:
      - {value: "It's sunny and warm. Good idea. But it's going to rain tomorrow, so let's go today.", status: "correct"}
    feedback: "پاسخ کامل آب‌وهوای امروز و دلیل عجله برای رفتن امروز را پوشش می‌دهد."
