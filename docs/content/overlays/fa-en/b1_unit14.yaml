course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح میانی (B1) برای فارسی‌زبان‌ها، با تمرکز بر شرط، توالی رویدادها، نقل قول غیرمستقیم، هدف و فرض‌های غیرواقعی."

units:
  en.b1.unit14.professional_communication: {title: "Would it be possible to..."}

lessons:
  en.b1.unit14.lesson01.professional_communication_vocabulary: {title: "درخواست مؤدبانه توی محیط کار"}
  en.b1.unit14.lesson02.softened_requests: {title: "Would it be possible to جلسه رو عوض کنیم؟"}
  en.b1.unit14.lesson03.reading_a_message_before_the_meeting: {title: "متن: پیامی قبل از جلسه"}
  en.b1.unit14.lesson04.the_meeting_dialogue: {title: "Could we possibly این رو کوتاه نگه داریم؟"}

teaching:
  en.b1.unit14.lesson01.teach.would_it_be_possible_to: {title: "would it be possible to", gloss: "ممکنه ...؟ (درخواست خیلی مؤدبانه)", note: "would it be possible to برای پرسیدن مؤدبانه که آیا کاری اصلاً امکان‌پذیره استفاده می‌شه.", example_gloss: "ممکنه جلسه رو به پنج‌شنبه منتقل کنیم؟"}
  en.b1.unit14.lesson01.teach.i_was_wondering_if: {title: "I was wondering if", gloss: "داشتم فکر می‌کردم که ...", note: "I was wondering if یه درخواست رو غیرمستقیم و مؤدبانه معرفی می‌کنه.", example_gloss: "داشتم فکر می‌کردم که ممکنه امروز گزارشم رو بررسی کنی."}
  en.b1.unit14.lesson01.teach.could_we_possibly: {title: "could we possibly", gloss: "می‌شه ما ...؟ (درخواست مشترک)", note: "could we possibly یه درخواست مؤدبانه برای کاری که با هم انجام می‌دین رو مطرح می‌کنه.", example_gloss: "می‌شه جلسه رو پنج دقیقه دیرتر شروع کنیم؟"}
  en.b1.unit14.lesson01.teach.i_would_appreciate_it_if: {title: "I would appreciate it if", gloss: "ممنون می‌شم اگه ...", note: "I would appreciate it if می‌گه از کاری که کسی انجام بده، سپاسگزار می‌شین.", example_gloss: "ممنون می‌شم اگه یادداشت‌ها رو زودتر بفرستی."}
  en.b1.unit14.lesson01.teach.agenda: {title: "agenda", gloss: "دستور جلسه", note: "agenda یعنی لیست موضوعاتی که قراره توی جلسه دربارشون صحبت بشه.", example_gloss: "دنیل یه مورد دیگه به دستور جلسه اضافه کرد."}
  en.b1.unit14.lesson01.teach.follow_up: {title: "follow up", gloss: "پیگیری کردن", note: "follow up یعنی بعد از یه جلسه یا کار، دوباره با کسی تماس بگیرین.", example_gloss: "میا بعد از جلسه با ایمیل پیگیری می‌کنه."}

  en.b1.unit14.lesson02.teach.move_meeting_thursday: {title: "Would it be possible to move the meeting to Thursday?", gloss: "ممکنه جلسه رو به پنج‌شنبه منتقل کنیم؟", note: "*would it be possible to* + فعل ساده یه درخواست خیلی مؤدبانه‌ست."}
  en.b1.unit14.lesson02.teach.review_report_today: {title: "I was wondering if you could review my report today.", gloss: "داشتم فکر می‌کردم که ممکنه امروز گزارشم رو بررسی کنی.", note: "*I was wondering if* + you could یه درخواست غیرمستقیمه."}
  en.b1.unit14.lesson02.teach.grammar_softened_requests: {title: "درخواست‌های مؤدبانه با فرم شرطی نرم", gloss: "ممکنه جلسه رو به پنج‌شنبه منتقل کنیم؟ داشتم فکر می‌کردم که ممکنه گزارشم رو بررسی کنی.", note: "توی درخواست‌های رسمی محیط کار، به‌جای دستور مستقیم از یه فرم شرطی نرم مثل Would it be possible to... یا I was wondering if... استفاده کنین. این فرم‌ها مؤدبانه‌تر از Move the meeting یا Review my report هستن."}

  en.b1.unit14.lesson03.teach.budget_update: {title: "budget update", gloss: "گزارش به‌روز بودجه", note: "budget update یعنی گزارشی دربارهٔ این که پول چطور خرج شده.", example_gloss: "دنیل گزارش به‌روز بودجه رو برای جلسه آماده کرد."}
  en.b1.unit14.lesson03.teach.afterward: {title: "afterward", gloss: "بعدش، پس از آن", note: "afterward یعنی بعد از یه اتفاق یا کار دیگه.", example_gloss: "می‌تونیم یادداشت‌ها رو بعدش مرور کنیم."}
  en.b1.unit14.lesson03.teach.reading_passage: {title: "متن: پیامی قبل از جلسه", gloss: "سلام دنیل، امیدوارم حالت خوب باشه. ممکنه گزارش به‌روز بودجه رو به دستور جلسهٔ فردا اضافه کنیم؟ ممنون می‌شم اگه آخرین ارقام رو با خودت بیاری. می‌شه ده دقیقه زودتر شروع کنیم تا برای سؤالات بعدش وقت داشته باشیم؟ ممنون، میا", note: "این پیام سه تا درخواست مؤدبانه رو با would it be possible to، I would appreciate it if و could we possibly نشون می‌ده."}

  en.b1.unit14.lesson04.teach.q_start_budget_update: {title: "حرف مدیر", gloss: "مدیر می‌گه صبح بخیر، میا. ممکنه امروز با گزارش به‌روز بودجه شروع کنیم؟", note: "*would it be possible to* اینجا برای شروع جلسه یه درخواست مؤدبانه‌ست."}
  en.b1.unit14.lesson04.teach.a_add_new_client: {title: "جواب میا", gloss: "میا می‌گه البته. داشتم فکر می‌کردم که ممکنه مشتری جدید رو هم به دستور جلسه اضافه کنیم.", note: "*I was wondering if we could* یه درخواست غیرمستقیمه."}
  en.b1.unit14.lesson04.teach.q_keep_thirty_minutes: {title: "حرف مدیر", gloss: "مدیر می‌گه ایدهٔ خوبیه. می‌شه این جلسه رو زیر سی دقیقه نگه داریم؟", note: "*could we possibly* یه درخواست مشترکه."}
  en.b1.unit14.lesson04.teach.a_questions_in_advance: {title: "جواب میا", gloss: "میا می‌گه سعیم رو می‌کنم. ممنون می‌شم اگه دفعهٔ بعد همه سؤال‌هاشون رو از قبل بفرستن.", note: "*I would appreciate it if* یه درخواست مؤدبانهٔ دیگه‌ست."}
  en.b1.unit14.lesson04.teach.q_fair_request_followup: {title: "حرف مدیر", gloss: "مدیر می‌گه این درخواست منصفانه‌ایه. قبل از جلسهٔ بعدی با یه یادآوری پیگیری می‌کنم.", note: "*follow up with a reminder* یعنی دوباره با یه یادآوری تماس بگیره."}
  en.b1.unit14.lesson04.teach.a_send_updated_agenda: {title: "جمع‌بندی میا", gloss: "میا می‌گه ممنون. امروز بعدازظهر دستور جلسهٔ به‌روزشده رو می‌فرستم.", note: "*send the updated agenda* یعنی دستور جلسهٔ جدید رو بفرسته."}

