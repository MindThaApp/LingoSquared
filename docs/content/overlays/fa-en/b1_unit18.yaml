course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح میانی (B1) برای فارسی‌زبان‌ها، با تمرکز بر شرط، توالی رویدادها، نقل قول غیرمستقیم، هدف و فرض‌های غیرواقعی."

units:
  en.b1.unit18.future_plans: {title: "I am going to start a new project"}

lessons:
  en.b1.unit18.lesson01.future_plans_vocabulary: {title: "کلمات برای حرف زدن دربارهٔ آینده"}
  en.b1.unit18.lesson02.fixed_arrangements_and_intentions: {title: "I am meeting Leila on Friday"}
  en.b1.unit18.lesson03.reading_daniels_plans: {title: "متن: برنامه‌های دنیل برای ماه بعد"}
  en.b1.unit18.lesson04.the_planning_dialogue: {title: "It will probably take two months"}

teaching:
  en.b1.unit18.lesson01.teach.arrangement: {title: "arrangement", gloss: "قرار از پیش تعیین‌شده", note: "arrangement یعنی یه برنامه‌ای که با یه نفر دیگه از پیش هماهنگ شده.", example_gloss: "میا با لیلا برای جمعه یه قرار داره."}
  en.b1.unit18.lesson01.teach.intention: {title: "intention", gloss: "قصد", note: "intention یعنی چیزی که تصمیم گرفتین انجامش بدین، حتی اگه هنوز زمانش رو مشخص نکرده باشین.", example_gloss: "قصد دنیل اینه که پروژه رو زودتر تموم کنه."}
  en.b1.unit18.lesson01.teach.prediction: {title: "prediction", gloss: "پیش‌بینی", note: "prediction یعنی یه حدس دربارهٔ چیزی که قراره اتفاق بیفته، بر اساس شواهد.", example_gloss: "پیش‌بینی من اینه که پروژه سر وقت تموم می‌شه."}
  en.b1.unit18.lesson01.teach.definitely: {title: "definitely", gloss: "قطعاً", note: "definitely یعنی کاملاً مطمئنین که یه چیزی اتفاق می‌افته.", example_gloss: "دنیل قطعاً امروز گزارش رو تموم می‌کنه."}
  en.b1.unit18.lesson01.teach.probably: {title: "probably", gloss: "احتمالاً", note: "probably یعنی نسبتاً مطمئنین ولی صددرصد مطمئن نیستین.", example_gloss: "پروژه احتمالاً دو ماه طول می‌کشه."}
  en.b1.unit18.lesson01.teach.might: {title: "might", gloss: "شاید", note: "might یعنی یه احتمال ضعیف برای یه اتفاق آینده.", example_gloss: "دنیل شاید از لیلا بخواد به تیم ملحق بشه."}

  en.b1.unit18.lesson02.teach.meeting_leila_friday: {title: "I am meeting Leila for lunch on Friday.", gloss: "جمعه با لیلا برای ناهار قرار دارم.", note: "*I am meeting...* حال استمراری برای یه قرار ثابته."}
  en.b1.unit18.lesson02.teach.going_to_start_project: {title: "I am going to start a new project with the design team.", gloss: "می‌خوام یه پروژهٔ جدید با تیم طراحی شروع کنم.", note: "*I am going to...* برای یه قصد یا تصمیم از پیش گرفته‌شده."}
  en.b1.unit18.lesson02.teach.grammar_arrangements_vs_intentions: {title: "قرار ثابت در برابر قصد", gloss: "برای یه قرار ثابت که زمانش با یه نفر دیگه هماهنگ شده، از حال استمراری (I am meeting Leila on Friday) استفاده کنین. برای یه قصد یا تصمیمی که گرفتین ولی هنوز زمان دقیقش مشخص نیست، از going to (I am going to start a new project) استفاده کنین.", note: "حال استمراری برای قرار ثابت، going to برای قصد بدون زمان دقیق."}

  en.b1.unit18.lesson03.teach.on_time: {title: "on time", gloss: "سر وقت", note: "on time یعنی دقیقاً طبق برنامه، نه دیرتر.", example_gloss: "دنیل فکر می‌کنه پروژه سر وقت تموم می‌شه."}
  en.b1.unit18.lesson03.teach.confident: {title: "confident", gloss: "مطمئن", note: "confident یعنی احساس اطمینان دربارهٔ یه چیزی داشتن.", example_gloss: "دنیل دربارهٔ پروژهٔ جدید مطمئنه."}
  en.b1.unit18.lesson03.teach.reading_passage: {title: "متن: برنامه‌های دنیل برای ماه بعد", gloss: "دنیل می‌خواد ماه بعد یه پروژهٔ جدید با تیم طراحی شروع کنه. جمعه صبح با اون‌ها قرار داره تا اولین قدم‌ها رو برنامه‌ریزی کنن. دنیل دربارهٔ پروژه مطمئنه، ولی کاملاً مطمئن نیست که سر وقت تموم بشه. پیش‌بینی می‌کنه که احتمالاً حدود دو ماه طول بکشه. شاید از لیلا بخواد به تیم ملحق بشه، چون تجربهٔ طراحی مفیدی داره. اگه اون قبول کنه، پروژه قطعاً سریع‌تر پیش می‌ره.", note: "این متن سه فرم آینده رو با حال استمراری، going to و will نشون می‌ده."}

  en.b1.unit18.lesson04.teach.q_plans_next_month: {title: "سؤال میا", gloss: "میا می‌گه دنیل، برنامه‌هات برای ماه بعد چیه؟", note: "*what are your plans for* سؤال دربارهٔ برنامه‌های آینده‌ست."}
  en.b1.unit18.lesson04.teach.a_going_to_start: {title: "حرف دنیل", gloss: "دنیل می‌گه می‌خوام یه پروژهٔ جدید با تیم طراحی شروع کنم.", note: "*I am going to start* یه قصد از پیش تصمیم‌گرفته‌شده‌ست."}
  en.b1.unit18.lesson04.teach.q_meeting_this_week: {title: "سؤال میا", gloss: "میا می‌گه جالبه. این هفته باهاشون قرار داری؟", note: "*Are you meeting them* سؤال دربارهٔ یه قرار ثابته."}
  en.b1.unit18.lesson04.teach.a_meeting_friday_morning: {title: "جواب دنیل", gloss: "دنیل می‌گه آره، جمعه صبح باهاشون قرار دارم.", note: "*I am meeting them on Friday morning* حال استمراری برای قرار ثابته."}
  en.b1.unit18.lesson04.teach.q_finish_on_time: {title: "سؤال میا", gloss: "میا می‌گه فکر می‌کنی پروژه سر وقت تموم می‌شه؟", note: "*Do you think... will finish* سؤالیه دربارهٔ یه پیش‌بینی آینده."}
  en.b1.unit18.lesson04.teach.a_probably_two_months: {title: "جواب دنیل", gloss: "دنیل می‌گه مطمئن نیستم، ولی احتمالاً حدود دو ماه طول می‌کشه.", note: "*it will probably take* یه پیش‌بینی با will و probably ست."}
  en.b1.unit18.lesson04.teach.q_sure_it_will_go_well: {title: "حرف میا", gloss: "میا می‌گه خب، مطمئنم خوب پیش می‌ره.", note: "*I'm sure it will go well* یه پیش‌بینی با اطمینان بالاست."}
  en.b1.unit18.lesson04.teach.a_might_ask_leila: {title: "حرف دنیل", gloss: "دنیل می‌گه ممنون. شاید از لیلا هم بخوام به تیم ملحق بشه.", note: "*I might ask Leila* یه احتمال ضعیف با might ست."}

