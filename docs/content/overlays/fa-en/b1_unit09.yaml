course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح میانی (B1) برای فارسی‌زبان‌ها، با تمرکز بر شرط، توالی رویدادها، نقل قول غیرمستقیم، هدف و فرض‌های غیرواقعی."

units:
  en.b1.unit09.reported_speech: {title: "او گفت که بعد از ناهار وقت دارد"}

lessons:
  en.b1.unit09.lesson01.reported_speech_vocabulary: {title: "said that، asked if و message"}
  en.b1.unit09.lesson02.reporting_statements: {title: "میا گفت که بعد از ناهار وقت داشت"}
  en.b1.unit09.lesson03.reading_the_message_chain: {title: "متن: زنجیرهٔ پیام‌ها"}
  en.b1.unit09.lesson04.the_reported_message_dialogue: {title: "او پرسید آیا گزارش کامل لازم است"}

teaching:
  en.b1.unit09.lesson01.teach.said_that: {title: "said that", gloss: "گفت که", note: "said that برای گزارش کردن حرف یا جمله‌ای استفاده می‌شه که کسی گفته.", example_gloss: "او گفت که سرش شلوغ بود."}
  en.b1.unit09.lesson01.teach.told_me_that: {title: "told me that", gloss: "به من گفت که", note: "told me that یعنی کسی اطلاعاتی را مستقیم به من داده.", example_gloss: "او به من گفت که جلسه لغو شده بود."}
  en.b1.unit09.lesson01.teach.asked_whether: {title: "asked whether", gloss: "پرسید آیا", note: "asked whether برای گزارش کردن سؤال بله/خیر استفاده می‌شه و کمی رسمی‌تر از asked if است.", example_gloss: "میا پرسید آیا ما کمک لازم داشتیم."}
  en.b1.unit09.lesson01.teach.asked_if: {title: "asked if", gloss: "پرسید که آیا", note: "asked if شکل رایج‌تر و روزمره‌تر برای گزارش کردن سؤال بله/خیر است.", example_gloss: "میا پرسید که آیا ما کمک لازم داشتیم."}
  en.b1.unit09.lesson01.teach.message: {title: "message", gloss: "پیام", note: "message یعنی یک یادداشت کوتاه نوشتاری یا گفتاری.", example_gloss: "لیلا بعد از ناهار یک پیام فرستاد."}
  en.b1.unit09.lesson01.teach.confirm: {title: "confirm", gloss: "تأیید کردن", note: "confirm یعنی بگین چیزی قطعی یا درست است.", example_gloss: "لطفاً قبل از رفتن، زمان را تأیید کن."}
  en.b1.unit09.lesson01.teach.available: {title: "available", gloss: "در دسترس، وقت‌دار", note: "available یعنی کسی وقت داره یا می‌تونه ملاقات کنه.", example_gloss: "میا بعد از ناهار وقت دارد."}

  en.b1.unit09.lesson02.teach.mia_available: {title: "Mia said that she was available after lunch.", gloss: "میا گفت که بعد از ناهار وقت داشت.", note: "در نقل قول غیرمستقیم، *is available* معمولاً به *was available* برمی‌گرده."}
  en.b1.unit09.lesson02.teach.leila_told_me: {title: "Leila told me that the room was busy.", gloss: "لیلا به من گفت که اتاق اشغال بود.", note: "*told me that* نشان می‌ده اطلاعات مستقیم به گوینده داده شده."}
  en.b1.unit09.lesson02.teach.grammar_backshift: {title: "عقب‌بردن زمان فعل در نقل قول", gloss: "میا وقت دارد. میا گفت که وقت داشت.", note: "وقتی حرف کسی را گزارش می‌کنیم، زمان فعل اغلب یک مرحله به گذشته می‌ره: *is* تبدیل به *was* می‌شه."}

  en.b1.unit09.lesson03.teach.short_summary: {title: "short summary", gloss: "خلاصهٔ کوتاه", note: "short summary یعنی نسخه‌ای کوتاه که فقط نکته‌های اصلی را دارد.", example_gloss: "یک خلاصهٔ کوتاه برای جلسهٔ امروز کافی است."}
  en.b1.unit09.lesson03.teach.full_report: {title: "full report", gloss: "گزارش کامل", note: "full report یعنی گزارش کامل، نه فقط خلاصه.", example_gloss: "میا پرسید آیا گزارش کامل لازم بود."}
  en.b1.unit09.lesson03.teach.reading_passage: {title: "متن: زنجیرهٔ پیام‌ها", gloss: "لیلا پیام میا را خواند و به دنیل زنگ زد. او گفت که میا بعد از ناهار وقت داشت. او همچنین گفت که میا عددها را تمام کرده بود. میا پرسید آیا تیم امروز گزارش کامل را لازم دارد. دنیل به لیلا گفت که یک خلاصهٔ کوتاه کافی بود، چون جلسه فقط پانزده دقیقه طول داشت.", note: "این متن هم جملهٔ خبری را گزارش می‌کنه (*said that*) و هم سؤال بله/خیر را (*asked whether*)."}

  en.b1.unit09.lesson04.teach.q_mia_reply: {title: "پرسش دنیل", gloss: "دنیل می‌پرسه آیا میا دربارهٔ مرور گزارش جواب داد؟", note: "این سؤال مستقیمه؛ جواب لیلا آن را به شکل نقل قول غیرمستقیم گزارش می‌کنه."}
  en.b1.unit09.lesson04.teach.a_she_said_available: {title: "جواب لیلا", gloss: "لیلا می‌گه بله، او گفت که بعد از ناهار وقت داشت.", note: "*she said that she was available* حرف میا را غیرمستقیم گزارش می‌کنه."}
  en.b1.unit09.lesson04.teach.q_anything_else: {title: "پرسش بعدی دنیل", gloss: "دنیل می‌پرسه عالیه. چیز دیگه‌ای هم پرسید؟", note: "این سؤال زمینه را برای گزارش کردن یک سؤال دیگر آماده می‌کنه."}
  en.b1.unit09.lesson04.teach.a_asked_if_report: {title: "جواب لیلا با asked if", gloss: "لیلا می‌گه او پرسید که آیا امروز گزارش کامل لازم داشتیم.", note: "در نقل سؤال بله/خیر، ترتیب کلمات مثل جملهٔ خبریه: *we needed*، نه did we need."}
  en.b1.unit09.lesson04.teach.q_what_tell_her: {title: "پرسش دنیل", gloss: "دنیل می‌پرسه بهش چی گفتی؟", note: "این سؤال دربارهٔ پاسخی است که لیلا به میا داده."}
  en.b1.unit09.lesson04.teach.a_short_summary_enough: {title: "جواب لیلا", gloss: "لیلا می‌گه بهش گفتم که یک خلاصهٔ کوتاه کافی بود.", note: "*I told her that...* اطلاعاتی را گزارش می‌کنه که لیلا به میا داده."}
  en.b1.unit09.lesson04.teach.q_tell_team: {title: "جمع‌بندی دنیل", gloss: "دنیل می‌گه عالیه. به تیم می‌گم که می‌تونیم ساعت دو جلسه بگذاریم.", note: "اینجا *tell the team that* برای انتقال اطلاعات به گروه استفاده شده."}

exercises:
  en.b1.unit09.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شده انتخاب کنین."
    correct_option: "available"
    distractors: ["confirm", "message", "asked if"]
    accepted_answers: [{value: "available", status: "correct"}]
    feedback: "available یعنی در دسترس یا وقت‌دار."
  en.b1.unit09.lesson01.exercise02.choose_said_that:
    instruction: "کدام عبارت برای گزارش کردن جمله‌ای استفاده می‌شه که کسی گفته؟"
    correct_option: "said that"
    distractors: ["asked whether", "message", "confirm"]
    accepted_answers: [{value: "said that", status: "correct"}]
    feedback: "said that یعنی گفت که."
  en.b1.unit09.lesson01.exercise03.choose_available:
    instruction: "کدام کلمه یعنی کسی آزاد است یا می‌تونه ملاقات کنه؟"
    correct_option: "available"
    distractors: ["confirm", "message", "full report"]
    accepted_answers: [{value: "available", status: "correct"}]
    feedback: "available یعنی در دسترس یا وقت‌دار."
  en.b1.unit09.lesson01.exercise04.match_reported_speech_words:
    instruction: "هر معنی را به کلمه یا عبارت انگلیسی درست وصل کنید."
    accepted_answers:
      - value:
          - {left: "reports a yes-or-no question, slightly formal", right: "asked whether"}
          - {left: "reports a yes-or-no question in everyday speech", right: "asked if"}
          - {left: "a short written or spoken note", right: "message"}
          - {left: "to say that something is definite or correct", right: "confirm"}
          - {left: "free or able to meet", right: "available"}
        status: "correct"
    feedback: "هر تعریف به یک واژه یا عبارت انگلیسی اشاره می‌کنه."
  en.b1.unit09.lesson01.exercise05.write_confirm:
    instruction: "کلمه‌ای را بنویسین که یعنی گفتن این که چیزی قطعی یا درست است."
    accepted_answers:
      - {value: "confirm", status: "correct"}
      - {value: "Confirm", status: "correct"}
    feedback: "confirm یعنی تأیید کردن."

  en.b1.unit09.lesson02.exercise01.choose_mia_available:
    instruction: "کدام جمله حرف میا را گزارش می‌کنه؟"
    correct_option: "Mia said that she was available after lunch."
    distractors: ["Mia is available after lunch.", "Mia asked whether we needed help.", "Leila sent a message after lunch."]
    accepted_answers: [{value: "Mia said that she was available after lunch.", status: "correct"}]
    feedback: "Mia said that... یعنی میا گفت که..."
  en.b1.unit09.lesson02.exercise02.choose_room_busy:
    instruction: "کدام جمله اطلاعاتی را گزارش می‌کنه که لیلا به گوینده داده؟"
    correct_option: "Leila told me that the room was busy."
    distractors: ["Mia said that she was available after lunch.", "Leila asked whether the room was busy.", "The room is busy now."]
    accepted_answers: [{value: "Leila told me that the room was busy.", status: "correct"}]
    feedback: "told me that یعنی به من گفت که."
  en.b1.unit09.lesson02.exercise03.order_mia_said_available:
    instruction: "کلمات را برای گفتن «میا گفت که بعد از ناهار وقت داشت.» مرتب کنین."
    accepted_answers: [{value: ["Mia", "said", "that", "she", "was", "available", "after", "lunch"], status: "correct"}]
    feedback: "ترتیب درست: Mia said that she was available after lunch."
  en.b1.unit09.lesson02.exercise04.reply_what_did_mia_say:
    instruction: "میا چی گفت؟ جواب را با نقل قول غیرمستقیم بنویسین."
    accepted_answers:
      - {value: "Mia said that she was available after lunch.", status: "correct"}
      - {value: "Mia said that she was available after lunch", status: "correct"}
    feedback: "در نقل قول غیرمستقیم، is available به was available تبدیل شده."
  en.b1.unit09.lesson02.exercise05.write_leila_told_me:
    instruction: "بنویسین که لیلا به شما گفت اتاق اشغال بود."
    accepted_answers:
      - {value: "Leila told me that the room was busy.", status: "correct"}
      - {value: "Leila told me that the room was busy", status: "correct"}
    feedback: "Leila told me that... یعنی لیلا به من گفت که..."

  en.b1.unit09.lesson03.exercise01.comprehend_mia_available:
    instruction: "لیلا دربارهٔ میا چی گفت؟"
    correct_option: "Mia was available after lunch"
    distractors: ["Mia was busy all day", "Mia canceled the review", "Mia needed more time"]
    accepted_answers: [{value: "Mia was available after lunch", status: "correct"}]
    feedback: "متن می‌گه: Mia was available after lunch."
  en.b1.unit09.lesson03.exercise02.comprehend_mia_asked:
    instruction: "میا چی پرسید؟"
    correct_option: "whether the team needed the full report today"
    distractors: ["whether Daniel was available after lunch", "whether the meeting was canceled", "whether Leila sent the numbers"]
    accepted_answers: [{value: "whether the team needed the full report today", status: "correct"}]
    feedback: "متن می‌گه: Mia asked whether the team needed the full report today."
  en.b1.unit09.lesson03.exercise03.recognize_short_summary:
    instruction: "کدام عبارت یعنی نسخه‌ای کوتاه با فقط نکته‌های اصلی؟"
    correct_option: "short summary"
    distractors: ["full report", "message", "review"]
    accepted_answers: [{value: "short summary", status: "correct"}]
    feedback: "short summary یعنی خلاصهٔ کوتاه."
  en.b1.unit09.lesson03.exercise04.order_mia_asked_whether:
    instruction: "کلمات را برای گفتن «میا پرسید آیا تیم امروز گزارش کامل لازم داشت.» مرتب کنین."
    accepted_answers: [{value: ["Mia", "asked", "whether", "the", "team", "needed", "the", "full", "report", "today"], status: "correct"}]
    feedback: "ترتیب درست: Mia asked whether the team needed the full report today."
  en.b1.unit09.lesson03.exercise05.write_short_summary:
    instruction: "بنویسین که دنیل گفت یک خلاصهٔ کوتاه کافی بود."
    accepted_answers:
      - {value: "Daniel said that a short summary was enough.", status: "correct"}
      - {value: "Daniel said that a short summary was enough", status: "correct"}
    feedback: "Daniel said that... نقل قول غیرمستقیم جملهٔ دنیل است."

  en.b1.unit09.lesson04.exercise01.listen_what_mia_said:
    instruction: "گفتگو را گوش کنین و بگین لیلا گفت میا چه زمانی وقت داشت."
    correct_option: "she was available after lunch"
    distractors: ["she was busy before lunch", "she was traveling today", "she was waiting for Daniel"]
    accepted_answers: [{value: "she was available after lunch", status: "correct"}]
    feedback: "لیلا می‌گه: she said that she was available after lunch."
  en.b1.unit09.lesson04.exercise02.listen_what_mia_asked:
    instruction: "گوش کنین و بگین میا چه چیزی پرسید."
    correct_option: "if we needed the full report today"
    distractors: ["if the review was canceled", "if Daniel could call later", "if the room was free"]
    accepted_answers: [{value: "if we needed the full report today", status: "correct"}]
    feedback: "لیلا می‌گه: She asked if we needed the full report today."
  en.b1.unit09.lesson04.exercise03.choose_what_leila_told_mia:
    instruction: "لیلا به میا چی گفت؟"
    correct_option: "a short summary was enough"
    distractors: ["the full report was late", "the numbers were missing", "the meeting was canceled"]
    accepted_answers: [{value: "a short summary was enough", status: "correct"}]
    feedback: "لیلا می‌گه: I told her that a short summary was enough."
  en.b1.unit09.lesson04.exercise04.order_told_her_summary:
    instruction: "کلمات را برای گفتن «بهش گفتم که یک خلاصهٔ کوتاه کافی بود.» مرتب کنین."
    accepted_answers: [{value: ["I", "told", "her", "that", "a", "short", "summary", "was", "enough"], status: "correct"}]
    feedback: "ترتیب درست: I told her that a short summary was enough."
  en.b1.unit09.lesson04.exercise05.reply_as_leila:
    instruction: "دنیل می‌پرسه: آیا میا دربارهٔ مرور گزارش جواب داد؟"
    accepted_answers:
      - {value: "Yes, she said that she was available after lunch.", status: "correct"}
      - {value: "Yes, she said that she was available after lunch", status: "correct"}
    feedback: "این جواب پاسخ مثبت را با نقل قول غیرمستقیم ترکیب می‌کنه."
  en.b1.unit09.lesson04.exercise06.speak_reported_speech_dialogue:
    instruction: "به نقش لیلا، با صدای بلند به دنیل جواب بدین."
    accepted_answers:
      - {value: "She asked if we needed the full report today.", status: "correct"}
      - {value: "She asked if we needed the full report today", status: "correct"}
    feedback: "در سؤال گزارش‌شده، ترتیب کلمات خبریه: we needed، نه did we need."
