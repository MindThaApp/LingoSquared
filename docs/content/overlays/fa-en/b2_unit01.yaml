course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح پیشرفته‌تر (B2) برای فارسی‌زبان‌ها، با تمرکز بر استدلال، حدس زدن بر اساس شواهد، ظریف‌تر حرف زدن و تأکید درست."

units:
  en.b2.unit01.argumentation: {title: "شواهد هنوز ازش پشتیبانی می‌کنه"}

lessons:
  en.b2.unit01.lesson01.argument_structure: {title: "ادعا، شواهد و جواب دادن به مخالفت"}
  en.b2.unit01.lesson02.building_an_argument: {title: "درسته ریسک داره، اما..."}
  en.b2.unit01.lesson03.reading_an_argument: {title: "متن: دفاع از برنامهٔ کاری ترکیبی"}
  en.b2.unit01.lesson04.the_argument_dialogue: {title: "مزایا از ریسک‌ها مهم‌تره"}

teaching:
  en.b2.unit01.lesson01.teach.claim: {title: "claim", gloss: "ادعا، موضع", note: "claim یعنی حرف اصلی‌ای که دارین ازش دفاع می‌کنین؛ فقط «گفتن» نیست.", example_gloss: "ادعای او اینه که برنامه باید ادامه پیدا کنه."}
  en.b2.unit01.lesson01.teach.evidence: {title: "evidence", gloss: "شواهد", note: "evidence یعنی مثال، عدد، داده یا چیزی که ادعاتون رو قوی‌تر می‌کنه.", example_gloss: "این مثال برای ادعای میا شواهد فراهم می‌کنه."}
  en.b2.unit01.lesson01.teach.counterargument: {title: "counterargument", gloss: "استدلال مخالف", note: "counterargument یعنی نکته‌ای که با ادعای شما مخالفت می‌کنه یا بهش فشار میاره.", example_gloss: "دنیل یک استدلال مخالف مطرح می‌کنه."}
  en.b2.unit01.lesson01.teach.rebut: {title: "rebut", gloss: "جواب دادن به مخالفت", note: "rebut یعنی به نکتهٔ مخالف جواب بدین و نشون بدین ادعای اصلی هنوز سر جاشه.", example_gloss: "میا با شواهد به اون نگرانی جواب می‌ده."}
  en.b2.unit01.lesson01.teach.concede: {title: "concede", gloss: "پذیرفتن بخشی از حرف طرف مقابل", note: "concede یعنی قبول کنین یک بخش از نگرانی منطقیه، بدون اینکه کل ادعای خودتون رو کنار بذارین.", example_gloss: "می‌تونین یک نگرانی رو بپذیرین، بدون اینکه ادعای اصلی‌تون رو واگذار کنین."}
  en.b2.unit01.lesson01.teach.outweigh: {title: "outweigh", gloss: "مهم‌تر بودن، سنگین‌تر بودن", note: "outweigh یعنی یک عامل از عامل دیگه مهم‌تره؛ در فارسی معمولاً می‌گیم «مزایاش به ریسک‌ها می‌چربه».", example_gloss: "شواهد قوی می‌تونه از یک نگرانی مهم‌تر باشه."}

  en.b2.unit01.lesson02.teach.position_with_evidence: {title: "I agree the plan has risks, but the evidence still supports moving forward.", gloss: "قبول دارم برنامه ریسک‌هایی داره، ولی شواهد هنوز ادامه دادن برنامه رو تأیید می‌کنه.", note: "در انگلیسی آکادمیک/کاری، اول نگرانی رو منصفانه قبول می‌کنین، بعد با but ادعای اصلی رو نگه می‌دارین."}
  en.b2.unit01.lesson02.teach.strongest_reason: {title: "The strongest reason is that the survey results were consistent.", gloss: "قوی‌ترین دلیل اینه که نتایج نظرسنجی یکدست بودن.", note: "بعد از The strongest reason is that... یک جملهٔ کامل میاد؛ ترتیب فارسی رو مستقیم منتقل نکنین."}
  en.b2.unit01.lesson02.teach.fair_concern: {title: "That is a fair concern; however, the data points in the other direction.", gloss: "این نگرانی منصفانه‌ایه؛ با این حال، داده‌ها خلافش رو نشون می‌دن.", note: "however رسمی‌تر از but است و معمولاً با مکث یا ویرگول میاد."}
  en.b2.unit01.lesson02.teach.grammar_argument_shape: {title: "شکل یک استدلال دفاع‌شده", gloss: "ادعا رو بگین، شواهد بدین، قوی‌ترین مخالفت رو بپذیرین، و بعد بهش جواب بدین.", note: "عبارت‌هایی مثل That is a fair concern باعث می‌شن منصف به نظر بیاین، اما با However هنوز ادعای اصلی رو حفظ می‌کنین."}

  en.b2.unit01.lesson03.teach.retention: {title: "retention", gloss: "حفظ کارکنان، نگه‌داشتن نیروها", note: "retention در متن کاری یعنی اینکه کارکنان شرکت رو ترک نکنن.", example_gloss: "حفظ بهتر کارکنان یعنی افراد کمتری تیم رو ترک می‌کنن."}
  en.b2.unit01.lesson03.teach.collaboration: {title: "collaboration", gloss: "همکاری", note: "collaboration یعنی چند نفر با هم کار کنن تا یک نتیجه بسازن.", example_gloss: "همکاری خوب به تیم کمک می‌کنه کار رو تموم کنه."}
  en.b2.unit01.lesson03.teach.reading_passage: {title: "متن: دفاع از برنامهٔ کاری ترکیبی", gloss: "میا استدلال می‌کنه که شرکت باید برنامهٔ کاری ترکیبی رو در سه‌ماههٔ بعد نگه داره. ادعای اصلی او اینه که کار ترکیبی حفظ کارکنان رو بهتر می‌کنه، بدون اینکه عملکرد رو پایین بیاره. قوی‌ترین شواهد، نظرسنجی کارکنانه: کارکنان تیم‌های ترکیبی کمتر احتمال داشت بگن دنبال کار دیگری هستن. قوی‌ترین استدلال مخالف اینه که وقتی افراد هر روز در دفتر نیستن، همکاری ممکنه آسیب ببینه. میا اون نگرانی رو می‌پذیره، اما با داده‌های پروژه بهش جواب می‌ده: تیم‌های ترکیبی کارشون رو به‌موقع تحویل دادن و امتیازهای بررسی‌شون کمی بالاتر بود. به همین دلیل، نتیجه می‌گیره که مزایا از ریسک‌ها مهم‌تره.", note: "به ترتیب نقش‌ها دقت کنین: claim، evidence، counterargument، acknowledge، rebut، conclude."}

  en.b2.unit01.lesson04.teach.q_keep_hybrid: {title: "Mia", gloss: "فکر می‌کنم باید برنامهٔ کاری ترکیبی رو برای سه‌ماههٔ بعد نگه داریم.", note: "should اینجا توصیهٔ قوی برای تصمیم‌گیریه، نه اجبار قانونی."}
  en.b2.unit01.lesson04.teach.a_strongest_reason: {title: "Daniel", gloss: "قوی‌ترین دلیل شما چیه؟", note: "strongest reason یعنی از بین چند دلیل، مهم‌ترین دلیل دفاع از موضع."}
  en.b2.unit01.lesson04.teach.q_retention_survey: {title: "Mia", gloss: "قوی‌ترین دلیل، حفظ کارکنانه. در نظرسنجی کارکنان، کسانی که ترکیبی کار می‌کردن کمتر احتمال داشت بگن دنبال کار دیگری هستن.", note: "less likely to say یعنی احتمال کمتری داشت که بگن؛ ترتیب جملهٔ انگلیسی رو با فارسی قاطی نکنین."}
  en.b2.unit01.lesson04.teach.a_collaboration_weaker: {title: "Daniel", gloss: "بعضی مدیرها می‌گن وقتی افراد هر روز در دفتر نیستن، همکاری ضعیف‌تره.", note: "این جمله استدلال مخالف رو می‌سازه."}
  en.b2.unit01.lesson04.teach.q_data_rebuttal: {title: "Mia", gloss: "این نگرانی منصفانه‌ایه. با این حال، داده‌های پروژه این نگرانی رو تأیید نمی‌کنه. تیم‌های ترکیبی کارشون رو به‌موقع تحویل دادن و امتیازهای بررسی‌شون کمی بالاتر بود.", note: "does not support it یعنی داده‌ها اون نگرانی رو تأیید نمی‌کنن؛ it به نگرانی قبلی برمی‌گرده."}
  en.b2.unit01.lesson04.teach.a_benefits_outweigh: {title: "Daniel", gloss: "پس موضع شما اینه که مزایا از ریسک‌ها مهم‌تره؟", note: "outweigh در بحث یعنی یک طرف از طرف دیگر قوی‌تر یا مهم‌تره."}
  en.b2.unit01.lesson04.teach.q_improve_routines: {title: "Mia", gloss: "دقیقاً. باید روال جلسه‌ها رو بهتر کنیم، نه اینکه برنامه رو کنار بذاریم.", note: "not abandon the schedule یعنی برنامه را کامل رها نکنیم."}

exercises:
  en.b2.unit01.lesson01.exercise01.choose_claim:
    instruction: "کدام کلمه یعنی موضعی که کسی ازش دفاع می‌کنه؟"
    correct_option: "claim"
    distractors: ["evidence", "counterargument", "concede"]
    accepted_answers: [{value: "claim", status: "correct"}]
    feedback: "claim یعنی ادعا یا موضع اصلی."
  en.b2.unit01.lesson01.exercise02.choose_rebut:
    instruction: "کدام کلمه یعنی به نکتهٔ مخالف جواب بدین و نشون بدین ادعاتون هنوز پابرجاست؟"
    correct_option: "rebut"
    distractors: ["concede", "outweigh", "claim"]
    accepted_answers: [{value: "rebut", status: "correct"}]
    feedback: "rebut یعنی جواب دادن به مخالفت، نه فقط قبول کردنش."
  en.b2.unit01.lesson01.exercise03.match_argument_terms:
    instruction: "هر معنی را به کلمهٔ انگلیسی درست وصل کنین."
    accepted_answers: [{value: [{left: "the position a speaker is defending", right: "claim"}, {left: "facts or examples used to support a position", right: "evidence"}, {left: "an opposing point that challenges the claim", right: "counterargument"}, {left: "to answer an opposing point without giving up your claim", right: "rebut"}, {left: "to admit that part of the opposing point is reasonable", right: "concede"}, {left: "to be more important than another factor", right: "outweigh"}], status: "correct"}]
    feedback: "claim=ادعا، evidence=شواهد، counterargument=استدلال مخالف، rebut=جواب دادن، concede=بخشی را پذیرفتن، outweigh=مهم‌تر بودن."
  en.b2.unit01.lesson01.exercise04.write_counterargument:
    instruction: "کلمه‌ای را بنویسین که یعنی نکتهٔ مخالفی که یک ادعا رو به چالش می‌کشه."
    accepted_answers:
      - {value: "counterargument", status: "correct"}
      - {value: "Counterargument", status: "correct"}
    feedback: "counterargument یعنی استدلال مخالف."
  en.b2.unit01.lesson01.exercise05.write_outweigh:
    instruction: "کلمه‌ای را بنویسین که یعنی از یک عامل دیگه مهم‌تر بودن."
    accepted_answers:
      - {value: "outweigh", status: "correct"}
      - {value: "Outweigh", status: "correct"}
    feedback: "outweigh یعنی مهم‌تر یا سنگین‌تر بودن."

  en.b2.unit01.lesson02.exercise01.choose_concede_rebut:
    instruction: "کدام جمله اول نگرانی طرف مقابل رو می‌پذیره و بعد بهش جواب می‌ده؟"
    correct_option: "That is a fair concern; however, the data points in the other direction."
    distractors: ["The strongest reason is that the survey results were consistent.", "Some managers say collaboration is weaker.", "The evidence still supports moving forward."]
    accepted_answers: [{value: "That is a fair concern; however, the data points in the other direction.", status: "correct"}]
    feedback: "That is a fair concern پذیرش نگرانیه؛ however جواب دادن به اون نگرانی رو شروع می‌کنه."
  en.b2.unit01.lesson02.exercise02.choose_strongest_reason:
    instruction: "کدام جمله شواهد پشتیبان یک موضع رو روشن معرفی می‌کنه؟"
    correct_option: "The strongest reason is that the survey results were consistent."
    distractors: ["That is a fair concern; however, the data points in the other direction.", "I agree the plan has risks, but the evidence still supports moving forward.", "Some managers say collaboration is weaker."]
    accepted_answers: [{value: "The strongest reason is that the survey results were consistent.", status: "correct"}]
    feedback: "The strongest reason is that... قوی‌ترین دلیل رو معرفی می‌کنه."
  en.b2.unit01.lesson02.exercise03.order_evidence_supports:
    instruction: "کلمات را برای گفتن «شواهد هنوز ادامه دادن برنامه رو تأیید می‌کنه» مرتب کنین."
    accepted_answers: [{value: ["The", "evidence", "still", "supports", "moving", "forward"], status: "correct"}]
    feedback: "ترتیب درست: The evidence still supports moving forward."
  en.b2.unit01.lesson02.exercise04.reply_risks_but_evidence:
    instruction: "با این فرم جواب بدین: I agree the plan has risks, but..."
    accepted_answers:
      - {value: "I agree the plan has risks, but the evidence still supports moving forward", status: "correct"}
      - {value: "I agree the plan has risks, but the evidence still supports moving forward.", status: "correct"}
      - {value: "I agree that the plan has risks, but the evidence still supports moving forward", status: "correct"}
      - {value: "I agree that the plan has risks, but the evidence still supports moving forward.", status: "correct"}
      - {value: "I agree there are risks, but the evidence still supports moving forward", status: "correct"}
      - {value: "I agree there are risks, but the evidence still supports moving forward.", status: "correct"}
    feedback: "این جواب نگرانی رو قبول می‌کنه، اما با but موضع اصلی رو نگه می‌داره."
  en.b2.unit01.lesson02.exercise05.write_fair_concern:
    instruction: "این جملهٔ جواب به مخالفت را بنویسین: That is a fair concern; however, the data points in the other direction."
    accepted_answers:
      - {value: "That is a fair concern; however, the data points in the other direction.", status: "correct"}
      - {value: "That is a fair concern; however the data points in the other direction.", status: "acceptable_with_note", note: "Understandable, but the comma after however is the polished written form."}
    feedback: "however بعد از پذیرفتن نگرانی، جهت مخالف داده‌ها رو نشان می‌ده."

  en.b2.unit01.lesson03.exercise01.choose_main_claim:
    instruction: "در متن، ادعای اصلی میا کدامه؟"
    correct_option: "hybrid work improves retention without lowering performance"
    distractors: ["collaboration may suffer when people are not in the office every day", "the hybrid teams delivered on time and scored higher", "people were looking for another job"]
    accepted_answers: [{value: "hybrid work improves retention without lowering performance", status: "correct"}]
    feedback: "این جمله موضع اصلی میاست؛ بقیه یا شواهدن یا استدلال مخالف."
  en.b2.unit01.lesson03.exercise02.choose_counterargument:
    instruction: "کدام جمله استدلال مخالفیه که میا بهش جواب می‌ده؟"
    correct_option: "collaboration may suffer when people are not in the office every day"
    distractors: ["hybrid work improves retention without lowering performance", "hybrid employees were less likely to look for another job", "the benefits outweigh the risks"]
    accepted_answers: [{value: "collaboration may suffer when people are not in the office every day", status: "correct"}]
    feedback: "نگرانی دربارهٔ collaboration همون counterargument است."
  en.b2.unit01.lesson03.exercise03.match_argument_parts:
    instruction: "هر نقش در استدلال را به جملهٔ درست از متن وصل کنین."
    accepted_answers: [{value: [{left: "Mia's defended position", right: "hybrid work improves retention without lowering performance"}, {left: "survey support for her position", right: "hybrid employees were less likely to look for another job"}, {left: "the strongest opposing point", right: "collaboration may suffer"}, {left: "her answer to the opposing point", right: "hybrid teams delivered on time and scored higher"}, {left: "her final weighing of the issue", right: "the benefits outweigh the risks"}], status: "correct"}]
    feedback: "ادعا، شواهد، مخالفت، جواب، و جمع‌بندی هر کدوم نقش جدا دارن."
  en.b2.unit01.lesson03.exercise04.write_main_claim:
    instruction: "ادعای اصلی میا را به صورت یک جملهٔ کامل بنویسین."
    accepted_answers:
      - {value: "Hybrid work improves retention without lowering performance.", status: "correct"}
      - {value: "Hybrid work improves retention without lowering performance", status: "correct"}
      - {value: "Mia's main claim is that hybrid work improves retention without lowering performance.", status: "correct"}
      - {value: "Mia's main claim is that hybrid work improves retention without lowering performance", status: "correct"}
    feedback: "جمله باید claim اصلی را کامل بیان کنه."
  en.b2.unit01.lesson03.exercise05.write_rebuttal:
    instruction: "این شواهدِ جواب به مخالفت را بنویسین: The hybrid teams delivered on time, and their review scores were slightly higher."
    accepted_answers:
      - {value: "The hybrid teams delivered on time, and their review scores were slightly higher.", status: "correct"}
      - {value: "The hybrid teams delivered on time and their review scores were slightly higher.", status: "correct"}
    feedback: "این جمله داده‌ای می‌ده که نگرانی دربارهٔ همکاری رو ضعیف می‌کنه."

  en.b2.unit01.lesson04.exercise01.choose_mias_claim:
    instruction: "در گفتگو، میا از کدام ادعا دفاع می‌کنه؟"
    correct_option: "we should keep the hybrid schedule for the next quarter"
    distractors: ["we should abandon the schedule", "collaboration is weaker every day", "the survey should be repeated"]
    accepted_answers: [{value: "we should keep the hybrid schedule for the next quarter", status: "correct"}]
    feedback: "میا می‌گه باید برنامهٔ کاری ترکیبی را برای سه‌ماههٔ بعد نگه داریم."
  en.b2.unit01.lesson04.exercise02.listen_counterargument:
    instruction: "گوش کنین و استدلال مخالفی را که دنیل مطرح می‌کنه انتخاب کنین."
    correct_option: "collaboration is weaker when people are not in the office every day"
    distractors: ["retention is weaker when people work hybrid", "review scores were slightly lower", "the schedule is too expensive to continue"]
    accepted_answers: [{value: "collaboration is weaker when people are not in the office every day", status: "correct"}]
    feedback: "دنیل نگرانی دربارهٔ collaboration رو مطرح می‌کنه."
  en.b2.unit01.lesson04.exercise03.order_benefits_outweigh:
    instruction: "کلمات را برای گفتن «مزایا از ریسک‌ها مهم‌تره» مرتب کنین."
    accepted_answers: [{value: ["the", "benefits", "outweigh", "the", "risks"], status: "correct"}]
    feedback: "ترتیب درست: the benefits outweigh the risks."
  en.b2.unit01.lesson04.exercise04.reply_as_mia:
    instruction: "با دو جملهٔ اول جواب میا پاسخ بدین: That is a fair concern. However, the project data does not support it."
    accepted_answers:
      - {value: "That is a fair concern. However, the project data does not support it.", status: "correct"}
      - {value: "That is a fair concern; however, the project data does not support it.", status: "correct"}
      - {value: "That is a fair concern. However, the project data does not support it. The hybrid teams delivered their work on time, and their review scores were slightly higher.", status: "correct"}
      - {value: "That is a fair concern. However, the project data does not support it. The hybrid teams delivered their work on time and their review scores were slightly higher.", status: "correct"}
    feedback: "این جواب نگرانی را منصفانه می‌پذیره و بعد با داده‌ها ردش می‌کنه."
  en.b2.unit01.lesson04.exercise05.speak_defend_position:
    instruction: "به نقش میا، با صدای بلند بگین که باید روال جلسه‌ها بهتر بشه، نه اینکه برنامه کنار گذاشته بشه."
    accepted_answers:
      - {value: "We should improve meeting routines, not abandon the schedule.", status: "correct"}
    feedback: "این جواب موضع میا رو بعد از weighing روشن می‌کنه."
  en.b2.unit01.lesson04.exercise06.write_mini_argument:
    instruction: "این استدلال کامل را بنویسین: Hybrid work improves retention without lowering performance. In the staff survey, people who worked hybrid were less likely to say they were looking for another job. That is a fair concern, but the project data does not support it. The hybrid teams delivered their work on time, so we should improve meeting routines, not abandon the schedule."
