course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح پیشرفته‌تر (B2) برای فارسی‌زبان‌ها، با تمرکز بر استدلال، حدس زدن بر اساس شواهد، ظریف‌تر حرف زدن و تأکید درست."

units:
  en.b2.unit02.speculation: {title: "حتماً شب از کار افتاده"}

lessons:
  en.b2.unit02.lesson01.certainty_and_deduction: {title: "may، might، must و cannot"}
  en.b2.unit02.lesson02.present_and_past_speculation: {title: "حتماً مشکل سیستم بوده"}
  en.b2.unit02.lesson03.reading_an_incident_note: {title: "متن: احتمالاً چه اتفاقی افتاده؟"}
  en.b2.unit02.lesson04.the_speculation_dialogue: {title: "نتیجه‌گیری از شواهد، نه فقط حدس"}

teaching:
  en.b2.unit02.lesson01.teach.may: {title: "may", gloss: "ممکنه، شاید", note: "may برای احتمال استفاده می‌شه؛ از شاید فارسی دقیق‌تره و در انگلیسی کمی رسمی‌تر/خنثی‌تر از might حس می‌شه.", example_gloss: "ممکنه این درست باشه."}
  en.b2.unit02.lesson01.teach.might: {title: "might", gloss: "ممکنه، شاید کمی محتاط‌تر", note: "might هم احتمال رو نشون می‌ده، ولی اغلب کمی محتاط‌تر یا کم‌قطعیت‌تر از may شنیده می‌شه.", example_gloss: "شاید این درست باشه."}
  en.b2.unit02.lesson01.teach.must: {title: "must", gloss: "حتماً، لابد (بر اساس شواهد)", note: "must در حدس یعنی نتیجه‌گیری قوی از شواهد، نه «باید» دستوری.", example_gloss: "حتماً این درسته."}
  en.b2.unit02.lesson01.teach.cannot: {title: "cannot", gloss: "نمی‌تونه، محال/تقریباً محال است", note: "cannot در این درس یعنی شواهد یک توضیح رو رد می‌کنه؛ فقط توانایی نداشتن نیست.", example_gloss: "این نمی‌تونه درست باشه."}
  en.b2.unit02.lesson01.teach.deduction: {title: "deduction", gloss: "نتیجه‌گیری از شواهد", note: "deduction یعنی از روی نشانه‌ها به یک نتیجه برسین، نه اینکه بی‌دلیل حدس بزنین.", example_gloss: "نتیجه‌گیری میا بر اساس شواهده."}
  en.b2.unit02.lesson01.teach.guesswork: {title: "guesswork", gloss: "حدس بی‌پایه، حدس با شواهد کم", note: "guesswork وقتی استفاده می‌شه که شواهد کافی نداریم.", example_gloss: "بدون شواهد، توضیح فقط حدس بی‌پایه می‌شه."}
  en.b2.unit02.lesson01.teach.may_might_contrast: {title: "may در برابر might", gloss: "هر دو یعنی ممکنه؛ might معمولاً کمی محتاط‌تره.", note: "در فارسی شاید/احتمالاً همهٔ این طیف رو پوشش می‌ده، اما انگلیسی با may، might، must و cannot درجهٔ قطعیت رو دقیق‌تر جدا می‌کنه."}

  en.b2.unit02.lesson02.teach.must_have_gone_down: {title: "The server must have gone down overnight because no reports were generated.", gloss: "سرور حتماً شب از کار افتاده، چون هیچ گزارشی ساخته نشده.", note: "must have + قسمت سوم فعل برای نتیجه‌گیری قوی دربارهٔ گذشته‌ست. فارسی شکل جداگانه‌ای مثل این نداره و معمولاً با «حتماً ... شده» می‌گیم."}
  en.b2.unit02.lesson02.teach.may_have_failed: {title: "The reports may have failed during the night.", gloss: "گزارش‌ها ممکنه شب اجرا نشده باشن.", note: "may have + قسمت سوم فعل یعنی احتمال دربارهٔ گذشته."}
  en.b2.unit02.lesson02.teach.might_have_permission: {title: "It might have been a permission issue instead.", gloss: "ممکنه به‌جاش مشکل دسترسی بوده باشه.", note: "might have been علت گذشته را با قطعیت کمتر بیان می‌کنه."}
  en.b2.unit02.lesson02.teach.cannot_have_only_report: {title: "It cannot have been only a report problem.", gloss: "نمی‌تونه فقط مشکل گزارش بوده باشه.", note: "cannot have been یعنی شواهد اون توضیح گذشته رو رد می‌کنه."}
  en.b2.unit02.lesson02.teach.grammar_modal_deduction: {title: "حدس حال و گذشته", gloss: "must be برای نتیجه‌گیری قوی دربارهٔ الان؛ must have been برای نتیجه‌گیری قوی دربارهٔ گذشته.", note: "بعد از must/may/might/cannot فعل ساده میاد، اما برای گذشته have + قسمت سوم فعل میاد: must have been، might have been، cannot have been."}

  en.b2.unit02.lesson03.teach.outage: {title: "outage", gloss: "قطعی، ازکارافتادگی سیستم", note: "outage یعنی سیستم، برق یا سرویس برای مدتی کار نمی‌کنه.", example_gloss: "یک قطعی سیستم باعث شد گزارش‌ها اجرا نشن."}
  en.b2.unit02.lesson03.teach.consequence: {title: "consequence", gloss: "پیامد، نتیجه", note: "consequence یعنی چیزی که بعد از یک اتفاق به‌عنوان نتیجه پیش میاد.", example_gloss: "یک پیامد اینه که داشبورد ممکنه داده‌های قدیمی نشون بده."}
  en.b2.unit02.lesson03.teach.reading_passage: {title: "متن: یادداشت رخداد", gloss: "گزارش‌های شبانه اجرا نشدن و صفحهٔ مانیتورینگ خالیه. میا می‌گه سرور حتماً در طول شب از کار افتاده. دنیل احتمال می‌ده که شاید مشکل دسترسی بوده باشه، اما اون نمی‌تونه صفحهٔ مانیتورینگ خالی رو توضیح بده. تیم مالی ممکنه آمار صبح رو نداشته باشه و داشبورد مشتری ممکنه تا وقتی گزارش‌ها دوباره ساخته بشن داده‌های قدیمی نشون بده. میا کاملاً مطمئن نیست، اما توضیحش نتیجه‌گیری از شواهد موجوده، نه حدس کاملاً بی‌پایه.", note: "در متن، fact را از speculation جدا کنین: did not run واقعیت گزارش‌شده است؛ must have gone down نتیجه‌گیریه."}

  en.b2.unit02.lesson04.teach.q_no_reports: {title: "Daniel", gloss: "هیچ‌کدام از گزارش‌های شبانه ساخته نشدن.", note: "این یک fact است، نه حدس."}
  en.b2.unit02.lesson04.teach.a_server_down: {title: "Mia", gloss: "سرور حتماً شب از کار افتاده.", note: "must have gone down نتیجه‌گیری قوی از شواهد گذشته‌ست."}
  en.b2.unit02.lesson04.teach.q_permission_issue: {title: "Daniel", gloss: "ممکنه به‌جاش مشکل دسترسی بوده باشه.", note: "might have been یک علت احتمالی و کم‌قطعیت‌تره."}
  en.b2.unit02.lesson04.teach.a_cannot_only_report: {title: "Mia", gloss: "شاید، ولی صفحهٔ مانیتورینگ هم خالیه، پس نمی‌تونه فقط مشکل گزارش بوده باشه.", note: "cannot have been یعنی شواهد اون توضیح را رد می‌کنه."}
  en.b2.unit02.lesson04.teach.q_consequences: {title: "Daniel", gloss: "چه پیامدهایی رو باید انتظار داشته باشیم؟", note: "consequences نتایج احتمالی مشکل هستن."}
  en.b2.unit02.lesson04.teach.a_possible_consequences: {title: "Mia", gloss: "تیم مالی ممکنه آمار صبح رو نداشته باشه، و داشبورد مشتری ممکنه داده‌های قدیمی نشون بده.", note: "may و might هر دو پیامد احتمالی رو نشان می‌دن."}
  en.b2.unit02.lesson04.teach.q_deduction_guess: {title: "Daniel", gloss: "پس این نتیجه‌گیری از شواهده، نه فقط یک حدس؟", note: "not just a guess یعنی شواهدی پشت حرف هست."}
  en.b2.unit02.lesson04.teach.a_evidence_limited: {title: "Mia", gloss: "بله. شواهد محدوده، اما به قطعی سیستم اشاره می‌کنه.", note: "points to یعنی نشانه‌ها به سمت یک توضیح می‌رن."}

exercises:
  en.b2.unit02.lesson01.exercise01.choose_deduction:
    instruction: "کدام کلمه یعنی نتیجه‌گیری بر اساس شواهد، نه حدس تصادفی؟"
    correct_option: "deduction"
    distractors: ["guesswork", "may", "cannot"]
    accepted_answers: [{value: "deduction", status: "correct"}]
    feedback: "deduction یعنی نتیجه‌گیری از شواهد."
  en.b2.unit02.lesson01.exercise02.choose_cannot:
    instruction: "کدام modal نشان می‌ده گوینده چیزی رو ناممکن یا تقریباً ناممکن می‌دونه؟"
    correct_option: "cannot"
    distractors: ["may", "might", "must"]
    accepted_answers: [{value: "cannot", status: "correct"}]
    feedback: "cannot در حدس یعنی شواهد یک توضیح رو رد می‌کنه."
  en.b2.unit02.lesson01.exercise03.match_certainty:
    instruction: "هر کلمه را به نقش درستش در حدس زدن و نتیجه‌گیری وصل کنین."
    accepted_answers:
      - value:
          - {left: "may", right: "a possible explanation, often neutral in tone"}
          - {left: "might", right: "a possible explanation, often slightly more tentative"}
          - {left: "must", right: "a strong conclusion based on evidence"}
          - {left: "deduction", right: "reasoning from evidence"}
        status: "correct"
    feedback: "هر تعریف به یک واژه یا عبارت انگلیسی اشاره می‌کنه."
  en.b2.unit02.lesson01.exercise04.write_deduction:
    instruction: "کلمهٔ انگلیسی‌ای را بنویسین که یعنی نتیجه‌گیری از شواهد."
