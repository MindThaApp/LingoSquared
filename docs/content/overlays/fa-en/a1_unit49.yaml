review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit49 (sorting household waste). Authored fully at schema_version 1.1, every kind: vocabulary teaching card has a matching example_gloss:. Contrastive-grammar points for this unit: (1) preposition stranding -- 'Which bin does this go in?' ends the question with the preposition 'in', a construction Farsi never allows (Farsi always keeps the preposition attached to its object: توی کدوم سطل می‌ره؟); flagged explicitly in the note on that phrase card so the learner isn't confused by the 'dangling' in at the end. (2) 'on Tuesday(s)' -- English obligatorily marks a weekday with the preposition on, while Farsi states the weekday bare with no preposition (سه‌شنبه‌ها, no equivalent of on); flagged on the collection-day phrase card. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, not translated Farsi lefts, per the established fa-en convention (the compiler only ever copies prompt.pairs from the realization, so a translated-left answer key can never grade correct). Every listen_select/multiple_choice distractor in lesson03/lesson04 is an invented value never stated elsewhere in this unit (e.g. invented bin colors 'the yellow bin'/'the red bin', invented weekdays 'Mondays'/'Sundays'/'Wednesdays', explicitly never 'Fridays' for the collection-day item since Fridays is a real fact about a DIFFERENT item -- the regular trash -- in the same dialogue, exactly the same-speaker-different-fact trap the realization's own review notes flag) per CLAUDE.md's standing listen_select-distractor footgun. Strong sibling-isolation rule applied -- nl-en/prs-en overlays for units 49-57 were not consulted for content, and the concurrent units 39-48 dispatch's work was not opened either. Needs the mandatory fresh-context review before shipping, and inherits the underlying realization's own still-unreviewed status."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit49.waste_disposal: {title: "دسته‌بندی زباله"}

lessons:
  en.a1.unit49.lesson01.waste_disposal_vocabulary: {title: "کلمات دسته‌بندی زباله"}
  en.a1.unit49.lesson02.sorting_your_waste: {title: "دسته‌بندی زباله‌هاتون"}
  en.a1.unit49.lesson03.dialogue_sorting_the_recycling: {title: "گفتگو: دسته‌بندی زباله‌های بازیافتی"}
  en.a1.unit49.lesson04.how_waste_sorting_works: {title: "متن: دسته‌بندی زباله چطور کار می‌کنه"}

teaching:
  en.a1.unit49.lesson01.teach.sort: {title: "sort", gloss: "دسته‌بندی کردن / جدا کردن", note: "*sort* یعنی چیزها رو بر اساس نوعشون از هم جدا کردن. *every week* یعنی هر هفته.", example_gloss: "ما هر هفته زباله‌هامون رو دسته‌بندی می‌کنیم."}
  en.a1.unit49.lesson01.teach.bin: {title: "bin", gloss: "سطل زباله", note: "*bin* یعنی سطل، برای زباله یا بازیافت. *Which bin does this go in?* یعنی این باید تو کدوم سطل بره؟", example_gloss: "این باید تو کدوم سطل بره؟"}
  en.a1.unit49.lesson01.teach.recycle: {title: "recycle", gloss: "بازیافت کردن", note: "*recycle* یعنی موادی مثل شیشه و کاغذ رو دوباره قابل استفاده کردن.", example_gloss: "ما شیشه و کاغذ رو بازیافت می‌کنیم."}
  en.a1.unit49.lesson01.teach.trash: {title: "trash", gloss: "زباله / آشغال", note: "*trash* یعنی زباله‌ای که دور می‌ریزین. *Can you take out the trash?* یعنی می‌تونی زباله رو ببری بیرون؟", example_gloss: "می‌تونی زباله رو ببری بیرون؟"}
  en.a1.unit49.lesson01.teach.collection_day: {title: "collection day", gloss: "روز جمع‌آوری زباله", note: "*collection day* یعنی روزی که سطل‌های زباله رو می‌برن. دقت کنین: انگلیسی قبل از اسم روز از *on* استفاده می‌کنه (*on Tuesday*)، ولی فارسی برای روز هفته هیچ حرف اضافه‌ای نمی‌ذاره -- فقط می‌گیم «سه‌شنبه».", example_gloss: "روز جمع‌آوری زباله سه‌شنبه‌ست."}

  en.a1.unit49.lesson02.teach.which_bin_does_this_go_in: {title: "Which bin does this go in?", gloss: "این باید تو کدوم سطل بره؟", note: "دقت کنین حرف اضافهٔ *in* اینجا آخر جمله اومده -- این «حرف اضافهٔ رها شده» تو انگلیسی محاوره‌ای خیلی طبیعیه، ولی فارسی هیچ‌وقت حرف اضافه رو از متمم خودش جدا نمی‌کنه (همیشه می‌گیم «توی کدوم سطل»، حرف اضافه و متممش کنار همن)."}
  en.a1.unit49.lesson02.teach.this_goes_in_the_recycling_bin: {title: "This goes in the recycling bin.", gloss: "این میره تو سطل بازیافت."}
  en.a1.unit49.lesson02.teach.the_green_bin_is_for_glass: {title: "The green bin is for glass.", gloss: "سطل سبز برای شیشه‌ست."}
  en.a1.unit49.lesson02.teach.can_you_take_out_the_trash: {title: "Can you take out the trash?", gloss: "می‌تونی زباله رو ببری بیرون؟"}
  en.a1.unit49.lesson02.teach.collection_day_is_on_tuesday: {title: "Collection day is on Tuesday.", gloss: "روز جمع‌آوری زباله سه‌شنبه‌ست.", note: "دوباره دقت کنین به *on Tuesday* -- انگلیسی قبل از روز هفته حتماً *on* می‌ذاره، فارسی هیچ حرف اضافه‌ای نمی‌خواد."}
  en.a1.unit49.lesson02.teach.what_about_paper_and_food_waste: {title: "What about paper and food waste?", gloss: "کاغذ و زباله‌ی غذا چی؟"}

  en.a1.unit49.lesson03.teach.dialogue_line1: {title: "هشدار میا", gloss: "میا می‌گه صبر کن، اون شیشهٔ ظرف نباید بره تو زباله!", note: "*doesn't go in the trash* یعنی نباید بره تو زباله."}
  en.a1.unit49.lesson03.teach.dialogue_line2: {title: "سؤال دنیل", gloss: "دنیل عذرخواهی می‌کنه و می‌پرسه کدوم سطل باید بره.", note: "*Which bin does it go in?* -- سؤال با حرف اضافهٔ آخر جمله."}
  en.a1.unit49.lesson03.teach.dialogue_line3: {title: "جواب میا", gloss: "میا می‌گه میره تو سطل سبز، چون اونجا شیشه رو بازیافت می‌کنن.", note: "*We recycle glass here* یعنی اینجا شیشه رو بازیافت می‌کنیم."}
  en.a1.unit49.lesson03.teach.dialogue_line4: {title: "سؤال بعدی دنیل", gloss: "دنیل می‌پرسه کاغذ و زبالهٔ غذا چی؟", note: "*What about...?* یه راه کوتاه برای پرسیدن دربارهٔ یه چیز دیگه‌ست."}
  en.a1.unit49.lesson03.teach.dialogue_line5: {title: "توضیح میا", gloss: "میا می‌گه کاغذ میره تو سطل آبی، و زبالهٔ غذا میره تو سطل قهوه‌ای.", note: "دو تا جمله با *and* به هم وصل شدن."}
  en.a1.unit49.lesson03.teach.dialogue_line6: {title: "سؤال دنیل دربارهٔ روز جمع‌آوری", gloss: "دنیل می‌گه فهمید، و می‌پرسه روز جمع‌آوری کِیه.", note: "*Got it* یعنی فهمیدم. *When is collection day?* یعنی روز جمع‌آوری کیه؟"}
  en.a1.unit49.lesson03.teach.dialogue_line7: {title: "جواب میا دربارهٔ روزها", gloss: "میا می‌گه سطل‌های بازیافت سه‌شنبه‌ها بیرون میرن، و زباله جمعه‌ها بیرون میره.", note: "دقت کنین *Tuesdays* و *Fridays* هر دو جمع بسته شدن، چون هر هفته تکرار می‌شن."}
  en.a1.unit49.lesson03.teach.dialogue_line8: {title: "تشکر دنیل", gloss: "دنیل تشکر می‌کنه و می‌گه دفعهٔ بعد همه‌چی رو درست دسته‌بندی می‌کنه.", note: "*I'll sort everything correctly next time* -- *I'll* شکل کوتاه‌شدهٔ *I will* برای زمان آینده‌ست."}

  en.a1.unit49.lesson04.teach.reading_passage: {title: "متن: دسته‌بندی زباله چطور کار می‌کنه", gloss: "خیلی از آپارتمان‌ها سطل‌های جدا برای زباله‌های مختلف دارن. شیشه معمولاً میره تو سطل سبز، کاغذ میره تو سطل آبی. زبالهٔ غذا میره تو سطل قهوه‌ای، و بقیهٔ چیزها میره تو سطل مشکی برای زبالهٔ معمولی. دونستن روز جمع‌آوری کمک می‌کنه، چون سطل‌ها فقط هفته‌ای یه بار برداشته می‌شن. دنیل داشته دستورپخت‌های کتابی که از کتابخونه گرفته رو تمرین می‌کرده، و اغلب با میا تو آپارتمان اون آشپزی می‌کنه. دیشب یه دستورپخت از اون کتاب درست کرد، و بعدش نزدیک بود یه شیشهٔ ظرف رو بندازه تو زبالهٔ معمولی. میا جلوش رو گرفت و بهش نشون داد آپارتمانش چطور زباله رو دسته‌بندی می‌کنه. اون توضیح داد سطل‌های بازیافت سه‌شنبه‌ها بیرون میرن، و زبالهٔ معمولی جمعه‌ها بیرون میره. دنیل ممنون بود و گفت از این به بعد همه‌چی رو درست دسته‌بندی می‌کنه.", note: "*Many apartment buildings have...* -- *have* اینجا یعنی «دارن»، برای مالکیت جمع. *usually* یعنی معمولاً."}

exercises:
  en.a1.unit49.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "recycle"
    distractors: ["sort", "bin", "trash", "collection day"]
    accepted_answers: [{value: "recycle", status: "correct"}]
    feedback: "*recycle* یعنی بازیافت کردن."
  en.a1.unit49.lesson01.exercise02.choose_sort_meaning:
    instruction: "کدوم کلمه یعنی چیزها رو بر اساس نوعشون از هم جدا کردن؟"
    correct_option: "sort"
    distractors: ["bin", "trash", "collection day"]
    accepted_answers: [{value: "sort", status: "correct"}]
    feedback: "*sort* یعنی دسته‌بندی کردن / جدا کردن."
  en.a1.unit49.lesson01.exercise03.match_waste_words:
    instruction: "هر توضیح انگلیسی رو به کلمهٔ درستش وصل کنین."
    accepted_answers: [{value: [{left: "to put things into different groups by type", right: "sort"}, {left: "a container for trash or recycling", right: "bin"}, {left: "to sort materials so they can be used again", right: "recycle"}, {left: "garbage that you throw away", right: "trash"}, {left: "the day your bins are picked up", right: "collection day"}], status: "correct"}]
    feedback: "sort=دسته‌بندی کردن، bin=سطل زباله، recycle=بازیافت کردن، trash=زباله، collection day=روز جمع‌آوری زباله."
  en.a1.unit49.lesson01.exercise04.order_sort_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["We", "sort", "our", "waste", "every", "week."], status: "correct"}]
    feedback: "ترتیب درست: *We sort our waste every week.*"
  en.a1.unit49.lesson01.exercise05.write_collection_day_phrase:
    instruction: "عبارتی رو بنویسین که یعنی روزی که سطل‌هاتون برداشته می‌شه."
    accepted_answers: [{value: "collection day", status: "correct"}]
    feedback: "*collection day* یعنی روز جمع‌آوری زباله."

  en.a1.unit49.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "This goes in the recycling bin."
    distractors: ["Which bin does this go in?", "The green bin is for glass.", "Collection day is on Tuesday."]
    accepted_answers: [{value: "This goes in the recycling bin.", status: "correct"}]
    feedback: "*This goes in the recycling bin.* یعنی این میره تو سطل بازیافت."
  en.a1.unit49.lesson02.exercise02.choose_which_bin_meaning:
    instruction: "کدوم عبارت رو وقتی نمی‌دونین چیزی باید کجا بره می‌گین؟"
    correct_option: "Which bin does this go in?"
    distractors: ["Collection day is on Tuesday.", "The green bin is for glass.", "What about paper and food waste?"]
    accepted_answers: [{value: "Which bin does this go in?", status: "correct"}]
    feedback: "*Which bin does this go in?* یعنی این باید تو کدوم سطل بره؟"
  en.a1.unit49.lesson02.exercise03.choose_green_bin_meaning:
    instruction: "کدوم عبارت می‌گه شیشه باید بره تو سطل سبز؟"
    correct_option: "The green bin is for glass."
    distractors: ["This goes in the recycling bin.", "Can you take out the trash?", "What about paper and food waste?"]
    accepted_answers: [{value: "The green bin is for glass.", status: "correct"}]
    feedback: "*The green bin is for glass.* یعنی سطل سبز برای شیشه‌ست."
  en.a1.unit49.lesson02.exercise04.order_take_out_trash_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["Can", "you", "take", "out", "the", "trash?"], status: "correct"}]
    feedback: "ترتیب درست: *Can you take out the trash?*"
  en.a1.unit49.lesson02.exercise05.translate_collection_day:
    instruction: "ترجمه کنین: «روز جمع‌آوری زباله سه‌شنبه‌ست.»"
    accepted_answers: [{value: "Collection day is on Tuesday.", status: "correct"}, {value: "Collection day is on Tuesday", status: "correct"}]
    feedback: "*Collection day is on Tuesday.* -- قبل از روز هفته همیشه *on* می‌یاد."

  en.a1.unit49.lesson03.exercise01.comprehension_glass_bin:
    instruction: "طبق گفتگو، میا می‌گه شیشهٔ ظرف باید کدوم سطل بره؟"
    correct_option: "the green bin"
    distractors: ["the yellow bin", "the red bin", "the orange bin"]
    accepted_answers: [{value: "the green bin", status: "correct"}]
    feedback: "میا می‌گه شیشه میره تو سطل سبز."
  en.a1.unit49.lesson03.exercise02.comprehension_daniel_plan:
    instruction: "طبق گفتگو، دنیل می‌گه دفعهٔ بعد چیکار می‌کنه؟"
    correct_option: "sort everything correctly"
    distractors: ["clean the kitchen", "buy new bins", "call the building manager"]
    accepted_answers: [{value: "sort everything correctly", status: "correct"}]
    feedback: "دنیل می‌گه *I'll sort everything correctly next time* -- دفعهٔ بعد همه‌چی رو درست دسته‌بندی می‌کنه."
  en.a1.unit49.lesson03.exercise03.listen_dialogue_collection_day:
    instruction: "طبق گفتگو، سطل‌های بازیافت کِی بیرون گذاشته می‌شن؟"
    correct_option: "Tuesdays"
    distractors: ["Mondays", "Sundays", "Wednesdays"]
    accepted_answers: [{value: "Tuesdays", status: "correct"}]
    feedback: "میا می‌گه سطل‌های بازیافت سه‌شنبه‌ها بیرون میرن."
  en.a1.unit49.lesson03.exercise04.respond_own_sorting_statement:
    instruction: "بگین زباله کِی بیرون گذاشته می‌شه، یا بگین که دفعهٔ بعد همه‌چی رو درست دسته‌بندی می‌کنین."
    accepted_answers: ["The trash goes out on Fridays", "The trash goes out on Fridays.", "The recycling bins go out on Tuesdays", "The recycling bins go out on Tuesdays.", "I'll sort everything correctly", "I'll sort everything correctly."]
    feedback: "می‌تونین بگین *The trash goes out on Fridays* یا *The recycling bins go out on Tuesdays* یا *I'll sort everything correctly*."

  en.a1.unit49.lesson04.exercise01.reading_food_waste_bin:
    instruction: "طبق متن، زبالهٔ غذا تو کدوم سطل دسته‌بندی می‌شه؟"
    correct_option: "the brown bin"
    distractors: ["the yellow bin", "the red bin", "the purple bin"]
    accepted_answers: [{value: "the brown bin", status: "correct"}]
    feedback: "متن می‌گه زبالهٔ غذا میره تو سطل قهوه‌ای."
  en.a1.unit49.lesson04.exercise02.reading_who_showed_daniel:
    instruction: "طبق متن، کی به دنیل نشون داد چطور زباله‌ش رو درست دسته‌بندی کنه؟"
    correct_option: "Mia"
    distractors: ["Leila", "Daniel", "the neighbor"]
    accepted_answers: [{value: "Mia", status: "correct"}]
    feedback: "متن می‌گه میا بهش نشون داد."
  en.a1.unit49.lesson04.exercise03.reading_recycling_day:
    instruction: "طبق متن، سطل‌های بازیافت کِی بیرون گذاشته می‌شن؟"
    correct_option: "Tuesdays"
    distractors: ["Mondays", "Sundays", "Wednesdays"]
    accepted_answers: [{value: "Tuesdays", status: "correct"}]
    feedback: "متن می‌گه سطل‌های بازیافت سه‌شنبه‌ها بیرون میرن."
  en.a1.unit49.lesson04.exercise04.write_own_sorting_message:
    instruction: "یه پیام کوتاه بنویسین: بگین شیشه تو کدوم سطل میره، و بگین سطل‌های بازیافت کِی بیرون گذاشته می‌شن."
    accepted_answers: ["Glass goes in the green bin. The recycling bins go out on Tuesdays.", "Glass goes in the green bin, and the recycling bins go out on Tuesdays.", "Glass goes in the green bin, the recycling bins go out on Tuesdays.", "Glass goes in the green bin. The trash goes out on Fridays.", "Glass goes in the green bin, and the trash goes out on Fridays."]
    feedback: "می‌تونین بگین *Glass goes in the green bin, and the recycling bins go out on Tuesdays.*"
