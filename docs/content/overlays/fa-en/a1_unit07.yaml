exercises:
  en.a1.unit07.lesson01.exercise01.listen_food:
    instruction: "گوش کنید و واژهٔ گفته‌شده را انتخاب کنید."
    correct_option: "سوپ"
    distractors: ["قهوه", "چای", "آب"]
    accepted_answers: [{value: "سوپ", status: "correct"}]
    feedback: "soup یعنی سوپ."
  en.a1.unit07.lesson01.exercise02.choose_drink:
    instruction: "نوشیدنی گرم را انتخاب کنید."
    correct_option: "coffee"
    distractors: ["water", "bread", "salad"]
    accepted_answers: [{value: "coffee", status: "correct"}]
    feedback: "coffee (قهوه) یک نوشیدنی گرم است."
  en.a1.unit07.lesson01.exercise03.choose_bread:
    instruction: "واژهٔ درست برای «نان» را انتخاب کنید."
    correct_option: "bread"
    distractors: ["soup", "salad", "sandwich"]
    accepted_answers: [{value: "bread", status: "correct"}]
    feedback: "bread یعنی نان."
  en.a1.unit07.lesson01.exercise04.match_food_words:
    instruction: "هر توضیح را به واژهٔ انگلیسی درست وصل کنید."
    accepted_answers: [{value: [{left: "hot drink", right: "coffee"}, {left: "hot drink with leaves", right: "tea"}, {left: "drink with no taste", right: "water"}, {left: "baked food", right: "bread"}, {left: "warm liquid food", right: "soup"}, {left: "mixed vegetable dish", right: "salad"}, {left: "bread with something inside", right: "sandwich"}], status: "correct"}]
    feedback: "coffee=قهوه، tea=چای، water=آب، bread=نان."
  en.a1.unit07.lesson01.exercise05.write_sandwich:
    instruction: "واژهٔ انگلیسی برای «ساندویچ» را بنویسید."
    accepted_answers:
      - {value: "sandwich", status: "correct"}
      - {value: "Sandwich", status: "correct"}
    feedback: "sandwich یعنی ساندویچ."

  en.a1.unit07.lesson02.exercise01.listen_order_phrase:
    instruction: "گوش کنید و مشخص کنید چه سفارشی داده می‌شود."
    correct_option: "یک قهوه"
    distractors: ["یک چای", "یک ساندویچ", "یک سوپ"]
    accepted_answers: [{value: "یک قهوه", status: "correct"}]
    feedback: "I'd like a coffee, please یعنی «یک قهوه می‌خوام، لطفاً»."
  en.a1.unit07.lesson02.exercise02.choose_order:
    instruction: "جملهٔ مؤدبانه برای سفارش ساندویچ را انتخاب کنید."
    correct_option: "Can I have a sandwich, please?"
    distractors: ["Anything else?", "That's all, thanks.", "For here or to go?"]
    accepted_answers: [{value: "Can I have a sandwich, please?", status: "correct"}]
    feedback: "Can I have a sandwich, please؟ راهی مؤدبانه برای سفارش‌دادن است."
  en.a1.unit07.lesson02.exercise03.order_id_like:
    instruction: "واژه‌ها را برای سفارش مؤدبانهٔ قهوه مرتب کنید."
    accepted_answers: [{value: ["I'd", "like", "a", "coffee", "please"], status: "correct"}]
    feedback: "ترتیب درست I'd like a coffee, please است."
  en.a1.unit07.lesson02.exercise04.reply_anything_else:
    instruction: "به پرسش «چیز دیگه‌ای هم می‌خواید؟» پاسخ دهید که چیز دیگری نمی‌خواهید."
    accepted_answers:
      - {value: "No, that's all, thanks.", status: "correct"}
    feedback: "No, that's all, thanks یعنی «نه، همینه، ممنون»."
  en.a1.unit07.lesson02.exercise05.write_order:
    instruction: "بنویسید چطور مؤدبانه یک قهوه سفارش می‌دهید."
    accepted_answers:
      - {value: "I'd like a coffee, please.", status: "correct"}
      - {value: "I'd like a coffee, please", status: "correct"}
      - {value: "Can I have a coffee, please?", status: "correct"}
    feedback: "هر دو الگوی I'd like و Can I have برای سفارش مؤدبانه درست‌اند."

  en.a1.unit07.lesson03.exercise01.read_coffee_price:
    instruction: "منو را بخوانید و قیمت قهوه را بگویید."
    correct_option: "سه دلار"
    distractors: ["دو دلار", "پنج دلار", "شش دلار"]
    accepted_answers: [{value: "سه دلار", status: "correct"}]
    feedback: "روی منو Coffee - $3 نوشته شده است."
  en.a1.unit07.lesson03.exercise02.read_soup_price:
    instruction: "منو را بخوانید و قیمت سوپ را بگویید."
    correct_option: "پنج دلار"
    distractors: ["سه دلار", "دو دلار", "شش دلار"]
    accepted_answers: [{value: "پنج دلار", status: "correct"}]
    feedback: "روی منو Soup - $5 نوشته شده است."
  en.a1.unit07.lesson03.exercise03.choose_cheapest:
    instruction: "ارزان‌ترین آیتم منو را انتخاب کنید."
    correct_option: "Tea"
    distractors: ["Coffee", "Soup", "Sandwich"]
    accepted_answers: [{value: "Tea", status: "correct"}]
    feedback: "Tea با قیمت دو دلار ارزان‌ترین آیتم منوست."
  en.a1.unit07.lesson03.exercise04.match_menu_prices:
    instruction: "هر آیتم منو را به قیمت درست آن وصل کنید."
    accepted_answers: [{value: [{left: "Coffee", right: "$3"}, {left: "Tea", right: "$2"}, {left: "Soup", right: "$5"}, {left: "Sandwich", right: "$6"}], status: "correct"}]
    feedback: "قیمت‌ها دقیقاً مطابق متن منو هستند."
  en.a1.unit07.lesson03.exercise05.write_menu_item:
    instruction: "گران‌ترین آیتم منو و قیمت آن را بنویسید."
    accepted_answers:
      - {value: "Sandwich, $6", status: "correct"}
      - {value: "Sandwich - $6", status: "correct"}
      - {value: "Sandwich $6", status: "correct"}
    feedback: "Sandwich با قیمت شش دلار گران‌ترین آیتم منوست."

  en.a1.unit07.lesson04.exercise01.listen_order:
    instruction: "گفت‌وگو را گوش کنید و مشخص کنید لیلا چه چیزی سفارش می‌دهد."
    correct_option: "قهوه و ساندویچ"
    distractors: ["چای و سوپ", "قهوه و سالاد", "سوپ و ساندویچ"]
    accepted_answers: [{value: "قهوه و ساندویچ", status: "correct"}]
    feedback: "لیلا می‌گوید I'd like a coffee and a sandwich, please."
  en.a1.unit07.lesson04.exercise02.listen_price:
    instruction: "گوش کنید و مشخص کنید مبلغ نهایی چقدر است."
    correct_option: "نه دلار"
    distractors: ["سه دلار", "پنج دلار", "شش دلار"]
    accepted_answers: [{value: "نه دلار", status: "correct"}]
    feedback: "دنیل می‌گوید That's nine dollars."
  en.a1.unit07.lesson04.exercise03.choose_for_here_reply:
    instruction: "لیلا می‌خواهد همان‌جا در کافه غذا بخورد، نه بیرون ببرد. او چه می‌گوید؟"
    correct_option: "For here, please."
    distractors: ["To go, please.", "Anything else?", "That's all, thanks."]
    accepted_answers: [{value: "For here, please.", status: "correct"}]
