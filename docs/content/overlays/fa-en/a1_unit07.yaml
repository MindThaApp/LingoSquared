  en.a1.unit07.lesson04.exercise04.order_for_here_question:
    instruction: "واژه‌ها را برای پرسیدن «همین‌جا یا بیرون‌بر؟» مرتب کنید."
    accepted_answers: [{value: ["For", "here", "or", "to", "go"], status: "correct"}]
    feedback: "ترتیب درست For here or to go? است."
  en.a1.unit07.lesson04.exercise05.reply_as_leila:
    instruction: "در نقش لیلا، قهوه و ساندویچ سفارش دهید، بگویید همینه، و بگویید همین‌جا می‌خورید."
    accepted_answers:
      - {value: "I'd like a coffee and a sandwich, please. No, that's all, thanks. For here, please.", status: "correct"}
    feedback: "پاسخ کامل هر سه بخش سفارش را پوشش می‌دهد."
  en.a1.unit07.lesson04.exercise06.speak_order:
    instruction: "در نقش لیلا، با صدای بلند سفارش کامل را بگویید."
    accepted_answers:
