    distractors: ["In summary, the meeting covered the budget and the new client.", "Just one small detail -- the budget report was moved to next week.", "In short, the meeting covered many small details about the budget."]
    accepted_answers: [{value: "The main point was that we are under budget this month.", status: "correct"}]
    feedback: "The main point was that we are under budget this month. یعنی نکتهٔ اصلی این بود که این ماه از بودجه کمتر خرج کردیم."
  en.b1.unit19.lesson02.exercise03.order_in_summary_budget_client:
