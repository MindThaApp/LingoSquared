  en.b1.unit19.lesson02.exercise01.choose_in_summary_budget_client:
    instruction: "کدام جمله یه خلاصهٔ کوتاه از موضوعات جلسه می‌ده؟"
    correct_option: "In summary, the meeting covered the budget and the new client."
    distractors: ["The main point was that we are under budget this month.", "Just one small detail -- the client meeting was moved to next week.", "In your own words, please tell me what happened in the meeting."]
