  description: "آموزش انگلیسی سطح میانی (B1) برای فارسی‌زبان‌ها، با تمرکز بر شرط، توالی رویدادها، نقل قول غیرمستقیم، هدف و فرض‌های غیرواقعی."

units:
  en.b1.unit19.summarizing: {title: "In summary, the meeting covered..."}

lessons:
  en.b1.unit19.lesson01.summarizing_vocabulary: {title: "کلمات برای خلاصه کردن"}
  en.b1.unit19.lesson02.giving_a_summary: {title: "In summary, we are under budget"}
  en.b1.unit19.lesson03.reading_a_short_article: {title: "متن: خلاصه کردن یه مقالهٔ کوتاه"}
  en.b1.unit19.lesson04.the_briefing_dialogue: {title: "Can you tell me what happened?"}

teaching:
  en.b1.unit19.lesson01.teach.main_point: {title: "main point", gloss: "نکتهٔ اصلی", note: "main point یعنی مهم‌ترین ایده در یه متن یا گفتگو.", example_gloss: "نکتهٔ اصلی جلسه دربارهٔ بودجه بود."}
  en.b1.unit19.lesson01.teach.detail: {title: "detail", gloss: "جزئیات", note: "detail یعنی یه اطلاعات کوچیک اضافه که نکتهٔ اصلی رو تکمیل می‌کنه.", example_gloss: "میا یه جزئیات کوچیک دربارهٔ برنامه اضافه کرد."}
  en.b1.unit19.lesson01.teach.in_summary: {title: "in summary", gloss: "به‌طور خلاصه", note: "in summary یعنی معرفی یه خلاصهٔ کوتاه در انتهای یه توضیح طولانی‌تر.", example_gloss: "به‌طور خلاصه، پروژه ماه بعد تموم می‌شه."}
  en.b1.unit19.lesson01.teach.in_short: {title: "in short", gloss: "خلاصه بگم", note: "in short یعنی یه راه سریع و غیررسمی برای رفتن مستقیم سر اصل مطلب توی مکالمه.", example_gloss: "خلاصه بگم، تیم روی برنامه توافق کرد."}
  en.b1.unit19.lesson01.teach.in_your_own_words: {title: "in your own words", gloss: "با کلمات خودتون", note: "in your own words یعنی درخواست یه توضیح که عین متن اصلی کپی نشده.", example_gloss: "لطفاً برنامه رو با کلمات خودتون توضیح بدین."}

  en.b1.unit19.lesson02.teach.in_summary_budget_client: {title: "In summary, the meeting covered the budget and the new client.", gloss: "به‌طور خلاصه، جلسه دربارهٔ بودجه و مشتری جدید بود.", note: "*In summary...* یه خلاصهٔ کوتاه رو معرفی می‌کنه."}
  en.b1.unit19.lesson02.teach.main_point_under_budget: {title: "The main point was that we are under budget this month.", gloss: "نکتهٔ اصلی این بود که این ماه از بودجه کمتر خرج کردیم.", note: "*The main point was that...* مهم‌ترین ایده رو مشخص می‌کنه."}
  en.b1.unit19.lesson02.teach.grammar_summary_structure: {title: "ساختار خلاصه کردن", gloss: "یه خلاصه رو با عبارتی مثل In summary یا In short شروع کنین، بعد فقط نکته‌های اصلی رو به ترتیب و با جملهٔ کوتاه بگین. از The main point was that... برای برجسته کردن مهم‌ترین ایده، جدا از هر جزئیات کوچیک‌تر استفاده کنین.", note: "In summary / In short برای شروع، The main point was that برای نکتهٔ اصلی."}

  en.b1.unit19.lesson03.teach.condensed: {title: "condensed", gloss: "خلاصه‌شده", note: "condensed یعنی چیزی که کوتاه‌تر شده ولی نکته‌های اصلی رو نگه داشته.", example_gloss: "میا یه خلاصهٔ کوتاه‌شده از جلسه به دنیل داد."}
  en.b1.unit19.lesson03.teach.original_article: {title: "original article", gloss: "متن اصلی", note: "original article یعنی متن کاملی که یه خلاصه از روش نوشته شده.", example_gloss: "خلاصهٔ لیلا خیلی به متن اصلی نزدیک بود."}
  en.b1.unit19.lesson03.teach.reading_passage: {title: "متن: خلاصه کردن یه مقالهٔ کوتاه", gloss: "لیلا برای دورهٔ طراحیش یه مقالهٔ طولانی دربارهٔ ارتباطات محیط کار خوند. متن اصلی مثال‌ها و اطلاعات پس‌زمینهٔ زیادی داشت، ولی لیلا فقط به نکته‌های اصلی نیاز داشت. با کلمات خودش، یه خلاصهٔ کوتاه‌شده نوشت: ارتباطات محیط کار وقتی بهترین نتیجه رو می‌ده که پیام‌ها واضح و کوتاه باشن، و وقتی که آدم‌ها به‌جای حدس زدن سؤال بپرسن. اون بیشتر مثال‌ها رو حذف کرد، چون اون‌ها جزئیات بودن، نه نکته‌های اصلی. معلمش گفت که خلاصه ایده‌های مهم رو به ترتیب درست نگه داشته.", note: "این متن نشون می‌ده چطور نکته‌های اصلی رو از جزئیات جدا کنین."}

  en.b1.unit19.lesson04.teach.q_missed_meeting: {title: "حرف دنیل", gloss: "دنیل می‌گه جلسه رو از دست دادم. می‌تونی بگی چی شد؟", note: "*Can you tell me what happened?* درخواست یه خلاصه‌ست."}
  en.b1.unit19.lesson04.teach.a_in_short_budget_client: {title: "جواب میا", gloss: "میا می‌گه البته. خلاصه بگم، دربارهٔ بودجه و مشتری جدید صحبت کردیم.", note: "*In short...* یه خلاصهٔ سریع می‌ده."}
  en.b1.unit19.lesson04.teach.q_main_point_budget: {title: "سؤال دنیل", gloss: "دنیل می‌گه نکتهٔ اصلی دربارهٔ بودجه چی بود؟", note: "*What was the main point about...* درخواست مهم‌ترین ایده‌ست."}
  en.b1.unit19.lesson04.teach.a_under_budget_this_month: {title: "جواب میا", gloss: "میا می‌گه نکتهٔ اصلی این بود که این ماه از بودجه کمتر خرج کردیم.", note: "*The main point was that...* مهم‌ترین ایده رو مشخص می‌کنه."}
  en.b1.unit19.lesson04.teach.q_other_details: {title: "سؤال دنیل", gloss: "دنیل می‌گه خوبه. جزئیات دیگه‌ای هم بود؟", note: "*Were there any other details?* دربارهٔ اطلاعات کوچیک‌تر می‌پرسه."}
  en.b1.unit19.lesson04.teach.a_client_meeting_moved: {title: "جواب میا", gloss: "میا می‌گه فقط یه جزئیات کوچیک -- جلسهٔ مشتری به هفتهٔ بعد منتقل شد.", note: "*Just one small detail...* یه جزئیات کوچیک رو اضافه می‌کنه."}
  en.b1.unit19.lesson04.teach.q_thanks_for_summary: {title: "حرف دنیل", gloss: "دنیل می‌گه ممنون بابت خلاصه. خیلی کمک کرد.", note: "*Thanks for the summary* از یه خلاصهٔ خوب تشکر می‌کنه."}

