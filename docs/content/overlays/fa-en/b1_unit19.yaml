  en.b1.unit19.lesson02.exercise04.reply_summarize_meeting:
    instruction: "دنیل می‌پرسه: جلسه رو از دست دادم. می‌تونی به‌طور خلاصه بگی چی شد؟ جواب رو با «In summary» شروع کنین."
    accepted_answers:
      - {value: "In summary, the meeting covered the budget and the new client.", status: "correct"}
      - {value: "In summary, the meeting covered the budget and the new client", status: "correct"}
    feedback: "In summary, the meeting covered the budget and the new client. یه خلاصهٔ کوتاه‌شده‌ست."
  en.b1.unit19.lesson02.exercise05.write_main_point_under_budget:
    instruction: "بنویسین که نکتهٔ اصلی این بود که این ماه از بودجه کمتر خرج کردین، با شروع جمله با «The main point was that»."
    accepted_answers:
      - {value: "The main point was that we are under budget this month.", status: "correct"}
      - {value: "The main point was that we are under budget this month", status: "correct"}
    feedback: "The main point was that we are under budget this month. مهم‌ترین ایده رو مشخص می‌کنه."

  en.b1.unit19.lesson03.exercise01.comprehend_condensed_summary:
    instruction: "لیلا کدوم نکته‌های اصلی رو توی خلاصهٔ کوتاه‌شدهٔ خودش نگه داشت؟"
    correct_option: "workplace communication works best when messages are clear and short, and when people ask questions instead of guessing"
    distractors: ["workplace communication works best when meetings are long and detailed", "the original article had many examples and background information", "her teacher rewrote the summary in a different order"]
    accepted_answers: [{value: "workplace communication works best when messages are clear and short, and when people ask questions instead of guessing", status: "correct"}]
    feedback: "متن می‌گه: workplace communication works best when messages are clear and short, and when people ask questions instead of guessing."
  en.b1.unit19.lesson03.exercise02.comprehend_left_out_examples:
    instruction: "لیلا چی رو از خلاصه‌اش حذف کرد، چون جزئیات بودن نه نکته‌های اصلی؟"
    correct_option: "she left out most of the examples"
    distractors: ["she left out the main points", "she left out the original article", "she left out her own words"]
    accepted_answers: [{value: "she left out most of the examples", status: "correct"}]
    feedback: "متن می‌گه: she left out most of the examples, since they were details, not main points."
  en.b1.unit19.lesson03.exercise03.recognize_condensed:
    instruction: "کدام کلمه یه خلاصه رو توصیف می‌کنه که کوتاه‌تر شده ولی نکته‌های اصلی رو نگه داشته؟"
    correct_option: "condensed"
    distractors: ["original article", "main point", "detail"]
    accepted_answers: [{value: "condensed", status: "correct"}]
    feedback: "condensed یعنی خلاصه‌شده."
  en.b1.unit19.lesson03.exercise04.order_summary_kept_important_ideas:
    instruction: "کلمات را برای گفتن «خلاصه ایده‌های مهم رو به ترتیب درست نگه داشت.» مرتب کنین."
    accepted_answers: [{value: ["The", "summary", "kept", "the", "important", "ideas", "in", "the", "right", "order"], status: "correct"}]
    feedback: "ترتیب درست: The summary kept the important ideas in the right order."
  en.b1.unit19.lesson03.exercise05.write_summary_workplace_communication:
    instruction: "نکتهٔ اصلی خلاصهٔ لیلا رو بنویسین: این که ارتباطات محیط کار وقتی بهترین نتیجه رو می‌ده که پیام‌ها واضح و کوتاه باشن."
    accepted_answers:
      - {value: "Workplace communication works best when messages are clear and short.", status: "correct"}
      - {value: "Workplace communication works best when messages are clear and short", status: "correct"}
    feedback: "Workplace communication works best when messages are clear and short. نکتهٔ اصلی خلاصه‌ست."

  en.b1.unit19.lesson04.exercise01.listen_in_short_budget_client:
    instruction: "گفتگو را گوش کنین و بگین میا چطور جلسه رو خلاصه کرد."
    correct_option: "In short, we talked about the budget and the new client."
    distractors: ["In short, we talked about the schedule and a new intern.", "In short, we talked about the budget and a delayed report.", "In short, we talked about hiring a new designer."]
    accepted_answers: [{value: "In short, we talked about the budget and the new client.", status: "correct"}]
    feedback: "میا می‌گه: Of course. In short, we talked about the budget and the new client."
  en.b1.unit19.lesson04.exercise02.listen_under_budget_this_month:
    instruction: "گوش کنین و بگین نکتهٔ اصلی دربارهٔ بودجه چی بود."
    correct_option: "we are under budget this month"
    distractors: ["we finished the project this month", "we are over budget this month", "we talked about the schedule this month"]
    accepted_answers: [{value: "we are under budget this month", status: "correct"}]
    feedback: "میا می‌گه: The main point was that we are under budget this month."
  en.b1.unit19.lesson04.exercise03.choose_client_meeting_moved:
    instruction: "میا چه جزئیات کوچیکی دربارهٔ جلسهٔ مشتری می‌گه؟"
    correct_option: "the client meeting was moved to next week"
    distractors: ["the client meeting was cancelled", "the budget meeting was moved to next week", "the client meeting was moved to this week"]
    accepted_answers: [{value: "the client meeting was moved to next week", status: "correct"}]
    feedback: "میا می‌گه: Just one small detail -- the client meeting was moved to next week."
  en.b1.unit19.lesson04.exercise04.order_other_details:
    instruction: "کلمات را برای گفتن «جزئیات دیگه‌ای هم بود؟» مرتب کنین."
    accepted_answers: [{value: ["Were", "there", "any", "other", "details"], status: "correct"}]
    feedback: "ترتیب درست: Were there any other details?"
  en.b1.unit19.lesson04.exercise05.reply_as_mia:
    instruction: "دنیل می‌پرسه: نکتهٔ اصلی دربارهٔ بودجه چی بود؟ به نقش میا جواب بدین."
    accepted_answers:
      - {value: "The main point was that we are under budget this month.", status: "correct"}
      - {value: "The main point was that we are under budget this month", status: "correct"}
    feedback: "این جواب مهم‌ترین ایده رو با «The main point was that» مشخص می‌کنه."
  en.b1.unit19.lesson04.exercise06.speak_summarizing_dialogue:
    instruction: "به نقش دنیل، با صدای بلند به میا جواب بدین."
    accepted_answers:
      - {value: "Thanks for the summary. That's very helpful.", status: "correct"}
      - {value: "Thanks for the summary. That's very helpful", status: "correct"}
    feedback: "این جواب از یه خلاصهٔ خوب تشکر می‌کنه."
