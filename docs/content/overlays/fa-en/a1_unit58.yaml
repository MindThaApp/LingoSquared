    accepted_answers: ["We close at five o'clock", "We close at five o'clock.", "That's twelve dollars", "That's twelve dollars.", "There's a guide near the entrance", "There's a guide near the entrance.", "It's called Colors of the City", "It's called Colors of the City.", "The museum closes at five o'clock", "The museum closes at five o'clock.", "The tickets are twelve dollars", "The tickets are twelve dollars.", "The exhibition is called Colors of the City", "The exhibition is called Colors of the City."]
    feedback: "می‌تونین یکی از جمله‌های مسئول باجه رو تکرار کنین."

