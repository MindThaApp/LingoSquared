          - {left: "exhibition", right: "مجموعه‌ای از آثار هنری یا اشیایی که برای دیدن گذاشتن"}
          - {left: "painting", right: "تصویری که با رنگ کشیده شده"}
          - {left: "sculpture", right: "مجسمه‌ای از سنگ، چوب یا فلز"}
