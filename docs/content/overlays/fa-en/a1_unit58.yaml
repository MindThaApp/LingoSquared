    accepted_answers: [{value: "five o'clock", status: "correct"}]
    feedback: "مسئول باجه می‌گه ساعت پنج می‌بندن."
  en.a1.unit58.lesson03.exercise03.listen_dialogue_exhibition_name:
    instruction: "طبق گفتگو، اسم این نمایشگاه چیه؟"
    correct_option: "Colors of the City"
    distractors: ["The Old City", "Paintings of the City", "Colors of the Park"]
    accepted_answers: [{value: "Colors of the City", status: "correct"}]
    feedback: "مسئول باجه می‌گه اسمش «رنگ‌های شهر»ه."
  en.a1.unit58.lesson03.exercise04.respond_own_museum_statement:
