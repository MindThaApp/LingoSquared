  en.a1.unit58.lesson01.exercise04.order_museum_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["This", "museum", "is", "very", "old."], status: "correct"}]
    feedback: "ترتیب درست: This museum is very old."
  en.a1.unit58.lesson01.exercise05.write_guide:
    instruction: "کلمه‌ای رو بنویسین که یعنی کسی که به بازدیدکننده‌های موزه راهنمایی می‌کنه."
