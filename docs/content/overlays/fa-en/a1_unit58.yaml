iew before shipping, same bar as every other overlay.\n\nfa-en review 2026-10-19: checked notes, glosses, Persian style, distractors, accepted answers, canon and sequencing. 15 fixes: false does-note (open is not third person; subject is) and every-day placement note rewritten; reading gloss said each ticket cost $12 (total is $12); بلیط->بلیت for course consistency; formal است->colloquial; calqued glosses; untaught exhibition-title distractors replaced; added answers. Realization flags (not edited): reading says Mia asked about the guide while the dialogue has Daniel; tested_text 'That's twelve dollars' tense. Native flag: باجه‌دار->مسئول باجه."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit58.museum: {title: "بازدید از موزه"}

lessons:
  en.a1.unit58.lesson01.museum_vocabulary: {title: "کلمات موزه"}
  en.a1.unit58.lesson02.phrases_for_the_museum: {title: "عبارت‌های موزه"}
  en.a1.unit58.lesson03.dialogue_at_the_museum: {title: "گفتگو: در موزه"}
  en.a1.unit58.lesson04.an_afternoon_at_the_museum: {title: "متن: یک بعدازظهر در موزه"}

teaching:
  en.a1.unit58.lesson01.teach.museum: {title: "museum", gloss: "موزه", note: "*museum* یعنی موزه، جایی که آثار هنری و تاریخی رو نگه می‌دارن و مردم میان تماشا می‌کنن.", example_gloss: "این موزه خیلی قدیمیه."}
  en.a1.unit58.lesson01.teach.ticket: {title: "ticket", gloss: "بلیت", note: "*ticket* یعنی بلیت -- کاغذ یا کارتی که برای ورود به یه جا می‌خرین.", example_gloss: "یه بلیت لازم دارم، لطفاً."}
  en.a1.unit58.lesson01.teach.exhibition: {title: "exhibition", gloss: "نمایشگاه", note: "*exhibition* یعنی نمایشگاه -- مجموعه‌ای از آثار هنری یا اشیا که برای دیدن مردم گذاشته شده.", example_gloss: "یه نمایشگاه جدید هست."}
  en.a1.unit58.lesson01.teach.painting: {title: "painting", gloss: "نقاشی", note: "*painting* یعنی نقاشی -- تصویری که با رنگ کشیده شده.", example_gloss: "من این نقاشی رو خیلی دوست دارم."}
  en.a1.unit58.lesson01.teach.sculpture: {title: "sculpture", gloss: "مجسمه", note: "*sculpture* یعنی مجسمه -- اثری که از سنگ، چوب، یا فلز ساخته شده.", example_gloss: "این مجسمه هم خیلی قدیمیه."}
  en.a1.unit58.lesson01.teach.guide: {title: "guide", gloss: "راهنما", note: "*guide* یعنی راهنما -- کسی که به بازدیدکننده‌ها موزه رو نشون می‌ده و توضیح می‌ده.", example_gloss: "امروز راهنما هست؟"}

  en.a1.unit58.lesson02.teach.what_time_does_the_museum_open: {title: "پرسیدن ساعت باز شدن موزه", gloss: "موزه ساعت چند باز می‌شه؟", note: "این سؤال با *what time* شروع می‌شه و فعل کمکی *does* می‌گیره، چون فعل اصلی (*open*) حال ساده‌ست و فاعل (*the museum*) سوم‌شخص مفرده. بعد از *does* فعل اصلی بدون *-s* میاد (does ... open، نه opens)."}
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_close: {title: "پرسیدن ساعت بسته شدن موزه", gloss: "موزه ساعت چند بسته می‌شه؟", note: "مثل سؤال قبلی، فقط با فعل close به‌جای open -- ساختار سؤالی یکسانه."}
  en.a1.unit58.lesson02.teach.two_tickets_please: {title: "درخواست دو بلیت", gloss: "دو تا بلیت، لطفاً.", note: "این یه درخواست مؤدبانه و ساده برای خرید بلیته -- عدد + اسم + please، بدون فعل کامل."}
  en.a1.unit58.lesson02.teach.is_there_a_guide_for_the_exhibition: {title: "پرسیدن دربارهٔ راهنما", gloss: "برای این نمایشگاه راهنما هست؟", note: "*Is there ...?* ساختاری برای پرسیدن دربارهٔ وجود چیزیه."}
  en.a1.unit58.lesson02.teach.the_museum_is_open_every_day: {title: "گفتن ساعت کاری موزه", gloss: "موزه هر روز بازه.", note: "*every day* یعنی هر روز و اینجا آخر جمله میاد (بعد از *is open*). دقت کنین *open* اینجا صفته، یعنی «باز»."}
  en.a1.unit58.lesson02.teach.i_really_enjoyed_the_paintings: {title: "ابراز رضایت از نقاشی‌ها", gloss: "من واقعاً از نقاشی‌ها لذت بردم!", note: "*really enjoyed* یعنی واقعاً لذت بردم -- یه راه طبیعی برای گفتن اینکه از چیزی خیلی خوشمون اومده."}

  en.a1.unit58.lesson03.teach.dialogue_line1: {title: "سؤال دنیل", gloss: "دنیل می‌گه: سلام! موزه ساعت چند بسته می‌شه؟", note: "دنیل گفتگو رو با سلام و سؤال دربارهٔ ساعت بسته شدن موزه شروع می‌کنه."}
  en.a1.unit58.lesson03.teach.dialogue_line2: {title: "جواب مسئول باجه", gloss: "مسئول باجه می‌گه: ساعت پنج می‌بندیم.", note: "*at five o'clock* یعنی ساعت پنج -- حرف اضافهٔ at قبل از ساعت میاد."}
  en.a1.unit58.lesson03.teach.dialogue_line3: {title: "درخواست میا", gloss: "میا می‌گه: عالیه. می‌شه دو تا بلیت بدین، لطفاً؟", note: "*Can we have ...?* یه راه مؤدبانه برای درخواست چیزیه."}
  en.a1.unit58.lesson03.teach.dialogue_line4: {title: "جواب مسئول باجه دربارهٔ قیمت", gloss: "مسئول باجه می‌گه: البته. دوازده دلار می‌شه.", note: "*That's + عدد + dollars* یه راه رایج برای گفتن قیمته."}
  en.a1.unit58.lesson03.teach.dialogue_line5: {title: "سؤال دنیل دربارهٔ راهنما", gloss: "دنیل می‌پرسه: برای این نمایشگاه راهنما هست؟", note: "دنیل بعد از خرید بلیت دربارهٔ راهنما می‌پرسه."}
  en.a1.unit58.lesson03.teach.dialogue_line6: {title: "جواب مسئول باجه دربارهٔ راهنما", gloss: "مسئول باجه می‌گه: بله، یه راهنما نزدیک ورودی هست.", note: "*near the entrance* یعنی نزدیک ورودی -- محل راهنما رو مشخص می‌کنه."}
  en.a1.unit58.lesson03.teach.dialogue_line7: {title: "سؤال میا دربارهٔ اسم نمایشگاه", gloss: "میا می‌پرسه: اسم این نمایشگاه چیه؟", note: "*What is ... called?* یه راه معمول برای پرسیدن اسم چیزیه."}
  en.a1.unit58.lesson03.teach.dialogue_line8: {title: "جواب مسئول باجه دربارهٔ اسم نمایشگاه", gloss: "مسئول باجه می‌گه: اسمش «رنگ‌های شهر»ه.", note: "*It's called ...* یعنی اسمش اینه -- برای معرفی اسم یه چیز به‌کار می‌ره."}
  en.a1.unit58.lesson03.teach.dialogue_line9: {title: "تشکر دنیل", gloss: "دنیل می‌گه: ممنون! خیلی مشتاقم نقاشی‌ها رو ببینم.", note: "*can't wait to* یعنی خیلی مشتاق بودن -- یه راه طبیعی برای نشون دادن هیجانه."}

  en.a1.unit58.lesson04.teach.museum_notice: {title: "متن: اعلامیهٔ موزه", gloss: "موزهٔ شهر: هر روز باز است، از ساعت ۹ تا ۵. بلیت بزرگسال: ۶ دلار. نمایشگاه فعلی: رنگ‌های شهر، اتاق ۲.", note: "این یه اعلامیهٔ رسمی و ساده با ساعت کاری، قیمت بلیت، و اسم نمایشگاهه."}
  en.a1.unit58.lesson04.teach.reading_passage: {title: "متن: یک بعدازظهر در موزه", gloss: "بازدید از موزه: یه شنبه بعدازظهر، دنیل و میا تصمیم گرفتن با هم به موزهٔ شهر برن. دم در، مسئول باجه بهشون گفت موزه ساعت پنج بسته می‌شه. اونا دو تا بلیت خریدن که روی‌هم دوازده دلار شد. دنیل دربارهٔ راهنما پرسید، و مسئول باجه گفت یکی نزدیک ورودیه. اونا از نمایشگاه «رنگ‌های شهر» بازدید کردن و تو اتاق ۲ کلی نقاشی قشنگ دیدن. دنیل یه نقاشی از میدون قدیمی شهر رو دوست داشت، و میا یه نقاشی از رودخونه در غروب رو دوست داشت. موقع رفتن، میا گفت دفعهٔ بعد می‌خواد نمایشگاه مجسمه رو ببینه.", note: "این متن کل داستان بازدید از موزه رو با جزئیات بیشتر تعریف می‌کنه -- همون اتفاقات گفتگوی درس قبل، این بار به شکل نوشتاری."}

