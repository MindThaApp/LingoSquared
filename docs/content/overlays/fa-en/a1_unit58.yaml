    correct_option: "two"
    distractors: ["one", "three", "four"]
    accepted_answers: [{value: "two", status: "correct"}]
    feedback: "متن می‌گه اونا دو تا بلیت خریدن."
  en.a1.unit58.lesson04.exercise05.write_own_museum_message:
    instruction: "یه پیام کوتاه بنویسین: بگین کدوم نمایشگاه رو دیدن، و بگین بلیت‌ها چقدر بود."
    accepted_answers:
      - {value: "They saw Colors of the City. The tickets were twelve dollars.", status: "correct"}
      - {value: "They saw Colors of the City, and the tickets were twelve dollars.", status: "correct"}
      - {value: "They saw Colors of the City. The tickets cost twelve dollars.", status: "correct"}
    feedback: "می‌تونین بگین *They saw Colors of the City. The tickets were twelve dollars.*"
