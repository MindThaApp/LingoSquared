    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["The", "museum", "is", "open", "every", "day."], status: "correct"}]
    feedback: "ترتیب درست: The museum is open every day."
  en.a1.unit58.lesson02.exercise05.translate_two_tickets_please:
    instruction: "ترجمه کنین: «دو تا بلیت، لطفاً.»"
    accepted_answers: [{value: "Two tickets, please.", status: "correct"}, {value: "Two tickets, please", status: "correct"}]
