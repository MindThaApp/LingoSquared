    accepted_answers: [{value: "What time does the museum close?", status: "correct"}]
    feedback: "*What time does the museum close?* یعنی موزه ساعت چند بسته می‌شه؟"
  en.a1.unit58.lesson02.exercise02.choose_opening_time_question:
    instruction: "کدوم عبارت رو یه بازدیدکننده می‌گه تا بپرسه موزه ساعت چند باز می‌شه؟"
    correct_option: "What time does the museum open?"
    distractors: ["What time does the museum close?", "Two tickets, please.", "The museum is open every day."]
    accepted_answers: [{value: "What time does the museum open?", status: "correct"}]
