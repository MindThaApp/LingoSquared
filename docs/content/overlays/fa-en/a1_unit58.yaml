    correct_option: "I really enjoyed the paintings!"
    distractors: ["Two tickets, please.", "Is there a guide for the exhibition?", "The museum is open every day."]
    accepted_answers: [{value: "I really enjoyed the paintings!", status: "correct"}]
    feedback: "*I really enjoyed the paintings!* یعنی من واقعاً از نقاشی‌ها لذت بردم!"
