    distractors: ["The lamp arrived late", "The order has not arrived yet", "The shop sent the wrong lamp"]
    accepted_answers: [{value: "The lamp arrived broken", status: "correct"}]
    feedback: "لیلا می‌گه *The lamp arrived broken*."
  en.a2.unit40.lesson04.exercise02.listen_resolution:
    instruction: "گوش کنید و انتخاب کنید که چراغ جدید کِی فرستاده می‌شه."
    correct_option: "within three working days"
    distractors: ["within one working day", "within five working days", "within two weeks"]
    accepted_answers: [{value: "within three working days", status: "correct"}]
    feedback: "کارمند می‌گه *A new lamp will be sent within three working days*."
  en.a2.unit40.lesson04.exercise03.choose_what_leila_asks_for:
    instruction: "لیلا چی می‌خواد؟"
    correct_option: "a replacement instead of a refund"
    distractors: ["a refund instead of a replacement", "an exchange for a bigger lamp", "a new delivery date"]
    accepted_answers: [{value: "a replacement instead of a refund", status: "correct"}]
    feedback: "لیلا می‌پرسه *Could I have a replacement instead of a refund?*"
  en.a2.unit40.lesson04.exercise04.order_order_number:
    instruction: "کلمه‌ها رو طوری مرتب کنید که «شمارهٔ سفارشم ۸۱۵۴ است» بشه."
