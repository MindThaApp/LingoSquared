  en.a2.unit40.lesson02.exercise04.order_lamp_arrived_broken:
    instruction: "کلمه‌ها رو طوری مرتب کنید که «چراغ شکسته رسید» بشه."
    accepted_answers: [{value: ["The", "lamp", "arrived", "broken"], status: "correct"}]
    feedback: "ترتیب درست *The lamp arrived broken* است."
  en.a2.unit40.lesson02.exercise05.order_ask_replacement:
    instruction: "کلمه‌ها رو طوری مرتب کنید که «می‌تونم به جای بازپرداخت پول، کالای جایگزین بگیرم؟» بشه."
    accepted_answers: [{value: ["Could", "I", "have", "a", "replacement", "instead", "of", "a", "refund"], status: "correct"}]
    feedback: "ترتیب درست *Could I have a replacement instead of a refund* است."
  en.a2.unit40.lesson02.exercise06.reply_ask_replacement:
    instruction: "کارمند می‌پرسه بازپرداخت پول می‌خواین یا کالای جایگزین. مؤدبانه کالای جایگزین رو به جای بازپرداخت پول بخواین."
    accepted_answers:
      - {value: "Could I have a replacement instead of a refund?", status: "correct"}
      - {value: "Could I have a replacement instead of a refund", status: "correct"}
    feedback: "*Could I have a replacement instead of a refund?* همون سؤال این درسه."
  en.a2.unit40.lesson02.exercise07.write_order_problem:
    instruction: "بنویسید که می‌خواین یه مشکل با سفارشتون رو گزارش بدین."
    accepted_answers:
      - {value: "I'd like to report a problem with my order.", status: "correct"}
      - {value: "I'd like to report a problem with my order", status: "correct"}
    feedback: "*I'd like to report a problem with my order* یعنی می‌خواستم یه مشکل با سفارشم رو گزارش بدم."

  en.a2.unit40.lesson03.exercise01.read_what_to_do:
    instruction: "فروشگاه از لیلا می‌خواد با چراغ شکسته چیکار کنه؟"
    correct_option: "put the lamp back in the box"
    distractors: ["keep the lamp at home", "bring the lamp to the shop", "throw the lamp away"]
    accepted_answers: [{value: "put the lamp back in the box", status: "correct"}]
    feedback: "توی پیام نوشته *put the lamp back in the box*."
  en.a2.unit40.lesson03.exercise02.read_where_to_bring_it:
    instruction: "لیلا بسته رو کجا ببره؟"
    correct_option: "to the post office"
    distractors: ["to the shop", "to her neighbor", "to the delivery van"]
    accepted_answers: [{value: "to the post office", status: "correct"}]
    feedback: "توی پیام نوشته *bring it to the post office*."
  en.a2.unit40.lesson03.exercise03.read_when_new_lamp:
    instruction: "چراغ جدید کِی فرستاده می‌شه؟"
    correct_option: "within three working days"
    distractors: ["within one working day", "within five working days", "within one month"]
    accepted_answers: [{value: "within three working days", status: "correct"}]
    feedback: "توی پیام نوشته *within three working days*."
  en.a2.unit40.lesson03.exercise04.choose_order_number:
    instruction: "شمارهٔ سفارش توی پیام چنده؟"
    correct_option: "8154"
    distractors: ["8145", "1854", "8514"]
    accepted_answers: [{value: "8154", status: "correct"}]
    feedback: "پایین پیام نوشته *Order number 8154*."
  en.a2.unit40.lesson03.exercise05.order_new_lamp_sentence:
    instruction: "کلمه‌ها رو طوری مرتب کنید که «یه چراغ جدید ظرف سه روز کاری فرستاده می‌شه» بشه."
    accepted_answers: [{value: ["A", "new", "lamp", "will", "be", "sent", "within", "three", "working", "days"], status: "correct"}]
    feedback: "ترتیب درست *A new lamp will be sent within three working days* است."
  en.a2.unit40.lesson03.exercise06.write_put_it_back:
    instruction: "دستور فروشگاه رو بنویسید، که با Please put شروع می‌شه."
    accepted_answers:
      - {value: "Please put the lamp back in the box and bring it to the post office.", status: "correct"}
      - {value: "Please put the lamp back in the box and bring it to the post office", status: "correct"}
    feedback: "*Please put the lamp back in the box and bring it to the post office* یعنی چراغ رو دوباره توی جعبه بذارید و به ادارهٔ پست ببرید."

  en.a2.unit40.lesson04.exercise01.listen_the_problem:
    instruction: "گفتگو رو گوش کنید و انتخاب کنید که سفارش چه مشکلی داره."
