course:
  title: "انگلیسی A2"
  description: "آموزش انگلیسی سطح A2 برای موقعیت‌های رسمی‌تر، با توضیحات دقیق فارسی."

units:
  en.a2.unit40.online_order_problem: {title: "یک مشکل با سفارش اینترنتی"}

lessons:
  en.a2.unit40.lesson01.online_order_vocabulary: {title: "سفارش، ارسال و بستهٔ آسیب‌دیده"}
  en.a2.unit40.lesson02.explaining_the_problem: {title: "توضیح مشکل و درخواست کالای جایگزین"}
  en.a2.unit40.lesson03.reading_a_return_message: {title: "خواندن پاسخ فروشگاه"}
  en.a2.unit40.lesson04.online_order_dialogue: {title: "تماس دربارهٔ چراغ شکسته"}

teaching:
  en.a2.unit40.lesson01.teach.order: {title: "order", gloss: "سفارش", note: "*order* یعنی خودِ سفارش؛ به عنوان فعل *to order* یعنی سفارش دادن.", example_gloss: "سفارشم دو روز دیرتر رسید."}
  en.a2.unit40.lesson01.teach.delivery: {title: "delivery", gloss: "ارسال", note: "*delivery* یعنی همون لحظه‌ای که سفارشتون به خونه‌تون آورده می‌شه.", example_gloss: "ارسال سه‌شنبه صبح انجام شد."}
  en.a2.unit40.lesson01.teach.parcel: {title: "parcel", gloss: "بسته", note: "*parcel* یعنی همون بستهٔ بسته‌بندی‌شده‌ای که دم در بهتون تحویل می‌دن.", example_gloss: "بسته بیرون، دم در من گذاشته شده بود."}
  en.a2.unit40.lesson01.teach.damaged: {title: "damaged", gloss: "آسیب‌دیده", note: "*damaged* یعنی چیزی توی راه آسیب دیده، ولی شاید هنوز کار کنه -- معمولاً دربارهٔ بسته‌بندی گفته می‌شه.", example_gloss: "جعبه وقتی رسید آسیب‌دیده بود."}
  en.a2.unit40.lesson01.teach.broken: {title: "broken", gloss: "شکسته", note: "*broken* از *damaged* شدیدتره: خودِ کالا دیگه کار نمی‌کنه.", example_gloss: "چراغ داخل بسته شکسته بود."}
  en.a2.unit40.lesson01.teach.replacement: {title: "replacement", gloss: "کالای جایگزین", note: "*replacement* یعنی یه کالای نو به جای کالای خراب؛ *refund* یعنی بازپرداخت پول.", example_gloss: "به جای بازپرداخت پول، کالای جایگزین خواستم."}
  en.a2.unit40.lesson01.teach.grammar_arrived: {title: "arrived و has not arrived yet", gloss: "سفارشم دیروز رسید. سفارشم هنوز نرسیده.", note: "*arrived* رو با یه زمان گذشته می‌گین؛ *has not arrived yet* می‌گه که هنوز هم منتظرین."}

  en.a2.unit40.lesson02.teach.report_order_problem: {title: "گفتن اینکه برای چی زنگ زدین", gloss: "می‌خواستم یه مشکل با سفارشم رو گزارش بدم.", note: "*I'd like to report a problem with...* همون شکل مؤدبانهٔ گزارش دادنه که در واحد ۲۹ برای نشتی یاد گرفتین."}
  en.a2.unit40.lesson02.teach.lamp_arrived_broken: {title: "گفتن اینکه چی خرابه", gloss: "چراغ شکسته رسید.", note: "*arrived broken* یعنی وقتی رسید، از قبل شکسته بود."}
  en.a2.unit40.lesson02.teach.ask_for_replacement: {title: "انتخاب بین کالای جایگزین و بازپرداخت", gloss: "می‌تونم به جای بازپرداخت پول، کالای جایگزین بگیرم؟", note: "*instead of* دو گزینه رو مقابل هم می‌ذاره: اولی رو می‌خواین، نه دومی رو."}
  en.a2.unit40.lesson02.teach.my_order_number: {title: "دادن شمارهٔ سفارش", gloss: "شمارهٔ سفارشم ۸۱۵۴ است.", note: "شمارهٔ سفارشتون رو بلافاصله می‌گین -- کارمند با اون سفارشتون رو پیدا می‌کنه."}
  en.a2.unit40.lesson02.teach.grammar_instead_of: {title: "instead of برای انتخاب کردن", gloss: "می‌تونم به جای بازپرداخت پول، کالای جایگزین بگیرم؟ به جای تعویض کالا، بازپرداخت پول رو ترجیح می‌دم.", note: "بعد از *instead of* همیشه یه اسم می‌آد: *instead of a refund*، نه *instead of get a refund*."}

  en.a2.unit40.lesson03.teach.box: {title: "box", gloss: "جعبه", note: "*box* یعنی همون جعبه‌ای که سفارشتون توشه؛ *parcel* یعنی کل بسته همون‌طور که تحویل داده می‌شه.", example_gloss: "جعبه رو تا رسیدن چراغ جدید نگه دارید."}
  en.a2.unit40.lesson03.teach.return_message: {title: "پاسخ فروشگاه", gloss: "از پیامتون ممنونیم. متأسفیم که چراغ شما شکسته رسیده. لطفاً چراغ رو دوباره توی جعبه بذارید و به ادارهٔ پست ببرید. یه چراغ جدید ظرف سه روز کاری فرستاده می‌شه. شمارهٔ سفارش ۸۱۵۴.", note: "پاسخ خدمات مشتری همیشه سه چیز رو می‌گه: مشکل، کاری که شما باید بکنین، و کاری که اونا انجام می‌دن."}
  en.a2.unit40.lesson03.teach.put_it_back_in_the_box: {title: "کاری که با چراغ شکسته باید بکنین", gloss: "لطفاً چراغ رو دوباره توی جعبه بذارید و به ادارهٔ پست ببرید.", note: "*put ... back in ...* یعنی چیزی رو دوباره سر جای اولش گذاشتن."}

  en.a2.unit40.lesson04.teach.q_report_a_problem: {title: "لیلا به فروشگاه اینترنتی زنگ می‌زنه", gloss: "لیلا می‌گه: سلام، می‌خواستم یه مشکل با سفارشم رو گزارش بدم.", note: "پشت تلفن بلافاصله می‌گین برای چی زنگ زدین."}
  en.a2.unit40.lesson04.teach.a_what_is_the_problem: {title: "کارمند بیشتر می‌پرسه", gloss: "کارمند می‌گه: متأسفم که این رو می‌شنوم. مشکل چیه؟", note: "*I'm sorry to hear that* پاسخ ثابت و مؤدبانهٔ یه کارمند به خبر بده."}
  en.a2.unit40.lesson04.teach.q_lamp_broken_box_damaged: {title: "لیلا مشکل رو توضیح می‌ده", gloss: "لیلا می‌گه: چراغ شکسته رسید. جعبه آسیب‌دیده بود.", note: "به تفاوت دقت کنید: جعبه *damaged* است، چراغ *broken*."}
  en.a2.unit40.lesson04.teach.a_ask_order_number: {title: "کارمند شمارهٔ سفارش رو می‌خواد", gloss: "کارمند می‌گه: متوجه شدم. می‌تونید شمارهٔ سفارشتون رو بهم بگید؟", note: "همون شکل سؤال غیرمستقیم *Could you tell me...?* که در واحد ۳۹ یاد گرفتین."}
  en.a2.unit40.lesson04.teach.q_order_number_8154: {title: "لیلا شمارهٔ سفارشش رو می‌گه", gloss: "لیلا می‌گه: شمارهٔ سفارشم ۸۱۵۴ است.", note: "همون جمله‌ای که در درس دوم یاد گرفتین."}
  en.a2.unit40.lesson04.teach.a_refund_or_replacement: {title: "کارمند دو گزینه پیشنهاد می‌ده", gloss: "کارمند می‌گه: ممنون. بازپرداخت پول می‌خواین یا کالای جایگزین؟", note: "*or* اینجا دو گزینه رو کنار هم می‌ذاره؛ شما یکی رو انتخاب می‌کنین."}
  en.a2.unit40.lesson04.teach.q_replacement_please: {title: "لیلا کالای جایگزین رو انتخاب می‌کنه", gloss: "لیلا می‌گه: می‌تونم به جای بازپرداخت پول، کالای جایگزین بگیرم؟", note: "همون سؤالی که در درس دوم یاد گرفتین."}
  en.a2.unit40.lesson04.teach.a_new_lamp_three_days: {title: "کارمند مشکل رو حل می‌کنه", gloss: "کارمند می‌گه: البته. یه چراغ جدید ظرف سه روز کاری فرستاده می‌شه.", note: "همون قولی که توی پیام درس سوم هم بود."}
  en.a2.unit40.lesson04.teach.q_thank_you: {title: "لیلا تشکر می‌کنه", gloss: "لیلا می‌گه: خیلی ممنون.", note: "*very much* تشکر رو کمی پررنگ‌تر می‌کنه."}

exercises:
  en.a2.unit40.lesson01.exercise01.listen_word:
    instruction: "گوش کنید و کلمه‌ای که گفته شد رو انتخاب کنید."
    correct_option: "delivery"
    distractors: ["parcel", "replacement", "box"]
    accepted_answers: [{value: "delivery", status: "correct"}]
    feedback: "*delivery* یعنی ارسال."
  en.a2.unit40.lesson01.exercise02.choose_damaged_word:
    instruction: "کدوم کلمه یه جعبه رو توصیف می‌کنه که توی راه آسیب دیده، ولی هنوز قابل استفاده‌ست؟"
    correct_option: "damaged"
    distractors: ["broken", "delivery", "replacement"]
    accepted_answers: [{value: "damaged", status: "correct"}]
    feedback: "*damaged* یعنی آسیب‌دیده -- جعبه آسیب‌دیده بود، ولی چراغ داخلش *broken* بود."
  en.a2.unit40.lesson01.exercise03.choose_replacement_word:
    instruction: "کدوم کلمه یعنی یه کالای نو که به جای کالای شکسته براتون فرستاده می‌شه؟"
    correct_option: "replacement"
    distractors: ["refund", "delivery", "parcel"]
    accepted_answers: [{value: "replacement", status: "correct"}]
    feedback: "*replacement* یعنی کالای جایگزین؛ *refund* یعنی بازپرداخت پول."
  en.a2.unit40.lesson01.exercise04.match_online_order_words:
    instruction: "هر معنی رو به کلمهٔ درست انگلیسی وصل کنید."
    accepted_answers:
      - value:
          - {left: "order", right: "the things you asked a shop to send you"}
          - {left: "delivery", right: "the moment your things are brought to your home"}
          - {left: "parcel", right: "the wrapped box that is brought to your door"}
          - {left: "damaged", right: "hurt on the way, but perhaps still usable"}
          - {left: "broken", right: "in pieces, and no longer working"}
          - {left: "replacement", right: "a new item sent in place of a bad one"}
          - {left: "refund", right: "your money given back to you"}
          - {left: "exchange", right: "the same item swapped for a different size or color"}
        status: "correct"
    feedback: "*order*=سفارش، *delivery*=ارسال، *parcel*=بسته، *damaged*=آسیب‌دیده، *broken*=شکسته، *replacement*=کالای جایگزین، *refund*=بازپرداخت پول، *exchange*=تعویض کالا."
  en.a2.unit40.lesson01.exercise05.write_replacement:
    instruction: "کلمه‌ای رو بنویسید که یعنی یه کالای نو که به جای کالای شکسته براتون فرستاده می‌شه."
    accepted_answers:
      - {value: "replacement", status: "correct"}
      - {value: "Replacement", status: "correct"}
    feedback: "*replacement* یعنی کالای جایگزین."

  en.a2.unit40.lesson02.exercise01.listen_the_problem:
    instruction: "گوش کنید و جمله‌ای که گفته شد رو انتخاب کنید."
    correct_option: "The lamp arrived broken"
    distractors: ["My order number is 8154.", "Could I have a replacement instead of a refund?", "I'd like to report a problem with my order."]
    accepted_answers: [{value: "The lamp arrived broken", status: "correct"}]
    feedback: "این یعنی: چراغ شکسته رسید."
  en.a2.unit40.lesson02.exercise02.choose_opening_line:
    instruction: "به یه فروشگاه اینترنتی دربارهٔ یه ارسال خراب زنگ می‌زنین. اول چی می‌گین؟"
    correct_option: "I'd like to report a problem with my order."
    distractors: ["The lamp arrived broken.", "My order number is 8154.", "Could I have a replacement instead of a refund?"]
    accepted_answers: [{value: "I'd like to report a problem with my order.", status: "correct"}]
    feedback: "اول گزارش می‌دین که مشکلی هست؛ جزئیاتش رو بعد توضیح می‌دین."
  en.a2.unit40.lesson02.exercise03.choose_ask_replacement:
    instruction: "یه چراغ جدید می‌خواین، نه پولتون رو. چطور مؤدبانه درخواست می‌کنین؟"
    correct_option: "Could I have a replacement instead of a refund?"
    distractors: ["I'd like to report a problem with my order.", "The lamp arrived broken.", "My order number is 8154."]
    accepted_answers: [{value: "Could I have a replacement instead of a refund?", status: "correct"}]
