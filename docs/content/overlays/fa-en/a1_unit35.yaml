review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit35 (technology/device use), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1, every teaching card with a realization example: has a matching example_gloss:. Contrastive-grammar points, deliberately different from ones already used in this direction: (1) English light-verb collocations around phones must be memorized as fixed units and never translated word-for-word -- make a call = زنگ زدن (nothing is 'made'; ساختن would be wrong), send a text = پیامک فرستادن, take a photo = عکس گرفتن (a lucky match: both languages 'take/گرفتن' a photo, called out so learners see the collocations are arbitrary, sometimes matching and sometimes not); (2) the infinitive of purpose (I use my phone TO CALL my parents) -- Persian expresses this with برای + noun or a که + subjunctive clause, never with a bare infinitive, so 'to + verb' as 'in order to' is a genuinely new structure; also flags that English call takes its person directly with no preposition (call my mom), where Persian needs «به» (به مامانم زنگ می‌زنم). matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, NOT translated Persian lefts -- deliberate, grading-motivated deviation from the older X-en overlay pattern (the compiler copies prompt.pairs from the realization only, so a translated-left answer key can never grade correct; verified against compile output + backend canonical_pairs() this session). Do not 'fix' this back to translated lefts in review. Strong sibling-isolation rule applied -- nl-en/prs-en overlays for this unit were not consulted for content. Needs the mandatory fresh-context review before shipping."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit35.technology: {title: "صحبت دربارهٔ گوشی و اپ‌ها"}

lessons:
  en.a1.unit35.lesson01.device_vocabulary: {title: "گوشی و دستگاه‌های دیگه"}
  en.a1.unit35.lesson02.using_your_phone: {title: "استفاده از گوشی"}
  en.a1.unit35.lesson03.dialogue_new_phone: {title: "گفتگو: یه گوشی قدیمی"}
  en.a1.unit35.lesson04.how_they_use_their_phones: {title: "متن: هر کی با گوشیش چیکار می‌کنه"}

teaching:
  en.a1.unit35.lesson01.teach.phone: {title: "phone", gloss: "گوشی / تلفن", note: "*phone* یعنی گوشی یا تلفن. دقت کنین فعل *call* (زنگ زدن) مفعولش رو مستقیم می‌گیره: *I call my mom* -- بدون هیچ حرف اضافه‌ای؛ فارسی «به» لازم داره (به مامانم زنگ می‌زنم)، انگلیسی نه.", example_gloss: "با گوشیم به مامانم زنگ می‌زنم."}
  en.a1.unit35.lesson01.teach.laptop: {title: "laptop", gloss: "لپ‌تاپ", note: "*laptop* یعنی لپ‌تاپ. الگوی *use ... for* برای گفتن کاربرد یه چیز: *She uses her laptop for work*.", example_gloss: "اون از لپ‌تاپش برای کار استفاده می‌کنه."}
  en.a1.unit35.lesson01.teach.tablet: {title: "tablet", gloss: "تبلت", note: "*tablet* یعنی تبلت. برای چیزی که روی صفحهٔ دستگاه انجام می‌شه، حرف اضافهٔ *on* میاد: *reads books on his tablet*.", example_gloss: "اون روی تبلتش کتاب می‌خونه."}
  en.a1.unit35.lesson01.teach.computer: {title: "computer", gloss: "کامپیوتر", note: "*computer* یعنی کامپیوتر. *at home* یعنی توی خونه: *We have a computer at home*.", example_gloss: "ما خونه یه کامپیوتر داریم."}
  en.a1.unit35.lesson01.teach.app: {title: "app", gloss: "اپ / اپلیکیشن", note: "*app* یعنی اپلیکیشن، برنامه‌ای که روی گوشی یا تبلت نصب می‌کنین. شکل کوتاه‌شدهٔ *application* هست و توی حرف زدن روزمره همیشه همین شکل کوتاهش به‌کار می‌ره.", example_gloss: "یه اپ جدید روی گوشیم دارم."}
  en.a1.unit35.lesson01.teach.camera: {title: "camera", gloss: "دوربین", note: "*camera* یعنی دوربین. برای عکس، انگلیسی هم مثل فارسی از فعل «گرفتن» استفاده می‌کنه: *takes great photos* -- عکس‌های عالی می‌گیره.", example_gloss: "این دوربین عکس‌های عالی می‌گیره."}

  en.a1.unit35.lesson02.teach.make_a_call: {title: "make a call", gloss: "زنگ زدن", note: "*make a call* یعنی زنگ زدن. ترجمهٔ لفظی نکنین -- *make* اینجا «ساختن» نیست! این‌جور ترکیب‌های فعل و اسم توی انگلیسی ثابتن و باید همون‌طوری حفظ بشن.", example_gloss: "هر یکشنبه به داداشم زنگ می‌زنم."}
  en.a1.unit35.lesson02.teach.send_a_text: {title: "send a text", gloss: "پیامک فرستادن", note: "*send a text* یعنی پیامک فرستادن. *text* اینجا اسمه (پیامک)، ولی می‌تونه خودش فعل هم باشه: *I text my sister* یعنی به خواهرم پیامک می‌دم.", example_gloss: "اون هر روز صبح به دوستش پیامک می‌فرسته."}
  en.a1.unit35.lesson02.teach.download_an_app: {title: "download an app", gloss: "اپ دانلود کردن", note: "*download an app* یعنی یه اپ دانلود کردن. قبل از *app* حرف تعریف *an* میاد نه *a*، چون *app* با صدای مصوت شروع می‌شه.", example_gloss: "اون هر هفته یه اپ جدید دانلود می‌کنه."}
  en.a1.unit35.lesson02.teach.wifi: {title: "wifi", gloss: "وای‌فای", note: "*wifi* یعنی وای‌فای، اینترنت بی‌سیم. *The wifi is fast* -- وای‌فای سریعه.", example_gloss: "وای‌فای خونهٔ ما سریعه."}
  en.a1.unit35.lesson02.teach.battery: {title: "battery", gloss: "باتری", note: "*battery* یعنی باتری. *My phone battery is low* -- اینجا *low* (کم) برای باتری به‌کار می‌ره، یعنی باتری داره تموم می‌شه.", example_gloss: "باتری گوشیم داره تموم می‌شه."}
  en.a1.unit35.lesson02.teach.how_use_phone_question: {title: "How do you use your phone?", gloss: "چطور از گوشیت استفاده می‌کنی؟", note: "سؤال با فعل کمکی *do* ساخته می‌شه: *How do you use your phone?* -- فارسی برای سؤال فعل کمکی لازم نداره، ولی انگلیسی بدون *do* غلطه."}

  en.a1.unit35.lesson03.teach.dialogue_line1: {title: "شکایت میا", gloss: "میا می‌گه گوشیش خیلی قدیمیه و واقعاً کنده.", note: "*so old* یعنی خیلی قدیمی -- *so* قبل از صفت برای تأکید میاد."}
  en.a1.unit35.lesson03.teach.dialogue_line2: {title: "پیشنهاد لیلا", gloss: "لیلا می‌گه باید یه گوشی نو بگیره، و می‌پرسه بیشتر برای چی ازش استفاده می‌کنه.", note: "*You should...* برای پیشنهاد و توصیه به‌کار می‌ره: *You should get a new one* -- و *one* اینجا جای تکرار *phone* رو می‌گیره."}
  en.a1.unit35.lesson03.teach.dialogue_line3: {title: "جواب میا", gloss: "میا می‌گه بیشتر به خواهرش پیامک می‌ده و عکس می‌گیره.", note: "*mostly* یعنی بیشتر / اغلب. دقت کنین *text* اینجا مستقیم فعله: *I text my sister*."}
  en.a1.unit35.lesson03.teach.dialogue_line4: {title: "جواب لیلا", gloss: "لیلا می‌گه هر آخر هفته با گوشیش به پدر و مادرش زنگ می‌زنه و از کلی اپ هم استفاده می‌کنه.", note: "*I use my phone to call my parents* -- اینجا *to call* یعنی «برای زنگ زدن»: مصدر با *to* هدف رو نشون می‌ده. فارسی این رو با «برای» یا جملهٔ التزامی می‌گه، نه با مصدر خالی."}
  en.a1.unit35.lesson03.teach.dialogue_line5: {title: "سؤال میا", gloss: "میا می‌پرسه از کدوم اپ‌ها استفاده می‌کنه.", note: "*Which apps do you use?* -- سؤال با *which* یعنی «کدوم»، وقتی از بین چند گزینهٔ مشخص انتخاب می‌شه."}
  en.a1.unit35.lesson03.teach.dialogue_line6: {title: "جواب لیلا", gloss: "لیلا می‌گه از یه اپ آشپزی و یه اپ نقشه استفاده می‌کنه، و می‌پرسه میا می‌خواد دانلودشون کنه؟", note: "*a cooking app* و *a map app* -- توی انگلیسی یه اسم می‌تونه مثل صفت قبل از اسم دیگه بیاد: *cooking app* یعنی اپ آشپزی."}
  en.a1.unit35.lesson03.teach.dialogue_line7: {title: "جواب میا", gloss: "میا می‌گه آره، لطفاً اسم‌هاشون رو براش بفرسته!", note: "*send me the names* -- اول شخص (*me*) بعد چیز (*the names*)، بدون حرف اضافه."}

  en.a1.unit35.lesson04.teach.reading_passage: {title: "متن: دنیل، لیلا و میا", gloss: "دنیل، لیلا و میا هر کدوم یه جور از گوشی‌شون استفاده می‌کنن. دنیل پیامک دادن دوست نداره؛ ترجیح می‌ده به‌جاش به مردم زنگ بزنه. لیلا از گوشیش برای نقشه و یه اپ آشپزی موقع امتحان کردن دستورهای جدید استفاده می‌کنه. میا کلی عکس می‌گیره و برای خانواده‌ش می‌فرسته. هر سه برای کار از لپ‌تاپ استفاده می‌کنن و آخر هفته‌ها با دوستاشون تماس تصویری می‌گیرن.", note: "دقت کنین به الگوهای *prefers to call*، *uses her phone for maps* و *video chat with friends* -- هر فعل با ساختار خودش."}

exercises:
  en.a1.unit35.lesson01.exercise01.listen_device:
    instruction: "گوش کنین و دستگاهی که گفته شد رو انتخاب کنین."
    correct_option: "tablet"
    distractors: ["phone", "laptop", "computer", "camera"]
    accepted_answers: [{value: "tablet", status: "correct"}]
    feedback: "*tablet* یعنی تبلت."
  en.a1.unit35.lesson01.exercise02.choose_app_meaning:
    instruction: "کدوم کلمه یعنی برنامه‌ای که روی گوشی یا تبلت نصب می‌کنین؟"
    correct_option: "app"
    distractors: ["camera", "laptop", "tablet"]
    accepted_answers: [{value: "app", status: "correct"}]
    feedback: "*app* یعنی اپلیکیشن، برنامه‌ای که دانلود و نصب می‌شه."
  en.a1.unit35.lesson01.exercise03.match_devices:
    instruction: "هر توضیح انگلیسی رو به کلمهٔ درستش وصل کنین."
    accepted_answers: [{value: [{left: "a device you use to call or text people", right: "phone"}, {left: "a portable computer you can carry around", right: "laptop"}, {left: "a flat touchscreen device for reading, browsing, or watching videos", right: "tablet"}, {left: "a machine used for work, email, and browsing the internet", right: "computer"}, {left: "a program you download onto a phone or tablet", right: "app"}, {left: "a device or part of a phone that takes photos", right: "camera"}], status: "correct"}]
    feedback: "phone=گوشی، laptop=لپ‌تاپ، tablet=تبلت، computer=کامپیوتر، app=اپ، camera=دوربین."
  en.a1.unit35.lesson01.exercise04.order_laptop_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["She", "uses", "her", "laptop", "for", "work."], status: "correct"}]
    feedback: "ترتیب درست: *She uses her laptop for work.* -- الگوی *use ... for* برای کاربرد."
  en.a1.unit35.lesson01.exercise05.write_app_word:
    instruction: "کلمه‌ای رو بنویسین که یعنی برنامه‌ای که روی گوشی یا تبلت نصب می‌کنین."
    accepted_answers: [{value: "app", status: "correct"}]
    feedback: "*app* یعنی اپلیکیشن."

  en.a1.unit35.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "download an app"
    distractors: ["make a call", "send a text", "look something up online"]
    accepted_answers: [{value: "download an app", status: "correct"}]
    feedback: "*download an app* یعنی یه اپ دانلود کردن."
  en.a1.unit35.lesson02.exercise02.choose_wifi_meaning:
    instruction: "کدوم کلمه یعنی اینترنت بی‌سیم؟"
    correct_option: "wifi"
    distractors: ["battery", "app", "camera"]
    accepted_answers: [{value: "wifi", status: "correct"}]
    feedback: "*wifi* یعنی وای‌فای، اینترنت بی‌سیم."
  en.a1.unit35.lesson02.exercise03.choose_battery_meaning:
    instruction: "کدوم کلمه یعنی قسمتی از گوشی که برق رو نگه می‌داره؟"
    correct_option: "battery"
    distractors: ["wifi", "camera", "app"]
    accepted_answers: [{value: "battery", status: "correct"}]
    feedback: "*battery* یعنی باتری."
  en.a1.unit35.lesson02.exercise04.order_text_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["She", "sends", "a", "text", "to", "her", "friend", "every", "morning."], status: "correct"}]
    feedback: "ترتیب درست: *She sends a text to her friend every morning.*"
  en.a1.unit35.lesson02.exercise05.translate_how_use_phone:
    instruction: "ترجمه کنین: «چطور از گوشیت استفاده می‌کنی؟»"
    accepted_answers: [{value: "How do you use your phone?", status: "correct"}, {value: "How do you use your phone", status: "correct"}]
    feedback: "*How do you use your phone?* -- سؤال با فعل کمکی *do* ساخته می‌شه."

  en.a1.unit35.lesson03.exercise01.comprehension_mia_uses:
    instruction: "طبق گفتگو، میا بیشتر با گوشیش چیکار می‌کنه؟"
    correct_option: "text her sister and take photos"
    distractors: ["call her brother every day", "watch videos", "play games"]
    accepted_answers: [{value: "text her sister and take photos", status: "correct"}]
    feedback: "میا می‌گه بیشتر به خواهرش پیامک می‌ده و عکس می‌گیره."
  en.a1.unit35.lesson03.exercise02.comprehension_leila_calls:
    instruction: "طبق گفتگو، لیلا هر آخر هفته به کی زنگ می‌زنه؟"
    correct_option: "her parents"
    distractors: ["her sister", "her friend", "her brother"]
    accepted_answers: [{value: "her parents", status: "correct"}]
    feedback: "لیلا می‌گه هر آخر هفته به پدر و مادرش زنگ می‌زنه."
  en.a1.unit35.lesson03.exercise03.listen_dialogue_apps:
    instruction: "طبق گفتگو، لیلا از کدوم دو تا اپ اسم می‌بره؟"
    correct_option: "a cooking app and a map app"
    distractors: ["a music app and a game app", "a photo app and a news app", "a weather app and a sports app"]
    accepted_answers: [{value: "a cooking app and a map app", status: "correct"}]
    feedback: "لیلا می‌گه از یه اپ آشپزی و یه اپ نقشه استفاده می‌کنه."
  en.a1.unit35.lesson03.exercise04.respond_own_use:
    instruction: "یکی از کارهایی که با گوشیتون انجام می‌دین رو بگین."
    accepted_answers: ["I text my friends", "I text my friends.", "I call my parents", "I call my parents.", "I use a cooking app", "I use a cooking app.", "I take a lot of photos", "I take a lot of photos.", "I look things up online", "I look things up online.", "I download apps", "I download apps."]
    feedback: "می‌تونین از الگوهای *I text...*، *I call...*، *I use...*، *I take photos* استفاده کنین."

  en.a1.unit35.lesson04.exercise01.reading_daniel_prefers:
    instruction: "طبق متن، دنیل به‌جای پیامک دادن ترجیح می‌ده چیکار کنه؟"
    correct_option: "call people"
    distractors: ["text people", "send photos", "download apps"]
    accepted_answers: [{value: "call people", status: "correct"}]
    feedback: "متن می‌گه دنیل ترجیح می‌ده به مردم زنگ بزنه: *he prefers to call people instead.*"
  en.a1.unit35.lesson04.exercise02.reading_leila_app:
    instruction: "طبق متن، لیلا موقع امتحان کردن دستورهای غذایی جدید از چی استفاده می‌کنه؟"
    correct_option: "a cooking app"
    distractors: ["a map app", "a photo app", "her laptop"]
    accepted_answers: [{value: "a cooking app", status: "correct"}]
    feedback: "متن می‌گه لیلا برای دستورهای جدید از یه اپ آشپزی استفاده می‌کنه."
  en.a1.unit35.lesson04.exercise03.reading_mia_photos:
    instruction: "طبق متن، میا چی رو زیاد می‌گیره و برای خانواده‌ش می‌فرسته؟"
    correct_option: "photos"
    distractors: ["texts", "apps", "videos"]
    accepted_answers: [{value: "photos", status: "correct"}]
    feedback: "متن می‌گه میا کلی عکس می‌گیره و برای خانواده‌ش می‌فرسته."
  en.a1.unit35.lesson04.exercise04.write_own_phone_sentence:
    instruction: "یه جمله دربارهٔ استفاده‌تون از گوشی بنویسین، با *I call*، *I text* یا *I use an app*."
    accepted_answers: ["I call my friends", "I call my friends.", "I text my friends", "I text my friends.", "I use an app", "I use an app.", "I use a map app", "I use a map app."]
    feedback: "می‌تونین از الگوی *I call...*، *I text...* یا *I use an app* استفاده کنین."
