review: {status: "reviewed", required_next_reviewer: null, notes: "New overlay against the shared English realization unit35 (technology/device use), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1, every teaching card with a realization example: has a matching example_gloss:. Contrastive-grammar points, deliberately different from ones already used in this direction: (1) English light-verb collocations around phones must be memorized as fixed units and never translated word-for-word -- make a call = زنگ زدن (nothing is 'made'; ساختن would be wrong), send a text = پیامک فرستادن, take a photo = عکس گرفتن (a lucky match: both languages 'take/گرفتن' a photo, called out so learners see the collocations are arbitrary, sometimes matching and sometimes not); (2) the infinitive of purpose (I use my phone TO CALL my parents) -- Persian expresses this with برای + noun or a که + subjunctive clause, never with a bare infinitive, so 'to + verb' as 'in order to' is a genuinely new structure; also flags that English call takes its person directly with no preposition (call my mom), where Persian needs «به» (به مامانم زنگ می‌زنم). matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, NOT translated Persian lefts -- deliberate, grading-motivated deviation from the older X-en overlay pattern (the compiler copies prompt.pairs from the realization only, so a translated-left answer key can never grade correct; verified against compile output + backend canonical_pairs() this session). Do not 'fix' this back to translated lefts in review. Strong sibling-isolation rule applied -- nl-en/prs-en overlays for this unit were not consulted for content. Needs the mandatory fresh-context review before shipping.\n\nfa-en review 2026-10-19: realization + overlay read in full (notes, glosses, distractors, accepted answers, canon, sequencing, ZWNJ). 11 fixes: phone/computer matching rights were an example fragment / bare translation (now definitions), tablet right register; camera + send-me notes clarified; reading gloss/feedback 'به مردم' calque; untaught distractors (look something up online, music/game app) replaced; accepted answers widened in both open tasks. Native flag: 'make a call to my brother' stilted (realization, already flagged). Shared-en r2 review 2026-10-22: answer lists and wording follow the realization change (reading Leila sentence split into two natural sentences ('uses her phone for maps. She also uses a cooking app'))."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit35.technology: {title: "صحبت دربارهٔ گوشی و اپ‌ها"}

lessons:
  en.a1.unit35.lesson01.device_vocabulary: {title: "گوشی و دستگاه‌های دیگه"}
  en.a1.unit35.lesson02.using_your_phone: {title: "استفاده از گوشی"}
  en.a1.unit35.lesson03.dialogue_new_phone: {title: "گفتگو: یه گوشی قدیمی"}
  en.a1.unit35.lesson04.how_they_use_their_phones: {title: "متن: هر کی با گوشیش چیکار می‌کنه"}

teaching:
  en.a1.unit35.lesson01.teach.phone: {title: "phone", gloss: "گوشی / تلفن", note: "*phone* یعنی گوشی یا تلفن. دقت کنین فعل *call* (زنگ زدن) مفعولش رو مستقیم می‌گیره: *I call my mom* -- بدون هیچ حرف اضافه‌ای؛ فارسی «به» لازم داره (به مامانم زنگ می‌زنم)، انگلیسی نه.", example_gloss: "با گوشیم به مامانم زنگ می‌زنم."}
  en.a1.unit35.lesson01.teach.laptop: {title: "laptop", gloss: "لپ‌تاپ", note: "*laptop* یعنی لپ‌تاپ. الگوی *use ... for* برای گفتن کاربرد یه چیز: *She uses her laptop for work*.", example_gloss: "اون از لپ‌تاپش برای کار استفاده می‌کنه."}
  en.a1.unit35.lesson01.teach.tablet: {title: "tablet", gloss: "تبلت", note: "*tablet* یعنی تبلت. برای چیزی که روی صفحهٔ دستگاه انجام می‌شه، حرف اضافهٔ *on* میاد: *reads books on his tablet*.", example_gloss: "اون روی تبلتش کتاب می‌خونه."}
  en.a1.unit35.lesson01.teach.computer: {title: "computer", gloss: "کامپیوتر", note: "*computer* یعنی کامپیوتر. *at home* یعنی توی خونه: *We have a computer at home*.", example_gloss: "ما خونه یه کامپیوتر داریم."}
  en.a1.unit35.lesson01.teach.app: {title: "app", gloss: "اپ / اپلیکیشن", note: "*app* یعنی اپلیکیشن، برنامه‌ای که روی گوشی یا تبلت نصب می‌کنین. شکل کوتاه‌شدهٔ *application* هست و توی حرف زدن روزمره همیشه همین شکل کوتاهش به‌کار می‌ره.", example_gloss: "یه اپ جدید روی گوشیم دارم."}
  en.a1.unit35.lesson01.teach.camera: {title: "camera", gloss: "دوربین", note: "*camera* یعنی دوربین. برای عکس، انگلیسی هم مثل فارسی فعل «گرفتن» (*take*) رو به‌کار می‌بره: *takes great photos* -- عکس‌های عالی می‌گیره.", example_gloss: "این دوربین عکس‌های عالی می‌گیره."}

  en.a1.unit35.lesson02.teach.make_a_call: {title: "make a call", gloss: "زنگ زدن", note: "*make a call* یعنی زنگ زدن. ترجمهٔ لفظی نکنین -- *make* اینجا «ساختن» نیست! این‌جور ترکیب‌های فعل و اسم توی انگلیسی ثابتن و باید همون‌طوری حفظ بشن.", example_gloss: "هر یکشنبه به داداشم زنگ می‌زنم."}
  en.a1.unit35.lesson02.teach.send_a_text: {title: "send a text", gloss: "پیامک فرستادن", note: "*send a text* یعنی پیامک فرستادن. *text* اینجا اسمه (پیامک)، ولی می‌تونه خودش فعل هم باشه: *I text my sister* یعنی به خواهرم پیامک می‌دم.", example_gloss: "اون هر روز صبح به دوستش پیامک می‌فرسته."}
  en.a1.unit35.lesson02.teach.download_an_app: {title: "download an app", gloss: "اپ دانلود کردن", note: "*download an app* یعنی یه اپ دانلود کردن. قبل از *app* حرف تعریف *an* میاد نه *a*، چون *app* با صدای مصوت شروع می‌شه.", example_gloss: "اون هر هفته یه اپ جدید دانلود می‌کنه."}
  en.a1.unit35.lesson02.teach.wifi: {title: "wifi", gloss: "وای‌فای", note: "*wifi* یعنی وای‌فای، اینترنت بی‌سیم. *The wifi is fast* -- وای‌فای سریعه.", example_gloss: "وای‌فای خونهٔ ما سریعه."}
  en.a1.unit35.lesson02.teach.battery: {title: "battery", gloss: "باتری", note: "*battery* یعنی باتری. *My phone battery is low* -- اینجا *low* (کم) برای باتری به‌کار می‌ره، یعنی باتری داره تموم می‌شه.", example_gloss: "باتری گوشیم داره تموم می‌شه."}
  en.a1.unit35.lesson02.teach.how_use_phone_question: {title: "How do you use your phone?", gloss: "چطور از گوشیت استفاده می‌کنی؟", note: "سؤال با فعل کمکی *do* ساخته می‌شه: *How do you use your phone?* -- فارسی برای سؤال فعل کمکی لازم نداره، ولی انگلیسی بدون *do* غلطه."}

  en.a1.unit35.lesson03.teach.dialogue_line1: {title: "شکایت میا", gloss: "میا می‌گه گوشیش خیلی قدیمیه و واقعاً کنده.", note: "*so old* یعنی خیلی قدیمی -- *so* قبل از صفت برای تأکید میاد."}
  en.a1.unit35.lesson03.teach.dialogue_line2: {title: "پیشنهاد لیلا", gloss: "لیلا می‌گه باید یه گوشی نو بگیره، و می‌پرسه بیشتر برای چی ازش استفاده می‌کنه.", note: "*You should...* برای پیشنهاد و توصیه به‌کار می‌ره: *You should get a new one* -- و *one* اینجا جای تکرار *phone* رو می‌گیره."}
  en.a1.unit35.lesson03.teach.dialogue_line3: {title: "جواب میا", gloss: "میا می‌گه بیشتر به خواهرش پیامک می‌ده و عکس می‌گیره.", note: "*mostly* یعنی بیشتر / اغلب. دقت کنین *text* اینجا مستقیم فعله: *I text my sister*."}
  en.a1.unit35.lesson03.teach.dialogue_line4: {title: "جواب لیلا", gloss: "لیلا می‌گه هر آخر هفته با گوشیش به پدر و مادرش زنگ می‌زنه و از کلی اپ هم استفاده می‌کنه.", note: "*I use my phone to call my parents* -- اینجا *to call* یعنی «برای زنگ زدن»: مصدر با *to* هدف رو نشون می‌ده. فارسی این رو با «برای» یا جملهٔ التزامی می‌گه، نه با مصدر خالی."}
  en.a1.unit35.lesson03.teach.dialogue_line5: {title: "سؤال میا", gloss: "میا می‌پرسه از کدوم اپ‌ها استفاده می‌کنه.", note: "*Which apps do you use?* -- سؤال با *which* یعنی «کدوم»، وقتی از بین چند گزینهٔ مشخص انتخاب می‌شه."}
  en.a1.unit35.lesson03.teach.dialogue_line6: {title: "جواب لیلا", gloss: "لیلا می‌گه از یه اپ آشپزی و یه اپ نقشه استفاده می‌کنه، و می‌پرسه میا می‌خواد دانلودشون کنه؟", note: "*a cooking app* و *a map app* -- توی انگلیسی یه اسم می‌تونه مثل صفت قبل از اسم دیگه بیاد: *cooking app* یعنی اپ آشپزی."}
  en.a1.unit35.lesson03.teach.dialogue_line7: {title: "جواب میا", gloss: "میا می‌گه آره، لطفاً اسم‌هاشون رو براش بفرسته!", note: "*send me the names* -- اول کسی که چیزی رو می‌گیره (*me*)، بعد خود اون چیز (*the names*)، بدون حرف اضافه."}

  en.a1.unit35.lesson04.teach.reading_passage: {title: "متن: دنیل، لیلا و میا", gloss: "دنیل، لیلا و میا هر کدوم یه جور از گوشی‌شون استفاده می‌کنن. دنیل پیامک دادن رو دوست نداره؛ ترجیح می‌ده به‌جاش به آدما زنگ بزنه. لیلا از گوشیش برای نقشه استفاده می‌کنه. اون موقع امتحان کردن دستورهای جدید از یه اپ آشپزی هم استفاده می‌کنه. میا کلی عکس می‌گیره و برای خانواده‌ش می‌فرسته. هر سه برای کار از لپ‌تاپ استفاده می‌کنن و آخر هفته‌ها با دوستاشون تماس تصویری می‌گیرن.", note: "دقت کنین به الگوهای *prefers to call*، *uses her phone for maps* و *video chat with friends* -- هر فعل با ساختار خودش."}

exercises:
  en.a1.unit35.lesson01.exercise01.listen_device:
    instruction: "گوش کنین و دستگاهی که گفته شد رو انتخاب کنین."
    correct_option: "tablet"
    distractors: ["phone", "laptop", "computer", "camera"]
    accepted_answers: [{value: "tablet", status: "correct"}]
    feedback: "*tablet* یعنی تبلت."
  en.a1.unit35.lesson01.exercise02.choose_app_meaning:
    instruction: "کدوم کلمه یعنی برنامه‌ای که روی گوشی یا تبلت نصب می‌کنین؟"
    correct_option: "app"
    distractors: ["camera", "laptop", "tablet"]
    accepted_answers: [{value: "app", status: "correct"}]
    feedback: "*app* یعنی اپلیکیشن، برنامه‌ای که دانلود و نصب می‌شه."
