course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح پیشرفته‌تر (B2) برای فارسی‌زبان‌ها، با تمرکز بر استدلال، حدس زدن بر اساس شواهد، ظریف‌تر حرف زدن و تأکید درست."

units:
  en.b2.unit03.hedging_emphasis: {title: "منطقی به نظر می‌رسه، اما..."}

lessons:
  en.b2.unit03.lesson01.stance_words: {title: "محتاط کردن، محدود کردن و تأکید"}
  en.b2.unit03.lesson02.modulating_claims: {title: "seems reasonable و does create work"}
  en.b2.unit03.lesson03.reading_nuanced_feedback: {title: "متن: حمایت با شرط"}
  en.b2.unit03.lesson04.the_nuance_dialogue: {title: "در کل مفیده، به شرطی که..."}

teaching:
  en.b2.unit03.lesson01.teach.hedge: {title: "hedge", gloss: "محتاط‌تر گفتن، نرم‌تر کردن ادعا", note: "hedge یعنی ادعا را کمتر قطعی بگین؛ در انگلیسی کاری، این کار معمولاً نشانهٔ دقت و ادب است.", example_gloss: "لیلا با seems ادعاش دربارهٔ سیاست را محتاط‌تر می‌کنه."}
  en.b2.unit03.lesson01.teach.qualify: {title: "qualify", gloss: "محدود کردن ادعا با شرط یا قید", note: "qualify یعنی یک جمله را کامل مطلق نگین و شرط، محدودیت یا استثنا اضافه کنین.", example_gloss: "عبارت «به شرطی که توافق کنیم» حمایت لیلا را مشروط می‌کنه."}
  en.b2.unit03.lesson01.teach.emphasize: {title: "emphasize", gloss: "تأکید کردن، برجسته کردن", note: "emphasize یعنی یک بخش پیام را قوی‌تر یا برجسته‌تر کنین.", example_gloss: "دنیل روی مسئلهٔ حجم کار تأکید می‌کنه."}
  en.b2.unit03.lesson01.teach.to_some_extent: {title: "to some extent", gloss: "تا حدی", note: "to some extent یعنی بخشی از حرف درست است، اما کامل و مطلق نیست.", example_gloss: "تا حدی، این سیاست به نگرانی‌های تیم جواب می‌ده."}
  en.b2.unit03.lesson01.teach.broadly: {title: "broadly", gloss: "در کل، به طور کلی", note: "broadly موافقت کلی را نشان می‌ده، اما جا برای استثنا می‌ذاره.", example_gloss: "این پیشنهاد در کل مفیده، هرچند کامل نیست."}
  en.b2.unit03.lesson01.teach.provided: {title: "provided", gloss: "به شرطی که", note: "provided یک شرط لازم را معرفی می‌کنه؛ از if رسمی‌تر و فشرده‌تره.", example_gloss: "می‌تونیم از این سیاست حمایت کنیم، به شرطی که توافق کنیم."}

  en.b2.unit03.lesson02.teach.seems_but_does: {title: "The policy seems reasonable, but it does create extra work for the team.", gloss: "این سیاست منطقی به نظر می‌رسه، اما واقعاً برای تیم کار اضافه ایجاد می‌کنه.", note: "seems ادعا را نرم‌تر می‌کنه؛ does قبل از فعل اصلی تأکید می‌سازه. در فارسی معادل دستوری جدا برای does نداریم و معمولاً با «واقعاً» یا لحن ترجمه می‌شه."}
  en.b2.unit03.lesson02.teach.what_worries_me: {title: "What worries me is the extra work for the team.", gloss: "چیزی که نگرانم می‌کنه، کار اضافه برای تیمه.", note: "What worries me is... توجه را روی یک نگرانی خاص می‌ذاره. ترتیب جمله را فارسی‌وار نکنین."}
  en.b2.unit03.lesson02.teach.broadly_provided: {title: "It is broadly useful, provided the timeline is adjusted.", gloss: "در کل مفیده، به شرطی که زمان‌بندی تنظیم بشه.", note: "provided یک شرط لازم اضافه می‌کنه؛ یعنی حمایت کامل و بی‌قید نیست."}
  en.b2.unit03.lesson02.teach.grammar_stance: {title: "نرم کردن و تأکید کردن ادعا", gloss: "seems، broadly و to some extent ادعا را کمتر مطلق می‌کنن؛ do/does قبل از فعل اصلی تأکید می‌سازه.", note: "فارسی‌زبان‌ها گاهی does را حذف می‌کنن چون معادل مستقیم فارسی نداره؛ اما در انگلیسی B2 جملهٔ it does create یعنی «واقعاً ایجاد می‌کنه»."}

  en.b2.unit03.lesson03.teach.overall: {title: "overall", gloss: "در مجموع، در کل", note: "overall یعنی وقتی کل تصویر را نگاه می‌کنیم، نه تک‌تک جزئیات.", example_gloss: "در مجموع، لیلا از سیاست حمایت می‌کنه."}
  en.b2.unit03.lesson03.teach.condition: {title: "condition", gloss: "شرط", note: "condition یعنی چیزی که باید برقرار باشه تا حرف یا توافق درست بمونه.", example_gloss: "شرط او اینه که زمان‌بندی باید تنظیم بشه."}
  en.b2.unit03.lesson03.teach.reading_passage: {title: "متن: بازخورد ظریف", gloss: "بازخورد لیلا مثبته، اما با دقت مشروط شده. اون می‌گه سیاست جدید بررسی در مجموع منطقی به نظر می‌رسه؛ این ادعا رو محتاط‌تر می‌کنه و نمی‌ذاره مطلق به نظر بیاد. اون همچنین می‌گه این سیاست در کل مفیده، به شرطی که زمان‌بندی تنظیم بشه. اون شرط حمایت لیلا رو محدود می‌کنه: لیلا سیاست رو دقیقاً همون‌طور که نوشته شده قبول نمی‌کنه. دنیل با یک ساختار تمرکزی روی نکتهٔ دیگری تأکید می‌کنه: چیزی که نگرانش می‌کنه، کار اضافه برای تیمه. هر دو نفر در اصل از سیاست حمایت می‌کنن، اما زبانشون سطح‌های متفاوتی از تعهد رو نشون می‌ده.", note: "اینجا هدف ترجمهٔ کلمه‌به‌کلمه نیست؛ ببینین هر عبارت چطور شدت و قطعیت جمله را تغییر می‌ده."}

  en.b2.unit03.lesson04.teach.q_policy_seems: {title: "Leila", gloss: "سیاست جدید بررسی در مجموع منطقی به نظر می‌رسه.", note: "seems و overall هر دو جمله را کمتر مطلق می‌کنن."}
  en.b2.unit03.lesson04.teach.a_not_fully_ready: {title: "Daniel", gloss: "این کمی محتاطانه به نظر میاد. منظورت اینه که کاملاً آماده نیست؟", note: "Daniel متوجه hedge شده و می‌پرسه منظور دقیق لیلا چیه."}
  en.b2.unit03.lesson04.teach.q_workable_deadlines: {title: "Leila", gloss: "دقیقاً. ممکنه قابل اجرا باشه، اما به مهلت‌های روشن‌تر نیاز داره.", note: "may be workable حمایت محتاطانه است، نه تأیید کامل."}
  en.b2.unit03.lesson04.teach.a_what_worries: {title: "Daniel", gloss: "موافقم. چیزی که نگرانم می‌کنه، کار اضافه برای تیمه.", note: "What worries me is... نگرانی اصلی را جلو میاره."}
  en.b2.unit03.lesson04.teach.q_does_create_checks: {title: "Leila", gloss: "دقیقاً. این سیاست واقعاً بررسی‌های کیفیت بهتری ایجاد می‌کنه، اما یک مرحلهٔ تأیید دیگر هم اضافه می‌کنه.", note: "does create تأکیدی است؛ یعنی لیلا نکتهٔ مثبت را واقعاً قبول دارد."}
  en.b2.unit03.lesson04.teach.a_support_conditions: {title: "Daniel", gloss: "پس باید با شرط ازش حمایت کنیم؟", note: "with conditions یعنی حمایت کامل نیست؛ شرط داره."}
  en.b2.unit03.lesson04.teach.q_broadly_useful: {title: "Leila", gloss: "بله. می‌گم در کل مفیده، به شرطی که زمان‌بندی تنظیم بشه.", note: "I would say جمله را کمی محتاط‌تر و حرفه‌ای‌تر می‌کنه."}
  en.b2.unit03.lesson04.teach.same_content_triad: {title: "عادی / محتاطانه / تأکیدی", gloss: "این سیاست کار اضافه ایجاد می‌کنه. این سیاست به نظر می‌رسه کار اضافه ایجاد می‌کنه. این سیاست واقعاً کار اضافه ایجاد می‌کنه.", note: "سه جمله یک محتوا دارن، اما شدت‌شون فرق داره: عادی، محتاطانه، تأکیدی."}

exercises:
  en.b2.unit03.lesson01.exercise01.choose_hedge:
    instruction: "کدام کلمه یعنی یک ادعا را محتاط‌تر یا کمتر مطلق بگین؟"
    correct_option: "hedge"
    distractors: ["emphasize", "provided", "condition"]
    accepted_answers: [{value: "hedge", status: "correct"}]
    feedback: "hedge یعنی ادعا را نرم‌تر و کمتر قطعی بیان کردن."
  en.b2.unit03.lesson01.exercise02.choose_emphasize:
    instruction: "کدام کلمه یعنی یک بخش پیام را قوی‌تر یا برجسته‌تر کنین؟"
    correct_option: "emphasize"
    distractors: ["hedge", "qualify", "broadly"]
    accepted_answers: [{value: "emphasize", status: "correct"}]
    feedback: "emphasize یعنی تأکید کردن."
  en.b2.unit03.lesson01.exercise03.match_stance_terms:
    instruction: "هر کلمه یا عبارت را به نقش درستش در ظریف‌تر گفتن وصل کنین."
    accepted_answers: [{value: [{left: "make a claim more cautious", right: "hedge"}, {left: "limit a claim by adding a condition or restriction", right: "qualify"}, {left: "make one part of a message stronger", right: "emphasize"}, {left: "show that a claim is partly, but not completely, true", right: "to some extent"}, {left: "show general agreement while leaving room for exceptions", right: "broadly"}, {left: "introduce a condition that must be met", right: "provided"}], status: "correct"}]
    feedback: "hedge نرم می‌کنه، qualify محدود می‌کنه، emphasize برجسته می‌کنه، provided شرط میاره."
  en.b2.unit03.lesson01.exercise04.write_to_some_extent:
    instruction: "عبارتی را بنویسین که یعنی «تا حدی، نه کاملاً»."
    accepted_answers:
      - {value: "to some extent", status: "correct"}
      - {value: "To some extent", status: "correct"}
    feedback: "to some extent یعنی تا حدی."
  en.b2.unit03.lesson01.exercise05.write_provided:
    instruction: "کلمه‌ای را بنویسین که شرط لازم را معرفی می‌کنه."
    accepted_answers:
      - {value: "provided", status: "correct"}
      - {value: "Provided", status: "correct"}
    feedback: "provided یعنی به شرطی که."

  en.b2.unit03.lesson02.exercise01.choose_hedged_claim:
    instruction: "کدام عبارت ادعا را محتاط‌تر می‌کنه، نه مطلق؟"
    correct_option: "The policy seems reasonable"
    distractors: ["The policy is reasonable", "it does create extra work for the team", "What worries me is the extra work"]
    accepted_answers: [{value: "The policy seems reasonable", status: "correct"}]
    feedback: "seems جمله را از «هست» قطعی به «به نظر می‌رسه» محتاط‌تر می‌بره."
  en.b2.unit03.lesson02.exercise02.choose_emphatic_do:
    instruction: "کدام عبارت از does برای تأکید روی جمله استفاده می‌کنه؟"
    correct_option: "it does create extra work for the team"
    distractors: ["The policy seems reasonable", "It is broadly useful", "provided the timeline is adjusted"]
    accepted_answers: [{value: "it does create extra work for the team", status: "correct"}]
    feedback: "does قبل از create یعنی واقعاً ایجاد می‌کنه."
  en.b2.unit03.lesson02.exercise03.order_what_worries_me:
    instruction: "کلمات را برای گفتن «چیزی که نگرانم می‌کنه، کار اضافه برای تیمه» مرتب کنین."
    accepted_answers: [{value: ["What", "worries", "me", "is", "the", "extra", "work", "for", "the", "team"], status: "correct"}]
    feedback: "ترتیب درست: What worries me is the extra work for the team."
  en.b2.unit03.lesson02.exercise04.reply_hedged_policy:
    instruction: "با seems ادعا را نرم‌تر کنین و با does روی کار اضافه تأکید کنین."
    accepted_answers:
      - {value: "The policy seems reasonable, but it does create extra work for the team.", status: "correct"}
      - {value: "The policy seems reasonable but it does create extra work for the team.", status: "correct"}
      - {value: "The policy seems reasonable, but it does add extra work for the team.", status: "correct"}
      - {value: "The policy seems reasonable but it does add extra work for the team.", status: "correct"}
    feedback: "هر دو بخش لازم‌اند: seems برای نرم کردن، does برای تأکید."
  en.b2.unit03.lesson02.exercise05.write_broadly_provided:
    instruction: "این جملهٔ مشروط را بنویسین: It is broadly useful, provided the timeline is adjusted."
    accepted_answers:
      - {value: "It is broadly useful, provided the timeline is adjusted.", status: "correct"}
      - {value: "It is broadly useful provided the timeline is adjusted.", status: "correct"}
    feedback: "broadly حمایت کلی می‌ده؛ provided شرط لازم را اضافه می‌کنه."

  en.b2.unit03.lesson03.exercise01.choose_hedge:
    instruction: "کدام عبارت ادعای لیلا دربارهٔ سیاست بررسی را محتاط‌تر می‌کنه؟"
    correct_option: "seems reasonable overall"
    distractors: ["provided the timeline is adjusted", "what worries him is", "in principle"]
    accepted_answers: [{value: "seems reasonable overall", status: "correct"}]
    feedback: "seems reasonable overall یعنی منطقی به نظر می‌رسه، نه اینکه بی‌قید و شرط منطقیه."
  en.b2.unit03.lesson03.exercise02.choose_condition:
    instruction: "کدام عبارت حمایت لیلا را با اضافه کردن شرط محدود می‌کنه؟"
    correct_option: "provided the timeline is adjusted"
    distractors: ["seems reasonable overall", "broadly useful", "what worries him is"]
    accepted_answers: [{value: "provided the timeline is adjusted", status: "correct"}]
    feedback: "provided the timeline is adjusted شرط حمایت را می‌گه."
  en.b2.unit03.lesson03.exercise03.match_nuance_functions:
    instruction: "هر عبارت را به ظرافتی که اضافه می‌کنه وصل کنین."
    accepted_answers: [{value: [{left: "makes the positive judgment less absolute", right: "seems reasonable overall"}, {left: "shows general support with possible exceptions", right: "broadly useful"}, {left: "adds a condition to the support", right: "provided the timeline is adjusted"}, {left: "puts focus on one concern", right: "what worries him is"}, {left: "supports the idea but not necessarily every detail", right: "in principle"}], status: "correct"}]
    feedback: "هر عبارت شدت یا محدودهٔ حمایت را عوض می‌کنه."
  en.b2.unit03.lesson03.exercise04.write_hedged_claim:
    instruction: "The review policy is reasonable را با seems و overall محتاط‌تر بازنویسی کنین."
    accepted_answers:
      - {value: "The review policy seems reasonable overall.", status: "correct"}
      - {value: "The review policy seems reasonable overall", status: "correct"}
      - {value: "Overall, the review policy seems reasonable.", status: "correct"}
      - {value: "Overall, the review policy seems reasonable", status: "correct"}
    feedback: "seems و overall جمله را کمتر مطلق می‌کنن."
  en.b2.unit03.lesson03.exercise05.write_focus_construction:
    instruction: "این جملهٔ تمرکزی را بنویسین: What worries him is the extra work for the team."
    accepted_answers:
      - {value: "What worries him is the extra work for the team.", status: "correct"}
      - {value: "What worries him is the extra work for the team", status: "correct"}
    feedback: "What worries him is... توجه را روی یک نگرانی خاص می‌ذاره."

  en.b2.unit03.lesson04.exercise01.choose_leila_hedge:
    instruction: "کدام عبارت نشان می‌ده لیلا قضاوت مثبتش را محتاط‌تر بیان می‌کنه؟"
    correct_option: "seems reasonable overall"
    distractors: ["does create better quality checks", "support it with conditions", "provided the timeline is adjusted"]
    accepted_answers: [{value: "seems reasonable overall", status: "correct"}]
    feedback: "seems reasonable overall یک hedge است."
  en.b2.unit03.lesson04.exercise02.listen_emphasis:
    instruction: "گوش کنین و عبارتی را انتخاب کنین که با does تأکید می‌سازه."
    correct_option: "The policy does create better quality checks"
    distractors: ["The policy removes the approval step", "The deadline is already final", "The team rejected the policy"]
    accepted_answers: [{value: "The policy does create better quality checks", status: "correct"}]
    feedback: "does create یعنی واقعاً ایجاد می‌کنه."
  en.b2.unit03.lesson04.exercise03.order_broadly_useful:
    instruction: "کلمات را برای گفتن «در کل مفیده، به شرطی که زمان‌بندی تنظیم بشه» مرتب کنین."
    accepted_answers: [{value: ["it", "is", "broadly", "useful", "provided", "the", "timeline", "is", "adjusted"], status: "correct"}]
    feedback: "ترتیب درست: it is broadly useful provided the timeline is adjusted."
  en.b2.unit03.lesson04.exercise04.reply_as_leila:
    instruction: "به سؤال «یعنی کاملاً آماده نیست؟» با جملهٔ لیلا جواب بدین."
    accepted_answers:
      - {value: "It may be workable, but it needs clearer deadlines.", status: "correct"}
      - {value: "It may be workable but it needs clearer deadlines.", status: "correct"}
      - {value: "Exactly. It may be workable, but it needs clearer deadlines.", status: "correct"}
      - {value: "Exactly. It may be workable but it needs clearer deadlines.", status: "correct"}
    feedback: "may be workable حمایت محتاطانه است؛ needs clearer deadlines شرط/مشکل را روشن می‌کنه."
  en.b2.unit03.lesson04.exercise05.speak_nuanced_support:
    instruction: "به نقش لیلا، با صدای بلند بگین در کل مفیده، به شرطی که زمان‌بندی تنظیم بشه."
    accepted_answers:
      - {value: "I would say it is broadly useful, provided the timeline is adjusted.", status: "correct"}
    feedback: "I would say جمله را محتاط‌تر می‌کنه؛ provided شرط را میاره."
  en.b2.unit03.lesson04.exercise06.write_same_content_triad:
    instruction: "همان ایده را سه جور بنویسین: جملهٔ عادی، جمله با seems to، و جمله با does. The policy creates extra work. The policy seems to create extra work. The policy does create extra work."
    accepted_answers:
      - {value: "The policy creates extra work. The policy seems to create extra work. The policy does create extra work.", status: "correct"}
    feedback: "سه جمله از نظر محتوا نزدیکن، اما شدت‌شون فرق می‌کنه."
  en.b2.unit03.lesson04.exercise07.speak_same_content_triad:
    instruction: "با صدای بلند همان ایده را سه جور بگین: جملهٔ عادی، جمله با seems to، و جمله با does."
    accepted_answers:
      - {value: "The policy creates extra work. The policy seems to create extra work. The policy does create extra work.", status: "correct"}
    feedback: "این تمرین تفاوت ظریف بین جملهٔ عادی، جملهٔ محتاطانه، و جملهٔ تأکیدی را می‌سازه."
