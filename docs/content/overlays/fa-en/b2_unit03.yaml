course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح پیشرفته‌تر (B2) برای فارسی‌زبان‌ها، با تمرکز بر استدلال، حدس زدن بر اساس شواهد، ظریف‌تر حرف زدن و تأکید درست."

units:
  en.b2.unit03.hedging_emphasis: {title: "منطقی به نظر می‌رسه، اما..."}

lessons:
  en.b2.unit03.lesson01.stance_words: {title: "محتاط کردن، محدود کردن و تأکید"}
  en.b2.unit03.lesson02.modulating_claims: {title: "seems reasonable و does create work"}
  en.b2.unit03.lesson03.reading_nuanced_feedback: {title: "متن: حمایت با شرط"}
  en.b2.unit03.lesson04.the_nuance_dialogue: {title: "در کل مفیده، به شرطی که..."}

teaching:
  en.b2.unit03.lesson01.teach.hedge: {title: "hedge", gloss: "محتاط‌تر گفتن، نرم‌تر کردن ادعا", note: "hedge یعنی ادعا رو کمتر قطعی بگین؛ در انگلیسی کاری، این کار معمولاً نشانهٔ دقت و ادبه.", example_gloss: "لیلا با seems ادعاش دربارهٔ سیاست رو محتاط‌تر می‌کنه."}
  en.b2.unit03.lesson01.teach.qualify: {title: "qualify", gloss: "محدود کردن ادعا با شرط یا قید", note: "qualify یعنی یک جمله رو کامل مطلق نگین و شرط، محدودیت یا استثنا اضافه کنین.", example_gloss: "عبارت «به شرطی که توافق کنیم» حمایت لیلا رو مشروط می‌کنه."}
  en.b2.unit03.lesson01.teach.emphasize: {title: "emphasize", gloss: "تأکید کردن، برجسته کردن", note: "emphasize یعنی یک بخش پیام رو قوی‌تر یا برجسته‌تر کنین.", example_gloss: "دنیل روی مسئلهٔ حجم کار تأکید می‌کنه."}
  en.b2.unit03.lesson01.teach.to_some_extent: {title: "to some extent", gloss: "تا حدی", note: "to some extent یعنی بخشی از حرف درسته، اما کامل و مطلق نیست.", example_gloss: "تا حدی، این سیاست به نگرانی‌های تیم جواب می‌ده."}
  en.b2.unit03.lesson01.teach.broadly: {title: "broadly", gloss: "در کل، به طور کلی", note: "broadly موافقت کلی رو نشون می‌ده، اما جا برای استثنا می‌ذاره.", example_gloss: "این پیشنهاد در کل مفیده، هرچند کامل نیست."}
  en.b2.unit03.lesson01.teach.provided: {title: "provided", gloss: "به شرطی که", note: "provided یک شرط لازم رو معرفی می‌کنه؛ از if رسمی‌تر و فشرده‌تره.", example_gloss: "می‌تونیم از این سیاست حمایت کنیم، به شرطی که توافق کنیم."}

  en.b2.unit03.lesson02.teach.seems_but_does: {title: "The policy seems reasonable, but it does create extra work for the team.", gloss: "این سیاست منطقی به نظر می‌رسه، اما واقعاً برای تیم کار اضافه ایجاد می‌کنه.", note: "seems ادعا رو نرم‌تر می‌کنه؛ does قبل از فعل اصلی تأکید می‌سازه. در فارسی معادل دستوری جدا برای does نداریم و معمولاً با «واقعاً» یا لحن ترجمه می‌شه."}
  en.b2.unit03.lesson02.teach.what_worries_me: {title: "What worries me is the extra work for the team.", gloss: "چیزی که نگرانم می‌کنه، کار اضافه برای تیمه.", note: "What worries me is... توجه رو روی یک نگرانی خاص می‌ذاره. ترتیب جمله رو فارسی‌وار نکنین."}
  en.b2.unit03.lesson02.teach.broadly_provided: {title: "It is broadly useful, provided the timeline is adjusted.", gloss: "در کل مفیده، به شرطی که زمان‌بندی تنظیم بشه.", note: "provided یک شرط لازم اضافه می‌کنه؛ یعنی حمایت کامل و بی‌قید نیست."}
  en.b2.unit03.lesson02.teach.grammar_stance: {title: "نرم کردن و تأکید کردن ادعا", gloss: "seems، broadly و to some extent ادعا رو کمتر مطلق می‌کنن؛ do/does قبل از فعل اصلی تأکید می‌سازه.", note: "فارسی‌زبان‌ها گاهی does رو حذف می‌کنن چون معادل مستقیم فارسی نداره؛ اما در انگلیسی جملهٔ it does create یعنی «واقعاً ایجاد می‌کنه»."}

  en.b2.unit03.lesson03.teach.overall: {title: "overall", gloss: "در مجموع، در کل", note: "overall یعنی وقتی کل تصویر رو نگاه می‌کنیم، نه تک‌تک جزئیات.", example_gloss: "در مجموع، لیلا از سیاست حمایت می‌کنه."}
  en.b2.unit03.lesson03.teach.condition: {title: "condition", gloss: "شرط", note: "condition یعنی چیزی که باید برقرار باشه تا حرف یا توافق درست بمونه.", example_gloss: "شرط اون اینه که زمان‌بندی باید تنظیم بشه."}
  en.b2.unit03.lesson03.teach.reading_passage: {title: "متن: بازخورد ظریف", gloss: "بازخورد لیلا مثبته، اما با دقت مشروط شده. اون می‌گه سیاست جدید بررسی در مجموع منطقی به نظر می‌رسه؛ این ادعا رو محتاط‌تر می‌کنه و نمی‌ذاره مطلق به نظر بیاد. اون هم می‌گه این سیاست در کل مفیده، به شرطی که زمان‌بندی تنظیم بشه. اون شرط حمایت لیلا رو محدود می‌کنه: لیلا سیاست رو دقیقاً همون‌طور که نوشته شده قبول نمی‌کنه. دنیل با یک ساختار تمرکزی روی نکتهٔ دیگری تأکید می‌کنه: چیزی که نگرانش می‌کنه، کار اضافه برای تیمه. هر دو نفر در اصل از سیاست حمایت می‌کنن، اما زبانشون سطح‌های متفاوتی از تعهد رو نشون می‌ده.", note: "اینجا هدف ترجمهٔ کلمه‌به‌کلمه نیست؛ ببینین هر عبارت چطور شدت و قطعیت جمله رو تغییر می‌ده."}

  en.b2.unit03.lesson04.teach.q_policy_seems: {title: "Leila", gloss: "سیاست جدید بررسی در مجموع منطقی به نظر می‌رسه.", note: "seems و overall هر دو جمله رو کمتر مطلق می‌کنن."}
  en.b2.unit03.lesson04.teach.a_not_fully_ready: {title: "Daniel", gloss: "این کمی محتاطانه به نظر میاد. منظورت اینه که کاملاً آماده نیست؟", note: "Daniel متوجه hedge شده و می‌پرسه منظور دقیق لیلا چیه."}
  en.b2.unit03.lesson04.teach.q_workable_deadlines: {title: "Leila", gloss: "دقیقاً. ممکنه قابل اجرا باشه، اما به مهلت‌های روشن‌تر نیاز داره.", note: "may be workable حمایت محتاطانه‌ست، نه تأیید کامل."}
  en.b2.unit03.lesson04.teach.a_what_worries: {title: "Daniel", gloss: "موافقم. چیزی که نگرانم می‌کنه، کار اضافه برای تیمه.", note: "What worries me is... نگرانی اصلی رو جلو میاره."}
  en.b2.unit03.lesson04.teach.q_does_create_checks: {title: "Leila", gloss: "حرف منطقی‌ایه. این سیاست واقعاً بررسی‌های کیفیت بهتری ایجاد می‌کنه، اما یک مرحلهٔ تأیید دیگه هم اضافه می‌کنه.", note: "does create تأکیدیه؛ یعنی لیلا نکتهٔ مثبت رو واقعاً قبول داره."}
  en.b2.unit03.lesson04.teach.a_support_conditions: {title: "Daniel", gloss: "پس باید با شرط ازش حمایت کنیم؟", note: "with conditions یعنی حمایت کامل نیست؛ شرط داره."}
  en.b2.unit03.lesson04.teach.q_broadly_useful: {title: "Leila", gloss: "بله. می‌گم در کل مفیده، به شرطی که زمان‌بندی تنظیم بشه.", note: "I would say جمله رو کمی محتاط‌تر و حرفه‌ای‌تر می‌کنه."}
  en.b2.unit03.lesson04.teach.same_content_triad: {title: "عادی / محتاطانه / تأکیدی", gloss: "این سیاست کار اضافه ایجاد می‌کنه. این سیاست به نظر می‌رسه کار اضافه ایجاد می‌کنه. این سیاست واقعاً کار اضافه ایجاد می‌کنه.", note: "سه جمله یک محتوا دارن، اما شدت‌شون فرق داره: عادی، محتاطانه، تأکیدی."}

