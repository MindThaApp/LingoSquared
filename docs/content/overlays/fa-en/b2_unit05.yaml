course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح پیشرفته‌تر (B2) برای فارسی‌زبان‌ها، با تمرکز روی روایت زمان، لحن، ایده‌های انتزاعی، مذاکره و ترکیب منابع."

units:
  en.b2.unit05.register: {title: "یک پیام، چند لحن"}

lessons:
  en.b2.unit05.lesson01.audience_and_formality: {title: "خودمانی، حرفه‌ای و رسمی"}
  en.b2.unit05.lesson02_same_request_three_ways: {title: "Can you، could we، I would be grateful"}
  en.b2.unit05.lesson03.reading_same_message: {title: "متن: سه مخاطب"}
  en.b2.unit05.lesson04.the_register_dialogue: {title: "برای دوست بله، برای کلینیک نه"}

teaching:
  en.b2.unit05.lesson01.teach.register: {title: "register", gloss: "لحن و درجهٔ رسمی بودن", note: "در انگلیسی، register بیشتر با جمله‌بندی و عبارت‌ها عوض می‌شه، نه فقط با ضمیر. فارسی شما/تو دارد، اما انگلیسی برای رسمی‌تر شدن به Could، I would be grateful و ساختار غیرمستقیم تکیه می‌کنه.", example_gloss: "وقتی مخاطب عوض می‌شه، لحن پیام هم عوض می‌شه."}
  en.b2.unit05.lesson01.teach.casual: {title: "casual", gloss: "خودمانی، مناسب دوست نزدیک", note: "casual برای دوست یا فضای غیررسمیه. جملهٔ مستقیم مثل Can you move it? اینجا طبیعی‌تره.", example_gloss: "یک پیام خودمانی برای دوست مناسبه."}
  en.b2.unit05.lesson01.teach.professional: {title: "professional", gloss: "حرفه‌ای، مناسب همکار", note: "professional نه خیلی خشک است نه خیلی خودمانی؛ often uses could و عبارتی مثل if that still works for you.", example_gloss: "یک پیام حرفه‌ای برای همکار مناسبه."}
  en.b2.unit05.lesson01.teach.formal: {title: "formal", gloss: "رسمی، مناسب سازمان یا نهاد", note: "formal در انگلیسی معمولاً با جمله‌بندی غیرمستقیم‌تر میاد. فقط گفتن please همیشه کافی نیست.", example_gloss: "یک پیام رسمی برای یک نهاد مناسبه."}
  en.b2.unit05.lesson01.teach.audience: {title: "audience", gloss: "مخاطب، گیرندهٔ پیام", note: "audience یعنی کسی یا گروهی که پیام را دریافت می‌کنه؛ انتخاب عبارت به مخاطب بستگی داره.", example_gloss: "مخاطب شما روی انتخاب کلمه اثر می‌ذاره."}
  en.b2.unit05.lesson01.teach.institution: {title: "institution", gloss: "نهاد، سازمان", note: "institution مثل کلینیک، بانک یا دانشگاه است؛ در این موقعیت‌ها انگلیسی معمولاً رسمی‌تر از پیام به دوست می‌شه.", example_gloss: "کلینیک یک نهاد است."}

  en.b2.unit05.lesson02.teach.formal_request: {title: "I would be grateful if you could confirm whether my appointment can be moved.", gloss: "ممنون می‌شم اگر تأیید کنین که آیا امکان جابه‌جایی وقت من هست یا نه.", note: "این رسمی بودن با I would be grateful if you could و whether ساخته می‌شه. فارسی شاید فقط با «لطفاً» و «شما» رسمی بشه، اما انگلیسی اینجا ساختار کامل می‌خواد."}
  en.b2.unit05.lesson02.teach.casual_request: {title: "Can you move it to Friday?", gloss: "می‌تونی بندازیش جمعه؟", note: "برای دوست طبیعی و مستقیمه؛ برای کلینیک زیادی خودمانی و کوتاه شنیده می‌شه."}
  en.b2.unit05.lesson02.teach.professional_request: {title: "Could we move the appointment to Friday if that still works for you?", gloss: "می‌شه وقت رو به جمعه منتقل کنیم، اگر هنوز برای شما مناسبه؟", note: "Could we و if that still works for you جمله را حرفه‌ای و ملاحظه‌کار می‌کنن."}
  en.b2.unit05.lesson02.teach.to_whom: {title: "Dear scheduling team,", gloss: "تیم زمان‌بندی عزیز،", note: "Dear ... شروع استاندارد ایمیل رسمی/نیمه‌رسمیه؛ در انگلیسی برای سازمان‌ها طبیعی‌تر از سلام خیلی خودمانیه."}
  en.b2.unit05.lesson02.teach.grammar_register_shift: {title: "تغییر لحن بدون تغییر محتوا", gloss: "محتوا ثابت می‌مونه، اما برای دوست جمله مستقیم، برای همکار could، و برای نهاد I would be grateful if you could طبیعی‌تره.", note: "دام فارسی‌زبان‌ها اینه که فکر کنن رسمی بودن فقط با you/please حل می‌شه؛ در انگلیسی جمله‌بندی اصل ماجراست."}

  en.b2.unit05.lesson03.teach.stiff: {title: "stiff", gloss: "خشک و زیادی رسمی", note: "stiff یعنی پیام برای موقعیت بیش از حد رسمی و غیرطبیعی به نظر میاد.", example_gloss: "یک پیام خشک برای دوست نزدیک زیادی رسمی شنیده می‌شه."}
  en.b2.unit05.lesson03.teach.appropriate: {title: "appropriate", gloss: "مناسب، جور با موقعیت", note: "appropriate یعنی عبارت با مخاطب و موقعیت می‌خونه.", example_gloss: "پیام مناسب با مخاطب جور درمیاد."}
  en.b2.unit05.lesson03.teach.reading_passage: {title: "متن: سه مخاطب", gloss: "نینا باید وقتش را به جمعه منتقل کنه. به دوستش می‌نویسه: Can you move it to Friday? پیام مستقیم و خودمانیه. به همکارش می‌نویسه: Could we move the appointment to Friday if that still works for you? پیام حرفه‌ای و مؤدبانه است. به کلینیک می‌نویسه: I would be grateful if you could confirm whether my appointment can be moved to Friday. محتوا در هر سه متن یکیه، اما لحن با مخاطب عوض می‌شه.", note: "به جای ترجمهٔ ضمیر، به شکل درخواست دقت کنین: Can you، Could we، I would be grateful if you could."}

  en.b2.unit05.lesson04.teach.q_need_ask: {title: "Nina", gloss: "باید دربارهٔ جابه‌جایی وقتم سؤال کنم. می‌تونم فقط بنویسم: «Can you move it?»", note: "Could I just write یعنی آیا همین عبارت ساده کافی است؟"}
  en.b2.unit05.lesson04.teach.a_too_casual: {title: "Oscar", gloss: "برای دوست، بله. برای کلینیک، این زیادی خودمانی به نظر میاد.", note: "Yes و No در این درس باید به عنوان رشتهٔ انگلیسی دقیق دیده بشن؛ جواب کوتاه در فارسی با «بله/نه» یکی نیست."}
  en.b2.unit05.lesson04.teach.q_colleague: {title: "Nina", gloss: "به یک همکار چی می‌نویسی؟", note: "colleague یعنی همکار، نه دوست نزدیک."}
  en.b2.unit05.lesson04.teach.a_colleague_request: {title: "Oscar", gloss: "می‌نویسم: «Could we move the appointment to Friday if that still works for you?»", note: "این جمله حرفه‌ایه چون هم درخواست می‌کنه هم حق انتخاب طرف مقابل رو نگه می‌داره."}
  en.b2.unit05.lesson04.teach.q_clinic: {title: "Nina", gloss: "و به کلینیک؟", note: "مخاطب سازمانیه، پس لحن رسمی‌تر می‌شه."}
  en.b2.unit05.lesson04.teach.a_clinic_request: {title: "Oscar", gloss: "می‌نویسم: «I would be grateful if you could confirm whether my appointment can be moved to Friday.»", note: "این نسخه کمتر مستقیمه و برای نهاد مناسب‌تره."}
  en.b2.unit05.lesson04.teach.q_same_message: {title: "Nina", gloss: "همون پیام، لحن متفاوت.", note: "same message یعنی محتوای اصلی عوض نشده."}
  en.b2.unit05.lesson04.teach.a_content_stays: {title: "Oscar", gloss: "دقیقاً. محتوا ثابت می‌مونه، اما سطح رسمی بودن تغییر می‌کنه.", note: "level of formality یعنی درجهٔ رسمی بودن."}

exercises:
  en.b2.unit05.lesson01.exercise01.choose_register:
    instruction: "کدام کلمه یعنی درجهٔ رسمی بودن که برای یک مخاطب انتخاب می‌کنین؟"
    correct_option: "register"
    distractors: ["audience", "institution", "casual"]
    accepted_answers: [{value: "register", status: "correct"}]
    feedback: "register یعنی لحن و سطح رسمی بودن."
  en.b2.unit05.lesson01.exercise02.choose_institution:
    instruction: "کدام کلمه به سازمانی مثل کلینیک، بانک یا دانشگاه اشاره می‌کنه؟"
    correct_option: "institution"
    distractors: ["audience", "register", "colleague"]
    accepted_answers: [{value: "institution", status: "correct"}]
    feedback: "institution یعنی نهاد یا سازمان."
  en.b2.unit05.lesson01.exercise03.match_register_terms:
    instruction: "هر کلمهٔ مربوط به لحن را به معنی درستش وصل کنین."
    accepted_answers: [{value: [{left: "level of formality", right: "register"}, {left: "appropriate for a close friend", right: "casual"}, {left: "appropriate for a colleague", right: "professional"}, {left: "appropriate for an institution", right: "formal"}, {left: "the person or group receiving the message", right: "audience"}, {left: "an organization such as a clinic or university", right: "institution"}], status: "correct"}]
    feedback: "در انگلیسی، تفاوت لحن بیشتر با عبارت‌سازی مشخص می‌شه."
  en.b2.unit05.lesson01.exercise04.write_formal:
    instruction: "کلمه‌ای را بنویسین که یعنی مناسب یک نهاد یا سازمان."
    accepted_answers:
      - {value: "formal", status: "correct"}
      - {value: "Formal", status: "correct"}
    feedback: "formal یعنی رسمی."
  en.b2.unit05.lesson01.exercise05.write_casual:
    instruction: "کلمه‌ای را بنویسین که یعنی مناسب دوست نزدیک."
    accepted_answers:
      - {value: "casual", status: "correct"}
      - {value: "Casual", status: "correct"}
    feedback: "casual یعنی خودمانی."

  en.b2.unit05.lesson02.exercise01_choose_formal:
    instruction: "کدام جمله نسخهٔ رسمی مناسب یک نهاد است؟"
    correct_option: "I would be grateful if you could confirm whether my appointment can be moved."
    distractors: ["Can you move it to Friday?", "Could we move the appointment to Friday if that still works for you?", "Dear scheduling team,"]
    accepted_answers: [{value: "I would be grateful if you could confirm whether my appointment can be moved.", status: "correct"}]
    feedback: "I would be grateful if you could... درخواست را رسمی و غیرمستقیم می‌کنه."
  en.b2.unit05.lesson02.exercise02_choose_casual:
    instruction: "کدام جمله نسخهٔ خودمانی مناسب دوست است؟"
    correct_option: "Can you move it to Friday?"
    distractors: ["I would be grateful if you could confirm whether my appointment can be moved.", "Could we move the appointment to Friday if that still works for you?", "Dear scheduling team,"]
    accepted_answers: [{value: "Can you move it to Friday?", status: "correct"}]
    feedback: "Can you... مستقیم و برای دوست طبیعی است."
  en.b2.unit05.lesson02.exercise03_order_formal_request:
    instruction: "کلمات را برای ساختن درخواست رسمی مرتب کنین."
    accepted_answers: [{value: ["I", "would", "be", "grateful", "if", "you", "could", "confirm", "whether", "my", "appointment", "can", "be", "moved"], status: "correct"}]
    feedback: "ترتیب درست: I would be grateful if you could confirm whether my appointment can be moved."
  en.b2.unit05.lesson02.exercise04_reply_professional:
    instruction: "نسخهٔ حرفه‌ای برای همکار را دقیق بنویسین: Could we move the appointment to Friday if that still works for you?"
    accepted_answers:
      - {value: "Could we move the appointment to Friday if that still works for you?", status: "correct"}
      - {value: "Could we move the appointment to Friday, if that still works for you?", status: "correct"}
    feedback: "Could we... if that still works for you برای همکار مؤدبانه و طبیعی است."
  en.b2.unit05.lesson02.exercise05_write_formal_request:
    instruction: "نسخهٔ رسمی برای نهاد را دقیق بنویسین: I would be grateful if you could confirm whether my appointment can be moved to Friday."
    accepted_answers:
      - {value: "I would be grateful if you could confirm whether my appointment can be moved to Friday.", status: "correct"}
      - {value: "I would be grateful if you could confirm whether my appointment can be moved to Friday", status: "correct"}
    feedback: "این فرم رسمی‌تر از Can you move it? است."

  en.b2.unit05.lesson03.exercise01_choose_friend_text:
    instruction: "کدام متن برای دوست نوشته شده؟"
    correct_option: "Can you move it to Friday?"
    distractors: ["Could we move the appointment to Friday if that still works for you?", "I would be grateful if you could confirm whether my appointment can be moved to Friday.", "Dear scheduling team,"]
    accepted_answers: [{value: "Can you move it to Friday?", status: "correct"}]
    feedback: "این نسخه مستقیم و خودمانیه."
  en.b2.unit05.lesson03.exercise02_choose_clinic_text:
    instruction: "کدام متن برای کلینیک نوشته شده؟"
    correct_option: "I would be grateful if you could confirm whether my appointment can be moved to Friday."
    distractors: ["Can you move it to Friday?", "Could we move the appointment to Friday if that still works for you?", "Can you move it?"]
    accepted_answers: [{value: "I would be grateful if you could confirm whether my appointment can be moved to Friday.", status: "correct"}]
    feedback: "این جمله مناسب نهاد است چون غیرمستقیم و رسمی‌تره."
  en.b2.unit05.lesson03.exercise03_match_audience:
    instruction: "هر ویژگی یا متن را به مخاطب یا قضاوت درست وصل کنین."
    accepted_answers: [{value: [{left: "friend version", right: "Can you move it to Friday?"}, {left: "colleague version", right: "Could we move the appointment to Friday if that still works for you?"}, {left: "clinic version", right: "I would be grateful if you could confirm whether my appointment can be moved to Friday."}, {left: "too formal for a close friend", right: "stiff"}, {left: "fits the audience", right: "appropriate"}, {left: "changes across the three texts", right: "register"}], status: "correct"}]
    feedback: "محتوا یکیه، اما مخاطب شکل جمله را عوض می‌کنه."
  en.b2.unit05.lesson03.exercise04_write_same_content:
    instruction: "دقیق بنویسین: The content is the same, but the register changes."
    accepted_answers:
      - {value: "The content is the same, but the register changes.", status: "correct"}
      - {value: "The content is the same but the register changes.", status: "correct"}
    feedback: "content محتواست؛ register لحن و رسمی بودن."
  en.b2.unit05.lesson03.exercise05_write_colleague_version:
    instruction: "نسخهٔ همکار از متن را دقیق بنویسین: Could we move the appointment to Friday if that still works for you?"
    accepted_answers:
      - {value: "Could we move the appointment to Friday if that still works for you?", status: "correct"}
      - {value: "Could we move the appointment to Friday, if that still works for you?", status: "correct"}
    feedback: "این نسخه professional است، نه casual یا formal کامل."

  en.b2.unit05.lesson04.exercise01_choose_too_casual:
    instruction: "کدام عبارت برای کلینیک زیادی خودمانی است؟"
    correct_option: "Can you move it?"
    distractors: ["Could we move the appointment to Friday if that still works for you?", "I would be grateful if you could confirm whether my appointment can be moved to Friday.", "Dear scheduling team,"]
    accepted_answers: [{value: "Can you move it?", status: "correct"}]
    feedback: "برای دوست، Yes؛ برای کلینیک، No: این عبارت زیادی مستقیمه."
  en.b2.unit05.lesson04.exercise02_listen_clinic:
    instruction: "گوش کنین و نسخهٔ مناسب کلینیک را انتخاب کنین."
    correct_option: "I would be grateful if you could confirm whether my appointment can be moved to Friday."
    distractors: ["Can you cancel it tomorrow?", "The clinic is closed on Friday.", "Please send the full schedule."]
    accepted_answers: [{value: "I would be grateful if you could confirm whether my appointment can be moved to Friday.", status: "correct"}]
    feedback: "این همان نسخهٔ رسمی شنیده‌شده برای کلینیک است."
  en.b2.unit05.lesson04.exercise03_order_colleague:
    instruction: "کلمات را برای نسخهٔ حرفه‌ای همکار مرتب کنین."
    accepted_answers: [{value: ["could", "we", "move", "the", "appointment", "to", "Friday", "if", "that", "still", "works", "for", "you"], status: "correct"}]
    feedback: "ترتیب درست: could we move the appointment to Friday if that still works for you."
  en.b2.unit05.lesson04.exercise04_reply_as_oscar:
    instruction: "به سؤال نینا دربارهٔ Can you move it? دقیق جواب بدین: To a friend, yes. To the clinic, that sounds too casual."
    accepted_answers:
      - {value: "To a friend, yes. To the clinic, that sounds too casual.", status: "correct"}
      - {value: "To a friend, yes; to the clinic, that sounds too casual.", status: "correct"}
    feedback: "برای دوست مناسب است، اما برای کلینیک زیادی خودمانی است."
  en.b2.unit05.lesson04.exercise05_speak_shift_register:
    instruction: "با صدای بلند همان درخواست را سه جور بگین: برای دوست، برای همکار، و برای یک نهاد."
    accepted_answers:
      - {value: "Can you move it to Friday? Could we move the appointment to Friday if that still works for you? I would be grateful if you could confirm whether my appointment can be moved to Friday.", status: "correct"}
    feedback: "سه سطح لحن را با شکل جمله جدا کنین."
  en.b2.unit05.lesson04.exercise06_write_three_registers:
    instruction: "همان درخواست را دقیقاً در سه لحن بنویسین: Can you move it to Friday? Could we move the appointment to Friday if that still works for you? I would be grateful if you could confirm whether my appointment can be moved to Friday."
    accepted_answers:
      - {value: "Can you move it to Friday? Could we move the appointment to Friday if that still works for you? I would be grateful if you could confirm whether my appointment can be moved to Friday.", status: "correct"}
      - {value: "Can you move it to Friday? Could we move the appointment to Friday, if that still works for you? I would be grateful if you could confirm whether my appointment can be moved to Friday.", status: "correct"}
    feedback: "محتوا ثابت است؛ register با Can you، Could we و I would be grateful عوض می‌شه."
