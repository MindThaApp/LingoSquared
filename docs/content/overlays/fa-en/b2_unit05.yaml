course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح پیشرفته‌تر (B2) برای فارسی‌زبان‌ها، با تمرکز روی روایت زمان، لحن، ایده‌های انتزاعی، مذاکره و ترکیب منابع."

units:
  en.b2.unit05.register: {title: "یک پیام، چند لحن"}

lessons:
  en.b2.unit05.lesson01.audience_and_formality: {title: "خودمانی، حرفه‌ای و رسمی"}
  en.b2.unit05.lesson02_same_request_three_ways: {title: "Can you، could we، I would be grateful"}
  en.b2.unit05.lesson03.reading_same_message: {title: "متن: سه مخاطب"}
  en.b2.unit05.lesson04.the_register_dialogue: {title: "برای دوست بله، برای کلینیک نه"}

teaching:
  en.b2.unit05.lesson01.teach.register: {title: "register", gloss: "لحن و درجهٔ رسمی بودن", note: "در انگلیسی، register بیشتر با جمله‌بندی و عبارت‌ها عوض می‌شه، نه فقط با ضمیر. فارسی شما/تو دارد، اما انگلیسی برای رسمی‌تر شدن به Could، I would be grateful و ساختار غیرمستقیم تکیه می‌کنه.", example_gloss: "وقتی مخاطب عوض می‌شه، لحن پیام هم عوض می‌شه."}
  en.b2.unit05.lesson01.teach.casual: {title: "casual", gloss: "خودمانی، مناسب دوست نزدیک", note: "casual برای دوست یا فضای غیررسمیه. جملهٔ مستقیم مثل Can you move it? اینجا طبیعی‌تره.", example_gloss: "یک پیام خودمانی برای دوست مناسبه."}
  en.b2.unit05.lesson01.teach.professional: {title: "professional", gloss: "حرفه‌ای، مناسب همکار", note: "professional نه خیلی خشک است نه خیلی خودمانی؛ اغلب از could و عبارتی مثل if that still works for you استفاده می‌کنه.", example_gloss: "یک پیام حرفه‌ای برای همکار مناسبه."}
  en.b2.unit05.lesson01.teach.formal: {title: "formal", gloss: "رسمی، مناسب سازمان یا نهاد", note: "formal در انگلیسی معمولاً با جمله‌بندی غیرمستقیم‌تر میاد. فقط گفتن please همیشه کافی نمی‌شه.", example_gloss: "یک پیام رسمی برای یک نهاد مناسبه."}
  en.b2.unit05.lesson01.teach.audience: {title: "audience", gloss: "مخاطب، گیرندهٔ پیام", note: "audience یعنی کسی یا گروهی که پیام را دریافت می‌کنه؛ انتخاب عبارت به مخاطب بستگی داره.", example_gloss: "مخاطب شما روی انتخاب کلمه اثر می‌ذاره."}
  en.b2.unit05.lesson01.teach.institution: {title: "institution", gloss: "نهاد، سازمان", note: "institution مثل کلینیک، بانک یا دانشگاهه؛ در این موقعیت‌ها انگلیسی معمولاً رسمی‌تر از پیام به دوست می‌شه.", example_gloss: "کلینیک یک نهاد است."}

  en.b2.unit05.lesson02.teach.formal_request: {title: "I would be grateful if you could confirm whether my appointment can be moved.", gloss: "ممنون می‌شم اگر تأیید کنین که آیا امکان جابه‌جایی وقت من هست یا نه.", note: "این رسمی بودن با I would be grateful if you could و whether ساخته می‌شه. فارسی شاید فقط با «لطفاً» و «شما» رسمی بشه، اما انگلیسی اینجا ساختار کامل می‌خواد."}
  en.b2.unit05.lesson02.teach.casual_request: {title: "Can you move it to Friday?", gloss: "می‌تونی بندازیش برای جمعه؟", note: "برای دوست طبیعی و مستقیمه؛ برای کلینیک زیادی خودمانی و کوتاه شنیده می‌شه."}
  en.b2.unit05.lesson02.teach.professional_request: {title: "Could we move the appointment to Friday if that still works for you?", gloss: "می‌شه وقت رو به جمعه منتقل کنیم، اگر هنوز برای شما مناسبه؟", note: "Could we و if that still works for you جمله را حرفه‌ای و ملاحظه‌کار می‌کنن."}
  en.b2.unit05.lesson02.teach.to_whom: {title: "Dear scheduling team,", gloss: "تیم زمان‌بندی عزیز،", note: "Dear ... شروع استاندارد ایمیل رسمی/نیمه‌رسمیه؛ در انگلیسی برای سازمان‌ها طبیعی‌تر از سلام خیلی خودمانیه."}
  en.b2.unit05.lesson02.teach.grammar_register_shift: {title: "تغییر لحن بدون تغییر محتوا", gloss: "محتوا ثابت می‌مونه، اما برای دوست جمله مستقیم، برای همکار could، و برای نهاد I would be grateful if you could طبیعی‌تره.", note: "دام فارسی‌زبان‌ها اینه که فکر کنن رسمی بودن فقط با you/please حل می‌شه؛ در انگلیسی جمله‌بندی اصل ماجراست."}

  en.b2.unit05.lesson03.teach.stiff: {title: "stiff", gloss: "خشک و زیادی رسمی", note: "stiff یعنی پیام برای موقعیت بیش از حد رسمی و غیرطبیعی به نظر میاد.", example_gloss: "یک پیام خشک برای دوست نزدیک زیادی رسمی شنیده می‌شه."}
  en.b2.unit05.lesson03.teach.appropriate: {title: "appropriate", gloss: "مناسب، جور با موقعیت", note: "appropriate یعنی عبارت با مخاطب و موقعیت می‌خونه.", example_gloss: "پیام مناسب با مخاطب جور درمیاد."}
  en.b2.unit05.lesson03.teach.reading_passage: {title: "متن: سه مخاطب", gloss: "نینا باید وقتش را به جمعه منتقل کنه. به دوستش می‌نویسه: Can you move it to Friday? پیام مستقیم و خودمانیه. به همکارش می‌نویسه: Could we move the appointment to Friday if that still works for you? پیام حرفه‌ای و مؤدبانه است. به کلینیک می‌نویسه: I would be grateful if you could confirm whether my appointment can be moved to Friday. محتوا در هر سه متن یکیه، اما لحن با مخاطب عوض می‌شه.", note: "به جای ترجمهٔ ضمیر، به شکل درخواست دقت کنین: Can you، Could we، I would be grateful if you could."}

  en.b2.unit05.lesson04.teach.q_need_ask: {title: "Nina", gloss: "باید دربارهٔ جابه‌جایی وقتم سؤال کنم. می‌تونم فقط بنویسم: «Can you move it?»", note: "Could I just write یعنی آیا همین عبارت ساده کافی است؟"}
  en.b2.unit05.lesson04.teach.a_too_casual: {title: "Oscar", gloss: "برای دوست، بله. برای کلینیک، این زیادی خودمانی به نظر میاد.", note: "اینجا yes/no بخشی از جملهٔ انگلیسی‌اند؛ موقع تایپ، همان شکل انگلیسی را بنویسین."}
  en.b2.unit05.lesson04.teach.q_colleague: {title: "Nina", gloss: "به یک همکار چی می‌نویسی؟", note: "colleague یعنی همکار، نه دوست نزدیک."}
  en.b2.unit05.lesson04.teach.a_colleague_request: {title: "Oscar", gloss: "می‌نویسم: «Could we move the appointment to Friday if that still works for you?»", note: "این جمله حرفه‌ایه چون هم درخواست می‌کنه هم حق انتخاب طرف مقابل رو نگه می‌داره."}
  en.b2.unit05.lesson04.teach.q_clinic: {title: "Nina", gloss: "و به کلینیک؟", note: "مخاطب سازمانیه، پس لحن رسمی‌تر می‌شه."}
  en.b2.unit05.lesson04.teach.a_clinic_request: {title: "Oscar", gloss: "می‌نویسم: «I would be grateful if you could confirm whether my appointment can be moved to Friday.»", note: "این نسخه کمتر مستقیمه و برای نهاد مناسب‌تره."}
  en.b2.unit05.lesson04.teach.q_same_message: {title: "Nina", gloss: "همون پیام، لحن متفاوت.", note: "same message یعنی محتوای اصلی عوض نشده."}
  en.b2.unit05.lesson04.teach.a_content_stays: {title: "Oscar", gloss: "دقیقاً. محتوا ثابت می‌مونه، اما سطح رسمی بودن تغییر می‌کنه.", note: "level of formality یعنی درجهٔ رسمی بودن."}

