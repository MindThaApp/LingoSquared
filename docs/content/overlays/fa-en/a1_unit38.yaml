review: {status: "reviewed", required_next_reviewer: null, notes: "New overlay against the shared English realization unit38 (household chores), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1, every teaching card with a realization example: has a matching example_gloss:. Contrastive-grammar points, deliberately different from ones already used in this direction: (1) English chore collocations pick their verbs arbitrarily (wash the dishes but do the laundry, and do the dishes also exists) while Persian uses شستن for both (ظرف شستن، لباس شستن) -- learners can't derive the English verb from the Persian one, they must memorize the pairing; the obligatory generic THE in chore phrases (wash THE dishes) is also flagged, since Persian says ظرف شستن with no article at all; (2) the phrasal verb take out the trash -- a verb + particle combination whose meaning isn't the sum of its parts, a genuinely new category for Persian speakers (Persian has compound verbs but not detachable particles); the note keeps it as one memorized chunk at A1 rather than teaching particle movement; (3) need to + verb maps to باید + التزامی -- Persian never uses a bare infinitive after باید, so the to-infinitive slot is the drillable difference; the reading note also flags the gerund after hate/don't mind (hates cleaning, doesn't mind doing). matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, NOT translated Persian lefts -- deliberate, grading-motivated deviation from the older X-en overlay pattern (the compiler copies prompt.pairs from the realization only, so a translated-left answer key can never grade correct; verified against compile output + backend canonical_pairs() this session). Do not 'fix' this back to translated lefts in review. Strong sibling-isolation rule applied -- nl-en/prs-en overlays for this unit were not consulted for content. Needs the mandatory fresh-context review before shipping.\n\nfa-en review 2026-10-19: realization + overlay read in full. 9 fixes: do_the_laundry note said dishes take only wash (the unit itself teaches do the dishes); reading note said hate never takes to + verb; vacuum matching right was indistinguishable from clean; laundry right; need-to MC instruction tightened (chore distractors were 'things you must do'); untaught distractors (recycling, newspapers, mail) replaced; open-task answers widened. Flag: 'I have to' is used in the lesson04 prompt but never taught in A1 (realization). Shared-en r2 review 2026-10-22: answer lists and wording follow the realization change (reading: Daniel offered to help Mia (was 'she asked Daniel', contradicting the dialogue where Daniel offers))."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit38.household: {title: "صحبت دربارهٔ کارهای خونه"}

lessons:
  en.a1.unit38.lesson01.household_vocabulary: {title: "کارهای خونه"}
  en.a1.unit38.lesson02.doing_chores: {title: "انجام دادن کارهای خونه"}
  en.a1.unit38.lesson03.dialogue_cleaning_help: {title: "گفتگو: کمک خواستن برای تمیزکاری"}
  en.a1.unit38.lesson04.chores_at_home: {title: "متن: کارهای خونه"}

teaching:
  en.a1.unit38.lesson01.teach.chore: {title: "chore", gloss: "کار خونه", note: "*chore* یعنی کار خونه، کاری که مرتب برای تمیز نگه داشتن خونه انجام می‌دین. *least favorite* یعنی چیزی که از همه کمتر دوستش دارین.", example_gloss: "ظرف شستن کاریه که از همه کمتر دوستش دارم."}
  en.a1.unit38.lesson01.teach.dishes: {title: "dishes", gloss: "ظرف‌ها", note: "*dishes* یعنی ظرف‌ها -- همیشه جمع. دقت کنین: *do the dishes* یعنی ظرف شستن؛ حرف تعریف *the* اینجا اجباریه، درحالی‌که فارسی می‌گه «ظرف شستن» بدون هیچ حرف تعریفی.", example_gloss: "من بعد از شام ظرف‌ها رو می‌شورم."}
  en.a1.unit38.lesson01.teach.laundry: {title: "laundry", gloss: "لباس‌های شستنی / رخت", note: "*laundry* یعنی لباس‌هایی که باید شسته بشن. فعلش *do* هست: *do the laundry* -- لباس شستن. فارسی برای ظرف و لباس هر دو «شستن» می‌گه، ولی با *laundry* انگلیسی *do* می‌ذاره، نه *wash*.", example_gloss: "اون یکشنبه‌ها لباس‌ها رو می‌شوره."}
  en.a1.unit38.lesson01.teach.vacuum: {title: "vacuum", gloss: "جارو برقی کشیدن", note: "*vacuum* هم اسمه (جارو برقی) هم فعل (جارو برقی کشیدن): *He vacuums the living room* -- یه کلمه برای کاری که فارسی با یه عبارت کامل می‌گه.", example_gloss: "اون هر شنبه توی هال جارو برقی می‌کشه."}
  en.a1.unit38.lesson01.teach.trash: {title: "trash", gloss: "آشغال / زباله", note: "*trash* یعنی آشغال. با فعل *take out* میاد: *take out the trash* -- آشغال رو بیرون بردن.", example_gloss: "می‌تونی آشغال‌ها رو ببری بیرون؟"}
  en.a1.unit38.lesson01.teach.clean: {title: "clean", gloss: "تمیز کردن", note: "*clean* هم فعله (تمیز کردن) هم صفت (تمیز). *We clean the apartment together* -- با هم آپارتمان رو تمیز می‌کنیم.", example_gloss: "ما با هم آپارتمان رو تمیز می‌کنیم."}

  en.a1.unit38.lesson02.teach.wash_the_dishes: {title: "wash the dishes", gloss: "ظرف شستن", note: "*wash the dishes* یعنی ظرف شستن. حرف تعریف *the* جزء ثابت این عبارته -- *wash dishes* خالی توی حرف زدن روزمره طبیعی نیست.", example_gloss: "من هر شب ظرف‌ها رو می‌شورم."}
  en.a1.unit38.lesson02.teach.do_the_laundry: {title: "do the laundry", gloss: "لباس شستن", note: "*do the laundry* یعنی لباس شستن. دقت کنین: برای ظرف هم *wash the dishes* می‌گن هم *do the dishes*، ولی برای *laundry* فقط *do the laundry* طبیعیه -- فارسی برای هر دو «شستن» داره، پس این ترکیب‌ها رو جدا حفظ کنین.", example_gloss: "اون یکشنبه‌ها لباس می‌شوره."}
  en.a1.unit38.lesson02.teach.take_out_the_trash: {title: "take out the trash", gloss: "آشغال بیرون بردن", note: "*take out the trash* یعنی آشغال رو بیرون بردن. *take out* یه فعل دوکلمه‌ایه (فعل + حرف اضافه) که معنیش از جمع دو کلمه درنمیاد -- این‌جور فعل‌ها رو به‌صورت یه تیکهٔ واحد حفظ کنین.", example_gloss: "می‌تونی آشغال‌ها رو ببری بیرون؟"}
  en.a1.unit38.lesson02.teach.clean_the_bathroom: {title: "clean the bathroom", gloss: "دستشویی و حموم رو تمیز کردن", note: "*clean the bathroom* یعنی سرویس بهداشتی رو تمیز کردن. *on weekends* یعنی آخر هفته‌ها.", example_gloss: "اون آخر هفته‌ها حموم و دستشویی رو تمیز می‌کنه."}
  en.a1.unit38.lesson02.teach.need_to: {title: "need to", gloss: "باید / لازمه", note: "*need to* + فعل یعنی «باید» یا «لازمه»: *I need to vacuum* -- باید جارو برقی بکشم. فارسی بعد از «باید» فعل التزامی میاره، انگلیسی مصدر با *to* می‌ذاره.", example_gloss: "این آخر هفته باید توی هال جارو برقی بکشم."}
  en.a1.unit38.lesson02.teach.can_you_help_me_with_question: {title: "Can you help me with the dishes?", gloss: "می‌تونی توی ظرف شستن کمکم کنی؟", note: "*Can you help me with...?* -- درخواست کمک. چیزی که براش کمک می‌خواین با *with* میاد: *help me with the dishes*."}

  en.a1.unit38.lesson03.teach.dialogue_line1: {title: "مشکل میا", gloss: "میا می‌گه آپارتمانش خیلی به‌هم‌ریخته‌ست و آخر هفته مهمون داره.", note: "*a mess* یعنی به‌هم‌ریخته و شلوغ. *I have people coming over* یعنی قراره مهمون بیاد خونه‌م."}
  en.a1.unit38.lesson03.teach.dialogue_line2: {title: "پیشنهاد دنیل", gloss: "دنیل می‌پرسه کمک می‌خواد برای تمیز کردنش؟", note: "*Do you want some help...?* -- پیشنهاد کمک به شکل سؤال، یه الگوی مؤدبانه و دوستانه."}
  en.a1.unit38.lesson03.teach.dialogue_line3: {title: "جواب میا", gloss: "میا می‌گه آره لطفاً! باید توی هال جارو برقی بکشه و ظرف‌ها رو بشوره.", note: "*I need to vacuum ... and wash ...* -- دو تا کار با یه *need to* و حرف ربط *and*."}
  en.a1.unit38.lesson03.teach.dialogue_line4: {title: "تقسیم کار دنیل", gloss: "دنیل می‌گه اون می‌تونه جارو برقی بکشه، میا هم ظرف‌ها رو بشوره.", note: "*I can vacuum for you* -- *can* برای پیشنهاد انجام یه کار."}
  en.a1.unit38.lesson03.teach.dialogue_line5: {title: "جواب میا", gloss: "میا تشکر می‌کنه و می‌گه هنوز باید لباس‌ها رو هم بشوره.", note: "*still* یعنی هنوز، و *too* آخر جمله یعنی «هم»."}
  en.a1.unit38.lesson03.teach.dialogue_line6: {title: "جواب دنیل", gloss: "دنیل می‌گه امروز برای اون کار وقت نداره، ولی می‌تونه قبل از رفتنش آشغال‌ها رو ببره بیرون.", note: "*I don't have time for that* -- برای چیزی وقت نداشتن با *for*. *before I leave* یعنی قبل از اینکه برم."}
  en.a1.unit38.lesson03.teach.dialogue_line7: {title: "تشکر میا", gloss: "میا می‌گه این کمک بزرگیه و کلی تشکر می‌کنه.", note: "*That would help a lot* -- «خیلی کمک می‌کنه». *Thank you so much* از *Thanks* گرم‌تر و قوی‌تره."}

  en.a1.unit38.lesson04.teach.reading_passage: {title: "متن: عادت‌های سه همکار", gloss: "دنیل، لیلا و میا هر کدوم عادت‌های خودشون رو توی کارهای خونه دارن. دنیل هر شب بعد از شام ظرف‌ها رو می‌شوره و شنبه‌ها توی آپارتمانش جارو برقی می‌کشه. لیلا از لباس شستن بدش نمیاد، ولی از تمیز کردن حموم و دستشویی متنفره. گربهٔ میا، لونا، همه‌جا مو می‌ریزه، برای همین میا تقریباً هر روز جارو برقی می‌کشه. آخر هفتهٔ پیش میا مهمون داشت، برای همین دنیل پیشنهاد کرد کمکش کنه. دنیل توی هال جارو برقی کشید و آشغال‌ها رو براش برد بیرون. میا خیلی ممنونش بود.", note: "دقت کنین بعد از *doesn't mind* فعل با *-ing* میاد، نه مصدر با *to*: *doesn't mind doing the laundry*. بعد از *hates* هم اینجا *-ing* اومده (*hates cleaning the bathroom*)، هرچند *hates to clean* هم درسته."}

