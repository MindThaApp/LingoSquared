review: {status: "reviewed", required_next_reviewer: null, notes: "New overlay against the shared English realization unit43 (colors), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1, every teaching card with a realization example: has a matching example_gloss:. Contrastive-grammar points, deliberately different from ones already used in this direction: (1) dark blue / light green stack the shade word BEFORE the base color (dark/light + blue/green) -- Persian reverses this order, putting the base color first and the shade word after as a following modifier (آبی تیره، سبز روشن -- literally 'blue dark', 'green light'), so the note flags this as a genuine word-order flip, not a vocabulary gap; (2) goes well with as an idiomatic phrasal verb meaning 'matches/complements' -- Persian's parallel expression (جور دراومدن / به هم اومدن) is built on a totally different verb concept (things 'coming together' or 'fitting'), not literal 'going', so this must be memorized as a fixed chunk rather than translated through the literal verb go; (3) too bright (too + adjective signaling excess, implying a problem) versus very bright (neutral intensity, no problem implied) -- colloquial Persian commonly uses خیلی for both senses without a dedicated 'too much/excessive' marker, so English's too as specifically negative is flagged as a real listening/production trap for Farsi speakers who may default to a neutral-sounding 'very' translation. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, NOT translated Persian lefts, per the established compiler-driven precedent. lesson03/lesson04 multiple_choice and listen_select distractor sets copied verbatim from the realization's own review notes documenting the exact invented, never-spoken-in-this-unit values already verified safe. Strong sibling-isolation rule applied -- nl-en/prs-en overlays for this unit were not consulted. Needs the mandatory fresh-context review before shipping.\n\nfa-en review 2026-10-19: Checked notes, glosses, Persian style, distractors, answers, canon and sequencing. 11 fixes: too bright gloss (زننده -> زیادی تند) and note (Persian زیادی = too), dialogue glosses (I'd choose, what looks professional), 6 untaught distractors replaced (enough, plain, hard to find in stores, lucky, warm orange, deep purple), What is variants and dark blue/light green answers added. Native flag: زیادی تند for too bright.\n\nShared-en r2 review 2026-10-22: reading gloss follows the new last sentence (colors make every day more fun); listen_dialogue_yellow_reason instruction reworded to match the new prompt; dark blue / light green favorite-color answers added. NATIVE FLAG: the new last-sentence gloss."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit43.colors: {title: "توصیف رنگ‌ها"}

lessons:
  en.a1.unit43.lesson01.colors_vocabulary: {title: "کلمات رنگ‌ها"}
  en.a1.unit43.lesson02.talking_about_colors: {title: "صحبت دربارهٔ رنگ‌ها"}
  en.a1.unit43.lesson03.dialogue_choosing_a_shirt_color: {title: "گفتگو: انتخاب رنگ پیراهن"}
  en.a1.unit43.lesson04.three_friends_three_favorite_colors: {title: "متن: سه دوست، سه رنگ موردعلاقه"}

teaching:
  en.a1.unit43.lesson01.teach.red: {title: "red", gloss: "قرمز", note: "*red* یعنی قرمز.", example_gloss: "ماشینم قرمزه."}
  en.a1.unit43.lesson01.teach.blue: {title: "blue", gloss: "آبی", note: "*blue* یعنی آبی.", example_gloss: "آسمون آبیه."}
  en.a1.unit43.lesson01.teach.green: {title: "green", gloss: "سبز", note: "*green* یعنی سبز.", example_gloss: "چمن سبزه."}
  en.a1.unit43.lesson01.teach.yellow: {title: "yellow", gloss: "زرد", note: "*yellow* یعنی زرد.", example_gloss: "خورشید زرده."}
  en.a1.unit43.lesson01.teach.black: {title: "black", gloss: "مشکی / سیاه", note: "*black* یعنی مشکی.", example_gloss: "کفشاش مشکی‌ان."}
  en.a1.unit43.lesson01.teach.white: {title: "white", gloss: "سفید", note: "*white* یعنی سفید.", example_gloss: "پیراهنش سفیده."}

  en.a1.unit43.lesson02.teach.dark_blue: {title: "dark blue", gloss: "آبی تیره", note: "*dark blue* -- کلمهٔ شدت (*dark*) قبل از رنگ اصلی میاد؛ فارسی برعکسه، رنگ اصلی اول میاد و بعد شدتش: «آبی تیره».", example_gloss: "اون یه پیراهن آبی تیره پوشیده."}
  en.a1.unit43.lesson02.teach.light_green: {title: "light green", gloss: "سبز روشن", note: "*light green* -- همون قانون *dark blue*، *light* هم قبل از رنگ میاد.", example_gloss: "اون اتاق‌خوابشو سبز روشن رنگ کرد."}
  en.a1.unit43.lesson02.teach.goes_well_with: {title: "goes well with", gloss: "با ... جور در میاد", note: "*goes well with* یه فعل عبارتیه به‌معنی «جور دراومدن»؛ فارسی از فعل کاملاً متفاوتی (جور دراومدن / به‌هم اومدن) استفاده می‌کنه، نه فعل «رفتن» -- کل عبارت رو یه‌جا حفظ کنین.", example_gloss: "این پیراهن آبی با شلوار مشکی جور در میاد."}
  en.a1.unit43.lesson02.teach.too_bright: {title: "too bright", gloss: "زیادی تند / بیش‌ازحد روشن", note: "*too bright* -- *too* یعنی «بیش‌ازحد»، یه مشکل رو نشون می‌ده؛ با *very bright* (خیلی روشن، بدون مشکل) قاطی نشه. فارسی محاوره‌ای گاهی برای هر دو «خیلی» می‌گه، ولی معادل دقیق *too* «زیادی» یا «بیش‌ازحد»ه، نه «خیلی».", example_gloss: "زرد رنگ باحالیه، ولی برای کار زیادی تنده."}
  en.a1.unit43.lesson02.teach.whats_your_favorite_color: {title: "What's your favorite color?", gloss: "رنگ موردعلاقه‌ت چیه؟", note: "*What's your favorite ...?* یه الگوی سؤال برای پرسیدن چیز موردعلاقه‌ست."}
  en.a1.unit43.lesson02.teach.my_favorite_color_is: {title: "My favorite color is blue.", gloss: "رنگ موردعلاقه‌م آبیه.", note: "*My favorite ... is ...* یه الگوی جواب ثابته."}

  en.a1.unit43.lesson03.teach.dialogue_line1: {title: "درخواست دنیل", gloss: "دنیل می‌گه برای ارائهٔ هفتهٔ بعد یه پیراهن جدید لازم داره و از میا می‌خواد کمکش کنه رنگشو انتخاب کنه.", note: "*Can you help me choose a color?* -- درخواست کمک با *can*."}
  en.a1.unit43.lesson03.teach.dialogue_line2: {title: "سؤال میا", gloss: "میا می‌گه حتماً -- می‌پرسه چه رنگایی رو دوست داره.", note: "*What colors do you like?* -- سؤال دربارهٔ علاقه."}
  en.a1.unit43.lesson03.teach.dialogue_line3: {title: "جواب دنیل", gloss: "دنیل می‌گه آبی و سبز رو دوست داره، ولی مطمئن نیست چی حرفه‌ای به‌نظر می‌رسه.", note: "*I'm not sure what looks professional* -- سؤال غیرمستقیم داخل جمله."}
  en.a1.unit43.lesson03.teach.dialogue_line4: {title: "پیشنهاد میا", gloss: "میا می‌گه آبی تیره انتخاب خوبیه -- حرفه‌ای به‌نظر می‌رسه و با شلوار مشکی هم جور در میاد.", note: "*It goes well with black pants* -- عبارت *goes well with* که تازه یاد گرفتیم."}
  en.a1.unit43.lesson03.teach.dialogue_line5: {title: "سؤال دنیل", gloss: "دنیل می‌پرسه این یکی زرده چطوره؟", note: "*What about...?* -- پیشنهاد یه گزینهٔ دیگه."}
  en.a1.unit43.lesson03.teach.dialogue_line6: {title: "جواب میا", gloss: "میا می‌گه زرد رنگ باحالیه، ولی برای ارائه زیادی تنده -- اگه جای دنیل بود پیراهن آبی تیره رو انتخاب می‌کرد.", note: "*it's too bright* -- استفادهٔ *too* که تازه یاد گرفتیم."}
  en.a1.unit43.lesson03.teach.dialogue_line7: {title: "جواب دنیل", gloss: "دنیل تشکر می‌کنه و می‌گه پس آبی تیره!", note: "*Dark blue it is!* -- یه جملهٔ کوتاه برای اعلام تصمیم نهایی."}

  en.a1.unit43.lesson04.teach.reading_passage: {title: "متن: سه دوست، سه رنگ موردعلاقه", gloss: "دنیل، لیلا و میا هر سه رنگ‌های موردعلاقهٔ متفاوتی دارن. رنگ موردعلاقهٔ دنیل آبیه. اون می‌گه یه رنگ آرومه، و تقریباً با هر چیزی که سر کار می‌پوشه جور در میاد. رنگ موردعلاقهٔ لیلا سبزه، رنگ گیاه‌ها و باغ‌هایی که عاشق نقاشیشونه. اون فکر می‌کنه سبز روشن به‌خصوص قشنگه. رنگ موردعلاقهٔ میا زرده، چون یادآور خورشیده و همیشه حالشو خوب می‌کنه. با اینکه هر سه‌شون رنگای متفاوتی دوست دارن، همه قبول دارن که رنگ‌ها هر روز رو باحال‌تر می‌کنن.", note: "دقت کنین *because* برای دلیل آوردن استفاده می‌شه: *it reminds her of the sun and always makes her feel happy* -- ساختار دلیل و نتیجه."}

exercises:
  en.a1.unit43.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "black"
    distractors: ["red", "blue", "green", "yellow"]
    accepted_answers: [{value: "black", status: "correct"}]
    feedback: "*black* یعنی مشکی."
  en.a1.unit43.lesson01.exercise02.choose_yellow_meaning:
    instruction: "کدوم رنگ، رنگ خورشیده؟"
    correct_option: "yellow"
    distractors: ["red", "blue", "white"]
    accepted_answers: [{value: "yellow", status: "correct"}]
    feedback: "*yellow* یعنی زرد."
  en.a1.unit43.lesson01.exercise03.match_color_words:
    instruction: "هر واژه یا عبارت انگلیسی رو به توضیح فارسی درستش وصل کنین."
    pairs:
      - {left: "red", right: "رنگ توت‌فرنگی"}
      - {left: "blue", right: "رنگ آسمون"}
      - {left: "green", right: "رنگ چمن"}
      - {left: "yellow", right: "رنگ خورشید"}
      - {left: "black", right: "رنگ زغال"}
      - {left: "white", right: "رنگ برف"}
    accepted_answers:
      - value:
          - {left: "red", right: "رنگ توت‌فرنگی"}
          - {left: "blue", right: "رنگ آسمون"}
          - {left: "green", right: "رنگ چمن"}
          - {left: "yellow", right: "رنگ خورشید"}
          - {left: "black", right: "رنگ زغال"}
          - {left: "white", right: "رنگ برف"}
        status: "correct"
    feedback: "red=قرمز، blue=آبی، green=سبز، yellow=زرد، black=مشکی، white=سفید."
  en.a1.unit43.lesson01.exercise04.order_white_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["Her", "shirt", "is", "white."], status: "correct"}]
    feedback: "ترتیب درست: *Her shirt is white.*"
  en.a1.unit43.lesson01.exercise05.write_green_word:
    instruction: "رنگ چمن رو بنویسین."
    accepted_answers: [{value: "green", status: "correct"}]
    feedback: "*green* یعنی سبز."

  en.a1.unit43.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "dark blue"
    distractors: ["light green", "goes well with", "too bright"]
    accepted_answers: [{value: "dark blue", status: "correct"}]
    feedback: "*dark blue* یعنی آبی تیره."
  en.a1.unit43.lesson02.exercise02.choose_dark_blue_meaning:
    instruction: "کدوم عبارت یعنی حالت تیره‌تر و پررنگ‌تر آبی؟"
    correct_option: "dark blue"
    distractors: ["light green", "too bright", "goes well with"]
    accepted_answers: [{value: "dark blue", status: "correct"}]
    feedback: "*dark blue* یعنی آبی تیره."
  en.a1.unit43.lesson02.exercise03.choose_goes_well_with_meaning:
    instruction: "کدوم عبارت یعنی دو تا رنگ یا لباس با هم خوب جور در میان؟"
    correct_option: "goes well with"
    distractors: ["dark blue", "light green", "too bright"]
    accepted_answers: [{value: "goes well with", status: "correct"}]
    feedback: "*goes well with* یعنی با ... جور در میاد."
  en.a1.unit43.lesson02.exercise04.order_pants_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["This", "blue", "shirt", "goes", "well", "with", "black", "pants."], status: "correct"}]
    feedback: "ترتیب درست: *This blue shirt goes well with black pants.*"
  en.a1.unit43.lesson02.exercise05.translate_favorite_color_question:
    instruction: "ترجمه کنین: «رنگ موردعلاقه‌ت چیه؟»"
    accepted_answers: [{value: "What's your favorite color?", status: "correct"}, {value: "What's your favorite color", status: "correct"}, {value: "What is your favorite color?", status: "correct"}, {value: "What is your favorite color", status: "correct"}]
    feedback: "*What's your favorite color?*"

  en.a1.unit43.lesson03.exercise01.comprehension_daniel_colors_he_likes:
    instruction: "طبق گفتگو، دنیل می‌گه دو تا کدوم رنگ‌ها رو دوست داره؟"
    correct_option: "blue and green"
    distractors: ["red and yellow", "black and white", "green and yellow"]
    accepted_answers: [{value: "blue and green", status: "correct"}]
    feedback: "دنیل می‌گه آبی و سبز رو دوست داره."
  en.a1.unit43.lesson03.exercise02.comprehension_mia_recommendation:
    instruction: "طبق گفتگو، میا برای ارائه کدوم رنگو پیشنهاد می‌ده؟"
    correct_option: "dark blue"
    distractors: ["light green", "bright yellow", "black"]
    accepted_answers: [{value: "dark blue", status: "correct"}]
    feedback: "میا آبی تیره رو پیشنهاد می‌ده."
  en.a1.unit43.lesson03.exercise03.listen_dialogue_yellow_reason:
    instruction: "طبق گفتگو، چرا میا می‌گه زرد برای ارائه انتخاب خوبی نیست؟"
    correct_option: "too bright"
    distractors: ["too dark", "too expensive", "too big"]
    accepted_answers: [{value: "too bright", status: "correct"}]
    feedback: "میا می‌گه زرد برای ارائه زیادی تنده (*too bright*)."
  en.a1.unit43.lesson03.exercise04.respond_own_favorite_color:
    instruction: "رنگ موردعلاقه‌تونو بگین، یا از کسی بپرسین رنگ موردعلاقه‌ش چیه."
    accepted_answers: ["My favorite color is blue", "My favorite color is blue.", "My favorite color is red", "My favorite color is red.", "My favorite color is green", "My favorite color is green.", "My favorite color is yellow", "My favorite color is yellow.", "My favorite color is black", "My favorite color is black.", "My favorite color is white", "My favorite color is white.", "What's your favorite color?", "What is your favorite color?", "My favorite color is dark blue.", "My favorite color is light green.", "My favorite color is dark blue", "My favorite color is light green"]
    feedback: "می‌تونین از الگوی *My favorite color is ...* یا *What's your favorite color?* استفاده کنین."

  en.a1.unit43.lesson04.exercise01.reading_daniel_favorite_color:
    instruction: "طبق متن، رنگ موردعلاقهٔ دنیل چیه؟"
    correct_option: "blue"
    distractors: ["red", "green", "yellow"]
    accepted_answers: [{value: "blue", status: "correct"}]
    feedback: "متن می‌گه رنگ موردعلاقهٔ دنیل آبیه."
  en.a1.unit43.lesson04.exercise02.reading_mia_yellow_reason:
    instruction: "طبق متن، چرا میا زرد رو دوست داره؟"
    correct_option: "it reminds her of the sun"
    distractors: ["it's a calm color", "her cat is yellow", "her apartment is yellow"]
    accepted_answers: [{value: "it reminds her of the sun", status: "correct"}]
    feedback: "متن می‌گه زرد یادآور خورشیده."
  en.a1.unit43.lesson04.exercise03.reading_leila_shade:
    instruction: "طبق متن، لیلا کدوم رنگ سبز رو به‌خصوص دوست داره؟"
    correct_option: "light green"
    distractors: ["dark green", "light blue", "dark blue"]
    accepted_answers: [{value: "light green", status: "correct"}]
    feedback: "متن می‌گه لیلا سبز روشن رو به‌خصوص دوست داره."
  en.a1.unit43.lesson04.exercise04.write_own_favorite_color_sentence:
    instruction: "یه جمله دربارهٔ رنگ موردعلاقهٔ خودتون بنویسین، با «My favorite color is...»."
    accepted_answers: ["My favorite color is blue", "My favorite color is blue.", "My favorite color is red", "My favorite color is red.", "My favorite color is green", "My favorite color is green.", "My favorite color is yellow", "My favorite color is yellow.", "My favorite color is black", "My favorite color is black.", "My favorite color is white", "My favorite color is white.", "My favorite color is dark blue.", "My favorite color is light green.", "My favorite color is dark blue", "My favorite color is light green"]
    feedback: "می‌تونین از الگوی *My favorite color is ...* استفاده کنین."
