course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح میانی (B1) برای فارسی‌زبان‌ها، با تمرکز بر بیان ضرورت، توانایی، شرط، بحث و کار، همراه با توضیحات دقیق فارسی."

units:
  en.b1.unit05.workplace: {title: "مسئولیت‌ها و گزارش پیشرفت کارم"}

lessons:
  en.b1.unit05.lesson01.workplace_vocabulary: {title: "responsible for، update و deadline"}
  en.b1.unit05.lesson02.giving_a_status_update: {title: "مسئول این کارم، عقب افتادم"}
  en.b1.unit05.lesson03.reading_a_weekly_update: {title: "متن: گزارش هفتگی دنیل"}
  en.b1.unit05.lesson04.asking_a_colleague_for_help: {title: "می‌تونی این رو مرور کنی؟"}

teaching:
  en.b1.unit05.lesson01.teach.responsible_for: {title: "responsible for", gloss: "مسئول بودن برای", note: "responsible for یعنی وظیفهٔ شما مراقبت از یه چیزه.", example_gloss: "من مسئول گزارش ماهانه‌ام."}
  en.b1.unit05.lesson01.teach.update: {title: "update", gloss: "گزارش پیشرفت", note: "update یعنی اطلاعات جدید دربارهٔ روند پیشرفت یه کار.", example_gloss: "هر هفته یه گزارش پیشرفت به تیمم می‌دم."}
  en.b1.unit05.lesson01.teach.deadline: {title: "deadline", gloss: "مهلت انجام کار", note: "deadline یعنی تاریخی که کاری باید تا اون موقع تموم بشه.", example_gloss: "مهلت گزارش تا جمعه‌ست."}
  en.b1.unit05.lesson01.teach.report: {title: "report", gloss: "گزارش", note: "report یه سند نوشته‌شده‌ست که کار یا نتایج رو توضیح می‌ده.", example_gloss: "هر ماه یه گزارش فروش می‌نویسم."}
  en.b1.unit05.lesson01.teach.on_schedule: {title: "on schedule", gloss: "طبق برنامه", note: "on schedule یعنی طبق برنامه پیش می‌ره، دیر نشده.", example_gloss: "پروژه طبق برنامه پیش می‌ره."}
  en.b1.unit05.lesson01.teach.behind_schedule: {title: "behind schedule", gloss: "عقب‌افتاده از برنامه", note: "behind schedule یعنی کندتر از برنامه پیش می‌ره.", example_gloss: "این هفته یه‌کم از برنامه عقبیم."}

  en.b1.unit05.lesson02.teach.responsible_for_report: {title: "I'm responsible for the monthly report.", gloss: "من مسئول گزارش ماهانه‌ام.", note: "I'm responsible for + اسم -- یه راه رسمی برای گفتن وظیفهٔ کاریتون."}
  en.b1.unit05.lesson02.teach.project_on_schedule: {title: "The project is on schedule.", gloss: "پروژه طبق برنامه پیش می‌ره.", note: "این جمله یه گزارش پیشرفت مثبته -- هیچ تأخیری نیست."}
  en.b1.unit05.lesson02.teach.behind_schedule_finish_friday: {title: "I'm a little behind schedule, but I'll finish by Friday.", gloss: "یه‌کم از برنامه عقبم، ولی تا جمعه تمومش می‌کنم.", note: "این یه گزارش پیشرفت صادقانه‌ست: عقب‌موندگی رو با اطمینان از تموم کردن ترکیب می‌کنه."}
  en.b1.unit05.lesson02.teach.grammar_status_update: {title: "دادن گزارش پیشرفت", gloss: "مسئول گزارشم. پروژه طبق برنامه پیش می‌ره. یه‌کم عقبم.", note: "*responsible for* مسئولیت رو نشون می‌ده، *on schedule* یعنی طبق برنامه، و *behind schedule* یعنی عقب‌افتاده -- هر سه توی یه گزارش پیشرفت کاربرد دارن."}

  en.b1.unit05.lesson03.teach.team: {title: "team", gloss: "تیم", note: "team یعنی گروهی از افراد که با هم کار می‌کنن.", example_gloss: "هر هفته یه گزارش کوتاه به تیمش می‌ده."}
  en.b1.unit05.lesson03.teach.technical_problem: {title: "technical problem", gloss: "مشکل فنی", note: "technical problem یعنی یه مشکل مربوط به سیستم یا تجهیزات.", example_gloss: "به‌خاطر یه مشکل فنی از برنامه عقبه."}
  en.b1.unit05.lesson03.teach.reading_passage: {title: "متن: گزارش هفتگی دنیل", gloss: "دنیل مسئول گزارش فروش ماهانه‌ست. هر هفته، یه گزارش کوتاه به تیمش می‌ده. این هفته، به‌خاطر یه مشکل فنی یه‌کم از برنامه عقبه، ولی امیدواره تا جمعه تمومش کنه. اون همیشه به تیمش دربارهٔ تأخیرها راست می‌گه.", note: "این متن نشون می‌ده که یه گزارش پیشرفت خوب هم مسئولیت رو نشون می‌ده و هم صادقانهٔ دربارهٔ تأخیرهاست."}

  en.b1.unit05.lesson04.teach.q_could_you_help_review: {title: "درخواست دنیل", gloss: "دنیل می‌گه میا، می‌تونی کمکم کنی قبل از فرستادن این گزارش، مرورش کنم؟", note: "Could you help me...? یه راه مؤدبانه و حرفه‌ای برای درخواست کمک از یه همکاره."}
  en.b1.unit05.lesson04.teach.a_of_course_what_help: {title: "جواب میا", gloss: "میا می‌گه البته. توی چی کمک لازم داری؟", note: "Of course یه پاسخ گرم و مؤدبانه به یه درخواست کمکه."}
  en.b1.unit05.lesson04.teach.q_make_sure_numbers: {title: "توضیح دنیل", gloss: "دنیل می‌گه می‌خوام مطمئن بشم اعداد درستن.", note: "want to make sure یعنی می‌خوام مطمئن بشم -- برای توضیح دلیل درخواست کمک."}
  en.b1.unit05.lesson04.teach.a_check_this_afternoon: {title: "جواب میا", gloss: "میا می‌گه مشکلی نیست. امروز بعدازظهر بررسیش می‌کنم و یادداشت‌هام رو برات می‌فرستم.", note: "این جمله یه زمان مشخص (این بعدازظهر) برای انجام کمک تعیین می‌کنه -- یه پاسخ حرفه‌ای."}
  en.b1.unit05.lesson04.teach.q_thank_you_appreciate: {title: "تشکر دنیل", gloss: "دنیل می‌گه ممنون، واقعاً قدردانم.", note: "I really appreciate it یه راه گرم‌تر از just «ممنون» برای تشکر جدیه."}
  en.b1.unit05.lesson04.teach.a_youre_welcome_let_me_know: {title: "جواب پایانی میا", gloss: "میا می‌گه خواهش می‌کنم. اگه چیز دیگه‌ای لازم داشتی بهم بگو.", note: "Let me know if you need anything else یه جملهٔ معمول برای پایان دادن مؤدبانه به یه گفتگوی کاریه."}

exercises:
  en.b1.unit05.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شده را انتخاب کنین."
    correct_option: "deadline"
    distractors: ["update", "report", "responsible for"]
    accepted_answers: [{value: "deadline", status: "correct"}]
    feedback: "deadline یعنی مهلت انجام کار."
  en.b1.unit05.lesson01.exercise02.choose_in_charge_of_phrase:
    instruction: "کدام عبارت به معنای مسئول مراقبت از یه چیز بودنه؟"
    correct_option: "responsible for"
    distractors: ["on schedule", "behind schedule", "update"]
    accepted_answers: [{value: "responsible for", status: "correct"}]
    feedback: "responsible for یعنی مسئول بودن برای."
  en.b1.unit05.lesson01.exercise03.choose_late_phrase:
    instruction: "کدام عبارت به معنای کندتر پیش رفتن یه کار از برنامه‌ست؟"
    correct_option: "behind schedule"
    distractors: ["on schedule", "deadline", "update"]
    accepted_answers: [{value: "behind schedule", status: "correct"}]
    feedback: "behind schedule یعنی عقب‌افتاده از برنامه."
  en.b1.unit05.lesson01.exercise04.match_workplace_words:
    instruction: "هر معنی را به کلمه یا عبارت انگلیسی درست وصل کنید."
