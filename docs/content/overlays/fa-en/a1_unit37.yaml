review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit37 (celebrations), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1, every teaching card with a realization example: has a matching example_gloss:. Contrastive-grammar points, deliberately different from ones already used in this direction: (1) congratulate takes its person as a direct object plus ON for the occasion (congratulate him ON his promotion) -- Persian goes the other way around: the person needs به and the occasion takes بابت/برای (به او بابت ترفیعش تبریک گفتن), so both prepositions mismatch at once; (2) the double-object pattern wish/give + person + thing with no preposition (wish YOU a happy birthday, gave HIM a gift) -- Persian must say «به تو» / «بهش», so the missing به is the thing to drill; also flags that the fixed greeting Happy birthday! maps to تولدت مبارک with the word order effectively reversed (happy=مبارک last in Persian). Simple past forms appear throughout lesson03/04 (Did you know, gave, took) -- unit18 already introduced the past, so notes remind rather than re-teach. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, NOT translated Persian lefts -- deliberate, grading-motivated deviation from the older X-en overlay pattern (the compiler copies prompt.pairs from the realization only, so a translated-left answer key can never grade correct; verified against compile output + backend canonical_pairs() this session). Do not 'fix' this back to translated lefts in review. Strong sibling-isolation rule applied -- nl-en/prs-en overlays for this unit were not consulted for content. Needs the mandatory fresh-context review before shipping."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit37.celebrations: {title: "صحبت دربارهٔ جشن و مهمونی"}

lessons:
  en.a1.unit37.lesson01.celebration_vocabulary: {title: "تولد و جشن"}
  en.a1.unit37.lesson02.inviting_and_congratulating: {title: "دعوت کردن و تبریک گفتن"}
  en.a1.unit37.lesson03.dialogue_surprise_party: {title: "گفتگو: برنامه‌ریزی مهمونی سورپرایز"}
  en.a1.unit37.lesson04.the_surprise_party: {title: "متن: مهمونی سورپرایز"}

teaching:
  en.a1.unit37.lesson01.teach.birthday: {title: "birthday", gloss: "تولد", note: "*birthday* یعنی تولد. برای ماه حرف اضافهٔ *in* میاد: *My birthday is in October* -- تولد من توی مهر/اکتبره.", example_gloss: "تولد من توی اکتبره."}
  en.a1.unit37.lesson01.teach.party: {title: "party", gloss: "مهمونی / جشن", note: "*party* یعنی مهمونی. *We are having a party* -- حال استمراری برای برنامهٔ نزدیک: «داریم مهمونی می‌گیریم».", example_gloss: "شنبه داریم مهمونی می‌گیریم."}
  en.a1.unit37.lesson01.teach.gift: {title: "gift", gloss: "کادو / هدیه", note: "*gift* یعنی کادو. دقت کنین: *I bought her a gift* -- اول شخص، بعد چیز، بدون هیچ حرف اضافه‌ای؛ فارسی «به» لازم داره (براش/بهش)، انگلیسی نه.", example_gloss: "براش یه کادوی خوشگل خریدم."}
  en.a1.unit37.lesson01.teach.invite: {title: "invite", gloss: "دعوت کردن", note: "*invite* یعنی دعوت کردن. *I want to invite my friends* -- می‌خوام دوستام رو دعوت کنم.", example_gloss: "می‌خوام دوستام رو دعوت کنم."}
  en.a1.unit37.lesson01.teach.celebrate: {title: "celebrate", gloss: "جشن گرفتن", note: "*celebrate* یعنی جشن گرفتن. *Let's...* یعنی «بیاین...»: *Let's celebrate together!* -- پیشنهاد برای انجام کاری با هم.", example_gloss: "بیاین با هم جشن بگیریم!"}
  en.a1.unit37.lesson01.teach.congratulations: {title: "congratulations", gloss: "تبریک", note: "*congratulations* یعنی تبریک -- همیشه با *s* آخرش. مناسبتش با *on* میاد: *Congratulations on your new job!*", example_gloss: "شغل جدیدت مبارک!"}

  en.a1.unit37.lesson02.teach.invite_someone_to: {title: "invite someone to", gloss: "دعوت کردن (کسی) به", note: "*invite someone to* -- شخص مستقیم بعد از فعل میاد و مقصد با *to*: *I invite my coworkers to my party*. فارسی هم «به» داره، ولی جاش فرق می‌کنه: «همکارام رو به مهمونیم دعوت می‌کنم».", example_gloss: "همکارام رو به جشن تولدم دعوت می‌کنم."}
  en.a1.unit37.lesson02.teach.congratulate_someone_on: {title: "congratulate someone on", gloss: "تبریک گفتن به (کسی) بابت", note: "*congratulate someone on something* -- برعکس فارسی: شخص بدون حرف اضافه میاد (*congratulate him*) و مناسبت با *on*. فارسی می‌گه «به او بابت ترفیعش تبریک می‌گیم» -- «به» توی انگلیسی نیست و به‌جای «بابت»، *on* میاد.", example_gloss: "ما بهش بابت ترفیعش تبریک می‌گیم."}
  en.a1.unit37.lesson02.teach.wish_someone_happy_birthday: {title: "wish someone a happy birthday", gloss: "تولد (کسی) رو تبریک گفتن", note: "*wish you a happy birthday* -- الگوی دو مفعولی: اول شخص (*you*)، بعد چیز (*a happy birthday*)، بدون حرف اضافه. جملهٔ کوتاهش هم *Happy birthday!* هست، یعنی «تولدت مبارک» -- دقت کنین ترتیب برعکسه: *happy* اول میاد، «مبارک» آخر.", example_gloss: "می‌خوام تولدت رو تبریک بگم."}
  en.a1.unit37.lesson02.teach.surprise_party: {title: "surprise party", gloss: "مهمونی سورپرایز", note: "*surprise party* یعنی مهمونی سورپرایز، مهمونی‌ای که خود شخص ازش خبر نداره. *They are planning a surprise party for her* -- دارن براش برنامه می‌ریزن.", example_gloss: "دارن براش یه مهمونی سورپرایز برنامه‌ریزی می‌کنن."}
  en.a1.unit37.lesson02.teach.have_a_party: {title: "have a party", gloss: "مهمونی گرفتن", note: "*have a party* یعنی مهمونی گرفتن. باز یه ترکیب ثابت: فعلش *have* هست، نه *make* و نه *take*.", example_gloss: "ما هر سال توی اکتبر مهمونی می‌گیریم."}
  en.a1.unit37.lesson02.teach.come_to_my_party_question: {title: "Do you want to come to my party?", gloss: "می‌خوای بیای مهمونیم؟", note: "*Do you want to come to my party?* -- دعوت دوستانه با سؤال *Do you want to...*. بعد از *come* مقصد با *to* میاد."}

  en.a1.unit37.lesson03.teach.dialogue_line1: {title: "خبر لیلا", gloss: "لیلا می‌پرسه می‌دونستی تولد دنیل ۱۲ اکتبره؟", note: "*Did you know...?* -- سؤال گذشته با *did*، و فعل اصلی به شکل ساده برمی‌گرده: *know* نه *knew*."}
  en.a1.unit37.lesson03.teach.dialogue_line2: {title: "جواب میا", gloss: "میا می‌گه نه، نمی‌دونسته! و می‌گه اون جمعهٔ بعده.", note: "*No, I didn't!* -- جواب کوتاه منفی گذشته. *next Friday* یعنی جمعهٔ بعد."}
  en.a1.unit37.lesson03.teach.dialogue_line3: {title: "پیشنهاد لیلا", gloss: "لیلا می‌گه بیاین توی دفتر براش یه مهمونی سورپرایز بگیریم.", note: "*Let's have a surprise party for him* -- پیشنهاد با *Let's*، و «برای او» با *for him*."}
  en.a1.unit37.lesson03.teach.dialogue_line4: {title: "جواب میا", gloss: "میا می‌گه فکر خوبیه! و می‌گه می‌تونه بقیهٔ تیم رو دعوت کنه.", note: "*I can invite the rest of the team* -- *the rest of* یعنی بقیهٔ."}
  en.a1.unit37.lesson03.teach.dialogue_line5: {title: "برنامهٔ لیلا", gloss: "لیلا می‌گه عالیه. اون براش کادو می‌خره -- شاید کفش دویدن نو، چون دنیل عاشق دویدنه.", note: "*I'll buy him a gift* -- باز الگوی دو مفعولی بدون حرف اضافه: اول *him*، بعد *a gift*. *since* اینجا یعنی «چون»."}
  en.a1.unit37.lesson03.teach.dialogue_line6: {title: "پیشنهاد میا", gloss: "میا می‌گه فکر خیلی خوبیه، و می‌پرسه کیک هم بگیرن؟", note: "*Should we get a cake too?* -- پیشنهاد با *Should we...?* یعنی «... بگیریم؟»"}
  en.a1.unit37.lesson03.teach.dialogue_line7: {title: "جواب لیلا", gloss: "لیلا می‌گه آره، حتماً! همه با هم بهش تبریک می‌گن.", note: "*We'll all congratulate him together* -- شخص مستقیم بعد از *congratulate* میاد، بدون «به»."}

  en.a1.unit37.lesson04.teach.reading_passage: {title: "متن: مهمونی سورپرایز", gloss: "دنیل نمی‌دونست لیلا و میا دارن براش مهمونی سورپرایز برنامه‌ریزی می‌کنن. روز ۱۲ اکتبر، روز تولدش، رسید سر کار و توی اتاق استراحت بادکنک و کیک دید. همه گفتن «تولدت مبارک!» و بهش تبریک گفتن. لیلا یه جفت کفش دویدن نو بهش داد. میا یه عکس قاب‌شده از سه همکار کنار هم بهش داد، عکسی که خودش گرفته بود. دنیل خیلی خوشحال شد و از همه بابت این سورپرایز فوق‌العاده تشکر کرد.", note: "کل متن توی زمان گذشته‌ست: *didn't know*، *arrived*، *found*، *gave*، *took*، *thanked* -- شکل گذشتهٔ فعل‌ها رو که از واحد رویدادهای گذشته بلدین اینجا توی یه داستان واقعی می‌بینین."}

exercises:
  en.a1.unit37.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "party"
    distractors: ["birthday", "gift", "invite", "celebrate"]
    accepted_answers: [{value: "party", status: "correct"}]
    feedback: "*party* یعنی مهمونی."
  en.a1.unit37.lesson01.exercise02.choose_gift_meaning:
    instruction: "کدوم کلمه یعنی چیزی که برای جشن گرفتن یه مناسبت به کسی می‌دین؟"
    correct_option: "gift"
    distractors: ["party", "birthday", "congratulations"]
    accepted_answers: [{value: "gift", status: "correct"}]
    feedback: "*gift* یعنی کادو یا هدیه."
  en.a1.unit37.lesson01.exercise03.match_celebration_words:
    instruction: "هر واژه یا عبارت انگلیسی رو به توضیح فارسی درستش وصل کنین."
    pairs:
      - {left: "birthday", right: "روزی از سال که به دنیا اومدین و هر سال جشنش می‌گیرین"}
      - {left: "party", right: "دورهمی با دوست‌ها یا خانواده برای جشن گرفتن"}
      - {left: "gift", right: "چیزی که برای تولد به کسی می‌دین"}
      - {left: "celebrate", right: "انجام دادن کاری خوشایند به مناسبت یک اتفاق خاص"}
      - {left: "congratulations", right: "چیزی که برای تولد یا شغل جدید به کسی می‌گین"}
    accepted_answers:
      - value:
          - {left: "birthday", right: "روزی از سال که به دنیا اومدین و هر سال جشنش می‌گیرین"}
          - {left: "party", right: "دورهمی با دوست‌ها یا خانواده برای جشن گرفتن"}
          - {left: "gift", right: "چیزی که برای تولد به کسی می‌دین"}
          - {left: "celebrate", right: "انجام دادن کاری خوشایند به مناسبت یک اتفاق خاص"}
          - {left: "congratulations", right: "چیزی که برای تولد یا شغل جدید به کسی می‌گین"}
        status: "correct"
    feedback: "هر تعریف به یک واژه یا عبارت انگلیسی اشاره می‌کنه."
  en.a1.unit37.lesson01.exercise04.order_party_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["We", "are", "having", "a", "party", "on", "Saturday."], status: "correct"}]
    feedback: "ترتیب درست: *We are having a party on Saturday.* -- برای روز هفته حرف اضافهٔ *on* میاد."
  en.a1.unit37.lesson01.exercise05.write_gift_word:
    instruction: "کلمه‌ای رو بنویسین که یعنی چیزی که برای یه مناسبت به کسی می‌دین."
    accepted_answers: [{value: "gift", status: "correct"}]
    feedback: "*gift* یعنی کادو."

  en.a1.unit37.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "congratulate someone on"
    distractors: ["invite someone to", "wish someone a happy birthday", "have a party"]
    accepted_answers: [{value: "congratulate someone on", status: "correct"}]
    feedback: "*congratulate someone on* یعنی به کسی بابت چیزی تبریک گفتن."
  en.a1.unit37.lesson02.exercise02.choose_surprise_party_meaning:
    instruction: "کدوم عبارت یعنی مهمونی‌ای که خودِ شخص از قبل ازش خبر نداره؟"
    correct_option: "surprise party"
    distractors: ["have a party", "invite someone to", "wish someone a happy birthday"]
    accepted_answers: [{value: "surprise party", status: "correct"}]
    feedback: "*surprise party* یعنی مهمونی سورپرایز."
  en.a1.unit37.lesson02.exercise03.choose_have_a_party_meaning:
    instruction: "کدوم عبارت یعنی میزبان یه جشن بودن؟"
    correct_option: "have a party"
    distractors: ["surprise party", "congratulate someone on", "invite someone to"]
    accepted_answers: [{value: "have a party", status: "correct"}]
    feedback: "*have a party* یعنی مهمونی گرفتن -- فعلش *have* هست."
  en.a1.unit37.lesson02.exercise04.order_have_a_party_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["We", "have", "a", "party", "every", "year", "in", "October."], status: "correct"}]
    feedback: "ترتیب درست: *We have a party every year in October.*"
  en.a1.unit37.lesson02.exercise05.translate_come_to_party:
    instruction: "ترجمه کنین: «می‌خوای بیای مهمونیم؟»"
    accepted_answers: [{value: "Do you want to come to my party?", status: "correct"}, {value: "Do you want to come to my party", status: "correct"}]
    feedback: "*Do you want to come to my party?* -- بعد از *come* مقصد با *to* میاد."

  en.a1.unit37.lesson03.exercise01.comprehension_daniel_birthday:
    instruction: "طبق گفتگو، تولد دنیل کیه؟"
    correct_option: "October 12th"
    distractors: ["October 2nd", "November 12th", "October 20th"]
    accepted_answers: [{value: "October 12th", status: "correct"}]
    feedback: "لیلا می‌گه تولد دنیل ۱۲ اکتبره."
  en.a1.unit37.lesson03.exercise02.comprehension_leila_gift:
    instruction: "طبق گفتگو، لیلا می‌خواد چه کادویی برای دنیل بخره؟"
    correct_option: "running shoes"
    distractors: ["a book", "a framed photo", "a new phone"]
    accepted_answers: [{value: "running shoes", status: "correct"}]
    feedback: "لیلا می‌گه شاید کفش دویدن نو بخره، چون دنیل عاشق دویدنه."
  en.a1.unit37.lesson03.exercise03.listen_dialogue_plan:
    instruction: "طبق گفتگو، لیلا و میا دارن چی برای دنیل برنامه‌ریزی می‌کنن؟"
    correct_option: "a surprise party"
    distractors: ["a birthday card", "a work trip", "a group photo"]
    accepted_answers: [{value: "a surprise party", status: "correct"}]
    feedback: "دارن براش یه مهمونی سورپرایز توی دفتر برنامه‌ریزی می‌کنن."
  en.a1.unit37.lesson03.exercise04.respond_own_wish:
    instruction: "یه جمله بگین که باهاش کسی رو به یه جشن دعوت کنین یا بهش تبریک بگین."
    accepted_answers: ["Congratulations!", "Congratulations", "Happy birthday!", "Happy birthday", "Do you want to come to my party?", "Do you want to come to my party.", "I want to invite you to my party", "I want to invite you to my party.", "Congratulations on your promotion", "Congratulations on your promotion."]
    feedback: "می‌تونین بگین *Happy birthday!*، *Congratulations on...* یا *Do you want to come to my party?*"

  en.a1.unit37.lesson04.exercise01.reading_daniel_date:
    instruction: "طبق متن، تاریخ تولد دنیل چیه؟"
    correct_option: "October 12th"
    distractors: ["October 21st", "November 12th", "October 2nd"]
    accepted_answers: [{value: "October 12th", status: "correct"}]
    feedback: "متن می‌گه ۱۲ اکتبر، روز تولدش."
  en.a1.unit37.lesson04.exercise02.reading_leila_gift:
    instruction: "طبق متن، لیلا چه کادویی به دنیل داد؟"
    correct_option: "running shoes"
    distractors: ["a framed photo", "a cake", "a book about running"]
    accepted_answers: [{value: "running shoes", status: "correct"}]
    feedback: "متن می‌گه لیلا یه جفت کفش دویدن نو بهش داد."
  en.a1.unit37.lesson04.exercise03.reading_mia_gift:
    instruction: "طبق متن، میا چه کادویی به دنیل داد؟"
    correct_option: "a framed photo"
    distractors: ["running shoes", "balloons", "a camera"]
    accepted_answers: [{value: "a framed photo", status: "correct"}]
    feedback: "متن می‌گه میا یه عکس قاب‌شده از سه همکار بهش داد، عکسی که خودش گرفته بود."
  en.a1.unit37.lesson04.exercise04.write_own_celebration_sentence:
    instruction: "یه جملهٔ دعوت یا تبریک بنویسین، با *Do you want to come to*، *Happy birthday* یا *Congratulations on*."
    accepted_answers: ["Do you want to come to my party?", "Do you want to come to my party.", "Happy birthday!", "Happy birthday", "Congratulations on your new job", "Congratulations on your new job.", "Congratulations on your promotion", "Congratulations on your promotion."]
    feedback: "می‌تونین از الگوی *Do you want to come to...*، *Happy birthday!* یا *Congratulations on...* استفاده کنین."
