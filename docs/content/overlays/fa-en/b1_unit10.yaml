course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح میانی (B1) برای فارسی‌زبان‌ها، با تمرکز بر شرط، توالی رویدادها، نقل قول غیرمستقیم، هدف و فرض‌های غیرواقعی."

units:
  en.b1.unit10.purpose: {title: "چرا این کار را انجام می‌دم"}

lessons:
  en.b1.unit10.lesson01.purpose_vocabulary: {title: "in order to، so that و goal"}
  en.b1.unit10.lesson02.purpose_clauses: {title: "درس می‌خونم تا بهتر بشم"}
  en.b1.unit10.lesson03.reading_clear_goals: {title: "متن: هدف‌های روشن"}
  en.b1.unit10.lesson04.the_goals_dialogue: {title: "برای این که واژه‌های بیشتری یادم بمونه"}

teaching:
  en.b1.unit10.lesson01.teach.in_order_to: {title: "in order to", gloss: "برای این که، به‌منظور", note: "in order to هدف یک کار را نشان می‌ده و بعدش فعل ساده میاد.", example_gloss: "درس می‌خونم تا انگلیسیم بهتر بشه."}
  en.b1.unit10.lesson01.teach.so_that: {title: "so that", gloss: "تا، برای این که", note: "so that هدف یا نتیجهٔ موردنظر را با یک جملهٔ کامل بیان می‌کنه.", example_gloss: "یادداشت می‌نویسم تا واژه‌های جدید یادم بمونه."}
  en.b1.unit10.lesson01.teach.goal: {title: "goal", gloss: "هدف", note: "goal یعنی چیزی که می‌خواین بهش برسین.", example_gloss: "هدفش اینه که یک دورهٔ طراحی برداره."}
  en.b1.unit10.lesson01.teach.improve: {title: "improve", gloss: "بهتر کردن، بهتر شدن", note: "improve یعنی چیزی را بهتر کنین یا بهتر بشه.", example_gloss: "دنیل می‌خواد نوشتنش در محل کار بهتر بشه."}
  en.b1.unit10.lesson01.teach.save_money: {title: "save money", gloss: "پول پس‌انداز کردن", note: "save money یعنی پول را برای بعد نگه دارین، نه این که خرجش کنین.", example_gloss: "لیلا برای دورهٔ بعدی‌اش پول پس‌انداز می‌کنه."}
  en.b1.unit10.lesson01.teach.prepare: {title: "prepare", gloss: "آماده شدن، آماده کردن", note: "prepare یعنی برای چیزی آماده بشین یا چیزی را آماده کنین.", example_gloss: "قبل از هر جلسه سؤال آماده می‌کنم."}

  en.b1.unit10.lesson02.teach.evening_class: {title: "I am taking an evening class in order to improve my English.", gloss: "دارم یک کلاس عصرانه می‌رم تا انگلیسیم بهتر بشه.", note: "*in order to* قبل از فعل ساده میاد: *in order to improve*."}
  en.b1.unit10.lesson02.teach.study_so_that: {title: "I study every night so that I can remember more vocabulary.", gloss: "هر شب درس می‌خونم تا واژه‌های بیشتری یادم بمونه.", note: "*so that* قبل از یک جملهٔ کامل میاد: *I can remember more vocabulary*."}
  en.b1.unit10.lesson02.teach.grammar_purpose: {title: "بیان هدف با in order to و so that", gloss: "درس می‌خونم تا بهتر بشم. درس می‌خونم تا بیشتر یادم بمونه.", note: "*in order to* + فعل ساده میاد؛ *so that* + جملهٔ کامل میاد."}

  en.b1.unit10.lesson03.teach.design_course: {title: "design course", gloss: "دورهٔ طراحی", note: "design course یعنی کلاسی دربارهٔ طراحی و این که چیزها چطور دیده و ساخته می‌شن.", example_gloss: "لیلا برای یک دورهٔ طراحی پول پس‌انداز می‌کنه."}
  en.b1.unit10.lesson03.teach.clear_goal: {title: "clear goal", gloss: "هدف روشن", note: "clear goal یعنی هدفی که دقیق و قابل فهمه.", example_gloss: "یک هدف روشن کمک می‌کنه تصمیم بگیرین بعدش چیکار کنین."}
  en.b1.unit10.lesson03.teach.reading_passage: {title: "متن: هدف‌های روشن", gloss: "دنیل و لیلا هر دو هدف‌های روشنی دارن. دنیل یک کلاس عصرانه می‌ره تا انگلیسی‌اش برای کار بهتر بشه. او نوشتن گزارش‌های پیشرفت کوتاه را تمرین می‌کنه تا حرفه‌ای‌تر به نظر برسه. لیلا پول پس‌انداز می‌کنه تا سال آینده یک دورهٔ طراحی برداره. او توضیحات دوره‌ها را می‌خونه تا برنامهٔ مناسب را انتخاب کنه.", note: "این متن هدف کارها را با *in order to* و *so that* توضیح می‌ده."}

  en.b1.unit10.lesson04.teach.q_why_evening_class: {title: "پرسش لیلا", gloss: "لیلا می‌پرسه دنیل، چرا یک کلاس عصرانه می‌ری؟", note: "why برای پرسیدن هدف یا دلیل استفاده می‌شه."}
  en.b1.unit10.lesson04.teach.a_improve_english: {title: "جواب دنیل", gloss: "دنیل می‌گه دارم این کلاس رو می‌رم تا انگلیسیم برای کار بهتر بشه.", note: "*in order to improve my English* هدف کلاس رفتن را بیان می‌کنه."}
  en.b1.unit10.lesson04.teach.q_studying_every_night: {title: "پرسش بعدی لیلا", gloss: "لیلا می‌گه منطقیه. هر شب درس می‌خونی؟", note: "این سؤال دربارهٔ عادت مطالعهٔ دنیله."}
  en.b1.unit10.lesson04.teach.a_remember_vocabulary: {title: "جواب دنیل با so that", gloss: "دنیل می‌گه سی دقیقه درس می‌خونم تا واژه‌های بیشتری یادم بمونه.", note: "*so that I can remember* یک جملهٔ کامل بعد از so that است."}
  en.b1.unit10.lesson04.teach.q_saving_money: {title: "هدف لیلا", gloss: "لیلا می‌گه برنامهٔ خوبیه. دارم پول پس‌انداز می‌کنم تا سال آینده یک دورهٔ طراحی بردارم.", note: "لیلا هم هدف کارش را با *so that* بیان می‌کنه."}
  en.b1.unit10.lesson04.teach.a_clear_goals: {title: "جمع‌بندی دنیل", gloss: "دنیل می‌گه پس هر دومون هدف‌های روشنی داریم.", note: "clear goals یعنی هدف‌هایی که دقیق و قابل فهم هستند."}

exercises:
