    instruction: "گوش کنین و عبارتی را که گفته شده انتخاب کنین."
    correct_option: "in order to"
    distractors: ["so that", "goal", "prepare"]
    accepted_answers: [{value: "in order to", status: "correct"}]
    feedback: "in order to یعنی برای این که / به‌منظور."
  en.b1.unit10.lesson01.exercise02.choose_goal_word:
    instruction: "کدام کلمه یعنی چیزی که می‌خواین بهش برسین؟"
    correct_option: "goal"
    distractors: ["prepare", "improve", "save money"]
    accepted_answers: [{value: "goal", status: "correct"}]
    feedback: "goal یعنی هدف."
