course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح میانی (B1) برای فارسی‌زبان‌ها، با تمرکز بر بیان ضرورت، توانایی، شرط، بحث و کار، همراه با توضیحات دقیق فارسی."

units:
  en.b1.unit04.debate: {title: "موافقم، مخالفم، چون"}

lessons:
  en.b1.unit04.lesson01.debate_vocabulary: {title: "agree، disagree و opinion"}
  en.b1.unit04.lesson02.agreeing_and_disagreeing: {title: "موافقم که..., مخالفم که..."}
  en.b1.unit04.lesson03.reading_two_opinions: {title: "متن: دو نظر متفاوت"}
  en.b1.unit04.lesson04.the_remote_work_dialogue: {title: "هر کسی نظر متفاوتی داره"}

teaching:
  en.b1.unit04.lesson01.teach.agree: {title: "agree", gloss: "موافق بودن", note: "agree یعنی فکر کردن به این که کسی دیگه درست می‌گه.", example_gloss: "با تو موافقم."}
  en.b1.unit04.lesson01.teach.disagree: {title: "disagree", gloss: "مخالف بودن", note: "disagree یعنی فکر کردن به این که کسی دیگه اشتباه می‌کنه.", example_gloss: "با اون نظر مخالفم."}
  en.b1.unit04.lesson01.teach.opinion: {title: "opinion", gloss: "نظر شخصی", note: "opinion یعنی دیدگاه شخصی دربارهٔ چیزی.", example_gloss: "هر کسی نظر متفاوتی داره."}
  en.b1.unit04.lesson01.teach.believe: {title: "believe", gloss: "باور داشتن، فکر کردن", note: "believe یعنی فکر کردن به این که چیزی درسته.", example_gloss: "فکر می‌کنم ایدهٔ خوبیه."}
  en.b1.unit04.lesson01.teach.reason: {title: "reason", gloss: "دلیل", note: "reason یعنی توضیحی که پشت یه نظر هست.", example_gloss: "دلیلت برای این فکر چیه؟"}
  en.b1.unit04.lesson01.teach.save_time: {title: "save time", gloss: "صرفه‌جویی در وقت", note: "save time یعنی وقت رو هدر ندادن.", example_gloss: "کار از خونه بهم کمک می‌کنه وقت صرفه‌جویی کنم."}

  en.b1.unit04.lesson02.teach.agree_that_saves_time: {title: "I agree that working from home is better because you save time.", gloss: "موافقم که کار از خونه بهتره چون وقت صرفه‌جویی می‌کنی.", note: "I agree that + جمله -- برای موافقت با یه نظر و اشاره به همون نظر با یه that-clause."}
  en.b1.unit04.lesson02.teach.disagree_that_miss_coworkers: {title: "I disagree that it's better because you miss your coworkers.", gloss: "مخالفم که بهتره چون دلت برای همکارات تنگ می‌شه.", note: "I disagree that + جمله -- برای مخالفت با یه نظر و دادن دلیل."}
  en.b1.unit04.lesson02.teach.grammar_agree_disagree_that: {title: "موافقت و مخالفت با that-clause", gloss: "موافقم که بهتره. مخالفم که بهتره.", note: "*agree that* و *disagree that* هر دو با یه جمله کامل میان (نه فقط یه اسم) -- این جمله همون نظری‌ست که موافق یا مخالفشین."}

  en.b1.unit04.lesson03.teach.focus: {title: "focus", gloss: "تمرکز کردن", note: "focus یعنی حواستون کاملاً روی کار باشه.", example_gloss: "خونه راحت‌تر می‌تونه تمرکز کنه."}
  en.b1.unit04.lesson03.teach.respect: {title: "respect", gloss: "احترام گذاشتن", note: "respect یعنی به نظر یا حق کسی احترام گذاشتن، حتی اگه باهاش موافق نباشین.", example_gloss: "اونا به نظر همدیگه احترام می‌ذارن."}
  en.b1.unit04.lesson03.teach.reading_passage: {title: "متن: دو نظر متفاوت", gloss: "میا فکر می‌کنه کار از خونه بهتره چون راحت‌تر می‌تونه تمرکز کنه. لیلا مخالفه. اون فکر می‌کنه رفتن به اداره بهتره چون دوست داره هر روز همکاراش رو ببینه. اونا با هم موافق نیستن، ولی به نظر همدیگه احترام می‌ذارن.", note: "این متن نشون می‌ده دو نفر می‌تونن مخالف باشن ولی هنوزم به نظر همدیگه احترام بذارن."}

  en.b1.unit04.lesson04.teach.q_working_from_home: {title: "پرسش دنیل", gloss: "دنیل می‌پرسه فکر می‌کنی کار از خونه بهتر از اداره‌ست؟", note: "Do you think...? یه راه معمول برای پرسیدن نظر کسیه."}
  en.b1.unit04.lesson04.teach.a_disagree_miss_coworkers: {title: "جواب لیلا", gloss: "لیلا می‌گه مخالفم که بهتره. فکر می‌کنم دلت برای گفتگوهای مهم با همکارات تنگ می‌شه.", note: "لیلا با that-clause به نظر دنیل اشاره می‌کنه و دلیلش رو می‌گه."}
  en.b1.unit04.lesson04.teach.q_fair_point_saves_time: {title: "جواب دنیل", gloss: "دنیل می‌گه حرف درستیه، ولی موافقم که خیلی وقت صرفه‌جویی می‌کنه.", note: "دنیل با but نظر لیلا رو قبول می‌کنه ولی دلیل خودش رو هم اضافه می‌کنه."}
  en.b1.unit04.lesson04.teach.a_agree_saves_time_prefer_office: {title: "جواب لیلا", gloss: "لیلا می‌گه موافقم که وقت صرفه‌جویی می‌کنه، ولی هنوزم اداره رو ترجیح می‌دم.", note: "لیلا روی یه نکته موافقه (صرفه‌جویی وقت) ولی نظر کلیش رو تغییر نمی‌ده."}
  en.b1.unit04.lesson04.teach.q_everyone_different_opinion: {title: "جمع‌بندی دنیل", gloss: "دنیل می‌گه منطقیه. هر کسی نظر متفاوتی داره.", note: "این جمله بحث رو بدون این که کسی برنده باشه، به‌طور دوستانه جمع می‌کنه."}

exercises:
  en.b1.unit04.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شده را انتخاب کنین."
    correct_option: "opinion"
    distractors: ["agree", "disagree", "reason"]
    accepted_answers: [{value: "opinion", status: "correct"}]
    feedback: "opinion یعنی نظر شخصی."
  en.b1.unit04.lesson01.exercise02.choose_disagree_word:
    instruction: "کدام کلمه به معنای فکر کردن به اشتباه بودن کسیه؟"
    correct_option: "disagree"
    distractors: ["agree", "believe", "respect"]
    accepted_answers: [{value: "disagree", status: "correct"}]
    feedback: "disagree یعنی مخالف بودن."
  en.b1.unit04.lesson01.exercise03.choose_reason_word:
    instruction: "کدام کلمه به معنای توضیح پشت یه نظره؟"
    correct_option: "reason"
    distractors: ["opinion", "agree", "save time"]
    accepted_answers: [{value: "reason", status: "correct"}]
    feedback: "reason یعنی دلیل."
  en.b1.unit04.lesson01.exercise04.match_debate_words:
    instruction: "هر معنی را به کلمه یا عبارت انگلیسی درست وصل کنید."
    accepted_answers: [{value: [{left: "to think someone else is right", right: "agree"}, {left: "to think someone else is wrong", right: "disagree"}, {left: "a personal view about something", right: "opinion"}, {left: "to think something is true", right: "believe"}, {left: "the explanation behind an opinion", right: "reason"}, {left: "to not waste time", right: "save time"}], status: "correct"}]
    feedback: "agree=موافق بودن، disagree=مخالف بودن، opinion=نظر، believe=باور داشتن، reason=دلیل، save time=صرفه‌جویی در وقت."
  en.b1.unit04.lesson01.exercise05.write_opinion:
    instruction: "کلمه‌ای که به معنای یه دیدگاه شخصی دربارهٔ چیزیه را بنویسین."
    accepted_answers:
      - {value: "opinion", status: "correct"}
      - {value: "Opinion", status: "correct"}
    feedback: "opinion یعنی نظر شخصی."

  en.b1.unit04.lesson02.exercise01.choose_agree_sentence:
    instruction: "کدام جمله با یه نظر موافقه و یه دلیل هم می‌ده؟"
    correct_option: "I agree that working from home is better because you save time."
    distractors: ["I disagree that it's better because you miss your coworkers.", "Everyone has a different opinion.", "I believe that it's a good idea."]
    accepted_answers: [{value: "I agree that working from home is better because you save time.", status: "correct"}]
    feedback: "I agree that...because... یعنی موافقتی با دلیل."
  en.b1.unit04.lesson02.exercise02.choose_disagree_sentence:
    instruction: "کدام جمله با یه نظر مخالفه و یه دلیل هم می‌ده؟"
    correct_option: "I disagree that it's better because you miss your coworkers."
    distractors: ["I agree that working from home is better because you save time.", "Everyone has a different opinion.", "I believe that it's a good idea."]
    accepted_answers: [{value: "I disagree that it's better because you miss your coworkers.", status: "correct"}]
    feedback: "I disagree that...because... یعنی مخالفتی با دلیل."
  en.b1.unit04.lesson02.exercise03.order_agree_that_saves_time:
    instruction: "کلمات را برای گفتن «موافقم که کار از خونه بهتره.» مرتب کنین."
    accepted_answers: [{value: ["I", "agree", "that", "working", "from", "home", "is", "better"], status: "correct"}]
    feedback: "ترتیب درست: I agree that working from home is better."
  en.b1.unit04.lesson02.exercise04.reply_do_you_agree:
    instruction: "موافقین که کار از خونه بهتره؟"
    accepted_answers:
      - {value: "I agree that working from home is better because you save time.", status: "correct"}
      - {value: "I agree that working from home is better because you save time", status: "correct"}
    feedback: "I agree that working from home is better because you save time یعنی موافقم که کار از خونه بهتره چون وقت صرفه‌جویی می‌کنی."
  en.b1.unit04.lesson02.exercise05.write_disagree_coworkers:
    instruction: "بنویسین که مخالفین چون دلتون برای همکاراتون تنگ می‌شه."
    accepted_answers:
      - {value: "I disagree that it's better because you miss your coworkers.", status: "correct"}
      - {value: "I disagree that it's better because you miss your coworkers", status: "correct"}
    feedback: "I disagree that it's better because you miss your coworkers یعنی مخالفم چون دلتون برای همکاراتون تنگ می‌شه."

  en.b1.unit04.lesson03.exercise01.comprehend_mias_opinion:
    instruction: "میا فکر می‌کنه چی بهتره؟"
    correct_option: "working from home is better"
    distractors: ["going to the office is better", "saving money is better", "meeting coworkers is better"]
    accepted_answers: [{value: "working from home is better", status: "correct"}]
    feedback: "متن می‌گه: Mia thinks that working from home is better."
  en.b1.unit04.lesson03.exercise02.comprehend_leilas_reason:
    instruction: "دلیل لیلا برای ترجیح دادن اداره چیه؟"
    correct_option: "she likes seeing her coworkers every day"
    distractors: ["she can focus more easily", "she saves a lot of time", "she doesn't like working alone"]
    accepted_answers: [{value: "she likes seeing her coworkers every day", status: "correct"}]
    feedback: "متن می‌گه: she likes seeing her coworkers every day."
  en.b1.unit04.lesson03.exercise03.recognize_focus:
    instruction: "کدام کلمه به معنای تمرکز کامل روی کاره؟"
    correct_option: "focus"
    distractors: ["respect", "agree", "opinion"]
    accepted_answers: [{value: "focus", status: "correct"}]
    feedback: "focus یعنی تمرکز کردن."
  en.b1.unit04.lesson03.exercise04.order_they_respect_each_others:
    instruction: "کلمات را برای گفتن «اونا به نظر همدیگه احترام می‌ذارن.» مرتب کنین."
    accepted_answers: [{value: ["They", "respect", "each", "other's", "opinion"], status: "correct"}]
    feedback: "ترتیب درست: They respect each other's opinion."
  en.b1.unit04.lesson03.exercise05.write_leila_disagrees:
    instruction: "بنویسین که لیلا مخالفه."
    accepted_answers:
      - {value: "Leila disagrees.", status: "correct"}
      - {value: "Leila disagrees", status: "correct"}
    feedback: "Leila disagrees یعنی لیلا مخالفه."

  en.b1.unit04.lesson04.exercise01.listen_what_leila_disagrees_with:
    instruction: "گفتگو را گوش کنین و بگین دنیل دربارهٔ چی نظر می‌خواد."
    correct_option: "working from home is better than the office"
    distractors: ["saving money is better than spending it", "going to the gym is better than resting", "reading books is better than watching TV"]
    accepted_answers: [{value: "working from home is better than the office", status: "correct"}]
    feedback: "دنیل می‌پرسه: Do you think working from home is better than the office؟"
  en.b1.unit04.lesson04.exercise02.listen_leilas_reason:
    instruction: "گوش کنین و بگین دلیل مخالفت لیلا چیه."
    correct_option: "you miss important conversations with coworkers"
    distractors: ["you spend too much money", "you don't save any time", "you have to wake up early"]
    accepted_answers: [{value: "you miss important conversations with coworkers", status: "correct"}]
    feedback: "لیلا می‌گه: I think you miss important conversations with coworkers."
  en.b1.unit04.lesson04.exercise03.choose_what_daniel_agrees_with:
    instruction: "دنیل با چه چیزی دربارهٔ کار از خونه موافقه؟"
    correct_option: "it saves a lot of time"
    distractors: ["it helps you meet more coworkers", "it costs less money", "it makes meetings shorter"]
    accepted_answers: [{value: "it saves a lot of time", status: "correct"}]
    feedback: "دنیل می‌گه: I agree that it saves a lot of time."
  en.b1.unit04.lesson04.exercise04.order_everyone_has_different_opinion:
    instruction: "کلمات را برای گفتن «هر کسی نظر متفاوتی داره.» مرتب کنین."
    accepted_answers: [{value: ["Everyone", "has", "a", "different", "opinion"], status: "correct"}]
    feedback: "ترتیب درست: Everyone has a different opinion."
  en.b1.unit04.lesson04.exercise05.reply_as_leila:
    instruction: "دنیل می‌پرسه: فکر می‌کنی کار از خونه بهتر از اداره‌ست؟"
    accepted_answers:
      - {value: "I disagree that it's better. I think you miss important conversations with coworkers.", status: "correct"}
      - {value: "I disagree that it's better, and I think you miss important conversations with coworkers.", status: "correct"}
    feedback: "این جواب هم مخالفت (disagree that) و هم دلیلش رو با هم بیان می‌کنه."
  en.b1.unit04.lesson04.exercise06.speak_debate_dialogue:
    instruction: "به نقش لیلا، با صدای بلند به دنیل جواب بدین."
    accepted_answers:
      - {value: "I agree that it saves time, but I still prefer the office.", status: "correct"}
    feedback: "این جواب یه نکته رو قبول می‌کنه (صرفه‌جویی وقت) ولی نظر کلی خودش رو هم نگه می‌داره."
