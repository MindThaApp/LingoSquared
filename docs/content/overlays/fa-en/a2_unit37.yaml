    accepted_answers: [{value: ["I", "have", "a", "video", "call", "with", "my", "team", "every", "Monday"], status: "correct"}]
    feedback: "ترتیب درست *I have a video call with my team every Monday* است."
  en.a2.unit37.lesson02.exercise06.reply_opinion_video_calls:
    instruction: "کسی می‌پرسه نظرت دربارهٔ تماس تصویری چیه. با جملهٔ نظری این درس جواب بدین: مفیده، ولی ملاقات حضوری رو ترجیح می‌دین."
    accepted_answers:
      - {value: "I think video calls are useful, but I prefer meeting people face to face.", status: "correct"}
      - {value: "I think video calls are useful but I prefer meeting people face to face", status: "correct"}
    feedback: "*I think video calls are useful, but I prefer meeting people face to face* اول نظر و بعد ترجیح رو می‌ده."
  en.a2.unit37.lesson02.exercise07.write_opinion_with_reason:
    instruction: "نظرتون رو دربارهٔ تماس تصویری با I think و but I prefer بنویسید، دقیقاً مثل همین درس."
    accepted_answers:
      - {value: "I think video calls are useful, but I prefer meeting people face to face.", status: "correct"}
      - {value: "I think video calls are useful but I prefer meeting people face to face", status: "correct"}
    feedback: "*I think video calls are useful, but I prefer meeting people face to face* همون جملهٔ این درسه."

  en.a2.unit37.lesson03.exercise01.read_camera_habit:
    instruction: "لیلا اول یه کلاس آنلاین چیکار می‌کنه؟"
    correct_option: "turn on my camera"
    distractors: ["mute my camera", "use my phone", "send a message to the teacher"]
    accepted_answers: [{value: "turn on my camera", status: "correct"}]
    feedback: "توی متن نوشته *I turn on my camera*."
  en.a2.unit37.lesson03.exercise02.read_headphones_reason:
    instruction: "لیلا توی پیامش با چه کلماتی می‌گه چرا هدفون می‌ذاره؟"
    correct_option: "my connection is better with them"
    distractors: ["my classmates cannot hear me", "my camera works better with them", "the teacher asks for them"]
    accepted_answers: [{value: "my connection is better with them", status: "correct"}]
    feedback: "توی متن نوشته *my connection is better with them*."
  en.a2.unit37.lesson03.exercise03.choose_leilas_opinion:
    instruction: "نظر لیلا دربارهٔ تماس تصویری چیه؟"
    correct_option: "video calls save a lot of time"
    distractors: ["video calls are too long", "video calls are always better", "video calls are bad for her"]
    accepted_answers: [{value: "video calls save a lot of time", status: "correct"}]
    feedback: "توی متن نوشته *video calls save a lot of time*."
  en.a2.unit37.lesson03.exercise04.choose_what_she_prefers:
    instruction: "لیلا توی پیامش با چه کلماتی می‌گه هنوز چی رو ترجیح می‌ده؟"
    correct_option: "meeting my classmates face to face"
    distractors: ["studying at home", "writing to my classmates", "having more online classes"]
    accepted_answers: [{value: "meeting my classmates face to face", status: "correct"}]
    feedback: "توی متن نوشته *I still prefer meeting my classmates face to face*."
  en.a2.unit37.lesson03.exercise05.order_mute_until_question:
    instruction: "کلمه‌ها رو طوری مرتب کنید که «میکروفونم رو بی‌صدا می‌کنم تا وقتی استاد سؤالی بپرسه» بشه."
    accepted_answers: [{value: ["I", "mute", "my", "microphone", "until", "the", "teacher", "asks", "a", "question"], status: "correct"}]
    feedback: "ترتیب درست *I mute my microphone until the teacher asks a question* است."
  en.a2.unit37.lesson03.exercise06.write_own_video_call_message:
    instruction: "جملهٔ لیلا دربارهٔ هدفونش رو، با because، بنویسید."
    accepted_answers:
