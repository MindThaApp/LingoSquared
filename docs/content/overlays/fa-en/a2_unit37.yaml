review: {status: "reviewed", required_next_reviewer: null, notes: "Iranian Persian overlay for the new a2_unit37_video_calls realization, authored 2026-07-22. Register is the colloquial spoken Persian pinned for this lane (می‌شه/می‌ده/رو/الان/می‌تونین), which suits the peer conversation between Leila and Daniel. Vocabulary is deliberately Iranian, not Afghan: تماس تصویری، دوربین، اینترنت، کلاس، هم‌کلاسی، هدفون. Continuity with this lane's own a2_unit33 kept: کلاس آنلاین = online class, and Leila's Monday/Wednesday classes are the same ones. AUTHORING NOTE FOR THE REVIEWER: the prs-en overlay of this same realization was written by the same session, earlier and separately; please grep for Dari leakage (استه، می‌تانین، همرای، کمره، صنف، هم‌صنفی، کنکشن، انترنت). Every listen_select/dialogue distractor checked against the full audio text of its own media asset -- none is spoken anywhere in that audio. PENDING a fresh-context review.\n\nfa-en review 2026-10-19: Checked notes, glosses, Persian style/ZWNJ, leakage, distractors, accepted answers, Leila/Daniel canon (u33 online classes) and sequencing. 3 fixes: comparison note no longer limits less...than to long adjectives; untaught distractor 'difficult' replaced; 'درباره‌شون' spelling fixed (4 places). Native flag: استاد vs معلم for Leila's online-class teacher. Shared-en fix 2026-10-20: the first-person key quotes the message but the question asked about the character in the third person. The question now asks which words from the text give the answer (realization prompt and nl/fa/prs instructions); keys unchanged. A third-person key was not used because she/her/he/his are not introduced anywhere in the A2 course (the token check fails). Persian/Dari distractors moved to first person to match the quoted options."}

course:
  title: "انگلیسی A2"
  description: "آموزش انگلیسی سطح A2 برای موقعیت‌های رسمی‌تر، با توضیحات دقیق فارسی."

units:
  en.a2.unit37.video_calls: {title: "صحبت دربارهٔ تماس تصویری"}

lessons:
  en.a2.unit37.lesson01.video_call_vocabulary: {title: "دوربین، میکروفون و اتصال"}
  en.a2.unit37.lesson02.describing_your_video_calls: {title: "توصیف تماس‌های تصویری‌تون و اینکه چی رو ترجیح می‌دین"}
  en.a2.unit37.lesson03.reading_about_video_calls: {title: "خواندن دربارهٔ تماس‌های تصویری یه نفر دیگه"}
  en.a2.unit37.lesson04.video_calls_dialogue: {title: "صحبت با یه دوست دربارهٔ تماس تصویری"}

teaching:
  en.a2.unit37.lesson01.teach.video_call: {title: "video call", gloss: "تماس تصویری", note: "*video call* یعنی تماسی که توش همدیگه رو هم می‌بینین.", example_gloss: "هر دوشنبه با تیمم یه تماس تصویری دارم."}
  en.a2.unit37.lesson01.teach.camera: {title: "camera", gloss: "دوربین", note: "*camera* یعنی همون بخشی که تصویر شما رو نشون می‌ده.", example_gloss: "قبل از شروع جلسه دوربینتون رو روشن کنید."}
  en.a2.unit37.lesson01.teach.microphone: {title: "microphone", gloss: "میکروفون", note: "*microphone* یعنی همون بخشی که صدای شما رو منتقل می‌کنه.", example_gloss: "میکروفونم خاموش بود، برای همین بقیه صدام رو نشنیدن."}
  en.a2.unit37.lesson01.teach.connection: {title: "connection", gloss: "اتصال اینترنت", note: "*connection* یعنی ارتباط کامپیوترتون با اینترنت.", example_gloss: "اتصال ضعیف بود، برای همین تصویر قطع شد."}
  en.a2.unit37.lesson01.teach.mute: {title: "mute", gloss: "بی‌صدا کردن", note: "*mute* یعنی صداتون رو ببندین تا بقیه نشنون.", example_gloss: "وقتی خودم حرف نمی‌زنم میکروفونم رو بی‌صدا می‌کنم."}
  en.a2.unit37.lesson01.teach.face_to_face: {title: "face to face", gloss: "حضوری", note: "*face to face* یعنی توی یه اتاق، نه از پشت صفحه‌نمایش.", example_gloss: "بعضی جلسه‌ها حضوری بهتر از آنلاین هستن."}
  en.a2.unit37.lesson01.teach.grammar_comparison: {title: "مقایسه با faster than و less than", gloss: "یه تماس تصویری سریع‌تر از یه ملاقات است. یه تماس تصویری کمتر از یه ملاقات حضوری صمیمیه.", note: "برای «بیشتر» با صفت‌های کوتاه *-er than* می‌آد (*faster than*) و با صفت‌های بلندتر *more ... than*؛ برای «کمتر» با هر صفتی *less ... than* می‌آد (*less personal than*)."}

  en.a2.unit37.lesson02.teach.video_call_every_monday: {title: "گفتن اینکه چند وقت یه بار تماس تصویری دارین", gloss: "هر دوشنبه با تیمم یه تماس تصویری دارم.", note: "*every Monday* یعنی هر دوشنبه، پس یه عادت ثابته."}
  en.a2.unit37.lesson02.teach.turn_on_your_camera: {title: "خواستن اینکه کسی دوربینش رو روشن کنه", gloss: "می‌تونی دوربینت رو روشن کنی؟", note: "*turn on* یعنی روشن کردن؛ برعکسش *turn off* است."}
  en.a2.unit37.lesson02.teach.you_were_on_mute: {title: "گفتن اینکه صدای کسی بسته بود", gloss: "ببخشید، صدات بسته بود.", note: "*you were on mute* یه عبارت ثابت انگلیسیه که توی جلسه‌های آنلاین زیاد شنیده می‌شه."}
  en.a2.unit37.lesson02.teach.useful_but_prefer_face_to_face: {title: "دادن نظر همراه با یه ترجیح", gloss: "فکر می‌کنم تماس تصویری مفیده، ولی ترجیح می‌دم آدم‌ها رو حضوری ببینم.", note: "*I think... but I prefer...* اول نظرتون و بعد ترجیحتون رو می‌ده."}
  en.a2.unit37.lesson02.teach.grammar_prefer: {title: "prefer X to Y", gloss: "تماس تصویری رو به تماس تلفنی ترجیح می‌دم. ملاقات حضوری رو به تماس تصویری ترجیح می‌دم.", note: "دقت کنید: بعد از *prefer* کلمهٔ *to* می‌آد، نه *than* -- *I prefer video calls to phone calls*."}

  en.a2.unit37.lesson03.teach.headphones: {title: "headphones", gloss: "هدفون", note: "*headphones* توی انگلیسی همیشه جمعه، حتی وقتی یه دونه‌ست.", example_gloss: "هدفون می‌ذارم تا خانواده‌ام صدای جلسه رو نشنون."}
  en.a2.unit37.lesson03.teach.leilas_message: {title: "پیام لیلا", gloss: "کلاس‌های آنلاینم الان همه تماس تصویری‌ان. دوربینم رو روشن می‌کنم، ولی میکروفونم رو بی‌صدا می‌کنم تا وقتی استاد سؤالی بپرسه. هدفون می‌ذارم، چون اتصالم باهاش بهتره. فکر می‌کنم تماس تصویری خیلی وقت صرفه‌جویی می‌کنه، ولی هنوز هم ترجیح می‌دم هم‌کلاسی‌هام رو حضوری ببینم.", note: "یه پیام غیررسمی از لیلا دربارهٔ کلاس‌های آنلاین خودش -- سطح A2."}
  en.a2.unit37.lesson03.teach.mute_until_question: {title: "گفتن اینکه کی میکروفونتون رو می‌بندین", gloss: "میکروفونم رو بی‌صدا می‌کنم تا وقتی استاد سؤالی بپرسه.", note: "*until* یعنی تا همون لحظه‌ای که یه اتفاق می‌افته."}

  en.a2.unit37.lesson04.teach.q_lot_of_video_calls: {title: "لیلا دربارهٔ کار دنیل می‌پرسه", gloss: "لیلا می‌پرسه: سر کار تماس تصویری زیاد داری؟", note: "*a lot of* یعنی زیاد؛ هم برای چیزهای شمردنی و هم غیرشمردنی به کار می‌ره."}
  en.a2.unit37.lesson04.teach.a_call_every_monday: {title: "دنیل دربارهٔ تماس ثابتش می‌گه", gloss: "دنیل می‌گه: آره، هر دوشنبه با تیمم یه تماس تصویری دارم.", note: "همون جمله‌ای که در درس دوم یاد گرفتین."}
  en.a2.unit37.lesson04.teach.q_turn_on_camera: {title: "لیلا دربارهٔ دوربینش می‌پرسه", gloss: "لیلا می‌پرسه: دوربینت رو روشن می‌کنی؟", note: "یه سؤال کوتاه برای گرفتن جزئیات بیشتر."}
  en.a2.unit37.lesson04.teach.a_always_but_mute: {title: "عادت دنیل توی جلسه‌ها", gloss: "دنیل می‌گه: همیشه، ولی وقتی خودم حرف نمی‌زنم میکروفونم رو بی‌صدا می‌کنم.", note: "*when I am not speaking* اینجا یعنی توی همون لحظه‌هایی که حرف نمی‌زنم."}
  en.a2.unit37.lesson04.teach.q_classes_are_video_calls: {title: "لیلا دربارهٔ کلاس‌هاش می‌گه", gloss: "لیلا می‌گه: کلاس‌های آنلاینم الان همه تماس تصویری‌ان.", note: "همون کلاس‌های دوشنبه و چهارشنبهٔ لیلا از واحد ۳۳."}
  en.a2.unit37.lesson04.teach.a_what_do_you_think: {title: "دنیل نظرش رو می‌پرسه", gloss: "دنیل می‌پرسه: نظرت درباره‌شون چیه؟", note: "*What do you think about them?* دربارهٔ نظر شما راجع به همون چیزی که تازه گفته شد می‌پرسه."}
  en.a2.unit37.lesson04.teach.q_useful_but_prefer: {title: "لیلا نظرش رو می‌ده", gloss: "لیلا می‌گه: فکر می‌کنم تماس تصویری مفیده، ولی ترجیح می‌دم آدم‌ها رو حضوری ببینم.", note: "همون جملهٔ نظری که در درس دوم یاد گرفتین."}
  en.a2.unit37.lesson04.teach.a_agree_faster_less_personal: {title: "دنیل موافقه", gloss: "دنیل می‌گه: موافقم. یه تماس تصویری سریع‌تر از یه ملاقات است، ولی کمتر صمیمیه.", note: "*I agree* رو برای موافقت می‌گین؛ بعدش معمولاً دلیل خودتون رو می‌آرین."}
  en.a2.unit37.lesson04.teach.q_exactly: {title: "لیلا تأیید می‌کنه", gloss: "لیلا می‌گه: دقیقاً.", note: "*Exactly* یه راه کوتاه برای گفتن اینه که کاملاً موافقین."}

