    accepted_answers: [{value: [{left: "video call", right: "تماس اینترنتی که تصویر همدیگه رو هم می‌بینین"}, {left: "camera", right: "بخشی که تصویرتون رو نشون می‌ده"}, {left: "microphone", right: "بخشی که صداتون رو منتقل می‌کنه"}, {left: "connection", right: "ارتباط بین دستگاه‌تون و اینترنت"}, {left: "mute", right: "قطع کردن صدای خودتون"}, {left: "face to face", right: "بودن در یک اتاق و نه پشت صفحه‌نمایش"}, {left: "online", right: "انجام شدن از راه اینترنت"}, {left: "meeting", right: "جلسه‌ای که آدم‌ها دربارهٔ کار حرف می‌زنن"}], status: "correct"}]
    feedback: "*video call*=تماس تصویری، *camera*=دوربین، *microphone*=میکروفون، *connection*=اتصال اینترنت، *mute*=بی‌صدا کردن، *face to face*=حضوری، *online*=آنلاین، *meeting*=جلسه."
  en.a2.unit37.lesson01.exercise05.write_microphone:
    instruction: "کلمه‌ای رو بنویسید که یعنی همون بخشی که صدای شما رو منتقل می‌کنه."
    accepted_answers:
