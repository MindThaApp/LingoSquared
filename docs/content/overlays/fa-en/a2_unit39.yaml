course:
  title: "انگلیسی A2"
  description: "آموزش انگلیسی سطح A2 برای موقعیت‌های رسمی‌تر، با توضیحات دقیق فارسی."

units:
  en.a2.unit39.after_the_interview: {title: "پیگیری بعد از مصاحبهٔ شغلی"}

lessons:
  en.a2.unit39.lesson01.offer_vocabulary: {title: "پیشنهاد کاری، قرارداد و تاریخ شروع"}
  en.a2.unit39.lesson02.following_up: {title: "پیگیری کردن و پذیرفتن پیشنهاد"}
  en.a2.unit39.lesson03.reading_an_offer_message: {title: "خواندن یک پیشنهاد کاری"}
  en.a2.unit39.lesson04.offer_call_dialogue: {title: "تماس تلفنی پیشنهاد کاری"}

teaching:
  en.a2.unit39.lesson01.teach.offer: {title: "offer", gloss: "پیشنهاد کاری", note: "*offer* اینجا یعنی پیشنهاد یه شغل؛ به عنوان فعل *to offer* یعنی پیشنهاد دادن.", example_gloss: "از شرکت برایت پث مارکتینگ یه پیشنهاد کاری گرفتم."}
  en.a2.unit39.lesson01.teach.contract: {title: "contract", gloss: "قرارداد", note: "*contract* یعنی توافق کتبی بین شما و شرکت.", example_gloss: "قرارداد برای یه ساله."}
  en.a2.unit39.lesson01.teach.salary: {title: "salary", gloss: "حقوق", note: "*salary* یعنی پولی که هر ماه بابت کارتون می‌گیرین.", example_gloss: "هفتهٔ بعد می‌تونیم دربارهٔ حقوق صحبت کنیم."}
  en.a2.unit39.lesson01.teach.accept: {title: "accept", gloss: "پذیرفتن", note: "*accept* یعنی به چیزی که بهتون پیشنهاد شده بله گفتن.", example_gloss: "دوست دارم این موقعیت شغلی رو بپذیرم."}
  en.a2.unit39.lesson01.teach.start_date: {title: "start date", gloss: "تاریخ شروع", note: "*start date* یعنی اولین روز کار جدیدتون.", example_gloss: "تاریخ شروع، اولین دوشنبهٔ ماهه."}
  en.a2.unit39.lesson01.teach.reply: {title: "reply", gloss: "پاسخ", note: "*reply* هم پاسخ به یه پیامه و هم فعل پاسخ دادن.", example_gloss: "همون روز یه پاسخ فرستادم."}
  en.a2.unit39.lesson01.teach.grammar_would_like_to: {title: "would like to برای یه خواستهٔ مؤدبانه", gloss: "دوست دارم پیشنهاد رو بپذیرم. دوست دارم دوشنبه شروع کنم.", note: "*I would like to...* مؤدبانه‌تر از *I want to...* است و به مکاتبهٔ کاری می‌خوره."}

  en.a2.unit39.lesson02.teach.thank_you_for_the_interview: {title: "شروع کردن پیامتون", gloss: "بابت مصاحبهٔ دیروز خیلی ممنون.", note: "*Thank you for...* شکل معمول شروع یه پیام تشکر کاریه."}
  en.a2.unit39.lesson02.teach.still_interested: {title: "گفتن اینکه هنوز علاقه‌مندین", gloss: "هنوز هم به این موقعیت شغلی خیلی علاقه‌مندم.", note: "*still* یعنی هنوز هم؛ بعد از *am/is/are* و قبل از صفت می‌آد."}
  en.a2.unit39.lesson02.teach.could_you_tell_me_start_date: {title: "پرسیدن مؤدبانهٔ تاریخ شروع", gloss: "می‌تونید تاریخ شروع رو بهم بگید؟", note: "*Could you tell me...?* یه سؤال غیرمستقیمه: مؤدبانه‌تر از *When is the start date?*"}
  en.a2.unit39.lesson02.teach.would_like_to_accept: {title: "پذیرفتن پیشنهاد", gloss: "دوست دارم پیشنهاد رو بپذیرم.", note: "این جملهٔ استاندارد پذیرفتن یه شغله."}
  en.a2.unit39.lesson02.teach.grammar_indirect_questions: {title: "سؤال‌های غیرمستقیم با Could you tell me", gloss: "می‌تونید تاریخ شروع رو بهم بگید؟ می‌تونید دربارهٔ ساعت‌های کاری بهم بگید؟", note: "بعد از *Could you tell me* یا یه اسم می‌آد (*the start date*) یا یه بخش با ترتیب خبری (*what the start date is*)، ولی ترتیب پرسشی نمی‌آد: *what is the start date* اینجا غلطه."}

  en.a2.unit39.lesson03.teach.full_time: {title: "full time", gloss: "تمام‌وقت", note: "*full time* یعنی یه هفتهٔ کاری کامل؛ برعکسش *part time* است.", example_gloss: "این موقعیت شغلی تمام‌وقته، نه دو روز در هفته."}
  en.a2.unit39.lesson03.teach.offer_message: {title: "متن پیشنهاد کاری", gloss: "میای عزیز، بابت اینکه سه‌شنبه تشریف آوردید ممنونیم. مایلیم موقعیت شغلی هماهنگ‌کنندهٔ بازاریابی رو به شما پیشنهاد بدیم. قرارداد تمام‌وقته و تاریخ شروع دوشنبه است. لطفاً تا جمعه پاسخ بدید. برایت پث مارکتینگ.", note: "یه پیشنهاد کاری همیشه چهار چیز رو می‌گه: موقعیت شغلی، نوع قرارداد، تاریخ شروع، و مهلت پاسخ."}
  en.a2.unit39.lesson03.teach.please_reply_by_friday: {title: "مهلت پاسخ دادن", gloss: "لطفاً تا جمعه پاسخ بدید.", note: "*by Friday* یعنی حداکثر تا جمعه، پس خود جمعه هم قبوله."}

  en.a2.unit39.lesson04.teach.q_calling_about_interview: {title: "مصاحبه‌کننده به میا زنگ می‌زنه", gloss: "مصاحبه‌کننده می‌گه: سلام میا، دربارهٔ مصاحبهٔ سه‌شنبه تماس گرفتم.", note: "*I am calling about...* شکل استاندارد شروع یه تماس کاریه."}
  en.a2.unit39.lesson04.teach.a_still_interested: {title: "میا می‌گه هنوز علاقه‌منده", gloss: "میا می‌گه: ممنون که تماس گرفتید. هنوز هم به این موقعیت شغلی خیلی علاقه‌مندم.", note: "همون جمله‌ای که در درس دوم یاد گرفتین."}
  en.a2.unit39.lesson04.teach.q_offer_you_the_job: {title: "مصاحبه‌کننده کار رو پیشنهاد می‌ده", gloss: "مصاحبه‌کننده می‌گه: خوبه، چون مایلیم این کار رو به شما پیشنهاد بدیم.", note: "*because* اینجا یعنی «چون»: خوبه که هنوز علاقه‌مندین، چون می‌خوایم کار رو بهتون پیشنهاد بدیم."}
  en.a2.unit39.lesson04.teach.a_great_news_ask_start_date: {title: "میا واکنش نشون می‌ده و تاریخ شروع رو می‌پرسه", gloss: "میا می‌گه: چه خبر خوبی. می‌تونید تاریخ شروع رو بهم بگید؟", note: "اول کوتاه به خبر واکنش نشون بدین، بعد سؤالتون رو بپرسین."}
  en.a2.unit39.lesson04.teach.q_start_date_and_contract: {title: "مصاحبه‌کننده تاریخ و قرارداد رو می‌گه", gloss: "مصاحبه‌کننده می‌گه: تاریخ شروع دوشنبه است و قرارداد تمام‌وقته.", note: "همون دو واقعیتی که توی پیام درس سوم هم بود."}
  en.a2.unit39.lesson04.teach.a_ask_working_hours: {title: "میا دربارهٔ ساعت‌های کاری می‌پرسه", gloss: "میا می‌پرسه: می‌تونید دربارهٔ ساعت‌های کاری بهم بگید؟", note: "همون شکل سؤال غیرمستقیمی که برای تاریخ شروع به کار رفت."}
  en.a2.unit39.lesson04.teach.q_nine_to_five: {title: "مصاحبه‌کننده ساعت‌ها رو می‌گه", gloss: "مصاحبه‌کننده می‌گه: از نُه تا پنج، با یه ساعت وقت ناهار.", note: "*from nine to five* شکل ثابت توصیف یه روز کاریه."}
  en.a2.unit39.lesson04.teach.a_accept_the_offer: {title: "میا پیشنهاد رو می‌پذیره", gloss: "میا می‌گه: ممنون. دوست دارم پیشنهاد رو بپذیرم.", note: "همون جمله‌ای که در درس دوم یاد گرفتین."}
  en.a2.unit39.lesson04.teach.q_send_the_contract: {title: "مصاحبه‌کننده گفتگو رو تموم می‌کنه", gloss: "مصاحبه‌کننده می‌گه: عالیه. قرارداد رو امروز براتون می‌فرستیم.", note: "*Wonderful* یه واکنش گرم و مثبته که توی انگلیسی کاری هم معمولیه."}

