review: {status: "reviewed", required_next_reviewer: null, notes: "New overlay against the shared English realization unit40 (post office), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1, every teaching card with a realization example: has a matching example_gloss:. Contrastive-grammar points, deliberately different from ones already used in this direction: (1) post office as a bare noun-noun compound with no linking word -- Persian needs the ezafe construction (ادارهٔ پست, literally 'office-of post') to join two nouns this way, so learners must drop the connector entirely in English rather than translate it; (2) how long will it take -- the future auxiliary will marking a prediction/expectation, where colloquial Persian usually just uses the present tense plus a time expression (چند وقت طول می‌کشه) with no separate future particle, so will here is flagged as NOT needing a one-to-one translated word; (3) express mail's adjective-before-noun order -- Persian's own equivalent پست پیشتاز puts the modifier (پیشتاز، 'express/priority') AFTER the noun it modifies, the reverse of English's express mail, so the note flags this as a word-order flip rather than a vocabulary gap. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, NOT translated Persian lefts, per the same compiler-driven precedent established in unit38/unit39 (prompt.pairs is sourced from the realization only). lesson03/lesson04 multiple_choice and listen_select distractor sets copied verbatim from the realization's own review notes documenting the exact invented, never-spoken-in-this-unit values already verified safe against the same-speaker-distractor check. Strong sibling-isolation rule applied -- nl-en/prs-en overlays for this unit were not consulted. Needs the mandatory fresh-context review before shipping.\n\nfa-en review 2026-10-19: Checked notes, glosses, Persian style, distractors, answers, canon and sequencing against the en realization. 12 fixes: package gloss no longer overlaps envelope (پاکت پستی), Persian article note made accurate, reading gloss tightened, mailbox match definition made distinct, 2 untaught distractors replaced (inside, special box), a distractor-format cue removed (her sister vs parents), instruction wording, missing answers added to speak/writing items.\n\nShared-en r2 review 2026-10-22: widened accepted answers of respond_own_mail and write_own_mail_sentence and translation alternatives (How much is it to send this?, ...to mail this?)."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit40.post: {title: "توی ادارهٔ پست"}

lessons:
  en.a1.unit40.lesson01.post_office_vocabulary: {title: "توی ادارهٔ پست"}
  en.a1.unit40.lesson02.sending_mail: {title: "فرستادن نامه و بسته"}
  en.a1.unit40.lesson03.dialogue_at_the_post_office: {title: "گفتگو: توی ادارهٔ پست"}
  en.a1.unit40.lesson04.three_trips_to_the_post_office: {title: "متن: سه رفت‌وآمد به ادارهٔ پست"}

teaching:
  en.a1.unit40.lesson01.teach.post_office: {title: "post office", gloss: "ادارهٔ پست", note: "*post office* یعنی ادارهٔ پست -- دو تا اسم پشت سر هم بدون هیچ کلمهٔ ربطی؛ فارسی برای این کار به «ادارهٔ» با کسرهٔ اضافه احتیاج داره، ولی انگلیسی نه.", example_gloss: "من برای فرستادن نامه به ادارهٔ پست می‌رم."}
  en.a1.unit40.lesson01.teach.letter: {title: "letter", gloss: "نامه", note: "*letter* یعنی نامه.", example_gloss: "من به دوستم نامه می‌نویسم."}
  en.a1.unit40.lesson01.teach.package: {title: "package", gloss: "بسته (پستی)", note: "*package* یعنی بسته -- چیزی که داخلش وسیله‌ست و می‌فرستین.", example_gloss: "من یه بسته برای خواهرم می‌فرستم."}
  en.a1.unit40.lesson01.teach.stamp: {title: "stamp", gloss: "تمبر", note: "*stamp* یعنی تمبر -- روی نامه یا بسته می‌چسبونین تا هزینهٔ فرستادنشو بدین.", example_gloss: "برای این نامه یه تمبر لازم دارم."}
  en.a1.unit40.lesson01.teach.envelope: {title: "envelope", gloss: "پاکت نامه", note: "*envelope* یعنی پاکت نامه.", example_gloss: "نامه رو توی یه پاکت می‌ذارم."}
  en.a1.unit40.lesson01.teach.mailbox: {title: "mailbox", gloss: "صندوق پستی", note: "*mailbox* یعنی صندوق پستی.", example_gloss: "صندوق پستی کنار ادارهٔ پسته."}

  en.a1.unit40.lesson02.teach.send_a_letter: {title: "send a letter", gloss: "نامه فرستادن", note: "*send a letter* یعنی نامه فرستادن.", example_gloss: "می‌خوام برای پدرومادرم نامه بفرستم."}
  en.a1.unit40.lesson02.teach.buy_a_stamp: {title: "buy a stamp", gloss: "تمبر خریدن", note: "*buy a stamp* یعنی تمبر خریدن.", example_gloss: "برای این کارت‌پستال باید یه تمبر بخرم."}
  en.a1.unit40.lesson02.teach.write_the_address: {title: "write the address", gloss: "آدرس نوشتن", note: "*write THE address* -- اینجا حرف تعریف *the* اجباریه چون منظور یه آدرس مشخصه (آدرس مقصد)، نه یه آدرس کلی؛ فارسی حرف تعریف معینی مثل *the* نداره، پس این نکته باید جداگونه حفظ بشه.", example_gloss: "لطفاً آدرس رو روی بسته بنویسین."}
  en.a1.unit40.lesson02.teach.how_long_will_it_take: {title: "how long will it take", gloss: "چقدر طول می‌کشه", note: "*will* اینجا برای پیش‌بینی زمان استفاده شده. فارسی محاوره‌ای معمولاً فقط با فعل حال ساده می‌پرسه («چقدر طول می‌کشه؟») بدون هیچ نشونهٔ جداگونهٔ آینده -- پس *will* رو کلمه‌به‌کلمه ترجمه نکنین.", example_gloss: "چقدر طول می‌کشه تا برسه؟"}
  en.a1.unit40.lesson02.teach.express_mail: {title: "express mail", gloss: "پست پیشتاز", note: "*express mail* -- صفت *express* قبل از اسم میاد؛ فارسی برعکسه، «پست پیشتاز» صفت *پیشتاز* بعد از اسم *پست* میاد.", example_gloss: "پست پیشتاز از پست عادی سریع‌تره."}
  en.a1.unit40.lesson02.teach.how_much_does_it_cost_question: {title: "How much does it cost to send this?", gloss: "فرستادن این چقدر هزینه داره؟", note: "*How much does it cost to...?* -- سؤال دربارهٔ قیمت یه کار."}

  en.a1.unit40.lesson03.teach.dialogue_line1: {title: "درخواست دنیل", gloss: "دنیل می‌گه می‌خواد این بسته رو بفرسته.", note: "*I'd like to* -- کوتاه‌شدهٔ *I would like to*، برای درخواست مؤدبانه."}
  en.a1.unit40.lesson03.teach.dialogue_line2: {title: "سؤال کارمند", gloss: "کارمند می‌پرسه بسته کجا می‌ره.", note: "*Where is it going?* -- سؤال با حال استمراری برای اشاره به مقصد یه چیز."}
  en.a1.unit40.lesson03.teach.dialogue_line3: {title: "جواب دنیل", gloss: "دنیل می‌گه به شیکاگو -- یه کادوی تولد برای خواهرشه.", note: "*a birthday gift for my sister* -- حرف اضافهٔ *for* برای مشخص کردن گیرنده."}
  en.a1.unit40.lesson03.teach.dialogue_line4: {title: "سؤال کارمند", gloss: "کارمند می‌پرسه پست عادی می‌خواد یا پیشتاز، و می‌گه پیشتاز حدود دو روز طول می‌کشه.", note: "*regular or express* -- دو تا گزینه با *or*."}
  en.a1.unit40.lesson03.teach.dialogue_line5: {title: "جواب دنیل", gloss: "دنیل می‌گه پیشتاز رو می‌خواد و می‌پرسه چقدر می‌شه.", note: "*I'll take...* -- *I'll* کوتاه‌شدهٔ *I will*، برای تصمیم لحظه‌ای."}
  en.a1.unit40.lesson03.teach.dialogue_line6: {title: "جواب کارمند", gloss: "کارمند می‌گه دوازده دلار می‌شه و رسیدشو می‌ده.", note: "*That's twelve dollars* -- *that's* برای اعلام قیمت."}
  en.a1.unit40.lesson03.teach.dialogue_line7: {title: "تشکر دنیل", gloss: "دنیل تشکر می‌کنه و روز خوبی براش آرزو می‌کنه.", note: "*Have a good day!* -- جملهٔ خداحافظی مؤدبانه."}

  en.a1.unit40.lesson04.teach.reading_passage: {title: "متن: سه رفت‌وآمد به ادارهٔ پست", gloss: "دنیل، لیلا و میا هر سه با ادارهٔ پست آشنان. هفتهٔ پیش، دنیل یه بستهٔ تولد برای خواهرش توی شیکاگو فرستاد. اون پول پست پیشتاز رو داد چون می‌خواست زود برسه، و فقط دو روز طول کشید. لیلا داره آماده می‌شه که بره نزدیک میا زندگی کنه، پس رفت ادارهٔ پست تا چندتا کتاب قدیمی برای پدرومادرش بفرسته. کارمند بسته رو وزن کرد و یه تمبر بهش داد. لیلا پرسید بسته چقدر طول می‌کشه، و کارمند گفت حدود یه هفته، چون پست عادی رو انتخاب کرده بود. میا زیاد بسته نمی‌فرسته، ولی همیشه برای نامه‌هایی که به مادربزرگش می‌نویسه یه تمبر می‌خره. اون می‌گه نامه با تمبر شخصی‌تر از یه پیامکه.", note: "دقت کنین *doesn't* برای سوم‌شخص مفرد منفی میاد: *Mia doesn't send packages very often* -- فعل کمکی *does* + *not*."}

exercises:
  en.a1.unit40.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "stamp"
    distractors: ["post office", "letter", "package", "envelope"]
    accepted_answers: [{value: "stamp", status: "correct"}]
    feedback: "*stamp* یعنی تمبر."
  en.a1.unit40.lesson01.exercise02.choose_envelope_meaning:
    instruction: "کدوم کلمه یعنی پاکت کاغذی‌ای که نامه رو قبل از فرستادن توش می‌ذارین؟"
    correct_option: "envelope"
    distractors: ["stamp", "package", "mailbox"]
    accepted_answers: [{value: "envelope", status: "correct"}]
    feedback: "*envelope* یعنی پاکت نامه."
  en.a1.unit40.lesson01.exercise03.match_post_words:
    instruction: "هر واژه یا عبارت انگلیسی رو به توضیح فارسی درستش وصل کنین."
    pairs:
      - {left: "post office", right: "جایی که نامه می‌فرستین و تمبر می‌خرین"}
      - {left: "letter", right: "پیام نوشته‌شده‌ای که برای کسی می‌فرستین"}
      - {left: "package", right: "چیزی بزرگ‌تر از نامه که می‌فرستین"}
      - {left: "stamp", right: "برچسب کوچیکی که برای هزینهٔ ارسال روی مرسوله می‌چسبونین"}
      - {left: "envelope", right: "چیزی که نامه رو داخلش می‌ذارین"}
      - {left: "mailbox", right: "صندوقی توی خیابون که نامه‌ها رو برای فرستادن توش می‌اندازین"}
    accepted_answers:
      - value:
          - {left: "post office", right: "جایی که نامه می‌فرستین و تمبر می‌خرین"}
          - {left: "letter", right: "پیام نوشته‌شده‌ای که برای کسی می‌فرستین"}
          - {left: "package", right: "چیزی بزرگ‌تر از نامه که می‌فرستین"}
          - {left: "stamp", right: "برچسب کوچیکی که برای هزینهٔ ارسال روی مرسوله می‌چسبونین"}
          - {left: "envelope", right: "چیزی که نامه رو داخلش می‌ذارین"}
          - {left: "mailbox", right: "صندوقی توی خیابون که نامه‌ها رو برای فرستادن توش می‌اندازین"}
        status: "correct"
    feedback: "post office=ادارهٔ پست، letter=نامه، package=بسته، stamp=تمبر، envelope=پاکت نامه، mailbox=صندوق پستی."
  en.a1.unit40.lesson01.exercise04.order_stamp_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "need", "a", "stamp", "for", "this", "letter."], status: "correct"}]
    feedback: "ترتیب درست: *I need a stamp for this letter.*"
  en.a1.unit40.lesson01.exercise05.write_envelope_word:
    instruction: "کلمه‌ای رو بنویسین که یعنی پاکت کاغذی‌ای که نامه رو توش می‌ذارین."
    accepted_answers: [{value: "envelope", status: "correct"}]
    feedback: "*envelope* یعنی پاکت نامه."

  en.a1.unit40.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "express mail"
    distractors: ["send a letter", "buy a stamp", "write the address", "how long will it take"]
    accepted_answers: [{value: "express mail", status: "correct"}]
    feedback: "*express mail* یعنی پست پیشتاز."
  en.a1.unit40.lesson02.exercise02.choose_how_long_meaning:
    instruction: "کدوم عبارت دربارهٔ مدت‌زمانی که یه چیز تا رسیدن لازم داره می‌پرسه؟"
    correct_option: "how long will it take"
    distractors: ["send a letter", "buy a stamp", "express mail"]
    accepted_answers: [{value: "how long will it take", status: "correct"}]
    feedback: "*how long will it take* یعنی چقدر طول می‌کشه."
  en.a1.unit40.lesson02.exercise03.choose_write_address_meaning:
    instruction: "کدوم عبارت یعنی نوشتن آدرس مقصد روی نامه یا بسته؟"
    correct_option: "write the address"
    distractors: ["send a letter", "buy a stamp", "express mail"]
    accepted_answers: [{value: "write the address", status: "correct"}]
    feedback: "*write the address* یعنی آدرس نوشتن."
  en.a1.unit40.lesson02.exercise04.order_how_long_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["How", "long", "will", "it", "take", "to", "arrive?"], status: "correct"}]
    feedback: "ترتیب درست: *How long will it take to arrive?*"
  en.a1.unit40.lesson02.exercise05.translate_how_much_does_it_cost:
    instruction: "ترجمه کنین: «فرستادن این چقدر هزینه داره؟»"
    accepted_answers: [{value: "How much does it cost to send this?", status: "correct"}, {value: "How much does it cost to send this", status: "correct"}, {value: "How much is it to send this?", status: "correct"}, {value: "How much is it to send this", status: "correct"}, {value: "How much does it cost to mail this?", status: "correct"}, {value: "How much does it cost to mail this", status: "correct"}]
    feedback: "*How much does it cost to send this?*"

  en.a1.unit40.lesson03.exercise01.comprehension_package_recipient:
    instruction: "طبق گفتگو، بستهٔ دنیل برای کیه؟"
    correct_option: "sister"
    distractors: ["mother", "friend", "coworker"]
    accepted_answers: [{value: "sister", status: "correct"}]
    feedback: "دنیل می‌گه بسته کادوی تولد خواهرشه."
  en.a1.unit40.lesson03.exercise02.comprehension_shipping_cost:
    instruction: "طبق گفتگو، دنیل چقدر برای فرستادن بسته پول می‌ده؟"
    correct_option: "twelve dollars"
    distractors: ["ten dollars", "fifteen dollars", "eight dollars"]
    accepted_answers: [{value: "twelve dollars", status: "correct"}]
    feedback: "کارمند می‌گه دوازده دلار می‌شه."
  en.a1.unit40.lesson03.exercise03.listen_dialogue_clerk_question:
    instruction: "طبق گفتگو، کارمند اول از دنیل چی می‌پرسه؟"
    correct_option: "where is it going"
    distractors: ["how much do you want to pay", "do you have a stamp already", "can you write the address"]
    accepted_answers: [{value: "where is it going", status: "correct"}]
    feedback: "کارمند اول می‌پرسه بسته کجا می‌ره."
  en.a1.unit40.lesson03.exercise04.respond_own_mail:
    instruction: "دربارهٔ فرستادن نامه یا بسته یه چیزی بگین، یا بپرسین چقدر هزینه داره یا چقدر طول می‌کشه."
    accepted_answers: ["I need to buy a stamp", "I need to buy a stamp.", "I want to send a letter", "I want to send a letter.", "I want to send a package", "I want to send a package.", "How long will it take?", "How much does it cost?", "How long will it take to arrive?", "How much does it cost to send this?", "I need a stamp for this letter.", "I'd like to send this package, please.", "I want to buy a stamp", "I want to buy a stamp.", "I need to send a package", "I need to send a package."]
    feedback: "می‌تونین از الگوی *I need to buy a stamp* یا *How long will it take?* استفاده کنین."

  en.a1.unit40.lesson04.exercise01.reading_daniel_shipping_choice:
    instruction: "طبق متن، دنیل پول چی رو داد تا بسته‌ش زود برسه؟"
    correct_option: "express mail"
    distractors: ["a bigger envelope", "a second stamp", "a big package"]
    accepted_answers: [{value: "express mail", status: "correct"}]
    feedback: "متن می‌گه دنیل پول پست پیشتاز رو داد."
  en.a1.unit40.lesson04.exercise02.reading_leila_book_recipient:
    instruction: "طبق متن، لیلا کتاب‌های قدیمی رو برای کی فرستاد؟"
    correct_option: "parents"
    distractors: ["sister", "friend", "neighbor"]
    accepted_answers: [{value: "parents", status: "correct"}]
    feedback: "متن می‌گه لیلا کتاب‌ها رو برای پدرومادرش فرستاد."
  en.a1.unit40.lesson04.exercise03.reading_mia_stamp_habit:
    instruction: "طبق متن، میا همیشه برای نامه‌هایی که به مادربزرگش می‌نویسه چی می‌خره؟"
    correct_option: "stamp"
    distractors: ["envelope", "package", "postcard"]
    accepted_answers: [{value: "stamp", status: "correct"}]
    feedback: "متن می‌گه میا همیشه یه تمبر می‌خره."
  en.a1.unit40.lesson04.exercise04.write_own_mail_sentence:
    instruction: "یه جمله دربارهٔ فرستادن نامه یا بسته بنویسین، با «I send/sent a ...» یا «I need a stamp for ...»."
    accepted_answers: ["I send a package", "I send a package.", "I sent a package", "I sent a package.", "I send a letter", "I send a letter.", "I sent a letter", "I sent a letter.", "I send a letter to my friend.", "I sent a package to my sister.", "I need a stamp for this package.", "I need a stamp for this letter", "I need a stamp for this letter.", "I need a stamp for this postcard", "I need a stamp for this postcard.", "I need a stamp for this package"]
    feedback: "می‌تونین از الگوی *I send/sent a ...* یا *I need a stamp for ...* استفاده کنین."
