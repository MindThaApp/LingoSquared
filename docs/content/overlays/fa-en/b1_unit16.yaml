teaching:
  en.b1.unit16.lesson01.teach.advice: {title: "advice", gloss: "نصیحت، توصیه", note: "advice یعنی نظری که دربارهٔ کاری که باید انجام بدین به شما داده می‌شه.", example_gloss: "لیلا یه نصیحت مفید به دنیل داد."}
  en.b1.unit16.lesson01.teach.suggest: {title: "suggest", gloss: "پیشنهاد دادن", note: "suggest یعنی یه ایده رو برای فکر کردن به کسی پیشنهاد بدین.", example_gloss: "لیلا یه راه برای مدیریت حجم کاری‌اش پیشنهاد داد."}
  en.b1.unit16.lesson01.teach.overwhelmed: {title: "overwhelmed", gloss: "غرق کار، تحت فشار", note: "overwhelmed یعنی احساس این که بیشتر از چیزی که می‌تونین از پسش بربیاین کار دارین.", example_gloss: "دنیل با دو تا پروژه غرق کار شده بود."}
  en.b1.unit16.lesson01.teach.prioritize: {title: "prioritize", gloss: "در اولویت قرار دادن", note: "prioritize یعنی اول به مهم‌ترین کار رسیدگی کنین.", example_gloss: "دنیل تصمیم گرفت پروژه‌ای با مهلت نزدیک‌تر رو در اولویت بذاره."}
  en.b1.unit16.lesson01.teach.workload: {title: "workload", gloss: "حجم کاری", note: "workload یعنی مجموع کاری که یه نفر باید انجام بده.", example_gloss: "حجم کاری دنیل بعد از پیوستنش به تیم توی مارس زیاد شد."}
  en.b1.unit16.lesson01.teach.decline: {title: "decline", gloss: "مؤدبانه رد کردن", note: "decline یعنی یه پیشنهاد یا نصیحت رو مؤدبانه رد کنین.", example_gloss: "دنیل می‌تونست نصیحت رو قبول کنه یا مؤدبانه ردش کنه."}

  en.b1.unit16.lesson02.teach.if_i_were_you: {title: "If I were you, I would talk to your manager.", gloss: "اگه جای تو بودم، با مدیرت صحبت می‌کردم.", note: "*If I were you, I would* یه نصیحت با فرم شرطی غیرواقعیه."}
  en.b1.unit16.lesson02.teach.you_should_prioritize: {title: "You should prioritize the project with the closer deadline.", gloss: "باید پروژه‌ای که مهلت نزدیک‌تری داره رو در اولویت بذاری.", note: "*You should* یه پیشنهاد مستقیم و مستقیم‌تره."}
  en.b1.unit16.lesson02.teach.how_about: {title: "How about asking a colleague to help?", gloss: "نظرت چیه از یه همکار بخوای کمک کنه؟", note: "*How about* + فعل با ing یه پیشنهاد نرم‌تره."}
  en.b1.unit16.lesson02.teach.grammar_advice_forms: {title: "فرم‌های نصیحت و پیشنهاد", gloss: "نصیحت و پیشنهاد چند فرم دارن: If I were you, I would... (فرض غیرواقعی)، You should... (توصیهٔ مستقیم)، و How about + ing...؟ (پیشنهاد نرم‌تر). بسته به این که چقدر مطمئن می‌خواین به نظر برسین، از فرم قوی‌تر یا نرم‌تر استفاده کنین.", note: "این سه فرم رو بسته به موقعیت انتخاب کنین."}

  en.b1.unit16.lesson03.teach.deadline: {title: "deadline", gloss: "مهلت", note: "deadline یعنی تاریخی که باید کاری تا اون موقع تموم بشه.", example_gloss: "مهلت نزدیک‌تر دنیل جمعهٔ آینده‌ست."}
  en.b1.unit16.lesson03.teach.that_makes_sense: {title: "That makes sense. I'll try it.", gloss: "منطقیه. امتحانش می‌کنم.", note: "*That makes sense* یعنی قبول کردن یه نصیحت به‌عنوان منطقی.", example_gloss: "منطقیه. این هفته امتحانش می‌کنم."}
  en.b1.unit16.lesson03.teach.reading_passage: {title: "متن: نصیحت دربارهٔ حجم زیاد کار", gloss: "سلام لیلا، این هفته احساس می‌کنم غرق کارم. دو تا پروژه رو رهبری می‌کنم، و کلاس عصرم هم روی این اضافه شده. نصیحتی داری؟ سلام دنیل، اگه جای تو بودم، با مدیرت دربارهٔ حجم کاری صحبت می‌کردم. باید پروژه‌ای با مهلت نزدیک‌تر رو هم در اولویت بذاری. نظرت چیه از میا بخوای توی اون یکی کمک کنه؟ ممنون، منطقیه. امتحانش می‌کنم و بهت می‌گم چی شد.", note: "این متن سه فرم نصیحت رو با If I were you، You should و How about نشون می‌ده."}

  en.b1.unit16.lesson04.teach.q_overwhelmed_two_projects: {title: "حرف دنیل", gloss: "دنیل می‌گه یه‌کم غرق کارم. دو تا پروژه رو رهبری می‌کنم، و هنوز هفته‌ای سه بار کلاس عصر هم دارم.", note: "*I'm a little overwhelmed* شروع توضیح مشکله."}
  en.b1.unit16.lesson04.teach.a_talk_to_manager: {title: "جواب لیلا", gloss: "لیلا می‌گه اگه جای تو بودم، با مدیرت دربارهٔ حجم کاری صحبت می‌کردم.", note: "*If I were you, I would* یه نصیحت با فرم شرطی غیرواقعیه."}
  en.b1.unit16.lesson04.teach.q_dont_want_to_seem: {title: "حرف دنیل", gloss: "دنیل می‌گه ایدهٔ خوبیه، ولی نمی‌خوام به نظر برسه که از پسش برنمیام.", note: "*don't want to seem like* یه نگرانی رو نشون می‌ده."}
  en.b1.unit16.lesson04.teach.a_prioritize_and_how_about: {title: "جواب لیلا", gloss: "لیلا می‌گه باید اول پروژه‌ای با مهلت نزدیک‌تر رو در اولویت بذاری. نظرت چیه از یه همکار بخوای توی اون یکی کمک کنه؟", note: "این جمله یه توصیهٔ مستقیم و یه پیشنهاد نرم رو با هم میاره."}
  en.b1.unit16.lesson04.teach.q_ask_mia_this_week: {title: "حرف دنیل", gloss: "دنیل می‌گه این رو دوست دارم. از میا می‌پرسم این هفته وقت داره یا نه.", note: "*I'll ask Mia if she has time* یه تصمیم رو نشون می‌ده."}
  en.b1.unit16.lesson04.teach.a_sounds_like_solid_plan: {title: "جمع‌بندی لیلا", gloss: "لیلا می‌گه به نظر یه برنامهٔ محکمه.", note: "*That sounds like a solid plan* یه تأیید نهاییه."}

