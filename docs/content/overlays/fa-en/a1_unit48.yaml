review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit48 (library), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1, every teaching card with a realization example: has a matching example_gloss:. Contrastive-grammar points, deliberately different from ones already used in this direction: (1) due as a predicate adjective applied to the borrowed OBJECT itself (this book is due Friday / Your book is due on Friday) -- English makes the physical item the grammatical subject of 'being due,' while Persian keeps the deadline itself as the subject (موعد تحویلش جمعه‌ست, literally 'its return-date is Friday'), so the note flags that there is no single Persian adjective matching due here -- the whole clause needs restructuring around a different subject; (2) borrow (take something FROM someone, temporarily) as a SEPARATE verb root from the false-friend risk lend (give something TO someone) -- Persian expresses the same conceptual distinction with one shared root, امانت, plus a flipped light verb (امانت گرفتن 'take on loan' vs امانت دادن 'give on loan'), so Farsi speakers already have the underlying concept but must remap it onto two unrelated English verbs rather than one root with a swapped helper; (3) the bare service imperative Just fill out this form, spoken by the librarian with no explicit please -- a pragmatics/register note, not a grammar rule: casual English service exchanges often carry politeness through tone and context alone once rapport is already established in the conversation, whereas a literal Persian translation without لطفاً can land as blunter than the English original actually sounds, so learners are flagged not to read impoliteness into the missing please. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, NOT translated Persian lefts, per the established compiler-driven precedent. lesson03/lesson04 multiple_choice distractor sets for the reading/comprehension items were invented fresh (the realization's own notes confirm lesson03.exercise03's tested value has no plausible same-speaker-callback distractor to avoid, since no other duration is spoken anywhere in the dialogue -- distractors here are invented duration values consistent with that). Strong sibling-isolation rule applied -- nl-en/prs-en overlays for this unit were not consulted. Needs the mandatory fresh-context review before shipping."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit48.library: {title: "رفتن به کتابخونه"}

lessons:
  en.a1.unit48.lesson01.library_vocabulary: {title: "کلمات کتابخونه"}
  en.a1.unit48.lesson02.borrowing_a_book: {title: "امانت گرفتن کتاب"}
  en.a1.unit48.lesson03.dialogue_at_the_library: {title: "گفتگو: توی کتابخونه"}
  en.a1.unit48.lesson04.how_libraries_work: {title: "متن: کتابخونه‌ها چطور کار می‌کنن"}

teaching:
  en.a1.unit48.lesson01.teach.library: {title: "library", gloss: "کتابخونه", note: "*library* یعنی کتابخونه.", example_gloss: "من هر هفته می‌رم کتابخونه."}
  en.a1.unit48.lesson01.teach.borrow: {title: "borrow", gloss: "امانت گرفتن", note: "*borrow* یعنی امانت گرفتن -- چیزی رو موقتاً از کسی می‌گیرین. با *lend* (امانت دادن) قاطی نشه؛ فارسی هر دو رو با ریشهٔ «امانت» می‌سازه، ولی انگلیسی دو تا فعل کاملاً جدا داره.", example_gloss: "می‌خوام این کتابو امانت بگیرم."}
  en.a1.unit48.lesson01.teach.return: {title: "return", gloss: "پس دادن / برگردوندن", note: "*return* یعنی پس دادن یه چیز امانتی.", example_gloss: "می‌تونم این کتابو پس بدم؟"}
  en.a1.unit48.lesson01.teach.due: {title: "due", gloss: "موعد تحویل", note: "*due* یه صفته که برای خود وسیله به‌کار می‌ره (*this book is due*)؛ فارسی به‌جاش موعد تحویل رو فاعل جمله می‌کنه («موعد تحویلش جمعه‌ست»)، نه خود کتاب رو.", example_gloss: "موعد تحویلش کیه؟"}
  en.a1.unit48.lesson01.teach.card: {title: "library card", gloss: "کارت کتابخونه", note: "*library card* یعنی کارت کتابخونه -- کارتی که برای امانت گرفتن کتاب لازمه.", example_gloss: "این کارت کتابخونهٔ منه."}

  en.a1.unit48.lesson02.teach.do_you_have_a_library_card: {title: "Do you have a library card?", gloss: "کارت کتابخونه داری؟", note: "*Do you have...?* -- سؤال معمول با فعل *have*."}
  en.a1.unit48.lesson02.teach.yes_heres_my_library_card: {title: "Yes, here's my library card.", gloss: "آره، بفرما کارت کتابخونه‌م.", note: "*here's* یعنی «بفرما»، وقتی چیزی رو به کسی نشون می‌دین یا می‌دین."}
  en.a1.unit48.lesson02.teach.id_like_to_borrow_this_book: {title: "I'd like to borrow this book.", gloss: "می‌خوام این کتابو امانت بگیرم.", note: "*I'd like to borrow...* -- الگوی مؤدبانه برای درخواست امانت گرفتن."}
  en.a1.unit48.lesson02.teach.when_is_this_book_due: {title: "When is this book due?", gloss: "موعد تحویل این کتاب کیه؟", note: "*When is this book due?* -- صفت *due* که تازه یاد گرفتیم، این‌بار توی یه سؤال."}
  en.a1.unit48.lesson02.teach.can_i_return_this_book: {title: "Can I return this book?", gloss: "می‌تونم این کتابو پس بدم؟", note: "*Can I...?* -- درخواست مؤدبانهٔ اجازه."}
  en.a1.unit48.lesson02.teach.your_book_is_due_on_friday: {title: "Your book is due on Friday.", gloss: "موعد تحویل کتابت جمعه‌ست.", note: "*Your book is due ON Friday* -- خود کتاب فاعل جمله‌ست، برخلاف فارسی که موعد تحویل فاعله."}

  en.a1.unit48.lesson03.teach.dialogue_line1: {title: "درخواست لیلا", gloss: "لیلا می‌گه باید این کتابو توی کتابخونه پس بده -- می‌پرسه دنیل می‌خواد باهاش بیاد؟", note: "*Do you want to come with me?* -- سؤال دعوت."}
  en.a1.unit48.lesson03.teach.dialogue_line2: {title: "جواب دنیل", gloss: "دنیل می‌گه حتماً! فکر نمی‌کنه تا حالا کتابی از کتابخونه امانت گرفته باشه.", note: "*I don't think I've ever borrowed...* -- حال کامل برای تجربهٔ زندگی تا الان."}
  en.a1.unit48.lesson03.teach.dialogue_line3: {title: "درخواست لیلا", gloss: "لیلا می‌گه سلام، می‌خوام این کتابو پس بدم، و یه کتاب جدید هم امانت بگیرم.", note: "*and I'd like to borrow a new one too* -- *too* آخر جمله یعنی «هم»."}
  en.a1.unit48.lesson03.teach.dialogue_line4: {title: "سؤال کتابدار", gloss: "کتابدار می‌گه عالیه، ممنون. کارت کتابخونه داری؟", note: "*Do you have your library card?* -- سؤال با ضمیر ملکی *your*."}
  en.a1.unit48.lesson03.teach.dialogue_line5: {title: "جواب لیلا", gloss: "لیلا می‌گه آره، بفرما.", note: "*Yes, here it is* -- جواب کوتاه با نشون دادن چیزی."}
  en.a1.unit48.lesson03.teach.dialogue_line6: {title: "جواب کتابدار", gloss: "کتابدار می‌گه عالیه. موعد تحویل این کتاب جدید سه هفتهٔ دیگه‌ست.", note: "*due back in three weeks* -- *in* + مدت‌زمان برای گفتن چقدر دیگه مونده."}
  en.a1.unit48.lesson03.teach.dialogue_line7: {title: "درخواست دنیل", gloss: "دنیل می‌پرسه اونم می‌تونه یه کارت کتابخونه بگیره؟ می‌خواد یه کتاب آشپزی امانت بگیره.", note: "*Can I get a library card too?* -- درخواست با *too*."}
  en.a1.unit48.lesson03.teach.dialogue_line8: {title: "جواب کتابدار", gloss: "کتابدار می‌گه البته! فقط این فرمو پر کن.", note: "*Just fill out this form* -- فعل امری بدون *please* که توی این لحن دوستانه بی‌ادبی حساب نمی‌شه؛ فارسی معمولاً «لطفاً» اضافه می‌کنه، پس این جمله رو خیلی خشک ترجمه نکنین."}

  en.a1.unit48.lesson04.teach.reading_passage: {title: "متن: کتابخونه‌ها چطور کار می‌کنن", gloss: "رفتن به کتابخونه: بیشتر کتابخونه‌ها می‌ذارن کتاب، و گاهی وسایل دیگه رو هم، برای چند هفته امانت بگیرین. برای امانت گرفتن معمولاً یه کارت کتابخونه لازم دارین. وقتی کتابی امانت می‌گیرین، کتابدار موعد تحویلشو بهتون می‌گه -- روزی که باید پسش بدین. اگه تا اون‌موقع تموم نکرده باشین، معمولاً می‌تونین از کتابدار بخواین وقت بیشتری بده. از وقتی لیلا به آپارتمان جدیدش نقل‌مکان کرد، دیگه به‌اندازهٔ قبل کتاب نداره، برای همین شروع کرد از کتابخونه امانت بگیره. هفتهٔ پیش، یه کتاب پس داد و یکی جدید گرفت، و دوستش دنیل هم باهاش اومد. اون تا حالا کتابی از کتابخونه امانت نگرفته بود، برای همین خودش یه کارت کتابخونه گرفت و یه کتاب آشپزی امانت گرفت تا با دستورایی که میا بهش یاد می‌ده تمرین کنه. کتابدار به هر دوشون یادآوری کرد قبل از موعد تحویل کتاباشونو برگردونن. میا زیاد به کتابخونه نمی‌ره، ولی یه بار برای کلاسش یه کتاب عکاسی امانت گرفته بود.", note: "دقت کنین *to help him practice* از مصدر با *to* برای بیان هدف استفاده می‌کنه -- یعنی «برای اینکه کمکش کنه تمرین کنه»."}

exercises:
  en.a1.unit48.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "borrow"
    distractors: ["library", "return", "due", "card"]
    accepted_answers: [{value: "borrow", status: "correct"}]
    feedback: "*borrow* یعنی امانت گرفتن."
  en.a1.unit48.lesson01.exercise02.choose_return_meaning:
    instruction: "کدوم کلمه یعنی چیزی رو پس دادن؟"
    correct_option: "return"
    distractors: ["borrow", "due", "card"]
    accepted_answers: [{value: "return", status: "correct"}]
    feedback: "*return* یعنی پس دادن."
  en.a1.unit48.lesson01.exercise03.match_library_words:
    instruction: "هر واژه یا عبارت انگلیسی رو به توضیح فارسی درستش وصل کنین."
    pairs:
      - {left: "library", right: "جایی که می‌تونین ازش کتاب امانت بگیرین"}
      - {left: "borrow", right: "چیزی رو گرفتن و بعداً پس آوردن"}
      - {left: "return", right: "چیزی رو پس دادن"}
      - {left: "due", right: "روزی که باید چیزی رو پس بدین"}
      - {left: "card", right: "کارتی که باهاش می‌تونین از کتابخونه چیزی امانت بگیرین"}
    accepted_answers:
      - value:
          - {left: "library", right: "جایی که می‌تونین ازش کتاب امانت بگیرین"}
          - {left: "borrow", right: "چیزی رو گرفتن و بعداً پس آوردن"}
          - {left: "return", right: "چیزی رو پس دادن"}
          - {left: "due", right: "روزی که باید چیزی رو پس بدین"}
          - {left: "card", right: "کارتی که باهاش می‌تونین از کتابخونه چیزی امانت بگیرین"}
        status: "correct"
    feedback: "library=کتابخونه، borrow=امانت گرفتن، return=پس دادن، due=موعد تحویل، card=کارت کتابخونه."
  en.a1.unit48.lesson01.exercise04.order_borrow_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["I'd", "like", "to", "borrow", "this", "book."], status: "correct"}]
    feedback: "ترتیب درست: *I'd like to borrow this book.*"
  en.a1.unit48.lesson01.exercise05.write_return_word:
    instruction: "کلمه‌ای رو بنویسین که یعنی چیزی رو پس دادن."
    accepted_answers: [{value: "return", status: "correct"}]
    feedback: "*return* یعنی پس دادن."

  en.a1.unit48.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "Do you have a library card?"
    distractors: ["Yes, here's my library card.", "I'd like to borrow this book.", "When is this book due?", "Can I return this book?"]
    accepted_answers: [{value: "Do you have a library card?", status: "correct"}]
    feedback: "*Do you have a library card?* یعنی کارت کتابخونه داری؟"
  en.a1.unit48.lesson02.exercise02.choose_borrow_meaning:
    instruction: "کدوم عبارتو برای درخواست بردن کتاب به خونه می‌گین؟"
    correct_option: "I'd like to borrow this book."
    distractors: ["Do you have a library card?", "When is this book due?", "Can I return this book?"]
    accepted_answers: [{value: "I'd like to borrow this book.", status: "correct"}]
    feedback: "*I'd like to borrow this book.* یعنی می‌خوام این کتابو امانت بگیرم."
  en.a1.unit48.lesson02.exercise03.choose_due_friday_meaning:
    instruction: "کدوم عبارت بهتون می‌گه کِی باید کتابتونو پس بدین؟"
    correct_option: "Your book is due on Friday."
    distractors: ["Do you have a library card?", "I'd like to borrow this book.", "Can I return this book?"]
    accepted_answers: [{value: "Your book is due on Friday.", status: "correct"}]
    feedback: "*Your book is due on Friday.* یعنی موعد تحویل کتابت جمعه‌ست."
  en.a1.unit48.lesson02.exercise04.order_return_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["Can", "I", "return", "this", "book?"], status: "correct"}]
    feedback: "ترتیب درست: *Can I return this book?*"
  en.a1.unit48.lesson02.exercise05.translate_when_due:
    instruction: "ترجمه کنین: «موعد تحویل این کتاب کیه؟»"
    accepted_answers: [{value: "When is this book due?", status: "correct"}, {value: "When is this book due", status: "correct"}, {value: "When is this book due back?", status: "correct"}, {value: "When is this book due back", status: "correct"}]
    feedback: "*When is this book due?*"

  en.a1.unit48.lesson03.exercise01.comprehension_why_leila_goes:
    instruction: "طبق گفتگو، چرا لیلا به کتابخونه می‌ره؟"
    correct_option: "to return a book"
    distractors: ["to study", "to meet a friend", "to use the computer"]
    accepted_answers: [{value: "to return a book", status: "correct"}]
    feedback: "لیلا می‌گه باید کتابو پس بده."
  en.a1.unit48.lesson03.exercise02.comprehension_what_daniel_wants:
    instruction: "طبق گفتگو، دنیل می‌خواد چی امانت بگیره؟"
    correct_option: "a cookbook"
    distractors: ["a novel", "a magazine", "a photography book"]
    accepted_answers: [{value: "a cookbook", status: "correct"}]
    feedback: "دنیل می‌خواد یه کتاب آشپزی امانت بگیره."
  en.a1.unit48.lesson03.exercise03.listen_dialogue_due_time:
    instruction: "طبق گفتگو، موعد تحویل کتاب جدید لیلا کیه؟"
    correct_option: "in three weeks"
    distractors: ["in one week", "in two days", "next month"]
    accepted_answers: [{value: "in three weeks", status: "correct"}]
    feedback: "کتابدار می‌گه سه هفتهٔ دیگه‌ست."
  en.a1.unit48.lesson03.exercise04.respond_own_library_request:
    instruction: "بگین می‌خواین کتاب امانت بگیرین، یا بپرسین کارت کتابخونه لازم دارین یا نه."
    accepted_answers: ["I'd like to borrow this book", "I'd like to borrow this book.", "I'd like to borrow a book", "I'd like to borrow a book.", "Do you have a library card?", "Do I need a library card?", "Do I need a library card", "I would like to borrow this book.", "I would like to borrow a book."]
    feedback: "می‌تونین از الگوی *I'd like to borrow ...* یا *Do you have a library card?* استفاده کنین."

  en.a1.unit48.lesson04.exercise01.reading_why_leila_borrows:
    instruction: "طبق متن، چرا لیلا الان از کتابخونه کتاب امانت می‌گیره؟"
    correct_option: "she doesn't own as many books as she used to"
    distractors: ["her books are too heavy to move", "she wants to save money", "her old books were lost"]
    accepted_answers: [{value: "she doesn't own as many books as she used to", status: "correct"}]
    feedback: "متن می‌گه دیگه به‌اندازهٔ قبل کتاب نداره."
  en.a1.unit48.lesson04.exercise02.reading_what_daniel_checked_out:
    instruction: "طبق متن، دنیل چی امانت گرفت؟"
    correct_option: "a cookbook"
    distractors: ["a novel", "a photography book", "a dictionary"]
    accepted_answers: [{value: "a cookbook", status: "correct"}]
    feedback: "متن می‌گه دنیل یه کتاب آشپزی امانت گرفت."
  en.a1.unit48.lesson04.exercise03.reading_what_to_do_if_late:
    instruction: "طبق متن، اگه تا موعد تحویل کتابتونو تموم نکرده باشین چیکار باید بکنین؟"
    correct_option: "ask the librarian for more time"
    distractors: ["pay a fine right away", "keep the book anyway", "buy a new copy"]
    accepted_answers: [{value: "ask the librarian for more time", status: "correct"}]
    feedback: "متن می‌گه می‌تونین از کتابدار وقت بیشتر بخواین."
  en.a1.unit48.lesson04.exercise04.write_own_library_message:
    instruction: "یه پیام کوتاه بنویسین: بگین می‌خواین کتاب امانت بگیرین و بپرسین کارت کتابخونه لازم دارین یا نه."
    accepted_answers: ["I'd like to borrow this book. Do I need a library card?", "I'd like to borrow this book. Do I need a library card.", "I'd like to borrow this book, do I need a library card?", "I'd like to borrow a book. Do I need a library card?", "I'd like to borrow a book. Do I need a library card.", "I would like to borrow this book. Do I need a library card?", "I would like to borrow a book. Do I need a library card?"]
    feedback: "می‌تونین از الگوی *I'd like to borrow this book. Do I need a library card?* استفاده کنین."
