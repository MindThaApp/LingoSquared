teaching:
  en.a2.unit38.lesson01.teach.reschedule: {title: "reschedule", gloss: "جابه‌جا کردن وقت", note: "*reschedule* یعنی یه قرار رو به زمان دیگه‌ای منتقل کردن.", example_gloss: "باید وقت تعمیر رو جابه‌جا کنم، چون سر کارم."}
  en.a2.unit38.lesson01.teach.neighbor: {title: "neighbor", gloss: "همسایه", note: "*neighbor* یعنی کسی که کنار شما زندگی می‌کنه؛ کلمهٔ انگلیسی زن و مرد رو از هم جدا نمی‌کنه.", example_gloss: "همسایه‌ام می‌تونه در رو برای لوله‌کش باز کنه."}
  en.a2.unit38.lesson01.teach.key: {title: "key", gloss: "کلید", note: "*key* یعنی همون چیز کوچیک فلزی که در خونه رو باهاش باز می‌کنین.", example_gloss: "کلید رو پیش همسایه‌ام می‌ذارم."}
  en.a2.unit38.lesson01.teach.leak: {title: "leak", gloss: "نشتی", note: "*leak* اینجا اسمه: خودِ نشتی. فعلش *to leak* یعنی چکه کردن.", example_gloss: "نشتی زیر سینک آشپزخونه‌ام داره بدتر می‌شه."}
  en.a2.unit38.lesson01.teach.fixed: {title: "fixed", gloss: "درست شده", note: "*fixed* اسم مفعول *to fix* است: دیگه خراب نیست.", example_gloss: "سینک الان درست شده و آب بند اومده."}
  en.a2.unit38.lesson01.teach.afternoon: {title: "afternoon", gloss: "بعدازظهر", note: "*afternoon* یعنی بخش بعد از ساعت دوازدهِ روز؛ *morning* یعنی صبح.", example_gloss: "لوله‌کش بعدازظهر اومد، نه صبح."}
  en.a2.unit38.lesson01.teach.grammar_cant_wont: {title: "can't و won't برای گفتن اینکه نمی‌شه", gloss: "بین ساعت ۲ تا ۴ بعدازظهر نمی‌تونم خونه باشم. بعدازظهر خونه نخواهم بود.", note: "*can't* می‌گه که کاری ممکن نیست؛ *won't* می‌گه که اون کار اتفاق نمی‌افته."}

  en.a2.unit38.lesson02.teach.need_to_reschedule: {title: "گفتن اینکه می‌خواین وقت رو جابه‌جا کنین", gloss: "باید وقت تعمیر رو جابه‌جا کنم.", note: "*I need to...* بی‌طرف و اداریه: لازمه، ولی بی‌ادبانه به نظر نمی‌رسه."}
  en.a2.unit38.lesson02.teach.possible_in_the_morning: {title: "خواستن یه زمان دیگه", gloss: "امکانش هست به جاش صبح بیاد؟", note: "*Would it be possible to...?* محتاطانه‌ترین شکل درخواسته؛ *instead* یعنی به جاش."}
  en.a2.unit38.lesson02.teach.leave_key_with_neighbor: {title: "گفتن اینکه کلید کجاست", gloss: "کلید رو پیش همسایه‌ام می‌ذارم.", note: "*leave something with someone* یعنی چیزی رو پیش کسی گذاشتن."}
  en.a2.unit38.lesson02.teach.is_the_leak_fixed: {title: "پرسیدن اینکه مشکل حل شده یا نه", gloss: "نشتی الان درست شده؟", note: "*Is ... fixed?* دربارهٔ نتیجه می‌پرسه، نه دربارهٔ خودِ کار."}
  en.a2.unit38.lesson02.teach.grammar_because_reason: {title: "دادن دلیل با because", gloss: "بین ساعت ۲ تا ۴ بعدازظهر نمی‌تونم خونه باشم، چون سر کارم.", note: "*because* مشکل رو به دلیلش وصل می‌کنه؛ توی انگلیسی ترتیب کلمات بعدش تغییر نمی‌کنه."}

  en.a2.unit38.lesson03.teach.message: {title: "message", gloss: "پیام", note: "*message* یعنی هر پیام نوشتاری کوتاه: پیامک، پیام واتساپ یا ایمیل کوتاه.", example_gloss: "یه پیام دربارهٔ زمان جدید تعمیر گرفتم."}
  en.a2.unit38.lesson03.teach.rescheduling_text: {title: "متن پیام زمان جدید", gloss: "تعمیر ۶۱۸۰ جابه‌جا شد. لوله‌کش فردا بین ساعت ۹ تا ۱۱ صبح می‌آد. همسایهٔ شما در رو باز می‌کنه. لطفاً این زمان جدید رو امروز با پیام تأیید کنید.", note: "پیام مدیر ساختمان کوتاه و اداریه: چی عوض شده، کِی، و شما هنوز چیکار باید بکنین."}
  en.a2.unit38.lesson03.teach.confirm_by_message: {title: "درخواست تأیید", gloss: "لطفاً این زمان جدید رو امروز با پیام تأیید کنید.", note: "*confirm* یعنی تأیید کردن؛ *by message* یعنی با پیام."}

  en.a2.unit38.lesson04.teach.q_need_to_reschedule: {title: "دنیل به مدیر زنگ می‌زنه", gloss: "دنیل می‌گه: سلام، باید وقت تعمیر رو جابه‌جا کنم.", note: "پشت تلفن اول سلام می‌کنین و بعد بلافاصله دلیل تماستون رو می‌گین."}
  en.a2.unit38.lesson04.teach.a_which_repair: {title: "مدیر می‌پرسه کدوم تعمیر", gloss: "مدیر می‌گه: مشکلی نیست. کدوم تعمیره؟", note: "*Which repair is it?* از بین چند مورد معلوم، یکی رو می‌پرسه."}
  en.a2.unit38.lesson04.teach.q_repair_6180: {title: "دنیل شمارهٔ تعمیر رو می‌گه", gloss: "دنیل می‌گه: تعمیر ۶۱۸۰، نشتی زیر سینک آشپزخونه‌ام.", note: "همون شمارهٔ تعمیری که در واحد ۲۹ گرفته بود -- همون سینک چکه‌کننده."}
  en.a2.unit38.lesson04.teach.a_why_cant_you_be_home: {title: "مدیر دلیل رو می‌پرسه", gloss: "مدیر می‌گه: متوجه شدم. چرا نمی‌تونید خونه باشید؟", note: "*Why can't you...?* دلیل انجام نشدن کاری رو می‌پرسه."}
  en.a2.unit38.lesson04.teach.q_at_work_ask_morning: {title: "دنیل دلیل می‌ده و صبح رو می‌خواد", gloss: "دنیل می‌گه: بین ساعت ۲ تا ۴ بعدازظهر نمی‌تونم خونه باشم، چون سر کارم. امکانش هست به جاش صبح بیاد؟", note: "اول دلیل، بعد درخواست -- این مؤدبانه‌تر از درخواست مستقیمه."}
  en.a2.unit38.lesson04.teach.a_plumber_can_come_morning: {title: "مدیر یه زمان جدید پیشنهاد می‌ده", gloss: "مدیر می‌گه: بله، لوله‌کش می‌تونه بین ساعت ۹ تا ۱۱ صبح بیاد.", note: "*between 9am and 11am* بازهٔ زمانی جدیده."}
  en.a2.unit38.lesson04.teach.q_leave_key: {title: "دنیل کلید رو ترتیب می‌ده", gloss: "دنیل می‌گه: ممنون. کلید رو پیش همسایه‌ام می‌ذارم.", note: "همون جمله‌ای که در درس دوم یاد گرفتین."}
  en.a2.unit38.lesson04.teach.a_please_confirm: {title: "مدیر تأیید می‌خواد", gloss: "مدیر می‌گه: خوبه. لطفاً این زمان جدید رو امروز با پیام تأیید کنید.", note: "همون دستوری که توی پیام درس سوم بود."}
  en.a2.unit38.lesson04.teach.q_will_confirm_this_afternoon: {title: "دنیل می‌گه کی تأیید می‌کنه", gloss: "دنیل می‌گه: امروز بعدازظهر تأییدش می‌کنم.", note: "*this afternoon* یعنی امروز بعدازظهر."}

