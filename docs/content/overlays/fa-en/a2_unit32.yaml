  en.a2.unit32.lesson04.teach.q_what_use_it_for: {title: "پرسش دنیل دربارهٔ کاربرد", gloss: "دنیل می‌پرسه ازش برای چی استفاده می‌کنی؟", note: "این سوال یک عادت مشخص می‌خواد."}
