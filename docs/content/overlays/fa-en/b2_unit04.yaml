course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح پیشرفته‌تر (B2) برای فارسی‌زبان‌ها، با تمرکز روی روایت زمان، لحن، ایده‌های انتزاعی، مذاکره و ترکیب منابع."

units:
  en.b2.unit04.narrative_time: {title: "تا من رسیدم"}

lessons:
  en.b2.unit04.lesson01.timeline_roles: {title: "زمینه، رویداد اصلی و اتفاق قبلی"}
  en.b2.unit04.lesson02.shifting_time: {title: "وقتی داشتم چک می‌کردم، برق رفت"}
  en.b2.unit04.lesson03.reading_an_incident_account: {title: "متن: مشکل محل برگزاری"}
  en.b2.unit04.lesson04.the_narrative_dialogue: {title: "مرحله‌به‌مرحله بگو چی شد"}

teaching:
  en.b2.unit04.lesson01.teach.background: {title: "background", gloss: "زمینه، چیزی که از قبل در جریان بوده", note: "در روایت انگلیسی، background معمولاً با past continuous میاد: کاری که داشت انجام می‌شد. فارسی می‌تونه با «داشتن» یا «می‌رفت/می‌کرد» بگه، اما انگلیسی شکل دقیق‌تری می‌خواد.", example_gloss: "اطلاعات زمینه‌ای می‌گه از قبل چه چیزی در جریان بوده."}
  en.b2.unit04.lesson01.teach.foreground: {title: "foreground", gloss: "رویداد اصلی، اتفاق جلوِ داستان", note: "foreground رویدادیه که داستان به سمتش حرکت می‌کنه؛ در انگلیسی اغلب با simple past میاد.", example_gloss: "رویداد اصلی همون اتفاق مهم در داستانه."}
  en.b2.unit04.lesson01.teach.prior: {title: "prior", gloss: "قبلی، پیش از یک اتفاق گذشتهٔ دیگر", note: "prior یعنی قبل از یک نقطهٔ گذشته. فارسی ممکنه فقط بگه «قبلاً»، اما انگلیسی برای روشن کردن ترتیب معمولاً past perfect می‌سازه.", example_gloss: "یک اتفاق قبلی قبل از اتفاق گذشتهٔ دیگری رخ داده."}
  en.b2.unit04.lesson01.teach.interrupt: {title: "interrupt", gloss: "قطع کردن، وسط کاری پریدن", note: "وقتی یک رویداد کوتاه یک کار در حال انجام رو قطع می‌کنه، انگلیسی معمولاً می‌گه: while I was..., the power went out.", example_gloss: "یک مشکل ناگهانی می‌تونه یک کار در حال انجام رو قطع کنه."}
  en.b2.unit04.lesson01.teach.ongoing: {title: "ongoing", gloss: "در حال انجام، ادامه‌دار", note: "ongoing یعنی کاری برای مدتی ادامه داشته؛ معادل فارسی «داشت ... می‌کرد» گاهی کمک می‌کنه، اما در انگلیسی به was/were + -ing دقت کنین.", example_gloss: "یک کار ادامه‌دار برای مدتی ادامه پیدا می‌کنه."}
  en.b2.unit04.lesson01.teach.chronology: {title: "chronology", gloss: "ترتیب واقعی اتفاق‌ها", note: "chronology یعنی ترتیب واقعی رویدادها، حتی اگر گوینده داستان رو از وسط شروع کنه.", example_gloss: "chronology ترتیب واقعی اتفاق‌هاست."}

  en.b2.unit04.lesson02.teach.by_the_time: {title: "By the time I arrived, the coordinator had already moved the equipment inside.", gloss: "تا وقتی من رسیدم، هماهنگ‌کننده از قبل تجهیزات رو برده بود داخل.", note: "had already moved یعنی این کار قبل از رسیدن تمام شده بود. فارسی «برده بود» نزدیکه؛ «برد» ترتیب قبلی رو کم‌رنگ می‌کنه."}
  en.b2.unit04.lesson02.teach.while_checking: {title: "While I was checking the sound system, the power went out.", gloss: "وقتی داشتم سیستم صدا رو چک می‌کردم، برق رفت.", note: "was checking زمینهٔ در حال انجامه؛ went out اتفاق اصلی و کوتاهه. فارسی «داشتم چک می‌کردم» این تفاوت رو خوب نشون می‌ده."}
  en.b2.unit04.lesson02.teach.when_arrived_setting: {title: "When I arrived, the volunteers were setting up the chairs.", gloss: "وقتی رسیدم، داوطلب‌ها داشتن صندلی‌ها رو می‌چیدن.", note: "were setting up یعنی کار از قبل شروع شده بود و همان لحظه ادامه داشت؛ با simple past اشتباهش نگیرین."}
  en.b2.unit04.lesson02.teach.grammar_shifted_time: {title: "سه نقش زمانی در روایت", gloss: "past continuous برای زمینه، simple past برای رویداد اصلی، و past perfect برای اتفاقی که قبل از یک لحظهٔ گذشته رخ داده.", note: "فارسی با می‌رفت/رفته بود تفاوت می‌سازه، اما همیشه به اندازهٔ انگلیسی اجباری نیست؛ در انگلیسی این انتخاب‌ها معنی روایت رو عوض می‌کنن."}

  en.b2.unit04.lesson03.teach.venue: {title: "venue", gloss: "محل برگزاری", note: "venue یعنی جایی که یک رویداد، جلسه یا برنامه برگزار می‌شه.", example_gloss: "venue جاییه که رویداد در آن اتفاق می‌افته."}
  en.b2.unit04.lesson03.teach.delayed: {title: "delayed", gloss: "با تأخیر افتاد، عقب افتاد", note: "delayed یعنی شروع یا انجام چیزی از زمان برنامه‌ریزی‌شده دیرتر شد.", example_gloss: "رویداد بیست دقیقه با تأخیر شروع شد."}
  en.b2.unit04.lesson03.teach.reading_passage: {title: "متن: مشکل محل برگزاری", gloss: "سایمون داستان رو کاملاً به ترتیب زمانی تعریف نکرد. قبل از اینکه به محل برگزاری برسه، هماهنگ‌کننده تجهیزات رو برده بود داخل، چون انتظار باران می‌رفت. وقتی سایمون رسید، داوطلب‌ها داشتن صندلی‌ها رو می‌چیدن. وقتی او داشت سیستم صدا رو چک می‌کرد، برق رفت. او به مدیر ساختمان زنگ زد؛ مدیر توضیح داد که همان صبح یک گروه تعمیر نزدیک آنجا مشغول کار بوده. تیم شروع برنامه رو بیست دقیقه عقب انداخت، اما تا وقتی مهمان‌ها وارد شدند، چراغ‌ها دوباره روشن شده بود.", note: "برای فارسی‌زبان‌ها دام اصلی اینه که همهٔ گذشته‌ها رو با simple past بسازن. این متن عمداً had moved، were setting up، was checking و had come back on رو جدا نگه می‌داره."}

  en.b2.unit04.lesson04.teach.q_walk_me_through: {title: "Harper", gloss: "می‌تونی مرحله‌به‌مرحله بگی در محل برگزاری چی شد؟", note: "walk me through یعنی قدم‌به‌قدم توضیح بده؛ ترجمهٔ کلمه‌به‌کلمه نکنین."}
  en.b2.unit04.lesson04.teach.a_arrived_volunteers: {title: "Simon", gloss: "حتماً. وقتی رسیدم، داوطلب‌ها داشتن صندلی‌ها رو می‌چیدن، اما هماهنگ‌کننده از قبل تجهیزات رو برده بود داخل، چون انتظار باران می‌رفت.", note: "این جمله هر سه نقش رو کنار هم میاره: arrived، were setting up، had already moved."}
  en.b2.unit04.lesson04.teach.q_equipment_safe: {title: "Harper", gloss: "پس تجهیزات قبل از رسیدنت در امان بود؟", note: "before you got there ترتیب زمانی رو روشن می‌کنه."}
  en.b2.unit04.lesson04.teach.a_power_went_out: {title: "Simon", gloss: "دقیقاً. بعد، وقتی داشتم سیستم صدا رو چک می‌کردم، برق رفت.", note: "while I was checking یعنی کار در حال انجام بود؛ the power went out آن را قطع کرد."}
  en.b2.unit04.lesson04.teach.q_after_that: {title: "Harper", gloss: "بعد از اون چیکار کردی؟", note: "after that روایت رو به رویداد بعدی می‌بره."}
  en.b2.unit04.lesson04.teach.a_repair_crew: {title: "Simon", gloss: "به مدیر ساختمان زنگ زدم و او بهم گفت یک گروه تعمیر صبح همان روز، قبل‌تر، نزدیک آنجا مشغول کار بوده.", note: "had been working یعنی قبل از تماس و در بازه‌ای از صبح کار می‌کرده‌اند."}
  en.b2.unit04.lesson04.teach.q_event: {title: "Harper", gloss: "و خود برنامه چی؟", note: "سؤال کوتاهه، اما منظورش سرنوشت رویداده."}
  en.b2.unit04.lesson04.teach.a_delayed_start: {title: "Simon", gloss: "شروع رو بیست دقیقه عقب انداختیم، اما تا وقتی مهمان‌ها وارد شدند، چراغ‌ها دوباره روشن شده بود.", note: "had come back on یعنی روشن شدن چراغ‌ها قبل از ورود مهمان‌ها کامل شده بود."}

exercises:
  en.b2.unit04.lesson01.exercise01.choose_background:
    instruction: "کدام کلمه یعنی اطلاعاتی دربارهٔ چیزی که از قبل دور و بر رویداد اصلی در جریان بوده؟"
    correct_option: "background"
    distractors: ["foreground", "prior", "chronology"]
    accepted_answers: [{value: "background", status: "correct"}]
    feedback: "background زمینهٔ در حال جریان را می‌گه."
  en.b2.unit04.lesson01.exercise02.choose_prior:
    instruction: "کدام کلمه یعنی زودتر از یک اتفاق دیگر در گذشته؟"
    correct_option: "prior"
    distractors: ["ongoing", "foreground", "interrupt"]
    accepted_answers: [{value: "prior", status: "correct"}]
    feedback: "prior یعنی قبل از یک نقطهٔ گذشتهٔ دیگر."
  en.b2.unit04.lesson01.exercise03.match_timeline_terms:
    instruction: "هر نقش زمانی را به کلمهٔ انگلیسی درست وصل کنین."
    accepted_answers: [{value: [{left: "what was already happening", right: "background"}, {left: "the main event the story moves toward", right: "foreground"}, {left: "earlier than another past event", right: "prior"}, {left: "stop or break into an ongoing action", right: "interrupt"}, {left: "continuing for some time", right: "ongoing"}, {left: "the real order of events", right: "chronology"}], status: "correct"}]
    feedback: "background زمینه است، foreground رویداد اصلی، prior اتفاق قبلی، interrupt قطع کردن، ongoing ادامه‌دار، chronology ترتیب واقعی."
  en.b2.unit04.lesson01.exercise04.write_chronology:
    instruction: "کلمه‌ای را بنویسین که یعنی ترتیب واقعی اتفاق‌ها."
    accepted_answers:
      - {value: "chronology", status: "correct"}
      - {value: "Chronology", status: "correct"}
    feedback: "chronology یعنی ترتیب واقعی رویدادها."
  en.b2.unit04.lesson01.exercise05.write_foreground:
    instruction: "کلمه‌ای را بنویسین که یعنی رویداد اصلی‌ای که داستان به سمتش می‌ره."
    accepted_answers:
      - {value: "foreground", status: "correct"}
      - {value: "Foreground", status: "correct"}
    feedback: "foreground رویداد اصلی جلوی روایته."

  en.b2.unit04.lesson02.exercise01.choose_past_perfect:
    instruction: "کدام عبارت نشان می‌ده اتفاق قبل از رسیدن کامل شده بوده؟"
    correct_option: "the coordinator had already moved the equipment inside"
    distractors: ["the volunteers were setting up the chairs", "While I was checking the sound system", "the power went out"]
    accepted_answers: [{value: "the coordinator had already moved the equipment inside", status: "correct"}]
    feedback: "had already moved همون past perfectه و ترتیب قبلی رو نشان می‌ده."
  en.b2.unit04.lesson02.exercise02.choose_interruption:
    instruction: "کدام جمله کاری ادامه‌دار را نشان می‌ده که یک اتفاق اصلی آن را قطع می‌کنه؟"
    correct_option: "While I was checking the sound system, the power went out."
    distractors: ["By the time I arrived, the coordinator had already moved the equipment inside.", "When I arrived, the volunteers were setting up the chairs.", "The coordinator had already moved the equipment inside."]
    accepted_answers: [{value: "While I was checking the sound system, the power went out.", status: "correct"}]
    feedback: "was checking ادامه‌دار است؛ went out اتفاق قطع‌کننده است."
  en.b2.unit04.lesson02.exercise03.order_by_the_time:
    instruction: "کلمات را برای ساختن جملهٔ past perfect با By the time مرتب کنین."
    accepted_answers: [{value: ["By", "the", "time", "I", "arrived", "the", "coordinator", "had", "already", "moved", "the", "equipment", "inside"], status: "correct"}]
    feedback: "ترتیب درست: By the time I arrived, the coordinator had already moved the equipment inside."
  en.b2.unit04.lesson02.exercise04.reply_while_checking:
    instruction: "این جملهٔ قطع شدن کار در حال انجام را دقیق بنویسین: While I was checking the sound system, the power went out."
    accepted_answers:
      - {value: "While I was checking the sound system, the power went out.", status: "correct"}
      - {value: "While I was checking the sound system the power went out.", status: "correct"}
    feedback: "در انگلیسی B2، while + past continuous زمینه را می‌سازه."
  en.b2.unit04.lesson02.exercise05.write_prior_event:
    instruction: "این اتفاق قبلی را با past perfect دقیق بنویسین: The coordinator had already moved the equipment inside."
    accepted_answers:
      - {value: "The coordinator had already moved the equipment inside.", status: "correct"}
      - {value: "The coordinator had already moved the equipment inside", status: "correct"}
    feedback: "had already moved یعنی «از قبل برده بود»، نه فقط «برد»."

  en.b2.unit04.lesson03.exercise01.choose_earliest_event:
    instruction: "کدام اتفاق در متن از همه زودتر افتاده؟"
    correct_option: "the coordinator had moved the equipment inside"
    distractors: ["the volunteers were setting up chairs", "the power went out", "the team delayed the start"]
    accepted_answers: [{value: "the coordinator had moved the equipment inside", status: "correct"}]
    feedback: "این اتفاق قبل از رسیدن سایمون افتاده بود."
  en.b2.unit04.lesson03.exercise02.choose_interrupted_action:
    instruction: "وقتی برق رفت، کدام کار در حال انجام بود؟"
    correct_option: "he was checking the sound system"
    distractors: ["the coordinator had moved the equipment inside", "the team delayed the start", "the lights had come back on"]
    accepted_answers: [{value: "he was checking the sound system", status: "correct"}]
    feedback: "was checking کار ادامه‌دار هنگام قطع شدن برق بود."
  en.b2.unit04.lesson03.exercise03.match_chronology:
    instruction: "هر رویداد را به نقش زمانی درستش وصل کنین."
    accepted_answers: [{value: [{left: "earliest prior event", right: "the coordinator moved the equipment inside"}, {left: "background when Simon arrived", right: "volunteers were setting up chairs"}, {left: "ongoing action", right: "Simon was checking the sound system"}, {left: "foreground interruption", right: "the power went out"}, {left: "later consequence", right: "the team delayed the start"}, {left: "final resolved moment", right: "the lights had come back on"}], status: "correct"}]
    feedback: "ترتیب واقعی را از شکل روایت جدا کنین."
  en.b2.unit04.lesson03.exercise04.write_earliest_event:
    instruction: "دقیق بنویسین: The coordinator had moved the equipment inside before Simon arrived."
    accepted_answers:
      - {value: "The coordinator had moved the equipment inside before Simon arrived.", status: "correct"}
      - {value: "The coordinator had moved the equipment inside before Simon arrived", status: "correct"}
    feedback: "had moved قبل از arrived رخ داده."
  en.b2.unit04.lesson03.exercise05.write_interruption:
    instruction: "دقیق بنویسین: While Simon was checking the sound system, the power went out."
    accepted_answers:
      - {value: "While Simon was checking the sound system, the power went out.", status: "correct"}
      - {value: "While Simon was checking the sound system the power went out.", status: "correct"}
    feedback: "past continuous + simple past برای کار ادامه‌دار و اتفاق قطع‌کننده است."

  en.b2.unit04.lesson04.exercise01.choose_prior_event:
    instruction: "کدام اتفاق قبل از رسیدن سایمون از قبل انجام شده بود؟"
    correct_option: "the coordinator had already moved the equipment inside"
    distractors: ["the volunteers were setting up the chairs", "the power went out", "the lights had come back on"]
    accepted_answers: [{value: "the coordinator had already moved the equipment inside", status: "correct"}]
    feedback: "had already moved ترتیب قبلی را نشان می‌ده."
  en.b2.unit04.lesson04.exercise02.listen_interruption:
    instruction: "گوش کنین و اتفاقی را انتخاب کنین که کار سایمون را قطع کرد."
    correct_option: "the power went out"
    distractors: ["the guests entered", "the start was delayed", "the building manager called"]
    accepted_answers: [{value: "the power went out", status: "correct"}]
    feedback: "در جملهٔ شنیداری، برق رفت وقتی سایمون داشت سیستم صدا را چک می‌کرد."
  en.b2.unit04.lesson04.exercise03.order_while_power:
    instruction: "کلمات را برای گفتن «وقتی داشتم سیستم صدا را چک می‌کردم، برق رفت» مرتب کنین."
    accepted_answers: [{value: ["while", "I", "was", "checking", "the", "sound", "system", "the", "power", "went", "out"], status: "correct"}]
    feedback: "ترتیب درست: while I was checking the sound system the power went out."
  en.b2.unit04.lesson04.exercise04.reply_as_simon:
    instruction: "با یک کار زمینه‌ای و یک اتفاق قبلی جواب بدین: When I arrived, the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside."
    accepted_answers:
      - {value: "When I arrived, the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside.", status: "correct"}
      - {value: "When I arrived the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside.", status: "correct"}
    feedback: "were setting up زمینه است؛ had already moved اتفاق قبلی است."
  en.b2.unit04.lesson04.exercise05.speak_recount:
    instruction: "با صدای بلند حادثهٔ محل برگزاری را با زمینه، یک اتفاق قبلی، یک کار قطع‌شده و پایان حل‌شده بازگو کنین."
    accepted_answers:
      - {value: "When I arrived, the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside. While I was checking the sound system, the power went out. We delayed the start, but by the time guests entered, the lights had come back on.", status: "correct"}
    feedback: "هر چهار بخش زمانی باید روشن باشن."
  en.b2.unit04.lesson04.exercise06.write_complex_recount:
    instruction: "این روایت کامل را با زمینه، اتفاق قبلی، کار قطع‌شده و پایان حل‌شده بنویسین: When I arrived, the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside. While I was checking the sound system, the power went out. We delayed the start, but by the time guests entered, the lights had come back on."
    accepted_answers:
      - {value: "When I arrived, the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside. While I was checking the sound system, the power went out. We delayed the start, but by the time guests entered, the lights had come back on.", status: "correct"}
      - {value: "When I arrived the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside. While I was checking the sound system, the power went out. We delayed the start, but by the time guests entered, the lights had come back on.", status: "correct"}
    feedback: "past perfect ترتیب قبلی را می‌سازه؛ past continuous زمینه و interrupted action را."
