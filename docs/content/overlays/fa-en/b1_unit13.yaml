course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح میانی (B1) برای فارسی‌زبان‌ها، با تمرکز بر شرط، توالی رویدادها، نقل قول غیرمستقیم، هدف و فرض‌های غیرواقعی."

units:
  en.b1.unit13.relative_clauses: {title: "همکاری که کنار میا می‌شینه"}

lessons:
  en.b1.unit13.lesson01.relative_clause_vocabulary: {title: "who، which، that، whose و where"}
  en.b1.unit13.lesson02.defining_and_nondefining: {title: "جملهٔ موصولی تعریفی و توضیحی"}
  en.b1.unit13.lesson03.reading_the_new_office: {title: "متن: اتاق کار جدید"}
  en.b1.unit13.lesson04.the_new_coworker_dialogue: {title: "زنی که تازه به تیممون پیوسته"}

teaching:
  en.b1.unit13.lesson01.teach.who: {title: "who", gloss: "که (برای آدم)", note: "who توی جملهٔ موصولی برای اشاره به یه آدم استفاده می‌شه.", example_gloss: "دنیل، که ماه مارس به تیم پیوست، الان دو تا پروژه رو اداره می‌کنه."}
  en.b1.unit13.lesson01.teach.which: {title: "which", gloss: "که (برای چیز)", note: "which توی جملهٔ موصولی برای اشاره به یه چیز استفاده می‌شه.", example_gloss: "دورهٔ طراحی که لیلا انتخاب کرد، ماه ژوئن شروع می‌شه."}
  en.b1.unit13.lesson01.teach.that_relative: {title: "that", gloss: "که (برای آدم یا چیز، توی جملهٔ موصولی تعریفی)", note: "that توی جملهٔ موصولی تعریفی برای آدم یا چیز استفاده می‌شه.", example_gloss: "مشتری‌ای که صبح تماس گرفت، یه جلسه می‌خواد."}
  en.b1.unit13.lesson01.teach.whose: {title: "whose", gloss: "که ... اونه (نشون‌دهندهٔ مالکیت)", note: "whose توی جملهٔ موصولی مالکیت رو نشون می‌ده.", example_gloss: "مشتری‌ای که پروژه‌اش رو دارن تموم می‌کنن، طراحی رو قبلاً تأیید کرده."}
  en.b1.unit13.lesson01.teach.where: {title: "where", gloss: "که ... اونجاست (برای مکان)", note: "where توی جملهٔ موصولی برای اشاره به یه مکان استفاده می‌شه.", example_gloss: "اتاق کاری که دنیل توش کار می‌کنه، مرکز شهره."}
  en.b1.unit13.lesson01.teach.coworker: {title: "coworker", gloss: "همکار", note: "coworker یعنی کسی که باهاش کار می‌کنین.", example_gloss: "میا یه همکار داره که عصرها اسپانیایی می‌خونه."}

  en.b1.unit13.lesson02.teach.colleague_organized: {title: "The colleague who sits next to Mia is very organized.", gloss: "همکاری که کنار میا می‌شینه، خیلی منظمه.", note: "این یه جملهٔ موصولی تعریفیه، بدون ویرگول: مشخص می‌کنه دقیقاً کدوم همکار."}
  en.b1.unit13.lesson02.teach.daniel_leads_projects: {title: "Daniel, who joined the team in March, already leads two projects.", gloss: "دنیل، که ماه مارس به تیم پیوست، الان دو تا پروژه رو اداره می‌کنه.", note: "این یه جملهٔ موصولی توضیحیه، با ویرگول: یه اطلاعات اضافه دربارهٔ دنیل می‌ده."}
  en.b1.unit13.lesson02.teach.grammar_defining: {title: "جملهٔ موصولی تعریفی و توضیحی", gloss: "همکاری که کنار میا می‌شینه، منظمه. دنیل، که ماه مارس پیوست، دو تا پروژه رو اداره می‌کنه.", note: "جملهٔ موصولی تعریفی بدون ویرگول میاد و دقیقاً می‌گه کدوم آدم یا چیز مدنظره. جملهٔ موصولی توضیحی با ویرگول یه اطلاعات اضافه دربارهٔ کسی که قبلاً مشخص شده، اضافه می‌کنه."}

  en.b1.unit13.lesson03.teach.deadline: {title: "deadline", gloss: "مهلت، ددلاین", note: "deadline یعنی تاریخ یا زمانی که باید یه کاری تموم بشه.", example_gloss: "همکاری که کنار میا می‌شینه، همیشه مهلت‌هاش رو رعایت می‌کنه."}
  en.b1.unit13.lesson03.teach.approve: {title: "approve", gloss: "تأیید کردن", note: "approve یعنی رسماً موافقت کنین که چیزی خوبه یا قبوله.", example_gloss: "مشتری اولین طراحی رو قبلاً تأیید کرده."}
  en.b1.unit13.lesson03.teach.reading_passage: {title: "متن: اتاق کار جدید", gloss: "میا با چند نفر کار می‌کنه که کارش رو راحت‌تر می‌کنن. دنیل، که ماه مارس به تیم پیوست، الان دو تا پروژه رو اداره می‌کنه. همکاری که کنار میا می‌شینه خیلی منظمه و همیشه مهلت‌هاش رو رعایت می‌کنه. اتاق کارشون، که توی طبقهٔ پنجمه، یه آشپزخانهٔ کوچیک داره که همه اونجا با هم ناهار می‌خورن. مشتری‌ای که پروژه‌اش رو دارن تموم می‌کنن، طراحی اول رو قبلاً تأیید کرده.", note: "این متن who، whose، which و where رو با هم نشون می‌ده."}

  en.b1.unit13.lesson04.teach.q_met_the_woman: {title: "حرف میا", gloss: "میا می‌گه لیلا، زنی که تازه به تیممون پیوسته رو دیدی؟", note: "*who just joined our team* دقیقاً می‌گه کدوم زن مدنظره."}
  en.b1.unit13.lesson04.teach.a_whose_desk: {title: "جواب لیلا", gloss: "لیلا می‌گه هنوز نه. اون کسیه که میزش کنار پنجره‌ست؟", note: "*whose desk is near the window* مالکیت رو نشون می‌ده."}
  en.b1.unit13.lesson04.teach.q_the_designer_who: {title: "جواب میا", gloss: "میا می‌گه آره، خودشه. اون طراحیه که پروژهٔ لوگو رو تموم کرد.", note: "*who finished the logo project* می‌گه کدوم طراح."}
  en.b1.unit13.lesson04.teach.a_which_won_award: {title: "حرف لیلا", gloss: "لیلا می‌گه آها یادم اومد. اون همون پروژه‌ست که ماه پیش جایزه گرفت؟", note: "*which won the award* اشاره به یه چیز داره، نه یه آدم."}
  en.b1.unit13.lesson04.teach.q_office_smaller: {title: "جواب میا", gloss: "میا می‌گه دقیقاً. اتاق کاری که اونجا کار می‌کرد، خیلی کوچیک‌تر از اینجا بود.", note: "*where she used to work* اشاره به مکان داره."}
  en.b1.unit13.lesson04.teach.a_kitchen_where: {title: "جمع‌بندی لیلا", gloss: "لیلا می‌گه اینه که چرا اون آشپزخونه رو دوست داره که همه اونجا با هم ناهار می‌خورن.", note: "*where everyone eats lunch together* اشاره به همون آشپزخونه داره."}

exercises:
  en.b1.unit13.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای را که گفته شده انتخاب کنین."
    correct_option: "coworker"
    distractors: ["who", "which", "where"]
    accepted_answers: [{value: "coworker", status: "correct"}]
    feedback: "coworker یعنی همکار."
  en.b1.unit13.lesson01.exercise02.choose_whose:
    instruction: "کدام کلمه توی جملهٔ موصولی مالکیت رو نشون می‌ده؟"
    correct_option: "whose"
    distractors: ["who", "which", "that"]
    accepted_answers: [{value: "whose", status: "correct"}]
    feedback: "whose یعنی که ... اونه، برای نشون دادن مالکیت."
  en.b1.unit13.lesson01.exercise03.choose_where:
    instruction: "کدام کلمه توی جملهٔ موصولی به یه مکان اشاره می‌کنه؟"
    correct_option: "where"
    distractors: ["whose", "which", "who"]
    accepted_answers: [{value: "where", status: "correct"}]
    feedback: "where یعنی که ... اونجاست."
  en.b1.unit13.lesson01.exercise04.match_relative_words:
    instruction: "هر معنی را به کلمه یا عبارت انگلیسی درست وصل کنید."
    accepted_answers: [{value: [{left: "refers to a person in a relative clause", right: "who"}, {left: "refers to a thing in a relative clause", right: "which"}, {left: "refers to a person or thing in a defining relative clause", right: "that"}, {left: "shows possession inside a relative clause", right: "whose"}, {left: "refers to a place inside a relative clause", right: "where"}, {left: "someone you work with", right: "coworker"}], status: "correct"}]
    feedback: "who=که (آدم)، which=که (چیز)، that=که (تعریفی)، whose=که ... اونه، where=که ... اونجاست، coworker=همکار."
  en.b1.unit13.lesson01.exercise05.write_coworker:
    instruction: "کلمه‌ای را بنویسین که یعنی کسی که باهاش کار می‌کنین."
    accepted_answers:
      - {value: "coworker", status: "correct"}
      - {value: "Coworker", status: "correct"}
    feedback: "coworker یعنی همکار."

  en.b1.unit13.lesson02.exercise01.choose_defining_clause:
    instruction: "کدام جمله از یه جملهٔ موصولی تعریفی بدون ویرگول استفاده می‌کنه؟"
    correct_option: "The colleague who sits next to Mia is very organized."
    distractors: ["Daniel, who joined the team in March, already leads two projects.", "Their office, which is on the fifth floor, has a kitchen.", "The client, whose project they are finishing, approved the design."]
    accepted_answers: [{value: "The colleague who sits next to Mia is very organized.", status: "correct"}]
    feedback: "این جمله بدون ویرگول دقیقاً می‌گه کدوم همکار."
  en.b1.unit13.lesson02.exercise02.choose_nondefining_clause:
    instruction: "کدام جمله از یه جملهٔ موصولی توضیحی با ویرگول برای اطلاعات اضافه استفاده می‌کنه؟"
    correct_option: "Daniel, who joined the team in March, already leads two projects."
    distractors: ["The colleague who sits next to Mia is very organized.", "The client whose project they are finishing has approved the design.", "The office where Daniel works is downtown."]
    accepted_answers: [{value: "Daniel, who joined the team in March, already leads two projects.", status: "correct"}]
    feedback: "ویرگول‌ها اطلاعات اضافه دربارهٔ دنیل رو نشون می‌دن."
  en.b1.unit13.lesson02.exercise03.order_colleague_organized:
    instruction: "کلمات را برای گفتن «همکاری که کنار میا می‌شینه، خیلی منظمه.» مرتب کنین."
    accepted_answers: [{value: ["The", "colleague", "who", "sits", "next", "to", "Mia", "is", "very", "organized"], status: "correct"}]
    feedback: "ترتیب درست: The colleague who sits next to Mia is very organized."
  en.b1.unit13.lesson02.exercise04.reply_which_colleague:
    instruction: "کدوم همکار خیلی منظمه؟"
    accepted_answers:
      - {value: "The colleague who sits next to Mia is very organized.", status: "correct"}
      - {value: "The colleague who sits next to Mia is very organized", status: "correct"}
    feedback: "متن می‌گه: The colleague who sits next to Mia is very organized."
  en.b1.unit13.lesson02.exercise05.write_daniel_leads:
    instruction: "بنویسین که دنیل، که ماه مارس به تیم پیوست، الان دو تا پروژه رو اداره می‌کنه."
    accepted_answers:
      - {value: "Daniel, who joined the team in March, already leads two projects.", status: "correct"}
      - {value: "Daniel, who joined the team in March, already leads two projects", status: "correct"}
    feedback: "who joined the team in March اطلاعات اضافه دربارهٔ دنیل رو با ویرگول اضافه می‌کنه."

  en.b1.unit13.lesson03.exercise01.comprehend_daniel_leads:
    instruction: "دنیل، که ماه مارس به تیم پیوست، تا حالا چیکار کرده؟"
    correct_option: "already leads two projects"
    distractors: ["already approved the design", "already met the new coworker", "already left the team"]
    accepted_answers: [{value: "already leads two projects", status: "correct"}]
    feedback: "متن می‌گه: already leads two projects."
  en.b1.unit13.lesson03.exercise02.comprehend_client_approved:
    instruction: "مشتری‌ای که پروژه‌اش رو دارن تموم می‌کنن، تا حالا چیکار کرده؟"
    correct_option: "has already approved the first design"
    distractors: ["has already met Daniel", "has already changed the deadline", "has already left the project"]
    accepted_answers: [{value: "has already approved the first design", status: "correct"}]
    feedback: "متن می‌گه: has already approved the first design."
  en.b1.unit13.lesson03.exercise03.recognize_deadline:
    instruction: "کدام کلمه یعنی تاریخ یا زمانی که یه کار باید تموم بشه؟"
    correct_option: "deadline"
    distractors: ["approve", "coworker", "flexibility"]
    accepted_answers: [{value: "deadline", status: "correct"}]
    feedback: "deadline یعنی مهلت."
  en.b1.unit13.lesson03.exercise04.order_office_kitchen:
    instruction: "کلمات را برای گفتن «اتاق کارشون، که توی طبقهٔ پنجمه، یه آشپزخانهٔ کوچیک داره.» مرتب کنین."
    accepted_answers: [{value: ["Their", "office", "which", "is", "on", "the", "fifth", "floor", "has", "a", "small", "kitchen"], status: "correct"}]
    feedback: "ترتیب درست: Their office, which is on the fifth floor, has a small kitchen."
  en.b1.unit13.lesson03.exercise05.write_colleague_organized:
    instruction: "بنویسین که همکاری که کنار میا می‌شینه، خیلی منظمه."
    accepted_answers:
      - {value: "The colleague who sits next to Mia is very organized.", status: "correct"}
      - {value: "The colleague who sits next to Mia is very organized", status: "correct"}
    feedback: "who sits next to Mia دقیقاً می‌گه کدوم همکار."

  en.b1.unit13.lesson04.exercise01.listen_who_joined_team:
    instruction: "گفتگو را گوش کنین و بگین میا دربارهٔ کدوم آدم می‌پرسه."
    correct_option: "the woman who just joined our team"
    distractors: ["the woman who used to sit near the window", "the man who left the team last month", "the coworker who studies Spanish"]
    accepted_answers: [{value: "the woman who just joined our team", status: "correct"}]
    feedback: "میا می‌پرسه دربارهٔ: the woman who just joined our team."
  en.b1.unit13.lesson04.exercise02.listen_desk_location:
    instruction: "گوش کنین و بگین لیلا میز کیو توصیف می‌کنه."
    correct_option: "whose desk is near the window"
    distractors: ["whose desk is near the kitchen", "whose desk is in the corner", "whose desk is on the fifth floor"]
    accepted_answers: [{value: "whose desk is near the window", status: "correct"}]
    feedback: "لیلا می‌پرسه: is she the person whose desk is near the window?"
  en.b1.unit13.lesson04.exercise03.choose_who_the_new_coworker_is:
    instruction: "همکار جدیدی که میا توصیف می‌کنه، کیه؟"
    correct_option: "the designer who finished the logo project"
    distractors: ["the manager who joined the team in March", "the client whose project they are finishing", "the coworker who studies Spanish in the evening"]
    accepted_answers: [{value: "the designer who finished the logo project", status: "correct"}]
    feedback: "میا می‌گه: she is the designer who finished the logo project."
  en.b1.unit13.lesson04.exercise04.order_office_smaller:
    instruction: "کلمات را برای گفتن «اتاق کاری که اونجا کار می‌کرد، خیلی کوچیک‌تر از اینجا بود.» مرتب کنین."
    accepted_answers: [{value: ["The", "office", "where", "she", "used", "to", "work", "was", "much", "smaller", "than", "ours"], status: "correct"}]
    feedback: "ترتیب درست: The office where she used to work was much smaller than ours."
  en.b1.unit13.lesson04.exercise05.reply_as_mia:
    instruction: "لیلا می‌گه: هنوز نه. اون کسیه که میزش کنار پنجره‌ست؟"
    accepted_answers:
      - {value: "Yes, that is her. She is the designer who finished the logo project.", status: "correct"}
      - {value: "Yes, that is her. She is the designer who finished the logo project", status: "correct"}
    feedback: "این جواب تأیید می‌کنه و طراح جدید رو با who توصیف می‌کنه."
  en.b1.unit13.lesson04.exercise06.speak_relative_clause_dialogue:
    instruction: "به نقش لیلا، با صدای بلند به میا جواب بدین."
    accepted_answers:
      - {value: "That explains why she loves the kitchen where everyone eats lunch together.", status: "correct"}
      - {value: "That explains why she loves the kitchen where everyone eats lunch together", status: "correct"}
    feedback: "این جواب دلیل علاقهٔ همکار جدید رو با where بیان می‌کنه."
