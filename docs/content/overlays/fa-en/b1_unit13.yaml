course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح میانی (B1) برای فارسی‌زبان‌ها، با تمرکز بر شرط، توالی رویدادها، نقل قول غیرمستقیم، هدف و فرض‌های غیرواقعی."

units:
  en.b1.unit13.relative_clauses: {title: "همکاری که کنار میا می‌شینه"}

lessons:
  en.b1.unit13.lesson01.relative_clause_vocabulary: {title: "who، which، that، whose و where"}
  en.b1.unit13.lesson02.defining_and_nondefining: {title: "جملهٔ موصولی تعریفی و توضیحی"}
  en.b1.unit13.lesson03.reading_the_new_office: {title: "متن: دفتر جدید"}
  en.b1.unit13.lesson04.the_new_coworker_dialogue: {title: "زنی که تازه به تیممون پیوسته"}

teaching:
  en.b1.unit13.lesson01.teach.who: {title: "who", gloss: "که (برای آدم)", note: "who توی جملهٔ موصولی برای اشاره به یه آدم استفاده می‌شه.", example_gloss: "دنیل، که ماه مارس به تیم پیوست، الان دو تا پروژه رو اداره می‌کنه."}
  en.b1.unit13.lesson01.teach.which: {title: "which", gloss: "که (برای چیز)", note: "which توی جملهٔ موصولی برای اشاره به یه چیز استفاده می‌شه.", example_gloss: "دورهٔ طراحی که لیلا انتخاب کرد، ماه ژوئن شروع می‌شه."}
  en.b1.unit13.lesson01.teach.that_relative: {title: "that", gloss: "که (برای آدم یا چیز، توی جملهٔ موصولی تعریفی)", note: "that توی جملهٔ موصولی تعریفی برای آدم یا چیز استفاده می‌شه.", example_gloss: "مشتری‌ای که صبح تماس گرفت، یه جلسه می‌خواد."}
  en.b1.unit13.lesson01.teach.whose: {title: "whose", gloss: "که ...ش (مالکیت؛ مثل «کسی که میزش»)", note: "whose توی جملهٔ موصولی مالکیت رو نشون می‌ده.", example_gloss: "مشتری‌ای که پروژه‌اش رو دارن تموم می‌کنن، طراحی رو قبلاً تأیید کرده."}
  en.b1.unit13.lesson01.teach.where: {title: "where", gloss: "جایی که، که اونجا (برای مکان)", note: "where توی جملهٔ موصولی برای اشاره به یه مکان استفاده می‌شه.", example_gloss: "دفتری که دنیل توش کار می‌کنه، مرکز شهره."}
  en.b1.unit13.lesson01.teach.coworker: {title: "coworker", gloss: "همکار", note: "coworker یعنی کسی که باهاش کار می‌کنین.", example_gloss: "میا یه همکار داره که عصرها اسپانیایی می‌خونه."}

  en.b1.unit13.lesson02.teach.colleague_organized: {title: "The colleague who sits next to Mia is very organized.", gloss: "همکاری که کنار میا می‌شینه، خیلی منظمه.", note: "این یه جملهٔ موصولی تعریفیه، بدون ویرگول: مشخص می‌کنه دقیقاً کدوم همکار."}
  en.b1.unit13.lesson02.teach.daniel_leads_projects: {title: "Daniel, who joined the team in March, already leads two projects.", gloss: "دنیل، که ماه مارس به تیم پیوست، الان دو تا پروژه رو اداره می‌کنه.", note: "این یه جملهٔ موصولی توضیحیه، با ویرگول: یه اطلاعات اضافه دربارهٔ دنیل می‌ده."}
  en.b1.unit13.lesson02.teach.grammar_defining: {title: "جملهٔ موصولی تعریفی و توضیحی", gloss: "همکاری که کنار میا می‌شینه، منظمه. دنیل، که ماه مارس پیوست، دو تا پروژه رو اداره می‌کنه.", note: "جملهٔ موصولی تعریفی بدون ویرگول میاد و دقیقاً می‌گه کدوم آدم یا چیز مدنظره. جملهٔ موصولی توضیحی با ویرگول یه اطلاعات اضافه دربارهٔ کسی که قبلاً مشخص شده، اضافه می‌کنه."}

  en.b1.unit13.lesson03.teach.deadline: {title: "deadline", gloss: "مهلت، ددلاین", note: "deadline یعنی تاریخ یا زمانی که باید یه کاری تموم بشه.", example_gloss: "همکاری که کنار میا می‌شینه، همیشه مهلت‌هاش رو رعایت می‌کنه."}
  en.b1.unit13.lesson03.teach.approve: {title: "approve", gloss: "تأیید کردن", note: "approve یعنی رسماً موافقت کنین که چیزی خوبه یا قبوله.", example_gloss: "مشتری اولین طراحی رو قبلاً تأیید کرده."}
  en.b1.unit13.lesson03.teach.reading_passage: {title: "متن: دفتر جدید", gloss: "میا با چند نفر کار می‌کنه که کارش رو راحت‌تر می‌کنن. دنیل، که ماه مارس به تیم پیوست، الان دو تا پروژه رو اداره می‌کنه. همکاری که کنار میا می‌شینه خیلی منظمه و همیشه مهلت‌هاش رو رعایت می‌کنه. دفترشون، که توی طبقهٔ پنجمه، یه آشپزخونهٔ کوچیک داره که همه اونجا با هم ناهار می‌خورن. مشتری‌ای که پروژه‌اش رو دارن تموم می‌کنن، طراحی اول رو قبلاً تأیید کرده.", note: "این متن who، whose، which و where رو با هم نشون می‌ده."}

  en.b1.unit13.lesson04.teach.q_met_the_woman: {title: "حرف میا", gloss: "میا می‌گه لیلا، زنی که تازه به تیممون پیوسته رو دیدی؟", note: "*who just joined our team* دقیقاً می‌گه کدوم زن مدنظره."}
  en.b1.unit13.lesson04.teach.a_whose_desk: {title: "جواب لیلا", gloss: "لیلا می‌گه هنوز نه. اون کسیه که میزش کنار پنجره‌ست؟", note: "*whose desk is near the window* مالکیت رو نشون می‌ده."}
  en.b1.unit13.lesson04.teach.q_the_designer_who: {title: "جواب میا", gloss: "میا می‌گه آره، خودشه. اون طراحیه که پروژهٔ لوگو رو تموم کرد.", note: "*who finished the logo project* می‌گه کدوم طراح."}
  en.b1.unit13.lesson04.teach.a_which_won_award: {title: "حرف لیلا", gloss: "لیلا می‌گه آها یادم اومد. اون همون پروژه‌ست که ماه پیش جایزه گرفت؟", note: "*which won the award* اشاره به یه چیز داره، نه یه آدم."}
  en.b1.unit13.lesson04.teach.q_office_smaller: {title: "جواب میا", gloss: "میا می‌گه دقیقاً. دفتری که قبلاً اونجا کار می‌کرد، خیلی کوچیک‌تر از مال ما بود.", note: "*where she used to work* اشاره به مکان داره."}
  en.b1.unit13.lesson04.teach.a_kitchen_where: {title: "جمع‌بندی لیلا", gloss: "لیلا می‌گه پس برای همینه که آشپزخونه‌ای رو که همه اونجا با هم ناهار می‌خورن این‌قدر دوست داره.", note: "*where everyone eats lunch together* اشاره به همون آشپزخونه داره."}

