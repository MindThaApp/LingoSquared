course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit59.banking_basics: {title: "مقدمات کارهای بانکی"}

lessons:
  en.a1.unit59.lesson01.banking_words: {title: "واژه‌های بانکی"}
  en.a1.unit59.lesson02.banking_phrases: {title: "عبارت‌های بانکی"}
  en.a1.unit59.lesson03.dialogue_at_the_bank: {title: "گفتگو: در بانک"}
