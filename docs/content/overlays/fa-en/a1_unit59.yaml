      - {left: "card", right: "وسیلهٔ پلاستیکی کوچیک برای پرداخت"}
      - {left: "cash", right: "پول کاغذی و سکه"}
      - {left: "ATM", right: "دستگاهی که ازش پول نقد می‌گیرین"}
      - {left: "balance", right: "مقدار پولی که توی حسابتونه"}
    accepted_answers:
      - value:
          - {left: "bank", right: "جایی که پول نگه می‌داره"}
          - {left: "account", right: "جایی در بانک که پولتون توش ثبت و نگهداری می‌شه"}
          - {left: "card", right: "وسیلهٔ پلاستیکی کوچیک برای پرداخت"}
          - {left: "cash", right: "پول کاغذی و سکه"}
          - {left: "ATM", right: "دستگاهی که ازش پول نقد می‌گیرین"}
          - {left: "balance", right: "مقدار پولی که توی حسابتونه"}
        status: "correct"
    feedback: "bank=بانک، account=حساب، card=کارت، cash=پول نقد، ATM=خودپرداز، balance=موجودی."
