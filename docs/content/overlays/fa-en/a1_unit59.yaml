course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit59.banking_basics: {title: "مقدمات کارهای بانکی"}

lessons:
  en.a1.unit59.lesson01.banking_words: {title: "واژه‌های بانکی"}
  en.a1.unit59.lesson02.banking_phrases: {title: "عبارت‌های بانکی"}
  en.a1.unit59.lesson03.dialogue_at_the_bank: {title: "گفتگو: در بانک"}
  en.a1.unit59.lesson04.bank_notice: {title: "متن: اطلاعیهٔ بانک"}

teaching:
  en.a1.unit59.lesson01.teach.bank: {title: "bank", gloss: "بانک", note: "*bank* یعنی جایی که پول رو نگه می‌دارن و کارهای مالی انجام می‌دن.", example_gloss: "بانک نزدیک اینجاست."}
  en.a1.unit59.lesson01.teach.account: {title: "account", gloss: "حساب", note: "*account* یعنی حساب بانکی؛ یعنی پرونده و سابقهٔ پول شما در بانک.", example_gloss: "من حساب بانکی دارم."}
  en.a1.unit59.lesson01.teach.card: {title: "card", gloss: "کارت", note: "*card* در این درس یعنی کارت بانکی یا کارت پرداخت.", example_gloss: "این کارت اینجا کار می‌کنه."}
  en.a1.unit59.lesson01.teach.cash: {title: "cash", gloss: "پول نقد", note: "*cash* یعنی پول نقد، مثل اسکناس و سکه.", example_gloss: "من پول نقد لازم دارم."}
  en.a1.unit59.lesson01.teach.atm: {title: "ATM", gloss: "دستگاه خودپرداز", note: "*ATM* یعنی دستگاهی که با کارت از اون پول نقد می‌گیرین.", example_gloss: "دستگاه خودپرداز بیرونه."}
  en.a1.unit59.lesson01.teach.balance: {title: "balance", gloss: "موجودی", note: "*balance* یعنی مقدار پولی که تو حساب‌تون مونده‌ست.", example_gloss: "می‌خوام موجودیمو بررسی کنم."}

  en.a1.unit59.lesson02.teach.i_need_cash: {title: "گفتن نیاز به پول نقد", gloss: "من پول نقد لازم دارم.", note: "*I need cash* یه جملهٔ ساده برای گفتن نیازه؛ در انگلیسی فعل *need* بعد از فاعل میاد."}
  en.a1.unit59.lesson02.teach.where_is_the_atm: {title: "پرسیدن جای خودپرداز", gloss: "دستگاه خودپرداز کجاست؟", note: "*Where is ...?* برای پرسیدن مکان چیزی به کار می‌ره."}
  en.a1.unit59.lesson02.teach.check_my_balance: {title: "گفتن قصد بررسی موجودی", gloss: "می‌خوام موجودیمو بررسی کنم.", note: "*I want to check ...* یعنی می‌خوام چیزی رو بررسی کنم یا ببینم."}
  en.a1.unit59.lesson02.teach.can_i_use_this_card: {title: "پرسیدن دربارهٔ استفاده از کارت", gloss: "می‌تونم از این کارت استفاده کنم؟", note: "*Can I use ...?* برای پرسیدن اجازه یا امکان استفاده از چیزیه."}
  en.a1.unit59.lesson02.teach.enter_your_pin: {title: "درخواست وارد کردن رمز", gloss: "لطفاً رمز کارت‌تون رو وارد کنین.", note: "*PIN* یعنی رمز کوتاه کارت بانکی. در انگلیسی معمولاً با حروف بزرگ نوشته می‌شه."}
  en.a1.unit59.lesson02.teach.atm_outside: {title: "گفتن جای خودپرداز", gloss: "دستگاه خودپرداز بیرونه.", note: "*outside* یعنی بیرون؛ در این جمله جای دستگاه رو مشخص می‌کنه."}

  en.a1.unit59.lesson03.teach.dialogue_line1: {title: "سؤال میا", gloss: "میا می‌گه: سلام! دستگاه خودپرداز کجاست؟", note: "میا گفتگو رو با سلام و پرسیدن جای خودپرداز شروع می‌کنه."}
  en.a1.unit59.lesson03.teach.dialogue_line2: {title: "پاسخ کارمند", gloss: "کارمند می‌گه: دستگاه خودپرداز بیرونه.", note: "کارمند با *outside* مکان دستگاه رو مشخص می‌کنه."}
  en.a1.unit59.lesson03.teach.dialogue_line3: {title: "سؤال لیلا", gloss: "لیلا می‌پرسه: می‌تونم از این کارت استفاده کنم؟", note: "لیلا با *Can I ...?* دربارهٔ امکان استفاده از کارت سؤال می‌کنه."}
  en.a1.unit59.lesson03.teach.dialogue_line4: {title: "پاسخ دربارهٔ کارت", gloss: "کارمند می‌گه: بله، می‌تونین از اون کارت استفاده کنین.", note: "*that card* یعنی اون کارت؛ کارمند به کارت لیلا اشاره می‌کنه."}
  en.a1.unit59.lesson03.teach.dialogue_line5: {title: "درخواست میا", gloss: "میا می‌گه: می‌خوام موجودیمو بررسی کنم.", note: "*my balance* یعنی موجودی حساب من."}
  en.a1.unit59.lesson03.teach.dialogue_line6: {title: "دستور کارمند", gloss: "کارمند می‌گه: لطفاً رمز کارت‌تون رو وارد کنین.", note: "*Please enter ...* یه دستور مؤدبانه برای وارد کردن اطلاعاته."}
  en.a1.unit59.lesson03.teach.dialogue_line7: {title: "نیاز لیلا", gloss: "لیلا می‌گه: من هم پول نقد لازم دارم.", note: "*too* یعنی هم؛ لیلا می‌گه اونم پول نقد لازم داره."}
  en.a1.unit59.lesson03.teach.dialogue_line8: {title: "مبلغ برداشت", gloss: "کارمند می‌گه: می‌تونین بیست دلار برداشت کنین.", note: "*take out* در کارهای بانکی یعنی برداشت کردن پول."}
  en.a1.unit59.lesson03.teach.dialogue_line9: {title: "تشکر میا", gloss: "میا می‌گه: ممنون! این مفیده.", note: "*This is helpful* یعنی این کمک‌کننده یا مفیده."}

  en.a1.unit59.lesson04.teach.bank_notice: {title: "متن: اطلاعیهٔ بانک", gloss: "اطلاعیهٔ بانک: باز از ۹:۰۰ تا ۴:۰۰. دستگاه خودپرداز بیرونه. سقف برداشت نقدی امروز: ۱۰۰ دلار. کارت‌ها پذیرفته می‌شن.", note: "این اطلاعیه ساعت کار، جای خودپرداز، سقف برداشت، و پذیرفته شدن کارت‌ها رو نشون می‌ده."}
  en.a1.unit59.lesson04.teach.reading_passage: {title: "متن: توقفی کوتاه در بانک", gloss: "توقفی کوتاه در بانک: یه روز صبح، میا و لیلا با هم به بانک رفتن. میا می‌خواست موجودیشو بررسی کنه، و لیلا پول نقد لازم داشت. کارمند گفت دستگاه خودپرداز بیرونه. لیلا از کارت خودش استفاده کرد و بیست دلار برداشت کرد. میا رمز کارت خودش رو وارد کرد و موجودیشو بررسی کرد. قبل از رفتن، اطلاعیه رو خوندن. بانک از ۹:۰۰ تا ۴:۰۰ باز بود، و سقف برداشت نقدی ۱۰۰ دلار بود. میا گفت این مراجعه آسون بود.", note: "این متن همون موقعیت بانکی رو با جزئیات بیشتر روایت می‌کنه."}

