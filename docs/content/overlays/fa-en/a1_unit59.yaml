teaching:
  en.a1.unit59.lesson01.teach.bank: {title: "bank", gloss: "بانک", note: "*bank* یعنی جایی که پول را نگه می‌دارند و کارهای مالی انجام می‌دهند.", example_gloss: "بانک نزدیک اینجاست."}
  en.a1.unit59.lesson01.teach.account: {title: "account", gloss: "حساب", note: "*account* یعنی حساب بانکی؛ یعنی پرونده و سابقهٔ پول شما در بانک.", example_gloss: "من حساب بانکی دارم."}
  en.a1.unit59.lesson01.teach.card: {title: "card", gloss: "کارت", note: "*card* در این درس یعنی کارت بانکی یا کارت پرداخت.", example_gloss: "این کارت اینجا کار می‌کند."}
  en.a1.unit59.lesson01.teach.cash: {title: "cash", gloss: "پول نقد", note: "*cash* یعنی پول نقد، مثل اسکناس و سکه.", example_gloss: "من پول نقد لازم دارم."}
  en.a1.unit59.lesson01.teach.atm: {title: "ATM", gloss: "دستگاه خودپرداز", note: "*ATM* یعنی دستگاهی که با کارت از آن پول نقد می‌گیرید.", example_gloss: "دستگاه خودپرداز بیرون است."}
  en.a1.unit59.lesson01.teach.balance: {title: "balance", gloss: "موجودی", note: "*balance* یعنی مقدار پولی که در حساب شما مانده است.", example_gloss: "می‌خواهم موجودی‌ام را بررسی کنم."}

  en.a1.unit59.lesson02.teach.i_need_cash: {title: "گفتن نیاز به پول نقد", gloss: "من پول نقد لازم دارم.", note: "*I need cash* یک جملهٔ ساده برای گفتن نیاز است؛ در انگلیسی فعل *need* بعد از فاعل می‌آید."}
  en.a1.unit59.lesson02.teach.where_is_the_atm: {title: "پرسیدن جای خودپرداز", gloss: "دستگاه خودپرداز کجاست؟", note: "*Where is ...?* برای پرسیدن مکان چیزی به کار می‌رود."}
  en.a1.unit59.lesson02.teach.check_my_balance: {title: "گفتن قصد بررسی موجودی", gloss: "می‌خواهم موجودی‌ام را بررسی کنم.", note: "*I want to check ...* یعنی می‌خواهم چیزی را بررسی کنم یا ببینم."}
  en.a1.unit59.lesson02.teach.can_i_use_this_card: {title: "پرسیدن دربارهٔ استفاده از کارت", gloss: "می‌توانم از این کارت استفاده کنم؟", note: "*Can I use ...?* برای پرسیدن اجازه یا امکان استفاده از چیزی است."}
  en.a1.unit59.lesson02.teach.enter_your_pin: {title: "درخواست وارد کردن رمز", gloss: "لطفاً رمز کارت خود را وارد کنید.", note: "*PIN* یعنی رمز کوتاه کارت بانکی. در انگلیسی معمولاً با حروف بزرگ نوشته می‌شود."}
  en.a1.unit59.lesson02.teach.atm_outside: {title: "گفتن جای خودپرداز", gloss: "دستگاه خودپرداز بیرون است.", note: "*outside* یعنی بیرون؛ در این جمله جای دستگاه را مشخص می‌کند."}

  en.a1.unit59.lesson03.teach.dialogue_line1: {title: "سؤال میا", gloss: "میا می‌گوید: سلام! دستگاه خودپرداز کجاست؟", note: "میا گفتگو را با سلام و پرسیدن جای خودپرداز شروع می‌کند."}
  en.a1.unit59.lesson03.teach.dialogue_line2: {title: "پاسخ کارمند", gloss: "کارمند می‌گوید: دستگاه خودپرداز بیرون است.", note: "کارمند با *outside* مکان دستگاه را مشخص می‌کند."}
  en.a1.unit59.lesson03.teach.dialogue_line3: {title: "سؤال لیلا", gloss: "لیلا می‌پرسد: می‌توانم از این کارت استفاده کنم؟", note: "لیلا با *Can I ...?* دربارهٔ امکان استفاده از کارت سؤال می‌کند."}
  en.a1.unit59.lesson03.teach.dialogue_line4: {title: "پاسخ دربارهٔ کارت", gloss: "کارمند می‌گوید: بله، می‌توانید از آن کارت استفاده کنید.", note: "*that card* یعنی آن کارت؛ کارمند به کارت لیلا اشاره می‌کند."}
  en.a1.unit59.lesson03.teach.dialogue_line5: {title: "درخواست میا", gloss: "میا می‌گوید: می‌خواهم موجودی‌ام را بررسی کنم.", note: "*my balance* یعنی موجودی حساب من."}
  en.a1.unit59.lesson03.teach.dialogue_line6: {title: "دستور کارمند", gloss: "کارمند می‌گوید: لطفاً رمز کارت خود را وارد کنید.", note: "*Please enter ...* یک دستور مؤدبانه برای وارد کردن اطلاعات است."}
  en.a1.unit59.lesson03.teach.dialogue_line7: {title: "نیاز لیلا", gloss: "لیلا می‌گوید: من هم پول نقد لازم دارم.", note: "*too* یعنی هم؛ لیلا می‌گوید او هم پول نقد لازم دارد."}
  en.a1.unit59.lesson03.teach.dialogue_line8: {title: "مبلغ برداشت", gloss: "کارمند می‌گوید: می‌توانید بیست دلار برداشت کنید.", note: "*take out* در کارهای بانکی یعنی برداشت کردن پول."}
  en.a1.unit59.lesson03.teach.dialogue_line9: {title: "تشکر میا", gloss: "میا می‌گوید: ممنون! این مفید است.", note: "*This is helpful* یعنی این کمک‌کننده یا مفید است."}

  en.a1.unit59.lesson04.teach.bank_notice: {title: "متن: اطلاعیهٔ بانک", gloss: "اطلاعیهٔ بانک: باز از ۹:۰۰ تا ۴:۰۰. دستگاه خودپرداز بیرون است. سقف برداشت نقدی امروز: ۱۰۰ دلار. کارت‌ها پذیرفته می‌شوند.", note: "این اطلاعیه ساعت کار، جای خودپرداز، سقف برداشت، و پذیرفته شدن کارت‌ها را نشان می‌دهد."}
  en.a1.unit59.lesson04.teach.reading_passage: {title: "متن: توقفی کوتاه در بانک", gloss: "توقفی کوتاه در بانک: یک روز صبح، میا و لیلا با هم به بانک رفتند. میا می‌خواست موجودی‌اش را بررسی کند، و لیلا پول نقد لازم داشت. کارمند گفت دستگاه خودپرداز بیرون است. لیلا از کارت خود استفاده کرد و بیست دلار برداشت کرد. میا رمز کارت خود را وارد کرد و موجودی‌اش را بررسی کرد. قبل از رفتن، اطلاعیه را خواندند. بانک از ۹:۰۰ تا ۴:۰۰ باز بود، و سقف برداشت نقدی ۱۰۰ دلار بود. میا گفت این مراجعه آسان بود.", note: "این متن همان موقعیت بانکی را با جزئیات بیشتر روایت می‌کند."}

exercises:
  en.a1.unit59.lesson01.exercise01.listen_word:
    instruction: "گوش کنید و کلمه‌ای را که گفته شد انتخاب کنید."
    correct_option: "cash"
    distractors: ["receipt", "wallet", "coin", "loan"]
    accepted_answers: [{value: "cash", status: "correct"}]
    feedback: "*cash* یعنی پول نقد."
  en.a1.unit59.lesson01.exercise02.choose_atm_meaning:
    instruction: "کدام کلمه یعنی دستگاهی که از آن پول نقد می‌گیرید؟"
    correct_option: "ATM"
    distractors: ["bank", "account", "balance"]
    accepted_answers: [{value: "ATM", status: "correct"}]
    feedback: "*ATM* یعنی دستگاه خودپرداز."
  en.a1.unit59.lesson01.exercise03.match_banking_words:
    instruction: "هر توضیح انگلیسی را به کلمهٔ درست وصل کنید."
    accepted_answers: [{value: [{left: "a place that keeps money", right: "bank"}, {left: "your money record at a bank", right: "account"}, {left: "a small plastic payment item", right: "card"}, {left: "paper money and coins", right: "cash"}, {left: "a machine where you can get cash", right: "ATM"}, {left: "the money in your account", right: "balance"}], status: "correct"}]
    feedback: "bank=بانک، account=حساب، card=کارت، cash=پول نقد، ATM=خودپرداز، balance=موجودی."
  en.a1.unit59.lesson01.exercise04.order_cash_sentence:
    instruction: "کلمات را به ترتیب درست بچینید."
    accepted_answers: [{value: ["I", "need", "cash."], status: "correct"}]
    feedback: "ترتیب درست: *I need cash.*"
  en.a1.unit59.lesson01.exercise05.write_balance:
    instruction: "کلمه‌ای را بنویسید که یعنی پول موجود در حساب شما."
    accepted_answers: [{value: "balance", status: "correct"}]
    feedback: "*balance* یعنی موجودی."

  en.a1.unit59.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنید و عبارتی را که شنیدید انتخاب کنید."
    correct_option: "I want to check my balance."
    distractors: ["I want to open an account.", "I want to pay this bill.", "I want to change my address."]
    accepted_answers: [{value: "I want to check my balance.", status: "correct"}]
    feedback: "*I want to check my balance* یعنی می‌خواهم موجودی‌ام را بررسی کنم."
  en.a1.unit59.lesson02.exercise02.choose_atm_question:
    instruction: "کدام عبارت جای دستگاه خودپرداز را می‌پرسد؟"
    correct_option: "Where is the ATM?"
    distractors: ["I need cash.", "Can I use this card?", "Please enter your PIN."]
    accepted_answers: [{value: "Where is the ATM?", status: "correct"}]
    feedback: "*Where is the ATM?* یعنی دستگاه خودپرداز کجاست؟"
  en.a1.unit59.lesson02.exercise03.choose_card_question:
    instruction: "کدام عبارت می‌پرسد آیا این کارت اینجا کار می‌کند؟"
    correct_option: "Can I use this card?"
    distractors: ["Where is the ATM?", "I want to check my balance.", "The ATM is outside."]
    accepted_answers: [{value: "Can I use this card?", status: "correct"}]
    feedback: "*Can I use this card?* یعنی می‌توانم از این کارت استفاده کنم؟"
  en.a1.unit59.lesson02.exercise04.order_atm_sentence:
    instruction: "کلمات را به ترتیب درست بچینید."
    accepted_answers: [{value: ["The", "ATM", "is", "outside."], status: "correct"}]
    feedback: "ترتیب درست: *The ATM is outside.*"
  en.a1.unit59.lesson02.exercise05.translate_need_cash:
    instruction: "ترجمه کنید: «من پول نقد لازم دارم.»"
    accepted_answers: [{value: "I need cash.", status: "correct"}, {value: "I need cash", status: "correct"}]
    feedback: "*I need cash* یعنی من پول نقد لازم دارم."

  en.a1.unit59.lesson03.exercise01.comprehension_atm_place:
    instruction: "طبق گفتگو، دستگاه خودپرداز کجاست؟"
    correct_option: "outside"
    distractors: ["inside", "near the door", "at home"]
    accepted_answers: [{value: "outside", status: "correct"}]
    feedback: "کارمند می‌گوید دستگاه خودپرداز بیرون است."
  en.a1.unit59.lesson03.exercise02.comprehension_cash_amount:
    instruction: "طبق گفتگو، لیلا چقدر پول نقد می‌تواند برداشت کند؟"
    correct_option: "twenty dollars"
    distractors: ["ten dollars", "fifty dollars", "one hundred dollars"]
    accepted_answers: [{value: "twenty dollars", status: "correct"}]
    feedback: "کارمند می‌گوید لیلا می‌تواند بیست دلار برداشت کند."
  en.a1.unit59.lesson03.exercise03.listen_dialogue_pin:
    instruction: "طبق گفتگو، کارمند از میا می‌خواهد چه چیزی را وارد کند؟"
    correct_option: "Please enter your PIN."
    distractors: ["Please sign your name.", "Please show your passport.", "Please open the door."]
    accepted_answers: [{value: "Please enter your PIN.", status: "correct"}]
    feedback: "کارمند می‌گوید: *Please enter your PIN.*"
  en.a1.unit59.lesson03.exercise04.respond_own_bank_statement:
    instruction: "بگویید دستگاه خودپرداز کجاست، بخواهید موجودی‌تان را بررسی کنید، یا بگویید پول نقد لازم دارید."
    accepted_answers: ["The ATM is outside", "The ATM is outside.", "I want to check my balance", "I want to check my balance.", "Please enter your PIN", "Please enter your PIN.", "I need cash", "I need cash."]
    feedback: "می‌توانید بگویید *The ATM is outside* یا *I need cash*."

  en.a1.unit59.lesson04.exercise01.notice_opening_time:
    instruction: "طبق اطلاعیه، بانک چه ساعتی باز می‌شود؟"
    correct_option: "9:00"
    distractors: ["4:00", "10:00", "12:00"]
    accepted_answers: [{value: "9:00", status: "correct"}]
    feedback: "اطلاعیه می‌گوید بانک از ساعت ۹:۰۰ باز است."
  en.a1.unit59.lesson04.exercise02.notice_cash_limit:
    instruction: "طبق اطلاعیه، سقف برداشت نقدی امروز چقدر است؟"
    correct_option: "$100"
    distractors: ["$20", "$50", "$200"]
    accepted_answers: [{value: "$100", status: "correct"}]
    feedback: "در اطلاعیه آمده است که سقف برداشت نقدی امروز ۱۰۰ دلار است."
  en.a1.unit59.lesson04.exercise03.reading_cash_amount:
    instruction: "طبق متن، لیلا چقدر پول نقد برداشت کرد؟"
    correct_option: "twenty dollars"
    distractors: ["ten dollars", "fifty dollars", "one hundred dollars"]
    accepted_answers: [{value: "twenty dollars", status: "correct"}]
    feedback: "متن می‌گوید لیلا بیست دلار برداشت کرد."
  en.a1.unit59.lesson04.exercise04.reading_who_checked_balance:
    instruction: "طبق متن، چه کسی موجودی حسابش را بررسی کرد؟"
    correct_option: "Mia"
    distractors: ["Leila", "the clerk", "Daniel"]
    accepted_answers: [{value: "Mia", status: "correct"}]
    feedback: "متن می‌گوید میا موجودی حسابش را بررسی کرد."
  en.a1.unit59.lesson04.exercise05.write_own_bank_message:
    instruction: "یک پیام کوتاه بنویسید: بگویید دستگاه خودپرداز کجاست و سقف برداشت نقدی چقدر است."
    accepted_answers: ["The ATM is outside. The cash limit is $100.", "The ATM is outside, and the cash limit is $100.", "The ATM is outside and the cash limit is $100."]
    feedback: "می‌توانید بنویسید: *The ATM is outside. The cash limit is $100.*"
