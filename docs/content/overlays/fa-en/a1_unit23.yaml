    instruction: "لیلا می‌پرسه: دنیل، شغلت چیه؟ هر روز چی کار می‌کنی؟ از کارت خوشت میاد؟"
    accepted_answers:
      - {value: "I'm an engineer. I work at a small company downtown. I write reports and answer emails. Sometimes I meet with clients. Yes, I do. It's interesting work.", status: "correct"}
    feedback: "جواب کامل شغل، محل کار، فعالیت روزانه، و رضایت شغلی را با هم بیان می‌کنه -- چند لحظهٔ جدا از گفتگو."
  en.a1.unit23.lesson04.exercise06.speak_work_dialogue:
    instruction: "به نقش دنیل، آواز‌دار به لیلا جواب بدین."
    accepted_answers:
      - {value: "I'm an engineer. I work at a small company downtown. I write reports and answer emails. Sometimes I meet with clients. Yes, I do. It's interesting work.", status: "correct"}
    feedback: "جواب کامل هر سه بخش گفتگو را پوشش می‌ده: شغل و محل کار، فعالیت روزانه، و رضایت شغلی."
