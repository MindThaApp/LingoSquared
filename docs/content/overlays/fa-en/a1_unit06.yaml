  en.a1.unit06.lesson04.teach.a_no_one_sister: {title: "پاسخ منفی", gloss: "دنیل می‌گه نه، فقط یک خواهر دارم", note: "I just have one sister؛ just اینجا به‌معنای «فقط» تأکید می‌کنه که فرزند دیگری نیست."}

exercises:
  en.a1.unit06.lesson01.exercise01.listen_mother:
    instruction: "گوش کنین و واژهٔ گفته‌شده را انتخاب کنین."
    correct_option: "مادر"
    distractors: ["پدر", "برادر", "خواهر"]
    accepted_answers: [{value: "مادر", status: "correct"}]
    feedback: "mother یعنی مادر."
  en.a1.unit06.lesson01.exercise02.choose_brother:
    instruction: "واژهٔ درست برای «برادر» را انتخاب کنین."
    correct_option: "brother"
    distractors: ["sister", "father", "cousin"]
    accepted_answers: [{value: "brother", status: "correct"}]
    feedback: "brother یعنی برادر."
  en.a1.unit06.lesson01.exercise03.choose_parents:
    instruction: "واژهٔ درست برای «پدر و مادر با هم» را انتخاب کنین."
    correct_option: "parents"
    distractors: ["siblings", "cousins", "grandparents"]
    accepted_answers: [{value: "parents", status: "correct"}]
    feedback: "parents یعنی پدر و مادر با هم."
  en.a1.unit06.lesson01.exercise04.match_family_words:
    instruction: "هر تعریف را به واژهٔ انگلیسی درست وصل کنین."
    accepted_answers:
      - value:
          - {left: "female parent", right: "mother"}
          - {left: "male parent", right: "father"}
          - {left: "male sibling", right: "brother"}
          - {left: "female sibling", right: "sister"}
          - {left: "mother and father together", right: "parents"}
          - {left: "brother and sister", right: "siblings"}
          - {left: "your mother's sister", right: "aunt"}
          - {left: "your mother's or father's mother", right: "grandmother"}
          - {left: "your mother's or father's father", right: "grandfather"}
          - {left: "your father's brother", right: "uncle"}
        status: "correct"
    feedback: "هر تعریف به یک واژه یا عبارت انگلیسی اشاره می‌کنه."
  en.a1.unit06.lesson01.exercise05.write_siblings:
    instruction: "واژهٔ انگلیسی «خواهر و برادرها با هم» را بنویسین."
    accepted_answers:
      - {value: "siblings", status: "correct"}
      - {value: "Siblings", status: "correct"}
    feedback: "siblings یعنی خواهر و برادرها با هم."

  en.a1.unit06.lesson02.exercise01.listen_extended:
    instruction: "گوش کنین و واژهٔ گفته‌شده را انتخاب کنین."
    correct_option: "مادربزرگ"
    distractors: ["پدربزرگ", "عمه/خاله", "عمو/دایی"]
    accepted_answers: [{value: "مادربزرگ", status: "correct"}]
    feedback: "grandmother یعنی مادربزرگ."
  en.a1.unit06.lesson02.exercise02.choose_aunt:
    instruction: "واژهٔ درست برای «خواهر مادر» را انتخاب کنین."
    correct_option: "aunt"
    distractors: ["uncle", "cousin", "grandmother"]
    accepted_answers: [{value: "aunt", status: "correct"}]
    feedback: "aunt هم برای خاله و هم عمه به‌کار می‌ره؛ انگلیسی این دو را از هم جدا نمی‌کنه."
  en.a1.unit06.lesson02.exercise03.choose_his:
    instruction: "دنیل یک مرد است. برای کامل‌کردن «This is _ sister.» ضمیر درست را انتخاب کنین."
    correct_option: "his"
    distractors: ["her", "your", "my"]
    accepted_answers: [{value: "his", status: "correct"}]
    feedback: "چون گفته شده دنیل مرد است، his پاسخ درست است."
  en.a1.unit06.lesson02.exercise04.choose_her:
    instruction: "لیلا یک زن است. برای کامل‌کردن «This is _ brother.» ضمیر درست را انتخاب کنین."
    correct_option: "her"
    distractors: ["his", "your", "my"]
    accepted_answers: [{value: "her", status: "correct"}]
    feedback: "چون گفته شده لیلا زن است، her پاسخ درست است."
  en.a1.unit06.lesson02.exercise05.order_your_father:
    instruction: "واژه‌ها را برای گفتن «پدر تو» مرتب کنین."
    accepted_answers: [{value: ["your", "father"], status: "correct"}]
    feedback: "ترتیب درست your father است."
  en.a1.unit06.lesson02.exercise06.write_cousin:
    instruction: "واژهٔ انگلیسی برای «فرزند عمه/عمو/دایی/خاله» را بنویسین."
    accepted_answers:
      - {value: "cousin", status: "correct"}
      - {value: "Cousin", status: "correct"}
    feedback: "cousin واژهٔ واحدی برای همهٔ این نسبت‌هاست."

  en.a1.unit06.lesson03.exercise01.choose_this_is:
    instruction: "جملهٔ درست برای معرفی خواهرتان در عکس را انتخاب کنین."
    correct_option: "This is my sister."
    distractors: ["This is my brother.", "This is my mother.", "I have two brothers."]
    accepted_answers: [{value: "This is my sister.", status: "correct"}]
    feedback: "This is my sister یعنی «این خواهرمه»."
  en.a1.unit06.lesson03.exercise02.order_have_siblings:
    instruction: "واژه‌ها را برای پرسیدن «خواهر یا برادر داری؟» مرتب کنین."
    accepted_answers: [{value: ["Do", "you", "have", "any", "siblings"], status: "correct"}]
    feedback: "ترتیب درست Do you have any siblings? است."
  en.a1.unit06.lesson03.exercise03.reply_siblings:
    instruction: "پاسخ بدین که دو برادر دارین."
    accepted_answers:
      - {value: "I have two brothers.", status: "correct"}
      - {value: "Yes, I have two brothers.", status: "correct"}
    feedback: "I have two brothers یعنی «دو تا برادر دارم»."
  en.a1.unit06.lesson03.exercise04.reply_only_child:
    instruction: "پاسخ بدین که خواهر یا برادر ندارین و تک‌فرزند هستین."
    accepted_answers:
      - {value: "No, I don't. I'm an only child.", status: "correct"}
      - {value: "No, I don't, and I'm an only child.", status: "correct"}
    feedback: "I'm an only child یعنی «تک‌فرزندم»."
  en.a1.unit06.lesson03.exercise05.write_sister_age:
    instruction: "بنویسین خواهرتان بیست ساله است."
    accepted_answers:
      - {value: "She's twenty years old.", status: "correct"}
      - {value: "She's twenty years old", status: "correct"}
      - {value: "She is twenty years old.", status: "correct"}
    feedback: "She's twenty years old یعنی «او بیست سالشه»."

  en.a1.unit06.lesson04.exercise01.listen_parents:
    instruction: "گفت‌وگو را گوش کنین و مشخص کنین دنیل چه کسانی را معرفی می‌کنه."
    correct_option: "مادر و پدرش"
    distractors: ["خواهر و برادرش", "عمه و عموش", "مادربزرگ و پدربزرگش"]
    accepted_answers: [{value: "مادر و پدرش", status: "correct"}]
    feedback: "دنیل می‌گه This is my mother and this is my father."
  en.a1.unit06.lesson04.exercise02.listen_sister_job:
    instruction: "گوش کنین و مشخص کنین شغل خواهر دنیل چیست."
    correct_option: "معلم"
    distractors: ["دانشجو", "مهندس", "کارمند کتابخانه"]
    accepted_answers: [{value: "معلم", status: "correct"}]
    feedback: "دنیل می‌گه She's a teacher."
  en.a1.unit06.lesson04.exercise03.choose_brothers_answer:
    instruction: "پاسخ درست دنیل به پرسش دربارهٔ برادر داشتن را انتخاب کنین."
    correct_option: "No, I don't. I just have one sister."
    distractors: ["Yes, I have two brothers.", "This is my father.", "She's a teacher."]
    accepted_answers: [{value: "No, I don't. I just have one sister.", status: "correct"}]
    feedback: "دنیل می‌گه فقط یک خواهر داره، برادر نداره."
  en.a1.unit06.lesson04.exercise04.order_who_question:
    instruction: "واژه‌ها را برای پرسیدن «این کیه؟» مرتب کنین."
    accepted_answers: [{value: ["Who", "is", "this"], status: "correct"}]
    feedback: "ترتیب درست Who is this? است."
  en.a1.unit06.lesson04.exercise05.reply_as_daniel:
    instruction: "در نقش دنیل، والدین و خواهرتان را معرفی کنین."
    accepted_answers:
      - {value: "This is my mother and this is my father. This is my sister. She's a teacher.", status: "correct"}
      - {value: "This is my mother, and this is my father. This is my sister. She's a teacher.", status: "correct"}
    feedback: "پاسخ کامل هر سه نفر خانواده را معرفی می‌کنه."
  en.a1.unit06.lesson04.exercise06.speak_family:
    instruction: "در نقش دنیل، با صدای بلند دربارهٔ خانواده‌تان توضیح بدین."
    accepted_answers:
      - {value: "This is my mother and this is my father. This is my sister. She's a teacher. No, I don't. I just have one sister.", status: "correct"}
      - {value: "This is my mother, and this is my father. This is my sister. She's a teacher. No, I don't. I just have one sister.", status: "correct"}
    feedback: "پاسخ کامل معرفی خانواده و پاسخ به پرسش برادر را پوشش می‌ده."
