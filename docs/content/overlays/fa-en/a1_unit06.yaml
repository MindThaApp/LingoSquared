  en.a1.unit06.lesson01.teach.sister: {title: "خواهر", gloss: "خواهر", note: "sister یعنی خواهر.", example_gloss: "این خواهر من است."}
  en.a1.unit06.lesson01.teach.parents: {title: "والدین", gloss: "والدین/پدر و مادر", note: "parents یعنی پدر و مادر با هم؛ همیشه جمع است.", example_gloss: "اینها والدین من هستن."}
