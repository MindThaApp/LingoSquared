  en.a1.unit06.lesson02.teach.my_mother: {title: "مادرم", gloss: "مادر من", note: "my پیش از اسم نسبت، مالکیت را نشان می‌ده."}
  en.a1.unit06.lesson02.teach.your_father: {title: "پدرت", gloss: "پدر تو/شما", note: "your هم برای «تو» و هم «شما» به‌کار می‌ره؛ در انگلیسی تمایز رسمی/غیررسمی در ضمیر دوم شخص وجود نداره."}
  en.a1.unit06.lesson02.teach.his_sister: {title: "خواهرش (مرد)", gloss: "خواهر او (مرد)", note: "his برای مالک مذکر به‌کار می‌ره."}
  en.a1.unit06.lesson02.teach.her_brother: {title: "برادرش (زن)", gloss: "برادر او (زن)", note: "her برای مالک مؤنث به‌کار می‌ره."}

  en.a1.unit06.lesson03.teach.this_is_my_sister: {title: "این خواهرمه", gloss: "این خواهر من است", note: "This is my sister برای معرفی یک نفر در عکس یا حضوری به‌کار می‌ره."}
  en.a1.unit06.lesson03.teach.she_is_20: {title: "بیست سالشه", gloss: "او بیست سالشه", note: "برای گفتن سن دیگران هم مثل خودمان از فعل be استفاده می‌شه (She's)."}
  en.a1.unit06.lesson03.teach.i_have_two_brothers: {title: "دو تا برادر دارم", gloss: "دو تا برادر دارم", note: "I have برای گفتن تعداد خواهر و برادر به‌کار می‌ره، مثل فعل «داشتن» در فارسی."}
  en.a1.unit06.lesson03.teach.do_you_have_siblings: {title: "خواهر یا برادر داری؟", gloss: "خواهر یا برادر داری/دارین؟", note: "Do you have any siblings؟ پرسش عمومی دربارهٔ وجود خواهر/برادر است."}
  en.a1.unit06.lesson03.teach.no_i_dont: {title: "نه، ندارم. تک‌فرزندم", gloss: "نه، ندارم. تک‌فرزندم", note: "an only child یعنی تک‌فرزند (کسی که خواهر یا برادر نداره)."}

  en.a1.unit06.lesson04.teach.photo: {title: "عکس", gloss: "عکس", note: "photo یعنی عکس.", example_gloss: "من یک عکس دارم."}
