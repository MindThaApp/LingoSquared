  en.a1.unit06.lesson02.teach.aunt: {title: "عمه/خاله", gloss: "عمه یا خاله", note: "در انگلیسی aunt هم برای عمه (خواهر پدر) و هم خاله (خواهر مادر) به‌کار می‌ره؛ برخلاف فارسی، این تمایز وجود نداره.", example_gloss: "این عمه/خالهٔ من است."}
  en.a1.unit06.lesson02.teach.uncle: {title: "عمو/دایی", gloss: "عمو یا دایی", note: "uncle هم برای عمو (برادر پدر) و هم دایی (برادر مادر) به‌کار می‌ره؛ همان‌طور که در aunt هم تمایز فارسی حذف می‌شه.", example_gloss: "این عمو/داییِ من است."}
