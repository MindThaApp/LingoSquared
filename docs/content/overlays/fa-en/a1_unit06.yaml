  en.a1.unit06.lesson04.teach.a_parents: {title: "معرفی والدین", gloss: "دنیل مادر و پدرش را معرفی می‌کنه", note: "This is my mother and this is my father؛ هر عضو خانواده جداگانه با This is معرفی می‌شه."}
  en.a1.unit06.lesson04.teach.q_who: {title: "پرسیدن هویت", gloss: "لیلا می‌پرسه این کیه؟", note: "Who is this؟ برای پرسیدن هویت فرد بعدی در عکس به‌کار می‌ره."}
  en.a1.unit06.lesson04.teach.a_sister_teacher: {title: "معرفی خواهر", gloss: "دنیل می‌گه این خواهرمه، معلمه", note: "She's a teacher شغل خواهر دنیل را بیان می‌کنه."}
