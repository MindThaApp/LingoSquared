review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit52 (getting a haircut). Authored fully at schema_version 1.1, every kind: vocabulary teaching card has a matching example_gloss:. Contrastive-grammar points for this unit: (1) causative 'make it a little shorter' -- English make + object + adjective is a single compact causative construction ('cause it to become shorter'), while Farsi needs a dedicated verb for the same idea (کوتاه‌ترش کن) rather than a generic 'make' + adjective pattern -- flagged on that phrase card so the learner doesn't try to build a word-for-word Farsi calque. (2) 'I'd like a haircut, please' -- the contracted conditional 'd like (would like) is the standard polite request form in English, distinct from a bare present-tense want; Farsi's closest everyday equivalent uses the simple present or an imperfective past for politeness (می‌خوام / می‌خواستم), not a separate conditional auxiliary -- flagged on that phrase card. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, not translated Farsi lefts, per the established fa-en convention. Every listen_select/multiple_choice distractor in lesson03/lesson04 is an invented value never stated elsewhere in this unit (invented reasons, invented prices) -- checked the dialogue's own lines (Hairdresser: 4 lines; Daniel: 'I'd like a haircut, please. My sister is visiting next week.', 'The same style, just a little shorter.', 'Great. How much is it?'; Mia: 'Can you wash his hair first?') to confirm no distractor reuses a fact the tested speaker states elsewhere in the same audio. Strong sibling-isolation rule applied -- nl-en/prs-en overlays and the concurrent units 39-48 dispatch were not consulted. Needs the mandatory fresh-context review before shipping, and inherits the underlying realization's own still-unreviewed status."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit52.personal_care: {title: "کوتاه کردن مو"}

lessons:
  en.a1.unit52.lesson01.personal_care_vocabulary: {title: "کلمات آرایشگاه"}
  en.a1.unit52.lesson02.phrases_at_the_hairdresser: {title: "عبارت‌های آرایشگاه"}
  en.a1.unit52.lesson03.dialogue_at_the_hairdresser: {title: "گفتگو: در آرایشگاه"}
  en.a1.unit52.lesson04.a_trip_to_the_hairdresser: {title: "متن: رفتن به آرایشگاه"}

teaching:
  en.a1.unit52.lesson01.teach.haircut: {title: "haircut", gloss: "کوتاه کردن مو", note: "*haircut* یعنی کوتاه کردن مو.", example_gloss: "یه کوتاهی مو لازم دارم."}
  en.a1.unit52.lesson01.teach.hairdresser: {title: "hairdresser", gloss: "آرایشگر", note: "*hairdresser* یعنی کسی که مو رو می‌بره و درست می‌کنه.", example_gloss: "آرایشگر خیلی مهربونه."}
  en.a1.unit52.lesson01.teach.trim: {title: "trim", gloss: "کمی کوتاه کردن", note: "*trim* یعنی فقط یه مقدار کم از نوک موها کوتاه کردن.", example_gloss: "من فقط یه کمی کوتاهی می‌خوام."}
  en.a1.unit52.lesson01.teach.shorter: {title: "shorter", gloss: "کوتاه‌تر", note: "*shorter* یعنی کوتاه‌تر از قبل. *Can you make it shorter?* یعنی می‌تونی کوتاه‌ترش کنی؟", example_gloss: "می‌تونی کوتاه‌ترش کنی؟"}
  en.a1.unit52.lesson01.teach.style: {title: "style", gloss: "مدل مو", note: "*style* یعنی مدلی که موها رو می‌برن یا شکل می‌دن.", example_gloss: "این مدل رو دوست دارم."}
  en.a1.unit52.lesson01.teach.wash: {title: "wash", gloss: "شستن", note: "*wash* یعنی شستن، اینجا برای مو.", example_gloss: "اول، اون موهاتون رو می‌شوره."}

  en.a1.unit52.lesson02.teach.id_like_a_haircut: {title: "I'd like a haircut, please.", gloss: "یه کوتاهی مو می‌خوام، لطفاً.", note: "*I'd like* مخفف *I would like*ه -- یه فرم مؤدبانهٔ استاندارد برای درخواست کردنه، نه فقط زمان حال ساده. فارسی معمولاً همین معنی رو با زمان حال ساده یا گذشتهٔ استمراری می‌رسونه (می‌خوام / می‌خواستم)، بدون یه فعل کمکی جداگونهٔ «شرطی»."}
  en.a1.unit52.lesson02.teach.just_a_trim: {title: "Just a trim, please.", gloss: "فقط یه کمی کوتاهی، لطفاً."}
  en.a1.unit52.lesson02.teach.can_you_make_it_a_little_shorter: {title: "Can you make it a little shorter?", gloss: "می‌تونی یه کمی کوتاه‌ترش کنی؟", note: "*make it shorter* یعنی «کاری کنی که کوتاه‌تر بشه» -- انگلیسی از یه ساختار فشردهٔ *make + object + adjective* استفاده می‌کنه، ولی فارسی یه فعل مخصوص داره (کوتاه‌ترش کنی)، نه یه الگوی عمومی «make + صفت»."}
  en.a1.unit52.lesson02.teach.the_same_style: {title: "The same style, please.", gloss: "همون مدل، لطفاً."}
  en.a1.unit52.lesson02.teach.how_much_does_a_haircut_cost: {title: "How much does a haircut cost?", gloss: "کوتاه کردن مو چقدر قیمت داره؟"}
  en.a1.unit52.lesson02.teach.its_twenty_dollars: {title: "It's twenty dollars.", gloss: "بیست دلاره."}

  en.a1.unit52.lesson03.teach.dialogue_line1: {title: "خوش‌آمدگویی آرایشگر", gloss: "آرایشگر می‌گه سلام، امروز چطور می‌تونم کمکتون کنم؟"}
  en.a1.unit52.lesson03.teach.dialogue_line2: {title: "درخواست دنیل", gloss: "دنیل می‌گه یه کوتاهی مو می‌خوام، لطفاً، و می‌گه خواهرم هفتهٔ بعد میاد."}
  en.a1.unit52.lesson03.teach.dialogue_line3: {title: "سؤال آرایشگر", gloss: "آرایشگر می‌پرسه چه مدلی می‌خواین؟"}
  en.a1.unit52.lesson03.teach.dialogue_line4: {title: "جواب دنیل", gloss: "دنیل می‌گه همون مدل، فقط یه کمی کوتاه‌تر."}
  en.a1.unit52.lesson03.teach.dialogue_line5: {title: "درخواست میا", gloss: "میا می‌پرسه می‌شه اول موهاش رو بشورین؟"}
  en.a1.unit52.lesson03.teach.dialogue_line6: {title: "جواب آرایشگر", gloss: "آرایشگر می‌گه البته، و می‌گه اون شامل قیمت کوتاهی مو می‌شه."}
  en.a1.unit52.lesson03.teach.dialogue_line7: {title: "سؤال دنیل دربارهٔ قیمت", gloss: "دنیل می‌گه عالی، و می‌پرسه چقدر می‌شه."}
  en.a1.unit52.lesson03.teach.dialogue_line8: {title: "جواب آرایشگر دربارهٔ قیمت", gloss: "آرایشگر می‌گه بیست دلاره."}

  en.a1.unit52.lesson04.teach.reading_passage: {title: "متن: رفتن به آرایشگاه", gloss: "رفتن به آرایشگاه: خواهر دنیل قرار بود هفتهٔ بعد از شیکاگو بیاد، برای همین اون تصمیم گرفت بره کوتاهی مو. میا آرایشگر مورد علاقه‌ش رو پیشنهاد داد، یه سالن کوچیک نزدیک آپارتمانش، و باهاش رفت. آرایشگر پرسید چه مدلی می‌خواد، و اون گفت همون مدل، فقط یه کمی کوتاه‌تر. اول موهاش رو شست، و شستن هم شامل قیمت کوتاهی مو بود. کوتاهی مو بیست دلار شد. وقتی تموم شد، میا گفت موهاش عالی شده. سر راه خونه، لیلا رو برای قهوه دیدن. اون بعد از سرماخوردگیش خیلی بهتر شده بود، و کوتاهی موی جدید دنیل رو هم دوست داشت."}

exercises:
  en.a1.unit52.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "trim"
    distractors: ["haircut", "hairdresser", "shorter", "style"]
    accepted_answers: [{value: "trim", status: "correct"}]
    feedback: "*trim* یعنی کمی کوتاه کردن."
  en.a1.unit52.lesson01.exercise02.choose_trim_meaning:
    instruction: "کدوم کلمه یعنی فقط یه مقدار کم از نوک موها کوتاه کردن؟"
    correct_option: "trim"
    distractors: ["haircut", "shorter", "style"]
    accepted_answers: [{value: "trim", status: "correct"}]
    feedback: "*trim* یعنی کمی کوتاه کردن."
  en.a1.unit52.lesson01.exercise03.match_personal_care_words:
    instruction: "هر واژه یا عبارت انگلیسی رو به توضیح فارسی درستش وصل کنین."
    pairs:
      - {left: "haircut", right: "کوتاه‌تر کردن مو"}
      - {left: "hairdresser", right: "کسی که مو رو کوتاه و مرتب می‌کنه"}
      - {left: "trim", right: "فقط کمی کوتاه کردن نوک موها"}
      - {left: "shorter", right: "کم‌طول‌تر از قبل"}
      - {left: "style", right: "شکل کوتاهی یا حالت مو"}
      - {left: "wash", right: "تمیز کردن با آب، مثلاً مو قبل از کوتاهی"}
    accepted_answers:
      - value:
          - {left: "haircut", right: "کوتاه‌تر کردن مو"}
          - {left: "hairdresser", right: "کسی که مو رو کوتاه و مرتب می‌کنه"}
          - {left: "trim", right: "فقط کمی کوتاه کردن نوک موها"}
          - {left: "shorter", right: "کم‌طول‌تر از قبل"}
          - {left: "style", right: "شکل کوتاهی یا حالت مو"}
          - {left: "wash", right: "تمیز کردن با آب، مثلاً مو قبل از کوتاهی"}
        status: "correct"
    feedback: "haircut=کوتاه کردن مو، hairdresser=آرایشگر، trim=کمی کوتاه کردن، shorter=کوتاه‌تر، style=مدل مو، wash=شستن."
  en.a1.unit52.lesson01.exercise04.order_haircut_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "need", "a", "haircut."], status: "correct"}]
    feedback: "ترتیب درست: *I need a haircut.*"
  en.a1.unit52.lesson01.exercise05.write_haircut:
    instruction: "کلمه‌ای رو بنویسین که یعنی کوتاه کردن مو."
    accepted_answers: [{value: "haircut", status: "correct"}]
    feedback: "*haircut* یعنی کوتاه کردن مو."

  en.a1.unit52.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "Can you make it a little shorter?"
    distractors: ["I'd like a haircut, please.", "Just a trim, please.", "The same style, please."]
    accepted_answers: [{value: "Can you make it a little shorter?", status: "correct"}]
    feedback: "*Can you make it a little shorter?* یعنی می‌تونی یه کمی کوتاه‌ترش کنی؟"
  en.a1.unit52.lesson02.exercise02.choose_request_meaning:
    instruction: "کدوم عبارت رو مشتری برای درخواست کوتاه کردن مو می‌گه؟"
    correct_option: "I'd like a haircut, please."
    distractors: ["Just a trim, please.", "How much does a haircut cost?", "It's twenty dollars."]
    accepted_answers: [{value: "I'd like a haircut, please.", status: "correct"}]
    feedback: "*I'd like a haircut, please.* یعنی یه کوتاهی مو می‌خوام، لطفاً."
  en.a1.unit52.lesson02.exercise03.choose_price_question_meaning:
    instruction: "کدوم عبارت می‌پرسه کوتاه کردن مو چقدر قیمت داره؟"
    correct_option: "How much does a haircut cost?"
    distractors: ["Can you make it a little shorter?", "The same style, please.", "I'd like a haircut, please."]
    accepted_answers: [{value: "How much does a haircut cost?", status: "correct"}]
    feedback: "*How much does a haircut cost?* یعنی کوتاه کردن مو چقدر قیمت داره؟"
  en.a1.unit52.lesson02.exercise04.order_price_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["It's", "twenty", "dollars."], status: "correct"}]
    feedback: "ترتیب درست: *It's twenty dollars.*"
  en.a1.unit52.lesson02.exercise05.translate_style_request:
    instruction: "ترجمه کنین: «همون مدل، لطفاً.»"
    accepted_answers: [{value: "The same style, please.", status: "correct"}]
    feedback: "*The same style, please.* یعنی همون مدل، لطفاً."

  en.a1.unit52.lesson03.exercise01.comprehension_daniel_reason:
    instruction: "طبق گفتگو، چرا دنیل کوتاهی مو می‌خواد؟"
    correct_option: "his sister is visiting next week"
    distractors: ["he has a job interview", "he lost a bet", "it's his birthday"]
    accepted_answers: [{value: "his sister is visiting next week", status: "correct"}]
    feedback: "دنیل می‌گه خواهرش هفتهٔ بعد میاد."
  en.a1.unit52.lesson03.exercise02.comprehension_style_request:
    instruction: "طبق گفتگو، دنیل چه مدلی می‌خواد؟"
    correct_option: "the same style, just a little shorter"
    distractors: ["a completely new style", "very short hair", "the same style, longer"]
    accepted_answers: [{value: "the same style, just a little shorter", status: "correct"}]
    feedback: "دنیل می‌گه همون مدل، فقط یه کمی کوتاه‌تر."
  en.a1.unit52.lesson03.exercise03.listen_dialogue_price:
    instruction: "طبق گفتگو، کوتاهی مو چقدر قیمت داره؟"
    correct_option: "twenty dollars"
    distractors: ["nine dollars", "twelve dollars", "sixteen dollars"]
    accepted_answers: [{value: "twenty dollars", status: "correct"}]
    feedback: "آرایشگر می‌گه بیست دلاره."
  en.a1.unit52.lesson03.exercise04.respond_own_haircut_statement:
    instruction: "بگین دنیل چه مدلی می‌خواد، یا بگین کوتاهی مو چقدر قیمت داره."
    accepted_answers: ["The same style, just a little shorter", "The same style, just a little shorter.", "It's twenty dollars", "It's twenty dollars.", "I'd like a haircut", "I'd like a haircut.", "Can you make it shorter", "Can you make it shorter?"]
    feedback: "می‌تونین بگین *The same style, just a little shorter* یا *It's twenty dollars*."

  en.a1.unit52.lesson04.exercise01.reading_haircut_reason:
    instruction: "طبق متن، چرا دنیل تصمیم گرفت کوتاهی مو بره؟"
    correct_option: "his sister was visiting"
    distractors: ["he had a job interview", "he lost a bet", "it was his birthday"]
    accepted_answers: [{value: "his sister was visiting", status: "correct"}]
    feedback: "متن می‌گه خواهرش داشت از شیکاگو می‌اومد."
  en.a1.unit52.lesson04.exercise02.reading_price:
    instruction: "طبق متن، کوتاهی مو چقدر قیمت داشت؟"
    correct_option: "twenty dollars"
    distractors: ["nine dollars", "twelve dollars", "sixteen dollars"]
    accepted_answers: [{value: "twenty dollars", status: "correct"}]
    feedback: "متن می‌گه بیست دلار بود."
  en.a1.unit52.lesson04.exercise03.reading_coffee_friend:
    instruction: "طبق متن، دنیل و میا برای قهوه با کی دیدار کردن؟"
    correct_option: "Leila"
    distractors: ["Mia", "the hairdresser", "Daniel's sister"]
    accepted_answers: [{value: "Leila", status: "correct"}]
    feedback: "متن می‌گه اونا لیلا رو برای قهوه دیدن."
  en.a1.unit52.lesson04.exercise04.write_own_haircut_message:
    instruction: "یه پیام کوتاه بنویسین: بگین دنیل چه مدلی می‌خواست، و بگین کوتاهی مو چقدر قیمت داشت."
    accepted_answers: ["He wanted the same style, just a little shorter. It cost twenty dollars.", "He wanted the same style, just a little shorter, and it cost twenty dollars.", "He wanted the same style, just a little shorter, it cost twenty dollars."]
    feedback: "می‌تونین بگین *He wanted the same style, just a little shorter, and it cost twenty dollars.*"
