  en.a1.unit62.lesson03.teach.dialogue_line4: {title: "درخواست لیلا", gloss: "لیلا می‌گوید: لطفاً آهسته صحبت کن.", note: "*Please speak slowly* درخواست آهسته صحبت کردن است."}
  en.a1.unit62.lesson03.teach.dialogue_line5: {title: "زمان جلسه", gloss: "میا می‌گوید: حتماً. جلسه ساعت چهار است.", note: "*The meeting is at four* زمان جلسه را می‌گوید."}
  en.a1.unit62.lesson03.teach.dialogue_line6: {title: "درخواست تکرار", gloss: "لیلا می‌گوید: لطفاً آن را تکرار کن.", note: "لیلا از میا می‌خواهد زمان را دوباره بگوید."}
