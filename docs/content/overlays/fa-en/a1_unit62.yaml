exercises:
  en.a1.unit62.lesson01.exercise01.listen_word:
    instruction: "گوش کنید و کلمه‌ای را که گفته شد انتخاب کنید."
    correct_option: "voicemail"
    distractors: ["email", "calendar", "address", "ticket"]
    accepted_answers: [{value: "voicemail", status: "correct"}]
    feedback: "*voicemail* یعنی پیام صوتی."
  en.a1.unit62.lesson01.exercise02.choose_repeat_meaning:
    instruction: "کدام کلمه یعنی دوباره گفتن؟"
    correct_option: "repeat"
    distractors: ["phone", "message", "slowly"]
    accepted_answers: [{value: "repeat", status: "correct"}]
    feedback: "*repeat* یعنی تکرار کردن."
  en.a1.unit62.lesson01.exercise03.match_phone_words:
    instruction: "هر توضیح انگلیسی را به کلمهٔ درست وصل کنید."
    accepted_answers: [{value: [{left: "a device for talking to someone far away", right: "phone"}, {left: "a phone conversation", right: "call"}, {left: "short information you send or leave", right: "message"}, {left: "a recorded phone message", right: "voicemail"}, {left: "say again", right: "repeat"}, {left: "not quickly", right: "slowly"}], status: "correct"}]
    feedback: "phone=تلفن، call=تماس، message=پیام، voicemail=پیام صوتی، repeat=تکرار کردن، slowly=آهسته."
  en.a1.unit62.lesson01.exercise04.order_repeat_sentence:
    instruction: "کلمات را به ترتیب درست بچینید."
    accepted_answers: [{value: ["Please", "repeat", "that."], status: "correct"}]
    feedback: "ترتیب درست: *Please repeat that.*"
  en.a1.unit62.lesson01.exercise05.write_message:
    instruction: "کلمه‌ای را بنویسید که یعنی اطلاعات کوتاهی که می‌فرستید یا می‌گذارید."
    accepted_answers: [{value: "message", status: "correct"}]
    feedback: "*message* یعنی پیام."

  en.a1.unit62.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنید و عبارتی را که شنیدید انتخاب کنید."
    correct_option: "Please repeat that."
    distractors: ["Please write that down.", "Please close the window.", "Please check your email."]
    accepted_answers: [{value: "Please repeat that.", status: "correct"}]
    feedback: "*Please repeat that* یعنی لطفاً آن را تکرار کنید."
  en.a1.unit62.lesson02.exercise02.choose_repeat_request:
    instruction: "کدام عبارت از کسی می‌خواهد چیزی را دوباره بگوید؟"
    correct_option: "Please repeat that."
    distractors: ["Please speak slowly.", "Leave a message.", "I'll call back later."]
    accepted_answers: [{value: "Please repeat that.", status: "correct"}]
    feedback: "*Please repeat that* درخواست تکرار است."
  en.a1.unit62.lesson02.exercise03.choose_speak_to_mia:
    instruction: "کدام عبارت پشت تلفن درخواست صحبت با میا می‌کند؟"
    correct_option: "Can I speak to Mia?"
    distractors: ["Hello, this is Leila.", "Please repeat that.", "Leave a message."]
    accepted_answers: [{value: "Can I speak to Mia?", status: "correct"}]
    feedback: "*Can I speak to Mia?* یعنی می‌توانم با میا صحبت کنم؟"
  en.a1.unit62.lesson02.exercise04.order_call_back_sentence:
    instruction: "کلمات را به ترتیب درست بچینید."
    accepted_answers: [{value: ["I'll", "call", "back", "later."], status: "correct"}]
    feedback: "ترتیب درست: *I'll call back later.*"
  en.a1.unit62.lesson02.exercise05.translate_speak_slowly:
    instruction: "ترجمه کنید: «لطفاً آهسته صحبت کنید.»"
    accepted_answers: [{value: "Please speak slowly.", status: "correct"}, {value: "Please speak slowly", status: "correct"}]
    feedback: "*Please speak slowly* یعنی لطفاً آهسته صحبت کنید."

  en.a1.unit62.lesson03.exercise01.comprehension_caller:
    instruction: "طبق گفتگو، چه کسی به میا زنگ می‌زند؟"
    correct_option: "Leila"
    distractors: ["Daniel", "the clerk", "the teacher"]
    accepted_answers: [{value: "Leila", status: "correct"}]
    feedback: "لیلا می‌گوید: *this is Leila*."
  en.a1.unit62.lesson03.exercise02.comprehension_meeting_time:
    instruction: "طبق گفتگو، جلسه چه ساعتی است؟"
    correct_option: "four"
    distractors: ["three", "five", "six"]
    accepted_answers: [{value: "four", status: "correct"}]
    feedback: "میا می‌گوید جلسه ساعت چهار است."
  en.a1.unit62.lesson03.exercise03.listen_dialogue_repeat:
    instruction: "کدام عبارت درخواست تکرار می‌کند؟"
    correct_option: "Please repeat that."
    distractors: ["Please call tomorrow.", "Please send a message.", "Please wait outside."]
    accepted_answers: [{value: "Please repeat that.", status: "correct"}]
    feedback: "لیلا می‌گوید: *Please repeat that.*"
  en.a1.unit62.lesson03.exercise04.respond_own_phone_call:
    instruction: "به تماس تلفنی پاسخ دهید، درخواست تکرار کنید، یا بگویید بعداً زنگ می‌زنید."
    accepted_answers: ["Please repeat that", "Please repeat that.", "Please speak slowly", "Please speak slowly.", "Hello, this is Leila", "Hello, this is Leila.", "I'll call back later", "I'll call back later."]
    feedback: "می‌توانید بگویید *Please repeat that* یا *I'll call back later*."

  en.a1.unit62.lesson04.exercise01.message_time:
    instruction: "طبق پیام، میا چه ساعتی تماس گرفت؟"
    correct_option: "4:00"
    distractors: ["3:00", "5:00", "6:00"]
    accepted_answers: [{value: "4:00", status: "correct"}]
    feedback: "پیام می‌گوید میا ساعت ۴:۰۰ تماس گرفت."
  en.a1.unit62.lesson04.exercise02.message_room:
    instruction: "طبق پیام، جلسه کجاست؟"
    correct_option: "Room 5"
    distractors: ["Room 3", "Room 4", "Room 6"]
    accepted_answers: [{value: "Room 5", status: "correct"}]
    feedback: "پیام می‌گوید جلسه در اتاق ۵ است."
  en.a1.unit62.lesson04.exercise03.reading_why_slowly:
    instruction: "طبق متن، چرا میا از لیلا خواست آهسته صحبت کند؟"
    correct_option: "The sound was not clear"
    distractors: ["The meeting was late", "The phone was new", "The room was full"]
    accepted_answers: [{value: "The sound was not clear", status: "correct"}]
    feedback: "متن می‌گوید صدا واضح نبود."
  en.a1.unit62.lesson04.exercise04.reading_repeat_detail:
    instruction: "طبق متن، لیلا از میا خواست چه چیزی را تکرار کند؟"
    correct_option: "the time"
    distractors: ["the room", "the address", "the name"]
    accepted_answers: [{value: "the time", status: "correct"}]
    feedback: "لیلا از میا خواست زمان را تکرار کند."
  en.a1.unit62.lesson04.exercise05.write_own_phone_message:
    instruction: "یک پیام تلفنی کوتاه بنویسید: بگویید چه کسی تماس گرفت و چه کاری باید انجام شود."
    accepted_answers: ["Mia called at 4:00. Please call back.", "Mia called at 4:00, and please call back.", "Mia called at 4:00 and please call back."]
    feedback: "می‌توانید بنویسید: *Mia called at 4:00. Please call back.*"
