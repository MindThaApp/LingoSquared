course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح میانی (B1) برای فارسی‌زبان‌ها، با تمرکز بر شرط، توالی رویدادها، نقل قول غیرمستقیم، هدف و فرض‌های غیرواقعی."

units:
  en.b1.unit17.regret: {title: "I wish I had asked for help sooner"}

lessons:
  en.b1.unit17.lesson01.regret_vocabulary: {title: "کلمات برای پشیمانی و آرزو"}
  en.b1.unit17.lesson02.past_hypothetical_forms: {title: "I wish I had asked for help sooner"}
  en.b1.unit17.lesson03.reading_a_reflective_message: {title: "متن: نگاهی به یه ماه پرکار"}
  en.b1.unit17.lesson04.the_regret_dialogue: {title: "If I had asked Mia sooner..."}

teaching:
  en.b1.unit17.lesson01.teach.regret: {title: "regret", gloss: "پشیمانی", note: "regret یعنی احساس ناراحتی دربارهٔ کاری که کردین یا نکردین.", example_gloss: "دنیل بابت از دست دادن مهلت پشیمان بود."}
  en.b1.unit17.lesson01.teach.wish: {title: "wish", gloss: "آرزو", note: "wish یعنی خواستن این که چیزی با آنچه واقعاً اتفاق افتاد فرق داشته باشه.", example_gloss: "دنیل یه آرزو دربارهٔ هفتهٔ گذشته داشت."}
  en.b1.unit17.lesson01.teach.mistake: {title: "mistake", gloss: "اشتباه", note: "mistake یعنی یه کار غلط که به‌خاطر قضاوت ضعیف انجام شده.", example_gloss: "این‌همه منتظر موندن برای درخواست کمک یه اشتباه بود."}
  en.b1.unit17.lesson01.teach.hindsight: {title: "hindsight", gloss: "درک پس از وقوع", note: "hindsight یعنی فهمیدن یه اتفاق گذشته فقط بعد از این که تموم شده.", example_gloss: "با نگاه به گذشته، دنیل باید زودتر حرف می‌زد."}
  en.b1.unit17.lesson01.teach.procrastinate: {title: "procrastinate", gloss: "کار رو عقب انداختن", note: "procrastinate یعنی انجام کاری که باید انجامش بدین رو به تعویق بندازین.", example_gloss: "دنیل وقتی یه کار سخته، تمایل داره اون رو عقب بندازه."}
  en.b1.unit17.lesson01.teach.delay: {title: "delay", gloss: "تأخیر", note: "delay یعنی مدتی که یه کار دیرتر از برنامه انجام می‌شه.", example_gloss: "تأخیر باعث شد دنیل اولین مهلتش رو از دست بده."}

  en.b1.unit17.lesson02.teach.wish_had_asked: {title: "I wish I had asked for help sooner.", gloss: "کاش زودتر درخواست کمک می‌کردم.", note: "*I wish I had* + قسمت سوم فعل (ماضی بعید) یعنی آرزو دربارهٔ گذشته؛ مثل «کاش ... کرده بودم/می‌کردم»."}
  en.b1.unit17.lesson02.teach.should_have_talked: {title: "I should have talked to my manager earlier.", gloss: "باید زودتر با مدیرم صحبت می‌کردم.", note: "*I should have* + قسمت سوم فعل یعنی اقدام درستی که الان فکر می‌کنین باید زودتر انجام می‌دادین."}
  en.b1.unit17.lesson02.teach.if_i_had_asked_would_have_finished: {title: "If I had asked Mia for help in week one, I would have finished on time.", gloss: "اگه هفتهٔ اول از میا کمک می‌خواستم، سر وقت تموم می‌کردم.", note: "*If + had + قسمت سوم فعل، would have + قسمت سوم فعل* یعنی یه شرط غیرواقعی دربارهٔ گذشته."}
  en.b1.unit17.lesson02.teach.grammar_past_hypothetical: {title: "بیان پشیمانی دربارهٔ گذشته", gloss: "برای بیان پشیمانی دربارهٔ گذشته از wish + had + قسمت سوم فعل (I wish I had asked...)، should have + قسمت سوم فعل (I should have talked...)، یا if + had + قسمت سوم فعل با would have + قسمت سوم فعل (If I had asked..., I would have finished...) استفاده کنین. هر سه فرم چیزی رو توضیح می‌دن که واقعاً اتفاق نیفتاد.", note: "این سه فرم همه دربارهٔ کاری هستن که واقعاً اتفاق نیفتاد."}

  en.b1.unit17.lesson03.teach.looking_back: {title: "looking back", gloss: "با نگاه به گذشته", note: "looking back یعنی فکر کردن به چیزی که قبلاً اتفاق افتاده.", example_gloss: "با نگاه به گذشته، دنیل آرزو می‌کنه زودتر درخواست کمک می‌کرد."}
  en.b1.unit17.lesson03.teach.missed_deadline: {title: "missed deadline", gloss: "مهلت از دست‌رفته", note: "missed deadline یعنی موعدی که به‌موقع رعایت نشده.", example_gloss: "دنیل قبل از درخواست کمک، یه مهلت رو از دست داد."}
  en.b1.unit17.lesson03.teach.reading_passage: {title: "متن: نگاهی به یه ماه پرکار", gloss: "سلام لیلا، با نگاه به گذشته، کاش زودتر درخواست کمک می‌کردم. باید زودتر با مدیرم دربارهٔ حجم کاری صحبت می‌کردم. تا وقتی که این کار رو کردم، یه مهلت رو از دست داده بودم. اگه هفتهٔ اول از میا کمک می‌خواستم، هر دو پروژه رو سر وقت تموم می‌کردم. این‌همه منتظر موندن یه اشتباه بود. دنیل", note: "این متن سه فرم پشیمانی رو با wish، should have و if...would have نشون می‌ده."}

  en.b1.unit17.lesson04.teach.q_wish_asked_sooner: {title: "حرف دنیل", gloss: "دنیل می‌گه با نگاه به گذشته، کاش زودتر درخواست کمک می‌کردم.", note: "*Looking back, I wish I had asked* شروع بیان پشیمانیه."}
  en.b1.unit17.lesson04.teach.a_what_happened: {title: "سؤال لیلا", gloss: "لیلا می‌گه چی شد؟", note: "*What happened?* یه سؤال کوتاه برای ادامهٔ حرفه."}
  en.b1.unit17.lesson04.teach.q_should_have_talked_missed: {title: "حرف دنیل", gloss: "دنیل می‌گه باید زودتر با مدیرم دربارهٔ حجم کاری صحبت می‌کردم. تا وقتی که این کار رو کردم، یه مهلت رو از دست داده بودم.", note: "*By the time I did, I had already missed one deadline* دو اتفاق گذشته رو به ترتیب نشون می‌ده."}
  en.b1.unit17.lesson04.teach.a_fair_regret_fixed: {title: "جواب لیلا", gloss: "لیلا می‌گه حق داری پشیمون باشی، ولی آخرش درستش کردی.", note: "*That's a fair regret* یعنی حق داری پشیمون باشی؛ پشیمونیت بجاست."}
  en.b1.unit17.lesson04.teach.q_true_if_had_asked: {title: "حرف دنیل", gloss: "دنیل می‌گه درسته. اگه هفتهٔ اول از میا کمک می‌خواستم، هر دو پروژه رو سر وقت تموم می‌کردم.", note: "*If I had asked..., I would have finished...* یه شرط غیرواقعی دربارهٔ گذشته‌ست."}
  en.b1.unit17.lesson04.teach.a_now_you_know: {title: "جمع‌بندی لیلا", gloss: "لیلا می‌گه خب، حالا برای دفعهٔ بعد می‌دونی.", note: "*now you know for next time* یعنی یه درس برای آینده."}

exercises:
