      - {left: "procrastinate", right: "کار رو عقب انداختن"}
      - {left: "delay", right: "تأخیر"}
    accepted_answers:
      - value:
          - {left: "regret", right: "پشیمانی"}
          - {left: "wish", right: "آرزو"}
          - {left: "mistake", right: "اشتباه"}
          - {left: "hindsight", right: "درک پس از وقوع"}
