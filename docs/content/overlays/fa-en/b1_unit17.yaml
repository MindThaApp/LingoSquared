  en.b1.unit17.lesson01.exercise05.write_mistake:
    instruction: "کلمه‌ای رو بنویسین که یعنی یه کار غلط که به‌خاطر قضاوت ضعیف انجام شده."
    accepted_answers:
      - {value: "mistake", status: "correct"}
      - {value: "Mistake", status: "correct"}
    feedback: "mistake یعنی اشتباه."

  en.b1.unit17.lesson02.exercise01.choose_wish_had_asked:
    instruction: "کدوم جمله آرزویی دربارهٔ چیزی که توی گذشته اتفاق نیفتاد رو بیان می‌کنه؟"
    correct_option: "I wish I had asked for help sooner."
    distractors: ["I should have talked to my manager earlier.", "If I had asked Mia for help in week one, I would have finished on time.", "I would prefer a replacement, if that's possible."]
