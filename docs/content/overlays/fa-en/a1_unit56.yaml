review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit56 (dining at a restaurant). Authored fully at schema_version 1.1, every kind: vocabulary teaching card has a matching example_gloss:. Contrastive-grammar points for this unit: (1) 'Could we have the bill, please?' -- the modal could here is a fixed polite-request form with no literal ability sense (nobody is asking whether they are physically able to have the bill), a usage Farsi speakers often try to translate literally as می‌تونیم (can/could = ability) rather than recognizing it as the same register as می‌شه (a polite-request marker) -- flagged on that phrase card so the learner treats *Could we have...?* as one memorized polite-request chunk. (2) *Is this table free?* -- English *free* has two unrelated senses (no cost vs. unoccupied); this exercise uses the SECOND, unoccupied sense, a genuine false-friend risk since Farsi speakers usually meet *free* first in its no-cost sense (رایگان) and may not expect the same word to mean خالی here -- flagged on that phrase card explicitly. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, not translated Farsi lefts, per the established fa-en convention. Every listen_select/multiple_choice distractor in lesson03/lesson04 is an invented value never stated elsewhere in this unit EXCEPT where the realization's own menu card (Chicken $12, Salad $7, Pizza $10, Juice $3) is the intended source of truth for lesson04's menu-reading exercises -- those two items deliberately reuse the menu's own other listed dishes as plausible distractors, exactly as the realization's own review notes describe, since a menu-reading comprehension check is supposed to test the whole menu, not just the ordered items; checked the dialogue's own lines (Leila: 4 lines; Mia: 4 lines; Waiter: 5 lines) to confirm every OTHER (non-menu) distractor is never a fact the tested speaker states elsewhere in the same audio. Strong sibling-isolation rule applied -- nl-en/prs-en overlays and the concurrent units 39-48 dispatch were not consulted. Needs the mandatory fresh-context review before shipping, and inherits the underlying realization's own still-unreviewed status."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit56.restaurant: {title: "غذا خوردن در رستوران"}

lessons:
  en.a1.unit56.lesson01.restaurant_vocabulary: {title: "کلمات رستوران"}
  en.a1.unit56.lesson02.phrases_for_the_restaurant: {title: "عبارت‌های رستوران"}
  en.a1.unit56.lesson03.dialogue_at_the_restaurant: {title: "گفتگو: در رستوران"}
  en.a1.unit56.lesson04.a_meal_at_the_restaurant: {title: "متن: یک وعده غذا در رستوران"}

teaching:
  en.a1.unit56.lesson01.teach.restaurant: {title: "restaurant", gloss: "رستوران", note: "*restaurant* یعنی جایی که می‌رین تا یه وعده غذا رو که کس دیگه‌ای پخته بخورین.", example_gloss: "این رستوران هر عصر بازه."}
  en.a1.unit56.lesson01.teach.waiter: {title: "waiter", gloss: "گارسون", note: "*waiter* یعنی کسی که سفارشتون رو می‌گیره و غذاتون رو میاره.", example_gloss: "گارسون خیلی مهربونه."}
  en.a1.unit56.lesson01.teach.table: {title: "table", gloss: "میز", note: "*table* یعنی جایی که برای غذا خوردن می‌شینین.", example_gloss: "میز ما کنار پنجره‌ست."}
  en.a1.unit56.lesson01.teach.menu: {title: "menu", gloss: "منو", note: "*menu* یعنی لیست غذاها و نوشیدنی‌هایی که می‌تونین سفارش بدین.", example_gloss: "می‌شه منو رو ببینم، لطفاً؟"}
  en.a1.unit56.lesson01.teach.order: {title: "order", gloss: "سفارش دادن", note: "*order* یعنی غذا یا نوشیدنی‌ای که می‌خواین رو خواستن.", example_gloss: "می‌خوام مرغ سفارش بدم."}
  en.a1.unit56.lesson01.teach.bill: {title: "bill", gloss: "صورت‌حساب", note: "*bill* یعنی کاغذی که نشون می‌ده چقدر باید پرداخت کنین.", example_gloss: "صورت‌حساب ده دلار بود."}

  en.a1.unit56.lesson02.teach.is_this_table_free: {title: "Is this table free?", gloss: "این میز خالیه؟", note: "دقت کنین *free* اینجا یعنی «خالی» (بدون کسی)، نه «رایگان» (بدون پول) -- همون کلمه‌ای که احتمالاً اول با معنی «رایگان» یادگرفتین، اینجا یه معنی کاملاً متفاوت داره."}
  en.a1.unit56.lesson02.teach.can_i_order_now: {title: "Can I order now?", gloss: "می‌تونم الان سفارش بدم؟"}
  en.a1.unit56.lesson02.teach.id_like_the_salad: {title: "I'd like the salad, please.", gloss: "سالاد می‌خوام، لطفاً."}
  en.a1.unit56.lesson02.teach.how_much_is_the_salad: {title: "How much is the salad?", gloss: "سالاد چقدر قیمت داره؟"}
  en.a1.unit56.lesson02.teach.could_we_have_the_bill: {title: "Could we have the bill, please?", gloss: "می‌شه صورت‌حساب رو بیارین، لطفاً؟", note: "*could* اینجا هیچ معنی «توانایی» نداره -- این یه شکل ثابت و مؤدبانه برای درخواسته، دقیقاً هم‌سطح با «می‌شه» تو فارسی، نه سؤال دربارهٔ اینکه واقعاً می‌تونن یا نه."}
  en.a1.unit56.lesson02.teach.enjoy_your_meal: {title: "Enjoy your meal!", gloss: "نوش جان!"}

  en.a1.unit56.lesson03.teach.dialogue_line1: {title: "سؤال لیلا", gloss: "لیلا می‌گه: سلام! این میز خالیه؟"}
  en.a1.unit56.lesson03.teach.dialogue_line2: {title: "جواب گارسون", gloss: "گارسون می‌گه: بله، لطفاً همین‌جا بشینین."}
  en.a1.unit56.lesson03.teach.dialogue_line3: {title: "درخواست میا", gloss: "میا می‌گه: می‌شه منو رو ببینم، لطفاً؟"}
  en.a1.unit56.lesson03.teach.dialogue_line4: {title: "آوردن منو", gloss: "گارسون می‌گه: البته، بفرمایین."}
  en.a1.unit56.lesson03.teach.dialogue_line5: {title: "سفارش لیلا", gloss: "لیلا می‌گه: مرغ می‌خوام، لطفاً."}
  en.a1.unit56.lesson03.teach.dialogue_line6: {title: "سفارش میا", gloss: "میا می‌گه: سالاد می‌خوام، لطفاً."}
  en.a1.unit56.lesson03.teach.dialogue_line7: {title: "تعریف گارسون", gloss: "گارسون می‌گه: انتخاب خوبی بود! نوش جان!"}
  en.a1.unit56.lesson03.teach.dialogue_line8: {title: "سؤال لیلا دربارهٔ قیمت مرغ", gloss: "لیلا می‌گه: مرغ چقدر قیمت داره؟"}
  en.a1.unit56.lesson03.teach.dialogue_line9: {title: "قیمت مرغ", gloss: "گارسون می‌گه: مرغ دوازده دلاره."}
  en.a1.unit56.lesson03.teach.dialogue_line10: {title: "سؤال میا دربارهٔ قیمت سالاد", gloss: "میا می‌گه: سالاد چقدر قیمت داره؟"}
  en.a1.unit56.lesson03.teach.dialogue_line11: {title: "قیمت سالاد", gloss: "گارسون می‌گه: سالاد هفت دلاره."}
  en.a1.unit56.lesson03.teach.dialogue_line12: {title: "درخواست صورت‌حساب", gloss: "لیلا می‌گه: می‌شه صورت‌حساب رو بیارین، لطفاً؟"}
  en.a1.unit56.lesson03.teach.dialogue_line13: {title: "کل صورت‌حساب", gloss: "گارسون می‌گه: نوزده دلار می‌شه، لطفاً."}

  en.a1.unit56.lesson04.teach.restaurant_menu: {title: "منوی رستوران", gloss: "منوی رستوران: مرغ - ۱۲ دلار. سالاد - ۷ دلار. پیتزا - ۱۰ دلار. آبمیوه - ۳ دلار."}
  en.a1.unit56.lesson04.teach.reading_passage: {title: "متن: یک وعده غذا در رستوران", gloss: "یه عصر، لیلا و میا تصمیم گرفتن یه رستوران جدید تو مرکز شهر رو امتحان کنن. یه گارسون اونا رو به یه میز کنار پنجره برد. اون یه منو با مرغ، سالاد، پیتزا، و آبمیوه براشون آورد. لیلا مرغ سفارش داد، و میا سالاد سفارش داد. مرغ دوازده دلار بود، و سالاد هفت دلار. وقتی داشتن غذا می‌خوردن، دربارهٔ کلاس عکاسی میا حرف زدن. وقتی کارشون تموم شد، گارسون صورت‌حساب رو آورد. نوزده دلار برای هر دوشون شد. لیلا گفت رستوران عالی بود، و میا گفت می‌خواد دفعهٔ بعد دنیل رو هم بیاره اینجا."}

exercises:
  en.a1.unit56.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "menu"
    distractors: ["restaurant", "waiter", "table", "order"]
    accepted_answers: [{value: "menu", status: "correct"}]
    feedback: "*menu* یعنی منو."
  en.a1.unit56.lesson01.exercise02.choose_waiter_meaning:
    instruction: "کدوم کلمه یعنی کسی که سفارشتون رو می‌گیره و غذاتون رو میاره؟"
    correct_option: "waiter"
    distractors: ["restaurant", "table", "menu"]
    accepted_answers: [{value: "waiter", status: "correct"}]
    feedback: "*waiter* یعنی گارسون."
  en.a1.unit56.lesson01.exercise03.match_restaurant_words:
    instruction: "هر توضیح انگلیسی رو به کلمهٔ درستش وصل کنین."
    accepted_answers: [{value: [{left: "restaurant", right: "a place where you go to eat a meal someone else cooks"}, {left: "waiter", right: "the person who takes your order and brings your food"}, {left: "table", right: "the place where you sit to eat"}, {left: "menu", right: "the list of food and drinks you can order"}, {left: "order", right: "to ask for the food or drink you want"}, {left: "bill", right: "the paper that shows how much you must pay"}], status: "correct"}]
    feedback: "restaurant=رستوران، waiter=گارسون، table=میز، menu=منو، order=سفارش دادن، bill=صورت‌حساب."
  en.a1.unit56.lesson01.exercise04.order_waiter_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["The", "waiter", "is", "very", "friendly."], status: "correct"}]
    feedback: "ترتیب درست: *The waiter is very friendly.*"
  en.a1.unit56.lesson01.exercise05.write_bill:
    instruction: "کلمه‌ای رو بنویسین که یعنی کاغذی که نشون می‌ده چقدر باید پرداخت کنین."
    accepted_answers: [{value: "bill", status: "correct"}]
    feedback: "*bill* یعنی صورت‌حساب."

  en.a1.unit56.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "Is this table free?"
    distractors: ["Can I order now?", "I'd like the salad, please.", "Enjoy your meal!"]
    accepted_answers: [{value: "Is this table free?", status: "correct"}]
    feedback: "*Is this table free?* یعنی این میز خالیه؟ دقت کنین *free* اینجا یعنی «خالی»، نه «رایگان»."
  en.a1.unit56.lesson02.exercise02.choose_order_now_meaning:
    instruction: "کدوم عبارت رو مشتری برای پرسیدن اینکه می‌تونه سفارش بده می‌گه؟"
    correct_option: "Can I order now?"
    distractors: ["Is this table free?", "How much is the salad?", "Could we have the bill, please?"]
    accepted_answers: [{value: "Can I order now?", status: "correct"}]
    feedback: "*Can I order now?* یعنی می‌تونم الان سفارش بدم؟"
  en.a1.unit56.lesson02.exercise03.choose_enjoy_meal_meaning:
    instruction: "کدوم عبارت رو گارسون قبل از شروع غذا خوردن می‌گه؟"
    correct_option: "Enjoy your meal!"
    distractors: ["Can I order now?", "How much is the salad?", "Could we have the bill, please?"]
    accepted_answers: [{value: "Enjoy your meal!", status: "correct"}]
    feedback: "*Enjoy your meal!* یعنی نوش جان!"
  en.a1.unit56.lesson02.exercise04.order_salad_price_question:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["How", "much", "is", "the", "salad?"], status: "correct"}]
    feedback: "ترتیب درست: *How much is the salad?*"
  en.a1.unit56.lesson02.exercise05.translate_bill_request:
    instruction: "ترجمه کنین: «می‌شه صورت‌حساب رو بیارین، لطفاً؟»"
    accepted_answers: [{value: "Could we have the bill, please?", status: "correct"}]
    feedback: "*Could we have the bill, please?* یعنی می‌شه صورت‌حساب رو بیارین؟"

  en.a1.unit56.lesson03.exercise01.comprehension_leila_order:
    instruction: "طبق گفتگو، لیلا چی سفارش داد؟"
    correct_option: "chicken"
    distractors: ["salad", "pizza", "juice"]
    accepted_answers: [{value: "chicken", status: "correct"}]
    feedback: "لیلا مرغ سفارش داد."
  en.a1.unit56.lesson03.exercise02.comprehension_salad_price:
    instruction: "طبق گفتگو، سالاد چقدر قیمت داره؟"
    correct_option: "seven dollars"
    distractors: ["five dollars", "nine dollars", "twelve dollars"]
    accepted_answers: [{value: "seven dollars", status: "correct"}]
    feedback: "گارسون می‌گه سالاد هفت دلاره."
  en.a1.unit56.lesson03.exercise03.listen_dialogue_total_bill:
    instruction: "طبق گفتگو، کل صورت‌حساب چقدره؟"
    correct_option: "nineteen dollars"
    distractors: ["fifteen dollars", "twenty dollars", "twenty-five dollars"]
    accepted_answers: [{value: "nineteen dollars", status: "correct"}]
    feedback: "گارسون می‌گه نوزده دلاره."
  en.a1.unit56.lesson03.exercise04.respond_own_restaurant_statement:
    instruction: "بگین مرغ چقدر قیمت داره، سالاد چقدر قیمت داره، یا کل صورت‌حساب چقدره."
    accepted_answers: ["The chicken is twelve dollars", "The chicken is twelve dollars.", "The salad is seven dollars", "The salad is seven dollars.", "That's nineteen dollars", "That's nineteen dollars.", "That's nineteen dollars, please", "That's nineteen dollars, please."]
    feedback: "می‌تونین بگین *The chicken is twelve dollars* یا *That's nineteen dollars*."

  en.a1.unit56.lesson04.exercise01.menu_pizza_price:
    instruction: "طبق منو، کدوم غذا ده دلار قیمت داره؟"
    correct_option: "pizza"
    distractors: ["chicken", "salad", "juice"]
    accepted_answers: [{value: "pizza", status: "correct"}]
    feedback: "منو می‌گه پیتزا ده دلاره."
  en.a1.unit56.lesson04.exercise02.menu_cheapest_item:
    instruction: "طبق منو، کدوم غذا از همه ارزون‌تره؟"
    correct_option: "juice"
    distractors: ["chicken", "salad", "pizza"]
    accepted_answers: [{value: "juice", status: "correct"}]
    feedback: "منو می‌گه آبمیوه از همه ارزون‌تره، سه دلار."
  en.a1.unit56.lesson04.exercise03.reading_chicken_price:
    instruction: "طبق متن، مرغ چقدر قیمت داشت؟"
    correct_option: "twelve dollars"
    distractors: ["seven dollars", "ten dollars", "three dollars"]
    accepted_answers: [{value: "twelve dollars", status: "correct"}]
    feedback: "متن می‌گه مرغ دوازده دلار بود."
  en.a1.unit56.lesson04.exercise04.reading_total_bill:
    instruction: "طبق متن، کل صورت‌حساب چقدر بود؟"
    correct_option: "nineteen dollars"
    distractors: ["fifteen dollars", "twenty dollars", "twenty-five dollars"]
    accepted_answers: [{value: "nineteen dollars", status: "correct"}]
    feedback: "متن می‌گه نوزده دلار بود."
  en.a1.unit56.lesson04.exercise05.write_own_restaurant_message:
    instruction: "یه پیام کوتاه بنویسین: بگین لیلا چی سفارش داد، و بگین میا چی سفارش داد."
    accepted_answers: ["Leila ordered the chicken, and Mia ordered the salad.", "Leila ordered the chicken. Mia ordered the salad.", "Leila ordered the chicken and Mia ordered the salad."]
    feedback: "می‌تونین بگین *Leila ordered the chicken, and Mia ordered the salad.*"
