course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح پیشرفته‌تر (B2) برای فارسی‌زبان‌ها، با تمرکز روی روایت زمان، لحن، ایده‌های انتزاعی، مذاکره و ترکیب منابع."

units:
  en.b2.unit06.abstraction: {title: "انصاف باید وزن بیشتری داشته باشه"}

lessons:
  en.b2.unit06.lesson01.abstract_values: {title: "ارزش‌ها و محدود کردن ادعا"}
  en.b2.unit06.lesson02.qualified_opinions: {title: "In principle, but..."}
  en.b2.unit06.lesson03.reading_public_spaces: {title: "متن: فضاهای عمومی آرام"}
  en.b2.unit06.lesson04.the_abstract_dialogue: {title: "ارزشی که اولویت می‌دین"}

teaching:
  en.b2.unit06.lesson01.teach.value: {title: "value", gloss: "ارزش، اصل مهم", note: "value در بحث انتزاعی یعنی چیزی که جامعه یا فرد مهم می‌دونه. در انگلیسی a value وقتی یکی از چند ارزش رو نام می‌بریم article می‌گیره.", example_gloss: "انصاف یک ارزشه."}
  en.b2.unit06.lesson01.teach.fairness: {title: "fairness", gloss: "انصاف، عادلانه برخورد کردن", note: "fairness اسم انتزاعیه و معمولاً بدون the وقتی به مفهوم کلی اشاره می‌کنه میاد: Fairness matters.", example_gloss: "fairness یعنی با مردم منطقی و عادلانه رفتار کردن."}
  en.b2.unit06.lesson01.teach.convenience: {title: "convenience", gloss: "راحتی، کاربردی بودن", note: "convenience هم اسم انتزاعیه؛ فارسی article نداره، اما انگلیسی بین convenience به معنی کلی و a convenience به معنی یک امکان راحت‌کننده فرق می‌ذاره.", example_gloss: "راحتی زندگی روزمره رو آسان‌تر می‌کنه."}
  en.b2.unit06.lesson01.teach.flexibility: {title: "flexibility", gloss: "انعطاف‌پذیری", note: "flexibility یعنی توان تغییر با شرایط. در این درس دربارهٔ نیاز کسب‌وکارها به انعطاف حرف می‌زنیم.", example_gloss: "انعطاف‌پذیری اجازه می‌ده وقتی شرایط عوض می‌شه، تغییر کنیم."}
  en.b2.unit06.lesson01.teach.qualify: {title: "qualify", gloss: "محدود یا مشروط کردن ادعا", note: "qualify یعنی ادعا رو مطلق نگین؛ مثلاً بگین «همه‌جا نه» یا «اگر قانون‌ها محدود باشن».", example_gloss: "می‌تونین یک نظر رو با محدود کردنش دقیق‌تر کنین."}
  en.b2.unit06.lesson01.teach.prioritize: {title: "prioritize", gloss: "اولویت دادن", note: "prioritize یعنی یک ارزش رو مهم‌تر از ارزش دیگه قرار بدین.", example_gloss: "اولویت دادن به انصاف یعنی اون رو مهم‌تر حساب کنین."}

  en.b2.unit06.lesson02.teach.in_principle: {title: "In principle, convenience matters, but fairness should carry more weight.", gloss: "از نظر اصولی، راحتی مهمه، اما انصاف باید وزن بیشتری داشته باشه.", note: "carry more weight یعنی در تصمیم‌گیری مهم‌تر حساب بشه. فارسی ممکنه بگه «بیشتر اهمیت داره»، اما در انگلیسی این collocation طبیعیه."}
  en.b2.unit06.lesson02.teach.not_arguing_everywhere: {title: "I am not arguing for silence everywhere.", gloss: "من نمی‌گم همه‌جا باید سکوت مطلق باشه.", note: "I am not arguing for... ادعای شما رو محدود می‌کنه. اینجا for یعنی «در دفاع از»، نه «برای رفتن به جایی»."}
  en.b2.unit06.lesson02.teach.respond_opposing: {title: "That is fair, and I agree businesses need flexibility.", gloss: "این حرف منصفانه‌ایه، و قبول دارم کسب‌وکارها به انعطاف‌پذیری نیاز دارن.", note: "That is fair پاسخ مستقیم به نظر مخالفه؛ بعد می‌تونین موضع خودتون رو دقیق‌تر کنین."}
  en.b2.unit06.lesson02.teach.grammar_abstract_response: {title: "نظر انتزاعی قوی", gloss: "یک نظر انتزاعی قوی یک ارزش رو نام می‌بره، ادعا رو محدود می‌کنه، و مستقیم به نظر طرف مقابل جواب می‌ده.", note: "برای فارسی‌زبان‌ها articles دام مهمه: a value، the value you are prioritizing، اما fairness/convenience وقتی مفهوم کلین معمولاً بدون article میان."}

  en.b2.unit06.lesson03.teach.transparent: {title: "transparent", gloss: "شفاف، قابل فهم", note: "transparent rules یعنی قانون‌هایی که روشن و قابل فهمن.", example_gloss: "قانون‌های شفاف راحت فهمیده می‌شن."}
  en.b2.unit06.lesson03.teach.commercial: {title: "commercial", gloss: "تجاری، مربوط به کسب‌وکار", note: "commercial activity یعنی فعالیتی که با کسب‌وکار و پول درآوردن ربط داره.", example_gloss: "فعالیت تجاری به کسب‌وکار مربوطه."}
  en.b2.unit06.lesson03.teach.reading_passage: {title: "متن: فضاهای عمومی آرام", gloss: "آمارا استدلال می‌کنه که فضاهای عمومی آرام باید محافظت بشن، حتی وقتی این کار بعضی فعالیت‌های تجاری رو محدود می‌کنه. نظر اون مطلق نیست: اون نمی‌گه همه‌جا باید سکوت باشه، و قبول داره که کسب‌وکارها به مقداری انعطاف نیاز دارن. نظر مخالف لئو اینه که قانون‌ها می‌تونن زنده ماندن کسب‌وکارها رو سخت‌تر کنن. آمارا مستقیم به اون نکته جواب می‌ده و می‌گه راحتی مهمه، اما وقتی فضا متعلق به همه‌ست، انصاف باید وزن بیشتری داشته باشه. موضعش مطلق نیست، چون از قانون‌های محدود و شفاف حمایت می‌کنه، نه محدودیت‌های بی‌حد.", note: "در abstract writing انگلیسی، shared spaces و businesses معمولاً جمع و بی‌article میان؛ اما the rules وقتی به قانون‌های مشخص بحث اشاره می‌کنه the می‌گیره."}

  en.b2.unit06.lesson04.teach.q_protect_spaces: {title: "Amara", gloss: "فکر می‌کنم یک شهر باید از فضاهای عمومی آرام محافظت کنه، حتی اگر این کار بعضی فعالیت‌های تجاری رو محدود کنه.", note: "a city یک شهر به‌صورت نمونه/کلیه؛ public spaces جمع کلیه."}
  en.b2.unit06.lesson04.teach.a_business_flexibility: {title: "Leo", gloss: "من هم برای آرامش ارزش قائلم، اما کسب‌وکارها برای دوام آوردن به انعطاف‌پذیری نیاز دارن.", note: "I value quiet too یعنی من هم آرامش رو مهم می‌دونم."}
  en.b2.unit06.lesson04.teach.q_not_silence: {title: "Amara", gloss: "این منصفانه‌ست، و من نمی‌گم همه‌جا باید سکوت باشه. نکته‌ام اینه که فضاهای مشترک نباید فقط با سود شکل بگیرن.", note: "My point is that... نظر اصلی رو بعد از محدود کردن ادعا روشن می‌کنه."}
  en.b2.unit06.lesson04.teach.a_prioritizing: {title: "Leo", gloss: "پس ارزشی که داری اولویت می‌دی انصافه، نه فقط راحتی؟", note: "the value you are prioritizing یعنی ارزش مشخصی که در این بحث در اولویت گذاشتین."}
  en.b2.unit06.lesson04.teach.q_fairness_weight: {title: "Amara", gloss: "دقیقاً. در اصل، راحتی مهمه، اما وقتی یک فضا متعلق به همه‌ست، انصاف باید وزن بیشتری داشته باشه.", note: "a space یعنی یک فضای مشخص/نمونه؛ everyone بدون article میاد."}
  en.b2.unit06.lesson04.teach.a_accept_rules: {title: "Leo", gloss: "اگر قانون‌ها محدود و شفاف باشن، می‌تونم این رو قبول کنم.", note: "limited and transparent شرایط پذیرش لئو رو روشن می‌کنه."}

