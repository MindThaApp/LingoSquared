course:
  title: "انگلیسی B2"
  description: "آموزش انگلیسی سطح پیشرفته‌تر (B2) برای فارسی‌زبان‌ها، با تمرکز روی روایت زمان، لحن، ایده‌های انتزاعی، مذاکره و ترکیب منابع."

units:
  en.b2.unit06.abstraction: {title: "انصاف باید وزن بیشتری داشته باشه"}

lessons:
  en.b2.unit06.lesson01.abstract_values: {title: "ارزش‌ها و محدود کردن ادعا"}
  en.b2.unit06.lesson02.qualified_opinions: {title: "In principle, but..."}
  en.b2.unit06.lesson03.reading_public_spaces: {title: "متن: فضاهای عمومی آرام"}
  en.b2.unit06.lesson04.the_abstract_dialogue: {title: "ارزشی که اولویت می‌دین"}

teaching:
  en.b2.unit06.lesson01.teach.value: {title: "value", gloss: "ارزش، اصل مهم", note: "value در بحث انتزاعی یعنی چیزی که جامعه یا فرد مهم می‌دونه. در انگلیسی a value وقتی یکی از چند ارزش را نام می‌بریم article می‌گیرد.", example_gloss: "انصاف یک ارزش است."}
  en.b2.unit06.lesson01.teach.fairness: {title: "fairness", gloss: "انصاف، عادلانه برخورد کردن", note: "fairness اسم انتزاعیه و معمولاً بدون the وقتی به مفهوم کلی اشاره می‌کنه میاد: Fairness matters.", example_gloss: "fairness یعنی با مردم منطقی و عادلانه رفتار کردن."}
  en.b2.unit06.lesson01.teach.convenience: {title: "convenience", gloss: "راحتی، کاربردی بودن", note: "convenience هم اسم انتزاعیه؛ فارسی article نداره، اما انگلیسی بین convenience به معنی کلی و a convenience به معنی یک امکان راحت‌کننده فرق می‌ذاره.", example_gloss: "راحتی زندگی روزمره را آسان‌تر می‌کنه."}
  en.b2.unit06.lesson01.teach.flexibility: {title: "flexibility", gloss: "انعطاف‌پذیری", note: "flexibility یعنی توان تغییر با شرایط. در این درس دربارهٔ نیاز کسب‌وکارها به انعطاف حرف می‌زنیم.", example_gloss: "انعطاف‌پذیری اجازه می‌ده وقتی شرایط عوض می‌شه، تغییر کنیم."}
  en.b2.unit06.lesson01.teach.qualify: {title: "qualify", gloss: "محدود یا مشروط کردن ادعا", note: "qualify یعنی ادعا را مطلق نگین؛ مثلاً بگین «همه‌جا نه» یا «اگر قانون‌ها محدود باشن».", example_gloss: "می‌تونین یک نظر را با محدود کردنش دقیق‌تر کنین."}
  en.b2.unit06.lesson01.teach.prioritize: {title: "prioritize", gloss: "اولویت دادن", note: "prioritize یعنی یک ارزش را مهم‌تر از ارزش دیگر قرار بدین.", example_gloss: "اولویت دادن به انصاف یعنی آن را مهم‌تر حساب کنین."}

  en.b2.unit06.lesson02.teach.in_principle: {title: "In principle, convenience matters, but fairness should carry more weight.", gloss: "در اصل، راحتی مهمه، اما انصاف باید وزن بیشتری داشته باشه.", note: "carry more weight یعنی در تصمیم‌گیری مهم‌تر حساب شود. فارسی ممکنه بگه «بیشتر اهمیت داره»، اما در انگلیسی این collocation طبیعی است."}
  en.b2.unit06.lesson02.teach.not_arguing_everywhere: {title: "I am not arguing for silence everywhere.", gloss: "من نمی‌گم همه‌جا باید سکوت مطلق باشه.", note: "I am not arguing for... ادعای شما را محدود می‌کنه. اینجا for یعنی «در دفاع از»، نه «برای رفتن به جایی»."}
  en.b2.unit06.lesson02.teach.respond_opposing: {title: "That is fair, and I agree businesses need flexibility.", gloss: "این حرف منصفانه‌ایه، و قبول دارم کسب‌وکارها به انعطاف‌پذیری نیاز دارن.", note: "That is fair پاسخ مستقیم به نظر مخالفه؛ بعد می‌تونین موضع خودتون رو دقیق‌تر کنین."}
  en.b2.unit06.lesson02.teach.grammar_abstract_response: {title: "نظر انتزاعی قوی", gloss: "یک نظر انتزاعی قوی یک ارزش را نام می‌بره، ادعا را محدود می‌کنه، و مستقیم به نظر طرف مقابل جواب می‌ده.", note: "برای فارسی‌زبان‌ها articles دام مهمه: a value، the value you are prioritizing، اما fairness/convenience وقتی مفهوم کلی‌اند معمولاً بدون article می‌آیند."}

  en.b2.unit06.lesson03.teach.transparent: {title: "transparent", gloss: "شفاف، قابل فهم", note: "transparent rules یعنی قانون‌هایی که روشن و قابل فهم‌اند.", example_gloss: "قانون‌های شفاف راحت فهمیده می‌شن."}
  en.b2.unit06.lesson03.teach.commercial: {title: "commercial", gloss: "تجاری، مربوط به کسب‌وکار", note: "commercial activity یعنی فعالیتی که با کسب‌وکار و پول درآوردن ربط داره.", example_gloss: "فعالیت تجاری به کسب‌وکار مربوطه."}
  en.b2.unit06.lesson03.teach.reading_passage: {title: "متن: فضاهای عمومی آرام", gloss: "آمارا استدلال می‌کنه که فضاهای عمومی آرام باید محافظت بشن، حتی وقتی این کار بعضی فعالیت‌های تجاری را محدود می‌کنه. نظر او مطلق نیست: او نمی‌گه همه‌جا باید سکوت باشه، و قبول داره که کسب‌وکارها به مقداری انعطاف نیاز دارن. نظر مخالف لئو اینه که قانون‌ها می‌تونن زنده ماندن کسب‌وکارها را سخت‌تر کنن. آمارا مستقیم به آن نکته جواب می‌ده و می‌گه راحتی مهمه، اما وقتی فضا متعلق به همه است، انصاف باید وزن بیشتری داشته باشه. موضع او محدودشده است چون از قانون‌های محدود و شفاف حمایت می‌کنه، نه محدودیت‌های بی‌حد.", note: "در abstract writing انگلیسی، shared spaces و businesses معمولاً جمع و بی‌article می‌آیند؛ اما the rules وقتی به قانون‌های مشخص بحث اشاره می‌کنه the می‌گیرد."}

  en.b2.unit06.lesson04.teach.q_protect_spaces: {title: "Amara", gloss: "فکر می‌کنم یک شهر باید از فضاهای عمومی آرام محافظت کنه، حتی اگر این کار بعضی فعالیت‌های تجاری را محدود کنه.", note: "a city یک شهر به‌صورت نمونه/کلی است؛ public spaces جمع کلی است."}
  en.b2.unit06.lesson04.teach.a_business_flexibility: {title: "Leo", gloss: "من هم برای آرامش ارزش قائلم، اما کسب‌وکارها برای دوام آوردن به انعطاف‌پذیری نیاز دارن.", note: "I value quiet too یعنی من هم آرامش را مهم می‌دونم."}
  en.b2.unit06.lesson04.teach.q_not_silence: {title: "Amara", gloss: "این منصفانه است، و من نمی‌گم همه‌جا باید سکوت باشه. نکته‌ام اینه که فضاهای مشترک نباید فقط با سود شکل بگیرن.", note: "My point is that... نظر اصلی را بعد از محدود کردن ادعا روشن می‌کنه."}
  en.b2.unit06.lesson04.teach.a_prioritizing: {title: "Leo", gloss: "پس ارزشی که داری اولویت می‌دی انصافه، نه فقط راحتی؟", note: "the value you are prioritizing یعنی ارزش مشخصی که در این بحث جلو انداختین."}
  en.b2.unit06.lesson04.teach.q_fairness_weight: {title: "Amara", gloss: "دقیقاً. در اصل، راحتی مهمه، اما وقتی یک فضا متعلق به همه است، انصاف باید وزن بیشتری داشته باشه.", note: "a space یعنی یک فضای مشخص/نمونه؛ everyone بدون article میاد."}
  en.b2.unit06.lesson04.teach.a_accept_rules: {title: "Leo", gloss: "اگر قانون‌ها محدود و شفاف باشن، می‌تونم این را قبول کنم.", note: "limited and transparent شرایط پذیرش لئو را روشن می‌کنه."}

