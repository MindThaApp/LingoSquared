review: {status: "reviewed", required_next_reviewer: null, notes: "New overlay against the shared English realization unit39 (neighborhood), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1, every teaching card with a realization example: has a matching example_gloss:. Contrastive-grammar points, deliberately different from ones already used in this direction: (1) the collocation get along with your neighbors -- Persian has no single verb equivalent to phrasal 'get along with'; the closest Persian equivalent (با کسی خوب بودن / کنار اومدن) uses a totally different verb-plus-preposition shape, so this is a memorize-the-whole-chunk case, not a word-for-word mapping; (2) nearby as a standalone adverb placed AFTER the noun it modifies (a park nearby) -- Persian normally places its locational modifier (نزدیک) either before the noun or as a separate clause, so English's post-posed bare adverb is flagged as the drillable difference; (3) the collocation a five-minute walk -- English compounds a number plus a singular noun into one adjective before 'walk' (five-minute, not five-minutes), while Persian just says پنج دقیقه راه/پیاده‌روی with the number naturally already singular-countable, so the note flags the ENGLISH singularization rule (a language-internal English quirk, not a direct fa-en contrast, but one Farsi speakers reliably get wrong by pluralizing the hyphenated modifier). matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, NOT translated Persian lefts -- deliberate, grading-motivated deviation from the older X-en overlay pattern (the compiler copies prompt.pairs from the realization only, so a translated-left answer key can never grade correct; verified against unit38's own precedent and the compile_content.py compile_exercise() logic, which sources prompt.pairs strictly from the realization document, never the overlay). lesson03/lesson04 multiple_choice and listen_select distractor sets copied verbatim from the realization's own review notes, which explicitly documented the exact invented, never-spoken-in-this-unit distractor values used to pass the same-speaker-distractor check during realization authoring -- reusing them here keeps the overlay consistent with what the realization author already verified safe, rather than inventing a second, unverified set. Strong sibling-isolation rule applied -- nl-en/prs-en overlays for this unit were not consulted for content; only the realization file and the compiler schema (confirmed once via the existing fa-en/a1_unit38.yaml overlay, itself already-shipped fa-en content, not a sibling direction) were read. Needs the mandatory fresh-context review before shipping.\n\nfa-en review 2026-10-19: realization + overlay read in full. 19 fixes: false notes (nearby can also precede the noun; five-minute note garbled the Persian contrast; knows/says note reworded); noisy glossed شلوغ (= busy); محل/محلش spelling -> محله‌ش etc. (7 places); calque example gloss (کمک‌کننده‌ست); move = خونه عوض کردن; reading gloss missing often; friendly/nearby matching rights; untaught distractors (feeds, mail, avoids, follows, sleeps) replaced; open-task answers widened. Flag: listen_select correct option 'waters my plants' (realization tested_text) uses my while the question and distractors use her."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit39.neighborhood: {title: "صحبت دربارهٔ محله"}

lessons:
  en.a1.unit39.lesson01.neighborhood_vocabulary: {title: "محلهٔ شما"}
  en.a1.unit39.lesson02.describing_your_area: {title: "توصیف محله‌تون"}
  en.a1.unit39.lesson03.dialogue_asking_about_the_neighborhood: {title: "گفتگو: سؤال دربارهٔ محله"}
  en.a1.unit39.lesson04.three_neighborhoods: {title: "متن: سه محله"}

teaching:
  en.a1.unit39.lesson01.teach.neighborhood: {title: "neighborhood", gloss: "محله", note: "*neighborhood* یعنی محله -- منطقه‌ای اطراف خونه‌تون، با خیابونا و ساختمونای نزدیک.", example_gloss: "من محله‌مو خیلی دوست دارم."}
  en.a1.unit39.lesson01.teach.neighbor: {title: "neighbor", gloss: "همسایه", note: "*neighbor* یعنی همسایه -- کسی که کنار خونهٔ شما یا نزدیکش زندگی می‌کنه.", example_gloss: "همسایه‌م خیلی کمکم می‌کنه."}
  en.a1.unit39.lesson01.teach.nearby: {title: "nearby", gloss: "این نزدیکیا / نزدیک", note: "*nearby* یعنی نزدیک، نه دور. دقت کنین: اینجا بعد از اسم اومده -- *a park nearby* (یه پارک همین نزدیکی)؛ البته می‌تونه قبل از اسم هم بیاد: *a nearby park*.", example_gloss: "یه پارک این نزدیکیاست."}
  en.a1.unit39.lesson01.teach.quiet: {title: "quiet", gloss: "آروم / ساکت", note: "*quiet* یعنی ساکت، بدون سروصدای زیاد.", example_gloss: "خیابونم شبا خیلی ساکته."}
  en.a1.unit39.lesson01.teach.noisy: {title: "noisy", gloss: "پرسروصدا", note: "*noisy* یعنی پر از صدای بلند -- برعکس *quiet*.", example_gloss: "خیابون بغلی ما پرسروصداست."}
  en.a1.unit39.lesson01.teach.friendly: {title: "friendly", gloss: "مهربون / خوش‌رفتار", note: "*friendly* یعنی مهربون و خوش‌برخورد.", example_gloss: "همسایه‌هام خیلی مهربونن."}

  en.a1.unit39.lesson02.teach.live_in_a_neighborhood: {title: "live in a neighborhood", gloss: "توی یه محله زندگی کردن", note: "*live in a neighborhood* -- زندگی کردن توی یه محلهٔ خاص. حرف اضافهٔ *in* اینجا ثابته.", example_gloss: "من توی یه محلهٔ آروم زندگی می‌کنم."}
  en.a1.unit39.lesson02.teach.get_along_with_your_neighbors: {title: "get along with your neighbors", gloss: "با همسایه‌هاتون خوب کنار اومدن", note: "*get along with someone* یه فعل عبارتیه (فعل + حرف اضافه) که معنیش رابطهٔ خوب و بدون دعوا داشتنه. فارسی معادل تک‌کلمه‌ای نداره -- کل عبارت رو یه‌جا حفظ کنین.", example_gloss: "من با همسایه‌هام خوب کنار میام."}
  en.a1.unit39.lesson02.teach.close_to: {title: "close to", gloss: "نزدیک به", note: "*close to* + اسم یعنی نزدیک به یه جا.", example_gloss: "خونهٔ من نزدیک یه سوپرمارکته."}
  en.a1.unit39.lesson02.teach.a_five_minute_walk: {title: "a five-minute walk", gloss: "پنج دقیقه پیاده‌روی", note: "*a five-minute walk* -- دقت کنین *five-minute* اینجا مفرده و با خط تیره به هم وصل می‌شه، نه *five-minutes*. معمولاً انگلیسی بعد از عدد اسم رو جمع می‌کنه (*five minutes*، برعکس فارسی که می‌گه «پنج دقیقه»)، ولی وقتی عدد + اسم با خط تیره نقش صفت پیدا می‌کنه، اسم مفرد می‌مونه.", example_gloss: "پارک تا خونه‌م پنج دقیقه پیاده‌ست."}
  en.a1.unit39.lesson02.teach.say_hello_to: {title: "say hello to", gloss: "به کسی سلام کردن", note: "*say hello to someone* -- سلام کردن به کسی.", example_gloss: "من همیشه صبحا به همسایه‌م سلام می‌کنم."}
  en.a1.unit39.lesson02.teach.whats_your_neighborhood_like_question: {title: "What's your neighborhood like?", gloss: "محله‌ت چطوریه؟", note: "*What's ... like?* یه سؤال برای خواستن توصیفه، نه سؤال دربارهٔ علاقه (با *like* به‌معنی «دوست داشتن» قاطی نشه)."}

  en.a1.unit39.lesson03.teach.dialogue_line1: {title: "سؤال لیلا", gloss: "لیلا می‌گه ممکنه به‌زودی خونه‌شو عوض کنه و از میا می‌پرسه محله‌ش چطوریه.", note: "*I might move soon* -- *might* یعنی احتمال، نه قطعیت."}
  en.a1.unit39.lesson03.teach.dialogue_line2: {title: "جواب میا", gloss: "میا می‌گه واقعاً محله‌شو دوست داره، آرومه و یه پارک هم این نزدیکیاست.", note: "*It's quiet, and there's a park nearby* -- دو تا صفت/جمله با *and* به هم وصل شدن."}
  en.a1.unit39.lesson03.teach.dialogue_line3: {title: "سؤال لیلا", gloss: "لیلا می‌گه به‌نظر خوب میاد و می‌پرسه محله‌ش نزدیک سوپرمارکته یا نه.", note: "*Is it close to...?* -- سؤال بله/خیر با *close to*."}
  en.a1.unit39.lesson03.teach.dialogue_line4: {title: "جواب میا", gloss: "میا می‌گه آره، یکیش فقط پنج دقیقه پیاده‌روی از ساختمونشه.", note: "*just a five-minute walk* -- *just* اینجا یعنی «فقط»، برای تأکید روی کم‌بودن فاصله."}
  en.a1.unit39.lesson03.teach.dialogue_line5: {title: "سؤال لیلا", gloss: "لیلا دربارهٔ همسایه‌های میا می‌پرسه -- مهربونن؟", note: "*Are they friendly?* -- سؤال با *they* برای اشاره به همسایه‌ها (جمع)."}
  en.a1.unit39.lesson03.teach.dialogue_line6: {title: "جواب میا", gloss: "میا می‌گه خیلی مهربونن -- همسایه‌ش آقای لوپز وقتی نیست به گل‌هاش آب می‌ده.", note: "*waters my plants* -- فعل *water* اینجا یعنی «آب دادن»، نه اسم آب."}
  en.a1.unit39.lesson03.teach.dialogue_line7: {title: "جواب لیلا", gloss: "لیلا می‌گه چقدر خوبه و می‌گه دوست داره نزدیک میا زندگی کنه!", note: "*I'd like to* یعنی «دوست دارم» -- کوتاه‌شدهٔ *I would like to*."}

  en.a1.unit39.lesson04.teach.reading_passage: {title: "متن: سه محله", gloss: "دنیل، لیلا و میا هر کدوم توی یه محلهٔ متفاوت زندگی می‌کنن. محلهٔ دنیل شلوغه، با رستوران‌ها و مغازه‌های نزدیک ساختمونش. اون چندتا از همسایه‌هاشو می‌شناسه و اغلب توی راهرو بهشون سلام می‌کنه. لیلا توی یه محلهٔ آروم زندگی می‌کنه، نزدیک استخری که توش شنا می‌کنه. همسایهٔ اون‌طرف خیابونش یه سگ بزرگ داره که خیلی پارس می‌کنه. محلهٔ میا هم آرومه، با یه سوپرمارکت فقط پنج دقیقه پیاده‌روی از ساختمونش. همسایه‌ش آقای لوپز خیلی مهربونه و وقتی نیست به گل‌هاش آب می‌ده. بعد از حرف زدن با میا، لیلا تصمیم گرفت دنبال یه آپارتمان نزدیک اون بگرده.", note: "دقت کنین به *knows* و *says*: توی حال ساده، فعلِ فاعل سوم‌شخص مفرد (*he*، *she*) *-s* می‌گیره -- *he knows*، *he says* -- زمان حال ساده برای عادت‌های همیشگی."}

exercises:
  en.a1.unit39.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "neighbor"
    distractors: ["neighborhood", "nearby", "quiet", "noisy"]
    accepted_answers: [{value: "neighbor", status: "correct"}]
    feedback: "*neighbor* یعنی همسایه."
  en.a1.unit39.lesson01.exercise02.choose_neighborhood_meaning:
    instruction: "کدوم کلمه یعنی منطقهٔ اطراف خونه‌تون، با خیابونا و ساختمونای نزدیک؟"
    correct_option: "neighborhood"
    distractors: ["neighbor", "nearby", "quiet"]
    accepted_answers: [{value: "neighborhood", status: "correct"}]
    feedback: "*neighborhood* یعنی محله."
  en.a1.unit39.lesson01.exercise03.match_neighborhood_words:
    instruction: "هر واژه یا عبارت انگلیسی رو به توضیح فارسی درستش وصل کنین."
    pairs:
      - {left: "neighborhood", right: "خونه‌تون و خیابون‌های دوروبرش"}
      - {left: "neighbor", right: "کسی که کنار یا نزدیک خونه‌تون زندگی می‌کنه"}
      - {left: "nearby", right: "نزدیک یه جا و نه دور از اون"}
      - {left: "quiet", right: "جایی که سروصدا نداره"}
      - {left: "noisy", right: "جایی پر از صداهای بلند"}
      - {left: "friendly", right: "مهربون و خوش‌برخورد با بقیه"}
    accepted_answers:
      - value:
          - {left: "neighborhood", right: "خونه‌تون و خیابون‌های دوروبرش"}
          - {left: "neighbor", right: "کسی که کنار یا نزدیک خونه‌تون زندگی می‌کنه"}
          - {left: "nearby", right: "نزدیک یه جا و نه دور از اون"}
          - {left: "quiet", right: "جایی که سروصدا نداره"}
          - {left: "noisy", right: "جایی پر از صداهای بلند"}
          - {left: "friendly", right: "مهربون و خوش‌برخورد با بقیه"}
        status: "correct"
    feedback: "neighborhood=محله، neighbor=همسایه، nearby=نزدیک، quiet=ساکت، noisy=پرسروصدا، friendly=مهربون."
  en.a1.unit39.lesson01.exercise04.order_quiet_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["My", "street", "is", "very", "quiet", "at", "night."], status: "correct"}]
    feedback: "ترتیب درست: *My street is very quiet at night.*"
  en.a1.unit39.lesson01.exercise05.write_neighbor_word:
    instruction: "کلمه‌ای رو بنویسین که یعنی کسی که کنار خونهٔ شما یا نزدیکش زندگی می‌کنه."
    accepted_answers: [{value: "neighbor", status: "correct"}]
    feedback: "*neighbor* یعنی همسایه."

  en.a1.unit39.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "close to"
    distractors: ["live in a neighborhood", "get along with your neighbors", "a five-minute walk", "say hello to"]
    accepted_answers: [{value: "close to", status: "correct"}]
    feedback: "*close to* یعنی نزدیک به."
  en.a1.unit39.lesson02.exercise02.choose_get_along_meaning:
    instruction: "کدوم عبارت یعنی رابطهٔ خوب و بدون دعوا با کسایی که نزدیکتون زندگی می‌کنن داشتن؟"
    correct_option: "get along with your neighbors"
    distractors: ["live in a neighborhood", "close to", "a five-minute walk"]
    accepted_answers: [{value: "get along with your neighbors", status: "correct"}]
    feedback: "*get along with your neighbors* یعنی با همسایه‌هاتون خوب کنار اومدن."
  en.a1.unit39.lesson02.exercise03.choose_five_minute_walk_meaning:
    instruction: "کدوم عبارت یعنی فقط پنج دقیقه با پیاده‌روی فاصله داره؟"
    correct_option: "a five-minute walk"
    distractors: ["live in a neighborhood", "get along with your neighbors", "say hello to"]
    accepted_answers: [{value: "a five-minute walk", status: "correct"}]
    feedback: "*a five-minute walk* یعنی پنج دقیقه پیاده‌روی."
  en.a1.unit39.lesson02.exercise04.order_say_hello_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "always", "say", "hello", "to", "my", "neighbor", "in", "the", "morning."], status: "correct"}]
    feedback: "ترتیب درست: *I always say hello to my neighbor in the morning.*"
  en.a1.unit39.lesson02.exercise05.translate_whats_your_neighborhood_like:
    instruction: "ترجمه کنین: «محله‌ت چطوریه؟»"
    accepted_answers: [{value: "What's your neighborhood like?", status: "correct"}, {value: "What's your neighborhood like", status: "correct"}]
    feedback: "*What's your neighborhood like?*"

  en.a1.unit39.lesson03.exercise01.comprehension_mia_nearby_place:
    instruction: "طبق گفتگو، میا می‌گه چی نزدیک آپارتمانشه؟"
    correct_option: "a park"
    distractors: ["a school", "a hospital", "a gym"]
    accepted_answers: [{value: "a park", status: "correct"}]
    feedback: "میا می‌گه یه پارک این نزدیکیاست."
  en.a1.unit39.lesson03.exercise02.comprehension_grocery_store_distance:
    instruction: "طبق گفتگو، سوپرمارکت چقدر با ساختمون میا فاصله داره؟"
    correct_option: "a five-minute walk"
    distractors: ["a ten-minute walk", "a two-minute walk", "a fifteen-minute walk"]
    accepted_answers: [{value: "a five-minute walk", status: "correct"}]
    feedback: "میا می‌گه فقط پنج دقیقه پیاده‌روی فاصله داره."
  en.a1.unit39.lesson03.exercise03.listen_dialogue_neighbor_favor:
    instruction: "طبق گفتگو، همسایهٔ میا براش چیکار می‌کنه؟"
    correct_option: "waters my plants"
    distractors: ["walks my dog", "cleans my apartment", "takes out my trash"]
    accepted_answers: [{value: "waters my plants", status: "correct"}]
    feedback: "میا می‌گه همسایه‌ش آقای لوپز وقتی نیست به گل‌هاش آب می‌ده."
  en.a1.unit39.lesson03.exercise04.respond_own_neighborhood:
    instruction: "دربارهٔ محله یا همسایهٔ خودتون یه چیزی بگین."
    accepted_answers: ["I live in a quiet neighborhood", "I live in a quiet neighborhood.", "My neighborhood is nice", "My neighborhood is nice.", "My neighbor is very friendly", "My neighbor is very friendly.", "There is a park nearby", "There is a park nearby.", "My neighborhood is noisy", "My neighborhood is noisy.", "I live in a noisy neighborhood", "My neighbors are very friendly", "My neighbor is friendly", "My street is very quiet", "I love my neighborhood", "There's a park nearby", "My neighborhood is quiet", "I get along with my neighbors"]
    feedback: "می‌تونین از الگوی *I live in a ... neighborhood* یا *My neighbor is ...* استفاده کنین."

  en.a1.unit39.lesson04.exercise01.reading_daniel_neighbors:
    instruction: "طبق متن، دنیل توی راهرو با همسایه‌هاش چیکار می‌کنه؟"
    correct_option: "says hello to them"
    distractors: ["invites them for dinner", "doesn't talk to them", "asks them for help"]
    accepted_answers: [{value: "says hello to them", status: "correct"}]
    feedback: "متن می‌گه دنیل توی راهرو بهشون سلام می‌کنه."
  en.a1.unit39.lesson04.exercise02.reading_leila_neighbor_dog:
    instruction: "طبق متن، سگ همسایهٔ لیلا چیکار می‌کنه؟"
    correct_option: "barks a lot"
    distractors: ["swims in the pool", "runs in the park", "is very quiet"]
    accepted_answers: [{value: "barks a lot", status: "correct"}]
    feedback: "متن می‌گه سگ همسایه‌ش خیلی پارس می‌کنه."
  en.a1.unit39.lesson04.exercise03.reading_mia_neighbor_favor:
    instruction: "طبق متن، همسایهٔ میا وقتی اون خونه نیست چیکار می‌کنه؟"
    correct_option: "waters her plants"
    distractors: ["walks her dog", "takes out her trash", "cleans her apartment"]
    accepted_answers: [{value: "waters her plants", status: "correct"}]
    feedback: "متن می‌گه همسایه‌ش وقتی نیست به گل‌هاش آب می‌ده."
  en.a1.unit39.lesson04.exercise04.write_own_neighborhood_sentence:
    instruction: "یه جمله دربارهٔ محله یا همسایهٔ خودتون بنویسین، با «I live in a ... neighborhood»، «My neighbor is ...» یا «There is a ... nearby»."
    accepted_answers: ["I live in a quiet neighborhood", "I live in a quiet neighborhood.", "I live in a noisy neighborhood", "I live in a noisy neighborhood.", "My neighbor is very friendly", "My neighbor is very friendly.", "There is a park nearby", "There is a park nearby.", "There is a grocery store nearby", "There is a grocery store nearby.", "My neighbor is friendly.", "My neighbor is nice.", "My neighbor is very nice.", "My neighbor is very helpful.", "My neighbor is helpful.", "My neighbor is noisy.", "I live in a nice neighborhood.", "I live in a busy neighborhood.", "There is a school nearby.", "There is a pool nearby.", "There is a gym nearby.", "There's a park nearby.", "There's a grocery store nearby."]
    feedback: "می‌تونین از الگوی *I live in a ... neighborhood*، *My neighbor is ...* یا *There is a ... nearby* استفاده کنین."
