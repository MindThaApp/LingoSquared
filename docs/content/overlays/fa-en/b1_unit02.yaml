course:
  title: "انگلیسی B1"
  description: "آموزش انگلیسی سطح میانی (B1) برای فارسی‌زبان‌ها، با تمرکز بر بیان ضرورت، توانایی، شرط، بحث و کار، همراه با توضیحات دقیق فارسی."

units:
  en.b1.unit02.abilities: {title: "کارهایی که از عهده‌شون برمیام"}

lessons:
  en.b1.unit02.lesson01.ability_vocabulary: {title: "be able to و manage to"}
  en.b1.unit02.lesson02.present_and_past_ability: {title: "توانایی حال و گذشته"}
  en.b1.unit02.lesson03.reading_the_new_system: {title: "متن: سیستم آنلاین جدید"}
  en.b1.unit02.lesson04.the_license_dialogue: {title: "تونستی تمدیدش کنی؟"}

teaching:
  en.b1.unit02.lesson01.teach.be_able_to: {title: "be able to", gloss: "توانایی داشتن، از عهده‌اش برومدن", note: "be able to یعنی توانایی یا فرصت انجام کاری رو داشتن -- بعدش فعل ساده میاد.", example_gloss: "می‌تونم گواهینامه‌ام رو آنلاین تمدید کنم."}
  en.b1.unit02.lesson01.teach.manage_to: {title: "manage to", gloss: "موفق شدن (با کمی زحمت)", note: "manage to یعنی موفق شدن به انجام کاری، معمولاً با کمی سختی.", example_gloss: "تونستم فرم رو توی ده دقیقه تموم کنم."}
  en.b1.unit02.lesson01.teach.renew: {title: "renew", gloss: "تمدید کردن", note: "renew یعنی یه مدرک رو قبل از منقضی شدنش تمدید کردن.", example_gloss: "باید گواهینامهٔ رانندگیم رو تمدید کنم."}
  en.b1.unit02.lesson01.teach.license: {title: "license", gloss: "گواهینامه، مجوز", note: "license یه مدرک رسمیه که اجازهٔ کاری مثل رانندگی رو می‌ده.", example_gloss: "گواهینامهٔ رانندگیم این ماه منقضی می‌شه."}
  en.b1.unit02.lesson01.teach.online: {title: "online", gloss: "آنلاین، اینترنتی", note: "online یعنی از طریق اینترنت، نه توی یه مکان فیزیکی.", example_gloss: "الان می‌تونی آنلاین تمدیدش کنی."}
  en.b1.unit02.lesson01.teach.in_person: {title: "in person", gloss: "حضوری", note: "in person یعنی با رفتن شخصی به یه مکان، نه آنلاین.", example_gloss: "پارسال باید حضوری می‌رفتم."}

  en.b1.unit02.lesson02.teach.am_able_to_renew_online: {title: "I am able to renew my license online now.", gloss: "الان می‌تونم گواهینامه‌ام رو آنلاین تمدید کنم.", note: "am able to + فعل ساده برای بیان توانایی در زمان حال استفاده می‌شه."}
  en.b1.unit02.lesson02.teach.was_not_able_to_last_year: {title: "Last year, I was not able to do it online.", gloss: "پارسال، نمی‌تونستم این کار رو آنلاین انجام بدم.", note: "was not able to همون was able to منفی‌شده‌ست -- برای توانایی نداشتن در گذشته."}
  en.b1.unit02.lesson02.teach.managed_to_finish: {title: "I managed to finish the form in ten minutes.", gloss: "تونستم فرم رو توی ده دقیقه تموم کنم.", note: "managed to برخلاف be able to، معمولاً یعنی با یه‌کم زحمت موفق شدین."}
  en.b1.unit02.lesson02.teach.grammar_present_past: {title: "توانایی حال، گذشته و فرضی", gloss: "می‌تونم تمدیدش کنم. تونستم تمدیدش کنم. می‌تونستم کمکت کنم.", note: "*am able to* حالِ الانه، *was able to* گذشته‌ست، و *would be able to* یه پیشنهاد یا توانایی فرضیه (اگه بخوای کمک کنم)."}

  en.b1.unit02.lesson03.teach.friend: {title: "friend", gloss: "دوست", note: "friend یعنی دوست.", example_gloss: "دوستم هفتهٔ پیش گواهینامه‌اش رو تمدید کرد."}
  en.b1.unit02.lesson03.teach.system: {title: "system", gloss: "سیستم، نظام", note: "system یعنی یه روش سازمان‌یافته برای انجام کاری.", example_gloss: "سیستم جدید خیلی سریع‌تره."}
  en.b1.unit02.lesson03.teach.reading_passage: {title: "متن: سیستم آنلاین جدید", gloss: "پارسال، مردم نمی‌تونستن گواهینامه‌هاشون رو آنلاین تمدید کنن. همه باید حضوری به اداره می‌رفتن. امسال، سیستم عوض شد. حالا مردم می‌تونن همه چیز رو از خونه انجام بدن. دوستم میا تونست مال خودش رو توی ده دقیقه تموم کنه.", note: "این متن توانایی نداشتن در گذشته (were not able to) رو با توانایی داشتن الان (are able to) مقایسه می‌کنه."}

  en.b1.unit02.lesson04.teach.q_were_you_able: {title: "پرسش لیلا", gloss: "لیلا می‌پرسه تونستی گواهینامه‌ات رو آنلاین تمدید کنی؟", note: "Were you able to...? شکل سؤالی was able to برای پرسیدن دربارهٔ توانایی در گذشته‌ست."}
  en.b1.unit02.lesson04.teach.a_wasnt_able_office: {title: "جواب دنیل", gloss: "دنیل می‌گه نه، نتونستم. باید حضوری به اداره می‌رفتم.", note: "wasn't able to یعنی نتونست -- برخلاف لیلا که تونست."}
  en.b1.unit02.lesson04.teach.q_really_managed: {title: "واکنش لیلا", gloss: "لیلا می‌گه واقعاً؟ من تونستم توی ده دقیقه آنلاین انجامش بدم.", note: "managed to اینجا نشون می‌ده که لیلا با موفقیت و سریع این کار رو انجام داده."}
  en.b1.unit02.lesson04.teach.a_next_time_save: {title: "جواب دنیل", gloss: "دنیل می‌گه دفعهٔ بعد، می‌تونستم وقت صرفه‌جویی کنم اگه آنلاین هم انجامش می‌دادم.", note: "would be able to اینجا یه توانایی فرضی برای آینده رو نشون می‌ده."}
  en.b1.unit02.lesson04.teach.q_would_help: {title: "پیشنهاد لیلا", gloss: "لیلا می‌گه دفعهٔ بعد می‌تونم کمکت کنم، اگه بخوای.", note: "would be able to help you یه پیشنهاد مؤدبانه‌ست، نه یه دستور."}
  en.b1.unit02.lesson04.teach.a_thanks: {title: "جواب دنیل", gloss: "دنیل می‌گه ممنون، دوست دارم.", note: "I'd like that یه راه معمول برای قبول کردن یه پیشنهاده."}

