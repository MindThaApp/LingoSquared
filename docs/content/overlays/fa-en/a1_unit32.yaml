review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit32 (animals/pets), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1, every teaching card with a realization example: has a matching example_gloss:. Contrastive-grammar points, deliberately different from ones already used in this direction: (1) English's obligatory indefinite article a/an before singular countable nouns (I have a dog) has no Persian counterpart -- Persian says the bare noun (سگ دارم), with colloquial یه optional, so dropping the article is the predictable error to teach against; (2) English uses gendered pronouns he/she/her even for pets (Her name is Luna), while Persian has only genderless او/ـش -- speakers must track an animal's sex to talk about it in English; (3) the quantifier any in questions/negatives (Do you have any pets? / I don't have any pets) has no Persian translation and simply disappears in the Persian rendering. IMPORTANT deviation from the older X-en overlay pattern, deliberate and grading-motivated: matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, NOT translated Persian lefts -- the compiler copies prompt.pairs only from the realization, so the frontend displays and submits English lefts, and a translated-left answer key can never grade correct (verified against compile output + backend canonical_pairs() this same session; existing overlays authored with translated lefts have this latent bug). Do not 'fix' this back to translated lefts in review. Strong sibling-isolation rule applied -- nl-en/prs-en overlays for this unit were not consulted for content. Needs the mandatory fresh-context review before shipping."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit32.animals: {title: "صحبت دربارهٔ حیوونای خونگی"}

lessons:
  en.a1.unit32.lesson01.pet_vocabulary: {title: "حیوونای خونگی"}
  en.a1.unit32.lesson02.describing_pets: {title: "حیوون خونگیت چطوریه"}
  en.a1.unit32.lesson03.dialogue_mias_cat: {title: "گفتگو: گربهٔ میا"}
  en.a1.unit32.lesson04.two_pet_owners: {title: "متن: دو صاحب حیوون خونگی"}

teaching:
  en.a1.unit32.lesson01.teach.dog: {title: "dog", gloss: "سگ", note: "*dog* یعنی سگ. توی انگلیسی قبل از اسم مفرد شمردنی حتماً یه حرف تعریف مثل *a* میاد: *I have a dog* -- فارسی همچین کلمهٔ اجباری‌ای نداره؛ ما می‌گیم «سگ دارم» یا «یه سگ دارم»، ولی انگلیسی بدون *a* غلطه.", example_gloss: "من یه سگ دارم."}
  en.a1.unit32.lesson01.teach.cat: {title: "cat", gloss: "گربه", note: "*cat* یعنی گربه. مالکیت با *'s* ساخته می‌شه: *my sister's cat* یعنی گربهٔ خواهرم -- برعکس فارسی، اول صاحب میاد بعد چیزی که مال اونه.", example_gloss: "گربهٔ خواهرم خاکستریه."}
  en.a1.unit32.lesson01.teach.fish: {title: "fish", gloss: "ماهی", note: "*fish* یعنی ماهی. با فاعل سوم‌شخص مفرد، فعل *have* به *has* تبدیل می‌شه: *He has a fish*.", example_gloss: "اون یه ماهی داره."}
  en.a1.unit32.lesson01.teach.bird: {title: "bird", gloss: "پرنده", note: "*bird* یعنی پرنده. اینجا هم حرف تعریف *a* اجباریه: *We have a bird*.", example_gloss: "ما یه پرنده داریم."}
  en.a1.unit32.lesson01.teach.pet: {title: "pet", gloss: "حیوون خونگی", note: "*pet* یعنی حیوون خونگی. توی سؤال، انگلیسی معمولاً *any* رو اضافه می‌کنه: *Do you have any pets?* -- کلمهٔ *any* توی فارسی معادل مستقیمی نداره و اصلاً ترجمه نمی‌شه؛ ما فقط می‌پرسیم «حیوون خونگی داری؟».", example_gloss: "حیوون خونگی داری؟"}

  en.a1.unit32.lesson02.teach.name_is: {title: "Her name is Luna.", gloss: "اسمش لوناست.", note: "انگلیسی برای حیوونای خونگی هم از ضمیرهای جنسیت‌دار استفاده می‌کنه: *her* برای حیوون ماده، *his* برای نر -- فارسی ضمیر جنسیت‌دار نداره و برای همه «او» یا «ـش» می‌گیم، پس برای صحبت دربارهٔ یه حیوون خونگی توی انگلیسی باید جنسیتش رو بدونین."}
  en.a1.unit32.lesson02.teach.play: {title: "play", gloss: "بازی کردن", note: "*play* یعنی بازی کردن. بعد از *likes* فعل دوم با *to* میاد: *likes to play* -- فارسی به‌جاش فعل التزامی می‌ذاره: «دوست داره بازی کنه».", example_gloss: "سگ من دوست داره بازی کنه."}
  en.a1.unit32.lesson02.teach.walk: {title: "walk", gloss: "بیرون بردن (سگ) / قدم زدن", note: "*walk* وقتی مفعول داره یه معنی خاص پیدا می‌کنه: *I walk my dog* یعنی سگم رو برای پیاده‌روی می‌برم بیرون -- یه فعل برای کاری که فارسی با یه عبارت کامل می‌گه.", example_gloss: "من هر روز سگم رو می‌برم بیرون."}
  en.a1.unit32.lesson02.teach.friendly: {title: "friendly", gloss: "مهربون / خوش‌برخورد", note: "*friendly* یعنی مهربون، حیوونی که با آدم‌ها خوب رفتار می‌کنه. از اسم *friend* (دوست) ساخته شده.", example_gloss: "گربه‌ش خیلی مهربونه."}
  en.a1.unit32.lesson02.teach.small: {title: "small", gloss: "کوچیک", note: "*small* یعنی کوچیک. صفت توی انگلیسی بعد از *is* میاد: *The fish is small*.", example_gloss: "اون ماهی کوچیکه."}

  en.a1.unit32.lesson03.teach.dialogue_line1: {title: "سؤال دنیل", gloss: "دنیل از میا می‌پرسه حیوون خونگی داره یا نه.", note: "سؤال بله/خیر با *Do* شروع می‌شه: *Do you have any pets?* -- و *any* ترجمه نمی‌شه."}
  en.a1.unit32.lesson03.teach.dialogue_line2: {title: "جواب میا", gloss: "میا می‌گه آره، یه گربه داره. اسمش لوناست.", note: "*Her name is Luna* -- چون لونا ماده‌ست، ضمیر *her* به‌کار رفته."}
  en.a1.unit32.lesson03.teach.dialogue_line3: {title: "واکنش دنیل", gloss: "دنیل می‌گه چه خوب! و می‌پرسه لونا بازی دوست داره؟", note: "سؤال سوم‌شخص با *Does* ساخته می‌شه و فعل اصلی بدون *-s* می‌مونه: *Does she like...?* نه *Does she likes*."}
  en.a1.unit32.lesson03.teach.dialogue_line4: {title: "جواب میا", gloss: "میا می‌گه آره، لونا عاشق بازی با توپه. بعد می‌پرسه «تو چی؟»", note: "*What about you?* یعنی «تو چی؟» -- برای برگردوندن همون سؤال به طرف مقابل."}
  en.a1.unit32.lesson03.teach.dialogue_line5: {title: "جواب دنیل", gloss: "دنیل می‌گه یه ماهی کوچیک داره، ولی یه سگ می‌خواد.", note: "*but* یعنی ولی: *I have a small fish, but I want a dog*."}

  en.a1.unit32.lesson04.teach.reading_passage: {title: "متن: لیلا و دنیل", gloss: "لیلا یه سگ به اسم مکس داره. مکس بزرگه و خیلی مهربونه. لیلا هر روز صبح می‌بردش بیرون. دنیل سگ نداره، ولی یه ماهی کوچیک داره. ماهی نیازی به بیرون‌بردن نداره، ولی دنیل باز هم دوست داره شنا کردنش رو تماشا کنه.", note: "دقت کنین: *has* برای سوم‌شخص مثبت، *doesn't have* برای منفی -- توی منفی، فعل اصلی به شکل سادهٔ *have* برمی‌گرده."}

exercises:
  en.a1.unit32.lesson01.exercise01.listen_animal:
    instruction: "گوش کنین و حیوونی که گفته شد رو انتخاب کنین."
    correct_option: "cat"
    distractors: ["dog", "fish", "bird"]
    accepted_answers: [{value: "cat", status: "correct"}]
    feedback: "*cat* یعنی گربه."
  en.a1.unit32.lesson01.exercise02.choose_swims_meaning:
    instruction: "کدوم حیوون معمولاً توی آب زندگی می‌کنه؟"
    correct_option: "fish"
    distractors: ["dog", "cat", "bird"]
    accepted_answers: [{value: "fish", status: "correct"}]
    feedback: "*fish* (ماهی) توی آب زندگی می‌کنه."
  en.a1.unit32.lesson01.exercise03.match_animals:
    instruction: "هر توضیح انگلیسی رو به کلمهٔ درستش وصل کنین."
    accepted_answers: [{value: [{left: "barks and likes walks", right: "dog"}, {left: "says meow", right: "cat"}, {left: "lives in water", right: "fish"}, {left: "can fly and sing", right: "bird"}, {left: "a general word for an animal you keep at home", right: "pet"}], status: "correct"}]
    feedback: "dog=سگ، cat=گربه، fish=ماهی، bird=پرنده، pet=حیوون خونگی."
  en.a1.unit32.lesson01.exercise04.order_dog_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["I", "have", "a", "dog."], status: "correct"}]
    feedback: "ترتیب درست: *I have a dog.* -- حرف تعریف *a* قبل از اسم مفرد اجباریه."
  en.a1.unit32.lesson01.exercise05.write_pet_word:
    instruction: "کلمه‌ای رو بنویسین که یعنی حیوونی که می‌تونه پرواز کنه و آواز بخونه."
    accepted_answers: [{value: "bird", status: "correct"}]
    feedback: "*bird* یعنی پرنده."

  en.a1.unit32.lesson02.exercise01.listen_question:
    instruction: "گوش کنین و جمله‌ای که شنیدین رو انتخاب کنین."
    correct_option: "Do you have any pets?"
    distractors: ["Do you have a dog?", "Do you like animals?", "What is your pet's name?"]
    accepted_answers: [{value: "Do you have any pets?", status: "correct"}]
    feedback: "*Do you have any pets?* یعنی حیوون خونگی داری؟"
  en.a1.unit32.lesson02.exercise02.choose_friendly_meaning:
    instruction: "کدوم کلمه یعنی حیوونی که با آدم‌ها مهربونه؟"
    correct_option: "friendly"
    distractors: ["small", "play", "walk"]
    accepted_answers: [{value: "friendly", status: "correct"}]
    feedback: "*friendly* یعنی مهربون و خوش‌برخورد."
  en.a1.unit32.lesson02.exercise03.choose_walk_meaning:
    instruction: "کدوم کلمه یعنی سگ رو برای ورزش بردن بیرون؟"
    correct_option: "walk"
    distractors: ["play", "friendly", "small"]
    accepted_answers: [{value: "walk", status: "correct"}]
    feedback: "*walk* با مفعول یعنی بیرون بردن سگ: *I walk my dog*."
  en.a1.unit32.lesson02.exercise04.order_play_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["My", "dog", "likes", "to", "play."], status: "correct"}]
    feedback: "ترتیب درست: *My dog likes to play.* -- بعد از *likes*، فعل دوم با *to* میاد."
  en.a1.unit32.lesson02.exercise05.translate_walk_dog:
    instruction: "ترجمه کنین: «من هر روز سگم رو می‌برم بیرون.»"
    accepted_answers: [{value: "I walk my dog every day.", status: "correct"}, {value: "I walk my dog every day", status: "correct"}]
    feedback: "*I walk my dog every day.* -- فعل *walk* با مفعول یعنی بیرون بردن سگ."

  en.a1.unit32.lesson03.exercise01.comprehension_cat_name:
    instruction: "طبق گفتگو، اسم گربهٔ میا چیه؟"
    correct_option: "Luna"
    distractors: ["Max", "Bella", "Coco"]
    accepted_answers: [{value: "Luna", status: "correct"}]
    feedback: "میا می‌گه اسم گربه‌ش لوناست: *Her name is Luna.*"
  en.a1.unit32.lesson03.exercise02.comprehension_daniel_wants:
    instruction: "طبق گفتگو، دنیل چی می‌خواد؟"
    correct_option: "a dog"
    distractors: ["a cat", "a bird", "a new fish"]
    accepted_answers: [{value: "a dog", status: "correct"}]
    feedback: "دنیل می‌گه یه سگ می‌خواد: *I want a dog.*"
  en.a1.unit32.lesson03.exercise03.listen_dialogue_toy:
    instruction: "طبق گفتگو، لونا دوست داره با چی بازی کنه؟"
    correct_option: "ball"
    distractors: ["a toy mouse", "string", "a shoe"]
    accepted_answers: [{value: "ball", status: "correct"}]
    feedback: "میا می‌گه لونا عاشق بازی با توپه: *she loves to play with a ball.*"
  en.a1.unit32.lesson03.exercise04.respond_own_pet:
    instruction: "بگین حیوون خونگی دارین یا نه، و چه حیوونی."
    accepted_answers: ["I have a dog", "I have a dog.", "I have a cat", "I have a cat.", "I have a fish", "I have a fish.", "I have a bird", "I have a bird.", "I don't have any pets", "I don't have any pets.", "I do not have any pets", "I do not have any pets."]
    feedback: "می‌تونین بگین *I have a dog/cat/fish/bird* یا *I don't have any pets* -- توی جملهٔ منفی هم *any* ترجمه نمی‌شه."

  en.a1.unit32.lesson04.exercise01.reading_max_size:
    instruction: "طبق متن، مکس چطور سگیه؟"
    correct_option: "big and very friendly"
    distractors: ["small and shy", "old and slow", "small and friendly"]
    accepted_answers: [{value: "big and very friendly", status: "correct"}]
    feedback: "متن می‌گه مکس بزرگ و خیلی مهربونه: *He is big and very friendly.*"
  en.a1.unit32.lesson04.exercise02.reading_who_walks_dog:
    instruction: "طبق متن، کی هر روز صبح سگش رو می‌بره بیرون؟"
    correct_option: "Leila"
    distractors: ["Daniel", "Mia", "both of them"]
    accepted_answers: [{value: "Leila", status: "correct"}]
    feedback: "متن می‌گه لیلا هر روز صبح مکس رو می‌بره بیرون."
  en.a1.unit32.lesson04.exercise03.reading_daniels_pet:
    instruction: "طبق متن، دنیل چه حیوون خونگی‌ای داره؟"
    correct_option: "a fish"
    distractors: ["a dog", "a cat", "a bird"]
    accepted_answers: [{value: "a fish", status: "correct"}]
    feedback: "متن می‌گه دنیل سگ نداره، ولی یه ماهی کوچیک داره."
  en.a1.unit32.lesson04.exercise04.write_own_pet_sentence:
    instruction: "یه جمله دربارهٔ حیوونی که دارین یا می‌خواین بنویسین، با *I have* یا *I want*."
    accepted_answers: ["I have a dog", "I have a dog.", "I have a cat", "I have a cat.", "I have a fish", "I have a fish.", "I have a bird", "I have a bird.", "I want a dog", "I want a dog.", "I want a cat", "I want a cat."]
    feedback: "می‌تونین از الگوی *I have a...* یا *I want a...* استفاده کنین -- حرف تعریف *a* رو جا نندازین."
