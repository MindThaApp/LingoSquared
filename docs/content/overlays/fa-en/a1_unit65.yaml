  en.a1.unit65.lesson04.teach.reading_passage: {title: "متن: تعویض در فروشگاه", gloss: "تعویض در فروشگاه: دنیل یک پیراهن آبی خرید، اما سایزش خیلی کوچک بود. او با رسید به فروشگاه برگشت. فروشنده رسید رو خواست و یک سایز بزرگ‌تر پیشنهاد داد. دنیل پیراهن رو تعویض کرد. او پول برگشتی لازم نداشت، چون پیراهن آبی بزرگ‌تر خوب بود.", note: "این متن روند سادهٔ پس دادن و تعویض یک لباس رو تعریف می‌کنه."}

