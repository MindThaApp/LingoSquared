review: {status: "unreviewed", required_next_reviewer: "codex", notes: "New overlay against the shared English realization unit55 (visiting a public swimming pool). Authored fully at schema_version 1.1, every kind: vocabulary teaching card has a matching example_gloss:. Contrastive-grammar points for this unit: (1) 'Do I need a swim cap?' -- English need functions as an ordinary main verb here, so the question requires dummy do-support (Do I need...?), while Farsi's equivalent لازمه is an impersonal predicate needing no auxiliary verb at all (کلاه شنا لازمه؟) -- flagged on that phrase card, since Farsi speakers often default to a bare need-word-order question. (2) the passive 'swim caps ARE REQUIRED in the pool' -- English states the pool rule with a true passive construction (be + past participle, no stated agent), while Farsi typically states the same rule with an active, impersonal باید construction (باید کلاه شنا بذارین) -- flagged on the dialogue line that uses it, since English passive voice has no single one-word Farsi equivalent. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, not translated Farsi lefts, per the established fa-en convention. Every listen_select/multiple_choice distractor in lesson03/lesson04 is an invented value never stated elsewhere in this unit (invented prices, invented payment types, invented times) -- checked the dialogue's own lines (Lifeguard: 6 lines; Daniel: 'Yes, two tickets, please.', 'Where are the lockers?'; Mia: 'Do we need a swim cap?', 'What time do you close?') to confirm no distractor reuses a fact the tested speaker states elsewhere in the same audio. Strong sibling-isolation rule applied -- nl-en/prs-en overlays and the concurrent units 39-48 dispatch were not consulted. Needs the mandatory fresh-context review before shipping, and inherits the underlying realization's own still-unreviewed status."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit55.swimming_pool: {title: "رفتن به استخر"}

lessons:
  en.a1.unit55.lesson01.swimming_pool_vocabulary: {title: "کلمات استخر"}
  en.a1.unit55.lesson02.phrases_for_the_swimming_pool: {title: "عبارت‌های استخر"}
  en.a1.unit55.lesson03.dialogue_at_the_swimming_pool: {title: "گفتگو: در استخر"}
  en.a1.unit55.lesson04.a_trip_to_the_swimming_pool: {title: "متن: رفتن به استخر"}

teaching:
  en.a1.unit55.lesson01.teach.swimming_pool: {title: "swimming pool", gloss: "استخر", note: "*swimming pool* یعنی جای عمومی با استخر بزرگ که مردم برای شنا میرن.", example_gloss: "استخر هر روز صبح باز می‌شه."}
  en.a1.unit55.lesson01.teach.ticket: {title: "ticket", gloss: "بلیت", note: "*ticket* یعنی کارت یا کاغذی که برای ورود به استخر می‌خرین.", example_gloss: "برای ورود به استخر بلیت لازم دارین."}
  en.a1.unit55.lesson01.teach.locker: {title: "locker", gloss: "کمد قفل‌دار", note: "*locker* یعنی یه فضای کوچیک قفل‌دار برای وسایلتون.", example_gloss: "کیفتون رو تو کمد قفل‌دار بذارین."}
  en.a1.unit55.lesson01.teach.swim_cap: {title: "swim cap", gloss: "کلاه شنا", note: "*swim cap* یعنی کلاهی که موقع شنا سرتون می‌ذارین.", example_gloss: "لطفاً تو استخر کلاه شنا بذارین."}
  en.a1.unit55.lesson01.teach.rules: {title: "rules", gloss: "قوانین", note: "*rules* یعنی دستوراتی که همه تو استخر باید رعایت کنن.", example_gloss: "قبل از شنا قوانین استخر رو بخونین."}
  en.a1.unit55.lesson01.teach.lifeguard: {title: "lifeguard", gloss: "غریق‌نجات", note: "*lifeguard* یعنی کسی که مراقب شناگرهاست تا ایمن باشن.", example_gloss: "غریق‌نجات هر روز مراقب استخره."}

  en.a1.unit55.lesson02.teach.id_like_to_buy_a_ticket: {title: "I'd like to buy a ticket, please.", gloss: "می‌خوام یه بلیت بخرم، لطفاً."}
  en.a1.unit55.lesson02.teach.where_are_the_lockers: {title: "Where are the lockers?", gloss: "کمدها کجان؟"}
  en.a1.unit55.lesson02.teach.what_time_do_you_open: {title: "What time do you open?", gloss: "چه ساعتی باز می‌کنین؟"}
  en.a1.unit55.lesson02.teach.its_five_dollars_for_one_ticket: {title: "It's five dollars for one ticket.", gloss: "پنج دلار برای یه بلیته."}
  en.a1.unit55.lesson02.teach.do_i_need_a_swim_cap: {title: "Do I need a swim cap?", gloss: "کلاه شنا لازم دارم؟", note: "انگلیسی برای این سؤال از فعل کمکی *do* استفاده می‌کنه (Do I need...?)، چون *need* اینجا مثل یه فعل اصلی عادیه؛ فارسی «لازمه» بدون هیچ فعل کمکی‌ای سؤال می‌سازه (کلاه شنا لازمه؟)."}
  en.a1.unit55.lesson02.teach.we_close_at_eight: {title: "We close at eight o'clock.", gloss: "ساعت هشت می‌بندیم."}

  en.a1.unit55.lesson03.teach.dialogue_line1: {title: "سلام غریق‌نجات", gloss: "غریق‌نجات می‌گه: سلام! امروز اومدین شنا کنین؟"}
  en.a1.unit55.lesson03.teach.dialogue_line2: {title: "درخواست دنیل", gloss: "دنیل می‌گه: بله، دو تا بلیت، لطفاً."}
  en.a1.unit55.lesson03.teach.dialogue_line3: {title: "قیمت بلیت", gloss: "غریق‌نجات می‌گه: البته! پنج دلار برای یه بلیته."}
  en.a1.unit55.lesson03.teach.dialogue_line4: {title: "سؤال میا دربارهٔ کلاه شنا", gloss: "میا می‌گه: کلاه شنا لازم داریم؟"}
  en.a1.unit55.lesson03.teach.dialogue_line5: {title: "قانون کلاه شنا", gloss: "غریق‌نجات می‌گه: بله، تو استخر کلاه شنا اجباریه.", note: "*swim caps ARE REQUIRED* یه ساختار مجهوله (be + قسمت سوم فعل) که قانون رو بدون گفتن اینکه کی این قانون رو گذاشته بیان می‌کنه؛ فارسی معمولاً همین قانون رو با یه ساختار معلوم و غیرشخصی مثل «باید» می‌گه (باید کلاه شنا بذارین)، نه یه معادل یک‌کلمه‌ای برای مجهول انگلیسی."}
  en.a1.unit55.lesson03.teach.dialogue_line6: {title: "سؤال دنیل دربارهٔ کمدها", gloss: "دنیل می‌گه: کمدها کجان؟"}
  en.a1.unit55.lesson03.teach.dialogue_line7: {title: "جواب دربارهٔ کمدها", gloss: "غریق‌نجات می‌گه: کمدها نزدیک ورودی‌ان."}
  en.a1.unit55.lesson03.teach.dialogue_line8: {title: "پول کمدها", gloss: "غریق‌نجات می‌گه: یه سکهٔ یک‌دلاری لازم دارن."}
  en.a1.unit55.lesson03.teach.dialogue_line9: {title: "سؤال میا دربارهٔ ساعت بستن", gloss: "میا می‌گه: چه ساعتی می‌بندین؟"}
  en.a1.unit55.lesson03.teach.dialogue_line10: {title: "ساعت بستن", gloss: "غریق‌نجات می‌گه: ساعت هشت می‌بندیم."}

  en.a1.unit55.lesson04.teach.reading_passage: {title: "متن: رفتن به استخر", gloss: "یه بعدازظهر گرم تو ماه ژوئیه، دنیل و میا تصمیم گرفتن تو استخر عمومی محله خنک بشن. نزدیک ورودی، یه تابلو قوانین استخر رو نشون می‌داد: دویدن ممنوع، و تو استخر کلاه شنا اجباریه. اونا از غریق‌نجات دو تا بلیت خواستن. هر بلیت پنج دلار بود. غریق‌نجات توضیح داد کمدها نزدیک ورودی‌ان و یه سکهٔ یک‌دلاری لازم دارن. دنیل و میا کیف‌هاشون رو تو یه کمد گذاشتن و تقریباً دو ساعت شنا کردن. قبل از اینکه برن، دوباره تابلو رو چک کردن: استخر ساعت هشت می‌بنده. میا گفت می‌خواد آخر هفتهٔ بعد برگرده و تخته‌شیرجه رو امتحان کنه."}

exercises:
  en.a1.unit55.lesson01.exercise01.listen_word:
    instruction: "گوش کنین و کلمه‌ای که گفته شد رو انتخاب کنین."
    correct_option: "locker"
    distractors: ["swimming pool", "ticket", "swim cap", "rules"]
    accepted_answers: [{value: "locker", status: "correct"}]
    feedback: "*locker* یعنی کمد قفل‌دار."
  en.a1.unit55.lesson01.exercise02.choose_lifeguard_meaning:
    instruction: "کدوم کلمه یعنی کسی که مراقب شناگرهاست تا ایمن باشن؟"
    correct_option: "lifeguard"
    distractors: ["ticket", "locker", "rules"]
    accepted_answers: [{value: "lifeguard", status: "correct"}]
    feedback: "*lifeguard* یعنی غریق‌نجات."
  en.a1.unit55.lesson01.exercise03.match_pool_words:
    instruction: "هر توضیح انگلیسی رو به کلمهٔ درستش وصل کنین."
    accepted_answers: [{value: [{left: "swimming pool", right: "a public place with a large pool where people go to swim"}, {left: "ticket", right: "the card or paper you buy to enter the pool"}, {left: "locker", right: "a small locked space where you keep your bag and clothes"}, {left: "swim cap", right: "a tight cap you wear on your head while swimming"}, {left: "rules", right: "the instructions everyone at the pool must follow"}, {left: "lifeguard", right: "the person who watches swimmers to keep them safe"}], status: "correct"}]
    feedback: "swimming pool=استخر، ticket=بلیت، locker=کمد قفل‌دار، swim cap=کلاه شنا، rules=قوانین، lifeguard=غریق‌نجات."
  en.a1.unit55.lesson01.exercise04.order_lifeguard_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["The", "lifeguard", "watches", "the", "pool", "every", "day."], status: "correct"}]
    feedback: "ترتیب درست: *The lifeguard watches the pool every day.*"
  en.a1.unit55.lesson01.exercise05.write_ticket:
    instruction: "کلمه‌ای رو بنویسین که یعنی چیزی که باید قبل از ورود به استخر بخرین."
    accepted_answers: [{value: "ticket", status: "correct"}]
    feedback: "*ticket* یعنی بلیت."

  en.a1.unit55.lesson02.exercise01.listen_phrase:
    instruction: "گوش کنین و عبارتی که شنیدین رو انتخاب کنین."
    correct_option: "What time do you open?"
    distractors: ["I'd like to buy a ticket, please.", "Where are the lockers?", "Do I need a swim cap?"]
    accepted_answers: [{value: "What time do you open?", status: "correct"}]
    feedback: "*What time do you open?* یعنی چه ساعتی باز می‌کنین؟"
  en.a1.unit55.lesson02.exercise02.choose_buy_ticket_meaning:
    instruction: "کدوم عبارت رو مشتری برای خرید بلیت می‌گه؟"
    correct_option: "I'd like to buy a ticket, please."
    distractors: ["Where are the lockers?", "We close at eight o'clock.", "Do I need a swim cap?"]
    accepted_answers: [{value: "I'd like to buy a ticket, please.", status: "correct"}]
    feedback: "*I'd like to buy a ticket, please.* یعنی می‌خوام یه بلیت بخرم، لطفاً."
  en.a1.unit55.lesson02.exercise03.choose_close_time_meaning:
    instruction: "کدوم عبارت می‌گه استخر چه ساعتی می‌بنده؟"
    correct_option: "We close at eight o'clock."
    distractors: ["What time do you open?", "It's five dollars for one ticket.", "Do I need a swim cap?"]
    accepted_answers: [{value: "We close at eight o'clock.", status: "correct"}]
    feedback: "*We close at eight o'clock.* یعنی ساعت هشت می‌بندیم."
  en.a1.unit55.lesson02.exercise04.order_price_sentence:
    instruction: "کلمات رو به ترتیب درست بچینین."
    accepted_answers: [{value: ["It's", "five", "dollars", "for", "one", "ticket."], status: "correct"}]
    feedback: "ترتیب درست: *It's five dollars for one ticket.*"
  en.a1.unit55.lesson02.exercise05.translate_swim_cap_question:
    instruction: "ترجمه کنین: «کلاه شنا لازم دارم؟»"
    accepted_answers: [{value: "Do I need a swim cap?", status: "correct"}]
    feedback: "*Do I need a swim cap?* یعنی کلاه شنا لازم دارم؟"

  en.a1.unit55.lesson03.exercise01.comprehension_ticket_price:
    instruction: "طبق گفتگو، یه بلیت چقدر قیمت داره؟"
    correct_option: "five dollars"
    distractors: ["three dollars", "eight dollars", "ten dollars"]
    accepted_answers: [{value: "five dollars", status: "correct"}]
    feedback: "غریق‌نجات می‌گه پنج دلاره."
  en.a1.unit55.lesson03.exercise02.comprehension_locker_payment:
    instruction: "طبق گفتگو، کمدها چی لازم دارن؟"
    correct_option: "a dollar coin"
    distractors: ["a key card", "a quarter", "a token"]
    accepted_answers: [{value: "a dollar coin", status: "correct"}]
    feedback: "غریق‌نجات می‌گه سکهٔ یک‌دلاری لازم دارن."
  en.a1.unit55.lesson03.exercise03.listen_dialogue_close_time:
    instruction: "طبق گفتگو، استخر چه ساعتی می‌بنده؟"
    correct_option: "eight o'clock"
    distractors: ["six o'clock", "seven o'clock", "nine o'clock"]
    accepted_answers: [{value: "eight o'clock", status: "correct"}]
    feedback: "غریق‌نجات می‌گه ساعت هشت می‌بندن."
  en.a1.unit55.lesson03.exercise04.respond_own_pool_statement:
    instruction: "بگین یه بلیت چقدر قیمت داره، کمدها چی لازم دارن، یا استخر چه ساعتی می‌بنده."
    accepted_answers: ["It's five dollars for one ticket", "It's five dollars for one ticket.", "They need a dollar coin", "They need a dollar coin.", "We close at eight o'clock", "We close at eight o'clock.", "Swim caps are required in the pool", "Swim caps are required in the pool."]
    feedback: "می‌تونین بگین *It's five dollars for one ticket* یا *We close at eight o'clock*."

  en.a1.unit55.lesson04.exercise01.reading_reason:
    instruction: "طبق متن، چرا دنیل و میا به استخر رفتن؟"
    correct_option: "to cool off"
    distractors: ["to meet friends", "to exercise for a race", "to take photos"]
    accepted_answers: [{value: "to cool off", status: "correct"}]
    feedback: "متن می‌گه اونا خواستن خنک بشن."
  en.a1.unit55.lesson04.exercise02.reading_locker_payment:
    instruction: "طبق متن، کمدها چی لازم دارن؟"
    correct_option: "a dollar coin"
    distractors: ["a key card", "a quarter", "a token"]
    accepted_answers: [{value: "a dollar coin", status: "correct"}]
    feedback: "متن می‌گه کمدها سکهٔ یک‌دلاری لازم دارن."
  en.a1.unit55.lesson04.exercise03.reading_close_time:
    instruction: "طبق متن، استخر چه ساعتی می‌بنده؟"
    correct_option: "eight o'clock"
    distractors: ["six o'clock", "seven o'clock", "nine o'clock"]
    accepted_answers: [{value: "eight o'clock", status: "correct"}]
    feedback: "متن می‌گه استخر ساعت هشت می‌بنده."
  en.a1.unit55.lesson04.exercise04.write_own_pool_message:
    instruction: "یه پیام کوتاه بنویسین: بگین یه بلیت چقدر قیمت داره، و بگین استخر چه ساعتی می‌بنده."
    accepted_answers: ["It's five dollars for one ticket, and the pool closes at eight o'clock.", "It's five dollars for one ticket. The pool closes at eight o'clock.", "It's five dollars for one ticket and the pool closes at eight o'clock."]
    feedback: "می‌تونین بگین *It's five dollars for one ticket, and the pool closes at eight o'clock.*"
