review: {status: "reviewed", required_next_reviewer: null, notes: "New overlay against the shared English realization unit41 (cooking), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1, every teaching card with a realization example: has a matching example_gloss:. Contrastive-grammar points, deliberately different from ones already used in this direction: (1) present continuous with -ing plus the auxiliary be for an action happening right now (What ARE you cookING?) -- Persian marks the same ongoing-action meaning with a completely different strategy, a separate auxiliary داشتن placed before an UNCHANGED present-tense verb (داری می‌پزی), so English's suffix-on-the-main-verb approach is flagged as the structural difference, not just a vocabulary gap; (2) the polite request modal Can you chop the onions for me? -- functions as a request, not a literal ability question, which maps naturally onto Persian's own می‌تونی/می‌شه pragmatics, but the note flags that English Can you...? still grammatically keeps its literal ability-question form even when used as a request, unlike some Persian politeness markers; (3) the obligatory definite article before a specific, already-in-view object (chop THE onions, boil THE pasta, referring to the onions/pasta already on the counter in this exact scene) -- Persian has no article at all and marks specificity through word order and context instead, so learners must add a word that has no one-to-one Persian counterpart. matching_pairs accepted_answers use the realization's ENGLISH pair lefts verbatim, NOT translated Persian lefts, per the established compiler-driven precedent. lesson03/lesson04 multiple_choice and listen_select distractor sets copied verbatim from the realization's own review notes documenting the exact invented, never-spoken-in-this-unit values already verified safe. Strong sibling-isolation rule applied -- nl-en/prs-en overlays for this unit were not consulted. Needs the mandatory fresh-context review before shipping.\n\nfa-en review 2026-10-19: Checked notes, glosses, Persian style, distractors, answers, canon and sequencing. 11 fixes: Persian article note made accurate, reading gloss (often, not more; subject of chopped), ZWNJ, 9 untaught distractors replaced (set the table, salty, bland, pepper, perfectly, cookbook, nothing, spicy), missing answers added. Realization example 'This soup needs you to add some salt.' is unnatural (flagged, not edited)."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit41.cooking: {title: "پختن یه غذای ساده"}

lessons:
  en.a1.unit41.lesson01.cooking_vocabulary: {title: "کلمات آشپزی"}
  en.a1.unit41.lesson02.preparing_a_meal: {title: "آماده کردن غذا"}
  en.a1.unit41.lesson03.dialogue_cooking_together: {title: "گفتگو: آشپزی با هم"}
  en.a1.unit41.lesson04.cooking_together: {title: "متن: آشپزی با هم"}

teaching:
  en.a1.unit41.lesson01.teach.cook: {title: "cook", gloss: "آشپزی کردن / پختن", note: "*cook* هم فعله (پختن) هم اسمه (آشپز)؛ اینجا به‌عنوان فعل استفاده شده.", example_gloss: "من دوست دارم برای دوستام شام بپزم."}
  en.a1.unit41.lesson01.teach.recipe: {title: "recipe", gloss: "دستور پخت", note: "*recipe* یعنی دستور پخت -- مراحل نوشته‌شده برای درست کردن یه غذا.", example_gloss: "این دستور پخت مادربزرگمه."}
  en.a1.unit41.lesson01.teach.ingredient: {title: "ingredient", gloss: "مادهٔ اولیه", note: "*ingredient* یعنی یکی از موادی که توی یه غذا استفاده می‌شه.", example_gloss: "پیاز اولین مادهٔ اولیهٔ این دستور پخته."}
  en.a1.unit41.lesson01.teach.chop: {title: "chop", gloss: "خرد کردن", note: "*chop* یعنی خرد کردن غذا به تیکه‌های کوچیک.", example_gloss: "می‌تونی پیازها رو برام خرد کنی؟"}
  en.a1.unit41.lesson01.teach.boil: {title: "boil", gloss: "جوشوندن", note: "*boil* یعنی جوشوندن یه مایع تا خیلی داغ و پرحباب بشه.", example_gloss: "باید آب رو برای پاستا بجوشونم."}
  en.a1.unit41.lesson01.teach.taste: {title: "taste", gloss: "چشیدن / مزه کردن", note: "*taste* یعنی یه‌کم از غذا رو امتحان کردن تا مزه‌شو بفهمین.", example_gloss: "می‌تونی سس رو بچشی و بگی نمک لازم داره یا نه؟"}

  en.a1.unit41.lesson02.teach.make_dinner: {title: "make dinner", gloss: "شام درست کردن", note: "*make dinner* یعنی شام درست کردن.", example_gloss: "امشب می‌خوام شام درست کنم."}
  en.a1.unit41.lesson02.teach.follow_a_recipe: {title: "follow a recipe", gloss: "طبق دستور پخت عمل کردن", note: "*follow a recipe* یعنی دقیقاً طبق مراحل نوشته‌شده پیش رفتن.", example_gloss: "من همیشه وقتی کیک می‌پزم طبق دستور پخت عمل می‌کنم."}
  en.a1.unit41.lesson02.teach.chop_the_onions: {title: "chop the onions", gloss: "پیازها رو خرد کردن", note: "*chop THE onions* -- اینجا *the* اجباریه چون منظور همون پیازهای مشخصیه که جلوتونه؛ فارسی حرف تعریف معینی مثل *the* نداره، پس این نکته باید جدا حفظ بشه.", example_gloss: "می‌تونی پیازها رو برای سس خرد کنی؟"}
  en.a1.unit41.lesson02.teach.boil_the_pasta: {title: "boil the pasta", gloss: "پاستا رو جوشوندن", note: "*boil THE pasta* -- همون قانون *the* برای چیز مشخص.", example_gloss: "یادت نره پاستا رو ده دقیقه بجوشونی."}
  en.a1.unit41.lesson02.teach.add_some_salt: {title: "add some salt", gloss: "یه‌کم نمک اضافه کردن", note: "*add some salt* -- *some* برای مقدار نامشخص از یه اسم غیرقابل‌شمارش مثل نمک.", example_gloss: "این سوپ لازمه یه‌کم نمک بهش اضافه کنی."}
  en.a1.unit41.lesson02.teach.what_are_you_cooking_question: {title: "What are you cooking?", gloss: "چی داری می‌پزی؟", note: "*What ARE you cookING?* -- حال استمراری با پسوند *-ing* روی فعل اصلی؛ فارسی همین معنی رو با فعل کمکی جدای *داشتن* + فعل حال ساده می‌سازه: «داری می‌پزی» -- فعل اصلی خودش تغییر شکل نمی‌گیره، فقط یه فعل کمک جلوش میاد."}

  en.a1.unit41.lesson03.teach.dialogue_line1: {title: "پیشنهاد میا", gloss: "میا می‌گه امشب پاستا درست می‌کنه و می‌پرسه دنیل می‌خواد کمک کنه؟", note: "*Do you want to help me cook?* -- سؤال دعوت به کمک کردن."}
  en.a1.unit41.lesson03.teach.dialogue_line2: {title: "جواب دنیل", gloss: "دنیل می‌گه حتماً، ولی می‌گه آشپز خیلی خوبی نیست.", note: "*though* آخر جمله یعنی «البته» یا «هرچند» -- برای نرم کردن یه جملهٔ قبلی."}
  en.a1.unit41.lesson03.teach.dialogue_line3: {title: "جواب میا", gloss: "میا می‌گه اشکالی نداره، بهش نشون می‌ده -- می‌پرسه می‌تونه این پیازها رو خرد کنه؟", note: "*Can you chop these onions?* -- درخواست مؤدبانه با *can*."}
  en.a1.unit41.lesson03.teach.dialogue_line4: {title: "جواب دنیل", gloss: "دنیل می‌گه مشکلی نیست و می‌پرسه چقدر ریز خردشون کنه.", note: "*How small should I chop them?* -- *should* برای پرسیدن پیشنهاد یا راهنمایی."}
  en.a1.unit41.lesson03.teach.dialogue_line5: {title: "جواب میا", gloss: "میا می‌گه تیکه‌های کوچیک، مثل این -- حالا بریم پاستا رو بجوشونیم.", note: "*Now let's boil the pasta* -- *let's* یعنی «بیا با هم»، پیشنهاد یه کار مشترک."}
  en.a1.unit41.lesson03.teach.dialogue_line6: {title: "سؤال دنیل", gloss: "دنیل می‌پرسه می‌تونه سس رو بچشه -- می‌گه خیلی خوشمزه‌ست!", note: "*It's delicious!* -- ابراز رضایت از مزه."}
  en.a1.unit41.lesson03.teach.dialogue_line7: {title: "جواب میا", gloss: "میا می‌گه عالیه، شام تقریباً آماده‌ست.", note: "*almost ready* -- *almost* یعنی «تقریباً»، هنوز کامل تموم نشده."}

  en.a1.unit41.lesson04.teach.reading_passage: {title: "متن: آشپزی با هم", gloss: "دنیل، لیلا و میا هر کدوم مهارت آشپزی متفاوتی دارن. از وقتی لیلا به آپارتمان جدیدش نزدیک میا نقل‌مکان کرد، این سه تا دوست اغلب با هم شام درست می‌کنن. لیلا آشپز خوبیه. اون اغلب با دستور پخت قدیمی مادرش پاستا درست می‌کنه. میا هم عاشق آشپزیه، و به دنیل یاد داد چطور پیازها رو بدون بریدن انگشتاش خرد کنه. دنیل هنوز آشپز فوق‌العاده‌ای نیست، ولی داره سریع یاد می‌گیره. دیشب، میا از دنیل خواست کمکش کنه پاستا درست کنه. دنیل پیازها رو خرد کرد درحالی‌که میا پاستا رو می‌جوشوند و سس درست می‌کرد. دنیل سس رو چشید و گفت خیلی خوشمزه‌ست. لیلا درست همون موقع که شام آماده شد رسید، و هر سه با هم توی آشپزخونهٔ میا غذا خوردن.", note: "دقت کنین *while* برای دو تا کار هم‌زمان استفاده می‌شه: *he chopped the onions while Mia boiled the pasta* -- یعنی دو تا کار هم‌زمان اتفاق افتادن."}

exercises:
