    feedback: "ترتیب درست: *Don't forget to boil the pasta for ten minutes.*"
  en.a1.unit41.lesson02.exercise05.translate_what_are_you_cooking:
    instruction: "ترجمه کنین: «چی داری می‌پزی؟»"
    accepted_answers: [{value: "What are you cooking?", status: "correct"}, {value: "What are you cooking", status: "correct"}]
    feedback: "*What are you cooking?*"

  en.a1.unit41.lesson03.exercise01.comprehension_daniel_task:
    instruction: "طبق گفتگو، میا از دنیل می‌خواد چیکار کنه؟"
    correct_option: "chop the onions"
    distractors: ["boil the pasta", "wash the dishes", "do the laundry"]
    accepted_answers: [{value: "chop the onions", status: "correct"}]
    feedback: "میا از دنیل می‌خواد پیازها رو خرد کنه."
  en.a1.unit41.lesson03.exercise02.comprehension_next_step:
    instruction: "طبق گفتگو، میا می‌گه بعد از خرد کردن پیازها چیکار کنن؟"
    correct_option: "boil the pasta"
    distractors: ["chop the onions", "wash the dishes", "add some salt"]
    accepted_answers: [{value: "boil the pasta", status: "correct"}]
    feedback: "میا می‌گه حالا بریم پاستا رو بجوشونیم."
  en.a1.unit41.lesson03.exercise03.listen_dialogue_sauce_opinion:
    instruction: "طبق گفتگو، دنیل دربارهٔ سس چی می‌گه؟"
    correct_option: "it's delicious"
    distractors: ["it's too hot", "it needs some salt", "it's not very good"]
    accepted_answers: [{value: "it's delicious", status: "correct"}]
    feedback: "دنیل می‌گه سس خیلی خوشمزه‌ست."
  en.a1.unit41.lesson03.exercise04.respond_own_cooking:
    instruction: "دربارهٔ آشپزی یه چیزی بگین، یا بپرسین کسی چی داره می‌پزه."
    accepted_answers: ["I like to cook pasta", "I like to cook pasta.", "I'm not a very good cook", "I'm not a very good cook.", "I need to chop the onions", "I need to chop the onions.", "Can you help me cook?", "What are you cooking?", "I like to cook dinner.", "I'm making pasta tonight.", "I like to cook dinner for my friends.", "Can you chop the onions?"]
    feedback: "می‌تونین از الگوی *I like to cook ...* یا *What are you cooking?* استفاده کنین."

  en.a1.unit41.lesson04.exercise01.reading_mia_taught_daniel:
    instruction: "طبق متن، میا به دنیل چی یاد داد؟"
    correct_option: "chop onions without cutting his fingers"
    distractors: ["boil water for pasta", "make his own sauce", "follow a recipe"]
    accepted_answers: [{value: "chop onions without cutting his fingers", status: "correct"}]
    feedback: "متن می‌گه میا به دنیل یاد داد چطور پیازها رو بدون بریدن انگشتاش خرد کنه."
  en.a1.unit41.lesson04.exercise02.reading_leila_recipe:
    instruction: "طبق متن، لیلا اغلب با کدوم دستور پخت پاستا درست می‌کنه؟"
