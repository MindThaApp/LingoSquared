  en.a1.unit41.lesson01.exercise02.choose_chop_meaning:
    instruction: "کدوم کلمه یعنی خرد کردن غذا به تیکه‌های کوچیک؟"
    correct_option: "chop"
    distractors: ["boil", "taste", "cook"]
    accepted_answers: [{value: "chop", status: "correct"}]
