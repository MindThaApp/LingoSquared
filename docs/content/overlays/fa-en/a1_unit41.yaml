    distractors: ["her grandmother's recipe", "her own new recipe", "a recipe from Mia"]
    accepted_answers: [{value: "her mother's old recipe", status: "correct"}]
    feedback: "متن می‌گه لیلا با دستور پخت قدیمی مادرش پاستا درست می‌کنه."
  en.a1.unit41.lesson04.exercise03.reading_daniel_sauce_reaction:
    instruction: "طبق متن، دنیل وقتی سسی رو که کمک کرده بود درست بشه چشید چی گفت؟"
    correct_option: "he said it was delicious"
    distractors: ["he said it needed more salt", "he said it was not very good", "he said it was too hot"]
    accepted_answers: [{value: "he said it was delicious", status: "correct"}]
    feedback: "متن می‌گه دنیل گفت خیلی خوشمزه‌ست."
  en.a1.unit41.lesson04.exercise04.write_own_cooking_sentence:
    instruction: "یه جمله دربارهٔ آشپزی بنویسین، با «I cook...»، «I like to cook...» یا «I need to...»."
    accepted_answers: ["I cook pasta", "I cook pasta.", "I like to cook dinner", "I like to cook dinner.", "I need to chop the onions", "I need to chop the onions.", "I need to boil the water", "I need to boil the water.", "I cook dinner.", "I cook dinner for my friends.", "I like to cook pasta.", "I like to cook dinner for my friends.", "I need to boil the pasta.", "I need to add some salt.", "I need to boil the water for the pasta."]
    feedback: "می‌تونین از الگوی *I cook...*، *I like to cook...* یا *I need to...* استفاده کنین."
