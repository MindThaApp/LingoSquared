review: {status: "reviewed", required_next_reviewer: null, notes: "New overlay against the shared English realization unit34 (sports/exercise), itself still unreviewed -- this overlay inherits that dependency. Authored fully at schema_version 1.1 from the start, every teaching card that has a realization example: got a matching example_gloss:. Two contrastive-grammar points, deliberately different from ones already used in this direction (frequency-adverb placement, gerund-after-like, do-support in questions, adjective-before-noun/ezafe, wear/zadan mismatch, dummy-it-subject, verb-per-mode/transportation lexicalization from unit33): (1) English's three-way sport/exercise verb collocation -- play + ball-and-team sports (soccer/tennis/basketball), go + gerund for activities you travel to do (swimming/running), do + individual/generic exercise (yoga/exercise) -- has no parallel three-way split in Persian, which generalizes almost everything with a light-verb-plus-noun pattern built on کردن (فوتبال بازی کردن, شنا کردن, یوگا کار کردن, ورزش کردن all use کردن/بازی کردن rather than three lexically distinct main verbs), so a Persian speaker must memorize which of the three English verbs pairs with which activity category rather than reuse one generalizable structure; (2) English's distributive/rate a in frequency phrases (twice a week, three times a week) uses the indefinite article to mean per/each rather than one/a(n) -- a genuinely different function from its ordinary determiner use -- while Persian expresses the same rate meaning with the preposition در (در هفته) or the suffix ی (هفته‌ای), never with anything resembling an article. Strong sibling-isolation rule applied -- nl-en/prs-en overlays for this same unit were not opened while authoring this file. Needs the mandatory fresh-context review before shipping.\n\nfa-en review 2026-10-19: full checklist. 7 fixes: swimming note contradicted its own example (Persian also says می‌رم شنا); reading note claimed all three sport verbs (only go/play appear); dialogue_line1 gloss dropped want/us; pool example_gloss word order; write_general_word wording; untaught distractor Once a week; respond_own_sport gained I like running / I prefer + sport. Native flag: یوگا کار کردن vs یوگا کردن. Shared-en r2 review 2026-10-22: answer lists and wording follow the realization change (reading simplified (dropped 'even though' for 'but'))."}

course:
  title: "انگلیسی A1"
  description: "آموزش مقدماتی انگلیسی برای مکالمات روزمره، با توضیحات دقیق فارسی."

units:
  en.a1.unit34.sports: {title: "ورزش و تمرین بدنی"}

lessons:
  en.a1.unit34.lesson01.sports_vocabulary: {title: "ورزش و تمرین"}
  en.a1.unit34.lesson02.frequency_and_places: {title: "هر چند وقت و کجا"}
  en.a1.unit34.lesson03.dialogue_weekend_plans: {title: "گفتگو: برنامه‌های آخر هفته"}
  en.a1.unit34.lesson04.staying_active_together: {title: "متن: فعال بودن با هم"}

teaching:
  en.a1.unit34.lesson01.teach.soccer: {title: "soccer", gloss: "فوتبال", note: "soccer یعنی فوتبال. با فعل play میاد: play soccer -- انگلیسی برای ورزش‌های تیمیِ توپی از فعل play استفاده می‌کنه. فارسی هم برای این‌جور ورزش‌ها از فعل ترکیبی «بازی کردن» استفاده می‌کنه (فوتبال بازی کردن)، ولی نکته اینه که انگلیسی برای دسته‌های دیگهٔ ورزش (go/do) فعل رو عوض می‌کنه، در حالی که فارسی معمولاً همون ساختار «اسم + کردن» رو برای همهٔ ورزش‌ها به‌کار می‌بره (شنا کردن، یوگا کار کردن، ورزش کردن) -- پس باید یاد بگیرین کدوم فعل انگلیسی با کدوم دستهٔ ورزش میاد.", example_gloss: "ما شنبه‌ها فوتبال بازی می‌کنیم."}
  en.a1.unit34.lesson01.teach.tennis: {title: "tennis", gloss: "تنیس", note: "tennis یعنی تنیس. مثل soccer، فعلش هم play هست: play tennis -- چون تنیس هم با توپ و وسیله بازی می‌شه، همون دستهٔ ورزش‌های توپی.", example_gloss: "اون هر آخر هفته تنیس بازی می‌کنه."}
  en.a1.unit34.lesson01.teach.basketball: {title: "basketball", gloss: "بسکتبال", note: "basketball یعنی بسکتبال. اینم با فعل play میاد: play basketball -- همون دستهٔ ورزش‌های توپی مثل soccer و tennis.", example_gloss: "اونا توی پارک بسکتبال بازی می‌کنن."}
  en.a1.unit34.lesson01.teach.swimming: {title: "swimming", gloss: "شنا", note: "swimming یعنی شنا. اینجا فعل عوض می‌شه: go swimming (نه play swimming) -- انگلیسی برای فعالیت‌هایی مثل شنا و دویدن از فعل go به‌همراه شکل ing-دار فعل استفاده می‌کنه. فارسی بیشتر «شنا کردن» می‌گه (هرچند «می‌رم شنا» هم داریم)، ولی انگلیسی هیچ‌وقت play swimming یا do swimming نمی‌گه؛ go swimming رو یه‌جا حفظ کنین.", example_gloss: "من هفته‌ای دو بار شنا می‌رم."}
  en.a1.unit34.lesson01.teach.yoga: {title: "yoga", gloss: "یوگا", note: "yoga یعنی یوگا. فعلش do هست: do yoga -- انگلیسی برای فعالیت‌های فردی مثل یوگا از فعل do استفاده می‌کنه، نه play و نه go. فارسی می‌گه «یوگا کار کردن»، ولی نکتهٔ مهم اینه که انگلیسی سه فعل جدا (play/go/do) داره که باید هرکدوم رو با دستهٔ درست ورزش جفت کنین، در حالی که فارسی معمولاً یه ساختار عمومی‌تر داره.", example_gloss: "اون صبح‌ها یوگا کار می‌کنه."}
  en.a1.unit34.lesson01.teach.exercise: {title: "exercise", gloss: "ورزش کردن / تمرین بدنی", note: "exercise یعنی ورزش‌کردن یا تمرین بدنی -- یه کلمهٔ عمومیه برای هر نوع فعالیت بدنی. برخلاف soccer/swimming/yoga، خودِ exercise هم می‌تونه مستقیم به‌عنوان فعل به‌کار بره، بدون اینکه لازم باشه play/go/do جلوش بیاد.", example_gloss: "هر روز ورزش می‌کنی؟"}

  en.a1.unit34.lesson02.teach.twice_a_week: {title: "twice a week", gloss: "هفته‌ای دو بار", note: "twice a week یعنی هفته‌ای دو بار. اینجا حرف تعریف نامعین a معنی معمولیش (یک/یه) رو نداره -- به‌جاش معنی «در هر» یا «به‌ازای هر» می‌ده: عدد + a + واحد زمان = چند بار در اون بازه. فارسی برای این معنا از حرف اضافهٔ در (در هفته) یا پسوند ی (هفته‌ای) استفاده می‌کنه، نه از یه حرف تعریف مثل انگلیسی.", example_gloss: "اون هفته‌ای دو بار تنیس بازی می‌کنه."}
  en.a1.unit34.lesson02.teach.three_times_a_week: {title: "three times a week", gloss: "هفته‌ای سه بار", note: "three times a week یعنی هفته‌ای سه بار. مثل twice a week، اینجا هم a معنی «در هر» می‌ده، نه «یک» -- times (بار، دفعه) به‌علاوهٔ a week (در هفته) با هم می‌شن «چند بار در هفته».", example_gloss: "اون هفته‌ای سه بار شنا می‌کنه."}
  en.a1.unit34.lesson02.teach.on_weekends: {title: "on weekends", gloss: "آخر هفته‌ها", note: "on weekends یعنی آخر هفته‌ها. حرف اضافهٔ on قبل از weekends میاد چون انگلیسی برای روزها و بازه‌های زمانی مشخص از on استفاده می‌کنه؛ فارسی برای این عبارت به هیچ حرف اضافه‌ای نیاز نداره -- می‌گیم «آخر هفته‌ها» بدون حرف اضافه.", example_gloss: "ما آخر هفته‌ها بسکتبال بازی می‌کنیم."}
  en.a1.unit34.lesson02.teach.gym: {title: "gym", gloss: "باشگاه ورزشی", note: "gym یعنی باشگاه ورزشی، جایی با وسایل و کلاس‌های ورزشی.", example_gloss: "اون توی باشگاه یوگا کار می‌کنه."}
  en.a1.unit34.lesson02.teach.pool: {title: "pool", gloss: "استخر", note: "pool یعنی استخر، جای پر از آب برای شنا کردن.", example_gloss: "من برای شنا می‌رم استخر."}
  en.a1.unit34.lesson02.teach.how_often_question: {title: "How often do you exercise?", gloss: "هر چند وقت یک‌بار ورزش می‌کنی؟", note: "این سؤال با how often (هر چند وقت یک‌بار) شروع می‌شه و بعدش فعل کمکی do میاد چون فعل اصلی exercise هست -- ساختار سؤالی مثل بقیهٔ سؤال‌های do-support."}

  en.a1.unit34.lesson03.teach.dialogue_line1: {title: "سؤال دنیل", gloss: "دنیل از لیلا می‌پرسه: می‌خوای شنبه با ما فوتبال بازی کنی؟", note: "شروع گفتگو با یه دعوت به فوتبال -- فعل play برای فوتبال."}
  en.a1.unit34.lesson03.teach.dialogue_line2: {title: "جواب لیلا", gloss: "لیلا می‌گه زیاد از فوتبال خوشش نمی‌آد و شنا رو ترجیح می‌ده.", note: "don't really like یعنی «زیاد خوشم نمی‌آد» -- یه راه نرم‌تر برای نه‌گفتن به یه پیشنهاد."}
  en.a1.unit34.lesson03.teach.dialogue_line3: {title: "جواب دنیل", gloss: "دنیل می‌گه اشکالی نداره و می‌پرسه لیلا هر چند وقت شنا می‌ره.", note: "go swimming -- فعل go برای شنا، نه play یا do."}
  en.a1.unit34.lesson03.teach.dialogue_line4: {title: "جواب لیلا", gloss: "لیلا می‌گه هفته‌ای دو بار، معمولاً توی استخر نزدیک خونه‌ش.", note: "Twice a week -- یادآوری همون نکتهٔ a به‌معنای «در هر»."}
  en.a1.unit34.lesson03.teach.dialogue_line5: {title: "جواب دنیل", gloss: "دنیل می‌گه بعضی‌وقتا یوگا هم کار می‌کنه، ولی دویدن هنوز موردعلاقه‌شه.", note: "do yoga -- فعل do برای یوگا، جدا از play و go."}

  en.a1.unit34.lesson04.teach.reading_passage: {title: "متن: دنیل، لیلا و میا", gloss: "دنیل، لیلا و میا هرکدوم به شکل خودشون فعال می‌مونن. دنیل هر روز صبح قبل از کار می‌دوه. لیلا شنا رو ترجیح می‌ده؛ اون هفته‌ای دو بار می‌ره استخر. میا تازه به این گروه پیوسته، ولی از قبل هر یکشنبه با همسایه‌ش تنیس بازی می‌کنه. شنبه‌ها بعضی‌وقتا با هم توی پارک فوتبال بازی می‌کنن، ولی فوتبال ورزش موردعلاقهٔ هیچ‌کدومشون نیست.", note: "این متن دو تا از فعل‌های ورزشی رو نشون می‌ده: go (goes running) و play (plays tennis، play soccer) -- توجه کنین هر ورزش با فعل مخصوص خودش میاد، نه یه فعل مشترک."}

