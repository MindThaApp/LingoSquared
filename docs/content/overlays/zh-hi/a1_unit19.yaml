  notes: 'Derived from en-hi by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Chinese (Mandarin, Simplified) string was translated and adapted. Needs native Chinese (Mandarin, Simplified) review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  weather_existential: '"Aaj/kal + [weather word] + hai" states the current or a stated day''s weather -- *dhoop hai* ("it''s sunny"), *baarish hai* ("it''s raining"), *hawa hai* ("it''s windy") are each stated as a bare existential sentence, not a progressive verb form. A typed answer using the correct weather noun with *hai* is accepted; using *hain* where the sentence''s own subject is singular (or vice versa) is judged as a real grammar error, the exact contrast this unit''s own grammar_check exercises target -- not tolerated as a minor typo.'
  garm_invariant_thanda_agrees: '*Garm* ("hot") never changes for gender or number -- "mausam garm hai" always uses *garm*. *Thanda*/*thandi* ("cold") DOES change with the noun''s gender, the same "-a"/"-i" pattern already taught for *bada*/*badi* (第14单元) -- masculine *mausam* takes *thanda*, a feminine noun would take *thandi*. Every exercise in this unit pairs *thanda*/*thandi* with *mausam* only, so only *thanda* is ever actually required as a typed answer here; a typed answer using the wrong gender form where one IS tested is marked incorrect as a real grammar error, not tolerated as a typo.'
  kal_context_ambiguity: '*Kal* means both "yesterday" (as taught in units 4/12) and "tomorrow" (as used throughout this unit) -- genuinely ambiguous in real Hindi, disambiguated only by the sentence''s own tense/context. This unit''s own sentences are all future/plan-making in context, so *kal* consistently means "tomorrow" here; don''t mark a learner''s own free sentence wrong merely for using *kal* to mean "yesterday" in a DIFFERENT context than this unit''s own scenario, since both meanings are equally correct Hindi.'
  suggestion_pattern: '"Chalo" + a habitual-plural verb form (e.g. *jaate hain*, *chalte hain*) makes a "Let''s ___" suggestion, the same pattern already used for "chalo, kuch khaate hain!" (第6单元) and "chalo, kuch kharidte hain!" (第7单元). *Jaate hain* here is the same "-te hain" habitual form applied to *jaana* ("to go," 第15单元''s infinitive), not a new verb.'
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation. For any exercise asking the learner to describe today's or tomorrow's weather, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: 印地语 A1
units:
  hi.a1.unit19.weather:
    title: 天气
lessons:
  hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa:
    title: 天气、阳光、雨和风
  hi.a1.unit19.lesson02.garam_thanda_baadal:
    title: 热、冷和云
  hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam:
    title: 普丽雅和阿尔琼：明天天气怎么样？
teaching:
  hi.a1.unit19.lesson01.teach.aaj_review:
    title: 复习：今天
    gloss: 今天
    note: 第3单元已学过——这个词是本单元反复出现的时间词，第3课中还会与 *kal*（明天）一起出现。
    example_gloss: 今天是三号。
  hi.a1.unit19.lesson01.teach.mausam:
    title: 天气
    gloss: 天气
    note: 新名词，是本单元的主题词。阳性名词——参见本单元关于性的一致的语法说明。
    example_gloss: 今天天气怎么样?
  hi.a1.unit19.lesson01.teach.kaisa_review:
    title: 复习：怎么样／什么样的
    gloss: 怎么样／什么样的
    note: 第12单元已学过——这里用来询问天气。
    example_gloss: 你的房子怎么样？
  hi.a1.unit19.lesson01.teach.hai_hain_review:
    title: 复习：是（单数、复数）
    gloss: 是（单数）、是（复数）
    note: 单数与复数的系动词一对，是本单元整个天气“存在句”结构的基础。
    example_gloss:
    - 今天天气很好。
    - 房子里有三个房间。
  hi.a1.unit19.lesson01.teach.dhoop:
    title: 阳光／晴天
    gloss: 阳光／晴天
    note: 新名词。用单纯的存在句表达：*aaj dhoop hai* =“今天是晴天”（字面意思是“今天有阳光”）。
    example_gloss: 今天天晴。
  hi.a1.unit19.lesson01.teach.baarish:
    title: 雨
    gloss: 雨
    note: 新名词。用单纯的存在句表达：*aaj baarish hai* =“今天下雨”。
    example_gloss: 今天下雨。
  hi.a1.unit19.lesson01.teach.hawa:
    title: 风
    gloss: 风
    note: 新名词。用单纯的存在句表达：*aaj hawa hai* =“今天有风”。
    example_gloss: 今天有风。
  hi.a1.unit19.lesson01.teach.grammar_mausam_existential:
    title: 天气的存在句结构
    gloss: 描述天气时，说“aaj/kal + [天气词] + hai”——例如“aaj dhoop hai”“aaj baarish hai”“aaj hawa hai”。这与第18单元学过的描述房子的 hai/hain 结构相同，只是这里没有数量，天气词直接作主语。
    note: 本单元的第一个语法说明，把新词汇与已学过的句型联系起来。
  hi.a1.unit19.lesson02.teach.mausam_review:
    title: 复习：天气
    gloss: 天气
    note: 本单元第1课中已出现过。
    example_gloss: 今天天气怎么样?
  hi.a1.unit19.lesson02.teach.garam:
    title: 热
    gloss: 热
    note: 新形容词。不随性变化——参见本课的语法说明。
    example_gloss: 今天天气很热。
  hi.a1.unit19.lesson02.teach.thanda_thandi:
    title: 冷（阳性／阴性）
    gloss: 冷（阳性）、冷（阴性）
    note: 新形容词。与 *garm* 不同，它会随性变化——阳性的 *mausam* 用 *thanda*，阴性名词（如 *rasoi*，第18单元）用 *thandi*——参见本课的语法说明。
    example_gloss:
    - 今天天气很冷。
    - 今天厨房很冷。
  hi.a1.unit19.lesson02.teach.grammar_garam_thanda:
    title: 不变形容词与随性变化的形容词
    gloss: “Garm”是以辅音结尾的形容词，不随性变化——“mausam garm hai”中始终用“garm”。而“thanda”/“thandi”是以“-a”结尾的形容词，会随性变化，就像“bada”/“badi”（第14单元）一样——阳性的“mausam”用“thanda”，阴性名词用“thandi”。
    note: 本单元核心的语法对比，把新的形容词对与第14单元已学的规则联系起来。
  hi.a1.unit19.lesson02.teach.baadal:
    title: 云
    gloss: 云
    note: 新名词，本单元只用其自然的复数存在句形式：*aaj baadal hain* =“今天有云”／“今天是阴天”。
    example_gloss: 今天有云。
  hi.a1.unit19.lesson02.teach.accha_review:
    title: 复习：好
    gloss: 好的
    note: 第9单元已学过——这里用来描述天气。
    example_gloss: 今天天气很好。
  hi.a1.unit19.lesson02.teach.bura:
    title: 坏
    gloss: 坏的
    note: 新形容词，与已学过的 *accha*（好）相对。本单元只用阳性形式，与 *mausam* 搭配。
    example_gloss: 今天天气不好。
  hi.a1.unit19.lesson02.teach.bahut_review:
    title: 复习：很
    gloss: 非常
    note: 第6单元已学过——这里用来加强天气描述的程度。
    example_gloss: 今天天气很冷。
  hi.a1.unit19.lesson03.teach.kal_review:
    title: 复习：明天（也可表示“昨天”）
    gloss: 明天（视语境也可表示“昨天”）
    note: 第4单元已学过，第12单元又用来表示“昨天”——在真实的印地语中确实有歧义，只能靠语境区分。本单元的句子都是关于未来的计划，所以这里的 'kal' 表示“明天”。
    example_gloss: 明天会下雨。
  hi.a1.unit19.lesson03.teach.ghar_review:
    title: 复习：房子／家
    gloss: 房子／家
    note: 第8单元已学过,这里用于表示由此得出的计划(待在家里)。
    example_gloss: 这是一座房子。
  hi.a1.unit19.lesson03.teach.mein_review:
    title: 复习:在……里 / 在
    gloss: 在
    note: 第1单元已学过,这里用于“ghar mein”(在家)。
    example_gloss: 房子里有三个房间。
  hi.a1.unit19.lesson03.teach.hum_review:
    title: 复习:我们
    gloss: 我们
    note: 第11单元已学过,这里用作本课制订计划时的主语。
    example_gloss: 我们看电影。
  hi.a1.unit19.lesson03.teach.rehte_hain_review:
    title: 复习:(他们/我们)住 / 待
    gloss: (他们/我们)住 / 待
    note: 第5单元已学过(主语是单数的爷爷,用阳性复数形式表示尊敬)。本单元首次用于真正的复数主语“hum”(我们),动词形式相同,用法更简单。
    example_gloss: 我爷爷住在德里。
  hi.a1.unit19.lesson03.teach.chalo_review:
    title: 复习:我们……吧 / 走吧
    gloss: 我们……吧 / 走吧
    note: 第1单元已学过,在第6、7、11单元中与习惯性复数动词连用,表示“我们……吧”。这里用法相同。
    example_gloss: 我们吃点东西吧!
  hi.a1.unit19.lesson03.teach.jaana_review:
    title: 复习:去
    gloss: 去
    note: 第15单元作为不定式学过。本课扩展为习惯性复数形式“jaate hain”(我们去),构成方式与第11单元的“dekhte hain”/“peete hain”相同。
    example_gloss: 我得去车站。
  hi.a1.unit19.lesson03.teach.aur_review:
    title: 复习：和
    gloss: 和
    note: 第1单元已学过,这里用来连接明天的天气和气温。
    example_gloss: 明天下雨,天气会很冷。
  hi.a1.unit19.lesson03.teach.bahar:
    title: 外面
    gloss: 外面
    note: 新词,是本课制订计划所用的词汇。
    example_gloss: 我们去外面吧!
  hi.a1.unit19.lesson03.teach.jaate_hain_phrase:
    title: 我们去外面吧!
    gloss: 我们去外面吧!
    note: “Chalo”加习惯性复数“jaate hain”(来自“jaana”,去),即第1、6、7、11单元已学过的“我们……吧”句型。
  hi.a1.unit19.lesson03.teach.dialogue.line01:
    title: 阿俊问普丽雅今天天气怎么样
    gloss: 普丽雅,今天天气怎么样?
  hi.a1.unit19.lesson03.teach.dialogue.line02:
    title: 普丽雅描述今天的天气
    gloss: 今天有太阳,天气很热。
  hi.a1.unit19.lesson03.teach.dialogue.line03:
    title: 阿俊提议去外面
    gloss: 太好了!我们去外面吧。
  hi.a1.unit19.lesson03.teach.dialogue.line04:
    title: 普丽雅问明天的天气
    gloss: 好啊!那明天天气怎么样?
  hi.a1.unit19.lesson03.teach.dialogue.line05:
    title: 阿俊描述明天的天气
    gloss: 明天下雨,天气会很冷。
  hi.a1.unit19.lesson03.teach.dialogue.line06:
    title: 普丽雅提议待在家里
    gloss: 那我们明天待在家里吗?
  hi.a1.unit19.lesson03.teach.dialogue.line07:
    title: 阿俊表示同意
    gloss: 嗯,我们明天待在家里。
  hi.a1.unit19.lesson03.teach.dialogue.line08:
    title: 普丽雅表示同意
    gloss: 好!
  hi.a1.unit19.lesson03.teach.grammar_summary:
    title: 三条主要规则
    gloss: 本单元的三条主要规则:(1)描述天气用“aaj/kal + [天气词] + hai/hain”;(2)“garm”不随性变化,而“thanda”/“thandi”会变化,和“bada”/“badi”一样;(3)“chalo”加习惯性复数动词(如“jaate hain”)表示提议——“chalo, bahar jaate hain!”。
    note: 本单元语法的总结,与第15至18单元的语法总结相呼应。
  hi.a1.unit19.lesson03.teach.weather_reading:
    title: 关于今天和明天的阅读
    gloss: 今天天气很热,有太阳。我们去外面吧!明天下雨,天气会很冷。明天我们待在家里。
    note: 一段简短直接的介绍,只重述对话中已有的内容,没有新信息,用来练习“读懂简短的天气预报”。
    glosses:
      आज: 今天
      मौसम: 天气
      गर्म: 热
      धूप: 阳光
      चलो: 我们……吧
      बाहर: 外面
      जाते: 去(来自 जाना)
      कल: 明天
      बारिश: 雨
      ठंडा: 冷的
      रहते: 住 / 待(来自 रहना)
