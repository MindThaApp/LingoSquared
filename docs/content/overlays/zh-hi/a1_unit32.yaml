teaching:
  hi.a1.unit32.lesson01.teach.janvar_paltoo_janvar:
    title: 动物与宠物
    gloss: 动物／宠物
    note: '*जानवर* 是“动物”的通称,*पालतू जानवर*(字面意思“驯养的动物”)指宠物。'
    example_gloss:
    - 狗是一种动物。
    - 狗也是一种宠物。
  hi.a1.unit32.lesson01.teach.kutta_billee:
    title: 狗和猫
    gloss: 狗／猫
    example_gloss:
    - 普丽雅有一只狗。
    - 维克拉姆有一只猫。
  hi.a1.unit32.lesson01.teach.machhlee_chiriya:
    title: 鱼和鸟
    gloss: 鱼／鸟
    example_gloss:
    - 爷爷养了一条鱼。
    - Nina 养了一只鸟。
  hi.a1.unit32.lesson01.teach.kya_tumhare_pas:
    title: 你养宠物吗？
    gloss: 你养宠物吗？
    note: '*तुम्हारे पास ... है?*(字面意思“你那里有……?”)用来问“你有……吗?”,*कोई*(“任何”)使问题保持开放。'
  hi.a1.unit32.lesson01.teach.han_mere_pas:
    title: 是的，我有一只狗
    gloss: 是的，我有一只狗。
    note: 使用本单元的新词汇作简单的肯定回答。
  hi.a1.unit32.lesson01.teach.naheen_mere_pas:
    title: 不，我没有宠物
    gloss: 不，我没有宠物。
    note: '*कोई ... नहीं है*(“没有任何……”)表示你什么都没有。'
  hi.a1.unit32.lesson01.teach.mere_pas_koee:
    title: कोई ... नहीं
    gloss: 我没有宠物。
    note: '*कोई*(“任何”)加 *नहीं है* 表示否定“拥有”:*मेरे पास कोई पालतू जानवर नहीं है*。'
  hi.a1.unit32.lesson02.teach.ghumane_le_jana:
    title: 遛（动物）
    gloss: 遛（动物）
    note: '*घुमाने ले जाना*(“带出去散步”)是印地语表达“遛动物”的说法;*घुमाने* 后面要接 *ले जाना*。'
    example_gloss: 我每天遛狗。
  hi.a1.unit32.lesson02.teach.vah_kutte_ko:
    title: घुमाने ले जाना
    gloss: 她带狗去散步。
    note: 动物后面要加 *को*(*कुत्ते को*),*घुमाने ले जाती है* 放在句末;*ले जाना*(“带走”)是两个词,要连在一起。
  hi.a1.unit32.lesson02.teach.khana_dena:
    title: 喂食
    gloss: 喂食
    example_gloss: 我每天给猫喂食。
  hi.a1.unit32.lesson02.teach.ke_sath_khelna:
    title: 和……玩
    gloss: 和……玩
    example_gloss: 维克拉姆和他的猫玩。
  hi.a1.unit32.lesson02.teach.main_roz_kutte:
    title: 我每天遛狗
    gloss: 我每天遛狗。
    note: '*रोज़*(“每天”)放在宾语之前:*रोज़ कुत्ते को घुमाने ले जाता हूँ*。'
  hi.a1.unit32.lesson02.teach.main_roz_billee:
    title: 我每天喂猫
    gloss: 我每天给猫喂食。
    note: '*खाना देना*(“给食物”)用 *को* 标出得到食物的对象:*बिल्ली को खाना देता हूँ*。'
  hi.a1.unit32.lesson03.teach.ek_kutta_do:
    title: 复数形式
    gloss: 一只狗,两只狗;一只猫,两只猫。以 *-आ* 结尾的阳性名词,复数变为 *-ए*(*कुत्ता* 变 *कुत्ते*);以 *-ई* 结尾的阴性名词,复数加 *-याँ*(*बिल्ली* 变 *बिल्लियाँ*)。
    note: 印地语的规则复数形式,这里首次以动物名词为例介绍。
  hi.a1.unit32.lesson03.teach.kutte_billiyan:
    title: 狗和猫
    gloss: 狗／猫
    example_gloss:
    - 阿尔琼喜欢狗。
    - 内哈喜欢猫。
  hi.a1.unit32.lesson03.teach.machhliyan_chiriyan:
    title: 鱼和鸟（复数）
    gloss: 鱼（复数）／鸟
    example_gloss:
    - 我喜欢鱼。
    - 爷爷喜欢鸟。
  hi.a1.unit32.lesson03.teach.mujhe_janvar_bahut:
    title: 我喜欢动物
    gloss: 我喜欢动物。
    note: '*मुझे जानवर बहुत पसंद हैं*(字面意思“对我来说,动物很被喜欢”)表示“我喜欢动物”;因为 *जानवर* 是复数,所以用复数的 *हैं*。'
  hi.a1.unit32.lesson03.teach.neha_ko_billiyan:
    title: 内哈喜欢猫,但没有宠物
    gloss: 内哈喜欢猫,但她没有宠物。
    note: 这里引出了第 05 课阅读部分所围绕的对比。
  hi.a1.unit32.lesson04.teach.arjun_kya_tumhare:
    title: 阿尔琼问有没有宠物
    gloss: 阿尔琼:普丽雅,你有宠物吗?
  hi.a1.unit32.lesson04.teach.priya_han_mere:
    title: 普丽雅有一只狗
    gloss: 普丽雅:有,我有一只狗。
  hi.a1.unit32.lesson04.teach.arjun_vah_kaisa:
    title: 阿尔琼问它长什么样
    gloss: 阿尔琼:它长什么样?
    note: '*वह कैसा दिखता है?* 也可以用于动物,因为狗是公的,所以 *कैसा* 用阳性形式。'
  hi.a1.unit32.lesson04.teach.priya_uske_bal:
    title: 普丽雅描述她的狗
    gloss: 普丽雅:它的毛是棕色的,个头很小。
    note: 这里再次使用外貌单元学过的毛发颜色和体型词汇，不过描述的是动物的皮毛，而不是人的头发。
  hi.a1.unit32.lesson04.teach.vah_mera_kutta:
    title: 用 वह 指动物
    gloss: 那是我的狗。我非常喜欢它。
    note: '*वह* 和 *उसे* 既可以指人,也可以指动物;印地语在这里没有单独表示“它”的词。'
  hi.a1.unit32.lesson04.teach.arjun_kya_tum:
    title: 阿尔琼问遛狗的事
    gloss: 阿尔琼:你每天都带它去散步吗?
  hi.a1.unit32.lesson04.teach.priya_han_main:
    title: 普丽雅说起她的日常
    gloss: 普丽雅:是的,我每天带它去散步,也给它喂食。
  hi.a1.unit32.lesson05.teach.arjun_aur_neha:
    title: 阿尔琼、内哈和维克拉姆谈动物
    gloss: 阿尔琼和内哈都很喜欢动物,但他们两人都没有宠物。阿尔琼喜欢狗,内哈喜欢猫。维克拉姆有宠物:一只猫。他经常和他的猫玩,每天给猫喂食。你有宠物吗?
    note: 这里对比了喜欢动物与真正饲养宠物，是本部分要表达的重点。
    glosses:
      पसंद: 喜爱
      दोनों: 两者都
      जानवर: 动物
      किसी: 其中任何一个
      पालतू: 宠物
      कुत्ते: 狗
      बिल्लियाँ: 猫
      बिल्ली: 猫
      खेलता: 玩
      देता: 给
      रोज़: 每一
      खाना: 食物
  hi.a1.unit32.lesson05.teach.vikram_aksar_apnee:
    title: 维克拉姆经常和他的猫玩
    gloss: 维克拉姆经常和他的猫玩。
    note: '*अक्सर*(“经常”)放在动词之前,*अपनी* 与阴性的 *बिल्ली* 保持一致。'
  hi.a1.unit32.lesson05.teach.mujhe_kutte_bahut:
    title: 我喜欢狗。我没有宠物。
    gloss: 我喜欢狗。我没有宠物。
    note: 这是一个由两句话组成的示范答案，可以直接套用在本单元的写作题中。
  hi.a1.unit32.lesson06.teach.priya_neena_kya:
    title: 普丽雅问妮娜
    gloss: 普丽雅:妮娜,你也有宠物吗?
  hi.a1.unit32.lesson06.teach.neena_han_mere:
    title: Nina 有一只名叫 Pico 的鸟
    gloss: Nina：是的，我有一只鸟。它叫 Pico。
    note: '*उसका नाम पीको है*(“它的名字叫皮科”)用 *का*,因为 *नाम* 是阳性名词。'
  hi.a1.unit32.lesson06.teach.arjun_vah_kitna:
    title: 阿尔琼的反应
    gloss: 阿尔琼:哇,真好!你每天和它一起做什么?
  hi.a1.unit32.lesson06.teach.neena_main_use:
    title: Nina 每天给它喂食
    gloss: Nina：我每天都给它喂食。
  hi.a1.unit32.lesson06.teach.arjun_mujhe_bhee:
    title: 阿尔琼也喜欢鸟
    gloss: 阿尔琼:我也很喜欢鸟。
  hi.a1.unit32.lesson06.teach.priya_kitna_achchha:
    title: 普丽雅为对话收尾
    gloss: 普丽雅:真好,我们三个人都很喜欢动物!
    note: 这句话将本单元三个人物与动物有关的信息串联起来，为对话收尾。
