    title: से 表示交通工具
    gloss: 交通工具后面加 *से*（相当于“乘、靠”）：*साइकिल से*、*ट्रेन से*、*कार से*。名词本身不变：*मैं साइकिल से काम पर जाता हूँ।*
    note: 所有交通工具都用同一种句式：交通工具 + *से* + *जाना*。
