units:
  hi.a1.unit14.comparisons:
    title: 比较
lessons:
  hi.a1.unit14.lesson01.se_tulna:
    title: 普里娅比阿尔琼大
  hi.a1.unit14.lesson02.vastu_tulna:
    title: 帽子比包便宜
  hi.a1.unit14.lesson03.arjun_priya_tulna:
    title: 阿尔琼和普里娅：比较
teaching:
  hi.a1.unit14.lesson01.teach.arjun_priya_review:
    title: 复习：阿尔琼、普里娅、是
    gloss: 阿尔琼，普里娅，是
    note: 快速复习两位人物的名字和系动词 'hai',本单元造比较句时要用到。
    example_gloss:
    - 阿尔琼挺好的。
    - 普里娅挺好的。
  hi.a1.unit14.lesson01.teach.bada_badi_review:
    title: 复习：大 / 年长
    gloss: 大 / 年长(阳性 / 阴性)
    note: 第5单元为兄弟姐妹的年龄首次学过——本单元把它扩展到直接比较任何两个人或事物。
    example_gloss:
    - 我哥哥住在德里。
    - 我姐姐住在德里。
  hi.a1.unit14.lesson01.teach.chota_choti_review:
    title: 复习：小 / 年幼
    gloss: 小 / 年幼(阳性 / 阴性)
    note: 第5单元为兄弟姐妹的年龄首次学过——这里的用法与 bada/badi 相同。
    example_gloss:
    - 我弟弟现在是学生。
    - 我妹妹现在是学生。
  hi.a1.unit14.lesson01.teach.se_comparative_grammar:
    title: Se = 比
    gloss: '''Se'' 之前学过“从”的意思(第9单元，''yahan se seedhe jao'')和“和”的意思(第12单元，''Priya se mila'')。现在它还可以表示比较：''X, Y se ADJ hai'' 的意思是“X比Y更ADJ”——例如 ''Priya Arjun se badi hai''。'
    note: 介绍一个已学词的第三种用法，并先指出之前两种用法所在的单元，再引入新用法。
    target_text: '''से'' पहले ''यहाँ से सीधे जाओ'' (यूनिट 9, matlab ''从'') और ''प्रिया से मिला'' (यूनिट 12, matlab ''和'') में सीखा था; अब यह तुलना के लिए भी आता है: ''X, Y से ADJ है'' का मतलब है ''X比Y更ADJ'' -- जैसे ''प्रिया अर्जुन से बड़ी है''।'
  hi.a1.unit14.lesson01.teach.arjun_bada_phrase:
    title: 普里娅比阿尔琼大。
    gloss: 普里娅比阿尔琼大。
    note: 本单元第一个完整的 se 比较句示例。
  hi.a1.unit14.lesson01.teach.lamba_lambi:
    title: 高 / 长
    gloss: 高 / 长(阳性 / 阴性)
    note: 新的形容词对，遵循已学的阳性 -a / 阴性 -i 变化规律(bada/badi、chota/choti)。
    example_gloss:
    - 我哥哥很高。
    - 我姐姐很高。
  hi.a1.unit14.lesson01.teach.agreement_grammar:
    title: 形容词与主语一致
    gloss: 在比较句中，形容词(如 bada/badi、chota/choti)总是与主语的性一致，而不是与 'se' 后面的词一致——例如 'Arjun Priya se chota hai' 中，'chota' 与阳性主语 Arjun 一致，而不是与 Priya 一致。
    note: 这是对已学的 -a/-i 形容词变化规律的直接延伸，专门用于比较句。
    target_text: तुलना के वाक्य में विशेषण (जैसे बड़ा/बड़ी, छोटा/छोटी) हमेशा विषय (subject) के लिंग से मेल खाता है, 'से' के बाद वाले शब्द के नहीं -- जैसे 'अर्जुन प्रिया से छोटा है' में 'छोटा' अर्जुन (पुल्लिंग विषय) से मेल खाता है, प्रिया से नहीं।
  hi.a1.unit14.lesson01.teach.priya_chota_phrase:
    title: 阿尔琼比普里娅小。
    gloss: 阿尔琼比普里娅小。
    note: 从另一个方向说同一件事，展示阳性主语时形容词与主语的一致。
  hi.a1.unit14.lesson01.teach.kaun_ya_review:
    title: 复习：谁、或者
    gloss: 谁，或者
    note: 两个词都已学过(第5单元和第6/13单元)——这里用来提出比较问题。
    example_gloss: 谁更大，阿尔琼还是普里娅？
  hi.a1.unit14.lesson02.teach.topi_bag_review:
    title: 复习：帽子、包
    gloss: 帽子，包
    note: 这两个名词都在第7单元的购物内容中首次学过——这里用作被比较的两样东西。
    example_gloss:
    - 这顶帽子很好看。
    - 这个包很好看。
  hi.a1.unit14.lesson02.teach.sasta_mehnga_review:
    title: 复习：便宜、贵
    gloss: 便宜，贵
    note: 第7单元首次学过——这里用于物品的比较。
    example_gloss:
    - 这个手提包很便宜。
    - 这个包很贵。
  hi.a1.unit14.lesson02.teach.sasti_mehngi_note:
    title: 阴性形式：sasti、mehngi
    gloss: '''Sasta'' 和 ''mehnga'' 搭配阴性词时变成 ''sasti'' 和 ''mehngi''——例如 ''topi sasti hai''(帽子很便宜)。'
    note: 简单回顾第7单元的性一致规则，因为 'topi'(帽子)是阴性词。
  hi.a1.unit14.lesson02.teach.se_object_phrase:
    title: 帽子比包便宜。
    gloss: 帽子比包便宜。
    note: se 比较句式用于两样东西，而不是两个人。
  hi.a1.unit14.lesson02.teach.zyada_review:
    title: 复习：更
    gloss: 更
    note: 第13单元只在 'pasand hai'(表达偏好)中学过——本课把它的用法推广开来。
    example_gloss: 我更喜欢茶。
  hi.a1.unit14.lesson02.teach.zyada_mehnga_grammar:
    title: Zyada 用于任何比较
    gloss: '''Zyada'' 之前只在 ''pasand hai'' 中学过(第13单元)。现在它还可以放在比较句中的任何形容词前——''bag topi se zyada mehnga hai'' 的意思是“包比帽子贵”,与 ''bag topi se mehnga hai'' 完全一样。''Zyada'' 可以省略，它只是明确地表示“更”。'
    note: 这是对已学词语位置规则的一次说明性扩展，不是新的语法点。
  hi.a1.unit14.lesson02.teach.zyada_mehnga_phrase:
    title: 包比帽子更贵。
    gloss: 包比帽子更贵。
    note: 同样的 se 比较句型，这里把可有可无的 zyada(更)也说了出来。
  hi.a1.unit14.lesson02.teach.naya_nai:
    title: 新
    gloss: 新的(阳性/阴性)
    note: 新学的一对形容词，和本单元其他形容词一样遵循 -a/-i 的性变化规律。
    example_gloss:
    - 这个包是新的。
    - 这顶帽子是新的。
  hi.a1.unit14.lesson02.teach.topi_nai_phrase:
    title: 帽子比包更新。
    gloss: 帽子比包更新。
    note: 在同样两件物品之间进行第二种比较(新旧),与前面已学的价格比较一致。
  hi.a1.unit14.lesson03.teach.review_words:
    title: 复习：大、小、高、新
    gloss: 大/年长，小/年幼，高/长，新
    note: 快速复习本单元的重点形容词，对话和阅读短文会用到。
    example_gloss:
    - 普丽雅年纪更大。
    - 阿俊年纪更小。
    - 阿俊个子高。
    - 这个包是新的。
  hi.a1.unit14.lesson03.teach.main_hun_review:
    title: 复习：我、是
    gloss: 我，是
    note: 第 1 单元已学过(“main theek hun”),对话中阿俊要谈论自己，所以需要它。
    example_gloss: 我很好。
  hi.a1.unit14.lesson03.teach.aur_bhi_review:
    title: 复习：和、也
    gloss: 和，也
    note: 这两个词在之前的对话文本中出现过，但这里第一次作为考查词汇正式引入。
    example_gloss:
    - 我喜欢茶和咖啡。
    - 我也喜欢。
  hi.a1.unit14.lesson03.teach.ka_review:
    title: 复习：的(所属)
    gloss: 的(表示所属)
    note: 这个所属标记在课程中早已使用(如第 5–11 单元),这里用来说明比较的是谁的包。
    example_gloss: 阿俊的包是新的。
  hi.a1.unit14.lesson03.teach.dialogue.line01:
    title: 阿俊展示他的新包
    gloss: 普丽雅，这是我的新包。
  hi.a1.unit14.lesson03.teach.dialogue.line02:
    title: 普丽雅说帽子更便宜
    gloss: 这包不错！不过帽子比包便宜。
  hi.a1.unit14.lesson03.teach.dialogue.line03:
    title: 阿俊承认他的包很贵
    gloss: 是啊。我的包很贵——比帽子贵多了。
  hi.a1.unit14.lesson03.teach.dialogue.line04:
    title: 普丽雅问谁年纪更大
    gloss: 好啦好啦！阿俊，谁年纪大，你还是我？
  hi.a1.unit14.lesson03.teach.dialogue.line05:
    title: 阿俊回答
    gloss: 你年纪大，可我个子高！
  hi.a1.unit14.lesson03.teach.dialogue.line06:
    title: 普丽雅说帽子也更新
    gloss: 好啦好啦！不过帽子也比包新。
  hi.a1.unit14.lesson03.teach.dialogue.line07:
    title: 阿俊同意并结束对话
    gloss: 是啊，没错。明天再见面好吗？
  hi.a1.unit14.lesson03.teach.dialogue.line08:
    title: 普丽雅结束对话
    gloss: 好！明天见。
  hi.a1.unit14.lesson03.teach.grammar_summary:
    title: 三条主要规则
    gloss: 本单元的三条主要规则：(1)“X, Y se ADJ hai”表示“X 比 Y 更 ADJ”;(2)形容词总是与主语(X)的性一致，而不是与 Y 一致；(3)形容词前也可以加 “zyada”,如“X, Y se zyada ADJ hai”——意思不变(“比 Y 更 ADJ”)。
    note: 收尾总结，把整个单元的语法串联起来，与第 13 单元的语法总结相呼应。
    target_text: 'इस यूनिट के तीन मुख्य नियम: (1) ''X, Y से ADJ है'' का मतलब है ''X比Y更ADJ''; (2) ADJ हमेशा विषय (X) के लिंग से मेल खाता है, Y से नहीं; (3) ADJ से पहले ''ज़्यादा'' भी जोड़ सकते हैं, जैसे ''X, Y से ज़्यादा ADJ है'' -- मतलब वही रहता है (''比……更……'')।'
  hi.a1.unit14.lesson03.teach.priya_note:
    title: 普丽雅的便条
    gloss: 我比阿俊年纪大，不过阿俊个子高。我的帽子很好看——帽子比包便宜，而且帽子也比包新。——普丽雅
    note: 一张简短的便条，只重述对话中已经出现的内容，没有新信息。
    glosses:
      बड़ी: 年纪更大的(阴性)
      लंबा: 高
      टोपी: 帽子
      अच्छी: 好的/不错的(阴性)
      बैग: 包
      सस्ती: 更便宜/便宜的(阴性)
      नई: 更新/新的(阴性)
