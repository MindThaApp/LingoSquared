teaching:
  hi.a1.unit27.lesson01.teach.khush_udas_naraz:
    title: 开心、伤心和生气
    gloss: 开心，伤心，生气
    note: '*खुश*、*उदास* 和 *नाराज़* 是基本的情绪词，可与 *हूँ* 或 *है*（“是”）搭配；它们不随性别变化。'
    example_gloss:
    - 我很开心。
    - 我很伤心。
    - 我很生气。
  hi.a1.unit27.lesson01.teach.main_khush_hoon:
    title: 表达你很开心
    gloss: 我很高兴。
    note: '*मैं खुश हूँ* 的结构是 *मैं* + 情绪词 + *हूँ*，相当于“我……”。'
  hi.a1.unit27.lesson01.teach.main_naraz_naheen:
    title: 对比不同的感受
    gloss: 我没有生气，我很难过。
    note: '*नहीं* 紧放在 *हूँ* 之前：*नाराज़ नहीं हूँ*。后半句再说出真正的情绪。'
  hi.a1.unit27.lesson02.teach.tum_khush_kyon:
    title: 询问原因
    gloss: 你为什么高兴？
    note: '*क्यों*（“为什么”）放在核心词之前：*तुम खुश क्यों हो?*。*तुम* 是非正式的“你”。'
  hi.a1.unit27.lesson02.teach.main_khush_hoon:
    title: 说明原因
    gloss: 我很高兴，因为我有了一套新公寓。
    note: '*क्योंकि* 引出原因。*मेरे पास ... है* 表示“我有……”，动词 *है* 放在最后。'
  hi.a1.unit27.lesson02.teach.main_udas_hoon:
    title: 消极的原因
    gloss: 我很难过，因为在下雨。
    note: '*बारिश हो रही है* 的意思是“正在下雨”（字面是“雨正在发生”）。'
  hi.a1.unit27.lesson03.teach.narvas:
    title: 紧张
    gloss: 紧张
    note: 表示紧张的标准词。
    example_gloss: 我对第一次上班很紧张。
  hi.a1.unit27.lesson03.teach.main_apnee_pahlee:
    title: 说明你为什么紧张
    gloss: 我对第一次上班很紧张。
    note: '*को लेकर* 意思是“关于”，放在名词之后：*शिफ़्ट को लेकर*。*अपनी*（“我自己的”）与阴性的 *शिफ़्ट* 保持一致。'
  hi.a1.unit27.lesson03.teach.chinta_mat_karo:
    title: 安慰别人
    gloss: 别担心。
    note: '*चिंता मत करो* 是友好的“别担心”：*मत* + *करो* 是对 *तुम* 的否定命令。'
  hi.a1.unit27.lesson04.teach.arjun_kaisa_mahsoos:
    title: 询问别人的感受
    gloss: 阿尔君感觉怎么样？
    note: '*कैसा महसूस कर रहा है* 问的是“他感觉如何”。*कैसा* 随人物性别变化，问女性要用 *कैसी*。'
  hi.a1.unit27.lesson04.teach.vah_narvas_mahsoos:
    title: 描述别人的感受
    gloss: 他觉得很紧张。
    note: 这里印地语不需要单独的反身词：*वह नर्वस महसूस कर रहा है* 只用 *वह* 和 *रहा है*。
  hi.a1.unit27.lesson04.teach.vah_narvas_kyon:
    title: 询问别人为什么有某种感受
    gloss: 他为什么觉得紧张？
    note: '*क्यों* 紧放在动词短语之前：*वह नर्वस क्यों महसूस कर रहा है?*'
  hi.a1.unit27.lesson05.teach.hay_priya_main:
    title: 阅读一条关于感受的消息
    gloss: 你好，普里娅，我对自己第一次独自值班有点紧张。不过我也很开心，因为我有了新工作和新公寓。我觉得一切都会好的。
    note: 注意写信的人对什么感到紧张、什么让他高兴，以及他总体的看法。
    glosses:
      थोड़ा: 有点
      नर्वस: 紧张的
      पहली: 第一个
      शिफ़्ट: 班次
      अकेले: 独自
      खुश: 高兴
      क्योंकि: 因为
      नई: 新的
      नौकरी: 工作
      नया: 新的
      फ़्लैट: 公寓
      लगता: 认为
      होगा: 会顺利
  hi.a1.unit27.lesson06.teach.priya_hay_arjun:
    title: 普里娅询问阿尔君的感受
    gloss: 普里娅：嗨，阿尔君，你对第一个班次感觉怎么样？
    note: 这里再次用到 *को लेकर*：*अपनी पहली शिफ़्ट को लेकर*（“关于你的第一个班次”）。*तुम* 是非正式的。
  hi.a1.unit27.lesson06.teach.arjun_sach_kahoon:
    title: 阿尔君坦言自己紧张
    gloss: 阿尔君：说实话，我有点紧张。
    note: '*सच कहूँ तो*（“如果我说实话”）能缓和坦白的语气。'
  hi.a1.unit27.lesson06.teach.priya_chinta_mat:
    title: 普里娅安慰他
    gloss: 普里娅：别担心，你一定能做好的！
    note: '*तुम यह अच्छे से कर सकते हो* 意思是“你能把这件事做好”，*अच्छे से* 是“好好地”。'
  hi.a1.unit27.lesson06.teach.arjun_shukriya_isse:
    title: 阿尔君向她道谢
    gloss: 阿尔君：谢谢，这真的帮到我了。
    note: '*इससे मदद मिलती है* 字面是“从这里得到帮助”：提供帮助的来源用 *से* 标记。'
  hi.a1.unit27.lesson06.teach.priya_aur_bad:
    title: 普里娅预言结果
    gloss: 普里娅：之后你一定会非常开心，也会感到自豪。
    note: '*ज़रूर*（“一定”）让预测更有把握，*तुम्हें गर्व होगा* 是“你会感到自豪”。'
  hi.a1.unit27.lesson06.teach.arjun_han_mujhe:
    title: 阿尔君表示同意
    gloss: 阿尔君：是啊，我也这么觉得。
    note: '*मुझे भी ऐसा ही लगता है*（字面“对我来说也是这样觉得”）是表示赞同的自然说法，*मुझे* 标明感受的人。'
  hi.a1.unit27.lesson06.teach.arjun_narvas_hai:
    title: 代词：उसकी
    gloss: 阿尔君很紧张。普里娅帮助他。
    note: '*उसकी* 表示“他的”或“她的”，与阴性的 *मदद* 保持一致，所以 *उसकी मदद करना* 是“帮助他”；*है* 和 *करती है* 是第三人称的动词形式。'
