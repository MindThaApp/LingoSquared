teaching:
  hi.a1.unit08.lesson01.teach.ghar_school:
    title: 家,学校
    gloss: 家 / 房子,学校
    note: 两个常见的地方,本单元会一直用到。
    example_gloss:
    - 这是一座房子。
    - 这是一所学校。
  hi.a1.unit08.lesson01.teach.aspatal_bank:
    title: 医院,银行
    gloss: 医院,银行
    note: 在街区里你可能需要找的另外两个常见地方。
    example_gloss:
    - 这是一家医院。
    - 这是银行。
  hi.a1.unit08.lesson01.teach.park_station:
    title: 公园,车站
    gloss: 公园,车站
    note: 本单元最后两个常见的地方。
    example_gloss:
    - 这是公园。
    - 这是一个车站。
  hi.a1.unit08.lesson01.teach.yahan_wahan:
    title: 这里，那里
    gloss: 这里，那里
    note: 一对用来指明事物位置的基本词。
    example_gloss:
    - 学校在这里。
    - 银行在那里。
  hi.a1.unit08.lesson01.teach.school_kahan_hai:
    title: 学校在哪里?
    gloss: 学校在哪里?
    note: 再次用到第1单元学过的 *kahaan*(哪里),这次问的是某个地方,而不是某人的来历。
  hi.a1.unit08.lesson01.teach.school_yahan_hai:
    title: 学校在这里
    gloss: 学校在这里。
    note: 用 *yahaan* 回答的示例。
  hi.a1.unit08.lesson01.teach.bank_kahan_hai:
    title: 银行在哪里？
    gloss: 银行在哪里？
    note: 同样的问句结构,换了一个地方。
  hi.a1.unit08.lesson01.teach.bank_wahan_hai:
    title: 银行在那里
    gloss: 银行在那里。
    note: 用 *wahaan* 回答的示例。
  hi.a1.unit08.lesson02.teach.paas:
    title: 近
    gloss: 附近
    note: 在这里第一次正式学习——它只在第2单元的例句中出现过(*mere paas*,“我有”,字面意思是“在我附近”),但一直没有作为单独的词来教,直到现在。
    example_gloss: 银行很近。
  hi.a1.unit08.lesson02.teach.door:
    title: 远
    gloss: 远
    note: '*paas* 的反义词。'
    example_gloss: 车站很远。
  hi.a1.unit08.lesson02.teach.ke_paas_note:
    title: Ke paas
    gloss: '''Ke paas'' 的意思是在某个地方附近,比如 ''school bank ke paas hai''(学校在银行附近)。它就是之前 ''mere paas''(我有)里出现过的那个 ''paas'',但在那里意思是“归我所有”,而在这里的意思是“附近”——同一个词,两种不同的用法。'
    note: 一个建立在已学过的词之上的新后置词,并明确指出了它之前的含义,以免两种用法混淆。
    target_text: '''के पास'' 的意思是在某个地方附近——比如 ''बैंक स्कूल के पास है''。这个 ''पास'' 就是之前 ''मेरे पास''(मेरे पास एक किताब है)里出现过的那个,但在那里它的意思是“归我所有”(我有),而在这里的意思是“附近”(near)——同一个词,两种不同的用法。'
  hi.a1.unit08.lesson02.teach.school_bank_ke_paas_hai:
    title: 学校在银行附近
    gloss: 学校在银行附近。
    note: 使用 *ke paas* 的示例句。
  hi.a1.unit08.lesson02.teach.samne_peeche:
    title: 在……前面,在……后面
    gloss: 在……前面,在……后面
    note: 第二组表示位置的词,同样与 *ke* 连用。
    example_gloss:
    - 医院在车站对面。
    - 公园在学校后面。
  hi.a1.unit08.lesson02.teach.samne_peeche_note:
    title: Samne 和 peeche
    gloss: '''Samne'' 和 ''peeche'' 也像 ''paas'' 一样与 ''ke'' 连用——而且它们互为反义:''paark school ke peeche hai'' 和 ''school paark ke samne hai'' 描述的是完全相同的实际位置关系,只是站在两个不同的角度。'
    note: 同一个事实的两种说法——这是关于这两个词如何相互关联的一个实用语法点。
  hi.a1.unit08.lesson02.teach.school_park_ke_samne_hai:
    title: 学校在公园前面
    gloss: 学校在公园前面。
    note: 这是上面 *paark school ke peeche hai* 所说同一事实的另一面。
  hi.a1.unit08.lesson03.teach.dakghar:
    title: 邮局
    gloss: 邮局
    note: 本单元结尾对话中要用到的一个新的常见地点。
    example_gloss: 邮局在银行附近。
  hi.a1.unit08.lesson03.teach.dakghar_kahan_hai:
    title: 邮局在哪里?
    gloss: 邮局在哪里?
    note: 本单元结尾对话的开场。
  hi.a1.unit08.lesson03.teach.dialogue.line01:
    title: 阿俊询问邮局的位置
    gloss: 阿俊问普丽娅邮局在哪里。
    note: 重复使用本课开头的句子。
  hi.a1.unit08.lesson03.teach.dialogue.line02:
    title: 普丽娅回答
    gloss: 普丽娅说邮局在银行附近。
    note: 重复使用第2课的 *ke paas*。
  hi.a1.unit08.lesson03.teach.dialogue.line03:
    title: 阿俊询问医院的位置
    gloss: 阿俊说“哦”,然后问医院在哪里。
    note: 重复使用前面单元学过的 *achchha*(哦 / 原来如此)。
  hi.a1.unit08.lesson03.teach.dialogue.line04:
    title: 普丽娅回答
    gloss: 普丽娅说医院在车站对面。
    note: 重复使用第2课的 *ke samne*。
  hi.a1.unit08.lesson03.teach.dialogue.line05:
    title: 阿俊问远不远
    gloss: 阿俊问:车站远吗?
    note: 重复使用第2课的 *door*。
  hi.a1.unit08.lesson03.teach.dialogue.line06:
    title: 普丽娅确认并作对比
    gloss: 普丽娅说是的,有点远——银行很近。
    note: 引入 *thoda*(一点),并与前面一致:车站远,而银行近。
  hi.a1.unit08.lesson03.teach.dialogue.line07:
    title: 阿俊询问公园的位置
    gloss: 阿俊说“好的”,然后问公园在哪里。
  hi.a1.unit08.lesson03.teach.dialogue.line08:
    title: 普丽娅回答
    gloss: 普丽娅说公园在学校后面。
    note: 重复使用第2课的 *ke peeche*。
  hi.a1.unit08.lesson03.teach.dialogue.line09:
    title: 阿俊推理出来了
    gloss: 阿俊说:那么学校就在公园前面了!
    note: 引入 *to*(那么 / 那就),并把这个事实与第2课关于 *samne*/*peeche* 的语法说明联系起来。
  hi.a1.unit08.lesson03.teach.dialogue.line10:
    title: 普丽娅确认
    gloss: 普丽娅说是的,没错!
    note: 引入 *sahi*(对 / 正确)。
  hi.a1.unit08.lesson03.teach.dialogue.line11:
    title: 阿俊感谢普丽娅
    gloss: 阿俊说:非常感谢,普丽娅!
    note: 重复使用前面单元学过的 *bahut*(很 / 非常)和 *shukriya*。
  hi.a1.unit08.lesson03.teach.dialogue.line12:
    title: 普丽娅结束对话
    gloss: 普丽娅说:不客气!回头见。
    note: 重复使用本课程前面单元中的标准结束用语。
