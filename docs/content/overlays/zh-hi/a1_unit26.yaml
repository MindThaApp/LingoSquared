teaching:
  hi.a1.unit26.lesson01.teach.jaiket_svetar:
    title: 大衣、毛衣
    gloss: 大衣、毛衣
    note: '*जैकेट* 是阴性，*स्वेटर* 是阳性，从搭配的词就能看出来：*मेरी जैकेट*,*मेरा स्वेटर*。'
    example_gloss:
    - 我在找一件大衣。
    - 我有一件毛衣。
  hi.a1.unit26.lesson01.teach.paint_joote:
    title: 裤子、鞋子
    gloss: 裤子、鞋子
    note: '*पैंट* 指一条裤子，是一个单词(*मेरी पैंट*);*जूते* 是 *जूता* 的复数：以 *-आ* 结尾的阳性名词，复数变为 *-ए*。'
    example_gloss:
    - 我在找一条裤子。
    - 我在找鞋子。
  hi.a1.unit26.lesson01.teach.main_ek_jaiket:
    title: 说出你在找什么
    gloss: 我在找一件大衣。
    note: 动词放在句末：*मैं एक जैकेट ढूँढ़ रहा हूँ*。*रहा हूँ* 表示“正在找”(动作进行中),*रहा* 是阳性形式(女性说 *रही*)。
  hi.a1.unit26.lesson02.teach.saiz:
    title: 尺码
    gloss: 尺码
    note: '*साइज़* 是阳性名词，所以搭配的词也用阳性：*मेरा साइज़*。'
    example_gloss: 你穿什么尺码？
  hi.a1.unit26.lesson02.teach.apka_saiz_kya:
    title: 询问尺码
    gloss: 你穿什么尺码？
    note: '*कौन सा*(“哪一个”)用于在一组选项中询问选哪个，*सा* 与名词保持一致：*कौन सा साइज़*,但 *कौन सी जैकेट*。*आप* 是对店员使用的礼貌的“您”。'
  hi.a1.unit26.lesson02.teach.mera_saiz_em:
    title: 说出自己的尺码
    gloss: 我穿M码。
    note: 这里印地语不用表示“有”的动词：*मेरा साइज़ एम है* 字面意思是“我的尺码是M”,*मेरा* 与阳性的 *साइज़* 一致。
  hi.a1.unit26.lesson03.teach.kala_neela:
    title: 黑色，蓝色
    gloss: 黑色，蓝色
    note: 本课的两个基本颜色形容词。
    example_gloss:
    - 我想要黑色的大衣。
    - 这件你们还有蓝色的吗？
  hi.a1.unit26.lesson03.teach.mujhe_vah_jaiket:
    title: 指定颜色
    gloss: 我想要黑色的大衣。
    note: '*मुझे ... चाहिए* 是印地语表达“我想要”的方式：愿望“落在我身上”(*मुझे*),想要的东西紧放在 *चाहिए* 之前。'
  hi.a1.unit26.lesson03.teach.kya_apke_pas:
    title: 询问其他颜色
    gloss: 这件你们还有蓝色的吗？
    note: '*आपके पास ... है?*(字面是“在您那里……有？”)是礼貌地问“您有……吗？”的说法，*भी*(“也”)跟在所补充的词后面。'
  hi.a1.unit26.lesson04.teach.kya_yah_jaiket:
    title: 询问是否合身
    gloss: 这件大衣合身吗？
    note: 印地语说衣服“来得正好”:*ठीक आती है*。动词与物品一致，阴性的 *जैकेट* 用 *आती*,阳性的 *स्वेटर* 则用 *आता*。
  hi.a1.unit26.lesson04.teach.yah_ekdam_theek:
    title: 表示很合身
    gloss: 很合身。
    note: '*एकदम*(“完全”)表示“非常合身”;*आती है* 与阴性的 *जैकेट* 一致。'
  hi.a1.unit26.lesson04.teach.yah_bahut_chhotee:
    title: 太小
    gloss: 太小了。
    note: '*बहुत* 放在形容词前，这里表示“太……”:*बहुत छोटी*。形容词与阴性的 *जैकेट* 一致。'
  hi.a1.unit26.lesson04.teach.yah_bahut_baree:
    title: 太大
    gloss: 太大了。
    note: '*बड़ी* 的规律相同：*बड़ा* 用于阴性名词时变为 *बड़ी*,所以是 *बहुत बड़ी*。'
  hi.a1.unit26.lesson05.teach.nabbe:
    title: 九百
    gloss: 九百
    note: '*नौ सौ* 是数字900,用在外套的价格中。'
    example_gloss: 这件外套九百卢比。
  hi.a1.unit26.lesson05.teach.jaiket_kee_keemat:
    title: 说出价格
    gloss: 这件外套九百卢比。
    note: 印地语说“外套的价格是……”:*जैकेट की कीमत नौ सौ रुपये है*。*की* 与阴性的 *कीमत* 一致，而不是与 *जैकेट* 一致。
  hi.a1.unit26.lesson05.teach.sardee_kee_jaiket:
    title: 阅读商店小票
    gloss: 冬季外套：M码，黑色。价格：九百卢比。这件外套很合身，而且很暖和。
    note: 注意找出尺码、颜色、价格，以及大衣的两个优点。
    glosses:
      सर्दी: 冬季(外套)
      साइज़: 尺码
      रंग: 颜色
      काला: 黑色的
      कीमत: 票价
      नौ: 九
      सौ: 一百
      रुपये: 卢比
      जैकेट: 大衣
      आती: 合身
      गर्म: 温暖的
  hi.a1.unit26.lesson06.teach.priya_yah_jaiket:
    title: 普丽娅注意到那件外套
    gloss: 普丽娅：这件外套真好看！你穿什么尺码？
    note: '*अच्छी* 与阴性的 *जैकेट* 一致。*तुम्हारा* 是非正式的“你的”,用于朋友之间。'
  hi.a1.unit26.lesson06.teach.arjun_mera_saiz:
    title: 阿尔琼请求试穿
    gloss: 阿尔琼：我穿M码。我可以试穿一下吗？
    note: '*पहनकर देखना*(字面“穿上看看”)是印地语表示“试穿”的说法。*सकता हूँ* 表示“能”或“可以”,女性说 *सकती हूँ*。'
  hi.a1.unit26.lesson06.teach.priya_zaroor_kya:
    title: 普丽娅问合不合身
    gloss: 普丽娅：当然可以。合身吗？
    note: '*यह* 表示“它”或“这个”,*आती* 与阴性的 *जैकेट* 一致。'
  hi.a1.unit26.lesson06.teach.arjun_han_yah:
    title: 阿尔琼确认
    gloss: 阿尔琼：嗯，很合身，而且很暖和。
    note: 与前面阅读的小票完全一致——这是同一件大衣。
  hi.a1.unit26.lesson06.teach.priya_barhiya_tum:
    title: 普丽娅问颜色
    gloss: 普丽娅：太好了！你要黑色的还是蓝色的？
    note: '*या*(“或者”)用于提供选择。第二个 *रंग* 可以省略：*काले रंग में ... या नीले में*。*तुम* 是非正式的“你”。'
  hi.a1.unit26.lesson06.teach.arjun_main_ise:
    title: 阿尔琼做决定
    gloss: 阿尔琼：我要黑色的。
    note: '*लूँगा* 是 *लेना*(“拿、买”)的将来时，是在商店里决定买下时常用的动词。女性说 *लूँगी*。'
  hi.a1.unit26.lesson06.teach.main_leta_hoon:
    title: लेता हूँ 和 लेता है
    gloss: 我拿，他拿。
    note: '*-ता* 是习惯体的词尾，与主语一致；*हूँ* 搭配 *मैं*,*है* 搭配 *वह*。'
