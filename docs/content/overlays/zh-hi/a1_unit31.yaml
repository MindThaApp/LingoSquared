  hi.a1.unit31.appearance:
    title: 描述外貌
lessons:
  hi.a1.unit31.lesson01.lanba_chhota_boorha_aur:
    title: 高、矮、年老和年轻
  hi.a1.unit31.lesson02.balon_ke_bare_men:
    title: 描述头发
  hi.a1.unit31.lesson03.ankhen_aur_vah_kaisa:
    title: 眼睛和询问某人的外貌
  hi.a1.unit31.lesson04.priya_neena_ka_huliya:
    title: 普丽娅描述妮娜
  hi.a1.unit31.lesson05.vikram_aur_neha_kee:
    title: 比较维克拉姆和内哈
  hi.a1.unit31.lesson06.arjun_neena_ko_pahchanta:
    title: 阿俊认出妮娜
teaching:
  hi.a1.unit31.lesson01.teach.lanba_chhota:
    title: 高和矮
    gloss: 高的／矮的
    note: '*लंबा* 和 *छोटा* 用来描述身高，通常与 *कद*（“身高”）搭配：*नेहा का कद लंबा है*。修饰阳性名词时以 *-ा* 结尾，修饰阴性名词时以 *-ी* 结尾。'
    example_gloss:
    - 内哈个子高。
    - 维克拉姆个子矮。
  hi.a1.unit31.lesson01.teach.boorha_javan:
    title: 年老和年轻
    gloss: 年老的／年轻的
    note: '*बूढ़ा* 和 *जवान* 描述一个人看起来的年纪，不涉及具体数字。'
    example_gloss:
    - 爷爷年纪大了。
    - 阿俊很年轻。
  hi.a1.unit31.lesson01.teach.tumharee_umr_kitnee:
    title: उम्र 和 बूढ़ा
    gloss: 你多大了？爷爷年纪大了。
    note: 问确切的年龄时，印地语用 *उम्र*（“年龄”），而 *बूढ़ा* 只是描述一个人年老，不涉及数字。
  hi.a1.unit31.lesson01.teach.neha_ka_kad:
    title: 内哈个子高，维克拉姆个子矮
    gloss: 内哈个子高，维克拉姆个子矮。
    note: '*और*（“和”）连接两个描述，每个 *का कद* 都与阳性名词 *कद* 保持一致。'
  hi.a1.unit31.lesson02.teach.bal:
    title: 头发
    gloss: 头发
    note: '*बाल*（“头发”）在印地语中是阳性复数，所以描述它的词以 *-े* 结尾：*लंबे बाल*。'
    example_gloss: 阿俊有一头黑色短发。
  hi.a1.unit31.lesson02.teach.sunahre_bhoore_safed:
    title: 金色、棕色和白色
    gloss: 金色／棕色／白色
    note: 三种发色：*सुनहरे*、*भूरे* 和 *सफ़ेद*；放在 *बाल* 前面时以 *-े* 结尾。
    example_gloss:
    - 普丽娅有金色的头发。
    - 维克拉姆有棕色的头发。
    - 爷爷有一头白发。
  hi.a1.unit31.lesson02.teach.lanbe_chhote:
    title: 长和短（头发）
    gloss: 长的／短的（头发）
    note: '*लंबे*（“长的”）和 *छोटे*（“短的”）用来描述头发，因为 *बाल* 是复数，所以以 *-े* 结尾。'
    example_gloss:
    - 内哈有一头长发。
    - 维克拉姆有一头短发。
  hi.a1.unit31.lesson02.teach.lanbe_bal_chhote:
    title: बाल 前面的形容词
    gloss: 长发、短发、金发、棕发、白发、黑发。
    note: '*बाल* 是阳性复数，所以它前面的形容词以 *-े* 结尾：*लंबे बाल*、*भूरे बाल*。'
  hi.a1.unit31.lesson02.teach.uske_bal_lanbe:
    title: उसके：他的或她的
    gloss: 他（她）的头发很长。
    note: '*उसके* 既可以表示“他的”，也可以表示“她的”，要靠上下文判断；这里它与复数的 *बाल* 保持一致。'
  hi.a1.unit31.lesson02.teach.arjun_ke_bal:
    title: 阿俊有一头黑色短发
    gloss: 阿俊有一头黑色短发。
    note: '*काले* 这里再次出现，用来形容头发；因为 *बाल* 是复数，所以以 *-े* 结尾。'
  hi.a1.unit31.lesson02.teach.priya_ke_bal:
    title: 普丽娅有一头金色长发
    gloss: 普丽娅有一头金色长发。
    note: 这个自然的句子结合了本课表示头发长度和颜色的词汇。
  hi.a1.unit31.lesson03.teach.ankhen:
    title: 眼睛
    gloss: 眼睛
    note: '*आँखें*（“眼睛”）是阴性复数名词，单数是 *आँख*。'
    example_gloss: 阿俊有棕色的眼睛。
  hi.a1.unit31.lesson03.teach.neela_bhoora_hara:
    title: 蓝色、棕色和绿色
    gloss: 蓝色的／棕色的／绿色的
    note: 三种眼睛的颜色：*नीला*、*भूरा* 和 *हरा*；放在阴性的 *आँखें* 前面时变成 *नीली*、*भूरी* 和 *हरी*。
    example_gloss:
    - 普丽娅有蓝色的眼睛。
    - 维克拉姆有棕色的眼睛。
    - 内哈有绿色的眼睛。
  hi.a1.unit31.lesson03.teach.neelee_ankhen_bhooree:
    title: आँखें 前面的形容词
    gloss: 蓝色的眼睛、棕色的眼睛、绿色的眼睛。
    note: '*आँखें* 是阴性，所以它前面的形容词以 *-ी* 结尾：*नीली आँखें*。'
  hi.a1.unit31.lesson03.teach.priya_kaisee_dikhtee:
    title: 普丽娅长什么样？
    gloss: 普丽娅长什么样？
    note: '*कैसी दिखती है?*（“她看起来怎么样？”）是核心问句：问女性时用阴性的 *कैसी* 和 *दिखती*，问男性时用阳性的 *कैसा* 和 *दिखता*。'
  hi.a1.unit31.lesson03.teach.priya_ke_bal:
    title: 普丽娅有金色长发和蓝色眼睛
    gloss: 普丽娅有金色长发和蓝色眼睛。
    note: 这是一个示范回答：用 *और* 连接头发和眼睛。复数的 *बाल* 前面所属者用 *के*，阴性的 *आँखें* 前面用 *की*。
  hi.a1.unit31.lesson04.teach.priya_bhasha_kaife:
    title: 普丽娅介绍妮娜
    gloss: 普丽娅：语言咖啡馆来了一个新女孩。她叫妮娜。
    note: '*आ रही है*（“正在来”）用来引出新来的人，*उसका नाम ... है* 说出名字。'
  hi.a1.unit31.lesson04.teach.arjun_oke_vah:
    title: 阿俊问她长什么样
    gloss: 阿俊：好的！她长什么样？
    note: '*वह देखने में कैसी है?* 问的是“她看起来怎么样”；*वह* 既可以指“他”，也可以指“她”。'
  hi.a1.unit31.lesson04.teach.priya_uska_kad:
    title: 普丽娅描述妮娜的身高和头发
    gloss: 普丽娅：她个子矮，有一头金色短发。
    note: 这句话把身高和头发连在一起：*उसका कद छोटा है और उसके बाल छोटे और सुनहरे हैं*。
  hi.a1.unit31.lesson04.teach.arjun_aur_uskee:
    title: 阿俊问她的眼睛
    gloss: 阿俊：那她的眼睛呢？
    note: '*उसकी आँखें* 的意思是“她的眼睛”；*उसकी* 用阴性形式，与 *आँखें* 保持一致。'
  hi.a1.unit31.lesson04.teach.priya_uskee_ankhen:
    title: 普丽娅描述妮娜的眼睛
    gloss: 普丽娅：她的眼睛是绿色的。
    note: '*हरी* 以 *-ी* 结尾，因为 *आँखें* 是阴性。'
  hi.a1.unit31.lesson04.teach.arjun_shukriya_tab:
    title: 阿俊会认出她
    gloss: 阿俊：谢谢！那我就能认出她了。
    note: '*पहचान लूँगा*（“我会认出”）是 *पहचानना* 的将来时，*उसे* 的意思是“她（宾格）”。'
  hi.a1.unit31.lesson05.teach.vikram_aur_neha:
    title: 比较维克拉姆和内哈
    gloss: 维克拉姆和内哈是兄妹，但他们长得不一样。维克拉姆个子矮，有棕色的短发和棕色的眼睛。内哈比维克拉姆高，有棕色的长发和绿色的眼睛。你长什么样？
    note: 这段简短的比较复习了目前学过的所有颜色和长度词，最后用本单元的核心问题询问你的外貌。
    glosses:
      भाई: 兄弟
      बहन: 姐妹
      दिखते: 看起来
      अलग: 不同的
      छोटा: 矮的
      छोटे: 矮的
      भूरे: 棕色的
      बाल: 头发
      भूरी: 棕色的
      आँखें: 眼睛
      लंबी: 更高的
      लंबे: 长的
      हरी: 绿色的
      कैसे: 怎么样（如“你长什么样”）
  hi.a1.unit31.lesson05.teach.vikram_neha_se:
    title: 用 से 比较
    gloss: 维克拉姆比内哈矮。
    note: '*से* 在这里表示“比”，放在被比较的人后面：*नेहा से छोटा*，形容词紧接在动词之前。'
  hi.a1.unit31.lesson05.teach.neha_ke_bal:
    title: 娜哈的头发比维克拉姆的长
    gloss: 娜哈的头发比维克拉姆的长。
    note: '*लंबे* 与复数的 *बाल* 保持一致，*विक्रम से* 表示比较的对象。'
  hi.a1.unit31.lesson05.teach.mere_bal_chhote:
    title: 我留着棕色短发
    gloss: 我留着棕色短发。
    note: '*मेरे बाल छोटे और भूरे हैं*（“我的头发又短又棕”）是描述自己外貌的示范句；*मेरे* 与复数的 *बाल* 保持一致。'
  hi.a1.unit31.lesson06.teach.arjun_dekho_kya:
    title: 阿尔琼看到了妮娜
    gloss: 阿尔琼：看，那是妮娜吗？她留着金色短发，眼睛是绿色的。
    note: '*देखो*（“看”）是对朋友使用的非正式命令形式。'
  hi.a1.unit31.lesson06.teach.priya_han_vahee:
    title: 普丽娅确认
    gloss: 普丽娅：对，那就是妮娜！
    note: 这是一个简短自然的肯定回答。
  hi.a1.unit31.lesson06.teach.neena_hay_kya:
    title: 妮娜向阿尔琼打招呼
    gloss: 妮娜：嗨，你是阿尔琼吗？
    note: '*क्या तुम अर्जुन हो?* 是对同龄人使用的简单非正式问句。'
  hi.a1.unit31.lesson06.teach.arjun_han_tumse:
    title: 阿尔琼回应妮娜
    gloss: 阿尔琼：对！很高兴认识你，妮娜。
    note: '*तुमसे मिलकर अच्छा लगा* 是初次见面的标准说法；这种感受是“对你而言”产生的，所以不需要说“我”。'
  hi.a1.unit31.lesson06.teach.neena_mujhe_bhee:
    title: Nina 回应问候
    gloss: Nina：我也很高兴认识你！
    note: 对话结束——阿尔琼根据普丽娅之前的描述，成功认出了妮娜。
