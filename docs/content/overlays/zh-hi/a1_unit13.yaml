teaching:
  hi.a1.unit13.lesson01.teach.chai_coffee_review:
    title: 复习:茶、咖啡
    gloss: 茶，咖啡
    note: 快速复习第6单元的词汇,本单元谈论喜欢和不喜欢时会用到。
    example_gloss:
    - 我要茶。
    - 我要咖啡。
  hi.a1.unit13.lesson01.teach.mujhe_review:
    title: 复习:对我(来说)
    gloss: 对我(来说)
    note: 前面已学过的与格代词,在第6、7、11单元中一直在用——本单元为它搭配一个新的谓语成分。
    example_gloss: 我要茶。
  hi.a1.unit13.lesson01.teach.pasand:
    title: 喜欢;喜爱
    gloss: 喜欢/喜爱
    note: 这是一个表示“喜爱”(不是“最喜欢的”)的名词。它与与格主语(mujhe/tumhein)以及系动词 hai/hain 搭配,构成“我喜欢……”的说法。
    example_gloss: 我喜欢茶。
  hi.a1.unit13.lesson01.teach.pasand_hai_grammar:
    title: Pasand hai = 喜欢
    gloss: “Pasand hai”的意思是“X 令我喜欢”,也就是“我喜欢 X”。它和“mujhe...chahiye”(第6单元)一样,都以 mujhe/tumhein 开头;但“chahiye”后面不加“hai”,而“pasand”后面总要加“hai”或“hain”。
    note: 明确说明 chahiye(想要/需要)与 pasand hai(喜欢)在结构上的区别,避免两种句式混淆。
  hi.a1.unit13.lesson01.teach.sangeet:
    title: 音乐
    gloss: 音乐
    note: 这是一个新名词,用来练习 pasand hai 句式中单数、不可数的对象。
    example_gloss: 我喜欢音乐。
  hi.a1.unit13.lesson01.teach.haan_nahi_review:
    title: 复习:是的、不
    gloss: 是的;不
    note: 快速复习前面学过的两个词,本单元回答和否定“喜好”类问题时会用到。
    example_gloss:
    - 是的,我喜欢音乐。
    - 不,我不喜欢咖啡。
  hi.a1.unit13.lesson01.teach.pasand_nahi_hai_phrase:
    title: 我不喜欢咖啡。
    gloss: 我不喜欢咖啡。
    note: 否定的方式与前面学过的其他 hai 句完全相同(例如第3单元的“yoga class nahin hai”)——nahin 直接放在 hai 前面。
  hi.a1.unit13.lesson01.teach.kitab_kitaben:
    title: 书(单数/复数)
    gloss: 书;书(复数)
    note: 一对新名词,分别是单数和复数,用来说明 pasand 后面的“hai”/“hain”要与所喜欢事物的数保持一致。
    example_gloss:
    - 我喜欢这本书。
    - 我喜欢书。
  hi.a1.unit13.lesson01.teach.number_agreement_grammar:
    title: Pasand 后面的 hai 与 hain
    gloss: “pasand”后面的“hai”或“hain”要与所喜欢事物的“数”一致——和“mere paas...hai/hain”(第2单元)完全一样:茶/音乐用 pasand hai(单数),书用 pasand hain(复数)。
    note: 把第2单元已学的 hai/hain 数的一致规则直接延伸到新的场景,而不是引入新的语法概念。
  hi.a1.unit13.lesson02.teach.tumhein_review:
    title: 复习:对你(非正式)
    gloss: 对你(非正式)
    note: 第6单元与 chahiye 一起学过(“tumhein...chahiye?”)——本单元用同一个与格代词搭配 pasand hai。
    example_gloss: 你喜欢音乐吗？
  hi.a1.unit13.lesson02.teach.kya_tumhein_pasand_hai_grammar:
    title: Kya tumhein...pasand hai?
    gloss: 句首的“Kya”是是非问句的标记(第1单元);“tumhein”重复了“tumhein...chahiye?”(第6单元)中已用过的与格主语框架——这里用“pasand hai”取代“chahiye”。
    note: 说明这是对已学问句框架的再运用,而不是新的语法点。
  hi.a1.unit13.lesson02.teach.khel:
    title: 体育运动;游戏
    gloss: 运动/游戏
    note: 一个新名词。例句中与“yah”(这)搭配,以便明确数的一致,因为“khel”的单数和复数形式本身没有变化。
    example_gloss: 我喜欢这项运动。
  hi.a1.unit13.lesson02.teach.yah_review:
    title: 复习：这个
    gloss: 这个
    note: 第7单元学过(“mujhe yah chahiye”)——这里再次使用,以明确指代单数的“khel”。
    example_gloss: 这本书很好。
  hi.a1.unit13.lesson02.teach.ya_review:
    title: 复习：或者／还是
    gloss: 或者
    note: 第6/7单元在点餐和买东西时学过——这里再用它来提出关于喜好的选择问句。
    example_gloss: 茶还是咖啡?
  hi.a1.unit13.lesson02.teach.chai_ya_coffee_phrase:
    title: 你喜欢茶还是咖啡?
    gloss: 你喜欢茶还是咖啡?
    note: 把本课的 tumhein 问句框架与已学的 ya(或者)结合起来,请对方做出选择。
  hi.a1.unit13.lesson02.teach.zyada:
    title: 更
    gloss: 更
    note: 一个新词,直接放在“pasand hai”前面,用来在已提到的两样东西之间表达偏好。
    example_gloss: 我更喜欢茶。
  hi.a1.unit13.lesson02.teach.zyada_pasand_grammar:
    title: Zyada pasand hai = 更喜欢
    gloss: “X zyada pasand hai”表示在两样东西中偏爱其中一样——“mujhe chai zyada pasand hai”的意思是“我更喜欢茶”。
    note: 这是词汇上的扩展,不是新语法——“zyada”只是修饰已学过的“pasand hai”。
    target_text: '''X ज़्यादा पसंद है'' का मतलब है दो चीज़ों में से एक को तरजीह देना (偏爱) -- ''मुझे चाय ज़्यादा पसंद है'' का मतलब है ''मैं दूसरी चीज़ों से ज़्यादा चाय पसंद करता हूँ'' (我更喜欢茶)।'
  hi.a1.unit13.lesson03.teach.review_words:
    title: 复习:音乐、运动、书
    gloss: 音乐;运动/游戏;书(复数)
    note: 快速复习本单元的关键名词,对话和阅读短文会用到。
    example_gloss:
    - 我喜欢音乐。
    - 我不喜欢这项运动。
    - 我喜欢书。
  hi.a1.unit13.lesson03.teach.dialogue.line01:
    title: Arjun 询问音乐
    gloss: Priya,你喜欢音乐吗?
  hi.a1.unit13.lesson03.teach.dialogue.line02:
    title: Priya 说她非常喜欢
    gloss: 是的,我非常喜欢音乐。你呢?
  hi.a1.unit13.lesson03.teach.dialogue.line03:
    title: Arjun 表示赞同并补充运动
    gloss: 我也是!而且我也喜欢运动。
  hi.a1.unit13.lesson03.teach.dialogue.line04:
    title: Priya 喜欢书胜过这项运动
    gloss: 不错!我不喜欢这项运动。我喜欢书。
  hi.a1.unit13.lesson03.teach.dialogue.line05:
    title: Arjun 问喝茶还是咖啡
    gloss: 好的。你喜欢茶还是咖啡?
  hi.a1.unit13.lesson03.teach.dialogue.line06:
    title: Priya 更喜欢茶
    gloss: 我更喜欢茶。
  hi.a1.unit13.lesson03.teach.dialogue.line07:
    title: Arjun 表示赞同
    gloss: 太好了!我也喜欢茶。
  hi.a1.unit13.lesson03.teach.dialogue.line08:
    title: Priya 结束对话
    gloss: 好的!明天再见?
  hi.a1.unit13.lesson03.teach.chahiye_pasand_zyada_grammar:
    title: 三种相关的句式
    gloss: 本单元的三种句式:“chahiye”(想要/需要,第6单元)后面不加“hai”;“pasand hai/hain”(本单元)随事物的数变化;“zyada pasand hai”表示在两样东西中偏爱其中一样。
    note: 作为收尾总结,把整个单元的语法串联起来,与第12单元的变位总结式语法说明相呼应。
    target_text: 'इस यूनिट के तीन तरीके: ''चाहिए'' (चाहना/ज़रूरत, यूनिट 6) के बाद ''है'' नहीं आता; ''पसंद है/हैं'' (यह यूनिट) चीज़ की संख्या से बदलता है; ''ज़्यादा पसंद है'' का मतलब है दो में से एक को तरजीह देना (偏爱)।'
  hi.a1.unit13.lesson03.teach.priya_note:
    title: Priya 的留言
    gloss: Arjun,我非常喜欢音乐。我也喜欢书。我不喜欢这项运动。我更喜欢茶。——Priya
    note: 一则简短的书面留言,只复述对话中已经出现的内容,没有新增信息。
    glosses:
      संगीत: 音乐
      बहुत: 非常
      पसंद: 喜欢的;令人喜欢的
      किताबें: 书(复数)
      खेल: 游戏
      नहीं: 不
      चाय: 茶
      ज़्यादा: 更;宁愿
