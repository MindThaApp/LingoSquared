    title: Priya 和 Arjun:你做什么工作?
teaching:
  hi.a1.unit17.lesson01.teach.tum_tumhara_kya_review:
    title: 复习：你、你的、什么
    gloss: 你（非正式），你的（非正式），什么
    note: 快速复习向朋友询问职业所需的词语。
    example_gloss: 你叫什么名字？
  hi.a1.unit17.lesson01.teach.arjun_priya_review:
    title: 复习：阿尔琼、普丽娅
    gloss: 阿尔琼，普丽娅
    note: 本课要用这两个人物来引出带性别变化的问句，先回顾一下他们的名字。
    example_gloss:
    - 我叫阿尔琼。
    - 我叫普丽娅。
  hi.a1.unit17.lesson01.teach.copula_review:
    title: 复习：我、是
    gloss: 我，是（用于我），是（用于他/她），是（用于非正式的你）
    note: 本单元身份句所需的一整套简短系动词。
    example_gloss:
    - 你还好吗？
    - 我很好。
  hi.a1.unit17.lesson01.teach.kaam_review:
    title: 复习：工作
    gloss: 工作
    note: 第10/11单元学过——这里作为整个单元的主题词再次使用。
    example_gloss: 我有工作。
  hi.a1.unit17.lesson01.teach.karte_karti_karta_verb:
    title: 做（对男性说的“你”／对女性说的“你”／我，男）
    gloss: 做（你，男性，非正式），做（你，女性，非正式），做（我，男性）
    note: 把第10单元已学过的 -ta/-ti/-te 性数变化规则（第1单元的 *kya tum yog karti ho?* 中也出现过）延伸到动词 *karna*（做）。
    example_gloss:
    - 你做什么工作？
    - 我吃早餐。
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karte_ho_phrase:
    title: 你做什么工作？（对男性说）
    gloss: 你做什么工作？
    note: 本课的开场问句，对象是男性朋友。
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karti_ho_phrase:
    title: 你做什么工作？（对女性说）
    gloss: 你做什么工作？
    note: 同一个问句，对象是女性朋友——只有动词词尾发生变化。
  hi.a1.unit17.lesson01.teach.shikshak_shikshika:
    title: 老师（男／女）
    gloss: 老师（男），老师（女）
    note: 一对新的职业名词。与目前学过的大多数名词不同，这个词随说话人自己的性别而变化——见本课的语法说明。
    example_gloss:
    - 我是老师（男）。
    - 我是老师（女）。
  hi.a1.unit17.lesson01.teach.grammar_occupation_gender:
    title: Mein + 职业 + hoon
    gloss: '''Mein + 职业 + hoon'' 用来说明自己的职业，就是第1单元学过的 ''mein...hoon'' 句型。有些职业名称会随说话人自己的性别变化——''shikshak''（男）、''shikshika''（女），就像第10单元动词词尾 -ta/-ti 的变化一样。''Doctor'' 和 ''engineer'' 不变——男女用同一个词。'
    note: 在任何练习用到之前，先明确说明两种类型：随性别变化的名词和不变的外来词。
  hi.a1.unit17.lesson01.teach.doctor_review:
    title: 复习：医生
    gloss: 医生
    note: 第16单元学过——这里作为不随性别变化的职业词再次使用。
    example_gloss: 他/她是医生。
  hi.a1.unit17.lesson01.teach.mein_doctor_hoon_phrase:
    title: 我是医生。
    gloss: 我是医生。
    note: 把身份句型用在已学过的词上。
  hi.a1.unit17.lesson01.teach.engineer:
    title: 工程师
    gloss: 工程师
    note: 一个新的职业名词，和 *doctor* 一样不随性别变化。
    example_gloss: 他/她是工程师。
  hi.a1.unit17.lesson01.teach.mein_engineer_hoon_phrase:
    title: 我是工程师。
    gloss: 我是工程师。
    note: 把身份句型用在本课第二个新职业词上。
  hi.a1.unit17.lesson02.teach.kahan_review:
    title: 复习：哪里
    gloss: 哪里
    note: 第1单元学过——这里用来询问工作地点。
    example_gloss: 医院在哪里？
  hi.a1.unit17.lesson02.teach.mein_review:
    title: 复习：在……里／在
    gloss: 在
    note: 第1单元学过——这里用来说明工作地点。
    example_gloss: 我住在伦敦。
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karte_ho_phrase:
    title: 你在哪里工作？（对男性说）
    gloss: 你在哪里工作？
    note: 本课的开场问句，对象是男性朋友。
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karti_ho_phrase:
    title: 你在哪里工作？（对女性说）
    gloss: 你在哪里工作？
    note: 同一个问句，对象是女性朋友。
  hi.a1.unit17.lesson02.teach.school_review:
    title: 复习：学校
    gloss: 学校
    note: 第8单元学过——本课的第一个工作地点。
    example_gloss: 我在学校工作（女性说话人）。
  hi.a1.unit17.lesson02.teach.mein_school_mein_kaam_karti_hoon_phrase:
    title: 我在学校工作。
    gloss: 我在学校工作。
    note: 把工作地点句型用在学校上，女性形式。
  hi.a1.unit17.lesson02.teach.hospital_review:
    title: 复习：医院
    gloss: 医院
    note: 第8单元学过——本课的第二个工作地点，与医生这一职业搭配。
    example_gloss: 医生在医院工作。
  hi.a1.unit17.lesson02.teach.daftar:
    title: 办公室
    gloss: 办公室
    note: 一个新名词，本课的第三个工作地点，与工程师这一职业搭配。
    example_gloss: 我在办公室工作（男性说话人）。
  hi.a1.unit17.lesson02.teach.mein_daftar_mein_kaam_karta_hoon_phrase:
    title: 我在办公室工作。
    gloss: 我在办公室工作。
    note: 把工作地点句型用在办公室上，男性形式。
  hi.a1.unit17.lesson02.teach.grammar_workplace:
    title: 地点 + mein + kaam karta/karti hoon
    gloss: '''[地点] + mein + kaam karta/karti hoon'' 把三个已学过的部分组合在一起：''mein''（第1单元，''London mein rehta hoon''）、''kaam''（第10/11单元），以及 ''karna'' 的 -ta/-ti/-te 形式（第10单元的 ''nashta karta hoon''，以及第1单元的 ''kya tum yog karti ho?''）。这并不是新的语法——只是第一次把这三部分合在同一个句子里。'
    note: 在组合之前，按单元编号逐一点明每个已学过的部分，与之前每条语法说明的呈现方式一致。
  hi.a1.unit17.lesson03.teach.roz_review:
    title: 复习：每天
    gloss: 每天
    note: 第10单元学过——这里用来描述每天的工作日常。
    example_gloss: 我每天工作。
  hi.a1.unit17.lesson03.teach.jaana_forms_review:
    title: 复习：去（你，女／你，男／我，男）
    gloss: 去（你，女性，非正式），去（你，男性，非正式），去（我，男性）
    note: '*jana*（去）已学过的 -ta/-ti/-te 形式，在第10单元首次讲到，这里用于每天上班的往返。'
    example_gloss:
    - 我每天去学校（女性说话人）。
    - 你每天去办公室吗？（对男性说）
  hi.a1.unit17.lesson03.teach.bhi_haan_review:
    title: 复习：也、是的
    gloss: 也，是的
    note: 两个词都已学过（第1单元和第1/6/13单元）——在本课的对话中再次使用。
    example_gloss: 是的，我也很喜欢。
  hi.a1.unit17.lesson03.teach.dialogue.line01:
    title: 阿尔琼问普丽娅的工作
    gloss: 普丽娅，你做什么工作？
  hi.a1.unit17.lesson03.teach.dialogue.line02:
    title: 普丽娅说她是学校的老师
    gloss: 我是老师。我在学校工作。
  hi.a1.unit17.lesson03.teach.dialogue.line03:
    title: 阿尔琼问她是不是每天去学校
    gloss: 不错！你每天去学校吗？
  hi.a1.unit17.lesson03.teach.dialogue.line04:
    title: 普丽娅回答是，并向阿尔琼问同样的问题
    gloss: 是的，我每天去学校。你做什么工作？
  hi.a1.unit17.lesson03.teach.dialogue.line05:
    title: 阿尔琼说他是办公室的工程师
    gloss: 我是工程师。我在办公室工作。
  hi.a1.unit17.lesson03.teach.dialogue.line06:
    title: 普丽娅问他是不是也每天去办公室
    gloss: 太好了！你也每天去办公室吗？
  hi.a1.unit17.lesson03.teach.dialogue.line07:
    title: 阿尔琼回答是
    gloss: 是的，我每天去办公室。
  hi.a1.unit17.lesson03.teach.dialogue.line08:
    title: 普丽娅向他道谢
    gloss: 好的，谢谢。
  hi.a1.unit17.lesson03.teach.grammar_summary:
    title: 三条主要规则
    gloss: 本单元的三条主要规则：(1) 'mein + 职业 + hoon' 用来说明职业（例如 'mein shikshika hoon'），有些职业名称会随说话人自己的性别变化；(2) '[地点] + mein + kaam karta/karti hoon' 用来说明工作地点（例如 'mein daftar mein kaam karta hoon'）；(3) 'roz [地点] jata/jati hoon' 用来说明每天的习惯，规则与第10单元的 -ta/-ti 相同。
    note: 收尾总结，把整个单元的语法串联起来，与第15/16单元各自把整套变化串联起来的语法说明相呼应。
  hi.a1.unit17.lesson03.teach.work_profile_reading:
    title: 阅读简短介绍
    gloss: 普丽娅是老师。她在学校工作。阿尔琼是工程师。他在办公室工作。
    note: 一份简短直接的介绍（没有新的叙述框架），只复述对话中已经出现的事实，不添加新内容——直接服务于本课“读懂简短工作介绍”的目标。
    glosses:
      शिक्षिका: 老师（女）
      स्कूल: 学校
      काम: 工作
      करती: 做／工作（阴性，来自 करना）
      इंजीनियर: 工程师
      दफ़्तर: 办公室
      करता: 做／工作（阳性，来自 करना）
