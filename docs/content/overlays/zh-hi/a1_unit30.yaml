teaching:
  hi.a1.unit30.lesson01.teach.parhna_kasrat_karna:
    title: 阅读、锻炼、做饭
    gloss: 阅读、锻炼／做运动、做饭
    note: 印地语用以 *-ना* 结尾的动词来表示爱好：*पढ़ना*、*कसरत करना*、*खाना बनाना*（“读书”“锻炼”“做饭”）。
    example_gloss:
    - 我喜欢读书。
    - 我每逢星期六都锻炼。
    - 我喜欢为朋友们做饭。
  hi.a1.unit30.lesson01.teach.khalee_samay:
    title: 空闲时间
    gloss: 空闲时间
    note: '*खाली समय*（字面是“空的时间”）是谈论爱好的关键短语，*में* 表示“在……中”：*खाली समय में*。'
    example_gloss: 我空闲时喜欢阅读。
  hi.a1.unit30.lesson01.teach.mujhe_khalee_samay:
    title: 表达你空闲时做什么
    gloss: 我空闲时喜欢阅读。
    note: '*मुझे ... पढ़ना पसंद है*（字面是“对我来说，读书是喜欢的”）就是印地语表达“我喜欢读书”的方式；*मुझे* 标明喜欢的人。'
  hi.a1.unit30.lesson02.teach.sangeet_sunna_chitr:
    title: 音乐、画画、电子游戏
    gloss: 听音乐、画画、玩电子游戏
    note: 再学三个爱好：*संगीत सुनना*、*चित्र बनाना* 和 *गेम खेलना*；*गेम* 是外来借词。
    example_gloss:
    - 我喜欢听音乐。
    - 我经常画画。
    - 我喜欢和朋友们一起玩电子游戏。
  hi.a1.unit30.lesson02.teach.mujhe_sangeet_sunna:
    title: 表达你喜欢听音乐
    gloss: 我喜欢听音乐。
    note: '*संगीत सुनना*（“听音乐”）不需要额外的词：宾语直接放在动词前面。'
  hi.a1.unit30.lesson02.teach.mujhe_doston_ke:
    title: 表达喜欢和朋友一起玩电子游戏
    gloss: 我喜欢和朋友们一起玩电子游戏。
    note: '*दोस्तों के साथ*（“和朋友们一起”）中，*दोस्त* 因为位于 *के साथ* 之前，要用复数斜格 *दोस्तों*。'
  hi.a1.unit30.lesson03.teach.hamesha_aksar_kabheekbhee:
    title: 总是、经常、有时、从不
    gloss: 总是、经常、有时、从不
    note: '*हमेशा*、*अक्सर*、*कभी-कभी*、*कभी नहीं* 这类频率词通常放在动词前面，*कभी नहीं* 表示“从不”。'
    example_gloss:
    - 我每周六都锻炼。
    - 我经常读书。
    - 我有时画画。
    - 我从不玩电子游戏。
  hi.a1.unit30.lesson03.teach.har_hafte_har:
    title: 每周、每个周末
    gloss: 每周、每个周末
    note: '*हर*（“每”）形式不变，后面的时间词也保持简单形式：*हर हफ़्ते*、*हर वीकेंड*。'
    example_gloss:
    - 我每周都为朋友做饭。
    - 我每个周末都锻炼。
  hi.a1.unit30.lesson03.teach.har_hafte_har_2:
    title: हर 不变形
    gloss: 每周，每个周末。
    note: 无论后面接什么名词，*हर* 都保持不变，所以不需要选择形式：*हर हफ़्ते*、*हर वीकेंड*。
  hi.a1.unit30.lesson03.teach.tum_khalee_samay:
    title: 询问空闲时间
    gloss: 你空闲时做什么？
    note: 这是本单元的核心问题，可以用它询问任何人的爱好。
  hi.a1.unit30.lesson04.teach.priya_ham_aksar:
    title: 普丽娅聊起爱好
    gloss: 普丽娅：我们经常一起散步。可是阿俊，你空闲时间还做些什么？
    note: '*टहलते हैं* 用复数，因为主语是 *हम*（“我们”）；*अक्सर* 放在动词前面。'
  hi.a1.unit30.lesson04.teach.arjun_mujhe_khana:
    title: 阿俊的爱好
    gloss: 阿俊：我喜欢做饭，在家也做。我还经常锻炼。
    note: '*घर पर भी*（“在家也”）说明阿俊做饭是出于兴趣，而不只是工作需要。'
  hi.a1.unit30.lesson04.teach.priya_tum_ghar:
    title: 普丽娅很惊讶
    gloss: 普丽娅：你在家也做饭？你上班一整天不是都在做饭吗！
    note: '*पूरा दिन*（“一整天”）强调他在工作中已经做了很多饭，*तो* 增强语气。'
  hi.a1.unit30.lesson04.teach.arjun_han_lekin:
    title: 阿俊解释
    gloss: 阿俊：是啊，不过做饭能让我放松。那你呢，你喜欢做什么？
    note: '*खाना बनाने से सुकून मिलता है* 的意思是“做饭让我放松”（字面是“从做饭中得到安宁”）；*बनाना* 在 *से* 前变成 *बनाने*。'
  hi.a1.unit30.lesson04.teach.priya_mujhe_parhna:
    title: 普丽娅的爱好
    gloss: 普丽娅：我喜欢读书，还经常听音乐。
    note: '*और*（“和”）连接两个爱好；*सुनती हूँ* 用阴性，因为说话的是普丽娅。'
  hi.a1.unit30.lesson04.teach.arjun_kya_tum:
    title: 阿俊问起玩游戏
    gloss: 阿俊：你也玩游戏吗？
    note: 一个简短的是非问句：以 *क्या* 开头；*खेलती हो* 用阴性，因为阿俊问的是普丽娅。
  hi.a1.unit30.lesson04.teach.priya_naheen_main:
    title: 普丽娅的回答
    gloss: 普丽娅：不，我从来不玩游戏。不过我有时会画画！
    note: '*कभी ... नहीं*（“从不”）和 *कभी-कभी*（“有时”）在同一个回答中形成对比。'
  hi.a1.unit30.lesson05.teach.arjun_aur_main:
    title: 比较爱好
    gloss: 阿俊和我经常一起散步。不过我们还有别的爱好。阿俊喜欢做饭，在家也做，还经常锻炼。我喜欢读书，也经常听音乐。我有时画画，但从来不玩游戏。你空闲时间喜欢做什么？
    note: 普丽娅的消息回顾了前面学过的内容，并以本单元的核心问题向读者提问作结。
    glosses:
      टहलते: 散步
      अक्सर: 经常
      साथ: 一起
      और: 其他的
      बनाना: 做（做饭）
      पसंद: 喜欢
      घर: 在家
      कसरत: 锻炼
      पढ़ना: 阅读
      सुनती: 听
      संगीत: 音乐
      चित्र: 图画（画画）
      कभी-कभी: 有时
      गेम: 玩电子游戏
      कभी: 从不（与 नहीं 连用）
      खाली: 空闲的
      समय: 时间
  hi.a1.unit30.lesson06.teach.arjun_tum_is:
    title: 阿俊问周末的安排
    gloss: 阿俊：这个周末你打算做什么？
    note: '*इस वीकेंड*（“这个周末”）中 *इस* 放在名词前；*कर रही हो* 是进行体“你在做”，用阴性，因为对方是普丽娅。'
  hi.a1.unit30.lesson06.teach.priya_abhee_pata:
    title: 普丽娅还没决定
    gloss: 普丽娅：还不知道。我喜欢读书，不过也想出去走走。
    note: '*बाहर जाना चाहती हूँ* 的意思是“我想出去”；*चाहती* 用阴性，且放在 *जाना* 之后。'
  hi.a1.unit30.lesson06.teach.arjun_chalo_sath:
    title: 阿俊提出计划
    gloss: 阿俊：我们一起去散步吧？之后我给我们做饭。
    note: '*उसके बाद*（“在那之后”）把两个计划按先后排序；*चलो ... टहलें* 提出第一个提议。'
  hi.a1.unit30.lesson06.teach.priya_achchha_aidiya:
    title: 普丽娅同意
    gloss: 普丽娅：好主意！散步和做饭我都喜欢。
    note: '*दोनों पसंद हैं* 表示普丽娅两样都喜欢，动词用复数 *हैं*。'
  hi.a1.unit30.lesson06.teach.arjun_barhiya_to:
    title: 阿俊确认
    gloss: 阿俊：太好了。那就星期六见！
    note: '*शनिवार को मिलते हैं*（“我们星期六见面”）用现在时表示已定的安排，*को* 标明日期。'
