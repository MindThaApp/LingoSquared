teaching:
  hi.a1.unit28.lesson01.teach.fon_karna:
    title: 打电话
    gloss: 打电话
    note: 表示打电话的动词的不定式。
    example_gloss: 我得给你打电话。
  hi.a1.unit28.lesson01.teach.main_tumhen_fon:
    title: 说你会打电话
    gloss: 我给你打电话。
    note: '*करूँगा* 是 *करना* 的将来时，用来表示“我会……”（比如承诺）。被打电话的人用 *तुम्हें*（“给你”）。'
  hi.a1.unit28.lesson01.teach.hailo_main_priya:
    title: 接电话
    gloss: 喂，我是普丽娅。
    note: 在电话里要说 *मैं ... बोल रही हूँ*（“我是……”，字面“我在说话”）；因为普丽娅是女性，所以用阴性的 *रही*。
  hi.a1.unit28.lesson01.teach.hailo_main_arjun:
    title: 阿尔琼也这样接电话
    gloss: 喂，我是阿尔琼。
    note: 句型相同，但用阳性的 *रहा*：*मैं अर्जुन बोल रहा हूँ*，因为阿尔琼是男性。
  hi.a1.unit28.lesson02.teach.main_kisse_bat:
    title: 询问对方是谁
    gloss: 请问您是哪位？
    note: '*किससे*（“和谁”）由 *कौन*（“谁”）加 *से* 构成，*से* 标示与你交谈的人。'
  hi.a1.unit28.lesson02.teach.ap_priya_se:
    title: 礼貌地表明身份
    gloss: 您正在和普丽娅通话。
    note: '*आप* 是对陌生人用的敬称“您”。*प्रिया से बात कर रहे हैं* 把 *से* 放在名字后面，*हैं* 与 *आप* 搭配。'
  hi.a1.unit28.lesson03.teach.kya_tum_yah:
    title: 请对方重复
    gloss: 你能重复一遍吗？
    note: '*सकते हो* 表示“能、可以”，放在主要动词之后：*कह सकते हो*。句首的 *क्या* 使句子成为疑问句。'
  hi.a1.unit28.lesson03.teach.itna_tez_mat:
    title: 请对方说慢一点
    gloss: 请别说得这么快。
    note: '*मत बोलो* 是对 *तुम* 说的亲切的“别说”，*इतना तेज़* 的意思是“这么快”。'
  hi.a1.unit28.lesson03.teach.mujhe_tumharee_avaz:
    title: 说你听不清
    gloss: 我听不清你说话。
    note: 印地语说“你的声音没有来到”：*मुझे तुम्हारी आवाज़ नहीं आ रही है*。说话人用 *मुझे*，声音是主语。
  hi.a1.unit28.lesson04.teach.maisej:
    title: 短信
    gloss: 短信
    note: '*मैसेज* 是常用外来词，为阳性：*एक मैसेज*，*यह मैसेज ... का है*。'
    example_gloss: 这条短信是普丽娅发来的。
  hi.a1.unit28.lesson04.teach.main_tumhen_ek:
    title: 说你会发短信
    gloss: 我给你发条短信。
    note: 顺序是先人、再物、最后动词：*तुम्हें एक मैसेज भेजूँगा*。*भेजना* 的意思是“发送”。
  hi.a1.unit28.lesson04.teach.main_tumhen_bad:
    title: 说你会回电话
    gloss: 我稍后给你回电话。
    note: '*वापस फ़ोन करना* 表示“回电话”，*वापस* 放在 *फ़ोन करना* 之前；*बाद में* 的意思是“稍后”。'
  hi.a1.unit28.lesson05.teach.arjun_hay_priya:
    title: 阅读短信对话
    gloss: 阿尔琼：嗨，普丽娅，你能给我打个电话吗？我有件重要的事要告诉你。普丽娅：好的，当然，五分钟后我给你回电话。
    note: 注意阿尔琼要求什么、为什么，以及普丽娅说什么时候回电话。
    glosses:
      हाय: 你好
      सकती: 能够;可以
      फ़ोन: 打电话;称呼
      ज़रूरी: 重要的（如：有重要的事要说）
      कुछ: 某事物
      बतानी: 讲述;告诉
      ज़रूर: 当然
      करूँगी: 会打电话
      पाँच: 五
      मिनट: 分钟
      वापस: 回;返回
  hi.a1.unit28.lesson06.teach.arjun_hailo_main:
    title: 阿尔琼接电话
    gloss: 阿尔琼：喂，我是阿尔琼。
    note: 接电话的人先用 *मैं ... बोल रहा हूँ* 报上自己的名字，这里用阳性的 *रहा*。
  hi.a1.unit28.lesson06.teach.priya_hay_arjun:
    title: 普丽娅自报身份
    gloss: 普丽娅：嗨，阿尔琼，我是普丽娅。阿尔琼：你打来真好！
    note: '*अच्छा हुआ तुमने फ़ोन किया* 的意思是“你打电话来真好”；*तुमने ... किया* 是带 *ने* 的过去时。'
  hi.a1.unit28.lesson06.teach.priya_tumharee_pahlee:
    title: 普丽娅询问班上的情况
    gloss: 普丽娅：你的第一个班怎么样？
    note: '*कैसी रही* 问的是“怎么样”；因为 *शिफ़्ट* 是阴性，所以 *कैसी* 也是阴性。'
  hi.a1.unit28.lesson06.teach.arjun_bahut_achchhee:
    title: 阿尔琼报告好消息
    gloss: 阿尔琼：非常好，比我想的还要好。
    note: '*अच्छी रही*（“很顺利”）与阴性的 *शिफ़्ट* 一致，*जितना मैंने सोचा था उससे भी बेहतर* 的意思是“比我想的还要好”。'
  hi.a1.unit28.lesson06.teach.vah_narvas_tha:
    title: था 和 थी：“曾是、当时是”
    gloss: 他当时很紧张，她当时很开心。
    note: '*था* 用于阳性主语，*थी* 用于阴性主语，表示“过去是”；词尾与所描述的人或事物一致。'
  hi.a1.unit28.lesson06.teach.priya_yah_sunkar:
    title: 普丽娅很自豪
    gloss: 普丽娅：听到这个真高兴！我为你感到骄傲。
    note: '*तुम पर गर्व है*（字面“自豪在你身上”）用 *पर*，感到自豪的人用 *मुझे*。'
  hi.a1.unit28.lesson06.teach.arjun_bahut_shukriya:
    title: 阿尔琼很感动
    gloss: 阿尔琼：非常感谢，这对我意义重大。
    note: '*मेरे लिए* 的意思是“对我来说”，*इसका बहुत मतलब है* 是“意义重大”。'
  hi.a1.unit28.lesson06.teach.uskee_pahlee_shift:
    title: 他的
    gloss: 他的第一个班进行得非常顺利。
    note: '*उसकी* 的意思是“他的”或“她的”（两者同一个词），并与阴性的 *शिफ़्ट* 一致。'
