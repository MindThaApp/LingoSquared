  notes: 'Derived from en-hi by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Chinese (Mandarin, Simplified) string was translated and adapted. Needs native Chinese (Mandarin, Simplified) review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  existential_quantity: '"[Place] + में + [number] + [noun] + है/हैं" states what''s in a home and how many. The verb must agree with the NUMBER (है for one, हैं for more than one), not with the place -- a typed answer mismatching singular/plural verb agreement (e.g. "घर में तीन कमरा है") is the exact ungrammatical error this unit''s own grammar_check exercises target, and should be marked incorrect, not tolerated as a minor typo.'
  masculine_plural: '*Kamra* (one room) becomes *kamre* (more than one room) -- the "-आ" ending masculine noun plural rule. A typed answer using the singular form where the sentence''s own number word calls for plural (or vice versa) is a real grammar error, not a typo.'
  feminine_plural: '*Kursi* (one chair) becomes *kursiyan* (more than one chair); *khidki* (one window) becomes *khidkiyan* (more than one window) -- the "-ई" ending feminine noun plural rule, a genuinely different pattern from the masculine rule above. Judge the same way: wrong number agreement is a grammar error, not a typo.'
  scope_note: '*Mez* (table), *bistar* (bed), *bathroom*, and *bedroom* are kept singular-only in this unit''s own exercises by design (their own plural rules aren''t taught yet) -- don''t expect or accept a plural form of these four words as a typed answer here.'
  gender_agreement: '*Bada*/*chota* (big/small) agree with the noun''s own gender -- masculine घर takes *bada*/*chota* (not *badi*/*choti*), feminine रसोई takes *badi* (not *bada*), matching unit 14''s already-taught gender-agreement rule. A typed answer using the wrong gender form is marked incorrect as a real grammar error, not tolerated.'
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation. For any exercise asking the learner to describe their own home, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: 印地语 A1
units:
  hi.a1.unit18.housing:
    title: 住房
lessons:
  hi.a1.unit18.lesson01.kamra_rasoi_bathroom_bedroom:
    title: 房间、厨房、浴室和卧室
  hi.a1.unit18.lesson02.mez_kursi_bistar_khidki:
    title: 桌子、椅子、床和窗户
  hi.a1.unit18.lesson03.priya_arjun_ghar:
    title: 普里娅和阿琼：房子是什么样的？
teaching:
  hi.a1.unit18.lesson01.teach.ghar_review:
    title: 复习：房子／家
    gloss: 房子／家
    note: 第8单元已学过——这是本单元的主题词。
    example_gloss: 这是一座房子。
  hi.a1.unit18.lesson01.teach.mein_review:
    title: 复习：在……里／在
    gloss: 在
    note: 第1单元已学过——本单元用它来说明房间和物品所在的位置。
    example_gloss: 我在办公室工作。
  hi.a1.unit18.lesson01.teach.hai_hain_review:
    title: 复习：是（单数）、是（复数）
    gloss: 是（单数）、是（复数）
    note: 本单元的数量句型完全依赖这一对单复数系动词。
    example_gloss:
    - 这是一座房子。
    - 我的爷爷住在德里。
  hi.a1.unit18.lesson01.teach.numbers_review:
    title: 复习：多少、一、二、三
    gloss: 多少、一、二、三
    note: 第2、7单元已学过——这里用来数房间。
    example_gloss:
    - 我有三个兄弟。
    - 房子里有几个房间？
  hi.a1.unit18.lesson01.teach.kamra_kamre:
    title: 房间（单数／复数）
    gloss: 房间、房间们
    note: 新名词。注意复数：*kamra*（一个）变为 *kamre*（多个）——见本课的语法说明。
    example_gloss:
    - 房子里有一个房间。
    - 房子里有三个房间。
  hi.a1.unit18.lesson01.teach.grammar_room_plural:
    title: 阳性 -a → -e 复数
    gloss: 以“-a”结尾的阳性名词，复数变为“-e”——“kamra”（一个）变成“kamre”（多个）。动词也随数量变化：一个用“hai”，多个用“hain”——例如“ghar mein ek kamra hai”（房子里有一个房间），而“ghar mein teen kamre hain”（房子里有三个房间）。
    note: 这是本课程第一条正式讲解的名词复数规则，在任何练习用到它之前先行说明。
  hi.a1.unit18.lesson01.teach.rasoi:
    title: 厨房
    gloss: 厨房
    note: 新名词，是本单元的第一个房间词。
    example_gloss: 房子里有一间厨房。
  hi.a1.unit18.lesson01.teach.bathroom:
    title: 浴室
    gloss: 浴室
    note: 日常印地语口语中常见的外来词，和 *doctor*／*engineer*（第16、17单元）的情况相同。
    example_gloss: 房子里有一个卫生间。
  hi.a1.unit18.lesson01.teach.bedroom:
    title: 卧室
    gloss: 卧室
    note: 这也是一个常用的外来词，和 *bathroom* 一样形式不变，不加自己的复数词尾，只用数词 + *hain* 的结构。
    example_gloss: 房子里有两间卧室。
  hi.a1.unit18.lesson01.teach.ghar_mein_kitne_kamre_phrase:
    title: 房子里有几个房间？
    gloss: 房子里有几个房间？
    note: 本课开头的问句。
  hi.a1.unit18.lesson01.teach.ghar_mein_teen_kamre_phrase:
    title: 房子里有三个房间。
    gloss: 房子里有三个房间。
    note: 对本课开头问句的示范回答。
  hi.a1.unit18.lesson02.teach.aur_review:
    title: 复习：和
    gloss: 和
    note: 第1单元已学过——这里用来把几件家具连起来列举。
    example_gloss: 我也觉得不错，你呢？
  hi.a1.unit18.lesson02.teach.mez:
    title: 桌子
    gloss: 桌子
    note: 新名词，本单元的练习中只用单数形式（它的复数规则还没有讲）。
    example_gloss: 厨房里有一张桌子。
  hi.a1.unit18.lesson02.teach.kursi_kursiyan:
    title: 椅子（单数／复数）
    gloss: 椅子
    note: 新名词。注意复数：*kursi*（一把）变成 *kursiyan*（多把），这与 *kamra*/*kamre* 的规则不同，请看本课自己的语法说明。
    example_gloss:
    - 厨房里有一把椅子。
    - 厨房里有四把椅子。
  hi.a1.unit18.lesson02.teach.chaar_review:
    title: 复习：四
    gloss: 四
    note: 第2单元已学过——这里用来数椅子。
    example_gloss: 厨房里有四把椅子。
  hi.a1.unit18.lesson02.teach.grammar_feminine_plural:
    title: 阴性 -i → -iyan 复数
    gloss: 以“-i”结尾的阴性名词，复数变为“-iyan”——“kursi”（一把）变成“kursiyan”（多把）。这与本单元前面“kamra”变成“kamre”的阳性规则类似，但规则不同，因为这个词是阴性，并且以“-i”结尾。
    note: 本单元的第二条复数规则，紧接第一条讲解，方便对比。
  hi.a1.unit18.lesson02.teach.bistar:
    title: 床
    gloss: 床
    note: 新名词，本单元的练习中只用单数形式。
    example_gloss: 卧室里有一张床。
  hi.a1.unit18.lesson02.teach.khidki_khidkiyan:
    title: 窗户（单数／复数）
    gloss: 窗户
    note: 与 *kursi*/*kursiyan* 一样，遵循阴性“-i”→“-iyan”的复数规则。
    example_gloss:
    - 卧室里有一扇窗户。
    - 卧室里有两扇窗户。
  hi.a1.unit18.lesson02.teach.rasoi_mein_mez_phrase:
    title: 厨房里有一张桌子。
    gloss: 厨房里有一张桌子。
    note: “地点 + 物品”句型用于厨房。
  hi.a1.unit18.lesson02.teach.bedroom_mein_bistar_phrase:
    title: 卧室里有一张床。
    gloss: 卧室里有一张床。
    note: “地点 + 物品”句型用于卧室。
  hi.a1.unit18.lesson03.teach.kaisa_review:
    title: 复习：怎么样／什么样
    gloss: 怎么样／什么样
    note: 第12单元已学过——这里用来询问住所的情况。
    example_gloss: 你家怎么样？
  hi.a1.unit18.lesson03.teach.bada_chota_review:
    title: 复习：大、小
    gloss: 大（阳性）、大（阴性）、小（阳性）、小（阴性）
    note: 第14单元已学过——这里用来描述住所。词形随名词的性变化：阳性的 *ghar* 用 *bada*/*chota*，阴性的 *rasoi* 用 *badi*。
    example_gloss:
    - 我家很小。
    - 这是一个大厨房。
  hi.a1.unit18.lesson03.teach.ya_review:
    title: 复习：或者／还是
    gloss: 或者
    note: 第14单元已学过——这里用来提出选择问句。
    example_gloss: 你家大还是小？
  hi.a1.unit18.lesson03.teach.arjun_priya_review:
    title: 复习：阿俊、普丽娅
    gloss: 阿俊、普丽娅
    note: 在本课的排序／语法练习用他们的名字说明是谁的家之前，先回顾这两个人物的名字。
    example_gloss:
    - 我叫阿俊。
    - 我叫普丽娅。
  hi.a1.unit18.lesson03.teach.ka_review:
    title: 复习：……的（所属）
    gloss: ……的（所属，用于阳性名词）
    note: 第7／10／12／14／15单元已学过——这里用来说明是谁的房子，本单元中一律保持基本主格形式（见本文件自己的范围说明）。
    example_gloss: 普丽娅的家很小。
  hi.a1.unit18.lesson03.teach.dialogue.line01:
    title: 阿俊问普丽娅她家的情况
    gloss: 普丽娅，你家大还是小？
  hi.a1.unit18.lesson03.teach.dialogue.line02:
    title: 普丽娅说她家很小
    gloss: 我家很小。房子里有两个房间，一个厨房和一个卫生间。
  hi.a1.unit18.lesson03.teach.dialogue.line03:
    title: 普丽娅向阿俊问同样的问题
    gloss: 那你家呢，阿俊？
  hi.a1.unit18.lesson03.teach.dialogue.line04:
    title: 阿俊说他家很大
    gloss: 我家很大。房子里有三间卧室，还有一个大厨房。
  hi.a1.unit18.lesson03.teach.dialogue.line05:
    title: 普丽娅问卧室里有什么
    gloss: 哇！卧室里有什么？
  hi.a1.unit18.lesson03.teach.dialogue.line06:
    title: 阿俊描述卧室
    gloss: 卧室里有一张床和两扇窗户。
  hi.a1.unit18.lesson03.teach.dialogue.line07:
    title: 普丽娅的反应
    gloss: 太好了！
  hi.a1.unit18.lesson03.teach.dialogue.line08:
    title: 阿俊向她道谢
    gloss: 谢谢！
  hi.a1.unit18.lesson03.teach.grammar_summary:
    title: 三条主要规则
    gloss: 本单元的三条主要规则：（1）“[地点] + mein + [数量] + [名词] + hai/hain”用来说明家里有什么、有多少；（2）以“-a”结尾的阳性名词，复数变为“-e”（kamra → kamre）；（3）以“-i”结尾的阴性名词，复数变为“-iyan”（kursi → kursiyan，khidki → khidkiyan）。
    note: 结尾总结，把整个单元的语法串联起来，与第15–17单元各自的归纳性语法说明相呼应。
  hi.a1.unit18.lesson03.teach.home_reading:
    title: 阅读：两个人的家
    gloss: 普丽娅的家很小。房子里有两个房间，一个厨房和一个卫生间。阿俊的家很大。房子里有三间卧室，还有一个大厨房。
    note: 一段简短直接的介绍，不加新的叙述背景，只复述对话中已经确立的事实，不添加新内容，正好对应本目标“读懂简短的住房描述”的要求。
    glosses:
      घर: 房子／家
      छोटा: 小的
      कमरे: 房间
      रसोई: 厨房
      बाथरूम: 浴室
      बड़ा: 大的
      बेडरूम: 卧室
      बड़ी: 大（阴性）
