teaching:
  hi.a1.unit29.lesson01.teach.kul_kitna_hua:
    title: 询问总价
    gloss: 一共多少钱?
    note: '*कुल* 的意思是“总共”，*कितना हुआ?*（“一共是多少？”）是询问总价的日常说法。'
  hi.a1.unit29.lesson01.teach.kul_pachchees_rupye:
    title: 说出总价
    gloss: 总共两百五十卢比。
    note: '*हुए* 与复数名词 *रुपये* 保持一致：*कुल दो सौ पचास रुपये हुए* 字面意思是“总共来到了两百五十卢比”。'
  hi.a1.unit29.lesson02.teach.kard_se_pement:
    title: 刷卡或用现金付款
    gloss: 刷卡支付,用现金支付
    note: 印地语说 *कार्ड से पेमेंट करना*（“用银行卡付款”）和 *नकद पेमेंट करना*（“付现金”）；*से* 表示付款的方式。
    example_gloss:
    - 我可以在这里刷卡吗?
    - 我付现金。
  hi.a1.unit29.lesson02.teach.kya_main_yahan:
    title: 询问是否可以刷卡
    gloss: 这里可以刷卡吗?
    note: '*यहाँ*（“这里”）表示地点，*सकता हूँ*（“可以”）放在主要部分之后；女性说 *सकती हूँ*。'
  hi.a1.unit29.lesson02.teach.ap_nakad_pement:
    title: 询问付款偏好
    gloss: 您想用现金还是刷卡?
    note: '*आप ... करेंगे* 是收银员使用的礼貌将来时问句，*आप* 搭配复数动词 *करेंगे*。'
  hi.a1.unit29.lesson03.teach.bil:
    title: 账单
    gloss: 账单
    note: '*बिल* 是阳性名词：*एक बिल*，*बिल का*。'
    example_gloss: 我们分摊账单好吗?
  hi.a1.unit29.lesson03.teach.bil_bant_len:
    title: 提议分摊账单
    gloss: 我们分摊账单好吗?
    note: '*बाँट लें?*（“我们分摊吧？”）不必说出 *हम* 就能提出共同的打算；*लें* 是 *लेना* 表示“咱们……吧”的形式。'
  hi.a1.unit29.lesson03.teach.kya_main_alag:
    title: 请求分开付款
    gloss: 我可以分开付款吗?
    note: '*अलग से* 的意思是“分开地”，放在 *पेमेंट कर सकता हूँ* 之前。'
  hi.a1.unit29.lesson04.teach.bakee_paise:
    title: 找零
    gloss: 找零
    note: '*बाकी पैसे*（“剩下的钱”）是复数，指找回的零钱。'
    example_gloss: 这是您的找零。
  hi.a1.unit29.lesson04.teach.ye_rahe_apke:
    title: 递上找零
    gloss: 这是您的找零。
    note: '*आपके* 是礼貌的“您的”（*आप* + *के*），与复数名词 *पैसे* 保持一致。'
  hi.a1.unit29.lesson04.teach.mujhe_bakee_paise:
    title: 谢绝找零
    gloss: 我不需要找零。
    note: '*मुझे ... नहीं चाहिए*（字面“对我来说……不需要”）是印地语表达“我不需要”的方式；*नहीं* 放在 *चाहिए* 之前。'
  hi.a1.unit29.lesson05.teach.paintees:
    title: 三百五十
    gloss: 三百五十
    note: '*तीन सौ पचास* 是 350：先说百位，再说十位。'
    example_gloss: 价格是三百五十卢比。
  hi.a1.unit29.lesson05.teach.bil_do_thalee:
    title: 阅读餐厅账单
    gloss: 账单：两份套餐盘和两杯茶。总计：三百五十卢比。付款方式：银行卡。
    note: 注意点了什么、总额是多少以及付款方式。
    glosses:
      बिल: 账单
      दो: 二
      थाली: 套餐盘
      चाय: 茶
      कुल: 总计
      तीन: 三
      सौ: 一百
      पचास: 五十
      रुपये: 卢比
      पेमेंट: 付款
      कार्ड: 银行卡
  hi.a1.unit29.lesson06.teach.priya_bil_mang:
    title: 普丽娅要账单
    gloss: 普丽娅：我们要账单吧？
    note: '*माँग लें?*（“我们要一下吧？”）再次用到 *लेना* 的“咱们……吧”形式，*माँगना* 的意思是“要、索取”。'
  hi.a1.unit29.lesson06.teach.arjun_han_achchha:
    title: 阿俊询问总价
    gloss: 阿俊：好，好主意。一共多少钱？
    note: '*कुल कितना हुआ?* 就是前面学过的问总价的句子，这次是在餐桌上使用。'
  hi.a1.unit29.lesson06.teach.priya_paintees_rupye:
    title: 普丽娅说出总价
    gloss: 普丽娅：一共三百五十卢比。我们分摊吧？
    note: '*तीन सौ पचास रुपये हुए* 说明总价，*बाँट लें?* 询问“我们分摊吧？”'
  hi.a1.unit29.lesson06.teach.arjun_naheen_aj:
    title: 阿俊坚持付款
    gloss: 阿俊：不，今天让我来付。你帮了我很多。
    note: '*मुझे पेमेंट करने दो* 的意思是“让我来付”；*तुमने मेरी बहुत मदद की है* 用了 *ने*，因为动词是过去时。'
  hi.a1.unit29.lesson06.teach.priya_tum_kitne:
    title: 普丽娅很感动
    gloss: 普丽娅：你真好！非常感谢。
    note: '*तुम कितने अच्छे हो!*（“你真好！”）是一句暖心的夸奖，*शुक्रिया* 的意思是“谢谢”。'
  hi.a1.unit29.lesson06.teach.arjun_kya_main:
    title: 阿俊询问能否刷卡
    gloss: 阿俊：我可以在这里刷卡付款吗？
    note: '*क्या मैं यहाँ कार्ड से पेमेंट कर सकता हूँ?* 这个问句再次出现，这次是在真实的餐厅里。'
  hi.a1.unit29.lesson06.teach.arjun_bil_deta:
    title: देता है：他付款
    gloss: 阿俊结账。
    note: '*देता है* 是 *देना*（“给”）的 *वह* 形式；印地语用“给账单”来表示“结账”。'
