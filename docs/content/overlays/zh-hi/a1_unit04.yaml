teaching:
  hi.a1.unit04.lesson01.teach.baje:
    title: 点钟
    gloss: 点钟(两点及以上)
    note: 可与除一以外的任何钟点数字连用——*一点钟*的特殊形式见本课稍后内容。
    example_gloss: 现在五点了。
  hi.a1.unit04.lesson01.teach.abhi:
    title: 现在
    gloss: 现在
    note: 一个简单的时间词,说现在几点时经常用到。
    example_gloss: 现在十点了。
  hi.a1.unit04.lesson01.teach.ek_do_teen:
    title: 一、二、三
    gloss: 一、二、三
    note: 第2单元已学过,这里用来报时——注意 *ek* 搭配特殊形式 *baja*,而 *do* 和 *teen* 搭配普通形式 *baje*。
    example_gloss:
    - 现在一点了。
    - 现在两点了。
    - 现在三点了。
  hi.a1.unit04.lesson01.teach.chaar_paanch_chhah:
    title: 四、五、六
    gloss: 四、五、六
    note: 第2单元已学过——这三个数都搭配普通形式 *baje*。
    example_gloss:
    - 现在四点了。
    - 现在五点了。
    - 现在六点了。
  hi.a1.unit04.lesson01.teach.saat_aath_nau:
    title: 七、八、九
    gloss: 七、八、九
    note: 第2单元已学过。
    example_gloss:
    - 现在七点了。
    - 现在八点了。
    - 现在九点了。
  hi.a1.unit04.lesson01.teach.das_gyaarah_baarah:
    title: 十、十一、十二
    gloss: 十、十一、十二
    note: 第2单元已学过——这是你需要的最后几个整点数字。
    example_gloss:
    - 现在十点了。
    - 现在十一点了。
    - 现在十二点了。
  hi.a1.unit04.lesson01.teach.baja_grammar_note:
    title: Baja 与 baje
    gloss: '*Baja* 与*一*连用，*baje* 与其他所有数字连用：*ek baja hai*，*do baje hain*。'
    note: 这是必须掌握的一致关系例外,并非简化——*ek baja hai* 是唯一使用单数形式的整点。
  hi.a1.unit04.lesson01.teach.kitne_baje_hain:
    title: 询问时间
    gloss: 几点了？
    note: 字面意思是“有几点钟”——这是询问时间的标准说法。
  hi.a1.unit04.lesson01.teach.abhi_paanch_baje_hain:
    title: 表达时间
    gloss: 现在五点了。
    note: 这是回答 *Kitne baje hain?* 的自然完整句。
  hi.a1.unit04.lesson02.teach.yoga_class_reprise:
    title: 瑜伽课
    gloss: 瑜伽课
    note: 第1课已学过——本课安排日程时用它作为例子。
    example_gloss: 瑜伽课在今天。
  hi.a1.unit04.lesson02.teach.subah:
    title: 早晨
    gloss: 早晨
    note: 本课要学的四个时段词之一。
    example_gloss: 瑜伽课在早上。
  hi.a1.unit04.lesson02.teach.dopahar:
    title: 中午/下午
    gloss: 中午,下午
    note: 既指正午,也指午后不久的时段。
    example_gloss: 下午没有课。
  hi.a1.unit04.lesson02.teach.shaam:
    title: 傍晚
    gloss: 晚上
    note: 指 *dopahar* 之后、*raat* 之前的一段时间。
    example_gloss: 下一节课在傍晚五点。
  hi.a1.unit04.lesson02.teach.raat:
    title: 夜晚
    gloss: 夜晚
    note: 四个时段词中的最后一个。
    example_gloss: 晚上没有课。
  hi.a1.unit04.lesson02.teach.ko_reprise:
    title: Ko 与泛指时段
    gloss: 没有给出具体钟点时,时段词后面要加 *ko*:*dopahar ko*(中午),*raat ko*(夜里)。
    note: 和第3单元中表示星期几的 *ko* 是同一个词,现在用来表示泛指的时段——这是自然的说法,但不是本单元唯一的构式(具体钟点的说法见下一条)。
  hi.a1.unit04.lesson02.teach.time_of_day_baje_note:
    title: 时段词直接放在 baje 前面
    gloss: 说具体钟点时,时段词直接放在 *baje* 前面,中间不加任何词:*subah saat baje*(早上七点),*shaam paanch baje*(傍晚五点)。
    note: 这里不用 *ko*——如上一条所说,ko 只用于没有具体钟点的泛指时段。
  hi.a1.unit04.lesson02.teach.class_kitne_baje_hai:
    title: 询问上课时间
    gloss: 课几点开始?
    note: 还是第1课的 *kitne baje* 句式,只是现在问的是某件事的时间,而不是现在几点。
  hi.a1.unit04.lesson02.teach.class_subah_saat_baje_hai:
    title: 说明某件事的时间
    gloss: 课在早上七点。
    note: 按上面的语法说明,把 *subah* 直接与 *saat baje* 连用。
  hi.a1.unit04.lesson03.teach.kal:
    title: 明天/昨天
    gloss: 明天,昨天
    note: 印地语用同一个词表示两者——要靠上下文(和动词时态)判断。本课中它总是指“明天”。
    example_gloss: 明天傍晚五点上课。
  hi.a1.unit04.lesson03.teach.agli_reprise:
    title: 下一个
    gloss: 下一个的
    note: 第3单元已学过——这是阴性形式,与阴性名词 *class* 保持一致。
    example_gloss: 下一节课在明天。
  hi.a1.unit04.lesson03.teach.theek_hai_shukriya_reprise:
    title: 好的,谢谢
    gloss: 好的,谢谢!
    note: 这两个词都沿用了第1单元告别用语中的词汇。
  hi.a1.unit04.lesson03.teach.milte_hain_reprise:
    title: 我们再见／回头见
    gloss: 回头见／我们再见
    note: 沿用第3单元结尾的告别语，这里与 *kal* 搭配，表示“明天见”。
  hi.a1.unit04.lesson03.teach.agli_class_kitne_baje_hai:
    title: 询问下一节课的时间
    gloss: 下一节课几点？
    note: 把 *agli*（阴性，与“课”一致）和本单元的 *kitne baje* 句型结合起来。
  hi.a1.unit04.lesson03.teach.agli_class_shaam_paanch_baje_hai:
    title: 说明下一节课的时间
    gloss: 下一节课在傍晚五点。
    note: 这是对上面那个问题的自然完整回答。
  hi.a1.unit04.lesson03.teach.kal_milte_hain:
    title: 以约定明天见面来结束对话
    gloss: 好的，明天见！
    note: 约定好时间后，用这句话来结束对话很自然。
  hi.a1.unit04.lesson03.teach.dialogue.line01:
    title: 阿尔琼询问下一节课的时间
    gloss: 阿尔琼问下一节课几点。
    note: 原样重复本课的这个问句。
  hi.a1.unit04.lesson03.teach.dialogue.line02:
    title: 普里亚告知时间
    gloss: 普里亚说下一节课在傍晚五点。
    note: 原样重复本课的这个回答句。
  hi.a1.unit04.lesson03.teach.dialogue.line03:
    title: 阿尔琼向她道谢
    gloss: 阿尔琼说好的，谢谢。
    note: 沿用第1单元的词汇。
  hi.a1.unit04.lesson03.teach.dialogue.line04:
    title: 普里亚结束对话
    gloss: 普里亚表示同意，并说明天见。
    note: 原样重复本课的结束语。
