teaching:
  hi.a1.unit11.lesson01.teach.review_chai_kaafi:
    title: 复习：茶、咖啡
    gloss: 茶，咖啡
    note: 快速复习第6单元的饮品词汇——本单元会用它们来提出计划。
    example_gloss:
    - 我要茶。
    - 我要咖啡。
  hi.a1.unit11.lesson01.teach.filma:
    title: 电影
    gloss: 电影
    note: 一个新名词，用于本单元“提议计划”的话题。
    example_gloss: 这部电影很好看。
  hi.a1.unit11.lesson01.teach.dekhna:
    title: 我们看／我们看吧
    gloss: （我们）看／我们看吧
    note: dekhna（看）的习惯性复数形式，这里用来提议一起做某事。
    example_gloss: 我们看电影。
  hi.a1.unit11.lesson01.teach.chalo_film_phrase:
    title: 我们看电影吧！
    gloss: 我们看电影吧！
    note: “Chalo”加习惯性复数动词，是提议一起做某事的日常说法——前面第1、6、7单元已经顺带出现过（“chalo shuru karte hain”“chalo, kuch khaate hain”“chalo, kuch khareedte hain”）；本单元将这一句型正式化并加以扩展。
  hi.a1.unit11.lesson01.teach.saath:
    title: 一起
    gloss: 一起
    note: 用于提议一起做某事。
    example_gloss: 我们一起看电影吧！
  hi.a1.unit11.lesson01.teach.peena:
    title: 我们喝／我们喝吧
    gloss: （我们）喝／我们喝吧
    note: peena（喝）的习惯性复数形式，与 “dekhte hain” 的构成相同。
    example_gloss: 我们喝茶。
  hi.a1.unit11.lesson01.teach.chalo_chai_phrase:
    title: 我们一起喝茶吧！
    gloss: 我们一起喝茶吧！
    note: 把本课的 “saath” 和 “peete hain” 结合起来，用与看电影提议相同的 “chalo” 句型提出第二个提议。
  hi.a1.unit11.lesson01.teach.chalo_grammar_note:
    title: Chalo + 动词-te + hain = 我们……吧
    gloss: 要提议一起做某事，就说 “chalo” + 动词-te + hain：我们看电影吧！我们一起喝茶吧！
    note: 明确给出整个句型，把前面几个单元中顺带出现过三次的说法正式总结出来。
  hi.a1.unit11.lesson01.teach.achha_vichar:
    title: 好主意！
    gloss: 好主意！
    note: 热情地接受提议时可以直接使用的说法。
  hi.a1.unit11.lesson02.teach.vyast:
    title: 忙的
    gloss: 忙的
    note: 一个新形容词，与已学过的系动词（hoon/ho/hai）连用，表示没有空。
    example_gloss: 我今天很忙。
  hi.a1.unit11.lesson02.teach.maaf_karna:
    title: 对不起／不好意思
    gloss: 对不起／不好意思
    note: 一个固定的礼貌用语，用来缓和拒绝的语气。
    example_gloss: 对不起，我很忙。
  hi.a1.unit11.lesson02.teach.maaf_vyast_phrase:
    title: 对不起，我很忙。
    gloss: 对不起，我很忙。
    note: 最基本的拒绝句子，结合了本课的两个新表达。
  hi.a1.unit11.lesson02.teach.mujhe_kaam_hai:
    title: 我有工作。
    gloss: 我有工作。
    note: 沿用前面学过的 “mujhe...chahiye”（我想要／需要）中的 “mujhe...hai”（我有……）句型，这里用来说明拒绝的理由。
  hi.a1.unit11.lesson02.teach.decline_grammar_note:
    title: 如何礼貌地拒绝
    gloss: 要礼貌地拒绝计划，先说 “maaf karna”（对不起），再说明自己的情况（如“我很忙”）或理由（如“我有工作”）。
    note: 这里有意沿用已学过的语法（系动词和表示拥有的与格句型），而不引入新的“能够”句型。
  hi.a1.unit11.lesson02.teach.hum_pronoun:
    title: 我们
    gloss: 我们
    note: 本课程中第一个正式出现的第一人称复数代词。它的习惯现在时动词形式（-te + hain）与已学的 ve（他们）相同——没有新的变位，只是多了一个新代词。（Tum 也用 -te，但搭配 “ho”：tum milte ho。）
    example_gloss: 我们每天见面。
  hi.a1.unit11.lesson02.teach.kab_milte_phrase:
    title: 我们什么时候见面？
    gloss: 我们什么时候见面？
    note: 把 “hum” 与 “kab”（第10单元）和 “milte hain”（从第1单元的告别语起就在用，当时主语通常省略）结合在一起。
  hi.a1.unit11.lesson02.teach.din_review:
    title: 复习：星期六、星期日
    gloss: 星期六、星期日
    note: 快速复习第3单元的两个星期名称，用于安排计划。
    example_gloss:
    - 今天是星期六。
    - 明天是星期天。
  hi.a1.unit11.lesson02.teach.samay_review:
    title: 复习：四点、几点
    gloss: 四点，几点
    note: 快速复习第4单元的时间用语，用于安排计划。
    example_gloss:
    - 现在四点。
    - 现在几点？
  hi.a1.unit11.lesson02.teach.kya_ravivar_thik_phrase:
    title: 星期日可以吗？
    gloss: 星期日可以吗？
    note: 再次使用 'kya' 作为是非疑问标记，从第1单元起就已出现（'kya yeh tumhari pahli baar hai?'、'kya tum yoga karti ho?'），而不是表示“哪一天”的新疑问词。
  hi.a1.unit11.lesson03.teach.sandesh:
    title: 消息
    gloss: 消息
    note: 一个新名词，用于本课的书面邀请部分。
    example_gloss: 这是阿俊的消息。
  hi.a1.unit11.lesson03.teach.dialogue.line01:
    title: 阿俊提议星期六看电影
    gloss: 普丽娅，我们星期六去看电影吧？
  hi.a1.unit11.lesson03.teach.dialogue.line02:
    title: 普丽娅说明理由，婉拒
    gloss: 抱歉，我星期六很忙。我有工作。
  hi.a1.unit11.lesson03.teach.dialogue.line03:
    title: 阿俊问什么时候见面
    gloss: 好吧。我们什么时候见面？
  hi.a1.unit11.lesson03.teach.dialogue.line04:
    title: 普丽娅改提星期日
    gloss: 星期日可以吗？我们一起喝茶吧！
  hi.a1.unit11.lesson03.teach.dialogue.line05:
    title: 阿俊同意并询问时间
    gloss: 好主意！星期日几点？
  hi.a1.unit11.lesson03.teach.dialogue.line06:
    title: 普丽娅建议一个时间
    gloss: 四点可以吗？
  hi.a1.unit11.lesson03.teach.dialogue.line07:
    title: 阿俊确认
    gloss: 好，四点可以。到时见！
  hi.a1.unit11.lesson03.teach.dialogue.line08:
    title: 普丽娅结束对话
    gloss: 好，星期日见！
  hi.a1.unit11.lesson03.teach.invitation_message:
    title: 普丽娅的消息
    gloss: 你好，阿俊，我们星期日四点见面喝茶吧。可以吗？——普丽娅
    note: 一条简短的书面邀请，重述刚才对话中确定的计划。
    glosses:
      चलो: 咱们……吧
      रविवार: 星期日
      मिलते: 见面（来自 मिलना）
      चाय: 茶
      पीते: 喝（来自 पीना）
      ठीक: 好的／可以
