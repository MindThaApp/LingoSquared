teaching:
  hi.a1.unit09.lesson01.teach.review_places:
    title: 复习：地点
    gloss: 银行、学校、医院、公园、车站、邮局
    note: 快速复习上一单元的地点词——本单元会大量用到它们。
    example_gloss:
    - 银行在这里。
    - 邮局在银行附近。
  hi.a1.unit09.lesson01.teach.review_function_words:
    title: 复习：是、哪里、这里、那里、从、的、好
    gloss: 是、哪里、这里、那里、从、的、好的
    note: 快速复习前面单元学过的几个功能小词，本单元的练习会再次用到。
    example_gloss:
    - 银行在哪里？
    - 公园在那里。
  hi.a1.unit09.lesson01.teach.seedhe_baaen_daaen:
    title: 直走、左、右
    gloss: 直走、左、右
    note: 本单元最核心的三个方向词。
    example_gloss:
    - 一直往前走。
    - 向左转。
  hi.a1.unit09.lesson01.teach.jao_muro:
    title: 走！转弯！
    gloss: 走！转弯！（对熟人的随意命令式）
    note: tum 形式的命令式——是朋友之间指路时自然的说法。
    example_gloss:
    - 一直往前走。
    - 向右转。
  hi.a1.unit09.lesson01.teach.yahan_se_seedhe_jao:
    title: 从这里直走
    gloss: 从这里一直往前走。
    note: 把本课的新词与 “yahaan se”（从这里）结合在一起。
  hi.a1.unit09.lesson01.teach.baaen_muro_phrase:
    title: 向左拐
    gloss: 向左转。
    note: 可以单独使用的一句命令，拿来就能用。
  hi.a1.unit09.lesson01.teach.daaen_muro_phrase:
    title: 向右拐
    gloss: 向右转。
    note: 与 “baaen muro” 相对的一句命令。
  hi.a1.unit09.lesson01.teach.imperative_note:
    title: 命令式的 -o 词尾
    gloss: “Jaao” 和 “muro” 是 tum 形式的命令式，和 “bataao”、“gino” 一样——它们都以 “-o” 结尾。
    note: 指出这种共同的随意命令式规律，它也出现在前面已学过的两个词中（第 7 单元的 bataao 和第 2 单元的 gino）。
  hi.a1.unit09.lesson02.teach.bank_kaise_jaun:
    title: 去银行怎么走？
    gloss: 去银行怎么走？
    note: 问路的核心句型，使用第一人称“我该去”的形式。
  hi.a1.unit09.lesson02.teach.tak:
    title: 直到／到……为止
    gloss: 直到／到……为止
    note: 第 2 单元数数时已出现过（“zero se das tak”）；这里用的是它同样常见的空间意义。
    example_gloss: 一直走到银行。
  hi.a1.unit09.lesson02.teach.bank_tak_seedhe_jao:
    title: 一直走到银行
    gloss: 一直走到银行。
    note: 用 “tak” 表示空间范围的例句。
  hi.a1.unit09.lesson02.teach.pahle_phir:
    title: 首先、然后
    gloss: 首先、然后
    note: 一对用来排列两个指路步骤先后顺序的词。
    example_gloss:
    - 先一直往前走。
    - 然后向左转。
  hi.a1.unit09.lesson02.teach.pahle_seedhe_phir_baaen:
    title: 先直走，再左转
    gloss: 先一直往前走，然后向左转。
    note: 把 “pahle” 和 “phir” 合成一句分两步的指示。
  hi.a1.unit09.lesson02.teach.pahle_phir_note:
    title: Pahle 和 phir
    gloss: “Pahle” 和 “phir” 连接两个步骤——第一个动作配 “pahle”，第二个动作配 “phir”，例如 “pahle seedhe jaao, phir baaen muro.”（先直走，再左转。）
    note: 一个实用的语法点：如何按顺序说出多步指路。
  hi.a1.unit09.lesson03.teach.nukkad:
    title: 街角
    gloss: 街角
    note: 本课结尾对话中用到的新地点词，与 “par”（在……上／在）搭配使用。
    example_gloss:
    - 银行在拐角处。
    - 公园在学校后面。
  hi.a1.unit09.lesson03.teach.bas:
    title: 就 / 只
    gloss: 就／仅仅
    note: 也是“公共汽车”（巴士）一词常用的外来词，但本课程不教这个意思，所以这里不会混淆。
    example_gloss: 再往前走一点就到了。
  hi.a1.unit09.lesson03.teach.samajh_gaya:
    title: 明白了 / 懂了
    gloss: 明白了 / 懂了
    note: 常用的两词表达：'samajh'（动词 'samajhna'“理解”的词干）加 'gaya'（去了），表示动作已经完成。这是男性说法——Priya 会说 'samajh gayi'。
    example_gloss: 我明白了。/ 懂了。
  hi.a1.unit09.lesson03.teach.accha_bahut_shukriya:
    title: 好的！非常感谢！
    gloss: 好的！非常感谢！
    note: 重复使用前面单元学过的 'accha'、'bahut' 和 'shukriya'。
  hi.a1.unit09.lesson03.teach.koi_baat_nahin_phir_milenge:
    title: 没关系！回头见。
    gloss: 没关系！回头见。
    note: 本课程固定的结束用语，与第 8 单元完全相同。
  hi.a1.unit09.lesson03.teach.dialogue.line01:
    title: Arjun 问邮局怎么走
    gloss: Arjun 问 Priya 邮局怎么走。
    note: 重复使用本单元第 2 课的开头问句句型。
  hi.a1.unit09.lesson03.teach.dialogue.line02:
    title: Priya 开始指路
    gloss: Priya 说：从这里先一直往前走。
    note: 重复使用本单元前面出现的 'yahaan se' 和 'pahle'。
  hi.a1.unit09.lesson03.teach.dialogue.line03:
    title: Arjun 问接下来怎么走
    gloss: Arjun 说好的，并问接下来怎么走。
  hi.a1.unit09.lesson03.teach.dialogue.line04:
    title: Priya 接着说
    gloss: Priya 说：然后在银行的拐角处向左转。
    note: 在语境中引入 'nukkad'（街角）。
  hi.a1.unit09.lesson03.teach.dialogue.line05:
    title: Arjun 确认后再问
    gloss: Arjun 重复“左”，表示明白了，并问接下来怎么走。
  hi.a1.unit09.lesson03.teach.dialogue.line06:
    title: Priya 说完第一条路线
    gloss: Priya 说：再往前走一点就到了——邮局在那边，银行附近。
    note: 引入 'bas'（就/只），并与第 8 单元已确立的事实一致：邮局在银行附近。
  hi.a1.unit09.lesson03.teach.dialogue.line07:
    title: Arjun 表示明白，并问去公园怎么走
    gloss: Arjun 说他明白了，并问去公园怎么走。
    note: 引入习语 'samajh gaya'。
  hi.a1.unit09.lesson03.teach.dialogue.line08:
    title: Priya 给出第二条路线
    gloss: Priya 说：公园吗？先一直往前走，然后向右转——公园在学校后面。
    note: 与第 8 单元已确立的事实一致：公园在学校后面。
  hi.a1.unit09.lesson03.teach.dialogue.line09:
    title: Arjun 感谢 Priya
    gloss: Arjun 说他明白了，并非常感谢 Priya。
  hi.a1.unit09.lesson03.teach.dialogue.line10:
    title: Priya 结束对话
    gloss: Priya 说没关系，回头见。
    note: 与第 8 单元对话的结束语完全相同。
