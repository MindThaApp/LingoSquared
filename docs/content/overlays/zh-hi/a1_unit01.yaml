answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (हूँ, हाँ, कहाँ vs. मैं, हैं, में, मिलेंगे). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (हूं for हूँ, हां for हाँ) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: 印地语 A1
  description: 学习用印地语问候他人、询问对方近况、自我介绍并交换基本个人信息。课程特别讲解 aap/tum 敬称体系（印地语语法中真实存在的区别，汉语只靠“您/你”体现）以及印地语中随性别变化的形容词和动词形式（汉语没有这类变化）。
units:
  hi.a1.unit01.greetings:
    title: Namaste 与初次见面
lessons:
  hi.a1.unit01.lesson01.aap_and_tum:
    title: Aap 和 tum：询问近况
  hi.a1.unit01.lesson02.greetings_and_farewells:
    title: 问候与告别
  hi.a1.unit01.lesson03.names_origin_and_dialogue:
    title: 姓名、来历，以及瑜伽课上的初次见面
teaching:
  hi.a1.unit01.lesson01.teach.aap:
    title: 尊称“您”
    gloss: 您（尊称）
    note: 汉语有“你”和“您”之分，印地语也有类似的选择：*aap* 用于年长者、不熟悉的人，或需要保持职业性尊重的关系。它在语法上按复数处理，即使指的只是一个人——与 *aap* 搭配的动词采用和“他们”相同的 -en/hain 类词尾。
  hi.a1.unit01.lesson01.teach.tum:
    title: 非正式的“你”
    gloss: 你（非正式、熟悉）
    note: '*Tum* 用于朋友、同辈、晚辈或家人——关系随意但依然有礼貌（它不同于更亲昵的 *tu*，本课程不教 *tu*）。*Tum* 有自己专属的动词词尾，既不同于 *aap*，也不同于 tu。'
  hi.a1.unit01.lesson01.teach.aap_kaise_hain:
    title: 对男士的正式问候近况
    gloss: 您好吗？（尊称，问男士）
    note: '*Kaise* 与被询问者的性别一致，而不是与说话人一致——问男士时用这个形式。汉语的“你好吗”不会因对方性别而变化，印地语则会。'
  hi.a1.unit01.lesson01.teach.aap_kaisi_hain:
    title: 对女士的正式问候近况
    gloss: 您好吗？（尊称，问女士）
    note: 同样的问题，同样使用 *aap* 的敬称——只是 *kaise* 变成了 *kaisi*，与女性对象一致。动词 *hain* 本身不变，变化的只是形容词形式。
  hi.a1.unit01.lesson01.teach.tum_kaise_ho:
    title: 非正式的问候语：近况
    gloss: 你好吗？（非正式）
    note: 与 *tum* 搭配时，动词是 *ho*，而不是 *hain*——对比敬称的 *Aap kaise/kaisi hain?* 和非正式的 *Tum kaise ho?*。这是从动词本身听出 aap 与 tum 区别的最佳对照。
  hi.a1.unit01.lesson01.teach.main_theek_hoon:
    title: 标准回答
    gloss: 我很好，谢谢。
    note: '*Theek*（“好／还行”）不随性别或敬称变化——不像 *kaise/kaisi*，无论谁在说、对谁说，它都保持不变。'
  hi.a1.unit01.lesson01.teach.aur_aap:
    title: 把正式的问题回问对方
    gloss: 您呢？
    note: 在 aap 敬称下把问题回问对方的简短说法。
  hi.a1.unit01.lesson01.teach.aur_tum:
    title: 把非正式的问题回问对方
    gloss: 你呢？
    note: 用 tum 把问题回问朋友或同辈。
  hi.a1.unit01.lesson02.teach.namaste:
    title: 通用的问候语
    gloss: 你好；嗨（也用于道别）
    note: '*Namaste* 一天中任何时间都能用，正式、非正式场合均可，开场和结束都能说——真正的万能用语，不像汉语要把“你好”和“再见”分成不同的词。'
    example_gloss: 你好！你好吗？
  hi.a1.unit01.lesson02.teach.namaskar:
    title: 尊敬的问候
    gloss: 您好（比 namaste 更正式、更尊敬）
    note: '*Namaskar* 与 *namaste* 意思基本相同，但语气更正式、更恭敬——适用于长辈、大型听众或职业场合。'
    example_gloss: 您好！那您呢？
  hi.a1.unit01.lesson02.teach.phir_milenge:
    title: 再见（将来时）
    gloss: 回头见；以后见
    note: 字面意思是“[我们]将再见面”——预计还会再见到对方时，一种标准、中性的道别说法。
  hi.a1.unit01.lesson02.teach.alvida:
    title: 正式的告别
    gloss: 再见；告别
    note: '*Alvida* 是正确、地道的印地语“再见”，但日常使用中比 *namaste* 或 *phir milenge* 更显决绝、正式，甚至略带戏剧色彩——更接近“珍重告别”，而不是随意的“拜拜”。'
    example_gloss: 再见！回头见。
  hi.a1.unit01.lesson02.teach.phir_milte_hain:
    title: 回头见（随意／习惯性）
    gloss: 回头见；回见
    note: 字面意思是“[我们]再见面”，用的是进行／习惯式动词形式而非将来时——比 *phir milenge* 更随意的日常说法。
  hi.a1.unit01.lesson02.teach.shubh_ratri:
    title: 晚安
    gloss: 晚安
    note: 别人要离开过夜或去睡觉时说——和汉语的“晚安”一样，这是道别语，绝不用作开场问候，这一点不同于 *namaste*。
  hi.a1.unit01.lesson02.teach.shubh_din:
    title: 礼貌的祝福语
    gloss: 祝你今天愉快。
    note: 字面意思是“愿你的一天保持美好”——与人礼貌道别时的祝愿语，无论关系正式还是随意都适用。
  hi.a1.unit01.lesson03.teach.aapka_naam_kya_hai:
    title: 正式地询问姓名
    gloss: 您叫什么名字？
    note: '*Aapka*（“您的”）与阳性名词 *naam*（“名字”）保持一致——印地语的所有格要与所属的事物一致，而不是与所有者一致，汉语的“的”没有这种变化。'
  hi.a1.unit01.lesson03.teach.tumhara_naam_kya_hai:
    title: 非正式地询问姓名
    gloss: 你叫什么名字？
    note: 句型相同，只是用 *tumhara*（“你的”，非正式）代替 *aapka*。对比正式的 *Aapka naam kya hai?* 与非正式的 *Tumhara naam kya hai?*。
  hi.a1.unit01.lesson03.teach.mera_naam_priya_hai:
    title: 说出你的名字
    gloss: 我叫普里娅。
    note: '*Mera*（“我的”）同样因 *naam* 是阳性而取阳性词尾——注意它与上面的 *aapka*／*tumhara* 词尾一致，因为这三个词修饰的是同一个名词。'
  hi.a1.unit01.lesson03.teach.aapse_milkar_khushi_hui:
    title: 正式地表达见面的喜悦
    gloss: 很高兴认识您。（正式）
    note: 字面意思是“见到您，喜悦发生了”——初次见面时表示尊重的固定常用表达。
  hi.a1.unit01.lesson03.teach.mujhe_bhi:
    title: 回应同样的心情
    gloss: 我也是。
    note: 对 Aapse milkar khushi hui 或 Tumse milkar accha laga 的简短自然回答。
  hi.a1.unit01.lesson03.teach.aap_kahan_se_hain:
    title: 正式地询问来自哪里
    gloss: 您来自哪里？
    note: Kahan 意为“哪里”；se 意为“从”。
  hi.a1.unit01.lesson03.teach.main_bharat_se_hoon:
    title: 说明你来自哪里
    gloss: 我来自印度。
    note: Bharat 是印度的印地语名称，日常交谈中经常使用。
  hi.a1.unit01.lesson03.teach.tum_kahan_se_ho:
    title: 非正式地询问来自哪里
    gloss: 你来自哪里？
    note: 同样的问题，用 *tum* 和 *ho* 代替 *aap* 和 *hain*——与本单元中一贯的正式／非正式动词词尾规律相同。
  hi.a1.unit01.lesson03.teach.dialogue.line01:
    title: 开启对话
    gloss: 普里娅向阿尔琼问好，并问他是不是第一次来这里。
    note: 两位说话人从一开始就使用非正式的 *tum*——对于在社区课上随意相识的同辈来说很自然。*Tumhari*（“你的”）与阴性名词 *baar*（“次”）一致，而不是与任何一位说话人的性别一致。
  hi.a1.unit01.lesson03.teach.dialogue.line02:
    title: 开启对话，回答
    gloss: 阿尔琼说是的，这是他第一次来，他想学瑜伽。
    note: '*Chahta hoon*（“我想要”）在这里用阳性形式，因为说话人阿尔琼是男性——这个动词与说话人的性别一致，不同于前面的 *kaisi*/*kaise*，后者与被询问的对象一致。'
  hi.a1.unit01.lesson03.teach.dialogue.line03:
    title: 互相介绍姓名
    gloss: 普里娅说“我也是！”，报上自己的名字，并问阿尔琼叫什么。
    note: '*Main bhi!*（“我也是！”）回应阿尔琼的 *main ... chahta hoon*：对方的句子以 *main* 为主语时，“我也是”说 *main bhi*。*Mujhe bhi* 则用来回应 *mujhe* 类句子，例如 *Tumse milkar accha laga*。*Mera naam...hai* 是介绍姓名自然又简单的说法。'
  hi.a1.unit01.lesson03.teach.dialogue.line04:
    title: 互相介绍姓名，回答
    gloss: 阿尔琼报上名字，并以非正式的方式说很高兴认识她。
    note: '*Tumse milkar accha laga* 是本课正式说法 *Aapse milkar khushi hui* 的非正式对应——两者都大致表示“很高兴认识你”，只是与敬称层级相配。'
  hi.a1.unit01.lesson03.teach.dialogue.line05:
    title: 询问来自哪里
    gloss: 普里娅表达同样的心情，并问阿尔琼来自哪里。
    note: Tum kahan se ho 用已学过的非正式敬称询问来自哪里。
  hi.a1.unit01.lesson03.teach.dialogue.line06:
    title: 询问来自哪里，回答
    gloss: 阿尔琼来自印度，但目前住在伦敦，然后反问同样的问题。
    note: '*Rahta hoon*（“我住”）是阳性，与说话人阿尔琼一致——与第二句中的 *chahta hoon* 是同一种主语一致规律。*Lekin*（“但是”）连接了来历与现居地之间的对比。'
  hi.a1.unit01.lesson03.teach.dialogue.line07:
    title: 谈论来历和兴趣
    gloss: 普里娅说她来自美国，也想学瑜伽。
    note: '*Chahti hoon* 是阿尔琼在第二句中所用动词（*chahta hoon*）的阴性形式——两者都与各自说话人的性别一致，正好形成直接对照。'
  hi.a1.unit01.lesson03.teach.dialogue.line08:
    title: 询问共同的活动
    gloss: 阿尔琼表示惊喜，并问普里娅是否练瑜伽。
    note: '*Karti ho*（“你做”）是阴性，与被询问的普里娅一致——和前面的 *kaisi* 一样，这个动词形式跟随的是对方（被询问者）的性别，而不是说话人。'
  hi.a1.unit01.lesson03.teach.dialogue.line09:
    title: 询问共同的活动并回答
    gloss: 普里娅说不，这是她第一次，她还在学习。
    note: '*Seekh rahi hoon*（“我正在学”）用阴性进行式，与说话人普里娅一致——是 *chahti hoon* 的进行时对应形式。'
  hi.a1.unit01.lesson03.teach.dialogue.line10:
    title: 结束对话
    gloss: 阿尔琼同意开始，然后说回头见。
    note: '*Chalo shuru karte hain*（“我们开始吧”）是提议一起开始某事的固定自然说法。*Phir milte hain* 用第2课学过的随意道别语结束对话。'
exercises:
  hi.a1.unit01.lesson01.exercise01.select_aap:
    instruction: 哪个词是表示“您”的正式、尊敬说法？
    correct_option: आप
    distractors:
    - तुम
    - और
    accepted_answers:
    - आप
    feedback: Aap 用于年长者、不熟悉的人，或需要表示尊重的关系。
  hi.a1.unit01.lesson01.exercise02.select_tum:
    instruction: 哪个词用来非正式地称呼一位朋友或同辈？
    correct_option: तुम
    distractors:
    - आप
    - और
    accepted_answers:
    - तुम
    feedback: Tum 用于朋友、同辈，以及其他随意但有礼貌的关系。
  hi.a1.unit01.lesson01.exercise03.select_aap_kaisi_hain_meaning:
    instruction: 这个问句问的是什么？是问谁的？
    correct_option: 您好吗？（尊称，问女士）
    distractors:
    - 您好吗？（尊称，问男士）
    - 那你呢？
    accepted_answers:
    - 您好吗？（尊称，问女士）
    feedback: Kaisi 与女性对象一致；问男士则用 kaise。
  hi.a1.unit01.lesson01.exercise04.order_aap_kaise_hain:
    instruction: 请把（对男士的）正式问候近况的句子排好顺序。
    correct_response:
    - आप
    - कैसे
    - हैं
  hi.a1.unit01.lesson01.exercise05.order_tum_kaise_ho:
    instruction: 请把非正式的问候近况的句子排好顺序。
    correct_response:
    - तुम
    - कैसे
    - हो
  hi.a1.unit01.lesson01.exercise06.return_formal:
    instruction: 请回问对方，并保持尊敬的语体。
    correct_option: और आप?
    distractors:
    - और तुम?
    - तुम कैसे हो?
    accepted_answers:
    - और आप?
    - और आप
    feedback: Aur aap? 回问对方时保持正式的敬称。
  hi.a1.unit01.lesson01.exercise07.return_informal:
    instruction: 请向朋友或同辈回问这个问题。
    correct_option: और तुम?
    distractors:
    - और आप?
    - आप कैसे हैं?
    accepted_answers:
    - और तुम?
    - और तुम
    feedback: Aur tum? 是非正式的回问方式。
  hi.a1.unit01.lesson01.exercise08.correct_informal_agreement:
    instruction: 请改正这个非正式问句——它把 tum 与错误的动词词尾搭配在一起了。
    accepted_answers:
    - तुम कैसे हो?
    - तुम कैसे हो
    feedback: Tum 搭配词尾 ho，而不是 hain——hain 只与 aap 搭配。
  hi.a1.unit01.lesson01.exercise09.reply_formally:
    instruction: 礼貌地回答：说你很好，并向对方道谢。
    accepted_answers:
    - मैं ठीक हूँ, शुक्रिया।
    - मैं ठीक हूँ, शुक्रिया
    - मैं ठीक हूं, शुक्रिया।
    - मैं ठीक हूँ, शुक्रिया। और आप?
    - मैं ठीक हूँ, शुक्रिया, और आप?
    - मैं ठीक हूं, शुक्रिया। और आप?
    - मैं ठीक हूं, शुक्रिया, और आप?
  hi.a1.unit01.lesson01.exercise10.speak_informally:
    instruction: 用非正式的方式回答，向对方道谢，并反问对方。
    accepted_answers:
    - मैं ठीक हूँ, शुक्रिया। और तुम?
    - मैं ठीक हूँ, शुक्रिया, और तुम?
    - मैं ठीक हूँ, शुक्रिया। और तुम
    - मैं ठीक हूं, शुक्रिया। और तुम?
    - मैं ठीक हूं, शुक्रिया, और तुम?
  hi.a1.unit01.lesson02.exercise01.select_namaste:
    instruction: 哪个词既可以表示“你好”，也可以表示“再见”？
    correct_option: नमस्ते
    distractors:
    - अलविदा
    - शुभ रात्रि
    accepted_answers:
    - नमस्ते
  hi.a1.unit01.lesson02.exercise02.select_alvida:
    instruction: 哪个词表示正式、带有诀别意味的“再见”？
    correct_option: अलविदा
    distractors:
    - नमस्ते
    - फिर मिलेंगे
    accepted_answers:
    - अलविदा
  hi.a1.unit01.lesson02.exercise03.select_shubh_ratri_meaning:
    instruction: 这个短语是什么意思？
    correct_option: 晚安。
    distractors:
    - 早上好。
    - 回头见。
    accepted_answers:
    - 晚安。
    feedback: Shubh raatri 是别人要离开过夜时说的道别语，不是问候语。
  hi.a1.unit01.lesson02.exercise04.order_phir_milenge:
    instruction: 请把“回头再见”这句道别语排成正确的顺序。
    correct_response:
    - फिर
    - मिलेंगे
  hi.a1.unit01.lesson02.exercise05.order_shubh_ratri:
    instruction: 请把“晚安”这句道别语排成正确的顺序。
    correct_response:
    - शुभ
    - रात्रि
  hi.a1.unit01.lesson02.exercise06.order_phir_milte_hain:
    instruction: 请把随意的“回头见”这句道别语排成正确的顺序。
    correct_response:
    - फिर
    - मिलते
    - हैं
  hi.a1.unit01.lesson02.exercise07.order_shubh_din:
    instruction: 组成这句礼貌的祝福语。
    correct_response:
    - आपका
    - दिन
    - अच्छा
    - रहे
  hi.a1.unit01.lesson02.exercise08.reply_to_namaskar:
    instruction: 回以同样的问候，然后用简短的正式说法“那您呢？”把问题回问对方。
    accepted_answers:
    - नमस्कार! और आप?
    - नमस्कार, और आप?
    - नमस्कार! और आप
  hi.a1.unit01.lesson02.exercise09.reply_with_goodbye:
    instruction: 先说正式、带有诀别意味的“再见”，再加上“回头再见”（字面意思是“我们将再见面”）。
    accepted_answers:
    - अलविदा! फिर मिलेंगे।
    - अलविदा, फिर मिलेंगे।
    - अलविदा। फिर मिलेंगे।
  hi.a1.unit01.lesson02.exercise10.speak_friendly_closing:
    instruction: 请说一句随意的“回头见”。
