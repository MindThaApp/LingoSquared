answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (पाँच vs. मैं, हैं, में). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (पांच for पाँच) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: 印地语 A1
units:
  hi.a1.unit02.numbers:
    title: 数字
lessons:
  hi.a1.unit02.lesson01.numbers_zero_to_ten:
    title: 数字零到十
  hi.a1.unit02.lesson02.numbers_and_prices:
    title: 十一到一百的数字与价格
  hi.a1.unit02.lesson03.phone_and_age:
    title: 电话号码与年龄
teaching:
  hi.a1.unit02.lesson01.teach.shoonya:
    title: 零
    gloss: 零
    note: 本单元所有数字的起点。
    example_gloss: 今天的气温是零度。
  hi.a1.unit02.lesson01.teach.ek:
    title: 一
    gloss: 一
    note: 印地语11到99的数字各自是独立的词，不像中文那样按“十＋一”的规律构成——你会在第2课看到，बीस（20）和 तीस（30）与 एक（1）、दो（2）没有任何明显相同的部分。
    example_gloss: 我有一本书。
  hi.a1.unit02.lesson01.teach.do:
    title: 二
    gloss: 二
    note: 这是一个简单又高频的数字，同时也是“给”的非正式命令式，不过根据语境总能分清意思。
    example_gloss: 我有两个兄弟。
  hi.a1.unit02.lesson01.teach.teen:
    title: 三
    gloss: 三
    note: '*Chahiye*（“需要”）是常见的无人称结构：*mujhe teen seb chahiye* 字面意思是“对我，三个苹果［是］需要的”，用来表达“我需要”非常自然。'
    example_gloss: 我需要三个苹果。
  hi.a1.unit02.lesson01.teach.chaar:
    title: 四
    gloss: 四
    note: 这里没有不规则变化——chaar 和其他小数字的用法一样。
    example_gloss: 我有四个朋友。
  hi.a1.unit02.lesson01.teach.paanch:
    title: 五
    gloss: 五
    note: 写作带月牙点的 पाँच，而不是用点号：长音符号 ा 不会高出字母上方，因此要用月牙点而不是普通的点，这和第1单元的 हाँ/कहाँ 是同一规律。
    example_gloss: 我有五卢比。
  hi.a1.unit02.lesson01.teach.chhah:
    title: 六
    gloss: 六
    note: 在较早的文本中有时也写作 छः；छह 是现代的标准拼写。
    example_gloss: 我有六本书。
  hi.a1.unit02.lesson01.teach.saat:
    title: 七
    gloss: 七
    note: 谈论一周七天时很有用的数字。
    example_gloss: 一周有七天。
  hi.a1.unit02.lesson01.teach.aath:
    title: 八
    gloss: 八
    note: 这里没有不规则变化——aath 和其他小数字的用法一样。
    example_gloss: 这个房间里有八把椅子。
  hi.a1.unit02.lesson01.teach.nau:
    title: 九
    gloss: 九
    note: 这里不需要鼻化符号，和它前后的一些数字不同。
    example_gloss: 瑜伽课早上九点开始。
  hi.a1.unit02.lesson01.teach.das:
    title: 十
    gloss: 十
    note: 这是第一组数字的最后一个——第2课会继续学习十几和整十的数字，从这里开始就无法再靠规律推测了。
    example_gloss: 我的双手有十根手指。
  hi.a1.unit02.lesson02.teach.gyaarah:
    title: 十一
    gloss: 十一
    note: 从这里开始，印地语的数字都是各自独立的不规则词——gyaarah 里看不出 das（10）或 ek（1）的影子，不像中文的“十一”那样由“十”和“一”组成。没有捷径，只能逐个记忆。
    example_gloss: 这个班有十一名学生。
  hi.a1.unit02.lesson02.teach.baarah:
    title: 十二
    gloss: 十二
    note: 又是一个要直接死记的数字——它和 do（2）之间没有任何可预测的规律。
    example_gloss: 一年有十二个月。
  hi.a1.unit02.lesson02.teach.pandrah:
    title: 十五
    gloss: 十五
    note: 谈论短时间时很常用，比如十五分钟的休息。
    example_gloss: 我需要十五分钟。
  hi.a1.unit02.lesson02.teach.bees:
    title: 二十
    gloss: 二十
    note: 这是一个全新的词，并不是 das（10）和 do（2）的组合——此后每个整十数都是这样。
    example_gloss: 我姐姐（妹妹）二十岁。
  hi.a1.unit02.lesson02.teach.tees:
    title: 三十
    gloss: 三十
    note: 又是一个独立的词——它看起来有点像 teen（3），但不能由 teen 加 das 构成，所以要当作单独的词来记。
    example_gloss: 票价是三十卢比。
  hi.a1.unit02.lesson02.teach.pachaas:
    title: 五十
    gloss: 五十
    note: 非常常用的整数，尤其用于价格。
    example_gloss: 我有五十卢比。
  hi.a1.unit02.lesson02.teach.sau:
    title: 一百
    gloss: 一百；百
    note: 简洁的整数，在日常价格中极为常见。
    example_gloss: 这本书一百卢比。
  hi.a1.unit02.lesson02.teach.keemat:
    title: 价格
    gloss: 价格；价钱
    note: '*Keemat* 是阴性名词，所以它的物主形式总是用阴性（*iski keemat*，“它的价格”），与所标价的物品无关。'
    example_gloss: 这张票多少钱？
  hi.a1.unit02.lesson02.teach.rupaye:
    title: 卢比
    gloss: 卢比
    note: '*Rupaya* 是单数形式（只用于恰好一卢比）；*rupaye* 用于更大的金额。'
    example_gloss: 这个五十卢比。
  hi.a1.unit02.lesson02.teach.iski_keemat_kya_hai:
    title: 询问价格
    gloss: 它的价格是多少？
    note: '*Iski*（“它的”）与阴性名词 *keemat*（“价格”）保持一致，而不是与实际被标价的物品一致——这和第1单元在 *mera naam* 中学过的物主一致规律相同。'
  hi.a1.unit02.lesson02.teach.iski_keemat_pachaas_rupaye_hai:
    title: 说出价格
    gloss: 它的价格是五十卢比。
    note: 这是对 Iski keemat kya hai? 的自然完整回答。
  hi.a1.unit02.lesson03.teach.aapka_phone_number_kya_hai:
    title: 正式地询问电话号码
    gloss: 你的电话号码是多少？（正式）
    note: '*Number*（नंबर）是借自英语的词，在日常印地语中经常使用。*Aapka* 与阳性名词 *number* 保持一致。'
  hi.a1.unit02.lesson03.teach.tumhara_phone_number_kya_hai:
    title: 非正式地询问电话号码
    gloss: 你的电话号码是多少？（非正式）
    note: 和朋友或同辈说话时，用 tumhara 代替 aapka，规律与第1单元相同。
  hi.a1.unit02.lesson03.teach.mera_number:
    title: 报号码的开场白
    gloss: 我的号码是……
    note: 在逐位念出数字之前，这是一个自然的开场方式。
  hi.a1.unit02.lesson03.teach.sample_number:
    title: 电话号码示例
    gloss: 六、二、八、三、五。
    note: 印地语的电话号码也是逐位读出，和中文一样——这里的每个数字在第1课都已学过。
  hi.a1.unit02.lesson03.teach.aapki_umra_kya_hai:
    title: 正式地询问年龄
    gloss: 您多大年纪？（正式）
    note: '*Umra*（“年龄”）是阴性名词，所以这里的 *aapki* 用阴性形式——与 *iski keemat* 的一致规律相同，只是这次用在人的年龄上，而不是价格上。'
  hi.a1.unit02.lesson03.teach.tumhari_umra_kya_hai:
    title: 非正式地询问年龄
    gloss: 你多大了？（非正式）
    note: 和朋友或同辈说话时，用 tumhari 代替 aapki。
  hi.a1.unit02.lesson03.teach.meri_umra_tees_saal_hai:
    title: 说出你的年龄
    gloss: 我三十岁。
    note: '*Meri* 与 *umra*（阴性）保持一致，而不是与说话人自己的性别一致——不同于第1单元学过的 *chahta/chahti* 动词形式，这个物主词无论谁说都不会变化。'
  hi.a1.unit02.lesson03.teach.dialogue.line01:
    title: Arjun 向 Priya 要电话号码
    gloss: Arjun 用非正式的方式向 Priya 询问她的电话号码。
    note: 完全沿用本课的非正式电话号码问句。
  hi.a1.unit02.lesson03.teach.dialogue.line02:
    title: Priya 说出自己的号码并反问
    gloss: Priya 逐位念出自己的电话号码，然后询问 Arjun 的号码。
    note: 这里的每个数字在本单元第1课都已学过。
  hi.a1.unit02.lesson03.teach.dialogue.line03:
    title: Arjun 说出自己的号码
    gloss: Arjun 念出自己的电话号码。
    note: 同样，每个数字都用到第1课的词汇。
  hi.a1.unit02.lesson03.teach.dialogue.line04:
    title: Priya 问 Arjun 的年龄
    gloss: Priya 向他道谢，并用非正式的方式询问他的年龄。
    note: Shukriya（“谢谢”）不随语体变化，和第1单元的 shukriya 卡片一样。
  hi.a1.unit02.lesson03.teach.dialogue.line05:
    title: Arjun 说出年龄并反问
    gloss: Arjun 说他二十岁，然后反问 Priya 的年龄。
    note: 单说一句 Tumhari? 就是一种简短自然的反问方式。
  hi.a1.unit02.lesson03.teach.dialogue.line06:
    title: Priya 说出自己的年龄
    gloss: Priya 说她三十岁。
    note: Meri umra tees saal hai 完全沿用本课前面学过的句型。
  hi.a1.unit02.lesson03.teach.dialogue.line07:
    title: Arjun 结束对话
    gloss: Arjun 积极地回应，并说以后再见。
    note: Accha 和 phir milenge 都沿用了第1单元的告别词汇。
  hi.a1.unit02.lesson03.teach.dialogue.line08:
    title: Priya 结束对话
    gloss: Priya 表示同意，并随意地说回头见。
    note: Theek hai 和 phir milte hain 都沿用了第1单元的告别词汇。
