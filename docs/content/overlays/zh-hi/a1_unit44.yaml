    title: 关于季节的对话
    gloss: 现在是春天。花很美。妮娜问：你觉得哪个季节很美？阿尔琼说：我喜欢夏天。夏天我们游泳。普里亚说：我喜欢冬天。冬天我们滑冰。
    note: 用直接引语的方式复述语言咖啡馆里的对话。
    glosses:
      वसंत: 春天
      फूल: 花
      सुंदर: 漂亮
      पूछती: 问
      मौसम: 季节
      लगता: （对我来说）觉得／感觉
      कहता: 说
      गर्मी: 夏天
      अच्छी: 好的（阴性）
      तैरते: 游泳
      सर्दी: 冬天
      स्केटिंग: 滑冰
  hi.a1.unit44.lesson05.teach.mausam_ke_bare:
    title: 对话很有趣
    gloss: 关于季节的对话很有趣。
  hi.a1.unit44.lesson06.teach.vikram_hay_sab:
    title: 维克拉姆加入大家
