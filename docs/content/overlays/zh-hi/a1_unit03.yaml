  hi.a1.unit03.lesson03.next_class_and_birthday:
    title: 下一节课与生日
teaching:
  hi.a1.unit03.lesson01.teach.aaj:
    title: 今天
    gloss: 今天
    note: 这是本课几乎每个句子都会用到的词。
    example_gloss: 今天天气很好。
  hi.a1.unit03.lesson01.teach.somvar:
    title: 星期一
    gloss: 星期一
    note: 得名于 सोम（月亮）——和中文的“星期一”不同，印地语的名称直接来自月亮。
    example_gloss: 瑜伽课在星期一。
  hi.a1.unit03.lesson01.teach.mangalvar:
    title: 星期二
    gloss: 星期二
    note: 得名于 मंगल（火星），印地语大多数星期名称都遵循这一规律。
    example_gloss: 今天是星期二。
  hi.a1.unit03.lesson01.teach.budhvar:
    title: 星期三
    gloss: 星期三
    note: 得名于 बुध（水星）。
    example_gloss: 今天是星期三。
  hi.a1.unit03.lesson01.teach.guruvar:
    title: 星期四
    gloss: 星期四
    note: 得名于 गुरु（木星）。
    example_gloss: 今天是星期四。
  hi.a1.unit03.lesson01.teach.shukravar:
    title: 星期五
    gloss: 星期五
    note: 得名于 शुक्र（金星）。
    example_gloss: 星期五没有瑜伽课。
  hi.a1.unit03.lesson01.teach.shanivar:
    title: 星期六
    gloss: 星期六
    note: 得名于 शनि（土星）。
    example_gloss: 今天是星期六。
  hi.a1.unit03.lesson01.teach.ravivar:
    title: 星期日
    gloss: 星期日
    note: 得名于 रवि，梵语中太阳的名称——印地语的星期日直接以太阳命名。
    example_gloss: 今天是星期日。
  hi.a1.unit03.lesson01.teach.kaun_sa_din_hai:
    title: 询问今天星期几
    gloss: 今天星期几？
    note: '*Kaun sa*（“哪一个”）要与阳性名词 *din*（“日子”）保持一致；以后遇到阴性名词时，会看到阴性形式 *kaun si*。'
  hi.a1.unit03.lesson01.teach.yoga_class_monday:
    title: 说明某件事发生在星期几
    gloss: 瑜伽课在星期一。
    note: 星期名称后面的 *ko* 表示“在”——*somvar ko* 就是“在星期一”，每个星期名称都是同样的用法。
  hi.a1.unit03.lesson01.teach.no_class_friday:
    title: 说明某件事不在星期几
    gloss: 星期五没有瑜伽课。
    note: Nahin 表示否定；ko 仍然标示日期，这里放在句首是为了强调。
  hi.a1.unit03.lesson02.teach.jan_feb_mar:
    title: 一月、二月、三月
    gloss: 一月、二月、三月
    note: 印地语的月份名称大多是外来词，一旦掌握规律就很容易认出——这里没有新语法，只有词汇。
    example_gloss:
    - 我的生日在一月。
    - 下一个假期在二月。
    - 我的生日在三月。
  hi.a1.unit03.lesson02.teach.apr_may_jun:
    title: 四月、五月、六月
    gloss: 四月、五月、六月
    note: 和前三个月一样，很容易辨认。
    example_gloss:
    - 下一个假期在四月。
    - 我的生日在五月。
    - 下一个假期在六月。
  hi.a1.unit03.lesson02.teach.jul_aug_sep:
    title: 七月、八月、九月
    gloss: 七月、八月、九月
    note: Sitambar 这里写作带 anusvara 的 सितंबर；写作带半个 m 的 सितम्बर 也很常见，同样正确。
    example_gloss:
    - 我的生日在七月。
    - 下一个假期在八月。
    - 我的生日在九月。
  hi.a1.unit03.lesson02.teach.oct_nov_dec:
    title: 十月、十一月、十二月
    gloss: 十月、十一月、十二月
    note: Navambar 和 disambar 与 sitambar 一样采用 anusvara 写法；带半个 m 的 नवम्बर 和 दिसम्बर 也很常见，同样正确。
    example_gloss:
    - 下一个假期在十月。
    - 我的生日在十一月。
    - 下一个假期在十二月。
  hi.a1.unit03.lesson02.teach.tareekh:
    title: 日期
    gloss: 日期
    note: '*Tareekh* 是阴性名词——它的疑问词要用阴性形式（*kitni tareekh*，绝不是 *kitna tareekh*），和第2单元学过的 *keemat*、*umra* 的一致规律相同。'
    example_gloss: 今天是三号。
  hi.a1.unit03.lesson02.teach.mein_postposition:
    title: 在（用于月份）
    gloss: 在——用于月份名称
    note: '*Mein* 用于月份，就像 *ko* 用于星期：*janvari mein* 是“在一月”，绝不说 *janvari ko*。'
  hi.a1.unit03.lesson02.teach.aaj_kitni_tareekh_hai:
    title: 询问日期
    gloss: 今天几月几号？
    note: 字面意思是“今天的日期是多少号”——kitni 与阴性的 tareekh 保持一致。
  hi.a1.unit03.lesson02.teach.aaj_teen_tareekh_hai:
    title: 只用数字说出日期
    gloss: 今天是三号。
    note: 印地语说日期时直接用基数词（*teen*，“三”），和中文说“三号”一样，没有专门的“日期词”要学，只需用已经学过的数字。
  hi.a1.unit03.lesson02.teach.aaj_teen_january_hai:
    title: 说出带月份的日期
    gloss: 今天是一月三日。
    note: 同样使用基数词，只是后面加上月份名称。
  hi.a1.unit03.lesson03.teach.kab:
    title: 什么时候
    gloss: 什么时候
    note: 一个简单且高频的疑问词。
    example_gloss: 下一节课是什么时候？
  hi.a1.unit03.lesson03.teach.agli:
    title: 下一个
    gloss: 下一个的
    note: '*Agli* 是阴性形式——日常印地语中 *class*（क्लास）被当作阴性名词，所以用 *agli*，而不是阳性的 *agla*。'
    example_gloss: 下一节课在星期二。
  hi.a1.unit03.lesson03.teach.das_reprise:
    title: 十
    gloss: 十
    note: 第2单元学过——这里用来表示真正的日期。
    example_gloss: 下一节课在十号。
  hi.a1.unit03.lesson03.teach.janmadin:
    title: 生日
    gloss: 生日
    note: 阳性名词——说 mera janmadin，绝不说 meri janmadin。
    example_gloss: 我的生日在十二月。
  hi.a1.unit03.lesson03.teach.tumhara_janmadin_kab_hai:
    title: 用非正式的方式询问别人的生日
    gloss: 你的生日是什么时候？（非正式）
    note: Tumhara 与阳性的 janmadin 保持一致。
  hi.a1.unit03.lesson03.teach.mera_janmadin_january_mein_hai:
    title: 说出你的生日
    gloss: 我的生日在一月。
    note: 这是回答 Tumhara janmadin kab hai? 的自然完整句。
  hi.a1.unit03.lesson03.teach.agli_class_kab_hai:
    title: 询问下一节课什么时候
    gloss: 下一节课是什么时候？
    note: 把 agli（阴性，与 class 保持一致）和 kab 结合在一起。
  hi.a1.unit03.lesson03.teach.agli_class_mangalvar_das_march:
    title: 说出完整的星期和日期
    gloss: 下一节课在星期二，三月十日。
    note: 星期和日期放在一起说，顺序与中文一致：先月份和日期，再星期；印地语则是先星期，再日期和月份。
  hi.a1.unit03.lesson03.teach.dialogue.line01:
    title: 阿俊询问下一节课
    gloss: 阿俊问下一节瑜伽课是什么时候。
    note: 完全沿用本课的问句，只是加了 yog 使意思更清楚。
  hi.a1.unit03.lesson03.teach.dialogue.line02:
    title: 普里娅告知星期和日期
    gloss: 普里娅说下一节课在星期二，三月十日。
    note: 完全沿用本课的星期加日期句子。
  hi.a1.unit03.lesson03.teach.dialogue.line03:
    title: 阿俊向她道谢
    gloss: 阿俊说好的，谢谢。
    note: Theek hai 和 shukriya 都是第1单元学过的词汇。
  hi.a1.unit03.lesson03.teach.dialogue.line04:
    title: 普里娅回应
    gloss: 普里娅说不客气。
    note: Koi baat nahin 是非常常用、自然的说法，意思是“不客气”或“没关系”。
  hi.a1.unit03.lesson03.teach.dialogue.line05:
    title: 阿俊询问普里娅的生日
    gloss: 阿俊问普里娅的生日是什么时候。
    note: 完全沿用本课的非正式生日问句。
  hi.a1.unit03.lesson03.teach.dialogue.line06:
    title: 普里娅回答
    gloss: 普里娅说她的生日在一月。
    note: 完全沿用本课的回答句。
  hi.a1.unit03.lesson03.teach.dialogue.line07:
    title: 阿俊作出反应并说出自己的生日
    gloss: 阿俊先表示惊喜，然后说自己的生日在十二月。
    note: Accha 是第1单元的词汇；十二月在本单元第2课已经学过。
  hi.a1.unit03.lesson03.teach.dialogue.line08:
    title: 普里娅结束对话
    gloss: 普里娅表示同意，并随意地说再见。
    note: Theek hai 和 phir milte hain 都是第1单元学过的告别用语。
