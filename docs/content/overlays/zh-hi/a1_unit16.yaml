teaching:
  hi.a1.unit16.lesson01.teach.tum_ho_review:
    title: 复习：你、好、是
    gloss: 你（非正式）、好／没事、是
    note: 快速复习询问朋友身体感觉所需的词。
    example_gloss: 你好吗？
  hi.a1.unit16.lesson01.teach.mujhe_hai_review:
    title: 复习：对我、是
    gloss: 对我／给我、是
    note: 构成本课症状句式所需的系动词。
    example_gloss: 我有事要做。
  hi.a1.unit16.lesson01.teach.tum_theek_ho_phrase:
    title: 你还好吗？
    gloss: 你还好吗？
    note: 本单元开头的问句，用来关心朋友。
  hi.a1.unit16.lesson01.teach.main_hoon_nahin_review:
    title: 复习：我、是、不／没
    gloss: 我、是、不／没
    note: 用于否定地回答“你还好吗？”。
    example_gloss: 我很好。
  hi.a1.unit16.lesson01.teach.sir:
    title: 头
    gloss: 头
    note: 新名词，用于本单元的第一个症状。
    example_gloss: 我的头很大。
  hi.a1.unit16.lesson01.teach.dard:
    title: 疼痛
    gloss: 疼痛
    note: 新名词。与身体部位组合可表示具体部位的疼痛——见本单元的语法说明。
    example_gloss: 我疼。
  hi.a1.unit16.lesson01.teach.mujhe_sir_dard_hai_phrase:
    title: 我头疼。
    gloss: 我头疼。
    note: 本单元第一个完整的症状句。
  hi.a1.unit16.lesson01.teach.grammar_symptom_hai:
    title: Mujhe + 症状 + hai
    gloss: '''Mujhe + noun + hai'' 在第11单元已经学过（''mujhe kaam hai'' = 我有事做）。现在它也用来表示症状：''mujhe sir dard hai'' 的意思是“我头疼”——''sir dard''（sir = 头，dard = 痛）合在一起表示“头痛”。这不是新语法，而是同一个句式。'
    note: 点明一个已学句式（与格＋名词＋hai）的第二种用法，先指出之前学过的单元，再把它用于症状。
    target_text: '''मुझे + संज्ञा + है'' पहले यूनिट 11 में सीखा था (''मुझे काम है'' = 我有事做)। अब यह लक्षण बताने के लिए भी इस्तेमाल होता है: ''मुझे सिर दर्द है'' का मतलब है ''我头疼'' -- ''सिर दर्द'' (सिर = 头, दर्द = 痛) एक साथ मिलकर ''头痛'' बनाते हैं। यह कोई नया व्याकरण नहीं है, वही पुराना पैटर्न है।'
  hi.a1.unit16.lesson01.teach.bukhar:
    title: 发烧
    gloss: 发烧
    note: 新名词，本单元的第二个症状。
    example_gloss: 你发烧了吗？
  hi.a1.unit16.lesson01.teach.mujhe_bukhar_hai_phrase:
    title: 我发烧了。
    gloss: 我发烧了。
    note: 同样的与格＋名词＋hai 句式，用于本课的第二个症状。
  hi.a1.unit16.lesson02.teach.tumhein_jaana_review:
    title: 复习：对你、去
    gloss: 对你／给你、去
    note: 两者都已学过（第6单元和第15单元）——这里用来谈论去看医生。
    example_gloss:
    - 你想要什么？
    - 我得去车站。
  hi.a1.unit16.lesson02.teach.ke_paas_review:
    title: 复习：在……附近／在
    gloss: 在……附近／在（某地）
    note: 第8单元首次学到——这里再次使用，并在本课的语法说明中增加第三种含义。
    example_gloss: 银行在学校附近。
  hi.a1.unit16.lesson02.teach.doctor:
    title: 医生
    gloss: 医生
    note: 新名词，本课的主要话题。
    example_gloss: 这位医生很好。
  hi.a1.unit16.lesson02.teach.mujhe_doctor_ke_paas_jana_hai_phrase:
    title: 我得去看医生。
    gloss: 我得去看医生。
    note: 把 *ke paas* 与第15单元的 *mujhe...jana hai* 义务句式结合起来。
  hi.a1.unit16.lesson02.teach.grammar_ke_paas_third_sense:
    title: Ke paas：第三种含义
    gloss: '''Ke paas'' 的前两种含义之前已经学过——靠近（第8单元：''bank school ke paas hai''）和拥有（第2单元：''mere paas ek kitab hai''）。现在是第三种用法：去某个人那里，也就是去见某人——''doctor ke paas jana hai'' 的意思是“得去看医生”。''mujhe...jana hai'' 这个句式也是从第15单元复用的。'
    note: 在引入第三种含义之前，按单元编号点明前两种含义，并再次提示义务句式的复用。
  hi.a1.unit16.lesson02.teach.aaraam:
    title: 休息
    gloss: 休息
    note: 新名词，本单元的第一条建议。
    example_gloss: 我需要休息。
  hi.a1.unit16.lesson02.teach.chahiye_review:
    title: 复习：想要／需要
    gloss: 想要／需要
    note: 第6单元首次学到，这里用来表示某人需要什么。
    example_gloss: 我想要茶。
  hi.a1.unit16.lesson02.teach.tumhein_aaraam_chahiye_phrase:
    title: 你需要休息。
    gloss: 你需要休息。
    note: 把已学的 *tumhein...chahiye* 句式用于本课的新名词。
  hi.a1.unit16.lesson02.teach.dawa:
    title: 药
    gloss: 药
    note: 新名词，本单元的第二条建议。
    example_gloss: 我需要药。
  hi.a1.unit16.lesson02.teach.tumhein_dawa_chahiye_phrase:
    title: 你需要药。
    gloss: 你需要药。
    note: 同样的 *chahiye* 句式用于药。
  hi.a1.unit16.lesson02.teach.jaao_aur_review:
    title: 复习：去！、和
    gloss: 去！、和
    note: 两者都已学过（第9单元和第1/2单元）——这里用来连接两条建议。
    example_gloss:
    - 请一直往前走。
    - 我想要茶和咖啡。
  hi.a1.unit16.lesson02.teach.karo_grammar:
    title: Karo：沿用 -o 命令式规则
    gloss: '''Karo'' 用的是前面学过的同一条 tum 命令式规则（''jao''、''muro''、''batao''、''gino''——都以 ''-o'' 结尾）。这里由 ''karna''（第11单元 ''maaf karna'' 中的动词）的词干 ''kar'' 加上 ''-o'' 构成 ''karo''，意思是“做！”。''Aaraam karo'' 的意思是“休息！”'
    note: 对已学命令式规则的直接、明确的扩展，用于学习者已经作为动词原形学过的动词。
  hi.a1.unit16.lesson02.teach.aaraam_karo_phrase:
    title: 休息！
    gloss: 休息！
    note: 把新学的命令式用于本单元的第一条建议。
  hi.a1.unit16.lesson02.teach.aaraam_karo_aur_doctor_ke_paas_jaao_phrase:
    title: 休息一下，然后去看医生。
    gloss: 休息一下，然后去看医生。
    note: 把本课的两条建议合成一句自然的指示，为第3课的阅读卡做铺垫。
  hi.a1.unit16.lesson03.teach.dialogue.line01:
    title: Priya 问 Arjun 是否还好
    gloss: Arjun，你还好吗？
  hi.a1.unit16.lesson03.teach.dialogue.line02:
    title: Arjun 说他头疼还发烧
    gloss: 不好，我头疼，还发烧。
  hi.a1.unit16.lesson03.teach.dialogue.line03:
    title: Priya 说他需要休息
    gloss: 这可不好。你需要休息。
  hi.a1.unit16.lesson03.teach.dialogue.line04:
    title: Arjun 说他也需要药
    gloss: 是啊，但我也需要药。
  hi.a1.unit16.lesson03.teach.dialogue.line05:
    title: Priya 说他得去看医生
    gloss: 好吧。你得去看医生。
  hi.a1.unit16.lesson03.teach.dialogue.line06:
    title: Arjun 向 Priya 道谢
    gloss: 好的,谢谢。
  hi.a1.unit16.lesson03.teach.dialogue.line07:
    title: Priya 让他休息
    gloss: 休息！
  hi.a1.unit16.lesson03.teach.dialogue.line08:
    title: Arjun 答应了
    gloss: 好。
  hi.a1.unit16.lesson03.teach.grammar_summary:
    title: 三条主要规则
    gloss: 本单元的三条主要规则:(1) 'mujhe/tumhein + 症状 + hai' 用来说明身体不适(如 'mujhe bukhar hai');(2) 'tumhein/mujhe + 东西 + chahiye' 用来表示需要(如 'tumhein aaraam chahiye');(3) 'X ke paas jana hai' 表示必须去找谁(如 'doctor ke paas jana hai')。
    note: 本单元语法的总结,与第15单元的语法提示相呼应。
  hi.a1.unit16.lesson03.teach.advice_reading:
    title: 阅读建议
    gloss: 休息。去看医生。
    note: 简短直接的建议,贴近真实口语,只重复对话中已有的信息,不增加新内容。
    glosses:
      आराम: 休息
      करो: 做(命令式)
      डॉक्टर: 医生
      जाओ: 去(命令式)
