  notes: 'Derived from en-hi by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Chinese (Mandarin, Simplified) string was translated and adapted. Needs native Chinese (Mandarin, Simplified) review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  mujhe_verb_hai: This unit's central grammar point is the दात-subject obligation construction "X + verb-infinitive + है" (मुझे/तुम्हें/हमें/आपको + infinitive + है = "X needs/has to ___"). A typed answer that drops है entirely, or that appends हैं instead of है (है is invariant here -- it agrees with the infinitive verb, not the दात subject), should be marked incorrect -- this is the exact point being tested.
  kitne_ka_gender: '"टिकट कितने का है?" (how much is the ticket) is taught with का, treating टिकट as masculine -- the same कितने का/की gender-agreement rule 第7单元 already established. Many native speakers also use टिकट as feminine (टिकट कितने की है?), so की with टिकट is ACCEPTED as a valid alternative wherever typed; plural के with one ticket is the error the grammar_check targets.'
  train_gender: ट्रेन is grammatically feminine, so every habitual-present verb form describing it in this unit uses जाती है, never जाता है. A typed answer using जाता है for the train should be marked incorrect as a real agreement error.
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit's one new nasalized word, हमें, uses anusvara, verified against a direct codepoint check -- consistent with the already-established तुम्हें convention. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks. For any exercise asking the learner to state their own travel request, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: 印地语 A1
units:
  hi.a1.unit15.travel:
    title: 旅行
lessons:
  hi.a1.unit15.lesson01.station_jana:
    title: 我得去车站
  hi.a1.unit15.lesson02.platform_samay:
    title: 站台号和时间
  hi.a1.unit15.lesson03.priya_arjun_station:
    title: 普里亚和阿琼：在车站
teaching:
  hi.a1.unit15.lesson01.teach.station_mujhe_hai_review:
    title: 复习：车站、我(对我)、是
    gloss: 车站，对我/我，是
    note: 快速复习一个地点名词和系动词，它们是构成本课“必须做某事”句式所需要的。
    example_gloss:
    - 车站在这里。
    - 我有事要做。
  hi.a1.unit15.lesson01.teach.jaana:
    title: 去
    gloss: 去(不定式)
    note: 这是你已学过的 तुम 命令式 *jao*(第9单元)所对应的动词不定式——本课正式介绍这个基本的不定式形式。
    example_gloss: 我得去。
  hi.a1.unit15.lesson01.teach.grammar_mujhe_verb_hai:
    title: Mujhe + 动词 + hai = 必须/得做
    gloss: “Mujhe”之前已和“chahiye”(第6单元，接名词)以及“hai”(第11单元，如“mujhe kaam hai”,我有事做)一起学过。现在它也可以接动词：“mujhe jana hai”的意思是“我得去”。注意——和“jana”连用时，“hai”保持不变，不会变成“hain”:它不随说话人变化。
    note: 本课介绍这个“代词+系动词”结构的第三种用法，并在引入新的动词位置之前，按单元编号指出前两种用法。
  hi.a1.unit15.lesson01.teach.mujhe_station_jana_hai_phrase:
    title: 我得去车站。
    gloss: 我得去车站。
    note: 本单元第一个表示“必须”的完整例句。
  hi.a1.unit15.lesson01.teach.tiket:
    title: 票
    gloss: 车票
    note: 一个新名词，整个出行单元都会用到。
    example_gloss: 我的票在哪儿？
  hi.a1.unit15.lesson01.teach.chahiye_review:
    title: 复习：想要/需要
    gloss: 想要/需要
    note: 第6单元在饮品场景中学过，这里用在车票上。
    example_gloss: 我想要茶。
  hi.a1.unit15.lesson01.teach.mujhe_tiket_chahiye_phrase:
    title: 我需要一张票。
    gloss: 我需要一张票。
    note: 把已学过的 *mujhe...chahiye* 句式用在本单元的新名词上。
  hi.a1.unit15.lesson01.teach.train:
    title: 火车
    gloss: 火车
    note: 一个新名词。
    example_gloss: 这列火车很大。
  hi.a1.unit15.lesson01.teach.delhi_ka_review:
    title: 复习：德里、的
    gloss: 德里，的(表示所属的标记)
    note: 德里在第5单元学过；表示所属的 *ka* 在整个课程(如第5至14单元)中已多次使用——这里用来说明车票的目的地。
    example_gloss:
    - 我哥哥住在德里。
    - 这是阿琼的包。
  hi.a1.unit15.lesson01.teach.mujhe_delhi_ka_tiket_chahiye_phrase:
    title: 我需要一张去德里的票。
    gloss: 我需要一张去德里的票。
    note: 把本课的名词与表示所属的标记结合起来，说明具体的目的地。
  hi.a1.unit15.lesson01.teach.kahan_tumhein_review:
    title: 复习：哪里、对你
    gloss: 哪里，对你/你需要
    note: 两个词都已学过(第8单元和第6单元)——这里用来询问某人要去哪里。
    example_gloss:
    - 银行在哪儿？
    - 你想要什么？
  hi.a1.unit15.lesson02.teach.number_review:
    title: 复习：号码
    gloss: 号码
    note: 第2单元在电话号码中学过——这里用于站台号。
    example_gloss: 你的电话号码是多少？
  hi.a1.unit15.lesson02.teach.platform:
    title: 站台
    gloss: 站台
    note: 一个新名词，是印地语中表示火车站站台的标准说法(来自英语的常用外来词，与第2单元的 *phone* 类似)。
    example_gloss: 站台很大。
  hi.a1.unit15.lesson02.teach.platform_number_kya_hai_phrase:
    title: 站台号是多少？
    gloss: 站台号是多少？
    note: 把已学过的 *kya hai* 提问句式(如电话号码、价格、年龄)用于新的话题。
  hi.a1.unit15.lesson02.teach.platform_number_teen_hai_phrase:
    title: 站台号是3。
    gloss: 站台号是3。
    note: 对上面问题的自然的完整句回答。
  hi.a1.unit15.lesson02.teach.jaana_habitual_grammar:
    title: Jaati hai(阴性一致)
    gloss: “Jaati hai”运用了第10单元的 -ta/-ti/-te + hai/hain 规则，搭配新动词“jana”。“火车(ट्रेन)”在语法上是阴性，所以说“jaati hai”,而不是“jaata hai”。
    note: 这是对已学过的习惯性现在时一致规则的直接、明确的延伸，用于新的动词和一个语法上为阴性的新名词。
  hi.a1.unit15.lesson02.teach.se_review:
    title: 复习：从
    gloss: 从
    note: 第9单元在指路时学过——这里用于火车出发的站台。
    example_gloss: 从这里一直走。
  hi.a1.unit15.lesson02.teach.train_platform_se_jaati_hai_phrase:
    title: 火车从3号站台出发。
    gloss: 火车从3号站台出发。
    note: 把本课的习惯性现在时动词形式与已学过的表示“从”的后置词结合起来。
  hi.a1.unit15.lesson02.teach.kitne_baje_review:
    title: 复习：几点
    gloss: 几点
    note: 第4单元在讲报时时学过——这里用来询问发车时间。
    example_gloss: 现在几点？
  hi.a1.unit15.lesson02.teach.train_kitne_baje_jaati_hai_phrase:
    title: 火车几点开？
    gloss: 火车几点开？
    note: 这里把“几点”的问法用于询问既定的发车时间，而不是现在的时间。
  hi.a1.unit15.lesson02.teach.train_chhah_baje_jaati_hai_phrase:
    title: 火车六点开。
    gloss: 火车六点开。
    note: 自然的完整句回答，沿用第4单元的复数形式 *baje*(六点不属于 *baja* 这个例外，它只用于一点钟)。
  hi.a1.unit15.lesson02.teach.tiket_kitne_ka_hai_phrase:
    title: 票多少钱？
    gloss: 票多少钱？
    note: 沿用第7单元的 *kitne ka/ki* 问价格句型。*Tikat*(票)通常视为阳性(用 *ka*);也有不少人视为阴性(用 *kitne ki*),同样正确。
  hi.a1.unit15.lesson02.teach.rupaye_review:
    title: 复习：卢比、五十
    gloss: 卢比，五十
    note: 两个词都在第2单元学过，用于价格和数量——这里用来说车票价格。
    example_gloss: 我有五十卢比。
  hi.a1.unit15.lesson02.teach.tiket_pachaas_rupaye_ka_hai_phrase:
    title: 票价五十卢比。
    gloss: 票价五十卢比。
    note: 对上面价格问题的自然完整句回答。
  hi.a1.unit15.lesson03.teach.hum_hamein:
    title: 我们、对我们
    gloss: 我们；对我们/给我们
    note: “hum”(我们)已在第11单元作为本课程第一个第一人称复数代词出现；“hamein”是它的与格形式，在这里的同行对话中会用到。
    example_gloss:
    - 我们很好。
    - 我们需要去车站。
  hi.a1.unit15.lesson03.teach.hamein_grammar:
    title: Hamein：第四个与格代词
    gloss: “Hamein”是“hum”(第11单元)的与格形式，就像“mujhe”(对应 main)和“tumhein”(对应 tum)一样。这里与“jana”搭配时，“hai”同样保持不变，不会变成“hain”——它不随“hum”/“hamein”变化。
    note: 在加入第四个代词之前，按单元编号列出了前面三个与格代词，并重申第1课语法说明中的同一要点：这里的“hai”形式跟随动词，而不随代词变化。
  hi.a1.unit15.lesson03.teach.hamein_station_jana_hai_phrase:
    title: 我们需要去车站。
    gloss: 我们需要去车站。
    note: 带有新的复数与格代词的“必须/需要”结构。
  hi.a1.unit15.lesson03.teach.ki_review:
    title: 复习：的(阴性)
    gloss: 的(所属标记，阴性)
    note: 在第7单元与 *ka*/*kitne* 一起学过——这里再次出现，因为“火车”是阴性名词，所以所属形式是“ki”,而不是“ka”。
    example_gloss: 这是去德里的火车。
  hi.a1.unit15.lesson03.teach.dialogue.line01:
    title: 阿尔琼说他们得去车站
    gloss: 普里娅，我们得去车站。
  hi.a1.unit15.lesson03.teach.dialogue.line02:
    title: 普里娅需要一张去德里的票
    gloss: 好的。我需要一张去德里的票。
  hi.a1.unit15.lesson03.teach.dialogue.line03:
    title: 阿尔琼问价格
    gloss: 我也是。票多少钱？
  hi.a1.unit15.lesson03.teach.dialogue.line04:
    title: 普里娅说出价格
    gloss: 票价五十卢比。
  hi.a1.unit15.lesson03.teach.dialogue.line05:
    title: 阿尔琼问发车时间
    gloss: 好。火车几点开？
  hi.a1.unit15.lesson03.teach.dialogue.line06:
    title: 普里娅说出时间和站台
    gloss: 火车六点开，从三号站台出发。
  hi.a1.unit15.lesson03.teach.dialogue.line07:
    title: 阿尔琼明白了，说“走吧”
    gloss: 明白了。走吧！
  hi.a1.unit15.lesson03.teach.dialogue.line08:
    title: 普里娅表示同意
    gloss: 走吧！
  hi.a1.unit15.lesson03.teach.grammar_summary:
    title: 三条主要规则
    gloss: 本单元的三条主要规则：(1)“mujhe/tumhein/hamein + 动词 + hai”表示“需要/得做某事”;(2)“X kitne ka/ki hai?”用来问价格；(3)“X [时间] baje [地点] se jaati hai”用来说明出行的时间和出发地点。
    note: 收尾总结，把整个单元的语法串联起来，与第14单元的总结性语法说明相呼应。
  hi.a1.unit15.lesson03.teach.tiket_reading:
    title: 读车票
    gloss: 车票：德里。三号站台。六点。
    note: 一段简短的车票片段文字(没有完整句子，与真实车票的写法一致),只重述对话中已出现的信息，没有新内容。
    glosses:
      टिकट: 车票
      प्लेटफ़ॉर्म: 站台
      नंबर: 号码
      बजे: 点钟
