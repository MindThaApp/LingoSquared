teaching:
  hi.a1.unit12.lesson01.teach.vyast_review:
    title: 复习：忙
    gloss: 忙的
    note: 快速复习第11单元的形容词——本单元会用它来练习新的过去时系动词。
    example_gloss: 阿尔琼很忙。
  hi.a1.unit12.lesson01.teach.tha_thi:
    title: 曾是／在（阳性／阴性）
    gloss: 是／在（过去）
    note: 系动词（是）的过去时，是 hai/hoon/hain 对应的过去形式。'Tha' 与阳性主语搭配，'thi' 与阴性主语搭配。
    example_gloss:
    - 阿尔琼昨天很忙。
    - 普丽娅昨天很忙。
  hi.a1.unit12.lesson01.teach.tha_thi_grammar:
    title: Tha 与 thi
    gloss: '''Tha'' 与阳性主语搭配，''thi'' 与阴性主语搭配——它们出现在 ''hai'' 所在的位置，但与 ''hai'' 不同，它们会随性别变化：阿尔琼很忙，阿尔琼当时很忙，普丽娅当时很忙。'
    note: 明确说明性别一致的规律，把已熟悉的系动词变化延伸到过去时。
  hi.a1.unit12.lesson01.teach.kal_review:
    title: 复习：昨天
    gloss: 昨天
    note: 第4单元已学过，当时指出 'kal' 既可指“明天”也可指“昨天”，要靠动词的时态来区分。本单元是课程中第一次真正使用它表示过去的“昨天”。
    example_gloss: 昨天是星期六。
  hi.a1.unit12.lesson01.teach.kaisa:
    title: 怎么样（阳性）
    gloss: 怎么样
    note: 补全本课程已学过三分之二的变化——'kaise' 和 'kaisi'（来自第1单元的“你好吗”）已经学过，这里补上缺少的阳性单数形式，用于 'din'（日子）这类主语。
    example_gloss: 这一天过得怎么样？
  hi.a1.unit12.lesson01.teach.kal_kaisa_tha_phrase:
    title: 昨天怎么样？
    gloss: 昨天怎么样？
    note: 本单元反复出现的核心问句，综合了本课到目前为止学过的所有词。
  hi.a1.unit12.lesson01.teach.din_achha_tha_phrase:
    title: 这一天很好。
    gloss: 这一天很好。
    note: 可直接用来回答“昨天怎么样？”，用的是阳性形式（din 是阳性）。
  hi.a1.unit12.lesson01.teach.filma_achi_thi:
    title: 这部电影很好。
    gloss: 这部电影很好。
    note: 同样的句型，主语为阴性（film 是阴性），呼应第11单元的词汇。
  hi.a1.unit12.lesson01.teach.kaisa_kaisi_grammar:
    title: Kaisa、kaisi、kaise
    gloss: '''Kaisa'' 与阳性单数主语搭配（这一天怎么样？），''kaisi'' 与阴性搭配（茶怎么样？），''kaise'' 用于 aap/tum，问男性时使用（你好吗？；问女性则说 ''aap kaisi hain?''）——三者是同一个词的不同形式。'
    note: 首次把整套变化串联起来——kaise/kaisi 在第1单元已学过，kaisa 是本课新增的。
  hi.a1.unit12.lesson02.teach.names_mai_review:
    title: 复习：我、阿尔琼、普丽娅
    gloss: 我、阿尔琼、普丽娅
    note: 在学习本课第一人称过去时例句之前的快速复习。
    example_gloss:
    - 我是阿尔琼。
    - 我是普丽娅。
  hi.a1.unit12.lesson02.teach.jaana_gaya_gai:
    title: 去了（阳性／阴性）
    gloss: 去了
    note: '''jaana''（去）的过去时，词根与第9单元学过的命令式 ''jao''（去吧！）相同。与 ''tha''/''thi'' 一样，随主语性别变化。'
    example_gloss:
    - 阿尔琼去了市场。
    - 普丽娅回家了。
  hi.a1.unit12.lesson02.teach.jaana_grammar:
    title: Gaya/gai 是 jaana 的过去时
    gloss: '''Gaya''/''gai'' 是 ''jaana''（去，第9单元的 jao）的过去时，随主语性别变化——和 ''tha''/''thi'' 一样。'
    note: 明确把新的过去时与已学过的命令式词根联系起来。
  hi.a1.unit12.lesson02.teach.bazaar_ghar_review:
    title: 复习：市场、家
    gloss: 市场、家
    note: 快速复习第7/8单元的两个地点词，说明某人去了哪里时会用到。
    example_gloss:
    - 这是市场。
    - 这是家。
  hi.a1.unit12.lesson02.teach.milna_mila_mili:
    title: 见了（阳性／阴性）
    gloss: 见了
    note: '''milna''（见面）的过去时，词根与第1/4/10/11单元结束语中的习惯式 ''milte hain'' 相同。随主语性别变化。'
    example_gloss:
    - 阿尔琼见了普丽娅。
    - 普丽娅见了阿尔琼。
  hi.a1.unit12.lesson02.teach.milna_se_grammar:
    title: 这里的 se 是“和”，不是“从”
    gloss: 这里的 'se' 不表示“从”——'X se milna' 的意思是“和X见面”，而在 'main Bharat se hoon' 中同一个词 'se' 表示“来自”。
    note: 已学词语的另一种真实用法，在此明确说明。
  hi.a1.unit12.lesson02.teach.wahan_review:
    title: 复习：那里
    gloss: 那里
    note: 第8/9单元学过的词的快速复习，这里用来说明见面的地点。
    example_gloss: 学校在那里。
  hi.a1.unit12.lesson02.teach.kal_bazaar_gaya_phrase:
    title: 我昨天去了市场。
    gloss: 我昨天去了市场。
    note: 把本课新学的过去时与第1课的 'kal' 结合起来。
  hi.a1.unit12.lesson02.teach.wahan_priya_se_mila_phrase:
    title: 我在那里见到了普丽娅。
    gloss: 我在那里见到了普丽娅。
    note: 把本课的 'mila' 与 'se'（和）以及 'wahan'（那里）结合起来。
  hi.a1.unit12.lesson02.teach.saath_review:
    title: 复习：一起
    gloss: 一起
    note: 第11单元内容的快速复习。
    example_gloss: 我们一起喝茶。
  hi.a1.unit12.lesson03.teach.chai_dukaan_khana_review:
    title: 复习：茶、店、饭菜
    gloss: 茶、店、饭菜
    note: 快速复习第6/7单元的三个名词，本课的对话和阅读说明会用到。
    example_gloss:
    - 茶很好。
    - 这家店很好。
    - 饭菜很好。
  hi.a1.unit12.lesson03.teach.ka_kaisi_review:
    title: 复习：“的”（ka）、怎么样（阴性）
    gloss: ……的（ka）、怎么样（阴性，kaisi）
    note: '''Ka''（之前学过的 ''kitne ka'' 和第10单元的 ''raat ka khana''）和 ''kaisi''（之前学过）在这里都是重复使用，并非新语法。'
    example_gloss:
    - 昨天过得很好。
    - 那家茶店怎么样？
  hi.a1.unit12.lesson03.teach.dialogue.line01:
    title: 阿尔琼问昨天怎么样
    gloss: 普丽娅，昨天怎么样？
  hi.a1.unit12.lesson03.teach.dialogue.line02:
    title: 普丽娅说很好
    gloss: 非常好！我们见面了。
  hi.a1.unit12.lesson03.teach.dialogue.line03:
    title: 阿尔琼提到市场
    gloss: 是啊！我还先去了市场。
  hi.a1.unit12.lesson03.teach.dialogue.line04:
    title: 普丽娅问起市场
    gloss: 是吗！市场里有什么？
  hi.a1.unit12.lesson03.teach.dialogue.line05:
    title: 阿尔琼回答
    gloss: 饭菜很好。
  hi.a1.unit12.lesson03.teach.dialogue.line06:
    title: 普丽娅问起茶店
    gloss: 是吗！那家茶店怎么样？
  hi.a1.unit12.lesson03.teach.dialogue.line07:
    title: 阿尔琼回答
    gloss: 那家茶店非常好。
  hi.a1.unit12.lesson03.teach.dialogue.line08:
    title: 普丽娅结束对话
    gloss: 好！那明天再见面吧？
  hi.a1.unit12.lesson03.teach.mile_grammar:
    title: Tum/hum/ve 用复数形状的过去式
    gloss: '''Tum''、''hum'' 和 ''ve'' 在过去时中使用的形式，与现在时中带 ''-te'' 的形式一致：''the''（代替 ''tha''）、''gaye''（代替 ''gaya''）、''mile''（代替 ''mila''）——就像 ''hum milte hain'' 变成 ''hum mile''。'
    note: 完整列出变化规律以便理解，不过本单元练习中只重点操练 'mile'——'the'/'gaye' 仅供认读，只出现在本说明中。
  hi.a1.unit12.lesson03.teach.priya_note:
    title: Priya 的便条
    gloss: Arjun,昨天过得很愉快。饭菜很好吃,茶店也很不错。——Priya
    note: 一则简短的便条,复述刚才对话中已经出现的内容,没有新词汇。
    glosses:
      कल: 昨天
      दिन: 天
      अच्छा: 好(阳性)
      था: 过去是(阳性)
      खाना: 食物
      दुकान: 商店
      अच्छी: 好(阴性)
      थी: 过去是(阴性)
