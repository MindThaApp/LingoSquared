teaching:
  hi.a1.unit05.lesson01.teach.parivar:
    title: 家庭
    gloss: 家庭
    note: 表示“家庭”的通用词，本单元会一直用到。
    example_gloss: 我的家人在印度。
  hi.a1.unit05.lesson01.teach.pita_maa:
    title: 父亲，母亲
    gloss: 父亲，母亲
    note: 介绍这两位时，都用表示尊敬的复数形式 *hain*，而不用 *hai*；*pita* 要搭配 *mere* 而不是 *mera*——见本课后面的敬称说明。
    example_gloss:
    - 这是我的父亲。
    - 这是我的母亲。
  hi.a1.unit05.lesson01.teach.bhai_behan:
    title: 哥哥/弟弟，姐姐/妹妹
    gloss: 哥哥/弟弟，姐姐/妹妹
    note: 这是本单元 mera/meri 一致性对比的核心词对：*mera bhai*，*meri behan*。
    example_gloss:
    - 我有一个兄弟。
    - 我有一个姐妹。
  hi.a1.unit05.lesson01.teach.ek_as_article:
    title: Ek 表示“一个”
    gloss: '*Ek* 在数数时表示“一”，也可以表示“一个”：*mera ek bhai hai*。'
    note: 这就是已经学过的数字1，印地语没有单独的不定冠词。
  hi.a1.unit05.lesson01.teach.mata_pita:
    title: 父母
    gloss: 父母
    note: 由 *mata*（母亲，较正式）和 *pita*（父亲）构成的复合词，是表示“父母”的标准说法。
    example_gloss: 我的父母住在德里。
  hi.a1.unit05.lesson01.teach.mera_meri_note:
    title: Mera 与 meri 的区别
    gloss: '*Mera* 搭配阳性词，*meri* 搭配阴性词：*mera bhai*，*meri behan*。'
    note: 这是本单元的核心语法点：物主形容词要与被拥有的人或物一致，而不是与说话人一致。
  hi.a1.unit05.lesson01.teach.mere_honorific_note:
    title: 对尊敬的长辈用 Mere
    gloss: 出于对长辈的尊敬，*mera* 要变成 *mere*，*hai* 要变成 *hain*，即使只指一个人：*yeh mere pita hain*（这是我的父亲）。
    note: 这是真实的惯例，并不是错误：受尊敬的单数男性长辈（父亲、祖父）要用这种看似复数的形式。母亲和祖母仍用 *meri*，但出于同样的原因，动词也要用复数（*hain*）。
  hi.a1.unit05.lesson01.teach.yah_mera_bhai_hai:
    title: 这是我的哥哥／弟弟
    gloss: 这是我的兄弟。
    note: 这是最直接的阳性形式，说兄弟不需要用敬称。
  hi.a1.unit05.lesson01.teach.yah_meri_behan_hai:
    title: 这是我的姐妹
    gloss: 这是我的姐妹。
    note: 这是最直接的阴性形式，与 *behan* 保持一致。
  hi.a1.unit05.lesson01.teach.yah_kaun_hai:
    title: 这是谁?
    gloss: 这是谁？
    note: 介绍家人时一个简单又实用的问句。
  hi.a1.unit05.lesson02.teach.dada_dadi:
    title: 爷爷、奶奶
    gloss: 爷爷、奶奶
    note: 专指父亲的父母——本课后面的说明会把它们与母亲的父母作对比。
    example_gloss:
    - 我爷爷住在德里。
    - 我奶奶住在德里。
  hi.a1.unit05.lesson02.teach.nana_nani:
    title: 外公、外婆
    gloss: 外公、外婆
    note: 指母亲的父母——印地语用的是与父亲的父母完全不同的一对词。
    example_gloss:
    - 我外公住在孟买。
    - 我外婆住在孟买。
  hi.a1.unit05.lesson02.teach.dilli_mumbai:
    title: 德里、孟买
    gloss: 德里、孟买
    note: 印度的两座大城市,本课的例句用它们来说明家人住在哪里。
    example_gloss:
    - 我的家人住在德里。
    - 我的兄弟住在孟买。
  hi.a1.unit05.lesson02.teach.dada_nana_note:
    title: 两对祖父母
    gloss: 父亲的父母:*dada-dadi*。母亲的父母:*nana-nani*。
    note: 和中文一样(爷爷奶奶、外公外婆),印地语也按父亲一方或母亲一方使用完全不同的词。
  hi.a1.unit05.lesson02.teach.rehna_verb:
    title: 住(rehna)
    gloss: 住(阳性/阴性/尊称或复数)
    note: “居住”的动词:男性用 *rehta hai*,女性用 *rehti hai*,多于一人或尊敬的长辈用 *rehte hain*。
    example_gloss:
    - 我的兄弟住在德里。
    - 我的姐妹住在孟买。
    - 我的祖父母住在德里。
  hi.a1.unit05.lesson02.teach.tumhara_tumhari:
    title: 你的(非正式)
    gloss: 你的(非正式,阳性/阴性)
    note: 非正式的 *tum* 称呼所对应的所有格,和 *mera/meri* 一样,要与所修饰的名词保持一致。
    example_gloss:
    - 你的兄弟住在哪里？
    - 你的姐妹住在哪里?
  hi.a1.unit05.lesson02.teach.mera_tumhara_note:
    title: Mera 和 tumhara 一起看
    gloss: '*Mera* 和 *tumhara* 都搭配阳性词;*meri* 和 *tumhari* 都搭配阴性词:*mera bhai*/*tumhara bhai*,*meri behan*/*tumhari behan*。'
    note: 这与第1课的一致规则相同,现在也适用于 *tumhara*。
  hi.a1.unit05.lesson03.teach.bada_badi:
    title: 年长/大
    gloss: 年长的、大的(阳性/阴性)
    note: 中文用“哥哥、姐姐”这样的专门词来表示年长的兄弟姐妹,而印地语是用随性别变化的形容词来表示。
    example_gloss:
    - 我哥哥住在德里。
    - 我姐姐住在孟买。
  hi.a1.unit05.lesson03.teach.chota_choti:
    title: 年幼/小
    gloss: 年幼的、小的(阳性/阴性)
    note: 与 *bada/badi* 相对,用于年幼的兄弟姐妹。
    example_gloss:
    - 我弟弟现在是学生。
    - 我妹妹现在是学生。
  hi.a1.unit05.lesson03.teach.bada_chota_note:
    title: Bada/chota 的一致变化
    gloss: '*Bada* 和 *chota* 搭配阳性词,*badi* 和 *choti* 搭配阴性词:*bada bhai*,*badi behan*。'
    note: 与 *mera/meri* 相同的阳性/阴性形容词变化,现在用在表示年龄大小的词上。
  hi.a1.unit05.lesson03.teach.aur_lekin_bhi:
    title: 和、但是、也
    gloss: 和、但是、也
    note: 三个基本的连接词,在本课结尾的对话中会反复用到。
    example_gloss:
    - 我的兄弟和我的姐妹住在德里。
    - 我的兄弟住在德里,但是我的姐妹住在孟买。
    - 我也有一个姐妹。
  hi.a1.unit05.lesson03.teach.accha_phir_milenge:
    title: 好的,再见
    gloss: 好的!再见。
    note: 友好的结束语,沿用了第2单元的告别用语。
  hi.a1.unit05.lesson03.teach.theek_hai_phir_milte_hain:
    title: 好的,回头见
    gloss: 好的,回头见!
    note: 对上一句结束语的非正式回应,与前面单元的结束对话相呼应。
  hi.a1.unit05.lesson03.teach.dialogue.line01:
    title: 阿尔琼询问普里娅的家人
    gloss: 阿尔琼问普里娅的家人住在哪里。
    note: 沿用了本单元的 *parivar kahan rehta hai* 句型。
  hi.a1.unit05.lesson03.teach.dialogue.line02:
    title: 普里娅介绍她的父母和哥哥
    gloss: 普里娅说她的父母住在德里,她还有一个哥哥。
    note: 综合了 *mata-pita*、*rehte hain* 和 *bada bhai bhi hai*。
  hi.a1.unit05.lesson03.teach.dialogue.line03:
    title: 阿尔琼问起她的祖父母
    gloss: 阿尔琼说“这样啊”,然后问:那你的祖父母呢?
    note: '*Tumhare* 是 *tumhara* 用于长辈时的敬重形式,就像 *mere* 之于 *mera*(第1课关于敬称的说明)。'
  hi.a1.unit05.lesson03.teach.dialogue.line04:
    title: 普里娅介绍两边的祖父母
    gloss: 普里娅说她的爷爷奶奶住在德里,但外公外婆住在孟买。
    note: 用 *lekin* 对比两对祖父母所在的城市,巩固第2课 dada-dadi 与 nana-nani 的区别。
  hi.a1.unit05.lesson03.teach.dialogue.line05:
    title: 阿尔琼说起自己的妹妹
    gloss: 阿尔琼说他也有一个妹妹。
    note: 沿用了 *bhi* 和 *choti behan*。
  hi.a1.unit05.lesson03.teach.dialogue.line06:
    title: 普里娅结束对话
    gloss: 普里娅说:好的,再见。
    note: 沿用了本课的结束用语。
  hi.a1.unit05.lesson03.teach.dialogue.line07:
    title: 阿尔琼回应
    gloss: 阿尔琼表示同意,说回头见。
    note: 沿用了本课的回应用语。
