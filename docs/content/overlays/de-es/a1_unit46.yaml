teaching:
  es.a1.unit46.lesson01.teach.no_me_siento:
    title: Sich unwohl fühlen
    gloss: Ich fühle mich nicht gut.
    note: '*Sentirse* ist reflexiv (*me siento*, *te sientes*); *no me siento bien* ist die allgemeine, milde Art zu sagen, dass etwas nicht stimmt.'
  es.a1.unit46.lesson01.teach.enfermo:
    title: Krank
    gloss: krank
    note: 'Ein einfaches Adjektiv, das mit *estar* (sein, für Zustände) verwendet wird: *estoy enfermo*.'
    example_gloss: Ich bin krank.
  es.a1.unit46.lesson01.teach.estoy_enfermo:
    title: Krank sein
    gloss: Ich bin krank.
    note: '*Enfermo* bezeichnet einen allgemeineren, stärkeren Zustand als *no me siento bien*; es richtet sich nach dem Geschlecht der sprechenden Person (*enferma*).'
  es.a1.unit46.lesson01.teach.dolor_de_cabeza:
    title: Kopfschmerzen
    gloss: Kopfschmerzen
    note: 'Im Spanischen steht *dolor de cabeza* mit *tener* und ohne Artikel: *tengo dolor de cabeza*. Das entspricht dem deutschen „Ich habe Kopfschmerzen“, ebenfalls ohne Artikel.'
    example_gloss: Ich habe Kopfschmerzen.
  es.a1.unit46.lesson01.teach.tengo_dolor_de:
    title: Kopfschmerzen haben
    gloss: Ich habe Kopfschmerzen.
    note: 'Symptome verbinden sich mit *tener* (haben): *tengo dolor de cabeza*, genau wie im Deutschen „Ich habe Kopfschmerzen“.'
  es.a1.unit46.lesson01.teach.dolor_de_estomago:
    title: Bauchschmerzen
    gloss: Bauchschmerzen
    note: 'Dasselbe Muster ohne Artikel wie bei *dolor de cabeza*: *dolor de estómago*.'
    example_gloss: Ich habe Bauchschmerzen.
  es.a1.unit46.lesson01.teach.tengo_dolor_de_2:
    title: Bauchschmerzen haben
    gloss: Ich habe Bauchschmerzen.
    note: Es gilt dasselbe *tener*-Muster wie bei *dolor de cabeza*.
  es.a1.unit46.lesson02.teach.que_pasa:
    title: Allgemein nachfragen
    gloss: Was ist los?
    note: Eine allgemeine Frage für alle Fälle, um zu fragen, ob etwas nicht stimmt.
  es.a1.unit46.lesson02.teach.que_te_pasa:
    title: Eine feste Wendung
    gloss: Was hast du?
    note: '*¿Qué te pasa?* ist die natürliche Art zu fragen, was los ist (wörtlich „Was passiert dir?“); übersetzen Sie es nicht Wort für Wort.'
  es.a1.unit46.lesson02.teach.dolor_de_garganta:
    title: Halsschmerzen
    gloss: Halsschmerzen
    note: 'Dasselbe Muster wie bei *dolor de cabeza* und *dolor de estómago*: *dolor de garganta*.'
    example_gloss: Ich habe Halsschmerzen.
  es.a1.unit46.lesson02.teach.tengo_dolor_de:
    title: Halsschmerzen haben
    gloss: Ich habe Halsschmerzen.
    note: Es gilt dasselbe *tener*-Muster wie bei den anderen Symptomen.
  es.a1.unit46.lesson02.teach.estas_bien_no:
    title: Bei jemandem nachfragen
    gloss: Geht es dir gut? Nein, ich fühle mich nicht gut.
    note: '*¿Estás bien?* ist eine sehr gebräuchliche, lockere Nachfrage unter Freunden; bei jemandem, den man mit *usted* anspricht, wird daraus *¿Está bien?*.'
  es.a1.unit46.lesson03.teach.fiebre:
    title: Fieber
    gloss: Fieber
    note: 'Wird nach *tener* ohne Artikel verwendet, wie die anderen Symptome: *tengo fiebre*.'
    example_gloss: Ich habe Fieber.
  es.a1.unit46.lesson03.teach.tengo_fiebre:
    title: Fieber haben
    gloss: Ich habe Fieber.
    note: Es gilt das *tener*-Muster.
  es.a1.unit46.lesson03.teach.resfriado:
    title: Erkältet sein
    gloss: erkältet / erkältet sein
    note: '*Resfriado* ist ein Adjektiv, das mit *estar* verwendet wird; Sie können aber auch *tengo un resfriado* sagen, mit dem Nomen *resfriado*.'
    example_gloss: Ich bin erkältet.
  es.a1.unit46.lesson03.teach.estoy_resfriado:
    title: Sagen, dass man erkältet ist
    gloss: Ich bin erkältet.
    note: 'Wie im Deutschen („Ich bin erkältet“) wird im Spanischen ein Adjektiv verwendet: *estoy resfriado*; es richtet sich nach dem Geschlecht der sprechenden Person (*resfriada*).'
  es.a1.unit46.lesson03.teach.enfermo_y_resfriado:
    title: Estar oder tener hängt von der Wortart ab
    gloss: 'Enfermo und resfriado sind Adjektive und stehen mit estar: Ich bin krank, ich bin erkältet. Fiebre und dolor de cabeza sind Nomen und stehen mit tener: Ich habe Fieber, ich habe Kopfschmerzen.'
    note: 'Die Wahl zwischen *estar* und *tener* richtet sich nach der Wortart: Adjektive (*enfermo*, *resfriado*) stehen mit *estar*, Symptom-Nomen (*fiebre*, *dolor de cabeza*) mit *tener*.'
  es.a1.unit46.lesson04.teach.la_farmacia:
    title: Die Apotheke
    gloss: die Apotheke
    note: 'Ein feminines Nomen: *la farmacia*.'
    example_gloss: Ich gehe in die Apotheke.
  es.a1.unit46.lesson04.teach.en_que_puedo:
    title: Die Begrüßung in der Apotheke
    gloss: Wie kann ich Ihnen helfen?
    note: '*¿En qué puedo ayudarle?* ist eine übliche höfliche Servicefrage; *ayudarle* enthält das Objektpronomen *le* der Höflichkeitsform *usted*.'
  es.a1.unit46.lesson04.teach.tiene_algo_para:
    title: Nach etwas gegen ein Symptom fragen
    gloss: Haben Sie etwas gegen Kopfschmerzen?
    note: '*Algo para* + Symptom ist die natürliche Art, nach einem Mittel zu fragen: *algo para el dolor de cabeza*.'
  es.a1.unit46.lesson04.teach.una_pastilla:
    title: Eine Tablette
    gloss: eine Tablette
    note: 'Ein feminines Nomen: *la pastilla*; *una pastilla* ist eine Tablette.'
    example_gloss: Ich nehme eine Tablette.
  es.a1.unit46.lesson04.teach.toma_una_pastilla:
    title: Einnahmehinweis
    gloss: Nimm zweimal täglich eine Tablette.
    note: '*Toma* ist der Imperativ von *tomar* (nehmen) in der Du-Form und wird für Anweisungen verwendet.'
  es.a1.unit46.lesson04.teach.en_la_farmacia:
    title: Sprachebene in der Apotheke
    gloss: In der Apotheke verwendet man die Höflichkeitsform usted.
    note: 'Der Apotheker ist ein fremder Erwachsener in einer Dienstleistungsrolle, deshalb verwendet man *usted*: *¿Tiene algo...?* statt *¿Tienes algo...?*.'
  es.a1.unit46.lesson05.teach.consejo_toma_una:
    title: Einen Apothekenratschlag lesen
    gloss: 'Rat: Nimm zweimal täglich eine Tablette mit Wasser. Ruh dich gut aus und trink viel Wasser. Fühlst du dich nach drei Tagen immer noch nicht gut? Dann geh zum Arzt.'
    note: Achten Sie auf die Dosierung, die zwei Empfehlungen ohne Medikament und darauf, wann man zum Arzt gehen soll.
    glosses:
      Consejo: Rat
      toma: nimm
      veces: Mal
      día: Tag
      pastilla: Tablette
      Descansa: ruh dich aus
      bebe: trink
      sentirte: fühlen
      sigues: immer noch
      bien: gut
      médico: Arzt / Hausarzt
  es.a1.unit46.lesson06.teach.elena_hola_mateo:
    title: Elena fragt nach
    gloss: 'Elena: Hallo Mateo, wie geht''s dir? Fühlst du dich schon besser?'
    note: '*Ya* (schon, inzwischen) zeigt, dass Elena wissen möchte, ob es Mateo seit ihrem letzten Gespräch besser geht; *te sientes* ist die informelle *tú*-Form von *sentirse*.'
  es.a1.unit46.lesson06.teach.mateo_todavia_no:
    title: Mateo geht es noch nicht gut
    gloss: 'Mateo: Noch nicht so gut. Ich habe immer noch Kopfschmerzen und bin müde.'
    note: '*Sigo con* (ich habe immer noch) zeigt, dass die Kopfschmerzen nicht weg sind; *cansado* (müde) ist ein neues, nützliches Adjektiv, das sich dem Geschlecht anpasst (*cansada*).'
  es.a1.unit46.lesson06.teach.elena_has_tomado:
    title: Elena fragt nach der Medizin
    gloss: 'Elena: Hast du eine Tablette genommen?'
    note: '*Has tomado* ist das Perfekt: *has* + das Partizip *tomado*, nach demselben Muster wie *me has ayudado*.'
  es.a1.unit46.lesson06.teach.mateo_si_he:
    title: Mateo bestätigt
    gloss: 'Mateo: Ja, ich habe eine Tablette genommen. Jetzt werde ich mich ausruhen.'
    note: '*Voy a descansar* (ich werde mich ausruhen) verwendet das Muster der nahen Zukunft: *ir a* + Infinitiv.'
  es.a1.unit46.lesson06.teach.elena_buena_idea:
    title: Elena wünscht ihm gute Besserung
    gloss: 'Elena: Gute Idee. Ruh dich gut aus. Gute Besserung!'
    note: '*¡Que te mejores!* ist die übliche feste Wendung, um jemandem gute Besserung zu wünschen; sie verwendet den Subjuntivo *mejores*.'
  es.a1.unit46.lesson06.teach.mateo_gracias_hasta:
    title: Mateo verabschiedet sich
    gloss: 'Mateo: Danke, bis morgen!'
    note: '*Hasta mañana* folgt dem Muster *hasta* + Zeitangabe, wie die Abschiedsformel *hasta luego*.'
