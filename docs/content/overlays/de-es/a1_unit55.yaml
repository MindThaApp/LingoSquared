  es.a1.unit55.lesson05.teach.elena_viaja_en:
    title: Wer fährt wie?
    gloss: Elena fährt jeden Tag mit dem Zug zur Arbeit. Mateo fährt normalerweise mit dem Fahrrad, aber wenn es regnet, nimmt er auch den Zug. Diego fährt lieber mit dem Auto. Lucía wohnt in der Nähe und geht zu Fuß zur Arbeit. Und Sie, wie kommen Sie zur Arbeit?
    note: Stellt vier verschiedene Arten gegenüber, zur Arbeit zu kommen, sowie eine Bedingung (Regen).
    glosses:
      viaja: reist, fährt
      todos: jeden
      días: Tag
      tren: der Zug
      Trabajo: Arbeit
      bici: Fahrrad (va en bici = fährt mit dem Fahrrad)
      normalmente: normalerweise
      llueve: regnet
      va: nimmt
      conducir: fahren (conducir)
      prefiere: bevorzugt, zieht vor
      coche: das Auto
      vive: wohnt
      cerca: in der Nähe
      camina: geht zu Fuß
      viajas: reist, fährst
