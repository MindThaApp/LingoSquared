teaching:
  es.a1.unit12.lesson01.teach.nervioso:
    title: Nervös
    gloss: nervös
    note: '*Nervioso* (maskulin) / *nerviosa* (feminin) – ein regelmäßiges Adjektivpaar auf -o/-a.'
    example_gloss:
    - Mateo ist nervös.
    - Elena ist nervös.
  es.a1.unit12.lesson01.teach.contento:
    title: Glücklich
    gloss: glücklich / zufrieden
    note: '*Contento/contenta* beschreibt, dass man sich glücklich oder zufrieden fühlt, nicht eine dauerhafte Eigenschaft.'
    example_gloss:
    - Mateo ist glücklich.
    - Elena ist glücklich.
  es.a1.unit12.lesson01.teach.cansado:
    title: Müde
    gloss: müde
    note: '*Cansado/cansada*, von *cansar* (müde machen).'
    example_gloss:
    - Nach dem Workshop bin ich müde. (männlich)
    - Nach dem Workshop bin ich müde. (weiblich)
  es.a1.unit12.lesson01.teach.preocupado:
    title: Besorgt
    gloss: besorgt
    note: '*Preocupado/preocupada*, von *preocupar* (Sorgen machen).'
    example_gloss:
    - Mateo ist besorgt.
    - Elena ist besorgt.
  es.a1.unit12.lesson01.teach.orgulloso:
    title: Stolz
    gloss: stolz
    note: '*Orgulloso/orgullosa* – bei *estoy orgulloso/a de...* (ich bin stolz auf ...) steht vor dem, worauf man stolz ist, die Präposition *de*.'
    example_gloss:
    - Ich bin stolz auf dich. (männlich)
    - Ich bin stolz auf dich. (weiblich)
  es.a1.unit12.lesson02.teach.estoy_nervioso:
    title: Ich bin nervös (männlich)
    gloss: Ich bin nervös.
    note: '*Estoy* (ich bin, von *estar*) + die maskuline Form des Adjektivs.'
  es.a1.unit12.lesson02.teach.estoy_nerviosa:
    title: Ich bin nervös (weiblich)
    gloss: Ich bin nervös.
    note: Dieselbe Konstruktion mit der femininen Form des Adjektivs.
  es.a1.unit12.lesson02.teach.estoy_contento:
    title: Ich bin glücklich (männlich)
    gloss: Ich bin glücklich.
    note: '*Estoy contento* – dasselbe Muster aus *estar* + Adjektiv.'
  es.a1.unit12.lesson02.teach.estar_vs_ser_note:
    title: Estar oder ser bei Gefühlen
    gloss: Warum Gefühle normalerweise mit estar statt mit ser stehen.
    note: Siehe den Text der Karte.
    target_text: '*Estar* + Adjektiv beschreibt einen vorübergehenden Zustand oder ein Gefühl (estoy nervioso – ich bin [gerade] nervös); *ser* + Adjektiv dagegen drückt eine dauerhafte Eigenschaft aus. Gefühle stehen normalerweise mit *estar*.'
  es.a1.unit12.lesson03.teach.como_te_sientes:
    title: Fragen, wie es jemandem geht
    gloss: Wie fühlst du dich?
    note: '*¿Cómo te sientes?* verwendet *sentirse* (sich fühlen), ein reflexives Verb, und unterscheidet sich von *estar* + Adjektiv.'
  es.a1.unit12.lesson03.teach.me_siento_nervioso_pero_contento:
    title: Ein gemischtes Gefühl beschreiben
    gloss: Ich fühle mich ein bisschen nervös, aber glücklich.
    note: '*Me siento* (ich fühle mich) + Adjektiv, wobei *pero* (aber) zwei Gefühle gleichzeitig gegenüberstellt – die natürliche Antwort auf *¿Cómo te sientes?*.'
  es.a1.unit12.lesson04.teach.algo_se_quema:
    title: Etwas brennt an
    gloss: Es brennt etwas an!
    note: '*Se quema* ist die reflexive Form von *quemar* (verbrennen) – wörtlich „es verbrennt sich“. So sagt man natürlich, dass etwas anbrennt, ohne zu nennen, wer es verursacht.'
  es.a1.unit12.lesson04.teach.estoy_preocupado:
    title: Ich bin besorgt (männlich)
    gloss: Ich bin besorgt.
    note: '*Preocupado* im Muster *estoy* + Adjektiv.'
  es.a1.unit12.lesson04.teach.no_te_preocupes:
    title: Mach dir keine Sorgen
    gloss: Mach dir keine Sorgen.
    note: Siehe die folgende Grammatikkarte.
  es.a1.unit12.lesson04.teach.podemos_empezar_de_nuevo:
    title: Vorschlagen, von vorn anzufangen
    gloss: Wir können noch einmal von vorn anfangen.
    note: '*Podemos* (wir können) + Infinitiv; *de nuevo* (noch einmal/von neuem) ist eine gängige Wendung, wenn man etwas wiederholt.'
  es.a1.unit12.lesson04.teach.no_te_preocupes_note:
    title: No te preocupes
    gloss: Das Muster des verneinten Imperativs hinter „Mach dir keine Sorgen“.
    note: Siehe den Text der Karte.
    target_text: '*No te preocupes* (mach dir keine Sorgen) ist ein verneinter Imperativ in der du-Form, gebildet aus *no* + Reflexivpronomen (*te*) + Verb.'
  es.a1.unit12.lesson05.teach.reflexion_reading:
    title: Ein Rückblick auf den Kurs
    gloss: Vor dem Kurs waren Elena und Mateo ein bisschen nervös. Während des Kurses brannte etwas an, und die beiden waren besorgt. Aber sie fingen noch einmal von vorn an, und am Ende wurde der Kuchen perfekt. Jetzt sind die beiden sehr stolz und glücklich.
    note: '*Estaban* (sie waren) beschreibt, wie sie sich damals fühlten; *están* (sie sind) beschreibt, wie sie sich jetzt fühlen.'
    glosses:
      Antes: vor
      clase: Kurs
      estaban: waren (von estar)
      poco: ein bisschen
      nerviosos: nervös
      Durante: während
      algo: etwas
      quemó: brannte an (von quemarse)
      dos: beide
      preocupados: besorgt
      Pero: aber
      empezaron: fingen an (von empezar)
      nuevo: noch einmal / von neuem
      final: Ende
      pastel: Kuchen
      salió: wurde / geriet (von salir)
      perfecto: perfekt
      Ahora: jetzt
      están: sind (von estar)
      orgullosos: stolz
      contentos: glücklich
  es.a1.unit12.lesson05.teach.plural_adjective_note:
    title: Übereinstimmung der Adjektive im Plural
    gloss: Warum eine gemischte Gruppe maskuline Pluraladjektive bekommt.
    note: Siehe den Text der Karte.
    target_text: Wenn man Elena und Mateo zusammen beschreibt, steht das Adjektiv in der maskulinen Pluralform (nerviosos, preocupados, orgullosos, contentos). Das ist die spanische Standardregel, wenn eine Gruppe mindestens ein männliches Mitglied enthält.
  es.a1.unit12.lesson06.teach.line01:
    title: Fragen, wie es Mateo geht
    gloss: Elena fragt Mateo, wie er sich vor dem Unterricht fühlt.
    note: '*¿Cómo te sientes?* fragt, wie sich jemand fühlt.'
  es.a1.unit12.lesson06.teach.line02:
    title: Mit gemischten Gefühlen antworten
    gloss: Mateo sagt, dass er sich ein bisschen nervös, aber froh fühlt.
    note: Mateo verwendet die maskulinen Formen *nervioso* und *contento*.
  es.a1.unit12.lesson06.teach.line03:
    title: Auf das Missgeschick reagieren
    gloss: Elena stimmt zu und bemerkt dann, dass etwas anbrennt.
    note: '*¡Ay, no!* (oje, nein!) ist ein gängiger Ausruf bei Schreck.'
  es.a1.unit12.lesson06.teach.line04:
    title: Sorge ausdrücken
    gloss: Mateo sagt, dass er besorgt ist, und fragt, was sie tun sollen.
    note: '*¿Qué hacemos?* (was machen wir?) ist eine praktische Frage.'
  es.a1.unit12.lesson06.teach.line05:
    title: Beruhigen und eine Lösung vorschlagen
    gloss: Elena sagt ihm, er solle sich keine Sorgen machen – sie können von vorn anfangen.
    note: Verbindet *no te preocupes* und *podemos empezar de nuevo*.
  es.a1.unit12.lesson06.teach.line06:
    title: Zustimmen und es noch einmal versuchen
    gloss: Mateo stimmt zu und schlägt vor, es noch einmal zu versuchen.
    note: '*Vamos a intentarlo otra vez* (versuchen wir es noch einmal) verwendet wieder die Konstruktion *vamos a* + Infinitiv aus früheren Lektionen, jetzt mit dem Objektpronomen *lo*.'
  es.a1.unit12.lesson06.teach.line07:
    title: Den Erfolg verkünden
    gloss: Elena verkündet, dass der Kuchen jetzt perfekt ist.
    note: '*¡Mira!* (schau!) ist ein Ausruf, um Aufmerksamkeit zu wecken; *el pastel* (der Kuchen) ist das Gericht, um das sich das Missgeschick dreht.'
  es.a1.unit12.lesson06.teach.line08:
    title: Feiern und Stolz ausdrücken
    gloss: Mateo freut sich und sagt, dass er stolz auf sie beide ist.
    note: '*¡Qué bien!* (wie schön!) folgt dem Ausrufemuster *¡Qué...!*, wie *¡Qué calor!*; *de nosotros* (auf uns) erweitert *estoy orgulloso de ti* auf eine Gruppe.'
  es.a1.unit12.lesson06.teach.line09:
    title: Den Stolz teilen
    gloss: Elena stimmt zu, dass auch sie stolz ist – sie haben es gemeinsam geschafft.
    note: '*Lo logramos juntos* (wir haben es gemeinsam geschafft) ist ein natürlicher Schlusssatz und enthält zum ersten Mal *lograr* (erreichen, schaffen).'
