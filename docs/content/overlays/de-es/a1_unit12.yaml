course:
  title: Spanisch A1
  description: 'Grundlegende Gefühle ausdrücken: Die Geschichte von Elena und Mateo geht weiter mit dem Workshop-Kurs am 22. Juli – Nervosität vor dem Kurs, ein Missgeschick beim Kochen und Stolz, als das Gericht gerettet ist.'
