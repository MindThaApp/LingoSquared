  es.a1.unit02.lesson05.recipe_quantities:
    title: Mengenangaben in Rezepten
  es.a1.unit02.lesson06.recipe_count_dialogue:
    title: Mit Elena und Mateo Zutaten zählen
teaching:
  es.a1.unit02.lesson01.teach.cero:
    title: 'Null'
    gloss: 'null'
    note: '*Cero* wird sowohl als eigenständige Zahl als auch als Ziffer verwendet, wenn man eine Ziffernfolge laut vorliest.'
  es.a1.unit02.lesson01.teach.uno:
    title: Eins
    gloss: eins
    note: '*Uno* wird vor einem maskulinen Substantiv im Singular zu *un* verkürzt (*un huevo*, ein Ei) und wird vor einem femininen zu *una* (*una taza*, eine Tasse). Allein, etwa beim Zählen, bleibt es *uno*.'
  es.a1.unit02.lesson01.teach.dos:
    title: Zwei
    gloss: zwei
    note: '*Dos* verändert seine Form unabhängig vom grammatischen Geschlecht des Substantivs nie.'
  es.a1.unit02.lesson01.teach.tres:
    title: Drei
    gloss: drei
    note: '*Tres* ist wie *dos* unveränderlich.'
  es.a1.unit02.lesson01.teach.cuatro:
    title: Vier
    gloss: vier
    note: '*Cuatro* ist unveränderlich.'
  es.a1.unit02.lesson01.teach.cinco:
    title: Fünf
    gloss: fünf
    note: '*Cinco* ist unveränderlich.'
  es.a1.unit02.lesson01.teach.seis:
    title: Sechs
    gloss: sechs
    note: '*Seis* ist unveränderlich.'
  es.a1.unit02.lesson01.teach.siete:
    title: Sieben
    gloss: sieben
    note: '*Siete* ist unveränderlich.'
  es.a1.unit02.lesson01.teach.ocho:
    title: Acht
    gloss: acht
    note: '*Ocho* ist unveränderlich.'
  es.a1.unit02.lesson01.teach.nueve:
    title: Neun
    gloss: neun
    note: '*Nueve* ist unveränderlich.'
  es.a1.unit02.lesson01.teach.diez:
    title: Zehn
    gloss: zehn
    note: '*Diez* ist unveränderlich.'
  es.a1.unit02.lesson02.teach.once:
    title: Elf
    gloss: elf
    note: '*Once* bis *quince* (11–15) sind jeweils einzelne Wörter, die man als Gruppe lernen kann; von sechzehn bis neunzehn werden die Zahlen aus *diez* gebildet (*dieciséis*, *diecisiete* …).'
  es.a1.unit02.lesson02.teach.doce:
    title: Zwölf
    gloss: zwölf
    note: '*Doce* ist ein eigenständiges Wort; es ähnelt *dos*, wird aber als eigene Form geschrieben.'
  es.a1.unit02.lesson02.teach.trece:
    title: Dreizehn
    gloss: dreizehn
    note: '*Trece* ist ein eigenständiges Wort; es ähnelt *tres*, wird aber als eigene Form geschrieben.'
  es.a1.unit02.lesson02.teach.catorce:
    title: Vierzehn
    gloss: vierzehn
    note: '*Catorce* ist ein eigenständiges Wort; es ähnelt *cuatro*, wird aber als eigene Form geschrieben.'
  es.a1.unit02.lesson02.teach.quince:
    title: Fünfzehn
    gloss: fünfzehn
    note: '*Quince* ist die letzte der zusammengeschriebenen Zahlen von elf bis fünfzehn, bevor sich das Muster bei sechzehn ändert.'
  es.a1.unit02.lesson02.teach.veinte:
    title: Zwanzig
    gloss: zwanzig
    note: '*Veinte* ist ein eigenständiges Wort. Ab *veintiuno* (21) werden Zehner und Einer bis einschließlich neunundzwanzig zu einem Wort verbunden. Dieses Muster begegnet Ihnen in Lektion 03 bei *veintiocho* erneut.'
  es.a1.unit02.lesson02.teach.treinta:
    title: Dreißig
    gloss: dreißig
    note: Ab dreißig werden Zehner und Einer anders als bei den Zwanzigerzahlen mit *y* (und) zu drei getrennten Wörtern verbunden.
  es.a1.unit02.lesson02.teach.treinta_y_cuatro:
    title: Vierunddreißig
    gloss: vierunddreißig
    note: '*Treinta y cuatro* wird als drei getrennte Wörter geschrieben: der Zehner, *y* und der Einer.'
  es.a1.unit02.lesson02.teach.cien:
    title: Einhundert
    gloss: einhundert
    note: '*Cien* verwendet man allein für genau 100; wird die Zahl fortgesetzt, steht stattdessen *ciento* (*ciento uno*, 101). Das wird in dieser Einheit noch nicht behandelt.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tienes:
    title: Informell nach dem Alter fragen
    gloss: Wie alt bist du?
    note: Im Spanischen fragt man wörtlich, wie viele Jahre jemand hat, und verwendet dafür *tener* (haben), nicht *ser* oder *estar*. Im Deutschen sagt man dagegen, wie alt jemand ist.
  es.a1.unit02.lesson03.teach.tengo_veintiocho:
    title: Das Alter angeben
    gloss: Ich bin achtundzwanzig.
    note: '*Tengo* ist die yo-Form von *tener*. Eine vollständige Antwort enthält normalerweise *años* (Jahre); wenn das Alter bereits Thema ist, kann es entfallen, wie in *Tengo treinta y uno*.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tiene_usted:
    title: Formell nach dem Alter fragen
    gloss: Wie alt bist du?
    note: '*Tiene* ist die *usted*-Form von *tener* und entspricht der in Einheit 1 eingeführten formellen Anrede.'
  es.a1.unit02.lesson03.teach.tengo_treinta_y_uno:
    title: Ein zusammengesetztes Alter angeben
    gloss: Ich bin einunddreißig.
    note: '*Treinta y uno* behält hier *uno* (nicht *un*), weil in dieser Antwort kein Substantiv direkt darauf folgt.'
  es.a1.unit02.lesson03.teach.y_tu_cuantos:
    title: Die Frage nach dem Alter zurückgeben
    gloss: Und du, wie alt bist du?
    note: Sobald das Thema bereits klar ist, kann man ganz natürlich nur *Tienes* sagen, ohne *años* zu wiederholen.
  es.a1.unit02.lesson04.teach.cual_es_tu_numero:
    title: Nach einer Telefonnummer fragen
    gloss: Wie lautet deine Telefonnummer?
    note: '*Cuál* ist hier natürlicher als *qué*, da nach einer bestimmten Angabe aus mehreren Möglichkeiten gefragt wird, etwa nach einer Telefonnummer.'
  es.a1.unit02.lesson04.teach.numero_elena:
    title: Eine Ziffernfolge einzeln vorlesen
    gloss: Sechs, eins, fünf, null, zwei, neun, sieben, drei
    note: Eine Telefonnummer kann wie hier Ziffer für Ziffer vorgelesen werden. Viele Spanischsprachige fassen die Ziffern auch paarweise zusammen; achten Sie daher auf beide Varianten.
  es.a1.unit02.lesson04.teach.es_el:
    title: Die Nummer einleiten
    gloss: Sie lautet …
    note: '*El* (der männliche bestimmte Artikel) wird verwendet, weil *número* ein männliches Substantiv ist.'
  es.a1.unit02.lesson04.teach.puedes_repetir:
    title: Um Wiederholung bitten
    gloss: Kannst du das bitte wiederholen?
    note: '*Puedes* ist die *tú*-Form von *poder* (können). Sie ist nützlich, wenn eine gesprochene Zahl zu schnell war, um sie zu verstehen.'
  es.a1.unit02.lesson04.teach.claro:
    title: Bereitwillig zustimmen
    gloss: Klar; natürlich
    note: '*Claro* ist eine gebräuchliche, freundliche Art, einer Bitte zuzustimmen.'
  es.a1.unit02.lesson05.teach.necesito_tres_huevos:
    title: Eine benötigte Menge angeben
    gloss: Ich brauche drei Eier.
    note: '*Necesito* ist die yo-Form von *necesitar* (brauchen). *Huevos* (Eier) steht nach jeder Zahl über eins im Plural.'
  es.a1.unit02.lesson05.teach.cuantos_huevos_necesitas:
    title: Nach der benötigten Anzahl fragen
    gloss: Wie viele Eier brauchst du?
    note: '*Cuántos* richtet sich in Geschlecht und Zahl nach dem Substantiv, auf das es sich bezieht. *Huevos* ist männlich und steht im Plural, daher heißt es *cuántos* und nicht *cuántas*.'
  es.a1.unit02.lesson05.teach.dos_tazas_harina:
    title: Eine abgemessene Menge angeben
    gloss: Zwei Tassen Mehl
    note: '*De* verbindet die Maßeinheit (*tazas*, Tassen) mit dem Gemessenen (*harina*, Mehl). Im Deutschen steht diese Verbindung meist ohne ein entsprechendes Wort: „zwei Tassen Mehl“.'
  es.a1.unit02.lesson05.teach.media_taza:
    title: Eine halbe Menge angeben
    gloss: Eine halbe Tasse Zucker
    note: '*Media* richtet sich nach dem weiblichen Substantiv *taza*. Bei männlichen Substantiven steht stattdessen die männliche Form *medio*.'
  es.a1.unit02.lesson05.teach.tengo_cuatro_huevos:
    title: Angeben, was vorhanden ist
    gloss: Ich habe vier Eier auf dem Tisch.
    note: '*Tengo* (ich habe) bezeichnet, was bereits vorhanden ist. Im Unterschied dazu gibt *necesito* (ich brauche) an, was noch fehlt.'
  es.a1.unit02.lesson06.teach.line01:
    title: Nach der Anzahl der Eier fragen
    gloss: Elena fragt Mateo, wie viele Eier er für das Rezept braucht.
    note: Die beiden Gleichaltrigen sprechen sich wie in Einheit 1 weiterhin mit der *tú*-Form an.
  es.a1.unit02.lesson06.teach.line02:
    title: Die Zutaten nennen
    gloss: Mateo sagt, dass er drei Eier und zwei Tassen Mehl braucht.
    note: '*Necesito* bezeichnet, was für das Rezept noch gebraucht wird.'
  es.a1.unit02.lesson06.teach.line03:
    title: Vorhandene Zutaten anbieten
    gloss: Elena sagt, dass sie vier Eier auf dem Tisch hat, und fragt, ob er auch Zucker braucht.
    note: '*Tengo* bezeichnet, was Elena bereits hat, unabhängig davon, was Mateo nach eigener Aussage braucht.'
  es.a1.unit02.lesson06.teach.line04:
    title: Eine kleine Menge bestätigen
    gloss: Mateo sagt, dass er ein wenig braucht – etwa eine halbe Tasse.
    note: '*Como* bedeutet hier „etwa“ oder „ungefähr“ und nicht wie sonst häufig „wie“ oder „als“.'
  es.a1.unit02.lesson06.teach.line05:
    title: Nach einer Telefonnummer fragen
    gloss: Elena sagt „prima“ und fragt Mateo dann nach seiner Telefonnummer, damit sie ihm wegen des nächsten Kurses schreiben kann.
    note: '*Así te escribo* („damit ich dir schreiben kann“) erklärt den Grund für ihre Frage. Vor der Bitte um Kontaktdaten ist das im Gespräch ganz natürlich.'
  es.a1.unit02.lesson06.teach.line06:
    title: Die Telefonnummer nennen
    gloss: Mateo liest seine Nummer Ziffer für Ziffer vor.
    note: '*Es el* leitet die Nummer ein und richtet sich nach dem männlichen Substantiv *número*.'
  es.a1.unit02.lesson06.teach.line07:
    title: Sich bedanken und nach dem Alter fragen
    gloss: 'Elena bedankt sich bei ihm und stellt dann noch eine Frage: wie alt er ist.'
    note: '*Una pregunta más* („noch eine Frage“) kennzeichnet einen natürlichen Themenwechsel innerhalb desselben Gesprächs.'
  es.a1.unit02.lesson06.teach.line08:
    title: Sein Alter angeben
    gloss: Mateo sagt, dass er achtundzwanzig ist, und stellt Elena dieselbe Frage.
    note: '*Tengo veintiocho años* verwendet die zusammengeschriebene Form für die Zahlen in den Zwanzigern, wie schon in Lektion 02.'
  es.a1.unit02.lesson06.teach.line09:
    title: Ihr Alter angeben
    gloss: Elena sagt, dass sie einunddreißig ist.
    note: In *Tengo treinta y uno* wird *años* weggelassen, weil aus dem Zusammenhang bereits klar ist, dass es um das Alter geht. Diese natürliche Verkürzung entspricht dem Muster aus Lektion 03, bei dem auch die Gegenfrage ohne erneutes *años* gestellt wird.
