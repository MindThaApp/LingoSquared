course:
  title: Spanisch A1
  description: Zahlen von 0 bis 100, Altersangaben, Telefonnummern und Mengenangaben in Rezepten – als Fortsetzung der Geschichte von Elena und Mateo aus Einheit 01 im Kochkurs. Besondere Hinweise erklären Altersangaben mit tener und die Übereinstimmung des grammatischen Geschlechts in Mengenangaben.
