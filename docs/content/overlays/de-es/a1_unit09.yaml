  es.a1.unit09.lesson01.la_calle_y_la_esquina:
    title: Die Straße und die Ecke
  es.a1.unit09.lesson02.verbos_de_movimiento:
    title: Geradeaus gehen, abbiegen, überqueren
  es.a1.unit09.lesson03.como_llego_a:
    title: Wie komme ich zu ...?
  es.a1.unit09.lesson04.confirmar_direcciones:
    title: Eine Wegbeschreibung bestätigen
  es.a1.unit09.lesson05.leer_las_direcciones:
    title: Schriftliche Wegbeschreibungen lesen
  es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue:
    title: Elena erklärt Mateo den Weg
teaching:
  es.a1.unit09.lesson01.teach.la_calle:
    title: Die Straße
    gloss: die Straße
    note: '*Calle* ist feminin.'
    example_gloss: Ich wohne in dieser Straße.
  es.a1.unit09.lesson01.teach.la_esquina:
    title: Die Ecke
    gloss: Ecke
    note: '*Esquina* ist feminin.'
    example_gloss: Die Bank ist an der Ecke.
  es.a1.unit09.lesson02.teach.seguir_derecho:
    title: Geradeaus gehen
    gloss: Gehen Sie geradeaus.
    note: '*Sigue* ist die informelle Befehlsform von *seguir* (folgen/weitergehen), die in den Wegbeschreibungen dieser Einheit immer wieder verwendet wird.'
  es.a1.unit09.lesson02.teach.doblar_izquierda:
    title: Links abbiegen
    gloss: Biegen Sie links ab.
    note: '*Dobla* ist die informelle Befehlsform von *doblar* (abbiegen/falten). Beachten Sie den folgenden Grammatikhinweis zu *doblar* und *girar*.'
  es.a1.unit09.lesson02.teach.girar_derecha:
    title: Rechts abbiegen
    gloss: Biegen Sie rechts ab.
    note: '*Gira* ist die informelle Befehlsform von *girar* (abbiegen/drehen) und kann hier ohne Bedeutungsunterschied durch *doblar* ersetzt werden.'
  es.a1.unit09.lesson02.teach.cruzar_la_calle:
    title: Die Straße überqueren
    gloss: Überqueren Sie die Straße.
    note: '*Cruza* ist die informelle Befehlsform von *cruzar* (überqueren).'
  es.a1.unit09.lesson02.teach.doblar_vs_girar_note:
    title: Doblar oder girar
    gloss: Zwei gleichermaßen natürliche Wörter für „abbiegen“.
    note: Lesen Sie den Text auf der Karte.
    target_text: '*Doblar* und *girar* bedeuten beide „abbiegen“ und sind hier vollständig austauschbar – die Wahl hängt von der Region ab, nicht vom Sprachstil oder von der Bedeutung. Beide werden in dieser Einheit verwendet.'
  es.a1.unit09.lesson03.teach.como_llego_a_la_biblioteca:
    title: Nach dem Weg fragen
    gloss: Wie komme ich zur Bibliothek?
    note: '*Cómo llego a* (wie komme ich zu/nach) ist die übliche Formulierung, um nach dem Weg zu einem bestimmten Ort zu fragen.'
  es.a1.unit09.lesson03.teach.es_facil:
    title: Sagen, dass es einfach ist
    gloss: Es ist ganz einfach.
    note: Eine geläufige, beruhigende Wendung, die man vor einer Wegbeschreibung verwendet.
  es.a1.unit09.lesson03.teach.sigue_derecho_por_esta_calle:
    title: Diese Straße geradeaus gehen
    gloss: Geh diese Straße geradeaus.
    note: '*Por esta calle* (diese Straße entlang) gibt an, welcher Straße man folgen soll.'
  es.a1.unit09.lesson03.teach.dobla_a_la_izquierda_en_la_esquina:
    title: An der Ecke links abbiegen
    gloss: Bieg an der Ecke links ab.
    note: '*En la esquina* (an der Ecke) gibt an, wo man abbiegt.'
  es.a1.unit09.lesson04.teach.esta_bien_asi:
    title: Um Bestätigung bitten
    gloss: Ist das so richtig?
    note: Mit *¿Está bien así?* (ist das so richtig?) vergewissert man sich, ob man alles verstanden hat, nachdem man die Wegbeschreibung wiederholt hat.
  es.a1.unit09.lesson04.teach.si_asi_es:
    title: Bestätigen
    gloss: Ja, das ist richtig.
    note: '*Así es* (genau so ist es) ist eine natürliche, knappe Bestätigung.'
  es.a1.unit09.lesson04.teach.no_te_pierdas:
    title: Verlauf dich nicht
    gloss: Verlaufen Sie sich nicht!
    note: '*No te pierdas* ist die informelle negative Befehlsform von *perderse* (sich verlaufen) und eine herzliche, ungezwungene Verabschiedung.'
  es.a1.unit09.lesson05.teach.direcciones_reading:
    title: Schriftliche Wegbeschreibungen lesen
    gloss: 'So kommst du vom Markt zur Bibliothek: Geh diese Straße geradeaus. Bieg an der Ecke links ab. Überquere dann die Straße. Die Bibliothek befindet sich auf der rechten Seite.'
    note: 'In schriftlichen Wegbeschreibungen werden die Schritte der Reihe nach aufgeführt: *Para llegar a...* (um zu … zu gelangen) nennt das Ziel. Danach folgt jeder Schritt als Befehl in der *tú*-Form (*sigue*, *dobla*, *cruza*), und *después* (danach) verbindet die Schritte.'
    glosses:
      llegar: ankommen / gelangen
      biblioteca: Bibliothek
      desde: von / ab
      mercado: Markt
      sigue: weitergehen / gehen (von seguir)
      derecho: geradeaus
      calle: Straße
      Dobla: abbiegen (von doblar)
      izquierda: links
      esquina: Ecke
      Después: danach / anschließend
      cruza: überqueren (von cruzar)
      está: sich befinden (von estar)
      derecha: rechts
  es.a1.unit09.lesson05.teach.desde_note:
    title: Desde (von)
    gloss: Wie desde den Ausgangspunkt eines Weges kennzeichnet.
    note: Lesen Sie den Text auf der Karte.
    target_text: '*Desde* (von) kennzeichnet den Ausgangspunkt eines Weges und wird mit *a* (zu) für das Ziel kombiniert: *desde el mercado* ... *a la biblioteca*.'
  es.a1.unit09.lesson06.teach.line01:
    title: Nach dem Weg fragen
    gloss: Mateo fragt Elena, wie er vom Markt zur Bibliothek kommt.
    note: 'Hier wird dieselbe Frage mit *¿Cómo llego a...?* wie zuvor in dieser Einheit verwendet, nun ergänzt um den Ausgangspunkt: *desde el mercado* (vom Markt).'
  es.a1.unit09.lesson06.teach.line02:
    title: Den ersten Schritt erklären
    gloss: Elena sagt, dass es einfach ist, und erklärt den ersten Schritt.
    note: '*Es fácil* (es ist ganz einfach) beruhigt die andere Person, bevor der erste Schritt erklärt wird.'
  es.a1.unit09.lesson06.teach.line03:
    title: Wiederholen und nach dem nächsten Schritt fragen
    gloss: Mateo wiederholt die Anweisung und fragt, was als Nächstes kommt.
    note: '*Sigo derecho* (ich gehe geradeaus) ist die erste Person Singular von *seguir*. Damit bestätigt Mateo beim Zuhören aktiv den Weg.'
  es.a1.unit09.lesson06.teach.line04:
    title: Den zweiten Schritt erklären
    gloss: Elena sagt ihm, dass er an der Ecke links abbiegen soll.
    note: '*Dobla* (bieg ab) – *gira* hätte hier dieselbe Bedeutung.'
  es.a1.unit09.lesson06.teach.line05:
    title: Wiederholen und sich vergewissern
    gloss: Mateo wiederholt die Abbiegeanweisung und fragt, ob das so richtig ist.
    note: '*Doblo* (ich biege ab) entspricht seinem vorherigen *Sigo derecho*: Mateo wiederholt jeden Schritt in der *yo*-Form, um sich zu vergewissern.'
  es.a1.unit09.lesson06.teach.line06:
    title: Bestätigen und die letzten Schritte erklären
    gloss: Elena bestätigt es und sagt ihm dann, dass er die Straße überqueren soll – die Bibliothek befindet sich auf der rechten Seite.
    note: '*Sí, así es* (ja, genau) bestätigt die Aussage. Danach leitet *después* (danach) die letzten Schritte des Weges ein.'
  es.a1.unit09.lesson06.teach.line07:
    title: Elena danken
    gloss: Mateo bedankt sich herzlich bei Elena.
    note: '*Muchas gracias* (vielen Dank) klingt herzlicher als das einfache *gracias*.'
  es.a1.unit09.lesson06.teach.line08:
    title: Antworten und sich verabschieden
    gloss: Elena sagt „gern geschehen“ und wünscht ihm, dass er sich nicht verläuft.
    note: '*De nada* (gern geschehen) ist die übliche Antwort auf *gracias*.'
