    example_gloss: Heute ist es sehr sonnig.
  es.a1.unit10.lesson01.teach.la_lluvia:
    title: Der Regen
    gloss: der Regen
    note: '*Lluvia* ist weiblich.'
    example_gloss: Ich mag den Regen nicht.
  es.a1.unit10.lesson01.teach.el_viento:
    title: Der Wind
    gloss: der Wind
    note: '*Viento* ist männlich.'
    example_gloss: Heute ist es sehr windig.
  es.a1.unit10.lesson01.teach.la_nube:
    title: Die Wolke
    gloss: die Wolke
    note: '*Nube* ist weiblich.'
    example_gloss: Es gibt keine einzige Wolke.
  es.a1.unit10.lesson02.teach.hace_calor:
    title: Es ist heiß
    gloss: Es ist heiß.
    note: '*Hace calor* (wörtlich „es macht Hitze“) ist die übliche Wendung, um heißes Wetter zu beschreiben.'
    example_gloss: Im Juli ist es sehr heiß.
  es.a1.unit10.lesson02.teach.hace_frio:
    title: Es ist kalt
    gloss: Es ist kalt.
    note: '*Hace frío* folgt demselben Muster aus *hace* + Substantiv wie *hace calor*.'
    example_gloss: Im Dezember ist es kalt.
  es.a1.unit10.lesson02.teach.hace_sol:
    title: Es ist sonnig
    gloss: Es ist sonnig.
    note: '*Hace sol* verwendet *el sol* (die Sonne) im gleichen festen Ausdrucksmuster.'
  es.a1.unit10.lesson02.teach.llueve:
    title: Es regnet
    gloss: Es regnet.
    note: '*Llueve* ist eine eigene Verbform (von *llover*, regnen) und folgt nicht dem Muster mit *hace* – siehe die folgende Grammatikkarte.'
  es.a1.unit10.lesson02.teach.esta_nublado:
    title: Es ist bewölkt
    gloss: Es ist bewölkt.
    note: '*Está nublado* verwendet *estar* + Adjektiv, ein drittes, eigenes Muster für das Wetter.'
  es.a1.unit10.lesson02.teach.hace_vs_esta_note:
    title: 'Hace, llueve, está: drei Muster'
    gloss: Drei verschiedene grammatische Muster, um das Wetter zu beschreiben.
    note: Siehe den Text der Karte.
    target_text: 'Wetterausdrücke mit *hace* (hace calor, hace frío, hace sol) sind feste Wendungen und bedeuten wörtlich „es macht Hitze/Kälte/Sonne“. *Llueve* (es regnet) ist eine eigene Verbform und *está nublado* (es ist bewölkt) verwendet *estar* + Adjektiv – drei verschiedene Muster für denselben Zweck: das Wetter zu beschreiben.'
  es.a1.unit10.lesson03.teach.que_tiempo_hace_hoy:
    title: Nach dem Wetter fragen
    gloss: Wie ist das Wetter heute?
    note: '*¿Qué tiempo hace hoy?* ist die übliche Frage nach dem aktuellen Wetter; sie verwendet *el tiempo* (das Wetter).'
  es.a1.unit10.lesson03.teach.hace_mucho_calor_y_sol:
    title: Heißes, sonniges Wetter beschreiben
    gloss: Es ist sehr heiß und sonnig.
    note: Verbindet zwei Ausdrücke mit *hace* durch *y* (und).
  es.a1.unit10.lesson03.teach.hace_calor_pero_hay_viento:
    title: Heißes, windiges Wetter beschreiben
    gloss: Es ist heiß, aber es ist windig.
    note: '*Pero* (aber) stellt zwei Wetterangaben gegenüber – Hitze und Wind, mit *hay* + Nomen wie in *hay mucho viento*.'
  es.a1.unit10.lesson04.teach.en_invierno_hace_frio_en_madrid:
    title: Über den Winter in Madrid sprechen
    gloss: Im Winter ist es in Madrid sehr kalt.
    note: '*En invierno* (im Winter) führt eine Jahreszeit ein, im Kontrast zu *en julio* weiter unten.'
  es.a1.unit10.lesson04.teach.en_julio_hace_demasiado_calor:
    title: Über die Hitze im Juli sprechen
    gloss: Im Juli ist es zu heiß.
    note: '*Demasiado* (zu viel) steigert *calor* über das einfache *mucho* (viel) hinaus.'
  es.a1.unit10.lesson04.teach.necesitamos_agua:
    title: Begründen, warum man Wasser braucht
    gloss: Wir brauchen Wasser, weil es heiß ist.
    note: '*Porque* (weil) verbindet ein Bedürfnis mit seinem Wettergrund – ein praktischer Satz für den Kochworkshop.'
  es.a1.unit10.lesson05.teach.pronostico_reading:
    title: Einen Wetterbericht lesen
    gloss: Heute, am 22. Juli, ist es sehr heiß und sonnig. Es ist keine einzige Wolke zu sehen. Außerdem gibt es ein wenig Wind. Es ist ein guter Tag für den Kochworkshop, aber es ist wichtig, Wasser mitzunehmen.
    note: Ein kurzer Wetterbericht für den 22. Juli, den Tag des Kochkurses.
    glosses:
      Hoy: heute
      veintidós: zweiundzwanzigste
      julio: Juli
      hace: es ist / das Wetter ist (von hacer)
      calor: Hitze
      sol: sonnig / Sonne
      hay: es gibt (von haber)
      nube: Wolke
      También: auch
      poco: wenig
      viento: Wind
      buen: gut
      día: Tag
      ir: gehen
      taller: Workshop
      cocina: Küche / Kochen
      importante: wichtig
      llevar: mitnehmen / tragen
      agua: Wasser
  es.a1.unit10.lesson05.teach.un_poco_de_note:
    title: Un poco de (ein bisschen)
    gloss: Wie un poco de eine kleine Menge beschreibt.
    note: Siehe den Text der Karte.
    target_text: '*Un poco de* (ein wenig) wird bei Mengenangaben für Lebensmittel verwendet und beschreibt hier eine geringe Menge Wind – dasselbe Muster mit einem neuen Substantiv.'
  es.a1.unit10.lesson06.teach.line01:
    title: Die Hitze kommentieren
    gloss: Elena bemerkt, wie heiß es heute ist.
    note: '*¡Qué calor hace hoy!* (wörtlich: Was für eine Hitze macht es heute! / Ist das heiß heute!) ist eine Ausrufeform des Ausdrucks *hace calor*.'
  es.a1.unit10.lesson06.teach.line02:
    title: Zustimmen und etwas ergänzen
    gloss: Mateo stimmt zu und merkt an, dass keine einzige Wolke am Himmel ist.
    note: Verbindet *hace mucho calor y hace sol* mit *no hay ni una nube*.
  es.a1.unit10.lesson06.teach.line03:
    title: Vorschlagen, Wasser mitzunehmen
    gloss: Elena sagt, dass sie Wasser für den Weg brauchen.
    note: '*El camino* (der Weg) bezieht sich auf ihren Weg zum Workshop.'
  es.a1.unit10.lesson06.teach.line04:
    title: Zustimmen und auf einen Laden hinweisen
    gloss: Mateo stimmt zu und erwähnt einen Laden in der Nähe.
    note: '*Cerca de aquí* (hier in der Nähe) verwendet die Ortsangabe *cerca de* (nahe bei).'
  es.a1.unit10.lesson06.teach.line05:
    title: Winter und Sommer gegenüberstellen
    gloss: Elena stellt die kalten Winter in Madrid der übermäßigen Hitze im Juli gegenüber.
    note: Verbindet die beiden Jahreszeitensätze *en invierno hace mucho frío* und *en julio hace demasiado calor*.
  es.a1.unit10.lesson06.teach.line06:
    title: Eine Vorliebe äußern
    gloss: Mateo sagt, dass er die Hitze lieber mag – in London regnet es fast jeden Tag.
    note: '*Prefiero* (ich bevorzuge) ist eine neue Verbform der ersten Person; *casi todos los días* (fast jeden Tag) ist eine nützliche Häufigkeitsangabe.'
  es.a1.unit10.lesson06.teach.line07:
    title: Zustimmen und zur Eile mahnen
    gloss: Elena stimmt zu und sagt, sie sollten gehen, sonst kämen sie zu spät zum Kurs.
    note: '*Es verdad* bedeutet „das stimmt“; *o* (oder) zeigt hier eine Folge an („sonst“).'
  es.a1.unit10.lesson06.teach.line08:
    title: Zustimmen und losgehen
    gloss: Mateo gibt ihr recht, und sie gehen los.
    note: '*Tienes razón* (du hast recht) ist eine gebräuchliche Zustimmungsformel.'
