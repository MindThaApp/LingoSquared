  es.a1.unit10.lesson01.teach.el_tiempo:
    title: Das Wetter
    gloss: das Wetter
    note: '*Tiempo* bedeutet auch „Zeit“ – aus dem Kontext ergibt sich die jeweilige Bedeutung.'
    example_gloss: Wie ist das Wetter heute?
  es.a1.unit10.lesson01.teach.el_sol:
    title: Die Sonne
    gloss: die Sonne
