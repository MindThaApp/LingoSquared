teaching:
  es.a1.unit51.lesson01.teach.el_billete:
    title: Die Fahrkarte
    gloss: die Fahrkarte
    note: '*El billete* ist maskulin, deshalb heißt es *un billete* und nicht *una*.'
    example_gloss: Ich möchte eine Fahrkarte nach Toledo.
  es.a1.unit51.lesson01.teach.quisiera_un_billete:
    title: Eine Fahrkarte verlangen
    gloss: Ich möchte eine Fahrkarte nach Toledo.
    note: '*Quisiera* („ich möchte“) macht eine Bitte höflicher und klingt freundlicher als *quiero*.'
  es.a1.unit51.lesson01.teach.quiere_un_billete:
    title: Der Schalterbeamte fragt nach der Art
    gloss: Möchten Sie eine einfache Fahrkarte oder eine Hin- und Rückfahrkarte?
    note: '*Quiere* ist die formelle *usted*-Form von *querer*, hier für einen unbekannten Bahnangestellten.'
  es.a1.unit51.lesson01.teach.ida_y_vuelta:
    title: Höflich antworten
    gloss: Hin und zurück, bitte.
    note: Mit *por favor* sagt man „bitte“; die Bitte bleibt höflich und kurz.
  es.a1.unit51.lesson01.teach.en_la_taquilla:
    title: Die Anredeform am Schalter
    gloss: Am Schalter verwendet man in der Regel die Höflichkeitsform usted.
    note: Fremde Personen im Dienstleistungsbereich spricht man mit *usted* an, nicht mit *tú*.
  es.a1.unit51.lesson02.teach.el_anden:
    title: Der Bahnsteig
    gloss: der Bahnsteig
    note: '*El andén* ist maskulin: *un andén*, *el andén*.'
    example_gloss: Von welchem Bahnsteig fährt der Zug nach Toledo ab?
  es.a1.unit51.lesson02.teach.de_que_anden:
    title: Nach dem Bahnsteig fragen
    gloss: Von welchem Bahnsteig fährt der Zug nach Toledo ab?
    note: Mit *¿De qué andén ...?* fragt man gezielt nach dem Bahnsteig, nicht nach einem allgemeinen Ort.
  es.a1.unit51.lesson02.teach.el_tren_sale:
    title: Abfahrtsdetails nennen
    gloss: Der Zug fährt um Viertel vor zehn von Bahnsteig fünf ab.
    note: '*Las diez menos cuarto* greift das Muster „minus Viertel“ aus der Lektion über die Uhrzeit wieder auf.'
  es.a1.unit51.lesson02.teach.a_que_hora:
    title: Nach der Ankunftszeit fragen
    gloss: Um wie viel Uhr kommt der Zug an?
    note: Mit *¿A qué hora llega ...?* fragt man nach der Ankunftszeit; *llegar* ist regelmäßig und steht vor der Uhrzeit mit *a las*.
  es.a1.unit51.lesson02.teach.el_tren_llega:
    title: Die Ankunftszeit nennen
    gloss: Der Zug kommt um elf Uhr an.
    note: '*Llega a las once* verwendet *llegar* („ankommen“) mit *a las* vor der Uhrzeit.'
  es.a1.unit51.lesson03.teach.a_tiempo_el:
    title: Pünktlich / die Verspätung
    gloss: pünktlich; die Verspätung
    note: '*A tiempo* ist eine feste Wendung dafür, dass etwas planmäßig geschieht. *El retraso* („die Verspätung“) ist maskulin.'
    example_gloss:
    - Der Zug fährt nicht pünktlich ab.
    - 'Achtung: Der Zug nach Toledo hat Verspätung.'
  es.a1.unit51.lesson03.teach.atencion_el_tren:
    title: Eine Durchsage
    gloss: 'Achtung: Der Zug nach Toledo hat Verspätung.'
    note: '*Atención* leitet eine Bahnhofsdurchsage ein, ähnlich wie „Achtung, liebe Fahrgäste“ im Deutschen.'
  es.a1.unit51.lesson03.teach.el_tren_no:
    title: 'Verneinung: pünktlich'
    gloss: Der Zug fährt nicht pünktlich ab.
    note: '*No* steht direkt vor dem Verb und verneint den ganzen Satz: *no sale a tiempo*.'
  es.a1.unit51.lesson03.teach.el_tren_sale:
    title: Eine Gleisänderung
    gloss: Der Zug fährt von Gleis drei statt von Gleis fünf ab.
    note: '*En lugar de* bedeutet „anstelle von“ bzw. „statt“.'
  es.a1.unit51.lesson03.teach.el_tren_lleva:
    title: Die Dauer der Verspätung nennen
    gloss: Der Zug hat zehn Minuten Verspätung.
    note: '*Lleva retraso* (wörtlich „trägt Verspätung“) ist die natürliche Art zu sagen, dass etwas verspätet ist.'
  es.a1.unit51.lesson04.teach.la_entrada_la:
    title: Eingang, Ausgang, Wartesaal
    gloss: der Eingang; der Ausgang; der Wartesaal
    note: '*La entrada*, *la salida* und *la sala de espera* sind alle drei weiblich (feminin).'
    example_gloss:
    - Wo ist der Eingang?
    - Wo ist der Ausgang?
    - Wo ist der Wartesaal?
  es.a1.unit51.lesson04.teach.donde_esta_el:
    title: Fragen, wo ein Gleis ist
    gloss: Wo ist Bahnsteig sieben?
    note: Hier wird das Muster *¿Dónde está ...?* aus den Lektionen zur Wegbeschreibung wiederverwendet.
  es.a1.unit51.lesson04.teach.todo_recto_y:
    title: Den Weg beschreiben
    gloss: Geradeaus und dann rechts.
    note: '*Todo recto* und *a la derecha* sind die Richtungsangaben aus den Lektionen zur Wegbeschreibung, hier im Bahnhof wieder verwendet.'
  es.a1.unit51.lesson04.teach.donde_esta_la:
    title: Nach dem Wartesaal fragen
    gloss: Wo ist der Wartesaal?
    note: Dasselbe Fragemuster, auf einen neuen Ort angewendet.
  es.a1.unit51.lesson05.teach.billete_madrid_atocha:
    title: Eine Fahrkarte lesen
    gloss: 'Fahrkarte: Madrid Atocha nach Toledo. Abfahrt: zehn nach zehn, Gleis sieben. Ankunft: zehn vor elf. Hin- und Rückfahrt. Preis: zwölf Euro vierzig.'
    note: Achten Sie auf Abfahrtszeit und Gleis, Ankunftszeit, Art der Fahrkarte und Preis.
    glosses:
      Billete: die Fahrkarte
      Salida: die Abfahrt
      diez: zehn
      andén: das Gleis
      siete: sieben
      Llegada: die Ankunft
      once: elf
      vuelta: Hin- und Rückfahrkarte
      Precio: der Preis
      doce: zwölf
      euros: Euro
      cuarenta: vierzig
  es.a1.unit51.lesson06.teach.mateo_tenemos_que:
    title: Mateo nennt den Plan
    gloss: 'Mateo: Wir müssen zu Gleis sieben. Der Zug fährt um zehn nach zehn ab.'
    note: '*Tenemos que* + Infinitiv („wir müssen“) drückt eine praktische Notwendigkeit aus.'
  es.a1.unit51.lesson06.teach.elena_mira_ahi:
    title: Elena liest die Anzeige
    gloss: 'Elena: Schau, da ist die Anzeige: Verspätung, zehn Minuten.'
    note: '*Ahí está* („da ist es“) weist auf die Anzeige hin; *el panel* ist die Informationstafel.'
  es.a1.unit51.lesson06.teach.mateo_no_hay:
    title: Mateo bleibt gelassen
    gloss: 'Mateo: Kein Problem, wir haben noch Zeit für einen Kaffee.'
    note: '*No hay problema* ist eine gebräuchliche, lockere Beruhigung.'
  es.a1.unit51.lesson06.teach.elena_buena_idea:
    title: Der Zug kommt an
    gloss: 'Elena: Gute Idee. Ah, da ist ja schon der Zug! Gleis sieben, genau!'
    note: '*Ya* („schon“) zeigt an, dass der Zug angesichts der gerade angekündigten Verspätung früher als erwartet kommt.'
  es.a1.unit51.lesson06.teach.mateo_vamos_que:
    title: Sie steigen in den Zug
    gloss: 'Mateo: Komm, alle steigen ein! Toledo, wir kommen!'
    note: '*Suben* („sie steigen ein“) kommt von *subir*, einsteigen; *¡Allá vamos!* ist die natürliche Art, „los geht’s“ zu sagen; wörtlich hieße es „dort gehen wir“.'
