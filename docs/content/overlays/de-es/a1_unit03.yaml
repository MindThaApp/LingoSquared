  es.a1.unit03.lesson01.immediate_family:
    title: Die engere Familie
  es.a1.unit03.lesson02.possessives_and_asking:
    title: 'Possessivbegleiter: mi, tu, su'
  es.a1.unit03.lesson03.extended_family:
    title: Die erweiterte Familie
  es.a1.unit03.lesson04.describing_family_size:
    title: Wie viele Personen leben zu Hause?
  es.a1.unit03.lesson05.reading_a_family_profile:
    title: Ein Familienprofil lesen
  es.a1.unit03.lesson06.family_photos_dialogue:
    title: Familienfotos mit Elena und Mateo
teaching:
  es.a1.unit03.lesson01.teach.madre:
    title: Mutter
    gloss: Mutter
    note: '*Madre* ist weiblich. *Mamá* ist im Familienalltag gebräuchlicher, während *madre* neutral ist und in den Vokabellisten dieses Kurses verwendet wird.'
  es.a1.unit03.lesson01.teach.padre:
    title: Vater
    gloss: Vater
    note: '*Padre* ist männlich. *Papá* ist die alltagssprachliche Entsprechung, genau wie bei *madre*/*mamá*.'
  es.a1.unit03.lesson01.teach.hermano:
    title: Bruder
    gloss: Bruder
    note: '*Hermano* ist männlicher Singular.'
  es.a1.unit03.lesson01.teach.hermana:
    title: Schwester
    gloss: Schwester
    note: '*Hermana* ist weiblicher Singular.'
  es.a1.unit03.lesson01.teach.hijo:
    title: Sohn
    gloss: Sohn
    note: '*Hijo* ist männlicher Singular.'
  es.a1.unit03.lesson01.teach.hija:
    title: Tochter
    gloss: Tochter
    note: '*Hija* ist weiblicher Singular.'
  es.a1.unit03.lesson01.teach.padres:
    title: Eltern
    gloss: Eltern
    note: '*Padres* bezeichnet als männliche Pluralform ein gemischtgeschlechtliches Paar, also Mutter und Vater zusammen. Im Spanischen wird der männliche Plural generell verwendet, sobald eine Gruppe mindestens eine männliche Person umfasst.'
  es.a1.unit03.lesson01.teach.hermanos:
    title: Geschwister
    gloss: Geschwister; Brüder
    note: '*Hermanos* kann „Brüder“ bei einer rein männlichen Gruppe oder „Geschwister“ bei einer gemischten Gruppe bedeuten. Es folgt derselben Regel, nach der der männliche Plural auch gemischte Gruppen bezeichnet, wie bei *padres*.'
  es.a1.unit03.lesson02.teach.mi_familia:
    title: Meine Familie
    gloss: meine Familie
    note: '*Mi* (ohne Akzent) ist der Possessivbegleiter „mein“; er verändert sich nicht nach dem Geschlecht, sondern nur nach der Zahl (*mis* vor Substantiven im Plural).'
  es.a1.unit03.lesson02.teach.tu_familia:
    title: Deine Familie
    gloss: deine Familie
    note: '*Tu* (ohne Akzent, anders als das Pronomen *tú*) ist der Possessivbegleiter der informellen Anrede und gehört zur Anrede mit *tú* aus Einheit 1.'
  es.a1.unit03.lesson02.teach.su_familia:
    title: Ihre/seine/ihre Familie
    gloss: seine/ihre/Ihre Familie
    note: '*Su* kann „sein“, „ihr“ UND das förmliche „Ihr“ (*usted*) bedeuten. Im Spanischen lassen sich diese Bedeutungen nicht allein am Possessivbegleiter unterscheiden; der Zusammenhang macht die Bedeutung deutlich.'
  es.a1.unit03.lesson02.teach.tienes_hermanos:
    title: Nach Geschwistern fragen
    gloss: Hast du Geschwister?
    note: '*Tienes* ist die *tú*-Form von *tener*, demselben Verb, das in Einheit 2 für Altersangaben verwendet wurde.'
  es.a1.unit03.lesson02.teach.tengo_dos_hermanas:
    title: Die Anzahl der Geschwister angeben
    gloss: Ich habe zwei Schwestern.
    note: '*Tengo* (ich habe) wird mit einer Zahl und der Verwandtschaftsbezeichnung kombiniert, um Geschwister anzugeben.'
  es.a1.unit03.lesson02.teach.tu_familia_es_grande:
    title: Fragen, ob eine Familie groß ist
    gloss: Ist deine Familie groß?
    note: '*Grande* (groß) verändert sich nicht nach dem Geschlecht, sondern nur nach der Zahl (*grandes*).'
  es.a1.unit03.lesson02.teach.mi_familia_es_pequena:
    title: Eine kleine Familie beschreiben
    gloss: Meine Familie ist klein.
    note: '*Pequeña* richtet sich nach dem weiblichen Substantiv *familia*; bei einem männlichen Substantiv würde stattdessen die männliche Form *pequeño* stehen.'
  es.a1.unit03.lesson03.teach.abuelo:
    title: Großvater
    gloss: Großvater
    note: '*Abuelo* ist männlicher Singular.'
  es.a1.unit03.lesson03.teach.abuela:
    title: Großmutter
    gloss: Großmutter
    note: '*Abuela* steht im Femininum Singular.'
  es.a1.unit03.lesson03.teach.abuelos:
    title: Großeltern
    gloss: Großeltern
    note: '*Abuelos* (Maskulinum Plural) bezeichnet auch ein gemischtgeschlechtliches Paar; dasselbe Muster gilt für *padres* und *hermanos*.'
  es.a1.unit03.lesson03.teach.tio:
    title: Onkel
    gloss: Onkel
    note: '*Tío* trägt einen Akzent, weil die Betonung auf dem *í* liegt und dadurch ein sonst entstehender Diphthong aufgelöst wird.'
  es.a1.unit03.lesson03.teach.tia:
    title: Tante
    gloss: Tante
    note: '*Tía* folgt aus demselben Grund demselben Akzentmuster wie *tío*.'
  es.a1.unit03.lesson03.teach.primo:
    title: Cousin
    gloss: Cousin
    note: '*Primo* steht im Maskulinum Singular. Wie im Deutschen zeigt das Spanische beim Wort für Cousin oder Cousine das Geschlecht an.'
  es.a1.unit03.lesson03.teach.prima:
    title: Cousine
    gloss: Cousine
    note: '*Prima* steht im Femininum Singular.'
  es.a1.unit03.lesson03.teach.mis_abuelos:
    title: Meine Großeltern
    gloss: meine Großeltern
    note: '*Mis* ist die Pluralform von *mi*. Sie ist immer erforderlich, wenn das zugehörige Substantiv im Plural steht, unabhängig von dessen Geschlecht.'
  es.a1.unit03.lesson04.teach.cuantos_hermanos_tienes:
    title: Nach der Anzahl der Geschwister fragen
    gloss: Wie viele Geschwister hast du?
    note: '*Cuántos* stimmt mit dem Substantiv überein, nach dem gefragt wird. Es steht im Maskulinum Plural, da *hermanos* auch gemischtgeschlechtliche Gruppen bezeichnet.'
  es.a1.unit03.lesson04.teach.somos_cinco:
    title: Die Haushaltsgröße angeben
    gloss: Wir sind zu fünft zu Hause.
    note: '*Somos* (wir sind) ist im Spanischen die natürliche Formulierung, um die Gesamtzahl der Personen im Haushalt anzugeben.'
  es.a1.unit03.lesson04.teach.mi_familia_es_grande:
    title: Eine große Familie beschreiben
    gloss: Meine Familie ist groß.
    note: '*Grande* bezieht sich hier auf *familia* (weiblich), hat aber dieselbe Form *grande* wie bei männlichen Substantiven, da Adjektive auf -e wie *grande* nicht an das Geschlecht angepasst werden.'
  es.a1.unit03.lesson04.teach.tengo_muchos_primos:
    title: Sagen, dass man viele Cousins und Cousinen hat
    gloss: Ich habe viele Cousins und Cousinen.
    note: '*Muchos* steht im Maskulinum Plural, weil *primos* ebenso wie *hermanos* und *padres* eine gemischtgeschlechtliche Gruppe bezeichnen kann.'
  es.a1.unit03.lesson04.teach.vives_cerca_de_tus_padres:
    title: Fragen, ob jemand in der Nähe seiner Eltern wohnt
    gloss: Wohnst du in der Nähe deiner Eltern?
    note: '*Tus* ist der Plural von *tu* und ist erforderlich, weil *padres* im Plural steht.'
  es.a1.unit03.lesson04.teach.vivo_con_mis_abuelos:
    title: Sagen, mit wem man zusammenlebt
    gloss: Ich lebe bei meinen Großeltern.
    note: '*Con* (mit) leitet die Personen ein, mit denen jemand zusammenlebt. *Vivo* ist die *yo*-Form von *vivir*, die bereits in Einheit 1 in *vivo en Londres* vorkam.'
  es.a1.unit03.lesson05.teach.profile_reading:
    title: Elenas Familienprofil
    gloss: 'Ich heiße Elena. Ich bin einunddreißig Jahre alt und lebe bei meinen Großeltern in Spanien. Meine Mutter und mein Vater leben in Barcelona. Ich habe eine Schwester und einen Bruder: Wir sind zu fünft zu Hause. Meine jüngere Schwester heißt Sofía und ist zwanzig Jahre alt.'
    note: Dieses Profil verwendet Wortschatz und Strukturen aus den Lektionen 01–04 in einem zusammenhängenden kurzen Text statt in einzelnen Sätzen. Dabei üben Sie zu erkennen, wer wer ist – genau wie in der Leseaufgabe dieser Einheit.
    glosses:
      llamo: heiße (von llamarse)
      Tengo: ich habe (von tener)
      treinta: dreißig
      años: Jahre alt
      vivo: lebe (von vivir)
      abuelos: Großeltern
      madre: Mutter
      padre: Vater
      viven: lebe (von vivir)
      hermana: Schwester
      hermano: Bruder
      somos: wir sind (von ser)
      cinco: fünf
      casa: Zuhause
      menor: jünger
      tiene: hat (von tener)
      veinte: zwanzig
  es.a1.unit03.lesson05.teach.hermana_menor:
    title: Jüngere Schwester
    gloss: jüngere Schwester
    note: '*Menor* (jünger) steht nach dem Substantiv, das es beschreibt, und ändert seine Form nicht nach dem Geschlecht.'
  es.a1.unit03.lesson05.teach.vive_third_person:
    title: Lebt (dritte Person)
    gloss: lebt
    note: '*Vive* ist die dritte Person Singular von *vivir* und wird verwendet, wenn man über jemanden spricht (*Elena vive* …). Spricht man über sich selbst, heißt es *vivo*, wie bereits in Lektion 04 von Einheit 1 und erneut in Lektion 04 dieser Einheit.'
  es.a1.unit03.lesson05.teach.sus_third_person_plural:
    title: Ihr/sein/Ihr (vor einem Substantiv im Plural)
    gloss: ihre/seine/Ihre
    note: '*Sus* ist der Plural von *su*. So wie *su* vor einem Substantiv im Singular „sein/ihr/Ihr“ bedeuten kann, bedeutet *sus abuelos* „ihre Großeltern“, wenn in der dritten Person über Elena gesprochen wird.'
  es.a1.unit03.lesson06.teach.line01:
    title: Familienfotos zeigen
    gloss: Elena zeigt Mateo ein Foto und stellt ihre Eltern und ihre jüngere Schwester vor.
    note: '*Estos son* (das sind, Maskulinum oder gemischter Plural) leitet die Eltern ein; *esta es* (das ist, Femininum Singular) leitet die Schwester ein.'
  es.a1.unit03.lesson06.teach.line02:
    title: Herzlich reagieren und nach Geschwistern fragen
    gloss: Mateo reagiert herzlich und fragt, ob sie noch weitere Geschwister hat.
    note: '*Qué bonito* ist eine natürliche, herzliche Reaktion beim Betrachten eines Fotos und erfüllt eine ähnliche Funktion wie *Qué bien* aus Einheit 1.'
  es.a1.unit03.lesson06.teach.line03:
    title: Die Haushaltsgröße nennen und die Frage zurückgeben
    gloss: Elena sagt, dass sie eine Schwester und einen Bruder hat – zu Hause sind sie zu fünft – und fragt dann nach Mateos Familie.
    note: '*Somos cinco en casa* gibt die Gesamtzahl der Personen im Haushalt an und greift das Muster aus Lektion 04 wieder auf.'
  es.a1.unit03.lesson06.teach.line04:
    title: Eine kleinere Familie beschreiben
    gloss: 'Mateo sagt, dass seine Familie kleiner ist – sie sind nur zu dritt: seine Eltern und er. Dafür hat er viele Cousins und Cousinen.'
    note: '*Pero* (aber) kennzeichnet den Gegensatz zwischen einer kleinen engsten Familie und vielen Verwandten.'
  es.a1.unit03.lesson06.teach.line05:
    title: Fragen, ob jemand in der Nähe seiner Eltern wohnt
    gloss: Elena fragt, ob Mateo in der Nähe seiner Eltern wohnt.
    note: '*Cerca de* (in der Nähe von) ist eine gebräuchliche Wendung, um räumliche Nähe auszudrücken.'
  es.a1.unit03.lesson06.teach.line06:
    title: Die Entfernung erklären und vom Kontakt erzählen
    gloss: 'Mateo verneint: Seine Eltern leben in Kolumbien, und sie telefonieren jede Woche miteinander.'
    note: 'Dies knüpft an die bereits in Einheit 1 erwähnte Information an: Mateo kommt aus Kolumbien, lebt aber in London; seine Eltern leben weiterhin in Kolumbien.'
  es.a1.unit03.lesson06.teach.line07:
    title: Verständnis zeigen und von der eigenen Situation erzählen
    gloss: Elena sagt, dass sie das versteht und hier in Spanien bei ihren Großeltern lebt.
    note: '*Entiendo* (ich verstehe) ist eine natürliche, knappe Reaktion auf das, was jemand gerade erzählt hat, bevor man eine passende eigene Information ergänzt.'
  es.a1.unit03.lesson06.teach.line08:
    title: Mit einer herzlichen Bemerkung abschließen
    gloss: Mateo sagt, dass es schön ist, die Familie in der Nähe zu haben.
    note: '*Qué bien tener a la familia cerca* beendet das Gespräch mit einer herzlichen, nachdenklichen Bemerkung und greift das im gesamten Dialog verwendete Muster *qué bien*/*qué bonito* wieder auf.'
