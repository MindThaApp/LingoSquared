teaching:
  es.a1.unit11.lesson01.teach.la_camisa:
    title: Das Hemd
    gloss: das Hemd
    note: '*Camisa* ist feminin.'
    example_gloss: Dieses Hemd gefällt mir.
  es.a1.unit11.lesson01.teach.el_pantalon:
    title: Die Hose
    gloss: die Hose
    note: '*Pantalón* ist im Spanischen grammatisch Singular, so wie im Deutschen „die Hose“.'
    example_gloss: Die Hose kostet zwanzig.
  es.a1.unit11.lesson01.teach.la_chaqueta:
    title: Die Jacke
    gloss: die Jacke
    note: '*Chaqueta* ist feminin.'
    example_gloss: Ich brauche eine Jacke für den Winter.
  es.a1.unit11.lesson01.teach.los_zapatos:
    title: Die Schuhe
    gloss: die Schuhe
    note: '*Zapatos* steht im Plural, genau wie im Deutschen „Schuhe“.'
    example_gloss: Diese Schuhe sind bequem.
  es.a1.unit11.lesson01.teach.el_delantal:
    title: Die Schürze
    gloss: die Schürze
    note: '*Delantal* ist maskulin – genau das Kleidungsstück, das Elena und Mateo für den Workshop brauchen.'
    example_gloss: Wir brauchen eine Schürze für den Workshop.
  es.a1.unit11.lesson02.teach.que_talla_usas:
    title: Nach der Größe fragen
    gloss: Welche Größe hast du?
    note: '*¿Qué talla usas?* ist die übliche Frage nach der Kleidergröße.'
  es.a1.unit11.lesson02.teach.uso_la_talla_mediana:
    title: Die eigene Größe nennen
    gloss: Ich trage Größe M.
    note: '*Uso* („ich benutze/trage“) + *la talla* („die Größe“) + das Wort für die Größe selbst.'
  es.a1.unit11.lesson02.teach.me_queda_bien:
    title: Sagen, dass etwas gut passt
    gloss: Es passt mir gut.
    note: '*Me queda bien* verwendet *quedar* („passen/stehen“) – siehe die folgende Grammatikkarte.'
  es.a1.unit11.lesson02.teach.me_queda_mal:
    title: Sagen, dass etwas schlecht passt
    gloss: Es passt mir schlecht.
    note: 'Das Gegenteil von *me queda bien*: *bien* wird durch *mal* ersetzt.'
  es.a1.unit11.lesson02.teach.queda_note:
    title: Quedar bien/mal
    gloss: Wie quedar die Passform beschreibt, nicht die allgemeine Qualität.
    note: Siehe den Text der Karte.
    target_text: '*Me queda bien* („es passt mir gut“) verwendet *quedar* („passen/stehen“), also ein anderes Verb als *ser* oder *estar* – wörtlich etwa „es bleibt mir gut“. *Bien* und *mal* beschreiben hier die Passform, nicht die Qualität.'
  es.a1.unit11.lesson03.teach.cuanto_cuesta_este_delantal:
    title: Nach dem Preis der Schürze fragen
    gloss: Wie viel kostet diese Schürze?
    note: Das Muster *¿Cuánto cuesta?* mit einem bestimmten Artikel, der mit *este* („dieser“) benannt wird.
  es.a1.unit11.lesson03.teach.cuesta_doce:
    title: Den Preis nennen
    gloss: Es kostet zwölf.
    note: '*Cuesta* + Zahl nennt den Preis.'
  es.a1.unit11.lesson03.teach.este_vs_esta_note:
    title: Este und esta
    gloss: Wie sich das Demonstrativpronomen nach dem Geschlecht des Substantivs richtet.
    note: Siehe den Text der Karte.
    target_text: '*Este* („dieser“, maskulin) passt zu *el delantal*; *esta* („diese“, feminin) gehört zu *esta camisa* – das Demonstrativpronomen richtet sich wie ein Adjektiv nach dem Geschlecht des Substantivs.'
  es.a1.unit11.lesson04.teach.me_gusta_este:
    title: Sagen, dass einem etwas gefällt
    gloss: Dieses hier gefällt mir.
    note: '*Este* steht hier allein als Pronomen („dieser/dieses hier“) und verweist auf den Artikel, der gerade erwähnt wurde.'
  es.a1.unit11.lesson04.teach.voy_a_comprarlo:
    title: Sagen, dass man etwas kaufen wird
    gloss: Ich werde es kaufen.
    note: '*Voy a* + Infinitiv ist die Nahzukunft; bei *comprarlo* wird das Objektpronomen *lo* („es“) an den Infinitiv *comprar* angehängt.'
  es.a1.unit11.lesson04.teach.compramos_dos:
    title: Sagen, dass man zwei kauft
    gloss: Wir kaufen zwei.
    note: '*Compramos* („wir kaufen“) ist die *nosotros*-Form, die verwendet wird, wenn Elena und Mateo gemeinsam entscheiden.'
  es.a1.unit11.lesson05.teach.precios_reading:
    title: Eine Preisliste lesen
    gloss: 'In diesem Geschäft kostet das Hemd fünfzehn, die Hose zwanzig, die Jacke dreißig und die Schuhe fünfundzwanzig. Die Schürze ist die günstigste: Sie kostet nur zwölf.'
    note: 'Eine Preisliste im Geschäft: *cuesta* („kostet“) für einen Artikel, *cuestan* („kosten“) für mehrere Artikel wie *los zapatos*.'
    glosses:
      tienda: Geschäft
      camisa: Hemd
      cuesta: kostet (von costar)
      quince: fünfzehn
      pantalón: Hose
      veinte: zwanzig
      chaqueta: Jacke
      treinta: dreißig
      zapatos: Schuhe
      cuestan: kostet
      veinticinco: fünfundzwanzig
      delantal: Schürze
      barato: billig
      solo: nur
      doce: zwölf
  es.a1.unit11.lesson05.teach.el_mas_barato_note:
    title: El más barato (der Günstigste)
    gloss: Wie el/la + más + Adjektiv einen Superlativ bildet.
    note: Siehe den Text der Karte.
    target_text: '*El más barato* („der günstigste“) ist ein Superlativ: *el/la* + *más* + Adjektiv, wobei *de/en* die Gruppe nennt, mit der verglichen wird. Diese Einheit behandelt noch nicht das ganze Vergleichsmuster, sondern nur diese eine häufige Wendung beim Einkaufen.'
  es.a1.unit11.lesson06.teach.line01:
    title: Den Bedarf nennen
    gloss: Elena sagt, dass sie Schürzen für den Workshop brauchen.
    note: '*Delantales* ist der Plural von *el delantal*.'
  es.a1.unit11.lesson06.teach.line02:
    title: Zustimmen und ein Geschäft vorschlagen
    gloss: Mateo stimmt zu und schlägt vor, in dieses Geschäft zu gehen.
    note: '*Tienes razón* bedeutet „du hast recht“; *esa tienda* bedeutet „dieses Geschäft dort“.'
  es.a1.unit11.lesson06.teach.line03:
    title: Der Verkäufer begrüßt sie
    gloss: Der Verkäufer begrüßt sie und bietet seine Hilfe an.
    note: '*¿Los ayudo?* (Kann ich Ihnen helfen?) ist eine typische Begrüßung im Geschäft und richtet sich an Elena und Mateo gemeinsam.'
  es.a1.unit11.lesson06.teach.line04:
    title: Sagen, was sie suchen
    gloss: Elena sagt ja, sie suchen Schürzen.
    note: '*Buscamos* (wir suchen) ist die *nosotros*-Form von *buscar*.'
  es.a1.unit11.lesson06.teach.line05:
    title: Der Verkäufer zeigt Modelle und fragt nach der Größe
    gloss: Der Verkäufer zeigt einige Schürzen und fragt nach ihrer Größe.
    note: '*¿Qué talla usan?* verwendet den Plural *usan* (Sie tragen / ihr tragt) und spricht beide an, im Gegensatz zum Singular *usas*.'
  es.a1.unit11.lesson06.teach.line06:
    title: Eine Größe nennen
    gloss: Mateo sagt, dass er Größe M trägt.
    note: '*Uso la talla mediana* beantwortet *¿Qué talla usan?* für ihn selbst.'
  es.a1.unit11.lesson06.teach.line06b:
    title: Elena stimmt zu
    gloss: Elena sagt, dass sie dieselbe Größe trägt.
    note: '*Yo también* bedeutet „ich auch“.'
  es.a1.unit11.lesson06.teach.line07:
    title: Nach dem Preis fragen
    gloss: Mateo fragt, was die Schürze kostet.
    note: '*Este* bedeutet „dieser“ und zeigt auf die Schürze vor ihm.'
  es.a1.unit11.lesson06.teach.line07b:
    title: Den Preis nennen
    gloss: Der Verkäufer sagt, sie kostet zwölf.
    note: '*Cuesta* + Zahl nennt den Preis.'
  es.a1.unit11.lesson06.teach.line08:
    title: Die Passform bestätigen und sich zum Kauf entscheiden
    gloss: Elena sagt, dass sie gut passt, dass sie ihr gefällt und dass sie sie kaufen wird.
    note: Verbindet nacheinander *me queda bien*, *me gusta este* und *voy a comprarlo*.
  es.a1.unit11.lesson06.teach.line09:
    title: Zustimmen und zwei kaufen
    gloss: Mateo sagt, dass sie ihm auch gut passt, und sie kaufen zwei.
    note: '*A mí también* (mir auch, betont) folgt dem Zustimmungsmuster mit *también* und einem zusätzlichen betonten Pronomen; *compramos dos* schließt die Szene ab.'
