  es.a1.unit01.lesson01.tu_and_usted:
    title: Zwischen tú und usted wählen
  es.a1.unit01.lesson02.greetings_by_time:
    title: Begrüßungen und Verabschiedungen im Tagesverlauf
  es.a1.unit01.lesson03.names_and_introductions:
    title: Namen und Vorstellungen
  es.a1.unit01.lesson04.origin_and_language:
    title: Herkunft, Wohnort und Sprache
  es.a1.unit01.lesson05.shared_activity_small_talk:
    title: Smalltalk bei einer gemeinsamen Aktivität
  es.a1.unit01.lesson06.cooking_workshop_dialogue:
    title: Erste Begegnung bei einem Kochkurs
teaching:
  es.a1.unit01.lesson01.teach.usted:
    title: Höfliche Anrede
    gloss: Sie
    note: Im Spanischen zeigt die Wahl des Anredepronomens häufig die soziale Beziehung an. Usted eignet sich für einen unbekannten Erwachsenen oder wenn ein respektvoller Ton angebracht ist. Obwohl es Sie bedeutet, steht das Verb dabei in derselben Form wie bei él oder ella.
  es.a1.unit01.lesson01.teach.tu:
    title: Vertrauliche Anrede
    gloss: du
    note: Tú wird für einen Freund, Gleichaltrigen, ein Kind oder eine andere Person verwendet, wenn das Verhältnis ungezwungen ist. Der Akzent unterscheidet das Pronomen tú vom Possessivbegleiter tu mit der Bedeutung dein.
  es.a1.unit01.lesson01.teach.como_esta_usted:
    title: Förmlich nach dem Befinden fragen
    gloss: Wie geht es Ihnen?
    note: Está ist die usted-Form von estar. Hier wird estar im Spanischen für das gegenwärtige Befinden einer Person verwendet. Cómo trägt einen Akzent, weil es ein Fragewort ist.
  es.a1.unit01.lesson01.teach.como_estas:
    title: Vertraut nach dem Befinden fragen
    gloss: Wie geht es Ihnen?
    note: Estás ist die tú-Form von estar. Anders als im Deutschen, wo es sowohl „Wie geht es Ihnen?“ als auch „Wie geht es dir?“ heißt, wechselt das Spanische je nach Anrede von está zu estás.
  es.a1.unit01.lesson01.teach.bien_gracias:
    title: Eine knappe Antwort
    gloss: Gut, danke.
    note: Im Spanischen kann man mit bien antworten, ohne ein Subjekt oder Verb zu wiederholen.
  es.a1.unit01.lesson01.teach.muy_bien:
    title: Eine positive Antwort
    gloss: Sehr gut, danke.
    note: Muy verstärkt bien und bleibt unverändert.
  es.a1.unit01.lesson01.teach.and_usted:
    title: Die förmliche Gegenfrage stellen
    gloss: Und Sie?
    note: Behalten Sie usted bei, wenn Sie eine respektvoll formulierte Frage zurückgeben.
  es.a1.unit01.lesson01.teach.and_tu:
    title: Die vertrauliche Gegenfrage stellen
    gloss: Und Sie?
    note: Verwenden Sie tú, wenn das Gespräch ungezwungen ist. Der Akzent ist wichtig, denn tu ohne Akzent bedeutet dein.
  es.a1.unit01.lesson02.teach.hola:
    title: Universelle Begrüßung
    gloss: hallo
    note: Hola passt zu jeder Tageszeit und sowohl zu förmlichen als auch zu ungezwungenen Begegnungen.
  es.a1.unit01.lesson02.teach.buenos_dias:
    title: Begrüßung am Morgen
    gloss: guten Morgen
    note: Spanische Substantive haben wie deutsche Substantive ein grammatisches Geschlecht. Días ist maskulin und steht im Plural, daher lautet das Adjektiv buenos.
  es.a1.unit01.lesson02.teach.buenas_tardes:
    title: Begrüßung am Nachmittag
    gloss: guten Tag
    note: Tardes ist feminin und steht im Plural, daher wird buenas daran angeglichen. Der Wechsel von buenos zu buenas ist grammatische Kongruenz und keine Änderung der Höflichkeit.
  es.a1.unit01.lesson02.teach.buenas_noches:
    title: Begrüßung am Abend oder in der Nacht
    gloss: guten Abend; gute Nacht
    note: Noches ist feminin und steht im Plural, daher wird buenas verwendet. Der Ausdruck kann nachts zur Begrüßung oder vor dem Schlafengehen zum Abschied dienen.
  es.a1.unit01.lesson02.teach.adios:
    title: Direkte Verabschiedung
    gloss: auf Wiedersehen
    note: Adiós ist neutral, kann aber endgültiger klingen als ein Ausdruck im Sinne von „bis später“.
  es.a1.unit01.lesson02.teach.hasta_luego:
    title: Bis später
    gloss: bis später
    note: Hasta luego ist eine feste Abschiedsformel und muss nicht Wort für Wort verstanden werden.
  es.a1.unit01.lesson02.teach.nos_vemos:
    title: Freundliche Verabschiedung
    gloss: bis dann
    note: Wörtlich bedeutet nos vemos eher „wir sehen uns“.
  es.a1.unit01.lesson02.teach.good_day:
    title: Höflicher Abschiedswunsch
    gloss: Ich wünsche Ihnen einen schönen Tag.
    note: Tenga ist die usted-Form, die in diesem höflichen Wunsch verwendet wird. Buen ist die verkürzte maskuline Singularform von bueno vor día.
  es.a1.unit01.lesson03.teach.formal_name_question:
    title: Förmlich nach dem Namen fragen
    gloss: Wie heißen Sie?
    note: Wörtlich entspricht der spanische Ausdruck ungefähr „Wie nennen Sie sich?“. Se gehört zur förmlichen usted-Form llama. Im Deutschen wird der Unterschied der Anrede hier durch Sie statt du ausgedrückt; im Spanischen zeigt er sich zusätzlich in der Verbform.
  es.a1.unit01.lesson03.teach.my_name_lucia:
    title: Den eigenen Namen nennen
    gloss: Ich heiße Lucía.
    note: Me llamo bedeutet wörtlich „Ich nenne mich“. Die Verbendung kennzeichnet bereits die sprechende Person, daher wird yo im Spanischen hier normalerweise weggelassen.
  es.a1.unit01.lesson03.teach.informal_name_question:
    title: Vertraut nach dem Namen fragen
    gloss: Wie heißen Sie?
    note: Te gehört zum vertraulichen tú, und llamas trägt die tú-Endung -as. Vergleichen Sie das förmliche se llama mit dem vertraulichen te llamas.
  es.a1.unit01.lesson03.teach.i_am_diego:
    title: Sich mit ser vorstellen
    gloss: Ich bin Diego.
    note: Soy ist die erste Person Singular von ser. Im Spanischen wird ser für die Identität verwendet. Für vorübergehende Zustände steht dagegen häufig estar.
  es.a1.unit01.lesson03.teach.mucho_gusto:
    title: Freude über das Kennenlernen ausdrücken
    gloss: Freut mich, Sie kennenzulernen.
    note: Mucho gusto ist ein fester, weithin verständlicher Ausdruck. Anders als Adjektive wie encantado oder encantada verändert er sich nicht je nach Geschlecht der sprechenden Person.
  es.a1.unit01.lesson03.teach.igualmente:
    title: Die Freude erwidern
    gloss: Gleichfalls.
    note: Igualmente ist eine knappe Antwort auf Mucho gusto.
  es.a1.unit01.lesson03.teach.este_carlos:
    title: Einen Mann vorstellen
    gloss: Das ist Carlos.
    note: Das deutsche das hat hier kein grammatisches Geschlecht. Im Spanischen wird este verwendet, wenn die vorgestellte Person oder das bezeichnete Substantiv grammatisch maskulin ist.
  es.a1.unit01.lesson03.teach.esta_ana:
    title: Eine Frau vorstellen
    gloss: Das ist Ana.
    note: Verwenden Sie esta für eine feminine Bezugsgröße. Esta trägt hier keinen Akzent; está mit Akzent ist eine Form von estar und bedeutet „ist“ oder „befindet sich“.
  es.a1.unit01.lesson04.teach.formal_origin_question:
    title: Förmlich nach der Herkunft fragen
    gloss: Woher kommen Sie?
    note: Es ist die usted-Form von ser. Für die Herkunft verwendet das Spanische ser und nicht estar. Dónde trägt in einer direkten Frage einen Akzent.
  es.a1.unit01.lesson04.teach.from_mexico:
    title: Die eigene Herkunft nennen
    gloss: Ich komme aus Mexiko.
    note: Soy ist die yo-Form von ser. Das Subjekt yo ist nicht nötig, weil soy die sprechende Person bereits kennzeichnet.
  es.a1.unit01.lesson04.teach.informal_origin_question:
    title: Vertraut nach der Herkunft fragen
    gloss: Woher kommen Sie?
    note: 'Eres ist die tú-Form von ser. Vergleichen Sie das förmliche es usted mit dem vertraulichen eres. Auch im Deutschen unterscheiden sich die Anredeformen: „Woher kommen Sie?“ und „Woher kommst du?“.'
  es.a1.unit01.lesson04.teach.from_colombia:
    title: Eine weitere Herkunftsangabe
    gloss: Ich komme aus Kolumbien.
    note: Verwenden Sie soy de mit einer anschließenden Ortsangabe, um Ihre Herkunft anzugeben.
  es.a1.unit01.lesson04.teach.live_london:
    title: Den Wohnort nennen
    gloss: Ich lebe in London.
    note: Vivo ist die yo-Form von vivir. Im Spanischen ist yo nicht nötig, weil die Endung -o die sprechende Person kennzeichnet.
  es.a1.unit01.lesson04.teach.speak_spanish:
    title: Förmlich nach Spanischkenntnissen fragen
    gloss: Sprechen Sie Spanisch?
    note: Habla ist die usted-Form. Wie im Deutschen wird die Entscheidungsfrage hier ohne ein zusätzliches Hilfsverb gebildet; Betonung und Fragezeichen kennzeichnen sie als Frage.
  es.a1.unit01.lesson04.teach.yes_a_little:
    title: Begrenzte Kenntnisse
    gloss: Ja, ein wenig.
    note: Sí mit Akzent bedeutet „ja“. Si ohne Akzent bedeutet „wenn“; auf dieser A1-Stufe wird die Schreibweise ohne Akzent hier dennoch als Tippvariante akzeptiert.
  es.a1.unit01.lesson04.teach.still_learning:
    title: Eine andauernde Tätigkeit beschreiben
    gloss: Ich lerne noch.
    note: Estoy ist die yo-Form von estar. Hier dient estar zur Beschreibung einer gerade ablaufenden Tätigkeit, während soy in Soy de Colombia Herkunft oder Identität ausdrückt.
  es.a1.unit01.lesson05.teach.formal_first_time:
    title: Förmlich nach dem ersten Besuch fragen
    gloss: Sind Sie zum ersten Mal hier?
    note: Su bedeutet bei der Anrede mit usted „Ihr“. Auch das Deutsche unterscheidet mit Ihr und dein zwischen förmlicher und vertraulicher Anrede; im Spanischen entspricht dem su beziehungsweise tu.
  es.a1.unit01.lesson05.teach.informal_first_time:
    title: Vertraut nach dem ersten Besuch fragen
    gloss: Sind Sie zum ersten Mal hier?
    note: Tu ohne Akzent ist der vertrauliche Possessivbegleiter mit der Bedeutung „dein“. Vergleichen Sie ihn mit dem Pronomen tú, das einen Akzent trägt.
  es.a1.unit01.lesson05.teach.first_time_answer:
    title: Bestätigen, dass es der erste Besuch ist
    gloss: Ja, ich bin zum ersten Mal hier.
    note: Primera ist feminin, weil es an vez angeglichen wird. Auch im Deutschen können Adjektive ihr grammatisches Geschlecht durch ihre Endung anzeigen.
  es.a1.unit01.lesson05.teach.cooking_workshop:
    title: Das eigene Ziel nennen
    gloss: Ich bin wegen des Kochkurses hier.
    note: Vengo ist die yo-Form von venir und bedeutet „ich komme“. Al ist die erforderliche Verschmelzung von a und el.
  es.a1.unit01.lesson05.teach.me_too:
    title: Dieselbe Situation teilen
    gloss: Ich auch.
    note: Yo también ist nützlich, wenn die Aussage der anderen Person auch auf Sie zutrifft.
  es.a1.unit01.lesson05.teach.like_cooking:
    title: Nach einem Interesse fragen
    gloss: Kochen Sie gern?
    note: Bei Gustar steht die Person, die etwas mag, mit Te, während cocinar das ist, was ihr gefällt. Das Verb bleibt gusta, weil die Tätigkeit als Singular behandelt wird.
  es.a1.unit01.lesson05.teach.yes_very_much:
    title: Großes Interesse ausdrücken
    gloss: Ja, sehr.
    note: Mucho gibt den Grad an und wird hier nicht verändert.
  es.a1.unit01.lesson05.teach.thats_good:
    title: Positiv reagieren
    gloss: Das ist toll.
    note: Qué trägt in diesem Ausruf einen Akzent. Es leitet eine positive Reaktion ein und keine Frage.
  es.a1.unit01.lesson06.teach.line01:
    title: Die Begegnung beginnen
    gloss: Elena begrüßt Mateo und fragt, ob er zum ersten Mal hier ist.
    note: Beide verwenden die vertrauten tú-Formen, weil sie sich als Gleichgestellte bei derselben Aktivität kennenlernen.
  es.a1.unit01.lesson06.teach.line02:
    title: 'Die Begegnung beginnen: Antwort'
    gloss: Mateo bejaht, dass er zum ersten Mal hier ist, und erklärt, dass er wegen des Kochworkshops hier ist.
    note: Vengo al taller nennt den Grund für seine Anwesenheit. Dabei steht das Präsens für eine gegenwärtige Situation.
  es.a1.unit01.lesson06.teach.line03:
    title: Namen austauschen
    gloss: Elena sagt, dass auch sie zum ersten Mal hier ist, nennt ihren Namen und fragt Mateo nach seinem.
    note: Me llamo ist eine natürliche Möglichkeit, den eigenen Namen zu nennen. Im Spanischen wird yo normalerweise weggelassen, weil die Verbform bereits zeigt, wer spricht.
  es.a1.unit01.lesson06.teach.line04:
    title: 'Namen austauschen: Antwort'
    gloss: Mateo nennt seinen Namen und sagt, dass er sich freut, sie kennenzulernen.
    note: Soy ist eine weitere natürliche Möglichkeit, den eigenen Namen zu nennen. Dabei wird ser statt des reflexiven Verbs llamarse verwendet.
  es.a1.unit01.lesson06.teach.line05:
    title: Nach der Herkunft fragen
    gloss: Elena erwidert die Höflichkeit mit „Gleichfalls“ und fragt Mateo, woher er kommt.
    note: De dónde eres fragt mit der vertrauten tú-Form nach der Herkunft.
  es.a1.unit01.lesson06.teach.line06:
    title: 'Nach der Herkunft fragen: Antwort'
    gloss: Mateo kommt aus Kolumbien, lebt aber in London, und stellt Elena anschließend dieselbe Frage.
    note: Soy de drückt die Herkunft aus, vivo en dagegen den aktuellen Wohnort. Pero stellt den Gegensatz zwischen diesen beiden Angaben her.
  es.a1.unit01.lesson06.teach.line07:
    title: Über ein Interesse sprechen
    gloss: Elena sagt, dass sie aus Spanien kommt, und fragt Mateo, ob er gern kocht.
    note: Soy beschreibt die Herkunft nach demselben Muster, das Mateo gerade verwendet hat.
  es.a1.unit01.lesson06.teach.line08:
    title: 'Über ein Interesse sprechen: Antwort'
    gloss: Mateo sagt, dass er sehr gern kocht, aber noch dabei ist, es zu lernen.
    note: Estoy aprendiendo beschreibt eine Tätigkeit, die gerade im Gange ist. Im Deutschen wird dies meist einfach mit dem Präsens ausgedrückt.
  es.a1.unit01.lesson06.teach.line09:
    title: Das Gespräch beenden
    gloss: Elena sagt, dass auch sie noch lernt, und verabschiedet sich bis drinnen.
    note: Nos vemos weist auf ein erwartetes späteres Wiedersehen hin, und dentro gibt an, wo es stattfindet.
  es.a1.unit01.lesson06.teach.line10:
    title: 'Das Gespräch beenden: Antwort'
    gloss: Mateo stimmt zu und bestätigt, dass sie sich wiedersehen.
    note: Sí bestätigt zunächst Elenas Vorschlag, bevor nos vemos wiederholt wird.
exercises:
  es.a1.unit01.lesson01.exercise01.select_formal_pronoun:
    instruction: Welche Form von „Sie“ ist respektvoll oder formell?
    correct_option: usted
    distractors:
    - tú
    - dein
    accepted_answers:
    - usted
    feedback: Usted ist die respektvolle Anredeform im Singular und wird mit Verbformen der dritten Person verwendet.
  es.a1.unit01.lesson01.exercise02.select_informal_pronoun:
    instruction: Welche Form verwendet man, um einen Freund oder eine gleichgestellte Person vertraut anzusprechen?
    correct_option: tú
    distractors:
    - usted
    - dein
    accepted_answers:
    - tú
    feedback: Das Pronomen wird tú geschrieben; tu ohne Akzent bedeutet „dein“.
  es.a1.unit01.lesson01.exercise03.listen_formal_question:
    instruction: Hören Sie zu und wählen Sie den Satz aus, den Sie hören.
    correct_option: ¿Cómo está usted?
    distractors:
    - ¿Cómo estás?
    - Und Sie?
    accepted_answers:
    - ¿Cómo está usted?
    - Como esta usted
  es.a1.unit01.lesson01.exercise04.listen_informal_question:
    instruction: Geben Sie die vertraute Frage ein, die Sie hören.
    accepted_answers:
    - ¿Cómo estás?
    - Cómo estás
    - Como estas
  es.a1.unit01.lesson01.exercise05.order_formal_question:
    instruction: Bringen Sie die formelle Frage in die richtige Reihenfolge.
    correct_response:
    - Cómo
    - está
    - usted
  es.a1.unit01.lesson01.exercise06_choose_formal_return:
    instruction: Wählen Sie die Gegenfrage, die die respektvolle Anrede beibehält.
    correct_option: ¿Y usted?
    distractors:
    - Und du?
    - ¿Cómo estás?
    accepted_answers:
    - ¿Y usted?
    - Y usted
  es.a1.unit01.lesson01.exercise07_choose_informal_return:
    instruction: Wählen Sie die passende Gegenfrage für einen Freund oder eine gleichgestellte Person.
    correct_option: ¿Y tú?
    distractors:
    - Und Sie?
    - ¿Cómo está usted?
    accepted_answers:
    - ¿Y tú?
    - Y tú
    - Und du
  es.a1.unit01.lesson01.exercise08.check_informal_agreement:
    instruction: Korrigieren Sie die vertraute Frage.
    accepted_answers:
    - ¿Cómo estás?
    - Cómo estás
    - Como estas
    - ¿Cómo estás tú?
    - Como estas tu
    feedback: Tú erfordert estás; está wird mit usted verwendet.
  es.a1.unit01.lesson01.exercise09.reply_formally:
    instruction: Antworten Sie höflich auf die Frage.
    accepted_answers:
    - Bien, gracias.
    - Bien, gracias
    - Muy bien, gracias.
    - Muy bien, gracias
    - Bien, gracias. ¿Y usted?
    - Muy bien, gracias. ¿Y usted?
  es.a1.unit01.lesson01.exercise10.speak_informally:
    instruction: Antworten Sie vertraut, bedanken Sie sich und stellen Sie die Frage zurück.
    accepted_answers:
    - Muy bien, gracias. ¿Y tú?
    - Muy bien, gracias. Y tú?
    - Muy bien, gracias. Y tu?
    - Muy bien, gracias, ¿y tú?
    - Bien, gracias. ¿Y tú?
    - Gut, danke. Und du?
    - Bien, gracias, ¿y tú?
  es.a1.unit01.lesson02.exercise01.listen_hola:
    instruction: Hören Sie zu und wählen Sie die Begrüßung aus.
    correct_option: Hola
    distractors:
    - Adiós
    - Hasta luego
    accepted_answers:
    - Hola
  es.a1.unit01.lesson02.exercise02.listen_morning:
    instruction: Geben Sie die morgendliche Begrüßung ein, die Sie hören.
    accepted_answers:
    - Buenos días
    - Buenos dias
  es.a1.unit01.lesson02.exercise03.order_afternoon:
    instruction: Bringen Sie die Begrüßung für den Nachmittag in die richtige Reihenfolge.
    correct_response:
    - Buenas
    - tardes
  es.a1.unit01.lesson02.exercise04.select_night:
    instruction: Was bedeutet dieser Ausdruck als abendliche Begrüßung?
    correct_option: Guten Abend.
    distractors:
    - Guten Morgen.
    - Bis später.
    accepted_answers:
    - Guten Abend.
  es.a1.unit01.lesson02.exercise05.listen_night:
    instruction: Hören Sie zu und wählen Sie die Wendung aus, die Sie hören.
    correct_option: Buenas noches
    distractors:
    - Buenos días
    - Buenas tardes
    accepted_answers:
    - Buenas noches
  es.a1.unit01.lesson02.exercise06.choose_farewell:
    instruction: Welche Funktion hat dieses Wort?
    correct_option: Es dient zur Verabschiedung.
    distractors:
    - Es fragt nach einem Namen.
    - Es drückt Dank aus.
    accepted_answers:
    - Es dient zur Verabschiedung.
  es.a1.unit01.lesson02.exercise07.listen_until_later:
    instruction: Bringen Sie die gehörte Verabschiedung in die richtige Reihenfolge.
    correct_response:
    - Hasta
    - luego
  es.a1.unit01.lesson02.exercise08.reply_to_afternoon:
    instruction: Erwidern Sie die Begrüßung und beenden Sie dann den kurzen Austausch.
    accepted_answers:
    - Buenas tardes. Hasta luego.
    - Buenas tardes, hasta luego.
    - Buenas tardes. Adiós.
    - Buenas tardes. Nos vemos.
    - Buenas tardes. Que tenga un buen día.
  es.a1.unit01.lesson02.exercise09.order_good_day:
    instruction: Bilden Sie den höflichen Abschiedswunsch.
    correct_response:
    - Que
    - tenga
    - un
    - buen
    - día
  es.a1.unit01.lesson02.exercise10.speak_friendly_closing:
    instruction: Verabschieden Sie sich freundlich mit „Bis bald“.
    accepted_answers:
    - Nos vemos.
    - Nos vemos
  es.a1.unit01.lesson03.exercise01.listen_formal_name:
    instruction: Hören Sie zu und wählen Sie aus, wonach die sprechende Person fragt.
    correct_option: Die Person fragt respektvoll nach dem Namen ihres Gegenübers.
    distractors:
    - Die Person fragt, wo jemand wohnt.
    - Die Person fragt jemanden vertraut, wie es ihm geht.
    accepted_answers:
    - Die Person fragt respektvoll nach dem Namen ihres Gegenübers.
  es.a1.unit01.lesson03.exercise02.order_name_answer:
    instruction: Bilden Sie Lucías Aussage zu ihrem Namen.
    correct_response:
    - Me
    - llamo
    - Lucía
  es.a1.unit01.lesson03.exercise03.listen_informal_name:
