    gloss: 'Lucía: Ich schwimme lieber, aber ich komme auch in den Park.'
    note: 'Hier kommt *prefiero* (ich bevorzuge) noch einmal vor: Bei *Prefiero nadar* folgt auf das Verb ein Infinitiv.'
