    title: Wer nutzt was?
    gloss: Elena ruft Mateo jeden Tag an. Sie benutzt ihr Handy, keine App. Mateo hat zu Hause keinen Computer, aber er nutzt das Internet auf seinem Handy. Diego schaut jeden Morgen die Wettervorhersage nach. Danach geht er joggen. Lucía schickt Elena oft eine Nachricht. Benutzt du auch jeden Tag dein Handy?
    note: Vergleicht die Gewohnheiten aller vier Figuren mit Geräten, ähnlich wie der Vergleichstext in der Sport-Lektion.
