teaching:
  es.a1.unit08.lesson01.teach.banco_farmacia:
    title: Bank, Apotheke
    gloss: Bank, Apotheke
    note: '*Banco* ist männlich; *farmacia* ist weiblich.'
    example_gloss:
    - Ich gehe zur Bank.
    - Die Apotheke öffnet um neun.
  es.a1.unit08.lesson01.teach.parque_restaurante:
    title: Park, Restaurant
    gloss: Park, Restaurant
    note: Beide Substantive sind männlich.
    example_gloss:
    - Der Park ist sehr schön.
    - Wir essen im Restaurant.
  es.a1.unit08.lesson01.teach.biblioteca:
    title: Bibliothek
    gloss: Bibliothek
    note: '*Biblioteca* ist weiblich.'
    example_gloss: Ich lerne in der Bibliothek.
  es.a1.unit08.lesson02.teach.cerca_de:
    title: In der Nähe
    gloss: Das Restaurant ist in der Nähe des Marktes.
    note: Nach *Cerca de* (in der Nähe von) steht vor dem Bezugsort immer *de*.
  es.a1.unit08.lesson02.teach.lejos_de:
    title: Weit entfernt von
    gloss: Der Park ist weit vom Markt entfernt.
    note: '*Lejos de* (weit entfernt von) ist das Gegenteil von *cerca de*.'
  es.a1.unit08.lesson02.teach.al_lado_de:
    title: Neben
    gloss: Die Bank ist neben dem Markt.
    note: '*Al lado de* (neben) ist eine feste Wendung (*al* = *a* + *el lado*). Vor einem männlichen Substantiv wie *mercado* verschmelzen *de* + *el* zu *del*: *al lado del mercado*.'
  es.a1.unit08.lesson02.teach.enfrente_de:
    title: Gegenüber
    gloss: Die Apotheke liegt dem Markt gegenüber.
    note: '*Enfrente de* (gegenüber) beschreibt zwei Orte, die sich auf entgegengesetzten Seiten von etwas befinden, beispielsweise einer Straße.'
  es.a1.unit08.lesson02.teach.entre:
    title: Zwischen
    gloss: Die Bibliothek liegt zwischen der Bank und dem Park.
    note: '*Entre* (zwischen) benötigt zwei Bezugspunkte, die hier mit *y* (und) verbunden werden.'
  es.a1.unit08.lesson03.teach.donde_esta_el_banco:
    title: Fragen, wo die Bank ist
    gloss: Wo ist die Bank?
    note: '*Dónde está* (wo ist) ist die übliche Frageform, um nach dem Standort eines Ortes zu fragen.'
  es.a1.unit08.lesson03.teach.esta_al_lado_del_mercado:
    title: Mit einer Ortsangabe antworten
    gloss: Sie ist neben dem Markt.
    note: '*Del* ist die Zusammenziehung von *de* + *el* und wird vor dem männlichen Substantiv *mercado* benötigt.'
  es.a1.unit08.lesson03.teach.donde_esta_la_farmacia:
    title: Fragen, wo die Apotheke ist
    gloss: Wo ist die Apotheke?
    note: Dasselbe Fragemuster wird auf ein Substantiv mit weiblichem Artikel angewandt – die Frage selbst ändert sich durch das Geschlecht nicht.
  es.a1.unit08.lesson03.teach.esta_enfrente_del_mercado:
    title: 'Antwort: gegenüber'
    gloss: Sie ist gegenüber vom Markt.
    note: '*Enfrente de* + *el mercado* wird zu *enfrente del mercado*: Hier steht dieselbe Zusammenziehung *del* wie in *al lado del mercado*.'
  es.a1.unit08.lesson04.teach.esta_lejos:
    title: Fragen, ob es weit ist
    gloss: Ist es weit weg?
    note: In dieser kurzen Nachfrage wird das Subjekt weggelassen, da aus dem Zusammenhang bereits klar ist, worum es geht.
  es.a1.unit08.lesson04.teach.no_esta_cerca:
    title: 'Antwort: Nein, es ist in der Nähe'
    gloss: Nein, es ist in der Nähe.
    note: '*Cerca* kann allein, also ohne *de*, als kurze Antwort stehen. Wird ein bestimmter Ort genannt, verwendet man hingegen die vollständige Wendung *cerca de*.'
  es.a1.unit08.lesson04.teach.si_esta_lejos:
    title: 'Antwort: Ja, ziemlich weit'
    gloss: Ja, es ist ziemlich weit.
    note: '*Bastante* (ziemlich, recht) verstärkt *lejos*, ist aber weniger stark als *muy* (sehr).'
  es.a1.unit08.lesson05.teach.barrio_reading:
    title: Über das Viertel lesen
    gloss: In diesem Viertel gibt es viele nützliche Orte. Die Bank ist neben dem Markt. Die Apotheke ist gegenüber vom Markt. Der Park ist weit entfernt, aber die Bibliothek liegt zwischen der Bank und dem Park. Das Restaurant ist ganz in der Nähe des Marktes.
    note: Dieser kurze Text führt die Ortsangaben aus dieser Einheit in einer Beschreibung des Viertels zusammen.
    glosses:
      barrio: Viertel
      hay: es gibt (von haber)
      muchos: viele
      lugares: Orte
      útiles: nützlich
      banco: Bank
      está: befindet sich (von estar)
      lado: Seite
      mercado: Markt
      farmacia: Apotheke
      enfrente: gegenüber
      parque: Park
      lejos: weit
      biblioteca: Bibliothek
      entre: zwischen
      restaurante: Restaurant
      cerca: in der Nähe
  es.a1.unit08.lesson05.teach.hay_note:
    title: Hay (es gibt)
    gloss: Warum sich hay im Singular und Plural nie ändert.
    note: Lesen Sie den Text auf der Karte.
    target_text: '*Hay* (es gibt) ändert sich im Singular und Plural nicht: Sowohl *hay un banco* als auch *hay muchos lugares* verwenden dasselbe Wort.'
  es.a1.unit08.lesson06.teach.line01:
    title: Fragen, wo die Bank ist
    gloss: Mateo fragt Elena, wo die Bank ist.
    note: Dieselbe Frage mit *¿Dónde está...?* wie zuvor in dieser Einheit. Elena wird zuerst beim Namen angesprochen, um ihre Aufmerksamkeit zu gewinnen.
  es.a1.unit08.lesson06.teach.line02:
    title: Antworten und auf den Markt Bezug nehmen
    gloss: Elena sagt, dass die Bank neben dem Markt ist, wo sie die Eier gekauft haben.
    note: '*Donde compramos los huevos* (wo wir die Eier gekauft haben) verweist auf ihren Einkauf in Einheit 7.'
  es.a1.unit08.lesson06.teach.line03:
    title: Nach der Apotheke fragen
    gloss: Mateo bestätigt kurz und fragt nach der Apotheke.
    note: '*Ah, sí* (ach ja) ist eine natürliche kurze Bestätigung vor der nächsten Frage.'
  es.a1.unit08.lesson06.teach.line04:
    title: 'Antwort: gegenüber'
    gloss: Elena sagt, dass sie gegenüber vom Markt liegt.
    note: 'Eine kurze Antwort: Das Subjekt (*la farmacia*) wird weggelassen, weil aus der Frage klar ist, worum es geht.'
  es.a1.unit08.lesson06.teach.line05:
    title: Nach dem Park fragen
    gloss: Mateo fragt nach dem Park und ob er in der Nähe ist.
    note: Hier werden zwei Fragen in einem Gesprächsbeitrag verbunden, wie es in lockeren Unterhaltungen üblich ist.
  es.a1.unit08.lesson06.teach.line06:
    title: 'Antworten: weit weg, dann die Bibliothek erwähnen'
    gloss: Elena sagt, dass der Park weit weg ist, die Bibliothek aber zwischen der Bank und dem Park liegt.
    note: '*Pero* (aber) stellt die Entfernung des Parks der günstigeren Lage der Bibliothek gegenüber.'
  es.a1.unit08.lesson06.teach.line07:
    title: Sich bedanken und nach dem Restaurant fragen
    gloss: Mateo bedankt sich bei Elena und fragt nach dem Restaurant, in dem sie gegessen haben.
    note: '*El restaurante donde comimos* (das Restaurant, in dem wir gegessen haben) bezieht sich auf ihr Mittagessen in Einheit 6.'
  es.a1.unit08.lesson06.teach.line08:
    title: Bestätigen, dass es ganz in der Nähe ist
    gloss: Elena bestätigt, dass es ganz in der Nähe des Marktes ist.
    note: '*Muy cerca* (ganz in der Nähe): *muy* (sehr) ist stärker als *bastante* (ziemlich), wie in *bastante lejos* (ziemlich weit weg).'
