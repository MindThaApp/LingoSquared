teaching:
  es.a1.unit06.lesson01.teach.sandwich_ensalada:
    title: Sandwich, Salat
    gloss: Sandwich, Salat
    note: Beide Substantive sind Lehnwörter beziehungsweise angepasste Fremdwörter – *sándwich* ist ein direktes Lehnwort und wird mit einem Akzent geschrieben, der die betonte Silbe kennzeichnet.
    example_gloss:
    - Ich möchte ein Sandwich.
    - Der Salat enthält Tomaten.
  es.a1.unit06.lesson01.teach.sopa:
    title: Suppe
    gloss: Suppe
    note: '*Sopa* ist weiblich, wie die meisten spanischen Substantive auf -a.'
    example_gloss: Die Suppe ist sehr gut.
  es.a1.unit06.lesson01.teach.agua_cafe:
    title: Wasser, Kaffee
    gloss: Wasser, Kaffee
    note: '*Agua* ist grammatisch weiblich, steht im Singular wegen des betonten *a*-Lauts am Wortanfang aber mit dem männlichen Artikel *el* (nicht *la*) – eine echte spanische Besonderheit und kein Tippfehler.'
    example_gloss:
    - Ich möchte Wasser, bitte.
    - Für mich einen Kaffee.
  es.a1.unit06.lesson02.teach.quiero_un_sandwich:
    title: Ich möchte ein Sandwich
    gloss: Ich möchte ein Sandwich.
    note: '*Quiero* (ich möchte) ist die Form der ersten Person Singular von *querer*, einem neuen Verb in dieser Einheit.'
  es.a1.unit06.lesson02.teach.para_mi_un_cafe:
    title: Für mich einen Kaffee
    gloss: Für mich einen Kaffee.
    note: '*Para mí* (für mich) ist eine weitere gängige Wendung beim Bestellen. Dabei wird die Bestellung genannt, ohne ein Verb zu wiederholen – mehr dazu im folgenden Grammatikhinweis.'
  es.a1.unit06.lesson02.teach.que_quieres_comer:
    title: Fragen, was jemand essen möchte
    gloss: Was möchtest du essen?
    note: '*Quieres* ist die *tú*-Form von *querer*, also die informelle Anrede unter Freunden.'
  es.a1.unit06.lesson02.teach.quiero_vs_para_mi_note:
    title: Quiero und Para mí
    gloss: Zwei gleichermaßen natürliche Arten zu bestellen.
    note: '*Quiero un café* und *Para mí, un café* sind beim Bestellen beide passend.'
    target_text: '*Quiero* („ich möchte“) und *Para mí* („für mich“, vor der Nennung der Bestellung) sind in einer ungezwungenen Situation gleichermaßen natürliche und höfliche Arten zu bestellen – keine ist richtiger als die andere.'
  es.a1.unit06.lesson03.teach.el_menu:
    title: Die Speisekarte
    gloss: die Speisekarte
    note: '*Menú* trägt einen Akzent, weil die Betonung auf der letzten Silbe liegt.'
    example_gloss: Können wir die Speisekarte sehen?
  es.a1.unit06.lesson03.teach.podemos_ver_el_menu:
    title: Um die Speisekarte bitten
    gloss: Können wir die Speisekarte sehen?
    note: '*Podemos* (wir können) ist die Form der ersten Person Plural von *poder*, einem neuen Verb in dieser Einheit.'
  es.a1.unit06.lesson03.teach.aqui_tiene:
    title: Bitte schön
    gloss: Bitte schön.
    note: '*Aquí tiene* ist die übliche Wendung, wenn eine Bedienung einem Gast etwas reicht. Dabei wird auch in einem ansonsten ungezwungenen Gespräch die höfliche Verbform *usted* verwendet – es handelt sich um eine feste Höflichkeitsformel, nicht um einen Wechsel der Anrede.'
  es.a1.unit06.lesson03.teach.buen_provecho:
    title: Guten Appetit
    gloss: Guten Appetit
    note: '*Buen provecho* ist die übliche Wendung, bevor jemand zu essen beginnt, und entspricht in seiner Funktion dem deutschen „Guten Appetit“.'
    example_gloss: Bitte sehr. Guten Appetit.
  es.a1.unit06.lesson04.teach.el_postre:
    title: Nachtisch
    gloss: Nachspeise
    note: '*Postre* ist männlich.'
    example_gloss: Als Nachspeise möchte ich Kuchen.
  es.a1.unit06.lesson04.teach.de_postre_quiero_pastel:
    title: Nachtisch bestellen
    gloss: Als Nachspeise möchte ich Kuchen.
    note: '*De postre* (als Nachtisch) leitet ein, was jemand als letzten Gang bestellt, ähnlich wie *para mí* eine Bestellung einleitet.'
  es.a1.unit06.lesson04.teach.la_cuenta_por_favor:
    title: Um die Rechnung bitten
    gloss: Die Rechnung, bitte.
    note: '*La cuenta* (die Rechnung) ist die übliche Formulierung, wenn man am Ende einer Mahlzeit bezahlen möchte.'
  es.a1.unit06.lesson05.teach.menu_reading:
    title: Die Speisekarte lesen
    gloss: 'Speisekarte: Sandwich, fünf. Salat, acht. Suppe, drei. Kaffee oder Wasser, inbegriffen. Nachtisch: Kuchen.'
    note: Ein realistisches Format für eine gedruckte Speisekarte mit den Lebensmitteln aus dieser Lektion und den jeweiligen Preisen.
    glosses:
      Menú: Speisekarte
      sándwich: Sandwich
      Ensalada: Salat
      Sopa: Suppe
      Café: Kaffee
      agua: Wasser
      incluido: inbegriffen
      Postre: Nachspeise
      pastel: Kuchen
  es.a1.unit06.lesson05.teach.incluido_note:
    title: Incluido (inbegriffen)
    gloss: Was es bedeutet, wenn ein Getränk als inbegriffen gekennzeichnet ist.
    note: '*Incluido* = inbegriffen, ohne Aufpreis.'
    target_text: '*Incluido* (inbegriffen) bedeutet, dass ein Getränk ohne Aufpreis zur Mahlzeit gehört.'
  es.a1.unit06.lesson06.teach.line01:
    title: Begrüßen und nach der Bestellung fragen
    gloss: Der Kellner begrüßt Elena und Mateo und fragt, was sie essen möchten.
    note: '*Buenas tardes* (guten Tag) wird ab Mittag verwendet und passt daher zur Mittagszeit.'
  es.a1.unit06.lesson06.teach.line02:
    title: Elena bestellt
    gloss: Elena bestellt einen Salat und Wasser.
    note: '*Una ensalada y agua* = ein Salat und Wasser.'
  es.a1.unit06.lesson06.teach.line03:
    title: Mateo bestellt
    gloss: Mateo bestellt für sich ein Sandwich und einen Kaffee.
    note: Hier wird *Para mí* verwendet, statt *Quiero* zu wiederholen.
  es.a1.unit06.lesson06.teach.line04:
    title: Nach dem Nachtisch fragen
    gloss: Der Kellner bestätigt die Bestellung und fragt, ob sie noch einen Nachtisch möchten.
    note: '*¿Algo de postre?* (etwas zum Nachtisch?) ist eine natürliche, knappe Art, Nachtisch anzubieten.'
  es.a1.unit06.lesson06.teach.line05:
    title: Nachtisch zum Teilen bestellen
    gloss: Elena sagt Ja und bestellt einen Kuchen für sie beide.
    note: '*Para los dos* (für uns beide) bedeutet, dass sie sich einen Nachtisch teilen – eine ganz natürliche Wahl.'
  es.a1.unit06.lesson06.teach.line06:
    title: Zustimmen und um die Rechnung bitten
    gloss: Mateo stimmt zu und bittet um die Rechnung.
    note: '*La cuenta, por favor* = die Rechnung, bitte.'
  es.a1.unit06.lesson06.teach.line07:
    title: Die Rechnung überreichen
    gloss: Der Kellner reicht ihnen die Rechnung.
    note: '*Aquí tiene* sagt man, wenn man jemandem etwas überreicht.'
  es.a1.unit06.lesson06.teach.line08:
    title: Herzlich abschließen
    gloss: Elena bedankt sich beim Kellner und sagt, wie gut das Essen war.
    note: '*¡Qué buena comida!* verwendet dasselbe Ausrufemuster *¡Qué ...!* wie *¡Qué bien!* und *¡Qué bonito!*.'
