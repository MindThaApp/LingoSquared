    title: Wer studiert was?
    gloss: Diego arbeitet nicht nur, er studiert auch. Er besucht an der Sprachschule einen Spanischkurs. Er lernt jede Woche neue Wörter. Lucía macht an der Hochschule eine Ausbildung. Dort studiert sie Gesundheitswissenschaften. Beiden macht das Lernen Spaß. Was studierst du, oder was würdest du gern lernen?
    note: Vergleicht Diegos und Lucías Studium, nach dem Muster des Vergleichstexts in der Technik-Einheit.
