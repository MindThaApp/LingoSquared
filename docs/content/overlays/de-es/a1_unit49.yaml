teaching:
  es.a1.unit49.lesson01.teach.levantarse_me_levanto:
    title: Aufstehen
    gloss: aufstehen → ich stehe auf
    note: '*Levantarse* ist reflexiv: Das Pronomen *me* steht vor dem Verb: *Me levanto*.'
  es.a1.unit49.lesson01.teach.vestirse_me_visto:
    title: Sich anziehen
    gloss: sich anziehen → ich ziehe mich an
    note: '*Vestirse* ist ebenfalls reflexiv: *Me visto*. Hier bedeutet *me* „mich“.'
  es.a1.unit49.lesson01.teach.desayunar_desayuno:
    title: Frühstücken
    gloss: frühstücken → ich frühstücke
    note: '*Desayunar* ist nicht reflexiv: *Desayuno*, ohne *me*.'
  es.a1.unit49.lesson01.teach.trabajar_trabajo:
    title: Arbeiten
    gloss: arbeiten → ich arbeite
    note: '*Trabajar* ist ein regelmäßiges Verb auf -ar: Die *yo*-Form endet auf -o, *trabajo*.'
  es.a1.unit49.lesson01.teach.comer_como:
    title: Essen
    gloss: essen → ich esse
    note: '*Comer* ist ein regelmäßiges Verb auf -er: Die *yo*-Form endet auf -o, *como*.'
  es.a1.unit49.lesson01.teach.lavar_los_platos:
    title: Abwaschen
    gloss: abwaschen → ich wasche ab
    note: '*Lavar los platos* ist nicht reflexiv: *Lavo los platos*. Das Objekt *los platos* steht nach dem Verb.'
  es.a1.unit49.lesson01.teach.dormir_duermo:
    title: Schlafen
    gloss: schlafen → ich schlafe
    note: '*Dormir* ändert in der *yo*-Form den Stammvokal: *duermo* (o wird zu ue).'
  es.a1.unit49.lesson02.teach.con_levantarse_y:
    title: Das reflexive Muster
    gloss: 'Bei levantarse und vestirse steht das Pronomen vor dem Verb: aufstehen → Ich stehe auf.'
    note: 'Bei reflexiven Verben steht *me* vor dem konjugierten Verb: Sagen Sie *Me levanto*, nicht *Levanto me*.'
  es.a1.unit49.lesson02.teach.levantarse_me_levanto:
    title: Levantarse im Satz
    gloss: 'aufstehen: Ich stehe um sieben Uhr auf.'
    note: 'Die Zeitangabe steht nach dem Verb: *Me levanto a las siete*.'
  es.a1.unit49.lesson02.teach.vestirse_me_visto:
    title: Vestirse im Satz
    gloss: 'sich anziehen: Ich ziehe mich an.'
    note: 'Das Muster lautet *me* + *visto*: Das Pronomen steht direkt vor dem Verb.'
  es.a1.unit49.lesson02.teach.lavar_los_platos:
    title: Lavar los platos im Satz
    gloss: 'abwaschen: Ich wasche nach dem Essen ab.'
    note: '*Después de comer* („nach dem Essen“) besteht aus *de* plus Infinitiv und kann am Satzende stehen.'
  es.a1.unit49.lesson02.teach.sin_pronombre_desayuno:
    title: Verben ohne me
    gloss: 'Ohne Pronomen: Ich frühstücke. Ich arbeite. Ich schlafe. Diese Verben sind nicht reflexiv.'
    note: '*Desayuno*, *trabajo* und *duermo* haben kein *me*: Diese Verben sind nicht reflexiv.'
  es.a1.unit49.lesson03.teach.me_levanto_a:
    title: Um halb acht aufstehen
    gloss: Ich stehe um 7:30 Uhr auf.
    note: 'Im Spanischen sagt man „halb“ mit *y media* („und halb“): *las siete y media* ist 7:30 Uhr, also im Deutschen „halb acht“. Vor der Uhrzeit steht *a las*.'
  es.a1.unit49.lesson03.teach.me_visto_a:
    title: Sich um Viertel vor acht anziehen
    gloss: Ich ziehe mich um 7:45 Uhr an.
    note: '*Las ocho menos cuarto* zählt von der nächsten vollen Stunde zurück: 7:45 Uhr.'
  es.a1.unit49.lesson03.teach.desayuno_a_las:
    title: Um acht frühstücken
    gloss: Ich frühstücke um acht Uhr.
    note: 'Vor der Uhrzeit steht *a las*: *a las ocho*. Für ein Uhr heißt es *a la una*.'
  es.a1.unit49.lesson03.teach.trabajo_de_nueve:
    title: Von neun bis fünf arbeiten
    gloss: Ich arbeite von neun bis fünf Uhr.
    note: '*De ... a ...* nennt Beginn und Ende: *de nueve a cinco*.'
  es.a1.unit49.lesson03.teach.como_a_las:
    title: Um halb sieben essen
    gloss: Ich esse um 18:30 Uhr.
    note: '*De la tarde* macht deutlich, dass es Nachmittag oder Abend ist; hier ist *las seis y media* also 18:30 Uhr.'
  es.a1.unit49.lesson03.teach.duermo_a_las:
    title: Um elf schlafen
    gloss: Ich schlafe um elf Uhr.
    note: 'Vor der Uhrzeit steht *a las*: *a las once*.'
  es.a1.unit49.lesson04.teach.primero_luego_despues:
    title: Zuerst, dann, danach
    gloss: zuerst, dann, danach
    note: '*Primero* kennzeichnet die erste Tätigkeit, *luego* die nächste und *después* das, was folgt.'
    example_gloss:
    - Zuerst stehe ich auf.
    - Dann ziehe ich mich an.
    - Danach frühstücke ich.
  es.a1.unit49.lesson04.teach.primero_me_levanto:
    title: Ein Morgen in drei Schritten
    gloss: Zuerst stehe ich auf. Dann ziehe ich mich an. Danach frühstücke ich.
    note: 'Reflexive Verben behalten *me* vor dem Verb: *me levanto*, *me visto*.'
  es.a1.unit49.lesson04.teach.primero_luego_y:
    title: Wörter für die Reihenfolge
    gloss: 'Primero, luego und después bringen Ihre Tätigkeiten in eine Reihenfolge; das Verb verändert sich nicht: Después desayuno.'
    note: 'Wörter für die Reihenfolge stehen am Satzanfang, und die Verbform bleibt gleich: *Después desayuno*.'
  es.a1.unit49.lesson05.teach.mi_dia_me:
    title: Mein Tag
    gloss: Mein Tag – Ich stehe um 7:30 Uhr auf. Danach ziehe ich mich an, und um acht frühstücke ich. Ich arbeite von neun bis fünf. Um 18:30 Uhr esse ich. Danach wasche ich ab. Um elf schlafe ich.
    note: Achten Sie sowohl auf die Reihenfolge der Tätigkeiten als auch auf die Uhrzeiten. Beachten Sie *me levanto* und *me visto* mit *me*.
    glosses:
      Mi: mein
      día: Tag
      levanto: aufstehen (me levanto)
      media: halb (y media = und halb)
      ocho: acht
      Después: danach
      visto: sich anziehen (me visto)
      las: 'die (vor Uhrzeiten: las ocho)'
      desayuno: frühstücken
      Trabajo: arbeiten
      nueve: neun
      cinco: fünf
      siete: sieben
      tarde: am Abend
      como: essen
      lavo: abwaschen (lavo los platos)
      once: elf
      duermo: schlafen
  es.a1.unit49.lesson06.teach.elena_como_es:
    title: Nach dem Tag fragen
    gloss: 'Elena: Wie sieht dein Tag aus, Mateo?'
    note: '*¿Cómo es tu día?* ist eine informelle Art, jemanden zu bitten, seinen Tag zu beschreiben; *tu* ist das vertraute „dein“.'
  es.a1.unit49.lesson06.teach.mateo_me_levanto:
    title: Mateos Morgen
    gloss: 'Mateo: Ich stehe um 7:30 Uhr auf. Danach ziehe ich mich an, und um acht frühstücke ich.'
    note: Mateo verbindet drei Tätigkeiten am Morgen mit *después* und *y*.
  es.a1.unit49.lesson06.teach.elena_cuando_trabajas:
    title: Mateos Arbeitstag
    gloss: 'Elena: Wann arbeitest du? Mateo: Ich arbeite von neun bis fünf.'
    note: 'Elena und Mateo benutzen untereinander die vertrauliche Form *tú*: *¿Cuándo trabajas?*'
  es.a1.unit49.lesson06.teach.mateo_a_las:
    title: Mateos Abend
    gloss: 'Mateo: Um halb sieben abends esse ich. Danach spüle ich das Geschirr. Um elf schlafe ich.'
    note: '*Después* steht am Satzanfang, aber die Verbform bleibt gleich: *después lavo*.'
  es.a1.unit49.lesson06.teach.elena_me_levanto:
    title: Elenas Morgen
    gloss: 'Elena: Ich stehe um sechs auf, frühstücke aber erst um halb sieben.'
    note: '*No ... hasta* bedeutet „erst um/bis“. Elena stellt ihre Aufstehzeit der Frühstückszeit gegenüber.'
