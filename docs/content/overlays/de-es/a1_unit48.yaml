answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spanisch A1
  description: 'Spanisch für Anfänger: Freizeitaktivitäten beschreiben – Hobby-Wortschatz, Häufigkeitsausdrücke, Fragen und Antworten dazu, was jemand in der Freizeit macht, und der Vergleich der Hobbys zweier Personen.'
units:
  es.a1.unit48.hobbies:
    title: Hobbys und Freizeit
