  es.a1.unit48.lesson01.leer_hacer_deporte_y:
    title: Lesen, Sport und Kochen
  es.a1.unit48.lesson02.musica_dibujar_y_videojuegos:
    title: Musik, Zeichnen und Gaming
  es.a1.unit48.lesson03.que_haces_en_tu:
    title: Was machst du in deiner Freizeit?
  es.a1.unit48.lesson04.elena_y_mateo_hablan:
    title: Elena und Mateo sprechen über Hobbys
  es.a1.unit48.lesson05.mateo_y_elena_comparan:
    title: Mateo und Elena vergleichen ihre Hobbys
  es.a1.unit48.lesson06.planear_un_fin_de:
    title: Ein gemeinsames Wochenende planen
teaching:
  es.a1.unit48.lesson01.teach.leer_hacer_deporte:
    title: Lesen, Sport, Kochen
    gloss: lesen, Sport treiben, kochen
    note: 'Drei häufige Hobby-Verben: *leer* (lesen), *hacer deporte* (Sport treiben) und *cocinar* (kochen).'
    example_gloss:
    - Ich lese gern ein Buch.
    - Ich treibe samstags Sport.
    - Ich koche gern für Freunde.
  es.a1.unit48.lesson01.teach.el_tiempo_libre:
    title: Freizeit
    gloss: Freizeit
    note: '*El tiempo libre* ist ein maskuliner Ausdruck und der Schlüsselausdruck, um über Hobbys zu sprechen.'
    example_gloss: In meiner Freizeit lese ich gern.
  es.a1.unit48.lesson01.teach.en_mi_tiempo:
    title: Sagen, was man in der Freizeit macht
    gloss: In meiner Freizeit lese ich gern.
    note: '*Me gusta leer* („ich lese gern“) besteht aus *gustar* + Infinitiv; *me gusta* bleibt bei jeder Tätigkeit gleich.'
  es.a1.unit48.lesson02.teach.escuchar_musica_dibujar:
    title: Musik, Zeichnen, Gaming
    gloss: Musik hören, zeichnen, Videospiele spielen
    note: 'Drei weitere Hobby-Verben: *escuchar música* (Musik hören), *dibujar* (zeichnen) und *jugar videojuegos* (Videospiele spielen).'
    example_gloss:
    - Ich höre gern Musik.
    - Ich zeichne oft.
    - Ich spiele gern mit Freunden Videospiele.
  es.a1.unit48.lesson02.teach.me_gusta_escuchar:
    title: Sagen, dass man gern Musik hört
    gloss: Ich höre gern Musik.
    note: '*Escuchar* steht mit direktem Objekt, ohne Präposition: *escuchar música* („Musik hören“).'
  es.a1.unit48.lesson02.teach.me_gusta_jugar:
    title: Sagen, dass man gern mit Freunden Videospiele spielt
    gloss: Ich spiele gern mit Freunden Videospiele.
    note: '*Con amigos* („mit Freunden“) verwendet wieder die Präposition *con* aus früheren Lektionen.'
  es.a1.unit48.lesson03.teach.siempre_a_menudo:
    title: Immer, oft, manchmal, nie
    gloss: immer, oft, manchmal, nie
    note: 'Die vier wichtigsten Häufigkeitsadverbien: *siempre* (immer), *a menudo* (oft), *a veces* (manchmal), *nunca* (nie). Sie stehen meist vor dem Verb oder am Satzanfang.'
    example_gloss:
    - Ich treibe immer samstags Sport.
    - Ich lese oft ein Buch.
    - Ich zeichne manchmal.
    - Ich spiele nie Videospiele.
  es.a1.unit48.lesson03.teach.cada_semana_cada:
    title: Jede Woche, jedes Wochenende
    gloss: jede Woche, jedes Wochenende
    note: '*Cada semana* und *cada fin de semana* bedeuten beide „jede/jedes“; *cada* verändert seine Form nie.'
    example_gloss:
    - Ich koche jede Woche für Freunde.
    - Ich treibe jedes Wochenende Sport.
  es.a1.unit48.lesson03.teach.con_palabras_femeninas:
    title: Cada ändert sich nie
    gloss: 'Cada bleibt immer gleich: cada semana, cada fin de semana.'
    note: '*Cada* ändert sich nie: Es steht unverändert vor weiblichen (*semana*) und männlichen (*fin de semana*) Nomen.'
  es.a1.unit48.lesson03.teach.que_haces_en:
    title: Nach der Freizeit fragen
    gloss: Was machst du in deiner Freizeit?
    note: Das ist die Kernfrage dieser Lektion – mit ihr können Sie jeden nach seinen Hobbys fragen.
  es.a1.unit48.lesson04.teach.elena_a_menudo:
    title: Elena spricht über Hobbys
    gloss: 'Elena: Wir gehen oft zusammen spazieren. Aber was machst du sonst noch in deiner Freizeit, Mateo?'
    note: '*A menudo paseamos juntos* (wir gehen oft zusammen spazieren): *paseamos* ist die *nosotros*-Form von *pasear*.'
  es.a1.unit48.lesson04.teach.mateo_me_gusta:
    title: Mateos Hobbys
    gloss: 'Mateo: Ich koche gern, auch zu Hause. Und ich mache oft Sport.'
    note: '*También en casa* (auch zu Hause) zeigt, dass Mateo aus Freude kocht und nicht nur in seinem Job im Restaurant.'
  es.a1.unit48.lesson04.teach.elena_cocinas_tambien:
    title: Elena ist überrascht
    gloss: 'Elena: Du kochst auch zu Hause? Du kochst doch schon den ganzen Tag bei der Arbeit!'
    note: '*Todo el día* (den ganzen Tag) betont, wie viel Mateo schon bei der Arbeit kocht.'
  es.a1.unit48.lesson04.teach.mateo_si_pero:
    title: Mateo erklärt
    gloss: 'Mateo: Ja, aber Kochen finde ich entspannend. Und du, was machst du gern?'
    note: '*Cocinar me parece relajante* heißt wörtlich „Kochen scheint mir entspannend“: *me parece* + Adjektiv ist eine natürliche Art, eine Meinung zu äußern.'
  es.a1.unit48.lesson04.teach.elena_me_gusta:
    title: Elenas Hobbys
    gloss: 'Elena: Ich lese gern und höre oft Musik.'
    note: Verbindet zwei Hobby-Verben aus früheren Lektionen in einem Satz mit *y* (und).
  es.a1.unit48.lesson04.teach.mateo_tu_tambien:
    title: Mateo fragt nach Videospielen
    gloss: 'Mateo: Spielst du auch Videospiele?'
    note: Eine kurze Ja-/Nein-Frage mit *jugar videojuegos* aus Lektion 2; *tú también* (du auch) verwendet das vertraute *tú*.
  es.a1.unit48.lesson04.teach.elena_no_nunca:
    title: Elena antwortet
    gloss: 'Elena: Nein, ich spiele nie Videospiele. Aber manchmal zeichne ich!'
    note: '*Nunca* (nie) und *a veces* (manchmal) aus Lektion 3, in einer Antwort gegenübergestellt.'
  es.a1.unit48.lesson05.teach.mateo_y_yo:
    title: Hobbys im Vergleich
    gloss: Mateo und ich gehen oft zusammen spazieren. Aber wir haben auch andere Hobbys. Mateo kocht gern, auch zu Hause, und macht oft Sport. Ich lese gern und höre oft Musik. Manchmal zeichne ich, aber ich spiele nie Videospiele. Was machst du gern in deiner Freizeit?
    note: Elenas Nachricht fasst Informationen aus Lektion 4 zusammen und endet mit der Kernfrage der Lektion an die Leserin bzw. den Leser.
    glosses:
      paseamos: spazieren gehen
      menudo: oft
      juntos: zusammen
      otras: andere
      cocinar: kocht
      gusta: mag
      casa: zu Hause
      deporte: macht Sport
      leer: lesen
      escucho: hören
      música: Musik
      dibujo: zeichne
      veces: manchmal
      videojuegos: Videospiele spielen
      nunca: nie
      libre: frei
      tiempo: Zeit
  es.a1.unit48.lesson06.teach.mateo_que_haces:
    title: Mateo fragt nach dem Wochenende
    gloss: 'Mateo: Was machst du dieses Wochenende?'
    note: '*Este fin de semana* (dieses Wochenende) verwendet *este* mit dem maskulinen Nomen *fin de semana*.'
  es.a1.unit48.lesson06.teach.elena_todavia_no:
    title: Elena ist unentschlossen
    gloss: 'Elena: Ich weiß es noch nicht. Ich lese gern, aber ich möchte auch rausgehen.'
    note: '*Quiero salir* (ich möchte ausgehen) ist eine gängige Art zu sagen, dass man aus dem Haus will.'
  es.a1.unit48.lesson06.teach.mateo_paseamos_juntos:
    title: Mateo macht einen Vorschlag
    gloss: 'Mateo: Gehen wir zusammen spazieren? Danach koche ich für uns.'
    note: '*Después* (danach) ist ein Wort für die Reihenfolge: *primero*, *luego*, *después*.'
  es.a1.unit48.lesson06.teach.elena_buena_idea:
    title: Elena stimmt zu
    gloss: 'Elena: Gute Idee! Beides gefällt mir: spazieren gehen und kochen.'
    note: '*Las dos cosas* (beides) zeigt, dass Elena zwei Dinge gleich gern mag, nicht eines lieber als das andere.'
  es.a1.unit48.lesson06.teach.mateo_perfecto_entonces:
    title: Mateo bestätigt
    gloss: 'Mateo: Perfekt! Dann sehe ich dich am Samstag!'
    note: Ein freundlicher Schlusssatz, der den Plan für *el sábado* (Samstag) bestätigt; im Spanischen steht vor einem bestimmten Wochentag *el*.
