teaching:
  es.a1.unit04.lesson01.teach.dias_entre_semana:
    title: Montag bis Freitag
    gloss: Montag, Dienstag, Mittwoch, Donnerstag, Freitag
    note: Spanische Wochentage werden kleingeschrieben, außer am Satzanfang. Im Deutschen werden Wochentage dagegen großgeschrieben.
    example_gloss:
    - Der Kochkurs findet dienstags statt.
    - Donnerstags lerne ich Spanisch.
  es.a1.unit04.lesson01.teach.fin_de_semana:
    title: Samstag, Sonntag
    gloss: Samstag, Sonntag
    note: '*Sábado* und *domingo* sind die einzigen beiden Wochentage, die im Plural ein -s erhalten (*los sábados*, *los domingos*) – die übrigen Wochentagsnamen sind im Singular und Plural gleich.'
    example_gloss:
    - Samstags gehe ich auf den Markt.
    - Sonntags ruhe ich mich aus.
  es.a1.unit04.lesson01.teach.hoy_es_viernes:
    title: Heute ist Freitag
    gloss: Heute ist Freitag.
    note: Mit *Hoy* (heute), *es* (ist) und dem Namen des Wochentags wird direkt gesagt, welcher Tag heute ist; ein Artikel ist nicht nötig.
  es.a1.unit04.lesson01.teach.el_taller_es_los_martes:
    title: Der Kurs findet dienstags statt
    gloss: Der Kochkurs findet dienstags statt.
    note: '*Los martes* (mit dem Pluralartikel *los*) bedeutet „dienstags“ und bezeichnet einen regelmäßigen Termin, nicht nur einen bestimmten Dienstag.'
  es.a1.unit04.lesson02.teach.meses_primer_semestre:
    title: Januar–Juni
    gloss: Januar, Februar, März, April, Mai, Juni
    note: Anders als im Deutschen werden spanische Monatsnamen kleingeschrieben, außer wenn sie am Satzanfang stehen.
    example_gloss:
    - Mein Geburtstag ist im März.
    - Im Juni ist es heiß.
  es.a1.unit04.lesson02.teach.meses_segundo_semestre:
    title: Juli–Dezember
    gloss: Juli, August, September, Oktober, November, Dezember
    note: '*Septiembre* hat denselben Wortstamm wie das deutsche „September“ – die meisten spanischen Monatsnamen ähneln ihren deutschen Entsprechungen.'
    example_gloss:
    - Der Kochkurs beginnt im Juli.
    - Im Dezember besuche ich meine Familie.
  es.a1.unit04.lesson02.teach.mi_cumpleanos_es_en_marzo:
    title: Mein Geburtstag ist im März
    gloss: Mein Geburtstag ist im März.
    note: '*En* (im) wird mit dem bloßen Monatsnamen verwendet, wenn kein bestimmter Tag genannt wird.'
  es.a1.unit04.lesson03.teach.que_fecha_es_hoy:
    title: Nach dem heutigen Datum fragen
    gloss: Welches Datum ist heute?
    note: '*Qué fecha* (welches Datum) ist die übliche Formulierung, um nach einem Kalenderdatum zu fragen. Sie unterscheidet sich von *qué hora* (wie spät), das in einer späteren Einheit behandelt wird.'
  es.a1.unit04.lesson03.teach.hoy_es_el_veintidos_de_julio:
    title: Ein Datum nennen
    gloss: Heute ist der zweiundzwanzigste Juli.
    note: '*El veintidós de julio* bedeutet wörtlich „die Zweiundzwanzig des Juli“ – im Spanischen wird eine Grundzahl verwendet, im Deutschen dagegen eine Ordnungszahl wie „der zweiundzwanzigste“.'
  es.a1.unit04.lesson03.teach.formato_fecha_note:
    title: Datumsangaben im Spanischen
    gloss: Wie Kalenderdaten auf Spanisch angegeben werden.
    note: Grundzahl + de + Monat. Für den ersten Tag eines Monats ist *el primero* üblich, besonders in Lateinamerika; *el uno* wird ebenfalls verwendet, vor allem in Spanien.
    target_text: 'Im Spanischen wird ein Datum mit einer Grundzahl + de + Monat angegeben: el veintidós de julio heißt wörtlich „der Zweiundzwanzig des Juli“. Im Deutschen verwendet man dagegen eine Ordnungszahl: „der zweiundzwanzigste Juli“. Für den ersten Tag eines Monats sagen viele, besonders in Lateinamerika, *el primero* (der Erste); *el uno* ist ebenfalls üblich, besonders in Spanien.'
  es.a1.unit04.lesson03.teach.cuando_es_el_taller:
    title: Fragen, wann der Kurs stattfindet
    gloss: Wann findet der Kurs statt?
    note: '*Cuándo* (wann) fragt allgemein nach einem Zeitpunkt; *qué fecha* (die andere Frage in dieser Lektion) fragt gezielt nach einem Kalenderdatum – hier sind beide Formulierungen natürlich.'
  es.a1.unit04.lesson03.teach.el_taller_es_el_veintidos_de_julio:
    title: Das Datum des Kurses nennen
    gloss: Der Kurs findet am zweiundzwanzigsten Juli statt.
    note: Hier wird dasselbe Datumsmuster wie in *hoy es el veintidós de julio* verwendet, nur mit einem anderen Subjekt (*el taller*).
  es.a1.unit04.lesson04.teach.cuando_es_tu_cumpleanos:
    title: Nach dem Geburtstag einer Person fragen
    gloss: Wann haben Sie Geburtstag?
    note: '*Tu cumpleaños* (dein Geburtstag) verwendet die informelle *tú*-Anrede unter Freunden.'
  es.a1.unit04.lesson04.teach.mi_cumpleanos_es_el_diez_de_marzo:
    title: Den eigenen Geburtstag nennen
    gloss: Mein Geburtstag ist am zehnten März.
    note: Anders als bei *en marzo* (im März, nur der Monat) steht bei einem vollständigen Geburtstagsdatum *el* vor der Tageszahl, nach demselben Muster wie bei *el veintidós de julio*.
  es.a1.unit04.lesson04.teach.el_de_mateo_es_el_veintidos_de_agosto:
    title: Den Geburtstag einer dritten Person nennen
    gloss: Mateos Geburtstag ist am zweiundzwanzigsten August.
    note: '*El cumpleaños de Mateo* (Mateos Geburtstag) drückt den Besitz mit *de* aus, genau wie *la familia de Elena*.'
  es.a1.unit04.lesson04.teach.felicidades:
    title: Herzlichen Glückwunsch!
    gloss: Herzlichen Glückwunsch! / Alles Gute zum Geburtstag!
    note: '*¡Felicidades!* ist eine allgemein verwendbare Gratulation und wird häufig sowohl zu Geburtstagen als auch bei anderen erfreulichen Nachrichten gebraucht.'
    example_gloss: Herzlichen Glückwunsch, Elena! Heute hast du Geburtstag.
  es.a1.unit04.lesson05.teach.horario_reading:
    title: Den Workshop-Zeitplan lesen
    gloss: Der Kochkurs findet dienstags statt. Der nächste Kurstermin ist am zweiundzwanzigsten Juli. Danach gibt es am neunundzwanzigsten Juli einen weiteren Termin. Der Kurs endet am zwölften August.
    note: Dieser kurze Kursplan verwendet die Wochentagsnamen und das bereits gelernte Datumsmuster in einem zusammenhängenden Text.
    glosses:
      taller: Kurs
      cocina: Kochen
      martes: dienstags
      próxima: nächste
      clase: Unterrichtsstunde
      veintidós: zweiundzwanzig
      julio: Juli
      Después: danach
      hay: es gibt (von haber)
      veintinueve: neunundzwanzig
      termina: endet (von terminar)
      doce: zwölf
      agosto: August
  es.a1.unit04.lesson05.teach.la_proxima_clase:
    title: Der nächste Kurstermin
    gloss: der nächste Kurstermin
    note: '*Próxima* (nächste) stimmt mit dem femininen Substantiv *clase* überein; die maskuline Form lautet *próximo*.'
  es.a1.unit04.lesson05.teach.despues_note:
    title: Después (danach)
    gloss: Wie *después* aufeinanderfolgende Ereignisse verbindet.
    note: '*Después* = nach, danach.'
    target_text: '*Después* (danach, anschließend) verbindet zwei aufeinanderfolgende Ereignisse: zuerst das eine, dann das nächste.'
  es.a1.unit04.lesson06.teach.line01:
    title: Nach dem nächsten Kurstermin fragen
    gloss: Mateo fragt Elena, wann der nächste Termin des Kurses stattfindet.
    note: '*La próxima clase del taller* = der nächste Termin des Kurses.'
  es.a1.unit04.lesson06.teach.line02:
    title: Das Datum nennen
    gloss: Elena bestätigt, dass es der zweiundzwanzigste Juli ist, ein Dienstag.
    note: Elena fügt nach dem Datum *un martes* (ein Dienstag) hinzu und bestätigt damit, dass der Termin am üblichen Kurstag, dem Dienstag, stattfindet.
  es.a1.unit04.lesson06.teach.line03:
    title: Fragen, wann der Kurs endet
    gloss: Mateo fragt, wann der Kurs endet.
    note: '*Perfecto* (perfekt) ist eine natürliche kurze Bestätigung, bevor man eine Anschlussfrage stellt.'
  es.a1.unit04.lesson06.teach.line04:
    title: Das Enddatum nennen
    gloss: Elena sagt, dass er am zwölften August endet.
    note: Dasselbe Enddatum wie auf dem gedruckten Kursplan.
  es.a1.unit04.lesson06.teach.line05:
    title: Mitten im Gespräch nach einem Geburtstag fragen
    gloss: Mateo sagt „übrigens“ und fragt, wann Elena Geburtstag hat.
    note: '*Por cierto* (übrigens) leitet in einem laufenden Gespräch auf natürliche Weise einen Themenwechsel ein.'
  es.a1.unit04.lesson06.teach.line06:
    title: Das Datum nennen und die Gegenfrage stellen
    gloss: 'Elena sagt, dass es der zehnte März ist, und fragt dann: „Und deiner?“'
    note: '*¿Y el tuyo?* (und deiner?) verwendet das Possessivpronomen *tuyo*. Mit dieser neuen Kurzform stellt man eine Gegenfrage zu etwas, das bereits genannt wurde (*cumpleaños* ist maskulin, daher *tuyo* und nicht *tuya*).'
  es.a1.unit04.lesson06.teach.line07:
    title: Mateos Geburtstag nennen
    gloss: 'Mateo sagt: der zweiundzwanzigste August.'
    note: Eine kurze, vollständige Antwort mit dem bekannten Datumsmuster, ohne „mi cumpleaños es“ zu wiederholen – ganz natürlich in einem kurzen Gespräch.
  es.a1.unit04.lesson06.teach.line08:
    title: Reagieren und den zeitlichen Zusammenhang nennen
    gloss: Elena reagiert erfreut und stellt fest, dass sein Geburtstag nach dem Ende des Kurses liegt.
    note: '*Es después del taller* (er ist nach dem Kurs): Der 22. August liegt nach dem Kursende am 12. August.'
