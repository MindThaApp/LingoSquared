teaching:
  es.a1.unit47.lesson01.teach.llamar:
    title: Anrufen
    gloss: anrufen
    note: Der Infinitiv des Verbs für „telefonisch anrufen“.
    example_gloss: Ich muss dich anrufen.
  es.a1.unit47.lesson01.teach.te_llamo:
    title: Sagen, dass man anruft
    gloss: Ich rufe dich an.
    note: '*Llamo* ist die *yo*-Form von *llamar*; mit *te* bedeutet es „ich rufe dich an“. Wie im Deutschen steht hier das Präsens, um etwas Zukünftiges auszudrücken.'
  es.a1.unit47.lesson01.teach.hola_soy_elena:
    title: Ans Telefon gehen
    gloss: Hallo, hier ist Elena.
    note: Am Telefon nennt man im Spanischen seinen Namen mit *soy* + Name (wörtlich „ich bin“), wo man im Deutschen „hier ist“ sagt.
  es.a1.unit47.lesson01.teach.hola_soy_mateo:
    title: Mateo meldet sich genauso
    gloss: Hallo, hier ist Mateo.
    note: Dasselbe Muster *soy* + Name wie in *Hola, soy Elena*.
  es.a1.unit47.lesson02.teach.con_quien_hablo:
    title: Fragen, wer anruft
    gloss: Mit wem spreche ich?
    note: '*¿Con quién hablo?* ist die übliche Frage, wenn man nicht weiß, wer anruft.'
  es.a1.unit47.lesson02.teach.habla_con_elena:
    title: Sich förmlich melden
    gloss: Sie sprechen mit Elena.
    note: '*Habla con* + Name verwendet die Höflichkeitsform *usted* von *hablar*: das höfliche Gegenstück zu *soy* + Name.'
  es.a1.unit47.lesson03.teach.puedes_repetir_eso:
    title: Um Wiederholung bitten
    gloss: Kannst du das wiederholen?
    note: '*¿Puedes...?* (Kannst du ...?) plus *repetir* (wiederholen) plus *eso* (das).'
  es.a1.unit47.lesson03.teach.no_hables_tan:
    title: Jemanden bitten, langsamer zu sprechen
    gloss: Sprich nicht so schnell, bitte.
    note: '*No hables* ist der verneinte Imperativ (du-Form) von *hablar*; *tan rápido* (so schnell) gibt das Maß an.'
  es.a1.unit47.lesson03.teach.no_te_oigo:
    title: Sagen, dass man schlecht hört
    gloss: Ich kann dich nicht gut hören.
    note: '*Oír* (hören) mit *no ... bien* (nicht gut) drückt ein Hörproblem aus, im Unterschied zu *entender* (verstehen); *te oigo* bedeutet „ich höre dich“.'
  es.a1.unit47.lesson04.teach.el_mensaje:
    title: Textnachricht
    gloss: die Textnachricht
    note: 'Ein maskulines Nomen: *el mensaje*. Man sagt auch *el SMS* oder *el texto*, aber *mensaje* ist die neutrale Wahl.'
    example_gloss: Die Textnachricht ist von Elena.
  es.a1.unit47.lesson04.teach.te_envio_un:
    title: Sagen, dass man eine Nachricht schickt
    gloss: Ich schicke dir eine Nachricht.
    note: '*Enviar* (schicken) steht nach dem Pronomen *te* (dir): *te envío un mensaje*.'
  es.a1.unit47.lesson04.teach.te_llamo_mas:
    title: Sagen, dass man zurückruft
    gloss: Ich rufe dich später zurück.
    note: '*Más tarde* (später) steht am Satzende: *te llamo más tarde*.'
  es.a1.unit47.lesson05.teach.mateo_hola_elena:
    title: Einen Nachrichtenaustausch lesen
    gloss: 'Mateo: Hallo Elena, kannst du mich anrufen? Ich muss dir etwas erzählen. Elena: Ja, klar, ich rufe dich in fünf Minuten zurück.'
    note: Achten Sie darauf, worum Mateo bittet, warum und wann Elena zurückruft.
    glosses:
      Hola: hallo
      puedes: kannst
      llamarme: anrufen
      Tengo: müssen
      algo: etwas
      contarte: erzählen
      claro: natürlich
      llamada: anrufen
      cinco: fünf
      minutos: Minuten
      devuelvo: zurück
  es.a1.unit47.lesson06.teach.mateo_hola_soy:
    title: Mateo nimmt den Anruf an
    gloss: 'Mateo: Hallo, hier ist Mateo.'
    note: 'Dasselbe Muster *soy* + Name wie in der ersten Lektion, jetzt im echten Telefonat: Wer abhebt, spricht zuerst und nennt seinen Namen.'
  es.a1.unit47.lesson06.teach.elena_hola_mateo:
    title: Elena meldet sich
    gloss: 'Elena: Hallo Mateo, hier ist Elena. Mateo: Schön, dass du anrufst!'
    note: '*Gracias por llamar* (danke fürs Anrufen) besteht aus *gracias por* + Infinitiv.'
  es.a1.unit47.lesson06.teach.elena_como_ha:
    title: Elena fragt nach der Schicht
    gloss: 'Elena: Wie war deine erste Schicht?'
    note: '*Ha ido* ist das Perfekt von *ir* (hier „verlaufen“): *ha* + das Partizip *ido*.'
  es.a1.unit47.lesson06.teach.mateo_ha_ido:
    title: Mateo berichtet Gutes
    gloss: 'Mateo: Sie ist sehr gut gelaufen, besser als erwartet.'
    note: '*Ha ido muy bien* greift das Perfekt aus der Frage auf; *mejor de lo esperado* (besser als erwartet) wird mit *de lo* verglichen.'
  es.a1.unit47.lesson06.teach.ha_ido_ir:
    title: Ha ido, es, esperado werden mit ihren Infinitiven gezeigt
    gloss: ha ido → ir (gehen), es → ser (sein), esperado → esperar (erwarten)
    note: '*Ha ido*, *es* und *esperado* werden mit ihren Infinitiven gezeigt: *ir*, *ser*, *esperar*. Behandeln Sie *ha ido muy bien* vorerst als feste Wendung; das Perfekt üben Sie später genauer.'
  es.a1.unit47.lesson06.teach.elena_que_bien:
    title: Elena ist stolz
    gloss: 'Elena: Wie schön, das zu hören! Ich bin stolz auf dich.'
    note: '*Orgulloso/a de* (stolz auf) ist eine feste Verbindung mit *de*; das Adjektiv richtet sich nach der sprechenden Person (*orgullosa* bei Elena).'
  es.a1.unit47.lesson06.teach.mateo_muchas_gracias:
    title: Mateo ist gerührt
    gloss: 'Mateo: Vielen Dank, das bedeutet mir viel.'
    note: '*Significa* ist die Form der 3. Person von *significar* (bedeuten); *para mí* (für mich) nennt, wem es wichtig ist.'
  es.a1.unit47.lesson06.teach.su_primer_turno:
    title: Sein
    gloss: Seine erste Schicht ist sehr gut gelaufen.
    note: '*Su* ist hier das Possessivum „sein“ (mit *usted* auch „ihr“ bzw. „Ihr“); aus dem Kontext ergibt sich, wessen etwas ist.'
