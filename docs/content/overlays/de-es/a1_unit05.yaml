teaching:
  es.a1.unit05.lesson01.teach.que_hora_es:
    title: Nach der Uhrzeit fragen
    gloss: Wie spät ist es?
    note: '*Qué hora* („welche Stunde“) fragt nach der Uhrzeit und unterscheidet sich von *qué fecha* („welches Datum“).'
  es.a1.unit05.lesson01.teach.es_la_una:
    title: Es ist ein Uhr
    gloss: Es ist ein Uhr.
    note: Der folgende Grammatikhinweis erklärt, warum nur bei ein Uhr *es* und nicht *son* verwendet wird.
  es.a1.unit05.lesson01.teach.es_vs_son_note:
    title: Es und son bei Uhrzeiten
    gloss: Warum ein Uhr anders ist als alle anderen Uhrzeiten.
    note: '*Es la una* steht im Singular, *son las dos, son las tres...* dagegen im Plural.'
    target_text: 'Bei ein Uhr steht das Verb im Singular: *es* (Es la una). Bei allen anderen Uhrzeiten steht es im Plural: *son* (Son las dos, Son las tres...), denn *la una* ist Singular („die eine [Stunde]“), während *las dos*, *las tres* usw. im Plural stehen.'
  es.a1.unit05.lesson01.teach.son_las_horas:
    title: Zwei, vier, fünf und sieben Uhr
    gloss: Es ist zwei Uhr, vier Uhr, fünf Uhr, sieben Uhr.
    note: '*Son las...* steht bei jeder Uhrzeit außer ein Uhr im Plural, wie im vorherigen Grammatikhinweis erklärt.'
    example_gloss:
    - Es ist zwei Uhr.
    - Es ist vier Uhr.
    - Es ist fünf Uhr.
    - Es ist sieben Uhr.
  es.a1.unit05.lesson02.teach.y_cuarto:
    title: Viertel nach
    gloss: Es ist Viertel nach vier (4:15 Uhr).
    note: '*Y cuarto* (und ein Viertel) fügt der genannten Stunde fünfzehn Minuten hinzu.'
  es.a1.unit05.lesson02.teach.y_media:
    title: Halb nach
    gloss: Es ist halb acht (7:30 Uhr).
    note: '*Y media* (und eine Hälfte) fügt der genannten Stunde dreißig Minuten hinzu.'
  es.a1.unit05.lesson02.teach.menos_cuarto:
    title: Viertel vor
    gloss: Es ist Viertel vor fünf (4:45 Uhr).
    note: Im folgenden Grammatikhinweis erfahren Sie, wie mit *menos* von der nächsten vollen Stunde zurückgerechnet wird.
  es.a1.unit05.lesson02.teach.menos_note:
    title: Menos (vor der vollen Stunde)
    gloss: Wie man im Spanischen die Minuten vor der nächsten vollen Stunde angibt.
    note: '*Las cinco menos cuarto* = Viertel vor fünf (4:45 Uhr).'
    target_text: '*Menos* (minus, vor) zählt von der nächsten vollen Stunde zurück: *las cinco menos cuarto* ist 4:45 Uhr und bedeutet „Viertel vor fünf“, genau wie im Deutschen.'
  es.a1.unit05.lesson03.teach.partes_del_dia:
    title: Morgens, nachmittags, abends und nachts
    gloss: morgens, nachmittags, abends/nachts
    note: '*De la mañana/tarde/noche* verdeutlicht nach einer Uhrzeit, ob morgens, nachmittags, abends oder nachts gemeint ist.'
    example_gloss:
    - Es ist acht Uhr morgens.
    - Der Workshop beginnt um vier Uhr nachmittags.
    - Es ist zehn Uhr abends.
  es.a1.unit05.lesson03.teach.taller_empieza_cuatro_tarde:
    title: Der Workshop beginnt um vier Uhr
    gloss: Der Workshop beginnt um vier Uhr nachmittags.
    note: '*Empieza* (beginnt) ist die Form von *empezar* in der dritten Person Singular, einem neuen Verb in dieser Einheit.'
  es.a1.unit05.lesson03.teach.a_que_hora_empieza:
    title: Nach der Anfangszeit fragen
    gloss: Um wie viel Uhr beginnt der Workshop?
    note: Mit *A qué hora* (um wie viel Uhr) fragt man gewöhnlich danach, wann ein bestimmtes Ereignis stattfindet. Dies unterscheidet sich von der allgemeinen Frage *qué hora es* (wie spät ist es jetzt).
  es.a1.unit05.lesson04.teach.nos_vemos_a_que_hora:
    title: Nach der Uhrzeit für ein Treffen fragen
    gloss: Um wie viel Uhr wollen wir uns treffen?
    note: '*Nos vemos* (wir sehen uns/wir treffen uns) ist eine reflexive Konstruktion, mit der man ein Treffen verabredet.'
  es.a1.unit05.lesson04.teach.nos_vemos_tres_y_media:
    title: Eine Uhrzeit für ein Treffen vorschlagen
    gloss: Treffen wir uns um halb vier?
    note: Hier werden *y media* und *nos vemos* kombiniert, um eine bestimmte Uhrzeit vorzuschlagen.
  es.a1.unit05.lesson04.teach.antes_del_taller:
    title: Vor dem Workshop
    gloss: Das ist vor dem Workshop.
    note: '*Antes de* (vor) ist das Gegenteil von *después* (nach).'
  es.a1.unit05.lesson04.teach.de_acuerdo:
    title: Abgemacht / Okay
    gloss: Abgemacht / Okay
    note: '*De acuerdo* ist eine natürliche, knappe Bestätigung eines Plans und erfüllt eine ähnliche Funktion wie *Muy bien*.'
    example_gloss: Einverstanden, wir treffen uns um halb vier.
  es.a1.unit05.lesson05.teach.horario_dia_reading:
    title: Den Tagesplan lesen
    gloss: Der Workshop beginnt um vier Uhr nachmittags. Davor treffen sich Elena und Mateo um halb vier. Der Workshop endet um sechs Uhr. Am nächsten Tag treffen sie sich um ein Uhr zum Mittagessen.
    note: 'Ein kurzer Tagesplan: ein Treffen, der Workshop und das Mittagessen am nächsten Tag.'
    glosses:
      taller: Workshop
      empieza: beginnt (von empezar)
      cuatro: vier
      tarde: Nachmittag
      Antes: vorher
      ven: treffen sich (von verse)
      tres: drei
      media: halb
      termina: endet (von terminar)
      seis: sechs
      día: Tag
      siguiente: folgend
      almorzar: zu Mittag essen
  es.a1.unit05.lesson05.teach.al_dia_siguiente:
    title: Am nächsten Tag
    gloss: am nächsten Tag / am darauffolgenden Tag
    note: '*Al día siguiente* (am folgenden Tag) ist eine geläufige Wendung, mit der eine Geschichte am nächsten Tag fortgesetzt wird. Davon unterscheidet sich *la próxima clase* (der nächste Unterricht), womit ein bestimmtes Ereignis und kein Kalendertag gemeint ist.'
  es.a1.unit05.lesson06.teach.line01:
    title: Nach dem Workshop nach dem Essen fragen
    gloss: Mateo sagt, dass der Workshop um sechs Uhr endet, und fragt Elena, ob sie danach Hunger hat.
    note: '*Tienes hambre* (hast du Hunger) ist eine neue feste Wendung – wörtlich „du hast Hunger“. Sie verwendet dieselbe Konstruktion wie *tener ... años* und *tener hermanos*.'
  es.a1.unit05.lesson06.teach.line02:
    title: Zustimmen und den nächsten Tag vorschlagen
    gloss: Elena sagt, dass sie ein wenig Hunger hat, und schlägt stattdessen vor, am nächsten Tag essen zu gehen.
    note: Mit *¿Comemos mañana?* wird morgen statt direkt nach dem Workshop vorgeschlagen. So wird zum folgenden Gespräch über eine genaue Uhrzeit übergeleitet.
  es.a1.unit05.lesson06.teach.line03:
    title: Zustimmen und nach der Uhrzeit fragen
    gloss: Mateo findet den Vorschlag gut und fragt nach der Uhrzeit.
    note: '*Buena idea* (gute Idee) ist eine natürliche, knappe Art, einem Vorschlag zuzustimmen.'
  es.a1.unit05.lesson06.teach.line04:
    title: Ein Uhr vorschlagen
    gloss: Elena schlägt ein Treffen um ein Uhr vor.
    note: '*A la una* (um ein Uhr) verwendet wie *Es la una* den Singular *la una*.'
  es.a1.unit05.lesson06.teach.line05:
    title: Bestätigen und ein Restaurant erwähnen
    gloss: Mateo bestätigt das Treffen um ein Uhr und erwähnt ein Restaurant in der Nähe.
    note: '*Hay un restaurante cerca de aquí*: *cerca de* (in der Nähe von) wird hier wie in *cerca de tus padres* auf einen Ort bezogen.'
  es.a1.unit05.lesson06.teach.line06:
    title: Sich herzlich verabschieden
    gloss: Elena reagiert begeistert und verabschiedet sich bis morgen.
    note: '*¡Genial!* (großartig!) beendet das Gespräch begeistert und erfüllt eine ähnliche Funktion wie *¡Qué bien!*.'
