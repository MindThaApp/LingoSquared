    example_gloss: Die Wohnung hat ein Badezimmer.
  es.a1.unit14.lesson01.teach.la_sala:
    title: Das Wohnzimmer
    gloss: das Wohnzimmer
    note: '*Sala* ist feminin.'
    example_gloss: Wir sehen im Wohnzimmer fern.
  es.a1.unit14.lesson01.teach.cocina_ambiguity_note:
    title: 'Cocina: Raum oder Kochen'
    gloss: Wie sich la cocina (Küche) von cocinar (kochen) unterscheidet.
    note: Siehe den Text der Karte.
    target_text: '*La cocina* bedeutet hier „die Küche“ (ein Raum). Das unterscheidet sich von *cocina*/*cocinar* („Kochen“/„kochen“), das in dieser ganzen Geschichte bisher für den Workshop verwendet wurde. Der Kontext zeigt den Unterschied: In *taller de cocina* bedeutet es „Kochen“; *la cocina* einer Wohnung oder eines Hauses ist der Raum; *cocinar* ist das Verb „kochen“.'
  es.a1.unit14.lesson02.teach.alquilar:
    title: Mieten
    gloss: mieten
    note: Der Infinitiv, verwendet in *quiero alquilar* (ich möchte mieten).
  es.a1.unit14.lesson02.teach.el_edificio:
    title: Das Gebäude
    gloss: das Gebäude
    note: '*Edificio* ist maskulin.'
    example_gloss: Das Gebäude liegt in der Nähe des Parks.
  es.a1.unit14.lesson02.teach.desocupado:
    title: Frei / leer stehend
    gloss: frei / leer stehend
    note: '*Desocupado* beschreibt eine Mieteinheit, die gerade leer steht und verfügbar ist.'
  es.a1.unit14.lesson02.teach.grande:
    title: Groß
    gloss: groß
    note: '*Grande* verändert sich im Genus nicht (anders als Adjektive auf -o/-a).'
  es.a1.unit14.lesson02.teach.pequeno:
    title: Klein
    gloss: klein
    note: '*Pequeño/pequeña*, das Gegenteil von *grande*.'
  es.a1.unit14.lesson03.teach.cuantos_dormitorios_tiene:
    title: Nach der Zahl der Schlafzimmer fragen
    gloss: Wie viele Schlafzimmer hat sie?
    note: '*¿Cuántos...tiene?* (Wie viele ... hat es?) ist ein Standardmuster, um nach den Merkmalen einer Wohnung zu fragen.'
  es.a1.unit14.lesson03.teach.tiene_dos_dormitorios_y_una_cocina_grande:
    title: Schlafzimmer und Küche beschreiben
    gloss: Sie hat zwei Schlafzimmer und eine große Küche.
    note: '*Tiene* (es hat) + Anzahl + Nomen, hier mit *dormitorio*, *cocina* und *grande*.'
  es.a1.unit14.lesson04.teach.quiero_alquilar_un_apartamento_con_una_cocina_grande:
    title: Das Wohnungsziel nennen
    gloss: Ich möchte eine Wohnung mit einer großen Küche mieten.
    note: '*Quiero* (ich möchte) + Infinitiv *alquilar*; *con* (mit) leitet das gewünschte Merkmal ein.'
  es.a1.unit14.lesson04.teach.asi_puedes_cocinar_en_casa:
    title: Den Vorteil erklären
    gloss: So kannst du auch zu Hause kochen.
    note: '*Así* (so) + *puedes* (du kannst) + Infinitiv verknüpft das Wohnungsziel mit dem Kochthema der ganzen Geschichte.'
  es.a1.unit14.lesson05.teach.anuncio_reading:
    title: Eine Wohnungsanzeige lesen
    gloss: Freie Wohnung in einem Gebäude in der Nähe des Parks. Sie hat zwei Schlafzimmer, ein Badezimmer, ein Wohnzimmer und eine große Küche. Sie ist perfekt für jemanden, der zu Hause kochen möchte.
    note: Eine realistische Kleinanzeige.
    glosses:
      desocupado: frei / leer stehend
      edificio: Gebäude
      cerca: nah / in der Nähe
      parque: Park
      Tiene: hat (von tener)
      dormitorios: Schlafzimmer
      baño: Badezimmer
      sala: Wohnzimmer
      grande: groß
      perfecto: perfekt
      quiere: möchte (von querer)
      cocinar: kochen
  es.a1.unit14.lesson05.teach.para_alguien_que_note:
    title: Para alguien que...
    gloss: Wie ein Relativsatz den idealen Mieter beschreibt.
    note: Siehe den Text der Karte.
    target_text: '*Para alguien que quiere* („für jemanden, der möchte“) verwendet *alguien* („jemand“) + *que* („der“), um einen Relativsatz einzuleiten – ein häufiges Muster in Anzeigen, die den idealen Mieter beschreiben.'
  es.a1.unit14.lesson06.teach.line01:
    title: Problem und Ziel nennen
    gloss: Mateo sagt, seine Küche sei sehr klein und er wolle eine Wohnung mit einer großen mieten.
    note: Verbindet *mi cocina es muy pequeña* (meine Küche ist sehr klein) mit dem Ziel *quiero alquilar un apartamento con una cocina grande*.
  es.a1.unit14.lesson06.teach.line02:
    title: Vorschlagen, die Anzeigen anzusehen
    gloss: Elena schlägt vor, in die Zeitung zu schauen – es gibt viele Anzeigen.
    note: '*El periódico* (die Zeitung) und *anuncios* (Anzeigen) sind neuer Wortschatz aus dem Alltag der Kleinanzeigen.'
  es.a1.unit14.lesson06.teach.line03:
    title: Eine Anzeige finden
    gloss: Mateo findet ein Gebäude mit einer freien Wohnung.
    note: '*Este edificio* (dieses Gebäude) und *desocupado* (leer stehend, frei).'
  es.a1.unit14.lesson06.teach.line04:
    title: Nach den Schlafzimmern fragen
    gloss: Elena fragt, wie viele Schlafzimmer sie hat.
    note: Die Standardfrage nach den Merkmalen einer Wohnung.
  es.a1.unit14.lesson06.teach.line05:
    title: Mit den Details antworten
    gloss: Mateo sagt, sie habe zwei Schlafzimmer und eine große Küche.
    note: '*Tiene* (es hat) + Anzahl + Nomen.'
  es.a1.unit14.lesson06.teach.line06:
    title: Weitere Merkmale bestätigen
    gloss: Elena freut sich und stellt fest, dass sie auch ein Badezimmer und ein Wohnzimmer hat.
    note: '*Baño* (Badezimmer) und *sala* (Wohnzimmer) vervollständigen die Zimmerliste; *también* (auch) steht am Ende.'
  es.a1.unit14.lesson06.teach.line07:
    title: Sich zum Anruf entscheiden
    gloss: Mateo beschließt, heute die Agentur anzurufen.
    note: '*Voy a llamar* (ich werde anrufen) + *hoy mismo* (noch heute); *la agencia* ist die Vermietungsagentur.'
  es.a1.unit14.lesson06.teach.line08:
    title: Zustimmen und die Szene abschließen
    gloss: Elena stimmt zu und weist darauf hin, dass er so auch zu Hause kochen kann.
    note: '*Así puedes cocinar en casa también* (So kannst du auch zu Hause kochen) schließt die Szene ab.'
