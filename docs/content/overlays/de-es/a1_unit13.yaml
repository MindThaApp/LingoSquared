  es.a1.unit13.lesson01.teach.los_estudiantes:
    title: Die Schüler
    gloss: die Schüler / die Studierenden
    note: '*Estudiante* hat für Männer und Frauen dieselbe Form; der Plural *los estudiantes* bezeichnet auch eine gemischte Gruppe.'
    example_gloss: Ich habe zwanzig Schüler.
  es.a1.unit13.lesson02.teach.trabajar:
    title: Arbeiten
    gloss: arbeiten
    note: Die Grundform (Infinitiv) des Verbs, verwendet in Wendungen wie *me gusta trabajar* (ich arbeite gern).
  es.a1.unit13.lesson02.teach.soy_contador:
    title: Sagen, dass man Buchhalter ist
    gloss: Ich bin Buchhalter.
    note: Berufsbezeichnungen stehen mit *ser* + Beruf ohne Artikel – siehe die Grammatikkarte unten.
  es.a1.unit13.lesson02.teach.soy_profesora:
    title: Sagen, dass man Lehrerin ist
    gloss: Ich bin Lehrerin.
    note: '*Profesora* ist die feminine Form von *profesor*.'
  es.a1.unit13.lesson02.teach.enseno_en_una_escuela:
    title: Sagen, wo man unterrichtet
    gloss: Ich unterrichte an einer Schule.
    note: '*Enseño* (ich unterrichte) ist die Form der ersten Person von *enseñar*, hier mit *escuela* (Schule).'
  es.a1.unit13.lesson02.teach.contador_vs_profesora_note:
    title: Berufsbezeichnungen mit ser
    gloss: Wie man im Spanischen einen Beruf ohne Artikel nennt.
    note: Siehe den Text der Karte.
    target_text: 'Berufsbezeichnungen stehen mit *ser* + Beruf, ohne Artikel: *soy contador* (ich bin Buchhalter), nicht *soy un contador*. *Contador* hat eine passende weibliche Form *contadora*; *profesor/profesora* ist dasselbe Paar aus männlicher und weiblicher Form für „Lehrer/Lehrerin“ (für eine Frau hängt man *-a* an).'
  es.a1.unit13.lesson03.teach.en_que_trabajas:
    title: Nach dem Beruf fragen
    gloss: Was machst du beruflich?
    note: '*¿En qué trabajas?* (wörtlich „In was arbeitest du?“) ist die übliche Frage nach dem Beruf.'
  es.a1.unit13.lesson03.teach.trabajo_en_una_oficina_soy_contador:
    title: Mit dem eigenen Beruf antworten
    gloss: Ich arbeite in einem Büro. Ich bin Buchhalter.
    note: Verbindet *oficina* mit *soy contador* zu einer natürlichen Antwort aus zwei Sätzen.
  es.a1.unit13.lesson04.teach.me_gusta_mi_trabajo:
    title: Sagen, dass man seine Arbeit mag
    gloss: Ich mag meine Arbeit.
    note: Nutzt wieder die Konstruktion mit *gustar* zusammen mit *mi trabajo* (meine Arbeit).
  es.a1.unit13.lesson04.teach.pero_prefiero_cocinar:
    title: Eine Vorliebe ausdrücken
    gloss: Aber ich koche lieber.
    note: '*Prefiero* (ich bevorzuge) kennen Sie bereits; *cocinar* (kochen) ist der Infinitiv der zentralen Tätigkeit dieser ganzen Geschichte.'
  es.a1.unit13.lesson04.teach.los_dos_preferimos_esto:
    title: Sagen, dass man beide dies bevorzugt
    gloss: Wir beide bevorzugen das hier.
    note: '*Preferimos* ist die *nosotros*-Form von *preferir*, die Elena und Mateo verwenden, wenn sie sich einig sind.'
  es.a1.unit13.lesson05.teach.trabajos_reading:
    title: Lesetext über ihre Berufe
    gloss: Mateo arbeitet in London in einem Büro. Er ist Buchhalter. Elena unterrichtet an einer Schule. Sie ist Lehrerin und hat zwanzig Schüler. Beiden gefällt ihre Arbeit, aber sie kochen lieber dienstags zusammen.
    note: Eine kurze Zusammenfassung der Berufe von Mateo und Elena.
    glosses:
      trabaja: arbeitet (von trabajar)
      oficina: Büro
      contador: Buchhalter
      enseña: unterrichtet (von enseñar)
      escuela: Schule
      profesora: Lehrerin
      tiene: hat (von tener)
      veinte: zwanzig
      estudiantes: Schüler
      gusta: gefällt (von gustar)
      trabajo: Arbeit
      prefieren: bevorzugen (von preferir)
      cocinar: kochen
      juntos: zusammen
      martes: dienstags
  es.a1.unit13.lesson05.teach.a_los_dos_les_gusta_note:
    title: A los dos les gusta
    gloss: Wie gustar mit einem Objekt im Plural verwendet wird.
    note: Siehe den Text der Karte.
    target_text: '*A los dos les gusta* (beiden gefällt) überträgt die Konstruktion mit *gustar*, die Sie schon kennen, auf ein indirektes Objekt im Plural – *les* (ihnen) statt *me/te* (mir/dir).'
  es.a1.unit13.lesson06.teach.line01:
    title: Nach Mateos Beruf fragen
    gloss: Elena fragt Mateo, was er beruflich macht.
    note: Die Frage, die Sie schon kennen, nun direkt an Mateo gerichtet.
  es.a1.unit13.lesson06.teach.line02:
    title: Mit seinem Beruf antworten
    gloss: Mateo sagt, dass er in einem Büro als Buchhalter arbeitet.
    note: 'Die vollständige Antwort, die Sie schon kennen: erst wo er arbeitet, dann sein Beruf.'
  es.a1.unit13.lesson06.teach.line03:
    title: Reagieren und den eigenen Beruf nennen
    gloss: Elena findet das interessant und sagt, dass sie Lehrerin ist.
    note: '*Interesante* (interessant) ist ein neues, leicht erkennbares Wort; der Rest, *soy profesora* und *enseño en una escuela*, ist Ihnen schon bekannt.'
  es.a1.unit13.lesson06.teach.line04:
    title: Fragen, ob sie gern unterrichtet
    gloss: Mateo fragt, ob sie gern unterrichtet.
    note: '*¿Te gusta enseñar?* verbindet die bekannte Fragestruktur mit *gustar* und den Infinitiv *enseñar*.'
  es.a1.unit13.lesson06.teach.line05:
    title: Bestätigen und eine Vorliebe ergänzen
    gloss: Elena sagt, dass es ihr sehr gefällt, sie aber dienstags lieber mit ihm kocht.
    note: '*Contigo* (mit dir) ist eine neue verschmolzene Form aus Präposition und Pronomen; *los martes* (dienstags) steht mit dem Plural-Artikel für einen regelmäßigen wöchentlichen Tag.'
  es.a1.unit13.lesson06.teach.line06:
    title: Dieselbe Vorliebe teilen
    gloss: Mateo sagt, dass ihm seine Arbeit auch gefällt, er aber lieber kocht.
    note: '*A mí también* (mir auch) ist das Muster der betonten Zustimmung bei *gustar*: *a mí* hebt hervor, wem etwas gefällt.'
  es.a1.unit13.lesson06.teach.line07:
    title: Das Fazit ziehen
    gloss: Elena schließt daraus, dass sie beide das hier (gemeinsames Kochen) bevorzugen.
    note: '*Entonces* (also/dann) ist ein neues logisches Bindewort; der Rest ist *los dos preferimos esto* (wir beide bevorzugen das hier).'
  es.a1.unit13.lesson06.teach.line08:
    title: Begeistert zustimmen
    gloss: 'Mateo stimmt zu: auf jeden Fall.'
    note: '*Definitivamente* (definitiv) ist ein neues, leicht erkennbares Adverb, das die Szene abschließt.'
