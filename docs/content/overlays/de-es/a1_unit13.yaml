course:
  title: Spanisch A1
  description: 'Den eigenen Beruf beschreiben: Die Geschichte von Elena und Mateo geht weiter. In einer Pause des Workshops am 22. Juli sprechen sie über ihre Berufe – Mateo ist Buchhalter, Elena ist Lehrerin – und stellen fest, dass sie beide lieber zusammen kochen.'
