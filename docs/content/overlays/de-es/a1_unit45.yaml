teaching:
  es.a1.unit45.lesson01.teach.cuanto_cuesta_en:
    title: Nach dem Gesamtpreis fragen
    gloss: Wie viel kostet es insgesamt?
    note: '*En total* macht deutlich, dass Sie den gesamten Preis aller Posten zusammen wissen möchten, nicht den eines einzelnen Artikels.'
  es.a1.unit45.lesson01.teach.cuesta_veinticinco_euros:
    title: Den Gesamtpreis nennen
    gloss: Es kostet insgesamt fünfundzwanzig Euro.
    note: '*Cuesta* ist die dritte Person Singular von *costar* (kosten); der Stammvokal wechselt von *o* zu *ue*, wenn er betont ist.'
  es.a1.unit45.lesson02.teach.pagar_con_tarjeta:
    title: Mit Karte oder bar bezahlen
    gloss: mit Karte bezahlen, bar bezahlen
    note: '*Pagar con tarjeta* (mit Karte bezahlen) und *pagar en efectivo* (bar bezahlen) verwenden unterschiedliche Präpositionen: *con* für das Zahlungsmittel, *en* für die Form des Geldes.'
    example_gloss:
    - Kann ich hier mit Karte zahlen?
    - Ich zahle bar.
  es.a1.unit45.lesson02.teach.puedo_pagar_con:
    title: Fragen, ob Kartenzahlung möglich ist
    gloss: Kann ich hier mit Karte zahlen?
    note: '*Puedo* (ich kann) ist die *yo*-Form von *poder*; *aquí* (hier) bezieht die Frage auf den Ort, an dem Sie sich gerade befinden.'
  es.a1.unit45.lesson02.teach.quiere_pagar_en:
    title: Nach der Zahlungsart fragen
    gloss: Möchten Sie bar oder mit Karte zahlen?
    note: '*Quiere* ist die höfliche *usted*-Form von *querer*, hier von einem fremden Kassierer verwendet; unter Freunden würde man *¿quieres pagar...?* sagen.'
  es.a1.unit45.lesson03.teach.la_cuenta:
    title: Die Rechnung
    gloss: die Rechnung
    note: 'Ein feminines Nomen: *la cuenta*. Im Restaurant bedeutet es die Rechnung, bei der Bank das Konto.'
    example_gloss: Teilen wir die Rechnung?
  es.a1.unit45.lesson03.teach.dividimos_la_cuenta:
    title: Vorschlagen, die Rechnung zu teilen
    gloss: Teilen wir die Rechnung?
    note: '*¿Dividimos...?* verwendet die *nosotros*-Form, um einen Vorschlag zu machen, ähnlich wie das deutsche „Sollen wir …?“.'
  es.a1.unit45.lesson03.teach.puedo_pagar_por:
    title: Bitten, getrennt zu zahlen
    gloss: Darf ich getrennt bezahlen?
    note: '*Por separado* (getrennt) sagt, wie Sie zahlen; *pagar* (bezahlen) ist dafür das alltägliche Verb.'
  es.a1.unit45.lesson04.teach.el_cambio:
    title: Das Wechselgeld
    gloss: das Wechselgeld
    note: 'Ein maskulines Nomen: *el cambio*. Es bedeutet auch eine Änderung jeder Art, zum Beispiel *un cambio de planes*.'
    example_gloss: Hier ist Ihr Wechselgeld.
  es.a1.unit45.lesson04.teach.aqui_tiene_su:
    title: Wechselgeld zurückgeben
    gloss: Hier ist Ihr Wechselgeld.
    note: '*Su* ist das Possessivum, das zur höflichen Anrede *usted* passt („Ihr“); *Aquí tiene* ist die übliche höfliche Wendung, wenn man jemandem etwas reicht.'
  es.a1.unit45.lesson04.teach.no_necesito_cambio:
    title: Wechselgeld ablehnen
    gloss: Ich brauche kein Wechselgeld.
    note: '*Necesitar* (brauchen) steht direkt mit seinem Objekt, ohne Präposition: *necesito cambio*; *no* verneint das Verb.'
  es.a1.unit45.lesson05.teach.treinta_y_cinco:
    title: Fünfunddreißig
    gloss: fünfunddreißig
    note: '*Treinta y cinco* (fünfunddreißig): Von 31 bis 99 verbindet das Spanische Zehner und Einer mit *y*, in getrennten Wörtern geschrieben. Anders als im Deutschen steht der Zehner zuerst.'
    example_gloss: Es kostet fünfunddreißig Euro.
  es.a1.unit45.lesson05.teach.cuenta_dos_platos:
    title: Eine Restaurantrechnung lesen
    gloss: 'Rechnung: zwei Hauptgerichte und zwei Kaffee. Gesamtbetrag: fünfunddreißig Euro. Mit Karte bezahlt.'
    note: Achten Sie darauf, was bestellt wurde, wie hoch der Gesamtbetrag ist und wie bezahlt wurde.
    glosses:
      Cuenta: Rechnung
      dos: zwei
      platos: Hauptgerichte
      cafés: Kaffee
      Total: Gesamtbetrag
      treinta: fünfunddreißig
      euros: Euro
      Pagado: bezahlt
      tarjeta: Karte
  es.a1.unit45.lesson06.teach.elena_pedimos_la:
    title: Elena bittet um die Rechnung
    gloss: 'Elena: Sollen wir die Rechnung bestellen?'
    note: '*Pedir* (bitten um, bestellen) hat *la cuenta* als direktes Objekt: *pedimos la cuenta* (wir bitten um die Rechnung).'
  es.a1.unit45.lesson06.teach.mateo_si_buena:
    title: Mateo fragt nach dem Gesamtbetrag
    gloss: 'Mateo: Ja, gute Idee. Wie viel kostet es insgesamt?'
    note: Greift die Frage *¿cuánto cuesta en total?* aus Lektion 1 wieder auf.
  es.a1.unit45.lesson06.teach.elena_son_treinta:
    title: Elena nennt den Gesamtbetrag
    gloss: 'Elena: Das macht fünfunddreißig Euro. Sollen wir teilen?'
    note: 'Bei Geldbeträgen steht *son*: *son treinta y cinco euros* hat das Verb im Plural, weil der Betrag im Plural steht.'
  es.a1.unit45.lesson06.teach.mateo_no_deja:
    title: Mateo besteht darauf zu zahlen
    gloss: 'Mateo: Nein, lass mich heute zahlen. Du hast mir so sehr geholfen.'
    note: '*Deja que pague yo* (lass mich zahlen) verwendet den Subjuntivo *pague* nach *que*; lernen Sie es vorerst als feste Wendung. *Me has ayudado* ist das Perfekt (du hast mir geholfen).'
  es.a1.unit45.lesson06.teach.elena_que_amable:
    title: Elena ist gerührt
    gloss: 'Elena: Wie lieb von dir! Vielen Dank.'
    note: '*¡Qué amable eres!* („Wie nett du bist!“) verwendet *qué* + Adjektiv, um herzlich auf eine großzügige Geste zu reagieren; *muchas gracias* ist ein stärkeres *Danke*.'
  es.a1.unit45.lesson06.teach.mateo_puedo_pagar:
    title: Mateo fragt nach Kartenzahlung
    gloss: 'Mateo: Kann ich hier mit Karte bezahlen?'
    note: Greift die Frage *¿puedo pagar con tarjeta aquí?* aus Lektion 2 wieder auf, jetzt im richtigen Restaurant.
  es.a1.unit45.lesson06.teach.mateo_paga_la:
    title: 'Paga: die Form für er/sie'
    gloss: Mateo bezahlt die Rechnung.
    note: '*Paga* ist die dritte Person Singular von *pagar* (bezahlen): *Mateo paga la cuenta*.'
