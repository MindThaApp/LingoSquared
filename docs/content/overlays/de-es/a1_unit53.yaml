teaching:
  es.a1.unit53.lesson01.teach.el_animal_la:
    title: Tier, Haustier
    gloss: das Tier / ein Haustier
    note: '*Animal* ist der allgemeine Begriff, *mascota* bedeutet speziell ein Haustier; *mascota* ist weiblich, auch wenn das Tier männlich ist.'
    example_gloss:
    - Ein Hund ist ein Tier.
    - Ein Hund ist auch ein Haustier.
  es.a1.unit53.lesson01.teach.el_perro_el:
    title: Hund und Katze
    gloss: der Hund / die Katze
    example_gloss:
    - Elena hat einen Hund.
    - Diego hat eine Katze.
  es.a1.unit53.lesson01.teach.el_pez_el:
    title: Fisch und Vogel
    gloss: der Fisch / der Vogel
    example_gloss:
    - Opa hat einen Fisch.
    - Nina hat einen Vogel.
  es.a1.unit53.lesson01.teach.tienes_mascota:
    title: Hast du ein Haustier?
    gloss: Hast du ein Haustier?
    note: Dasselbe Fragemuster *¿Tienes ...?* kennen Sie bereits aus früheren Lektionen.
  es.a1.unit53.lesson01.teach.si_tengo_un:
    title: Ja, ich habe einen Hund
    gloss: Ja, ich habe einen Hund.
    note: Eine einfache bejahende Antwort mit dem neuen Wortschatz dieser Lektion.
  es.a1.unit53.lesson01.teach.no_no_tengo:
    title: Nein, ich habe kein Haustier
    gloss: Nein, ich habe kein Haustier.
    note: Bei *No tengo mascota* steht einfach *no* vor dem Verb; siehe die Grammatikanmerkung.
  es.a1.unit53.lesson01.teach.para_decir_que:
    title: 'No tengo: sagen, dass man etwas nicht hat'
    gloss: 'Um zu sagen, dass Sie etwas nicht haben, stellen Sie no vor tengo: No tengo tiempo, no tengo mascota.'
    note: Das Muster *no tengo* kennen Sie schon von *No tengo tiempo*; nur das Nomen ist neu.
  es.a1.unit53.lesson02.teach.sacar_a_pasear:
    title: (Ein Tier) ausführen
    gloss: (ein Tier) ausführen, mit dem Hund rausgehen
    note: '*Sacar a pasear* ist eine feste Wendung: *sacar* („herausnehmen“) + *a pasear* („zum Spazierengehen“).'
    example_gloss: Ich gehe jeden Tag mit dem Hund spazieren.
  es.a1.unit53.lesson02.teach.cuando_el_objeto:
    title: Sacar a pasear und das persönliche a
    gloss: 'Wenn das Objekt ein Tier oder eine Person ist, steht a davor: saco al perro a pasear.'
    note: Hier taucht *saco al perro* von der vorigen Karte wieder auf; das persönliche *a* steht vor Tieren oder Personen, die einem wichtig sind.
  es.a1.unit53.lesson02.teach.dar_de_comer:
    title: Füttern
    gloss: füttern
    example_gloss: Ich füttere jeden Tag die Katze.
  es.a1.unit53.lesson02.teach.jugar_con:
    title: Spielen mit
    gloss: spielen mit
    example_gloss: Diego spielt mit seiner Katze.
  es.a1.unit53.lesson02.teach.saco_al_perro:
    title: Ich gehe jeden Tag mit dem Hund spazieren
    gloss: Ich gehe jeden Tag mit dem Hund spazieren.
    note: '*Sacar a pasear* steht hier zusammen mit *todos los días* (jeden Tag), das Sie schon aus einer früheren Lektion kennen. Außerdem wird *a* + *el* zu *al*.'
  es.a1.unit53.lesson02.teach.le_doy_de:
    title: Ich füttere jeden Tag die Katze
    gloss: Ich füttere jeden Tag die Katze.
    note: '*Dar de comer* (wörtlich „zu essen geben“) bedeutet füttern; *le* steht für das Tier: *le doy de comer al gato*.'
  es.a1.unit53.lesson03.teach.el_plural_termina:
    title: 'Plural: perro → perros'
    gloss: 'Der Plural endet auf -s: perro → perros, gato → gatos. Nach einem Konsonanten steht -es: animal → animales.'
    note: Die regelmäßige spanische Pluralbildung wird hier zum ersten Mal mit Tiernamen als Beispielen eingeführt.
  es.a1.unit53.lesson03.teach.perros_gatos:
    title: Hunde und Katzen
    gloss: Hunde / Katzen
    example_gloss:
    - Mateo liebt Hunde.
    - Lucía liebt Katzen.
  es.a1.unit53.lesson03.teach.peces_pajaros:
    title: Fische und Vögel (Plural)
    gloss: Fische / Vögel
    example_gloss:
    - Ich liebe Fische.
    - Opa liebt Vögel.
  es.a1.unit53.lesson03.teach.me_encantan_los:
    title: Ich liebe Tiere
    gloss: Ich liebe Tiere.
    note: '*Me encantan* steht im Plural, weil *los animales* im Plural steht: Das Verb richtet sich nach dem, was man liebt.'
  es.a1.unit53.lesson03.teach.a_lucia_le:
    title: Lucía liebt Katzen, hat aber kein Haustier
    gloss: Lucía liebt Katzen, aber sie hat kein Haustier.
    note: Bereitet den Gegensatz vor, um den sich der Lesetext der Lektion dreht.
  es.a1.unit53.lesson04.teach.mateo_tienes_mascota:
    title: Mateo fragt nach einem Haustier
    gloss: 'Mateo: Hast du ein Haustier, Elena?'
  es.a1.unit53.lesson04.teach.elena_si_tengo:
    title: Elena hat einen Hund
    gloss: 'Elena: Ja, ich habe einen Hund.'
  es.a1.unit53.lesson04.teach.mateo_como_es:
    title: Mateo fragt, wie er aussieht
    gloss: 'Mateo: Wie ist er?'
    note: Greift *¿Cómo es?* aus der früheren Lektion zum Aussehen wieder auf, hier mit Bezug auf ein Tier.
  es.a1.unit53.lesson04.teach.elena_tiene_el:
    title: Elena beschreibt ihren Hund
    gloss: 'Elena: Er hat braunes Fell und ist klein.'
    note: Greift Wortschatz zu Haarfarbe und Größe aus der Lektion zum Aussehen wieder auf, hier für das Fell eines Tieres statt für die Haare eines Menschen.
  es.a1.unit53.lesson04.teach.el_y_lo:
    title: Él und lo für Tiere
    gloss: Él und lo können sich auch auf ein Tier beziehen, nicht nur auf eine Person.
    note: Bisher stand *él* in diesem Kurs immer für eine Person; hier wird die Verwendung für Tiere ausdrücklich gezeigt, zusammen mit *lo* („ihn, es“) als Objektpronomen.
  es.a1.unit53.lesson04.teach.mateo_lo_sacas:
    title: Mateo fragt nach den Spaziergängen
    gloss: 'Mateo: Gehst du jeden Tag mit ihm spazieren?'
  es.a1.unit53.lesson04.teach.elena_si_lo:
    title: Elena beschreibt ihre Routine
    gloss: 'Elena: Ja, ich gehe jeden Tag mit ihm spazieren und füttere ihn.'
  es.a1.unit53.lesson05.teach.a_mateo_y:
    title: Mateo, Lucía und Diego über Tiere
    gloss: 'Mateo und Lucía lieben beide Tiere, aber keiner von beiden hat ein Haustier. Mateo liebt Hunde und Lucía liebt Katzen. Diego hat tatsächlich ein Haustier: eine Katze. Er spielt oft mit seiner Katze und füttert sie jeden Tag. Hast du ein Haustier?'
    note: Stellt gegenüber, ein Tier zu lieben und es wirklich zu besitzen – das ist der kommunikative Kern dieser Lektion.
    glosses:
      encantan: lieben
      dos: beide
      animales: Tiere
      ninguno: beide
      mascota: Haustier
      perros: Hunde
      gatos: Katzen
      gato: Katze
      juega: spielt
      da: gibt
      todos: jeden
      comer: Futter
  es.a1.unit53.lesson05.teach.diego_juega_a:
    title: Diego spielt oft mit seiner Katze
    gloss: Diego spielt oft mit seiner Katze.
    note: Greift *a menudo* (oft) aus früheren Lektionen wieder auf.
  es.a1.unit53.lesson05.teach.me_encantan_los:
    title: Ich liebe Hunde. Ich habe kein Haustier.
    gloss: Ich liebe Hunde. Ich habe kein Haustier.
    note: Eine Muster-Antwort in zwei Sätzen, die Sie für die Schreibaufgabe der Lektion übernehmen können.
  es.a1.unit53.lesson06.teach.elena_nina_tu:
    title: Elena fragt Nina
    gloss: 'Elena: Nina, hast du auch ein Haustier?'
  es.a1.unit53.lesson06.teach.nina_si_tengo:
    title: Nina hat einen Vogel namens Pico
    gloss: 'Nina: Ja, ich habe einen Vogel. Er heißt Pico.'
    note: '*Se llama* („heißt“) greift die Wendung für den Namen aus der allerersten Lektion wieder auf.'
  es.a1.unit53.lesson06.teach.mateo_que_bien:
    title: Mateo reagiert
    gloss: 'Mateo: Wie schön! Was machst du jeden Tag mit ihm?'
  es.a1.unit53.lesson06.teach.nina_le_doy:
    title: Nina füttert ihn jeden Tag
    gloss: 'Nina: Ich füttere ihn jeden Tag.'
  es.a1.unit53.lesson06.teach.mateo_a_mi:
    title: Mateo liebt auch Vögel
    gloss: 'Mateo: Ich liebe Vögel auch.'
  es.a1.unit53.lesson06.teach.elena_que_bien:
    title: Elena beendet das Gespräch
    gloss: 'Elena: Wie schön! Wir drei lieben Tiere.'
    note: Schließt den Kreis um alle Aussagen der drei Personen zu Tieren in dieser Lektion.
