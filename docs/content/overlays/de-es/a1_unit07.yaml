teaching:
  es.a1.unit07.lesson01.teach.el_mercado:
    title: Der Markt
    gloss: der Markt
    note: '*Mercado* ist männlich.'
    example_gloss: Gehen wir auf den Markt.
  es.a1.unit07.lesson01.teach.fruta_verdura:
    title: Obst, Gemüse
    gloss: Obst, Gemüse
    note: '*Verdura* bezeichnet Gemüse im Allgemeinen, häufig grünes Gemüse. Es ist ein weibliches Substantiv im Singular und wird auch als Sammelbegriff verwendet, ähnlich wie das deutsche „Grünzeug“.'
    example_gloss:
    - Ich möchte Obst kaufen.
    - Das Gemüse ist frisch.
  es.a1.unit07.lesson01.teach.huevos_pan:
    title: Eier, Brot
    gloss: Eier, Brot
    note: '*Huevos* steht bereits im Plural; der Singular lautet *huevo*. *Pan* (Brot) ist wie im Deutschen eine Stoffbezeichnung und hat in seiner alltäglichen Bedeutung normalerweise keinen Plural.'
    example_gloss:
    - Ich brauche Eier.
    - Das Brot ist von heute Morgen.
  es.a1.unit07.lesson02.teach.cuanto_cuesta:
    title: Nach dem Preis fragen
    gloss: Wie viel kostet es?
    note: '*Cuesta* ist die Form der dritten Person Singular von *costar* (kosten), einem neuen Verb in dieser Lektion.'
  es.a1.unit07.lesson02.teach.cuanto_es:
    title: Eine andere Form der Preisfrage
    gloss: Wie viel macht das?
    note: Die folgende Grammatiknotiz vergleicht diese Form mit *¿Cuánto cuesta?*.
  es.a1.unit07.lesson02.teach.cuesta_dos:
    title: Einen Preis nennen
    gloss: Es kostet zwei.
    note: 'Eine kurze, vollständige Preisangabe: Die Währung oder Einheit ergibt sich aus dem Zusammenhang. Auch im Deutschen nennt man bei einem Einkauf häufig einfach nur eine Zahl.'
  es.a1.unit07.lesson02.teach.cuanto_cuesta_vs_es_note:
    title: Cuánto cuesta und Cuánto es
    gloss: Zwei gleichermaßen natürliche Fragen nach dem Preis.
    note: Lesen Sie den Text auf der Karte.
    target_text: '*¿Cuánto cuesta?* (wie viel kostet es?) und *¿Cuánto es?* (wie viel macht das?) sind beides natürliche Fragen nach dem Preis und in dieser alltäglichen Einkaufssituation austauschbar.'
  es.a1.unit07.lesson03.teach.una_docena_de_huevos:
    title: Um ein Dutzend Eier bitten
    gloss: Ein Dutzend Eier, bitte.
    note: '*Docena* (Dutzend) ist im Spanischen ein Substantiv. Darauf folgen immer *de* und die Ware. Im Deutschen kann „Dutzend“ dagegen direkt vor dem gezählten Substantiv stehen.'
  es.a1.unit07.lesson03.teach.un_kilo_de_tomates:
    title: Um ein Kilo Tomaten bitten
    gloss: Ein Kilo Tomaten, bitte.
    note: Auf *Kilo* folgen wie auf *docena* die Präposition *de* und die Ware.
  es.a1.unit07.lesson03.teach.medio_kilo:
    title: Ein halbes Kilo
    gloss: ein halbes Kilo
    note: '*Medio* (halb) steht vor dem Substantiv, auf das es sich bezieht, und richtet sich nach dessen Geschlecht: *medio kilo* ist männlich, *media docena* wäre weiblich.'
    example_gloss: Ein halbes Kilo Brot, bitte.
  es.a1.unit07.lesson03.teach.un_poco_de:
    title: Ein wenig
    gloss: ein wenig
    note: '*Un poco de* bezeichnet eine unbestimmte kleine Menge, wenn keine genaue Mengenangabe nötig ist.'
    example_gloss: Ich möchte ein wenig Obst.
  es.a1.unit07.lesson04.teach.necesita_algo_mas:
    title: Fragen, ob noch etwas benötigt wird
    gloss: Brauchen Sie noch etwas?
    note: '*Necesita* ist die *usted*-Form von *necesitar*. Diese höfliche Anrede verwendet ein Verkäufer normalerweise gegenüber einem Kunden.'
  es.a1.unit07.lesson04.teach.no_creo_que_ya_tenemos_todo:
    title: Sagen, dass man alles hat
    gloss: Nein, ich glaube, wir haben schon alles.
    note: Mit *Creo que* (ich glaube, dass) lässt sich eine Aussage auf natürliche Weise abschwächen. Hier wird damit bestätigt, dass die Einkaufsliste vollständig ist.
  es.a1.unit07.lesson04.teach.gracias_vendedor:
    title: Sich beim Verkäufer bedanken
    gloss: Perfekt, danke.
    note: Ein kurzer, natürlicher Abschluss eines Einkaufsgesprächs.
  es.a1.unit07.lesson05.teach.etiquetas_reading:
    title: Preisschilder lesen
    gloss: 'Rosas Marktstand: Tomaten, zwei pro Kilo. Eier, vier pro Dutzend. Brot, sechs. Jeden Tag frisches Obst.'
    note: Ein typisches Preisschild an einem Marktstand nennt die Ware, den Preis und danach die Einheit, für die der Preis gilt (*el kilo*, *la docena*). *Puesto* bedeutet Marktstand; dieser hier gehört Rosa.
    glosses:
      Puesto: Stand / Marktstand
      tomates: Tomaten
      kilo: Kilo
      Huevos: Eier
      docena: Dutzend
      Pan: Brot
      Fruta: Obst
      fresca: frisch
      todos: jeder
      días: Tage
  es.a1.unit07.lesson05.teach.el_kilo_note:
    title: El kilo im Sinne von „pro Kilo“
    gloss: Eine Einheit nach einem Preis bedeutet „pro“ diese Einheit.
    note: Lesen Sie den Text auf der Karte.
    target_text: '*El kilo* nach einem Preis ("tomates, dos el kilo") bedeutet „pro Kilo“ – der Preis gilt für jedes Kilo, das Sie kaufen.'
  es.a1.unit07.lesson06.teach.line01:
    title: Vorschlagen, auf den Markt zu gehen
    gloss: Elena schlägt vor, auf dem Markt Zutaten für den nächsten Kurstermin einzukaufen.
    note: '*Para la próxima clase* bedeutet „für den nächsten Kurstermin“, also für das nächste Treffen des Kochkurses.'
  es.a1.unit07.lesson06.teach.line02:
    title: Zustimmen und fragen, was benötigt wird
    gloss: Mateo stimmt zu und fragt, was sie brauchen.
    note: '*¿Qué necesitamos?* verwendet die *nosotros*-Form von *necesitar* und entspricht damit „wir brauchen“.'
  es.a1.unit07.lesson06.teach.line03:
    title: Auf frische Tomaten hinweisen
    gloss: Elena sagt, dass zuerst Gemüse an der Reihe ist, und weist darauf hin, wie frisch die Tomaten aussehen.
    note: '*¡Qué tomates tan frescos!* (was für frische Tomaten!) ist ein Ausruf mit *qué*, wie *¡Qué bonito!* aus Lektion 3, aber mit einem Substantiv gebildet: *qué* + Substantiv + *tan* + Adjektiv.'
  es.a1.unit07.lesson06.teach.line04:
    title: Der Verkäufer fragt nach der Menge
    gloss: Der Verkäufer fragt Elena, wie viel sie möchte.
    note: '*Señorita* ist eine höfliche Anrede für eine junge Frau und passt zur Anrede des Verkäufers mit *usted* gegenüber einer Kundin. Manche empfinden sie heute als etwas altmodisch.'
  es.a1.unit07.lesson06.teach.line05:
    title: Ein Kilo bestellen und nach dem Preis fragen
    gloss: Elena bittet um ein Kilo und fragt nach dem Preis.
    note: Hier werden *un kilo* und das bereits zuvor in dieser Lektion gelernte *¿Cuánto cuesta?* in einem natürlichen Gespräch verbunden.
  es.a1.unit07.lesson06.teach.line06:
    title: Den Preis nennen
    gloss: Der Verkäufer sagt, dass es zwei kostet.
    note: '*Cuesta dos* – eine kurze Preisangabe, bei der die Währung aus dem Zusammenhang hervorgeht.'
  es.a1.unit07.lesson06.teach.line07:
    title: Mateo bestellt Eier und Brot
    gloss: Mateo sagt, dass er ein Dutzend Eier und Brot braucht.
    note: Hier werden *huevos*/*pan* und das bereits zuvor in dieser Lektion gelernte *una docena de* verbunden. *yo* ist optional und hebt die Person etwas hervor („Ich brauche …“).
  es.a1.unit07.lesson06.teach.line08:
    title: Der Verkäufer nennt beide Preise
    gloss: Der Verkäufer sagt, dass die Eier vier und das Brot sechs kosten.
    note: '*Cuestan* steht im Plural und stimmt mit dem Pluralsubjekt *los huevos* überein. Für die Tomatenmenge wurde dagegen der Singular *cuesta* verwendet.'
  es.a1.unit07.lesson06.teach.line09:
    title: Sich beim Verkäufer bedanken
    gloss: 'Mateo sagt: perfekt, danke.'
    note: Dieselbe kurze Verabschiedung wie zuvor in dieser Lektion.
  es.a1.unit07.lesson06.teach.line10:
    title: Einen Freund fragen, ob noch etwas benötigt wird
    gloss: Elena fragt Mateo, ob er noch etwas braucht.
    note: '*¿Necesitas...?* ist die *tú*-Form für einen Freund; die Form des Verkäufers *¿Necesita...?* gehört zu *usted*.'
  es.a1.unit07.lesson06.teach.line11:
    title: Sagen, dass man alles hat
    gloss: Mateo verneint und sagt, dass er glaubt, sie hätten schon alles.
    note: '*Creo que* (ich glaube, dass) schwächt die Antwort etwas ab; *ya* bedeutet „schon“.'
