teaching:
  es.a1.unit52.lesson01.teach.alto_bajo:
    title: Groß und klein
    gloss: groß / klein
    note: '*Alto* beschreibt eine große und *bajo* eine kleine Person; beide richten sich nach der Person: *alta*, *baja*.'
    example_gloss:
    - Lucía ist groß.
    - Diego ist klein.
  es.a1.unit52.lesson01.teach.mayor_joven:
    title: Alt und jung
    gloss: alt / jung
    note: '*Mayor* und *joven* geben einen allgemeinen Alterseindruck wieder, keine genaue Zahl an Jahren.'
    example_gloss:
    - Opa ist alt.
    - Mateo ist jung.
  es.a1.unit52.lesson01.teach.para_dar_la:
    title: 'Mayor: ein Eindruck, keine Zahl'
    gloss: Für das genaue Alter verwendet man tener años, z. B. ¿Cuántos años tienes?; mayor gibt einen allgemeinen Eindruck ohne Zahl wieder, z. B. El abuelo es mayor.
    note: 'Für das genaue Alter sagt man *tener años*: *¿Cuántos años tienes?* *Mayor* gibt nur einen allgemeinen Eindruck wieder, ohne Zahl.'
  es.a1.unit52.lesson01.teach.lucia_es_alta:
    title: Lucía ist groß und Diego ist klein
    gloss: Lucía ist groß und Diego ist klein.
    note: Ein einfacher Satz mit *y* („und“), der den direkten Vergleich in einer späteren Lektion vorbereitet.
  es.a1.unit52.lesson02.teach.el_pelo:
    title: Haare
    gloss: die Haare
    note: '*El pelo* ist maskulin und bleibt im Singular, wenn man die Haare einer Person als Ganzes meint.'
    example_gloss: Mateo hat kurze schwarze Haare.
  es.a1.unit52.lesson02.teach.rubio_castano_gris:
    title: Blond, braun und grau
    gloss: blond / braun / grau
    note: 'Drei Haarfarben: *rubio* (blond), *castaño* (braun) und *gris* (grau). *Rubio* richtet sich nach dem Nomen: *pelo rubio*, *melena rubia*.'
    example_gloss:
    - Elena hat blonde Haare.
    - Diego hat braune Haare.
    - Opa hat graue Haare.
  es.a1.unit52.lesson02.teach.largo_corto:
    title: Lang und kurz (Haare)
    gloss: lang / kurz (Haare)
    note: '*Largo* (lang) kennen Sie schon aus der Lektion zur Körpergröße, hier für die Haarlänge; *corto* (kurz) ist neu: *el pelo largo*, *el pelo corto*.'
    example_gloss:
    - Lucía hat lange Haare.
    - Diego hat kurze Haare.
  es.a1.unit52.lesson02.teach.el_adjetivo_va:
    title: Das Adjektiv steht nach dem Nomen
    gloss: 'Das Adjektiv steht nach dem Nomen: el pelo corto, el pelo largo, el pelo rubio, el pelo castaño, el pelo gris, el pelo negro.'
    note: 'Im Spanischen steht das Adjektiv meist nach dem Nomen und richtet sich nach ihm: *el pelo corto*, *el pelo rubio*.'
  es.a1.unit52.lesson02.teach.pelo_y_cabello:
    title: Pelo und cabello
    gloss: 'Pelo und cabello bedeuten dasselbe. In diesem Kurs sagen wir pelo: el pelo largo.'
    note: '*Pelo* und *cabello* bedeuten im Alltag beide „Haar“ bzw. „Haare“; in diesem Kurs verwenden wir *pelo*.'
  es.a1.unit52.lesson02.teach.mateo_tiene_el:
    title: Mateo hat kurze schwarze Haare
    gloss: Mateo hat kurze schwarze Haare.
    note: Hier kommt *negro* (schwarz) aus der Einheit über Kleidung wieder vor.
  es.a1.unit52.lesson02.teach.elena_tiene_el:
    title: Elena hat lange blonde Haare
    gloss: Elena hat lange blonde Haare.
    note: Verbindet Länge und Farbe aus dieser Lektion in einem natürlichen Satz.
  es.a1.unit52.lesson03.teach.los_ojos:
    title: Augen
    gloss: die Augen
    note: '*Los ojos* ist der Plural von *el ojo*; beide sind maskulin.'
    example_gloss: Mateo hat braune Augen.
  es.a1.unit52.lesson03.teach.azul_marron_verde:
    title: Blau, braun und grün
    gloss: blau / braun / grün
    note: '*Azul* (blau) und *verde* (grün) haben für beide Geschlechter eine Form; *marrón* (braun) ist das übliche Wort für die Augenfarbe, bei Haaren sagt man *castaño*.'
    example_gloss:
    - Elena hat blaue Augen.
    - Diego hat braune Augen.
    - Lucía hat grüne Augen.
  es.a1.unit52.lesson03.teach.con_ojos_plural:
    title: Ojos verlangt ein Adjektiv im Plural
    gloss: 'Bei ojos (Plural) steht auch das Adjektiv im Plural: ojos azules, ojos marrones, ojos verdes.'
    note: 'Adjektive richten sich im Numerus nach dem Nomen: *ojos* ist Plural, also *azules*, *marrones*, *verdes*.'
  es.a1.unit52.lesson03.teach.como_es_elena:
    title: Wie sieht Elena aus?
    gloss: Wie sieht Elena aus?
    note: '*¿Cómo es ...?* ist die Kernfrage dieser Einheit; mit ihr fragen Sie nach dem Aussehen jeder beliebigen Person.'
  es.a1.unit52.lesson03.teach.elena_tiene_el:
    title: Elena hat lange blonde Haare und blaue Augen
    gloss: Elena hat lange blonde Haare und blaue Augen.
    note: Eine Musterantwort, die Haare und Augen in einem Satz mit *y* verbindet.
  es.a1.unit52.lesson04.teach.elena_viene_una:
    title: Elena stellt Nina vor
    gloss: 'Elena: Ins Sprachencafé kommt ein neues Mädchen. Sie heißt Nina.'
    note: '*Viene* („kommt“) führt jemand Neues ein; *se llama* bedeutet „heißt“.'
  es.a1.unit52.lesson04.teach.mateo_genial_como:
    title: Mateo fragt, wie sie aussieht
    gloss: 'Mateo: Super! Wie sieht sie aus?'
    note: 'Die Kernfrage dieser Einheit ohne Namen: *¿Cómo es?*'
  es.a1.unit52.lesson04.teach.elena_es_baja:
    title: Elena beschreibt Ninas Größe und Haare
    gloss: 'Elena: Sie ist klein und hat kurze blonde Haare.'
    note: Verbindet *baja* aus der ersten Lektion mit dem Haar-Wortschatz; *baja* ist feminin, weil Nina ein Mädchen ist.
  es.a1.unit52.lesson04.teach.mateo_y_los:
    title: Mateo fragt nach ihren Augen
    gloss: 'Mateo: Und die Augen?'
    note: '*¿Y los ojos?* greift das Thema mit dem bestimmten Artikel auf; ein Possessivpronomen wie *sus* ist hier im Spanischen nicht nötig.'
  es.a1.unit52.lesson04.teach.elena_tiene_los:
    title: Elena beschreibt Ninas Augen
    gloss: 'Elena: Sie hat grüne Augen.'
    note: Hier kommt *los ojos verdes* aus der Lektion über Augen wieder vor.
  es.a1.unit52.lesson04.teach.mateo_gracias_entonces:
    title: Mateo wird sie erkennen
    gloss: 'Mateo: Danke! Dann werde ich sie erkennen.'
    note: '*La reconoceré* („ich werde sie erkennen“) ist eine Futurform; *la* bedeutet „sie“ und steht vor dem Verb.'
  es.a1.unit52.lesson05.teach.diego_es_el:
    title: Diego und Lucía im Vergleich
    gloss: Diego und Lucía sind Bruder und Schwester, aber sie sehen verschieden aus. Diego ist klein und hat kurze braune Haare und braune Augen. Lucía ist größer als Diego und hat lange braune Haare und grüne Augen. Und du, wie siehst du aus?
    note: Ein kurzer Vergleich mit allen bisher gelernten Farb- und Längenwörtern; am Ende steht die Kernfrage der Einheit an die Leserin bzw. den Leser.
    glosses:
      hermano: Bruder
      hermana: Schwester
      eres: ist ... (vom Aussehen her)
      diferentes: verschieden
      bajo: klein
      corto: klein
      castaño: braun
      pelo: Haare
      marrones: braun
      ojos: Augen
      alta: größer
      largo: lang
      verdes: grün
      cómo: (Teil von 'cómo es' = wie ... ist/aussieht)
  es.a1.unit52.lesson05.teach.ya_conoces_el:
    title: Das Vergleichsmuster noch einmal anwenden
    gloss: 'Sie kennen das Vergleichsmuster schon: más + Adjektiv + que. Hier wird es mit Personen verwendet: Lucía ist größer als Diego.'
    note: Das Muster *más + adjective + que* aus der Einheit über Vergleiche, jetzt angewendet auf Personen statt auf Gegenstände.
  es.a1.unit52.lesson05.teach.lucia_tiene_el:
    title: Lucía hat längere Haare als Diego
    gloss: Lucía hat längere Haare als Diego.
    note: '*Más largo que* vergleicht zwei Dinge: *el pelo más largo que Diego*; *largo* bleibt maskulin, weil *pelo* maskulin ist.'
  es.a1.unit52.lesson05.teach.tengo_el_pelo:
    title: Ich habe kurze braune Haare
    gloss: Ich habe kurze braune Haare.
    note: Ein Mustersatz in der ersten Person mit *tengo*, den Sie wiederverwenden können, wenn Sie sich selbst beschreiben.
  es.a1.unit52.lesson06.teach.mateo_mira_es:
    title: Mateo entdeckt Nina
    gloss: 'Mateo: Schau mal, ist das Nina? Sie hat kurze blonde Haare und grüne Augen.'
    note: '*Mira* („schau“) ist der informelle Imperativ von *mirar*; hier wird damit auf etwas hingewiesen.'
  es.a1.unit52.lesson06.teach.elena_si_esa:
    title: Elena bestätigt
    gloss: 'Elena: Ja, das ist Nina!'
    note: Eine kurze, natürliche Bestätigung.
  es.a1.unit52.lesson06.teach.nina_hola_eres:
    title: Nina begrüßt Mateo
    gloss: 'Nina: Hallo, bist du Mateo?'
    note: 'Eine einfache, informelle Begrüßungsfrage: *¿Eres ...?*'
  es.a1.unit52.lesson06.teach.mateo_si_encantado:
    title: Mateo begrüßt Nina zurück
    gloss: 'Mateo: Ja! Freut mich, dich kennenzulernen, Nina.'
    note: '*Encantado de conocerte* ist die übliche Wendung beim ersten Treffen; eine Frau sagt *Encantada*.'
  es.a1.unit52.lesson06.teach.nina_encantada_de:
    title: Nina erwidert die Begrüßung
    gloss: 'Nina: Freut mich auch, dich kennenzulernen!'
    note: 'Das ist der Schluss des Dialogs: Mateo hat Nina anhand von Elenas früherer Beschreibung erkannt.'
