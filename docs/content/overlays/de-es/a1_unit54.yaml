  es.a1.unit54.lesson01.teach.con_el_futbol:
    title: Jugar a und hacer bei Sportarten
    gloss: 'Bei Sportarten wie Fußball verwendet man jugar a, bei anderen wie Yoga hacer: juego al fútbol, hago yoga.'
    note: Eine Konstruktion deckt jeden deporte ab – auf dieser Stufe müssen Sie nicht für jede Sportart ein eigenes Verb lernen.
  es.a1.unit54.lesson02.teach.veces_por_semana:
    title: Mal pro Woche
    gloss: Mal pro Woche
    example_gloss: Ich mache zweimal pro Woche Yoga.
  es.a1.unit54.lesson02.teach.ya_conoces_todos:
    title: Veces por semana vs. todos los días/a menudo
    gloss: Sie kennen bereits todos los días (jeden Tag) und a menudo (oft). Dos veces por semana (zweimal pro Woche) ist eine neue, genauere Möglichkeit, die Häufigkeit anzugeben.
    note: Erweitert den Wortschatz zur Häufigkeit, der in der Hobby-Lektion schon eingeführt wurde.
