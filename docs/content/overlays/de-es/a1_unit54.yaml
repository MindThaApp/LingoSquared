    gloss: 'Sie kennen hacer deporte bereits aus der Hobby-Lektion (Hago deporte los sábados – Ich treibe samstags Sport). Jugar al fútbol oder hacer yoga nennt die konkrete Sportart: Juego al fútbol.'
