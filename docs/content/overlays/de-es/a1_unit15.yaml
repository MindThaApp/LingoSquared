course:
  title: Spanisch A1
  description: 'Einfache Vergleiche anstellen: Die Geschichte von Elena und Mateo geht weiter, während sie Mateos alte und neue Wohnung vergleichen, und endet mit einem Vergleich auf Augenhöhe, nämlich ihrer Kochkünste.'
