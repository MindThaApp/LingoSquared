teaching:
  es.a1.unit15.lesson01.teach.mas_que:
    title: Mehr … als
    gloss: mehr … als
    note: '*Más...que* vergleicht zwei verschiedene Mengen oder Dinge – siehe die Grammatikkarte unten.'
    example_gloss: Die neue Wohnung ist größer als die alte.
  es.a1.unit15.lesson01.teach.menos_que:
    title: Weniger … als
    gloss: weniger … als
    note: '*Menos...que* ist das Gegenteil von *más...que*.'
    example_gloss: Die alte Wohnung ist weniger groß als die neue.
  es.a1.unit15.lesson01.teach.tan_como:
    title: So … wie
    gloss: so … wie
    note: '*Tan...como* vergleicht zwei GLEICHE Dinge – eine ganz andere Konstruktion als *más/menos*, nicht bloß eine weitere Möglichkeit, dasselbe zu sagen.'
    example_gloss: Mateo kocht so gut wie Elena.
  es.a1.unit15.lesson01.teach.mas_menos_tan_note:
    title: Ungleichheit und Gleichheit
    gloss: Der Unterschied zwischen más/menos...que und tan...como.
    note: Siehe den Text der Karte selbst.
    target_text: '*Más...que* („mehr … als“) und *menos...que* („weniger … als“) vergleichen zwei VERSCHIEDENE Dinge oder Mengen. *Tan...como* („so … wie“) vergleicht zwei GLEICHE Dinge – eine eigene Konstruktion, nicht einfach ein Synonym von *más/menos*.'
  es.a1.unit15.lesson02.teach.el_nuevo_es_mas_grande:
    title: Die neue Wohnung vergleichen
    gloss: Die neue Wohnung ist größer als die alte.
    note: '*Más grande que* („größer als“) setzt *grande* („groß“) in das Muster *más...que*.'
  es.a1.unit15.lesson02.teach.el_viejo_es_mas_pequeno:
    title: Die alte Wohnung vergleichen
    gloss: Die alte Wohnung ist kleiner als die neue.
    note: '*Más pequeño que* („kleiner als“) verwendet *pequeño* („klein“) und drückt den Vergleich aus der Gegenrichtung aus.'
  es.a1.unit15.lesson03.teach.cual_apartamento_es_mas_grande:
    title: Fragen, welche größer ist
    gloss: Welche Wohnung ist größer?
    note: '*¿Cuál...?* („welche/welcher …?“) + Komparativ ist die übliche Art, nach einem Vergleich zu fragen.'
  es.a1.unit15.lesson03.teach.el_nuevo_es_mas_grande_reply:
    title: Antworten, welche größer ist
    gloss: Die neue ist größer als die alte.
    note: Derselbe Vergleich, jetzt als direkte Antwort auf die Frage mit *¿cuál...?*; *el nuevo* („die neue“) lässt das wiederholte Nomen weg.
  es.a1.unit15.lesson04.teach.mateo_cocina_tan_bien_como_elena:
    title: Kochkünste gleichstellen
    gloss: Mateo kocht so gut wie Elena.
    note: '*Tan bien como* („so gut wie“) verwendet *tan* + Adverb + *como*: das Gleichheitsmuster, hier auf die Art und Weise eines Verbs angewendet statt auf die Größe eines Nomens.'
  es.a1.unit15.lesson04.teach.somos_un_buen_equipo:
    title: Sagen, dass ihr ein gutes Team seid
    gloss: Wir sind ein gutes Team.
    note: '*Somos* („wir sind“) + *un buen equipo* („ein gutes Team“) ist ein natürlicher Schlusssatz nach einem Gleichheitsvergleich.'
  es.a1.unit15.lesson05.teach.comparacion_reading:
    title: Die beiden Wohnungen vergleichen
    gloss: Mateos alte Wohnung hat eine kleine Küche. Die neue Wohnung ist größer, und die Küche ist auch größer. Die alte ist kleiner als die neue, und deshalb möchte Mateo umziehen. Die neue hat mehr Platz zum Kochen.
    note: Eine realistische Zusammenfassung, die beide Wohnungen vergleicht.
    glosses:
      viejo: alt
      tiene: hat (von tener)
      pequeña: klein
      nuevo: neu
      grande: groß
      también: auch
      pequeño: klein
      eso: dass
      quiere: will / möchte (von querer)
      mudarse: umziehen
      espacio: Platz
      cocinar: kochen
  es.a1.unit15.lesson05.teach.por_eso_note:
    title: Por eso (deshalb)
    gloss: Wie por eso einen Grund mit einer Folge verbindet.
    note: Siehe den Text der Karte selbst.
    target_text: '*Por eso* („deshalb“) verbindet einen Grund mit seiner Folge – die kleine Küche ist der Grund, warum Mateo umziehen möchte; dieselbe Ursache-Wirkung-Logik kennen Sie schon von *porque*.'
  es.a1.unit15.lesson06.teach.line01:
    title: Fragen, ob er sie schon gesehen hat
    gloss: Elena fragt Mateo, ob er die neue Wohnung schon gesehen hat.
    note: '*¿Ya viste...?* (Hast du ... schon gesehen?) ist eine neue Frageform der Vergangenheit.'
  es.a1.unit15.lesson06.teach.line02:
    title: Bestätigen, dass sie größer ist
    gloss: Mateo bestätigt, dass sie größer ist als die alte, auch die Küche.
    note: Ein Vergleich mit *más...que*, erweitert durch *la cocina también* (die Küche auch).
  es.a1.unit15.lesson06.teach.line03:
    title: Fragen, welche kleiner ist
    gloss: Elena fragt, welche Wohnung dann kleiner ist.
    note: '*Entonces* (dann/also) ist ein logisches Bindewort, das Sie schon kennen; die Frage folgt dem Muster *¿Cuál...?* mit *pequeño* statt *grande*.'
  es.a1.unit15.lesson06.teach.line04:
    title: Antworten und begründen
    gloss: Mateo sagt, die alte sei kleiner, und deshalb wolle er umziehen.
    note: '*El viejo es más pequeño que el nuevo* plus *por eso quiero mudarme* (deshalb will ich umziehen).'
  es.a1.unit15.lesson06.teach.line05:
    title: Zustimmen, dass es Sinn ergibt
    gloss: 'Elena sagt, das ergebe Sinn: Die neue habe mehr Platz zum Kochen.'
    note: '*Tiene mucho sentido* (das ergibt sehr viel Sinn) ist eine neue Zustimmungsformel; *más espacio para cocinar* bedeutet mehr Platz zum Kochen.'
  es.a1.unit15.lesson06.teach.line06:
    title: Die Überlegung weiterführen
    gloss: 'Mateo stimmt zu und fügt hinzu: Da Elena genauso gut kocht wie er, brauchen die beiden Platz.'
    note: '*Tan bien como* (genauso gut wie), hier im Gespräch angewendet mit *tú cocinas* (du kochst).'
  es.a1.unit15.lesson06.teach.line07:
    title: Das Kompliment zurückgeben
    gloss: Elena stimmt begeistert zu und sagt, er koche genauso gut wie sie.
    note: '*¡Es verdad!* (Das stimmt!) + *tú cocinas tan bien como yo* (du kochst genauso gut wie ich) – derselbe Vergleich mit *tan bien como*, jetzt an Mateo gerichtet.'
  es.a1.unit15.lesson06.teach.line08:
    title: Mit Teamgeist abschließen
    gloss: 'Mateo schließt: Sie sind ein gutes Team.'
    note: '*Somos un buen equipo* (wir sind ein gutes Team) beschließt den Dialog.'
