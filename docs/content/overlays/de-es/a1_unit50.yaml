    title: Elena und Mateo machen einen Plan
teaching:
  es.a1.unit50.lesson01.teach.juntos:
    title: Zusammen
    gloss: zusammen
    note: '*Juntos* macht deutlich, dass man etwas gemeinsam unternimmt; das Wort richtet sich nach den Personen (*juntas*, wenn alle Frauen sind).'
    example_gloss: Trinken wir zusammen einen Kaffee?
  es.a1.unit50.lesson01.teach.tomar_un_cafe:
    title: Kaffee trinken gehen
    gloss: einen Kaffee trinken
    note: Im Spanischen sagt man *tomar un café* (wörtlich „einen Kaffee nehmen“), nicht „Kaffee trinken“ mit einem Verb für „trinken“.
  es.a1.unit50.lesson01.teach.ir_al_cine:
    title: Ins Kino gehen
    gloss: ins Kino gehen
    note: '*Ir al cine* („ins Kino gehen“) ist die übliche Art zu sagen, dass man sich einen Film ansieht; *al* ist *a* + *el*.'
  es.a1.unit50.lesson01.teach.tomamos_un_cafe:
    title: Trinken wir einen Kaffee?
    gloss: Trinken wir einen Kaffee?
    note: '*¿Tomamos ...?* steht im Präsens der *nosotros*-Form und schlägt etwas gemeinsam vor.'
  es.a1.unit50.lesson01.teach.tomamos_algo_es:
    title: ¿Tomamos ...? verwenden
    gloss: ¿Tomamos + etwas? ist die übliche Art, eine gemeinsame Aktivität vorzuschlagen.
    note: 'Die *nosotros*-Form (*tomamos*) wird wie im Deutschen „Wollen wir …?“ für Vorschläge verwendet: *¿Tomamos un café?*'
  es.a1.unit50.lesson01.teach.tienes_ganas_de:
    title: Hast du Lust, ins Kino zu gehen?
    gloss: Hast du Lust, ins Kino zu gehen?
    note: '*¿Tienes ganas de ...?* fragt informell, ob jemand Lust auf etwas hat; nach *de* folgt ein Infinitiv.'
  es.a1.unit50.lesson02.teach.si_que_bien:
    title: Ja, super!
    gloss: Ja, super!
    note: '*¡Sí, qué bien!* ist eine kurze, begeisterte Zusage.'
  es.a1.unit50.lesson02.teach.buena_idea:
    title: Gute Idee
    gloss: Gute Idee!
    note: Mit *¡Buena idea!* sagt man zu, indem man den Vorschlag lobt.
  es.a1.unit50.lesson02.teach.es_un_buen:
    title: Das ist ein guter Plan
    gloss: Das ist ein guter Plan.
    note: Das ist eine etwas ausführlichere positive Antwort.
  es.a1.unit50.lesson02.teach.lo_siento_no:
    title: Mit Grund absagen
    gloss: Tut mir leid, ich kann nicht, weil ich arbeite.
    note: '*Lo siento* mildert die Absage, und *porque* leitet den kurzen Grund ein.'
  es.a1.unit50.lesson02.teach.no_tengo_tiempo:
    title: Ich habe keine Zeit
    gloss: Ich habe keine Zeit.
    note: '*No tengo tiempo* ist ein direkter, aber ganz normaler Grund für eine Absage; *no* steht vor dem Verb.'
  es.a1.unit50.lesson02.teach.lo_siento_no_2:
    title: Freundlich absagen
    gloss: Lo siento + no puedo + ein kurzer Grund macht eine Absage freundlich.
    note: Im Gespräch ist ein Grund nicht nötig, aber mit ihm ist das Muster nützlicher und höflicher.
  es.a1.unit50.lesson03.teach.quedar:
    title: Sich verabreden
    gloss: sich verabreden
    note: '*Quedar* bedeutet „sich verabreden“: *¿Quedamos el viernes?* Viele Lateinamerikaner sagen stattdessen *¿Nos vemos el viernes?*'
    example_gloss: Treffen wir uns am Freitag um 14:30 Uhr?
  es.a1.unit50.lesson03.teach.quedamos_el_viernes:
    title: Freitag um halb drei treffen
    gloss: Treffen wir uns Freitag um 14:30 Uhr?
    note: Hier verbinden sich der Wochentag *el viernes* und *a las* mit der Uhrzeit.
  es.a1.unit50.lesson03.teach.las_dos_y:
    title: Y media heißt halb
    gloss: las dos y media = 2:30 Uhr; a las dos y media nennt die Uhrzeit der Verabredung.
    note: 'Anders als im Deutschen („halb drei“) zählt das Spanische ab der vollen Stunde, die gerade vorbei ist: *las dos y media* ist 2:30 Uhr, wörtlich „zwei und halb“.'
  es.a1.unit50.lesson03.teach.el_viernes_17:
    title: Datum und Uhrzeit
    gloss: am Freitag, dem 17. April, um 15:15 Uhr
    note: 'Wochentage und Monate schreibt man im Spanischen klein, und Datumsangaben enthalten *de*: *el viernes 17 de abril*.'
  es.a1.unit50.lesson03.teach.si_el_viernes:
    title: Die Uhrzeit bestätigen
    gloss: Ja, Freitag um 14:30 Uhr passt mir gut.
    note: '*Me viene bien* („es passt mir“) bestätigt, dass die vorgeschlagene Zeit geht.'
  es.a1.unit50.lesson04.teach.el_mensaje_la:
    title: Nachricht, Einladung, Sprachcafé
    gloss: die Nachricht, die Einladung, das Sprachcafé
    note: '*Un mensaje* ist eine kurze schriftliche oder digitale Nachricht, *una invitación* lädt jemanden zu einer Aktivität ein, und *el café de idiomas* ist der Treffpunkt der Gruppe.'
    example_gloss:
    - Ich habe eine Nachricht von Elena.
    - Das ist eine Einladung ins Sprachcafé.
    - Wir trinken einen Kaffee im Sprachcafé.
  es.a1.unit50.lesson04.teach.hola_mateo_tienes:
    title: Elenas Einladung
    gloss: Hallo Mateo, hast du Lust, am Samstag, dem 18. April, um 14:30 Uhr im Sprachcafé einen Kaffee zu trinken? Viele Grüße, Elena.
    note: 'Achten Sie beim Lesen auf vier Angaben: Aktivität, Datum, Uhrzeit und Ort.'
    glosses:
      Hola: hallo
      ganas: Lust (tener ganas de = Lust haben auf)
      sábado: Samstag
      abril: April
      media: halb (y media = halb)
      dos: zwei
      café: Kaffee
      tomar: trinken / nehmen
      idiomas: Sprachcafé
      saludo: Grüße
  es.a1.unit50.lesson05.teach.hola_mateo_vamos:
    title: Eine Nachricht mit Vorschlag
    gloss: Hallo Mateo, trinken wir Freitag um 14:30 Uhr einen Kaffee? Viele Grüße, Elena.
    note: Die Nachricht enthält eine Begrüßung, eine Aktivität, einen Tag, eine Uhrzeit und eine Schlussformel.
    glosses:
      Hola: hallo
      vamos: wir gehen
      viernes: Freitag
      media: halb (y media = halb)
      dos: zwei
      café: Kaffee
      tomar: trinken / nehmen
      saludo: Grüße
  es.a1.unit50.lesson05.teach.hola_elena_si:
    title: Eine Bestätigung
    gloss: Hallo Elena, ja, super! Freitag um 14:30 Uhr passt mir gut. Bis Freitag! Mateo.
    note: Die Antwort sagt zu und wiederholt zur Bestätigung den Zeitplan.
    glosses:
      Hola: hallo
      bien: schön / super
      viernes: Freitag
      media: halb (y media = halb)
      dos: zwei
      viene: gut / passt
      Hasta: bis / bis dann
  es.a1.unit50.lesson05.teach.un_mensaje_corto:
    title: Was eine Nachricht enthält
    gloss: Eine kurze Nachricht nennt die Aktivität, den Tag oder das Datum und die Uhrzeit.
    note: Gruß und Verabschiedung sind nützlich, aber wichtig sind vor allem die Aktivität und der Zeitpunkt.
  es.a1.unit50.lesson06.teach.elena_tomamos_un:
    title: Elena schlägt einen Kaffee vor
    gloss: 'Elena: Trinken wir am Freitag einen Kaffee? Mateo: Ja, super! Um wie viel Uhr?'
    note: Mateo sagt zur Aktivität zu, bevor er nach der Uhrzeit fragt.
  es.a1.unit50.lesson06.teach.elena_a_las:
    title: Elenas erste Uhrzeit
    gloss: 'Elena: Um 2:30 Uhr.'
    note: '*Las dos y media* bedeutet 2:30 Uhr, wie in der Lektion über die Uhrzeit.'
  es.a1.unit50.lesson06.teach.mateo_lo_siento:
    title: Mateo schlägt eine andere Uhrzeit vor
    gloss: 'Mateo: Tut mir leid, um 2:30 Uhr kann ich nicht. Geht es auch um 3:15 Uhr?'
    note: '*¿Puede ser a ...?* ist eine knappe Art zu fragen, ob eine andere Uhrzeit passt.'
  es.a1.unit50.lesson06.teach.elena_si_a:
    title: Sie bestätigen den endgültigen Plan
    gloss: 'Elena: Ja, um 3:15 Uhr passt mir gut. Mateo: Gute Idee. Dann treffen wir uns am Freitag um 3:15 Uhr.'
    note: Hier ist *quedamos* wieder die *nosotros*-Form, diesmal zur Bestätigung des Plans.
