course:
  title: इतालवी A1
  description: 'किसी व्यक्ति की बुनियादी शारीरिक बनावट बताने के लिए शुरुआती इतालवी: कद और उम्र का अंदाज़ा, बालों और आँखों का रंग, मुख्य प्रश्न Com''è?, और दो लोगों के रूप-रंग की तुलना।'
