teaching:
  it.a1.unit42.lesson01.teach.alto_basso:
    title: लंबा और नाटा
    gloss: लंबा / नाटा
    note: '*Alto* लंबे व्यक्ति के लिए और *basso* छोटे कद के व्यक्ति के लिए आता है। इतालवी विशेषण व्यक्ति के अनुसार बदलते हैं: *alto/alta*, *basso/bassa*।'
    example_gloss:
    - Chiara लंबी है।
    - Luca छोटे कद का है।
  it.a1.unit42.lesson01.teach.anziano_giovane:
    title: बुज़ुर्ग और जवान
    gloss: बुज़ुर्ग / जवान
    note: '*Anziano* (बुज़ुर्ग) और *giovane* (युवा) एक सामान्य छाप बताते हैं, सही वर्षों की संख्या नहीं। *Giovane* के अंत में -e है, इसलिए यह पुरुष और स्त्री दोनों के लिए एक ही रहता है।'
    example_gloss:
    - दादाजी बुज़ुर्ग हैं।
    - Marco युवा है।
  it.a1.unit42.lesson01.teach.per_l_eta:
    title: 'उम्र: avere anni या anziano'
    gloss: 'सही उम्र के लिए इतालवी में avere + anni आता है: Quanti anni hai? सामान्य छाप के लिए विशेषण आता है: Il nonno è anziano.'
    note: हिंदी में हम कहते हैं "मैं 30 साल का हूँ"; इतालवी में कहा जाता है "मेरे पास 30 साल हैं" (*ho trent'anni*)। विशेषण *anziano* इस बात के लिए है कि कोई कितना बड़ा लगता है।
  it.a1.unit42.lesson01.teach.chiara_e_alta:
    title: Chiara लंबी है और Luca छोटे कद का है
    gloss: Chiara लंबी है और Luca छोटे कद का है।
    note: 'दो विशेषण *e* (और) से जुड़े हैं। हर एक अपने व्यक्ति के अनुसार बदलता है: *alta* (स्त्रीलिंग) और *basso* (पुल्लिंग)।'
  it.a1.unit42.lesson02.teach.i_capelli:
    title: बाल
    gloss: बाल
    note: हिंदी के "बाल" की तरह *I capelli* भी इतालवी में बहुवचन है। एक अकेले बाल के लिए एकवचन *il capello* आता है।
    example_gloss: Marco के बाल छोटे और काले हैं।
  it.a1.unit42.lesson02.teach.biondi_castani_grigi:
    title: सुनहरा, भूरा और स्लेटी
    gloss: सुनहरा / भूरा / स्लेटी
    note: 'बालों के तीन रंग पुल्लिंग बहुवचन में, *capelli* के अनुसार: *biondi*, *castani*, *grigi*। बालों के लिए *neri* (काले) भी चलता है।'
    example_gloss:
    - Giulia के बाल सुनहरे हैं।
    - Luca के बाल भूरे हैं।
    - दादाजी के बाल स्लेटी हैं।
  it.a1.unit42.lesson02.teach.lunghi_corti:
    title: लंबे और छोटे (बाल)
    gloss: लंबे / छोटे (बाल)
    note: '*Lunghi* (लंबे) और *corti* (छोटे) *capelli* की तरह बहुवचन हैं। शब्द *alto* (लंबा) केवल लोगों के लिए है, बालों के लिए नहीं।'
    example_gloss:
    - Chiara के बाल लंबे हैं।
    - Luca के बाल छोटे हैं।
  it.a1.unit42.lesson02.teach.i_capelli_sono:
    title: Capelli बहुवचन है
    gloss: 'Capelli बहुवचन है, इसलिए विशेषण भी बहुवचन में आता है: i capelli biondi, castani, grigi, neri, lunghi, corti.'
    note: 'विशेषण संज्ञा के बाद आता है और लिंग व वचन में उसके अनुसार बदलता है: *capelli lunghi* (पुल्लिंग बहुवचन), *occhi azzurri*।'
  it.a1.unit42.lesson02.teach.per_descrivere_una:
    title: बालों और आँखों के साथ avere आता है
    gloss: 'किसी व्यक्ति का वर्णन करने के लिए इतालवी में बालों और आँखों के साथ avere आता है: Giulia ha i capelli biondi e gli occhi azzurri.'
    note: 'हिंदी में "उसके बाल सुनहरे हैं" कहने में आर्टिकल नहीं लगता, पर इतालवी में आर्टिकल ज़रूरी है: *i capelli*, *gli occhi*। आप *è bionda* भी कह सकते हैं, पर यहाँ सीखने लायक ढाँचा *avere* है।'
  it.a1.unit42.lesson02.teach.marco_ha_i:
    title: Marco के बाल छोटे और काले हैं
    gloss: Marco के बाल छोटे और काले हैं।
    note: '*Neri* (काले) पुल्लिंग बहुवचन है, जो *capelli* के अनुसार है।'
  it.a1.unit42.lesson02.teach.giulia_ha_i:
    title: Giulia के बाल लंबे और सुनहरे हैं
    gloss: Giulia के बाल लंबे और सुनहरे हैं।
    note: इस पाठ की लंबाई और रंग की शब्दावली एक स्वाभाविक वाक्य में एक साथ आई है।
  it.a1.unit42.lesson03.teach.gli_occhi:
    title: आँखें
    gloss: आँखें
    note: '*Occhio* (आँख) पुल्लिंग है; इसका बहुवचन *occhi* है और स्वर से शुरू होने के कारण यह *gli* लेता है।'
    example_gloss: Marco की आँखें भूरी हैं।
  it.a1.unit42.lesson03.teach.azzurri_marroni_verdi:
    title: नीला, भूरा और हरा
    gloss: नीला / भूरा / हरा
    note: 'आँखों के रंग: *azzurri* (नीला), *marroni* (भूरा), *verdi* (हरा)। ये बहुवचन रूप दोनों लिंगों के लिए चलते हैं।'
    example_gloss:
    - Giulia की आँखें नीली हैं।
    - Luca की आँखें भूरी हैं।
    - Chiara की आँखें हरी हैं।
  it.a1.unit42.lesson03.teach.anche_gli_occhi:
    title: रंग बहुवचन में बदलते हैं
    gloss: 'आँखों के रंग occhi के अनुसार बहुवचन लेते हैं: occhi azzurri, marroni, verdi.'
    note: 'एकवचन में -e पर समाप्त होने वाले विशेषण (*verde*, *marrone*) बहुवचन में -i पर समाप्त होते हैं: *verdi*, *marroni*।'
  it.a1.unit42.lesson03.teach.com_e_giulia:
    title: Giulia कैसी दिखती है?
    gloss: Giulia कैसी दिखती है?
    note: '*Com''è?* रूप-रंग पूछने का मुख्य प्रश्न है। *Com''è*, *come è* ही है, जिसमें e हटाकर उसकी जगह अपॉस्ट्रॉफ़ी लगाई गई है।'
  it.a1.unit42.lesson03.teach.giulia_ha_i:
    title: Giulia के बाल लंबे और सुनहरे हैं और आँखें नीली हैं
    gloss: Giulia के बाल लंबे और सुनहरे हैं और आँखें नीली हैं।
    note: 'एक नमूना उत्तर: एक ही वाक्य में *avere* + बाल + *e* + आँखें।'
  it.a1.unit42.lesson04.teach.giulia_al_caffe:
    title: Giulia, Nina का परिचय देती है
    gloss: 'Giulia: भाषा-कैफ़े में एक नई लड़की आ रही है। उसका नाम Nina है।'
    note: '*Viene* (आ रही है) किसी नए व्यक्ति का परिचय कराता है। *Si chiama* का अर्थ है "उसका नाम है", शाब्दिक रूप से "वह खुद को बुलाती है"।'
  it.a1.unit42.lesson04.teach.marco_va_bene:
    title: Marco पूछता है कि वह कैसी दिखती है
    gloss: 'Marco: ठीक है! वह कैसी दिखती है?'
    note: 'वही प्रश्न फिर से, बिना नाम के: संदर्भ से स्पष्ट है कि बात किसकी हो रही है।'
  it.a1.unit42.lesson04.teach.giulia_e_bassa:
    title: Giulia, Nina के कद और बालों का वर्णन करती है
    gloss: 'Giulia: वह छोटे कद की है और उसके बाल छोटे और सुनहरे हैं।'
    note: '*È bassa* (वह छोटे कद की है) में स्त्रीलिंग *bassa* आता है; इसके बाद बालों का वर्णन *ha* के साथ आता है।'
  it.a1.unit42.lesson04.teach.marco_e_gli:
    title: Marco उसकी आँखों के बारे में पूछता है
    gloss: 'Marco: और आँखें?'
    note: '*E gli occhi?* में क्रिया नहीं है। हिंदी की तरह इतालवी में भी जो शब्द संदर्भ से साफ़ हों, उन्हें अक्सर छोड़ दिया जाता है।'
  it.a1.unit42.lesson04.teach.giulia_ha_gli:
    title: Giulia, Nina की आँखों का वर्णन करती है
    gloss: 'Giulia: उसकी आँखें हरी हैं।'
    note: '*Ha gli occhi verdi*: कर्ता सर्वनाम की ज़रूरत नहीं, क्योंकि क्रिया का रूप ही बता देता है कि बात "उसकी" हो रही है।'
  it.a1.unit42.lesson04.teach.marco_grazie_allora:
    title: Marco उसे पहचान लेगा
    gloss: 'Marco: शुक्रिया! तब मैं उसे पहचान लूँगा।'
    note: '*La riconosco* (मैं उसे पहचानता हूँ): कर्म सर्वनाम *la* क्रिया से पहले आता है।'
  it.a1.unit42.lesson05.teach.luca_e_chiara:
    title: Luca और Chiara की तुलना
    gloss: Luca और Chiara भाई-बहन हैं, पर दिखने में बहुत अलग लगते हैं। Luca छोटे कद का है, उसके बाल छोटे और भूरे हैं और आँखें भी भूरी हैं। Chiara, Luca से लंबी है, उसके बाल लंबे और भूरे हैं और आँखें हरी हैं। आप कैसे दिखते हैं?
    note: अब तक सिखाए गए हर रंग और लंबाई के शब्द इस्तेमाल करने वाली छोटी तुलना, जो अंत में पाठक से इकाई का मुख्य सवाल पूछती है।
    glosses:
      fratello: भाई
      sorella: बहन
      sembrano: वे लगते हैं / दिखते हैं
      diversi: अलग
      basso: छोटा
      corti: छोटा
      castani: भूरा
      capelli: बाल
      marroni: भूरा
      occhi: आँखें
      alta: लंबी (più alta = ज़्यादा लंबी)
      lunghi: लंबा
      verdi: हरा
      come: कैसे (Tu come sei? = आप कैसे दिखते हैं?)
  it.a1.unit42.lesson05.teach.il_comparativo_si:
    title: 'तुलना: più ... di'
    gloss: 'इतालवी में तुलना più + विशेषण + di से होती है: Chiara è più alta di Luca.'
    note: '*più* को विशेषण से पहले और *di* को उस व्यक्ति से पहले रखिए जिससे तुलना हो रही है। विशेषण अपना लिंग बनाए रखता है: *più alta*, *più alto*।'
  it.a1.unit42.lesson05.teach.chiara_ha_i:
    title: Chiara के बाल Luca से लंबे हैं
    gloss: Chiara के बाल Luca से लंबे हैं।
    note: '*I capelli più lunghi di Luca*: विशेषण बहुवचन ही रहता है, क्योंकि वह *capelli* के साथ मेल खाता है।'
  it.a1.unit42.lesson05.teach.ho_i_capelli:
    title: मेरे बाल छोटे और भूरे हैं
    gloss: मेरे बाल छोटे और भूरे हैं।
    note: '*Ho i capelli corti e castani*: अपना रूप-रंग बताने के लिए *avere* का प्रयोग होता है।'
  it.a1.unit42.lesson06.teach.marco_guarda_e:
    title: मार्को निना को देखता है
    gloss: 'मार्को: देखो, क्या वह निना है? उसके बाल छोटे और सुनहरे हैं और आँखें हरी हैं।'
    note: '*Guarda* (देखो) *tu* के लिए आज्ञार्थक रूप है। *Quella* का अर्थ है ''वह वाली'', किसी स्त्री या लड़की के लिए।'
  it.a1.unit42.lesson06.teach.giulia_si_e:
    title: जूलिया पुष्टि करती है
    gloss: 'जूलिया: हाँ, वह निना ही है!'
    note: एक छोटी, स्वाभाविक पुष्टि।
  it.a1.unit42.lesson06.teach.nina_ciao_sei:
    title: निना मार्को का अभिवादन करती है
    gloss: 'निना: नमस्ते, क्या आप मार्को हैं?'
    note: '*Sei Marco?* अनौपचारिक प्रश्न है: *sei*, *essere* का *tu* वाला रूप है, इसलिए *tu* लगाने की ज़रूरत नहीं।'
  it.a1.unit42.lesson06.teach.marco_si_piacere:
    title: मार्को भी निना का अभिवादन करता है
    gloss: 'मार्को: हाँ! आपसे मिलकर खुशी हुई, निना।'
    note: '*Piacere di conoscerti* किसी से पहली बार मिलने पर कहा जाता है; *-ti* का अर्थ है ''तुम्हें''।'
  it.a1.unit42.lesson06.teach.nina_piacere_mio:
    title: Nina भी अभिवादन लौटाती है
    gloss: 'Nina: तुमसे मिलकर मुझे भी खुशी हुई!'
    note: संवाद का अंत -- मार्को ने जूलिया के पहले दिए वर्णन से निना को पहचान लिया।
exercises:
  it.a1.unit42.lesson01.exercise01.choose_chiara_e_alta:
    instruction: '''Chiara è alta.'' का हिंदी अर्थ चुनिए।'
    correct_option: कियारा लंबी है।
    distractors:
    - कियारा छोटे कद की है।
    - कियारा बुज़ुर्ग है।
    - कियारा युवा है।
    accepted_answers:
    - value: कियारा लंबी है।
      status: correct
    feedback: Chiara è alta.
  it.a1.unit42.lesson01.exercise02.listen_luca_e_basso:
    instruction: सुनिए और चुनिए कि वक्ता क्या कहता है।
    correct_option: लूका छोटे कद का है।
    distractors:
    - लूका लंबा है।
    - लूका बुज़ुर्ग है।
    - लूका युवा है।
    accepted_answers:
    - value: लूका छोटे कद का है।
      status: correct
    feedback: Luca è basso.
  it.a1.unit42.lesson01.exercise03.match_alto_basso_anziano:
    instruction: हर इतालवी शब्द या वाक्यांश को उसके अर्थ से मिलाइए।
    accepted_answers:
    - value:
      - left: alto
        right: लंबा
      - left: basso
        right: छोटे कद का
      - left: anziano
