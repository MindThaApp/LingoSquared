teaching:
  it.a1.unit17.lesson01.teach.il_lavoro:
    title: il lavoro
    gloss: नौकरी / काम
    note: '*il lavoro* पुल्लिंग संज्ञा है, जिसका अर्थ ''नौकरी'' भी है और सामान्य रूप से ''काम'' भी।'
    example_gloss:
    - मेरी नौकरी दिलचस्प है।
  it.a1.unit17.lesson01.teach.insegnante_commesso:
    title: insegnante, commesso
    gloss: शिक्षक, दुकान का कर्मचारी
    note: '*insegnante* (शिक्षक) पुरुष और महिला दोनों के लिए एक ही रूप में रहता है; *commesso* (दुकान का कर्मचारी) पुल्लिंग है — स्त्रीलिंग रूप *commessa* है।'
    example_gloss:
    - मैं शिक्षक हूँ, दुकान का कर्मचारी नहीं।
  it.a1.unit17.lesson01.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: आप काम क्या करते हैं?
    note: '*Che lavoro fai?* (शाब्दिक अर्थ: ''तुम कौन-सा काम करते हो?'') किसी का पेशा पूछने का सामान्य तरीका है।'
  it.a1.unit17.lesson01.teach.sono_insegnante:
    title: Sono insegnante.
    gloss: मैं शिक्षिका हूँ।
    note: 'हिंदी की तरह इतालवी में भी पेशा बताते समय, यदि उसके साथ कोई विशेषता न जुड़ी हो, तो आर्टिकल नहीं लगता: *Sono insegnante* सही है, *Sono un insegnante* नहीं।'
  it.a1.unit17.lesson01.teach.sono_commesso:
    title: Sono commesso.
    gloss: मैं दुकान का कर्मचारी हूँ।
    note: यहाँ भी *Sono insegnante* की तरह आर्टिकल नहीं लगता।
  it.a1.unit17.lesson02.teach.ufficio_scuola:
    title: l'ufficio, la scuola
    gloss: दफ़्तर, स्कूल
    note: '*l''ufficio* (दफ़्तर) में स्वर से पहले आर्टिकल का लोप हो जाता है; *la scuola* (स्कूल) स्त्रीलिंग है।'
    example_gloss:
    - मैं एक दफ़्तर में काम करता/करती हूँ।
    - मैं एक स्कूल में काम करता/करती हूँ।
  it.a1.unit17.lesson02.teach.dove_lavori:
    title: Dove lavori?
    gloss: आप कहाँ काम करते हैं?
    note: '*Dove* (कहाँ) और *lavori* (तुम काम करते हो, अनौपचारिक)।'
  it.a1.unit17.lesson02.teach.lavoro_in_un_ufficio:
    title: Lavoro in un ufficio.
    gloss: मैं एक दफ़्तर में काम करता/करती हूँ।
    note: '*Lavoro in* (मैं ... में काम करता/करती हूँ) और *un ufficio* (एक दफ़्तर)।'
  it.a1.unit17.lesson02.teach.lavoro_in_una_scuola:
    title: Lavoro in una scuola.
    gloss: मैं एक स्कूल में काम करता/करती हूँ।
    note: वही ढाँचा, साथ में *una scuola* (एक स्कूल)।
  it.a1.unit17.lesson03.teach.inizio_finisco:
    title: inizio, finisco
    gloss: मैं शुरू करता/करती हूँ, मैं ख़त्म करता/करती हूँ
    note: '*inizio* (मैं शुरू करता/करती हूँ) और *finisco* (मैं ख़त्म करता/करती हूँ) क्रमशः *iniziare* और *finire* के वर्तमान काल में उत्तम पुरुष के रूप हैं।'
    example_gloss:
    - मैं नौ बजे शुरू करता/करती हूँ।
    - मैं पाँच बजे ख़त्म करता/करती हूँ।
  it.a1.unit17.lesson03.teach.a_che_ora_inizi:
    title: A che ora inizi?
    gloss: तुम किस समय शुरू करते हो?
    note: '*A che ora* (किस समय) और *inizi* (तुम शुरू करते हो, अनौपचारिक)।'
  it.a1.unit17.lesson03.teach.inizio_alle_nove_e_finisco_alle_cinque:
    title: Inizio alle nove e finisco alle cinque.
    gloss: मैं नौ बजे शुरू करता/करती हूँ और पाँच बजे ख़त्म करता/करती हूँ।
    note: '*alle nove* / *alle cinque* (नौ बजे / पाँच बजे) में घंटे से पहले *alle* आता है, जैसा यूनिट 5 के समय वाले वाक्यांशों में था।'
