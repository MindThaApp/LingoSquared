  it.a1.unit16.lesson02.teach.non_mi_sento_bene:
    title: non mi sento bene
    gloss: मेरी तबीयत ठीक नहीं है
    note: '*mi sento* (मैं महसूस करता/करती हूँ) और *bene* (ठीक); *non* इसे नकार देता है, यानी तबीयत ठीक नहीं है।'
