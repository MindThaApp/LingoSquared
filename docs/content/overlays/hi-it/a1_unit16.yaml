  it.a1.unit16.lesson01.teach.la_testa_la_pancia_la_gola:
    title: la testa, la pancia, la gola
    gloss: सिर, पेट, गला
    note: शरीर के तीन आम अंग, जिन्हें *mi fa male* के साथ दर्द बताने के लिए इस्तेमाल किया जाता है।
    example_gloss:
