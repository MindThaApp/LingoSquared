teaching:
  it.a1.unit01.lesson01.teach.ciao_buongiorno:
    title: Ciao, Buongiorno
    gloss: नमस्ते, सुप्रभात
    note: '*Ciao* दोस्तों और बराबरी के लोगों के बीच दिन के किसी भी समय इस्तेमाल होने वाला अनौपचारिक अभिवादन है। *Buongiorno* दिन में कहा जाने वाला सामान्य, अधिक औपचारिक अभिवादन है, जो सुबह से दोपहर तक कभी भी कहा जा सकता है।'
    example_gloss:
    - हेलो, तुम कैसे हो?
    - सुप्रभात, आप कैसे हैं?
  it.a1.unit01.lesson01.teach.come_stai_sta:
    title: come stai, come sta
    gloss: तुम कैसे हो, आप कैसे हैं
    note: '*come stai* के साथ *tu* आता है (दोस्त या बराबरी का व्यक्ति); *come sta* के साथ *Lei* आता है (अजनबी, बॉस, या कोई ऐसा व्यक्ति जिसका आप सम्मान करते हैं)। सवाल वही है, बस बोलने का स्तर अलग है।'
    example_gloss:
    - हेलो, आज तुम कैसे हो?
    - सुप्रभात, आज आप कैसे हैं?
  it.a1.unit01.lesson01.teach.ciao_come_stai:
    title: Ciao, come stai?
    gloss: नमस्ते, तुम कैसे हो?
    note: अभिवादन और सवाल का अनौपचारिक रूप, जो दोस्तों, सहपाठियों या बराबरी के लोगों से कहा जाता है।
  it.a1.unit01.lesson01.teach.buongiorno_come_sta:
    title: Buongiorno, come sta?
    gloss: सुप्रभात, आप कैसे हैं?
    note: इसका औपचारिक रूप, जो ऐसे व्यक्ति से कहा जाता है जिसे आप आदर से संबोधित करते हैं, जैसे किसी नए सहकर्मी के मैनेजर से।
  it.a1.unit01.lesson01.teach.register_rule:
    title: 'tu: informale · Lei: formale o rispettoso'
    gloss: 'तुम: अनौपचारिक · आप: औपचारिक या आदरसूचक'
    note: '*tu* दोस्तों, सहपाठियों और बराबरी के लोगों के बीच रोज़ का "तुम" है। *Lei* अजनबियों, दफ़्तर के पदक्रम या पहली बार मिलने वाले व्यक्ति के लिए आदरसूचक "आप" है। इसके क्रिया-रूप भी अलग होते हैं (*tu stai* और *Lei sta* की तुलना कीजिए)।'
  it.a1.unit01.lesson02.teach.bene_grazie:
    title: Bene, grazie
    gloss: ठीक हूँ, धन्यवाद
    note: '"आप कैसे हैं" का सीधा, तटस्थ उत्तर; इसके साथ *e tu?* या *e Lei?* जोड़कर इसे दोनों शैलियों में इस्तेमाल किया जा सकता है।'
    example_gloss:
    - ठीक हूँ, धन्यवाद, और तुम?
    - ठीक हूँ, धन्यवाद, और आप? (औपचारिक)
  it.a1.unit01.lesson02.teach.e_tu:
    title: E tu?
    gloss: और तुम? (अनौपचारिक)
    note: दोस्त या बराबरी के व्यक्ति से वही सवाल लौटाने का अनौपचारिक तरीका।
  it.a1.unit01.lesson02.teach.e_lei:
    title: E Lei?
    gloss: और आप? (औपचारिक)
    note: वही सवाल लौटाने का औपचारिक तरीका, जो *Lei* वाली शैली से मेल खाता है।
  it.a1.unit01.lesson02.teach.bene_grazie_e_tu:
    title: Bene, grazie, e tu?
    gloss: ठीक हूँ, धन्यवाद, और तुम?
    note: उत्तर देकर सवाल लौटाने का पूरा अनौपचारिक रूप, जो दोस्त या बराबरी के व्यक्ति से कहा जाता है।
  it.a1.unit01.lesson02.teach.bene_grazie_e_lei:
    title: Bene, grazie, e Lei?
    gloss: ठीक हूँ, धन्यवाद, और आप?
    note: उत्तर देकर सवाल लौटाने का पूरा औपचारिक रूप, जो आदर से संबोधित किए जाने वाले व्यक्ति से कहा जाता है।
  it.a1.unit01.lesson02.teach.buonasera_buonanotte:
    title: Buonasera, Buonanotte
    gloss: शुभ संध्या, शुभ रात्रि
    note: '*Buonasera* शाम को कहीं पहुँचने पर कहा जाने वाला अभिवादन है। *Buonanotte* विदा के समय कहा जाता है, जब कोई सोने जा रहा हो या दिन खत्म कर रहा हो; इसे अभिवादन के रूप में कभी नहीं कहा जाता।'
    example_gloss:
    - शुभ संध्या, आप कैसे हैं?
    - शुभ रात्रि, कल मिलते हैं।
  it.a1.unit01.lesson02.teach.arrivederla:
    title: Arrivederla, a domani.
    gloss: अलविदा, कल मिलते हैं।
    note: '*Arrivederla* विदाई का औपचारिक रूप है, जो *Lei* के साथ कहा जाता है और दफ़्तर या अजनबी के साथ बोलने की शैली से मेल खाता है।'
  it.a1.unit01.lesson02.teach.ci_vediamo:
    title: Ciao, ci vediamo domani!
    gloss: बाय, कल मिलते हैं!
    note: विदाई का अनौपचारिक रूप, जो उन दोस्तों और साथियों से कहा जाता है जिनसे अगले दिन फिर मिलना है।
  it.a1.unit01.lesson03.teach.come_si_chiama:
    title: Come si chiama, scusi?
    gloss: माफ़ कीजिए, आपका नाम क्या है? (औपचारिक)
    note: '*Come si chiama?* औपचारिक *Lei* शैली में शाब्दिक रूप से पूछता है "आप किस नाम से पुकारे जाते हैं"; किसी अजनबी से पूछते समय *scusi* ("माफ़ कीजिए") जोड़ना स्वाभाविक शिष्टता है।'
  it.a1.unit01.lesson03.teach.come_ti_chiami:
    title: Come ti chiami?
    gloss: तुम्हारा नाम क्या है? (अनौपचारिक)
    note: इसका अनौपचारिक रूप, जो दोस्त, बराबरी के व्यक्ति या हमउम्र से कहा जाता है।
  it.a1.unit01.lesson03.teach.mi_chiamo_elena:
    title: Mi chiamo Elena.
    gloss: मेरा नाम Elena है।
    note: '*chiamarsi* का अर्थ है "पुकारा जाना"; अपना नाम बताने का यही सामान्य तरीका है, जो दोनों शैलियों में चलता है।'
  it.a1.unit01.lesson03.teach.io_sono_sam:
    title: Io sono Sam.
    gloss: मैं Sam हूँ।
    note: '*mi chiamo* का सरल विकल्प, जिसमें *essere* (होना) के साथ सीधे नाम जोड़ा जाता है।'
  it.a1.unit01.lesson03.teach.piacere:
    title: Piacere, Piacere di conoscerla
    gloss: आनंद / आपसे मिलकर खुशी हुई, आपसे मिलकर बहुत खुशी हुई (औपचारिक)
    note: '*Piacere* अकेला "आपसे मिलकर खुशी हुई" कहने का छोटा, आम तरीका है, जो दोनों शैलियों में चलता है। *Piacere di conoscerla* इसका पूरा औपचारिक रूप है, जो *Lei* के साथ कहा जाता है।'
    example_gloss:
    - मिलकर खुशी हुई, Sam!
    - आपसे मिलकर खुशी हुई, श्रीमती Elena।
  it.a1.unit01.lesson03.teach.benvenuto:
    title: Benvenuto in ufficio!
    gloss: ऑफिस में आपका स्वागत है!
    note: '*Benvenuto* "स्वागत" का पुल्लिंग रूप है (पुरुष के लिए); किसी महिला का स्वागत *Benvenuta* कहकर किया जाता है।'
  it.a1.unit01.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: बहुत-बहुत धन्यवाद।
    note: सादे *Grazie* से अधिक ज़ोरदार और भावपूर्ण ढंग से धन्यवाद कहने का तरीका।
