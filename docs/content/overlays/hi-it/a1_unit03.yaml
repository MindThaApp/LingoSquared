  it.a1.unit03.lesson01.teach.numeri_sei_dieci:
    title: sei, sette, otto, nove, dieci
    gloss: छह, सात, आठ, नौ, दस
    note: छह से दस तक की संख्याएँ, जिनसे 0-10 की गिनती पूरी होती है।
    example_gloss:
    - मैं दिन में आठ घंटे काम करता हूँ।
    - दुकान दस बजे खुलती है।
  it.a1.unit03.lesson01.teach.quanti_anni:
    title: Quanti anni hai?
    gloss: तुम्हारी उम्र कितनी है?
    note: शाब्दिक अर्थ 'तुम्हारे कितने वर्ष हैं' -- इतालवी में उम्र पूछने के लिए *avere* (पास होना) क्रिया आती है, essere (होना) नहीं।
  it.a1.unit03.lesson01.teach.ho_trent_anni:
    title: Ho trent'anni.
    gloss: मेरी उम्र तीस साल है।
    note: '*avere* के साथ अपनी उम्र बताने की एक तय अभिव्यक्ति (शाब्दिक अर्थ: मेरे पास तीस साल हैं)। यहाँ ''तीस'' को गिनती की संख्या के रूप में नहीं सिखाया गया है; इस इकाई में संख्याएँ 0 से 10 तक हैं, और 30 व 50 केवल इसी अभिव्यक्ति और कीमतों में दिखते हैं।'
  it.a1.unit03.lesson02.teach.quanto_costa:
    title: Quanto costa un caffè?
    gloss: एक कॉफ़ी कितने की है?
    note: '*Quanto costa* किसी एक चीज़ की कीमत पूछने का सामान्य तरीका है।'
  it.a1.unit03.lesson02.teach.costa_un_euro:
    title: un euro, due euro
    gloss: एक यूरो, दो यूरो
    note: इतालवी में *euro* बहुवचन में रूप नहीं बदलता; हिंदी की तरह *un euro* और *due euro* दोनों में *euro* ही रहता है।
    example_gloss:
    - इसकी कीमत एक यूरो है।
    - कुल दो यूरो पचास सेंट हुए।
  it.a1.unit03.lesson02.teach.un_cornetto:
    title: E un cornetto?
    gloss: और एक क्रोसाँ?
    note: दूसरी चीज़ की कीमत पूछने वाला छोटा-सा अगला सवाल; *cornetto* इतालवी नाश्ते का क्रोसाँ है।
  it.a1.unit03.lesson02.teach.due_euro_cinquanta:
    title: Sono due euro e cinquanta.
    gloss: कुल दो यूरो पचास सेंट हुए।
    note: '*e cinquanta* सेंट जोड़ता है; शाब्दिक अर्थ ''और पचास''। पचास सेंट वाली हर कीमत के लिए इसी तरह बोला जाता है।'
  it.a1.unit03.lesson02.teach.quanti_ne_vuole:
    title: Quanti ne vuole?
    gloss: आप कितने लेंगे?
    note: बारिस्ता या दुकानदार औपचारिक ढंग से पूछता है कि आपको कितनी चीज़ें चाहिए; *ne* पहले बताई जा चुकी चीज़ की जगह आता है।
  it.a1.unit03.lesson02.teach.ne_vorrei_tre:
    title: Ne vorrei tre, grazie.
    gloss: मुझे तीन चाहिए, धन्यवाद।
    note: '*Ne vorrei* + संख्या मात्रा माँगने का विनम्र तरीका है; यहाँ भी *ne* पहले बताई चीज़ की ओर इशारा करता है।'
  it.a1.unit03.lesson03.teach.qual_e_il_tuo_numero:
    title: Qual è il tuo numero di telefono?
    gloss: तुम्हारा फ़ोन नंबर क्या है?
    note: किसी का फ़ोन नंबर पूछने का अनौपचारिक तरीका, जिसमें *tuo* (तुम्हारा, अनौपचारिक) आता है।
  it.a1.unit03.lesson03.teach.ti_chiamo_domani:
    title: Ti chiamo domani!
    gloss: मैं तुम्हें कल फ़ोन करूँगा!
    note: नंबर मिलने के बाद बातचीत को दोस्ताना ढंग से खत्म करने का तरीका।
  it.a1.unit03.lesson03.teach.il_mio_numero:
    title: il mio numero
    gloss: मेरा नंबर
    note: इतालवी में फ़ोन नंबर आम तौर पर अंक-अंक करके पढ़े जाते हैं, इसके लिए पहले पाठ की संख्याओं का उपयोग होता है।
    example_gloss: मेरा नंबर शून्य, तीन, चार, दो, एक है।
  it.a1.unit03.lesson03.teach.numero_sam:
    title: Il mio numero è zero, tre, quattro, due, uno.
    gloss: मेरा नंबर शून्य, तीन, चार, दो, एक है।
    note: सैम अपना फ़ोन नंबर अंक-अंक करके बताता है, जो इतालवी में फ़ोन नंबर बोलने का सामान्य तरीका है।
