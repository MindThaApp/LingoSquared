teaching:
  it.a1.unit03.lesson01.teach.numeri_zero_cinque:
    title: zero, uno, due, tre, quattro, cinque
    gloss: शून्य, एक, दो, तीन, चार, पाँच
    note: पहली छह संख्याएँ -- पूरी यूनिट में कीमतों, उम्र और फ़ोन नंबरों के आधार-खंड।
