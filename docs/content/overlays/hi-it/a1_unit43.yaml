    - Nina के पास एक पक्षी है।
  it.a1.unit43.lesson01.teach.hai_un_animale:
    title: क्या आपके पास कोई पालतू जानवर है?
    gloss: क्या आपके पास कोई पालतू जानवर है?
    note: '*Hai ...?* क्रिया *avere* का *tu* वाला रूप है। केवल आवाज़ के लहजे से कथन प्रश्न बन जाता है।'
  it.a1.unit43.lesson01.teach.si_ho_un:
    title: हाँ, मेरे पास एक कुत्ता है
    gloss: हाँ, मेरे पास एक कुत्ता है।
    note: इस यूनिट की नई शब्दावली के साथ एक सरल सकारात्मक उत्तर।
  it.a1.unit43.lesson01.teach.no_non_ho:
    title: नहीं, मेरे पास कोई पालतू जानवर नहीं है
    gloss: नहीं, मेरे पास कोई पालतू जानवर नहीं है।
    note: 'यह कहने के लिए कि आपके पास कुछ नहीं है, क्रिया से पहले *non* लगाइए: *non ho*। व्याकरण नोट देखिए।'
  it.a1.unit43.lesson01.teach.per_dire_che:
    title: क्रिया से पहले Non
    gloss: 'यह कहने के लिए कि आपके पास कुछ नहीं है, क्रिया से पहले non लगाइए: Non ho tempo, Non ho animali domestici.'
    note: '*non ho* के बाद संज्ञा के साथ आमतौर पर उपपद (आर्टिकल) नहीं आता: *non ho tempo*, *non ho animali*। हिंदी में भी यहाँ ''कोई'' या ''कुछ'' के बिना बात कही जा सकती है, जैसे "मेरे पास समय नहीं है"।'
  it.a1.unit43.lesson02.teach.portare_a_spasso:
    title: (जानवर को) टहलाने ले जाना
    gloss: (जानवर को) टहलाने ले जाना
    note: '*Portare a spasso* जानवर को सैर कराने का स्थिर मुहावरा है। सर्वनाम क्रिया से पहले आता है: *lo porto a spasso*।'
    example_gloss: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ।
  it.a1.unit43.lesson02.teach.il_pronome_lo:
    title: सर्वनाम क्रिया से पहले आते हैं
    gloss: 'सर्वनाम lo कुत्ते की जगह लेता है और क्रिया से पहले आता है: lo porto a spasso, gli do da mangiare.'
    note: 'हिंदी में "मैं उसे सैर पर ले जाता हूँ" की तरह सर्वनाम क्रिया से पहले आता है; इतालवी में भी *lo* और *gli* क्रिया के आगे रखे जाते हैं: *lo porto*, *gli do*।'
  it.a1.unit43.lesson02.teach.dare_da_mangiare:
    title: खाना खिलाना
    gloss: खाना खिलाना
    example_gloss: मैं रोज़ बिल्ली को खाना खिलाता हूँ।
  it.a1.unit43.lesson02.teach.giocare_con:
    title: के साथ खेलना
    gloss: के साथ खेलना
    example_gloss: Luca अपनी बिल्ली के साथ खेलता है।
  it.a1.unit43.lesson02.teach.porto_a_spasso:
    title: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ
    gloss: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ।
    note: '*Ogni giorno* (हर दिन) वाक्य के अंत में आता है, जैसे *porto a spasso il cane ogni giorno*।'
  it.a1.unit43.lesson02.teach.do_da_mangiare:
    title: मैं रोज़ बिल्ली को खाना खिलाता हूँ
    gloss: मैं रोज़ बिल्ली को खाना खिलाता हूँ।
    note: '*Dare da mangiare* (खाना खिलाना) का शाब्दिक अर्थ है ''खाने के लिए देना''। *Do* क्रिया *dare* का *io* वाला रूप है।'
  it.a1.unit43.lesson03.teach.il_plurale_cambia:
    title: 'बहुवचन: il cane -> i cani'
    gloss: 'बहुवचन में अंतिम स्वर और उपपद (आर्टिकल) बदल जाते हैं: il cane -> i cani, il gatto -> i gatti, l''uccello -> gli uccelli, il pesce -> i pesci.'
    note: इतालवी बहुवचन का नियमित नमूना, जो यहाँ पहली बार जानवरों के नामों के उदाहरण से समझाया गया है।
  it.a1.unit43.lesson03.teach.i_cani_i:
    title: कुत्ते और बिल्लियाँ
    gloss: कुत्ते / बिल्लियाँ
    example_gloss:
    - Marco को कुत्ते पसंद हैं।
    - Chiara को बिल्लियाँ पसंद हैं।
  it.a1.unit43.lesson03.teach.i_pesci_gli:
    title: मछलियाँ और पक्षी (बहुवचन)
    gloss: मछलियाँ / पक्षी
    example_gloss:
    - मुझे मछलियाँ बहुत पसंद हैं।
    - दादाजी को पक्षी बहुत पसंद हैं।
  it.a1.unit43.lesson03.teach.amo_gli_animali:
    title: मुझे जानवर बहुत पसंद हैं
    gloss: मुझे जानवर बहुत पसंद हैं।
    note: '*Amare* (प्यार करना, पसंद करना) सीधे कर्म लेता है: *amo gli animali*। बहुवचन संज्ञा के साथ बहुवचन उपपद (आर्टिकल) *gli* चाहिए।'
  it.a1.unit43.lesson03.teach.chiara_ama_i:
    title: Chiara को बिल्लियाँ पसंद हैं, पर उसके पास कोई पालतू जानवर नहीं है
    gloss: Chiara को बिल्लियाँ पसंद हैं, पर उसके पास कोई पालतू जानवर नहीं है।
    note: यह उस विरोधाभास की भूमिका बनाता है जिस पर इस यूनिट का पठन-अंश आधारित है।
  it.a1.unit43.lesson04.teach.marco_hai_un:
    title: Marco पालतू जानवर के बारे में पूछता है
    gloss: 'Marco: क्या तुम्हारे पास कोई पालतू जानवर है, Giulia?'
  it.a1.unit43.lesson04.teach.giulia_si_ho:
    title: Giulia के पास एक कुत्ता है
    gloss: 'Giulia: हाँ, मेरे पास एक कुत्ता है।'
  it.a1.unit43.lesson04.teach.marco_com_e:
    title: Marco पूछता है कि वह कैसा दिखता है
    gloss: 'Marco: वह कैसा है?'
    note: '*Com''è?* जानवरों के लिए भी चलता है। उत्तर में *è* या *ha* आता है: *è piccolo*, *ha il pelo castano*।'
  it.a1.unit43.lesson04.teach.giulia_ha_il:
    title: Giulia अपने कुत्ते का वर्णन करती है
    gloss: 'Giulia: उसके बाल भूरे हैं और वह छोटा है।'
    note: बालों के रंग और आकार की शब्दावली रूप-रंग वाली यूनिट से दोहराई गई है, अब किसी व्यक्ति के बालों की जगह जानवर के रोएँ के लिए।
  it.a1.unit43.lesson04.teach.un_animale_e:
    title: जानवर पुल्लिंग या स्त्रीलिंग होते हैं
    gloss: 'जानवर इंसान की तरह पुल्लिंग या स्त्रीलिंग होता है: il cane है lui, la gatta है lei.'
    note: हिंदी की तरह इतालवी में भी हर संज्ञा पुल्लिंग या स्त्रीलिंग होती है, इसलिए कुत्ता *lui* है और बिल्ली *lei*, और सर्वनाम भी उसी के अनुसार आते हैं (*lo*, *la*)।
  it.a1.unit43.lesson04.teach.marco_lo_porti:
    title: Marco सैर के बारे में पूछता है
    gloss: 'Marco: क्या तुम उसे हर दिन सैर पर ले जाती हो?'
  it.a1.unit43.lesson04.teach.giulia_si_lo:
    title: Giulia अपनी दिनचर्या बताती है
    gloss: 'Giulia: हाँ, मैं उसे हर दिन सैर पर ले जाती हूँ और उसे खाना खिलाती हूँ।'
  it.a1.unit43.lesson05.teach.marco_e_chiara:
    title: जानवरों के बारे में Marco, Chiara और Luca
    gloss: 'Marco और Chiara दोनों को जानवर पसंद हैं, पर दोनों में से किसी के पास पालतू जानवर नहीं है। Marco को कुत्ते पसंद हैं और Chiara को बिल्लियाँ। Luca के पास पालतू जानवर है: एक बिल्ली। वह अक्सर अपनी बिल्ली के साथ खेलता है और हर दिन उसे खाना खिलाता है। क्या आपके पास कोई पालतू जानवर है?'
    note: किसी जानवर को पसंद करने और सच में उसे पालने का फ़र्क़ दिखाता है -- यही इस यूनिट के संवाद-लक्ष्य की मूल बात है।
    glosses:
      amano: बहुत पसंद है
      entrambi: दोनों
      animali: जानवर
      due: दो (nessuno dei due = दोनों में से कोई नहीं)
      domestico: घरेलू (animale domestico = पालतू जानवर)
      cani: कुत्ते
      gatti: बिल्लियाँ
      gatto: बिल्ली
      gioca: खेलता है
      dà: देता है
      ogni: हर
      mangiare: खाना (dare da mangiare = खाना खिलाना)
  it.a1.unit43.lesson05.teach.luca_gioca_spesso:
    title: Luca अक्सर अपनी बिल्ली के साथ खेलता है
    gloss: Luca अक्सर अपनी बिल्ली के साथ खेलता है।
    note: '*Spesso* (अक्सर) क्रिया के बाद आता है: *gioca spesso*। *Giocare con* का मतलब है किसी के साथ खेलना।'
  it.a1.unit43.lesson05.teach.amo_i_cani:
    title: मुझे कुत्ते बहुत पसंद हैं। मेरे पास कोई पालतू जानवर नहीं है।
    gloss: मुझे कुत्ते बहुत पसंद हैं। मेरे पास कोई पालतू जानवर नहीं है।
    note: दो वाक्यों का एक आदर्श उत्तर, जिसे इस यूनिट के लेखन-अभ्यास में दोहराया जा सकता है।
  it.a1.unit43.lesson06.teach.giulia_nina_hai:
    title: Giulia, Nina से पूछती है
    gloss: 'Giulia: Nina, क्या तुम्हारे पास भी कोई पालतू जानवर है?'
  it.a1.unit43.lesson06.teach.nina_si_ho:
    title: Nina के पास Pico नाम का पक्षी है
    gloss: 'Nina: हाँ, मेरे पास एक पक्षी है। उसका नाम Pico है।'
    note: '*Si chiama Pico* का मतलब है उसका नाम Pico है, शाब्दिक अर्थ ''वह खुद को Pico कहता है''।'
  it.a1.unit43.lesson06.teach.marco_che_bello:
    title: Marco प्रतिक्रिया देता है
    gloss: 'Marco: कितना अच्छा! तुम हर दिन उसके साथ क्या करती हो?'
  it.a1.unit43.lesson06.teach.nina_gli_do:
    title: Nina रोज़ उसे खाना खिलाती है
    gloss: 'Nina: मैं रोज़ उसे खाना खिलाती हूँ।'
  it.a1.unit43.lesson06.teach.marco_anch_io:
    title: Marco को भी पक्षी पसंद हैं
    gloss: 'Marco: मुझे भी पक्षी पसंद हैं।'
  it.a1.unit43.lesson06.teach.giulia_che_bello:
    title: Giulia बातचीत समाप्त करती है
    gloss: 'Giulia: कितनी अच्छी बात है कि हम तीनों को जानवर पसंद हैं!'
    note: समापन की पंक्ति जो तीनों पात्रों की जानवरों से जुड़ी बातों को जोड़ती है।
