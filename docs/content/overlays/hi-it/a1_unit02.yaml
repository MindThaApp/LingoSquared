    note: औपचारिक सवाल, जो यूनिट 1 के *Lei* से मेल खाता है।
  it.a1.unit02.lesson01.teach.sono_americano_chicago:
    title: Sono americano, di Chicago.
    gloss: मैं अमेरिकी हूँ, शिकागो से।
    note: राष्ट्रीयता और मूल शहर दोनों एक साथ बताता है।
  it.a1.unit02.lesson01.teach.sono_italiana_milano:
    title: Sono italiana, di Milano.
    gloss: मैं इतालवी हूँ, मिलान से।
    note: '*italiana* राष्ट्रीयता का स्त्रीलिंग रूप है, क्योंकि एलेना एक महिला है।'
  it.a1.unit02.lesson01.teach.nationalities:
    title: americano/americana, italiano/italiana
    gloss: अमेरिकी (पुरुष/महिला), इतालवी (पुरुष/महिला)
    note: 'इतालवी में राष्ट्रीयता बताने वाले शब्द का अंत व्यक्ति के लिंग के अनुसार बदलता है: पुरुष के लिए *-o*, महिला के लिए *-a* (*Sam è americano*, *Elena è italiana*)।'
    example_gloss:
    - सैम अमेरिकी है।
    - एलेना इतालवी है।
  it.a1.unit02.lesson02.teach.parli_italiano:
