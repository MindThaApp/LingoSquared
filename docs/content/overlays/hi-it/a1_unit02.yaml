    gloss: आप काम क्या करते हैं?
    note: अनौपचारिक सवाल, जिसमें *fare* (करना) का *tu* रूप है।
  it.a1.unit02.lesson03.teach.che_lavoro_fa:
    title: Che lavoro fa, Lei?
    gloss: आप क्या काम करते हैं? (औपचारिक)
    note: औपचारिक सवाल, जिसमें *fare* का *Lei* रूप है।
  it.a1.unit02.lesson03.teach.sono_ingegnere:
    title: Sono ingegnere
    gloss: मैं इंजीनियर हूँ
    note: 'इतालवी में पेशे के नाम से पहले आमतौर पर आर्टिकल नहीं आता: *sono ingegnere*, *sono un ingegnere* नहीं।'
    example_gloss: मैं इंजीनियर हूँ, मिलान में काम करता हूँ।
  it.a1.unit02.lesson03.teach.sono_qui_per_lavoro:
    title: Sono qui per lavoro.
    gloss: मैं यहाँ काम के सिलसिले में हूँ।
    note: '*per lavoro* बताता है कि कोई कहीं क्यों है -- काम के लिए, पर्यटन के लिए नहीं।'
  it.a1.unit02.lesson03.teach.per_due_anni:
    title: Sono qui per due anni.
    gloss: मैं यहाँ दो साल के लिए हूँ।
    note: '*per lavoro* जैसा ही ढाँचा, बस अब कारण की जगह अवधि बताई जा रही है।'
  it.a1.unit02.lesson03.teach.che_bello_benvenuto:
    title: Che bello, benvenuto a Milano!
    gloss: कितना अच्छा, मिलान में स्वागत है!
    note: '*Che bello* उत्साह भरी आम प्रतिक्रिया है, जिसका मतलब ''कितना अच्छा'' या ''कितना बढ़िया'' है।'
  it.a1.unit02.lesson03.teach.grazie_mille_reprise:
    title: Grazie mille!
    gloss: बहुत-बहुत शुक्रिया!
    note: यूनिट 1 वाला ही ज़ोरदार धन्यवाद, जो यहाँ गर्मजोशी भरे स्वागत के जवाब में कहा गया है।
