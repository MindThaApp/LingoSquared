teaching:
  it.a1.unit02.lesson01.teach.di_dove:
    title: di dove
    gloss: कहाँ से
    note: '*di dove* मूल स्थान पूछने या बताने का मुख्य हिस्सा है -- यह *sei* (अनौपचारिक) या *è* (औपचारिक) के साथ आता है।'
