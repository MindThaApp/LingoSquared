  it.a1.unit02.lesson02.teach.parla_italiano:
    title: Parla italiano?
    gloss: आपको इतालवी आती है? (औपचारिक)
    note: औपचारिक सवाल, जिसमें *parlare* का *Lei* रूप है।
  it.a1.unit02.lesson02.teach.parlo_un_po:
    title: Parlo un po' d'italiano
    gloss: मुझे थोड़ी इतालवी आती है
    note: अपना स्तर विनम्रता से बताने का आम तरीका -- *un po'* का मतलब 'थोड़ा' है।
    example_gloss: मुझे थोड़ी इतालवी आती है, मैं एक साल से सीख रहा हूँ।
  it.a1.unit02.lesson02.teach.parlo_inglese:
    title: Parlo inglese.
    gloss: मुझे अंग्रेज़ी आती है।
    note: वही *parlo* (मैं बोलता हूँ) वाला ढाँचा, बस दूसरी भाषा के साथ।
  it.a1.unit02.lesson02.teach.studio_da_un_anno:
    title: Studio italiano da un anno.
    gloss: मैं एक साल से इतालवी सीख रहा हूँ।
    note: '*da un anno* का मतलब ''एक साल से'' है; यह उस क्रिया को बताता है जो अतीत में शुरू हुई और अब भी जारी है।'
  it.a1.unit02.lesson02.teach.da_quanto_studi:
    title: Da quanto studi?
    gloss: तुम कितने समय से सीख रहे हो?
    note: '*Da quanto* (कितने समय से) + वर्तमान काल *studi* (तुम पढ़ते हो, अनौपचारिक) यह पूछता है कि कोई गतिविधि कितने समय से चल रही है। जवाब भी इसी ढाँचे में दीजिए: *Studio da un anno.*'
  it.a1.unit02.lesson02.teach.parla_bene:
    title: Parli italiano bene!
    gloss: तुम इतालवी बहुत अच्छी बोलते हो!
    note: किसी की भाषा के स्तर की दोस्ताना तारीफ़, अनौपचारिक *tu* रूप के साथ।
  it.a1.unit02.lesson03.teach.che_lavoro_fai:
