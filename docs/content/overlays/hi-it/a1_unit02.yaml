  it.a1.unit02.lesson01.teach.di_dove_sei:
    title: Di dove sei?
    gloss: आप कहाँ से हैं?
    note: अनौपचारिक सवाल, जो हमउम्र या दोस्त से पूछा जाता है; यूनिट 1 के *tu* से मेल खाता है।
