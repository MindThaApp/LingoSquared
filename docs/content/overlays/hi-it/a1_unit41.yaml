course:
  title: इतालवी A1
  description: 'खाली समय की गतिविधियों का वर्णन करने के लिए शुरुआती इतालवी: शौक़ की शब्दावली, आवृत्ति बताने वाले भाव, किसी से पूछना और बताना कि वह खाली समय में क्या करता है, और दो लोगों के शौक़ की तुलना करना।'
