teaching:
  it.a1.unit41.lesson01.teach.leggere_fare_sport:
    title: पढ़ना, कसरत करना, खाना बनाना
    gloss: पढ़ना, कसरत/खेलकूद करना, खाना पकाना
    note: 'तीन आम शौक़ वाली क्रियाएँ उनके मूल रूप में: *leggere* (पढ़ना), *fare sport* (कसरत करना या खेल खेलना) और *cucinare* (खाना बनाना)। हिंदी में मूल रूप -ना पर खत्म होता है, जैसे पढ़ना; इतालवी में मूल रूप -are, -ere या -ire पर खत्म होते हैं।'
    example_gloss:
    - मुझे किताब पढ़ना पसंद है।
    - मैं शनिवार को कसरत करता हूँ।
    - मुझे दोस्तों के लिए खाना बनाना पसंद है।
  it.a1.unit41.lesson01.teach.il_tempo_libero:
    title: ख़ाली समय
    gloss: ख़ाली समय
    note: '*Il tempo libero* पुल्लिंग संज्ञा है, इसलिए इसके साथ *il* आता है। शौक़ों के बारे में बात करने के लिए यह मुख्य अभिव्यक्ति है।'
    example_gloss: ख़ाली समय में मुझे पढ़ना पसंद है।
  it.a1.unit41.lesson01.teach.nel_mio_tempo:
    title: ख़ाली समय में क्या करते हैं, यह बताना
    gloss: ख़ाली समय में मुझे पढ़ना पसंद है।
    note: '*Leggo* क्रिया *leggere* (पढ़ना) का *io* वाला रूप है। इतालवी में कर्ता सर्वनाम आमतौर पर छोड़ दिया जाता है: *Io leggo* नहीं, सीधे *Leggo* कहिए।'
  it.a1.unit41.lesson02.teach.ascoltare_musica_disegnare:
    title: संगीत, चित्रकारी, वीडियो गेम
    gloss: संगीत सुनना, चित्र बनाना, वीडियो गेम खेलना
    note: 'तीन और शौक़: *ascoltare musica* (संगीत सुनना), *disegnare* (चित्र बनाना) और *giocare ai videogiochi* (वीडियो गेम खेलना)।'
    example_gloss:
    - मुझे संगीत सुनना पसंद है।
    - मैं अक्सर चित्र बनाता/बनाती हूँ।
    - मुझे दोस्तों के साथ वीडियो गेम खेलना पसंद है।
  it.a1.unit41.lesson02.teach.ascolto_volentieri_musica:
    title: कहना कि आपको संगीत सुनना पसंद है
    gloss: मुझे संगीत सुनना पसंद है।
    note: '*Ascoltare* के बाद कर्म सीधे आता है: *ascolto musica*, बीच में कोई पूर्वसर्ग नहीं लगता।'
  it.a1.unit41.lesson02.teach.gioco_volentieri_ai:
    title: कहना कि आपको दोस्तों के साथ वीडियो गेम खेलना पसंद है
    gloss: मुझे दोस्तों के साथ वीडियो गेम खेलना पसंद है।
    note: '*Con gli amici* का मतलब है दोस्तों के साथ। *Gli* स्वर से शुरू होने वाली पुल्लिंग बहुवचन संज्ञा से पहले आने वाला बहुवचन आर्टिकल है।'
  it.a1.unit41.lesson03.teach.sempre_spesso_a:
    title: हमेशा, अक्सर, कभी-कभी, कभी नहीं
    gloss: हमेशा, अक्सर, कभी-कभी, कभी नहीं
    note: 'आवृत्ति बताने वाले चार शब्द। *Mai* (कभी नहीं) के साथ क्रिया से पहले *non* ज़रूरी है: *non gioco mai*।'
    example_gloss:
    - मैं हर शनिवार हमेशा कसरत करता/करती हूँ।
    - मैं अक्सर कोई किताब पढ़ता/पढ़ती हूँ।
    - मैं कभी-कभी चित्र बनाता/बनाती हूँ।
    - मैं कभी वीडियो गेम नहीं खेलता/खेलती।
  it.a1.unit41.lesson03.teach.ogni_settimana_ogni:
    title: हर हफ़्ते, हर सप्ताहांत
    gloss: हर हफ़्ते, हर सप्ताहांत
    note: '*Ogni* (हर) कभी नहीं बदलता: *ogni settimana*, *ogni fine settimana*। अगला कार्ड देखिए।'
    example_gloss:
    - मैं हर हफ़्ते दोस्तों के लिए खाना बनाता/बनाती हूँ।
    - मैं हर सप्ताहांत कसरत करता/करती हूँ।
  it.a1.unit41.lesson03.teach.con_mai_il:
    title: Mai के साथ non आता है; ogni कभी नहीं बदलता
    gloss: 'mai के साथ क्रिया से पहले non भी आता है: Non gioco mai. Ogni हर संज्ञा के साथ वैसा ही रहता है: ogni settimana, ogni fine settimana.'
    note: 'हिंदी में भी "मैं कभी नहीं खेलता" कहते समय "कभी" के साथ "नहीं" आता है; इतालवी में भी यही होता है: *non gioco mai* (शाब्दिक रूप से "मैं नहीं खेलता कभी नहीं")। *Ogni* के बाद हमेशा एकवचन संज्ञा आती है।'
  it.a1.unit41.lesson03.teach.cosa_fai_nel:
    title: खाली समय के बारे में पूछना
    gloss: आप अपने खाली समय में क्या करते हैं?
    note: यह इस इकाई का मुख्य प्रश्न है -- किसी से भी उसके शौक़ पूछने के लिए इसका इस्तेमाल कीजिए।
  it.a1.unit41.lesson04.teach.giulia_passeggiamo_spesso:
    title: जूलिया शौक़ों की बात छेड़ती है
    gloss: 'जूलिया: हम अक्सर साथ टहलते हैं। पर तुम खाली समय में और क्या करते हो, मार्को?'
    note: '*Passeggiamo* क्रिया *passeggiare* का *noi* (हम) वाला रूप है। *Spesso* क्रिया के बाद आता है।'
  it.a1.unit41.lesson04.teach.marco_cucino_volentieri:
    title: मार्को के शौक़
    gloss: 'मार्को: मुझे खाना बनाना पसंद है, घर पर भी। और मैं अक्सर कसरत या खेलकूद करता हूँ।'
    note: '*Anche a casa* (घर पर भी) दिखाता है कि मार्को सिर्फ़ काम के लिए नहीं, शौक़ से भी खाना बनाता है। *A casa* का मतलब है घर पर, इसमें आर्टिकल नहीं लगता।'
  it.a1.unit41.lesson04.teach.giulia_cucini_anche:
    title: जूलिया हैरान है
    gloss: 'जूलिया: तुम घर पर भी खाना बनाते हो? तुम तो पहले ही दिन भर काम पर खाना बनाते हो!'
    note: '*Già* (पहले ही) और *tutto il giorno* (दिन भर) दिखाते हैं कि मार्को काम पर पहले से कितना खाना बनाता है।'
  it.a1.unit41.lesson04.teach.marco_si_ma:
    title: मार्को समझाता है
    gloss: 'मार्को: हाँ, पर खाना बनाने से मुझे सुकून मिलता है। और तुम्हें क्या करना पसंद है?'
    note: '*Cucinare mi rilassa* का शाब्दिक अर्थ है "खाना बनाना मुझे सुकून देता है": काम कर्ता है और *mi* (मुझे) कर्म है।'
  it.a1.unit41.lesson04.teach.giulia_leggo_volentieri:
    title: जूलिया के शौक़
    gloss: 'जूलिया: मुझे पढ़ना पसंद है और मैं अक्सर संगीत सुनती हूँ।'
    note: 'दो शौक़ *e* (और) से जुड़े हैं। दोनों क्रियाएँ *io* वाले रूप में रहती हैं: *leggo* और *ascolto*।'
  it.a1.unit41.lesson04.teach.marco_giochi_anche:
    title: मार्को गेमिंग के बारे में पूछता है
    gloss: 'मार्को: क्या तुम वीडियो गेम भी खेलती हो?'
    note: 'हाँ/ना वाले प्रश्न में वाक्य का क्रम वही रहता है, बस स्वर ऊपर उठता है: *Giochi anche ai videogiochi?* *Anche* का मतलब है भी।'
  it.a1.unit41.lesson04.teach.giulia_no_non:
    title: जूलिया जवाब देती है
    gloss: 'जूलिया: नहीं, मैं कभी वीडियो गेम नहीं खेलती। पर कभी-कभी चित्र बनाती हूँ!'
    note: एक ही जवाब में *Non ... mai* (कभी नहीं) और *a volte* (कभी-कभी) का फ़र्क़। *Ma* का मतलब है पर।
  it.a1.unit41.lesson05.teach.marco_e_io:
    title: शौक़ों की तुलना
    gloss: मार्को और मैं अक्सर साथ टहलते हैं। पर हमारे और भी शौक़ हैं। मार्को को खाना बनाना पसंद है, घर पर भी, और वह अक्सर कसरत करता है। मुझे पढ़ना पसंद है और मैं अक्सर संगीत सुनती हूँ। मैं कभी-कभी चित्र बनाती हूँ, पर कभी वीडियो गेम नहीं खेलती। तुम्हें खाली समय में क्या करना पसंद है?
    note: जूलिया का संदेश इस इकाई की बातें दोहराता है और अंत में पढ़ने वाले से इस इकाई का मुख्य प्रश्न पूछता है।
    glosses:
      passeggiamo: हम सैर करते हैं
      spesso: अक्सर
      insieme: साथ में
      altri: दूसरे
      cucina: खाना बनाता है
      volentieri: खुशी से
      casa: घर (a casa = घर पर)
      sport: खेलकूद (fa sport = कसरत या खेल करता है)
      leggo: पढ़ना
      ascolto: सुनना
      musica: संगीत
      disegno: चित्र बनाती हूँ
      volte: बार (a volte = कभी-कभी)
      videogiochi: वीडियो गेम
      mai: कभी नहीं
      libero: खाली
      tempo: समय
  it.a1.unit41.lesson06.teach.marco_cosa_fai:
    title: मार्को सप्ताहांत के बारे में पूछता है
    gloss: 'मार्को: इस सप्ताहांत तुम क्या कर रही हो?'
    note: '*Questo fine settimana* (इस सप्ताहांत) पुल्लिंग है, इसलिए *questo* आता है। *Fai* क्रिया *fare* (करना) का *tu* वाला रूप है।'
  it.a1.unit41.lesson06.teach.giulia_non_lo:
    title: जूलिया अभी तय नहीं कर पाई है
    gloss: 'जूलिया: अभी पता नहीं। मुझे पढ़ना पसंद है, पर बाहर भी जाना चाहती हूँ।'
    note: '*Non lo so ancora* (अभी पता नहीं): *lo* उस बात की जगह आता है जो आपको पता नहीं, और क्रिया से पहले लगता है। *Uscire* का मतलब है बाहर जाना।'
  it.a1.unit41.lesson06.teach.marco_facciamo_una:
    title: मार्को योजना सुझाता है
    gloss: 'मार्को: साथ टहलने चलें? फिर मैं हम सबके लिए खाना बनाऊँगा।'
    note: '*Poi* (फिर, उसके बाद) योजनाओं को क्रम में रखता है। *Cucino io* (क्रिया के बाद *io* के साथ) "खाना मैं बनाऊँगा" पर ज़ोर देता है।'
  it.a1.unit41.lesson06.teach.giulia_buona_idea:
    title: जूलिया सहमत होती है
    gloss: 'जूलिया: अच्छा विचार है! मुझे टहलना भी पसंद है और खाना बनाना भी।'
    note: '*Sia ... sia ...* का मतलब है ... भी और ... भी: *mi piace sia passeggiare sia cucinare*।'
  it.a1.unit41.lesson06.teach.marco_perfetto_allora:
    title: मार्को पक्का करता है
    gloss: 'मार्को: बढ़िया। तो शनिवार को मिलते हैं!'
    note: '*Ci vediamo sabato* (शनिवार को मिलते हैं): आने वाले दिन के लिए दिन के नाम से पहले आर्टिकल नहीं लगता।'
