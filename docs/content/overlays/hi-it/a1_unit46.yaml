    note: '*Preferisco nuotare* (मुझे तैरना ज़्यादा पसंद है) पसंद बताने का सीधा तरीका है। *Anch''io* (मैं भी) अपॉस्ट्रॉफ़ी वाला एक ही शब्द है।'
  it.a1.unit46.lesson06.teach.giulia_bello_a:
    title: जूलिया बातचीत खत्म करती है
    gloss: 'जूलिया: बढ़िया! शनिवार को पार्क में मिलते हैं!'
