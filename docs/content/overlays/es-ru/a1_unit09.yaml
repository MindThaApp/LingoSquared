    title: банк, аптека
    gloss: banco, farmacia
    note: банк es masculino y аптека es femenino; ambos son lugares comunes de la ciudad.
    example_gloss:
    - ¿Dónde se encuentra el banco?
    - ¿Dónde se encuentra la farmacia?
  ru.a1.unit09.lesson02.teach.vokzal_gostinitsa:
    title: вокзал, гостиница
    gloss: estación de tren, hotel
