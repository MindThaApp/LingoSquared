  ru.a1.unit09.lesson01.teach.gde:
    title: где
    gloss: dónde
    note: где sirve para preguntar por la ubicación y suele ir junto a находится.
    example_gloss: ¿Dónde está la tienda?
  ru.a1.unit09.lesson01.teach.nakhoditsya:
    title: находится
    gloss: se encuentra
    note: находится es la tercera persona del singular de находиться ("encontrarse, estar situado") y se usa con un sujeto en singular, como магазин.
    example_gloss: ¿Dónde se encuentra la tienda?
  ru.a1.unit09.lesson01.teach.ulitsa:
    title: улица
    gloss: calle
    note: улица es femenino; en на Тверской улице ("en la calle Tverskaya") se usa el caso preposicional después de на.
    example_gloss: La tienda está en la calle Tverskaya.
  ru.a1.unit09.lesson01.teach.gde_nakhoditsya_magazin:
    title: Где находится магазин?
    gloss: ¿Dónde se encuentra la tienda?
    note: Es la estructura habitual para preguntar dónde está cualquier lugar.
