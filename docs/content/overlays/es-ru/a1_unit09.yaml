    example_gloss:
    - ¿Dónde se encuentra la estación de tren?
    - ¿Dónde se encuentra el hotel?
  ru.a1.unit09.lesson02.teach.restoran_biblioteka:
    title: ресторан, библиотека
    gloss: restaurante, biblioteca
    note: ресторан es masculino y библиотека es femenino; los nombres de calles como Чайковского y Пушкина aparecen en genitivo después de улица.
    example_gloss:
    - ¿Dónde se encuentra el restaurante?
    - ¿Dónde se encuentra la biblioteca?
  ru.a1.unit09.lesson03.teach.chto_est_na_vashey_ulitse:
    title: Что есть на вашей улице?
    gloss: ¿Qué hay en su calle?
    note: вашей es el posesivo formal "su/de usted" (o "vuestra"), que concuerda con el sustantivo femenino улице en caso preposicional.
  ru.a1.unit09.lesson03.teach.anna_chto_est:
    title: Anna pregunta por la calle
    gloss: 'Anna: ¿Qué hay en su calle?'
    note: Anna abre el diálogo con Что есть на вашей улице?
  ru.a1.unit09.lesson03.teach.viktor_na_moey_ulitse:
    title: Viktor enumera tres lugares
    gloss: 'Viktor: En mi calle hay una tienda, una biblioteca y un banco.'
    note: На моей улице есть enumera lo que hay usando есть ("hay"), y los elementos se unen con и.
  ru.a1.unit09.lesson03.teach.anna_a_gde_bank:
    title: Anna pregunta dónde está el banco
    gloss: 'Anna: ¿Y dónde se encuentra el banco?'
    note: А introduce con naturalidad la pregunta de Anna sobre uno de los lugares que mencionó Viktor.
  ru.a1.unit09.lesson03.teach.viktor_bank_na_pushkina:
    title: Viktor dice en qué calle está el banco
    gloss: 'Viktor: El banco está en la calle Pushkin.'
    note: Viktor responde con Банк на улице Пушкина, usando el genitivo Пушкина después de улице.
  ru.a1.unit09.lesson03.teach.anna_spasibo_bolshoe:
    title: Anna da las gracias a Viktor
    gloss: 'Anna: Muchas gracias.'
    note: Спасибо большое refuerza спасибо con большое ("grande"), una forma habitual de decir "muchas gracias".
  ru.a1.unit09.lesson03.teach.viktor_pozhaluysta:
    title: Viktor responde
    gloss: 'Viktor: De nada.'
    note: 'Пожалуйста es la respuesta a спасибо: "de nada".'
