teaching:
  ru.a1.unit25.lesson01.teach.chitat_zanimatsya_sportom:
    title: Leer, hacer deporte, cocinar
    gloss: leer, hacer deporte, cocinar
    note: 'Tres verbos de aficiones muy comunes: *читать* (leer), *заниматься спортом* (hacer deporte) y *готовить* (cocinar).'
    example_gloss:
    - Me gusta leer un libro.
    - Hago deporte los sábados.
    - Me gusta cocinar para mis amigos.
  ru.a1.unit25.lesson01.teach.svobodnoe_vremya:
    title: El tiempo libre
    gloss: tiempo libre
    note: '*Свободное время* es la expresión clave para hablar de aficiones. El adjetivo *свободное* termina en *-ое* para concordar con *время*.'
    example_gloss: En mi tiempo libre me gusta leer.
  ru.a1.unit25.lesson01.teach.v_svobodnoe_vremya:
    title: Decir qué haces en tu tiempo libre
    gloss: En mi tiempo libre me gusta leer.
    note: '*Люблю* es la forma de *я* de *любить* (gustar, querer). Después, el segundo verbo se queda en infinitivo: *люблю читать*.'
  ru.a1.unit25.lesson02.teach.slushat_muzyku_risovat:
    title: Música, dibujo y videojuegos
    gloss: escuchar música, dibujar, jugar a videojuegos
    note: 'Tres aficiones más: *слушать музыку* (escuchar música), *рисовать* (dibujar) y *играть в игры* (jugar a videojuegos).'
    example_gloss:
    - Me gusta escuchar música.
    - Dibujo a menudo.
    - Me gusta jugar a videojuegos con amigos.
  ru.a1.unit25.lesson02.teach.ya_lyublyu_slushat:
    title: Decir que te gusta escuchar música
    gloss: Me gusta escuchar música.
    note: '*Слушать* lleva el complemento directamente: *музыку* es el acusativo de *музыка*, con la terminación *-у*.'
  ru.a1.unit25.lesson02.teach.ya_lyublyu_igrat:
    title: Decir que te gusta jugar a videojuegos con amigos
    gloss: Me gusta jugar a videojuegos con amigos.
    note: '*С друзьями* (con amigos): la preposición *с* va seguida del caso instrumental, por eso *друзьями*.'
  ru.a1.unit25.lesson03.teach.vsegda_chasto_inogda:
    title: Siempre, a menudo, a veces, nunca
    gloss: siempre, a menudo, a veces, nunca
    note: 'Los cuatro adverbios básicos de frecuencia: *всегда*, *часто*, *иногда*, *никогда*. Nunca cambian de forma.'
    example_gloss:
    - Siempre hago deporte los sábados.
    - A menudo leo un libro.
    - A veces dibujo.
    - Nunca juego a videojuegos.
  ru.a1.unit25.lesson03.teach.kazhduyu_nedelyu_kazhdye:
    title: Cada semana, cada fin de semana
    gloss: cada semana, cada fin de semana
    note: '*Каждую неделю* y *каждые выходные* significan ambos «cada», pero la terminación sigue al sustantivo: mira la siguiente tarjeta.'
    example_gloss:
    - Cocino para mis amigos cada semana.
    - Hago deporte cada fin de semana.
  ru.a1.unit25.lesson03.teach.nedelya_zhenskogo_roda:
    title: 'Cada: femenino y plural'
    gloss: '*Неделя* es femenino, por eso se dice *каждую неделю*. *Выходные* es plural, por eso se dice *каждые выходные*.'
    note: '*Каждый* concuerda con su sustantivo como cualquier adjetivo: *каждый день* (masculino), *каждую неделю* (femenino, acusativo), *каждые выходные* (plural).'
  ru.a1.unit25.lesson03.teach.chto_ty_delaesh:
    title: Preguntar por el tiempo libre
    gloss: ¿Qué haces en tu tiempo libre?
    note: 'Esta es la pregunta central de la unidad: úsala para preguntar a cualquiera por sus aficiones.'
  ru.a1.unit25.lesson04.teach.nastya_my_chasto:
    title: Nastya habla de los pasatiempos
    gloss: 'Nastya: Paseamos juntos a menudo. Y tú, Dima, ¿qué más haces en tu tiempo libre?'
    note: '*Мы часто гуляем вместе*: *мы* (nosotros) lleva la terminación verbal *-ем*, y *гулять* significa pasear por placer.'
  ru.a1.unit25.lesson04.teach.dima_ya_lyublyu:
    title: Los pasatiempos de Dima
    gloss: 'Dima: Me gusta cocinar, también en casa. Y además hago deporte a menudo.'
    note: '*И дома тоже* (también en casa): *и ... тоже* muestra que Dima cocina por gusto, no solo en el trabajo.'
  ru.a1.unit25.lesson04.teach.nastya_ty_i:
    title: Nastya se sorprende
    gloss: 'Nastya: ¿Cocinas también en casa? ¡Si ya cocinas todo el día en el trabajo!'
    note: '*Весь день* (todo el día) subraya cuánto cocina ya Dima en el trabajo. *Весь* concuerda con el masculino *день*.'
  ru.a1.unit25.lesson04.teach.dima_da_no:
    title: Dima lo explica
    gloss: 'Dima: Sí, pero cocinar me relaja. Y a ti, ¿qué te gusta hacer?'
    note: '*Готовить меня расслабляет* pone primero la actividad: literalmente «cocinar me relaja», con *меня* en acusativo.'
  ru.a1.unit25.lesson04.teach.nastya_ya_lyublyu:
    title: Los pasatiempos de Nastya
    gloss: 'Nastya: Me gusta leer y a menudo escucho música.'
    note: 'Dos verbos de pasatiempos de las lecciones anteriores se unen con *и* (y): *люблю читать и часто слушаю музыку*.'
  ru.a1.unit25.lesson04.teach.dima_ty_tozhe:
    title: Dima pregunta por los videojuegos
    gloss: 'Dima: ¿Tú también juegas videojuegos?'
    note: 'Una pregunta corta de sí o no: en ruso se mantiene el orden de las palabras y solo sube la entonación: *Ты тоже играешь в игры?*'
  ru.a1.unit25.lesson04.teach.nastya_net_ya:
    title: Nastya responde
    gloss: 'Nastya: No, nunca juego videojuegos. ¡Pero a veces dibujo!'
    note: '*Никогда не* (nunca) lleva un *не* adicional delante del verbo. *Иногда* (a veces) es el contraste.'
  ru.a1.unit25.lesson05.teach.my_s_dimoy:
    title: Comparar aficiones
    gloss: Dima y yo paseamos juntos a menudo. Pero también tenemos otros pasatiempos. A Dima le gusta cocinar, también en casa, y hace deporte a menudo. A mí me gusta leer y a menudo escucho música. A veces dibujo, pero nunca juego videojuegos. ¿Qué te gusta hacer en tu tiempo libre?
    note: El mensaje de Nastya resume datos de una lección anterior y termina preguntando al lector la cuestión central de la unidad.
    glosses:
      гуляем: pasea
      часто: a menudo
      вместе: juntos
      другие: otros
      готовить: cocina
      любит: le gusta
      дома: en casa
      занимается: hace deporte
      читать: leer
      слушаю: escucho
      музыку: música
      рисую: dibujo
      иногда: a veces
      играю: juego a videojuegos
      никогда: nunca
      свободное: libre
      время: tiempo
  ru.a1.unit25.lesson06.teach.dima_chto_ty:
    title: Dima pregunta por el fin de semana
    gloss: 'Dima: ¿Qué haces este fin de semana?'
    note: '*В эти выходные* (este fin de semana): *выходные* es plural, así que *эти* también es plural, y *в* con una expresión de tiempo lleva acusativo.'
  ru.a1.unit25.lesson06.teach.nastya_poka_ne:
    title: Nastya no se decide
    gloss: 'Nastya: Todavía no lo sé. Me gusta leer, pero también quiero salir a la calle.'
    note: '*Хочу ещё выйти на улицу* significa «también quiero salir a la calle». *Хочу* es la forma de *я* de *хотеть*.'
  ru.a1.unit25.lesson06.teach.dima_davay_pogulyaem:
    title: Dima propone un plan
    gloss: 'Dima: ¿Paseamos juntos? Después te preparo algo de comer.'
    note: '*Давай погуляем* es la forma habitual de proponer hacer algo juntos, y *потом* (después) ordena el siguiente paso.'
  ru.a1.unit25.lesson06.teach.nastya_khoroshaya_ideya:
    title: Nastya acepta
    gloss: 'Nastya: ¡Buena idea! Me gusta tanto pasear como cocinar.'
    note: '*Мне нравится* significa literalmente «a mí me es agradable»: la persona va en dativo (*мне*) y después viene lo que gusta.'
  ru.a1.unit25.lesson06.teach.dima_otlichno_togda:
    title: Dima lo confirma
    gloss: 'Dima: Perfecto. ¡Entonces nos vemos el sábado!'
    note: '*Увидимся в субботу* (nos vemos el sábado): *в* con un día de la semana lleva acusativo, así que *суббота* pasa a *субботу*.'
