    title: Uso mi teléfono todos los días
    gloss: Uso mi teléfono todos los días.
    note: 'Se repite *Каждый день* (todos los días): *Я каждый день пользуюсь телефоном*. Después de *пользоваться* lo que se usa va en instrumental.'
  ru.a1.unit30.lesson02.teach.prilozhenie:
    title: La aplicación
    gloss: la aplicación
    example_gloss: Tengo una aplicación para la previsión del tiempo.
  ru.a1.unit30.lesson02.teach.soobshchenie:
    title: El mensaje
    gloss: el mensaje
    example_gloss: Enviaré un mensaje por la aplicación.
  ru.a1.unit30.lesson02.teach.prognoz_pogody_slovo:
    title: Прогноз погоды y сообщение
    gloss: '*Прогноз погоды* son dos palabras, y la segunda, *погоды*, está en genitivo. *Сообщение* es un mensaje que se puede enviar o leer.'
    note: Une la palabra nueva con el sustantivo compuesto que ya se enseñó en la unidad del tiempo.
  ru.a1.unit30.lesson02.teach.nastya_otpravlyaet_soobshchenie:
    title: Nastya envía un mensaje por la aplicación
    gloss: Nastya envía un mensaje por la aplicación.
    note: '*Отправляет* (envía) es un verbo regular. El mensaje es el complemento directo en acusativo, y *через приложение* significa «por la aplicación».'
  ru.a1.unit30.lesson02.teach.dima_chitaet_soobshchenie:
    title: Dima lee el mensaje
    gloss: Dima lee el mensaje.
  ru.a1.unit30.lesson03.teach.iskat:
