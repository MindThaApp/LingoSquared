    title: Igor busca el pronóstico cada mañana
    gloss: Igor busca el pronóstico del tiempo cada mañana.
  ru.a1.unit30.lesson05.teach.lena_chasto_otpravlyaet:
    title: Lena escribe a menudo a Nastya
    gloss: Lena a menudo le envía un mensaje a Nastya.
  ru.a1.unit30.lesson06.teach.nastya_ya_vizhu:
    title: Nastya confirma el plan
    gloss: 'Nastya: Veo el mensaje. ¿Hacemos deporte el sábado a las diez en el parque?'
  ru.a1.unit30.lesson06.teach.dima_da_i:
    title: Dima confirma el tiempo
    gloss: 'Dima: Sí, ¡y el sábado hará sol!'
  ru.a1.unit30.lesson06.teach.igor_ya_togda:
    title: El plan de Igor
    gloss: 'Igor: Entonces yo correré un rato. Después también jugaré al fútbol.'
    note: '*Потом* (después) coloca el segundo plan tras el primero, y *побегаю* es perfectivo: «correré un rato».'
  ru.a1.unit30.lesson06.teach.lena_ya_luchshe:
    title: El plan de Lena
    gloss: 'Lena: Yo prefiero nadar, pero también voy al parque.'
    note: '*Я лучше поплаваю* significa «prefiero nadar». *Лучше* antes del verbo expresa preferencia.'
  ru.a1.unit30.lesson06.teach.nastya_zdorovo_do:
    title: Nastya cierra la conversación
    gloss: 'Nastya: ¡Genial! ¡Hasta el sábado en el parque!'
    note: Cierra en una sola línea el hilo de mensajes de esta unidad y el plan de la unidad de deportes.
