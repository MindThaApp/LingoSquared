    gloss: buscar
    example_gloss: Consulto la previsión del tiempo.
  ru.a1.unit30.lesson03.teach.posle_polzovatsya_slovo:
    title: Пользоваться e искать
    gloss: '*Пользоваться* se construye con instrumental (*пользоваться телефоном*), mientras que *искать* se construye con acusativo (*искать прогноз*).'
    note: 'Ambos verbos son regulares: *я пользуюсь, ты пользуешься*; *я ищу, ты ищешь*.'
  ru.a1.unit30.lesson03.teach.igor_ishchet_prognoz:
    title: Igor busca el pronóstico del tiempo
    gloss: Igor busca el pronóstico del tiempo.
  ru.a1.unit30.lesson03.teach.potom_on_idyot:
    title: Luego se va a correr
    gloss: Luego se va a correr.
    note: '*Идёт бегать* significa «va a correr»: *идёт* es un verbo de movimiento seguido del infinitivo de lo que va a hacer.'
  ru.a1.unit30.lesson04.teach.nastya_davay_v:
    title: Nastya propone un plan
    gloss: 'Nastya: ¿Hacemos deporte el sábado a las diez?'
  ru.a1.unit30.lesson04.teach.dima_khoroshaya_ideya:
    title: Dima acepta
    gloss: 'Dima: ¡Buena idea! Buscaré el pronóstico del tiempo.'
    note: '*Хорошая идея* es un adjetivo femenino con un sustantivo femenino. *Поищу* es el futuro perfectivo: «buscaré».'
  ru.a1.unit30.lesson04.teach.dima_v_subbotu:
    title: Dima mira el tiempo
    gloss: 'Dima: ¡El sábado hará sol!'
    note: '*Солнечно* es la palabra del tiempo. No hace falta el verbo «ser/estar»: *В субботу солнечно*.'
  ru.a1.unit30.lesson04.teach.igor_ya_vizhu:
    title: Igor ve el mensaje
    gloss: 'Igor: Veo el mensaje. ¡Hasta el sábado!'
  ru.a1.unit30.lesson04.teach.ty_uzhe_znaesh:
    title: До + genitivo
    gloss: 'Ya conoces *До свидания!* También puedes nombrar un día: *До субботы!*, *До завтра!* Después de *до* el sustantivo va en genitivo.'
    note: Amplía la fórmula de despedida de la unidad de saludos a un día concreto.
  ru.a1.unit30.lesson05.teach.nastya_kazhdyy_den:
    title: ¿Quién usa qué?
    gloss: Nastya llama a Dima todos los días. Usa el teléfono, no una aplicación. Dima no tiene ordenador en casa, pero usa internet en el teléfono. Igor busca el pronóstico del tiempo cada mañana. Luego sale a correr. Lena a menudo le envía un mensaje a Nastya. ¿Tú también usas el teléfono todos los días?
    note: Compara los hábitos tecnológicos de los cuatro personajes, con la misma forma que la lectura comparativa de la unidad de deportes.
