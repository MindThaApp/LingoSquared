teaching:
  ru.a1.unit13.lesson01.teach.vchera_byl:
    title: Вчера я был дома.
    gloss: Ayer estuve en casa.
    note: вчера significa «ayer»; был es el pasado masculino de «ser/estar», usado por un hombre.
  ru.a1.unit13.lesson01.teach.byla:
    title: была
    gloss: estuvo / estuve (dicho por una mujer)
    note: была es el pasado femenino de «ser/estar»; el verbo concuerda con el género del sujeto.
    example_gloss: Ayer ella estuvo en casa.
  ru.a1.unit13.lesson01.teach.vecherom:
    title: вечером
    gloss: por la noche
    note: вечером significa «por la tarde/noche» y sirve para precisar cuándo ocurrió algo en el pasado.
    example_gloss: Ayer por la noche estuve en casa.
  ru.a1.unit13.lesson02.teach.hodil_v_kino:
    title: Вчера я ходил в кино.
    gloss: Ayer fui al cine.
    note: ходил (masculino) es el pasado de «ir (a pie)», usado para un trayecto de ida y vuelta ya completado.
  ru.a1.unit13.lesson02.teach.hodila:
    title: ходила
    gloss: fui (dicho por una mujer)
    note: ходила es la forma femenina del pasado de «ir (a pie)».
    example_gloss: Ayer ella fue al cine.
  ru.a1.unit13.lesson02.teach.smotrel_film:
    title: смотрел фильм
    gloss: vi una película
    note: смотрел (masculino) / смотрела (femenino) es el pasado de «mirar/ver»; фильм significa «película».
    example_gloss: Vi una película.
  ru.a1.unit13.lesson03.teach.nastya_chto_ty_delal:
    title: Nastya pregunta qué hizo Dima
    gloss: 'Nastya: ¿Qué hiciste ayer?'
    note: Настя empieza con Что ты делал вчера?
  ru.a1.unit13.lesson03.teach.dima_hodil_smotrel:
    title: Dima responde y pregunta a su vez
    gloss: 'Dima: Fui al cine. Vi una buena película. ¿Y tú?'
