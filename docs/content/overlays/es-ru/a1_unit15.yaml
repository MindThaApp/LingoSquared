teaching:
  ru.a1.unit15.lesson01.teach.kofe_luchshe_chem_chay:
    title: Кофе лучше, чем чай.
    gloss: El café es mejor que el té.
    note: лучше («mejor») junto con чем («que») forma el comparativo básico.
  ru.a1.unit15.lesson01.teach.huzhe:
    title: хуже
    gloss: peor
    note: хуже («peor») es el comparativo opuesto de лучше y se usa igual, con чем.
    example_gloss: El té es peor que el café.
  ru.a1.unit15.lesson01.teach.kakoy:
    title: какой / какое
    gloss: cuál / qué tipo de
    note: какой (masculino) y какое (neutro) sirven para preguntar cuál de dos cosas, y concuerdan en género con el sustantivo.
    example_gloss: ¿Qué café es mejor?
  ru.a1.unit15.lesson02.teach.eto_kafe_bolshe:
    title: Это кафе больше, чем то.
    gloss: Esta cafetería es más grande que aquella.
    note: больше («más grande/más») junto con чем forma un comparativo de tamaño; это/то («esto/eso») señalan las dos cafeterías.
  ru.a1.unit15.lesson02.teach.menshe:
    title: меньше
    gloss: más pequeño / menos
    note: меньше («más pequeño/menos») es el comparativo opuesto de больше.
    example_gloss: Aquella cafetería es más pequeña que esta.
  ru.a1.unit15.lesson02.teach.dom:
    title: дом
    gloss: casa
    note: дом («casa») junto con этот/тот («este/aquel») permite comparar el tamaño de dos casas.
    example_gloss: Esta casa es más grande que aquella.
  ru.a1.unit15.lesson03.teach.nastya_kakoye_kafe_luchshe:
    title: Nastya pregunta qué cafetería es mejor
    gloss: 'Nastya: ¿Qué cafetería es mejor?'
    note: Настя empieza con Какое кафе лучше?
  ru.a1.unit15.lesson03.teach.dima_eto_kafe_luchshe:
    title: Dima responde
    gloss: 'Dima: Esta cafetería es mejor que aquella.'
    note: Дима responde Это кафе лучше, чем то.
  ru.a1.unit15.lesson03.teach.nastya_a_bolshe:
    title: Nastya pregunta por el tamaño y Dima lo confirma
    gloss: 'Nastya: ¿Y esta cafetería es más grande? Dima: Sí, esta cafetería es más grande que aquella.'
    note: 'Настя pregunta А это кафе больше? y Дима lo confirma: Да, это кафе больше, чем то.'
