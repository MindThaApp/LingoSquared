teaching:
  ru.a1.unit05.lesson01.teach.kotoryy_chas:
    title: Который час?
    gloss: ¿Qué hora es?
    note: Es la forma estándar de preguntar la hora; literalmente significa «¿cuál hora?».
  ru.a1.unit05.lesson01.teach.seychas_chas:
    title: Сейчас час.
    gloss: Ahora es la una.
    note: '«Час» solo significa «la una»: en ruso no se dice «один час» aquí, a diferencia del patrón con numerales a partir del 2.'
    example_gloss: ¿Qué hora es? — Es la una.
  ru.a1.unit05.lesson01.teach.dva_tri_chasa:
    title: два часа, три часа
    gloss: las dos, las tres
    note: Después de два y три, час toma la forma de genitivo singular часа, igual que en el patrón de numeral y sustantivo de la Unidad 3.
    example_gloss:
    - Ahora son las dos.
    - Ahora son las tres.
  ru.a1.unit05.lesson01.teach.pyat_desyat_chasov:
    title: пять часов, десять часов
    gloss: las cinco, las diez
    note: Desde пять en adelante, час pasa a la forma de genitivo plural часов, igual que el patrón del 5 en adelante de la Unidad 3.
    example_gloss:
    - Ahora son las cinco.
    - Ahora son las diez.
  ru.a1.unit05.lesson02.teach.v_kotorom_chasu:
    title: В котором часу?
    gloss: ¿A qué hora?
    note: Se usa para preguntar cuándo ocurre algo, a diferencia de Который час?, que solo pregunta la hora actual.
  ru.a1.unit05.lesson02.teach.utrom_dnem:
    title: утром, днём
    gloss: por la mañana, por el día
    note: Son formas adverbiales (caso instrumental) de утро y день, y se usan sin preposición.
    example_gloss:
    - Por la mañana tomo café.
    - Durante el día trabajo.
  ru.a1.unit05.lesson02.teach.vecherom_nochyu:
    title: вечером, ночью
    gloss: por la tarde, por la noche
    note: Mismo patrón de adverbio en instrumental que утром/днём.
    example_gloss:
    - Por la tarde estoy en casa.
    - Por la noche duermo.
  ru.a1.unit05.lesson02.teach.v_dva_chasa_dnya:
    title: В два часа дня.
    gloss: A las dos de la tarde.
    note: Añadir дня (genitivo de день) después de la hora aclara que son las dos de la tarde, no las dos de la madrugada.
    example_gloss: ¿A qué hora es la reunión? — A las dos de la tarde.
  ru.a1.unit05.lesson02.teach.v_sem_chasov_vechera:
    title: В семь часов вечера.
    gloss: A las siete de la tarde.
    note: вечера (genitivo de вечер) aclara que estas siete son de la tarde-noche.
    example_gloss: La tienda cierra a las siete de la tarde.
  ru.a1.unit05.lesson03.teach.skazhite_pozhaluysta:
    title: Скажите, пожалуйста, который час?
    gloss: Disculpe, ¿podría decirme qué hora es?
    note: Скажите, пожалуйста suaviza la pregunta y es adecuado para dirigirse a un desconocido.
  ru.a1.unit05.lesson03.teach.kogda_otkhodit:
    title: Когда отходит поезд?
    gloss: ¿Cuándo sale el tren?
    note: Отходит («sale») es el verbo habitual para un tren o autobús que sale de una estación.
  ru.a1.unit05.lesson03.teach.passazhir_vopros:
    title: El pasajero pregunta la hora
    gloss: 'Pasajero: Disculpe, ¿podría decirme qué hora es?'
    note: El pasajero empieza con cortesía usando Скажите, пожалуйста, adecuado para dirigirse al personal de la estación.
  ru.a1.unit05.lesson03.teach.kassir_sem:
    title: El empleado responde
    gloss: 'Empleado: Son las siete de la mañana.'
    note: Сейчас семь часов утра indica la hora actual y añade утра («de la mañana») para mayor claridad.
  ru.a1.unit05.lesson03.teach.passazhir_kogda:
    title: El pasajero pregunta por el tren
    gloss: 'Pasajero: ¿Y cuándo sale el tren?'
    note: А introduce con naturalidad la siguiente pregunta del pasajero.
  ru.a1.unit05.lesson03.teach.kassir_vosem:
    title: El empleado indica la hora de salida
    gloss: 'Empleado: A las ocho de la mañana.'
    note: В восемь часов утра responde con la preposición в, la hora y la palabra del momento del día.
