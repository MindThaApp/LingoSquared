course:
  title: Ruso A1
  description: Aprende ruso de nivel A1 para los saludos cotidianos y los intercambios sociales breves, con explicaciones detalladas del alfabeto cirílico y de la diferencia de formalidad entre вы y ты.
units:
  ru.a1.unit01.greetings:
    title: Saludos y despedidas
lessons:
  ru.a1.unit01.lesson01.script_ramp:
    title: Conoce el alfabeto cirílico
  ru.a1.unit01.lesson02.vremya_dnya:
    title: Saludos según la hora del día
  ru.a1.unit01.lesson03.kak_dela_i_proshchanie:
    title: ¿Cómo estás? y cómo despedirse
teaching:
  ru.a1.unit01.lesson01.teach.direction:
    title: Dirección de lectura
    gloss: El alfabeto ruso se lee de izquierda a derecha, igual que el español.
    note: 'El ruso (escritura cirílica) se lee en el mismo sentido que el español, así que no necesitas ningún hábito nuevo de lectura: solo formas y sonidos de letras nuevos.'
  ru.a1.unit01.lesson01.teach.letter_z:
    title: З з
    gloss: la letra Z
    note: Se pronuncia como una «s» sonora, el sonido de la «s» en «mismo». La minúscula з se parece al número 3.
  ru.a1.unit01.lesson01.teach.letter_d:
    title: Д д
    gloss: la letra D
    note: Se pronuncia como la «d» de «dos». La minúscula д es una versión pequeña de la mayúscula, con unos «pies» cortos bajo la línea; no se parece en nada a la «d» latina, así que aprende la forma desde cero.
  ru.a1.unit01.lesson01.teach.letter_r:
    title: Р р
    gloss: la letra R
    note: 'Se pronuncia como una «r» vibrante múltiple, como la «rr» de «perro». Se parece a la «P» latina: es un falso amigo visual clásico, así que no la leas como «p».'
  ru.a1.unit01.lesson01.teach.letter_a:
    title: А а
    gloss: la letra A
    note: Se pronuncia como la «a» de «casa». Es idéntica a la «A/a» latina y suena muy parecido.
  ru.a1.unit01.lesson01.teach.letter_v:
    title: В в
    gloss: la letra V
    note: 'Se pronuncia como una «v» labiodental (dientes superiores sobre el labio inferior), no como la «b» bilabial del español. Se parece a la «B» latina: otro falso amigo visual al que debes prestar atención.'
  ru.a1.unit01.lesson01.teach.letter_s:
    title: С с
    gloss: la letra S
    note: Se pronuncia como la «s» de «sol». Se parece a la «C/c» latina y suena como una «s», pero en ruso nunca suena como «k».
  ru.a1.unit01.lesson01.teach.letter_t:
    title: Т т
    gloss: la letra T
    note: Se pronuncia como la «t» de «todo». La minúscula т a veces se escribe a mano como una «m» pequeña; la forma impresa de aquí es la que debes aprender primero.
  ru.a1.unit01.lesson01.teach.letter_u:
    title: У у
    gloss: la letra U
    note: 'Se pronuncia como la «u» de «luna». Se parece a una «y» latina: otra forma cuyo sonido no coincide con el de la letra latina que se le parece.'
  ru.a1.unit01.lesson01.teach.letter_ye:
    title: Е е
    gloss: la letra Ye
    note: Al principio de palabra o de sílaba se pronuncia como «ye» en «yema». Es idéntica a la «E/e» latina, pero suena bastante distinto.
  ru.a1.unit01.lesson01.teach.hard_sign_note:
    title: 'ъ y ь: signo duro y signo blando'
    gloss: 'El signo duro ъ y el signo blando ь no tienen sonido propio: cambian la pronunciación de la letra que tienen al lado.'
    note: 'Estos dos signos nunca representan un sonido por sí solos: ь ablanda la consonante anterior y ъ marca una separación firme entre sonidos. Volverán a aparecer cuando haya palabras reales que los usen.'
  ru.a1.unit01.lesson01.teach.letter_short_i:
    title: Й й
    gloss: la letra I breve
    note: 'Se pronuncia como la «i» final de «hoy» o «aire»: un deslizamiento rápido, no una vocal completa. Aparece en Здравствуйте, la palabra a la que lleva esta lección.'
  ru.a1.unit01.lesson01.teach.zdravstvuyte_shape:
    title: Здравствуйте
    gloss: hola (formal)
    note: El saludo formal completo, formado con las letras que acabas de aprender. Parece largo y lleno de consonantes, pero todas sus letras ya se han visto en esta lección.
    example_gloss: ¡Hola! Me llamo Viktor.
  ru.a1.unit01.lesson02.teach.zdravstvuyte_privet:
    title: Здравствуйте, Привет
    gloss: hola (formal); hola (informal)
    note: Здравствуйте es el saludo formal seguro y válido a cualquier hora del día y con cualquier desconocido. Привет es coloquial y se usa con amigos y personas de tu edad.
    example_gloss:
    - ¡Hola! ¿Cómo está usted? (formal)
    - ¡Hola! ¿Qué tal? (informal)
  ru.a1.unit01.lesson02.teach.dobroe_utro:
    title: Доброе утро!
    gloss: buenos días
    note: Se usa por la mañana, aproximadamente hasta el final de la mañana.
  ru.a1.unit01.lesson02.teach.dobryy_den:
    title: Добрый день!
    gloss: buen día / hola
    note: El saludo habitual durante el día; se puede usar desde finales de la mañana hasta la tarde.
  ru.a1.unit01.lesson02.teach.dobryy_vecher:
    title: Добрый вечер!
    gloss: buenas tardes / buenas noches (saludo)
    note: 'Se usa al llegar a algún sitio por la tarde-noche: es un saludo, no una despedida.'
  ru.a1.unit01.lesson02.teach.register_note:
    title: Cómo elegir un saludo
    gloss: Здравствуйте sirve a cualquier hora del día y en un trato cortés. Привет es informal y se usa entre amigos.
    note: Si dudas sobre la hora del día o sobre con quién hablas, Здравствуйте siempre es una opción segura; Привет se reserva para personas que ya conoces bien.
  ru.a1.unit01.lesson03.teach.kak_dela:
    title: Как дела?
    gloss: ¿Cómo estás? (informal)
    note: La forma informal habitual de preguntar cómo está alguien, con amigos y personas de tu edad.
  ru.a1.unit01.lesson03.teach.kak_pozhivaete:
    title: Как поживаете?
    gloss: ¿Cómo está usted? (formal)
    note: La forma formal de preguntar cómo está alguien, acorde con el registro de вы.
  ru.a1.unit01.lesson03.teach.horosho_spasibo:
    title: Хорошо, спасибо
    gloss: bien, gracias
    note: Una respuesta sencilla y positiva, válida en ambos registros.
    example_gloss: ¿Cómo estás? — Bien, gracias.
  ru.a1.unit01.lesson03.teach.tak_sebe:
    title: Так себе
    gloss: así así
    note: Una respuesta de neutra a ligeramente negativa, para cuando las cosas no van ni muy bien ni mal.
    example_gloss: ¿Cómo estás? — Así así.
  ru.a1.unit01.lesson03.teach.a_u_tebya:
    title: А у тебя?
    gloss: ¿Y tú?
    note: La forma informal de devolver la pregunta a la otra persona, acorde con el registro de ты.
  ru.a1.unit01.lesson03.teach.do_svidaniya:
    title: До свидания!
    gloss: adiós (neutro/formal)
    note: La despedida estándar y válida en cualquier situación; literalmente se acerca a «hasta que volvamos a vernos».
  ru.a1.unit01.lesson03.teach.poka:
    title: Пока!
    gloss: chao (informal)
    note: Una forma coloquial y muy común de despedirse entre amigos y conocidos.
  ru.a1.unit01.lesson03.teach.do_zavtra:
    title: До завтра!
    gloss: hasta mañana
    note: Una despedida amistosa que se usa cuando esperas ver a la persona al día siguiente.
  ru.a1.unit01.lesson03.teach.anna:
    title: Anna saluda a Maksim
    gloss: 'Anna dice: ¡Buenas! ¿Cómo estás?'
    note: Anna y Maksim son colegas que se saludan durante el día, con la confianza que implica дела (registro informal).
  ru.a1.unit01.lesson03.teach.maksim_reply:
    title: Maksim responde y pregunta a su vez
    gloss: 'Maksim dice: Bien, gracias. ¿Y tú?'
    note: Maksim responde y devuelve la pregunta de manera informal, en el mismo registro que Anna.
  ru.a1.unit01.lesson03.teach.anna_close:
    title: Anna cierra la conversación
    gloss: 'Anna dice: Yo también bien. Bueno, ¡hasta mañana!'
    note: Anna termina la charla breve y pasa a una despedida amistosa.
  ru.a1.unit01.lesson03.teach.maksim_close:
    title: Maksim se despide
    gloss: 'Maksim dice: ¡Hasta mañana!'
    note: Maksim repite la despedida de Anna y cierra la conversación.
