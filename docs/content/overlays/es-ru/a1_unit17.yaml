teaching:
  ru.a1.unit17.lesson01.teach.ya_vrach_rabotayu_v_bolnitse:
    title: Я врач. Я работаю в больнице.
    gloss: Soy médico. Trabajo en un hospital.
    note: врач significa «médico» (la profesión); работаю в + caso preposicional significa «trabajo en».
  ru.a1.unit17.lesson01.teach.uchitel:
    title: учитель
    gloss: maestro/maestra
    note: учитель significa «maestro/maestra». работает es la forma «él/ella trabaja» de работать.
    example_gloss: Ella es maestra. Trabaja en una escuela.
  ru.a1.unit17.lesson01.teach.inzhener:
    title: инженер
    gloss: ingeniero
    note: инженер significa «ingeniero». офис significa «oficina»; в офисе es la forma preposicional, «en la oficina».
    example_gloss: Él es ingeniero. Trabaja en una oficina.
  ru.a1.unit17.lesson02.teach.kem_ty_rabotayesh:
    title: Кем ты работаешь?
    gloss: ¿De qué trabajas?
    note: Кем ты работаешь? es la forma habitual de preguntar por la profesión de alguien; кем es el caso instrumental de «quién», que se usa con работать.
  ru.a1.unit17.lesson02.teach.prodavets:
    title: продавец
    gloss: vendedor/vendedora / dependiente
    note: продавец significa «vendedor» (trabaja en una tienda). магазин significa «tienda»; в магазине es la forma preposicional.
    example_gloss: Él es vendedor. Trabaja en una tienda.
  ru.a1.unit17.lesson02.teach.povar:
    title: повар
    gloss: cocinero/cocinera
    note: повар significa «cocinero». ресторан significa «restaurante»; в ресторане es la forma preposicional.
    example_gloss: Ella es cocinera. Trabaja en un restaurante.
  ru.a1.unit17.lesson03.teach.nastya_kem_ty_rabotayesh:
    title: Nastya pregunta a Dima por su profesión
    gloss: 'Nastya: ¿De qué trabajas, Dima?'
    note: Настя empieza con Кем ты работаешь, Дима?
  ru.a1.unit17.lesson03.teach.dima_inzhener_ofise:
    title: Dima responde y pregunta a su vez
    gloss: 'Dima: Soy ingeniero. Trabajo en una oficina. ¿Y tú?'
    note: Дима responde Я инженер. Я работаю в офисе. А ты?
  ru.a1.unit17.lesson03.teach.nastya_uchitel_shkole:
    title: Nastya responde
    gloss: 'Nastya: Soy maestra. Trabajo en una escuela.'
    note: Настя cierra con Я учитель. Я работаю в школе.
