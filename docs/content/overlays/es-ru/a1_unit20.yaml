teaching:
  ru.a1.unit20.lesson01.teach.segodnya_holodno:
    title: Сегодня холодно.
    gloss: Hoy hace frío.
    note: 'El ruso suele usar una palabra impersonal para el tiempo: холодно, literalmente «fríamente».'
    example_gloss: Hoy hace frío, Dima.
  ru.a1.unit20.lesson01.teach.teplo:
    title: тепло
    gloss: cálido
    note: тепло funciona igual que холодно para hablar del tiempo o de la temperatura.
    example_gloss: En casa hace calor.
  ru.a1.unit20.lesson01.teach.pogoda:
    title: погода
    gloss: tiempo (meteorológico)
    note: погода significa «tiempo atmosférico».
    example_gloss: 'El tiempo: hoy hace frío.'
  ru.a1.unit20.lesson02.teach.idet_dozhd:
    title: Идёт дождь.
    gloss: Está lloviendo.
    note: 'En ruso se dice дождь идёт, literalmente «la lluvia va». Como en español, no hace falta un sujeto como «ello»: el verbo se usa sin sujeto añadido.'
    example_gloss: Hoy está lloviendo.
  ru.a1.unit20.lesson02.teach.solntse:
    title: солнце
    gloss: sol
    note: Сегодня солнце es una forma sencilla de decir que hoy hace sol. En ruso aquí se nombra el tiempo sin verbo.
    example_gloss: Hoy hace sol.
  ru.a1.unit20.lesson02.teach.veter:
    title: ветер
    gloss: viento
    note: На улице ветер es una forma natural de decir que afuera hace viento.
    example_gloss: Afuera hace viento.
  ru.a1.unit20.lesson03.teach.nastya_kakaya_pogoda:
    title: Nastya pregunta por el tiempo
    gloss: 'Nastya: ¿Qué tiempo hace hoy?'
    note: Какая сегодня погода? es la pregunta habitual.
  ru.a1.unit20.lesson03.teach.dima_holodno_dozhd:
    title: Dima describe el tiempo
    gloss: 'Dima: Hoy hace frío y está lloviendo.'
    note: Dima une dos datos del tiempo con и.
  ru.a1.unit20.lesson03.teach.nastya_ostanemsya_doma:
    title: Nastya propone un plan
    gloss: 'Nastya: Entonces quedémonos en casa.'
    note: Давай останемся дома es una propuesta informal.
  ru.a1.unit20.lesson03.teach.dima_doma_teplo:
    title: Dima está de acuerdo
    gloss: 'Dima: Vale, en casa hace calor.'
    note: Дома тепло da una razón para el plan.
