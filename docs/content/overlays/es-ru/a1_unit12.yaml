teaching:
  ru.a1.unit12.lesson01.teach.davay:
    title: Давай пойдём...
    gloss: Vamos a ir...
    note: Давай es un marcador informal de propuesta («vamos a»); пойдём es la forma de «nosotros» del futuro de «ir»; juntos sirven para proponer una actividad.
  ru.a1.unit12.lesson01.teach.kino:
    title: кино
    gloss: el cine
    note: кино es un sustantivo neutro indeclinable que significa «cine».
    example_gloss: Vamos al cine.
  ru.a1.unit12.lesson01.teach.zavtra_subbotu:
    title: завтра, в субботу
    gloss: mañana, el sábado
    note: завтра significa «mañana»; в субботу usa в + acusativo para un día de la semana.
    example_gloss: Vamos al cine mañana.
  ru.a1.unit12.lesson02.teach.soglasen:
    title: Хорошо, я согласен.
    gloss: Bien, de acuerdo.
    note: согласен («de acuerdo») lo dice un hombre; una mujer diría согласна.
  ru.a1.unit12.lesson02.teach.ne_mogu:
    title: К сожалению, я не могу.
    gloss: Lamentablemente, no puedo.
    note: К сожалению («lamentablemente») suaviza un rechazo; не могу significa «no puedo».
  ru.a1.unit12.lesson02.teach.vo_skolko:
    title: Во сколько мы встретимся?
    gloss: ¿A qué hora quedamos?
    note: Во сколько pregunta por la hora; встретимся es la forma de «nosotros» del futuro de «encontrarse».
    example_gloss: Digamos que a las siete.
  ru.a1.unit12.lesson03.teach.nastya_davay_poydyom:
    title: Nastya propone un plan
    gloss: 'Nastya: Vamos al cine el sábado.'
    note: Настя empieza con Давай пойдём в кино в субботу.
  ru.a1.unit12.lesson03.teach.dima_horosho_soglasen:
    title: Dima acepta y pregunta la hora
    gloss: 'Dima: Vale, estoy de acuerdo. ¿A qué hora quedamos?'
    note: Дима acepta y luego pregunta Во сколько мы встретимся?
  ru.a1.unit12.lesson03.teach.nastya_davay_v_sem:
    title: Nastya propone la hora y el lugar
    gloss: 'Nastya: Digamos que a las siete, en el cine.'
    note: у кинотеатра significa «junto al cine» o «en el cine»; se usa у + genitivo.
  ru.a1.unit12.lesson03.teach.dima_otlichno:
    title: Dima confirma
    gloss: 'Dima: Genial, nos vemos el sábado.'
    note: Отлично, до субботы cierra el intercambio; до субботы significa literalmente «hasta el sábado».
