teaching:
  ru.a1.unit18.lesson01.teach.eto_moya_kvartira:
    title: Это моя квартира.
    gloss: Este es mi apartamento.
    note: Это significa «esto es»; моя («mi», femenino) concuerda con el sustantivo femenino квартира («apartamento»).
  ru.a1.unit18.lesson01.teach.kuhnya:
    title: кухня
    gloss: cocina
    note: кухня significa «cocina». стол significa «mesa».
    example_gloss: Hay una mesa en la cocina.
  ru.a1.unit18.lesson01.teach.spalnya:
    title: спальня
    gloss: dormitorio
    note: спальня significa «dormitorio». кровать significa «cama».
    example_gloss: Hay una cama en el dormitorio.
  ru.a1.unit18.lesson02.teach.divan_v_gostinoy:
    title: Диван в гостиной.
    gloss: El sofá está en el salón.
    note: диван significa «sofá»; гостиная significa «sala de estar» (гостиной es su forma preposicional después de в, «en»).
  ru.a1.unit18.lesson02.teach.stol_na_kuhne:
    title: на
    gloss: en
    note: Con кухня se usa на en lugar de в (literalmente «sobre la cocina», pero significa «en la cocina»), a diferencia de la mayoría de las habitaciones.
    example_gloss: La mesa está en la cocina.
  ru.a1.unit18.lesson02.teach.vannaya:
    title: ванная
    gloss: baño
    note: ванная significa «baño».
    example_gloss: El baño está al lado del dormitorio.
  ru.a1.unit18.lesson03.teach.dima_gde_ty_zhivyosh:
    title: Dima le pregunta a Nastya dónde vive
    gloss: 'Dima: Nastya, ¿dónde vives?'
    note: Дима empieza con Настя, где ты живёшь?
  ru.a1.unit18.lesson03.teach.nastya_zhivu_v_kvartire:
    title: Nastya dice dónde vive
    gloss: 'Nastya: Vivo en un apartamento.'
    note: Настя responde Я живу в квартире; живу es la forma de «yo» de жить («vivir») y в квартире es la forma preposicional de квартира.
  ru.a1.unit18.lesson03.teach.dima_skolko_komnat:
    title: Dima pregunta cuántas habitaciones hay
    gloss: 'Dima: ¿Cuántas habitaciones tiene el apartamento?'
    note: 'Сколько («cuántos») va seguido del genitivo plural: сколько комнат.'
  ru.a1.unit18.lesson03.teach.nastya_dve_komnaty:
    title: Nastya enumera las habitaciones
    gloss: 'Nastya: Dos habitaciones: un dormitorio y una sala de estar. También hay una cocina y un baño.'
    note: 'Настя continúa: Две комнаты: спальня и гостиная. Кухня и ванная тоже есть.'
