teaching:
  ru.a1.unit08.lesson01.teach.magazin:
    title: магазин
    gloss: tienda
    note: магазин es un sustantivo masculino que significa «tienda».
    example_gloss: Vamos a la tienda.
  ru.a1.unit08.lesson01.teach.skolko:
    title: сколько
    gloss: cuánto
    note: сколько pregunta por la cantidad o el precio y a menudo va con стоит.
    example_gloss: ¿Cuánto cuesta el pan?
  ru.a1.unit08.lesson01.teach.stoit:
    title: стоит
    gloss: cuesta
    note: стоит es la tercera persona del singular de стоить («costar»), y se usa con un sujeto singular como хлеб.
    example_gloss: El pan cuesta cien rublos.
  ru.a1.unit08.lesson01.teach.rubl:
    title: рубль
    gloss: rublo
    note: рубль es la moneda rusa; сто («cien») exige el genitivo plural рублей.
    example_gloss: El pan cuesta cien rublos.
  ru.a1.unit08.lesson01.teach.khleb_moloko:
    title: хлеб, молоко
    gloss: pan, leche
    note: хлеб es masculino y молоко es neutro; ambos son productos cotidianos de la compra.
    example_gloss:
    - ¿Cuánto cuesta el pan?
    - ¿Cuánto cuesta la leche?
  ru.a1.unit08.lesson02.teach.dayte_pozhaluysta:
    title: Дайте, пожалуйста, ...
    gloss: Deme..., por favor
    note: Дайте es el imperativo formal o plural de дать («dar»), que se usa con вы.
  ru.a1.unit08.lesson02.teach.kilogramm:
    title: килограмм
    gloss: kilogramo
    note: килограмм es la unidad habitual para comprar fruta, verdura o pan por peso.
    example_gloss: Deme un kilo, por favor.
  ru.a1.unit08.lesson02.teach.polkilo:
    title: полкило
    gloss: medio kilo
    note: полкило une пол- («medio») y кило (forma corta coloquial de килограмм).
    example_gloss: Deme medio kilo, por favor.
  ru.a1.unit08.lesson02.teach.shtuka:
    title: штука
    gloss: pieza (unidad)
    note: штука sirve para contar unidades; пять штук usa el genitivo plural después del número пять.
    example_gloss:
    - Deme una pieza, por favor.
    - Deme cinco piezas, por favor.
  ru.a1.unit08.lesson03.teach.pomidory_ogurtsy:
    title: помидоры, огурцы
    gloss: tomates, pepinos
    note: Ambos son sustantivos de verdura en plural; помидоры es masculino y огурцы también es masculino.
    example_gloss:
    - ¿Tienen tomates?
    - ¿Tienen pepinos?
  ru.a1.unit08.lesson03.teach.kartofel_kapusta:
    title: картофель, капуста
    gloss: patatas, repollo
    note: картофель es un sustantivo colectivo masculino (se usa como incontable) y капуста es femenino.
    example_gloss:
    - ¿Tiene patatas?
    - ¿Tiene col?
  ru.a1.unit08.lesson03.teach.yabloki_apelsiny:
    title: яблоки, апельсины
    gloss: manzanas, naranjas
    note: кило яблок usa el genitivo plural яблок después de кило («un kilo de manzanas»), el mismo patrón que кило апельсинов.
    example_gloss:
    - ¿Cuánto cuesta un kilo de manzanas?
    - ¿Cuánto cuesta un kilo de naranjas?
  ru.a1.unit08.lesson03.teach.u_vas_est:
    title: У вас есть ...?
    gloss: ¿Tiene ...? (formal)
    note: Usa el registro formal вас, la forma habitual de preguntar a un tendero si tiene un producto.
  ru.a1.unit08.lesson03.teach.da_u_menya_est:
    title: Да, у меня есть ...
    gloss: Sí, tengo ...
    note: У меня есть («junto a mí hay») es la forma habitual de decir «tengo», la respuesta del vendedor.
  ru.a1.unit08.lesson03.teach.pokupatel_pomidory:
    title: El cliente pregunta por los tomates
    gloss: 'Cliente: ¿Tiene tomates?'
    note: El cliente empieza con la pregunta cortés У вас есть ...?
  ru.a1.unit08.lesson03.teach.prodavets_da_est:
    title: El vendedor dice que sí
    gloss: 'Vendedor: Sí, tenemos.'
    note: Да, есть es la respuesta corta y cotidiana (literalmente «sí, hay») sin repetir el producto.
  ru.a1.unit08.lesson03.teach.pokupatel_kilo_yablok:
    title: El cliente pregunta el precio
    gloss: 'Cliente: ¿Cuánto cuesta un kilo de manzanas?'
    note: кило яблок usa el genitivo plural яблок después de кило.
  ru.a1.unit08.lesson03.teach.prodavets_dvesti:
    title: El vendedor dice el precio
    gloss: 'Vendedor: Doscientos rublos.'
    note: Двести significa «doscientos»; igual que сто, va seguido del genitivo plural рублей.
  ru.a1.unit08.lesson03.teach.pokupatel_dayte_kilogramm:
    title: El cliente compra un kilo
    gloss: 'Cliente: Deme un kilo de manzanas, por favor.'
    note: Дайте ..., пожалуйста de la lección 2, ahora con килограмм яблок («un kilogramo de manzanas»).
  ru.a1.unit08.lesson03.teach.prodavets_khorosho:
    title: El vendedor entrega la compra
    gloss: 'Vendedor: Muy bien, aquí tiene.'
    note: Aquí пожалуйста significa «aquí tiene» cuando el vendedor entrega la compra, no «por favor».
