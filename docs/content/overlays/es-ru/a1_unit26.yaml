  ru.a1.unit26.lesson05.sravnivaem_igorya_i_lenu:
    title: Comparamos a Igor y Lena
  ru.a1.unit26.lesson06.dima_uznayot_ninu:
    title: Dima reconoce a Nina
teaching:
  ru.a1.unit26.lesson01.teach.vysokiy_nevysokiy:
    title: Alto y bajo
    gloss: alto / bajo
    note: '*Высокий* describe a una persona alta y *невысокий* a una baja (literalmente «no alto»). La terminación cambia según el género: *высокая*, *невысокая*.'
    example_gloss:
    - Lena es alta.
    - Igor es bajo.
  ru.a1.unit26.lesson01.teach.staryy_molodoy:
    title: Viejo y joven
    gloss: viejo / joven
    note: '*Старый* y *молодой* describen aquí una impresión general de la edad, no un número exacto de años.'
    example_gloss:
    - El abuelo es viejo.
    - Dima es joven.
  ru.a1.unit26.lesson01.teach.prilagatelnoe_menyaetsya_po:
    title: Los adjetivos cambian según el género
    gloss: 'El adjetivo concuerda con la persona: *он высокий, она высокая*; *он старый, она старая*.'
    note: Los adjetivos masculinos terminan en *-ый*, *-ий* o *-ой* (*высокий*, *молодой*); los femeninos terminan en *-ая* (*высокая*, *молодая*).
  ru.a1.unit26.lesson01.teach.lena_vysokaya_a:
    title: Lena es alta e Igor es bajo
    gloss: Lena es alta e Igor es bajo.
    note: 'Se ponen dos afirmaciones en contraste con *а* (mientras que, y): *Лена высокая, а Игорь невысокий*.'
  ru.a1.unit26.lesson02.teach.volosy:
    title: El pelo
    gloss: el pelo
    note: '*Волосы* (pelo) es plural en ruso: *У Насти светлые волосы*; nunca se usa como sustantivo singular.'
    example_gloss: Dima tiene el pelo negro y corto.
  ru.a1.unit26.lesson02.teach.svetlye_kashtanovye_sedye:
    title: Rubio, castaño y gris
    gloss: rubio / castaño / gris
    note: 'Tres colores de pelo en plural para concordar con *волосы*: *светлые*, *каштановые*, *седые*.'
    example_gloss:
    - Nastya tiene el pelo rubio.
    - Igor tiene el pelo castaño.
    - El abuelo tiene el pelo gris.
  ru.a1.unit26.lesson02.teach.dlinnye_korotkie:
    title: Largo y corto (pelo)
    gloss: largo / corto (pelo)
    note: '*Длинные* (largo) y *короткие* (corto) también concuerdan con el plural *волосы*.'
    example_gloss:
    - Lena tiene el pelo largo.
    - Igor tiene el pelo corto.
  ru.a1.unit26.lesson02.teach.volosy_stoyat_vo:
    title: Los adjetivos concuerdan con волосы
    gloss: '*Волосы* es plural, así que el adjetivo también va en plural: *длинные волосы*, *короткие волосы*, *светлые волосы*, *чёрные волосы*.'
    note: Los adjetivos en plural terminan en *-ые* o *-ие*. Verás la misma terminación con *глаза* en la próxima lección.
  ru.a1.unit26.lesson02.teach.posle_u_imya:
    title: У más genitivo
    gloss: 'Después de *у*, el poseedor va en genitivo: *у Насти* (Nastya tiene), *у Димы* (Dima tiene), *у неё* (ella tiene).'
    note: 'Así dice el ruso «tener»: *у* + genitivo + lo que se posee. No se usa un verbo equivalente a «tener».'
  ru.a1.unit26.lesson02.teach.u_dimy_korotkie:
    title: Dima tiene el pelo negro y corto
    gloss: Dima tiene el pelo negro y corto.
    note: '*Чёрные* (negro) concuerda con el plural *волосы*. En este curso la letra *ё* siempre se escribe.'
  ru.a1.unit26.lesson02.teach.u_nasti_dlinnye:
    title: Nastya tiene el pelo rubio y largo
    gloss: Nastya tiene el pelo rubio y largo.
    note: Combina el vocabulario de longitud y de color de esta lección en una frase natural.
  ru.a1.unit26.lesson03.teach.glaza:
    title: Los ojos
    gloss: los ojos
    note: '*Глаза* (ojos) es el plural de *глаз*; la terminación del plural es *-а*.'
    example_gloss: Dima tiene los ojos marrones.
  ru.a1.unit26.lesson03.teach.golubye_karie_zelyonye:
    title: Azul, marrón y verde
    gloss: azul / marrón / verde
    note: '*Голубые* es azul claro, *карие* es marrón solo para los ojos y *зелёные* es verde. Los tres están en plural.'
    example_gloss:
    - Nastya tiene los ojos azules.
    - Igor tiene los ojos marrones.
    - Lena tiene los ojos verdes.
  ru.a1.unit26.lesson03.teach.glaza_stoyat_vo:
    title: Los adjetivos concuerdan con глаза
    gloss: '*Глаза* es plural, así que el adjetivo también va en plural: *голубые глаза*, *карие глаза*, *зелёные глаза*.'
    note: 'Los ojos marrones son *карие*, no *коричневые*, y el pelo castaño es *каштановые*: el ruso usa palabras distintas para los ojos y para el pelo.'
  ru.a1.unit26.lesson03.teach.kak_vyglyadit_nastya:
    title: ¿Cómo es Nastya físicamente?
    gloss: ¿Cómo es Nastya físicamente?
    note: '*Как выглядит ...?* es la pregunta clave de esta unidad. El verbo *выглядит* concuerda con un sujeto singular.'
  ru.a1.unit26.lesson03.teach.u_nasti_dlinnye:
    title: Nastya tiene el pelo rubio y largo y los ojos azules
    gloss: Nastya tiene el pelo rubio y largo y los ojos azules.
    note: 'En una respuesta modelo se unen el pelo y los ojos con *и*: *У Насти длинные светлые волосы и голубые глаза*.'
  ru.a1.unit26.lesson04.teach.nastya_v_yazykovoe:
    title: Nastya presenta a Nina
    gloss: 'Nastya: Va a venir una chica nueva al café de idiomas. Se llama Nina.'
    note: '*Придёт* (vendrá) es el futuro perfectivo. *Её зовут Нина* significa literalmente «la llaman Nina».'
  ru.a1.unit26.lesson04.teach.dima_khorosho_kak:
    title: Dima pregunta cómo es ella
    gloss: 'Dima: ¡Bien! ¿Cómo es físicamente?'
    note: De nuevo la pregunta clave, ahora con *она* (ella) en lugar de un nombre.
  ru.a1.unit26.lesson04.teach.nastya_ona_nevysokaya:
    title: Nastya describe la estatura y el pelo de Nina
    gloss: 'Nastya: Es baja y tiene el pelo rubio y corto.'
    note: Combina *невысокая* de la lección 1 con las palabras del pelo de la lección 2. *И у неё* añade el segundo dato.
  ru.a1.unit26.lesson04.teach.dima_a_kakie:
    title: Dima pregunta por sus ojos
    gloss: 'Dima: ¿Y sus ojos?'
    note: '*Какие у неё глаза?* usa *у неё* («ella tiene»). *Неё* es la forma de *она* después de la preposición *у*.'
  ru.a1.unit26.lesson04.teach.nastya_u_neyo:
    title: Nastya describe los ojos de Nina
    gloss: 'Nastya: Tiene los ojos verdes.'
    note: Reutiliza *зелёные глаза* de la lección 3, con *у неё* para «ella tiene».
  ru.a1.unit26.lesson04.teach.dima_spasibo_togda:
    title: Dima la reconocerá
    gloss: 'Dima: ¡Gracias! Entonces la reconoceré.'
    note: '*Я её узнаю* (la reconoceré): *её* es el acusativo de *она*, porque Nina es el complemento directo.'
  ru.a1.unit26.lesson05.teach.igor_i_lena:
    title: Comparamos a Igor y Lena
    gloss: Igor y Lena son hermanos, pero son muy distintos físicamente. Igor es bajo, tiene el pelo castaño corto y los ojos marrones. Lena es más alta que Igor y tiene el pelo castaño largo y los ojos verdes. ¿Cómo eres tú?
    note: Una breve comparación que reúne todas las palabras de color y de longitud vistas hasta ahora y termina con la pregunta clave de la unidad dirigida al lector.
    glosses:
      брат: hermano
      сестра: hermana
      выглядят: parecerse
      по-разному: diferentes
      невысокий: bajo
      короткие: bajo
      каштановые: castaño
      волосы: pelo
      карие: castaño
      глаза: ojos
      выше: más alta
      длинные: largo
      зелёные: verdes
      выглядишь: te ves / tienes aspecto (como en как ты выглядишь?)
  ru.a1.unit26.lesson05.teach.posle_vyshe_stoit:
    title: Comparar con выше
    gloss: 'Después de *выше* (más alto) la persona con la que se compara va en genitivo: *Лена выше Игоря*.'
    note: El comparativo *выше* no cambia según el género. La persona con quien se compara va en genitivo o después de *чем*.
  ru.a1.unit26.lesson05.teach.u_leny_volosy:
    title: Lena tiene el pelo más largo que Igor
    gloss: Lena tiene el pelo más largo que Igor.
    note: '*У Лены волосы длиннее, чем у Игоря*: *длиннее* nunca cambia, y *чем* (que) introduce la segunda parte.'
  ru.a1.unit26.lesson05.teach.u_menya_korotkie:
    title: Tengo el pelo corto y castaño
    gloss: Tengo el pelo corto y castaño.
    note: 'Una oración modelo para describir tu propio aspecto: *У меня* («yo tengo») + adjetivo + sustantivo.'
  ru.a1.unit26.lesson06.teach.dima_smotri_eto:
    title: Dima ve a Nina
    gloss: 'Dima: Mira, ¿es Nina? Tiene el pelo rubio y corto y los ojos verdes.'
    note: '*Смотри* (mira) es el imperativo informal, usado igual que en diálogos anteriores.'
  ru.a1.unit26.lesson06.teach.nastya_da_eto:
    title: Nastya lo confirma
    gloss: 'Nastya: ¡Sí, es Nina!'
    note: Una confirmación breve y natural.
  ru.a1.unit26.lesson06.teach.nina_privet_ty:
    title: Nina saluda a Dima
    gloss: 'Nina: Hola, ¿eres Dima?'
    note: 'Una pregunta informal sencilla: en ruso no hace falta el verbo «ser» en presente, basta con *Ты Дима?*'
  ru.a1.unit26.lesson06.teach.dima_da_priyatno:
    title: Dima saluda a Nina
    gloss: 'Dima: ¡Sí! Encantado de conocerte, Nina.'
    note: '*Приятно познакомиться* es la frase habitual al conocer a alguien por primera vez. *Познакомиться* significa conocer a una persona nueva.'
  ru.a1.unit26.lesson06.teach.nina_mne_tozhe:
    title: Nina responde al saludo
    gloss: 'Nina: ¡Encantada de conocerte también!'
    note: 'Cierra el diálogo: Dima reconoció a Nina gracias a la descripción previa de Nastya.'
