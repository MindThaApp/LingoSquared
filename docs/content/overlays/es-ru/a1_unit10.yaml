teaching:
  ru.a1.unit10.lesson01.teach.kak_doyti:
    title: Как дойти до...?
    gloss: ¿Cómo llego a...?
    note: Как дойти до...? es la forma cortés habitual de pedir a un desconocido indicaciones para llegar a un lugar; después va el destino en genitivo.
  ru.a1.unit10.lesson01.teach.muzeya:
    title: музей
    gloss: museo
    note: музей es masculino; музея es su forma de genitivo, que se usa después de до («hasta»).
    example_gloss: ¿Cómo llego al museo?
  ru.a1.unit10.lesson01.teach.pryamo:
    title: прямо
    gloss: todo recto
    note: прямо indica ir todo recto; Идите es la forma de mandato cortés de «ir».
    example_gloss: Sigue recto.
  ru.a1.unit10.lesson01.teach.napravo:
    title: направо
    gloss: a la derecha
    note: направо indica dirección de movimiento (girar a la derecha); потом significa «luego».
    example_gloss: Siga recto y luego a la derecha.
  ru.a1.unit10.lesson02.teach.nalevo:
    title: налево
    gloss: a la izquierda
    note: налево indica dirección de movimiento, el opuesto de направо.
    example_gloss: Gira a la izquierda.
  ru.a1.unit10.lesson02.teach.povernite:
    title: поверните
    gloss: gire (orden cortés)
    note: поверните es el imperativo cortés de повернуть («girar»); за углом significa «a la vuelta de la esquina».
    example_gloss: Gire a la izquierda al doblar la esquina.
  ru.a1.unit10.lesson02.teach.kvartal_daleko:
    title: квартал, далеко
    gloss: manzana, lejos
    note: квартал es una manzana de la ciudad (квартала después de два); далеко significa «lejos» y отсюда significa «de aquí».
    example_gloss:
    - Siga dos manzanas.
    - ¿Está lejos de aquí?
  ru.a1.unit10.lesson03.teach.tourist_prostite:
    title: El turista pregunta por el camino
    gloss: 'Turista: Disculpe, ¿cómo llego al museo?'
    note: Турист empieza con Простите («disculpe») antes de preguntar Как дойти до музея?
  ru.a1.unit10.lesson03.teach.prokhozhiy_eto_prosto:
    title: El transeúnte da indicaciones
    gloss: 'Transeúnte: Es muy fácil. Siga recto dos manzanas y luego gire a la derecha.'
    note: Прохожий responde con Это очень просто y luego da dos pasos usando Идите y поверните.
  ru.a1.unit10.lesson03.teach.tourist_daleko:
    title: El turista pregunta si está lejos
    gloss: 'Turista: ¿Está lejos de aquí?'
    note: Это далеко отсюда? sirve para preguntar por la distancia a pie.
  ru.a1.unit10.lesson03.teach.prokhozhiy_pyat_minut:
    title: El transeúnte calcula el tiempo
    gloss: 'Transeúnte: No, a cinco minutos a pie.'
    note: Прохожий responde con Нет, пять минут пешком («a pie»).
  ru.a1.unit10.lesson03.teach.tourist_spasibo:
    title: El turista da las gracias al transeúnte
    gloss: 'Turista: Muchas gracias.'
    note: Спасибо большое cierra la conversación con cortesía.
  ru.a1.unit10.lesson03.teach.prokhozhiy_pozhaluysta:
    title: El transeúnte responde
    gloss: 'Transeúnte: De nada.'
    note: Пожалуйста responde a спасибо con «de nada».
