course:
  title: Ruso A1
  description: Aprende ruso de nivel A1 para expresar un problema de salud básico, entender consejos sencillos e inmediatos y mantener un breve diálogo en la consulta del médico, con explicaciones detalladas en español de vocabulario, frases y diálogos.
