teaching:
  ru.a1.unit16.lesson01.teach.u_menya_bolit_golova:
    title: У меня болит голова.
    gloss: Me duele la cabeza.
    note: у меня significa «tengo» (literalmente «en mí»); болит significa «duele» y concuerda con un sujeto singular como голова (cabeza).
  ru.a1.unit16.lesson01.teach.zhivot:
    title: живот
    gloss: estómago
    note: живот significa «estómago / barriga». Usa el mismo patrón у меня болит... con cualquier parte del cuerpo.
    example_gloss: Me duele la barriga.
  ru.a1.unit16.lesson01.teach.gorlo:
    title: горло
    gloss: garganta
    note: горло significa «garganta».
    example_gloss: Me duele la garganta.
  ru.a1.unit16.lesson02.teach.u_menya_temperatura:
    title: У меня температура.
    gloss: Tengo fiebre.
    note: температура significa literalmente «temperatura», pero es la forma habitual de decir «fiebre» en ruso.
  ru.a1.unit16.lesson02.teach.prostuda:
    title: простуда
    gloss: un resfriado
    note: простуда significa «resfriado» (la enfermedad). Di у меня простуда para decir «Tengo un resfriado».
    example_gloss: Tengo un resfriado.
  ru.a1.unit16.lesson02.teach.mne_ploho:
    title: Мне плохо.
    gloss: Me siento mal.
    note: Мне плохо es una forma general de decir que te sientes mal, sin nombrar un síntoma concreto.
  ru.a1.unit16.lesson03.teach.dima_zdravstvuyte_bolit:
    title: Dima saluda al médico
    gloss: 'Dima: ¡Buenos días! Me duelen la cabeza y la garganta.'
    note: Дима empieza con el saludo formal Здравствуйте! porque el médico es un desconocido.
  ru.a1.unit16.lesson03.teach.doktor_chto_u_vas_bolit:
    title: El médico pregunta qué le duele
    gloss: 'Médico: ¿Qué le duele? ¿La cabeza y la garganta?'
    note: El médico usa вас («usted», formal/plural) en lugar de тебя, que es informal.
  ru.a1.unit16.lesson03.teach.dima_da_i_eshchyo_temperatura:
    title: Dima añade un síntoma más
    gloss: 'Dima: Sí, y además fiebre.'
    note: ещё significa «además / también»; и ещё... añade un elemento más a lo que acabas de decir.
  ru.a1.unit16.lesson03.teach.doktor_vam_nuzhno_otdyhat:
    title: El médico da consejos
    gloss: 'Médico: Necesita descansar y beber mucha agua.'
    note: Вам нужно + infinitivo significa «usted necesita...»; вам es el dativo formal de «usted».
