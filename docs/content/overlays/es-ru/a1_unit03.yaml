  ru.a1.unit03.lesson01.chisla_1_5:
    title: Los números del uno al cinco
  ru.a1.unit03.lesson02.chisla_6_10:
    title: Los números del seis al diez
  ru.a1.unit03.lesson03.na_rynke:
    title: 'En el mercado: contar dinero'
teaching:
  ru.a1.unit03.lesson01.teach.u_menya:
    title: У меня ...
    gloss: Tengo ...
    note: 'Literalmente «junto a mí (hay) ...»: es la forma habitual de decir «tengo» en ruso, que no usa un verbo equivalente a «tener».'
  ru.a1.unit03.lesson01.teach.odin_dva:
    title: один, два
    gloss: uno, dos
    note: 'Después de два («dos»), el sustantivo toma una forma especial de genitivo singular: брат («hermano») pasa a брата, no a un plural como el español «dos hermanos».'
    example_gloss:
    - Tengo un hermano.
    - Tengo dos hermanos.
  ru.a1.unit03.lesson01.teach.tri_chetyre:
    title: три, четыре
    gloss: tres, cuatro
    note: 'Три y четыре toman la misma forma de genitivo singular que два: книга («libro») pasa a книги después de два, три o четыре.'
    example_gloss:
    - Tengo tres libros.
    - Tengo cuatro libros.
  ru.a1.unit03.lesson01.teach.pyat:
    title: пять
    gloss: cinco
    note: 'Desde пять («cinco») en adelante, el sustantivo pasa al genitivo plural: рубль («rublo») pasa a рублей, no a рубли.'
    example_gloss: Tengo cinco rublos.
  ru.a1.unit03.lesson01.teach.brat_bratya:
    title: брат, брата
    gloss: hermano; hermanos (después de 2-4)
    note: брата es la forma de genitivo singular que se usa específicamente después de два, три y четыре; no es el plural normal.
    example_gloss: Tengo dos hermanos.
  ru.a1.unit03.lesson01.teach.kniga_knigi:
    title: книга, книги
    gloss: libro; libros (después de 2-4)
    note: книги sigue el mismo patrón de genitivo singular que брата, usado después de два, три y четыре.
    example_gloss: Tengo tres libros.
  ru.a1.unit03.lesson01.teach.rubl_rubley:
    title: рубль, рублей
    gloss: rublo; rublos (5 o más)
    note: рублей es la forma de genitivo plural que se usa desde пять («cinco») en adelante.
    example_gloss: Tengo cinco rublos.
  ru.a1.unit03.lesson02.teach.shest_sem:
    title: шесть, семь
    gloss: seis, siete
    note: Igual que пять, tanto шесть como семь llevan el sustantivo en genitivo plural.
    example_gloss:
    - Son las seis.
    - Tengo siete rublos.
  ru.a1.unit03.lesson02.teach.vosem_devyat:
    title: восемь, девять
    gloss: ocho, nueve
    note: 'Ambos siguen el patrón del genitivo plural: книга pasa a книг y рубль pasa a рублей.'
    example_gloss:
    - Tengo ocho libros.
    - Tengo nueve rublos.
  ru.a1.unit03.lesson02.teach.desyat:
    title: десять
    gloss: diez
    note: También se usa para decir la edad, como en Мне десять лет («Tengo diez años»).
    example_gloss: Tengo diez años.
  ru.a1.unit03.lesson02.teach.kniga_genitive_plural:
    title: книг
    gloss: libros (genitivo plural, 5 o más)
    note: Es el genitivo plural de книга, usado desde пять en adelante; pierde por completo la vocal final, a diferencia de книги, que se usa después de два, три y четыре.
    example_gloss: Tengo nueve libros.
  ru.a1.unit03.lesson02.teach.mne_let:
    title: Мне десять лет.
    gloss: Tengo diez años.
    note: En español la edad se dice con «tener» y «años»; en ruso se expresa con el dativo «a mí» (мне), un número y лет (genitivo plural de «años»), sin ningún verbo.
  ru.a1.unit03.lesson02.teach.skolko_vam_let:
    title: Сколько вам лет?
    gloss: ¿Cuántos años tiene usted? (formal)
    note: Usa el dativo formal вам, que corresponde al registro вы de la Unidad 2.
  ru.a1.unit03.lesson03.teach.skolko_stoit:
    title: Сколько это стоит?
    gloss: ¿Cuánto cuesta esto?
    note: Es la forma habitual de preguntar el precio de un solo artículo, con стоит («cuesta», singular).
  ru.a1.unit03.lesson03.teach.skolko_stoyat:
    title: Сколько стоят яблоки?
    gloss: ¿Cuánto cuestan las manzanas?
    note: Usa стоят (plural de «costar») porque яблоки («manzanas») está en plural, a diferencia del singular стоит en Сколько это стоит?
  ru.a1.unit03.lesson03.teach.rubley:
    title: рубль, рубля, рублей
    gloss: rublo (1); rublos (2-4); rublos (5 o más)
    note: 'La palabra para «rublo» cambia según el número que la precede: рубль después de uno, рубля después de два, три o четыре, y рублей desde пять en adelante.'
    example_gloss:
    - Esto cuesta un rublo.
    - Esto cuesta dos rublos.
    - Esto cuesta cinco rublos.
  ru.a1.unit03.lesson03.teach.pokupatel_greeting:
    title: El cliente saluda al vendedor
    gloss: 'Cliente: ¡Hola! ¿Cuánto cuestan las manzanas?'
    note: Un cliente en un puesto del mercado empieza con cortesía con Здравствуйте antes de preguntar el precio.
  ru.a1.unit03.lesson03.teach.prodavets_apples:
    title: El vendedor responde
    gloss: 'Vendedor: Tres rublos.'
    note: Три рубля usa la forma de genitivo singular de «rublo» propia de 2-4, que concuerda con три.
  ru.a1.unit03.lesson03.teach.pokupatel_bread:
    title: El cliente pregunta por el pan
    gloss: 'Cliente: Y el pan, ¿cuánto cuesta?'
    note: El cliente usa А («y») para enlazar con naturalidad una segunda pregunta sobre otro producto.
  ru.a1.unit03.lesson03.teach.prodavets_bread:
    title: El vendedor vuelve a responder
    gloss: 'Vendedor: Seis rublos.'
    note: Шесть рублей usa el genitivo plural, la forma que se emplea a partir de cinco, como шесть.
  ru.a1.unit03.lesson03.teach.pokupatel_close:
    title: El cliente se despide con cortesía
    gloss: 'Cliente: Está bien, ¡gracias!'
    note: Хорошо, спасибо! cierra el intercambio en el mercado de forma amable, con vocabulario de la unidad de saludos.
