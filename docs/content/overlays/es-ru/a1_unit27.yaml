course:
  title: Ruso A1
  description: 'Ruso para principiantes para hablar de mascotas y animales comunes: nombrarlos, cuidados básicos (pasear, dar de comer, jugar), decir qué animales te encantan aunque no tengas ninguno y el plural regular del ruso.'
