teaching:
  ru.a1.unit27.lesson01.teach.zhivotnoe_domashnee_zhivotnoe:
    title: Animal, mascota
    gloss: el animal / una mascota
    note: '*Животное* es la palabra general para «animal». *Домашнее животное* (literalmente «animal doméstico») significa específicamente «mascota».'
    example_gloss:
    - Un perro es un animal.
    - Un perro también es una mascota.
  ru.a1.unit27.lesson01.teach.sobaka_koshka:
    title: Perro y gato
    gloss: el perro / el gato
    example_gloss:
    - Nastya tiene un perro.
    - Igor tiene un gato.
  ru.a1.unit27.lesson01.teach.ryba_ptitsa:
    title: Pez y pájaro
    gloss: el pez / el pájaro
    example_gloss:
    - El abuelo tiene un pez.
    - Nina tiene un pájaro.
  ru.a1.unit27.lesson01.teach.u_tebya_est:
    title: ¿Tienes una mascota?
    gloss: ¿Tienes una mascota?
    note: '*У тебя есть ...?* es la pregunta para «¿tienes...?»: *у тебя* («en ti») + *есть* + lo que se tiene.'
  ru.a1.unit27.lesson01.teach.da_u_menya:
    title: Sí, tengo un perro
    gloss: Sí, tengo un perro.
    note: Una respuesta afirmativa sencilla con el vocabulario nuevo de esta unidad.
  ru.a1.unit27.lesson01.teach.net_u_menya:
    title: No, no tengo mascota
    gloss: No, no tengo mascota.
    note: '*Нет* + genitivo expresa que no tienes algo: *у меня нет домашнего животного*. Consulta la nota de gramática.'
  ru.a1.unit27.lesson01.teach.posle_net_slovo:
    title: Нет más genitivo
    gloss: 'Después de *нет*, lo que falta va en genitivo: *у меня нет времени*, *у меня нет домашнего животного*.'
    note: 'Compara con la afirmación: *у меня есть собака* (nominativo), pero *у меня нет собаки* (genitivo).'
  ru.a1.unit27.lesson02.teach.gulyat_s_sobakoy:
    title: Pasear (a un animal)
    gloss: pasear (a un animal)
    note: '*Гулять с собакой* usa *с* más el instrumental, *собакой*. Consulta la nota de gramática.'
    example_gloss: Paseo al perro todos los días.
  ru.a1.unit27.lesson02.teach.posle_s_slovo:
    title: С más instrumental
    gloss: 'Después de *с* («con») el sustantivo va en instrumental: *гулять с собакой*, *играть с кошкой*.'
    note: 'El instrumental de los sustantivos femeninos termina en *-ой* o *-ей*: *собакой*, *кошкой*.'
  ru.a1.unit27.lesson02.teach.kormit:
    title: Dar de comer
    gloss: dar de comer
    example_gloss: Le doy de comer al gato todos los días.
  ru.a1.unit27.lesson02.teach.igrat_s:
    title: Jugar con
    gloss: jugar con
    example_gloss: Igor juega con su gato.
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den:
    title: Paseo al perro todos los días
    gloss: Paseo al perro todos los días.
    note: '*Каждый день* («todos los días») es una expresión de tiempo sin preposición: *Я каждый день гуляю с собакой*.'
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den_2:
    title: Le doy de comer al gato todos los días
    gloss: Le doy de comer al gato todos los días.
    note: '*Кормить* lleva el animal como complemento directo en acusativo: *кошка* pasa a *кошку*.'
  ru.a1.unit27.lesson03.teach.posle_lyubit_zhivotnoe:
    title: Los animales después de любить
    gloss: 'Después de *любить*, el nombre de un animal va en acusativo, que en los seres animados coincide con el genitivo plural: *собак*, *кошек*, *птиц*, *рыб*.'
    note: El patrón del plural regular en ruso, presentado aquí por primera vez con sustantivos de animales como ejemplo.
  ru.a1.unit27.lesson03.teach.sobak_koshek:
    title: Perros y gatos
    gloss: perros / gatos
    example_gloss:
    - A Dima le encantan los perros.
    - A Lena le encantan los gatos.
  ru.a1.unit27.lesson03.teach.ryb_ptits:
    title: Peces y pájaros (plural)
    gloss: peces / pájaros
    example_gloss:
    - Adoro los peces.
    - El abuelo adora los pájaros.
  ru.a1.unit27.lesson03.teach.ya_lyublyu_zhivotnykh:
    title: Adoro a los animales
    gloss: Adoro a los animales.
    note: '*Люблю* + acusativo: *Я люблю животных*. En los sustantivos animados en plural, el acusativo coincide con el genitivo.'
  ru.a1.unit27.lesson03.teach.lena_lyubit_koshek:
    title: A Lena le encantan los gatos, pero no tiene mascota
    gloss: A Lena le encantan los gatos, pero no tiene mascota.
    note: Prepara el contraste en torno al cual se construye la lectura de la lección 5.
  ru.a1.unit27.lesson04.teach.dima_u_tebya:
    title: Dima pregunta por una mascota
    gloss: 'Dima: ¿Tienes mascota, Nastya?'
  ru.a1.unit27.lesson04.teach.nastya_da_u:
    title: Nastya tiene un perro
    gloss: 'Nastya: Sí, tengo un perro.'
  ru.a1.unit27.lesson04.teach.dima_kak_on:
    title: Dima pregunta cómo es
    gloss: 'Dima: ¿Cómo es?'
    note: La pregunta *Как он выглядит?* sirve también para los animales. *Он* (él) se usa para una mascota macho.
  ru.a1.unit27.lesson04.teach.nastya_u_nego:
    title: Nastya describe a su perro
    gloss: 'Nastya: Tiene el pelo marrón y es pequeño.'
    note: Retoma el vocabulario de color del pelo y de tamaño de la unidad del aspecto físico, ahora para describir el pelaje de un animal y no el pelo de una persona.
  ru.a1.unit27.lesson04.teach.o_zhivotnom_mozhno:
    title: Он y она para los animales
    gloss: 'De una mascota se puede decir *он* o *она*, como de una persona: *У меня собака, он маленький*.'
    note: Gramaticalmente *собака* es femenino, pero los rusos suelen decir *он* cuando saben que la mascota es macho.
  ru.a1.unit27.lesson04.teach.dima_ty_gulyaesh:
    title: Dima pregunta por los paseos
    gloss: 'Dima: ¿Lo paseas todos los días?'
  ru.a1.unit27.lesson04.teach.nastya_da_ya:
    title: Nastya cuenta su rutina
    gloss: 'Nastya: Sí, todos los días lo paseo y le doy de comer.'
  ru.a1.unit27.lesson05.teach.dima_i_lena:
    title: Dima, Lena e Igor y los animales
    gloss: 'A Dima y a Lena les encantan los animales, pero ninguno de los dos tiene mascota. A Dima le gustan los perros y a Lena, los gatos. Igor, en cambio, sí tiene mascota: un gato. A menudo juega con su gato y todos los días le da de comer. ¿Tú tienes mascota?'
    note: Contrasta querer a los animales con tener uno de verdad, que es el objetivo comunicativo de la unidad.
    glosses:
      любят: adorar
      оба: los dos
      животных: animales
      обоих: los dos
      домашнего: mascota
      собак: perros
      кошек: gatos
      кошка: gato
      играет: juega
      даёт: da
      каждый: cada
      корм: comida
  ru.a1.unit27.lesson05.teach.igor_chasto_igraet:
    title: Igor juega a menudo con su gato
    gloss: Igor juega a menudo con su gato.
    note: '*Со своей кошкой*: *со* es *с* ante un grupo de consonantes, y *своей* significa «su propia» y se refiere al sujeto.'
  ru.a1.unit27.lesson05.teach.ya_lyublyu_sobak:
    title: Adoro a los perros. No tengo mascota.
    gloss: Adoro a los perros. No tengo mascota.
    note: Una respuesta modelo de dos frases, lista para reutilizar en el ejercicio de escritura de la unidad.
  ru.a1.unit27.lesson06.teach.nastya_nina_u:
    title: Nastya le pregunta a Nina
    gloss: 'Nastya: Nina, ¿tú también tienes mascota?'
  ru.a1.unit27.lesson06.teach.nina_da_u:
    title: Nina tiene un pájaro llamado Pico
    gloss: 'Nina: Sí, tengo un pájaro. Se llama Pico.'
    note: '*Его зовут Пико* significa literalmente «lo llaman Pico». Así se dice el nombre en ruso.'
  ru.a1.unit27.lesson06.teach.dima_kak_zdorovo:
    title: Reacción de Dima
    gloss: 'Dima: ¡Qué bien! ¿Qué haces con él todos los días?'
  ru.a1.unit27.lesson06.teach.nina_ya_kazhdyy:
    title: Nina le da de comer todos los días
    gloss: 'Nina: Le doy de comer todos los días.'
  ru.a1.unit27.lesson06.teach.dima_ya_tozhe:
    title: A Dima también le gustan las aves
    gloss: 'Dima: A mí también me gustan las aves.'
  ru.a1.unit27.lesson06.teach.nastya_kak_khorosho:
    title: Nastya cierra la conversación
    gloss: 'Nastya: ¡Qué bueno que a los tres nos gusten los animales!'
    note: Cierra el círculo con los datos sobre animales de los tres personajes de esta unidad.
