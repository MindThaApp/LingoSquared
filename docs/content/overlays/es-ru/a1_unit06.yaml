teaching:
  ru.a1.unit06.lesson01.teach.u_menya_est:
    title: У меня есть ...
    gloss: Tengo ...
    note: 'Literalmente "junto a mí (hay)...": es la forma habitual en ruso de decir "tengo". En la unidad 3, У меня два брата usaba la misma estructura У меня; есть suele omitirse cuando se habla de cuántos tienes.'
  ru.a1.unit06.lesson01.teach.eto:
    title: Это ...
    gloss: Esto es ... / Este es ... / Esta es ...
    note: Это sirve para presentar o señalar a una persona o cosa, sea cual sea su género gramatical.
  ru.a1.unit06.lesson01.teach.mat_otets:
    title: мать, отец
    gloss: madre, padre
    note: мать es uno de los pocos sustantivos femeninos rusos que terminan en signo blando (-ь).
    example_gloss:
    - Esta es mi madre.
    - Este es mi padre.
  ru.a1.unit06.lesson01.teach.brat_sestra:
    title: брат, сестра
    gloss: hermano, hermana
    note: брат es la palabra con la que ya contaste en la unidad 3 ("У меня два брата"); сестра es su equivalente femenino.
    example_gloss:
    - Este es mi hermano.
    - Tengo una hermana.
  ru.a1.unit06.lesson01.teach.moy_moya:
    title: мой, моя
    gloss: mi (masculino), mi (femenino)
    note: мой se usa con sustantivos masculinos como отец y брат; моя se usa con sustantivos femeninos como мать y сестра.
  ru.a1.unit06.lesson02.teach.babushka_dedushka:
    title: бабушка, дедушка
    gloss: abuela, abuelo
    note: 'Ambas palabras terminan en -а, pero дедушка designa a un hombre y es masculina en la concordancia: мой дедушка, pero моя бабушка.'
    example_gloss:
    - Esta es mi abuela.
    - Este es mi abuelo.
  ru.a1.unit06.lesson02.teach.muzh_zhena:
    title: муж, жена
    gloss: marido, esposa
    note: муж es masculino y жена es femenino, siguiendo el patrón habitual de terminaciones según el género.
    example_gloss:
    - Este es mi marido.
    - Esta es mi esposa.
  ru.a1.unit06.lesson02.teach.syn_doch:
    title: сын, дочь
    gloss: hijo, hija
    note: дочь, igual que мать, es un sustantivo femenino que termina en signo blando (-ь).
    example_gloss: Tengo un hijo y una hija.
  ru.a1.unit06.lesson02.teach.deti:
    title: дети
    gloss: hijos
    note: 'дети es el plural irregular de ребёнок ("niño"): el singular y el plural son palabras totalmente distintas.'
    example_gloss: ¿Tiene hijos?
  ru.a1.unit06.lesson02.teach.u_vas_est:
    title: У вас есть ...?
    gloss: ¿Tiene ...? (formal)
    note: Usa el вас formal, de acuerdo con el registro de вы de la unidad 2.
  ru.a1.unit06.lesson03.teach.kto_eto:
    title: Кто это?
    gloss: ¿Quién es?
    note: Es la forma habitual de preguntar quién es alguien, por ejemplo al mirar una foto.
  ru.a1.unit06.lesson03.teach.eyo_zovut:
    title: Её зовут Анна.
    gloss: Se llama Anna.
    note: 'Literalmente "la llaman Anna": Её ("la/su") es el complemento del verbo зовут, no el sujeto.'
  ru.a1.unit06.lesson03.teach.maksim_kto_eto:
    title: Maksim pregunta por la foto
    gloss: 'Maksim: ¿Quién es esta de la foto?'
    note: Maksim empieza señalando la foto y preguntando Кто это на фото?
  ru.a1.unit06.lesson03.teach.olga_moya_semya:
    title: Olga presenta a su familia
    gloss: 'Olga: Esta es mi familia.'
    note: Это моя семья usa семья ("familia"), un sustantivo femenino, por eso моя concuerda con él.
  ru.a1.unit06.lesson03.teach.olga_vot_otets:
    title: Olga nombra a tres familiares
    gloss: 'Olga: Aquí están mi padre, mi madre y mi hermano.'
    note: Вот ("aquí está/están") introduce la lista; cada posesivo (мой/моя) concuerda con el sustantivo que le sigue.
  ru.a1.unit06.lesson03.teach.maksim_a_kto_devochka:
    title: Maksim pregunta por la niña
    gloss: 'Maksim: ¿Y quién es esa niña?'
    note: А enlaza con naturalidad la nueva pregunta de Maksim sobre una cuarta persona de la foto.
  ru.a1.unit06.lesson03.teach.olga_eto_moya_doch:
    title: Olga dice quién es su hija
    gloss: 'Olga: Esta es mi hija. Se llama Anna.'
    note: Olga responde con моя дочь y luego da el nombre con Её зовут Анна.
