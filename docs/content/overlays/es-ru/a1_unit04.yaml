teaching:
  ru.a1.unit04.lesson01.teach.kakoy_den:
    title: Какой сегодня день?
    gloss: ¿Qué día es hoy?
    note: Какой concuerda con el sustantivo masculino день («día»).
  ru.a1.unit04.lesson01.teach.ponedelnik_vtornik:
    title: понедельник, вторник
    gloss: lunes, martes
    note: Los días de la semana no se escriben con mayúscula en ruso, igual que en español.
    example_gloss:
    - Hoy es lunes.
    - Hoy es martes.
  ru.a1.unit04.lesson01.teach.sreda_chetverg:
    title: среда, четверг
    gloss: miércoles, jueves
    note: Como todos los días de la semana en ruso, среда y четверг se escriben en minúscula; solo llevan mayúscula al principio de una oración.
    example_gloss:
    - Hoy es miércoles.
    - Hoy es jueves.
  ru.a1.unit04.lesson01.teach.pyatnitsa_subbota:
    title: пятница, суббота
    gloss: viernes, sábado
    note: 'суббота lleva una б doble: es un error ortográfico muy común.'
    example_gloss:
    - Hoy es viernes.
    - Hoy es sábado.
  ru.a1.unit04.lesson01.teach.voskresenye:
    title: воскресенье
    gloss: Domingo
    note: El último día de la lista de la semana rusa.
    example_gloss: Hoy es domingo.
  ru.a1.unit04.lesson01.teach.segodnya:
    title: Сегодня ...
    gloss: Hoy es ...
    note: Сегодня más el nombre de un día no necesita verbo de enlace; en español, en cambio, se usa «es».
  ru.a1.unit04.lesson02.teach.kakoe_chislo:
    title: Какое сегодня число?
    gloss: ¿Qué fecha es hoy?
    note: Какое concuerda con el sustantivo neutro число («fecha/número»), a diferencia de какой день, visto antes.
  ru.a1.unit04.lesson02.teach.pervoe_tretye:
    title: первое, третье
    gloss: primero, tercero
    note: Las fechas ordinales llevan la terminación neutra (-ое/-ье) porque concuerdan con el sustantivo sobrentendido число.
    example_gloss:
    - Hoy es 1 de enero.
    - Hoy es 3 de enero.
  ru.a1.unit04.lesson02.teach.pyatoe_desyatoe:
    title: пятое, десятое
    gloss: quinto, décimo
    note: Mismo patrón de ordinal neutro que первое/третье.
    example_gloss:
    - Hoy es 5 de octubre.
    - Hoy es 10 de abril.
  ru.a1.unit04.lesson02.teach.yanvar_aprel:
    title: января, апреля
    gloss: de enero, de abril
    note: 'Después de la fecha, el nombre del mes va en genitivo: январь pasa a января y апрель pasa a апреля.'
    example_gloss:
    - Hoy es 3 de enero.
    - Hoy es 10 de abril.
  ru.a1.unit04.lesson02.teach.oktyabrya:
    title: октября
    gloss: de octubre
    note: Genitivo de октябрь, con el mismo patrón que января/апреля después de la fecha.
    example_gloss: Hoy es 5 de octubre.
  ru.a1.unit04.lesson03.teach.kakoe_segodnya_chislo:
    title: Какое сегодня число?
    gloss: ¿Qué fecha es hoy?
    note: La forma habitual de preguntar la fecha del calendario.
  ru.a1.unit04.lesson03.teach.vo_vtornik:
    title: во вторник
    gloss: el martes
    note: 'La preposición в se convierte en во delante de вторник para facilitar la pronunciación; вторник no cambia de forma aquí (los días femeninos sí: в среду, в пятницу, в субботу).'
  ru.a1.unit04.lesson03.teach.vstrecha:
    title: встреча
    gloss: reunión
    note: Sustantivo común para una reunión o cita programada.
    example_gloss: La reunión es el martes.
  ru.a1.unit04.lesson03.teach.anna_kakoy_den:
    title: Anna pregunta el día
    gloss: 'Anna: ¿Qué día es hoy?'
    note: Anna abre el intercambio con la pregunta sobre el день de la lesson01.
  ru.a1.unit04.lesson03.teach.viktor_sreda:
    title: Viktor responde con el día y la fecha
    gloss: 'Viktor: Hoy es miércoles, 3 de enero.'
    note: Viktor dice juntos el día de la semana y la fecha con ordinal, usando el mes en genitivo января.
  ru.a1.unit04.lesson03.teach.anna_khorosho:
    title: Anna propone el martes
    gloss: 'Anna: Bien. ¿La reunión es el martes?'
    note: Хорошо reconoce la respuesta de Viktor antes de que Anna haga su siguiente pregunta.
  ru.a1.unit04.lesson03.teach.viktor_da:
    title: Viktor confirma la fecha
    gloss: 'Viktor: Sí, el martes, 9 de enero.'
    note: 'Да confirma y luego Viktor repite el día y la fecha. Para decir EN qué fecha ocurre algo, el propio ordinal va en genitivo: девятого января («el 9 de enero»); compara con Сегодня девятое января («Hoy es 9 de enero»).'
