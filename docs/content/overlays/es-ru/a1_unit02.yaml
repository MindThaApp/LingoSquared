teaching:
  ru.a1.unit02.lesson01.teach.kak_vas_zovut:
    title: Как вас зовут?, Как тебя зовут?
    gloss: ¿Cómo se llama usted? (formal); ¿Cómo te llamas? (informal)
    note: Как вас зовут? usa el вас formal y se emplea con desconocidos o en contextos corteses. Как тебя зовут? usa el тебя informal, que se emplea con amigos, niños y personas de la misma edad.
    example_gloss:
    - ¡Hola! ¿Cómo se llama usted?
    - ¡Hola! ¿Cómo te llamas?
  ru.a1.unit02.lesson01.teach.menya_zovut:
    title: Меня зовут Виктор.
    gloss: Me llamo Viktor.
    note: Меня зовут (literalmente «me llaman») es la forma habitual de decir tu nombre en ruso, sea cual sea el registro.
  ru.a1.unit02.lesson01.teach.menya_zovut_anna:
    title: Меня зовут Анна.
    gloss: Me llamo Anna.
    note: Es el mismo patrón, Меня зовут ..., con otro nombre; esta frase no cambia según el género de quien habla.
  ru.a1.unit02.lesson01.teach.register_note:
    title: Cómo elegir la pregunta adecuada
    gloss: Как вас зовут? es cortés o para desconocidos. Как тебя зовут? es para amigos, niños y personas de tu edad.
    note: 'La diferencia formal/informal es la misma que hay entre вы y ты, que se explica a fondo en la lección 2: вас y тебя son las formas de acusativo de вы y ты.'
  ru.a1.unit02.lesson02.teach.vy_ty:
    title: вы, ты
    gloss: usted; tú
    note: 'Como en español con usted y tú, el ruso distingue dos formas: вы se usa con desconocidos, personas mayores y en contextos profesionales; ты, con amigos, familia y niños.'
    example_gloss:
    - ¿De dónde es usted? (formal)
    - ¿De dónde eres? (informal)
  ru.a1.unit02.lesson02.teach.vy_ty_rule:
    title: Cuándo usar cada uno
    gloss: 'Вы es formal: con desconocidos, en el trabajo, con personas mayores. Ты es informal: con amigos, familia, niños.'
    note: Usar ты con alguien que espera вы puede sonar demasiado familiar o incluso grosero; ante la duda, empieza con вы.
  ru.a1.unit02.lesson02.teach.mozhno_na_ty:
    title: Можно на ты?
    gloss: ¿Podemos tutearnos con ты?
    note: Una forma cortés de proponer pasar del registro formal вы al informal ty cuando la relación ya es lo bastante cercana.
  ru.a1.unit02.lesson02.teach.davayte_pereydyom:
    title: Давайте перейдём на ты.
    gloss: Pasemos al ты informal.
    note: Una forma algo más directa e invitadora de proponer el mismo cambio de registro que Можно на ты?
  ru.a1.unit02.lesson02.teach.otkuda_vy:
    title: Откуда вы?
    gloss: ¿De dónde es usted?
    note: Usa el вы formal, acorde con el registro de un primer encuentro o de un contexto profesional.
  ru.a1.unit02.lesson02.teach.otkuda_ty:
    title: Откуда ты?
    gloss: ¿De dónde eres? (informal)
    note: La contrapartida informal, que se usa con alguien a quien ya conoces bien.
  ru.a1.unit02.lesson02.teach.ya_iz_kanady:
    title: Я из Канады.
    gloss: Soy de Canadá.
    note: Из («de») se construye con genitivo, así que Канада se convierte en Канады aquí; conviene fijarse en este genitivo de origen aunque la gramática de los casos llegue más adelante.
  ru.a1.unit02.lesson02.teach.ya_iz_moskvy:
    title: Я из Москвы.
    gloss: Soy de Moscú.
    note: 'El mismo genitivo de origen que en Я из Канады: Москва pasa a Москвы después de из.'
  ru.a1.unit02.lesson03.teach.davayte_poznakomimsya:
    title: Давайте познакомимся.
    gloss: Vamos a presentarnos.
    note: Una forma cortés y común de iniciar una presentación entre personas que se conocen por primera vez.
  ru.a1.unit02.lesson03.teach.ochen_priyatno:
    title: Очень приятно
    gloss: mucho gusto
    note: Una respuesta estándar y cortés cuando alguien acaba de decir su nombre.
    example_gloss: Me llamo John. -- Mucho gusto.
  ru.a1.unit02.lesson03.teach.irina_greeting:
    title: Irina Petrovna inicia la presentación
    gloss: 'Irina Petrovna dice: ¡Buenos días! Vamos a presentarnos. Me llamo Irina Petrovna.'
    note: Irina Petrovna conoce a John en una oficina, en un entorno formal, por eso usa el cortés Здравствуйте y el registro вы en todo momento.
  ru.a1.unit02.lesson03.teach.john_reply:
    title: John responde con su nombre
    gloss: 'John dice: Mucho gusto. Me llamo John.'
    note: John se ajusta al registro formal y cortés de Irina Petrovna con Очень приятно.
  ru.a1.unit02.lesson03.teach.irina_question:
    title: Irina Petrovna pregunta de dónde es John
    gloss: 'Irina Petrovna pregunta: ¿De dónde es usted, John?'
    note: Usa el Откуда вы formal, acorde con el entorno de oficina.
  ru.a1.unit02.lesson03.teach.john_answer:
    title: John responde y devuelve la pregunta
    gloss: 'John dice: Soy de Canadá. ¿Y usted de dónde es?'
    note: John dice de dónde es y devuelve la pregunta con cortesía mediante А вы откуда?
  ru.a1.unit02.lesson03.teach.irina_answer:
    title: Irina Petrovna responde
    gloss: 'Irina Petrovna dice: Soy de Moscú.'
    note: Completa el intercambio con el mismo patrón de genitivo de origen visto en la lección 2.
