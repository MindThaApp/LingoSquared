teaching:
  ru.a1.unit07.lesson01.teach.menyu:
    title: меню
    gloss: carta (menú)
    note: 'меню es un sustantivo neutro indeclinable, tomado del francés: nunca cambia de forma.'
    example_gloss: Aquí está el menú.
  ru.a1.unit07.lesson01.teach.ofitsiant:
    title: официант, официантка
    gloss: camarero, camarera
    note: официант es masculino y официантка es femenino, según el patrón regular de terminaciones de género.
    example_gloss: La camarera trabaja en un restaurante.
  ru.a1.unit07.lesson01.teach.stol_svoboden:
    title: Этот столик свободен?
    gloss: ¿Está libre esta mesa?
    note: столик es un diminutivo de стол («mesa») que se usa habitualmente para la mesa de un restaurante; свободен («libre, desocupado») concuerda con el sustantivo masculino.
  ru.a1.unit07.lesson01.teach.da_saditites:
    title: Да, садитесь, пожалуйста.
    gloss: Sí, siéntense, por favor.
    note: садитесь es el imperativo formal o de plural de садиться («sentarse»), que se usa con вы.
  ru.a1.unit07.lesson01.teach.chto_budete_zakazyvat:
    title: Что будете заказывать?
    gloss: ¿Qué van a pedir?
    note: будете заказывать es una forma de futuro («van a pedir») que usa el camarero para preguntar qué desea el cliente.
  ru.a1.unit07.lesson02.teach.ya_khochu:
    title: Я хочу ...
    gloss: Quiero ...
    note: хочу es la forma de primera persona del singular de хотеть («querer»), que se usa para pedir comida y bebida.
  ru.a1.unit07.lesson02.teach.chay_kofe:
    title: чай, кофе
    gloss: té, café
    note: Tanto чай como кофе son bebidas que se piden con frecuencia; кофе es indeclinable y gramaticalmente masculino, pese a terminar en -е.
    example_gloss:
    - Quiero té.
    - Quiero café.
  ru.a1.unit07.lesson02.teach.khleb_borshch:
    title: хлеб, борщ
    gloss: pan, borsch (sopa de remolacha)
    note: борщ es la clásica sopa rusa de remolacha; ambos sustantivos son masculinos.
    example_gloss:
    - ¿Tienen pan?
    - Quiero borsch.
  ru.a1.unit07.lesson02.teach.salat:
    title: салат
    gloss: ensalada
    note: и («y») se usa aquí para unir dos platos pedidos, como en борщ и салат.
    example_gloss: Quiero borsch y ensalada.
  ru.a1.unit07.lesson03.teach.morozhenoe:
    title: мороженое
    gloss: helado
    note: мороженое es un sustantivo neutro con aspecto de adjetivo («[cosa] congelada»), un patrón frecuente en los nombres de comida rusos.
    example_gloss: De postre, tráigame un helado.
  ru.a1.unit07.lesson03.teach.prinesite:
    title: Принесите, пожалуйста, ...
    gloss: Tráigame ..., por favor.
    note: Принесите es el imperativo formal o de plural de принести («traer»), que se usa con вы.
  ru.a1.unit07.lesson03.teach.spasibo:
    title: Спасибо.
    gloss: Gracias.
    note: Спасибо es la forma habitual de dar las gracias en cualquier intercambio cortés.
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_budete:
    title: La camarera pregunta qué van a pedir
    gloss: 'Camarera: ¿Qué van a pedir?'
    note: La camarera empieza preguntando Что будете заказывать?
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_borshch:
    title: El turista pide comida
    gloss: 'Turista: Quiero borsch y ensalada.'
    note: Турист («turista») responde con Я хочу борщ и салат.
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_pit:
    title: La camarera pregunta por las bebidas
    gloss: 'Camarera: ¿Qué van a beber?'
    note: пить («beber») va con будете, igual que en la pregunta anterior con заказывать.
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_chay:
    title: El turista pide una bebida
    gloss: 'Turista: Quiero té.'
    note: El turista responde simplemente con Я хочу чай.
  ru.a1.unit07.lesson03.teach.ofitsiantka_a_na_sladkoe:
    title: La camarera pregunta por el postre
    gloss: 'Camarera: ¿Y de postre?'
    note: 'А на сладкое? es una pregunta abreviada de seguimiento: «¿y para el dulce?».'
  ru.a1.unit07.lesson03.teach.turist_na_sladkoe:
    title: El turista pide el postre
    gloss: 'Turista: De postre, tráigame un helado, por favor.'
    note: El turista responde con На сладкое принесите мороженое, пожалуйста.
  ru.a1.unit07.lesson03.teach.ofitsiantka_khorosho:
    title: La camarera confirma el pedido
    gloss: 'Camarera: Muy bien. Gracias.'
    note: Хорошо («bien, de acuerdo») confirma el pedido, y Спасибо cierra el intercambio con cortesía.
