answer_policy:
  gender_agreement: This unit's central grammar point is subject-gender agreement on past- tense verbs (था/थी, गया/गई, मिला/मिली). Typed answers that use the wrong-gender form for a NAMED subject whose gender is already established (Arjun = masculine, Priya = feminine) should be marked incorrect -- this is the exact point being tested. For open-ended "describe your own day" prompts (writing_prompt/speak_response) where the learner's own gender isn't known, accept either gender's form as equally correct.
  intransitive_only: This unit deliberately teaches only intransitive past-tense verbs (जाना -> गया/गई, मिलना -> मिला/मिली) plus the copula (था/थी) -- no ने-marked transitive past tense (e.g. "मैंने खाना खाया") appears anywhere in this unit's accepted answers, by design.
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit introduces no new nasalized vocabulary at all -- the only nasalized forms used anywhere in this unit are हूँ/हैं and वहाँ, all reused unchanged from their already-settled spellings. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks. For any exercise asking the learner to describe their own recent day, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: Hindi A1
units:
  hi.a1.unit12.past_events:
    title: Wczoraj
lessons:
  hi.a1.unit12.lesson01.tha_thi:
    title: Jak było wczoraj?
  hi.a1.unit12.lesson02.gaya_gai_mila_mili:
    title: Poszedłem na targ
  hi.a1.unit12.lesson03.arjun_priya_kal:
    title: 'Arjun i Priya: wczoraj'
teaching:
  hi.a1.unit12.lesson01.teach.vyast_review:
    title: 'Powtórka: zajęty'
    gloss: zajęty
    note: Krótka powtórka przymiotnika z lekcji 11 -- w tej lekcji posłuży do ćwiczenia nowego czasu przeszłego od „być”.
    example_gloss: Arjun jest zajęty.
  hi.a1.unit12.lesson01.teach.tha_thi:
    title: Był / była
    gloss: był, była
    note: Czas przeszły czasownika „być”, odpowiednik hai/hoon/hain. „Tha” pasuje do podmiotu rodzaju męskiego, „thi” do podmiotu rodzaju żeńskiego.
    example_gloss:
    - Arjun był wczoraj zajęty.
    - Priya była wczoraj zajęta.
  hi.a1.unit12.lesson01.teach.tha_thi_grammar:
    title: Tha czy thi
    gloss: '„Tha” łączy się z podmiotem rodzaju męskiego, „thi” z podmiotem rodzaju żeńskiego -- stoją tam, gdzie „hai”, ale w przeciwieństwie do „hai” zmieniają się w zależności od rodzaju: Arjun jest zajęty, Arjun był zajęty, Priya była zajęta.'
    note: Wyraźnie pokazuje zgodność z rodzajem, rozszerzając znaną już odmianę czasownika „być” na czas przeszły.
  hi.a1.unit12.lesson01.teach.kal_review:
    title: 'Powtórka: wczoraj'
    gloss: wczoraj
    note: Poznane w lekcji 4, gdzie „kal” oznaczało zarówno „jutro”, jak i „wczoraj”, a różnicę wskazywał tylko czas czasownika. W tej lekcji po raz pierwszy używamy znaczenia „wczoraj”.
    example_gloss: Wczoraj była sobota.
  hi.a1.unit12.lesson01.teach.kaisa:
    title: Jaki (rodzaj męski)
    gloss: jaki, jak
    note: Uzupełnia odmianę, której dwie formy już znasz -- „kaise” i „kaisi” (z lekcji 1, „jak się masz”); to brakująca forma rodzaju męskiego w liczbie pojedynczej, używana z podmiotami takimi jak „din” (dzień).
    example_gloss: Jaki był dzień?
  hi.a1.unit12.lesson01.teach.kal_kaisa_tha_phrase:
    title: Jak było wczoraj?
    gloss: Jak było wczoraj?
    note: Główne pytanie tej lekcji, łączące wszystkie dotąd poznane słowa.
  hi.a1.unit12.lesson01.teach.din_achha_tha_phrase:
    title: Dzień był dobry.
    gloss: Dzień był dobry.
    note: Gotowa odpowiedź na pytanie „Jak było wczoraj?”, w rodzaju męskim (din jest rodzaju męskiego).
  hi.a1.unit12.lesson01.teach.filma_achi_thi:
    title: Film był dobry.
    gloss: Film był dobry.
    note: Ten sam wzór z podmiotem rodzaju żeńskiego (film po hindi jest rodzaju żeńskiego), nawiązanie do słownictwa z lekcji 11.
  hi.a1.unit12.lesson01.teach.kaisa_kaisi_grammar:
    title: Kaisa, kaisi, kaise
    gloss: „Kaisa” łączy się z podmiotem rodzaju męskiego w liczbie pojedynczej (Jaki był dzień?), „kaisi” z rodzajem żeńskim (Jaka była herbata?), a „kaise” używa się z aap/tum, pytając mężczyznę (Jak się masz?; kobietę pyta się „aap kaisi hain?”) -- to trzy formy tego samego słowa.
    note: Po raz pierwszy łączy całą odmianę -- kaise/kaisi znasz już z lekcji 1, kaisa to nowość z tej lekcji.
  hi.a1.unit12.lesson02.teach.names_mai_review:
    title: 'Powtórka: ja, Arjun, Priya'
    gloss: ja, Arjun, Priya
    note: Krótka powtórka przed przykładami w pierwszej osobie czasu przeszłego w tej lekcji.
    example_gloss:
    - Jestem Arjun.
    - Jestem Priya.
  hi.a1.unit12.lesson02.teach.jaana_gaya_gai:
    title: Poszedł / poszła (rodzaj męski / żeński)
    gloss: poszedł, poszła
    note: Czas przeszły od 'jaana' (iść, jechać) – od tego samego rdzenia, który poznałeś w trybie rozkazującym 'jao' (idź!) w jednostce 9. Zmienia się według rodzaju podmiotu, tak jak 'tha'/'thi'.
    example_gloss:
    - Arjun poszedł na targ.
    - Priya poszła do domu.
  hi.a1.unit12.lesson02.teach.jaana_grammar:
    title: Gaya/gai = czas przeszły od jaana
    gloss: '''Gaya''/''gai'' to czas przeszły od ''jaana'' (iść, jechać; jao w jednostce 9) i zmienia się według rodzaju podmiotu – tak jak ''tha''/''thi''.'
    note: Wyraźnie łączy nowy czas przeszły ze znanym już rdzeniem trybu rozkazującego.
  hi.a1.unit12.lesson02.teach.bazaar_ghar_review:
    title: 'Powtórka: targ, dom'
    gloss: targ, dom
    note: Krótka powtórka dwóch słów o miejscach z jednostek 7/8, potrzebnych do powiedzenia, dokąd ktoś poszedł.
    example_gloss:
    - To jest targ.
    - To jest dom.
  hi.a1.unit12.lesson02.teach.milna_mila_mili:
    title: Spotkał / spotkała (rodzaj męski / żeński)
    gloss: spotkał, spotkała
    note: Czas przeszły od 'milna' (spotykać), od tego samego rdzenia, który znasz z formy zwyczajowej 'milte hain' (z pożegnań w jednostkach 1/4/10/11). Zmienia się według rodzaju podmiotu.
    example_gloss:
    - Arjun spotkał Priyę.
    - Priya spotkała Arjuna.
  hi.a1.unit12.lesson02.teach.milna_se_grammar:
    title: Se = tu „z”, a nie „z/od (skąd)”
    gloss: Tutaj 'se' nie oznacza „z, ze (skądś)” – 'X se milna' znaczy „spotkać się z X”, a w zdaniu 'main Bharat se hoon' to samo słowo 'se' oznaczało „z” w sensie pochodzenia.
    note: Prawdziwe podwójne użycie znanego już słowa, wyraźnie omówione.
  hi.a1.unit12.lesson02.teach.wahan_review:
    title: 'Powtórka: tam'
    gloss: tam
    note: Krótka powtórka z jednostek 8/9, użyta tu do powiedzenia, gdzie odbyło się spotkanie.
    example_gloss: Szkoła jest tam.
  hi.a1.unit12.lesson02.teach.kal_bazaar_gaya_phrase:
    title: Wczoraj poszedłem na targ.
    gloss: Wczoraj poszedłem na targ.
    note: Łączy nowy czas przeszły z 'kal' z lekcji 1.
  hi.a1.unit12.lesson02.teach.wahan_priya_se_mila_phrase:
    title: Spotkałem tam Priyę.
    gloss: Spotkałem tam Priyę.
    note: Łączy 'mila' z tej lekcji z 'se' („z”) i 'wahan' (tam).
  hi.a1.unit12.lesson02.teach.saath_review:
    title: 'Powtórka: razem'
    gloss: razem
    note: Krótka powtórka z jednostki 11.
    example_gloss: Pijemy razem herbatę.
  hi.a1.unit12.lesson03.teach.chai_dukaan_khana_review:
    title: 'Powtórka: herbata, sklep, jedzenie'
    gloss: herbata, sklep, jedzenie
    note: Krótka powtórka trzech rzeczowników z jednostek 6/7, potrzebnych w dialogu i w notatce do czytania w tej lekcji.
    example_gloss:
    - Herbata jest dobra.
    - Sklep jest dobry.
    - Jedzenie jest dobre.
  hi.a1.unit12.lesson03.teach.ka_kaisi_review:
    title: 'Powtórka: „z/od” (ka), jaka (rodzaj żeński)'
    gloss: od / należący do (ka), jaka (rodzaj żeński, kaisi)
    note: '''Ka'' (z wcześniejszego ''kitne ka'' i z ''raat ka khana'' z jednostki 10) oraz ''kaisi'' (poznane wcześniej) pojawiają się tu ponownie – to nie jest nowa gramatyka.'
    example_gloss:
    - Wczorajszy dzień był dobry.
    - Jaka była herbaciarnia?
  hi.a1.unit12.lesson03.teach.dialogue.line01:
    title: Arjun pyta, jak było wczoraj
    gloss: Priya, jak minął wczorajszy dzień?
  hi.a1.unit12.lesson03.teach.dialogue.line02:
    title: Priya mówi, że było dobrze
    gloss: Bardzo dobrze! Spotkaliśmy się.
  hi.a1.unit12.lesson03.teach.dialogue.line03:
    title: Arjun wspomina o targu
    gloss: Tak! Najpierw poszedłem też na targ.
  hi.a1.unit12.lesson03.teach.dialogue.line04:
    title: Priya pyta o targ
    gloss: Dobrze! Co było na targu?
  hi.a1.unit12.lesson03.teach.dialogue.line05:
    title: Arjun odpowiada
    gloss: Jedzenie było dobre.
  hi.a1.unit12.lesson03.teach.dialogue.line06:
    title: Priya pyta o herbaciarnię
    gloss: Dobrze! A jaka była herbaciarnia?
  hi.a1.unit12.lesson03.teach.dialogue.line07:
    title: Arjun odpowiada
    gloss: Herbaciarnia była bardzo dobra.
  hi.a1.unit12.lesson03.teach.dialogue.line08:
    title: Priya kończy rozmowę
    gloss: Dobrze! To spotkamy się znowu jutro?
  hi.a1.unit12.lesson03.teach.mile_grammar:
    title: Tum/hum/ve mają w przeszłości formę w kształcie liczby mnogiej
    gloss: '''Tum'', ''hum'' i ''ve'' przyjmują w czasie przeszłym tę samą formę, co w teraźniejszym z ''-te'': ''the'' (zamiast ''tha''), ''gaye'' (zamiast ''gaya''), ''mile'' (zamiast ''mila'') – tak jak z ''hum milte hain'' powstaje ''hum mile''.'
    note: Przedstawia pełniejszy wzorzec dla lepszego zrozumienia, choć w ćwiczeniach tej jednostki ćwiczy się aktywnie tylko 'mile' – 'the' i 'gaye' są tylko do rozpoznawania i pojawiają się wyłącznie w tym objaśnieniu.
  hi.a1.unit12.lesson03.teach.priya_note:
    title: Notatka od Priyi
    gloss: Arjun, wczorajszy dzień był bardzo dobry. Jedzenie było dobre i herbaciarnia też była dobra. – Priya
    note: Krótka notatka powtarzająca fakty z dialogu, bez nowego słownictwa.
    glosses:
      कल: wczoraj
      दिन: dzień
      अच्छा: dobry (rodzaj męski)
      था: był (rodzaj męski)
      खाना: karma
      दुकान: sklep
      अच्छी: dobra (rodzaj żeński)
      थी: była (rodzaj żeński)
