answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (पाँच vs. मैं, हैं, में). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (पांच for पाँच) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
units:
  hi.a1.unit02.numbers:
    title: Liczby
lessons:
  hi.a1.unit02.lesson01.numbers_zero_to_ten:
    title: Liczby od zera do dziesięciu
  hi.a1.unit02.lesson02.numbers_and_prices:
    title: Liczby od jedenastu do stu i ceny
  hi.a1.unit02.lesson03.phone_and_age:
    title: Numer telefonu i wiek
teaching:
  hi.a1.unit02.lesson01.teach.shoonya:
    title: Zero
    gloss: zero
    note: Punkt wyjścia dla wszystkich liczb w tej lekcji.
    example_gloss: Dziś temperatura wynosi zero.
  hi.a1.unit02.lesson01.teach.ek:
    title: Jeden
    gloss: jeden
    note: Hindi liczby 11–99 to osobne słowa, a nie konstrukcje typu „dziesięć + jeden”; zobaczysz to w lekcji 2, gdzie बीस (20) i तीस (30) nie mają żadnego wspólnego elementu z एक (1) ani दो (2).
    example_gloss: Mam jedną książkę.
  hi.a1.unit02.lesson01.teach.do:
    title: Dwa
    gloss: dwa
    note: Prosta, bardzo częsta liczba; to także nieformalny tryb rozkazujący od „dać”, ale kontekst zawsze wyjaśnia znaczenie.
    example_gloss: Mam dwóch braci.
  hi.a1.unit02.lesson01.teach.teen:
    title: Trzy
    gloss: trzy
    note: '*Chahiye* („jest potrzebne”) to częsta konstrukcja bezosobowa: *mujhe teen seb chahiye* znaczy dosłownie „mnie trzy jabłka [jest] potrzebne” – bardzo naturalny sposób, by powiedzieć „potrzebuję”.'
    example_gloss: Potrzebuję trzech jabłek.
  hi.a1.unit02.lesson01.teach.chaar:
    title: Cztery
    gloss: cztery
    note: Brak tu nieregularności – chaar zachowuje się jak każda inna mała liczba.
    example_gloss: Mam czterech przyjaciół.
  hi.a1.unit02.lesson01.teach.paanch:
    title: Pięć
    gloss: pięć
    note: Pisze się z chandrabindu (पाँच), a nie z anusvarą – znak samogłoski aa (ा) nie wystaje ponad literę, dlatego potrzebne jest chandrabindu zamiast zwykłej kropki; ta sama zasada działała już w słowach हाँ/कहाँ w lekcji 1.
    example_gloss: Mam pięć rupii.
  hi.a1.unit02.lesson01.teach.chhah:
    title: Sześć
    gloss: sześć
    note: W starszych tekstach bywa też pisane छः; standardowa współczesna pisownia to छह.
    example_gloss: Mam sześć książek.
  hi.a1.unit02.lesson01.teach.saat:
    title: Siedem
    gloss: siedem
    note: Przydatna liczba, gdy mówisz o dniach tygodnia.
    example_gloss: W tygodniu jest siedem dni.
  hi.a1.unit02.lesson01.teach.aath:
    title: Osiem
    gloss: osiem
    note: Brak tu nieregularności – aath zachowuje się jak każda inna mała liczba.
    example_gloss: W tym pokoju jest osiem krzeseł.
  hi.a1.unit02.lesson01.teach.nau:
    title: Dziewięć
    gloss: dziewięć
    note: Nie potrzeba tu znaku nosowości, w przeciwieństwie do niektórych sąsiednich liczb.
    example_gloss: Zajęcia jogi zaczynają się o dziewiątej rano.
  hi.a1.unit02.lesson01.teach.das:
    title: Dziesięć
    gloss: dziesięć
    note: Ostatnia liczba pierwszego zestawu – lekcja 2 przechodzi do liczb od jedenastu i do pełnych dziesiątek, których nie da się już przewidzieć.
    example_gloss: Mam dziesięć palców u rąk.
  hi.a1.unit02.lesson02.teach.gyaarah:
    title: Jedenaście
    gloss: jedenaście
    note: Od tego miejsca liczby w hindi to osobne, nieregularne słowa – gyaarah nie zawiera widocznie das (10) ani ek (1). Nie ma skrótu; każdą trzeba zapamiętać osobno.
    example_gloss: W tej klasie jest jedenaścioro uczniów.
  hi.a1.unit02.lesson02.teach.baarah:
    title: Dwanaście
    gloss: dwanaście
    note: Kolejna do zapamiętania – żaden przewidywalny wzór nie łączy jej z do (2).
    example_gloss: W roku jest dwanaście miesięcy.
  hi.a1.unit02.lesson02.teach.pandrah:
    title: Piętnaście
    gloss: piętnaście
    note: Częsta liczba przy krótkich odcinkach czasu, np. piętnastominutowej przerwie.
    example_gloss: Potrzebuję piętnastu minut.
  hi.a1.unit02.lesson02.teach.bees:
    title: Dwadzieścia
    gloss: dwadzieścia
    note: Całkiem nowe słowo, a nie połączenie das (10) i do (2) – ten schemat powtarza się przy każdej kolejnej dziesiątce.
    example_gloss: Moja siostra ma dwadzieścia lat.
  hi.a1.unit02.lesson02.teach.tees:
    title: Trzydzieści
    gloss: trzydzieści
    note: Znów osobne słowo – trochę przypomina teen (3), ale nie da się go złożyć z teen i das, więc zapamiętaj je osobno.
    example_gloss: Bilet kosztuje trzydzieści rupii.
  hi.a1.unit02.lesson02.teach.pachaas:
    title: Pięćdziesiąt
    gloss: pięćdziesiąt
    note: Bardzo często używana okrągła liczba, zwłaszcza przy cenach.
    example_gloss: Mam pięćdziesiąt rupii.
  hi.a1.unit02.lesson02.teach.sau:
    title: Sto
    gloss: sto
    note: Okrągła liczba, bardzo częsta w codziennych cenach.
    example_gloss: Ta książka kosztuje sto rupii.
  hi.a1.unit02.lesson02.teach.keemat:
    title: Cena
    gloss: cena
    note: '*Keemat* to rzeczownik rodzaju żeńskiego – jego forma dzierżawcza zawsze jest żeńska (*iski keemat*, „jego cena”), niezależnie od tego, jaki przedmiot jest wyceniany.'
    example_gloss: Ile kosztuje ten bilet?
  hi.a1.unit02.lesson02.teach.rupaye:
    title: Rupie
    gloss: rupie
    note: '*Rupaya* to forma pojedyncza (dla dokładnie jednej rupii); *rupaye* stosuje się przy każdej większej kwocie.'
    example_gloss: To kosztuje pięćdziesiąt rupii.
  hi.a1.unit02.lesson02.teach.iski_keemat_kya_hai:
    title: Pytanie o cenę
    gloss: Ile to kosztuje?
    note: '*Iski* („jego/jej”) zgadza się z rzeczownikiem żeńskim *keemat* („cena”), a nie z przedmiotem, o którego cenę pytasz – ten sam wzorzec zgody co w *mera naam* z lekcji 1.'
  hi.a1.unit02.lesson02.teach.iski_keemat_pachaas_rupaye_hai:
    title: Podawanie ceny
    gloss: Kosztuje pięćdziesiąt rupii.
    note: Naturalna pełna odpowiedź na pytanie Iski keemat kya hai?
  hi.a1.unit02.lesson03.teach.aapka_phone_number_kya_hai:
    title: Pytanie o numer telefonu, formalnie
    gloss: Jaki jest Pana/Pani numer telefonu? (formalnie)
    note: '*Number* (नंबर) to częste zapożyczenie z angielskiego, używane na co dzień w hindi na każdym kroku. *Aapka* zgadza się z rzeczownikiem rodzaju męskiego *number*.'
  hi.a1.unit02.lesson03.teach.tumhara_phone_number_kya_hai:
    title: Pytanie o numer telefonu, nieformalnie
    gloss: Jaki jest twój numer telefonu? (nieformalnie)
    note: Tumhara zastępuje aapka w rozmowie z przyjacielem lub rówieśnikiem, tak jak w lekcji 1.
  hi.a1.unit02.lesson03.teach.mera_number:
    title: Podawanie numeru, wprowadzenie
    gloss: Mój numer to...
    note: Naturalny sposób, by zacząć, zanim podasz cyfry jedna po drugiej.
  hi.a1.unit02.lesson03.teach.sample_number:
    title: Przykładowy numer telefonu
    gloss: Sześć, dwa, osiem, trzy, pięć.
    note: Numery telefonów w hindi czyta się cyfra po cyfrze, podobnie jak po polsku – wszystkie cyfry z tego przykładu poznałeś już w lekcji 1.
  hi.a1.unit02.lesson03.teach.aapki_umra_kya_hai:
    title: Pytanie o wiek, formalnie
    gloss: Ile Pan/Pani ma lat? (formalnie)
    note: '*Umra* („wiek”) to rzeczownik rodzaju żeńskiego, więc *aapki* przyjmuje formę żeńską – ten sam wzorzec zgody co w *iski keemat*, tylko tu dotyczy wieku osoby, a nie ceny.'
  hi.a1.unit02.lesson03.teach.tumhari_umra_kya_hai:
    title: Pytanie o wiek, nieformalnie
    gloss: Ile masz lat? (nieformalnie)
    note: Tumhari zastępuje aapki w rozmowie z przyjacielem lub rówieśnikiem.
  hi.a1.unit02.lesson03.teach.meri_umra_tees_saal_hai:
    title: Podanie swojego wieku
    gloss: Mam trzydzieści lat.
    note: '*Meri* zgadza się z *umra* (rodzaj żeński), a nigdy z płcią mówiącego – w odróżnieniu od form czasownika *chahta/chahti* z lekcji 1 ta forma dzierżawcza nie zmienia się, kto by nie mówił.'
  hi.a1.unit02.lesson03.teach.dialogue.line01:
    title: Arjun prosi Priyę o numer
    gloss: Arjun nieformalnie pyta Priyę o numer telefonu.
    note: Dokładnie to samo nieformalne pytanie o numer telefonu, które poznałeś w tej lekcji.
  hi.a1.unit02.lesson03.teach.dialogue.line02:
    title: Priya podaje swój numer i pyta o jego
    gloss: Priya podaje cyfra po cyfrze swój numer telefonu, a potem pyta o numer Arjuna.
    note: Wszystkie cyfry poznałeś już w lekcji 1 tego rozdziału.
  hi.a1.unit02.lesson03.teach.dialogue.line03:
    title: Arjun podaje swój numer
    gloss: Arjun podaje swój numer telefonu.
    note: Znów wszystkie cyfry pochodzą ze słownictwa z lekcji 1.
  hi.a1.unit02.lesson03.teach.dialogue.line04:
    title: Priya pyta Arjuna o wiek
    gloss: Priya dziękuje mu i nieformalnie pyta o wiek.
    note: Shukriya („dziękuję”) nie zmienia się zależnie od stopnia formalności, tak samo jak w karcie shukriya z lekcji 1.
  hi.a1.unit02.lesson03.teach.dialogue.line05:
    title: Arjun podaje wiek i pyta o jej
    gloss: Arjun mówi, że ma dwadzieścia lat, i pyta Priyę o jej wiek.
    note: Samo Tumhari? to krótki, naturalny sposób, by zwrócić pytanie.
  hi.a1.unit02.lesson03.teach.dialogue.line06:
    title: Priya podaje swój wiek
    gloss: Priya mówi, że ma trzydzieści lat.
    note: Meri umra tees saal hai powtarza dokładnie wzorzec zdania poznany wcześniej w tej lekcji.
  hi.a1.unit02.lesson03.teach.dialogue.line07:
    title: Arjun kończy rozmowę
    gloss: Arjun reaguje pozytywnie i mówi, że jeszcze się z nią zobaczy.
    note: Zarówno accha, jak i phir milenge powtarzają słownictwo pożegnań z lekcji 1.
  hi.a1.unit02.lesson03.teach.dialogue.line08:
    title: Priya kończy rozmowę
    gloss: Priya się zgadza i luźno mówi „do zobaczenia”.
    note: Zarówno theek hai, jak i phir milte hain powtarzają słownictwo pożegnań z lekcji 1.
