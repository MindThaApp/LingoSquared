teaching:
  hi.a1.unit29.lesson01.teach.kul_kitna_hua:
    title: Pytanie o łączną cenę
    gloss: Ile to kosztuje w sumie?
    note: '*कुल* znaczy „razem, w sumie”, a *कितना हुआ?* („ile to wyszło?”) to codzienny sposób pytania o całą kwotę.'
  hi.a1.unit29.lesson01.teach.kul_pachchees_rupye:
    title: Podawanie łącznej ceny
    gloss: W sumie to dwieście pięćdziesiąt rupii.
    note: '*हुए* zgadza się z liczbą mnogą *रुपये*: *कुल दो सौ पचास रुपये हुए* to dosłownie „w sumie wyszło dwieście pięćdziesiąt rupii”.'
  hi.a1.unit29.lesson02.teach.kard_se_pement:
    title: Płacenie kartą lub gotówką
    gloss: płacić kartą, płacić gotówką
    note: W hindi mówi się *कार्ड से पेमेंट करना* („płacić kartą”) i *नकद पेमेंट करना* („płacić gotówką”); *से* oznacza sposób płatności.
    example_gloss:
    - Czy mogę tu zapłacić kartą?
    - Płacę gotówką.
  hi.a1.unit29.lesson02.teach.kya_main_yahan:
    title: Pytanie, czy można zapłacić kartą
    gloss: Czy mogę tu zapłacić kartą?
    note: '*यहाँ* („tutaj”) wskazuje miejsce, a *सकता हूँ* („mogę”) stoi po głównym wyrażeniu; kobieta mówi *सकती हूँ*.'
  hi.a1.unit29.lesson02.teach.ap_nakad_pement:
    title: Pytanie o preferowaną formę płatności
    gloss: Woli Pan/Pani zapłacić gotówką czy kartą?
    note: '*आप ... करेंगे* to grzeczne pytanie w czasie przyszłym, jakie zadaje kasjer, a *आप* łączy się z czasownikiem w liczbie mnogiej *करेंगे*.'
  hi.a1.unit29.lesson03.teach.bil:
    title: Rachunek
    gloss: rachunek
    note: '*बिल* jest rzeczownikiem rodzaju męskiego: *एक बिल*, *बिल का*.'
    example_gloss: Podzielimy rachunek?
  hi.a1.unit29.lesson03.teach.bil_bant_len:
    title: Propozycja podzielenia rachunku
    gloss: Podzielimy rachunek?
    note: '*बाँट लें?* („podzielimy?”) proponuje wspólny plan bez słowa *हम*; *लें* to forma „zróbmy” od *लेना*.'
  hi.a1.unit29.lesson03.teach.kya_main_alag:
    title: Prośba o osobne płacenie
    gloss: Czy mogę zapłacić osobno?
    note: '*अलग से* znaczy „osobno” i stoi przed *पेमेंट कर सकता हूँ*.'
  hi.a1.unit29.lesson04.teach.bakee_paise:
    title: Reszta
    gloss: reszta
    note: '*बाकी पैसे* („pozostałe pieniądze”) jest w liczbie mnogiej i oznacza resztę, którą dostajesz z powrotem.'
    example_gloss: Oto Pana/Pani reszta.
  hi.a1.unit29.lesson04.teach.ye_rahe_apke:
    title: Wydawanie reszty
    gloss: Oto Pana/Pani reszta.
    note: '*आपके* to grzecznościowe „pański/pani” (*आप* + *के*), zgodne z liczbą mnogą *पैसे*.'
  hi.a1.unit29.lesson04.teach.mujhe_bakee_paise:
    title: Odmowa przyjęcia reszty
    gloss: Nie potrzebuję reszty.
    note: '*मुझे ... नहीं चाहिए* („mnie ... nie jest potrzebne”) to hindi sposób na „nie potrzebuję”; *नहीं* stoi przed *चाहिए*.'
  hi.a1.unit29.lesson05.teach.paintees:
    title: Trzysta pięćdziesiąt
    gloss: trzysta pięćdziesiąt
    note: '*तीन सौ पचास* to 350: najpierw mówi się setki, potem dziesiątki.'
    example_gloss: To kosztuje trzysta pięćdziesiąt rupii.
  hi.a1.unit29.lesson05.teach.bil_do_thalee:
    title: Czytamy rachunek z restauracji
    gloss: 'Rachunek: dwie thali i dwie herbaty. Razem: trzysta pięćdziesiąt rupii. Płatność: kartą.'
    note: Zwróć uwagę, co zamówiono, jaka jest suma i jak zapłacono.
    glosses:
      बिल: rachunek
      दो: dwa
      थाली: thali
      चाय: herbaty
      कुल: razem
      तीन: trzy
      सौ: sto
      पचास: pięćdziesiąt
      रुपये: rupie
      पेमेंट: płatność
      कार्ड: karta
  hi.a1.unit29.lesson06.teach.priya_bil_mang:
    title: Priya prosi o rachunek
    gloss: 'Priya: Poprosimy o rachunek?'
    note: '*माँग लें?* („poprosimy o niego?”) znów używa formy „zróbmy” od *लेना*, a *माँगना* znaczy „prosić o coś”.'
  hi.a1.unit29.lesson06.teach.arjun_han_achchha:
    title: Arjun pyta o sumę
    gloss: 'Arjun: Tak, dobry pomysł. Ile to wychodzi razem?'
    note: '*कुल कितना हुआ?* to pytanie o sumę, które już znasz, tym razem zadane przy stoliku.'
  hi.a1.unit29.lesson06.teach.priya_paintees_rupye:
    title: Priya podaje sumę
    gloss: 'Priya: Wychodzi trzysta pięćdziesiąt rupii. Podzielimy się?'
    note: '*तीन सौ पचास रुपये हुए* podaje sumę, a *बाँट लें?* pyta: „podzielimy to?”'
  hi.a1.unit29.lesson06.teach.arjun_naheen_aj:
    title: Arjun nalega, że zapłaci
    gloss: 'Arjun: Nie, dzisiaj ja płacę. Bardzo mi pomogłaś.'
    note: '*मुझे पेमेंट करने दो* znaczy „pozwól mi zapłacić”, a w zdaniu *तुमने मेरी बहुत मदद की है* pojawia się *ने*, bo czasownik jest w czasie przeszłym.'
  hi.a1.unit29.lesson06.teach.priya_tum_kitne:
    title: Priya jest wzruszona
    gloss: 'Priya: Ależ jesteś miły! Dziękuję bardzo.'
    note: '*तुम कितने अच्छे हो!* („jaki jesteś dobry!”) to ciepły komplement, a *शुक्रिया* znaczy „dziękuję”.'
  hi.a1.unit29.lesson06.teach.arjun_kya_main:
    title: Arjun pyta o płatność kartą
    gloss: 'Arjun: Czy mogę tu zapłacić kartą?'
    note: Pytanie *क्या मैं यहाँ कार्ड से पेमेंट कर सकता हूँ?* wraca, tym razem w prawdziwej restauracji.
  hi.a1.unit29.lesson06.teach.arjun_bil_deta:
    title: 'देता है: płaci'
    gloss: Arjun płaci rachunek.
    note: '*देता है* to forma od *देना* („dawać”) dla *वह*; po hindi mówi się dosłownie „daje rachunek”, gdy chodzi o „płaci rachunek”.'
