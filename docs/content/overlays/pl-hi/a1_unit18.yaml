teaching:
  hi.a1.unit18.lesson01.teach.ghar_review:
    title: 'Powtórka: dom'
    gloss: dom
    note: Poznane w lekcji 8 – to słowo przewodnie całej tej lekcji.
    example_gloss: To jest dom.
  hi.a1.unit18.lesson01.teach.mein_review:
    title: 'Powtórka: w / na'
    gloss: w / na
    note: Poznane w lekcji 1 – w tej lekcji służy do określania miejsca pokoi i przedmiotów.
    example_gloss: Pracuję w biurze.
  hi.a1.unit18.lesson01.teach.hai_hain_review:
    title: 'Powtórka: jest, są'
    gloss: jest (liczba pojedyncza), są (liczba mnoga)
    note: Para form „jest/są”, od której zależy cały wzorzec liczebności w tej lekcji.
    example_gloss:
    - To jest dom.
    - Mój dziadek mieszka w Delhi.
  hi.a1.unit18.lesson01.teach.numbers_review:
    title: 'Powtórka: ile, jeden, dwa, trzy'
    gloss: ile, jeden, dwa, trzy
    note: Poznane w lekcjach 2 i 7 – tutaj użyte do liczenia pokoi.
    example_gloss:
    - Mam trzech braci.
    - Ile pokoi jest w domu?
  hi.a1.unit18.lesson01.teach.kamra_kamre:
    title: Pokój (liczba pojedyncza / mnoga)
    gloss: pokój, pokoje
    note: 'Nowy rzeczownik. Zwróć uwagę na liczbę mnogą: *kamra* (jeden) zmienia się w *kamre* (więcej niż jeden) – zobacz notatkę gramatyczną w tej lekcji.'
    example_gloss:
    - W domu jest jeden pokój.
    - W domu są trzy pokoje.
  hi.a1.unit18.lesson01.teach.grammar_room_plural:
    title: 'Rodzaj męski: -a → -e w liczbie mnogiej'
    gloss: 'Rzeczowniki rodzaju męskiego zakończone na „-a” przyjmują w liczbie mnogiej końcówkę „-e”: „kamra” (jeden) zmienia się w „kamre” (więcej niż jeden). Zmienia się też czasownik: „hai” przy jednym, „hain” przy większej liczbie – np. „ghar mein ek kamra hai”, ale „ghar mein teen kamre hain”.'
    note: Pierwsza w tym kursie omówiona wprost reguła liczby mnogiej rzeczowników, podana, zanim jakiekolwiek ćwiczenie z niej skorzysta.
  hi.a1.unit18.lesson01.teach.rasoi:
    title: Kuchnia
    gloss: kuchnia
    note: Nowy rzeczownik, pierwsze w tej lekcji słowo oznaczające pomieszczenie.
    example_gloss: W domu jest kuchnia.
  hi.a1.unit18.lesson01.teach.bathroom:
    title: Łazienka
    gloss: łazienka
    note: Częste zapożyczenie z angielskiego w potocznym hindi, tak samo jak *doctor* i *engineer* (lekcje 16 i 17).
    example_gloss: W domu jest łazienka.
  hi.a1.unit18.lesson01.teach.bedroom:
    title: Sypialnia
    gloss: sypialnia
    note: Też częste zapożyczenie, niezmienne jak *bathroom* – nie ma własnej końcówki liczby mnogiej, wystarczy liczebnik + *hain*.
    example_gloss: W domu są dwie sypialnie.
  hi.a1.unit18.lesson01.teach.ghar_mein_kitne_kamre_phrase:
    title: Ile pokoi jest w domu?
    gloss: Ile pokoi jest w domu?
    note: Pytanie otwierające tę lekcję.
  hi.a1.unit18.lesson01.teach.ghar_mein_teen_kamre_phrase:
    title: W domu są trzy pokoje.
    gloss: W domu są trzy pokoje.
    note: Przykładowa odpowiedź na pytanie otwierające tę lekcję.
  hi.a1.unit18.lesson02.teach.aur_review:
    title: 'Powtórka: i'
    gloss: i
    note: Poznane w lekcji 1 – tutaj użyte do wymieniania mebli.
    example_gloss: Mnie też się podobało, a tobie?
  hi.a1.unit18.lesson02.teach.mez:
    title: Stół
    gloss: stół
    note: Nowy rzeczownik, w ćwiczeniach tej lekcji tylko w liczbie pojedynczej (jego liczba mnoga nie była jeszcze omawiana).
    example_gloss: W kuchni jest stół.
  hi.a1.unit18.lesson02.teach.kursi_kursiyan:
    title: Krzesło (liczba pojedyncza / mnoga)
    gloss: krzesło, krzesła
    note: 'Nowy rzeczownik. Zwróć uwagę na liczbę mnogą: *kursi* (jedno) zmienia się w *kursiyan* (więcej niż jedno) – to inna reguła niż *kamra*/*kamre*, zobacz notatkę gramatyczną w tej lekcji.'
    example_gloss:
    - W kuchni stoi krzesło.
    - W kuchni są cztery krzesła.
  hi.a1.unit18.lesson02.teach.chaar_review:
    title: 'Powtórka: cztery'
    gloss: cztery
    note: Poznane w lekcji 2 – tutaj użyte do liczenia krzeseł.
    example_gloss: W kuchni są cztery krzesła.
  hi.a1.unit18.lesson02.teach.grammar_feminine_plural:
    title: 'Rodzaj żeński: -i → -iyan w liczbie mnogiej'
    gloss: 'Rzeczowniki rodzaju żeńskiego zakończone na „-i” przyjmują w liczbie mnogiej końcówkę „-iyan”: „kursi” (jedno) zmienia się w „kursiyan” (więcej niż jedno). Podobnie wcześniej w tej lekcji „kamra” zmieniło się w „kamre” według reguły męskiej, ale tutaj reguła jest inna, bo to słowo jest rodzaju żeńskiego i kończy się na „-i”.'
    note: Druga reguła liczby mnogiej w tej lekcji, celowo podana zaraz po pierwszej, by łatwo było zobaczyć kontrast.
  hi.a1.unit18.lesson02.teach.bistar:
    title: Łóżko
    gloss: łóżko
    note: Nowy rzeczownik, w ćwiczeniach tej lekcji tylko w liczbie pojedynczej.
    example_gloss: W sypialni jest łóżko.
  hi.a1.unit18.lesson02.teach.khidki_khidkiyan:
    title: Okno (liczba pojedyncza / mnoga)
    gloss: okno, okna
    note: Podlega tej samej regule żeńskiej liczby mnogiej „-i” → „-iyan” co *kursi*/*kursiyan*.
    example_gloss:
    - W sypialni jest okno.
    - W sypialni są dwa okna.
  hi.a1.unit18.lesson02.teach.rasoi_mein_mez_phrase:
    title: W kuchni jest stół.
    gloss: W kuchni jest stół.
    note: Wzorzec „miejsce + przedmiot” zastosowany do kuchni.
  hi.a1.unit18.lesson02.teach.bedroom_mein_bistar_phrase:
    title: W sypialni jest łóżko.
    gloss: W sypialni jest łóżko.
    note: Wzorzec „miejsce + przedmiot” zastosowany do sypialni.
  hi.a1.unit18.lesson03.teach.kaisa_review:
    title: 'Powtórka: jaki / jaki on jest'
    gloss: jaki / jaki jest
    note: Poznane w lekcji 12 – tutaj użyte do pytania o czyjś dom.
    example_gloss: Jaki jest twój dom?
  hi.a1.unit18.lesson03.teach.bada_chota_review:
    title: 'Powtórka: duży, mały'
    gloss: duży (r. m.), duża (r. ż.), mały (r. m.), mała (r. ż.)
    note: 'Poznane w lekcji 14 – tutaj użyte do opisu domu. Zgadza się z rodzajem rzeczownika: męski *ghar* ma *bada*/*chota*, żeńska *rasoi* ma *badi*.'
    example_gloss:
    - Mój dom jest mały.
    - To duża kuchnia.
  hi.a1.unit18.lesson03.teach.ya_review:
    title: 'Powtórka: albo / czy'
    gloss: albo / czy
    note: Poznane w lekcji 14 – tutaj użyte w pytaniu z wyborem.
    example_gloss: Twój dom jest duży czy mały?
  hi.a1.unit18.lesson03.teach.arjun_priya_review:
    title: 'Powtórka: Arjun, Priya'
    gloss: Arjun, Priya
    note: Przypomnienie imion obu bohaterów, zanim ćwiczenia z szykiem wyrazów i gramatyki użyją ich do wskazania, czyj dom jest opisywany.
    example_gloss:
    - Mam na imię Arjun.
    - Mam na imię Priya.
  hi.a1.unit18.lesson03.teach.ka_review:
    title: 'Powtórka: dopełniacz (czyjś)'
    gloss: dopełniacz „czyjś” (rzeczownik rodzaju męskiego)
    note: Poznane w lekcjach 7, 10, 12, 14 i 15 – tutaj użyte do wskazania, czyj dom jest opisywany, cały czas w podstawowej formie mianownikowej.
    example_gloss: Dom Priyi jest mały.
  hi.a1.unit18.lesson03.teach.dialogue.line01:
    title: Arjun pyta Priyę o jej dom
    gloss: Priya, twój dom jest duży czy mały?
  hi.a1.unit18.lesson03.teach.dialogue.line02:
    title: Priya mówi, że jej dom jest mały
    gloss: 'Mój dom jest mały. W domu są dwa pokoje: kuchnia i łazienka.'
  hi.a1.unit18.lesson03.teach.dialogue.line03:
    title: Priya zadaje Arjunowi to samo pytanie
    gloss: A twój dom, Arjun?
  hi.a1.unit18.lesson03.teach.dialogue.line04:
    title: Arjun mówi, że jego dom jest duży
    gloss: Mój dom jest duży. W domu są trzy sypialnie i duża kuchnia.
  hi.a1.unit18.lesson03.teach.dialogue.line05:
    title: Priya pyta, co jest w sypialni
    gloss: Wow! Co jest w sypialni?
  hi.a1.unit18.lesson03.teach.dialogue.line06:
    title: Arjun opisuje sypialnię
    gloss: W sypialni jest łóżko i dwa okna.
  hi.a1.unit18.lesson03.teach.dialogue.line07:
    title: Priya reaguje
    gloss: Bardzo ładnie!
  hi.a1.unit18.lesson03.teach.dialogue.line08:
    title: Arjun dziękuje
    gloss: Dzięki!
  hi.a1.unit18.lesson03.teach.grammar_summary:
    title: Trzy główne zasady
    gloss: 'Trzy główne zasady tej lekcji: (1) „[miejsce] + mein + [liczba] + [rzeczownik] + hai/hain” – tak mówimy, co jest w domu i ile tego jest; (2) rzeczowniki rodzaju męskiego kończące się na „-a” mają w liczbie mnogiej końcówkę „-e” (kamra -> kamre); (3) rzeczowniki rodzaju żeńskiego kończące się na „-i” mają w liczbie mnogiej końcówkę „-iyan” (kursi -> kursiyan, khidki -> khidkiyan).'
    note: Końcowe podsumowanie, które łączy gramatykę całej lekcji, podobnie jak notatki gramatyczne w lekcjach 15–17.
  hi.a1.unit18.lesson03.teach.home_reading:
    title: Czytanie o dwóch domach
    gloss: Dom Priyi jest mały. W domu są dwa pokoje, kuchnia i łazienka. Dom Arjuna jest duży. W domu są trzy sypialnie i duża kuchnia.
    note: Krótki, prosty opis powtarzający dokładnie te fakty, które padły już w dialogu, bez nowych informacji. Ćwiczy czytanie krótkiego opisu mieszkania.
    glosses:
      घर: dom
      छोटा: mały
      कमरे: pokoje
      रसोई: kuchnia
      बाथरूम: łazienka
      बड़ा: duży
      बेडरूम: sypialnie
      बड़ी: duża (rodzaj żeński)
