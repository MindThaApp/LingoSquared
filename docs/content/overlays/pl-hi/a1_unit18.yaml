answer_policy:
  existential_quantity: '"[Place] + में + [number] + [noun] + है/हैं" states what''s in a home and how many. The verb must agree with the NUMBER (है for one, हैं for more than one), not with the place -- a typed answer mismatching singular/plural verb agreement (e.g. "घर में तीन कमरा है") is the exact ungrammatical error this unit''s own grammar_check exercises target, and should be marked incorrect, not tolerated as a minor typo.'
  masculine_plural: '*Kamra* (one room) becomes *kamre* (more than one room) -- the "-आ" ending masculine noun plural rule. A typed answer using the singular form where the sentence''s own number word calls for plural (or vice versa) is a real grammar error, not a typo.'
  feminine_plural: '*Kursi* (one chair) becomes *kursiyan* (more than one chair); *khidki* (one window) becomes *khidkiyan* (more than one window) -- the "-ई" ending feminine noun plural rule, a genuinely different pattern from the masculine rule above. Judge the same way: wrong number agreement is a grammar error, not a typo.'
  scope_note: '*Mez* (table), *bistar* (bed), *bathroom*, and *bedroom* are kept singular-only in this unit''s own exercises by design (their own plural rules aren''t taught yet) -- don''t expect or accept a plural form of these four words as a typed answer here.'
  gender_agreement: '*Bada*/*chota* (big/small) agree with the noun''s own gender -- masculine घर takes *bada*/*chota* (not *badi*/*choti*), feminine रसोई takes *badi* (not *bada*), matching unit 14''s already-taught gender-agreement rule. A typed answer using the wrong gender form is marked incorrect as a real grammar error, not tolerated.'
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation. For any exercise asking the learner to describe their own home, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
