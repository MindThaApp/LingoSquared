    gloss: Priya codziennie jeździ do pracy pociągiem. Arjun zwykle jeździ rowerem, ale gdy pada deszcz, jeździ też pociągiem. Vikram woli jeździć samochodem. Neha mieszka w pobliżu i chodzi do pracy pieszo. A ty, jak dojeżdżasz do pracy?
    note: 'Zestawia cztery sposoby dojazdu do pracy i jeden warunek (deszcz: *बारिश हो तो*).'
