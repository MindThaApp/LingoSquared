    gloss: 'Jest teraz wiosna. Kwiaty są piękne. Nina pyta: Która pora roku wydaje ci się piękna? Arjun mówi: Lubię lato. Latem pływamy. Priya mówi: Lubię zimę. Zimą jeździmy na łyżwach.'
