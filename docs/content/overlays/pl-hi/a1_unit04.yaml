teaching:
  hi.a1.unit04.lesson01.teach.baje:
    title: Godzina (bajē)
    gloss: godzina (dwie lub więcej)
    note: Używane z każdą godziną oprócz pierwszej – specjalną formę dla *pierwszej* poznasz w dalszej części lekcji.
    example_gloss: Jest teraz piąta.
  hi.a1.unit04.lesson01.teach.abhi:
    title: Teraz
    gloss: teraz
    note: Proste słowo czasu, którego będziesz stale używać, mówiąc, która jest godzina.
    example_gloss: Jest teraz dziesiąta.
  hi.a1.unit04.lesson01.teach.ek_do_teen:
    title: Jeden, dwa, trzy
    gloss: jeden, dwa, trzy
    note: Słowo znane z jednostki 2, tu potrzebne do podawania godziny — zwróć uwagę, że *ek* łączy się ze specjalną formą *baja*, a *do* i *teen* ze zwykłą formą *baje*.
    example_gloss:
    - Teraz jest pierwsza.
    - Teraz jest druga.
    - Teraz jest trzecia.
  hi.a1.unit04.lesson01.teach.chaar_paanch_chhah:
    title: Cztery, pięć, sześć
    gloss: cztery, pięć, sześć
    note: Słowa znane z jednostki 2 — wszystkie trzy łączą się ze zwykłą formą *baje*.
    example_gloss:
    - Teraz jest czwarta.
    - Teraz jest piąta.
    - Teraz jest szósta.
  hi.a1.unit04.lesson01.teach.saat_aath_nau:
    title: Siedem, osiem, dziewięć
    gloss: siedem, osiem, dziewięć
    note: Słowa znane z jednostki 2.
    example_gloss:
    - Teraz jest siódma.
    - Teraz jest ósma.
    - Teraz jest dziewiąta.
  hi.a1.unit04.lesson01.teach.das_gyaarah_baarah:
    title: Dziesięć, jedenaście, dwanaście
    gloss: dziesięć, jedenaście, dwanaście
    note: Słowa znane z jednostki 2 — ostatnie liczby godzin, których będziesz potrzebować.
    example_gloss:
    - Teraz jest dziesiąta.
    - Teraz jest jedenasta.
    - Teraz jest dwunasta.
  hi.a1.unit04.lesson01.teach.baja_grammar_note:
    title: Baja czy baje
    gloss: '*Baja* występuje z liczbą *jeden*, a *baje* ze wszystkimi pozostałymi liczbami: *ek baja hai*, *do baje hain*.'
    note: To prawdziwy, istotny wyjątek w zgodzie, a nie uproszczenie — *ek baja hai* to jedyna godzina, w której używa się liczby pojedynczej.
  hi.a1.unit04.lesson01.teach.kitne_baje_hain:
    title: Pytanie o godzinę
    gloss: Która jest godzina?
    note: Dosłownie „ile godzin jest” — standardowy sposób pytania o czas.
  hi.a1.unit04.lesson01.teach.abhi_paanch_baje_hain:
    title: Podawanie godziny
    gloss: Teraz jest piąta.
    note: Naturalna pełnozdaniowa odpowiedź na pytanie *Kitne baje hain?*
  hi.a1.unit04.lesson02.teach.yoga_class_reprise:
    title: Zajęcia jogi
    gloss: zajęcia jogi
    note: Słowo znane z jednostki 1 — główny przykład tej lekcji do mówienia o planach.
    example_gloss: Zajęcia jogi są dzisiaj.
  hi.a1.unit04.lesson02.teach.subah:
    title: Rano
    gloss: rano
    note: Jedno z czterech określeń pory dnia w tej lekcji.
    example_gloss: Zajęcia jogi są rano.
  hi.a1.unit04.lesson02.teach.dopahar:
    title: Popołudnie / południe
    gloss: popołudnie, południe
    note: Oznacza zarówno południe, jak i wczesne popołudnie.
    example_gloss: W południe nie ma zajęć.
  hi.a1.unit04.lesson02.teach.shaam:
    title: Wieczór
    gloss: wieczór
    note: Część dnia po *dopahar* i przed *raat*.
    example_gloss: Następne zajęcia są o piątej po południu.
  hi.a1.unit04.lesson02.teach.raat:
    title: Noc
    gloss: noc
    note: Ostatnie z czterech określeń pory dnia.
    example_gloss: W nocy nie ma zajęć.
  hi.a1.unit04.lesson02.teach.ko_reprise:
    title: Ko z ogólnym określeniem czasu
    gloss: '*Ko* występuje z określeniem pory dnia, gdy nie podaje się konkretnej godziny: *dopahar ko*, *raat ko*.'
    note: To samo *ko*, które oznacza dzień tygodnia (jednostka 3), tu wskazuje ogólny przedział czasu — to naturalna, poprawna konstrukcja, ale nie jedyna w tej jednostce (forma z konkretną godziną jest w następnej notatce).
  hi.a1.unit04.lesson02.teach.time_of_day_baje_note:
    title: Określenie pory dnia bezpośrednio przed baje
    gloss: 'Przy konkretnej godzinie określenie pory dnia stoi bezpośrednio przed *baje*, bez żadnego słowa pomiędzy: *subah saat baje*, *shaam paanch baje*.'
    note: Tu nie ma *ko* — używa się go tylko przy ogólnym przedziale czasu bez konkretnej godziny, jak wyjaśnia poprzednia notatka.
  hi.a1.unit04.lesson02.teach.class_kitne_baje_hai:
    title: Pytanie o godzinę zajęć
    gloss: O której są zajęcia?
    note: Ten sam wzorzec *kitne baje* z lekcji 1, tu w pytaniu o wydarzenie, a nie o aktualny czas.
  hi.a1.unit04.lesson02.teach.class_subah_saat_baje_hai:
    title: Podawanie godziny wydarzenia
    gloss: Zajęcia są o siódmej rano.
    note: Łączy *subah* bezpośrednio z *saat baje*, zgodnie z notatką gramatyczną powyżej.
  hi.a1.unit04.lesson03.teach.kal:
    title: Jutro / wczoraj
    gloss: jutro, wczoraj
    note: Hindi używa jednego słowa na oba znaczenia — o sensie decyduje kontekst (i czas czasownika). W tej lekcji zawsze oznacza „jutro”.
    example_gloss: Jutro zajęcia są o piątej po południu.
  hi.a1.unit04.lesson03.teach.agli_reprise:
    title: Następny
    gloss: następny
    note: Słowo znane z jednostki 3 — forma żeńska, zgodna z żeńskim rzeczownikiem *class*.
    example_gloss: Następne zajęcia są jutro.
  hi.a1.unit04.lesson03.teach.theek_hai_shukriya_reprise:
    title: Dobrze, dziękuję
    gloss: Dobrze, dziękuję!
    note: Oba słowa znane ze słownictwa pożegnań z jednostki 1.
  hi.a1.unit04.lesson03.teach.milte_hain_reprise:
    title: Spotkamy się / do zobaczenia
    gloss: spotkamy się / do zobaczenia
    note: Znane z pożegnania kończącego jednostkę 3, tu w połączeniu z *kal* daje „do zobaczenia jutro”.
  hi.a1.unit04.lesson03.teach.agli_class_kitne_baje_hai:
    title: Pytanie o następne zajęcia
    gloss: O której są następne zajęcia?
    note: Łączy *agli* (forma żeńska, zgodna z rzeczownikiem class) ze wzorcem *kitne baje* z tej jednostki.
  hi.a1.unit04.lesson03.teach.agli_class_shaam_paanch_baje_hai:
    title: Podawanie godziny następnych zajęć
    gloss: Następne zajęcia są o piątej po południu.
    note: Naturalna pełnozdaniowa odpowiedź na powyższe pytanie.
  hi.a1.unit04.lesson03.teach.kal_milte_hain:
    title: Zakończenie z planem spotkania jutro
    gloss: Dobrze, do zobaczenia jutro!
    note: Naturalny sposób zakończenia rozmowy, gdy godzina została ustalona.
  hi.a1.unit04.lesson03.teach.dialogue.line01:
    title: Arjun pyta o następne zajęcia
    gloss: Arjun pyta, o której są następne zajęcia.
    note: Dokładnie to samo pytanie, które pojawiło się w tej lekcji.
  hi.a1.unit04.lesson03.teach.dialogue.line02:
    title: Priya podaje godzinę
    gloss: Priya mówi, że następne zajęcia są o piątej po południu.
    note: Dokładnie to samo zdanie odpowiedzi, które pojawiło się w tej lekcji.
  hi.a1.unit04.lesson03.teach.dialogue.line03:
    title: Arjun jej dziękuje
    gloss: 'Arjun mówi: dobrze, dziękuję.'
    note: Słownictwo znane z jednostki 1.
  hi.a1.unit04.lesson03.teach.dialogue.line04:
    title: Priya kończy rozmowę
    gloss: 'Priya zgadza się i mówi: do zobaczenia jutro.'
    note: Dokładnie ta sama końcowa kwestia, która pojawiła się w tej lekcji.
