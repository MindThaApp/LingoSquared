teaching:
  hi.a1.unit30.lesson01.teach.parhna_kasrat_karna:
    title: Czytanie, sport, gotowanie
    gloss: czytać, uprawiać sport, gotować
    note: 'Hobby po hindi nazywa się czasownikiem na *-ना*: *पढ़ना*, *कसरत करना* i *खाना बनाना* („czytać”, „ćwiczyć”, „gotować”).'
    example_gloss:
    - Lubię czytać książkę.
    - W soboty uprawiam sport.
    - Lubię gotować dla przyjaciół.
  hi.a1.unit30.lesson01.teach.khalee_samay:
    title: Czas wolny
    gloss: czas wolny
    note: '*खाली समय* („pusty czas”) to kluczowe wyrażenie do mówienia o hobby, a *में* oznacza „w”: *खाली समय में*.'
    example_gloss: W wolnym czasie lubię czytać.
  hi.a1.unit30.lesson01.teach.mujhe_khalee_samay:
    title: Mówimy, co robisz w wolnym czasie
    gloss: W wolnym czasie lubię czytać.
    note: '*मुझे ... पढ़ना पसंद है* („mnie czytanie jest miłe”) to sposób, w jaki hindi mówi „lubię czytać”; *मुझे* wskazuje, kto lubi.'
  hi.a1.unit30.lesson02.teach.sangeet_sunna_chitr:
    title: Muzyka, rysowanie, gry wideo
    gloss: słuchać muzyki, rysować, grać w gry wideo
    note: 'Jeszcze trzy hobby: *संगीत सुनना*, *चित्र बनाना* i *गेम खेलना*; *गेम* to słowo zapożyczone.'
    example_gloss:
    - Lubię słuchać muzyki.
    - Często rysuję.
    - Lubię grać w gry wideo z przyjaciółmi.
  hi.a1.unit30.lesson02.teach.mujhe_sangeet_sunna:
    title: Mówimy, że lubisz słuchać muzyki
    gloss: Lubię słuchać muzyki.
    note: '*संगीत सुनना* („słuchać muzyki”) nie potrzebuje dodatkowego słowa: dopełnienie stoi tuż przed czasownikiem.'
  hi.a1.unit30.lesson02.teach.mujhe_doston_ke:
    title: Mówimy, że lubisz grać z przyjaciółmi
    gloss: Lubię grać w gry wideo z przyjaciółmi.
    note: W *दोस्तों के साथ* („z przyjaciółmi”) słowo *दोस्त* stoi w liczbie mnogiej przypadka zależnego (*दोस्तों*), bo występuje przed *के साथ*.
  hi.a1.unit30.lesson03.teach.hamesha_aksar_kabheekbhee:
    title: Zawsze, często, czasami, nigdy
    gloss: zawsze, często, czasami, nigdy
    note: Określenia częstotliwości, takie jak *हमेशा*, *अक्सर*, *कभी-कभी* i *कभी नहीं*, zwykle stoją przed czasownikiem, a *कभी नहीं* znaczy „nigdy”.
    example_gloss:
    - W soboty zawsze ćwiczę.
    - Często czytam książkę.
    - Czasami rysuję.
    - Nigdy nie gram w gry.
  hi.a1.unit30.lesson03.teach.har_hafte_har:
    title: Co tydzień, w każdy weekend
    gloss: co tydzień, w każdy weekend
    note: '*हर* („każdy”) nigdy się nie zmienia, a następujące po nim słowo oznaczające czas pozostaje w formie podstawowej: *हर हफ़्ते*, *हर वीकेंड*.'
    example_gloss:
    - Co tydzień gotuję dla przyjaciół.
    - Co weekend ćwiczę.
  hi.a1.unit30.lesson03.teach.har_hafte_har_2:
    title: हर się nie zmienia
    gloss: Co tydzień, co weekend.
    note: '*हर* się nie zmienia, niezależnie od rzeczownika, który po nim stoi, więc nie ma formy do wyboru: *हर हफ़्ते*, *हर वीकेंड*.'
  hi.a1.unit30.lesson03.teach.tum_khalee_samay:
    title: Pytamy o czas wolny
    gloss: Co robisz w wolnym czasie?
    note: To główne pytanie tej lekcji — użyj go, by zapytać kogokolwiek o hobby.
  hi.a1.unit30.lesson04.teach.priya_ham_aksar:
    title: Priya zaczyna rozmowę o hobby
    gloss: 'Priya: Często spacerujemy razem. Ale co jeszcze robisz w wolnym czasie, Arjun?'
    note: '*टहलते हैं* jest w liczbie mnogiej, bo podmiotem jest *हम* („my”), a *अक्सर* stoi przed czasownikiem.'
  hi.a1.unit30.lesson04.teach.arjun_mujhe_khana:
    title: Hobby Arjuna
    gloss: 'Arjun: Lubię gotować, także w domu. I często ćwiczę.'
    note: '*घर पर भी* („też w domu”) pokazuje, że Arjun gotuje dla przyjemności, a nie tylko w pracy.'
  hi.a1.unit30.lesson04.teach.priya_tum_ghar:
    title: Priya jest zaskoczona
    gloss: 'Priya: Gotujesz też w domu? Przecież cały dzień gotujesz w pracy!'
    note: '*पूरा दिन* („cały dzień”) podkreśla, ile już gotuje w pracy, a *तो* dodaje emfazy.'
  hi.a1.unit30.lesson04.teach.arjun_han_lekin:
    title: Arjun tłumaczy
    gloss: 'Arjun: Tak, ale gotowanie mnie uspokaja. A ty, co lubisz robić?'
    note: '*खाना बनाने से सुकून मिलता है* znaczy „gotowanie mnie uspokaja” (dosłownie: „od gotowania dostaje się spokój”); *बनाना* zmienia się w *बनाने* przed *से*.'
  hi.a1.unit30.lesson04.teach.priya_mujhe_parhna:
    title: Hobby Priyi
    gloss: 'Priya: Lubię czytać i często słucham muzyki.'
    note: '*और* („i”) łączy dwa hobby, a *सुनती हूँ* jest w rodzaju żeńskim, bo mówi Priya.'
  hi.a1.unit30.lesson04.teach.arjun_kya_tum:
    title: Arjun pyta o gry
    gloss: 'Arjun: Grasz też w gry?'
    note: 'Krótkie pytanie zamknięte: zaczyna się od *क्या*, a *खेलती हो* jest w rodzaju żeńskim, bo Arjun pyta Priyę.'
  hi.a1.unit30.lesson04.teach.priya_naheen_main:
    title: Odpowiedź Priyi
    gloss: 'Priya: Nie, nigdy nie gram w gry. Ale czasami rysuję!'
    note: '*कभी ... नहीं* („nigdy”) i *कभी-कभी* („czasami”) zestawione są w jednej odpowiedzi.'
  hi.a1.unit30.lesson05.teach.arjun_aur_main:
    title: Porównujemy hobby
    gloss: Arjun i ja często spacerujemy razem. Ale mamy też inne hobby. Arjun lubi gotować, także w domu, i często ćwiczy. Ja lubię czytać i często słucham muzyki. Czasami rysuję, ale nigdy nie gram w gry. A ty, co lubisz robić w wolnym czasie?
    note: Wiadomość Priyi powtarza fakty z poprzedniej lekcji i kończy się pytaniem do czytelnika, głównym pytaniem tej jednostki.
    glosses:
      टहलते: spacerować
      अक्सर: często
      साथ: razem
      और: inne
      बनाना: robienie (gotowanie)
      पसंद: chętnie
      घर: w domu
      कसरत: uprawia (sport)
      पढ़ना: czytam
      सुनती: słucham
      संगीत: muzyka
      चित्र: obraz (rysunek)
      कभी-कभी: czasami
      गेम: gram w gry wideo
      कभी: nigdy (z नहीं)
      खाली: wolny
      समय: czas
  hi.a1.unit30.lesson06.teach.arjun_tum_is:
    title: Arjun pyta o weekend
    gloss: 'Arjun: Co robisz w ten weekend?'
    note: W *इस वीकेंड* („w ten weekend”) *इस* stoi przed rzeczownikiem, a *कर रही हो* to forma trwająca „robisz”, w rodzaju żeńskim, bo zwracamy się do Priyi.
  hi.a1.unit30.lesson06.teach.priya_abhee_pata:
    title: Priya jest niezdecydowana
    gloss: 'Priya: Jeszcze nie wiem. Lubię czytać, ale chcę też wyjść na zewnątrz.'
    note: '*बाहर जाना चाहती हूँ* znaczy „chcę wyjść na zewnątrz”; *चाहती* jest w rodzaju żeńskim i stoi po *जाना*.'
  hi.a1.unit30.lesson06.teach.arjun_chalo_sath:
    title: Arjun proponuje plan
    gloss: 'Arjun: Pójdziemy razem na spacer? Potem ugotuję coś dla nas.'
    note: '*उसके बाद* („potem”) ustawia dwa plany w kolejności, a *चलो ... टहलें* proponuje pierwszy z nich.'
  hi.a1.unit30.lesson06.teach.priya_achchha_aidiya:
    title: Priya się zgadza
    gloss: 'Priya: Dobry pomysł! Lubię i spacerować, i gotować.'
    note: '*दोनों पसंद हैं* pokazuje, że Priya lubi jedno i drugie jednakowo, a czasownik jest w liczbie mnogiej *हैं*.'
  hi.a1.unit30.lesson06.teach.arjun_barhiya_to:
    title: Arjun potwierdza
    gloss: 'Arjun: Świetnie. W takim razie do zobaczenia w sobotę!'
    note: '*शनिवार को मिलते हैं* („spotykamy się w sobotę”) używa czasu teraźniejszego dla ustalonego planu, a *को* oznacza dzień.'
