answer_policy:
  number_agreement: This unit's central grammar point is that 'है'/'हैं' after *पसंद* agrees with the NUMBER of the liked thing (not the speaker's or the liked thing's gender) -- e.g. *चाय पसंद है* (tea, singular) vs. *किताबें पसंद हैं* (books, plural). A typed answer using the wrong number's copula for a thing whose number is already fixed by the sentence (e.g. *किताबें* is always plural) should be marked incorrect -- this is the exact point being tested. For open-ended "what do you like" prompts (writing_prompt/speak_response) where the learner picks their own liked thing, accept either singular or plural framing as long as है/हैं internally agrees with whichever noun the learner chose.
  chahiye_vs_pasand: This unit deliberately distinguishes *चाहिए* (unit 6, "want/need", takes no है after it, invariant) from *पसंद है/हैं* (this unit, "like", always requires a है/हैं copula that agrees in number with the liked thing) -- a typed answer that drops the है/हैं after पसंद, or that adds है after चाहिए, should be marked incorrect as a real structural error, not tolerated as a minor typo.
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit's new nasalized words (पसंद, संगीत, and किताबें's plural ending) all use anusvara, verified against a direct codepoint check -- consistent with the already-established हैं/मुझे/तुम्हें convention. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks. For any exercise asking the learner to state their own likes/dislikes/preferences, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: Hindi A1
units:
  hi.a1.unit13.preferences:
    title: Upodobania
lessons:
  hi.a1.unit13.lesson01.pasand_hai:
    title: lubię
  hi.a1.unit13.lesson02.tumhein_kya_pasand:
    title: Co lubisz?
  hi.a1.unit13.lesson03.arjun_priya_pasand:
    title: 'Arjun i Priya: upodobania'
teaching:
  hi.a1.unit13.lesson01.teach.chai_coffee_review:
    title: 'Powtórka: herbata, kawa'
    gloss: herbata, kawa
    note: Krótka powtórka słownictwa z lekcji 6, potrzebnego do mówienia o tym, co się lubi, a czego nie.
    example_gloss:
    - Chcę herbatę.
    - Chcę kawę.
  hi.a1.unit13.lesson01.teach.mujhe_review:
    title: 'Powtórka: mnie / mi'
    gloss: mnie / mi
    note: Zaimek w celowniku, poznany wcześniej i używany w lekcjach 6, 7 i 11 -- tutaj łączy się z nowym orzeczeniem.
    example_gloss: Chcę herbatę.
  hi.a1.unit13.lesson01.teach.pasand:
    title: Upodobanie / lubiany
    gloss: upodobanie / lubiany
    note: Rzeczownik oznaczający „upodobanie” (nie „ulubiony”) -- w połączeniu z podmiotem w celowniku (mujhe/tumhein) i łącznikiem hai/hain tworzy wyrażenie „lubię...”.
    example_gloss: Lubię herbatę.
  hi.a1.unit13.lesson01.teach.pasand_hai_grammar:
    title: Pasand hai = lubię
    gloss: „Pasand hai” znaczy „X mi się podoba”, czyli „lubię X”. Zaczyna się od mujhe/tumhein, tak jak „mujhe...chahiye” (lekcja 6), ale w przeciwieństwie do „chahiye” (po którym nie występuje „hai”) po „pasand” zawsze musi stać „hai” lub „hain”.
    note: Wyraźnie pokazuje różnicę w budowie między chahiye (chcieć/potrzebować) a pasand hai (lubić), żeby obu konstrukcji nie mylić.
  hi.a1.unit13.lesson01.teach.sangeet:
    title: Muzyka
    gloss: muzyka
    note: Nowy rzeczownik do ćwiczenia konstrukcji pasand hai z podmiotem w liczbie pojedynczej, niepoliczalnym.
    example_gloss: Lubię muzykę.
  hi.a1.unit13.lesson01.teach.haan_nahi_review:
    title: 'Powtórka: tak, nie'
    gloss: tak, nie
    note: Krótka powtórka dwóch wczesnych słów, potrzebnych do odpowiadania na pytania o upodobania i do zaprzeczania w tej lekcji.
    example_gloss:
    - Tak, lubię muzykę.
    - Nie, nie lubię kawy.
  hi.a1.unit13.lesson01.teach.pasand_nahi_hai_phrase:
    title: Nie lubię kawy.
    gloss: Nie lubię kawy.
    note: Zaprzeczenie działa dokładnie tak jak w poznanych już zdaniach z hai (np. „yoga class nahin hai” z lekcji 3) -- nahin stoi tuż przed hai.
  hi.a1.unit13.lesson01.teach.kitab_kitaben:
    title: Książka / książki
    gloss: książka / książki
    note: Nowa para rzeczowników, liczba pojedyncza i mnoga, pokazująca, że „hai”/„hain” po pasand zgadza się z liczbą lubianej rzeczy.
    example_gloss:
    - Lubię tę książkę.
    - Lubię książki.
  hi.a1.unit13.lesson01.teach.number_agreement_grammar:
    title: Hai czy hain po pasand
    gloss: '„Hai” lub „hain” po „pasand” zgadza się z LICZBĄ lubianej rzeczy -- dokładnie jak w „mere paas...hai/hain” (lekcja 2): herbata/muzyka pasand hai (liczba pojedyncza), książki pasand hain (liczba mnoga).'
    note: Bezpośrednio rozszerza poznaną w lekcji 2 regułę zgodności hai/hain co do liczby na nowy kontekst, zamiast wprowadzać nowe zagadnienie gramatyczne.
  hi.a1.unit13.lesson02.teach.tumhein_review:
    title: 'Powtórka: tobie (nieformalnie)'
    gloss: tobie (nieformalnie)
    note: Po raz pierwszy pojawił się w lekcji 6 z chahiye („tumhein...chahiye?”) -- tutaj ten sam zaimek w celowniku łączy się z pasand hai.
    example_gloss: Lubisz muzykę?
  hi.a1.unit13.lesson02.teach.kya_tumhein_pasand_hai_grammar:
    title: Kya tumhein...pasand hai?
    gloss: „Kya” na początku pytania oznacza pytanie rozstrzygnięcia tak/nie (lekcja 1); „tumhein” powtarza ten sam schemat z podmiotem w celowniku, który był w „tumhein...chahiye?” (lekcja 6) -- tutaj „pasand hai” zajmuje miejsce „chahiye”.
    note: Potwierdza, że to ponowne użycie znanego już schematu pytania, a nie nowe zagadnienie gramatyczne.
  hi.a1.unit13.lesson02.teach.khel:
    title: Sport / gra
    gloss: sport / gra
    note: Nowy rzeczownik. W przykładach stoi z „yah” (ten), żeby zgodność liczby była jednoznaczna, bo „khel” sam nie zmienia formy w liczbie pojedynczej i mnogiej.
    example_gloss: Lubię ten sport.
  hi.a1.unit13.lesson02.teach.yah_review:
    title: 'Powtórka: ten / to'
    gloss: ten / to
    note: Po raz pierwszy pojawiło się w lekcji 7 („mujhe yah chahiye”) -- tutaj użyte, by odniesienie do „khel” w liczbie pojedynczej było jednoznaczne.
    example_gloss: Ta książka jest dobra.
  hi.a1.unit13.lesson02.teach.ya_review:
    title: 'Powtórka: lub / albo'
    gloss: lub / albo
    note: Poznane w jednostce 6/7 przy zamawianiu jedzenia i towarów – tutaj użyte do zadania pytania o wybór między dwiema rzeczami, które się lubi.
    example_gloss: Herbata czy kawa?
  hi.a1.unit13.lesson02.teach.chai_ya_coffee_phrase:
    title: Wolisz herbatę czy kawę?
    gloss: Lubisz herbatę czy kawę?
    note: Łączy schemat pytania z „tumhein” z poznanym już „ya” (albo), aby poprosić rozmówcę o dokonanie wyboru.
  hi.a1.unit13.lesson02.teach.zyada:
    title: Bardziej
    gloss: bardziej
    note: Nowe słowo stawiane tuż przed „pasand hai”, by wyrazić preferencję między dwiema wymienionymi rzeczami.
    example_gloss: Bardziej lubię herbatę.
  hi.a1.unit13.lesson02.teach.zyada_pasand_grammar:
    title: Zyada pasand hai = woleć
    gloss: „X zyada pasand hai” oznacza przedkładanie jednej z dwóch rzeczy nad drugą – „mujhe chai zyada pasand hai” znaczy „bardziej lubię herbatę” / „wolę herbatę”.
    note: To rozszerzenie słownictwa, a nie nowa gramatyka – „zyada” po prostu określa poznane już „pasand hai”.
    target_text: '''X ज़्यादा पसंद है'' का मतलब है दो चीज़ों में से एक को तरजीह देना (woleć) -- ''मुझे चाय ज़्यादा पसंद है'' का मतलब है ''bardziej lubię herbatę'' / ''wolę herbatę''।'
  hi.a1.unit13.lesson03.teach.review_words:
    title: 'Powtórka: muzyka, sport, książki'
    gloss: muzyka, sport/gra, książki
    note: Krótka powtórka najważniejszych rzeczowników tej jednostki, potrzebnych do dialogu i notatki do czytania.
    example_gloss:
    - Lubię muzykę.
    - Nie lubię tego sportu.
    - Lubię książki.
  hi.a1.unit13.lesson03.teach.dialogue.line01:
    title: Arjun pyta o muzykę
    gloss: Priya, lubisz muzykę?
  hi.a1.unit13.lesson03.teach.dialogue.line02:
    title: Priya mówi, że bardzo ją lubi
    gloss: Tak, bardzo lubię muzykę. A ty?
  hi.a1.unit13.lesson03.teach.dialogue.line03:
    title: Arjun się zgadza i dodaje sport
    gloss: Ja też! I lubię też sport.
  hi.a1.unit13.lesson03.teach.dialogue.line04:
    title: Priya woli książki od tej gry
    gloss: Aha! Nie lubię tej gry. Lubię książki.
  hi.a1.unit13.lesson03.teach.dialogue.line05:
    title: 'Arjun pyta: herbata czy kawa'
    gloss: Dobrze. Lubisz herbatę czy kawę?
  hi.a1.unit13.lesson03.teach.dialogue.line06:
    title: Priya woli herbatę
    gloss: Bardziej lubię herbatę.
  hi.a1.unit13.lesson03.teach.dialogue.line07:
    title: Arjun się zgadza
    gloss: Świetnie! Ja też lubię herbatę.
  hi.a1.unit13.lesson03.teach.dialogue.line08:
    title: Priya kończy rozmowę
    gloss: Dobrze! Spotkamy się znowu jutro?
  hi.a1.unit13.lesson03.teach.chahiye_pasand_zyada_grammar:
    title: Trzy powiązane wzorce
    gloss: 'Trzy wzorce tej jednostki: po „chahiye” (chcieć/potrzebować, jednostka 6) nie występuje „hai”; „pasand hai/hain” (ta jednostka) zmienia się w zależności od liczby rzeczy; „zyada pasand hai” oznacza przedkładanie jednej z dwóch rzeczy nad drugą.'
    note: Podsumowanie zamykające całą gramatykę jednostki, podobnie jak notatka gramatyczna w jednostce 12, która łączyła cały paradygmat.
    target_text: 'इस यूनिट के तीन तरीके: ''चाहिए'' (चाहना/ज़रूरत, यूनिट 6) के बाद ''है'' नहीं आता; ''पसंद है/हैं'' (यह यूनिट) चीज़ की संख्या से बदलता है; ''ज़्यादा पसंद है'' का मतलब है दो में से एक को तरजीह देना (woleć)।'
  hi.a1.unit13.lesson03.teach.priya_note:
    title: Notatka od Priyi
    gloss: Arjun, bardzo lubię muzykę. Lubię też książki. Nie lubię tej gry. Bardziej lubię herbatę. – Priya
    note: Krótka notatka powtarzająca dokładnie te fakty, które ustalono już w dialogu, bez nowych informacji.
    glosses:
      संगीत: muzyka
      बहुत: bardzo
      पसंद: lubiany / podobający się
      किताबें: książki
      खेल: gra
      नहीं: nie
      चाय: herbata
      ज़्यादा: bardziej / raczej
