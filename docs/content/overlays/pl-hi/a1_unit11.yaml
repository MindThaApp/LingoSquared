teaching:
  hi.a1.unit11.lesson01.teach.review_chai_kaafi:
    title: 'Powtórka: herbata, kawa'
    gloss: herbata, kawa
    note: Krótka powtórka słów o napojach z lekcji 6. W tej lekcji użyjesz ich, żeby proponować plany.
    example_gloss:
    - Chcę herbatę.
    - Chcę kawę.
  hi.a1.unit11.lesson01.teach.filma:
    title: Film
    gloss: film
    note: Nowy rzeczownik do tematu planowania spotkań w tej lekcji.
    example_gloss: Ten film jest dobry.
  hi.a1.unit11.lesson01.teach.dekhna:
    title: Oglądamy / obejrzyjmy
    gloss: (my) oglądamy / obejrzyjmy
    note: Forma liczby mnogiej czasu teraźniejszego zwyczajowego od 'dekhna' (oglądać), użyta tu do zaproponowania wspólnego zajęcia.
    example_gloss: Oglądamy film.
  hi.a1.unit11.lesson01.teach.chalo_film_phrase:
    title: Obejrzyjmy film!
    gloss: Obejrzyjmy film!
    note: '''Chalo'' + czasownik w formie liczby mnogiej to codzienny sposób proponowania wspólnego działania. Pojawiał się już mimochodem w lekcjach 1, 6 i 7 (''chalo shuru karte hain'', ''chalo, kuch khaate hain'', ''chalo, kuch khareedte hain''); ta lekcja porządkuje i rozszerza ten wzorzec.'
  hi.a1.unit11.lesson01.teach.saath:
    title: Razem
    gloss: razem
    note: Służy do proponowania wspólnego zajęcia.
    example_gloss: Obejrzyjmy film razem!
  hi.a1.unit11.lesson01.teach.peena:
    title: Pijemy / wypijmy
    gloss: (my) pijemy / wypijmy
    note: Forma liczby mnogiej czasu teraźniejszego zwyczajowego od 'peena' (pić), ten sam wzorzec co 'dekhte hain'.
    example_gloss: Pijemy herbatę.
  hi.a1.unit11.lesson01.teach.chalo_chai_phrase:
    title: Wypijmy razem herbatę!
    gloss: Wypijmy razem herbatę!
    note: Łączy 'saath' i 'peete hain' z tej lekcji w drugą propozycję, według tego samego wzorca z 'chalo' co propozycja filmu.
  hi.a1.unit11.lesson01.teach.chalo_grammar_note:
    title: Chalo + czasownik-te + hain = Zróbmy ___
    gloss: 'Aby zaproponować wspólne zrobienie czegoś, powiedz ''chalo'' + czasownik-te + hain: Obejrzyjmy film! Wypijmy razem herbatę!'
    note: Podaje cały wzorzec wprost i porządkuje to, co pojawiło się już mimochodem trzy razy we wcześniejszych lekcjach.
  hi.a1.unit11.lesson01.teach.achha_vichar:
    title: Dobry pomysł!
    gloss: Dobry pomysł!
    note: Gotowy sposób, by z entuzjazmem przyjąć propozycję.
  hi.a1.unit11.lesson02.teach.vyast:
    title: Zajęty
    gloss: zajęty
    note: Nowy przymiotnik, używany ze znanym już łącznikiem (hoon/ho/hai), by powiedzieć, że nie masz czasu.
    example_gloss: Jestem dziś zajęty.
  hi.a1.unit11.lesson02.teach.maaf_karna:
    title: Przepraszam / wybacz
    gloss: przepraszam / wybacz
    note: Stałe grzecznościowe wyrażenie łagodzące odmowę.
    example_gloss: Przepraszam, jestem zajęty.
  hi.a1.unit11.lesson02.teach.maaf_vyast_phrase:
    title: Przepraszam, jestem zajęty.
    gloss: Przepraszam, jestem zajęty.
    note: Podstawowe zdanie odmowy, łączące dwa nowe wyrażenia z tej lekcji.
  hi.a1.unit11.lesson02.teach.mujhe_kaam_hai:
    title: Mam pracę.
    gloss: Mam pracę.
    note: Wykorzystuje wzorzec 'mujhe...hai' (mam...), podobny do poznanego wcześniej 'mujhe...chahiye' (chcę/potrzebuję); tu podaje powód odmowy.
  hi.a1.unit11.lesson02.teach.decline_grammar_note:
    title: Jak grzecznie odmówić
    gloss: Aby grzecznie odmówić, powiedz 'maaf karna' (przepraszam), a potem opisz swoją sytuację (np. 'jestem zajęty') lub podaj powód (np. 'mam pracę').
    note: Celowo korzysta z poznanej już gramatyki (łącznik i konstrukcja dopełnienia z posiadaniem), zamiast wprowadzać nową konstrukcję z „móc”.
  hi.a1.unit11.lesson02.teach.hum_pronoun:
    title: My
    gloss: my
    note: 'Pierwszy formalnie wprowadzony w kursie zaimek 1. osoby liczby mnogiej. Jego forma czasu zwyczajowego (-te + hain) jest taka sama jak dla ve (oni) – nie ma nowej koniugacji, tylko nowy zaimek. (Tum też ma -te, ale z ''ho'': tum milte ho.)'
    example_gloss: Spotykamy się codziennie.
  hi.a1.unit11.lesson02.teach.kab_milte_phrase:
    title: Kiedy się spotykamy?
    gloss: Kiedy się spotykamy?
    note: Łączy 'hum' z 'kab' (lekcja 10) i 'milte hain' (używanym od zakończeń w lekcji 1, gdzie podmiot zwykle był pomijany).
  hi.a1.unit11.lesson02.teach.din_review:
    title: 'Powtórka: sobota, niedziela'
    gloss: sobota, niedziela
    note: Krótka powtórka dwóch nazw dni tygodnia z lekcji 3, potrzebnych do umawiania się.
    example_gloss:
    - Dzisiaj jest sobota.
    - Jutro jest niedziela.
  hi.a1.unit11.lesson02.teach.samay_review:
    title: 'Powtórka: czwarta, o której godzinie'
    gloss: o czwartej, o której godzinie
    note: Krótka powtórka wyrażeń czasu z lekcji 4, potrzebnych do umawiania się.
    example_gloss:
    - Jest teraz czwarta.
    - Która jest teraz godzina?
  hi.a1.unit11.lesson02.teach.kya_ravivar_thik_phrase:
    title: Czy niedziela pasuje?
    gloss: Czy niedziela pasuje?
    note: Używa 'kya' jako znacznika pytania typu tak/nie, znanego od lekcji 1 ('kya yeh tumhari pahli baar hai?', 'kya tum yoga karti ho?'), a nie nowego pytajnika „który dzień”.
  hi.a1.unit11.lesson03.teach.sandesh:
    title: Wiadomość
    gloss: wiadomość
    note: Nowy rzeczownik, użyty w części lekcji o pisemnym zaproszeniu.
    example_gloss: To wiadomość od Arjuna.
  hi.a1.unit11.lesson03.teach.dialogue.line01:
    title: Arjun proponuje film w sobotę
    gloss: Priyo, obejrzyjmy w sobotę film?
  hi.a1.unit11.lesson03.teach.dialogue.line02:
    title: Priya odmawia, podając powód
    gloss: Przepraszam, w sobotę jestem zajęta. Mam pracę.
  hi.a1.unit11.lesson03.teach.dialogue.line03:
    title: Arjun pyta, kiedy mogą się spotkać
    gloss: Dobrze. Kiedy się spotykamy?
  hi.a1.unit11.lesson03.teach.dialogue.line04:
    title: Priya proponuje niedzielę
    gloss: Czy niedziela pasuje? Wypijmy razem herbatę!
  hi.a1.unit11.lesson03.teach.dialogue.line05:
    title: Arjun się zgadza i pyta o godzinę
    gloss: Dobry pomysł! O której w niedzielę?
  hi.a1.unit11.lesson03.teach.dialogue.line06:
    title: Priya proponuje godzinę
    gloss: Czy czwarta pasuje?
  hi.a1.unit11.lesson03.teach.dialogue.line07:
    title: Arjun potwierdza
    gloss: Tak, czwarta pasuje. Do zobaczenia!
  hi.a1.unit11.lesson03.teach.dialogue.line08:
    title: Priya kończy rozmowę
    gloss: Dobrze, do zobaczenia w niedzielę!
  hi.a1.unit11.lesson03.teach.invitation_message:
    title: Wiadomość od Priyi
    gloss: Cześć Arjun, spotkajmy się w niedzielę o czwartej i wypijmy herbatę. Dobrze? – Priya
    note: Krótkie pisemne zaproszenie, powtarzające plan potwierdzony w dialogu.
    glosses:
      चलो: chodźmy / zróbmy
      रविवार: niedziela
      मिलते: spotykać się (od मिलना)
      चाय: herbata
      पीते: pić (od पीना)
      ठीक: dobrze / w porządku
