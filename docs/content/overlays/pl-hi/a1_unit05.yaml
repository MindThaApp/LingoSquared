    title: Rodzina
lessons:
  hi.a1.unit05.lesson01.mera_parivar:
    title: Moja rodzina
  hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani:
    title: Dziadkowie
  hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar:
    title: Rodziny Priyi i Arjuna
teaching:
  hi.a1.unit05.lesson01.teach.parivar:
    title: Rodzina
    gloss: rodzina
    note: Ogólne słowo na rodzinę, używane w całej tej lekcji.
    example_gloss: Moja rodzina jest w Indiach.
  hi.a1.unit05.lesson01.teach.pita_maa:
    title: Ojciec, matka
    gloss: ojciec, matka
    note: Przy przedstawianiu obojga używa się pełnej szacunku formy liczby mnogiej *hain* zamiast *hai*, a przy *pita* mówi się *mere* zamiast *mera* – zob. uwagę o formach grzecznościowych w dalszej części lekcji.
    example_gloss:
    - To jest mój ojciec.
    - To jest moja matka.
  hi.a1.unit05.lesson01.teach.bhai_behan:
    title: Brat, siostra
    gloss: brat, siostra
    note: 'Główna para tej lekcji do porównania zgodności mera/meri: *mera bhai*, *meri behan*.'
    example_gloss:
    - Mam brata.
    - Mam siostrę.
  hi.a1.unit05.lesson01.teach.ek_as_article:
    title: Ek jako „jakiś/jeden”
    gloss: '*Ek* znaczy „jeden” przy liczeniu, a także może oznaczać „jakiś, pewien”: *mera ek bhai hai*.'
    note: To samo słowo, które już poznałeś jako liczebnik 1 – w hindi nie ma osobnego rodzajnika nieokreślonego.
  hi.a1.unit05.lesson01.teach.mata_pita:
    title: Rodzice
    gloss: rodzice
    note: Złożenie *mata* (matka, formalnie) i *pita* (ojciec) – standardowe słowo oznaczające „rodziców”.
    example_gloss: Moi rodzice mieszkają w Delhi.
  hi.a1.unit05.lesson01.teach.mera_meri_note:
    title: Mera czy meri
    gloss: '*Mera* łączy się z wyrazami rodzaju męskiego, *meri* z wyrazami rodzaju żeńskiego: *mera bhai*, *meri behan*.'
    note: Najważniejsza zasada gramatyczna tej lekcji – zaimek dzierżawczy zgadza się z posiadaną osobą lub rzeczą, a nie z mówiącym.
  hi.a1.unit05.lesson01.teach.mere_honorific_note:
    title: Mere dla szanowanych starszych
    gloss: 'Z szacunku dla starszych *mera* zmienia się w *mere*, a *hai* w *hain*, nawet gdy mowa o jednej osobie: *yeh mere pita hain* (To jest mój ojciec).'
    note: To prawdziwa, utrwalona konwencja, a nie błąd – szanowani starsi członkowie rodziny w liczbie pojedynczej (ojciec, dziadek) mają tę formę, która wygląda jak liczba mnoga. Matka i babcia zachowują *meri*, ale czasownik z tego samego powodu też idzie w liczbę mnogą (*hain*).
  hi.a1.unit05.lesson01.teach.yah_mera_bhai_hai:
    title: To jest mój brat
    gloss: To jest mój brat.
    note: Prosta forma rodzaju męskiego – w przypadku brata nie jest potrzebna forma grzecznościowa.
  hi.a1.unit05.lesson01.teach.yah_meri_behan_hai:
    title: To jest moja siostra
    gloss: To jest moja siostra.
    note: Prosta forma rodzaju żeńskiego, zgodna z *behan*.
  hi.a1.unit05.lesson01.teach.yah_kaun_hai:
    title: Kto to jest?
    gloss: Kto to jest?
    note: Proste i przydatne pytanie przy przedstawianiu członków rodziny.
  hi.a1.unit05.lesson02.teach.dada_dadi:
    title: Dziadek i babcia od strony ojca
    gloss: dziadek od strony ojca, babcia od strony ojca
    note: Dokładnie rodzice twojego ojca – zob. uwagę w dalszej części lekcji, porównującą ich z rodzicami twojej matki.
    example_gloss:
    - Mój dziadek mieszka w Delhi.
    - Moja babcia mieszka w Delhi.
  hi.a1.unit05.lesson02.teach.nana_nani:
    title: Dziadek i babcia od strony matki
    gloss: dziadek od strony matki, babcia od strony matki
    note: Rodzice twojej matki – w hindi to zupełnie inna para słów niż dla rodziców ojca.
    example_gloss:
    - Mój dziadek (ze strony matki) mieszka w Bombaju.
    - Moja babcia (ze strony matki) mieszka w Bombaju.
  hi.a1.unit05.lesson02.teach.dilli_mumbai:
    title: Delhi, Bombaj
    gloss: Delhi, Bombaj
    note: Dwa duże indyjskie miasta, używane w przykładach tej lekcji do pokazania, gdzie mieszkają członkowie rodziny.
    example_gloss:
    - Moja rodzina mieszka w Delhi.
    - Mój brat mieszka w Bombaju.
  hi.a1.unit05.lesson02.teach.dada_nana_note:
    title: Dwie pary dziadków
    gloss: 'Rodzice ojca: *dada-dadi*. Rodzice matki: *nana-nani*.'
    note: W polskim jest jedno słowo „dziadek” i jedno „babcia” bez względu na stronę rodziny, a hindi ma zupełnie osobne słowa w zależności od tego, czy chodzi o stronę ojca, czy matki.
  hi.a1.unit05.lesson02.teach.rehna_verb:
    title: Mieszka (rehna)
    gloss: mieszka (rodzaj męski / żeński / forma grzecznościowa-mnoga)
    note: Czasownik „mieszkać” – *rehta hai* o mężczyźnie, *rehti hai* o kobiecie, *rehte hain* o więcej niż jednej osobie lub o szanowanym starszym.
    example_gloss:
    - Mój brat mieszka w Delhi.
    - Moja siostra mieszka w Bombaju.
    - Moi dziadkowie mieszkają w Delhi.
  hi.a1.unit05.lesson02.teach.tumhara_tumhari:
    title: Twój (nieformalnie)
    gloss: twój (nieformalnie, rodzaj męski / żeński)
    note: Nieformalny zaimek dzierżawczy do *tum*, zgadzający się z posiadanym rzeczownikiem tak samo jak *mera/meri*.
    example_gloss:
    - Gdzie mieszka twój brat?
    - Gdzie mieszka twoja siostra?
  hi.a1.unit05.lesson02.teach.mera_tumhara_note:
    title: Mera i tumhara razem
    gloss: '*Mera* i *tumhara* łączą się z wyrazami rodzaju męskiego; *meri* i *tumhari* z wyrazami rodzaju żeńskiego: *mera bhai*/*tumhara bhai*, *meri behan*/*tumhari behan*.'
    note: Ta sama zasada zgodności z pierwszej lekcji, teraz widoczna także przy *tumhara*.
  hi.a1.unit05.lesson03.teach.bada_badi:
    title: Starszy / duży
    gloss: starszy, duży (rodzaj męski / żeński)
    note: Starsze rodzeństwo w hindi oznacza się przymiotnikiem zgadzającym się w rodzaju, a nie osobnym słowem; po polsku mówimy „starszy brat”, a tu użyje się tego samego przymiotnika, który znaczy też „duży”.
    example_gloss:
    - Mój starszy brat mieszka w Delhi.
    - Moja starsza siostra mieszka w Bombaju.
  hi.a1.unit05.lesson03.teach.chota_choti:
    title: Młodszy / mały
    gloss: młodszy, mały (rodzaj męski / żeński)
    note: Odpowiednik *bada/badi*, używany o młodszym rodzeństwie.
    example_gloss:
    - Mój młodszy brat jest teraz uczniem.
    - Moja młodsza siostra jest teraz uczennicą.
  hi.a1.unit05.lesson03.teach.bada_chota_note:
    title: Zgodność bada/chota
    gloss: '*Bada* i *chota* łączą się z wyrazami rodzaju męskiego, *badi* i *choti* z wyrazami rodzaju żeńskiego: *bada bhai*, *badi behan*.'
    note: Ta sama zgodność przymiotnika w rodzaju męskim i żeńskim, którą widzieliśmy przy *mera/meri*, tu zastosowana do słów opisujących wiek.
  hi.a1.unit05.lesson03.teach.aur_lekin_bhi:
    title: I, ale, też
    gloss: i, ale, też
    note: Trzy podstawowe spójniki, które wracają w końcowym dialogu tej lekcji.
    example_gloss:
    - Mój brat i moja siostra mieszkają w Delhi.
    - Mój brat mieszka w Delhi, ale moja siostra mieszka w Bombaju.
    - Ja też mam siostrę.
  hi.a1.unit05.lesson03.teach.accha_phir_milenge:
    title: Dobrze, do zobaczenia
    gloss: No dobrze! Do zobaczenia.
    note: Przyjazne pożegnanie, znane już ze słownictwa pożegnań z lekcji 2.
  hi.a1.unit05.lesson03.teach.theek_hai_phir_milte_hain:
    title: W porządku, do zobaczenia wkrótce
    gloss: W porządku, do zobaczenia wkrótce!
    note: Nieformalna odpowiedź na powyższe pożegnanie, podobna do pożegnalnych wymian z wcześniejszych lekcji.
  hi.a1.unit05.lesson03.teach.dialogue.line01:
    title: Arjun pyta o rodzinę Priyi
    gloss: Arjun pyta, gdzie mieszka rodzina Priyi.
    note: 'Wraca wzorzec z tej lekcji: *parivar kahan rehta hai*.'
  hi.a1.unit05.lesson03.teach.dialogue.line02:
    title: Priya opowiada o rodzicach i bracie
    gloss: Priya mówi, że jej rodzice mieszkają w Delhi i że ma też starszego brata.
    note: Łączy *mata-pita*, *rehte hain* i *bada bhai bhi hai*.
  hi.a1.unit05.lesson03.teach.dialogue.line03:
    title: Arjun pyta o jej dziadków
    gloss: 'Arjun mówi „aha” i pyta: a twoi dziadkowie?'
    note: '*Tumhare* to forma grzecznościowa od *tumhara*, używana, gdy mowa o starszych członkach rodziny, tak jak *mere* od *mera* (uwaga o formach grzecznościowych z lekcji 1).'
  hi.a1.unit05.lesson03.teach.dialogue.line04:
    title: Priya opowiada o obu parach dziadków
    gloss: Priya mówi, że dziadkowie ze strony ojca mieszkają w Delhi, ale dziadkowie ze strony matki mieszkają w Bombaju.
    note: '*Lekin* zestawia miasta, w których mieszkają obie pary dziadków, i utrwala różnicę między dada-dadi a nana-nani z lekcji 2.'
  hi.a1.unit05.lesson03.teach.dialogue.line05:
    title: Arjun wspomina o własnej siostrze
    gloss: Arjun mówi, że on też ma młodszą siostrę.
    note: Wracają słowa *bhi* i *choti behan*.
  hi.a1.unit05.lesson03.teach.dialogue.line06:
    title: Priya kończy rozmowę
    gloss: 'Priya mówi: dobrze, do zobaczenia.'
    note: Wraca pożegnalna fraza z tej lekcji.
  hi.a1.unit05.lesson03.teach.dialogue.line07:
    title: Arjun odpowiada
    gloss: 'Arjun się zgadza i mówi: do zobaczenia wkrótce.'
    note: Wraca fraza odpowiedzi z tej lekcji.
