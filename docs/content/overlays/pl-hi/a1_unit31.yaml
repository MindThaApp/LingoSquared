answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (हूँ, हाँ, कहाँ vs. मैं, हैं, में, मिलेंगे). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (हूं for हूँ, हां for हाँ) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
  description: 'Hindi dla początkujących: opisywanie podstawowego wyglądu osoby – wzrost i wrażenie wieku, kolor włosów i oczu, kluczowe pytanie *कैसा दिखता है?* oraz porównywanie wyglądu dwóch osób.'
units:
  hi.a1.unit31.appearance:
    title: Opisywanie wyglądu
lessons:
  hi.a1.unit31.lesson01.lanba_chhota_boorha_aur:
    title: Wysoki, niski, stary i młody
  hi.a1.unit31.lesson02.balon_ke_bare_men:
    title: Opisywanie włosów
  hi.a1.unit31.lesson03.ankhen_aur_vah_kaisa:
    title: Oczy i jak ktoś wygląda?
  hi.a1.unit31.lesson04.priya_neena_ka_huliya:
    title: Priya opisuje Ninę
  hi.a1.unit31.lesson05.vikram_aur_neha_kee:
    title: Porównanie Vikrama i Nehy
  hi.a1.unit31.lesson06.arjun_neena_ko_pahchanta:
    title: Arjun rozpoznaje Ninę
teaching:
  hi.a1.unit31.lesson01.teach.lanba_chhota:
    title: Wysoki i niski
    gloss: wysoki / niski
    note: '*लंबा* i *छोटा* opisują wzrost i zwykle występują ze słowem *कद* („wzrost”): *नेहा का कद लंबा है*. Przy rzeczowniku rodzaju męskiego kończą się na *-ा*, a przy żeńskim na *-ी*.'
    example_gloss:
    - Neha jest wysoka.
    - Vikram jest niski.
  hi.a1.unit31.lesson01.teach.boorha_javan:
    title: Stary i młody
    gloss: stary / młody
    note: '*बूढ़ा* i *जवान* opisują, na ile lat ktoś wygląda, bez podawania liczby.'
    example_gloss:
    - Dziadek jest stary.
    - Arjun jest młody.
  hi.a1.unit31.lesson01.teach.tumharee_umr_kitnee:
    title: उम्र i बूढ़ा
    gloss: Ile masz lat? Dziadek jest stary.
    note: Aby zapytać o dokładny wiek, w hindi używa się słowa *उम्र* („wiek”), a *बूढ़ा* opisuje starszą osobę bez podawania liczby.
  hi.a1.unit31.lesson01.teach.neha_ka_kad:
    title: Neha jest wysoka, a Vikram niski
    gloss: Neha jest wysoka, a Vikram jest niski.
    note: '*और* („i”) łączy dwa opisy, a każde *का कद* zgadza się z rzeczownikiem rodzaju męskiego *कद*.'
  hi.a1.unit31.lesson02.teach.bal:
    title: Włosy
    gloss: włosy
    note: '*बाल* („włosy”) w hindi to rzeczownik rodzaju męskiego w liczbie mnogiej, więc opisujące go słowa kończą się na *-े*: *लंबे बाल*.'
    example_gloss: Arjun ma krótkie czarne włosy.
  hi.a1.unit31.lesson02.teach.sunahre_bhoore_safed:
    title: Blond, brązowe i białe
    gloss: blond / brązowy / biały
    note: 'Trzy kolory włosów: *सुनहरे*, *भूरे* i *सफ़ेद*; przed *बाल* kończą się na *-े*.'
    example_gloss:
    - Priya ma blond włosy.
    - Vikram ma brązowe włosy.
    - Dziadek ma białe włosy.
  hi.a1.unit31.lesson02.teach.lanbe_chhote:
    title: Długie i krótkie (włosy)
    gloss: długi / krótki (o włosach)
    note: '*लंबे* („długie”) i *छोटे* („krótkie”) opisują włosy i kończą się na *-े*, ponieważ *बाल* jest w liczbie mnogiej.'
    example_gloss:
    - Neha ma długie włosy.
    - Vikram ma krótkie włosy.
  hi.a1.unit31.lesson02.teach.lanbe_bal_chhote:
    title: Przymiotniki przed बाल
    gloss: Długie włosy, krótkie włosy, złociste włosy, brązowe włosy, białe włosy, czarne włosy.
    note: '*बाल* to rzeczownik rodzaju męskiego w liczbie mnogiej, więc przymiotnik przed nim kończy się na *-े*: *लंबे बाल*, *भूरे बाल*.'
  hi.a1.unit31.lesson02.teach.uske_bal_lanbe:
    title: 'उसके: jego lub jej'
    gloss: Jego lub jej włosy są długie.
    note: '*उसके* znaczy zarówno „jego”, jak i „jej”, więc tylko kontekst mówi, o kogo chodzi; tutaj zgadza się z rzeczownikiem w liczbie mnogiej *बाल*.'
  hi.a1.unit31.lesson02.teach.arjun_ke_bal:
    title: Arjun ma krótkie czarne włosy
    gloss: Arjun ma krótkie czarne włosy.
    note: '*काले* pojawia się ponownie, tym razem przy włosach, i kończy się na *-े*, ponieważ *बाल* jest w liczbie mnogiej.'
  hi.a1.unit31.lesson02.teach.priya_ke_bal:
    title: Priya ma długie blond włosy
    gloss: Priya ma długie blond włosy.
    note: Łączy słownictwo tej lekcji o długości i kolorze w jednym naturalnym zdaniu.
  hi.a1.unit31.lesson03.teach.ankhen:
    title: Oczy
    gloss: oczy
    note: '*आँखें* („oczy”) to rzeczownik rodzaju żeńskiego w liczbie mnogiej; liczba pojedyncza to *आँख*.'
    example_gloss: Arjun ma brązowe oczy.
  hi.a1.unit31.lesson03.teach.neela_bhoora_hara:
    title: Niebieski, brązowy i zielony
    gloss: niebieski / brązowy / zielony
    note: 'Trzy kolory oczu: *नीला*, *भूरा* i *हरा*; przed rzeczownikiem żeńskim *आँखें* zmieniają się w *नीली*, *भूरी* i *हरी*.'
    example_gloss:
    - Priya ma niebieskie oczy.
    - Vikram ma brązowe oczy.
    - Neha ma zielone oczy.
  hi.a1.unit31.lesson03.teach.neelee_ankhen_bhooree:
    title: Przymiotniki przed आँखें
    gloss: Niebieskie oczy, brązowe oczy, zielone oczy.
    note: '*आँखें* jest rodzaju żeńskiego, więc przymiotnik przed nim kończy się na *-ी*: *नीली आँखें*.'
  hi.a1.unit31.lesson03.teach.priya_kaisee_dikhtee:
    title: Jak wygląda Priya?
    gloss: Jak wygląda Priya?
    note: '*कैसी दिखती है?* („jak ona wygląda?”) to kluczowe pytanie: *कैसी* i *दिखती* są w rodzaju żeńskim, gdy mowa o kobiecie, a *कैसा* i *दिखता* w rodzaju męskim, gdy mowa o mężczyźnie.'
  hi.a1.unit31.lesson03.teach.priya_ke_bal:
    title: Priya ma długie blond włosy i niebieskie oczy
    gloss: Priya ma długie blond włosy i niebieskie oczy.
    note: 'Wzorcowa odpowiedź: włosy i oczy połączone słowem *और*. Właściciel przyjmuje *के* przy *बाल* (liczba mnoga) i *की* przy *आँखें* (rodzaj żeński).'
  hi.a1.unit31.lesson04.teach.priya_bhasha_kaife:
    title: Priya przedstawia Ninę
    gloss: 'Priya: Do kawiarni językowej przychodzi nowa dziewczyna. Ma na imię Nina.'
    note: '*आ रही है* („przychodzi”) wprowadza kogoś nowego, a *उसका नाम ... है* podaje imię.'
  hi.a1.unit31.lesson04.teach.arjun_oke_vah:
    title: Arjun pyta, jak ona wygląda
    gloss: 'Arjun: Okej! Jak ona wygląda?'
    note: '*वह देखने में कैसी है?* pyta, jak ktoś wygląda; *वह* znaczy zarówno „on”, jak i „ona”.'
  hi.a1.unit31.lesson04.teach.priya_uska_kad:
    title: Priya opisuje wzrost i włosy Niny
    gloss: 'Priya: Jest niska i ma krótkie blond włosy.'
    note: 'To zdanie łączy wzrost i włosy: *उसका कद छोटा है और उसके बाल छोटे और सुनहरे हैं*.'
  hi.a1.unit31.lesson04.teach.arjun_aur_uskee:
    title: Arjun pyta o jej oczy
    gloss: 'Arjun: A jej oczy?'
    note: '*उसकी आँखें* znaczy „jej oczy”; *उसकी* jest w rodzaju żeńskim, bo zgadza się z *आँखें*.'
  hi.a1.unit31.lesson04.teach.priya_uskee_ankhen:
    title: Priya opisuje oczy Niny
    gloss: 'Priya: Ma zielone oczy.'
    note: '*हरी* kończy się na *-ी*, ponieważ *आँखें* jest rodzaju żeńskiego.'
  hi.a1.unit31.lesson04.teach.arjun_shukriya_tab:
    title: Arjun ją rozpozna
    gloss: 'Arjun: Dzięki! Wtedy ją rozpoznam.'
    note: '*पहचान लूँगा* („rozpoznam”) to czas przyszły od *पहचानना*, a *उसे* znaczy „ją”.'
  hi.a1.unit31.lesson05.teach.vikram_aur_neha:
    title: Porównanie Vikrama i Nehy
    gloss: Vikram i Neha są rodzeństwem, ale wyglądają inaczej. Vikram jest niski, ma krótkie brązowe włosy i brązowe oczy. Neha jest wyższa od Vikrama, ma długie brązowe włosy i zielone oczy. A ty, jak wyglądasz?
    note: Krótkie porównanie, w którym wracają wszystkie poznane dotąd słowa określające kolor i długość. Tekst kończy się pytaniem kluczowym dla tej lekcji, skierowanym do czytelnika.
    glosses:
      भाई: brat
      बहन: siostra
      दिखते: wyglądać
      अलग: różnie
      छोटा: niski
      छोटे: niski
      भूरे: brązowy
      बाल: włosy
      भूरी: brązowy
      आँखें: oczy
      लंबी: wyższy
      लंबे: długi
      हरी: zielony
      कैसे: jak (np. „jak wyglądasz”)
  hi.a1.unit31.lesson05.teach.vikram_neha_se:
    title: Porównywanie za pomocą से
    gloss: Vikram jest niższy od Nehy.
    note: '*से* znaczy tu „od” (w porównaniu) i stoi po osobie, z którą porównujemy: *नेहा से छोटा*; przymiotnik stoi tuż przed czasownikiem.'
  hi.a1.unit31.lesson05.teach.neha_ke_bal:
    title: Neha ma dłuższe włosy niż Vikram
    gloss: Neha ma dłuższe włosy niż Vikram.
    note: '*लंबे* zgadza się z rzeczownikiem w liczbie mnogiej *बाल*, a *विक्रम से* wyraża porównanie.'
  hi.a1.unit31.lesson05.teach.mere_bal_chhote:
    title: Mam krótkie brązowe włosy
    gloss: Mam krótkie brązowe włosy.
    note: '*मेरे बाल छोटे और भूरे हैं* („mam krótkie brązowe włosy”) to wzorcowe zdanie do opisania siebie; *मेरे* zgadza się z rzeczownikiem w liczbie mnogiej *बाल*.'
  hi.a1.unit31.lesson06.teach.arjun_dekho_kya:
    title: Arjun dostrzega Ninę
    gloss: 'Arjun: Patrz, czy to Nina? Ma krótkie blond włosy i zielone oczy.'
    note: '*देखो* („patrz”) to nieformalny tryb rozkazujący, używany wobec przyjaciela.'
  hi.a1.unit31.lesson06.teach.priya_han_vahee:
    title: Priya potwierdza
    gloss: 'Priya: Tak, to właśnie Nina!'
    note: Krótkie, naturalne potwierdzenie.
  hi.a1.unit31.lesson06.teach.neena_hay_kya:
    title: Nina wita Arjuna
    gloss: 'Nina: Cześć, czy ty jesteś Arjun?'
    note: '*क्या तुम अर्जुन हो?* to proste, nieformalne pytanie do osoby w twoim wieku.'
  hi.a1.unit31.lesson06.teach.arjun_han_tumse:
    title: Arjun wita Ninę
    gloss: 'Arjun: Tak! Miło cię poznać, Nina.'
    note: '*तुमसे मिलकर अच्छा लगा* to standardowe zdanie przy pierwszym spotkaniu; uczucie dzieje się „tobie”, więc słowo „ja” nie jest potrzebne.'
  hi.a1.unit31.lesson06.teach.neena_mujhe_bhee:
    title: Nina odpowiada na powitanie
    gloss: 'Nina: Mnie również miło!'
    note: Kończy dialog – Arjun rozpoznał Ninę dzięki wcześniejszemu opisowi Priyi.
