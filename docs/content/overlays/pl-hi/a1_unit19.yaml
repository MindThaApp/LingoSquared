  notes: 'Derived from en-hi by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Polish string was translated and adapted. Needs native Polish review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  weather_existential: '"Aaj/kal + [weather word] + hai" states the current or a stated day''s weather -- *dhoop hai* ("it''s sunny"), *baarish hai* ("it''s raining"), *hawa hai* ("it''s windy") are each stated as a bare existential sentence, not a progressive verb form. A typed answer using the correct weather noun with *hai* is accepted; using *hain* where the sentence''s own subject is singular (or vice versa) is judged as a real grammar error, the exact contrast this unit''s own grammar_check exercises target -- not tolerated as a minor typo.'
  garm_invariant_thanda_agrees: '*Garm* ("hot") never changes for gender or number -- "mausam garm hai" always uses *garm*. *Thanda*/*thandi* ("cold") DOES change with the noun''s gender, the same "-a"/"-i" pattern already taught for *bada*/*badi* (unit 14) -- masculine *mausam* takes *thanda*, a feminine noun would take *thandi*. Every exercise in this unit pairs *thanda*/*thandi* with *mausam* only, so only *thanda* is ever actually required as a typed answer here; a typed answer using the wrong gender form where one IS tested is marked incorrect as a real grammar error, not tolerated as a typo.'
  kal_context_ambiguity: '*Kal* means both "yesterday" (as taught in units 4/12) and "tomorrow" (as used throughout this unit) -- genuinely ambiguous in real Hindi, disambiguated only by the sentence''s own tense/context. This unit''s own sentences are all future/plan-making in context, so *kal* consistently means "tomorrow" here; don''t mark a learner''s own free sentence wrong merely for using *kal* to mean "yesterday" in a DIFFERENT context than this unit''s own scenario, since both meanings are equally correct Hindi.'
  suggestion_pattern: '"Chalo" + a habitual-plural verb form (e.g. *jaate hain*, *chalte hain*) makes a "Let''s ___" suggestion, the same pattern already used for "chalo, kuch khaate hain!" (unit 6) and "chalo, kuch kharidte hain!" (unit 7). *Jaate hain* here is the same "-te hain" habitual form applied to *jaana* ("to go," unit 15''s infinitive), not a new verb.'
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation. For any exercise asking the learner to describe today's or tomorrow's weather, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: Hindi A1
units:
  hi.a1.unit19.weather:
    title: Pogoda
lessons:
  hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa:
    title: Pogoda, słońce, deszcz i wiatr
  hi.a1.unit19.lesson02.garam_thanda_baadal:
    title: Gorąco, zimno i chmury
  hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam:
    title: 'Priya i Arjun: jaka jutro będzie pogoda?'
teaching:
  hi.a1.unit19.lesson01.teach.aaj_review:
    title: 'Powtórka: dzisiaj'
    gloss: dzisiaj
    note: Poznane w lekcji 3 jednostki 3 – to słowo o czasie wraca w całej jednostce, razem z *kal* (jutro) w lekcji 3.
    example_gloss: Dzisiaj jest trzeci.
  hi.a1.unit19.lesson01.teach.mausam:
    title: Pogoda
    gloss: pogoda
    note: Nowy rzeczownik, temat całej tej jednostki. Rodzaj męski – zobacz notatki o zgodności rodzaju w tej jednostce.
    example_gloss: Jaka jest dziś pogoda?
  hi.a1.unit19.lesson01.teach.kaisa_review:
    title: 'Powtórka: jaki / jaki jest'
    gloss: jaki / jaki jest
    note: Poznane w jednostce 12 – tu użyte do pytania o pogodę.
    example_gloss: Jaki jest twój dom?
  hi.a1.unit19.lesson01.teach.hai_hain_review:
    title: 'Powtórka: jest, są'
    gloss: jest (liczba pojedyncza), są (liczba mnoga)
    note: Para form „jest/są” w liczbie pojedynczej i mnogiej, na której opiera się cały wzorzec opisu pogody w tej jednostce.
    example_gloss:
    - Dzisiaj pogoda jest dobra.
    - W domu są trzy pokoje.
  hi.a1.unit19.lesson01.teach.dhoop:
    title: Słońce / nasłonecznienie
    gloss: słońce / nasłonecznienie
    note: 'Nowy rzeczownik. Użyty w zdaniu bez dodatkowych słów: *aaj dhoop hai* = „dzisiaj jest słonecznie” (dosłownie „dzisiaj jest słońce”).'
    example_gloss: Dziś jest słonecznie.
  hi.a1.unit19.lesson01.teach.baarish:
    title: Deszcz
    gloss: deszcz
    note: 'Nowy rzeczownik. Użyty w zdaniu bez dodatkowych słów: *aaj baarish hai* = „dzisiaj pada deszcz”.'
    example_gloss: Dziś pada deszcz.
  hi.a1.unit19.lesson01.teach.hawa:
    title: Wiatr
    gloss: wiatr
    note: 'Nowy rzeczownik. Użyty w zdaniu bez dodatkowych słów: *aaj hawa hai* = „dzisiaj jest wietrznie”.'
    example_gloss: Dzisiaj jest wietrznie.
  hi.a1.unit19.lesson01.teach.grammar_mausam_existential:
    title: Wzorzec opisu pogody
    gloss: Aby opisać pogodę, mówisz „aaj/kal + [słowo o pogodzie] + hai” – np. „aaj dhoop hai”, „aaj baarish hai”, „aaj hawa hai”. To ten sam wzorzec hai/hain, który znasz z domu (jednostka 18), ale tu bez liczebnika, bezpośrednio jako podmiot.
    note: Pierwsza notatka gramatyczna tej jednostki – łączy nowe słownictwo ze znanym już wzorcem zdania.
  hi.a1.unit19.lesson02.teach.mausam_review:
    title: 'Powtórka: pogoda'
    gloss: pogoda
    note: Słowo z lekcji 1 tej jednostki.
    example_gloss: Jaka jest dziś pogoda?
  hi.a1.unit19.lesson02.teach.garam:
    title: Gorący
    gloss: gorący
    note: Nowy przymiotnik. Nie zmienia się według rodzaju – zobacz notatkę gramatyczną tej lekcji.
    example_gloss: Dzisiaj pogoda jest gorąca.
  hi.a1.unit19.lesson02.teach.thanda_thandi:
    title: Zimny (r. męski / r. żeński)
    gloss: zimny (rodzaj męski), zimna (rodzaj żeński)
    note: 'Nowy przymiotnik. W przeciwieństwie do *garm* ZMIENIA się według rodzaju: z rzeczownikiem męskim *mausam* stoi *thanda*, a z żeńskimi (jak *rasoi*, jednostka 18) – *thandi*. Zobacz notatkę gramatyczną tej lekcji.'
    example_gloss:
    - Dzisiaj pogoda jest zimna.
    - Dzisiaj w kuchni jest zimno.
  hi.a1.unit19.lesson02.teach.grammar_garam_thanda:
    title: Przymiotniki niezmienne i zmieniające się według rodzaju
    gloss: '„Garm” to przymiotnik zakończony na spółgłoskę i nie zmienia się według rodzaju – w „mausam garm hai” zawsze jest „garm”. Natomiast „thanda”/„thandi” to przymiotnik zakończony na „-a”, który ZMIENIA się według rodzaju, tak jak „bada”/„badi” (jednostka 14): z rzeczownikiem męskim „mausam” stoi „thanda”, z żeńskim – „thandi”.'
    note: Główne zestawienie gramatyczne tej jednostki – łączy nową parę przymiotników z regułą poznaną w jednostce 14.
  hi.a1.unit19.lesson02.teach.baadal:
    title: Chmury
    gloss: chmury
    note: 'Nowy rzeczownik, w tej jednostce tylko w naturalnej liczbie mnogiej: *aaj baadal hain* = „dzisiaj są chmury” / „dzisiaj jest pochmurno”.'
    example_gloss: Dzisiaj są chmury.
  hi.a1.unit19.lesson02.teach.accha_review:
    title: 'Powtórka: dobry'
    gloss: dobry
    note: Poznane w jednostce 9 – tu użyte do opisu pogody.
    example_gloss: Dzisiaj pogoda jest dobra.
  hi.a1.unit19.lesson02.teach.bura:
    title: Zły
    gloss: zły
    note: Nowy przymiotnik, przeciwieństwo znanego już *accha* (dobry). W tej jednostce tylko w formie męskiej, pasującej do *mausam*.
    example_gloss: Dzisiaj pogoda jest zła.
  hi.a1.unit19.lesson02.teach.bahut_review:
    title: 'Powtórka: bardzo'
    gloss: bardzo
    note: Poznane w jednostce 6 – tu użyte do wzmocnienia opisu pogody.
    example_gloss: Dzisiaj pogoda jest bardzo zimna.
  hi.a1.unit19.lesson03.teach.kal_review:
    title: 'Powtórka: jutro (także: wczoraj)'
    gloss: jutro (zależnie od kontekstu znaczy też „wczoraj”)
    note: Poznane w jednostce 4, w jednostce 12 użyte jako „wczoraj” – w prawdziwym hindi to słowo jest dwuznaczne i rozróżnia je tylko kontekst. Wszystkie zdania w tej jednostce dotyczą przyszłości i planów, więc kal znaczy tu „jutro”.
    example_gloss: Jutro będzie padać deszcz.
  hi.a1.unit19.lesson03.teach.ghar_review:
    title: 'Powtórka: dom'
    gloss: dom
    note: Poznane w jednostce 8 – tu użyte w planie wynikającym z pogody (zostać w domu).
    example_gloss: To jest dom.
  hi.a1.unit19.lesson03.teach.mein_review:
    title: 'Powtórka: w'
    gloss: w
    note: Poznane w jednostce 1 – tu użyte w „ghar mein” (w domu).
    example_gloss: W domu są trzy pokoje.
  hi.a1.unit19.lesson03.teach.hum_review:
    title: 'Powtórka: my'
    gloss: my
    note: Poznane w jednostce 11 – tu użyte jako podmiot w planach z tej lekcji.
    example_gloss: Oglądamy film.
  hi.a1.unit19.lesson03.teach.rehte_hain_review:
    title: 'Powtórka: [oni/my] mieszkamy / zostajemy'
    gloss: '[oni/my] mieszkają / zostają'
    note: Poznane w jednostce 5 (z jednym dziadkiem, przez zgodność w liczbie mnogiej męskiej jako forma grzecznościowa) – w tej jednostce pierwszy raz z podmiotem naprawdę w liczbie mnogiej, „hum” (my); ta sama forma czasownika, użyta prościej.
    example_gloss: Mój dziadek mieszka w Delhi.
  hi.a1.unit19.lesson03.teach.chalo_review:
    title: 'Powtórka: chodźmy / no chodź'
    gloss: chodźmy / no chodź
    note: Poznane w jednostce 1, a w jednostkach 6/7/11 użyte z czasownikiem w formie mnogiej zwyczajowej w znaczeniu „Zróbmy ___” – tu użyte tak samo.
    example_gloss: Chodźmy coś zjeść!
  hi.a1.unit19.lesson03.teach.jaana_review:
    title: 'Powtórka: iść'
    gloss: iść / jechać
    note: Poznane w jednostce 15 jako sam bezokolicznik – ta lekcja dodaje formę mnogą zwyczajową „jaate hain” (idziemy), tworzoną tak samo jak „dekhte hain”/„peete hain” w jednostce 11.
    example_gloss: Muszę iść na dworzec.
  hi.a1.unit19.lesson03.teach.aur_review:
    title: 'Powtórka: i'
    gloss: i
    note: Poznane w jednostce 1 – tu użyte do połączenia pogody i temperatury jutrzejszego dnia.
    example_gloss: Jutro będzie padać deszcz i będzie zimno.
  hi.a1.unit19.lesson03.teach.bahar:
    title: Na zewnątrz
    gloss: na zewnątrz
    note: Nowe słowo, potrzebne do planu z tej lekcji.
    example_gloss: Chodźmy na zewnątrz!
  hi.a1.unit19.lesson03.teach.jaate_hain_phrase:
    title: Chodźmy na zewnątrz!
    gloss: Chodźmy na zewnątrz!
    note: „Chalo” + zwyczajowa forma mnoga „jaate hain” (od „jaana”, iść) – ten sam wzorzec „Zróbmy ___”, który znasz z jednostek 1/6/7/11.
  hi.a1.unit19.lesson03.teach.dialogue.line01:
    title: Arjun pyta Priyę o dzisiejszą pogodę
    gloss: Priyo, jaka jest dzisiaj pogoda?
  hi.a1.unit19.lesson03.teach.dialogue.line02:
    title: Priya opisuje dzisiejszą pogodę
    gloss: Dzisiaj jest słonecznie i gorąco.
  hi.a1.unit19.lesson03.teach.dialogue.line03:
    title: Arjun proponuje wyjście na zewnątrz
    gloss: Świetnie! Chodźmy na zewnątrz.
  hi.a1.unit19.lesson03.teach.dialogue.line04:
    title: Priya pyta o jutrzejszą pogodę
    gloss: Dobrze! A jaka jutro będzie pogoda?
  hi.a1.unit19.lesson03.teach.dialogue.line05:
    title: Arjun opisuje jutrzejszą pogodę
    gloss: Jutro będzie padać deszcz i będzie zimno.
  hi.a1.unit19.lesson03.teach.dialogue.line06:
    title: Priya proponuje zostać w domu
    gloss: To jutro zostajemy w domu?
  hi.a1.unit19.lesson03.teach.dialogue.line07:
    title: Arjun się zgadza
    gloss: Tak, jutro zostajemy w domu.
  hi.a1.unit19.lesson03.teach.dialogue.line08:
    title: Priya się zgadza
    gloss: Dobrze!
  hi.a1.unit19.lesson03.teach.grammar_summary:
    title: Trzy główne zasady
    gloss: 'Trzy główne zasady tej lekcji: (1) ''aaj/kal + [słowo o pogodzie] + hai/hain'' opisuje pogodę; (2) ''garm'' nie zmienia się w zależności od rodzaju, ale ''thanda''/''thandi'' tak, dokładnie jak ''bada''/''badi''; (3) ''chalo'' + czasownik w liczbie mnogiej w formie zwyczajowej (np. ''jaate hain'') tworzy propozycję -- ''chalo, bahar jaate hain!''.'
    note: Podsumowanie całej gramatyki lekcji, nawiązujące do podsumowań gramatycznych z lekcji 15–18.
  hi.a1.unit19.lesson03.teach.weather_reading:
    title: Czytanka o dniu dzisiejszym i jutrzejszym
    gloss: Dziś jest ciepło i świeci słońce. Chodźmy na dwór! Jutro będzie padać i będzie zimno. Jutro zostajemy w domu.
    note: Krótki, bezpośredni tekst powtarzający dokładnie te fakty, które padły w dialogu, bez nowych informacji. Ćwiczy umiejętność przeczytania krótkiej prognozy pogody.
    glosses:
      आज: dziś
      मौसम: pogoda
      गर्म: gorący, ciepły
      धूप: słońce
      चलो: chodźmy
      बाहर: na zewnątrz
      जाते: iść, jechać (od जाना)
      कल: jutro
      बारिश: deszcz
      ठंडा: zimny
      रहते: zostawać / mieszkać (od रहना)
