answer_policy:
  nasalization_marks: 'Display and teach the correct chandrabindu/anusvara distinction. This unit''s own new vocabulary needs one new, explicitly disclosed spelling decision: महंगा/महंगी ("expensive") uses अनुस्वार (ं), not चंद्रबिंदु -- this is a class-nasal-before-a-stop-consonant case (the same pattern as गंगा/मंगल), not an application of the existing word-final vowel-height convention that governs हूँ/हाँ/मैं/हैं/में. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.'
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
units:
  hi.a1.unit07.shopping:
    title: Zakupy
lessons:
  hi.a1.unit07.lesson01.dukaan_mein:
    title: W sklepie
  hi.a1.unit07.lesson02.keemat_aur_matra:
    title: Cena i ilość
  hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari:
    title: Priya i Arjun idą na zakupy
teaching:
  hi.a1.unit07.lesson01.teach.dukaan_bazaar:
    title: Sklep, targ
    gloss: sklep, targ
    note: Dwa częste miejsca, w których się kupuje; będą się pojawiać w całej lekcji.
    example_gloss:
    - To jest sklep.
    - To jest targ.
  hi.a1.unit07.lesson01.teach.dukaandaar:
    title: Sprzedawca
    gloss: sprzedawca
    note: Nowa postać w tej lekcji -- osoba prowadząca sklep; zwracamy się do niej per aap, bo jest obca.
    example_gloss: To jest sprzedawca.
  hi.a1.unit07.lesson01.teach.kameez_bag_topi:
    title: Koszula, torba, kapelusz
    gloss: koszula, torba, kapelusz
    note: Trzy częste rzeczy do kupienia; posłużą w tej lekcji do ćwiczenia wzoru *mujhe ... chahiye* z lekcji o jedzeniu.
    example_gloss:
    - Poproszę koszulę.
    - Poproszę torbę.
    - Poproszę kapelusz.
  hi.a1.unit07.lesson01.teach.mujhe_yah_chahiye:
    title: Chcę to
    gloss: Poproszę to.
    note: Uniwersalne zdanie na określenie, czego chcesz; to znany wzór *mujhe ... chahiye* z lekcji o jedzeniu z słowem *yah* (to).
  hi.a1.unit07.lesson01.teach.ji:
    title: Ji (grzeczny zwrot)
    gloss: partykuła grzeczności i szacunku, jak „proszę pana/pani”
    note: Dodaje się ją po imieniu lub tytule, by zabrzmieć grzeczniej; często używana wobec obcych, np. sprzedawcy.
    example_gloss: Dzień dobry, proszę pana.
  hi.a1.unit07.lesson01.teach.sirf:
    title: Tylko
    gloss: tylko, jedynie
    note: Służy do powiedzenia, że chcesz tylko jedną rzecz, a nie kilka.
    example_gloss: Poproszę tylko jedną koszulę.
  hi.a1.unit07.lesson01.teach.aapko_aur_kuch_chahiye:
    title: Czy życzy sobie Pan/Pani coś jeszcze? (formalnie)
    gloss: Czy życzy sobie Pan/Pani coś jeszcze?
    note: Naturalne formalne pytanie, które sprzedawca zadaje po przyjęciu części zamówienia; używa słów *aapko* i *chahiye*.
  hi.a1.unit07.lesson01.teach.ji_nahin_sirf_yah:
    title: Nie, tylko to
    gloss: Nie, tylko to.
    note: Naturalny, grzeczny sposób odmowy dalszych zakupów; używa słów *ji* i *sirf* z tej lekcji.
  hi.a1.unit07.lesson01.teach.tumhein_kya_chahiye_bataao:
    title: Powiedz, czego chcesz
    gloss: Powiedz, czego chcesz.
    note: Nieformalne polecenie używane w kursie do wywołania odpowiedzi ustnej, takie samo jak w lekcji o jedzeniu.
  hi.a1.unit07.lesson02.teach.keemat:
    title: Cena
    gloss: cena
    note: Słowo znane z lekcji 2 o liczbach i cenach, tu powtórzone w kontekście zakupów.
    example_gloss: Ile to kosztuje?
  hi.a1.unit07.lesson02.teach.rupaye:
    title: Rupie
    gloss: rupie
    note: Nazwa waluty znana z lekcji 2, teraz ćwiczona z dwiema różnymi cenami.
    example_gloss:
    - Cena tego to dwieście rupii.
    - Cena tego to pięćset rupii.
  hi.a1.unit07.lesson02.teach.iski_keemat_kya_hai:
    title: Ile to kosztuje?
    gloss: Ile to kosztuje?
    note: Standardowy sposób pytania o cenę, znany z lekcji 2.
  hi.a1.unit07.lesson02.teach.iski_keemat_bees_rupaye_hai:
    title: Cena tego to dwieście rupii
    gloss: Cena tego to dwieście rupii.
    note: Przykładowa odpowiedź na powyższe pytanie o cenę.
  hi.a1.unit07.lesson02.teach.kitne_ka_ki_note:
    title: Kitne ka / kitne ki
    gloss: „Yah kitne ka hai?” mówimy o rzeczach rodzaju męskiego, a „Yah kitne ki hai?” o rzeczach rodzaju żeńskiego -- samo *kitne* się nie zmienia, zmienia się tylko *ka/ki*, tak samo jak końcówki -a/-i w *mera/meri* i *tumhara/tumhari*.
    note: Drugi, bardzo częsty sposób pytania o cenę, oparty na znanej już zgodności rodzaju jak w zaimkach dzierżawczych -- zmienia się tylko partykuła ka/ki, a nie kitne.
  hi.a1.unit07.lesson02.teach.yeh_kitne_ka_hai:
    title: Ile to kosztuje? (rodzaj męski)
    gloss: Ile to kosztuje?
    note: Używane przy rzeczy rodzaju męskiego, np. torbie.
  hi.a1.unit07.lesson02.teach.yeh_kitne_ki_hai:
    title: Ile to kosztuje? (rodzaj żeński)
    gloss: Ile to kosztuje?
    note: Używane przy rzeczy rodzaju żeńskiego, np. czapce.
  hi.a1.unit07.lesson02.teach.sasta_mehenga:
    title: Tani, drogi
    gloss: tani, drogi
    note: Często używana para przymiotników do komentowania ceny; tu formy rodzaju męskiego.
    example_gloss:
    - Ta torba jest tania.
    - Ta torba jest droga.
  hi.a1.unit07.lesson02.teach.sasti_mehengi_note:
    title: Sasti i mehengi
    gloss: सस्ता i महंगा też zmieniają formę w rodzaju męskim i żeńskim, tak jak मेरा/मेरी. Przy słowach rodzaju żeńskiego mówimy सस्ती i महंगी, np. यह टोपी सस्ती है (ta czapka jest tania) albo यह कमीज़ महंगी है (ta koszula jest droga).
    note: Kolejny przykład tej samej zasady zgodności rodzaju, na którą ten kurs zwraca uwagę.
  hi.a1.unit07.lesson03.teach.khareedna:
    title: Kupować
    gloss: kupować
    note: Wykorzystuje konstrukcję „czasownik + ना चाहता/चाहती हूँ” (chcę…), poznaną w lekcji 1 przy nauce jogi, tym razem w odniesieniu do kupowania.
    example_gloss:
    - Chcę kupić tę koszulę.
    - Chcę kupić tę czapkę.
  hi.a1.unit07.lesson03.teach.chalo_kuch_khareedte_hain:
    title: Chodźmy coś kupić!
    gloss: Chodźmy coś kupić!
    note: 'Przyjazny, utarty sposób zaproponowania wspólnych zakupów; otwiera końcowy dialog tej lekcji i odpowiada wzorcowi z lekcji o jedzeniu: „chalo, kuch khate hain!”.'
  hi.a1.unit07.lesson03.teach.dialogue.line01:
    title: Arjun proponuje zakupy
    gloss: 'Arjun mówi: chodźmy coś kupić.'
    note: Powtarza zwrot otwierający tę lekcję.
  hi.a1.unit07.lesson03.teach.dialogue.line02:
    title: Priya się zgadza
    gloss: 'Priya się zgadza i zastanawia się: koszula czy czapka?'
    note: Wprowadza słowo *ya* (albo), które służy do wyboru między dwiema rzeczami.
  hi.a1.unit07.lesson03.teach.dialogue.line03:
    title: Sprzedawca wita klientów
    gloss: Sprzedawca wita się i pyta, czego sobie życzą.
    note: Uprzejme powitanie w formie grzecznościowej aap, z użyciem zwrotu *aapko kya chahiye* z lekcji 1.
  hi.a1.unit07.lesson03.teach.dialogue.line04:
    title: Priya pyta o koszulę
    gloss: Priya grzecznie wita sprzedawcę, mówi, że potrzebuje koszuli, i pyta o jej cenę.
    note: Łączy *ji*, *mujhe ... chahiye* i *iski keemat kya hai*.
  hi.a1.unit07.lesson03.teach.dialogue.line05:
    title: Sprzedawca podaje cenę
    gloss: Sprzedawca mówi, że koszula kosztuje trzysta rupii.
    note: Powtarza wzorzec *iski keemat ... rupaye hai* z nową liczbą.
  hi.a1.unit07.lesson03.teach.dialogue.line06:
    title: Priya reaguje i podejmuje decyzję
    gloss: 'Priya mówi: trzysta rupii? To tanio! Poproszę tę koszulę.'
    note: Powtarza słowo *sasti* z notatki gramatycznej z lekcji 2.
  hi.a1.unit07.lesson03.teach.dialogue.line07:
    title: Arjun pyta o czapkę
    gloss: Arjun mówi, że potrzebuje czapki, i pyta, ile ona kosztuje.
    note: Powtarza formę rodzaju żeńskiego *kitne ki hai* z lekcji 2.
  hi.a1.unit07.lesson03.teach.dialogue.line08:
    title: Sprzedawca odpowiada
    gloss: Sprzedawca mówi, że czapka kosztuje pięćset rupii.
    note: Powtarza liczbę *paanch sau* (pięćset) z lekcji 2.
  hi.a1.unit07.lesson03.teach.dialogue.line09:
    title: Arjun reaguje i mimo to się decyduje
    gloss: 'Arjun mówi: pięćset rupii? To drogo! Dobrze, poproszę tę czapkę.'
    note: Powtarza słowo *mehengi* z notatki gramatycznej z lekcji 2, a potem mimo wszystko decyduje się na zakup.
  hi.a1.unit07.lesson03.teach.dialogue.line10:
    title: Sprzedawca pyta, czy to wszystko
    gloss: 'Sprzedawca mówi: dobrze, czy życzą sobie Państwo coś jeszcze?'
    note: Powtarza zwrot *aapko aur kuch chahiye* z lekcji 1.
  hi.a1.unit07.lesson03.teach.dialogue.line11:
    title: Priya kończy zamówienie
    gloss: 'Priya mówi: nie, tylko to, dziękuję!'
    note: Powtarza zwrot *ji nahin, sirf yah* z lekcji 1 oraz słowo *shukriya*.
  hi.a1.unit07.lesson03.teach.dialogue.line12:
    title: Sprzedawca się żegna
    gloss: 'Sprzedawca dziękuje i mówi: do zobaczenia.'
    note: Powtarza standardowy zwrot pożegnalny tego kursu.
