teaching:
  hi.a1.unit16.lesson01.teach.tum_ho_review:
    title: 'Powtórka: ty, dobrze, jesteś'
    gloss: ty (nieformalnie), dobrze / w porządku, jesteś
    note: Krótka powtórka słów potrzebnych, by zapytać przyjaciela, jak się czuje.
    example_gloss: Jak się masz?
  hi.a1.unit16.lesson01.teach.mujhe_hai_review:
    title: 'Powtórka: mnie, jest'
    gloss: mnie / dla mnie, jest
    note: Łącznik potrzebny do zbudowania konstrukcji z objawami z tej lekcji.
    example_gloss: Mam sprawę do załatwienia.
  hi.a1.unit16.lesson01.teach.tum_theek_ho_phrase:
    title: Wszystko w porządku?
    gloss: Wszystko w porządku?
    note: Pytanie otwierające lekcję, którym sprawdzasz, jak się czuje przyjaciel.
  hi.a1.unit16.lesson01.teach.main_hoon_nahin_review:
    title: 'Powtórka: ja, jestem, nie'
    gloss: ja, jestem, nie
    note: Potrzebne, by odpowiedzieć przecząco na pytanie „Wszystko w porządku?”.
    example_gloss: Jestem w porządku.
  hi.a1.unit16.lesson01.teach.sir:
    title: Głowa
    gloss: głowa
    note: Nowy rzeczownik, potrzebny do pierwszego objawu w tej lekcji.
    example_gloss: Moja głowa jest duża.
  hi.a1.unit16.lesson01.teach.dard:
    title: Ból
    gloss: ból
    note: Nowy rzeczownik. W połączeniu z nazwą części ciała tworzy nazwę konkretnego bólu – zobacz notatkę gramatyczną w tej lekcji.
    example_gloss: Odczuwam ból.
  hi.a1.unit16.lesson01.teach.mujhe_sir_dard_hai_phrase:
    title: Boli mnie głowa.
    gloss: Boli mnie głowa.
    note: Pierwsze pełne zdanie o objawie w tej lekcji.
  hi.a1.unit16.lesson01.teach.grammar_symptom_hai:
    title: Mujhe + objaw + hai
    gloss: '''Mujhe + rzeczownik + hai'' poznałeś już w jednostce 11 (''mujhe kaam hai'' = mam sprawę do załatwienia). Teraz używa się go także do opisu objawów: ''mujhe sir dard hai'' znaczy „boli mnie głowa” -- ''sir dard'' (sir = głowa, dard = ból) razem tworzą „ból głowy”. To nie jest nowa gramatyka, tylko ten sam wzór co wcześniej.'
    note: 'Pokazuje drugie zastosowanie poznanego już wzoru: celownik + rzeczownik + hai. Wskazuje wcześniejszą jednostkę, zanim wzór zostanie użyty do objawów.'
    target_text: '''मुझे + संज्ञा + है'' पहले यूनिट 11 में सीखा था (''मुझे काम है'' = mam pracę / sprawę do załatwienia)। अब यह लक्षण बताने के लिए भी इस्तेमाल होता है: ''मुझे सिर दर्द है'' का मतलब है ''boli mnie głowa'' -- ''सिर दर्द'' (सिर = głowa, दर्द = ból) एक साथ मिलकर ''ból głowy'' बनाते हैं। यह कोई नया व्याकरण नहीं है, वही पुराना पैटर्न है।'
  hi.a1.unit16.lesson01.teach.bukhar:
    title: Gorączka
    gloss: gorączka
    note: Nowy rzeczownik, drugi objaw w tej lekcji.
    example_gloss: Masz gorączkę?
  hi.a1.unit16.lesson01.teach.mujhe_bukhar_hai_phrase:
    title: Mam gorączkę.
    gloss: Mam gorączkę.
    note: Ten sam wzór celownik + rzeczownik + hai zastosowany do drugiego objawu z tej lekcji.
  hi.a1.unit16.lesson02.teach.tumhein_jaana_review:
    title: 'Powtórka: tobie, iść / jechać'
    gloss: tobie / dla ciebie, iść / jechać
    note: Oba słowa już poznane (jednostka 6 i jednostka 15) – wracają tu, by mówić o wizycie u lekarza.
    example_gloss:
    - Co byś chciał?
    - Muszę iść na dworzec.
  hi.a1.unit16.lesson02.teach.ke_paas_review:
    title: 'Powtórka: obok / przy'
    gloss: obok / przy (miejscu)
    note: Poznane w jednostce 8 – wraca tu, a w notatce gramatycznej tej lekcji dostaje trzecie znaczenie.
    example_gloss: Bank jest obok szkoły.
  hi.a1.unit16.lesson02.teach.doctor:
    title: Lekarz
    gloss: lekarz
    note: Nowy rzeczownik, główny temat tej lekcji.
    example_gloss: Lekarz jest dobry.
  hi.a1.unit16.lesson02.teach.mujhe_doctor_ke_paas_jana_hai_phrase:
    title: Muszę iść do lekarza.
    gloss: Muszę iść do lekarza.
    note: Łączy *ke paas* z konstrukcją konieczności *mujhe...jana hai* z jednostki 15.
  hi.a1.unit16.lesson02.teach.grammar_ke_paas_third_sense:
    title: 'Ke paas: trzecie znaczenie'
    gloss: 'Dwa pierwsze znaczenia ''ke paas'' poznałeś wcześniej – „obok” (jednostka 8: ''bank school ke paas hai'') i posiadanie (jednostka 2: ''mere paas ek kitab hai''). Teraz trzecie użycie: pójście do OSOBY, czyli odwiedzenie jej -- ''doctor ke paas jana hai'' znaczy „muszę iść do lekarza”. Ta sama konstrukcja ''mujhe...jana hai'' wraca też z jednostki 15.'
    note: Wskazuje oba wcześniejsze znaczenia z numerami jednostek, zanim pojawi się trzecie, i przypomina o powrocie konstrukcji konieczności.
  hi.a1.unit16.lesson02.teach.aaraam:
    title: Odpoczynek
    gloss: odpoczynek
    note: Nowy rzeczownik, pierwsza rada w tej lekcji.
    example_gloss: Potrzebuję odpoczynku.
  hi.a1.unit16.lesson02.teach.chahiye_review:
    title: 'Powtórka: chcieć / potrzebować'
    gloss: chcieć / potrzebować
    note: Poznane w jednostce 6, wraca tu, by powiedzieć, czego ktoś potrzebuje.
    example_gloss: Poproszę herbatę.
  hi.a1.unit16.lesson02.teach.tumhein_aaraam_chahiye_phrase:
    title: Potrzebujesz odpoczynku.
    gloss: Potrzebujesz odpoczynku.
    note: Znany już wzór *tumhein...chahiye* zastosowany do nowego rzeczownika z tej lekcji.
  hi.a1.unit16.lesson02.teach.dawa:
    title: Lekarstwo
    gloss: lekarstwo
    note: Nowy rzeczownik, druga rada w tej lekcji.
    example_gloss: Potrzebuję lekarstwa.
  hi.a1.unit16.lesson02.teach.tumhein_dawa_chahiye_phrase:
    title: Potrzebujesz lekarstwa.
    gloss: Potrzebujesz lekarstwa.
    note: Ten sam wzór z *chahiye* zastosowany do lekarstwa.
  hi.a1.unit16.lesson02.teach.jaao_aur_review:
    title: 'Powtórka: idź!, i'
    gloss: idź!, i
    note: Obie konstrukcje były już wprowadzone (w jednostce 9 i w jednostkach 1–2) – tutaj wykorzystujemy je do połączenia dwóch rad.
    example_gloss:
    - Proszę iść prosto.
    - Poproszę herbatę i kawę.
  hi.a1.unit16.lesson02.teach.karo_grammar:
    title: 'Karo: ta sama reguła rozkaźnika na -o'
    gloss: '''Karo'' powstaje według tej samej reguły rozkaźnika dla „tum”, którą już poznałeś (''jao'', ''muro'', ''batao'', ''gino'' – wszystkie kończą się na ''-o''). Tu tworzymy go od ''karna'' (z jednostki 11: ''maaf karna''): temat ''kar'' plus ''-o'' daje ''karo'', czyli „rób!”. ''Aaraam karo'' znaczy „Odpocznij!”.'
    note: Bezpośrednie, jasne rozszerzenie poznanej już reguły rozkaźnika na czasownik, który uczący zna dotąd w bezokoliczniku.
  hi.a1.unit16.lesson02.teach.aaraam_karo_phrase:
    title: Odpocznij!
    gloss: Odpocznij!
    note: Nowy rozkaźnik użyty przy pierwszej radzie w tej jednostce.
  hi.a1.unit16.lesson02.teach.aaraam_karo_aur_doctor_ke_paas_jaao_phrase:
    title: Odpocznij i idź do lekarza.
    gloss: Odpocznij i idź do lekarza.
    note: Łączy dwie rady z tej lekcji w jedno naturalne polecenie i zapowiada kartę czytania z lekcji 3.
  hi.a1.unit16.lesson03.teach.dialogue.line01:
    title: Priya pyta, czy Arjun czuje się dobrze
    gloss: Arjun, wszystko w porządku?
  hi.a1.unit16.lesson03.teach.dialogue.line02:
    title: Arjun mówi, że boli go głowa i ma gorączkę
    gloss: Nie, boli mnie głowa i mam gorączkę.
  hi.a1.unit16.lesson03.teach.dialogue.line03:
    title: Priya mówi, że potrzebuje odpoczynku
    gloss: To niedobrze. Potrzebujesz odpoczynku.
  hi.a1.unit16.lesson03.teach.dialogue.line04:
    title: Arjun potrzebuje też lekarstwa
    gloss: Tak, ale potrzebuję też lekarstwa.
  hi.a1.unit16.lesson03.teach.dialogue.line05:
    title: Priya mówi, że musi iść do lekarza
    gloss: Dobrze. Musisz iść do lekarza.
  hi.a1.unit16.lesson03.teach.dialogue.line06:
    title: Arjun dziękuje Priyi
    gloss: Dobrze, dziękuję.
  hi.a1.unit16.lesson03.teach.dialogue.line07:
    title: Priya każe mu odpocząć
    gloss: Odpocznij!
  hi.a1.unit16.lesson03.teach.dialogue.line08:
    title: Arjun się zgadza
    gloss: Dobrze.
  hi.a1.unit16.lesson03.teach.grammar_summary:
    title: Trzy główne reguły
    gloss: 'Trzy główne reguły tej jednostki: (1) ''mujhe/tumhein + objaw + hai'' opisuje dolegliwość (np. ''mujhe bukhar hai''); (2) ''tumhein/mujhe + rzecz + chahiye'' wyraża potrzebę (np. ''tumhein aaraam chahiye''); (3) ''X ke paas jana hai'' mówi, do kogo trzeba iść (np. ''doctor ke paas jana hai'').'
    note: Końcowe podsumowanie gramatyki całej jednostki, podobne do notatki gramatycznej podsumowującej paradygmat w jednostce 15.
  hi.a1.unit16.lesson03.teach.advice_reading:
    title: Czytamy rady
    gloss: Odpocznij. Idź do lekarza.
    note: Krótkie, bezpośrednie polecenie (bez rozbudowanej narracji, tak jak brzmią rady w mowie), które powtarza fakty z dialogu i nie dodaje nic nowego.
    glosses:
      आराम: odpoczywać / odpocznij
      करो: rób / zrób (rozkaźnik od करना)
      डॉक्टर: lekarz
      जाओ: idź (rozkaźnik od जाना)
