  hi.a1.unit35.lesson04.teach.phir_milenge_yah:
    title: फिर मिलेंगे a dzień + को
    gloss: 'Znasz już *फिर मिलेंगे!* („do zobaczenia”). Aby podać dzień, dodaj *को* po nim: *शनिवार को मिलते हैं!*, *सोमवार को मिलते हैं!*'
    note: Rozszerza wzór pożegnania z tematu o powitaniach na konkretny dzień.
  hi.a1.unit35.lesson05.teach.priya_har_din:
    title: Kto czego używa?
    gloss: Priya dzwoni do Arjuna codziennie. Używa telefonu, a nie aplikacji. Arjun nie ma w domu komputera, ale korzysta z internetu w telefonie. Vikram każdego ranka sprawdza prognozę pogody. Potem idzie biegać. Neha często wysyła Priyi wiadomości. Czy ty też codziennie używasz telefonu?
    note: Porównanie tego, jak wszystkie cztery postacie korzystają z urządzeń, na wzór tekstu porównawczego z tematu o sporcie.
    glosses:
      कॉल: dzwoni
      हर: każdy
      दिन: dzień
      इस्तेमाल: używa
      फ़ोन: telefon
      ऐप: aplikacja
      कंप्यूटर: komputer
      घर: w domu
      इंटरनेट: internet
      चेक: sprawdza
      सुबह: ranek
      अनुमान: prognoza pogody
      जाता: idzie
      दौड़ने: bieganie
      भेजती: wysyła
      अक्सर: często
      मैसेज: wiadomość
      करते: używasz
