    title: Zmienia się tylko करना
    gloss: 'W *चेक करना* słowo *चेक* się nie zmienia, a z osobą zmienia się tylko *करना*: *मैं चेक करता हूँ*, *तुम चेक करते हो*. *इस्तेमाल करना* działa tak samo.'
    note: 'Wiele hindi czasowników składa się z rzeczownika lub zapożyczenia i *करना*: pierwszego słowa uczysz się raz, a zmieniasz tylko *करना*.'
