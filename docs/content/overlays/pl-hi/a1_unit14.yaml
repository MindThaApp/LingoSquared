    instruction: Co oznacza to słowo?
    correct_option: wysoki / długi
    distractors:
    - duży / starszy
    - tani
    accepted_answers:
    - wysoki / długi
  hi.a1.unit14.lesson01.exercise02.select_bada_meaning:
    instruction: Co oznacza to słowo?
    correct_option: duży / starszy
    distractors:
