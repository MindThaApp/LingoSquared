      छोटी: mała / młodsza (r. ż.)
      लंबा: wysoki / długi (r. m.)
      लंबी: wysoka / długa (r. ż.)
      से: niż
      कौन: kto
    pairs:
    - left: बड़ा
      right: duży / starszy (r. m.)
    - left: बड़ी
      right: duża / starsza (r. ż.)
    - left: छोटा
      right: mały / młodszy (r. m.)
    - left: छोटी
      right: mała / młodsza (r. ż.)
    - left: लंबा
      right: wysoki / długi (r. m.)
    - left: लंबी
      right: wysoka / długa (r. ż.)
    - left: से
      right: niż
    - left: कौन
      right: kto
