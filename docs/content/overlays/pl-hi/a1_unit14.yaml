  hi.a1.unit14.lesson03.arjun_priya_tulna:
    title: 'Arjun i Priya: porównania'
teaching:
  hi.a1.unit14.lesson01.teach.arjun_priya_review:
    title: 'Powtórka: Arjun, Priya, jest'
    gloss: Arjun, Priya, jest
    note: Krótka powtórka imion obu bohaterów i łącznika „hai” („jest”), potrzebnych do budowania zdań porównawczych w tej lekcji.
    example_gloss:
    - Arjun ma się dobrze.
    - Priya ma się dobrze.
  hi.a1.unit14.lesson01.teach.bada_badi_review:
    title: 'Powtórka: duży / starszy'
    gloss: duży / starszy (rodzaj męski / żeński)
    note: Poznane w lekcji 5 przy wieku rodzeństwa -- tu rozszerzamy to na bezpośrednie porównywanie dowolnych dwóch osób lub rzeczy.
    example_gloss:
    - Mój starszy brat mieszka w Delhi.
    - Moja starsza siostra mieszka w Delhi.
  hi.a1.unit14.lesson01.teach.chota_choti_review:
    title: 'Powtórka: mały / młodszy'
    gloss: mały / młodszy (rodzaj męski / żeński)
    note: Poznane w lekcji 5 przy wieku rodzeństwa -- użyte tu tak samo jak bada/badi.
    example_gloss:
    - Mój młodszy brat jest teraz studentem.
    - Moja młodsza siostra jest teraz studentką.
  hi.a1.unit14.lesson01.teach.se_comparative_grammar:
    title: Se = od, niż
    gloss: 'Słowo „se” znasz już jako „z, od” (lekcja 9, „yahan se seedhe jao”) i jako „z” (lekcja 12, „Priya se mila”). Teraz oznacza też porównanie: „X, Y se ADJ hai” znaczy „X jest bardziej ADJ niż Y” (po polsku także „ADJ od Y”) -- np. „Priya Arjun se badi hai”.'
    note: Trzecie znaczenie słowa, które już znasz; przypominamy dwa wcześniejsze z numerami lekcji, zanim pojawi się nowe.
    target_text: '''से'' पहले ''यहाँ से सीधे जाओ'' (यूनिट 9, matlab ''od, z'') और ''प्रिया से मिला'' (यूनिट 12, matlab ''z'') में सीखा था; अब यह तुलना के लिए भी आता है: ''X, Y से ADJ है'' का मतलब है ''X jest bardziej ADJ niż Y'' -- जैसे ''प्रिया अर्जुन से बड़ी है''।'
  hi.a1.unit14.lesson01.teach.arjun_bada_phrase:
    title: Priya jest starsza od Arjuna.
    gloss: Priya jest starsza od Arjuna.
    note: Pierwszy pełny przykład wzoru porównawczego z „se”.
  hi.a1.unit14.lesson01.teach.lamba_lambi:
    title: Wysoki / długi
    gloss: wysoki / długi (rodzaj męski / żeński)
    note: Nowa para przymiotników, zgodna ze znanym wzorem końcówek -a/-i dla rodzaju męskiego i żeńskiego (bada/badi, chota/choti).
    example_gloss:
    - Mój brat jest wysoki.
    - Moja siostra jest wysoka.
  hi.a1.unit14.lesson01.teach.agreement_grammar:
    title: Przymiotnik zgadza się z podmiotem
    gloss: W zdaniu porównawczym przymiotnik (np. bada/badi, chota/choti) zawsze zgadza się w rodzaju z PODMIOTEM, a nie ze słowem po „se” -- np. w „Arjun Priya se chota hai” słowo „chota” zgadza się z Arjunem (podmiot rodzaju męskiego), a nie z Priyą.
    note: Wprost rozszerza znany już wzór zgodności przymiotników na -a/-i, zastosowany do zdań porównawczych.
    target_text: तुलना के वाक्य में विशेषण (जैसे बड़ा/बड़ी, छोटा/छोटी) हमेशा विषय (podmiot) के लिंग से मेल खाता है, 'से' के बाद वाले शब्द के नहीं -- जैसे 'अर्जुन प्रिया से छोटा है' में 'छोटा' अर्जुन (पुल्लिंग विषय) से मेल खाता है, प्रिया से नहीं।
  hi.a1.unit14.lesson01.teach.priya_chota_phrase:
    title: Arjun jest młodszy od Priyi.
    gloss: Arjun jest młodszy od Priyi.
    note: Ten sam fakt ujęty z drugiej strony -- pokazuje zgodność z podmiotem rodzaju męskiego.
  hi.a1.unit14.lesson01.teach.kaun_ya_review:
    title: 'Powtórka: kto, albo'
    gloss: kto, albo
    note: Oba słowa już znasz (lekcja 5 i lekcja 6/13) -- tu służą do zadania pytania porównawczego.
    example_gloss: Kto jest starszy, Arjun czy Priya?
  hi.a1.unit14.lesson02.teach.topi_bag_review:
    title: 'Powtórka: czapka, torba'
    gloss: czapka, torba
    note: Oba rzeczowniki poznałeś w lekcji 7 o zakupach -- tu są dwiema porównywanymi rzeczami.
    example_gloss:
    - Ta czapka jest ładna.
    - Ta torba jest ładna.
  hi.a1.unit14.lesson02.teach.sasta_mehnga_review:
    title: 'Powtórka: tani, drogi'
    gloss: tani, drogi
    note: Poznane w lekcji 7 -- tu użyte do porównywania przedmiotów.
    example_gloss:
    - Torba jest tania.
    - Torba jest droga.
  hi.a1.unit14.lesson02.teach.sasti_mehngi_note:
    title: 'Formy żeńskie: sasti, mehngi'
    gloss: „Sasta” i „mehnga” przy słowach rodzaju żeńskiego zmieniają się w „sasti” i „mehngi” -- np. „topi sasti hai” (czapka jest tania).
    note: Krótkie przypomnienie reguły zgodności rodzaju z lekcji 7, potrzebne, bo „topi” (czapka) jest rodzaju żeńskiego.
  hi.a1.unit14.lesson02.teach.se_object_phrase:
    title: Czapka jest tańsza od torby.
    gloss: Czapka jest tańsza od torby.
    note: Wzór porównawczy z „se” zastosowany do dwóch przedmiotów zamiast dwóch osób.
  hi.a1.unit14.lesson02.teach.zyada_review:
    title: 'Powtórka: więcej'
    gloss: więcej
    note: W lekcji 13 poznane tylko z „pasand hai” (do wyrażania preferencji) -- ta lekcja uogólnia jego użycie.
    example_gloss: Bardziej lubię herbatę.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_grammar:
    title: Zyada w każdym porównaniu
    gloss: „Zyada” znałeś dotąd tylko z „pasand hai” (lekcja 13). Teraz może stać też przed DOWOLNYM przymiotnikiem w porównaniu -- „bag topi se zyada mehnga hai” znaczy „torba jest droższa od czapki”, dokładnie jak „bag topi se mehnga hai”. „Zyada” jest opcjonalne; po prostu wyraźnie mówi „bardziej”.
    note: Uogólnienie miejsca już poznanego słowa, a nie nowy punkt gramatyki.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_phrase:
    title: Torba jest droższa od czapki.
    gloss: Torba jest droższa od czapki.
    note: Ten sam wzór porównawczy z „se”, tu z opcjonalnym zyada („bardziej”).
  hi.a1.unit14.lesson02.teach.naya_nai:
    title: Nowy
    gloss: nowy (rodzaj męski / żeński)
    note: Nowa para przymiotników, zgodna z tym samym wzorem -a/-i co wszystkie przymiotniki w tej lekcji.
    example_gloss:
    - Torba jest nowa.
    - Czapka jest nowa.
  hi.a1.unit14.lesson02.teach.topi_nai_phrase:
    title: Czapka jest nowsza od torby.
    gloss: Czapka jest nowsza od torby.
    note: Druga cecha porównawcza (nowość) tych samych dwóch przedmiotów, spójna z już poznanym porównaniem cen.
  hi.a1.unit14.lesson03.teach.review_words:
    title: 'Powtórka: duży, mały, wysoki, nowy'
    gloss: duży/starszy, mały/młodszy, wysoki/długi, nowy
    note: Krótka powtórka kluczowych przymiotników tej lekcji, potrzebnych do dialogu i notatki do czytania.
    example_gloss:
    - Priya jest starsza.
    - Arjun jest młodszy.
    - Arjun jest wysoki.
    - Torba jest nowa.
  hi.a1.unit14.lesson03.teach.main_hun_review:
    title: 'Powtórka: ja, jestem'
    gloss: ja, jestem
    note: Wprowadzone w lekcji 1 ('main theek hun') – potrzebne, aby Arjun mógł mówić o sobie w dialogu.
    example_gloss: Wszystko u mnie dobrze.
  hi.a1.unit14.lesson03.teach.aur_bhi_review:
    title: 'Powtórka: i, też'
    gloss: i, też
    note: Oba słowa pojawiły się już we wcześniejszych dialogach, ale tutaj po raz pierwszy są wprowadzone jako słownictwo do przećwiczenia.
    example_gloss:
    - Lubię herbatę i kawę.
    - Ja też to lubię.
  hi.a1.unit14.lesson03.teach.ka_review:
    title: 'Powtórka: dopełniacz dzierżawczy (np. „Arjuna”)'
    gloss: partykuła dzierżawcza („należący do”)
    note: Partykuła dzierżawcza, której używaliśmy już w całym kursie (np. w lekcjach 5–11) – tu służy do mówienia o tym, czyje torby porównujemy.
    example_gloss: Torba Arjuna jest nowa.
  hi.a1.unit14.lesson03.teach.dialogue.line01:
    title: Arjun pokazuje swoją nową torbę
    gloss: Priyo, to jest moja nowa torba.
  hi.a1.unit14.lesson03.teach.dialogue.line02:
    title: Priya mówi, że czapka jest tańsza
    gloss: Ładna torba! Ale czapka jest tańsza od torby.
  hi.a1.unit14.lesson03.teach.dialogue.line03:
    title: Arjun przyznaje, że jego torba jest droga
    gloss: Tak. Moja torba jest droga – jest droższa od czapki.
  hi.a1.unit14.lesson03.teach.dialogue.line04:
    title: Priya pyta, kto jest starszy
    gloss: Dobra, dobra! Arjun, kto jest starszy, ty czy ja?
  hi.a1.unit14.lesson03.teach.dialogue.line05:
    title: Odpowiedź Arjuna
    gloss: Ty jesteś starsza, ale ja jestem wysoki!
  hi.a1.unit14.lesson03.teach.dialogue.line06:
    title: Priya mówi, że czapka jest też nowsza
    gloss: Dobra, dobra! Ale czapka jest też nowsza od torby.
  hi.a1.unit14.lesson03.teach.dialogue.line07:
    title: Arjun przyznaje rację i kończy rozmowę
    gloss: Tak, to prawda. Spotkamy się jutro znowu?
  hi.a1.unit14.lesson03.teach.dialogue.line08:
    title: Priya kończy rozmowę
    gloss: Dobrze! Do jutra.
  hi.a1.unit14.lesson03.teach.grammar_summary:
    title: Trzy główne zasady
    gloss: 'Trzy główne zasady tej lekcji: (1) ''X, Y se ADJ hai'' znaczy „X jest bardziej ADJ niż Y”; (2) ADJ zawsze zgadza się w rodzaju z podmiotem (X), a nie z Y; (3) przed ADJ można też dodać ''zyada'', np. ''X, Y se zyada ADJ hai'' – znaczenie pozostaje takie samo („bardziej ADJ niż”).'
    note: Podsumowanie całej gramatyki lekcji, podobnie jak notatka gramatyczna w lekcji 13, która łączyła cały paradygmat.
    target_text: 'इस यूनिट के तीन मुख्य नियम: (1) ''X, Y से ADJ है'' का मतलब है ''X jest bardziej ADJ niż Y''; (2) ADJ हमेशा विषय (X) के लिंग से मेल खाता है, Y से नहीं; (3) ADJ से पहले ''ज़्यादा'' भी जोड़ सकते हैं, जैसे ''X, Y से ज़्यादा ADJ है'' -- मतलब वही रहता है (''bardziej ADJ niż'')।'
  hi.a1.unit14.lesson03.teach.priya_note:
    title: Notatka Priyi
    gloss: Jestem starsza od Arjuna, ale Arjun jest wysoki. A moja czapka jest ładna – czapka jest tańsza od torby i też nowsza od torby. – Priya
    note: Krótka notatka powtarzająca dokładnie te fakty, które padły w dialogu, bez nowych informacji.
    glosses:
      बड़ी: starsza
      लंबा: wysoki
      टोपी: czapka
      अच्छी: ładna / dobra
      बैग: torba
      सस्ती: tańsza / tania
      नई: nowsza / nowa
exercises:
