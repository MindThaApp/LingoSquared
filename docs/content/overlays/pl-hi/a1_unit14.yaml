  hi.a1.unit14.lesson01.exercise06.match_lesson01_words:
    instruction: Dopasuj każde hindi słowo do jego polskiego znaczenia.
    correct_response:
      बड़ा: duży / starszy (r. m.)
      बड़ी: duża / starsza (r. ż.)
