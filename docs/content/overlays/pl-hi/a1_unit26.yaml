teaching:
  hi.a1.unit26.lesson01.teach.jaiket_svetar:
    title: Płaszcz, sweter
    gloss: płaszcz, sweter
    note: '*जैकेट* jest rodzaju żeńskiego, a *स्वेटर* męskiego, co widać po słowach, które z nimi występują: *मेरी जैकेट*, *मेरा स्वेटर*.'
    example_gloss:
    - Szukam płaszcza.
    - Mam sweter.
  hi.a1.unit26.lesson01.teach.paint_joote:
    title: Spodnie, buty
    gloss: spodnie, buty
    note: '*पैंट* to jedno słowo oznaczające jedną parę spodni (*मेरी पैंट*), a *जूते* to liczba mnoga od *जूता*: rzeczownik rodzaju męskiego zakończony na *-आ* przyjmuje w liczbie mnogiej końcówkę *-ए*.'
    example_gloss:
    - Szukam spodni.
    - Szukam butów.
  hi.a1.unit26.lesson01.teach.main_ek_jaiket:
    title: Mówienie, czego szukasz
    gloss: Szukam płaszcza.
    note: 'Czasownik stoi na końcu: *मैं एक जैकेट ढूँढ़ रहा हूँ*. *रहा हूँ* oddaje czynność trwającą teraz („szukam”), a *रहा* to forma męska (kobieta mówi *रही*).'
  hi.a1.unit26.lesson02.teach.saiz:
    title: Rozmiar
    gloss: rozmiar
    note: '*साइज़* to rzeczownik rodzaju męskiego, więc słowa, które z nim występują, też są w rodzaju męskim: *मेरा साइज़*.'
    example_gloss: Jaki rozmiar Pan/Pani nosi?
  hi.a1.unit26.lesson02.teach.apka_saiz_kya:
    title: Pytanie o rozmiar
    gloss: Jaki nosisz rozmiar?
    note: '*कौन सा* („który”) pyta o jeden wybór spośród kilku, a *सा* zgadza się z rzeczownikiem: *कौन सा साइज़*, ale *कौन सी जैकेट*. *आप* to grzeczna forma „ty/Pan/Pani”, używana wobec sprzedawcy.'
  hi.a1.unit26.lesson02.teach.mera_saiz_em:
    title: Podawanie swojego rozmiaru
    gloss: Mam rozmiar M.
    note: 'W hindi nie używa się tu czasownika „mieć”: *मेरा साइज़ एम है* dosłownie znaczy „mój rozmiar to M”, a *मेरा* zgadza się z rzeczownikiem męskim *साइज़*.'
  hi.a1.unit26.lesson03.teach.kala_neela:
    title: Czarny, niebieski
    gloss: czarny, niebieski
    note: Dwa podstawowe przymiotniki oznaczające kolory w tej lekcji.
    example_gloss:
    - Chcę ten płaszcz w czarnym kolorze.
    - Czy ma Pan/Pani to też w niebieskim?
  hi.a1.unit26.lesson03.teach.mujhe_vah_jaiket:
    title: Prośba o kolor
    gloss: Chcę ten płaszcz w czarnym kolorze.
    note: '*मुझे ... चाहिए* to sposób, w jaki hindi mówi „chcę”: pragnienie dzieje się „u mnie” (*मुझे*), a pożądana rzecz stoi tuż przed *चाहिए*.'
  hi.a1.unit26.lesson03.teach.kya_apke_pas:
    title: Pytanie o inny kolor
    gloss: Czy ma Pan/Pani to też w niebieskim?
    note: '*आपके पास ... है?* („przy Panu/Pani ... jest?”) to grzeczny sposób zapytania „czy ma Pan/Pani ...?”, a *भी* („też”) stoi po słowie, które uzupełnia.'
  hi.a1.unit26.lesson04.teach.kya_yah_jaiket:
    title: Pytanie o dopasowanie
    gloss: Czy ten płaszcz ci pasuje?
    note: 'Hindi mówi o ubraniach, że „przychodzą dobrze”: *ठीक आती है*. Czasownik zgadza się z rzeczą, więc przy żeńskiej *जैकेट* jest *आती*, a przy męskim *स्वेटर* byłoby *आता*.'
  hi.a1.unit26.lesson04.teach.yah_ekdam_theek:
    title: Potwierdzenie, że ubranie pasuje
    gloss: Dobrze leży.
    note: '*एकदम* („całkiem, zupełnie”) daje znaczenie „leży idealnie”; *आती है* zgadza się z rzeczownikiem żeńskim *जैकेट*.'
  hi.a1.unit26.lesson04.teach.yah_bahut_chhotee:
    title: Za małe
    gloss: Jest za małe.
    note: '*बहुत* stoi przed przymiotnikiem i tu daje znaczenie „za”: *बहुत छोटी*. Przymiotnik zgadza się z rzeczownikiem żeńskim *जैकेट*.'
  hi.a1.unit26.lesson04.teach.yah_bahut_baree:
    title: Za duże
    gloss: Jest za duże.
    note: 'Ten sam wzór z *बड़ी*: *बड़ा* zmienia się w *बड़ी* przy rzeczowniku żeńskim, więc *बहुत बड़ी*.'
  hi.a1.unit26.lesson05.teach.nabbe:
    title: Dziewięćset
    gloss: dziewięćset
    note: '*नौ सौ* to liczba 900, użyta w cenie kurtki.'
    example_gloss: Kurtka kosztuje dziewięćset rupii.
  hi.a1.unit26.lesson05.teach.jaiket_kee_keemat:
    title: Podawanie ceny
    gloss: Kurtka kosztuje dziewięćset rupii.
    note: 'Hindi mówi „cena kurtki wynosi ...”: *जैकेट की कीमत नौ सौ रुपये है*. *की* zgadza się z rzeczownikiem żeńskim *कीमत*, a nie z *जैकेट*.'
  hi.a1.unit26.lesson05.teach.sardee_kee_jaiket:
    title: Czytanie paragonu ze sklepu
    gloss: 'Kurtka zimowa: rozmiar M, kolor czarny. Cena: dziewięćset rupii. Ta kurtka świetnie leży i jest ciepła.'
    note: Zwróć uwagę na rozmiar, kolor, cenę i dwie cechy płaszcza.
    glosses:
      सर्दी: zimowa (kurtka)
      साइज़: rozmiar
      रंग: kolor
      काला: czarny
      कीमत: cena
      नौ: dziewięć
      सौ: sto
      रुपये: rupie
      जैकेट: płaszcz
      आती: leży
      गर्म: ciepły
  hi.a1.unit26.lesson06.teach.priya_yah_jaiket:
    title: Priya zauważa kurtkę
    gloss: 'Priya: Ta kurtka jest świetna! Jaki masz rozmiar?'
    note: '*अच्छी* zgadza się z rzeczownikiem żeńskim *जैकेट*. *तुम्हारा* to nieformalne „twój”, używane między przyjaciółmi.'
  hi.a1.unit26.lesson06.teach.arjun_mera_saiz:
    title: Arjun prosi o przymierzenie
    gloss: 'Arjun: Mam rozmiar M. Czy mogę ją przymierzyć?'
    note: '*पहनकर देखना* („włożyć i zobaczyć”) to sposób, w jaki hindi mówi „przymierzyć”. *सकता हूँ* znaczy „mogę”, a kobieta mówi *सकती हूँ*.'
  hi.a1.unit26.lesson06.teach.priya_zaroor_kya:
    title: Priya pyta o dopasowanie
    gloss: 'Priya: Jasne. Dobrze leży?'
    note: '*यह* znaczy „to” lub „ta”, a *आती* zgadza się z rzeczownikiem żeńskim *जैकेट*.'
  hi.a1.unit26.lesson06.teach.arjun_han_yah:
    title: Arjun potwierdza
    gloss: 'Arjun: Tak, leży idealnie i jest ciepła.'
    note: Zgadza się dokładnie z paragonem przeczytanym wcześniej – to ten sam płaszcz.
  hi.a1.unit26.lesson06.teach.priya_barhiya_tum:
    title: Priya pyta o kolor
    gloss: 'Priya: Świetnie! Weźmiesz ją w czarnym czy w niebieskim?'
    note: '*या* („albo”) daje wybór. Drugie *रंग* można pominąć: *काले रंग में ... या नीले में*. *तुम* jest nieformalne.'
  hi.a1.unit26.lesson06.teach.arjun_main_ise:
    title: Arjun podejmuje decyzję
    gloss: 'Arjun: Wezmę ją w czarnym.'
    note: '*लूँगा* to czas przyszły od *लेना* („brać”), zwykłego czasownika używanego przy decyzji w sklepie. Kobieta mówi *लूँगी*.'
  hi.a1.unit26.lesson06.teach.main_leta_hoon:
    title: लेता हूँ i लेता है
    gloss: Biorę, on bierze.
    note: '*-ता* to końcówka czynności powtarzalnej i zgadza się z podmiotem, a *हूँ* występuje z *मैं*, natomiast *है* z *वह*.'
