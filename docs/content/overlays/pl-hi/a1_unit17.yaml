    instruction: Co oznacza to słowo?
    correct_option: Nauczyciel
    distractors:
    - Lekarz
    - Inżynier
    accepted_answers:
    - Nauczyciel
  hi.a1.unit17.lesson01.exercise02.select_shikshika_meaning:
    instruction: Co oznacza to słowo?
    correct_option: Nauczycielka
    distractors:
    - Lekarz
    - Inżynier
    accepted_answers:
    - Nauczycielka
  hi.a1.unit17.lesson01.exercise03.select_mein_shikshak_hoon_meaning:
    instruction: Co oznacza to zdanie?
    correct_option: Jestem nauczycielem.
    distractors:
