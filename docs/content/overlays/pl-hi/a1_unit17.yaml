    feedback: Mein injiniyar hoon – „injiniyar” znaczy „inżynier” i nie zmienia się w zależności od płci mówiącego.
  hi.a1.unit17.lesson01.exercise10.fill_arjun_tum_karte:
    instruction: 'Uzupełnij zdanie, pytając Arjuna (mężczyznę), czym się zajmuje: अर्जुन, तुम क्या काम ___ हो?'
