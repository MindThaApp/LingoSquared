      right: nauczyciel
    - left: शिक्षिका
      right: nauczycielka
    - left: इंजीनियर
      right: inżynier
    - left: डॉक्टर
      right: lekarz
    - left: काम
      right: pracować
    - left: करते
      right: robisz (ty, mężczyzna)
    - left: करती
      right: robisz (ty, kobieta)
    - left: तुम
      right: ty (nieformalnie)
    - left: क्या
      right: co
    - left: हूँ
      right: jestem
  hi.a1.unit17.lesson01.exercise07.order_mein_shikshak_hoon:
    instruction: 'Ułóż zdanie we właściwej kolejności: Jestem nauczycielem.'
    correct_response:
