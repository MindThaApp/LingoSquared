review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  notes: 'Derived from en-hi by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Polish string was translated and adapted. Needs native Polish review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  occupation_identity: '"मैं + occupation + हूँ" states identity, e.g. "मैं शिक्षक हूँ" (I am a teacher). *Shikshak* (male) and *shikshika* (female) are NOT interchangeable typed answers -- when an exercise''s context establishes a specific speaker''s gender (e.g. Priya, established female), only the matching form should be marked correct, not both.'
  workplace_mein: '"[place] + में + काम करता/करती हूँ" states where someone works. A typed answer that drops *mein* entirely (e.g. "मैं दफ़्तर काम करता हूँ") is the exact ungrammatical error this unit''s own grammar_check exercise targets, and should be marked incorrect, not tolerated as a minor typo.'
  addressee_gender_verbs: '*Karte*/*karti*/*karta* agree with either the addressee (तुम-form) or the speaker (मैं-form), matching unit 10''s already-established -ता/-ती/ -ते rule. A typed answer using the wrong gender-agreement form for an exercise anchored to a named, established-gender character (Arjun = male, Priya = female) should be marked incorrect as a real grammar error, not tolerated.'
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. इंजीनियर uses anusvara (ं), verified via direct codepoint check -- accept only the anusvara form, not a chandrabindu substitution, since the two mark structurally different phonological patterns (nasal-before- consonant vs. nasalized word-final vowel) and this course's own established convention (हूँ/नहीं/हाँ) uses chandrabindu only for the latter.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation. For any exercise asking the learner to state their own occupation or workplace, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: Hindi A1
units:
  hi.a1.unit17.work:
    title: Praca
lessons:
  hi.a1.unit17.lesson01.shikshak_shikshika_engineer:
    title: Nauczyciel i inżynier
  hi.a1.unit17.lesson02.school_aspatal_daftar:
    title: Szkoła, szpital i biuro
  hi.a1.unit17.lesson03.priya_arjun_kaam:
    title: 'Priya i Arjun: czym się zajmujesz?'
teaching:
  hi.a1.unit17.lesson01.teach.tum_tumhara_kya_review:
    title: 'Powtórka: ty, twój, co'
    gloss: ty (nieformalnie), twój (nieformalnie), co
    note: Krótka powtórka słów potrzebnych, by zapytać znajomego o pracę.
    example_gloss: Jak masz na imię?
  hi.a1.unit17.lesson01.teach.arjun_priya_review:
    title: 'Powtórka: Arjun, Priya'
    gloss: Arjun, Priya
    note: Przypomnienie imion obu bohaterów, zanim ta lekcja posłuży się nimi w pytaniach zależnych od rodzaju.
    example_gloss:
    - Mam na imię Arjun.
    - Mam na imię Priya.
  hi.a1.unit17.lesson01.teach.copula_review:
    title: 'Powtórka: ja, jestem, jest, jesteś'
    gloss: ja, jestem, jest, jesteś (nieformalnie)
    note: Cały mały zestaw form czasownika „być” potrzebny do zdań o tożsamości w tej lekcji.
    example_gloss:
    - Wszystko w porządku?
    - U mnie wszystko w porządku.
  hi.a1.unit17.lesson01.teach.kaam_review:
    title: 'Powtórka: praca'
    gloss: praca
    note: Wprowadzone w rozdziale 10/11 – tu wraca jako słowo przewodnie całej lekcji.
    example_gloss: Mam coś do zrobienia.
  hi.a1.unit17.lesson01.teach.karte_karti_karta_verb:
    title: Robić (ty, mężczyzna / ty, kobieta / ja, mężczyzna)
    gloss: robisz (ty, mężczyzna, nieformalnie), robisz (ty, kobieta, nieformalnie), robię (ja, mężczyzna)
    note: Rozszerza znaną już z rozdziału 10 zasadę zgodności końcówek -ta/-ti/-te (widoczną też w *kya tum yog karti ho?* w rozdziale 1) na czasownik *karna* (robić).
    example_gloss:
    - Czym się zajmujesz?
    - Jem śniadanie.
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karte_ho_phrase:
    title: Czym się zajmujesz? (do mężczyzny)
    gloss: Czym się zajmujesz?
    note: Pytanie otwierające tę lekcję, skierowane do przyjaciela.
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karti_ho_phrase:
    title: Czym się zajmujesz? (do kobiety)
    gloss: Czym się zajmujesz?
    note: To samo pytanie do przyjaciółki – zmienia się tylko końcówka czasownika.
  hi.a1.unit17.lesson01.teach.shikshak_shikshika:
    title: Nauczyciel / nauczycielka
    gloss: nauczyciel, nauczycielka
    note: Nowa para nazw zawodów. Inaczej niż większość dotychczasowych rzeczowników, ten zmienia się zależnie od płci MÓWIĄCEGO – zobacz notkę gramatyczną tej lekcji.
    example_gloss:
    - Jestem nauczycielem.
    - Jestem nauczycielką.
  hi.a1.unit17.lesson01.teach.grammar_occupation_gender:
    title: Mein + zawód + hoon
    gloss: '„Mein + zawód + hoon” podaje zawód – to dobrze znany wzór „mein...hoon” z rozdziału 1. Niektóre zawody zmieniają się zależnie od płci mówiącego: „shikshak” (mężczyzna), „shikshika” (kobieta), tak jak w rozdziale 10 zmieniała się końcówka czasownika -ta/-ti. „Doctor” i „engineer” się nie zmieniają – to to samo słowo dla obu płci.'
    note: Od razu pokazuje podział na dwie grupy (rzeczowniki zmieniające się z rodzajem i niezmienne zapożyczenia), zanim jakiekolwiek ćwiczenie zacznie na nim polegać.
  hi.a1.unit17.lesson01.teach.doctor_review:
    title: 'Powtórka: lekarz'
    gloss: lekarz
    note: Wprowadzone w rozdziale 16 – tu wraca jako zawód niezmienny ze względu na płeć.
    example_gloss: On jest lekarzem. / Ona jest lekarką.
  hi.a1.unit17.lesson01.teach.mein_doctor_hoon_phrase:
    title: Jestem lekarzem. / Jestem lekarką.
    gloss: Jestem lekarzem. / Jestem lekarką.
    note: Wzór tożsamości zastosowany do powtarzanego słowa.
  hi.a1.unit17.lesson01.teach.engineer:
    title: Inżynier
    gloss: inżynier
    note: Nowa nazwa zawodu, niezmienna ze względu na płeć, tak jak *lekarz*.
    example_gloss: On jest inżynierem. / Ona jest inżynierką.
  hi.a1.unit17.lesson01.teach.mein_engineer_hoon_phrase:
    title: Jestem inżynierem. / Jestem inżynierką.
    gloss: Jestem inżynierem. / Jestem inżynierką.
    note: Wzór tożsamości zastosowany do drugiego nowego zawodu w tej lekcji.
  hi.a1.unit17.lesson02.teach.kahan_review:
    title: 'Powtórka: gdzie'
    gloss: gdzie
    note: Wprowadzone w rozdziale 1 – tu użyte do pytania o miejsce pracy.
    example_gloss: Gdzie jest szpital?
  hi.a1.unit17.lesson02.teach.mein_review:
    title: 'Powtórka: w'
    gloss: w
    note: Wprowadzone w rozdziale 1 – tu użyte do nazwania miejsca pracy.
    example_gloss: Mieszkam w Londynie.
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karte_ho_phrase:
    title: Gdzie pracujesz? (do mężczyzny)
    gloss: Gdzie pracujesz?
    note: Pytanie otwierające tę lekcję, skierowane do przyjaciela.
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karti_ho_phrase:
    title: Gdzie pracujesz? (do kobiety)
    gloss: Gdzie pracujesz?
    note: To samo pytanie do przyjaciółki.
  hi.a1.unit17.lesson02.teach.school_review:
    title: 'Powtórka: szkoła'
    gloss: szkoła
    note: Wprowadzone w rozdziale 8 – pierwsze miejsce pracy w tej lekcji.
    example_gloss: Pracuję w szkole (mówi kobieta).
  hi.a1.unit17.lesson02.teach.mein_school_mein_kaam_karti_hoon_phrase:
    title: Pracuję w szkole.
    gloss: Pracuję w szkole.
    note: Wzór miejsca pracy zastosowany do szkoły, forma żeńska.
  hi.a1.unit17.lesson02.teach.hospital_review:
    title: 'Powtórka: szpital'
    gloss: szpital
    note: Wprowadzone w rozdziale 8 – drugie miejsce pracy w tej lekcji, w parze z zawodem lekarza.
    example_gloss: Lekarz pracuje w szpitalu.
  hi.a1.unit17.lesson02.teach.daftar:
    title: Biuro
    gloss: biuro
    note: Nowy rzeczownik, trzecie miejsce pracy w tej lekcji, w parze z zawodem inżyniera.
    example_gloss: Pracuję w biurze (mówi mężczyzna).
  hi.a1.unit17.lesson02.teach.mein_daftar_mein_kaam_karta_hoon_phrase:
    title: Pracuję w biurze.
    gloss: Pracuję w biurze.
    note: Wzór miejsca pracy zastosowany do biura, forma męska.
  hi.a1.unit17.lesson02.teach.grammar_workplace:
    title: Miejsce + mein + kaam karta/karti hoon
    gloss: '„[Miejsce] + mein + kaam karta/karti hoon” łączy trzy znane już elementy: „mein” (rozdział 1, „London mein rehta hoon”), „kaam” (rozdział 10/11) oraz formę -ta/-ti/-te czasownika „karna” (rozdział 10, „nashta karta hoon”, i rozdział 1, „kya tum yog karti ho?”). To nie jest nowa gramatyka – po prostu trzy elementy połączone po raz pierwszy w jednym zdaniu.'
    note: Wymienia każdy znany element z numerem rozdziału przed ich połączeniem, tak jak we wszystkich poprzednich notkach gramatycznych.
  hi.a1.unit17.lesson03.teach.roz_review:
    title: 'Powtórka: codziennie'
    gloss: codziennie
    note: Wprowadzone w rozdziale 10 – tu użyte do opisu codziennej rutyny w pracy.
    example_gloss: Pracuję codziennie.
  hi.a1.unit17.lesson03.teach.jaana_forms_review:
    title: 'Powtórka: iść (ty, kobieta / ty, mężczyzna / ja, mężczyzna)'
    gloss: chodzisz (ty, kobieta, nieformalnie), chodzisz (ty, mężczyzna, nieformalnie), chodzę (ja, mężczyzna)
    note: Znane już formy -ta/-ti/-te czasownika *jana* (iść), wprowadzone w rozdziale 10, użyte tu do codziennej drogi do pracy.
    example_gloss:
    - Codziennie chodzę do szkoły (mówi kobieta).
    - Czy codziennie chodzisz do biura? (do mężczyzny)
  hi.a1.unit17.lesson03.teach.bhi_haan_review:
    title: 'Powtórka: też, tak'
    gloss: też, tak
    note: Oba zostały już omówione (w lekcji 1 oraz w lekcjach 1/6/13) – wykorzystane ponownie w dialogu tej lekcji.
    example_gloss: Tak, to też mi się podobało.
  hi.a1.unit17.lesson03.teach.dialogue.line01:
    title: Arjun pyta Priyę o jej pracę
    gloss: Priya, czym się zajmujesz?
  hi.a1.unit17.lesson03.teach.dialogue.line02:
    title: Priya mówi, że jest nauczycielką w szkole
    gloss: Jestem nauczycielką. Pracuję w szkole.
  hi.a1.unit17.lesson03.teach.dialogue.line03:
    title: Arjun pyta, czy chodzi do szkoły codziennie
    gloss: Super! Chodzisz do szkoły codziennie?
  hi.a1.unit17.lesson03.teach.dialogue.line04:
    title: Priya potwierdza i zadaje Arjunowi to samo pytanie
    gloss: Tak, codziennie chodzę do szkoły. A ty czym się zajmujesz?
  hi.a1.unit17.lesson03.teach.dialogue.line05:
    title: Arjun mówi, że jest inżynierem i pracuje w biurze
    gloss: Jestem inżynierem. Pracuję w biurze.
  hi.a1.unit17.lesson03.teach.dialogue.line06:
    title: Priya pyta, czy on też chodzi do biura codziennie
    gloss: Świetnie! Ty też chodzisz do biura codziennie?
  hi.a1.unit17.lesson03.teach.dialogue.line07:
    title: Arjun potwierdza
    gloss: Tak, codziennie chodzę do biura.
  hi.a1.unit17.lesson03.teach.dialogue.line08:
    title: Priya mu dziękuje
    gloss: Dobrze, dziękuję.
  hi.a1.unit17.lesson03.teach.grammar_summary:
    title: Trzy główne zasady
    gloss: 'Trzy główne zasady tej lekcji: (1) „mein + zawód + hoon” podaje zawód (np. „mein shikshika hoon”), a niektóre nazwy zawodów zmieniają się w zależności od płci mówiącego; (2) „[miejsce] + mein + kaam karta/karti hoon” podaje miejsce pracy (np. „mein daftar mein kaam karta hoon”); (3) „roz [miejsce] jata/jati hoon” wyraża codzienny zwyczaj – to ta sama zasada -ta/-ti co w lekcji 10.'
    note: Końcowe podsumowanie łączące gramatykę całej lekcji, podobnie jak notatki gramatyczne w lekcjach 15 i 16.
  hi.a1.unit17.lesson03.teach.work_profile_reading:
    title: Czytamy krótki profil
    gloss: Priya jest nauczycielką. Pracuje w szkole. Arjun jest inżynierem. Pracuje w biurze.
    note: 'Krótki, prosty profil (bez nowej fabuły), który powtarza dokładnie te fakty, które padły w dialogu, bez nowych informacji – służy celowi lekcji: czytaniu krótkiego opisu pracy.'
    glosses:
      शिक्षिका: nauczycielka
      स्कूल: szkoła
      काम: praca
      करती: robi / pracuje (rodzaj żeński, od करना)
      इंजीनियर: inżynier
      दफ़्तर: biuro
      करता: robi / pracuje (rodzaj męski, od करना)
exercises:
