    - हूँ
  hi.a1.unit17.lesson01.exercise08.order_tum_kya_kaam_karti_ho:
    instruction: 'Ułóż zdanie we właściwej kolejności: Czym się zajmujesz? (do kobiety)'
    correct_response:
