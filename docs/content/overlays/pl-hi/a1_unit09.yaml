answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. No new spelling AMBIGUITY was needed for this unit's own new vocabulary -- बाएँ/दाएँ/जाऊँ all follow the already-established non-ascending-vowel-sign chandrabindu rule from units 01-08 (यहाँ, वहाँ, कहाँ). In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
units:
  hi.a1.unit09.directions:
    title: Wskazywanie drogi
lessons:
  hi.a1.unit09.lesson01.seedhe_baaen_daaen:
    title: Prosto, w lewo, w prawo
  hi.a1.unit09.lesson02.yahan_se_kaise_jaun:
    title: Jak tam trafić?
  hi.a1.unit09.lesson03.priya_arjun_rasta_poochna:
    title: 'Priya i Arjun: pytanie o drogę'
teaching:
  hi.a1.unit09.lesson01.teach.review_places:
    title: 'Powtórka: miejsca'
    gloss: bank, szkoła, szpital, park, stacja, poczta
    note: Szybka powtórka nazw miejsc z poprzedniej lekcji – w tej lekcji bardzo często do nich wracamy.
    example_gloss:
    - Bank jest tutaj.
    - Poczta jest blisko banku.
  hi.a1.unit09.lesson01.teach.review_function_words:
    title: 'Powtórka: jest, gdzie, tutaj, tam, z, partykuła dopełniacza, w porządku'
    gloss: jest, gdzie, tutaj, tam, z/od, partykuła dopełniacza (np. „banku”), w porządku
    note: Szybka powtórka małych słówek funkcyjnych z wcześniejszych lekcji, do których wracają ćwiczenia w tej lekcji.
    example_gloss:
    - Gdzie jest bank?
    - Park jest tam.
  hi.a1.unit09.lesson01.teach.seedhe_baaen_daaen:
    title: Prosto, w lewo, w prawo
    gloss: prosto, w lewo, w prawo
    note: Trzy podstawowe określenia kierunku w tej lekcji.
    example_gloss:
    - Proszę iść prosto.
    - Proszę skręcić w lewo.
  hi.a1.unit09.lesson01.teach.jao_muro:
    title: Idź!, skręć!
    gloss: idź!, skręć! (rozkaz nieformalny)
    note: Rozkazy w formie tum – naturalny rejestr, gdy dwoje przyjaciół wskazuje sobie drogę.
    example_gloss:
    - Proszę iść prosto.
    - Skręć w prawo.
  hi.a1.unit09.lesson01.teach.yahan_se_seedhe_jao:
    title: Idź stąd prosto
    gloss: Idź stąd prosto.
    note: Łączy nowe słowa z tej lekcji z „yahaan se” (stąd).
  hi.a1.unit09.lesson01.teach.baaen_muro_phrase:
    title: Skręć w lewo
    gloss: Proszę skręcić w lewo.
    note: Samodzielne polecenie, gotowe do użycia.
  hi.a1.unit09.lesson01.teach.daaen_muro_phrase:
    title: Skręć w prawo
    gloss: Proszę skręcić w prawo.
    note: Lustrzane polecenie do „baaen muro”.
  hi.a1.unit09.lesson01.teach.imperative_note:
    title: Końcówka rozkazu -o
    gloss: „Jaao” i „muro” to rozkazy w formie tum, tak jak „bataao” i „gino” – wszystkie kończą się na „-o”.
    note: Wskazuje wspólny wzorzec nieformalnego rozkazu na przykładzie dwóch słów poznanych wcześniej (bataao w lekcji 7, gino w lekcji 2).
  hi.a1.unit09.lesson02.teach.bank_kaise_jaun:
    title: Jak dojść do banku?
    gloss: Jak dojść do banku?
    note: Podstawowe pytanie przy pytaniu o drogę, w formie pierwszej osoby „czy mam iść”.
  hi.a1.unit09.lesson02.teach.tak:
    title: Aż do / do
    gloss: aż do / do
    note: Poznane już w lekcji 2 przy liczeniu („zero se das tak”); tu użyte w równie prawdziwym znaczeniu przestrzennym.
    example_gloss: Idź prosto aż do banku.
  hi.a1.unit09.lesson02.teach.bank_tak_seedhe_jao:
    title: Idź prosto aż do banku
    gloss: Idź prosto aż do banku.
    note: Przykładowe zdanie, w którym „tak” użyto w znaczeniu przestrzennym.
  hi.a1.unit09.lesson02.teach.pahle_phir:
    title: Najpierw, potem
    gloss: najpierw, potem
    note: Para słów służąca do uporządkowania dwóch kroków wskazówek drogi.
    example_gloss:
    - Najpierw idź prosto.
    - Potem skręć w lewo.
  hi.a1.unit09.lesson02.teach.pahle_seedhe_phir_baaen:
    title: Najpierw prosto, potem w lewo
    gloss: Najpierw idź prosto, potem skręć w lewo.
    note: Łączy „pahle” i „phir” w jedno dwuetapowe polecenie.
  hi.a1.unit09.lesson02.teach.pahle_phir_note:
    title: Pahle i phir
    gloss: „Pahle” i „phir” łączą dwa kroki – pierwsza czynność idzie z „pahle”, druga z „phir”, jak w zdaniu „pahle seedhe jaao, phir baaen muro”.
    note: 'Przydatna zasada gramatyczna: jak podawać wskazówki drogi składające się z kilku kroków.'
  hi.a1.unit09.lesson03.teach.nukkad:
    title: Róg ulicy
    gloss: róg ulicy
    note: Nowe słowo oznaczające miejsce, użyte w końcowym dialogu lekcji, z „par” (na/przy).
    example_gloss:
    - Bank jest na rogu.
    - Park jest za szkołą.
  hi.a1.unit09.lesson03.teach.bas:
    title: Tylko / jeszcze tylko
    gloss: tylko / jeszcze tylko
    note: Jest to też częste zapożyczenie oznaczające „autobus” (pojazd), ale to znaczenie nie jest wprowadzane w tym kursie, więc nie ma tu realnej niejednoznaczności.
    example_gloss: Idź jeszcze tylko trochę dalej.
  hi.a1.unit09.lesson03.teach.samajh_gaya:
    title: Zrozumiałem / rozumiem
    gloss: zrozumiałem / rozumiem
    note: 'Częsty zwrot dwuwyrazowy: „samajh” (temat czasownika „samajhna”, rozumieć) plus „gaya” (poszedł), co oznacza czynność dokonaną. To forma męska – Priya powiedziałaby „samajh gayi”.'
    example_gloss: Zrozumiałem. / Jasne.
  hi.a1.unit09.lesson03.teach.accha_bahut_shukriya:
    title: Dobrze! Bardzo dziękuję!
    gloss: Dobrze! Bardzo dziękuję!
    note: Wykorzystuje ponownie „accha”, „bahut” i „shukriya” z wcześniejszych lekcji.
  hi.a1.unit09.lesson03.teach.koi_baat_nahin_phir_milenge:
    title: Nie ma sprawy! Do zobaczenia.
    gloss: Nie ma sprawy! Do zobaczenia.
    note: Standardowe zakończenie rozmowy w tym kursie, powtórzone słowo w słowo z lekcji 8.
  hi.a1.unit09.lesson03.teach.dialogue.line01:
    title: Arjun pyta o drogę na pocztę
    gloss: Arjun pyta Priyę, jak dojść na pocztę.
    note: Wykorzystuje ponownie wzorzec pytania z lekcji 2.
  hi.a1.unit09.lesson03.teach.dialogue.line02:
    title: Priya zaczyna tłumaczyć drogę
    gloss: 'Priya mówi: stąd najpierw idź prosto.'
    note: Wykorzystuje ponownie „yahaan se” i „pahle” z wcześniejszej części lekcji.
  hi.a1.unit09.lesson03.teach.dialogue.line03:
    title: Arjun pyta, co dalej
    gloss: Arjun mówi „dobrze” i pyta, co dalej.
  hi.a1.unit09.lesson03.teach.dialogue.line04:
    title: Priya mówi dalej
    gloss: 'Priya mówi: potem na rogu przy banku skręć w lewo.'
    note: Wprowadza „nukkad” (róg ulicy) w kontekście.
  hi.a1.unit09.lesson03.teach.dialogue.line05:
    title: Arjun potwierdza i pyta ponownie
    gloss: Arjun powtarza „w lewo”, potwierdza i pyta, co dalej.
  hi.a1.unit09.lesson03.teach.dialogue.line06:
    title: Priya kończy opisywać pierwszą trasę
    gloss: 'Priya mówi: idź jeszcze tylko trochę dalej – poczta jest tam, koło banku.'
    note: Wprowadza „bas” (tylko) i zgadza się z faktem z lekcji 8, że poczta jest koło banku.
  hi.a1.unit09.lesson03.teach.dialogue.line07:
    title: Arjun rozumie i pyta o park
    gloss: Arjun mówi, że zrozumiał, i pyta, jak dojść do parku.
    note: Wprowadza zwrot „samajh gaya”.
  hi.a1.unit09.lesson03.teach.dialogue.line08:
    title: Priya opisuje drugą trasę
    gloss: 'Priya mówi: park? Najpierw idź prosto, potem skręć w prawo – park jest za szkołą.'
    note: Zgadza się z faktem z lekcji 8, że park jest za szkołą.
  hi.a1.unit09.lesson03.teach.dialogue.line09:
    title: Arjun dziękuje Priyi
    gloss: Arjun mówi, że zrozumiał, i bardzo dziękuje Priyi.
  hi.a1.unit09.lesson03.teach.dialogue.line10:
    title: Priya kończy rozmowę
    gloss: 'Priya mówi: nie ma sprawy, do zobaczenia.'
    note: To samo zakończenie co w dialogu z lekcji 8, powtórzone słowo w słowo.
