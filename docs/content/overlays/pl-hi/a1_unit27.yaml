teaching:
  hi.a1.unit27.lesson01.teach.khush_udas_naraz:
    title: Zadowolony, smutny i zły
    gloss: zadowolony, smutny, zły
    note: '*खुश*, *उदास* i *नाराज़* to podstawowe słowa opisujące uczucia, które występują z *हूँ* lub *है* („jestem”, „jest”); nie zmieniają się według rodzaju.'
    example_gloss:
    - Jestem zadowolony.
    - Jest mi smutno.
    - Jestem zły.
  hi.a1.unit27.lesson01.teach.main_khush_hoon:
    title: Mówimy, że jesteś zadowolony
    gloss: Jestem zadowolony.
    note: '*मैं खुश हूँ* ma wzór *मैं* + uczucie + *हूँ*, czyli „jestem ...”.'
  hi.a1.unit27.lesson01.teach.main_naraz_naheen:
    title: Zestawianie uczuć
    gloss: Nie jestem zły, jestem smutny.
    note: '*नहीं* stoi tuż przed *हूँ*: *नाराज़ नहीं हूँ*. Druga część nazywa wtedy prawdziwe uczucie.'
  hi.a1.unit27.lesson02.teach.tum_khush_kyon:
    title: Pytanie o powód
    gloss: Dlaczego jesteś zadowolony?
    note: '*क्यों* („dlaczego”) stoi przed głównym słowem: *तुम खुश क्यों हो?*. *तुम* to nieformalne „ty”.'
  hi.a1.unit27.lesson02.teach.main_khush_hoon:
    title: Podawanie powodu
    gloss: Jestem zadowolony, bo mam nowe mieszkanie.
    note: '*क्योंकि* wprowadza przyczynę. *मेरे पास ... है* znaczy „mam”, a czasownik *है* stoi na końcu.'
  hi.a1.unit27.lesson02.teach.main_udas_hoon:
    title: Negatywny powód
    gloss: Jestem smutny, bo pada deszcz.
    note: '*बारिश हो रही है* znaczy „pada deszcz” (dosłownie: „deszcz się dzieje”).'
  hi.a1.unit27.lesson03.teach.narvas:
    title: Zdenerwowany
    gloss: zdenerwowany
    note: Standardowe słowo oznaczające zdenerwowanie.
    example_gloss: Denerwuję się przed pierwszą zmianą.
  hi.a1.unit27.lesson03.teach.main_apnee_pahlee:
    title: Mówimy, czym się denerwujesz
    gloss: Denerwuję się przed pierwszą zmianą.
    note: '*को लेकर* znaczy „w związku z”, „z powodu” i stoi po rzeczowniku: *शिफ़्ट को लेकर*. *अपनी* („moja własna”) zgadza się z rodzajem żeńskim słowa *शिफ़्ट*.'
  hi.a1.unit27.lesson03.teach.chinta_mat_karo:
    title: Uspokajanie kogoś
    gloss: Nie martw się.
    note: '*चिंता मत करो* to przyjazne „nie martw się”: *मत* + *करो* to rozkaz w formie *तुम* z zakazem.'
  hi.a1.unit27.lesson04.teach.arjun_kaisa_mahsoos:
    title: Pytanie, jak ktoś się czuje
    gloss: Jak czuje się Arjun?
    note: '*कैसा महसूस कर रहा है* pyta „jak się on czuje”. *कैसा* zgadza się z osobą, więc w odniesieniu do kobiety mówimy *कैसी*.'
  hi.a1.unit27.lesson04.teach.vah_narvas_mahsoos:
    title: Opisywanie, jak ktoś się czuje
    gloss: On czuje się zdenerwowany.
    note: 'W hindi nie ma tu osobnego słowa na „siebie”: *वह नर्वस महसूस कर रहा है* używa po prostu *वह* i *रहा है*.'
  hi.a1.unit27.lesson04.teach.vah_narvas_kyon:
    title: Pytanie, dlaczego ktoś się tak czuje
    gloss: Dlaczego on czuje się zdenerwowany?
    note: '*क्यों* stoi tuż przed wyrażeniem czasownikowym: *वह नर्वस क्यों महसूस कर रहा है?*'
  hi.a1.unit27.lesson05.teach.hay_priya_main:
    title: Przeczytaj wiadomość o uczuciach
    gloss: Cześć Priya, trochę się denerwuję swoją pierwszą zmianą w pracy, na której będę sam. Ale jestem też szczęśliwy, bo mam nową pracę i nowe mieszkanie. Myślę, że wszystko będzie dobrze.
    note: Zwróć uwagę, czym autor się denerwuje, co go cieszy i jakie ma ogólne nastawienie.
    glosses:
      थोड़ा: trochę
      नर्वस: zdenerwowani
      पहली: pierwszy
      शिफ़्ट: zmiana (w pracy)
      अकेले: sam
      खुश: zadowoleni
      क्योंकि: ponieważ
      नई: nowy
      नौकरी: praca
      नया: nowy
      फ़्लैट: mieszkanie
      लगता: myśleć
      होगा: 'okazuje się (tu: będzie dobrze)'
  hi.a1.unit27.lesson06.teach.priya_hay_arjun:
    title: Priya pyta, jak czuje się Arjun
    gloss: 'Priya: Cześć Arjun, jak się czujesz przed swoją pierwszą zmianą?'
    note: 'Ponownie użyto *को लेकर*: *अपनी पहली शिफ़्ट को लेकर* („w związku z twoją pierwszą zmianą”). *तुम* jest nieformalne.'
  hi.a1.unit27.lesson06.teach.arjun_sach_kahoon:
    title: Arjun przyznaje, że się denerwuje
    gloss: 'Arjun: Szczerze mówiąc, trochę się denerwuję.'
    note: '*सच कहूँ तो* („jeśli mam powiedzieć prawdę”) łagodzi przyznanie się do czegoś.'
  hi.a1.unit27.lesson06.teach.priya_chinta_mat:
    title: Priya go uspokaja
    gloss: 'Priya: Nie martw się, dobrze sobie z tym poradzisz!'
    note: '*तुम यह अच्छे से कर सकते हो* znaczy „dobrze to zrobisz / potrafisz to zrobić”, a *अच्छे से* to „dobrze”.'
  hi.a1.unit27.lesson06.teach.arjun_shukriya_isse:
    title: Arjun jej dziękuje
    gloss: 'Arjun: Dzięki, to naprawdę pomaga.'
    note: '*इससे मदद मिलती है* to dosłownie „z tego pomoc się otrzymuje”: źródło pomocy jest oznaczone przez *से*.'
  hi.a1.unit27.lesson06.teach.priya_aur_bad:
    title: Priya przewiduje, jak to się skończy
    gloss: 'Priya: A potem na pewno będziesz bardzo szczęśliwy i dumny.'
    note: '*ज़रूर* („na pewno”) sprawia, że przewidywanie brzmi pewnie, a *तुम्हें गर्व होगा* znaczy „poczujesz dumę”.'
  hi.a1.unit27.lesson06.teach.arjun_han_mujhe:
    title: Arjun się zgadza
    gloss: 'Arjun: Tak, ja też tak myślę.'
    note: '*मुझे भी ऐसा ही लगता है* („mnie też tak się wydaje”) to naturalny sposób wyrażenia zgody, a *मुझे* wskazuje, kto to czuje.'
  hi.a1.unit27.lesson06.teach.arjun_narvas_hai:
    title: 'Zaimki: उसकी'
    gloss: Arjun się denerwuje. Priya mu pomaga.
    note: '*उसकी* znaczy „jego” lub „jej” i zgadza się z rodzajem żeńskim słowa *मदद*, więc *उसकी मदद करना* to „pomagać mu”; *है* i *करती है* to czasowniki w 3. osobie.'
