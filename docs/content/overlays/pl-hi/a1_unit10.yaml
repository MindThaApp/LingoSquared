answer_policy:
  gender_agreement: 'This unit''s central grammar point (habitual present, verb stem + -ता/-ती/-ते + हूँ/हो/है/हैं) is grammatically gendered by the subject. For any exercise where the subject is a NAMED character with an established gender (Arjun: masculine: Priya: feminine), `accepted_answers` contains only that character''s single correct gendered form. For any exercise where the subject is the LEARNER themselves (a self-description prompt phrased with "तुम"/"अपनी"), `accepted_answers` deliberately includes BOTH the masculine and the feminine conjugated forms as equally correct -- the app has no signal of the learner''s own gender, and marking only one form correct would wrongly fail roughly half of all learners regardless of which gendered form the exercise happened to be authored around first.'
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit introduces no new nasalized vocabulary at all -- the only nasalized form used anywhere in this unit is हूँ, reused unchanged from its already-settled unit01 spelling. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation, nasalization marks, or (for self-description prompts) which grammatically correct gendered form the learner produces.
course:
  title: Hindi A1
units:
  hi.a1.unit10.routines:
    title: Codzienny plan dnia
lessons:
  hi.a1.unit10.lesson01.uthna_nashta_kaam:
    title: Wstawanie, śniadanie, wyjście do pracy
  hi.a1.unit10.lesson02.tum_kab_uthte_ho:
    title: Kiedy wstajesz?
  hi.a1.unit10.lesson03.priya_arjun_dincharya:
    title: 'Priya i Arjun: codzienny rozkład dnia'
teaching:
  hi.a1.unit10.lesson01.teach.review_time:
    title: 'Powtórka: godzina, rano, popołudnie, wieczór, noc, o/w'
    gloss: godzina (przy zegarze), rano, popołudnie, wieczór, noc, o/w (ogólnie o czasie)
    note: Krótka powtórka słów o czasie z lekcji 4 — w tej lekcji często do nich wracamy.
    example_gloss:
    - Jest teraz 8 rano.
    - W nocy nie ma zajęć.
  hi.a1.unit10.lesson01.teach.uthna:
    title: Wstaję
    gloss: wstaję (mówi mężczyzna / kobieta)
    note: Pierwszy czasownik tej lekcji w czasie teraźniejszym określającym zwyczaj — rozszerza wzór -ta/-tee z lekcji 5 (rahta hai/rahtee hai) na pierwszą osobę z hoon.
    example_gloss:
    - Wstaję o 7 rano.
    - Wstaję o 6 rano.
  hi.a1.unit10.lesson01.teach.roz:
    title: Codziennie
    gloss: codziennie
    note: Nowy przysłówek do opisywania codziennych czynności.
    example_gloss: Codziennie rano wstaję.
  hi.a1.unit10.lesson01.teach.nashta_karna:
    title: Jem śniadanie
    gloss: jem śniadanie (mówi mężczyzna / kobieta)
    note: „Nashta” (śniadanie) łączy się z „karta/kartee hoon” (robię).
    example_gloss:
    - Rano jem śniadanie.
    - Rano jem śniadanie.
  hi.a1.unit10.lesson01.teach.kaam_par_jaana:
    title: Idę do pracy
    gloss: idę do pracy (mówi mężczyzna / kobieta)
    note: „Kaam par jaana” (iść do pracy) wymaga słowa „par” (na/przy) — to stałe wyrażenie, w przeciwieństwie do „school jaana” w dalszej części lekcji, które nie potrzebuje dodatkowego słowa.
    example_gloss:
    - Potem idę do pracy.
    - Potem idę do pracy.
  hi.a1.unit10.lesson01.teach.habitual_paradigm_note:
    title: Wzór czasu teraźniejszego określającego zwyczaj
    gloss: 'Aby opisać codzienny zwyczaj, do czasownika dodaje się -ta/-tee/-te, a następnie hoon/ho/hai/hain w zależności od podmiotu: wstaję (mężczyzna/kobieta) „hoon”, wstajesz „ho”, on/ona wstaje „hai”, oni wstają „hain”.'
    note: Przedstawia cały wzór od razu (pojawił się już mimochodem w dialogu z lekcji 1, a dla trzeciej osoby został omówiony w lekcji 5), żeby ćwiczenia tej lekcji nie kazały zgadywać nieznanej formy.
  hi.a1.unit10.lesson01.teach.full_routine_phrase:
    title: Mój poranek krok po kroku
    gloss: Codziennie rano wstaję o 7, potem jem śniadanie, potem idę do pracy.
    note: Łączy trzy czasowniki z tej lekcji w jedno naturalne zdanie z kolejnymi czynnościami.
  hi.a1.unit10.lesson02.teach.sona:
    title: Śpię
    gloss: śpię (mówi mężczyzna / kobieta)
    note: Ten sam wzór -ta/-tee + hoon zastosowany do nowego czasownika.
    example_gloss:
    - Kładę się spać o 11 w nocy.
    - Kładę się spać o 10 w nocy.
  hi.a1.unit10.lesson02.teach.school_jaana:
    title: Idę do szkoły
    gloss: idę do szkoły (mówi mężczyzna / kobieta)
    note: W przeciwieństwie do „kaam par jaana”, przy „school jaana” nie trzeba dodawać żadnego słowa przed „jaana”.
    example_gloss:
    - Codziennie rano o 8 idę do szkoły.
    - Codziennie rano o 8 idę do szkoły.
  hi.a1.unit10.lesson02.teach.tum_form_note:
    title: 'Forma tum: -te/-tee + ho'
    gloss: 'Przy „tum” (ty, nieformalnie) czasownik przyjmuje -te/-tee i „ho”: wstajesz (pytanie do mężczyzny) / wstajesz (pytanie do kobiety), śpisz (pytanie do mężczyzny) / śpisz (pytanie do kobiety).'
    note: Druga osoba w tym samym paradygmacie, który został wprowadzony w lekcji 1.
  hi.a1.unit10.lesson02.teach.addressee_gender_note:
    title: Z czyim rodzajem zgadza się forma tum?
    gloss: 'Czasownik w formie tum zgadza się z rodzajem osoby, do której mówisz, a nie mówiącego — pytając Priyę: „Kiedy wstajesz?” (forma żeńska); pytając Arjuna: „Kiedy wstajesz?” (forma męska).'
    note: Punkt łatwy do przeoczenia, sprawdzony na każdej wypowiedzi w formie tum w dialogu z lekcji 3.
  hi.a1.unit10.lesson02.teach.kab_uthte_ho_phrase:
    title: Kiedy wstajesz?
    gloss: Kiedy wstajesz? (pytanie do mężczyzny)
    note: Gotowe pytanie z nową formą tum z tej lekcji.
  hi.a1.unit10.lesson02.teach.pahle_phir_routine:
    title: Najpierw wstaję, potem jem śniadanie
    gloss: Najpierw wstaję, potem jem śniadanie.
    note: Wykorzystuje „pahle”/„phir” (najpierw/potem) z lekcji 9 o wskazywaniu drogi, tym razem do porządkowania czynności dnia.
  hi.a1.unit10.lesson02.teach.kaam_idiom_note:
    title: Kaam par a szkoła
    gloss: „Kaam par jaana” (iść do pracy) wymaga „par”, ale „school jaana” (iść do szkoły) nie potrzebuje dodatkowego słowa — obie formy są poprawne i częste.
    note: Prawdziwa różnica idiomatyczna, a nie jedna ogólna reguła z wyjątkiem.
  hi.a1.unit10.lesson03.teach.vaapas:
    title: Z powrotem
    gloss: z powrotem
    note: Używane z „aana” (przychodzić) w znaczeniu „wracać”.
    example_gloss: Wracam.
  hi.a1.unit10.lesson03.teach.aana:
    title: Przychodzę
    gloss: przychodzę (mówi mężczyzna / kobieta)
    note: Nowy czasownik, który tworzy się według poznanego już wzoru czasu teraźniejszego określającego zwyczaj.
    example_gloss:
    - Wracam wieczorem.
    - Wracam wieczorem.
  hi.a1.unit10.lesson03.teach.khana_verb:
    title: Jem (posiłek)
    gloss: jem posiłek (mówi mężczyzna / kobieta)
    note: „Khana” jako rzeczownik (jedzenie, z lekcji 6) i „khana” jako czasownik (jeść) — to naturalne dla hindi powtórzenie, a nie literówka.
    example_gloss:
    - Jem posiłek w nocy.
    - Jem posiłek w nocy.
  hi.a1.unit10.lesson03.teach.raat_ka_khana:
    title: Kolacja
    gloss: 'kolacja (dosłownie: „nocne jedzenie”)'
    note: Wykorzystuje poznane już słowa „raat” (noc), „ka” (przynależność) i „khana” (jedzenie).
    example_gloss: Kolacja jest bardzo smaczna.
  hi.a1.unit10.lesson03.teach.dialogue.line01:
    title: Arjun pyta, o której Priya wstaje
    gloss: Arjun pyta Priyę, o której godzinie wstaje każdego dnia.
    note: Używa żeńskiej formy tum, poprawnie zwracając się do Priyi.
  hi.a1.unit10.lesson03.teach.dialogue.line02:
    title: Odpowiedź Priyi
    gloss: 'Priya mówi: Codziennie rano wstaję o 6. Potem jem śniadanie.'
  hi.a1.unit10.lesson03.teach.dialogue.line03:
    title: Arjun opowiada o swoim planie dnia
    gloss: 'Arjun mówi: Świetnie! Ja wstaję o siódmej. Jem też śniadanie, a potem idę do pracy.'
  hi.a1.unit10.lesson03.teach.dialogue.line04:
    title: Priya pyta, kiedy Arjun wraca
    gloss: Priya pyta Arjuna, kiedy wraca.
    note: Forma tum w rodzaju męskim, poprawnie skierowana do Arjuna. Wprowadza 'vaapas aana' w kontekście.
  hi.a1.unit10.lesson03.teach.dialogue.line05:
    title: Arjun opowiada o swoim wieczorze
    gloss: 'Arjun mówi: Wracam o szóstej wieczorem. Potem jem kolację, a potem idę spać.'
  hi.a1.unit10.lesson03.teach.dialogue.line06:
    title: Priya opowiada o swoim wieczorze
    gloss: 'Priya mówi: Ja też wracam wieczorem, a potem jem.'
  hi.a1.unit10.lesson03.teach.dialogue.line07:
    title: Arjun pyta, kiedy Priya idzie spać
    gloss: Arjun pyta Priyę, o której chodzi spać.
    note: Znów forma tum, tym razem w rodzaju żeńskim, poprawnie skierowana do Priyi.
  hi.a1.unit10.lesson03.teach.dialogue.line08:
    title: Priya odpowiada i kończy rozmowę
    gloss: 'Priya mówi: Chodzę spać o jedenastej w nocy. Dobrze, do zobaczenia jutro!'
  hi.a1.unit10.lesson03.teach.dialogue.line09:
    title: Arjun kończy rozmowę
    gloss: 'Arjun mówi: Dobrze, do zobaczenia!'
