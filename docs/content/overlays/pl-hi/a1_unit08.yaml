    - To jest dworzec.
  hi.a1.unit08.lesson01.teach.yahan_wahan:
    title: Tutaj, tam
    gloss: tutaj, tam
    note: Podstawowa para słów do wskazywania, gdzie coś jest.
    example_gloss:
    - Szkoła jest tutaj.
    - Bank jest tam.
  hi.a1.unit08.lesson01.teach.school_kahan_hai:
    title: Gdzie jest szkoła?
    gloss: Gdzie jest szkoła?
    note: Znowu *kahaan* („gdzie”), poznane już w lekcji 1, tym razem w pytaniu o miejsce, a nie o pochodzenie osoby.
  hi.a1.unit08.lesson01.teach.school_yahan_hai:
    title: Szkoła jest tutaj
    gloss: Szkoła jest tutaj.
    note: Przykładowa odpowiedź ze słowem *yahaan*.
  hi.a1.unit08.lesson01.teach.bank_kahan_hai:
    title: Gdzie jest bank?
    gloss: Gdzie jest bank?
    note: Ten sam wzór pytania, tylko z innym miejscem.
  hi.a1.unit08.lesson01.teach.bank_wahan_hai:
    title: Bank jest tam
    gloss: Bank jest tam.
    note: Przykładowa odpowiedź ze słowem *wahaan*.
  hi.a1.unit08.lesson02.teach.paas:
    title: Blisko
    gloss: blisko
    note: Tu po raz pierwszy zostaje wprowadzone jako osobne słowo – wcześniej pojawiło się tylko w przykładach w lekcji 2 (*mere paas*, „mam”, dosłownie „przy mnie”), bez osobnego omówienia.
    example_gloss: Bank jest blisko.
  hi.a1.unit08.lesson02.teach.door:
    title: Daleko
    gloss: daleko
    note: Przeciwieństwo słowa *paas*.
    example_gloss: Dworzec jest daleko.
  hi.a1.unit08.lesson02.teach.ke_paas_note:
    title: Ke paas
    gloss: „Ke paas” oznacza „blisko jakiegoś miejsca”, np. „school bank ke paas hai” (szkoła jest blisko banku). To samo „paas” pojawiło się wcześniej w „mere paas” („mam”), ale tam znaczyło „w moim posiadaniu”, a tu znaczy „w pobliżu” – jedno słowo, dwa różne zastosowania.
    note: Nowy przyimek zbudowany ze znanego już słowa; jego wcześniejsze znaczenie zostało wyraźnie zaznaczone, żeby oba zastosowania się nie pomyliły.
    target_text: '''के पास'' का मतलब है किसी जगह के नज़दीक -- जैसे ''बैंक स्कूल के पास है''। यह वही ''पास'' है जो पहले ''मेरे पास'' (मेरे पास एक किताब है) में आया था, पर वहाँ इसका मतलब था ''मेरे स्वामित्व में'' (I have), और यहाँ इसका मतलब है ''नज़दीक'' (near) -- एक ही शब्द, दो अलग इस्तेमाल।'
  hi.a1.unit08.lesson02.teach.school_bank_ke_paas_hai:
    title: Szkoła jest blisko banku
    gloss: Szkoła jest blisko banku.
    note: Przykładowe zdanie z *ke paas*.
  hi.a1.unit08.lesson02.teach.samne_peeche:
    title: Naprzeciwko, za
    gloss: naprzeciwko, za
    note: Druga para słów określających położenie, również używana z *ke*.
    example_gloss:
    - Szpital jest naprzeciwko dworca.
    - Park jest za szkołą.
  hi.a1.unit08.lesson02.teach.samne_peeche_note:
    title: Samne i peeche
    gloss: '„Samne” i „peeche” tak jak „paas” występują z „ke” – i są swoimi przeciwieństwami: „paark school ke peeche hai” oraz „school paark ke samne hai” opisują dokładnie to samo położenie, tylko z dwóch różnych stron.'
    note: Ten sam fakt wyrażony na dwa sposoby – przydatna zasada pokazująca, jak te dwa słowa się do siebie mają.
  hi.a1.unit08.lesson02.teach.school_park_ke_samne_hai:
    title: Szkoła jest naprzeciwko parku
    gloss: Szkoła jest naprzeciwko parku.
    note: Druga strona tego samego faktu co w zdaniu *paark school ke peeche hai* powyżej.
  hi.a1.unit08.lesson03.teach.dakghar:
    title: Poczta
    gloss: poczta
    note: Nowe popularne miejsce do końcowego dialogu tej lekcji.
    example_gloss: Poczta jest blisko banku.
  hi.a1.unit08.lesson03.teach.dakghar_kahan_hai:
    title: Gdzie jest poczta?
    gloss: Gdzie jest poczta?
    note: Otwiera końcowy dialog tej lekcji.
  hi.a1.unit08.lesson03.teach.dialogue.line01:
    title: Arjun pyta o pocztę
    gloss: Arjun pyta Priyę, gdzie jest poczta.
    note: Powtarza zwrot otwierający tę lekcję.
  hi.a1.unit08.lesson03.teach.dialogue.line02:
    title: Priya odpowiada
    gloss: Priya mówi, że jest blisko banku.
    note: Powtarza *ke paas* z lekcji 2.
  hi.a1.unit08.lesson03.teach.dialogue.line03:
    title: Arjun pyta o szpital
    gloss: Arjun mówi „aha” i pyta, gdzie jest szpital.
    note: Powtarza *achchha* („aha”, „dobrze”) z wcześniejszych lekcji.
  hi.a1.unit08.lesson03.teach.dialogue.line04:
    title: Priya odpowiada
    gloss: Priya mówi, że szpital jest naprzeciwko dworca.
    note: Powtarza *ke samne* z lekcji 2.
  hi.a1.unit08.lesson03.teach.dialogue.line05:
    title: Arjun pyta, czy to daleko
    gloss: 'Arjun pyta: czy dworzec jest daleko?'
    note: Powtarza *door* z lekcji 2.
  hi.a1.unit08.lesson03.teach.dialogue.line06:
    title: Priya potwierdza i dodaje przeciwieństwo
    gloss: Priya mówi, że tak, trochę daleko – a bank jest blisko.
    note: Wprowadza *thoda* („trochę”) i zgadza się z faktem, że dworzec jest daleko, a bank blisko.
  hi.a1.unit08.lesson03.teach.dialogue.line07:
    title: Arjun pyta o park
    gloss: Arjun mówi „dobrze” i pyta, gdzie jest park.
  hi.a1.unit08.lesson03.teach.dialogue.line08:
    title: Priya odpowiada
    gloss: Priya mówi, że park jest za szkołą.
    note: Powtarza *ke peeche* z lekcji 2.
  hi.a1.unit08.lesson03.teach.dialogue.line09:
    title: Arjun wyciąga wniosek
    gloss: 'Arjun mówi: czyli szkoła jest naprzeciwko parku!'
    note: Wprowadza *to* („więc”, „czyli”) i nawiązuje do uwagi gramatycznej o *samne* i *peeche* z lekcji 2.
  hi.a1.unit08.lesson03.teach.dialogue.line10:
    title: Priya potwierdza
    gloss: Priya mówi, że tak, zgadza się!
    note: Wprowadza *sahi* („słusznie”, „poprawnie”).
  hi.a1.unit08.lesson03.teach.dialogue.line11:
    title: Arjun dziękuje Priyi
    gloss: 'Arjun mówi: bardzo dziękuję, Priya!'
    note: Powtarza *bahut* („bardzo”) i *shukriya* z wcześniejszych lekcji.
  hi.a1.unit08.lesson03.teach.dialogue.line12:
    title: Priya kończy rozmowę
    gloss: 'Priya mówi: nie ma sprawy! Do zobaczenia.'
    note: Powtarza standardowe zwroty na zakończenie rozmowy z wcześniejszych lekcji.
