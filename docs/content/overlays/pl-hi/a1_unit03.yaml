teaching:
  hi.a1.unit03.lesson01.teach.aaj:
    title: Dzisiaj
    gloss: dzisiaj
    note: Słowo, którego użyjesz w prawie każdym zdaniu w tej lekcji.
    example_gloss: Dziś jest ładna pogoda.
  hi.a1.unit03.lesson01.teach.somvar:
    title: Poniedziałek
    gloss: poniedziałek
    note: Nazwa pochodzi od सोम (Księżyca) – podobnie jak w polskim „poniedziałek” wiąże się z początkiem tygodnia, tak tu dzień należy do Księżyca.
    example_gloss: Zajęcia jogi są w poniedziałek.
  hi.a1.unit03.lesson01.teach.mangalvar:
    title: Wtorek
    gloss: wtorek
    note: Nazwa pochodzi od मंगल (Marsa) – według tego samego wzoru tworzy się większość hindi nazw dni tygodnia.
    example_gloss: Dziś jest wtorek.
  hi.a1.unit03.lesson01.teach.budhvar:
    title: Środa
    gloss: środa
    note: Nazwa pochodzi od बुध (Merkurego).
    example_gloss: Dziś jest środa.
  hi.a1.unit03.lesson01.teach.guruvar:
    title: Czwartek
    gloss: czwartek
    note: Nazwa pochodzi od गुरु (Jowisza).
    example_gloss: Dziś jest czwartek.
  hi.a1.unit03.lesson01.teach.shukravar:
    title: Piątek
    gloss: piątek
    note: Nazwa pochodzi od शुक्र (Wenus).
    example_gloss: W piątek nie ma zajęć jogi.
  hi.a1.unit03.lesson01.teach.shanivar:
    title: Sobota
    gloss: sobota
    note: Nazwa pochodzi od शनि (Saturna).
    example_gloss: Dzisiaj jest sobota.
  hi.a1.unit03.lesson01.teach.ravivar:
    title: Niedziela
    gloss: niedziela
    note: Nazwa pochodzi od रवि, sanskryckiej nazwy słońca – to dzień słońca.
    example_gloss: Dziś jest niedziela.
  hi.a1.unit03.lesson01.teach.kaun_sa_din_hai:
    title: Pytanie o dzień tygodnia
    gloss: Jaki dziś dzień?
    note: '*Kaun sa* („który”) zgadza się z rzeczownikiem rodzaju męskiego *din* („dzień”) – formę żeńską, *kaun si*, poznasz później przy rzeczownikach żeńskich.'
  hi.a1.unit03.lesson01.teach.yoga_class_monday:
    title: Mówienie, że coś jest w danym dniu
    gloss: Zajęcia jogi są w poniedziałek.
    note: '*Ko* po nazwie dnia znaczy „w” – *somvar ko* to „w poniedziałek”; ten sam wzór działa dla każdego dnia tygodnia.'
  hi.a1.unit03.lesson01.teach.no_class_friday:
    title: Mówienie, że czegoś nie ma w danym dniu
    gloss: W piątek nie ma zajęć jogi.
    note: Nahin zaprzecza zdaniu; ko nadal oznacza dzień, a tutaj stoi na początku dla podkreślenia.
  hi.a1.unit03.lesson02.teach.jan_feb_mar:
    title: Styczeń, luty, marzec
    gloss: styczeń, luty, marzec
    note: Hindi nazwy miesięcy to w większości zapożyczenia, które łatwo rozpoznać, gdy znasz wzór – żadnej nowej gramatyki, tylko słownictwo.
    example_gloss:
    - Moje urodziny są w styczniu.
    - Następne święto jest w lutym.
    - Moje urodziny są w marcu.
  hi.a1.unit03.lesson02.teach.apr_may_jun:
    title: Kwiecień, maj, czerwiec
    gloss: kwiecień, maj, czerwiec
    note: Ten sam łatwy do rozpoznania wzór co w pierwszych trzech miesiącach.
    example_gloss:
    - Następne święto jest w kwietniu.
    - Moje urodziny są w maju.
    - Następne święto jest w czerwcu.
  hi.a1.unit03.lesson02.teach.jul_aug_sep:
    title: Lipiec, sierpień, wrzesień
    gloss: lipiec, sierpień, wrzesień
    note: Sitambar jest tu zapisane z anusvarą (सितंबर); pisownia z połową m (सितम्बर) też jest częsta i równie poprawna.
    example_gloss:
    - Moje urodziny są w lipcu.
    - Następne święto jest w sierpniu.
    - Moje urodziny są we wrześniu.
  hi.a1.unit03.lesson02.teach.oct_nov_dec:
    title: Październik, listopad, grudzień
    gloss: październik, listopad, grudzień
    note: Navambar i disambar mają tę samą pisownię z anusvarą co sitambar; नवम्बर i दिसम्बर (z połową m) też są częste i równie poprawne.
    example_gloss:
    - Następne święto jest w październiku.
    - Moje urodziny są w listopadzie.
    - Następne święto jest w grudniu.
  hi.a1.unit03.lesson02.teach.tareekh:
    title: Data
    gloss: data
    note: '*Tareekh* jest rzeczownikiem rodzaju żeńskiego – słowo pytające przyjmuje więc formę żeńską (*kitni tareekh*, nigdy *kitna tareekh*), tak samo jak w lekcji 2 przy *keemat* i *umra*.'
    example_gloss: Dziś jest trzeci.
  hi.a1.unit03.lesson02.teach.mein_postposition:
    title: W (z nazwą miesiąca)
    gloss: w – używane z nazwą miesiąca
    note: '*Mein* oznacza miesiąc tak, jak *ko* oznacza dzień: *janvari mein* to „w styczniu”, nigdy *janvari ko*.'
  hi.a1.unit03.lesson02.teach.aaj_kitni_tareekh_hai:
    title: Pytanie o datę
    gloss: Którego dziś mamy?
    note: Dosłownie „którą dziś mamy datę (ile jest dzisiejszej daty)” – kitni zgadza się z żeńskim tareekh.
  hi.a1.unit03.lesson02.teach.aaj_teen_tareekh_hai:
    title: Podawanie daty samą liczbą
    gloss: Dziś jest trzeci.
    note: W hindi datę podaje się zwykłą liczbą główną (*teen*, „trzy”), a nie liczebnikiem porządkowym jak po polsku „trzeci” – nie ma osobnego „słowa na datę”, tylko liczby, które już znasz.
  hi.a1.unit03.lesson02.teach.aaj_teen_january_hai:
    title: Podawanie daty z miesiącem
    gloss: Dziś jest trzeci stycznia.
    note: Ten sam wzór z liczbą główną, tym razem z nazwą miesiąca po niej.
  hi.a1.unit03.lesson03.teach.kab:
    title: Kiedy
    gloss: kiedy
    note: Proste, bardzo częste słowo pytające.
    example_gloss: Kiedy są następne zajęcia?
  hi.a1.unit03.lesson03.teach.agli:
    title: Następny
    gloss: następny
    note: '*Agli* to forma żeńska – *class* (क्लास) w codziennym hindi jest rzeczownikiem żeńskim, więc ma *agli*, a nie męskie *agla*.'
    example_gloss: Następne zajęcia są we wtorek.
  hi.a1.unit03.lesson03.teach.das_reprise:
    title: Dziesięć
    gloss: dziesięć
    note: Powtórka z lekcji 2 – potrzebne tu do prawdziwej daty.
    example_gloss: Następne zajęcia są dziesiątego.
  hi.a1.unit03.lesson03.teach.janmadin:
    title: Urodziny
    gloss: urodziny
    note: Rzeczownik rodzaju męskiego – mera janmadin, nigdy meri janmadin.
    example_gloss: Moje urodziny są w grudniu.
  hi.a1.unit03.lesson03.teach.tumhara_janmadin_kab_hai:
    title: Pytanie o urodziny w nieformalnej rozmowie
    gloss: Kiedy masz urodziny? (nieformalnie)
    note: Tumhara zgadza się z rodzaju męskiego słowem janmadin.
  hi.a1.unit03.lesson03.teach.mera_janmadin_january_mein_hai:
    title: Podawanie daty swoich urodzin
    gloss: Moje urodziny są w styczniu.
    note: Naturalna odpowiedź całym zdaniem na pytanie Tumhara janmadin kab hai?
  hi.a1.unit03.lesson03.teach.agli_class_kab_hai:
    title: Pytanie o termin następnych zajęć
    gloss: Kiedy są następne zajęcia?
    note: Łączy agli (rodzaj żeński, zgodne z klasą) z kab.
  hi.a1.unit03.lesson03.teach.agli_class_mangalvar_das_march:
    title: Podawanie dnia tygodnia i daty
    gloss: Następne zajęcia są we wtorek, dziesiątego marca.
    note: 'Dzień tygodnia i data razem: najpierw dzień, potem numer dnia i miesiąc – podobnie jak w polskim zdaniu.'
  hi.a1.unit03.lesson03.teach.dialogue.line01:
    title: Arjun pyta o następne zajęcia
    gloss: Arjun pyta, kiedy są następne zajęcia jogi.
    note: To dokładnie pytanie z tej lekcji, z dodanym słowem yog dla jasności.
  hi.a1.unit03.lesson03.teach.dialogue.line02:
    title: Priya podaje dzień i datę
    gloss: Priya mówi, że następne zajęcia są we wtorek, dziesiątego marca.
    note: To dokładnie zdanie z dniem i datą z tej lekcji.
  hi.a1.unit03.lesson03.teach.dialogue.line03:
    title: Arjun dziękuje jej
    gloss: 'Arjun mówi: dobrze, dziękuję.'
    note: Theek hai i shukriya to słownictwo z jednostki 1.
  hi.a1.unit03.lesson03.teach.dialogue.line04:
    title: Priya odpowiada
    gloss: Priya mówi, że to nie problem.
    note: Koi baat nahin to bardzo częsty, naturalny sposób, by powiedzieć „proszę” lub „nie ma sprawy”.
  hi.a1.unit03.lesson03.teach.dialogue.line05:
    title: Arjun pyta Priyę o urodziny
    gloss: Arjun pyta, kiedy Priya ma urodziny.
    note: To dokładnie nieformalne pytanie o urodziny z tej lekcji.
  hi.a1.unit03.lesson03.teach.dialogue.line06:
    title: Priya odpowiada
    gloss: Priya mówi, że ma urodziny w styczniu.
    note: To dokładnie zdanie odpowiedzi z tej lekcji.
  hi.a1.unit03.lesson03.teach.dialogue.line07:
    title: Arjun reaguje i mówi o swoich urodzinach
    gloss: Arjun reaguje pozytywnie, a potem mówi, że ma urodziny w grudniu.
    note: Accha to słownictwo z jednostki 1; grudzień był już w lekcji 2 tej jednostki.
  hi.a1.unit03.lesson03.teach.dialogue.line08:
    title: Priya kończy rozmowę
    gloss: Priya zgadza się i luźno się żegna.
    note: Theek hai i phir milte hain to słownictwo pożegnań z jednostki 1.
