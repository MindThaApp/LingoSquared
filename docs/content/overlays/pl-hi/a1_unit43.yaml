  hi.a1.unit43.lesson05.teach.neena_aur_priya:
    title: Nina i Priya kupują kwiaty
    gloss: Nina i Priya idą w sobotę na targ kwiatowy. Jaki kolor chce Priya? Priya chciałaby czerwony. Jaki kolor chce Nina? Nina chciałaby żółty. Kupują pięć kwiatów. Kosztują sto rupii. Kwiaty są bardzo ładne!
    note: Podsumowanie sobotniej wyprawy na targ kwiatowy, w takim samym układzie jak teksty porównawcze w jednostkach o domu, okolicy, poczcie, gotowaniu i osobowości.
    glosses:
      जाती: idą (r. żeński, l. mn.)
      शनिवार: sobota
      फूल-मंडी: targ kwiatowy
      रंग: kolor
      चाहिए: potrzebny / chciany
      को: wskazuje, kto czegoś chce
      लाल: czerwony
      पीला: żółty
      ख़रीदती: kupują
      पाँच: pięć
      फूल: kwiaty
      दाम: cena
      सौ: sto
      रुपये: rupie
      सुंदर: piękne
