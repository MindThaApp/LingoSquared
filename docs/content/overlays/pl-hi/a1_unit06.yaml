teaching:
  hi.a1.unit06.lesson01.teach.khana:
    title: Jedzenie
    gloss: jedzenie, posiłek
    note: Ogólne słowo oznaczające jedzenie, używane w całej tej lekcji.
    example_gloss: Moje jedzenie jest już gotowe.
  hi.a1.unit06.lesson01.teach.chai_coffee:
    title: Herbata, kawa
    gloss: herbata, kawa
    note: Dwa popularne napoje, używane w całej tej lekcji do ćwiczenia wzorca *mujhe ... chahiye*.
    example_gloss:
    - Poproszę herbatę.
    - Poproszę kawę.
  hi.a1.unit06.lesson01.teach.pani_juice:
    title: Woda, sok
    gloss: woda, sok
    note: Dwa kolejne popularne napoje. Nie trzeba tu uzgadniać rodzaju, bo *chahiye* się nie zmienia.
    example_gloss:
    - Poproszę wodę.
    - Poproszę sok.
  hi.a1.unit06.lesson01.teach.chahiye_note:
    title: Mujhe ... chahiye
    gloss: '*Mujhe ... chahiye* znaczy „Poproszę ...” (chcę/chciał(a)bym ...). Wyrażenie nie zmienia się w zależności od płci mówiącego (inaczej niż *chahta/chahti*) i nigdy nie występuje po nim *hai*.'
    note: Najważniejszy punkt gramatyczny tej lekcji. Częsty błąd uczących się to dodawanie *hai* po *chahiye*, bo prawie każde dotychczas poznane zdanie tak się kończy. *Chahiye* samo w sobie jest kompletnym orzeczeniem.
  hi.a1.unit06.lesson01.teach.aapko_kya_chahiye:
    title: Co dla Pana/Pani? (formalnie)
    gloss: Co podać?
    note: Pytanie w formalnej formie grzecznościowej *aap*, zadawane np. przez kelnera lub gospodarza.
  hi.a1.unit06.lesson01.teach.tumhein_kya_chahiye:
    title: Co chcesz? (nieformalnie)
    gloss: Co podać?
    note: Nieformalny zaimek w celowniku z formy *tum*, analogiczny do *mujhe* i do *tumhara/tumhari* z lekcji 5.
  hi.a1.unit06.lesson01.teach.chai_chahiye_shukriya:
    title: Poproszę herbatę, dziękuję
    gloss: Poproszę herbatę, dziękuję.
    note: Naturalna, grzeczna odpowiedź przy zamawianiu, z użyciem *shukriya* z wcześniejszych lekcji.
  hi.a1.unit06.lesson01.teach.bahut:
    title: Bardzo
    gloss: bardzo
    note: Częsty wzmacniacz, używany w tej lekcji do opisywania jedzenia i napojów.
    example_gloss: Ta herbata jest bardzo dobra.
  hi.a1.unit06.lesson01.teach.swadisht:
    title: Pyszny
    gloss: pyszny, smaczny
    note: Przydatne słowo do komentowania jedzenia. W notatce gramatycznej w lekcji 3 wyjaśniamy, dlaczego nie zmienia się ono według rodzaju.
    example_gloss: To jedzenie jest bardzo smaczne.
  hi.a1.unit06.lesson02.teach.roti_chawal:
    title: Chleb, ryż
    gloss: placek (roti), ryż
    note: Dwa podstawowe produkty codziennego indyjskiego posiłku.
    example_gloss:
    - Poproszę roti.
    - Poproszę ryż.
  hi.a1.unit06.lesson02.teach.sabzi_daal:
    title: Danie warzywne, soczewica
    gloss: danie warzywne, soczewica (dal)
    note: Dwa kolejne podstawowe dania, najczęściej jedzone razem z roti i ryżem.
    example_gloss:
    - Poproszę danie warzywne.
    - Poproszę soczewicę.
  hi.a1.unit06.lesson02.teach.kap_gilas_plate:
    title: Filiżanka, szklanka, talerz
    gloss: filiżanka, szklanka, talerz
    note: Popularne naczynia używane z *ek* („jeden”), by określić ilość przy zamawianiu.
    example_gloss:
    - Poproszę filiżankę herbaty.
    - Poproszę szklankę wody.
    - Poproszę talerz ryżu.
  hi.a1.unit06.lesson02.teach.kripya:
    title: Proszę
    gloss: proszę
    note: Proste słowo grzecznościowe przy prośbie. Najczęściej stoi na początku (*kripya mujhe ...*), ale słychać je też na końcu zdania.
    example_gloss: Poproszę filiżankę herbaty.
  hi.a1.unit06.lesson02.teach.kuch_aur_chahiye:
    title: Coś jeszcze?
    gloss: Coś jeszcze? / Czy chciał(a)byś coś jeszcze?
    note: Naturalne pytanie kelnera po przyjęciu części zamówienia.
  hi.a1.unit06.lesson02.teach.nahin_bas_shukriya:
    title: Nie, to wszystko, dziękuję
    gloss: Nie, to wszystko, dziękuję.
    note: Naturalny, grzeczny sposób zakończenia zamówienia, z użyciem *nahin* i *shukriya* z wcześniejszych lekcji.
  hi.a1.unit06.lesson02.teach.sabzi_swadisht_phrase:
    title: To danie warzywne jest bardzo smaczne
    gloss: To danie warzywne jest bardzo smaczne.
    note: Ponownie użyto *bahut* i *swadisht* z tej lekcji z nowym rzeczownikiem, co przygotowuje do notatki gramatycznej w lekcji 3 o tym, że *swadisht* nie zmienia się według rodzaju.
  hi.a1.unit06.lesson03.teach.chalo_khate_hain:
    title: Zjedzmy coś!
    gloss: Zjedzmy coś!
    note: Przyjazny, utarty sposób zaproponowania wspólnego jedzenia; otwiera końcowy dialog tej lekcji.
  hi.a1.unit06.lesson03.teach.ya:
    title: Lub
    gloss: lub, albo
    note: Proste słowo łączące, używane do zaproponowania wyboru między dwiema rzeczami.
    example_gloss: Chcesz herbatę czy kawę?
  hi.a1.unit06.lesson03.teach.haan:
    title: Tak
    gloss: tak
    note: Proste potwierdzenie, które wraca w końcowym dialogu tej lekcji.
    example_gloss: Tak, poproszę herbatę.
  hi.a1.unit06.lesson03.teach.swadisht_invariant_note:
    title: Swadisht się nie zmienia
    gloss: '*Swadisht* ma tę samą formę przy wyrazach rodzaju męskiego i żeńskiego -- nie zmienia się tak jak *achha/achhi*.'
    note: 'Ważny wyjątek: w odróżnieniu od poznanych już przymiotników zmieniających się według rodzaju (achha/achhi, bada/badi, mera/meri), przymiotniki zakończone na spółgłoskę, takie jak *swadisht*, nigdy nie zmieniają formy ze względu na rodzaj.'
  hi.a1.unit06.lesson03.teach.accha_phir_milenge:
    title: Dobrze, do zobaczenia
    gloss: Dobrze! Do zobaczenia.
    note: Przyjazne pożegnanie, znane już z wcześniejszych lekcji.
  hi.a1.unit06.lesson03.teach.theek_hai_phir_milte_hain:
    title: Dobrze, do zobaczenia wkrótce
    gloss: Dobrze, do zobaczenia wkrótce!
    note: Nieformalna odpowiedź na powyższe pożegnanie, zgodna z końcowymi wymianami zdań z wcześniejszych lekcji.
  hi.a1.unit06.lesson03.teach.dialogue.line01:
    title: Arjun proponuje jedzenie
    gloss: 'Arjun mówi: zjedzmy coś.'
    note: Powtarza otwierające wyrażenie tej lekcji.
  hi.a1.unit06.lesson03.teach.dialogue.line02:
    title: Priya pyta, czego chce
    gloss: Priya się zgadza i pyta, co chciałby Arjun.
    note: Powtarza nieformalne pytanie *tumhein kya chahiye* z lekcji 1.
  hi.a1.unit06.lesson03.teach.dialogue.line03:
    title: Arjun zamawia jedzenie
    gloss: Arjun mówi, że poprosi o talerz roti i dania warzywnego.
    note: Łączy rzeczowniki oznaczające jedzenie z tej lekcji, wzorzec z naczyniem *ek plate* i *chahiye*.
  hi.a1.unit06.lesson03.teach.dialogue.line04:
    title: Priya proponuje wybór napoju
    gloss: Priya mówi „dobrze” i pyta, czy Arjun chce herbatę, czy kawę.
    note: Używa *ya* z tej lekcji, by zaproponować wybór między dwoma napojami.
  hi.a1.unit06.lesson03.teach.dialogue.line05:
    title: Arjun wybiera kawę
    gloss: Arjun mówi, że poprosi o kawę.
    note: Powtarza *kripya* z lekcji 2.
  hi.a1.unit06.lesson03.teach.dialogue.line06:
    title: Priya komentuje jedzenie
    gloss: Priya mówi „dobrze” i że to jedzenie jest bardzo smaczne.
    note: Powtarza *bahut swadisht* z lekcji 1.
  hi.a1.unit06.lesson03.teach.dialogue.line07:
    title: Arjun się zgadza
    gloss: 'Arjun mówi: tak, bardzo dziękuję.'
    note: Powtarza *haan* i *shukriya*.
  hi.a1.unit06.lesson03.teach.dialogue.line08:
    title: Priya kończy rozmowę
    gloss: 'Priya mówi: dobrze, do zobaczenia.'
    note: Powtarza zwrot pożegnalny z tej lekcji.
  hi.a1.unit06.lesson03.teach.dialogue.line09:
    title: Arjun odpowiada
    gloss: 'Arjun się zgadza i mówi: do zobaczenia wkrótce.'
    note: Powtarza zwrot odpowiedzi z tej lekcji.
