teaching:
  hi.a1.unit28.lesson01.teach.fon_karna:
    title: Dzwonić
    gloss: dzwonić
    note: Bezokolicznik czasownika oznaczającego telefonowanie.
    example_gloss: Muszę do ciebie zadzwonić.
  hi.a1.unit28.lesson01.teach.main_tumhen_fon:
    title: Mówimy, że zadzwonimy
    gloss: Zadzwonię do ciebie.
    note: '*करूँगा* to czas przyszły czasownika *करना*; hindi używa go tam, gdzie po polsku mówimy „zadzwonię”. Osoba, do której dzwonisz, przyjmuje formę *तुम्हें* („do ciebie”).'
  hi.a1.unit28.lesson01.teach.hailo_main_priya:
    title: Odbieranie telefonu
    gloss: Halo, mówi Priya.
    note: Przez telefon mówi się *मैं ... बोल रही हूँ* („mówię”); *रही* jest w rodzaju żeńskim, bo Priya jest kobietą.
  hi.a1.unit28.lesson01.teach.hailo_main_arjun:
    title: Arjun odbiera tak samo
    gloss: Halo, mówi Arjun.
    note: 'Ten sam wzór w rodzaju męskim *रहा*: *मैं अर्जुन बोल रहा हूँ*, bo Arjun jest mężczyzną.'
  hi.a1.unit28.lesson02.teach.main_kisse_bat:
    title: Pytanie, kto dzwoni
    gloss: Z kim rozmawiam?
    note: '*किससे* („z kim”) to *कौन* („kto”) plus *से*, a *से* wskazuje osobę, z którą rozmawiasz.'
  hi.a1.unit28.lesson02.teach.ap_priya_se:
    title: Przedstawianie się oficjalnie
    gloss: Rozmawia Pan/Pani z Priyą.
    note: '*आप* to grzeczne „Pan/Pani” wobec nieznajomej osoby. W *प्रिया से बात कर रहे हैं* po imieniu stoi *से*, a *हैं* pasuje do *आप*.'
  hi.a1.unit28.lesson03.teach.kya_tum_yah:
    title: Prośba o powtórzenie
    gloss: Możesz to powtórzyć?
    note: '*सकते हो* znaczy „możesz” i stoi po czasowniku głównym: *कह सकते हो*. *क्या* na początku tworzy pytanie.'
  hi.a1.unit28.lesson03.teach.itna_tez_mat:
    title: Prośba o wolniejsze mówienie
    gloss: Nie mów tak szybko, proszę.
    note: '*मत बोलो* to przyjazne „nie mów” w formie *तुम*, a *इतना तेज़* znaczy „tak szybko”.'
  hi.a1.unit28.lesson03.teach.mujhe_tumharee_avaz:
    title: Mówimy, że słabo słychać
    gloss: Słabo cię słyszę.
    note: 'Hindi mówi „twój głos nie przychodzi”: *मुझे तुम्हारी आवाज़ नहीं आ रही है*. Mówiący dostaje *मुझे*, a podmiotem jest głos.'
  hi.a1.unit28.lesson04.teach.maisej:
    title: SMS
    gloss: wiadomość, SMS
    note: '*मैसेज* to częste słowo zapożyczone, rodzaju męskiego: *एक मैसेज*, *यह मैसेज ... का है*.'
    example_gloss: SMS jest od Priyi.
  hi.a1.unit28.lesson04.teach.main_tumhen_ek:
    title: Zapowiedź wysłania wiadomości
    gloss: Wyślę ci wiadomość.
    note: 'Kolejność to: osoba, rzecz, czasownik: *तुम्हें एक मैसेज भेजूँगा*. *भेजना* znaczy „wysyłać”.'
  hi.a1.unit28.lesson04.teach.main_tumhen_bad:
    title: Zapowiedź oddzwonienia
    gloss: Zadzwonię do ciebie później.
    note: '*वापस फ़ोन करना* znaczy „oddzwonić”, a *वापस* stoi przed *फ़ोन करना*; *बाद में* znaczy „później”.'
  hi.a1.unit28.lesson05.teach.arjun_hay_priya:
    title: Przeczytaj wymianę wiadomości
    gloss: 'Arjun: Cześć, Priya, możesz do mnie zadzwonić? Muszę ci coś ważnego powiedzieć. Priya: Tak, oczywiście, oddzwonię do ciebie za pięć minut.'
    note: Zwróć uwagę, o co prosi Arjun, dlaczego i kiedy Priya obiecuje oddzwonić.
    glosses:
      हाय: cześć
      सकती: możesz
      फ़ोन: zadzwonić
      ज़रूरी: ważny (np. coś ważnego do powiedzenia)
      कुछ: coś
      बतानी: opowiedzieć, powiedzieć
      ज़रूर: jasne
      करूँगी: zadzwoni
      पाँच: pięć
      मिनट: minuty
      वापस: z powrotem
  hi.a1.unit28.lesson06.teach.arjun_hailo_main:
    title: Arjun odbiera telefon
    gloss: 'Arjun: Halo, tu Arjun.'
    note: 'Osoba odbierająca telefon podaje najpierw swoje imię: *मैं ... बोल रहा हूँ*; tu w rodzaju męskim, z końcówką *रहा*.'
  hi.a1.unit28.lesson06.teach.priya_hay_arjun:
    title: Priya się przedstawia
    gloss: 'Priya: Cześć, Arjun, tu Priya. Arjun: Dobrze, że dzwonisz!'
    note: '*अच्छा हुआ तुमने फ़ोन किया* znaczy „dobrze, że zadzwoniłeś/zadzwoniłaś”; *तुमने ... किया* to czas przeszły z *ने*.'
  hi.a1.unit28.lesson06.teach.priya_tumharee_pahlee:
    title: Priya pyta o zmianę w pracy
    gloss: 'Priya: Jak ci poszła pierwsza zmiana?'
    note: '*कैसी रही* pyta „jak poszło / jak było”; *कैसी* jest w rodzaju żeńskim, bo *शिफ़्ट* jest rodzaju żeńskiego.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_achchhee:
    title: Arjun mówi dobrą wiadomość
    gloss: 'Arjun: Poszła bardzo dobrze, lepiej, niż myślałem.'
    note: '*अच्छी रही* („poszła dobrze”) zgadza się z rzeczownikiem żeńskim *शिफ़्ट*, a *जितना मैंने सोचा था उससे भी बेहतर* znaczy „nawet lepiej, niż myślałem”.'
  hi.a1.unit28.lesson06.teach.vah_narvas_tha:
    title: 'था i थी: był, była'
    gloss: On był zdenerwowany, ona była szczęśliwa.
    note: '*था* znaczy „był” przy podmiocie męskim, a *थी* „była” przy żeńskim; końcówka zgadza się z osobą lub rzeczą, o której mowa.'
  hi.a1.unit28.lesson06.teach.priya_yah_sunkar:
    title: Priya jest dumna
    gloss: 'Priya: Miło to słyszeć! Jestem z ciebie dumna.'
    note: '*तुम पर गर्व है* („duma jest na tobie”) używa *पर*, a osoba odczuwająca dumę stoi w formie *मुझे*.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_shukriya:
    title: Arjun jest wzruszony
    gloss: 'Arjun: Bardzo dziękuję, wiele to dla mnie znaczy.'
    note: '*मेरे लिए* znaczy „dla mnie”, a *इसका बहुत मतलब है* to „to wiele znaczy”.'
  hi.a1.unit28.lesson06.teach.uskee_pahlee_shift:
    title: Jego
    gloss: Jego pierwsza zmiana poszła bardzo dobrze.
    note: '*उसकी* znaczy „jego” lub „jej” (to samo słowo) i zgadza się z rzeczownikiem żeńskim *शिफ़्ट*.'
