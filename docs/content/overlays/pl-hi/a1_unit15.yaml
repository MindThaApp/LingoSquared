  hi.a1.unit15.lesson01.exercise08.order_mujhe_delhi_ka_tiket_chahiye:
    instruction: 'Ułóż zdanie we właściwej kolejności: Potrzebuję biletu do Delhi.'
    correct_response:
    - मुझे
    - दिल्ली
    - का
    - टिकट
    - चाहिए
  hi.a1.unit15.lesson01.exercise09.fill_mujhe_station_jana:
    instruction: 'Uzupełnij zdanie: Muszę iść na dworzec.'
    accepted_answers:
