answer_policy:
  mujhe_verb_hai: This unit's central grammar point is the दात-subject obligation construction "X + verb-infinitive + है" (मुझे/तुम्हें/हमें/आपको + infinitive + है = "X needs/has to ___"). A typed answer that drops है entirely, or that appends हैं instead of है (है is invariant here -- it agrees with the infinitive verb, not the दात subject), should be marked incorrect -- this is the exact point being tested.
  kitne_ka_gender: '"टिकट कितने का है?" (how much is the ticket) is taught with का, treating टिकट as masculine -- the same कितने का/की gender-agreement rule unit07 already established. Many native speakers also use टिकट as feminine (टिकट कितने की है?), so की with टिकट is ACCEPTED as a valid alternative wherever typed; plural के with one ticket is the error the grammar_check targets.'
  train_gender: ट्रेन is grammatically feminine, so every habitual-present verb form describing it in this unit uses जाती है, never जाता है. A typed answer using जाता है for the train should be marked incorrect as a real agreement error.
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit's one new nasalized word, हमें, uses anusvara, verified against a direct codepoint check -- consistent with the already-established तुम्हें convention. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks. For any exercise asking the learner to state their own travel request, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: Hindi A1
units:
  hi.a1.unit15.travel:
    title: Podróż
lessons:
  hi.a1.unit15.lesson01.station_jana:
    title: Muszę jechać na dworzec
  hi.a1.unit15.lesson02.platform_samay:
    title: Numer peronu i godzina
  hi.a1.unit15.lesson03.priya_arjun_station:
    title: 'Priya i Arjun: na dworcu'
teaching:
  hi.a1.unit15.lesson01.teach.station_mujhe_hai_review:
    title: 'Powtórka: dworzec, mi, jest'
    gloss: dworzec, mi / dla mnie, jest
    note: Krótka powtórka rzeczownika oznaczającego miejsce i czasownika posiłkowego, potrzebnych do zbudowania konstrukcji oznaczającej powinność, którą poznajesz w tej lekcji.
    example_gloss:
    - Dworzec jest tutaj.
    - Mam pracę.
  hi.a1.unit15.lesson01.teach.jaana:
    title: Iść, jechać
    gloss: iść, jechać (bezokolicznik)
    note: Bezokolicznik czasownika, który znasz już jako rozkaźnik dla तुम, czyli *jao* (lekcja 9). Ta lekcja wprowadza sam bezokolicznik.
    example_gloss: Muszę iść.
  hi.a1.unit15.lesson01.teach.grammar_mujhe_verb_hai:
    title: Mujhe + czasownik + hai = muszę
    gloss: '„Mujhe” poznałeś(-aś) już z „chahiye” (lekcja 6, z rzeczownikiem) oraz z „hai” (lekcja 11, jak w „mujhe kaam hai”, czyli „mam pracę”). Teraz występuje też z czasownikiem: „mujhe jana hai” znaczy „muszę iść”. Uwaga -- przy „jana” słowo „hai” się nie zmienia i nigdy nie przyjmuje formy „hain”: nie zgadza się z osobą mówiącą.'
    note: Trzecie zastosowanie poznanego już wzorca zaimek + czasownik posiłkowy; odwołanie do dwóch wcześniejszych zastosowań z numerami lekcji, zanim pojawi się nowy czasownik.
  hi.a1.unit15.lesson01.teach.mujhe_station_jana_hai_phrase:
    title: Muszę jechać na dworzec.
    gloss: Muszę jechać na dworzec.
    note: Pierwszy pełny przykład konstrukcji oznaczającej powinność w tej lekcji.
  hi.a1.unit15.lesson01.teach.tiket:
    title: Bilet
    gloss: bilet
    note: Nowy rzeczownik, potrzebny w całej tej lekcji o podróżowaniu.
    example_gloss: Gdzie jest mój bilet?
  hi.a1.unit15.lesson01.teach.chahiye_review:
    title: 'Powtórka: chcieć / potrzebować'
    gloss: chcieć / potrzebować
    note: Poznane w lekcji 6 przy napojach, tu użyte z biletem.
    example_gloss: Poproszę herbatę.
  hi.a1.unit15.lesson01.teach.mujhe_tiket_chahiye_phrase:
    title: Potrzebuję biletu.
    gloss: Potrzebuję biletu.
    note: Znany już wzorzec *mujhe...chahiye* zastosowany do nowego rzeczownika z tej lekcji.
  hi.a1.unit15.lesson01.teach.train:
    title: Pociąg
    gloss: pociąg
    note: Nowy rzeczownik.
    example_gloss: Pociąg jest duży.
  hi.a1.unit15.lesson01.teach.delhi_ka_review:
    title: 'Powtórka: Delhi, należący do (dopełniacz)'
    gloss: Delhi, należący do (znacznik dopełniacza)
    note: Delhi poznałeś(-aś) w lekcji 5, a znacznik dopełniacza *ka* pojawia się w całym kursie (np. w lekcjach 5-14). Tu służy do nazwania miejsca docelowego biletu.
    example_gloss:
    - Mój brat mieszka w Delhi.
    - To torba Arjuna.
  hi.a1.unit15.lesson01.teach.mujhe_delhi_ka_tiket_chahiye_phrase:
    title: Potrzebuję biletu do Delhi.
    gloss: Potrzebuję biletu do Delhi.
    note: Łączy rzeczownik z tej lekcji ze wzorcem znacznika dopełniacza, by nazwać konkretne miejsce docelowe.
  hi.a1.unit15.lesson01.teach.kahan_tumhein_review:
    title: 'Powtórka: gdzie, tobie'
    gloss: gdzie, ci / dla ciebie
    note: Oba słowa już poznane (lekcje 8 i 6), tu użyte do zapytania, dokąd ktoś musi jechać.
    example_gloss:
    - Gdzie jest bank?
    - Co chciałbyś?
  hi.a1.unit15.lesson02.teach.number_review:
    title: 'Powtórka: numer'
    gloss: numer
    note: Poznane w lekcji 2 przy numerach telefonu, tu użyte dla numeru peronu.
    example_gloss: Jaki jest twój numer telefonu?
  hi.a1.unit15.lesson02.teach.platform:
    title: Peron
    gloss: peron
    note: Nowy rzeczownik, standardowe hindi słowo oznaczające peron na dworcu kolejowym (częste zapożyczenie z angielskiego, tak jak *phone* w lekcji 2).
    example_gloss: Peron jest duży.
  hi.a1.unit15.lesson02.teach.platform_number_kya_hai_phrase:
    title: Jaki jest numer peronu?
    gloss: Jaki jest numer peronu?
    note: Wykorzystuje znany już wzorzec pytania *kya hai* (np. numer telefonu, cena, wiek) do nowego tematu.
  hi.a1.unit15.lesson02.teach.platform_number_teen_hai_phrase:
    title: Numer peronu to 3.
    gloss: Numer peronu to 3.
    note: Naturalna odpowiedź całym zdaniem na powyższe pytanie.
  hi.a1.unit15.lesson02.teach.jaana_habitual_grammar:
    title: Jaati hai (zgodność w rodzaju żeńskim)
    gloss: '„Jaati hai” stosuje regułę z lekcji 10: -ta/-ti/-te + hai/hain, z nowym czasownikiem „jana”. „ट्रेन” jest w hindi rodzaju żeńskiego, dlatego mówimy „jaati hai”, a nie „jaata hai”.'
    note: Bezpośrednie rozszerzenie poznanego już wzorca zgodności w czasie teraźniejszym zwyczajowym na nowy czasownik i nowy rzeczownik rodzaju żeńskiego.
  hi.a1.unit15.lesson02.teach.se_review:
    title: 'Powtórka: z / od'
    gloss: z / od
    note: Poznane w lekcji 9 przy wskazywaniu drogi, tu użyte dla peronu, z którego odjeżdża pociąg.
    example_gloss: Idź prosto stąd.
  hi.a1.unit15.lesson02.teach.train_platform_se_jaati_hai_phrase:
    title: Pociąg odjeżdża z peronu numer 3.
    gloss: Pociąg odjeżdża z peronu numer 3.
    note: Łączy formę czasu teraźniejszego zwyczajowego z tej lekcji ze znaną już postpozycją oznaczającą „z”.
  hi.a1.unit15.lesson02.teach.kitne_baje_review:
    title: 'Powtórka: o której godzinie'
    gloss: o której godzinie
    note: Poznane w lekcji 4 przy podawaniu godziny, tu użyte do zapytania o godzinę odjazdu.
    example_gloss: Która jest godzina?
  hi.a1.unit15.lesson02.teach.train_kitne_baje_jaati_hai_phrase:
    title: O której odjeżdża pociąg?
    gloss: O której odjeżdża pociąg?
    note: Pytanie „o której godzinie?” zadane o rozkładowy odjazd, a nie o aktualną godzinę.
  hi.a1.unit15.lesson02.teach.train_chhah_baje_jaati_hai_phrase:
    title: Pociąg odjeżdża o szóstej.
    gloss: Pociąg odjeżdża o szóstej.
    note: Naturalna pełna odpowiedź; używa liczby mnogiej *baje* z jednostki 4 (sześć nie jest wyjątkiem *baja*, który dotyczy tylko godziny pierwszej).
  hi.a1.unit15.lesson02.teach.tiket_kitne_ka_hai_phrase:
    title: Ile kosztuje bilet?
    gloss: Ile kosztuje bilet?
    note: Wraca pytanie o cenę *kitne ka/ki* z jednostki 7. Słowo *tikat* zwykle traktuje się jako rodzaj męski (*ka*); wielu mówiących używa go też jako żeńskiego (*kitne ki*), co również jest poprawne.
  hi.a1.unit15.lesson02.teach.rupaye_review:
    title: 'Powtórka: rupie, pięćdziesiąt'
    gloss: rupie, pięćdziesiąt
    note: Oba słowa pojawiły się już w jednostce 2 przy cenach i ilościach – tu wracają przy cenie biletu.
    example_gloss: Mam pięćdziesiąt rupii.
  hi.a1.unit15.lesson02.teach.tiket_pachaas_rupaye_ka_hai_phrase:
    title: Bilet kosztuje 50 rupii.
    gloss: Bilet kosztuje 50 rupii.
    note: Naturalna pełna odpowiedź na powyższe pytanie o cenę.
  hi.a1.unit15.lesson03.teach.hum_hamein:
    title: My, nam
    gloss: my, nam / dla nas
    note: Zaimek „hum” (my) pojawił się już w jednostce 11 jako pierwszy zaimek 1. osoby liczby mnogiej; „hamein” to jego forma celownikowa, potrzebna w dialogu o wspólnej podróży.
    example_gloss:
    - U nas wszystko w porządku.
    - Musimy iść na dworzec.
  hi.a1.unit15.lesson03.teach.hamein_grammar:
    title: 'Hamein: czwarty zaimek w celowniku'
    gloss: „Hamein” to forma celownikowa zaimka „hum” (jednostka 11), tak jak „mujhe” (main) i „tumhein” (tum). Tutaj też przy „jana” słowo „hai” się nie zmienia i nigdy nie przyjmuje formy „hain” – nie zgadza się z „hum”/„hamein”.
    note: Wymienia wszystkie trzy poznane wcześniej zaimki celownikowe wraz z numerem jednostki, zanim doda czwarty, i przypomina tę samą regułę o „hai” z notatki gramatycznej pierwszej lekcji.
  hi.a1.unit15.lesson03.teach.hamein_station_jana_hai_phrase:
    title: Musimy iść na dworzec.
    gloss: Musimy iść na dworzec.
    note: Konstrukcja oznaczająca powinność z nowym zaimkiem celownikowym w liczbie mnogiej.
  hi.a1.unit15.lesson03.teach.ki_review:
    title: 'Powtórka: z / należący do (rodzaj żeński)'
    gloss: z / należący do (wskaźnik przynależności, rodzaj żeński)
    note: Poznane w jednostce 7 razem z *ka*/*kitne* – wraca tu, bo „pociąg” jest w hindi rodzaju żeńskiego, więc używa formy „ki”, a nie „ka”.
    example_gloss: To jest pociąg do Delhi.
  hi.a1.unit15.lesson03.teach.dialogue.line01:
    title: Arjun mówi, że muszą iść
    gloss: Priya, musimy iść na dworzec.
  hi.a1.unit15.lesson03.teach.dialogue.line02:
    title: Priya potrzebuje biletu do Delhi
    gloss: Dobrze. Potrzebuję biletu do Delhi.
  hi.a1.unit15.lesson03.teach.dialogue.line03:
    title: Arjun pyta o cenę
    gloss: Ja też. Ile kosztuje bilet?
  hi.a1.unit15.lesson03.teach.dialogue.line04:
    title: Priya podaje cenę
    gloss: Bilet kosztuje 50 rupii.
  hi.a1.unit15.lesson03.teach.dialogue.line05:
    title: Arjun pyta o godzinę odjazdu
    gloss: Dobrze. O której odjeżdża pociąg?
  hi.a1.unit15.lesson03.teach.dialogue.line06:
    title: Priya podaje godzinę i peron
    gloss: Pociąg odjeżdża o szóstej z peronu numer 3.
  hi.a1.unit15.lesson03.teach.dialogue.line07:
    title: Arjun rozumie i mówi „chodźmy”
    gloss: Rozumiem. Chodźmy!
  hi.a1.unit15.lesson03.teach.dialogue.line08:
    title: Priya się zgadza
    gloss: Chodźmy!
  hi.a1.unit15.lesson03.teach.grammar_summary:
    title: Trzy główne reguły
    gloss: 'Trzy główne reguły tej jednostki: (1) „mujhe/tumhein/hamein + czasownik + hai” znaczy „musieć ___”; (2) „X kitne ka/ki hai?” to pytanie o cenę; (3) „X [godzina] baje [miejsce] se jaati hai” podaje godzinę i miejsce odjazdu.'
    note: Podsumowanie całej gramatyki jednostki, podobne do notatki z jednostki 14, która łączyła cały paradygmat.
  hi.a1.unit15.lesson03.teach.tiket_reading:
    title: Czytanie biletu
    gloss: 'Bilet: Delhi. Peron numer 3. Godzina szósta.'
    note: Krótki, urywany tekst z biletu (bez pełnych zdań, jak na prawdziwym bilecie), powtarzający dokładnie fakty z dialogu, bez nowych informacji.
    glosses:
      टिकट: bilet
      प्लेटफ़ॉर्म: peron
      नंबर: numer
      बजे: godzina
