teaching:
  hi.a1.unit32.lesson01.teach.janvar_paltoo_janvar:
    title: Zwierzę, zwierzę domowe
    gloss: zwierzę / zwierzę domowe
    note: '*जानवर* to ogólne słowo oznaczające zwierzę, a *पालतू जानवर* („oswojone zwierzę”) znaczy zwierzę domowe.'
    example_gloss:
    - Pies to zwierzę.
    - Pies to też zwierzę domowe.
  hi.a1.unit32.lesson01.teach.kutta_billee:
    title: Pies i kot
    gloss: pies / kot
    example_gloss:
    - Priya ma psa.
    - Vikram ma kota.
  hi.a1.unit32.lesson01.teach.machhlee_chiriya:
    title: Ryba i ptak
    gloss: ryba / ptak
    example_gloss:
    - Dziadek ma rybę.
    - Nina ma ptaka.
  hi.a1.unit32.lesson01.teach.kya_tumhare_pas:
    title: Masz zwierzę domowe?
    gloss: Masz zwierzę domowe?
    note: '*तुम्हारे पास ... है?* („przy tobie ... jest?”) pyta „czy masz ...?”, a *कोई* („jakiś”) zostawia pytanie otwarte.'
  hi.a1.unit32.lesson01.teach.han_mere_pas:
    title: Tak, mam psa
    gloss: Tak, mam psa.
    note: Prosta odpowiedź twierdząca z nowym słownictwem z tej lekcji.
  hi.a1.unit32.lesson01.teach.naheen_mere_pas:
    title: Nie, nie mam zwierzęcia domowego
    gloss: Nie, nie mam zwierzęcia domowego.
    note: '*कोई ... नहीं है* („nie ma żadnego ...”) mówi, że czegoś nie masz.'
  hi.a1.unit32.lesson01.teach.mere_pas_koee:
    title: कोई ... नहीं
    gloss: Nie mam zwierzęcia domowego.
    note: '*कोई* („jakiś”) z *नहीं है* neguje posiadanie: *मेरे पास कोई पालतू जानवर नहीं है*.'
  hi.a1.unit32.lesson02.teach.ghumane_le_jana:
    title: Wyprowadzać na spacer (zwierzę)
    gloss: wyprowadzać na spacer (zwierzę)
    note: '*घुमाने ले जाना* („zabrać na spacer”) to sposób, w jaki hindi mówi „wyprowadzać zwierzę”; po *घुमाने* następuje *ले जाना*.'
    example_gloss: Codziennie wyprowadzam psa na spacer.
  hi.a1.unit32.lesson02.teach.vah_kutte_ko:
    title: घुमाने ले जाना
    gloss: Ona zabiera psa na spacer.
    note: Zwierzę przyjmuje *को* (*कुत्ते को*), a *घुमाने ले जाती है* stoi na końcu; *ले जाना* („zabrać ze sobą”) zawsze pozostaje razem, jako dwa słowa.
  hi.a1.unit32.lesson02.teach.khana_dena:
    title: Karmić
    gloss: karmić
    example_gloss: Codziennie karmię kota.
  hi.a1.unit32.lesson02.teach.ke_sath_khelna:
    title: Bawić się z
    gloss: bawić się z
    example_gloss: Vikram bawi się ze swoim kotem.
  hi.a1.unit32.lesson02.teach.main_roz_kutte:
    title: Codziennie wyprowadzam psa
    gloss: Codziennie wyprowadzam psa na spacer.
    note: '*रोज़* („codziennie”) stoi przed dopełnieniem: *रोज़ कुत्ते को घुमाने ले जाता हूँ*.'
  hi.a1.unit32.lesson02.teach.main_roz_billee:
    title: Codziennie karmię kota
    gloss: Codziennie karmię kota.
    note: '*खाना देना* („dawać jedzenie”) wskazuje, kto dostaje jedzenie, za pomocą *को*: *बिल्ली को खाना देता हूँ*.'
  hi.a1.unit32.lesson03.teach.ek_kutta_do:
    title: Liczba mnoga
    gloss: Jeden pies, dwa psy; jeden kot, dwa koty. Rzeczownik rodzaju męskiego zakończony na *-आ* zmienia w liczbie mnogiej końcówkę na *-ए* (*कुत्ता* → *कुत्ते*), a rzeczownik rodzaju żeńskiego zakończony na *-ई* dodaje *-याँ* (*बिल्ली* → *बिल्लियाँ*).
    note: Regularny wzorzec liczby mnogiej w hindi, wprowadzony tu po raz pierwszy na przykładzie nazw zwierząt.
  hi.a1.unit32.lesson03.teach.kutte_billiyan:
    title: Psy i koty
    gloss: psy / koty
    example_gloss:
    - Arjun uwielbia psy.
    - Neha uwielbia koty.
  hi.a1.unit32.lesson03.teach.machhliyan_chiriyan:
    title: Ryby i ptaki (liczba mnoga)
    gloss: ryby / ptaki
    example_gloss:
    - Uwielbiam ryby.
    - Dziadek uwielbia ptaki.
  hi.a1.unit32.lesson03.teach.mujhe_janvar_bahut:
    title: Kocham zwierzęta
    gloss: Kocham zwierzęta.
    note: '*मुझे जानवर बहुत पसंद हैं* („mnie zwierzęta są bardzo lubiane”) znaczy „uwielbiam zwierzęta”; *हैं* jest w liczbie mnogiej, bo *जानवर* jest w liczbie mnogiej.'
  hi.a1.unit32.lesson03.teach.neha_ko_billiyan:
    title: Neha uwielbia koty, ale nie ma zwierzęcia
    gloss: Neha uwielbia koty, ale nie ma zwierzęcia domowego.
    note: 'Przeciwstawienie: kochać zwierzęta, a mimo to żadnego nie mieć.'
  hi.a1.unit32.lesson04.teach.arjun_kya_tumhare:
    title: Arjun pyta o zwierzę domowe
    gloss: 'Arjun: Czy masz zwierzę domowe, Priya?'
  hi.a1.unit32.lesson04.teach.priya_han_mere:
    title: Priya ma psa
    gloss: 'Priya: Tak, mam psa.'
  hi.a1.unit32.lesson04.teach.arjun_vah_kaisa:
    title: Arjun pyta, jak on wygląda
    gloss: 'Arjun: Jak on wygląda?'
    note: '*वह कैसा दिखता है?* pasuje też do zwierząt, a *कैसा* jest rodzaju męskiego, bo pies jest samcem.'
  hi.a1.unit32.lesson04.teach.priya_uske_bal:
    title: Priya opisuje swojego psa
    gloss: 'Priya: Ma brązowe włosy i jest mały.'
    note: Słownictwo o kolorze włosów i wielkości z lekcji o wyglądzie, tym razem do opisu sierści zwierzęcia, a nie włosów człowieka.
  hi.a1.unit32.lesson04.teach.vah_mera_kutta:
    title: वह w odniesieniu do zwierząt
    gloss: To mój pies. Bardzo go lubię.
    note: '*वह* i *उसे* odnoszą się zarówno do zwierząt, jak i do ludzi; w hindi nie ma tu osobnego słowa na „to”.'
  hi.a1.unit32.lesson04.teach.arjun_kya_tum:
    title: Arjun pyta o spacery
    gloss: 'Arjun: Czy codziennie wychodzisz z nim na spacer?'
  hi.a1.unit32.lesson04.teach.priya_han_main:
    title: Priya opowiada o swojej rutynie
    gloss: 'Priya: Tak, codziennie wychodzę z nim na spacer i daję mu jeść.'
  hi.a1.unit32.lesson05.teach.arjun_aur_neha:
    title: Arjun, Neha i Vikram o zwierzętach
    gloss: 'Arjun i Neha bardzo kochają zwierzęta, ale żadne z nich nie ma zwierzaka. Arjun uwielbia psy, a Neha uwielbia koty. Vikram ma zwierzaka: kota. Często bawi się ze swoim kotem i codziennie daje mu jeść. Czy ty masz jakieś zwierzę domowe?'
    note: 'Przeciwstawienie: kochać zwierzę a rzeczywiście je mieć.'
    glosses:
      पसंद: kochać
      दोनों: oboje
      जानवर: zwierzęta
      किसी: któreś z nich
      पालतू: zwierzę domowe
      कुत्ते: psy
      बिल्लियाँ: koty
      बिल्ली: kot
      खेलता: bawi się
      देता: daje
      रोज़: każdy
      खाना: karma
  hi.a1.unit32.lesson05.teach.vikram_aksar_apnee:
    title: Vikram często bawi się ze swoim kotem
    gloss: Vikram często bawi się ze swoim kotem.
    note: '*अक्सर* („często”) stoi przed czasownikiem, a *अपनी* zgadza się z rodzajem żeńskim słowa *बिल्ली*.'
  hi.a1.unit32.lesson05.teach.mujhe_kutte_bahut:
    title: Kocham psy. Nie mam zwierzęcia domowego.
    gloss: Kocham psy. Nie mam zwierzęcia domowego.
    note: Wzorcowa odpowiedź z dwóch zdań, którą możesz wykorzystać w zadaniu pisemnym z tej lekcji.
  hi.a1.unit32.lesson06.teach.priya_neena_kya:
    title: Priya pyta Ninę
    gloss: 'Priya: Nina, ty też masz zwierzaka?'
  hi.a1.unit32.lesson06.teach.neena_han_mere:
    title: Nina ma ptaka o imieniu Pico
    gloss: 'Nina: Tak, mam ptaka. Nazywa się Pico.'
    note: W zdaniu *उसका नाम पिको है* („ma na imię Pico”) użyto *का*, ponieważ *नाम* jest rodzaju męskiego.
  hi.a1.unit32.lesson06.teach.arjun_vah_kitna:
    title: Reakcja Arjuna
    gloss: 'Arjun: Jak miło! Co z nim robisz codziennie?'
  hi.a1.unit32.lesson06.teach.neena_main_use:
    title: Nina codziennie karmi ptaka
    gloss: 'Nina: Codziennie daję mu jeść.'
  hi.a1.unit32.lesson06.teach.arjun_mujhe_bhee:
    title: Arjun też kocha ptaki
    gloss: 'Arjun: Ja też bardzo lubię ptaki.'
  hi.a1.unit32.lesson06.teach.priya_kitna_achchha:
    title: Priya kończy rozmowę
    gloss: 'Priya: Jak miło, że całą naszą trójkę łączy miłość do zwierząt!'
    note: Zakończenie rozmowy, które łączy to, co w tej lekcji wiemy o zwierzętach wszystkich trojga bohaterów.
