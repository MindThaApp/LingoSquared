answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (हूँ, हाँ, कहाँ vs. मैं, हैं, में, मिलेंगे). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (हूं for हूँ, हां for हाँ) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
  description: 'Naucz się witać ludzi, pytać, co u kogoś słychać, przedstawiać się i wymieniać podstawowe informacje o sobie po hindi. Zwrócimy uwagę na system grzeczności aap/tum (realne rozróżnienie gramatyczne, które w polskim wyraża się inaczej niż w hindi: przez Pan/Pani i ty) oraz na przymiotniki i formy czasownika zgodne z rodzajem, które w hindi występują nieco inaczej niż w polskim.'
units:
  hi.a1.unit01.greetings:
    title: Namaste i pierwsze spotkania
lessons:
  hi.a1.unit01.lesson01.aap_and_tum:
    title: 'Aap i tum: pytamy, co u kogoś słychać'
  hi.a1.unit01.lesson02.greetings_and_farewells:
    title: Powitania i pożegnania
  hi.a1.unit01.lesson03.names_origin_and_dialogue:
    title: Imiona, pochodzenie i pierwsze spotkanie na zajęciach jogi
teaching:
  hi.a1.unit01.lesson01.teach.aap:
    title: Formalne, pełne szacunku „ty”
    gloss: Pan/Pani, wy (formalnie, z szacunkiem)
    note: Po polsku formę grzecznościową wyraża się przez „Pan/Pani”, a w hindi robi to osobne zaimek. *Aap* używa się wobec osoby starszej, nieznajomej lub w relacji zawodowej wymagającej szacunku. Gramatycznie jest traktowany jak liczba mnoga, nawet gdy mowa o jednej osobie – czasowniki przy *aap* mają te same końcówki typu -en/hain, co przy „oni”.
  hi.a1.unit01.lesson01.teach.tum:
    title: Nieformalne „ty”
    gloss: ty (nieformalnie, poufale)
    note: '*Tum* stosuje się wobec przyjaciela, rówieśnika, osoby młodszej lub członka rodziny – to relacja swobodna, ale wciąż pełna szacunku (inaczej niż jeszcze bardziej poufałe *tu*, którego ten kurs nie uczy). *Tum* ma własne, odrębne końcówki czasownika, inne niż przy *aap* i przy *tu*.'
  hi.a1.unit01.lesson01.teach.aap_kaise_hain:
    title: Formalne pytanie o samopoczucie, do mężczyzny
    gloss: Jak się Pan ma? (formalnie, do mężczyzny)
    note: '*Kaise* zgadza się z RODZAJEM OSOBY, DO KTÓREJ SIĘ MÓWI, a nie mówiącego – tej formy używa się, zwracając się do mężczyzny. Podobnie jak w polskim „Jak się Pan/Pani ma?” pytanie jest formalne, ale w hindi sam przymiotnik zmienia formę zależnie od rodzaju rozmówcy.'
  hi.a1.unit01.lesson01.teach.aap_kaisi_hain:
    title: Formalne pytanie o samopoczucie, do kobiety
    gloss: Jak się Pani ma? (formalnie, do kobiety)
    note: To samo pytanie, ten sam rejestr *aap* – zmienia się tylko *kaisi* zamiast *kaise*, zgodnie z rodzajem żeńskim rozmówczyni. Czasownik *hain* nie zmienia się nigdy; zmienia się tylko przymiotnik.
  hi.a1.unit01.lesson01.teach.tum_kaise_ho:
    title: Nieformalne pytanie o samopoczucie
    gloss: Jak się masz? (nieformalnie)
    note: Przy *tum* czasownik to *ho*, a nie *hain* – porównaj formalne *Aap kaise/kaisi hain?* z nieformalnym *Tum kaise ho?*. To najlepsza para minimalna, by usłyszeć różnicę między aap a tum w samym czasowniku.
  hi.a1.unit01.lesson01.teach.main_theek_hoon:
    title: Standardowa odpowiedź
    gloss: Dobrze, dziękuję.
    note: '*Theek* („dobrze, w porządku”) nie zmienia się w zależności od rodzaju ani rejestru – w przeciwieństwie do *kaise/kaisi* zawsze brzmi tak samo, bez względu na to, kto mówi i do kogo.'
  hi.a1.unit01.lesson01.teach.aur_aap:
    title: Zwrot pytania w formie formalnej
    gloss: A Panu/Pani?
    note: Krótki sposób, by zwrócić pytanie w grzecznościowym rejestrze aap.
  hi.a1.unit01.lesson01.teach.aur_tum:
    title: Zwrot pytania w formie nieformalnej
    gloss: A tobie?
    note: Użyj tum, by zwrócić pytanie przyjacielowi lub rówieśnikowi.
  hi.a1.unit01.lesson02.teach.namaste:
    title: Uniwersalne powitanie
    gloss: cześć; dzień dobry (używane też na pożegnanie)
    note: '*Namaste* pasuje o każdej porze dnia, w sytuacjach formalnych i nieformalnych, na początek i na koniec rozmowy – jest naprawdę uniwersalne, podczas gdy polski rozdziela powitania i pożegnania na osobne słowa.'
    example_gloss: Cześć! Jak się masz?
  hi.a1.unit01.lesson02.teach.namaskar:
    title: Pełne szacunku powitanie
    gloss: dzień dobry (bardziej formalnie i z szacunkiem niż namaste)
    note: '*Namaskar* znaczy w zasadzie to samo co *namaste*, ale brzmi bardziej formalnie i z szacunkiem – pasuje wobec osoby starszej, przed licznym audytorium lub w sytuacji zawodowej.'
    example_gloss: Namaskar! A Pan/Pani?
  hi.a1.unit01.lesson02.teach.phir_milenge:
    title: Do zobaczenia (czas przyszły)
    gloss: do zobaczenia; do następnego razu
    note: Dosłownie „[my] spotkamy się znowu” – standardowy, neutralny sposób pożegnania, gdy spodziewasz się jeszcze zobaczyć tę osobę.
  hi.a1.unit01.lesson02.teach.alvida:
    title: Formalne pożegnanie
    gloss: do widzenia; żegnaj
    note: '*Alvida* to prawdziwe, poprawne hindi słowo oznaczające pożegnanie, ale w codziennym użyciu brzmi bardziej ostatecznie, formalnie, a nawet nieco dramatycznie niż *namaste* czy *phir milenge* – bliżej mu do „żegnaj” niż do luźnego „pa”.'
    example_gloss: Do widzenia! Do zobaczenia.
  hi.a1.unit01.lesson02.teach.phir_milte_hain:
    title: Do zobaczenia (swobodnie/zwyczajowo)
    gloss: do zobaczenia; do zobaczyska
    note: Dosłownie „[my] spotykamy się znowu” – forma czasu teraźniejszego/zwyczajowego zamiast przyszłego; nieco swobodniejszy, codzienny odpowiednik *phir milenge*.
  hi.a1.unit01.lesson02.teach.shubh_ratri:
    title: Dobranoc
    gloss: dobranoc
    note: Mówi się to, gdy ktoś wychodzi na noc lub idzie spać – tak jak polskie „dobranoc” jest to pożegnanie, nigdy powitanie, w przeciwieństwie do *namaste*.
  hi.a1.unit01.lesson02.teach.shubh_din:
    title: Grzeczne życzenie na pożegnanie
    gloss: Miłego dnia.
    note: Dosłownie „niech Twój dzień pozostanie dobry” – uprzejme życzenie na pożegnanie, odpowiednie zarówno w relacji formalnej, jak i nieformalnej.
  hi.a1.unit01.lesson03.teach.aapka_naam_kya_hai:
    title: Pytanie o imię, formalnie
    gloss: Jak się Pan/Pani nazywa? (oficjalnie)
    note: '*Aapka* („Pana/Pani”) zgadza się z rzeczownikiem męskim *naam* („imię”) – zaimki dzierżawcze w hindi zmieniają formę zależnie od rzeczy posiadanej, a nie posiadacza. W polskim zmieniają się one również przez rodzaj rzeczy, ale w hindi dotyczy to innych form.'
  hi.a1.unit01.lesson03.teach.tumhara_naam_kya_hai:
    title: Pytanie o imię, nieformalnie
    gloss: Jak masz na imię? (nieformalnie)
    note: Ten sam wzór, z *tumhara* („twoje”, nieformalnie) zamiast *aapka*. Porównaj formalne *Aapka naam kya hai?* z nieformalnym *Tumhara naam kya hai?*.
  hi.a1.unit01.lesson03.teach.mera_naam_priya_hai:
    title: Podaj swoje imię
    gloss: Mam na imię Priya.
    note: '*Mera* („mój”) też zgadza się z rodzajem męskim *naam* – zauważ, że ma tę samą męską końcówkę co *aapka*/*tumhara* powyżej, bo wszystkie trzy określają ten sam rzeczownik.'
  hi.a1.unit01.lesson03.teach.aapse_milkar_khushi_hui:
    title: Radość z poznania kogoś, formalnie
    gloss: Miło mi Pana/Panią poznać. (formalnie)
    note: Dosłownie „spotkawszy Pana/Panią, zdarzyła się radość” – stałe, powszechnie używane wyrażenie przy pierwszym, pełnym szacunku spotkaniu.
  hi.a1.unit01.lesson03.teach.mujhe_bhi:
    title: Odwzajemnienie uczuć
    gloss: Ja też.
    note: Krótka, naturalna odpowiedź na Aapse milkar khushi hui lub Tumse milkar accha laga.
  hi.a1.unit01.lesson03.teach.aap_kahan_se_hain:
    title: Pytanie o pochodzenie, formalnie
    gloss: Skąd Pan/Pani pochodzi? (oficjalnie)
    note: Kahan znaczy „gdzie”, a se znaczy „z”.
  hi.a1.unit01.lesson03.teach.main_bharat_se_hoon:
    title: Powiedz, skąd pochodzisz
    gloss: Jestem z Indii.
    note: Bharat to hindi nazwa Indii, używana nieustannie w codziennej mowie.
  hi.a1.unit01.lesson03.teach.tum_kahan_se_ho:
    title: Pytanie o pochodzenie, nieformalnie
    gloss: Skąd jesteś? (nieformalnie)
    note: To samo pytanie z *tum* i *ho* zamiast *aap* i *hain* – ten sam wzór formalnych i nieformalnych końcówek czasownika, jaki widzisz w całej tej lekcji.
  hi.a1.unit01.lesson03.teach.dialogue.line01:
    title: Początek spotkania
    gloss: Priya wita Arjuna i pyta, czy jest tu pierwszy raz.
    note: Oboje od początku mówią sobie na *tum* – to naturalne dla rówieśników, którzy poznają się na zajęciach w lokalnej społeczności. *Tumhari* („twój”) zgadza się z rzeczownikiem żeńskim *baar* („raz”), a nie z rodzajem żadnego z rozmówców.
  hi.a1.unit01.lesson03.teach.dialogue.line02:
    title: Początek spotkania, odpowiedź
    gloss: Arjun mówi, że tak, jest tu pierwszy raz i że chce nauczyć się jogi.
    note: '*Chahta hoon* („chcę”) ma tu formę męską, bo mówiący, Arjun, jest mężczyzną – ten czasownik zgadza się z rodzajem MÓWIĄCEGO, w przeciwieństwie do wcześniejszego *kaisi*/*kaise*, które zgadzało się z osobą, DO KTÓREJ SIĘ MÓWI.'
  hi.a1.unit01.lesson03.teach.dialogue.line03:
    title: Wymiana imion
    gloss: Priya mówi „ja też!”, podaje swoje imię i pyta Arjuna o jego.
    note: '*Main bhi!* („ja też!”) odpowiada na *main ... chahta hoon* Arjuna: gdy podmiotem zdania rozmówcy jest *main*, „ja też” to *main bhi*. *Mujhe bhi* jest odpowiedzią na zdanie typu *mujhe*, np. *Tumse milkar accha laga*. *Mera naam...hai* to naturalny, prosty sposób podania imienia.'
  hi.a1.unit01.lesson03.teach.dialogue.line04:
    title: Wymiana imion, odpowiedź
    gloss: Arjun podaje swoje imię i mówi nieformalnie, że miło mu ją poznać.
    note: '*Tumse milkar accha laga* to nieformalny odpowiednik formalnego *Aapse milkar khushi hui* z tej lekcji – oba znaczą mniej więcej „miło cię poznać”, dopasowane do rejestru.'
  hi.a1.unit01.lesson03.teach.dialogue.line05:
    title: Pytanie o pochodzenie
    gloss: Priya odwzajemnia uprzejmość i pyta, skąd jest Arjun.
    note: Tum kahan se ho pyta o pochodzenie w poznanym już nieformalnym rejestrze.
  hi.a1.unit01.lesson03.teach.dialogue.line06:
    title: Pytanie o pochodzenie, odpowiedź
    gloss: Arjun pochodzi z Indii, ale obecnie mieszka w Londynie, po czym zadaje to samo pytanie Priyi.
    note: '*Rahta hoon* („mieszkam”) ma formę męską, zgodną z Arjunem jako mówiącym – ten sam wzór zgodności z podmiotem co *chahta hoon* w line02. *Lekin* („ale”) łączy kontrast między pochodzeniem a obecnym miejscem zamieszkania.'
  hi.a1.unit01.lesson03.teach.dialogue.line07:
    title: Rozmowa o pochodzeniu i zainteresowaniu
    gloss: Priya mówi, że jest z Ameryki i że też chce nauczyć się jogi.
    note: '*Chahti hoon* to żeńska forma tego samego czasownika, którego użył Arjun w line02 (*chahta hoon*) – oba zgadzają się z rodzajem własnego mówiącego, co daje bezpośrednią parę minimalną do porównania.'
  hi.a1.unit01.lesson03.teach.dialogue.line08:
    title: Pytanie o wspólne zajęcie
    gloss: Arjun reaguje pozytywnie i pyta, czy Priya ćwiczy jogę.
    note: '*Karti ho* („czy robisz”) ma formę żeńską, zgodną z Priyą jako osobą, do której się mówi – podobnie jak wcześniejsze *kaisi* ta forma czasownika odzwierciedla rodzaj ROZMÓWCY, a nie mówiącego.'
  hi.a1.unit01.lesson03.teach.dialogue.line09:
    title: Pytanie o wspólne zajęcie, odpowiedź
    gloss: Priya mówi, że nie, że to jej pierwszy raz i że dopiero się uczy.
    note: '*Seekh rahi hoon* („uczę się”) ma żeńską formę ciągłą, zgodną z Priyą jako mówiącą – to odpowiednik czasu ciągłego dla *chahti hoon*.'
  hi.a1.unit01.lesson03.teach.dialogue.line10:
    title: Zakończenie rozmowy
    gloss: Arjun zgadza się zacząć, po czym mówi „do zobaczenia”.
    note: '*Chalo shuru karte hain* („zaczynajmy”) to stały, naturalny sposób zaproponowania wspólnego rozpoczęcia czegoś. *Phir milte hain* kończy rozmowę swobodnym pożegnaniem z lekcji 2.'
exercises:
  hi.a1.unit01.lesson01.exercise01.select_aap:
    instruction: Które słowo oznacza formalne, pełne szacunku „Pan/Pani/wy”?
    correct_option: आप
    distractors:
    - तुम
    - और
    accepted_answers:
    - आप
    feedback: Aap używa się wobec osoby starszej, nieznajomej lub w relacji wymagającej szacunku.
  hi.a1.unit01.lesson01.exercise02.select_tum:
    instruction: Które słowo służy do nieformalnego zwracania się do jednego przyjaciela lub rówieśnika?
    correct_option: तुम
    distractors:
    - आप
    - और
    accepted_answers:
    - तुम
    feedback: Tum używa się wobec przyjaciół, rówieśników i w innych relacjach swobodnych, ale pełnych szacunku.
  hi.a1.unit01.lesson01.exercise03.select_aap_kaisi_hain_meaning:
    instruction: O co pyta to pytanie i do kogo jest skierowane?
    correct_option: Jak się Pani ma? (formalnie, do kobiety)
    distractors:
    - Jak się Pan ma? (formalnie, do mężczyzny)
    - A Pan/Pani?
    accepted_answers:
    - Jak się Pani ma? (formalnie, do kobiety)
    feedback: Kaisi zgadza się z rozmówczynią; kaise użyłbyś wobec mężczyzny.
  hi.a1.unit01.lesson01.exercise04.order_aap_kaise_hain:
    instruction: Ułóż w kolejności formalne pytanie o samopoczucie (do mężczyzny).
    correct_response:
    - आप
    - कैसे
    - हैं
  hi.a1.unit01.lesson01.exercise05.order_tum_kaise_ho:
    instruction: Ułóż w kolejności nieformalne pytanie o samopoczucie.
    correct_response:
    - तुम
    - कैसे
    - हो
  hi.a1.unit01.lesson01.exercise06.return_formal:
    instruction: Zwróć pytanie, zachowując grzecznościowy rejestr.
    correct_option: और आप?
    distractors:
    - और तुम?
    - तुम कैसे हो?
    accepted_answers:
    - और आप?
    - और आप
    feedback: Aur aap? zachowuje formalny rejestr przy zwracaniu pytania.
  hi.a1.unit01.lesson01.exercise07.return_informal:
    instruction: Zwróć pytanie przyjacielowi lub rówieśnikowi.
    correct_option: और तुम?
    distractors:
    - और आप?
    - आप कैसे हैं?
    accepted_answers:
    - और तुम?
    - और तुम
    feedback: Aur tum? to nieformalny sposób zwrócenia pytania.
  hi.a1.unit01.lesson01.exercise08.correct_informal_agreement:
    instruction: Popraw nieformalne pytanie – łączy tum z niewłaściwą końcówką czasownika.
    accepted_answers:
    - तुम कैसे हो?
    - तुम कैसे हो
    feedback: Tum ma końcówkę ho, a nie hain – hain stosuje się tylko z aap.
  hi.a1.unit01.lesson01.exercise09.reply_formally:
    instruction: 'Odpowiedz grzecznie: powiedz, że u ciebie dobrze, i podziękuj.'
    accepted_answers:
    - मैं ठीक हूँ, शुक्रिया।
    - मैं ठीक हूँ, शुक्रिया
    - मैं ठीक हूं, शुक्रिया।
    - मैं ठीक हूँ, शुक्रिया। और आप?
    - मैं ठीक हूँ, शुक्रिया, और आप?
    - मैं ठीक हूं, शुक्रिया। और आप?
    - मैं ठीक हूं, शुक्रिया, और आप?
  hi.a1.unit01.lesson01.exercise10.speak_informally:
    instruction: Odpowiedz nieformalnie, podziękuj i zadaj pytanie zwrotne.
    accepted_answers:
    - मैं ठीक हूँ, शुक्रिया। और तुम?
    - मैं ठीक हूँ, शुक्रिया, और तुम?
    - मैं ठीक हूँ, शुक्रिया। और तुम
    - मैं ठीक हूं, शुक्रिया। और तुम?
    - मैं ठीक हूं, शुक्रिया, और तुम?
  hi.a1.unit01.lesson02.exercise01.select_namaste:
    instruction: Które słowo może znaczyć zarówno „cześć”, jak i „do widzenia”?
    correct_option: नमस्ते
    distractors:
    - अलविदा
    - शुभ रात्रि
    accepted_answers:
    - नमस्ते
  hi.a1.unit01.lesson02.exercise02.select_alvida:
    instruction: Które słowo oznacza formalne, brzmiące ostatecznie pożegnanie?
    correct_option: अलविदा
    distractors:
    - नमस्ते
    - फिर मिलेंगे
    accepted_answers:
    - अलविदा
  hi.a1.unit01.lesson02.exercise03.select_shubh_ratri_meaning:
    instruction: Co oznacza to wyrażenie?
    correct_option: Dobranoc.
    distractors:
    - Dzień dobry.
    - Do zobaczenia.
    accepted_answers:
    - Dobranoc.
    feedback: Shubh raatri to pożegnanie mówione, gdy ktoś wychodzi na noc, a nie powitanie.
  hi.a1.unit01.lesson02.exercise04.order_phir_milenge:
    instruction: Ułóż w kolejności pożegnanie „do zobaczenia”.
    correct_response:
    - फिर
    - मिलेंगे
  hi.a1.unit01.lesson02.exercise05.order_shubh_ratri:
    instruction: Ułóż w kolejności pożegnanie „dobranoc”.
    correct_response:
    - शुभ
    - रात्रि
  hi.a1.unit01.lesson02.exercise06.order_phir_milte_hain:
    instruction: Ułóż w kolejności swobodne pożegnanie „do zobaczenia”.
    correct_response:
    - फिर
    - मिलते
