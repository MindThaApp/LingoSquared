    gloss: 'अन्ना कहती है: यह मेरी बहन है। मेरी बहन शिक्षिका है।'
    note: 'जर्मन में पेशे से पहले आर्टिकल नहीं लगता: *Meine Schwester ist Lehrerin* = ''मेरी बहन शिक्षिका है।'' *Lehrerin*, *Lehrer* का स्त्रीलिंग रूप है।'
  de.a1.unit06.lesson04.teach.line05:
    title: फ़ेलिक्स भाइयों के बारे में पूछता है
    gloss: 'फ़ेलिक्स कहता है: क्या आपके भाई हैं?'
    note: '*Brüder*, *Bruder* का बहुवचन है।'
  de.a1.unit06.lesson04.teach.line06:
    title: अन्ना जवाब देती है
    gloss: 'अन्ना कहती है: नहीं। मेरी सिर्फ़ एक बहन है।'
    note: '*nur* = ''सिर्फ़ / केवल''।'
  de.a1.unit06.lesson04.teach.bildunterschrift:
