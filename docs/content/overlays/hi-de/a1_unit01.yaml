teaching:
  de.a1.unit01.lesson01.teach.hallo:
    title: Hallo
    gloss: नमस्ते / हाय
    note: '*Hallo* एक अनौपचारिक, हर समय इस्तेमाल होने वाला अभिवादन है, जैसे हिंदी में "हाय" या "हैलो"।'
    example_gloss: नमस्ते, फ़ेलिक्स!
  de.a1.unit01.lesson01.teach.guten_morgen:
    title: Guten Morgen
    gloss: सुप्रभात
    note: '*Guten Morgen* सुबह के समय कहा जाता है, लगभग देर सुबह तक।'
  de.a1.unit01.lesson01.teach.guten_tag:
    title: Guten Tag
    gloss: शुभ दिन / नमस्ते
    note: '*Guten Tag* दिन का सामान्य और थोड़ा औपचारिक अभिवादन है, जो देर सुबह से दोपहर तक कभी भी कहा जा सकता है।'
  de.a1.unit01.lesson01.teach.guten_abend:
    title: Guten Abend
    gloss: शुभ संध्या
    note: '*Guten Abend* शाम को कहीं पहुँचने पर कहा जाता है। यह मिलने का अभिवादन है, विदाई नहीं।'
  de.a1.unit01.lesson02.teach.tschuss:
    title: Tschüss
    gloss: टाटा / बाय
    note: '*Tschüss* दोस्तों और जान-पहचान के लोगों के बीच अलविदा कहने का अनौपचारिक और बहुत आम तरीका है।'
    example_gloss: बाय, जल्दी मिलते हैं!
  de.a1.unit01.lesson02.teach.auf_wiedersehen:
    title: Auf Wiedersehen
    gloss: अलविदा (औपचारिक)
    note: '*Auf Wiedersehen* का शाब्दिक अर्थ है "फिर मिलने तक"। यह सामान्य, अधिक औपचारिक विदाई है, जो अजनबियों के साथ या काम की जगह पर उचित रहती है।'
  de.a1.unit01.lesson02.teach.bis_bald:
    title: Bis bald
    gloss: जल्दी मिलते हैं
    note: '*Bis bald* अलविदा कहने का मित्रतापूर्ण तरीका है, जब आप उस व्यक्ति से जल्द दोबारा मिलने की उम्मीद करते हैं।'
  de.a1.unit01.lesson02.teach.bis_spater:
    title: Bis später
    gloss: बाद में मिलते हैं
    note: '*Bis später* तब कहा जाता है जब आप उसी दिन बाद में उस व्यक्ति से फिर मिलने वाले हों।'
  de.a1.unit01.lesson02.teach.gute_nacht:
    title: Gute Nacht
    gloss: शुभ रात्रि
    note: '*Gute Nacht* तब कहा जाता है जब कोई सोने जा रहा हो या दिन खत्म कर रहा हो। *Guten Abend* के उलट, यह विदाई है, अभिवादन नहीं।'
  de.a1.unit01.lesson03.teach.sie:
    title: Sie
    gloss: आप (औपचारिक)
    note: '*Sie* औपचारिक "आप" है। यह वाक्य के बीच में भी बड़े अक्षर से लिखा जाता है और अजनबियों, बड़ों या औपचारिक/पेशेवर स्थितियों में इस्तेमाल होता है। हिंदी के "आप" और "तुम" जैसा भेद जर्मन में Sie और du के बीच है, पर यहाँ यह व्याकरण का नियम है और Sie हमेशा बड़े अक्षर से लिखा जाता है।'
  de.a1.unit01.lesson03.teach.du:
    title: du
    gloss: तुम (अनौपचारिक)
    note: '*du* अनौपचारिक "तुम" है, जो दोस्तों, परिवार और बच्चों के साथ इस्तेमाल होता है। किसी अजनबी से *du* कहना ज़्यादा बेतकल्लुफ़ या अशिष्ट लग सकता है।'
  de.a1.unit01.lesson03.teach.wie_geht_es_ihnen:
    title: Wie geht es Ihnen?
    gloss: आप कैसे हैं? (औपचारिक)
    note: किसी का हाल पूछने का औपचारिक तरीका। *Ihnen* औपचारिक संप्रदान (Dativ) रूप का "आप" है, जो *Sie* वाले शिष्ट रूप से मेल खाता है।
  de.a1.unit01.lesson03.teach.wie_gehts:
    title: Wie geht's?
    gloss: कैसे हो? / क्या हाल है? (अनौपचारिक)
    note: '*Wie geht''s* असल में *Wie geht es* का संक्षिप्त रूप है। किसी का हाल पूछने का यह रोज़मर्रा का अनौपचारिक तरीका है।'
  de.a1.unit01.lesson03.teach.gut_danke:
    title: Gut, danke.
    gloss: अच्छा हूँ, धन्यवाद।
    note: एक सीधा-सादा, तटस्थ जवाब जो दोनों शिष्टता-रूपों में चलता है।
  de.a1.unit01.lesson03.teach.sehr_gut_danke:
    title: Sehr gut, danke.
    gloss: बहुत अच्छा हूँ, धन्यवाद।
    note: '*Gut, danke.* से ज़्यादा उत्साह भरा जवाब।'
  de.a1.unit01.lesson03.teach.und_ihnen:
    title: Und Ihnen?
    gloss: और आप? (औपचारिक)
    note: वही सवाल लौटाने का औपचारिक तरीका, जो *Sie* वाले शिष्ट रूप से मेल खाता है।
  de.a1.unit01.lesson03.teach.und_dir:
    title: Und dir?
    gloss: और तुम? (अनौपचारिक)
    note: वही सवाल लौटाने का अनौपचारिक तरीका। *dir* अनौपचारिक संप्रदान (Dativ) रूप का "तुम" है, जो *du* वाले रूप से मेल खाता है।
  de.a1.unit01.lesson04.teach.danke:
    title: Danke
    gloss: धन्यवाद / शुक्रिया
    note: '*Danke* पहले के जवाबों में आ चुका है। यहाँ यह अकेला शब्द है।'
    example_gloss: बहुत-बहुत धन्यवाद!
  de.a1.unit01.lesson04.teach.bitte:
    title: Bitte
    gloss: कृपया / आपका स्वागत है
    note: '*Bitte* के संदर्भ के अनुसार सचमुच दो आम अर्थ हैं: अनुरोध करते समय "कृपया", और धन्यवाद के जवाब में "आपका स्वागत है"। कौन-सा अर्थ है, यह संदर्भ से पता चलता है। यह कोई संयोग या गलती नहीं है, दोनों प्रयोग पूरी तरह सामान्य हैं।'
    example_gloss:
    - एक कॉफ़ी, कृपया।
    - आपका बहुत स्वागत है!
  de.a1.unit01.lesson04.teach.entschuldigung:
    title: Entschuldigung
    gloss: माफ़ कीजिए / क्षमा करें
    note: '*Entschuldigung* शिष्टता से किसी का ध्यान खींचने और संक्षेप में माफ़ी माँगने, दोनों के लिए इस्तेमाल होता है।'
    example_gloss: माफ़ कीजिए, शौचालय कहाँ है?
  de.a1.unit01.lesson04.teach.kein_problem:
    title: Kein Problem
    gloss: कोई बात नहीं
    note: एक अनौपचारिक, मित्रतापूर्ण जवाब, जिसका लहजा हिंदी के "कोई बात नहीं" जैसा है।
  de.a1.unit01.lesson04.teach.gern_geschehen:
    title: Gern geschehen
    gloss: आपका स्वागत है
    note: छोटे *Bitte* की तुलना में "आपका स्वागत है" कहने का ज़्यादा पूर्ण और स्पष्ट तरीका।
  de.a1.unit01.lesson05.teach.line01:
    title: अन्ना फ़ेलिक्स का अभिवादन करती है
    gloss: 'अन्ना कहती है: नमस्ते!'
    note: अन्ना और फ़ेलिक्स अपनी अपार्टमेंट इमारत में पड़ोसी के रूप में पहली बार मिल रहे हैं।
  de.a1.unit01.lesson05.teach.line02:
    title: फ़ेलिक्स अभिवादन का जवाब देता है और हाल पूछता है
    gloss: 'फ़ेलिक्स कहता है: नमस्ते! आप कैसी हैं?'
    note: फ़ेलिक्स औपचारिक *Sie* रूप इस्तेमाल करता है, क्योंकि वे अभी-अभी मिले हैं।
  de.a1.unit01.lesson05.teach.line03:
    title: अन्ना जवाब देती है और पलटकर पूछती है
    gloss: 'अन्ना कहती है: धन्यवाद, अच्छी हूँ। और आप?'
    note: अन्ना जवाब देती है और फ़ेलिक्स के शिष्टता-रूप के अनुसार औपचारिक ढंग से सवाल लौटाती है।
  de.a1.unit01.lesson05.teach.line04:
    title: फ़ेलिक्स जवाब देता है
    gloss: 'फ़ेलिक्स कहता है: बहुत अच्छा हूँ, धन्यवाद।'
    note: साधारण *Gut, danke.* से थोड़ा ज़्यादा उत्साह भरा जवाब।
  de.a1.unit01.lesson05.teach.line05:
    title: अन्ना अलविदा कहती है
    gloss: 'अन्ना कहती है: अलविदा!'
    note: अन्ना ज़्यादा औपचारिक विदाई इस्तेमाल करती है, जो उनके पूरे बातचीत में रखे *Sie* रूप के अनुरूप है।
  de.a1.unit01.lesson05.teach.line06:
    title: फ़ेलिक्स अलविदा कहता है और जल्दी मिलने की बात करता है
    gloss: 'फ़ेलिक्स कहता है: अलविदा, जल्दी मिलते हैं!'
    note: फ़ेलिक्स औपचारिक विदाई को "जल्दी मिलते हैं" के साथ जोड़ता है और इस पहली मुलाक़ात में दोनों के इस्तेमाल किए *Sie* रूप के अनुरूप रहता है।
