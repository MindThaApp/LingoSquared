teaching:
  de.a1.unit08.lesson01.teach.ein_pfund:
    title: ein Pfund Äpfel
    gloss: एक पाउंड सेब
    note: जर्मनी में बोलचाल में *Pfund* आज भी आम है। जर्मन *Pfund* ठीक 500 ग्राम (आधा किलो) का होता है, जबकि देश में आधिकारिक रूप से मीट्रिक प्रणाली चलती है।
  de.a1.unit08.lesson01.teach.ein_dutzend:
    title: ein Dutzend Eier
    gloss: एक दर्जन अंडे
    note: '*Dutzend* का अर्थ है दर्जन (बारह)।'
  de.a1.unit08.lesson01.teach.eine_flasche:
    title: eine Flasche Wasser
    gloss: एक बोतल पानी
    note: '*Flasche* का अर्थ है बोतल।'
  de.a1.unit08.lesson01.teach.eine_tuete:
    title: eine Tüte Reis
    gloss: एक थैली चावल
    note: '*Tüte* का अर्थ है थैली।'
  de.a1.unit08.lesson01.teach.ein_kilo:
    title: ein Kilo Tomaten
    gloss: एक किलो टमाटर
    note: '*Kilo* मीट्रिक वज़न की मानक इकाई है। रोज़मर्रा की छोटी-मोटी मात्राओं के अलावा बाकी सब जगह *Pfund* से कहीं ज़्यादा इसी का प्रयोग होता है।'
  de.a1.unit08.lesson02.teach.was_kosten_die_aepfel:
    title: Was kosten die Äpfel?
    gloss: सेब कितने के हैं?
    note: '*kosten* का अर्थ है ''कीमत होना'' -- शाब्दिक रूप से ''सेबों की कीमत क्या है?'''
  de.a1.unit08.lesson02.teach.sie_kosten_zwei_euro:
    title: Sie kosten zwei Euro das Pfund.
    gloss: दो यूरो का एक पाउंड है।
    note: 'यहाँ *Sie* का अर्थ ''वे'' है (सेबों के लिए), आदरसूचक ''आप'' नहीं। आदरसूचक *Sie* और बहुवचन *sie* (''वे'') की क्रिया का रूप बिल्कुल एक ही होता है (*kosten*), और वाक्य की शुरुआत में दोनों बड़े अक्षर से लिखे जाते हैं। इसलिए फ़र्क़ सिर्फ़ संदर्भ से पता चलता है: यहाँ बात सेबों की हो रही है, किसी व्यक्ति की नहीं।'
  de.a1.unit08.lesson02.teach.kann_ich_zwei_pfund:
    title: Kann ich zwei Pfund haben, bitte?
    gloss: क्या मुझे दो पाउंड मिल सकते हैं, कृपया?
    note: विनम्रता से माँगने का एक ढंग, जो इकाई 7 के *Ich möchte..., bitte* जैसा है।
  de.a1.unit08.lesson02.teach.ist_es_frisch:
    title: Ist es frisch?
    gloss: क्या यह ताज़ा है?
    note: '*frisch* का अर्थ है ताज़ा। यहाँ *es* नपुंसकलिंग संज्ञा (जैसे das Brot) के लिए है। पुल्लिंग चीज़ के बारे में *Ist er frisch?* (der Reis) और स्त्रीलिंग के बारे में *Ist sie frisch?* (die Milch) कहा जाता है -- सर्वनाम संज्ञा के लिंग के अनुसार बदलता है, हमेशा *es* नहीं रहता।'
  de.a1.unit08.lesson03.teach.pro_pfund:
    title: pro Pfund
    gloss: प्रति पाउंड
    note: '*pro* का अर्थ है ''प्रति'' -- दाम के लेबलों पर भी और बोलचाल में दाम बताते समय भी इसका प्रयोग होता है।'
    example_gloss: सेब दो यूरो प्रति पाउंड के हैं।
  de.a1.unit08.lesson03.teach.preisschild_text:
    title: Markt-Preisschild
    gloss: बाज़ार की दाम-तालिका
    note: एक सरल दाम-तालिका, जिसमें तीन चीज़ों के इकाई-दाम लिखे हैं।
  de.a1.unit08.lesson04.teach.das_macht_acht_euro:
    title: Das macht acht Euro.
    gloss: यह आठ यूरो हुए।
    note: '*Das macht...* कुल दाम बताने का सामान्य तरीका है, जो इकाई 7 में आ चुका है।'
  de.a1.unit08.lesson04.teach.line01:
    title: फ़ेलिक्स दाम पूछता है
    gloss: 'फ़ेलिक्स कहता है: सेब कितने के हैं?'
    note: यह वही प्रश्न है जो पाठ 2 में था, अब एक असली बातचीत में।
  de.a1.unit08.lesson04.teach.line02:
    title: আনা दाम बताती है
    gloss: 'आना कहती है: दो यूरो का एक पाउंड है।'
    note: पूरे उत्तर में प्रति इकाई दाम बताया जाता है।
  de.a1.unit08.lesson04.teach.line03:
    title: फ़ेलिक्स ऑर्डर देता है
    gloss: 'फ़ेलिक्स कहता है: ठीक है, क्या मुझे दो पाउंड मिल सकते हैं, कृपया?'
    note: यहाँ *Gut* का अर्थ 'ठीक है/अच्छा' है; ऑर्डर देने से पहले दाम को स्वीकार किया जा रहा है।
  de.a1.unit08.lesson04.teach.line04:
    title: आना पूछती है कि और कुछ चाहिए या नहीं
    gloss: 'आना कहती है: बिल्कुल। और कुछ?'
    note: '*Natürlich* का अर्थ है ''बिल्कुल/ज़रूर''।'
  de.a1.unit08.lesson04.teach.line05:
    title: फ़ेलिक्स और ऑर्डर देता है
    gloss: 'फ़ेलिक्स कहता है: हाँ, एक दर्जन अंडे भी।'
    note: '*auch* का अर्थ है ''भी''।'
  de.a1.unit08.lesson04.teach.line06:
    title: आना कुल दाम बताती है
    gloss: 'आना कहती है: यह आठ यूरो हुए।'
    note: दो पाउंड सेब (4€) और एक दर्जन अंडे (4€) मिलाकर कुल आठ यूरो होते हैं।
