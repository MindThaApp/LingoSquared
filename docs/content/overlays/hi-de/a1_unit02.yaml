teaching:
  de.a1.unit02.lesson01.teach.wie_heissen_sie:
    title: Wie heißen Sie?
    gloss: आपका नाम क्या है? (औपचारिक)
    note: '*Wie heißen Sie?* शाब्दिक रूप से पूछता है "आप किस नाम से पुकारे जाते हैं", और इसमें इकाई 1 का औपचारिक *Sie* है।'
  de.a1.unit02.lesson01.teach.ich_heisse_anna:
    title: Ich heiße Anna.
    gloss: मेरा नाम अन्ना है।
    note: '*heißen* का अर्थ है "नाम होना / कहलाना"; अपना नाम बताने का यही मानक तरीका है।'
  de.a1.unit02.lesson01.teach.wie_heisst_du:
    title: Wie heißt du?
    gloss: तुम्हारा नाम क्या है? (अनौपचारिक)
    note: अनौपचारिक रूप, जिसमें इकाई 1 का *du* है।
  de.a1.unit02.lesson01.teach.ich_heisse_felix:
    title: Ich heiße Felix.
    gloss: मेरा नाम फ़ेलिक्स है।
    note: यह *Ich heiße Anna* जैसी ही संरचना है, बस नाम अलग है।
  de.a1.unit02.lesson01.teach.freut_mich:
    title: Freut mich.
    gloss: आपसे मिलकर खुशी हुई।
    note: किसी से मिलने की खुशी जताने का छोटा, आम तरीका, जो औपचारिक और अनौपचारिक दोनों में चलता है।
  de.a1.unit02.lesson01.teach.ganz_meinerseits:
    title: Ganz meinerseits.
    gloss: मुझे भी। / खुशी मेरी तरफ़ से भी है।
    note: '*Freut mich* का स्वाभाविक जवाब; शाब्दिक अर्थ है "पूरी तरह मेरी ओर से"।'
  de.a1.unit02.lesson02.teach.ich:
    title: ich
    gloss: मैं
    note: देवनागरी में बड़े-छोटे अक्षर नहीं होते, पर जर्मन में *ich* वाक्य की शुरुआत को छोड़कर छोटे अक्षरों में लिखा जाता है (जैसे *Ich bin Anna.* में शुरुआत में बड़ा)।
  de.a1.unit02.lesson02.teach.du:
    title: du
    gloss: तुम (अनौपचारिक)
    note: इकाई 1 में आ चुका है; यहाँ पूरे वाक्य के कर्ता के रूप में दोहराया गया है।
  de.a1.unit02.lesson02.teach.ich_bin_anna:
    title: Ich bin Anna.
    gloss: मैं अन्ना हूँ।
    note: '*bin*, *sein* (होना) का *ich* वाला रूप है।'
  de.a1.unit02.lesson02.teach.du_bist_felix:
    title: Du bist Felix.
    gloss: तुम फ़ेलिक्स हो।
    note: '*bist*, *sein* का *du* वाला रूप है।'
  de.a1.unit02.lesson03.teach.deutschland:
    title: Deutschland
    gloss: जर्मनी
    note: जर्मन में देशों के नाम आम तौर पर बिना आर्टिकल के आते हैं, बस *Deutschland*, *das Deutschland* नहीं।
    example_gloss: मैं जर्मनी से आता हूँ।
  de.a1.unit02.lesson03.teach.england:
    title: England
    gloss: इंग्लैंड
    note: नाम England ही रहता है; बस इसका उच्चारण जर्मन ध्वनियों के अनुसार होता है।
    example_gloss: मैं इंग्लैंड से आता हूँ।
  de.a1.unit02.lesson03.teach.frankreich:
    title: Frankreich
    gloss: फ़्रांस
    note: ध्यान दें कि जर्मन नाम Frankreich फ़्रेंच नाम *France* से अलग है।
    example_gloss: मैं फ़्रांस से आता हूँ।
  de.a1.unit02.lesson03.teach.italien:
    title: Italien
    gloss: इटली
    note: लगभग "ईताली-एन" की तरह बोला जाता है।
    example_gloss: मैं इटली से आता हूँ।
  de.a1.unit02.lesson03.teach.spanien:
    title: Spanien
    gloss: स्पेन
    note: लगभग "श्पानि-एन" की तरह बोला जाता है।
    example_gloss: मैं स्पेन से आता हूँ।
  de.a1.unit02.lesson03.teach.russland:
    title: Russland
    gloss: रूस
    note: '*Deutschland* की तरह यह भी *Russ-* + *-land* से बना है।'
    example_gloss: मैं रूस से आता हूँ।
  de.a1.unit02.lesson04.teach.woher_kommen_sie:
    title: Woher kommen Sie?
    gloss: आप कहाँ से हैं? (औपचारिक)
    note: '*Woher* का अर्थ "कहाँ से" है; यह एक ही शब्द है और इसमें "से" का भाव पहले से शामिल है।'
  de.a1.unit02.lesson04.teach.ich_komme_aus_deutschland:
    title: Ich komme aus Deutschland.
    gloss: मैं जर्मनी से हूँ।
    note: '*aus* + देश का नाम मूल स्थान बताता है; इस स्तर पर राष्ट्रीयता वाले लिंग-भेद के शब्दों की ज़रूरत नहीं।'
  de.a1.unit02.lesson04.teach.woher_kommst_du:
    title: Woher kommst du?
    gloss: तुम कहाँ से हो? (अनौपचारिक)
    note: अनौपचारिक रूप, जिसमें *du* है।
  de.a1.unit02.lesson04.teach.ich_komme_aus_england:
    title: Ich komme aus England.
    gloss: मैं इंग्लैंड से हूँ।
    note: यह *Ich komme aus Deutschland* जैसी ही संरचना है, बस देश अलग है।
  de.a1.unit02.lesson04.teach.und_sie:
    title: Und Sie?
    gloss: और आप? (औपचारिक)
    note: सवाल लौटाने का छोटा तरीका, जो *Sie* वाले लहजे से मेल खाता है।
  de.a1.unit02.lesson05.teach.line01:
    title: फ़ेलिक्स अन्ना का अभिवादन करता है
    gloss: 'फ़ेलिक्स कहता है: नमस्कार!'
    note: फ़ेलिक्स और अन्ना पड़ोसी हैं जो पहले एक बार (इकाई 1) मिल चुके हैं, पर उन्होंने नाम नहीं बताए थे। वे फिर से एक-दूसरे से टकरा गए हैं, इस बार बस स्टॉप पर।
  de.a1.unit02.lesson05.teach.line02:
    title: अन्ना अभिवादन का जवाब देती है और उनका नाम पूछती है
    gloss: 'अन्ना कहती है: नमस्कार! आपका नाम क्या है?'
    note: अन्ना औपचारिक *Sie* का प्रयोग करती है, यानी वही शिष्ट रूप जो अजनबी के रूप में उन्होंने इकाई 1 में अपनाया था।
  de.a1.unit02.lesson05.teach.line03:
    title: फ़ेलिक्स अपना नाम बताता है और औपचारिक रूप से वही सवाल लौटाता है
    gloss: 'फ़ेलिक्स कहता है: मेरा नाम फ़ेलिक्स है। और आपका?'
    note: फ़ेलिक्स जवाब देता है और औपचारिक ढंग से वही सवाल लौटा देता है।
  de.a1.unit02.lesson05.teach.line04:
    title: अन्ना अपना नाम बताती है
    gloss: 'अन्ना कहती है: मेरा नाम अन्ना है। आपसे मिलकर खुशी हुई।'
    note: अन्ना उसी ढंग से जवाब देती है और शिष्टाचार का एक वाक्य जोड़ती है।
  de.a1.unit02.lesson05.teach.line05:
    title: फ़ेलिक्स जवाब देता है और पूछता है कि वह कहाँ से है
    gloss: 'फ़ेलिक्स कहता है: मुझे भी। आप कहाँ से हैं?'
    note: फ़ेलिक्स शिष्टाचार का जवाब देता है और बातचीत को मूल स्थान की ओर ले जाता है।
  de.a1.unit02.lesson05.teach.line06:
    title: अन्ना जवाब देती है और पलटकर पूछती है
    gloss: 'अन्ना कहती है: मैं जर्मनी से हूँ। और आप?'
    note: इससे पुष्टि होती है कि अन्ना जर्मन है, जो जर्मन भाषी शहर में दोनों के पड़ोसी होने से मेल खाता है।
  de.a1.unit02.lesson05.teach.line07:
    title: फ़ेलिक्स जवाब देता है
    gloss: 'फ़ेलिक्स कहता है: मैं इंग्लैंड से हूँ।'
    note: अब पता चलता है कि फ़ेलिक्स इंग्लैंड से है, यानी जर्मनी में रहने वाला एक अंग्रेज़ पड़ोसी।
  de.a1.unit02.lesson05.teach.line08:
    title: अन्ना विदा लेती है
    gloss: 'अन्ना कहती है: अलविदा!'
    note: इकाई 1 की औपचारिक विदाई, जो उनके लगातार *Sie* वाले शिष्ट रूप से मेल खाती है।
  de.a1.unit02.lesson05.teach.line09:
    title: फ़ेलिक्स विदा लेता है
    gloss: 'फ़ेलिक्स कहता है: अलविदा!'
    note: फ़ेलिक्स भी उसी तरह समाप्त करता है और पूरी मुलाक़ात में एक ही शिष्ट रूप बनाए रखता है।
  de.a1.unit02.lesson05.teach.steckbrief:
    title: एक छोटा लिखित परिचय
    gloss: 'नाम: फ़ेलिक्स। देश: इंग्लैंड।'
    note: एक सरल लिखित परिचय-कार्ड, जिसमें नाम और पहचान की एक बात दी गई है। यही जानकारी फ़ेलिक्स ने संवाद में पहले बोलकर बताई थी।
