teaching:
  de.a1.unit10.lesson01.teach.links_abbiegen:
    title: Biegen Sie links ab.
    gloss: बाएँ मुड़ो।
    note: '*abbiegen* (मुड़ना) एक वियोज्य क्रिया है — उपसर्ग *ab* वाक्य के बिल्कुल अंत में चला जाता है: *Biegen Sie... ab*, न कि *Sie biegen ab* या *Abbiegen Sie*.'
  de.a1.unit10.lesson01.teach.rechts_abbiegen:
    title: Biegen Sie rechts ab.
    gloss: दाएँ मुड़ो।
    note: यह *links abbiegen* जैसा ही वियोज्य क्रिया का ढाँचा है, बस यहाँ *rechts* (दाएँ) है।
  de.a1.unit10.lesson01.teach.geradeaus_gehen:
    title: Gehen Sie geradeaus.
    gloss: सीधे चलो।
    note: '*geradeaus* का अर्थ है ''सीधे आगे'' — यहाँ कोई वियोज्य उपसर्ग नहीं है, यह एक सरल औपचारिक आज्ञार्थक वाक्य है।'
  de.a1.unit10.lesson01.teach.hier_anhalten:
