    gloss: 'फ़ेलिक्स: जी। हम नौ बजे कैफ़े के सामने मिल रहे हैं।'
    note: फ़ेलिक्स समय और जगह दोहराता है।
    example_gloss: हम नौ बजे मिल रहे हैं।
  de.a1.unit23.lesson02.teach.line05:
    title: अन्ना संदेश भेजने का वादा करती है
