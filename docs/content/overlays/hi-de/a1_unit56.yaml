  de.a1.unit56.lesson06.teach.anna_nina_hast:
    title: Anna, Nina से पूछती है
    gloss: 'Anna: Nina, क्या तुम्हारे पास भी कोई पालतू जानवर है?'
  de.a1.unit56.lesson06.teach.nina_ja_ich:
    title: Nina के पास Pico नाम का पक्षी है
    gloss: 'Nina: हाँ, मेरे पास एक पक्षी है। उसका नाम Pico है।'
    note: '*Er heißt Pico* में वही क्रिया *heißen* है जो बिलकुल पहली इकाई में आई थी। Er, der Vogel के लिए है।'
  de.a1.unit56.lesson06.teach.felix_wie_schoen:
    title: Felix प्रतिक्रिया देता है
    gloss: 'Felix: कितना प्यारा! तुम हर दिन उसके साथ क्या करती हो?'
  de.a1.unit56.lesson06.teach.nina_ich_gebe:
    title: Nina रोज़ उसे खाना खिलाती है
