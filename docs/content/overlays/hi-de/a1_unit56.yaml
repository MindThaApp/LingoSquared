      beide: दोनों
      Tiere: जानवर
      beiden: दोनों
      Haustier: पालतू जानवर
      Hunde: कुत्ते
      Katzen: बिल्लियाँ
      Katze: बिल्ली
      spielt: खेलता है
      gibt: देता है
      jeden: हर
      Futter: खाना
  de.a1.unit56.lesson05.teach.jonas_spielt_oft:
    title: Jonas अक्सर अपनी बिल्ली के साथ खेलता है
