    note: '*Lieben* (प्यार करना) अपनी वस्तु को सीधे लेता है, बीच में कोई पूर्वसर्ग नहीं आता: ich liebe Tiere.'
  de.a1.unit56.lesson03.teach.lena_liebt_katzen:
    title: Lena को बिल्लियाँ प्यारी हैं, पर उसके पास पालतू जानवर नहीं है
    gloss: Lena को बिल्लियों से प्यार है, लेकिन उसके पास कोई पालतू जानवर नहीं है।
    note: यह उस विरोधाभास की भूमिका बनाता है जिस पर इस यूनिट का पठन-अंश आधारित है।
  de.a1.unit56.lesson04.teach.felix_hast_du:
    title: Felix पालतू जानवर के बारे में पूछता है
    gloss: 'Felix: क्या तुम्हारे पास कोई पालतू जानवर है, Anna?'
  de.a1.unit56.lesson04.teach.anna_ja_ich:
    title: Anna के पास एक कुत्ता है
    gloss: 'Anna: हाँ, मेरे पास एक कुत्ता है।'
  de.a1.unit56.lesson04.teach.felix_wie_sieht:
    title: Felix पूछता है कि वह कैसा दिखता है
    gloss: 'Felix: वह कैसा दिखता है?'
    note: 'रूप-रंग वाली इकाई का प्रश्न *Wie sieht ... aus?* अब एक जानवर के बारे में पूछा गया है: wie sieht er aus?'
  de.a1.unit56.lesson04.teach.anna_er_hat:
    title: Anna अपने कुत्ते का वर्णन करती है
    gloss: 'Anna: उसके रोएँ भूरे हैं और वह छोटा है।'
    note: बालों के रंग और आकार की शब्दावली रूप-रंग वाली यूनिट से दोहराई गई है, अब किसी व्यक्ति के बालों की जगह जानवर के रोएँ के लिए।
  de.a1.unit56.lesson04.teach.bei_tieren_zaehlt:
    title: जानवरों के लिए er/ihn
    gloss: 'जानवरों के लिए शब्द का लिंग तय करता है: der Hund के लिए er (वह), die Katze के लिए sie (वह)।'
    note: 'जर्मन सर्वनाम संज्ञा के व्याकरणिक लिंग के अनुसार चलते हैं: der Hund → er (accusative: ihn), die Katze → sie, das Tier → es.'
  de.a1.unit56.lesson04.teach.felix_fuehrst_du:
    title: Felix घुमाने के बारे में पूछता है
    gloss: 'Felix: क्या तुम उसे हर दिन घुमाने ले जाती हो?'
  de.a1.unit56.lesson04.teach.anna_ja_ich_2:
    title: Anna अपनी दिनचर्या बताती है
    gloss: 'Anna: हाँ, मैं उसे हर दिन घुमाने ले जाती हूँ और उसे खाना देती हूँ।'
  de.a1.unit56.lesson05.teach.felix_und_lena:
    title: जानवरों के बारे में Felix, Lena और Jonas
    gloss: 'Felix और Lena दोनों को जानवरों से प्यार है, लेकिन दोनों में से किसी के पास पालतू जानवर नहीं है। Felix को कुत्ते प्यारे हैं और Lena को बिल्लियाँ। Jonas के पास पालतू जानवर है: एक बिल्ली। वह अक्सर अपनी बिल्ली के साथ खेलता है और हर दिन उसे खाना देता है। क्या आपके पास कोई पालतू जानवर है?'
    note: किसी जानवर को पसंद करने और सच में उसे पालने का फ़र्क़ दिखाता है -- यही इस यूनिट के संवाद-लक्ष्य की मूल बात है।
    glosses:
