    note: '*Kein* संज्ञा *ein Haustier* को नकारता है: व्याकरण-नोट देखिए।'
  de.a1.unit56.lesson01.teach.kein_sagt_nein:
    title: 'Kein: संज्ञा का निषेध'
    gloss: 'Kein उस संज्ञा को नकारता है जिसके साथ ein- आता: Ich habe einen Hund, लेकिन Ich habe kein Haustier.'
    note: 'नकारात्मक वाक्य में *kein*, *ein* की जगह आता है और वही अंत लेता है: ein Haustier → kein Haustier, einen Hund → keinen Hund। क्रियाओं और विशेषणों के निषेध के लिए *nicht* का प्रयोग होता है।'
  de.a1.unit56.lesson02.teach.ausfuehren:
