    gloss: 'Ausführen, aufstehen की तरह वियोज्य है: ich führe den Hund aus.'
    note: यह वही वियोज्य क्रिया-ढाँचा है (धातु ... + अंत में उपसर्ग), जो दिनचर्या की क्रियाओं में पहले सिखाया जा चुका है।
  de.a1.unit56.lesson02.teach.futter_geben:
