  de.a1.unit56.lesson06.teach.felix_ich_liebe:
    title: Felix को भी पक्षियों से प्यार है
    gloss: 'Felix: मुझे भी पक्षियों से प्यार है।'
  de.a1.unit56.lesson06.teach.anna_schoen_dass:
    title: Anna बातचीत समाप्त करती है
    gloss: 'Anna: कितना अच्छा है कि हम तीनों को जानवरों से प्यार है!'
    note: इस यूनिट में तीनों पात्रों के जानवरों से जुड़े तथ्यों को एक साथ समेटता है।
