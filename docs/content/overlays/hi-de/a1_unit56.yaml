  de.a1.unit56.lesson02.teach.ich_fuehre_den:
    title: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ
    gloss: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ।
    note: यहाँ *ausführen* को *jeden Tag* (हर दिन) के साथ जोड़ा गया है। *Jeden* के अंत में -en है क्योंकि Tag पुल्लिंग है और accusative में है।
  de.a1.unit56.lesson02.teach.ich_gebe_der:
    title: मैं रोज़ बिल्ली को खाना खिलाता हूँ
    gloss: मैं रोज़ बिल्ली को खाना खिलाता हूँ।
    note: 'यहाँ *Futter geben* को *jeden Tag* के साथ जोड़ा गया है। जानवर dative में है: der Katze (बिल्ली को)।'
  de.a1.unit56.lesson03.teach.den_plural_lernst:
    title: 'Plural: Hund -> Hunde'
    gloss: 'जर्मन में बहुवचन अलग-अलग तरह से बनते हैं: der Hund → die Hunde, die Katze → die Katzen, der Vogel → die Vögel। बहुवचन हर संज्ञा के साथ सीखिए।'
    note: जर्मन का नियमित बहुवचन-ढाँचा, जो यहाँ पहली बार जानवरों के नामों के उदाहरण से सिखाया गया है।
  de.a1.unit56.lesson03.teach.hunde_katzen:
