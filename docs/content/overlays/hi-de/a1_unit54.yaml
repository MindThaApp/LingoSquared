teaching:
  de.a1.unit54.lesson01.teach.lesen_sport_treiben:
    title: पढ़ना, कसरत करना, खाना बनाना
    gloss: पढ़ना, कसरत/खेलकूद करना, खाना पकाना
    note: 'तीन आम शौक़ वाली क्रियाएँ: *lesen* (पढ़ना), *Sport treiben* (कसरत या खेलकूद करना) और *kochen* (खाना बनाना)। Sport संज्ञा है, इसलिए बड़े अक्षर से लिखा जाता है।'
    example_gloss:
    - मुझे किताब पढ़ना पसंद है।
    - मैं शनिवार को कसरत करता हूँ।
    - मुझे दोस्तों के लिए खाना बनाना पसंद है।
  de.a1.unit54.lesson01.teach.die_freizeit:
    title: ख़ाली समय
    gloss: ख़ाली समय
    note: '*Die Freizeit* स्त्रीलिंग संज्ञा है: इसे हमेशा उपपद die के साथ सीखिए। शौक़ों की बात करने के लिए यह मुख्य शब्द है।'
    example_gloss: ख़ाली समय में मुझे पढ़ना पसंद है।
  de.a1.unit54.lesson01.teach.in_meiner_freizeit:
    title: ख़ाली समय में क्या करते हैं, यह बताना
    gloss: ख़ाली समय में मुझे पढ़ना पसंद है।
    note: '*Lese* क्रिया *lesen* (पढ़ना) का ich वाला रूप है। वाक्य समय बताने वाले पदबंध से शुरू होता है, फिर भी क्रिया दूसरे स्थान पर रहती है: in meiner Freizeit lese ich gern.'
  de.a1.unit54.lesson02.teach.musik_hoeren_zeichnen:
    title: संगीत, चित्रकारी, वीडियो गेम
    gloss: संगीत सुनना, चित्र बनाना, वीडियो गेम खेलना
    note: 'तीन और शौक़ वाले पद: *Musik hören* (संगीत सुनना), *zeichnen* (चित्र बनाना) और *Videospiele spielen* (वीडियो गेम खेलना)। Musik और Videospiele संज्ञाएँ हैं, इसलिए बड़े अक्षर से लिखे जाते हैं।'
    example_gloss:
    - मुझे संगीत सुनना पसंद है।
    - मैं अक्सर चित्र बनाता/बनाती हूँ।
    - मुझे दोस्तों के साथ वीडियो गेम खेलना पसंद है।
  de.a1.unit54.lesson02.teach.ich_hoere_gern:
    title: कहना कि आपको संगीत सुनना पसंद है
    gloss: मुझे संगीत सुनना पसंद है।
    note: जर्मन में *Musik hören* बिना किसी पूर्वसर्ग के कहा जाता है, हिंदी के "संगीत सुनना" की तरह।
  de.a1.unit54.lesson02.teach.ich_spiele_gern:
    title: कहना कि आपको दोस्तों के साथ वीडियो गेम खेलना पसंद है
    gloss: मुझे दोस्तों के साथ वीडियो गेम खेलना पसंद है।
    note: '*Mit Freunden* (दोस्तों के साथ): mit के बाद हमेशा Dativ आता है, इसलिए Freunde बदलकर Freunden हो जाता है।'
  de.a1.unit54.lesson03.teach.immer_oft_manchmal:
    title: हमेशा, अक्सर, कभी-कभी, कभी नहीं
    gloss: हमेशा, अक्सर, कभी-कभी, कभी नहीं
    note: 'आवृत्ति बताने वाले चार मुख्य क्रियाविशेषण: immer, oft, manchmal, nie. ये आम तौर पर क्रिया के ठीक बाद आते हैं: ich spiele nie.'
    example_gloss:
    - मैं हर शनिवार हमेशा कसरत करता/करती हूँ।
    - मैं अक्सर कोई किताब पढ़ता/पढ़ती हूँ।
    - मैं कभी-कभी चित्र बनाता/बनाती हूँ।
    - मैं कभी वीडियो गेम नहीं खेलता/खेलती।
  de.a1.unit54.lesson03.teach.jede_woche_jedes:
    title: हर हफ़्ते, हर सप्ताहांत
    gloss: हर हफ़्ते, हर सप्ताहांत
    note: '*Jede Woche* और *jedes Wochenende* दोनों का अर्थ "हर" है, पर संज्ञा के लिंग के अनुसार अंत बदल जाता है: अगला कार्ड देखिए।'
    example_gloss:
    - मैं हर हफ़्ते दोस्तों के लिए खाना बनाता/बनाती हूँ।
    - मैं हर सप्ताहांत कसरत करता/करती हूँ।
  de.a1.unit54.lesson03.teach.die_woche_jede:
    title: Jede और jedes
    gloss: Die Woche स्त्रीलिंग है, इसलिए jede Woche। Das Wochenende नपुंसकलिंग है, इसलिए jedes Wochenende।
    note: '*Woche* स्त्रीलिंग है (*die Woche*), इसलिए उसके साथ *jede* आता है; *Wochenende* नपुंसकलिंग है (*das Wochenende*), इसलिए उसके साथ *jedes* आता है। हर संज्ञा को उसके उपपद के साथ सीखिए, तो अंत अपने-आप पता चल जाएगा।'
  de.a1.unit54.lesson03.teach.was_machst_du:
    title: खाली समय के बारे में पूछना
    gloss: आप अपने खाली समय में क्या करते हैं?
    note: यह इस इकाई का मुख्य प्रश्न है -- किसी से भी उसके शौक़ पूछने के लिए इसका इस्तेमाल कीजिए।
  de.a1.unit54.lesson04.teach.anna_wir_gehen:
    title: Anna शौक़ों की बात छेड़ती है
    gloss: 'Anna: हम अक्सर साथ टहलने जाते हैं। पर Felix, तुम अपने खाली समय में और क्या करते हो?'
    note: '*Wir gehen oft zusammen spazieren* में gehen के साथ दूसरी क्रिया है: रूपांतरित क्रिया gehen दूसरे स्थान पर है और मूल रूप spazieren अंत में जाता है।'
  de.a1.unit54.lesson04.teach.felix_ich_koche:
    title: Felix के शौक़
    gloss: 'Felix: मुझे खाना बनाना पसंद है, घर पर भी। और मैं अक्सर कसरत करता हूँ।'
    note: '*Auch zu Hause* (घर पर भी) से साफ़ होता है कि Felix शौक़ से खाना बनाता है, सिर्फ़ अपनी नौकरी की वजह से नहीं।'
  de.a1.unit54.lesson04.teach.anna_kochst_du:
    title: Anna हैरान है
    gloss: 'Anna: तुम घर पर भी खाना बनाते हो? तुम तो काम पर पहले ही दिन भर खाना बनाते हो!'
    note: '*Den ganzen Tag* (पूरा दिन) Akkusativ में है, इसीलिए der Tag बदलकर den Tag हो जाता है। इस तरह की समयावधि Akkusativ लेती है।'
  de.a1.unit54.lesson04.teach.felix_ja_aber:
    title: Felix समझाता है
    gloss: 'Felix: हाँ, पर मुझे खाना बनाना आरामदायक लगता है। और तुम्हें क्या करना पसंद है?'
    note: '*Kochen finde ich entspannend* में ज़ोर देने के लिए Kochen को शुरू में रखा गया है। क्रिया फिर भी दूसरे स्थान पर रहती है, इसलिए ich उसके पीछे चला जाता है।'
  de.a1.unit54.lesson04.teach.anna_ich_lese:
    title: Anna के शौक़
    gloss: 'Anna: मुझे पढ़ना पसंद है और मैं अक्सर संगीत सुनती हूँ।'
    note: पाठ 01-02 की दो शौक़ वाली क्रियाएँ एक वाक्य में *und* (और) से जुड़ी हैं।
  de.a1.unit54.lesson04.teach.felix_spielst_du:
    title: Felix गेमिंग के बारे में पूछता है
    gloss: 'Felix: क्या तुम वीडियो गेम भी खेलती हो?'
    note: 'हाँ/नहीं वाला छोटा प्रश्न: क्रिया पहले आती है, spielst du ...?'
  de.a1.unit54.lesson04.teach.anna_nein_ich:
    title: Anna जवाब देती है
    gloss: 'Anna: नहीं, मैं कभी वीडियो गेम नहीं खेलती। पर कभी-कभी चित्र बनाती हूँ!'
    note: पाठ 03 के *nie* (कभी नहीं) और *manchmal* (कभी-कभी) एक ही जवाब में आमने-सामने हैं। दोनों क्रिया के ठीक बाद आते हैं।
  de.a1.unit54.lesson05.teach.felix_und_ich:
    title: शौक़ों की तुलना
    gloss: Felix और मैं अक्सर साथ टहलने जाते हैं। पर हमारे और भी शौक़ हैं। Felix को खाना बनाना पसंद है, घर पर भी, और वह अक्सर कसरत करता है। मुझे पढ़ना पसंद है और मैं अक्सर संगीत सुनती हूँ। मैं कभी-कभी चित्र बनाती हूँ, पर कभी वीडियो गेम नहीं खेलती। आपको अपने खाली समय में क्या करना पसंद है?
    note: Anna का संदेश पाठ 04 की बातें दोहराता है और पाठक से इस इकाई का मुख्य प्रश्न पूछकर ख़त्म होता है।
    glosses:
      spazieren: टहलना
      oft: अक्सर
      zusammen: साथ में
      andere: दूसरे
      kocht: खाना बनाता है
      gern: पसंद है
      Hause: घर पर
      Sport: कसरत करता है
      lese: पढ़ना
      höre: सुनना
      Musik: संगीत
      zeichne: चित्र बनाती हूँ
      manchmal: कभी-कभी
      spiele: वीडियो गेम खेलना
      nie: कभी नहीं
      freien: खाली
      Zeit: समय
  de.a1.unit54.lesson06.teach.felix_was_machst:
    title: Felix सप्ताहांत के बारे में पूछता है
    gloss: 'Felix: इस सप्ताहांत तुम क्या कर रही हो?'
    note: '*Dieses Wochenende* (इस सप्ताहांत) में नपुंसकलिंग का अंत -es है, क्योंकि das Wochenende नपुंसकलिंग है।'
  de.a1.unit54.lesson06.teach.anna_ich_weiss:
    title: Anna असमंजस में है
    gloss: 'Anna: मुझे अभी पता नहीं। मुझे पढ़ना पसंद है, पर मैं बाहर भी जाना चाहती हूँ।'
    note: '*Nach draußen* (बाहर, शब्दशः "बाहर की ओर") यह कहने का आम तरीक़ा है कि आप घर से निकलना चाहते हैं।'
  de.a1.unit54.lesson06.teach.felix_gehen_wir:
    title: Felix योजना सुझाता है
    gloss: 'Felix: साथ टहलने चलें? उसके बाद मैं हम सबके लिए खाना बनाऊँगा।'
    note: '*Danach* (उसके बाद) पहले आता है, इसलिए क्रिया उसके बाद और कर्ता उसके पीछे आता है: danach koche ich.'
  de.a1.unit54.lesson06.teach.anna_gute_idee:
    title: Anna सहमत होती है
    gloss: 'Anna: अच्छा विचार है! मुझे टहलना भी पसंद है और खाना बनाना भी।'
    note: 'क्रिया के बाद *gern* दिखाता है कि आपको कुछ करना पसंद है: ich gehe gern spazieren, ich koche gern। यह लगभग हर क्रिया के साथ चलता है।'
  de.a1.unit54.lesson06.teach.felix_perfekt_dann:
    title: Felix पक्का करता है
    gloss: 'Felix: बढ़िया। तो शनिवार को मिलते हैं!'
    note: '*Samstag* (शनिवार) की योजना पक्की करने वाली दोस्ताना अंतिम पंक्ति। सप्ताह के दिनों के साथ *am* आता है: am Samstag.'
