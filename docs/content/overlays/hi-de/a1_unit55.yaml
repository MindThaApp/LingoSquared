teaching:
  de.a1.unit55.lesson01.teach.gross_klein:
    title: लंबा और नाटा
    gloss: लंबा / नाटा
    note: '*Groß* लंबे कद के व्यक्ति के लिए और *klein* छोटे कद के व्यक्ति के लिए आता है। लोगों के लिए जर्मन में groß (बड़ा) कहा जाता है, lang (लंबा) नहीं।'
    example_gloss:
    - लेना लंबी है।
    - योनास छोटे कद का है।
  de.a1.unit55.lesson01.teach.alt_jung:
    title: बुज़ुर्ग और जवान
    gloss: बुज़ुर्ग / जवान
    note: यहाँ *alt* और *jung* उम्र का एक सामान्य अंदाज़ा बताते हैं, सालों की सही संख्या नहीं।
    example_gloss:
    - दादाजी बुज़ुर्ग हैं।
    - फ़ेलिक्स जवान है।
  de.a1.unit55.lesson01.teach.alt_kann_eine:
    title: 'Alt: संख्या या अंदाज़ा'
    gloss: Alt के साथ सालों की संख्या आ सकती है, जैसे Ich bin dreißig Jahre alt, या यह सामान्य अंदाज़ा बता सकता है, जैसे Opa ist alt.
    note: किसी की सही उम्र आप *Wie alt bist du?* से पूछ सकते हैं। यहाँ *alt* बताता है कि कोई व्यक्ति कितना बड़ा दिखता है, बिना किसी संख्या के।
  de.a1.unit55.lesson01.teach.lena_ist_gross:
    title: लेना लंबी है और योनास छोटे कद का है
    gloss: लेना लंबी है और योनास छोटे कद का है।
    note: '*und* (और) से जुड़ा एक सरल वाक्य, जो पाठ 05 की सीधी तुलना की तैयारी कराता है।'
  de.a1.unit55.lesson02.teach.die_haare:
    title: बाल
    gloss: बाल
    note: '*Haare* बहुवचन संज्ञा है: *die Haare*. जर्मन में एकवचन das Haar भी होता है, पर सिर के बालों के लिए आम तौर पर Haare ही कहा जाता है।'
    example_gloss: फ़ेलिक्स के छोटे काले बाल हैं।
  de.a1.unit55.lesson02.teach.blond_braun_grau:
    title: सुनहरा, भूरा और स्लेटी
    gloss: सुनहरा / भूरा / स्लेटी
    note: 'बालों के तीन रंग: blond, braun, grau. बिना आर्टिकल की बहुवचन संज्ञा से पहले इनमें -e लगता है: blonde, braune, graue Haare.'
    example_gloss:
    - अन्ना के बाल सुनहरे हैं।
    - योनास के बाल भूरे हैं।
    - दादाजी के बाल स्लेटी हैं।
  de.a1.unit55.lesson02.teach.lang_kurz:
    title: लंबे और छोटे (बाल)
    gloss: लंबे / छोटे (बाल)
    note: '*Kurz* (छोटा) और *lang* (लंबा) बालों की लंबाई बताते हैं। यहाँ भी अंत में -e लगता है: kurze Haare, lange Haare.'
    example_gloss:
    - लेना के लंबे बाल हैं।
    - योनास के छोटे बाल हैं।
  de.a1.unit55.lesson02.teach.haare_ist_plural:
    title: Haare के साथ अंत में -e लगता है
    gloss: 'Haare बहुवचन है और उसके साथ आर्टिकल नहीं आता, इसलिए विशेषण -e पर समाप्त होता है: kurze Haare, lange Haare, blonde Haare, braune Haare, graue Haare, schwarze Haare.'
    note: आर्टिकल के बिना बहुवचन संज्ञा से पहले विशेषण में -e लगता है। यही पैटर्न पाठ 03 के *Augen* में भी है।
  de.a1.unit55.lesson02.teach.anna_hat_lange:
    title: 'Ihre: उसकी'
    gloss: 'यहाँ Ihre का अर्थ ''उसकी'' है: ihre Haare = उसके बाल। अन्ना के बाल लंबे हैं, और उसके बाल सुनहरे हैं।'
    note: '*Ihre* (छोटे i के साथ) ''उसकी'' के अर्थ वाला अधिकारसूचक शब्द है और बहुवचन संज्ञा Haare के अनुसार रूप लेता है। बड़े I के साथ *Ihre* का अर्थ ''आपका/आपकी'' (औपचारिक) होता है।'
  de.a1.unit55.lesson02.teach.felix_hat_kurze:
    title: फ़ेलिक्स के छोटे काले बाल हैं
    gloss: फ़ेलिक्स के छोटे काले बाल हैं।
    note: '*schwarz* (काला) फिर आया है, अब बालों के लिए: schwarze Haare.'
  de.a1.unit55.lesson02.teach.anna_hat_lange_2:
    title: अन्ना के लंबे सुनहरे बाल हैं
    gloss: अन्ना के लंबे सुनहरे बाल हैं।
    note: इस पाठ की लंबाई और रंग की शब्दावली एक स्वाभाविक वाक्य में एक साथ आई है।
  de.a1.unit55.lesson03.teach.die_augen:
    title: आँखें
    gloss: आँखें
    note: '*Augen* शब्द *das Auge* का बहुवचन है। जर्मन में आम तौर पर बहुवचन ही चलता है, क्योंकि हमारी दो आँखें होती हैं।'
    example_gloss: फ़ेलिक्स की आँखें भूरी हैं।
  de.a1.unit55.lesson03.teach.blau_braun_gruen:
    title: नीला, भूरा और हरा
    gloss: नीला / भूरा / हरा
    note: 'रंग: blau (नीला), braun (भूरा) और grün (हरा)।'
    example_gloss:
    - अन्ना की आँखें नीली हैं।
    - योनास की आँखें भूरी हैं।
    - लेना की आँखें हरी हैं।
  de.a1.unit55.lesson03.teach.augen_ist_plural:
    title: Augen के साथ -e लगता है
    gloss: 'Augen बहुवचन है, इसलिए विशेषण -e पर समाप्त होता है: blaue Augen, braune Augen, grüne Augen.'
    note: 'वही नियम जो Haare के लिए है: आर्टिकल के बिना बहुवचन संज्ञा के साथ अंत में -e आता है।'
  de.a1.unit55.lesson03.teach.wie_sieht_anna:
    title: अन्ना कैसी दिखती है?
    gloss: अन्ना कैसी दिखती है?
    note: '*Wie sieht ... aus?* इस इकाई का मुख्य प्रश्न है। *Aussehen* वियोज्य क्रिया है: sieht ... aus.'
  de.a1.unit55.lesson03.teach.anna_hat_lange:
    title: अन्ना के लंबे सुनहरे बाल और नीली आँखें हैं
    gloss: अन्ना के लंबे सुनहरे बाल और नीली आँखें हैं।
    note: एक आदर्श उत्तर, जिसमें *und* से बाल और आँखें एक ही वाक्य में जुड़ी हैं।
  de.a1.unit55.lesson04.teach.anna_ein_neues:
    title: अन्ना नीना का परिचय देती है
    gloss: 'अन्ना: एक नई लड़की भाषा-कैफ़े में आ रही है। उसका नाम नीना है।'
    note: '*Ein neues Mädchen kommt* किसी नए व्यक्ति का परिचय देता है। *kommt* के बाद दिशा बताने वाला *ins* (in das) Sprachcafé अभियोगात्मक (Akkusativ) में आता है।'
  de.a1.unit55.lesson04.teach.felix_okay_wie:
    title: फ़ेलिक्स पूछता है कि वह कैसी दिखती है
    gloss: 'फ़ेलिक्स: ठीक है! वह कैसी दिखती है?'
    note: 'इस इकाई का मुख्य प्रश्न फिर आया है, अब नाम की जगह *sie* (वह) के साथ: wie sieht sie aus?'
  de.a1.unit55.lesson04.teach.anna_sie_ist:
    title: अन्ना नीना के कद और बालों का वर्णन करती है
    gloss: 'अन्ना: वह छोटे कद की है और उसके छोटे सुनहरे बाल हैं।'
    note: 'इसमें *klein* को पाठ 02 की बालों की शब्दावली के साथ जोड़ा गया है। दूसरा *sie* छोड़ दिया जाता है: sie ist klein und hat ...'
  de.a1.unit55.lesson04.teach.felix_und_ihre:
    title: फ़ेलिक्स उसकी आँखों के बारे में पूछता है
    gloss: 'फ़ेलिक्स: और उसकी आँखें?'
    note: यहाँ *Ihre* का अर्थ 'उसकी' (अधिकारसूचक) है, 'आप' का कोई रूप नहीं। यह बहुवचन Augen के अनुसार रूप लेता है।
  de.a1.unit55.lesson04.teach.anna_sie_hat:
    title: अन्ना निना की आँखों का वर्णन करती है
    gloss: 'अन्ना: उसकी आँखें हरी हैं।'
    note: यहाँ *grüne Augen* पाठ 03 से दोहराया गया है।
  de.a1.unit55.lesson04.teach.felix_danke_dann:
    title: फ़ेलिक्स उसे पहचान लेगा
    gloss: 'फ़ेलिक्स: शुक्रिया! तब मैं उसे ज़रूर पहचान लूँगा।'
    note: '*Dann erkenne ich sie bestimmt* का अर्थ है ''तब मैं उसे ज़रूर पहचान लूँगा''। *dann* के बाद क्रिया दूसरे स्थान पर आती है: dann erkenne ich sie.'
  de.a1.unit55.lesson05.teach.jonas_und_lena:
    title: जोनास और लेना की तुलना
    gloss: जोनास और लेना भाई-बहन हैं, लेकिन वे अलग-अलग दिखते हैं। जोनास का कद छोटा है, उसके छोटे भूरे बाल और भूरी आँखें हैं। लेना जोनास से लंबी है, उसके लंबे भूरे बाल और हरी आँखें हैं। आप कैसे दिखते हैं?
    note: अब तक सिखाए गए हर रंग और लंबाई के शब्द इस्तेमाल करने वाली छोटी तुलना, जो अंत में पाठक से इकाई का मुख्य सवाल पूछती है।
    glosses:
      Bruder: भाई
      Schwester: बहन
      sehen: दिखना
      unterschiedlich: अलग
      klein: छोटा
      kurze: छोटा
      braune: भूरा
      Haare: बाल
      Augen: आँखें
      größer: ज़्यादा लंबा
      lange: लंबा
      grüne: हरा
      aus: ('aussehen' का हिस्सा = दिखना)
  de.a1.unit55.lesson05.teach.das_muster_kennst:
    title: तुलनात्मक रूप फिर से
    gloss: 'आप यह पैटर्न पहले से जानते हैं: विशेषण + -er + als (से)। यहाँ इसे लोगों के लिए इस्तेमाल किया गया है: लेना जोनास से लंबी है।'
    note: 'तुलना वाली इकाई जैसा ही *-er + als* पैटर्न। Groß बदलकर größer हो जाता है: स्वर पर उमलाउट आ जाता है।'
  de.a1.unit55.lesson05.teach.lena_hat_laengere:
    title: लेना के बाल जोनास से लंबे हैं
    gloss: लेना के बाल जोनास से लंबे हैं।
    note: '*Längere Haare*: बिना उपपद वाली बहुवचन संज्ञा से पहले länger में -e जुड़ता है, और तुलनात्मक रूप में lang पर उमलाउट आता है।'
  de.a1.unit55.lesson05.teach.ich_habe_kurze:
    title: मेरे बाल छोटे और भूरे हैं
    gloss: मेरे बाल छोटे और भूरे हैं।
    note: '*Ich habe ...* वाला उत्तम पुरुष का नमूना वाक्य, जिसे आप अपना रूप-रंग बताते समय दोहरा सकते हैं।'
  de.a1.unit55.lesson06.teach.felix_schau_mal:
    title: फ़ेलिक्स को निना दिखती है
    gloss: 'फ़ेलिक्स: देखो, क्या वह निना है? उसके छोटे सुनहरे बाल और हरी आँखें हैं।'
    note: '*Schau mal* (ज़रा देखो) किसी चीज़ की ओर ध्यान दिलाने का दोस्ताना तरीका है। यह du के लिए आज्ञार्थक रूप है।'
  de.a1.unit55.lesson06.teach.anna_ja_das:
    title: अन्ना पुष्टि करती है
    gloss: 'अन्ना: हाँ, वह निना है!'
    note: एक छोटी, स्वाभाविक पुष्टि।
  de.a1.unit55.lesson06.teach.nina_hallo_bist:
    title: निना फ़ेलिक्स को नमस्ते कहती है
    gloss: 'निना: हैलो, क्या तुम फ़ेलिक्स हो?'
    note: 'एक सरल अनौपचारिक प्रश्न: *bist du ...?* (क्या तुम ... हो?)। Bist, sein का du वाला रूप है।'
  de.a1.unit55.lesson06.teach.felix_ja_freut:
    title: फ़ेलिक्स भी नमस्ते कहता है
    gloss: 'फ़ेलिक्स: हाँ! तुमसे मिलकर खुशी हुई, निना।'
    note: '*Freut mich* पहली मुलाक़ात के लिए आम वाक्यांश है, जैसा इकाई 2 में था। जिसे आप पहले से जानते हों, उसके लिए *Schön, dich zu sehen* कहा जाता है।'
  de.a1.unit55.lesson06.teach.nina_freut_mich:
    title: Nina भी अभिवादन लौटाती है
    gloss: 'Nina: तुमसे मिलकर मुझे भी खुशी हुई!'
    note: संवाद का अंत -- फ़ेलिक्स ने अन्ना के पहले दिए वर्णन से निना को पहचान लिया।
