teaching:
  de.a1.unit03.lesson01.teach.null_bis_vier:
    title: null, eins, zwei, drei, vier
    gloss: शून्य, एक, दो, तीन, चार
    note: जर्मन अंक 0 से 4 तक।
    example_gloss:
    - मेरे पास एक भी सेब नहीं है।
    - मैं पहले नंबर पर हूँ!
    - मेरे पास दो सेब हैं।
    - मेरे पास तीन सेब हैं।
    - मेरे पास चार सेब हैं।
  de.a1.unit03.lesson01.teach.fuenf_bis_zehn:
    title: fünf, sechs, sieben, acht, neun, zehn
    gloss: पाँच, छह, सात, आठ, नौ, दस
    note: जर्मन में 5 से 10 तक की संख्याएँ।
    example_gloss:
    - मेरे पास पाँच सेब हैं।
    - मेरे पास छह सेब हैं।
    - मेरे पास सात सेब हैं।
    - मेरे पास आठ सेब हैं।
    - मेरे पास नौ सेब हैं।
    - मेरे पास दस सेब हैं।
  de.a1.unit03.lesson02.teach.elf_zwoelf:
    title: elf, zwölf
    gloss: ग्यारह, बारह
    note: '*elf* और *zwölf* अनियमित हैं, हिंदी के "ग्यारह"/"बारह" की तरह इनका अपना अलग रूप है। ये 13 से शुरू होने वाले "-zehn" वाले ढाँचे पर नहीं चलते।'
    example_gloss:
    - मेरे घर का नंबर ग्यारह है।
    - मेरे घर का नंबर बारह है।
  de.a1.unit03.lesson02.teach.dreizehn_bis_sechzehn:
    title: dreizehn, vierzehn, fünfzehn, sechzehn
    gloss: तेरह, चौदह, पंद्रह, सोलह
    note: '13 से आगे जर्मन संख्याएँ मूल अंक + *-zehn* (यानी “दस”) से बनती हैं; उनका अंत *-teen* नहीं, -zehn होता है। ध्यान दें: *sechzehn* लिखा जाता है, *sechszehn* नहीं – यहाँ *s* हट जाता है।'
    example_gloss:
    - मेरे घर का नंबर तेरह है।
    - मेरे घर का नंबर चौदह है।
    - मेरे घर का नंबर पंद्रह है।
    - मेरे घर का नंबर सोलह है।
  de.a1.unit03.lesson02.teach.siebzehn_bis_zwanzig:
    title: siebzehn, achtzehn, neunzehn, zwanzig
    gloss: सत्रह, अठारह, उन्नीस, बीस
    note: 'ध्यान दें: *siebzehn* लिखा जाता है, *siebenzehn* नहीं; *-zehn* से पहले *sieben* का *-en* हट जाता है।'
    example_gloss:
    - मेरे घर का नंबर सत्रह है।
    - मेरे घर का नंबर अठारह है।
    - मेरे घर का नंबर उन्नीस है।
    - मेरे घर का नंबर बीस है।
  de.a1.unit03.lesson03.teach.dreissig_bis_fuenfzig:
    title: dreißig, vierzig, fünfzig
    gloss: तीस, चालीस, पचास
    note: 'ध्यान दें: *dreißig* लिखा जाता है, *dreizig* नहीं; 30 का अंत *-zig* की जगह *-ßig* से होता है (20, यानी *zwanzig*, भी अनियमित है)।'
    example_gloss:
    - यह तीस यूरो का है।
    - यह चालीस यूरो का है।
    - यह पचास यूरो का है।
  de.a1.unit03.lesson03.teach.sechzig_bis_neunzig:
    title: sechzig, siebzig, achtzig, neunzig
    gloss: साठ, सत्तर, अस्सी, नब्बे
    note: '40 से आगे नियम सीधा है: अंक + *-zig* (इसमें भी 13–19 की तरह *sech-* और *sieb-* रूप छोटे हो जाते हैं)।'
    example_gloss:
    - यह साठ यूरो का है।
    - यह सत्तर यूरो का है।
    - यह अस्सी यूरो का है।
    - यह नब्बे यूरो का है।
  de.a1.unit03.lesson03.teach.hundert:
    title: hundert
    gloss: सौ
    note: '*hundert* अकेले ही "सौ" या "एक सौ" का अर्थ देता है। इसके पहले *ein* लगाने की ज़रूरत नहीं है (*einhundert* भी संभव है, पर रोज़मर्रा की बोलचाल में कम प्रचलित है)।'
    example_gloss: यह सौ यूरो का है।
  de.a1.unit03.lesson03.teach.einundzwanzig:
    title: einundzwanzig
    gloss: इक्कीस
    note: जर्मन में 21 से 99 तक की संख्याओं में पहले इकाई, फिर *und* ("और"), फिर दहाई आती है, और सब एक ही शब्द में लिखा जाता है। हिंदी "इक्कीस" में दहाई पहले आती है, जर्मन में उलटा क्रम है। *einundzwanzig* = *ein* (एक) + *und* (और) + *zwanzig* (बीस), यानी शाब्दिक रूप से "एक-और-बीस"।
  de.a1.unit03.lesson03.teach.zweiunddreissig:
    title: zweiunddreißig
    gloss: बत्तीस
    note: 'यही ढाँचा: *zwei* (दो) + *und* + *dreißig* (तीस) = "दो-और-तीस" = 32।'
  de.a1.unit03.lesson04.teach.wie_alt_sind_sie:
    title: Wie alt sind Sie?
    gloss: आपकी उम्र क्या है? (औपचारिक)
    note: '*alt* का अर्थ है "पुराना/बड़ा (उम्र में)"। शाब्दिक रूप से: "आप कितने साल के हैं?"।'
  de.a1.unit03.lesson04.teach.wie_alt_bist_du:
    title: Wie alt bist du?
    gloss: तुम्हारी उम्र क्या है? (अनौपचारिक)
    note: यह अनौपचारिक रूप है, जिसमें *du* का प्रयोग होता है।
  de.a1.unit03.lesson04.teach.ich_bin_jahre_alt:
    title: Ich bin achtundzwanzig Jahre alt.
    gloss: मैं अट्ठाईस साल का/की हूँ।
    note: '*Jahre alt* (साल का) हमेशा संख्या के बाद आता है। जर्मन में उम्र इसी तरह बताई जाती है: "मैं [संख्या] साल का/की हूँ"।'
  de.a1.unit03.lesson05.teach.line01:
    title: फ़ेलिक्स अन्ना की उम्र पूछता है
    gloss: 'फ़ेलिक्स कहता है: अगर मैं पूछ सकूँ, तो आपकी उम्र क्या है?'
    note: '*wenn ich fragen darf* ("अगर मैं पूछ सकूँ") सवाल को नरम बना देता है, जो वरना कुछ सीधा लग सकता है। दोनों के औपचारिक *Sie* वाले व्यवहार में यह विनम्रता उचित है।'
  de.a1.unit03.lesson05.teach.line02:
    title: अन्ना जवाब देती है और पलटकर पूछती है
    gloss: 'अन्ना कहती है: मैं अट्ठाईस साल की हूँ। और आप?'
    note: अन्ना अपनी उम्र बताती है और सवाल लौटा देती है, जैसा आपने इकाई 2 में देखा था।
  de.a1.unit03.lesson05.teach.line03:
    title: फ़ेलिक्स जवाब देता है
    gloss: 'फ़ेलिक्स कहता है: मैं इकतीस साल का हूँ।'
    note: इससे पता चलता है कि फ़ेलिक्स अन्ना से तीन साल बड़ा है।
