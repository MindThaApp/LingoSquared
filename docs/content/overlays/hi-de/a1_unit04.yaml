    title: सप्ताह के दिन
  de.a1.unit04.lesson02.monate:
    title: महीने
  de.a1.unit04.lesson03.das_datum:
    title: तारीख़ बताना
  de.a1.unit04.lesson04.im_gespraech_ueber_das_datum:
    title: तारीख़ों के बारे में बात करना
teaching:
  de.a1.unit04.lesson01.teach.montag:
    title: Montag
    gloss: सोमवार
    note: जर्मन भाषी देशों में सप्ताह का पहला दिन *Montag* माना जाता है।
    example_gloss: सोमवार को मेरे पास समय है।
  de.a1.unit04.lesson01.teach.dienstag:
    title: Dienstag
    gloss: मंगलवार
    note: '*Dienstag* सप्ताह का दूसरा दिन है।'
    example_gloss: मंगलवार को मेरे पास समय है।
  de.a1.unit04.lesson01.teach.mittwoch:
    title: Mittwoch
    gloss: बुधवार
    note: '*Mittwoch* का शाब्दिक अर्थ है "सप्ताह का बीच" — यह सचमुच जर्मन कार्य-सप्ताह का बीच का दिन है।'
    example_gloss: बुधवार को मेरे पास समय है।
  de.a1.unit04.lesson01.teach.donnerstag:
    title: Donnerstag
    gloss: गुरुवार
    note: '*Donnerstag* का नाम जर्मनिक देवता दोनर (थोर) के नाम पर पड़ा है।'
    example_gloss: गुरुवार को मेरे पास समय है।
  de.a1.unit04.lesson01.teach.freitag:
    title: Freitag
    gloss: शुक्रवार
    note: '*Freitag* का नाम जर्मनिक देवी फ़्रिग के नाम पर पड़ा है।'
    example_gloss: शुक्रवार को मेरे पास समय है।
  de.a1.unit04.lesson01.teach.samstag:
    title: Samstag
    gloss: शनिवार
    note: जर्मनी के अधिकांश हिस्सों में शनिवार के लिए *Samstag* ही मानक शब्द है; *Sonnabend* उत्तरी और पूर्वी जर्मनी में प्रचलित क्षेत्रीय विकल्प है।
    example_gloss: शनिवार को मेरे पास समय है।
  de.a1.unit04.lesson01.teach.sonntag:
    title: Sonntag
    gloss: रविवार
    note: '*Sonntag* का शाब्दिक अर्थ है "सूर्य का दिन"; हिंदी के "रविवार" में भी सूर्य (रवि) से ही नाम बना है।'
    example_gloss: रविवार को मेरे पास समय है।
  de.a1.unit04.lesson01.teach.welcher_tag:
    title: Welcher Tag ist heute?
    gloss: आज कौन-सा दिन है?
    note: '*heute* का अर्थ है "आज"; *Welcher Tag* का अर्थ है "कौन-सा दिन"।'
  de.a1.unit04.lesson02.teach.januar:
    title: Januar
    gloss: जनवरी
    note: '*Januar* साल का पहला महीना है।'
    example_gloss: मेरा जन्मदिन जनवरी में है।
  de.a1.unit04.lesson02.teach.maerz:
    title: März
    gloss: मार्च
    note: '*März* साल का तीसरा महीना है।'
    example_gloss: मेरा जन्मदिन मार्च में है।
  de.a1.unit04.lesson02.teach.mai:
    title: Mai
    gloss: मई
    note: '*Mai* छोटा और याद रखने में आसान शब्द है — हिंदी के "मई" से इसका उच्चारण काफ़ी मिलता-जुलता है।'
    example_gloss: मेरा जन्मदिन मई में है।
  de.a1.unit04.lesson02.teach.juli:
    title: Juli
    gloss: जुलाई
    note: '*Juli* साल का सातवाँ महीना है।'
    example_gloss: मेरा जन्मदिन जुलाई में है।
  de.a1.unit04.lesson02.teach.september:
    title: September
    gloss: सितंबर
    note: जर्मन में *September* हमेशा बड़े अक्षर से शुरू होकर लिखा जाता है, क्योंकि महीनों के नाम संज्ञा हैं।
    example_gloss: मेरा जन्मदिन सितंबर में है।
  de.a1.unit04.lesson02.teach.dezember:
    title: Dezember
    gloss: दिसंबर
    note: '*Dezember* साल का आख़िरी महीना है।'
    example_gloss: मेरा जन्मदिन दिसंबर में है।
  de.a1.unit04.lesson02.teach.welcher_monat:
    title: Welcher Monat ist es?
    gloss: कौन-सा महीना चल रहा है?
    note: '*Monat* का अर्थ है "महीना"; *es* का अर्थ है "यह/वह"।'
  de.a1.unit04.lesson03.teach.wievielte:
    title: Der Wievielte ist heute?
    gloss: आज की तारीख़ क्या है?
    note: शाब्दिक अर्थ "आज कौन-सी संख्या वाला दिन है?" — जर्मन में तारीख़ पूछने का यही सामान्य तरीका है।
  de.a1.unit04.lesson03.teach.siebte_juli:
    title: Heute ist der siebte Juli.
    gloss: आज 7 जुलाई है।
    note: 'हिंदी की तरह जर्मन में भी पहले दिन, फिर महीना आता है: *der siebte Juli* = "7 जुलाई"। *der siebte Juli* को पूरे वाक्यांश के रूप में याद करें।'
  de.a1.unit04.lesson03.teach.dienstag_siebte_juli:
    title: Heute ist Dienstag, der siebte Juli.
    gloss: आज मंगलवार, 7 जुलाई है।
    note: तारीख़ से पहले वार जोड़ें और दोनों के बीच अल्पविराम लगाएँ।
  de.a1.unit04.lesson03.teach.numerische_form:
    title: Man kann es auch als 7.7. schreiben.
    gloss: इसे 7.7. भी लिखा जा सकता है।
    note: 'जर्मन में संख्या वाली तारीख़ में पहले दिन, फिर महीना लिखा जाता है, और हर एक के बाद बिंदु लगता है: 7.7. = 7 जुलाई।'
  de.a1.unit04.lesson03.teach.geburtstag_frage:
    title: Wann haben Sie Geburtstag?
    gloss: आपका जन्मदिन कब है? (औपचारिक)
    note: शाब्दिक अर्थ "आपके पास जन्मदिन कब होता है?" — जर्मन में कहा जाता है कि आपके पास (*haben*) जन्मदिन होता है।
  de.a1.unit04.lesson03.teach.geburtstag_antwort:
    title: Mein Geburtstag ist der dritte März.
    gloss: मेरा जन्मदिन 3 मार्च को है।
    note: '*Mein Geburtstag* = "मेरा जन्मदिन"; *der dritte März* = "3 मार्च" (पहले दिन, फिर महीना)।'
  de.a1.unit04.lesson04.teach.oeffnet:
    title: öffnet
    gloss: खुलता है
    note: '*öffnet*, *öffnen* (खोलना/खुलना) का अन्य पुरुष एकवचन रूप है — दुकान या पुस्तकालय जैसी चीज़ के "खुलने" के लिए प्रयोग होता है।'
    example_gloss: दुकान सोमवार को खुलती है।
  de.a1.unit04.lesson04.teach.wieder:
    title: wieder
    gloss: फिर से
    note: '*wieder* का अर्थ है "फिर से" — यहाँ यह पूछने के लिए आया है कि कोई चीज़ दोबारा कब खुलेगी।'
    example_gloss: पुस्तकालय सोमवार को फिर से खुलता है।
  de.a1.unit04.lesson04.teach.die:
    title: die
    gloss: स्त्रीलिंग एकवचन और सभी बहुवचन संज्ञाओं का निश्चयवाचक उपपद
    note: '*die* स्त्रीलिंग एकवचन और सभी बहुवचन संज्ञाओं का निश्चयवाचक उपपद है — यहाँ यह स्त्रीलिंग संज्ञा *Bibliothek* के साथ आया है।'
    example_gloss: पुस्तकालय बड़ा है।
  de.a1.unit04.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: पुस्तकालय
    note: '*Bibliothek* स्त्रीलिंग संज्ञा है (*die Bibliothek*)।'
    example_gloss: मैं पुस्तकालय जा रहा हूँ।
  de.a1.unit04.lesson04.teach.am:
    title: am
    gloss: पर (दिन या तारीख़ के साथ)
    note: '*am*, *an dem* का संक्षिप्त रूप है, जो वारों और तारीख़ों से पहले आता है (*am Montag* = "सोमवार को")।'
    example_gloss: सोमवार को मैं काम करता हूँ।
  de.a1.unit04.lesson04.teach.den:
    title: den
    gloss: पुल्लिंग कर्मकारक का निश्चयवाचक उपपद
    note: '*den*, *der* का पुल्लिंग कर्मकारक रूप है। यह वार के बाद पूरी तारीख़ में आता है, जैसे *am Donnerstag, den neunten Juli* — इस स्तर पर कारक का विश्लेषण करने के बजाय इसे एक स्थिर साँचे के रूप में याद करें। (*am* के बाद *dem* भी दिखेगा, जो उतना ही सही है।)'
    example_gloss: हम गुरुवार, 9 जुलाई को मिल रहे हैं।
  de.a1.unit04.lesson04.teach.neunten:
    title: neunten
    gloss: नौवाँ
    note: '*neunten*, *neun* (नौ) का तारीख़ों में प्रयुक्त क्रमवाचक रूप है: *der neunte Juli* (कर्ताकारक) इस पूरी तारीख़ वाले ढाँचे में *den neunten Juli* बन जाता है।'
    example_gloss: मेरा जन्मदिन 9 जुलाई को है।
  de.a1.unit04.lesson04.teach.line01:
    title: फ़ेलिक्स तारीख़ पूछता है
    gloss: 'फ़ेलिक्स कहता है: आज की तारीख़ क्या है?'
  de.a1.unit04.lesson04.teach.line02:
    title: अन्ना तारीख़ बताती है
    gloss: 'अन्ना कहती है: आज मंगलवार, 7 जुलाई है।'
  de.a1.unit04.lesson04.teach.line03:
    title: फ़ेलिक्स पुस्तकालय के बारे में पूछता है
    gloss: 'फ़ेलिक्स कहता है: पुस्तकालय फिर से कब खुलेगा?'
  de.a1.unit04.lesson04.teach.line04:
    title: अन्ना जवाब देती है
    gloss: 'अन्ना कहती है: वह गुरुवार, 9 जुलाई को फिर से खुलेगा।'
    note: यहाँ *Sie* का अर्थ "वह" है — यह *die Bibliothek* (स्त्रीलिंग संज्ञा) की ओर इशारा करता है।
  de.a1.unit04.lesson04.teach.line05:
    title: फ़ेलिक्स विदा लेता है
    gloss: 'फ़ेलिक्स कहता है: ठीक है, गुरुवार को मिलते हैं।'
    note: '*bis Donnerstag* = "गुरुवार तक" — "गुरुवार को मिलते हैं" कहने का आम तरीका।'
  de.a1.unit04.lesson04.teach.notiz:
    title: दरवाज़े पर लगा नोट
    gloss: गुरुवार, 9 जुलाई तक बंद।
    note: '*Geschlossen* का अर्थ है "बंद"।'
