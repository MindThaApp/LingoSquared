  de.a1.unit05.lesson01.teach.drei_uhr:
    title: Es ist drei Uhr.
    gloss: तीन बजे हैं।
    note: '*Uhr* = ''बजे''। पूरे घंटे के लिए संख्या के बाद *Uhr* लगता है।'
  de.a1.unit05.lesson01.teach.halb_vier:
    title: halb vier = 3:30
    gloss: साढ़े तीन बजे हैं (3:30)।
    note: 'जर्मन में आधे घंटे को उस घंटे के हिसाब से बताया जाता है जिसकी ओर समय बढ़ रहा है: *halb vier* = ''चार की ओर आधा'' = 3:30, यानी साढ़े चार नहीं।'
  de.a1.unit05.lesson01.teach.fuenf_uhr:
    title: Es ist fünf Uhr.
    gloss: पाँच बजे हैं।
  de.a1.unit05.lesson02.teach.viertel_nach:
    title: Es ist Viertel nach drei.
    gloss: सवा तीन बजे हैं (3:15)।
    note: '*Viertel* = ''चौथाई''; *nach* = ''के बाद''।'
  de.a1.unit05.lesson02.teach.viertel_vor:
    title: Es ist Viertel vor vier.
    gloss: चार बजने में पंद्रह मिनट बाकी हैं, यानी पौने चार बजे हैं (3:45)।
    note: '*vor* = ''से पहले''।'
  de.a1.unit05.lesson02.teach.zehn_nach:
    title: Es ist zehn nach vier.
    gloss: चार बजकर दस मिनट हुए हैं (4:10)।
    note: 'जर्मन में पहले मिनट, फिर *nach*, फिर घंटा आता है: zehn nach vier।'
  de.a1.unit05.lesson02.teach.zehn_vor:
    title: Es ist zehn vor fünf.
    gloss: पाँच बजने में दस मिनट बाकी हैं (4:50)।
    note: 'जर्मन में पहले मिनट, फिर *vor*, फिर आने वाला घंटा आता है: zehn vor fünf।'
  de.a1.unit05.lesson03.teach.morgen:
    title: Morgen
    gloss: सुबह
    note: '*Morgen* सुबह के लिए संज्ञा है, लगभग सुबह 6 से दोपहर 12 बजे तक।'
    example_gloss: सुप्रभात, Felix!
  de.a1.unit05.lesson03.teach.mittag:
    title: Mittag
    gloss: दोपहर (12 बजे)
    note: '*Mittag* ठीक दोपहर 12 बजे का समय है, यानी Morgen और Nachmittag के बीच का मध्य बिंदु।'
    example_gloss: दोपहर के 12 बजे हैं।
  de.a1.unit05.lesson03.teach.nachmittag:
    title: Nachmittag
    gloss: दोपहर बाद
    note: '*Nachmittag* लगभग दोपहर 12 से शाम 6 बजे तक होता है।'
    example_gloss: मैं दोपहर बाद काम करता/करती हूँ।
  de.a1.unit05.lesson03.teach.abend:
    title: Abend
    gloss: शाम
    note: '*Abend* लगभग शाम 6 से रात 10 बजे तक होता है।'
    example_gloss: शुभ संध्या, Anna!
  de.a1.unit05.lesson03.teach.nacht:
    title: Nacht
    gloss: रात
    note: '*Nacht* लगभग रात 10 से सुबह 6 बजे तक होती है।'
    example_gloss: शुभ रात्रि, Felix!
  de.a1.unit05.lesson03.teach.mitternacht:
    title: Mitternacht
    gloss: आधी रात
    note: '*Mitternacht* ठीक रात के 12 बजे, यानी 0 Uhr का समय है।'
    example_gloss: पार्टी आधी रात को खत्म होती है।
  de.a1.unit05.lesson03.teach.achtzehn:
    title: achtzehn
    gloss: अठारह
    note: '*achtzehn* = 18; यहाँ यह आधिकारिक समय के लिए 24 घंटे की घड़ी में इस्तेमाल हुआ है (achtzehn Uhr = शाम 6 बजे)।'
    example_gloss: दुकान 18:00 बजे (शाम 6 बजे) बंद होती है।
  de.a1.unit05.lesson03.teach.laden_oeffnet:
    title: Der Laden öffnet um neun Uhr morgens.
    gloss: दुकान सुबह नौ बजे खुलती है।
    note: '*um* + समय = किसी समय ''पर''; *morgens* = ''सुबह के समय''।'
  de.a1.unit05.lesson03.teach.laden_schliesst:
    title: Der Laden schließt um achtzehn Uhr.
    gloss: दुकान 18:00 बजे (शाम 6 बजे) बंद होती है।
    note: '*schließt* = ''बंद होती है''। खुलने के आधिकारिक समय 24 घंटे की घड़ी में बताए जाते हैं।'
  de.a1.unit05.lesson04.teach.wann:
    title: Wann
    gloss: कब
    note: '*Wann* समय के बारे में प्रश्न शुरू करता है।'
    example_gloss: आप कब आ रहे हैं?
  de.a1.unit05.lesson04.teach.oeffnet_die:
    title: öffnet die
    gloss: खुलता है / खुलती है
    note: '*öffnet*, *öffnen* (खोलना / खुलना) का अन्य पुरुष एकवचन रूप है; *die* स्त्रीलिंग और बहुवचन का निश्चित उपपद है, जो *die Bibliothek* के साथ आया है।'
    example_gloss: पुस्तकालय कब खुलता है?
  de.a1.unit05.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: पुस्तकालय
    note: '*Bibliothek* स्त्रीलिंग संज्ञा है (*die Bibliothek*), वही जगह जो इकाई 4 में आई थी।'
    example_gloss: मैं पुस्तकालय जा रहा/रही हूँ।
  de.a1.unit05.lesson04.teach.sie_pronomen:
    title: sie
    gloss: वह / वे (छोटे अक्षर में)
    note: यहाँ *sie* अन्य पुरुष सर्वनाम है, जो स्त्रीलिंग संज्ञा *die Bibliothek* की जगह आया है -- 'वह' (वस्तु के लिए)। इसे बड़े अक्षर वाले *Sie* (औपचारिक 'आप') से न मिलाइए, जिसे Anna और Felix आपस में इस्तेमाल करते हैं।
    example_gloss: मुझे पुस्तकालय पसंद है। मैं वहाँ अक्सर जाता/जाती हूँ।
  de.a1.unit05.lesson04.teach.dann:
    title: dann
    gloss: तब
    note: '*dann* यहाँ विदाई वाले वाक्य *Bis dann!* (''तब मिलते हैं!'') में आया है।'
    example_gloss: तो फिर मिलते हैं!
  de.a1.unit05.lesson04.teach.line01:
    title: फ़ेलिक्स लाइब्रेरी के बारे में पूछता है
    gloss: 'फ़ेलिक्स कहता है: लाइब्रेरी कब खुलती है?'
  de.a1.unit05.lesson04.teach.line02:
    title: अन्ना जवाब देती है
    gloss: 'अन्ना कहती है: यह सुबह नौ बजे खुलती है।'
    note: यहाँ *Sie* का मतलब 'यह' है – यह *die Bibliothek* के लिए आया है। इसका पहला अक्षर बड़ा सिर्फ़ इसलिए है कि यह वाक्य की शुरुआत में है।
  de.a1.unit05.lesson04.teach.line03:
    title: फ़ेलिक्स एक और सवाल पूछता है
    gloss: 'फ़ेलिक्स कहता है: और यह कब बंद होती है?'
  de.a1.unit05.lesson04.teach.line04:
    title: अन्ना फिर जवाब देती है
    gloss: 'अन्ना कहती है: यह 18:00 बजे (शाम 6 बजे) बंद होती है।'
  de.a1.unit05.lesson04.teach.line05:
    title: फ़ेलिक्स विदा लेता है
    gloss: 'फ़ेलिक्स कहता है: ठीक है, तो फिर मिलते हैं!'
  de.a1.unit05.lesson04.teach.schild:
    title: दरवाज़े पर लगा एक नोटिस
    gloss: 'खुलने का समय: 9:00 से 18:00 तक।'
    note: '*Öffnungszeiten* = ''खुलने का समय''; *bis* = ''तक''।'
