    title: Bank
    gloss: बैंक
    note: '*Bank* का अर्थ है बैंक -- स्त्रीलिंग संज्ञा, *die Bank*।'
    example_gloss: मुझे बैंक जाना है।
  de.a1.unit09.lesson01.teach.krankenhaus:
    title: Krankenhaus
    gloss: अस्पताल
    note: '*Krankenhaus* का शाब्दिक अर्थ है ''बीमार घर'' -- नपुंसकलिंग संज्ञा, *das Krankenhaus*।'
    example_gloss: मेरा दोस्त अस्पताल में है।
  de.a1.unit09.lesson01.teach.apotheke:
    title: Apotheke
    gloss: दवाखाना
    note: '*Apotheke* का अर्थ है दवाखाना -- स्त्रीलिंग संज्ञा, *die Apotheke*।'
    example_gloss: दवाखाना आज खुला है।
  de.a1.unit09.lesson01.teach.park:
    title: Park
    gloss: पार्क
    note: '*Park* का अर्थ है पार्क -- पुल्लिंग संज्ञा, *der Park*।'
    example_gloss: हमें पार्क में टहलना पसंद है।
  de.a1.unit09.lesson01.teach.restaurant:
    title: Restaurant
    gloss: रेस्तराँ
    note: '*Restaurant* का अर्थ है रेस्तराँ -- नपुंसकलिंग संज्ञा, *das Restaurant*।'
    example_gloss: इस रेस्तराँ का खाना अच्छा है।
  de.a1.unit09.lesson02.teach.neben:
    title: Die Apotheke ist neben dem Park.
    gloss: दवाखाना पार्क के बगल में है।
    note: '*neben* का अर्थ है ''के बगल में''। यह दोतरफ़ा पूर्वसर्ग है -- स्थिर स्थान बताने के लिए (जैसे यहाँ) यह Dativ लेता है, इसलिए *der Park* (पुल्लिंग) *dem Park* बन जाता है।'
  de.a1.unit09.lesson02.teach.gegenueber_von:
    title: Die Apotheke ist gegenüber vom Krankenhaus.
    gloss: दवाखाना अस्पताल के सामने (सड़क के उस पार) है।
    note: '*gegenüber von* का अर्थ है ''के सामने / के ठीक उस पार''। *vom*, *von dem* (Dativ नपुंसकलिंग, *das Krankenhaus*) का सामान्य संक्षिप्त रूप है, जो बोलचाल और लेखन दोनों में चलता है।'
  de.a1.unit09.lesson02.teach.zwischen:
    title: Die Apotheke ist zwischen der Bank und dem Park.
    gloss: दवाखाना बैंक और पार्क के बीच में है।
    note: '*zwischen* का अर्थ है ''के बीच''। दोनों Dativ रूप ध्यान दें: *der Bank* (स्त्रीलिंग) और *dem Park* (पुल्लिंग)।'
  de.a1.unit09.lesson02.teach.hinter:
    title: Das Restaurant ist hinter der Bank.
    gloss: रेस्तराँ बैंक के पीछे है।
    note: '*hinter* का अर्थ है ''के पीछे'' -- *der Bank* स्त्रीलिंग का Dativ रूप है।'
  de.a1.unit09.lesson02.teach.vor:
    title: Der Park ist vor dem Krankenhaus.
    gloss: पार्क अस्पताल के सामने है।
    note: '*vor* का अर्थ है ''के आगे / के सामने'' -- *dem Krankenhaus* नपुंसकलिंग का Dativ रूप है।'
  de.a1.unit09.lesson03.teach.wo_ist_die_bank:
    title: Wo ist die Bank?
    gloss: बैंक कहाँ है?
    note: '*Wo ist...?* किसी चीज़ की जगह पूछने का सामान्य तरीका है।'
  de.a1.unit09.lesson03.teach.sie_ist_neben:
    title: Sie ist neben dem Park.
    gloss: वह पार्क के बगल में है।
    note: '*Sie* यहाँ ''वह'' के अर्थ में है (*die Bank* के लिए, स्त्रीलिंग)। इसका पहला अक्षर बड़ा सिर्फ़ इसलिए है कि यह वाक्य की शुरुआत में है। क्रिया *ist* दिखाती है कि यह सम्मानसूचक ''आप'' नहीं है, जिसके साथ *Sie sind* आता।'
  de.a1.unit09.lesson03.teach.ist_es_weit:
    title: Ist es weit von hier?
    gloss: क्या यह यहाँ से दूर है?
    note: '*weit* का अर्थ है दूर। *es* यहाँ पूरी स्थिति के लिए एक सामान्य शब्द है; यह किसी विशेष संज्ञा के लिंग से मेल नहीं खाता।'
  de.a1.unit09.lesson03.teach.nicht_weit:
    title: Nein, es ist nicht weit.
    gloss: नहीं, यह दूर नहीं है।
    note: '*nicht* विशेषण *weit* को नकारता है।'
  de.a1.unit09.lesson04.teach.entschuldigung_wo:
    title: Entschuldigung, wo ist die Apotheke?
    gloss: माफ़ कीजिए, दवाखाना कहाँ है?
    note: '*Entschuldigung* पहले ''माफ़ कीजिए / क्षमा करें'' के रूप में आ चुका है -- यहाँ यह विनम्रता से सवाल शुरू करता है।'
  de.a1.unit09.lesson04.teach.line01:
    title: फ़ेलिक्स रास्ता पूछता है
    gloss: 'फ़ेलिक्स कहता है: माफ़ कीजिए, दवाखाना कहाँ है?'
    note: ऊपर के अलग वाक्यांश वाली ही विनम्र शुरुआत, अब असली बातचीत में।
  de.a1.unit09.lesson04.teach.line02:
    title: आना जगह बताती है
    gloss: 'आना कहती है: वह अस्पताल के सामने है।'
    note: पूरा जवाब दवाखाने की जगह को किसी जानी-पहचानी जगह के सापेक्ष बताता है।
  de.a1.unit09.lesson04.teach.line03:
    title: फ़ेलिक्स पूछता है कि कितनी दूर है
    gloss: 'फ़ेलिक्स कहता है: क्या यह यहाँ से दूर है?'
    note: दिशा का अंदाज़ा मिलने के बाद पूछा जाने वाला स्वाभाविक अगला सवाल।
  de.a1.unit09.lesson04.teach.line04:
    title: आना दूरी के बारे में जवाब देती है
    gloss: 'आना कहती है: नहीं, दूर नहीं है। वह बैंक और पार्क के बीच में है।'
    note: पूरा जवाब पहले दूरी को लेकर तसल्ली देता है, फिर एक और सटीक पहचान-स्थल बताता है।
