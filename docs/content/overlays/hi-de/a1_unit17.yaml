  de.a1.unit17.lesson02.teach.ich_brauche:
    title: Ich brauche Wasser.
    gloss: मुझे पानी चाहिए।
    note: '*brauche* का अर्थ "चाहिए / ज़रूरत है" है, "इस्तेमाल करना" नहीं।'
    example_gloss: 'संदर्भ में: मुझे पानी और ब्रेक चाहिए।'
  de.a1.unit17.lesson02.teach.pause:
    title: Pause
    gloss: ब्रेक / विराम
    note: '*eine Pause* थोड़ी देर का आराम या ब्रेक होता है।'
    example_gloss: मुझे ब्रेक चाहिए।
  de.a1.unit17.lesson02.teach.health_instruction:
    title: Trinken Sie Wasser.
    gloss: पानी पीजिए। ब्रेक लीजिए।
    note: औपचारिक *Sie* निर्देश को विनम्र बनाए रखता है।
    example_gloss: ब्रेक लीजिए।
  de.a1.unit17.lesson02.teach.gesundheit_text:
    title: अन्ना की समस्या
    gloss: अन्ना की समस्या
    note: छोटा पाठ लक्षण और तुरंत की ज़रूरत बताता है।
    example_gloss: उसे पानी चाहिए।
  de.a1.unit17.lesson02.teach.line01:
    title: फ़ेलिक्स पूछता है कि अन्ना कैसी है
    gloss: 'फ़ेलिक्स: अन्ना, क्या आप ठीक हैं?'
    note: फ़ेलिक्स अन्ना के साथ औपचारिक *Ihnen* रखता है।
  de.a1.unit17.lesson02.teach.line02:
    title: अन्ना अपनी समस्या बताती है
    gloss: 'अन्ना: नहीं, मेरे सिर में दर्द है।'
    note: उत्तर लक्षण को सीधे-सादे ढंग से बताता है।
  de.a1.unit17.lesson02.teach.line03:
    title: फ़ेलिक्स मदद की पेशकश करता है
    gloss: 'फ़ेलिक्स: क्या आपको मदद चाहिए?'
    note: मदद की एक सीधी पेशकश।
  de.a1.unit17.lesson02.teach.line04:
    title: अन्ना बताती है कि उसे क्या चाहिए
    gloss: 'अन्ना: हाँ, कृपया। मुझे पानी और ब्रेक चाहिए।'
    note: उत्तर में *Ja, bitte* कहा गया है और तुरंत की ज़रूरतें बताई गई हैं।
    example_gloss: 'संदर्भ में: मुझे पानी और ब्रेक चाहिए।'
