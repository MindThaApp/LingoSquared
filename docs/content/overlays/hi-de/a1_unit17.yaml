    gloss: पेटदर्द
    note: '*Bauch* का अर्थ पेट है; *Schmerzen* का अर्थ दर्द है।'
    example_gloss: मेरे पेट में दर्द है।
  de.a1.unit17.lesson01.teach.hals:
    title: Hals
    gloss: गला / गर्दन
    note: '*Hals* का अर्थ संदर्भ के अनुसार गला या गर्दन होता है।'
    example_gloss: मेरा गला दर्द कर रहा है।
  de.a1.unit17.lesson01.teach.weh:
    title: Mein Kopf tut weh.
    gloss: मेरे सिर में दर्द है।
    note: 'जर्मन में शरीर का अंग ही वाक्य का कर्ता होता है और वह "दर्द करता है": *tut weh*।'
    example_gloss: मेरे पेट में दर्द है।
  de.a1.unit17.lesson01.teach.mir_ist_schlecht:
    title: Mir ist schlecht.
    gloss: मेरा जी मिचला रहा है।
    note: इसका शब्द-दर-शब्द अनुवाद "मैं बुरा हूँ" न करें; स्वाभाविक वाक्यांश *Mir ist schlecht* ही है।
    example_gloss: मेरा जी मिचला रहा है; मेरे पेट में दर्द है।
  de.a1.unit17.lesson02.teach.brauchen_sie_hilfe:
    title: Brauchen Sie Hilfe?
    gloss: क्या आपको मदद चाहिए?
