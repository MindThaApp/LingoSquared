  en.a1.unit51.lesson03.teach.dialogue_line1:
    title: 药剂师打招呼
    gloss: 药剂师：你好，需要我帮忙吗？
    note: '*Hi, can I help you?* 的意思是“你好，需要我帮忙吗？”'
  en.a1.unit51.lesson03.teach.dialogue_line2:
    title: Leila 的症状
    gloss: Leila：是的，我咳得很厉害，还流鼻涕。
    note: 这是前面学过的句子，再复习一遍。
  en.a1.unit51.lesson03.teach.dialogue_line3:
    title: 药剂师推荐糖浆
    gloss: 药剂师：我这里有一种止咳糖浆，应该会有帮助。请睡前服用。
    note: '*before bed* 的意思是“睡前”，这是针对止咳糖浆的服用时间，不是针对药片的。'
  en.a1.unit51.lesson03.teach.dialogue_line4:
    title: Daniel 的问题
    gloss: Daniel：你们也有治喉咙痛的药吗？
    note: 句末的 *too* 的意思是“也”。
  en.a1.unit51.lesson03.teach.dialogue_line5:
    title: 药剂师推荐药片
    gloss: 药剂师：有，这些药片对喉咙痛很有效。每四小时服一片。
    note: 这说的是药片的用法：每隔四小时一次。糖浆的服用时间则不同，是睡前。
  en.a1.unit51.lesson03.teach.dialogue_line6:
    title: Leila 的决定
    gloss: Leila：太好了，两样我都要。一共多少钱？
    note: '*I''ll take both.* 的意思是“两样我都要”。'
  en.a1.unit51.lesson03.teach.dialogue_line7:
    title: 价格
    gloss: 药剂师：九美元。
    note: 这是前面学过的句子，再复习一遍。
  en.a1.unit51.lesson03.teach.dialogue_line8:
    title: Leila 付钱
    gloss: Leila：给你。谢谢！
    note: '*Here you go.* 的意思是“给你”，把东西递给别人时说。'
  en.a1.unit51.lesson04.teach.reading_passage:
    title: 阅读：去药店
    gloss: 去药店：Leila 和 Mia 去山里玩的几天后，她感冒了。她咳得很厉害，还流鼻涕，喉咙也痛。Daniel 陪她走到她公寓附近的药店。药剂师听了 Leila 的症状，推荐了止咳糖浆和药片。药剂师说，糖浆要在睡前服用，药片每四小时服一片。两样药 Leila 一共付了九美元。回家的路上，Daniel 还给她买了一盒纸巾。当晚 Leila 吃了药，到周末时，她的咳嗽已经好多了。
    note: '*by the weekend* 的意思是“到周末时”。'
