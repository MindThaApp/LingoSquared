  en.a1.unit32.lesson01.teach.bird:
    title: bird
    gloss: 鸟
    note: '*bird* 的意思是“鸟”。'
    example_gloss: 我们有一只鸟。
  en.a1.unit32.lesson01.teach.pet:
    title: pet
    gloss: 宠物
    note: '*pet* 的意思是“宠物”；*pets* 是复数。注意问句 *Do you have any pets?* 里的 *any*：英语的疑问句和否定句里，复数名词前通常要用 *any*。汉语“你有宠物吗？”里没有对应的词，但在英语里 *any* 通常不能省略。'
    example_gloss: 你有宠物吗？
  en.a1.unit32.lesson02.teach.name_is:
    title: Her name is Luna.
    gloss: 她叫 Luna。
    note: 知道动物的性别时，英语常用 *her*/*his*（以及 *she*/*he*）来称呼宠物；汉语里常说“它”。*Her name is Luna* 说明这是一只雌性动物。
  en.a1.unit32.lesson02.teach.play:
    title: play
    gloss: 玩
    note: '*play* 的意思是“玩”。'
    example_gloss: 我的狗喜欢玩。
  en.a1.unit32.lesson02.teach.walk:
    title: walk
    gloss: 遛
    note: '*walk* 在这里的意思是“带宠物出去散步，遛”。'
    example_gloss: 我每天遛我的狗。
  en.a1.unit32.lesson02.teach.friendly:
    title: friendly
    gloss: 友好
    note: '*friendly* 的意思是“友好，亲人”。'
    example_gloss: 她的猫很亲人。
  en.a1.unit32.lesson02.teach.small:
    title: small
    gloss: 小
    note: '*small* 的意思是“小”。'
    example_gloss: 这条鱼很小。
  en.a1.unit32.lesson03.teach.dialogue_line1:
    title: Daniel 的问题
    gloss: Daniel 问：Mia，你有宠物吗？
    note: 这里的 *any* 在汉语里没有对应的词，但在英语中通常不能省略。
  en.a1.unit32.lesson03.teach.dialogue_line2:
    title: "Mia的回答"
    gloss: Mia 说：有，我有一只猫。她叫 Luna。
    note: 因为知道猫是雌性，所以用 *She* 和 *her*；汉语里常说“它”。
  en.a1.unit32.lesson03.teach.dialogue_line3:
    title: Daniel 的追问
    gloss: Daniel 说：真好！她喜欢玩吗？
    note: 这里 *Does* 是与 *she* 搭配的助动词，用来构成疑问句；汉语用“吗”来提问，英语则要把 *Do/Does* 放在句首。
  en.a1.unit32.lesson03.teach.dialogue_line4:
    title: "Mia的回答"
    gloss: Mia 说：喜欢，她特别爱玩球。你呢？
    note: '*What about you?* 是把同一个问题抛回给对方的简短自然说法。'
  en.a1.unit32.lesson03.teach.dialogue_line5:
    title: "Daniel的回答"
    gloss: Daniel 说：我有一条小鱼，但我想要一只狗。
    note: '*but* 连接两个相对的想法：他已经有一只宠物，但想要另一种动物。'
  en.a1.unit32.lesson04.teach.reading_passage:
    title: 关于 Leila 和 Daniel 的短文
    gloss: Leila 有一只叫 Max 的狗。他个子很大，而且很亲人。她每天早上都遛他。Daniel 没有狗，但他有一条小鱼。鱼不需要遛，但 Daniel 还是喜欢看它游泳。
    note: 因为 Max 是公的，所以用 *He*。英语根据动物的真实性别选用 *she* 或 *he*，而不一定像汉语那样常说“它”。
