teaching:
  en.a1.unit53.lesson01.teach.rent:
    title: rent
    gloss: 租
    note: '*rent* 的意思是“租”。注意：*rent* 既可以指租进（向别人租），也可以指租出（租给别人），和中文的“租”一样，要根据上下文判断是哪一种。'
    example_gloss: 我想租一辆自行车。
  en.a1.unit53.lesson01.teach.deposit:
    title: deposit
    gloss: 押金
    note: '*deposit* 的意思是“押金”，是事先付的钱，如果你把车完好地还回来就会退还。'
    example_gloss: 押金是二十美元。
  en.a1.unit53.lesson01.teach.return:
    title: return
    gloss: 归还
    note: '*return* 在这里的意思是“归还”，把东西还回去（不是“回来”）。'
    example_gloss: 请今天把自行车还回来。
  en.a1.unit53.lesson01.teach.hour:
    title: hour
    gloss: 小时
    note: '*hour* 的意思是“小时”。'
    example_gloss: 每小时十美元。
  en.a1.unit53.lesson01.teach.size:
    title: size
    gloss: 尺码
    note: '*size* 的意思是“尺码”或“大小”。'
    example_gloss: 你需要多大的？
  en.a1.unit53.lesson01.teach.helmet:
    title: helmet
    gloss: 头盔
    note: '*helmet* 的意思是“头盔”。'
    example_gloss: 你有头盔吗？
  en.a1.unit53.lesson02.teach.id_like_to_rent_a_bike:
    title: I'd like to rent a bike, please.
    gloss: 我想租一辆自行车。
    note: '*I''d like to*（*I would like to* 的缩写）是礼貌地提出请求的说法，比直接说 *I want* 更客气。'
  en.a1.unit53.lesson02.teach.how_much_does_it_cost_per_hour:
    title: How much does it cost per hour?
    gloss: 每小时多少钱？
    note: '*does it cost* 里用了助动词 *does*，因为这里的主要动词是 *cost*，这和其他英语疑问句的构成方式一样。'
  en.a1.unit53.lesson02.teach.i_need_a_small_bike:
    title: I need a small bike.
    gloss: 我需要一辆小号的自行车。
    note: '*need a small bike*：英语在这里直接用动词 *need* 加名词，意思就是“需要一辆小号的自行车”。'
  en.a1.unit53.lesson02.teach.can_i_have_a_helmet:
    title: Can I have a helmet, please?
    gloss: 请给我一个头盔，可以吗？
    note: '*Can I have ...?* 是在商店里礼貌地提出请求的固定说法，字面是“我能拥有……吗”，实际相当于“我可以要……吗？”'
  en.a1.unit53.lesson02.teach.when_do_i_need_to_return_it:
    title: When do I need to return it?
    gloss: 我什么时候需要还车？
    note: '*do I need to* 也是一样，疑问句里要用助动词 *do*。'
  en.a1.unit53.lesson02.teach.its_ten_dollars_an_hour:
    title: It's ten dollars an hour.
    gloss: 每小时十美元。
    note: 这里的 *an hour* 的意思是“每小时”，冠词 *an* 在这里表示“每”，和 *a day*（每天）等说法一样。
  en.a1.unit53.lesson03.teach.dialogue_line1:
    title: 店员打招呼
    gloss: 店员：你好！今天有什么可以帮您？
    note: '*How can I help you today?* 是商店和服务场所里常用的礼貌开场白。'
  en.a1.unit53.lesson03.teach.dialogue_line2:
    title: Mia 的要求
    gloss: Mia：我们想租两辆自行车。我们想沿着河骑车。
    note: '*We''d like to rent* 里的 *rent* 在这里是向店里租，不是租出去。'
  en.a1.unit53.lesson03.teach.dialogue_line3:
    title: 店员询问尺码
    gloss: 店员：好的。你们需要多大尺码的？
    note: '*What size do you need?* 的疑问句里同样用了助动词 *do*。'
  en.a1.unit53.lesson03.teach.dialogue_line4:
    title: Leila 的尺码
    gloss: Leila：我需要小号的。
    note: 这里的 *one* 代替了 *bike*，这样就不用重复。中文里常常直接省略，只说“要小号的”，英语则必须加上 *one* 这个词。
  en.a1.unit53.lesson03.teach.dialogue_line5:
    title: Mia 的尺码
    gloss: Mia：我需要中号的。
    note: 这里同样用 *one* 代替 *bike*，和上一句 Leila 说的一样。
  en.a1.unit53.lesson03.teach.dialogue_line6:
    title: 价格和押金
    gloss: 店员：好的，这是你们的自行车。每小时十美元，押金二十美元。
    note: 这句话里有两个不同的信息（每小时的租金和押金），注意不要弄混。
  en.a1.unit53.lesson03.teach.dialogue_line7:
    title: Mia 询问还车时间
    gloss: Mia：我们什么时候需要还车？
    note: 这里的 *them* 指前面提到的自行车（复数）。
  en.a1.unit53.lesson03.teach.dialogue_line8:
    title: 还车时间
    gloss: 店员：请在五点之前还车。
    note: '*by five o''clock* 的意思是“最迟五点”，也就是不能晚于五点。'
  en.a1.unit53.lesson03.teach.dialogue_line9:
    title: Leila 向店员道谢
    gloss: Leila：太好了，谢谢！
    note: '*Great, thank you!* 是礼貌结束对话的简短固定说法。'
  en.a1.unit53.lesson04.teach.reading_passage:
    title: 阅读：沿河骑行
    gloss: 沿河骑行：一个温暖的下午，Mia 邀请 Leila 一起沿着她公寓附近的河骑自行车。她们俩都没有自行车，于是一起去了一家自行车租赁店。店员问她们需要什么尺码，Leila 选了一辆小号车，Mia 选了一辆中号车。租金是每小时十美元，两辆车的押金一共二十美元。她们必须在五点之前还车。沿河骑行的路上风景优美，她们看到人们在遛狗，享受着晴朗的天气。她们准时还了车，也拿回了押金。后来，她们把这次骑行告诉了 Daniel，他说下次想一起去。
    note: '*owned* 是 *own*（拥有）的过去式，*Neither of them owned a bike* 的意思是“她们俩都没有自行车”。'
