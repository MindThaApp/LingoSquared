teaching:
  en.a1.unit38.lesson01.teach.chore:
    title: chore
    gloss: 家务活
    note: '*chore* 的意思是“家务活”：为了保持家里干净整洁而定期要做的事。'
    example_gloss: 洗碗是我最不喜欢的家务。
  en.a1.unit38.lesson01.teach.dishes:
    title: dishes
    gloss: 餐具 / 碗碟
    note: '*dishes* 的意思是“碗碟，餐具”：需要清洗的盘子、杯子和刀叉。'
    example_gloss: 我晚饭后洗碗。
  en.a1.unit38.lesson01.teach.laundry:
    title: laundry
    gloss: 待洗衣物
    note: '*laundry* 的意思是“要洗的衣物”：需要洗、晾干、叠好的衣服。'
    example_gloss: 她周日洗衣服。
  en.a1.unit38.lesson01.teach.vacuum:
    title: vacuum
    gloss: 用吸尘器打扫
    note: '*vacuum* 的意思是“用吸尘器打扫”。'
    example_gloss: 他每个周六用吸尘器打扫客厅。
  en.a1.unit38.lesson01.teach.trash:
    title: trash
    gloss: 垃圾
    note: '*trash* 的意思是“垃圾”。'
    example_gloss: 你能把垃圾拿出去扔掉吗？
  en.a1.unit38.lesson01.teach.clean:
    title: clean
    gloss: 打扫
    note: '*clean* 的意思是“打扫，清洁”。'
    example_gloss: 我们一起打扫公寓。
  en.a1.unit38.lesson02.teach.wash_the_dishes:
    title: wash the dishes
    gloss: 洗碗
    note: '*wash the dishes* 的字面意思是“清洗碗碟”。*Do the dishes* 同样常用，意思相同（洗碗）。'
    example_gloss: 我每天晚上洗碗。
  en.a1.unit38.lesson02.teach.do_the_laundry:
    title: do the laundry
    gloss: 洗衣服
    note: '*do the laundry* 的意思是“洗衣服”。'
    example_gloss: 她周日洗衣服。
  en.a1.unit38.lesson02.teach.take_out_the_trash:
    title: take out the trash
    gloss: 把垃圾拿出去扔掉
    note: '*take out the trash* 用的是 *take out*，不是 *do*。和 *do the laundry*、*do the dishes* 不同，这里不能用 *do*。'
    example_gloss: 你能把垃圾拿出去扔掉吗？
  en.a1.unit38.lesson02.teach.clean_the_bathroom:
    title: clean the bathroom
    gloss: 打扫浴室
    note: '*clean the bathroom* 的意思是“打扫浴室”。'
    example_gloss: 他周末打扫浴室。
  en.a1.unit38.lesson02.teach.need_to:
    title: need to
    gloss: 需要，必须
    note: '*need to* 的意思是“需要做某事，必须做某事”。'
    example_gloss: 这个周末我得用吸尘器打扫客厅。
  en.a1.unit38.lesson02.teach.can_you_help_me_with_question:
    title: Can you help me with the dishes?
    gloss: 你能帮我洗碗吗？
    note: 这是请别人帮忙做家务时的一种礼貌说法。
  en.a1.unit38.lesson03.teach.dialogue_line1:
    title: Mia's probleem
    gloss: Mia 说：我的公寓乱成一团。这个周末有人要来。
    note: '*a mess* 的意思是“乱七八糟，一团糟”。'
  en.a1.unit38.lesson03.teach.dialogue_line2:
    title: Daniel 的提议
    gloss: Daniel 问：你需要帮忙打扫吗？
    note: '*Do you want some help ...ing?* 是主动提出帮忙的自然说法。'
  en.a1.unit38.lesson03.teach.dialogue_line3:
    title: "Mia 的回答"
    gloss: Mia 说：好的，谢谢！我得用吸尘器打扫客厅，还要洗碗。
    note: '*I need to* + 动词的意思是“我得……”。'
  en.a1.unit38.lesson03.teach.dialogue_line4:
    title: Daniel 的提议
    gloss: Daniel 说：我可以帮你吸尘。你可以洗碗。
    note: 这里的 *for you* 的意思是“替你”，也就是代替你去做。
  en.a1.unit38.lesson03.teach.dialogue_line5:
    title: Mia 的补充
    gloss: Mia 说：谢谢！我还得洗衣服呢。
    note: '*still need to* 的意思是“还得，还需要”。'
  en.a1.unit38.lesson03.teach.dialogue_line6:
    title: Daniel 的提议
    gloss: Daniel 说：我今天没时间做那个，不过我走之前可以把垃圾拿出去扔掉。
    note: '*before I leave* 的意思是“在我离开之前”。'
  en.a1.unit38.lesson03.teach.dialogue_line7:
    title: Mia 的感谢
    gloss: Mia 说：那帮了大忙了。非常感谢！
    note: '*That would help a lot* 的意思是“那会帮上大忙”。这里的 *would* 让语气更委婉礼貌。'
  en.a1.unit38.lesson04.teach.reading_passage:
    title: 关于家里家务的短文
    gloss: Daniel、Leila 和 Mia 对做家务各有各的习惯。Daniel 每天晚饭后洗碗，周六用吸尘器打扫公寓。Leila 不介意洗衣服，但她很讨厌打扫浴室。Mia 的猫 Luna 到处掉毛，所以 Mia 几乎每天都用吸尘器打扫公寓。上个周末，Mia 有客人要来，Daniel 就主动提出帮忙。他用吸尘器打扫了客厅，还替她把垃圾拿出去扔了。Mia 非常感谢他的帮助。
    note: '*doesn''t mind* 的意思是“不介意”。'
