teaching:
  en.a1.unit57.lesson01.teach.cinema:
    title: cinema
    gloss: 电影院
    note: '*cinema* 的意思是“电影院”。'
    example_gloss: 这家电影院非常受欢迎。
  en.a1.unit57.lesson01.teach.ticket:
    title: ticket
    gloss: 票
    note: '*ticket* 的意思是“票”。'
    example_gloss: 我得买一张票。
  en.a1.unit57.lesson01.teach.showtime:
    title: showtime
    gloss: 开场时间（电影）
    note: '*showtime* 的意思是“开场时间”，也就是电影开始放映的时刻。'
    example_gloss: 这场电影几点开始？
  en.a1.unit57.lesson01.teach.seat:
    title: seat
    gloss: 座位
    note: '*seat* 的意思是“座位”。'
    example_gloss: 这个座位有人吗？
  en.a1.unit57.lesson01.teach.screen:
    title: screen
    gloss: 屏幕
    note: '*screen* 的意思是“屏幕”。'
    example_gloss: 屏幕非常大。
  en.a1.unit57.lesson01.teach.popcorn:
    title: popcorn
    gloss: 爆米花
    note: '*popcorn* 的意思是“爆米花”。'
    example_gloss: 我们在电影院总是买爆米花。
  en.a1.unit57.lesson02.teach.what_time_does_the_film_start:
    title: What time does the film start?
    gloss: 电影几点开始？
    note: '*does the film start* 用助动词 *does* 构成疑问句，因为句中的主要动词是 *start*。'
  en.a1.unit57.lesson02.teach.two_tickets_for_the_seven_oclock_show:
    title: Two tickets for the seven o'clock show, please.
    gloss: 请给我两张七点那场的票。
    note: '*for the seven o''clock show* 说明这些票是哪一场的。'
  en.a1.unit57.lesson02.teach.can_i_have_some_popcorn:
    title: Can I have some popcorn, please?
    gloss: 请给我一些爆米花，可以吗？
    note: '*Can I have...?* 是直接而常用的点东西的说法。'
  en.a1.unit57.lesson02.teach.how_much_is_that_in_total:
    title: How much is that in total?
    gloss: 一共多少钱？
    note: '*in total* 的意思是“总共”，用来询问最后的总价。'
  en.a1.unit57.lesson02.teach.thats_twenty_dollars:
    title: That's twenty dollars, please.
    gloss: 一共二十美元。
    note: '*That''s* 加价钱，是报金额的固定说法。'
  en.a1.unit57.lesson02.teach.i_really_liked_it:
    title: I really liked it!
    gloss: 我真的很喜欢！
    note: 英语这里用动词 *like* 加宾语 *it*，*liked* 是 *like* 的过去式。中文常常省略“它”，直接说“我真的很喜欢”，而英语的 *it* 一般不能省。请把这句话当作整体来记，不要逐字对应。
  en.a1.unit57.lesson03.teach.dialogue_line1:
    title: Daniel 询问开场时间
    gloss: Daniel 说：嗨！电影几点开始？
    note: '*does the film start* 用助动词构成疑问句。'
  en.a1.unit57.lesson03.teach.dialogue_line2:
    title: 开场时间
    gloss: 售票员说：下一场是七点。
    note: '*at seven o''clock* 在具体钟点前用介词 *at*。中文说“七点”时不需要介词，英语则必须加 *at*。'
  en.a1.unit57.lesson03.teach.dialogue_line3:
    title: Daniel 买票
    gloss: Daniel 说：太好了。我们要两张票，可以吗？
    note: 这里只有一个独立的信息：票的数量（两张）。
  en.a1.unit57.lesson03.teach.dialogue_line4:
    title: 票价
    gloss: 售票员说：当然可以。一共十六美元。
    note: 这里只有一个独立的信息：两张票合在一起的价钱。
  en.a1.unit57.lesson03.teach.dialogue_line5:
    title: Leila 点爆米花
    gloss: Leila 说：我们要一些爆米花，可以吗？
    note: 这是一个请求，不是新的价格信息。
  en.a1.unit57.lesson03.teach.dialogue_line6:
    title: 爆米花的价格
    gloss: 售票员说：好的。爆米花四美元。
    note: 这是第二个独立的信息：爆米花的价格，与票价分开。
  en.a1.unit57.lesson03.teach.dialogue_line7:
    title: Daniel 询问总价
    gloss: Daniel 说：一共多少钱？
    note: '*in total* 问的是所有价格加起来的总和。'
  en.a1.unit57.lesson03.teach.dialogue_line8:
    title: 总金额
    gloss: 售票员说：一共二十美元。
    note: 这是第三个独立的信息：总金额，不同于票和爆米花各自的价格。
  en.a1.unit57.lesson03.teach.dialogue_line9:
    title: Leila 迫不及待
    gloss: Leila 说：谢谢！我迫不及待想看这部电影了。
    note: '*I can''t wait to...* 是表达期待和兴奋的固定说法。'
  en.a1.unit57.lesson04.teach.cinema_schedule:
    title: 电影院排片表
    gloss: 电影院排片表：Star Journey - 7:00，$8。The Great Race - 5:00，$10。Funny Family - 9:00，$6。
    note: 排片表列出了三部电影的开场时间和票价。
  en.a1.unit57.lesson04.teach.reading_passage:
    title: 短文：电影院里的一个晚上
    gloss: 一天晚上，Daniel 和 Leila 决定一起去电影院看电影。他们问电影几点开始，售票员说下一场 Star Journey 是七点。他们买了两张票，花了十六美元，还买了一袋爆米花，花了四美元。一共是二十美元。他们一起看了电影，电影讲的是太空探险家的故事。电影非常有趣。电影结束后，Leila 说她真的很喜欢这部电影，Daniel 说他也想看下一部。
    note: '*watched* 是 *watch*（观看）的过去式。'
