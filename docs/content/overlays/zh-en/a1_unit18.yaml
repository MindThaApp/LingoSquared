teaching:
  en.a1.unit18.lesson01.teach.went:
    title: went
    gloss: 去了
    note: '*went* 是 *go* 的不规则过去式。英语用动词的形式变化表示过去；汉语通常用“了”或时间词来表示。'
    example_gloss: 我昨天去了公园。
  en.a1.unit18.lesson01.teach.saw:
    title: saw
    gloss: 看见了
    note: '*saw* 是 *see* 的不规则过去式。'
    example_gloss: 我昨天看见了我的朋友。
  en.a1.unit18.lesson01.teach.ate:
    title: ate
    gloss: 吃了
    note: '*ate* 是 *eat* 的不规则过去式。'
    example_gloss: 我今天早上吃了早饭。
  en.a1.unit18.lesson01.teach.visited:
    title: visited
    gloss: 拜访了
    note: '*visited* 是 *visit* 的规则过去式（加 *-ed*）。'
    example_gloss: 我上周拜访了我的父母。
  en.a1.unit18.lesson01.teach.worked:
    title: worked
    gloss: 工作了
    note: '*worked* 是 *work* 的规则过去式（加 *-ed*）。'
    example_gloss: 我昨天上班了。
  en.a1.unit18.lesson02.teach.what_did_you_do:
    title: What did you do yesterday?
    gloss: 你昨天做了什么？
    note: '*What did you do...?* 用来询问过去发生的事。'
  en.a1.unit18.lesson02.teach.i_worked:
    title: I worked in the morning.
    gloss: 我早上工作了。
    note: 这个回答既说了做的事，也说了时间。
  en.a1.unit18.lesson02.teach.last_week:
    title: I saw a movie last week.
    gloss: 我上周看了一部电影。
    note: '*last week* 的意思是“上周”。'
  en.a1.unit18.lesson03.teach.together:
    title: together
    gloss: 一起
    note: '*together* 的意思是“一起”。'
    example_gloss: 我们一起看了一部电影。
  en.a1.unit18.lesson03.teach.event_text:
    title: 关于一件事的短文
    gloss: 昨天我拜访了我的父母。我们一起吃了晚饭，还看了一部电影。
    note: 这是对一件最近发生的事的简短描述。
  en.a1.unit18.lesson03.teach.the_writers_parents:
    title: the writer's parents
    gloss: 作者的父母
    note: '*writer''s* 的意思是“作者的”，*''s* 表示所属关系。'
  en.a1.unit18.lesson04.teach.it_was_great:
    title: It was great.
    gloss: 真棒。
    note: '*It was great* 表示某次经历非常好。'
  en.a1.unit18.lesson04.teach.q_last_weekend:
    title: 询问上个周末
    gloss: Leila 问 Daniel 上个周末做了什么。
    note: '*last weekend* 的意思是“上个周末”。'
  en.a1.unit18.lesson04.teach.a_visited_parents:
    title: Daniel 的回答
    gloss: Daniel 说：我拜访了我的父母。
    note: 这个回答说出了一件简单的过去的事。
  en.a1.unit18.lesson04.teach.q_good_time:
    title: 询问玩得开不开心
    gloss: Leila 问：玩得开心吗？
    note: '*Did you have a good time?* 用来问别人过得是否愉快。'
  en.a1.unit18.lesson04.teach.a_yes_great:
    title: Daniel 的完整回答
    gloss: Daniel 说：是的，我们一起吃了晚饭，还看了一部电影。真棒。
    note: Daniel 先说了他们一起做了什么，再说了自己的感受。
  en.a1.unit18.lesson04.teach.his_parents:
    title: his parents
    gloss: 他的父母
    note: '*his* 是 *he* 对应的物主代词，意思是“他的”，如 *his parents*（他的父母）。'
