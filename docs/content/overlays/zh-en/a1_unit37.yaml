    example_gloss: 我给她买了一份很不错的礼物。
  en.a1.unit37.lesson01.teach.invite:
    title: invite
    gloss: 邀请
    note: '*invite* 的意思是“邀请”。'
    example_gloss: 我想邀请我的朋友。
  en.a1.unit37.lesson01.teach.celebrate:
    title: celebrate
    gloss: 庆祝
    note: '*celebrate* 的意思是“庆祝”。'
    example_gloss: 我们一起庆祝吧！
  en.a1.unit37.lesson01.teach.congratulations:
    title: congratulations
    gloss: 恭喜 / 祝贺
    note: '*congratulations* 的意思是“恭喜，祝贺”。当别人有喜事时，用它来表示祝贺。'
    example_gloss: 恭喜你找到新工作！
  en.a1.unit37.lesson02.teach.invite_someone_to:
    title: invite someone to
    gloss: 邀请某人参加
    note: '*invite someone to* 的意思是“邀请某人参加某事”。'
    example_gloss: 我邀请同事参加我的生日派对。
  en.a1.unit37.lesson02.teach.congratulate_someone_on:
    title: congratulate someone on
    gloss: 祝贺某人（某事）
    note: '*congratulate someone* 后面要接介词 *on*，用来引出祝贺的事情：*congratulate someone on ...*。汉语说“祝贺他升职”，不需要介词，英语里这个 *on* 必须记住。'
    example_gloss: 我们祝贺他升职。
  en.a1.unit37.lesson02.teach.wish_someone_happy_birthday:
    title: wish someone a happy birthday
    gloss: 祝某人生日快乐
    note: '*wish someone a happy birthday* 的意思是“祝某人生日快乐”。'
    example_gloss: 我想祝你生日快乐。
