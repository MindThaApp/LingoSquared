    note: '*have a party* 的意思是“办派对，开聚会”。'
    example_gloss: 我们每年十月都办一个派对。
  en.a1.unit37.lesson02.teach.come_to_my_party_question:
    title: Do you want to come to my party?
    gloss: 你想来参加我的派对吗？
    note: 这是一种友好、随意的邀请方式。
  en.a1.unit37.lesson03.teach.dialogue_line1:
    title: Leila 的问题
    gloss: Leila 问：你知道 Daniel 的生日是 10 月 12 日吗？
    note: '*Did you know ...?* 是用来引出新信息、开启话题的自然说法。'
  en.a1.unit37.lesson03.teach.dialogue_line2:
    title: Mia 的回应
    gloss: Mia 说：不知道！那就是下周五。
    note: '*No, I didn''t!* 是对 *Did you know ...?* 的简短否定回答，意思是“不，我不知道。”'
  en.a1.unit37.lesson03.teach.dialogue_line3:
    title: Leila 的提议
    gloss: Leila 说：我们在办公室给他办一个惊喜派对吧。
    note: '*Let''s* + 动词用来提出建议，相当于汉语的“我们……吧”。'
  en.a1.unit37.lesson03.teach.dialogue_line4:
    title: Mia 的回应
    gloss: Mia 说：好主意！我可以邀请团队里的其他人。
    note: '*the rest of the team* 的意思是“团队里的其他人”。'
  en.a1.unit37.lesson03.teach.dialogue_line5:
    title: Leila 的计划
    gloss: Leila 说：太好了。我给他买份礼物，也许是一双新跑鞋，因为他很爱跑步。
    note: 这里的 *since* 表示“因为”（原因），不是“自从”（时间）。
  en.a1.unit37.lesson03.teach.dialogue_line6:
    title: Mia 的提议
    gloss: Mia 说：这个主意不错。我们要不要也买个蛋糕？
    note: '*Should we ...?* 用来和别人一起商量做决定。'
  en.a1.unit37.lesson03.teach.dialogue_line7:
    title: "Leila 的回答"
    gloss: Leila 说：要，当然！我们大家一起祝他生日快乐。
    note: '*We''ll all wish him a happy birthday* 的意思是：我们大家都会祝他生日快乐。'
  en.a1.unit37.lesson04.teach.reading_passage:
    title: 关于惊喜派对的短文
    gloss: Daniel 不知道 Leila 和 Mia 正在为他策划一个惊喜派对。10 月 12 日是他的生日，他到公司后，在休息室里发现了气球和一个蛋糕。大家都对他说“生日快乐！”Leila 送给他一双新跑鞋。Mia 送给他一张镶了相框的照片，上面是三位同事的合影，是她自己拍的。Daniel 非常开心，感谢大家给了他这么棒的惊喜。
    note: '*he arrived at work and found*：*arrive* 和 *find* 的过去式（他到公司后发现了……）。'
