teaching:
  en.a1.unit40.lesson01.teach.post_office:
    title: post office
    gloss: 邮局
    note: '*post office* 的意思是“邮局”。'
    example_gloss: 我去邮局寄信。
  en.a1.unit40.lesson01.teach.letter:
    title: letter
    gloss: 信
    note: '*letter* 的意思是“信”。'
    example_gloss: 我给朋友写了一封信。
  en.a1.unit40.lesson01.teach.package:
    title: package
    gloss: 包裹
    note: '*package* 的意思是“包裹”。'
    example_gloss: 我给姐姐寄了一个包裹。
  en.a1.unit40.lesson01.teach.stamp:
    title: stamp
    gloss: 邮票
    note: '*stamp* 的意思是“邮票”。'
    example_gloss: 这封信我需要一张邮票。
  en.a1.unit40.lesson01.teach.envelope:
    title: envelope
    gloss: 信封
    note: '*envelope* 的意思是“信封”。'
    example_gloss: 我把信放进信封里。
  en.a1.unit40.lesson01.teach.mailbox:
    title: mailbox
    gloss: 邮筒
    note: '*mailbox* 的意思是“邮筒、信箱”。'
    example_gloss: 邮筒在邮局旁边。
  en.a1.unit40.lesson02.teach.send_a_letter:
    title: send a letter
    gloss: 寄一封信
    note: '*send a letter* 的意思是“寄一封信”。'
    example_gloss: 我想给父母寄一封信。
  en.a1.unit40.lesson02.teach.buy_a_stamp:
    title: buy a stamp
    gloss: 买一张邮票
    note: '*buy a stamp* 的意思是“买一张邮票”。'
    example_gloss: 我得给这张明信片买一张邮票。
  en.a1.unit40.lesson02.teach.write_the_address:
    title: write the address
    gloss: 写地址
    note: '*write the address* 的意思是“写地址”。'
    example_gloss: 请把地址写在包裹上。
  en.a1.unit40.lesson02.teach.how_long_will_it_take:
    title: how long will it take
    gloss: 需要多长时间
    note: '*how long will it take* 的意思是“需要多长时间”。'
    example_gloss: 寄到要多长时间？
  en.a1.unit40.lesson02.teach.express_mail:
    title: express mail
    gloss: 快递；特快专递
    note: '*express mail* 的意思是“快递、特快专递”，速度更快，价格也更贵。'
    example_gloss: 快递比普通邮件快。
  en.a1.unit40.lesson02.teach.how_much_does_it_cost_question:
    title: How much does it cost to send this?
    gloss: 寄这个要多少钱？
    note: '*How much does it cost to ...?* 用来询问做某件事要花多少钱。'
  en.a1.unit40.lesson03.teach.dialogue_line1:
    title: Daniel 的请求
    gloss: Daniel：你好，我想寄这个包裹。
    note: '*I''d like to* 加动词是一种礼貌的请求方式，比 *I want* 礼貌得多；在柜台前说 *I want* 会显得很生硬。'
  en.a1.unit40.lesson03.teach.dialogue_line2:
    title: 工作人员的询问
    gloss: 工作人员：好的！寄到哪里？
    note: '*Where is it going?* 询问的是目的地。'
  en.a1.unit40.lesson03.teach.dialogue_line3:
    title: "Daniel 的回答"
    gloss: Daniel：寄到芝加哥。这是给我姐姐的生日礼物。
    note: '*It''s a birthday gift for my sister* 的意思是“这是给我姐姐的生日礼物”。'
  en.a1.unit40.lesson03.teach.dialogue_line4:
    title: 工作人员的询问
    gloss: 工作人员：您要普通邮件还是快递？快递大约需要两天。
    note: '*regular or express mail* 的意思是“普通邮件还是快递”。'
  en.a1.unit40.lesson03.teach.dialogue_line5:
    title: Daniel 的选择
    gloss: Daniel：我选快递。多少钱？
    note: '*I''ll take ...* 是在接受服务时做出选择的一种自然说法。'
  en.a1.unit40.lesson03.teach.dialogue_line6:
    title: 工作人员的回答
    gloss: 工作人员：十二美元。这是您的收据。
    note: '*Here''s your receipt* 的意思是“这是您的收据”。'
  en.a1.unit40.lesson03.teach.dialogue_line7:
    title: Daniel 的道谢
    gloss: Daniel：谢谢！祝您有愉快的一天。
    note: '*Have a good day* 是一种礼貌的告别用语。'
  en.a1.unit40.lesson04.teach.reading_passage:
    title: 关于三次去邮局的短文
    gloss: Daniel、Leila 和 Mia 都很熟悉邮局。上周，Daniel 给住在芝加哥的姐姐寄了一个生日包裹。他选了快递，因为他希望包裹能尽快寄到，结果只用了两天。Leila 准备搬到 Mia 附近，所以她去邮局给父母寄一些旧书。工作人员称了包裹的重量，并给了她一张邮票。Leila 问包裹要多久才能寄到，工作人员说大约一周，因为她选的是普通邮件。Mia 不常寄包裹，但她给奶奶写信时总会买一张邮票。她说，贴着邮票的信比短信更有人情味。
    note: '*getting ready to move* 的意思是“准备搬家”。'
