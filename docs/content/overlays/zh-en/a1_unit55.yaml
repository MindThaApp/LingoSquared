    gloss: 游泳池
    note: '*swimming pool* 的意思是“游泳池”。'
    example_gloss: 游泳池每天早上开门。
  en.a1.unit55.lesson01.teach.ticket:
    title: ticket
    gloss: 票 / 门票
    note: '*ticket* 的意思是“票”或“门票”。'
    example_gloss: 进游泳池需要买票。
  en.a1.unit55.lesson01.teach.locker:
    title: locker
    gloss: 储物柜
    note: '*locker* 的意思是“储物柜”。'
    example_gloss: 把你的包放进储物柜里。
  en.a1.unit55.lesson01.teach.swim_cap:
    title: swim cap
    gloss: 泳帽
    note: '*swim cap* 的意思是“泳帽”。'
    example_gloss: 请在游泳池里戴泳帽。
  en.a1.unit55.lesson01.teach.rules:
    title: rules
    gloss: 规定
    note: '*rules* 的意思是“规定”或“规则”。'
    example_gloss: 游泳前请先阅读泳池规定。
  en.a1.unit55.lesson01.teach.lifeguard:
    title: lifeguard
    gloss: 救生员
    note: '*lifeguard* 的意思是“救生员”，也就是照看游泳者安全的人。'
    example_gloss: 救生员每天都看护着游泳池。
  en.a1.unit55.lesson02.teach.id_like_to_buy_a_ticket:
    title: I'd like to buy a ticket, please.
    gloss: 请给我买一张票。
    note: '*I''d like to* 是 *I would like to* 的缩写，是礼貌地提出请求的说法。'
  en.a1.unit55.lesson02.teach.where_are_the_lockers:
    title: Where are the lockers?
    gloss: 储物柜在哪里？
    note: '*Where are...?* 把动词放在主语前面，这是英语疑问句常见的语序。'
  en.a1.unit55.lesson02.teach.what_time_do_you_open:
    title: What time do you open?
    gloss: 你们几点开门？
    note: '*do you open* 在疑问句里要用助动词 *do*。'
  en.a1.unit55.lesson02.teach.its_five_dollars_for_one_ticket:
    title: It's five dollars for one ticket.
    gloss: 一张票五美元。
    note: '*for one ticket* 的意思是“每张票”。'
  en.a1.unit55.lesson02.teach.do_i_need_a_swim_cap:
    title: Do I need a swim cap?
    gloss: 我需要戴泳帽吗？
    note: '*Do I need...?* 在疑问句里要用助动词 *do*。'
  en.a1.unit55.lesson02.teach.we_close_at_eight:
    title: We close at eight o'clock.
    gloss: 我们八点关门。
    note: '*at eight o''clock* 的意思是“在八点”，英语用 *at* 表示具体的钟点，中文则直接说“八点”。'
  en.a1.unit55.lesson03.teach.dialogue_line1:
    title: 救生员打招呼
    gloss: 救生员：你好！你们今天是来游泳的吗？
    note: '*Are you here to swim today?* 里的 *to swim* 表示目的，意思是“来游泳”。'
  en.a1.unit55.lesson03.teach.dialogue_line2:
    title: Daniel 买票
    gloss: Daniel：是的，请给我两张票。
    note: 这是一个简短、直接的请求：要两张票。
  en.a1.unit55.lesson03.teach.dialogue_line3:
    title: 价格
    gloss: 救生员：好的！一张票五美元。
    note: 这是一条单独的信息：每张票的价格。
  en.a1.unit55.lesson03.teach.dialogue_line4:
    title: Mia 问泳帽
    gloss: Mia：我们需要戴泳帽吗？
    note: '*Do we need...?* 同样在疑问句里使用了助动词 *do*。'
  en.a1.unit55.lesson03.teach.dialogue_line5:
    title: 泳帽规定
    gloss: 救生员：需要，泳池里必须戴泳帽。
    note: '*swim caps are required* 是被动句，是一种正式的说法，常见于泳池的告示牌和工作人员的口中。中文里常说“必须戴泳帽”或“泳帽是必需的”。'
  en.a1.unit55.lesson03.teach.dialogue_line6:
    title: Daniel 问储物柜
    gloss: Daniel：储物柜在哪里？
    note: 这是一个简短的问题，不涉及价格或时间等新信息。
  en.a1.unit55.lesson03.teach.dialogue_line7:
    title: 储物柜的位置
    gloss: 救生员：储物柜在入口附近。
    note: 这是一条单独的信息：储物柜的位置，和储物柜需要什么无关。
  en.a1.unit55.lesson03.teach.dialogue_line8:
    title: 储物柜需要什么
    gloss: 救生员：用储物柜需要一枚一美元硬币。
    note: '*a dollar coin* 由两个英语单词（*dollar* 和 *coin*）组成，要分开写，意思是“一美元硬币”。'
  en.a1.unit55.lesson03.teach.dialogue_line9:
    title: Mia 问关门时间
    gloss: Mia：你们几点关门？
    note: '*What time do you close?* 在疑问句里要用助动词 *do*。'
  en.a1.unit55.lesson03.teach.dialogue_line10:
    title: 关门时间
    gloss: 救生员：我们八点关门。
    note: 这是第四条单独的信息：关门时间。
  en.a1.unit55.lesson04.teach.reading_passage:
    title: 阅读：去游泳池玩一天
    gloss: 去游泳池玩一天：七月的一个炎热的下午，Daniel 和 Mia 决定去社区游泳池消暑。入口附近有一块告示牌，列出了泳池规定：禁止奔跑，泳池里必须戴泳帽。他们向救生员买了两张票，一张票五美元。救生员说明储物柜在入口附近，要用一枚一美元硬币。Daniel 和 Mia 把包放进储物柜，游了将近两个小时。离开之前，他们又看了一遍告示牌：游泳池八点关门。Mia 说她下个周末还想再来，试试跳板。
    note: '*required* 是被动形式，*swim caps are required* 的意思是“必须戴泳帽”。'
