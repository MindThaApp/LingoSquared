teaching:
  en.a1.unit31.lesson01.teach.tall:
    title: tall
    gloss: 高
    note: '*tall* 的意思是高（指人的身高）。'
    example_gloss: 我哥哥很高。
  en.a1.unit31.lesson01.teach.short:
    title: short
    gloss: 矮
    note: '*short* 在这里的意思是矮（指人的身高）；*short* 也表示“短”，例如形容头发。'
    example_gloss: 我姐姐很矮。
  en.a1.unit31.lesson01.teach.hair:
    title: hair
    gloss: 头发
    note: '*hair* 的意思是头发。在英语里它是不可数名词：说 *her hair is long*，不能说 *her hairs are long*。'
    example_gloss: 她留着长发。
  en.a1.unit31.lesson01.teach.blond:
    title: blond
    gloss: 金色的
    note: '*blond* 的意思是金色的（指头发）。'
    example_gloss: 他的头发是金色的。
  en.a1.unit31.lesson01.teach.curly:
    title: curly
    gloss: 卷曲的
    note: '*curly* 的意思是卷曲的。'
    example_gloss: Leila有一头卷发。
  en.a1.unit31.lesson02.teach.eyes:
    title: eyes
    gloss: 眼睛
    note: '*eyes* 的意思是眼睛（复数）。'
    example_gloss: 我有棕色的眼睛。
  en.a1.unit31.lesson02.teach.blue:
    title: blue
    gloss: 蓝色
    note: '*blue* 的意思是蓝色。'
    example_gloss: 她的眼睛是蓝色的。
  en.a1.unit31.lesson02.teach.brown:
    title: brown
    gloss: 棕色
    note: '*brown* 的意思是棕色。'
    example_gloss: 我的眼睛是棕色的。
  en.a1.unit31.lesson02.teach.green:
    title: green
    gloss: 绿色
    note: '*green* 的意思是绿色。'
    example_gloss: 他有绿色的眼睛。
  en.a1.unit31.lesson02.teach.glasses:
    title: glasses
    gloss: 眼镜
    note: '*glasses* 的意思是眼镜。这个词总是用复数；*wears glasses* 的意思是“戴眼镜”。'
    example_gloss: 我爸爸戴眼镜。
  en.a1.unit31.lesson02.teach.what_look_like:
    title: What does she look like?
    gloss: 她长什么样？
    note: 注意句子结构：汉语问“她长什么样”不需要助动词，但英语里，普通动词（*look*）构成的问句必须用 *does* 或 *do*：说 *What does she look like?*，不能说 *What looks she like?*。中国学习者很容易漏掉助动词 *does*。
  en.a1.unit31.lesson03.teach.dialogue_line1:
    title: Leila的开场白
    gloss: Leila说：今天我们有一位新同事。她叫Mia。
    note: '*starting today* 的意思是“从今天开始”。'
  en.a1.unit31.lesson03.teach.dialogue_line2:
    title: Daniel的提问
    gloss: Daniel问：她长什么样？
    note: 再强调一次助动词：不要漏掉 *does*，也不能像汉语那样直接说“她长什么样”而省略它。
  en.a1.unit31.lesson03.teach.dialogue_line3:
    title: Leila的描述
    gloss: Leila说：她个子高，有一头金色的卷发。
    note: '*She''s* 是 *she is* 的缩写。'
  en.a1.unit31.lesson03.teach.dialogue_line4:
    title: Daniel的追问
    gloss: Daniel问：她戴眼镜吗？
    note: 这里也需要助动词：说 *Does she wear glasses?*，不能说 *Wears she glasses?*。
  en.a1.unit31.lesson03.teach.dialogue_line5:
    title: Leila的回答
    gloss: Leila说：戴。她的眼睛也是绿色的。
    note: '*Yes, she does* 是简短的肯定回答，要重复助动词 *does*。'
  en.a1.unit31.lesson03.teach.dialogue_line6:
    title: Daniel最后的话
    gloss: Daniel说：好的，我想我现在看到她了，她在门口。
    note: '*at the door* 的意思是在门口。'
  en.a1.unit31.lesson04.teach.reading_passage:
    title: 关于Daniel和Leila的短文
    gloss: Daniel和Leila是好朋友，但是他们长得不一样。Daniel个子高，留着黑色的短发。他戴眼镜。Leila个子矮，留着棕色的长卷发。她有蓝色的眼睛，而Daniel有棕色的眼睛。他们俩都很爱笑。
    note: '*don''t look the same* 的意思是“长得不一样”。这里也需要助动词（*don''t* = *do not*），否定句里同样如此。'
