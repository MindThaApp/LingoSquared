    gloss: 房间里有无线网络吗？
    note: '*Does the room have wifi?* 的意思是“房间里有无线网络吗？”'
  en.a1.unit50.lesson02.teach.what_time_is_check_out:
    title: What time is check-out?
    gloss: 几点退房？
    note: '*What time is check-out?* 的意思是“几点退房？”'
  en.a1.unit50.lesson02.teach.breakfast_is_included:
    title: Breakfast is included.
    gloss: 含早餐。
