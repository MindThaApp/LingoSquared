  en.a1.unit50.lesson02.teach.heres_your_key:
    title: Here's your key.
    gloss: 这是您的钥匙。
    note: '*Here''s* 是 here is 的缩写。'
  en.a1.unit50.lesson03.teach.dialogue_line1:
    title: Mia 在前台
    gloss: Mia 说：你好，我们预订了两晚。
    note: '*we have a reservation* 的意思是“我们有预订”。'
  en.a1.unit50.lesson03.teach.dialogue_line2:
    title: 前台接待员欢迎他们
    gloss: 前台接待员说：欢迎！预订登记在哪位的名下？
    note: '*What''s the name on the reservation?* 的意思是“预订登记的是谁的名字？”'
  en.a1.unit50.lesson03.teach.dialogue_line3:
    title: "Leila 的回答"
    gloss: Leila 说：登记在我的名下，叫 Leila。
    note: '*it''s under my name* 字面意思是“在我的名字之下”，相当于中文的“登记在我名下”。'
  en.a1.unit50.lesson03.teach.dialogue_line4:
    title: 前台接待员递上钥匙
    gloss: 前台接待员说：好的。这是您的钥匙。您的房间有两张床。
    note: '*Your room has two beds.* 的意思是“您的房间有两张床。”'
  en.a1.unit50.lesson03.teach.dialogue_line5:
    title: Mia 询问无线网络
    gloss: Mia 问：房间里有无线网络吗？
    note: 这是在重复前面学过的问句。
  en.a1.unit50.lesson03.teach.dialogue_line6:
    title: 前台接待员介绍早餐
    gloss: 前台接待员说：有，而且早餐在楼下，供应时间是七点到十点。
    note: '*from seven to ten* 的意思是“从七点到十点”。'
  en.a1.unit50.lesson03.teach.dialogue_line7:
    title: Leila 询问退房时间
    gloss: Leila 说：谢谢！几点退房？
    note: 这是在重复前面学过的问句 *What time is check-out?*
  en.a1.unit50.lesson03.teach.dialogue_line8:
    title: 前台接待员介绍退房时间
    gloss: 前台接待员说：十一点退房。
    note: '*Check-out is at eleven o''clock.* 的意思是“十一点退房。”'
  en.a1.unit50.lesson04.teach.reading_passage:
    title: 关于民宿周末的短文
    gloss: 民宿里的周末：Mia 和 Leila 利用周末去山里做了一次短途旅行。Mia 喜欢拍照，Leila 喜欢画画，所以那里是放松的绝佳地点。她们到民宿后，告诉前台接待员她们预订了两晚，从 11 月 14 日到 11 月 16 日。接待员问预订登记的是谁的名字，Leila 说登记在她的名下。她们的房间有两张床和无线网络，每天早上七点到十点供应早餐。退房时间是十一点。Mia 拍了许多山的照片，Leila 画了一幅小画，画的是从窗口看到的景色。那个周末 Daniel 留在家里，照着他从图书馆借来的食谱，给自己做了晚饭。Mia 和 Leila 回来后，把照片和画给他看，他非常喜欢。
    note: '*Their room had two beds and wifi* 的意思是“她们的房间有两张床和无线网络”。'
