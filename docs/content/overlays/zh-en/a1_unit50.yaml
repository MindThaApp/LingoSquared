  en.a1.unit50.lesson02.teach.do_you_have_a_reservation:
    title: Do you have a reservation?
    gloss: 你有预订吗？
    note: '*Do you have a reservation?* 的意思是“你有预订吗？”'
  en.a1.unit50.lesson02.teach.i_have_a_reservation_for_two_nights:
    title: I have a reservation for two nights.
    gloss: 我预订了两晚。
    note: '*for two nights* 用 *for* 来表示时间的长短，中文则直接说“两晚”。'
