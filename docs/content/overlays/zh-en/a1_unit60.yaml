teaching:
  en.a1.unit60.lesson01.teach.invitation:
    title: invitation
    gloss: 邀请
    note: '*invitation* 的意思是“邀请”。'
    example_gloss: 谢谢你的邀请。
  en.a1.unit60.lesson01.teach.party:
    title: party
    gloss: 聚会
    note: '*party* 的意思是“聚会”。'
    example_gloss: 聚会在星期六。
  en.a1.unit60.lesson01.teach.dinner:
    title: dinner
    gloss: 晚餐
    note: '*dinner* 的意思是“晚餐”或“饭局”。'
    example_gloss: 来吃晚饭吧。
  en.a1.unit60.lesson01.teach.picnic:
    title: picnic
    gloss: 野餐
    note: '*picnic* 的意思是“野餐”。'
    example_gloss: 我们可以去野餐。
  en.a1.unit60.lesson01.teach.bring:
    title: bring
    gloss: 带来
    note: '*bring* 的意思是把东西带到你要去的地方。'
    example_gloss: 请带一份饮料来。
  en.a1.unit60.lesson01.teach.free:
    title: free
    gloss: 有空
    note: '*free* 在这里的意思是“有空”，不是“免费”。'
    example_gloss: 你有空吗？
  en.a1.unit60.lesson02.teach.are_you_free:
    title: Are you free on Saturday?
    gloss: 你星期六有空吗？
    note: '*on Saturday* 在星期几前面用介词 *on*。中文说“星期六”时不需要介词，英语则要加 *on*。'
  en.a1.unit60.lesson02.teach.would_you_like_dinner:
    title: Would you like to come to dinner?
    gloss: 你愿意来吃晚饭吗？
    note: '*Would you like to...?* 是礼貌地邀请别人的说法。'
  en.a1.unit60.lesson02.teach.bring_a_drink:
    title: Please bring a drink.
    gloss: 请带一份饮料来。
    note: '*bring* 在这里指把东西带到聚会上。'
  en.a1.unit60.lesson02.teach.i_can_come:
    title: I can come.
    gloss: 我可以来。
    note: 这句话简短明确地接受了邀请。
  en.a1.unit60.lesson02.teach.cant_come:
    title: Sorry, I can't come.
    gloss: 抱歉，我来不了。
    note: '*can''t* 是 *cannot* 的缩写。'
  en.a1.unit60.lesson02.teach.see_you_at_six:
    title: See you at six.
    gloss: 六点见。
    note: '*at six* 在钟点前用介词 *at*。中文说“六点见”时不需要介词，英语则必须加 *at*。'
  en.a1.unit60.lesson03.teach.dialogue_line1:
    title: Leila 问 Daniel 有没有空
    gloss: Leila 说：嗨，Daniel！你星期六有空吗？
    note: '*Are you free...?* 问的是对方有没有空。'
  en.a1.unit60.lesson03.teach.dialogue_line2:
    title: Daniel 有空
    gloss: Daniel 说：有，我有空。
    note: '*I am free* 的意思是“我有空”。'
  en.a1.unit60.lesson03.teach.dialogue_line3:
    title: Leila 邀请 Daniel
    gloss: Leila 说：你愿意来吃晚饭吗？
    note: '*Would you like to come...?* 礼貌而友好。'
  en.a1.unit60.lesson03.teach.dialogue_line4:
    title: Daniel 接受邀请
    gloss: Daniel 说：好啊，我很乐意。
    note: '*I''d love to* 是一种热情的答应方式。'
  en.a1.unit60.lesson03.teach.dialogue_line5:
    title: Leila 请 Daniel 带饮料
    gloss: Leila 说：请带一份饮料来。
    note: '*Please bring...* 是礼貌的请求。'
  en.a1.unit60.lesson03.teach.dialogue_line6:
    title: Daniel 询问时间
    gloss: Daniel 说：好的。几点？
    note: '*What time?* 是简短自然的问法。'
  en.a1.unit60.lesson03.teach.dialogue_line7:
    title: Leila 说出时间
    gloss: Leila 说：六点见。
    note: '*at six* 在钟点前用 *at*。'
  en.a1.unit60.lesson03.teach.dialogue_line8:
    title: Daniel 感谢 Leila
    gloss: Daniel 说：太好了。谢谢你的邀请。
    note: '*Thank you for...* 用 *for* 引出感谢的原因。'
  en.a1.unit60.lesson04.teach.invitation_message:
    title: 邀请函
    gloss: 晚餐邀请：星期六 6:00。请带一份饮料来。地址：Park Street 18 号。
    note: 邀请函写明了日期、时间、Daniel 要带什么以及地址。
  en.a1.unit60.lesson04.teach.reading_passage:
    title: 短文：在 Leila 家吃晚饭
    gloss: 在 Leila 家吃晚饭：Leila 邀请 Daniel 星期六来吃晚饭。她请他带一份饮料来。Daniel 说他可以来。邀请函上写着晚餐在 6:00，地点是 Park Street 18 号。Daniel 把地址记在了手机里。他想准时到达。Leila 很高兴，因为她的朋友可以来。
    note: '*invited Daniel to dinner* 的意思是 Leila 邀请 Daniel 来吃晚饭。'
