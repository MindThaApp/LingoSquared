teaching:
  en.a1.unit35.lesson01.teach.phone:
    title: phone
    gloss: 手机
    note: '*phone* 的意思是“手机，电话”。'
    example_gloss: 我用手机给妈妈打电话。
  en.a1.unit35.lesson01.teach.laptop:
    title: laptop
    gloss: 笔记本电脑
    note: '*laptop* 的意思是“笔记本电脑”。'
    example_gloss: 她用笔记本电脑工作。
  en.a1.unit35.lesson01.teach.tablet:
    title: tablet
    gloss: 平板电脑
    note: '*tablet* 的意思是“平板电脑”。'
    example_gloss: 他在平板电脑上看书。
  en.a1.unit35.lesson01.teach.computer:
    title: computer
    gloss: 电脑
    note: '*computer* 的意思是“电脑”。'
    example_gloss: 我们家里有一台电脑。
  en.a1.unit35.lesson01.teach.app:
    title: app
    gloss: 应用程序
    note: '*app* 的意思是“应用程序，手机应用”。'
    example_gloss: 我手机上有一个新应用。
  en.a1.unit35.lesson01.teach.camera:
    title: camera
    gloss: 相机
    note: '*camera* 的意思是“相机，摄像头”。'
    example_gloss: 这台相机能拍出很棒的照片。
  en.a1.unit35.lesson02.teach.make_a_call:
    title: make a call
    gloss: 打电话
    note: '*make a call* 是“动词 + 名词”的固定搭配，要整体记住。汉语说“打电话”，英语里固定用 *make a call*，其中的动词是 *make*，要连同 *call* 一起记。'
    example_gloss: 我每周日给哥哥打电话。
  en.a1.unit35.lesson02.teach.send_a_text:
    title: send a text
    gloss: 发短信 / 发消息
    note: '*send a text* 和 *make a call* 一样，也是“动词 + 名词”的固定搭配。汉语说“发短信”，英语里常说 *send a text*，动词用 *send*。'
    example_gloss: 她每天早上给朋友发短信。
  en.a1.unit35.lesson02.teach.download_an_app:
    title: download an app
    gloss: 下载应用
    note: '*download an app*：*download* 的用法很直接，汉语说“下载应用”，英语也是 *download* 加名词，所以这是三个固定搭配里最容易的一个。'
    example_gloss: 他每周下载一个新应用。
  en.a1.unit35.lesson02.teach.wifi:
    title: wifi
    gloss: 无线网络
    note: '*wifi* 的意思是“无线网络，WiFi”。'
    example_gloss: 我家的无线网络很快。
  en.a1.unit35.lesson02.teach.battery:
    title: battery
    gloss: 电池
    note: '*battery* 的意思是“电池”。'
    example_gloss: 我手机的电量快用完了。
  en.a1.unit35.lesson02.teach.how_use_phone_question:
    title: How do you use your phone?
    gloss: 你怎么使用你的手机？
    note: '*Do you use ...?* 和其他英语疑问句一样，需要助动词 *do*。'
  en.a1.unit35.lesson03.teach.dialogue_line1:
    title: Mia 的抱怨
    gloss: Mia 说：我的手机太旧了，真的很卡。
    note: '*so* + 形容词（*so old*）用来加强语气，相当于汉语的“这么”“太”。'
  en.a1.unit35.lesson03.teach.dialogue_line2:
    title: Leila 的建议
    gloss: Leila 说：你应该买一部新的。你最常用它来做什么？
    note: '*What do you use it for most?* 以介词 *for* 结尾。英语里疑问词 *what* 放在句首，*for* 留在句子末尾。汉语的语序不同，直接说“你最常用它来做什么”。'
  en.a1.unit35.lesson03.teach.dialogue_line3:
    title: "Mia 的回答"
    gloss: Mia 说：我主要用它给我姐姐发消息和拍照。
    note: '*text* 也可以直接当动词用（*I text my sister*），比 *send a text* 更常见；两种说法都是正确的英语。'
  en.a1.unit35.lesson03.teach.dialogue_line4:
    title: Leila 的用法
    gloss: Leila 说：我每个周末用手机给父母打电话。我还用很多应用。
    note: '*call* 当动词用（*I call my parents*）是日常口语里最常见的说法。*Make a call* 是第 2 课学过的固定搭配。'
  en.a1.unit35.lesson03.teach.dialogue_line5:
    title: Mia 的问题
    gloss: Mia 问：你用哪些应用？
    note: '*Which apps do you use?*：*which* 用来问在一组东西（应用）中选哪些，相当于汉语的“哪些”。'
  en.a1.unit35.lesson03.teach.dialogue_line6:
    title: Leila's apps
    gloss: Leila 说：我用一个烹饪应用和一个地图应用。你想下载吗？
    note: '*Do you want to ...?* 要用助动词 *do*，因为 *want* 是普通动词。'
  en.a1.unit35.lesson03.teach.dialogue_line7:
    title: "Mia 的回答"
    gloss: Mia 说：好的，请把名字发给我！
    note: 这里 *please* 放在动词前面（*please send ...*），让请求更有礼貌。
  en.a1.unit35.lesson04.teach.reading_passage:
    title: 关于 Daniel、Leila 和 Mia 的短文
    gloss: Daniel、Leila 和 Mia 使用手机的方式各不相同。Daniel 不喜欢发短信，他更喜欢直接打电话给别人。Leila 用手机看地图。她尝试新食谱时，也会用烹饪应用。Mia 拍很多照片，并发给家人。他们都用笔记本电脑工作，周末还和朋友视频聊天。
    note: '*He prefers to call people instead*：句尾的 *instead* 的意思是“而是，代替”（也就是代替发短信）。'
