  en.a1.unit12.lesson02.teach.do_you_have_in_blue:
    title: Do you have it in blue?
    gloss: 这个有蓝色的吗？
    note: '*Do you have it in...?* 用来询问有没有别的颜色。'
  en.a1.unit12.lesson03.teach.size:
    title: size
    gloss: 尺码
    note: '*size* 的意思是“尺码、大小”。'
    example_gloss: 这件衬衫是什么尺码？
  en.a1.unit12.lesson03.teach.color:
    title: color
    gloss: 颜色
    note: '*color* 的意思是“颜色”（美式拼写没有 u；英式拼写为 colour）。'
    example_gloss: 这件夹克是什么颜色的？
  en.a1.unit12.lesson03.teach.label_text:
    title: 衣物标签
    gloss: 衬衫。尺码：中号。颜色：蓝色。价格：20 美元。
    note: 美元符号写在数字前面（*$20*），读的时候则说“20 美元”。
  en.a1.unit12.lesson03.teach.label_summary_sentence:
    title: The shirt is a medium and it's blue.
    gloss: 这件衬衫是中号的，蓝色。
    note: 用一句话完整概括尺码和颜色。
  en.a1.unit12.lesson04.teach.here_you_go:
    title: Here you go.
    gloss: 给你。
    note: 把东西递给别人时说 *Here you go*。
  en.a1.unit12.lesson04.teach.ill_take_it:
    title: I'll take it, thanks.
    gloss: 好的，我买了，谢谢。
    note: '*I''ll take it* 表示已经决定购买。'
  en.a1.unit12.lesson04.teach.q_medium:
    title: Leila 的提问
    gloss: 蕾拉：打扰一下，这件衬衫有中号的吗？
    note: 蕾拉礼貌地询问有没有别的尺码。
  en.a1.unit12.lesson04.teach.a_here_you_go:
    title: 售货员的回答
    gloss: 店员：有的，给你。
    note: 店员把中号的衬衫递给蕾拉。
  en.a1.unit12.lesson04.teach.q_blue:
    title: Leila 的追问
    gloss: 蕾拉：太好了。有蓝色的吗？
    note: 蕾拉接着询问有没有别的颜色。
  en.a1.unit12.lesson04.teach.a_yes_we_do:
    title: 售货员的回答
    gloss: 店员：有的。
    note: '*we do* 简短地确认有这个颜色。'
  en.a1.unit12.lesson04.teach.closing_ill_take_it:
    title: Leila 的结束语
    gloss: 蕾拉：好的，我买了，谢谢。
    note: 蕾拉决定购买。
