teaching:
  en.a1.unit66.lesson01.teach.symptom:
    title: symptom
    gloss: 症状
    note: '*symptom* 的意思是症状，也就是你感觉到的不适。注意拼写：*symptom* 中间有 *mpt*，容易拼错，请多留意。'
    example_gloss: 这是一种症状。
  en.a1.unit66.lesson01.teach.cough:
    title: cough
    gloss: 咳嗽
    note: '*cough* 的意思是咳嗽。读作 *kof*；这里的 *gh* 发 *f* 的音。'
    example_gloss: 我咳嗽。
  en.a1.unit66.lesson01.teach.fever:
    title: fever
    gloss: 发烧
    note: '*fever* 的意思是发烧。读作 *FEE-ver*，重音在第一个音节。'
    example_gloss: 你发烧吗？
  en.a1.unit66.lesson01.teach.throat:
    title: throat
    gloss: 喉咙
    note: '*throat* 的意思是喉咙，指嗓子里面；脖子外面的部分说 *neck*。'
    example_gloss: 我的喉咙疼。
  en.a1.unit66.lesson01.teach.headache:
    title: headache
    gloss: 头痛
    note: '*headache* 的意思是头痛（英语用单数，并带冠词）。'
    example_gloss: 我头痛。
  en.a1.unit66.lesson01.teach.medicine:
    title: medicine
    gloss: 药
    note: '*medicine* 的意思是药。这个词是不可数名词：*some medicine*。'
    example_gloss: 请吃这种药。
  en.a1.unit66.lesson02.teach.have_cough:
    title: I have a cough.
    gloss: 我咳嗽。
    note: 英语里要说 *have a cough*，带冠词 *a*；汉语没有冠词，所以中国学习者容易漏掉 *a*。
  en.a1.unit66.lesson02.teach.throat_hurts:
    title: My throat hurts.
    gloss: 我的喉咙疼。
    note: '*hurts* 的意思是“疼”。英语里身体部位直接做主语（*my throat hurts*），和汉语“我的喉咙疼”的结构很接近。'
  en.a1.unit66.lesson02.teach.have_headache:
    title: I have a headache.
    gloss: 我头痛。
    note: 英语里要说 *have a headache*，带冠词 *a*；汉语没有冠词，要特别记住。
  en.a1.unit66.lesson02.teach.have_medicine:
    title: Do you have medicine?
    gloss: 您有药吗？
    note: '*Do you have...?* 用来询问有没有某样东西。'
  en.a1.unit66.lesson02.teach.with_water:
    title: Take this with water.
    gloss: 请用水送服。
    note: '*with water* 放在句末。'
  en.a1.unit66.lesson02.teach.ask_doctor:
    title: Please ask a doctor.
    gloss: 请咨询医生。
    note: '*Please* 让句子更有礼貌。'
  en.a1.unit66.lesson03.teach.dialogue_line1:
    title: Leila说出了不适
    gloss: Leila说：你好。我咳嗽。
    note: '*I have a cough* 说出了一种不适。'
  en.a1.unit66.lesson03.teach.dialogue_line2:
    title: 药剂师询问是否发烧
    gloss: 药剂师说：您发烧吗？
    note: '*Do you have a fever?* 是一个是非问句。'
  en.a1.unit66.lesson03.teach.dialogue_line3:
    title: Leila没有发烧
    gloss: Leila说：没有，我没有发烧。我的喉咙疼。
    note: '*No, I do not have...* 用来否定某个症状。英语要用 *do not* 来否定，不像汉语只需在动词前加“没有”。'
  en.a1.unit66.lesson03.teach.dialogue_line4:
    title: 药剂师询问是否头痛
    gloss: 药剂师说：您头痛吗？
    note: '*headache* 的意思是头痛。'
  en.a1.unit66.lesson03.teach.dialogue_line5:
    title: Leila头痛
    gloss: Leila说：是的，我头痛。
    note: '*Yes* 的意思是“是的”。'
  en.a1.unit66.lesson03.teach.dialogue_line6:
    title: 药剂师的建议
    gloss: 药剂师说：请用水送服这种药。如果感觉更糟，请咨询医生。
    note: '*if you feel worse* 的意思是“如果您感觉更糟”。'
  en.a1.unit66.lesson03.teach.dialogue_line7:
    title: Leila道谢
    gloss: Leila说：谢谢。
    note: '*Thank you* 是简短的致谢说法。'
  en.a1.unit66.lesson04.teach.pharmacy_note:
    title: 药店便条
    gloss: 药店便条：咳嗽，喉咙痛。不发烧。用水送服药物。如果加重，请咨询医生。
    note: 这张便条写明了症状和简单的建议。
  en.a1.unit66.lesson04.teach.reading_passage:
    title: 阅读：去药店
    gloss: 去药店：Leila去了药店，因为她咳嗽，喉咙也疼。药剂师问她有没有发烧。Leila说她没有发烧，但是头痛。药剂师给了她药，并说要用水送服。便条上写着，如果感觉更糟，要咨询医生。
    note: '*felt worse* 是 *feel worse* 的过去式。'
