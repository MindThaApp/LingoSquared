teaching:
  en.b2.unit04.lesson01.teach.background:
    title: background
    gloss: 背景
    note: '*background* 指已经在进行的事情，或提供情境的信息。在英语叙述中，背景通常用过去进行时来表达。'
    example_gloss: 背景信息说明了当时已经在发生什么。
  en.b2.unit04.lesson01.teach.foreground:
    title: foreground
    gloss: 主要事件
    note: '*foreground* 指故事所推进到的那个事件。在英语中通常用一般过去时，而不是随手就用现在完成时。'
    example_gloss: 主要事件是故事中最重要的事件。
  en.b2.unit04.lesson01.teach.prior:
    title: prior
    gloss: 先前的，在此之前的
    note: '*prior* 指比过去的另一个时刻更早。这通常用过去完成时来表示：*had moved*。'
    example_gloss: 先前的事件发生在过去的另一个事件之前。
  en.b2.unit04.lesson01.teach.interrupt:
    title: interrupt
    gloss: 打断
    note: 当一件短暂的事插入到正在进行的事情中时，就用 *interrupt*。
    example_gloss: 一个突发的问题可能会打断一个动作。
  en.b2.unit04.lesson01.teach.ongoing:
    title: ongoing
    gloss: 正在进行的
    note: '*ongoing* 指正在持续的状态。在英语的过去叙述中，表示“当时正在做某事”，常用 *was/were + -ing*，类似汉语的“正在”。'
    example_gloss: 正在进行的动作会持续一段时间。
  en.b2.unit04.lesson01.teach.chronology:
    title: chronology
    gloss: 时间顺序，实际先后
    note: '*chronology* 指事件实际发生的先后顺序，即使叙述时是按另一种顺序来讲的。'
    example_gloss: 时间顺序就是事件实际发生的先后顺序。
  en.b2.unit04.lesson02.teach.by_the_time:
    title: 某件事在此之前已经发生了
    gloss: 等我到的时候，协调员已经把设备搬进室内了。
    note: '*had already moved* 表明这件事发生在 *I arrived* 之前。汉语靠“已经”和上下文来表示先后；英语则要用过去完成时：说 *had moved*，不说 *has moved*。'
  en.b2.unit04.lesson02.teach.while_checking:
    title: 正在做某事，又被打断
    gloss: 我正在检查音响系统的时候，停电了。
    note: '*was checking* 表示当时正在进行的动作，类似汉语的“正在检查”。打断这个动作的事件本身用一般过去时：*went out*。'
  en.b2.unit04.lesson02.teach.when_arrived_setting:
    title: 在背景动作进行时到达
    gloss: 我到的时候，志愿者们正在摆椅子。
    note: 主要事件发生时，对于当时正在进行的事情，用 *were setting up*。
  en.b2.unit04.lesson02.teach.grammar_shifted_time:
    title: 叙述中的时间层次
    gloss: 背景动作用过去进行时，主要事件用一般过去时，在另一个过去时刻之前已经发生的事用过去完成时。
    note: 汉语没有时态变化，而英语的叙述会通过动词形式来区分时间层次：主要事件通常用一般过去时，所以说 *the power went out*，不说 *has gone out*。
  en.b2.unit04.lesson03.teach.venue:
    title: venue
    gloss: 场地，活动地点
    note: '*venue* 指举办活动的地方。'
    example_gloss: 场地就是举办活动的地点。
  en.b2.unit04.lesson03.teach.delayed:
    title: delayed
    gloss: 延误的，推迟的
    note: '*delayed* 表示某事比计划的时间更晚开始或发生。'
    example_gloss: 活动推迟了二十分钟才开始。
  en.b2.unit04.lesson03.teach.reading_passage:
    title: 阅读材料：场地出了问题
    gloss: 西蒙没有严格按时间顺序来讲这个故事。在他到达场地之前，协调员因为预计会下雨，已经把设备搬进了室内。西蒙到的时候，志愿者们正在摆椅子。他正在检查音响系统时，突然停电了。他打电话给大楼管理员，对方解释说，当天早上早些时候，一个维修小组曾在附近施工。团队把开场推迟了二十分钟，但等到客人入场时，灯已经重新亮了。
    note: 请留意英语的时间层次：*had moved* 表示更早发生的事，*were setting up* 表示背景，*went out* 表示主要事件。
  en.b2.unit04.lesson04.teach.q_walk_me_through:
    title: 哈珀请他讲讲经过
    gloss: 哈珀问：你能给我详细讲讲场地那边发生了什么吗？
    note: '*walk me through* 的意思是一步一步地带着某人了解一件事的经过。'
  en.b2.unit04.lesson04.teach.a_arrived_volunteers:
    title: 西蒙把几个时间层次结合起来
    gloss: 西蒙说：当然可以。我到的时候，志愿者们正在摆椅子，但协调员因为预计会下雨，已经把设备搬进室内了。
    note: 一个好的叙述，会把背景动作与更早发生的事件结合起来。
  en.b2.unit04.lesson04.teach.q_equipment_safe:
    title: 哈珀确认先后顺序
    gloss: 哈珀问：所以在你到那里之前，设备就已经安全了？
    note: 这个问题问的是先后顺序：在西蒙到达之前，设备就已经安全了。
  en.b2.unit04.lesson04.teach.a_power_went_out:
    title: 西蒙说出打断的事件
    gloss: 西蒙说：没错。然后，就在我检查音响系统的时候，停电了。
    note: '*while I was checking* 是正在进行的动作；*the power went out* 是打断它的事件。'
  en.b2.unit04.lesson04.teach.q_after_that:
    title: 哈珀问下一步
    gloss: 哈珀问：那之后你做了什么？
    note: '*What did you do...?* 用 *did* 加一般过去时，来询问已经完成的一个步骤。'
  en.b2.unit04.lesson04.teach.a_repair_crew:
    title: 西蒙说明更早的背景
    gloss: 西蒙说：我给大楼管理员打了电话，她告诉我，当天早上早些时候，一个维修小组一直在附近施工。
    note: '*had been working* 表明这项工作在那天早上早些时候就已经在进行了。'
  en.b2.unit04.lesson04.teach.q_event:
    title: 哈珀问到活动
    gloss: 哈珀问：那活动呢？
    note: 这个简短的问题是在问对活动造成的后果。
  en.b2.unit04.lesson04.teach.a_delayed_start:
    title: 西蒙作结
    gloss: 西蒙说：我们把开场推迟了二十分钟，但等客人入场的时候，灯已经重新亮了。
    note: '*had come back on* 发生在客人入场的那一刻之前。'
