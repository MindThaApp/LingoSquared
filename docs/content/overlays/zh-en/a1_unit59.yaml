teaching:
  en.a1.unit59.lesson01.teach.bank:
    title: bank
    gloss: 银行
    note: '*bank* 的意思是“银行”。'
    example_gloss: 银行就在这附近。
  en.a1.unit59.lesson01.teach.account:
    title: account
    gloss: 账户
    note: '*account* 在这里的意思是“银行账户”。'
    example_gloss: 我有一个银行账户。
  en.a1.unit59.lesson01.teach.card:
    title: card
    gloss: 银行卡
    note: '*card* 在这里的意思是“银行卡”。'
    example_gloss: 这张卡在这里可以用。
  en.a1.unit59.lesson01.teach.cash:
    title: cash
    gloss: 现金
    note: '*cash* 的意思是“现金”。'
    example_gloss: 我需要现金。
  en.a1.unit59.lesson01.teach.atm:
    title: ATM
    gloss: 自动取款机
    note: '*ATM* 的意思是“自动取款机”。在美式英语中，*ATM* 比 *cash machine* 更常听到。'
    example_gloss: 自动取款机在外面。
  en.a1.unit59.lesson01.teach.balance:
    title: balance
    gloss: 余额
    note: '*balance* 的意思是账户里的“余额”。'
    example_gloss: 我想查一下我的余额。
  en.a1.unit59.lesson02.teach.i_need_cash:
    title: I need cash.
    gloss: 我需要现金。
    note: '*need* 的意思是“需要”，宾语直接放在后面：*need cash*。'
  en.a1.unit59.lesson02.teach.where_is_the_atm:
    title: Where is the ATM?
    gloss: 自动取款机在哪里？
    note: '*Where is...?* 是询问地点的一般问法。'
  en.a1.unit59.lesson02.teach.check_my_balance:
    title: I want to check my balance.
    gloss: 我想查一下我的余额。
    note: '*check my balance* 是银行场景中查询余额的固定说法。'
  en.a1.unit59.lesson02.teach.can_i_use_this_card:
    title: Can I use this card?
    gloss: 我可以用这张卡吗？
    note: '*Can I use...?* 用来询问某事是否可行或是否允许。'
  en.a1.unit59.lesson02.teach.enter_your_pin:
    title: Please enter your PIN.
    gloss: 请输入您的密码。
    note: '*enter* 在这里的意思是“输入”。*PIN* 就是银行卡密码。'
  en.a1.unit59.lesson02.teach.atm_outside:
    title: The ATM is outside.
    gloss: 自动取款机在外面。
    note: '*outside* 放在句末：*is outside*。'
  en.a1.unit59.lesson03.teach.dialogue_line1:
    title: Mia 询问取款机
    gloss: Mia 说：嗨！自动取款机在哪里？
    note: '*Where is...?* 问的是地点。'
  en.a1.unit59.lesson03.teach.dialogue_line2:
    title: 取款机的位置
    gloss: 工作人员说：自动取款机在外面。
    note: '*outside* 的意思是“外面”。'
  en.a1.unit59.lesson03.teach.dialogue_line3:
    title: Leila 询问银行卡
    gloss: Leila 说：我可以用这张卡吗？
    note: '*this card* 指她手里拿着的那张卡。'
  en.a1.unit59.lesson03.teach.dialogue_line4:
    title: 这张卡可以用
    gloss: 工作人员说：可以，您可以用那张卡。
    note: '*Yes* 的意思是“是的”；*that card* 指 Leila 的那张卡。'
  en.a1.unit59.lesson03.teach.dialogue_line5:
    title: Mia 想查余额
    gloss: Mia 说：我想查一下我的余额。
    note: '*want to check* 中，第二个动词前要用 *to*。'
  en.a1.unit59.lesson03.teach.dialogue_line6:
    title: 密码
    gloss: 工作人员说：请输入您的密码。
    note: '*Please* 让这个指示更礼貌。'
  en.a1.unit59.lesson03.teach.dialogue_line7:
    title: Leila 也需要现金
    gloss: Leila 说：我也需要现金。
    note: '*too* 的意思是“也”，在这里放在句末。'
  en.a1.unit59.lesson03.teach.dialogue_line8:
    title: 取二十美元
    gloss: 工作人员说：您可以取二十美元。
    note: '*take out* 在这里的意思是“取出（钱）”。'
  en.a1.unit59.lesson03.teach.dialogue_line9:
    title: Mia 感谢工作人员
    gloss: Mia 说：谢谢！这很有帮助。
    note: '*helpful* 的意思是“有帮助的”。'
  en.a1.unit59.lesson04.teach.bank_notice:
    title: 银行通知
    gloss: 银行通知：营业时间 9:00 至 16:00。自动取款机在外面。今日取现限额：$100。接受银行卡。
    note: 通知中写明了营业时间、取款机的位置和取现限额。
  en.a1.unit59.lesson04.teach.reading_passage:
    title: 短文：顺路去一趟银行
    gloss: 顺路去一趟银行：一天早上，Mia 和 Leila 一起去了银行。Mia 想查余额，Leila 需要现金。工作人员说自动取款机在外面。Leila 用她的卡取了二十美元。Mia 输入密码，查了她的余额。离开之前，她们看了通知。银行的营业时间是 9:00 至 16:00，取现限额是 $100。Mia 说这次办事很轻松。
    note: '*took out* 是 *take out*（取出钱）的过去式。'
