teaching:
  en.b1.unit18.lesson01.teach.arrangement:
    title: arrangement
    gloss: 约定，已安排好的事
    note: '*arrangement* 指已经和别人说定的计划，例如约好的时间。'
    example_gloss: Mia星期五和Leila有个约。
  en.b1.unit18.lesson01.teach.intention:
    title: intention
    gloss: 打算，意图
    note: '*intention* 指自己已经决定要做、但还没有和别人约定时间的事。'
    example_gloss: Daniel打算提前完成这个项目。
  en.b1.unit18.lesson01.teach.prediction:
    title: prediction
    gloss: 预测，预计
    note: '*prediction* 指根据迹象对将要发生的事做出的判断。'
    example_gloss: 我预计这个项目会按时完成。
  en.b1.unit18.lesson01.teach.definitely:
    title: definitely
    gloss: 肯定，一定
    note: '*definitely* 表示完全确定某事会发生。'
    example_gloss: Daniel今天一定会把报告写完。
  en.b1.unit18.lesson01.teach.probably:
    title: probably
    gloss: 很可能，大概
    note: '*probably* 表示相当有把握，但不是完全确定。'
    example_gloss: 这个项目大概要花两个月。
  en.b1.unit18.lesson01.teach.might:
    title: might
    gloss: 可能，或许
    note: '*might* 表示某事只是一种不太大的可能。'
    example_gloss: Daniel可能会请Leila加入团队。
  en.b1.unit18.lesson02.teach.meeting_leila_friday:
    title: I am + 动词-ing（已定的安排）
    gloss: 我星期五要和Leila一起吃午饭。
    note: '*I am meeting Leila for lunch on Friday* 用现在进行时，表示已经和别人约好具体时间的安排。'
  en.b1.unit18.lesson02.teach.going_to_start_project:
    title: I am going to + 动词（打算）
    gloss: 我打算和设计团队一起开始一个新项目。
    note: '*I am going to start a new project* 用 going to，表示已经做出的决定，没有固定的时间。'
  en.b1.unit18.lesson02.teach.grammar_arrangements_vs_intentions:
    title: 已定的安排和打算
    gloss: 现在进行时（I am meeting Leila on Friday）用于已经安排好的事：和别人约定了具体的时间。going to（I am going to start a new project）用于你已经做出的打算或决定，即使还没有固定的时间。汉语里动词没有这样的形式变化，通常靠“约好了”“打算”等词语来区分；英语则需要在这两种结构中做出选择。
    note: 结构：已安排好的事用现在进行时，打算做的事用 going to。
  en.b1.unit18.lesson03.teach.on_time:
    title: on time
    gloss: 准时，按时
    note: '*on time* 指恰好在计划的时间或日期。'
    example_gloss: Daniel认为项目会按时完成。
  en.b1.unit18.lesson03.teach.confident:
    title: confident
    gloss: 有信心的
    note: '*confident* 指觉得事情会进展顺利。'
    example_gloss: Daniel对这个新项目很有信心。
  en.b1.unit18.lesson03.teach.reading_passage:
    title: 阅读：Daniel 下个月的计划
    gloss: Daniel下个月打算和设计团队一起开始一个新项目。他星期五上午要和他们见面，商量最初的几个步骤。Daniel对这个项目很有信心，但他不完全确定能否按时完成。他预计大概要花两个月。他可能会请Leila加入团队，因为她有丰富的设计经验。如果她答应，项目肯定会进展得更快。
    note: 一篇关于计划和预测的简短阅读短文。
  en.b1.unit18.lesson04.teach.q_plans_next_month:
    title: Mia 询问 Daniel 的计划
    gloss: Mia说：Daniel，你下个月有什么计划？
    note: 一个开放式问题，用来开启对话。
  en.b1.unit18.lesson04.teach.a_going_to_start:
    title: Daniel 说出他的打算
    gloss: Daniel说：我打算和设计团队一起开始一个新项目。
    note: '*going to* 表示已经做出的决定。'
  en.b1.unit18.lesson04.teach.q_meeting_this_week:
    title: Mia 继续提问
    gloss: Mia说：听起来很令人期待。你这周要和他们见面吗？
    note: 一个关于已安排好的事的追问。
  en.b1.unit18.lesson04.teach.a_meeting_friday_morning:
    title: Daniel 确认已定的安排
    gloss: Daniel说：对，我星期五上午要和他们见面。
    note: '*I am meeting... on Friday morning* 是用来表示已安排好的事的现在进行时。'
  en.b1.unit18.lesson04.teach.q_finish_on_time:
    title: Mia 询问时间安排
    gloss: Mia说：你觉得这个项目能按时完成吗？
    note: 一个关于预测的问题。
  en.b1.unit18.lesson04.teach.a_probably_two_months:
    title: Daniel 做出预测
    gloss: Daniel说：我不太确定，但大概要花两个月左右。
    note: '*probably* 表示相当有把握，但不是完全确定。'
  en.b1.unit18.lesson04.teach.q_sure_it_will_go_well:
    title: Mia 很乐观
    gloss: Mia说：嗯，我相信会很顺利的。
    note: 一句鼓励的话。
  en.b1.unit18.lesson04.teach.a_might_ask_leila:
    title: Daniel 提出一个把握不大的可能性
    gloss: Daniel说：谢谢。我可能也会请Leila加入团队。
    note: '*might* 表示不太大的可能。'
