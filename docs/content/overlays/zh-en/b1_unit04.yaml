teaching:
  en.b1.unit04.lesson01.teach.agree:
    title: agree
    gloss: 同意
    note: '*agree* 表示认为别人说得对。'
    example_gloss: 我同意你的看法。
  en.b1.unit04.lesson01.teach.disagree:
    title: disagree
    gloss: 不同意，持不同意见
    note: '*disagree* 表示认为别人说得不对。'
    example_gloss: 我不同意这个观点。
  en.b1.unit04.lesson01.teach.opinion:
    title: opinion
    gloss: 观点 / 意见
    note: '*opinion* 指个人对某事的看法。'
    example_gloss: 每个人的观点都不一样。
  en.b1.unit04.lesson01.teach.believe:
    title: believe
    gloss: 相信 / 认为
    note: '*believe* 表示认为某事是真的。'
    example_gloss: 我认为这是个好主意。
  en.b1.unit04.lesson01.teach.reason:
    title: reason
    gloss: 理由
    note: '*reason* 指某个观点背后的解释。'
    example_gloss: 你这样想的理由是什么？
  en.b1.unit04.lesson01.teach.save_time:
    title: save time
    gloss: 节省时间
    note: '*save time* 表示做某事所需的时间变少了。'
    example_gloss: 在家办公帮我节省时间。
  en.b1.unit04.lesson02.teach.agree_that_saves_time:
    title: 表示同意并说明理由
    gloss: 我同意在家办公更好，因为可以节省时间。
    note: '*I agree that... because...* 把观点和理由连在一起。'
  en.b1.unit04.lesson02.teach.disagree_that_miss_coworkers:
    title: 反驳并说明理由
    gloss: 我不同意它更好，因为你会想念同事。
    note: '*I disagree that... because...* 把相反的观点和理由连在一起。'
  en.b1.unit04.lesson02.teach.grammar_agree_disagree_that:
    title: agree that / disagree that
    gloss: 我同意它更好。我不同意它更好。
    note: '*agree*/*disagree* 后面，*that* 引出从句，说明所同意或不同意的观点。*that* 前面不加逗号。'
  en.b1.unit04.lesson03.teach.focus:
    title: focus
    gloss: 集中注意力
    note: '*focus* 表示把注意力放在某件事上。'
    example_gloss: 在家里她更容易集中注意力。
  en.b1.unit04.lesson03.teach.respect:
    title: respect
    gloss: 尊重
    note: '*respect* 表示即使不同意，也尊重别人的观点。'
    example_gloss: 他们尊重彼此的观点。
  en.b1.unit04.lesson03.teach.reading_passage:
    title: 阅读：两种观点
    gloss: 米娅认为在家办公更好，因为她在家更容易集中注意力。蕾拉不同意。她认为去办公室更好，因为她喜欢每天见到同事。她们意见不一致，但互相尊重对方的观点。
    note: 一篇短文，包含两种相反的观点。
  en.b1.unit04.lesson04.teach.q_working_from_home:
    title: Daniel 开启辩论
    gloss: 丹尼尔说：你觉得在家办公比去办公室更好吗？
    note: 一个开放式问题，用来引出不同的意见。
  en.b1.unit04.lesson04.teach.a_disagree_miss_coworkers:
    title: Leila 持不同看法
    gloss: 蕾拉说：我不同意它更好。我觉得你会错过和同事之间重要的交流。
    note: 蕾拉说出了自己的观点和一个理由。
  en.b1.unit04.lesson04.teach.q_fair_point_saves_time:
    title: Daniel 认可 Leila 的论点，但坚持自己的看法
    gloss: 丹尼尔说：你说得有道理，但我同意它能节省很多时间。
    note: '*that''s a fair point* 是在说出自己的观点之前，先认可对方的观点。'
  en.b1.unit04.lesson04.teach.a_agree_saves_time_prefer_office:
    title: Leila 承认一点，但仍坚持自己的偏好
    gloss: 蕾拉说：我同意它能节省时间，但我还是更喜欢在办公室工作。
    note: 蕾拉承认了一点，但没有改变自己的总体看法。
  en.b1.unit04.lesson04.teach.q_everyone_different_opinion:
    title: Daniel 结束对话
    gloss: 丹尼尔说：我能理解。每个人的观点都不一样。
    note: 这是一种自然而友好的方式，用来结束一场意见分歧。
