teaching:
  en.a1.unit01.lesson01.teach.hello:
    title: Hello
    gloss: 你好
    note: '*Hello* 是中性、通用的问候语，几乎适用于任何场合。'
    example_gloss: 你好，Daniel！
  en.a1.unit01.lesson01.teach.hi:
    title: Hi
    gloss: 嗨（随意）
    note: '*Hi* 比 *Hello* 更随意，常用于朋友之间，就像中文里的“嗨”。'
    example_gloss: 嗨，Leila！
  en.a1.unit01.lesson01.teach.good_morning:
    title: Good morning
    gloss: 早上好
    note: '*Good morning* 在早晨使用，和中文的“早上好”一样。'
  en.a1.unit01.lesson01.teach.good_afternoon:
    title: Good afternoon
    gloss: 下午好
    note: '*Good afternoon* 在下午使用。英语里没有像中文“你好”那样全天通用的说法，要按时间段选择问候语。'
  en.a1.unit01.lesson01.teach.good_evening:
    title: Good evening
    gloss: 晚上好
    note: '*Good evening* 在晚上使用，和中文的“晚上好”一样。'
  en.a1.unit01.lesson01.teach.goodbye:
    title: Goodbye
    gloss: 再见
    note: '*Goodbye* 是中性、通用的道别语。'
    example_gloss: 再见，明天见！
  en.a1.unit01.lesson01.teach.bye:
    title: Bye
    gloss: 拜拜
    note: '*Bye* 比 *Goodbye* 更随意，类似中文的“拜拜”。'
    example_gloss: 拜拜，回头见！
  en.a1.unit01.lesson03.teach.how_are_you:
    title: How are you?
    gloss: 你好吗？／你还好吗？
    note: '*How are you?* 正式和非正式场合都能用。英语只有一个 *you*，不像中文要区分“你”和“您”。'
  en.a1.unit01.lesson03.teach.im_fine:
    title: I'm fine, thanks.
    gloss: 我很好，谢谢。
    note: 一种简单、中性的回答。
  en.a1.unit01.lesson03.teach.im_good:
    title: I'm good, thanks.
    gloss: 我很好，谢谢。
    note: 意思和 *I'm fine, thanks* 相同，两者在日常生活中同样常见。
  en.a1.unit01.lesson03.teach.not_bad:
    title: Not bad, thanks.
    gloss: 还不错，谢谢。
    note: 一种随意、略显谦逊的回答，既不算特别好，也不算糟。
  en.a1.unit01.lesson03.teach.and_you:
    title: And you?
    gloss: 你呢？
    note: 把问题回问给对方，适用于任何场合，不用区分正式或非正式。
  en.a1.unit01.lesson03.teach.are_you_okay:
    title: Are you okay?
    gloss: 你没事吧？
    note: '*Are you okay?* 更像是在问对方此刻是否有什么不对劲，而不是 *How are you?* 那样的一般性问候。'
  en.a1.unit01.lesson05.teach.nice_to_meet_you:
    title: Nice to meet you.
    gloss: 很高兴认识你。
    note: 初次见面时说。
  en.a1.unit01.lesson05.teach.nice_to_meet_you_too:
    title: Nice to meet you too.
    gloss: 我也很高兴认识你。
    note: 对 *Nice to meet you* 的恰当回应。
  en.a1.unit01.lesson05.teach.see_you_later:
    title: See you later.
    gloss: 回头见。
    note: 当你当天还会再见到对方时使用，和中文的“回头见”类似。
  en.a1.unit01.lesson05.teach.have_a_good_day:
    title: Have a good day.
    gloss: 祝你今天愉快。
    note: 一种友好的道别，祝对方接下来的一天过得愉快。
