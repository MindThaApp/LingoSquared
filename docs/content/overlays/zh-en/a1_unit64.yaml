teaching:
  en.a1.unit64.lesson01.teach.nice:
    title: nice
    gloss: 不错 / 好看 / 友善
    note: '*nice* 的意思是“不错”“好看”或“友善”，具体含义看情境。'
    example_gloss: 那很不错。
  en.a1.unit64.lesson01.teach.great:
    title: great
    gloss: 很棒
    note: '*great* 比 *nice* 的语气更强，意思是“很棒”。'
    example_gloss: 你看起来很棒。
  en.a1.unit64.lesson01.teach.lovely:
    title: lovely
    gloss: 可爱 / 很美
    note: '*lovely* 听起来温暖而亲切。'
    example_gloss: 多么可爱的笑容。
  en.a1.unit64.lesson01.teach.kind:
    title: kind
    gloss: 善良
    note: '*kind* 的意思是“友善、待人好”。'
    example_gloss: 你真是太善良了。
  en.a1.unit64.lesson01.teach.smile:
    title: smile
    gloss: 微笑
    note: '*smile* 的意思是“微笑”。'
    example_gloss: 多么可爱的笑容。
  en.a1.unit64.lesson01.teach.jacket:
    title: jacket
    gloss: 夹克
    note: '*jacket* 的意思是“夹克”或“外套”。'
    example_gloss: 我喜欢你的夹克。
  en.a1.unit64.lesson02.teach.that_is_nice:
    title: That is nice.
    gloss: 那很不错。
    note: '*That is nice* 是简短的肯定回应。'
  en.a1.unit64.lesson02.teach.you_look_great:
    title: You look great.
    gloss: 你看起来很棒。
    note: '*look* 在这里的意思是“看起来”，不是“看”。'
  en.a1.unit64.lesson02.teach.like_your_jacket:
    title: I like your jacket.
    gloss: 我喜欢你的夹克。
    note: '*I like your...* 是夸奖别人所拥有的东西时的常用说法。'
  en.a1.unit64.lesson02.teach.lovely_smile:
    title: What a lovely smile.
    gloss: 多么可爱的笑容。
    note: '*What a...* 用来以感叹的方式表达赞美。'
  en.a1.unit64.lesson02.teach.very_kind:
    title: That is very kind.
    gloss: 你真是太善良了。
    note: '*very* 加强了 *kind* 的程度。'
  en.a1.unit64.lesson02.teach.thank_you_much:
    title: Thank you very much.
    gloss: 非常感谢。
    note: '*Thank you very much* 是礼貌而热情的道谢说法。'
  en.a1.unit64.lesson03.teach.dialogue_line1:
    title: "Mia 夸奖对方"
    gloss: Mia 说：嗨，Leila。你今天看起来很棒。
    note: '*You look great* 是直接的赞美。'
  en.a1.unit64.lesson03.teach.dialogue_line2:
    title: Leila 感谢 Mia
    gloss: Leila 说：谢谢你，Mia。
    note: '*Thank you* 的意思是“谢谢你”。'
  en.a1.unit64.lesson03.teach.dialogue_line3:
    title: Mia 说起绿色夹克
    gloss: Mia 说：我喜欢你的绿色夹克。
    note: '*I like your green jacket* 是在夸奖衣服。'
  en.a1.unit64.lesson03.teach.dialogue_line4:
    title: Leila 友善地回应
    gloss: Leila 说：你真是太善良了。
    note: '*That is very kind* 用来回应别人说的暖心话。'
  en.a1.unit64.lesson03.teach.dialogue_line5:
    title: Mia 说起笑容
    gloss: Mia 说：你的笑容也很可爱！看，这是我的照片。
    note: '*too* 在这里的意思是“也”。'
  en.a1.unit64.lesson03.teach.dialogue_line6:
    title: Leila 夸奖照片
    gloss: Leila 说：非常感谢。你的照片很不错。
    note: '*Your photo is nice* 是回夸对方。'
  en.a1.unit64.lesson03.teach.dialogue_line7:
    title: Mia 解释照片
    gloss: Mia 说：谢谢。这是给 Daniel 的。
    note: '*Thanks* 比 *thank you* 更简短。'
  en.a1.unit64.lesson04.teach.message:
    title: 暖心消息
    gloss: 暖心消息：你的绿色夹克真漂亮。你的照片很不错。谢谢你这么善良。
    note: 这条消息有两句赞美，还有一句感谢。
  en.a1.unit64.lesson04.teach.reading_passage:
    title: 短文：给朋友的赞美
    gloss: 给朋友的赞美：Mia 看到 Leila 穿着一件绿色夹克。Mia 说 Leila 看起来很棒。她还说 Leila 的笑容很可爱。Leila 向 Mia 道谢。后来 Leila 看了 Mia 的照片，说照片很不错。Mia 很高兴，因为这张照片是给 Daniel 的。再后来，Leila 写了一条简短的消息：你的绿色夹克真漂亮。
    note: '*looked great* 是 *look great* 的过去式。'
