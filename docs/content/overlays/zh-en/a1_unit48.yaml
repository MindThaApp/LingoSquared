    gloss: 你的书周五到期。
    note: '*due on Friday* 在表示具体某一天时用 *on*。'
  en.a1.unit48.lesson03.teach.dialogue_line1:
    title: Leila 的提议
    gloss: Leila 说：我要把这本书还到图书馆。你想一起去吗？
    note: '*Do you want to come with me?* 的意思是“你想跟我一起去吗？”'
  en.a1.unit48.lesson03.teach.dialogue_line2:
    title: Daniel 的回应
    gloss: Daniel 说：好啊！我想我以前从来没有从图书馆借过书。
    note: '*I don''t think I''ve ever ...* 的意思是“我想我从来没有……过”，用的是现在完成时（*have ever*）。'
  en.a1.unit48.lesson03.teach.dialogue_line3:
    title: Leila 在柜台前
    gloss: Leila 说：你好，我想还这本书，也想再借一本新的。
    note: '*and I''d like to ... too* 的意思是“而且我也想……”'
  en.a1.unit48.lesson03.teach.dialogue_line4:
    title: 图书管理员的提问
    gloss: 图书管理员说：好的，谢谢。你带借书证了吗？
    note: '*Do you have your library card?* 的意思是“你带借书证了吗？”'
  en.a1.unit48.lesson03.teach.dialogue_line5:
    title: "Leila 的回答"
    gloss: Leila 说：带了，给您。
    note: '*here it is* 的意思是“给您，在这里”。'
  en.a1.unit48.lesson03.teach.dialogue_line6:
    title: 图书管理员的说明
    gloss: 图书管理员说：好的。这本新书三周后到期归还。
    note: '*due back in three weeks* 的意思是“三周后要归还”。'
  en.a1.unit48.lesson03.teach.dialogue_line7:
    title: Daniel 也想借书
    gloss: Daniel 说：我也可以办一张借书证吗？我想借一本食谱。
    note: '*Can I get ... too?* 的意思是“我也可以得到……吗？”'
  en.a1.unit48.lesson03.teach.dialogue_line8:
    title: 图书管理员帮助 Daniel
    gloss: 图书管理员说：当然可以！请填一下这张表格就行。
    note: '*fill out this form* 的意思是“填写这张表格”。注意动词和 *out* 要连着用。'
  en.a1.unit48.lesson04.teach.reading_passage:
    title: 关于图书馆如何运作的短文
    gloss: 去图书馆：大多数图书馆都允许你借书，有时还可以借其他物品，每次借几周。借东西通常需要一张借书证。你借书时，图书管理员会告诉你到期日，也就是你必须归还的那一天。如果到时候你还没看完，通常可以请图书管理员延长时间。Leila 搬进新公寓后，拥有的书不如以前多了，所以她开始改从图书馆借书。上周，她还了一本书，又借了一本新书，朋友 Daniel 也一起去了。他以前从来没有借过图书馆的书，所以办了自己的借书证，借了一本食谱，用来练习 Mia 教他的那些菜谱。图书管理员提醒他们两人都要在到期日之前把书还回来。Mia 不常去图书馆，但她曾经借过一本摄影书，用于她的课程。
    note: '*checked out a cookbook* 的意思是“借了一本食谱”（*checked out* 是在图书馆借书时的固定说法）。'
