    note: '*return* 在这里的意思是归还。'
    example_gloss: 我可以还这本书吗？
  en.a1.unit48.lesson01.teach.due:
    title: due
    gloss: 到期的 / 应归还的
    note: '*due* 在中文里没有完全对应的单个词，中文通常说“到期”“应在……之前归还”，英语则用这一个词表达。'
    example_gloss: 这本书什么时候到期？
  en.a1.unit48.lesson01.teach.card:
