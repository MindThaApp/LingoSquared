    title: He prefers tea. He thinks it's too strong.
    gloss: 他更喜欢茶。他觉得它太浓了。
    note: '*prefers* 和 *thinks* 是第三人称单数（主语是 *he*/*she*）的形式，末尾要加 *-s*；汉语的动词不随人称变化，所以要特别留意。'
