teaching:
  en.a1.unit42.lesson01.teach.friendly:
    title: friendly
    gloss: 友好
    note: '*friendly* 的意思是“友好”，待人亲切，容易交谈。'
    example_gloss: 我的邻居非常友好。
  en.a1.unit42.lesson01.teach.funny:
    title: funny
    gloss: 风趣；有趣
    note: '*funny* 的意思是“风趣、有趣”，指能让别人发笑的人。'
    example_gloss: 我哥哥真的很风趣。
  en.a1.unit42.lesson01.teach.hardworking:
    title: hardworking
    gloss: 勤奋
    note: '*hardworking* 的意思是“勤奋、努力”，指不轻易放弃的人。'
    example_gloss: 她是一名勤奋的员工。
  en.a1.unit42.lesson01.teach.shy:
    title: shy
    gloss: 害羞
    note: '*shy* 的意思是“害羞”，面对陌生人时腼腆或紧张。'
    example_gloss: 他一开始有点害羞。
  en.a1.unit42.lesson01.teach.calm:
    title: calm
    gloss: 冷静；沉着
    note: '*calm* 的意思是“冷静、沉着”，不容易心烦或紧张。'
    example_gloss: 我妈妈非常沉着。
  en.a1.unit42.lesson01.teach.talkative:
    title: talkative
    gloss: 健谈
    note: '*talkative* 的意思是“健谈”，指话很多的人。'
    example_gloss: 我姐姐非常健谈。
  en.a1.unit42.lesson02.teach.a_little_shy:
    title: a little shy
    gloss: 有点害羞
    note: 这里的 *a little* 表示程度，意思是“有一点”，不是指“小”；不要按字面理解成“小的害羞”。
    example_gloss: 他一开始有点害羞，但很快就放开了。
  en.a1.unit42.lesson02.teach.very_hardworking:
    title: very hardworking
    gloss: 非常勤奋
    note: '*very hardworking* 的意思是“非常勤奋”。'
    example_gloss: 我的同事非常勤奋。
  en.a1.unit42.lesson02.teach.have_a_great_sense_of_humor:
    title: have a great sense of humor
    gloss: 很有幽默感
    note: '*have a great sense of humor* 的意思是“很有幽默感”。'
    example_gloss: Daniel 很有幽默感。
  en.a1.unit42.lesson02.teach.get_along_with_everyone:
    title: get along with everyone
    gloss: 和每个人都相处融洽
    note: '*get along with everyone* 的意思是“和每个人都相处融洽”。'
    example_gloss: Mia 在工作中和每个人都相处得很好。
  en.a1.unit42.lesson02.teach.warm_up_quickly:
    title: warm up quickly
    gloss: 很快放开；很快熟络起来
    note: '*warm up quickly* 的意思是“和新认识的人很快熟络起来、放开”。'
    example_gloss: 他很害羞，但一旦熟悉了你，很快就放开了。
  en.a1.unit42.lesson02.teach.whats_he_like_question:
    title: What's he like?
    gloss: 他是个怎样的人？
    note: '*What''s he like?* 询问的是一个人的性格，而不是外貌。'
  en.a1.unit42.lesson03.teach.dialogue_line1:
    title: Mia 的提问
    gloss: Mia：下周我要和 Daniel 一起做一个新项目。他是个怎样的人？
    note: '*What''s he like?* 询问的是一个人的性格。'
  en.a1.unit42.lesson03.teach.dialogue_line2:
    title: "Leila 的回答"
    gloss: Leila：他很友好，而且也很风趣。
    note: '*and he''s really funny too* 的意思是“而且他也很风趣”。'
  en.a1.unit42.lesson03.teach.dialogue_line3:
    title: Mia 的提问
    gloss: Mia：那就好！和他一起工作容易吗？
    note: '*Is he easy to work with?* 询问的是和某人共事是否轻松愉快。'
  en.a1.unit42.lesson03.teach.dialogue_line4:
    title: "Leila 的回答"
    gloss: Leila：容易，他还很勤奋。他总是按时完成任务。
    note: '*finishes his tasks on time* 的意思是“按时完成任务”。'
  en.a1.unit42.lesson03.teach.dialogue_line5:
    title: Mia 的提问
    gloss: Mia：他开会的时候会害羞吗？
    note: 这里的 *ever* 的意思是“曾经、有时”。
  en.a1.unit42.lesson03.teach.dialogue_line6:
    title: "Leila 的回答"
    gloss: Leila：有一点，不过等他熟悉你之后就自在多了。
    note: '*once he knows you* 的意思是“一旦他熟悉你”。'
  en.a1.unit42.lesson03.teach.dialogue_line7:
    title: Mia 的道谢
    gloss: Mia：谢谢你，Leila。现在我对这个项目放心多了。
    note: '*I feel more relaxed* 的意思是“我觉得更放松了”。'
  en.a1.unit42.lesson04.teach.reading_passage:
    title: 关于三种性格的短文
    gloss: Daniel、Leila 和 Mia 是好朋友，但三个人的性格很不一样。Daniel 友好又风趣，总能逗朋友们开心。他遇到陌生人时有点害羞，但很快就能放开。Leila 沉着又有创造力。她喜欢画画，因为画画能帮她放松，而且她很少为什么事烦心。Mia 外向又有条理。她喜欢为大家安排计划，教朋友新东西时也很有耐心，她就教过 Daniel 做饭。虽然他们性格各不相同，但相处得很好，也喜欢在一起度过时光。
    note: '*even though* 的意思是“尽管、虽然”。'
