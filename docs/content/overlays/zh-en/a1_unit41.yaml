    example_gloss: 我得把煮意面的水烧开。
  en.a1.unit41.lesson01.teach.taste:
    title: taste
    gloss: 尝；品尝
    note: '*taste* 的意思是“尝、品尝”。'
    example_gloss: 你能尝一下酱汁，告诉我要不要加盐吗？
  en.a1.unit41.lesson02.teach.make_dinner:
