  en.a1.unit41.lesson01.teach.chop:
    title: chop
    gloss: 切碎；剁碎
    note: '*chop* 的意思是“切碎、剁碎”，把食物切成小块，比一般的“切”更具体。'
    example_gloss: 你能帮我把洋葱切碎吗？
  en.a1.unit41.lesson01.teach.boil:
