  en.a1.unit41.lesson03.teach.dialogue_line1:
    title: Mia 的邀请
    gloss: Mia：我今晚做意面。你想来帮我一起做吗？
    note: '*Do you want to help me* 加动词是邀请别人来帮忙的一种自然说法。'
  en.a1.unit41.lesson03.teach.dialogue_line2:
    title: Daniel 的回应
    gloss: Daniel：好啊！不过我做饭不太好。
    note: 句末的 *though* 表示轻微的转折，意思接近中文的“不过”“就是”。
  en.a1.unit41.lesson03.teach.dialogue_line3:
    title: Mia 的鼓励
    gloss: Mia：没关系，我教你。你能把这些洋葱切碎吗？
    note: '*I''ll show you* 的意思是“我来示范给你看”。'
  en.a1.unit41.lesson03.teach.dialogue_line4:
    title: Daniel 的提问
    gloss: Daniel：没问题。要切多碎？
    note: 这里的 *should* 用来征求建议。
  en.a1.unit41.lesson03.teach.dialogue_line5:
    title: Mia 的讲解
    gloss: Mia：切成小块，像这样。现在我们来煮意面吧。
    note: '*like this* 的意思是“像这样、这样”。'
  en.a1.unit41.lesson03.teach.dialogue_line6:
    title: Daniel 的回应
    gloss: Daniel：我可以尝尝酱汁吗？太好吃了！
    note: '*Can I* 加动词是在征求许可。'
  en.a1.unit41.lesson03.teach.dialogue_line7:
    title: Mia 的收尾
    gloss: Mia：太好了！晚饭快做好了。
    note: '*almost ready* 的意思是“快好了”。'
  en.a1.unit41.lesson04.teach.reading_passage:
    title: 关于一起做饭的短文
    gloss: Daniel、Leila 和 Mia 的厨艺各不相同。自从 Leila 搬到 Mia 附近的新公寓后，三个朋友经常一起做晚饭。Leila 很会做饭，她常用她妈妈的老食谱做意面。Mia 也喜欢做饭，她教过 Daniel 怎么切洋葱才不会切到手指。Daniel 还算不上厨艺高手，但他进步很快。昨晚，Mia 请 Daniel 帮她做意面。Daniel 切洋葱，Mia 煮意面并做酱汁。Daniel 尝了尝酱汁，说很好吃。晚饭刚做好，Leila 就到了，三个人一起在 Mia 的厨房里吃了饭。
    note: '*arrived just as dinner was ready* 的意思是“晚饭刚做好时就到了”。'
