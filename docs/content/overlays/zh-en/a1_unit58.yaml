teaching:
  en.a1.unit58.lesson01.teach.museum:
    title: museum
    gloss: 博物馆
    note: '*museum* 的意思是“博物馆”。'
    example_gloss: 这座博物馆非常古老。
  en.a1.unit58.lesson01.teach.ticket:
    title: ticket
    gloss: 票
    note: '*ticket* 的意思是“票”，这里指入场票。'
    example_gloss: 请给我一张票。
  en.a1.unit58.lesson01.teach.exhibition:
    title: exhibition
    gloss: 展览
    note: '*exhibition* 的意思是“展览”，指公开展出的一批艺术品或物品。'
    example_gloss: 有一个新展览。
  en.a1.unit58.lesson01.teach.painting:
    title: painting
    gloss: 画
    note: '*painting* 的意思是“画”，指用颜料创作的艺术作品。'
    example_gloss: 我真的很喜欢这幅画。
  en.a1.unit58.lesson01.teach.sculpture:
    title: sculpture
    gloss: 雕塑
    note: '*sculpture* 的意思是“雕塑”，指用石头、木头或金属制成的艺术品。'
    example_gloss: 这件雕塑也非常古老。
  en.a1.unit58.lesson01.teach.guide:
    title: guide
    gloss: 导游
    note: '*guide* 的意思是“导游”或“讲解员”，指带领参观者并做讲解的人。'
    example_gloss: 今天有讲解员吗？
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_open:
    title: What time does the museum open?
    gloss: 博物馆几点开门？
    note: 这个问句以 *what time* 开头，后面接助动词 *does*，因为句中的主要动词是 *open*。
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_close:
    title: What time does the museum close?
    gloss: 博物馆几点关门？
    note: 句型与 *What time does the museum open?* 相同，只是把 *open* 换成了 *close*。
  en.a1.unit58.lesson02.teach.two_tickets_please:
    title: Two tickets, please.
    gloss: 请给我两张票。
    note: 句末的 *please* 让请求更礼貌，和点餐时的用法一样。
  en.a1.unit58.lesson02.teach.is_there_a_guide_for_the_exhibition:
    title: Is there a guide for the exhibition?
    gloss: 有展览的讲解员吗？
    note: '*Is there...?* 用来询问某物是否存在，这里问的是有没有讲解员。'
  en.a1.unit58.lesson02.teach.the_museum_is_open_every_day:
    title: The museum is open every day.
    gloss: 博物馆每天开放。
    note: '*every day* 的意思是“每天”，放在句末。'
  en.a1.unit58.lesson02.teach.i_really_enjoyed_the_paintings:
    title: I really enjoyed the paintings!
    gloss: 我真的很喜欢这些画！
    note: '*enjoyed* 是 *enjoy*（喜欢、享受）的过去式，用来回顾一件愉快的事。'
  en.a1.unit58.lesson03.teach.dialogue_line1:
    title: Daniel 的问题
    gloss: Daniel 说：嗨！博物馆几点关门？
    note: '*Hi!* 是一种随意的问候语。'
  en.a1.unit58.lesson03.teach.dialogue_line2:
    title: 工作人员的回答
    gloss: 工作人员说：我们五点关门。
    note: '*at* 加钟点表示事情发生的时间，例如 *at five o''clock*。'
  en.a1.unit58.lesson03.teach.dialogue_line3:
    title: Mia 的请求
    gloss: Mia 说：太好了。我们要两张票，可以吗？
    note: '*Can we have...?* 是礼貌地要东西或提出请求的说法。'
  en.a1.unit58.lesson03.teach.dialogue_line4:
    title: 票价
    gloss: 工作人员说：当然可以。一共十二美元。
    note: '*That''s* 加金额，用来报价钱。'
  en.a1.unit58.lesson03.teach.dialogue_line5:
    title: Daniel 询问讲解员
    gloss: Daniel 问：有展览的讲解员吗？
    note: 和之前学过的 *Is there...?* 句型相同。
  en.a1.unit58.lesson03.teach.dialogue_line6:
    title: 工作人员谈讲解员
    gloss: 工作人员说：有的，入口附近有讲解员。
    note: '*there''s* 是 *there is* 的缩写。'
  en.a1.unit58.lesson03.teach.dialogue_line7:
    title: Mia 询问名称
    gloss: Mia 问：这个展览叫什么名字？
    note: '*What is ... called?* 是询问某事物名称的常用说法。'
  en.a1.unit58.lesson03.teach.dialogue_line8:
    title: 展览的名称
    gloss: 工作人员说：它叫 Colors of the City。
    note: '*It''s called...* 用来回答 *What is ... called?* 这个问题。'
  en.a1.unit58.lesson03.teach.dialogue_line9:
    title: Daniel 的结束语
    gloss: Daniel 说：谢谢您！我迫不及待想看这些画了。
    note: '*can''t wait to...* 的意思是非常期待做某事。'
  en.a1.unit58.lesson04.teach.museum_notice:
    title: 博物馆告示牌
    gloss: 城市博物馆：每天开放，9:00 至 17:00。成人票：6 美元。当前展览：Colors of the City，2 号展厅。
    note: 告示牌上写明了开放时间、票价和展览名称。
  en.a1.unit58.lesson04.teach.reading_passage:
    title: 短文：Daniel 和 Mia
    gloss: 参观博物馆：一个星期六的下午，Daniel 和 Mia 决定一起去参观城市博物馆。在入口处，工作人员告诉他们博物馆五点关门。他们买了两张票，花了十二美元。Daniel 问有没有讲解员，工作人员说入口附近有一位。他们参观了名为 Colors of the City 的展览，在 2 号展厅看到了许多漂亮的画。Daniel 喜欢一幅老城广场的画，Mia 喜欢一幅日落时河景的画。离开时，Mia 说她下次想去参观雕塑展。
    note: '*decided to visit* 在 *decided* 后面用 *to* 加动词原形，表示决定要做的事。'
