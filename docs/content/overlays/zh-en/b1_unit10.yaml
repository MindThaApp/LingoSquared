  en.b1.unit10.lesson04.teach.q_studying_every_night:
    title: Leila 询问他的学习习惯
    gloss: 蕾拉说：这很合理。你每天晚上都学习吗？
    note: 一个追问，问丹尼尔打算怎样实现他的目标。
  en.b1.unit10.lesson04.teach.a_remember_vocabulary:
    title: Daniel 使用 'so that'
    gloss: 丹尼尔说：我学三十分钟，以便记住更多词汇。
    note: '*so that I can remember...* 说明了想要的结果。'
  en.b1.unit10.lesson04.teach.q_saving_money:
    title: Leila 说出她自己的目标
