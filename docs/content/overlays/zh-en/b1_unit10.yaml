teaching:
  en.b1.unit10.lesson01.teach.in_order_to:
    title: in order to
    gloss: 为了……
    note: '*in order to* 放在动词前面，说明一个行为的目的。'
    example_gloss: 我学习是为了提高我的英语。
  en.b1.unit10.lesson01.teach.so_that:
    title: so that
    gloss: 以便，为的是
    note: '*so that* 后面接一个完整的从句：主语 + 动词。'
    example_gloss: 我做笔记，以便记住新单词。
  en.b1.unit10.lesson01.teach.goal:
    title: goal
    gloss: 目标
    note: '*goal* 指你想要达到的事。'
    example_gloss: 她的目标是上一门设计课。
  en.b1.unit10.lesson01.teach.improve:
    title: improve
    gloss: 提高，改善
    note: '*improve* 表示让某事变得更好。'
    example_gloss: 丹尼尔想提高自己在工作中的写作能力。
  en.b1.unit10.lesson01.teach.save_money:
    title: save money
    gloss: 存钱，省钱
    note: '*save money* 表示把钱留到以后用，而不是花掉。'
    example_gloss: 蕾拉为她的下一门课存钱。
  en.b1.unit10.lesson01.teach.prepare:
    title: prepare
    gloss: 准备
    note: '*prepare* 表示为某事做准备。'
    example_gloss: 每次开会前，我都会准备问题。
  en.b1.unit10.lesson02.teach.evening_class:
    title: 用 'in order to' 表示目的
    gloss: 我在上夜校课程，为的是提高我的英语。
    note: '*in order to improve* 说明了上夜校课程的目的。'
  en.b1.unit10.lesson02.teach.study_so_that:
    title: 用 'so that' 表示目的
    gloss: 我每晚学习，以便记住更多词汇。
    note: '*so that* 后面是一个完整的句子：*I can remember more vocabulary*。'
  en.b1.unit10.lesson02.teach.grammar_purpose:
    title: '''in order to'' 和 ''so that'''
    gloss: 我学习是为了提高我的英语。我学习，以便记住更多。
    note: '*in order to* 放在动词前面；*so that* 放在完整的从句前面。汉语里“为了”“以便”都可以表示目的，而英语要根据后面是动词还是完整的句子，来选用 *in order to* 或 *so that*。'
  en.b1.unit10.lesson03.teach.design_course:
    title: design course
    gloss: 设计课程
    note: '*design course* 指学习如何设计事物外观和功能的课程。'
    example_gloss: 蕾拉在为一门设计课存钱。
  en.b1.unit10.lesson03.teach.clear_goal:
    title: clear goal
    gloss: 明确的目标
    note: '*clear goal* 指具体、容易理解的目标。'
    example_gloss: 一个明确的目标能帮你决定下一步该做什么。
  en.b1.unit10.lesson03.teach.reading_passage:
    title: 阅读：明确的目标
    gloss: 丹尼尔和蕾拉都有明确的目标。丹尼尔在上夜校课程，为的是提高他工作用的英语。他练习写简短的更新，以便听起来更专业。蕾拉在存钱，以便明年能上一门设计课。她阅读课程介绍，为的是选出合适的项目。
    note: 一篇关于目标的短文，用到了 *in order to* 和 *so that*。
  en.b1.unit10.lesson04.teach.q_why_evening_class:
    title: Leila 询问 Daniel 的目标
