teaching:
  en.b1.unit15.lesson01.teach.complain:
    title: complain
    gloss: 投诉，抱怨
    note: '*complain* 指正式地表示某事不对劲或不令人满意。'
    example_gloss: Mia决定就这把受损的椅子投诉。
  en.b1.unit15.lesson01.teach.damaged:
    title: damaged
    gloss: 受损的，损坏的
    note: '*damaged* 形容坏了或受损的商品。'
    example_gloss: 椅子送到时已经是坏的。
  en.b1.unit15.lesson01.teach.refund:
    title: refund
    gloss: 退款
    note: '*refund* 指商品退回或有缺陷时退还的钱。'
    example_gloss: Mia要求退款。
  en.b1.unit15.lesson01.teach.replacement:
    title: replacement
    gloss: 替换品，换货
    note: '*replacement* 指用来替代有缺陷商品的新商品。'
    example_gloss: 公司提出改为换货。
  en.b1.unit15.lesson01.teach.resolve:
    title: resolve
    gloss: 解决
    note: '*resolve* 指彻底解决一个问题。'
    example_gloss: 客服人员承诺会尽快解决这个问题。
  en.b1.unit15.lesson01.teach.issue:
    title: issue
    gloss: 问题，事项
    note: '*issue* 指需要处理的问题。'
    example_gloss: Mia把问题讲得清清楚楚。
  en.b1.unit15.lesson02.teach.writing_to_complain:
    title: I'm writing to complain about + 名词
    gloss: 我写信是想投诉一件受损的商品。
    note: '*I''m writing to complain about* 是礼貌的书面投诉开头。'
  en.b1.unit15.lesson02.teach.would_like_refund:
    title: I would like + 名词
    gloss: 我想为这件商品申请退款。
    note: '*I would like a refund for* 是礼貌地要求退还货款。'
  en.b1.unit15.lesson02.teach.grammar_complaint_structure:
    title: 礼貌投诉的结构
    gloss: 一封礼貌的书面投诉通常有三个部分：说明问题（I'm writing to complain about...），说明已经发生了什么（it arrived damaged / it stopped working），并提出明确的解决要求（I would like a refund / I would like a replacement）。
    note: 结构：说明问题，说明发生了什么，提出明确的解决要求。
  en.b1.unit15.lesson03.teach.desk_chair:
    title: desk chair
    gloss: 办公椅
    note: '*desk chair* 指坐在书桌前使用的椅子。'
    example_gloss: Mia为她的家庭办公室订了一把新办公椅。
  en.b1.unit15.lesson03.teach.as_soon_as_possible:
    title: as soon as possible
    gloss: 尽快
    note: '*as soon as possible* 指不要无谓地拖延。'
    example_gloss: Mia要求尽快换货。
  en.b1.unit15.lesson03.teach.reading_passage:
    title: 阅读：关于办公椅的投诉
    gloss: 尊敬的GreenDesk团队：我写信是想投诉一件受损的商品。我上周为我的家庭办公室订了一把办公椅，但送到时有一个轮子是坏的。我希望尽快换货。请告诉我接下来该怎么办。谢谢。Mia
    note: 一封简短而礼貌的投诉信。
  en.b1.unit15.lesson04.teach.q_calling_to_complain:
    title: Mia 打电话投诉办公椅
    gloss: Mia说：您好，我打电话是想投诉我订的一把办公椅。
    note: '*I''m calling to complain about* 是礼貌的电话投诉开头。'
  en.b1.unit15.lesson04.teach.a_whats_the_issue:
    title: 工作人员询问问题所在
    gloss: 客服人员说：很抱歉听到这个情况。椅子有什么问题？
    note: '*I''m sorry to hear that* 是礼貌且体贴的回应。'
  en.b1.unit15.lesson04.teach.q_broken_wheel_cant_use:
    title: Mia 描述问题
    gloss: Mia说：送到时有一个轮子是坏的，所以我没法用。
    note: '*it arrived with a broken wheel* 说明已经发生了什么。'
  en.b1.unit15.lesson04.teach.a_refund_or_replacement:
    title: 工作人员提供解决方案
    gloss: 客服人员说：我明白了。您想要退款还是换货？
    note: '*would you like... or...* 让顾客有所选择。'
  en.b1.unit15.lesson04.teach.q_prefer_replacement:
    title: Mia 选择替换品
    gloss: Mia说：如果可以的话，我想换货。
    note: '*I would prefer a replacement, if that''s possible* 礼貌地说明自己的偏好。'
  en.b1.unit15.lesson04.teach.a_resolve_send_friday:
    title: 工作人员确认解决方案
    gloss: 客服人员说：当然可以。我们会解决这个问题，周五之前给您寄一把新椅子。
    note: '*we''ll resolve this and send... by Friday* 是带有具体日期的明确承诺。'
