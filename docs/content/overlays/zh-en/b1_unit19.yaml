teaching:
  en.b1.unit19.lesson01.teach.main_point:
    title: main point
    gloss: 要点，主旨
    note: '*main point* 指一篇文章或一次谈话中最重要的想法。'
    example_gloss: 这次会议的要点是预算。
  en.b1.unit19.lesson01.teach.detail:
    title: detail
    gloss: 细节
    note: '*detail* 指用来支持要点的一点补充信息。'
    example_gloss: Mia补充了一个关于日程安排的小细节。
  en.b1.unit19.lesson01.teach.in_summary:
    title: in summary
    gloss: 总之，概括起来
    note: '*in summary* 用在较长的说明之后，引出一段简短的总结。'
    example_gloss: 总之，这个项目下个月完成。
  en.b1.unit19.lesson01.teach.in_short:
    title: in short
    gloss: 简而言之
    note: '*in short* 是对话中直奔主题的一种快捷、随意的说法。'
    example_gloss: 简而言之，团队对这个计划达成了一致。
  en.b1.unit19.lesson01.teach.in_your_own_words:
    title: in your own words
    gloss: 用你自己的话
    note: '*in your own words* 要求对方不要照搬原文，而是用自己的话来解释。'
    example_gloss: 请用你自己的话解释一下这个计划。
  en.b1.unit19.lesson02.teach.in_summary_budget_client:
    title: In summary, ...（做总结）
    gloss: 总之，这次会议讨论了预算和新客户。
    note: '*In summary, the meeting covered...* 用来引出对讨论内容的简短总结。'
  en.b1.unit19.lesson02.teach.main_point_under_budget:
    title: The main point was that ...（说出要点）
    gloss: 要点是我们这个月没有超出预算。
    note: '*The main point was that...* 用来说出最重要的想法，并把它和次要的细节区分开。'
  en.b1.unit19.lesson02.teach.grammar_summary_structure:
    title: 总结的结构
    gloss: 总结可以用 In summary 或 In short 这样的表达开头，然后按顺序只说要点，句子要简短。用 The main point was that... 来突出最重要的那一个想法，把它和较小的细节区分开。
    note: 结构：以 In summary／In short 开头，用 The main point was that... 引出要点。
  en.b1.unit19.lesson03.teach.condensed:
    title: condensed
    gloss: 精简的，浓缩的
    note: '*condensed* 形容缩短了篇幅但保留了要点的总结。'
    example_gloss: Mia给了Daniel一份简明的会议总结。
  en.b1.unit19.lesson03.teach.original_article:
    title: original article
    gloss: 原文，原始文章
    note: '*original article* 指被概括之前的完整原文。'
    example_gloss: Leila的总结与原文非常吻合。
  en.b1.unit19.lesson03.teach.reading_passage:
    title: 阅读：概括一篇短文
    gloss: Leila为她的设计课读了一篇关于职场沟通的长文章。原文有很多例子和背景信息，但Leila只需要要点。她用自己的话写了一份精简的总结：职场沟通在信息清晰简短、人们遇到问题就提问而不是靠猜时效果最好。她省略了大部分例子，因为它们只是细节，不是要点。她的老师说，这份总结按正确的顺序保留了重要的观点。
    note: 一篇简短的阅读短文。
  en.b1.unit19.lesson04.teach.q_missed_meeting:
    title: Daniel 请求解释
    gloss: Daniel说：我没参加那次会议。你能告诉我发生了什么吗？
    note: 一个请求别人做总结的开放式问题。
  en.b1.unit19.lesson04.teach.a_in_short_budget_client:
    title: Mia 做简短总结
    gloss: Mia说：当然可以。简而言之，我们讨论了预算和新客户。
    note: '*in short* 引出一个快捷、随意的总结。'
  en.b1.unit19.lesson04.teach.q_main_point_budget:
    title: Daniel 询问要点
    gloss: Daniel说：关于预算，要点是什么？
    note: 一个针对要点的追问。
  en.b1.unit19.lesson04.teach.a_under_budget_this_month:
    title: Mia 说出要点
    gloss: Mia说：要点是我们这个月没有超出预算。
    note: '*the main point was that...* 突出最重要的想法。'
  en.b1.unit19.lesson04.teach.q_other_details:
    title: Daniel 询问细节
    gloss: Daniel说：好。还有其他细节吗？
    note: 一个关于次要细节的追问。
  en.b1.unit19.lesson04.teach.a_client_meeting_moved:
    title: Mia 提到一个小细节
    gloss: Mia说：只有一个小细节：客户会议改到了下周。
    note: '*just one small detail* 引出一个小的补充事实。'
  en.b1.unit19.lesson04.teach.q_thanks_for_summary:
    title: Daniel 感谢 Mia
    gloss: Daniel说：谢谢你的总结。这很有帮助。
    note: 对话以简短而表示感谢的话结束。
