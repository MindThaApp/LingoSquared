teaching:
  en.b1.unit16.lesson01.teach.advice:
    title: advice
    gloss: 建议，忠告
    note: '*advice* 指关于某人应该怎么做的意见。'
    example_gloss: Leila给了Daniel一些有用的建议。
  en.b1.unit16.lesson01.teach.suggest:
    title: suggest
    gloss: 提议，建议
    note: '*suggest* 指提出一个想法供对方考虑。'
    example_gloss: Leila提议了一个应对工作量的办法。
  en.b1.unit16.lesson01.teach.overwhelmed:
    title: overwhelmed
    gloss: 不堪重负的，应接不暇的
    note: '*overwhelmed* 指感觉要做的事情超出了自己能应付的范围。'
    example_gloss: Daniel被他的两个项目压得喘不过气来。
  en.b1.unit16.lesson01.teach.prioritize:
    title: prioritize
    gloss: 确定优先级，优先处理
    note: '*prioritize* 指先做最重要的任务。'
    example_gloss: Daniel决定优先处理截止日期更近的那个项目。
  en.b1.unit16.lesson01.teach.workload:
    title: workload
    gloss: 工作量
    note: '*workload* 指一个人需要完成的全部工作量。'
    example_gloss: Daniel三月加入团队后，工作量越来越大。
  en.b1.unit16.lesson01.teach.decline:
    title: decline
    gloss: 婉拒，谢绝
    note: '*decline* 指礼貌地拒绝一个建议或邀请。'
    example_gloss: Daniel可以接受这个建议，也可以礼貌地婉拒。
  en.b1.unit16.lesson02.teach.if_i_were_you:
    title: if I were you, I would + 动词原形
    gloss: 如果我是你，我会去跟你的经理谈谈。
    note: '*if I were you, I would* 是用来提建议的非现实假设句式。'
  en.b1.unit16.lesson02.teach.you_should_prioritize:
    title: you should + 动词原形
    gloss: 你应该优先处理截止日期更近的那个项目。
    note: '*you should* 是直接的建议。'
  en.b1.unit16.lesson02.teach.how_about:
    title: how about + -ing
    gloss: 你请一位同事帮忙怎么样？
    note: '*how about + -ing* 是一种更委婉的提议方式。'
  en.b1.unit16.lesson02.teach.grammar_advice_forms:
    title: 给出建议的句型
    gloss: 提建议有几种不同的形式：If I were you, I would...（非现实假设）、You should...（直接建议）和 How about + -ing...?（更委婉的提议）。可以根据你想让语气多肯定来选择较强或较委婉的说法。
    note: 结构：可选用非现实假设、直接建议或委婉的提议。
  en.b1.unit16.lesson03.teach.deadline:
    title: deadline
    gloss: 截止日期
    note: '*deadline* 指某件事必须完成的日期。'
    example_gloss: Daniel最近的截止日期是下周五。
  en.b1.unit16.lesson03.teach.that_makes_sense:
    title: that makes sense. I'll try it.
    gloss: 有道理。我会试试的。
    note: '*that makes sense* 表示理解并接受了对方的建议。'
    example_gloss: 有道理。我这周就试试。
  en.b1.unit16.lesson03.teach.reading_passage:
    title: 阅读：工作太多时的建议
    gloss: 嗨，Leila，我这周感觉不堪重负。我在带两个项目，而且晚上还要上课。有什么建议吗？嗨，Daniel，如果我是你，我会去跟你的经理谈谈工作量的问题。你还应该优先处理截止日期更近的那个项目。请Mia帮忙做另一个项目怎么样？谢谢，有道理。我会试试，再告诉你效果如何。
    note: 同事之间一段简短而亲切的建议。
  en.b1.unit16.lesson04.teach.q_overwhelmed_two_projects:
    title: Daniel 说明他的问题
    gloss: Daniel说：我有点不堪重负。我在带两个项目，而且每周还有三个晚上要上课。
    note: '*a little overwhelmed* 形容觉得工作有点多了。'
  en.b1.unit16.lesson04.teach.a_talk_to_manager:
    title: Leila 给出第一条建议
    gloss: Leila说：如果我是你，我会去跟你的经理谈谈工作量的问题。
    note: '*if I were you, I would* 是非现实的假设句式。'
  en.b1.unit16.lesson04.teach.q_dont_want_to_seem:
    title: Daniel 犹豫
    gloss: Daniel说：这是个好主意，但我不想让人觉得我应付不来。
    note: '*I don''t want to seem like* 表达对自己给人什么印象的担心。'
  en.b1.unit16.lesson04.teach.a_prioritize_and_how_about:
    title: Leila 提出两个具体建议
    gloss: Leila说：你应该先优先处理截止日期更近的那个项目。请一位同事帮忙做另一个项目怎么样？
    note: '*you should* 和 *how about* 分别是直接的建议和委婉的提议。'
  en.b1.unit16.lesson04.teach.q_ask_mia_this_week:
    title: Daniel 接受建议
    gloss: Daniel说：这个主意不错。我去问问Mia这周有没有时间。
    note: '*I like that* 表示接受了建议。'
  en.b1.unit16.lesson04.teach.a_sounds_like_solid_plan:
    title: Leila 确认计划
    gloss: Leila说：听起来是个靠谱的计划。
    note: 对话以简短而鼓励的话结束。
