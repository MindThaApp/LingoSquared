teaching:
  en.a1.unit47.lesson01.teach.appointment:
    title: appointment
    gloss: 预约
    note: '*appointment* 的意思是预约、约定的时间。'
    example_gloss: 我周四有个预约。
  en.a1.unit47.lesson01.teach.available:
    title: available
    gloss: 有空的 / 可用的
    note: '*available* 的意思是有空的、可用的。'
    example_gloss: 你周四有空吗？
  en.a1.unit47.lesson01.teach.book:
    title: book
    gloss: 预订 / 预约
    note: '*book* 在这里是动词，意思是预订、预约，不是名词“书”。'
    example_gloss: 我想预约一个时间。
  en.a1.unit47.lesson01.teach.confirm:
    title: confirm
    gloss: 确认
    note: '*confirm* 的意思是确认。'
    example_gloss: 你能确认一下时间吗？
  en.a1.unit47.lesson01.teach.reschedule:
    title: reschedule
    gloss: 改期
    note: '*reschedule* 的意思是把已定好的约改到另一个时间。'
    example_gloss: 我们能改到周五吗？
  en.a1.unit47.lesson02.teach.id_like_to_make_an_appointment:
    title: I'd like to make an appointment.
    gloss: 我想预约一个时间。
    note: '*I''d* 是 I would 的缩写。*I''d like to ...* 比直接说 *I want to ...* 更礼貌，中文里常用“我想……”或“我想要……”来表达。'
  en.a1.unit47.lesson02.teach.are_you_available_on_friday:
    title: Are you available on Friday?
    gloss: 你周五有空吗？
    note: 说星期几时，英语要在前面加介词 *on*：*on Friday*。中文说“周五”时不需要介词。
  en.a1.unit47.lesson02.teach.what_time_works_for_you:
    title: What time works for you?
    gloss: 你几点方便？
    note: '*works for you* 在这里的意思是“你觉得合适、方便”，是固定说法，不是字面上的“工作”。'
  en.a1.unit47.lesson02.teach.that_time_works_for_me:
    title: That time works for me.
    gloss: 那个时间我可以。
    note: '*That time works for me.* 的意思是“那个时间我可以。”'
  en.a1.unit47.lesson02.teach.can_we_reschedule_for_monday:
    title: Can we reschedule for Monday?
    gloss: 我们能改到周一吗？
    note: '*reschedule for ...* 用 *for* 而不是 *to* 来表示新的日期或时间。'
  en.a1.unit47.lesson02.teach.your_appointment_is_confirmed:
    title: Your appointment is confirmed.
    gloss: 您的预约已确认。
    note: '*Your appointment is confirmed.* 的意思是“您的预约已确认。”'
  en.a1.unit47.lesson03.teach.dialogue_line1:
    title: Mia 的问题
    gloss: Mia 问：Leila，Max 还好吗？它最近好像有点累。
    note: '*He seems a little tired lately.* 的意思是“它最近好像有点累。”'
  en.a1.unit47.lesson03.teach.dialogue_line2:
    title: Leila 的解释
    gloss: Leila 说：它没事，别担心。只是该做年度体检了。我得给兽医打个电话。
    note: '*due for* 的意思是“该做……了”，用来说某件事到了该做的时候。'
  en.a1.unit47.lesson03.teach.dialogue_line3:
    title: Leila 给兽医打电话
    gloss: Leila 说：你好，我想为我的狗预约一次体检。
    note: '*I''d like to* 比 *I want to* 更礼貌。中文里通常直接说“我想……”，也可以加上“请问”之类的客气话。'
  en.a1.unit47.lesson03.teach.dialogue_line4:
    title: Mia 的问题
    gloss: Mia 问：他们怎么说？
    note: '*did they say* 在过去时的疑问句中用 did 作助动词。'
  en.a1.unit47.lesson03.teach.dialogue_line5:
    title: "Leila 的回答"
    gloss: Leila 说：他们周四下午三点有空。
    note: '*at 3pm* 用 *at* 表示具体的时刻。'
  en.a1.unit47.lesson03.teach.dialogue_line6:
    title: Mia 确认时间
    gloss: Mia 问：那个时间你方便吗？
    note: '*Does that time work for you?* 是 *that time works for you* 的疑问形式，要借助助动词 does 来构成问句。'
  en.a1.unit47.lesson03.teach.dialogue_line7:
    title: Leila 的确认
    gloss: Leila 说：好，我可以。周四下午三点——谢谢！Max 的预约已经确认了。
    note: '*Max''s appointment* 用 ''s 表示所属关系，相当于中文的“Max 的预约”。'
  en.a1.unit47.lesson04.teach.reading_passage:
    title: 关于如何预约的短文
    gloss: 如何预约：如果你要看医生、牙医或使用其他服务，通常需要先预约。打电话说明你想预约。前台人员会告诉你哪些日子和时间有空。选一个对你合适的时间，他们就会确认你的预约。如果有变化，可以再打电话申请改期。上周，Leila 给兽医打电话，为她的狗 Max 预约年度体检。他们周四下午三点有空，Leila 确认了这个时间。Daniel 也有一个预约——他周一上午要去看牙医做检查。他说他并不紧张，只是这周有点忙。
    note: '*a little busy this week* 的意思是“这周有点忙”。'
