teaching:
  en.b1.unit12.lesson01.teach.although:
    title: although
    gloss: 虽然
    note: '*although* 后面接完整的从句，在同一个句子里表示转折。'
    example_gloss: 虽然办公室很安静，Mia还是更喜欢在家工作。
  en.b1.unit12.lesson01.teach.even_though:
    title: even though
    gloss: 尽管，即使
    note: '*even though* 比 *although* 更强调转折。'
    example_gloss: 尽管Leila的公寓很小，她还是能保持专注。
  en.b1.unit12.lesson01.teach.despite:
    title: despite
    gloss: 尽管，不顾
    note: '*despite* 后面接名词或 -ing 形式，不接完整的从句。'
    example_gloss: 尽管有干扰，Daniel还是按时完成了报告。
  en.b1.unit12.lesson01.teach.however:
    title: however
    gloss: 然而，不过
    note: '*however* 用在句号或分号之后，另起一句。'
    example_gloss: 办公室很安静。不过，Mia还是更喜欢在家工作。
  en.b1.unit12.lesson01.teach.valid_point:
    title: valid point
    gloss: 有道理的观点，好论据
    note: '*valid point* 指合理的或有说服力的观点。'
    example_gloss: 关于专注力，这一点说得有道理。
  en.b1.unit12.lesson01.teach.convince:
    title: convince
    gloss: 说服
    note: '*convince* 指让某人相信某事或接受某种看法。'
    example_gloss: Leila试图说服Mia回办公室。
  en.b1.unit12.lesson02.teach.office_quiet_home:
    title: although + 完整的从句
    gloss: 虽然办公室很安静，Mia还是更喜欢在家工作。
    note: '*although* + 主语 + 动词，构成一个完整的转折从句。'
  en.b1.unit12.lesson02.teach.distractions_report:
    title: despite + 名词
    gloss: 尽管有干扰，Daniel还是按时完成了报告。
    note: '*despite* 后面接名词，不接完整的从句。'
  en.b1.unit12.lesson02.teach.grammar_concession:
    title: although、despite 和 however
    gloss: Although 和 even though 后面接完整的从句：Although the office is quiet, Mia prefers home。Despite 后面接名词或 -ing 形式，不接从句：Despite the distractions, Daniel finishes his report。However 用在句号或分号之后，另起一句：The office is quiet. However, Mia prefers home。
    note: 结构：*although/even though* + 从句；*despite* + 名词／-ing 形式；*however* 用作句子副词，放在句号之后。
  en.b1.unit12.lesson03.teach.flexibility:
    title: flexibility
    gloss: 灵活性
    note: '*flexibility* 指能够轻松调整计划或工作方式。'
    example_gloss: Mia和Leila都认为灵活性很重要。
  en.b1.unit12.lesson03.teach.teamwork:
    title: teamwork
    gloss: 团队合作
    note: '*teamwork* 指以团队的方式一起工作。'
    example_gloss: Leila认为办公室更有利于团队合作。
  en.b1.unit12.lesson03.teach.reading_passage:
    title: 阅读：在哪里工作
    gloss: Mia和Leila对在哪里工作有不同的看法。Mia在家工作，因为那里很舒服。虽然她想念见到同事，但在家里她完成的工作更多。Leila更喜欢在办公室工作。尽管有噪音，她还是喜欢在休息时和同事聊天。即使Mia在专注力方面说得有道理，Leila仍然认为办公室更有利于团队合作。不过，两人都认为灵活性很重要。
    note: 一篇简短的阅读短文，包含转折关系。
  en.b1.unit12.lesson04.teach.q_although_nice_home:
    title: Mia 引出对比
    gloss: Mia说：Leila，虽然办公室不错，但我在家完成的工作更多。
    note: '*although* + 完整的从句，放在句首。'
  en.b1.unit12.lesson04.teach.a_despite_noise_breaks:
    title: Leila 说出她的看法
    gloss: Leila说：我明白，但尽管有噪音，我还是很喜欢在休息时和大家聊天。
    note: '*despite* + 名词（*the noise*）。'
  en.b1.unit12.lesson04.teach.q_valid_point_however:
    title: Mia 认可这一点，但坚持自己的看法
    gloss: Mia说：这一点说得有道理。不过，我还是觉得自己一个人时更专注。
    note: 这里 *however* 用在句号之后，另起一句。
  en.b1.unit12.lesson04.teach.a_even_though_convince:
    title: Leila 逗 Mia
    gloss: Leila说：虽然我更喜欢办公室，但我大概没法说服你改变主意了，对吧？
    note: '*even though* 强调转折。'
  en.b1.unit12.lesson04.teach.q_however_flexibility:
    title: Mia 找到折中方案
    gloss: Mia说：大概不行吧！不过，我们都同意灵活性最重要。
    note: '*however* 把两个相反的想法连接起来，另起一句。'
  en.b1.unit12.lesson04.teach.a_despite_preferences_time:
    title: Leila 以积极的语气结束对话
    gloss: Leila说：尽管我们的偏好不同，我们还是能按时完成所有工作。
    note: '*despite* + 名词短语（*our different preferences*）。'
