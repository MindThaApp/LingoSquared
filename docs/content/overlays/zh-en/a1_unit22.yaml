teaching:
  en.a1.unit22.lesson01.teach.headache:
    title: headache
    gloss: 头痛
    note: '*headache* 的意思是头痛。汉语说“头疼”不分单复数，也没有冠词；英语要说 *a headache*，必须带冠词 *a*。'
    example_gloss: 我头痛。
  en.a1.unit22.lesson01.teach.stomachache:
    title: stomachache
    gloss: 肚子痛
    note: '*stomachache* 的意思是肚子痛。同样要带冠词：*a stomachache*。'
    example_gloss: 我肚子痛。
  en.a1.unit22.lesson01.teach.fever:
    title: fever
    gloss: 发烧
    note: '*fever* 的意思是发烧。要说 *have a fever*，不能说 *have fever*。'
    example_gloss: 我想我发烧了。
  en.a1.unit22.lesson01.teach.cough:
    title: cough
    gloss: 咳嗽
    note: '*cough* 的意思是咳嗽。这个词既是名词又是动词：*a cough*（咳嗽这种症状），*to cough*（咳嗽这个动作）。'
    example_gloss: Daniel咳得很厉害。
  en.a1.unit22.lesson01.teach.sore_throat:
    title: sore throat
    gloss: 喉咙痛
    note: '*sore throat* 的意思是喉咙痛。*sore* 的意思是“酸痛的”；这里同样要带冠词：*a sore throat*。'
    example_gloss: 我喉咙痛。
  en.a1.unit22.lesson02.teach.whats_wrong:
    title: What's wrong?
    gloss: 怎么了？
    note: 用 *What's wrong?* 询问对方有什么问题。*What's* 是 *What is* 的缩写。
  en.a1.unit22.lesson02.teach.i_have_a_headache:
    title: I have a headache.
    gloss: 我头痛。
    note: 用 *I have a...* 说出你的不适。字面意思是“我有……”，和汉语里“我有点头疼”的说法很相近。
  en.a1.unit22.lesson02.teach.i_feel_hot:
    title: I feel hot.
    gloss: 我觉得热。
    note: 用 *I feel...* 说出身体的感觉。*I feel hot* 的字面意思是“我觉得热”。注意英语里要有主语 *I*，不能省略。
  en.a1.unit22.lesson03.teach.rest:
    title: rest
    gloss: 休息
    note: '*rest* 的意思是休息。'
    example_gloss: 我需要休息。
  en.a1.unit22.lesson03.teach.symptom_text:
    title: 一段描述不适的短文
    gloss: 我头痛，喉咙也痛。我想我还发烧了。我需要休息。
    note: 在这段短文里，有人一次说出了好几种不适。
  en.a1.unit22.lesson04.teach.see_a_doctor:
    title: You should see a doctor.
    gloss: 你应该去看医生。
    note: 用 *You should...* 给出简单的建议：“你应该……”。*should* 后面的动词不加 *to*。
  en.a1.unit22.lesson04.teach.q_dont_look_well:
    title: 问问身体怎么样
    gloss: Leila说：你看起来不太好。怎么了？
    note: '*You don''t look well* 的意思是：你看起来不太好。'
  en.a1.unit22.lesson04.teach.a_headache_sore_throat:
    title: Daniel的回答
    gloss: Daniel说：我头痛，喉咙也痛。
    note: Daniel一次说了两种不适。
  en.a1.unit22.lesson04.teach.q_do_you_have_fever:
    title: 询问是否发烧
    gloss: Leila问：你发烧吗？
    note: 用 *Do you have a fever?* 询问某一种具体的症状。
  en.a1.unit22.lesson04.teach.a_not_sure_feel_hot:
    title: Daniel的回答
    gloss: Daniel说：我不确定，但是我觉得热。
    note: Daniel不确定，但说出了自己的感觉。
  en.a1.unit22.lesson04.teach.a_rest_water_doctor:
    title: Leila的建议
    gloss: Leila说：你应该休息，多喝水。如果没有好转，你应该去看医生。
    note: Leila先给出了简单的建议，然后说了什么时候该去看医生。
  en.a1.unit22.lesson04.teach.a_okay_rest_today:
    title: Daniel最后的回答
    gloss: Daniel说：好的，谢谢。我今天会休息。
    note: Daniel接受了建议，并说了他今天的打算。
