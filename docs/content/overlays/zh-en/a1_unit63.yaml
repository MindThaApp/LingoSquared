teaching:
  en.a1.unit63.lesson01.teach.help:
    title: help
    gloss: 帮助
    note: '*help* 既可以是动词“帮助”，也可以是名词“帮助”。注意：*help me*（帮我）里没有 *to*，不需要像汉语“给我帮忙”那样加介词。'
    example_gloss: 你能帮我吗？
  en.a1.unit63.lesson01.teach.carry:
    title: carry
    gloss: 提，搬
    note: '*carry* 的意思是拿着某样东西，把它从一个地方带到另一个地方。'
    example_gloss: 我可以提着它。
  en.a1.unit63.lesson01.teach.heavy:
    title: heavy
    gloss: 重
    note: '*heavy* 的意思是重（指重量）。'
    example_gloss: 这个很重。
  en.a1.unit63.lesson01.teach.bag:
    title: bag
    gloss: 包
    note: '*bag* 的意思是包，也可以指袋子。'
    example_gloss: 这个包很重。
  en.a1.unit63.lesson01.teach.door:
    title: door
    gloss: 门
    note: '*door* 的意思是门。'
    example_gloss: 把门打开。
  en.a1.unit63.lesson01.teach.shelf:
    title: shelf
    gloss: 架子，搁板
    note: '*shelf* 的意思是架子或搁板，例如墙上的架子或柜子里的隔板。复数是 *shelves*。'
    example_gloss: 把它放在架子上。
  en.a1.unit63.lesson02.teach.can_you_help:
    title: Can you help me?
    gloss: 你能帮我吗？
    note: '*Can you...?* 是直接而普通的求助方式。'
  en.a1.unit63.lesson02.teach.bag_heavy:
    title: This bag is heavy.
    gloss: 这个包很重。
    note: 用 *this bag* 指离你近的那个包。
  en.a1.unit63.lesson02.teach.open_door:
    title: Could you open the door?
    gloss: 你能把门打开吗？
    note: '*Could you...?* 比 *Can you...?* 更委婉礼貌，相当于汉语的“能不能麻烦你……”。'
  en.a1.unit63.lesson02.teach.i_can_help:
    title: I can help.
    gloss: 我可以帮忙。
    note: 这句话用来主动提出帮忙。
  en.a1.unit63.lesson02.teach.thank_you_help:
    title: Thank you for your help.
    gloss: 谢谢你的帮助。
    note: '*Thank you for...* 用 *for* 引出感谢的原因，相当于“谢谢你的……”。'
  en.a1.unit63.lesson02.teach.put_on_shelf:
    title: Put it on the shelf.
    gloss: 把它放在架子上。
    note: '*put it on...* 的意思是把某物放在某处。英语不像汉语那样区分“放”“摆”“搁”，统一用 *put*。'
  en.a1.unit63.lesson03.teach.dialogue_line1:
    title: Leila请求帮助
    gloss: Leila说：你好，Daniel。你能帮我吗？
    note: '*Can you help me?* 是请求帮助的基本句子。'
  en.a1.unit63.lesson03.teach.dialogue_line2:
    title: Daniel问需要什么
    gloss: Daniel说：当然。你需要什么？
    note: '*Of course* 的意思是当然。'
  en.a1.unit63.lesson03.teach.dialogue_line3:
    title: 包很重
    gloss: Leila说：这个包很重。
    note: '*heavy* 说明了为什么需要帮助。'
  en.a1.unit63.lesson03.teach.dialogue_line4:
    title: Daniel可以提包
    gloss: Daniel说：我可以提着它。
    note: '*carry it* 里的 *it* 指那个包。英语用 *it* 指物品；汉语写作“它”，不要用指人的“他/她”。'
  en.a1.unit63.lesson03.teach.dialogue_line5:
    title: Leila请他开门
    gloss: Leila说：你也能把门打开吗？
    note: '*Could you...?* 让请求显得有礼貌。'
  en.a1.unit63.lesson03.teach.dialogue_line6:
    title: Daniel问架子的事
    gloss: Daniel说：可以。我能把包放在架子上吗？
    note: Daniel用 *Can I ...?* 主动提出把包放到架子上。
  en.a1.unit63.lesson03.teach.dialogue_line7:
    title: Leila感谢Daniel
    gloss: Leila说：好的，麻烦你了。谢谢你的帮助。
    note: '*Thank you for your help* 是固定的致谢说法。'
  en.a1.unit63.lesson03.teach.dialogue_line8:
    title: Daniel的回应
    gloss: Daniel说：没问题。
    note: '*No problem* 是简短而友好的回答。'
  en.a1.unit63.lesson04.teach.help_note:
    title: 求助便条
    gloss: 求助便条：蓝色的包很重。请把它放在门边的架子上。
    note: 这张便条说明了是哪个包，以及要放到哪里。
  en.a1.unit63.lesson04.teach.reading_passage:
    title: 阅读：一位乐于助人的邻居
    gloss: 一位乐于助人的邻居：Leila有一个很重的蓝色包。她在门边看到了Daniel，就请他帮忙。Daniel把包提了进去。Leila也请他把门打开。然后Daniel把包放在门边的架子上。Leila感谢Daniel的帮助。Daniel说：没问题。后来，Leila写了一张短便条：蓝色的包在架子上。
    note: '*carried* 是 *carry* 的过去式。'
