teaching:
  en.a1.unit56.lesson01.teach.restaurant:
    title: restaurant
    gloss: 餐厅
    note: '*restaurant* 的意思是“餐厅”。'
    example_gloss: 这家餐厅每天晚上都营业。
  en.a1.unit56.lesson01.teach.waiter:
    title: waiter
    gloss: 服务员
    note: '*waiter* 的意思是“服务员”。'
    example_gloss: 服务员非常友好。
  en.a1.unit56.lesson01.teach.table:
    title: table
    gloss: 桌子
    note: '*table* 的意思是“桌子”，在餐厅里也指“餐桌”。'
    example_gloss: 我们的桌子在窗边。
  en.a1.unit56.lesson01.teach.menu:
    title: menu
    gloss: 菜单
    note: '*menu* 的意思是“菜单”。'
    example_gloss: 我可以看一下菜单吗？
  en.a1.unit56.lesson01.teach.order:
    title: order
    gloss: 点餐
    note: '*order* 的意思是“点（菜）”。'
    example_gloss: 我想点鸡肉。
  en.a1.unit56.lesson01.teach.bill:
    title: bill
    gloss: 账单
    note: '*bill* 的意思是“账单”。'
    example_gloss: 账单是十美元。
  en.a1.unit56.lesson02.teach.is_this_table_free:
    title: Is this table free?
    gloss: 这张桌子有人坐吗？
    note: '*free* 在这里的意思是“空着的、没人用的”。'
  en.a1.unit56.lesson02.teach.can_i_order_now:
    title: Can I order now?
    gloss: 我现在可以点菜吗？
    note: '*Can I...?* 是比较直接的询问方式，不如 *could* 正式。'
  en.a1.unit56.lesson02.teach.id_like_the_salad:
    title: I'd like the salad, please.
    gloss: 请给我来一份沙拉。
    note: '*I''d like*（*I would like* 的缩写）是礼貌的点餐说法。'
  en.a1.unit56.lesson02.teach.how_much_is_the_salad:
    title: How much is the salad?
    gloss: 沙拉多少钱？
    note: '*How much is...?* 用来询问价格。'
  en.a1.unit56.lesson02.teach.could_we_have_the_bill:
    title: Could we have the bill, please?
    gloss: 请给我们结账，好吗？
    note: '*Could we have...?* 是礼貌的请求说法。中文里常用“麻烦”“请”来表达礼貌，英语则习惯用 *could* 这样的词来表示礼貌。'
  en.a1.unit56.lesson02.teach.enjoy_your_meal:
    title: Enjoy your meal!
    gloss: 请慢用！
    note: '*Enjoy your meal!* 是服务员在你开始用餐前说的固定说法。字面意思是“享受你的饭菜”，但实际相当于中文的“请慢用”。请把它当作一个整体来记，不要逐字理解。'
  en.a1.unit56.lesson03.teach.dialogue_line1:
    title: Leila 询问桌子
    gloss: Leila：你好！这张桌子有人坐吗？
    note: '*Is this table free?* 里的 *free* 表示“空着的”。'
  en.a1.unit56.lesson03.teach.dialogue_line2:
    title: 服务员带位
    gloss: 服务员：空着的，请坐这里。
    note: '*please sit here* 是简短而礼貌的邀请。'
  en.a1.unit56.lesson03.teach.dialogue_line3:
    title: Mia 要菜单
    gloss: Mia：我可以看一下菜单吗？
    note: '*Could I see...?* 这里同样用了礼貌的 *could*，和 *could we have the bill* 一样。'
  en.a1.unit56.lesson03.teach.dialogue_line4:
    title: 服务员递菜单
    gloss: 服务员：当然，给您。
    note: '*Of course, here you are* 是递东西时的固定说法。'
  en.a1.unit56.lesson03.teach.dialogue_line5:
    title: Leila 点菜
    gloss: Leila：请给我来一份鸡肉。
    note: 这是一条单独的信息：Leila 点的是鸡肉。
  en.a1.unit56.lesson03.teach.dialogue_line6:
    title: Mia 点菜
    gloss: Mia：请给我来一份沙拉。
    note: 这是一条单独的信息：Mia 点的是沙拉。
  en.a1.unit56.lesson03.teach.dialogue_line7:
    title: 服务员祝用餐愉快
    gloss: 服务员：选得好！请慢用！
    note: '*Enjoy your meal!* 是客人开始用餐前的固定结束语。'
  en.a1.unit56.lesson03.teach.dialogue_line8:
    title: Leila 问鸡肉的价格
    gloss: Leila：鸡肉多少钱？
    note: '*How much is...?* 用来询问价格。'
  en.a1.unit56.lesson03.teach.dialogue_line9:
    title: 鸡肉的价格
    gloss: 服务员：鸡肉十二美元。
    note: 这是一条单独的信息：鸡肉的价格，和沙拉的价格、总账单无关。
  en.a1.unit56.lesson03.teach.dialogue_line10:
    title: Mia 问沙拉的价格
    gloss: Mia：沙拉多少钱？
    note: '*How much is...?* 和问鸡肉价格时的问法一样。'
  en.a1.unit56.lesson03.teach.dialogue_line11:
    title: 沙拉的价格
    gloss: 服务员：沙拉七美元。
    note: 这是第二条单独的信息：沙拉的价格。
  en.a1.unit56.lesson03.teach.dialogue_line12:
    title: "Leila 要求结账"
    gloss: Leila：请给我们结账，好吗？
    note: '*Could we have...?* 这里又用了礼貌的 *could*。'
  en.a1.unit56.lesson03.teach.dialogue_line13:
    title: 总账单
    gloss: 服务员：一共十九美元。
    note: 这是第三条单独的信息：总账单，不同于鸡肉和沙拉各自的价格。
  en.a1.unit56.lesson04.teach.restaurant_menu:
    title: 菜单
    gloss: 餐厅菜单：鸡肉 - $12。沙拉 - $7。比萨 - $10。果汁 - $3。
    note: 菜单上列出了四样东西和它们的价格。
  en.a1.unit56.lesson04.teach.reading_passage:
    title: 阅读：在餐厅吃饭
    gloss: 在餐厅吃饭：一天晚上，Leila 和 Mia 决定去市中心试试一家新餐厅。服务员带她们到窗边的一张桌子。他拿来了菜单，上面有鸡肉、沙拉、比萨和果汁。Leila 点了鸡肉，Mia 点了沙拉。鸡肉十二美元，沙拉七美元。吃饭的时候，她们聊起了 Mia 的摄影课。吃完后，服务员送来了账单。两个人一共十九美元。Leila 说这家餐厅很棒，Mia 说她下次想带 Daniel 来这里。
    note: '*ordered* 是 *order*（点餐）的过去式。'
