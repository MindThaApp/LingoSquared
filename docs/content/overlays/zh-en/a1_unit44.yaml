teaching:
  en.a1.unit44.lesson01.teach.spring:
    title: spring
    gloss: 春天
    note: '*spring* 的意思是“春天、春季”。'
    example_gloss: 花儿在春天开放。
  en.a1.unit44.lesson01.teach.summer:
    title: summer
    gloss: 夏天
    note: '*summer* 的意思是“夏天、夏季”。'
    example_gloss: 我夏天去海边。
  en.a1.unit44.lesson01.teach.fall:
    title: fall
    gloss: 秋天
    note: '*fall* 的意思是“秋天”，是美式英语的说法（英式英语说 *autumn*）。'
    example_gloss: 树叶在秋天变色。
  en.a1.unit44.lesson01.teach.winter:
    title: winter
    gloss: 冬天
    note: '*winter* 的意思是“冬天、冬季”。'
    example_gloss: 冬天会下雪。
  en.a1.unit44.lesson01.teach.season:
    title: season
    gloss: 季节
    note: '*season* 的意思是“季节”。'
    example_gloss: 你最喜欢哪个季节？
  en.a1.unit44.lesson02.teach.in_the_summer:
    title: in the summer
    gloss: 在夏天
    note: '*in the summer* 的意思是“在夏天”。英语中季节名称前的 *the* 常可以省略：*in summer* 和 *in the summer* 都正确（*in spring*、*in fall*、*in winter* 同理）。'
    example_gloss: 我们夏天去海边。
  en.a1.unit44.lesson02.teach.leaves_change_color:
    title: the leaves change color
    gloss: 树叶变色
    note: '*the leaves change color* 的意思是“树叶变色”。'
    example_gloss: 秋天，树叶会变色。
  en.a1.unit44.lesson02.teach.it_snows_a_lot:
    title: it snows a lot
    gloss: 雪下得很多
    note: '*it snows a lot* 的意思是“雪下得很多”。'
    example_gloss: 冬天雪下得很多。
  en.a1.unit44.lesson02.teach.flowers_bloom:
    title: flowers bloom
    gloss: 花儿开放
    note: '*flowers bloom* 的意思是“花儿开放”。'
    example_gloss: 花儿在春天开放。
  en.a1.unit44.lesson02.teach.whats_your_favorite_season:
    title: What's your favorite season?
    gloss: 你最喜欢哪个季节？
    note: '*What''s your favorite season?* 询问的是某人最喜欢的季节。'
  en.a1.unit44.lesson02.teach.my_favorite_season_is:
    title: My favorite season is fall.
    gloss: 我最喜欢的季节是秋天。
    note: '*My favorite season is ...* 是表达自己最喜欢哪个季节的固定说法。'
  en.a1.unit44.lesson03.teach.dialogue_line1:
    title: Mia 的提问
    gloss: Mia：你最喜欢哪个季节，Leila？
    note: '*What''s your favorite ...?* 用来询问某人最喜欢什么。'
  en.a1.unit44.lesson03.teach.dialogue_line2:
    title: "Leila 的回答"
    gloss: Leila：秋天。树叶变色，而且天气很适合到户外画画。
    note: '*great weather for painting outside* 的意思是“很适合到户外画画的好天气”。'
  en.a1.unit44.lesson03.teach.dialogue_line3:
    title: Mia 的回应
    gloss: Mia：听起来不错。我最喜欢的季节是春天。
    note: '*My favorite season is spring* 的意思是“我最喜欢的季节是春天”。'
  en.a1.unit44.lesson03.teach.dialogue_line4:
    title: Leila 的提问
    gloss: Leila：为什么是春天？
    note: '*Why spring?* 是询问原因的简短说法。'
  en.a1.unit44.lesson03.teach.dialogue_line5:
    title: "Mia 的回答"
    gloss: Mia：花儿开了，我喜欢给它们拍照，用在我的摄影课上。
    note: '*I love taking photos* 的意思是“我喜欢拍照”。'
  en.a1.unit44.lesson03.teach.dialogue_line6:
    title: Leila 的提问
    gloss: Leila：有道理！你们那儿的春天是暖和还是冷？
    note: '*That makes sense!* 是对合理解释的一种自然回应。'
  en.a1.unit44.lesson03.teach.dialogue_line7:
    title: "Mia 的回答"
    gloss: Mia：通常很暖和，会下一点小雨。很适合在户外散步。
    note: '*with a little rain* 的意思是“有一点小雨”。'
  en.a1.unit44.lesson04.teach.reading_passage:
    title: 关于三个最喜欢的季节的短文
    gloss: Daniel、Leila 和 Mia 最喜欢的季节各不相同。Daniel 最喜欢夏天。天气暖和、阳光明媚的时候，他喜欢踢足球和跑步。Leila 最喜欢秋天，因为她喜欢画树叶变色的样子。Mia 最喜欢春天。她给花儿拍照，用在她的摄影课上。虽然他们喜欢的季节不同，但总能抽出时间一起享受户外时光。
    note: '*even though* 的意思是“尽管、虽然”。'
