teaching:
  en.b1.unit13.lesson01.teach.who:
    title: who
    gloss: ……的人（指人）
    note: 在关系从句中，*who* 指的是人。
    example_gloss: Daniel三月加入团队，现在已经带两个项目了。
  en.b1.unit13.lesson01.teach.which:
    title: which
    gloss: ……的（指物）
    note: 在关系从句中，*which* 指的是事物。
    example_gloss: Leila选的那门设计课六月开始。
  en.b1.unit13.lesson01.teach.that_relative:
    title: that
    gloss: ……的（限定，指人或物）
    note: 在限定性关系从句中，*that* 可以指人，也可以指事物。
    example_gloss: 今天早上打来电话的那位客户想约个会面。
  en.b1.unit13.lesson01.teach.whose:
    title: whose
    gloss: ……的（表示所属）
    note: 在关系从句中，*whose* 表示所属关系。
    example_gloss: 他们正在收尾的那个项目的客户，已经批准了设计方案。
  en.b1.unit13.lesson01.teach.where:
    title: where
    gloss: ……的地方
    note: 在关系从句中，*where* 指的是地点。
    example_gloss: Daniel工作的办公室在市中心。
  en.b1.unit13.lesson01.teach.coworker:
    title: coworker
    gloss: 同事
    note: '*coworker* 指和你一起工作的人。'
    example_gloss: Mia有一位晚上学西班牙语的同事。
  en.b1.unit13.lesson02.teach.colleague_organized:
    title: 限制性定语从句中的 who
    gloss: 坐在Mia旁边的那位同事非常有条理。
    note: 这里的 *who* 引出的信息，是弄清“指的是谁”所必需的。
  en.b1.unit13.lesson02.teach.daniel_leads_projects:
    title: 非限制性定语从句中的 who
    gloss: Daniel三月加入团队，现在已经带两个项目了。
    note: 逗号表示这个关系从句只是补充信息，不是用来确定指的是谁。
  en.b1.unit13.lesson02.teach.grammar_defining:
    title: 限制性和非限制性定语从句
    gloss: 不加逗号的限定性关系从句，用来说明你指的是哪个人或哪件事：The colleague who sits next to Mia is organized。加逗号的非限定性关系从句，用来为已经明确的人补充额外信息：Daniel, who joined in March, already leads two projects。注意：汉语把修饰成分用“的”放在名词前面，而英语的关系从句放在名词后面，并且只有非限定性关系从句才用逗号隔开。
    note: 结构：限定性＝不加逗号，说明指的是谁／什么；非限定性＝加逗号，补充额外信息。
  en.b1.unit13.lesson03.teach.deadline:
    title: deadline
    gloss: 截止日期
    note: '*deadline* 指某件事必须完成的日期或时间。'
    example_gloss: 坐在Mia旁边的那位同事总是按时完成任务。
  en.b1.unit13.lesson03.teach.approve:
    title: approve
    gloss: 批准
    note: '*approve* 指正式同意或认可某事。'
    example_gloss: 客户已经批准了第一版设计。
  en.b1.unit13.lesson03.teach.reading_passage:
    title: 阅读：新办公室
    gloss: Mia和几位让她工作更轻松的人一起共事。Daniel三月加入团队，现在已经带两个项目了。坐在Mia旁边的那位同事非常有条理，总是按时完成任务。他们的办公室在五楼，有一个小厨房，大家在那里一起吃午饭。他们正在收尾的那个项目的客户，已经批准了第一版设计。
    note: 一篇简短的阅读短文，包含限定性和非限定性关系从句。
  en.b1.unit13.lesson04.teach.q_met_the_woman:
    title: Mia 介绍新同事
    gloss: Mia说：Leila，你见过刚加入我们团队的那位女士了吗？
    note: 这里的 *who* 指的是 *the woman*。
  en.b1.unit13.lesson04.teach.a_whose_desk:
    title: Leila 询问新同事的座位
    gloss: Leila说：还没有。她就是办公桌靠窗的那位吗？
    note: '*whose* 表示所属：*whose desk*。'
  en.b1.unit13.lesson04.teach.q_the_designer_who:
    title: Mia 描述新同事
    gloss: Mia说：对，就是她。她是完成了标志项目的那位设计师。
    note: '*who* 指的是 *the designer*。'
  en.b1.unit13.lesson04.teach.a_which_won_award:
    title: Leila 回想起那个项目
    gloss: Leila说：哦，我想起来了。是上个月获奖的那个项目吗？
    note: '*which* 指的是 *the project*。'
  en.b1.unit13.lesson04.teach.q_office_smaller:
    title: Mia 讲她以前的办公室
    gloss: Mia说：没错。她以前工作的办公室比我们的小得多。
    note: '*where* 指的是地点：*the office*。'
  en.b1.unit13.lesson04.teach.a_kitchen_where:
    title: Leila 明白了自己为什么喜欢这间厨房
    gloss: Leila说：难怪她那么喜欢大家一起吃午饭的那个厨房。
    note: '*where* 指的是 *the kitchen*。'
