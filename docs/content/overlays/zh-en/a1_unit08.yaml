    note: '*Sure* 在这里的意思是“好的”或“没问题”。'
  en.a1.unit08.lesson04.teach.q_eggs_too:
    title: Daniel 追加的点单
    gloss: Daniel：是的，再来一打鸡蛋。
    note: 句末的 *too* 的意思是“也”“还”。
  en.a1.unit08.lesson04.teach.a_total:
    title: Leila 的结束语
    gloss: Leila：一共八美元。
    note: Leila 说出了苹果和鸡蛋合在一起的总价。
