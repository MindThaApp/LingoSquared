    gloss: 它新鲜吗？
    note: 买水果、蔬菜等生鲜食品时很有用的问句。
  en.a1.unit08.lesson03.teach.per_pound:
    title: per pound
    gloss: 每磅
    note: '*per pound* 表示每个重量单位的价格，常见于价签上。'
    example_gloss: 苹果每磅两美元。
  en.a1.unit08.lesson03.teach.label_text:
    title: 价签
    gloss: 苹果：每磅 2 美元。鸡蛋：每打 4 美元。大米：每袋 3 美元。
    note: 美元符号写在数字前面（*$2*）。
  en.a1.unit08.lesson04.teach.thats_x_dollars:
    title: That's eight dollars.
    gloss: 一共八美元。
    note: '*That''s X dollars* 相当于中文的“一共 X 美元”。'
  en.a1.unit08.lesson04.teach.q_price:
