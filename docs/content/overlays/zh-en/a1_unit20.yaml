teaching:
  en.a1.unit20.lesson01.teach.bigger:
    title: bigger
    gloss: 更大
    note: '*bigger* 是 *big* 的比较级。'
    example_gloss: 这件夹克比那件大。
  en.a1.unit20.lesson01.teach.smaller:
    title: smaller
    gloss: 更小
    note: '*smaller* 是 *small* 的比较级。'
    example_gloss: 这件衬衫比那件小。
  en.a1.unit20.lesson01.teach.cheaper:
    title: cheaper
    gloss: 更便宜
    note: '*cheaper* 是 *cheap* 的比较级。'
    example_gloss: 这件衬衫比那件便宜。
  en.a1.unit20.lesson01.teach.more_expensive:
    title: more expensive
    gloss: 更贵
    note: 较长的形容词，如 *expensive*，用 *more* 来构成比较级，而不是加 *-er*。汉语用“更”，*more* 的作用与它相近。
    example_gloss: 这件夹克比那件贵。
  en.a1.unit20.lesson01.teach.faster:
    title: faster
    gloss: 更快
    note: '*faster* 是 *fast* 的比较级。'
    example_gloss: 我的车比他的车快。
  en.a1.unit20.lesson02.teach.which_is_cheaper:
    title: Which bag is cheaper, the small one or the big one?
    gloss: 哪个包更便宜，小的还是大的？
    note: 用 *Which...?* 询问两样东西中哪一个更……，这里问的是哪个更便宜。
  en.a1.unit20.lesson02.teach.small_cheaper_than_big:
    title: The small bag is cheaper than the big bag.
    gloss: 小包比大包便宜。
    note: '*than* 用于直接比较两样东西，相当于汉语的“比”；但位置不同：汉语说“比大包便宜”，英语说 *cheaper than the big bag*。'
  en.a1.unit20.lesson02.teach.big_bag_nicer:
    title: The big bag is nicer than the small bag.
    gloss: 大包比小包好看。
    note: '*nicer* 是 *nice* 的比较级。'
  en.a1.unit20.lesson03.teach.cheapest:
    title: cheapest
    gloss: 最便宜
    note: '*cheapest* 是 *cheap* 的最高级（用于三样或更多的东西）。'
    example_gloss: 这是店里最便宜的衬衫。
  en.a1.unit20.lesson03.teach.car_comparison_text:
    title: 关于比较汽车的短文
    gloss: 红色的车比蓝色的车快，但蓝色的车更便宜。白色的车是三辆车里最便宜的。
    note: 这段短文比较了三辆车：红车比蓝车快，蓝车比红车便宜，白车最便宜。
  en.a1.unit20.lesson04.teach.how_much_cheaper:
    title: How much cheaper?
    gloss: 便宜多少？
    note: '*How much...?* 用来询问差别有多大。'
  en.a1.unit20.lesson04.teach.by_five_dollars:
    title: cheaper by five dollars
    gloss: 便宜五美元
    note: '*by five dollars* 说明确切的差额。'
  en.a1.unit20.lesson04.teach.q_which_bag:
    title: 询问包
    gloss: Leila 问：你喜欢哪个包，小的还是大的？
    note: 这个问题和第二课的相似，不过这次 Leila 问的是 Daniel 觉得哪个包好看。
  en.a1.unit20.lesson04.teach.a_big_nicer_small_cheaper:
    title: Daniel 的回答
    gloss: Daniel 说：大的更好看，但小的更便宜。
    note: Daniel 用 *but* 把两个比较对照起来。
  en.a1.unit20.lesson04.teach.q_how_much_cheaper:
    title: 询问差价
    gloss: Leila 问：便宜多少？
    note: 和上面的问题相同。
  en.a1.unit20.lesson04.teach.a_ten_fifteen_dollars:
    title: 确切的价格
    gloss: Daniel 说：小的十美元，大的十五美元。
    note: Daniel 说出了两个包的价格：十美元和十五美元。
  en.a1.unit20.lesson04.teach.a_cheaper_by_five:
    title: Leila 的结论
    gloss: Leila 说：好，小的便宜五美元。我要小的。
    note: 十五减十等于五，所以小包便宜五美元。
