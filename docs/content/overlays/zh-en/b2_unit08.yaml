course:
  title: B2 英语
  description: 学习 B2 水平的英语，用轻松自然的中文讲解，帮助你进行有层次的交谈、论证、推测和职场讨论。
units:
  en.b2.unit08.synthesis:
    title: Where the sources agree and conflict
lessons:
  en.b2.unit08.lesson01_source_relationships:
    title: 一致、矛盾与依据
  en.b2.unit08.lesson02_linking_sources:
    title: Both sources agree, but...
  en.b2.unit08.lesson03.reading_two_sources:
    title: 阅读：一份调查和一份运营方报告
  en.b2.unit08.lesson04.the_synthesis_dialogue:
    title: Which account is better supported?
teaching:
  en.b2.unit08.lesson01.teach.source:
    title: source
    gloss: 来源，资料来源
    note: '*source* 指提供信息的来源。不要处处都用 *according to*；有时需要说明来源之间是一致还是矛盾。'
    example_gloss: 来源提供信息。
  en.b2.unit08.lesson01.teach.synthesize:
    title: synthesize
    gloss: 综合，整合
    note: '*synthesize* 指把多个来源的信息整合成一个连贯的回答。'
    example_gloss: 综合就是把各个来源的信息结合起来。
  en.b2.unit08.lesson01.teach.evaluate:
    title: evaluate
    gloss: 评估，评判
    note: '*evaluate* 指判断某事物有多有力。'
    example_gloss: 评估就是判断某事物有多有力。
  en.b2.unit08.lesson01.teach.agreement:
    title: agreement
    gloss: 一致
    note: '*agreement* 指各来源对某一点说法相同。'
    example_gloss: 一致意味着各来源说的是同一件事。
  en.b2.unit08.lesson01.teach.conflict:
    title: conflict
    gloss: 矛盾，冲突
    note: '*conflict* 指各来源在某一点上互相抵触或存在分歧。'
    example_gloss: 冲突意味着各来源意见不一。
  en.b2.unit08.lesson01.teach.judgement:
    title: judgment
    gloss: 判断，经过权衡的评价
    note: '*judgment* 是有依据的判断，说明哪个来源更有说服力。美式英语拼作 *judgment*，英式英语也常见 *judgement*。'
    example_gloss: 判断说明哪个来源更有说服力。
  en.b2.unit08.lesson02.teach_agree_conflict:
    title: 既有一致，也有矛盾
    gloss: 两个来源都认为需求增加了，但对原因看法不一。
    note: '*Both sources agree... but they disagree...* 比两个孤立的句子加上反复使用 *according to* 要好。'
  en.b2.unit08.lesson02.teach_by_contrast:
    title: by contrast
    gloss: 相比之下，与此形成对照
    note: '*By contrast* 只在真正对比两个来源或两个观点时使用，不要把它当作万能的连接词。'
  en.b2.unit08.lesson02.teach_better_supported:
    title: better supported
    gloss: 更有依据
    note: '*better supported on the cause* 指关于原因的证据更有力。'
  en.b2.unit08.lesson02.teach_grammar_synthesis:
    title: 构建综合分析
    gloss: 综合分析应当指出各来源在哪里一致、在哪里冲突，以及哪种说法更有依据。
    note: 请用 *agree*、*conflict* 和 *better supported* 来准确说明来源之间的关系。
  en.b2.unit08.lesson03.teach_survey:
    title: survey
    gloss: 问卷调查，调查
    note: '*survey* 收集许多人的回答或意见。'
    example_gloss: 调查可以收集大量意见。
  en.b2.unit08.lesson03.teach_account:
    title: account
    gloss: 叙述，说法
    note: '*account* 是对所发生之事的叙述或解释。'
    example_gloss: 一种叙述说明了发生了什么。
  en.b2.unit08.lesson03.teach.source_a:
    title: Source A
    gloss: 来源 A：乘客调查称，新医院开业后，公交车晚点变得更常见。许多乘客说，这条线路现在很拥挤，尤其是在早晨。调查认为，主要原因是需求上升。
    note: 来源 A 有许多乘客的意见，但这并不一定是关于原因的最有力证据。
  en.b2.unit08.lesson03.teach.source_b:
    title: Source B
    gloss: 来源 B：运营方的报告同意医院开业后需求增加了，但认为司机短缺才是服务晚点的主要原因。报告包含同一时期的人员记录。
    note: '*staffing records* 比单靠乘客的体验更能有力地证明原因。'
  en.b2.unit08.lesson04.teach.q_survey:
    title: Tessa 提到来源 A
    gloss: Tessa 说：我读了两份关于公交晚点的说法。乘客调查称，新医院开业后需求增加了。
    note: 这引入了一个来源，以及关于需求上升的一点。
  en.b2.unit08.lesson04.teach.a_operator:
    title: Rowan 提到来源 B
    gloss: Rowan 说：运营方的报告同意需求增加了，但认为主要问题是司机短缺。
    note: 来源 B 证实了一点，但在原因上看法不同。
  en.b2.unit08.lesson04.teach.q_agree_conflict:
    title: Tessa 做综合
    gloss: Tessa 说：所以这两个来源在需求上升这一点上一致，但在原因上存在冲突。
    note: '*agree on* 和 *conflict about* 概括了来源之间的关系。'
  en.b2.unit08.lesson04.teach.a_better_supported:
    title: Rowan 询问证据
    gloss: Rowan 问：哪种说法更有依据？
    note: 他要的是一个判断，而不只是概括。
  en.b2.unit08.lesson04.teach.q_evidence_compare:
    title: Tessa 比较证据
    gloss: Tessa 说：调查里有许多乘客的意见，但运营方的报告包含人员记录。
    note: 这是关于证据的问题：意见对比记录。
  en.b2.unit08.lesson04.teach.a_judgement_question:
    title: Rowan 询问判断
    gloss: Rowan 问：那么你的判断是什么？
    note: '*judgment* 要求给出有依据的结论。'
  en.b2.unit08.lesson04.teach.q_final_judgement:
    title: Tessa 给出判断
    gloss: Tessa 说：就原因而言，运营方的报告更有依据，不过这份调查有助于展现乘客的体验。
    note: '*although* 让两个来源都保持在视野中，同时仍然给出判断。'
