  en.a1.unit45.lesson02.teach.call_911:
    title: Call 911!
    gloss: 拨打 911！
    note: 在美国遇到紧急情况要拨 *911*，这和不少国家的急救号码不同，要特别记住。
  en.a1.unit45.lesson02.teach.i_need_help:
    title: I need help!
    gloss: 我需要帮助！
    note: '*I need help!* 的意思是“我需要帮助！”'
  en.a1.unit45.lesson02.teach.send_the_police:
    title: Send the police, please.
    gloss: 请派警察来。
    note: '*Send the police, please.* 的意思是“请派警察来。”'
  en.a1.unit45.lesson02.teach.send_an_ambulance:
    title: Send an ambulance, please.
    gloss: 请派一辆救护车来。
    note: '*Send an ambulance, please.* 的意思是“请派一辆救护车来。”'
  en.a1.unit45.lesson02.teach.theres_a_fire:
    title: There's a fire!
    gloss: 着火了！
    note: '*There''s a fire!* 的意思是“着火了！”'
  en.a1.unit45.lesson02.teach.whats_your_emergency:
    title: What's your emergency?
    gloss: 您遇到了什么紧急情况？
    note: 这是你拨打 911 后，美国接警中心的接线员最先会问的标准问题。
  en.a1.unit45.lesson03.teach.dialogue_line1:
    title: Leila 闻到烟味
    gloss: Leila 问：Daniel，是不是有东西在烧？我闻到烟味了！
    note: '*smell* 后面直接接名词，不加介词：I smell smoke 的意思是“我闻到烟味”。注意：*I smell of smoke* 的意思不同，是“我身上有烟味”。'
  en.a1.unit45.lesson03.teach.dialogue_line2:
    title: Daniel 的解释
    gloss: Daniel 说：天哪，锅着火了！我刚才在做晚饭。
    note: '*caught fire* 是固定说法，表示突然着火。'
  en.a1.unit45.lesson03.teach.dialogue_line3:
    title: Leila 的指示
    gloss: Leila 说：保持冷静。把炉子关掉！我去叫人来帮忙。
    note: '*call for help* 的意思是呼救、叫人来帮忙。这里不要漏掉 *for*。'
  en.a1.unit45.lesson03.teach.dialogue_line4:
    title: Daniel 的警告
    gloss: Daniel 说：快点，火越来越大了！
    note: '*getting bigger* 的意思是“变大”：get + 形容词，表示一种变化。'
  en.a1.unit45.lesson03.teach.dialogue_line5:
    title: Leila 拨打紧急电话
    gloss: Leila 说：你好，这是紧急情况。我朋友的厨房着火了。请派消防队来。
    note: 这就是在美国与接警中心通话的样子：那里要拨打 911。
  en.a1.unit45.lesson03.teach.dialogue_line6:
    title: Daniel 松了一口气
    gloss: Daniel 说：谢天谢地。我觉得火现在已经灭了，不过为了保险起见，我们还是到外面等吧。
    note: '*just in case* 的意思是“以防万一、为了保险起见”。'
  en.a1.unit45.lesson03.teach.dialogue_line7:
    title: Leila 的建议
    gloss: Leila 说：好主意。在他们到达之前，在外面等更安全。
    note: '*safer* 是 safe 的比较级，词尾加 -r。中文用“更”来表示比较（更安全），英语则常常改变形容词本身的形式。'
  en.a1.unit45.lesson04.teach.reading_passage:
    title: 关于紧急措施的告示
    gloss: 发生火灾时：第一，保持冷静。第二，立刻离开大楼。不要乘电梯，要走楼梯。第三，到了外面以后，拨打 911 并说出你的地址。最后，在外面等消防队到达。Daniel 的厨房着火后，他和 Leila 就像告示上说的那样在外面等着。消防队很快就到了，并确认一切都安全了。后来，Mia 过来看看他们，得知没有人受伤，她松了一口气。
    note: '*elevator* 是美式英语中表示电梯的词。英式英语说 *lift*。'
