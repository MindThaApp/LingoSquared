teaching:
  en.a1.unit03.lesson01.teach.zero:
    title: zero
    gloss: 零
    note: '*zero* 是英语的数字 0。'
    example_gloss: 我有零个苹果。
  en.a1.unit03.lesson01.teach.one:
    title: one
    gloss: 一
    note: '*one* 是英语的数字 1。'
    example_gloss: 我有一个苹果。
  en.a1.unit03.lesson01.teach.two:
    title: two
    gloss: 二
    note: '*two* 是英语的数字 2。'
    example_gloss: 我有两个苹果。
  en.a1.unit03.lesson01.teach.three:
    title: three
    gloss: 三
    note: '*three* 是英语的数字 3。'
    example_gloss: 我有三个苹果。
  en.a1.unit03.lesson01.teach.four:
    title: four
    gloss: 四
    note: '*four* 是英语的数字 4。'
    example_gloss: 我有四个苹果。
  en.a1.unit03.lesson01.teach.five:
    title: five
    gloss: 五
    note: '*five* 是英语的数字 5。'
    example_gloss: 我有五个苹果。
  en.a1.unit03.lesson01.teach.six:
    title: six
    gloss: 六
    note: '*six* 是英语的数字 6。'
    example_gloss: 我有六个苹果。
  en.a1.unit03.lesson01.teach.seven:
    title: seven
    gloss: 七
    note: '*seven* 是英语的数字 7。'
    example_gloss: 我有七个苹果。
  en.a1.unit03.lesson01.teach.eight:
    title: eight
    gloss: 八
    note: '*eight* 是英语的数字 8。'
    example_gloss: 我有八个苹果。
  en.a1.unit03.lesson01.teach.nine:
    title: nine
    gloss: 九
    note: '*nine* 是英语的数字 9。'
    example_gloss: 我有九个苹果。
  en.a1.unit03.lesson01.teach.ten:
    title: ten
    gloss: 十
    note: '*ten* 是英语的数字 10。'
    example_gloss: 我有十个苹果。
  en.a1.unit03.lesson02.teach.eleven:
    title: eleven
    gloss: 十一
    note: '*eleven* 是不规则的形式，不像中文的“十一”那样直接由“十”和“一”组成。'
    example_gloss: 我家的门牌号是十一。
  en.a1.unit03.lesson02.teach.twelve:
    title: twelve
    gloss: 十二
    note: '*twelve* 同样是不规则的形式，不是由“十”和“二”直接拼成的。'
    example_gloss: 我家的门牌号是十二。
  en.a1.unit03.lesson02.teach.thirteen:
    title: thirteen
    gloss: 十三
    note: 13 到 19 的英语数字是在个位数后加 *-teen*，和中文“十三”“十四”的规律有些相似，只是英语的个位数在前。不过 *thirteen* 的词干有变化：是 *thir-* 而不是 *three*。
    example_gloss: 我家的门牌号是十三。
  en.a1.unit03.lesson02.teach.fifteen:
    title: fifteen
    gloss: 十五
    note: '*fifteen*，不是 *fiveteen*——英语拼写中的一个小小的不规则。'
    example_gloss: 我家的门牌号是十五。
  en.a1.unit03.lesson02.teach.twenty:
    title: twenty
    gloss: 二十
    note: '*twenty* 是英语的数字 20。'
    example_gloss: 我家的门牌号是二十。
  en.a1.unit03.lesson02.teach.twenty_one:
    title: twenty-one
    gloss: 二十一
    note: 英语和中文（二十一）一样，先说十位再说个位：*twenty-one*，中间用连字符连接。
  en.a1.unit03.lesson02.teach.thirty:
    title: thirty
    gloss: 三十
    note: '*thirty* 是英语的数字 30。'
    example_gloss: 这个要三十美元。
  en.a1.unit03.lesson02.teach.forty:
    title: forty
    gloss: 四十
    note: 注意：是 *forty*，不是 *fourty*——*four* 中的 *u* 要去掉。
    example_gloss: 这个要四十美元。
  en.a1.unit03.lesson02.teach.fifty:
    title: fifty
    gloss: 五十
    note: '*fifty* 是英语的数字 50。'
    example_gloss: 这个要五十美元。
  en.a1.unit03.lesson02.teach.hundred:
    title: one hundred
    gloss: 一百
    note: 在英语中，*hundred* 前面总要有 *one* 或 *a*（*one hundred*、*a hundred*），这一点和中文的“一百”相同。
  en.a1.unit03.lesson03.teach.how_old:
    title: How old are you?
    gloss: 你多大了？／您多大年纪？
    note: '*How old are you?* 在任何场合都能用，英语里没有“你”和“您”的区别。'
  en.a1.unit03.lesson03.teach.im_25:
    title: I'm twenty-five years old.
    gloss: 我二十五岁。
    note: 英语的结构是：数字 + *years old*，中文则是：数字 + “岁”。
  en.a1.unit03.lesson03.teach.how_much:
    title: How much is this?
    gloss: 这个多少钱？
    note: 询问某样东西的价格。
  en.a1.unit03.lesson03.teach.its_ten_dollars:
    title: It's ten dollars.
    gloss: 这个十美元。
    note: 回答价格问题的标准说法。
  en.a1.unit03.lesson03.teach.phone_question:
    title: What's your phone number?
    gloss: 你的电话号码是多少？
    note: 询问电话号码。
  en.a1.unit03.lesson03.teach.phone_answer:
    title: It's five-five-five, one-two-three-four.
    gloss: 是 五五五，一二三四。
    note: 英语中电话号码要逐个数字念出，各组之间稍作停顿。
  en.a1.unit03.lesson04.teach.market:
    title: market
    gloss: 市场
    note: 可以买食品和其他商品的地方。
    example_gloss: 我们在市场里。
  en.a1.unit03.lesson04.teach.apples:
    title: apples
    gloss: 苹果（复数）
    note: '*apple* 的复数形式。'
    example_gloss: 这些苹果很新鲜。
  en.a1.unit03.lesson04.teach.opening:
    title: Daniel 开启对话
    gloss: Daniel 问：这个多少钱？
    note: 一个简单的问价问题。
  en.a1.unit03.lesson04.teach.price_five:
    title: Leila 回答
    gloss: Leila 说：五美元。
    note: 回答 Daniel 的问价问题。
  en.a1.unit03.lesson04.teach.ask_apples:
    title: Daniel 询问苹果
    gloss: Daniel 问：那这些苹果多少钱？
    note: '*And* 把这个问题和前一个问题连接起来。'
  en.a1.unit03.lesson04.teach.price_two:
    title: Leila 回答
    gloss: Leila 说：两美元。
    note: 这里用 *They're*，因为 *apples* 是复数。
  en.a1.unit03.lesson04.teach.ask_shop_age:
    title: Daniel 询问店铺开了多久
    gloss: Daniel 说：好的，这家店开了多少年了？
    note: '*How old* 也可以用来问事物，不只是问人。'
  en.a1.unit03.lesson04.teach.shop_age:
    title: Leila 回答
    gloss: Leila 说：开了二十年了！
    note: 结构和问人时相同——*years old* 也可以用在事物上。
