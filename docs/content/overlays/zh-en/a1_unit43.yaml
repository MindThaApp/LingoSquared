teaching:
  en.a1.unit43.lesson01.teach.red:
    title: red
    gloss: 红色
    note: '*red* 的意思是“红色”。'
    example_gloss: 我的车是红色的。
  en.a1.unit43.lesson01.teach.blue:
    title: blue
    gloss: 蓝色
    note: '*blue* 的意思是“蓝色”。'
    example_gloss: 天空是蓝色的。
  en.a1.unit43.lesson01.teach.green:
    title: green
    gloss: 绿色
    note: '*green* 的意思是“绿色”。'
    example_gloss: 草是绿色的。
  en.a1.unit43.lesson01.teach.yellow:
    title: yellow
    gloss: 黄色
    note: '*yellow* 的意思是“黄色”。'
    example_gloss: 太阳是黄色的。
  en.a1.unit43.lesson01.teach.black:
    title: black
    gloss: 黑色
    note: '*black* 的意思是“黑色”。'
    example_gloss: 他的鞋是黑色的。
  en.a1.unit43.lesson01.teach.white:
    title: white
    gloss: 白色
    note: '*white* 的意思是“白色”。'
    example_gloss: 她的衬衫是白色的。
  en.a1.unit43.lesson02.teach.dark_blue:
    title: dark blue
    gloss: 深蓝色
    note: '*dark blue* 在英语中写成两个单词，中间留空格，不连写。'
    example_gloss: 他穿着一件深蓝色的衬衫。
  en.a1.unit43.lesson02.teach.light_green:
    title: light green
    gloss: 浅绿色
    note: '*light green* 和 *dark blue* 一样，写成两个单词，中间留空格，不连写。'
    example_gloss: 她把卧室刷成了浅绿色。
  en.a1.unit43.lesson02.teach.goes_well_with:
    title: goes well with
    gloss: 和……很搭
    note: '*goes well with* 的意思是两种颜色或两件衣服很搭配。'
    example_gloss: 这件蓝衬衫和黑裤子很搭。
  en.a1.unit43.lesson02.teach.too_bright:
    title: too bright
    gloss: 太鲜艳
    note: '*too bright* 的意思是颜色“太鲜艳、太扎眼”。'
    example_gloss: 黄色是很有趣的颜色，但是上班穿太鲜艳了。
  en.a1.unit43.lesson02.teach.whats_your_favorite_color:
    title: What's your favorite color?
    gloss: 你最喜欢什么颜色？
    note: '*What''s your favorite ...?* 用来询问某人最喜欢什么。'
  en.a1.unit43.lesson02.teach.my_favorite_color_is:
    title: My favorite color is blue.
    gloss: 我最喜欢的颜色是蓝色。
    note: '*My favorite ... is ...* 是表达自己最喜欢什么的固定说法。'
  en.a1.unit43.lesson03.teach.dialogue_line1:
    title: Daniel 的提问
    gloss: Daniel：下周我们要做演示，我需要一件新衬衫。你能帮我选个颜色吗？
    note: '*Can you help me* 加动词是请求帮助的说法。'
  en.a1.unit43.lesson03.teach.dialogue_line2:
    title: Mia 的提问
    gloss: Mia：当然可以！你喜欢什么颜色？
    note: '*What colors do you like?* 询问的是某人喜欢哪些颜色。'
  en.a1.unit43.lesson03.teach.dialogue_line3:
    title: "Daniel 的回答"
    gloss: Daniel：我喜欢蓝色和绿色，但不确定哪种看起来比较专业。
    note: '*I''m not sure what looks professional* 的意思是“我不确定什么看起来比较专业”。'
  en.a1.unit43.lesson03.teach.dialogue_line4:
    title: Mia 的建议
    gloss: Mia：深蓝色是个很好的选择。它看起来很专业，而且和黑裤子很搭。
    note: '*It looks professional* 的意思是“它看起来很专业”。'
  en.a1.unit43.lesson03.teach.dialogue_line5:
    title: Daniel 的提问
    gloss: Daniel：这件黄色的呢？
    note: '*What about ...?* 用来提出另一个选择。'
  en.a1.unit43.lesson03.teach.dialogue_line6:
    title: Mia 的建议
    gloss: Mia：黄色是很有趣的颜色，但做演示时太鲜艳了。我会选那件深蓝色的衬衫。
    note: '*I''d choose* 的意思是“我会选……”。'
  en.a1.unit43.lesson03.teach.dialogue_line7:
    title: Daniel 的决定
    gloss: Daniel：谢谢你，Mia。就选深蓝色了！
    note: '*Dark blue it is!* 是一种比较随意的、确认决定的说法。'
  en.a1.unit43.lesson04.teach.reading_passage:
    title: 关于三种最喜欢的颜色的短文
    gloss: Daniel、Leila 和 Mia 最喜欢的颜色各不相同。Daniel 最喜欢蓝色。他说蓝色是一种沉稳的颜色，和他上班穿的几乎所有衣服都很搭。Leila 最喜欢绿色，那是她爱画的植物和花园的颜色。她觉得浅绿色尤其好看。Mia 最喜欢黄色，因为黄色让她想起太阳，总能让她感到开心。虽然他们喜欢的颜色不同，但都认为颜色让每一天更有趣。
    note: '*reminds her of the sun* 的意思是“让她想起太阳”。'
