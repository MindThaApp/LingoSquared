teaching:
  en.a2.unit35.lesson01.teach.pharmacy:
    title: pharmacy
    gloss: 药店
    note: '*pharmacy* 是买药、取药的店铺。'
    example_gloss: 医生诊所旁边有一家药店。
  en.a2.unit35.lesson01.teach.pharmacist:
    title: pharmacist
    gloss: 药剂师
    note: '*pharmacist* 是配药并把药交给你的人。'
    example_gloss: 药剂师给我讲了这种药该怎么吃。
  en.a2.unit35.lesson01.teach.tablet:
    title: tablet
    gloss: 药片
    note: '*tablet* 是一粒可以吞服的固体药。'
    example_gloss: 我早上吃一片药，晚上再吃一片。
  en.a2.unit35.lesson01.teach.dose:
    title: dose
    gloss: 剂量
    note: '*dose* 是一次服用的药量。'
    example_gloss: 剂量是每次一片，每天两次。
  en.a2.unit35.lesson01.teach.refill:
    title: refill
    gloss: 续配的药
    note: '*refill* 是同一种药的一份新包装，不必再去看医生。'
    example_gloss: 我需要续药，因为我的药片快吃完了。
  en.a2.unit35.lesson01.teach.side_effects:
    title: side effects
    gloss: 副作用
    note: '*side effects* 是药物可能给身体带来的额外反应。'
    example_gloss: 药剂师给我讲了这种药的副作用。
  en.a2.unit35.lesson01.teach.grammar_frequency:
    title: 说明多久服用一次
    gloss: 每天一次，每天两次，每天三次，每八小时一次
    note: '*once a day*＝每天一次，*twice a day*＝每天两次，*three times a day*＝每天三次，*every eight hours*＝每八小时一次。'
  en.a2.unit35.lesson02.teach.pick_up_prescription:
    title: 说明为什么站在柜台前
    gloss: 我想取一份处方药。
    note: '*I''d like to...* 是表达自己想做什么的礼貌标准说法。'
  en.a2.unit35.lesson02.teach.take_one_tablet:
    title: 听到的用量说明
    gloss: 每天两次，每次一片，随餐服用。
    note: '*with food* 的意思是随餐服用，也就是不要空腹吃。'
  en.a2.unit35.lesson02.teach.ask_how_many_days:
    title: 询问要服用多久
    gloss: 我应该吃几天？
    note: '*How many...?* 用于可数的东西，例如天数。'
  en.a2.unit35.lesson02.teach.ask_side_effects:
    title: 询问副作用
    gloss: 有副作用吗？
    note: '*Are there any...?* 是询问有没有某样东西的常用问法。'
  en.a2.unit35.lesson02.teach.grammar_should:
    title: 用 should 和 shouldn't 给出指示
    gloss: 您应该随餐服用。您不应该提前停药。
    note: '*should* 表示建议或指示；*shouldn''t* 是它的否定形式。'
  en.a2.unit35.lesson03.teach.before_bed:
    title: before bed
    gloss: 睡前
    note: '*before bed* 的意思是上床睡觉之前。'
    example_gloss: 有些药睡前服用效果更好。
  en.a2.unit35.lesson03.teach.label_text:
    title: 药房标签
    gloss: 感冒药。每天两次，每次一片，随餐服用，连服五天。请勿提前停药。可能的副作用：您可能会觉得疲倦。续药：一次。
    note: 药品标签简明扼要：句子短，没有客套话。
  en.a2.unit35.lesson03.teach.do_not_stop_early:
    title: 标签上的警示说明
    gloss: 请勿提前停药。
    note: '*Do not...* 是祈使句形式的禁止，常见于标签和告示牌上。'
  en.a2.unit35.lesson04.teach.q_pick_up:
    title: Daniel 在柜台报到
    gloss: Daniel 说：你好，我想取一份处方药。
    note: '*Hi* 比 *Hello* 随意，但在柜台前很常用。'
  en.a2.unit35.lesson04.teach.a_what_is_your_name:
    title: 药剂师询问名字
    gloss: 药剂师说：好的。请问您叫什么名字？
    note: 这里的 *Of course* 的意思是“好的，没问题”。
  en.a2.unit35.lesson04.teach.q_doctor_gave_me_medicine:
    title: Daniel 说明用药的原因
    gloss: Daniel 说：Daniel。医生给我开了治重感冒的药。
    note: 这和第 28 单元的看病情节相衔接：还是同一场感冒。
  en.a2.unit35.lesson04.teach.a_here_it_is:
    title: 药剂师说明用量
    gloss: 药剂师说：给您。每天两次，每次一片，随餐服用。
    note: 把东西递给别人时，会说 *Here it is*。
  en.a2.unit35.lesson04.teach.q_how_many_days:
    title: Daniel 问需要多久
    gloss: Daniel 问：我应该吃几天？
    note: 和第 2 课中的问题相同。
  en.a2.unit35.lesson04.teach.a_five_days_no_stopping:
    title: 药剂师的回答
    gloss: 药剂师说：五天。请不要提前停药。
    note: 和第 3 课标签上的指示相同。
  en.a2.unit35.lesson04.teach.q_any_side_effects:
    title: Daniel 询问副作用
    gloss: Daniel 问：有副作用吗？
    note: 和第 2 课中的问题相同。
  en.a2.unit35.lesson04.teach.a_you_may_feel_tired:
    title: 药剂师说明副作用
    gloss: 药剂师说：您可能会觉得疲倦，仅此而已。
    note: 这里的 *but that's all* 的意思是“但也就这样了”。
  en.a2.unit35.lesson04.teach.q_thank_you:
    title: Daniel 感谢药剂师
    gloss: Daniel 说：非常感谢。
    note: '*very much* 让感谢的语气更强烈。'
