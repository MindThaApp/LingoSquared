    note: '*trim* 的意思是“稍微修剪一下”。'
    example_gloss: 我只想稍微修剪一下。
  en.a1.unit52.lesson01.teach.shorter:
    title: shorter
    gloss: 更短
    note: '*shorter* 的意思是“更短”，是 *short* 的比较级。'
    example_gloss: 你能把它剪得再短一点吗？
  en.a1.unit52.lesson01.teach.style:
    title: style
    gloss: 发型
    note: '*style* 的意思是“样式”，这里指“发型”。'
    example_gloss: 我喜欢这个发型。
  en.a1.unit52.lesson01.teach.wash:
    title: wash
    gloss: 洗
    note: '*wash* 的意思是“洗”。'
    example_gloss: 她会先给你洗头。
  en.a1.unit52.lesson02.teach.id_like_a_haircut:
    title: I'd like a haircut, please.
    gloss: 请帮我理个发。
    note: 这里英语用名词 *a haircut*，直接说“一次理发”；中文一般说“理个发”“剪头发”，用的是动词。
  en.a1.unit52.lesson02.teach.just_a_trim:
    title: Just a trim, please.
    gloss: 只要稍微修剪一下，谢谢。
    note: '*Just a trim, please.* 的意思是“只要稍微修剪一下，谢谢。”'
  en.a1.unit52.lesson02.teach.can_you_make_it_a_little_shorter:
    title: Can you make it a little shorter?
    gloss: 能帮我剪得再短一点吗？
    note: '*make it* 加形容词，意思是“把它弄成某种样子”，这里 *make it shorter* 就是“把它剪得更短”。'
  en.a1.unit52.lesson02.teach.the_same_style:
    title: The same style, please.
    gloss: 请剪和以前一样的发型。
    note: '*The same style, please.* 的意思是“请剪和以前一样的发型。”'
  en.a1.unit52.lesson02.teach.how_much_does_a_haircut_cost:
    title: How much does a haircut cost?
    gloss: 理发多少钱？
    note: '*How much does ... cost?* 的意思是“……多少钱？”'
  en.a1.unit52.lesson02.teach.its_twenty_dollars:
    title: It's twenty dollars.
    gloss: 二十美元。
    note: '*It''s twenty dollars.* 的意思是“二十美元。”'
  en.a1.unit52.lesson03.teach.dialogue_line1:
    title: 理发师打招呼
    gloss: 理发师：你好，今天想怎么剪？
    note: '*How can I help you today?* 的意思是“今天想怎么剪？”，也就是询问对方需要什么服务。'
  en.a1.unit52.lesson03.teach.dialogue_line2:
    title: Daniel 的要求
    gloss: Daniel：请帮我理个发。我姐姐下周要来看我。
    note: '*I''d like a haircut* 用名词 *haircut* 表示“理发”，中文则习惯说“理个发”。'
  en.a1.unit52.lesson03.teach.dialogue_line3:
    title: "理发师的提问"
    gloss: 理发师：好的，你想要什么发型？
    note: '*what style do you want* 的意思是“你想要什么发型”。'
  en.a1.unit52.lesson03.teach.dialogue_line4:
    title: Daniel 的想法
    gloss: Daniel：和以前一样的发型，只是剪短一点点。
    note: '*just a little shorter* 的意思是“只是稍微短一点”。'
  en.a1.unit52.lesson03.teach.dialogue_line5:
    title: Mia 的问题
    gloss: Mia：你能先给他洗头吗？
    note: '*Can you wash his hair first?* 的意思是“你能先给他洗头吗？”'
  en.a1.unit52.lesson03.teach.dialogue_line6:
    title: 理发师确认
    gloss: 理发师：当然可以，洗头已经包含在理发费里了。
    note: '*included with* 的意思是“包含在……里”。'
  en.a1.unit52.lesson03.teach.dialogue_line7:
    title: Daniel 问价钱
    gloss: Daniel：太好了。多少钱？
    note: 这里的 *Great.* 的意思是“太好了”，是简短的回应。
  en.a1.unit52.lesson03.teach.dialogue_line8:
    title: 价格
    gloss: 理发师：二十美元。
    note: 这是前面学过的句子，再复习一遍。
  en.a1.unit52.lesson04.teach.reading_passage:
    title: 阅读：去理发店
    gloss: 去理发店：Daniel 的姐姐下周要从芝加哥来看他，所以他决定去理发。Mia 推荐了她最喜欢的理发师，那是她公寓附近一家小理发店，她还陪他一起去了。理发师问他想要什么发型，他说和以前一样，只是剪短一点点。她先给他洗了头，洗头费已经包含在理发费里。这次理发花了二十美元。理完发后，Mia 说他的头发看起来很棒。回家的路上，他们和 Leila 见面，一起喝了咖啡。她感冒后已经好多了，也很喜欢 Daniel 的新发型。
    note: '*looked great* 的意思是“看起来很棒”。'
