  en.a1.unit06.lesson04.teach.q_family:
    title: Leila 询问家人
    gloss: Leila：这是你的家人吗？
    note: '*Is this your family?* 询问照片上是不是自己的家人。'
  en.a1.unit06.lesson04.teach.a_parents:
    title: 关于父母的回答
    gloss: Daniel：是的。这是我的母亲，这是我的父亲。
    note: 完整的回答要分别介绍父母双方。
  en.a1.unit06.lesson04.teach.q_who:
    title: 询问某个人
    gloss: Leila：这是谁？
    note: '*Who is this?* 询问所指的人是谁。'
  en.a1.unit06.lesson04.teach.a_sister_teacher:
    title: 关于姐妹的回答
    gloss: Daniel：这是我的姐妹。她是老师。
    note: '*She''s a teacher.* 说出职业。'
  en.a1.unit06.lesson04.teach.q_brothers:
    title: 询问兄弟
    gloss: Leila：你有兄弟吗？
    note: '*Do you have any brothers?* 专门询问兄弟，而不是泛指兄弟姐妹。'
  en.a1.unit06.lesson04.teach.a_no_one_sister:
    title: 关于兄弟姐妹的回答
    gloss: Daniel：不，没有。我只有一个姐妹。
    note: '*I just have one sister.* 对前面的回答作了补充和限定。'
