  en.a1.unit06.lesson01.teach.father:
    title: father
    gloss: 父亲
    note: '*father* 的意思是父亲。'
    example_gloss: 这是我的父亲。
  en.a1.unit06.lesson01.teach.brother:
    title: brother
    gloss: 兄弟（哥哥或弟弟）
    note: '*brother* 的意思是兄弟。中文要分哥哥和弟弟，英语只用 *brother* 一个词，不区分长幼。'
    example_gloss: 这是我的兄弟。
  en.a1.unit06.lesson01.teach.sister:
    title: sister
    gloss: 姐妹（姐姐或妹妹）
    note: '*sister* 的意思是姐妹。中文要分姐姐和妹妹，英语只用 *sister* 一个词，不区分长幼。'
    example_gloss: 这是我的姐妹。
  en.a1.unit06.lesson01.teach.parents:
    title: parents
    gloss: 父母
    note: '*parents* 的意思是父母（父亲和母亲合在一起）。'
    example_gloss: 这是我的父母。
  en.a1.unit06.lesson01.teach.siblings:
    title: siblings
    gloss: 兄弟姐妹
    note: '*siblings* 的意思是兄弟姐妹（兄弟和姐妹合在一起）。'
    example_gloss: 这是我的兄弟姐妹。
  en.a1.unit06.lesson02.teach.grandmother:
    title: grandmother
    gloss: 祖母／外祖母
    note: '*grandmother* 的意思是祖母或外祖母。中文要分奶奶和外婆，英语不分父系和母系。'
    example_gloss: 这是我的祖母。
  en.a1.unit06.lesson02.teach.grandfather:
    title: grandfather
    gloss: 祖父／外祖父
    note: '*grandfather* 的意思是祖父或外祖父。中文要分爷爷和外公，英语不分父系和母系。'
    example_gloss: 这是我的祖父。
  en.a1.unit06.lesson02.teach.aunt:
    title: aunt
    gloss: 姑姑／阿姨
    note: '*aunt* 的意思是父母的姐妹，或舅舅、叔叔等的妻子。中文要分姑姑、姨妈等，英语只用 *aunt* 一个词。'
    example_gloss: 这是我的姑姑。
  en.a1.unit06.lesson02.teach.uncle:
    title: uncle
    gloss: 叔叔／舅舅
    note: '*uncle* 的意思是父母的兄弟，或姑姑、阿姨等的丈夫。中文要分叔叔、伯伯、舅舅等，英语只用 *uncle* 一个词。'
    example_gloss: 这是我的叔叔。
  en.a1.unit06.lesson02.teach.cousin:
    title: cousin
    gloss: 堂（表）兄弟姐妹
    note: 英语只用一个词 *cousin* 表示男女所有的堂兄弟姐妹和表兄弟姐妹，不分性别、长幼，也不分父系和母系；中文则要分堂、表和性别。
    example_gloss: 这是我的堂（表）兄弟姐妹。
  en.a1.unit06.lesson02.teach.my_mother:
    title: my mother
    gloss: 我的母亲
    note: '*my* 的意思是“我的”。'
  en.a1.unit06.lesson02.teach.your_father:
    title: your father
    gloss: 你的父亲／您的父亲
    note: '*your* 的意思是“你的”或“您的”，英语里没有“你”和“您”的区别，*your* 的形式始终不变。'
  en.a1.unit06.lesson02.teach.his_sister:
    title: his sister
    gloss: 他的姐妹
