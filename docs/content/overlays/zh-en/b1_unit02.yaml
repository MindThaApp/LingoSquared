teaching:
  en.b1.unit02.lesson01.teach.be_able_to:
    title: be able to
    gloss: 能够 / 会
    note: '*be able to* 表示有能力或有机会做某事。'
    example_gloss: 我可以在线续办我的驾照。
  en.b1.unit02.lesson01.teach.manage_to:
    title: manage to
    gloss: 设法做到 / 成功做到
    note: '*manage to* 表示某事成功了，通常是费了一番功夫。'
    example_gloss: 我设法在十分钟内填完了表格。
  en.b1.unit02.lesson01.teach.renew:
    title: renew
    gloss: 续办 / 更新
    note: '*renew* 指在证件到期前办理延期。'
    example_gloss: 我需要续办我的驾照。
  en.b1.unit02.lesson01.teach.license:
    title: license
    gloss: 驾照
    note: '*license* 在这里指允许开车的正式证件（*driver''s license* 的简称）。英式英语中名词拼作 *licence*。'
    example_gloss: 我的驾照这个月到期。
  en.b1.unit02.lesson01.teach.online:
    title: online
    gloss: 在线
    note: '*online* 指通过互联网，而不是去实际的地点。'
    example_gloss: 现在可以在线续办了。
  en.b1.unit02.lesson01.teach.in_person:
    title: in person
    gloss: 亲自 / 到现场
    note: '*in person* 指自己亲自到某处去，而不是在线办理。'
    example_gloss: 去年我必须亲自去一趟。
  en.b1.unit02.lesson02.teach.am_able_to_renew_online:
    title: 表达现在的可能性
    gloss: 我现在可以在线续办我的驾照了。
    note: '*I am able to* 表示现在有可能做某事。'
  en.b1.unit02.lesson02.teach.was_not_able_to_last_year:
    title: 否定过去的可能性
    gloss: 去年我没法在线办理。
    note: '*was not able to* 表示过去当时没有这种可能。'
  en.b1.unit02.lesson02.teach.managed_to_finish:
    title: 说明某事成功了
    gloss: 我设法在十分钟内填完了表格。
    note: '*managed to* 强调事情成功了，通常是费了一番功夫。'
  en.b1.unit02.lesson02.teach.grammar_present_past:
    title: '''be able to'' 的现在和过去用法'
    gloss: 我能续办。我当时能续办。我可以帮你。
    note: '*am able to*（现在）、*was able to*（过去）、*would be able to*（假设或提出帮助）是同一结构的不同形式。'
  en.b1.unit02.lesson03.teach.friend:
    title: friend
    gloss: 朋友
    note: '*friend* 的意思是朋友。'
    example_gloss: 我的朋友上周续办了她的驾照。
  en.b1.unit02.lesson03.teach.system:
    title: system
    gloss: 系统
    note: '*system* 指一种有组织的做事方式。'
    example_gloss: 新系统快多了。
  en.b1.unit02.lesson03.teach.reading_passage:
    title: 阅读：新系统
    gloss: 去年，人们不能在线续办驾照。所有人都得亲自去办公室。今年系统变了。现在人们在家就能办理所有手续。我的朋友米娅十分钟就办完了她的。
    note: 一篇短文，讲新系统如何让续办变得更简单。
  en.b1.unit02.lesson04.teach.q_were_you_able:
    title: Leila 询问驾照
    gloss: 蕾拉说：你能在线续办驾照吗？
    note: '*were you able to* 询问过去是否有可能做到某事。'
  en.b1.unit02.lesson04.teach.a_wasnt_able_office:
    title: Daniel 的回答：线上办不了
    gloss: 丹尼尔说：不，没能办成。我只好亲自去办公室。
    note: '*wasn''t able to* 是 *was not able to* 的口语缩略形式。'
  en.b1.unit02.lesson04.teach.q_really_managed:
    title: Leila 讲她的经历
    gloss: 蕾拉说：真的吗？我在线十分钟就办成了。
    note: '*managed to* 强调蕾拉办得又快又顺利。'
  en.b1.unit02.lesson04.teach.a_next_time_save:
    title: Daniel 想到下一次
    gloss: 丹尼尔说：下次如果我也在线办，就能节省时间了。
    note: 这里的 *would be able to* 表示将来的一种假设性可能。
  en.b1.unit02.lesson04.teach.q_would_help:
    title: Leila 主动提供帮助
    gloss: 蕾拉说：如果你愿意，下次我可以帮你。
    note: 这里的 *would be able to* 用来礼貌地提出帮助。
  en.b1.unit02.lesson04.teach.a_thanks:
    title: Daniel 表示感谢
    gloss: 丹尼尔说：谢谢，那太好了。
    note: '*I''d like that* 是自然地、带着感谢接受提议的说法。'
