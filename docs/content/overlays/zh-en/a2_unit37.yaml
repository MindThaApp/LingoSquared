teaching:
  en.a2.unit37.lesson01.teach.video_call:
    title: video call
    gloss: 视频通话
    note: '*video call* 是一种可以互相看到对方的通话。中文也常说“视频通话”或“视频会议”。'
    example_gloss: 我每周一都和团队开视频通话。
  en.a2.unit37.lesson01.teach.camera:
    title: camera
    gloss: 摄像头
    note: '*camera* 是传送你的画面的设备。'
    example_gloss: 开会前请打开你的摄像头。
  en.a2.unit37.lesson01.teach.microphone:
    title: microphone
    gloss: 麦克风
    note: '*microphone* 是传送你的声音的设备。'
    example_gloss: 我的麦克风是关着的，所以其他人听不到我说话。
  en.a2.unit37.lesson01.teach.connection:
    title: connection
    gloss: 网络连接
    note: '*connection* 是你的电脑与互联网之间的连接。'
    example_gloss: 网络连接很差，所以画面卡住了。
  en.a2.unit37.lesson01.teach.mute:
    title: mute
    gloss: 静音
    note: '*mute* 的意思是关掉自己的声音，让别人听不到你。'
    example_gloss: 我不说话时会把麦克风静音。
  en.a2.unit37.lesson01.teach.face_to_face:
    title: face to face
    gloss: 当面、面对面
    note: '*face to face* 的意思是人在同一个房间里，而不是隔着屏幕交谈。'
    example_gloss: 有些会议当面开比线上开更好。
  en.a2.unit37.lesson01.teach.grammar_comparison:
    title: 用 faster than 和 less ... than 比较
    gloss: 视频通话比上门拜访更快。视频通话没有当面见面那么有人情味。
    note: 较短的形容词加 *-er*，后面接 *than*（*faster than*）。较长的形容词用 *less ... than* 或 *more ... than*。
  en.a2.unit37.lesson02.teach.video_call_every_monday:
    title: 说明视频通话的频率
    gloss: 我每周一都和团队开视频通话。
    note: '*every Monday* 的意思是每个星期一，表示固定的习惯。'
  en.a2.unit37.lesson02.teach.turn_on_your_camera:
    title: 请对方打开摄像头
    gloss: 你能打开摄像头吗？
    note: '*turn on* 的意思是打开，反义词是 *turn off*（关闭）。'
  en.a2.unit37.lesson02.teach.you_were_on_mute:
    title: 说明有人当时被静音了
    gloss: 抱歉，你刚才是静音的。
    note: '*you were on mute* 是固定说法，用于某人因麦克风静音而没被听到的时候。'
  en.a2.unit37.lesson02.teach.useful_but_prefer_face_to_face:
    title: 结合个人喜好表达看法
    gloss: 我觉得视频通话很有用，但我更喜欢当面见人。
    note: 用 *I think ... but I prefer ...* 先说出你的看法，再说你更喜欢什么。
  en.a2.unit37.lesson02.teach.grammar_prefer:
    title: prefer X to Y
    gloss: 比起打电话，我更喜欢视频通话。比起视频通话，我更喜欢当面见面。
    note: 注意：*prefer* 后面接 *to*，不接 *than*：*I prefer video calls to phone calls*。
  en.a2.unit37.lesson03.teach.headphones:
    title: headphones
    gloss: 耳机
    note: '*headphones* 在英语中总是用复数，即使你只用一副。'
    example_gloss: 我戴耳机，这样家人就听不到会议内容。
  en.a2.unit37.lesson03.teach.leilas_message:
    title: Leila 的消息
    gloss: 我的网课现在全都是视频通话。我会打开摄像头，但在老师提问之前，我的麦克风一直保持静音。我戴耳机，因为这样我的网络连接更好。我觉得视频通话很省时间，但我还是更喜欢和同学当面见面。
    note: 这是 Leila 发来的一条轻松随意的消息，讲的是她自己的网课。
  en.a2.unit37.lesson03.teach.mute_until_question:
    title: 说明您何时把麦克风静音
    gloss: 在老师提问之前，我的麦克风一直保持静音。
    note: '*until* 的意思是“直到”：某件事一直持续到某个时刻为止。'
  en.a2.unit37.lesson04.teach.q_lot_of_video_calls:
    title: Leila 询问 Daniel 的工作
    gloss: Leila 问：你工作中有很多视频通话吗？
    note: '*a lot of* 的意思是“很多”，既可以搭配可数名词，也可以搭配不可数名词。'
  en.a2.unit37.lesson04.teach.a_call_every_monday:
    title: Daniel 讲他的固定安排
    gloss: Daniel 说：有，我每周一都和团队开视频通话。
    note: 和第 2 课中的句子相同。
  en.a2.unit37.lesson04.teach.q_turn_on_camera:
    title: Leila 询问摄像头
    gloss: Leila 问：你会打开摄像头吗？
    note: 这是一个简短的追问，用来了解更多信息。
  en.a2.unit37.lesson04.teach.a_always_but_mute:
    title: Daniel 在视频通话中的习惯
    gloss: Daniel 说：总是会，但我不说话时会把麦克风静音。
    note: 这里的 *when I am not speaking* 的意思是：在我没有说话的时候。
  en.a2.unit37.lesson04.teach.q_classes_are_video_calls:
    title: Leila 讲她的课程
    gloss: Leila 说：我的网课现在全都是视频通话。
    note: 这和她在第 33 单元提到的周一和周三的课程相衔接。
  en.a2.unit37.lesson04.teach.a_what_do_you_think:
    title: Daniel 询问她的看法
    gloss: Daniel 问：你觉得它们怎么样？
    note: '*What do you think about them?* 询问对刚才提到的事物的看法。'
  en.a2.unit37.lesson04.teach.q_useful_but_prefer:
    title: Leila 说出她的意见
    gloss: Leila 说：我觉得视频通话很有用，但我更喜欢当面见人。
    note: 和第 2 课中的看法相同。
  en.a2.unit37.lesson04.teach.a_agree_faster_less_personal:
    title: Daniel 同意她的看法
    gloss: Daniel 说：我同意。视频通话比上门拜访更快，但没那么有人情味。
    note: 用 *I agree* 表示赞同。之后通常会说出自己的理由。
  en.a2.unit37.lesson04.teach.q_exactly:
    title: Leila 确认
    gloss: Leila 说：没错。
    note: '*Exactly* 是表示完全同意的简短说法。'
