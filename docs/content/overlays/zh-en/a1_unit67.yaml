  en.a1.unit67.lesson01.teach.visit:
    title: visit
    gloss: 拜访
    note: '*visit* 的意思是去看望某人。'
    example_gloss: 我们很快就会去看你们。
  en.a1.unit67.lesson01.teach.proud:
