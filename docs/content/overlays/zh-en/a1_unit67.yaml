teaching:
  en.a1.unit67.lesson01.teach.news:
    title: news
    gloss: 消息
    note: '*news* 的意思是“消息”。它是不可数名词，用单数形式：*good news*。'
    example_gloss: 我有一个好消息。
  en.a1.unit67.lesson01.teach.family:
    title: family
    gloss: 家人
    note: '*family* 的意思是“家人”或“家庭”。'
