    gloss: 很快
    note: '*soon* 的意思是“很快”。'
    example_gloss: 我们很快就会去看你们。
  en.a1.unit67.lesson02.teach.how_family:
    title: How is your family?
    gloss: 你的家人还好吗？
    note: '*How is your family?* 问的是对方家人过得怎么样。'
  en.a1.unit67.lesson02.teach.good_news:
    title: I have good news.
    gloss: 我有一个好消息。
    note: '*good news* 的意思是“好消息”。'
  en.a1.unit67.lesson02.teach.sister_baby:
    title: My sister has a baby.
    gloss: 我姐姐生了一个宝宝。
    note: '*has a baby* 在这里的意思是我姐姐生了孩子。'
  en.a1.unit67.lesson02.teach.visit_soon:
    title: We will visit soon.
    gloss: 我们很快就会去看你们。
    note: '*will visit* 说的是将来要去的一次拜访。'
  en.a1.unit67.lesson02.teach.proud_of_her:
    title: I am proud of her.
    gloss: 我为她感到自豪。
    note: '*proud of her* 的意思是“为她感到自豪”。'
  en.a1.unit67.lesson02.teach.wonderful:
    title: That is wonderful.
    gloss: 太棒了。
    note: '*That is wonderful* 是对好消息的热情回应。'
  en.a1.unit67.lesson03.teach.dialogue_line1:
    title: Mia 询问家人的情况
    gloss: Mia 说：嗨，Daniel。你的家人还好吗？
    note: '*How is your family?* 是这段对话的核心问句。'
  en.a1.unit67.lesson03.teach.dialogue_line2:
    title: Daniel 有个好消息
    gloss: Daniel 说：他们都很好。我有一个好消息。
    note: '*They are well* 的意思是他们都很好。'
  en.a1.unit67.lesson03.teach.dialogue_line3:
    title: Mia 问是什么消息
    gloss: Mia 说：是什么消息？
    note: '*What is...?* 用来询问更多信息。'
  en.a1.unit67.lesson03.teach.dialogue_line4:
    title: 姐姐生了宝宝
    gloss: Daniel 说：我姐姐生了一个宝宝。
    note: '*My sister has a baby* 是在分享家里的喜讯。'
  en.a1.unit67.lesson03.teach.dialogue_line5:
    title: Mia 热情回应
    gloss: Mia 说：太棒了。
    note: '*wonderful* 听起来热情而积极。'
  en.a1.unit67.lesson03.teach.dialogue_line6:
    title: Daniel 打算去探望
    gloss: Daniel 说：谢谢。我们很快就会去看她。
    note: '*soon* 的意思是“很快”。'
  en.a1.unit67.lesson03.teach.dialogue_line7:
    title: Mia 说 Daniel 一定很自豪
    gloss: Mia 说：你一定很自豪。
    note: '*must be* 表示根据情况推测很可能是这样。'
  en.a1.unit67.lesson03.teach.dialogue_line8:
    title: Daniel 很自豪
    gloss: Daniel 说：我为她感到自豪。
    note: '*of her* 指的是他的姐姐。'
  en.a1.unit67.lesson04.teach.family_note:
    title: 家庭便条
    gloss: 家庭便条：好消息。我姐姐生了一个宝宝。我们很快就会去看她。
    note: 这张便条简短地分享了好消息，还提到了一次拜访。
  en.a1.unit67.lesson04.teach.reading_passage:
    title: 短文：家里的好消息
    gloss: 家里的好消息：Mia 问 Daniel 他的家人怎么样。Daniel 说他们都很好。然后他分享了一个好消息：他姐姐生了一个宝宝。Mia 说这个消息太棒了。Daniel 说他和家人很快就会去看望她。他为姐姐感到自豪。后来，Mia 发来一条简短的消息：我为你的家人感到高兴。
    note: '*shared good news* 的意思是分享了好消息。'
