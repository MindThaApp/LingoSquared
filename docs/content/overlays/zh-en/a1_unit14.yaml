  en.a1.unit14.lesson04.teach.q_free_tonight:
    title: Daniel 的提问
    gloss: 丹尼尔：嗨，蕾拉，我是丹尼尔。你今晚有空吗？
    note: 丹尼尔先自我介绍，然后直接询问她有没有空。
  en.a1.unit14.lesson04.teach.a_repeat_request:
    title: Leila 的请求
    gloss: 蕾拉：不好意思，你能再说一遍吗？
    note: 蕾拉没听清问题，请对方重复。
  en.a1.unit14.lesson04.teach.repeat_question:
    title: Daniel 重复的提问
    gloss: 丹尼尔：你今晚有空吗？
    note: 丹尼尔把同样的问题又说了一遍。
