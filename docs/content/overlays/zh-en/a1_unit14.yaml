    title: Hello, this is Daniel.
    gloss: 你好，我是丹尼尔。
    note: '*this is [Name]* 用于在电话里介绍自己，当面自我介绍则用 *I''m.*'
  en.a1.unit14.lesson01.teach.hi_its:
    title: Hi, it's Leila.
    gloss: 嗨，我是蕾拉。
    note: '*it''s [Name]* 是 *this is [Name].* 的简短随意说法。'
  en.a1.unit14.lesson01.teach.are_you_free:
    title: Are you free tonight?
    gloss: 你今晚有空吗？
    note: '*free* 在这里的意思是“有空”，不是“免费”。'
  en.a1.unit14.lesson02.teach.can_you_repeat:
    title: Sorry, can you repeat that?
    gloss: 不好意思，你能再说一遍吗？
    note: '*Sorry* 用来礼貌地引出请对方重复的请求。'
  en.a1.unit14.lesson02.teach.speak_slowly:
    title: Can you speak more slowly, please?
    gloss: 请你说慢一点好吗？
    note: '*more slowly* 的意思是“更慢地”——是 *slowly.* 的比较级。'
  en.a1.unit14.lesson02.teach.i_cant_hear:
    title: I can't hear you well.
    gloss: 我听不太清你说的话。
    note: '*can''t hear* 的意思是“听不见”——常常是因为信号不好。'
  en.a1.unit14.lesson03.teach.are_you_free_at:
    title: Are you free at 6pm?
    gloss: 你下午六点有空吗？
    note: '*at 6pm* 说明具体的时间。'
  en.a1.unit14.lesson03.teach.text_message_text:
    title: 一条短信
    gloss: 你好，蕾拉，你下午六点有空吗？我们在咖啡馆见面吧。
    note: 一条简短的短信既询问对方的时间，又提出具体的建议。
  en.a1.unit14.lesson03.teach.purpose_summary:
    title: This message is to suggest a meeting time and place.
    gloss: 这条信息是为了提议见面的时间和地点。
    note: '*to suggest* 的意思是“提议、建议”——说明这条信息的目的。'
  en.a1.unit14.lesson04.teach.how_about:
    title: How about 6pm at the cafe?
    gloss: 下午六点在咖啡馆怎么样？
    note: '*How about...?* 用来礼貌地提议时间或地点。'
  en.a1.unit14.lesson04.teach.a_hello:
    title: Leila 的问候
    gloss: 蕾拉：你好，我是蕾拉。
