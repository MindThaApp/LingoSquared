  en.a1.unit05.lesson01.teach.what_time:
    title: What time is it?
    gloss: 现在几点？
    note: '*What time is it?* 是一般地询问时间。'
  en.a1.unit05.lesson01.teach.three_oclock:
    title: It's three o'clock.
    gloss: 现在三点整。
    note: '*It''s three o''clock.* 说的是整点。'
  en.a1.unit05.lesson01.teach.half_past:
    title: It's half past three.
    gloss: 现在三点半。
    note: '*half past three* 是“三点之后过了半小时”，也就是 3:30，和中文的“三点半”对应。注意不要按字面理解成“三点之前”：它指的就是 3:30。'
  en.a1.unit05.lesson01.teach.five_oclock:
    title: It's five o'clock.
    gloss: 现在五点整。
    note: '*It''s five o''clock.* 说的是整点 5:00。'
  en.a1.unit05.lesson02.teach.quarter_past:
    title: It's a quarter past three.
    gloss: 现在三点一刻。
    note: '*It''s a quarter past three.* 的意思是 3:15。'
  en.a1.unit05.lesson02.teach.quarter_to:
    title: It's a quarter to four.
    gloss: 现在差一刻四点。
    note: '*It''s a quarter to four.* 的意思是 3:45。'
  en.a1.unit05.lesson02.teach.ten_past:
    title: It's ten past four.
    gloss: 现在四点十分。
    note: '*It''s ten past four.* 的意思是 4:10。'
  en.a1.unit05.lesson02.teach.ten_to:
    title: It's ten to five.
    gloss: 现在差十分五点。
    note: '*It''s ten to five.* 的意思是 4:50。'
  en.a1.unit05.lesson03.teach.morning:
    title: morning
    gloss: 早晨
    note: '*morning* 指早晨或上午，大约是 6 点到 12 点。'
    example_gloss: 早上好，Daniel！
  en.a1.unit05.lesson03.teach.afternoon:
    title: afternoon
    gloss: 下午
    note: '*afternoon* 指下午，大约是 12 点到 17 点。'
    example_gloss: 我下午工作。
  en.a1.unit05.lesson03.teach.evening:
    title: evening
    gloss: 晚上
    note: '*evening* 指傍晚或晚上，大约是 17 点到 21 点；界限并不严格。'
    example_gloss: 晚上好，Leila！
  en.a1.unit05.lesson03.teach.night:
    title: night
    gloss: 夜间
    note: '*night* 指夜间，大约是 21 点到 6 点。'
    example_gloss: 晚安，Daniel！
  en.a1.unit05.lesson03.teach.at_nine_am:
    title: The store opens at nine in the morning.
    gloss: 商店早上九点开门。
    note: 在英语中，具体时刻前要用 *at*：*at nine*（九点）。中文说“九点”时不需要介词。
  en.a1.unit05.lesson03.teach.at_six_pm:
    title: The store closes at six in the evening.
    gloss: 商店晚上六点关门。
    note: 英语日常口语常用 12 小时制并加上时段（*six in the evening*），中文也常说“晚上六点”；正式的营业时间则常用 24 小时制（18:00）。
  en.a1.unit05.lesson04.teach.opens_at:
    title: opens at
    gloss: ……点开门
    note: '*opens at* + 时刻，表示“在……点开门”。'
    example_gloss: 图书馆九点开门。
  en.a1.unit05.lesson04.teach.closes_at:
    title: closes at
    gloss: ……点关门
    note: '*closes at* + 时刻，表示“在……点关门”。'
    example_gloss: 图书馆六点关门。
  en.a1.unit05.lesson04.teach.q_open:
    title: Daniel 询问营业时间
    gloss: Daniel：图书馆几点开门？
    note: '*What time does ...?* 询问确切的时刻。问句里已经有 *does*，所以动词用 *open*，不加 -s。'
  en.a1.unit05.lesson04.teach.a_open:
    title: 关于开门时间的回答
    gloss: Leila：它早上九点开门。
    note: 完整的回答要说出确切的时刻和时段。
  en.a1.unit05.lesson04.teach.q_close:
    title: 询问关门时间
    gloss: Daniel：那几点关门呢？
    note: '*And* 在同一段对话中引出第二个问题。'
  en.a1.unit05.lesson04.teach.a_close:
    title: 关于关门时间的回答
    gloss: Leila：它晚上六点关门。
    note: 完整的回答在这里也要说出确切的时刻。
  en.a1.unit05.lesson04.teach.closing:
    title: 结束对话
    gloss: Daniel：太好了，九点见！
    note: '*See you at nine!* 表示九点钟再见面。'
