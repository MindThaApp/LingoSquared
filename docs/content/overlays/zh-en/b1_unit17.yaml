teaching:
  en.b1.unit17.lesson01.teach.regret:
    title: regret
    gloss: 遗憾，后悔
    note: '*regret* 指对自己做过或没做的事感到难过。'
    example_gloss: Daniel为错过截止日期而感到后悔。
  en.b1.unit17.lesson01.teach.wish:
    title: wish
    gloss: 愿望，希望
    note: '*wish* 指希望事情当初的结果能与实际不同。'
    example_gloss: Daniel对过去的一周有一个愿望。
  en.b1.unit17.lesson01.teach.mistake:
    title: mistake
    gloss: 错误
    note: '*mistake* 指因判断失误而做错的事。'
    example_gloss: 拖了这么久才求助是个错误。
  en.b1.unit17.lesson01.teach.hindsight:
    title: hindsight
    gloss: 事后回想
    note: '*hindsight* 指事情发生之后才获得的认识。'
    example_gloss: 事后看来，Daniel本该早点开口。
  en.b1.unit17.lesson01.teach.procrastinate:
    title: procrastinate
    gloss: 拖延
    note: '*procrastinate* 指把该做的事往后拖。'
    example_gloss: Daniel一遇到难做的任务，就容易拖延。
  en.b1.unit17.lesson01.teach.delay:
    title: delay
    gloss: 延误，耽搁
    note: '*delay* 指使事情比原计划晚发生的一段时间。'
    example_gloss: 这次延误让Daniel错过了第一个截止日期。
  en.b1.unit17.lesson02.teach.wish_had_asked:
    title: I wish I had + 过去分词
    gloss: 我真希望早点求助。
    note: '*I wish I had asked* 表达对过去没有发生的事的愿望。'
  en.b1.unit17.lesson02.teach.should_have_talked:
    title: I should have + 过去分词
    gloss: 我本该早点跟我的经理谈谈的。
    note: '*I should have talked* 表示事后看来当初应该做的事。'
  en.b1.unit17.lesson02.teach.if_i_had_asked_would_have_finished:
    title: if I had + 过去分词, I would have + 过去分词
    gloss: 如果我第一周就向Mia求助，我就能按时完成了。
    note: '*if I had asked..., I would have finished...* 描述的是与过去事实相反的结果。'
  en.b1.unit17.lesson02.teach.grammar_past_hypothetical:
    title: 表达对过去的遗憾的句型
    gloss: 要表达对过去的后悔，可以用 wish + 过去完成时（I wish I had asked...）、should have + 过去分词（I should have talked...），或者 if + 过去完成时，主句用 would have + 过去分词（If I had asked..., I would have finished...）。这三种说法描述的都是实际上没有发生的事。汉语里没有这样的动词变化，通常用“早知道……就……”“本该……”这类说法来表达。
    note: 结构：可选用 wish + had、should have，或 if + had ... would have。
  en.b1.unit17.lesson03.teach.looking_back:
    title: looking back
    gloss: 回头看，回想起来
    note: '*looking back* 用来引出对过去的反思。'
    example_gloss: 回想起来，Daniel希望自己当初早点求助。
  en.b1.unit17.lesson03.teach.missed_deadline:
    title: missed deadline
    gloss: 错过的截止日期
    note: '*missed deadline* 指没有按时完成的期限。'
    example_gloss: Daniel在求助之前错过了一个截止日期。
  en.b1.unit17.lesson03.teach.reading_passage:
    title: 阅读：回顾忙碌的一个月
    gloss: 嗨，Leila，回想起来，我真希望早点求助。我本该早点跟经理谈谈工作量的问题。等我这么做的时候，已经错过了一个截止日期。如果我第一周就向Mia求助，两个项目我都能按时完成。拖了这么久才求助是个错误。Daniel
    note: 一条简短而带有反思的消息。
  en.b1.unit17.lesson04.teach.q_wish_asked_sooner:
    title: Daniel 以反思开头
    gloss: Daniel说：回想起来，我真希望早点求助。
    note: '*looking back* 开启了一段带有反思的对话。'
  en.b1.unit17.lesson04.teach.a_what_happened:
    title: Leila 追问
    gloss: Leila说：发生什么事了？
    note: 一个简短的开放式问题，用来了解更多情况。
  en.b1.unit17.lesson04.teach.q_should_have_talked_missed:
    title: Daniel 说明他本应做什么
    gloss: Daniel说：我本该早点跟经理谈谈工作量的问题。等我这么做的时候，已经错过了一个截止日期。
    note: '*should have talked* 和 *had already missed* 把后悔和具体的后果联系在一起。'
  en.b1.unit17.lesson04.teach.a_fair_regret_fixed:
    title: Leila 安慰 Daniel
    gloss: Leila说：别担心，你最后不是解决了吗。
    note: '*Don''t worry* 用来安慰感到内疚的人。'
  en.b1.unit17.lesson04.teach.q_true_if_had_asked:
    title: Daniel 描述本来可以有什么不同
    gloss: Daniel说：也是。如果我第一周就向Mia求助，两个项目我都能按时完成。
    note: '*if I had asked..., I would have finished...* 描述的是与过去事实相反的结果。'
  en.b1.unit17.lesson04.teach.a_now_you_know:
    title: Leila 以鼓励的话收尾
    gloss: Leila说：嗯，现在你知道下次该怎么做了。
    note: 对话以简短而积极的话结束。
