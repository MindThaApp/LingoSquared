teaching:
  en.a1.unit46.lesson01.teach.lost:
    title: lost
    gloss: 丢失的 / 弄丢了
    note: '*lost* 在这里的意思是“丢失、弄丢”。中文常说“我把钱包弄丢了”，英语则用动词的过去式 I lost。'
    example_gloss: 我把钱包弄丢了。
  en.a1.unit46.lesson01.teach.found:
    title: found
    gloss: 找到了
    note: '*found* 是 find 的过去式，也是它的过去分词：I found your keys 的意思是“我找到了你的钥匙”。'
    example_gloss: 我找到你的钥匙了！
  en.a1.unit46.lesson01.teach.keys:
    title: keys
    gloss: 钥匙
    note: '*keys* 的意思是钥匙。'
    example_gloss: 这些是我的钥匙。
  en.a1.unit46.lesson01.teach.wallet:
    title: wallet
    gloss: 钱包
    note: '*wallet* 的意思是钱包。'
    example_gloss: 这是你的钱包吗？
  en.a1.unit46.lesson01.teach.backpack:
    title: backpack
    gloss: 背包
    note: '*backpack* 的意思是背包。'
    example_gloss: 我的背包是黑色的。
  en.a1.unit46.lesson02.teach.i_lost_my_wallet:
    title: I lost my wallet.
    gloss: 我把钱包弄丢了。
    note: 字面意思是“我丢了我的钱包”，但中文更自然的说法是“我把钱包弄丢了”，英语就用 *I lost my wallet.*
  en.a1.unit46.lesson02.teach.have_you_seen_my_keys:
    title: Have you seen my keys?
    gloss: 你看到我的钥匙了吗？
    note: '*Have you seen ...?* 的意思是“你看到……了吗？”，用 have 作助动词，后面接过去分词 seen。'
  en.a1.unit46.lesson02.teach.has_anyone_found_a_backpack:
    title: Has anyone found a backpack?
    gloss: 有人捡到一个背包吗？
    note: '*Has anyone found ...?* 的意思是“有人找到……了吗？”'
  en.a1.unit46.lesson02.teach.its_black_with_a_red_strap:
    title: It's black with a red strap.
    gloss: 它是黑色的，带一根红色的带子。
    note: '*It''s black with a red strap.* 的意思是“它是黑色的，带一根红色的带子。”'
  en.a1.unit46.lesson02.teach.wheres_the_lost_and_found:
    title: Where's the lost and found?
    gloss: 失物招领处在哪里？
    note: '*the lost and found* 是英语中失物招领处的固定名称，字面意思是“丢失的和找到的”。'
  en.a1.unit46.lesson02.teach.yes_we_found_it:
    title: Yes, we found it!
    gloss: 是的，我们找到了！
    note: '*Yes, we found it!* 的意思是“是的，我们找到了！”'
  en.a1.unit46.lesson03.teach.dialogue_line1:
    title: Daniel 的问题
    gloss: Daniel 问：Mia，你的背包呢？你刚才还把它放在喷泉旁边。
    note: '*had* 是 have 的过去式。'
  en.a1.unit46.lesson03.teach.dialogue_line2:
    title: Mia 吓了一跳
    gloss: Mia 说：天哪，你说得对！背包不在我这儿。我的相机还在里面！
    note: '*My camera is inside!* 的意思是“我的相机还在里面！”'
  en.a1.unit46.lesson03.teach.dialogue_line3:
    title: Daniel 的提议
    gloss: Daniel 说：别担心，我们给公园办公室打个电话问问吧。
    note: '*Don''t worry* 的意思是“别担心”。'
  en.a1.unit46.lesson03.teach.dialogue_line4:
    title: Daniel belt
    gloss: Daniel 说：你好，我们在喷泉附近丢了一个黑色的背包。有人捡到了吗？
    note: '*we lost a black backpack* 的意思是“我们丢了一个黑色的背包”，英语在这里直接用过去式 *lost*。'
  en.a1.unit46.lesson03.teach.dialogue_line5:
    title: Mia 的问题
    gloss: Mia 说：他们怎么说？
    note: '*did they say* 在过去时的疑问句中用 did 作助动词。'
  en.a1.unit46.lesson03.teach.dialogue_line6:
    title: Daniel 带来好消息
    gloss: Daniel 说：他们找到了！背包是黑色的，带一根黄色的带子，对吧？他们把它放在前台。
    note: 句末的 *right?* 是一个简短的确认问句，相当于中文的“对吧？”。
  en.a1.unit46.lesson03.teach.dialogue_line7:
    title: Mia 松了一口气
    gloss: Mia 说：对，就是它！我们现在就去拿。谢天谢地。
    note: '*Let''s go get it* 的意思是“我们去拿吧”，两个动词连在一起，中间不加 to。'
  en.a1.unit46.lesson04.teach.reading_passage:
    title: 关于失物招领处的告示
    gloss: 失物招领处：如果你在公园里丢了东西，首先想一想你最后一次是在哪里拿着它的。然后去主入口附近的公园办公室，描述一下这件物品，说明它的颜色和任何特别之处。请留下你的姓名和电话号码，这样如果工作人员之后找到了，就可以联系你。Mia 在喷泉附近丢了背包后，她和 Daniel 立刻给公园办公室打了电话。工作人员已经找到了背包，并把它放在前台。Mia 看到相机安然无恙地回到手里，非常欣慰。后来，她把整件事的经过讲给 Leila 听，Leila 说下次她会帮 Mia 把东西看管得更好。
    note: '*keep better track of your things* 的意思是“把自己的东西看管得更好”。'
