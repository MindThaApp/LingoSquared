    example_gloss: Daniel是工程师。
  en.a1.unit23.lesson01.teach.cook:
    title: cook
    gloss: 厨师
    note: '*cook* 的意思是厨师；这个词同时也是动词，表示“做饭”。'
    example_gloss: 我哥哥是厨师。
  en.a1.unit23.lesson01.teach.driver:
    title: driver
    gloss: 司机
    note: '*driver* 的意思是司机。在 *bus driver* 里，交通工具的名称要放在前面。'
    example_gloss: 他是公交车司机。
  en.a1.unit23.lesson02.teach.what_do_you_do:
    title: What do you do?
    gloss: 你做什么工作？
    note: 用 *What do you do?* 询问对方的职业。字面意思是“你做什么？”，实际表示“你做什么工作？”。
  en.a1.unit23.lesson02.teach.im_a_nurse:
    title: I'm a nurse.
    gloss: 我是护士。
    note: 用 *I'm a...* 说出你的职业。注意：汉语说“我是老师”，职业名称前没有冠词；英语里职业前面要加 *a* 或 *an*。
  en.a1.unit23.lesson02.teach.where_do_you_work:
    title: Where do you work?
    gloss: 你在哪里工作？
    note: 用 *Where do you work?* 询问工作的地点。
  en.a1.unit23.lesson03.teach.patients:
    title: patients
    gloss: 病人
    note: '*patients* 的意思是病人（复数）。这个词读作 *PAY-shents*。'
    example_gloss: 我每天帮助病人。
  en.a1.unit23.lesson03.teach.profile_text:
    title: 一份职业简介
    gloss: 我是护士。我在医院工作。我每天帮助病人，也写报告。
    note: 在这份简短的简介里，有人讲述了自己的职业和每天的工作。
  en.a1.unit23.lesson04.teach.interesting_work:
    title: It's interesting work.
    gloss: 这是一份有意思的工作。
    note: '*interesting* 的意思是有趣的、有意思的。'
  en.a1.unit23.lesson04.teach.q_what_do_you_do_daniel:
    title: 问Daniel的职业
    gloss: Leila问：Daniel，你做什么工作？
    note: 和第二课里的问句相同，这次加上了名字。
  en.a1.unit23.lesson04.teach.a_engineer_small_company:
    title: Daniel的回答
    gloss: Daniel说：我是工程师。我在市中心的一家小公司工作。
    note: Daniel说出了自己的职业和工作地点。
  en.a1.unit23.lesson04.teach.q_what_every_day:
    title: 询问每天的工作内容
    gloss: Leila问：你每天做什么？
    note: 这个问题问的是每天的工作内容。
  en.a1.unit23.lesson04.teach.a_reports_emails_clients:
    title: Daniel的回答
    gloss: Daniel说：我写报告，回复邮件。有时我会见客户。
    note: Daniel说了几件他每天做的事。
  en.a1.unit23.lesson04.teach.q_like_your_job:
    title: 问Daniel喜不喜欢他的工作
    gloss: Leila问：你喜欢你的工作吗？
    note: 用 *Do you like your job?* 询问对方是否喜欢自己的工作。
  en.a1.unit23.lesson04.teach.a_yes_interesting:
    title: Daniel的回答
    gloss: Daniel说：喜欢。这是一份有意思的工作。
    note: Daniel回答了“喜欢”，还说明了理由。
