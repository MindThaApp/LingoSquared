teaching:
  en.a1.unit33.lesson01.teach.bus:
    title: bus
    gloss: 公共汽车
    note: '*bus* 的意思是“公共汽车”。和它搭配的动词是 *take*：*take the bus*。注意：汉语里“坐公交、坐火车、开车、骑车”用的动词各不相同，英语也一样，不同交通工具要配不同的动词（*take*、*drive*、*ride*），需要分别记住。'
    example_gloss: 我坐公交车。
  en.a1.unit33.lesson01.teach.train:
    title: train
    gloss: 火车
    note: '*train* 的意思是“火车”。和 *bus* 一样，这里也用 *take*：*take the train*。'
    example_gloss: 她坐火车。
  en.a1.unit33.lesson01.teach.car:
    title: car
    gloss: 汽车
    note: '*car* 的意思是“汽车”。说开车时不用 *take*，而用 *drive*：*drive my car*。这和 bus、train 搭配的动词不同。'
    example_gloss: 我开车去上班。
  en.a1.unit33.lesson01.teach.bike:
    title: bike
    gloss: 自行车
    note: '*bike* 的意思是“自行车”。这里又换了一个动词：*ride a bike*（不用 *take*，也不用 *drive*）。'
    example_gloss: 我每天骑自行车去上班。
  en.a1.unit33.lesson01.teach.walk:
    title: walk
    gloss: 走路
    note: '*walk* 的意思是“走路，步行”。这里不需要再加 *take*、*drive* 或 *ride* 这样的动词，因为 *walk* 本身就是动词：*walk to work*，而不是 *take a walk to work*。'
    example_gloss: 我走路去上班。
  en.a1.unit33.lesson02.teach.how_get_to:
    title: How do you get to work?
    gloss: 你怎么去上班？
    note: 这个问句以助动词 *do* 开头，因为句中真正的动词是 *get*。汉语的“你怎么去上班？”里没有对应的助动词，但英语的疑问句需要 *do*。
  en.a1.unit33.lesson02.teach.usually:
    title: usually
    gloss: 通常
    note: '*usually* 的意思是“通常”。在英语里，这类副词一般放在主语和主要动词之间：*I usually take the bus*。'
    example_gloss: 我通常坐公交车。
  en.a1.unit33.lesson02.teach.minutes:
    title: minutes
    gloss: 分钟
    note: '*minutes* 的意思是“分钟”。在 *It takes twenty minutes* 里，*it* 是一个没有实际意义的主语，只是占住主语的位置。汉语可以直接说“要二十分钟”，不需要主语，但英语的句子必须有主语。'
    example_gloss: 要二十分钟。
  en.a1.unit33.lesson02.teach.late:
    title: late
    gloss: 晚点
    note: '*late* 的意思是“晚，迟”（比预期更晚到）：*The bus is often late.*'
    example_gloss: 公交车经常晚点。
  en.a1.unit33.lesson02.teach.faster:
    title: faster
    gloss: 更快
    note: '*faster* 的意思是“更快”：它是 *fast* 加 *-er* 构成的比较级。比较时用 *than*：*faster than the bus*。'
    example_gloss: 火车比公交车快。
  en.a1.unit33.lesson03.teach.dialogue_line1:
    title: Leila 的问题
    gloss: Leila 问：Daniel，你怎么去上班？
    note: 对话以 *How do you get to work?* 开始。
  en.a1.unit33.lesson03.teach.dialogue_line2:
    title: "Daniel 的回答"
    gloss: Daniel 说：我通常坐公交车，大约要二十分钟。
    note: 这里同时有两点：坐公交车用动词 *take*，以及 *It takes about twenty minutes* 里没有实际意义的主语 *it*。
  en.a1.unit33.lesson03.teach.dialogue_line3:
    title: Leila 的问题
    gloss: Leila 问：你喜欢吗？
    note: 这是以 *Do* 开头的一般疑问句（回答是或否）。
  en.a1.unit33.lesson03.teach.dialogue_line4:
    title: "Daniel 的回答"
    gloss: Daniel 说：还行，不过公交车经常晚点。你呢？
    note: '*How about you?* 的意思是“你呢？”，是把问题反问给对方的简短说法。'
  en.a1.unit33.lesson03.teach.dialogue_line5:
    title: "Leila 的回答"
    gloss: Leila 说：我开车。开车更快，但是停车很难。
    note: 说开车要用动词 *drive*，不用 *take*。
  en.a1.unit33.lesson04.teach.reading_passage:
    title: 关于 Leila 和 Daniel 的短文
    gloss: Leila 每天开车去上班。路上大约要十五分钟，但是在她办公室附近停车很难。Daniel 没有车，所以他坐公交车。他坐公交要二十分钟，有时还会晚点，不过他不用担心停车的事。
    note: 注意：公交车和火车用 *take*，汽车用 *drive*。
