course:
  title: 英语 B1
  description: 学习 B1 水平的英语，用于表达义务、可能性、假设情况和讲述日常经历，附有详细的中文讲解。
units:
  en.b1.unit03.hypotheticals:
    title: 如果下雨，如果我有时间
lessons:
  en.b1.unit03.lesson01.conditional_vocabulary:
    title: if、rain 和 free time
  en.b1.unit03.lesson02.real_conditions:
    title: If it rains, we will stay home
  en.b1.unit03.lesson03.reading_more_free_time:
    title: 阅读：if she had more free time
  en.b1.unit03.lesson04.the_weekend_plans_dialogue:
    title: If there's another one, you should join
teaching:
  en.b1.unit03.lesson01.teach.if:
    title: if
    gloss: 如果 / 假如
    note: '*if* 引出一个条件，只表示“如果、假如”；表示“当……的时候”则要用 *when*。'
    example_gloss: 如果下雨，我们就待在家里。
  en.b1.unit03.lesson01.teach.rain:
    title: rain
    gloss: 雨 / 下雨
    note: '*rain* 指从天上落下的水，也可以作动词，表示“下雨”。'
    example_gloss: 这个周末可能会下雨。
  en.b1.unit03.lesson01.teach.stay_home:
    title: stay home
    gloss: 待在家里
    note: '*stay home* 指不出门，留在家里。'
    example_gloss: 如果下雨，我们就待在家里。
  en.b1.unit03.lesson01.teach.weekend:
    title: weekend
    gloss: 周末
    note: '*weekend* 指星期六和星期日。'
    example_gloss: 你周末有什么计划？
  en.b1.unit03.lesson01.teach.free_time:
    title: free time
    gloss: 空闲时间
    note: '*free time* 指不工作也不忙的时间。'
    example_gloss: 我最近没有多少空闲时间。
  en.b1.unit03.lesson01.teach.paint:
    title: paint
    gloss: 画画
    note: '*paint* 指用颜料作画。'
    example_gloss: 蕾拉喜欢在周末画画。
  en.b1.unit03.lesson02.teach.if_rains_stay_home:
    title: 将来的一个真实条件
    gloss: 如果明天下雨，我们就待在家里。
    note: '*if + present, will + 动词原形*（if + 一般现在时，will + 动词原形）表示将来真实、可能发生的条件。'
  en.b1.unit03.lesson02.teach.if_have_free_time_paint:
    title: 另一个真实条件
    gloss: 如果这个周末我有空，我就去画画。
    note: 同一个结构：*if + present, will + 动词原形*。
  en.b1.unit03.lesson02.teach.grammar_real_condition:
    title: 真实条件
    gloss: 如果下雨，我们就待在家里。如果我有时间，我就去画画。
    note: 即使说的是将来，*if* 后面也要用一般现在时，而不是 *will rain*。
  en.b1.unit03.lesson03.teach.would:
    title: would
    gloss: 会 / 将会（虚拟）
    note: '*would* + 动词原形表示与现在事实相反的或假设的情况。'
    example_gloss: 如果我有更多时间，我每天都会画画。
  en.b1.unit03.lesson03.teach.class:
    title: class
    gloss: 课 / 班
    note: '*class* 指有老师授课的有组织的课程或班。'
    example_gloss: 她家附近有一个绘画班。
  en.b1.unit03.lesson03.teach.reading_passage:
    title: 阅读：如果她有更多空闲时间
    gloss: 蕾拉喜欢画画，但她没有多少空闲时间。如果她有更多空闲时间，她每天都会画画。上个月，她家附近有一个绘画班。如果她早点知道，她就报名了。现在她每周都会查看有没有新的课程。
    note: 一篇短文，包含一个与现在事实相反的假设，和一个与过去事实相反的假设。
  en.b1.unit03.lesson04.teach.q_weekend_plans:
    title: Daniel 询问周末安排
    gloss: 丹尼尔说：你周末有什么计划？
    note: 一个简单的开放式问题，用来开启对话。
  en.b1.unit03.lesson04.teach.a_walk_or_stay_home:
    title: Leila 视天气而定的计划
    gloss: 蕾拉说：如果不下雨，我就去散步。如果下雨，我就待在家里画画。
    note: 根据天气情况，连续说了两个真实的条件。
  en.b1.unit03.lesson04.teach.q_take_class:
    title: Daniel 询问绘画课
    gloss: 丹尼尔说：听起来不错。你上个月上那个绘画班了吗？
    note: 一个关于过去的追问。
  en.b1.unit03.lesson04.teach.a_would_have_signed_up:
    title: Leila 对过去的懊悔
    gloss: 蕾拉说：没有。如果我早点知道，我就报名了。
    note: '*if + past perfect, would have + 过去分词*（if + 过去完成时，would have + 过去分词）表示与过去事实相反的假设，或表达遗憾。'
  en.b1.unit03.lesson04.teach.q_should_join:
    title: Daniel 给出建议
    gloss: 丹尼尔说：真可惜。如果还有下一期，你应该参加。
    note: 丹尼尔用 *should* 来鼓励蕾拉抓住下一次机会。
  en.b1.unit03.lesson04.teach.a_will_sign_up:
    title: Leila 下定决心做某事
    gloss: 蕾拉说：你说得对。如果我看到了，我马上就报名。
    note: 这是关于将来的一个新的真实条件，不再是假设。
