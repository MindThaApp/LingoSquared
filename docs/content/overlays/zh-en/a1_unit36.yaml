teaching:
  en.a1.unit36.lesson01.teach.class:
    title: class
    gloss: 课，班
    note: '*class* 的意思是“课，班”（大家聚在一起学习的一节课）。'
    example_gloss: 我每周二晚上有课。
  en.a1.unit36.lesson01.teach.course:
    title: course
    gloss: 课程
    note: '*course* 的意思是“课程”（围绕一个主题的一系列课）。'
    example_gloss: 他今年在上一门电脑课程。
  en.a1.unit36.lesson01.teach.student:
    title: student
    gloss: 学生 / 学员
    note: '*student* 的意思是“学生，学员”：在学校或课堂上学习的人。'
    example_gloss: 她是社区大学的学生。
  en.a1.unit36.lesson01.teach.homework:
    title: homework
    gloss: 家庭作业
    note: '*homework* 的意思是“家庭作业”。'
    example_gloss: 我晚饭后做作业。
  en.a1.unit36.lesson01.teach.subject:
    title: subject
    gloss: 科目
    note: '*subject* 的意思是“科目”（你学习的一个主题）。'
    example_gloss: 数学是我最喜欢的科目。
  en.a1.unit36.lesson01.teach.test:
    title: test
    gloss: 考试，测验
    note: '*test* 的意思是“考试，测验”。'
    example_gloss: 我们周五有一场考试。
  en.a1.unit36.lesson02.teach.take_a_class:
    title: take a class
    gloss: 上课
    note: '*take a class* 是英语里“上一门课”的固定搭配。这里固定用动词 *take*，不要换成别的动词。'
    example_gloss: 我每周二晚上上一门课。
  en.a1.unit36.lesson02.teach.do_homework:
    title: do homework
    gloss: 做作业
    note: '*do homework*：这里的动词是 *do*。汉语说“做作业”，英语也是 *do* 而不是 *make*，不要说成 *make homework*。'
    example_gloss: 他晚饭后做作业。
  en.a1.unit36.lesson02.teach.study_for_a_test:
    title: study for a test
    gloss: 为考试而复习
    note: '*study for a test* 的意思是“为考试而复习”。这里的 *for* 表示目的（为了什么而学习）。'
    example_gloss: 我每周五为考试复习。
  en.a1.unit36.lesson02.teach.community_college:
    title: community college
    gloss: 社区大学（面向成年人的本地教育机构）
    note: '*community college* 是美国的一种教育机构，成年人主要在工作之余来这里上课。汉语里没有完全对应的说法，所以学习时通常直接记英语说法。'
    example_gloss: 她在一所社区大学学习。
  en.a1.unit36.lesson02.teach.in_the_evening:
    title: in the evening
    gloss: 在晚上
    note: '*in the evening* 的意思是“在晚上”。'
    example_gloss: 我的课在晚上。
  en.a1.unit36.lesson02.teach.what_are_you_studying_question:
    title: What are you studying?
    gloss: 你在学什么？
    note: 这个问句用现在进行时（*are you studying*），说的是你目前这段时间正在做的事，而不是一般现在时。
  en.a1.unit36.lesson03.teach.dialogue_line1:
    title: Daniel 的问题
    gloss: Daniel 问：你今天下班后有安排吗？
    note: 这里的 *anything* 的意思是“任何事”，用在疑问句里。
  en.a1.unit36.lesson03.teach.dialogue_line2:
    title: "Mia 的回答"
    gloss: Mia 说：有，我今晚有一节摄影课。
    note: '*tonight* 的意思是“今晚”。'
  en.a1.unit36.lesson03.teach.dialogue_line3:
    title: Daniel 的回应
    gloss: Daniel 说：哦，不错！你在哪里上课？
    note: '*Where do you take it?*：这里的 *take* 也表示上课或学课程，和 *take a class* 一样。'
  en.a1.unit36.lesson03.teach.dialogue_line4:
    title: "Mia 的回答"
    gloss: Mia 说：在市中心的社区大学，每周两次。
    note: '*twice a week*：这里的 *a* 表示“每”。'
  en.a1.unit36.lesson03.teach.dialogue_line5:
    title: Daniel 的问题
    gloss: Daniel 说：到目前为止怎么样？
    note: '*so far* 的意思是“到目前为止”。'
  en.a1.unit36.lesson03.teach.dialogue_line6:
    title: "Mia 的回答"
    gloss: Mia 说：我真的很喜欢。我正在学怎么把相机用得更好。
    note: '*I''m learning how to ...*：用现在进行时，表示你目前正在培养的一项技能。'
  en.a1.unit36.lesson03.teach.dialogue_line7:
    title: Daniel 的最后一句话
    gloss: Daniel 说：太好了！也许你什么时候可以教教我。
    note: '*sometime* 的意思是“改天，什么时候”：指将来某个不确定的时间。'
  en.a1.unit36.lesson04.teach.reading_passage:
    title: 关于 Daniel、Leila 和 Mia 的短文
    gloss: Daniel、Leila 和 Mia 都在工作之外学新东西。Daniel 每周一晚上上一门电脑课，为工作学习新技能。Leila 在学西班牙语，因为她想有一天去墨西哥旅行。Mia 每周在社区大学上两次摄影课，她拍的照片已经好多了。他们有时午饭时会一起聊聊各自的课。
    note: '*takes a computer course*：这里用 *take* 而不是 *follow*，和 *take a class* 一样要注意。'
