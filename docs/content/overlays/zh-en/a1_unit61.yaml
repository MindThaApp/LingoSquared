teaching:
  en.a1.unit61.lesson01.teach.sorry:
    title: sorry
    gloss: 对不起 / 抱歉
    note: '*sorry* 是表示道歉最常用的词。'
    example_gloss: 对不起。
  en.a1.unit61.lesson01.teach.late:
    title: late
    gloss: 迟到 / 晚了
    note: '*late* 的意思是“没有准时”。'
    example_gloss: 我迟到了。
  en.a1.unit61.lesson01.teach.excuse:
    title: excuse
    gloss: 借口 / 理由
    note: '*excuse* 指出了问题后你给出的理由。'
    example_gloss: 这就是我的理由。
  en.a1.unit61.lesson01.teach.traffic:
    title: traffic
    gloss: 交通
    note: '*traffic* 的意思是道路上的“交通”或“车流”。'
    example_gloss: 交通很拥堵。
  en.a1.unit61.lesson01.teach.mistake:
    title: mistake
    gloss: 错误
    note: '*mistake* 的意思是“错误”。'
    example_gloss: 我犯了一个错误。
  en.a1.unit61.lesson01.teach.problem:
    title: problem
    gloss: 问题
    note: '*problem* 的意思是“问题”。'
    example_gloss: 没问题。
  en.a1.unit61.lesson02.teach.im_sorry:
    title: I'm sorry.
    gloss: 对不起。
    note: '*I''m sorry* 是道歉的标准说法。'
  en.a1.unit61.lesson02.teach.im_late:
    title: I'm late.
    gloss: 我迟到了。
    note: '*late* 在这里的意思是“迟到”，不是“夜里很晚”。'
  en.a1.unit61.lesson02.teach.bus_is_late:
    title: The bus is late.
    gloss: 公共汽车晚点了。
    note: 英语中，说人迟到和说公共汽车晚点用的是同一种结构：*is late*。
  en.a1.unit61.lesson02.teach.thats_okay:
    title: That's okay.
    gloss: 没关系。
    note: '*That''s okay* 是友好地接受别人的道歉。'
  en.a1.unit61.lesson02.teach.no_problem:
    title: No problem.
    gloss: 没问题。
    note: '*No problem* 是回应道歉或感谢时简短随意的说法。'
  en.a1.unit61.lesson02.teach.made_mistake:
    title: I made a mistake.
    gloss: 我犯了一个错误。
    note: 英语说 *make a mistake*，不说 *do a mistake*。中文说“犯错误”，对应的英语动词要用 *make*。
  en.a1.unit61.lesson03.teach.dialogue_line1:
    title: "Daniel 道歉"
    gloss: Daniel 说：嗨，Mia。对不起，我迟到了。
    note: '*I''m sorry I''m late* 把道歉和原因放在了一起。'
  en.a1.unit61.lesson03.teach.dialogue_line2:
    title: Mia 表示接受
    gloss: Mia 说：没关系。
    note: '*That''s okay* 友好又简单。'
  en.a1.unit61.lesson03.teach.dialogue_line3:
    title: 公共汽车晚点了
    gloss: Daniel 说：公共汽车晚点了。
    note: 这句话说明了原因。
  en.a1.unit61.lesson03.teach.dialogue_line4:
    title: Mia 说可以等
    gloss: Mia 说：没问题。我们可以等。
    note: '*We can wait* 的意思是等一等是可以的。'
  en.a1.unit61.lesson03.teach.dialogue_line5:
    title: Daniel 把时间弄错了
    gloss: Daniel 说：我把时间弄错了。
    note: '*with the time* 的意思是在时间上出了错。'
  en.a1.unit61.lesson03.teach.dialogue_line6:
    title: 课三点开始
    gloss: Mia 说：没关系。课三点开始。
    note: '*at three* 在钟点前用 *at*。'
  en.a1.unit61.lesson03.teach.dialogue_line7:
    title: Daniel 感谢 Mia
    gloss: Daniel 说：谢谢你等我。
    note: '*Thank you for waiting* 在 *for* 后面接动词的 -ing 形式。'
  en.a1.unit61.lesson04.teach.class_note:
    title: 上课通知
    gloss: 上课通知：课程三点开始。请准时到。如果迟到，请发一条消息。
    note: 通知说明了迟到时该怎么做。
  en.a1.unit61.lesson04.teach.reading_passage:
    title: 短文：上课前的道歉
    gloss: 上课前的道歉：Daniel 上课迟到了，因为公共汽车晚点了。他在教室外面遇到了 Mia。Daniel 说他很抱歉。他还说自己把时间弄错了。Mia 说没关系。课是三点开始的。Daniel 给老师发了一条简短的消息。消息写道：“对不起，我迟到了。公共汽车晚点了。”
    note: '*because* 引出原因：因为公共汽车晚点了。'
