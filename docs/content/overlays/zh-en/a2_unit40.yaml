teaching:
  en.a2.unit40.lesson01.teach.order:
    title: order
    gloss: 订单
    note: '*order* 就是订单本身。作为动词，*to order* 的意思是订购。'
    example_gloss: 我的订单晚到了两天。
  en.a2.unit40.lesson01.teach.delivery:
    title: delivery
    gloss: 送货
    note: '*delivery* 指你的订单被送到你家的那一刻。'
    example_gloss: 货在周二上午送到了。
  en.a2.unit40.lesson01.teach.parcel:
    title: parcel
    gloss: 包裹
    note: '*parcel* 是包装好、送到你门口的包裹。'
    example_gloss: 包裹被放在我家门外。
  en.a2.unit40.lesson01.teach.damaged:
    title: damaged
    gloss: 受损的
    note: '*damaged* 指东西在途中受了损伤，但也许还能用。通常用来说包装。'
    example_gloss: 纸箱送到时已经受损了。
  en.a2.unit40.lesson01.teach.broken:
    title: broken
    gloss: 坏掉的
    note: '*broken* 比 *damaged* 更严重：东西已经不能用了。'
    example_gloss: 包裹里的台灯是坏的。
  en.a2.unit40.lesson01.teach.replacement:
    title: replacement
    gloss: 替换品、补发
    note: '*replacement* 是用来代替坏东西的新货。*refund* 是退还钱款。'
    example_gloss: 我要求换货，而不是退款。
  en.a2.unit40.lesson01.teach.grammar_arrived:
    title: arrived 和 has not arrived yet
    gloss: 我的订单昨天到了。我的订单还没有到。
    note: '*arrived* 与过去的某个时间点连用。*has not arrived yet* 说明你到现在还在等。'
  en.a2.unit40.lesson02.teach.report_order_problem:
    title: 说明您打电话的目的
    gloss: 我想反映一下我的订单有问题。
    note: '*I''d like to report a problem with ...* 和第 29 单元反映漏水处时用的礼貌说法相同。'
  en.a2.unit40.lesson02.teach.lamp_arrived_broken:
    title: 说明哪里有问题
    gloss: 台灯送来时是坏的。
    note: '*arrived broken* 的意思是：它送到时就已经是坏的了。'
  en.a2.unit40.lesson02.teach.ask_for_replacement:
    title: 在换货和退款之间选择
    gloss: 我可以要求换货，而不是退款吗？
    note: '*instead of* 把两种可能放在一起对比：你选第一种，不选第二种。'
  en.a2.unit40.lesson02.teach.my_order_number:
    title: 报出您的订单号
    gloss: 我的订单号是 8154。
    note: 被问到订单号时，请马上说出来；工作人员据此才能找到你的订单。
  en.a2.unit40.lesson02.teach.grammar_instead_of:
    title: 用 instead of 表示选择
    gloss: 我可以要求换货而不是退款吗？我想要退款，而不是换货。
    note: '*instead of* 后面接名词或 -ing 形式（*instead of a refund*，*instead of getting a refund*），不能接动词原形：不能说 *instead of get a refund*。'
  en.a2.unit40.lesson03.teach.box:
    title: box
    gloss: 盒子、纸箱
    note: '*box* 是装着你订单的纸箱。*parcel* 是整个送来的包裹。'
    example_gloss: 台灯装在一个大纸箱里。
  en.a2.unit40.lesson03.teach.return_message:
    title: 网店的回复
    gloss: 感谢您的来信。很抱歉您的台灯送到时是坏的。请把台灯放回纸箱，并送到邮局。我们将在三个工作日内寄出一盏新台灯。订单号 8154。
    note: 客服的回复总会说明：问题是什么、您需要做什么，以及商店会做什么。
  en.a2.unit40.lesson03.teach.put_it_back_in_the_box:
    title: 您该如何处理坏掉的灯
    gloss: 请把台灯放回纸箱，并送到邮局。
    note: '*put ... back in ...* 的意思是把东西放回它原来所在的地方。'
  en.a2.unit40.lesson04.teach.q_report_a_problem:
    title: Leila 打电话给网店
    gloss: Leila 说：您好，我想反映一下我的订单有问题。
    note: 打电话时，要马上说明你来电的目的。
  en.a2.unit40.lesson04.teach.a_what_is_the_problem:
    title: 工作人员追问
    gloss: 工作人员说：很抱歉听到这个。是什么问题？
    note: '*I''m sorry to hear that* 是工作人员听到坏消息时固定的礼貌回应。'
  en.a2.unit40.lesson04.teach.q_lamp_broken_box_damaged:
    title: Leila 说明问题
    gloss: Leila 说：台灯送到时是坏的。纸箱也受损了。
    note: 注意区别：纸箱是 *damaged*，台灯是 *broken*。
  en.a2.unit40.lesson04.teach.a_ask_order_number:
    title: 工作人员询问订单号
    gloss: 工作人员说：明白了。您能告诉我您的订单号吗？
    note: 和第 39 单元中的间接问句形式 *Could you tell me ...?* 相同。
  en.a2.unit40.lesson04.teach.q_order_number_8154:
    title: Leila 报出她的订单号
    gloss: Leila 说：我的订单号是 8154。
    note: 和第 2 课中的句子相同。
  en.a2.unit40.lesson04.teach.a_refund_or_replacement:
    title: 工作人员提供两种选择
    gloss: 工作人员说：谢谢。您想退款还是换货？
    note: 这里的 *or* 把两种可能并列起来；你选其中一种。
  en.a2.unit40.lesson04.teach.q_replacement_please:
    title: Leila 选择替换品
    gloss: Leila 说：我可以要求换货，而不是退款吗？
    note: 和第 2 课中的问题相同。
  en.a2.unit40.lesson04.teach.a_new_lamp_three_days:
    title: 工作人员来处理
    gloss: 工作人员说：当然可以。我们将在三个工作日内寄出一盏新台灯。
    note: 和第 3 课消息中的承诺相同。
  en.a2.unit40.lesson04.teach.q_thank_you:
    title: Leila 感谢工作人员
    gloss: Leila 说：非常感谢。
    note: '*very much* 让感谢的语气更强烈一些。'
