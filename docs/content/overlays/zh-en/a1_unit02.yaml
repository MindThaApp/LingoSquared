    title: Daniel 说出他的职业
    gloss: Daniel 说：我是工程师。
    note: 在英语中，职业名称前要用 *a* 或 *an*（*I'm an engineer*）；中文说“我是工程师”则不需要冠词。
  en.a1.unit02.lesson03.teach.closing:
