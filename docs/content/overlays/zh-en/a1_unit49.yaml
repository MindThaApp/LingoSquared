    gloss: 这个该扔进哪个桶？
    note: '*go in* 在这里的意思是“应该放进……、属于……”。'
  en.a1.unit49.lesson02.teach.this_goes_in_the_recycling_bin:
    title: This goes in the recycling bin.
    gloss: 这个要放进回收桶。
    note: '*This goes in the recycling bin.* 的意思是“这个要放进回收桶。”'
  en.a1.unit49.lesson02.teach.the_green_bin_is_for_glass:
    title: The green bin is for glass.
    gloss: 绿色的桶是装玻璃的。
    note: '*is for ...* 的意思是“是用来……的”，用来说明某样东西的用途。'
  en.a1.unit49.lesson02.teach.can_you_take_out_the_trash:
    title: Can you take out the trash?
    gloss: 你能把垃圾拿出去吗？
    note: '*take out* 是可以拆开的短语动词：*take out the trash* 和 *take the trash out* 都正确。中文说“把垃圾拿出去”，同样可以把“垃圾”放在动作前后。'
  en.a1.unit49.lesson02.teach.collection_day_is_on_tuesday:
    title: Collection day is on Tuesday.
    gloss: 收垃圾日是周二。
    note: '*Collection day is on Tuesday.* 的意思是“收垃圾日是周二。”'
  en.a1.unit49.lesson02.teach.what_about_paper_and_food_waste:
    title: What about paper and food waste?
    gloss: 那纸张和厨余垃圾呢？
    note: '*What about ...?* 的意思是“那……呢？”，用来问另一件事。'
  en.a1.unit49.lesson03.teach.dialogue_line1:
    title: Mia 的提醒
    gloss: Mia 说：等一下，那个玻璃罐不能扔进垃圾桶！
    note: '*doesn''t go in the trash* 的意思是“不能扔进垃圾桶”。'
  en.a1.unit49.lesson03.teach.dialogue_line2:
    title: Daniel 的道歉
    gloss: Daniel 说：哎呀，对不起！它该扔进哪个桶？
    note: '*Which bin does it go in?* 重复了刚学过的问句形式。'
  en.a1.unit49.lesson03.teach.dialogue_line3:
    title: Mia 的解释
    gloss: Mia 说：它要放进绿色的桶。我们这里回收玻璃。
    note: '*We recycle glass here.* 的意思是“我们这里回收玻璃。”'
  en.a1.unit49.lesson03.teach.dialogue_line4:
    title: Daniel 的问题
    gloss: Daniel 问：那纸张和厨余垃圾呢？
    note: 这是在重复前面学过的问句 *What about ...?*
  en.a1.unit49.lesson03.teach.dialogue_line5:
    title: Mia 的说明
    gloss: Mia 说：纸张放进蓝色的桶，厨余垃圾放进棕色的桶。
    note: '*goes in ..., and ... goes in ...* 对两种不同的垃圾重复使用了同一个句型。'
  en.a1.unit49.lesson03.teach.dialogue_line6:
    title: Daniel 询问收垃圾日
    gloss: Daniel 说：明白了。收垃圾日是哪天？
    note: '*Got it.* 是一种非正式的说法，意思是“明白了”。'
  en.a1.unit49.lesson03.teach.dialogue_line7:
    title: "Mia 的回答"
    gloss: Mia 说：回收桶周二拿出去，普通垃圾周五拿出去。
    note: 注意：Mia 为两种不同的垃圾说了两个不同的日子——回收物是周二，普通垃圾是周五。
  en.a1.unit49.lesson03.teach.dialogue_line8:
    title: Daniel 的承诺
    gloss: Daniel 说：谢谢！下次我会把所有东西都分对类。
    note: '*I''ll sort everything correctly next time.* 的意思是“下次我会把所有东西都分对类。”'
  en.a1.unit49.lesson04.teach.reading_passage:
    title: 关于垃圾分类的短文
    gloss: 如何给垃圾分类：许多公寓楼为不同种类的垃圾设置了不同的垃圾桶。玻璃通常放进绿色的桶，纸张放进蓝色的桶。厨余垃圾放进棕色的桶，其他所有东西放进黑色的桶，也就是普通垃圾桶。了解你的收垃圾日很有帮助，因为垃圾桶每周只清理一次。Daniel 一直在练习他从图书馆借来的食谱里的菜，他经常在 Mia 家和她一起做饭。昨晚，他按食谱做了一道菜，之后差点把一个玻璃罐扔进普通垃圾桶。Mia 拦住了他，并向他展示了她所在的楼是怎么分类垃圾的。她解释说，回收桶周二拿出去，普通垃圾周五拿出去。Daniel 很感激，并说他以后会把所有东西都分对类。
    note: '*almost put a glass jar in the regular trash* 的意思是“差点把一个玻璃罐扔进普通垃圾桶”。'
