teaching:
  en.b1.unit06.lesson01.teach.while:
    title: while
    gloss: 当……的时候
    note: '*while* 表示某事与另一件事同时发生。'
    example_gloss: 我开车的时候，开始下雨了。
  en.b1.unit06.lesson01.teach.flat_tire:
    title: flat tire
    gloss: 爆胎，轮胎没气
    note: '*flat tire* 指没有气、不能再用的轮胎。'
    example_gloss: 我的轮胎在高速公路上爆了。
  en.b1.unit06.lesson01.teach.pull_over:
    title: pull over
    gloss: 把车靠边停下
    note: '*pull over* 表示把车停在路边。'
    example_gloss: 我不得不马上把车靠边停下。
  en.b1.unit06.lesson01.teach.stranger:
    title: stranger
    gloss: 陌生人
    note: '*stranger* 指你不认识的人。'
    example_gloss: 一个陌生人停下来帮我。
  en.b1.unit06.lesson01.teach.mechanic:
    title: mechanic
    gloss: 修理工，汽车技工
    note: '*mechanic* 指修理汽车的人。'
    example_gloss: 修理工很快修好了我的轮胎。
  en.b1.unit06.lesson01.teach.said_that:
    title: said that
    gloss: （某人）说……
    note: '*said that* 用来转述别人说过的话。'
    example_gloss: 他说他可以帮忙。
  en.b1.unit06.lesson02.teach.while_driving_tire_went_flat:
    title: 用 'while' 描述背景动作
    gloss: 我开车去上班的时候，轮胎爆了。
    note: '*while* + 过去进行时（*was/were* + -ing）描述被另一件事打断的背景动作。'
  en.b1.unit06.lesson02.teach.when_pulled_over_stranger_helped:
    title: 用 'when' 表示接着发生的事
    gloss: 我把车靠边停下时，一个陌生人停下来帮忙。
    note: '*when* 引出故事中接下来发生的事。'
  en.b1.unit06.lesson02.teach.grammar_while_when_sequencing:
    title: 故事中的 'while' 和 'when'
    gloss: 我开车的时候，轮胎爆了。我把车靠边停下时，一个陌生人帮了我。
    note: '*while* 标示背景（正在进行的动作）；*when* 标示在其中发生的下一个、较短的事件。'
  en.b1.unit06.lesson03.teach.had_already_called:
    title: had already called
    gloss: 已经打过电话了
    note: '*had already* + 过去分词描述在过去某个时间点之前就已经发生的事。'
    example_gloss: 他到的时候，我已经给丹尼尔打过电话了。
  en.b1.unit06.lesson03.teach.kept_his_word:
    title: kept his word
    gloss: 信守诺言
    note: '*kept his word* 表示某人做到了自己承诺的事。'
    example_gloss: 他信守诺言，十分钟就修好了。
  en.b1.unit06.lesson03.teach.reading_passage:
    title: 阅读：爆胎的故事
    gloss: 昨天早上，蕾拉开车去上班的时候，轮胎突然爆了。她把车停在一条安静的街道边。一个陌生人停下他的车，主动提出帮忙。等修理工赶到时，蕾拉已经给丹尼尔打过电话，告诉他自己会迟到。修理工说他十分钟就能修好轮胎。他信守了诺言，蕾拉上班只迟到了二十分钟。
    note: 一个过去的故事，包含背景动作（*while*）、事件的先后顺序（*when*）和更早已经发生的事（*had already*）。
  en.b1.unit06.lesson04.teach.q_youre_late_what_happened:
    title: Daniel 注意到 Leila 迟到了
    gloss: 丹尼尔说：你迟到了！出什么事了？
    note: 一个直接又关切的问题，故事由此开始。
  en.b1.unit06.lesson04.teach.a_tire_went_flat_suddenly:
    title: Leila 开始讲她的故事
    gloss: 蕾拉说：我开车去上班的时候，轮胎突然爆了。
    note: '*while* 标示背景，在这个背景中发生了另一件事。'
  en.b1.unit06.lesson04.teach.q_oh_no_what_did_you_do:
    title: Daniel 追问
    gloss: 丹尼尔说：天哪！你怎么办的？
    note: 一个简短的追问，想听到故事的更多内容。
  en.b1.unit06.lesson04.teach.a_pulled_over_stranger_helped:
    title: Leila 继续讲
    gloss: 蕾拉说：我把车靠边停下，一个陌生人停下来帮我。
    note: 这是故事中紧接背景之后发生的下一件事。
  en.b1.unit06.lesson04.teach.q_kind_of_him_call_mechanic:
    title: Daniel 回应并继续提问
    gloss: 丹尼尔说：他人真好。你叫修理工了吗？
    note: '*that was kind of him* 是对别人的善意很自然的回应。'
  en.b1.unit06.lesson04.teach.a_had_already_called_mechanic_said:
    title: Leila 讲完故事
    gloss: 蕾拉说：叫了，那个陌生人到之前我就已经打电话叫了一个。修理工说他十分钟就能修好，而且他真的做到了！
    note: '*had already called* 表明在那个陌生人到达之前，这件事已经发生了。'
