teaching:
  en.a1.unit16.lesson01.teach.wake_up:
    title: Wake up
    gloss: 醒来
    note: '*wake up* 的意思是醒来。它由动词加小品词组成，要分开写成两个词。'
  en.a1.unit16.lesson01.teach.get_dressed:
    title: Get dressed
    gloss: 穿好衣服
    note: '*get dressed* 的意思是穿衣服。英语里不说 *get yourself dressed*，不需要加“自己”。'
  en.a1.unit16.lesson01.teach.go_to_work:
    title: Go to work
    gloss: 去上班
    note: '*go to work* 的意思是去上班。在这个固定说法里，*work* 前面不加冠词。'
  en.a1.unit16.lesson01.teach.have_dinner:
    title: Have dinner
    gloss: 吃晚饭
    note: '*have dinner* 的意思是吃晚饭。表示三餐时不加冠词：*have breakfast*、*have lunch*、*have dinner*。'
  en.a1.unit16.lesson01.teach.go_to_bed:
    title: Go to bed
    gloss: 上床睡觉
    note: '*go to bed* 的意思是上床睡觉。这里 *bed* 前面同样不加冠词。'
  en.a1.unit16.lesson02.teach.what_time_wake_up:
    title: What time do you wake up?
    gloss: 你几点起床？
    note: 用 *What time do you wake up?* 询问对方几点起床。带 *do* 的问句必须有助动词，不能说 *What time wake you up*。
  en.a1.unit16.lesson02.teach.i_wake_up_at:
    title: I wake up at seven every day.
    gloss: 我每天七点起床。
    note: '*every day* 表示每天重复的习惯，可以放在句尾，也可以放在句首。'
  en.a1.unit16.lesson02.teach.in_the_morning:
    title: I get dressed in the morning.
    gloss: 我早上穿衣服。
    note: '*in the morning* 指一天中的某个时段，不是具体的钟点。汉语的“早上”在英语里要说 *in the morning*。'
  en.a1.unit16.lesson02.teach.usually_at_night:
    title: I usually go to bed at eleven.
    gloss: 我通常十一点睡觉。
    note: '*usually* 的意思是“通常”，描述不一定每次都完全一样的习惯。注意词序：*usually* 要放在实义动词前面（*I usually go*）。汉语的“通常”可以放在句首或主语后，但英语里不能放在动词后面，*I go usually to bed* 是错的。'
  en.a1.unit16.lesson03.teach.then:
    title: Then
    gloss: 然后/接着
    note: '*then* 的意思是“然后”或“接着”，用来表示事情发生的先后顺序。'
    example_gloss: 我先吃早饭，然后去上班。
  en.a1.unit16.lesson03.teach.routine_text:
    title: 一段日常作息的短文
    gloss: 我每天七点起床。然后我穿好衣服，吃早饭。
    note: 这是对早晨作息的简短描述。
  en.a1.unit16.lesson04.teach.after_that:
    title: What do you do after that?
    gloss: 在那之后你做什么？
    note: 用 *What do you do after that?* 询问接下来做什么，也就是日常作息的后续安排。
  en.a1.unit16.lesson04.teach.q_wake_time:
    title: 询问起床时间
    gloss: Leila问：你几点起床？
    note: 和前面是同一个问句。
  en.a1.unit16.lesson04.teach.a_wake_seven:
    title: 回答起床时间
    gloss: Daniel说：我每天七点起床。
    note: 完整的回答既要说出时间，也要说出每天都这样。
  en.a1.unit16.lesson04.teach.q_after_that:
    title: 询问接下来做什么
    gloss: Leila问：在那之后你做什么？
    note: 这个问题是关于日常作息的对话的自然延续。
  en.a1.unit16.lesson04.teach.a_full_routine:
    title: 描述一整天的作息
    gloss: Daniel说：我穿好衣服，吃早饭，然后去上班。我通常十一点睡觉。
    note: Daniel按正确的先后顺序，依次说出了几项活动。
