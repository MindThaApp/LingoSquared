teaching:
  en.b2.unit03.lesson01.teach.hedge:
    title: hedge
    gloss: 委婉表达，留有余地
    note: '*hedge* 指把说法讲得不那么绝对。表示“有点”时，不要处处都用 *a little*。'
    example_gloss: 莉拉用 seems 来让她对该政策的说法留有余地。
  en.b2.unit03.lesson01.teach.qualify:
    title: qualify
    gloss: 加以限定，附加条件
    note: '*qualify* 指用条件或例外来限制一个说法。'
    example_gloss: “provided we agree”这个说法限定了莉拉的支持。
  en.b2.unit03.lesson01.teach.emphasize:
    title: emphasize
    gloss: 强调
    note: '*emphasize* 指让你所传达信息的某一部分更有分量。'
    example_gloss: 丹尼尔强调了工作量的问题。
  en.b2.unit03.lesson01.teach.to_some_extent:
    title: to some extent
    gloss: 在某种程度上
    note: '*to some extent* 往往比到处使用 *a little* 听起来更自然。'
    example_gloss: 在某种程度上，这项政策回应了团队的担忧。
  en.b2.unit03.lesson01.teach.broadly:
    title: broadly
    gloss: 大体上，总体来说
    note: '*broadly* 表示总体上的支持或一般意义上的正确，同时允许有例外。'
    example_gloss: 这个提议大体上是有用的，尽管并不完美。
  en.b2.unit03.lesson01.teach.provided:
    title: provided
    gloss: 只要，在……的前提下
    note: '*provided* 引出一个条件。在英语中，它听起来往往比较正式、专业。'
    example_gloss: 只要我们意见一致，我们就可以支持这项政策。
  en.b2.unit03.lesson02.teach.seems_but_does:
    title: 委婉再加强调
    gloss: 这项政策看起来合理，但确实会给团队带来额外的工作。
    note: '*seems* 让肯定的说法变得更委婉；*does create* 强调额外的工作确实会产生。汉语里可以用“确实”“的确”来表达这种强调。'
  en.b2.unit03.lesson02.teach.what_worries_me:
    title: 聚焦于一个担忧
    gloss: 让我担心的是团队的额外工作。
    note: '*What worries me is...* 把一个要点放在句首，以突出重点。后面仍要保持英语的语序：*is the extra work*。'
  en.b2.unit03.lesson02.teach.broadly_provided:
    title: 带条件的总体支持
    gloss: 只要调整时间安排，它大体上是有用的。
    note: '*broadly useful, provided...* 表示附带明确条件的支持。'
  en.b2.unit03.lesson02.teach.grammar_stance:
    title: 细微差别与强调
    gloss: 用 seems、broadly 或 to some extent 来使一个说法更委婉或加以限定。在主要动词前用 do 或 does 来强调某事属实。用 What matters is... 或 What worries me is... 把注意力集中到某一点上。
    note: '*does create* 是个值得留意的结构：这里的 *does* 不是“做”的意思，而是用来强调 *create*，作用类似汉语的“的确”“确实”。'
  en.b2.unit03.lesson03.teach.overall:
    title: overall
    gloss: 总的来说
    note: '*overall* 着眼于整体，即使存在一些细节问题或例外。'
    example_gloss: 总的来说，莉拉支持这项政策。
  en.b2.unit03.lesson03.teach.condition:
    title: condition
    gloss: 条件
    note: '*condition* 指在某事成立之前必须满足的要求。'
    example_gloss: 她的条件是必须调整时间安排。
  en.b2.unit03.lesson03.teach.reading_passage:
    title: 阅读材料：有条件的支持
    gloss: 莉拉的反馈是正面的，但措辞谨慎、有所限定。她说审核政策总体上看起来合理，这使她的说法留有余地，听起来不那么绝对。她还说它大体上是有用的，只要调整时间安排。这个条件限制了她的支持：她并不是原封不动地接受这项政策。丹尼尔用一个聚焦结构强调了另一个要点：让他担心的是团队的额外工作。两位发言者原则上都支持这项政策，但他们的措辞显示出不同程度的承诺。
    note: 这篇文章展示了如何让同样的基本内容变得更委婉、更强烈或更有条件。
  en.b2.unit03.lesson04.teach.q_policy_seems:
    title: 莉拉措辞谨慎
    gloss: 莉拉说：新的审核政策总体上看起来合理。
    note: '*seems reasonable overall* 比批评要积极，但并不绝对。'
  en.b2.unit03.lesson04.teach.a_not_fully_ready:
    title: 丹尼尔听出了她的谨慎
    gloss: 丹尼尔说：这听起来有点保守。你的意思是它还没有完全准备好吗？
    note: 丹尼尔注意到，莉拉并没有干脆地说 *it is ready*。
  en.b2.unit03.lesson04.teach.q_workable_deadlines:
    title: 莉拉进一步加以限定
    gloss: 莉拉说：没错。它也许可行，但需要更明确的截止日期。
    note: '*may be workable* 为怀疑留有余地；*but* 指出了限制。'
  en.b2.unit03.lesson04.teach.a_what_worries:
    title: 丹尼尔把重点放在一个担忧上
    gloss: 丹尼尔说：我同意。让我担心的是团队的额外工作。
    note: '*What worries me is...* 把焦点放在一个担忧上。'
  en.b2.unit03.lesson04.teach.q_does_create_checks:
    title: 莉拉用 does 来强调
    gloss: 莉拉说：你说得有道理。这项政策确实带来了更好的质量检查，但它也增加了一道审批环节。
    note: '*does create* 强调这个好处确实存在，尽管后面还有限制。'
  en.b2.unit03.lesson04.teach.a_support_conditions:
    title: 丹尼尔总结了这个条件
    gloss: 丹尼尔说：那么我们应该有条件地支持它吗？
    note: 他在概括莉拉那种有所保留的支持。
  en.b2.unit03.lesson04.teach.q_broadly_useful:
    title: 莉拉给出有条件的支持
    gloss: 莉拉说：是的。我会说它大体上是有用的，只要调整时间安排。
    note: '*provided* 在这里的意思是“只要”：只有满足这个条件，支持才成立。'
  en.b2.unit03.lesson04.teach.same_content_triad:
    title: 内容相同，力度有三种
    gloss: 这项政策会带来额外的工作。这项政策似乎会带来额外的工作。这项政策确实会带来额外的工作。
    note: 这三个句子分别练习：中性的说法、用 *seems to* 的委婉说法，以及用 *does* 的强调说法。
