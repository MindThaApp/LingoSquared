teaching:
  en.b1.unit07.lesson01.teach.if:
    title: if
    gloss: 如果，假如
    note: '*if* 引出一个可能发生的条件。'
    example_gloss: 如果公交车晚点，我会给你打电话。
  en.b1.unit07.lesson01.teach.unless:
    title: unless
    gloss: 除非，如果不
    note: '*unless* 大致相当于 *if not*：除非条件成立，否则某事就会发生。'
    example_gloss: 除非计划有变，否则我们十点见面。
  en.b1.unit07.lesson01.teach.condition:
    title: condition
    gloss: 条件
    note: '*condition* 指必须先具备的情况。'
    example_gloss: 条件很明确：大家都到了，我们就开始。
  en.b1.unit07.lesson01.teach.result:
    title: result
    gloss: 结果，后果
    note: '*result* 指由于某个条件而发生的事。'
    example_gloss: 结果是我们在线上开会。
  en.b1.unit07.lesson01.teach.delay:
    title: delay
    gloss: 延误，推迟
    note: '*delay* 表示某事比计划发生得晚。'
    example_gloss: 一次延误可能会让所有人都迟到。
  en.b1.unit07.lesson01.teach.reschedule:
    title: reschedule
    gloss: 改期，重新安排时间
    note: '*reschedule* 表示为约会或会议选一个新的时间。'
    example_gloss: 如果医生很忙，我们就把预约改期。
  en.b1.unit07.lesson02.teach.if_meeting_late:
    title: 真实条件及其结果
    gloss: 如果会议晚开始，我会给大家发一条消息。
    note: 对于将来真实的条件，*if* 后面用一般现在时：用 *If the meeting starts late*，而不是 *will start*。
  en.b1.unit07.lesson02.teach.if_not_ready:
    title: 否定条件
    gloss: 如果报告还没准备好，我们就把评审改期。
    note: '*if ... not* 使条件变成否定。'
  en.b1.unit07.lesson02.teach.grammar_real_condition:
    title: 将来的真实条件
    gloss: 如果会议晚开始，我会发一条消息。如果报告还没准备好，我们就把评审改期。
    note: '*if* 后面用一般现在时，结果部分常用 *will*。'
  en.b1.unit07.lesson03.teach.backup_plan:
    title: backup plan
    gloss: 备用方案，B 计划
    note: '*backup plan* 指为第一个方案行不通而准备的另一个方案。'
    example_gloss: 如果房间被占用了，我们需要一个备用方案。
  en.b1.unit07.lesson03.teach.move_update:
    title: move the update
    gloss: 把更新推迟
    note: '*move the update* 表示把进度更新改到另一个时间再讲。'
    example_gloss: 如果蕾拉迟到，我们就把她的进度更新推到明天。
  en.b1.unit07.lesson03.teach.reading_passage:
    title: 阅读：备用计划
    gloss: 丹尼尔为团队会议写了一份备用方案。如果会议室空着，团队十点在那里开会。如果会议室被占用了，他们就在线上开会。除非蕾拉十点前加入，否则丹尼尔会把她的进度更新推到明天。如果报告还没准备好，米娅会改发一份更简短的更新。
    note: 一篇短文，包含真实的条件、结果和 *unless*。
  en.b1.unit07.lesson04.teach.q_if_meeting_late:
    title: Mia 询问计划
    gloss: 米娅说：丹尼尔，如果会议晚开始，我们该怎么办？
    note: 一个询问某个可能条件所带来结果的问题。
  en.b1.unit07.lesson04.teach.a_send_message:
    title: Daniel 说出结果
    gloss: 丹尼尔说：如果会议晚开始，我会给大家发一条消息。
    note: '*If it starts late, I will...* 把一种真实的可能性和一个具体的行动联系在一起。'
  en.b1.unit07.lesson04.teach.q_if_leila_cannot_join:
    title: Mia 询问 Leila 的情况
    gloss: 米娅说：那如果蕾拉没法加入呢？
    note: 一个用同样的条件结构提出的简短追问。
  en.b1.unit07.lesson04.teach.a_unless_she_joins:
    title: Daniel 使用 'unless'
    gloss: 丹尼尔说：除非她十点前加入，否则我们就把她的进度更新推到明天。
    note: '*unless she joins by ten* 的意思是：如果她十点前没有加入。'
  en.b1.unit07.lesson04.teach.q_room_busy:
    title: Mia 询问房间
    gloss: 米娅说：听起来合理。那如果会议室还是被占用了，我们线上见面吗？
    note: 米娅在确认会议室被占用时的备用方案。
  en.b1.unit07.lesson04.teach.a_meet_online:
    title: Daniel 确认线上计划
    gloss: 丹尼尔说：对，如果会议室被占用了，我们就改在线上见面。
    note: '*instead* 表示这个方案取代另一个方案。'
