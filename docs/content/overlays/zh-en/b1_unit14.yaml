teaching:
  en.b1.unit14.lesson01.teach.would_it_be_possible_to:
    title: would it be possible to
    gloss: 有没有可能（做某事）
    note: '*would it be possible to* 礼貌地询问某事是否行得通。'
    example_gloss: 有没有可能把会议改到星期四？
  en.b1.unit14.lesson01.teach.i_was_wondering_if:
    title: I was wondering if
    gloss: 我在想你能不能……
    note: '*I was wondering if* 让请求显得委婉、不那么直接。'
    example_gloss: 我在想你今天能不能帮我看一下报告。
  en.b1.unit14.lesson01.teach.could_we_possibly:
    title: could we possibly
    gloss: 我们能不能……
    note: '*could we possibly* 礼貌地提出一个请求，是双方要一起做的事。'
    example_gloss: 我们能不能把会议推迟五分钟开始？
  en.b1.unit14.lesson01.teach.i_would_appreciate_it_if:
    title: I would appreciate it if
    gloss: 如果……我会很感激
    note: '*I would appreciate it if* 表示如果对方做某事，你会很感激。'
    example_gloss: 如果你能尽快把会议记录发给我，我会很感激。
  en.b1.unit14.lesson01.teach.agenda:
    title: agenda
    gloss: 议程
    note: '*agenda* 指会议上要讨论的议题清单。'
    example_gloss: Daniel在议程上又加了一项。
  en.b1.unit14.lesson01.teach.follow_up:
    title: follow up
    gloss: 跟进
    note: '*follow up* 指会议或任务结束后再次联系对方。'
    example_gloss: 会后，Mia会发邮件跟进。
  en.b1.unit14.lesson02.teach.move_meeting_thursday:
    title: would it be possible to + 动词
    gloss: 有没有可能把会议改到星期四？
    note: '*would it be possible to* + 动词原形，礼貌地询问能否做出改变。'
  en.b1.unit14.lesson02.teach.review_report_today:
    title: I was wondering if + could
    gloss: 我在想你今天能不能帮我看一下报告。
    note: '*I was wondering if you could* 是一种委婉、礼貌的请求方式。'
  en.b1.unit14.lesson02.teach.grammar_softened_requests:
    title: 工作中委婉的请求
    gloss: 在工作中提出较正式的请求时，可以用委婉的条件句式，如 Would it be possible to... 或 I was wondering if...，而不是直接下命令。这些说法比 Move the meeting 或 Review my report 听起来更有礼貌。
    note: 结构：用委婉的条件句式，而不是直接的命令。
  en.b1.unit14.lesson03.teach.budget_update:
    title: budget update
    gloss: 预算进展报告
    note: '*budget update* 指关于资金使用情况的报告。'
    example_gloss: Daniel为会议准备了预算进展报告。
  en.b1.unit14.lesson03.teach.afterward:
    title: afterward
    gloss: 之后，事后
    note: '*afterward* 指在另一件事之后。'
    example_gloss: 会议记录我们可以之后再过一遍。
  en.b1.unit14.lesson03.teach.reading_passage:
    title: 阅读：会议前的一条消息
    gloss: 你好，Daniel，希望你一切都好。有没有可能把预算进展报告加到明天会议的议程里？如果你能把最新的数据带来，我会很感激。我们能不能提前十分钟开始，这样之后就有时间提问了？谢谢，Mia
    note: 一条简短而专业的消息，包含委婉的请求。
  en.b1.unit14.lesson04.teach.q_start_budget_update:
    title: 团队负责人礼貌地开场
    gloss: 团队负责人说：早上好，Mia。今天有没有可能先从预算进展报告开始？
    note: '*would it be possible to* 礼貌地询问会议的顺序。'
  en.b1.unit14.lesson04.teach.a_add_new_client:
    title: Mia 提出另一个请求
    gloss: Mia说：当然可以。我在想，我们能不能也把新客户加到议程里。
    note: '*I was wondering if we could* 是一种委婉、礼貌地提出建议的方式。'
  en.b1.unit14.lesson04.teach.q_keep_thirty_minutes:
    title: 团队负责人请求开个简短的会
    gloss: 团队负责人说：好主意。我们能不能把这次会议控制在三十分钟以内？
    note: '*could we possibly* 礼貌地提出一个双方要一起做的请求。'
  en.b1.unit14.lesson04.teach.a_questions_in_advance:
    title: Mia 请求下次做某件事
    gloss: Mia说：我会尽力。如果下次大家都能提前发问题，我会很感激。
    note: '*I would appreciate it if* 表示对方做某事你会很感激。'
  en.b1.unit14.lesson04.teach.q_fair_request_followup:
    title: 团队负责人同意并承诺跟进
    gloss: 团队负责人说：这个要求很合理。下次会议前我会发一条提醒作为跟进。
    note: 这里的 *follow up* 指之后再回头跟进。
  en.b1.unit14.lesson04.teach.a_send_updated_agenda:
    title: Mia 以确认收尾
    gloss: Mia说：谢谢。我今天下午会把更新后的议程发出去。
    note: 对话以简短而礼貌的方式结束。
