teaching:
  en.a2.unit30.lesson01.teach.experience:
    title: experience
    gloss: 经验
    note: '*experience* 指经验，尤其是工作经验。'
    example_gloss: 我有两年市场营销方面的经验。
  en.a2.unit30.lesson01.teach.position:
    title: position
    gloss: 职位
    note: '*position* 指公司里的职位或岗位。'
    example_gloss: 这个职位招聘的是市场协调专员。
  en.a2.unit30.lesson01.teach.availability:
    title: availability
    gloss: 可到岗时间
    note: '*availability* 指你什么时候有空，例如什么时候可以开始工作。'
    example_gloss: 面试官问了我什么时候可以到岗。
  en.a2.unit30.lesson01.teach.strength:
    title: strength
    gloss: 优势
    note: '*strength* 指你特别擅长的事情。'
    example_gloss: 我的优势之一是做事有条理。
  en.a2.unit30.lesson01.teach.requirement:
    title: requirement
    gloss: 要求
    note: '*requirement* 指这个职位所要求的条件。'
    example_gloss: 两年工作经验是这个职位的要求。
  en.a2.unit30.lesson02.teach.two_years_experience:
    title: 描述自己的经历
    gloss: 我有两年社交媒体营销方面的经验。
    note: 在求职面试中，可以用这句话介绍自己的工作经验。
  en.a2.unit30.lesson02.teach.one_strength_organized:
    title: 说出一个优点
    gloss: 我的优势之一是做事有条理。
    note: '*One of my strengths is...* 是面试中说出自己优势的常用说法。'
  en.a2.unit30.lesson02.teach.available_next_monday:
    title: 说明自己有空的时间
    gloss: 我下周一就可以开始上班。
    note: 用 *I'm available to start...* 来说明你从什么时候可以开始上班。
  en.a2.unit30.lesson03.teach.resume:
    title: resume
    gloss: 简历
    note: '*resume* 指简历，主要用于美式英语。'
    example_gloss: 请带上您的简历来参加面试。
  en.a2.unit30.lesson03.teach.deadline:
    title: deadline
    gloss: 截止日期
    note: '*deadline* 指某件事必须完成的最后期限，相当于“截止日期”。'
    example_gloss: 在工作中，我总是按时完成任务。
  en.a2.unit30.lesson03.teach.posting_text:
    title: 招聘启事文本
    gloss: Bright Path Marketing 正在招聘一名市场协调专员。要求：两年工作经验、出色的写作能力，以及可立即到岗。请带上您的简历来参加面试。
    note: 这是一则正式的招聘启事，列出了职位要求和一条指示。
  en.a2.unit30.lesson03.teach.i_meet_deadlines:
    title: 谈谈自己的工作方式
    gloss: 我会按时完成任务，也善于团队合作。
    note: '*I meet deadlines* 和 *I work well in a team* 是描述自己工作方式的实用句子。'
  en.a2.unit30.lesson04.teach.q_tell_me_experience:
    title: 面试官询问经验
    gloss: 面试官说：感谢您今天前来。能谈谈您的工作经验吗？
    note: '*Thank you for coming in today* 是面试开场时礼貌的说法。'
  en.a2.unit30.lesson04.teach.a_two_years_managed_team:
    title: Mia 关于经验的回答
    gloss: Mia 说：我有两年社交媒体营销方面的经验。我还带过一个小团队。
    note: 这句话和第 2 课中的经验句相同，只多了一个细节：她带过团队。
  en.a2.unit30.lesson04.teach.q_what_strength:
    title: 询问优点
    gloss: 面试官说：很好。您的优势之一是什么？
    note: 面试官先给出积极的回应，再提出下一个问题。
  en.a2.unit30.lesson04.teach.a_organized_deadlines:
    title: Mia 关于自己优点的回答
    gloss: Mia 说：我很有条理，而且会按时完成任务。
    note: Mia 说出了自己的优势（有条理）和一个具体的例子（按时完成任务）。
  en.a2.unit30.lesson04.teach.q_have_questions:
    title: 询问是否还有问题
    gloss: 面试官问：关于这个职位，您还有什么问题吗？
    note: 这是求职面试结束时的固定问题。
  en.a2.unit30.lesson04.teach.a_wondering_typical_week:
    title: Mia 提出自己的问题
    gloss: Mia 说：有的，我想了解一下这个职位典型的一周是怎样的。
    note: '*I was wondering...* 是自己提问时的一种礼貌说法。'
