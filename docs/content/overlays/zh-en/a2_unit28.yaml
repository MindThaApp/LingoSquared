teaching:
  en.a2.unit28.lesson01.teach.medicine:
    title: medicine
    gloss: 药
    note: '*medicine* 的意思是“药、药物”。'
    example_gloss: 医生给我开了治头痛的药。
  en.a2.unit28.lesson01.teach.prescription:
    title: prescription
    gloss: 处方
    note: '*prescription* 指医生开具的处方。'
    example_gloss: 医生给我开了这种药的处方。
  en.a2.unit28.lesson01.teach.follow_up_appointment:
    title: follow-up appointment
    gloss: 复诊
    note: '*follow-up appointment* 指医生再次检查你情况的复诊预约。'
    example_gloss: 如果没有好转，您需要复诊。
  en.a2.unit28.lesson01.teach.getting_worse:
    title: getting worse
    gloss: 加重
    note: '*getting worse* 指症状越来越严重。'
    example_gloss: 我的头痛在加重，没有好转。
  en.a2.unit28.lesson01.teach.insurance_card:
    title: insurance card
    gloss: 医保卡
    note: '*insurance card* 是你的医疗保险卡，就诊时用来出示保险信息。'
    example_gloss: 请带上您的医保卡来就诊。
  en.a2.unit28.lesson01.teach.reused_symptoms:
    title: 之前的投诉
    gloss: 头痛、喉咙痛、发烧
    note: 你已经在第 22 单元学过这些词，这里再复习一遍。
    example_gloss:
    - 我头痛。
    - 我喉咙痛。
    - 我发烧了。
  en.a2.unit28.lesson02.teach.appointment_request:
    title: 请求预约
    gloss: 我想预约看医生。
    note: 用 *I'd like to...* 礼貌地请求预约。
  en.a2.unit28.lesson02.teach.symptom_duration:
    title: 说明症状已持续多久
    gloss: 我头痛和喉咙痛已经三天了，而且越来越严重。
    note: 对于已经持续了一段时间的状况，英语要用 *Present Perfect*（现在完成时）：*I've had ... for three days*。汉语则常说“已经……三天了”，动词本身不变形。
  en.a2.unit28.lesson03.teach.arrive_early:
    title: arrive ten minutes early
    gloss: 提前十分钟到
    note: '*arrive ten minutes early* 的意思是比预约时间提前十分钟到达。'
    example_gloss: 请在预约时间前十分钟到达。
  en.a2.unit28.lesson03.teach.confirmation_text:
    title: 确认函文本
    gloss: 您的预约已确认，时间是今天下午三点。请带上医保卡，并提前十分钟到达。确认号码是 7724。
    note: 这是一条正式的确认信息，包含时间、您该做什么，以及一个号码。
  en.a2.unit28.lesson04.teach.i_see:
    title: I see.
    gloss: 我明白了。
    note: 用 *I see* 表示你已经明白了。
  en.a2.unit28.lesson04.teach.q_whats_wrong:
    title: 询问出了什么事
    gloss: 医生问：哪里不舒服？
    note: 和蕾拉在第 22 单元中问过的问题相同，这次由医生来问。
  en.a2.unit28.lesson04.teach.a_symptoms_duration:
    title: Daniel 对症状的回答
    gloss: 丹尼尔说：我头痛和喉咙痛已经三天了，而且越来越严重。
    note: 和第 2 课中的句子相同。
  en.a2.unit28.lesson04.teach.a_bad_cold:
    title: 医生的诊断
    gloss: 医生说：我明白了。您得了重感冒。
    note: 这是一个简单、常见的诊断，并不严重。
  en.a2.unit28.lesson04.teach.q_medicine:
    title: 询问药品
    gloss: 丹尼尔问：我需要吃药吗？
    note: 丹尼尔听了诊断之后，询问治疗方法。
  en.a2.unit28.lesson04.teach.a_medicine_instructions:
    title: 药品使用说明
    gloss: 医生说：需要，这种药每天吃两次，连吃五天，还要多喝水。
    note: 这是一条明确的医嘱：每天两次，连续五天。
  en.a2.unit28.lesson04.teach.q_follow_up:
    title: 询问复诊预约
    gloss: 丹尼尔问：如果没有好转，我需要再来吗？
    note: 丹尼尔用了蕾拉在第 22 单元中用过的同一个条件（*if it doesn't get better*）。
  en.a2.unit28.lesson04.teach.a_followup_appointment:
    title: 医生关于复诊的回答
    gloss: 医生说：需要，如果一周内没有好转，请回来复诊。
    note: 医生明确说了丹尼尔什么时候该再来：一周内没有好转的话。
