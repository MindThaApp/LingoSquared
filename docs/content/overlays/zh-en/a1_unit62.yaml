teaching:
  en.a1.unit62.lesson01.teach.phone:
    title: phone
    gloss: 电话，手机
    note: '*phone* 的意思是电话。日常生活中，*phone* 多半指手机。'
    example_gloss: 我的手机在这里。
  en.a1.unit62.lesson01.teach.call:
    title: call
    gloss: 打电话 / 来电
    note: '*call* 既可以是名词“电话、来电”，也可以是动词“打电话”：*a call*（名词），*to call*（动词）。'
    example_gloss: 我可以给你打电话。
  en.a1.unit62.lesson01.teach.message:
    title: message
    gloss: 消息，留言
    note: '*message* 的意思是消息或留言。'
    example_gloss: 请留言。
  en.a1.unit62.lesson01.teach.voicemail:
    title: voicemail
    gloss: 语音留言，语音信箱
    note: '*voicemail* 指录下来的电话留言（语音信箱）。'
    example_gloss: 这条语音留言很短。
  en.a1.unit62.lesson01.teach.repeat:
    title: repeat
    gloss: 重复
    note: '*repeat* 的意思是再说一遍。'
    example_gloss: 请再说一遍。
  en.a1.unit62.lesson01.teach.slowly:
    title: slowly
    gloss: 慢慢地
    note: '*slowly* 的意思是慢慢地。它是以 *-ly* 结尾的副词；汉语里“慢”可以直接放在“说”前面，英语则要用副词 *slowly*，放在动词后面。'
    example_gloss: 请说慢一点。
  en.a1.unit62.lesson02.teach.this_is_leila:
    title: Hello, this is Leila.
    gloss: 你好，我是Leila。
    note: 在英语电话里，用 *this is...* 说明打电话的人是谁。*My name is...* 在电话里听起来不自然。
  en.a1.unit62.lesson02.teach.speak_to_mia:
    title: Can I speak to Mia?
    gloss: 我能和Mia通话吗？
    note: '*speak to* 的意思是“和……说话”。汉语里的“和”，在这里要用 *to*。'
  en.a1.unit62.lesson02.teach.repeat_that:
    title: Please repeat that.
    gloss: 请再说一遍。
    note: '*Please repeat that* 是礼貌地请对方重复。'
  en.a1.unit62.lesson02.teach.speak_slowly:
    title: Please speak slowly.
    gloss: 请说慢一点。
    note: '*slowly* 在这里放在动词 *speak* 的后面。'
  en.a1.unit62.lesson02.teach.leave_message:
    title: Leave a message.
    gloss: 请留言。
    note: '*leave a message* 是“留言”的固定说法。'
  en.a1.unit62.lesson02.teach.call_back_later:
    title: I'll call back later.
    gloss: 我稍后再回电话。
    note: '*call back* 的意思是回电话。小品词 *back* 放在动词后面。'
  en.a1.unit62.lesson03.teach.dialogue_line1:
    title: Mia接电话
    gloss: Mia说：你好，我是Mia。
    note: '*this is Mia* 在电话里听起来很自然。'
  en.a1.unit62.lesson03.teach.dialogue_line2:
    title: Leila说明自己是谁
    gloss: Leila说：你好，Mia，我是Leila。
    note: 在电话里介绍自己时，用 *this is*。
  en.a1.unit62.lesson03.teach.dialogue_line3:
    title: Leila听不清楚
    gloss: Leila说：我听不太清你的声音。
    note: '*can''t hear you well* 的意思是“听不太清你说的话”。'
  en.a1.unit62.lesson03.teach.dialogue_line4:
    title: Leila请对方说慢一点
    gloss: Leila说：请说慢一点。
    note: '*Please speak slowly* 是礼貌的请求。'
  en.a1.unit62.lesson03.teach.dialogue_line5:
    title: Mia说出时间
    gloss: Mia说：好的。会议在四点。
    note: '*at four* 用 *at* 表示钟点。'
  en.a1.unit62.lesson03.teach.dialogue_line6:
    title: Leila请对方重复
    gloss: Leila说：请再说一遍。
    note: '*repeat that* 指的是对方刚刚说的话。'
  en.a1.unit62.lesson03.teach.dialogue_line7:
    title: Mia重复四点
    gloss: Mia说：四点整。
    note: '*Four o''clock* 表示整点时间。'
  en.a1.unit62.lesson03.teach.dialogue_line8:
    title: Leila稍后回电话
    gloss: Leila说：谢谢。我稍后再回电话。
    note: '*I''ll* 是 *I will* 的缩写。'
  en.a1.unit62.lesson04.teach.phone_note:
    title: 电话留言
    gloss: 电话留言：Mia在3:00打来电话。会议在5号房间。请回电话。
    note: 这条留言说明了谁打来电话、时间、房间，以及需要做什么。
  en.a1.unit62.lesson04.teach.reading_passage:
    title: 阅读：一通简短的电话
    gloss: 一通简短的电话：Mia下午给Leila打了电话。声音不清楚，所以Leila请Mia说慢一点。Mia说会议在四点，在5号房间。Leila请Mia重复一下时间。后来，Leila写了一条电话留言。留言上写着Mia在3:00打来电话，请她回电话。
    note: '*called* 是 *call* 的过去式。'
