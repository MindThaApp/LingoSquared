course:
  title: B2 英语
  description: 学习 B2 水平的英语，用轻松自然的中文讲解，帮助你进行有层次的交谈、论证、推测和职场讨论。
units:
  en.b2.unit01.argumentation:
    title: The evidence still supports it
lessons:
  en.b2.unit01.lesson01.argument_structure:
    title: 立场、证据与反驳
  en.b2.unit01.lesson02.building_an_argument:
    title: I agree there are risks, but...
  en.b2.unit01.lesson03.reading_an_argument:
    title: 阅读：为混合办公排班辩护
  en.b2.unit01.lesson04.the_argument_dialogue:
    title: The benefits outweigh the risks
teaching:
  en.b2.unit01.lesson01.teach.claim:
    title: claim
    gloss: 主张，论断
    note: '*claim* 指你要为之辩护的主张或立场。这里不是指投诉，也不是指索赔。'
    example_gloss: 她的主张是这个计划应当继续推进。
  en.b2.unit01.lesson01.teach.evidence:
    title: evidence
    gloss: 证据，依据
    note: '*evidence* 指用来支持你的主张的事实、数据或例子。'
    example_gloss: 这个例子为米娅的主张提供了证据。
  en.b2.unit01.lesson01.teach.counterargument:
    title: counterargument
    gloss: 反方论点
    note: '*counterargument* 指与你的主张相悖的论点。在英语中它写成一个单词。'
    example_gloss: 丹尼尔提出了一个反方论点。
  en.b2.unit01.lesson01.teach.rebut:
    title: rebut
    gloss: 反驳
    note: '*rebut* 指回应一个反方论点，同时不放弃自己的主张。'
    example_gloss: 米娅用证据反驳了这一担忧。
  en.b2.unit01.lesson01.teach.concede:
    title: concede
    gloss: 承认，让步
    note: '*concede* 指承认对方观点中有一部分是合理的。这不等于放弃你的全部主张。'
    example_gloss: 你可以承认一种担忧，而不必放弃自己的核心主张。
  en.b2.unit01.lesson01.teach.outweigh:
    title: outweigh
    gloss: 比……更重要，压过
    note: 当某个好处、风险或理由比另一个更重要时，就用 *outweigh*。
    example_gloss: 有力的证据可以压过一种担忧。
  en.b2.unit01.lesson02.teach.position_with_evidence:
    title: 承认风险，同时坚持立场
    gloss: 我同意这个计划有风险，但证据仍然支持继续推进。
    note: '*I agree..., but...* 先承认对方的观点。接着 *but the evidence still supports...* 表明你的立场没有改变。'
  en.b2.unit01.lesson02.teach.strongest_reason:
    title: 说出你最有力的理由
    gloss: 最有力的理由是调查结果前后一致。
    note: '*The strongest reason is that...* 用来引出你最主要的依据。注意 *that* 之后要用英语的语序：先主语，后动词。'
  en.b2.unit01.lesson02.teach.fair_concern:
    title: 承认一种合理的担忧
    gloss: 这是一种合理的担忧；不过，数据显示的是相反的方向。
    note: '*That is a fair concern; however,...* 听起来很专业：你先承认这种担忧，再用数据来反驳它。'
  en.b2.unit01.lesson02.teach.grammar_argument_shape:
    title: 为一个立场辩护
    gloss: 说出你的主张，给出证据，承认最有力的反对观点，然后加以反驳。像 That is a fair concern 和 However 这样的表达，能让你听起来通情达理，同时又不放弃自己的主张。
    note: 在英语从句中，动词紧跟在主语之后，介词短语放在动词后面：应说 *the data points in the other direction*，不要把动词挪到句末。
  en.b2.unit01.lesson03.teach.retention:
    title: retention
    gloss: 员工留任
    note: '*retention* 在这里指员工留下来，而不是离开。'
    example_gloss: 更高的留任率意味着离开团队的员工更少。
  en.b2.unit01.lesson03.teach.collaboration:
    title: collaboration
    gloss: 合作，协作
    note: '*collaboration* 指为完成某项任务或项目而共同工作，是一个中性的褒义词。'
    example_gloss: 良好的合作有助于团队完成工作。
  en.b2.unit01.lesson03.teach.reading_passage:
    title: 阅读材料：为混合办公排班辩护
    gloss: 米娅主张公司下个季度应继续保留混合办公排班。她的核心主张是，混合办公能提高员工留任率，同时不会降低工作表现。最有力的证据是员工调查：混合办公团队的员工较少表示自己在找别的工作。最有力的反方论点是，如果大家不是每天都在办公室，协作可能会受到影响。米娅承认这种担忧，但她用项目数据加以反驳：混合办公团队按时交付，评估分数还略高一些。因此，她得出结论：好处大于风险。
    note: 这篇文章构建了一个完整的论证：主张、证据、反方论点、反驳和结论。
  en.b2.unit01.lesson04.teach.q_keep_hybrid:
    title: 米娅提出她的主张
    gloss: 米娅说：我认为下个季度我们应该保留混合办公排班。
    note: 米娅一开始就提出了一个明确、可以辩护的主张。
  en.b2.unit01.lesson04.teach.a_strongest_reason:
    title: 丹尼尔询问理由
    gloss: 丹尼尔说：你最有力的理由是什么？
    note: 丹尼尔问的不是一般性的看法，而是最主要的依据。
  en.b2.unit01.lesson04.teach.q_retention_survey:
    title: 米娅给出证据
    gloss: 米娅说：最有力的理由是员工留任。在员工调查中，采用混合办公的人较少表示自己在找别的工作。
    note: 米娅用调查结果作为证据，而不只是凭感觉。
  en.b2.unit01.lesson04.teach.a_collaboration_weaker:
    title: 丹尼尔提出反方论点
    gloss: 丹尼尔说：有些经理说，如果大家不是每天都在办公室，协作就会变弱。
    note: 这就是米娅接下来要回应的反方论点。
  en.b2.unit01.lesson04.teach.q_data_rebuttal:
    title: 米娅用数据反驳
    gloss: 米娅说：这是一种合理的担忧。不过，项目数据并不支持这一点。混合办公团队按时交付了工作，评估分数还略高一些。
    note: '*does not support it* 在这里用 *does*，因为英语的否定句需要助动词 *do*。'
  en.b2.unit01.lesson04.teach.a_benefits_outweigh:
    title: 丹尼尔总结这一立场
    gloss: 丹尼尔说：所以你的立场是，好处大于风险？
    note: '*outweigh* 表示对好处与风险的权衡。'
  en.b2.unit01.lesson04.teach.q_improve_routines:
    title: 米娅以一个解决办法收尾
    gloss: 米娅说：没错。我们应该改进会议流程，而不是取消这种排班。
    note: 米娅在为这个计划辩护的同时，也提出了一项切实可行的改进。
