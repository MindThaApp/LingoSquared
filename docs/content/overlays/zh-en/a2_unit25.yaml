teaching:
  en.a2.unit25.lesson01.teach.appointment:
    title: appointment
    gloss: 预约
    note: '*appointment* 指事先约定好的时间，例如到政府部门办事的预约。'
    example_gloss: 我星期五在车辆管理局（DMV）有个预约。
  en.a2.unit25.lesson01.teach.document:
    title: document
    gloss: 文件
    note: '*document* 指正式文件或书面材料。'
    example_gloss: 请带一份文件作为居住证明。
  en.a2.unit25.lesson01.teach.proof_of_residency:
    title: proof of residency
    gloss: 居住证明
    note: '*proof of residency* 指能证明你住在哪里的文件。'
    example_gloss: 水电费账单可以用作居住证明。
  en.a2.unit25.lesson01.teach.form:
    title: form
    gloss: 表格
    note: '*form* 指需要填写的表格。'
    example_gloss: 请在预约前填好这份表格。
  en.a2.unit25.lesson01.teach.confirmation_number:
    title: confirmation number
    gloss: 确认号码
    note: '*confirmation number* 指用来确认你预约的号码。'
    example_gloss: 您的确认号码是 4471。
  en.a2.unit25.lesson02.teach.i_was_wondering_whether:
    title: I was wondering whether I could make an appointment.
    gloss: 我想问一下，能不能预约。
    note: '*I was wondering whether...* 是一种礼貌、正式的询问方式。'
  en.a2.unit25.lesson02.teach.would_it_be_possible:
    title: Would it be possible to come this Friday?
    gloss: 这个星期五可以来吗？
    note: '*Would it be possible...?* 是非常礼貌的请求。'
  en.a2.unit25.lesson02.teach.because_i_moved:
    title: I need to update my address because I moved last month.
    gloss: 我需要更新我的地址，因为我上个月搬家了。
    note: '*because* 引出表示原因的从句。'
  en.a2.unit25.lesson03.teach.photo_id:
    title: photo ID
    gloss: 带照片的身份证件
    note: '*photo ID* 指带照片的身份证件，例如身份证或驾驶执照。'
    example_gloss: 您需要带照片的身份证件和一份居住证明。
  en.a2.unit25.lesson03.teach.utility_bill:
    title: utility bill
    gloss: 水电费账单
    note: '*utility bill* 指电费、燃气费或水费的账单。'
    example_gloss: 水电费账单是居住证明的常见例子。
  en.a2.unit25.lesson03.teach.notice_text:
    title: 提示文本
    gloss: 要更改您的地址，请带上带照片的身份证件和一份居住证明，例如水电费账单。如果您没有水电费账单，可以带租赁合同。
    note: 这是一则正式的须知：说明了您必须带什么，以及可以用什么来替代。
  en.a2.unit25.lesson03.teach.i_will_bring:
    title: I will bring a photo ID.
    gloss: 我会带一份带照片的身份证件。
    note: 用 *will* 说明自己将要做什么（将来）。
  en.a2.unit25.lesson04.teach.could_you_tell_me:
    title: Could you tell me what I need to bring?
    gloss: 您能告诉我需要带什么吗？
    note: '*Could you tell me...?* 是礼貌的间接问句。*what* 后面用陈述句语序：*what I need to bring*。'
  en.a2.unit25.lesson04.teach.q_since_when:
    title: 询问多久
    gloss: 工作人员问：您在新地址住了多久了？
    note: '*How long have you lived...?* 询问某种状态已持续了多久。英语要用现在完成时（*have lived*），汉语则说“住了多久了”，动词形式不变。回答可以用 *since* 开头：*Since last month.*'
  en.a2.unit25.lesson04.teach.a_since_last_month:
    title: Daniel 的回答
    gloss: 丹尼尔说：从上个月开始。
    note: '*Since last month* 的意思是“从上个月起”。这里简短回答就够了。'
  en.a2.unit25.lesson04.teach.q_would_it_be_possible:
    title: 询问预约时间
    gloss: 丹尼尔问：这个星期五可以来吗？
    note: 和第二课里的问题相同。
  en.a2.unit25.lesson04.teach.a_friday_works_confirmation:
    title: 办事员的回答
    gloss: 工作人员说：可以，星期五上午十点可以。您的确认号码是 4471。
    note: 工作人员确认了时间，并告知了确认号码。
