teaching:
  en.a1.unit68.lesson01.teach.borrow:
    title: borrow
    gloss: 借入（向别人借）
    note: '*borrow* 的意思是向别人借东西，之后再还。'
    example_gloss: 我可以借你的雨伞吗？
  en.a1.unit68.lesson01.teach.lend:
    title: lend
    gloss: 借出（借给别人）
    note: '*lend* 的意思是把东西借给别人。'
    example_gloss: 你能借我一个充电器吗？
  en.a1.unit68.lesson01.teach.umbrella:
    title: umbrella
    gloss: 雨伞
    note: '*umbrella* 的意思是“雨伞”。'
    example_gloss: 我可以借你的雨伞吗？
  en.a1.unit68.lesson01.teach.charger:
    title: charger
    gloss: 充电器
    note: '*charger* 的意思是“充电器”。'
    example_gloss: 你能借我一个充电器吗？
  en.a1.unit68.lesson01.teach.return:
    title: return
    gloss: 归还
    note: '*return* 在这里的意思是“归还”。'
    example_gloss: 请明天还给我。
  en.a1.unit68.lesson01.teach.tomorrow:
    title: tomorrow
    gloss: 明天
    note: '*tomorrow* 的意思是“明天”。'
    example_gloss: 请明天还给我。
  en.a1.unit68.lesson02.teach.borrow_umbrella:
    title: Can I borrow your umbrella?
    gloss: 我可以借你的雨伞吗？
    note: '*Can I borrow...?* 问的是能不能向别人借某样东西。'
  en.a1.unit68.lesson02.teach.lend_charger:
    title: Can you lend me a charger?
    gloss: 你能借我一个充电器吗？
    note: '*Can you lend me...?* 问的是对方能不能把某样东西借给你。'
  en.a1.unit68.lesson02.teach.lend_to_you:
    title: I can lend it to you.
    gloss: 我可以借给你。
    note: '*lend it to you* 的意思是把它借给你。'
  en.a1.unit68.lesson02.teach.return_tomorrow:
    title: Please return it tomorrow.
    gloss: 请明天还给我。
    note: '*Please return it...* 是礼貌地请对方归还东西。'
  en.a1.unit68.lesson02.teach.thanks_lending:
    title: Thank you for lending it.
    gloss: 谢谢你借给我。
    note: '*Thank you for...* 用 *for* 引出感谢的原因。'
  en.a1.unit68.lesson02.teach.need_today:
    title: I need it today.
    gloss: 我今天就要用。
    note: '*today* 的意思是“今天”。'
  en.a1.unit68.lesson03.teach.dialogue_line1:
    title: Leila 想借雨伞
    gloss: Leila 说：嗨，Mia。我可以借你的雨伞吗？
    note: '*Can I borrow your umbrella?* 是请求的说法。'
  en.a1.unit68.lesson03.teach.dialogue_line2:
    title: Mia 把雨伞借给她
    gloss: Mia 说：可以，我可以借给你。
    note: '*lend it to you* 表示 Mia 愿意把它借出去。'
  en.a1.unit68.lesson03.teach.dialogue_line3:
    title: Leila 感谢 Mia
    gloss: Leila 说：谢谢。今天在下雨。
    note: '*It is raining today* 说明了她为什么需要雨伞。'
  en.a1.unit68.lesson03.teach.dialogue_line4:
    title: Mia 要求归还
    gloss: Mia 说：请明天还给我。
    note: '*tomorrow* 说明了雨伞该在什么时候还。'
  en.a1.unit68.lesson03.teach.dialogue_line5:
    title: Leila 问要不要充电器
    gloss: Leila 说：当然。你需要充电器吗？
    note: '*Of course* 的意思是“当然”。'
  en.a1.unit68.lesson03.teach.dialogue_line6:
    title: Mia 想借充电器
    gloss: Mia 说：是的，你能借我一个充电器吗？
    note: '*Can you lend me...?* 是请对方借东西给你的说法。'
  en.a1.unit68.lesson03.teach.dialogue_line7:
    title: Leila 借给她一个
    gloss: Leila 说：好的。我可以借你一个。
    note: '*one* 指的是一个充电器。'
  en.a1.unit68.lesson04.teach.borrowing_note:
    title: 借物便条
    gloss: 借物便条：今天 Leila 拿着 Mia 的雨伞。明天归还。Mia 拿着 Leila 的充电器。
    note: 便条写明了谁拿着什么东西，以及雨伞什么时候要还。
  en.a1.unit68.lesson04.teach.reading_passage:
    title: 短文：互相分享的朋友
    gloss: 互相分享的朋友：天在下雨，所以 Leila 向 Mia 借一把雨伞。Mia 说她可以借给 Leila。Mia 请 Leila 明天归还。后来 Mia 需要一个充电器。Leila 借给了 Mia 一个充电器。两个朋友各写了一张简短的便条，这样她们就能记住要还什么。
    note: '*lent* 是 *lend* 的过去式。'
  en.a1.unit68.lesson04.teach.borrowed_umbrella:
    title: I borrowed your umbrella.
    gloss: 我借了你的雨伞。
    note: '*borrowed* 是 *borrow* 的过去式。'
  en.a1.unit68.lesson04.teach.will_return_tomorrow:
    title: I will return it tomorrow.
    gloss: 我明天会还。
    note: '*will* 加动词原形，表示将来要做的事。'
