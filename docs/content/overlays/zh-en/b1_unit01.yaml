course:
  title: 英语 B1
  description: 学习 B1 水平的英语，用于表达义务、可能性、假设情况和讲述日常经历，附有详细的中文讲解。
units:
  en.b1.unit01.necessity:
    title: 必须做或应该做的事
lessons:
  en.b1.unit01.lesson01.necessity_vocabulary:
    title: must、have to 和 should
  en.b1.unit01.lesson02.saying_what_you_must_do:
    title: I must, I have to, she has to
  en.b1.unit01.lesson03.past_regret_and_prohibition:
    title: Should have, must not, don't have to
  en.b1.unit01.lesson04.the_gym_membership_dialogue:
    title: You must not forget again
teaching:
  en.b1.unit01.lesson01.teach.must:
    title: must
    gloss: 必须（强烈的个人责任）
    note: '*must* 表示强烈的个人责任，也就是你自己认为非常重要的事。'
    example_gloss: 我今天必须完成这项任务。
  en.b1.unit01.lesson01.teach.have_to:
    title: have to
    gloss: 必须（来自外部的要求）
    note: '*have to* 表示来自外部的义务，例如规定或截止日期。'
    example_gloss: 我必须在周五之前付房租。
  en.b1.unit01.lesson01.teach.should:
    title: should
    gloss: 应该 / 你应该
    note: '*should* 是建议，不是硬性要求。'
    example_gloss: 你应该尽快给牙医打电话。
  en.b1.unit01.lesson01.teach.task:
    title: task
    gloss: 任务
    note: '*task* 指需要完成的任务或工作。'
    example_gloss: 我还有一项任务要完成。
  en.b1.unit01.lesson01.teach.rent:
    title: rent
    gloss: 房租
    note: '*rent* 指为住处支付的钱。'
    example_gloss: 房租周五到期。
  en.b1.unit01.lesson01.teach.appointment:
    title: appointment
    gloss: 预约
    note: '*appointment* 指与某人约定好的时间，例如看医生。'
    example_gloss: 我这周有一个牙医预约。
  en.b1.unit01.lesson02.teach.must_finish_task:
    title: 表达强烈的义务
    gloss: 我今天必须完成这项任务。
    note: '*I must* 表示强烈的个人责任。'
  en.b1.unit01.lesson02.teach.have_to_pay_rent:
    title: 表达外部强加的义务
    gloss: 我必须在周五之前付房租。
    note: '*I have to* 表示来自外部的义务，比如付款期限。'
  en.b1.unit01.lesson02.teach.she_has_to_make:
    title: '''she'' 的动词形式'
    gloss: 她必须预约一个时间。
    note: 主语是 *he/she/it* 时，*have to* 要变成 *has to*。
  en.b1.unit01.lesson02.teach.you_should_call:
    title: 给出建议
    gloss: 你应该打电话确认预约。
    note: '*should* 表示建议，不像 *must* 或 *have to* 那样是硬性要求。'
  en.b1.unit01.lesson02.teach.grammar_agreement:
    title: '''have to'' 的各种形式'
    gloss: 我必须走了。她必须走了。我们必须走了。他们必须走了。
    note: 只有主语是 *he/she/it* 时 *have* 才变成 *has*；其他人称都用 *have to*。
  en.b1.unit01.lesson03.teach.should_have_called:
    title: 表达对过去的懊悔
    gloss: 我本该早点打电话的。
    note: '*should have* + 过去分词表示对没做的事感到后悔。'
    example_gloss: 我本该早点打电话的。
  en.b1.unit01.lesson03.teach.must_not:
    title: must not
    gloss: 不许 / 不得
    note: '*must not* 表示禁止，即绝对不允许。注意：*must not* 的意思是“不许”，不是“不必”；“不必”要用 *don''t have to*。'
    example_gloss: 你不能再忘记了。
  en.b1.unit01.lesson03.teach.dont_have_to:
    title: don't have to
    gloss: 不必 / 不需要
    note: '*don''t have to* 表示没有义务去做，这与表示禁止的 *must not* 不同。'
    example_gloss: 如果你忙，就不必来了。
  en.b1.unit01.lesson03.teach.grammar_past_regret:
    title: 懊悔、禁止和无需做
    gloss: 我本该打电话的。我忘了。你不能再忘记了。你不必来。
    note: '*should have* + 过去分词表示对过去的事感到后悔。*must not* 是禁止；*don''t have to* 表示没有义务，但做也可以。'
  en.b1.unit01.lesson03.teach.reading_passage:
    title: 阅读：健身房
    gloss: 昨天，丹尼尔忘了续办健身房会员。他本该在手机上设一个提醒的。现在他必须交滞纳金。下个月他不能再忘了。
    note: 一篇短文，讲丹尼尔的失误及其后果。
  en.b1.unit01.lesson04.teach.q_renew_gym:
    title: Leila 询问会员资格
    gloss: 蕾拉说：丹尼尔，你续办健身房会员了吗？
    note: 这是一个直接的问句，用来确认某件事是否已经办好。
  en.b1.unit01.lesson04.teach.a_forgot_should_have:
    title: Daniel 的回答：忘记了
    gloss: 丹尼尔说：糟了，我忘了！我上周就该办的。
    note: '*I should have done that* 表示对没做的事感到后悔。'
  en.b1.unit01.lesson04.teach.q_call_today:
    title: Leila 提醒 Daniel
    gloss: 蕾拉说：你今天必须给他们打电话，不然就要交滞纳金了。
    note: 这里的 *must* 表示一个紧迫的个人警告。
  en.b1.unit01.lesson04.teach.a_also_pay_rent:
    title: Daniel 说出其他职责
    gloss: 丹尼尔说：你说得对。我周五前还得付房租，也应该给牙医打个电话。
    note: 丹尼尔在一句话里同时用了 *have to*（义务）和 *should*（建议）。
  en.b1.unit01.lesson04.teach.q_dont_have_to:
    title: Leila 安慰 Daniel
    gloss: 蕾拉说：你不必今天把所有事都做完。但你不能再忘记健身房的事了。
    note: 蕾拉把 *don't have to*（没有义务）和 *must not*（禁止）作了对比。
  en.b1.unit01.lesson04.teach.a_more_organized:
    title: Daniel 下定决心
    gloss: 丹尼尔说：我知道。这个月我得更有条理一些。
    note: 这里的 *I must be* 表示个人的决心。
