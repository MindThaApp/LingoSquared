course:
  title: B2 英语
  description: 学习 B2 水平的英语，用轻松自然的中文讲解，帮助你进行有层次的交谈、论证、推测和职场讨论。
units:
  en.b2.unit05.register:
    title: Same message, different register
lessons:
  en.b2.unit05.lesson01.audience_and_formality:
    title: 非正式、职场得体与正式
  en.b2.unit05.lesson02_same_request_three_ways:
    title: Can you, could we, I would be grateful
  en.b2.unit05.lesson03.reading_same_message:
    title: 阅读：三类对象
  en.b2.unit05.lesson04.the_register_dialogue:
    title: To a friend, yes. To the clinic, no.
teaching:
  en.b2.unit05.lesson01.teach.register:
    title: Register
    gloss: 语域，语言的正式程度
    note: '*register* 指你说话或写作时听起来有多正式或随意。中文有“你”和“您”之分，而英语只有 *you*；语气主要靠整个句子的措辞来体现。'
    example_gloss: 对象一变，语域也随之改变。
  en.b2.unit05.lesson01.teach.casual:
    title: casual
    gloss: 随意的，非正式的
    note: '*casual* 适用于朋友或熟人。它比较直接，但不一定就是不礼貌。'
    example_gloss: 非正式的消息适合发给朋友。
  en.b2.unit05.lesson01.teach.professional:
    title: professional
    gloss: 职场得体的，专业的
    note: '*professional* 适用于同事：礼貌、清楚，但不过分正式。'
    example_gloss: 职场得体的消息适合发给同事。
  en.b2.unit05.lesson01.teach.formal:
    title: formal
    gloss: 正式的
    note: '*formal* 适用于机构。在英语里，通常用更长、更委婉的请求句式来表达。'
    example_gloss: 正式的消息适合发给机构。
  en.b2.unit05.lesson01.teach.audience:
    title: audience
    gloss: 受众，对象
    note: '*audience* 指你写给或说给的那个人或那群人。'
    example_gloss: 你的对象会影响你的用词。
  en.b2.unit05.lesson01.teach.institution:
    title: institution
    gloss: 机构，组织
    note: '*institution* 指诊所、银行或大学这样的组织。'
    example_gloss: 诊所是一种机构。
  en.b2.unit05.lesson02.teach.formal_request:
    title: 正式的请求
    gloss: 如果您能确认我的预约是否可以改到周五，我将不胜感激。
    note: '*I would be grateful if you could...* 是正式说法。英语不需要像中文那样把“你”换成“您”来表示敬意，礼貌体现在整个句式里。'
  en.b2.unit05.lesson02.teach.casual_request:
    title: 非正式的请求
    gloss: 你能把它改到周五吗？
    note: '*Can you...?* 对朋友说没问题，但对机构来说很容易显得太直接。'
  en.b2.unit05.lesson02.teach.professional_request:
    title: 职场得体的请求
    gloss: 如果周五你仍然方便的话，我们可以把预约改到周五吗？
    note: '*Could we...?* 对同事来说听起来合作而礼貌。'
  en.b2.unit05.lesson02.teach.to_whom:
    title: Dear scheduling team,
    gloss: 尊敬的排期团队：
    note: '*Dear...* 是正式书信和邮件中常规的称呼，不会显得拘谨。'
  en.b2.unit05.lesson02.teach.grammar_register_shift:
    title: 切换语域
    gloss: 切换语域时，内容保持不变。非正式的英语可以用直接的问句。职场得体的英语常用 could。正式的英语常用 I would be grateful if you could。
    note: 不要只想着中文的“你”和“您”之分：在英语里，变化的是整个句子。
  en.b2.unit05.lesson03.teach.stiff:
    title: stiff
    gloss: 拘谨的，过于正式的
    note: '*stiff* 指一条消息对当时的场合来说正式得不必要。'
    example_gloss: 拘谨的消息对这种场合来说听起来太正式了。
  en.b2.unit05.lesson03.teach.appropriate:
    title: appropriate
    gloss: 恰当的，合适的
    note: '*appropriate* 指措辞与对象和场合相称。'
    example_gloss: 恰当的消息与对象相称。
  en.b2.unit05.lesson03.teach.reading_passage:
    title: 阅读：同一条消息，三类对象
    gloss: Nina 需要把一个预约改到周五。她给朋友写道：Can you move it to Friday? 这条消息直接而随意。她给同事写道：Could we move the appointment to Friday if that still works for you? 这条消息职场得体而礼貌。她给诊所写道：I would be grateful if you could confirm whether my appointment can be moved to Friday. 三段文字的内容相同，但语域随对象而变化。
    note: 在英语里，语域是通过措辞来改变的，而不是靠另一个表示“您”的词。
  en.b2.unit05.lesson04.teach.q_need_ask:
    title: Nina 询问措辞
    gloss: Nina 说：我需要问一下能不能改预约时间。我可以直接写：'Can you move it?' 吗？
    note: '*just write* 表明她拿不准这种直接的说法是否合适。'
  en.b2.unit05.lesson04.teach.a_too_casual:
    title: Oscar 指出语域问题
    gloss: Oscar 说：对朋友可以。对诊所来说，这样听起来太随意了。
    note: 这里在英语里同样只用 *you*，但句子本身对诊所来说太直接了。
  en.b2.unit05.lesson04.teach.q_colleague:
    title: Nina 询问给同事的写法
    gloss: Nina 问：你会给同事写什么？
    note: 写给同事要用职场得体的语气，而不是最正式的语域。
  en.b2.unit05.lesson04.teach.a_colleague_request:
    title: Oscar 给出给同事的版本
    gloss: Oscar 说：我会写：'Could we move the appointment to Friday if that still works for you?'
    note: '*Could we* 和 *if that still works for you* 让请求显得更委婉。'
  en.b2.unit05.lesson04.teach.q_clinic:
    title: Nina 询问给诊所的写法
    gloss: Nina 问：那给诊所呢？
    note: 写给机构需要更正式的请求句式。
  en.b2.unit05.lesson04.teach.a_clinic_request:
    title: Oscar 给出正式版本
    gloss: Oscar 说：我会写：'I would be grateful if you could confirm whether my appointment can be moved to Friday.'
    note: 这个版本不是生硬地要求对方采取行动，而是请对方确认。
  en.b2.unit05.lesson04.teach.q_same_message:
    title: Nina 做总结
    gloss: Nina 说：同样的信息，不同的语域。
    note: 内容保持不变：把预约改到周五。
  en.b2.unit05.lesson04.teach.a_content_stays:
    title: Oscar 表示赞同
    gloss: Oscar 说：没错。内容不变，但正式程度变了。
    note: 这正是 B2 水平语域控制的核心。
