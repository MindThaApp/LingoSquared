teaching:
  en.b2.unit06.lesson01.teach.value:
    title: value
    gloss: 价值，价值观
    note: '*value* 在这里指人们看重的原则，而不只是金钱上的价值。'
    example_gloss: 公平是一种价值观。
  en.b2.unit06.lesson01.teach.fairness:
    title: fairness
    gloss: 公平，公正合理
    note: '*fairness* 指合理地对待他人。它比单纯的 *nice* 更有力，也更抽象。'
    example_gloss: 公平意味着合理地对待他人。
  en.b2.unit06.lesson01.teach.convenience:
    title: convenience
    gloss: 便利，方便
    note: '*convenience* 指便利、方便。在这类 B2 语境中，不要把“方便”“容易”随意直译成 *easiness*。'
    example_gloss: 便利让日常生活更轻松。
  en.b2.unit06.lesson01.teach.flexibility:
    title: flexibility
    gloss: 灵活性
    note: '*flexibility* 指在情况变化时随之调整的能力。'
    example_gloss: 灵活性使人在情况变化时能够做出改变。
  en.b2.unit06.lesson01.teach.qualify:
    title: qualify
    gloss: 限定，使观点有所保留
    note: '*qualify* 在这里指限定或修正自己的观点，不是“取得资格”的意思。'
    example_gloss: 你可以通过设定限制来修正自己的观点。
  en.b2.unit06.lesson01.teach.prioritize:
    title: prioritize
    gloss: 优先考虑，优先对待
    note: '*prioritize fairness* 的意思是把公平看得比其他价值更重要。'
    example_gloss: 优先考虑公平，就是把它看得比其他东西更重要。
  en.b2.unit06.lesson02.teach.in_principle:
    title: 权衡价值观
    gloss: 原则上，便利很重要，但公平应该更有分量。
    note: '*In principle* 在这里表示“原则上”。它表示大体上成立，但可能有例外；不是“最终”的意思。'
  en.b2.unit06.lesson02.teach.not_arguing_everywhere:
    title: 限定你的立场
    gloss: 我并不是主张到处都要保持安静。
    note: '*I am not arguing for...* 用来限定你的主张，比含糊地说 *a little* 更准确。'
  en.b2.unit06.lesson02.teach.respond_opposing:
    title: 直接回应对方
    gloss: 这话有道理，我也同意企业需要灵活性。
    note: '*That is fair* 承认对方的观点，同时并不放弃你自己的价值取向。'
  en.b2.unit06.lesson02.teach.grammar_abstract_response:
    title: 构建抽象的观点
    gloss: 一个有力的抽象观点会点明一种价值，限定自己的主张，并直接回应对方的看法。
    note: 请使用准确的 B2 词汇，如 *in principle*、*fairness* 和 *carry more weight*，而不是每次都用 *a bit* 来表示分寸。
  en.b2.unit06.lesson03.teach.transparent:
    title: transparent
    gloss: 透明的，公开清晰的
    note: '*transparent rules* 指容易理解、也容易监督检查的规则。'
    example_gloss: 透明的规则容易理解。
  en.b2.unit06.lesson03.teach.commercial:
    title: commercial
    gloss: 商业的，营利性的
    note: '*commercial activity* 指与企业和盈利有关的活动。'
    example_gloss: 商业活动与企业有关。
  en.b2.unit06.lesson03.teach.reading_passage:
    title: 阅读：安静的公共空间
    gloss: Amara 主张应当保护安静的公共空间，即使这会限制某些商业活动。她的观点并不绝对：她并不是主张到处都要保持安静，而且她承认企业需要一定的灵活性。Leo 的对立观点是，规则可能让企业更难生存。Amara 直接回应了这一点，她说便利很重要，但当一个空间属于所有人时，公平应该更有分量。她的立场是有所限定的，因为她支持的是有限而透明的规则，而不是无限的限制。
    note: 这就是抽象的英语表达：点明价值，并准确地限定你的主张。
  en.b2.unit06.lesson04.teach.q_protect_spaces:
    title: Amara 说出自己的立场
    gloss: Amara 说：我认为城市应该保护安静的公共空间，即使这会限制一些商业活动。
    note: '*even if* 表明她承认这样做有代价。'
  en.b2.unit06.lesson04.teach.a_business_flexibility:
    title: Leo 提出另一种价值
    gloss: Leo 说：我也看重安静，但企业需要灵活性才能生存。
    note: Leo 把灵活性摆在 Amara 强调的公共空间的对面。
  en.b2.unit06.lesson04.teach.q_not_silence:
    title: Amara 做出限定
    gloss: Amara 说：这话有道理，我并不是主张到处都要保持安静。我的意思是，共享空间不应该只由利润来塑造。
    note: '*not arguing for silence everywhere* 避免了她的立场听起来过于绝对。'
  en.b2.unit06.lesson04.teach.a_prioritizing:
    title: Leo 点明这一价值
    gloss: Leo 说：所以你优先考虑的价值是公平，而不只是舒适？
    note: '*prioritizing* 在这里的意思是：在权衡中把它放在更重要的位置。'
  en.b2.unit06.lesson04.teach.q_fairness_weight:
    title: Amara 权衡价值
    gloss: Amara 说：没错。原则上，便利很重要，但当一个空间属于所有人时，公平应该更有分量。
    note: '*carry more weight* 是表示“更有分量”的地道英语说法。'
  en.b2.unit06.lesson04.teach.a_accept_rules:
    title: Leo 有条件地接受
    gloss: Leo 说：如果规则是有限而透明的，我可以接受。
    note: 他是否接受，取决于规则是否有限、是否清楚。
