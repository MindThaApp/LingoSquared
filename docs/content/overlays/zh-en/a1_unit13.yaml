teaching:
  en.a1.unit13.lesson01.teach.happy:
    title: happy
    gloss: 开心的／高兴的
    note: '*happy* 的意思是“开心的、高兴的”。'
    example_gloss: 我今天很开心。
  en.a1.unit13.lesson01.teach.sad:
    title: sad
    gloss: 难过的
    note: '*sad* 的意思是“难过的、伤心的”。'
    example_gloss: 她看起来很难过。
  en.a1.unit13.lesson01.teach.tired:
    title: tired
    gloss: 累的
    note: '*tired* 的意思是“累的、疲倦的”。'
    example_gloss: 我很累。
  en.a1.unit13.lesson01.teach.excited:
    title: excited
    gloss: 兴奋的／期待的
    note: '*excited* 的意思是对好事感到兴奋或期待，不是消极意义上的紧张（紧张不安要用 *worried*）。'
    example_gloss: 我很期待明天。
  en.a1.unit13.lesson01.teach.worried:
    title: worried
    gloss: 担心的
    note: '*worried* 的意思是对可能发生的事感到担心或紧张。'
    example_gloss: 他在担心明天的事。
  en.a1.unit13.lesson02.teach.how_are_you_feeling:
    title: How are you feeling today?
    gloss: 你今天感觉怎么样？
    note: '*How are you feeling?* 专门询问此刻的心情或状态，比较笼统的问候语是 *How are you?*'
  en.a1.unit13.lesson02.teach.im_worried_because:
    title: I'm a little worried because I have a big test tomorrow.
    gloss: 我有点担心，因为我明天有一场重要的考试。
    note: '*because* 的意思是“因为”，用来引出产生这种感受的原因。'
  en.a1.unit13.lesson02.teach.im_happy_because:
    title: I'm happy because the class is almost over.
    gloss: 我很开心，因为课程快结束了。
    note: '*almost over* 的意思是“快结束了”。'
  en.a1.unit13.lesson03.teach.message_text:
    title: 一条关于感受的消息
    gloss: 你好，我有点担心，因为我明天有一场重要的考试。不过我也很期待，因为这是今年的最后一场！
    note: 一条留言可以用几个连在一起的短句表达多种甚至相反的感受。
  en.a1.unit13.lesson03.teach.writer_summary:
    title: The writer is worried and excited.
    gloss: 写信的人既担心又期待。
    note: '*writer* 指写这条留言的人。'
  en.a1.unit13.lesson04.teach.i_understand:
    title: Oh, I understand.
    gloss: 哦，我明白了。
    note: '*I understand* 的意思是“我明白了”——在倾听时表示同情和理解。'
  en.a1.unit13.lesson04.teach.q_feeling:
    title: Leila 的提问
    gloss: 蕾拉：你今天感觉怎么样？
    note: 蕾拉通过询问丹尼尔的感受来开启对话。
  en.a1.unit13.lesson04.teach.a_worried_test:
    title: Daniel 的回答
    gloss: 丹尼尔：我有点担心，因为我明天有一场重要的考试。
    note: 丹尼尔说出了自己的感受和原因。
  en.a1.unit13.lesson04.teach.acknowledge_and_ask:
    title: Leila 的反应
    gloss: 蕾拉：哦，我明白了。你也有点期待吗？
    note: 蕾拉表示理解，并询问另一种感受。
  en.a1.unit13.lesson04.teach.a_yes_happy_class:
    title: Daniel 的回答
    gloss: 丹尼尔：有一点。我很高兴课程快结束了。
    note: 丹尼尔简短地肯定，并说出第二种积极的感受。
