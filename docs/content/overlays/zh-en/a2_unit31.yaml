teaching:
  en.a2.unit31.lesson01.teach.delay:
    title: delay
    gloss: 晚点
    note: '*delay* 的意思是晚点。'
    example_gloss: 5:15 的那趟火车晚点了 45 分钟。
  en.a2.unit31.lesson01.teach.cancelled:
    title: cancelled
    gloss: 取消
    note: '*cancelled* 指某件事不再进行。用于火车时，指这趟车取消、不开行。'
    example_gloss: 5:15 的那趟火车没有被取消，只是晚点了。
  en.a2.unit31.lesson01.teach.alternative:
    title: alternative
    gloss: 替代方案
    note: '*alternative* 指另一种可选的办法。'
    example_gloss: 工作人员提供了一个替代方案：5:30 的巴士。
  en.a2.unit31.lesson01.teach.notice:
    title: notice
    gloss: 通知
    note: '*notice* 指给旅客的书面通知，例如车站里张贴的告示。'
    example_gloss: 我在车站看到了一则关于晚点的通知。
  en.a2.unit31.lesson01.teach.signal_problem:
    title: signal problem
    gloss: 信号故障
    note: '*signal problem* 指铁路沿线信号设备出了故障。'
    example_gloss: 晚点是由线路上的信号故障造成的。
  en.a2.unit31.lesson02.teach.wondering_why_delayed:
    title: 礼貌地询问原因
    gloss: 我想问一下，火车为什么晚点了。
    note: '*I was wondering why...* 是询问原因时礼貌、委婉的说法。'
  en.a2.unit31.lesson02.teach.another_way_home:
    title: 询问替代方案
    gloss: 今晚有别的办法回家吗？
    note: 用 *Is there another way to...?* 来询问其他选择。
  en.a2.unit31.lesson02.teach.delayed_because_signal:
    title: 说明迟到的原因
    gloss: 火车因信号故障而晚点。
    note: 用 *has been delayed because of...* 来说明晚点的原因。
  en.a2.unit31.lesson03.teach.departure_time:
    title: departure time
    gloss: 发车时间
    note: '*departure time* 的意思是发车时间。'
    example_gloss: 新的发车时间是 6 点整。
  en.a2.unit31.lesson03.teach.notice_text:
    title: 通知文本
    gloss: 通知：5:15 的火车因信号故障晚点。新的发车时间是 6:00。5:30 有一趟巴士在车站外候车。
    note: 这是一则正式的通知，写明了原因、新的时间和一个替代方案。
  en.a2.unit31.lesson03.teach.i_will_take_the_bus:
    title: 告知自己的决定
    gloss: 我改坐巴士。
    note: '*instead* 的意思是“改为、代替”。'
  en.a2.unit31.lesson04.teach.q_can_i_help:
    title: 工作人员主动提供帮助
    gloss: 工作人员问：需要帮忙吗？
    note: '*Can I help you?* 是车站工作人员的标准问句。'
  en.a2.unit31.lesson04.teach.a_wondering_why_delayed:
    title: Daniel 询问原因
    gloss: Daniel 说：是的，我想问一下火车为什么晚点了。
    note: 和第 2 课中礼貌的问法相同。
  en.a2.unit31.lesson04.teach.q_signal_problem_new_time:
    title: 工作人员解释延误
    gloss: 工作人员说：线路上出现了信号故障。新的发车时间是 6 点整。
    note: 工作人员说明了原因和新的发车时间。
  en.a2.unit31.lesson04.teach.a_another_way_home_tonight:
    title: Daniel 询问替代方案
    gloss: Daniel 说：今晚有别的办法回家吗？
    note: 和第 2 课中的问题相同。
  en.a2.unit31.lesson04.teach.q_bus_at_530:
    title: 工作人员说出替代方案
    gloss: 工作人员说：5:30 有一趟巴士从车站外发车。
    note: 工作人员给出了一个具体的替代方案，包括时间和地点。
  en.a2.unit31.lesson04.teach.a_thank_you_take_bus:
    title: Daniel 的最终决定
    gloss: Daniel 说：谢谢。那我改坐巴士。
    note: Daniel 向工作人员道谢，并说出了自己的决定。
