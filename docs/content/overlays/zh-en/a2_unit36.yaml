teaching:
  en.a2.unit36.lesson01.teach.certificate:
    title: certificate
    gloss: 证明
    note: '*certificate* 是机构出具的正式证明文件；*registration certificate* 是登记证明。'
    example_gloss: 我的登记证明在预约后两周才寄到。
  en.a2.unit36.lesson01.teach.mistake:
    title: mistake
    gloss: 错误
    note: '*mistake* 指写错或做错的地方。'
    example_gloss: 这张表格上我的地址有一处错误。
  en.a2.unit36.lesson01.teach.spelled:
    title: spelled
    gloss: 拼写的
    note: '*spelled* 说明一个词是用哪些字母、按什么顺序写出来的。'
    example_gloss: 我的名字拼写时只有一个 L，不是两个。
  en.a2.unit36.lesson01.teach.correct:
    title: correct
    gloss: 更正
    note: '*correct* 在这里是动词：把错的改成对的。'
    example_gloss: 工作人员今天可以更正我的姓氏。
  en.a2.unit36.lesson01.teach.copy:
    title: copy
    gloss: 复印件
    note: '*copy* 是文件的第二份、内容完全相同的版本。'
    example_gloss: 该机构会为每份文件保留一份复印件。
  en.a2.unit36.lesson01.teach.passport:
    title: passport
    gloss: 护照
    note: '*passport* 是带有你照片的出行证件。'
    example_gloss: 去机构办事预约时，我总是带上护照。
  en.a2.unit36.lesson01.teach.grammar_there_is_there_are:
    title: there is 和 there are
    gloss: 我的证明上有一处错误。我的证明上有两处错误。
    note: '*there is* 用于单个事物，*there are* 用于多个事物。中文的“有”不随数量变化，而英语的动词要随数量变化。'
  en.a2.unit36.lesson02.teach.there_is_a_mistake:
    title: 说明有错误
    gloss: 我的登记证明上有一处错误。
    note: '*There is a mistake on...* 是客观、正式地反映错误的说法。'
  en.a2.unit36.lesson02.teach.name_spelled_wrong:
    title: 说明具体哪里不对
    gloss: 我的姓氏拼写错了。
    note: '*last name* 是姓氏；*first name* 是名字。'
  en.a2.unit36.lesson02.teach.could_you_correct_it:
    title: 询问是否可以更正
    gloss: 请您更正一下，可以吗？
    note: '*Could you...?* 比 *Can you...?* 更礼貌，适合在办事窗口使用。'
  en.a2.unit36.lesson02.teach.how_long_correction:
    title: 询问需要多长时间
    gloss: 更正需要多长时间？
    note: '*How long...?* 询问的是时间的长短，而不是物体的长度。'
  en.a2.unit36.lesson02.teach.grammar_polite_request:
    title: 两个礼貌的请求
    gloss: 请您更正一下，可以吗？有没有可能重新拿到一份新的证明？
    note: '*Could you...?* 请对方做某事；*Would it be possible to...?* 更加委婉，询问某事是否可行。'
  en.a2.unit36.lesson03.teach.working_days:
    title: working days
    gloss: 工作日
    note: '*working days* 指周一到周五，不包括周末。'
    example_gloss: 该机构会在五个工作日内回复每一封来信。
  en.a2.unit36.lesson03.teach.notice_text:
    title: 更正函
    gloss: 已收到更正申请。您的登记证明将在五个工作日内更正。请携带您的护照和本通知前往办公室。参考编号 3092。
    note: 官方通知简短而客观：已经发生了什么、将会发生什么，以及您需要做什么。
  en.a2.unit36.lesson03.teach.bring_passport_and_notice:
    title: 需要携带的东西
    gloss: 请携带您的护照和本通知前往办公室。
    note: '*bring ... to ...* 的意思是把某物带到某个地方。'
  en.a2.unit36.lesson04.teach.q_there_is_a_mistake:
    title: Leila 报告错误
    gloss: Leila 说：您好，我的登记证明上有一处错误。
    note: '*Hello* 比 *Hi* 更中性、更正式，更适合在办事窗口使用。'
  en.a2.unit36.lesson04.teach.a_what_is_wrong:
    title: 办事员追问
    gloss: 工作人员说：明白了。是哪里有问题？
    note: 这里的 *I see* 的意思是：我明白了，我在听。
  en.a2.unit36.lesson04.teach.q_name_spelled_wrong:
    title: Leila 说明错误并请求更正
    gloss: Leila 说：我的姓氏拼写错了。请您更正一下，可以吗？
    note: 和第 2 课中的两句话相同，这次连在一起说。
  en.a2.unit36.lesson04.teach.a_do_you_have_passport:
    title: 办事员询问护照
    gloss: 工作人员说：当然可以。您带护照了吗？
    note: '*Do you have ... with you?* 的意思是：您现在带在身上吗？'
  en.a2.unit36.lesson04.teach.q_here_it_is:
    title: Leila 递上她的护照
    gloss: Leila 说：带了，给您。
    note: 递东西给别人时会说 *Here it is*。
  en.a2.unit36.lesson04.teach.a_copy_and_send:
    title: 办事员说明他在做什么
    gloss: 工作人员说：谢谢。我会复印一份，并在今天发出更正。
    note: '*make a copy* 是固定搭配：复印一份。'
  en.a2.unit36.lesson04.teach.q_how_long:
    title: Leila 询问需要多久
    gloss: Leila 问：更正需要多长时间？
    note: 和第 2 课中的问题相同。
  en.a2.unit36.lesson04.teach.a_within_five_working_days:
    title: 办事员的回答
    gloss: 工作人员说：五个工作日内。
    note: '*within* 表示在一段期限之内，也就是最多需要五个工作日。'
  en.a2.unit36.lesson04.teach.q_thank_you:
    title: Leila 感谢办事员
    gloss: Leila 说：非常感谢。
    note: '*very much* 让感谢的语气更强烈。'
