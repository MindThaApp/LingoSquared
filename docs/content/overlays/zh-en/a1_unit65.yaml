teaching:
  en.a1.unit65.lesson01.teach.return:
    title: return
    gloss: 退回 / 退货
    note: '*return* 的意思是把东西拿回商店退掉。'
    example_gloss: 我想把这个退掉。
  en.a1.unit65.lesson01.teach.exchange:
    title: exchange
    gloss: 换
    note: '*exchange* 的意思是把一件商品换成另一件。'
    example_gloss: 我可以换一下吗？
  en.a1.unit65.lesson01.teach.receipt:
    title: receipt
    gloss: 小票 / 收据
    note: '*receipt* 的意思是购物后拿到的“收据”或“小票”。'
    example_gloss: 你有小票吗？
  en.a1.unit65.lesson01.teach.size:
    title: size
    gloss: 尺码
    note: '*size* 的意思是“尺码”，例如衣服的尺码。'
    example_gloss: 我需要大一号的。
  en.a1.unit65.lesson01.teach.refund:
    title: refund
    gloss: 退款
    note: '*refund* 的意思是退还给你的钱。'
    example_gloss: 你可以拿到退款。
  en.a1.unit65.lesson01.teach.small:
    title: small
    gloss: 小
    note: '*small* 的意思是“小”。'
    example_gloss: 这个尺码太小了。
  en.a1.unit65.lesson02.teach.want_return:
    title: I want to return this.
    gloss: 我想把这个退掉。
    note: '*I want to return this* 是在退换货柜台说的直接说法。'
  en.a1.unit65.lesson02.teach.can_exchange:
    title: Can I exchange it?
    gloss: 我可以换一下吗？
    note: '*Can I...?* 用来询问某事是否可行或是否允许。'
  en.a1.unit65.lesson02.teach.have_receipt:
    title: Do you have the receipt?
    gloss: 你有小票吗？
    note: '*receipt* 是证明你已付款的小票。'
  en.a1.unit65.lesson02.teach.too_small:
    title: This size is too small.
    gloss: 这个尺码太小了。
    note: '*too small* 的意思是“太小”。'
  en.a1.unit65.lesson02.teach.larger_size:
    title: I need a larger size.
    gloss: 我需要大一号的。
    note: '*larger* 的意思是“更大的”。'
  en.a1.unit65.lesson02.teach.get_refund:
    title: You can get a refund.
    gloss: 你可以拿到退款。
    note: '*get a refund* 的意思是拿回钱。'
  en.a1.unit65.lesson03.teach.dialogue_line1:
    title: Daniel 想退货
    gloss: Daniel 说：你好。我想退掉这件衬衫。
    note: '*return this shirt* 的意思是退掉这件衬衫。'
  en.a1.unit65.lesson03.teach.dialogue_line2:
    title: 店员要小票
    gloss: 店员说：你有小票吗？
    note: '*Do you have...?* 问的是对方有没有带某样东西。'
  en.a1.unit65.lesson03.teach.dialogue_line3:
    title: Daniel 带了小票
    gloss: Daniel 说：有，在这儿。尺码太小了。
    note: '*Here it is* 的意思是“给你”或“在这儿”。'
  en.a1.unit65.lesson03.teach.dialogue_line4:
    title: 店员提出换货
    gloss: 店员说：我们可以给你换成大一号的。
    note: '*for a larger size* 说明商品要换成什么。'
  en.a1.unit65.lesson03.teach.dialogue_line5:
    title: "Daniel 答应了"
    gloss: Daniel 说：好的，麻烦你了。
    note: '*Yes, please* 是礼貌的答应方式。'
  en.a1.unit65.lesson03.teach.dialogue_line6:
    title: 有大一号的
    gloss: 店员说：我们有大一号的蓝色款。
    note: '*We have...* 说明有什么可供选择。'
  en.a1.unit65.lesson03.teach.dialogue_line7:
    title: Daniel 不需要退款
    gloss: Daniel 说：太好了。我不需要退款。
    note: '*I do not need* 的意思是“我不需要”。'
  en.a1.unit65.lesson04.teach.return_note:
    title: 退货单
    gloss: 退货单：蓝色衬衫。尺码：小。换成大一号。必须有小票。
    note: 这张单子写明了商品、尺码、处理方式和小票要求。
  en.a1.unit65.lesson04.teach.reading_passage:
    title: 短文：在商店换货
    gloss: 在商店换货：Daniel 买了一件蓝色衬衫，但是尺码太小了。他带着小票回到了商店。店员要看小票，并提出换一件大一号的。Daniel 换了衬衫。他不需要退款，因为大一号的蓝色衬衫正合适。
    note: '*exchanged* 是 *exchange* 的过去式。'
