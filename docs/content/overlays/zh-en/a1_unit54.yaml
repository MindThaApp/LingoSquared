teaching:
  en.a1.unit54.lesson01.teach.laundromat:
    title: laundromat
    gloss: 自助洗衣店
    note: '*laundromat* 的意思是“自助洗衣店”，是一种有洗衣机、付费后可以自己洗衣服的地方。'
    example_gloss: 我今天要去自助洗衣店。
  en.a1.unit54.lesson01.teach.washing_machine:
    title: washing machine
    gloss: 洗衣机
    note: '*washing machine* 的意思是“洗衣机”。'
    example_gloss: 洗衣机坏了。
  en.a1.unit54.lesson01.teach.dryer:
    title: dryer
    gloss: 烘干机
    note: '*dryer* 的意思是“烘干机”。'
    example_gloss: 把你的衣服放进烘干机里。
  en.a1.unit54.lesson01.teach.quarters:
    title: quarters
    gloss: 25 美分硬币（美国硬币）
    note: '*quarters* 是美国的 25 美分硬币，自助洗衣店的洗衣机常常要用到。中文里没有完全对应的说法，所以通常直接说“25 美分硬币”。'
    example_gloss: 这些机器要投 25 美分硬币。
  en.a1.unit54.lesson01.teach.detergent:
    title: detergent
    gloss: 洗衣液
    note: '*detergent* 的意思是“洗衣液”或“洗涤剂”。'
    example_gloss: 洗干净衣服需要用洗衣液。
  en.a1.unit54.lesson01.teach.load:
    title: load
    gloss: 一批衣物
    note: '*load* 在这里的意思是“一批衣物”，也就是一次洗的衣服量。'
    example_gloss: 我有一大堆衣服要洗。
  en.a1.unit54.lesson02.teach.id_like_to_wash_a_few_things:
    title: I'd like to wash a few things, please.
    gloss: 我想洗几件东西。
    note: '*I''d like to* 是 *I would like to* 的缩写，是礼貌地提出请求的说法。'
  en.a1.unit54.lesson02.teach.do_you_have_change:
    title: Do you have change for the machines?
    gloss: 你们有投洗衣机用的零钱吗？
    note: '*change* 在这里的意思是“零钱”（零散的硬币），不是“变化”。'
  en.a1.unit54.lesson02.teach.how_long_does_the_cycle_take:
    title: How long does the wash cycle take?
    gloss: 洗一个循环要多长时间？
    note: '*take* 在这里的意思是“需要（一段时间）”，和 *the machines take quarters* 里的“接受”是完全不同的用法。'
  en.a1.unit54.lesson02.teach.its_three_dollars_for_one_load:
    title: It's three dollars for one load.
    gloss: 一批衣服三美元。
    note: '*for one load* 的意思是“洗一次”。'
  en.a1.unit54.lesson02.teach.what_time_do_you_close:
    title: What time do you close?
    gloss: 你们几点关门？
    note: '*do you close* 在疑问句里要用助动词 *do*。'
  en.a1.unit54.lesson02.teach.please_pick_up_by_nine:
    title: Please pick up your laundry by nine o'clock.
    gloss: 请在九点之前取走您的衣服。
    note: '*pick up* 的意思是“取走”，*by nine o''clock* 的意思是“最迟九点”。'
  en.a1.unit54.lesson03.teach.dialogue_line1:
    title: 店员打招呼
    gloss: 店员：你好！你们需要洗衣机吗？
    note: '*Do you need...?* 在疑问句里要用助动词 *do*。'
  en.a1.unit54.lesson03.teach.dialogue_line2:
    title: Leila 的原因
    gloss: Leila：是的，需要。我家里的洗衣机坏了。
    note: '*at home* 的意思是“在家里”。'
  en.a1.unit54.lesson03.teach.dialogue_line3:
    title: Daniel 的请求
    gloss: Daniel：我也有一小批衣服。我也可以用一台机器吗？
    note: 这里的 *too* 的意思是“也”，放在句末；*as well* 意思相同，出现在第二句里。
  en.a1.unit54.lesson03.teach.dialogue_line4:
    title: 店员讲硬币
    gloss: 店员：当然可以！这些机器要投 25 美分硬币。
    note: 这里的 *take* 的意思是“接受”（作为付款），注意它和后面 *The wash cycle takes thirty minutes* 里表示“需要（时间）”的 *take* 不一样。
  en.a1.unit54.lesson03.teach.dialogue_line5:
    title: Leila 有硬币
    gloss: Leila：有，我有 25 美分硬币。
    note: 这只是一个简短的确认，没有新的信息。
  en.a1.unit54.lesson03.teach.dialogue_line6:
    title: 洗涤时间
    gloss: 店员：洗一个循环要三十分钟。
    note: 这里的 *take* 的意思是“需要（时间）”，和上面 *take quarters* 里的“接受”不同。
  en.a1.unit54.lesson03.teach.dialogue_line7:
    title: Daniel 问价钱
    gloss: Daniel：那要多少钱？
    note: '*How much does it cost?* 同样在疑问句里使用了助动词 *does*。'
  en.a1.unit54.lesson03.teach.dialogue_line8:
    title: 价格
    gloss: 店员：洗一批衣服三美元。
    note: 这是一条单独的信息，和硬币的数量、洗涤时间无关。
  en.a1.unit54.lesson03.teach.dialogue_line9:
    title: 关门时间
    gloss: 店员：自助洗衣店九点关门，所以请在这之前取走您的衣服。
    note: '*so* 在这里的意思是“所以”，它把关门时间和“要提前来取衣服”这条提醒连在一起。'
  en.a1.unit54.lesson04.teach.reading_passage:
    title: 阅读：去自助洗衣店
    gloss: 去自助洗衣店：一天下午，Leila 家里的洗衣机坏了。她决定去街上的自助洗衣店。Daniel 也一起去了，因为他也有一小批衣服要洗。在自助洗衣店里，店员说明机器要投 25 美分硬币，洗一个循环需要三十分钟。洗一批衣服要三美元。衣服在洗的时候，Daniel 和 Leila 一边聊天，一边在隔壁的咖啡馆喝咖啡。自助洗衣店九点关门，所以他们特意在这之前取走了衣服。Leila 很感谢 Daniel 陪她，她说家里的洗衣机可能到周末就修好了。
    note: '*would be fixed* 的意思是“可能会被修好”，Leila 预计机器会修好，但还不能确定。'
