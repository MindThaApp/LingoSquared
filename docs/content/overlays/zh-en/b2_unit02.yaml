teaching:
  en.b2.unit02.lesson01.teach.may:
    title: may
    gloss: 可能，也许会
    note: '*may* 表示可能性。这里不是像 *May I...?* 那样表示许可。'
    example_gloss: 这可能是真的。
  en.b2.unit02.lesson01.teach.might:
    title: might
    gloss: 或许，说不定
    note: '*might* 表示谨慎的可能性，通常比 *may* 的把握略小一些。'
    example_gloss: 这说不定是真的。
  en.b2.unit02.lesson01.teach.must:
    title: must
    gloss: 一定，肯定
    note: '*must* 在这里表示根据证据得出的强烈推断，而不是义务。'
    example_gloss: 这一定是真的。
  en.b2.unit02.lesson01.teach.cannot:
    title: cannot
    gloss: 不可能
    note: 当证据排除了某种可能时，就用 *cannot*。指过去时，要用 *cannot have been*。
    example_gloss: 这不可能是真的。
  en.b2.unit02.lesson01.teach.deduction:
    title: deduction
    gloss: 依据证据的推断
    note: '*deduction* 是根据线索进行推理，而不是随便乱猜。'
    example_gloss: 米娅的推断是以证据为基础的。
  en.b2.unit02.lesson01.teach.guesswork:
    title: guesswork
    gloss: 瞎猜，臆测
    note: '*guesswork* 指缺少证据或几乎没有证据的猜测。'
    example_gloss: 没有证据，这种解释就只是瞎猜。
  en.b2.unit02.lesson01.teach.may_might_contrast:
    title: may en might
    gloss: May 和 might 常常有重叠。两者都表示一种可能的解释；might 往往听起来更加谨慎一些。
    note: 在措辞严谨的句子中，*may* 和 *might* 往往比 *maybe* 更得体。表示“也许”时，不必每次都用 *maybe* 来套。
  en.b2.unit02.lesson02.teach.must_have_gone_down:
    title: 对过去的强烈推断
    gloss: 服务器一定是在夜里宕机了，因为没有生成任何报告。
    note: 表示对过去的肯定推断，英语用 *must have* 加过去分词：*must have gone down*。注意 *must* 后面要用 *have*，而不是直接用动词的过去式。
  en.b2.unit02.lesson02.teach.may_have_failed:
    title: 过去可能的原因
    gloss: 这些报告可能在夜里运行失败了。
    note: '*may have failed* 表示一种可能的原因，而不是确定的结论。'
  en.b2.unit02.lesson02.teach.might_have_permission:
    title: 谨慎的可能性
    gloss: 也有可能是权限问题。
    note: '*might have been* 使原因保持开放，听起来比 *must have been* 更谨慎。'
  en.b2.unit02.lesson02.teach.cannot_have_only_report:
    title: 排除某种可能
    gloss: 这不可能只是报告方面的问题。
    note: 表示“过去不可能是……”，英语用 *cannot have been*，口语中用 *can't have been*。
  en.b2.unit02.lesson02.teach.grammar_modal_deduction:
    title: 用于推测的情态动词
    gloss: 对现在的强烈推断用 must be，对过去的强烈推断用 must have been。对现在的可能性用 may 或 might，对过去的可能性用 may have 或 might have。当证据排除某种解释时，用 cannot 或 cannot have been。
    note: 注意：这里的 *must* 不是“必须”的义务，而是“一定是这样”的推断。
  en.b2.unit02.lesson03.teach.outage:
    title: outage
    gloss: 故障，停机
    note: '*outage* 指系统或服务无法运行的故障。'
    example_gloss: 一次系统故障导致报告无法运行。
  en.b2.unit02.lesson03.teach.consequence:
    title: consequence
    gloss: 后果，结果
    note: '*consequence* 是某个原因或问题所带来的后果。'
    example_gloss: 一个后果是，仪表盘可能显示旧数据。
  en.b2.unit02.lesson03.teach.reading_passage:
    title: 阅读材料：可能发生了什么？
    gloss: 夜间报告没有运行，监控页面也是空白的。米娅说，服务器一定是在夜里宕机了。丹尼尔认为也可能是权限问题，但这无法解释监控页面为何空白。财务部门可能拿不到早晨的数据，在报告重新生成之前，客户仪表盘也许会显示旧数据。米娅并不完全确定，但她的解释是根据现有证据做出的推断，而不是纯粹的瞎猜。
    note: 这篇文章区分了事实、可能的原因、强烈的推断、被排除的解释和可能的后果。
  en.b2.unit02.lesson04.teach.q_no_reports:
    title: 丹尼尔说出事实
    gloss: 丹尼尔说：夜间的报告一份都没有生成。
    note: 这是已知的事实，还不是推测。
  en.b2.unit02.lesson04.teach.a_server_down:
    title: 米娅做出强烈推断
    gloss: 米娅说：服务器一定是在夜里宕机了。
    note: '*must have gone down* 是对过去的强烈推断。'
  en.b2.unit02.lesson04.teach.q_permission_issue:
    title: 丹尼尔提出一种可能的原因
    gloss: 丹尼尔说：也有可能是权限问题。
    note: '*might have been* 让这种可能保持开放，但并不表示确定。'
  en.b2.unit02.lesson04.teach.a_cannot_only_report:
    title: 米娅排除了范围过窄的解释
    gloss: 米娅说：也许吧，但监控页面也是空白的，所以这不可能只是报告方面的问题。
    note: '*cannot have been only...* 排除了这种解释，因为证据的范围更广。'
  en.b2.unit02.lesson04.teach.q_consequences:
    title: 丹尼尔询问后果
    gloss: 丹尼尔问：我们应该预料到哪些后果？
    note: 找出原因之后，接下来就要问可能产生的后果。
  en.b2.unit02.lesson04.teach.a_possible_consequences:
    title: 米娅说出可能的后果
    gloss: 米娅说：财务部门可能拿不到早晨的数据，客户仪表盘也许会显示旧数据。
    note: '*may be missing* 和 *might show* 表示可能的后果，而不是确定的事实。'
  en.b2.unit02.lesson04.teach.q_deduction_guess:
    title: 丹尼尔确认把握程度
    gloss: 丹尼尔说：所以这是一个推断，而不是随便猜的？
    note: 丹尼尔在问米娅的推理是否有证据作为依据。
  en.b2.unit02.lesson04.teach.a_evidence_limited:
    title: 米娅补充说明她的结论
    gloss: 米娅说：是的。证据有限，但它指向一次系统故障。
    note: 一个强烈的推断，也可以承认证据有限。
