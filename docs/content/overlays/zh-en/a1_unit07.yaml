  en.a1.unit07.lesson03.teach.menu_text:
    title: Cafe Menu
    gloss: 咖啡馆菜单：咖啡 - 3 美元。茶 - 2 美元。汤 - 5 美元。三明治 - 6 美元。
    note: 美元符号写在数字前面（*$3*）。
  en.a1.unit07.lesson04.teach.thats_x_dollars:
    title: That's nine dollars.
    gloss: 一共九美元。
    note: 在美国用的是 *dollars*（美元）；*That's X dollars* 的结构相当于中文的“一共 X 美元”。
  en.a1.unit07.lesson04.teach.q_order:
    title: Leila 点单
    gloss: Leila：你好，我想要一杯咖啡和一个三明治。
    note: '*Hi* 是一种随意的问候，适合在咖啡馆里使用。'
  en.a1.unit07.lesson04.teach.a_anything_else:
    title: 服务员的追问
    gloss: 服务员：好的。还要点别的吗？
    note: '*Sure* 在这里的意思是“好的”或“没问题”。'
  en.a1.unit07.lesson04.teach.reply_thats_all:
    title: Leila 的回答
    gloss: Leila：不用了，就这些，谢谢。
    note: 完整的回答要确认点餐已经完成。
  en.a1.unit07.lesson04.teach.q_for_here:
    title: 服务员的提问
    gloss: 服务员：在这里吃还是带走？
    note: 在美国的咖啡馆里，点完餐后常会听到这个问题。
  en.a1.unit07.lesson04.teach.reply_for_here:
    title: Leila 的回答
    gloss: Leila：在这里吃。
    note: '*For here* 表示 Leila 想留在咖啡馆里。'
  en.a1.unit07.lesson04.teach.closing_price:
    title: 服务员的结束语
    gloss: 服务员：好的，一共九美元。
    note: '*OK* 引出最后的价格。'
