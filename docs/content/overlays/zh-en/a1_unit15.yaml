teaching:
  en.a1.unit15.lesson01.teach.cash:
    title: Cash
    gloss: 现金
    note: '*cash* 指现金（纸币和硬币）。在英语中它是不可数名词：说 *some cash*，不能说 *a cash*。'
    example_gloss: 我有一些现金。
  en.a1.unit15.lesson01.teach.card:
    title: Card
    gloss: 卡
    note: '*card* 是各种塑料支付卡的通用说法。'
    example_gloss: 我的卡是蓝色的。
  en.a1.unit15.lesson01.teach.credit_card:
    title: Credit card
    gloss: 信用卡
    note: '*credit card* 是先借钱消费、之后再还款的卡，也就是我们常说的“信用卡”。'
  en.a1.unit15.lesson01.teach.debit_card:
    title: Debit card
    gloss: 借记卡/储蓄卡
    note: '*debit card* 是消费时直接从账户扣款的卡。中国银行发的储蓄卡就属于 *debit card*。'
  en.a1.unit15.lesson01.teach.total:
    title: Total
    gloss: 总额
    note: '*total* 是你需要支付的全部金额。'
    example_gloss: 总共多少钱？
  en.a1.unit15.lesson02.teach.do_you_take_cards:
    title: Do you take credit cards?
    gloss: 你们收信用卡吗？
    note: '*Do you take credit cards?* 是付款前的常用问句。这里的 *take* 是“接受”的意思。'
  en.a1.unit15.lesson02.teach.cash_only:
    title: Sorry, cash only.
    gloss: 抱歉，只收现金。
    note: '*Sorry, cash only.* 是不收银行卡的商店常说的回答。'
  en.a1.unit15.lesson02.teach.ill_pay_by_card:
    title: Yes, I'll pay by card.
    gloss: 好的，我刷卡。
    note: '*Yes, I''ll pay by card.* 表示最终选定了付款方式。*by* 后面的 *card* 前面不加冠词。'
  en.a1.unit15.lesson03.teach.tax:
    title: Tax
    gloss: 税
    note: '*tax* 就是税。在美国大多数商店，标价不含税，税是在收银台才加到价格上的（和中国标价即最终价不同）。'
    example_gloss: 税是一美元。
  en.a1.unit15.lesson03.teach.receipt_text:
    title: 小票内容
    gloss: 咖啡：3美元。三明治：6美元。税：1美元。总计：10美元。
    note: 这是一张真实的购物小票。
  en.a1.unit15.lesson03.teach.total_summary_sentence:
    title: The total is $10.
    gloss: 总额是10美元。
    note: 这个句子用完整的一句话概括了小票上的总额。
  en.a1.unit15.lesson04.teach.q_total:
    title: 询问总额
    gloss: Leila问总共多少钱
    note: '*How much is the total?* 是询问最终金额的常用问句。*is* 用单数，因为 *the total* 是一个总数。'
  en.a1.unit15.lesson04.teach.a_fifteen:
    title: 回答总额
    gloss: 收银员说：一共十五美元。
    note: '*It''s fifteen dollars.* 是对询问总额的完整回答。'
  en.a1.unit15.lesson04.teach.q_cards:
    title: 询问能否刷卡
    gloss: Leila问是否收信用卡
    note: 和前面是同一个问句。
  en.a1.unit15.lesson04.teach.a_yes_we_do:
    title: 回答能否刷卡
    gloss: 收银员说：收，可以。
    note: '*Yes, we do.* 是完整的简短回答。英语里要重复助动词 *do*，而不是只说“是”。'
  en.a1.unit15.lesson04.teach.closing_pay_by_card:
    title: 最终的付款选择
    gloss: Leila说：太好了，我刷卡。
    note: 这句话以最终选定的付款方式结束了对话。
