teaching:
  en.a2.unit38.lesson01.teach.reschedule:
    title: reschedule
    gloss: 改期
    note: '*reschedule* 的意思是把预约改到另一个时间。'
    example_gloss: 我得把维修改期，因为到时候我在上班。
  en.a2.unit38.lesson01.teach.neighbor:
    title: neighbor
    gloss: 邻居
    note: '*neighbor* 指住在你隔壁的人。这个英语词本身不区分男女。'
    example_gloss: 我的邻居可以为水管工开门。
  en.a2.unit38.lesson01.teach.key:
    title: key
    gloss: 钥匙
    note: '*key* 是用来开门的小金属物件。'
    example_gloss: 我会把钥匙留给我的邻居。
  en.a2.unit38.lesson01.teach.leak:
    title: leak
    gloss: 漏水处
    note: '*leak* 在这里是名词：指水漏出来的那个地方。动词 *to leak* 的意思是漏、渗。'
    example_gloss: 我厨房水槽下面的漏水处越来越严重了。
  en.a2.unit38.lesson01.teach.fixed:
    title: fixed
    gloss: 已修好的
    note: '*fixed* 是 *to fix*（修理）的过去分词，意思是东西不再坏了。'
    example_gloss: 水槽现在修好了，水也不漏了。
  en.a2.unit38.lesson01.teach.afternoon:
    title: afternoon
    gloss: 下午
    note: '*afternoon* 是中午之后的那段时间；上午叫 *morning*。'
    example_gloss: 水管工是下午来的，不是上午。
  en.a2.unit38.lesson01.teach.grammar_cant_wont:
    title: 事情行不通时的 can't 和 won't
    gloss: 我下午两点到四点之间不能在家。下午我不在家。
    note: '*can''t* 说明某事不可能。*won''t* 说明将来就是不会这样。'
  en.a2.unit38.lesson02.teach.need_to_reschedule:
    title: 说明您想改期
    gloss: 我需要把维修改期。
    note: '*I need to ...* 客观、中性：表示有必要，但听起来并不失礼。'
  en.a2.unit38.lesson02.teach.possible_in_the_morning:
    title: 请求换一个时间
    gloss: 能不能改成上午来呢？
    note: '*Would it be possible to ...?* 是提出请求时最委婉的说法。*instead* 的意思是“改为、代替”。'
  en.a2.unit38.lesson02.teach.leave_key_with_neighbor:
    title: 说明钥匙在哪里
    gloss: 我会把钥匙留给我的邻居。
    note: '*leave something with someone* 的意思是把东西留给或交给某人。'
  en.a2.unit38.lesson02.teach.is_the_leak_fixed:
    title: 询问问题是否已解决
    gloss: 漏水现在修好了吗？
    note: '*Is ... fixed?* 询问的是结果，而不是修理工作本身。'
  en.a2.unit38.lesson02.teach.grammar_because_reason:
    title: 用 because 说明原因
    gloss: 我下午两点到四点之间不能在家，因为我在上班。
    note: '*because* 把问题和原因连在一起。它后面的词序保持不变：动词仍在正常的位置上。'
  en.a2.unit38.lesson03.teach.message:
    title: message
    gloss: 消息
    note: '*message* 指任何简短的书面消息：短信、聊天消息或简短的电子邮件。'
    example_gloss: 我收到了一条关于新维修时间的消息。
  en.a2.unit38.lesson03.teach.rescheduling_text:
    title: 关于新时间的消息
    gloss: 维修单 6180 已改期。水管工将于明天上午 9 点到 11 点之间上门。您的邻居会为他开门。请今天通过消息确认这个新时间。
    note: 物业发来的消息简短而客观：有什么变化、什么时候，以及您还需要做什么。
  en.a2.unit38.lesson03.teach.confirm_by_message:
    title: 被要求确认
    gloss: 请今天通过消息确认这个新时间。
    note: '*confirm* 的意思是确认；*by message* 的意思是通过消息。'
  en.a2.unit38.lesson04.teach.q_need_to_reschedule:
    title: Daniel 打电话给物业管理处
    gloss: Daniel 说：您好，我需要把维修改期。
    note: 打电话时先说 *Hello*，然后马上说明来电的原因。
  en.a2.unit38.lesson04.teach.a_which_repair:
    title: 物业管理处询问要修什么
    gloss: 物业说：没问题。是哪一项维修？
    note: '*Which repair is it?* 询问的是已知范围中的某一项。'
  en.a2.unit38.lesson04.teach.q_repair_6180:
    title: Daniel 报出报修编号
    gloss: Daniel 说：维修单 6180，我厨房水槽下面的漏水处。
    note: 和第 29 单元的维修单编号相同：还是同一个漏水的水槽。
  en.a2.unit38.lesson04.teach.a_why_cant_you_be_home:
    title: 物业管理处询问原因
    gloss: 物业说：明白了。您为什么不能在家？
    note: '*Why can''t you ...?* 询问某事行不通的原因。'
  en.a2.unit38.lesson04.teach.q_at_work_ask_morning:
    title: Daniel 说明原因并请求安排在上午
    gloss: Daniel 说：我下午两点到四点之间不能在家，因为我在上班。能不能改成上午来呢？
    note: 先说原因，再提请求：这样比直接提要求听起来更礼貌。
  en.a2.unit38.lesson04.teach.a_plumber_can_come_morning:
    title: 物业管理处提供新的时间段
    gloss: 物业说：可以，水管工可以在上午 9 点到 11 点之间上门。
    note: '*between 9am and 11am* 是新的时间段。'
  en.a2.unit38.lesson04.teach.q_leave_key:
    title: Daniel 安排钥匙的事
    gloss: Daniel 说：非常感谢。我会把钥匙留给我的邻居。
    note: 和第 2 课中的句子相同。
  en.a2.unit38.lesson04.teach.a_please_confirm:
    title: 物业管理处请求确认
    gloss: 物业说：好的。请今天通过消息确认这个新时间。
    note: 和第 3 课消息中的要求相同。
  en.a2.unit38.lesson04.teach.q_will_confirm_this_afternoon:
    title: Daniel 说明何时确认
    gloss: Daniel 说：我今天下午确认。
    note: '*this afternoon* 的意思是今天下午，也就是今天中午十二点之后。'
