  en.a1.unit30.lesson03.teach.i_like_pattern:
    title: I like reading.
    gloss: 我喜欢阅读。
    note: '*I like* 加动词的 *-ing* 形式，表示你喜欢做某件事。'
  en.a1.unit30.lesson03.teach.dialogue_line1:
    title: Leila 的问题
    gloss: Leila 问：Daniel，你空闲时间做什么？
    note: Leila 用一个直接的问题向 Daniel 开启了对话。
  en.a1.unit30.lesson03.teach.dialogue_line2:
    title: "Daniel的回答"
    gloss: Daniel 说：我经常去跑步。我有时做饭。你呢？
    note: Daniel 说了两个爱好和做的频率，并用 *What about you?* 把问题抛回去。
  en.a1.unit30.lesson03.teach.dialogue_line3:
    title: Leila 谈绘画
    gloss: Leila 说：我喜欢画画。我几乎每个周末都画。
    note: '*almost every weekend* 的意思是“几乎每个周末”。'
  en.a1.unit30.lesson03.teach.dialogue_line4:
    title: Daniel 的追问
    gloss: Daniel 说：太棒了！你玩电子游戏吗？
    note: 用 *Do you ever...?* 询问某人是否会做某件事。
  en.a1.unit30.lesson03.teach.dialogue_line5:
    title: Leila 的最后回答
    gloss: Leila 说：很少。我更喜欢看书。
    note: '*I prefer...* 的意思是“我更喜欢……”，“我更愿意做……”。'
  en.a1.unit30.lesson04.teach.reading_passage:
    title: 关于爱好的短文
    gloss: Daniel 和 Leila 的爱好不同。Daniel 总是在周六早上去跑步，有时给朋友们做晚饭。Leila 从不跑步，但她周末经常画画。他们俩都喜欢电子游戏，但很少一起玩。
    note: 这段短文直接比较了 Daniel 和 Leila 的爱好以及做这些事的频率。
