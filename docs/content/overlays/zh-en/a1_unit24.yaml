teaching:
  en.a1.unit24.lesson01.teach.bedroom:
    title: bedroom
    gloss: 卧室
    note: '*bedroom* 的意思是卧室。它由 *bed*（床）和 *room*（房间）组成，英语里连读，重音在前一个音节。'
    example_gloss: 我的卧室在浴室旁边。
  en.a1.unit24.lesson01.teach.kitchen:
    title: kitchen
    gloss: 厨房
    note: '*kitchen* 的意思是厨房。发音是 *KITCH-en*；其中的 *t* 不单独发音。'
    example_gloss: 厨房在客厅旁边。
  en.a1.unit24.lesson01.teach.bathroom:
    title: bathroom
    gloss: 浴室
    note: '*bathroom* 的意思是浴室。在美国，这个词也常用来指洗手间。'
    example_gloss: 浴室里有淋浴。
  en.a1.unit24.lesson01.teach.living_room:
    title: living room
    gloss: 客厅
    note: '*living room* 的意思是客厅。它是两个单词，要分开写。'
    example_gloss: 我们在客厅看电视。
  en.a1.unit24.lesson01.teach.garden:
    title: garden
    gloss: 花园
    note: '*garden* 的意思是花园。在美国，房子后面的院子常说 *yard*。'
    example_gloss: 没有花园，但是有一个阳台。
  en.a1.unit24.lesson01.teach.the_kitchen_is_a_room:
    title: This is the kitchen.
    gloss: 这是厨房。
    note: 用 *This is ...* 指着某样东西介绍。*the* 表示特指：这套房子的厨房。
  en.a1.unit24.lesson02.teach.how_many_rooms:
    title: How many rooms are there?
    gloss: 一共有几个房间？
    note: 用 *How many...are there?* 询问数量。*many* 用于可数名词的复数；*are* 是因为 *rooms* 是复数。
  en.a1.unit24.lesson02.teach.there_is_a_kitchen:
    title: There's a small kitchen.
    gloss: 有一个小厨房。
    note: 用 *There's...*（*there is*）表示某处有某物，相当于汉语的“有”。如果东西不止一个，就要说 *there are*。
  en.a1.unit24.lesson02.teach.next_to:
    title: next to
    gloss: 在……旁边
    note: '*next to* 的意思是在……旁边。它是两个单词，总是连在一起使用。'
    example_gloss: 椅子在桌子旁边。
  en.a1.unit24.lesson03.teach.apartment:
    title: apartment
    gloss: 公寓
    note: '*apartment* 的意思是公寓（美式英语；英式英语说 *flat*）。'
    example_gloss: Daniel的公寓有两间卧室。
  en.a1.unit24.lesson03.teach.home_text:
    title: 一套公寓的介绍
    gloss: 我的公寓有两间卧室和一间浴室。客厅旁边有一个小厨房。
    note: 在这段简短的文字里，有人描述了自己的公寓，并说出了房间的数量。
  en.a1.unit24.lesson04.teach.favorite_room:
    title: What's your favorite room?
    gloss: 你最喜欢哪个房间？
    note: '*favorite* 的意思是最喜欢的。'
  en.a1.unit24.lesson04.teach.q_tell_me_about:
    title: 询问公寓的情况
    gloss: Leila说：跟我说说你的公寓吧。
    note: 用 *Tell me about...* 请对方描述某件事。
  en.a1.unit24.lesson04.teach.a_two_bed_one_bath:
    title: Daniel的回答
    gloss: Daniel说：它有两间卧室和一间浴室。客厅旁边有一个小厨房。
    note: Daniel说了房间的数量，并说了厨房的位置。
  en.a1.unit24.lesson04.teach.q_is_there_garden:
    title: 询问有没有花园
    gloss: Leila问：有花园吗？
    note: 用 *Is there...?* 询问某处有没有某样东西。
  en.a1.unit24.lesson04.teach.a_no_but_balcony:
    title: Daniel的回答
    gloss: Daniel说：没有，但是有一个小阳台。
    note: Daniel先说没有，然后说了替代的东西。
  en.a1.unit24.lesson04.teach.a_living_room_near_kitchen:
    title: Daniel最后的回答
    gloss: Daniel说：我最喜欢的房间是客厅。它离厨房很近，所以在那里吃晚饭很方便。
    note: Daniel说出了自己最喜欢的房间，并给出了理由。
