course:
  title: 英语 B1
  description: 学习 B1 水平的英语，用于表达义务、可能性、假设情况和讲述日常经历，附有详细的中文讲解。
units:
  en.b1.unit11.unreal_hypotheticals:
    title: 如果更便宜，我就报名了
lessons:
  en.b1.unit11.lesson01.unreal_hypothetical_vocabulary:
    title: 非现实情景：would、if I were、regret
  en.b1.unit11.lesson02.unreal_present:
    title: 如果我有更多时间，我就会……
  en.b1.unit11.lesson03.reading_a_missed_opportunity:
    title: 阅读：错过的机会
  en.b1.unit11.lesson04.the_design_course_dialogue:
    title: 你会去上这门课吗？
teaching:
  en.b1.unit11.lesson01.teach.would:
    title: would
    gloss: 会（would）
    note: '*would* + 动词原形，表示设想中的结果或礼貌地表达意愿。'
    example_gloss: 如果我有更多时间，我就会参加。
  en.b1.unit11.lesson01.teach.would_rather:
    title: would rather
    gloss: 宁愿，更愿意
    note: '*would rather* 表示相比另一件事，更愿意做某件事。'
    example_gloss: 我更愿意上周末班。
  en.b1.unit11.lesson01.teach.if_i_were:
    title: if I were
    gloss: 如果我是／如果我在……
    note: '*if I were* 用来引出一个关于自己的非现实情景。'
    example_gloss: 如果我今晚有空，我就会去。
  en.b1.unit11.lesson01.teach.opportunity:
    title: opportunity
    gloss: 机会，良机
    note: '*opportunity* 指做某事的好机会。'
    example_gloss: 这门课对Leila来说是个好机会。
  en.b1.unit11.lesson01.teach.regret:
    title: regret
    gloss: 遗憾，后悔
    note: '*regret* 指对过去的决定感到遗憾或后悔。'
    example_gloss: 她只有一件事感到遗憾：没有早点开始存钱。
  en.b1.unit11.lesson01.teach.take_a_chance:
    title: take a chance
    gloss: 冒险一试，试一试
    note: '*take a chance* 指即使不一定成功，也去尝试。'
    example_gloss: 如果这门课更便宜，她就愿意试一试。
  en.b1.unit11.lesson02.teach.more_time_course:
    title: 与现在事实相反的假设情境
    gloss: 如果我有更多时间，我就会去上设计课。
    note: 表示与现在事实相反的情景时，*if* 后面用过去式：*If I had more time*。汉语没有这种动词变化，通常靠“如果……就……”和语境来表达假设。
  en.b1.unit11.lesson02.teach.cheaper_sign_up:
    title: if it were cheaper
    gloss: 如果它更便宜，我今天就报名。
    note: 在非现实条件句中，即使主语是 *it*，用 *were* 听起来也很自然。
  en.b1.unit11.lesson02.teach.grammar_unreal_present:
    title: 与现在事实相反的条件
    gloss: 如果它更便宜，我就报名。
    note: 结构：*if* + 过去式，主句用 *would* + 动词原形。
  en.b1.unit11.lesson03.teach.sooner:
    title: sooner
    gloss: 更早
    note: '*sooner* 指比实际发生的时间更早。'
    example_gloss: 如果她早点知道，就会存下更多的钱。
  en.b1.unit11.lesson03.teach.confident:
    title: confident
    gloss: 有自信的，有信心的
    note: '*confident* 指觉得自己能把某件事做好。'
    example_gloss: 如果Daniel也参加，Leila会更有信心。
  en.b1.unit11.lesson03.teach.reading_passage:
    title: 阅读：错失的机会
    gloss: Leila找到了一门她特别想上的设计课。这门课很有用，但很贵。如果更便宜，她今天就报名了。如果Daniel也上这门课，她会更有信心。她唯一的遗憾是时机：如果她早点知道这门课，就会存下更多的钱。
    note: 一篇简短的阅读短文，包含与现在和过去事实相反的假设。
  en.b1.unit11.lesson04.teach.q_take_if_cheaper:
    title: Mia 提出一个假设性问题
    gloss: Mia说：Leila，如果设计课更便宜，你会去上吗？
    note: 用 *would* 提出的礼貌的假设性问题。
  en.b1.unit11.lesson04.teach.a_sign_up_today:
    title: Leila 说出设想的结果
    gloss: Leila说：当然。如果更便宜，我今天就报名。
    note: '*If it were cheaper, I would...* 描述她在另一种情况下会做什么。'
  en.b1.unit11.lesson04.teach.q_daniel_joined:
    title: Mia 提出另一种情景
    gloss: Mia说：那如果Daniel也参加呢？
    note: '*What if...* 用来引出一种设想的可能性。'
  en.b1.unit11.lesson04.teach.a_more_confident:
    title: Leila 描述她的感受
    gloss: Leila说：如果Daniel参加，我会更有信心。
    note: '*joined* 用过去式，是因为这个情景只是设想。'
  en.b1.unit11.lesson04.teach.q_would_rather_weekend:
    title: Mia 说出她的偏好
    gloss: Mia说：比起晚班，我更愿意上周末班。
    note: '*would rather ... than ...* 用来比较两种偏好。'
  en.b1.unit11.lesson04.teach.a_known_sooner:
    title: Leila 谈起过去的遗憾
    gloss: Leila说：我也是。如果我早点知道，就会存下更多的钱。
    note: '*if + 过去完成时，would have + 过去分词* 表示与过去事实相反的假设。'
