teaching:
  en.b1.unit09.lesson01.teach.said_that:
    title: said that
    gloss: 说……
    note: '*said that* 用来转述别人说过的话。'
    example_gloss: 她说她很忙。
  en.b1.unit09.lesson01.teach.told_me_that:
    title: told me that
    gloss: 告诉我……
    note: '*told me that* 用于别人把某个信息告诉了你自己的情况。'
    example_gloss: 他告诉我会议取消了。
  en.b1.unit09.lesson01.teach.asked_whether:
    title: asked whether
    gloss: 问是否（较正式）
    note: '*asked whether* 用来转述一个是非问句，比 *asked if* 稍正式一些。'
    example_gloss: 米娅问我们是否需要帮助。
  en.b1.unit09.lesson01.teach.asked_if:
    title: asked if
    gloss: 问是否（口语）
    note: '*asked if* 用来在日常口语中转述一个是非问句。'
    example_gloss: 米娅问我们是否需要帮助。
  en.b1.unit09.lesson01.teach.message:
    title: message
    gloss: 消息，留言
    note: '*message* 指一条简短的书面或口头信息。'
    example_gloss: 蕾拉午饭后发了一条消息。
  en.b1.unit09.lesson01.teach.confirm:
    title: confirm
    gloss: 确认
    note: '*confirm* 表示说明某事是确定的或正确的。'
    example_gloss: 出发前请确认时间。
  en.b1.unit09.lesson01.teach.available:
    title: available
    gloss: 有空，可用
    note: '*available* 表示有空或能够见面。'
    example_gloss: 米娅午饭后有空。
  en.b1.unit09.lesson02.teach.mia_available:
    title: 转述一句话
    gloss: 米娅说她午饭后有空。
    note: 转述时，*is* 常常变成 *was*：*Mia said that she was available*。汉语的动词没有时态变化，转述时原话的动词形式不变；英语则通常把动词往前推一个时态，用过去式。
  en.b1.unit09.lesson02.teach.leila_told_me:
    title: 向您转述信息
    gloss: 蕾拉告诉我办公室很忙。
    note: 别人把信息直接告诉了你时，用 *told me that*。
  en.b1.unit09.lesson02.teach.grammar_backshift:
    title: 直接引语和间接引语
    gloss: 米娅说：“我有空。”米娅说她有空。
    note: 直接引语：*I am available*。间接引语：*Mia said that she was available*。转述时，原话的动词常常往前推一个时态。
  en.b1.unit09.lesson03.teach.short_summary:
    title: short summary
    gloss: 简短总结
    note: '*short summary* 指只包含最重要几点的简短版本。'
    example_gloss: 今天的会议有一份简短的总结就够了。
  en.b1.unit09.lesson03.teach.full_report:
    title: full report
    gloss: 完整报告
    note: '*full report* 指整份报告，而不只是简短版本。'
    example_gloss: 米娅问我们是否需要完整的报告。
  en.b1.unit09.lesson03.teach.reading_passage:
    title: 阅读：消息记录
    gloss: 蕾拉读了米娅的消息，然后给丹尼尔打了电话。她说米娅午饭后有空。她还说米娅已经把数字做完了。米娅问团队今天是否需要完整的报告。丹尼尔告诉蕾拉，一份简短的总结就够了，因为会议只有十五分钟。
    note: 一篇短文，讲述如何转述别人的话和问题。
  en.b1.unit09.lesson04.teach.q_mia_reply:
    title: Daniel 询问 Mia 的回答
    gloss: 丹尼尔说：米娅回复评审的事了吗？
    note: 一个关于之前那条消息的是非问句。
  en.b1.unit09.lesson04.teach.a_she_said_available:
    title: Leila 转述 Mia 的话
    gloss: 蕾拉说：回复了，她说她午饭后有空。
    note: '*she said that she was available* 转述了米娅的话。'
  en.b1.unit09.lesson04.teach.q_anything_else:
    title: Daniel 继续提问
    gloss: 丹尼尔说：好。她还问别的了吗？
    note: 一个追问，想知道消息里是否还有别的问题。
  en.b1.unit09.lesson04.teach.a_asked_if_report:
    title: Leila 转述 Mia 的问题
    gloss: 蕾拉说：她问我们今天是否需要完整的报告。
    note: '*asked if* 把直接的是非问句变成间接引语。'
  en.b1.unit09.lesson04.teach.q_what_tell_her:
    title: Daniel 询问 Leila 的回答
    gloss: 丹尼尔说：你怎么跟她说的？
    note: 一个询问蕾拉转达了什么信息的问题。
  en.b1.unit09.lesson04.teach.a_short_summary_enough:
    title: Leila 转述她的回答
    gloss: 蕾拉说：我告诉她一份简短的总结就够了。
    note: '*I told her that...* 转述的是你告诉别人的信息。'
  en.b1.unit09.lesson04.teach.q_tell_team:
    title: Daniel 结束这段消息往来
    gloss: 丹尼尔说：太好了。我会告诉团队我们可以两点见面。
    note: 丹尼尔再次用 *tell ... that* 来转达信息。
