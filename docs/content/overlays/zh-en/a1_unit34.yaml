teaching:
  en.a1.unit34.lesson01.teach.soccer:
    title: soccer
    gloss: 足球
    note: '*soccer* 的意思是“足球”。和它搭配的动词是 *play*：*play soccer*。汉语说“踢足球”“打篮球”“游泳”“做瑜伽”，动词各不相同；英语也一样，运动名称前要记住不同的动词：*play*、*go* 或 *do*。'
    example_gloss: 我们周六踢足球。
  en.a1.unit34.lesson01.teach.tennis:
    title: tennis
    gloss: 网球
    note: '*tennis* 的意思是“网球”。和 *soccer* 一样，这里用 *play*：*play tennis*。汉语里是“打网球”，英语里固定说 *play tennis*。'
    example_gloss: 她每个周末打网球。
  en.a1.unit34.lesson01.teach.basketball:
    title: basketball
    gloss: 篮球
    note: '*basketball* 的意思是“篮球”。这里也用 *play*：*play basketball*，和 *soccer*、*tennis* 一样。英语里球类运动一般都用 *play* + 运动名称。'
    example_gloss: 他们在公园打篮球。
  en.a1.unit34.lesson01.teach.swimming:
    title: swimming
    gloss: 游泳
    note: '*swimming* 的意思是“游泳”。这里动词变了：*go swimming*（不是 *play swimming*）。英语里像游泳、跑步这类活动，常用 *go* + *-ing* 形式。汉语里直接说“游泳”就行，不需要这样一个单独的动词。'
    example_gloss: 我每周游两次泳。
  en.a1.unit34.lesson01.teach.yoga:
    title: yoga
    gloss: 瑜伽
    note: '*yoga* 的意思是“瑜伽”。这里的动词是 *do*：*do yoga*。英语里像瑜伽这类个人活动用 *do*，不用 *play*，也不用 *go*。汉语说“做瑜伽”，动词正好对应。要注意的是，英语有三个动词（*play*、*go*、*do*），需要按运动种类分别记住。'
    example_gloss: 他早上做瑜伽。
  en.a1.unit34.lesson01.teach.exercise:
    title: exercise
    gloss: 锻炼
    note: '*exercise* 的意思是“锻炼，运动”，是表示身体活动的通用词。和 *soccer*、*swimming*、*yoga* 不同，*exercise* 本身就可以当动词用，不需要 *play*、*go* 或 *do*：*Do you exercise every day?*'
    example_gloss: 你每天都锻炼吗？
  en.a1.unit34.lesson02.teach.twice_a_week:
    title: twice a week
    gloss: 每周两次
    note: '*twice a week* 的意思是“每周两次”。这里的 *a* 不是“一个”，而是“每”：次数 + *a* + 时间单位，表示在这段时间里发生几次。汉语用“每”来表达（每周两次）。'
    example_gloss: 他每周打两次网球。
  en.a1.unit34.lesson02.teach.three_times_a_week:
    title: three times a week
    gloss: 每周三次
    note: '*three times a week* 的意思是“每周三次”。和 *twice a week* 一样，*a* 在这里表示“每”，不是“一个”：*times*（次）加上 *a week*（每周）表示每周的频率。'
    example_gloss: 她每周游三次泳。
  en.a1.unit34.lesson02.teach.on_weekends:
    title: on weekends
    gloss: 在周末
    note: '*on weekends* 的意思是“在周末”。英语在星期几和周末前用 *on*。汉语直接说“周末”，前面不需要介词，所以这里的 *on* 要特别记住。'
    example_gloss: 我们周末打篮球。
  en.a1.unit34.lesson02.teach.gym:
    title: gym
    gloss: 健身房
    note: '*gym* 的意思是“健身房”，是有器械和课程、用来锻炼的地方。'
    example_gloss: 他在健身房做瑜伽。
  en.a1.unit34.lesson02.teach.pool:
    title: pool
    gloss: 游泳池
    note: '*pool* 的意思是“游泳池”，是装满水、用来游泳的地方。'
    example_gloss: 我在游泳池游泳。
  en.a1.unit34.lesson02.teach.how_often_question:
    title: How often do you exercise?
    gloss: 你多久锻炼一次？
    note: 这个问句以 *how often*（多久一次）开头。后面接助动词 *do*，因为主要动词是 *exercise*：和其他英语疑问句一样要用 *do*。
  en.a1.unit34.lesson03.teach.dialogue_line1:
    title: Daniel 的问题
    gloss: Daniel 问：你周六想和我们一起踢足球吗？
    note: 对话以邀请踢足球开始。说 *soccer* 时要用 *play*。
  en.a1.unit34.lesson03.teach.dialogue_line2:
    title: "Leila 的回答"
    gloss: Leila 说：我不太喜欢足球，我更喜欢游泳。
    note: '*don''t really like* 的意思是“不太喜欢”，是一种比较委婉的拒绝方式。'
  en.a1.unit34.lesson03.teach.dialogue_line3:
    title: "Daniel 的回答"
    gloss: Daniel 说：没关系！你多久去游一次泳？
    note: '*go swimming*：说游泳要用 *go*，不用 *play* 或 *do*。'
  en.a1.unit34.lesson03.teach.dialogue_line4:
    title: "Leila 的回答"
    gloss: Leila 说：每周两次，通常在我家附近的游泳池。
    note: '*Twice a week*：这里的 *a* 也表示“每”。'
  en.a1.unit34.lesson03.teach.dialogue_line5:
    title: "Daniel 的回答"
    gloss: Daniel 说：不错！我有时也做瑜伽，不过跑步还是我的最爱。
    note: '*do yoga*：说瑜伽要用 *do*，和 *play*、*go* 不同。'
  en.a1.unit34.lesson04.teach.reading_passage:
    title: 关于 Daniel、Leila 和 Mia 的短文
    gloss: Daniel、Leila 和 Mia 都喜欢用不同的方式保持活跃。Daniel 每天早上上班前去跑步。Leila 更喜欢游泳，她每周去两次游泳池。Mia 刚加入团队，但她已经每个周日和邻居一起打网球了。周六，他们有时会一起在公园踢足球，不过足球不是任何人最喜欢的运动。
    note: 这篇短文用到了三个动词：*goes running*（*go*）、*plays tennis* 和 *play soccer*（*play*）。每种运动都有自己搭配的动词。
