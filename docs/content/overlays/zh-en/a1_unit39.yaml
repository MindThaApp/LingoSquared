teaching:
  en.a1.unit39.lesson01.teach.neighborhood:
    title: neighborhood
    gloss: 社区；街区
    note: '*neighborhood* 的意思是“社区、街区”，指你家周围的区域，包括附近的街道和建筑。'
    example_gloss: 我喜欢我所在的社区。
  en.a1.unit39.lesson01.teach.neighbor:
    title: neighbor
    gloss: 邻居
    note: '*neighbor* 的意思是“邻居”，指住在你隔壁或附近的人。'
    example_gloss: 我的邻居很乐于助人。
  en.a1.unit39.lesson01.teach.nearby:
    title: nearby
    gloss: 附近；在附近
    note: '*nearby* 的意思是“附近的、在附近”。'
    example_gloss: 附近有一个公园。
  en.a1.unit39.lesson01.teach.quiet:
    title: quiet
    gloss: 安静
    note: '*quiet* 的意思是“安静”，没有太多声音。'
    example_gloss: 我住的街道晚上很安静。
  en.a1.unit39.lesson01.teach.noisy:
    title: noisy
    gloss: 吵闹
    note: '*noisy* 的意思是“吵闹”，到处是很大的声音。'
    example_gloss: 我隔壁那条街很吵。
  en.a1.unit39.lesson01.teach.friendly:
    title: friendly
    gloss: 友好
    note: '*friendly* 的意思是“友好、友善”。'
    example_gloss: 我的邻居们都很友好。
  en.a1.unit39.lesson02.teach.live_in_a_neighborhood:
    title: live in a neighborhood
    gloss: 住在某个社区
    note: '*live in a neighborhood* 的意思是“住在某个社区里”。'
    example_gloss: 我住在一个安静的社区。
  en.a1.unit39.lesson02.teach.get_along_with_your_neighbors:
    title: get along with your neighbors
    gloss: 与邻居相处融洽
    note: '*get along with your neighbors* 的意思是“与邻居相处融洽”，也就是和住在附近的人保持良好友善的关系。'
    example_gloss: 我和邻居相处得很好。
  en.a1.unit39.lesson02.teach.close_to:
    title: close to
    gloss: 离……很近
    note: '*close to* 的意思是“离（某个地方）很近”。'
    example_gloss: 我的公寓离超市很近。
  en.a1.unit39.lesson02.teach.a_five_minute_walk:
    title: a five-minute walk
    gloss: 步行五分钟
    note: '*a five-minute walk* 是英语中的固定结构：数字加名词用连字符连成一个整体，名词用单数（*minute* 不加 s）。中文直接说“走路五分钟”，不需要这种连字符结构。'
    example_gloss: 从我家走到公园只要五分钟。
  en.a1.unit39.lesson02.teach.say_hello_to:
    title: say hello to
    gloss: 向……打招呼
    note: '*say hello to* 的意思是“向某人打招呼”。'
    example_gloss: 我早上总是向邻居打招呼。
  en.a1.unit39.lesson02.teach.whats_your_neighborhood_like_question:
    title: What's your neighborhood like?
    gloss: 你的社区怎么样？
    note: '*What''s ... like?* 用来询问“怎么样”，即请对方描述情况，而不是问喜好。'
  en.a1.unit39.lesson03.teach.dialogue_line1:
    title: Leila 的提问
    gloss: Leila：我可能很快就要搬家了。你的社区怎么样，Mia？
    note: '*might* 加动词表示一种可能性：可能会，也可能不会。'
  en.a1.unit39.lesson03.teach.dialogue_line2:
    title: "Mia 的回答"
    gloss: Mia：我真的很喜欢那里。很安静，而且附近有一个公园。
    note: '*there''s a park nearby* 的意思是“附近有一个公园”。'
  en.a1.unit39.lesson03.teach.dialogue_line3:
    title: Leila 的提问
    gloss: Leila：听起来不错。那里离超市近吗？
    note: '*That sounds nice* 是对好消息的一种自然回应。'
  en.a1.unit39.lesson03.teach.dialogue_line4:
    title: "Mia 的回答"
    gloss: Mia：近，离我住的楼走路只要五分钟就有一家。
    note: 这里的 *just* 的意思是“仅仅、只”，强调距离很短。
  en.a1.unit39.lesson03.teach.dialogue_line5:
    title: Leila 的提问
    gloss: Leila：那你的邻居呢？他们友好吗？
    note: '*What about ...?* 是引出新话题的一种自然说法。'
  en.a1.unit39.lesson03.teach.dialogue_line6:
    title: "Mia 的回答"
    gloss: Mia：非常友好！我不在家的时候，邻居 Lopez 先生会帮我给植物浇水。
    note: '*waters my plants* 的意思是“给我的植物浇水”，这里的 *water* 在英语中是动词。'
  en.a1.unit39.lesson03.teach.dialogue_line7:
    title: Leila 的回应
    gloss: Leila：太好了。我想我愿意住在你附近！
    note: '*I''d like to* 加动词，意思是“我想要……”。'
  en.a1.unit39.lesson04.teach.reading_passage:
    title: 关于三个社区的短文
    gloss: Daniel、Leila 和 Mia 三个人住在不同的社区。Daniel 的社区很热闹，他的公寓楼附近有餐厅和商店。他认识好几位邻居，经常在走廊里和他们打招呼。Leila 住在一个安静的社区，离她游泳的泳池很近。她街对面的邻居养了一只大狗，经常叫。Mia 的社区也很安静，从她住的楼走路五分钟就有一家超市。她的邻居 Lopez 先生非常友好，她不在家时会帮她给植物浇水。和 Mia 聊过之后，Leila 决定在她附近找一套公寓。
    note: '*decided she wants to look for* 的意思是“决定要去找……”。'
