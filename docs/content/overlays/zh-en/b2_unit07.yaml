course:
  title: B2 英语
  description: 学习 B2 水平的英语，用轻松自然的中文讲解，帮助你进行有层次的交谈、论证、推测和职场讨论。
units:
  en.b2.unit07.negotiation:
    title: On condition that the scope is reduced
lessons:
  en.b2.unit07.lesson01_terms_and_concessions:
    title: 条件、拒绝与让步
  en.b2.unit07.lesson02_conditional_terms:
    title: I can agree on condition that...
  en.b2.unit07.lesson03.reading_revised_terms:
    title: 阅读：达成了什么协议？
  en.b2.unit07.lesson04.the_negotiation_dialogue:
    title: Agreed, with a condition
teaching:
  en.b2.unit07.lesson01.teach.term:
    title: term
    gloss: 条款，协议的一部分
    note: '*term* 指协议中的一项条款，这里不是“学期”的意思。'
    example_gloss: 条款是协议的一个组成部分。
  en.b2.unit07.lesson01.teach.proposal:
    title: proposal
    gloss: 提议，建议方案
    note: '*proposal* 是对可能条款提出的建议。'
    example_gloss: 提议会建议一些可能的条款。
  en.b2.unit07.lesson01.teach.refusal:
    title: refusal
    gloss: 拒绝，回绝
    note: '*refusal* 表示某项条款不可接受。在英语里，明确的拒绝通常附上理由会更得体。'
    example_gloss: 拒绝表示某项条款无法接受。
  en.b2.unit07.lesson01.teach.concession:
    title: concession
    gloss: 让步
    note: '*concession* 指为了促成协议而放弃自己立场的一部分。'
    example_gloss: 让步是放弃立场的一部分。
  en.b2.unit07.lesson01.teach.scope:
    title: scope
    gloss: 工作范围
    note: '*scope* 指包含多少工作。谈判时，你可以拿截止日期和 scope 互相权衡。'
    example_gloss: 工作范围就是所包含的工作量。
  en.b2.unit07.lesson01.teach.condition:
    title: condition
    gloss: 前提条件
    note: '*condition* 指协议要生效就必须先满足的事项。'
    example_gloss: 前提条件必须先满足，协议才能生效。
  en.b2.unit07.lesson02.teach.condition_deadline:
    title: 有条件的让步
    gloss: 只要工作范围缩减，我可以同意提前截止日期。
    note: '*I can agree... on condition that...* 清楚而专业。它不会因为含糊其词而显得委婉。'
  en.b2.unit07.lesson02.teach.cannot_agree:
    title: 明确拒绝
    gloss: 对于完整工作范围下的周二交付，我不能同意。
    note: '*I cannot agree to...* 听起来比生硬的直接拒绝（如 *No, that is impossible*）更专业。'
  en.b2.unit07.lesson02.teach.accept_if:
    title: 用 if 表示接受
    gloss: 如果完整的附录在下周跟上，我可以接受。
    note: '*I can accept that if...* 把条件明确地说了出来。'
  en.b2.unit07.lesson02.teach.grammar_concession:
    title: 拒绝但仍继续谈判
    gloss: 用 I cannot agree 清楚地划出底线。用 I can agree on condition that 提出有条件的让步。
    note: 在英语里，过于直截了当可能显得生硬。要说明你的底线、理由和条件。
  en.b2.unit07.lesson03.teach.executive_summary:
    title: executive summary
    gloss: 执行摘要，管理层摘要
    note: '*executive summary* 是报告中列出要点的简短摘要。'
    example_gloss: 执行摘要给出报告的要点。
  en.b2.unit07.lesson03.teach.charts:
    title: charts
    gloss: 图表
    note: '*charts* 以可视化方式呈现信息。'
    example_gloss: 图表直观地展示信息。
  en.b2.unit07.lesson03.teach.reading_passage:
    title: 阅读：修订后的条款
    gloss: Priya 起初提议周四交付完整报告。Marcus 表示反对，因为客户需要更早拿到一些东西。Priya 拒绝了完整工作范围下的周二交付，因为那会影响质量。随后她提出了一个有条件的让步：如果工作范围缩减为执行摘要和图表，周二是可行的。Marcus 接受了这个条件，但又加了一条：完整的附录要在下周跟上。最终达成的结果是：周二交摘要和图表，下周交附录。
    note: 这场谈判立场坚定而不失专业：拒绝、理由、条件和协议。
  en.b2.unit07.lesson04.teach.q_thursday:
    title: Priya 提出建议
    gloss: Priya 说：如果工作范围保持原计划，我们可以在周四交付报告。
    note: 她立即把截止日期与工作范围联系在一起。
  en.b2.unit07.lesson04.teach.a_tuesday:
    title: Marcus 表示反对
    gloss: Marcus 说：周四对客户来说太晚了。你能在周二交付吗？
    note: 他要求提前截止日期，但没有立即改变工作范围。
  en.b2.unit07.lesson04.teach.q_cannot_tuesday:
    title: Priya 附上理由拒绝
    gloss: Priya 说：对于完整工作范围下的周二交付，我不能同意。那会影响质量。
    note: 给出理由，让拒绝显得专业，也不那么生硬。
  en.b2.unit07.lesson04.teach.a_what_possible:
    title: Marcus 询问条件
    gloss: Marcus 说：怎样才能让周二成为可能？
    note: 这个问题为有条件的让步打开了大门。
  en.b2.unit07.lesson04.teach.q_condition:
    title: Priya 提出一个条件
    gloss: Priya 说：只要工作范围缩减为执行摘要和图表，我可以同意提前截止日期。
    note: '*on condition that* 表达明确而专业。'
  en.b2.unit07.lesson04.teach.a_accept_appendix:
    title: Marcus 接受并附加一个条件
    gloss: Marcus 说：如果完整的附录在下周跟上，我可以接受。
    note: 他表示接受，但确定了其余部分何时交付。
  en.b2.unit07.lesson04.teach.q_agreed:
    title: Priya 敲定协议
    gloss: Priya 说：说定了。周二交摘要和图表，下周交附录。
    note: '*Agreed* 简短而清楚地结束了谈判。'
