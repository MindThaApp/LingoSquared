teaching:
  en.a1.unit04.lesson01.teach.monday:
    title: Monday
    gloss: 星期一
    note: '*Monday* 的意思是星期一；英语中星期名称的首字母总是大写，中文没有大小写之分。'
    example_gloss: 我星期一有空。
  en.a1.unit04.lesson01.teach.tuesday:
    title: Tuesday
    gloss: 星期二
    note: '*Tuesday* 的意思是星期二。'
    example_gloss: 我星期二有空。
  en.a1.unit04.lesson01.teach.wednesday:
    title: Wednesday
    gloss: 星期三
    note: '*Wednesday* 的意思是星期三；第一个 *d* 不发音。'
    example_gloss: 我星期三有空。
  en.a1.unit04.lesson01.teach.thursday:
    title: Thursday
    gloss: 星期四
    note: '*Thursday* 的意思是星期四。'
    example_gloss: 我星期四有空。
  en.a1.unit04.lesson01.teach.friday:
    title: Friday
    gloss: 星期五
    note: '*Friday* 的意思是星期五；在美国的日历里是正常的工作日，不是休息日。'
    example_gloss: 我星期五有空。
  en.a1.unit04.lesson01.teach.saturday:
    title: Saturday
    gloss: 星期六
    note: '*Saturday* 的意思是星期六；在美国的日历里属于周末。'
    example_gloss: 我星期六有空。
  en.a1.unit04.lesson01.teach.sunday:
    title: Sunday
    gloss: 星期日
    note: '*Sunday* 的意思是星期日；美国的日历通常把星期日排在一周的第一天。'
    example_gloss: 我星期日有空。
  en.a1.unit04.lesson01.teach.what_day:
    title: What day is it today?
    gloss: 今天星期几？
    note: '*What day is it today?* 问的是星期几，而不是完整的日期。'
  en.a1.unit04.lesson02.teach.january:
    title: January
    gloss: 一月
    note: '*January* 是一年中的第一个月。'
    example_gloss: 我的生日在一月。
  en.a1.unit04.lesson02.teach.march:
    title: March
    gloss: 三月
    note: '*March* 是一年中的第三个月。'
    example_gloss: 我的生日在三月。
  en.a1.unit04.lesson02.teach.july:
    title: July
    gloss: 七月
    note: '*July* 是一年中的第七个月。'
    example_gloss: 我的生日在七月。
  en.a1.unit04.lesson02.teach.september:
    title: September
    gloss: 九月
    note: '*September* 是一年中的第九个月。'
    example_gloss: 我的生日在九月。
  en.a1.unit04.lesson02.teach.december:
    title: December
    gloss: 十二月
    note: '*December* 是一年中的最后一个月。'
    example_gloss: 我的生日在十二月。
  en.a1.unit04.lesson02.teach.which_month:
    title: Which month is it?
    gloss: 现在是几月？
    note: '*Which month is it?* 问的是当前是几月。'
  en.a1.unit04.lesson03.teach.whats_the_date:
    title: What's today's date?
    gloss: 今天几号？
    note: '*What''s today''s date?* 问的是完整的日期，而不只是星期几。'
  en.a1.unit04.lesson03.teach.its_july_7:
    title: It's July 7th.
    gloss: 今天是 7 月 7 日。
    note: 美式英语里月份在日期之前：*July 7th*。这一点和中文的“7 月 7 日”顺序相同，都是先月后日。
  en.a1.unit04.lesson03.teach.its_tuesday_july_7:
    title: It's Tuesday, July 7th.
    gloss: 今天是星期二，7 月 7 日。
    note: 星期放在完整日期之前：[星期]，[月份] [日期]。
  en.a1.unit04.lesson03.teach.numeric_form:
    title: You can also write it as 7/7.
    gloss: 也可以写成 7/7。
    note: 注意：美国的数字日期格式是 月/日（*7/7* = 7 月 7 日）。但在英国等地区是 日/月，所以 *7/9* 在美国是 7 月 9 日，在英国则是 9 月 7 日，很容易造成混淆。
  en.a1.unit04.lesson03.teach.birthday_question:
    title: When's your birthday?
    gloss: 你的生日是什么时候？
    note: '*When''s your birthday?* 问的是出生的日期。'
  en.a1.unit04.lesson03.teach.birthday_answer:
    title: My birthday is March 3rd.
    gloss: 我的生日是 3 月 3 日。
    note: 说生日时用动词 *is*，和说今天的日期一样。
  en.a1.unit04.lesson04.teach.opens:
    title: opens
    gloss: 开门／开放
    note: '*opens* 是 *open*（打开、开放）的第三人称单数。'
    example_gloss: 图书馆星期四开放。
  en.a1.unit04.lesson04.teach.again:
    title: again
    gloss: 再／又
    note: '*again* 的意思是“再”或“又”。'
    example_gloss: 我们很快再见！
  en.a1.unit04.lesson04.teach.q_date:
    title: Daniel 询问日期
    gloss: Daniel：今天几号？
    note: 和之前学过的问题相同，现在放到了真实的对话中。
  en.a1.unit04.lesson04.teach.a_date:
    title: 关于日期的回答
    gloss: Leila：今天是星期二，7 月 7 日。
    note: 完整的回答既要说出星期，也要说出日期。
  en.a1.unit04.lesson04.teach.q_library:
    title: 询问何时重新开门
    gloss: Daniel：图书馆什么时候再开放？
    note: '*When''s the library open again?* 问的是重新开放的日期。'
  en.a1.unit04.lesson04.teach.a_library:
    title: 关于重新开门的回答
    gloss: Leila：它在星期四，7 月 9 日开放。
    note: '*It opens on Thursday, July 9th*；介词 *on* 用在星期之前。'
  en.a1.unit04.lesson04.teach.closing:
    title: 结束对话
    gloss: Daniel 说：太好了，到时候见！
    note: '*See you then* 表示在说好的那个时间再见面。'
