teaching:
  en.b1.unit08.lesson01.teach.before:
    title: before
    gloss: 在……之前
    note: '*before* 表示比另一件事更早。'
    example_gloss: 做饭前先洗手。
  en.b1.unit08.lesson01.teach.after:
    title: after
    gloss: 在……之后
    note: '*after* 表示比另一件事更晚。'
    example_gloss: 你下班后给我打电话。
  en.b1.unit08.lesson01.teach.as_soon_as:
    title: as soon as
    gloss: 一……就……
    note: '*as soon as* 表示某事一发生就马上……。'
    example_gloss: 我一到就给你发信息。
  en.b1.unit08.lesson01.teach.by_the_time:
    title: by the time
    gloss: 等到……的时候（最迟）
    note: '*by the time* 表示最迟到某件事发生的那个时间点。'
    example_gloss: 等米娅到的时候，晚饭就准备好了。
  en.b1.unit08.lesson01.teach.check_in:
    title: check in
    gloss: 报到，告知已安全到达
    note: '*check in* 表示简短地告诉别人自己已经到了或者很安全。'
    example_gloss: 到了酒店就报个平安。
  en.b1.unit08.lesson01.teach.lock_up:
    title: lock up
    gloss: 锁门
    note: '*lock up* 表示把房间或建筑关好并锁上。'
    example_gloss: 我离开办公室之前会锁好门。
  en.b1.unit08.lesson02.teach.as_soon_as_home:
    title: 紧接着做某事
    gloss: 我一到家就给你打电话。
    note: '*as soon as* 表示第二个动作紧接着第一个动作马上发生。'
  en.b1.unit08.lesson02.teach.before_upstairs:
    title: 先做某事
    gloss: 上楼之前，请先看一下信件。
    note: '*before* 表示哪个动作必须先做。'
  en.b1.unit08.lesson02.teach.grammar_future_time_clause:
    title: 时间从句中的一般现在时
    gloss: 我到家时给你打电话。上楼之前，请先看一下信件。
    note: 在英语的时间状语从句中，将来的事件用一般现在时：用 *when I get home*，而不是 *when I will get home*。
  en.b1.unit08.lesson03.teach.front_door:
    title: front door
    gloss: 前门
    note: '*front door* 指房子或建筑正面的主门。'
    example_gloss: 丹尼尔看完信件后锁上前门。
  en.b1.unit08.lesson03.teach.ready:
    title: ready
    gloss: 准备好的
    note: '*ready* 表示已经准备好，可以使用。'
    example_gloss: 等米娅到的时候，晚饭就准备好了。
  en.b1.unit08.lesson03.teach.reading_passage:
    title: 阅读：晚上的计划
    gloss: 丹尼尔有一套细致的晚间习惯。他到家时，首先查看信件。看完信件后，他会锁上前门。开始做晚饭之前，他会洗手并收拾桌子。等米娅到的时候，厨房已经收拾好，饭菜也是热的。
    note: 一篇短文，用到了 *when*、*after*、*before* 和 *by the time*。
  en.b1.unit08.lesson04.teach.q_call_when_home:
    title: Leila 请求回电
    gloss: 蕾拉说：丹尼尔，你到家时能给我打个电话吗？
    note: 一个用 *when* 来说明动作发生时间的问句。
  en.b1.unit08.lesson04.teach.a_as_soon_as_home:
    title: Daniel 承诺马上打电话
    gloss: 丹尼尔说：当然。我一到家就给你打电话。
    note: '*as soon as* 说明他会马上打电话。'
  en.b1.unit08.lesson04.teach.q_check_mail:
    title: Leila 给出第一个任务
    gloss: 蕾拉说：上楼之前，请先看一下信件。
    note: '*before* 表示先看信件。'
  en.b1.unit08.lesson04.teach.a_after_mail_lock:
    title: Daniel 说出下一步
    gloss: 丹尼尔说：好的。看完信件后，我会锁上前门。
    note: '*after* 表示两个动作之间的先后顺序。'
  en.b1.unit08.lesson04.teach.q_by_the_time_mia:
    title: Leila 说出时间点
    gloss: 蕾拉说：好。等米娅到的时候，一切应该都准备好了。
    note: '*by the time* 表示最迟到那个时刻，一切就应该准备好了。'
  en.b1.unit08.lesson04.teach.a_start_dinner:
    title: Daniel 敲定计划
    gloss: 丹尼尔说：那她到的时候，我们就可以开始做晚饭了。
    note: '*when she arrives* 说明了可以开始的时间。'
