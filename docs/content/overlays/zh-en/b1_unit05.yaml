teaching:
  en.b1.unit05.lesson01.teach.responsible_for:
    title: responsible for
    gloss: 负责……
    note: '*responsible for* 表示照管某事是你的职责。'
    example_gloss: 我负责月度报告。
  en.b1.unit05.lesson01.teach.update:
    title: update
    gloss: 更新，最新情况
    note: '*update* 指关于事情进展的新信息。'
    example_gloss: 我每周向团队做一次进度更新。
  en.b1.unit05.lesson01.teach.deadline:
    title: deadline
    gloss: 截止日期
    note: '*deadline* 指某事必须完成的最后期限。'
    example_gloss: 报告的截止日期是周五。
  en.b1.unit05.lesson01.teach.report:
    title: report
    gloss: 报告
    note: '*report* 指关于工作或结果的书面文件。'
    example_gloss: 我每个月写一份销售报告。
  en.b1.unit05.lesson01.teach.on_schedule:
    title: on schedule
    gloss: 按计划进行
    note: '*on schedule* 表示事情按计划进行，没有延误。'
    example_gloss: 项目按计划进行。
  en.b1.unit05.lesson01.teach.behind_schedule:
    title: behind schedule
    gloss: 落后于计划
    note: '*behind schedule* 表示事情进展得比计划慢。'
    example_gloss: 这周我们进度稍有落后。
  en.b1.unit05.lesson02.teach.responsible_for_report:
    title: 说明负责的事务
    gloss: 我负责月度报告。
    note: '*I''m responsible for...* 是描述自己工作职责的直接说法。'
  en.b1.unit05.lesson02.teach.project_on_schedule:
    title: 说明进度正常
    gloss: 项目按计划进行。
    note: '*on schedule* 表示没有延误。'
  en.b1.unit05.lesson02.teach.behind_schedule_finish_friday:
    title: 汇报进展状态
    gloss: 我进度稍有落后，但我会在周五之前完成。
    note: '*I''m a little behind schedule, but I''ll finish by...* 是坦诚汇报延误并给出具体期限的说法。'
  en.b1.unit05.lesson02.teach.grammar_status_update:
    title: 汇报进展状态
    gloss: 我负责这份报告。项目按计划进行。我进度落后了。
    note: 这三个句子是在工作中谈论职责和进展的常用表达。
  en.b1.unit05.lesson03.teach.team:
    title: team
    gloss: 团队
    note: '*team* 指一起工作的一群人。'
    example_gloss: 他每周给团队做一次简短的进度更新。
  en.b1.unit05.lesson03.teach.technical_problem:
    title: technical problem
    gloss: 技术问题
    note: '*technical problem* 指设备或软件方面的问题。'
    example_gloss: 由于一个技术问题，他的进度落后了。
  en.b1.unit05.lesson03.teach.reading_passage:
    title: 阅读：Daniel 的周报
    gloss: 丹尼尔负责每月的销售报告。每周他都会给团队做一次简短的进度更新。这周，由于一个技术问题，他的进度稍有落后，但他预计周五能完成。他总是向团队如实说明延误的情况。
    note: 一篇短文，讲丹尼尔如何坦诚地说明延误。
  en.b1.unit05.lesson04.teach.q_could_you_help_review:
    title: Daniel 请 Mia 帮忙
    gloss: 丹尼尔说：米娅，在我发出这份报告之前，你能帮我审阅一下吗？
    note: '*could you help me...* 是礼貌地请同事帮忙的说法。'
  en.b1.unit05.lesson04.teach.a_of_course_what_help:
    title: Mia 答应
    gloss: 米娅说：当然可以。你需要我帮什么忙？
    note: '*of course* 是友好而直接地表示答应的说法。'
  en.b1.unit05.lesson04.teach.q_make_sure_numbers:
    title: Daniel 说明他需要什么
    gloss: 丹尼尔说：我想确保数字是正确的。
    note: '*make sure* 表示核实某事无误。'
  en.b1.unit05.lesson04.teach.a_check_this_afternoon:
    title: Mia 答应看一下
    gloss: 米娅说：没问题。我今天下午看一下，然后把我的意见发给你。
    note: '*I''ll check it this afternoon* 是带有具体时间的承诺。'
  en.b1.unit05.lesson04.teach.q_thank_you_appreciate:
    title: Daniel 感谢 Mia
    gloss: 丹尼尔说：谢谢，我真的很感激。
    note: '*I really appreciate it* 是真诚表达感谢的说法。'
  en.b1.unit05.lesson04.teach.a_youre_welcome_let_me_know:
    title: Mia 提供进一步的帮助
    gloss: 米娅说：不客气。如果你还需要什么，告诉我一声。
    note: '*let me know if...* 表示还愿意提供进一步的帮助。'
