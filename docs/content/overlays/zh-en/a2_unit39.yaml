teaching:
  en.a2.unit39.lesson01.teach.offer:
    title: offer
    gloss: 录用通知
    note: '*offer* 在这里指给你的职位录用通知。作为动词，*to offer* 的意思是提供。'
    example_gloss: 我收到了 Bright Path Marketing 的录用通知。
  en.a2.unit39.lesson01.teach.contract:
    title: contract
    gloss: 劳动合同、合同
    note: '*contract* 是你和公司之间的书面协议。'
    example_gloss: 合同期限为一年。
  en.a2.unit39.lesson01.teach.salary:
    title: salary
    gloss: 薪水
    note: '*salary* 是每月或每年挣得的金额。'
    example_gloss: 薪水的事我们下周可以谈。
  en.a2.unit39.lesson01.teach.accept:
    title: accept
    gloss: 接受
    note: '*accept* 的意思是对别人提供给你的东西说“好”。'
    example_gloss: 我很愿意接受这个职位。
  en.a2.unit39.lesson01.teach.start_date:
    title: start date
    gloss: 入职日期
    note: '*start date* 是你新工作的第一天。'
    example_gloss: 入职日期是每个月的第一个星期一。
  en.a2.unit39.lesson01.teach.reply:
    title: reply
    gloss: 回复
    note: '*reply* 既是对消息的回复，也是动词“回复”。'
    example_gloss: 我当天就发了回复。
  en.a2.unit39.lesson01.teach.grammar_would_like_to:
    title: 用 would like to 表达礼貌的愿望
    gloss: 我想接受这份录用通知。我想从周一开始上班。
    note: '*I would like to ...* 比 *I want to ...* 更礼貌，适合商务场合。'
  en.a2.unit39.lesson02.teach.thank_you_for_the_interview:
    title: 开始写消息
    gloss: 感谢您昨天的面试。
    note: '*Thank you for ...* 是简短商务感谢信息的常见开头。'
  en.a2.unit39.lesson02.teach.still_interested:
    title: 说明您仍然感兴趣
    gloss: 我依然对这个职位非常感兴趣。
    note: '*still* 的意思是“仍然、依旧”，放在形容词前面。'
  en.a2.unit39.lesson02.teach.could_you_tell_me_start_date:
    title: 礼貌地询问开始日期
    gloss: 您能告诉我入职日期吗？
    note: '*Could you tell me ...?* 是间接问句，比 *When is the start date?* 更礼貌。'
  en.a2.unit39.lesson02.teach.would_like_to_accept:
    title: 接受提议
    gloss: 我想接受这份录用通知。
    note: 这是接受一个职位时的标准句子。
  en.a2.unit39.lesson02.teach.grammar_indirect_questions:
    title: 用 Could you tell me 的间接疑问句
    gloss: 您能告诉我入职日期吗？您能给我介绍一下工作时间吗？
    note: '*Could you tell me* 后面不再用疑问句的语序：说 *the start date*，而不是 *what is the start date*。'
  en.a2.unit39.lesson03.teach.full_time:
    title: full time
    gloss: 全职
    note: '*full time* 的意思是完整的工作周；反义词是 *part time*（兼职）。'
    example_gloss: 这个职位是全职的，不是每周只上两天班。
  en.a2.unit39.lesson03.teach.offer_message:
    title: 带有报价的消息
    gloss: 亲爱的 Mia：感谢您周二前来面试。我们想为您提供市场协调专员的职位。合同为全职，入职日期是周一。请在周五之前回复。Bright Path Marketing。
    note: 一封录用通知总会写明四件事：职位、合同类型、入职日期和回复期限。
  en.a2.unit39.lesson03.teach.please_reply_by_friday:
    title: 回复期限
    gloss: 请在周五之前回复。
    note: '*by Friday* 的意思是最迟周五，也就是周五当天仍然可以。'
  en.a2.unit39.lesson04.teach.q_calling_about_interview:
    title: 面试官给 Mia 打电话
    gloss: 面试官说：你好，Mia，我打电话是想谈谈周二的面试。
    note: '*I am calling about ...* 是商务电话常见的开场白。'
  en.a2.unit39.lesson04.teach.a_still_interested:
    title: Mia 表示她仍然感兴趣
    gloss: Mia 说：感谢您来电。我依然对这个职位非常感兴趣。
    note: 和第 2 课中的句子相同。
  en.a2.unit39.lesson04.teach.q_offer_you_the_job:
    title: 面试官提供职位
    gloss: 面试官说：很好，因为我们想给您这份工作。
    note: 这里的 *because* 把 Mia 的回答和随后的好消息联系起来。
  en.a2.unit39.lesson04.teach.a_great_news_ask_start_date:
    title: Mia 回应并询问开始日期
    gloss: Mia 说：这真是个好消息。您能告诉我入职日期吗？
    note: 先简短回应这个消息，再提出问题。
  en.a2.unit39.lesson04.teach.q_start_date_and_contract:
    title: 面试官说明日期和合同
    gloss: 面试官说：入职日期是周一，合同是全职的。
    note: 和第 3 课消息中的两个事实相同。
  en.a2.unit39.lesson04.teach.a_ask_working_hours:
    title: Mia 询问工作时间
    gloss: Mia 问：您能给我介绍一下工作时间吗？
    note: 和询问入职日期时用的是同样的间接问句形式。
  en.a2.unit39.lesson04.teach.q_nine_to_five:
    title: 面试官说明工作时间
    gloss: 面试官说：从九点到五点，午休一小时。
    note: '*from nine to five* 是描述一个工作日的固定说法。'
  en.a2.unit39.lesson04.teach.a_accept_the_offer:
    title: Mia 接受提议
    gloss: Mia 说：谢谢。我想接受这份录用通知。
    note: 和第 2 课中的句子相同。
  en.a2.unit39.lesson04.teach.q_send_the_contract:
    title: 面试官结束对话
    gloss: 面试官说：太好了。我们今天就把合同发给您。
    note: '*Wonderful* 是一种热情、积极的回应，在商务英语中也很常用。'
