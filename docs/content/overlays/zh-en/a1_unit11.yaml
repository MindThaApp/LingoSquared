teaching:
  en.a1.unit11.lesson01.teach.sunny:
    title: sunny
    gloss: 晴朗的
    note: '*sunny* 的意思是“晴朗的”。'
    example_gloss: 今天天气晴朗。
  en.a1.unit11.lesson01.teach.rainy:
    title: rainy
    gloss: 下雨的
    note: '*rainy* 的意思是“下雨的、多雨的”。'
    example_gloss: 我不喜欢下雨天。
  en.a1.unit11.lesson01.teach.cloudy:
    title: cloudy
    gloss: 多云的
    note: '*cloudy* 的意思是“多云的”。'
    example_gloss: 天空多云。
  en.a1.unit11.lesson01.teach.cold:
    title: cold
    gloss: 冷的
    note: '*cold* 的意思是“冷的”。'
    example_gloss: 外面很冷。
  en.a1.unit11.lesson01.teach.hot:
    title: hot
    gloss: 热的
    note: '*hot* 的意思是“热的”。'
    example_gloss: 夏天很热。
  en.a1.unit11.lesson01.teach.windy:
    title: windy
    gloss: 有风的
    note: '*windy* 的意思是“有风的、刮风的”。'
    example_gloss: 今天风很大。
  en.a1.unit11.lesson02.teach.whats_weather_like:
    title: What's the weather like today?
    gloss: 今天天气怎么样？
    note: '*What''s the weather like?* 是询问天气的标准问句。'
  en.a1.unit11.lesson02.teach.its_sunny:
    title: It's sunny and warm.
    gloss: 天气晴朗又暖和。
    note: '*It''s* + 形容词可以描述当前的天气。'
  en.a1.unit11.lesson02.teach.its_raining:
    title: It's raining.
    gloss: 正在下雨。
    note: '*It''s raining* 用的是现在进行时，表示正在下雨；汉语常说“下雨了”或“正在下雨”。'
  en.a1.unit11.lesson02.teach.take_umbrella:
    title: You should take an umbrella.
    gloss: 你应该带把伞。
    note: '*should* 表示建议，相当于汉语的“应该、最好”。'
  en.a1.unit11.lesson03.teach.tomorrow:
    title: tomorrow
    gloss: 明天
    note: '*tomorrow* 的意思是“明天”（今天的下一天）。'
    example_gloss: 明天见。
  en.a1.unit11.lesson03.teach.forecast_text:
    title: 天气预报
    gloss: 明天天气晴朗又暖和。星期六会下雨。
    note: '*will* + 动词原形构成英语的将来时，相当于汉语的“会、将要”；英语动词本身不会变形。'
  en.a1.unit11.lesson04.teach.lets_go:
    title: Let's go to the park.
    gloss: 我们去公园吧。
    note: '*Let''s* + 动词原形表示“我们……吧”，用来提出建议。'
  en.a1.unit11.lesson04.teach.q_weather:
    title: Leila 的提问
    gloss: 蕾拉：今天天气怎么样？
    note: 蕾拉用一个关于天气的问题开启了对话。
  en.a1.unit11.lesson04.teach.a_sunny_warm:
    title: Daniel 的回答
    gloss: 丹尼尔：天气晴朗又暖和。
    note: 丹尼尔描述了当前的天气。
  en.a1.unit11.lesson04.teach.suggest_park:
    title: Leila 的建议
    gloss: 蕾拉：太好了，我们去公园吧。
    note: '*Great* 表达对好天气的兴奋心情。'
  en.a1.unit11.lesson04.teach.agree_rain_tomorrow:
    title: Daniel 的回答
    gloss: 丹尼尔：好主意。不过星期六会下雨，所以我们今天去吧。
    note: '*so* 把原因（星期六下雨）和结果（今天去）连接起来。'
