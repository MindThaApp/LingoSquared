course:
  title: اسپانیایی A1
  description: مکان‌های رایج محله و حروف اضافهٔ مکان، در ادامهٔ داستان النا و ماتئو، وقتی ماتئو که تازه به این منطقه آمده دربارهٔ محله سؤال می‌پرسد. پنج حرف اضافهٔ مکان را به‌عنوان رابطه‌های مکانی جدا و غیرقابل جایگزینی با هم یاد می‌گیرید.
