    example_gloss: توی کتابخانه درس می‌خونم.
  es.a1.unit08.lesson02.teach.cerca_de:
    title: نزدیک
    gloss: رستوران نزدیک بازاره.
    note: بعد از *Cerca de* (نزدیک) همیشه قبل از مکان مرجع *de* می‌آید.
  es.a1.unit08.lesson02.teach.lejos_de:
    title: دور از
    gloss: پارک از بازار دوره.
    note: '*Lejos de* (دور از) متضاد *cerca de* است.'
  es.a1.unit08.lesson02.teach.al_lado_de:
    title: کنار
    gloss: بانک کنار بازاره.
    note: '*Al lado de* (کنار) یک عبارت ثابت است (*al* = *a* + *el lado*). قبل از اسم مذکر مثل *mercado*، *de* + *el* به *del* تبدیل می‌شود: *al lado del mercado*.'
  es.a1.unit08.lesson02.teach.enfrente_de:
    title: روبه‌روی
    gloss: داروخانه روبه‌روی بازاره.
    note: '*Enfrente de* (روبه‌روی) دو مکان را توصیف می‌کند که در دو طرف یک چیز، مثلاً خیابان، قرار دارند.'
  es.a1.unit08.lesson02.teach.entre:
    title: بین
    gloss: کتابخانه بین بانک و پارکه.
    note: '*Entre* (بین) به دو نقطهٔ مرجع نیاز دارد که اینجا با *y* (و) به هم وصل شده‌اند.'
  es.a1.unit08.lesson03.teach.donde_esta_el_banco:
    title: پرسیدن جای بانک
    gloss: بانک کجاست؟
    note: '*Dónde está* (کجاست) الگوی استاندارد سؤال برای پیدا کردن جای یک مکان است.'
  es.a1.unit08.lesson03.teach.esta_al_lado_del_mercado:
    title: جواب دادن با مکان
    gloss: کنار بازاره.
    note: '*Del* از ترکیب *de* + *el* ساخته می‌شود و قبل از اسم مذکر *mercado* لازم است.'
  es.a1.unit08.lesson03.teach.donde_esta_la_farmacia:
    title: پرسیدن جای داروخانه
    gloss: داروخانه کجاست؟
    note: همان الگوی سؤال، این بار با اسمی که حرف تعریف مؤنث دارد؛ خود سؤال با جنسیت عوض نمی‌شود.
  es.a1.unit08.lesson03.teach.esta_enfrente_del_mercado:
    title: 'جواب: روبه‌روی'
    gloss: روبه‌روی بازاره.
    note: '*Enfrente de* + *el mercado* می‌شود *enfrente del mercado*، همان ترکیب *del* که در *al lado del mercado* بود.'
  es.a1.unit08.lesson04.teach.esta_lejos:
    title: پرسیدن دور بودن
    gloss: دوره؟
    note: یک سؤال کوتاه بعدی که فاعلش حذف شده، چون از موقعیت معلوم است.
  es.a1.unit08.lesson04.teach.no_esta_cerca:
    title: 'جواب: نه، نزدیکه'
    gloss: نه، نزدیکه.
    note: '*Cerca* به‌تنهایی (بدون *de*) برای جواب کوتاه کاربرد دارد، برخلاف عبارت کامل *cerca de* که با نام یک مکان می‌آید.'
  es.a1.unit08.lesson04.teach.si_esta_lejos:
    title: 'جواب: آره، خیلی دوره'
    gloss: آره، خیلی دوره.
    note: '*Bastante* (نسبتاً، کاملاً) *lejos* را تقویت می‌کند، ولی به قوت *muy* (خیلی) نیست.'
  es.a1.unit08.lesson05.teach.barrio_reading:
    title: خواندن دربارهٔ محله
    gloss: توی این محله جاهای مفید زیادی هست. بانک کنار بازاره. داروخانه روبه‌روی بازاره. پارک دوره، ولی کتابخانه بین بانک و پارکه. رستوران خیلی نزدیک بازاره.
    note: این متن کوتاه عبارت‌های مکانی این درس را در توصیف یک محله کنار هم می‌آورد.
    glosses:
      barrio: محله
      hay: وجود دارد (از haber)
      muchos: زیاد
      lugares: جاها
      útiles: مفید
      banco: بانک
      está: قرار دارد (از estar)
      lado: کنار، سمت
      mercado: بازار
      farmacia: داروخانه
      enfrente: روبه‌رو
      parque: پارک
      lejos: دور
      biblioteca: کتابخانه
      entre: بین
      restaurante: رستوران
      cerca: نزدیک
  es.a1.unit08.lesson05.teach.hay_note:
    title: Hay (هست/وجود دارد)
    gloss: چرا hay برای مفرد و جمع تغییر نمی‌کند.
    note: متن خود کارت را ببینید.
    target_text: '*Hay* (یعنی «هست/وجود دارد») برای مفرد و جمع تغییر نمی‌کنه: هم *hay un banco* و هم *hay muchos lugares* همین یک کلمه رو دارن.'
  es.a1.unit08.lesson06.teach.line01:
    title: پرسیدن جای بانک
    gloss: ماتئو از النا می‌پرسه بانک کجاست.
    note: همان سؤال *¿Dónde está...?* از قبل در این درس، که با صدا زدن اسم النا شروع شده تا حواسش جلب بشه.
  es.a1.unit08.lesson06.teach.line02:
    title: جواب و اشاره به بازار
    gloss: النا می‌گه کنار بازاره، همون جایی که تخم‌مرغ خریدیم.
    note: '*Donde compramos los huevos* (جایی که تخم‌مرغ‌ها را خریدیم) به خرید آن‌ها در درس ۷ اشاره دارد.'
  es.a1.unit08.lesson06.teach.line03:
    title: پرسیدن دربارهٔ داروخانه
    gloss: ماتئو تأیید می‌کنه و دربارهٔ داروخانه می‌پرسه.
    note: '*Ah, sí* (آها، آره) یک واکنش کوتاه و طبیعی قبل از سؤال بعدیه.'
  es.a1.unit08.lesson06.teach.line04:
    title: 'جواب: روبه‌روی'
    gloss: النا می‌گه روبه‌روی بازاره.
    note: 'یه جواب کوتاه: فاعل (*la farmacia*) حذف شده، چون از روی سؤال معلومه.'
  es.a1.unit08.lesson06.teach.line05:
    title: پرسیدن درباره‌ی پارک
    gloss: ماتئو درباره‌ی پارک می‌پرسه و اینکه نزدیکه یا نه.
    note: دو سؤال توی یک نوبت صحبت اومده؛ توی مکالمه‌ی دوستانه خیلی رایجه.
  es.a1.unit08.lesson06.teach.line06:
    title: 'جواب: دوره، بعد صحبت از کتابخونه'
    gloss: النا می‌گه پارک دوره، ولی کتابخونه بین بانک و پارکه.
    note: '*Pero* (ولی) دوری پارک رو با موقعیت مناسب‌تر کتابخونه در تضاد می‌ذاره.'
  es.a1.unit08.lesson06.teach.line07:
    title: تشکر و پرسیدن درباره‌ی رستوران
    gloss: ماتئو از النا تشکر می‌کنه و درباره‌ی رستورانی که توش غذا خوردن می‌پرسه.
    note: '*El restaurante donde comimos* (رستورانی که توش غذا خوردیم) به ناهارشون توی درس ۶ برمی‌گرده.'
  es.a1.unit08.lesson06.teach.line08:
    title: تأیید اینکه خیلی نزدیکه
    gloss: النا تأیید می‌کنه که خیلی نزدیک بازاره.
    note: '*Muy cerca* (خیلی نزدیک): *muy* (خیلی) از *bastante* (نسبتاً) قوی‌تره، مثل *bastante lejos* (نسبتاً دور).'
