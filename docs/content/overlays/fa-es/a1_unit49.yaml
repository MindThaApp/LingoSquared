teaching:
  es.a1.unit49.lesson01.teach.levantarse_me_levanto:
    title: از خواب بلند شدن
    gloss: از خواب بلند شدن ← از خواب بلند می‌شم
    note: '*Levantarse* بازتابی‌ه: ضمیر *me* قبل از فعل میاد، *Me levanto*.'
  es.a1.unit49.lesson01.teach.vestirse_me_visto:
    title: لباس پوشیدن
    gloss: لباس پوشیدن ← لباس می‌پوشم
    note: '*Vestirse* هم بازتابی‌ه: *Me visto*. اینجا *me* یعنی «خودم».'
  es.a1.unit49.lesson01.teach.desayunar_desayuno:
    title: صبحانه خوردن
    gloss: صبحانه خوردن ← صبحانه می‌خورم
    note: '*Desayunar* بازتابی نیست: *Desayuno*، بدون *me*.'
  es.a1.unit49.lesson01.teach.trabajar_trabajo:
    title: کار کردن
    gloss: کار کردن ← کار می‌کنم
    note: '*Trabajar* یه فعل باقاعده‌ی -ar ه: صورت *yo* ش به -o ختم می‌شه، *trabajo*.'
  es.a1.unit49.lesson01.teach.comer_como:
    title: غذا خوردن
    gloss: غذا خوردن ← غذا می‌خورم
    note: '*Comer* یه فعل باقاعده‌ی -er ه: صورت *yo* ش به -o ختم می‌شه، *como*.'
  es.a1.unit49.lesson01.teach.lavar_los_platos:
    title: ظرف شستن
    gloss: ظرف شستن ← ظرف می‌شورم
    note: '*Lavar los platos* بازتابی نیست: *Lavo los platos*. مفعول *los platos* بعد از فعل می‌مونه.'
  es.a1.unit49.lesson01.teach.dormir_duermo:
    title: خوابیدن
    gloss: خوابیدن ← می‌خوابم
    note: '*Dormir* توی صورت *yo* مصوت ریشه‌اش عوض می‌شه: *duermo* (o تبدیل می‌شه به ue).'
  es.a1.unit49.lesson02.teach.con_levantarse_y:
    title: الگوی بازتابی
    gloss: 'با levantarse و vestirse ضمیر قبل از فعل میاد: levantarse ← Me levanto.'
    note: 'با فعل‌های بازتابی، *me* رو قبل از فعل صرف‌شده بذارید: بگید *Me levanto*، نه *Levanto me*.'
  es.a1.unit49.lesson02.teach.levantarse_me_levanto:
    title: Levantarse توی جمله
    gloss: 'از خواب بلند شدن: ساعت هفت از خواب بلند می‌شم.'
    note: 'عبارت زمان بعد از فعل میاد: *Me levanto a las siete*.'
  es.a1.unit49.lesson02.teach.vestirse_me_visto:
    title: Vestirse توی جمله
    gloss: 'لباس پوشیدن: لباس می‌پوشم.'
    note: 'الگو اینه: *me* + *visto*؛ ضمیر درست جلوی فعل می‌مونه.'
  es.a1.unit49.lesson02.teach.lavar_los_platos:
    title: Lavar los platos توی جمله
    gloss: 'ظرف شستن: بعد از غذا ظرف می‌شورم.'
    note: '*Después de comer* («بعد از غذا خوردن») از *de* به‌علاوه‌ی مصدر استفاده می‌کنه و می‌تونه آخر جمله بیاد.'
  es.a1.unit49.lesson02.teach.sin_pronombre_desayuno:
    title: فعل‌های بدون me
    gloss: 'بدون ضمیر: صبحانه می‌خورم. کار می‌کنم. می‌خوابم. این فعل‌ها بازتابی نیستن.'
    note: '*Desayuno*، *trabajo* و *duermo* *me* ندارن: این فعل‌ها بازتابی نیستن.'
  es.a1.unit49.lesson03.teach.me_levanto_a:
    title: ساعت هفت و نیم از خواب بلند شدن
    gloss: ساعت ۷:۳۰ از خواب بلند می‌شم.
    note: 'توی اسپانیایی هم مثل فارسی «نیم» رو با «و» می‌گن: *y media*؛ *las siete y media* یعنی ۰۷:۳۰. قبل از ساعت از *a las* استفاده کنید.'
  es.a1.unit49.lesson03.teach.me_visto_a:
    title: ساعت یه ربع به هشت لباس پوشیدن
    gloss: ساعت ۷:۴۵ لباس می‌پوشم.
    note: '*Las ocho menos cuarto* از ساعت بعدی به عقب می‌شماره: ۰۷:۴۵.'
  es.a1.unit49.lesson03.teach.desayuno_a_las:
    title: ساعت هشت صبحانه خوردن
    gloss: ساعت هشت صبحانه می‌خورم.
    note: 'قبل از ساعت از *a las* استفاده کنید: *a las ocho*. برای ساعت یک می‌شه *a la una*.'
  es.a1.unit49.lesson03.teach.trabajo_de_nueve:
    title: از نه تا پنج کار کردن
    gloss: از ساعت نه تا ساعت پنج کار می‌کنم.
    note: '*De ... a ...* زمان شروع و پایان رو می‌رسونه: *de nueve a cinco*.'
  es.a1.unit49.lesson03.teach.como_a_las:
    title: ساعت شش و نیم غذا خوردن
    gloss: ساعت ۶:۳۰ بعدازظهر غذا می‌خورم.
    note: '*De la tarde* بعدازظهر یا عصر رو مشخص می‌کنه، پس اینجا *las seis y media* یعنی ۱۸:۳۰.'
  es.a1.unit49.lesson03.teach.duermo_a_las:
    title: ساعت یازده خوابیدن
    gloss: ساعت یازده می‌خوابم.
    note: 'قبل از ساعت از *a las* استفاده کنید: *a las once*.'
  es.a1.unit49.lesson04.teach.primero_luego_despues:
    title: اول، بعدش، بعد از اون
    gloss: اول، بعدش، بعد از اون
    note: '*Primero* اولین کار رو نشون می‌ده، *luego* کار بعدی رو و *después* چیزی رو که بعدش میاد.'
    example_gloss:
    - اول از خواب بلند می‌شم.
    - بعدش لباس می‌پوشم.
    - بعد از اون صبحانه می‌خورم.
  es.a1.unit49.lesson04.teach.primero_me_levanto:
    title: یه صبح سه‌مرحله‌ای
    gloss: اول از خواب بلند می‌شم. بعدش لباس می‌پوشم. بعد از اون صبحانه می‌خورم.
    note: 'فعل‌های بازتابی *me* رو جلوی فعل نگه می‌دارن: *me levanto*، *me visto*.'
  es.a1.unit49.lesson04.teach.primero_luego_y:
    title: کلمه‌های ترتیب
    gloss: 'Primero، luego و después کارهاتون رو به ترتیب میارن؛ فعل تغییر نمی‌کنه: Después desayuno.'
    note: 'کلمه‌های ترتیب اول جمله میان و شکل فعل تغییر نمی‌کنه: *Después desayuno*.'
  es.a1.unit49.lesson05.teach.mi_dia_me:
    title: روز من
    gloss: روز من — ساعت ۷:۳۰ از خواب بلند می‌شم. بعد از اون لباس می‌پوشم و ساعت هشت صبحانه می‌خورم. از نه تا پنج کار می‌کنم. ساعت ۶:۳۰ بعدازظهر غذا می‌خورم. بعد از اون ظرف می‌شورم. ساعت یازده می‌خوابم.
    note: هم به ترتیب کارها و هم به ساعت‌هاشون توجه کنید. به *me levanto* و *me visto* با *me* دقت کنید.
    glosses:
      Mi: من
      día: روز
      levanto: از خواب بلند می‌شم (me levanto)
      media: و نیم (y media)
      ocho: هشت
      Después: بعد از آن
      visto: لباس پوشیدن
      las: ساعت (پیش از ساعت‌ها)
      desayuno: صبحانه خوردن
      Trabajo: کار کردن
      nueve: نُه
      cinco: پنج
      siete: هفت
      tarde: عصر / شب
      como: غذا خوردن
      lavo: ظرف شستن
      once: یازده
      duermo: خوابیدن
  es.a1.unit49.lesson06.teach.elena_como_es:
    title: پرسیدن درباره‌ی یک روز
    gloss: 'النا: روزت چطوره، ماتئو؟'
    note: '*¿Cómo es tu día?* روشی صمیمی برای خواستن توضیح درباره‌ی روز کسی است؛ *tu* یعنی «ـت / مال تو» و صمیمی است.'
  es.a1.unit49.lesson06.teach.mateo_me_levanto:
    title: صبح ماتئو
    gloss: 'ماتئو: ساعت هفت و نیم بلند می‌شم. بعد لباس می‌پوشم و ساعت هشت صبحانه می‌خورم.'
    note: ماتئو سه کار صبحش را با *después* و *y* به هم وصل می‌کند.
  es.a1.unit49.lesson06.teach.elena_cuando_trabajas:
    title: روز کاری ماتئو
    gloss: 'النا: کی کار می‌کنی؟ ماتئو: از نه تا پنج کار می‌کنم.'
    note: 'النا و ماتئو با هم صمیمی‌اند و از شکل‌های *tú* استفاده می‌کنند: *¿Cuándo trabajas?*'
  es.a1.unit49.lesson06.teach.mateo_a_las:
    title: عصر ماتئو
    gloss: 'ماتئو: ساعت شش و نیمِ عصر غذا می‌خورم. بعدش ظرف می‌شورم. ساعت یازده می‌خوابم.'
    note: '*Después* اول جمله می‌آید ولی شکل فعل عوض نمی‌شود: *después lavo*.'
  es.a1.unit49.lesson06.teach.elena_me_levanto:
    title: صبح النا
    gloss: 'النا: ساعت شش بلند می‌شم، ولی تا شش و نیم صبحانه نمی‌خورم.'
    note: '*No ... hasta* یعنی «تا ... نه». النا ساعت بلند شدنش را با ساعت صبحانه‌اش مقایسه می‌کند.'
