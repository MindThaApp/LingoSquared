  es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue:
    title: Elena و Mateo کلاس بعدی را برنامه‌ریزی می‌کنند
teaching:
  es.a1.unit04.lesson01.teach.dias_entre_semana:
    title: دوشنبه تا جمعه
    gloss: دوشنبه، سه‌شنبه، چهارشنبه، پنجشنبه، جمعه
    note: در اسپانیایی نام روزهای هفته با حرف کوچک نوشته می‌شود، مگر اول جمله.
    example_gloss:
    - کارگاه آشپزی سه‌شنبه‌هاست.
    - پنجشنبه‌ها اسپانیایی می‌خونم.
  es.a1.unit04.lesson01.teach.fin_de_semana:
    title: شنبه، یکشنبه
    gloss: شنبه، یکشنبه
    note: '*Sábado* و *domingo* تنها دو روز هفته‌ان که در جمع «s» می‌گیرن (*los sábados*، *los domingos*). بقیهٔ نام روزها در مفرد و جمع یکسان می‌مونن.'
    example_gloss:
    - شنبه‌ها می‌رم بازار.
    - یکشنبه‌ها استراحت می‌کنم.
  es.a1.unit04.lesson01.teach.hoy_es_viernes:
    title: امروز جمعه است
    gloss: امروز جمعه است.
    note: '*Hoy* (امروز) به‌اضافهٔ *es* (است) و اسم روز، مستقیم می‌گه امروز چه روزیه. artikel لازم نیست.'
  es.a1.unit04.lesson01.teach.el_taller_es_los_martes:
    title: کارگاه سه‌شنبه‌هاست
    gloss: کارگاه آشپزی سه‌شنبه‌هاست.
    note: '*Los martes* (با حرف تعریف جمع *los*) یعنی «سه‌شنبه‌ها» به‌صورت برنامهٔ تکراری، نه فقط یک سه‌شنبهٔ مشخص.'
  es.a1.unit04.lesson02.teach.meses_primer_semestre:
    title: ژانویه تا ژوئن
    gloss: ژانویه، فوریه، مارس، آوریل، مه، ژوئن
    note: در اسپانیایی، مثل نام روزهای هفته، نام ماه‌ها هم با حرف کوچک نوشته می‌شه، مگر اینکه اول جمله بیاد.
    example_gloss:
    - تولدم در ماه مارس است.
    - ژوئن هوا گرمه.
  es.a1.unit04.lesson02.teach.meses_segundo_semestre:
    title: ژوئیه تا دسامبر
    gloss: ژوئیه، اوت، سپتامبر، اکتبر، نوامبر، دسامبر
    note: '*Septiembre* ریشه‌ای شبیه «سپتامبر» داره. بیشتر نام ماه‌ها در اسپانیایی شباهت زیادی به نام‌هایی دارن که در فارسی برای ماه‌های میلادی استفاده می‌شه.'
    example_gloss:
    - کارگاه آشپزی در ژوئیه شروع می‌شه.
    - دسامبر به دیدن خانواده‌م می‌رم.
  es.a1.unit04.lesson02.teach.mi_cumpleanos_es_en_marzo:
    title: تولدم در مارس است
    gloss: تولدم در ماه مارس است.
    note: '*En* (در) فقط با نام ماه، بدون روز مشخص، به کار می‌ره.'
  es.a1.unit04.lesson03.teach.que_fecha_es_hoy:
    title: پرسیدن تاریخ امروز
    gloss: تاریخ امروز چنده؟
    note: '*Qué fecha* (چه تاریخی) روش معمول پرسیدن تاریخ تقویمیه و با *qué hora* (ساعت چنده) که در درس‌های بعدی می‌آد فرق داره.'
  es.a1.unit04.lesson03.teach.hoy_es_el_veintidos_de_julio:
    title: گفتن تاریخ
    gloss: امروز بیست‌ودوم ژوئیه است.
    note: '*El veintidós de julio* یعنی تقریباً «بیست‌ودو ژوئیه». اسپانیایی برای تاریخ از عدد اصلی استفاده می‌کنه، نه عدد ترتیبی مثل «بیست‌ودوم» در فارسی.'
  es.a1.unit04.lesson03.teach.formato_fecha_note:
    title: شکل تاریخ در اسپانیایی
    gloss: اسپانیایی تاریخ را چطور می‌گه.
    note: عدد اصلی + de + نام ماه. برای اول ماه، *el primero* رایجه (به‌خصوص در آمریکای لاتین) و *el uno* هم به‌کار می‌ره، به‌خصوص در اسپانیا.
    target_text: 'اسپانیایی تاریخ را به‌صورت عدد اصلی + de + ماه می‌گوید، نه با عدد ترتیبی مثل «پانزدهم»: el veintidós de julio تحت‌اللفظی یعنی «بیست‌ودو از ژوئیه». برای روز اول ماه، خیلی‌ها (به‌خصوص در آمریکای لاتین) *el primero* (اول) می‌گویند؛ *el uno* هم رایج است، مخصوصاً در اسپانیا.'
  es.a1.unit04.lesson03.teach.cuando_es_el_taller:
    title: پرسیدن زمان کارگاه
    gloss: کارگاه کیه؟
    note: '*Cuándo* (کی) دربارهٔ زمان به‌طور کلی می‌پرسه؛ *qué fecha* (چه تاریخی) مشخصاً تاریخ تقویمی می‌خواد. هر دو اینجا طبیعی‌ان.'
  es.a1.unit04.lesson03.teach.el_taller_es_el_veintidos_de_julio:
    title: گفتن تاریخ کارگاه
    gloss: کارگاه بیست‌ودوم ژوئیه است.
    note: همون الگوی تاریخ *hoy es el veintidós de julio* دوباره اومده، فقط با فاعل دیگه‌ای (*el taller*).
  es.a1.unit04.lesson04.teach.cuando_es_tu_cumpleanos:
    title: پرسیدن تولد کسی
    gloss: تولدت کیه؟
    note: '*Tu cumpleaños* (تولدت، خودمونی) لحن *tú* رو داره که برای دوستان به‌کار می‌ره.'
  es.a1.unit04.lesson04.teach.mi_cumpleanos_es_el_diez_de_marzo:
    title: گفتن تاریخ تولد
    gloss: تولدم دهم مارس است.
    note: برخلاف *en marzo* (در مارس، فقط ماه)، تاریخ کامل تولد با *el* و عدد روز می‌آد، مثل *el veintidós de julio*.
  es.a1.unit04.lesson04.teach.el_de_mateo_es_el_veintidos_de_agosto:
    title: گفتن تولد شخص سوم
    gloss: تولد ماتئو بیست‌ودوم اوته.
    note: '*El cumpleaños de Mateo* (تولد ماتئو) برای نشان دادن مالکیت از *de* استفاده می‌کنه، مثل *la familia de Elena*.'
  es.a1.unit04.lesson04.teach.felicidades:
    title: تبریک!
    gloss: تبریک! / تولدت مبارک!
    note: '*¡Felicidades!* کلمهٔ عمومی تبریکه و هم برای تولد و هم برای خبرهای خوب دیگه به‌کار می‌ره.'
    example_gloss: تبریک، النا! امروز تولدته.
  es.a1.unit04.lesson05.teach.horario_reading:
    title: خواندن برنامهٔ کارگاه
    gloss: کارگاه آشپزی سه‌شنبه‌هاست. کلاس بعدی بیست‌ودوم ژوئیه است. بعد از اون، بیست‌ونهم ژوئیه هم کلاس هست. کارگاه دوازدهم اوت تموم می‌شه.
    note: این برنامهٔ کوتاه، نام روزهای هفته و الگوی تاریخی رو که یاد گرفتید در یک متن یکپارچه به کار می‌بره.
    glosses:
      taller: کارگاه
      cocina: آشپزی
      martes: سه‌شنبه‌ها
      próxima: بعدی
      clase: کلاس
      veintidós: بیست‌ودو
      julio: ژوئیه
      Después: بعد از اون
      hay: هست (از haber)
      veintinueve: بیست‌ونه
      termina: تموم می‌شه (از terminar)
      doce: دوازده
      agosto: اوت
  es.a1.unit04.lesson05.teach.la_proxima_clase:
    title: کلاس بعدی
    gloss: کلاس بعدی
    note: '*Próxima* (بعدی) با اسم مؤنث *clase* هماهنگ شده؛ شکل مذکرش *próximo* است.'
  es.a1.unit04.lesson05.teach.despues_note:
    title: Después (بعد از)
    gloss: '*Después* چطور رویدادها را پشت سر هم می‌آورد.'
    note: '*Después* = بعد، بعد از اون.'
    target_text: '*Después* (بعد، پس از آن) دو رویداد را پشت سر هم وصل می‌کند: اول یک کار، بعد کار بعدی.'
  es.a1.unit04.lesson06.teach.line01:
    title: پرسیدن دربارهٔ کلاس بعدی
    gloss: ماتئو از النا می‌پرسه کلاس بعدی کارگاه کیه.
    note: '*La próxima clase del taller* = کلاس بعدیِ کارگاه.'
  es.a1.unit04.lesson06.teach.line02:
    title: گفتن تاریخ
    gloss: النا تأیید می‌کنه که بیست‌ودوم ژوئیه است، یک سه‌شنبه.
    note: النا بعد از تاریخ *un martes* (یک سه‌شنبه) رو اضافه می‌کنه تا نشون بده کلاس در روز همیشگی کارگاه، یعنی سه‌شنبه، برگزار می‌شه.
  es.a1.unit04.lesson06.teach.line03:
    title: پرسیدن پایان کارگاه
    gloss: ماتئو می‌پرسه کارگاه کی تموم می‌شه.
    note: '*Perfecto* (عالی) یه واکنش کوتاه و طبیعیه قبل از پرسیدن سؤال بعدی.'
  es.a1.unit04.lesson06.teach.line04:
    title: گفتن تاریخ پایان
    gloss: النا می‌گه دوازدهم اوت تموم می‌شه.
    note: همون تاریخ پایانی که در برنامهٔ چاپ‌شده هست.
  es.a1.unit04.lesson06.teach.line05:
    title: پرسیدن تولد وسط گفتگو
    gloss: ماتئو با «راستی» می‌پرسه تولد النا کیه.
    note: '*Por cierto* (راستی) وسط گفتگو، به‌طور طبیعی موضوع رو عوض می‌کنه.'
  es.a1.unit04.lesson06.teach.line06:
    title: گفتن تاریخ و پرسیدن همون سؤال
    gloss: النا می‌گه دهم مارس، بعد می‌پرسه «مال تو چی؟»
    note: '*¿Y el tuyo?* (مال تو چی؟) از ضمیر ملکی *tuyo* استفاده می‌کنه؛ شکل کوتاهی برای برگردوندن سؤال دربارهٔ چیزی که قبلاً اسمش اومده (*cumpleaños* مذکره، پس *tuyo* نه *tuya*).'
  es.a1.unit04.lesson06.teach.line07:
    title: گفتن تولد ماتئو
    gloss: ماتئو می‌گه بیست‌ودوم اوت.
    note: یه جواب کوتاه و کامل که الگوی تاریخ رو بدون تکرار «mi cumpleaños es» به‌کار می‌بره؛ در گفتگوی سریع محاوره‌ای طبیعیه.
  es.a1.unit04.lesson06.teach.line08:
    title: واکنش و اشاره به زمان
    gloss: النا با خوشحالی واکنش نشون می‌ده و می‌گه تولد ماتئو بعد از پایان کارگاهه.
    note: '*Es después del taller* (بعد از کارگاهه): بیست‌ودوم اوت بعد از پایان کارگاه در دوازدهم اوت می‌آد.'
