course:
  title: اسپانیایی A1
  description: روزهای هفته، ماه‌های سال، و پرسیدن و گفتن تاریخ و تولد، در ادامه‌ی ماجرای کارگاه آشپزی Elena و Mateo از درس‌های ۱ تا ۳. نکته‌ی اصلی، شیوه‌ی گفتن تاریخ با عدد اصلی است که با عدد ترتیبی در فارسی فرق دارد.
