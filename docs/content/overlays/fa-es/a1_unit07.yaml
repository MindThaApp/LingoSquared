teaching:
  es.a1.unit07.lesson01.teach.el_mercado:
    title: بازار
    gloss: بازار
    note: '*Mercado* مذکر است.'
    example_gloss: بیایید به بازار برویم.
  es.a1.unit07.lesson01.teach.fruta_verdura:
    title: میوه، سبزی
    gloss: میوه، سبزی
    note: '*Verdura* یعنی سبزیجات به‌طور کلی (اغلب سبز)؛ اسمی مؤنث و مفرد است که به‌صورت جمعی هم به کار می‌رود، مثل «سبزی» در فارسی.'
    example_gloss:
    - می‌خوام میوه بخرم.
    - سبزی‌ها تازه هستند.
  es.a1.unit07.lesson01.teach.huevos_pan:
    title: تخم‌مرغ، نان
    gloss: تخم‌مرغ، نان
    note: '*Huevos* از قبل جمع است (مفردش *huevo* است)؛ *pan* (نان) اسم ناشمارش است و در معنای روزمره جمع طبیعی ندارد.'
    example_gloss:
    - تخم‌مرغ لازم دارم.
    - نان مال امروز صبحه.
  es.a1.unit07.lesson02.teach.cuanto_cuesta:
    title: پرسیدن قیمت
    gloss: قیمتش چقدره؟
    note: '*Cuesta* سوم‌شخص مفرد فعل *costar* (قیمت داشتن) است؛ فعلی که در این درس جدیده.'
  es.a1.unit07.lesson02.teach.cuanto_es:
    title: پرسیدن قیمت، شکل دیگر
    gloss: چنده؟
    note: به نکتهٔ دستوری بعدی که این را با *¿Cuánto cuesta?* مقایسه می‌کند نگاه کنید.
  es.a1.unit07.lesson02.teach.cuesta_dos:
    title: گفتن قیمت
    gloss: دو تاست.
    note: یک پاسخ کوتاه و کامل دربارهٔ قیمت؛ واحد پول از موقعیت معلوم است، همان‌طور که در فارسی هم موقع خرید اغلب فقط عدد را می‌گوییم.
  es.a1.unit07.lesson02.teach.cuanto_cuesta_vs_es_note:
    title: Cuánto cuesta یا Cuánto es
    gloss: دو روش به یک اندازه طبیعی برای پرسیدن قیمت.
    note: متن خود کارت را ببینید.
    target_text: '*¿Cuánto cuesta?* (قیمتش چقدره؟) و *¿Cuánto es?* (چنده؟) هر دو برای پرسیدن قیمت طبیعی هستند و در خریدهای روزمره می‌توان به‌جای هم به کار برد.'
  es.a1.unit07.lesson03.teach.una_docena_de_huevos:
    title: درخواست یک دوجین تخم‌مرغ
    gloss: یک دوجین تخم‌مرغ، لطفاً.
    note: '*Docena* (دوجین) در اسپانیایی اسم است و همیشه با *de* و بعد از آن چیزِ موردنظر می‌آید.'
  es.a1.unit07.lesson03.teach.un_kilo_de_tomates:
    title: درخواست یک کیلو گوجه‌فرنگی
    gloss: یک کیلو گوجه‌فرنگی، لطفاً.
    note: '*Kilo* هم مثل *docena* با الگوی *de* و بعد از آن چیزِ موردنظر می‌آید.'
  es.a1.unit07.lesson03.teach.medio_kilo:
    title: نیم کیلو
    gloss: نیم کیلو
    note: '*Medio* (نیم) قبل از اسم می‌آید و با آن در جنسیت مطابقت دارد (*medio kilo* مذکر؛ *media docena* مؤنث).'
    example_gloss: نیم کیلو نان، لطفاً.
  es.a1.unit07.lesson03.teach.un_poco_de:
    title: کمی از
    gloss: کمی از
    note: '*Un poco de* برای مقدار کم و نامشخص به کار می‌رود، وقتی مقدار دقیق لازم نیست.'
    example_gloss: کمی میوه می‌خوام.
  es.a1.unit07.lesson04.teach.necesita_algo_mas:
    title: پرسیدن اینکه چیز دیگری لازم است
    gloss: چیز دیگه‌ای لازم دارید؟
    note: '*Necesita* صورت *usted* فعل *necesitar* است؛ لحن محترمانه‌ای که فروشنده معمولاً با مشتری به کار می‌برد.'
  es.a1.unit07.lesson04.teach.no_creo_que_ya_tenemos_todo:
    title: گفتن اینکه همه‌چیز را دارید
    gloss: نه، فکر می‌کنم همه‌چیز را داریم.
    note: '*Creo que* (فکر می‌کنم که) راهی رایج برای نرم‌تر کردن جمله است؛ اینجا کامل بودن فهرست خرید را تأیید می‌کند.'
  es.a1.unit07.lesson04.teach.gracias_vendedor:
    title: تشکر از فروشنده
    gloss: عالیه، ممنون.
    note: پایانی کوتاه و طبیعی برای یک خرید.
  es.a1.unit07.lesson05.teach.etiquetas_reading:
    title: خواندن برچسب قیمت
    gloss: 'غرفهٔ رزا: گوجه‌فرنگی، کیلویی دو. تخم‌مرغ، دوجینی چهار. نان، شش. میوهٔ تازه هر روز.'
    note: 'برچسب قیمت معمول غرفه‌های بازار: اول کالا، بعد قیمت، بعد واحدی که قیمت برای آن است (*el kilo*، *la docena*). *Puesto* یعنی غرفهٔ بازار؛ این یکی را رزا می‌گرداند.'
    glosses:
      Puesto: غرفه
      tomates: گوجه‌فرنگی‌ها
      kilo: کیلو
      Huevos: تخم‌مرغ‌ها
      docena: دوجین
      Pan: نان
      Fruta: میوه
      fresca: تازه
      todos: هر
      días: روزها
  es.a1.unit07.lesson05.teach.el_kilo_note:
    title: El kilo به معنی «کیلویی»
    gloss: اینکه واژهٔ واحد بعد از قیمت یعنی «به ازای» همان واحد.
    note: متن خود کارت را ببینید.
    target_text: '*El kilo* بعد از قیمت ("tomates, dos el kilo") یعنی «کیلویی»؛ قیمت برای هر کیلویی است که می‌خرید.'
  es.a1.unit07.lesson06.teach.line01:
    title: پیشنهاد رفتن به بازار
    gloss: النا پیشنهاد می‌کند برای تهیهٔ مواد کلاس بعدی به بازار بروند.
    note: '*Para la próxima clase* یعنی «برای کلاس بعدی»، یعنی جلسهٔ بعدی کارگاه آشپزی.'
  es.a1.unit07.lesson06.teach.line02:
    title: موافقت و پرسیدن اینکه چه چیزی لازم است
    gloss: Mateo موافقت می‌کند و می‌پرسد چه چیزهایی لازم دارند.
    note: '*¿Qué necesitamos?* صورت *nosotros* («ما») از فعل *necesitar* است و یعنی «چه چیزهایی لازم داریم؟».'
  es.a1.unit07.lesson06.teach.line03:
    title: اشاره به گوجه‌فرنگی‌های تازه
    gloss: Elena می‌گوید اول سبزی، و به تازگی گوجه‌فرنگی‌ها اشاره می‌کند.
    note: '*¡Qué tomates tan frescos!* (چه گوجه‌فرنگی‌های تازه‌ای!) جملهٔ تعجبی با *qué* است، مثل *¡Qué bonito!* در واحد ۳، اما این بار با اسم: *qué* + اسم + *tan* + صفت.'
  es.a1.unit07.lesson06.teach.line04:
    title: فروشنده مقدار را می‌پرسد
    gloss: فروشنده از Elena می‌پرسد چقدر می‌خواهد.
    note: '*Señorita* روشی مؤدبانه برای خطاب به یک خانم جوان است و با لحن *usted* فروشنده نسبت به مشتری جور است (امروزه بعضی‌ها آن را کمی قدیمی می‌دانند).'
  es.a1.unit07.lesson06.teach.line05:
    title: سفارش یک کیلو و پرسیدن قیمت
    gloss: Elena یک کیلو می‌خواهد و قیمتش را می‌پرسد.
    note: '*un kilo* را با *¿Cuánto cuesta?* که پیش‌تر در این واحد آمد، در یک گفتگوی طبیعی کنار هم می‌آورد.'
  es.a1.unit07.lesson06.teach.line06:
    title: گفتن قیمت
    gloss: فروشنده می‌گوید قیمتش دو است.
    note: '*Cuesta dos* -- پاسخ کوتاه دربارهٔ قیمت؛ واحد پول از موقعیت معلوم است.'
  es.a1.unit07.lesson06.teach.line07:
    title: Mateo تخم‌مرغ و نان سفارش می‌دهد
    gloss: Mateo می‌گوید یک دوجین تخم‌مرغ و نان لازم دارد.
    note: '*huevos*/*pan* را با *una docena de* که پیش‌تر در این واحد آمد ترکیب می‌کند؛ *yo* اختیاری است و کمی تأکید اضافه می‌کند («من لازم دارم...»).'
  es.a1.unit07.lesson06.teach.line08:
    title: فروشنده قیمت هر دو را می‌گوید
    gloss: فروشنده می‌گوید تخم‌مرغ‌ها چهار و نان شش است.
    note: '*Cuestan* (جمع) با فاعل جمع *los huevos* مطابقت دارد و با *cuesta* مفرد که برای گوجه‌فرنگی‌ها آمد فرق می‌کند.'
  es.a1.unit07.lesson06.teach.line09:
    title: تشکر از فروشنده
    gloss: Mateo می‌گوید عالی است، ممنون.
    note: همان جملهٔ پایانی کوتاهی که پیش‌تر در این واحد آمد.
  es.a1.unit07.lesson06.teach.line10:
    title: پرسیدن از دوست که چیز دیگری لازم دارد یا نه
    gloss: Elena از Mateo می‌پرسد چیز دیگری لازم دارد یا نه.
    note: '*¿Necesitas...?* صورت *tú* است و برای دوست به کار می‌رود؛ *¿Necesita...?* فروشنده صورت *usted* است.'
  es.a1.unit07.lesson06.teach.line11:
    title: گفتن اینکه همه‌چیز را دارید
    gloss: Mateo می‌گوید نه، فکر می‌کند همه‌چیز را از قبل دارند.
    note: '*Creo que* (فکر می‌کنم که) پاسخ را نرم‌تر می‌کند؛ *ya* یعنی «از قبل».'
