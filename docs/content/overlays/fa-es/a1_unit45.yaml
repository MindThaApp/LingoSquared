teaching:
  es.a1.unit45.lesson01.teach.cuanto_cuesta_en:
    title: پرسیدن قیمت کل
    gloss: در مجموع چقدر می‌شود؟
    note: عبارت *En total* مشخص می‌کند که قیمت کل را می‌خواهید، نه قیمت یک مورد را.
  es.a1.unit45.lesson01.teach.cuesta_veinticinco_euros:
    title: گفتن قیمت کل
    gloss: در مجموع بیست‌وپنج یورو می‌شود.
    note: '*Cuesta* سوم شخص مفرد فعل *costar* (قیمت داشتن) است؛ وقتی تکیه روی مصوت ریشه می‌افتد، *o* به *ue* تبدیل می‌شود.'
  es.a1.unit45.lesson02.teach.pagar_con_tarjeta:
    title: پرداخت با کارت یا نقدی
    gloss: با کارت پرداخت کردن، نقدی پرداخت کردن
    note: 'در *Pagar con tarjeta* (با کارت پرداخت کردن) و *pagar en efectivo* (نقدی پرداخت کردن) حرف اضافه فرق می‌کند: *con* برای وسیله و *en* برای شکل پول.'
    example_gloss:
    - می‌شود اینجا با کارت پرداخت کنم؟
    - نقدی پرداخت می‌کنم.
  es.a1.unit45.lesson02.teach.puedo_pagar_con:
    title: پرسیدن امکان پرداخت با کارت
    gloss: می‌شود اینجا با کارت پرداخت کنم؟
    note: '*Puedo* (می‌توانم) صورت *yo* فعل *poder* است؛ *aquí* (اینجا) سؤال را به همین مکان مربوط می‌کند.'
  es.a1.unit45.lesson02.teach.quiere_pagar_en:
    title: پرسیدن درباره روش پرداخت
    gloss: می‌خواهید نقدی پرداخت کنید یا با کارت؟
    note: '*Quiere* صورت محترمانه *usted* از فعل *querer* است که صندوق‌دارِ غریبه این‌جا به کار می‌برد؛ با دوست می‌گویید *¿quieres pagar...?*'
  es.a1.unit45.lesson03.teach.la_cuenta:
    title: صورت‌حساب
    gloss: صورت‌حساب
    note: 'اسم مؤنث: *la cuenta*. در رستوران یعنی صورت‌حساب و در بانک یعنی حساب.'
    example_gloss: صورت‌حساب را تقسیم کنیم؟
  es.a1.unit45.lesson03.teach.dividimos_la_cuenta:
    title: پیشنهاد تقسیم صورت‌حساب
    gloss: صورت‌حساب را تقسیم کنیم؟
    note: '*¿Dividimos...?* برای پیشنهاد دادن از صورت *nosotros* (ما) استفاده می‌کند؛ در فارسی هم برای پیشنهاد می‌گوییم «... کنیم؟».'
  es.a1.unit45.lesson03.teach.puedo_pagar_por:
    title: درخواست پرداخت جداگانه
    gloss: می‌شود جداگانه پرداخت کنم؟
    note: '*Por separado* (جداگانه) نحوه پرداخت را می‌گوید؛ *pagar* (پرداخت کردن) فعل رایج برای آن است.'
  es.a1.unit45.lesson04.teach.el_cambio:
    title: باقی‌مانده پول
    gloss: باقی‌مانده پول
    note: 'اسم مذکر: *el cambio*. به معنی تغییر هر چیزی هم هست، مثل *un cambio de planes*.'
    example_gloss: بفرمایید، این هم باقی‌مانده پولتان.
  es.a1.unit45.lesson04.teach.aqui_tiene_su:
    title: دادن باقی‌مانده پول
    gloss: بفرمایید، این هم باقی‌مانده پولتان.
    note: '*Su* صفت ملکیِ هماهنگ با *usted* رسمی است («شما»)؛ *Aquí tiene* روش مؤدبانه و رایج برای دادن چیزی به کسی است.'
  es.a1.unit45.lesson04.teach.no_necesito_cambio:
    title: نپذیرفتن باقی‌مانده پول
    gloss: باقی‌مانده پول را لازم ندارم.
    note: '*Necesitar* (نیاز داشتن) مفعولش را بدون حرف اضافه می‌گیرد: *necesito cambio*؛ *no* فعل را منفی می‌کند.'
  es.a1.unit45.lesson05.teach.treinta_y_cinco:
    title: سی‌وپنج
    gloss: سی‌وپنج
    note: '*Treinta y cinco* (سی‌وپنج): در اسپانیایی از ۳۱ تا ۹۹ دهگان و یکان با *y* به هم وصل می‌شوند و جدا از هم نوشته می‌شوند؛ در فارسی هم میان آن‌ها «و» می‌آید، اما سرهم نوشته می‌شوند.'
    example_gloss: سی‌وپنج یورو قیمت دارد.
  es.a1.unit45.lesson05.teach.cuenta_dos_platos:
    title: خواندن صورت‌حساب رستوران
    gloss: 'صورت‌حساب: دو غذای اصلی و دو قهوه. مجموع: سی‌وپنج یورو. پرداخت با کارت.'
    note: به این توجه کنید که چه چیزی سفارش داده شده، مجموع چقدر است و چطور پرداخت شده است.
    glosses:
      Cuenta: صورت‌حساب
      dos: دو
      platos: غذاهای اصلی
      cafés: قهوه‌ها
      Total: مجموع
      treinta: سی‌وپنج
      euros: یورو
      Pagado: پرداخت‌شده
      tarjeta: کارت
  es.a1.unit45.lesson06.teach.elena_pedimos_la:
    title: النا صورت‌حساب را می‌خواهد
    gloss: 'النا: صورت‌حساب را بخواهیم؟'
    note: '*Pedir* (خواستن، سفارش دادن) *la cuenta* را مفعول مستقیم می‌گیرد: *pedimos la cuenta* (صورت‌حساب را می‌خواهیم).'
  es.a1.unit45.lesson06.teach.mateo_si_buena:
    title: ماتئو قیمت کل را می‌پرسد
    gloss: 'ماتئو: آره، فکر خوبی است. در مجموع چقدر می‌شود؟'
    note: سؤال *¿cuánto cuesta en total?* از درس اول دوباره آمده است.
  es.a1.unit45.lesson06.teach.elena_son_treinta:
    title: النا قیمت کل را می‌گوید
    gloss: 'النا: سی‌وپنج یورو می‌شود. تقسیمش کنیم؟'
    note: 'برای مبلغ پول از *Son* استفاده می‌شود: *son treinta y cinco euros* فعل جمع می‌گیرد، چون مبلغ جمع است.'
  es.a1.unit45.lesson06.teach.mateo_no_deja:
    title: ماتئو اصرار می‌کند خودش پرداخت کند
    gloss: 'ماتئو: نه، بگذار امروز من حساب کنم. خیلی کمکم کرده‌ای.'
    note: '*Deja que pague yo* (بگذار من پرداخت کنم) بعد از *que* از وجه التزامی *pague* استفاده می‌کند؛ فعلاً آن را مثل یک عبارت ثابت برای پیشنهاد یاد بگیرید. *Me has ayudado* ماضی نقلی است (به من کمک کرده‌ای).'
  es.a1.unit45.lesson06.teach.elena_que_amable:
    title: النا تحت تأثیر قرار می‌گیرد
    gloss: 'النا: چقدر لطف داری! خیلی ممنون.'
    note: '*¡Qué amable eres!* (یعنی «چقدر مهربونی!») با *qué* + صفت، واکنشی گرم به یک کار بزرگوارانه نشون می‌ده؛ *muchas gracias* از *ممنون* قوی‌تره.'
  es.a1.unit45.lesson06.teach.mateo_puedo_pagar:
    title: ماتئو درباره پرداخت با کارت می‌پرسد
    gloss: 'ماتئو: می‌شود اینجا با کارت پرداخت کنم؟'
    note: سؤال *¿puedo pagar con tarjeta aquí?* از درس دوم دوباره آمده است، این بار در خود رستوران.
  es.a1.unit45.lesson06.teach.mateo_paga_la:
    title: 'Paga: صورت سوم شخص مفرد'
    gloss: ماتئو صورت‌حساب را پرداخت می‌کند.
    note: '*Paga* سوم شخص مفرد فعل *pagar* (پرداخت کردن) است: *Mateo paga la cuenta*.'
