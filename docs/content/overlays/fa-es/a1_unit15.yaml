teaching:
  es.a1.unit15.lesson01.teach.mas_que:
    title: بیشتر...از
    gloss: بیشتر...از
    note: '*Más...que* دو مقدار یا چیز متفاوت را مقایسه می‌کند؛ کادر توضیح دستور زیر را ببینید.'
    example_gloss: آپارتمان جدید از آپارتمان قدیمی بزرگ‌تر است.
  es.a1.unit15.lesson01.teach.menos_que:
    title: کمتر...از
    gloss: کمتر...از
    note: '*Menos...que* برعکس *más...que* است.'
    example_gloss: آپارتمان قدیمی به بزرگی آپارتمان جدید نیست.
  es.a1.unit15.lesson01.teach.tan_como:
    title: به اندازهٔ...
    gloss: به اندازهٔ... / مثل...
    note: '*Tan...como* دو چیز «برابر» را مقایسه می‌کند؛ ساختاری واقعاً جدا از *más/menos* است، نه راه دیگری برای گفتن همان معنی.'
    example_gloss: ماتئو به خوبی النا آشپزی می‌کند.
  es.a1.unit15.lesson01.teach.mas_menos_tan_note:
    title: نابرابری و برابری
    gloss: تفاوت بین más/menos...que و tan...como.
    note: متن خود کارت را ببینید.
    target_text: '*Más...que* (بیشتر...از) و *menos...que* (کمتر...از) دو چیز یا مقدار «متفاوت» را مقایسه می‌کنند. *Tan...como* (به اندازهٔ...) دو چیز «برابر» را مقایسه می‌کند؛ ساختاری جدا است، نه فقط مترادف *más/menos*.'
  es.a1.unit15.lesson02.teach.el_nuevo_es_mas_grande:
    title: مقایسهٔ آپارتمان جدید
    gloss: آپارتمان جدید از آپارتمان قدیمی بزرگ‌تر است.
    note: '*Más grande que* (بزرگ‌تر از) صفت *grande* (بزرگ) را در الگوی *más...que* می‌گذارد.'
  es.a1.unit15.lesson02.teach.el_viejo_es_mas_pequeno:
    title: مقایسهٔ آپارتمان قدیمی
    gloss: آپارتمان قدیمی از آپارتمان جدید کوچک‌تر است.
    note: '*Más pequeño que* (کوچک‌تر از) از *pequeño* (کوچک) استفاده می‌کند و مقایسه را از جهت مخالف بیان می‌کند.'
  es.a1.unit15.lesson03.teach.cual_apartamento_es_mas_grande:
    title: پرسیدن اینکه کدام بزرگ‌تر است
    gloss: کدام آپارتمان بزرگ‌تر است؟
    note: '*¿Cuál...?* (کدام...؟) + صفت تفضیلی روش معمول برای پرسیدن یک مقایسه است.'
  es.a1.unit15.lesson03.teach.el_nuevo_es_mas_grande_reply:
    title: جواب دادن اینکه کدام بزرگ‌تر است
    gloss: جدیده از قدیمیه بزرگ‌تر است.
    note: همان مقایسه، این بار به‌عنوان پاسخ مستقیم به سؤال *¿cuál...?*؛ در *el nuevo* (جدیده) اسم تکراری حذف شده است.
  es.a1.unit15.lesson04.teach.mateo_cocina_tan_bien_como_elena:
    title: مقایسهٔ برابر مهارت آشپزی
    gloss: ماتئو به خوبی النا آشپزی می‌کند.
    note: '*Tan bien como* (به خوبیِ) از الگوی *tan* + قید + *como* ساخته می‌شود؛ یعنی همان الگوی برابری، اما این بار برای شیوهٔ انجام یک فعل، نه اندازهٔ یک اسم.'
  es.a1.unit15.lesson04.teach.somos_un_buen_equipo:
    title: بگویید ما تیم خوبی هستیم
    gloss: ما تیم خوبی هستیم.
    note: '*Somos* (ما هستیم) + *un buen equipo* (یک تیم خوب) جملهٔ پایانیِ طبیعی بعد از یک مقایسهٔ برابری است.'
  es.a1.unit15.lesson05.teach.comparacion_reading:
    title: مقایسهٔ دو آپارتمان
    gloss: آپارتمان قدیمیِ ماتئو آشپزخانهٔ کوچکی دارد. آپارتمان جدید بزرگ‌تر است و آشپزخانه‌اش هم بزرگ‌تر است. آپارتمان قدیمی از جدید کوچک‌تر است و برای همین ماتئو می‌خواهد اسباب‌کشی کند. آپارتمان جدید جای بیشتری برای آشپزی دارد.
    note: خلاصه‌ای واقع‌گرایانه از مقایسهٔ دو آپارتمان.
    glosses:
      viejo: قدیمی
      tiene: دارد (از tener)
      pequeña: کوچک
      nuevo: جدید
      grande: بزرگ
      también: همچنین / هم
      pequeño: کوچک
      eso: که
      quiere: می‌خواهد (از querer)
      mudarse: اسباب‌کشی کردن
      espacio: فضا / جا
      cocinar: آشپزی کردن
  es.a1.unit15.lesson05.teach.por_eso_note:
    title: Por eso (برای همین)
    gloss: اینکه por eso چطور دلیل را به نتیجه وصل می‌کند.
    note: متن خودِ کارت را ببینید.
    target_text: '*Por eso* (برای همین / به همین دلیل) دلیل را به نتیجه‌اش وصل می‌کند؛ کوچک بودن آشپزخانه دلیل اسباب‌کشی ماتئو است، همان منطق علت و معلولی که در *porque* دیده‌اید.'
  es.a1.unit15.lesson06.teach.line01:
    title: بپرسید دیده یا نه
    gloss: النا می‌پرسد ماتئو آپارتمان جدید را دیده یا نه.
    note: '*¿Ya viste...?* (آیا قبلاً ... را دیدی؟) یک شکل پرسشیِ جدید در زمان گذشته است.'
  es.a1.unit15.lesson06.teach.line02:
    title: تأیید کنید که بزرگ‌تر است
    gloss: ماتئو تأیید می‌کند که آپارتمان جدید از قدیمی بزرگ‌تر است، با آشپزخانه‌اش.
    note: یک مقایسهٔ *más...que* که با *la cocina también* (آشپزخانه هم) گسترش یافته است.
  es.a1.unit15.lesson06.teach.line03:
    title: بپرسید کدام کوچک‌تر است
    gloss: النا می‌پرسد پس کدام آپارتمان کوچک‌تر است.
    note: '*Entonces* (پس) یک حرف ربط منطقی است که قبلاً دیده‌اید؛ سؤال همان الگوی *¿Cuál...?* است، این بار با *pequeño* به جای *grande*.'
  es.a1.unit15.lesson06.teach.line04:
    title: جواب بدهید و توضیح بدهید
    gloss: ماتئو می‌گوید آپارتمان قدیمی کوچک‌تر است و برای همین می‌خواهد اسباب‌کشی کند.
    note: '*El viejo es más pequeño que el nuevo* به اضافهٔ *por eso quiero mudarme* (برای همین می‌خواهم اسباب‌کشی کنم).'
  es.a1.unit15.lesson06.teach.line05:
    title: موافقت کنید که منطقی است
    gloss: النا می‌گوید منطقی است؛ آپارتمان جدید جای بیشتری برای آشپزی دارد.
    note: '*Tiene mucho sentido* (خیلی منطقی است) یک عبارت جدید برای موافقت است؛ *más espacio para cocinar* یعنی جای بیشتر برای آشپزی.'
  es.a1.unit15.lesson06.teach.line06:
    title: استدلال را ادامه بدهید
    gloss: ماتئو موافقت می‌کند و اضافه می‌کند که چون النا به خوبیِ خودش آشپزی می‌کند، برای هر دوی آن‌ها جا لازم است.
    note: '*Tan bien como* (به خوبیِ) این بار در گفتگو با *tú cocinas* (تو آشپزی می‌کنی) به کار رفته است.'
  es.a1.unit15.lesson06.teach.line07:
    title: تعریف را پس بدهید
    gloss: النا با شوق موافقت می‌کند و می‌گوید ماتئو هم به خوبی خودش آشپزی می‌کند.
    note: '*¡Es verdad!* (درست است!) + *tú cocinas tan bien como yo* (تو به خوبی من آشپزی می‌کنی) -- همان مقایسهٔ *tan bien como* که حالا دربارهٔ ماتئو گفته می‌شود.'
  es.a1.unit15.lesson06.teach.line08:
    title: با روحیهٔ تیمی تمام کنید
    gloss: ماتئو نتیجه می‌گیرد که آن‌ها تیم خوبی هستند.
    note: '*Somos un buen equipo* (ما تیم خوبی هستیم) گفتگو را به پایان می‌برد.'
