teaching:
  es.a1.unit51.lesson01.teach.el_billete:
    title: بلیت
    gloss: بلیت
    note: '*El billete* مذکر است، برای همین می‌گوییم *un billete* نه *una*.'
    example_gloss: یک بلیت برای تولدو می‌خواستم.
  es.a1.unit51.lesson01.teach.quisiera_un_billete:
    title: درخواست بلیت
    gloss: یک بلیت برای تولدو می‌خواستم.
    note: '*Quisiera* («می‌خواستم») درخواست را نرم‌تر می‌کند و مؤدبانه‌تر از *quiero* است.'
  es.a1.unit51.lesson01.teach.quiere_un_billete:
    title: مسئول می‌پرسد چه نوع بلیتی
    gloss: بلیت یک‌طرفه می‌خواهید یا رفت و برگشت؟
    note: '*Quiere* شکل رسمی *usted* از فعل *querer* است و اینجا برای کارمند ناآشنای ایستگاه به کار رفته است.'
  es.a1.unit51.lesson01.teach.ida_y_vuelta:
    title: جواب مؤدبانه دادن
    gloss: رفت و برگشت، لطفاً.
    note: '*Por favor* یعنی «لطفاً»؛ درخواست مؤدبانه و کوتاه می‌ماند.'
  es.a1.unit51.lesson01.teach.en_la_taquilla:
    title: سطح رسمی پشت باجه
    gloss: پشت باجه معمولاً از شکل مؤدبانه‌ی usted استفاده می‌کنند.
    note: با افراد ناآشنا که کار خدماتی انجام می‌دهند با *usted* صحبت می‌کنیم، نه *tú*.
  es.a1.unit51.lesson02.teach.el_anden:
    title: سکو
    gloss: سکوی قطار
    note: '*El andén* مذکر است: *un andén*، *el andén*.'
    example_gloss: قطار تولدو از کدام سکو حرکت می‌کنه؟
  es.a1.unit51.lesson02.teach.de_que_anden:
    title: پرسیدن شمارهٔ سکو
    gloss: قطار تولدو از کدام سکو حرکت می‌کنه؟
    note: '*¿De qué andén ...?* مشخصاً دربارهٔ سکو می‌پرسه، نه دربارهٔ یک مکان کلی.'
  es.a1.unit51.lesson02.teach.el_tren_sale:
    title: گفتن جزئیات حرکت
    gloss: قطار ساعت ده منهای یک ربع از سکوی پنج حرکت می‌کنه.
    note: '*Las diez menos cuarto* همان الگوی «منهای یک ربع» درس ساعت را دوباره به کار می‌بره.'
  es.a1.unit51.lesson02.teach.a_que_hora:
    title: پرسیدن ساعت رسیدن
    gloss: قطار چه ساعتی می‌رسه؟
    note: '*¿A qué hora llega ...?* دربارهٔ ساعت رسیدن می‌پرسه؛ فعل *llegar* باقاعده است و قبل از ساعت *a las* می‌گیره.'
  es.a1.unit51.lesson02.teach.el_tren_llega:
    title: گفتن ساعت رسیدن
    gloss: قطار ساعت یازده می‌رسه.
    note: '*Llega a las once* فعل *llegar* (رسیدن) را با *a las* قبل از ساعت به کار می‌بره.'
  es.a1.unit51.lesson03.teach.a_tiempo_el:
    title: سر وقت / تأخیر
    gloss: سر وقت؛ تأخیر
    note: '*A tiempo* عبارتی ثابت برای چیزیه که طبق برنامه انجام می‌شه. *El retraso* (تأخیر) مذکر است.'
    example_gloss:
    - قطار سر وقت حرکت نمی‌کنه.
    - 'توجه: قطار تولدو تأخیر داره.'
  es.a1.unit51.lesson03.teach.atencion_el_tren:
    title: یک اعلامیه
    gloss: 'توجه: قطار تولدو تأخیر داره.'
    note: '*Atención* اعلامیه‌های ایستگاه را شروع می‌کنه، مثل «توجه، مسافران محترم» در فارسی.'
  es.a1.unit51.lesson03.teach.el_tren_no:
    title: منفی کردن «سر وقت»
    gloss: قطار سر وقت حرکت نمی‌کنه.
    note: '*No* درست قبل از فعل می‌آید و کل جمله را منفی می‌کنه: *no sale a tiempo*.'
  es.a1.unit51.lesson03.teach.el_tren_sale:
    title: تغییر سکو
    gloss: قطار به جای سکوی پنج از سکوی سه حرکت می‌کنه.
    note: '*En lugar de* یعنی «به جای».'
  es.a1.unit51.lesson03.teach.el_tren_lleva:
    title: گفتن مدت تأخیر
    gloss: قطار ده دقیقه تأخیر داره.
    note: '*Lleva retraso* (تحت‌اللفظی «تأخیر با خودش می‌بره») روش طبیعی گفتن اینه که چیزی تأخیر داره.'
  es.a1.unit51.lesson04.teach.la_entrada_la:
    title: ورودی، خروجی، سالن انتظار
    gloss: ورودی؛ خروجی؛ سالن انتظار
    note: '*La entrada*، *la salida* و *la sala de espera* همه اسم مؤنث هستند.'
    example_gloss:
    - ورودی کجاست؟
    - خروجی کجاست؟
    - سالن انتظار کجاست؟
  es.a1.unit51.lesson04.teach.donde_esta_el:
    title: پرسیدن جای یک سکو
    gloss: سکوی هفت کجاست؟
    note: این جمله همان الگوی *¿Dónde está ...?* درس‌های مسیریابی را دوباره به کار می‌بره.
  es.a1.unit51.lesson04.teach.todo_recto_y:
    title: راه نشان دادن
    gloss: مستقیم برید و بعد به راست.
    note: '*Todo recto* و *a la derecha* عبارت‌های مسیریابی درس‌های قبلی هستند که اینجا در ایستگاه دوباره آمده‌اند.'
  es.a1.unit51.lesson04.teach.donde_esta_la:
    title: پرسیدن جای سالن انتظار
    gloss: سالن انتظار کجاست؟
    note: همان الگوی سؤال برای یک مکان تازه.
  es.a1.unit51.lesson05.teach.billete_madrid_atocha:
    title: خواندن یک بلیت چاپی
    gloss: 'بلیت: مادرید آتوچا به تولدو. حرکت: ده و ده دقیقه، سکوی هفت. رسیدن: ده دقیقه به یازده. رفت و برگشت. قیمت: دوازده یورو و چهل سنت.'
    note: به ساعت و سکوی حرکت، ساعت رسیدن، نوع بلیت و قیمت توجه کنید.
    glosses:
      Billete: بلیت
      Salida: حرکت
      diez: ده
      andén: سکو
      siete: هفت
      Llegada: رسیدن
      once: یازده
      vuelta: بلیت رفت و برگشت
      Precio: قیمت
      doce: دوازده
      euros: یورو
      cuarenta: چهل
  es.a1.unit51.lesson06.teach.mateo_tenemos_que:
    title: ماتئو برنامه را می‌گه
    gloss: 'ماتئو: باید بریم سکوی هفت. قطار ساعت ده و ده دقیقه حرکت می‌کنه.'
    note: '*Tenemos que* + مصدر («باید ... بکنیم») یک ضرورت عملی را بیان می‌کنه.'
  es.a1.unit51.lesson06.teach.elena_mira_ahi:
    title: النا تابلو را می‌خونه
    gloss: 'النا: ببین، اون تابلو اونجاست: تأخیر، ده دقیقه.'
    note: '*Ahí está* («اونجاست») تابلو را نشان می‌ده؛ *el panel* تابلوی اطلاعات است.'
  es.a1.unit51.lesson06.teach.mateo_no_hay:
    title: ماتئو آرامش خودش را حفظ می‌کنه
    gloss: 'ماتئو: مشکلی نیست، هنوز برای یه قهوه وقت داریم.'
    note: '*No hay problema* یک جملهٔ دلگرم‌کنندهٔ رایج و دوستانه است.'
  es.a1.unit51.lesson06.teach.elena_buena_idea:
    title: قطار می‌رسه
    gloss: 'النا: فکر خوبیه. آه، قطار اومد! سکوی هفت، دقیقاً!'
    note: '*Ya* («همین حالا، از قبل») نشان می‌ده قطار زودتر از انتظار، با وجود تأخیر اعلام‌شده، رسیده.'
  es.a1.unit51.lesson06.teach.mateo_vamos_que:
    title: سوار قطار می‌شن
    gloss: 'ماتئو: بریم، همه دارن سوار می‌شن! تولدو، اومدیم!'
    note: '*Suben* («سوار می‌شن») از فعل *subir* به معنی سوار شدن می‌آید؛ *¡Allá vamos!* روش طبیعی گفتن «اومدیم!» یا «بزن بریم!» است.'
