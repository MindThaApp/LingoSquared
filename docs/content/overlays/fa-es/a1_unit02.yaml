teaching:
  es.a1.unit02.lesson01.teach.cero:
    title: صفر
    gloss: صفر
    note: '*Cero* هم به‌عنوان خود عدد به کار می‌رود و هم هنگام خواندن دنبالهٔ ارقام به‌عنوان یک رقم.'
  es.a1.unit02.lesson01.teach.uno:
    title: یک
    gloss: یک
    note: '*Uno* پیش از اسم مذکر مفرد به *un* کوتاه می‌شود (*un huevo*، یک تخم‌مرغ) و پیش از اسم مؤنث می‌شود *una* (*una taza*، یک پیمانه). به‌تنهایی، مثلاً هنگام شمردن، همان *uno* می‌ماند.'
  es.a1.unit02.lesson01.teach.dos:
    title: دو
    gloss: دو
    note: '*Dos* بدون توجه به جنسیت اسم هیچ‌وقت تغییر نمی‌کند.'
  es.a1.unit02.lesson01.teach.tres:
    title: سه
    gloss: سه
    note: '*Tres* هم مثل *dos* تغییر نمی‌کند.'
  es.a1.unit02.lesson01.teach.cuatro:
    title: چهار
    gloss: چهار
    note: '*Cuatro* تغییر نمی‌کند.'
  es.a1.unit02.lesson01.teach.cinco:
    title: پنج
    gloss: پنج
    note: '*Cinco* تغییر نمی‌کند.'
  es.a1.unit02.lesson01.teach.seis:
    title: شش
    gloss: شش
    note: '*Seis* تغییر نمی‌کند.'
  es.a1.unit02.lesson01.teach.siete:
    title: هفت
    gloss: هفت
    note: '*Siete* تغییر نمی‌کند.'
  es.a1.unit02.lesson01.teach.ocho:
    title: هشت
    gloss: هشت
    note: '*Ocho* تغییر نمی‌کند.'
  es.a1.unit02.lesson01.teach.nueve:
    title: نه
    gloss: نه
    note: '*Nueve* تغییر نمی‌کند.'
  es.a1.unit02.lesson01.teach.diez:
    title: ده
    gloss: ده
    note: '*Diez* تغییر نمی‌کند.'
  es.a1.unit02.lesson02.teach.once:
    title: یازده
    gloss: یازده
    note: '*Once* تا *quince* (۱۱ تا ۱۵) هرکدام یک کلمهٔ مستقل‌اند و باید مجموعه‌وار یاد گرفته شوند؛ از شانزده تا نوزده عددها از *diez* ساخته می‌شوند (*dieciséis*، *diecisiete* ...).'
  es.a1.unit02.lesson02.teach.doce:
    title: دوازده
    gloss: دوازده
    note: '*Doce* یک کلمهٔ مستقل است؛ شبیه *dos* است ولی املای خودش را دارد.'
  es.a1.unit02.lesson02.teach.trece:
    title: سیزده
    gloss: سیزده
    note: '*Trece* یک کلمهٔ مستقل است؛ شبیه *tres* است ولی املای خودش را دارد.'
  es.a1.unit02.lesson02.teach.catorce:
    title: چهارده
    gloss: چهارده
    note: '*Catorce* یک کلمهٔ مستقل است؛ شبیه *cuatro* است ولی املای خودش را دارد.'
  es.a1.unit02.lesson02.teach.quince:
    title: پانزده
    gloss: پانزده
    note: '*Quince* آخرین عدد از این عددهای یک‌تکه است؛ از شانزده به بعد الگو عوض می‌شود.'
  es.a1.unit02.lesson02.teach.veinte:
    title: بیست
    gloss: بیست
    note: '*Veinte* کلمهٔ مستقلی است. از *veintiuno* (۲۱) تا بیست‌ونه، دهگان و یکان در یک کلمه به هم می‌چسبند؛ الگویی که در درس سوم دوباره با *veintiocho* می‌بینید.'
  es.a1.unit02.lesson02.teach.treinta:
    title: سی
    gloss: سی
    note: از سی به بعد، دهگان و یکان با *y* (و) به‌صورت سه کلمهٔ جدا به هم وصل می‌شوند و مثل بیست‌ها به هم نمی‌چسبند.
  es.a1.unit02.lesson02.teach.treinta_y_cuatro:
    title: سی‌وچهار
    gloss: سی‌وچهار
    note: '*Treinta y cuatro* در سه کلمهٔ جدا نوشته می‌شود: دهگان، *y* و یکان.'
  es.a1.unit02.lesson02.teach.cien:
    title: صد
    gloss: صد
    note: '*Cien* شکلی است که برای دقیقاً ۱۰۰ به‌تنهایی به کار می‌رود؛ وقتی عدد ادامه پیدا کند *ciento* می‌آید (*ciento uno*، ۱۰۱) که این واحد هنوز آن را یاد نمی‌دهد.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tienes:
    title: پرسیدن سن به‌صورت غیررسمی
    gloss: چند سالته؟
    note: اسپانیایی تحت‌اللفظی می‌پرسد «چند سال داری؟» و از *tener* (داشتن) استفاده می‌کند، نه از *ser* یا *estar*؛ در فارسی هم می‌گوییم «چند سال داری»، ولی در جواب می‌گوییم «سی سالمه».
  es.a1.unit02.lesson03.teach.tengo_veintiocho:
    title: گفتن سن
    gloss: بیست‌وهشت سالمه.
    note: '*Tengo* صورت اول‌شخص مفرد (yo) فعل *tener* است. جواب کامل معمولاً *años* (سال) دارد؛ وقتی موضوع صحبت سن باشد می‌شود آن را حذف کرد، مثل *Tengo treinta y uno*.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tiene_usted:
    title: پرسیدن سن به‌صورت رسمی
    gloss: چند سال دارید؟
    note: '*Tiene* صورت *usted* فعل *tener* است و با سطح رسمی که در درس اول دیدید جور است.'
  es.a1.unit02.lesson03.teach.tengo_treinta_y_uno:
    title: گفتنِ سنِ مرکب
    gloss: سی‌ویک سال دارم.
    note: '*Treinta y uno* در اینجا *uno* را نگه می‌دارد (نه *un*)، چون در این جواب بلافاصله بعد از آن اسمی نمی‌آید.'
  es.a1.unit02.lesson03.teach.y_tu_cuantos:
    title: برگرداندنِ سؤالِ سن
    gloss: تو چند سالته؟
    note: گفتنِ *Tienes* بدون تکرارِ *años* کوتاه‌کردنی طبیعی و رایج است، وقتی موضوع از قبل معلوم باشد.
  es.a1.unit02.lesson04.teach.cual_es_tu_numero:
    title: پرسیدنِ شماره تلفن
    gloss: شماره تلفنت چنده؟
    note: وقتی از کسی می‌خواهید یک مورد مشخص، مثل شماره تلفن، را از میان چند امکان بگوید، *cuál* طبیعی است، نه *qué*.
  es.a1.unit02.lesson04.teach.numero_elena:
    title: شماره‌ای که رقم‌به‌رقم خوانده می‌شود
    gloss: شش، یک، پنج، صفر، دو، نه، هفت، سه
    note: شماره تلفن را می‌شود رقم‌به‌رقم خواند، مثل اینجا. خیلی از اسپانیایی‌زبان‌ها رقم‌ها را دوتادوتا هم می‌خوانند، پس به هر دو سبک گوش بدهید.
  es.a1.unit02.lesson04.teach.es_el:
    title: شروعِ گفتنِ شماره
    gloss: شمارهٔ من ...
    note: '*El* (حرف تعریفِ مذکر) آمده چون *número* اسمِ مذکر است.'
  es.a1.unit02.lesson04.teach.puedes_repetir:
    title: درخواستِ تکرار
    gloss: لطفاً می‌شه تکرار کنی؟
    note: '*Puedes* صورتِ *tú* از فعلِ *poder* (توانستن) است و وقتی شماره‌ای زود گفته می‌شود و نفهمیدید، به کار می‌آید.'
  es.a1.unit02.lesson04.teach.claro:
    title: قبول‌کردنِ سریع
    gloss: حتماً؛ البته
    note: '*Claro* راهی رایج و دوستانه برای موافقت با یک درخواست است.'
  es.a1.unit02.lesson05.teach.necesito_tres_huevos:
    title: گفتنِ مقدارِ موردنیاز
    gloss: سه تا تخم‌مرغ لازم دارم.
    note: '*Necesito* صورتِ yo از فعلِ *necesitar* (نیاز داشتن) است. *Huevos* (تخم‌مرغ‌ها) بعد از هر عددِ بیشتر از یک جمع می‌ماند.'
  es.a1.unit02.lesson05.teach.cuantos_huevos_necesitas:
    title: پرسیدن از تعدادِ موردنیاز
    gloss: چند تا تخم‌مرغ لازم داری؟
    note: '*Cuántos* از نظر جنس و شمار با اسمی که درباره‌اش می‌پرسد هماهنگ می‌شود؛ *huevos* مذکرِ جمع است، پس *cuántos* می‌آید، نه *cuántas*.'
  es.a1.unit02.lesson05.teach.dos_tazas_harina:
    title: گفتنِ مقدارِ اندازه‌گیری‌شده
    gloss: دو پیمانه آرد
    note: '*De* واحدِ اندازه‌گیری (*tazas*، پیمانه) را به چیزی که اندازه گرفته می‌شود (*harina*، آرد) وصل می‌کند. در فارسی این رابطه بدون حرفِ اضافه بیان می‌شود: «دو پیمانه آرد».'
  es.a1.unit02.lesson05.teach.media_taza:
    title: گفتنِ نیم‌مقدار
    gloss: نصفِ یک پیمانه شکر
    note: '*Media* با اسمِ مؤنثِ *taza* هماهنگ است؛ صورتِ مذکرِ *medio* با اسم‌های مذکر می‌آید.'
  es.a1.unit02.lesson05.teach.tengo_cuatro_huevos:
    title: گفتنِ آنچه در دست داری
    gloss: چهار تا تخم‌مرغ روی میز دارم.
    note: '*Tengo* (دارم) از چیزی خبر می‌دهد که از قبل در دسترس است؛ با *necesito* (لازم دارم) که از چیزِ کم‌وکسری خبر می‌دهد فرق دارد.'
  es.a1.unit02.lesson06.teach.line01:
    title: پرسیدن از تعدادِ تخم‌مرغ
    gloss: النا از ماتئو می‌پرسد برای دستور پخت چند تا تخم‌مرغ لازم دارد.
    note: ادامهٔ لحنِ *tú* درس یک، بین این دو هم‌سن‌وسال.
  es.a1.unit02.lesson06.teach.line02:
    title: گفتنِ مواد
    gloss: ماتئو می‌گوید سه تا تخم‌مرغ و دو پیمانه آرد لازم دارد.
    note: '*Necesito* چیزی را می‌گوید که هنوز برای دستور پخت لازم است.'
  es.a1.unit02.lesson06.teach.line03:
    title: پیشنهادِ آنچه در دست است
    gloss: النا می‌گوید چهار تا تخم‌مرغ روی میز دارد و می‌پرسد شکر هم لازم دارد یا نه.
    note: '*Tengo* از چیزی خبر می‌دهد که النا از قبل دارد، جدا از آنچه ماتئو گفت لازم دارد.'
  es.a1.unit02.lesson06.teach.line04:
    title: تأییدِ مقدارِ کم
    gloss: ماتئو می‌گوید بله، کمی؛ حدود نیم پیمانه.
    note: '*Como* در اینجا یعنی «حدود» یا «تقریباً»، نه معنای رایج‌ترش یعنی «مثل» یا «به‌عنوان».'
  es.a1.unit02.lesson06.teach.line05:
    title: پرسیدن از شماره تلفن
    gloss: النا می‌گوید عالی، بعد شماره تلفن ماتئو را می‌خواهد تا برای کلاس بعدی بهش پیام بدهد.
    note: '*Así te escribo* («که بهت پیام بدم») دلیلِ پرسیدن را می‌گوید؛ عادتی طبیعی در گفتگو پیش از خواستنِ اطلاعاتِ تماس.'
  es.a1.unit02.lesson06.teach.line06:
    title: گفتنِ شماره تلفن
    gloss: ماتئو شمارهٔ خودش را رقم‌به‌رقم می‌گوید.
    note: '*Es el* شماره را معرفی می‌کند و با اسمِ مذکرِ *número* هماهنگ است.'
  es.a1.unit02.lesson06.teach.line07:
    title: تشکر و پرسیدنِ سن
    gloss: 'النا تشکر می‌کند و یک سؤالِ دیگر می‌پرسد: ماتئو چند سال دارد.'
    note: '*Una pregunta más* («یک سؤال دیگر») تغییرِ طبیعیِ موضوع در همان گفتگو را نشان می‌دهد.'
  es.a1.unit02.lesson06.teach.line08:
    title: گفتنِ سنِ ماتئو
    gloss: ماتئو می‌گوید بیست‌وهشت سال دارد و همین سؤال را از النا می‌پرسد.
    note: '*Tengo veintiocho años* از صورتِ یک‌تکه‌شدهٔ اعدادِ بیست استفاده می‌کند، مطابق الگوی همین درس.'
  es.a1.unit02.lesson06.teach.line09:
    title: گفتنِ سنِ النا
    gloss: النا می‌گوید سی‌ویک سال دارد.
    note: '*Tengo treinta y uno* کلمهٔ *años* را نمی‌آورد، چون موضوع (سن) از موقعیت روشن است؛ کوتاه‌کردنی طبیعی، مطابق الگوی برگرداندنِ سؤال بدون تکرارِ *años*.'
