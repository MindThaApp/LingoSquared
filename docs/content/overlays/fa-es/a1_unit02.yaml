course:
  title: اسپانیایی A1
  description: اعداد ۰ تا ۱۰۰، سن، شمارهٔ تلفن و مقدار مواد غذایی در دستور پخت؛ در ادامهٔ ماجرای النا و ماتئو در کارگاه آشپزی درس اول. نکته‌های ویژه به بیان سن با tener و مطابقت جنسیت در عبارت‌های مقدار می‌پردازند.
