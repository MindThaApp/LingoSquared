teaching:
  es.a1.unit10.lesson01.teach.el_tiempo:
    title: آب‌وهوا
    gloss: آب‌وهوا
    note: '*Tiempo* به معنی «زمان» هم هست؛ معنی را از متن می‌فهمید.'
    example_gloss: امروز هوا چطور است؟
  es.a1.unit10.lesson01.teach.el_sol:
    title: خورشید
    gloss: خورشید
    note: '*Sol* مذکر است.'
    example_gloss: امروز هوا خیلی آفتابی است.
  es.a1.unit10.lesson01.teach.la_lluvia:
    title: باران
    gloss: باران
    note: '*Lluvia* مؤنث است.'
    example_gloss: من باران را دوست ندارم.
  es.a1.unit10.lesson01.teach.el_viento:
    title: باد
    gloss: باد
    note: '*Viento* مذکر است.'
    example_gloss: امروز خیلی باد می‌آید.
  es.a1.unit10.lesson01.teach.la_nube:
    title: ابر
    gloss: ابر
    note: '*Nube* مؤنث است.'
    example_gloss: حتی یک ابر هم نیست.
  es.a1.unit10.lesson02.teach.hace_calor:
    title: هوا گرم است
    gloss: هوا گرم است.
    note: '*Hace calor* (لفظاً «گرما می‌سازد») اصطلاح رایج برای گفتن گرمی هواست.'
    example_gloss: در ژوئیه هوا خیلی گرم است.
  es.a1.unit10.lesson02.teach.hace_frio:
    title: هوا سرد است
    gloss: هوا سرد است.
    note: '*Hace frío* هم مثل *hace calor* از الگوی *hace* + اسم پیروی می‌کند.'
    example_gloss: در دسامبر هوا سرد است.
  es.a1.unit10.lesson02.teach.hace_sol:
    title: هوا آفتابی است
    gloss: هوا آفتابی است.
    note: در *Hace sol* همان الگوی ثابتِ hace با *el sol* (خورشید) به کار رفته است.
  es.a1.unit10.lesson02.teach.llueve:
    title: باران می‌آید
    gloss: باران می‌آید.
    note: '*Llueve* صورت خاصِ خودِ فعل است (از *llover*، یعنی باران آمدن) و از الگوی *hace* پیروی نمی‌کند؛ به نکتهٔ دستوری بعدی نگاه کنید.'
  es.a1.unit10.lesson02.teach.esta_nublado:
    title: هوا ابری است
    gloss: هوا ابری است.
    note: '*Está nublado* از *estar* + صفت ساخته شده است؛ این سومین الگوی متفاوت برای توصیف هواست.'
  es.a1.unit10.lesson02.teach.hace_vs_esta_note:
    title: 'Hace، llueve، está: سه الگو'
    gloss: سه الگوی دستوری متفاوت برای توصیف آب‌وهوا.
    note: به متن خودِ کارت نگاه کنید.
    target_text: 'عبارت‌های آب‌وهوایی با *hace* (hace calor، hace frío، hace sol) یک اصطلاح ثابت‌اند و لفظاً یعنی «گرما/سرما/آفتاب می‌سازد». *Llueve* (باران می‌آید) خودش یک صیغهٔ فعل است و *está nublado* (هوا ابری است) از *estar* + صفت ساخته می‌شود؛ یعنی سه الگوی مختلف برای یک منظور: توصیف آب‌وهوا.'
  es.a1.unit10.lesson03.teach.que_tiempo_hace_hoy:
    title: پرسیدن دربارهٔ هوا
    gloss: امروز هوا چطوره؟
    note: '*¿Qué tiempo hace hoy?* روش معمول برای پرسیدن دربارهٔ هوای حالاست و در آن از *el tiempo* (آب‌وهوا) استفاده شده است.'
  es.a1.unit10.lesson03.teach.hace_mucho_calor_y_sol:
    title: توصیف هوای گرم و آفتابی
    gloss: هوا خیلی گرم و آفتابیه.
    note: دو عبارت *hace* با *y* (و) به هم وصل شده‌اند.
  es.a1.unit10.lesson03.teach.hace_calor_pero_hay_viento:
    title: توصیف هوای گرم و بادی
    gloss: هوا گرمه، ولی باد میاد.
    note: '*Pero* (ولی) دو وضعیت هوا را در برابر هم می‌گذارد: گرما و باد. برای باد از *hay* + اسم استفاده می‌شود، مثل *hay mucho viento*.'
  es.a1.unit10.lesson04.teach.en_invierno_hace_frio_en_madrid:
    title: صحبت دربارهٔ زمستان مادرید
    gloss: زمستان در مادرید هوا خیلی سرده.
    note: '*En invierno* (در زمستان) یک فصل را معرفی می‌کند؛ در ادامه با *en julio* مقایسه می‌شود.'
  es.a1.unit10.lesson04.teach.en_julio_hace_demasiado_calor:
    title: صحبت دربارهٔ گرمای ژوئیه
    gloss: در ژوئیه هوا زیادی گرمه.
    note: '*Demasiado* (بیش‌ازحد) شدتِ *calor* را از *mucho* (خیلی) ساده بیشتر می‌کند.'
  es.a1.unit10.lesson04.teach.necesitamos_agua:
    title: توضیح دادن دلیل نیاز به آب
    gloss: ما آب لازم داریم چون هوا گرمه.
    note: '*Porque* (چون) یک نیاز را به دلیل آب‌وهوایی‌اش وصل می‌کند؛ جمله‌ای کاربردی برای کلاس آشپزی.'
  es.a1.unit10.lesson05.teach.pronostico_reading:
    title: خواندن پیش‌بینی هوا
    gloss: امروز، ۲۲ ژوئیه، هوا خیلی گرم و آفتابیه. حتی یک ابر هم نیست. یک کم هم باد میاد. روز خوبیه برای رفتن به کارگاه آشپزی، ولی مهمه که آب با خودتون ببرید.
    note: پیش‌بینی کوتاهی برای ۲۲ ژوئیه، روز کلاس آشپزی.
    glosses:
      Hoy: امروز
      veintidós: بیست‌ودوم
      julio: ژوئیه
      hace: هست / هوا ... است (از hacer)
      calor: هوای گرم / گرما
      sol: آفتابی / خورشید
      hay: هست (از haber)
      nube: ابر
      También: همچنین
      poco: کم
      viento: باد
      buen: خوب
      día: روز
      ir: رفتن
      taller: کارگاه
      cocina: آشپزی
      importante: مهم
      llevar: بردن / آوردن
      agua: آب
  es.a1.unit10.lesson05.teach.un_poco_de_note:
    title: Un poco de (یک کم)
    gloss: نحوهٔ بیان مقدار کم با un poco de.
    note: به متن خودِ کارت نگاه کنید.
    target_text: '*Un poco de* (کمی) برای مقدار خوراکی‌ها هم به کار می‌رود و اینجا مقدار کمی باد را توصیف می‌کند؛ همان الگو با اسمی تازه.'
  es.a1.unit10.lesson06.teach.line01:
    title: اظهار نظر دربارهٔ گرما
    gloss: النا می‌گوید امروز هوا چقدر گرمه.
    note: '*¡Qué calor hace hoy!* (امروز چه گرمایی است! / امروز چقدر گرمه!) کاربرد تعجبی الگوی *hace calor* است.'
  es.a1.unit10.lesson06.teach.line02:
    title: موافقت و افزودن توضیح
    gloss: ماتئو موافقت می‌کند و می‌گوید حتی یک ابر هم نیست.
    note: '*hace mucho calor y hace sol* با *no hay ni una nube* ترکیب شده است.'
  es.a1.unit10.lesson06.teach.line03:
    title: پیشنهاد بردن آب
    gloss: النا می‌گوید برای راه آب لازم دارند.
    note: '*El camino* (راه) به مسیر پیاده‌رویِ آن‌ها تا کارگاه اشاره دارد.'
  es.a1.unit10.lesson06.teach.line04:
    title: موافقت و اشاره به یک مغازه
    gloss: ماتئو موافقت می‌کند و می‌گوید یک مغازه همین نزدیکی هست.
    note: '*Cerca de aquí* (نزدیک اینجا) از عبارت مکانی *cerca de* (نزدیکِ) ساخته شده است.'
  es.a1.unit10.lesson06.teach.line05:
    title: مقایسهٔ زمستان و تابستان
    gloss: النا زمستان‌های سرد مادرید را با گرمای زیادِ امروزِ ژوئیه مقایسه می‌کند.
    note: دو جملهٔ فصلی *en invierno hace mucho frío* و *en julio hace demasiado calor* با هم ترکیب شده‌اند.
  es.a1.unit10.lesson06.teach.line06:
    title: بیان ترجیح
    gloss: ماتئو می‌گوید گرما را ترجیح می‌دهد؛ در لندن تقریباً هر روز باران می‌آید.
    note: '*Prefiero* (ترجیح می‌دهم) صورت جدیدی از اول شخص است؛ *casi todos los días* (تقریباً هر روز) هم عبارت پرکاربردی برای بیان تکرار است.'
  es.a1.unit10.lesson06.teach.line07:
    title: موافقت و عجله کردن
    gloss: النا موافقت می‌کند و می‌گوید باید بروند وگرنه به کلاس دیر می‌رسند.
    note: '*Es verdad* یعنی «درسته»؛ *o* (یا) در اینجا نتیجه را نشان می‌دهد، یعنی «وگرنه».'
  es.a1.unit10.lesson06.teach.line08:
    title: موافقت و رفتن
    gloss: ماتئو قبول می‌کند که حق با اوست و می‌روند.
    note: '*Tienes razón* (حق با توست) عبارت رایجی برای موافقت است.'
