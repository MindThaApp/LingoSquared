  description: 'توصیف شغلتان؛ ادامهٔ داستان النا و ماتئو در زنگ تفریح کلاس کارگاه ۲۲ ژوئیه، وقتی دربارهٔ شغل‌هایشان حرف می‌زنند: ماتئو حسابدار و النا معلم است، و هر دو موافق‌اند که آشپزی کردن با هم را ترجیح می‌دهند.'
