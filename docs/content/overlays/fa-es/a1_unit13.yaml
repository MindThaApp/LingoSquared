    gloss: کار کردن
    note: شکل مصدر فعل که در ساختارهایی مثل *me gusta trabajar* (دوست دارم کار کنم) به کار می‌رود.
  es.a1.unit13.lesson02.teach.soy_contador:
    title: بگویید حسابدار هستید
    gloss: من حسابدار هستم.
    note: برای شغل‌ها از *ser* + نام شغل بدون حرف تعریف استفاده می‌شود؛ یادداشت دستوری زیر را ببینید.
  es.a1.unit13.lesson02.teach.soy_profesora:
    title: بگویید معلم هستید (مؤنث)
    gloss: من معلم هستم.
    note: '*Profesora* شکل مؤنث *profesor* است.'
  es.a1.unit13.lesson02.teach.enseno_en_una_escuela:
    title: بگویید کجا تدریس می‌کنید
    gloss: من در یک مدرسه تدریس می‌کنم.
    note: '*Enseño* (من تدریس می‌کنم) صرف اول‌شخص فعل *enseñar* است، همراه با *escuela* (مدرسه).'
  es.a1.unit13.lesson02.teach.contador_vs_profesora_note:
    title: نام شغل‌ها با ser
    gloss: اسپانیایی چگونه شغل را بدون حرف تعریف بیان می‌کند.
    note: متن خود کارت را ببینید.
    target_text: 'برای شغل‌ها از *ser* + نام شغل استفاده می‌شود، بدون حرف تعریف: *soy contador* (من حسابدار هستم)، نه *soy un contador*. *Contador* شکل مؤنث *contadora* را دارد؛ *profesor/profesora* هم برای «معلم» همین جفت مذکر/مؤنث است (برای زن *-a* اضافه می‌شود).'
  es.a1.unit13.lesson03.teach.en_que_trabajas:
    title: دربارهٔ شغل کسی بپرسید
    gloss: شغل شما چیست؟
    note: '*¿En qué trabajas?* (به‌معنای تحت‌اللفظی «در چه چیزی کار می‌کنی؟») راه رایج پرسیدن شغل کسی است.'
  es.a1.unit13.lesson03.teach.trabajo_en_una_oficina_soy_contador:
    title: با شغل خودتان جواب بدهید
    gloss: من در یک دفتر کار می‌کنم. حسابدار هستم.
    note: '*oficina* را با *soy contador* در یک پاسخ دو جمله‌ای طبیعی کنار هم می‌گذارد.'
  es.a1.unit13.lesson04.teach.me_gusta_mi_trabajo:
    title: بگویید از شغلتان خوشتان می‌آید
    gloss: من از شغلم خوشم می‌آید.
    note: ساختار *gustar* دوباره با *mi trabajo* (شغل من) به کار رفته است.
  es.a1.unit13.lesson04.teach.pero_prefiero_cocinar:
    title: یک ترجیح را بیان کنید
    gloss: ولی من آشپزی کردن را ترجیح می‌دهم.
    note: '*Prefiero* (ترجیح می‌دهم) را قبلاً دیده‌اید؛ *cocinar* (آشپزی کردن) مصدر فعل اصلی این داستان است.'
  es.a1.unit13.lesson04.teach.los_dos_preferimos_esto:
    title: بگویید هر دو این را ترجیح می‌دهید
    gloss: هر دوی ما این را ترجیح می‌دهیم.
    note: '*Preferimos* صرف *nosotros* (ما) از *preferir* است و وقتی النا و ماتئو با هم موافق‌اند به کار می‌رود.'
  es.a1.unit13.lesson05.teach.trabajos_reading:
    title: خواندن دربارهٔ شغل‌هایشان
    gloss: ماتئو در یک دفتر در لندن کار می‌کند. او حسابدار است. النا در یک مدرسه تدریس می‌کند. او معلم است و بیست دانش‌آموز دارد. هر دو از شغلشان خوششان می‌آید، ولی ترجیح می‌دهند سه‌شنبه‌ها با هم آشپزی کنند.
    note: خلاصه‌ای کوتاه از شغل‌های ماتئو و النا.
    glosses:
      trabaja: کار می‌کند (از trabajar)
      oficina: دفتر
      contador: حسابدار
      enseña: تدریس می‌کند (از enseñar)
      escuela: مدرسه
      profesora: معلم
      tiene: دارد (از tener)
      veinte: بیست
      estudiantes: دانش‌آموزان
      gusta: خوشش می‌آید / دوست‌داشتنی است (از gustar)
      trabajo: شغل
      prefieren: ترجیح می‌دهند (از preferir)
      cocinar: آشپزی کردن
      juntos: با هم
      martes: سه‌شنبه‌ها
  es.a1.unit13.lesson05.teach.a_los_dos_les_gusta_note:
    title: A los dos les gusta
    gloss: گسترش gustar به مفعول غیرمستقیم جمع.
    note: متن خود کارت را ببینید.
    target_text: '*A los dos les gusta* (هر دوی آن‌ها خوششان می‌آید) ساختار *gustar* را که از قبل می‌شناسید به مفعول غیرمستقیم جمع می‌برد: *les* (به آن‌ها) به‌جای *me/te* (به من/به تو).'
  es.a1.unit13.lesson06.teach.line01:
    title: دربارهٔ شغل ماتئو بپرسید
    gloss: النا از ماتئو می‌پرسد شغلش چیست.
    note: همان سؤالی که قبلاً یاد گرفتید، این بار با خطاب به ماتئو.
  es.a1.unit13.lesson06.teach.line02:
    title: با شغل او جواب بدهید
    gloss: ماتئو می‌گوید در یک دفتر کار می‌کند و حسابدار است.
    note: 'پاسخ کامل که قبلاً یاد گرفتید: اول محل کار، بعد عنوان شغل.'
  es.a1.unit13.lesson06.teach.line03:
    title: واکنش نشان دهید و شغل خودتان را بگویید
    gloss: النا آن را جالب می‌داند و می‌گوید که معلم است.
    note: '*Interesante* (جالب) یک واژهٔ هم‌ریشهٔ جدید و شفاف است؛ بقیهٔ جمله یعنی *soy profesora* و *enseño en una escuela* را از قبل بلدید.'
  es.a1.unit13.lesson06.teach.line04:
    title: بپرسید دوست دارد درس بدهد یا نه
    gloss: ماتئو می‌پرسد که آیا از درس دادن خوشش می‌آید.
    note: '*¿Te gusta enseñar?* الگوی آشنای سؤال با *gustar* را با مصدر *enseñar* ترکیب می‌کند.'
  es.a1.unit13.lesson06.teach.line05:
    title: تأیید کنید و یک ترجیح اضافه کنید
    gloss: النا می‌گوید خیلی دوستش دارد، اما ترجیح می‌دهد سه‌شنبه‌ها با او آشپزی کند.
    note: '*Contigo* (با تو) یک شکل ادغام‌شدهٔ جدید از حرف اضافه و ضمیر است؛ در *los martes* (سه‌شنبه‌ها) برای روزی که هر هفته تکرار می‌شود از حرف تعریف جمع استفاده می‌شود.'
  es.a1.unit13.lesson06.teach.line06:
    title: با همان ترجیح موافقت کنید
    gloss: ماتئو می‌گوید او هم کارش را دوست دارد، اما آشپزی را ترجیح می‌دهد.
    note: '*A mí también* (من هم) الگوی تأکیدی برای موافقت با *gustar* است: *a mí* روی کسی که دوست دارد تأکید می‌کند.'
  es.a1.unit13.lesson06.teach.line07:
    title: نتیجه بگیرید
    gloss: النا نتیجه می‌گیرد که هر دوی آن‌ها این را (آشپزی با هم) ترجیح می‌دهند.
    note: '*Entonces* (پس / آن‌وقت) یک حرف ربط منطقی جدید است؛ بقیه یعنی *los dos preferimos esto* (هر دوی ما این را ترجیح می‌دهیم).'
  es.a1.unit13.lesson06.teach.line08:
    title: با شوق تأیید کنید
    gloss: 'ماتئو موافقت می‌کند: قطعاً.'
    note: '*Definitivamente* (قطعاً) یک قید هم‌ریشهٔ شفاف و جدید است که صحنه را تمام می‌کند.'
