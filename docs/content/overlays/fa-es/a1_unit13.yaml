    note: '*Estudiante* برای مرد و زن یک شکل دارد؛ جمع آن، *los estudiantes*، گروه مختلط را هم شامل می‌شود.'
    example_gloss: من بیست دانش‌آموز دارم.
  es.a1.unit13.lesson02.teach.trabajar:
