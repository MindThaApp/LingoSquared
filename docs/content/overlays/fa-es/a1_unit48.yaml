teaching:
  es.a1.unit48.lesson01.teach.leer_hacer_deporte:
    title: مطالعه، ورزش، آشپزی
    gloss: خواندن، ورزش کردن، آشپزی کردن
    note: 'سه فعل رایج برای سرگرمی‌ها: *leer* (خواندن)، *hacer deporte* (ورزش کردن) و *cocinar* (آشپزی کردن).'
    example_gloss:
    - دوست دارم کتاب بخونم.
    - شنبه‌ها ورزش می‌کنم.
    - دوست دارم برای دوستام آشپزی کنم.
  es.a1.unit48.lesson01.teach.el_tiempo_libre:
    title: اوقات فراغت
    gloss: اوقات فراغت
    note: '*El tiempo libre* یک عبارت اسمی مذکر است و عبارت کلیدی برای صحبت درباره‌ی سرگرمی‌هاست.'
    example_gloss: توی اوقات فراغتم دوست دارم کتاب بخونم.
  es.a1.unit48.lesson01.teach.en_mi_tiempo:
    title: گفتن اینکه در اوقات فراغتتان چه کار می‌کنید
    gloss: توی اوقات فراغتم دوست دارم کتاب بخونم.
    note: '*Me gusta leer* (دوست دارم بخونم) از *gustar* + مصدر ساخته شده؛ *me gusta* برای هر فعالیتی همین‌طور ثابت می‌ماند.'
  es.a1.unit48.lesson02.teach.escuchar_musica_dibujar:
    title: موسیقی، نقاشی، بازی ویدیویی
    gloss: گوش دادن به موسیقی، نقاشی کردن، بازی ویدیویی کردن
    note: 'سه فعل دیگر برای سرگرمی‌ها: *escuchar música* (گوش دادن به موسیقی)، *dibujar* (نقاشی کردن) و *jugar videojuegos* (بازی ویدیویی کردن).'
    example_gloss:
    - دوست دارم به موسیقی گوش بدم.
    - من اغلب نقاشی می‌کشم.
    - دوست دارم با دوستام بازی ویدیویی کنم.
  es.a1.unit48.lesson02.teach.me_gusta_escuchar:
    title: گفتن اینکه دوست دارید به موسیقی گوش بدید
    gloss: دوست دارم به موسیقی گوش بدم.
    note: 'فعل *escuchar* مفعولش را مستقیم می‌گیرد و حرف اضافه نمی‌خواهد: *escuchar música*. در فارسی می‌گوییم «به موسیقی گوش دادن»، ولی در اسپانیایی حرف اضافه‌ای لازم نیست.'
  es.a1.unit48.lesson02.teach.me_gusta_jugar:
    title: گفتن اینکه دوست دارید با دوستانتان بازی ویدیویی کنید
    gloss: دوست دارم با دوستام بازی ویدیویی کنم.
    note: در *Con amigos* (با دوستان) همان حرف اضافهٔ *con* از درس‌های قبل دوباره آمده است.
  es.a1.unit48.lesson03.teach.siempre_a_menudo:
    title: همیشه، اغلب، گاهی، هرگز
    gloss: همیشه، اغلب، گاهی، هرگز
    note: 'چهار قید بسامد اصلی: *siempre* (همیشه)، *a menudo* (اغلب)، *a veces* (گاهی)، *nunca* (هرگز). معمولاً قبل از فعل یا اول جمله می‌آیند.'
    example_gloss:
    - من شنبه‌ها همیشه ورزش می‌کنم.
    - من اغلب کتاب می‌خونم.
    - من گاهی نقاشی می‌کشم.
    - من هرگز بازی ویدیویی نمی‌کنم.
  es.a1.unit48.lesson03.teach.cada_semana_cada:
    title: هر هفته، هر آخر هفته
    gloss: هر هفته، هر آخر هفته
    note: '*Cada semana* و *cada fin de semana* هر دو یعنی «هر»؛ شکل *cada* هیچ‌وقت عوض نمی‌شود.'
    example_gloss:
    - من هر هفته برای دوستام آشپزی می‌کنم.
    - من هر آخر هفته ورزش می‌کنم.
  es.a1.unit48.lesson03.teach.con_palabras_femeninas:
    title: cada هیچ‌وقت تغییر نمی‌کند
    gloss: 'Cada همیشه یک شکل است: cada semana، cada fin de semana.'
    note: '*Cada* هرگز تغییر نمی‌کند: قبل از اسم مؤنث (*semana*) و اسم مذکر (*fin de semana*) یکسان است.'
  es.a1.unit48.lesson03.teach.que_haces_en:
    title: پرسیدن دربارهٔ اوقات فراغت
    gloss: توی وقت آزادت چی کار می‌کنی؟
    note: این سؤال اصلی این درس است؛ با آن می‌توانید از هر کسی دربارهٔ سرگرمی‌هاش بپرسید.
  es.a1.unit48.lesson04.teach.elena_a_menudo:
    title: النا از سرگرمی‌ها حرف می‌زند
    gloss: 'النا: ما اغلب با هم قدم می‌زنیم. ولی تو توی وقت آزادت دیگه چی کار می‌کنی، ماتئو؟'
    note: در *A menudo paseamos juntos* (ما اغلب با هم قدم می‌زنیم)، *paseamos* شکل *nosotros* از فعل *pasear* است.
  es.a1.unit48.lesson04.teach.mateo_me_gusta:
    title: سرگرمی‌های ماتئو
    gloss: 'ماتئو: دوست دارم آشپزی کنم، توی خونه هم. و اغلب ورزش می‌کنم.'
    note: '*También en casa* (توی خونه هم) نشان می‌دهد ماتئو برای لذت آشپزی می‌کند، نه فقط در کارش در رستوران.'
  es.a1.unit48.lesson04.teach.elena_cocinas_tambien:
    title: النا تعجب می‌کند
    gloss: 'النا: توی خونه هم آشپزی می‌کنی؟ تو که تمام روز سر کار آشپزی می‌کنی!'
    note: '*Todo el día* (تمام روز) تأکید می‌کند که ماتئو سر کار هم خیلی آشپزی می‌کند.'
  es.a1.unit48.lesson04.teach.mateo_si_pero:
    title: ماتئو توضیح می‌دهد
    gloss: 'ماتئو: آره، ولی آشپزی به نظرم آرامش‌بخشه. تو چی؟ دوست داری چی کار کنی؟'
    note: '*Cocinar me parece relajante* یعنی «آشپزی به نظرم آرامش‌بخش می‌آید»: *me parece* + صفت راهی طبیعی برای بیان نظر است.'
  es.a1.unit48.lesson04.teach.elena_me_gusta:
    title: سرگرمی‌های النا
    gloss: 'النا: دوست دارم کتاب بخونم و اغلب موسیقی گوش می‌دم.'
    note: دو فعل سرگرمی از درس‌های قبل را با *y* (و) در یک جمله کنار هم می‌آورد.
  es.a1.unit48.lesson04.teach.mateo_tu_tambien:
    title: ماتئو دربارهٔ بازی ویدیویی می‌پرسد
    gloss: 'ماتئو: تو هم بازی ویدیویی می‌کنی؟'
    note: یک سؤال کوتاه بله/خیر با *jugar videojuegos* از درس ۲؛ *tú también* (تو هم) از ضمیر غیررسمی *tú* استفاده می‌کند.
  es.a1.unit48.lesson04.teach.elena_no_nunca:
    title: النا جواب می‌دهد
    gloss: 'النا: نه، من هرگز بازی ویدیویی نمی‌کنم. ولی گاهی نقاشی می‌کشم!'
    note: '*Nunca* (هرگز) و *a veces* (گاهی) از درس ۳، در یک پاسخ کنار هم.'
  es.a1.unit48.lesson05.teach.mateo_y_yo:
    title: مقایسهٔ سرگرمی‌ها
    gloss: ماتئو و من اغلب با هم قدم می‌زنیم. ولی سرگرمی‌های دیگه‌ای هم داریم. ماتئو دوست داره آشپزی کنه، توی خونه هم، و اغلب ورزش می‌کنه. من دوست دارم کتاب بخونم و اغلب موسیقی گوش می‌دم. گاهی نقاشی می‌کشم، ولی هرگز بازی ویدیویی نمی‌کنم. تو توی وقت آزادت دوست داری چی کار کنی؟
    note: پیام النا مطالب درس ۴ را مرور می‌کند و با سؤال اصلی این واحد از خواننده تمام می‌شود.
    glosses:
      paseamos: قدم می‌زنیم
      menudo: اغلب
      juntos: با هم
      otras: دیگر
      cocinar: آشپزی می‌کند
      gusta: دوست دارد
      casa: توی خانه
      deporte: ورزش می‌کند
      leer: بخوانم
      escucho: گوش می‌دهم
      música: موسیقی
      dibujo: نقاشی می‌کشم
      veces: گاهی
      videojuegos: بازی ویدیویی می‌کنم
      nunca: هرگز
      libre: آزاد
      tiempo: وقت
  es.a1.unit48.lesson06.teach.mateo_que_haces:
    title: ماتئو دربارهٔ آخر هفته می‌پرسد
    gloss: 'ماتئو: این آخر هفته چی کار می‌کنی؟'
    note: در *Este fin de semana* (این آخر هفته)، *este* با اسم مذکر *fin de semana* آمده است.
  es.a1.unit48.lesson06.teach.elena_todavia_no:
    title: النا مردد است
    gloss: 'النا: هنوز نمی‌دونم. دوست دارم کتاب بخونم، ولی می‌خوام برم بیرون هم.'
    note: '*Quiero salir* (می‌خوام برم بیرون) راه رایجی برای گفتن این است که می‌خواهید از خانه بیرون بروید.'
  es.a1.unit48.lesson06.teach.mateo_paseamos_juntos:
    title: ماتئو برنامه پیشنهاد می‌دهد
    gloss: 'ماتئو: با هم قدم بزنیم؟ بعدش برای هردومون آشپزی می‌کنم.'
    note: '*Después* (بعدش) واژه‌ای برای ترتیب کارهاست: *primero*، *luego*، *después*.'
  es.a1.unit48.lesson06.teach.elena_buena_idea:
    title: النا موافقت می‌کند
    gloss: 'النا: فکر خوبیه! هر دو کار رو دوست دارم: قدم زدن و آشپزی.'
    note: '*Las dos cosas* (هر دو چیز) نشان می‌دهد النا دو کار را به یک اندازه دوست دارد.'
  es.a1.unit48.lesson06.teach.mateo_perfecto_entonces:
    title: ماتئو قرار را تأیید می‌کند
    gloss: 'ماتئو: عالیه! پس شنبه می‌بینمت!'
    note: یک جملهٔ دوستانهٔ پایانی برای تأیید قرار در *el sábado* (شنبه)؛ در اسپانیایی قبل از روز مشخص *el* می‌آید.
