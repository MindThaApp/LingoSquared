teaching:
  es.a1.unit11.lesson01.teach.la_camisa:
    title: پیراهن
    gloss: پیراهن
    note: '*Camisa* مؤنث است.'
    example_gloss: این پیراهن را دوست دارم.
  es.a1.unit11.lesson01.teach.el_pantalon:
    title: شلوار
    gloss: شلوار
    note: '*Pantalón* در اسپانیایی مفرد است؛ در فارسی هم «شلوار» مفرد است.'
    example_gloss: قیمت شلوار بیست است.
  es.a1.unit11.lesson01.teach.la_chaqueta:
    title: کت
    gloss: کت
    note: '*Chaqueta* مؤنث است.'
    example_gloss: برای زمستان یک کت لازم دارم.
  es.a1.unit11.lesson01.teach.los_zapatos:
    title: کفش‌ها
    gloss: کفش‌ها
    note: '*Zapatos* جمع است، مثل «کفش‌ها» در فارسی.'
    example_gloss: این کفش‌ها راحت هستند.
  es.a1.unit11.lesson01.teach.el_delantal:
    title: پیش‌بند
    gloss: پیش‌بند
    note: '*Delantal* مذکر است؛ همان چیزی که النا و ماتئو برای کارگاه لازم دارند.'
    example_gloss: برای کارگاه یک پیش‌بند لازم داریم.
  es.a1.unit11.lesson02.teach.que_talla_usas:
    title: پرسیدن درباره‌ی سایز
    gloss: چه سایزی می‌پوشید؟
    note: '*¿Qué talla usas?* روش معمول پرسیدن سایز لباس کسی است.'
  es.a1.unit11.lesson02.teach.uso_la_talla_mediana:
    title: گفتن سایز
    gloss: من سایز مدیوم می‌پوشم.
    note: '*Uso* (می‌پوشم/استفاده می‌کنم) + *la talla* (سایز) + خود اسم سایز.'
  es.a1.unit11.lesson02.teach.me_queda_bien:
    title: گفتن اینکه اندازه است
    gloss: اندازه‌م هست.
    note: '*Me queda bien* از *quedar* (اندازه بودن/برازیدن) استفاده می‌کنه؛ به نکته‌ی دستوری بعدی نگاه کنید.'
  es.a1.unit11.lesson02.teach.me_queda_mal:
    title: گفتن اینکه اندازه نیست
    gloss: اندازه‌م نیست.
    note: عکس *me queda bien* است، با جایگزینی *bien* با *mal*.
  es.a1.unit11.lesson02.teach.queda_note:
    title: Quedar bien/mal
    gloss: اینکه quedar اندازه و برازندگی را توصیف می‌کنه، نه کیفیت کلی را.
    note: به متن خود کارت نگاه کنید.
    target_text: '*Me queda bien* (اندازه‌م هست) از فعل *quedar* (اندازه بودن/ایستادن) می‌آد که با *ser* و *estar* فرق داره؛ تحت‌اللفظی یعنی «خوب روی من می‌مونه». *Bien* و *mal* اینجا اندازه و برازندگی را توصیف می‌کنند، نه کیفیت را.'
  es.a1.unit11.lesson03.teach.cuanto_cuesta_este_delantal:
    title: پرسیدن قیمت پیش‌بند
    gloss: این پیش‌بند چنده؟
    note: از الگوی *¿Cuánto cuesta?* استفاده می‌کنه و با *este* (این) کالای مشخصی را نام می‌بره.
  es.a1.unit11.lesson03.teach.cuesta_doce:
    title: گفتن قیمت
    gloss: دوازده است.
    note: '*Cuesta* + عدد قیمت را می‌گه.'
  es.a1.unit11.lesson03.teach.este_vs_esta_note:
    title: Este و esta
    gloss: اینکه اشاره‌ی «این» با جنسیت اسم هماهنگ می‌شه.
    note: به متن خود کارت نگاه کنید.
    target_text: '*Este* (این، مذکر) با *el delantal* می‌آد؛ *esta* (این، مؤنث) با *esta camisa* می‌آد. اشاره‌ی این/آن بر اساس جنسیت اسم عوض می‌شه، مثل بقیه‌ی صفت‌ها.'
  es.a1.unit11.lesson04.teach.me_gusta_este:
    title: گفتن اینکه این یکی را دوست دارید
    gloss: این یکی را دوست دارم.
    note: '*Este* اینجا تنها و به‌عنوان ضمیر می‌آید («این یکی») و به همان چیزی اشاره می‌کند که همین الان اسمش آمده.'
  es.a1.unit11.lesson04.teach.voy_a_comprarlo:
    title: بگویید که آن را می‌خرید
    gloss: می‌خوام بخرمش.
    note: '*Voy a* + مصدر ساخت آینده‌ی نزدیک است؛ در *comprarlo* ضمیر مفعولی *lo* (آن) به مصدر *comprar* چسبیده است.'
  es.a1.unit11.lesson04.teach.compramos_dos:
    title: بگویید که دو تا می‌خرید
    gloss: ما دو تا می‌خریم.
    note: '*Compramos* (می‌خریم) صورت *nosotros* است و وقتی الِنا و ماتئو با هم تصمیم می‌گیرند به کار می‌رود.'
  es.a1.unit11.lesson05.teach.precios_reading:
    title: خواندن فهرست قیمت
    gloss: 'در این مغازه پیراهن پانزده، شلوار بیست، کت سی و کفش‌ها بیست‌وپنج است. پیش‌بند از همه ارزان‌تر است: فقط دوازده.'
    note: 'فهرست قیمت یک مغازه: برای یک کالا *cuesta* (قیمتش است) و برای جمع مثل *los zapatos* از *cuestan* استفاده می‌شود.'
    glosses:
      tienda: مغازه
      camisa: پیراهن
      cuesta: قیمتش است (از costar)
      quince: پانزده
      pantalón: شلوار
      veinte: بیست
      chaqueta: کت
      treinta: سی
      zapatos: کفش
      cuestan: قیمتشان است (از costar)
      veinticinco: بیست‌وپنج
      delantal: پیش‌بند
      barato: ارزان
      solo: فقط
      doce: دوازده
  es.a1.unit11.lesson05.teach.el_mas_barato_note:
    title: El más barato (ارزان‌ترین)
    gloss: چطور با el/la + más + صفت، صفت عالی ساخته می‌شود.
    note: به متن خود کارت نگاه کنید.
    target_text: '*El más barato* (ارزان‌ترین) صفت عالی است: *el/la* + *más* + صفت، و با *de/en* گروه مقایسه مشخص می‌شه. این درس هنوز الگوی کامل مقایسه را یاد نمی‌ده، فقط همین عبارت رایج خرید را.'
  es.a1.unit11.lesson06.teach.line01:
    title: نیازشان را بگویید
    gloss: الِنا می‌گوید برای کارگاه پیش‌بند لازم دارند.
    note: '*Delantales* جمع *el delantal* است.'
  es.a1.unit11.lesson06.teach.line02:
    title: موافقت کنید و یک مغازه پیشنهاد بدهید
    gloss: ماتئو موافقت می‌کند و پیشنهاد می‌دهد به آن مغازه بروند.
    note: '*Tienes razón* یعنی «حق با شماست/حق با توست»؛ *esa tienda* یعنی «آن مغازه».'
  es.a1.unit11.lesson06.teach.line03:
    title: فروشنده سلام می‌کند
    gloss: فروشنده سلام می‌کند و کمک پیشنهاد می‌دهد.
    note: '*¿Los ayudo?* (کمکتان کنم؟) سلام و احوال‌پرسی معمول فروشنده است و هر دو نفر، الِنا و ماتئو، را با هم خطاب می‌کند.'
  es.a1.unit11.lesson06.teach.line04:
    title: بگویید دنبال چه هستید
    gloss: الِنا می‌گوید بله، دنبال پیش‌بند می‌گردند.
    note: '*Buscamos* (دنبالش می‌گردیم) صورت *nosotros* فعل *buscar* است.'
  es.a1.unit11.lesson06.teach.line05:
    title: فروشنده نمونه‌ها را نشان می‌دهد و سایز می‌پرسد
    gloss: فروشنده چند پیش‌بند نشان می‌دهد و سایزشان را می‌پرسد.
    note: در *¿Qué talla usan?* فعل جمع *usan* (می‌پوشید) به کار رفته چون هر دوی آن‌ها را خطاب می‌کند؛ برخلاف *usas* که مفرد است.
  es.a1.unit11.lesson06.teach.line06:
    title: یک سایز را بگویید
    gloss: ماتئو می‌گوید سایزش مدیوم است.
    note: '*Uso la talla mediana* جواب *¿Qué talla usan?* برای خود ماتئو است.'
  es.a1.unit11.lesson06.teach.line06b:
    title: الِنا موافقت می‌کند
    gloss: الِنا می‌گوید سایز او هم همین است.
    note: '*Yo también* یعنی «من هم».'
  es.a1.unit11.lesson06.teach.line07:
    title: قیمت را بپرسید
    gloss: ماتئو می‌پرسد پیش‌بند چقدر است.
    note: '*Este* (این) به پیش‌بندی که جلوی او است اشاره می‌کند.'
  es.a1.unit11.lesson06.teach.line07b:
    title: قیمت را بگویید
    gloss: فروشنده می‌گوید دوازده است.
    note: '*Cuesta* + عدد، قیمت را می‌رساند.'
  es.a1.unit11.lesson06.teach.line08:
    title: اندازه بودن را تأیید کنید و تصمیم به خرید بگیرید
    gloss: الِنا می‌گوید اندازه‌اش است، خوشش آمده و می‌خرد.
    note: '*me queda bien*، *me gusta este* و *voy a comprarlo* پشت سر هم آمده‌اند.'
  es.a1.unit11.lesson06.teach.line09:
    title: موافقت کنید و دو تا بخرید
    gloss: ماتئو می‌گوید برای او هم اندازه است و دو تا می‌خرند.
    note: '*A mí también* (من هم، با تأکید) همان الگوی موافقت با *también* است با ضمیر تأکیدی؛ *compramos dos* صحنه را تمام می‌کند.'
