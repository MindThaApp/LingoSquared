    title: 'Cocina: آشپزخونه یا آشپزی'
    gloss: فرق بین «آشپزخونه» و «آشپزی کردن»
    note: متن همین کارت رو ببینید.
    target_text: '*La cocina* اینجا یعنی «آشپزخانه» (یک اتاق)، که با معنای *cocina*/*cocinar* (آشپزی / آشپزی کردن) که در تمام این داستان برای کارگاه به کار رفته فرق دارد. از روی بافت جمله می‌شود فهمید: در *taller de cocina* یعنی آشپزی؛ *la cocina* در خانه یا آپارتمان همان اتاق است؛ و *cocinar* فعل «آشپزی کردن» است.'
