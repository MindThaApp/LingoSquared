    note: '*Tiene* (داره) + تعداد + اسم، اینجا با *dormitorio* و *cocina* و *grande*.'
  es.a1.unit14.lesson04.teach.quiero_alquilar_un_apartamento_con_una_cocina_grande:
    title: گفتن هدفت برای خونه
    gloss: می‌خوام یه آپارتمان با آشپزخونهٔ بزرگ اجاره کنم.
    note: '*Quiero* (می‌خوام) + مصدر *alquilar*، و *con* (با) برای معرفی ویژگی دلخواه.'
  es.a1.unit14.lesson04.teach.asi_puedes_cocinar_en_casa:
    title: توضیح دادن فایده
    gloss: این‌طوری می‌تونی تو خونه هم آشپزی کنی.
    note: '*Así* (این‌طوری) + *puedes* (می‌تونی) + مصدر، هدف خونه رو به موضوع آشپزی کل ماجرا وصل می‌کنه.'
  es.a1.unit14.lesson05.teach.anuncio_reading:
    title: خوندن یه آگهی آپارتمان
    gloss: آپارتمان خالی در ساختمانی نزدیک پارک. دو اتاق خواب، یک حمام، یک اتاق نشیمن و یک آشپزخونهٔ بزرگ داره. برای کسی که دوست داره تو خونه آشپزی کنه عالیه.
    note: یه آگهی واقعی به سبک آگهی‌های روزنامه.
    glosses:
      desocupado: خالی / آماده برای اجاره
      edificio: ساختمان
      cerca: نزدیک
      parque: پارک
      Tiene: داره (از tener)
      dormitorios: اتاق خواب‌ها
      baño: حمام
      sala: اتاق نشیمن
      grande: بزرگ
      perfecto: عالی
      quiere: می‌خواد (از querer)
      cocinar: آشپزی کردن
  es.a1.unit14.lesson05.teach.para_alguien_que_note:
    title: Para alguien que...
    gloss: چطور یه جملهٔ وصفی، مستأجر ایده‌آل رو توصیف می‌کنه.
    note: متن همین کارت رو ببینید.
    target_text: '*Para alguien que quiere* (برای کسی که می‌خواهد) از *alguien* (کسی) + *que* (که) برای ساختن یک جملهٔ وصفی استفاده می‌کند؛ الگویی رایج در آگهی‌هایی که مستأجر ایده‌آل را توصیف می‌کنند.'
  es.a1.unit14.lesson06.teach.line01:
    title: گفتن مشکل و هدف
    gloss: ماتئو می‌گه آشپزخونه‌اش خیلی کوچیکه و می‌خواد آپارتمانی با آشپزخونهٔ بزرگ اجاره کنه.
    note: جملهٔ *mi cocina es muy pequeña* (آشپزخونهٔ من خیلی کوچیکه) با جملهٔ هدف *quiero alquilar un apartamento con una cocina grande* (می‌خوام آپارتمانی با آشپزخونهٔ بزرگ اجاره کنم) ترکیب شده.
  es.a1.unit14.lesson06.teach.line02:
    title: پیشنهاد نگاه کردن آگهی‌ها
    gloss: النا پیشنهاد می‌کنه روزنامه رو نگاه کنن؛ کلی آگهی توش هست.
    note: '*El periódico* (روزنامه) و *anuncios* (آگهی‌ها) واژه‌های جدیدی از آگهی‌های واقعی روزنامه هستن.'
  es.a1.unit14.lesson06.teach.line03:
    title: پیدا کردن یه آگهی
    gloss: ماتئو ساختمانی پیدا می‌کنه که یه آپارتمان خالی داره.
    note: '*Este edificio* (این ساختمان) و *desocupado* (خالی، آماده برای اجاره).'
  es.a1.unit14.lesson06.teach.line04:
    title: پرسیدن دربارهٔ اتاق خواب‌ها
    gloss: النا می‌پرسه چند تا اتاق خواب داره.
    note: سؤال رایج برای پرسیدن دربارهٔ ویژگی‌های یه مکان.
  es.a1.unit14.lesson06.teach.line05:
    title: جواب دادن با جزئیات
    gloss: ماتئو می‌گه دو تا اتاق خواب و یه آشپزخونهٔ بزرگ داره.
    note: '*Tiene* (داره) + تعداد + اسم.'
  es.a1.unit14.lesson06.teach.line06:
    title: تأیید ویژگی‌های بیشتر
    gloss: النا خوشحال می‌شه و می‌گه یه حمام و یه اتاق نشیمن هم داره.
    note: '*Baño* (حمام) و *sala* (اتاق نشیمن) فهرست اتاق‌ها رو کامل می‌کنن؛ *también* (هم) آخر جمله میاد.'
  es.a1.unit14.lesson06.teach.line07:
    title: تصمیم برای تماس گرفتن
    gloss: ماتئو تصمیم می‌گیره همین امروز به آژانس زنگ بزنه.
    note: '*Voy a llamar* (می‌خوام زنگ بزنم) + *hoy mismo* (همین امروز)؛ *la agencia* آژانس اجاره است.'
  es.a1.unit14.lesson06.teach.line08:
    title: موافقت و بستن صحنه
    gloss: النا موافقت می‌کنه و می‌گه این‌طوری می‌تونه تو خونه هم آشپزی کنه.
    note: '*Así puedes cocinar en casa también* (این‌طوری می‌تونی تو خونه هم آشپزی کنی) صحنه رو تموم می‌کنه.'
