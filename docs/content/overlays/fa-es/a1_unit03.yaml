course:
  title: اسپانیایی A1
  description: واژگان خانوادهٔ نزدیک و گسترده، صفت‌های ملکی و توصیف اهل خانه؛ ادامهٔ داستان کارگاه آشپزی النا و ماتئو از درس‌های ۰۱ تا ۰۲. تأکید ویژه بر صفت‌های ملکی (mi/tu/su) و اسم‌های خانوادگیِ دارای جنسیت، که در فارسی وجود ندارند.
units:
  es.a1.unit03.family:
    title: خانوادهٔ النا و ماتئو
lessons:
  es.a1.unit03.lesson01.immediate_family:
    title: خانوادهٔ نزدیک
  es.a1.unit03.lesson02.possessives_and_asking:
    title: 'صفت‌های ملکی: mi, tu, su'
  es.a1.unit03.lesson03.extended_family:
    title: فامیل و اقوام
  es.a1.unit03.lesson04.describing_family_size:
    title: چند نفر در خانه‌اند
  es.a1.unit03.lesson05.reading_a_family_profile:
    title: خواندن معرفی یک خانواده
  es.a1.unit03.lesson06.family_photos_dialogue:
    title: عکس‌های خانوادگی با النا و ماتئو
teaching:
  es.a1.unit03.lesson01.teach.madre:
    title: مادر
    gloss: مادر
    note: '*Madre* مؤنث است. *Mamá* در گفت‌وگوی روزمرهٔ خانواده رایج‌تر است، اما *madre* خنثی است و در فهرست واژگان این دوره استفاده می‌شود.'
  es.a1.unit03.lesson01.teach.padre:
    title: پدر
    gloss: پدر
    note: '*Padre* مذکر است. *Papá* معادل روزمرهٔ آن است، مثل *madre*/*mamá*.'
  es.a1.unit03.lesson01.teach.hermano:
    title: برادر
    gloss: برادر
    note: '*Hermano* مذکر و مفرد است.'
  es.a1.unit03.lesson01.teach.hermana:
    title: خواهر
    gloss: خواهر
    note: '*Hermana* مؤنث و مفرد است.'
  es.a1.unit03.lesson01.teach.hijo:
    title: پسر
    gloss: پسر
    note: '*Hijo* مذکر و مفرد است.'
  es.a1.unit03.lesson01.teach.hija:
    title: دختر
    gloss: دختر
    note: '*Hija* مؤنث و مفرد است.'
  es.a1.unit03.lesson01.teach.padres:
    title: پدر و مادر
    gloss: پدر و مادر
    note: '*Padres* (جمع مذکر) برای یک زوج مختلط (پدر و مادر با هم) به کار می‌رود؛ در اسپانیایی هر وقت گروهی دست‌کم یک مرد داشته باشد، همین الگو را به کار می‌برند.'
  es.a1.unit03.lesson01.teach.hermanos:
    title: خواهر و برادرها
    gloss: خواهر و برادرها؛ برادرها
    note: '*Hermanos* می‌تواند به معنی «برادرها» (همه پسر) یا «خواهر و برادرها» (گروه مختلط) باشد، طبق همان قاعدهٔ *padres*: جمع مذکر گروه مختلط را هم در بر می‌گیرد.'
  es.a1.unit03.lesson02.teach.mi_familia:
    title: خانوادهٔ من
    gloss: خانوادهٔ من
    note: '*Mi* (بدون accent) صفت ملکی «من/ـم» است؛ با جنسیت تغییر نمی‌کند و فقط با تعداد عوض می‌شود (*mis* برای اسم‌های جمع).'
  es.a1.unit03.lesson02.teach.tu_familia:
    title: خانوادهٔ تو (خودمانی)
    gloss: خانوادهٔ تو
    note: '*Tu* (بدون accent، برخلاف ضمیر *tú*) صفت ملکی خودمانی است و با سطح محترمانهٔ *tú* در درس ۱ هماهنگ است.'
  es.a1.unit03.lesson02.teach.su_familia:
    title: خانوادهٔ او / شما (رسمی یا سوم‌شخص)
    gloss: خانوادهٔ او / خانوادهٔ شما
    note: '*Su* هم «او (مرد)» و هم «او (زن)» و هم «شما»ی رسمی (*usted*) را می‌رساند؛ در اسپانیایی خودِ صفت ملکی این‌ها را از هم جدا نمی‌کند و معنی از موقعیت معلوم می‌شود.'
  es.a1.unit03.lesson02.teach.tienes_hermanos:
    title: پرسیدن دربارهٔ خواهر و برادر
    gloss: خواهر یا برادر داری؟
    note: '*Tienes* شکل *tú* از فعل *tener* است، همان فعلی که در درس ۲ برای سن به کار رفت.'
  es.a1.unit03.lesson02.teach.tengo_dos_hermanas:
    title: گفتن تعداد خواهر و برادر
    gloss: من دو تا خواهر دارم.
    note: '*Tengo* (دارم) همراه با عدد و اسم خانوادگی راه معمول گفتن تعداد خواهر و برادر است.'
  es.a1.unit03.lesson02.teach.tu_familia_es_grande:
    title: پرسیدن اینکه خانواده بزرگ است یا نه
    gloss: خانواده‌ات بزرگه؟
    note: '*Grande* (بزرگ) با جنسیت تغییر نمی‌کند و فقط با تعداد عوض می‌شود (*grandes*).'
  es.a1.unit03.lesson02.teach.mi_familia_es_pequena:
    title: توصیف یک خانوادهٔ کوچک
    gloss: خانوادهٔ من کوچیکه.
    note: '*Pequeña* با اسم مؤنث *familia* مطابقت دارد؛ شکل مذکر *pequeño* با اسم مذکر می‌آید.'
  es.a1.unit03.lesson03.teach.abuelo:
    title: پدربزرگ
    gloss: پدربزرگ
    note: '*Abuelo* مذکر و مفرد است.'
  es.a1.unit03.lesson03.teach.abuela:
    title: مادربزرگ
    gloss: مادربزرگ
    note: '*Abuela* مؤنث و مفرد است.'
  es.a1.unit03.lesson03.teach.abuelos:
    title: پدربزرگ و مادربزرگ
    gloss: پدربزرگ و مادربزرگ
    note: '*Abuelos* (مذکر جمع) برای یک زوج مختلط هم به کار می‌رود، درست مثل *padres* و *hermanos*.'
  es.a1.unit03.lesson03.teach.tio:
    title: دایی / عمو
    gloss: دایی / عمو
    note: '*Tío* اکسان نوشتاری دارد، چون تکیه روی *í* است و به همین دلیل دو حرف صدادار یک واج مرکب (دیفتونگ) نمی‌سازند.'
  es.a1.unit03.lesson03.teach.tia:
    title: خاله / عمه
    gloss: خاله / عمه
    note: '*Tía* به همان دلیلِ *tío* اکسان دارد.'
  es.a1.unit03.lesson03.teach.primo:
    title: پسرعمو / پسردایی / پسرخاله (پسر)
    gloss: پسرعمو / پسردایی / پسرخاله
    note: '*Primo* مذکر مفرد است. در فارسی «پسرعمو» و «دخترعمو» جنسیت را نشان می‌دهند، ولی واژهٔ primo خودش جنسیت دارد و برای دختر باید prima گفت.'
  es.a1.unit03.lesson03.teach.prima:
    title: دخترعمو / دختردایی / دخترخاله (دختر)
    gloss: دخترعمو / دختردایی / دخترخاله
    note: '*Prima* مؤنث و مفرد است.'
  es.a1.unit03.lesson03.teach.mis_abuelos:
    title: پدربزرگ و مادربزرگ‌های من
    gloss: پدربزرگ و مادربزرگ‌هایم
    note: '*Mis* شکل جمعِ *mi* است و هر وقت اسمِ بعدش جمع باشد، چه مذکر و چه مؤنث، باید از آن استفاده کرد.'
  es.a1.unit03.lesson04.teach.cuantos_hermanos_tienes:
    title: پرسیدن تعداد خواهر و برادر
    gloss: چند تا خواهر و برادر داری؟
    note: '*Cuántos* (مذکر جمع، چون *hermanos* گروه مختلط را هم شامل می‌شود) با اسمی که دربارهٔ آن می‌پرسد هماهنگ است.'
  es.a1.unit03.lesson04.teach.somos_cinco:
    title: گفتن تعداد افراد خانه
    gloss: ما توی خانه پنج نفریم.
    note: '*Somos* (ما هستیم) در اسپانیایی راه طبیعی گفتن تعداد کل افراد خانه است؛ ترجمهٔ کلمه‌به‌کلمهٔ «وجود دارند» نیست.'
  es.a1.unit03.lesson04.teach.mi_familia_es_grande:
    title: توصیف یک خانوادهٔ بزرگ
    gloss: خانوادهٔ من بزرگ است.
    note: '*Grande* اینجا برای *familia* (مؤنث) آمده، ولی با اسم‌های مذکر هم همین شکل *grande* را دارد، چون صفت‌های مختوم به -e مثل *grande* برای جنس تغییر نمی‌کنند.'
  es.a1.unit03.lesson04.teach.tengo_muchos_primos:
    title: گفتن اینکه پسرعمو و دخترعموی زیادی دارید
    gloss: من پسرعمو و دخترعموی زیادی دارم.
    note: '*Muchos* (مذکر جمع) به کار رفته است، چون *primos* هم مثل *hermanos* و *padres* می‌تواند گروهی مختلط را نشان دهد.'
  es.a1.unit03.lesson04.teach.vives_cerca_de_tus_padres:
    title: پرسیدن دربارهٔ زندگی نزدیک پدر و مادر
    gloss: نزدیک پدر و مادرت زندگی می‌کنی؟
    note: '*Tus* شکل جمعِ *tu* است و چون *padres* جمع است، لازم است.'
  es.a1.unit03.lesson04.teach.vivo_con_mis_abuelos:
    title: گفتن اینکه با چه کسانی زندگی می‌کنید
    gloss: من با پدربزرگ و مادربزرگم زندگی می‌کنم.
    note: '*Con* (با) کسانی را معرفی می‌کند که با آن‌ها زندگی می‌کنید؛ *vivo* صورت *yo* از *vivir* است که در درس ۱ در *vivo en Londres* دیدید.'
  es.a1.unit03.lesson05.teach.profile_reading:
    title: معرفی خانوادهٔ النا
    gloss: اسمم النا است. سی و یک سال دارم و با پدربزرگ و مادربزرگم در اسپانیا زندگی می‌کنم. پدر و مادرم در بارسلون زندگی می‌کنند. یک خواهر و یک برادر دارم؛ توی خانه پنج نفریم. خواهر کوچکم اسمش سوفیا است و بیست سالش است.
    note: این معرفی‌نامه واژه‌ها و ساختارهای درس‌های ۱ تا ۴ را در یک متن کوتاه و پیوسته به کار می‌برد، نه در جمله‌های جدا؛ همان مهارتِ فهمیدن «کی کیست» که آزمون خواندنِ این واحد هم می‌سنجد.
    glosses:
      llamo: اسمم است (از llamarse)
      Tengo: هستم / دارم (از tener)
      treinta: سی
      años: ساله
      vivo: زندگی می‌کنند (از vivir)
      abuelos: پدربزرگ و مادربزرگ
      madre: مادر
      padre: پدر
      viven: زندگی می‌کنند (از vivir)
      hermana: خواهر
      hermano: برادر
      somos: هستیم (از ser)
      cinco: پنج
      casa: خانه
      menor: کوچک‌تر
      tiene: است / دارد (از tener)
      veinte: بیست
  es.a1.unit03.lesson05.teach.hermana_menor:
    title: خواهر کوچک‌تر
    gloss: خواهر کوچک‌تر
    note: '*Menor* (کوچک‌تر) بعد از اسمی که توصیف می‌کند می‌آید و برای جنسیت تغییر نمی‌کند.'
  es.a1.unit03.lesson05.teach.vive_third_person:
    title: زندگی می‌کند (سوم شخص)
    gloss: زندگی می‌کند
    note: '*Vive* سوم شخص مفرد *vivir* است و برای حرف زدن دربارهٔ کس دیگری (*Elena vive*...) به کار می‌رود، نه برای خود گوینده (*vivo*، که در درس ۴ واحد ۱ و دوباره در درس ۴ همین واحد دیدید).'
  es.a1.unit03.lesson05.teach.sus_third_person_plural:
    title: مال او / آن‌ها (با اسم جمع)
    gloss: مال او / آن‌ها
    note: '*Sus* شکل جمعِ *su* است؛ همان‌طور که *su* برای اسم مفرد به معنی «مال او / آن‌ها / شما (رسمی)» است، sus هم برای اسم جمع به کار می‌رود. *sus abuelos* وقتی دربارهٔ النا حرف می‌زنیم یعنی «پدربزرگ و مادربزرگش».'
  es.a1.unit03.lesson06.teach.line01:
    title: نشان دادن عکس خانوادگی
    gloss: النا عکسی را به ماتئو نشان می‌دهد و پدر و مادرش و خواهر کوچکش را معرفی می‌کند.
    note: '*Estos son* (این‌ها هستند، مذکر یا مختلط جمع) پدر و مادر را معرفی می‌کند؛ *esta es* (این است، مؤنث مفرد) خواهر را.'
  es.a1.unit03.lesson06.teach.line02:
    title: واکنش نشان دادن و پرسیدن دربارهٔ خواهر و برادر
    gloss: ماتئو با گرمی واکنش نشان می‌دهد و می‌پرسد که خواهر یا برادر دیگری هم دارد یا نه.
    note: '*Qué bonito* واکنشی گرم و طبیعی به دیدن یک عکس است و کاربردش شبیه *Qué bien* در واحد ۱ است.'
  es.a1.unit03.lesson06.teach.line03:
    title: گفتن تعداد افراد خانه و پرسیدن همان سؤال
    gloss: النا می‌گوید یک خواهر و یک برادر دارد و توی خانه پنج نفرند، بعد از خانوادهٔ ماتئو می‌پرسد.
    note: '*Somos cinco en casa* تعداد کل افراد خانه را می‌گوید و الگوی درس ۴ را ادامه می‌دهد.'
  es.a1.unit03.lesson06.teach.line04:
    title: توصیف یک خانوادهٔ کوچک‌تر
    gloss: 'ماتئو می‌گوید خانواده‌اش کوچک‌تر است، فقط سه نفرند: پدر و مادرش و خودش، ولی پسرعمو و دخترعموی زیادی دارد.'
    note: '*Pero* (ولی) تفاوت میان خانوادهٔ کوچکِ نزدیک و فامیل زیاد را نشان می‌دهد.'
  es.a1.unit03.lesson06.teach.line05:
    title: پرسیدن دربارهٔ نزدیکی به پدر و مادر
    gloss: النا می‌پرسد ماتئو نزدیک پدر و مادرش زندگی می‌کند یا نه.
    note: '*Cerca de* (نزدیکِ) راه رایج گفتن نزدیکی مکانی است.'
  es.a1.unit03.lesson06.teach.line06:
    title: توضیح فاصله و ارتباط با هم
    gloss: ماتئو می‌گوید نه، آن‌ها در کلمبیا زندگی می‌کنند و هر هفته تلفنی حرف می‌زنند.
    note: 'این جمله همان اطلاعات واحد ۱ را ادامه می‌دهد: ماتئو اهل کلمبیا است ولی در لندن زندگی می‌کند و پدر و مادرش در کلمبیا مانده‌اند.'
  es.a1.unit03.lesson06.teach.line07:
    title: همدردی کردن و گفتن وضعیت خودتان
    gloss: النا می‌گوید متوجه است و خودش اینجا در اسپانیا با پدربزرگ و مادربزرگش زندگی می‌کند.
    note: '*Entiendo* (می‌فهمم) راه کوتاه و طبیعی نشان دادن این است که حرف طرف مقابل را شنیده‌اید، پیش از آنکه از وضعیت خودتان بگویید.'
  es.a1.unit03.lesson06.teach.line08:
    title: پایان دادن با یک جملهٔ صمیمی
    gloss: ماتئو می‌گوید خوب است که آدم خانواده‌اش نزدیکش باشد.
    note: '*Qué bien tener a la familia cerca* گفت‌وگو را با حسی گرم و متفکرانه تمام می‌کند و الگوی *qué bien* و *qué bonito* را در این گفت‌وگو ادامه می‌دهد.'
