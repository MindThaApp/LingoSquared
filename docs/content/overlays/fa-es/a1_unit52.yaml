  description: 'اسپانیایی مقدماتی برای توصیف ظاهر ساده‌ی آدم‌ها: برداشت کلی از قد و سن، رنگ مو و چشم، سؤال اصلی ¿Cómo es ...? و مقایسه‌ی ظاهر دو نفر.'
