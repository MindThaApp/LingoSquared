teaching:
  es.a1.unit52.lesson01.teach.alto_bajo:
    title: قدبلند و قدکوتاه
    gloss: قدبلند / قدکوتاه
    note: '*Alto* یعنی قدبلند و *bajo* یعنی قدکوتاه؛ هر دو با شخص مطابقت می‌کنند: *alta*، *baja*.'
    example_gloss:
    - لوسیا قدبلنده.
    - دیگو قدش کوتاهه.
  es.a1.unit52.lesson01.teach.mayor_joven:
    title: مسن و جوان
    gloss: مسن / جوان
    note: '*Mayor* و *joven* یک برداشت کلی از سن می‌دهند، نه تعداد دقیق سال‌ها.'
    example_gloss:
    - پدربزرگ مسنه.
    - ماتئو جوونه.
  es.a1.unit52.lesson01.teach.para_dar_la:
    title: 'Mayor: یک برداشت کلی، نه یک عدد'
    gloss: برای سن دقیق از tener años استفاده می‌شود، مثل ¿Cuántos años tienes?؛ mayor بدون عدد فقط یک برداشت کلی می‌دهد، مثل El abuelo es mayor.
    note: 'برای سن دقیق می‌گویید *tener años*: *¿Cuántos años tienes?* ولی *Mayor* فقط یک برداشت کلی می‌دهد، بدون عدد.'
  es.a1.unit52.lesson01.teach.lucia_es_alta:
    title: لوسیا قدبلنده و دیگو قدکوتاه
    gloss: لوسیا قدبلنده و دیگو قدش کوتاهه.
    note: یک جمله‌ی ساده با *y* («و»)، که زمینه را برای مقایسه‌ی مستقیم در درس‌های بعدی آماده می‌کند.
  es.a1.unit52.lesson02.teach.el_pelo:
    title: مو
    gloss: مو
    note: '*El pelo* مذکر است و وقتی درباره‌ی موی کسی به‌طور کلی حرف می‌زنید، مفرد می‌ماند.'
    example_gloss: ماتئو موهای کوتاه و مشکی داره.
  es.a1.unit52.lesson02.teach.rubio_castano_gris:
    title: بلوند، قهوه‌ای و خاکستری
    gloss: بلوند / قهوه‌ای / خاکستری
    note: 'سه رنگ مو: *rubio* (بلوند)، *castaño* (قهوه‌ای) و *gris* (خاکستری). *Rubio* با اسم مطابقت می‌کند: *pelo rubio*، *melena rubia*.'
    example_gloss:
    - النا موهای بلوند داره.
    - دیگو موهای قهوه‌ای داره.
    - پدربزرگ موهای خاکستری داره.
  es.a1.unit52.lesson02.teach.largo_corto:
    title: بلند و کوتاه (مو)
    gloss: بلند / کوتاه (مو)
    note: '*Largo* (بلند) از درس قد آمده و حالا برای طول مو به کار می‌رود؛ *corto* (کوتاه) تازه است: *el pelo largo*، *el pelo corto*.'
    example_gloss:
    - لوسیا موهای بلند داره.
    - دیگو موهای کوتاه داره.
  es.a1.unit52.lesson02.teach.el_adjetivo_va:
    title: صفت بعد از اسم می‌آید
    gloss: 'صفت بعد از اسم می‌آید: el pelo corto, el pelo largo, el pelo rubio, el pelo castaño, el pelo gris, el pelo negro.'
    note: 'در اسپانیایی صفت بعد از اسم می‌آید و با آن مطابقت می‌کند: *el pelo corto*، *el pelo rubio*. در فارسی هم صفت بعد از اسم می‌آید، ولی با اسم مطابقت جنس و تعداد ندارد.'
  es.a1.unit52.lesson02.teach.pelo_y_cabello:
    title: Pelo و cabello
    gloss: 'Pelo و cabello یک معنی دارند. در این دوره pelo را به کار می‌بریم: el pelo largo.'
    note: '*Pelo* و *cabello* هر دو در اسپانیایی روزمره یعنی «مو»؛ در این دوره *pelo* را به کار می‌بریم.'
  es.a1.unit52.lesson02.teach.mateo_tiene_el:
    title: ماتئو موهای کوتاه و مشکی داره
    gloss: ماتئو موهای کوتاه و مشکی داره.
    note: کلمه‌ی *negro* (مشکی) از درس لباس‌ها دوباره آمده.
  es.a1.unit52.lesson02.teach.elena_tiene_el:
    title: النا موهای بلند و بلوند داره
    gloss: النا موهای بلند و بلوند داره.
    note: واژه‌های طول و رنگ این درس در یک جمله‌ی طبیعی کنار هم آمده‌اند.
  es.a1.unit52.lesson03.teach.los_ojos:
    title: چشم‌ها
    gloss: چشم‌ها
    note: '*Los ojos* جمع *el ojo* است؛ هر دو مذکرند.'
    example_gloss: ماتئو چشم‌های قهوه‌ای داره.
  es.a1.unit52.lesson03.teach.azul_marron_verde:
    title: آبی، قهوه‌ای و سبز
    gloss: آبی / قهوه‌ای / سبز
    note: '*Azul* (آبی) و *verde* (سبز) برای هر دو جنس یک شکل دارند؛ *marrón* (قهوه‌ای) کلمه‌ی معمول برای رنگ چشم است، ولی برای مو *castaño* می‌گویند.'
    example_gloss:
    - النا چشم‌های آبی داره.
    - دیگو چشم‌های قهوه‌ای داره.
    - لوسیا چشم‌های سبز داره.
  es.a1.unit52.lesson03.teach.con_ojos_plural:
    title: Ojos صفت جمع می‌گیرد
    gloss: 'با ojos (جمع) صفت هم جمع می‌شود: ojos azules, ojos marrones, ojos verdes.'
    note: 'صفت‌ها در تعداد مطابقت می‌کنند: *ojos* جمع است، پس *azules*، *marrones*، *verdes*.'
  es.a1.unit52.lesson03.teach.como_es_elena:
    title: النا چه شکلیه؟
    gloss: النا چه شکلیه؟
    note: '*¿Cómo es ...?* سؤال اصلی این بخش است؛ با آن می‌توانید درباره‌ی ظاهر هر کسی بپرسید.'
  es.a1.unit52.lesson03.teach.elena_tiene_el:
    title: النا موهای بلند و بلوند و چشم‌های آبی داره
    gloss: النا موهای بلند و بلوند و چشم‌های آبی داره.
    note: یک پاسخ نمونه که مو و چشم را با *y* در یک جمله کنار هم می‌آورد.
  es.a1.unit52.lesson04.teach.elena_viene_una:
    title: النا نینا را معرفی می‌کنه
    gloss: 'النا: یه دختر تازه به کافه‌ی زبان میاد. اسمش نیناست.'
    note: '*Viene* («میاد») برای معرفی کسی تازه به کار می‌رود؛ *se llama* یعنی «اسمش ... است».'
  es.a1.unit52.lesson04.teach.mateo_genial_como:
    title: ماتئو می‌پرسه چه شکلیه
    gloss: 'ماتئو: عالیه! چه شکلیه؟'
    note: 'سؤال اصلی این بخش بدون اسم دوباره آمده: *¿Cómo es?*'
  es.a1.unit52.lesson04.teach.elena_es_baja:
    title: النا قد و موی نینا را توصیف می‌کنه
    gloss: 'النا: قدش کوتاهه و موهای کوتاه و بلوند داره.'
    note: '*baja* از درس اول با واژه‌های مو ترکیب شده؛ *baja* مؤنث است چون نینا دختر است.'
  es.a1.unit52.lesson04.teach.mateo_y_los:
    title: ماتئو درباره‌ی چشم‌هاش می‌پرسه
    gloss: 'ماتئو: چشم‌هاش چی؟'
    note: 'در اسپانیایی برای اعضای بدن معمولاً حرف تعریف می‌آید، نه صفت ملکی: *¿Y los ojos?* در فارسی می‌گوییم «چشم‌هاش»، ولی در اسپانیایی *sus* لازم نیست.'
  es.a1.unit52.lesson04.teach.elena_tiene_los:
    title: النا چشم‌های نینا را توصیف می‌کنه
    gloss: 'النا: چشم‌های سبز داره.'
    note: عبارت *los ojos verdes* از درس چشم‌ها دوباره آمده.
  es.a1.unit52.lesson04.teach.mateo_gracias_entonces:
    title: ماتئو او را می‌شناسه
    gloss: 'ماتئو: ممنون! پس می‌شناسمش.'
    note: '*La reconoceré* («او را خواهم شناخت») زمان آینده است؛ *la* یعنی «او را» و قبل از فعل می‌آید.'
  es.a1.unit52.lesson05.teach.diego_es_el:
    title: مقایسه‌ی دیگو و لوسیا
    gloss: دیگو و لوسیا برادر و خواهرند، ولی ظاهرشون فرق داره. دیگو قدش کوتاهه و موهای کوتاه و قهوه‌ای و چشم‌های قهوه‌ای داره. لوسیا از دیگو قدبلندتره و موهای بلند و قهوه‌ای و چشم‌های سبز داره. شما چه شکلی هستید؟
    note: یک مقایسه‌ی کوتاه که همه‌ی واژه‌های رنگ و طولِ تا اینجا را دوباره به کار می‌برد و با سؤال اصلی این بخش خطاب به خواننده تمام می‌شود.
    glosses:
      hermano: برادر
      hermana: خواهر
      eres: به نظر رسیدن
      diferentes: متفاوت
      bajo: کوتاه‌قد
      corto: کوتاه‌قد
      castaño: قهوه‌ای
      pelo: مو
      marrones: قهوه‌ای
      ojos: چشم‌ها
      alta: قدبلندتر
      largo: بلند
      verdes: سبز
      cómo: (بخشی از پرسش «چه شکلی است؟»)
  es.a1.unit52.lesson05.teach.ya_conoces_el:
    title: استفادهٔ دوبارهٔ الگوی مقایسه
    gloss: 'الگوی مقایسه را از قبل بلدید: más + صفت + que. اینجا برای آدم‌ها به کار می‌رود: لوسیا از دیگو قدبلندتر است.'
    note: الگوی *más + adjective + que* از درس مقایسه‌ها، که حالا برای آدم‌ها به‌کار می‌رود، نه برای اشیا.
  es.a1.unit52.lesson05.teach.lucia_tiene_el:
    title: موی لوسیا از موی دیگو بلندتر است
    gloss: موی لوسیا از موی دیگو بلندتر است.
    note: '*Más largo que* دو چیز را با هم مقایسه می‌کند: *el pelo más largo que Diego*. صفت *largo* مذکر می‌ماند، چون *pelo* مذکر است.'
  es.a1.unit52.lesson05.teach.tengo_el_pelo:
    title: موی من کوتاه و قهوه‌ای است
    gloss: موی من کوتاه و قهوه‌ای است.
    note: یک جملهٔ نمونه با *tengo* برای اول‌شخص؛ وقتی می‌خواهید خودتان را توصیف کنید، می‌توانید از آن استفاده کنید.
  es.a1.unit52.lesson06.teach.mateo_mira_es:
    title: ماتئو نینا را می‌بیند
    gloss: 'ماتئو: نگاه کن، اون نینا نیست؟ موهاش کوتاه و بوره و چشم‌هاش سبزه.'
    note: '*Mira* («نگاه کن») امر غیررسمی فعل *mirar* است و اینجا برای نشان دادن چیزی به کار رفته.'
  es.a1.unit52.lesson06.teach.elena_si_esa:
    title: الینا تأیید می‌کند
    gloss: 'الینا: آره، اون نیناست!'
    note: یک تأیید کوتاه و طبیعی.
  es.a1.unit52.lesson06.teach.nina_hola_eres:
    title: نینا به ماتئو سلام می‌کند
    gloss: 'نینا: سلام، شما ماتئو هستی؟'
    note: 'یک سؤال ساده برای احوال‌پرسی غیررسمی: *¿Eres ...?*'
  es.a1.unit52.lesson06.teach.mateo_si_encantado:
    title: ماتئو جواب سلام نینا را می‌دهد
    gloss: 'ماتئو: آره! از آشنایی باهات خوشحالم، نینا.'
    note: '*Encantado de conocerte* عبارت رایج برای اولین دیدار است؛ خانم‌ها می‌گویند *Encantada*.'
  es.a1.unit52.lesson06.teach.nina_encantada_de:
    title: نینا هم همین را می‌گوید
    gloss: 'نینا: منم از آشنایی باهات خوشحالم!'
    note: گفت‌وگو را تمام می‌کند؛ ماتئو نینا را از روی توصیف قبلی الینا شناخت.
