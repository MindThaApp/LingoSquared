teaching:
  es.a1.unit46.lesson01.teach.no_me_siento:
    title: احساس ناخوشی
    gloss: حالم خوب نیست.
    note: فعل *Sentirse* بازتابی است (*me siento*، *te sientes*)؛ *no me siento bien* روش کلی و ملایم برای گفتن این است که حالتان خوب نیست.
  es.a1.unit46.lesson01.teach.enfermo:
    title: بیمار
    gloss: بیمار
    note: 'صفتی پایه که با *estar* (برای حالت‌ها) به کار می‌رود: *estoy enfermo*.'
    example_gloss: من بیمارم.
  es.a1.unit46.lesson01.teach.estoy_enfermo:
    title: بیمار بودن
    gloss: من بیمارم.
    note: '*Enfermo* حالتی کلی‌تر و جدی‌تر از *no me siento bien* را بیان می‌کند و بسته به جنسیت گوینده تغییر می‌کند (*enferma*).'
  es.a1.unit46.lesson01.teach.dolor_de_cabeza:
    title: سردرد
    gloss: سردرد
    note: 'در اسپانیایی *dolor de cabeza* با *tener* و بدون حرف تعریف می‌آید: *tengo dolor de cabeza*.'
    example_gloss: سردرد دارم.
  es.a1.unit46.lesson01.teach.tengo_dolor_de:
    title: سردرد داشتن
    gloss: سردرد دارم.
    note: 'علائم بیماری با *tener* (داشتن) می‌آیند: *tengo dolor de cabeza*؛ در فارسی هم می‌گوییم «سردرد دارم».'
  es.a1.unit46.lesson01.teach.dolor_de_estomago:
    title: دل‌درد
    gloss: دل‌درد
    note: 'همان الگوی بدون حرف تعریف *dolor de cabeza*: *dolor de estómago*.'
    example_gloss: دل‌درد دارم.
  es.a1.unit46.lesson01.teach.tengo_dolor_de_2:
    title: دل‌درد داشتن
    gloss: دل‌درد دارم.
    note: از همان الگوی *tener* در *dolor de cabeza* پیروی می‌کند.
  es.a1.unit46.lesson02.teach.que_pasa:
    title: پرسیدن به شکل کلی
    gloss: چی شده؟
    note: روشی کلی و همه‌کاره برای پرسیدن اینکه مشکلی هست یا نه.
  es.a1.unit46.lesson02.teach.que_te_pasa:
    title: یک عبارت رایج
    gloss: چته؟ / چی شده؟
    note: '*¿Qué te pasa?* روش طبیعی پرسیدن اینکه چه مشکلی پیش آمده است (تحت‌اللفظی: «چه چیزی برایت اتفاق می‌افتد؟»)؛ آن را کلمه‌به‌کلمه ترجمه نکنید.'
  es.a1.unit46.lesson02.teach.dolor_de_garganta:
    title: گلودرد
    gloss: گلودرد
    note: 'همان الگوی *dolor de cabeza* و *dolor de estómago*: *dolor de garganta*.'
    example_gloss: گلودرد دارم.
  es.a1.unit46.lesson02.teach.tengo_dolor_de:
    title: گلودرد داشتن
    gloss: گلودرد دارم.
    note: از همان الگوی *tener* در سایر علائم پیروی می‌کند.
  es.a1.unit46.lesson02.teach.estas_bien_no:
    title: حال کسی را پرسیدن
    gloss: خوبی؟ نه، حالم خوب نیست.
    note: '*¿Estás bien?* سؤال خودمانی و بسیار رایج میان دوستان است؛ با کسی که او را با *usted* خطاب می‌کنید، می‌شود *¿Está bien?*.'
  es.a1.unit46.lesson03.teach.fiebre:
    title: تب
    gloss: تب
    note: 'بعد از *tener* بدون حرف تعریف می‌آید، مثل بقیهٔ علائم: *tengo fiebre*.'
    example_gloss: تب دارم.
  es.a1.unit46.lesson03.teach.tengo_fiebre:
    title: تب داشتن
    gloss: تب دارم.
    note: از الگوی *tener* پیروی می‌کند.
  es.a1.unit46.lesson03.teach.resfriado:
    title: سرما خوردن
    gloss: سرما خورده / سرما خوردن
    note: '*Resfriado* صفتی است که با *estar* می‌آید؛ با اسم *resfriado* هم می‌توانید بگویید *tengo un resfriado*.'
    example_gloss: سرما خورده‌ام.
  es.a1.unit46.lesson03.teach.estoy_resfriado:
    title: گفتن اینکه سرما خورده‌اید
    gloss: سرما خورده‌ام.
    note: 'اسپانیایی برای «سرما خورده‌ام» می‌تواند صفت به کار ببرد: *estoy resfriado*؛ این صفت بسته به جنسیت گوینده تغییر می‌کند (*resfriada*).'
  es.a1.unit46.lesson03.teach.enfermo_y_resfriado:
    title: انتخاب estar یا tener به نوع کلمه بستگی دارد
    gloss: 'Enfermo و resfriado صفت هستند و با estar می‌آیند: بیمارم، سرما خورده‌ام. Fiebre و dolor de cabeza اسم هستند و با tener می‌آیند: تب دارم، سردرد دارم.'
    note: 'انتخاب بین *estar* و *tener* به نوع کلمه بستگی دارد: صفت‌ها (*enfermo*، *resfriado*) با *estar* و اسم‌های علائم (*fiebre*، *dolor de cabeza*) با *tener* می‌آیند.'
  es.a1.unit46.lesson04.teach.la_farmacia:
    title: داروخانه
    gloss: داروخانه
    note: 'اسمی مؤنث: *la farmacia*.'
    example_gloss: دارم می‌روم داروخانه.
  es.a1.unit46.lesson04.teach.en_que_puedo:
    title: احوال‌پرسی داروساز
    gloss: چه کمکی از من برمی‌آید؟
    note: '*¿En qué puedo ayudarle?* جملهٔ رسمی و استاندارد خدمات است؛ در *ayudarle* ضمیر مفعولی رسمی *le* برای *usted* به کار رفته است.'
  es.a1.unit46.lesson04.teach.tiene_algo_para:
    title: چیزی برای یک علامت خواستن
    gloss: برای سردرد چیزی دارید؟
    note: '*Algo para* + علامت روش طبیعی خواستن دارو است: *algo para el dolor de cabeza*.'
  es.a1.unit46.lesson04.teach.una_pastilla:
    title: یک قرص
    gloss: قرص
    note: 'اسمی مؤنث: *la pastilla*؛ *una pastilla* یعنی یک قرص.'
    example_gloss: یک قرص می‌خورم.
  es.a1.unit46.lesson04.teach.toma_una_pastilla:
    title: دستور مصرف
    gloss: روزی دو بار یک قرص بخورید.
    note: '*Toma* امر خودمانی فعل *tomar* (خوردن، گرفتن) است و برای دستورها به کار می‌رود.'
  es.a1.unit46.lesson04.teach.en_la_farmacia:
    title: لحن مناسب در داروخانه
    gloss: در داروخانه از شکل محترمانه‌ی usted استفاده می‌کنید.
    note: 'داروساز یک بزرگسال ناآشناست که کارش خدمات‌دهی است، برای همین از *usted* استفاده می‌کنید: *¿Tiene algo...?* به‌جای *¿Tienes algo...?*.'
  es.a1.unit46.lesson05.teach.consejo_toma_una:
    title: خواندن یک توصیه‌نامه‌ی داروخانه
    gloss: 'توصیه: روزی دو بار یک قرص با آب بخورید. خوب استراحت کنید و آب زیاد بنوشید. بعد از سه روز هنوز حالتان خوب نیست؟ پس به پزشک مراجعه کنید.'
    note: به مقدار مصرف دارو، دو توصیه‌ی غیردارویی و زمان مراجعه به پزشک دقت کنید.
    glosses:
      Consejo: توصیه
      toma: بخور
      veces: بار
      día: روز
      pastilla: قرص
      Descansa: استراحت کن
      bebe: بنوش
      sentirte: احساس کردن
      sigues: هنوز
      bien: خوب
      médico: پزشک
  es.a1.unit46.lesson06.teach.elena_hola_mateo:
    title: احوال‌پرسی الِنا
    gloss: 'الِنا: سلام ماتئو، چطوری؟ الان حالت بهتره؟'
    note: '*Ya* (تا الان، دیگر) نشان می‌دهد الِنا می‌پرسد آیا از آخرین باری که حرف زده‌اند حال ماتئو بهتر شده یا نه؛ *te sientes* شکل صمیمی *tú* از فعل *sentirse* است.'
  es.a1.unit46.lesson06.teach.mateo_todavia_no:
    title: ماتئو هنوز حالش خوب نیست
    gloss: 'ماتئو: هنوز نه، زیاد خوب نیستم. هنوز سردرد دارم و خسته‌ام.'
    note: '*Sigo con* (هنوز دارم) نشان می‌دهد سردرد از بین نرفته؛ *cansado* (خسته) صفت جدید و مفیدی است که با جنسیت عوض می‌شود (*cansada*).'
  es.a1.unit46.lesson06.teach.elena_has_tomado:
    title: الِنا درباره‌ی دارو می‌پرسد
    gloss: 'الِنا: قرص خوردی؟'
    note: '*Has tomado* ماضی نقلی است: *has* + اسم مفعول *tomado*، همان ساختار *me has ayudado*.'
  es.a1.unit46.lesson06.teach.mateo_si_he:
    title: ماتئو تأیید می‌کند
    gloss: 'ماتئو: آره، یک قرص خوردم. الان می‌خوام استراحت کنم.'
    note: '*Voy a descansar* (می‌خواهم استراحت کنم) از ساختار آینده‌ی نزدیک *ir a* + مصدر استفاده می‌کند.'
  es.a1.unit46.lesson06.teach.elena_buena_idea:
    title: الِنا برایش آرزوی بهبودی می‌کند
    gloss: 'الِنا: فکر خوبیه. خوب استراحت کن. زود خوب بشی!'
    note: '*¡Que te mejores!* عبارت ثابت و رایج برای آرزوی بهبودی زودهنگام است؛ از وجه التزامی *mejores* استفاده می‌کند.'
  es.a1.unit46.lesson06.teach.mateo_gracias_hasta:
    title: ماتئو خداحافظی می‌کند
    gloss: 'ماتئو: مرسی، تا فردا!'
    note: '*Hasta mañana* از الگوی *hasta* + زمان در خداحافظی‌ها پیروی می‌کند، مثل *hasta luego*.'
