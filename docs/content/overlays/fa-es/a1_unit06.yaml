course:
  title: اسپانیایی A1
  description: سفارش غذا و نوشیدنی در رستوران، خواندن یک منوی ساده و درخواست صورت‌حساب؛ ادامهٔ داستان النا و ماتئو در ناهاری که در درس پنجم قرارش را گذاشتند. تأکید ویژه بر این است که Quiero و Para mí هر دو عبارت‌های طبیعی برای سفارش دادن‌اند.
