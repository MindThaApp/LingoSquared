teaching:
  es.a1.unit06.lesson01.teach.sandwich_ensalada:
    title: ساندویچ، سالاد
    gloss: ساندویچ، سالاد
    note: هر دو واژه قرضی‌اند؛ *sándwich* از زبانی دیگر آمده و برای نشان دادن هجای تکیه‌دار، نشانهٔ تکیه (اکسان) دارد.
    example_gloss:
    - یک ساندویچ می‌خوام.
    - سالاد گوجه دارد.
  es.a1.unit06.lesson01.teach.sopa:
    title: سوپ
    gloss: سوپ
    note: '*Sopa* مؤنث است، مثل بیشتر اسم‌های اسپانیایی که به -a ختم می‌شوند.'
    example_gloss: سوپ خیلی خوشمزه است.
  es.a1.unit06.lesson01.teach.agua_cafe:
    title: آب، قهوه
    gloss: آب، قهوه
    note: کلمهٔ *Agua* از نظر دستوری مؤنث است، ولی در حالت مفرد به‌خاطر اینکه با صدای تکیه‌دارِ *a* شروع می‌شود، حرف تعریف مذکر *el* می‌گیرد (نه *la*). این یک بی‌قاعدگی واقعی در زبان اسپانیایی است، نه غلط تایپی.
    example_gloss:
    - آب می‌خوام، لطفاً.
    - برای من یک قهوه.
  es.a1.unit06.lesson02.teach.quiero_un_sandwich:
    title: یک ساندویچ می‌خوام
    gloss: یک ساندویچ می‌خوام.
    note: '*Quiero* («می‌خوام») صورت اول‌شخص مفرد فعل *querer* است؛ فعلی تازه در این درس.'
  es.a1.unit06.lesson02.teach.para_mi_un_cafe:
    title: برای من، یک قهوه
    gloss: برای من یک قهوه.
    note: '*Para mí* («برای من») عبارت رایج دیگری برای سفارش دادن است؛ بدون تکرار فعل، فقط نام چیزی را می‌گویید. نکتهٔ دستوری بعدی را ببینید.'
  es.a1.unit06.lesson02.teach.que_quieres_comer:
    title: پرسیدن اینکه کسی چه می‌خواهد بخورد
    gloss: چی می‌خوای بخوری؟
    note: '*Quieres* صورت *tú* فعل *querer* است، یعنی لحن دوستانه و خودمانی.'
  es.a1.unit06.lesson02.teach.quiero_vs_para_mi_note:
    title: Quiero vs. Para mí
    gloss: دو روش به یک اندازه طبیعی برای سفارش دادن.
    note: هنگام سفارش دادن، هم *Quiero un café* و هم *Para mí, un café* درست‌اند.
    target_text: هر دوی *Quiero* («می‌خوام») و *Para mí* («برای من»، که پیش از نام غذا گفته می‌شود) در موقعیت دوستانه روش‌های طبیعی و به یک اندازه مؤدبانه برای سفارش دادن‌اند؛ هیچ‌کدام درست‌تر از دیگری نیست.
  es.a1.unit06.lesson03.teach.el_menu:
    title: منو
    gloss: منو
    note: '*Menú* نشانهٔ تکیه (اکسان) دارد، چون تکیه روی هجای آخر است.'
    example_gloss: می‌شود منو را ببینیم؟
  es.a1.unit06.lesson03.teach.podemos_ver_el_menu:
    title: درخواست دیدن منو
    gloss: می‌شود منو را ببینیم؟
    note: '*Podemos* («می‌توانیم») صورت اول‌شخص جمع فعل *poder* است؛ فعلی تازه در این درس.'
  es.a1.unit06.lesson03.teach.aqui_tiene:
    title: بفرمایید
    gloss: بفرمایید.
    note: '*Aquí tiene* عبارت معمولی است که گارسون موقع دادن چیزی به مشتری می‌گوید. فعل آن به شکل محترمانهٔ *usted* است، حتی در گفت‌وگوی خودمانی؛ یک عبارت ثابت مؤدبانه است، نه تغییر لحن.'
  es.a1.unit06.lesson03.teach.buen_provecho:
    title: نوش جان
    gloss: نوش جان
    note: '*Buen provecho* عبارت معمولی است که پیش از شروع غذا خوردن کسی به او می‌گویند؛ کاربردش شبیه «نوش جان» یا «بفرمایید» در فارسی است.'
    example_gloss: بفرمایید. نوش جان.
  es.a1.unit06.lesson04.teach.el_postre:
    title: دسر
    gloss: دسر
    note: '*Postre* مذکر است.'
    example_gloss: برای دسر، کیک می‌خوام.
  es.a1.unit06.lesson04.teach.de_postre_quiero_pastel:
    title: سفارش دسر
    gloss: برای دسر، کیک می‌خوام.
    note: '*De postre* (برای دسر) برای گفتن سفارشِ آخرِ غذا به کار می‌رود، درست مثل *para mí* که برای سفارش غذای اصلی می‌آید.'
  es.a1.unit06.lesson04.teach.la_cuenta_por_favor:
    title: صورت‌حساب خواستن
    gloss: لطفاً صورت‌حساب.
    note: '*La cuenta* (صورت‌حساب) روش معمول برای درخواست پرداخت در پایان غذاست.'
  es.a1.unit06.lesson05.teach.menu_reading:
    title: خواندن منو
    gloss: 'منو: ساندویچ، پنج. سالاد، هشت. سوپ، سه. قهوه یا آب، رایگان. دسر: کیک.'
    note: یک منوی چاپی واقعی که از واژه‌های غذایی همین درس استفاده می‌کند و کنارشان قیمت هم آمده است.
    glosses:
      Menú: منو
      sándwich: ساندویچ
      Ensalada: سالاد
      Sopa: سوپ
      Café: قهوه
      agua: آب
      incluido: همراه غذا، بدون هزینه
      Postre: دسر
      pastel: کیک
  es.a1.unit06.lesson05.teach.incluido_note:
    title: Incluido (همراه غذا، بدون هزینه)
    gloss: وقتی کنار نوشیدنی در منو incluido نوشته شده، یعنی چه.
    note: '*Incluido* = همراه غذا، بدون هزینهٔ اضافه.'
    target_text: '*Incluido* (شامل) یعنی نوشیدنی همراه غذا و بدون هزینهٔ اضافه است.'
  es.a1.unit06.lesson06.teach.line01:
    title: سلام و پرسیدن سفارش
    gloss: گارسون به الینا و ماتئو سلام می‌کنه و می‌پرسه چی میل دارن بخورن.
    note: '*Buenas tardes* (عصر بخیر) از ظهر به بعد گفته می‌شه، برای همین برای وقت ناهار مناسبه.'
  es.a1.unit06.lesson06.teach.line02:
    title: سفارش الینا
    gloss: الینا یک سالاد و آب سفارش می‌ده.
    note: '*Una ensalada y agua* = یک سالاد و آب.'
  es.a1.unit06.lesson06.teach.line03:
    title: سفارش ماتئو
    gloss: ماتئو برای خودش یک ساندویچ و یک قهوه سفارش می‌ده.
    note: به جای تکرار *Quiero* از *Para mí* استفاده شده.
  es.a1.unit06.lesson06.teach.line04:
    title: پرسیدن دربارهٔ دسر
    gloss: گارسون سفارش را تأیید می‌کنه و می‌پرسه دسر هم می‌خوان یا نه.
    note: '*¿Algo de postre?* (دسر چیزی میل دارید؟) روشی طبیعی و کوتاه برای پیشنهاد دسره.'
  es.a1.unit06.lesson06.teach.line05:
    title: سفارش دسر برای دو نفر
    gloss: الینا می‌گه بله، یک کیک برای هر دوشون.
    note: '*Para los dos* (برای هر دوی ما) یعنی یک دسر بین دو نفر تقسیم می‌شه، انتخابی طبیعی در زندگی واقعی.'
  es.a1.unit06.lesson06.teach.line06:
    title: موافقت و خواستن صورت‌حساب
    gloss: ماتئو موافقت می‌کنه و صورت‌حساب می‌خواد.
    note: '*La cuenta, por favor* = لطفاً صورت‌حساب.'
  es.a1.unit06.lesson06.teach.line07:
    title: آوردن صورت‌حساب
    gloss: گارسون صورت‌حساب را بهشون می‌ده.
    note: '*Aquí tiene* وقتی گفته می‌شه که چیزی را به کسی می‌دیم.'
  es.a1.unit06.lesson06.teach.line08:
    title: پایان گرم
    gloss: الینا از گارسون تشکر می‌کنه و می‌گه غذا چقدر خوب بود.
    note: '*¡Qué buena comida!* همان الگوی تعجبی *¡Qué ...!* را دارد که در *¡Qué bien!* و *¡Qué bonito!* هست.'
