teaching:
  es.a1.unit50.lesson01.teach.juntos:
    title: با هم
    gloss: با هم
    note: '*Juntos* روشن می‌کند که چند نفر کاری را با هم انجام می‌دهند؛ با افراد هم‌جنس می‌شود (اگر همه زن باشند *juntas*).'
    example_gloss: با هم قهوه بخوریم؟
  es.a1.unit50.lesson01.teach.tomar_un_cafe:
    title: قهوه خوردن
    gloss: قهوه خوردن
    note: در اسپانیایی برای قهوه خوردن می‌گویند *tomar un café* (یعنی «یک قهوه برداشتن»)؛ فعل «نوشیدن» به کار نمی‌رود.
  es.a1.unit50.lesson01.teach.ir_al_cine:
    title: رفتن به سینما
    gloss: رفتن به سینما
    note: '*Ir al cine* («رفتن به سینما») راه معمول گفتن رفتن برای دیدن فیلم است؛ *al* یعنی *a* + *el*.'
  es.a1.unit50.lesson01.teach.tomamos_un_cafe:
    title: قهوه بخوریم؟
    gloss: قهوه بخوریم؟
    note: '*¿Tomamos ...?* از زمان حال *nosotros* استفاده می‌کند تا کاری را با هم پیشنهاد دهد.'
  es.a1.unit50.lesson01.teach.tomamos_algo_es:
    title: استفاده از ¿Tomamos ...?
    gloss: ¿Tomamos + چیزی؟ راه معمول پیشنهاد دادن یک کار دسته‌جمعی است.
    note: 'در فارسی هم برای پیشنهاد گاهی از «... بکنیم؟» استفاده می‌کنیم؛ در اسپانیایی صورت *nosotros* (*tomamos*) همین کار را می‌کند: *¿Tomamos un café?*'
  es.a1.unit50.lesson01.teach.tienes_ganas_de:
    title: حال داری بریم سینما؟
    gloss: حال داری بریم سینما؟
    note: '*¿Tienes ganas de ...?* به‌صورت غیررسمی می‌پرسد کسی حال انجام کاری را دارد یا نه؛ بعد از *de* مصدر می‌آید.'
  es.a1.unit50.lesson02.teach.si_que_bien:
    title: آره، عالیه!
    gloss: آره، عالیه!
    note: '*¡Sí, qué bien!* یک قبول کردن کوتاه و پرشور است.'
  es.a1.unit50.lesson02.teach.buena_idea:
    title: فکر خوبیه
    gloss: فکر خوبیه!
    note: '*¡Buena idea!* پیشنهاد را با تعریف از آن می‌پذیرد.'
  es.a1.unit50.lesson02.teach.es_un_buen:
    title: برنامهٔ خوبیه
    gloss: برنامهٔ خوبیه.
    note: این پاسخ مثبتِ کمی کامل‌تری است.
  es.a1.unit50.lesson02.teach.lo_siento_no:
    title: رد کردن با ذکر دلیل
    gloss: متأسفم، نمی‌تونم، چون کار دارم.
    note: '*Lo siento* رد کردن را نرم‌تر می‌کند و *porque* دلیل کوتاه را می‌آورد.'
  es.a1.unit50.lesson02.teach.no_tengo_tiempo:
    title: وقت ندارم
    gloss: وقت ندارم.
    note: '*No tengo tiempo* دلیلی صریح اما عادی برای رد کردن است؛ *no* قبل از فعل می‌آید.'
  es.a1.unit50.lesson02.teach.lo_siento_no_2:
    title: رد کردن مؤدبانه
    gloss: Lo siento + no puedo + یک دلیل کوتاه، رد کردن را مؤدبانه می‌کند.
    note: گفتن دلیل در گفت‌وگو الزامی نیست، ولی جمله را کامل‌تر و مؤدبانه‌تر می‌کند.
  es.a1.unit50.lesson03.teach.quedar:
    title: قرار گذاشتن
    gloss: قرار گذاشتن
    note: '*Quedar* یعنی قرار گذاشتن: *¿Quedamos el viernes?* خیلی از اهالی آمریکای لاتین به‌جای آن می‌گویند *¿Nos vemos el viernes?*'
    example_gloss: جمعه ساعت ۲:۳۰ همدیگر را ببینیم؟
  es.a1.unit50.lesson03.teach.quedamos_el_viernes:
    title: جمعه ساعت دو و نیم
    gloss: جمعه ساعت ۲:۳۰ قرار بذاریم؟
    note: این جمله روز هفته یعنی *el viernes* را با *a las* و ساعت ترکیب می‌کند.
  es.a1.unit50.lesson03.teach.las_dos_y:
    title: y media یعنی و نیم
    gloss: las dos y media یعنی ۲:۳۰؛ a las dos y media ساعت قرار را می‌گوید.
    note: 'در اسپانیایی هم مثل فارسی («دو و نیم») ساعت از ساعتِ گذشته شمرده می‌شود: *las dos y media* یعنی ۲:۳۰، یعنی «دو و نیم».'
  es.a1.unit50.lesson03.teach.el_viernes_17:
    title: یک تاریخ و ساعت
    gloss: جمعه ۱۷ آوریل ساعت ۳:۱۵
    note: 'در اسپانیایی روزهای هفته و نام ماه‌ها با حرف کوچک نوشته می‌شوند و در تاریخ از *de* استفاده می‌شود: *el viernes 17 de abril*.'
  es.a1.unit50.lesson03.teach.si_el_viernes:
    title: تأیید ساعت
    gloss: آره، جمعه ساعت ۲:۳۰ خوبه.
    note: '*Me viene bien* («برایم مناسب است») تأیید می‌کند که ساعت پیشنهادی جور است.'
  es.a1.unit50.lesson04.teach.el_mensaje_la:
    title: پیام، دعوت‌نامه، کافهٔ زبان
    gloss: پیام، دعوت‌نامه، کافهٔ زبان
    note: '*Un mensaje* یک پیام کوتاه نوشتاری یا دیجیتال است، *una invitación* از کسی می‌خواهد در کاری شرکت کند و *el café de idiomas* محل دیدار گروه است.'
    example_gloss:
    - من یک پیام از النا دارم.
    - این دعوت‌نامه‌ای برای کافهٔ زبان است.
    - ما در کافهٔ زبان قهوه می‌خوریم.
  es.a1.unit50.lesson04.teach.hola_mateo_tienes:
    title: دعوت‌نامهٔ النا
    gloss: سلام ماتئو، حال داری شنبه ۱۸ آوریل ساعت ۲:۳۰ توی کافهٔ زبان قهوه بخوریم؟ با احترام، النا.
    note: 'برای چهار جزئیات بخوانید: کار، تاریخ، ساعت و مکان.'
    glosses:
      Hola: سلام
      ganas: میل (tener ganas de = حال چیزی را داشتن)
      sábado: شنبه
      abril: آوریل
      media: نیم (y media = و نیم)
      dos: دو
      café: قهوه
      tomar: نوشیدن / خوردن
      idiomas: کافهٔ زبان
      saludo: با احترام
  es.a1.unit50.lesson05.teach.hola_mateo_vamos:
    title: یک پیام پیشنهاد
    gloss: سلام Mateo، جمعه ساعت 2:30 با هم قهوه بخوریم؟ با احترام، Elena.
    note: این پیام شامل سلام، فعالیت، روز، ساعت و جملهٔ پایانی است.
    glosses:
      Hola: سلام
      vamos: بخوریم (پیشنهاد)
      viernes: جمعه
      media: و نیم
      dos: دو
      café: قهوه
      tomar: نوشیدن / خوردن
      saludo: با احترام
  es.a1.unit50.lesson05.teach.hola_elena_si:
    title: یک پیام تأیید
    gloss: سلام Elena، آره، عالیه! جمعه ساعت 2:30 برام خوبه. جمعه می‌بینمت! Mateo.
    note: در این جواب، هم پیشنهاد قبول می‌شود و هم برنامه دوباره گفته می‌شود تا تأیید شود.
    glosses:
      Hola: سلام
      bien: عالیه
      viernes: جمعه
      media: و نیم
      dos: دو
      viene: خوب / مناسب
      Hasta: تا / به امید دیدار
  es.a1.unit50.lesson05.teach.un_mensaje_corto:
    title: یک پیام شامل چه چیزهایی است
    gloss: یک پیام کوتاه فعالیت، روز یا تاریخ و ساعت را می‌گوید.
    note: سلام و خداحافظی مفید هستند، ولی مهم‌ترین چیزها فعالیت و زمانِ انجام آن هستند.
  es.a1.unit50.lesson06.teach.elena_tomamos_un:
    title: Elena قهوه پیشنهاد می‌دهد
    gloss: 'Elena: جمعه قهوه بخوریم؟ Mateo: آره، عالیه! چه ساعتی؟'
    note: Mateo اول فعالیت را قبول می‌کند و بعد دربارهٔ ساعت می‌پرسد.
  es.a1.unit50.lesson06.teach.elena_a_las:
    title: ساعت اولِ Elena
    gloss: 'Elena: ساعت 2:30.'
    note: '*Las dos y media* یعنی 2:30، مثل درس گفتن ساعت.'
  es.a1.unit50.lesson06.teach.mateo_lo_siento:
    title: Mateo ساعت دیگری پیشنهاد می‌دهد
    gloss: 'Mateo: ببخشید، ساعت 2:30 نمی‌تونم. ساعت 3:15 می‌شه؟'
    note: '*¿Puede ser a ...?* راهی کوتاه برای پرسیدن است که ساعت دیگری هم مناسب هست یا نه.'
  es.a1.unit50.lesson06.teach.elena_si_a:
    title: آن‌ها برنامهٔ نهایی را تأیید می‌کنند
    gloss: 'Elena: آره، 3:15 برام خوبه. Mateo: برنامهٔ خوبیه. پس جمعه ساعت 3:15 همدیگر را می‌بینیم.'
    note: اینجا *quedamos* دوباره شکل *nosotros* است و این بار برای تأیید برنامه به کار می‌رود.
