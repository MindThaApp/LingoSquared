  es.a1.unit50.lesson02.aceptar_o_rechazar_un:
    title: قبول یا رد کردن یک قرار
  es.a1.unit50.lesson03.quedar_un_dia_y:
    title: هماهنگ کردن روز و ساعت
  es.a1.unit50.lesson04.leer_una_invitacion:
    title: خواندن یک دعوت‌نامه
