teaching:
  es.a1.unit47.lesson01.teach.llamar:
    title: زنگ زدن
    gloss: زنگ زدن
    note: مصدر فعلی که برای تماس تلفنی به کار می‌رود.
    example_gloss: باید بهت زنگ بزنم.
  es.a1.unit47.lesson01.teach.te_llamo:
    title: گفتن اینکه زنگ می‌زنید
    gloss: بهت زنگ می‌زنم.
    note: '*Llamo* شکل *yo* فعل *llamar* است؛ با *te* یعنی «بهت زنگ می‌زنم». در اسپانیایی، مثل فارسی، برای کاری که می‌خواهید به‌زودی انجام بدهید از زمان حال استفاده می‌شود.'
  es.a1.unit47.lesson01.teach.hola_soy_elena:
    title: جواب دادن به تلفن
    gloss: سلام، من Elena هستم.
    note: در اسپانیایی پای تلفن با *soy* + اسم (که معنی تحت‌اللفظی‌اش «هستم» است) خودتان را معرفی می‌کنید؛ در فارسی هم مثلاً می‌گوییم «الناز هستم».
  es.a1.unit47.lesson01.teach.hola_soy_mateo:
    title: Mateo هم همین‌طور جواب می‌دهد
    gloss: سلام، من Mateo هستم.
    note: همان الگوی *soy* + اسم مثل *Hola, soy Elena*.
  es.a1.unit47.lesson02.teach.con_quien_hablo:
    title: پرسیدن اینکه چه کسی زنگ زده
    gloss: با کی صحبت می‌کنم؟
    note: وقتی نمی‌دانید چه کسی زنگ زده، عبارت معمول *¿Con quién hablo?* است.
  es.a1.unit47.lesson02.teach.habla_con_elena:
    title: معرفی رسمی خود
    gloss: با Elena صحبت می‌کنید.
    note: '*Habla con* + اسم از شکل رسمی (*usted*) فعل *hablar* استفاده می‌کند؛ معادل مؤدبانه‌ی *soy* + اسم.'
  es.a1.unit47.lesson03.teach.puedes_repetir_eso:
    title: خواستن تکرار
    gloss: می‌شه اون رو تکرار کنی؟
    note: '*¿Puedes...?* (می‌تونی ...؟) به‌اضافه‌ی *repetir* (تکرار کردن) و *eso* (آن).'
  es.a1.unit47.lesson03.teach.no_hables_tan:
    title: خواستن از کسی که آهسته‌تر حرف بزند
    gloss: لطفاً این‌قدر تند حرف نزن.
    note: '*No hables* امر منفی غیررسمی فعل *hablar* است؛ *tan rápido* (این‌قدر تند) میزان را نشان می‌دهد.'
  es.a1.unit47.lesson03.teach.no_te_oigo:
    title: گفتن اینکه خوب نمی‌شنوید
    gloss: صدات رو خوب نمی‌شنوم.
    note: فعل *Oír* (شنیدن) همراه با *no ... bien* (خوب نمی‌شنوم) مشکل شنوایی را بیان می‌کند و با *entender* (فهمیدن) فرق دارد؛ *te oigo* یعنی «صدایت را می‌شنوم».
  es.a1.unit47.lesson04.teach.el_mensaje:
    title: پیامک
    gloss: پیامک
    note: 'اسم مذکر است: *el mensaje*. در زبان اسپانیایی *el SMS* یا *el texto* هم می‌گویند، ولی *mensaje* انتخاب خنثی و معمول است. در فارسی «پیامک» جنسیت دستوری ندارد، اما در اسپانیایی باید جنس اسم را همراه آن یاد بگیرید.'
    example_gloss: پیامک از طرف النا است.
  es.a1.unit47.lesson04.teach.te_envio_un:
    title: گفتن اینکه پیامک می‌فرستید
    gloss: برایتان پیامک می‌فرستم.
    note: 'فعل *Enviar* (فرستادن) بعد از ضمیر *te* (به تو) می‌آید: *te envío un mensaje*.'
  es.a1.unit47.lesson04.teach.te_llamo_mas:
    title: گفتن اینکه بعداً زنگ می‌زنید
    gloss: بعداً بهت زنگ می‌زنم.
    note: 'عبارت *Más tarde* (بعداً) در آخر جمله می‌آید: *te llamo más tarde*.'
  es.a1.unit47.lesson05.teach.mateo_hola_elena:
    title: خواندن گفتگوی پیامکی
    gloss: 'ماتئو: سلام النا، می‌شه بهم زنگ بزنی؟ باید یه چیزی بهت بگم. النا: آره حتماً، پنج دقیقه دیگه بهت زنگ می‌زنم.'
    note: دقت کنید ماتئو چه چیزی می‌خواهد، چرا، و النا می‌گوید چه زمانی زنگ می‌زند.
    glosses:
      Hola: سلام
      puedes: می‌تونی
      llamarme: زنگ زدن
      Tengo: باید
      algo: یه چیزی
      contarte: گفتن
      claro: حتماً
      llamada: زنگ زدن
      cinco: پنج
      minutos: دقیقه
      devuelvo: پس دادن
  es.a1.unit47.lesson06.teach.mateo_hola_soy:
    title: ماتئو تماس را جواب می‌دهد
    gloss: 'ماتئو: سلام، ماتئو هستم.'
    note: 'همان الگوی *soy* + اسم از درس اول، حالا در تماس تلفنی واقعی: کسی که گوشی را برمی‌دارد اول حرف می‌زند و اسمش را می‌گوید.'
  es.a1.unit47.lesson06.teach.elena_hola_mateo:
    title: النا خودش را معرفی می‌کند
    gloss: 'النا: سلام ماتئو، النا هستم. ماتئو: ممنون که زنگ زدی!'
    note: '*Gracias por llamar* (ممنون که زنگ زدی) یعنی *gracias por* + مصدر.'
  es.a1.unit47.lesson06.teach.elena_como_ha:
    title: النا درباره‌ی شیفت می‌پرسد
    gloss: 'النا: اولین شیفتت چطور گذشت؟'
    note: '*Ha ido* ماضی نقلی فعل *ir* است (اینجا یعنی «پیش رفتن، گذشتن»): *ha* + اسم مفعول *ido*.'
  es.a1.unit47.lesson06.teach.mateo_ha_ido:
    title: ماتئو خبر خوب می‌دهد
    gloss: 'ماتئو: خیلی خوب گذشت، بهتر از چیزی که فکر می‌کردم.'
    note: '*Ha ido muy bien* همان ماضی نقلی سؤال را تکرار می‌کند؛ *mejor de lo esperado* (بهتر از انتظار) با *de lo* مقایسه می‌کند.'
  es.a1.unit47.lesson06.teach.ha_ido_ir:
    title: ha ido، es و esperado همراه با مصدرشان
    gloss: ha ido ← ir (رفتن)، es ← ser (بودن)، esperado ← esperar (انتظار داشتن)
    note: '*Ha ido*، *es* و *esperado* همراه با مصدرشان آمده‌اند: *ir*، *ser*، *esperar*. فعلاً *ha ido muy bien* را یک عبارت ثابت بدانید؛ ماضی نقلی بعداً درست تمرین می‌شود.'
  es.a1.unit47.lesson06.teach.elena_que_bien:
    title: النا افتخار می‌کند
    gloss: 'النا: چه خوب که اینو می‌شنوم! بهت افتخار می‌کنم.'
    note: '*Orgulloso/a de* (مفتخر به، سربلند از) ترکیب ثابتی با *de* است؛ صفت با گوینده مطابقت می‌کند (برای النا *orgullosa*).'
  es.a1.unit47.lesson06.teach.mateo_muchas_gracias:
    title: ماتئو احساساتی می‌شود
    gloss: 'ماتئو: خیلی ممنون، این برام خیلی ارزش داره.'
    note: '*Significa* سوم‌شخص مفرد فعل *significar* (معنی دادن) است؛ *para mí* (برای من) نشان می‌دهد برای چه کسی مهم است.'
  es.a1.unit47.lesson06.teach.su_primer_turno:
    title: مال او
    gloss: اولین شیفتش خیلی خوب گذشت.
    note: '*Su* اینجا یعنی «مال او» (با *usted* یعنی «مال شما» هم می‌شود)؛ از موقعیت می‌فهمید مال کیست. در فارسی این را با شناسه‌ی «-ش» یا «-شان» می‌گوییم.'
