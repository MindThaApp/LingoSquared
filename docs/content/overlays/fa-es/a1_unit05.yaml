teaching:
  es.a1.unit05.lesson01.teach.que_hora_es:
    title: پرسیدن ساعت
    gloss: ساعت چند است؟
    note: '*Qué hora* (چه ساعتی) درباره‌ی ساعتِ روز می‌پرسد و با *qué fecha* (چه تاریخی) فرق دارد.'
  es.a1.unit05.lesson01.teach.es_la_una:
    title: ساعت یک است
    gloss: ساعت یک است.
    note: در توضیح دستوریِ بعدی ببینید چرا فقط برای ساعت یک *es* (نه *son*) به کار می‌رود.
  es.a1.unit05.lesson01.teach.es_vs_son_note:
    title: es یا son برای ساعت
    gloss: چرا ساعت یک با بقیه‌ی ساعت‌ها فرق دارد.
    note: '*Es la una* مفرد است، ولی *son las dos, son las tres...* جمع است.'
    target_text: برای ساعت یک فعل مفرد *es* به کار می‌رود (Es la una)، ولی برای بقیه‌ی ساعت‌ها فعل جمع *son* (Son las dos, Son las tres...)، چون *la una* مفرد است («ساعتِ یک») ولی *las dos* و *las tres* و مانند آن‌ها جمع‌اند.
  es.a1.unit05.lesson01.teach.son_las_horas:
    title: ساعت دو، چهار، پنج، هفت
    gloss: ساعت دو است، ساعت چهار است، ساعت پنج است، ساعت هفت است.
    note: '*Son las...* (جمع) برای همهٔ ساعت‌ها به‌جز یک به کار می‌رود، مطابق نکتهٔ دستوری قبلی.'
    example_gloss:
    - ساعت دو است.
    - ساعت چهار است.
    - ساعت پنج است.
    - ساعت هفت است.
  es.a1.unit05.lesson02.teach.y_cuarto:
    title: و ربع
    gloss: ساعت چهار و ربع است.
    note: '*Y cuarto* (و ربع) پانزده دقیقه به ساعتِ گفته‌شده اضافه می‌کند.'
  es.a1.unit05.lesson02.teach.y_media:
    title: و نیم
    gloss: ساعت هفت و نیم است.
    note: '*Y media* (و نیم) سی دقیقه به ساعتِ گفته‌شده اضافه می‌کند.'
  es.a1.unit05.lesson02.teach.menos_cuarto:
    title: یک ربع به
    gloss: ساعت یک ربع به پنج است (چهار و چهل‌وپنج دقیقه).
    note: نکتهٔ دستوری بعدی را ببینید؛ آنجا توضیح داده شده که *menos* چطور تا ساعت بعد به‌صورت معکوس می‌شمارد.
  es.a1.unit05.lesson02.teach.menos_note:
    title: Menos (مانده به ساعت)
    gloss: اسپانیایی دقیقه‌های مانده به ساعت بعد را چطور می‌شمارد.
    note: '*Las cinco menos cuarto* = یک ربع به پنج (۴:۴۵).'
    target_text: '*Menos* (منها، کم) تا ساعت بعدی را به عقب می‌شمارد: *las cinco menos cuarto* یعنی ۴:۴۵، همان «یک ربع به پنج» که در فارسی می‌گوییم.'
  es.a1.unit05.lesson03.teach.partes_del_dia:
    title: صبح، بعدازظهر، شب
    gloss: صبح، بعدازظهر، عصر/شب
    note: '*De la mañana/tarde/noche* مشخص می‌کند ساعت قبل از ظهر است یا بعد از ظهر؛ در فارسی هم بعد از ساعت می‌گوییم «صبح» یا «شب».'
    example_gloss:
    - ساعت هشت صبح است.
    - کارگاه ساعت چهار بعدازظهر شروع می‌شود.
    - ساعت ده شب است.
  es.a1.unit05.lesson03.teach.taller_empieza_cuatro_tarde:
    title: کارگاه ساعت چهار شروع می‌شود
    gloss: کارگاه ساعت چهار بعدازظهر شروع می‌شود.
    note: '*Empieza* (شروع می‌شود) صورت سوم‌شخص فعل *empezar* است، یک فعل جدید در این درس.'
  es.a1.unit05.lesson03.teach.a_que_hora_empieza:
    title: پرسیدن ساعت شروع
    gloss: کارگاه ساعت چند شروع می‌شود؟
    note: '*A qué hora* (ساعت چند) روش معمول برای پرسیدن زمان یک رویداد مشخص است و با *qué hora es* (ساعت چنده؟) که ساعتِ الان را می‌پرسد فرق دارد.'
  es.a1.unit05.lesson04.teach.nos_vemos_a_que_hora:
    title: پرسیدن زمان قرار
    gloss: ساعت چند همدیگر را ببینیم؟
    note: '*Nos vemos* (همدیگر را می‌بینیم) ساختاری بازتابی است که برای قرار گذاشتن با کسی به کار می‌رود.'
  es.a1.unit05.lesson04.teach.nos_vemos_tres_y_media:
    title: پیشنهاد ساعت قرار
    gloss: ساعت سه و نیم همدیگر را ببینیم؟
    note: '*Y media* و *nos vemos* را ترکیب می‌کند تا ساعتی مشخص پیشنهاد شود.'
  es.a1.unit05.lesson04.teach.antes_del_taller:
    title: قبل از کارگاه
    gloss: این قبل از کارگاه است.
    note: '*Antes de* (قبل از) متضاد *después* (بعد از) است.'
  es.a1.unit05.lesson04.teach.de_acuerdo:
    title: موافقم / باشه
    gloss: موافقم / باشه
    note: '*De acuerdo* روشی طبیعی و کوتاه برای تأیید یک برنامه است و کاربردی شبیه *Muy bien* دارد.'
    example_gloss: باشه، ساعت سه و نیم همدیگر را می‌بینیم.
  es.a1.unit05.lesson05.teach.horario_dia_reading:
    title: خواندن برنامهٔ روز
    gloss: کارگاه ساعت چهار بعدازظهر شروع می‌شود. قبل از آن، النا و ماتئو ساعت سه و نیم همدیگر را می‌بینند. کارگاه ساعت شش تمام می‌شود. روز بعد، ساعت یک برای ناهار همدیگر را می‌بینند.
    note: 'برنامهٔ کوتاه یک روز: قرار، کارگاه و ناهارِ روز بعد.'
    glosses:
      taller: کارگاه
      empieza: شروع می‌شود (از empezar)
      cuatro: چهار
      tarde: بعدازظهر
      Antes: قبل
      ven: همدیگر را می‌بینند (از verse)
      tres: سه
      media: نیم
      termina: تمام می‌شود (از terminar)
      seis: شش
      día: روز
      siguiente: بعدی
      almorzar: ناهار خوردن
  es.a1.unit05.lesson05.teach.al_dia_siguiente:
    title: روز بعد
    gloss: روز بعد / روز بعدش
    note: '*Al día siguiente* (روز بعد) روشی رایج برای رفتن به روزی دیگر در داستان است و با *la próxima clase* (کلاس بعدی، یک رویداد مشخص نه یک روز تقویمی) فرق دارد.'
  es.a1.unit05.lesson06.teach.line01:
    title: پرسیدن دربارهٔ غذا بعد از کارگاه
    gloss: ماتئو می‌گوید کارگاه ساعت شش تمام می‌شود و می‌پرسد النا بعدش گرسنه است یا نه.
    note: '*Tienes hambre* (گرسنه‌ای) اصطلاحی جدید است؛ تحت‌اللفظی یعنی «گرسنگی داری» و همان ساختار «داشتن» در *tener ... años* و *tener hermanos* است.'
  es.a1.unit05.lesson06.teach.line02:
    title: موافقت و پیشنهاد روز بعد
    gloss: النا می‌گوید بله، کمی، و پیشنهاد می‌کند ناهار را فردا بخورند.
    note: '*¿Comemos mañana?* فردا را پیشنهاد می‌کند، نه بلافاصله بعد از کارگاه، و زمینه را برای گفتگوی بعدی دربارهٔ ساعتی مشخص آماده می‌کند.'
  es.a1.unit05.lesson06.teach.line03:
    title: موافقت و پرسیدن ساعت
    gloss: ماتئو می‌گوید ایدهٔ خوبی است و می‌پرسد ساعت چند.
    note: '*Buena idea* (ایدهٔ خوبی است) روشی طبیعی و کوتاه برای موافقت با یک پیشنهاد است.'
  es.a1.unit05.lesson06.teach.line04:
    title: پیشنهاد ساعت یک
    gloss: النا پیشنهاد می‌کند ساعت یک همدیگر را ببینند.
    note: '*A la una* (ساعت یک) از *la una* مفرد استفاده می‌کند، مثل *Es la una*.'
  es.a1.unit05.lesson06.teach.line05:
    title: تأیید و اشاره به یک رستوران
    gloss: ماتئو تأیید می‌کند که ساعت یک خوب است و از یک رستوران نزدیک حرف می‌زند.
    note: '*Hay un restaurante cerca de aquí*: *cerca de* (نزدیکِ)، مثل *cerca de tus padres*، اینجا برای یک مکان به کار رفته است.'
  es.a1.unit05.lesson06.teach.line06:
    title: پایان گرم گفتگو
    gloss: النا با خوشحالی واکنش نشان می‌دهد و می‌گوید فردا می‌بینمت.
    note: '*¡Genial!* (عالی!) گفتگو را با حالتی پرشور تمام می‌کند و کاربردی شبیه *¡Qué bien!* دارد.'
