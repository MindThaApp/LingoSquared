course:
  title: اسپانیایی A1
  description: گفتن و پرسیدن ساعت، بخش‌های روز و قرار گذاشتن برای دیدار، در ادامه‌ی داستان کارگاه آشپزی النا و ماتئو از درس‌های ۰۱ تا ۰۴. نکته‌های این درس روی بی‌قاعدگی es/son (مفرد و جمع) در گفتن ساعت و کلمه‌های کسری cuarto/media/menos تمرکز دارند.
