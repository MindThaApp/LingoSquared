teaching:
  es.a1.unit12.lesson01.teach.nervioso:
    title: مضطرب
    gloss: مضطرب
    note: '*Nervioso* (مذکر) و *nerviosa* (مؤنث): جفت صفت معمولیِ -o/-a.'
    example_gloss:
    - ماتئو مضطرب است.
    - النا مضطرب است.
  es.a1.unit12.lesson01.teach.contento:
    title: خوشحال
    gloss: خوشحال / راضی
    note: '*Contento/contenta* احساس خوشحالی یا رضایت را می‌رساند، نه یک ویژگی دائمی.'
    example_gloss:
    - ماتئو خوشحال است.
    - النا خوشحال است.
  es.a1.unit12.lesson01.teach.cansado:
    title: خسته
    gloss: خسته
    note: '*Cansado/cansada*، از *cansar* (خسته کردن).'
    example_gloss:
    - بعد از کارگاه خسته‌ام. (مذکر)
    - بعد از کارگاه خسته‌ام. (مؤنث)
  es.a1.unit12.lesson01.teach.preocupado:
    title: نگران
    gloss: نگران
    note: '*Preocupado/preocupada*، از *preocupar* (نگران کردن).'
    example_gloss:
    - ماتئو نگران است.
    - النا نگران است.
  es.a1.unit12.lesson01.teach.orgulloso:
    title: سربلند
    gloss: سربلند / مفتخر
    note: '*Orgulloso/orgullosa*: در *estoy orgulloso/a de...* (به ... افتخار می‌کنم) قبل از چیزی که به آن افتخار می‌کنید، حرف اضافه‌ی *de* می‌آید.'
    example_gloss:
    - به تو افتخار می‌کنم. (مذکر)
    - به تو افتخار می‌کنم. (مؤنث)
  es.a1.unit12.lesson02.teach.estoy_nervioso:
    title: مضطربم (مذکر)
    gloss: مضطربم.
    note: '*Estoy* (هستم، از *estar*) + شکل مذکر صفت.'
  es.a1.unit12.lesson02.teach.estoy_nerviosa:
    title: مضطربم (مؤنث)
    gloss: مضطربم.
    note: همان ساختار، با شکل مؤنث صفت.
  es.a1.unit12.lesson02.teach.estoy_contento:
    title: خوشحالم (مذکر)
    gloss: خوشحالم.
    note: '*Estoy contento*: همان الگوی *estar* + صفت.'
  es.a1.unit12.lesson02.teach.estar_vs_ser_note:
    title: Estar یا ser برای احساسات
    gloss: چرا احساسات معمولاً با estar می‌آیند، نه ser.
    note: متن خودِ کارت را ببینید.
    target_text: '*Estar* + صفت، حالت یا احساس موقتی را توصیف می‌کند (estoy nervioso: الان مضطربم)، برخلاف *ser* + صفت که برای ویژگی دائمی است. احساسات معمولاً با *estar* بیان می‌شوند.'
  es.a1.unit12.lesson03.teach.como_te_sientes:
    title: پرسیدن حال کسی
    gloss: چه احساسی داری؟ / حالت چطوره؟
    note: '*¿Cómo te sientes?* از *sentirse* (احساس کردن) ساخته شده که فعل بازتابی است و با *estar* + صفت فرق دارد.'
  es.a1.unit12.lesson03.teach.me_siento_nervioso_pero_contento:
    title: توصیف یک احساس دوگانه
    gloss: کمی مضطربم، ولی خوشحالم.
    note: '*Me siento* (احساس می‌کنم) + صفت، و *pero* (ولی) دو احساس را در کنار هم قرار می‌دهد. این پاسخ طبیعیِ *¿Cómo te sientes?* است.'
  es.a1.unit12.lesson04.teach.algo_se_quema:
    title: یه چیزی می‌سوزه
    gloss: یه چیزی داره می‌سوزه!
    note: '*Se quema* شکل بازتابی *quemar* (سوزاندن) است، یعنی «خودش می‌سوزد». راه طبیعی برای گفتن اینکه چیزی می‌سوزد، بدون اینکه بگوییم چه کسی آن را می‌سوزاند.'
  es.a1.unit12.lesson04.teach.estoy_preocupado:
    title: نگرانم (مذکر)
    gloss: نگرانم.
    note: '*Preocupado* در الگوی *estoy* + صفت.'
  es.a1.unit12.lesson04.teach.no_te_preocupes:
    title: نگران نباش
    gloss: نگران نباش.
    note: نکته‌ی دستوری بعدی را ببینید.
  es.a1.unit12.lesson04.teach.podemos_empezar_de_nuevo:
    title: پیشنهاد شروع دوباره
    gloss: می‌تونیم دوباره شروع کنیم.
    note: '*Podemos* (می‌توانیم) + مصدر؛ *de nuevo* (دوباره) عبارتی رایج برای انجام دوباره‌ی کاری است.'
  es.a1.unit12.lesson04.teach.no_te_preocupes_note:
    title: No te preocupes
    gloss: الگوی امر منفی پشت «نگران نباش».
    note: متن خودِ کارت را ببینید.
    target_text: '*No te preocupes* (نگران نباش) امر منفیِ غیررسمی است و از *no* + ضمیر بازتابی (*te*) + فعل ساخته می‌شود.'
  es.a1.unit12.lesson05.teach.reflexion_reading:
    title: مروری بر کلاس
    gloss: قبل از کلاس، النا و ماتئو کمی مضطرب بودند. وسط کلاس یک چیزی سوخت و هر دو نگران شدند. ولی دوباره شروع کردند و در آخر، کیک عالی از آب درآمد. حالا هر دو خیلی سربلند و خوشحال‌اند.
    note: '*Estaban* (بودند) حال آن لحظه‌ی آن‌ها را توصیف می‌کند؛ *están* (هستند) حال الان‌شان را.'
    glosses:
      Antes: قبل از
      clase: کلاس
      estaban: بودند (از estar)
      poco: کمی
      nerviosos: عصبی
      Durante: حین / در طول
      algo: یه چیزی
      quemó: سوخته
      dos: هر دو / دو
      preocupados: نگران
      Pero: ولی
      empezaron: شروع کردند
      nuevo: دوباره
      final: آخر / پایان
      pastel: کیک
      salió: از آب درآمد
      perfecto: عالی
      Ahora: حالا
      están: هستند
      orgullosos: سربلند / مغرور از چیزی
      contentos: خوشحال
  es.a1.unit12.lesson05.teach.plural_adjective_note:
    title: مطابقت صفت‌ها در جمع
    gloss: چرا برای گروه مختلط (زن و مرد) صفت‌ها به شکل مذکر جمع می‌آیند.
    note: به متن خود کارت نگاه کنید.
    target_text: وقتی درباره‌ی النا و ماتئو با هم صحبت می‌کنیم، صفت‌ها به شکل مذکر جمع می‌آیند (nerviosos، preocupados، orgullosos، contentos). قاعده‌ی استاندارد اسپانیایی این است که اگر گروه دست‌کم یک عضو مذکر داشته باشد، صفت مذکر جمع می‌شود.
  es.a1.unit12.lesson06.teach.line01:
    title: بپرسید ماتئو چه حالی دارد
    gloss: النا از ماتئو می‌پرسد قبل از کلاس چه حالی دارد.
    note: '*¿Cómo te sientes?* می‌پرسد کسی چه حالی دارد.'
  es.a1.unit12.lesson06.teach.line02:
    title: با یک حس ترکیبی جواب بدهید
    gloss: ماتئو می‌گوید کمی عصبی است، ولی خوشحال است.
    note: ماتئو از شکل‌های مذکر *nervioso* و *contento* استفاده می‌کند.
  es.a1.unit12.lesson06.teach.line03:
    title: به اتفاق پیش‌آمده واکنش نشان بدهید
    gloss: النا موافقت می‌کند، بعد متوجه می‌شود یه چیزی دارد می‌سوزد.
    note: '*¡Ay, no!* (وای نه!) یک تعجب و هشدار رایج است.'
  es.a1.unit12.lesson06.teach.line04:
    title: نگرانی را بیان کنید
    gloss: ماتئو می‌گوید نگران است و می‌پرسد چه کار کنیم.
    note: '*¿Qué hacemos?* (چه کار کنیم؟) یک سؤال کاربردی است.'
  es.a1.unit12.lesson06.teach.line05:
    title: دلداری بدهید و راه‌حل پیشنهاد کنید
    gloss: النا به او می‌گوید نگران نباش، می‌توانیم از نو شروع کنیم.
    note: ترکیب *no te preocupes* و *podemos empezar de nuevo*.
  es.a1.unit12.lesson06.teach.line06:
    title: موافقت کنید و دوباره تلاش کنید
    gloss: ماتئو موافقت می‌کند و پیشنهاد می‌دهد دوباره امتحان کنند.
    note: '*Vamos a intentarlo otra vez* (بیا دوباره امتحانش کنیم) همان ساختار *vamos a* + مصدر از درس‌های قبل است، این بار با ضمیر مفعولی *lo*.'
  es.a1.unit12.lesson06.teach.line07:
    title: موفقیت را اعلام کنید
    gloss: النا اعلام می‌کند که کیک حالا عالی شده است.
    note: '*¡Mira!* (نگاه کن!) یک شبه‌جمله برای جلب توجه است؛ *el pastel* (کیک) همان چیزی است که ماجرا حولش می‌گذرد.'
  es.a1.unit12.lesson06.teach.line08:
    title: جشن بگیرید و افتخار را بیان کنید
    gloss: ماتئو خوشحالی می‌کند و می‌گوید به هر دوی آن‌ها افتخار می‌کند.
    note: '*¡Qué bien!* (چه عالی!) از الگوی تعجبی *¡Qué...!* استفاده می‌کند، مثل *¡Qué calor!*؛ *de nosotros* (از ما) همان *estoy orgulloso de ti* را به یک گروه گسترش می‌دهد.'
  es.a1.unit12.lesson06.teach.line09:
    title: افتخار را با هم تقسیم کنید
    gloss: النا موافقت می‌کند که او هم سربلند است؛ با هم از پسش برآمدند.
    note: '*Lo logramos juntos* (با هم از پسش برآمدیم) جمله‌ی پایانی طبیعی است و برای اولین بار فعل *lograr* (موفق شدن) در آن به کار رفته است.'
