teaching:
  es.a1.unit01.lesson01.teach.usted:
    title: «شما» به شکل محترمانه
    gloss: شما (رسمی و محترمانه)
    note: در فارسی هم بین «تو» و «شما» فرق هست و اسپانیایی هم این انتخاب اجتماعی را نشان می‌دهد. Usted برای یک بزرگسال ناآشنا یا وقتی لحن محترمانه لازم است به کار می‌رود. با اینکه معنایش «شما» است، فعلش مثل él یا ella صرف می‌شود.
  es.a1.unit01.lesson01.teach.tu:
    title: «تو» به شکل صمیمی
    gloss: تو (غیررسمی، مفرد)
    note: Tú را برای یک دوست، هم‌سن‌وسال، بچه یا هر کسی که رابطه‌تان صمیمی است به کار می‌برید. علامت تکیه فرق ضمیر tú را با صفت ملکی tu، یعنی «مالِ تو»، نشان می‌دهد.
  es.a1.unit01.lesson01.teach.como_esta_usted:
    title: پرسیدن حال به شکل رسمی
    gloss: حال شما چطوره؟
    note: Está شکل usted از فعل estar است. اسپانیایی برای حالتِ فعلی کسی اینجا از estar استفاده می‌کند. Cómo چون کلمه‌ی پرسشی است علامت تکیه دارد.
  es.a1.unit01.lesson01.teach.como_estas:
    title: پرسیدن حال به شکل صمیمی
    gloss: حالت چطوره؟
    note: Estás شکل tú از estar است. در فارسی هم «هستی» و «هستید» فرق دارند؛ در اسپانیایی هم بسته به اینکه مخاطب «تو» باشد یا «شما»، está به estás تغییر می‌کند.
  es.a1.unit01.lesson01.teach.bien_gracias:
    title: یک جواب کوتاه
    gloss: خوبم، ممنون.
    note: در اسپانیایی می‌شود فقط با bien جواب داد، بدون تکرار فاعل یا فعل.
  es.a1.unit01.lesson01.teach.muy_bien:
    title: یک جواب مثبت
    gloss: خیلی خوبم، ممنون.
    note: Muy معنای bien را قوی‌تر می‌کند و شکلش تغییر نمی‌کند.
  es.a1.unit01.lesson01.teach.and_usted:
    title: برگرداندن سؤال به شکل رسمی
    gloss: شما چطور؟
    note: وقتی سؤال را محترمانه برمی‌گردانید، usted را نگه دارید.
  es.a1.unit01.lesson01.teach.and_tu:
    title: برگرداندن سؤال به شکل صمیمی
    gloss: تو چطور؟
    note: وقتی گفتگو صمیمی است از tú استفاده کنید. علامت تکیه مهم است، چون tu بدون علامت یعنی «مالِ تو».
  es.a1.unit01.lesson02.teach.hola:
    title: سلامِ همه‌کاره
    gloss: سلام
    note: Hola در هر ساعت از روز و هم در دیدارهای رسمی و هم صمیمی به کار می‌رود.
  es.a1.unit01.lesson02.teach.buenos_dias:
    title: سلام صبح
    gloss: صبح بخیر
    note: اسم‌ها در اسپانیایی جنس دستوری دارند، ولی در فارسی ندارند. Días مذکر و جمع است، برای همین صفت به شکل buenos می‌آید.
  es.a1.unit01.lesson02.teach.buenas_tardes:
    title: سلام بعدازظهر
    gloss: بعدازظهر بخیر
    note: Tardes مؤنث و جمع است، برای همین buenas با آن مطابقت می‌کند. تغییر buenos به buenas فقط تطابق دستوری است و ربطی به میزان ادب ندارد.
  es.a1.unit01.lesson02.teach.buenas_noches:
    title: سلام عصر یا شب
    gloss: عصر بخیر؛ شب بخیر
    note: Noches مؤنث و جمع است و به همین دلیل buenas می‌گیرد. این عبارت هم برای سلام کردن در شب به کار می‌رود و هم برای تمام کردن دیدار پیش از خواب.
  es.a1.unit01.lesson02.teach.adios:
    title: خداحافظی مستقیم
    gloss: خداحافظ
    note: Adiós خنثی است، ولی ممکن است از عبارت‌هایی مثل «بعداً می‌بینمت» قطعی‌تر به نظر برسد.
  es.a1.unit01.lesson02.teach.hasta_luego:
    title: بعداً می‌بینمت
    gloss: بعداً می‌بینمتون
    note: Hasta luego یک خداحافظی قراردادی است و نباید آن را کلمه‌به‌کلمه معنی کرد.
  es.a1.unit01.lesson02.teach.nos_vemos:
    title: خداحافظی دوستانه
    gloss: می‌بینمت
    note: معنی تحت‌اللفظی nos vemos به «همدیگر را می‌بینیم» نزدیک‌تر است.
  es.a1.unit01.lesson02.teach.good_day:
    title: آرزوی مؤدبانه هنگام خداحافظی
    gloss: روز خوبی داشته باشید.
    note: Tenga در این آرزوی مؤدبانه شکل usted است. Buen شکل کوتاه‌شده‌ی مذکر مفرد bueno پیش از día است.
  es.a1.unit01.lesson03.teach.formal_name_question:
    title: پرسیدن اسم به شکل رسمی
    gloss: اسم شما چیه؟
    note: اسپانیایی این را تقریباً به شکل «خودتان را چه صدا می‌زنید» می‌گوید. Se همراه شکل رسمی llama می‌آید. در فارسی هم «اسمت چیه» و «اسمتان چیه» از نظر رسمی بودن فرق دارند.
  es.a1.unit01.lesson03.teach.my_name_lucia:
    title: گفتن اسم خودتان
    gloss: اسم من لوسیا است.
    note: Me llamo تحت‌اللفظی یعنی «خودم را ... صدا می‌زنم». پایان فعل گوینده را مشخص می‌کند، برای همین اسپانیایی معمولاً yo را نمی‌گوید؛ فارسی هم فاعل را معمولاً حذف می‌کند.
  es.a1.unit01.lesson03.teach.informal_name_question:
    title: پرسیدن اسم به شکل صمیمی
    gloss: اسمت چیه؟
    note: Te با tú صمیمی می‌آید و llamas پایان -as مخصوص tú را دارد. شکل رسمی se llama را با شکل صمیمی te llamas مقایسه کنید.
  es.a1.unit01.lesson03.teach.i_am_diego:
    title: معرفی خود با ser
    gloss: من دیگو هستم.
    note: Soy اول شخص مفرد فعل ser است. اسپانیایی ser را برای هویت به کار می‌برد، ولی برای بسیاری از حالت‌های موقت از estar استفاده می‌کند.
  es.a1.unit01.lesson03.teach.mucho_gusto:
    title: ابراز خوشحالی از آشنایی
    gloss: از آشنایی‌تون خوشبختم.
    note: Mucho gusto یک عبارت ثابت و کاملاً قابل فهم است. برخلاف صفت‌هایی مثل encantado یا encantada، با جنسیت گوینده تغییر نمی‌کند.
  es.a1.unit01.lesson03.teach.igualmente:
    title: جواب دادن به همان احساس
    gloss: من هم همین‌طور.
    note: Igualmente یک جواب کوتاه به Mucho gusto است.
  es.a1.unit01.lesson03.teach.este_carlos:
    title: معرفی یک آقا
    gloss: این کارلوس است.
    note: در فارسی «این» جنس دستوری ندارد، ولی اسپانیایی وقتی فرد یا اسمی که به آن اشاره می‌کنید مذکر است، este می‌گوید.
  es.a1.unit01.lesson03.teach.esta_ana:
    title: معرفی یک خانم
    gloss: این آنا است.
    note: برای مرجع مؤنث esta را به کار ببرید. Esta اینجا علامت تکیه ندارد؛ está با علامت تکیه شکلی از estar است و یعنی «است» یا «قرار دارد».
  es.a1.unit01.lesson04.teach.formal_origin_question:
    title: پرسیدن اهل کجا بودن به شکل رسمی
    gloss: شما اهل کجایید؟
    note: Es شکل usted از ser است. اسپانیایی برای محل اصلی از ser استفاده می‌کند، نه estar. Dónde در سؤال مستقیم علامت تکیه دارد.
  es.a1.unit01.lesson04.teach.from_mexico:
    title: گفتن اهل کجا بودن
    gloss: من اهل مکزیک هستم.
    note: Soy شکل yo از ser است. فاعل yo لازم نیست، چون soy خودش گوینده را مشخص می‌کند.
  es.a1.unit01.lesson04.teach.informal_origin_question:
    title: پرسیدن اهل کجا بودن به شکل صمیمی
    gloss: تو اهل کجایی؟
    note: Eres شکل tú از ser است. شکل رسمی es برای usted را با شکل صمیمی eres مقایسه کنید.
  es.a1.unit01.lesson04.teach.from_colombia:
    title: یک جمله‌ی دیگر درباره‌ی محل اصلی
    gloss: من اهل کلمبیا هستم.
    note: برای گفتن محل اصلی، soy de را با اسم یک مکان به کار ببرید.
  es.a1.unit01.lesson04.teach.live_london:
    title: گفتن محل زندگی
    gloss: من در لندن زندگی می‌کنم.
    note: Vivo شکل yo از vivir است. اسپانیایی به yo نیازی ندارد، چون پایان -o گوینده را مشخص می‌کند.
  es.a1.unit01.lesson04.teach.speak_spanish:
    title: پرسیدن رسمی درباره‌ی اسپانیایی
    gloss: اسپانیایی صحبت می‌کنید؟
    note: اسپانیایی این سؤال بلی/خیر را بدون هیچ فعل کمکی می‌سازد. Habla شکل usted است و آهنگ صدا و علامت سؤال پرسش را نشان می‌دهند.
  es.a1.unit01.lesson04.teach.yes_a_little:
    title: توانایی محدود
    gloss: بله، کمی.
    note: Sí با علامت تکیه یعنی «بله». Si بدون علامت یعنی «اگر»، هرچند در سطح A1 اینجا املای بدون علامت هم به‌عنوان اشتباه تایپی قابل قبول است.
  es.a1.unit01.lesson04.teach.still_learning:
    title: توصیف یک وضعیت در حال ادامه
    gloss: هنوز دارم یاد می‌گیرم.
    note: Estoy شکل yo از estar است. اینجا estar همراه کاری است که در حال انجام شدن است، ولی soy در Soy de Colombia محل اصلی یا هویت را بیان می‌کند.
  es.a1.unit01.lesson05.teach.formal_first_time:
    title: پرسیدن رسمی درباره‌ی اولین بازدید
    gloss: اینجا اولین باری است که می‌آیید؟
    note: Su وقتی با کسی به شکل usted صحبت می‌کنید یعنی «مالِ شما». تفاوت su و tu انتخاب رسمی یا صمیمی را حفظ می‌کند.
  es.a1.unit01.lesson05.teach.informal_first_time:
    title: پرسیدن صمیمی درباره‌ی اولین بازدید
    gloss: اینجا اولین باره که میای؟
    note: Tu بدون علامت تکیه صفت ملکی صمیمی و یعنی «مالِ تو». آن را با ضمیر tú که علامت تکیه دارد مقایسه کنید.
  es.a1.unit01.lesson05.teach.first_time_answer:
    title: تأیید اولین بازدید
    gloss: بله، اولین باری است که می‌آیم.
    note: Primera مؤنث است، چون با vez مطابقت می‌کند. در فارسی صفت با جنس اسم تغییر نمی‌کند.
  es.a1.unit01.lesson05.teach.cooking_workshop:
    title: گفتن مقصد
    gloss: برای کارگاه آشپزی اومدم.
    note: Vengo شکل yo از venir است و یعنی «می‌آیم» یا «دارم می‌آیم». Al حاصل ادغام اجباری a و el است.
  es.a1.unit01.lesson05.teach.me_too:
    title: داشتن وضعیت مشابه
    gloss: من هم.
    note: وقتی حرف طرف مقابل درباره‌ی شما هم صدق می‌کند، Yo también به کار می‌آید.
  es.a1.unit01.lesson05.teach.like_cooking:
    title: پرسیدن درباره‌ی یک علاقه
    gloss: از آشپزی خوشت میاد؟
    note: فعل gustar مثل «دوست داشتن» در فارسی ساخته نمی‌شود. Te کسی را نشان می‌دهد که خوشش می‌آید، و cocinar همان چیزی است که خوشایند است. فعل به شکل gusta می‌ماند، چون کار کردن (مصدر) مفرد حساب می‌شود.
  es.a1.unit01.lesson05.teach.yes_very_much:
    title: نشان دادن علاقهٔ زیاد
    gloss: آره، خیلی.
    note: Mucho به پرسش دربارهٔ میزان جواب می‌دهد و اینجا شکلش عوض نمی‌شود.
  es.a1.unit01.lesson05.teach.thats_good:
    title: واکنش مثبت
    gloss: چه خوب!
    note: Qué در این جملهٔ تعجبی accent دارد. این عبارت یک واکنش مثبت را شروع می‌کند، نه یک پرسش.
  es.a1.unit01.lesson06.teach.line01:
    title: شروع آشنایی
    gloss: النا به ماتئو سلام می‌کند و می‌پرسد اولین باری است که اینجا می‌آید یا نه.
    note: هر دو از شکل صمیمی tú استفاده می‌کنند، چون در یک فعالیت مشترک هم‌سطح هستند.
  es.a1.unit01.lesson06.teach.line02:
    title: شروع آشنایی، پاسخ
    gloss: ماتئو می‌گوید بله، اولین باری است که می‌آید و برای کارگاه آشپزی آمده است.
    note: Vengo al taller دلیل حضور را می‌گوید و برای موقعیتی که الان ادامه دارد، زمان حال به کار رفته است.
  es.a1.unit01.lesson06.teach.line03:
    title: گفتن اسم
    gloss: النا می‌گوید برای او هم اولین بار است، اسمش را می‌گوید و اسم ماتئو را می‌پرسد.
    note: Me llamo روش طبیعی گفتن اسم است. مثل فارسی، در اسپانیایی هم معمولاً ضمیر yo را نمی‌گویند، چون خود فعل نشان می‌دهد گوینده کیست.
  es.a1.unit01.lesson06.teach.line04:
    title: گفتن اسم، پاسخ
    gloss: ماتئو اسمش را می‌گوید و می‌گوید از آشنایی با او خوشحال است.
    note: Soy روش طبیعی دیگری برای گفتن اسم است و به جای فعل بازتابی llamarse از ser استفاده می‌کند.
  es.a1.unit01.lesson06.teach.line05:
    title: پرسیدن دربارهٔ اصالت
    gloss: النا هم همین احترام را برمی‌گرداند (من هم همین‌طور) و می‌پرسد ماتئو اهل کجاست.
    note: De dónde eres با شکل صمیمی tú می‌پرسد کسی اهل کجاست.
  es.a1.unit01.lesson06.teach.line06:
    title: پرسیدن دربارهٔ اصالت، پاسخ
    gloss: ماتئو اهل کلمبیاست ولی در لندن زندگی می‌کند، بعد همین سؤال را از النا می‌پرسد.
    note: Soy de اصالت را نشان می‌دهد و vivo en محل زندگی فعلی را. Pero تضاد بین این دو را می‌رساند.
  es.a1.unit01.lesson06.teach.line07:
    title: صحبت دربارهٔ یک علاقه
    gloss: النا می‌گوید اهل اسپانیاست و می‌پرسد ماتئو از آشپزی خوشش می‌آید یا نه.
    note: Soy برای گفتن اصالت به کار رفته، همان الگویی که ماتئو همین الان به کار برد.
  es.a1.unit01.lesson06.teach.line08:
    title: صحبت دربارهٔ یک علاقه، پاسخ
    gloss: ماتئو می‌گوید خیلی از آشپزی خوشش می‌آید ولی هنوز دارد یاد می‌گیرد.
    note: Estoy aprendiendo کاری را نشان می‌دهد که همین حالا در جریان است؛ معادل فارسی‌اش «دارم یاد می‌گیرم» است.
  es.a1.unit01.lesson06.teach.line09:
    title: تمام کردن گفتگو
    gloss: النا می‌گوید او هم دارد یاد می‌گیرد و می‌گوید داخل همدیگر را می‌بینند.
