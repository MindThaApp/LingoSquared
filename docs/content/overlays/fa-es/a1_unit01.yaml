course:
  title: اسپانیایی A1
  description: سلام و احوال‌پرسی، معرفی و گپ‌های کاربردی برای اولین دیدار را به شکل خنثی و رایج در همه‌ی کشورهای اسپانیایی‌زبان یاد می‌گیرید. نکته‌های آموزشی روی سطح رسمی بودن، تطابق، حذف فاعل و شکل‌های فعل در اسپانیایی تأکید دارند.
