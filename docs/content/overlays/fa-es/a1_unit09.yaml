course:
  title: اسپانیایی A1
  description: پرسیدن و دنبال کردن راهنمایی‌های ساده‌ی مسیر، در ادامه‌ی داستان النا و ماتئو که النا ماتئو رو به کتابخونه‌ی درس ۸ راهنمایی می‌کنه. تأکید درس روی اینه که doblar و girar گونه‌های منطقه‌ایِ قابل‌جایگزین‌اند، نه دو معنی متفاوت.
