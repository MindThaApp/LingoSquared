teaching:
  es.a1.unit09.lesson01.teach.la_calle:
    title: خیابان
    gloss: خیابان
    note: '*Calle* مؤنث است.'
    example_gloss: من توی این خیابان زندگی می‌کنم.
  es.a1.unit09.lesson01.teach.la_esquina:
    title: نبش
    gloss: نبش (خیابان)
    note: '*Esquina* مؤنث است.'
    example_gloss: بانک سر نبش است.
  es.a1.unit09.lesson02.teach.seguir_derecho:
    title: مستقیم رفتن
    gloss: مستقیم برو.
    note: '*Sigue* شکل امر غیررسمی فعل *seguir* (دنبال کردن/ادامه دادن) است و در راهنمایی‌های این درس بارها تکرار می‌شود.'
  es.a1.unit09.lesson02.teach.doblar_izquierda:
    title: پیچیدن به چپ
    gloss: به چپ بپیچ.
    note: '*Dobla* شکل امر غیررسمی فعل *doblar* (پیچیدن/تا کردن) است. یادداشت دستوری بعدی را درباره‌ی *doblar* و *girar* ببینید.'
  es.a1.unit09.lesson02.teach.girar_derecha:
    title: پیچیدن به راست
    gloss: به راست بپیچ.
    note: '*Gira* شکل امر غیررسمی فعل *girar* (پیچیدن/چرخیدن) است و کاملاً جای *doblar* به کار می‌رود.'
  es.a1.unit09.lesson02.teach.cruzar_la_calle:
    title: رد شدن از خیابان
    gloss: از خیابان رد شو.
    note: '*Cruza* شکل امر غیررسمی فعل *cruzar* (رد شدن/عبور کردن) است.'
  es.a1.unit09.lesson02.teach.doblar_vs_girar_note:
    title: Doblar و girar
    gloss: دو واژه‌ی کاملاً طبیعی برای «پیچیدن».
    note: متن خود کارت را ببینید.
    target_text: '*Doblar* و *girar* هر دو یعنی «پیچیدن» و اینجا کاملاً جای هم به کار می‌رن؛ فقط ترجیح منطقه‌ایه، نه فرق در سطح زبان یا معنا. هر دو توی این درس استفاده می‌شن.'
  es.a1.unit09.lesson03.teach.como_llego_a_la_biblioteca:
    title: پرسیدن مسیر
    gloss: چطوری به کتابخانه برسم؟
    note: '*Cómo llego a* (چطوری برسم به) روش معمول برای پرسیدن مسیر یک مکان مشخص است.'
  es.a1.unit09.lesson03.teach.es_facil:
    title: گفتن اینکه آسان است
    gloss: راحته.
    note: جمله‌ای رایج و دلگرم‌کننده که پیش از دادن مسیر گفته می‌شود.
  es.a1.unit09.lesson03.teach.sigue_derecho_por_esta_calle:
    title: مستقیم رفتن از این خیابان
    gloss: از همین خیابان مستقیم برو.
    note: '*Por esta calle* (از همین خیابان) مشخص می‌کند در کدام خیابان باید ادامه داد.'
  es.a1.unit09.lesson03.teach.dobla_a_la_izquierda_en_la_esquina:
    title: پیچیدن به چپ سر نبش
    gloss: سر نبش به چپ بپیچ.
    note: '*En la esquina* (سر نبش) می‌گوید پیچیدن کجا اتفاق می‌افتد.'
  es.a1.unit09.lesson04.teach.esta_bien_asi:
    title: پرسیدن برای اطمینان
    gloss: درسته؟
    note: '*¿Está bien así?* (همین‌طوری درسته؟) برای اطمینان از فهمیدن مسیر است، بعد از اینکه مسیر را دوباره تکرار کرده‌اید.'
  es.a1.unit09.lesson04.teach.si_asi_es:
    title: تأیید کردن
    gloss: آره، درسته.
    note: '*Así es* (همین‌طوره) تأییدی کوتاه و طبیعی است.'
  es.a1.unit09.lesson04.teach.no_te_pierdas:
    title: گم نشو
    gloss: گم نشی‌ها!
    note: '*No te pierdas* امر منفی غیررسمی فعل *perderse* (گم شدن) است؛ خداحافظی گرم و دوستانه‌ای است.'
  es.a1.unit09.lesson05.teach.direcciones_reading:
    title: خواندن مسیر نوشته‌شده
    gloss: 'برای رسیدن به کتابخانه از بازار: از همین خیابان مستقیم برو. سر نبش به چپ بپیچ. بعد از خیابان رد شو. کتابخانه سمت راست است.'
    note: 'مسیر نوشته‌شده مرحله‌ها را به ترتیب می‌آورد: *Para llegar a...* (برای رسیدن به...) مقصد را نام می‌برد، بعد هر مرحله یک امر با *tú* است (*sigue*، *dobla*، *cruza*) و *después* (بعد) مرحله‌ها را به هم وصل می‌کند.'
    glosses:
      llegar: رسیدن
      biblioteca: کتابخانه
      desde: از
      mercado: بازار
      sigue: ادامه بده / برو (از seguir)
      derecho: مستقیم
      calle: خیابان
      Dobla: بپیچ (از doblar)
      izquierda: چپ
      esquina: نبش
      Después: بعد
      cruza: رد شو (از cruzar)
      está: قرار دارد (از estar)
      derecha: راست
  es.a1.unit09.lesson05.teach.desde_note:
    title: Desde (از)
    gloss: نقش desde در مشخص کردن نقطه‌ی شروع مسیر.
    note: متن خود کارت را ببینید.
    target_text: '*Desde* (از) نقطه‌ی شروع مسیر رو نشون می‌ده و با *a* (به) برای مقصد میاد: *desde el mercado* ... *a la biblioteca*.'
  es.a1.unit09.lesson06.teach.line01:
    title: پرسیدن مسیر
    gloss: ماتئو از النا می‌پرسد چطور از بازار به کتابخانه برسد.
    note: 'همان سؤال *¿Cómo llego a...?* که پیشتر در این درس آمد، این بار با نقطه‌ی شروع: *desde el mercado* (از بازار).'
  es.a1.unit09.lesson06.teach.line02:
    title: گفتن مرحله‌ی اول
    gloss: النا می‌گوید راحت است و اولین مسیر را می‌گوید.
    note: '*Es fácil* (راحته) پیش از گفتن مرحله‌ی اول خیال شنونده را راحت می‌کند.'
  es.a1.unit09.lesson06.teach.line03:
    title: تکرار کردن و پرسیدن ادامه
    gloss: ماتئو راهنمایی را تکرار می‌کند و می‌پرسد بعدش چه کار کند.
    note: '*Sigo derecho* (مستقیم می‌روم) صرف اول‌شخص فعل *seguir* است و نشان می‌دهد ماتئو هم‌زمان با شنیدن، مسیر را تأیید می‌کند.'
  es.a1.unit09.lesson06.teach.line04:
    title: گفتن مرحله‌ی دوم
    gloss: النا می‌گوید سر نبش به چپ بپیچد.
    note: '*Dobla* (بپیچ) — اینجا *gira* هم همین معنی را دارد.'
  es.a1.unit09.lesson06.teach.line05:
    title: تکرار کردن و تأیید گرفتن
    gloss: ماتئو پیچیدن را تکرار می‌کند و می‌پرسد درست است یا نه.
    note: '*Doblo* (می‌پیچم) مثل *Sigo derecho* قبلی است؛ ماتئو هر مرحله را با شکل *yo* تکرار می‌کند تا مطمئن شود.'
  es.a1.unit09.lesson06.teach.line06:
    title: تأیید کردن و گفتن مرحله‌های آخر
    gloss: النا تأیید می‌کند، بعد می‌گوید از خیابان رد شود؛ کتابخانه سمت راست است.
    note: '*Sí, así es* (آره، درسته) تأیید می‌کند، بعد *después* (بعد) مرحله‌های آخر مسیر را شروع می‌کند.'
  es.a1.unit09.lesson06.teach.line07:
    title: تشکر از النا
    gloss: ماتئو با گرمی از النا تشکر می‌کند.
    note: '*Muchas gracias* (خیلی ممنون) صورت گرم‌تر *gracias* ساده است.'
  es.a1.unit09.lesson06.teach.line08:
    title: جواب دادن و خداحافظی
    gloss: النا می‌گوید خواهش می‌کنم و به او می‌گوید گم نشود.
    note: '*De nada* (خواهش می‌کنم) جواب معمول به *gracias* است.'
