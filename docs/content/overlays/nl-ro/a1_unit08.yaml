answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: No new register-sensitive forms in this unit -- este (is), the core verb every sentence here uses, does not change with tu or dumneavoastră (same standing note as unit03/unit04). Ana and Mihai's neighborhood dialogue keeps their existing polite register with each other, matching unit06/unit07.
course:
  title: Roemeens A1
  description: Veelvoorkomende plaatsen in het Roemeens herkennen en aanwijzen -- vragen Unde este...? (Waar is...?), zeggen of een plek aproape (dichtbij) of departe (ver weg) is, en lângă (naast), vizavi de (tegenover) en între (tussen) gebruiken om een eenvoudige buurt te beschrijven, met Ana en Mihai die verder praten over de weg vinden in de stad.
units:
  ro.a1.unit08.places:
    title: Plaatsen
lessons:
  ro.a1.unit08.lesson01.unde_este:
    title: Waar is...?
  ro.a1.unit08.lesson02.langa_vizavi_intre:
    title: Naast, tegenover, tussen
  ro.a1.unit08.lesson03.in_cartier:
    title: In de buurt
teaching:
  ro.a1.unit08.lesson01.teach.reminder_unde_este:
    title: 'Herhaling: unde, este'
    gloss: unde (waar) · este (is)
    note: Beide kwamen al voor -- *unde* in *Unde pot să cumpăr ...?* uit Unit 7, *este* al sinds Unit 3/Unit 4 -- hier vormen ze samen de kernvraag van deze unit over de locatie.
  ro.a1.unit08.lesson01.teach.unde_este_phrase:
    title: Waar is...?
    gloss: Unde este...? (Waar is...?)
    note: De gewone manier om te vragen waar iets is -- zet de naam van de plek na *este*, of gebruik de vraag zo alleen als de plek uit de context al duidelijk is.
  ro.a1.unit08.lesson01.teach.gara_magazin_banca:
    title: Station, winkel, bank
    gloss: gară (station) · magazin (winkel) · bancă (bank)
    note: 'Drie veelvoorkomende plaatsen -- alle drie krijgen het bepaald lidwoord als het om een specifieke, bekende plek gaat: *gara*, *magazinul*, *banca*.'
    example_gloss:
    - Waar is het station?
    - De winkel is dichtbij.
    - De bank is ver weg.
  ro.a1.unit08.lesson01.teach.aproape_departe:
    title: Dichtbij, ver weg
    gloss: aproape (dichtbij) · departe (ver weg)
    note: Een eenvoudige manier om te zeggen hoe dichtbij of ver weg een plek is, zonder precies de weg te wijzen.
    example_gloss:
    - De winkel is dichtbij.
    - De bank is ver weg.
  ro.a1.unit08.lesson01.teach.magazinul_aproape:
    title: De winkel is dichtbij
    gloss: Magazinul este aproape. (De winkel is dichtbij.)
    note: Een korte, volledige zin -- na *aproape* hoeft geen plaatsnaam te staan als al duidelijk is welke plek je bedoelt.
  ro.a1.unit08.lesson01.teach.banca_departe:
    title: De bank is ver weg
    gloss: Banca este departe. (De bank is ver weg.)
    note: Het tegenovergestelde van *aproape* -- hetzelfde eenvoudige patroon.
  ro.a1.unit08.lesson01.teach.unde_este_gara:
    title: Waar is het station?
    gloss: Unde este gara? (Waar is het station?)
    note: Zet *Unde este...?* en *gara* samen in één volledige vraag.
  ro.a1.unit08.lesson02.teach.spital_posta_biblioteca_statie:
    title: Ziekenhuis, postkantoor, bibliotheek, bushalte
    gloss: spital (ziekenhuis) · poștă (postkantoor) · bibliotecă (bibliotheek) · stație de autobuz (bushalte)
    note: 'Nog vier veelvoorkomende plaatsen -- net als gară/magazin/bancă krijgen ze het bepaald lidwoord als het om een specifieke plek gaat: *spitalul*, *poșta*, *biblioteca*, *stația de autobuz*.'
    example_gloss:
    - Het ziekenhuis is tegenover de winkel.
    - Het postkantoor is tussen de winkel en het ziekenhuis.
    - De bibliotheek is dicht bij het station.
    - De bushalte is naast de bibliotheek.
  ro.a1.unit08.lesson02.teach.langa_vizavi_intre:
    title: Naast, tegenover, tussen
    gloss: lângă (naast) · vizavi de (tegenover) · între (tussen)
    note: Drie manieren om een plek ten opzichte van een andere plek aan te geven. *Vizavi de* en *între* hebben *de*/*și* nodig om de tweede plek te verbinden; *lângă* sluit er direct op aan.
    example_gloss:
    - De winkel is naast het station.
    - Het ziekenhuis is tegenover de winkel.
    - Het postkantoor is tussen de winkel en het ziekenhuis.
  ro.a1.unit08.lesson02.teach.magazinul_langa_gara:
    title: De winkel is naast het station
    gloss: Magazinul este lângă gară. (De winkel is naast het station.)
    note: '*Lângă* sluit direct aan op de plaatsnaam, er is geen extra woord nodig.'
  ro.a1.unit08.lesson02.teach.spitalul_vizavi_magazin:
    title: Het ziekenhuis is tegenover de winkel
    gloss: Spitalul este vizavi de magazin. (Het ziekenhuis is tegenover de winkel.)
    note: '*Vizavi de* heeft *de* nodig voor de tweede plek.'
  ro.a1.unit08.lesson02.teach.posta_intre:
    title: Het postkantoor is tussen de winkel en het ziekenhuis
    gloss: Poșta este între magazin și spital. (Het postkantoor is tussen de winkel en het ziekenhuis.)
    note: '*Între* noemt twee plekken, verbonden door *și* (en).'
  ro.a1.unit08.lesson02.teach.statia_langa_biblioteca:
    title: De bushalte is naast de bibliotheek
    gloss: Stația de autobuz este lângă bibliotecă. (De bushalte is naast de bibliotheek.)
    note: Hetzelfde patroon met *lângă* als bij de winkel en het station, nu met de bushalte en de bibliotheek.
  ro.a1.unit08.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Herhaling: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (hallo) · mulțumesc (dank je) · la revedere (tot ziens) · da (ja) · Ana, Mihai (namen)
    note: Allemaal al behandeld in eerdere units -- hier ontmoeten Ana en Mihai elkaar opnieuw, dit keer in de buurt.
  ro.a1.unit08.lesson03.teach.line01:
    title: Begroeten en vragen waar het postkantoor is
    gloss: Ana begroet Mihai en vraagt waar het postkantoor is.
    note: Combineert *Unde este* uit deze unit met de begroeting uit Unit 1.
  ro.a1.unit08.lesson03.teach.line02:
    title: De ligging aangeven
    gloss: Mihai zegt dat het postkantoor tussen de winkel en het ziekenhuis ligt.
    note: Gebruikt opnieuw de constructie *poșta*/*între ... și* uit deze unit.
  ro.a1.unit08.lesson03.teach.line03:
    title: Vragen naar de bibliotheek
    gloss: Ana vraagt of de bibliotheek dichtbij is.
    note: Een korte vervolgvraag met *este* en *aproape*.
  ro.a1.unit08.lesson03.teach.line04:
    title: Bevestigen en meer vertellen
    gloss: Mihai bevestigt dat de bibliotheek dicht bij het station is en voegt toe dat de bushalte naast de bibliotheek ligt.
    note: Combineert *aproape de* en *lângă* -- allebei voorzetsels uit deze unit -- in één zin.
  ro.a1.unit08.lesson03.teach.line05:
    title: Bedanken en afsluiten
    gloss: Ana bedankt Mihai en zegt tot ziens.
    note: '*Mulțumesc* is hier een eenvoudig bedankje aan het eind, hetzelfde woord als in *Bine, mulțumesc.* uit Unit 1.'
  ro.a1.unit08.lesson03.teach.line06:
    title: Het gesprek afsluiten
    gloss: Mihai zegt ook tot ziens, met de naam van Ana.
    note: Hetzelfde vriendelijke afscheid waarmee ook de dialogen van Unit 1, 5, 6 en 7 eindigden.
