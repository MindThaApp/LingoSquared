teaching:
  ro.a1.unit20.lesson01.teach.reminder_vreau_un_ce:
    title: 'Herhaling: Vreau, Un, Ce'
    gloss: Vreau (ik wil) · Un (een, mannelijk/onzijdig) · Ce (wat/welke)
    note: '*Vreau* (ik wil), *un* (een) en *ce* (wat, zoals in *Ce mai faceți?*) ken je al. Hier gebruik je ze opnieuw om om een kledingstuk te vragen.'
  ro.a1.unit20.lesson01.teach.tricou_vocab:
    title: T-shirt
    gloss: Tricou (t-shirt)
    note: 'Een onzijdig woord: het krijgt *un* (niet *o*), net als andere mannelijke/onzijdige woorden die je al kent, zoals *un leu*.'
    example_gloss:
    - Ik wil een t-shirt.
  ro.a1.unit20.lesson01.teach.culoare_vocab:
    title: Kleur
    gloss: Culoare (kleur)
    note: Een vrouwelijk woord, handig om te vragen in welke kleur iets verkrijgbaar is.
    example_gloss:
    - Welke kleur?
  ro.a1.unit20.lesson01.teach.rosu_vocab:
    title: Rood
    gloss: Roșu (rood)
    note: 'Staat na het zelfstandig naamwoord waarbij het hoort, de gewone Roemeense volgorde: *tricou roșu*, letterlijk ''shirt rood''.'
    example_gloss:
    - Ik wil een rood t-shirt.
  ro.a1.unit20.lesson01.teach.albastru_vocab:
    title: Blauw
    gloss: Albastru (blauw)
    note: 'Zelfde patroon als *roșu*: het staat na het zelfstandig naamwoord: *tricou albastru*.'
    example_gloss:
    - Ik wil een blauw t-shirt.
  ro.a1.unit20.lesson01.teach.vreau_tricou_rosu_phrase:
    title: Ik wil een rood t-shirt.
    gloss: Vreau un tricou roșu.
    note: 'De kernvraag: *vreau* (ik wil) + *un tricou* (een t-shirt) + *roșu* (rood), met de kleur na het zelfstandig naamwoord.'
  ro.a1.unit20.lesson02.teach.reminder_cat_costa_va_rog:
    title: 'Herhaling: Cât, Costă, Vă, Rog'
    gloss: Cât costă? (Hoeveel kost het?) · Vă rog (alstublieft, beleefd)
    note: '*Cât costă?* ken je van de marktles; *vă rog* is het beleefde ''alstublieft''. Hier gebruik je ze opnieuw om naar de prijs van een kledingstuk te vragen en je vraag beleefder te maken.'
  ro.a1.unit20.lesson02.teach.reminder_mic_mica_mare:
    title: 'Herhaling: Mic, Mică, Mare'
    gloss: Mic/Mică (klein, mannelijk-onzijdig/vrouwelijk) · Mare (groot, zelfde vorm voor mannelijk en vrouwelijk enkelvoud)
    note: De grootte-woorden die je al kent van het vergelijken van eten en drinken. Hier gebruik je ze opnieuw voor kledingmaten.
  ro.a1.unit20.lesson02.teach.pantaloni_vocab:
    title: Broek
    gloss: Pantaloni (broek)
    note: 'In het Roemeens meestal in het meervoud, net als ''pantalon'' in het Nederlands soms: *pantaloni* betekent één broek.'
    example_gloss:
    - Ik wil een broek.
  ro.a1.unit20.lesson02.teach.marime_vocab:
    title: Maat
    gloss: Mărime (maat)
    note: 'Een vrouwelijk woord: het past bij het vrouwelijke *mică* (klein) uit de herhaling hierboven en bij het onveranderlijke *mare* (groot).'
    example_gloss:
    - Welke maat?
  ro.a1.unit20.lesson02.teach.ce_marime_phrase:
    title: Welke maat?
    gloss: Ce mărime? (Welke maat?)
    note: 'De alledaagse vraag aan de toonbank: kort en zonder werkwoord, net zoals *Ce culoare?* (Welke kleur?).'
  ro.a1.unit20.lesson02.teach.marime_mica_va_rog_phrase:
    title: Maat klein, alstublieft.
    gloss: Mărime mică, vă rog.
    note: '*Mică* is de vrouwelijke vorm van *mic* en past bij het vrouwelijke *mărime*. Samen met *vă rog* uit de herhaling noem je beleefd je maat.'
  ro.a1.unit20.lesson02.teach.cat_costa_pantalonii_phrase:
    title: Hoeveel kost de broek?
    gloss: Cât costă pantalonii? (Hoeveel kost de broek?)
    note: '*Pantalonii* is de bepaalde vorm van *pantaloni* (''de broek''): mannelijke meervoudsnamen krijgen er een *-i* bij voor ''de'' (*pantaloni* → *pantalonii*). Gecombineerd met *cât costă* uit de herhaling.'
  ro.a1.unit20.lesson03.teach.reminder_buna_multumesc_bine_la_revedere_si:
    title: 'Herhaling: Bună, Mulțumesc, Bine, La revedere, Și'
    gloss: Bună (hoi) · Mulțumesc (bedankt) · Bine (goed) · La revedere (tot ziens) · Și (en)
    note: Alledaagse begroetingen plus *și* (en), hier opnieuw gebruikt om het winkelgesprek te openen en af te sluiten.
  ro.a1.unit20.lesson03.teach.reminder_zece_douazeci_de_lei:
    title: 'Herhaling: Zece, Douăzeci, De, Lei'
    gloss: Zece (tien) · Douăzeci (twintig) · De (van, gebruikt voor lei vanaf 20) · Lei (munteenheid, meervoud van leu)
    note: Getallen en de munteenheid *leu/lei* ken je al. Hier gebruik je ze opnieuw voor de prijzen van het t-shirt en de broek.
  ro.a1.unit20.lesson03.teach.line01:
    title: Begroet Mihai en vraag om een rood t-shirt
    gloss: Ana begroet Mihai en zegt dat ze een rood t-shirt wil.
    note: 'De vraagzin uit de eerste les: *Vreau un tricou roșu.*'
  ro.a1.unit20.lesson03.teach.line02:
    title: Vraag welke maat
    gloss: Mihai vraagt welke maat ze wil.
    note: De alledaagse winkelvraag *Ce mărime?* (Welke maat?).
  ro.a1.unit20.lesson03.teach.line03:
    title: Noem beleefd de maat en vraag de prijs
    gloss: Ana vraagt om een kleine maat en vraagt dan hoeveel het kost.
    note: '*Mărime mică, vă rog* (maat klein, alstublieft), daarna *Cât costă?* (Hoeveel kost het?).'
  ro.a1.unit20.lesson03.teach.line04:
    title: Noem de prijs
    gloss: Mihai zegt dat het vijftig lei kost.
    note: Gebruikt *cincizeci de lei* uit de herhaling.
  ro.a1.unit20.lesson03.teach.line05:
    title: Stem in en vraag ook naar de broek
    gloss: Ana stemt in, zegt dan dat ze ook een broek wil en vraagt wat die kost.
    note: '*Și* betekent hier ''ook'': *Vreau și pantaloni* – ''Ik wil ook een broek.'''
  ro.a1.unit20.lesson03.teach.line06:
    title: Noem de prijs van de broek
    gloss: Mihai zegt dat de broek honderdtwintig lei kost.
    note: 'Vanaf twintig zet het Roemeens *de* tussen het getal en het zelfstandig naamwoord: *o sută douăzeci de lei*.'
  ro.a1.unit20.lesson03.teach.line07:
    title: Bedank Mihai en zeg tot ziens
    gloss: Ana bedankt hem en zegt tot ziens.
    note: Een beleefd bedankje en afscheid.
  ro.a1.unit20.lesson03.teach.line08:
    title: Zeg tot ziens
    gloss: Mihai zegt tot ziens.
    note: Een eenvoudig afscheid, met de naam van Ana erbij.
