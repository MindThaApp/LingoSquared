teaching:
  ro.a1.unit28.lesson01.teach.a_suna:
    title: Bellen
    gloss: bellen
    note: De infinitief van het werkwoord voor telefoneren.
    example_gloss: Ik moet je bellen.
  ro.a1.unit28.lesson01.teach.te_sun:
    title: Zeggen dat je belt
    gloss: Ik bel je.
    note: '*Sun* is de *eu*-vorm van *a suna* (bellen); *te* ("je") staat voor het werkwoord, en het Roemeens gebruikt hier de tegenwoordige tijd waar Nederlands ook "ik bel je" kan zeggen voor de toekomst.'
  ro.a1.unit28.lesson01.teach.alo_sunt_ana:
    title: De telefoon opnemen
    gloss: Hallo, met Ana.
    note: '*Alo* zeg je als je de telefoon opneemt; *sunt* + naam zegt wie je bent, zoals "met ..." in het Nederlands.'
  ro.a1.unit28.lesson01.teach.alo_sunt_mihai:
    title: Mihai neemt op dezelfde manier op
    gloss: Hallo, met Mihai.
    note: Hetzelfde patroon *Alo, sunt* + naam als in *Alo, sunt Ana*.
  ro.a1.unit28.lesson02.teach.cu_cine_vorbesc:
    title: Vragen wie er belt
    gloss: Met wie spreek ik?
    note: '*Cu cine vorbesc?* (letterlijk "met wie spreek ik?") is de standaardvraag om te weten wie een onbekende beller is.'
  ro.a1.unit28.lesson02.teach.vorbiti_cu_ana:
    title: Jezelf formeel voorstellen
    gloss: U spreekt met Ana.
    note: '*Vorbiți cu* + naam is het formele antwoord: *vorbiți* is de *dumneavoastră*-vorm van *a vorbi* (spreken).'
  ro.a1.unit28.lesson03.teach.poti_sa_repeti:
    title: Vragen om herhaling
    gloss: Kun je dat herhalen?
    note: '*Poți să* ... (Kun je ...?) plus *repeți* (je herhaalt) plus *asta* (dat).'
  ro.a1.unit28.lesson03.teach.nu_vorbi_atat:
    title: Vragen om langzamer te praten
    gloss: Praat niet zo snel, alsjeblieft.
    note: '*Nu vorbi* ("praat niet") is *nu* + de *tu*-vorm; *atât de repede* betekent "zo snel".'
  ro.a1.unit28.lesson03.teach.nu_te_aud:
    title: Zeggen dat je niet goed hoort
    gloss: Ik hoor je niet goed.
    note: '*Nu te aud bine*: *aud* is "ik hoor", *te* ("je") staat voor het werkwoord en *bine* betekent "goed".'
  ro.a1.unit28.lesson04.teach.mesajul:
    title: Appje
    gloss: het berichtje
    note: '*Mesaj* is mannelijk in het enkelvoud en vrouwelijk in het meervoud (*un mesaj*, *două mesaje*); het bepaald lidwoord komt aan het eind: *mesajul*.'
    example_gloss: Het sms'je is van Ana.
  ro.a1.unit28.lesson04.teach.iti_trimit_un:
    title: Zeggen dat je iets stuurt
    gloss: Ik stuur je een berichtje.
    note: '*Îți* ("aan jou") is een datief-voornaamwoord vóór het werkwoord: *Îți trimit un mesaj*.'
  ro.a1.unit28.lesson04.teach.te_sun_inapoi:
    title: Zeggen dat je terugbelt
    gloss: Ik bel je straks terug.
    note: '*Înapoi* ("terug") staat na het werkwoord: *te sun înapoi* is "ik bel je terug", en *mai târziu* betekent "later".'
  ro.a1.unit28.lesson05.teach.mihai_salut_ana:
    title: Lees een appgesprek
    gloss: 'Mihai: Hoi Ana, kun je me bellen? Ik moet je iets vertellen. Ana: Ja, tuurlijk, ik bel je over vijf minuten terug.'
    note: Let op wat Mihai vraagt, waarom, en wanneer Ana zegt terug te bellen.
    glosses:
      Salut: hoi
      poți: kunnen
      suna: bellen
      Trebuie: moeten
      ceva: iets
      spun: vertellen
      sigur: natuurlijk
      sun: bellen
      cinci: vijf
      minute: minuten
      înapoi: terug
  ro.a1.unit28.lesson06.teach.mihai_alo_sunt:
    title: Mihai neemt op
    gloss: 'Mihai: Hallo, met Mihai.'
    note: 'Hetzelfde patroon *Alo, sunt* + naam uit les 1, nu in het echte gesprek: wie opneemt, spreekt eerst en noemt zijn naam.'
  ro.a1.unit28.lesson06.teach.ana_salut_mihai:
    title: Ana zegt wie ze is
    gloss: 'Ana: Hoi Mihai, met Ana. Mihai: Fijn dat je belt!'
    note: '*Ce bine că* ... ("wat fijn dat ...") drukt een positieve reactie op iets uit; *suni* is de *tu*-vorm van *a suna*.'
  ro.a1.unit28.lesson06.teach.ana_cum_a:
    title: Ana vraagt naar de dienst
    gloss: 'Ana: Hoe was je eerste dienst?'
    note: '*A fost* betekent "was" (verleden tijd van *a fi*). Het is een perfect compus, gevormd zoals *am mâncat*; zie de uitleg na de volgende regel.'
  ro.a1.unit28.lesson06.teach.mihai_a_mers:
    title: Mihai vertelt goed nieuws
    gloss: 'Mihai: Het ging heel goed, beter dan ik dacht.'
    note: '*A mers* is het verleden van *a merge* (gaan, hier "verlopen"); *credeam* betekent "ik dacht" (een verleden vorm van *a crede*).'
  ro.a1.unit28.lesson06.teach.a_fost_a:
    title: 'Verleden vormen: a fost, a mers, credeam'
    gloss: was → zijn, ging → gaan, dacht → denken
    note: '*A fost* en *a mers* zijn vormen van het perfect compus (*a* + participiu) en *credeam* is een imperfect. Leer ze voorlopig gewoon uit het hoofd als vaste uitdrukkingen in de contexten van deze les; de volledige regels voor de verleden tijd komen op een later niveau.'
  ro.a1.unit28.lesson06.teach.ana_ma_bucur:
    title: Ana is trots
    gloss: 'Ana: Fijn om te horen! Ik ben trots op je.'
    note: '*Mândră de* ("trots op") is een vaste combinatie; *de* is verplicht. Een man zegt *mândru*.'
  ro.a1.unit28.lesson06.teach.mihai_iti_multumesc:
    title: Mihai is ontroerd
    gloss: 'Mihai: Bedankt, dat betekent veel voor me.'
    note: '*Înseamnă* is de hij/zij/het-vorm van *a însemna* (betekenen); *pentru mine* ("voor mij") zegt voor wie het belangrijk is.'
  ro.a1.unit28.lesson06.teach.prima_lui_tura:
    title: Zijn
    gloss: Zijn eerste dienst is heel goed gegaan.
    note: '*Lui* na het zelfstandig naamwoord betekent "zijn": *prima lui tură*. (Voor "haar" is het *ei*.)'
