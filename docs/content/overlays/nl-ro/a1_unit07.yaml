answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: '"Vreau" (I want, plain) and "Aș dori" (I would like, polite, established in unit06) are a genuine directness contrast, not interchangeable synonyms -- accept either for a general "I want/I would like" unless an exercise explicitly names one. "Vă rog" (formal) and "te rog" (informal, both established in unit06) remain a register-sensitive pair here too. Ana and Mihai''s market dialogue keeps their existing polite register with each other (vă rog, not te rog).'
course:
  title: Roemeens A1
  description: 'Prijzen en hoeveelheden vragen in het Roemeens: de munteenheid leu/lei, scump/ieftin en boodschappen doen op de markt, zoals roșii (tomaten) en cartofi (aardappelen) per kilo. Ana en Mihai gaan verder met hun marktbezoek.'
units:
  ro.a1.unit07.shopping:
    title: Winkelen
lessons:
  ro.a1.unit07.lesson01.cat_costa:
    title: Hoeveel kost het?
  ro.a1.unit07.lesson02.rosii_si_cartofi:
    title: Tomaten en aardappelen
  ro.a1.unit07.lesson03.la_piata:
    title: Op de markt
teaching:
  ro.a1.unit07.lesson01.teach.reminder_un_numere:
    title: 'Herhaling: un, doi, cinci, zece, douăzeci'
    gloss: un (een) · doi (twee) · cinci (vijf) · zece (tien) · douăzeci (twintig)
    note: Ze kwamen allemaal al in eerdere units voor (*un* in Unit 4, de getallen in Unit 2). Hier keren ze terug om over prijzen te praten.
  ro.a1.unit07.lesson01.teach.cat_costa:
    title: Hoeveel kost het?
    gloss: Cât costă? (Hoeveel kost het?)
    note: De gewone manier om in het Roemeens naar een prijs te vragen. Zet de naam van het product erachter, of gebruik de zin alleen als duidelijk is om welk product het gaat.
  ro.a1.unit07.lesson01.teach.leu:
    title: Leu (munteenheid)
    gloss: 'leu (de Roemeense munteenheid, meervoud: lei)'
    note: De munteenheid van Roemenië. Leu is enkelvoud (één leu); het meervoud lei is onregelmatig en niet leu met een gewone uitgang.
    example_gloss: Het kost één leu.
  ro.a1.unit07.lesson01.teach.costa_cinci_lei:
    title: Het kost acht lei
    gloss: Costă opt lei. (Het kost acht lei.)
    note: Bij 2-19 blijft lei gewoon staan; er komt geen extra woord voor.
  ro.a1.unit07.lesson01.teach.costa_douazeci_de_lei:
    title: Het kost dertig lei
    gloss: Costă treizeci de lei. (Het kost dertig lei.)
    note: Vanaf 20 zet het Roemeens *de* voor het getelde zelfstandig naamwoord. Dat is dezelfde regel als in Unit 2 bij *ani* (jaren), nu toegepast op *lei*.
  ro.a1.unit07.lesson01.teach.leu_lei_de_rule:
    title: 'Regel: leu → lei, en wanneer je de gebruikt'
    gloss: 'leu → lei · getallen 2-19: geen *de* · getallen 20+: met *de*'
    note: Precies hetzelfde patroon als de regel voor *ani* in Unit 2 (câți ani ai / am treizeci de ani). Als je het bij één woord kent, werkt het bij lei net zo.
  ro.a1.unit07.lesson01.teach.scump:
    title: Duur
    gloss: scump (duur)
    note: Een veelgehoorde reactie op een prijs die je te hoog vindt.
    example_gloss: Acht lei? Duur!
  ro.a1.unit07.lesson01.teach.ieftin:
    title: Goedkoop
    gloss: ieftin (goedkoop)
    note: 'Het tegenovergestelde van scump: een goede prijs.'
    example_gloss: Eén leu? Goedkoop!
  ro.a1.unit07.lesson02.teach.reminder_un_o_si_as_dori_rog:
    title: 'Herhaling: un, o, și, aș dori, vă rog, te rog'
    gloss: un/o (een) · și (en) · aș dori (ik wil graag) · vă rog (alstublieft, formeel) · te rog (alsjeblieft, informeel)
    note: '*Aș dori*, *vă rog* en *te rog* kwamen voor het eerst voor in de caféscène van Unit 6. Hier keren ze terug op de markt.'
  ro.a1.unit07.lesson02.teach.piata:
    title: Markt
    gloss: piață (markt)
    note: 'Een vrouwelijk woord: de openluchtmarkt of overdekte markt waar je verse levensmiddelen koopt.'
    example_gloss: Hoeveel kost het op de markt?
  ro.a1.unit07.lesson02.teach.rosii:
    title: Tomaten
    gloss: roșii (tomaten)
    note: Meervoud van roșie (een tomaat). Je gebruikt het meervoud als je het over het kopen van tomaten in het algemeen hebt.
    example_gloss: Ik wil graag tomaten.
  ro.a1.unit07.lesson02.teach.cartofi:
    title: Aardappelen
    gloss: cartofi (aardappelen)
    note: Meervoud van cartof (een aardappel), hetzelfde patroon als bij roșii.
    example_gloss: Ik wil graag aardappelen.
  ro.a1.unit07.lesson02.teach.kilogram:
    title: Kilogram
    gloss: kilogram (kilo)
    note: 'De standaardeenheid om groente en fruit op gewicht te kopen. *De* verbindt het met wat je koopt: kilogram *de* roșii, ''een kilo tomaten''.'
    example_gloss: Een kilo tomaten.
  ro.a1.unit07.lesson02.teach.vreau:
    title: ik wil
    gloss: vreau (ik wil)
    note: Directer en eenvoudiger dan *aș dori* ('ik wil graag'). Op de markt kan allebei, vreau is alleen minder formeel.
    example_gloss: Ik wil aardappelen.
  ro.a1.unit07.lesson02.teach.unde_pot_sa_cumpar:
    title: Waar kan ik ... kopen?
    gloss: Unde pot să cumpăr roșii? (Waar kan ik tomaten kopen?)
    note: Een handige vraag als je nog niet weet waar je moet winkelen -- vervang roșii door elk ander product dat je zoekt.
  ro.a1.unit07.lesson02.teach.cat_costa_kilogram_rosii:
    title: Hoeveel kost een kilo tomaten?
    gloss: Cât costă un kilogram de roșii? (Hoeveel kost een kilo tomaten?)
    note: Combineert Cât costă en de constructie kilogram de ... in één volledige vraag.
  ro.a1.unit07.lesson02.teach.vreau_kilogram_cartofi:
    title: Ik wil een kilo aardappelen
    gloss: Vreau un kilogram de cartofi. (Ik wil een kilo aardappelen.)
    note: Hetzelfde patroon kilogram de ..., nu als bewering met vreau in plaats van als vraag.
  ro.a1.unit07.lesson03.teach.reminder_buna_multumesc_la_revedere:
    title: 'Herhaling: bună, ziua, mulțumesc, bine, la revedere, Ana, Mihai'
    gloss: bună ziua (goedendag / hallo) · mulțumesc (dank je wel) · bine (goed) · la revedere (tot ziens) · Ana, Mihai (namen)
    note: Allemaal al voorgekomen in de dialogen van Unit 1 en Unit 6 -- hier ontmoeten Ana en Mihai elkaar opnieuw, nu op de markt.
  ro.a1.unit07.lesson03.teach.line01:
    title: Begroeten en naar de prijs vragen
    gloss: Ana begroet Mihai en vraagt wat een kilo tomaten kost.
    note: Combineert Cât costă uit deze unit met de begroeting uit Unit 1.
  ro.a1.unit07.lesson03.teach.line02:
    title: De prijs noemen
    gloss: Mihai zegt dat het acht lei kost en reageert dat het goedkoop is.
    note: Hergebruikt costă/opt lei/ieftin uit deze unit.
  ro.a1.unit07.lesson03.teach.line03:
    title: Beleefd bestellen en iets toevoegen
    gloss: Ana stemt in, vraagt beleefd om een kilo tomaten en zegt dat ze ook aardappelen wil.
    note: Combineert aș dori, vă rog en vreau -- beide registers uit de woordenschat van deze unit in één regel.
  ro.a1.unit07.lesson03.teach.line04:
    title: De tweede prijs noemen
    gloss: Mihai zegt dat een kilo aardappelen vijf lei kost.
    note: Hergebruikt zece (tien) uit Unit 2, dat in lesson01 van deze unit al als herhaling is opgenomen.
  ro.a1.unit07.lesson03.teach.line05:
    title: Bedanken en afsluiten
    gloss: Ana bedankt Mihai en zegt tot ziens.
    note: '*Mulțumesc* is hier een eenvoudig afsluitend bedankje, hetzelfde woord als in *Bine, mulțumesc.* uit Unit 1.'
  ro.a1.unit07.lesson03.teach.line06:
    title: Het gesprek afsluiten
    gloss: Mihai zegt ook tot ziens en noemt Ana bij haar naam.
    note: Hetzelfde vriendelijke afsluitpatroon waarmee de dialogen van Unit 1, 5 en 6 eindigden.
