teaching:
  ro.a1.unit27.lesson01.teach.fericit_trist_suparat:
    title: Blij, verdrietig en boos
    gloss: blij, verdrietig, boos
    note: 'Drie basiswoorden voor gevoelens, gebruikt met *a fi* (zijn). Elk heeft een vrouwelijke vorm op *-ă*: *fericită*, *tristă*, *supărată*.'
    example_gloss:
    - Ik ben blij.
    - Ik ben verdrietig.
    - Ik ben boos.
  ro.a1.unit27.lesson01.teach.sunt_fericit:
    title: Zeggen dat je blij bent
    gloss: Ik ben blij.
    note: '*Sunt* (van *a fi*, zijn) + een bijvoeglijk naamwoord voor een gevoel is het basispatroon, net als in het Nederlands ''Ik ben ...''. Een vrouw zegt *Sunt fericită*.'
  ro.a1.unit27.lesson01.teach.nu_sunt_suparat:
    title: Gevoelens tegenover elkaar zetten
    gloss: Ik ben niet boos, ik ben verdrietig.
    note: '*Nu* voor het werkwoord maakt de zin ontkennend: *Nu sunt supărat*. De tweede zin noemt dan het echte gevoel.'
  ro.a1.unit27.lesson02.teach.de_ce_esti:
    title: Vragen waarom
    gloss: Waarom ben je blij?
    note: '*De ce* (waarom) is de standaardvraag naar een reden.'
  ro.a1.unit27.lesson02.teach.sunt_fericit_pentru:
    title: Een reden geven
    gloss: Ik ben blij omdat ik een nieuw appartement heb.
    note: '*Pentru că* (omdat) leidt de bijzin met de reden in; de woordvolgorde blijft gewoon: *am un apartament nou*.'
  ro.a1.unit27.lesson02.teach.sunt_trist_pentru:
    title: Een negatieve reden
    gloss: Ik ben verdrietig omdat het regent.
    note: '*Plouă* (het regent) heeft in het Roemeens geen onderwerp nodig, dus het kan alleen als bijzin met de reden staan.'
  ro.a1.unit27.lesson03.teach.emotionat:
    title: Nerveus
    gloss: nerveus
    note: Het standaardwoord voor zenuwachtigheid.
    example_gloss: Ik ben nerveus voor mijn eerste dienst.
  ro.a1.unit27.lesson03.teach.sunt_emotionat_pentru:
    title: Zeggen waarvoor je zenuwachtig bent
    gloss: Ik ben nerveus voor mijn eerste dienst.
    note: '*Pentru* (letterlijk ''voor'') geeft aan waarover je zenuwachtig bent, waar het Nederlands ''over'' gebruikt.'
  ro.a1.unit27.lesson03.teach.nu_ti_face:
    title: Iemand geruststellen
    gloss: Maak je geen zorgen.
    note: '*Nu-ți face griji* (letterlijk ''maak geen zorgen voor jezelf'') is de vaste uitdrukking om iemand gerust te stellen. Tegen een vreemde zeg je: *Nu vă faceți griji*.'
  ro.a1.unit27.lesson04.teach.cum_se_simte:
    title: Vragen hoe iemand zich voelt
    gloss: Hoe voelt Mihai zich?
    note: '*A se simți* (voelen) is wederkerend: *mă simt* (ik), *te simți* (jij), *se simte* (hij/zij). Zo vraag je naar gevoelens of beschrijf je ze.'
  ro.a1.unit27.lesson04.teach.el_se_simte:
    title: Beschrijven hoe iemand zich voelt
    gloss: Hij voelt zich nerveus.
    note: '*Se* is het wederkerend voornaamwoord voor hij/zij en staat voor het werkwoord: *se simte*.'
  ro.a1.unit27.lesson04.teach.de_ce_se:
    title: Vragen waarom iemand zich zo voelt
    gloss: Waarom voelt hij zich nerveus?
    note: Combineert *de ce* met het patroon *se simte* uit *El se simte emoționat*.
  ro.a1.unit27.lesson05.teach.salut_ana_sunt:
    title: Lees een bericht over gevoelens
    gloss: Hoi Ana, ik ben een beetje zenuwachtig voor mijn eerste dienst alleen. Maar ik ben ook blij, want ik heb een nieuwe baan en een nieuw appartement. Ik denk dat het wel goed komt.
    note: Let op waarvoor de schrijver zenuwachtig is, wat hem blij maakt en hoe hij er in het algemeen over denkt.
    glosses:
      puțin: een beetje
      emoționat: nerveus
      prima: eerste
      tură: dienst
      singur: alleen
      fericit: blij
      fiindcă: want, omdat
      nou: nieuwe
      serviciu: werk
      apartament: appartement
      cred: denken
      rezolvă: 'gaan (hier: goed komen)'
  ro.a1.unit27.lesson06.teach.ana_salut_mihai:
    title: Ana vraagt hoe Mihai zich voelt
    gloss: 'Ana: Hoi Mihai, hoe voel je je voor je eerste dienst?'
    note: '*Cum te simți* gebruikt het wederkerende *te* (''jezelf''); in *prima ta tură* past het bezittelijk voornaamwoord *ta* bij het vrouwelijke *tură*.'
  ro.a1.unit27.lesson06.teach.mihai_sunt_putin:
    title: Mihai geeft toe dat hij zenuwachtig is
    gloss: 'Mihai: Ik ben een beetje zenuwachtig, eerlijk gezegd.'
    note: '*Sincer să fiu* (eerlijk gezegd) maakt de bekentenis zachter.'
  ro.a1.unit27.lesson06.teach.ana_nu_ti:
    title: Ana stelt hem gerust
    gloss: 'Ana: Maak je geen zorgen, je redt het wel!'
    note: '*O să te descurci bine* (letterlijk ''je zult je goed redden'') is een bemoedigende vaste uitdrukking; *o să* + werkwoord vormt de toekomende tijd.'
  ro.a1.unit27.lesson06.teach.mihai_multumesc_chiar:
    title: Mihai bedankt haar
    gloss: 'Mihai: Dank je, dat helpt echt.'
    note: '*Ajută* is de hij/zij/het-vorm van *a ajuta* (helpen); hier betekent het ''het helpt''.'
  ro.a1.unit27.lesson06.teach.ana_si_dupa:
    title: Ana voorspelt hoe het afloopt
    gloss: 'Ana: En daarna ben je vast heel blij en trots.'
    note: '*Sigur* (zeker) drukt een stellige voorspelling uit; *mândru* (trots) is een nieuw, nuttig bijvoeglijk naamwoord (*mândră* voor een vrouw).'
  ro.a1.unit27.lesson06.teach.mihai_da_si:
    title: Mihai is het met haar eens
    gloss: 'Mihai: Ja, dat denk ik ook.'
    note: '*Și eu cred asta* (letterlijk ''ik denk dit ook'') is de natuurlijke manier om het met iemands mening eens te zijn.'
  ro.a1.unit27.lesson06.teach.mihai_este_emotionat:
    title: Samenvatting met este, lui en îl
    gloss: Mihai is zenuwachtig voor zijn eerste dienst. Ana helpt hem.
    note: '*Este* is de hij/zij-vorm van *a fi* (zijn); *lui* achter het zelfstandig naamwoord betekent ''zijn''; *îl* betekent ''hem'' en staat voor het werkwoord: *îl ajută*. Drie kleine maar onmisbare woorden om over iemand anders te praten.'
