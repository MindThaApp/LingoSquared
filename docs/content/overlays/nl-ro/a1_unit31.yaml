answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Roemeens A1
  description: 'Roemeens voor beginners om iemands uiterlijk globaal te beschrijven: lengte en leeftijdsindruk, haar- en oogkleur, de kernvraag Cum arată ...? en het vergelijken van het uiterlijk van twee mensen.'
units:
  ro.a1.unit31.aspect:
    title: Uiterlijk beschrijven
lessons:
  ro.a1.unit31.lesson01.inalt_scund_batran_si:
    title: Lang, klein, oud en jong
  ro.a1.unit31.lesson02.descrierea_parului:
    title: Haar beschrijven
  ro.a1.unit31.lesson03.ochii_si_cum_arata:
    title: Ogen en hoe ziet iemand eruit?
  ro.a1.unit31.lesson04.ana_o_descrie_pe:
    title: Ana beschrijft Nina
  ro.a1.unit31.lesson05.ii_comparam_pe_andrei:
    title: Andrei en Elena vergelijken
  ro.a1.unit31.lesson06.mihai_o_recunoaste_pe:
    title: Mihai herkent Nina
teaching:
  ro.a1.unit31.lesson01.teach.inalt_scund:
    title: Lang en klein
    gloss: lang / klein
    note: '*Înalt* beschrijft een lange man en *scund* een kleine man. Beide hebben een vrouwelijke vorm: *înaltă*, *scundă*.'
    example_gloss:
    - Elena is lang.
    - Andrei is klein.
  ro.a1.unit31.lesson01.teach.batran_tanar:
    title: Oud en jong
    gloss: oud / jong
    note: '*Bătrân* en *tânăr* geven hier een algemene indruk van leeftijd, geen exact aantal jaren. Vrouwelijke vormen: *bătrână*, *tânără*.'
    example_gloss:
    - Opa is oud.
    - Mihai is jong.
  ro.a1.unit31.lesson01.teach.pentru_varsta_exacta:
    title: 'Bătrân: een indruk of een getal'
    gloss: Voor een exacte leeftijd vraag je Câți ani ai?, terwijl bătrân een algemene indruk geeft, zoals in Bunicul este bătrân.
    note: Naar een exacte leeftijd vraag je met *Câți ani ai?* Hier beschrijft *bătrân* hoe oud iemand eruitZIET, zonder getal.
  ro.a1.unit31.lesson01.teach.elena_este_inalta:
    title: Elena is lang en Andrei is klein
    gloss: Elena is lang en Andrei is klein.
    note: 'Een eenvoudige samengestelde zin met *și* (en), als voorbereiding op de directe vergelijking in les 5; het adjectief komt overeen met het onderwerp: *înaltă* voor Elena, *scund* voor Andrei.'
  ro.a1.unit31.lesson02.teach.parul:
    title: Haar
    gloss: het haar
    note: '*Păr* is een mannelijk zelfstandig naamwoord; het lidwoord komt aan het eind: *părul* (het haar).'
    example_gloss: Mihai heeft kort zwart haar.
  ro.a1.unit31.lesson02.teach.blond_maro_carunt:
    title: Blond, bruin en grijs
    gloss: blond / bruin / grijs
    note: Drie haarkleuren. Ze staan na het zelfstandig naamwoord *păr* (mannelijk), dus je zegt *părul blond*, *păr maro*, *păr cărunt*.
    example_gloss:
    - Ana heeft blond haar.
    - Andrei heeft bruin haar.
    - Opa heeft grijs haar.
  ro.a1.unit31.lesson02.teach.lung_scurt:
    title: Lang en kort (haar)
    gloss: lang / kort (haar)
    note: '*Lung* (lang) en *scurt* (kort) beschrijven de lengte van haar; net als kleuren staan ze na het zelfstandig naamwoord.'
    example_gloss:
    - Elena heeft lang haar.
    - Andrei heeft kort haar.
  ro.a1.unit31.lesson02.teach.adjectivul_vine_dupa:
    title: Het bijvoeglijk naamwoord staat achter het zelfstandig naamwoord
    gloss: 'Het adjectief komt na het zelfstandig naamwoord: păr scurt, păr lung, păr blond, păr maro, păr cărunt, păr negru.'
    note: In het Roemeens komt het adjectief NA het zelfstandig naamwoord (*păr scurt*), terwijl je in het Nederlands het adjectief ervoor zet ("kort haar").
  ro.a1.unit31.lesson02.teach.posesivul_vine_dupa:
    title: Zijn en haar komen na het zelfstandig naamwoord
    gloss: 'Het bezittelijk voornaamwoord komt na het zelfstandig naamwoord: părul ei (haar haar), ochii lui (zijn ogen).'
    note: '*Ei* betekent "haar" en *lui* betekent "zijn"; beide staan na het zelfstandig naamwoord: *părul ei*. Uit de context blijkt wie bedoeld wordt.'
  ro.a1.unit31.lesson02.teach.mihai_are_parul:
    title: Mihai heeft kort zwart haar
    gloss: Mihai heeft kort zwart haar.
    note: '*Negru* (zwart) is een kleuradjectief; het staat na het zelfstandig naamwoord: *păr negru*.'
  ro.a1.unit31.lesson02.teach.ana_are_parul:
    title: Ana heeft lang blond haar
    gloss: Ana heeft lang blond haar.
    note: Combineert de woorden voor lengte en kleur uit deze les in één natuurlijke zin.
  ro.a1.unit31.lesson03.teach.ochii:
    title: Ogen
    gloss: de ogen
    note: '*Ochi* (oog/ogen) ziet er in het enkelvoud en het meervoud hetzelfde uit; het lidwoord laat het getal zien: *ochiul* (het oog), *ochii* (de ogen).'
    example_gloss: Mihai heeft bruine ogen.
  ro.a1.unit31.lesson03.teach.albastru_maro_verde:
    title: Blauw, bruin en groen
    gloss: blauw / bruin / groen
    note: '*Albastru* (blauw), *maro* (bruin) en *verde* (groen) zijn kleuradjectieven. *Maro* verandert nooit; *albastru* wordt *albaștri* en *verde* wordt *verzi* in het meervoud.'
    example_gloss:
    - Ana heeft blauwe ogen.
    - Andrei heeft bruine ogen.
    - Elena heeft groene ogen.
  ro.a1.unit31.lesson03.teach.la_plural_adjectivul:
    title: Bijvoeglijke naamwoorden in het meervoud
    gloss: 'In het meervoud verandert het bijvoeglijk naamwoord: ochi albaștri, ochi maro, ochi verzi.'
    note: Bij het meervoud *ochi* krijgt het bijvoeglijk naamwoord de meervoudsvorm (*albaștri*, *verzi*); *maro* blijft hetzelfde. Vergelijk het enkelvoud *păr albastru*.
  ro.a1.unit31.lesson03.teach.cum_arata_ana:
    title: Hoe ziet Ana eruit?
    gloss: Hoe ziet Ana eruit?
    note: '*Cum arată ...?* is de kernvraag van deze unit; gebruik hem om te vragen naar het uiterlijk van iedereen.'
  ro.a1.unit31.lesson03.teach.ana_are_parul:
    title: Ana heeft lang blond haar en blauwe ogen
    gloss: Ana heeft lang blond haar en blauwe ogen.
    note: Een voorbeeldantwoord dat haar en ogen met *și* in één zin combineert.
  ro.a1.unit31.lesson04.teach.ana_vine_o:
    title: Ana stelt Nina voor
    gloss: 'Ana: Er komt een nieuw meisje naar het taalcafé. Ze heet Nina.'
    note: '*Vine o fată nouă* ("er komt een nieuw meisje") introduceert iemand nieuws; *O cheamă Nina* geeft haar naam.'
  ro.a1.unit31.lesson04.teach.mihai_bine_cum:
    title: Mihai vraagt hoe ze eruitziet
    gloss: 'Mihai: Goed! Hoe ziet ze eruit?'
    note: 'Dezelfde kernvraag van de unit, maar zonder naam: *Cum arată?* (uit de context is duidelijk om wie het gaat).'
  ro.a1.unit31.lesson04.teach.ana_este_scunda:
    title: Ana beschrijft Nina's lengte en haar
    gloss: 'Ana: Ze is klein en heeft kort blond haar.'
    note: Combineert *scundă* uit les 1 met de haarwoordenschat uit les 2.
  ro.a1.unit31.lesson04.teach.mihai_si_ochii:
    title: Mihai vraagt naar haar ogen
    gloss: 'Mihai: En haar ogen?'
    note: '*Și ochii?* ("En de ogen?") is een korte vervolgvraag; uit de context is duidelijk om wie het gaat.'
  ro.a1.unit31.lesson04.teach.ana_are_ochi:
    title: Ana beschrijft Nina's ogen
    gloss: 'Ana: Ze heeft groene ogen.'
    note: Gebruikt *ochi verzi* uit les 3 opnieuw.
  ro.a1.unit31.lesson04.teach.mihai_multumesc_atunci:
    title: Mihai zal haar herkennen
    gloss: 'Mihai: Bedankt! Dan herken ik haar zeker.'
    note: '*O recunosc* betekent "ik herken haar": *o* is het lijdend voorwerp "haar" en staat voor het werkwoord.'
  ro.a1.unit31.lesson05.teach.andrei_si_elena:
    title: Andrei en Elena vergelijken
    gloss: Andrei en Elena zijn broer en zus, maar ze zien er verschillend uit. Andrei is klein en heeft kort bruin haar en bruine ogen. Elena is groter dan Andrei en heeft lang bruin haar en groene ogen. Hoe zie jij eruit?
    note: Een korte vergelijking met alle kleur- en lengtewoorden die tot nu toe zijn geleerd, met als slot de kernvraag van de unit aan de lezer.
    glosses:
      frate: broer
      soră: zus
      arată: eruitzien
      diferit: verschillend
      scund: klein
      scurt: klein
      maro: bruin
      părul: haar
      ochi: ogen
      înaltă: groter
      lung: lang
      verzi: groen
      arăți: 'eruitzien (zoals in: hoe je eruitziet)'
  ro.a1.unit31.lesson05.teach.comparativul_se_formeaza:
    title: Vergelijken met mai ... decât
    gloss: 'De vergrotende trap wordt gevormd met mai + bijvoeglijk naamwoord + decât: Elena este mai înaltă decât Andrei.'
    note: 'In het Roemeens staat *mai* ("meer") voor het bijvoeglijk naamwoord en *decât* ("dan") voor de tweede persoon: *mai înaltă decât Andrei*.'
  ro.a1.unit31.lesson05.teach.elena_are_parul:
    title: Elena heeft langer haar dan Andrei
    gloss: Elena heeft langer haar dan Andrei.
    note: '*Mai lung* werkt voor *decât* op dezelfde manier: *părul mai lung decât Andrei*; het bijvoeglijk naamwoord blijft na *părul* staan.'
  ro.a1.unit31.lesson05.teach.am_parul_scurt:
    title: Ik heb kort bruin haar
    gloss: Ik heb kort bruin haar.
    note: Een voorbeeldzin in de eerste persoon met *Am ...*, handig om te hergebruiken als je je eigen uiterlijk beschrijft.
  ro.a1.unit31.lesson06.teach.mihai_uite_ea:
    title: Mihai ziet Nina
    gloss: 'Mihai: Kijk, is dat Nina? Ze heeft kort blond haar en groene ogen.'
    note: '*Uite* (kijk) vestigt de aandacht op iets; *ea e Nina?* betekent "is dat Nina?".'
  ro.a1.unit31.lesson06.teach.ana_da_ea:
    title: Ana bevestigt het
    gloss: 'Ana: Ja, dat is Nina!'
    note: Een korte, natuurlijke bevestiging.
  ro.a1.unit31.lesson06.teach.nina_salut_tu:
    title: Nina begroet Mihai
    gloss: 'Nina: Hoi, ben jij Mihai?'
    note: 'Een eenvoudige informele begroetingsvraag: *tu ești ...?*'
  ro.a1.unit31.lesson06.teach.mihai_da_ma:
    title: Mihai begroet Nina terug
    gloss: 'Mihai: Ja! Aangenaam kennis te maken, Nina.'
    note: '*Mă bucur să te cunosc* ("ik ben blij je te leren kennen") is de standaardzin bij een echte eerste kennismaking.'
  ro.a1.unit31.lesson06.teach.nina_si_eu:
    title: Nina beantwoordt de begroeting
    gloss: 'Nina: Aangenaam!'
    note: 'Sluit de dialoog af: Mihai heeft Nina herkend aan Ana''s eerdere beschrijving.'
