answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's "Vă rog" (formal, sourced) and "Te rog" (informal, freshly authored) are register-sensitive parallels, matching unit02's ai/aveți and unit05's ai frați/aveți frați pattern -- accept either register for a general "please" unless an exercise explicitly names one. Ana and Mihai's closing café dialogue keeps their existing polite register with each other (both use "vă rog," not "te rog").
course:
  title: Roemeens A1
  description: Eten en drinken bestellen in het Roemeens -- koffie, thee, brood en meer, met de belangrijkste bestelzin "Aș dori ..." (Ik wil graag ...) en het beleefdheidspaar vă rog/te rog -- Ana en Mihai komen verder aan bod als ze afspreken in een café.
units:
  ro.a1.unit06.food:
    title: Eten en drinken
lessons:
  ro.a1.unit06.lesson01.bauturi:
    title: Drankjes
  ro.a1.unit06.lesson02.va_rog_si_mancare:
    title: Alstublieft, en eten
  ro.a1.unit06.lesson03.la_cafenea:
    title: In het café
teaching:
  ro.a1.unit06.lesson01.teach.reminder_un_o_si:
    title: 'Herhaling: un, o, și'
    gloss: un/o (een) · și (en)
    note: Alle drie kwamen al in eerdere units voor (*și* in Unit 1, *o* in Unit 2, *un* in Unit 4) -- hier komen ze terug om over eten en drinken te praten.
  ro.a1.unit06.lesson01.teach.as_dori:
    title: Ik wil graag ...
    gloss: Aș dori ... (Ik wil graag ...)
    note: De gebruikelijke beleefde manier om in het Roemeens iets te bestellen -- een vaste conditionalisvorm die niet verandert, wat er ook op volgt.
  ro.a1.unit06.lesson01.teach.apa:
    title: Water
    gloss: apă (water)
    note: Een vrouwelijk zelfstandig naamwoord -- krijgt geen lidwoord als de hoeveelheid niet genoemd wordt, net als 'water' in het Nederlands.
    example_gloss: Ik wil graag water.
  ro.a1.unit06.lesson01.teach.cafea:
    title: Koffie
    gloss: cafea (koffie)
    note: Vrouwelijk -- combineert met *o* ('een') zoals elk ander vrouwelijk zelfstandig naamwoord.
    example_gloss: Ik wil graag een koffie.
  ro.a1.unit06.lesson01.teach.ceai:
    title: Thee
    gloss: ceai (thee)
    note: Combineert met *un* ('een'), niet met *o* -- ceai is een mannelijk/onzijdig zelfstandig naamwoord.
    example_gloss: Ik wil graag een thee.
  ro.a1.unit06.lesson01.teach.suc:
    title: Sap
    gloss: suc (sap)
    note: Krijgt ook *un*, hetzelfde patroon als ceai.
    example_gloss: Ik wil graag een sap.
  ro.a1.unit06.lesson01.teach.lapte:
    title: Melk
    gloss: lapte (melk)
    note: Net als apă meestal zonder lidwoord gezegd als de hoeveelheid niet genoemd wordt.
    example_gloss: Ik wil graag melk.
  ro.a1.unit06.lesson01.teach.mi_e_sete:
    title: ik heb dorst
    gloss: Mi-e sete (Ik heb dorst)
    note: Een vaste uitdrukking -- letterlijk eerder 'het is dorst voor mij' dan 'ik heb dorst' woord voor woord.
  ro.a1.unit06.lesson01.teach.as_dori_o_cafea:
    title: Ik wil graag een koffie
    gloss: Ik wil graag een koffie.
    note: Brengt de bestelzin en een vrouwelijk woord voor een drankje samen in één volledige zin.
  ro.a1.unit06.lesson02.teach.reminder_multumesc_bine_da_nu:
    title: 'Herhaling: mulțumesc, bine, da, nu'
    gloss: mulțumesc (dank je) · bine (goed) · da (ja) · nu (nee)
    note: '*Mulțumesc* en *bine* kwamen voor het eerst voor in de begroetingen van Unit 1, *da* en *nu* in Unit 3/Unit 5 -- hier komen ze terug rond eten en beleefdheid.'
  ro.a1.unit06.lesson02.teach.mi_e_foame:
    title: ik heb honger
    gloss: Mi-e foame (Ik heb honger)
    note: Dezelfde vaste uitdrukking als *Mi-e sete*, maar met foame (honger) in plaats van sete (dorst).
  ro.a1.unit06.lesson02.teach.paine:
    title: Brood
    gloss: pâine (brood)
    note: Meestal zonder lidwoord gezegd, net als 'brood' in het Nederlands.
    example_gloss: Ik heb honger. Ik wil graag brood.
  ro.a1.unit06.lesson02.teach.mancare:
    title: Eten
    gloss: mâncare (eten)
    note: Het algemene woord voor 'eten', niet een specifiek gerecht.
    example_gloss: Ik wil graag eten.
  ro.a1.unit06.lesson02.teach.carne:
    title: Vlees
    gloss: carne (vlees)
    note: Het algemene woord voor 'vlees' -- voor specifieke soorten (carne de vită, carne de porc) komt er een type achter.
    example_gloss: Ik wil graag vlees.
  ro.a1.unit06.lesson02.teach.pui:
    title: Kip
    gloss: pui (kip)
    note: Het specifieke woord voor kip (als eten), te onderscheiden van het algemene carne.
    example_gloss: Ik wil graag kip.
  ro.a1.unit06.lesson02.teach.fructe:
    title: Fruit
    gloss: fructe (fruit)
    note: De gewone meervoudsvorm, gebruikt zoals wij 'fruit' als algemene categorie gebruiken.
    example_gloss: Ik wil graag fruit.
  ro.a1.unit06.lesson02.teach.va_rog:
    title: Alstublieft (formeel)
    gloss: vă rog (alstublieft, formeel)
    note: De beleefde manier om 'alstublieft' te zeggen -- past bij het dumneavoastră-register uit Unit 1 en Unit 2.
    example_gloss: Een koffie, alsjeblieft.
  ro.a1.unit06.lesson02.teach.te_rog:
    title: Alsjeblieft (informeel)
    gloss: te rog (alsjeblieft, informeel)
    note: De alledaagse variant voor vrienden en mensen die je met *tu* aanspreekt -- past bij het tu-register uit Unit 1.
    example_gloss: Een thee, alsjeblieft.
  ro.a1.unit06.lesson03.teach.reminder_buna_ziua_bine_la_revedere:
    title: 'Herhaling: bună, ziua, bine, la revedere, Ana, Mihai'
    gloss: bună ziua (goedendag / hallo) · bine (goed) · la revedere (tot ziens) · Ana, Mihai (namen)
    note: Alles kwam al voor in de dialogen van Unit 1 en Unit 5 -- hier ontmoeten Ana en Mihai elkaar weer, nu in een café.
  ro.a1.unit06.lesson03.teach.line01:
    title: Begroet en zeg dat je honger hebt
    gloss: Ana begroet Mihai en zegt dat ze honger heeft.
    note: Gebruikt het *Mi-e foame* uit deze unit meteen in de begroeting.
  ro.a1.unit06.lesson03.teach.line02:
    title: Eten bestellen
    gloss: Mihai zegt dat hij graag brood en kip wil.
    note: Gebruikt de woorden pâine en pui uit deze unit opnieuw met de uitdrukking Aș dori.
  ro.a1.unit06.lesson03.teach.line03:
    title: Beleefd iets te drinken bestellen
    gloss: Ana zegt dat ze graag een koffie wil, alstublieft.
    note: 'Combineert Aș dori, cafea en vă rog: drie dingen die in deze unit al apart aan bod kwamen.'
  ro.a1.unit06.lesson03.teach.line04:
    title: Ook iets te drinken bestellen
    gloss: Mihai zegt dat hij graag een thee wil, alstublieft.
    note: Hetzelfde patroon als de zin van Ana, maar met ceai in plaats van cafea.
  ro.a1.unit06.lesson03.teach.line05:
    title: Bedanken en afsluiten
    gloss: Ana bedankt Mihai en zegt gedag.
    note: '*Mulțumesc* is hier een eenvoudige bedankgroet aan het eind, hetzelfde woord als in *Bine, mulțumesc.* uit Unit 1.'
  ro.a1.unit06.lesson03.teach.line06:
    title: Het gesprek afsluiten
    gloss: Mihai zegt ook gedag en noemt Ana bij haar naam.
    note: Dezelfde vriendelijke afsluiting waarmee de dialogen van Unit 1 en Unit 5 allebei eindigden.
