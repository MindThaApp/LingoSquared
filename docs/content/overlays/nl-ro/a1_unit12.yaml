teaching:
  ro.a1.unit12.lesson01.teach.reminder_parc_cinema:
    title: 'Herhaling: parc, cinema'
    gloss: parc (het park) · cinema (de bioscoop)
    note: Beide woorden kwamen al in les 11 aan bod. Nu combineer je ze met de nieuwe verleden tijd van deze les.
  ro.a1.unit12.lesson01.teach.reminder_astazi_maine_duminica_sambata:
    title: 'Herhaling: astăzi, mâine, duminică, sâmbătă'
    gloss: astăzi (vandaag) · mâine (morgen) · duminică (zondag) · sâmbătă (zaterdag)
    note: Allemaal al behandeld in les 3 en les 11. Nu vormen ze het contrast met het nieuwe woord *ieri* (gisteren) uit deze les.
  ro.a1.unit12.lesson01.teach.am_fost_vocab:
    title: Ik was / ik ben geweest / ik ben gegaan
    gloss: Am fost (ik was / ik ben geweest / ik ging)
    note: De voltooide tijd (perfect compus) van *a fi* (zijn). *am* is het vaste hulpwoord voor 'ik' en 'wij', en *fost* is het onveranderlijke voltooid deelwoord. Met een plaats erbij is *am fost la...* de gewone, natuurlijke manier om 'ik ben naar... geweest / ik ging naar...' te zeggen. In gesproken taal komt het vaker voor dan een werkwoord voor 'lopen' of 'reizen'.
    example_gloss:
    - Ik ging naar het park.
  ro.a1.unit12.lesson01.teach.am_fost_parc_phrase:
    title: Ik ging naar het park
    gloss: Am fost la parc. (Ik ging naar het park.)
    note: 'Het volledige patroon: am fost + la + plaats.'
  ro.a1.unit12.lesson01.teach.am_fost_cinema_phrase:
    title: Ik ging naar de bioscoop
    gloss: Am fost la cinema. (Ik ging naar de bioscoop.)
    note: Hetzelfde patroon als *Am fost la parc*, met een andere plaats.
  ro.a1.unit12.lesson01.teach.ieri_vocab:
    title: Gisteren
    gloss: Ieri (gisteren)
    note: Je kent het al uit les 3, naast *astăzi* (vandaag) en *mâine* (morgen). Nu gebruik je het met de verleden tijd, aan het begin van de zin, om te zeggen wanneer iets gebeurde.
    example_gloss:
    - Gisteren ging ik naar het park.
  ro.a1.unit12.lesson01.teach.ieri_am_fost_parc_phrase:
    title: Gisteren ging ik naar het park
    gloss: Ieri am fost la parc. (Gisteren ging ik naar het park.)
    note: Door *ieri* voor *Am fost la parc* te zetten, maak je precies duidelijk wanneer het was.
  ro.a1.unit12.lesson02.teach.reminder_mananc_beau:
    title: 'Herhaling: mănânc, beau'
    gloss: mănânc (ik eet) · beau (ik drink)
    note: Beide al behandeld in de dagelijkse routine van les 10. In deze les leer je de verleden tijd ervan.
  ro.a1.unit12.lesson02.teach.reminder_paine_cafea_ceai_si:
    title: 'Herhaling: pâine, cafea, ceai, și'
    gloss: pâine (brood) · cafea (koffie) · ceai (thee) · și (en)
    note: Allemaal al behandeld in les 6 en les 10. Hier gebruik je ze opnieuw in de zinnen in de verleden tijd van deze les.
  ro.a1.unit12.lesson02.teach.am_mancat_vocab:
    title: Ik at / ik heb gegeten
    gloss: Am mâncat (ik at / ik heb gegeten)
    note: De voltooide tijd (perfect compus) van *a mânca* (eten), die je al kent als *mănânc* (ik eet, les 10). Dezelfde werkwoord, nu in de verleden tijd. Am + mâncat, hetzelfde patroon als *am fost*.
    example_gloss:
    - Ik at brood.
  ro.a1.unit12.lesson02.teach.am_mancat_paine_phrase:
    title: Ik at brood
    gloss: Am mâncat pâine. (Ik at brood.)
    note: 'Het volledige patroon: am mâncat + het eten.'
  ro.a1.unit12.lesson02.teach.am_baut_vocab:
    title: Ik dronk / ik heb gedronken
    gloss: Am băut (ik dronk / ik heb gedronken)
    note: De voltooide tijd (perfect compus) van *a bea* (drinken), die je al kent als *beau* (ik drink, les 10). Dezelfde werkwoord, nu in de verleden tijd.
    example_gloss:
    - Ik dronk thee.
  ro.a1.unit12.lesson02.teach.am_baut_ceai_phrase:
    title: Ik dronk thee
    gloss: Am băut ceai. (Ik dronk thee.)
    note: 'Het volledige patroon: am băut + de drank.'
  ro.a1.unit12.lesson02.teach.am_mancat_am_baut_phrase:
    title: Ik at brood en dronk thee
    gloss: Am mâncat pâine și am băut ceai. (Ik at brood en dronk thee.)
    note: Twee handelingen in de verleden tijd, verbonden met *și*. Dit is hetzelfde voegwoord dat je in les 10 al gebruikte voor routines in de tegenwoordige tijd.
  ro.a1.unit12.lesson03.teach.reminder_am_fost_ieri_parc_cinema:
    title: 'Herhaling: am fost, ieri, parc, cinema'
    gloss: am fost (ik was / ik ging) · ieri (gisteren) · parc (het park) · cinema (de bioscoop)
    note: Allemaal uit les 1 van deze eenheid. Hier vormen ze de aanloop naar het terugblikken op zondag.
  ro.a1.unit12.lesson03.teach.reminder_am_mancat_am_baut:
    title: 'Herhaling: am mâncat, am băut, pâine, cafea, ceai'
    gloss: am mâncat (ik at) · am băut (ik dronk) · pâine (brood) · cafea (koffie) · ceai (thee)
    note: Allemaal uit les 2 van deze eenheid. Hier zeggen Ana en Mihai allebei wat ze hebben gehad.
  ro.a1.unit12.lesson03.teach.reminder_cum_duminica_bine:
    title: 'Herhaling: cum, duminică, bine, mulțumesc, la revedere, Ana, Mihai'
    gloss: cum (hoe, les 1/les 9) · duminică (zondag, les 3) · bine (goed, les 1) · mulțumesc (dank je) · la revedere (tot ziens) · Ana, Mihai (namen)
    note: 'Allemaal al behandeld in eerdere lessen. *cum* zag je eerst bij het vragen naar iemands naam (les 1) en de weg (les 9). Hier opent het een ander soort vraag: hoe iets was.'
  ro.a1.unit12.lesson03.teach.a_fost_vocab:
    title: Het was
    gloss: A fost (het was)
    note: Een andere persoon van hetzelfde werkwoord als *am fost*. *a* is het hulpwoord voor 'hij/zij/het', niet dat voor 'ik/wij'. Leer *Cum a fost...?* en *A fost bine!* voorlopig als vaste zinnen, niet als patroon om vrij mee te bouwen.
    example_gloss:
    - Het was goed!
  ro.a1.unit12.lesson03.teach.a_fost_bine_phrase:
    title: Het was goed!
    gloss: A fost bine! (Het was goed!)
    note: Een korte, natuurlijke manier om te zeggen dat iets goed ging. Het is het antwoord op *Cum a fost...?*
  ro.a1.unit12.lesson03.teach.cum_a_fost_duminica_phrase:
    title: Hoe was zondag?
    gloss: Cum a fost duminică? (Hoe was zondag?)
    note: Een natuurlijke manier om een gesprek over een recente dag te beginnen, zelfs met iemand die erbij was. Zo nodig je de ander uit te vertellen hoe het was of wat opviel.
  ro.a1.unit12.lesson03.teach.line01:
    title: Groet en vraag hoe zondag was
    gloss: Mihai groet Ana en vraagt hoe zondag was.
    note: Combineert *Cum a fost duminică?* uit deze eenheid met het bekende *Bună*.
  ro.a1.unit12.lesson03.teach.line02:
    title: Antwoord en zeg waar je was
    gloss: Ana zegt dat het goed was en dat ze naar het park ging.
    note: Combineert *A fost bine!* met *Am fost la parc* uit les 1.
  ro.a1.unit12.lesson03.teach.line03:
    title: Zeg wat hij at en dronk
    gloss: Mihai zegt dat hij brood at en thee dronk.
    note: Gebruikt *Am mâncat pâine și am băut ceai* uit les 2 opnieuw, in lijn met wat Mihai in les 6 al had (pâine en ceai).
  ro.a1.unit12.lesson03.teach.line04:
    title: Zeg wat zij dronk
    gloss: Ana zegt dat ze koffie dronk.
    note: Past bij wat Ana in les 6 al had (cafea).
  ro.a1.unit12.lesson03.teach.line05:
    title: Bedank en neem afscheid
    gloss: Mihai bedankt Ana en zegt tot ziens.
    note: Dezelfde afsluiting als in de dialogen van alle eerdere lessen.
  ro.a1.unit12.lesson03.teach.line06:
    title: Sluit het gesprek af
    gloss: Ana zegt ook tot ziens, met de naam van Mihai.
    note: Dezelfde vriendelijke afsluiting als in de dialogen van alle eerdere lessen.
