teaching:
  ro.a1.unit29.lesson01.teach.cat_costa_in:
    title: Naar de totaalprijs vragen
    gloss: Hoeveel kost het in totaal?
    note: '*În total* (in totaal) maakt duidelijk dat je de volledige prijs wilt weten, niet die van één artikel; *Cât costă?* vraagt "hoeveel kost het?".'
  ro.a1.unit29.lesson01.teach.costa_douazeci_si:
    title: Een totaalprijs noemen
    gloss: Het kost in totaal honderd lei.
    note: '*Costă* is de hij/zij/het-vorm van *a costa* (kosten). Na een getal boven 19 zet het Roemeens *de* voor het zelfstandig naamwoord: *o sută de lei*.'
  ro.a1.unit29.lesson02.teach.a_plati_cu:
    title: Met pinpas of contant betalen
    gloss: met pinpas betalen, contant betalen
    note: '*A plăti cu cardul* betekent met pin of kaart betalen en *a plăti în numerar* betekent contant betalen; *cu* betekent "met" en *în* betekent "in".'
    example_gloss:
    - Kan ik hier met pinpas betalen?
    - Ik betaal contant.
  ro.a1.unit29.lesson02.teach.pot_plati_cu:
    title: Vragen of pinbetaling mogelijk is
    gloss: Kan ik hier met pinpas betalen?
    note: '*Pot plăti* (ik kan betalen) is *a putea* + een werkwoord; *aici* (hier) plaatst de vraag op de huidige locatie.'
  ro.a1.unit29.lesson02.teach.doriti_sa_platiti:
    title: Vragen naar de betaalvoorkeur
    gloss: Wilt u contant of met pinpas betalen?
    note: '*Doriți să plătiți ...?* is de beleefde *dumneavoastră*-vorm van een onbekende kassamedewerker; tegen een vriend zeg je *Vrei să plătești ...?*'
  ro.a1.unit29.lesson03.teach.nota:
    title: De rekening
    gloss: de rekening
    note: 'Een vrouwelijk zelfstandig naamwoord: *o notă*, *nota* (het lidwoord wordt achteraan vastgemaakt).'
    example_gloss: Zullen we de rekening delen?
  ro.a1.unit29.lesson03.teach.hai_sa_impartim:
    title: Voorstellen de rekening te delen
    gloss: Zullen we de rekening delen?
    note: '*Hai să* + een werkwoord stelt voor om iets samen te doen.'
  ro.a1.unit29.lesson03.teach.pot_plati_separat:
    title: Vragen om apart te betalen
    gloss: Mag ik apart betalen?
    note: '*Separat* (apart) staat na *a plăti*; *Pot plăti separat?* is de gebruikelijke vraag als ieder zijn eigen deel betaalt.'
  ro.a1.unit29.lesson04.teach.restul:
    title: Het wisselgeld
    gloss: het wisselgeld
    note: '*Restul* betekent letterlijk "de rest"; zo noemt het Roemeens het wisselgeld dat je terugkrijgt. Het lidwoord wordt achteraan vastgemaakt.'
    example_gloss: Hier is uw wisselgeld.
  ro.a1.unit29.lesson04.teach.poftiti_restul:
    title: Wisselgeld teruggeven
    gloss: Hier is uw wisselgeld.
    note: '*Poftiți* is de beleefde *dumneavoastră*-vorm voor "alstublieft" (bij het overhandigen), passend bij het formele register aan een kassa.'
  ro.a1.unit29.lesson04.teach.nu_am_nevoie:
    title: Wisselgeld weigeren
    gloss: Ik heb geen wisselgeld nodig.
    note: '*A avea nevoie de* (nodig hebben) wordt gevolgd door *de*: *Nu am nevoie de rest*.'
  ro.a1.unit29.lesson05.teach.treizeci_si_cinci:
    title: Vijfendertig
    gloss: vijfendertig
    note: 'Het Roemeens vormt getallen van 21 tot 99 met *și*: *treizeci și cinci* (letterlijk "dertig en vijf"), en zet *de* voor het zelfstandig naamwoord: *o sută treizeci și cinci de lei*.'
    example_gloss: Het kost honderdvijfendertig lei.
  ro.a1.unit29.lesson05.teach.nota_doua_feluri:
    title: Een restaurantrekening lezen
    gloss: 'Rekening: twee hoofdgerechten en twee koffies. Totaal: honderdvijfendertig lei. Betaald met pin.'
    note: Let op wat er besteld is, wat het totaal is en hoe er is betaald.
    glosses:
      Nota: rekening
      două: twee
      feluri: hoofdgerechten
      cafele: koffies
      Total: totaal
      '135': honderdvijfendertig
      lei: lei
      Plătit: betaald
      cardul: pinpas
  ro.a1.unit29.lesson06.teach.ana_hai_sa:
    title: Ana vraagt om de rekening
    gloss: 'Ana: Zullen we om de rekening vragen?'
    note: '*A cere* (vragen om) heeft *nota* als lijdend voorwerp; *Hai să cerem nota?* stelt voor er samen om te vragen.'
  ro.a1.unit29.lesson06.teach.mihai_da_buna:
    title: Mihai vraagt naar het totaal
    gloss: 'Mihai: Ja, goed idee. Hoeveel kost het in totaal?'
    note: Hergebruikt de vraag *Cât costă în total?* uit les 1.
  ro.a1.unit29.lesson06.teach.ana_sunt_treizeci:
    title: Ana noemt het totaal
    gloss: 'Ana: Het is honderdvijfendertig lei. Zullen we het splitsen?'
    note: '*Împărțim* is de *noi*-vorm (wij) van *a împărți* (verdelen); *nota* is uit de context duidelijk.'
  ro.a1.unit29.lesson06.teach.mihai_nu_lasa:
    title: Mihai staat erop te betalen
    gloss: 'Mihai: Nee, laat mij vandaag betalen. Je hebt me zo veel geholpen.'
    note: '*Lasă-mă să* ... (laat mij ...) is de standaardmanier om aan te bieden iets te doen; *m-ai ajutat* ("je hebt me geholpen") is een verleden vorm.'
  ro.a1.unit29.lesson06.teach.ana_ce_dragut:
    title: Ana is ontroerd
    gloss: 'Ana: Wat lief van je! Heel erg bedankt.'
    note: '*Ce drăguț din partea ta!* (wat lief van je) is een warm, veelgebruikt compliment voor een vrijgevig gebaar.'
  ro.a1.unit29.lesson06.teach.mihai_pot_plati:
    title: Mihai vraagt of hij met pin kan betalen
    gloss: 'Mihai: Kan ik hier met pin betalen?'
    note: Hergebruikt de vraag *Pot plăti cu cardul aici?* uit les 2, nu in het echte restaurant.
  ro.a1.unit29.lesson06.teach.mihai_plateste_nota:
    title: 'Plătește: de hij/zij-vorm'
    gloss: Mihai betaalt de rekening.
    note: '*Plătește* is de hij/zij-vorm van *a plăti* (betalen).'
