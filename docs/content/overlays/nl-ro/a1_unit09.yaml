answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit introduces the course's first imperative form, "Mergeți" (go) -- the dumneavoastră/formal-plural imperative, matching the course's established dumneavoastră-as-safe-default policy. No tu-register imperative is taught or accepted here. Ana and Mihai's direction-giving dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08.
course:
  title: Roemeens A1
  description: De weg vragen en korte routebeschrijvingen volgen in het Roemeens -- Cum pot să ajung...? (Hoe kom ik bij...?), Mergeți înainte (ga rechtdoor), la dreapta / la stânga (naar rechts / naar links) en aici / acolo (hier / daar) -- met Ana en Mihai, waarbij Ana aan Mihai vraagt hoe ze bij het station komt.
units:
  ro.a1.unit09.directions:
    title: De weg wijzen
lessons:
  ro.a1.unit09.lesson01.cum_ajung:
    title: Hoe kom ik bij...?
  ro.a1.unit09.lesson02.dreapta_stanga:
    title: Naar rechts, naar links
  ro.a1.unit09.lesson03.pe_strada:
    title: Op straat
teaching:
  ro.a1.unit09.lesson01.teach.reminder_unde_este_locuri:
    title: 'Herhaling: unde, este, gară, magazin, bancă, aproape'
    gloss: unde (waar) · este (is) · gară (station) · magazin (winkel) · bancă (bank) · aproape (dichtbij)
    note: Allemaal al behandeld -- unde sinds Unit 7, este sinds Unit 3/Unit 4, gară/magazin/bancă/aproape sinds Unit 8 -- hier worden ze gecombineerd tot de vragen en voorbeelden over de weg in deze unit.
  ro.a1.unit09.lesson01.teach.cum_pot_sa_ajung:
    title: Hoe kom ik bij...?
    gloss: Cum pot să ajung...? (Hoe kom ik bij...?)
    note: De gewone manier om te vragen hoe je ergens komt -- *pot* (ik kan) kwam al voor in *Unde pot să cumpăr...?* uit Unit 7; *ajung* (ik kom aan / ik bereik) is nieuw.
  ro.a1.unit09.lesson01.teach.mergeti_vocab:
    title: Ga
    gloss: Mergeți (ga -- beleefde gebiedende wijs)
    note: '*Mergeți* is de gebiedende wijs in het dumneavoastră-register -- de beleefde manier om iemand te zeggen dat hij of zij moet gaan, zoals Ana en Mihai ook al tegen elkaar praten.'
    example_gloss:
    - Ga rechtdoor.
  ro.a1.unit09.lesson01.teach.inainte_vocab:
    title: Rechtdoor
    gloss: înainte (rechtdoor)
    note: Komt samen met *Mergeți* voor en vormt de eenvoudigst mogelijke aanwijzing.
    example_gloss:
    - Ga rechtdoor.
  ro.a1.unit09.lesson01.teach.mergeti_inainte_phrase:
    title: Rechtdoor
    gloss: Mergeți înainte. (Ga rechtdoor.)
    note: Een korte, volledige aanwijzing -- het eenvoudigst mogelijke antwoord op *Cum pot să ajung...?*
  ro.a1.unit09.lesson01.teach.cum_ajung_gara:
    title: Hoe kom ik bij het station?
    gloss: Cum pot să ajung la gară? (Hoe kom ik bij het station?)
    note: 'Zet *Cum pot să ajung...?* en *gară* samen in één volledige vraag -- *la* (naar) verbindt de vraag met de bestemming. Na *la* houdt de plaats zijn basisvorm: *la gară*, niet *la gara*.'
  ro.a1.unit09.lesson01.teach.cum_ajung_banca:
    title: Hoe kom ik bij de bank?
    gloss: Cum pot să ajung la bancă? (Hoe kom ik bij de bank?)
    note: Hetzelfde patroon, nu met de bank -- een logische vraag, want in Unit 8 hebben we al gezien dat de bank ver weg is.
  ro.a1.unit09.lesson02.teach.dreapta_stanga_vocab:
    title: Naar rechts, naar links
    gloss: la dreapta (naar rechts) · la stânga (naar links)
    note: 'De twee basisafslagen -- leer ze elk als vast paar met *la* (naar): *la dreapta*, *la stânga*.'
    example_gloss:
    - Ga naar rechts.
    - Ga naar links.
  ro.a1.unit09.lesson02.teach.mergeti_dreapta_phrase:
    title: Ga naar rechts
    gloss: Mergeți la dreapta. (Ga naar rechts.)
    note: Hetzelfde bevel *Mergeți* als in *Mergeți înainte.*, nu met een afslag in plaats van rechtdoor.
  ro.a1.unit09.lesson02.teach.mergeti_stanga_phrase:
    title: Ga naar links
    gloss: Mergeți la stânga. (Ga naar links.)
    note: De tegenovergestelde afslag -- hetzelfde eenvoudige patroon.
  ro.a1.unit09.lesson02.teach.aici_acolo_vocab:
    title: Hier, daar
    gloss: aici (hier) · acolo (daar)
    note: Een eenvoudige manier om aan te wijzen waar iets is, zodra je er bent of het kunt zien. Anders dan aproape/departe uit Unit 8, die afstand beschrijven en geen positie.
    example_gloss:
    - De winkel is hier.
    - Het station is daar.
  ro.a1.unit09.lesson02.teach.magazinul_aici_phrase:
    title: De winkel is hier
    gloss: Magazinul este aici. (De winkel is hier.)
    note: Een korte, volledige zin -- *aici* wijst naar iets precies daar waar je bent.
  ro.a1.unit09.lesson02.teach.gara_acolo_phrase:
    title: Het station is daar
    gloss: Gara este acolo. (Het station is daar.)
    note: '*Acolo* wijst naar iets wat je kunt zien, maar dat niet vlak bij je is -- de natuurlijke afsluiting van een routebeschrijving.'
  ro.a1.unit09.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Herhaling: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (hallo) · mulțumesc (dank je) · la revedere (tot ziens) · da (ja) · Ana, Mihai (namen)
    note: Alles al eerder geleerd -- hier vraagt Ana aan Mihai de weg.
  ro.a1.unit09.lesson03.teach.apoi:
    title: Dan
    gloss: apoi (dan / daarna)
    note: Verbindt twee stappen tot één aanwijzing -- zo geef je meer dan één stap tegelijk.
    example_gloss:
    - Ga rechtdoor en dan naar rechts.
  ro.a1.unit09.lesson03.teach.line01:
    title: Groet en vraag hoe je bij het station komt
    gloss: Ana groet Mihai en vraagt hoe ze bij het station komt.
    note: Combineert *Cum pot să ajung* uit deze unit met de groet uit Unit 1.
  ro.a1.unit09.lesson03.teach.line02:
    title: Geef twee stappen van de route
    gloss: Mihai zegt dat ze rechtdoor moet gaan en dan naar rechts.
    note: Hergebruikt *Mergeți înainte* en *la dreapta* uit deze unit, verbonden met *apoi*.
  ro.a1.unit09.lesson03.teach.line03:
    title: Vraag of het dichtbij is
    gloss: Ana vraagt of het station dichtbij is.
    note: Een korte vervolgvraag met *este* en *aproape* uit Unit 8.
  ro.a1.unit09.lesson03.teach.line04:
    title: Bevestig en wijs het aan
    gloss: Mihai bevestigt dat het dichtbij is en wijst aan dat het station daar is.
    note: Combineert *aproape* en *acolo* -- afstand en positie -- in één zin.
  ro.a1.unit09.lesson03.teach.line05:
    title: Bedank en sluit af
    gloss: Ana bedankt Mihai en neemt afscheid.
    note: Dezelfde afsluitende dank als in de dialogen van Unit 1 en Unit 8.
  ro.a1.unit09.lesson03.teach.line06:
    title: Sluit het gesprek af
    gloss: Mihai neemt op zijn beurt afscheid en noemt Ana bij haar naam.
    note: Dezelfde vriendelijke afsluiting waarmee de dialogen van Unit 1, 5, 6, 7 en 8 eindigden.
