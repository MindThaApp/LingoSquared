answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (tren, pleacă, bilet, peron, București, Drum bun) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing formal register with each other; no new tu/dumneavoastră form is introduced this unit.
course:
  title: Roemeens A1
  description: 'Een gewone treinreis regelen in het Roemeens: Tren (trein), Bilet (kaartje), Peron (perron) en Pleacă (vertrekt), terwijl Mihai de trein naar București neemt en Ana hem uitzwaait op de gară.'
units:
  ro.a1.unit15.travel:
    title: Op reis
lessons:
  ro.a1.unit15.lesson01.trenul_pleaca:
    title: De trein vertrekt
  ro.a1.unit15.lesson02.un_bilet_va_rog:
    title: Een kaartje, alstublieft
  ro.a1.unit15.lesson03.la_gara:
    title: Op het station
teaching:
  ro.a1.unit15.lesson01.teach.reminder_gara_ora:
    title: 'Herhaling: gară, este, la, ce, oră, ora, nouă'
    gloss: gară (station) · este (is) · la (om/naar) · ce (welk/wat) · oră (uur) · ora (het uur) · nouă (negen)
    note: 'Gară komt uit Unit 8/Unit 9; este/la/ce/oră/ora/nouă komen uit Unit 4 (tijd). Deze unit gebruikt het patroon "la ce oră"/"la ora nouă" uit Unit 4 opnieuw voor een nieuw doel: vragen naar een trein in plaats van naar een les.'
  ro.a1.unit15.lesson01.teach.tren_vocab:
    title: Trein
    gloss: Tren (trein)
    note: 'Onzijdig, eindigt op een medeklinker (in het enkelvoud gedragen onzijdige woorden zich als mannelijke: *un tren*). Voor ''de trein'' krijgt het *-ul*, net als *magazin*->*magazinul*; woorden op *-ă* zoals *gară* krijgen in plaats daarvan *-a* (*gara*).'
    example_gloss:
    - De trein staat op het station.
  ro.a1.unit15.lesson01.teach.pleaca_vocab:
    title: Vertrekt
    gloss: Pleacă (vertrekt, hij/zij/het)
    note: 'Het werkwoord voor een trein, bus of vliegtuig dat vertrekt. *Trenul pleacă*: *este* is niet nodig, want *pleacă* is al een volledig werkwoord.'
    example_gloss:
    - De trein vertrekt.
  ro.a1.unit15.lesson01.teach.trenul_pleaca_ora_noua_phrase:
    title: De trein vertrekt om negen uur
    gloss: Trenul pleacă la ora nouă. (De trein vertrekt om negen uur.)
    note: Combineert *trenul* + *pleacă* met *la ora nouă* uit Unit 4; er is geen nieuwe tijdswoordenschat nodig.
  ro.a1.unit15.lesson01.teach.la_ce_ora_pleaca_trenul_phrase:
    title: Hoe laat vertrekt de trein?
    gloss: La ce oră pleacă trenul? (Hoe laat vertrekt de trein?)
    note: Het vraagpatroon *La ce oră...?* uit Unit 4, nu met *trenul* in plaats van een les.
  ro.a1.unit15.lesson01.teach.peron_vocab:
    title: Perron
    gloss: Peron (perron)
    note: 'Een treinperron. Onzijdig, eindigt op een medeklinker, dus ''het perron'' is *peronul*: dezelfde uitgang *-ul* als bij *tren*->*trenul*.'
    example_gloss:
    - De trein staat op perron drie.
  ro.a1.unit15.lesson01.teach.de_la_ce_peron_phrase:
    title: Van welk perron vertrekt de trein?
    gloss: De la ce peron pleacă trenul? (Van welk perron vertrekt de trein?)
    note: '*De la* (van) + *ce peron* (welk perron): alle woorden zijn al eerder geleerd en nu gecombineerd tot een nieuwe vraag.'
  ro.a1.unit15.lesson02.teach.reminder_as_dori_va_rog_cat_costa:
    title: 'Herhaling: aș dori, vă rog, cât costă, costă, lei'
    gloss: aș dori (ik wil graag) · vă rog (alstublieft) · cât costă (hoeveel kost het) · costă (het kost) · lei (lei, munteenheid)
    note: 'Alles komt uit Unit 6 (eten) en Unit 7 (winkelen): deze unit gebruikt dezelfde beleefde vragen en prijstaal opnieuw om een treinkaartje te kopen in plaats van eten.'
  ro.a1.unit15.lesson02.teach.bilet_vocab:
    title: Kaartje
    gloss: Bilet (kaartje)
    note: Een treinkaartje. Onzijdig (in het enkelvoud met *un*, zoals een mannelijk woord), dus 'een kaartje' is *un bilet*.
    example_gloss:
    - Ik heb een kaartje.
  ro.a1.unit15.lesson02.teach.bucuresti_vocab:
    title: Boekarest
    gloss: București (Boekarest)
    note: De hoofdstad van Roemenië, het meest voor de hand liggende bestemmingsvoorbeeld in deze cursus.
    example_gloss:
    - De trein vertrekt naar Boekarest.
  ro.a1.unit15.lesson02.teach.as_dori_bilet_bucuresti_phrase:
    title: Ik wil graag een kaartje naar Boekarest, alstublieft
    gloss: Aș dori un bilet la București, vă rog. (Ik wil graag een kaartje naar Boekarest, alstublieft.)
    note: Het beleefde patroon *Aș dori... vă rog* uit Unit 6/Unit 7, nu om een kaartje te vragen in plaats van eten.
  ro.a1.unit15.lesson02.teach.cat_costa_bilet_bucuresti_phrase:
    title: Hoeveel kost een kaartje naar Boekarest?
    gloss: Cât costă un bilet la București? (Hoeveel kost een kaartje naar Boekarest?)
    note: De prijsvraag *Cât costă...?* uit Unit 7, nu over een kaartje in plaats van een kilo aardappelen.
  ro.a1.unit15.lesson02.teach.costa_zece_lei_phrase:
    title: Het kost veertig lei
    gloss: Costă patruzeci de lei. (Het kost veertig lei.)
    note: Zece (tien) valt binnen het bereik 2-19, dus er is geen *de* nodig voor *lei* -- dezelfde regel als in Unit 7.
  ro.a1.unit15.lesson03.teach.reminder_travel_words:
    title: 'Herinnering: tren, pleacă, peron, bilet, București, trei, am'
    gloss: tren (trein) · pleacă (vertrekt) · peron (perron) · bilet (kaartje) · București (Boekarest) · trei (drie, uit Unit 2) · am (ik heb, uit Unit 2)
    note: Tren, pleacă, peron, bilet en București komen uit de eigen lessen van deze unit; trei en am worden hier herhaald uit Unit 2 (getallen), omdat Ana en Mihai op het station nu 'peronul trei' en 'am un bilet' samen gebruiken.
  ro.a1.unit15.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Herinnering: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (hoi) · mulțumesc (dank je) · la revedere (tot ziens) · Ana, Mihai (namen)
    note: Alles al eerder behandeld -- hetzelfde vriendelijke begin- en eindpatroon dat elke dialoog in deze cursus heeft gebruikt.
  ro.a1.unit15.lesson03.teach.drum_bun_vocab:
    title: Goede reis
    gloss: Drum bun (Goede reis)
    note: Een vaste afscheidsgroet voor iemand die op reis gaat -- letterlijk 'goede weg', maar gebruikt zoals wij 'goede reis' zeggen.
    example_gloss:
    - Goede reis, Mihai!
  ro.a1.unit15.lesson03.teach.line01:
    title: Begroet en vraag naar de trein
    gloss: Ana begroet Mihai en vraagt hoe laat de trein vertrekt.
    note: Hergebruikt de vraag uit de eerste les van deze unit, nu rechtstreeks tegen Mihai gezegd.
  ro.a1.unit15.lesson03.teach.line02:
    title: Noem de vertrektijd
    gloss: Mihai zegt dat de trein om negen uur vertrekt.
    note: Hergebruikt de zin uit de eerste les van deze unit letterlijk.
  ro.a1.unit15.lesson03.teach.line03:
    title: Vraag naar het perron
    gloss: Ana vraagt van welk perron de trein vertrekt.
    note: Een korte vervolgvraag -- *de la ce peron* werd in de eerste les al volledig gesteld; hier vraagt Ana het kort en verwacht ze dat Mihai de rest aanvult.
  ro.a1.unit15.lesson03.teach.line04:
    title: Noem het perron en het kaartje
    gloss: Mihai zegt perron drie, en dat hij een kaartje naar Boekarest heeft.
    note: Combineert de woorden peron, bilet en București van deze unit in één antwoord.
  ro.a1.unit15.lesson03.teach.line05:
    title: Wens een goede reis en zeg gedag
    gloss: Ana wenst Mihai een goede reis en zegt gedag.
    note: Gebruikt de *Drum bun* van deze les -- een afscheid speciaal voor onderweg, in plaats van alleen het gebruikelijke *la revedere*.
  ro.a1.unit15.lesson03.teach.line06:
    title: Bedank haar en zeg gedag
    gloss: Mihai bedankt Ana en zegt gedag.
    note: Hetzelfde slotpatroon waarmee elke dialoog uit eerdere units eindigde.
