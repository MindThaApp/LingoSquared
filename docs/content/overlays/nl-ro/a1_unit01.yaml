answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Roemeens A1
  description: 'Leer de standaard Roemeense begroetingen en hoe je jezelf voorstelt als je iemand voor het eerst ontmoet. Je krijgt uitleg over het verschil dat je in dit stadium het hardst nodig hebt: het informele tu tegenover het beleefde dumneavoastră, en de twee gewone manieren om je naam te zeggen (mă numesc.../mă cheamă...).'
units:
  ro.a1.unit01.greetings:
    title: Begroetingen en eerste ontmoetingen
lessons:
  ro.a1.unit01.lesson01.tu_dumneavoastra_greetings:
    title: 'Begroetingen: tu en dumneavoastră'
  ro.a1.unit01.lesson02.names_introductions:
    title: Hoe heet je?
  ro.a1.unit01.lesson03.street_meeting:
    title: Een ontmoeting op straat
teaching:
  ro.a1.unit01.lesson01.teach.buna:
    title: Gewone groet
    gloss: hoi; hallo
    note: Bună is de gewone, licht informele groet. Je kunt hem veilig gebruiken bij vrienden, leeftijdsgenoten en de meeste informele ontmoetingen overdag.
    example_gloss: Hoi, Mihai!
  ro.a1.unit01.lesson01.teach.salut:
    title: Informele begroeting
    gloss: hoi; doei
    note: Salut is informeel en wordt gebruikt tussen vrienden en leeftijdsgenoten. Je kunt er een gesprek mee openen of afsluiten, maar het is niet de veiligste keuze bij een onbekende volwassene.
    example_gloss: Hoi, Ana!
  ro.a1.unit01.lesson01.teach.buna_ziua:
    title: Formele groet
    gloss: goedendag; hallo (formeel)
    note: Bună ziua is de veilige, beleefde groet voor een onbekende volwassene, een winkelier of iedereen die je met dumneavoastră aanspreekt. Letterlijk betekent het 'goede dag', maar het wordt als algemene beleefde groet gebruikt, niet alleen rond het middaguur.
    example_gloss: Goedendag, Ana!
  ro.a1.unit01.lesson01.teach.la_revedere:
    title: Neutraal afscheid
    gloss: tot ziens
    note: La revedere kun je zowel in beleefde als in informele situaties gebruiken.
    example_gloss: Goedendag! Tot ziens!
  ro.a1.unit01.lesson01.teach.tu:
    title: Informeel 'je' (enkelvoud)
    gloss: jij; je (enkelvoud, informeel)
    note: Net als in het Nederlands (jij tegenover u) laat de aanspreekvorm in het Roemeens de sociale afstand zien. Tu gebruik je voor één vriend, kind of iemand met wie je een uitdrukkelijk informele band hebt, en het heeft eigen werkwoordsvormen (faci, niet faceți).
  ro.a1.unit01.lesson01.teach.dumneavoastra:
    title: Beleefd 'u' of meervoud 'jullie'
    gloss: u; jullie (beleefd enkelvoud of meervoud)
    note: Dumneavoastră is de veilige keuze voor één onbekende volwassene en werkt ook voor een groep die je beleefd aanspreekt, ongeveer zoals u in het Nederlands. Het komt van domnia voastră (uwe edelheid) en gebruikt de meervoudsvormen van het werkwoord (faceți, numiți), ook als het om één persoon gaat.
  ro.a1.unit01.lesson01.teach.ce_mai_faceti:
    title: Formele vraag naar iemands welzijn
    gloss: Hoe gaat het met u?
    note: Faceți is de dumneavoastră-vorm van a face (doen/maken). Dit is een vaste beleefde vraag, geen letterlijke vraag naar wat iemand aan het doen is.
  ro.a1.unit01.lesson01.teach.ce_mai_faci:
    title: Informele vraag naar iemands welzijn
    gloss: Hoe gaat het met u?
    note: Faci is de tu-vorm van a face. Tussen de beleefde en de informele versie van deze vraag verandert alleen de werkwoordsuitgang; ce mai blijft hetzelfde.
  ro.a1.unit01.lesson01.teach.bine_multumesc:
    title: Standaardantwoord
    gloss: Goed, dank je.
    note: Bine, mulțumesc is het antwoord op ce mai faci/faceți, in elk register -- het antwoord zelf verandert niet.
    example_gloss: Hoe gaat het? Goed, dank je.
  ro.a1.unit01.lesson01.teach.register_choice:
    title: Begroeting en relatie combineren
    gloss: Bună ziua met dumneavoastră; Salut met tu
    note: Handige vuistregels, geen wetten. Bună ziua kan ook een formeel gesprek openen dat daarna met dumneavoastră verdergaat; Salut combineren met dumneavoastră geeft meestal tegenstrijdige signalen.
  ro.a1.unit01.lesson02.teach.ma_numesc:
    title: Je naam zeggen (standaard)
    gloss: Mijn naam is Ana.
    note: Mă numesc betekent letterlijk 'ik noem mezelf' -- de neutrale manier om je naam te zeggen, die overal werkt en qua register vergelijkbaar is met 'mijn naam is' in het Nederlands.
    example_gloss: Hoi! Mijn naam is Ana.
  ro.a1.unit01.lesson02.teach.cum_va_numiti:
    title: Beleefd naar een naam vragen
    gloss: Hoe heet u?
    note: Numiți is de dumneavoastră-vorm van a se numi (heten). Vă is het bijbehorende wederkerende voornaamwoord bij dumneavoastră en is hier verplicht.
  ro.a1.unit01.lesson02.teach.ma_cheama:
    title: Je naam zeggen (spreektaal)
    gloss: Ik heet Mihai.
    note: Mă cheamă is de meer gesproken manier om je naam te zeggen, letterlijk 'het roept mij'. Mă numesc en mă cheamă zijn allebei correct en gangbaar; mă cheamă is iets losser.
    example_gloss: Hoi! Ik heet Mihai.
  ro.a1.unit01.lesson02.teach.cum_te_cheama:
    title: Informeel naar een naam vragen
    gloss: Hoe heet je?
    note: Te is het wederkerende voornaamwoord bij tu. Zo vragen vrienden en leeftijdsgenoten elkaar naar hun naam.
  ro.a1.unit01.lesson02.teach.imi_pare_bine:
    title: Kennismaken
    gloss: Aangenaam!
    note: Îmi pare bine betekent letterlijk 'het lijkt mij goed' -- een vaste uitdrukking, geen woord-voor-woordvertaling van 'aangenaam'. De vorm verandert niet naargelang het geslacht van de spreker.
    example_gloss: Ik heet Mihai. Aangenaam!
  ro.a1.unit01.lesson02.teach.si_mie_imi_pare_bine:
    title: Hetzelfde terugzeggen
    gloss: Insgelijks, aangenaam!
    note: Și mie voegt 'ook/insgelijks' toe vóór dezelfde vaste uitdrukking waarmee het gesprek begon.
  ro.a1.unit01.lesson02.teach.si_dumneavoastra:
    title: De beleefde vraag teruggeven
    gloss: En u?
    note: Gebruik dumneavoastră om beleefd te blijven of om een groep aan te spreken.
  ro.a1.unit01.lesson02.teach.si_tu:
    title: De informele vraag teruggeven
    gloss: En u?
    note: Gebruik tu na și als je informeel tegen één vriend of leeftijdsgenoot praat.
  ro.a1.unit01.lesson03.teach.line01:
    title: Het gesprek openen
    gloss: Ana begroet Mihai formeel en noemt haar naam.
    note: Ana begint met het beleefde bună ziua, passend bij iemand die ze niet kent.
  ro.a1.unit01.lesson03.teach.line02:
    title: Het gesprek openen, antwoord
    gloss: Mihai beantwoordt de groet, noemt zijn naam en vraagt hoe het met haar gaat.
    note: Mihai blijft in hetzelfde beleefde register als Ana -- hij vraagt ce mai faceți, niet ce mai faci.
  ro.a1.unit01.lesson03.teach.line03:
    title: Antwoorden en de vraag teruggeven
    gloss: Ana zegt dat het goed gaat en stelt Mihai beleefd dezelfde vraag.
    note: Și dumneavoastră houdt het gesprek formeel, zoals het begon.
  ro.a1.unit01.lesson03.teach.line04:
    title: Antwoorden en afsluiten
    gloss: Mihai zegt dat het ook goed met hem gaat en neemt afscheid.
    note: La revedere is het neutrale afscheid, geschikt na een formeel of informeel gesprek.
  ro.a1.unit01.lesson03.teach.line05:
    title: Het gesprek afsluiten
    gloss: Ana herhaalt hetzelfde afscheid.
    note: La revedere terugzeggen is de natuurlijke manier om een vriendelijk afscheid te bevestigen.
exercises:
  ro.a1.unit01.lesson01.exercise01.listen_buna:
    instruction: Luister en kies de uitdrukking die je hoort.
    correct_option: Bună!
    distractors:
    - Salut!
    - La revedere!
    accepted_answers:
    - Bună!
    - Bună
  ro.a1.unit01.lesson01.exercise02.choose_informal_pronoun:
