    - Cum va numiti?
  ro.a1.unit01.lesson02.exercise05.choose_reply_meaning:
    instruction: Wat betekent Mihai's antwoord?
    correct_option: Aangenaam!
    distractors:
    - Tot ziens!
    - Hoe gaat het met u?
    accepted_answers:
    - Aangenaam!
  ro.a1.unit01.lesson02.exercise01.order_self_intro:
    instruction: Bouw Ana's voorstelzin.
    correct_response:
    - Mă
    - numesc
    - Ana
  ro.a1.unit01.lesson02.exercise07.match_introductions:
    instruction: Koppel elke vraag naar de naam aan het bijpassende antwoord.
    correct_response:
      Cum vă numiți?: Mă numesc Ana.
      Cum te cheamă?: Mă cheamă Mihai.
    pairs:
    - left: Cum vă numiți?
      right: Mă numesc Ana.
    - left: Cum te cheamă?
      right: Mă cheamă Mihai.
  ro.a1.unit01.lesson02.exercise03.informal_name_question:
    instruction: Vraag na de informele groet hoe de ander heet.
    accepted_answers:
    - Cum te cheamă?
    - Cum te cheama?
  ro.a1.unit01.lesson02.exercise04.complete_ma_cheama:
