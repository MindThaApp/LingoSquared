    feedback: Dumneavoastră is de veilige, respectvolle keuze bij een onbekende volwassene.
  ro.a1.unit01.lesson01.exercise05.listen_informal_question:
    instruction: Typ de informele vraag die je hoort.
    accepted_answers:
    - Ce mai faci?
    - Ce mai faci
  ro.a1.unit01.lesson01.exercise07.complete_farewell:
