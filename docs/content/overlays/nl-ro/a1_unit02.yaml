answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching unit01''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Spoken answers are assessed for intelligibility, not written punctuation.
  register: tu and dumneavoastră (and their matching verb forms, ai/aveți) are never interchangeable answers for each other's exercises, the same discipline unit01 established.
course:
  title: Roemeens A1
  description: Getallen van nul tot honderd, inclusief de tieners (-sprezece) en de tientallen (-zeci), het verschil tussen doi en două naar geslacht, en getallen gebruiken om naar leeftijd en telefoonnummer te vragen en daarop te antwoorden, als vervolg op Ana en Mihai uit unit01.
units:
  ro.a1.unit02.numbers:
    title: Getallen
lessons:
  ro.a1.unit02.lesson01.zero_to_ten:
    title: Getallen van nul tot tien
  ro.a1.unit02.lesson02.eleven_to_hundred:
    title: Getallen van elf tot honderd
  ro.a1.unit02.lesson03.age_and_phone:
    title: Leeftijd en telefoonnummer
teaching:
  ro.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: nul
    note: '*Zero* verandert nooit en wordt ook gebruikt om een cijfer uit te spreken binnen een langer getal of telefoonnummer.'
    example_gloss: Nul, een, twee.
  ro.a1.unit02.lesson01.teach.unu:
    title: Een
    gloss: een
    note: '*Unu* is de vorm die je gebruikt als je alleen telt. Vóór een mannelijk of onzijdig zelfstandig naamwoord wordt het *un* (*un câine*, één hond); vóór een vrouwelijk woord wordt het *o* (*o sută*, honderd).'
    example_gloss: Een, twee, drie.
  ro.a1.unit02.lesson01.teach.doi:
    title: Twee (mannelijk)
    gloss: twee
    note: '*Doi* gebruik je bij mannelijke zelfstandige naamwoorden (*doi bărbați*, twee mannen). Vrouwelijke woorden -- en onzijdige, die in het meervoud vrouwelijk zijn -- krijgen een andere vorm; zie de volgende kaart.'
    example_gloss: Twee, drie, vier.
  ro.a1.unit02.lesson01.teach.doi_doua_gender:
    title: Twee verandert met het geslacht
    gloss: doi (mannelijk) / două (vrouwelijk en onzijdig)
    note: Anders dan het Nederlandse 'twee' heeft Roemeens *doi* een aparte vrouwelijke vorm, *două*. Die is verplicht bij vrouwelijke woorden (*două femei*, twee vrouwen) en ook bij onzijdige woorden, die in het meervoud vrouwelijk zijn (*două numere*, twee getallen). Behalve bij één (*un*/*o*) en twee blijven de getallen *trei* tot en met *zece* voor elk geslacht gelijk.
  ro.a1.unit02.lesson01.teach.trei:
    title: Drie
    gloss: drie
    note: '*Trei* is voor elk geslacht gelijk.'
    example_gloss: Drie, vier, vijf.
  ro.a1.unit02.lesson01.teach.patru:
    title: Vier
    gloss: vier
    note: '*Patru* verandert niet. Let op de onregelmatige, ingekorte vorm bij de tieners: *paisprezece* (14), niet *patrusprezece*.'
    example_gloss: Vier, vijf, zes.
  ro.a1.unit02.lesson01.teach.cinci:
    title: Vijf
    gloss: vijf
    note: '*Cinci* verandert niet.'
    example_gloss: Vijf, zes, zeven.
  ro.a1.unit02.lesson01.teach.sase:
    title: Zes
    gloss: zes
    note: '*Șase* verandert niet.'
    example_gloss: Zes, zeven, acht.
  ro.a1.unit02.lesson01.teach.sapte:
    title: Zeven
    gloss: zeven
    note: '*Șapte* verandert niet.'
    example_gloss: Zeven, acht, negen.
  ro.a1.unit02.lesson01.teach.opt:
    title: Acht
    gloss: acht
    note: '*Opt* is onveranderlijk.'
    example_gloss: Acht, negen, tien.
  ro.a1.unit02.lesson01.teach.noua:
    title: Negen
    gloss: negen
    note: '*Nouă* is onveranderlijk. Zonder diakriet zou het identiek zijn aan *noua* ("de nieuwe", vrouwelijk) -- typ dus de *ă*: getypte antwoorden worden met diakrieten gecontroleerd.'
    example_gloss: Negen, tien... klaar!
  ro.a1.unit02.lesson01.teach.zece:
    title: Tien
    gloss: tien
    note: '*Zece* is onveranderlijk en vormt de basis van alle getallen van elf tot en met negentien (*zece* + *-sprezece*).'
    example_gloss: Tien! Goed zo!
  ro.a1.unit02.lesson02.teach.unsprezece:
    title: Elf
    gloss: elf
    note: '*Unsprezece* is letterlijk opgebouwd uit *unu* + *spre* + *zece* ("één boven tien"), het patroon dat alle getallen vanaf hier volgen.'
    example_gloss: Tien, elf, twaalf.
  ro.a1.unit02.lesson02.teach.teens_pattern:
    title: Twaalf tot negentien
    gloss: doisprezece (12), treisprezece (13), paisprezece (14), cincisprezece (15), șaisprezece (16), șaptesprezece (17), optsprezece (18), nouăsprezece (19)
    note: 'Bij elk getal hoort *-sprezece* achter de gewone vorm van het cijfer: *doi* → *doisprezece*, *trei* → *treisprezece*, enzovoort tot *nouă* → *nouăsprezece*. Twee getallen zijn onregelmatig: veertien, waar *patru* verkort tot *pai-* (*paisprezece*, niet *patrusprezece*), en zestien, waar *șase* *șai-* wordt (*șaisprezece*, niet *șasesprezece*).'
  ro.a1.unit02.lesson02.teach.douazeci:
    title: Twintig
    gloss: twintig
    note: '*Douăzeci* ("twee tientallen") is een eigen woord, de basis voor alle getallen van 21 tot 29.'
    example_gloss: Negentien, twintig...
  ro.a1.unit02.lesson02.teach.douazeci_si_unu:
    title: Eenentwintig
    gloss: eenentwintig
    note: 'Vanaf eenentwintig verbindt het Roemeens het tiental en de eenheid met *și* ("en"): *douăzeci și unu*, *douăzeci și doi*, enzovoort -- anders dan bij de getallen van 12 tot 19, die tot één woord versmelten.'
    example_gloss: Twintig, eenentwintig, tweeëntwintig.
  ro.a1.unit02.lesson02.teach.tens_pattern:
    title: Dertig tot negentig
    gloss: treizeci (30), patruzeci (40), cincizeci (50), șaizeci (60), șaptezeci (70), optzeci (80), nouăzeci (90)
    note: 'Elk tiental vanaf dertig is het cijfer plus *-zeci* ("tientallen") -- *trei* → *treizeci*, *patru* → *patruzeci*, enzovoort. De enige spellingswijziging is bij zestig: *șase* wordt *șai-*, dus *șaizeci* (dezelfde *șai-* als in *șaisprezece*). Een Frans telsysteem met twintigtallen voor 70/80/90 bestaat in het Roemeens niet.'
  ro.a1.unit02.lesson02.teach.o_suta:
    title: Honderd
    gloss: honderd
    note: '*O sută* gebruikt *o* (de vrouwelijke vorm van "een"), niet *un*, omdat *sută* een vrouwelijk zelfstandig naamwoord is.'
    example_gloss: Negentig, honderd!
  ro.a1.unit02.lesson03.teach.cati_ani_ai:
    title: Informeel naar de leeftijd vragen
    gloss: Hoe oud ben je?
    note: Letterlijk "hoeveel jaren heb je", met *avea* (hebben), net zoals het Frans (*avoir*) en het Spaans voor leeftijd een vorm van "hebben" gebruiken in plaats van "zijn". Dat wijkt af van het Nederlands, dat "zijn" gebruikt. *Câți* (hoeveel, mannelijk) komt overeen met *ani* (jaren, mannelijk).
  ro.a1.unit02.lesson03.teach.am_nouasprezece_ani:
    title: Je leeftijd geven (onder de twintig)
    gloss: Ik ben negentien.
    note: '*Am* is de *eu*-vorm van *avea*. Voor getallen onder de twintig is er geen *de* nodig voor *ani*.'
  ro.a1.unit02.lesson03.teach.cati_ani_aveti:
    title: Formeel naar de leeftijd vragen
    gloss: Hoe oud ben je?
    note: '*Aveți* is de *dumneavoastră*-vorm van *avea*, passend bij het beleefde register uit Unit 1.'
  ro.a1.unit02.lesson03.teach.am_treizeci_de_ani:
    title: Je leeftijd geven (twintig en ouder)
    gloss: Ik ben dertig.
    note: '*De* staat hier omdat *treizeci* twintig of hoger is -- zie de volgende kaart voor de volledige regel.'
  ro.a1.unit02.lesson03.teach.de_insertion_rule:
    title: Wanneer je de voor een zelfstandig naamwoord zet
    gloss: '2-19: geen de (doi ani) / 20+: met de (treizeci de ani)'
    note: 'Een typisch Roemeense regel die het Nederlands niet kent: getallen van 2 tot 19 staan direct voor het zelfstandig naamwoord (*doi ani*, twee jaar; *nouăsprezece ani*, negentien jaar), maar vanaf 20 komt er *de* tussen het getal en het zelfstandig naamwoord (*treizeci de ani*, dertig jaar; *o sută de ani*, honderd jaar). *Un an* (één jaar) is een apart geval -- enkelvoud, in beide gevallen zonder *de*.'
  ro.a1.unit02.lesson03.teach.care_e_numarul_tau:
    title: Informeel naar een telefoonnummer vragen
    gloss: Wat is je telefoonnummer?
    note: '*Care* (welk/wat) is de natuurlijke manier om naar een bepaald, bestaand nummer te vragen, niet *ce*. *Număr* is een onzijdig zelfstandig naamwoord: in het enkelvoud krijgt het dezelfde vorm als een mannelijk woord, dus *jouw* is *tău*, niet *ta*.'
  ro.a1.unit02.lesson03.teach.care_este_numarul_dvs:
    title: Formeel naar een telefoonnummer vragen
    gloss: Wat is je telefoonnummer?
    note: '*Este* is de volledige vorm van *e*, vaker gebruikt in zorgvuldige of formele taal. *Dumneavoastră* houdt het gesprek beleefd; dat woord kwam al in Unit 1 aan bod.'
  ro.a1.unit02.lesson03.teach.raspuns_telefon:
    title: Een telefoonnummer cijfer voor cijfer geven
    gloss: 'Het is: nul, zeven, twee, een, vier, vijf, zes, zeven, acht, negen.'
    note: In deze unit lezen we nummers gewoon cijfer voor cijfer, een vereenvoudiging zoals Unit 1 die ook bij het register maakte -- iemand aan de telefoon kan de cijfers ook in paren groeperen, maar losse cijfers worden altijd begrepen.
