answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (casă, apartament, cameră, dormitor, bucătărie, baie, fereastră) is used only in person-invariant third-person statements ("Ana are...", "Mihai are...", "Unde este baia?", "Casa mea este mare"). No new tu/dumneavoastră form is introduced this unit; Ana and Mihai keep their existing formal register with each other in the dialogue's greeting lines.
course:
  title: Roemeens A1
  description: 'Een eenvoudig huis beschrijven in het Roemeens: Casă (huis), Apartament (appartement), Cameră (kamer), Dormitor (slaapkamer), Bucătărie (keuken), Baie (badkamer) en Fereastră (raam). Mihai bezoekt het huis van Ana en ze praten over waar ze allebei wonen.'
units:
  ro.a1.unit18.housing:
    title: Wonen
lessons:
  ro.a1.unit18.lesson01.casa_anei:
    title: Het huis van Ana
  ro.a1.unit18.lesson02.apartamentul_lui_mihai:
    title: Het appartement van Mihai
  ro.a1.unit18.lesson03.vizita_la_ana:
    title: Het bezoek bij Ana
teaching:
  ro.a1.unit18.lesson01.teach.reminder_ana_mare:
    title: 'Herhaling: Ana, mare'
    gloss: Ana (naam) · mare (groot)
    note: Ana is de naam van het personage, al sinds Unit 1; *mare* komt uit Unit 5/Unit 14 – in deze unit gebruik je beide om haar huis te beschrijven.
  ro.a1.unit18.lesson01.teach.reminder_articole_trei:
    title: 'Herhaling: un, o, și, trei'
    gloss: un/o (een) · și (en) · trei (drie)
    note: '*Un*/*o*/*și* komen uit Unit 5; *trei* komt uit het tellen in Unit 2 – in deze unit gebruik je alle vier om kamers te tellen en te beschrijven.'
  ro.a1.unit18.lesson01.teach.are_vocab:
    title: Heeft
    gloss: Are (hij/zij/het heeft)
    note: Een nieuwe vorm van *a avea* (hebben) – *am* (ik heb, uit Unit 2/Unit 5) en *aveți* (u hebt) ken je al; *are* is de vorm voor de derde persoon enkelvoud en gebruik je om te zeggen wat iemand of iets heeft.
  ro.a1.unit18.lesson01.teach.casa_vocab:
    title: Huis
    gloss: Casă (huis)
    note: De plek waar iemand woont.
    example_gloss:
    - Ana heeft een groot huis.
  ro.a1.unit18.lesson01.teach.camera_vocab:
    title: Kamer
    gloss: Cameră (kamer)
    note: Een algemeen woord voor een kamer in een woning.
    example_gloss:
    - Ana heeft een grote kamer.
  ro.a1.unit18.lesson01.teach.camere_plural:
    title: Cameră → camere
    gloss: cameră (kamer) · camere (kamers)
    note: Het meervoud van *cameră* is *camere* – je gebruikt het als je meer dan één kamer telt.
  ro.a1.unit18.lesson01.teach.dormitor_vocab:
    title: Slaapkamer
    gloss: Dormitor (slaapkamer)
    note: De kamer waar iemand slaapt.
    example_gloss:
    - Ana heeft een slaapkamer.
  ro.a1.unit18.lesson01.teach.bucatarie_vocab:
    title: Keuken
    gloss: Bucătărie (keuken)
    note: De kamer waar iemand kookt.
    example_gloss:
    - Ana heeft een keuken.
  ro.a1.unit18.lesson01.teach.baie_vocab:
    title: Badkamer
    gloss: Baie (badkamer)
    note: De kamer met bad of douche en toilet.
    example_gloss:
    - Ana heeft een badkamer.
  ro.a1.unit18.lesson01.teach.casa_mare_phrase:
    title: 'Ana heeft een groot huis. Het heeft drie kamers: een slaapkamer, een keuken en een badkamer.'
    gloss: 'Ana are o casă mare. Casa are trei camere: un dormitor, o bucătărie și o baie.'
    note: 'Alle woorden hier heb je al geleerd of net leren kennen, en nu staan ze in twee nieuwe zinnen over Ana''s huis. *Casa* is de bepaalde vorm van *casă* – ''het huis'': een vrouwelijk zelfstandig naamwoord op -ă krijgt -a in plaats van -ă, net als *banca* (de bank) in Unit 8.'
  ro.a1.unit18.lesson02.teach.reminder_mihai_mic:
    title: 'Herhaling: Mihai, mic'
    gloss: Mihai (naam) · mic (klein)
    note: Mihai is de naam van het personage, al sinds Unit 1; *mic* komt uit Unit 14 – in deze unit gebruik je beide om zijn appartement te beschrijven.
  ro.a1.unit18.lesson02.teach.reminder_unde_este_doua:
    title: 'Herhaling: unde, este, două'
    gloss: unde (waar) · este (is) · două (twee, vrouwelijk)
    note: '*Unde*/*este* komen uit Unit 8/Unit 9; *două* is de vrouwelijke vorm van ''twee'' uit Unit 2 – in deze unit gebruik je alle drie om naar kamers te vragen en ze te tellen.'
  ro.a1.unit18.lesson02.teach.apartament_vocab:
    title: Appartement
    gloss: Apartament (appartement)
    note: Mihai's woning – een kleiner alternatief voor Ana's huis.
    example_gloss:
    - Mihai heeft een klein appartement.
  ro.a1.unit18.lesson02.teach.fereastra_vocab:
    title: Raam
    gloss: Fereastră (raam)
    note: '*Apartamentul* is de bepaalde vorm van *apartament* – ''het appartement'': een onzijdig zelfstandig naamwoord dat op een medeklinker eindigt, krijgt -ul, net als *magazinul* (de winkel) in Unit 8 (vrouwelijk *casă* wordt daarentegen *casa*).'
    example_gloss:
    - Het appartement heeft een groot raam.
  ro.a1.unit18.lesson02.teach.apartament_mic_phrase:
    title: 'Mihai heeft een klein appartement. Het heeft twee kamers: een slaapkamer en een keuken.'
    gloss: 'Mihai are un apartament mic. Apartamentul are două camere: un dormitor și o bucătărie.'
    note: Alle woorden hier heb je al geleerd of net leren kennen, en nu staan ze in twee nieuwe zinnen over Mihai's appartement.
  ro.a1.unit18.lesson02.teach.unde_este_baia_phrase:
    title: Waar is de badkamer?
    gloss: Unde este baia? (Waar is de badkamer?)
    note: '*Baia* is de bepaalde vorm van *baie* – ''de badkamer''. Een handige vraag als je bij iemand op bezoek bent.'
  ro.a1.unit18.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Herhaling: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (hoi) · Ce mai faceți? (hoe gaat het met u?) · Bine, mulțumesc (goed, dank u)
    note: Alles uit de openingsgroet van Unit 1, hier opnieuw gebruikt om de dialoog van deze unit te beginnen.
  ro.a1.unit18.lesson03.teach.reminder_la_revedere_mea_aproape_am:
    title: 'Herhaling: La revedere, Mea, Aproape, Am'
    gloss: La revedere (tot ziens) · Mea (mijn, vrouwelijk) · Aproape (dichtbij) · Am (ik heb)
    note: '*La revedere* komt uit Unit 1; *mea* uit *Mama mea* in Unit 5; *aproape* uit de antwoorden op *Unde este...?* in Unit 8/Unit 9; *am* uit Unit 2/Unit 5 – allemaal hier opnieuw gebruikt voor de dialoog over een bezoek thuis.'
  ro.a1.unit18.lesson03.teach.line01:
    title: Groet Ana en vraag hoe het met haar gaat
    gloss: Mihai groet Ana en vraagt hoe het met haar gaat.
    note: Gebruikt opnieuw de groet *Ce mai faceți?* uit Unit 1.
  ro.a1.unit18.lesson03.teach.line02:
    title: Antwoord en beschrijf je huis
    gloss: Ana antwoordt en vertelt Mihai dat haar huis groot is en drie kamers heeft.
    note: Combineert *Bine, mulțumesc* uit Unit 1 met de zin uit les 1 van deze unit.
  ro.a1.unit18.lesson03.teach.line03:
    title: Vraag waar de badkamer is
    gloss: Mihai vraagt Ana waar de badkamer is.
    note: Herhaalt bijna precies de zin uit les 2 van deze unit.
  ro.a1.unit18.lesson03.teach.line04:
    title: Antwoord waar de badkamer is
    gloss: Ana zegt dat die dichtbij is.
    note: Combineert *baia* met *aproape*, hetzelfde antwoordpatroon op 'waar is...?' als in Unit 8/Unit 9.
  ro.a1.unit18.lesson03.teach.line05:
    title: Beschrijf je eigen appartement en zeg gedag
    gloss: Mihai zegt dat hij een klein appartement met twee kamers heeft en neemt dan afscheid.
    note: Combineert de zin uit les 2 van deze unit met de afsluitende zin uit Unit 1.
  ro.a1.unit18.lesson03.teach.line06:
    title: Zeg gedag
    gloss: Ana neemt afscheid.
    note: Dezelfde afsluiting als in de dialoog van elke eerdere unit.
