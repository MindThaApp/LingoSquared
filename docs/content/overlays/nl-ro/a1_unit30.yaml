answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Roemeens A1
  description: 'Roemeens voor beginners om vrijetijdsbestedingen te beschrijven: hobbywoordenschat, frequentie-uitdrukkingen, vragen en antwoorden wat iemand in zijn vrije tijd doet, en de hobby''s van twee mensen vergelijken.'
units:
  ro.a1.unit30.timp_liber:
    title: Hobby's en vrije tijd
lessons:
  ro.a1.unit30.lesson01.cititul_sportul_si_gatitul:
    title: Lezen, sporten en koken
  ro.a1.unit30.lesson02.muzica_desen_si_jocuri:
    title: Muziek, tekenen en gamen
  ro.a1.unit30.lesson03.ce_faci_in_timpul:
    title: Wat doe je in je vrije tijd?
  ro.a1.unit30.lesson04.ana_si_mihai_vorbesc:
    title: Ana en Mihai praten over hobby's
  ro.a1.unit30.lesson05.mihai_si_ana_isi:
    title: Mihai en Ana vergelijken hun hobby's
  ro.a1.unit30.lesson06.planuim_impreuna_un_weekend:
    title: Samen een weekend plannen
teaching:
  ro.a1.unit30.lesson01.teach.a_citi_a:
    title: Lezen, sporten, koken
    gloss: lezen, sporten, koken
    note: 'Drie veelgebruikte hobbywerkwoorden: *a citi* (lezen), *a face sport* (sporten) en *a găti* (koken). Roemeense woordenboekvormen beginnen met *a*.'
    example_gloss:
    - Ik lees graag een boek.
    - Ik sport op zaterdag.
    - Ik kook graag voor vrienden.
  ro.a1.unit30.lesson01.teach.timpul_liber:
    title: Vrije tijd
    gloss: vrije tijd
    note: '*Timpul liber* (vrije tijd) is gevormd met het mannelijke zelfstandig naamwoord *timp* met aangehecht lidwoord. Het is de sleutelzin om over hobby''s te praten.'
    example_gloss: In mijn vrije tijd lees ik graag.
  ro.a1.unit30.lesson01.teach.in_timpul_liber:
    title: Zeggen wat je in je vrije tijd doet
    gloss: In mijn vrije tijd lees ik graag.
    note: '*Citesc* is de *eu*-vorm van *a citi* (lezen); na *îmi place să* heeft het werkwoord dezelfde vorm.'
  ro.a1.unit30.lesson02.teach.a_asculta_muzica:
    title: Muziek, tekenen, gamen
    gloss: naar muziek luisteren, tekenen, gamen
    note: 'Nog drie hobbyuitdrukkingen: *a asculta muzică* (naar muziek luisteren), *a desena* (tekenen) en *a juca jocuri video* (videogames spelen).'
    example_gloss:
    - Ik luister graag naar muziek.
    - Ik teken vaak.
    - Ik game graag met vrienden.
  ro.a1.unit30.lesson02.teach.imi_place_sa:
    title: Zeggen dat je graag naar muziek luistert
    gloss: Ik luister graag naar muziek.
    note: '*Îmi place să ascult muzică*: *îmi place* („het bevalt me”) + *să* + een werkwoord is de gebruikelijke manier om te zeggen dat je iets graag doet.'
  ro.a1.unit30.lesson02.teach.imi_place_sa_2:
    title: Zeggen dat je graag met vrienden gamet
    gloss: Ik game graag met vrienden.
    note: '*Cu prietenii* betekent „met de vrienden”: *cu* („met”) is het voorzetsel en *prietenii* is de bepaalde meervoudsvorm.'
  ro.a1.unit30.lesson03.teach.mereu_des_uneori:
    title: Altijd, vaak, soms, nooit
    gloss: altijd, vaak, soms, nooit
    note: 'De vier belangrijkste frequentiebijwoorden: *mereu*, *des*, *uneori* en *niciodată*. Ze staan meestal na het werkwoord: *Citesc des*.'
    example_gloss:
    - Ik sport altijd op zaterdag.
    - Ik lees vaak een boek.
    - Ik teken soms.
    - Ik game nooit.
  ro.a1.unit30.lesson03.teach.in_fiecare_saptamana:
    title: Elke week, elk weekend
    gloss: elke week, elk weekend
    note: '*În fiecare săptămână* en *în fiecare weekend* betekenen allebei „elke”; *fiecare* verandert nooit, zie de volgende kaart.'
    example_gloss:
    - Ik kook elke week voor vrienden.
    - Ik sport elk weekend.
  ro.a1.unit30.lesson03.teach.cuvantul_fiecare_nu:
    title: Fiecare verandert nooit
    gloss: 'Het woord fiecare verandert niet: în fiecare săptămână (elke week), în fiecare weekend (elk weekend).'
    note: '*Fiecare* blijft hetzelfde voor *săptămână* en *weekend*, welk zelfstandig naamwoord er ook volgt, dus er valt niets te kiezen.'
  ro.a1.unit30.lesson03.teach.ce_faci_in:
    title: Vragen naar vrije tijd
    gloss: Wat doe je in je vrije tijd?
    note: 'Dit is de kernvraag van deze unit: gebruik hem om iedereen naar zijn of haar hobby''s te vragen.'
  ro.a1.unit30.lesson04.teach.ana_ne_plimbam:
    title: Ana begint over hobby's
    gloss: 'Ana: Wij wandelen vaak samen. Maar wat doe jij nog meer in je vrije tijd, Mihai?'
    note: '*Ne plimbăm* („we maken een wandeling”) is de *noi*-vorm van het wederkerende werkwoord *a se plimba*; het verwijst naar de wandelingen waar beide vrienden van houden.'
  ro.a1.unit30.lesson04.teach.mihai_imi_place:
    title: Mihai's hobby's
    gloss: 'Mihai: Ik hou van koken, ook thuis. En ik sport vaak.'
    note: '*Și acasă* (ook thuis) maakt duidelijk dat Mihai voor zijn plezier kookt, niet alleen in zijn baan in het restaurant.'
  ro.a1.unit30.lesson04.teach.ana_gatesti_si:
    title: Ana is verrast
    gloss: 'Ana: Kook je ook thuis? Je kookt toch al de hele dag op je werk!'
    note: '*Toată ziua* (de hele dag) benadrukt hoeveel Mihai al kookt op zijn werk; *deja* betekent „al”.'
  ro.a1.unit30.lesson04.teach.mihai_da_dar:
    title: Mihai legt uit
    gloss: 'Mihai: Ja, maar ik vind koken ontspannend. En jij, wat doe jij graag?'
    note: '*Gătitul mi se pare relaxant* betekent letterlijk „koken lijkt me ontspannend”: *mi se pare* is een gangbare manier om een mening te geven.'
  ro.a1.unit30.lesson04.teach.ana_imi_place:
    title: Ana's hobby's
    gloss: 'Ana: Ik lees graag en luister vaak naar muziek.'
    note: Combineert twee hobbywerkwoorden uit eerdere lessen in één zin met *și* (en).
  ro.a1.unit30.lesson04.teach.mihai_joci_si:
    title: Mihai vraagt naar gamen
    gloss: 'Mihai: Game jij ook?'
    note: Een korte ja/nee-vraag met *jocuri video* uit een eerdere les; *joci* is de *tu*-vorm van *a juca*.
  ro.a1.unit30.lesson04.teach.ana_nu_nu:
    title: Ana antwoordt
    gloss: 'Ana: Nee, ik game nooit. Maar ik teken soms!'
    note: '*Niciodată* (nooit) en *uneori* (soms) uit een eerdere les, tegenover elkaar gezet in één antwoord; *nu ... niciodată* is een dubbele ontkenning.'
  ro.a1.unit30.lesson05.teach.mihai_si_cu:
    title: Hobby's vergelijken
    gloss: Mihai en ik wandelen vaak samen. Maar we hebben ook andere passies. Mihai kookt graag, ook thuis, en sport vaak. Ik lees graag en luister vaak naar muziek. Ik teken soms, maar ik game nooit. Wat doe jij graag in je vrije tijd?
    note: Ana's bericht vat eerdere feiten samen en eindigt met de kernvraag van de unit aan de lezer.
    glosses:
      plimbăm: wandelen
      des: vaak
      împreună: samen
      alte: andere
      gătească: kookt
      place: graag
      acasă: thuis
      sport: sport
      citesc: lees
      ascult: luister
      muzică: muziek
      desenez: teken
      uneori: soms
      joc: videogames spelen
      niciodată: nooit
      liber: vrij
      timpul: tijd
  ro.a1.unit30.lesson06.teach.mihai_ce_faci:
    title: Mihai vraagt naar het weekend
    gloss: 'Mihai: Wat doe je dit weekend?'
    note: '*În acest weekend* (dit weekend) gebruikt *acest* voor „dit”.'
  ro.a1.unit30.lesson06.teach.ana_inca_nu:
    title: Ana twijfelt
    gloss: 'Ana: Ik weet het nog niet. Ik lees graag, maar ik wil ook naar buiten.'
    note: '*Să ies afară* (naar buiten gaan) is een gangbare manier om te zeggen dat je de deur uit wilt; *vreau să* + een werkwoord betekent „ik wil ...”.'
  ro.a1.unit30.lesson06.teach.mihai_hai_sa:
    title: Mihai doet een voorstel
    gloss: 'Mihai: Zullen we samen gaan wandelen? Daarna kook ik voor ons.'
    note: '*După aceea* (daarna) geeft de volgorde aan; *Hai să* + een werkwoord stelt voor om samen iets te doen.'
  ro.a1.unit30.lesson06.teach.ana_buna_idee:
    title: Ana stemt in
    gloss: 'Ana: Goed idee! Ik vind zowel wandelen als koken leuk.'
    note: '*Și ..., și ...* („zowel ... als ...”) laat zien dat Ana twee dingen even leuk vindt, niet het ene meer dan het andere.'
  ro.a1.unit30.lesson06.teach.mihai_perfect_atunci:
    title: Mihai bevestigt
    gloss: 'Mihai: Prima. Dan zien we elkaar zaterdag!'
    note: Een vriendelijke afsluiting die het plan voor *sâmbătă* (zaterdag) bevestigt; *ne vedem* betekent „we zien elkaar”.
