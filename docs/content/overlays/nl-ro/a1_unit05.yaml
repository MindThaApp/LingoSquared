answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: This unit's new "Ai frați?"/"Aveți frați?" and "Câți copii ai?"/"Câți copii aveți?" pairs are register-sensitive (tu vs. dumneavoastră, parallel to unit02's ai/aveți age questions) -- accept either register unless an exercise explicitly names one. Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: Roemeens A1
  description: 'Praten over familie in het Roemeens: ouders, broers en zussen, kinderen en burgerlijke staat, met het bezittelijke paar meu/mea en hetzelfde tu/dumneavoastră-contrast als in de leeftijdsvragen van Unit 2. Ana en Mihai leren hier elkaars families kennen.'
units:
  ro.a1.unit05.family:
    title: Familie
lessons:
  ro.a1.unit05.lesson01.familia_mea:
    title: Mijn familie
  ro.a1.unit05.lesson02.frati_si_copii:
    title: Broers, zussen en kinderen
  ro.a1.unit05.lesson03.o_discutie_despre_familie:
    title: Een gesprek over familie
teaching:
  ro.a1.unit05.lesson01.teach.reminder_am_un_o_si_mare:
    title: 'Herhaling: am, un, o, și, mare'
    gloss: am (ik heb) · un/o (een) · și (en) · mare (groot)
    note: Alle vijf kwamen al in eerdere units voor (*și* in Unit 1, *am* en *o* in Unit 2, *mare* in de notitie over hoofdletters in Unit 3, *un* in Unit 4). Hier keren ze terug om over familie te praten.
  ro.a1.unit05.lesson01.teach.familie:
    title: Familie
    gloss: familie (familie)
    note: Een vrouwelijk zelfstandig naamwoord. Met *o* en een bijvoeglijk naamwoord zoals *mare* zeg je 'een grote familie'.
    example_gloss: Ik heb een grote familie.
  ro.a1.unit05.lesson01.teach.mama:
    title: Moeder
    gloss: mamă (moeder)
    note: Het gewone woordenboekwoord voor 'moeder'. Een paar kaarten verder zie je hoe je 'mijn moeder' zegt.
    example_gloss: Mihai heeft een moeder en een vader.
  ro.a1.unit05.lesson01.teach.tata:
    title: Vader
    gloss: tată (vader)
    note: Het gewone woordenboekwoord voor 'vader'.
    example_gloss: Mijn vader is leraar.
  ro.a1.unit05.lesson01.teach.parintii:
    title: Ouders
    gloss: părinți (ouders)
    note: Omvat beide ouders samen, net als het Nederlandse 'ouders'.
    example_gloss: Mijn ouders wonen in Roemenië.
  ro.a1.unit05.lesson01.teach.meu_mea:
    title: 'Mijn: meu vs. mea'
    gloss: meu (mijn, mannelijk) / mea (mijn, vrouwelijk)
    note: 'Het Roemeense woord voor ''mijn'' richt zich naar het geslacht van het bezit, niet van de bezitter: *meu* bij een mannelijk woord zoals *tată*, *mea* bij een vrouwelijk woord zoals *mamă*.'
  ro.a1.unit05.lesson01.teach.mama_mea:
    title: Mijn moeder
    gloss: mijn moeder
    note: Mamă wordt mama (het bepaalde lidwoord wordt toegevoegd) voordat mea erbij komt. Zo zeg je echt 'mijn moeder'; het is geen woord-voor-woordvertaling.
  ro.a1.unit05.lesson01.teach.tatal_meu:
    title: Mijn vader
    gloss: mijn vader
    note: Tată wordt tatăl (met het bepaalde lidwoord, onregelmatig met -l, omdat tată al op -ă eindigt) voordat meu erbij komt.
  ro.a1.unit05.lesson01.teach.mama_si_tatal:
    title: Mijn moeder en mijn vader
    gloss: Mijn moeder en mijn vader.
    note: Zet beide bezitsvormen in één zin, elk met de juiste overeenkomst in geslacht.
  ro.a1.unit05.lesson02.teach.reminder_cati_ai_aveti_doi_nu:
    title: 'Herhaling: câți, ai, aveți, doi, nu'
    gloss: câți (hoeveel) · ai/aveți (je hebt/u hebt, informeel/formeel) · doi (twee) · nu (nee/niet)
    note: '*Câți*, *ai* en *aveți* kwamen voor het eerst in Unit 2 voor bij de vraag naar de leeftijd ("Câți ani ai?"). Hier gaan ze over broers, zussen en kinderen. *Doi* komt uit de getallen van Unit 2, *nu* uit Unit 3.'
  ro.a1.unit05.lesson02.teach.da:
    title: Ja
    gloss: da (ja)
    note: Het alledaagse woord voor 'ja', het tegenovergestelde van *nu* ('nee') uit Unit 3.
    example_gloss: Ja, ik heb een broer.
  ro.a1.unit05.lesson02.teach.frate_sora:
    title: Broer, zus
    gloss: frate (broer) / soră (zus)
    note: Een mannelijk en een vrouwelijk woord voor broer en zus. Ze combineren met un/o net als elk ander zelfstandig naamwoord.
    example_gloss:
    - Ik heb een broer.
    - Ik heb een zus.
  ro.a1.unit05.lesson02.teach.frati_surori:
    title: Broers, zussen
    gloss: frați (broers) / surori (zussen)
    note: De meervoudsvormen, die je gebruikt om in het algemeen naar broers en zussen te VRAGEN. Roemenen vragen vaak "Ai frați?" ("Heb je broers?") in de betekenis van "heb je broers of zussen?", vaak gevolgd door "Surori?" om apart naar zussen te vragen.
    example_gloss: Heb je broers of zussen?
  ro.a1.unit05.lesson02.teach.ai_frati:
    title: Heb je broers of zussen? (informeel)
    gloss: Heb je broers?
    note: De alledaagse, informele manier om het te vragen. Past bij *tu* uit Unit 1.
  ro.a1.unit05.lesson02.teach.aveti_frati:
    title: Heeft u broers of zussen? (formeel)
    gloss: Heb je broers?
    note: De beleefde vorm, met dezelfde *aveți* als in de leeftijdsvraag van Unit 2.
  ro.a1.unit05.lesson02.teach.copil_copii:
    title: Kind, kinderen
    gloss: copil (kind) / copii (kinderen)
    note: 'Copil heeft een van de lastigere meervouden in het Roemeens: copii, dus geen gewone uitgang op -i of -e. Leer het als aparte vorm.'
    example_gloss: Ik heb twee kinderen.
  ro.a1.unit05.lesson02.teach.fiu_fiica:
    title: Zoon, dochter
    gloss: fiu (zoon) / fiică (dochter)
    note: De specifieke woorden voor zoon en dochter, anders dan het algemene copil/copii.
    example_gloss:
    - Ik heb een zoon.
    - Ik heb een dochter.
  ro.a1.unit05.lesson02.teach.cati_copii_ai:
    title: Hoeveel kinderen heb je?
    gloss: Hoeveel kinderen heb je?
    note: 'Câți (hoeveel) + copii (kinderen) + ai (je hebt): alle drie al bekend.'
  ro.a1.unit05.lesson02.teach.casatorit:
    title: Getrouwd
    gloss: căsătorit (getrouwd)
    note: Een veelvoorkomende persoonlijke vraag in gewone gesprekken, net als vragen naar iemands leeftijd.
    example_gloss: Ben je getrouwd?
  ro.a1.unit05.lesson03.teach.reminder_bine_la_revedere:
    title: 'Herhaling: bine, la revedere, Ana, Mihai'
    gloss: bine (goed) · la revedere (tot ziens) · Ana, Mihai (namen)
    note: Herhaalt woordenschat uit eerdere units, die terugkomt in de dialoog van deze les.
  ro.a1.unit05.lesson03.teach.line01:
    title: Vragen naar broers en zussen
    gloss: Ana vraagt Mihai of hij broers of zussen heeft.
    note: Gebruikt de beleefde vorm *aveți*, passend bij de manier waarop ze elkaar al aanspreken.
  ro.a1.unit05.lesson03.teach.line02:
    title: Antwoorden en terugvragen
    gloss: Mihai zegt dat hij een broer en een zus heeft en vraagt of Ana kinderen heeft.
    note: Gebruikt de woorden frate/soră en copii uit deze unit in één uitwisseling.
  ro.a1.unit05.lesson03.teach.line03:
    title: Antwoorden en de vraag teruggeven
    gloss: Ana zegt dat ze een dochter heeft en stelt Mihai dezelfde vraag terug.
    note: '*Și dumneavoastră?* (''En u?'') is precies hetzelfde patroon om een vraag terug te geven als in de kennismaking in Unit 1.'
  ro.a1.unit05.lesson03.teach.line04:
    title: Antwoord
    gloss: Mihai zegt dat hij een zoon heeft.
    note: Een kort, direct antwoord met het woord fiu uit deze unit.
  ro.a1.unit05.lesson03.teach.line05:
    title: Reageren en afsluiten
    gloss: Ana reageert positief en zegt gedag.
    note: '*Bine!* is hier een korte positieve reactie, hetzelfde woord als in *Bine, mulțumesc.* uit Unit 1.'
  ro.a1.unit05.lesson03.teach.line06:
    title: Het gesprek afsluiten
    gloss: Mihai zegt ook gedag en noemt Ana bij haar naam.
    note: Hetzelfde vriendelijke afscheid waarmee de dialogen van Unit 1 en Unit 4 eindigden.
