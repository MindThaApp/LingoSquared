answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's new verbs are all first-person singular (mă trezesc, mănânc, beau, lucrez, merg, mă culc) and are register-neutral -- Romanian's first-person verb form is the same regardless of tu/dumneavoastră, and this unit introduces no second-person forms. Ana and Mihai's closing dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08/unit09.
course:
  title: Roemeens A1
  description: Een eenvoudige dagelijkse routine beschrijven in het Roemeens -- mă trezesc (ik word wakker), mănânc / beau (ik eet / ik drink), lucrez (ik werk), merg acasă (ik ga naar huis) en mă culc (ik ga naar bed) -- met opnieuw Ana en Mihai, terwijl Ana Mihai vraagt naar zijn dag.
units:
  ro.a1.unit10.routines:
    title: Dagelijkse routine
lessons:
  ro.a1.unit10.lesson01.dimineata:
    title: '''s Ochtends'
  ro.a1.unit10.lesson02.lucrez_merg_acasa:
    title: Ik werk, ik ga naar huis
  ro.a1.unit10.lesson03.rutina_mihai:
    title: De routine van Mihai
teaching:
  ro.a1.unit10.lesson01.teach.reminder_dimineata_seara_noaptea_cafea_paine:
    title: 'Herhaling: dimineața, seara, noaptea, cafea, pâine'
    gloss: dimineața ('s ochtends) · seara ('s avonds) · noaptea ('s nachts) · cafea (koffie) · pâine (brood)
    note: Alles al eerder geleerd -- dimineața/seara/noaptea sinds Unit 4, cafea/pâine sinds Unit 6 -- hier worden ze gecombineerd tot zinnen over de dagelijkse routine van deze unit.
  ro.a1.unit10.lesson01.teach.ma_trezesc_vocab:
    title: Ik word wakker
    gloss: Mă trezesc (Ik word wakker)
    note: '*Mă* is het wederkerend voornaamwoord dat je al zag in *mă numesc*/*mă cheamă* -- het Roemeens gebruikt voor ''wakker worden'' een wederkerend werkwoord, letterlijk ''ik maak mezelf wakker''.'
    example_gloss:
    - '''s Ochtends word ik wakker.'
  ro.a1.unit10.lesson01.teach.ma_trezesc_phrase:
    title: Ik word 's ochtends wakker
    gloss: Mă trezesc dimineața. (Ik word 's ochtends wakker.)
    note: Een korte, volledige zin -- de allereenvoudigste zin over je routine.
  ro.a1.unit10.lesson01.teach.mananc_vocab:
    title: Ik eet
    gloss: Mănânc (ik eet)
    note: 'Je hebt geen voornaamwoord voor ''ik'' nodig: de werkwoordsuitgang laat in het Roemeens al zien wie er spreekt, net als je eerder zag bij *vreau*/*cumpăr*/*aș dori*.'
    example_gloss:
    - Ik eet 's ochtends brood.
  ro.a1.unit10.lesson01.teach.beau_vocab:
    title: Ik drink
    gloss: Beau (ik drink)
    note: Past vanzelf bij dranken die je al kent, zoals *cafea* en *ceai*.
    example_gloss:
    - Ik drink 's ochtends koffie.
  ro.a1.unit10.lesson01.teach.mananc_beau_phrase:
    title: Ik eet brood en drink 's ochtends koffie
    gloss: Mănânc pâine și beau cafea dimineața. (Ik eet brood en drink 's ochtends koffie.)
    note: Verbindt twee handelingen met *și* (en), dat je al kent van *ora unu și jumătate* uit Unit 4.
  ro.a1.unit10.lesson02.teach.lucrez_vocab:
    title: Ik werk
    gloss: Lucrez (ik werk)
    note: De ik-vorm van *lucrează*, dat je in Unit 4 zag bij het avondwerk van Mihai.
    example_gloss:
    - Ik werk 's avonds.
  ro.a1.unit10.lesson02.teach.lucrez_phrase:
    title: Ik werk 's avonds
    gloss: Lucrez seara. (Ik werk 's avonds.)
    note: Een korte, volledige zin over wanneer je werkt.
  ro.a1.unit10.lesson02.teach.merg_vocab:
    title: Ik ga
    gloss: Merg (ik ga)
    note: 'De ik-vorm van *mergeți*, de gebiedende wijs die je eerder zag: hetzelfde werkwoord, een andere persoon.'
    example_gloss:
    - Ik ga naar huis.
  ro.a1.unit10.lesson02.teach.acasa_vocab:
    title: Wonen
    gloss: Acasă (naar huis / thuis)
    note: 'Wordt zonder voorzetsel gebruikt: *merg acasă*, niet *merg la acasă*, net zoals je in het Nederlands ''ik ga naar huis'' zegt zonder extra voorzetsel voor ''huis'' erbij.'
    example_gloss:
    - Ik ga 's nachts naar huis.
  ro.a1.unit10.lesson02.teach.merg_acasa_phrase:
    title: Ik ga 's nachts naar huis
    gloss: Merg acasă noaptea. (Ik ga 's nachts naar huis.)
    note: 'Een korte, volledige zin: het natuurlijke einde van een werkdag.'
  ro.a1.unit10.lesson02.teach.lucrez_merg_phrase:
    title: Ik werk 's avonds en ga 's nachts naar huis
    gloss: Lucrez seara și merg acasă noaptea. (Ik werk 's avonds en ga 's nachts naar huis.)
    note: Combineert beide zinnen uit deze les met *și* tot één zin.
  ro.a1.unit10.lesson03.teach.reminder_cursul_incepe_ora_apoi:
    title: 'Herhaling: cursul, începe, la ora nouă, apoi'
    gloss: cursul (de cursus) · începe (begint) · la ora nouă (om negen uur) · apoi (daarna)
    note: Cursul/începe/la ora nouă kwamen al in Unit 4 aan bod (Mihais cursus begint om negen uur 's ochtends); apoi kwam al in Unit 9 aan bod. Hier komen ze samen in Mihais eigen dagverhaal.
  ro.a1.unit10.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Herhaling: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (hoi) · mulțumesc (dank je) · la revedere (tot ziens) · da (ja) · Ana, Mihai (namen)
    note: Alles al eerder behandeld. Hier vraagt Ana Mihai naar zijn dag.
  ro.a1.unit10.lesson03.teach.ma_culc_vocab:
    title: Ik ga naar bed
    gloss: Mă culc (ik ga naar bed)
    note: 'Nog een wederkerend werkwoord, met hetzelfde patroon als *mă trezesc*. Letterlijk: ''ik leg mezelf neer''.'
    example_gloss:
    - Ik ga 's nachts naar bed.
  ro.a1.unit10.lesson03.teach.ma_culc_phrase:
    title: Ik ga 's nachts naar bed
    gloss: Mă culc noaptea. (Ik ga 's nachts naar bed.)
    note: Het natuurlijke einde van de dag, dat de routine afsluit die met *mă trezesc dimineața* begon.
  ro.a1.unit10.lesson03.teach.line01:
    title: Begroet en vraag wanneer de cursus begint
    gloss: Ana begroet Mihai en vraagt wanneer zijn cursus begint.
    note: Hergebruikt de vraag over Mihais cursus uit Unit 4.
  ro.a1.unit10.lesson03.teach.line02:
    title: Antwoord met het tijdstip van de cursus
    gloss: Mihai zegt dat zijn cursus om negen uur 's ochtends begint.
    note: Precies hetzelfde antwoord als Mihai in Unit 4 gaf, hier herhaald als onderdeel van zijn volledige dagindeling.
  ro.a1.unit10.lesson03.teach.line03:
    title: Vraag naar de avond
    gloss: 'Ana stelt een korte vervolgvraag: ''En ''s avonds?'''
    note: Een natuurlijke, beknopte manier om naar de rest van de dagindeling te vragen, zonder nieuw vraagwoord.
  ro.a1.unit10.lesson03.teach.line04:
    title: Beschrijf de rest van de dag
    gloss: Mihai zegt dat hij 's avonds werkt en daarna 's nachts naar bed gaat.
    note: 'Combineert *lucrez* en *mă culc* uit deze unit met *apoi*, en komt overeen met wat in Unit 4 al vaststond: Mihai werkt ''s avonds.'
  ro.a1.unit10.lesson03.teach.line05:
    title: Bedank en sluit af
    gloss: Ana zegt 'Goed!', bedankt Mihai en zegt tot ziens.
    note: Hetzelfde afsluitende bedankje als in de dialogen van Unit 1, 8 en 9.
  ro.a1.unit10.lesson03.teach.line06:
    title: Sluit het gesprek af
    gloss: Mihai zegt ook tot ziens en noemt Ana bij haar naam.
    note: Dezelfde vriendelijke afsluiting waarmee elke eerdere dialoog eindigde.
