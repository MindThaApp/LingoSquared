answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Day and month names are correctly lowercase in standard Romanian writing (except sentence-initially); accept a learner's answer regardless of the case they happen to type it in -- this unit teaches the lowercase convention as a fact to recognize, not a hard-graded spelling rule.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: Roemeens A1
  description: Dagen van de week, maanden van het jaar en hoe het Roemeens een datum zegt (een gewoon hoofdtelwoord plus de maand, behalve de 1e, waarvoor het bijzondere woord întâi wordt gebruikt) -- we volgen Ana en Mihai terwijl ze hun volgende afspraak plannen.
units:
  ro.a1.unit03.dates:
    title: Dagen en data
lessons:
  ro.a1.unit03.lesson01.zilele_saptamanii:
    title: Dagen van de week
  ro.a1.unit03.lesson02.lunile_si_datele:
    title: Maanden van het jaar en hoe we de datum zeggen
  ro.a1.unit03.lesson03.cand_ne_intalnim:
    title: Wanneer zien we elkaar weer?
teaching:
  ro.a1.unit03.lesson01.teach.este:
    title: 'Herhaling: este'
    gloss: is / het is
    note: '*Este* kwam al voor in Unit 2 (*Care este numărul...?*). Het is onveranderlijk -- hetzelfde woord of het onderwerp nu een dag, een datum of iets anders is, en het verandert niet tussen tu en dumneavoastră.'
  ro.a1.unit03.lesson01.teach.astazi_maine:
    title: Vandaag, morgen
    gloss: astăzi (vandaag) / mâine (morgen)
    note: Beide zijn onveranderlijke tijdswoorden die vooraan in een zin staan om te zeggen welke dag of datum het is.
    example_gloss:
    - Vandaag is het maandag.
    - Morgen is het dinsdag.
  ro.a1.unit03.lesson01.teach.luni_marti:
    title: Maandag, dinsdag
    gloss: luni (maandag) / marți (dinsdag)
    note: Om een dag te noemen (Astăzi este luni) gebruik je de kale vorm die hier staat. Namen van weekdagen hebben ook lidwoordvormen -- lunea, marțea -- die 'op maandag(en)', 'op dinsdag(en)' betekenen; die leer je later.
    example_gloss:
    - Vandaag is het maandag.
    - Morgen is het dinsdag.
  ro.a1.unit03.lesson01.teach.miercuri_joi:
    title: Woensdag, donderdag
    gloss: miercuri (woensdag) / joi (donderdag)
    note: Net als luni en marți hebben miercuri en joi dezelfde vorm in het enkelvoud en het meervoud.
    example_gloss:
    - Vandaag is het woensdag.
    - Morgen is het donderdag.
  ro.a1.unit03.lesson01.teach.vineri_sambata:
    title: Vrijdag, zaterdag
    gloss: vineri (vrijdag) / sâmbătă (zaterdag)
    note: Sâmbătă behoudt in de moderne spelling de â midden in het woord, anders dan de oudere spelling sîmbătă uit het bronmateriaal.
    example_gloss:
    - Vandaag is het vrijdag.
    - Morgen is het zaterdag.
  ro.a1.unit03.lesson01.teach.duminica:
    title: zondag
    gloss: zondag
    note: Duminică maakt de week compleet. Om te zeggen welke dag het is, gebruik je deze kale vorm; de lidwoordvorm duminica betekent 'op zondag(en)'.
    example_gloss: Vandaag is het zondag.
  ro.a1.unit03.lesson01.teach.ce_zi_e_azi:
    title: Vragen welke dag het is
    gloss: Welke dag is het vandaag?
    note: De alledaagse manier om te vragen welke dag van de week het is -- zi (dag) is hier het nieuwe woord, naast de bekende ce, este en astăzi.
  ro.a1.unit03.lesson01.teach.saptamana_ieri:
    title: Week, gisteren, vorige/volgende week
    gloss: săptămână (week) / ieri (gisteren) / săptămâna trecută (vorige week) / săptămâna viitoare (volgende week)
    note: Een extra woordenset uit hetzelfde bronmateriaal als de namen van de weekdagen -- handig om relatief over data te praten, maar in de oefeningen van deze unit minder intensief geoefend dan de weekdagen zelf.
  ro.a1.unit03.lesson01.teach.lowercase_zile:
    title: Dagen schrijf je met kleine letter
    gloss: 'Dagen schrijf je niet met een hoofdletter: maandag, vrijdag.'
    note: Net als in het Nederlands schrijf je weekdagen in het Roemeens midden in een zin met een kleine letter -- *luni*, niet *Luni* -- behalve wanneer het woord de zin opent.
  ro.a1.unit03.lesson02.teach.ian_feb_mar:
    title: Januari, februari, maart
    gloss: ianuarie (januari) / februarie (februari) / martie (maart)
    note: Anders dan de namen van de dagen lijken verschillende maandnamen sterk op de Nederlandse, want ze komen uit hetzelfde Latijn. Je herkent ze dus makkelijk.
    example_gloss:
    - Het is januari.
    - Het is februari.
    - Het is maart.
  ro.a1.unit03.lesson02.teach.apr_mai_iun:
    title: April, mei, juni
    gloss: aprilie (april) / mai (mei) / iunie (juni)
    note: Mai (mei) is kort, maar niet hetzelfde als het bijwoord mai (meer) dat elders in deze cursus voorkomt (ce mai faci). Uit de context is altijd duidelijk welke bedoeld wordt.
    example_gloss:
    - Het is april.
    - Het is mei.
    - Het is juni.
  ro.a1.unit03.lesson02.teach.iul_aug_sep:
    title: Juli, augustus, september
    gloss: iulie (juli) / august (augustus) / septembrie (september)
    note: August lijkt sterk op het Nederlandse augustus, alleen de uitgang ontbreekt. Het is een van de meest herkenbare verwante woorden in deze reeks.
    example_gloss:
    - Het is juli.
    - Het is augustus.
    - Het is september.
  ro.a1.unit03.lesson02.teach.oct_noi_dec:
    title: Oktober, november, december
    gloss: octombrie (oktober) / noiembrie (november) / decembrie (december)
    note: De laatste drie maanden maken de twaalf compleet. Het zijn allemaal onveranderlijke zelfstandige naamwoorden.
    example_gloss:
    - Het is oktober.
    - Het is november.
    - Het is december.
  ro.a1.unit03.lesson02.teach.intai:
    title: De eerste (van de maand)
    gloss: de eerste
    note: 'Een echte Roemeense regel: in standaardtaal noem je de eerste dag van een maand niet *unu* (gewoon "een"), maar gebruik je een eigen woord: *întâi*. (In informele spraak hoor je soms *unu*, maar *întâi* is de vorm om te leren.) Alle andere data, vanaf de tweede, gebruiken gewoon het hoofdtelwoord.'
    example_gloss: Vandaag is het één augustus.
  ro.a1.unit03.lesson02.teach.date_rule:
    title: Hoe je in het Roemeens een datum zegt
    gloss: '1e: întâi · 2e en verder: het gewone telwoord (doi, trei, patru...)'
    note: Na de eerste gebruik je voor een datum gewoon het hoofdtelwoord (dat je al kent) gevolgd door de maand. Er is geen rangtelwoord en geen extra woord nodig, bijvoorbeeld *trei aprilie* (drie april, letterlijk "drie april").
  ro.a1.unit03.lesson02.teach.ce_data:
    title: Naar de datum vragen
    gloss: Welke datum is het vandaag?
    note: Dată (datum) is hier een nieuw woord. De rest van de vraag hergebruikt ce, este en astăzi, precies zoals bij de vraag naar de dag in lesson01.
  ro.a1.unit03.lesson02.teach.raspuns_data:
    title: Een datum noemen
    gloss: Vandaag is het drie april.
    note: Trei (drie) is een hoofdtelwoord uit Unit 2. Er komt geen rangtelwoord-uitgang bij en er staat geen extra woord voor aprilie.
  ro.a1.unit03.lesson02.teach.la_multi_ani:
    title: Iemand het beste wensen op een speciale dag
    gloss: Gefeliciteerd met je verjaardag! / Gelukkig nieuwjaar!
    note: Letterlijk "(voor) vele jaren". Het is de meest gebruikte Roemeense wens voor een verjaardag, een naamdag of nieuwjaar. Je herkent *ani* (jaren) uit de leeftijdsles van Unit 2.
  ro.a1.unit03.lesson02.teach.lowercase_luni:
    title: Ook maanden schrijf je met een kleine letter
    gloss: 'Maanden schrijf je niet met een hoofdletter: ianuarie, mai.'
    note: 'Dezelfde regel als bij de namen van de dagen in lesson01: Roemeense maandnamen schrijf je midden in de zin met een kleine letter.'
  ro.a1.unit03.lesson03.teach.cand:
    title: Wanneer?
    gloss: wanneer?
    note: Când opent een vraag over tijd, net zoals wanneer dat in het Nederlands doet.
    example_gloss: Wanneer is de vergadering?
  ro.a1.unit03.lesson03.teach.intalnirea:
    title: De vergadering
    gloss: de vergadering
    note: Întâlnirea is de bepaalde vorm (de vergadering). Het zelfstandig naamwoord zonder lidwoord is întâlnire.
    example_gloss: De vergadering is op maandag.
  ro.a1.unit03.lesson03.teach.cand_e_intalnirea:
    title: Vragen wanneer iets is
    gloss: Wanneer is de vergadering?
    note: Combineert când met het bekende este en het nieuwe întâlnirea uit deze les.
  ro.a1.unit03.lesson03.teach.raspuns_intalnire:
    title: De datum van een gebeurtenis noemen
    gloss: De vergadering is op vrijdag 1 augustus.
    note: Een weekdag en een datum zeg je samen, gescheiden door een komma, net zoals in het Nederlands.
  ro.a1.unit03.lesson03.teach.fara_de:
    title: Geen de nodig bij dagen en data
    gloss: 'Bij dagen en data hoort geen ''de'': vrijdag 1 augustus.'
    note: 'Een handig contrast met de regel uit Unit 2: bij getallen vanaf 20 staat *de* voor een gewoon zelfstandig naamwoord (*treizeci de ani*), maar een weekdag of datum staat er direct achter, zonder *de*.'
  ro.a1.unit03.lesson03.teach.line01:
    title: Vragen wanneer de vergadering is
    gloss: Ana vraagt Mihai wanneer hun vergadering is.
    note: 'Een eenvoudige, neutrale vraag: este verandert niet, of je nu tu of dumneavoastră gebruikt.'
  ro.a1.unit03.lesson03.teach.line02:
    title: Noem de datum
    gloss: Mihai zegt dat de vergadering op vrijdag 1 augustus is.
    note: 'Mihai gebruikt precies het datumpatroon uit lesson02: weekdag, dan întâi + maand, zonder de.'
  ro.a1.unit03.lesson03.teach.line03:
    title: Bevestigen en afsluiten
    gloss: Ana bedankt hem en neemt afscheid.
    note: La revedere, dat je in Unit 1 hebt geleerd, sluit het gesprek af zoals altijd.
  ro.a1.unit03.lesson03.teach.line04:
    title: Het gesprek afsluiten
    gloss: Mihai zegt ook gedag en noemt daarbij Ana's naam.
    note: La revedere zeggen met de naam van de ander erbij is een natuurlijke, vriendelijke afsluiting.
