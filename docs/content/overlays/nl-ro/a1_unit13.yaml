answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit introduces the formal Vă place...? question (dative vă, matching Mihai's own established faceți/aveți-style formal verb endings) alongside first-person Îmi place/Nu-mi place/Prefer, which are person-invariant and carry no register distinction of their own. Ana and Mihai's dialogue keeps their existing polite register with each other, matching every earlier unit.
course:
  title: Roemeens A1
  description: 'Voorkeuren, wat je wel en niet leuk vindt uitdrukken in het Roemeens -- Îmi place (ik hou van), Nu-mi place (ik hou niet van), Vă place...? (houdt u van...?), Prefer (ik geef de voorkeur aan) en Sau (of) -- terwijl Ana en Mihai beslissen: koffie of thee?'
units:
  ro.a1.unit13.preferences:
    title: Voorkeuren
lessons:
  ro.a1.unit13.lesson01.imi_place:
    title: ik hou van / ik vind lekker
  ro.a1.unit13.lesson02.va_place_prefer:
    title: Houdt u van? Ik geef de voorkeur aan...
  ro.a1.unit13.lesson03.cafea_sau_ceaiul:
    title: Koffie of thee?
teaching:
  ro.a1.unit13.lesson01.teach.reminder_cafea_ceai_paine:
    title: 'Herhaling: cafea, ceai, pâine'
    gloss: cafea (koffie) · ceai (thee) · pâine (brood)
    note: Allemaal al behandeld in Unit 6 -- hier combineer je ze met de nieuwe grammatica van deze unit over wat je wel en niet leuk vindt.
  ro.a1.unit13.lesson01.teach.imi_place_vocab:
    title: ik hou van / ik vind lekker
    gloss: Îmi place (ik hou van / ik vind lekker)
    note: 'Letterlijk: ''het bevalt mij'' -- *îmi* (mij) plus het onveranderlijke *place* (bevalt). Om te zeggen dat je iets in het algemeen lekker of leuk vindt, gebruikt het Roemeens de bepaalde vorm van het zelfstandig naamwoord (*cafeaua*, niet de gewone vorm *cafea* uit Unit 6), terwijl je in het Nederlands gewoon ''ik hou van koffie'' zegt, zonder ''de''.'
    example_gloss:
    - Ik hou van koffie.
  ro.a1.unit13.lesson01.teach.imi_place_cafeaua_phrase:
    title: Ik hou van koffie
    gloss: Îmi place cafeaua. (Ik hou van koffie.)
    note: 'Het volledige patroon: Îmi place + het zelfstandig naamwoord in de bepaalde vorm.'
  ro.a1.unit13.lesson01.teach.imi_place_ceaiul_phrase:
    title: Ik hou van thee
    gloss: Îmi place ceaiul. (Ik hou van thee.)
    note: Hetzelfde patroon als *Îmi place cafeaua*, met een andere drank -- *ceaiul* is de bepaalde vorm van *ceai*, dat je al kent uit Unit 6.
  ro.a1.unit13.lesson01.teach.numi_place_vocab:
    title: ik hou niet van / ik vind niet lekker
    gloss: Nu-mi place (ik hou niet van)
    note: De ontkenning van *Îmi place* -- in gewone spraak wordt *nu îmi* samengetrokken tot *nu-mi*. Deze korte vorm met streepje is dus de natuurlijke manier om het te zeggen, niet zomaar een afkorting.
    example_gloss:
    - Ik hou niet van brood.
  ro.a1.unit13.lesson01.teach.numi_place_painea_phrase:
    title: Ik hou niet van brood
    gloss: Nu-mi place pâinea. (Ik hou niet van brood.)
    note: '*Pâinea* is de bepaalde vorm van *pâine*, dat je al kent uit Unit 6, hetzelfde patroon als *cafeaua*/*ceaiul*.'
  ro.a1.unit13.lesson02.teach.reminder_imi_place_numi_place:
    title: 'Herhaling: Îmi place, Nu-mi place'
    gloss: Îmi place (ik hou van) · Nu-mi place (ik hou niet van)
    note: Allebei uit les 1 van deze unit -- hier krijgen ze een vraagvorm erbij.
  ro.a1.unit13.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Herhaling: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (de koffie) · ceaiul (de thee) · pâinea (het brood)
    note: Allemaal uit les 1 van deze unit -- hier hergebruikt in de vraag- en voorkeursvormen.
  ro.a1.unit13.lesson02.teach.va_place_vocab:
    title: Houdt u van...?
    gloss: Vă place...? (Houdt u van...?)
    note: De formele vraagvorm van *Îmi place* -- *vă* (u) vervangt *îmi* (mij), hetzelfde *dumneavoastră*-register dat je al kent van *aveți*/*faceți*. Zet er een zelfstandig naamwoord in de bepaalde vorm achter, of gebruik het los als het onderwerp al duidelijk is.
    example_gloss:
    - Houdt u van koffie?
  ro.a1.unit13.lesson02.teach.va_place_cafeaua_phrase:
    title: Houdt u van koffie?
    gloss: Vă place cafeaua? (Houdt u van koffie?)
    note: 'Het volledige patroon: Vă place + het zelfstandig naamwoord in de bepaalde vorm, met stijgende vraagintonatie.'
  ro.a1.unit13.lesson02.teach.prefer_vocab:
    title: ik geef de voorkeur aan
    gloss: Prefer (ik geef de voorkeur aan)
    note: 'Een duidelijke verwante vorm van ons ''prefereren'' -- je hebt hier geen constructie met ''mij'' nodig, *prefer* werkt als een gewoon werkwoord: *Prefer* + datgene waaraan je de voorkeur geeft, net als bij *Îmi place* in de bepaalde vorm.'
    example_gloss:
    - Ik geef de voorkeur aan koffie.
  ro.a1.unit13.lesson02.teach.prefer_cafeaua_phrase:
    title: Ik geef de voorkeur aan koffie
    gloss: Prefer cafeaua. (Ik geef de voorkeur aan koffie.)
    note: Sterker dan *Îmi place cafeaua* -- handig als je tussen twee dingen kiest.
  ro.a1.unit13.lesson02.teach.sau_vocab:
    title: of
    gloss: Sau (of)
    note: Verbindt twee opties als je een keuze aanbiedt of ernaar vraagt -- anders dan *și* (en) uit Unit 10 en 12, dat twee dingen verbindt die allebei waar zijn.
    example_gloss:
    - Koffie of thee?
  ro.a1.unit13.lesson02.teach.cafea_sau_ceai_phrase:
    title: Koffie of thee?
    gloss: Cafea sau ceai? (Koffie of thee?)
    note: Een korte, natuurlijke manier om een keuze aan te bieden -- hier gebruik je de gewone vormen (*cafea*, *ceai*) en niet de bepaalde *cafeaua*/*ceaiul*, omdat het een open aanbod is en geen algemene uitspraak over koffie of thee.
  ro.a1.unit13.lesson03.teach.reminder_va_place_prefer_sau:
    title: 'Herhaling: Vă place, Prefer, Sau'
    gloss: Vă place? (Houdt u van?) · Prefer (ik geef de voorkeur aan) · Sau (of)
    note: Allemaal uit les 2 van deze unit -- hier gebruiken Ana en Mihai ze samen.
  ro.a1.unit13.lesson03.teach.reminder_imi_place_numi_place_cafeaua_ceaiul_painea:
    title: 'Herhaling: Îmi place, Nu-mi place, cafeaua, ceaiul, pâinea'
    gloss: Îmi place (ik hou van) · Nu-mi place (ik hou niet van) · cafeaua (de koffie) · ceaiul (de thee) · pâinea (het brood)
    note: Allemaal uit les 1 van deze unit -- hier zeggen Ana en Mihai allebei wat ze wel en niet lekker vinden.
  ro.a1.unit13.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Herhaling: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (hoi) · mulțumesc (dank je) · la revedere (tot ziens) · Ana, Mihai (namen)
    note: Allemaal al behandeld in eerdere units -- hetzelfde vriendelijke begin- en eindpatroon als in elke dialoog van deze cursus.
  ro.a1.unit13.lesson03.teach.line01:
    title: Begroeten en vragen naar koffie of thee
    gloss: Mihai begroet Ana en vraagt of ze van koffie of thee houdt.
    note: Combineert *Vă place...?* uit deze unit met *sau* om in één vraag beide opties aan te bieden.
  ro.a1.unit13.lesson03.teach.line02:
    title: Een voorkeur en een afkeer uitspreken
    gloss: Ana zegt dat ze de voorkeur geeft aan koffie en niet van thee houdt.
    note: Combineert *Prefer* met *Nu-mi place* -- haar voorkeur voor koffie komt overeen met haar eerdere keuze uit Unit 6 en 12.
  ro.a1.unit13.lesson03.teach.line03:
    title: De tegenovergestelde voorkeur noemen
    gloss: Mihai zegt dat hij van thee houdt en niet van koffie.
    note: Komt overeen met Mihai's eerdere keuze uit Unit 6 en 12 (ceai, nooit cafea).
  ro.a1.unit13.lesson03.teach.line04:
    title: Ook naar brood vragen
    gloss: Ana vraagt of Mihai ook van brood houdt.
    note: Begint met de korte vervolgvraag *Și pâinea?* (En het brood?) en vraagt dan volledig met *Vă place...?* naar een nieuw onderwerp, *pâinea*.
  ro.a1.unit13.lesson03.teach.line05:
    title: Bevestigen, bedanken en afscheid nemen
    gloss: Mihai zegt ja, hij houdt van brood, bedankt Ana en neemt afscheid.
    note: Komt overeen met Mihai's eerdere keuze uit Unit 6 (pâine) -- hetzelfde slotpatroon waarmee elke eerdere dialoog eindigde.
  ro.a1.unit13.lesson03.teach.line06:
    title: Het gesprek afsluiten
    gloss: Ana zegt ook tot ziens, met Mihai's naam erbij.
    note: Hetzelfde vriendelijke slotpatroon waarmee elke eerdere dialoog eindigde.
