answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02/03''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: Roemeens A1
  description: 'Leer hoe je in het Roemeens de tijd vraagt en zegt: hele uren, half, kwart over en kwart voor, delen van de dag, en vragen wanneer iets begint. Ana en Mihai gaan verder en regelen wanneer hun Roemeense les begint.'
units:
  ro.a1.unit04.time:
    title: De tijd zeggen
lessons:
  ro.a1.unit04.lesson01.ora_fixa_si_jumatate:
    title: Hele uren en half
  ro.a1.unit04.lesson02.sferturi_si_intrebari:
    title: Een kwartier, en hoe we naar de tijd vragen
  ro.a1.unit04.lesson03.cand_incepe_cursul:
    title: Wanneer begint de les?
teaching:
  ro.a1.unit04.lesson01.teach.este:
    title: 'Herhaling: este'
    gloss: is / het is
    note: '*Este* kwam al voor in Unit 2 en Unit 3. Het blijft precies hetzelfde woord, of je nu een getal, een dag, een datum of nu een tijdstip noemt.'
  ro.a1.unit04.lesson01.teach.ora:
    title: Het uur
    gloss: het uur
    note: Een vrouwelijk zelfstandig naamwoord. Je zet *ora* vlak voor een getal om een kloktijd te noemen, bijvoorbeeld *ora unu* (één uur).
    example_gloss: Het is één uur.
  ro.a1.unit04.lesson01.teach.ora_unu:
    title: Één uur
    gloss: één uur
    note: 'Letterlijk ''het-uur één'': eerst ora, dan het getal.'
  ro.a1.unit04.lesson01.teach.ora_doua:
    title: Twee uur
    gloss: twee uur
    note: Hier krijgt het getal de vrouwelijke vorm *două*, passend bij het vrouwelijke *ora*. Op de volgende kaart zie je het hele patroon.
  ro.a1.unit04.lesson01.teach.ora_gender_note:
    title: 'Een echte onregelmatigheid: unu blijft unu'
    gloss: ora unu (niet "ora una") / ora două (niet "ora doi")
    note: 'Getallen met een vrouwelijke vorm krijgen die meestal bij een vrouwelijk zelfstandig naamwoord (*doi* → *două* bij een vrouwelijk woord als *ora*), maar *unu* is bij de tijd de enige uitzondering: het is altijd *ora unu*, nooit *ora una*, ook al is *ora* vrouwelijk.'
  ro.a1.unit04.lesson01.teach.ora_trei:
    title: Drie uur
    gloss: drie uur
    note: Trei verandert helemaal niet naar geslacht, anders dan unu/una of doi/două. Weer een ding minder om te onthouden.
  ro.a1.unit04.lesson01.teach.jumatate:
    title: Half
    gloss: half / de helft
    note: 'Wordt met și (en) gebruikt om ''half over'' te zeggen: X și jumătate.'
    example_gloss: Half twee.
  ro.a1.unit04.lesson01.teach.ora_unu_jumatate:
    title: Half twee
    gloss: Het is half twee.
    note: Letterlijk 'Het is één en een half'. Het Roemeens telt dus vanaf het uur dat net voorbij is, niet naar het volgende uur toe zoals wij in het Nederlands doen.
  ro.a1.unit04.lesson01.teach.cat_e_ora:
    title: Naar de tijd vragen
    gloss: Hoe laat is het?
    note: 'De gewone manier om naar de tijd op de klok te vragen: cât (hoeveel, verwant aan câți uit Unit 2) + este + ora (het uur).'
  ro.a1.unit04.lesson02.teach.sfert:
    title: Een kwartier
    gloss: een kwartier
    note: Een kwartier is 15 minuten. Het combineert met și (en) of fără (zonder) voor kwart over of kwart voor.
    example_gloss: Het is kwart over één.
  ro.a1.unit04.lesson02.teach.sfert_rule:
    title: și vs. fără bij een kwart of een half
    gloss: și un sfert = +15 minuten · fără un sfert = −15 minuten
    note: '*Și* (en) telt minuten op bij het uur dat net voorbij is; *fără* (zonder) telt minuten terug vanaf het uur dat nog komt. Dat is precies de logica van ''over'' en ''voor'' in het Nederlands bij kwart over en kwart voor.'
  ro.a1.unit04.lesson02.teach.ora_doua_sfert:
    title: Kwart over twee
    gloss: Het is kwart over twee.
    note: Ora două (2:00) plus și un sfert (+15 minuten) = 2:15.
  ro.a1.unit04.lesson02.teach.fara:
    title: Zonder / voor
    gloss: zonder / voor
    note: Telt minuten terug vanaf het VOLGENDE uur, dezelfde rol als 'voor' in het Nederlandse 'kwart voor drie'.
    example_gloss: Het is kwart voor drie.
  ro.a1.unit04.lesson02.teach.ora_trei_fara_sfert:
    title: Kwart voor drie
    gloss: Het is kwart voor drie.
    note: Ora trei (3:00) min fără un sfert (−15 minuten) = 2:45. Het Roemeens noemt het uur waar je naartoe telt, niet het uur dat net voorbij is.
  ro.a1.unit04.lesson02.teach.la_ce_ora:
    title: Vragen hoe laat
    gloss: Hoe laat?
    note: 'La (om) + ce (welke) + oră (een uur, hier de onbepaalde vorm in plaats van ora): de gewone manier om te vragen wanneer iets gebeurt.'
  ro.a1.unit04.lesson02.teach.la_ora_noua:
    title: Zeggen wanneer iets gebeurt
    gloss: Om negen uur.
    note: 'La (om) + ora (het uur, hier de bepaalde vorm) + het getal: het antwoordpatroon op ''La ce oră?''.'
  ro.a1.unit04.lesson02.teach.tarziu:
    title: Laat
    gloss: laat
    note: Een handig woord om te reageren als je op de tijd let.
    example_gloss: Het is laat!
  ro.a1.unit04.lesson03.teach.cand:
    title: 'Herhaling: când'
    gloss: wanneer?
    note: Când kwam al voor in Unit 3 om te vragen wanneer een gebeurtenis plaatsvindt. Nu komt het terug om te vragen wanneer iets begint.
  ro.a1.unit04.lesson03.teach.zi_parts:
    title: Dagdelen
    gloss: '''s ochtends / ''s middags / ''s avonds / ''s nachts'
    note: Elk van deze woorden is de bepaalde vorm van het zelfstandig naamwoord, gebruikt als bijwoord. Het Roemeens zegt 's ochtends' zo eenvoudig, zonder voorzetsel, ongeveer zoals wij 's ochtends zeggen.
    example_gloss:
    - De les is 's ochtends.
    - De les is 's middags.
    - Mihai werkt 's avonds.
    - Ana slaapt 's nachts.
  ro.a1.unit04.lesson03.teach.cursul:
    title: De les
    gloss: de les / de cursus
    note: De bepaalde vorm van curs (een les of cursus). Hier gaat het om de Roemeense les van Ana en Mihai.
    example_gloss: De les begint om negen uur.
  ro.a1.unit04.lesson03.teach.incepe:
    title: Begint
    gloss: begint
    note: 'De tegenwoordige tijd voor hij, zij of het: elk enkelvoudig onderwerp dat niet ik of jij is, zoals cursul (de les).'
    example_gloss: De les begint 's ochtends.
  ro.a1.unit04.lesson03.teach.cand_incepe_cursul:
    title: Vragen wanneer de les begint
    gloss: Wanneer begint de les?
    note: Combineert când met de nieuwe woorden începe en cursul uit deze les.
  ro.a1.unit04.lesson03.teach.raspuns_curs:
    title: Zeggen wanneer de les begint
    gloss: De les begint om negen uur 's ochtends.
    note: Een bijwoordelijke bepaling (dimineața) achteraan, met een komma ervoor, zoals in Unit 3 een datum na een weekdag werd gezet.
  ro.a1.unit04.lesson03.teach.line01:
    title: Vragen wanneer de les begint
    gloss: Ana vraagt Mihai wanneer de les begint.
    note: 'Een gewone, neutrale vraag: este en începe veranderen niet bij tu of dumneavoastră.'
  ro.a1.unit04.lesson03.teach.line02:
    title: De tijd zeggen
    gloss: Mihai zegt dat de les om negen uur 's ochtends begint.
    note: Mihai gebruikt precies het patroon van deze les voor tijd en dagdeel.
  ro.a1.unit04.lesson03.teach.line03:
    title: Bevestigen en afsluiten
    gloss: Ana bedankt hem en zegt gedag.
    note: La revedere, geleerd in Unit 1, sluit het gesprek af zoals altijd.
  ro.a1.unit04.lesson03.teach.line04:
    title: De ontmoeting afsluiten
    gloss: Mihai zegt gedag terug, met Ana's naam.
    note: La revedere herhalen met de naam van de ander is een natuurlijke, vriendelijke afsluiting.
