answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (vreme, soare, cald, plouă, vânt, frig) is used only in person-invariant impersonal constructions ("Este soare," "Plouă," "Este vânt," "Este frig," "Cum este vremea?") with no register distinction of any kind. No new tu/ dumneavoastră form is introduced this unit; Ana and Mihai keep their existing formal register with each other in the dialogue's greeting/closing lines.
course:
  title: Roemeens A1
  description: Het weer beschrijven in het Roemeens -- Vreme (weer), Soare (zon/zonnig), Cald (warm), Plouă (het regent), Vânt (wind) en Frig (koud) -- terwijl Ana en Mihai de weersverwachting voor morgen bekijken en beslissen wanneer ze naar het park gaan.
units:
  ro.a1.unit19.weather:
    title: Weer
lessons:
  ro.a1.unit19.lesson01.vremea_de_azi:
    title: Het weer van vandaag
  ro.a1.unit19.lesson02.vremea_de_maine:
    title: Het weer van morgen
  ro.a1.unit19.lesson03.planul_de_sambata:
    title: Het plan voor zaterdag
teaching:
  ro.a1.unit19.lesson01.teach.reminder_ana_este:
    title: 'Herhaling: Ana, Este, Și'
    gloss: Ana (naam) · Este (is) · Și (en)
    note: Ana is de naam van het personage, al sinds Unit 1; *este* komt uit de plaatsen-woordenschat van Unit 8; *și* komt uit Unit 5 -- in deze unit gebruik je alle drie opnieuw om het weer van vandaag te beschrijven.
  ro.a1.unit19.lesson01.teach.reminder_astazi:
    title: 'Herhaling: Astăzi'
    gloss: Astăzi (vandaag)
    note: Uit de datumwoordenschat van Unit 3 -- hier opnieuw gebruikt om over het weer van vandaag te praten.
  ro.a1.unit19.lesson01.teach.vreme_vocab:
    title: Weer
    gloss: Vreme (weer)
    note: '*Vremea* is de bepaalde vorm van *vreme* -- ''het weer'': een vrouwelijk zelfstandig naamwoord op -e krijgt er -a bij, zoals *baie* → *baia* (de badkamer) in Unit 18.'
    example_gloss:
    - Hoe is het weer?
  ro.a1.unit19.lesson01.teach.cum_este_vremea_phrase:
    title: Hoe is het weer?
    gloss: Cum este vremea? (Hoe is het weer?)
    note: Zo vraag je gewoonlijk naar het weer -- *cum* ken je uit Unit 1, Unit 9 en Unit 12.
  ro.a1.unit19.lesson01.teach.soare_vocab:
    title: Zon / zonnig
    gloss: Soare (zon / zonnig)
    note: 'Wordt met *este* gebruikt om zonnig weer te beschrijven: *Este soare* is letterlijk ''het is zon'', dus ''het is zonnig''.'
    example_gloss:
    - Vandaag is het zonnig.
  ro.a1.unit19.lesson01.teach.cald_vocab:
    title: Warm / heet
    gloss: Cald (warm / heet)
    note: Een onveranderlijk weerwoord -- bij *Este cald* gebruik je altijd dezelfde vorm, zonder congruentie.
    example_gloss:
    - Vandaag is het warm.
  ro.a1.unit19.lesson01.teach.astazi_soare_cald_phrase:
    title: Vandaag is het zonnig. Het is warm.
    gloss: Astăzi este soare. Este cald.
    note: Alle woorden hier heb je al geleerd of zojuist leren kennen, gecombineerd tot twee nieuwe zinnen over het weer van vandaag.
  ro.a1.unit19.lesson02.teach.reminder_mihai_maine:
    title: 'Herhaling: Mihai, Mâine'
    gloss: Mihai (naam) · Mâine (morgen)
    note: Mihai is de naam van het personage, al sinds Unit 1; *mâine* komt uit Unit 3 en Unit 12 -- in deze unit gebruik je beide opnieuw voor de weersverwachting van morgen.
  ro.a1.unit19.lesson02.teach.reminder_nu_mergem_la_parc:
    title: 'Herhaling: Nu, Mergem, La parc'
    gloss: Nu (nee / niet) · Mergem (we gaan) · La parc (naar het park)
    note: Allemaal uit de woordenschat van Unit 11 over plannen maken -- hier opnieuw gebruikt om te beslissen of het weer een uitstapje naar het park toelaat.
  ro.a1.unit19.lesson02.teach.ploua_vocab:
    title: Het regent
    gloss: Plouă (het regent)
    note: Een onpersoonlijke werkwoordsvorm -- je hebt geen onderwerp nodig, net zoals *Este cald* er geen nodig heeft.
    example_gloss:
    - Morgen regent het.
  ro.a1.unit19.lesson02.teach.vant_vocab:
    title: Wind
    gloss: Vânt (wind)
    note: 'Wordt met *este* gebruikt, net als *soare*: *Este vânt*, ''het waait''.'
    example_gloss:
    - Morgen waait het.
  ro.a1.unit19.lesson02.teach.frig_vocab:
    title: Koud
    gloss: Frig (koud)
    note: 'Wordt met *este* gebruikt: *Este frig*, ''het is koud''.'
    example_gloss:
    - Morgen is het koud.
  ro.a1.unit19.lesson02.teach.maine_ploua_phrase:
    title: Morgen regent het. Het waait en het is koud.
    gloss: Mâine plouă. Este vânt și este frig.
    note: Alle woorden hier heb je al geleerd of zojuist leren kennen, gecombineerd tot een complete voorspelling voor morgen.
  ro.a1.unit19.lesson02.teach.nu_mergem_phrase:
    title: Morgen gaan we niet naar het park.
    gloss: Nu mergem la parc mâine. (Morgen gaan we niet naar het park.)
    note: Het weersafhankelijke plan waar deze les naartoe werkt -- het gebruikt *mergem*/*la parc* uit Unit 11 met *nu* ervoor.
  ro.a1.unit19.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Herhaling: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (hoi) · Ce mai faceți? (hoe gaat het, formeel) · Bine, mulțumesc (goed, dank je)
    note: Allemaal uit de openingsbegroeting van Unit 1, hier opnieuw gebruikt om het dialoog van deze unit te beginnen.
  ro.a1.unit19.lesson03.teach.reminder_sambata_la_revedere:
    title: 'Herhaling: Sâmbătă, La revedere'
    gloss: Sâmbătă (zaterdag) · La revedere (tot ziens)
    note: '*Sâmbătă* komt uit Unit 3, Unit 11 en Unit 12; *la revedere* komt uit Unit 1 -- beide worden hergebruikt in het dialoog over het weekendplan.'
  ro.a1.unit19.lesson03.teach.line01:
    title: Begroet Mihai en vraag hoe het met hem gaat
    gloss: Ana begroet Mihai en vraagt hoe het met hem gaat.
    note: Gebruikt de begroeting *Ce mai faceți?* uit Unit 1 opnieuw.
  ro.a1.unit19.lesson03.teach.line02:
    title: Antwoord en vraag naar het weer van morgen
    gloss: Mihai antwoordt en vraagt Ana hoe het weer morgen wordt.
    note: Combineert *Bine, mulțumesc* uit Unit 1 met de zin *Cum este vremea?* uit les 1 van deze unit, aangevuld met *mâine*.
  ro.a1.unit19.lesson03.teach.line03:
    title: Beschrijf de verwachting voor morgen
    gloss: Ana zegt dat het gaat regenen, waaien en koud wordt.
    note: Gebruikt de zin uit les 2 van deze unit precies zo opnieuw.
  ro.a1.unit19.lesson03.teach.line04:
    title: Stel voor om niet naar het park te gaan, maar op zaterdag
    gloss: Mihai zegt dat ze morgen niet naar het park gaan en vraagt of zaterdag kan.
    note: Combineert de zin uit les 2 van deze unit met *mergem* uit Unit 11 en *sâmbătă* uit deze unit.
  ro.a1.unit19.lesson03.teach.line05:
    title: Stem in en wijs op het zonnige weer van zaterdag
    gloss: Ana zegt dat het zaterdag zonnig wordt en stemt in met het plan.
    note: Combineert *soare* met de instemmingszin *Da, bine!* uit Unit 11.
  ro.a1.unit19.lesson03.teach.line06:
    title: Zeg tot ziens
    gloss: Mihai zegt tot ziens.
    note: Hetzelfde slotpatroon waarmee elk dialoog in de eerdere units eindigde.
  ro.a1.unit19.lesson03.teach.line07:
    title: Zeg tot ziens
    gloss: Ana zegt tot ziens.
    note: Hetzelfde slotpatroon waarmee elk dialoog in de eerdere units eindigde.
