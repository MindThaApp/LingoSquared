    gloss: Ana belt Mihai elke dag. Ze gebruikt haar telefoon, geen app. Mihai heeft thuis geen computer, maar hij gebruikt internet op zijn telefoon. Andrei zoekt elke ochtend de weersverwachting op. Daarna gaat hij hardlopen. Elena stuurt Ana vaak een bericht. Gebruik jij je telefoon ook elke dag?
