answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (mic/mică, mai, decât) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing polite register with each other, matching every earlier unit; no new second-person form is introduced here (unlike unit13's Vă place...?).
course:
  title: Roemeens A1
  description: Vertrouwde dingen vergelijken in het Roemeens -- Mare (groot), Mic/Mică (klein) en de vergelijking met Mai ... decât (meer/-er ... dan) -- terwijl Ana en Mihai de grootte van hun koffie, thee en brood vergelijken.
units:
  ro.a1.unit14.comparisons:
    title: Vergelijkingen
lessons:
  ro.a1.unit14.lesson01.mare_mic:
    title: Groot, klein
  ro.a1.unit14.lesson02.mai_mare_mai_mica:
    title: Groter, kleiner
  ro.a1.unit14.lesson03.cafeaua_mai_mare:
    title: Wat is groter?
teaching:
  ro.a1.unit14.lesson01.teach.reminder_mare:
    title: 'Herhaling: mare'
    gloss: mare (groot)
    note: 'Al behandeld in Unit 3 ("literă mare", hoofdletter) en Unit 5 ("o familie mare", een grote familie) -- hier krijgt het een echte tegenhanger: *mic/mică*.'
  ro.a1.unit14.lesson01.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Herhaling: cafeaua, ceaiul, pâinea, cafea, ceai'
    gloss: cafeaua (de koffie) · ceaiul (de thee) · pâinea (het brood) · cafea (koffie) · ceai (thee)
    note: Allemaal uit Unit 6/Unit 13 -- in deze unit gebruik je de bepaalde vormen voor de dingen die je qua grootte vergelijkt, en de onbepaalde vormen komen terug in de koppeloefening van deze les.
  ro.a1.unit14.lesson01.teach.mic_mica_vocab:
    title: Klein
    gloss: Mic (klein, m./o.) · Mică (klein, v.)
    note: Roemeense bijvoeglijke naamwoorden congrueren met het zelfstandig naamwoord dat ze beschrijven -- *ceai* (thee) krijgt de mannelijke/onzijdige vorm *mic*, terwijl *cafea* (koffie) en *pâine* (brood) vrouwelijk zijn en *mică* krijgen. *Mare* (groot) heeft in het enkelvoud dezelfde vorm voor mannelijk en vrouwelijk, daarom was die splitsing daar niet nodig.
    example_gloss:
    - De thee is klein.
    - De koffie is klein.
  ro.a1.unit14.lesson01.teach.ceaiul_e_mic_phrase:
    title: De thee is klein
    gloss: Ceaiul e mic. (De thee is klein.)
    note: '*Ceaiul* is onzijdig, dus krijgt het de mannelijke/onzijdige vorm *mic*.'
  ro.a1.unit14.lesson01.teach.cafeaua_e_mica_phrase:
    title: De koffie is klein
    gloss: Cafeaua e mică. (De koffie is klein.)
    note: '*Cafeaua* is vrouwelijk, dus krijgt het de vrouwelijke vorm *mică*.'
  ro.a1.unit14.lesson01.teach.painea_e_mica_phrase:
    title: Het brood is klein
    gloss: Pâinea e mică. (Het brood is klein.)
    note: '*Pâinea* is ook vrouwelijk, dus krijgt het *mică*, net als *cafeaua*.'
  ro.a1.unit14.lesson02.teach.reminder_mare_mic_mica:
    title: 'Herhaling: Mare, Mic, Mică'
    gloss: Mare (groot) · Mic (klein, m./o.) · Mică (klein, v.)
    note: Allemaal uit les 1 van deze unit -- hier krijgen ze een vergrotende trap.
  ro.a1.unit14.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Herhaling: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (de koffie) · ceaiul (de thee) · pâinea (het brood)
    note: Allemaal uit Unit 13, hier opnieuw gebruikt als de dingen die je vergelijkt.
  ro.a1.unit14.lesson02.teach.mai_vocab:
    title: Meer / -er
    gloss: Mai (meer / -er, vergrotende trap)
    note: 'Niet de maand *mai* (mei, Unit 3). Het is hetzelfde woordje als in ''Ce mai faceți?'' (Unit 1), maar hier heeft het een andere taak als vergelijkingswoord: zet *mai* voor een bijvoeglijk naamwoord voor ''meer ___'' of ''___er''; zo maak je in het Roemeens een vergelijking.'
    example_gloss:
    - De koffie is groter.
  ro.a1.unit14.lesson02.teach.mai_mare_phrase:
    title: De koffie is groter
    gloss: Cafeaua e mai mare. (De koffie is groter.)
    note: '*Mai* + het bijvoeglijk naamwoord -- verder verandert er niets.'
  ro.a1.unit14.lesson02.teach.decat_vocab:
    title: Dan
    gloss: Decât (dan)
    note: Maakt de vergelijking af -- *mai* + bijvoeglijk naamwoord + *decât* + het tweede ding waarmee je vergelijkt.
    example_gloss:
    - De koffie is groter dan de thee.
  ro.a1.unit14.lesson02.teach.mai_mare_decat_phrase:
    title: De koffie is groter dan de thee
    gloss: Cafeaua e mai mare decât ceaiul. (De koffie is groter dan de thee.)
    note: 'Het volledige patroon van de vergelijking: [ding] + e + mai + [bijvoeglijk naamwoord] + decât + [tweede ding].'
  ro.a1.unit14.lesson02.teach.mai_mica_decat_phrase:
    title: Het brood is kleiner dan de koffie
    gloss: Pâinea e mai mică decât cafeaua. (Het brood is kleiner dan de koffie.)
    note: Hetzelfde patroon met *mică*, de vrouwelijke vorm van 'klein' uit les 1 van deze unit.
  ro.a1.unit14.lesson03.teach.reminder_mai_decat_mare_mic_mica:
    title: 'Herhaling: Mai, Decât, Mare, Mic, Mică'
    gloss: Mai (meer/-er) · Decât (dan) · Mare (groot) · Mic (klein, m./o.) · Mică (klein, v.)
    note: Allemaal uit les 1 en 2 van deze unit -- hier gebruiken Ana en Mihai ze samen.
  ro.a1.unit14.lesson03.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Herhaling: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (de koffie) · ceaiul (de thee) · pâinea (het brood)
    note: Allemaal uit Unit 13 -- de drie dingen die Ana en Mihai vergelijken.
  ro.a1.unit14.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Herhaling: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (hallo) · mulțumesc (bedankt) · la revedere (tot ziens) · Ana, Mihai (namen)
    note: 'Allemaal al eerder behandeld: hetzelfde vriendelijke begin- en eindpatroon dat elke dialoog in deze cursus tot nu toe heeft gebruikt.'
  ro.a1.unit14.lesson03.teach.line01:
    title: Begroeten en naar de grootte vragen
    gloss: Mihai begroet Ana en vraagt of de koffie groot of klein is.
    note: Gebruikt de nieuwe *mare sau mică* (groot of klein) van deze unit om een vraag over grootte te openen, dezelfde keuzevraag 'X sau Y?' die Unit 13 met *cafea sau ceai?* al heeft geïntroduceerd.
  ro.a1.unit14.lesson03.teach.line02:
    title: De grootte van beide drankjes beschrijven
    gloss: Ana zegt dat de koffie groot is en de thee klein.
    note: 'Stelt gewoon een feit over grootte vast, geen voorkeur: in deze dialoog zegt niemand wie welk drankje wil of bestelt, alleen hoe groot elk drankje is.'
  ro.a1.unit14.lesson03.teach.line03:
    title: Om bevestiging van de vergelijking vragen
    gloss: Mihai vraagt of de koffie groter is dan de thee.
    note: Maakt van Ana's twee losse feiten uit de vorige regel een directe vergelijking met *mai mare decât*, de kernconstructie van deze unit.
  ro.a1.unit14.lesson03.teach.line04:
    title: Bevestigen en het brood toevoegen
    gloss: Ana bevestigt het en zegt dan dat het brood kleiner is dan de koffie.
    note: 'Gebruikt *mai ... decât* opnieuw met het derde item, *pâinea*, nu met de vorm voor ''kleiner'': *mai mică*.'
  ro.a1.unit14.lesson03.teach.line05:
    title: Bevestigen, bedanken en afscheid nemen
    gloss: Mihai bevestigt dat het brood klein is, bedankt Ana en zegt tot ziens.
    note: Hetzelfde afsluitende patroon waarmee de dialoog van elke eerdere unit eindigde.
  ro.a1.unit14.lesson03.teach.line06:
    title: Het gesprek afsluiten
    gloss: Ana zegt ook tot ziens, met Mihai's naam erbij.
    note: Hetzelfde vriendelijke afsluitende patroon waarmee de dialoog van elke eerdere unit eindigde.
