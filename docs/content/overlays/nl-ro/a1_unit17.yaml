teaching:
  ro.a1.unit17.lesson01.teach.reminder_este_la_mihai:
    title: 'Herhaling: este, la, Mihai'
    gloss: este (is) · la (bij) · Mihai (naam)
    note: Este komt uit Les 3/Les 4/Les 8; la komt uit *la ora nouă* (om negen uur) in Les 4; Mihai is de naam van het personage, al sinds Les 1 bekend. In deze les gebruik je alle drie opnieuw om over zijn werk te praten.
  ro.a1.unit17.lesson01.teach.reminder_lucrez_lucreaza:
    title: 'Herhaling: lucrez, lucrează'
    gloss: lucrez (ik werk) · lucrează (hij/zij werkt)
    note: Beide komen uit de dagelijkse routine van Les 10 (*Lucrez seara.*). In deze les gebruik je ze voor beroepen in plaats van voor het moment van de dag.
  ro.a1.unit17.lesson01.teach.inginer_vocab:
    title: Ingenieur
    gloss: ingenieur
    note: Mannelijk. Alleen Mihai gebruikt het woord in deze les (*Sunt inginer*), dus een vrouwelijke vorm is nog niet nodig.
    example_gloss:
    - Mihai is ingenieur.
  ro.a1.unit17.lesson01.teach.birou_vocab:
    title: Kantoor
    gloss: kantoor
    note: De werkplek van Mihai, met het voorzetsel *la* (bij/op) dat je al kent uit Les 4.
    example_gloss:
    - Hij werkt op kantoor.
  ro.a1.unit17.lesson01.teach.mihai_este_inginer_lucreaza_la_birou_phrase:
    title: Mihai is ingenieur. Hij werkt op kantoor.
    gloss: Mihai is ingenieur. Hij werkt op kantoor.
    note: Elk woord hier heb je al geleerd of is net nieuw. Ze zijn gecombineerd tot twee nieuwe zinnen over het werk van Mihai.
  ro.a1.unit17.lesson02.teach.reminder_sunt_unde_ana:
    title: 'Herhaling: sunt, unde, Ana'
    gloss: sunt (ik ben) · unde (waar) · Ana (naam)
    note: Sunt komt uit Les 16 (*Sunt bolnav*); unde uit Les 7/Les 8 (*Unde pot să cumpăr...?*, *Unde este...?*); Ana is de naam van het personage, al sinds Les 1 bekend. In deze les gebruik je alle drie opnieuw om over het werk van Ana te praten.
  ro.a1.unit17.lesson02.teach.profesoara_vocab:
    title: Lerares
    gloss: lerares
    note: Vrouwelijk. Alleen Ana gebruikt het woord in deze les (*Sunt profesoară*), dus een mannelijke vorm is nog niet nodig.
    example_gloss:
    - Ik ben lerares.
  ro.a1.unit17.lesson02.teach.scoala_vocab:
    title: School
    gloss: school
    note: De werkplek van Ana. Je gebruikt *la* op dezelfde manier als in *la birou*.
    example_gloss:
    - Ik werk op school.
  ro.a1.unit17.lesson02.teach.sunt_profesoara_lucrez_la_scoala_phrase:
    title: Ik ben lerares. Ik werk op school.
    gloss: Sunt profesoară. Lucrez la școală.
    note: Ana's eigen uitspraak over haar werk. Ze combineert de twee nieuwe woorden van deze les met *sunt* uit Les 16.
  ro.a1.unit17.lesson02.teach.unde_lucrati_phrase:
    title: Waar werkt u?
    gloss: Waar werkt u?
    note: '*Lucrați* is de beleefde vorm voor ''u werkt''. Het heeft dezelfde uitgang -ați/-eți als *aveți* en *faceți*. Handig om iedereen naar zijn of haar werk te vragen.'
  ro.a1.unit17.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Herhaling: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (hoi) · Ce mai faceți? (hoe gaat het met u?) · Bine, mulțumesc (goed, dank u)
    note: Alles uit de openingsgroet van Les 1, hier opnieuw gebruikt om het dialoog van deze les te beginnen.
  ro.a1.unit17.lesson03.teach.reminder_si_dumneavoastra_la_revedere:
    title: 'Herhaling: Și dumneavoastră?, La revedere'
    gloss: Și dumneavoastră? (en u?) · La revedere (tot ziens)
    note: Beide uit Les 1, hier opnieuw gebruikt als vanzelfsprekende vervolgvraag en als afsluiting.
  ro.a1.unit17.lesson03.teach.line01:
    title: Begroet hem en vraag hoe het gaat
    gloss: Ana begroet Mihai en vraagt hoe het met hem gaat.
    note: Gebruikt de groet *Ce mai faceți?* uit Les 1 opnieuw.
  ro.a1.unit17.lesson03.teach.line02:
    title: Antwoord en vraag waar zij werkt
    gloss: Mihai antwoordt en vraagt Ana dan waar zij werkt.
    note: Combineert *Bine, mulțumesc* uit Les 1 met *Unde lucrați?* uit deze les.
  ro.a1.unit17.lesson03.teach.line03:
    title: Zeg wat je beroep en werkplek zijn en vraag het dan terug
    gloss: Ana zegt dat ze als lerares op een school werkt en stelt Mihai dezelfde vraag.
    note: Combineert de zin uit het tweede deel van deze les met *Și dumneavoastră?* uit Les 1.
  ro.a1.unit17.lesson03.teach.line04:
    title: Zeg wat je beroep en werkplek zijn
    gloss: Mihai zegt dat hij als ingenieur op een kantoor werkt.
    note: Gebruikt de zin uit het eerste deel van deze les bijna precies opnieuw.
  ro.a1.unit17.lesson03.teach.line05:
    title: Sluit het gesprek af
    gloss: Ana neemt afscheid.
    note: Hetzelfde slotpatroon waarmee elk eerder dialoog eindigde.
  ro.a1.unit17.lesson03.teach.line06:
    title: Neem afscheid
    gloss: Mihai neemt afscheid.
    note: Hetzelfde slotpatroon waarmee elk eerder dialoog eindigde.
