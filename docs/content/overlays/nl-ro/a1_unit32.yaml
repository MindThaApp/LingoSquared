  ro.a1.unit32.lesson06.nina_si_pasarea_ei:
    title: Nina's vogel
teaching:
  ro.a1.unit32.lesson01.teach.animalul_un_animal:
    title: Dier, een huisdier
    gloss: het dier / een huisdier
    note: '*Animal* is het algemene woord; *animal de companie* ("gezelschapsdier") betekent specifiek huisdier. Het meervoud is *animale* (*un animal*, *două animale*).'
    example_gloss:
    - Een hond is een dier.
    - Een hond is ook een huisdier.
  ro.a1.unit32.lesson01.teach.cainele_pisica:
    title: Hond en kat
    gloss: de hond / de kat
    example_gloss:
    - Ana heeft een hond.
    - Andrei heeft een kat.
  ro.a1.unit32.lesson01.teach.pestele_pasarea:
    title: Vis en vogel
    gloss: de vis / de vogel
    example_gloss:
    - Opa heeft een vis.
    - Nina heeft een vogel.
  ro.a1.unit32.lesson01.teach.ai_un_animal:
    title: Heb je een huisdier?
    gloss: Heb je een huisdier?
    note: 'Hetzelfde vraagpatroon *Ai ...?* dat je al kent: *a avea* (hebben) + een zelfstandig naamwoord.'
  ro.a1.unit32.lesson01.teach.da_am_un:
    title: Ja, ik heb een hond
    gloss: Ja, ik heb een hond.
    note: Een eenvoudig bevestigend antwoord met de nieuwe woorden uit deze les.
  ro.a1.unit32.lesson01.teach.nu_nu_am:
    title: Nee, ik heb geen huisdier
    gloss: Nee, ik heb geen huisdier.
    note: Na *nu am* ontkent *niciun* ("geen enkele") het zelfstandig naamwoord; zie de grammaticanotitie.
  ro.a1.unit32.lesson01.teach.la_negatie_nu:
    title: 'Nu am: geen lidwoord'
    gloss: 'Na nu am gebruik je geen un of o: Nu am timp, nu am niciun animal de companie.'
    note: 'Hetzelfde patroon als bij *Nu am timp*: geen nieuwe grammatica, alleen een nieuw zelfstandig naamwoord.'
  ro.a1.unit32.lesson02.teach.a_scoate_la:
    title: Een dier uitlaten
    gloss: uitlaten (een dier)
    note: '*A scoate la plimbare* is een vaste uitdrukking; zie de grammaticanotitie.'
    example_gloss: Ik laat elke dag de hond uit.
  ro.a1.unit32.lesson02.teach.verbul_se_schimba:
    title: Het werkwoord verandert met de persoon
    gloss: 'Het werkwoord verandert met de persoon: eu scot, tu scoți, el scoate (ik laat, jij laat, hij laat) de hond uit.'
    note: 'Roemeense werkwoorden veranderen van uitgang per persoon, dus *a scoate la plimbare* wordt als één werkwoord vervoegd: *scot*, *scoți*, *scoate*.'
  ro.a1.unit32.lesson02.teach.a_da_de:
    title: Voeren
    gloss: te eten geven
    example_gloss: Ik geef elke dag de kat te eten.
  ro.a1.unit32.lesson02.teach.a_se_juca:
    title: Spelen met
    gloss: spelen met
    example_gloss: Andrei speelt met zijn kat.
  ro.a1.unit32.lesson02.teach.scot_cainele_la:
    title: Ik laat de hond elke dag uit
    gloss: Ik laat elke dag de hond uit.
    note: Combineert *a scoate la plimbare* met *în fiecare zi* (elke dag), dat je al kent uit een eerdere unit.
  ro.a1.unit32.lesson02.teach.dau_de_mancare:
    title: Ik geef de kat elke dag te eten
    gloss: Ik geef elke dag de kat te eten.
    note: 'Combineert *a da de mâncare* met *în fiecare zi*; het dier staat in de datief: *pisicii*.'
  ro.a1.unit32.lesson03.teach.plural_caine_caini:
    title: 'Plural: câine → câini'
    gloss: 'Meervoud: câine → câini, animal → animale, pisică → pisici.'
    note: Het regelmatige Roemeense meervoudspatroon, hier voor het eerst geïntroduceerd met dierennamen als voorbeelden.
  ro.a1.unit32.lesson03.teach.caini_pisici:
    title: Honden en katten
    gloss: honden / katten
    example_gloss:
    - Mihai houdt van honden.
    - Elena houdt van katten.
  ro.a1.unit32.lesson03.teach.pesti_pasari:
    title: Vissen en vogels (meervoud)
    gloss: vissen / vogels
    example_gloss:
    - Ik hou van vissen.
    - Opa houdt van vogels.
  ro.a1.unit32.lesson03.teach.iubesc_animalele:
    title: Ik hou van dieren
    gloss: Ik hou van dieren.
    note: '*A iubi* ("houden van") neemt zijn lijdend voorwerp zonder voorzetsel: *Iubesc animalele*; het lidwoord *-le* laat zien dat we dieren in het algemeen bedoelen.'
  ro.a1.unit32.lesson03.teach.elena_iubeste_pisicile:
    title: Elena houdt van katten, maar heeft geen huisdier
    gloss: Elena houdt van katten, maar ze heeft geen huisdier.
    note: Bereidt het contrast voor waar de leestekst van deze les om draait.
  ro.a1.unit32.lesson04.teach.mihai_ai_un:
    title: Mihai vraagt naar een huisdier
    gloss: 'Mihai: Heb je een huisdier, Ana?'
  ro.a1.unit32.lesson04.teach.ana_da_am:
    title: Ana heeft een hond
    gloss: 'Ana: Ja, ik heb een hond.'
  ro.a1.unit32.lesson04.teach.mihai_cum_arata:
    title: Mihai vraagt hoe hij eruitziet
    gloss: 'Mihai: Hoe ziet hij eruit?'
    note: Dezelfde vraag *Cum arată ...?* als in de unit over uiterlijk, nu gesteld over een dier.
  ro.a1.unit32.lesson04.teach.ana_are_blana:
    title: Ana beschrijft haar hond
    gloss: 'Ana: Hij heeft bruine vacht en hij is klein.'
    note: Hier komen de woorden voor haarkleur en grootte uit de les over uiterlijk terug, nu om de vacht van een dier te beschrijven in plaats van het haar van een persoon.
  ro.a1.unit32.lesson04.teach.pentru_un_animal:
    title: El en ea voor dieren
    gloss: 'Voor een dier gebruik je el of ea, afhankelijk van het geslacht van het woord: câinele is el, pisica is ea.'
    note: Tot nu toe verwezen *el* en *ea* in deze cursus naar personen; hier gelden ze ook voor dieren, volgens het grammaticale geslacht van het woord.
  ro.a1.unit32.lesson04.teach.mihai_il_scoti:
    title: Mihai vraagt naar de wandelingen
    gloss: 'Mihai: Laat je hem elke dag uit?'
  ro.a1.unit32.lesson04.teach.ana_da_il:
    title: Ana vertelt over haar dagelijkse routine
    gloss: 'Ana: Ja, ik laat hem elke dag uit en ik geef hem te eten.'
  ro.a1.unit32.lesson05.teach.mihai_si_elena:
    title: Mihai, Elena en Andrei over dieren
    gloss: 'Mihai en Elena houden allebei van dieren, maar geen van beiden heeft een huisdier. Mihai houdt van honden en Elena houdt van katten. Andrei heeft wel een huisdier: een kat. Hij speelt vaak met zijn kat en geeft hem elke dag te eten. Heb jij een huisdier?'
    note: 'Zet van dieren houden tegenover er echt een hebben: dat is het communicatieve doel van deze les.'
    glosses:
      iubesc: houden van
      amândoi: beide
      animalele: dieren
      doi: beide
      companie: huisdier
      câinii: honden
      pisicile: katten
      pisică: kat
      joacă: speelt
      dă: geeft
      fiecare: elke
      mâncare: voer
  ro.a1.unit32.lesson05.teach.andrei_se_joaca:
    title: Andrei speelt vaak met zijn kat
    gloss: Andrei speelt vaak met zijn kat.
    note: '*Des* (vaak) is het frequentiewoord uit de unit over hobby''s; *a se juca cu* ("spelen met") is een wederkerend werkwoord.'
  ro.a1.unit32.lesson05.teach.iubesc_cainii_nu:
    title: Ik hou van honden. Ik heb geen huisdier.
    gloss: Ik hou van honden. Ik heb geen huisdier.
    note: Een voorbeeldantwoord van twee zinnen, dat je kunt hergebruiken voor de schrijfopdracht van deze les.
  ro.a1.unit32.lesson06.teach.ana_nina_ai:
    title: Ana vraagt het aan Nina
    gloss: 'Ana: Nina, heb jij ook een huisdier?'
  ro.a1.unit32.lesson06.teach.nina_da_am:
    title: Nina heeft een vogel die Pico heet
    gloss: 'Nina: Ja, ik heb een vogel. Hij heet Pico.'
    note: '*O cheamă* ("heet") gebruikt het werkwoord *a chema* voor namen, dat je al kent; een vogel is vrouwelijk (pasăre), dus het voornaamwoord is *o*.'
  ro.a1.unit32.lesson06.teach.mihai_ce_frumos:
    title: Mihai reageert
    gloss: 'Mihai: Wat leuk! Wat doe je elke dag met hem?'
  ro.a1.unit32.lesson06.teach.nina_ii_dau:
    title: Nina geeft hem elke dag te eten
    gloss: 'Nina: Ik geef hem elke dag te eten.'
  ro.a1.unit32.lesson06.teach.mihai_iubesc_si:
    title: Mihai houdt ook van vogels
    gloss: 'Mihai: Ik houd ook van vogels.'
  ro.a1.unit32.lesson06.teach.ana_ce_frumos:
    title: Ana sluit het gesprek af
    gloss: 'Ana: Wat fijn dat wij alle drie van dieren houden!'
    note: Rondt het gesprek af met wat alle drie de personages in deze les over dieren hebben verteld.
