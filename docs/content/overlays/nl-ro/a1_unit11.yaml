answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's new words are all register-neutral -- mergem (first-person plural) and nu pot (first-person singular) don't change with tu/dumneavoastră, and atunci/sigur are invariant connective/response words with no person marking. No new second-person forms are introduced. Ana and Mihai's closing dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08/unit09/unit10.
course:
  title: Roemeens A1
  description: 'Een eenvoudig plan voorstellen, accepteren, afslaan en inplannen in het Roemeens: mergem (laten we gaan / we gaan), nu pot (ik kan niet), atunci (dan / in dat geval) en sigur (zeker). Ana en Mihai spreken verder af om elkaar in het park te ontmoeten.'
units:
  ro.a1.unit11.plans:
    title: Plannen
lessons:
  ro.a1.unit11.lesson01.mergem_la_cinema:
    title: Zullen we naar de bioscoop gaan?
  ro.a1.unit11.lesson02.nu_pot_atunci:
    title: Ik kan niet. En dan?
  ro.a1.unit11.lesson03.planul_de_duminica:
    title: Het plan voor zondag
teaching:
  ro.a1.unit11.lesson01.teach.reminder_da_bine:
    title: 'Herhaling: da, bine, nu, mulțumesc'
    gloss: da (ja) · bine (goed) · nu (nee) · mulțumesc (dank je)
    note: Je kent deze woorden al sinds les 6. Hier combineer je ze om een plan te accepteren, en ze komen terug in de woordenschatoefening van deze les.
  ro.a1.unit11.lesson01.teach.mergem_vocab:
    title: Laten we gaan / we gaan
    gloss: laten we gaan / we gaan
    note: De eerste persoon meervoud van *a merge*, dat je al kent als *merg* (ik ga, les 10) en *mergeți* (de beleefde gebiedende wijs, les 9). Het is hetzelfde werkwoord in een andere persoon. Los gebruikt, met een stijgende intonatie, stel je er op een natuurlijke manier iets samen mee voor.
    example_gloss:
    - Zullen we naar de bioscoop gaan?
  ro.a1.unit11.lesson01.teach.cinema_vocab:
    title: De bioscoop
    gloss: de bioscoop
    note: Dit lijkt sterk op het Nederlandse 'cinema' (bijvoorbeeld in 'cinema' als filmwereld), dus je herkent het makkelijk.
    example_gloss:
    - Zullen we naar de bioscoop gaan?
  ro.a1.unit11.lesson01.teach.mergem_cinema_phrase:
    title: Zullen we naar de bioscoop gaan?
    gloss: Gaan we naar de bioscoop?
    note: 'Een complete uitnodiging. Je hebt geen extra ''wil je'' nodig: het vraagteken maakt van ''we gaan'' een voorstel.'
  ro.a1.unit11.lesson01.teach.parc_vocab:
    title: Het park
    gloss: het park
    note: Weer een woord dat sterk op het Nederlands lijkt, net als *cinema*.
    example_gloss:
    - Gaan we naar het park?
  ro.a1.unit11.lesson01.teach.mergem_parc_phrase:
    title: Gaan we naar het park?
    gloss: Gaan we naar het park?
    note: Hetzelfde patroon voor een uitnodiging als *Mergem la cinema?*, maar met een andere plek.
  ro.a1.unit11.lesson01.teach.da_bine_phrase:
    title: Ja, goed!
    gloss: Ja, goed!
    note: 'Een korte, natuurlijke manier om een plan te accepteren: bekende woorden in een nieuwe combinatie.'
  ro.a1.unit11.lesson02.teach.reminder_nu_pot:
    title: 'Herhaling: nu, pot'
    gloss: nee / niet · ik kan
    note: '*Nu* ken je al sinds les 6; pot kwam in les 9 voor in *cum pot să ajung* (hoe kom ik bij). Vóór een werkwoord betekent nu "niet": *nu pot* is "ik kan niet". Zo sla je in deze les een plan af.'
  ro.a1.unit11.lesson02.teach.reminder_sambata_duminica:
    title: 'Herhaling: sâmbătă, duminică'
    gloss: zaterdag · zondag
    note: Beide ken je al van de dagen van de week in les 3.
  ro.a1.unit11.lesson02.teach.mergem_parc_sambata_phrase:
    title: Gaan we zaterdag naar het park?
    gloss: Gaan we zaterdag naar het park?
    note: 'De uitnodiging uit de eerste les, nu met een dag erbij: *Mergem la parc?* gecombineerd met een dagnaam.'
  ro.a1.unit11.lesson02.teach.nu_pot_sambata_phrase:
    title: Zaterdag kan ik niet
    gloss: Zaterdag kan ik niet.
    note: 'Een duidelijke weigering: *nu pot* plus de dag die niet uitkomt.'
  ro.a1.unit11.lesson02.teach.atunci_vocab:
    title: Dan / in dat geval
    gloss: dan / in dat geval
    note: Anders dan *apoi* (uit les 9, 'daarna', om twee handelingen op volgorde te zetten). *Atunci* gebruik je om een alternatief voor te stellen of een gevolg te trekken, zoals bij 'in dat geval, wat dacht je van...?' als je iets verzet.
    example_gloss:
    - Dan zondag?
  ro.a1.unit11.lesson02.teach.atunci_duminica_phrase:
    title: Dan zondag?
    gloss: Dan zondag?
    note: 'Een kort tegenvoorstel na een weigering: een nieuwe dag noemen is genoeg, je hoeft de hele uitnodiging niet te herhalen.'
  ro.a1.unit11.lesson02.teach.da_bine_duminica_phrase:
    title: Ja, goed! Zondag.
    gloss: Ja, goed! Zondag.
    note: Je accepteert de nieuwe dag met hetzelfde korte patroon als *Da, bine!* uit de eerste les.
  ro.a1.unit11.lesson03.teach.reminder_la_ce_ora_la_ora_patru:
    title: 'Herhaling: la ce oră, la ora, patru'
    gloss: hoe laat · om ... uur · vier
    note: La ce oră en la ora ken je al uit les 4 (de tijd vragen en zeggen); patru uit de getallen van les 2. Hier combineer je ze om een tijd af te spreken.
  ro.a1.unit11.lesson03.teach.reminder_buna_multumesc_la_revedere_da_ana_mihai:
    title: 'Herhaling: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: hallo · dank je · tot ziens · ja · Ana, Mihai (namen)
    note: Dit ken je allemaal al uit eerdere lessen. Hier spreken Ana en Mihai een tijd af voor hun plan.
  ro.a1.unit11.lesson03.teach.sigur_vocab:
    title: Zeker
    gloss: zeker
    note: Een gangbare, losse manier om een plan te bevestigen, vergelijkbaar met het Nederlandse 'Zeker!' of 'Natuurlijk!'.
    example_gloss:
    - Zeker! Om vier uur.
  ro.a1.unit11.lesson03.teach.sigur_phrase:
    title: Zeker! Om vier uur.
    gloss: Zeker! Om vier uur.
    note: Met één kort antwoord bevestig je het plan én het precieze tijdstip.
  ro.a1.unit11.lesson03.teach.line01:
    title: Begroet en stel het park voor
    gloss: Ana begroet Mihai en vraagt of ze zondag naar het park gaan.
    note: Combineert de uitnodiging *Mergem la parc?* uit deze les met *duminică*.
  ro.a1.unit11.lesson03.teach.line02:
    title: Accepteren en naar de tijd vragen
    gloss: Mihai stemt in en vraagt hoe laat.
    note: Gebruikt de vraag *La ce oră?* uit les 4 opnieuw.
  ro.a1.unit11.lesson03.teach.line03:
    title: Stel een tijd voor
    gloss: Ana stelt vier uur voor.
    note: Een korte vraag met het patroon *la ora* uit les 4 en *patru* uit deze les.
  ro.a1.unit11.lesson03.teach.line04:
    title: Bevestig en bedank
    gloss: Mihai bevestigt met 'Zeker!' en bedankt Ana.
    note: Combineert *sigur* uit deze les met het bekende *mulțumesc*.
  ro.a1.unit11.lesson03.teach.line05:
    title: Zeg gedag
    gloss: Ana zegt gedag.
    note: Dezelfde afsluiting als in de dialogen van alle eerdere lessen.
  ro.a1.unit11.lesson03.teach.line06:
    title: Sluit het gesprek af
    gloss: Mihai zegt ook gedag en noemt Ana's naam.
    note: Dezelfde vriendelijke afsluiting als in de dialogen van alle eerdere lessen.
