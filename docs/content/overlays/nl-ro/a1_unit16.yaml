answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (doare, cap, stomac, simt, bolnav, nevoie, doctor, odihnă, multă) is used only in fixed first-person (Mihai's own "Nu mă simt bine"/"Sunt bolnav") or already-established formal ("Aveți nevoie de...?") forms. No informal-tu form is introduced this unit; Ana and Mihai keep their existing formal register with each other.
course:
  title: Roemeens A1
  description: Een eenvoudig gezondheidsprobleem benoemen in het Roemeens -- Doare (doet pijn), Bolnav (ziek) en Doctor (dokter) -- terwijl Mihai zich niet lekker voelt en Ana bij hem informeert en advies geeft.
units:
  ro.a1.unit16.health:
    title: Gezondheid
lessons:
  ro.a1.unit16.lesson01.ma_doare_capul:
    title: Mijn hoofd doet pijn
  ro.a1.unit16.lesson02.nu_ma_simt_bine:
    title: Ik voel me niet goed
  ro.a1.unit16.lesson03.mihai_este_bolnav:
    title: Mihai is ziek
teaching:
  ro.a1.unit16.lesson01.teach.reminder_ma_va_ce_sau:
    title: 'Herinnering: mă, vă, ce, sau'
    gloss: mă (mij/me) · vă (u) · ce (wat) · sau (of)
    note: 'Mă komt uit Unit 1/Unit 10 (mă numesc, mă trezesc); vă uit Unit 1/Unit 6/Unit 7/Unit 13 (vă rog); ce uit Unit 1/Unit 3/Unit 4/Unit 15; sau uit Unit 13 -- deze unit gebruikt alle vier opnieuw voor een nieuw doel: vertellen wat pijn doet.'
  ro.a1.unit16.lesson01.teach.doare_vocab:
    title: Doet pijn
    gloss: Doare (doet pijn)
    note: 'Een onpersoonlijk werkwoord -- het Roemeens zegt ''het doet me pijn'' (*mă doare*) in plaats van ''ik doe pijn''. *Mă doare* alleen betekent ''het doet (me) pijn''; voeg het lichaamsdeel toe om te zeggen wat pijn doet: *Mă doare capul*.'
    example_gloss:
    - Het doet pijn.
  ro.a1.unit16.lesson01.teach.cap_vocab:
    title: Hoofd
    gloss: Cap (hoofd)
    note: Onzijdig, eindigt op een medeklinker -- krijgt *-ul* voor 'het hoofd', hetzelfde einde als *tren*->*trenul* en *peron*->*peronul*.
    example_gloss:
    - Mijn hoofd doet pijn.
  ro.a1.unit16.lesson01.teach.ce_va_doare_phrase:
    title: Waar heeft u pijn?
    gloss: Ce vă doare? (Waar heeft u pijn?)
    note: '*Ce* (wat) + *vă* (u, beleefd, meewerkend voorwerp) + *doare* -- elk woord was al geleerd of net geïntroduceerd, hier gecombineerd tot een nieuwe vraag.'
  ro.a1.unit16.lesson01.teach.stomac_vocab:
    title: Maag
    gloss: Stomac (maag)
    note: Onzijdig, eindigt op een medeklinker, dus 'de maag' is *stomacul* -- hetzelfde einde *-ul* als *cap*->*capul*.
    example_gloss:
    - Mijn maag doet pijn.
  ro.a1.unit16.lesson01.teach.ma_doare_capul_sau_stomacul_phrase:
    title: Doet uw hoofd of uw maag pijn?
    gloss: Vă doare capul sau stomacul? (Doet uw hoofd of uw maag pijn?)
    note: '*Vă* (u, beleefd) in plaats van *mă* maakt van de bewering een vraag over de ander; *sau* (of, uit Unit 13) verbindt de twee net geleerde lichaamsdelen.'
  ro.a1.unit16.lesson02.teach.reminder_nu_bine_am_un_de:
    title: 'Herinnering: nu, bine, am, un, de'
    gloss: nu (niet/nee) · bine (goed) · am (ik heb) · un (een, mannelijk/onzijdig) · de (van)
    note: Nu en bine komen uit Unit 1/Unit 6/Unit 11; am uit Unit 2/Unit 5/Unit 15; un en de uit Unit 6/Unit 7/Unit 15 -- deze unit gebruikt alle vijf opnieuw om te vertellen dat je je niet goed voelt en een dokter nodig hebt.
  ro.a1.unit16.lesson02.teach.ma_simt_vocab:
    title: ik voel me
    gloss: Mă simt (ik voel me)
    note: Een wederkerend werkwoord, letterlijk 'ik voel mezelf' -- hetzelfde patroon *mă* + werkwoord als *mă trezesc*/*mă culc* uit Unit 10.
    example_gloss:
    - Ik voel me goed.
  ro.a1.unit16.lesson02.teach.nu_ma_simt_bine_phrase:
    title: Ik voel me niet goed
    gloss: Nu mă simt bine. (Ik voel me niet goed.)
    note: '*Nu* ontkent *mă simt bine* -- de natuurlijke manier om te zeggen dat er iets mis is zonder al een specifiek symptoom te noemen.'
  ro.a1.unit16.lesson02.teach.bolnav_vocab:
    title: Ziek
    gloss: ziek (mannelijk)
    note: Mannelijke vorm van het adjectief, zoals Mihai het zegt (*Sunt bolnav*). Een vrouw zegt *Sunt bolnavă* (de vrouwelijke vorm).
    example_gloss:
    - Ik ben ziek.
  ro.a1.unit16.lesson02.teach.am_nevoie_de_un_doctor_phrase:
    title: Ik heb een dokter nodig
    gloss: Ik heb een dokter nodig.
    note: '*Am nevoie de* (ik heb nodig, letterlijk ''ik heb behoefte aan'') + *un doctor* -- een vaste uitdrukking, handig om om hulp te vragen bij van alles, niet alleen bij dokters.'
  ro.a1.unit16.lesson02.teach.doctor_vocab:
    title: Doctor
    gloss: dokter
    note: Mannelijk, dus 'een dokter' is *un doctor*.
    example_gloss:
    - Ik heb een dokter nodig.
  ro.a1.unit16.lesson03.teach.reminder_ce_mai_faceti_aveti_da:
    title: 'Herhaling: Ce mai faceți?, Aveți, Da'
    gloss: Hoe maakt u het? · u hebt · ja
    note: Ce mai faceți komt uit Unit 1, Aveți uit Unit 5 en Da uit Unit 6/Unit 11 -- alles wordt hergebruikt in de kennismakingsdialoog van deze unit.
  ro.a1.unit16.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Herhaling: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: hoi · dank je · tot ziens · Ana, Mihai (namen)
    note: Alles al eerder behandeld -- hetzelfde vriendelijke begin en slot als in elke dialoog in deze cursus.
  ro.a1.unit16.lesson03.teach.reminder_spitalul_vizavi_magazin:
    title: 'Herhaling: Spitalul este vizavi de magazin'
    gloss: Het ziekenhuis is tegenover de winkel.
    note: Rechtstreeks overgenomen uit Unit 8 -- de plek van het ziekenhuis is niet veranderd, en de leestekst van deze unit verwijst ernaar terug.
  ro.a1.unit16.lesson03.teach.odihna_vocab:
    title: Rust
    gloss: rust
    note: Een vrouwelijk zelfstandig naamwoord -- wat een dokter (of een vriend) aanraadt als je je niet goed voelt.
    example_gloss:
    - Je hebt rust nodig.
  ro.a1.unit16.lesson03.teach.multa_apa_vocab:
    title: Veel water
    gloss: veel water
    note: '*Multă* (veel, vrouwelijk) congrueert met het vrouwelijke *apă* (water, uit Unit 6) -- een vaste combinatie, het soort advies dat een dokter kan geven.'
    example_gloss:
    - Rust en veel water.
  ro.a1.unit16.lesson03.teach.line01:
    title: Begroeten en vragen hoe het gaat
    gloss: Ana begroet Mihai en vraagt hoe het met hem gaat.
    note: Hergebruikt de groet *Ce mai faceți?* uit Unit 1.
  ro.a1.unit16.lesson03.teach.line02:
    title: Zeggen dat je je niet goed voelt
    gloss: Mihai zegt dat hij zich niet goed voelt en dat hij hoofdpijn heeft.
    note: Combineert de zin uit les 2 en de zin uit les 1 van deze unit.
  ro.a1.unit16.lesson03.teach.line03:
    title: Vragen of hij een dokter nodig heeft
    gloss: Ana vraagt of hij een dokter nodig heeft.
    note: Gebruikt de zin uit les 2 van deze unit als vraag, met *aveți* uit Unit 5.
  ro.a1.unit16.lesson03.teach.line04:
    title: Bevestigen dat je ziek bent en een dokter nodig hebt
    gloss: Mihai zegt ja, hij is ziek en hij heeft een dokter nodig.
    note: Combineert *sunt bolnav* en *am nevoie de un doctor* uit deze unit.
  ro.a1.unit16.lesson03.teach.line05:
    title: Advies geven en afscheid nemen
    gloss: Ana zegt dat hij moet rusten en veel water moet drinken, en neemt afscheid.
    note: Gebruikt *Odihnă și multă apă* uit deze les -- gezondheidsadvies in plaats van alleen het gebruikelijke afscheid.
  ro.a1.unit16.lesson03.teach.line06:
    title: Haar bedanken en afscheid nemen
    gloss: Mihai bedankt Ana en neemt afscheid.
    note: Hetzelfde slot als waarmee elke dialoog in eerdere units eindigde.
