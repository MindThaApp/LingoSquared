answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francuski A1
  description: 'Słownictwo związane z targiem, pytanie o ceny i ilości z combien/kilo/litre oraz kontrast między du/de la a samym de po wyrażeniach ilości – ciąg dalszy historii warsztatów kulinarnych Inès i Mathieu, tym razem na targu. Zasada francuska: po jawnie podanej ilości rodzajnik częściowy znika całkowicie (un kilo de tomates, a nie un kilo des tomates).'
units:
  fr.a1.unit04.shopping:
    title: Zakupy spożywcze z Inès
lessons:
  fr.a1.unit04.lesson01.au_marche:
    title: Na targu
  fr.a1.unit04.lesson02.combien_ca_coute:
    title: Ile to kosztuje?
  fr.a1.unit04.lesson03.dialogue_marche:
    title: Na targu z Inès i Mathieu
teaching:
  fr.a1.unit04.lesson01.teach.marche:
    title: Targ
    gloss: targ
    note: '*Marché* jest rodzaju męskiego.'
    example_gloss: Targ jest otwarty w soboty.
  fr.a1.unit04.lesson01.teach.boulangerie:
    title: Piekarnia
    gloss: piekarnia
    note: '*Boulangerie* jest rodzaju żeńskiego; to sklep przeznaczony właśnie na pieczywo, inny niż *pâtisserie* (cukiernia).'
    example_gloss: Niedaleko stąd jest dobra piekarnia.
  fr.a1.unit04.lesson01.teach.legumes:
    title: Warzywa
    gloss: warzywa
    note: '*Légumes* to rzeczownik rodzaju męskiego w liczbie mnogiej.'
    example_gloss: Kupuję świeże warzywa na warsztaty.
  fr.a1.unit04.lesson01.teach.fruits:
    title: Owoce
    gloss: owoce
    note: '*Fruits* to rzeczownik rodzaju męskiego w liczbie mnogiej. Po francusku często używa się liczby mnogiej (*les fruits*), podobnie jak po polsku mówimy „owoce”.'
    example_gloss: Owoce są w tym miesiącu drogie.
  fr.a1.unit04.lesson01.teach.prix:
    title: Cena
    gloss: cena
    note: '*Prix* jest rodzaju męskiego i niezmienne – w liczbie pojedynczej i mnogiej pisze się tak samo.'
    example_gloss: Ile kosztuje chleb?
  fr.a1.unit04.lesson01.teach.cher:
    title: Drogi
    gloss: drogi
    note: '*Cher* to forma rodzaju męskiego; *chère* to rodzaj żeński, a *chers*/*chères* liczba mnoga. Przymiotnik zgadza się z rzeczownikiem, który określa.'
    example_gloss: Ten ser jest za drogi.
  fr.a1.unit04.lesson01.teach.pas_cher:
    title: Niedrogie dzisiaj
    gloss: Warzywa nie są dzisiaj drogie.
    note: '*Pas cher(s)* (bez *ne*) to potoczny sposób mówienia, że coś jest tanie; pełna forma pisana to *ne sont pas chers*.'
  fr.a1.unit04.lesson02.teach.un_kilo_de:
    title: Kilogram
    gloss: kilogram
    note: '*De* następuje bezpośrednio po określeniu ilości, bez rodzajnika – zobacz poniższą notatkę gramatyczną o *de* po ilości.'
    example_gloss: Poproszę kilogram pomidorów.
  fr.a1.unit04.lesson02.teach.un_litre_de:
    title: Litr
    gloss: litr
    note: '*Litre* jest rodzaju męskiego i używa się go do płynów tak, jak *kilo* do produktów stałych.'
    example_gloss: Poproszę litr mleka.
  fr.a1.unit04.lesson02.teach.euro:
    title: Jedno euro
    gloss: jedno euro
    note: '*Euro* tworzy liczbę mnogą regularnie: *deux euros*, *cinq euros*.'
    example_gloss: To kosztuje pięć euro.
  fr.a1.unit04.lesson02.teach.de_after_quantity:
    title: De po określeniu ilości
    gloss: z; (określa to, czego dotyczy ilość)
    note: Po wyraźnym określeniu ilości (*un kilo*, *un litre*, *beaucoup*, jak w *beaucoup de cousins*) po francusku używa się samego *de* i całkowicie pomija *du*/*de la*/*des* – *un kilo de tomates*, nigdy *un kilo des tomates*.
  fr.a1.unit04.lesson02.teach.combien_ca_coute:
    title: Zapytaj o cenę
    gloss: Ile to kosztuje?
    note: '*Combien* (ile) plus *ça coûte* (to kosztuje) to ogólny, uniwersalny sposób zapytania o cenę.'
  fr.a1.unit04.lesson02.teach.cest_combien_pain:
    title: Zapytaj o cenę konkretnego produktu
    gloss: Ile kosztuje chleb?
    note: '*C''est combien, [item] ?* podaje konkretny produkt, o którego cenę pytasz. To częsta alternatywa dla *Combien ça coûte ?*.'
  fr.a1.unit04.lesson02.teach.ca_fait_combien:
    title: Zapytaj o łączną kwotę
    gloss: Ile to będzie w sumie?
    note: '*Ça fait combien ?* pyta o sumę zakupów, zwykle na końcu, a nie o cenę jednego produktu.'
  fr.a1.unit04.lesson03.teach.line01:
    title: Zamawianie pomidorów
    gloss: Inès wita się ze sprzedawcą i prosi o kilogram pomidorów.
    note: Łączy *Bonjour* ze wzorem *je voudrais* + ilość.
  fr.a1.unit04.lesson03.teach.line02:
    title: Zapytaj, czy coś jeszcze jest potrzebne
    gloss: Sprzedawca potwierdza i pyta, czy potrzebuje czegoś jeszcze.
    note: '*Autre chose ?* (coś jeszcze?) to standardowe pytanie sprzedawcy.'
  fr.a1.unit04.lesson03.teach.line03:
    title: Dodaj ser i zapytaj o jego cenę
    gloss: Inès dodaje trochę sera i pyta o jego cenę.
    note: '*Un peu de fromage* (trochę sera) ma ten sam wzorzec z samym *de* co *un kilo de*.'
  fr.a1.unit04.lesson03.teach.line04:
    title: Podaj cenę za kilogram
    gloss: Sprzedawca mówi, że kilogram kosztuje osiem euro.
    note: '*X euros le kilo* to naturalny francuski sposób podania ceny za jednostkę; *le* oznacza tu „za”, a nie rodzajnik.'
  fr.a1.unit04.lesson03.teach.line05:
    title: Wyjaśnij, dlaczego potrzebuje chleba tutaj
    gloss: Mathieu mówi, że też chce chleb, ale piekarnia jest dziś zamknięta.
    note: '*Fermée* (zamknięta) to forma rodzaju żeńskiego, zgodna z *la boulangerie*.'
  fr.a1.unit04.lesson03.teach.line06:
    title: Zaproponuj inne rozwiązanie
    gloss: Inès uspokaja go, że chleb można kupić także tutaj.
    note: '*On peut* (można / możemy) + bezokolicznik to częsty, nieformalny sposób mówienia o możliwości.'
  fr.a1.unit04.lesson03.teach.line07:
    title: Potwierdź i podaj sumę
    gloss: 'Sprzedawca potwierdza, że ma świeży chleb, zastanawia się nad sumą i podaje: trzynaście euro pięćdziesiąt.'
    note: '*Ça fait combien en tout ?* to tutaj głośne myślenie sprzedawcy przed podaniem sumy, a nie prawdziwe pytanie do Inès.'
  fr.a1.unit04.lesson03.teach.line08:
    title: Podziękuj sprzedawcy
    gloss: Inès serdecznie mu dziękuje, płacąc.
    note: '*Voilà* towarzyszy tutaj podaniu pieniędzy; to słowo-gest.'
