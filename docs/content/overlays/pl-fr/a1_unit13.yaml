answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francuski A1
  description: Wyrażanie i pytanie o podstawowe upodobania, niechęci i preferencje; ciąg dalszy historii z warsztatów kulinarnych Inès i Mathieu, którzy wybierają jeden z dwóch przepisów na sobotę. Warto zapamiętać, że w konstrukcji *préférer X à Y* (woleć X od Y) używa się przyimka *à*, a nie *que*.
units:
  fr.a1.unit13.preferences:
    title: Co wolisz?
lessons:
  fr.a1.unit13.lesson01.vocabulaire_preferences:
    title: Lubić, woleć, nienawidzić
  fr.a1.unit13.lesson02.demander_les_preferences:
    title: Pytanie o preferencje
  fr.a1.unit13.lesson03.dialogue_choisir_la_recette:
    title: Wybieramy przepis na sobotę
teaching:
  fr.a1.unit13.lesson01.teach.preferer:
    title: Woleć
    gloss: woleć
    note: '*Préférer* to czasownik na -ER ze zmianą w temacie: *je préfère*, ale *nous préférons* (w formach *nous/vous* akcent się nie zmienia).'
    example_gloss: Wolę tartę czekoladową.
  fr.a1.unit13.lesson01.teach.aimer_mieux:
    title: Bardziej lubić
    gloss: bardziej lubić
    note: '*Aimer mieux* to częsty zamiennik *préférer*, ale porównanie wprowadza się przez *que* (*aimer mieux X que Y*), a przy *préférer* przez *à* (*préférer X à Y*).'
    example_gloss: Bardziej lubię dania wytrawne niż słodkie.
  fr.a1.unit13.lesson01.teach.detester:
    title: Nienawidzić
    gloss: nienawidzić
    note: '*Détester* wyraża silną niechęć, mocniejszą niż *ne pas aimer* (nie lubić).'
    example_gloss: Mathieu nie znosi zbyt ostrych przypraw; woli łagodne potrawy.
  fr.a1.unit13.lesson01.teach.plutot:
    title: Raczej
    gloss: raczej
    note: '*Plutôt* łagodzi wyrażenie preferencji: „raczej” to, bez całkowitego odrzucania drugiej możliwości.'
    example_gloss: Wezmę raczej ser.
  fr.a1.unit13.lesson01.teach.sucre:
    title: Słodki
    gloss: słodki
    note: '*Sucré* opisuje smak potrawy (słodki); nie należy go mylić z *doux* (łagodny, delikatny).'
    example_gloss: Ten deser jest bardzo słodki.
  fr.a1.unit13.lesson01.teach.sale:
    title: Wytrawny / słony
    gloss: wytrawny / słony
    note: '*Salé* to zwykłe przeciwieństwo *sucré* w słownictwie kulinarnym; obejmuje znaczenia „wytrawny” i „słony”.'
    example_gloss: Ser jest słony.
  fr.a1.unit13.lesson01.teach.la_recette:
    title: Przepis
    gloss: przepis
    note: '*La recette* jest zawsze rodzaju żeńskiego.'
    example_gloss: Ten przepis jest łatwy.
  fr.a1.unit13.lesson02.teach.quest_ce_que_tu_preferes:
    title: Pytanie o preferencje
    gloss: Co wolisz?
    note: '*Qu''est-ce que...* to standardowy sposób tworzenia pytań otwartych z „co” w mówionym francuskim.'
  fr.a1.unit13.lesson02.teach.je_prefere_x_a_y:
    title: Wskazanie preferencji między dwiema rzeczami
    gloss: Wolę tartę od quiche.
    note: W konstrukcji *préférer X à Y* przyimek *à* wprowadza to, co jest mniej lubiane (podobnie jak polskie „od”); nie używa się tu *que*.
  fr.a1.unit13.lesson02.teach.tu_aimes_plutot:
    title: Pytanie o ogólną skłonność
    gloss: Wolisz raczej słodkie czy wytrawne?
    note: Łączy *plutôt* (lekcja 1) z pytaniem wyboru z *ou* (czy).
  fr.a1.unit13.lesson02.teach.moi_aussi_moi_non:
    title: Zgoda lub brak zgody
    gloss: Ja też. / Ja nie.
    note: '*Moi aussi* zgadza się z wypowiedzią twierdzącą; *moi non* wyraża sprzeciw albo przeciwną preferencję.'
  fr.a1.unit13.lesson02.teach.ca_ne_me_derange_pas:
    title: Powiedz, że ci to obojętne
    gloss: Nie mam nic przeciwko.
    note: '*Ça ne me dérange pas* to przydatny, neutralny sposób, by zaakceptować każdą z opcji, gdy trzeba wybierać.'
  fr.a1.unit13.lesson02.teach.on_pourrait_faire:
    title: Zaproponuj opcję
    gloss: Moglibyśmy zrobić quiche, prawda?
    note: '*On pourrait* (moglibyśmy) + bezokolicznik delikatnie proponuje opcję, a *non ?* zachęca do zgody.'
  fr.a1.unit13.lesson03.teach.line01:
    title: Pytanie, co przygotować
    gloss: 'Mathieu pyta, co przygotowują w sobotę: tartę czy quiche?'
    note: '*Qu''est-ce qu''on prépare... ?* (co przygotowujemy) używa *on* w znaczeniu „my”, jak zwykle w potocznej mowie.'
  fr.a1.unit13.lesson03.teach.line02:
    title: Wskazanie preferencji i pytanie o zdanie drugiej osoby
    gloss: Inès mówi, że woli tartę, raczej słodką, i pyta o zdanie Mathieu.
    note: '*Et toi ?* (a ty?) to najprostszy sposób, by zwrócić pytanie do rozmówcy.'
  fr.a1.unit13.lesson03.teach.line03:
    title: Wskazanie przeciwnej preferencji
    gloss: Mathieu mówi, że bardziej lubi wytrawne i woli quiche od tarty.
    note: Wykorzystuje wprost konstrukcję *préférer X à Y* z lekcji 2.
  fr.a1.unit13.lesson03.teach.line04:
    title: Propozycja kompromisu
    gloss: Inès proponuje, że mogą zrobić jedno i drugie, prawda?
    note: '*Les deux* (jedno i drugie) rozwiązuje spór, proponując zrobienie obu przepisów.'
  fr.a1.unit13.lesson03.teach.line05:
    title: Przyjęcie kompromisu
    gloss: Mathieu mówi, że to dobry pomysł i że zupełnie nie ma nic przeciwko.
    note: '*Ça ne me dérange pas du tout* wzmacnia zwrot z lekcji 2 przez *du tout* (wcale, zupełnie).'
  fr.a1.unit13.lesson03.teach.line06:
    title: Potwierdzenie decyzji
    gloss: 'Inès mówi: doskonale, słodka tarta i wytrawna quiche na sobotę.'
    note: Jasno powtarza ostateczną decyzję i zamyka rozmowę.
