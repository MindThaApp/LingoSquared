teaching:
  fr.a1.unit43.lesson01.teach.le_billet:
    title: Bilet wstępu
    gloss: bilet wstępu
    note: '*Billet* jest rodzaju męskiego: *le billet*, *un billet*.'
    example_gloss: Chciałbym bilet do Lyonu.
  fr.a1.unit43.lesson01.teach.je_voudrais_un:
    title: Prośba o bilet
    gloss: Chciałbym bilet do Lyonu.
    note: '*Je voudrais* łagodzi prośbę; jest grzeczniejsze niż *je veux*.'
  fr.a1.unit43.lesson01.teach.voulez_vous_un:
    title: Kasjer pyta o rodzaj biletu
    gloss: Chce Pan/Pani bilet w jedną stronę czy powrotny?
    note: '*Voulez-vous* to oficjalna forma z *vous* czasownika *vouloir*, użyta tu wobec nieznanego pracownika dworca.'
  fr.a1.unit43.lesson01.teach.un_aller_retour:
    title: Grzeczna odpowiedź
    gloss: Powrotny, proszę.
    note: '*S''il vous plaît* to grzeczne „proszę” w formie oficjalnej, zgodne z rejestrem *vous* w tej rozmowie.'
  fr.a1.unit43.lesson01.teach.au_guichet_on:
    title: Forma grzecznościowa przy kasie
    gloss: Przy okienku zwykle używa się formy grzecznościowej *vous*.
    note: Do obcych osób wykonujących usługę zwracamy się przez *vous*; do przyjaciół i rodziny mówimy *tu*.
  fr.a1.unit43.lesson02.teach.le_quai:
    title: Peron
    gloss: peron
    note: '*Quai* jest rodzaju męskiego: *le quai*.'
    example_gloss: Z którego peronu odjeżdża pociąg do Lyonu?
  fr.a1.unit43.lesson02.teach.de_quel_quai:
    title: Pytanie o peron
    gloss: Z którego peronu odjeżdża pociąg do Lyonu?
    note: '*De quel quai* pyta konkretnie o peron; *quel* zgadza się z rzeczownikiem rodzaju męskiego *quai*.'
  fr.a1.unit43.lesson02.teach.le_train_part:
    title: Podawanie szczegółów odjazdu
    gloss: Pociąg odjeżdża za kwadrans dziesiąta z peronu piątego.
    note: '*Dix heures moins le quart* to „za kwadrans dziesiąta”: przed pełną godziną po francusku mówi się *moins* (minus).'
  fr.a1.unit43.lesson02.teach.a_quelle_heure:
    title: Pytanie o godzinę przyjazdu
    gloss: O której godzinie przyjeżdża pociąg?
    note: '*À quelle heure arrive ... ?* pyta o godzinę; *arriver* to regularny czasownik na *-er*: *le train arrive*.'
  fr.a1.unit43.lesson02.teach.le_train_arrive:
    title: Podawanie godziny przyjazdu
    gloss: Pociąg przyjeżdża o jedenastej.
    note: '*Arrive* to forma *il/elle* czasownika *arriver*; czasowniki na *-er* mają przy *il* i *elle* końcówkę *-e*.'
  fr.a1.unit43.lesson03.teach.a_l_heure:
    title: Punktualnie / opóźnienie
    gloss: na czas, punktualnie; opóźnienie
    note: '*À l''heure* to stałe wyrażenie oznaczające coś, co dzieje się zgodnie z rozkładem. *Le retard* („opóźnienie”) jest rodzaju męskiego.'
    example_gloss:
    - Pociąg nie odjeżdża punktualnie.
    - 'Uwaga: pociąg do Lyonu ma opóźnienie.'
  fr.a1.unit43.lesson03.teach.attention_le_train:
    title: Komunikat
    gloss: 'Uwaga: pociąg do Lyonu ma opóźnienie.'
    note: '*Attention* otwiera zapowiedź na dworcu, tak jak polskie „Uwaga!”.'
  fr.a1.unit43.lesson03.teach.le_train_ne:
    title: 'Zaprzeczenie: nie na czas'
    gloss: Pociąg nie odjeżdża punktualnie.
    note: '*Ne ... pas* otacza czasownik: *ne part pas à l''heure*.'
  fr.a1.unit43.lesson03.teach.le_train_part:
    title: Zmiana peronu
    gloss: Pociąg odjeżdża z peronu trzeciego zamiast z piątego.
    note: '*Au lieu du* znaczy „zamiast”; *de* + *le* łączy się w *du*.'
  fr.a1.unit43.lesson03.teach.le_train_a:
    title: Podawanie długości opóźnienia
    gloss: Pociąg ma dziesięć minut opóźnienia.
    note: '*A ... de retard* (dosłownie „ma ... opóźnienia”) to naturalny sposób, by powiedzieć, że coś się spóźnia; używa się czasownika *avoir*.'
  fr.a1.unit43.lesson04.teach.l_entree_la:
    title: Wejście, wyjście, poczekalnia
    gloss: wejście; wyjście; poczekalnia
    note: '*L''entrée* traci *e* i przyjmuje formę *l''* przed samogłoską; *la sortie* i *la salle d''attente* są rodzaju żeńskiego.'
    example_gloss:
    - Gdzie jest wejście?
    - Gdzie jest wyjście?
    - Gdzie jest poczekalnia?
  fr.a1.unit43.lesson04.teach.ou_est_le:
    title: Pytanie, gdzie jest peron
    gloss: Gdzie jest peron siódmy?
    note: '*Où est ... ?* pyta, gdzie coś jest; *le quai sept* jest rodzaju męskiego.'
  fr.a1.unit43.lesson04.teach.tout_droit_puis:
    title: Wskazywanie drogi
    gloss: Prosto, a potem w prawo.
    note: '*Tout droit* i *à droite* to określenia kierunku; *à* stoi przed *droite*.'
  fr.a1.unit43.lesson04.teach.ou_est_la:
    title: Pytanie o poczekalnię
    gloss: Gdzie jest poczekalnia?
    note: Ten sam schemat pytania zastosowany do nowego miejsca.
  fr.a1.unit43.lesson05.teach.billet_paris_gare:
    title: Czytamy wydrukowany bilet
    gloss: 'Bilet: Paris Gare de Lyon – Lyon Part-Dieu. Odjazd: dziesiąta dziesięć, peron siódmy. Przyjazd: za dziesięć jedenasta. Powrotny. Cena: dwanaście euro czterdzieści.'
    note: Zwróć uwagę na godzinę odjazdu i peron, godzinę przyjazdu, rodzaj biletu i cenę.
    glosses:
      Billet: bilet
      Départ: odjazd
      dix: dziesięć
      quai: peron
      sept: siedem
      Arrivée: przyjazd
      onze: jedenaście
      Aller-retour: bilet powrotny
      Prix: cena
      douze: dwanaście
      euros: euro
      quarante: czterdzieści
  fr.a1.unit43.lesson06.teach.mathieu_on_doit:
    title: Mathieu przedstawia plan
    gloss: 'Mathieu: Musimy iść na peron siódmy. Pociąg odjeżdża o dziesiątej dziesięć.'
    note: '*On doit* (od *devoir*) wyraża tu praktyczną konieczność, a nie ścisły obowiązek.'
  fr.a1.unit43.lesson06.teach.camille_regarde_voila:
    title: Camille czyta tablicę
    gloss: 'Camille: Patrz, tu jest tablica: opóźnienie, dziesięć minut.'
    note: '*Voilà* wskazuje to, co jest na miejscu: *voilà le panneau*.'
  fr.a1.unit43.lesson06.teach.mathieu_pas_de:
    title: Mathieu zachowuje spokój
    gloss: 'Mathieu: Nie ma problemu, mamy jeszcze czas na kawę.'
    note: '*Pas de problème* to częste, potoczne uspokojenie.'
  fr.a1.unit43.lesson06.teach.camille_bonne_idee:
    title: Pociąg przyjeżdża
    gloss: 'Camille: Dobry pomysł. O, pociąg już jest. Peron siódmy, dokładnie!'
    note: '*Déjà* („już”) pokazuje, że pociąg przyjechał wcześniej, niż się spodziewano, zważywszy na właśnie ogłoszone opóźnienie.'
  fr.a1.unit43.lesson06.teach.mathieu_allez_on:
    title: Wsiadają do pociągu
    gloss: 'Mathieu: Chodźmy, wsiadamy. Lyon, jedziemy!'
    note: '*On* to potoczne *my*, używane z formą czasownika jak przy *il*: *on monte*. *On arrive !* to naturalny sposób, by powiedzieć „już jedziemy”; tłumaczenie słowo w słowo brzmiałoby dziwnie.'
