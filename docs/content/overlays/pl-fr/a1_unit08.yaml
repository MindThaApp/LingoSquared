  fr.a1.unit08.lesson01.jours_de_la_semaine:
    title: Dni tygodnia
  fr.a1.unit08.lesson02.donner_la_date:
    title: Podawanie daty
  fr.a1.unit08.lesson03.dialogue_derniere_seance:
    title: Ostatnie spotkanie warsztatów
teaching:
  fr.a1.unit08.lesson01.teach.lundi:
    title: Poniedziałek
    gloss: poniedziałek
    note: Dni tygodnia są rodzaju męskiego i – tak jak w polskim – pisze się je małą literą.
    example_gloss: Warsztaty nigdy nie odbywają się w poniedziałki.
  fr.a1.unit08.lesson01.teach.samedi:
    title: Sobota
    gloss: sobota
    note: '*Le samedi* (z rodzajnikiem) oznacza „w soboty” – regularnie; samo *samedi* oznacza jedną konkretną sobotę – najbliższą, nadchodzącą lub minioną, zależnie od czasu czasownika.'
    example_gloss: Warsztaty odbywają się w soboty.
  fr.a1.unit08.lesson01.teach.dimanche:
    title: Niedziela
    gloss: niedziela
    note: 'Tak samo jak inne dni: rodzaj męski i pisownia małą literą.'
    example_gloss: Piekarnia jest zamknięta w niedziele.
  fr.a1.unit08.lesson01.teach.aujourdhui:
    title: Dzisiaj
    gloss: dzisiaj
    note: '*Aujourd''hui* to jedno, niezmienne słowo, choć historycznie powstało z kilku części.'
    example_gloss: Dzisiaj jest sobota.
  fr.a1.unit08.lesson01.teach.demain:
    title: Jutro
    gloss: jutro
    note: '*Demain* jest niezmienne i w każdym kontekście używa się go tak samo.'
    example_gloss: Apteka otwiera się jutro.
  fr.a1.unit08.lesson01.teach.hier:
    title: Wczoraj
    gloss: wczoraj
    note: '*Hier* jest dokładnym przeciwieństwem *demain*.'
    example_gloss: Wczoraj jadłem rybę.
  fr.a1.unit08.lesson01.teach.quel_jour_sommes_nous:
    title: Zapytaj o dzień
    gloss: Jaki dziś dzień?
    note: '*Quel jour sommes-nous ?* (dosłownie „który dzień jesteśmy”) to standardowy sposób zapytania o dzień tygodnia.'
  fr.a1.unit08.lesson02.teach.mars:
    title: Marzec
    gloss: marzec
    note: Miesiące, tak jak dni, są po francusku rodzaju męskiego i pisze się je małą literą – podobnie jak w polskim.
    example_gloss: Warsztaty kończą się w marcu.
  fr.a1.unit08.lesson02.teach.quelle_est_la_date:
    title: Zapytaj o datę
    gloss: Którego dziś mamy?
    note: '*Quelle est la date... ?* to standardowy sposób zapytania o pełną datę kalendarzową, w odróżnieniu od *Quel jour sommes-nous ?*, które dotyczy tylko dnia tygodnia.'
  fr.a1.unit08.lesson02.teach.cest_le_quinze_mars:
    title: Podawanie daty
    gloss: Jest piętnasty marca.
    note: '*Le* + liczebnik główny + miesiąc to standardowy francuski wzór daty – *quinze* (piętnaście), a nie liczebnik porządkowy „piętnasty”, jak w polskim.'
  fr.a1.unit08.lesson02.teach.nous_sommes_le:
    title: Podaj dzisiejszą datę
    gloss: Dzisiaj jest piętnasty marca.
    note: '*Nous sommes le...* to równie częsta alternatywa dla *C''est le...* przy podawaniu dzisiejszej daty.'
  fr.a1.unit08.lesson02.teach.le_premier:
    title: Pierwszy (dzień miesiąca)
    gloss: pierwszy
    note: '*Le premier* to JEDYNY wyjątek od reguły liczebników głównych – każdy inny dzień miesiąca ma zwykły liczebnik główny (*le deux*, *le trois*...), ale pierwszy dzień używa liczebnika porządkowego *premier*.'
  fr.a1.unit08.lesson02.teach.le_vingt_deux:
    title: Podaj datę zakończenia
    gloss: Warsztaty kończą się dwudziestego drugiego marca.
    note: '*Se termine* („kończy się”) to czasownik zwrotny; *vingt-deux* to zwykły liczebnik główny, zgodnie z tą samą regułą co w *le quinze mars*.'
  fr.a1.unit08.lesson03.teach.line01:
    title: Zapytaj, kiedy jest ostatnie spotkanie
    gloss: Inès pyta, kiedy odbędzie się ostatnie spotkanie warsztatów.
    note: '*C''est quand... ?* („kiedy to jest”) to naturalny, prosty sposób zapytania o termin.'
  fr.a1.unit08.lesson03.teach.line02:
    title: Podaj datę i dzień tygodnia
    gloss: Mathieu mówi, że chyba dwudziestego drugiego marca – w sobotę.
    note: '*Un samedi* (bez *le*) po prostu wskazuje, na jaki dzień tygodnia wypada ta data.'
  fr.a1.unit08.lesson03.teach.line03:
    title: Pytanie o dzisiejszą datę
    gloss: Inès pyta, jaka jest dzisiaj data.
    note: To samo *Quelle est la date aujourd'hui ?*, którego uczyłeś się przy pytaniu o datę.
  fr.a1.unit08.lesson03.teach.line04:
    title: Podaj dzisiejszą datę i odstęp w czasie
    gloss: Mathieu mówi, że dziś jest piętnasty marca, więc to za tydzień.
    note: '*Dans une semaine* („za tydzień”) wyraża odległość w czasie od dzisiaj.'
  fr.a1.unit08.lesson03.teach.line05:
    title: Zareaguj planem
    gloss: Inès mówi, że świetnie, bo ma czas przygotować deser na tę okazję.
    note: '*J''ai le temps de* + bezokolicznik („mam czas, żeby”) to częsty sposób powiedzenia, że jest dość czasu na coś.'
  fr.a1.unit08.lesson03.teach.line06:
    title: Potwierdź plan
    gloss: Mathieu mówi, że to dobry pomysł, więc widzą się w przyszłą sobotę, dwudziestego drugiego.
    note: '*Samedi prochain* („w przyszłą sobotę”) potwierdza jednocześnie dzień tygodnia i datę, kończąc rozmowę.'
