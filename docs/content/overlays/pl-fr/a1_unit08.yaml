answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francuski A1
  description: 'Dni tygodnia i podawanie daty (le + liczebnik główny + miesiąc, z jedynym wyjątkiem le premier) – dalszy ciąg historii warsztatów kulinarnych Inès i Mathieu, tym razem o planowaniu ostatniego spotkania. Zwróć uwagę: po francusku w datach używa się liczebników głównych (le quinze mars), a nie porządkowych jak w polskim „piętnastego marca”; wyjątkiem jest pierwszy dzień miesiąca.'
units:
  fr.a1.unit08.dates:
    title: Jaka jest data?
