teaching:
  fr.a1.unit50.lesson01.teach.appeler:
    title: Dzwonić
    gloss: dzwonić
    note: Bezokolicznik czasownika oznaczającego telefonowanie.
    example_gloss: Muszę do ciebie zadzwonić.
  fr.a1.unit50.lesson01.teach.je_t_appelle:
    title: Mówimy, że zadzwonimy
    gloss: Zadzwonię do ciebie.
    note: '*Appelle* to forma *je* czasownika *appeler*; po francusku użyto tu czasu teraźniejszego, choć po polsku powiedzielibyśmy „zadzwonię”.'
  fr.a1.unit50.lesson01.teach.allo_c_est:
    title: Odbieranie telefonu
    gloss: Halo, tu Camille.
    note: '*C''est* + imię to standardowy sposób przedstawienia się przez telefon; po polsku mówimy „tu…”.'
  fr.a1.unit50.lesson01.teach.allo_c_est_2:
    title: Mathieu odpowiada tak samo
    gloss: Halo, tu Mathieu.
    note: Ten sam wzór *c'est* + imię co w *Allô, c'est Camille*.
  fr.a1.unit50.lesson02.teach.qui_est_a:
    title: Pytanie, kto dzwoni
    gloss: Z kim rozmawiam?
    note: '*Qui est à l''appareil ?* to standardowy sposób, by zapytać nieznanego rozmówcę, kim jest.'
  fr.a1.unit50.lesson02.teach.vous_parlez_avec:
    title: Przedstawianie się oficjalnie
    gloss: Rozmawia Pan/Pani z Camille.
    note: '*Vous parlez avec* + imię to formalny odpowiednik *c''est* + imię.'
  fr.a1.unit50.lesson03.teach.tu_peux_repeter:
    title: Prośba o powtórzenie
    gloss: Możesz to powtórzyć?
    note: '*Tu peux ...* (Możesz ...?) + bezokolicznik *répéter* (powtórzyć).'
  fr.a1.unit50.lesson03.teach.ne_parle_pas:
    title: Prośba o wolniejsze mówienie
    gloss: Nie mów tak szybko, proszę.
    note: '*Ne parle pas si vite* zawiera przeczenie: *ne ... pas* otacza czasownik *parle*, a *si* znaczy „tak”.'
  fr.a1.unit50.lesson03.teach.je_ne_t:
    title: Mówimy, że słabo słychać
    gloss: Słabo cię słyszę.
    note: '*Entendre* (słyszeć) z *ne ... pas bien* wyraża problem ze słyszeniem i różni się od *comprendre* (rozumieć).'
  fr.a1.unit50.lesson04.teach.le_sms:
    title: SMS
    gloss: wiadomość, SMS
    note: '*SMS* jest rodzaju męskiego: *un SMS*; to skrót zapożyczony wprost z angielskiego, używany międzynarodowo.'
    example_gloss: SMS jest od Camille.
  fr.a1.unit50.lesson04.teach.je_t_envoie:
    title: Zapowiedź wysłania wiadomości
    gloss: Wyślę ci wiadomość.
    note: '*Envoyer* (wysyłać) wymaga zaimka *te* (tu *t''*) przed czasownikiem, a potem *un SMS*.'
  fr.a1.unit50.lesson04.teach.je_te_rappelle:
    title: Zapowiedź oddzwonienia
    gloss: Zadzwonię do ciebie później.
    note: W *rappeler* (oddzwonić) przedrostek *re-* już niesie znaczenie „z powrotem”; *plus tard* znaczy „później”.
  fr.a1.unit50.lesson05.teach.mathieu_salut_camille:
    title: Przeczytaj wymianę wiadomości
    gloss: 'Mathieu: Cześć Camille, możesz do mnie zadzwonić? Muszę ci coś powiedzieć. Camille: Jasne, oddzwonię do ciebie za pięć minut.'
    note: Zwróć uwagę, o co prosi Mathieu, dlaczego i kiedy Camille obiecuje oddzwonić.
    glosses:
      Salut: cześć
      peux: możesz
      m'appeler: zadzwonić
      dois: muszę
      truc: coś
      dire: opowiedzieć, powiedzieć
      évidemment: jasne
      rappelle: z powrotem
      cinq: pięć
      minutes: minuty
  fr.a1.unit50.lesson06.teach.mathieu_allo_c:
    title: Mathieu odbiera telefon
    gloss: 'Mathieu: Halo, tu Mathieu.'
    note: 'Ten sam schemat *c''est* + imię z lekcji 1, tym razem w prawdziwej rozmowie telefonicznej: osoba, która odbiera, mówi pierwsza i podaje swoje imię.'
  fr.a1.unit50.lesson06.teach.camille_salut_mathieu:
    title: Camille się przedstawia
    gloss: 'Camille: Cześć Mathieu, tu Camille. Mathieu: Miło, że dzwonisz!'
    note: '*C''est sympa que* ... (miło, że ...) wyraża pozytywną reakcję na jakieś wydarzenie; *appelles* to specjalna forma, którą tu po prostu zapamiętaj.'
  fr.a1.unit50.lesson06.teach.camille_comment_s:
    title: Camille pyta o pierwszą zmianę w pracy
    gloss: 'Camille: Jak poszła twoja pierwsza zmiana?'
    note: '*Comment s''est passé ... ?* to passé composé czasownika *se passer* (dziać się, przebiegać), tworzone z *être*; służy do pytania, jak coś poszło.'
  fr.a1.unit50.lesson06.teach.mathieu_ca_s:
    title: Mathieu opowiada dobrą wiadomość
    gloss: 'Mathieu: Poszła bardzo dobrze, lepiej, niż myślałem.'
    note: '*Ça s''est très bien passé* i *je pensais* to tutaj utarte wyrażenia; *je pensais* to imparfait czasownika *penser* (myśleć).'
  fr.a1.unit50.lesson06.teach.au_passe_compose:
    title: Passé composé z avoir i être
    gloss: s'est passé → wydarzyć się, przebiec; j'ai pensé → pomyśleć; je suis allé → pójść, pojechać
    note: 'Passé composé składa się z *avoir* lub *être* + imiesłowu: *j''ai pensé*, *je suis allé*. *Ça s''est passé* to utarte wyrażenie oznaczające „poszło”; na razie po prostu zapamiętaj je w kontekstach z tej lekcji.'
  fr.a1.unit50.lesson06.teach.camille_ca_fait:
    title: Camille jest dumna
    gloss: 'Camille: Miło to słyszeć! Jestem z ciebie dumna.'
    note: '*Fière de* (dumna z) to stałe połączenie; potrzebne jest *de*, a nie *pour*; *fière* jest tu w rodzaju żeńskim.'
  fr.a1.unit50.lesson06.teach.mathieu_merci_beaucoup:
    title: Mathieu jest wzruszony
    gloss: 'Mathieu: Dziękuję bardzo, wiele to dla mnie znaczy.'
    note: '*Compter* znaczy tu „mieć znaczenie”: *ça compte pour moi* (to ma dla mnie znaczenie); *pour moi* mówi, dla kogo to ważne.'
  fr.a1.unit50.lesson06.teach.son_premier_service:
    title: Jego
    gloss: Jego pierwsza zmiana poszła bardzo dobrze.
    note: '*Son* to tutaj zaimek dzierżawczy „jego”, a nie czasownik: *son premier service* (jego pierwsza zmiana); *son* pasuje do rodzaju męskiego słowa *service*.'
