    title: Camille i Mathieu rozmawiają o hobby
  fr.a1.unit52.lesson05.mathieu_et_camille_comparent:
    title: Mathieu i Camille porównują swoje hobby
  fr.a1.unit52.lesson06.planifier_un_week_end:
    title: Planowanie wspólnego weekendu
teaching:
  fr.a1.unit52.lesson01.teach.lire_faire_du:
    title: Czytanie, sport, gotowanie
    gloss: czytać, uprawiać sport, gotować
    note: 'Trzy popularne czasowniki związane z hobby: *lire* (czytać), *faire du sport* (uprawiać sport) i *cuisiner* (gotować).'
    example_gloss:
    - Lubię czytać książkę.
    - W soboty uprawiam sport.
    - Lubię gotować dla przyjaciół.
  fr.a1.unit52.lesson01.teach.le_temps_libre:
    title: Czas wolny
    gloss: czas wolny
    note: '*Temps libre* jest rodzaju męskiego: *le temps libre*. To kluczowe wyrażenie, gdy mówisz o hobby.'
    example_gloss: W wolnym czasie lubię czytać.
  fr.a1.unit52.lesson01.teach.pendant_mon_temps:
    title: Mówimy, co robisz w wolnym czasie
    gloss: W wolnym czasie lubię czytać.
    note: '*Lis* to forma *je* czasownika *lire* (czytać); końcowe *s* jest niemie.'
  fr.a1.unit52.lesson02.teach.ecouter_de_la:
    title: Muzyka, rysowanie, gry wideo
    gloss: słuchać muzyki, rysować, grać w gry wideo
    note: 'Trzy kolejne hobby: *écouter de la musique*, *dessiner* i *jouer aux jeux vidéo*. Przy grach *jouer à* + *les* zmienia się w *jouer aux*.'
    example_gloss:
    - Lubię słuchać muzyki.
    - Często rysuję.
    - Lubię grać w gry wideo z przyjaciółmi.
  fr.a1.unit52.lesson02.teach.j_aime_ecouter:
    title: Mówimy, że lubisz słuchać muzyki
    gloss: Lubię słuchać muzyki.
    note: 'Po *écouter* dopełnienie następuje bezpośrednio, bez przyimka: *écouter de la musique*.'
  fr.a1.unit52.lesson02.teach.j_aime_jouer:
    title: Mówimy, że lubisz grać z przyjaciółmi
    gloss: Lubię grać w gry wideo z przyjaciółmi.
    note: '*Avec des amis* (z przyjaciółmi) wykorzystuje słowo *amis* z lekcji 1; *des* to rodzajnik nieokreślony liczby mnogiej.'
  fr.a1.unit52.lesson03.teach.toujours_souvent_parfois:
    title: Zawsze, często, czasami, nigdy
    gloss: zawsze, często, czasami, nigdy
    note: Cztery podstawowe przysłówki częstotliwości. *Souvent* może być już znane; *toujours*, *parfois* i *jamais* są nowe. *Jamais* wymaga *ne* przed czasownikiem.
    example_gloss:
    - W soboty zawsze ćwiczę.
    - Często czytam książkę.
    - Czasami rysuję.
    - Nigdy nie gram w gry.
  fr.a1.unit52.lesson03.teach.chaque_semaine_chaque:
    title: Co tydzień, w każdy weekend
    gloss: co tydzień, w każdy weekend
    note: '*Chaque semaine* i *chaque week-end* oznaczają „co tydzień” i „co weekend”. *Chaque* nigdy się nie zmienia, niezależnie od rodzaju rzeczownika.'
    example_gloss:
    - Co tydzień gotuję dla przyjaciół.
    - Co weekend ćwiczę.
  fr.a1.unit52.lesson03.teach.chaque_ne_change:
    title: Chaque nigdy się nie zmienia
    gloss: '*Chaque* pozostaje takie samo przed rzeczownikami rodzaju męskiego i żeńskiego: *chaque semaine*, *chaque week-end*.'
    note: '*Semaine* jest rodzaju żeńskiego, a *week-end* męskiego, a mimo to *chaque* jest w obu przypadkach identyczne. Porównaj *tous les* / *toutes les*, które się zmieniają.'
  fr.a1.unit52.lesson03.teach.qu_est_ce:
    title: Pytamy o czas wolny
    gloss: Co robisz w wolnym czasie?
    note: To główne pytanie tej lekcji — użyj go, by zapytać kogokolwiek o hobby.
  fr.a1.unit52.lesson04.teach.camille_on_se:
    title: Camille zaczyna temat hobby
    gloss: 'Camille: Często razem spacerujemy. Ale co jeszcze robisz w wolnym czasie, Mathieu?'
    note: '*On se promène souvent* używa *on* w znaczeniu „my”, a *souvent* stoi zaraz po czasowniku.'
  fr.a1.unit52.lesson04.teach.mathieu_j_aime:
    title: Hobby Mathieu
    gloss: 'Mathieu: Lubię gotować, także w domu. I często uprawiam sport.'
    note: '*Même à la maison* (nawet w domu) pokazuje, że Mathieu gotuje dla przyjemności, a nie tylko w pracy.'
  fr.a1.unit52.lesson04.teach.camille_tu_cuisines:
    title: Camille jest zaskoczona
    gloss: 'Camille: Gotujesz też w domu? Przecież już cały dzień gotujesz w pracy!'
    note: '*Toute la journée* (cały dzień) podkreśla, jak dużo Mathieu już gotuje w pracy.'
  fr.a1.unit52.lesson04.teach.mathieu_oui_mais:
    title: Mathieu wyjaśnia
    gloss: 'Mathieu: Tak, ale gotowanie uważam za relaksujące. A ty, co lubisz robić?'
    note: '*Cuisiner, je trouve ça relaxant* stawia *cuisiner* na początku dla podkreślenia: dosłownie „gotować, uważam to za relaksujące”.'
  fr.a1.unit52.lesson04.teach.camille_j_aime:
    title: Hobby Camille
    gloss: 'Camille: Lubię czytać i często słucham muzyki.'
    note: Łączy dwa hobby z lekcji 1 i 2 w jednym zdaniu za pomocą *et* (i).
  fr.a1.unit52.lesson04.teach.mathieu_tu_joues:
    title: Mathieu pyta o gry
    gloss: 'Mathieu: Ty też grasz w gry wideo?'
    note: 'Krótkie pytanie typu tak/nie: *Tu joues aussi aux jeux vidéo ?* O tym, że to pytanie, decyduje rosnąca intonacja.'
  fr.a1.unit52.lesson04.teach.camille_non_je:
    title: Camille odpowiada
    gloss: 'Camille: Nie, nigdy nie gram w gry wideo. Ale czasem rysuję!'
    note: '*Jamais* (nigdy) i *parfois* (czasem) z lekcji 3, zestawione w jednej odpowiedzi.'
  fr.a1.unit52.lesson05.teach.mathieu_et_moi:
    title: Porównujemy hobby
    gloss: Mathieu i ja często spacerujemy razem. Ale mamy też inne hobby. Mathieu lubi gotować, nawet w domu, i często uprawia sport. Ja lubię czytać i często słucham muzyki. Czasem rysuję, ale nigdy nie gram w gry wideo. Co lubisz robić w wolnym czasie?
    note: Wiadomość Camille podsumowuje fakty z lekcji 4 i kończy się pytaniem do czytelnika, które jest głównym pytaniem tej lekcji.
    glosses:
      promène: spacerować
      souvent: często
      ensemble: razem
      d'autres: inne
      cuisiner: gotuje
      aime: chętnie
      maison: w domu
      sport: uprawia (sport)
      lire: czytam
      j'écoute: słucham
      musique: muzyka
      dessine: rysuję
      parfois: czasami
      jeux: gram w gry wideo
      jamais: nigdy
      libre: wolny
      temps: czas
  fr.a1.unit52.lesson06.teach.mathieu_qu_est:
    title: Mathieu pyta o weekend
    gloss: 'Mathieu: Co robisz w ten weekend?'
    note: W *ce week-end* (w ten weekend) użyto *ce*, ponieważ *week-end* jest rodzaju męskiego.
  fr.a1.unit52.lesson06.teach.camille_je_ne:
    title: Camille jeszcze nie wie
    gloss: 'Camille: Jeszcze nie wiem. Lubię czytać, ale chcę też wyjść.'
    note: '*Sortir* (wychodzić, wyjść) to częsty sposób, by powiedzieć, że chce się wyjść z domu.'
  fr.a1.unit52.lesson06.teach.mathieu_on_se:
    title: Mathieu proponuje plan
    gloss: 'Mathieu: Pójdziemy razem na spacer? Potem ugotuję coś dla nas.'
    note: '*Après* (potem) porządkuje w czasie dwa plany, podobnie jak *d''abord* i *ensuite*.'
  fr.a1.unit52.lesson06.teach.camille_bonne_idee:
    title: Camille się zgadza
    gloss: 'Camille: Świetny pomysł! Tak samo lubię spacerować, jak gotować.'
    note: '*Autant ... que* (tak samo ... jak) pokazuje, że Camille lubi obie rzeczy jednakowo, żadnej nie przedkłada nad drugą.'
  fr.a1.unit52.lesson06.teach.mathieu_parfait_alors:
    title: Mathieu potwierdza
    gloss: 'Mathieu: Doskonale. W takim razie widzimy się w sobotę!'
    note: Przyjazne zakończenie, które potwierdza plan na *samedi* (sobotę).
