  fr.a1.unit01.lesson04.wellbeing:
    title: Krótka wymiana zdań o samopoczuciu
  fr.a1.unit01.lesson05.first_meeting_small_talk:
    title: Poznawanie się w sąsiedztwie
  fr.a1.unit01.lesson06.workshop_dialogue:
    title: Pierwsze spotkanie na warsztatach
teaching:
  fr.a1.unit01.lesson01.teach.bonjour:
    title: Neutralne powitanie
    gloss: dzień dobry
    note: Bonjour pasuje wobec nieznajomych, współpracowników i przyjaciół w ciągu dnia. Podobnie jak polskie „dzień dobry” oznacza dosłownie „dobry dzień”.
  fr.a1.unit01.lesson01.teach.salut:
    title: Nieformalne powitanie
    gloss: cześć
    note: Salut jest na poufałą relację. Może zaczynać i kończyć rozmowę, ale nie jest najbezpieczniejszym wyborem wobec nieznanej dorosłej osoby.
  fr.a1.unit01.lesson01.teach.au_revoir:
    title: Neutralne pożegnanie
    gloss: do widzenia
    note: Au revoir pasuje zarówno w sytuacjach uprzejmych, jak i nieformalnych.
  fr.a1.unit01.lesson01.teach.tu:
    title: Nieformalne „ty”
    gloss: ty (nieformalnie, liczba pojedyncza)
    note: 'Tu to zwrot do jednej osoby: przyjaciela, dziecka lub kogoś, z kim jesteś wyraźnie na ty. Podobnie jak polskie „ty” wymaga własnych form czasownika.'
  fr.a1.unit01.lesson01.teach.vous:
    title: Grzecznościowe lub mnogie „wy”
    gloss: Pan/Pani; wy
    note: Vous to bezpieczny wybór wobec jednej nieznanej dorosłej osoby, a także forma używana wobec grupy. Po polsku odpowiadają mu „Pan/Pani” oraz „wy/Państwo”, a po francusku wszystkie te role pełni jedno słowo.
  fr.a1.unit01.lesson01.teach.comment_allez_vous:
    title: Formalne pytanie o samopoczucie
    gloss: Jak się Pan/Pani miewa?
    note: Allez to forma vous czasownika aller. Czasownik i zaimek są w inwersji i połączone łącznikiem. To utarte, grzecznościowe pytanie, a nie dosłowne pytanie o to, dokąd ktoś idzie.
  fr.a1.unit01.lesson01.teach.comment_vas_tu:
    title: Nieformalne pytanie o samopoczucie
    gloss: Jak się Pan/Pani miewa?
    note: Vas to forma tu czasownika aller. Gdy relacja staje się nieformalna, allez-vous zmienia się na vas-tu.
  fr.a1.unit01.lesson01.teach.register_choice:
    title: Dopasuj powitanie do relacji
    gloss: Bonjour z vous; salut z tu
    note: Te połączenia to przydatne ustawienia domyślne, a nie sztywne reguły. Bonjour można też powiedzieć przyjaciołom, ale salut razem z vous zwykle wysyła sprzeczne sygnały.
  fr.a1.unit01.lesson02.teach.je_mappelle:
    title: Podaj swoje imię
    gloss: Nazywam się Camille.
    note: Je m’appelle znaczy dosłownie „wołam siebie”, czyli „nazywam się”. Po francusku zwykle trzeba użyć podmiotu je, choć po polsku zaimek osobowy często się pomija. Samogłoska w me znika przed appelle, stąd m’appelle.
  fr.a1.unit01.lesson02.teach.comment_appelez_vous:
    title: Uprzejme pytanie o imię
    gloss: Jak Pan/Pani ma na imię?
    note: 'Appelez to forma vous czasownika appeler. Drugie vous stoi po czasowniku, bo pytanie ma inwersję: vous appelez-vous.'
  fr.a1.unit01.lesson02.teach.tu_tappelles:
    title: Pytanie o imię w formie nieformalnej
    gloss: Jak Pan/Pani ma na imię?
    note: T’appelles to forma tu ze skróconym przed samogłoską zaimkiem zwrotnym te. W tym codziennym pytaniu tu stoi przed czasownikiem, a comment na końcu.
  fr.a1.unit01.lesson02.teach.moi_cest:
    title: Przedstawienie się w rozmowie
    gloss: Jestem Noé.
    note: Moi, c’est to idiomatyczny, potoczny sposób przedstawienia się. Brzmi bardziej naturalnie niż dosłowne „jestem”.
  fr.a1.unit01.lesson02.teach.enchante:
    title: Forma męska
    gloss: Miło mi poznać.
    note: Mówiący mężczyzna zwykle pisze enchanté. Podobnie jak polskie „zachwycony/zachwycona”, ten przymiotnik zmienia się zależnie od płci mówiącego.
  fr.a1.unit01.lesson02.teach.enchantee:
    title: Forma żeńska
    gloss: Miło mi poznać.
    note: Mówiąca kobieta zwykle pisze enchantée, dodając końcowe e. Enchanté i enchantée wymawia się zazwyczaj tak samo, więc różnicę widać wyraźniej w piśmie niż w mowie.
  fr.a1.unit01.lesson02.teach.et_vous:
    title: Zwrot pytania w formie grzecznościowej
    gloss: A Pan/Pani?
    note: Użyj vous, aby zachować grzecznościowy rejestr lub zwrócić się do grupy.
  fr.a1.unit01.lesson02.teach.et_toi:
    title: Zwrot pytania w formie nieformalnej
    gloss: A Pan/Pani?
    note: Toi to forma akcentowana odpowiadająca tu. Po et używa się toi, nie tu.
  fr.a1.unit01.lesson03.teach.elision_jhabite:
    title: Elizja przed samogłoską
    gloss: mieszkam
    note: 'Je traci samogłoskę przed habite, a apostrof zapisuje tę elizję: j’habite. Litera h w habiter nie blokuje elizji.'
  fr.a1.unit01.lesson03.teach.liaison_vous_etes:
    title: Liaison po vous
    gloss: jesteście; jest Pan/Pani
    note: 'Końcowe s w vous jest zwykle nieme, ale przed samogłoską w êtes łączy się w dźwięk z: vous êtes brzmi mniej więcej jak vu-ZET. Liaison należy do wymowy frazy, a nie do jej pisowni.'
  fr.a1.unit01.lesson03.teach.liaison_un_atelier:
    title: Liaison po un
    gloss: warsztat
    note: Końcowe n w un łączy się z atelier. Nie rób wyraźnej przerwy między tymi dwoma słowami.
  fr.a1.unit01.lesson03.teach.final_e_enchante:
    title: Pisownia męska
    gloss: miło mi (mówi mężczyzna)
    note: Enchanté kończy się na é, gdy mówi mężczyzna. Sylaba -an- zawiera samogłoskę nosową, więc nie wymawiaj osobnego dźwięku n, jak w polskim „an”.
  fr.a1.unit01.lesson03.teach.final_e_enchantee:
    title: Pisownia żeńska
    gloss: miło mi (mówi kobieta)
    note: Enchantée dodaje e dla formy żeńskiej, ale to dodatkowe e zwykle nie tworzy kolejnej wymawianej sylaby.
  fr.a1.unit01.lesson03.teach.question_liaison:
    title: Czytanie pytania z inwersją
    gloss: Jak się Pan/Pani miewa?
    note: Czytaj allez-vous jako jedną całość pytania. Litera z w allez nie jest tu wymawiana jako dodatkowe z; standardowa wymowa to mniej więcej ale wu.
  fr.a1.unit01.lesson04.teach.ca_va:
    title: Codzienne pytanie o samopoczucie
    gloss: Jak leci?; Wszystko w porządku?
    note: Ça zawiera cedillę, która sprawia, że c brzmi jak s przed a. To samo wyrażenie może być pytaniem lub odpowiedzią, zależnie od intonacji.
  fr.a1.unit01.lesson04.teach.tres_bien:
    title: Bardzo pozytywna odpowiedź
    gloss: Bardzo dobrze, dziękuję.
    note: Très wzmacnia bien. Jego końcowe s jest nieme.
  fr.a1.unit01.lesson04.teach.ca_va_bien:
    title: Pozytywna odpowiedź
    gloss: Dobrze się mam.
    note: W tej utartej odpowiedzi po francusku nie używa się zaimka je.
  fr.a1.unit01.lesson04.teach.pas_mal:
    title: Umiarkowanie pozytywna odpowiedź
    gloss: Nieźle.
    note: Pas mal jest zwykle lekko pozytywne, podobnie jak polskie „nieźle”.
  fr.a1.unit01.lesson04.teach.fatigue:
    title: 'Zgodność przymiotnika: forma męska'
    gloss: Jestem trochę zmęczony.
    note: Suis to forma je czasownika être. Mówiący mężczyzna pisze fatigué, tak jak po polsku „zmęczony”.
  fr.a1.unit01.lesson04.teach.fatiguee:
    title: 'Zgodność przymiotnika: forma żeńska'
    gloss: Jestem trochę zmęczona.
    note: Mówiąca kobieta pisze fatiguée z końcowym e. Formę męską i żeńską wymawia się zwykle tak samo.
  fr.a1.unit01.lesson04.teach.et_vous:
    title: Grzeczne zwrócenie pytania
    gloss: A Pan/Pani?
    note: Vous zachowuje pełen szacunku rejestr używany wobec nieznanej dorosłej osoby.
  fr.a1.unit01.lesson04.teach.et_toi:
    title: Nieformalne zwrócenie pytania
    gloss: A Pan/Pani?
    note: Użyj toi po et, gdy nieformalnie mówisz do jednego przyjaciela lub rówieśnika.
  fr.a1.unit01.lesson05.teach.here_for_workshop:
    title: Upewnienie się, w jakim celu ktoś przyszedł
    gloss: Jest Pan/Pani tu na warsztaty?
    note: Êtes to forma vous czasownika être. Pytanie powstaje dzięki wznoszącej intonacji, bez żadnego dodatkowego czasownika pomocniczego.
  fr.a1.unit01.lesson05.teach.yes_thats_it:
    title: Potwierdzenie przypuszczenia
    gloss: Tak, zgadza się.
    note: C’est ça to naturalne potwierdzenie, a nie dosłowne „to jest to”.
  fr.a1.unit01.lesson05.teach.live_neighborhood:
    title: Pytanie o miejsce zamieszkania
    gloss: Mieszka Pan/Pani w tej okolicy?
    note: Habitez to forma vous czasownika habiter. Pytanie można utworzyć szykiem zdania oznajmującego, dodając pytającą intonację.
  fr.a1.unit01.lesson05.teach.i_live:
    title: Powiedz, gdzie mieszkasz
    gloss: Mieszkam w Montreuil.
    note: J’habite to forma je czasownika habiter z elizją. À wskazuje miasto i nie wolno go mylić z a, formą czasownika avoir.
  fr.a1.unit01.lesson05.teach.from_here:
    title: Pytanie o lokalne pochodzenie
    gloss: Jest Pan/Pani stąd?
    note: D’ici łączy de i ici przez elizję. Êtes pozostaje formą vous czasownika être.
  fr.a1.unit01.lesson05.teach.from_lille:
    title: Powiedz, skąd pochodzisz
    gloss: Jestem z Lille.
    note: Suis to forma je czasownika être. Przed nazwą miasta, podając pochodzenie, używa się de.
  fr.a1.unit01.lesson05.teach.workshop_starts:
    title: Zajęcia się zaczynają
    gloss: Warsztat się zaczyna.
    note: Atelier jest rodzaju męskiego, więc jego rodzajnik w liczbie pojedynczej to le. Przed samogłoską le zmienia się w l’. Commence to forma trzeciej osoby liczby pojedynczej.
  fr.a1.unit01.lesson05.teach.see_you_shortly:
    title: Pożegnanie na krótko
    gloss: do zobaczenia za chwilę; do zobaczenia dziś
    note: À tout à l’heure sugeruje kolejne spotkanie jeszcze tego samego dnia, w przeciwieństwie do ogólnego pożegnania bez przewidywanego terminu.
  fr.a1.unit01.lesson06.teach.line01:
    title: Rozpoczęcie spotkania
    gloss: Inès wita Mathieu i upewnia się, że przyszedł na warsztaty kulinarne.
    note: Rozmówcy zaczynają od vous, bo są dla siebie nieznajomymi dorosłymi.
  fr.a1.unit01.lesson06.teach.line02:
    title: Rozpoczęcie spotkania, odpowiedź
    gloss: Mathieu potwierdza i podaje swoje imię, po czym pyta o jej imię.
    note: Je m’appelle to standardowy sposób podania imienia.
  fr.a1.unit01.lesson06.teach.line03:
    title: Wymiana imion
    gloss: Inès podaje swoje imię i mówi, że miło jej go poznać.
    note: Enchantée jest w zgodzie z Inès (rodzaj żeński); końcówka -e jest zapisana, ale zwykle jej nie słychać.
  fr.a1.unit01.lesson06.teach.line04:
    title: Wymiana imion, odpowiedź
    gloss: Mathieu odwzajemnia uprzejmość i pyta, czy mieszka w pobliżu.
    note: Enchanté jest w zgodzie z Mathieu (rodzaj męski), to samo słowo, którego użyła Inès, tylko bez niemego -e.
  fr.a1.unit01.lesson06.teach.line05:
    title: Wymiana informacji o okolicy
    gloss: Inès potwierdza i podaje swoją ulicę, po czym zadaje Mathieu to samo pytanie.
    note: Po j’habite przed nazwą ulicy nie ma przyimka przed rue.
  fr.a1.unit01.lesson06.teach.line06:
    title: Wymiana informacji o okolicy, odpowiedź
    gloss: Mathieu mówi, że mieszka w Saint-Ouen, i pyta, czy ona jest stąd.
    note: J’habite à używa à przed nazwą miejscowości, inaczej niż wyrażenie z ulicą, którego użyła Inès.
  fr.a1.unit01.lesson06.teach.line07:
    title: Wymiana informacji o pochodzeniu
    gloss: Inès mówi, że nie jest stąd, tylko z Lille, po czym pyta Mathieu.
    note: Je suis de + nazwa miasta mówi, skąd ktoś pochodzi.
  fr.a1.unit01.lesson06.teach.line08:
    title: Wymiana informacji o pochodzeniu, odpowiedź
    gloss: Mathieu mówi, że jest z Lyonu.
    note: Ten sam wzorzec je suis de, którego przed chwilą użyła Inès.
  fr.a1.unit01.lesson06.teach.line09:
    title: Przerwanie rozmowy
    gloss: Inès zauważa, że warsztat się zaczyna, i mówi, że zaraz się zobaczą.
    note: À tout à l’heure pasuje, bo obie osoby zostaną na tym samym wydarzeniu.
  fr.a1.unit01.lesson06.teach.line10:
    title: Przerwanie rozmowy, odpowiedź
    gloss: Mathieu powtarza to samo pożegnanie.
    note: Powtórzenie à tout à l’heure to naturalny sposób potwierdzenia.
exercises:
  fr.a1.unit01.lesson01.exercise01.listen_bonjour:
    instruction: Posłuchaj i wybierz wyrażenie, które słyszysz.
    correct_option: Bonjour.
    distractors:
    - Salut !
    - Au revoir.
    accepted_answers:
    - Bonjour.
    - Bonjour
  fr.a1.unit01.lesson01.exercise02.choose_informal:
    instruction: Który zaimek pasuje do tego nieformalnego powitania?
    correct_option: tu
    distractors:
    - vous
    accepted_answers:
    - tu
    feedback: Salut i tu tworzą spójne, nieformalne połączenie.
  fr.a1.unit01.lesson01.exercise03.choose_polite_pronoun:
    instruction: Uzupełnij powitanie skierowane do jednej nieznajomej dorosłej osoby.
    accepted_answers:
    - vous
    feedback: Vous to bezpieczny, uprzejmy wybór wobec nieznajomej dorosłej osoby.
  fr.a1.unit01.lesson01.exercise04.order_polite_question:
    instruction: Ułóż w odpowiedniej kolejności grzeczne pytanie o samopoczucie.
    correct_response:
    - Comment
    - allez-vous
  fr.a1.unit01.lesson01.exercise05.listen_informal_question:
    instruction: Wpisz nieformalne pytanie, które słyszysz.
    accepted_answers:
    - Comment vas-tu ?
    - Comment vas-tu?
    - Comment vas tu ?
    - Comment vas tu?
  fr.a1.unit01.lesson01.exercise06.match_register:
    instruction: Dopasuj każde powitanie do jego zwykłego rejestru na poziomie początkującym.
    correct_response:
      Bonjour: vous
      Salut: ty
    pairs:
    - left: Bonjour
      right: vous
    - left: Salut
      right: ty
  fr.a1.unit01.lesson01.exercise07.complete_farewell:
    instruction: Uzupełnij neutralne pożegnanie.
    accepted_answers:
    - revoir
  fr.a1.unit01.lesson01.exercise08.speak_greeting:
    instruction: Użyj grzecznego powitania, zapytaj rozmówcę, jak się czuje, i zakończ rozmowę.
    accepted_answers:
    - Bonjour. Comment allez-vous ? Au revoir.
    - Bonjour, comment allez-vous ? Au revoir.
  fr.a1.unit01.lesson02.exercise01.order_self_intro:
    instruction: Ułóż przedstawienie się Camille.
    correct_response:
    - Je
    - m’appelle
    - Camille
  fr.a1.unit01.lesson02.exercise02.listen_name_question:
    instruction: Posłuchaj i wybierz grzeczne pytanie o imię.
    correct_option: Comment vous appelez-vous ?
    distractors:
    - Tu t’appelles comment ?
    - Comment allez-vous ?
    accepted_answers:
    - Comment vous appelez-vous ?
    - Comment vous appelez vous ?
  fr.a1.unit01.lesson02.exercise03.informal_name_question:
    instruction: Po nieformalnym powitaniu zapytaj drugą osobę o imię.
    accepted_answers:
    - Tu t’appelles comment ?
    - Tu t'appelles comment ?
    - Tu t’appelles comment?
    - Tu t'appelles comment?
  fr.a1.unit01.lesson02.exercise04.complete_moi_cest:
    instruction: Uzupełnij potoczne przedstawienie się Noé.
    accepted_answers:
    - c’est
    - c'est
  fr.a1.unit01.lesson02.exercise05_choose_enchantee:
    instruction: Czy zapis słowa w wypowiedzi Camille jest poprawnie oznaczony jako żeński?
    correct_option: Tak — enchantée ma żeńskie końcowe e.
    distractors:
    - Nie — formą żeńską jest enchanté.
    - Nie — obie formy zapisuje się tak samo.
    accepted_answers:
    - Tak — enchantée ma żeńskie końcowe e.
    feedback: Enchantée ma końcowe e, którego używa kobieta.
  fr.a1.unit01.lesson02.exercise06_return_polite_question:
    instruction: Zadaj to samo pytanie, nie zmieniając grzecznego rejestru.
    accepted_answers:
    - Et vous ?
    - Et vous?
  fr.a1.unit01.lesson02.exercise07.match_introductions:
    instruction: Dopasuj uzupełniające się formy przedstawiania się i formy zgodne z rodzajem.
    correct_response:
      Je m’appelle Camille.: Moi, c’est Noé.
      Enchanté.: Enchantée.
    pairs:
    - left: Je m’appelle Camille.
      right: Moi, c’est Noé.
    - left: Enchanté.
      right: Enchantée.
  fr.a1.unit01.lesson02.exercise08.write_introduction:
    instruction: 'Napisz przedstawienie się Camille: przywitaj się słowem Bonjour, podaj imię za pomocą Je m’appelle i dodaj zwrot używany przy poznawaniu kogoś.'
    accepted_answers:
    - Bonjour. Je m’appelle Camille. Enchanté.
    - Bonjour. Je m'appelle Camille. Enchanté.
    - Bonjour. Je m’appelle Camille. Enchantée.
    - Bonjour. Je m'appelle Camille. Enchantee.
    - Bonjour. Je m'appelle Camille. Enchantée.
    - Bonjour, je m’appelle Camille. Enchanté.
    - Bonjour, je m’appelle Camille. Enchantée.
    - Bonjour, je m'appelle Camille. Enchanté.
    - Bonjour, je m'appelle Camille. Enchantée.
  fr.a1.unit01.lesson03.exercise01_recognize_elision:
    instruction: Z jakich dwóch słów składa się j’habite?
    correct_option: je + habite
    distractors:
    - tu + habite
    - je + être
    accepted_answers:
    - je + habite
  fr.a1.unit01.lesson03.exercise02_complete_elision:
    instruction: Uzupełnij formę z elizją. Zachowaj apostrof widoczny w podpowiedzi.
