teaching:
  fr.a1.unit44.lesson01.teach.je_ne_me:
    title: Złe samopoczucie
    gloss: Nie czuję się dobrze.
    note: '*Se sentir* jest zwrotne (*je me sens*); *ne ... pas bien* to ogólny, łagodny sposób powiedzenia, że coś jest nie tak.'
  fr.a1.unit44.lesson01.teach.malade:
    title: Chory
    gloss: chory
    note: 'Podstawowy przymiotnik, używany z *être*: *je suis malade*.'
    example_gloss: Jestem chory.
  fr.a1.unit44.lesson01.teach.je_suis_malade:
    title: Być chorym
    gloss: Jestem chory.
    note: '*Malade* opisuje stan ogólniejszy i poważniejszy niż *pas bien*.'
  fr.a1.unit44.lesson01.teach.mal_a_la:
    title: Ból głowy
    gloss: ból głowy
    note: '*Mal à la tête* łączy się z *avoir*: *j''ai mal à la tête*; *à la*, bo *tête* jest rodzaju żeńskiego.'
    example_gloss: Boli mnie głowa.
  fr.a1.unit44.lesson01.teach.j_ai_mal:
    title: Mieć ból głowy
    gloss: Boli mnie głowa.
    note: 'Objawy łączą się z *avoir* („mieć”): *j''ai mal*.'
  fr.a1.unit44.lesson01.teach.mal_au_ventre:
    title: Ból brzucha
    gloss: ból brzucha
    note: '*Mal au ventre*: *au* to połączone *à* + *le*, bo *ventre* jest rodzaju męskiego.'
    example_gloss: Boli mnie brzuch.
  fr.a1.unit44.lesson01.teach.j_ai_mal_2:
    title: Mieć ból brzucha
    gloss: Boli mnie brzuch.
    note: Ten sam schemat z *avoir* co w *mal à la tête*, tylko z *au* zamiast *à la*.
  fr.a1.unit44.lesson02.teach.qu_est_ce:
    title: Pytanie ogólne
    gloss: Co się stało?
    note: Ogólne pytanie, którego możesz użyć, gdy podejrzewasz, że coś jest nie tak.
  fr.a1.unit44.lesson02.teach.qu_est_ce_2:
    title: Częsty zwrot
    gloss: O co chodzi?
    note: '*Qu''est-ce qui ne va pas ?* to stałe pytanie, dosłownie „co nie idzie dobrze”; nie tłumacz go słowo w słowo.'
  fr.a1.unit44.lesson02.teach.mal_a_la:
    title: Ból gardła
    gloss: ból gardła
    note: '*Mal à la gorge* działa jak *mal à la tête*: *gorge* jest rodzaju żeńskiego, więc *à la*.'
    example_gloss: Boli mnie gardło.
  fr.a1.unit44.lesson02.teach.j_ai_mal:
    title: Mieć ból gardła
    gloss: Boli mnie gardło.
    note: Ten sam schemat z *avoir* co przy innych objawach.
  fr.a1.unit44.lesson02.teach.ca_va_non:
    title: Pytanie o samopoczucie
    gloss: Wszystko w porządku? Nie, nie czuję się dobrze.
    note: '*Ça va ?* to bardzo częste, swobodne pytanie o samopoczucie między znajomymi.'
  fr.a1.unit44.lesson03.teach.la_fievre:
    title: Gorączka
    gloss: gorączka
    note: '*La fièvre* jest rodzaju żeńskiego; po *avoir* występuje z *de la*: *j''ai de la fièvre*.'
    example_gloss: Mam gorączkę.
  fr.a1.unit44.lesson03.teach.j_ai_de:
    title: Mieć gorączkę
    gloss: Mam gorączkę.
    note: Schemat z *avoir*, z partytywnym *de la*.
  fr.a1.unit44.lesson03.teach.le_rhume:
    title: Przeziębienie
    gloss: przeziębiony / mieć przeziębienie
    note: '*Le rhume* to rzeczownik rodzaju męskiego używany z *avoir*, a nie przymiotnik z *être*.'
    example_gloss: Jestem przeziębiony.
  fr.a1.unit44.lesson03.teach.j_ai_un:
    title: Mówimy, że jesteśmy przeziębieni
    gloss: Jestem przeziębiony.
    note: Po francusku mówi się *j'ai un rhume* („mam katar/przeziębienie”); nie mów *je suis rhume*.
  fr.a1.unit44.lesson03.teach.malade_se_dit:
    title: Être czy avoir?
    gloss: '*Malade* jest przymiotnikiem i występuje z *être*: jestem chory. *Mal*, *fièvre* i *rhume* są rzeczownikami i występują z *avoir*: mam przeziębienie.'
    note: 'Wybór między *être* i *avoir* zależy od części mowy: przymiotnik jak *malade* łączy się z *être*, rzeczownik jak *fièvre* z *avoir*, niezależnie od tego, jak krótko trwa choroba.'
  fr.a1.unit44.lesson04.teach.la_pharmacie:
    title: Apteka
    gloss: apteka
    note: '*Pharmacie* jest rodzaju żeńskiego: *la pharmacie*.'
    example_gloss: Idę do apteki.
  fr.a1.unit44.lesson04.teach.je_peux_vous:
    title: Powitanie farmaceuty
    gloss: W czym mogę pomóc?
    note: '*Je peux vous aider ?* to typowe, grzecznościowe powitanie w obsłudze klienta; *vous* to forma grzecznościowa.'
  fr.a1.unit44.lesson04.teach.avez_vous_quelque:
    title: Prośba o coś na objaw
    gloss: Czy ma Pan/Pani coś na ból głowy?
    note: '*Quelque chose contre* + objaw to naturalny sposób, by poprosić o lekarstwo.'
  fr.a1.unit44.lesson04.teach.un_comprime:
    title: Tabletka
    gloss: tabletka
    note: '*Comprimé* jest rodzaju męskiego: *un comprimé*.'
    example_gloss: Biorę tabletkę.
  fr.a1.unit44.lesson04.teach.prenez_un_comprime:
    title: Dawkowanie leku
    gloss: Weź tabletkę dwa razy dziennie.
    note: '*Prenez* to tryb rozkazujący od *prendre* („brać”) w formie *vous*, używany w instrukcjach.'
  fr.a1.unit44.lesson04.teach.a_la_pharmacie:
    title: Rejestr w aptece
    gloss: W aptece używasz grzecznościowej formy *vous*.
    note: Farmaceuta to obca osoba dorosła, wykonująca usługę, więc mówisz do niej *vous*, tak jak przy kasie biletowej.
  fr.a1.unit44.lesson05.teach.conseil_prends_un:
    title: Przeczytaj poradę z apteki
    gloss: 'Rada: weź tabletkę dwa razy dziennie, popijając wodą. Dobrze odpoczywaj i pij dużo wody. Nadal źle się czujesz po trzech dniach? W takim razie idź do lekarza.'
    note: Zwróć uwagę na dawkowanie, dwa zalecenia niezwiązane z lekiem oraz na to, kiedy iść do lekarza.
    glosses:
      Conseil: rada
      prends: brać / weź
      fois: razy
      jour: dzień
      comprimé: tabletka
      Repose-toi: odpoczywać / odpocznij
      bois: pić / pij
      sens: czuć się
      toujours: nadal
      bien: dobrze
      médecin: lekarz / lekarz rodzinny
  fr.a1.unit44.lesson06.teach.camille_salut_mathieu:
    title: Camille pyta, jak się czuje Mathieu
    gloss: 'Camille: Cześć Mathieu, co słychać? Czujesz się już lepiej?'
    note: '*Déjà* („już”) pokazuje, że Camille sprawdza, czy Mathieu poczuł się lepiej od ostatniej rozmowy.'
  fr.a1.unit44.lesson06.teach.mathieu_pas_encore:
    title: Mathieu nadal źle się czuje
    gloss: 'Mathieu: Jeszcze nie za dobrze. Nadal boli mnie głowa i jestem zmęczony.'
    note: '*Toujours* („nadal”) wskazuje, że ból głowy nie minął; *fatigué* („zmęczony”) to nowy, przydatny przymiotnik.'
  fr.a1.unit44.lesson06.teach.camille_tu_as:
    title: Camille pyta o lekarstwo
    gloss: 'Camille: Wziąłeś tabletkę?'
    note: '*Pris* to imiesłów czasu przeszłego od *prendre*, używany z *as* od *avoir*: *tu as pris*.'
  fr.a1.unit44.lesson06.teach.mathieu_oui_j:
    title: Mathieu potwierdza
    gloss: 'Mathieu: Tak, wziąłem tabletkę. Teraz pójdę odpocząć.'
    note: '*Je vais me reposer* („pójdę odpocząć”) tworzy się z *aller* + bezokolicznik i oznacza bliską przyszłość.'
  fr.a1.unit44.lesson06.teach.camille_bonne_idee:
    title: Camille życzy mu zdrowia
    gloss: 'Camille: Dobry pomysł. Dobrze odpocznij. Szybkiego powrotu do zdrowia!'
    note: '*Bon rétablissement !* to stały zwrot, którym życzy się komuś szybkiego powrotu do zdrowia.'
  fr.a1.unit44.lesson06.teach.mathieu_merci_a:
    title: Mathieu się żegna
    gloss: 'Mathieu: Dzięki, do jutra!'
    note: 'W *À demain !* *à* + określenie czasu służy do pożegnań: *à demain*, *à bientôt*.'
