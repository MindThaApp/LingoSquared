course:
  title: Francuski A1
  description: Pytanie o drogę i wskazywanie podstawowych kierunków (à gauche/à droite, tout droit, au coin de la rue, traverser) – ciąg dalszy historii Inès i Mathieu z warsztatów kulinarnych, gdy Inès szuka sklepu z akcesoriami kuchennymi. Warto wiedzieć, że po francusku drogę można wskazywać trybem rozkazującym w formie „vous” („Tournez à gauche”) albo czasem teraźniejszym („Tu tournes à gauche”).
units:
  fr.a1.unit09.directions:
    title: Jak tam trafić?
lessons:
  fr.a1.unit09.lesson01.vocabulaire_directions:
    title: Słowa do szukania drogi
  fr.a1.unit09.lesson02.donner_des_indications:
    title: Wskazywanie drogi
  fr.a1.unit09.lesson03.dialogue_chercher_la_boutique:
    title: W poszukiwaniu sklepu
teaching:
  fr.a1.unit09.lesson01.teach.a_gauche:
    title: Po lewej
    gloss: po lewej / w lewo
    note: '*À gauche* oznacza zarówno położenie („jest po lewej”), jak i kierunek („skręć w lewo”).'
    example_gloss: Skręć w lewo za piekarnią.
  fr.a1.unit09.lesson01.teach.a_droite:
    title: Po prawej
    gloss: po prawej / w prawo
    note: Dokładne przeciwieństwo *à gauche*, używane tak samo.
    example_gloss: Apteka jest na prawo od kawiarni.
  fr.a1.unit09.lesson01.teach.tout_droit:
    title: Prosto
    gloss: prosto
    note: '*Tout droit* znaczy „prosto”. Nie myl tego z *à droite* („w prawo”) – brzmi podobnie, ale znaczy co innego.'
    example_gloss: Idź cały czas prosto aż do targu.
  fr.a1.unit09.lesson01.teach.au_coin_de_la_rue:
    title: Na rogu ulicy
    gloss: na rogu ulicy
    note: '*Au coin de* znaczy „na rogu”; *au coin de la rue* („na rogu ulicy”) to bardzo częsty punkt orientacyjny.'
    example_gloss: Sklep jest na rogu ulicy.
  fr.a1.unit09.lesson01.teach.traverser:
    title: Przechodzić przez
    gloss: przechodzić przez
    note: '*Traverser* to regularny czasownik na -ER: *je traverse*, *tu traverses* itd.'
    example_gloss: Trzeba przejść przez ulicę, żeby dojść do sklepu.
  fr.a1.unit09.lesson01.teach.la_boutique:
    title: Sklep
    gloss: sklep
    note: '*La boutique* to zwykle mały sklep specjalistyczny, a nie duży dom handlowy.'
    example_gloss: Sklep jest na rogu ulicy, po prawej stronie.
  fr.a1.unit09.lesson01.teach.le_carrefour:
    title: Skrzyżowanie
    gloss: skrzyżowanie
    note: '*Le carrefour* to miejsce, w którym krzyżują się dwie ulice – częsty punkt orientacyjny we wskazówkach mówionych.'
    example_gloss: Na skrzyżowaniu skręć w lewo.
  fr.a1.unit09.lesson02.teach.pour_aller_a:
    title: Pytanie, jak gdzieś dojść
    gloss: Przepraszam, jak dojść do sklepu?
    note: '*Pour aller à... ?* (dosłownie „żeby iść do...”) to standardowy, grzeczny sposób zapytania o drogę do jakiegoś miejsca.'
  fr.a1.unit09.lesson02.teach.tournez_a_gauche:
    title: Skręć w lewo
    gloss: Proszę skręcić w lewo za apteką.
    note: '*Tournez* to forma rozkazująca od *tourner* („skręcać”) w 2. osobie liczby mnogiej (*vous*) – zwykła forma, gdy wskazujesz drogę komuś nieznajomemu.'
  fr.a1.unit09.lesson02.teach.continuez_tout_droit:
    title: Idź dalej prosto
    gloss: Proszę iść prosto aż do skrzyżowania.
    note: '*Continuez* („idźcie dalej”) + *tout droit* („prosto”) to standardowy sposób, by powiedzieć komuś, żeby szedł dalej bez skręcania.'
  fr.a1.unit09.lesson02.teach.cest_au_coin:
    title: Wskaż miejsce
    gloss: To na rogu ulicy, po prawej stronie.
    note: Połączenie *au coin de la rue* z *à droite* daje dokładne wskazanie miejsca.
  fr.a1.unit09.lesson02.teach.cest_loin:
    title: Powiedz, że to niedaleko
    gloss: To niedaleko, pięć minut pieszo.
    note: '*À cinq minutes à pied* („pięć minut pieszo”) to ten sam schemat czasu dojścia, który pojawił się, gdy Mathieu pytał o aptekę.'
  fr.a1.unit09.lesson03.teach.line01:
    title: Zapytaj o sklep
    gloss: Inès pyta Mathieu, czy zna sklep, w którym można kupić przybory kuchenne.
    note: '*Tu connais... ?* („znasz...?”) to standardowy, nieformalny sposób zapytania, czy ktoś zna dane miejsce.'
  fr.a1.unit09.lesson03.teach.line02:
    title: Pierwszy krok
    gloss: Mathieu odpowiada, że tak, jeden jest niedaleko stąd – na skrzyżowaniu skręca się w lewo.
    note: '*Il y en a une* („jest jeden”) używa *en*, by nie powtarzać słowa *boutique* – to częsty skrót w mówionej francuszczyźnie.'
  fr.a1.unit09.lesson03.teach.line03:
    title: Potwierdź i zapytaj dalej
    gloss: 'Inès potwierdza: w lewo na skrzyżowaniu, i pyta, co dalej.'
    note: '*Et ensuite ?* („a potem?”) to proste, naturalne pytanie o kolejny etap drogi.'
  fr.a1.unit09.lesson03.teach.line04:
    title: Podaj drugi krok
    gloss: Mathieu mówi, że potem idziesz dalej prosto i przechodzisz przez ulicę.
    note: Dwa czasowniki ruchu połączone spójnikiem *et* – naturalny sposób opisania krótkiej trasy.
  fr.a1.unit09.lesson03.teach.line05:
    title: Zapytaj, gdzie dokładnie
    gloss: Inès pyta, gdzie dokładnie jest sklep.
    note: '*Exactement* („dokładnie”) prosi o precyzyjniejszą odpowiedź niż ogólny kierunek.'
  fr.a1.unit09.lesson03.teach.line06:
    title: Podaj dokładne miejsce
    gloss: Mathieu mówi, że sklep jest na rogu ulicy, tuż naprzeciwko piekarni.
    note: '*En face de* („naprzeciwko”) wskazuje miejsce przez punkt orientacyjny – naturalny sposób zakończenia wskazówek.'
