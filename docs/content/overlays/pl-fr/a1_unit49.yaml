teaching:
  fr.a1.unit49.lesson01.teach.content_triste_en:
    title: Zadowolony, smutny i zły
    gloss: zadowolony, smutny, zły
    note: Trzy podstawowe słowa opisujące uczucia, używane z *être* (być); *content* ma formę żeńską *contente*, a *triste* i *en colère* się nie zmieniają.
    example_gloss:
    - Jestem zadowolony.
    - Jest mi smutno.
    - Jestem zły.
  fr.a1.unit49.lesson01.teach.je_suis_content:
    title: Mówimy, że jesteś zadowolony
    gloss: Jestem zadowolony.
    note: '*Être* (być) + przymiotnik opisujący uczucie to podstawowy wzorzec, podobnie jak w polskim „jestem ...”.'
  fr.a1.unit49.lesson01.teach.je_ne_suis:
    title: Zestawianie uczuć
    gloss: Nie jestem zły, jestem smutny.
    note: '*Ne ... pas* otacza czasownik; drugie zdanie podaje wtedy prawdziwe uczucie.'
  fr.a1.unit49.lesson02.teach.pourquoi_es_tu:
    title: Pytanie o powód
    gloss: Dlaczego jesteś zadowolony?
    note: '*Pourquoi* (dlaczego) to standardowe słowo pytające o powód.'
  fr.a1.unit49.lesson02.teach.je_suis_content:
    title: Podawanie powodu
    gloss: Jestem zadowolony, bo mam nowe mieszkanie.
    note: '*Parce que* (ponieważ, bo) wprowadza zdanie z powodem; przed *il* skraca się do *parce qu''*.'
  fr.a1.unit49.lesson02.teach.je_suis_triste:
    title: Negatywny powód
    gloss: Jestem smutny, bo pada deszcz.
    note: Wyrażenie *il pleut* (pada deszcz) z lekcji o pogodzie pojawia się tu jako powód.
  fr.a1.unit49.lesson03.teach.nerveux:
    title: Zdenerwowany
    gloss: zdenerwowany
    note: Standardowe słowo oznaczające zdenerwowanie.
    example_gloss: Denerwuję się przed pierwszą zmianą.
  fr.a1.unit49.lesson03.teach.je_suis_nerveux:
    title: Mówimy, czym się denerwujesz
    gloss: Denerwuję się przed pierwszą zmianą.
    note: '*Avant* (dosłownie „przed”) wprowadza to, z powodu czego się denerwujemy; po polsku podobnie mówimy „przed pierwszą zmianą”.'
  fr.a1.unit49.lesson03.teach.ne_t_inquiete:
    title: Uspokajanie kogoś
    gloss: Nie martw się.
    note: '*Ne t''inquiète pas* (dosłownie „nie martw się”) to stała, standardowa formuła uspokajania; *s''inquiéter* jest czasownikiem zwrotnym.'
  fr.a1.unit49.lesson04.teach.comment_se_sent:
    title: Pytanie, jak ktoś się czuje
    gloss: Jak czuje się Mathieu?
    note: '*Se sentir* (czuć się, zwrotnie) to standardowy sposób pytania o stan emocjonalny lub jego opisywania; pojawia się też w lekcji o zdrowiu.'
  fr.a1.unit49.lesson04.teach.il_se_sent:
    title: Opisywanie, jak ktoś się czuje
    gloss: On czuje się zdenerwowany.
    note: '*Se* (się) to zaimek zwrotny 3. osoby, występujący razem z *sent*.'
  fr.a1.unit49.lesson04.teach.pourquoi_se_sent:
    title: Pytanie, dlaczego ktoś się tak czuje
    gloss: Dlaczego on czuje się zdenerwowany?
    note: Łączy *pourquoi* z *se sentir* ze zdania *Il se sent nerveux*; *sent-il* pisze się z łącznikiem.
  fr.a1.unit49.lesson05.teach.salut_camille_je:
    title: Przeczytaj wiadomość o uczuciach
    gloss: Cześć, Camille, trochę denerwuję się przed pierwszą samodzielną zmianą. Ale jestem też zadowolony, bo mam nową pracę i nowe mieszkanie. Myślę, że będzie dobrze.
    note: Zwróć uwagę, czym autor się denerwuje, co go cieszy i jakie ma ogólne nastawienie.
    glosses:
      peu: trochę
      nerveux: zdenerwowani
      premier: pierwszy
      service: zmiana (w pracy)
      seul: sam
      content: zadowoleni
      car: ponieważ
      nouveau: nowy
      travail: praca
      nouvel: nowy
      appartement: mieszkanie
      pense: myśleć
      aller: 'okazuje się (tu: będzie dobrze)'
  fr.a1.unit49.lesson06.teach.camille_salut_mathieu:
    title: Camille pyta, jak czuje się Mathieu
    gloss: 'Camille: Cześć, Mathieu, jak się czujesz przed pierwszą zmianą?'
    note: '*Avant ton premier service* (przed twoją pierwszą zmianą) wykorzystuje wzorzec *avant* + rzeczownik z lekcji 3.'
  fr.a1.unit49.lesson06.teach.mathieu_je_suis:
    title: Mathieu przyznaje, że się denerwuje
    gloss: 'Mathieu: Trochę się denerwuję, szczerze mówiąc.'
    note: '*Honnêtement* (szczerze) łagodzi to przyznanie się.'
  fr.a1.unit49.lesson06.teach.camille_ne_t:
    title: Camille go uspokaja
    gloss: 'Camille: Nie martw się, dasz radę!'
    note: '*Tu vas y arriver* (dosłownie „dojdziesz tam”) to zachęcające stałe wyrażenie; *aller* + bezokolicznik tworzy bliską przyszłość.'
  fr.a1.unit49.lesson06.teach.mathieu_merci_ca:
    title: Mathieu jej dziękuje
    gloss: 'Mathieu: Dzięki, naprawdę mi to pomaga.'
    note: '*Aide* to forma *il/elle* czasownika *aider* (pomagać); *m''* oznacza *me* (mi).'
  fr.a1.unit49.lesson06.teach.camille_et_apres:
    title: Camille przewiduje, jak to się skończy
    gloss: 'Camille: A potem na pewno będziesz bardzo zadowolony i dumny.'
    note: '*Sûrement* (na pewno) wyraża pewne przewidywanie; *fier* (dumny) to nowy, przydatny przymiotnik.'
  fr.a1.unit49.lesson06.teach.mathieu_oui_je:
    title: Mathieu się zgadza
    gloss: 'Mathieu: Tak, ja też tak myślę.'
    note: '*Je pense aussi* to naturalny sposób, by zgodzić się z czyjąś opinią.'
  fr.a1.unit49.lesson06.teach.il_remplace_mathieu:
    title: Podsumowanie z il, elle i l'
    gloss: Mathieu denerwuje się przed pierwszą zmianą. Camille mu pomaga.
    note: '*Il* zastępuje imię mężczyzny (*il est nerveux*), *elle* zastępuje imię kobiety, a *l''* (*elle l''aide*) znaczy „go”: trzy małe, ale kluczowe słowa do mówienia o kimś innym.'
