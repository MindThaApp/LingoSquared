answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francuski A1
  description: Opisywanie prostego planu dnia za pomocą czasowników zwrotnych (se réveiller, se lever, se coucher) i słów porządkujących (d'abord, ensuite); dalszy ciąg opowieści Inès i Mathieu o warsztatach kulinarnych – Inès pyta o sobotę Mathieu. Warto pamiętać, że francuskie czasowniki zwrotne wymagają zaimka zwrotnego (je ME réveille), podobnie jak polskie „budzę SIĘ”, ale zaimek ten stoi przed czasownikiem.
units:
  fr.a1.unit10.routines:
    title: Sobotni plan dnia
lessons:
  fr.a1.unit10.lesson01.vocabulaire_routine:
    title: Poranne czynności
  fr.a1.unit10.lesson02.la_journee_complete:
    title: Cały dzień
  fr.a1.unit10.lesson03.dialogue_routine_samedi:
    title: Sobota Mathieu
teaching:
  fr.a1.unit10.lesson01.teach.se_reveiller:
    title: Budzić się
    gloss: budzić się
    note: 'Czasownik zwrotny: *je me réveille*, *tu te réveilles*. Zaimek *me/te/se* zawsze zgadza się z podmiotem.'
    example_gloss: Budzę się o siódmej.
  fr.a1.unit10.lesson01.teach.se_lever:
    title: Wstawać
    gloss: wstawać
    note: Nie myl z *se réveiller* (obudzić się) – *se lever* oznacza fizycznie wstać z łóżka.
    example_gloss: Zaraz potem wstaję.
  fr.a1.unit10.lesson01.teach.prendre_une_douche:
    title: Brać prysznic
    gloss: brać prysznic
    note: '*Prendre une douche* (dosłownie „wziąć prysznic”) używa czasownika *prendre*, tak samo jak przy posiłkach i środkach transportu.'
    example_gloss: Rano biorę prysznic.
  fr.a1.unit10.lesson01.teach.shabiller:
    title: Ubierać się
    gloss: ubierać się
    note: 'Kolejny czasownik zwrotny: *je m''habille*; me przechodzi w *m''* przed samogłoską.'
    example_gloss: Ubieram się przed śniadaniem.
  fr.a1.unit10.lesson01.teach.le_petit_dejeuner:
    title: Śniadanie
    gloss: śniadanie
    note: '*Prendre le petit-déjeuner* (jeść śniadanie) używa tego samego czasownika *prendre* co *prendre une douche*.'
    example_gloss: Jem śniadanie o ósmej.
  fr.a1.unit10.lesson01.teach.quitter_la_maison:
    title: Wychodzić z domu
    gloss: wychodzić z domu
    note: '*Quitter* oznacza tu „opuszczać (jakieś miejsce)” – nie myl z *partir*, które nie przyjmuje dopełnienia bliższego.'
    example_gloss: Wychodzę z domu o dziewiątej.
  fr.a1.unit10.lesson01.teach.dabord_ensuite:
    title: Najpierw… potem…
    gloss: Najpierw wstaję, potem się ubieram.
    note: '*D''abord* (najpierw) i *ensuite* (potem) to podstawowe słowa porządkujące, gdy opisujesz plan dnia krok po kroku.'
  fr.a1.unit10.lesson02.teach.rentrer:
    title: Wracać do domu
    gloss: wracać do domu
    note: '*Rentrer* oznacza powrót do własnego domu, w odróżnieniu od ogólniejszego *retourner* (wracać dokądś).'
    example_gloss: Wracam do domu po pracy.
  fr.a1.unit10.lesson02.teach.diner:
    title: Jeść kolację
    gloss: jeść kolację
    note: '*Dîner* może być czasownikiem (jeść kolację) lub rzeczownikiem (*le dîner*, kolacja) – rozróżnisz je po kontekście.'
    example_gloss: W sobotnie wieczory jemy razem kolację.
  fr.a1.unit10.lesson02.teach.se_coucher:
    title: Iść spać
    gloss: iść spać
    note: Naturalny koniec planu dnia, odpowiednik *se lever* na jego początku.
    example_gloss: Idę spać około dwudziestej trzeciej.
  fr.a1.unit10.lesson02.teach.le_weekend:
    title: Weekend
    gloss: weekend
    note: '*Le week-end* to wyraz zapożyczony z angielskiego, podobnie jak polski „weekend”; po francusku pisze się go z łącznikiem.'
    example_gloss: Warsztaty odbywają się w weekend.
  fr.a1.unit10.lesson02.teach.dhabitude:
    title: Zazwyczaj
    gloss: zazwyczaj
    note: '*D''habitude* wprowadza stały zwyczaj, w odróżnieniu od *aujourd''hui* (dzisiaj) przy jednorazowym wydarzeniu.'
    example_gloss: Zazwyczaj wstaję o siódmej.
  fr.a1.unit10.lesson02.teach.ma_routine_du_samedi:
    title: Opisz sobotę
    gloss: W soboty wstaję późno, potem idę na targ przed warsztatami.
    note: Łączy kolejność w stylu *d'abord/ensuite* (tu z *puis*, „potem”), aby opisać sobotę.
  fr.a1.unit10.lesson02.teach.quest_ce_que_tu_fais:
    title: Co robisz?
    gloss: Co robisz w soboty?
    note: '*Qu''est-ce que tu fais... ?* to standardowy, nieformalny sposób pytania, co ktoś robi.'
  fr.a1.unit10.lesson03.teach.line01:
    title: Pytanie o sobotę
    gloss: Inès pyta Mathieu, co robi w soboty przed warsztatami.
    note: '*Tu fais quoi... ?* to naturalny, nieformalny sposób zapytania „co robisz…?”, bardziej potoczny niż *Qu''est-ce que tu fais ?*'
  fr.a1.unit10.lesson03.teach.line02:
    title: Opis budzenia się
    gloss: Mathieu mówi, że najpierw budzi się późno, około dziewiątej.
    note: '*Vers neuf heures* (około dziewiątej) używa wzoru *vers* + godzina, by podać przybliżony czas.'
  fr.a1.unit10.lesson03.teach.line03:
    title: Pytanie, co dalej
    gloss: Inès pyta, co dzieje się potem.
    note: Krótkie, naturalne pytanie, które podtrzymuje opowieść o planie dnia.
  fr.a1.unit10.lesson03.teach.line04:
    title: Opis śniadania i targu
    gloss: Mathieu mówi, że potem je śniadanie i idzie na targ.
    note: Dwie połączone czynności, złączone przez *et*, kontynuują ciąg zaczęty słowem *d'abord*.
  fr.a1.unit10.lesson03.teach.line05:
    title: Pytanie o powrót do domu
    gloss: Inès pyta, o której Mathieu wraca do domu.
    note: '*Tu rentres à quelle heure ?* wykorzystuje w bezpośrednim pytaniu czasownik *rentrer* z tej lekcji.'
  fr.a1.unit10.lesson03.teach.line06:
    title: Opis popołudnia
    gloss: Mathieu mówi, że wraca około południa, a po południu odpoczywa przed wieczornymi warsztatami.
    note: '*Se reposer* (odpoczywać) to kolejny czasownik zwrotny: *je me repose*.'
