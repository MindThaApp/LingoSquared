course:
  title: Francuski A1
  description: Podstawowe porównania (plus/moins/aussi... que) i stopień najwyższy (le/la plus...) w dalszym ciągu historii warsztatów kulinarnych Inès i Mathieu, którzy podczas zakupów porównują dwa sery. Szczególnie ważne jest, że *meilleur* („lepszy”) i *le meilleur* („najlepszy”) są nieregularne, w przeciwieństwie do regularnego wzoru *plus... que* używanego z większością innych przymiotników.
units:
  fr.a1.unit14.comparisons:
    title: Więcej czy mniej?
lessons:
  fr.a1.unit14.lesson01.vocabulaire_comparaisons:
    title: Więcej, mniej, tak samo
  fr.a1.unit14.lesson02.superlatifs:
    title: Najbardziej, najmniej
  fr.a1.unit14.lesson03.dialogue_comparer_fromages:
    title: Porównujemy dwa sery na targu
teaching:
  fr.a1.unit14.lesson01.teach.plus_que:
    title: Bardziej... niż
    gloss: bardziej... niż
    note: '*Plus + przymiotnik + que* to standardowy francuski stopień wyższy – tworzy się go opisowo, a nie przez zmianę końcówki przymiotnika, jak w polskim „tańszy”.'
    example_gloss: Ten ser jest droższy niż tamten.
  fr.a1.unit14.lesson01.teach.moins_que:
    title: Mniej... niż
    gloss: mniej... niż
    note: '*Moins* jest dokładnym przeciwieństwem *plus* w tym samym schemacie stopnia wyższego.'
    example_gloss: Ten przepis jest mniej trudny niż tamten.
  fr.a1.unit14.lesson01.teach.aussi_que:
    title: Tak... jak
    gloss: tak... jak
    note: '*Aussi + adjective + que* wyraża równość między dwiema rzeczami, np. „tak samo dobry jak”.'
    example_gloss: Tarta jest tak dobra jak quiche.
  fr.a1.unit14.lesson01.teach.meilleur_que:
    title: Lepszy niż
    gloss: lepszy niż
    note: '*Meilleur* to nieregularny stopień wyższy od *bon* („dobry”) – po francusku nie mówi się *plus bon*.'
    example_gloss: To ciasto jest lepsze niż pierwsze.
  fr.a1.unit14.lesson01.teach.cher_bon_marche:
    title: Drogi, tani
    gloss: drogi, tani / w dobrej cenie
    note: '*Bon marché* jest niezmienne (nigdy nie zmienia formy), choć wygląda, jakby powinno się zgadzać jak inne przymiotniki.'
    example_gloss:
    - Ser jest drogi.
    - Warzywa są tanie.
  fr.a1.unit14.lesson01.teach.facile_difficile:
    title: Łatwy, trudny
    gloss: łatwy, trudny
    note: Częsta para przymiotników do opisywania przepisów – oba mają taką samą formę w rodzaju męskim i żeńskim; w liczbie mnogiej dodaj -s (*faciles*, *difficiles*).
    example_gloss:
    - Ten przepis jest łatwy.
    - Quiche jest trochę trudna.
  fr.a1.unit14.lesson02.teach.le_plus_cher:
    title: Najdroższy
    gloss: najdroższy
    note: '*Le/la plus + przymiotnik* tworzy stopień najwyższy – w odróżnieniu od stopnia wyższego wymaga rodzajnika określonego.'
    example_gloss: To najdroższy ser na targu.
  fr.a1.unit14.lesson02.teach.la_moins_chere:
    title: Najtańsza
    gloss: najtańsza
    note: '*La moins chère* zgadza się z rzeczownikiem żeńskim *recette*; forma rodzaju męskiego to *le moins cher*.'
    example_gloss: To najtańszy przepis.
  fr.a1.unit14.lesson02.teach.le_meilleur:
    title: Najlepszy
    gloss: najlepszy
    note: '*Le meilleur* to nieregularny stopień najwyższy od *bon*, odpowiadający nieregularnemu stopniowi wyższemu *meilleur* z pierwszej lekcji.'
    example_gloss: To najlepsze ciasto na warsztatach!
  fr.a1.unit14.lesson02.teach.la_plus_facile:
    title: Najłatwiejsza
    gloss: najłatwiejsza
    note: Regularny stopień najwyższy, tworzony wprost według wzoru *le/la plus + przymiotnik*.
    example_gloss: To najłatwiejszy przepis do zrobienia.
  fr.a1.unit14.lesson02.teach.grammar_superlative_note:
    title: Wzór stopnia najwyższego
    gloss: le/la plus + przymiotnik; meilleur jest nieregularny
    note: Większość francuskich stopni najwyższych jest regularna (*le/la plus + przymiotnik*), ale *bon* → *meilleur* → *le meilleur* to wyjątek, który trzeba zapamiętać.
  fr.a1.unit14.lesson02.teach.comparer_les_prix:
    title: Zaproponuj porównanie cen
    gloss: Porównajmy ceny przed zakupem.
    note: '*Comparons* to tryb rozkazujący w formie *nous* od *comparer* – „porównajmy”, naturalne zdanie podczas zakupów.'
  fr.a1.unit14.lesson03.teach.line01:
    title: Zauważ dwie możliwości
    gloss: 'Inès mówi: patrz, są dwa rodzaje sera – który wezmą?'
    note: '*Lequel* („który”) prosi rozmówcę o wybór między dwiema już wspomnianymi możliwościami.'
  fr.a1.unit14.lesson03.teach.line02:
    title: Porównaj i oceń jakość
    gloss: Mathieu mówi, że ten jest droższy od tamtego, ale wygląda na lepszy.
    note: '*Avoir l''air* + przymiotnik („wyglądać na”) łagodzi opinię o jakości, której jeszcze nie sprawdzono w smaku.'
  fr.a1.unit14.lesson03.teach.line03:
    title: Nie zgódź się z porównaniem
    gloss: Inès pyta, czy on jest pewien, i mówi, że według niej tamten jest równie dobry, a tańszy.
    note: W jednej odpowiedzi użyte są *aussi* i *moins* z pierwszej lekcji, by grzecznie się nie zgodzić – *que* zostaje pominięte, bo z kontekstu wiadomo, że porównywany jest ser Mathieu.
  fr.a1.unit14.lesson03.teach.line04:
    title: Przyznaj rację co do ceny
    gloss: Mathieu przyznaje, że to prawda – to tańszy z dwóch.
    note: '*Des deux* („z dwóch”) zawęża stopień najwyższy tylko do tej pary, a nie do całego targu.'
  fr.a1.unit14.lesson03.teach.line05:
    title: Podejmij ostateczną decyzję
    gloss: 'Inès mówi: w takim razie bierzemy ten, to najlepsza opcja na warsztaty.'
    note: '*Celui-là* („tamten”) odnosi się do tańszego sera, o którym była mowa.'
  fr.a1.unit14.lesson03.teach.line06:
    title: Zauważ korzyść
    gloss: Mathieu się zgadza i mówi, że zostanie im więcej pieniędzy na deser!
    note: '*Il nous reste* (dosł. „zostaje nam”) to częsty sposób, by powiedzieć „mamy jeszcze…”.'
