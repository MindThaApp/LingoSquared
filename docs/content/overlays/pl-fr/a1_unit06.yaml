  fr.a1.unit06.lesson01.moments_de_la_journee:
    title: Pory dnia
  fr.a1.unit06.lesson02.dire_lheure:
    title: Podawanie godziny
  fr.a1.unit06.lesson03.dialogue_prochain_atelier:
    title: Następne warsztaty
teaching:
  fr.a1.unit06.lesson01.teach.heure:
    title: Godzina; pora
    gloss: godzina; pora
    note: '*Heure* jest rodzaju żeńskiego; to także jednostka używana przy podawaniu godziny (*dix heures* = dziesiąta).'
    example_gloss: Która jest godzina?
  fr.a1.unit06.lesson01.teach.matin:
    title: Ranek
    gloss: ranek; rano
    note: '*Matin* jest rodzaju męskiego.'
    example_gloss: Targ jest otwarty rano.
  fr.a1.unit06.lesson01.teach.apres_midi:
    title: Popołudnie
    gloss: popołudnie
    note: '*Après-midi* może być rodzaju męskiego lub żeńskiego (częściej męskiego); *l''* ulega elizji przed samogłoską.'
    example_gloss: Pracuję po południu.
  fr.a1.unit06.lesson01.teach.soir:
    title: Wieczór
    gloss: wieczór
    note: '*Soir* jest rodzaju męskiego.'
    example_gloss: Warsztaty kulinarne są wieczorem.
  fr.a1.unit06.lesson01.teach.midi:
    title: Południe
    gloss: południe
    note: '*Midi* nie ma rodzajnika, gdy podajemy porę (*à midi*, a nie *au midi*).'
    example_gloss: Jemy o południu.
  fr.a1.unit06.lesson01.teach.minuit:
    title: Północ
    gloss: północ
    note: '*Minuit* działa tak samo jak *midi*: bez rodzajnika.'
    example_gloss: Warsztaty nigdy nie trwają po północy.
  fr.a1.unit06.lesson01.teach.latelier_commence_le_soir:
    title: Powiedz, kiedy są warsztaty
    gloss: Warsztaty zaczynają się wieczorem, a nie rano.
    note: Zestawia bezpośrednio *le soir* i *le matin*, używając obu rzeczowników z słownictwa tej lekcji.
  fr.a1.unit06.lesson02.teach.quelle_heure_est_il:
    title: Pytanie o godzinę
    gloss: Która jest godzina?
    note: '*Quelle heure est-il ?* to standardowy, uniwersalny sposób pytania o godzinę; *-il* następuje po czasowniku (inwersja) i tworzy pytanie.'
  fr.a1.unit06.lesson02.teach.il_est_dix_heures:
    title: Podaj godzinę
    gloss: Jest dziesiąta.
    note: '*Il est* + liczba + *heures* to podstawowy wzór podawania pełnej godziny; *heures* pozostaje w liczbie mnogiej, poza *une heure* (pierwsza).'
  fr.a1.unit06.lesson02.teach.et_quart:
    title: Podaj kwadrans po pełnej godzinie
    gloss: Jest kwadrans po dziesiątej.
    note: '*Et quart* (i kwadrans) dodaje piętnaście minut do podanej godziny.'
  fr.a1.unit06.lesson02.teach.et_demie:
    title: Podaj wpół do następnej godziny
    gloss: Jest wpół do jedenastej.
    note: '*Et demie* (i pół) dodaje trzydzieści minut; *demie* ma żeńskie -e, bo zgadza się z *heure*.'
  fr.a1.unit06.lesson02.teach.moins_le_quart:
    title: Podaj kwadrans do pełnej godziny
    gloss: Jest za kwadrans jedenasta.
    note: '*Moins le quart* (bez kwadransa) odlicza od NASTĘPNEJ godziny, a nie od bieżącej – warto o tym pamiętać, bo łatwo się pomylić.'
  fr.a1.unit06.lesson02.teach.a_quelle_heure:
    title: Pytanie o godzinę rozpoczęcia
    gloss: O której zaczynają się warsztaty?
    note: '*À quelle heure ?* (o której godzinie) stosuje się, gdy pytamy o zaplanowane wydarzenie; to coś innego niż ogólne *Quelle heure est-il ?*.'
  fr.a1.unit06.lesson03.teach.line01:
    title: Zapytaj o godzinę rozpoczęcia w przyszłym tygodniu
    gloss: Inès pyta, o której są warsztaty w przyszłym tygodniu.
    note: '*La semaine prochaine* (w przyszłym tygodniu) łączy się ze wzorem pytania *à quelle heure* z tej lekcji.'
  fr.a1.unit06.lesson03.teach.line02:
    title: Podaj godzinę rozpoczęcia
    gloss: Mathieu mówi, że zaczynają się o osiemnastej trzydzieści (18:30), jak mu się wydaje.
    note: '*Dix-huit heures trente* to zapis 24-godzinny, typowy dla francuskich planów i harmonogramów; różni się od nieformalnych form z *et demie*.'
  fr.a1.unit06.lesson03.teach.line03:
    title: Potwierdź, że to wieczór
    gloss: 'Inès upewnia się: wieczorem, a nie rano?'
    note: Krótkie pytanie potwierdzające, zestawiające *le soir* i *le matin*.
  fr.a1.unit06.lesson03.teach.line04:
    title: Potwierdź i wyjaśnij dlaczego
    gloss: Mathieu potwierdza, że wieczorem – to wygodniejsze po pracy.
    note: '*Après le travail* (po pracy) podaje prosty, praktyczny powód.'
  fr.a1.unit06.lesson03.teach.line05:
    title: Zapytaj o godzinę zakończenia
    gloss: Inès pyta, o której się kończą.
    note: '*Finit* (kończy się) stoi w kontraście do *commence* (zaczyna się) z drugiej kwestii.'
  fr.a1.unit06.lesson03.teach.line06:
    title: Podaj godzinę zakończenia
    gloss: Mathieu mówi, że około dwudziestej piętnaście (20:15), jak zwykle.
    note: '*Vers* (około) oznacza przybliżoną godzinę, łagodniej niż dokładne *à*.'
  fr.a1.unit06.lesson03.teach.line07:
    title: Potwierdź plan
    gloss: 'Inès potwierdza: do zobaczenia w przyszłym tygodniu o osiemnastej trzydzieści!'
    note: Kończy rozmowę, powtarzając ustaloną godzinę – to naturalny sposób potwierdzenia planu po francusku.
