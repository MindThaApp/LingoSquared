course:
  title: Francuski A1
  description: Pory dnia i podawanie godzin (heure(s), et quart, et demie, moins le quart); dalszy ciąg historii Inès i Mathieu z warsztatów kulinarnych – tym razem planują kolejne spotkanie. W sytuacjach formalnych i przy planowaniu Francuzi używają zapisu 24-godzinnego (dix-huit heures trente), a obok niego funkcjonują nieformalne formy 12-godzinne, które poznajesz wcześniej w tej lekcji.
units:
  fr.a1.unit06.time:
    title: Która jest godzina?
