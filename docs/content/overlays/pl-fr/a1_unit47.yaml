teaching:
  fr.a1.unit47.lesson01.teach.le_temps:
    title: Pogoda
    gloss: pogoda
    note: '*Le temps* znaczy zarówno „pogoda”, jak i „czas”; jest rodzaju męskiego.'
    example_gloss: Jaka jest pogoda?
  fr.a1.unit47.lesson01.teach.quel_temps_fait:
    title: Pytanie o pogodę
    gloss: Jaka jest pogoda?
    note: '*Quel temps fait-il ?* to standardowe pytanie o pogodę; *quel* zgadza się z rzeczownikiem rodzaju męskiego *temps*.'
  fr.a1.unit47.lesson01.teach.le_temps_est:
    title: Słonecznie
    gloss: Jest słonecznie.
    note: '*Le temps est* + przymiotnik to standardowy wzór; przymiotnik zgadza się z rzeczownikiem rodzaju męskiego *temps*.'
  fr.a1.unit47.lesson01.teach.il_pleut:
    title: Deszcz
    gloss: Pada deszcz.
    note: '*Pleuvoir* (padać, o deszczu) używa się bezosobowo: *il pleut*, bez dodatkowego przymiotnika.'
  fr.a1.unit47.lesson01.teach.le_temps_est_2:
    title: Pochmurnie
    gloss: Jest pochmurno.
    note: Ten sam wzór *le temps est* + przymiotnik co w przypadku *ensoleillé*.
  fr.a1.unit47.lesson02.teach.il_fait_froid:
    title: Zimno
    gloss: Dziś jest zimno.
    note: '*Aujourd''hui* (dziś) osadza pogodę w czasie; *il fait froid* używa czasownika *faire*, a nie *être*.'
  fr.a1.unit47.lesson02.teach.il_fait_chaud:
    title: Ciepło
    gloss: Dziś jest ciepło.
    note: '*Il fait chaud* w codziennych rozmowach o pogodzie oznacza zarówno „ciepło”, jak i „gorąco”.'
  fr.a1.unit47.lesson02.teach.il_ne_fait:
    title: Zestawienie temperatur
    gloss: Nie jest zimno, jest ciepło.
    note: '*Ne ... pas* otacza czasownik: *il ne fait pas froid*.'
  fr.a1.unit47.lesson03.teach.la_meteo:
    title: Prognoza pogody
    gloss: prognoza pogody
    note: '*La météo* jest rodzaju żeńskiego i jest skrótem od *la météorologie*.'
    example_gloss: Jaka jest prognoza pogody?
  fr.a1.unit47.lesson03.teach.demain_le_temps:
    title: Pogoda na jutro
    gloss: Jutro jest słonecznie.
    note: '*Demain* stoi na początku zdania, po nim następuje przecinek; reszta zachowuje zwykły szyk.'
  fr.a1.unit47.lesson03.teach.samedi_le_temps:
    title: Prognoza na dwa dni
    gloss: W sobotę jest słonecznie i ciepło, ale w niedzielę pada przez cały dzień.
    note: '*Toute la journée* (cały dzień) podkreśla, jak długo pada deszcz.'
  fr.a1.unit47.lesson04.teach.la_promenade:
    title: Spacer
    gloss: spacer
    note: '*Promenade* jest rodzaju żeńskiego: *la promenade*.'
    example_gloss: Pójdziemy na spacer?
  fr.a1.unit47.lesson04.teach.on_fait_une:
    title: Propozycja spaceru
    gloss: Pójdziemy na spacer?
    note: '*On fait une promenade ?* to przyjazny sposób zaproponowania planu; *faire une promenade* to utałony zwrot oznaczający „iść na spacer”.'
  fr.a1.unit47.lesson04.teach.s_il_pleut:
    title: Plan warunkowy
    gloss: Jeśli będzie padać, zostajemy w domu.
    note: '*S''il pleut* (jeśli pada): *si* + *il* zamienia się w *s''il*; potem *on reste à l''intérieur* mówi, co robicie.'
  fr.a1.unit47.lesson04.teach.bonne_idee_faisons:
    title: Zgoda i propozycja
    gloss: Dobry pomysł! Chodźmy na spacer.
    note: '*Faisons ...* („zróbmy ...”) to kolejny częsty sposób proponowania zajęcia, obok *On ... ?*'
  fr.a1.unit47.lesson05.teach.meteo_samedi_le:
    title: Przeczytaj prognozę na dwa dni
    gloss: 'Prognoza pogody: w sobotę jest słonecznie i ciepło. W niedzielę pada przez cały dzień.'
    note: Zwróć uwagę, który dzień ma jaką pogodę.
    glosses:
      Météo: prognoza pogody
      samedi: sobota
      ensoleillé: słoneczny
      chaud: ciepły
      Dimanche: niedziela
      pleut: pada deszcz
      toute: cały
      journée: dzień
  fr.a1.unit47.lesson06.teach.camille_quel_temps:
    title: Camille pyta o weekend
    gloss: 'Camille: Jaka będzie pogoda w ten weekend?'
    note: '*Ce week-end* („w ten weekend”) odnosi pytanie do najbliższej przyszłości.'
  fr.a1.unit47.lesson06.teach.mathieu_samedi_le:
    title: Mathieu podaje prognozę
    gloss: 'Mathieu: W sobotę będzie słonecznie i ciepło, ale w niedzielę będzie padać przez cały dzień.'
    note: Dokładnie odpowiada prognozie przeczytanej w lekcji 5.
  fr.a1.unit47.lesson06.teach.camille_alors_on:
    title: Camille proponuje plan
    gloss: 'Camille: To może pójdziemy na spacer w sobotę?'
    note: '*Alors* („w takim razie”) łączy propozycję z dobrą pogodą, o której właśnie powiedział Mathieu.'
  fr.a1.unit47.lesson06.teach.mathieu_bonne_idee:
    title: Mathieu zgadza się i planuje niedzielę
    gloss: 'Mathieu: Dobry pomysł. A w niedzielę zostajemy sobie spokojnie w domu.'
    note: '*Tranquillement* oznacza tu „spokojnie, bez pośpiechu” i sprawia, że siedzenie w domu brzmi zachęcająco.'
  fr.a1.unit47.lesson06.teach.camille_parfait_alors:
    title: Camille ustala plan
    gloss: 'Camille: Świetnie, w takim razie obejrzymy film.'
    note: '*Regarder* („oglądać”) naturalnie łączy się z *un film* („film”).'
