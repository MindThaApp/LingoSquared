    gloss: Camille ćwiczy jogę dwa razy w tygodniu. Uwielbia spokojny ruch. Léa nie ćwiczy jogi, ale uwielbia pływać. Léa pływa często, prawie co tydzień. A ty jaki sport uprawiasz?
    note: Zestawia dwa różne sporty i dwa wyrażenia częstotliwości, podobnie jak czytanka porównująca zwierzęta w poprzednim unicie.
