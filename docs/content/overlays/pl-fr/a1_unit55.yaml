    gloss: Mathieu często gra w piłkę nożną.
    note: Wraca *souvent* (często), poznane już w jednym z wcześniejszych unitów przy rutynie dnia.
  fr.a1.unit55.lesson03.teach.tu_connais_deja:
    title: Faire du sport czy faire de la + nazwa sportu
    gloss: 'Znasz już *faire du sport* z lekcji o hobby (*Je fais du sport le samedi*). *Faire de la* + nazwa sportu wskazuje konkretną dyscyplinę: *Je fais de la natation*. Obie formy są poprawne po francusku.'
    note: '*Faire du sport* wraca z unitu o hobby, to nie nowość. Tu zestawiamy je z nazwaniem konkretnego sportu: jeden sposób ogólny i jeden szczegółowy, by mówić o ćwiczeniach.'
