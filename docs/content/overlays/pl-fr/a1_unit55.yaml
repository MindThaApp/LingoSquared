  fr.a1.unit55.lesson01.teach.je_joue_au:
    title: Gram w piłkę nożną
    gloss: Gram w piłkę nożną.
    note: '*Jouer au* + gra z piłką to zwykły sposób, by powiedzieć, że grasz w piłkę nożną. W przypadku innych sportów używaj *faire du* lub *faire de la*; zobacz notatkę gramatyczną.'
  fr.a1.unit55.lesson01.teach.faire_du_de:
    title: Faire du / de la + sport
    gloss: '*Faire du*, *de la* lub *de l''* + nazwa sportu mówi, jaki sport uprawiasz: *faire du yoga*, *faire de la natation*, *faire de la course à pied*. Przy piłce nożnej mówi się *jouer au football*.'
    note: Jedna konstrukcja obejmuje każdy sport – na tym poziomie nie musisz uczyć się osobnego czasownika do każdej dyscypliny.
  fr.a1.unit55.lesson02.teach.fois_par_semaine:
    title: Razy w tygodniu
    gloss: razy w tygodniu
    example_gloss: Ćwiczę jogę dwa razy w tygodniu.
  fr.a1.unit55.lesson02.teach.tu_connais_deja:
    title: Fois par semaine czy tous les jours/souvent
    gloss: Znasz już *tous les jours* (codziennie) i *souvent* (często). *Deux fois par semaine* (dwa razy w tygodniu) to nowy, dokładniejszy sposób, by powiedzieć, jak często coś robisz.
    note: Rozszerza słownictwo dotyczące częstotliwości, które poznałeś(-aś) w lekcji o hobby.
  fr.a1.unit55.lesson02.teach.je_fais_du:
