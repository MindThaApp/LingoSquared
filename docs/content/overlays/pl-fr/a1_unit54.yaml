teaching:
  fr.a1.unit54.lesson01.teach.l_animal_un:
    title: Zwierzę, zwierzę domowe
    gloss: zwierzę / zwierzę domowe
    note: '*Un animal* to słowo ogólne, a *un animal de compagnie* (dosłownie „zwierzę do towarzystwa”) oznacza właśnie zwierzę domowe.'
    example_gloss:
    - Pies to zwierzę.
    - Pies to też zwierzę domowe.
  fr.a1.unit54.lesson01.teach.le_chien_le:
    title: Pies i kot
    gloss: pies / kot
    example_gloss:
    - Camille ma psa.
    - Thomas ma kota.
  fr.a1.unit54.lesson01.teach.le_poisson_l:
    title: Ryba i ptak
    gloss: ryba / ptak
    example_gloss:
    - Dziadek ma rybę.
    - Nina ma ptaka.
  fr.a1.unit54.lesson01.teach.tu_as_un:
    title: Masz zwierzę domowe?
    gloss: Masz zwierzę domowe?
    note: Ten sam wzór pytania *Tu as ... ?* znasz już z poprzednich lekcji.
  fr.a1.unit54.lesson01.teach.oui_j_ai:
    title: Tak, mam psa
    gloss: Tak, mam psa.
    note: Prosta odpowiedź twierdząca z nowym słownictwem z tej lekcji.
  fr.a1.unit54.lesson01.teach.non_je_n:
    title: Nie, nie mam zwierzęcia domowego
    gloss: Nie, nie mam zwierzęcia domowego.
    note: '*Pas d''* zastępuje *un* po przeczeniu: *Je n''ai pas d''animal de compagnie.* Zobacz notatkę gramatyczną.'
  fr.a1.unit54.lesson01.teach.apres_ne_pas:
    title: 'Pas de: przeczenie z un/une/des'
    gloss: Po *ne ... pas* słowa *un*, *une* i *des* zmieniają się w *de* lub *d'*, jak w *Je n'ai pas de temps* (które już znasz) i tutaj w *Je n'ai pas d'animal de compagnie*.
    note: 'Wykorzystujemy tu wzór znany już z *Je n''ai pas de temps*: to nie jest nowa gramatyka, tylko nowy rzeczownik.'
  fr.a1.unit54.lesson02.teach.promener:
    title: Wyprowadzać na spacer (zwierzę)
    gloss: wyprowadzać na spacer (zwierzę)
    note: '*Promener* („wyprowadzać na spacer”) to regularny czasownik na *-er*; zobacz notatkę gramatyczną.'
    example_gloss: Codziennie wyprowadzam psa na spacer.
  fr.a1.unit54.lesson02.teach.promener_est_un:
    title: Promener to regularny czasownik na -er
    gloss: '*Promener* to regularny czasownik na *-er*, jak *cuisiner*: *je promène, tu promènes, il promène le chien*. Akcent na *e* pokazuje, że ta litera jest wymawiana.'
    note: Czasownik zawsze pozostaje w jednym kawałku, tak jak inne znane ci czasowniki na *-er*.
  fr.a1.unit54.lesson02.teach.donner_a_manger:
    title: Karmić
    gloss: karmić
    example_gloss: Codziennie karmię kota.
  fr.a1.unit54.lesson02.teach.jouer_avec:
    title: Bawić się z
    gloss: bawić się z
    example_gloss: Thomas bawi się ze swoim kotem.
  fr.a1.unit54.lesson02.teach.je_promene_le:
    title: Codziennie wyprowadzam psa
    gloss: Codziennie wyprowadzam psa na spacer.
    note: Łączy *promener* z *tous les jours* („codziennie”), które znasz z wcześniejszej lekcji.
  fr.a1.unit54.lesson02.teach.je_donne_a:
    title: Codziennie karmię kota
    gloss: Codziennie karmię kota.
    note: Łączy *donner à manger* (dosłownie „dawać jeść”) z *tous les jours*.
  fr.a1.unit54.lesson03.teach.au_pluriel_on:
    title: 'Liczba mnoga: chien -> chiens'
    gloss: 'Liczba mnoga zwykle dodaje *s*, którego nie słychać: *chien -> chiens*, *chat -> chats*. Rzeczowniki na *-al* zmieniają się na *-aux*: *animal -> animaux*.'
    note: Regularna liczba mnoga w języku francuskim, wprowadzona tu po raz pierwszy na przykładzie nazw zwierząt.
  fr.a1.unit54.lesson03.teach.chiens_chats:
    title: Psy i koty
    gloss: psy / koty
    example_gloss:
    - Mathieu uwielbia psy.
    - Léa uwielbia koty.
  fr.a1.unit54.lesson03.teach.poissons_oiseaux:
    title: Ryby i ptaki (liczba mnoga)
    gloss: ryby / ptaki
    example_gloss:
    - Uwielbiam ryby.
    - Dziadek uwielbia ptaki.
  fr.a1.unit54.lesson03.teach.j_adore_les:
    title: Kocham zwierzęta
    gloss: Kocham zwierzęta.
    note: 'Po *adorer* („uwielbiać”) od razu następuje rzeczownik, a gust ogólny wymaga *les*: *J''adore les animaux.*'
  fr.a1.unit54.lesson03.teach.lea_adore_les:
    title: Léa uwielbia koty, ale nie ma zwierzęcia domowego
    gloss: Léa uwielbia koty, ale nie ma zwierzęcia domowego.
    note: 'Przeciwstawienie: kochać zwierzęta, a mimo to żadnego nie mieć.'
  fr.a1.unit54.lesson04.teach.mathieu_tu_as:
    title: Mathieu pyta o zwierzę domowe
    gloss: 'Mathieu: Masz zwierzę domowe, Camille?'
  fr.a1.unit54.lesson04.teach.camille_oui_j:
    title: Camille ma psa
    gloss: 'Camille: Tak, mam psa.'
  fr.a1.unit54.lesson04.teach.mathieu_comment_est:
    title: Mathieu pyta, jak wygląda pies
    gloss: 'Mathieu: Jak on wygląda?'
    note: Wraca pytanie *Comment est-il ?* z lekcji o wyglądzie, tym razem zadane o zwierzę.
  fr.a1.unit54.lesson04.teach.camille_il_a:
    title: Camille opisuje swojego psa
    gloss: 'Camille: Ma brązową sierść i jest mały.'
    note: Słownictwo o kolorze włosów i wielkości z lekcji o wyglądzie, tym razem do opisu sierści zwierzęcia, a nie włosów człowieka.
  fr.a1.unit54.lesson04.teach.il_et_le:
    title: Il/le przy zwierzętach
    gloss: '*Il* (on) i *le* (go) można też używać mówiąc o zwierzęciu płci męskiej, nie tylko o osobie.'
    note: Dotychczas w tym kursie *il* i *le* odnosiły się zawsze do osób; tu wyraźnie pokazujemy, że dotyczą też zwierząt.
  fr.a1.unit54.lesson04.teach.mathieu_tu_le:
    title: Mathieu pyta o spacery
    gloss: 'Mathieu: Wychodzisz z nim na spacer codziennie?'
  fr.a1.unit54.lesson04.teach.camille_oui_je:
    title: Camille opowiada o swojej codziennej rutynie
    gloss: 'Camille: Tak, codziennie chodzę z nim na spacer i daję mu jeść.'
  fr.a1.unit54.lesson05.teach.mathieu_et_lea:
    title: Mathieu, Léa i Thomas o zwierzętach
    gloss: 'Mathieu i Léa uwielbiają zwierzęta, ale żadne z nich nie ma zwierzaka. Mathieu uwielbia psy, a Léa koty. Thomas natomiast ma zwierzaka: kota. Często bawi się ze swoim kotem i codziennie daje mu jeść. A ty, masz zwierzaka?'
    note: 'Przeciwstawienie: kochać zwierzę a rzeczywiście je mieć.'
    glosses:
      adorent: kochać
      tous: oboje
      animaux: zwierzęta
      deux: oboje
      compagnie: zwierzę domowe
      chiens: psy
      chats: koty
      chat: kot
      joue: bawi się
      donne: daje
      chaque: każdy
      manger: karma
  fr.a1.unit54.lesson05.teach.thomas_joue_souvent:
    title: Thomas często bawi się ze swoim kotem
    gloss: Thomas często bawi się ze swoim kotem.
    note: '*Souvent* (często) stoi zaraz po czasowniku, tak jak w wcześniejszych opisach codziennych czynności.'
  fr.a1.unit54.lesson05.teach.j_adore_les:
    title: Kocham psy. Nie mam zwierzęcia domowego.
    gloss: Kocham psy. Nie mam zwierzęcia domowego.
    note: Wzorcowa odpowiedź z dwóch zdań, którą możesz wykorzystać w zadaniu pisemnym z tej lekcji.
  fr.a1.unit54.lesson06.teach.camille_nina_tu:
    title: Camille pyta Ninę
    gloss: 'Camille: Nina, ty też masz zwierzaka?'
  fr.a1.unit54.lesson06.teach.nina_oui_j:
    title: Nina ma ptaka o imieniu Pico
    gloss: 'Nina: Tak, mam ptaka. Nazywa się Pico.'
    note: '*Il s''appelle* (nazywa się) to czasownik znany już z pierwszej lekcji o przedstawianiu się.'
  fr.a1.unit54.lesson06.teach.mathieu_comme_c:
    title: Reakcja Mathieu
    gloss: 'Mathieu: Jak miło! Co z nim robisz codziennie?'
  fr.a1.unit54.lesson06.teach.nina_je_lui:
    title: Nina codziennie karmi ptaka
    gloss: 'Nina: Codziennie daję mu jeść.'
  fr.a1.unit54.lesson06.teach.mathieu_j_adore:
    title: Mathieu też uwielbia ptaki
    gloss: 'Mathieu: Ja też uwielbiam ptaki.'
  fr.a1.unit54.lesson06.teach.camille_c_est:
    title: Camille kończy rozmowę
    gloss: 'Camille: Super, że całą naszą trójkę łączy miłość do zwierząt!'
    note: Zakończenie rozmowy, które łączy to, co w tej lekcji wiemy o zwierzętach wszystkich trojga bohaterów.
