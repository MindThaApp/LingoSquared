teaching:
  fr.a1.unit05.lesson01.teach.poulet:
    title: Kurczak
    gloss: kurczak
    note: '*Poulet* jest rodzaju męskiego.'
    example_gloss: Poproszę kurczaka.
  fr.a1.unit05.lesson01.teach.poisson:
    title: Ryba
    gloss: ryba
    note: '*Poisson* jest rodzaju męskiego.'
    example_gloss: Ryba jest dziś świeża.
  fr.a1.unit05.lesson01.teach.salade:
    title: Sałatka
    gloss: sałatka
    note: '*Salade* jest rodzaju żeńskiego.'
    example_gloss: Ona je sałatkę.
  fr.a1.unit05.lesson01.teach.riz:
    title: Ryż
    gloss: ryż
    note: '*Riz* jest rodzaju męskiego i nie zmienia formy (w liczbie pojedynczej i mnogiej pisze się tak samo, jak *prix*).'
    example_gloss: Ryż dobrze pasuje do kurczaka.
  fr.a1.unit05.lesson01.teach.eau:
    title: Woda
    gloss: woda
    note: '*Eau* jest rodzaju żeńskiego; *l''* ulega elizji przed samogłoską – tak samo jak w *l''addition* w dalszej części tej lekcji.'
    example_gloss: Poproszę wodę.
  fr.a1.unit05.lesson01.teach.vin:
    title: Wino
    gloss: wino
    note: '*Vin* jest rodzaju męskiego.'
    example_gloss: Czerwone wino jest przepyszne.
  fr.a1.unit05.lesson01.teach.je_voudrais_poulet_salade:
    title: Zamów kurczaka i sałatkę
    gloss: Poproszę kurczaka i sałatkę.
    note: '*Du poulet* (rodzaj męski) i *de la salade* (rodzaj żeński) to rodzajniki cząstkowe („trochę”), które zgadzają się z rodzajem rzeczownika. Po określeniu ilości (*un kilo de*) używa się natomiast samego *de*.'
  fr.a1.unit05.lesson02.teach.dessert:
    title: Dessert
    gloss: deser
    note: '*Dessert* jest rodzaju męskiego.'
    example_gloss: Deser jest dziś gratis.
  fr.a1.unit05.lesson02.teach.addition:
    title: Rachunek
    gloss: rachunek
    note: '*Addition* jest rodzaju żeńskiego; *l''* ulega elizji przed samogłoską. To standardowe francuskie słowo używane w restauracji, a nie *facture* (formalna faktura).'
    example_gloss: Rachunek, proszę.
  fr.a1.unit05.lesson02.teach.vous_avez_choisi:
    title: Zapytaj, czy ktoś jest gotowy zamówić
    gloss: Czy już Państwo wybrali?
    note: Typowe pytanie kelnera, który podchodzi do stolika, by przyjąć zamówienie. Występuje w nim passé composé czasownika *choisir* (wybierać).
  fr.a1.unit05.lesson02.teach.je_voudrais_un_cafe:
    title: Zamów kawę
    gloss: Poproszę kawę.
    note: '*Je voudrais* + coś do zamówienia – ta sama konstrukcja, której używasz przy zakupach, tym razem dla jedzenia i napojów.'
  fr.a1.unit05.lesson02.teach.qcq_comme_dessert:
    title: Zapytaj, co jest dostępne
    gloss: Co macie Państwo na deser?
    note: '*Qu''est-ce que vous avez comme...?* to naturalny, często używany sposób pytania o wybór w danej kategorii.'
  fr.a1.unit05.lesson02.teach.cest_delicieux:
    title: Powiedz, że coś jest pyszne
    gloss: To jest pyszne!
    note: Typowa, pełna entuzjazmu reakcja na jedzenie. Słowo *délicieux* się tu nie zmienia, ponieważ po *c'est* nie występuje rzeczownik określonego rodzaju.
  fr.a1.unit05.lesson03.teach.line01:
    title: Powitaj i zapytaj, czy ktoś jest gotowy zamówić
    gloss: Kelner wita gości i pyta, czy są gotowi zamówić.
    note: Rozmowa zaczyna się od *Bonjour* – grzecznościowej formy powitania w kontaktach z obsługą.
  fr.a1.unit05.lesson03.teach.line02:
    title: Zamów sałatkę i wodę
    gloss: Inès zamawia sałatkę i wodę.
    note: Połączenie *je voudrais* ze spójnikiem *et* pozwala zamówić dwie rzeczy w jednej wypowiedzi.
  fr.a1.unit05.lesson03.teach.line03:
    title: Zamów kurczaka z ryżem
    gloss: Mathieu zamawia kurczaka z ryżem.
    note: '*Avec* (z) łączy główne danie z dodatkiem – to prosta i częsta konstrukcja przy zamawianiu.'
  fr.a1.unit05.lesson03.teach.line04:
    title: Potwierdź i zapytaj o napoje
    gloss: Kelner potwierdza zamówienie i pyta o napoje.
    note: '*Et comme boisson pour vous ?* wykorzystuje wzór z *comme* znany z pytania *Qu''est-ce que vous avez comme dessert ?*, tym razem w odniesieniu do napojów.'
  fr.a1.unit05.lesson03.teach.line05:
    title: Zamów kieliszek wina
    gloss: Mathieu zamawia kieliszek czerwonego wina.
    note: '*Un verre de* (szklanka/kieliszek) to standardowy sposób zamawiania wina na kieliszki.'
  fr.a1.unit05.lesson03.teach.line06:
    title: Zareaguj na jedzenie
    gloss: Inès mówi, że sałatka jest pyszna.
    note: Znowu pojawia się *C'est délicieux !*, tym razem o konkretnym daniu (*cette salade*). Po *c'est* słowo *délicieux* pozostaje w rodzaju męskim, mimo że *salade* jest rodzaju żeńskiego; formą zgodną z rodzajem jest *Elle est délicieuse, cette salade !*.
  fr.a1.unit05.lesson03.teach.line07:
    title: Wyjaśnij, że jesteście głodni, i poproś o rachunek
    gloss: Mathieu mówi, że po warsztatach zgłodnieli, i prosi o rachunek.
    note: '*Nous a donné faim* (dosłownie „dał nam głód”) to naturalny francuski sposób, by powiedzieć, że coś wywołało u nas głód.'
  fr.a1.unit05.lesson03.teach.line08:
    title: Potwierdź, że rachunek zaraz będzie
    gloss: Kelner potwierdza, że przyniesie go od razu.
    note: '*Tout de suite* (od razu, natychmiast) to częste, uspokajające wyrażenie w kontaktach z obsługą.'
