    title: Au revoir i À + dzień tygodnia
    gloss: 'Znasz już *Au revoir !* Możesz też nazwać dzień: *À samedi !*, *À demain !*'
    note: Rozszerza wzór pożegnania z tematu o powitaniach na konkretny dzień.
  fr.a1.unit57.lesson05.teach.camille_appelle_mathieu:
    title: Kto czego używa?
    gloss: Camille dzwoni do Mathieu codziennie. Używa telefonu, a nie aplikacji. Mathieu nie ma w domu komputera, ale korzysta z internetu w telefonie. Thomas co rano sprawdza prognozę pogody. Potem idzie pobiegać. Léa często wysyła Camille wiadomości. A ty, czy też codziennie używasz telefonu?
    note: Porównanie tego, jak wszystkie cztery postacie korzystają z urządzeń, na wzór tekstu porównawczego z tematu o sporcie.
