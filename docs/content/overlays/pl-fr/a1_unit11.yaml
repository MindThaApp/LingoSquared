answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francuski A1
  description: 'Proponowanie, przyjmowanie, odmawianie i ustalanie prostego planu. Ciąg dalszy historii Inès i Mathieu z warsztatów kulinarnych: umawiają się na wspólne zakupy składników przed sobotnimi zajęciami. Warto zapamiętać, że *se retrouver* (spotkać się, czasownik zwrotny o znaczeniu wzajemnym) oddajemy po polsku zwykle opisowo, a *vers* + godzina oznacza godzinę przybliżoną, a nie dokładną.'
units:
  fr.a1.unit11.plans:
    title: Kiedy się spotykamy?
lessons:
  fr.a1.unit11.lesson01.vocabulaire_projets:
    title: Proponowanie godziny
  fr.a1.unit11.lesson02.accepter_refuser:
