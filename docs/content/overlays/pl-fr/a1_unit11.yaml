  fr.a1.unit11.lesson03.dialogue_projet_courses:
    title: Planowanie zakupów
teaching:
  fr.a1.unit11.lesson01.teach.libre:
    title: Wolny / dostępny
    gloss: wolny / dostępny
    note: '*Libre* opisuje tu czyjąś dostępność; na coś, co nic nie kosztuje, francuski używa słowa *gratuit*.'
    example_gloss: Jesteś wolny w sobotę?
  fr.a1.unit11.lesson01.teach.occupe:
    title: Zajęty
    gloss: zajęty
    note: 'Bezpośrednie przeciwieństwo *libre*. Zgadza się w rodzaju: *occupé* / *occupée*.'
    example_gloss: W piątek wieczorem jestem zajęty.
  fr.a1.unit11.lesson01.teach.se_retrouver:
    title: Spotkać się
    gloss: spotkać się
    note: W tym znaczeniu *se retrouver* ma sens wzajemny – dwie lub więcej osób spotyka się ze sobą – inaczej niż *trouver* (znaleźć).
    example_gloss: Gdzie spotykamy się dziś wieczorem?
  fr.a1.unit11.lesson01.teach.vers:
    title: Około (godziny)
    gloss: około (godziny)
    note: '*Vers* + godzina wyraża czas przybliżony, łagodniejszy niż podanie dokładnej godziny.'
    example_gloss: Wpadnę około siódmej.
  fr.a1.unit11.lesson01.teach.ca_te_dit_de:
    title: Co powiesz na... ?
    gloss: Co powiesz na wspólne zakupy?
    note: '*Ça te dit de... ?* + bezokolicznik to częsty, swobodny sposób zaproponowania czegoś – mniej oficjalny niż *Voulez-vous... ?*'
  fr.a1.unit11.lesson01.teach.venir_chercher:
    title: Przyjść po kogoś
    gloss: Przyjdziesz po mnie około osiemnastej?
    note: '*Venir chercher quelqu''un* znaczy przyjść po kogoś i go zabrać, a nie tylko „szukać”.'
  fr.a1.unit11.lesson01.teach.daccord_a_tout_a_lheure:
    title: Zgoda, do zobaczenia wkrótce
    gloss: Dobrze, do zobaczenia za chwilę!
    note: '*D''accord* (zgoda) potwierdza plan; *à tout à l''heure* mówimy, gdy zobaczymy się znowu tego samego dnia.'
  fr.a1.unit11.lesson02.teach.je_ne_peux_pas:
    title: Odmowa
    gloss: Nie mogę, jestem zajęty.
    note: '*Je ne peux pas* (nie mogę) + powód to prosty, uprzejmy sposób odmowy.'
  fr.a1.unit11.lesson02.teach.avec_plaisir:
    title: Przyjęcie z radością
    gloss: Z przyjemnością!
    note: '*Avec plaisir* (dosłownie „z przyjemnością”) to ciepły, pełen entuzjazmu sposób przyjęcia zaproszenia.'
  fr.a1.unit11.lesson02.teach.a_quelle_heure_on_se_voit:
    title: Pytanie o godzinę
    gloss: O której się widzimy?
    note: '*On se voit* (potocznie „widzimy się”) to częsta, swobodna alternatywa dla *se retrouver* przy umawianiu się.'
  fr.a1.unit11.lesson02.teach.devant_le_marche:
    title: Propozycja miejsca
    gloss: Przed targiem, pasuje ci?
    note: '*Ça te va ?* (pasuje ci?) sprawdza, czy zaproponowany szczegół odpowiada drugiej osobie.'
  fr.a1.unit11.lesson02.teach.parfait_alors:
    title: Potwierdzenie planu
    gloss: Idealnie, to do zobaczenia w piątek!
    note: '*Alors* znaczy tu „więc” i potwierdza ustalenia, kończąc rozmowę o planach.'
  fr.a1.unit11.lesson03.teach.line01:
    title: Propozycja wspólnych zakupów
    gloss: Inès pyta Mathieu, czy miałby ochotę zrobić razem zakupy przed warsztatami.
    note: '*Ça te dit de... ?* rozpoczyna rozmowę swobodną propozycją.'
  fr.a1.unit11.lesson03.teach.line02:
    title: Zgoda i pytanie o miejsce
    gloss: Mathieu odpowiada, że z przyjemnością, i pyta, gdzie się spotkają.
    note: Łączy *Avec plaisir* (z przyjemnością) z *se retrouver* (spotkać się).
  fr.a1.unit11.lesson03.teach.line03:
    title: Propozycja miejsca i dnia
    gloss: Inès proponuje spotkanie przed targiem w piątek wieczorem.
    note: Krótka propozycja łącząca miejsce (*devant le marché*) i dzień (*vendredi soir*).
  fr.a1.unit11.lesson03.teach.line04:
    title: Zgoda i pytanie o godzinę
    gloss: Mathieu się zgadza i pyta o godzinę.
    note: '*D''accord* potwierdza miejsce i dzień; kolejne pytanie doprecyzowuje godzinę.'
  fr.a1.unit11.lesson03.teach.line05:
    title: Propozycja konkretnej godziny
    gloss: Inès pyta, czy Mathieu przyjdzie po nią około osiemnastej.
    note: Użycie *venir chercher* + *vers* z konkretną godziną.
  fr.a1.unit11.lesson03.teach.line06:
    title: Potwierdzenie wszystkiego
    gloss: Mathieu mówi, że idealnie, do zobaczenia w piątek, o osiemnastej przed targiem.
    note: Powtarza wszystkie trzy szczegóły planu (dzień, godzinę, miejsce), by jasno zakończyć rozmowę.
