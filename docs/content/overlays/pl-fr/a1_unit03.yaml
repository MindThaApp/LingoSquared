answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francuski A1
  description: Słownictwo dotyczące najbliższej i dalszej rodziny, system przymiotników dzierżawczych mon/ma/mes oraz opisywanie domowników – ciąg dalszy historii Inès i Mathieu z warsztatów kulinarnych z jednostek 01–02. We francuskim przymiotniki dzierżawcze zgadzają się z rodzajem rzeczownika, a nie właściciela.
units:
  fr.a1.unit03.family:
    title: Rodziny Inès i Mathieu
lessons:
  fr.a1.unit03.lesson01.immediate_family:
    title: Najbliższa rodzina
  fr.a1.unit03.lesson02.possessives_mon_ma_mes:
    title: 'Przymiotniki dzierżawcze: mon, ma, mes'
  fr.a1.unit03.lesson03.extended_family:
    title: Dalsza rodzina
  fr.a1.unit03.lesson04.describing_family_size:
    title: Ile osób jest w domu
  fr.a1.unit03.lesson05.reading_a_family_profile:
    title: Czytamy profil rodziny
  fr.a1.unit03.lesson06.family_photos_dialogue:
    title: Rodzinne zdjęcia Inès i Mathieu
teaching:
  fr.a1.unit03.lesson01.teach.mere:
    title: Matka
    gloss: matka
    note: '*Mère* jest rodzaju żeńskiego. *Maman* to częstsze słowo na co dzień w rodzinie, a *mère* jest neutralne i występuje w słownictwie tego kursu.'
  fr.a1.unit03.lesson01.teach.pere:
    title: Ojciec
    gloss: ojciec
    note: '*Père* jest rodzaju męskiego. *Papa* to odpowiednik używany na co dzień, tak samo jak *maman* przy *mère*.'
  fr.a1.unit03.lesson01.teach.frere:
    title: Brat
    gloss: brat
    note: '*Frère* jest rodzaju męskiego, w liczbie pojedynczej.'
  fr.a1.unit03.lesson01.teach.soeur:
    title: Siostra
    gloss: siostra
    note: '*Sœur* jest rodzaju żeńskiego, w liczbie pojedynczej. Ligatura œ to w pisowni francuskiej jedna litera, a nie dwie osobne.'
  fr.a1.unit03.lesson01.teach.fils:
    title: Syn
    gloss: syn
    note: '*Fils* jest rodzaju męskiego; wymowa jest wyjątkowa: końcowe s się wymawia, a l jest nieme.'
  fr.a1.unit03.lesson01.teach.fille:
    title: Córka
    gloss: córka
    note: '*Fille* jest rodzaju żeńskiego, w liczbie pojedynczej; to samo słowo znaczy też „dziewczynka” lub „dziewczyna”.'
  fr.a1.unit03.lesson01.teach.parents:
    title: Parents
    gloss: rodzice
    note: '*Parents* jest rodzaju męskiego, w liczbie mnogiej, i oznacza razem matkę i ojca.'
  fr.a1.unit03.lesson01.teach.freres_et_soeurs:
    title: Rodzeństwo
    gloss: bracia i siostry; rodzeństwo
    note: Po francusku nie ma jednego słowa na „rodzeństwo” – mówi się *frères et sœurs*, wymieniając wprost obie grupy.
  fr.a1.unit03.lesson02.teach.ma_mere:
    title: Moja matka
    gloss: moja matka
    note: '*Ma* to forma rodzaju żeńskiego liczby pojedynczej zaimka dzierżawczego „mój/moja”, użyta, ponieważ *mère* jest rodzaju żeńskiego.'
  fr.a1.unit03.lesson02.teach.mon_pere:
    title: Mój ojciec
    gloss: mój ojciec
    note: '*Mon* to forma rodzaju męskiego liczby pojedynczej zaimka dzierżawczego „mój”, użyta, ponieważ *père* jest rodzaju męskiego.'
  fr.a1.unit03.lesson02.teach.mes_freres_et_soeurs:
    title: Moje rodzeństwo
    gloss: moje rodzeństwo
    note: '*Mes* to forma liczby mnogiej zaimka dzierżawczego „moi/moje”, używana przy każdym rzeczowniku w liczbie mnogiej, niezależnie od rodzaju – ten sam mechanizm zgodności co w *ma*/*mon*, ale dotyczy liczby, a nie rodzaju.'
  fr.a1.unit03.lesson02.teach.as_tu_des_freres_et_soeurs:
    title: Pytanie o rodzeństwo
    gloss: Masz rodzeństwo?
    note: '*As-tu* to pytająca forma z inwersją od *tu as* (masz), częsty wzorzec pytania na poziomie A1.'
  fr.a1.unit03.lesson02.teach.jai_deux_soeurs:
    title: Podawanie liczby rodzeństwa
    gloss: Mam dwie siostry.
    note: '*J''ai* (mam) razem z liczebnikiem i rzeczownikiem oznaczającym członka rodziny to standardowy sposób opisania rodzeństwa.'
  fr.a1.unit03.lesson02.teach.ta_famille_est_grande:
    title: Pytanie, czy rodzina jest duża
    gloss: Czy twoja rodzina jest duża?
    note: '*Ta* to forma rodzaju żeńskiego liczby pojedynczej nieformalnego zaimka dzierżawczego „twój/twoja”, zgodna z rzeczownikiem rodzaju żeńskiego *famille*.'
  fr.a1.unit03.lesson02.teach.ma_famille_est_petite:
    title: Opis małej rodziny
    gloss: Moja rodzina jest mała.
    note: '*Petite* zgadza się z rzeczownikiem rodzaju żeńskiego *famille*; przy rzeczowniku rodzaju męskiego pojawiłaby się forma *petit*. To inny rodzaj zgodności niż w *mon*/*ma*/*mes*: tamte też zgadzają się z rzeczownikiem, ale wskazują na posiadanie, a nie opisują cechy.'
  fr.a1.unit03.lesson03.teach.grand_pere:
    title: Dziadek
    gloss: dziadek
    note: '*Grand-père* to złożenie z łącznikiem, rodzaju męskiego.'
  fr.a1.unit03.lesson03.teach.grand_mere:
    title: Babcia
    gloss: babcia
    note: '*Grand-mère* to złożenie z łącznikiem, rodzaju żeńskiego. Zwróć uwagę, że *grand-* pozostaje tu niezmienne i nie przybiera formy *grande-mère*.'
  fr.a1.unit03.lesson03.teach.grands_parents:
    title: Dziadkowie
    gloss: dziadkowie
    note: W *grands-parents* liczbę mnogą mają obie części złożenia (*grands*, a nie *grand-*), inaczej niż w liczbie pojedynczej *grand-mère*/*grand-père*, gdzie część *grand-* się nie zmienia.
  fr.a1.unit03.lesson03.teach.oncle:
    title: Wujek
    gloss: wujek
    note: '*Oncle* jest rodzaju męskiego.'
  fr.a1.unit03.lesson03.teach.tante:
    title: Ciocia
    gloss: ciotka
    note: '*Tante* jest rodzaju żeńskiego.'
  fr.a1.unit03.lesson03.teach.cousin:
    title: Kuzyn
    gloss: kuzyn
    note: '*Cousin* to rodzaj męski liczby pojedynczej; francuski, podobnie jak polski, rozróżnia płeć kuzyna formą wyrazu (cousin – cousine).'
  fr.a1.unit03.lesson03.teach.cousine:
    title: Kuzynka
    gloss: kuzynka
    note: '*Cousine* to rodzaj żeński liczby pojedynczej, utworzony przez dodanie -e do *cousin*.'
  fr.a1.unit03.lesson03.teach.mes_grands_parents:
    title: Moi dziadkowie
    gloss: moi dziadkowie
    note: Użyto *mes*, ponieważ *grands-parents* jest w liczbie mnogiej, mimo że to słowo obejmuje i mężczyznę, i (domyślnie) kobietę.
  fr.a1.unit03.lesson04.teach.combien_de_freres_et_soeurs:
    title: Zapytaj o liczbę rodzeństwa
    gloss: Ile masz rodzeństwa?
    note: '*Combien de* (ile) stoi bezpośrednio przed rzeczownikiem, a samo pytanie tworzy się przez inwersję (as-tu), bez żadnego dodatkowego słowa pomocniczego.'
  fr.a1.unit03.lesson04.teach.on_est_cinq:
    title: Podaj liczbę osób w domu
    gloss: Jest nas sześcioro w domu.
    note: '*On est* (dosłownie „się jest”, ale w potocznym języku znaczy „jesteśmy”) to naturalny, bardzo częsty w mowie sposób podania liczby domowników – *nous sommes* brzmi bardziej formalnie i książkowo.'
  fr.a1.unit03.lesson04.teach.ma_famille_est_grande:
    title: Opisz dużą rodzinę
    gloss: Moja rodzina jest duża.
    note: '*Grande* zgadza się z rzeczownikiem rodzaju żeńskiego *famille*; przy rzeczowniku rodzaju męskiego pojawiłaby się forma *grand*.'
  fr.a1.unit03.lesson04.teach.jai_beaucoup_de_cousins:
    title: Powiedz, że masz wielu kuzynów
    gloss: Mam wielu kuzynów.
    note: '*Beaucoup de* (dużo) stoi przed rzeczownikiem; *de* nie zmienia się tu w *du*/*des*, ponieważ *beaucoup* już określa ilość.'
  fr.a1.unit03.lesson04.teach.tu_habites_pres_de_tes_parents:
    title: Zapytaj, czy ktoś mieszka blisko rodziców
    gloss: Czy mieszkasz blisko rodziców?
    note: '*Tes* to forma liczby mnogiej nieformalnego zaimka dzierżawczego „twoi/twoje”, wymagana, bo *parents* jest w liczbie mnogiej.'
  fr.a1.unit03.lesson04.teach.jhabite_avec_mes_grands_parents:
    title: Powiedz, z kim mieszkasz
    gloss: Mieszkam z dziadkami.
    note: '*Avec* (z) wprowadza osoby, z którymi ktoś mieszka; *j''habite* to forma *je* od *habiter*, którą znasz już z jednostki 1: *j''habite à Montreuil*.'
  fr.a1.unit03.lesson05.teach.profile_reading:
    title: Profil rodziny Inès
    gloss: 'Nazywam się Inès. Mam trzydzieści jeden lat i mieszkam z dziadkami w Paryżu. Moja mama i tata mieszkają w Lille. Mam dwie siostry i brata: jest nas sześcioro w domu. Moja młodsza siostra ma na imię Camille i ma dwadzieścia lat.'
    note: Ten profil wykorzystuje słownictwo i struktury z lekcji 1–4 w spójnym, krótkim tekście zamiast w pojedynczych zdaniach – to ta sama umiejętność rozpoznawania, kto jest kim, na której skupia się sprawdzian czytania w tej jednostce.
    glosses:
      trente: trzydzieści
      ans: lat
      grands-parents: dziadkowie
      mère: matka
      père: ojciec
      habitent: mieszkają
      deux: dwa
      sœurs: siostry
      frère: brat
      six: sześć
      maison: dom
      petite: młodsza / mała
      sœur: siostra
      vingt: dwadzieścia
  fr.a1.unit03.lesson05.teach.petite_soeur:
    title: Młodsza siostra
    gloss: młodsza siostra; mała siostra
    note: '*Petite* (żeńska forma od *petit*) stoi tu przed rzeczownikiem, jak większość krótkich, częstych przymiotników francuskich; większość pozostałych przymiotników stoi po rzeczowniku.'
  fr.a1.unit03.lesson05.teach.habite_third_person:
    title: Mieszka (trzecia osoba)
    gloss: mieszka
    note: '*Habite* to forma 3. osoby liczby pojedynczej od *habiter*, używana, gdy mówimy O kimś (*Inès habite...*), a nie o sobie (*j''habite*, z jednostki 1 i z lekcji 4 tej jednostki).'
  fr.a1.unit03.lesson05.teach.ses_third_person_plural:
    title: Jej/jego/ich (rzeczownik w liczbie mnogiej)
    gloss: jej/jego/ich
    note: '*Ses* to liczba mnoga od *sa*/*son*; *sa*/*son* oznaczają „jej/jego” przy rzeczowniku w liczbie pojedynczej, a ses przy rzeczowniku w liczbie mnogiej – *ses grands-parents* znaczy „jej dziadkowie”, gdy mówimy o Inès w 3. osobie.'
  fr.a1.unit03.lesson05.teach.a_third_person_avoir:
    title: Ma (3. osoba)
    gloss: ma
    note: '*A* to forma 3. osoby liczby pojedynczej od *avoir*, używana, gdy mówimy O kimś (*elle a vingt ans*), a nie o sobie (*j''ai* / *as-tu*, z lekcji 2–4 tej jednostki).'
  fr.a1.unit03.lesson06.teach.line01:
    title: Pokaż zdjęcia rodziny
    gloss: Inès pokazuje Mathieu zdjęcie i przedstawia swoich rodziców oraz młodszą siostrę.
    note: '*Voici* (oto) wprowadza coś, na co się wskazuje – to naturalne wyrażenie przy pokazywaniu zdjęcia.'
  fr.a1.unit03.lesson06.teach.line02:
    title: Zareaguj i zapytaj o rodzeństwo
    gloss: Mathieu reaguje ciepło i pyta, czy Inès ma jeszcze inne rodzeństwo.
    note: '*C''est adorable* to naturalna, ciepła reakcja na zdjęcie młodszego rodzeństwa.'
  fr.a1.unit03.lesson06.teach.line03:
    title: Podaj liczbę domowników i zadaj pytanie zwrotne
    gloss: Inès mówi, że ma dwie siostry i brata – w domu jest ich sześcioro – a potem pyta o rodzinę Mathieu.
    note: '*On est six à la maison* podaje łączną liczbę domowników, kontynuując wzorzec z lekcji 4.'
  fr.a1.unit03.lesson06.teach.line04:
    title: Opisz mniejszą rodzinę
    gloss: 'Mathieu mówi, że jego rodzina jest mniejsza – jest ich tylko troje: rodzice i on – ale ma wielu kuzynów.'
    note: '*Mais* (ale) sygnalizuje kontrast między małą najbliższą rodziną a licznymi dalszymi krewnymi.'
  fr.a1.unit03.lesson06.teach.line05:
    title: Zapytaj o bliskość rodziców
    gloss: Inès pyta, czy Mathieu mieszka blisko rodziców.
    note: '*Près de* (blisko) to częsty sposób opisania bliskości w przestrzeni.'
  fr.a1.unit03.lesson06.teach.line06:
    title: Wyjaśnij odległość i utrzymywanie kontaktu
    gloss: Mathieu odpowiada, że nie, jego rodzice mieszkają w Lyonie i co tydzień rozmawiają przez telefon.
    note: Kontynuacja faktu z jednostki 1, że Mathieu pochodzi z Lyonu – jego rodzice zostali tam, a on mieszka w Saint-Ouen.
  fr.a1.unit03.lesson06.teach.line07:
    title: Okaż zrozumienie i opowiedz o swojej sytuacji
    gloss: Inès mówi, że rozumie, i że mieszka tu, w Paryżu, z dziadkami.
    note: '*Je comprends* (rozumiem) to naturalny, krótki sposób, by pokazać, że rozumiesz to, co ktoś właśnie powiedział, zanim dodasz coś od siebie.'
  fr.a1.unit03.lesson06.teach.line08:
    title: Zakończ ciepłą uwagą
    gloss: Mathieu mówi, że dobrze jest mieć rodzinę blisko siebie.
    note: '*C''est bien d''avoir sa famille près de soi* kończy rozmowę ciepłą, refleksyjną nutą, nawiązując do wzorca *près de* z lekcji 4.'
