  fr.a1.unit02.lesson01.numbers_zero_to_ten:
    title: Liczby od zera do dziesięciu
  fr.a1.unit02.lesson02.numbers_eleven_to_hundred:
    title: 'Formy szczególne: od jedenastu do stu'
  fr.a1.unit02.lesson03.asking_age:
    title: Pytanie o wiek
  fr.a1.unit02.lesson04.phone_numbers:
    title: Numery telefonów
  fr.a1.unit02.lesson05.recipe_quantities:
    title: Ilości w przepisach
  fr.a1.unit02.lesson06.recipe_count_dialogue:
    title: Liczymy składniki z Inès i Mathieu
teaching:
  fr.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: zero
    note: '*Zéro* jest używane zarówno jako sama liczba, jak i jako cyfra przy odczytywaniu ciągu cyfr na głos.'
  fr.a1.unit02.lesson01.teach.un:
    title: Jeden
    gloss: jeden
    note: '*Un* jest rodzaju męskiego; forma żeńska *une* pojawia się przed rzeczownikiem żeńskim (*une tasse*, jedna filiżanka). Samo, na przykład przy liczeniu, pozostaje *un*.'
  fr.a1.unit02.lesson01.teach.deux:
    title: Dwa
    gloss: dwa
    note: '*Deux* nie zmienia formy, niezależnie od rodzaju rzeczownika.'
  fr.a1.unit02.lesson01.teach.trois:
    title: Trzy
    gloss: trzy
    note: '*Trois* jest niezmienne.'
  fr.a1.unit02.lesson01.teach.quatre:
    title: Cztery
    gloss: cztery
    note: '*Quatre* jest niezmienne.'
  fr.a1.unit02.lesson01.teach.cinq:
    title: Pięć
    gloss: pięć
    note: '*Cinq* jest niezmienne. Końcowe q zwykle się wymawia, inaczej niż w przypadku niemych końcowych spółgłosek kilku innych francuskich liczebników.'
  fr.a1.unit02.lesson01.teach.six:
    title: Six
    gloss: sześć
    note: '*Six* wymawia się z końcowym /s/, gdy stoi samo, ale ta końcowa spółgłoska zanika przed rzeczownikiem zaczynającym się od spółgłoski (*six livres* brzmi jak „si livres”).'
  fr.a1.unit02.lesson01.teach.sept:
    title: Siedem
    gloss: siedem
    note: '*Sept* jest niezmienne; p jest nieme, wymawia się tylko końcowe t.'
  fr.a1.unit02.lesson01.teach.huit:
    title: Osiem
    gloss: osiem
    note: '*Huit* jest niezmienne. H jest nieme, jak w niemal wszystkich francuskich słowach.'
  fr.a1.unit02.lesson01.teach.neuf:
    title: Dziewięć
    gloss: dziewięć
    note: '*Neuf* jest niezmienne.'
  fr.a1.unit02.lesson01.teach.dix:
    title: Dziesięć
    gloss: dziesięć
    note: '*Dix* wymawia się z końcowym /s/, gdy stoi samo; przed spółgłoską końcowa spółgłoska zanika — tak samo jak w *six*.'
  fr.a1.unit02.lesson02.teach.onze:
    title: Jedenaście
    gloss: jedenaście
    note: '*Onze* do *seize* (11–16) to osobne słowa, a nie złożenia z *dix*, w przeciwieństwie do liczb od dwudziestu jeden wzwyż, w których powraca *vingt*.'
  fr.a1.unit02.lesson02.teach.douze:
    title: Dwanaście
    gloss: dwanaście
    note: '*Douze* to jedno słowo. Na początku przypomina *deux*, ale nie ma w nim widocznego *dix*.'
  fr.a1.unit02.lesson02.teach.treize:
    title: Trzynaście
    gloss: trzynaście
    note: '*Treize* to jedno słowo. Na początku przypomina *trois*, ale nie widać w nim *dix*.'
  fr.a1.unit02.lesson02.teach.quatorze:
    title: Czternaście
    gloss: czternaście
    note: '*Quatorze* to jedno słowo. Na początku przypomina *quatre*, ale nie widać w nim *dix*.'
  fr.a1.unit02.lesson02.teach.quinze:
    title: Piętnaście
    gloss: piętnaście
    note: '*Quinze* to jedno słowo. Jest tylko w dalekim pokrewieństwie z *cinq*, a *dix* w nim nie widać.'
  fr.a1.unit02.lesson02.teach.seize:
    title: Szesnaście
    gloss: szesnaście
    note: '*Seize* to ostatnie ze zrośniętych słów typu „-naście”; od *dix-sept* (17) *dix* znów widać wyraźnie połączone z jednostką.'
  fr.a1.unit02.lesson02.teach.vingt:
    title: Dwadzieścia
    gloss: dwadzieścia
    note: '*Vingt* to osobne słowo. Od dwudziestu jeden dziesiątki i jedności łączą się (*vingt et un*, *vingt-deux*) według wzoru, do którego wrócimy niżej.'
  fr.a1.unit02.lesson02.teach.trente:
    title: Trzydzieści
    gloss: trzydzieści
    note: '*Trente* łączy się z następującą jednostką łącznikiem (*trente-quatre*), a tylko przy jedynce bierze *et* (*trente et un*).'
  fr.a1.unit02.lesson02.teach.trente_quatre:
    title: Trzydzieści cztery
    gloss: trzydzieści cztery
    note: '*Trente-quatre* pisze się z łącznikiem, a po polsku ten liczebnik zapisujemy jako dwa osobne słowa: trzydzieści cztery.'
  fr.a1.unit02.lesson02.teach.soixante:
    title: Sześćdziesiąt
    gloss: sześćdziesiąt
    note: '*Soixante* zachowuje się jak zwykła dziesiątka (*soixante-quatre*, 64) aż do sześćdziesięciu dziewięciu – nieregularność zaczyna się od siedemdziesięciu, o których będzie za chwilę.'
  fr.a1.unit02.lesson02.teach.soixante_dix:
    title: Siedemdziesiąt
    gloss: siedemdziesiąt
    note: 'To największe zaskoczenie we francuskich liczebnikach: nie ma osobnego słowa na siedemdziesiąt. *Soixante-dix* znaczy dosłownie „sześćdziesiąt-dziesięć” (60 + 10). Tak liczy się aż do *soixante-dix-neuf* (79, „sześćdziesiąt-dziewiętnaście”), a potem *quatre-vingts* otwiera nową podstawę przy osiemdziesięciu.'
  fr.a1.unit02.lesson02.teach.quatre_vingts:
    title: Osiemdziesiąt
    gloss: osiemdziesiąt
    note: '*Quatre-vingts* znaczy dosłownie „cztery dwudziestki” (4 x 20) – to pozostałość dawnego systemu liczenia dwudziestkami. Końcowe s występuje tylko wtedy, gdy liczebnik stoi sam lub kończy liczbę (*quatre-vingts*, 80); gdy po nim idzie jedność, s znika (*quatre-vingt-un*, 81).'
  fr.a1.unit02.lesson02.teach.quatre_vingt_dix:
    title: Dziewięćdziesiąt
    gloss: dziewięćdziesiąt
    note: '*Quatre-vingt-dix* znaczy dosłownie „cztery dwudziestki plus dziesięć” (4x20 + 10) – ten sam wzór liczenia dwudziestkami co przy siedemdziesięciu, aż do *quatre-vingt-dix-neuf* (99).'
  fr.a1.unit02.lesson02.teach.cent:
    title: Sto
    gloss: sto
    note: '*Cent* to forma na równo 100 użyta samodzielnie, bez rodzajnika (nie „*un cent*”).'
  fr.a1.unit02.lesson03.teach.quel_age_as_tu:
    title: Pytanie o wiek (nieformalnie)
    gloss: Ile masz lat?
    note: 'Po francusku pyta się dosłownie o wiek, który się ma, z czasownikiem *avoir* (mieć), a nie z *être* („być”) – podobnie jak po polsku: „Ile masz lat?”.'
  fr.a1.unit02.lesson03.teach.jai_vingt_huit_ans:
    title: Podawanie wieku
    gloss: Mam dwadzieścia osiem lat.
    note: '*Ai* to forma *avoir* dla je. Słowo *ans* (lata) jest po francusku obowiązkowe, tak jak po polsku w zdaniu „Mam dwadzieścia osiem lat”.'
  fr.a1.unit02.lesson03.teach.quel_age_avez_vous:
    title: Pytanie o wiek (formalnie)
    gloss: Ile masz lat?
    note: '*Avez-vous* to forma *avoir* dla *vous*, zgodna z oficjalnym rejestrem wprowadzonym w jednostce 1.'
  fr.a1.unit02.lesson03.teach.jai_trente_et_un_ans:
    title: Podawanie wieku z liczbą złożoną
    gloss: Mam trzydzieści jeden lat.
    note: '*Trente et un* ma *et* („i”), a nie łącznik, i tak jest w formach z jedynką od trzydziestu do sześćdziesięciu (*trente et un*, *quarante et un*, *cinquante et un*, *soixante et un*). Siedemdziesiąt jeden łamie ten wzór: to *soixante et onze* (sześćdziesiąt + jedenaście), a nie *soixante et un*, bo w siedemdziesiątkach liczy się dalej formami z *dix* aż do *soixante-dix-neuf* (79).'
  fr.a1.unit02.lesson03.teach.et_toi_quel_age:
    title: Zwrot pytania o wiek
    gloss: A ty, ile masz lat?
    note: '*Et toi* otwiera pytanie zwrotne; *toi* (a nie *tu*) to zaimek akcentowany używany po *et* dla podkreślenia.'
  fr.a1.unit02.lesson04.teach.quel_est_ton_numero:
    title: Zapytaj o numer telefonu
    gloss: Jaki jest twój numer telefonu?
    note: '*Quel* zgadza się z rzeczownikiem rodzaju męskiego *numéro*; przy rzeczowniku rodzaju żeńskiego potrzebne byłoby *quelle*.'
  fr.a1.unit02.lesson04.teach.numero_ines:
    title: Numer odczytany cyfra po cyfrze
    gloss: Zero, sześć, jeden, pięć, zero, dwa, dziewięć, siedem, cztery, trzy
    note: Prawdziwe francuskie numery telefonów mają dziesięć cyfr i zwykle czyta się je parami (*zéro six*, *quinze*, *zéro deux*...). Numery w tej jednostce mają prawdziwy dziesięciocyfrowy format (06 15 02 97 43), ale czyta się je cyfra po cyfrze, żebyś mógł najpierw poćwiczyć pojedyncze cyfry.
  fr.a1.unit02.lesson04.teach.cest_le:
    title: Wprowadź numer
    gloss: To jest...
    note: '*Le* (rodzaj męski) pojawia się, bo *numéro* jest rzeczownikiem rodzaju męskiego.'
  fr.a1.unit02.lesson04.teach.tu_peux_repeter:
    title: Poproś o powtórzenie
    gloss: Możesz powtórzyć, proszę?
    note: '*Peux* to forma *tu* czasownika *pouvoir* (móc) – przydaje się, gdy podawany numer padnie zbyt szybko, by go zapamiętać.'
  fr.a1.unit02.lesson04.teach.bien_sur:
    title: Zgódź się chętnie
    gloss: Oczywiście; jasne
    note: '*Bien sûr* to częsty, przyjazny sposób zgody na prośbę.'
  fr.a1.unit02.lesson05.teach.jai_besoin_trois_oeufs:
    title: Podaj potrzebną ilość
    gloss: Potrzebuję trzech jajek.
    note: '*J''ai besoin de* (dosłownie „mam potrzebę”) to sposób, w jaki po francusku wyraża się „potrzebować”: z czasownikiem *avoir*, a nie jednym osobnym czasownikiem.'
  fr.a1.unit02.lesson05.teach.combien_oeufs:
    title: Zapytaj, ile czegoś trzeba
    gloss: Ile jajek potrzebujesz?
    note: W *De combien d'œufs* wyrażenie *de combien* („ile”) stoi przed rzeczownikiem, a de na początku wynika z konstrukcji avoir besoin de.
  fr.a1.unit02.lesson05.teach.deux_tasses_farine:
    title: Podaj odmierzoną ilość
    gloss: Dwie szklanki mąki
    note: '*De* łączy miarę (*tasses*, filiżanki) z tym, co mierzymy (*farine*, mąka) – po polsku robi to dopełniacz: dwie szklanki mąki.'
  fr.a1.unit02.lesson05.teach.demi_tasse:
    title: Podaj połowę ilości
    gloss: Pół szklanki cukru
    note: '*Demi-* jako przedrostek przed rzeczownikiem się nie zmienia (*une demi-tasse*), w przeciwieństwie do przymiotnika *demi* po rzeczowniku, który się zgadza (*une heure et demie*).'
  fr.a1.unit02.lesson05.teach.jai_quatre_oeufs:
    title: Powiedz, co masz
    gloss: Mam cztery jajka na stole.
    note: '*J''ai* (mam) mówi o tym, co już jest dostępne, w odróżnieniu od *j''ai besoin de* (potrzebuję), które mówi o tym, czego jeszcze brakuje.'
  fr.a1.unit02.lesson06.teach.line01:
    title: Zapytaj o liczbę jajek
    gloss: Inès pyta Mathieu, ile jajek potrzebuje do przepisu.
    note: 'Inès i Mathieu mówią sobie teraz na *tu*, a nie na *vous* jak w jednostce 1: jako koledzy z warsztatów szybko przeszli na nieformalny styl.'
  fr.a1.unit02.lesson06.teach.line02:
    title: Wymień składniki
    gloss: Mathieu mówi, że potrzebuje trzech jajek i dwóch szklanek mąki.
    note: '*J''ai besoin de* nazywa to, czego jeszcze potrzeba do przepisu.'
  fr.a1.unit02.lesson06.teach.line03:
    title: Powiedz, co masz
    gloss: Inès mówi, że ma na stole cztery jajka, i pyta, czy potrzebny jest też cukier.
    note: '*J''ai* mówi o tym, co Inès już ma, osobno od tego, czego potrzebuje Mathieu.'
  fr.a1.unit02.lesson06.teach.line04:
    title: Potwierdź małą ilość
    gloss: Mathieu mówi, że tak, trochę – około pół szklanki.
    note: '*Environ* znaczy tu „około” albo „mniej więcej” i łagodzi dokładność ilości.'
  fr.a1.unit02.lesson06.teach.line05:
    title: Zapytaj o numer telefonu
    gloss: Inès mówi „doskonale”, po czym prosi Mathieu o numer telefonu, żeby napisać do niego w sprawie następnych zajęć.
    note: '*Comme ça je t''écris* („żebym mogła do ciebie napisać”) wyjaśnia, po co pyta – to naturalny zwyczaj w rozmowie przed poproszeniem o dane kontaktowe.'
  fr.a1.unit02.lesson06.teach.line06:
    title: Podaj numer telefonu
    gloss: Mathieu podaje swój numer cyfra po cyfrze.
    note: '*C''est le* wprowadza numer i zgadza się z rzeczownikiem rodzaju męskiego *numéro*.'
  fr.a1.unit02.lesson06.teach.line07:
    title: Podziękuj i zapytaj o wiek
    gloss: 'Inès dziękuje, po czym zadaje jeszcze jedno pytanie: ile Mathieu ma lat.'
    note: '*Une dernière question* („ostatnie pytanie”) sygnalizuje naturalną zmianę tematu w tej samej rozmowie.'
  fr.a1.unit02.lesson06.teach.line08:
    title: Podaj jego wiek
    gloss: Mathieu mówi, że ma dwadzieścia osiem lat, i zadaje Inès to samo pytanie.
    note: '*J''ai vingt-huit ans* ma liczebnik złożony z łącznikiem, zgodnie ze wzorem z tej lekcji.'
  fr.a1.unit02.lesson06.teach.line09:
    title: Podaj jej wiek
    gloss: Inès mówi, że ma trzydzieści jeden lat.
    note: '*J''ai trente et un ans* ma *et* („i”) zamiast łącznika, bo trzydzieści jeden należy do form z jedynką poznanych w lekcji 3.'
