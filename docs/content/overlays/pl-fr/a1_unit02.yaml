  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francuski A1
  description: Liczby 0–100 (w tym formy soixante-dix/quatre-vingts/quatre-vingt-dix), wiek, numery telefonów i ilości w przepisach, w dalszym ciągu historii Inès i Mathieu na warsztatach kulinarnych z pierwszej lekcji. Kurs zwraca uwagę na wyrażanie wieku za pomocą czasownika avoir, pozostałości systemu dwudziestkowego w liczebnikach francuskich oraz zgodność rodzaju w wyrażeniach ilościowych.
