teaching:
  fr.a1.unit51.lesson01.teach.combien_ca_coute:
    title: Pytanie o łączną cenę
    gloss: Ile to kosztuje w sumie?
    note: '*En tout* (razem, w sumie) pokazuje, że pytasz o całkowitą cenę, a nie o cenę jednej rzeczy.'
  fr.a1.unit51.lesson01.teach.ca_coute_vingt:
    title: Podawanie łącznej ceny
    gloss: W sumie kosztuje to dwadzieścia pięć euro.
    note: '*Ça coûte* składa się z *ça* (to) i *coûte*, formy czasownika *coûter* (kosztować) używanej dla jednej rzeczy.'
  fr.a1.unit51.lesson02.teach.payer_par_carte:
    title: Płacenie kartą lub gotówką
    gloss: płacić kartą, płacić gotówką
    note: '*Payer par carte* to zwykły sposób powiedzenia, że płacisz kartą, a *payer en espèces* oznacza płacenie gotówką. Z *carte* używaj *par*, a z *espèces* używaj *en*.'
    example_gloss:
    - Czy mogę tu zapłacić kartą?
    - Płacę gotówką.
  fr.a1.unit51.lesson02.teach.je_peux_payer:
    title: Pytanie, czy można zapłacić kartą
    gloss: Czy mogę tu zapłacić kartą?
    note: '*Ici* (tutaj) umiejscawia pytanie przy kasie, przy której stoisz.'
  fr.a1.unit51.lesson02.teach.vous_voulez_payer:
    title: Pytanie o preferowaną formę płatności
    gloss: Woli Pan/Pani zapłacić gotówką czy kartą?
    note: '*Vous voulez ... ?* to formalny sposób pytania, używany przez kasjera, którego nie znasz; przyjaciele powiedzieliby *tu veux ... ?*.'
  fr.a1.unit51.lesson03.teach.l_addition:
    title: Rachunek
    gloss: rachunek
    note: '*Addition* jest rodzaju żeńskiego: *l''addition*. *La* skraca się do *l''* przed samogłoską.'
    example_gloss: Podzielimy rachunek?
  fr.a1.unit51.lesson03.teach.on_partage_l:
    title: Propozycja podzielenia rachunku
    gloss: Podzielimy rachunek?
    note: '*On ... ?* proponuje zrobienie czegoś razem, jak w *On partage ?*. *Partager* (dzielić) łączy się z *l''addition*.'
  fr.a1.unit51.lesson03.teach.je_peux_payer:
    title: Prośba o osobne płacenie
    gloss: Czy mogę zapłacić osobno?
    note: '*Séparément* (osobno) stoi zaraz po *payer*; to uprzejmy sposób, by poprosić o zapłacenie tylko za swoją część rachunku.'
  fr.a1.unit51.lesson04.teach.la_monnaie:
    title: Reszta
    gloss: reszta
    note: '*Monnaie* jest rodzaju żeńskiego: *la monnaie*. Oznacza monety i banknoty, które dostajesz z powrotem.'
    example_gloss: Oto Pana/Pani reszta.
  fr.a1.unit51.lesson04.teach.voici_votre_monnaie:
    title: Wydawanie reszty
    gloss: Oto Pana/Pani reszta.
    note: '*Votre* to formalne „twój/wasz” (Pana/Pani), pasujące do rejestru *vous* przy ladzie.'
  fr.a1.unit51.lesson04.teach.je_n_ai:
    title: Odmowa przyjęcia reszty
    gloss: Nie potrzebuję reszty.
    note: 'Po *avoir besoin de* (potrzebować) następuje rzeczownik: *Je n''ai pas besoin de monnaie.* Po *ne ... pas* zamiast *de la* stoi *de*.'
  fr.a1.unit51.lesson05.teach.trente_cinq:
    title: Trzydzieści pięć
    gloss: trzydzieści pięć
    note: '*Trente-cinq* pisze się z łącznikiem i najpierw podaje dziesiątki: trzydzieści + pięć.'
    example_gloss: To kosztuje trzydzieści pięć euro.
  fr.a1.unit51.lesson05.teach.addition_deux_plats:
    title: Czytamy rachunek z restauracji
    gloss: 'Rachunek: dwa dania główne i dwie kawy. Razem: trzydzieści pięć euro. Zapłacono kartą.'
    note: Zwróć uwagę, co zamówiono, jaka jest suma i jak zapłacono.
    glosses:
      Addition: rachunek
      deux: dwa
      plats: dania główne
      cafés: kawy
      Total: razem
      trente-cinq: trzydzieści pięć
      euros: euro
      Payé: zapłacono
      carte: karta
  fr.a1.unit51.lesson06.teach.camille_on_demande:
    title: Camille prosi o rachunek
    gloss: 'Camille: Poprosimy o rachunek?'
    note: Po *demander* (prosić o coś) *l'addition* występuje bezpośrednio, bez dodatkowego słowa.
  fr.a1.unit51.lesson06.teach.mathieu_oui_bonne:
    title: Mathieu pyta o całkowitą kwotę
    gloss: 'Mathieu: Tak, dobry pomysł. Ile to kosztuje w sumie?'
    note: Wraca pytanie *Combien ça coûte en tout ?* z lekcji 1.
  fr.a1.unit51.lesson06.teach.camille_ca_fait:
    title: Camille podaje sumę
    gloss: 'Camille: Wychodzi trzydzieści pięć euro. Dzielimy się?'
    note: '*Ça fait* + kwota podaje sumę, a *partager* odnosi się do rachunku.'
  fr.a1.unit51.lesson06.teach.mathieu_non_laisse:
    title: Mathieu nalega, że zapłaci
    gloss: 'Mathieu: Nie, pozwól mi dziś zapłacić. Tak bardzo mi pomogłaś.'
    note: '*Laisse-moi* + bezokolicznik to propozycja zrobienia czegoś, a *aidé* to imiesłów czasu przeszłego od *aider* (pomagać).'
  fr.a1.unit51.lesson06.teach.camille_c_est:
    title: Camille jest wzruszona
    gloss: 'Camille: Miło z twojej strony! Dziękuję.'
    note: '*C''est gentil de ta part* (to miło z twojej strony) to ciepły, częsty komplement za hojny gest.'
  fr.a1.unit51.lesson06.teach.mathieu_je_peux:
    title: Mathieu pyta o płatność kartą
    gloss: 'Mathieu: Mogę tu zapłacić kartą?'
    note: Wraca zdanie *Je peux payer par carte ici ?* z lekcji 2, tym razem w prawdziwej restauracji.
  fr.a1.unit51.lesson06.teach.mathieu_paie_l:
    title: 'Paie: forma dla „on/ona”'
    gloss: Mathieu płaci rachunek.
    note: '*Paie* to forma *il/elle* czasownika *payer* (płacić): *je paie, tu paies, il paie*.'
