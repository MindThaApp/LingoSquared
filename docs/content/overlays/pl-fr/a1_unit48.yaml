teaching:
  fr.a1.unit48.lesson01.teach.le_manteau_le:
    title: Płaszcz, sweter
    gloss: płaszcz, sweter
    note: '*Le manteau* i *le pull* są rodzaju męskiego.'
    example_gloss:
    - Szukam płaszcza.
    - Mam sweter.
  fr.a1.unit48.lesson01.teach.le_pantalon_les:
    title: Spodnie, buty
    gloss: spodnie, buty
    note: '*Pantalon* jest po francusku w liczbie pojedynczej, choć polskie „spodnie” mają tylko liczbę mnogą: *un pantalon* to jedna para spodni. *Chaussures* to liczba mnoga od *chaussure*; o butach mówi się zwykle w liczbie mnogiej, podobnie jak po polsku.'
    example_gloss:
    - Szukam spodni.
    - Szukam butów.
  fr.a1.unit48.lesson01.teach.je_cherche_un:
    title: Mówienie, czego szukasz
    gloss: Szukam płaszcza.
    note: '*Chercher* (szukać) łączy się bezpośrednio z dopełnieniem, bez przyimka: *je cherche un manteau*.'
  fr.a1.unit48.lesson02.teach.la_taille:
    title: Rozmiar
    gloss: rozmiar
    note: '*Taille* jest rodzaju żeńskiego: *la taille*.'
    example_gloss: Jaki rozmiar Pan/Pani nosi?
  fr.a1.unit48.lesson02.teach.quelle_taille_faites:
    title: Pytanie o rozmiar
    gloss: Jaki nosisz rozmiar?
    note: W pytaniu *Quelle taille ?* użyto *quelle* (jaka), bo *taille* jest rodzaju żeńskiego, a możliwych odpowiedzi jest niewiele (S, M, L lub liczba).
  fr.a1.unit48.lesson02.teach.je_fais_du:
    title: Podawanie swojego rozmiaru
    gloss: Mam rozmiar M.
    note: '*Faire du M* znaczy „mieć rozmiar M”: po francusku używa się czasownika *faire* (robić), a nie „być” czy „nosić”.'
  fr.a1.unit48.lesson03.teach.noir_bleu:
    title: Czarny, niebieski
    gloss: czarny, niebieski
    note: Dwa podstawowe przymiotniki oznaczające kolory w tej lekcji.
    example_gloss:
    - Chcę ten płaszcz w czarnym kolorze.
    - Czy ma Pan/Pani to też w niebieskim?
  fr.a1.unit48.lesson03.teach.je_veux_le:
    title: Prośba o kolor
    gloss: Chcę ten płaszcz w czarnym kolorze.
    note: '*En* + kolor to standardowy sposób określania koloru ubrania przy zamawianiu lub prośbie o nie.'
  fr.a1.unit48.lesson03.teach.avez_vous_aussi:
    title: Pytanie o inny kolor
    gloss: Czy ma Pan/Pani to też w niebieskim?
    note: '*Aussi* (też) służy do zapytania, czy dostępny jest inny kolor; pytanie jest w formie grzecznościowej z *vous*.'
  fr.a1.unit48.lesson04.teach.est_ce_que:
    title: Pytanie o dopasowanie
    gloss: Czy ten płaszcz ci pasuje?
    note: '*Aller* (iść) to naturalny czasownik używany do mówienia o tym, jak leży ubranie: *il me va bien*, dosłownie „dobrze na mnie idzie”.'
  fr.a1.unit48.lesson04.teach.il_me_va:
    title: Potwierdzenie, że ubranie pasuje
    gloss: Dobrze leży.
    note: '*Bien* (dobrze) opisuje, jak ubranie leży.'
  fr.a1.unit48.lesson04.teach.c_est_trop:
    title: Za małe
    gloss: Jest za małe.
    note: '*Trop* (za) stoi przed przymiotnikiem i wyraża nadmiar.'
  fr.a1.unit48.lesson04.teach.c_est_trop_2:
    title: Za duże
    gloss: Jest za duże.
    note: 'Ten sam schemat *trop* + przymiotnik co w poprzedniej karcie: *trop petit*.'
  fr.a1.unit48.lesson05.teach.quatre_vingt_dix:
    title: Dziewięćdziesiąt
    gloss: dziewięćdziesiąt
    note: '*Quatre-vingt-dix* to liczba 90 (dosłownie „cztery razy dwadzieścia i dziesięć”), użyta tutaj w cenie płaszcza.'
    example_gloss: Płaszcz kosztuje dziewięćdziesiąt euro.
  fr.a1.unit48.lesson05.teach.le_manteau_coute:
    title: Podawanie ceny
    gloss: Płaszcz kosztuje dziewięćdziesiąt euro.
    note: '*Coûte* to forma *il* czasownika *coûter* (kosztować).'
  fr.a1.unit48.lesson05.teach.parka_taille_m:
    title: Czytanie paragonu ze sklepu
    gloss: 'Płaszcz zimowy: rozmiar M, kolor czarny. Cena: dziewięćdziesiąt euro. Ten płaszcz dobrze leży i jest ciepły.'
    note: Zwróć uwagę na rozmiar, kolor, cenę i dwie cechy płaszcza.
    glosses:
      Parka: płaszcz zimowy
      taille: rozmiar
      couleur: kolor
      noire: czarny
      Prix: cena
      quatre-vingt-dix: dziewięćdziesiąt
      euros: euro
      manteau: płaszcz
      va: leży
      chaud: ciepły
  fr.a1.unit48.lesson06.teach.camille_ce_manteau:
    title: Camille zauważa płaszcz
    gloss: 'Camille: Ten płaszcz jest ładny! Jaki nosisz rozmiar?'
    note: '*Joli* (ładny) to ogólna pozytywna reakcja; tu występuje w rodzaju męskim, bo zgadza się z *manteau*.'
  fr.a1.unit48.lesson06.teach.mathieu_je_fais:
    title: Mathieu prosi o przymierzenie
    gloss: 'Mathieu: Mam rozmiar M. Mogę go przymierzyć?'
    note: '*Je peux ... ?* to standardowy sposób proszenia o pozwolenie; *l''essayer* znaczy „przymierzyć go”, a *l''* oznacza płaszcz.'
  fr.a1.unit48.lesson06.teach.camille_bien_sur:
    title: Camille pyta, jak leży
    gloss: 'Camille: Jasne. Dobrze na tobie leży?'
    note: '*Il* (on, ono) odnosi się do *le manteau*, rzeczownika rodzaju męskiego.'
  fr.a1.unit48.lesson06.teach.mathieu_oui_il:
    title: Mathieu potwierdza
    gloss: 'Mathieu: Tak, dobrze leży i jest ciepły.'
    note: Zgadza się dokładnie z paragonem przeczytanym wcześniej – to ten sam płaszcz.
  fr.a1.unit48.lesson06.teach.camille_super_tu:
    title: Camille pyta o kolor
    gloss: 'Camille: Super! Chcesz go w czarnym czy w niebieskim?'
    note: '*Tu le veux en ... ou en ... ?* proponuje wybór; *le* oznacza płaszcz.'
  fr.a1.unit48.lesson06.teach.mathieu_je_le:
    title: Mathieu decyduje
    gloss: 'Mathieu: Biorę go w czarnym.'
    note: '*Prendre* (brać) to naturalny czasownik na sfinalizowanie wyboru przy zakupie; kolor zgadza się z tym z paragonu.'
  fr.a1.unit48.lesson06.teach.on_ecrit_prends:
    title: Prends czy prend
    gloss: '*Prends* to forma „ja” i „ty” czasownika *prendre* (brać); *prend* to forma „on/ona”.'
    note: 'Wzór odmiany *prendre*: *je prends, tu prends, il/elle prend*.'
