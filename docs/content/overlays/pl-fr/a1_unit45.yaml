answer_policy:
  diacritics: 'Teach and display standard French accents and the cedilla. For free-typed A1 answers, accept otherwise-correct forms without diacritics, including ca for ça, tres for très, and enchante for enchanté. This leniency does not erase meaningful letters: masculine enchanté and feminine enchantée remain distinct through the final e even when accents are omitted.'
  apostrophes: Accept straight and typographic apostrophes interchangeably. Require the apostrophe when an exercise specifically tests elision, such as j’habite; do not accept jhabite in that exercise.
  hyphens: Teach the standard hyphens in inverted questions such as allez-vous and vas-tu. In free transcription exercises, accept an otherwise-correct spaced version at A1, but retain the hyphenated form as the model answer.
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of French spacing before question or exclamation marks. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
course:
  title: Francuski A1
  description: 'Francuski dla początkujących: podawanie zawodu, miejsca pracy i prostego rozkładu dnia pracy.'
units:
  fr.a1.unit45.travail:
    title: Praca i zawód
lessons:
  fr.a1.unit45.lesson01.tu_fais_quoi_dans:
    title: Czym się zajmujesz zawodowo?
  fr.a1.unit45.lesson02.ou_travailles_tu:
    title: Gdzie pracujesz?
  fr.a1.unit45.lesson03.ma_journee_de_travail:
    title: Mój dzień pracy
  fr.a1.unit45.lesson04.decrire_des_collegues:
    title: Opisywanie współpracowników
  fr.a1.unit45.lesson05.lire_des_profils_professionnels:
    title: Czytanie profili zawodowych
  fr.a1.unit45.lesson06.une_conversation_sur_le:
    title: Rozmowa o pracy
teaching:
  fr.a1.unit45.lesson01.teach.tu_fais_quoi:
    title: Pytanie o czyjś zawód
    gloss: Czym się Pan/Pani zajmuje zawodowo?
    note: Standardowy, potoczny sposób zapytania o czyjś zawód.
  fr.a1.unit45.lesson01.teach.le_metier_cuisinier:
    title: Zawód / kucharz
    gloss: zawód; kucharz
    note: '*Métier* (zawód) jest rodzaju męskiego: *le métier*. *Cuisinier* zmienia się w rodzaju żeńskim: *un cuisinier*, *une cuisinière*.'
    example_gloss:
    - Jaki jest twój zawód?
    - Pracuję jako kucharz.
  fr.a1.unit45.lesson01.teach.je_travaille_comme:
    title: Mówienie, że jesteś kucharzem
    gloss: Pracuję jako kucharz.
    note: '*Travailler comme* + zawód to standardowy wzorzec podawania zawodu; przed rzeczownikiem oznaczającym zawód nie ma rodzajnika.'
  fr.a1.unit45.lesson01.teach.infirmiere:
    title: Pielęgniarka
    gloss: pielęgniarka
    note: Nowoczesne określenie tego zawodu, używane niezależnie od płci.
    example_gloss: Pracuję jako pielęgniarka.
  fr.a1.unit45.lesson01.teach.je_travaille_comme_2:
    title: Mówienie, że jesteś pielęgniarką
    gloss: Pracuję jako pielęgniarka.
    note: 'Wzorzec jest ten sam co przy *cuisinier*: *travailler comme*; forma żeńska to *infirmière*.'
  fr.a1.unit45.lesson02.teach.ou_travailles_tu:
    title: Pytanie o miejsce pracy
    gloss: Gdzie pracujesz?
    note: Bezpośrednie pytanie uzupełniające po *Tu fais quoi dans la vie ?*
  fr.a1.unit45.lesson02.teach.je_travaille_dans:
    title: Praca w restauracji
    gloss: Pracuję w restauracji.
    note: '*Un restaurant* ma tu rodzajnik nieokreślony, bo chodzi o jedną z wielu restauracji.'
  fr.a1.unit45.lesson02.teach.l_hopital:
    title: Szpital
    gloss: szpital
    note: '*Hôpital* jest rodzaju męskiego i zaczyna się od samogłoski: *l''hôpital*.'
    example_gloss: Pracuję w szpitalu.
  fr.a1.unit45.lesson02.teach.je_travaille_a:
    title: Praca w szpitalu
    gloss: Pracuję w szpitalu.
    note: '*À l''hôpital* ma rodzajnik określony, bo chodzi o konkretne, znane miejsce; *le* zmienia się w *l''* przed samogłoską.'
  fr.a1.unit45.lesson02.teach.certaines_personnes_travaillent:
    title: Praca w biurze
    gloss: Niektórzy ludzie pracują w biurze.
    note: '*Dans un bureau* (w biurze) ma rodzajnik, tak jak *dans un restaurant*.'
  fr.a1.unit45.lesson03.teach.je_commence_a:
    title: Godzina rozpoczęcia
    gloss: Zaczynam o dziewiątej.
    note: '*Commence* to forma *je* czasownika *commencer* (zaczynać); *à neuf heures* podaje godzinę.'
  fr.a1.unit45.lesson03.teach.je_travaille_du:
    title: Dni pracy
    gloss: Pracuję od poniedziałku do piątku.
    note: '*Du lundi au vendredi* znaczy od poniedziałku do piątku; *du* to *de* + *le*, a *au* to *à* + *le*.'
  fr.a1.unit45.lesson03.teach.la_pause:
    title: Przerwa
    gloss: przerwa
    note: '*Pause* jest rodzaju żeńskiego: *la pause*.'
    example_gloss: Mam przerwę o dwunastej.
  fr.a1.unit45.lesson03.teach.j_ai_une:
    title: Mieć przerwę
    gloss: Mam przerwę o dwunastej.
    note: '*Avoir une pause* (mieć przerwę) to naturalne, stałe wyrażenie.'
  fr.a1.unit45.lesson03.teach.je_finis_a:
    title: Godzina zakończenia
    gloss: Kończę o piątej.
    note: '*Finis* to forma *je* czasownika *finir* (kończyć).'
  fr.a1.unit45.lesson03.teach.je_commence_a_2:
    title: Cały dzień pracy
    gloss: Zaczynam o dziewiątej i kończę o piątej.
    note: Łączy *je commence* i *je finis* za pomocą *et* w jedno zdanie opisujące cały dzień pracy.
  fr.a1.unit45.lesson04.teach.avec_il_ou:
    title: Końcówki czasowników z il i elle
    gloss: 'Z „on” lub „ona” regularne czasowniki na -er mają tę samą formę co z „ja”: je travaille, il travaille, elle travaille.'
    note: '*Travaille* jest takie samo dla *je*, *il* i *elle*: regularne czasowniki na *-er* nie dodają nic w trzeciej osobie.'
  fr.a1.unit45.lesson04.teach.camille_travaille_comme:
    title: Zawód Camille
    gloss: Camille pracuje jako pielęgniarka.
    note: '*Travaille* pasuje do *je*, *il* i *elle*: końcówka jest niema, więc wszystkie trzy formy brzmią tak samo.'
  fr.a1.unit45.lesson04.teach.mathieu_travaille_comme:
    title: Zawód Mathieu
    gloss: Mathieu pracuje jako kucharz.
    note: Taka sama końcówka jak w zdaniu *Camille travaille comme infirmière*.
  fr.a1.unit45.lesson04.teach.elle_travaille_a:
    title: Użycie zaimków
    gloss: Ona pracuje w szpitalu. On pracuje w restauracji.
    note: '*Elle* i *il* zastępują imiona Camille i Mathieu, ale forma czasownika się nie zmienia.'
  fr.a1.unit45.lesson05.teach.camille_travaille_comme:
    title: Przeczytaj dwa profile zawodowe
    gloss: Camille pracuje jako pielęgniarka w szpitalu. Zaczyna o siódmej i pracuje od poniedziałku do piątku. Mathieu pracuje jako kucharz w restauracji. Zaczyna o jedenastej i ma przerwę o czwartej.
    note: Śledź osobno zawód, miejsce pracy i godziny każdej osoby.
    glosses:
      travaille: pracuje
      infirmière: pielęgniarka
      l'hôpital: szpital
      commence: początek
      sept: siedem
      lundi: poniedziałek
      vendredi: piątek
      cuisinier: kucharz
      restaurant: restauracja
      onze: jedenaście
      pause: przerwa
  fr.a1.unit45.lesson06.teach.camille_salut_mathieu:
    title: Camille pyta o pracę
    gloss: 'Camille: Cześć, Mathieu! Jestem ciekawa, czym się właściwie zajmujesz zawodowo?'
    note: '*Au fait* (à propos) łagodzi pytanie i nadaje mu ton przyjaznej ciekawości, a nie przesłuchania.'
  fr.a1.unit45.lesson06.teach.mathieu_je_travaille:
    title: Mathieu odpowiada
    gloss: 'Mathieu: Pracuję jako kucharz w restauracji. A ty?'
    note: '*Et toi ?* to standardowy sposób, by zwrócić pytanie do rozmówcy.'
  fr.a1.unit45.lesson06.teach.camille_je_travaille:
    title: Camille odpowiada
    gloss: 'Camille: Pracuję jako pielęgniarka w szpitalu.'
    note: Zgadza się z zawodem i miejscem pracy Camille podanymi wcześniej.
  fr.a1.unit45.lesson06.teach.mathieu_tu_fais:
    title: Mathieu pyta o godziny pracy
    gloss: 'Mathieu: Jakie masz godziny pracy?'
    note: '*Tu fais quels horaires ?* to naturalny sposób zapytania o czyjś grafik pracy; *quels* zgadza się z liczbą mnogą *horaires*.'
  fr.a1.unit45.lesson06.teach.camille_je_commence:
    title: Camille podaje swoje godziny
    gloss: 'Camille: Zaczynam o siódmej i pracuję od poniedziałku do piątku.'
    note: Zgadza się z grafikiem Camille podanym wcześniej w tekście do czytania.
  fr.a1.unit45.lesson06.teach.mathieu_c_est:
    title: Reakcja Mathieu
    gloss: 'Mathieu: Wcześnie! Ja zaczynam później, o jedenastej.'
    note: Zgadza się z godziną rozpoczęcia pracy Mathieu podaną wcześniej.
  fr.a1.unit45.lesson06.teach.camille_chaque_metier:
    title: Camille kończy rozmowę
    gloss: 'Camille: Każdy zawód ma swój własny rytm, jak sądzę.'
    note: Naturalna, refleksyjna uwaga na zakończenie – wystarczy ją rozumieć, nie trzeba umieć powtórzyć jej dokładnie.
