teaching:
  fr.a1.unit46.lesson01.teach.l_appartement_le:
    title: Mieszkanie, salon, sypialnia
    gloss: mieszkanie, salon, sypialnia
    note: '*L''appartement* jest rodzaju męskiego i przed samogłoską zamiast *le* ma *l''*; *le salon* jest rodzaju męskiego, a *la chambre* żeńskiego.'
    example_gloss:
    - Mam mieszkanie.
    - Mam salon.
    - Mam sypialnię.
  fr.a1.unit46.lesson01.teach.la_cuisine_la:
    title: Kuchnia, łazienka
    gloss: kuchnia, łazienka
    note: '*La cuisine* i *la salle de bains* są obie rodzaju żeńskiego.'
    example_gloss:
    - Mam kuchnię.
    - Mam łazienkę.
  fr.a1.unit46.lesson01.teach.j_ai_un:
    title: Mówimy, że mamy mieszkanie
    gloss: Mam mieszkanie.
    note: '*Avoir* (mieć) to naturalny czasownik, gdy mówisz, jakie masz mieszkanie – podobnie jak po polsku „mam”. To przykład ogólny; mieszkanie samego Mathieu (w Lyonie) pojawi się dalej w tej jednostce.'
  fr.a1.unit46.lesson01.teach.j_ai_un_2:
    title: Wymieniamy wszystkie pomieszczenia
    gloss: Mam salon, sypialnię, kuchnię i łazienkę.
    note: Wszystkie cztery pomieszczenia ze słownictwa tej lekcji w jednym zdaniu, oddzielone przecinkami i połączone na końcu słowem *et*.
  fr.a1.unit46.lesson02.teach.tu_as_combien:
    title: Pytamy o liczbę pokoi
    gloss: Ile masz pokoi?
    note: 'Po *combien de* (ile) następuje rzeczownik w liczbie mnogiej: *combien de pièces*.'
  fr.a1.unit46.lesson02.teach.j_ai_deux:
    title: Podajemy liczbę sypialni
    gloss: Mam dwie sypialnie.
    note: '*Chambres* to liczba mnoga od *chambre*, utworzona regularnie przez dodanie niemego *-s*.'
  fr.a1.unit46.lesson02.teach.l_appartement_a:
    title: Podajemy łączną liczbę pokoi
    gloss: Mieszkanie ma trzy pokoje.
    note: '*Pièces* to ogólne słowo na pokoje, nie tylko sypialnie.'
  fr.a1.unit46.lesson03.teach.le_balcon_le:
    title: Balkon, ogród
    gloss: balkon, ogród
    note: '*Le balcon* i *le jardin* są rodzaju męskiego.'
    example_gloss:
    - Jest balkon.
    - Nie ma ogrodu.
  fr.a1.unit46.lesson03.teach.il_y_a:
    title: Mówimy, że coś jest
    gloss: Jest balkon.
    note: '*Il y a* to standardowa konstrukcja, którą mówimy, że coś istnieje lub się gdzieś znajduje – odpowiada polskiemu „jest”.'
  fr.a1.unit46.lesson03.teach.il_n_y:
    title: Mówimy, że czegoś nie ma
    gloss: Nie ma ogrodu.
    note: '*Pas de* służy do zaprzeczenia rzeczownika z rodzajnikiem nieokreślonym: *pas de jardin*, a nie *pas un jardin*.'
  fr.a1.unit46.lesson04.teach.cosy:
    title: Przytulny
    gloss: przytulny
    note: Bardzo częsty, typowo francuski przymiotnik opisujący ciepłą, miłą atmosferę.
    example_gloss: Mieszkanie jest małe, ale przytulne.
  fr.a1.unit46.lesson04.teach.l_appartement_est:
    title: Typowy sposób opisu
    gloss: Mieszkanie jest małe, ale przytulne.
    note: '*Petit mais cosy* to bardzo naturalny sposób, w jaki Francuzi pozytywnie opisują niewielkie mieszkanie.'
  fr.a1.unit46.lesson04.teach.le_salon_est:
    title: Opisujemy wielkość pokoju
    gloss: Salon jest duży.
    note: '*Grand* opisuje jedno konkretne pomieszczenie, a nie całe mieszkanie; zgadza się z *le salon*, które jest rodzaju męskiego.'
  fr.a1.unit46.lesson04.teach.la_cuisine_est:
    title: Opisujemy wielkość innego pokoju
    gloss: Kuchnia jest mała.
    note: 'Ten sam schemat co z *grand* na poprzedniej karcie, tylko z innym pomieszczeniem: *la cuisine* jest rodzaju żeńskiego, więc *petite*.'
  fr.a1.unit46.lesson05.teach.appartement_a_lyon:
    title: Czytamy ogłoszenie o mieszkaniu
    gloss: 'Mieszkanie w Lyonie: jedna sypialnia, salon, kuchnia i łazienka. Jest balkon, ale nie ma ogrodu. Mieszkanie jest małe, ale przytulne.'
    note: Zwróć uwagę na liczbę pomieszczeń, na to, co jest, a czego nie ma, oraz na ogólne wrażenie.
    glosses:
      Appartement: mieszkanie
      chambre: sypialnia
      salon: salon
      cuisine: kuchnia
      bains: łazienka
      balcon: balkon
      jardin: ogród
      petit: mały
      cosy: przytulny
  fr.a1.unit46.lesson06.teach.camille_salut_mathieu:
    title: Camille pyta o mieszkanie
    gloss: 'Camille: Cześć, Mathieu, jak twoje nowe mieszkanie w Lyonie?'
    note: '*Nouvel* to forma przymiotnika *nouveau* (nowy) używana przed rzeczownikiem rodzaju męskiego zaczynającym się od samogłoski: *un nouvel appartement*.'
  fr.a1.unit46.lesson06.teach.mathieu_il_est:
    title: Mathieu opisuje mieszkanie
    gloss: 'Mathieu: Jest małe, ale przytulne. Mam sypialnię, salon, kuchnię i łazienkę.'
    note: Zgadza się dokładnie z ogłoszeniem przeczytanym wcześniej w tej jednostce – to prawdziwe mieszkanie Mathieu.
  fr.a1.unit46.lesson06.teach.camille_tu_as:
    title: Camille pyta o balkon
    gloss: 'Camille: Masz balkon?'
    note: Bezpośrednie pytanie zamknięte z *Tu as ... ?*
  fr.a1.unit46.lesson06.teach.mathieu_oui_j:
    title: Mathieu odpowiada
    gloss: 'Mathieu: Tak, mam balkon, ale nie mam ogrodu.'
    note: 'Zgadza się z informacją z ogłoszenia: jest balkon, nie ma ogrodu.'
  fr.a1.unit46.lesson06.teach.balcon_est_masculin:
    title: Rodzaj słowa balcon
    gloss: '*Balcon* jest rodzaju męskiego: balkon, jest mały.'
    note: '*Il* (on, ono) zastępuje rzeczownik rodzaju męskiego, taki jak *balcon*, więc przymiotnik też jest w rodzaju męskim: *il est petit*.'
  fr.a1.unit46.lesson06.teach.camille_ca_a:
    title: Camille reaguje ciepło
    gloss: 'Camille: Brzmi sympatycznie! Wpadnę do ciebie wkrótce.'
    note: '*Je passerai te voir* (wpadnę do ciebie) składa się z czasu przyszłego *passerai* i *te voir*, czyli „zobaczyć cię”.'
  fr.a1.unit46.lesson06.teach.mathieu_super_tu:
    title: Mathieu wita ją serdecznie
    gloss: 'Mathieu: Super, zawsze jesteś mile widziana.'
    note: '*Toujours la bienvenue* (zawsze mile widziana) to ciepły sposób zaproszenia kogoś ponownie; *bienvenue* jest tu w rodzaju żeńskim, bo odnosi się do Camille.'
