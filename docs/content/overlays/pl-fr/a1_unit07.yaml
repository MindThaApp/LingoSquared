answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francuski A1
  description: Popularne miejsca w okolicy oraz pytanie o drogę i proste wskazywanie kierunków (en face de, à côté de, près de, loin de); dalszy ciąg poszukiwań apteki w pobliżu warsztatu, które prowadzi Mathieu. Wszystkie te wyrażenia kończą się na de, które przed rzeczownikiem rodzaju męskiego lub liczby mnogiej łączy się w du/des (du café, des arbres), zamiast stać bezpośrednio przed rzeczownikiem.
