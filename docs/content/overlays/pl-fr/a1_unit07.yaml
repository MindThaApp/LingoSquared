teaching:
  fr.a1.unit07.lesson01.teach.gare:
    title: Dworzec
    gloss: dworzec kolejowy
    note: '*Gare* jest rodzaju żeńskiego.'
    example_gloss: Dworzec jest duży.
  fr.a1.unit07.lesson01.teach.pharmacie:
    title: Apteka
    gloss: apteka
    note: '*Pharmacie* jest rodzaju żeńskiego.'
    example_gloss: Apteka otwiera się o dziewiątej.
  fr.a1.unit07.lesson01.teach.banque:
    title: Bank
    gloss: bank
    note: '*Banque* jest rodzaju żeńskiego.'
    example_gloss: Bank jest zamknięty w niedziele.
  fr.a1.unit07.lesson01.teach.ecole:
    title: Szkoła
    gloss: szkoła
    note: '*École* jest rodzaju żeńskiego; *l''* ulega elizji przed samogłoską.'
    example_gloss: Szkoła jest obok parku.
  fr.a1.unit07.lesson01.teach.cafe:
    title: Kawiarnia
    gloss: kawiarnia
    note: '*Café* jest rodzaju męskiego; w innych kontekstach oznacza też „kawę”.'
    example_gloss: Kawiarnia jest otwarta przez cały dzień.
  fr.a1.unit07.lesson01.teach.poste:
    title: Poczta
    gloss: poczta
    note: '*Poste* (rodzaj żeński) oznacza tu „pocztę”; *le poste* (rodzaj męski, inne znaczenie) może znaczyć „stanowisko, posadę” – rodzaj zmienia znaczenie.'
    example_gloss: Poczta zamyka się o szóstej.
  fr.a1.unit07.lesson01.teach.la_gare_est_grande:
    title: Porównanie dwóch miejsc
    gloss: Dworzec jest duży, a apteka jest mała.
    note: '*Grande* i *petite* są tu w rodzaju żeńskim, bo odnoszą się do rzeczowników żeńskich (*la gare*, *la pharmacie*).'
  fr.a1.unit07.lesson02.teach.ou_est_la_gare:
    title: Pytanie, gdzie jest jakieś miejsce
    gloss: Przepraszam, gdzie jest dworzec?
    note: '*Où est... ?* to standardowy, uniwersalny sposób zapytania o położenie miejsca.'
  fr.a1.unit07.lesson02.teach.en_face_de:
    title: Mówienie, że coś jest naprzeciwko
    gloss: Bank jest naprzeciwko dworca.
    note: '*En face de* („naprzeciwko”) kończy się na *de*, po którym następuje miejsce odniesienia: *en face de la banque*. Przed rzeczownikiem rodzaju męskiego tworzy formę zlaną: *en face du café*.'
  fr.a1.unit07.lesson02.teach.a_cote_de:
    title: Mówienie, że coś jest obok
    gloss: Apteka jest obok banku.
    note: '*À côté de* („obok”) łączy się z rzeczownikiem przez *de* tak samo jak *en face de*.'
  fr.a1.unit07.lesson02.teach.pres_de:
    title: Mówienie, że coś jest blisko
    gloss: Szkoła jest blisko stąd.
    note: '*Près de* („blisko”) przed samogłoską przechodzi w *près d''*, jak w *près d''ici* („blisko stąd”).'
  fr.a1.unit07.lesson02.teach.loin_de:
    title: Mówienie, że coś jest daleko
    gloss: Poczta jest daleko stąd.
    note: '*Loin de* („daleko od”) jest dokładnym przeciwieństwem *près de*.'
  fr.a1.unit07.lesson02.teach.cest_loin:
    title: Pytanie, czy coś jest daleko
    gloss: Czy to daleko stąd? – Nie, to nie jest daleko.
    note: '*C''est loin d''ici ?* to naturalne pytanie dodatkowe po usłyszeniu wskazówek. Aby zaprzeczyć, ujmij czasownik w *ne... pas*: *ce n''est pas loin* („to nie jest daleko”).'
  fr.a1.unit07.lesson03.teach.line01:
    title: Pytanie nieznajomego o drogę
    gloss: Mathieu grzecznie pyta przechodnia, gdzie jest apteka.
    note: '*Excusez-moi* („przepraszam”) to standardowy grzeczny początek rozmowy z nieznajomym, używany razem z *vous*.'
  fr.a1.unit07.lesson03.teach.line02:
    title: Podanie położenia
    gloss: Mówi, że jest naprzeciwko banku, obok kawiarni.
    note: Łączy *en face de* i *à côté de* w jednym zdaniu, by dokładnie określić miejsce. *De* + *le café* daje formę zlaną *du café*.
  fr.a1.unit07.lesson03.teach.line03:
    title: Zapytaj, czy to daleko
    gloss: Mathieu pyta, czy to daleko stąd.
    note: To samo *C'est loin d'ici ?*, którego nauczyłeś się, pytając o odległość.
  fr.a1.unit07.lesson03.teach.line04:
    title: Uspokojenie, że jest blisko
    gloss: Mówi, że nie, jest całkiem blisko – pięć minut pieszo.
    note: '*À pied* („pieszo”) to standardowy sposób określenia, że idzie się na piechotę.'
  fr.a1.unit07.lesson03.teach.line05:
    title: Podziękowanie
    gloss: Mathieu serdecznie jej dziękuje.
    note: '*Merci beaucoup* wzmacnia zwykłe *merci*, które znasz z wcześniejszych lekcji.'
  fr.a1.unit07.lesson03.teach.line06:
    title: Odpowiedź na podziękowanie
    gloss: 'Odpowiada: „proszę bardzo”.'
    note: '*Je vous en prie* to bardziej formalne „proszę bardzo”, pasujące do rejestru *vous* używanego wobec nieznajomego; *De rien* jest mniej formalną, codzienną alternatywą.'
