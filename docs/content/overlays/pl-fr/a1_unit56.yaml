  fr.a1.unit56.lesson04.teach.pour_les_transports:
    title: À vélo, en train
    gloss: Po francusku używa się *à* przy środkach transportu, na których jedziesz lub którymi idziesz (*à vélo*, *à pied*), oraz *en* przy tych, w których siedzisz w środku (*en train*, *en voiture*).
    note: Uczący się często tworzą błędne formy, jak *par vélo* czy *dans le train*. Traktuj *à vélo*, *à pied*, *en train* i *en voiture* jako stałe zwroty.
  fr.a1.unit56.lesson04.teach.mathieu_alors_je:
    title: Mathieu odpowiada
    gloss: 'Mathieu: Wtedy jadę pociągiem, razem z Camille.'
  fr.a1.unit56.lesson05.teach.camille_voyage_tous:
    title: Kto jak jeździ?
    gloss: Camille codziennie dojeżdża do pracy pociągiem. Mathieu zwykle jeździ rowerem, ale gdy pada deszcz, jedzie też pociągiem. Thomas woli jeździć samochodem. Léa mieszka całkiem blisko i chodzi do pracy pieszo. A ty, jak dojeżdżasz do pracy?
    note: Zestawia cztery różne sposoby dojazdu do pracy i jeden warunek (deszcz), podobnie jak tekst o porównaniu sportów w poprzedniej jednostce.
    glosses:
      voyage: dojeżdża
      tous: każdy
      jours: dzień
      train: pociąg
      travail: praca
      vélo: jeździ rowerem
      surtout: zwykle
      pleut: pada deszcz
      prend: bierze
      aller: jedzie
      préfère: woli
      voiture: samochód
      habite: mieszka
      près: w pobliżu
      marche: chodzi
      vas: dojeżdżasz
