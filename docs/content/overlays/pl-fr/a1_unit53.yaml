  fr.a1.unit53.lesson05.comparer_thomas_et_lea:
    title: Porównanie Thomasa i Léi
  fr.a1.unit53.lesson06.mathieu_reconnait_nina:
    title: Mathieu rozpoznaje Ninę
teaching:
  fr.a1.unit53.lesson01.teach.grand_petit:
    title: Wysoki i niski
    gloss: wysoki / niski
    note: '*Grand* opisuje osobę wysoką, a *petit* niską. Przymiotniki zgadzają się z osobą: *grand/grande*, *petit/petite*.'
    example_gloss:
    - Léa jest wysoka.
    - Thomas jest niski.
  fr.a1.unit53.lesson01.teach.vieux_jeune:
    title: Stary i młody
    gloss: stary / młody
    note: '*Vieux* i *jeune* wyrażają tu ogólne wrażenie wieku, a nie dokładną liczbę lat.'
    example_gloss:
    - Dziadek jest stary.
    - Mathieu jest młody.
  fr.a1.unit53.lesson01.teach.pour_un_age:
    title: 'Wiek: liczba czy wrażenie'
    gloss: Dokładny wiek podaje się po francusku z czasownikiem *avoir* (*Il a vingt ans*), a *être vieux* oddaje ogólne wrażenie (*Mon grand-père est vieux*).
    note: Dokładny wiek znasz już z pytania *Quel âge as-tu ?*. Tutaj *vieux* opisuje, jak ktoś WYGLĄDA, bez podawania liczby lat.
  fr.a1.unit53.lesson01.teach.lea_est_grande:
    title: Léa jest wysoka, a Thomas niski
    gloss: Léa jest wysoka, a Thomas jest niski.
    note: Proste zdanie złożone ze spójnikiem *et* (i, a), które przygotowuje bezpośrednie porównanie w lekcji 5.
  fr.a1.unit53.lesson02.teach.les_cheveux:
    title: Włosy
    gloss: włosy
    note: '*Les cheveux* to zawsze liczba mnoga rodzaju męskiego. W polskim też mówimy „włosy” w liczbie mnogiej.'
    example_gloss: Mathieu ma krótkie czarne włosy.
  fr.a1.unit53.lesson02.teach.blonds_bruns_gris:
    title: Blond, brązowy i szary
    gloss: blond / brązowy / szary
    note: 'Trzy kolory włosów. Przy *cheveux* kolor przyjmuje końcówkę liczby mnogiej *s*: *blonds*, *bruns*. *Gris* już kończy się na *s*, a *noirs* (czarne) znasz z jednostki o ubraniach.'
    example_gloss:
    - Camille ma blond włosy.
    - Thomas ma brązowe włosy.
    - Dziadek ma siwe włosy.
  fr.a1.unit53.lesson02.teach.longs_courts:
    title: Długie i krótkie (włosy)
    gloss: długi / krótki (o włosach)
    note: '*Longs* (długie) nawiązuje do wzrostu z lekcji 1, tu opisuje długość włosów. *Courts* (krótkie) jest nowe, a oba przyjmują *s* przy *cheveux*.'
    example_gloss:
    - Léa ma długie włosy.
    - Thomas ma krótkie włosy.
  fr.a1.unit53.lesson02.teach.cheveux_est_toujours:
    title: Cheveux i przymiotnik w liczbie mnogiej
    gloss: '*Cheveux* jest zawsze w liczbie mnogiej, więc przymiotnik przyjmuje *s*: *longs*, *courts*, *blonds*, *bruns*, *noirs*. *Gris* już kończy się na *s*.'
    note: 'Kolory i długości zgadzają się z *cheveux* w liczbie mnogiej: *les cheveux longs*. Porównaj z *yeux* w lekcji 3, gdzie *marron* się nie zmienia.'
  fr.a1.unit53.lesson02.teach.ses_est_le:
    title: 'Ses: jego lub jej'
    gloss: '*Ses* znaczy „jego” lub „jej” przed rzeczownikiem w liczbie mnogiej: *ses cheveux*, *ses yeux*. Zgadza się z rzeczą posiadaną, a nie z właścicielem.'
    note: 'Francuski nie rozróżnia tu „jego” i „jej”: *ses yeux* może znaczyć „jej oczy” lub „jego oczy”, a o znaczeniu decyduje kontekst.'
  fr.a1.unit53.lesson02.teach.mathieu_a_les:
    title: Mathieu ma krótkie czarne włosy
    gloss: Mathieu ma krótkie czarne włosy.
    note: Znowu *noirs* (czarne) z jednostki o ubraniach.
  fr.a1.unit53.lesson02.teach.camille_a_les:
    title: Camille ma długie blond włosy
    gloss: Camille ma długie blond włosy.
    note: Łączy słownictwo tej lekcji o długości i kolorze w jednym naturalnym zdaniu.
  fr.a1.unit53.lesson03.teach.les_yeux:
    title: Oczy
    gloss: oczy
    note: '*Les yeux* to liczba mnoga od *l''œil* (oko). *Yeux* kończy się na *x*, nie na *s*.'
    example_gloss: Mathieu ma brązowe oczy.
  fr.a1.unit53.lesson03.teach.bleus_marron_verts:
    title: Niebieski, brązowy i zielony
    gloss: niebieski / brązowy / zielony
    note: '*Bleus* (niebieskie) było już przy ubraniach; *marron* (brązowe) nigdy się nie zmienia; *verts* (zielone) jest nowe.'
    example_gloss:
    - Camille ma niebieskie oczy.
    - Thomas ma brązowe oczy.
    - Léa ma zielone oczy.
  fr.a1.unit53.lesson03.teach.avec_yeux_pluriel:
    title: Yeux z -s, marron bez zmian
    gloss: 'Przy *yeux* (liczba mnoga) przymiotnik przyjmuje *s*: *yeux bleus*, *yeux verts*. *Marron* nigdy się nie zmienia: *yeux marron*.'
    note: 'Porównaj z *cheveux* z lekcji 2: rzeczownik w liczbie mnogiej wymaga przymiotnika w liczbie mnogiej, z wyjątkiem kolorów takich jak *marron*, które pochodzą od rzeczownika.'
  fr.a1.unit53.lesson03.teach.comment_est_camille:
    title: Jak wygląda Camille?
    gloss: Jak wygląda Camille?
    note: '*Comment est ... ?* to główne pytanie tej jednostki; użyjesz go, by zapytać o wygląd każdej osoby.'
  fr.a1.unit53.lesson03.teach.camille_a_les:
    title: Camille ma długie blond włosy i niebieskie oczy
    gloss: Camille ma długie blond włosy i niebieskie oczy.
    note: Wzorcowa odpowiedź łącząca włosy i oczy w jednym zdaniu za pomocą *et*.
  fr.a1.unit53.lesson04.teach.camille_une_nouvelle:
    title: Camille przedstawia Ninę
    gloss: 'Camille: Do kawiarni językowej przychodzi nowa dziewczyna. Ma na imię Nina.'
    note: '*Une nouvelle fille vient* wprowadza nową osobę do sceny; *vient* pochodzi od *venir* (przychodzić).'
  fr.a1.unit53.lesson04.teach.mathieu_d_accord:
    title: Mathieu pyta, jak wygląda
    gloss: 'Mathieu: Dobrze! Jak ona wygląda?'
    note: 'Podstawowe pytanie z *elle* (ona) zamiast imienia: *Comment est-elle ?* Łącznik łączy czasownik z zaimkiem.'
  fr.a1.unit53.lesson04.teach.camille_elle_est:
    title: Camille opisuje wzrost i włosy Niny
    gloss: 'Camille: Jest niska i ma krótkie blond włosy.'
    note: Łączy *petite* z lekcji 1 ze słownictwem o włosach z lekcji 2; *petite* przyjmuje *e*, bo mowa o dziewczynie.
  fr.a1.unit53.lesson04.teach.mathieu_et_ses:
    title: Mathieu pyta o jej oczy
    gloss: 'Mathieu: A jej oczy?'
    note: '*Ses yeux* znaczy tu „jej oczy”: *ses* zgadza się z *yeux*, a nie z dziewczyną.'
  fr.a1.unit53.lesson04.teach.camille_elle_a:
    title: Camille opisuje oczy Niny
    gloss: 'Camille: Ma zielone oczy.'
    note: Znowu *yeux verts* z lekcji 3.
  fr.a1.unit53.lesson04.teach.mathieu_merci_alors:
    title: Mathieu ją rozpozna
    gloss: 'Mathieu: Dzięki! W takim razie ją rozpoznam.'
    note: '*Je vais la reconnaître* używa *aller* + bezokolicznik na oznaczenie bliskiej przyszłości, a *la* znaczy „ją”.'
  fr.a1.unit53.lesson05.teach.thomas_et_lea:
    title: Porównanie Thomasa i Léi
    gloss: Thomas i Léa to rodzeństwo, ale nie są do siebie podobni. Thomas jest niski, ma krótkie brązowe włosy i brązowe oczy. Léa jest wyższa od Thomasa, ma długie brązowe włosy i zielone oczy. A ty, jak wyglądasz?
    note: Krótkie porównanie, w którym wracają wszystkie poznane dotąd słowa określające kolor i długość. Tekst kończy się pytaniem kluczowym dla tej lekcji, skierowanym do czytelnika.
    glosses:
      frère: brat
      sœur: siostra
      ressemblent: wyglądać
      différents: różnie
      petit: niski
      courts: niski
      bruns: brązowy
      cheveux: włosy
      marron: brązowy
      yeux: oczy
      grande: wyższy
      longs: długi
      verts: zielony
      se: (część wyrażenia „se ressemblent” = są do siebie podobni)
  fr.a1.unit53.lesson05.teach.tu_connais_deja:
    title: Plus ... que przy osobach
    gloss: 'Znasz już wzór *plus* + przymiotnik + *que*. Tutaj używasz go do porównywania osób: Léa jest wyższa od Thomasa.'
    note: Ten sam wzór *plus ... que* co w jednostce o zakupach, teraz użyty dla osób, a nie przedmiotów. *Grande* zgadza się z *Léa*, bo to kobieta.
  fr.a1.unit53.lesson05.teach.lea_a_les:
    title: Léa ma dłuższe włosy niż Thomas
    gloss: Léa ma dłuższe włosy niż Thomas.
    note: '*Plus longs que* zgadza się z *cheveux* (liczba mnoga): *les cheveux plus longs que Thomas*.'
  fr.a1.unit53.lesson05.teach.j_ai_les:
    title: Mam krótkie brązowe włosy
    gloss: Mam krótkie brązowe włosy.
    note: Wzorcowe zdanie w pierwszej osobie z *J'ai ...*, gotowe do użycia przy opisie własnego wyglądu.
  fr.a1.unit53.lesson06.teach.mathieu_regarde_c:
    title: Mathieu dostrzega Ninę
    gloss: 'Mathieu: Patrz, czy to Nina? Ma krótkie blond włosy i zielone oczy.'
    note: '*Regarde* (patrz) to forma rozkazująca od *regarder* dla *tu*, użyta tak samo w jednym z wcześniejszych dialogów.'
  fr.a1.unit53.lesson06.teach.camille_oui_c:
    title: Camille potwierdza
    gloss: 'Camille: Tak, to Nina!'
    note: Krótkie, naturalne potwierdzenie.
  fr.a1.unit53.lesson06.teach.nina_salut_tu:
    title: Nina wita Mathieu
    gloss: 'Nina: Cześć, jesteś Mathieu?'
    note: 'Proste nieformalne pytanie na powitanie: *Tu es ... ?*'
  fr.a1.unit53.lesson06.teach.mathieu_oui_ravi:
    title: Mathieu wita Ninę
    gloss: 'Mathieu: Tak! Miło cię poznać, Nina.'
    note: '*Ravi de te rencontrer* to zwykła formuła przy pierwszym spotkaniu (*ravi* mówi mężczyzna, *ravie* kobieta), a nie *content de te revoir*, które mówi się komuś, kogo już znamy.'
  fr.a1.unit53.lesson06.teach.nina_ravie_de:
    title: Nina odpowiada na powitanie
    gloss: 'Nina: Mnie również miło!'
    note: 'Kończy dialog: Mathieu rozpoznał Ninę dzięki wcześniejszemu opisowi Camille.'
