teaching:
  fr.a1.unit12.lesson01.teach.jai_prepare:
    title: Przygotowałem
    gloss: przygotowałem / zrobiłem
    note: 'Regularne czasowniki na -ER tworzą imiesłów w passé composé z końcówką *-é*: *préparer* → *préparé*, z czasownikiem *avoir*.'
    example_gloss: Zrobiłem ciasto na warsztaty.
  fr.a1.unit12.lesson01.teach.jai_achete:
    title: Kupiłem
    gloss: kupiłem
    note: '*Acheter* tworzy czas tak samo jak *préparer*: *avoir* + *-é*.'
    example_gloss: Kupiłem warzywa na targu.
  fr.a1.unit12.lesson01.teach.jai_oublie:
    title: Zapomniałem
    gloss: zapomniałem
    note: '*Oublier* → *oublié*, znów ten sam regularny wzór.'
    example_gloss: Zapomniałem masła w domu!
  fr.a1.unit12.lesson01.teach.tu_as_aime:
    title: Podobało ci się
    gloss: podobało ci się
    note: '*Tu as* + imiesłów to forma z *tu* tej samej konstrukcji z *avoir*.'
    example_gloss: Smakowało ci ciasto?
  fr.a1.unit12.lesson01.teach.il_a_goute:
    title: Spróbował
    gloss: on spróbował
    note: '*Il a* + imiesłów to forma z *il*: czasownik *avoir* zmienia się zależnie od podmiotu, a imiesłów pozostaje taki sam.'
    example_gloss: Mathieu spróbował sosu.
  fr.a1.unit12.lesson01.teach.grammar_avoir_participe:
    title: Avoir + imiesłów bierny
    gloss: avoir + imiesłów (-é)
    note: Większość czasowników francuskich tworzy passé composé z czasownikiem posiłkowym *avoir* i imiesłowem, który u regularnych czasowników na -ER kończy się na *-é*.
  fr.a1.unit12.lesson01.teach.la_semaine_derniere:
    title: W zeszłym tygodniu
    gloss: w zeszłym tygodniu
    note: '*Dernière* („zeszła”) zgadza się z rodzaju żeńskim słowem *semaine*; forma męska to *dernier*, np. *samedi dernier* („w zeszłą sobotę”).'
    example_gloss: W zeszłym tygodniu zrobiłem ciasto.
  fr.a1.unit12.lesson02.teach.je_suis_arrive:
    title: Przyjechałem
    gloss: przyjechałem / przybyłem
    note: '*Arriver* należy do niewielkiej grupy czasowników (głównie ruchu), które jako czasownika posiłkowego używają *être*, a nie *avoir*.'
    example_gloss: Przyjechałem spóźniony na warsztaty.
  fr.a1.unit12.lesson02.teach.je_suis_alle:
    title: Poszedłem
    gloss: poszedłem
    note: '*Aller* również łączy się z *être*. Imiesłów zgadza się z podmiotem: *allé* (rodzaj męski) lub *allée* (żeński, tak powiedziałaby Inès).'
    example_gloss: Poszłam na targ przed warsztatami.
  fr.a1.unit12.lesson02.teach.il_est_reste:
    title: Został
    gloss: on został
    note: '*Rester* („zostać”) to kolejny czasownik z *être*, z tą samą zasadą zgodności.'
    example_gloss: Mathieu został, żeby posprzątać kuchnię.
  fr.a1.unit12.lesson02.teach.grammar_etre_accord:
    title: Être + zgodność imiesłowu
    gloss: être + imiesłów (zgadza się z podmiotem)
    note: W czasownikach z *être* imiesłów zgadza się z podmiotem w rodzaju i liczbie, inaczej niż w czasownikach z *avoir*.
  fr.a1.unit12.lesson02.teach.en_retard:
    title: Spóźniony
    gloss: spóźniony / z opóźnieniem
    note: '*En retard* oznacza przybycie po umówionym czasie – to częste towarzystwo dla *arriver*.'
    example_gloss: Autobus przyjechał z opóźnieniem.
  fr.a1.unit12.lesson02.teach.finalement:
    title: W końcu / ostatecznie
    gloss: w końcu / ostatecznie
    note: '*Finalement* zamyka krótką opowieść i wskazuje końcowy rezultat po wcześniejszych komplikacjach.'
    example_gloss: W końcu ciasto było pyszne.
  fr.a1.unit12.lesson02.teach.quest_ce_qui_sest_passe:
    title: Co się stało?
    gloss: Co się stało?
    note: '*Qu''est-ce qui s''est passé ?* to standardowy sposób zapytania, co się stało.'
    example_gloss: Co się stało na warsztatach?
  fr.a1.unit12.lesson03.teach.line01:
    title: Zapytaj, co się stało
    gloss: Inès pyta, co się działo na warsztatach w zeszłą sobotę – ona nie mogła przyjść.
    note: '*Qu''est-ce qui s''est passé ?* („co się stało?”) to standardowy sposób pytania o przeszłe wydarzenie.'
  fr.a1.unit12.lesson03.teach.line02:
    title: Opowiedz o wpadce
    gloss: 'Mathieu mówi: o rety, przyjechał spóźniony i zapomniał masła w domu!'
    note: 'Dwie formy passé composé w jednym zdaniu: z *être* (*je suis arrivé*) i z *avoir* (*j''ai oublié*).'
  fr.a1.unit12.lesson03.teach.line03:
    title: Zapytaj, co zrobił
    gloss: Inès pyta, co zrobił potem.
    note: '*Qu''est-ce que tu as fait ?* („co zrobiłeś?”) używa nieregularnego imiesłowu czasownika *faire* w passé composé.'
  fr.a1.unit12.lesson03.teach.line04:
    title: Opisz rozwiązanie
    gloss: Mathieu mówi, że szybko poszedł do sklepiku na rogu.
    note: '*L''épicerie du coin* („sklepik na rogu”) używa słowa *coin* jak w *au coin de la rue* („na rogu ulicy”).'
  fr.a1.unit12.lesson03.teach.line05:
    title: Zapytaj, czy się udało
    gloss: Inès pyta, czy znalazł tam masło.
    note: '*Tu as trouvé... ?* („znalazłeś...?”) to kolejne regularne pytanie z czasownikiem *avoir*.'
  fr.a1.unit12.lesson03.teach.line06:
    title: Podaj szczęśliwe zakończenie
    gloss: Mathieu mówi, że tak, i że w końcu ciasto było pyszne!
    note: Kończy historię pozytywnie za pomocą *finalement*, rozwiązując wcześniejszą wpadkę.
