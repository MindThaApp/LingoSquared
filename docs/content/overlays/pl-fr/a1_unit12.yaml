answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francuski A1
  description: 'Krótkie opowiedzenie o niedawnym, zakończonym wydarzeniu w czasie passé composé, z oboma czasownikami posiłkowymi, avoir i être. Kontynuujemy historię Inès i Mathieu z warsztatów kulinarnych: Mathieu opowiada o wpadce podczas sobotnich zajęć. Warto pamiętać, że po francusku używa się dwóch czasowników posiłkowych (avoir przy większości czasowników, être przy niewielkiej grupie, m.in. aller, arriver, rester), oraz że imiesłowy z être zgadzają się z podmiotem w rodzaju (arrivé/arrivée), podobnie jak w polszczyźnie czasownik w czasie przeszłym zmienia końcówkę zależnie od rodzaju (przyjechał/przyjechała).'
units:
  fr.a1.unit12.past_events:
    title: Co się stało?
