teaching:
  fr.a1.unit51.lesson01.teach.combien_ca_coute:
    title: Naar de totaalprijs vragen
    gloss: Hoeveel kost het in totaal?
    note: '*En tout* (in totaal) maakt duidelijk dat je de volledige prijs van alles bij elkaar wilt weten, niet de prijs van één artikel.'
  fr.a1.unit51.lesson01.teach.ca_coute_vingt:
    title: Een totaalprijs noemen
    gloss: Het kost in totaal vijfentwintig euro.
    note: '*Ça coûte* gebruikt *ça* (het) met *coûte*, de vorm van *coûter* (kosten) voor één enkele zaak.'
  fr.a1.unit51.lesson02.teach.payer_par_carte:
    title: Met pinpas of contant betalen
    gloss: met pinpas betalen, contant betalen
    note: '*Payer par carte* is de gebruikelijke manier om te zeggen dat je met de pinpas betaalt, en *payer en espèces* betekent contant betalen. Gebruik *par* met *carte* en *en* met *espèces*.'
    example_gloss:
    - Kan ik hier met pinpas betalen?
    - Ik betaal contant.
  fr.a1.unit51.lesson02.teach.je_peux_payer:
    title: Vragen of pinbetaling mogelijk is
    gloss: Kan ik hier met pinpas betalen?
    note: '*Ici* (hier) plaatst de vraag bij de balie waar je staat.'
  fr.a1.unit51.lesson02.teach.vous_voulez_payer:
    title: Vragen naar de betaalvoorkeur
    gloss: Wilt u contant of met pinpas betalen?
    note: '*Vous voulez ... ?* is de formele manier om te vragen, gebruikt door een kassamedewerker die je niet kent; vrienden zeggen *tu veux ... ?*.'
  fr.a1.unit51.lesson03.teach.l_addition:
    title: De rekening
    gloss: de rekening
    note: '*Addition* is vrouwelijk: *l''addition*. *La* wordt *l''* voor een klinker.'
    example_gloss: Zullen we de rekening delen?
  fr.a1.unit51.lesson03.teach.on_partage_l:
    title: Voorstellen de rekening te delen
    gloss: Zullen we de rekening delen?
    note: '*On ... ?* stelt voor om iets samen te doen, zoals in *On partage ?*. *Partager* (delen) past bij *l''addition*.'
  fr.a1.unit51.lesson03.teach.je_peux_payer:
    title: Vragen om apart te betalen
    gloss: Mag ik apart betalen?
    note: '*Séparément* (apart) staat meteen na *payer*; het is de beleefde manier om te vragen of je je eigen deel van de rekening mag betalen.'
  fr.a1.unit51.lesson04.teach.la_monnaie:
    title: Het wisselgeld
    gloss: het wisselgeld
    note: '*Monnaie* is vrouwelijk: *la monnaie*. Het betekent het wisselgeld, de munten en biljetten die je terugkrijgt.'
    example_gloss: Hier is uw wisselgeld.
  fr.a1.unit51.lesson04.teach.voici_votre_monnaie:
    title: Wisselgeld teruggeven
    gloss: Hier is uw wisselgeld.
    note: '*Votre* is het formele ''uw'', passend bij het *vous*-register aan een balie.'
  fr.a1.unit51.lesson04.teach.je_n_ai:
    title: Wisselgeld weigeren
    gloss: Ik heb geen wisselgeld nodig.
    note: '*Avoir besoin de* (nodig hebben) wordt gevolgd door een zelfstandig naamwoord: *Je n''ai pas besoin de monnaie.* Na *ne ... pas* komt *de* in de plaats van *de la*.'
  fr.a1.unit51.lesson05.teach.trente_cinq:
    title: Vijfendertig
    gloss: vijfendertig
    note: '*Trente-cinq* wordt met een streepje geschreven en zet de tientallen eerst: dertig + vijf.'
    example_gloss: Het kost vijfendertig euro.
  fr.a1.unit51.lesson05.teach.addition_deux_plats:
    title: Een restaurantrekening lezen
    gloss: 'Rekening: twee hoofdgerechten en twee koffies. Totaal: vijfendertig euro. Betaald met pinpas.'
    note: Let op wat er besteld is, wat het totaal is en hoe er is betaald.
    glosses:
      Addition: rekening
      deux: twee
      plats: hoofdgerechten
      cafés: koffies
      Total: totaal
      trente-cinq: vijfendertig
      euros: euro
      Payé: betaald
      carte: pinpas
  fr.a1.unit51.lesson06.teach.camille_on_demande:
    title: Camille vraagt om de rekening
    gloss: 'Camille: Zullen we om de rekening vragen?'
    note: '*Demander* (vragen om) krijgt *l''addition* als direct object, zonder extra woord.'
  fr.a1.unit51.lesson06.teach.mathieu_oui_bonne:
    title: Mathieu vraagt naar het totaal
    gloss: 'Mathieu: Ja, goed idee. Hoeveel kost het in totaal?'
    note: Hier komt de vraag *Combien ça coûte en tout ?* uit les 1 terug.
  fr.a1.unit51.lesson06.teach.camille_ca_fait:
    title: Camille noemt het totaal
    gloss: 'Camille: Dat is vijfendertig euro. Zullen we het delen?'
    note: '*Ça fait* + een bedrag noemt het totaal, en *partager* verwijst terug naar de rekening.'
  fr.a1.unit51.lesson06.teach.mathieu_non_laisse:
    title: Mathieu staat erop te betalen
    gloss: 'Mathieu: Nee, laat mij vandaag betalen. Je hebt me zo goed geholpen.'
    note: '*Laisse-moi* + infinitief biedt aan om iets te doen, en *aidé* is het voltooid deelwoord van *aider* (helpen).'
  fr.a1.unit51.lesson06.teach.camille_c_est:
    title: Camille is ontroerd
    gloss: 'Camille: Wat lief van je! Dank je wel.'
    note: '*C''est gentil de ta part* (wat aardig van je) is een warm, veelgebruikt compliment voor een royaal gebaar.'
  fr.a1.unit51.lesson06.teach.mathieu_je_peux:
    title: Mathieu vraagt of hij met de kaart kan betalen
    gloss: 'Mathieu: Kan ik hier met de kaart betalen?'
    note: Hier komt *Je peux payer par carte ici ?* uit les 2 terug, nu in het echte restaurant.
  fr.a1.unit51.lesson06.teach.mathieu_paie_l:
    title: 'Paie: de vorm voor hij/zij'
    gloss: Mathieu betaalt de rekening.
    note: '*Paie* is de *il/elle*-vorm van *payer* (betalen): *je paie, tu paies, il paie*.'
