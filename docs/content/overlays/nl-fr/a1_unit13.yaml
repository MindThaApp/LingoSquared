course:
  title: Frans A1
  description: 'Voorkeuren en afkeer uitdrukken en ernaar vragen, als vervolg op het verhaal van Inès en Mathieu bij de kookworkshop, terwijl ze kiezen tussen twee recepten voor zaterdag. Let op: na *préférer X à Y* (de voorkeur geven aan X boven Y) volgt *à*, niet *que*.'
units:
  fr.a1.unit13.preferences:
    title: Wat heb je liever?
