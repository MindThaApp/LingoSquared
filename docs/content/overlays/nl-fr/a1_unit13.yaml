  fr.a1.unit13.lesson01.vocabulaire_preferences:
    title: Houden van, verkiezen, haten
  fr.a1.unit13.lesson02.demander_les_preferences:
    title: Vragen naar voorkeuren
  fr.a1.unit13.lesson03.dialogue_choisir_la_recette:
    title: Het recept voor zaterdag kiezen
teaching:
  fr.a1.unit13.lesson01.teach.preferer:
    title: Verkiezen
    gloss: verkiezen
    note: '*Préférer* is een -ER-werkwoord met een wisselende stam: *je préfère*, maar *nous préférons* (geen accentwisseling in de vormen met *nous/vous*).'
    example_gloss: Ik heb liever de chocoladetaart.
  fr.a1.unit13.lesson01.teach.aimer_mieux:
    title: Liever willen
    gloss: liever willen
    note: '*Aimer mieux* is een veelgebruikt alternatief voor *préférer*, maar het vergelijkt met *que* (*aimer mieux X que Y*), terwijl *préférer* *à* gebruikt (*préférer X à Y*).'
    example_gloss: Ik heb liever hartige gerechten dan zoete gerechten.
  fr.a1.unit13.lesson01.teach.detester:
    title: Haten
    gloss: haten
    note: '*Détester* is een sterke afkeer, sterker dan *ne pas aimer* (niet houden van).'
    example_gloss: Mathieu haat te sterke kruiden; hij heeft liever milde gerechten.
  fr.a1.unit13.lesson01.teach.plutot:
    title: Eerder
    gloss: eerder
    note: '*Plutôt* verzacht een voorkeur: liever dit, zonder het alternatief helemaal uit te sluiten.'
    example_gloss: Ik neem liever kaas.
  fr.a1.unit13.lesson01.teach.sucre:
    title: Zoet
    gloss: zoet
    note: '*Sucré* beschrijft eten en is iets anders dan *doux* (zacht/mild); die twee worden vaak door elkaar gehaald.'
    example_gloss: Dit dessert is erg zoet.
  fr.a1.unit13.lesson01.teach.sale:
    title: Hartig / zout
    gloss: hartig / zout
    note: '*Salé* is in de Franse eetwoordenschat het gewone tegenovergestelde van *sucré* en dekt zowel "hartig" als "zout".'
    example_gloss: De kaas is zout.
  fr.a1.unit13.lesson01.teach.la_recette:
    title: Het recept
    gloss: het recept
    note: '*La recette* is altijd vrouwelijk.'
    example_gloss: Dit recept is makkelijk.
  fr.a1.unit13.lesson02.teach.quest_ce_que_tu_preferes:
    title: Naar een voorkeur vragen
    gloss: Wat heb je liever?
    note: '*Qu''est-ce que...* is in gesproken Frans de gewone manier om een open vraag met "wat" te stellen.'
  fr.a1.unit13.lesson02.teach.je_prefere_x_a_y:
    title: Een voorkeur tussen twee dingen uitspreken
    gloss: Ik heb liever de taart dan de quiche.
    note: Bij *préférer X à Y* staat *à* voor de optie die minder de voorkeur heeft, niet *que*. In het Nederlands zeg je "liever X dan Y", maar in het Frans gebruik je hier à.
  fr.a1.unit13.lesson02.teach.tu_aimes_plutot:
    title: Vragen naar een algemene neiging
    gloss: Hou je meer van zoet of van hartig?
    note: Combineert *plutôt* (les 1) met een keuzevraag met *ou* (of).
  fr.a1.unit13.lesson02.teach.moi_aussi_moi_non:
    title: Het eens of oneens zijn
    gloss: Ik ook. / Ik niet.
    note: '*Moi aussi* stemt in met een bevestigende uitspraak; *moi non* is het oneens of geeft de tegenovergestelde voorkeur aan.'
  fr.a1.unit13.lesson02.teach.ca_ne_me_derange_pas:
    title: Zeggen dat het je niet uitmaakt
    gloss: Het maakt me niet uit.
    note: '*Ça ne me dérange pas* is een handige, neutrale manier om beide opties te accepteren als je moet kiezen.'
  fr.a1.unit13.lesson02.teach.on_pourrait_faire:
    title: Een optie voorstellen
    gloss: We zouden een quiche kunnen maken, toch?
    note: '*On pourrait* (we zouden kunnen) + infinitief stelt voorzichtig een optie voor, waarbij *non ?* om instemming vraagt.'
  fr.a1.unit13.lesson03.teach.line01:
    title: Vragen wat je gaat maken
    gloss: 'Mathieu vraagt wat ze zaterdag maken: een taart of een quiche?'
    note: '*Qu''est-ce qu''on prépare... ?* (wat maken we) gebruikt *on* voor "we", zoals gebruikelijk in spreektaal.'
  fr.a1.unit13.lesson03.teach.line02:
    title: Een voorkeur noemen en terugvragen
    gloss: Inès zegt dat ze liever de taart heeft, eerder zoet, en vraagt het aan Mathieu.
    note: '*Et toi ?* (en jij?) is de eenvoudigste manier om een uitspraak om te zetten in een vraag aan de ander.'
  fr.a1.unit13.lesson03.teach.line03:
    title: De tegenovergestelde voorkeur noemen
    gloss: Mathieu zegt dat hij liever hartig eet en dat hij de quiche boven de taart verkiest.
    note: Gebruikt direct het patroon *préférer X à Y* uit les 2 opnieuw.
  fr.a1.unit13.lesson03.teach.line04:
    title: Een compromis voorstellen
    gloss: Inès stelt voor om allebei te maken, toch?
    note: '*Les deux* (allebei) lost het meningsverschil op door voor te stellen beide recepten te maken.'
  fr.a1.unit13.lesson03.teach.line05:
    title: Het compromis accepteren
    gloss: Mathieu zegt dat het een goed idee is en dat het hem helemaal niet uitmaakt.
    note: '*Ça ne me dérange pas du tout* versterkt de zin uit les 2 met *du tout* (helemaal niet).'
  fr.a1.unit13.lesson03.teach.line06:
    title: De beslissing bevestigen
    gloss: 'Inès zegt: perfect, een zoete taart en een hartige quiche voor zaterdag.'
    note: Herhaalt de uiteindelijke beslissing duidelijk en sluit het gesprek af.
