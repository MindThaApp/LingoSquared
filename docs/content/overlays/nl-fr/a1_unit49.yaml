teaching:
  fr.a1.unit49.lesson01.teach.content_triste_en:
    title: Blij, verdrietig en boos
    gloss: blij, verdrietig, boos
    note: Drie basiswoorden voor gevoelens met *être* (zijn); *content* heeft als vrouwelijke vorm *contente*, terwijl *triste* en *en colère* niet veranderen.
    example_gloss:
    - Ik ben blij.
    - Ik ben verdrietig.
    - Ik ben boos.
  fr.a1.unit49.lesson01.teach.je_suis_content:
    title: Zeggen dat je blij bent
    gloss: Ik ben blij.
    note: '*Être* (zijn) + bijvoeglijk naamwoord van gevoel is het basispatroon, net als in het Nederlands: ''Ik ben ...''.'
  fr.a1.unit49.lesson01.teach.je_ne_suis:
    title: Gevoelens tegenover elkaar zetten
    gloss: Ik ben niet boos, ik ben verdrietig.
    note: '*Ne ... pas* staat om het werkwoord heen; de tweede zin zegt dan wat je echt voelt.'
  fr.a1.unit49.lesson02.teach.pourquoi_es_tu:
    title: Vragen waarom
    gloss: Waarom ben je blij?
    note: '*Pourquoi* (waarom) is het standaard vraagwoord voor een reden.'
  fr.a1.unit49.lesson02.teach.je_suis_content:
    title: Een reden geven
    gloss: Ik ben blij omdat ik een nieuw appartement heb.
    note: '*Parce que* (omdat) leidt de zin met de reden in; voor *il* wordt het *parce qu''*.'
  fr.a1.unit49.lesson02.teach.je_suis_triste:
    title: Een negatieve reden
    gloss: Ik ben verdrietig omdat het regent.
    note: Hier komt *il pleut* (het regent) uit de weereenheid terug als reden.
  fr.a1.unit49.lesson03.teach.nerveux:
    title: Nerveus
    gloss: nerveus
    note: Het standaardwoord voor zenuwachtigheid.
    example_gloss: Ik ben zenuwachtig voor mijn eerste dienst.
  fr.a1.unit49.lesson03.teach.je_suis_nerveux:
    title: Zeggen waarvoor je zenuwachtig bent
    gloss: Ik ben zenuwachtig voor mijn eerste dienst.
    note: '*Avant* (letterlijk ''voor'', in de tijd) geeft aan waarvoor je zenuwachtig bent; het Nederlands zegt hier ''voor'', maar het Frans gebruikt avant en niet pour.'
  fr.a1.unit49.lesson03.teach.ne_t_inquiete:
    title: Iemand geruststellen
    gloss: Maak je geen zorgen.
    note: '*Ne t''inquiète pas* (letterlijk ''maak jezelf geen zorgen'') is de vaste geruststellende uitdrukking; *s''inquiéter* is wederkerend.'
  fr.a1.unit49.lesson04.teach.comment_se_sent:
    title: Vragen hoe iemand zich voelt
    gloss: Hoe voelt Mathieu zich?
    note: '*Se sentir* (zich voelen, wederkerend) is de standaardmanier om naar een gemoedstoestand te vragen of die te beschrijven; het komt ook voor in de eenheid over gezondheid.'
  fr.a1.unit49.lesson04.teach.il_se_sent:
    title: Beschrijven hoe iemand zich voelt
    gloss: Hij voelt zich zenuwachtig.
    note: '*Se* (zich) is het wederkerend voornaamwoord van de derde persoon, samen met *sent*.'
  fr.a1.unit49.lesson04.teach.pourquoi_se_sent:
    title: Vragen waarom iemand zich zo voelt
    gloss: Waarom voelt hij zich zenuwachtig?
    note: Combineert *pourquoi* met *se sentir* uit *Il se sent nerveux*; *sent-il* schrijf je met een koppelteken.
  fr.a1.unit49.lesson05.teach.salut_camille_je:
    title: Lees een bericht over gevoelens
    gloss: Hoi Camille, ik ben een beetje zenuwachtig voor mijn eerste dienst helemaal alleen. Maar ik ben ook blij, want ik heb een nieuwe baan en een nieuw appartement. Ik denk dat het wel goed komt.
    note: Let op waarvoor de schrijver zenuwachtig is, wat hem blij maakt en hoe hij er in het algemeen over denkt.
    glosses:
      peu: een beetje
      nerveux: nerveus
      premier: eerste
      service: dienst
      seul: alleen
      content: blij
      car: want, omdat
      nouveau: nieuwe
      travail: werk
      nouvel: nieuwe
      appartement: appartement
      pense: denken
      aller: 'gaan (hier: goed komen)'
  fr.a1.unit49.lesson06.teach.camille_salut_mathieu:
    title: Camille vraagt hoe Mathieu zich voelt
    gloss: 'Camille: Hoi Mathieu, hoe voel je je voor je eerste dienst?'
    note: '*Avant ton premier service* (voor je eerste dienst) gebruikt opnieuw het patroon *avant* + zelfstandig naamwoord uit les 3.'
  fr.a1.unit49.lesson06.teach.mathieu_je_suis:
    title: Mathieu geeft toe dat hij zenuwachtig is
    gloss: 'Mathieu: Ik ben eerlijk gezegd een beetje zenuwachtig.'
    note: '*Honnêtement* (eerlijk gezegd) maakt het toegeven zachter.'
  fr.a1.unit49.lesson06.teach.camille_ne_t:
    title: Camille stelt hem gerust
    gloss: 'Camille: Maak je geen zorgen, het gaat je lukken!'
    note: '*Tu vas y arriver* (letterlijk ''je gaat daar aankomen'') is een bemoedigende vaste uitdrukking; *aller* + infinitief vormt de nabije toekomst.'
  fr.a1.unit49.lesson06.teach.mathieu_merci_ca:
    title: Mathieu bedankt haar
    gloss: 'Mathieu: Bedankt, dat helpt echt.'
    note: '*Aide* is de *il/elle*-vorm van *aider* (helpen); *m''* staat voor *me*.'
  fr.a1.unit49.lesson06.teach.camille_et_apres:
    title: Camille voorspelt hoe het afloopt
    gloss: 'Camille: En daarna ben je vast heel blij en trots.'
    note: '*Sûrement* (vast, zeker) drukt een zelfverzekerde voorspelling uit; *fier* (trots) is een nieuw, nuttig bijvoeglijk naamwoord.'
  fr.a1.unit49.lesson06.teach.mathieu_oui_je:
    title: Mathieu is het eens
    gloss: 'Mathieu: Ja, dat denk ik ook.'
    note: '*Je pense aussi* is de natuurlijke manier om het met iemands mening eens te zijn.'
  fr.a1.unit49.lesson06.teach.il_remplace_mathieu:
    title: Samenvatten met il, elle en l'
    gloss: Mathieu is zenuwachtig voor zijn eerste dienst. Camille helpt hem.
    note: '*Il* vervangt de naam van een man (*il est nerveux*), *elle* vervangt de naam van een vrouw en *l''* (*elle l''aide*) betekent ''hem'': drie kleine maar belangrijke woordjes om over iemand anders te praten.'
