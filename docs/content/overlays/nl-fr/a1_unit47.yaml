teaching:
  fr.a1.unit47.lesson01.teach.le_temps:
    title: Weer
    gloss: het weer
    note: '*Le temps* betekent zowel ''het weer'' als ''de tijd''; het woord is mannelijk.'
    example_gloss: Wat voor weer is het?
  fr.a1.unit47.lesson01.teach.quel_temps_fait:
    title: Naar het weer vragen
    gloss: Wat voor weer is het?
    note: '*Quel temps fait-il ?* is de standaardvraag naar het weer; *quel* congrueert met het mannelijke woord *temps*.'
  fr.a1.unit47.lesson01.teach.le_temps_est:
    title: Zonnig
    gloss: Het is zonnig.
    note: '*Le temps est* + bijvoeglijk naamwoord is een vast patroon; het bijvoeglijk naamwoord congrueert met het mannelijke woord *temps*.'
  fr.a1.unit47.lesson01.teach.il_pleut:
    title: Regen
    gloss: Het regent.
    note: '*Pleuvoir* (regenen) wordt onpersoonlijk gebruikt: *il pleut*, zonder los bijvoeglijk naamwoord.'
  fr.a1.unit47.lesson01.teach.le_temps_est_2:
    title: Bewolkt
    gloss: Het is bewolkt.
    note: Hetzelfde patroon *le temps est* + bijvoeglijk naamwoord als bij *ensoleillé*.
  fr.a1.unit47.lesson02.teach.il_fait_froid:
    title: Koud
    gloss: Het is koud vandaag.
    note: '*Aujourd''hui* (vandaag) plaatst het weer in de tijd; *il fait froid* gebruikt *faire*, niet *être*.'
  fr.a1.unit47.lesson02.teach.il_fait_chaud:
    title: Warm
    gloss: Het is warm vandaag.
    note: '*Il fait chaud* dekt in het dagelijks weerpraatje zowel ''warm'' als ''heet''.'
  fr.a1.unit47.lesson02.teach.il_ne_fait:
    title: Temperaturen tegenover elkaar zetten
    gloss: Het is niet koud, het is warm.
    note: '*Ne ... pas* staat om het werkwoord heen: *il ne fait pas froid*.'
  fr.a1.unit47.lesson03.teach.la_meteo:
    title: De weersverwachting
    gloss: de weersverwachting
    note: '*La météo* is vrouwelijk en een afkorting van *la météorologie*.'
    example_gloss: Wat is de weersverwachting?
  fr.a1.unit47.lesson03.teach.demain_le_temps:
    title: Het weer van morgen
    gloss: Morgen is het zonnig.
    note: '*Demain* staat aan het begin van de zin, gevolgd door een komma; de rest behoudt de gewone volgorde.'
  fr.a1.unit47.lesson03.teach.samedi_le_temps:
    title: Een verwachting voor twee dagen
    gloss: Zaterdag is het zonnig en warm, maar zondag regent het de hele dag.
    note: '*Toute la journée* (de hele dag) benadrukt hoe lang de regen aanhoudt.'
  fr.a1.unit47.lesson04.teach.la_promenade:
    title: De wandeling
    gloss: de wandeling
    note: '*Promenade* is vrouwelijk: *la promenade*.'
    example_gloss: Zullen we een wandeling maken?
  fr.a1.unit47.lesson04.teach.on_fait_une:
    title: Een wandeling voorstellen
    gloss: Zullen we een wandeling maken?
    note: '*On fait une promenade ?* is een vriendelijke manier om iets voor te stellen; *faire une promenade* is de vaste uitdrukking voor ''een wandeling maken''.'
  fr.a1.unit47.lesson04.teach.s_il_pleut:
    title: Een plan met een voorwaarde
    gloss: Als het regent, blijven we binnen.
    note: '*S''il pleut* (als het regent): *si* + *il* wordt *s''il*; daarna zegt *on reste à l''intérieur* wat je doet.'
  fr.a1.unit47.lesson04.teach.bonne_idee_faisons:
    title: Instemmen en iets voorstellen
    gloss: Goed idee! Laten we een wandeling maken.
    note: '*Faisons ...* (laten we ...) is een andere gangbare manier om een activiteit voor te stellen, naast *On ... ?*'
  fr.a1.unit47.lesson05.teach.meteo_samedi_le:
    title: Lees een verwachting voor twee dagen
    gloss: 'Weersverwachting: zaterdag is het zonnig en warm. Zondag regent het de hele dag.'
    note: Let op welke dag welk weer heeft.
    glosses:
      Météo: weersverwachting
      samedi: zaterdag
      ensoleillé: zonnig
      chaud: warm
      Dimanche: zondag
      pleut: regent
      toute: hele
      journée: dag
  fr.a1.unit47.lesson06.teach.camille_quel_temps:
    title: Camille vraagt naar het weekend
    gloss: 'Camille: Wat voor weer is het dit weekend?'
    note: '*Ce week-end* (dit weekend) plaatst de vraag in de nabije toekomst.'
  fr.a1.unit47.lesson06.teach.mathieu_samedi_le:
    title: Mathieu geeft de verwachting
    gloss: 'Mathieu: Zaterdag is het zonnig en warm, maar zondag regent het de hele dag.'
    note: Komt precies overeen met de verwachting die je in les 5 hebt gelezen.
  fr.a1.unit47.lesson06.teach.camille_alors_on:
    title: Camille doet een voorstel
    gloss: 'Camille: Zullen we dan zaterdag een wandeling maken?'
    note: '*Alors* (dan) koppelt het voorstel direct aan het mooie weer dat Mathieu net beschreef.'
  fr.a1.unit47.lesson06.teach.mathieu_bonne_idee:
    title: Mathieu stemt in en plant zondag
    gloss: 'Mathieu: Goed idee. En zondag blijven we lekker rustig binnen.'
    note: '*Tranquillement* betekent hier ''lekker, zonder haast'' en laat binnen blijven aantrekkelijk klinken.'
  fr.a1.unit47.lesson06.teach.camille_parfait_alors:
    title: Camille rondt het plan af
    gloss: 'Camille: Perfect, dan kijken we een film.'
    note: '*Regarder* (kijken) past vanzelf bij *un film* (een film).'
