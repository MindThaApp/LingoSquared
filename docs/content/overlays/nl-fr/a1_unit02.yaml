    title: Getallen van nul tot tien
  fr.a1.unit02.lesson02.numbers_eleven_to_hundred:
    title: 'Bijzondere vormen: elf tot honderd'
  fr.a1.unit02.lesson03.asking_age:
    title: Iemands leeftijd vragen
  fr.a1.unit02.lesson04.phone_numbers:
    title: Telefoonnummers
  fr.a1.unit02.lesson05.recipe_quantities:
    title: Recepthoeveelheden
  fr.a1.unit02.lesson06.recipe_count_dialogue:
    title: Ingrediënten tellen met Inès en Mathieu
teaching:
  fr.a1.unit02.lesson01.teach.zero:
    title: Nul
    gloss: nul
    note: '*Zéro* gebruik je zowel als getal zelf als als cijfer wanneer je een reeks cijfers hardop voorleest.'
  fr.a1.unit02.lesson01.teach.un:
    title: Een
    gloss: een
    note: '*Un* is mannelijk; de vrouwelijke vorm *une* staat voor een vrouwelijk zelfstandig naamwoord (*une tasse*, één kopje). Los, zoals bij het tellen, blijft het *un*.'
  fr.a1.unit02.lesson01.teach.deux:
    title: Twee
    gloss: twee
    note: '*Deux* verandert nooit van vorm, ongeacht het geslacht van het zelfstandig naamwoord.'
  fr.a1.unit02.lesson01.teach.trois:
    title: Drie
    gloss: drie
    note: '*Trois* is onveranderlijk.'
  fr.a1.unit02.lesson01.teach.quatre:
    title: Vier
    gloss: vier
    note: '*Quatre* is onveranderlijk.'
  fr.a1.unit02.lesson01.teach.cinq:
    title: Vijf
    gloss: vijf
    note: '*Cinq* is onveranderlijk. De slotmedeklinker q wordt normaal uitgesproken, anders dan de stomme slotmedeklinkers van verschillende andere Franse getallen.'
  fr.a1.unit02.lesson01.teach.six:
    title: Six
    gloss: zes
    note: '*Six* wordt alleen uitgesproken met een slot-/s/; die slotmedeklinker valt weg voor een zelfstandig naamwoord dat met een medeklinker begint (*six livres* klinkt als "si livres").'
  fr.a1.unit02.lesson01.teach.sept:
    title: Zeven
    gloss: zeven
    note: '*Sept* is onveranderlijk; de p is stom, alleen de slot-t wordt uitgesproken.'
  fr.a1.unit02.lesson01.teach.huit:
    title: Acht
    gloss: acht
    note: '*Huit* is onveranderlijk. De h is stom, zoals in bijna alle Franse woorden.'
  fr.a1.unit02.lesson01.teach.neuf:
    title: Negen
    gloss: negen
    note: '*Neuf* is onveranderlijk.'
  fr.a1.unit02.lesson01.teach.dix:
    title: Tien
    gloss: tien
    note: '*Dix* wordt alleen uitgesproken met een slot-/s/, volgens hetzelfde patroon als *six*: de slotmedeklinker valt weg voor een medeklinker.'
  fr.a1.unit02.lesson02.teach.onze:
    title: Elf
    gloss: elf
    note: '*Onze* tot en met *seize* (11-16) zijn elk een eigen woord, niet opgebouwd uit *dix*, zoals eenentwintig en hoger wel *vingt* hergebruiken.'
  fr.a1.unit02.lesson02.teach.douze:
    title: Twaalf
    gloss: twaalf
    note: '*Douze* is één woord. Het begint net als *deux*, maar er zit geen zichtbaar *dix* in.'
  fr.a1.unit02.lesson02.teach.treize:
    title: Dertien
    gloss: dertien
    note: '*Treize* is één woord. Het klinkt aan het begin als *trois*, maar er zit geen zichtbare *dix* in.'
  fr.a1.unit02.lesson02.teach.quatorze:
    title: Veertien
    gloss: veertien
    note: '*Quatorze* is één woord. Het klinkt aan het begin als *quatre*, maar er zit geen zichtbare *dix* in.'
  fr.a1.unit02.lesson02.teach.quinze:
    title: Vijftien
    gloss: vijftien
    note: '*Quinze* is vaag verwant aan *cinq*, maar er zit geen zichtbare *dix* in.'
  fr.a1.unit02.lesson02.teach.seize:
    title: Zestien
    gloss: zestien
    note: '*Seize* is het laatste van de samengesmolten woorden in de tientallen; vanaf *dix-sept* (17) wordt *dix* weer zichtbaar met het eenheidsgetal samengevoegd.'
  fr.a1.unit02.lesson02.teach.vingt:
    title: Twintig
    gloss: twintig
    note: '*Vingt* is een eigen woord. Vanaf eenentwintig worden tientallen en eenheden gecombineerd (*vingt et un*, *vingt-deux*), volgens een patroon dat verderop in deze cursus terugkomt.'
  fr.a1.unit02.lesson02.teach.trente:
    title: Dertig
    gloss: dertig
    note: '*Trente* wordt met een koppelteken aan een eenheid gekoppeld (*trente-quatre*), behalve bij één: dan staat er *et* (*trente et un*).'
  fr.a1.unit02.lesson02.teach.trente_quatre:
    title: Vierendertig
    gloss: vierendertig
    note: '*Trente-quatre* schrijf je met een koppelteken, terwijl je in het Nederlands vierendertig aan elkaar schrijft.'
  fr.a1.unit02.lesson02.teach.soixante:
    title: Zestig
    gloss: zestig
    note: '*Soixante* gedraagt zich als een gewoon tiental (*soixante-quatre*, 64) tot en met negenenzestig. Het onregelmatige deel begint bij zeventig, dat hierna volgt.'
  fr.a1.unit02.lesson02.teach.soixante_dix:
    title: Zeventig
    gloss: zeventig
    note: 'Dit is de grootste verrassing in Franse getallen: er is geen eigen woord voor zeventig. *Soixante-dix* betekent letterlijk ''zestig-tien'' (60 + 10). Zo blijft het tellen doorgaan tot *soixante-dix-neuf* (79, ''zestig-negentien''), en daarna begint met *quatre-vingts* een nieuwe basis bij tachtig.'
  fr.a1.unit02.lesson02.teach.quatre_vingts:
    title: Tachtig
    gloss: tachtig
    note: '*Quatre-vingts* betekent letterlijk ''vier twintigen'' (4 x 20), een overblijfsel van een oud telsysteem met basis 20. Er staat alleen een slot-s achter als het getal alleen staat of het getal afsluit (*quatre-vingts*, 80); de s valt weg als er een eenheid op volgt (*quatre-vingt-un*, 81).'
  fr.a1.unit02.lesson02.teach.quatre_vingt_dix:
    title: Negentig
    gloss: negentig
    note: '*Quatre-vingt-dix* betekent letterlijk ''vier twintigen plus tien'' (4x20 + 10). Het telpatroon met basis 20 loopt net als bij zeventig door tot *quatre-vingt-dix-neuf* (99).'
  fr.a1.unit02.lesson02.teach.cent:
    title: Honderd
    gloss: honderd
    note: '*Cent* is de vorm voor precies 100 op zichzelf, zonder lidwoord (dus niet "*un cent*").'
  fr.a1.unit02.lesson03.teach.quel_age_as_tu:
    title: Informeel naar de leeftijd vragen
    gloss: Hoe oud ben je?
    note: Het Frans vraagt letterlijk welke leeftijd je hebt, met *avoir* (hebben), en niet met een vorm van *être* ('zijn') zoals je in het Nederlands 'hoe oud ben je?' zegt.
  fr.a1.unit02.lesson03.teach.jai_vingt_huit_ans:
    title: Je leeftijd zeggen
    gloss: Ik ben achtentwintig.
    note: '*Ai* is de je-vorm van *avoir*. *Ans* (jaren) is in het Frans verplicht, terwijl je in het Nederlands gewoon ''ik ben achtentwintig'' kunt zeggen.'
  fr.a1.unit02.lesson03.teach.quel_age_avez_vous:
    title: Formeel naar de leeftijd vragen
    gloss: Hoe oud ben je?
    note: '*Avez-vous* is de *vous*-vorm van *avoir*, passend bij het formele register uit Unit 1.'
  fr.a1.unit02.lesson03.teach.jai_trente_et_un_ans:
    title: Een samengestelde leeftijd zeggen
    gloss: Ik ben eenendertig.
    note: '*Trente et un* gebruikt *et* (en) in plaats van een koppelteken, specifiek bij de -één-vormen van dertig, veertig, vijftig en zestig (*trente et un*, *quarante et un*, *cinquante et un*, *soixante et un*). Eenenzeventig doorbreekt dit patroon: het is *soixante et onze* (zestig + elf), niet *soixante et un*, omdat de jaren zeventig doortellen met *dix*-vormen tot *soixante-dix-neuf* (79).'
  fr.a1.unit02.lesson03.teach.et_toi_quel_age:
    title: De leeftijdsvraag terugkaatsen
    gloss: En jij, hoe oud ben je?
    note: '*Et toi* opent de wedervraag; *toi* (niet *tu*) is het beklemtoonde persoonlijk voornaamwoord dat na *et* wordt gebruikt voor nadruk.'
  fr.a1.unit02.lesson04.teach.quel_est_ton_numero:
    title: Vraag om een telefoonnummer
    gloss: Wat is je telefoonnummer?
    note: '*Quel* congrueert met het mannelijke woord *numéro*; bij een vrouwelijk woord heb je *quelle* nodig.'
  fr.a1.unit02.lesson04.teach.numero_ines:
    title: Een nummer cijfer voor cijfer uitgesproken
    gloss: Nul, zes, een, vijf, nul, twee, negen, zeven, vier, drie
    note: Echte Franse telefoonnummers hebben tien cijfers en worden meestal in paren uitgesproken (*zéro six*, *quinze*, *zéro deux*...). De nummers in deze unit hebben het echte formaat van tien cijfers (06 15 02 97 43), maar worden cijfer voor cijfer gelezen, zodat je eerst de losse cijfers kunt oefenen.
  fr.a1.unit02.lesson04.teach.cest_le:
    title: Het nummer inleiden
    gloss: Het is...
    note: '*Le* (mannelijk ''de/het'') wordt gebruikt omdat *numéro* een mannelijk woord is.'
  fr.a1.unit02.lesson04.teach.tu_peux_repeter:
    title: Om herhaling vragen
    gloss: Kun je dat herhalen, alsjeblieft?
    note: '*Peux* is de *tu*-vorm van *pouvoir* (kunnen), handig als een nummer te snel voorbijgaat om het te verstaan.'
  fr.a1.unit02.lesson04.teach.bien_sur:
    title: Gewillig instemmen
    gloss: Natuurlijk; zeker
    note: '*Bien sûr* is een gebruikelijke, vriendelijke manier om op een verzoek ja te zeggen.'
  fr.a1.unit02.lesson05.teach.jai_besoin_trois_oeufs:
    title: Een benodigde hoeveelheid noemen
    gloss: Ik heb drie eieren nodig.
    note: '*J''ai besoin de* (letterlijk ''ik heb behoefte aan'') is hoe het Frans ''nodig hebben'' uitdrukt: met *avoir* en besoin, en niet met één eigen werkwoord.'
  fr.a1.unit02.lesson05.teach.combien_oeufs:
    title: Vragen hoeveel er nodig zijn
    gloss: Hoeveel eieren heb je nodig?
    note: '*De combien d''œufs* zet *de combien* (van hoeveel) vooraan, gevolgd door het zelfstandig naamwoord. Het Frans gebruikt hier dus een voorzetsel, terwijl je in het Nederlands gewoon ''hoeveel eieren'' zegt.'
  fr.a1.unit02.lesson05.teach.deux_tasses_farine:
    title: Een afgemeten hoeveelheid noemen
    gloss: Twee kopjes bloem
    note: '*De* verbindt de maateenheid (*tasses*, koppen) met wat gemeten wordt (*farine*, meel). In het Nederlands laat je dat woordje meestal weg: ''twee koppen meel''.'
  fr.a1.unit02.lesson05.teach.demi_tasse:
    title: Een halve hoeveelheid noemen
    gloss: Een half kopje suiker
    note: '*Demi-* blijft als voorvoegsel voor het zelfstandig naamwoord onveranderd (*une demi-tasse*), in tegenstelling tot het bijvoeglijk naamwoord *demi* achter een zelfstandig naamwoord, dat wel congrueert (*une heure et demie*).'
  fr.a1.unit02.lesson05.teach.jai_quatre_oeufs:
    title: Zeggen wat je hebt
    gloss: Ik heb vier eieren op tafel.
    note: '*J''ai* (ik heb) geeft aan wat al beschikbaar is, anders dan *j''ai besoin de* (ik heb nodig), dat aangeeft wat nog ontbreekt.'
  fr.a1.unit02.lesson06.teach.line01:
    title: Vragen hoeveel eieren
    gloss: Inès vraagt Mathieu hoeveel eieren hij nodig heeft voor het recept.
    note: 'Inès en Mathieu zeggen nu *tu* in plaats van het *vous* uit Unit 1: als deelnemers aan dezelfde workshop zijn ze snel op informeel gebruik overgestapt.'
  fr.a1.unit02.lesson06.teach.line02:
    title: De ingrediënten noemen
    gloss: Mathieu zegt dat hij drie eieren en twee koppen meel nodig heeft.
    note: '*J''ai besoin de* noemt wat er nog nodig is voor het recept.'
  fr.a1.unit02.lesson06.teach.line03:
    title: Aanbieden wat je hebt
    gloss: Inès zegt dat ze vier eieren op tafel heeft en vraagt of hij ook suiker nodig heeft.
    note: '*J''ai* geeft aan wat Inès al heeft, los van wat Mathieu nodig heeft.'
  fr.a1.unit02.lesson06.teach.line04:
    title: Een kleine hoeveelheid bevestigen
    gloss: 'Mathieu zegt ja, een beetje: ongeveer een halve kop.'
    note: '*Environ* betekent hier ''ongeveer'' en maakt de precieze hoeveelheid wat zachter.'
  fr.a1.unit02.lesson06.teach.line05:
    title: Vraag om een telefoonnummer
    gloss: Inès zegt perfect en vraagt dan naar Mathieus telefoonnummer, zodat ze hem kan appen over de volgende les.
    note: '*Comme ça je t''écris* (''zo kan ik je schrijven'') legt uit waarom ze het vraagt, een natuurlijke gewoonte voordat je om contactgegevens vraagt.'
  fr.a1.unit02.lesson06.teach.line06:
    title: Het telefoonnummer geven
    gloss: Mathieu leest zijn nummer cijfer voor cijfer voor.
    note: '*C''est le* leidt het nummer in, passend bij het mannelijke woord *numéro*.'
  fr.a1.unit02.lesson06.teach.line07:
    title: Hem bedanken en naar zijn leeftijd vragen
    gloss: 'Inès bedankt hem en stelt dan nog één laatste vraag: hoe oud hij is.'
    note: '*Une dernière question* (''nog een laatste vraag'') kondigt een natuurlijke onderwerpswisseling binnen hetzelfde gesprek aan.'
  fr.a1.unit02.lesson06.teach.line08:
    title: Zijn leeftijd noemen
    gloss: Mathieu zegt dat hij achtentwintig is en stelt Inès dezelfde vraag.
    note: '*J''ai vingt-huit ans* gebruikt de samengestelde vorm met koppelteken, zoals eerder in deze les.'
  fr.a1.unit02.lesson06.teach.line09:
    title: Haar leeftijd noemen
    gloss: Inès zegt dat ze eenendertig is.
    note: '*J''ai trente et un ans* gebruikt *et* (en) in plaats van een koppelteken, omdat eenendertig een van de -één-vormen is die eerder in deze unit aan bod kwamen.'
