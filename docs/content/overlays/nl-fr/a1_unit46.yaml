teaching:
  fr.a1.unit46.lesson01.teach.l_appartement_le:
    title: Appartement, woonkamer, slaapkamer
    gloss: het appartement, de woonkamer, de slaapkamer
    note: '*L''appartement* is mannelijk en laat de *e* van *le* vallen; *le salon* is mannelijk en *la chambre* is vrouwelijk.'
    example_gloss:
    - Ik heb een appartement.
    - Ik heb een woonkamer.
    - Ik heb een slaapkamer.
  fr.a1.unit46.lesson01.teach.la_cuisine_la:
    title: Keuken, badkamer
    gloss: de keuken, de badkamer
    note: '*La cuisine* en *la salle de bains* zijn allebei vrouwelijk.'
    example_gloss:
    - Ik heb een keuken.
    - Ik heb een badkamer.
  fr.a1.unit46.lesson01.teach.j_ai_un:
    title: Zeggen dat je een appartement hebt
    gloss: Ik heb een appartement.
    note: '*Avoir* (hebben) is het gewone werkwoord om te zeggen wat voor woning je hebt, net zoals in het Nederlands met ''hebben''. Dit is een algemeen voorbeeld; het appartement van Mathieu zelf (in Lyon) komt later in deze unit.'
  fr.a1.unit46.lesson01.teach.j_ai_un_2:
    title: Alle kamers opsommen
    gloss: Ik heb een woonkamer, een slaapkamer, een keuken en een badkamer.
    note: Alle vier de kamers uit de woordenschat van deze les in één zin, gescheiden door komma's en met *et* voor het laatste woord.
  fr.a1.unit46.lesson02.teach.tu_as_combien:
    title: Vragen hoeveel kamers
    gloss: Hoeveel kamers heb jij?
    note: 'Na *combien de* (hoeveel) volgt een zelfstandig naamwoord in het meervoud: *combien de pièces*.'
  fr.a1.unit46.lesson02.teach.j_ai_deux:
    title: Het aantal kamers noemen
    gloss: Ik heb twee slaapkamers.
    note: '*Chambres* is het meervoud van *chambre*, regelmatig gevormd met een stomme *-s*.'
  fr.a1.unit46.lesson02.teach.l_appartement_a:
    title: Het totale aantal kamers noemen
    gloss: Het appartement heeft drie kamers.
    note: '*Pièces* is een algemeen woord voor kamers en niet beperkt tot slaapkamers.'
  fr.a1.unit46.lesson03.teach.le_balcon_le:
    title: Balkon, tuin
    gloss: het balkon, de tuin
    note: '*Le balcon* en *le jardin* zijn allebei mannelijk.'
    example_gloss:
    - Er is een balkon.
    - Er is geen tuin.
  fr.a1.unit46.lesson03.teach.il_y_a:
    title: Zeggen dat iets er is
    gloss: Er is een balkon.
    note: '*Il y a* is de standaardconstructie om te zeggen dat iets bestaat, gelijk aan ''er is'' of ''er zijn'' in het Nederlands.'
  fr.a1.unit46.lesson03.teach.il_n_y:
    title: Zeggen dat iets er niet is
    gloss: Er is geen tuin.
    note: '*Pas de* ontkent een onbepaald zelfstandig naamwoord: *pas de jardin*, niet *pas un jardin*.'
  fr.a1.unit46.lesson04.teach.cosy:
    title: Gezellig
    gloss: gezellig
    note: Een heel gebruikelijk, typisch Frans bijvoeglijk naamwoord voor een warme, prettige sfeer.
    example_gloss: Het appartement is klein maar gezellig.
  fr.a1.unit46.lesson04.teach.l_appartement_est:
    title: Een veelgebruikt beschrijvingspatroon
    gloss: Het appartement is klein maar gezellig.
    note: '*Petit mais cosy* is een heel natuurlijke manier waarop Fransen een compacte woning positief beschrijven.'
  fr.a1.unit46.lesson04.teach.le_salon_est:
    title: De grootte van een kamer beschrijven
    gloss: De woonkamer is groot.
    note: '*Grand* beschrijft één specifieke kamer, niet het hele huis; het past zich aan *le salon* aan, dat mannelijk is.'
  fr.a1.unit46.lesson04.teach.la_cuisine_est:
    title: De grootte van een andere kamer beschrijven
    gloss: De keuken is klein.
    note: 'Hetzelfde patroon als *grand* op de vorige kaart, nu met een andere kamer: *la cuisine* is vrouwelijk, dus *petite*.'
  fr.a1.unit46.lesson05.teach.appartement_a_lyon:
    title: Lees een woonadvertentie
    gloss: 'Appartement in Lyon: één slaapkamer, een woonkamer, een keuken en een badkamer. Er is een balkon, maar geen tuin. Het appartement is klein maar gezellig.'
    note: Let op het aantal kamers, welke voorzieningen er wel of niet zijn en de algemene indruk.
    glosses:
      Appartement: appartement
      chambre: slaapkamer
      salon: woonkamer
      cuisine: keuken
      bains: badkamer
      balcon: balkon
      jardin: tuin
      petit: klein
      cosy: gezellig
  fr.a1.unit46.lesson06.teach.camille_salut_mathieu:
    title: Camille vraagt naar het appartement
    gloss: 'Camille: Hoi Mathieu, hoe is je nieuwe appartement in Lyon?'
    note: '*Nouvel* is de vorm van *nouveau* (nieuw) vóór een mannelijk woord dat met een klinker begint: *un nouvel appartement*.'
  fr.a1.unit46.lesson06.teach.mathieu_il_est:
    title: Mathieu beschrijft het
    gloss: 'Mathieu: Het is klein maar gezellig. Ik heb een slaapkamer, een woonkamer, een keuken en een badkamer.'
    note: 'Komt precies overeen met de woonadvertentie uit les 5: dit is het echte appartement van Mathieu.'
  fr.a1.unit46.lesson06.teach.camille_tu_as:
    title: Camille vraagt naar het balkon
    gloss: 'Camille: Heb je een balkon?'
    note: Een directe ja/nee-vraag met *Tu as ... ?*
  fr.a1.unit46.lesson06.teach.mathieu_oui_j:
    title: Mathieu antwoordt
    gloss: 'Mathieu: Ja, ik heb een balkon, maar geen tuin.'
    note: 'Komt overeen met het gegeven uit de advertentie van les 5: wel een balkon, geen tuin.'
  fr.a1.unit46.lesson06.teach.balcon_est_masculin:
    title: Het geslacht van balcon
    gloss: '*Balcon* is mannelijk: un balcon, il est petit.'
    note: '*Il* (hij, het) vervangt een mannelijk woord zoals *balcon*, dus ook het bijvoeglijk naamwoord is mannelijk: *il est petit*.'
  fr.a1.unit46.lesson06.teach.camille_ca_a:
    title: Camille reageert warm
    gloss: 'Camille: Dat klinkt leuk! Ik kom binnenkort een keer langs.'
    note: '*Je passerai te voir* (ik kom langs) gebruikt de toekomende tijd *passerai* plus *te voir*, ''je zien''.'
  fr.a1.unit46.lesson06.teach.mathieu_super_tu:
    title: Mathieu heet haar welkom
    gloss: 'Mathieu: Top, je bent altijd welkom.'
    note: '*Toujours la bienvenue* (altijd welkom) is een hartelijke manier om iemand uit te nodigen terug te komen; *bienvenue* is hier vrouwelijk omdat het Camille beschrijft.'
