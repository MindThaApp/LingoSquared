answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Frans A1
  description: 'Dagdelen en de klokkijd zeggen (heure(s), et quart, et demie, moins le quart), waarbij het kookworkshopverhaal van Inès en Mathieu doorloopt in het plannen van hun volgende sessie. Let op: in het Frans gebruikt men in formele of planningscontexten het 24-uursformaat (dix-huit heures trente), naast de informele 12-uursvormen die eerder in de unit aan bod kwamen.'
units:
  fr.a1.unit06.time:
    title: Hoe laat is het?
lessons:
  fr.a1.unit06.lesson01.moments_de_la_journee:
    title: Dagdelen
  fr.a1.unit06.lesson02.dire_lheure:
    title: De tijd zeggen
  fr.a1.unit06.lesson03.dialogue_prochain_atelier:
    title: De volgende workshop
teaching:
  fr.a1.unit06.lesson01.teach.heure:
    title: Het uur; de tijd
    gloss: het uur; de tijd
    note: '*Heure* is vrouwelijk; het woord wordt ook gebruikt om de klokkijd aan te geven (*dix heures* = tien uur).'
    example_gloss: Hoe laat is het?
  fr.a1.unit06.lesson01.teach.matin:
    title: De ochtend
    gloss: de ochtend
    note: '*Matin* is mannelijk.'
    example_gloss: De markt is 's ochtends open.
  fr.a1.unit06.lesson01.teach.apres_midi:
    title: De middag
    gloss: de middag
    note: '*Après-midi* kan mannelijk of vrouwelijk zijn (mannelijk is gebruikelijker); *l''* wordt afgekort voor de klinkerklank.'
    example_gloss: Ik werk in de namiddag.
  fr.a1.unit06.lesson01.teach.soir:
    title: De avond
    gloss: de avond
    note: '*Soir* is mannelijk.'
    example_gloss: De kookworkshop is 's avonds.
  fr.a1.unit06.lesson01.teach.midi:
    title: Twaalf uur 's middags
    gloss: het middaguur
    note: '*Midi* krijgt geen lidwoord als tijdsaanduiding (*à midi*, niet *au midi*).'
    example_gloss: We eten om twaalf uur 's middags.
  fr.a1.unit06.lesson01.teach.minuit:
    title: Middernacht
    gloss: middernacht
    note: '*Minuit* volgt hetzelfde patroon als *midi*: geen lidwoord.'
    example_gloss: De workshop duurt nooit langer dan middernacht.
  fr.a1.unit06.lesson01.teach.latelier_commence_le_soir:
    title: Zeggen wanneer de workshop is
    gloss: De workshop begint 's avonds, niet 's ochtends.
    note: Zet *le soir* en *le matin* direct tegenover elkaar, met beide woorden uit de woordenschat van deze les.
  fr.a1.unit06.lesson02.teach.quelle_heure_est_il:
    title: Naar de tijd vragen
    gloss: Hoe laat is het?
    note: '*Quelle heure est-il ?* is de standaardmanier om naar de tijd te vragen; *-il* staat na het werkwoord (inversie) als vraagteken.'
  fr.a1.unit06.lesson02.teach.il_est_dix_heures:
    title: Het uur zeggen
    gloss: Het is tien uur.
    note: '*Il est* + getal + *heures* is het basispatroon voor elk uur; *heures* blijft meervoud, behalve bij *une heure* (één uur).'
  fr.a1.unit06.lesson02.teach.et_quart:
    title: Kwart over zeggen
    gloss: Het is kwart over tien.
    note: '*Et quart* (en een kwart) telt vijftien minuten op bij het genoemde uur.'
  fr.a1.unit06.lesson02.teach.et_demie:
    title: Het halve uur zeggen
    gloss: Het is half elf.
    note: '*Et demie* (en een half) telt dertig minuten op; *demie* krijgt de vrouwelijke -e, passend bij *heure*. Let op: het Frans telt vanaf het genoemde uur, dus anders dan in het Nederlands ''half elf''.'
  fr.a1.unit06.lesson02.teach.moins_le_quart:
    title: Kwart voor zeggen
    gloss: Het is kwart voor elf.
    note: '*Moins le quart* (min het kwart) telt terug vanaf het VOLGENDE uur, niet vanaf het huidige. Dat gaat net als in het Nederlands bij ''kwart voor elf'', maar let op de woordvolgorde: onze heures moins le quart.'
  fr.a1.unit06.lesson02.teach.a_quelle_heure:
    title: Vragen hoe laat iets begint
    gloss: Hoe laat begint de workshop?
    note: '*À quelle heure ?* (hoe laat) gebruik je om te vragen naar een geplande gebeurtenis, anders dan de algemene vraag *Quelle heure est-il ?*.'
  fr.a1.unit06.lesson03.teach.line01:
    title: Vragen hoe laat het volgende week begint
    gloss: Inès vraagt hoe laat de workshop van volgende week is.
    note: '*La semaine prochaine* (volgende week) combineert met het vraagpatroon *à quelle heure* uit deze les.'
  fr.a1.unit06.lesson03.teach.line02:
    title: De begintijd noemen
    gloss: Mathieu zegt dat het om achttien uur dertig begint, denkt hij.
    note: '*Dix-huit heures trente* gebruikt het 24-uursformaat dat gebruikelijk is bij Franse planningen, anders dan de informele vormen met *et demie*.'
  fr.a1.unit06.lesson03.teach.line03:
    title: Bevestigen dat het 's avonds is
    gloss: 'Inès controleert: ''s avonds, niet ''s ochtends?'
    note: Een korte bevestigingsvraag waarin *le soir* en *le matin* tegenover elkaar staan.
  fr.a1.unit06.lesson03.teach.line04:
    title: Bevestigen en uitleggen waarom
    gloss: Mathieu bevestigt dat het 's avonds is, handiger na het werk.
    note: '*Après le travail* (na het werk) geeft een eenvoudige, praktische reden.'
  fr.a1.unit06.lesson03.teach.line05:
    title: Vragen naar de eindtijd
    gloss: Inès vraagt hoe laat het afgelopen is.
    note: '*Finit* (eindigt) staat direct tegenover *commence* (begint) uit de eerdere zin.'
  fr.a1.unit06.lesson03.teach.line06:
    title: De eindtijd noemen
    gloss: Mathieu zegt rond twintig uur vijftien, zoals gewoonlijk.
    note: '*Vers* (rond, omstreeks) geeft een ongeveer tijdstip aan, vager dan een precies *à*.'
  fr.a1.unit06.lesson03.teach.line07:
    title: Het plan bevestigen
    gloss: 'Inès bevestigt: tot volgende week om achttien uur dertig!'
    note: Sluit het gesprek af door de afgesproken tijd te herhalen, een natuurlijke manier om in het Frans een afspraak te bevestigen.
