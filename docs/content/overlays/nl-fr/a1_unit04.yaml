answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Frans A1
  description: 'Woordenschat voor de markt, vragen naar prijzen en hoeveelheden met combien/kilo/litre, en het verschil tussen du/de la en gewoon de na hoeveelheidsuitdrukkingen. Het verhaal van Inès en Mathieu na de kookworkshop gaat verder op de markt. Let op: het Frans laat het partitieve lidwoord helemaal weg na een uitdrukkelijke hoeveelheid (un kilo de tomates, niet un kilo des tomates).'
units:
  fr.a1.unit04.shopping:
    title: Boodschappen doen met Inès
lessons:
  fr.a1.unit04.lesson01.au_marche:
    title: Op de markt
  fr.a1.unit04.lesson02.combien_ca_coute:
    title: Hoeveel kost het?
  fr.a1.unit04.lesson03.dialogue_marche:
    title: Op de markt met Inès en Mathieu
teaching:
  fr.a1.unit04.lesson01.teach.marche:
    title: De markt
    gloss: de markt
    note: '*Marché* is mannelijk.'
    example_gloss: De markt is op zaterdag open.
  fr.a1.unit04.lesson01.teach.boulangerie:
    title: De bakkerij
    gloss: de bakkerij
    note: '*Boulangerie* is vrouwelijk; het is de winkel die speciaal brood verkoopt, iets anders dan een *pâtisserie* (banketbakkerij).'
    example_gloss: Hier in de buurt is een goede bakker.
  fr.a1.unit04.lesson01.teach.legumes:
    title: Groenten
    gloss: groenten
    note: '*Légumes* is mannelijk meervoud.'
    example_gloss: Ik koop verse groenten voor de workshop.
  fr.a1.unit04.lesson01.teach.fruits:
    title: Fruit
    gloss: fruit
    note: '*Fruits* is mannelijk meervoud. Het Frans gebruikt vaak het meervoud (*les fruits*), terwijl wij in het Nederlands meestal het ontelbare "fruit" zeggen.'
    example_gloss: Fruit is deze maand duur.
  fr.a1.unit04.lesson01.teach.prix:
    title: De prijs
    gloss: de prijs
    note: '*Prix* is mannelijk en onveranderlijk: enkelvoud en meervoud schrijf je hetzelfde.'
    example_gloss: Wat kost het brood?
  fr.a1.unit04.lesson01.teach.cher:
    title: Duur
    gloss: duur
    note: '*Cher* is de mannelijke vorm; *chère* is vrouwelijk, *chers*/*chères* is meervoud. Het past zich aan het zelfstandig naamwoord aan.'
    example_gloss: Deze kaas is te duur.
  fr.a1.unit04.lesson01.teach.pas_cher:
    title: Vandaag niet duur
    gloss: De groenten zijn vandaag niet duur.
    note: '*Pas cher(s)* (zonder *ne*) is de gewone spreektaalvorm om te zeggen dat iets goedkoop is; de volledige geschreven vorm is *ne sont pas chers*.'
  fr.a1.unit04.lesson02.teach.un_kilo_de:
    title: Een kilo
    gloss: een kilo
    note: '*De* volgt direct op de hoeveelheid, zonder lidwoord; zie de grammaticanotitie over *de na een hoeveelheid* hieronder.'
    example_gloss: Ik wil graag een kilo tomaten.
  fr.a1.unit04.lesson02.teach.un_litre_de:
    title: Een liter
    gloss: een liter
    note: '*Litre* is mannelijk en wordt voor vloeistoffen gebruikt, zoals *kilo* voor vaste producten.'
    example_gloss: Een liter melk, alstublieft.
  fr.a1.unit04.lesson02.teach.euro:
    title: Eén euro
    gloss: één euro
    note: '*Euro* krijgt in het meervoud gewoon een -s: *deux euros*, *cinq euros*.'
    example_gloss: Dat kost vijf euro.
  fr.a1.unit04.lesson02.teach.de_after_quantity:
    title: De na een hoeveelheid
    gloss: van
    note: 'Na een hoeveelheidswoord (*un kilo*, *un litre*, *beaucoup*, zoals in *beaucoup de cousins*) gebruikt het Frans gewoon *de* en vervallen *du*/*de la*/*des* helemaal: *un kilo de tomates*, nooit *un kilo des tomates*.'
  fr.a1.unit04.lesson02.teach.combien_ca_coute:
    title: Naar de prijs vragen
    gloss: Hoeveel kost het?
    note: '*Combien* (hoeveel) plus *ça coûte* (het kost) is de algemene manier om naar een prijs te vragen.'
  fr.a1.unit04.lesson02.teach.cest_combien_pain:
    title: Vragen naar de prijs van een bepaald product
    gloss: Hoeveel kost het brood?
    note: '*C''est combien, [item] ?* noemt het specifieke product waarvan je de prijs vraagt en is een veelgebruikt alternatief voor *Combien ça coûte ?*.'
  fr.a1.unit04.lesson02.teach.ca_fait_combien:
    title: Vragen naar het totaal
    gloss: Hoeveel is dat samen?
    note: '*Ça fait combien ?* vraagt naar het totaalbedrag, meestal aan het einde van een aankoop en niet over één product.'
  fr.a1.unit04.lesson03.teach.line01:
    title: Tomaten bestellen
    gloss: Inès begroet de verkoper en vraagt om een kilo tomaten.
    note: Combineert *Bonjour* met het patroon *je voudrais* + hoeveelheid.
  fr.a1.unit04.lesson03.teach.line02:
    title: Vragen of er nog iets nodig is
    gloss: De verkoper bevestigt het en vraagt of ze nog iets nodig heeft.
    note: '*Autre chose ?* (nog iets anders?) is de standaardvraag van een verkoper.'
  fr.a1.unit04.lesson03.teach.line03:
    title: Kaas toevoegen en naar de prijs vragen
    gloss: Inès wil ook een beetje kaas en vraagt wat die kost.
    note: '*Un peu de fromage* (een beetje kaas) gebruikt hetzelfde patroon met *de* zonder lidwoord als *un kilo de*.'
  fr.a1.unit04.lesson03.teach.line04:
    title: Een prijs per kilo noemen
    gloss: De verkoper zegt dat het acht euro per kilo is.
    note: '*X euros le kilo* is de gewone Franse manier om een prijs per eenheid te noemen; *le* betekent hier "per" en niet "de".'
  fr.a1.unit04.lesson03.teach.line05:
    title: Uitleggen waarom hij hier brood nodig heeft
    gloss: Mathieu zegt dat hij ook brood wil, maar dat de bakker vandaag dicht is.
    note: '*Fermée* (gesloten) is de vrouwelijke vorm, want het hoort bij *la boulangerie*.'
  fr.a1.unit04.lesson03.teach.line06:
    title: Een alternatief voorstellen
    gloss: 'Inès stelt hem gerust: je kunt hier ook brood kopen.'
    note: '*On peut* (men kan / we kunnen) + infinitief is een gebruikelijke informele manier om een mogelijkheid te noemen.'
  fr.a1.unit04.lesson03.teach.line07:
    title: Bevestigen en het totaal noemen
    gloss: De verkoper bevestigt dat hij vers brood heeft, rekent het totaal uit en noemt dertien euro vijftig.
    note: '*Ça fait combien en tout ?* denkt de verkoper hier hardop voordat hij het totaal noemt; hij vraagt het dus niet echt aan Inès.'
  fr.a1.unit04.lesson03.teach.line08:
    title: De verkoper bedanken
    gloss: Inès bedankt hem hartelijk terwijl ze betaalt.
    note: '*Voilà* begeleidt hier het overhandigen van het geld; een gebruikelijk gebaarwoord.'
