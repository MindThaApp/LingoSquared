teaching:
  fr.a1.unit44.lesson01.teach.je_ne_me:
    title: Je niet goed voelen
    gloss: Ik voel me niet goed.
    note: '*Se sentir* is wederkerend (*je me sens*); *ne ... pas bien* is de algemene, milde manier om te zeggen dat er iets niet klopt.'
  fr.a1.unit44.lesson01.teach.malade:
    title: Ziek
    gloss: ziek
    note: 'Het basisbijvoeglijk naamwoord, gebruikt met *être*: *je suis malade*.'
    example_gloss: Ik ben ziek.
  fr.a1.unit44.lesson01.teach.je_suis_malade:
    title: Ziek zijn
    gloss: Ik ben ziek.
    note: '*Malade* beschrijft een algemenere, sterkere toestand dan *pas bien*.'
  fr.a1.unit44.lesson01.teach.mal_a_la:
    title: Hoofdpijn
    gloss: hoofdpijn
    note: '*Mal à la tête* gaat met *avoir*: *j''ai mal à la tête*; *à la* omdat *tête* vrouwelijk is.'
    example_gloss: Ik heb hoofdpijn.
  fr.a1.unit44.lesson01.teach.j_ai_mal:
    title: Hoofdpijn hebben
    gloss: Ik heb hoofdpijn.
    note: 'Klachten gaan samen met *avoir* (hebben): *j''ai mal*.'
  fr.a1.unit44.lesson01.teach.mal_au_ventre:
    title: Buikpijn
    gloss: buikpijn
    note: '*Mal au ventre*: *au* is *à* + *le* samengetrokken, omdat *ventre* mannelijk is.'
    example_gloss: Ik heb buikpijn.
  fr.a1.unit44.lesson01.teach.j_ai_mal_2:
    title: Buikpijn hebben
    gloss: Ik heb buikpijn.
    note: Hetzelfde *avoir*-patroon als bij *mal à la tête*, met *au* in plaats van *à la*.
  fr.a1.unit44.lesson02.teach.qu_est_ce:
    title: Algemeen vragen
    gloss: Wat is er aan de hand?
    note: Een algemene manier om te vragen of er iets aan de hand is.
  fr.a1.unit44.lesson02.teach.qu_est_ce_2:
    title: Een veelgebruikte uitdrukking
    gloss: Wat scheelt er?
    note: '*Qu''est-ce qui ne va pas ?* is een vaste vraag, letterlijk ''wat gaat er niet goed''; vertaal hem niet woord voor woord.'
  fr.a1.unit44.lesson02.teach.mal_a_la:
    title: Keelpijn
    gloss: keelpijn
    note: '*Mal à la gorge* volgt *mal à la tête*: *gorge* is vrouwelijk, dus *à la*.'
    example_gloss: Ik heb keelpijn.
  fr.a1.unit44.lesson02.teach.j_ai_mal:
    title: Keelpijn hebben
    gloss: Ik heb keelpijn.
    note: Volgt hetzelfde *avoir*-patroon als de andere klachten.
  fr.a1.unit44.lesson02.teach.ca_va_non:
    title: Vragen hoe het met iemand gaat
    gloss: Gaat het goed met je? Nee, ik voel me niet goed.
    note: '*Ça va ?* is een heel gewone, informele vraag tussen vrienden.'
  fr.a1.unit44.lesson03.teach.la_fievre:
    title: Koorts
    gloss: koorts
    note: '*La fièvre* is vrouwelijk; na *avoir* krijgt het *de la*: *j''ai de la fièvre*.'
    example_gloss: Ik heb koorts.
  fr.a1.unit44.lesson03.teach.j_ai_de:
    title: Koorts hebben
    gloss: Ik heb koorts.
    note: Volgt het *avoir*-patroon, met het partitief *de la*.
  fr.a1.unit44.lesson03.teach.le_rhume:
    title: Verkouden zijn
    gloss: verkouden / verkouden zijn
    note: '*Le rhume* is een mannelijk zelfstandig naamwoord dat met *avoir* gebruikt wordt, geen bijvoeglijk naamwoord met *être*.'
    example_gloss: Ik ben verkouden.
  fr.a1.unit44.lesson03.teach.j_ai_un:
    title: Zeggen dat je verkouden bent
    gloss: Ik ben verkouden.
    note: In het Frans zeg je *j'ai un rhume* (letterlijk 'ik heb een verkoudheid'); *je suis rhume* is fout.
  fr.a1.unit44.lesson03.teach.malade_se_dit:
    title: Être of avoir?
    gloss: '*Malade* is een bijvoeglijk naamwoord en gaat met *être*: ik ben ziek. *Mal*, *fièvre* en *rhume* zijn zelfstandige naamwoorden en gaan met *avoir*: ik ben verkouden.'
    note: 'De keuze tussen *être* en *avoir* hangt af van de woordsoort: een bijvoeglijk naamwoord als *malade* gaat met *être*, een zelfstandig naamwoord als *fièvre* gaat met *avoir*, hoe kort de ziekte ook duurt.'
  fr.a1.unit44.lesson04.teach.la_pharmacie:
    title: De apotheek
    gloss: de apotheek
    note: '*Pharmacie* is vrouwelijk: *la pharmacie*.'
    example_gloss: Ik ga naar de apotheek.
  fr.a1.unit44.lesson04.teach.je_peux_vous:
    title: De begroeting van de apotheker
    gloss: Waarmee kan ik u helpen?
    note: '*Je peux vous aider ?* is een standaard beleefde begroeting in een winkel of dienst; *vous* is de beleefdheidsvorm.'
  fr.a1.unit44.lesson04.teach.avez_vous_quelque:
    title: Om iets vragen tegen een klacht
    gloss: Heeft u iets tegen hoofdpijn?
    note: '*Quelque chose contre* + klacht is de natuurlijke manier om naar een middel te vragen.'
  fr.a1.unit44.lesson04.teach.un_comprime:
    title: Een tablet
    gloss: een tablet / pil
    note: '*Comprimé* is mannelijk: *un comprimé*.'
    example_gloss: Ik neem een tablet.
  fr.a1.unit44.lesson04.teach.prenez_un_comprime:
    title: Doseringsinstructies
    gloss: Neem twee keer per dag een tablet.
    note: '*Prenez* is de gebiedende wijs van *prendre* (nemen) in de *vous*-vorm, gebruikt voor instructies.'
  fr.a1.unit44.lesson04.teach.a_la_pharmacie:
    title: Taalregister in de apotheek
    gloss: In de apotheek gebruik je de beleefdheidsvorm *vous*.
    note: De apotheker is een onbekende volwassene in een dienstverlenende rol, dus zeg je *vous*, net als aan het loket.
  fr.a1.unit44.lesson05.teach.conseil_prends_un:
    title: Lees een advies uit de apotheek
    gloss: 'Advies: neem twee keer per dag een tablet met water. Rust goed uit en drink veel water. Voel je je na drie dagen nog steeds niet goed? Ga dan naar de dokter.'
    note: Let op de dosering, de twee adviezen zonder medicijn en wanneer je naar de dokter moet.
    glosses:
      Conseil: advies
      prends: nemen
      fois: keer
      jour: dag
      comprimé: tablet
      Repose-toi: rusten
      bois: drinken
      sens: voelen
      toujours: nog steeds
      bien: goed
      médecin: dokter / huisarts
  fr.a1.unit44.lesson06.teach.camille_salut_mathieu:
    title: Camille informeert
    gloss: 'Camille: Hoi Mathieu, hoe gaat het? Voel je je al beter?'
    note: '*Déjà* (al) laat zien dat Camille wil weten of het beter met Mathieu gaat sinds ze elkaar voor het laatst spraken.'
  fr.a1.unit44.lesson06.teach.mathieu_pas_encore:
    title: Mathieu voelt zich nog steeds niet goed
    gloss: 'Mathieu: Nog niet zo goed. Ik heb nog steeds hoofdpijn en ben moe.'
    note: '*Toujours* (nog steeds) laat zien dat de hoofdpijn niet over is; *fatigué* (moe) is een nieuw, handig bijvoeglijk naamwoord.'
  fr.a1.unit44.lesson06.teach.camille_tu_as:
    title: Camille vraagt naar de medicijnen
    gloss: 'Camille: Heb je een tablet genomen?'
    note: '*Pris* is het voltooid deelwoord van *prendre*, gebruikt met *as* van *avoir*: *tu as pris*.'
  fr.a1.unit44.lesson06.teach.mathieu_oui_j:
    title: Mathieu bevestigt
    gloss: 'Mathieu: Ja, ik heb een tablet genomen. Ik ga nu rusten.'
    note: '*Je vais me reposer* (ik ga rusten) gebruikt *aller* + infinitief voor de nabije toekomst.'
  fr.a1.unit44.lesson06.teach.camille_bonne_idee:
    title: Camille wenst hem beterschap
    gloss: 'Camille: Goed idee. Rust goed uit. Beterschap!'
    note: '*Bon rétablissement !* is de vaste uitdrukking om iemand een snel herstel te wensen.'
  fr.a1.unit44.lesson06.teach.mathieu_merci_a:
    title: Mathieu neemt afscheid
    gloss: 'Mathieu: Bedankt, tot morgen!'
    note: '*À demain !* gebruikt *à* + tijdsaanduiding bij afscheid: *à demain*, *à bientôt*.'
