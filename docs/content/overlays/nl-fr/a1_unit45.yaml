teaching:
  fr.a1.unit45.lesson01.teach.tu_fais_quoi:
    title: Vragen naar iemands beroep
    gloss: Wat doet u voor werk?
    note: Een standaard, informele manier om naar iemands beroep te vragen.
  fr.a1.unit45.lesson01.teach.le_metier_cuisinier:
    title: Beroep / kok
    gloss: het beroep; kok
    note: '*Métier* (beroep) is mannelijk: *le métier*. *Cuisinier* verandert voor een vrouw: *un cuisinier*, *une cuisinière*.'
    example_gloss:
    - Wat voor werk doe je?
    - Ik werk als kok.
  fr.a1.unit45.lesson01.teach.je_travaille_comme:
    title: Zeggen dat je kok bent
    gloss: Ik werk als kok.
    note: '*Travailler comme* + beroep is het standaardpatroon om je werk te noemen, zonder lidwoord voor het beroep.'
  fr.a1.unit45.lesson01.teach.infirmiere:
    title: Verpleegkundige
    gloss: verpleegkundige
    note: De moderne, genderneutrale term voor dit beroep, voor alle geslachten te gebruiken.
    example_gloss: Ik werk als verpleegkundige.
  fr.a1.unit45.lesson01.teach.je_travaille_comme_2:
    title: Zeggen dat je verpleegkundige bent
    gloss: Ik werk als verpleegkundige.
    note: Volgt hetzelfde patroon *travailler comme* als *cuisinier*; de vrouwelijke vorm is *infirmière*.
  fr.a1.unit45.lesson02.teach.ou_travailles_tu:
    title: Vragen naar een werkplek
    gloss: Waar werk je?
    note: Een directe vervolgvraag op *Tu fais quoi dans la vie ?*
  fr.a1.unit45.lesson02.teach.je_travaille_dans:
    title: Werken in een restaurant
    gloss: Ik werk in een restaurant.
    note: '*Un restaurant* krijgt hier het onbepaalde lidwoord, omdat het een van de vele restaurants is.'
  fr.a1.unit45.lesson02.teach.l_hopital:
    title: Het ziekenhuis
    gloss: het ziekenhuis
    note: '*Hôpital* is mannelijk en begint met een klinkerklank: *l''hôpital*.'
    example_gloss: Ik werk in het ziekenhuis.
  fr.a1.unit45.lesson02.teach.je_travaille_a:
    title: Werken in het ziekenhuis
    gloss: Ik werk in het ziekenhuis.
    note: '*À l''hôpital* gebruikt het bepaald lidwoord, omdat het om een specifieke, bekende plek gaat; *le* wordt *l''* voor een klinkerklank.'
  fr.a1.unit45.lesson02.teach.certaines_personnes_travaillent:
    title: Werken op een kantoor
    gloss: Sommige mensen werken op een kantoor.
    note: '*Dans un bureau* (op een kantoor) krijgt een lidwoord, net als *dans un restaurant*.'
  fr.a1.unit45.lesson03.teach.je_commence_a:
    title: Begintijd
    gloss: Ik begin om negen uur.
    note: '*Commence* is de *je*-vorm van *commencer* (beginnen); *à neuf heures* geeft het tijdstip aan.'
  fr.a1.unit45.lesson03.teach.je_travaille_du:
    title: Werkdagen
    gloss: Ik werk van maandag tot vrijdag.
    note: '*Du lundi au vendredi* betekent van maandag tot vrijdag; *du* is *de* + *le* en *au* is *à* + *le*.'
  fr.a1.unit45.lesson03.teach.la_pause:
    title: De pauze
    gloss: de pauze
    note: '*Pause* is vrouwelijk: *la pause*.'
    example_gloss: Ik heb pauze om twaalf uur.
  fr.a1.unit45.lesson03.teach.j_ai_une:
    title: Pauze hebben
    gloss: Ik heb pauze om twaalf uur.
    note: '*Avoir une pause* (pauze hebben) is de vaste, natuurlijke combinatie.'
  fr.a1.unit45.lesson03.teach.je_finis_a:
    title: Eindtijd
    gloss: Ik stop om vijf uur.
    note: '*Finis* is de *je*-vorm van *finir* (eindigen, afmaken).'
  fr.a1.unit45.lesson03.teach.je_commence_a_2:
    title: Een hele werkdag
    gloss: Ik begin om negen uur en ik stop om vijf uur.
    note: '*Je commence* en *je finis* worden met *et* verbonden tot één zin over een hele werkdag.'
  fr.a1.unit45.lesson04.teach.avec_il_ou:
    title: Werkwoordsvormen met il en elle
    gloss: 'Bij hij of zij houden regelmatige -er-werkwoorden dezelfde vorm als bij ik: ik werk, hij werkt, zij werkt.'
    note: '*Travaille* is hetzelfde bij *je*, *il* en *elle*: regelmatige *-er*-werkwoorden krijgen in de derde persoon geen extra uitgang.'
  fr.a1.unit45.lesson04.teach.camille_travaille_comme:
    title: Camilles beroep
    gloss: Camille werkt als verpleegkundige.
    note: '*Travaille* hoort bij *je*, *il* en *elle*: de uitgang is stil, dus alle drie de vormen klinken hetzelfde.'
  fr.a1.unit45.lesson04.teach.mathieu_travaille_comme:
    title: Mathieus beroep
    gloss: Mathieu werkt als kok.
    note: Dezelfde uitgang als in *Camille travaille comme infirmière*.
  fr.a1.unit45.lesson04.teach.elle_travaille_a:
    title: Voornaamwoorden gebruiken
    gloss: Zij werkt in het ziekenhuis. Hij werkt in een restaurant.
    note: '*Elle* en *il* vervangen de namen Camille en Mathieu, maar de werkwoordsvorm blijft hetzelfde.'
  fr.a1.unit45.lesson05.teach.camille_travaille_comme:
    title: Lees twee werkprofielen
    gloss: Camille werkt als verpleegkundige in het ziekenhuis. Ze begint om zeven uur en werkt van maandag tot vrijdag. Mathieu werkt als kok in een restaurant. Hij begint om elf uur en heeft om vier uur pauze.
    note: Let apart op het beroep, de werkplek en het rooster van elke persoon.
    glosses:
      travaille: werkt
      infirmière: verpleegster
      l'hôpital: ziekenhuis
      commence: begint
      sept: zeven
      lundi: maandag
      vendredi: vrijdag
      cuisinier: kok / chef-kok
      restaurant: restaurant
      onze: elf
      pause: pauze
  fr.a1.unit45.lesson06.teach.camille_salut_mathieu:
    title: Camille vraagt naar werk
    gloss: 'Camille: Hoi Mathieu! Ik ben nieuwsgierig, wat doe jij eigenlijk voor werk?'
    note: '*Au fait* (trouwens) maakt van de vraag een vriendelijke, nieuwsgierige vraag in plaats van een verhoor.'
  fr.a1.unit45.lesson06.teach.mathieu_je_travaille:
    title: Mathieu antwoordt
    gloss: 'Mathieu: Ik werk als kok in een restaurant. En jij?'
    note: '*Et toi ?* is de gewone manier om de vraag terug te leggen bij de ander.'
  fr.a1.unit45.lesson06.teach.camille_je_travaille:
    title: Camille antwoordt
    gloss: 'Camille: Ik werk als verpleegkundige in het ziekenhuis.'
    note: Komt overeen met het beroep en de werkplek die eerder in de unit zijn genoemd.
  fr.a1.unit45.lesson06.teach.mathieu_tu_fais:
    title: Mathieu vraagt naar werktijden
    gloss: 'Mathieu: Welke werktijden heb jij?'
    note: '*Tu fais quels horaires ?* is een natuurlijke manier om naar iemands werktijden te vragen; *quels* is meervoud, net als *horaires*.'
  fr.a1.unit45.lesson06.teach.camille_je_commence:
    title: Camille noemt haar werktijden
    gloss: 'Camille: Ik begin om zeven uur en ik werk van maandag tot vrijdag.'
    note: Komt overeen met het rooster uit het leesprofiel eerder in de unit.
  fr.a1.unit45.lesson06.teach.mathieu_c_est:
    title: Mathieu reageert
    gloss: 'Mathieu: Dat is vroeg! Ik begin later, om elf uur.'
    note: Komt overeen met Mathieus starttijd die eerder in de unit is genoemd.
  fr.a1.unit45.lesson06.teach.camille_chaque_metier:
    title: Camille sluit het onderwerp af
    gloss: 'Camille: Elk beroep heeft zijn eigen ritme, denk ik.'
    note: 'Een natuurlijke, bespiegelende afsluiting: herken de betekenis, je hoeft de zin niet precies te kunnen herhalen.'
