answer_policy:
  diacritics: 'Teach and display standard French accents and the cedilla. For free-typed A1 answers, accept otherwise-correct forms without diacritics, including ca for ça, tres for très, and enchante for enchanté. This leniency does not erase meaningful letters: masculine enchanté and feminine enchantée remain distinct through the final e even when accents are omitted.'
  apostrophes: Accept straight and typographic apostrophes interchangeably. Require the apostrophe when an exercise specifically tests elision, such as j’habite; do not accept jhabite in that exercise.
  hyphens: Teach the standard hyphens in inverted questions such as allez-vous and vas-tu. In free transcription exercises, accept an otherwise-correct spaced version at A1, but retain the hyphenated form as the model answer.
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of French spacing before question or exclamation marks. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
course:
  title: Frans A1
  description: 'Frans voor beginners om vrijetijdsbesteding te beschrijven: hobbywoorden, uitdrukkingen voor frequentie, vragen en antwoorden wat iemand in zijn vrije tijd doet, en de hobby''s van twee mensen vergelijken.'
units:
  fr.a1.unit52.loisirs:
    title: Hobby's en vrije tijd
lessons:
  fr.a1.unit52.lesson01.lire_faire_du_sport:
    title: Lezen, sporten en koken
  fr.a1.unit52.lesson02.musique_dessin_et_jeux:
    title: Muziek, tekenen en gamen
  fr.a1.unit52.lesson03.qu_est_ce_que:
    title: Wat doe je in je vrije tijd?
  fr.a1.unit52.lesson04.camille_et_mathieu_parlent:
    title: Camille en Mathieu praten over hobby's
  fr.a1.unit52.lesson05.mathieu_et_camille_comparent:
    title: Mathieu en Camille vergelijken hun hobby's
  fr.a1.unit52.lesson06.planifier_un_week_end:
    title: Samen een weekend plannen
teaching:
  fr.a1.unit52.lesson01.teach.lire_faire_du:
    title: Lezen, sporten, koken
    gloss: lezen, sporten, koken
    note: 'Drie veelvoorkomende hobbywerkwoorden: *lire* (lezen), *faire du sport* (sporten) en *cuisiner* (koken).'
    example_gloss:
    - Ik lees graag een boek.
    - Ik sport op zaterdag.
    - Ik kook graag voor vrienden.
  fr.a1.unit52.lesson01.teach.le_temps_libre:
    title: Vrije tijd
    gloss: vrije tijd
    note: '*Temps libre* is mannelijk: *le temps libre*. Het is de kernuitdrukking om over hobby''s te praten.'
    example_gloss: In mijn vrije tijd lees ik graag.
  fr.a1.unit52.lesson01.teach.pendant_mon_temps:
    title: Zeggen wat je in je vrije tijd doet
    gloss: In mijn vrije tijd lees ik graag.
    note: '*Lis* is de *je*-vorm van *lire* (lezen); de laatste *s* is stil.'
  fr.a1.unit52.lesson02.teach.ecouter_de_la:
    title: Muziek, tekenen, gamen
    gloss: naar muziek luisteren, tekenen, gamen
    note: 'Nog drie hobby''s: *écouter de la musique*, *dessiner* en *jouer aux jeux vidéo*. Bij spelletjes wordt *jouer à* + *les* tot *jouer aux*.'
    example_gloss:
    - Ik luister graag naar muziek.
    - Ik teken vaak.
    - Ik game graag met vrienden.
  fr.a1.unit52.lesson02.teach.j_aime_ecouter:
    title: Zeggen dat je graag naar muziek luistert
    gloss: Ik luister graag naar muziek.
    note: '*Écouter* krijgt zijn object direct, zonder extra woord: *écouter de la musique*.'
  fr.a1.unit52.lesson02.teach.j_aime_jouer:
    title: Zeggen dat je graag met vrienden gamet
    gloss: Ik game graag met vrienden.
    note: '*Avec des amis* (met vrienden) gebruikt *amis* uit les 1 opnieuw; *des* is het meervoudige onbepaalde lidwoord.'
  fr.a1.unit52.lesson03.teach.toujours_souvent_parfois:
    title: Altijd, vaak, soms, nooit
    gloss: altijd, vaak, soms, nooit
    note: De vier belangrijkste frequentiebijwoorden. *Souvent* ken je misschien al; *toujours*, *parfois* en *jamais* zijn nieuw. *Jamais* heeft *ne* voor het werkwoord nodig.
    example_gloss:
    - Ik sport altijd op zaterdag.
    - Ik lees vaak een boek.
    - Ik teken soms.
    - Ik game nooit.
  fr.a1.unit52.lesson03.teach.chaque_semaine_chaque:
    title: Elke week, elk weekend
    gloss: elke week, elk weekend
    note: '*Chaque semaine* en *chaque week-end* betekenen allebei ''elke''. *Chaque* verandert nooit, wat het geslacht van het zelfstandig naamwoord ook is.'
    example_gloss:
    - Ik kook elke week voor vrienden.
    - Ik sport elk weekend.
  fr.a1.unit52.lesson03.teach.chaque_ne_change:
    title: Chaque verandert nooit
    gloss: '*Chaque* blijft hetzelfde voor mannelijke en vrouwelijke woorden: *chaque semaine*, *chaque week-end*.'
    note: '*Semaine* is vrouwelijk en *week-end* is mannelijk, toch is *chaque* voor beide gelijk. Vergelijk *tous les* / *toutes les*, die wel veranderen.'
  fr.a1.unit52.lesson03.teach.qu_est_ce:
    title: Vragen naar vrije tijd
    gloss: Wat doe je in je vrije tijd?
    note: 'Dit is de kernvraag van deze unit: gebruik hem om iedereen naar zijn of haar hobby''s te vragen.'
  fr.a1.unit52.lesson04.teach.camille_on_se:
    title: Camille begint over hobby's
    gloss: 'Camille: We gaan vaak samen wandelen. Maar wat doe jij nog meer in je vrije tijd, Mathieu?'
    note: '*On se promène souvent* gebruikt *on* voor ''we'', en *souvent* staat direct na het werkwoord.'
  fr.a1.unit52.lesson04.teach.mathieu_j_aime:
    title: Mathieus hobby's
    gloss: 'Mathieu: Ik kook graag, ook thuis. En ik sport vaak.'
    note: '*Même à la maison* (zelfs thuis) maakt duidelijk dat Mathieu voor zijn plezier kookt, niet alleen voor zijn werk.'
  fr.a1.unit52.lesson04.teach.camille_tu_cuisines:
    title: Camille is verbaasd
    gloss: 'Camille: Kook je ook thuis? Je kookt al de hele dag op je werk!'
    note: '*Toute la journée* (de hele dag) benadrukt hoeveel Mathieu al op zijn werk kookt.'
  fr.a1.unit52.lesson04.teach.mathieu_oui_mais:
    title: Mathieu legt uit
    gloss: 'Mathieu: Ja, maar ik vind koken ontspannend. En jij, wat doe jij graag?'
    note: '*Cuisiner, je trouve ça relaxant* zet *cuisiner* voorop voor de nadruk: letterlijk ''koken, dat vind ik ontspannend''.'
  fr.a1.unit52.lesson04.teach.camille_j_aime:
    title: Camilles hobby's
    gloss: 'Camille: Ik lees graag en luister vaak naar muziek.'
    note: Combineert twee hobby's uit les 1 en 2 in één zin met *et* (en).
  fr.a1.unit52.lesson04.teach.mathieu_tu_joues:
    title: Mathieu vraagt naar gamen
    gloss: 'Mathieu: Game jij ook?'
    note: 'Een korte ja/nee-vraag: *Tu joues aussi aux jeux vidéo ?* Een stijgende intonatie maakt er een vraag van.'
  fr.a1.unit52.lesson04.teach.camille_non_je:
    title: Camille antwoordt
    gloss: 'Camille: Nee, ik game nooit. Maar ik teken soms!'
    note: '*Jamais* (nooit) en *parfois* (soms) uit les 3, samen in één antwoord tegenover elkaar gezet.'
  fr.a1.unit52.lesson05.teach.mathieu_et_moi:
    title: Hobby's vergelijken
    gloss: Mathieu en ik gaan vaak samen wandelen. Maar we hebben ook andere hobby's. Mathieu kookt graag, ook thuis, en sport vaak. Ik lees graag en luister vaak naar muziek. Ik teken soms, maar ik game nooit. Wat doe jij het liefst in je vrije tijd?
    note: Camilles bericht zet feiten uit een eerdere les op een rij en eindigt met de kernvraag van de unit aan de lezer.
    glosses:
      promène: wandelen
      souvent: vaak
      ensemble: samen
      d'autres: andere
      cuisiner: kookt
      aime: graag
      maison: thuis
      sport: sport
      lire: lees
      j'écoute: luister
      musique: muziek
      dessine: teken
      parfois: soms
      jeux: videogames spelen
      jamais: nooit
      libre: vrij
      temps: tijd
  fr.a1.unit52.lesson06.teach.mathieu_qu_est:
    title: Mathieu vraagt naar het weekend
    gloss: 'Mathieu: Wat doe je dit weekend?'
    note: Bij *ce week-end* (dit weekend) hoort *ce*, omdat *week-end* mannelijk is.
  fr.a1.unit52.lesson06.teach.camille_je_ne:
    title: Camille twijfelt
    gloss: 'Camille: Ik weet het nog niet. Ik lees graag, maar ik wil ook graag naar buiten.'
    note: '*Sortir* (uitgaan, naar buiten gaan) is een veelgebruikte manier om te zeggen dat je het huis uit wilt.'
  fr.a1.unit52.lesson06.teach.mathieu_on_se:
    title: Mathieu doet een voorstel
    gloss: 'Mathieu: Zullen we samen gaan wandelen? Daarna kook ik voor ons.'
    note: '*Après* (daarna) zet twee plannen op volgorde, net als *d''abord* en *ensuite*.'
  fr.a1.unit52.lesson06.teach.camille_bonne_idee:
    title: Camille stemt in
    gloss: 'Camille: Goed idee! Ik wandel net zo graag als ik kook.'
    note: '*Autant ... que* (even veel ... als) laat zien dat Camille van twee dingen evenveel houdt, niet meer van het ene dan van het andere.'
  fr.a1.unit52.lesson06.teach.mathieu_parfait_alors:
    title: Mathieu bevestigt
    gloss: 'Mathieu: Perfect. Dan zie ik je zaterdag!'
    note: Een vriendelijke slotzin die het plan voor *samedi* (zaterdag) bevestigt.
