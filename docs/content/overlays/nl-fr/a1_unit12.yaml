course:
  title: Frans A1
  description: 'Kort vertellen over een recente, afgeronde gebeurtenis in de passé composé, met zowel avoir als être als hulpwerkwoord. Het verhaal van Inès en Mathieu over de kookworkshop gaat verder: Mathieu vertelt over een misser tijdens de sessie van afgelopen zaterdag. Net als in het Nederlands (hebben/zijn) gebruikt het Frans twee hulpwerkwoorden: avoir voor de meeste werkwoorden en être voor een kleine groep, waaronder aller, arriver en rester. Het Franse voltooid deelwoord met être congrueert met het onderwerp (arrivé/arrivée), en dat doet het Nederlandse deelwoord niet.'
units:
  fr.a1.unit12.past_events:
    title: Wat is er gebeurd?
lessons:
  fr.a1.unit12.lesson01.passe_compose_avoir:
    title: De passé composé met avoir
  fr.a1.unit12.lesson02.passe_compose_etre:
    title: De passé composé met être
  fr.a1.unit12.lesson03.dialogue_atelier_dernier:
    title: De workshop van afgelopen zaterdag
teaching:
  fr.a1.unit12.lesson01.teach.jai_prepare:
    title: Ik heb bereid
    gloss: ik heb bereid / ik heb gemaakt
    note: 'Regelmatige werkwoorden op -ER vormen hun voltooid deelwoord op *-é*: *préparer* → *préparé*, met *avoir*.'
    example_gloss: Ik heb een taart gemaakt voor de workshop.
  fr.a1.unit12.lesson01.teach.jai_achete:
    title: Ik heb gekocht
    gloss: ik heb gekocht
    note: '*Acheter* volgt hetzelfde patroon als *préparer*: *avoir* + *-é*.'
    example_gloss: Ik heb groenten gekocht op de markt.
  fr.a1.unit12.lesson01.teach.jai_oublie:
    title: Ik ben vergeten
    gloss: ik ben vergeten
    note: '*Oublier* → *oublié*: opnieuw hetzelfde regelmatige patroon.'
    example_gloss: Ik ben de boter thuis vergeten!
  fr.a1.unit12.lesson01.teach.tu_as_aime:
    title: Je vond lekker
    gloss: je vond lekker / je hebt lekker gevonden
    note: '*Tu as* + deelwoord is de *tu*-vorm van dezelfde constructie met *avoir*.'
    example_gloss: Vond je de taart lekker?
  fr.a1.unit12.lesson01.teach.il_a_goute:
    title: Hij heeft geproefd
    gloss: hij heeft geproefd
    note: '*Il a* + deelwoord is de *il*-vorm: het hulpwerkwoord *avoir* verandert mee met het onderwerp, het deelwoord blijft gelijk.'
    example_gloss: Mathieu heeft de saus geproefd.
  fr.a1.unit12.lesson01.teach.grammar_avoir_participe:
    title: Avoir + voltooid deelwoord
    gloss: avoir + voltooid deelwoord (-é)
    note: De meeste Franse werkwoorden vormen de passé composé met *avoir* als hulpwerkwoord, plus een voltooid deelwoord dat bij regelmatige -ER-werkwoorden op *-é* eindigt.
  fr.a1.unit12.lesson01.teach.la_semaine_derniere:
    title: Vorige week
    gloss: vorige week
    note: '*Dernière* (vorige) congrueert met het vrouwelijke *semaine*; de mannelijke vorm is *dernier*, zoals in *samedi dernier* (afgelopen zaterdag).'
    example_gloss: Vorige week heb ik een taart gemaakt.
  fr.a1.unit12.lesson02.teach.je_suis_arrive:
    title: Ik ben aangekomen
    gloss: ik ben aangekomen
    note: '*Arriver* hoort bij een kleine groep werkwoorden (vooral van beweging) die *être* in plaats van *avoir* als hulpwerkwoord gebruiken.'
    example_gloss: Ik ben te laat aangekomen bij de workshop.
  fr.a1.unit12.lesson02.teach.je_suis_alle:
    title: Ik ben gegaan
    gloss: ik ben gegaan
    note: 'Ook *aller* gebruikt *être*. Het deelwoord congrueert met het onderwerp: *allé* (mannelijk) of *allée* (vrouwelijk, zoals Inès zou zeggen).'
    example_gloss: Ik ben voor de workshop naar de markt gegaan.
  fr.a1.unit12.lesson02.teach.il_est_reste:
    title: Hij is gebleven
    gloss: hij is gebleven
    note: '*Rester* (blijven) is nog een werkwoord met *être*, met hetzelfde congruentiepatroon.'
    example_gloss: Mathieu is gebleven om de keuken schoon te maken.
  fr.a1.unit12.lesson02.teach.grammar_etre_accord:
    title: Être + congruentie van het voltooid deelwoord
    gloss: être + voltooid deelwoord (congrueert met het onderwerp)
    note: Bij werkwoorden met *être* congrueert het voltooid deelwoord in geslacht en getal met het onderwerp, anders dan bij werkwoorden met *avoir*.
  fr.a1.unit12.lesson02.teach.en_retard:
    title: Laat
    gloss: laat
    note: '*En retard* geeft aan dat je na het verwachte tijdstip aankomt; het komt vaak voor bij *arriver*.'
    example_gloss: De bus is te laat aangekomen.
  fr.a1.unit12.lesson02.teach.finalement:
    title: Uiteindelijk
    gloss: uiteindelijk
    note: '*Finalement* rondt een kort verhaal af en geeft de uitkomst aan na eerdere problemen.'
    example_gloss: Uiteindelijk was de taart heerlijk.
  fr.a1.unit12.lesson02.teach.quest_ce_qui_sest_passe:
    title: Wat is er gebeurd?
    gloss: Wat is er gebeurd?
    note: '*Qu''est-ce qui s''est passé ?* is de standaardmanier om te vragen wat er gebeurd is.'
    example_gloss: Wat is er gebeurd tijdens de workshop?
  fr.a1.unit12.lesson03.teach.line01:
    title: Vragen wat er gebeurd is
    gloss: Inès vraagt wat er gebeurd is tijdens de workshop van afgelopen zaterdag; zij kon er niet bij zijn.
    note: '*Qu''est-ce qui s''est passé ?* (wat is er gebeurd?) is de standaardmanier om naar een gebeurtenis in het verleden te vragen.'
  fr.a1.unit12.lesson03.teach.line02:
    title: De misser navertellen
    gloss: 'Mathieu zegt: oei, hij kwam te laat en vergat de boter thuis!'
    note: 'Twee vormen van de passé composé in één zin: met *être* (*je suis arrivé*) en met *avoir* (*j''ai oublié*).'
  fr.a1.unit12.lesson03.teach.line03:
    title: Vragen wat hij deed
    gloss: Inès vraagt wat hij daarna deed.
    note: '*Qu''est-ce que tu as fait ?* (wat heb je gedaan?) gebruikt het onregelmatige voltooid deelwoord van *faire*.'
  fr.a1.unit12.lesson03.teach.line04:
    title: De oplossing beschrijven
    gloss: Mathieu zegt dat hij snel naar de buurtwinkel op de hoek is gegaan.
    note: In *l'épicerie du coin* (de buurtwinkel op de hoek) betekent *coin* 'hoek', zoals in *au coin de la rue*.
  fr.a1.unit12.lesson03.teach.line05:
    title: Vragen of het gelukt is
    gloss: Inès vraagt of hij daar boter heeft gevonden.
    note: '*Tu as trouvé... ?* (heb je ... gevonden?) is nog een gewone vraag met *avoir* als hulpwerkwoord.'
  fr.a1.unit12.lesson03.teach.line06:
    title: Het goede einde vertellen
    gloss: Mathieu zegt ja, en uiteindelijk was de taart heerlijk!
    note: Met *finalement* sluit hij het verhaal positief af en is de eerdere misser opgelost.
