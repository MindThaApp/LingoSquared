teaching:
  fr.a1.unit48.lesson01.teach.le_manteau_le:
    title: Jas, trui
    gloss: de jas, de trui
    note: '*Le manteau* en *le pull* zijn allebei mannelijk.'
    example_gloss:
    - Ik zoek een jas.
    - Ik heb een trui.
  fr.a1.unit48.lesson01.teach.le_pantalon_les:
    title: Broek, schoenen
    gloss: de broek, de schoenen
    note: '*Pantalon* is enkelvoud, net als Nederlands ''broek'': *un pantalon* is één broek. *Chaussures* is het meervoud van *chaussure*; schoenen noem je meestal in het meervoud.'
    example_gloss:
    - Ik zoek een broek.
    - Ik zoek schoenen.
  fr.a1.unit48.lesson01.teach.je_cherche_un:
    title: Zeggen wat je zoekt
    gloss: Ik zoek een jas.
    note: '*Chercher* (zoeken) heeft een direct object zonder voorzetsel, anders dan Nederlands ''zoeken naar'': *je cherche un manteau*.'
  fr.a1.unit48.lesson02.teach.la_taille:
    title: Maat
    gloss: de maat
    note: '*Taille* is vrouwelijk: *la taille*.'
    example_gloss: Welke maat heeft u?
  fr.a1.unit48.lesson02.teach.quelle_taille_faites:
    title: Naar de maat vragen
    gloss: Welke maat heb je?
    note: '*Quelle taille ?* gebruikt *quelle* (welke) omdat *taille* vrouwelijk is en er een beperkt aantal antwoorden mogelijk is (S, M, L of een getal).'
  fr.a1.unit48.lesson02.teach.je_fais_du:
    title: Je maat zeggen
    gloss: Ik heb maat M.
    note: '*Faire du M* betekent maat M hebben: het Frans gebruikt *faire* (maken, doen) waar wij ''hebben'' of ''zijn'' zeggen.'
  fr.a1.unit48.lesson03.teach.noir_bleu:
    title: Zwart, blauw
    gloss: zwart, blauw
    note: De twee basiskleuren in deze les.
    example_gloss:
    - Ik wil de jas in het zwart.
    - Hebt u dit ook in het blauw?
  fr.a1.unit48.lesson03.teach.je_veux_le:
    title: Een kleur vragen
    gloss: Ik wil de jas in het zwart.
    note: '*En* + kleur is de standaardmanier om de kleur van een kledingstuk aan te geven als je het bestelt of erom vraagt.'
  fr.a1.unit48.lesson03.teach.avez_vous_aussi:
    title: Naar een andere kleur vragen
    gloss: Hebt u dit ook in het blauw?
    note: '*Aussi* (ook) vraagt of er nog een andere kleur is, hier in de beleefdheidsvorm met *vous*.'
  fr.a1.unit48.lesson04.teach.est_ce_que:
    title: Vragen hoe het zit
    gloss: Past deze jas je?
    note: '*Aller* (gaan) is het gebruikelijke werkwoord voor hoe kleding zit of past: *il me va bien*, letterlijk ''hij gaat me goed''.'
  fr.a1.unit48.lesson04.teach.il_me_va:
    title: Zeggen dat het goed past
    gloss: Hij past goed.
    note: '*Bien* (goed) beschrijft hoe het kledingstuk zit.'
  fr.a1.unit48.lesson04.teach.c_est_trop:
    title: Te klein
    gloss: Het is te klein.
    note: '*Trop* (te) staat voor het bijvoeglijk naamwoord om overmaat uit te drukken.'
  fr.a1.unit48.lesson04.teach.c_est_trop_2:
    title: Te groot
    gloss: Het is te groot.
    note: Hetzelfde patroon *trop* + bijvoeglijk naamwoord als *trop petit* op de vorige kaart.
  fr.a1.unit48.lesson05.teach.quatre_vingt_dix:
    title: Negentig
    gloss: negentig
    note: '*Quatre-vingt-dix* is het getal 90 (letterlijk ''vier twintig tien''), hier gebruikt in de prijs van de jas.'
    example_gloss: De jas kost negentig euro.
  fr.a1.unit48.lesson05.teach.le_manteau_coute:
    title: Een prijs noemen
    gloss: De jas kost negentig euro.
    note: '*Coûte* is de *il*-vorm van *coûter* (kosten).'
  fr.a1.unit48.lesson05.teach.parka_taille_m:
    title: Een kassabon lezen
    gloss: 'Winterjas: maat M, kleur zwart. Prijs: negentig euro. Deze jas past goed en is warm.'
    note: Let op de maat, de kleur, de prijs en de twee eigenschappen die over de jas worden genoemd.
    glosses:
      Parka: winterjas
      taille: maat
      couleur: kleur
      noire: zwart
      Prix: prijs
      quatre-vingt-dix: negentig
      euros: euro
      manteau: jas
      va: past
      chaud: warm
  fr.a1.unit48.lesson06.teach.camille_ce_manteau:
    title: Camille ziet de jas
    gloss: 'Camille: Wat een mooie jas! Welke maat heb jij?'
    note: '*Joli* (mooi) is een algemene positieve reactie; het staat hier in de mannelijke vorm omdat het bij *manteau* hoort.'
  fr.a1.unit48.lesson06.teach.mathieu_je_fais:
    title: Mathieu vraagt of hij de jas mag passen
    gloss: 'Mathieu: Ik heb maat M. Mag ik hem passen?'
    note: '*Je peux ... ?* is de standaardmanier om toestemming te vragen; *l''essayer* betekent ''hem passen'', en *l''* staat voor de jas.'
  fr.a1.unit48.lesson06.teach.camille_bien_sur:
    title: Camille vraagt hoe de jas zit
    gloss: 'Camille: Natuurlijk. Past hij goed?'
    note: '*Il* (hij, het) verwijst naar *le manteau*, een mannelijk woord.'
  fr.a1.unit48.lesson06.teach.mathieu_oui_il:
    title: Mathieu bevestigt
    gloss: 'Mathieu: Ja, hij past goed en is warm.'
    note: 'Komt precies overeen met de kassabon die je eerder las: het is dezelfde jas.'
  fr.a1.unit48.lesson06.teach.camille_super_tu:
    title: Camille vraagt naar de kleur
    gloss: 'Camille: Super! Wil je hem in het zwart of in het blauw?'
    note: '*Tu le veux en ... ou en ... ?* biedt een keuze; *le* staat voor de jas.'
  fr.a1.unit48.lesson06.teach.mathieu_je_le:
    title: Mathieu beslist
    gloss: 'Mathieu: Ik neem hem in het zwart.'
    note: '*Prendre* (nemen) is het gebruikelijke werkwoord om je keuze bij een aankoop vast te leggen, passend bij de kleur op de bon.'
  fr.a1.unit48.lesson06.teach.on_ecrit_prends:
    title: Prends of prend
    gloss: '*Prends* is de ik-vorm en de jij-vorm van *prendre* (nemen); *prend* is de hij/zij-vorm.'
    note: 'Het patroon van *prendre*: *je prends, tu prends, il/elle prend*.'
