teaching:
  fr.a1.unit08.lesson01.teach.lundi:
    title: Maandag
    gloss: maandag
    note: Dagen van de week zijn mannelijk. Net als in het Nederlands schrijf je ze in het Frans met een kleine letter.
    example_gloss: De workshop komt nooit op maandag bijeen.
  fr.a1.unit08.lesson01.teach.samedi:
    title: Zaterdag
    gloss: zaterdag
    note: '*Le samedi* (met lidwoord) betekent ''op zaterdag'' als gewoonte, dus elke zaterdag. *Samedi* alleen betekent één specifieke zaterdag: de dichtstbijzijnde, aankomende of net voorbije, afhankelijk van de werkwoordstijd.'
    example_gloss: De workshop vindt op zaterdag plaats.
  fr.a1.unit08.lesson01.teach.dimanche:
    title: Zondag
    gloss: zondag
    note: 'Hetzelfde patroon als bij de andere dagen: mannelijk en met een kleine letter.'
    example_gloss: De bakkerij is op zondag gesloten.
  fr.a1.unit08.lesson01.teach.aujourdhui:
    title: Vandaag
    gloss: vandaag
    note: '*Aujourd''hui* is één vast woord, ook al lijkt het historisch uit meerdere delen te bestaan.'
    example_gloss: Vandaag is het zaterdag.
  fr.a1.unit08.lesson01.teach.demain:
    title: Morgen
    gloss: morgen
    note: '*Demain* is onveranderlijk en wordt in elke context op dezelfde manier gebruikt.'
    example_gloss: De apotheek gaat morgen open.
  fr.a1.unit08.lesson01.teach.hier:
    title: Gisteren
    gloss: gisteren
    note: '*Hier* is het directe tegenovergestelde van *demain*.'
    example_gloss: Ik heb gisteren vis gegeten.
  fr.a1.unit08.lesson01.teach.quel_jour_sommes_nous:
    title: Naar de dag vragen
    gloss: Welke dag is het?
    note: '*Quel jour sommes-nous ?* (letterlijk ''welke dag zijn we'') is de standaardmanier om te vragen welke dag van de week het is.'
  fr.a1.unit08.lesson02.teach.mars:
    title: Maart
    gloss: maart
    note: Maanden zijn, net als dagen, mannelijk. Net als in het Nederlands schrijf je ze in het Frans met een kleine letter.
    example_gloss: De workshop eindigt in maart.
  fr.a1.unit08.lesson02.teach.quelle_est_la_date:
    title: Naar de datum vragen
    gloss: Welke datum is het vandaag?
    note: '*Quelle est la date... ?* is de standaardmanier om naar een volledige datum te vragen, in tegenstelling tot *Quel jour sommes-nous ?*, waarmee je alleen naar de dag van de week vraagt.'
  fr.a1.unit08.lesson02.teach.cest_le_quinze_mars:
    title: Een datum noemen
    gloss: Het is 15 maart.
    note: '*Le* + hoofdtelwoord + maand is het standaardpatroon voor Franse data: *quinze* (vijftien), dus geen rangtelwoord als ''vijftiende''.'
  fr.a1.unit08.lesson02.teach.nous_sommes_le:
    title: De datum van vandaag zeggen
    gloss: Vandaag is het 15 maart.
    note: '*Nous sommes le...* is een even gebruikelijk alternatief voor *C''est le...* om de datum van vandaag te zeggen.'
  fr.a1.unit08.lesson02.teach.le_premier:
    title: De eerste (van de maand)
    gloss: de eerste
    note: '*Le premier* is de ENIGE uitzondering op de regel van het hoofdtelwoord: alle andere dagen van de maand gebruiken een gewoon hoofdtelwoord (*le deux*, *le trois*...), maar voor de eerste gebruik je het rangtelwoord *premier*.'
  fr.a1.unit08.lesson02.teach.le_vingt_deux:
    title: Een einddatum noemen
    gloss: De workshop eindigt op 22 maart.
    note: '*Se termine* (eindigt) is een wederkerend werkwoord; *vingt-deux* is een gewoon hoofdtelwoord, volgens dezelfde regel als *le quinze mars*.'
  fr.a1.unit08.lesson03.teach.line01:
    title: Vragen wanneer de laatste sessie is
    gloss: Inès vraagt wanneer de laatste sessie van de workshop is.
    note: '*C''est quand... ?* (wanneer is het) is een natuurlijke, eenvoudige manier om naar het tijdstip te vragen.'
  fr.a1.unit08.lesson03.teach.line02:
    title: De datum en de dag noemen
    gloss: Mathieu zegt 22 maart, denkt hij, een zaterdag.
    note: '*Un samedi* (een zaterdag, zonder *le*) geeft simpelweg aan op welke dag van de week die datum valt.'
  fr.a1.unit08.lesson03.teach.line03:
    title: Naar de datum vragen
    gloss: Inès vraagt welke datum het vandaag is.
    note: Dezelfde *Quelle est la date aujourd'hui ?* die je hebt geleerd om naar de datum te vragen.
  fr.a1.unit08.lesson03.teach.line04:
    title: De datum van vandaag en het tijdsverschil noemen
    gloss: Mathieu zegt dat het vandaag 15 maart is, dus over een week.
    note: '*Dans une semaine* (over een week) drukt een tijdsafstand vanaf vandaag uit.'
  fr.a1.unit08.lesson03.teach.line05:
    title: Reageren met een plan
    gloss: 'Inès zegt dat het perfect is: ze heeft tijd om een dessert voor de gelegenheid te maken.'
    note: '*J''ai le temps de* + infinitief (ik heb tijd om te) is een gebruikelijke manier om te zeggen dat er genoeg tijd is voor iets.'
  fr.a1.unit08.lesson03.teach.line06:
    title: Het plan bevestigen
    gloss: Mathieu zegt dat het een goed idee is en dat ze elkaar dan aanstaande zaterdag zien, de tweeëntwintigste.
    note: '*Samedi prochain* (aanstaande zaterdag) bevestigt de dagnaam en de datum samen en sluit het gesprek af.'
