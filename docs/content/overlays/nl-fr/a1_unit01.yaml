  fr.a1.unit01.lesson06.workshop_dialogue:
    title: Een eerste ontmoeting tijdens een workshop
teaching:
  fr.a1.unit01.lesson01.teach.bonjour:
    title: Neutrale begroeting
    gloss: hallo; goedendag; goedemorgen
    note: Bonjour kun je overdag veilig gebruiken bij onbekenden, collega's en vrienden. Anders dan hallo heeft het ook de betekenis van goedendag.
  fr.a1.unit01.lesson01.teach.salut:
    title: Informele begroeting
    gloss: hoi; doei
    note: Salut gebruik je in een informele relatie. Je kunt er een gesprek mee openen of afsluiten, maar het is niet de veiligste keuze bij een onbekende volwassene.
  fr.a1.unit01.lesson01.teach.au_revoir:
    title: Neutraal afscheid
    gloss: tot ziens
    note: Au revoir kan zowel in beleefde als in informele situaties.
  fr.a1.unit01.lesson01.teach.tu:
    title: Informeel 'je' (enkelvoud)
    gloss: jij; je (enkelvoud, informeel)
    note: 'Tu is net als het Nederlandse jij/je de informele aanspreekvorm: voor één vriend, kind of iemand met wie je expliciet op informele voet staat. Tu heeft eigen werkwoordsvormen.'
  fr.a1.unit01.lesson01.teach.vous:
    title: Beleefd 'u' of meervoud 'jullie'
    gloss: u; jullie (beleefd enkelvoud of meervoud)
    note: Vous is de veilige keuze voor één onbekende volwassene en ook de vorm voor een groep. Het lijkt dus op het Nederlandse u, maar vous dient tegelijk als meervoud (jullie).
  fr.a1.unit01.lesson01.teach.comment_allez_vous:
    title: Formele vraag naar iemands welzijn
    gloss: Hoe gaat het met u?
    note: Allez is de vous-vorm van aller. Werkwoord en voornaamwoord zijn omgedraaid en met een koppelteken verbonden. Dit is een vaste beleefde vraag en geen letterlijke vraag waar iemand naartoe gaat.
  fr.a1.unit01.lesson01.teach.comment_vas_tu:
    title: Informele vraag naar iemands welzijn
    gloss: Hoe gaat het met u?
    note: Vas is de tu-vorm van aller. Wordt de relatie informeel, dan verandert allez-vous in vas-tu, met een andere werkwoordsvorm.
  fr.a1.unit01.lesson01.teach.register_choice:
    title: Begroeting en relatie combineren
    gloss: Bonjour met vous; salut met tu
    note: Deze combinaties zijn handige standaardkeuzes, geen vaste wetten. Bonjour kun je ook bij vrienden gebruiken, maar salut met vous geeft meestal tegenstrijdige sociale signalen.
  fr.a1.unit01.lesson02.teach.je_mappelle:
    title: Je naam zeggen
    gloss: Ik heet Camille.
    note: Je m’appelle betekent letterlijk 'ik noem mezelf'. Het onderwerp je is in het Frans verplicht. De klinker van me valt weg voor appelle, waardoor m’appelle ontstaat.
  fr.a1.unit01.lesson02.teach.comment_appelez_vous:
    title: Beleefd naar een naam vragen
    gloss: Hoe heet u?
    note: 'Appelez is de vous-vorm van appeler. Het tweede vous staat achter het werkwoord, omdat de vraag met inversie is gevormd: vous appelez-vous.'
  fr.a1.unit01.lesson02.teach.tu_tappelles:
    title: Informeel naar een naam vragen
    gloss: Hoe heet u?
    note: T’appelles is de tu-vorm, met het wederkerend voornaamwoord te ingekort voor een klinker. In deze alledaagse vraag blijft tu voor het werkwoord staan en komt comment aan het eind.
  fr.a1.unit01.lesson02.teach.moi_cest:
    title: Jezelf voorstellen in gewone spreektaal
    gloss: Ik ben Noé.
    note: Moi, c’est is een idiomatische manier om jezelf in gesproken taal voor te stellen. Het klinkt natuurlijker dan een woordelijke vertaling van 'ik ben'.
  fr.a1.unit01.lesson02.teach.enchante:
    title: Mannelijke congruentie
    gloss: Aangenaam.
    note: Een mannelijke spreker schrijft normaal enchanté. Een Nederlands bijvoeglijk naamwoord als 'aangenaam' verandert niet met het geslacht van de spreker, maar dit Franse adjectief wel.
  fr.a1.unit01.lesson02.teach.enchantee:
    title: Vrouwelijke congruentie
    gloss: Aangenaam.
    note: Een vrouwelijke spreker schrijft normaal enchantée, met een extra e aan het eind. Enchanté en enchantée klinken meestal hetzelfde, dus het verschil is in schrift duidelijker dan in spraak.
  fr.a1.unit01.lesson02.teach.et_vous:
    title: De beleefde vraag teruggeven
    gloss: En u?
    note: Gebruik vous om beleefd te blijven of om een groep aan te spreken.
  fr.a1.unit01.lesson02.teach.et_toi:
    title: De informele vraag teruggeven
    gloss: En u?
    note: Toi is de beklemtoonde vorm die bij tu hoort. Na et gebruikt het Frans toi, niet tu.
  fr.a1.unit01.lesson03.teach.elision_jhabite:
    title: Elisie voor een klinker
    gloss: ik woon
    note: 'Je verliest zijn klinker voor habite, en de apostrof geeft die elisie weer: j’habite. De h in habiter belet de elisie niet.'
  fr.a1.unit01.lesson03.teach.liaison_vous_etes:
    title: Liaison na vous
    gloss: u bent; jullie zijn
    note: 'De s aan het eind van vous is normaal stil, maar voor de klinker van êtes wordt hij als z uitgesproken: vous êtes klinkt ongeveer als voe-ZÈT. De liaison hoort bij de gesproken zin, niet bij de spelling.'
  fr.a1.unit01.lesson03.teach.liaison_un_atelier:
    title: Liaison na un
    gloss: een workshop
    note: De n aan het eind van un wordt aan atelier vastgemaakt. Vermijd een harde pauze tussen de twee woorden.
  fr.a1.unit01.lesson03.teach.final_e_enchante:
    title: Mannelijke spelling
    gloss: aangenaam (mannelijke spreker)
    note: Enchanté eindigt op é bij een mannelijke spreker. De -an- is een neusklinker, spreek dus geen aparte n uit zoals je dat in het Nederlands zou doen.
  fr.a1.unit01.lesson03.teach.final_e_enchantee:
    title: Vrouwelijke spelling
    gloss: aangenaam (vrouwelijke spreker)
    note: Enchantée krijgt een e voor de vrouwelijke vorm, maar die extra e voegt normaal geen extra uitgesproken lettergreep toe.
  fr.a1.unit01.lesson03.teach.question_liaison:
    title: Een vraag met inversie lezen
    gloss: Hoe gaat het met u?
    note: Lees allez-vous als één vraageenheid aan elkaar. De geschreven z in allez wordt hier niet als extra z-klank uitgesproken; de standaarduitspraak is ongeveer a-LÈ voe.
  fr.a1.unit01.lesson04.teach.ca_va:
    title: Alledaagse vraag naar hoe het gaat
    gloss: Hoe gaat het?; Gaat het goed?
    note: Ça bevat een cedille, waardoor de c voor a als s klinkt. Dezelfde uitdrukking kan een vraag of een antwoord zijn, afhankelijk van de intonatie.
  fr.a1.unit01.lesson04.teach.tres_bien:
    title: Heel positief antwoord
    gloss: Heel goed, dank je.
    note: Très versterkt bien. De s aan het eind is stil.
  fr.a1.unit01.lesson04.teach.ca_va_bien:
    title: Positief antwoord
    gloss: Het gaat goed.
    note: In dit vaste antwoord gebruikt het Frans geen woord dat rechtstreeks overeenkomt met 'ik'.
  fr.a1.unit01.lesson04.teach.pas_mal:
    title: Matig positief antwoord
    gloss: Niet slecht.
    note: Pas mal is vaak licht positief, net als het Nederlandse 'niet slecht'.
  fr.a1.unit01.lesson04.teach.fatigue:
    title: Mannelijke congruentie van het adjectief
    gloss: Ik ben een beetje moe.
    note: Suis is de je-vorm van être. Een mannelijke spreker schrijft fatigué. Het Nederlandse 'moe' verandert niet met het geslacht van de spreker.
  fr.a1.unit01.lesson04.teach.fatiguee:
    title: Vrouwelijke congruentie van het adjectief
    gloss: Ik ben een beetje moe.
    note: Een vrouwelijke spreker schrijft fatiguée met een extra e aan het eind. De mannelijke en vrouwelijke vorm klinken normaal hetzelfde.
  fr.a1.unit01.lesson04.teach.et_vous:
    title: De vraag beleefd teruggeven
    gloss: En u?
    note: Vous behoudt het respectvolle register dat je bij een onbekende volwassene gebruikt.
  fr.a1.unit01.lesson04.teach.et_toi:
    title: De vraag informeel teruggeven
    gloss: En u?
    note: Gebruik toi na et als je informeel tegen één vriend of leeftijdgenoot praat.
  fr.a1.unit01.lesson05.teach.here_for_workshop:
    title: Het doel van iemand bevestigen
    gloss: Bent u hier voor de workshop?
    note: Êtes is de vous-vorm van être. Het Frans voegt geen hulpwerkwoord toe; stijgende intonatie maakt er een vraag van.
  fr.a1.unit01.lesson05.teach.yes_thats_it:
    title: Een veronderstelling bevestigen
    gloss: Ja, dat klopt.
    note: C’est ça is een natuurlijke bevestiging en geen letterlijke vertaling van 'het is dat'.
  fr.a1.unit01.lesson05.teach.live_neighborhood:
    title: Vragen waar iemand woont
    gloss: Woont u in de buurt?
    note: Habitez is de vous-vorm van habiter. Het Frans kan hier de woordvolgorde van een bewering houden en er met vragende intonatie een vraag van maken.
  fr.a1.unit01.lesson05.teach.i_live:
    title: Zeggen waar je woont
    gloss: Ik woon in Montreuil.
    note: J’habite is de je-vorm van habiter met elisie. À geeft een stad als plaats aan en mag niet worden verward met a, de werkwoordsvorm die 'heeft' betekent.
  fr.a1.unit01.lesson05.teach.from_here:
    title: Vragen of iemand hier vandaan komt
    gloss: Komt u hier vandaan?
    note: D’ici combineert de en ici door elisie. Êtes blijft de vous-vorm van être.
  fr.a1.unit01.lesson05.teach.from_lille:
    title: Je herkomst noemen
    gloss: Ik kom uit Lille.
    note: Suis is de je-vorm van être. Het Frans gebruikt de voor een stad als je zegt waar je vandaan komt.
  fr.a1.unit01.lesson05.teach.workshop_starts:
    title: De activiteit begint
    gloss: De workshop begint.
    note: Atelier is mannelijk, dus het lidwoord in het enkelvoud is le. Voor een klinker wordt le tot l’. Commence is de derde persoon enkelvoud.
  fr.a1.unit01.lesson05.teach.see_you_shortly:
    title: Afscheid voor even
    gloss: tot straks; tot later vandaag
    note: À tout à l’heure houdt in dat je elkaar later dezelfde dag weer ziet, anders dan een algemeen afscheid zonder verwacht tijdstip.
  fr.a1.unit01.lesson06.teach.line01:
    title: Het gesprek openen
    gloss: Inès begroet Mathieu en vraagt of hij er is voor de kookworkshop.
    note: De sprekers beginnen met vous omdat ze onbekende volwassenen voor elkaar zijn.
  fr.a1.unit01.lesson06.teach.line02:
    title: Het gesprek openen, antwoord
    gloss: Mathieu bevestigt en noemt zijn naam, en vraagt dan naar de hare.
    note: Je m’appelle is de standaardmanier om je naam te zeggen.
  fr.a1.unit01.lesson06.teach.line03:
    title: Namen uitwisselen
    gloss: Inès noemt haar naam en zegt dat ze het aangenaam vindt kennis te maken.
    note: Enchantée congrueert met Inès (vrouwelijk); de uitgang -e wordt geschreven maar is normaal niet hoorbaar.
  fr.a1.unit01.lesson06.teach.line04:
    title: Namen uitwisselen, antwoord
    gloss: Mathieu zegt hetzelfde terug en vraagt of ze in de buurt woont.
    note: 'Enchanté congrueert met Mathieu (mannelijk): hetzelfde woord als dat van Inès, maar zonder de stille -e.'
  fr.a1.unit01.lesson06.teach.line05:
    title: Informatie over de buurt uitwisselen
    gloss: Inès bevestigt en noemt haar straat, en stelt Mathieu dan dezelfde vraag.
    note: Bij J’habite plus een straatnaam staat geen voorzetsel voor rue.
  fr.a1.unit01.lesson06.teach.line06:
    title: Informatie over de buurt uitwisselen, antwoord
    gloss: Mathieu zegt dat hij in Saint-Ouen woont en vraagt of zij oorspronkelijk van hier is.
    note: J’habite à gebruikt à voor een plaatsnaam, anders dan de straatuitdrukking die Inès net gebruikte.
  fr.a1.unit01.lesson06.teach.line07:
    title: Herkomst uitwisselen
    gloss: Inès zegt dat ze er niet vandaan komt maar uit Lille, en vraagt het dan aan Mathieu.
    note: Je suis de + een stad geeft aan waar iemand vandaan komt.
  fr.a1.unit01.lesson06.teach.line08:
    title: Herkomst uitwisselen, antwoord
    gloss: Mathieu zegt dat hij uit Lyon komt.
    note: Hetzelfde patroon met je suis de als Inès net gebruikte.
  fr.a1.unit01.lesson06.teach.line09:
    title: Het gesprek onderbreken
    gloss: Inès merkt dat de workshop begint en zegt dat ze hem straks weer ziet.
    note: À tout à l’heure past hier, omdat beiden op hetzelfde evenement blijven.
  fr.a1.unit01.lesson06.teach.line10:
    title: Het gesprek onderbreken, antwoord
    gloss: Mathieu herhaalt hetzelfde afscheid.
    note: À tout à l’heure terugzeggen is de natuurlijke manier om het af te spreken.
