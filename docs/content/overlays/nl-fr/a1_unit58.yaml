    title: Wie studeert wat?
    gloss: Thomas werkt niet alleen, hij studeert ook. Hij volgt een cursus Spaans aan de volksuniversiteit. Hij leert elke week nieuwe woorden. Léa volgt een opleiding aan de hogeschool. Ze studeert daar gezondheidszorg. Allebei studeren ze graag. En jij, wat studeer jij, of wat zou je graag willen leren?
    note: Vergelijkt de studie van Thomas en die van Léa, naar het voorbeeld van de vergelijkende leestekst in de technologie-unit.
