teaching:
  fr.a1.unit43.lesson01.teach.le_billet:
    title: Het toegangskaartje
    gloss: het toegangskaartje
    note: '*Billet* is mannelijk: *le billet*, *un billet*.'
    example_gloss: Ik wil graag een kaartje naar Lyon.
  fr.a1.unit43.lesson01.teach.je_voudrais_un:
    title: Om een kaartje vragen
    gloss: Ik wil graag een kaartje naar Lyon.
    note: '*Je voudrais* maakt een verzoek zachter; het is beleefder dan *je veux*.'
  fr.a1.unit43.lesson01.teach.voulez_vous_un:
    title: De medewerker vraagt welk soort kaartje
    gloss: Wilt u een enkele reis of een retour?
    note: '*Voulez-vous* is de formele *vous*-vorm van *vouloir*, hier gebruikt voor een onbekende medewerker van het station.'
  fr.a1.unit43.lesson01.teach.un_aller_retour:
    title: Beleefd antwoorden
    gloss: Een retour, alstublieft.
    note: '*S''il vous plaît* is het formele alstublieft, passend bij het *vous*-register van dit gesprek.'
  fr.a1.unit43.lesson01.teach.au_guichet_on:
    title: Taalregister aan het loket
    gloss: Aan het loket gebruik je meestal de beleefdheidsvorm *vous*.
    note: Onbekenden in een dienstverlenende rol spreek je aan met *vous*; vrienden en familie met *tu*.
  fr.a1.unit43.lesson02.teach.le_quai:
    title: Het perron
    gloss: het perron
    note: '*Quai* is mannelijk: *le quai*.'
    example_gloss: Van welk perron vertrekt de trein naar Lyon?
  fr.a1.unit43.lesson02.teach.de_quel_quai:
    title: Vragen naar het perron
    gloss: Van welk perron vertrekt de trein naar Lyon?
    note: '*De quel quai* vraagt specifiek naar het perron; *quel* is mannelijk, net als het woord *quai*.'
  fr.a1.unit43.lesson02.teach.le_train_part:
    title: Vertrekgegevens noemen
    gloss: De trein vertrekt om kwart voor tien van perron vijf.
    note: '*Dix heures moins le quart* betekent kwart voor tien: in het Frans zeg je *moins* (min) voor tijden vóór het hele uur.'
  fr.a1.unit43.lesson02.teach.a_quelle_heure:
    title: Naar de aankomsttijd vragen
    gloss: Hoe laat komt de trein aan?
    note: '*À quelle heure arrive ... ?* vraagt naar de tijd; *arriver* is een regelmatig werkwoord op *-er*: *le train arrive*.'
  fr.a1.unit43.lesson02.teach.le_train_arrive:
    title: De aankomsttijd noemen
    gloss: De trein komt om elf uur aan.
    note: '*Arrive* is de *il/elle*-vorm van *arriver*; werkwoorden op *-er* eindigen op *-e* bij *il* en *elle*.'
  fr.a1.unit43.lesson03.teach.a_l_heure:
    title: Op tijd / de vertraging
    gloss: op tijd; de vertraging
    note: '*À l''heure* is een vaste uitdrukking voor iets dat volgens schema gebeurt. *Le retard* (de vertraging) is mannelijk.'
    example_gloss:
    - De trein vertrekt niet op tijd.
    - 'Let op: de trein naar Lyon heeft vertraging.'
  fr.a1.unit43.lesson03.teach.attention_le_train:
    title: Een omroepbericht
    gloss: 'Let op: de trein naar Lyon heeft vertraging.'
    note: '*Attention* opent een omroepbericht op het station, zoals in het Nederlands "Attentie, reizigers".'
  fr.a1.unit43.lesson03.teach.le_train_ne:
    title: '"Op tijd" ontkennen'
    gloss: De trein vertrekt niet op tijd.
    note: '*Ne ... pas* staat om het werkwoord heen: *ne part pas à l''heure*.'
  fr.a1.unit43.lesson03.teach.le_train_part:
    title: Een perronwijziging
    gloss: De trein vertrekt van perron drie in plaats van perron vijf.
    note: '*Au lieu du* betekent ''in plaats van het''; *de* + *le* worden samengetrokken tot *du*.'
  fr.a1.unit43.lesson03.teach.le_train_a:
    title: De duur van de vertraging noemen
    gloss: De trein heeft tien minuten vertraging.
    note: '*A ... de retard* (letterlijk ''heeft ... aan vertraging'') is de natuurlijke manier om te zeggen dat iets te laat is; het gebruikt *avoir*.'
  fr.a1.unit43.lesson04.teach.l_entree_la:
    title: Ingang, uitgang, wachtkamer
    gloss: de ingang; de uitgang; de wachtkamer
    note: '*L''entrée* verliest de *e* in *l''* voor een klinker; *la sortie* en *la salle d''attente* zijn vrouwelijk.'
    example_gloss:
    - Waar is de ingang?
    - Waar is de uitgang?
    - Waar is de wachtkamer?
  fr.a1.unit43.lesson04.teach.ou_est_le:
    title: Vragen waar een perron is
    gloss: Waar is perron zeven?
    note: '*Où est ... ?* vraagt waar iets is; *le quai sept* is mannelijk.'
  fr.a1.unit43.lesson04.teach.tout_droit_puis:
    title: De weg wijzen
    gloss: Rechtdoor en dan rechts.
    note: '*Tout droit* en *à droite* zijn de richtingwoorden; *à* staat voor *droite*.'
  fr.a1.unit43.lesson04.teach.ou_est_la:
    title: Vragen naar de wachtkamer
    gloss: Waar is de wachtkamer?
    note: Hetzelfde vraagpatroon, nu voor een nieuwe plek.
  fr.a1.unit43.lesson05.teach.billet_paris_gare:
    title: Een gedrukt kaartje lezen
    gloss: 'Kaartje: Paris Gare de Lyon naar Lyon Part-Dieu. Vertrek: tien over tien, perron zeven. Aankomst: tien voor elf. Retour. Prijs: twaalf euro veertig.'
    note: Let op de vertrektijd en het perron, de aankomsttijd, het soort kaartje en de prijs.
    glosses:
      Billet: kaartje
      Départ: vertrek
      dix: tien
      quai: perron
      sept: zeven
      Arrivée: aankomst
      onze: elf
      Aller-retour: retour
      Prix: prijs
      douze: twaalf
      euros: euro
      quarante: veertig
  fr.a1.unit43.lesson06.teach.mathieu_on_doit:
    title: Mathieu legt het plan uit
    gloss: 'Mathieu: We moeten naar perron zeven. De trein vertrekt om tien over tien.'
    note: '*On doit* (van *devoir*) drukt hier een praktische noodzaak uit, geen strikte verplichting.'
  fr.a1.unit43.lesson06.teach.camille_regarde_voila:
    title: Camille leest het bord
    gloss: 'Camille: Kijk, daar is het bord: vertraging, tien minuten.'
    note: '*Voilà* wijst aan wat er is: *voilà le panneau*.'
  fr.a1.unit43.lesson06.teach.mathieu_pas_de:
    title: Mathieu blijft kalm
    gloss: 'Mathieu: Geen probleem, we hebben nog tijd voor een kop koffie.'
    note: '*Pas de problème* is een veelgebruikte, informele geruststelling.'
  fr.a1.unit43.lesson06.teach.camille_bonne_idee:
    title: De trein komt aan
    gloss: 'Camille: Goed idee. Oh, daar is de trein al. Perron zeven, precies!'
    note: '*Déjà* (al) geeft aan dat de trein eerder kwam dan verwacht, gezien de net omgeroepen vertraging.'
  fr.a1.unit43.lesson06.teach.mathieu_allez_on:
    title: Ze stappen in de trein
    gloss: 'Mathieu: Kom, we stappen in. Lyon, we komen eraan!'
    note: '*On* is een alledaags *we* dat met de *il*-vorm van het werkwoord gebruikt wordt: *on monte*. *On arrive !* is de natuurlijke manier om ''we komen eraan'' te zeggen; een woordelijke vertaling klinkt vreemd.'
