answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Frans A1
  description: Woordenschat voor de naaste en verdere familie, het systeem van bezittelijke voornaamwoorden mon/ma/mes en het beschrijven van een gezin, in het vervolg van het kookworkshopverhaal van Inès en Mathieu uit unit 01-02. In het Nederlands blijft 'mijn' altijd gelijk, maar in het Frans richt het bezittelijk voornaamwoord zich naar het geslacht en getal van het zelfstandig naamwoord, niet naar de bezitter.
units:
  fr.a1.unit03.family:
    title: De families van Inès en Mathieu
lessons:
  fr.a1.unit03.lesson01.immediate_family:
    title: Naaste familie
  fr.a1.unit03.lesson02.possessives_mon_ma_mes:
    title: 'Bezittelijke voornaamwoorden: mon, ma, mes'
  fr.a1.unit03.lesson03.extended_family:
    title: Verdere familie
  fr.a1.unit03.lesson04.describing_family_size:
    title: Hoeveel mensen zijn er thuis
  fr.a1.unit03.lesson05.reading_a_family_profile:
    title: Een familieprofiel lezen
  fr.a1.unit03.lesson06.family_photos_dialogue:
    title: Familiefoto's met Inès en Mathieu
teaching:
  fr.a1.unit03.lesson01.teach.mere:
    title: Moeder
    gloss: moeder
    note: '*Mère* is vrouwelijk. *Maman* is het gewonere woord binnen de familie, terwijl *mère* neutraal is en in de woordenlijsten van deze cursus wordt gebruikt.'
  fr.a1.unit03.lesson01.teach.pere:
    title: Vader
    gloss: vader
    note: '*Père* is mannelijk. *Papa* is het alledaagse equivalent, parallel aan *mère*/*maman*.'
  fr.a1.unit03.lesson01.teach.frere:
    title: Broer
    gloss: broer
    note: '*Frère* is mannelijk enkelvoud.'
  fr.a1.unit03.lesson01.teach.soeur:
    title: Zus
    gloss: zus
    note: '*Sœur* is vrouwelijk enkelvoud. De ligatuur œ is in de Franse spelling één letter, niet twee losse letters.'
  fr.a1.unit03.lesson01.teach.fils:
    title: Zoon
    gloss: zoon
    note: '*Fils* is mannelijk. Let op: de slot-s wordt hier juist wel uitgesproken (een uitzondering), terwijl de l stom is.'
  fr.a1.unit03.lesson01.teach.fille:
    title: Dochter
    gloss: dochter
    note: '*Fille* is vrouwelijk enkelvoud; hetzelfde woord betekent in andere contexten ook "meisje".'
  fr.a1.unit03.lesson01.teach.parents:
    title: Parents
    gloss: ouders
    note: '*Parents* is mannelijk meervoud en slaat op een vader en moeder samen.'
  fr.a1.unit03.lesson01.teach.freres_et_soeurs:
    title: Broers en zussen
    gloss: broers en zussen
    note: 'Het Frans heeft geen enkel los, genderneutraal woord voor "broers en zussen": *frères et sœurs* noemt beide expliciet.'
  fr.a1.unit03.lesson02.teach.ma_mere:
    title: Mijn moeder
    gloss: mijn moeder
    note: '*Ma* is het vrouwelijke enkelvoudige bezittelijk voornaamwoord "mijn", gebruikt omdat *mère* vrouwelijk is.'
  fr.a1.unit03.lesson02.teach.mon_pere:
    title: Mijn vader
    gloss: mijn vader
    note: '*Mon* is het mannelijke enkelvoudige bezittelijk voornaamwoord "mijn", gebruikt omdat *père* mannelijk is.'
  fr.a1.unit03.lesson02.teach.mes_freres_et_soeurs:
    title: Mijn broers en zussen
    gloss: mijn broers en zussen
    note: '*Mes* is het meervoudige bezittelijk voornaamwoord "mijn", dat je bij elk meervoudig zelfstandig naamwoord gebruikt, ongeacht het geslacht. Het volgt hetzelfde principe als *ma*/*mon*, maar dan op basis van getal in plaats van geslacht.'
  fr.a1.unit03.lesson02.teach.as_tu_des_freres_et_soeurs:
    title: Vragen naar broers en zussen
    gloss: Heb je broers of zussen?
    note: '*As-tu* is de vraagvorm met inversie van *tu as* (jij hebt), een veelgebruikt vraagpatroon op A1-niveau.'
  fr.a1.unit03.lesson02.teach.jai_deux_soeurs:
    title: Het aantal broers en zussen noemen
    gloss: Ik heb twee zussen.
    note: '*J''ai* (ik heb) met een getal en een familiewoord is de standaardmanier om je broers en zussen te beschrijven.'
  fr.a1.unit03.lesson02.teach.ta_famille_est_grande:
    title: Vragen of een familie groot is
    gloss: Is jouw familie groot?
    note: '*Ta* is het vrouwelijke enkelvoudige informele bezittelijk voornaamwoord "jouw", dat past bij het vrouwelijke woord *famille*.'
  fr.a1.unit03.lesson02.teach.ma_famille_est_petite:
    title: Een kleine familie beschrijven
    gloss: Mijn familie is klein.
    note: '*Petite* congrueert met het vrouwelijke woord *famille*; bij een mannelijk zelfstandig naamwoord staat *petit*. Dit is een andere soort overeenkomst dan bij *mon*/*ma*/*mes*: die passen zich ook aan het zelfstandig naamwoord aan, maar geven BEZIT aan, terwijl petite een eigenschap beschrijft.'
  fr.a1.unit03.lesson03.teach.grand_pere:
    title: Grootvader
    gloss: opa
    note: '*Grand-père* is een samenstelling met koppelteken en is mannelijk.'
  fr.a1.unit03.lesson03.teach.grand_mere:
    title: Grootmoeder
    gloss: oma
    note: '*Grand-mère* is een samenstelling met koppelteken en is vrouwelijk. Let op: *grand-* blijft hier gelijk en wordt dus geen *grande-mère*.'
  fr.a1.unit03.lesson03.teach.grands_parents:
    title: Grootouders
    gloss: grootouders
    note: Bij *grands-parents* staan beide delen van de samenstelling in het meervoud (*grands*, niet *grand-*). Bij *grand-mère* en *grand-père* krijgt het deel *grand-* in het enkelvoud geen meervoud.
  fr.a1.unit03.lesson03.teach.oncle:
    title: Oom
    gloss: oom
    note: '*Oncle* is mannelijk.'
  fr.a1.unit03.lesson03.teach.tante:
    title: Tante
    gloss: tante
    note: '*Tante* is vrouwelijk.'
  fr.a1.unit03.lesson03.teach.cousin:
    title: Neef
    gloss: neef
    note: '*Cousin* is mannelijk enkelvoud; het Frans geeft bij een neef of nicht het geslacht aan: cousin (neef) tegenover cousine (nicht).'
  fr.a1.unit03.lesson03.teach.cousine:
    title: Nicht
    gloss: nicht
    note: '*Cousine* is vrouwelijk enkelvoud, gevormd door -e aan *cousin* toe te voegen.'
  fr.a1.unit03.lesson03.teach.mes_grands_parents:
    title: Mijn grootouders
    gloss: mijn grootouders
    note: '*Mes* wordt gebruikt omdat *grands-parents* meervoud is, ook al bestaat de groep uit een grootvader en een grootmoeder.'
  fr.a1.unit03.lesson04.teach.combien_de_freres_et_soeurs:
    title: Vragen hoeveel broers en zussen iemand heeft
    gloss: Hoeveel broers en zussen heb je?
    note: '*Combien de* (hoeveel) staat in het Frans direct voor het zelfstandig naamwoord, zonder hulpwerkwoord zoals Nederlands "doen" of "hebben" ervoor te zetten.'
  fr.a1.unit03.lesson04.teach.on_est_cinq:
    title: Zeggen hoeveel mensen er thuis wonen
    gloss: We zijn thuis met zes.
    note: '*On est* (letterlijk "men is", maar in de praktijk "wij zijn") is in gesproken Frans de gewone, heel gangbare manier om te zeggen hoeveel mensen er thuis wonen. *Nous sommes* klinkt formeler en schrijftaliger.'
  fr.a1.unit03.lesson04.teach.ma_famille_est_grande:
    title: Een grote familie beschrijven
    gloss: Mijn familie is groot.
    note: '*Grande* congrueert met het vrouwelijke woord *famille*; bij een mannelijk zelfstandig naamwoord staat *grand*.'
  fr.a1.unit03.lesson04.teach.jai_beaucoup_de_cousins:
    title: Zeggen dat je veel neven en nichten hebt
    gloss: Ik heb veel neven en nichten.
    note: '*Beaucoup de* (veel) staat voor het zelfstandig naamwoord; *de* wordt hier geen *du*/*des*, omdat *beaucoup* de hoeveelheid al aangeeft.'
  fr.a1.unit03.lesson04.teach.tu_habites_pres_de_tes_parents:
    title: Vragen of iemand dicht bij zijn ouders woont
    gloss: Woon je dicht bij je ouders?
    note: '*Tes* is het meervoudige informele bezittelijk voornaamwoord "jouw", nodig omdat *parents* meervoud is.'
  fr.a1.unit03.lesson04.teach.jhabite_avec_mes_grands_parents:
    title: Zeggen met wie je samenwoont
    gloss: Ik woon bij mijn grootouders.
    note: '*Avec* (met) geeft aan met wie iemand woont; *j''habite* is de *je*-vorm van *habiter*, die je al kent van *j''habite à Montreuil* in Unit 1.'
  fr.a1.unit03.lesson05.teach.profile_reading:
    title: Het familieprofiel van Inès
    gloss: 'Ik heet Inès. Ik ben eenendertig en ik woon met mijn grootouders in Parijs. Mijn moeder en vader wonen in Lille. Ik heb twee zussen en een broer: we zijn thuis met zes. Mijn jongere zus heet Camille en ze is twintig.'
    note: Dit profiel gebruikt woordenschat en zinspatronen uit les 1 tot 4 in een samenhangende korte tekst in plaats van losse zinnen. Het oefent dezelfde leesvaardigheid (wie is wie) als de leestoets van deze unit.
    glosses:
      trente: dertig
      ans: jaar oud
      grands-parents: grootouders
      mère: moeder
      père: vader
      habitent: wonen (van habiter)
      deux: twee
      sœurs: zussen
      frère: broer
      six: zes
      maison: thuis
      petite: jongere / kleine
      sœur: zus
      vingt: twintig
  fr.a1.unit03.lesson05.teach.petite_soeur:
    title: Jongere/kleine zus
    gloss: jongere zus; kleine zus
    note: '*Petite* (vrouwelijk van *petit*) staat hier voor het zelfstandig naamwoord, zoals de meeste korte, veelgebruikte Franse bijvoeglijke naamwoorden. De meeste andere bijvoeglijke naamwoorden staan erachter.'
  fr.a1.unit03.lesson05.teach.habite_third_person:
    title: Woont (derde persoon)
    gloss: woont
    note: '*Habite* is de derde persoon enkelvoud van *habiter*, die je gebruikt om OVER iemand te praten (*Inès habite...*), in plaats van als de persoon zelf (*j''habite*, uit Unit 1 en les 4 van deze unit).'
  fr.a1.unit03.lesson05.teach.ses_third_person_plural:
    title: Haar/zijn/hun (met meervoud)
    gloss: haar/zijn/hun
    note: '*Ses* is het meervoud van *sa*/*son*, en wordt op dezelfde manier gebruikt als *sa*/*son* voor "zijn/haar" bij een enkelvoudig zelfstandig naamwoord -- *ses grands-parents* betekent "haar grootouders" als je over Inès in de derde persoon praat.'
  fr.a1.unit03.lesson05.teach.a_third_person_avoir:
    title: Heeft (derde persoon)
    gloss: heeft
    note: '*A* is de derde persoon enkelvoud van *avoir*, die je gebruikt om OVER iemand te praten (*elle a vingt ans*), in plaats van als de persoon zelf (*j''ai* / *as-tu*, uit les 2 tot 4 van deze unit).'
  fr.a1.unit03.lesson06.teach.line01:
    title: Familiefoto's laten zien
    gloss: Inès laat Mathieu een foto zien en stelt haar ouders en haar jongere zus voor.
    note: '*Voici* (hier is/zijn) gebruik je om iets aan te wijzen, een natuurlijke uitdrukking om een foto te laten zien.'
  fr.a1.unit03.lesson06.teach.line02:
    title: Reageren en naar broers en zussen vragen
    gloss: Mathieu reageert hartelijk en vraagt of ze nog andere broers en zussen heeft.
    note: '*C''est adorable* is een natuurlijke, hartelijke reactie bij een foto van een jong broertje of zusje.'
  fr.a1.unit03.lesson06.teach.line03:
    title: Het huishouden noemen en de vraag teruggeven
    gloss: Inès zegt dat ze twee zussen en een broer heeft en dat ze thuis met zes zijn. Daarna vraagt ze naar Mathieus familie.
    note: '*On est six à la maison* geeft aan hoeveel mensen er thuis wonen, in het verlengde van het patroon uit les 4.'
  fr.a1.unit03.lesson06.teach.line04:
    title: Een kleinere familie beschrijven
    gloss: 'Mathieu zegt dat zijn familie kleiner is: ze zijn maar met z''n drieën, zijn ouders en hij. Maar hij heeft veel neven en nichten.'
    note: '*Mais* (maar) geeft het contrast aan tussen een klein gezin en een grote uitgebreide familie.'
  fr.a1.unit03.lesson06.teach.line05:
    title: Vragen of iemand dicht bij zijn ouders woont
    gloss: Inès vraagt of Mathieu bij zijn ouders in de buurt woont.
    note: '*Près de* (dicht bij) is een gangbare manier om fysieke nabijheid uit te drukken.'
  fr.a1.unit03.lesson06.teach.line06:
    title: Uitleggen dat het ver is en hoe je contact houdt
    gloss: Mathieu zegt nee, ze wonen in Lyon en ze bellen elkaar elke week.
    note: 'Dit sluit aan bij wat we in Unit 1 al wisten: Mathieu komt uit Lyon. Zijn ouders blijven daar wonen, terwijl hij in Saint-Ouen woont.'
  fr.a1.unit03.lesson06.teach.line07:
    title: Begrip tonen en je eigen situatie delen
    gloss: Inès zegt dat ze het begrijpt, en dat zij hier in Parijs met haar grootouders woont.
    note: '*Je comprends* (ik begrijp het) is een natuurlijke, korte manier om te reageren op wat iemand vertelt, voordat je zelf iets toevoegt.'
  fr.a1.unit03.lesson06.teach.line08:
    title: Afsluiten met een warme opmerking
    gloss: Mathieu zegt dat het fijn is om je familie dichtbij te hebben.
    note: '*C''est bien d''avoir sa famille près de soi* sluit het gesprek af op een warme, bespiegelende toon en herhaalt het patroon *près de* uit les 4.'
