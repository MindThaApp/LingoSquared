    title: Ik voetbal
    gloss: Ik voetbal.
    note: '*Jouer au* + een balsport is de gewone manier om te zeggen dat je voetbalt. Voor andere sporten gebruik je *faire du* of *faire de la*; zie de grammaticanotitie.'
  fr.a1.unit55.lesson01.teach.faire_du_de:
    title: Faire du / de la + sport
    gloss: '*Faire du*, *de la* of *de l''* + een sport zegt welke sport je doet: *faire du yoga*, *faire de la natation*, *faire de la course à pied*. Bij voetbal zeg je *jouer au football*.'
    note: 'Eén constructie dekt alle sporten: op dit niveau hoef je niet voor elke sport een apart werkwoord te leren.'
  fr.a1.unit55.lesson02.teach.fois_par_semaine:
    title: Keer per week
    gloss: keer per week
    example_gloss: Ik doe twee keer per week yoga.
  fr.a1.unit55.lesson02.teach.tu_connais_deja:
    title: Fois par semaine vs. tous les jours/souvent
    gloss: Je kent *tous les jours* (elke dag) en *souvent* (vaak) al. *Deux fois par semaine* (twee keer per week) is een nieuwe, preciezere manier om te zeggen hoe vaak je iets doet.
    note: Breidt de woordenschat over frequentie uit die je al kent uit de hobby-eenheid.
  fr.a1.unit55.lesson02.teach.je_fais_du:
    title: Ik doe twee keer per week yoga
    gloss: Ik doe twee keer per week yoga.
