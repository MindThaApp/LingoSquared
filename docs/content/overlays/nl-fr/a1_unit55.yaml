  fr.a1.unit55.lesson03.teach.tu_connais_deja:
    title: Faire du sport vs. faire de la + sport
    gloss: 'Je kent *faire du sport* al uit de les over hobby''s (*Je fais du sport le samedi*). *Faire de la* + sport noemt de specifieke sport: *Je fais de la natation*. Beide zijn correct Frans.'
    note: '*Faire du sport* is niet nieuw, het komt uit de eenheid over hobby''s. Hier staat het tegenover het noemen van een specifieke sport: een algemene en een specifieke manier om over sporten te praten.'
