  fr.a1.unit53.lesson06.mathieu_reconnait_nina:
    title: Mathieu herkent Nina
teaching:
  fr.a1.unit53.lesson01.teach.grand_petit:
    title: Lang en klein
    gloss: lang / klein
    note: '*Grand* beschrijft een lang persoon en *petit* een klein persoon. Ze passen zich aan de persoon aan: *grand/grande*, *petit/petite*.'
    example_gloss:
    - Léa is lang.
    - Thomas is klein.
  fr.a1.unit53.lesson01.teach.vieux_jeune:
    title: Oud en jong
    gloss: oud / jong
    note: '*Vieux* en *jeune* geven hier een algemene indruk van leeftijd, geen exact aantal jaren.'
    example_gloss:
    - Opa is oud.
    - Mathieu is jong.
  fr.a1.unit53.lesson01.teach.pour_un_age:
    title: 'Leeftijd: een getal of een indruk'
    gloss: 'Voor een exacte leeftijd gebruikt het Frans *avoir* (*Il a vingt ans*), maar *être vieux* geeft een algemene indruk (*Mon grand-père est vieux*). Het Nederlands gebruikt in beide gevallen ''zijn'': ''hij is twintig'', ''hij is oud''.'
    note: Je kent *Quel âge as-tu ?* al voor een exacte leeftijd. Hier beschrijft *vieux* hoe oud iemand eruitZIET, zonder getal.
  fr.a1.unit53.lesson01.teach.lea_est_grande:
    title: Léa is lang en Thomas is klein
    gloss: Léa is lang en Thomas is klein.
    note: Een eenvoudige samengestelde zin met *et* (en), als voorbereiding op de directe vergelijking in les 5.
  fr.a1.unit53.lesson02.teach.les_cheveux:
    title: Haar
    gloss: het haar
    note: '*Les cheveux* is altijd meervoud en mannelijk, terwijl het Nederlands ''haar'' in het enkelvoud gebruikt.'
    example_gloss: Mathieu heeft kort zwart haar.
  fr.a1.unit53.lesson02.teach.blonds_bruns_gris:
    title: Blond, bruin en grijs
    gloss: blond / bruin / grijs
    note: 'Drie haarkleuren. Bij *cheveux* krijgt de kleur een meervouds-*s*: *blonds*, *bruns*. *Gris* eindigt al op *s*, en *noirs* (zwart) ken je al van de kleding.'
    example_gloss:
    - Camille heeft blond haar.
    - Thomas heeft bruin haar.
    - Opa heeft grijs haar.
  fr.a1.unit53.lesson02.teach.longs_courts:
    title: Lang en kort (haar)
    gloss: lang / kort (haar)
    note: '*Longs* (lang) gebruikt het idee van lengte uit les 1, nu voor haarlengte. *Courts* (kort) is hier nieuw, en beide krijgen een meervouds-*s* bij *cheveux*.'
    example_gloss:
    - Léa heeft lang haar.
    - Thomas heeft kort haar.
  fr.a1.unit53.lesson02.teach.cheveux_est_toujours:
    title: Cheveux krijgt een meervoudsadjectief
    gloss: '*Cheveux* is altijd meervoud, dus het adjectief krijgt een *s*: *longs*, *courts*, *blonds*, *bruns*, *noirs*. *Gris* eindigt al op *s*.'
    note: 'Kleuren en lengtes passen zich in het meervoud aan *cheveux* aan: *les cheveux longs*. Vergelijk *yeux* in les 3, waar *marron* niet verandert.'
  fr.a1.unit53.lesson02.teach.ses_est_le:
    title: 'Ses: zijn of haar'
    gloss: '*Ses* betekent ''zijn'' of ''haar'' voor een meervoudig zelfstandig naamwoord: *ses cheveux*, *ses yeux*. Het past zich aan het bezit aan, niet aan de bezitter.'
    note: 'Het Frans heeft hier geen apart woord voor ''zijn'' en ''haar'': *ses yeux* kan ''zijn ogen'' of ''haar ogen'' betekenen, en de context vertelt welke.'
  fr.a1.unit53.lesson02.teach.mathieu_a_les:
    title: Mathieu heeft kort zwart haar
    gloss: Mathieu heeft kort zwart haar.
    note: Gebruikt *noirs* (zwart) opnieuw uit de kledingunit.
  fr.a1.unit53.lesson02.teach.camille_a_les:
    title: Camille heeft lang blond haar
    gloss: Camille heeft lang blond haar.
    note: Combineert de woorden voor lengte en kleur uit deze les in één natuurlijke zin.
  fr.a1.unit53.lesson03.teach.les_yeux:
    title: Ogen
    gloss: de ogen
    note: '*Les yeux* is het meervoud van *l''œil* (het oog); *yeux* eindigt op *x*, niet op *s*.'
    example_gloss: Mathieu heeft bruine ogen.
  fr.a1.unit53.lesson03.teach.bleus_marron_verts:
    title: Blauw, bruin en groen
    gloss: blauw / bruin / groen
    note: '*Bleus* (blauw) kwam eerder al aan bod bij kleding; *marron* (bruin) verandert nooit; *verts* (groen) is nieuw.'
    example_gloss:
    - Camille heeft blauwe ogen.
    - Thomas heeft bruine ogen.
    - Léa heeft groene ogen.
  fr.a1.unit53.lesson03.teach.avec_yeux_pluriel:
    title: Yeux krijgt -s, marron blijft gelijk
    gloss: 'Bij *yeux* (meervoud) krijgt het adjectief een *s*: *yeux bleus*, *yeux verts*. *Marron* verandert nooit: *yeux marron*.'
    note: 'Vergelijk *cheveux* uit les 2: een meervoudig zelfstandig naamwoord krijgt een meervoudig adjectief, behalve kleuren als *marron* die van een zelfstandig naamwoord afkomstig zijn.'
  fr.a1.unit53.lesson03.teach.comment_est_camille:
    title: Hoe ziet Camille eruit?
    gloss: Hoe ziet Camille eruit?
    note: '*Comment est ... ?* is de kernvraag van deze unit; gebruik hem om naar het uiterlijk van iedereen te vragen.'
  fr.a1.unit53.lesson03.teach.camille_a_les:
    title: Camille heeft lang blond haar en blauwe ogen
    gloss: Camille heeft lang blond haar en blauwe ogen.
    note: Een voorbeeldantwoord dat haar en ogen met *et* in één zin combineert.
  fr.a1.unit53.lesson04.teach.camille_une_nouvelle:
    title: Camille stelt Nina voor
    gloss: 'Camille: Er komt een nieuw meisje naar het taalcafé. Ze heet Nina.'
    note: '*Une nouvelle fille vient* introduceert iemand nieuws in de scène; *vient* komt van *venir* (komen).'
  fr.a1.unit53.lesson04.teach.mathieu_d_accord:
    title: Mathieu vraagt hoe ze eruitziet
    gloss: 'Mathieu: Oké! Hoe ziet ze eruit?'
    note: 'Gebruikt de kernvraag opnieuw met *elle* (zij) in plaats van een naam: *Comment est-elle ?* Het koppelteken verbindt het werkwoord en het voornaamwoord.'
  fr.a1.unit53.lesson04.teach.camille_elle_est:
    title: Camille beschrijft Nina's lengte en haar
    gloss: 'Camille: Ze is klein en ze heeft kort blond haar.'
    note: Combineert *petite* uit les 1 met de haarwoorden uit les 2; *petite* krijgt een *e* bij een meisje.
  fr.a1.unit53.lesson04.teach.mathieu_et_ses:
    title: Mathieu vraagt naar haar ogen
    gloss: 'Mathieu: En haar ogen?'
    note: '*Ses yeux* betekent hier ''haar ogen'': *ses* past zich aan *yeux* aan, niet aan het meisje.'
  fr.a1.unit53.lesson04.teach.camille_elle_a:
    title: Camille beschrijft Nina's ogen
    gloss: 'Camille: Ze heeft groene ogen.'
    note: Gebruikt *yeux verts* uit les 3 opnieuw.
  fr.a1.unit53.lesson04.teach.mathieu_merci_alors:
    title: Mathieu zal haar herkennen
    gloss: 'Mathieu: Bedankt! Dan zal ik haar herkennen.'
    note: '*Je vais la reconnaître* gebruikt *aller* + infinitief voor de nabije toekomst, en *la* betekent ''haar''.'
  fr.a1.unit53.lesson05.teach.thomas_et_lea:
    title: Thomas en Léa vergelijken
    gloss: Thomas en Léa zijn broer en zus, maar ze lijken niet op elkaar. Thomas is klein en heeft kort bruin haar en bruine ogen. Léa is langer dan Thomas en heeft lang bruin haar en groene ogen. En jij, hoe zie jij eruit?
    note: Een korte vergelijking met alle kleur- en lengtewoorden die tot nu toe zijn geleerd, met als slot de kernvraag van de unit aan de lezer.
    glosses:
      frère: broer
      sœur: zus
      ressemblent: eruitzien
      différents: verschillend
      petit: kort
      courts: kort
      bruns: bruin
      cheveux: haar
      marron: bruin
      yeux: ogen
      grande: groter
      longs: lang
      verts: groen
      se: (deel van 'se ressemblent' = op elkaar lijken)
  fr.a1.unit53.lesson05.teach.tu_connais_deja:
    title: Plus ... que bij personen
    gloss: 'Je kent het patroon *plus* + adjectief + *que* al. Hier gebruik je het voor personen: Léa is langer dan Thomas.'
    note: Hetzelfde patroon *plus ... que* als in de winkelunit, nu voor personen in plaats van voorwerpen. *Grande* past zich aan *Léa* aan, een meisje.
  fr.a1.unit53.lesson05.teach.lea_a_les:
    title: Léa heeft langer haar dan Thomas
    gloss: Léa heeft langer haar dan Thomas.
    note: '*Plus longs que* past zich aan *cheveux* (meervoud) aan: *les cheveux plus longs que Thomas*.'
  fr.a1.unit53.lesson05.teach.j_ai_les:
    title: Ik heb kort bruin haar
    gloss: Ik heb kort bruin haar.
    note: Een voorbeeldzin in de ik-vorm met *J'ai ...*, handig als je je eigen uiterlijk beschrijft.
  fr.a1.unit53.lesson06.teach.mathieu_regarde_c:
    title: Mathieu ziet Nina
    gloss: 'Mathieu: Kijk, is dat Nina? Ze heeft kort blond haar en groene ogen.'
    note: '*Regarde* (kijk) is de gebiedende wijs van *regarder* voor *tu*, op dezelfde manier gebruikt als in een eerdere dialoog.'
  fr.a1.unit53.lesson06.teach.camille_oui_c:
    title: Camille bevestigt
    gloss: 'Camille: Ja, dat is Nina!'
    note: Een korte, natuurlijke bevestiging.
  fr.a1.unit53.lesson06.teach.nina_salut_tu:
    title: Nina begroet Mathieu
    gloss: 'Nina: Hoi, ben jij Mathieu?'
    note: 'Een eenvoudige informele begroetingsvraag: *Tu es ... ?*'
  fr.a1.unit53.lesson06.teach.mathieu_oui_ravi:
    title: Mathieu begroet Nina terug
    gloss: 'Mathieu: Ja! Aangenaam, Nina.'
    note: '*Ravi de te rencontrer* is de gebruikelijke zin voor een echte eerste ontmoeting (*ravi* voor een man, *ravie* voor een vrouw), niet *content de te revoir*, dat is voor iemand die je al kent.'
  fr.a1.unit53.lesson06.teach.nina_ravie_de:
    title: Nina beantwoordt de begroeting
    gloss: 'Nina: Aangenaam!'
    note: 'Sluit de dialoog af: Mathieu heeft Nina herkend aan Camilles beschrijving.'
