answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Frans A1
  description: 'Een eenvoudige afspraak voorstellen, accepteren, afslaan en plannen, in het vervolg van het kookworkshopverhaal van Inès en Mathieu, die samen boodschappen gaan doen voor de les van zaterdag. Let op: *se retrouver* (afspreken, wederkerig) laat zich in het Nederlands niet met één werkwoord weergeven, en *vers* + tijdstip drukt een ongeveer tijdstip uit, geen exact tijdstip.'
units:
  fr.a1.unit11.plans:
    title: Hoe laat spreken we af?
lessons:
  fr.a1.unit11.lesson01.vocabulaire_projets:
    title: Een tijdstip voorstellen
  fr.a1.unit11.lesson02.accepter_refuser:
    title: Accepteren of afslaan
  fr.a1.unit11.lesson03.dialogue_projet_courses:
    title: De boodschappen plannen
teaching:
  fr.a1.unit11.lesson01.teach.libre:
    title: Vrij / beschikbaar
    gloss: vrij / beschikbaar
    note: '*Libre* beschrijft hier de beschikbaarheid van iemand; voor iets wat niets kost gebruikt het Frans *gratuit*.'
    example_gloss: Ben je zaterdag vrij?
  fr.a1.unit11.lesson01.teach.occupe:
    title: Bezet
    gloss: bezet
    note: 'Het directe tegenovergestelde van *libre*. Verandert mee met het geslacht: *occupé* / *occupée*.'
    example_gloss: Ik ben vrijdagavond bezet.
  fr.a1.unit11.lesson01.teach.se_retrouver:
    title: Afspreken
    gloss: afspreken / elkaar treffen
    note: 'In deze betekenis is *se retrouver* wederkerig: twee of meer mensen ontmoeten elkaar, anders dan bij *trouver* (vinden).'
    example_gloss: Waar spreken we vanavond af?
  fr.a1.unit11.lesson01.teach.vers:
    title: Rond (een tijdstip)
    gloss: rond / tegen (een tijdstip)
    note: '*Vers* + tijdstip drukt een ongeveer tijdstip uit, vrijblijvender dan een exact uur.'
    example_gloss: Ik kom rond zeven uur langs.
  fr.a1.unit11.lesson01.teach.ca_te_dit_de:
    title: Zin in... ?
    gloss: Zin om samen boodschappen te doen?
    note: '*Ça te dit de... ?* + infinitief is een gangbare, informele manier om iets voor te stellen, ontspannener dan *Voulez-vous... ?*'
  fr.a1.unit11.lesson01.teach.venir_chercher:
    title: Iemand komen ophalen
    gloss: Kom je me rond zes uur 's avonds ophalen?
    note: '*Venir chercher quelqu''un* betekent iemand komen ophalen, niet alleen "zoeken".'
  fr.a1.unit11.lesson01.teach.daccord_a_tout_a_lheure:
    title: Afgesproken, tot straks
    gloss: Goed, tot straks!
    note: '*D''accord* (goed/afgesproken) bevestigt een plan; *à tout à l''heure* zeg je als je iemand later op dezelfde dag weer ziet.'
  fr.a1.unit11.lesson02.teach.je_ne_peux_pas:
    title: Een afspraak afslaan
    gloss: Ik kan niet, ik ben bezet.
    note: '*Je ne peux pas* (ik kan niet) + een reden is een eenvoudige, beleefde manier om af te slaan.'
  fr.a1.unit11.lesson02.teach.avec_plaisir:
    title: Blij accepteren
    gloss: Graag!
    note: '*Avec plaisir* (letterlijk "met plezier") is een hartelijke, enthousiaste manier om een uitnodiging aan te nemen.'
  fr.a1.unit11.lesson02.teach.a_quelle_heure_on_se_voit:
    title: Naar de tijd vragen
    gloss: Hoe laat spreken we af?
    note: '*On se voit* (informeel, "we zien elkaar") is een gangbaar, informeel alternatief voor *se retrouver* om af te spreken.'
  fr.a1.unit11.lesson02.teach.devant_le_marche:
    title: Een plek voorstellen
    gloss: Voor de markt, past dat je?
    note: '*Ça te va ?* (past dat je?) controleert of een voorgesteld detail de ander schikt.'
  fr.a1.unit11.lesson02.teach.parfait_alors:
    title: Het plan bevestigen
    gloss: Perfect, tot vrijdag dan!
    note: '*Alors* betekent hier "dan" om een uitkomst te bevestigen en het overleg af te sluiten.'
  fr.a1.unit11.lesson03.teach.line01:
    title: Voorstellen om samen boodschappen te doen
    gloss: Inès vraagt Mathieu of hij zin heeft om voor de workshop samen boodschappen te doen.
    note: '*Ça te dit de... ?* opent het gesprek met een informele suggestie.'
  fr.a1.unit11.lesson03.teach.line02:
    title: Accepteren en vragen waar
    gloss: Mathieu zegt graag en vraagt waar ze afspreken.
    note: Combineert *Avec plaisir* (graag) met *se retrouver* (afspreken).
  fr.a1.unit11.lesson03.teach.line03:
    title: Een plek en dag voorstellen
    gloss: 'Inès stelt voor: voor de markt, vrijdagavond.'
    note: Een kort voorstel met plaats (*devant le marché*) en dag (*vendredi soir*).
  fr.a1.unit11.lesson03.teach.line04:
    title: Accepteren en naar de tijd vragen
    gloss: Mathieu stemt in en vraagt hoe laat.
    note: '*D''accord* bevestigt plaats en dag; de vervolgvraag bepaalt het precieze tijdstip.'
  fr.a1.unit11.lesson03.teach.line05:
    title: Een precies tijdstip voorstellen
    gloss: Inès vraagt of Mathieu haar rond zes uur 's avonds komt ophalen.
    note: Gebruikt *venir chercher* + *vers* met een precies uur.
  fr.a1.unit11.lesson03.teach.line06:
    title: Alles bevestigen
    gloss: Mathieu zegt perfect, tot vrijdag dan, zes uur 's avonds voor de markt.
    note: Herhaalt alle drie de details van het plan (dag, tijd, plaats) om het gesprek duidelijk af te sluiten.
