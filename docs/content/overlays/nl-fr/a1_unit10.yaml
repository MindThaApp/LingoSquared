answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Frans A1
  description: 'Een eenvoudige dagelijkse routine beschrijven met wederkerende werkwoorden (se réveiller, se lever, se coucher) en woorden voor de volgorde (d''abord, ensuite), als vervolg op het verhaal van Inès en Mathieu bij de kookworkshop, waarin Inès vraagt naar Mathieus zaterdag. Let op: Franse wederkerende werkwoorden hebben altijd een wederkerend voornaamwoord nodig (je ME réveille), net als in het Nederlands vaak met ''zich'', maar het gebruik verschilt per werkwoord.'
units:
  fr.a1.unit10.routines:
    title: Zaterdagroutine
lessons:
  fr.a1.unit10.lesson01.vocabulaire_routine:
    title: Ochtendactiviteiten
  fr.a1.unit10.lesson02.la_journee_complete:
    title: De hele dag
  fr.a1.unit10.lesson03.dialogue_routine_samedi:
    title: Mathieus zaterdagroutine
teaching:
  fr.a1.unit10.lesson01.teach.se_reveiller:
    title: Wakker worden
    gloss: wakker worden
    note: 'Wederkerend werkwoord: *je me réveille*, *tu te réveilles*. Het voornaamwoord *me/te/se* past altijd bij het onderwerp.'
    example_gloss: Ik word om zeven uur wakker.
  fr.a1.unit10.lesson01.teach.se_lever:
    title: Opstaan
    gloss: opstaan
    note: Niet hetzelfde als *se réveiller* (wakker worden) – *se lever* is het fysiek uit bed komen.
    example_gloss: Ik sta daarna meteen op.
  fr.a1.unit10.lesson01.teach.prendre_une_douche:
    title: Douchen
    gloss: douchen
    note: '*Prendre une douche* (letterlijk ''een douche nemen'') gebruikt *prendre*, hetzelfde werkwoord als bij maaltijden en vervoer.'
    example_gloss: Ik douche 's ochtends.
  fr.a1.unit10.lesson01.teach.shabiller:
    title: Zich aankleden
    gloss: zich aankleden
    note: 'Nog een wederkerend werkwoord: *je m''habille*, met *m''* voor een klinker.'
    example_gloss: Ik kleed me aan voor het ontbijt.
  fr.a1.unit10.lesson01.teach.le_petit_dejeuner:
    title: Ontbijt
    gloss: het ontbijt
    note: '*Prendre le petit-déjeuner* (ontbijten) volgt hetzelfde *prendre*-patroon als *prendre une douche*.'
    example_gloss: Ik ontbijt om acht uur.
  fr.a1.unit10.lesson01.teach.quitter_la_maison:
    title: Het huis verlaten
    gloss: het huis verlaten
    note: '*Quitter* betekent hier ''een plek verlaten''. Verwar het niet met *partir*, dat geen lijdend voorwerp heeft.'
    example_gloss: Ik verlaat het huis om negen uur.
  fr.a1.unit10.lesson01.teach.dabord_ensuite:
    title: Eerst... dan...
    gloss: Eerst sta ik op, daarna kleed ik me aan.
    note: '*D''abord* (eerst) en *ensuite* (daarna) zijn de basiswoorden om een routine stap voor stap te beschrijven.'
  fr.a1.unit10.lesson02.teach.rentrer:
    title: Naar huis terugkeren
    gloss: naar huis terugkeren
    note: '*Rentrer* betekent terugkeren naar je eigen huis, anders dan het algemenere *retourner* (ergens naartoe teruggaan).'
    example_gloss: Ik ga na het werk naar huis.
  fr.a1.unit10.lesson02.teach.diner:
    title: Dineren
    gloss: dineren
    note: '*Dîner* kan een werkwoord zijn (dineren) of een zelfstandig naamwoord (*le dîner*, het avondeten). De context maakt het verschil duidelijk.'
    example_gloss: Op zaterdagavond dineren we samen.
  fr.a1.unit10.lesson02.teach.se_coucher:
    title: Naar bed gaan
    gloss: naar bed gaan
    note: Het natuurlijke eind van de dagelijkse routine, het tegenovergestelde van *se lever* aan het begin.
    example_gloss: Ik ga rond elf uur naar bed.
  fr.a1.unit10.lesson02.teach.le_weekend:
    title: Het weekend
    gloss: het weekend
    note: '*Le week-end* is, net als in het Nederlands, een leenwoord uit het Engels, maar in het Frans schrijf je het met een koppelteken.'
    example_gloss: De workshop vindt in het weekend plaats.
  fr.a1.unit10.lesson02.teach.dhabitude:
    title: Meestal
    gloss: meestal
    note: '*D''habitude* leidt een gewoonte in, anders dan *aujourd''hui* (vandaag) voor iets eenmaligs.'
    example_gloss: Meestal sta ik om zeven uur op.
  fr.a1.unit10.lesson02.teach.ma_routine_du_samedi:
    title: Een zaterdag beschrijven
    gloss: Op zaterdag slaap ik uit, daarna ga ik naar de markt vóór de workshop.
    note: Combineert volgordewoorden zoals *d'abord/ensuite*, hier met *puis* ('daarna'), om een zaterdag te beschrijven.
  fr.a1.unit10.lesson02.teach.quest_ce_que_tu_fais:
    title: Wat doe je?
    gloss: Wat doe je op zaterdag?
    note: '*Qu''est-ce que tu fais... ?* is de standaard informele manier om te vragen wat iemand doet.'
  fr.a1.unit10.lesson03.teach.line01:
    title: Vragen naar zaterdag
    gloss: Inès vraagt Mathieu wat hij op zaterdag vóór de workshop doet.
    note: '*Tu fais quoi... ?* is de natuurlijke informele manier om te vragen ''wat doe je...?'', losser dan *Qu''est-ce que tu fais ?*'
  fr.a1.unit10.lesson03.teach.line02:
    title: Wakker worden beschrijven
    gloss: Mathieu zegt dat hij eerst laat wakker wordt, rond negen uur.
    note: '*Vers neuf heures* (rond negen uur) gebruikt het patroon *vers* + tijd voor een bij benadering genoemd tijdstip.'
  fr.a1.unit10.lesson03.teach.line03:
    title: Vragen wat er daarna komt
    gloss: Inès vraagt wat er daarna komt.
    note: Een korte, natuurlijke vervolgvraag om een beschrijving van een routine gaande te houden.
  fr.a1.unit10.lesson03.teach.line04:
    title: Ontbijt en markt beschrijven
    gloss: Mathieu zegt dat hij daarna ontbijt en naar de markt gaat.
    note: Twee handelingen verbonden met *et*, als voortzetting van de volgorde die met *d'abord* begon.
  fr.a1.unit10.lesson03.teach.line05:
    title: Vragen over thuiskomst
    gloss: Inès vraagt hoe laat Mathieu thuiskomt.
    note: '*Tu rentres à quelle heure ?* gebruikt *rentrer* uit deze les in een directe vraag.'
  fr.a1.unit10.lesson03.teach.line06:
    title: De middag beschrijven
    gloss: Mathieu zegt dat hij rond twaalf uur 's middags thuiskomt en dat hij zich 's middags ontspant vóór de workshop 's avonds.
    note: '*Se reposer* (rusten) is nog een wederkerend werkwoord: *je me repose*.'
