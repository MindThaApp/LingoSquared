  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Frans A1
  description: 'De weg vragen en uitleggen met basiswoorden (à gauche/à droite, tout droit, au coin de la rue, traverser). We volgen het verhaal van Inès en Mathieu uit de kookworkshop, terwijl Inès een winkel voor keukenspullen zoekt. Let op: in het Frans kun je de weg wijzen met de imperatief van vous ("Tournez à gauche") of met de tegenwoordige tijd ("Tu tournes à gauche").'
units:
  fr.a1.unit09.directions:
    title: Hoe kom ik daar?
lessons:
  fr.a1.unit09.lesson01.vocabulaire_directions:
    title: Woorden om de weg te vinden
  fr.a1.unit09.lesson02.donner_des_indications:
    title: De weg wijzen
  fr.a1.unit09.lesson03.dialogue_chercher_la_boutique:
    title: Op zoek naar de winkel
teaching:
  fr.a1.unit09.lesson01.teach.a_gauche:
    title: Links
    gloss: links / naar links
    note: '*À gauche* gebruik je zowel voor een plaats ("het is links") als voor een richting ("ga linksaf").'
    example_gloss: Ga na de bakkerij linksaf.
  fr.a1.unit09.lesson01.teach.a_droite:
    title: Rechts
    gloss: rechts / naar rechts
    note: Het directe tegenovergestelde van *à gauche*, op dezelfde manier gebruikt.
    example_gloss: De apotheek is rechts van het café.
  fr.a1.unit09.lesson01.teach.tout_droit:
    title: Rechtdoor
    gloss: rechtdoor
    note: '*Tout droit* betekent "rechtdoor". Verwar het niet met *à droite* ("naar rechts"): het lijkt erop, maar betekent iets anders.'
    example_gloss: Ga rechtdoor tot aan de markt.
  fr.a1.unit09.lesson01.teach.au_coin_de_la_rue:
    title: Op de hoek van de straat
    gloss: op de hoek van de straat
    note: '*Au coin de* betekent "op de hoek van"; *au coin de la rue* (op de hoek van de straat) is een heel gebruikelijk oriëntatiepunt.'
    example_gloss: De winkel is op de hoek van de straat.
  fr.a1.unit09.lesson01.teach.traverser:
    title: Oversteken
    gloss: oversteken
    note: '*Traverser* is een regelmatig werkwoord op -ER: *je traverse*, *tu traverses*, enzovoort.'
    example_gloss: Je moet de straat oversteken om bij de winkel te komen.
  fr.a1.unit09.lesson01.teach.la_boutique:
    title: De winkel
    gloss: de winkel
    note: '*La boutique* is meestal een kleine speciaalzaak, geen groot warenhuis.'
    example_gloss: De winkel is op de hoek van de straat, aan de rechterkant.
  fr.a1.unit09.lesson01.teach.le_carrefour:
    title: Het kruispunt
    gloss: het kruispunt
    note: '*Le carrefour* is de plek waar twee straten elkaar kruisen, een veelgebruikt oriëntatiepunt in gesproken routebeschrijvingen.'
    example_gloss: Ga bij het kruispunt linksaf.
  fr.a1.unit09.lesson02.teach.pour_aller_a:
    title: Vragen hoe je ergens komt
    gloss: Pardon, hoe kom ik bij de winkel, alstublieft?
    note: '*Pour aller à... ?* (letterlijk "om naar ... te gaan") is de standaard beleefde manier om de weg naar een plek te vragen.'
  fr.a1.unit09.lesson02.teach.tournez_a_gauche:
    title: Linksaf
    gloss: Ga na de apotheek linksaf.
    note: '*Tournez* is de imperatief van *tourner* (draaien, afslaan) in de *vous*-vorm. Dat is het gewone register om iemand die je niet goed kent de weg te wijzen.'
  fr.a1.unit09.lesson02.teach.continuez_tout_droit:
    title: Rechtdoor blijven gaan
    gloss: Ga rechtdoor tot aan het kruispunt.
    note: '*Continuez* (ga door) + *tout droit* (rechtdoor) is de standaardmanier om iemand te zeggen dat hij moet doorlopen zonder af te slaan.'
  fr.a1.unit09.lesson02.teach.cest_au_coin:
    title: De plaats aangeven
    gloss: Het is op de hoek van de straat, aan de rechterkant.
    note: Combineert *au coin de la rue* met *à droite* om precies aan te geven waar iets is.
  fr.a1.unit09.lesson02.teach.cest_loin:
    title: Zeggen dat het niet ver is
    gloss: Het is niet ver, het is vijf minuten lopen.
    note: '*À cinq minutes à pied* (vijf minuten lopen) is hetzelfde patroon voor loopafstand als toen Mathieu naar de apotheek vroeg.'
  fr.a1.unit09.lesson03.teach.line01:
    title: Naar een winkel vragen
    gloss: Inès vraagt Mathieu of hij een winkel kent om keukengerei te kopen.
    note: '*Tu connais... ?* (ken je ...?) is de standaard informele manier om te vragen of iemand een plek kent.'
  fr.a1.unit09.lesson03.teach.line02:
    title: De eerste stap geven
    gloss: 'Mathieu zegt ja, er is er een niet ver hiervandaan: je gaat bij het kruispunt linksaf.'
    note: '*Il y en a une* (er is er een) gebruikt *en* om herhaling van *boutique* te vermijden, een veelgebruikte afkorting in gesproken Frans.'
  fr.a1.unit09.lesson03.teach.line03:
    title: Bevestigen en meer vragen
    gloss: Inès bevestigt linksaf bij het kruispunt en vraagt wat daarna komt.
    note: '*Et ensuite ?* (en dan?) is een eenvoudige, natuurlijke manier om naar de volgende stap in de route te vragen.'
  fr.a1.unit09.lesson03.teach.line04:
    title: Geef de tweede stap
    gloss: Mathieu zegt dat je daarna rechtdoor gaat en de straat oversteekt.
    note: 'Twee werkwoorden van richting aan elkaar gekoppeld met *et*: een natuurlijke manier om een korte route uit te leggen.'
  fr.a1.unit09.lesson03.teach.line05:
    title: Vragen waar precies
    gloss: Inès vraagt waar de winkel precies is.
    note: '*Exactement* (precies) vraagt om een preciezer antwoord dan een algemene richting.'
  fr.a1.unit09.lesson03.teach.line06:
    title: De precieze plaats geven
    gloss: Mathieu zegt dat het op de hoek van de straat is, recht tegenover de bakkerij.
    note: '*En face de* (tegenover) geeft een plaats aan met een oriëntatiepunt, een natuurlijke manier om een routebeschrijving af te sluiten.'
