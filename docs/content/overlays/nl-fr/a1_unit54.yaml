    title: Nina's vogel
teaching:
  fr.a1.unit54.lesson01.teach.l_animal_un:
    title: Dier, een huisdier
    gloss: het dier / een huisdier
    note: '*Un animal* is het algemene woord; *un animal de compagnie* (letterlijk ''een dier van gezelschap'') betekent specifiek een huisdier.'
    example_gloss:
    - Een hond is een dier.
    - Een hond is ook een huisdier.
  fr.a1.unit54.lesson01.teach.le_chien_le:
    title: Hond en kat
    gloss: de hond / de kat
    example_gloss:
    - Camille heeft een hond.
    - Thomas heeft een kat.
  fr.a1.unit54.lesson01.teach.le_poisson_l:
    title: Vis en vogel
    gloss: de vis / de vogel
    example_gloss:
    - Opa heeft een vis.
    - Nina heeft een vogel.
  fr.a1.unit54.lesson01.teach.tu_as_un:
    title: Heb jij een huisdier?
    gloss: Heb jij een huisdier?
    note: Hetzelfde vraagpatroon *Tu as ... ?* ken je al uit eerdere units.
  fr.a1.unit54.lesson01.teach.oui_j_ai:
    title: Ja, ik heb een hond
    gloss: Ja, ik heb een hond.
    note: Een eenvoudig bevestigend antwoord met de nieuwe woorden uit deze les.
  fr.a1.unit54.lesson01.teach.non_je_n:
    title: Nee, ik heb geen huisdier
    gloss: Nee, ik heb geen huisdier.
    note: '*Pas d''* vervangt *un* na een ontkenning: *Je n''ai pas d''animal de compagnie.* Zie de grammaticanotitie.'
  fr.a1.unit54.lesson01.teach.apres_ne_pas:
    title: 'Pas de: un/une/des ontkennen'
    gloss: Na *ne ... pas* worden *un*, *une* en *des* *de* of *d'*, zoals in *Je n'ai pas de temps* (dat ken je al) en hier *Je n'ai pas d'animal de compagnie*.
    note: 'Dit gebruikt het patroon dat je al kent van *Je n''ai pas de temps*: geen nieuwe grammatica, alleen een nieuw zelfstandig naamwoord.'
  fr.a1.unit54.lesson02.teach.promener:
    title: Een dier uitlaten
    gloss: uitlaten (een dier)
    note: '*Promener* (uitlaten, wandelen met) is een regelmatig *-er*-werkwoord; zie de grammaticanotitie.'
    example_gloss: Ik laat de hond elke dag uit.
  fr.a1.unit54.lesson02.teach.promener_est_un:
    title: Promener is een regelmatig -er-werkwoord
    gloss: '*Promener* is een regelmatig *-er*-werkwoord, zoals *cuisiner*: *je promène, tu promènes, il promène le chien*. Het accent op de *e* laat zien dat die wordt uitgesproken.'
    note: Het werkwoord blijft altijd uit één stuk bestaan, net als bij de andere *-er*-werkwoorden die je al kent.
  fr.a1.unit54.lesson02.teach.donner_a_manger:
    title: Voeren
    gloss: voeren
    example_gloss: Ik geef de kat elke dag te eten.
  fr.a1.unit54.lesson02.teach.jouer_avec:
    title: Spelen met
    gloss: spelen met
    example_gloss: Thomas speelt met zijn kat.
  fr.a1.unit54.lesson02.teach.je_promene_le:
    title: Ik laat de hond elke dag uit
    gloss: Ik laat de hond elke dag uit.
    note: Combineert *promener* met *tous les jours* (elke dag), dat je al kent uit een eerdere unit.
  fr.a1.unit54.lesson02.teach.je_donne_a:
    title: Ik geef de kat elke dag te eten
    gloss: Ik geef de kat elke dag te eten.
    note: Combineert *donner à manger* (letterlijk 'te eten geven') met *tous les jours*.
  fr.a1.unit54.lesson03.teach.au_pluriel_on:
    title: 'Meervoud: chien -> chiens'
    gloss: 'Het meervoud krijgt meestal een *s* die je niet hoort: *chien -> chiens*, *chat -> chats*. Woorden op *-al* worden *-aux*: *animal -> animaux*.'
    note: Het regelmatige Franse meervoud, hier voor het eerst geïntroduceerd met dierennamen als voorbeeld.
  fr.a1.unit54.lesson03.teach.chiens_chats:
    title: Honden en katten
    gloss: honden / katten
    example_gloss:
    - Mathieu houdt van honden.
    - Léa houdt van katten.
  fr.a1.unit54.lesson03.teach.poissons_oiseaux:
    title: Vissen en vogels (meervoud)
    gloss: vissen / vogels
    example_gloss:
    - Ik hou van vissen.
    - Opa houdt van vogels.
  fr.a1.unit54.lesson03.teach.j_adore_les:
    title: Ik hou van dieren
    gloss: Ik hou van dieren.
    note: 'Na *adorer* (dol zijn op) volgt direct het zelfstandig naamwoord, en een algemene voorkeur krijgt *les*: *J''adore les animaux.*'
  fr.a1.unit54.lesson03.teach.lea_adore_les:
    title: Léa houdt van katten, maar heeft geen huisdier
    gloss: Léa houdt van katten, maar ze heeft geen huisdier.
    note: Bereidt het contrast voor waar de leestekst van deze les om draait.
  fr.a1.unit54.lesson04.teach.mathieu_tu_as:
    title: Mathieu vraagt naar een huisdier
    gloss: 'Mathieu: Heb je een huisdier, Camille?'
  fr.a1.unit54.lesson04.teach.camille_oui_j:
    title: Camille heeft een hond
    gloss: 'Camille: Ja, ik heb een hond.'
  fr.a1.unit54.lesson04.teach.mathieu_comment_est:
    title: Mathieu vraagt hoe hij eruitziet
    gloss: 'Mathieu: Hoe ziet hij eruit?'
    note: Hier komt *Comment est-il ?* uit de les over uiterlijk terug, nu gesteld over een dier.
  fr.a1.unit54.lesson04.teach.camille_il_a:
    title: Camille beschrijft haar hond
    gloss: 'Camille: Hij heeft een bruine vacht en hij is klein.'
    note: Hier komen de woorden voor haarkleur en grootte uit de les over uiterlijk terug, nu om de vacht van een dier te beschrijven in plaats van het haar van een persoon.
  fr.a1.unit54.lesson04.teach.il_et_le:
    title: Il/le bij dieren
    gloss: '*Il* (hij) en *le* (hem) kun je ook gebruiken voor een mannelijk dier, niet alleen voor een persoon.'
    note: Tot nu toe sloegen *il* en *le* in deze cursus altijd op een persoon; hier zie je dat ze ook voor dieren gelden.
  fr.a1.unit54.lesson04.teach.mathieu_tu_le:
    title: Mathieu vraagt naar de wandelingen
    gloss: 'Mathieu: Laat je hem elke dag uit?'
  fr.a1.unit54.lesson04.teach.camille_oui_je:
    title: Camille vertelt over haar dagelijkse routine
    gloss: 'Camille: Ja, ik laat hem elke dag uit en ik geef hem te eten.'
  fr.a1.unit54.lesson05.teach.mathieu_et_lea:
    title: Mathieu, Léa en Thomas over dieren
    gloss: 'Mathieu en Léa houden allebei van dieren, maar geen van beiden heeft een huisdier. Mathieu houdt van honden en Léa houdt van katten. Thomas heeft wél een huisdier: een kat. Hij speelt vaak met zijn kat en geeft hem elke dag te eten. En jij, heb jij een huisdier?'
    note: 'Zet van dieren houden tegenover er echt een hebben: dat is het communicatieve doel van deze les.'
    glosses:
      adorent: houden van
      tous: beide
      animaux: dieren
      deux: beide
      compagnie: huisdier
      chiens: honden
      chats: katten
      chat: kat
      joue: speelt
      donne: geeft
      chaque: elke
      manger: voer
  fr.a1.unit54.lesson05.teach.thomas_joue_souvent:
    title: Thomas speelt vaak met zijn kat
    gloss: Thomas speelt vaak met zijn kat.
    note: '*Souvent* (vaak) staat direct na het werkwoord, net als in de eerdere routines.'
  fr.a1.unit54.lesson05.teach.j_adore_les:
    title: Ik hou van honden. Ik heb geen huisdier.
    gloss: Ik hou van honden. Ik heb geen huisdier.
    note: Een voorbeeldantwoord van twee zinnen, dat je kunt hergebruiken voor de schrijfopdracht van deze les.
  fr.a1.unit54.lesson06.teach.camille_nina_tu:
    title: Camille vraagt het aan Nina
    gloss: 'Camille: Nina, heb jij ook een huisdier?'
  fr.a1.unit54.lesson06.teach.nina_oui_j:
    title: Nina heeft een vogel die Pico heet
    gloss: 'Nina: Ja, ik heb een vogel. Hij heet Pico.'
    note: '*Il s''appelle* (hij heet) gebruikt hetzelfde werkwoord als in de allereerste les over jezelf voorstellen.'
  fr.a1.unit54.lesson06.teach.mathieu_comme_c:
    title: Mathieu reageert
    gloss: 'Mathieu: Wat leuk! Wat doe je elke dag met hem?'
  fr.a1.unit54.lesson06.teach.nina_je_lui:
    title: Nina geeft hem elke dag te eten
    gloss: 'Nina: Ik geef hem elke dag te eten.'
  fr.a1.unit54.lesson06.teach.mathieu_j_adore:
    title: Mathieu houdt ook van vogels
    gloss: 'Mathieu: Ik houd ook van vogels.'
  fr.a1.unit54.lesson06.teach.camille_c_est:
    title: Camille sluit het gesprek af
    gloss: 'Camille: Gaaf, we houden alle drie van dieren!'
    note: Rondt het gesprek af met wat alle drie de personages in deze les over dieren hebben verteld.
