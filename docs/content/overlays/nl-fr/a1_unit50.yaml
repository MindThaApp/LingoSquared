teaching:
  fr.a1.unit50.lesson01.teach.appeler:
    title: Bellen
    gloss: bellen
    note: De infinitief van het werkwoord voor telefoneren.
    example_gloss: Ik moet je bellen.
  fr.a1.unit50.lesson01.teach.je_t_appelle:
    title: Zeggen dat je belt
    gloss: Ik bel je.
    note: '*Appelle* is de *je*-vorm van *appeler*; het Frans gebruikt hier de tegenwoordige tijd, net zoals je in het Nederlands ''ik bel je'' kunt zeggen voor iets in de toekomst.'
  fr.a1.unit50.lesson01.teach.allo_c_est:
    title: De telefoon opnemen
    gloss: Hallo, met Camille.
    note: '*C''est* + naam is de standaardmanier om jezelf in het Frans aan de telefoon voor te stellen; in het Nederlands zeg je daar ''met''.'
  fr.a1.unit50.lesson01.teach.allo_c_est_2:
    title: Mathieu antwoordt op dezelfde manier
    gloss: Hallo, met Mathieu.
    note: Hetzelfde patroon *c'est* + naam als in *Allô, c'est Camille*.
  fr.a1.unit50.lesson02.teach.qui_est_a:
    title: Vragen wie er belt
    gloss: Met wie spreek ik?
    note: '*Qui est à l''appareil ?* is de standaardvraag om aan een onbekende beller te vragen wie het is.'
  fr.a1.unit50.lesson02.teach.vous_parlez_avec:
    title: Jezelf formeel voorstellen
    gloss: U spreekt met Camille.
    note: '*Vous parlez avec* + naam is de formele tegenhanger van *c''est* + naam.'
  fr.a1.unit50.lesson03.teach.tu_peux_repeter:
    title: Vragen om herhaling
    gloss: Kun je dat herhalen?
    note: '*Tu peux ...* (Kun je ...?) plus de infinitief *répéter* (herhalen).'
  fr.a1.unit50.lesson03.teach.ne_parle_pas:
    title: Vragen om langzamer te praten
    gloss: Praat niet zo snel, alsjeblieft.
    note: '*Ne parle pas si vite* ontkent het werkwoord: *ne ... pas* staat om *parle* heen, en *si* betekent ''zo''.'
  fr.a1.unit50.lesson03.teach.je_ne_t:
    title: Zeggen dat je niet goed hoort
    gloss: Ik hoor je niet goed.
    note: '*Entendre* (horen) met *ne ... pas bien* geeft aan dat je iets slecht hoort; dat is iets anders dan *comprendre* (begrijpen).'
  fr.a1.unit50.lesson04.teach.le_sms:
    title: Appje
    gloss: het berichtje
    note: '*SMS* is mannelijk: *un SMS*. Het is een internationale afkorting die rechtstreeks is overgenomen.'
    example_gloss: De sms is van Camille.
  fr.a1.unit50.lesson04.teach.je_t_envoie:
    title: Zeggen dat je iets stuurt
    gloss: Ik stuur je een berichtje.
    note: '*Envoyer* (sturen) krijgt het voornaamwoord *te* (hier *t''*) vóór het werkwoord, daarna volgt *un SMS*.'
  fr.a1.unit50.lesson04.teach.je_te_rappelle:
    title: Zeggen dat je terugbelt
    gloss: Ik bel je straks terug.
    note: '*Rappeler* (terugbellen) bevat het idee ''terug'' al in *re-*; *plus tard* betekent ''later''.'
  fr.a1.unit50.lesson05.teach.mathieu_salut_camille:
    title: Lees een appgesprek
    gloss: 'Mathieu: Hoi Camille, kun je me bellen? Ik moet je iets vertellen. Camille: Ja, natuurlijk, ik bel je over vijf minuten terug.'
    note: Let op wat Mathieu vraagt, waarom, en wanneer Camille zegt terug te bellen.
    glosses:
      Salut: hoi
      peux: kunnen
      m'appeler: bellen
      dois: moeten
      truc: iets
      dire: vertellen
      évidemment: natuurlijk
      rappelle: terug
      cinq: vijf
      minutes: minuten
  fr.a1.unit50.lesson06.teach.mathieu_allo_c:
    title: Mathieu neemt op
    gloss: 'Mathieu: Hallo, met Mathieu.'
    note: 'Hetzelfde patroon *c''est* + naam als in les 1, nu in een echt telefoongesprek: wie opneemt, spreekt als eerste en noemt zijn naam.'
  fr.a1.unit50.lesson06.teach.camille_salut_mathieu:
    title: Camille stelt zich voor
    gloss: 'Camille: Hoi Mathieu, met Camille. Mathieu: Leuk dat je belt!'
    note: '*C''est sympa que* ... (leuk dat ...) drukt een positieve reactie op een gebeurtenis uit; *appelles* is een bijzondere vorm die je hier gewoon kunt onthouden.'
  fr.a1.unit50.lesson06.teach.camille_comment_s:
    title: Camille vraagt naar de dienst
    gloss: 'Camille: Hoe was je eerste dienst?'
    note: '*Comment s''est passé ... ?* gebruikt de voltooide tijd (passé composé) van *se passer* (gebeuren, verlopen), gevormd met *être*, om te vragen hoe iets is gegaan.'
  fr.a1.unit50.lesson06.teach.mathieu_ca_s:
    title: Mathieu heeft goed nieuws
    gloss: 'Mathieu: Het ging heel goed, beter dan ik dacht.'
    note: '*Ça s''est très bien passé* en *je pensais* zijn hier vaste uitdrukkingen; *je pensais* is de onvoltooid verleden tijd (imparfait) van *penser* (denken).'
  fr.a1.unit50.lesson06.teach.au_passe_compose:
    title: Passé composé met avoir en être
    gloss: s'est passé → gebeuren, j'ai pensé → denken, je suis allé → gaan
    note: 'Het passé composé gebruikt *avoir* of *être* + een voltooid deelwoord: *j''ai pensé*, *je suis allé*. *Ça s''est passé* is een vaste uitdrukking voor ''het ging''; onthoud die voorlopig gewoon in de situaties waarin hij in deze les voorkomt.'
  fr.a1.unit50.lesson06.teach.camille_ca_fait:
    title: Camille is trots
    gloss: 'Camille: Fijn om te horen! Ik ben trots op je.'
    note: '*Fière de* (trots op) is een vaste combinatie; *de* is verplicht, niet *pour*; *fière* is hier vrouwelijk.'
  fr.a1.unit50.lesson06.teach.mathieu_merci_beaucoup:
    title: Mathieu is ontroerd
    gloss: 'Mathieu: Heel erg bedankt, dat betekent veel voor me.'
    note: '*Compter* betekent hier ''belangrijk zijn'': *ça compte pour moi* (het is belangrijk voor mij); *pour moi* zegt voor wie het belangrijk is.'
  fr.a1.unit50.lesson06.teach.son_premier_service:
    title: Zijn
    gloss: Zijn eerste dienst is heel goed gegaan.
    note: '*Son* is hier het bezittelijk voornaamwoord ''zijn'', geen werkwoord: *son premier service* (zijn eerste dienst); *son* past bij het mannelijke *service*.'
