answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Frans A1
  description: 'Veelvoorkomende plekken in de buurt en de weg vragen en wijzen (en face de, à côté de, près de, loin de), met Mathieu die verder zoekt naar een apotheek bij de werkplaats. Let op: deze plaatsaanduidingen eindigen allemaal op de, dat voor een mannelijk of meervoudig zelfstandig naamwoord samensmelt tot du/des (du café, des arbres). Zo''n samensmelting kent het Nederlands niet.'
units:
  fr.a1.unit07.places:
    title: Waar is...?
lessons:
  fr.a1.unit07.lesson01.lieux_du_quartier:
    title: Plekken in de buurt
  fr.a1.unit07.lesson02.demander_son_chemin:
    title: De weg vragen
  fr.a1.unit07.lesson03.dialogue_chercher_pharmacie:
    title: Op zoek naar de apotheek
teaching:
  fr.a1.unit07.lesson01.teach.gare:
    title: Het station
    gloss: het station
    note: '*Gare* is vrouwelijk.'
    example_gloss: Het station is groot.
  fr.a1.unit07.lesson01.teach.pharmacie:
    title: De apotheek
    gloss: de apotheek
    note: '*Pharmacie* is vrouwelijk.'
    example_gloss: De apotheek gaat om negen uur open.
  fr.a1.unit07.lesson01.teach.banque:
    title: De bank
    gloss: de bank
    note: '*Banque* is vrouwelijk.'
    example_gloss: De bank is op zondag gesloten.
  fr.a1.unit07.lesson01.teach.ecole:
    title: De school
    gloss: de school
    note: '*École* is vrouwelijk; *l''* wordt voor de klinkerklank afgekort.'
    example_gloss: De school ligt naast het park.
  fr.a1.unit07.lesson01.teach.cafe:
    title: Het café
    gloss: het café
    note: '*Café* is mannelijk; in andere contexten betekent het ook "koffie".'
    example_gloss: Het café is de hele dag open.
  fr.a1.unit07.lesson01.teach.poste:
    title: Het postkantoor
    gloss: het postkantoor
    note: '*Poste* (vrouwelijk) betekent hier "postkantoor"; *le poste* (mannelijk, andere betekenis) kan "de functie/baan" betekenen -- het geslacht verandert de betekenis.'
    example_gloss: Het postkantoor sluit om zes uur.
  fr.a1.unit07.lesson01.teach.la_gare_est_grande:
    title: Twee plekken vergelijken
    gloss: Het station is groot en de apotheek is klein.
    note: '*Grande* en *petite* krijgen hier allebei de vrouwelijke vorm (*la gare*, *la pharmacie*).'
  fr.a1.unit07.lesson02.teach.ou_est_la_gare:
    title: Vragen waar iets is
    gloss: Waar is het station, alstublieft?
    note: '*Où est... ?* is de standaardmanier om naar de ligging van een plek te vragen.'
  fr.a1.unit07.lesson02.teach.en_face_de:
    title: Zeggen dat iets tegenover ligt
    gloss: De bank ligt tegenover het station.
    note: '*En face de* (tegenover) eindigt op *de*, gevolgd door de plek waarnaar je verwijst: *en face de la banque*. Voor een mannelijk woord smelt het samen: *en face du café*.'
  fr.a1.unit07.lesson02.teach.a_cote_de:
    title: Zeggen dat iets naast ligt
    gloss: De apotheek ligt naast de bank.
    note: '*À côté de* (naast) werkt met *de* op dezelfde manier als *en face de*.'
  fr.a1.unit07.lesson02.teach.pres_de:
    title: Zeggen dat iets dichtbij ligt
    gloss: De school is hier dichtbij.
    note: '*Près de* (dichtbij) wordt *près d''* voor een klinkerklank, zoals in *près d''ici* (hier dichtbij).'
  fr.a1.unit07.lesson02.teach.loin_de:
    title: Zeggen dat iets ver weg ligt
    gloss: Het postkantoor is ver hiervandaan.
    note: '*Loin de* (ver van) is het directe tegenovergestelde van *près de*.'
  fr.a1.unit07.lesson02.teach.cest_loin:
    title: Vragen of iets ver is
    gloss: Is het ver hiervandaan? — Nee, het is niet ver.
    note: '*C''est loin d''ici ?* is de logische vervolgvraag nadat je de weg is gewezen. Om nee te zeggen zet je *ne... pas* om het werkwoord: *ce n''est pas loin* (het is niet ver).'
  fr.a1.unit07.lesson03.teach.line01:
    title: Een vreemde de weg vragen
    gloss: Mathieu vraagt een voorbijganger beleefd waar de apotheek is.
    note: '*Excusez-moi* (pardon) is de gebruikelijke beleefde opening als je een onbekende aanspreekt, samen met *vous*.'
  fr.a1.unit07.lesson03.teach.line02:
    title: De ligging aangeven
    gloss: Ze zegt dat hij tegenover de bank ligt, naast het café.
    note: '*En face de* en *à côté de* in één zin geven een nauwkeurige plaats aan. *De* + *le café* smelt samen tot *du café*.'
  fr.a1.unit07.lesson03.teach.line03:
    title: Vragen of het ver is
    gloss: Mathieu vraagt of het ver hiervandaan is.
    note: Dezelfde *C'est loin d'ici ?* die je hebt geleerd om naar afstand te vragen.
  fr.a1.unit07.lesson03.teach.line04:
    title: Geruststellen dat het dichtbij is
    gloss: Ze zegt nee, het is vlakbij -- vijf minuten lopen.
    note: '*À pied* (te voet) is de standaardmanier om aan te geven dat je loopt.'
  fr.a1.unit07.lesson03.teach.line05:
    title: Haar bedanken
    gloss: Mathieu bedankt haar hartelijk.
    note: '*Merci beaucoup* versterkt het gewone *merci* dat je al kent uit eerdere units.'
  fr.a1.unit07.lesson03.teach.line06:
    title: Reageren op een bedankje
    gloss: 'Ze antwoordt: graag gedaan.'
    note: '*Je vous en prie* is een formelere manier om "graag gedaan" te zeggen, passend bij het *vous*-register tegenover een vreemde; *De rien* is een minder formele, alledaagse variant.'
