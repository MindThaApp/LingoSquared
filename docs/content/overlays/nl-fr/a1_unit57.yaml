  fr.a1.unit57.lesson03.teach.chercher_est_un:
    title: Chercher is een regelmatig werkwoord op -er
    gloss: '*Chercher* is een regelmatig werkwoord op *-er*, net als *utiliser*: *je cherche, tu cherches*; *j''utilise, tu utilises*.'
    note: 'Net als bij de werkwoorden voor dagelijkse routines staat het lijdend voorwerp direct na *chercher*: *Je cherche la météo.*'
