    note: Breidt het afscheidspatroon uit de begroetingsles uit naar een bepaalde dag.
  fr.a1.unit57.lesson05.teach.camille_appelle_mathieu:
    title: Wie gebruikt wat?
    gloss: Camille belt Mathieu elke dag. Ze gebruikt haar telefoon, geen app. Mathieu heeft thuis geen computer, maar hij gebruikt internet op zijn telefoon. Thomas zoekt elke ochtend het weerbericht op. Daarna gaat hij hardlopen. Léa stuurt Camille vaak een bericht. En jij, gebruik jij ook elke dag je telefoon?
    note: Vergelijkt hoe alle vier de personages hun apparaten gebruiken, net als de vergelijkende leestekst in de sportles.
