    title: La météo en le message
    gloss: Je kent *la météo* (de weersvoorspelling) al. Een *message* kun je versturen (*j'envoie*, *tu envoies*) of lezen (*je lis*, *tu lis*).
    note: Koppelt het nieuwe woord aan het samengestelde zelfstandig naamwoord uit de weerles.
