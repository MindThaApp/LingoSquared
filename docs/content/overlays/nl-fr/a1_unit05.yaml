  fr.a1.unit05.lesson01.a_table:
    title: Aan tafel
  fr.a1.unit05.lesson02.au_cafe:
    title: In het café
  fr.a1.unit05.lesson03.dialogue_cafe:
    title: In het café na de workshop
teaching:
  fr.a1.unit05.lesson01.teach.poulet:
    title: Kip
    gloss: kip
    note: '*Poulet* is mannelijk.'
    example_gloss: Ik wil graag kip.
  fr.a1.unit05.lesson01.teach.poisson:
    title: Vis
    gloss: vis
    note: '*Poisson* is mannelijk.'
    example_gloss: De vis is vandaag vers.
  fr.a1.unit05.lesson01.teach.salade:
    title: Salade
    gloss: salade
    note: '*Salade* is vrouwelijk.'
    example_gloss: Ze eet een salade.
  fr.a1.unit05.lesson01.teach.riz:
    title: Rijst
    gloss: rijst
    note: '*Riz* is mannelijk en onveranderlijk (enkelvoud en meervoud schrijf je hetzelfde, net als bij *prix*).'
    example_gloss: Rijst past goed bij kip.
  fr.a1.unit05.lesson01.teach.eau:
    title: Water
    gloss: water
    note: '*Eau* is vrouwelijk; *l''* wordt afgekort voor de klinker, net als bij *l''addition* later in deze unit.'
    example_gloss: Ik wil graag water, alstublieft.
  fr.a1.unit05.lesson01.teach.vin:
    title: Wijn
    gloss: wijn
    note: '*Vin* is mannelijk.'
    example_gloss: De rode wijn is heerlijk.
  fr.a1.unit05.lesson01.teach.je_voudrais_poulet_salade:
    title: Kip en salade bestellen
    gloss: Ik wil graag kip en salade.
    note: '*Du poulet* (mannelijk) en *de la salade* (vrouwelijk) zijn partitieve lidwoorden ("wat") die het geslacht van het zelfstandig naamwoord volgen. Na een hoeveelheid (*un kilo de*) staat alleen *de*.'
  fr.a1.unit05.lesson02.teach.dessert:
    title: Dessert
    gloss: nagerecht
    note: '*Dessert* is mannelijk.'
    example_gloss: Het dessert is vandaag gratis.
  fr.a1.unit05.lesson02.teach.addition:
    title: De rekening
    gloss: de rekening
    note: '*Addition* is vrouwelijk; *l''* wordt afgekort voor de klinker. Dit is de gewone term in een Frans restaurant, niet *facture* (een formele factuur).'
    example_gloss: De rekening, alstublieft.
  fr.a1.unit05.lesson02.teach.vous_avez_choisi:
    title: Vragen of iemand klaar is om te bestellen
    gloss: Hebt u gekozen?
    note: De standaardvraag van een ober als hij bij de tafel komt om de bestelling op te nemen. Hij gebruikt de voltooide tijd (passé composé) van *choisir* (kiezen).
  fr.a1.unit05.lesson02.teach.je_voudrais_un_cafe:
    title: Een koffie bestellen
    gloss: Ik wil graag een koffie, alstublieft.
    note: '*Je voudrais* + product: hetzelfde patroon als bij het winkelen, nu voor eten en drinken.'
  fr.a1.unit05.lesson02.teach.qcq_comme_dessert:
    title: Vragen wat er te krijgen is
    gloss: Wat hebt u als dessert?
    note: '*Qu''est-ce que vous avez comme...?* is een natuurlijke, veelgebruikte manier om te vragen welke keuzes er binnen een categorie zijn.'
  fr.a1.unit05.lesson02.teach.cest_delicieux:
    title: Zeggen dat iets heerlijk is
    gloss: Het is heerlijk!
    note: Een veelgebruikte, enthousiaste reactie op eten; *délicieux* blijft hier onveranderd, omdat *c'est* geen zelfstandig naamwoord met een geslacht bij zich heeft.
  fr.a1.unit05.lesson03.teach.line01:
    title: Groeten en vragen of ze klaar zijn om te bestellen
    gloss: De ober groet hen en vraagt of ze klaar zijn om te bestellen.
    note: Begint met *Bonjour*, de beleefde groet bij bediening.
  fr.a1.unit05.lesson03.teach.line02:
    title: Salade en water bestellen
    gloss: Inès bestelt een salade en water.
    note: Combineert *je voudrais* met *et* om twee bestelde dingen in één zin te verbinden.
  fr.a1.unit05.lesson03.teach.line03:
    title: Kip met rijst bestellen
    gloss: Mathieu bestelt kip met rijst.
    note: '*Avec* (met) verbindt het hoofdgerecht met de bijgerecht: een eenvoudige, veelgebruikte constructie bij het bestellen.'
  fr.a1.unit05.lesson03.teach.line04:
    title: Bevestigen en naar drinken vragen
    gloss: De ober bevestigt de bestelling en vraagt naar drinken.
    note: '*Et comme boisson pour vous ?* gebruikt opnieuw het *comme*-patroon uit *Qu''est-ce que vous avez comme dessert ?*, nu voor drinken.'
  fr.a1.unit05.lesson03.teach.line05:
    title: Een glas wijn bestellen
    gloss: Mathieu bestelt een glas rode wijn.
    note: '*Un verre de* (een glas) is de gewone manier om wijn per glas te bestellen.'
  fr.a1.unit05.lesson03.teach.line06:
    title: Reageren op het eten
    gloss: Inès zegt dat de salade heerlijk is.
    note: Gebruikt *C'est délicieux !* opnieuw, nu voor een bepaald gerecht (*cette salade*). *Délicieux* blijft mannelijk na *c'est*, ook al is *salade* vrouwelijk; *Elle est délicieuse, cette salade !* is het alternatief met congruentie.
  fr.a1.unit05.lesson03.teach.line07:
    title: Uitleggen dat ze honger hebben en om de rekening vragen
    gloss: Mathieu zegt dat ze door de workshop honger hebben gekregen en vraagt om de rekening.
    note: '*Nous a donné faim* (letterlijk "heeft ons honger gegeven") is in het Frans de natuurlijke manier om te zeggen dat iets je hongerig heeft gemaakt.'
  fr.a1.unit05.lesson03.teach.line08:
    title: Bevestigen dat de rekening eraan komt
    gloss: De ober bevestigt dat hij de rekening meteen brengt.
    note: '*Tout de suite* (meteen) is een veelgebruikte, geruststellende uitdrukking in de bediening.'
