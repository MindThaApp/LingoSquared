  fr.a1.unit56.lesson04.teach.pour_les_transports:
    title: À vélo, en train
    gloss: In het Frans gebruik je *à* bij vervoer waarop je rijdt of loopt (*à vélo*, *à pied*) en *en* bij vervoer waarin je zit (*en train*, *en voiture*).
    note: Leerders maken vaak zelf een vorm zoals *par vélo* of *dans le train*. Leer *à vélo*, *à pied*, *en train* en *en voiture* als vaste uitdrukkingen.
  fr.a1.unit56.lesson04.teach.mathieu_alors_je:
