    gloss: 'Mathieu: Dan neem ik de trein, samen met Camille.'
  fr.a1.unit56.lesson05.teach.camille_voyage_tous:
    title: Wie reist hoe?
    gloss: Camille reist elke dag met de trein naar haar werk. Mathieu gaat meestal met de fiets, maar als het regent, neemt hij ook de trein. Thomas gaat liever met de auto. Léa woont vlakbij en loopt naar haar werk. Hoe ga jij naar je werk?
    note: Zet vier manieren om naar het werk te gaan en één voorwaarde (regen) tegenover elkaar, net als de lezing over sport in de vorige unit.
