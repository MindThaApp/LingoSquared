course:
  title: Frans A1
  description: 'Eenvoudige vergelijkingen maken (plus/moins/aussi... que) en overtreffende trappen (le/la plus...), in het vervolg van het kookworkshopverhaal van Inès en Mathieu, die tijdens het winkelen twee kazen vergelijken. Let op: *meilleur* (beter) en *le meilleur* (de beste) zijn onregelmatig, in tegenstelling tot het regelmatige patroon *plus... que* bij de meeste andere bijvoeglijke naamwoorden.'
units:
  fr.a1.unit14.comparisons:
    title: Meer of minder?
lessons:
  fr.a1.unit14.lesson01.vocabulaire_comparaisons:
    title: Meer, minder, even
  fr.a1.unit14.lesson02.superlatifs:
    title: Het meest, het minst
  fr.a1.unit14.lesson03.dialogue_comparer_fromages:
    title: Twee kazen vergelijken op de markt
teaching:
  fr.a1.unit14.lesson01.teach.plus_que:
    title: Meer... dan
    gloss: meer... dan
    note: '*Plus + adjective + que* is de gewone Franse vergrotende trap: het adjectief blijft zoals het is en je zet er gewoon plus ervoor en que erachter, zonder aparte uitgang.'
    example_gloss: Deze kaas is duurder dan die andere.
  fr.a1.unit14.lesson01.teach.moins_que:
    title: Minder... dan
    gloss: minder... dan
    note: '*Moins* is het directe tegenovergestelde van *plus* in hetzelfde vergelijkingspatroon.'
    example_gloss: Dit recept is minder moeilijk dan het andere.
  fr.a1.unit14.lesson01.teach.aussi_que:
    title: Even... als
    gloss: even... als
    note: '*Aussi + adjective + que* drukt gelijkheid uit tussen twee dingen.'
    example_gloss: De taart is even lekker als de quiche.
  fr.a1.unit14.lesson01.teach.meilleur_que:
    title: Beter dan
    gloss: beter dan
    note: '*Meilleur* is de onregelmatige vergrotende trap van *bon* (goed). Het Frans zegt dus niet *plus bon*.'
    example_gloss: Deze cake is beter dan de eerste.
  fr.a1.unit14.lesson01.teach.cher_bon_marche:
    title: Duur, goedkoop
    gloss: duur, goedkoop
    note: '*Bon marché* is onveranderlijk (het verandert nooit van vorm), ook al lijkt het alsof het zich zou moeten aanpassen zoals andere bijvoeglijke naamwoorden.'
    example_gloss:
    - De kaas is duur.
    - De groenten zijn goedkoop.
  fr.a1.unit14.lesson01.teach.facile_difficile:
    title: Makkelijk, moeilijk
    gloss: makkelijk, moeilijk
    note: Een veelgebruikt paar om recepten te beschrijven. Beide hebben dezelfde vorm in het mannelijk en vrouwelijk; in het meervoud komt er een -s bij (*faciles*, *difficiles*).
    example_gloss:
    - Dit recept is makkelijk.
    - De quiche is een beetje moeilijk.
  fr.a1.unit14.lesson02.teach.le_plus_cher:
    title: De duurste
    gloss: de duurste
    note: '*Le/la plus + bijvoeglijk naamwoord* vormt de overtreffende trap. Het bepaald lidwoord is verplicht, anders dan bij de vergrotende trap.'
    example_gloss: Het is de duurste kaas van de markt.
  fr.a1.unit14.lesson02.teach.la_moins_chere:
    title: De goedkoopste
    gloss: de goedkoopste
    note: '*La moins chère* is vrouwelijk, passend bij *recette*. De mannelijke vorm is *le moins cher*.'
    example_gloss: Het is het goedkoopste recept.
  fr.a1.unit14.lesson02.teach.le_meilleur:
    title: De beste
    gloss: de beste
    note: '*Le meilleur* is de onregelmatige overtreffende trap van *bon*, passend bij de onregelmatige vergrotende trap *meilleur* uit de eerste les.'
    example_gloss: Het is de beste cake van de workshop!
  fr.a1.unit14.lesson02.teach.la_plus_facile:
    title: De makkelijkste
    gloss: de makkelijkste
    note: Een regelmatige overtreffende trap, volgens het patroon *le/la plus + bijvoeglijk naamwoord*.
    example_gloss: Het is het makkelijkste recept om te maken.
  fr.a1.unit14.lesson02.teach.grammar_superlative_note:
    title: Patroon van de overtreffende trap
    gloss: le/la plus + bijvoeglijk naamwoord; meilleur is onregelmatig
    note: De meeste Franse overtreffende trappen zijn regelmatig (*le/la plus + bijvoeglijk naamwoord*), maar *bon* → *meilleur* → *le meilleur* is een uitzondering die je uit het hoofd leert. Net als in het Nederlands (goed – beter – best) is deze reeks onregelmatig.
  fr.a1.unit14.lesson02.teach.comparer_les_prix:
    title: Voorstellen om prijzen te vergelijken
    gloss: Laten we de prijzen vergelijken voordat we kopen.
    note: '*Comparons* is de gebiedende wijs van *comparer* in de *nous*-vorm: ''laten we vergelijken'', een natuurlijke zin bij het winkelen.'
  fr.a1.unit14.lesson03.teach.line01:
    title: Twee opties opmerken
    gloss: 'Inès zegt: kijk, er zijn twee soorten kaas. Welke nemen we?'
    note: '*Lequel* (welke) vraagt de ander te kiezen tussen twee opties die al genoemd zijn.'
  fr.a1.unit14.lesson03.teach.line02:
    title: Vergelijken en de kwaliteit benoemen
    gloss: Mathieu zegt dat deze duurder is dan de andere, maar dat hij er beter uitziet.
    note: '*Avoir l''air* + bijvoeglijk naamwoord (eruitzien als) maakt een uitspraak over kwaliteit zachter als je het nog niet geproefd hebt.'
  fr.a1.unit14.lesson03.teach.line03:
    title: Het oneens zijn met een vergelijking
    gloss: Inès vraagt of hij het zeker weet en zegt dat ze de andere net zo lekker vindt, en goedkoper.
    note: Hier staan *aussi* en *moins* uit de eerste les in één antwoord om beleefd tegen te spreken. *Que* valt weg omdat uit de context duidelijk is welke kaas wordt vergeleken (die van Mathieu).
  fr.a1.unit14.lesson03.teach.line04:
    title: Toegeven over de prijs
    gloss: 'Mathieu stemt in: dat klopt, het is de goedkoopste van de twee.'
    note: '*Des deux* (van de twee) beperkt de overtreffende trap tot dit paar, in plaats van de hele markt.'
  fr.a1.unit14.lesson03.teach.line05:
    title: De uiteindelijke keuze maken
    gloss: 'Inès zegt: dan nemen we die, het is de beste optie voor de workshop.'
    note: '*Celui-là* (die) verwijst terug naar de goedkopere kaas waar het net over ging.'
  fr.a1.unit14.lesson03.teach.line06:
    title: Het voordeel noemen
    gloss: Mathieu is het eens en zegt dat er meer geld overblijft voor het dessert!
    note: '*Il nous reste* (er blijft ons over) is een gebruikelijke manier om te zeggen: ''we hebben nog... over''.'
