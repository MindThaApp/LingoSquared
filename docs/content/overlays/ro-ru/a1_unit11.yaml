teaching:
  ru.a1.unit11.lesson01.teach.vstayu:
    title: встаю
    gloss: mă trezesc
    note: встаю este persoana I singular a verbului вставать („a se trezi, a se da jos din pat”); встаёте este forma cu вы, folosită pentru a întreba pe altcineva.
    example_gloss: Mă trezesc la ora șapte.
  ru.a1.unit11.lesson01.teach.zavtrakayu:
    title: завтракаю
    gloss: mănânc micul dejun
    note: завтракаю este persoana I singular a verbului завтракать („a lua micul dejun”).
    example_gloss: Iau micul dejun la ora opt.
  ru.a1.unit11.lesson01.teach.kogda:
    title: Когда вы встаёте?
    gloss: Când vă sculați?
    note: Когда înseamnă „când”; вы este „dumneavoastră / voi”.
  ru.a1.unit11.lesson02.teach.rabotayu:
    title: работаю
    gloss: lucrez
    note: работаю este persoana I singular a verbului работать („a lucra”); с ... до ... înseamnă „de la ... până la ...” pentru un interval de timp.
    example_gloss: Lucrez de la nouă la cinci.
  ru.a1.unit11.lesson02.teach.uzhinayu:
    title: ужинаю
    gloss: cinez
    note: ужинаю este persoana I singular a verbului ужинать („a cina”); вечером înseamnă „seara”.
    example_gloss: Seara cinez.
  ru.a1.unit11.lesson02.teach.lozhus_spat:
    title: ложусь спать
    gloss: mă culc
    note: ложусь спать este o expresie cu verb reflexiv („mă întind să dorm”) care înseamnă „mă culc”.
    example_gloss: Mă culc la ora unsprezece.
  ru.a1.unit11.lesson03.teach.oleg_chto_delayete:
    title: Oleg întreabă despre dimineață
    gloss: 'Oleg: Ce faceți dimineața?'
    note: Олег începe cu Что вы делаете утром?
  ru.a1.unit11.lesson03.teach.mariya_vstayu_zavtrakayu:
    title: Maria își descrie dimineața
    gloss: 'Maria: Mă trezesc la ora șapte, apoi iau micul dejun la opt.'
    note: Мария înșiră două acțiuni succesive, legate prin потом („apoi”).
  ru.a1.unit11.lesson03.teach.oleg_kogda_rabotayete:
    title: Oleg întreabă despre programul de lucru
    gloss: 'Oleg: Și când lucrați?'
    note: А introduce firesc următoarea întrebare a lui Oleg.
  ru.a1.unit11.lesson03.teach.mariya_rabotayu_uzhinayu:
    title: Maria povestește restul zilei
    gloss: 'Maria: Lucrez de la nouă la cinci. Seara cinez și mă culc la ora unsprezece.'
    note: Мария răspunde cu programul de lucru, apoi cu rutina de seară.
  ru.a1.unit11.lesson03.teach.oleg_ponyatno:
    title: Oleg arată că a înțeles
    gloss: 'Oleg: Am înțeles, mulțumesc.'
    note: Понятно, спасибо încheie schimbul de replici.
