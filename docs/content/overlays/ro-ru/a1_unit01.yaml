course:
  title: Rusă A1
  description: Învață rusa de nivel A1 pentru saluturi de zi cu zi și schimburi sociale scurte, cu explicații detaliate despre alfabetul chirilic și despre diferența de politețe dintre вы și ты.
units:
  ru.a1.unit01.greetings:
    title: Saluturi și formule de rămas-bun
lessons:
  ru.a1.unit01.lesson01.script_ramp:
    title: Descoperă alfabetul chirilic
  ru.a1.unit01.lesson02.vremya_dnya:
    title: Saluturi pentru diferite momente ale zilei
  ru.a1.unit01.lesson03.kak_dela_i_proshchanie:
    title: Ce mai faci? și cum ne luăm rămas-bun
teaching:
  ru.a1.unit01.lesson01.teach.direction:
    title: Direcția de citire
    gloss: Alfabetul rus se citește de la stânga la dreapta, ca alfabetul român.
    note: Rusa (scrisă chirilic) se citește în aceeași direcție ca româna, deci nu trebuie să capeți un obicei nou de citire; trebuie doar să înveți forme și sunete noi de litere.
  ru.a1.unit01.lesson01.teach.letter_z:
    title: З з
    gloss: litera Z
    note: Se pronunță ca „z” din „zi”. Forma minusculă з seamănă cu cifra 3.
  ru.a1.unit01.lesson01.teach.letter_d:
    title: Д д
    gloss: litera D
    note: Se pronunță ca „d” din „dor”. Forma minusculă д este o variantă mică a majusculei, cu mici „picioare” sub linie; nu seamănă deloc cu „d” latin, așa că învață forma de la zero.
  ru.a1.unit01.lesson01.teach.letter_r:
    title: Р р
    gloss: litera R
    note: Se pronunță ca un „r” vibrant, la fel ca în română. Arată ca litera latină „P”, o formă înșelătoare, deci nu o citi „p”.
  ru.a1.unit01.lesson01.teach.letter_a:
    title: А а
    gloss: litera A
    note: Se pronunță ca „a” din „masă”. Arată identic cu „A/a” latin și sună apropiat de acesta.
  ru.a1.unit01.lesson01.teach.letter_v:
    title: В в
    gloss: litera V
    note: Se pronunță ca „v” din „vis”. Arată ca litera latină „B”, o altă formă înșelătoare de care trebuie să te ferești.
  ru.a1.unit01.lesson01.teach.letter_s:
    title: С с
    gloss: litera S
    note: Se pronunță ca „s” din „soare”. Arată ca litera latină „C/c”, dar în rusă nu se pronunță niciodată „k” sau „ce”.
  ru.a1.unit01.lesson01.teach.letter_t:
    title: Т т
    gloss: litera T
    note: Se pronunță ca „t” din „tot”. Forma minusculă т este uneori scrisă de mână ca un „m” mic; mai întâi învață forma tipărită de aici.
  ru.a1.unit01.lesson01.teach.letter_u:
    title: У у
    gloss: litera U
    note: Se pronunță ca „u” din „luna”. Arată ca litera latină „y”, o formă al cărei sunet nu corespunde literei latine asemănătoare.
  ru.a1.unit01.lesson01.teach.letter_ye:
    title: Е е
    gloss: litera Ye
    note: La începutul unui cuvânt sau al unei silabe se pronunță ca „ie” din „iepure”. Arată identic cu „E/e” latin, dar sună destul de diferit.
  ru.a1.unit01.lesson01.teach.hard_sign_note:
    title: 'ъ și ь: semnul dur și semnul moale'
    gloss: 'Semnul dur ъ și semnul moale ь nu au sunet propriu: ele schimbă pronunția literei de lângă ele.'
    note: 'Aceste două semne nu reprezintă niciodată un sunet de sine stătător: ь înmoaie consoana dinaintea lui, iar ъ marchează o separare netă între sunete. Le vei întâlni din nou în cuvinte reale.'
  ru.a1.unit01.lesson01.teach.letter_short_i:
    title: Й й
    gloss: litera I scurt
    note: Se pronunță ca „i” scurt din „hai” — un sunet de alunecare rapid, nu o vocală completă. Apare în Здравствуйте, cuvântul spre care duce această lecție.
  ru.a1.unit01.lesson01.teach.zdravstvuyte_shape:
    title: Здравствуйте
    gloss: bună ziua (formal)
    note: Salutul formal complet, alcătuit din literele tocmai învățate. Pare lung și plin de consoane, dar fiecare literă din el a fost deja prezentată în această lecție.
    example_gloss: Bună ziua! Mă numesc Viktor.
  ru.a1.unit01.lesson02.teach.zdravstvuyte_privet:
    title: Здравствуйте, Привет
    gloss: bună ziua (formal); salut (informal)
    note: Здравствуйте este salutul formal sigur, potrivit oricând în cursul zilei și cu orice necunoscut. Привет este familiar și se folosește cu prietenii și cu cei de aceeași vârstă.
    example_gloss:
    - Bună ziua! Ce mai faceți? (formal)
    - Salut! Ce mai faci? (informal)
  ru.a1.unit01.lesson02.teach.dobroe_utro:
    title: Доброе утро!
    gloss: bună dimineața
    note: Se folosește dimineața, aproximativ până spre sfârșitul dimineții.
  ru.a1.unit01.lesson02.teach.dobryy_den:
    title: Добрый день!
    gloss: bună ziua
    note: Salutul standard de peste zi, potrivit de la sfârșitul dimineții până după-amiaza.
  ru.a1.unit01.lesson02.teach.dobryy_vecher:
    title: Добрый вечер!
    gloss: bună seara
    note: Se folosește când ajungi undeva seara; este un salut, nu o formulă de rămas-bun.
  ru.a1.unit01.lesson02.teach.register_note:
    title: Alegerea unui salut
    gloss: Здравствуйте se potrivește oricând în cursul zilei și într-un cadru politicos. Привет este informal, folosit între prieteni.
    note: Când nu ești sigur de momentul zilei sau de persoana cu care vorbești, Здравствуйте este mereu o alegere sigură; Привет se rezervă persoanelor pe care le cunoști deja bine.
  ru.a1.unit01.lesson03.teach.kak_dela:
    title: Как дела?
    gloss: Ce mai faci? (informal)
    note: Modul informal obișnuit de a întreba cum îi merge cuiva, folosit cu prietenii și cu cei de aceeași vârstă.
  ru.a1.unit01.lesson03.teach.kak_pozhivaete:
    title: Как поживаете?
    gloss: Ce mai faceți? (formal)
    note: Modul formal de a întreba cum îi merge cuiva, potrivit registrului cu вы.
  ru.a1.unit01.lesson03.teach.horosho_spasibo:
    title: Хорошо, спасибо
    gloss: bine, mulțumesc
    note: Un răspuns simplu și pozitiv, potrivit în ambele registre.
    example_gloss: Ce mai faci? — Bine, mulțumesc.
  ru.a1.unit01.lesson03.teach.tak_sebe:
    title: Так себе
    gloss: așa și așa
    note: Un răspuns neutru spre ușor negativ, folosit când lucrurile nu merg nici grozav, nici rău.
    example_gloss: Ce mai faci? — Așa și așa.
  ru.a1.unit01.lesson03.teach.a_u_tebya:
    title: А у тебя?
    gloss: Dar tu? (informal)
    note: Modul informal de a returna întrebarea celeilalte persoane, potrivit registrului cu ты.
  ru.a1.unit01.lesson03.teach.do_svidaniya:
    title: До свидания!
    gloss: la revedere (neutru/formal)
    note: Formula standard de rămas-bun, potrivită în orice situație; sensul ei literal este apropiat de „până ne vedem din nou”.
  ru.a1.unit01.lesson03.teach.poka:
    title: Пока!
    gloss: pa (informal)
    note: O formulă de rămas-bun familiară, foarte frecventă între prieteni și cunoscuți.
  ru.a1.unit01.lesson03.teach.do_zavtra:
    title: До завтра!
    gloss: ne vedem mâine
    note: Un rămas-bun prietenos, folosit când te aștepți să-l revezi pe cineva a doua zi.
  ru.a1.unit01.lesson03.teach.anna:
    title: Anna îl salută pe Maksim
    gloss: 'Anna spune: Bună ziua! Ce mai faci?'
    note: Anna și Maksim sunt colegi care se salută în timpul zilei, la nivelul de familiaritate sugerat de дела (registru informal).
  ru.a1.unit01.lesson03.teach.maksim_reply:
    title: Maksim răspunde și întreabă la rândul lui
    gloss: 'Maksim spune: Bine, mulțumesc. Dar tu?'
    note: Maksim răspunde și returnează întrebarea informal, potrivit registrului Annei.
  ru.a1.unit01.lesson03.teach.anna_close:
    title: Anna încheie schimbul de replici
    gloss: 'Anna spune: Și eu bine. Deci, ne vedem mâine!'
    note: Anna încheie discuția scurtă și trece la un rămas-bun prietenos.
  ru.a1.unit01.lesson03.teach.maksim_close:
    title: Maksim își ia rămas-bun
    gloss: 'Maksim spune: Ne vedem mâine!'
    note: Maksim repetă rămas-bunul Annei, încheind schimbul de replici.
