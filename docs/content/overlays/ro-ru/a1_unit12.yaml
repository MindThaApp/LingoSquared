teaching:
  ru.a1.unit12.lesson01.teach.davay:
    title: Давай пойдём...
    gloss: Hai să mergem...
    note: Давай este un marcaj informal de propunere („hai să”); пойдём este forma pentru „noi” a verbului „a merge”, la viitor; împreună propun o activitate.
  ru.a1.unit12.lesson01.teach.kino:
    title: кино
    gloss: cinema
    note: кино este un substantiv neutru nedeclinabil care înseamnă „cinema”.
    example_gloss: Hai să mergem la cinema.
  ru.a1.unit12.lesson01.teach.zavtra_subbotu:
    title: завтра, в субботу
    gloss: mâine, sâmbătă
    note: завтра înseamnă „mâine”; в субботу folosește в + acuzativ pentru o zi a săptămânii.
    example_gloss: Hai să mergem mâine la cinema.
  ru.a1.unit12.lesson02.teach.soglasen:
    title: Хорошо, я согласен.
    gloss: Bine, sunt de acord.
    note: согласен („de acord”) este forma folosită de un bărbat; o femeie spune согласна.
  ru.a1.unit12.lesson02.teach.ne_mogu:
    title: К сожалению, я не могу.
    gloss: Din păcate, nu pot.
    note: К сожалению („din păcate”) atenuează un refuz; не могу înseamnă „nu pot”.
  ru.a1.unit12.lesson02.teach.vo_skolko:
    title: Во сколько мы встретимся?
    gloss: La ce oră ne întâlnim?
    note: Во сколько întreabă despre ora exactă; встретимся este forma de viitor pentru „noi” a verbului „a se întâlni”.
    example_gloss: Hai la ora șapte.
  ru.a1.unit12.lesson03.teach.nastya_davay_poydyom:
    title: Nastia propune un plan
    gloss: 'Nastia: Hai să mergem sâmbătă la cinema.'
    note: Настя începe cu Давай пойдём в кино в субботу.
  ru.a1.unit12.lesson03.teach.dima_horosho_soglasen:
    title: Dima acceptă și întreabă ora
    gloss: 'Dima: Bine, sunt de acord. La ce oră ne întâlnim?'
    note: Дима acceptă, apoi întreabă Во сколько мы встретимся?
  ru.a1.unit12.lesson03.teach.nastya_davay_v_sem:
    title: Nastia propune ora și locul
    gloss: 'Nastia: Hai la ora șapte, la cinematograf.'
    note: у кинотеатра înseamnă „la/lângă cinematograf”, cu у + genitiv.
  ru.a1.unit12.lesson03.teach.dima_otlichno:
    title: Dima confirmă
    gloss: 'Dima: Perfect, ne vedem sâmbătă.'
    note: Отлично, до субботы încheie schimbul de replici; до субботы înseamnă literal „până sâmbătă”.
