teaching:
  ru.a1.unit02.lesson01.teach.kak_vas_zovut:
    title: Как вас зовут?, Как тебя зовут?
    gloss: Cum vă numiți? (formal); Cum te cheamă? (informal)
    note: Как вас зовут? folosește formalul вас și se spune persoanelor necunoscute sau în contexte politicoase. Как тебя зовут? folosește informalul тебя, pentru prieteni, copii și persoane de aceeași vârstă.
    example_gloss:
    - Bună ziua! Cum vă numiți?
    - Salut! Cum te cheamă?
  ru.a1.unit02.lesson01.teach.menya_zovut:
    title: Меня зовут Виктор.
    gloss: Mă numesc Viktor.
    note: Меня зовут (literal „mă strigă”) este modul standard de a-ți spune numele în rusă, indiferent de registru.
  ru.a1.unit02.lesson01.teach.menya_zovut_anna:
    title: Меня зовут Анна.
    gloss: Mă numesc Anna.
    note: Același tipar, Меня зовут ..., cu alt nume; fraza nu se schimbă după genul vorbitorului.
  ru.a1.unit02.lesson01.teach.register_note:
    title: Alegerea întrebării potrivite
    gloss: Как вас зовут? este politicos sau pentru necunoscuți. Как тебя зовут? este pentru prieteni, copii și persoane de aceeași vârstă.
    note: Diferența formal/informal de aici oglindește opoziția вы/ты, explicată pe larg în lecția 2; вас și тебя sunt formele de caz ale lui вы și ty.
  ru.a1.unit02.lesson02.teach.vy_ty:
    title: вы, ты
    gloss: dumneavoastră / voi (formal); tu (informal)
    note: 'La fel ca în română (dumneavoastră/tu), rusa distinge două forme de adresare: вы se folosește cu necunoscuți, persoane în vârstă și în context profesional; ты, cu prieteni, familie și copii.'
    example_gloss:
    - De unde sunteți? (formal)
    - De unde ești? (informal)
  ru.a1.unit02.lesson02.teach.vy_ty_rule:
    title: Când folosim fiecare formă
    gloss: 'Вы este formal: cu necunoscuți, la serviciu, cu persoane în vârstă. Ты este informal: cu prieteni, familie, copii.'
    note: Folosirea lui ты cu cineva care se așteaptă la вы poate părea prea familiară sau chiar nepoliticoasă; când ai îndoieli, începe cu вы.
  ru.a1.unit02.lesson02.teach.mozhno_na_ty:
    title: Можно на ты?
    gloss: Putem trece la ты (tutuire)?
    note: O modalitate politicoasă de a propune trecerea de la registrul formal вы la cel informal ты, când relația a devenit destul de prietenoasă.
  ru.a1.unit02.lesson02.teach.davayte_pereydyom:
    title: Давайте перейдём на ты.
    gloss: Hai să trecem la ты (la tutuire).
    note: O variantă puțin mai directă și mai primitoare de a propune aceeași schimbare de registru ca în Можно на ты?
  ru.a1.unit02.lesson02.teach.otkuda_vy:
    title: Откуда вы?
    gloss: De unde veniți? (formal)
    note: Folosește formalul вы, potrivit unei prime întâlniri sau unui context profesional.
  ru.a1.unit02.lesson02.teach.otkuda_ty:
    title: Откуда ты?
    gloss: De unde vii? (informal)
    note: Varianta informală, folosită cu cineva pe care îl cunoști bine.
  ru.a1.unit02.lesson02.teach.ya_iz_kanady:
    title: Я из Канады.
    gloss: Sunt din Canada.
    note: Из („din”) cere genitivul, deci Канада devine Канады aici; merită să observi acest tipar al genitivului de proveniență, deși cazurile vor fi explicate mai târziu.
  ru.a1.unit02.lesson02.teach.ya_iz_moskvy:
    title: Я из Москвы.
    gloss: Sunt din Moscova.
    note: 'Același tipar al genitivului de proveniență ca în Я из Канады: Москва devine Москвы după из.'
  ru.a1.unit02.lesson03.teach.davayte_poznakomimsya:
    title: Давайте познакомимся.
    gloss: Hai să facem cunoștință.
    note: O modalitate politicoasă și frecventă de a începe o prezentare între oameni care se întâlnesc pentru prima dată.
  ru.a1.unit02.lesson03.teach.ochen_priyatno:
    title: Очень приятно
    gloss: îmi pare bine
    note: Un răspuns politicos standard după ce cineva tocmai și-a spus numele.
    example_gloss: Mă numesc John. — Îmi pare bine.
  ru.a1.unit02.lesson03.teach.irina_greeting:
    title: Irina Petrovna începe prezentarea
    gloss: 'Irina Petrovna spune: Bună ziua! Hai să facem cunoștință. Mă numesc Irina Petrovna.'
    note: Irina Petrovna îl întâlnește pe John pentru prima dată într-un birou, în context formal, deci folosește politicosul Здравствуйте și registrul вы pe tot parcursul.
  ru.a1.unit02.lesson03.teach.john_reply:
    title: John răspunde cu numele lui
    gloss: 'John spune: Îmi pare bine. Mă numesc John.'
    note: John se potrivește registrului formal, politicos al Irinei Petrovna prin Очень приятно.
  ru.a1.unit02.lesson03.teach.irina_question:
    title: Irina Petrovna îl întreabă pe John de unde este
    gloss: 'Irina Petrovna întreabă: De unde sunteți, John?'
    note: Ea folosește formalul Откуда вы, în acord cu contextul de la birou.
  ru.a1.unit02.lesson03.teach.john_answer:
    title: John răspunde și întoarce întrebarea
    gloss: 'John spune: Sunt din Canada. Dar dumneavoastră de unde sunteți?'
    note: John spune de unde este și întoarce politicos întrebarea cu А вы откуда?
  ru.a1.unit02.lesson03.teach.irina_answer:
    title: Irina Petrovna răspunde
    gloss: 'Irina Petrovna spune: Sunt din Moscova.'
    note: Ea încheie schimbul de replici, folosind tiparul genitivului de proveniență din lecția 2.
