    title: Nastia îl întreabă pe Dima dacă îi place cafeaua
    gloss: 'Nastia: Îți place cafeaua?'
    note: Настя începe cu Тебе нравится кофе?
  ru.a1.unit14.lesson03.teach.dima_da_mne_nravitsya:
    title: Dima răspunde și întreabă la rândul lui
    gloss: 'Dima: Da, îmi place cafeaua. Și ție?'
    note: Дима răspunde Да, мне нравится кофе. А тебе?
