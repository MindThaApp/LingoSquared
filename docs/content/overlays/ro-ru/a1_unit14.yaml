  ru.a1.unit14.lesson01.teach.mne_nravitsya_kofe:
    title: Мне нравится кофе.
    gloss: Îmi place cafeaua.
    note: мне нравится („mie îmi place”) se formează cu pronumele în dativ мне și verbul нравится, pentru a exprima ce îți place. Ca și în română („îmi place”), cel care simte este în dativ.
  ru.a1.unit14.lesson01.teach.ne_nravitsya:
    title: не нравится
    gloss: nu-mi place
    note: не („nu”) pus înaintea lui нравится face construcția negativă.
    example_gloss: Nu-mi place ceaiul.
  ru.a1.unit14.lesson01.teach.chay:
    title: чай
    gloss: ceai
    note: чай este cuvântul pentru „ceai”.
    example_gloss: Îmi place ceaiul.
  ru.a1.unit14.lesson02.teach.ya_hochu_chay:
    title: Я хочу чай.
    gloss: Vreau ceai.
    note: хочу („vreau”) este persoana I singular, prezent, a verbului хотеть, folosit cu un complement direct pentru a exprima o dorință.
  ru.a1.unit14.lesson02.teach.ne_hochu:
    title: не хочу
    gloss: nu vreau
    note: не хочу neagă forma хочу și înseamnă „nu vreau”.
    example_gloss: Nu vreau cafea.
  ru.a1.unit14.lesson02.teach.sok:
