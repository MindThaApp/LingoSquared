  ru.a1.unit37.lesson05.teach.nina_novenkaya_v:
    title: Nina află despre toți
    gloss: Nina este nouă în cafeneaua de limbi. Îl întreabă pe Dima cum sunt ceilalți. Dima îi povestește. Nastya este bună și răbdătoare; lucrează ca asistentă medicală. Igor este amuzant și merge la un curs de spaniolă. Lena este curioasă; îi place să afle lucruri noi. Dima însuși este calm.
    note: Recapitulează trăsăturile de personalitate ale membrilor grupului.
    glosses:
      новенькая: noi
      кафе: cafenea de limbi
      спрашивает: întreabă
      остальные: ceilalți
      рассказывает: povestește
      добрая: amabil / drăguț
      терпеливая: răbdător
      работает: lucrează
      медсестрой: asistentă medicală
      смешной: amuzant
