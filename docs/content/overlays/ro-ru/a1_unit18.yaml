teaching:
  ru.a1.unit18.lesson01.teach.eto_moya_kvartira:
    title: Это моя квартира.
    gloss: Acesta este apartamentul meu.
    note: Это înseamnă „acesta este”; моя („al meu”, feminin) se acordă cu substantivul feminin квартира („apartament”).
  ru.a1.unit18.lesson01.teach.kuhnya:
    title: кухня
    gloss: bucătărie
    note: кухня înseamnă „bucătărie”. стол înseamnă „masă”.
    example_gloss: În bucătărie este o masă.
  ru.a1.unit18.lesson01.teach.spalnya:
    title: спальня
    gloss: dormitor
    note: спальня înseamnă „dormitor”. кровать înseamnă „pat”.
    example_gloss: În dormitor este un pat.
  ru.a1.unit18.lesson02.teach.divan_v_gostinoy:
    title: Диван в гостиной.
    gloss: Canapeaua este în living.
    note: диван înseamnă „canapea”; гостиная înseamnă „living” (гостиной este forma ei de prepozițional după в, „în”).
  ru.a1.unit18.lesson02.teach.stol_na_kuhne:
    title: на
    gloss: pe / la
    note: на se folosește cu кухня (literal „pe bucătărie”, în sens „în bucătărie”) în loc de в, spre deosebire de majoritatea camerelor.
    example_gloss: Masa este în bucătărie.
  ru.a1.unit18.lesson02.teach.vannaya:
    title: ванная
    gloss: baie
    note: ванная înseamnă „baie”.
    example_gloss: Baia este lângă dormitor.
  ru.a1.unit18.lesson03.teach.dima_gde_ty_zhivyosh:
    title: Dima o întreabă pe Nastia unde locuiește
    gloss: 'Dima: Nastia, unde locuiești?'
    note: Дима începe cu Настя, где ты живёшь?
  ru.a1.unit18.lesson03.teach.nastya_zhivu_v_kvartire:
    title: Nastia spune unde locuiește
    gloss: 'Nastya: Locuiesc într-un apartament.'
    note: Настя răspunde Я живу в квартире; живу este forma pentru „eu” a verbului жить („a locui”), iar в квартире este forma de prepozițional a cuvântului квартира.
  ru.a1.unit18.lesson03.teach.dima_skolko_komnat:
    title: Dima întreabă câte camere sunt
    gloss: 'Dima: Câte camere are apartamentul?'
    note: 'După Сколько („câți/câte”) se folosește genitivul plural: сколько комнат.'
  ru.a1.unit18.lesson03.teach.nastya_dve_komnaty:
    title: Nastya enumeră camerele
    gloss: 'Nastya: Două camere: un dormitor și un living. Mai sunt și o bucătărie, și o baie.'
    note: 'Настя continuă: Две комнаты: спальня и гостиная. Кухня и ванная тоже есть.'
