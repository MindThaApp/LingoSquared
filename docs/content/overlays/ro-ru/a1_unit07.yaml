teaching:
  ru.a1.unit07.lesson01.teach.menyu:
    title: меню
    gloss: meniu
    note: меню este un substantiv neutru nedeclinabil, împrumutat din franceză; nu își schimbă niciodată forma.
    example_gloss: Poftiți meniul.
  ru.a1.unit07.lesson01.teach.ofitsiant:
    title: официант, официантка
    gloss: chelner, chelneriță
    note: официант este masculin, iar официантка este feminin, după tiparul obișnuit al terminațiilor pentru gen.
    example_gloss: Chelnerița lucrează la un restaurant.
  ru.a1.unit07.lesson01.teach.stol_svoboden:
    title: Этот столик свободен?
    gloss: Este liberă această masă?
    note: столик este diminutivul lui стол („masă”), folosit în mod obișnuit pentru o masă de restaurant; свободен („liber”) se acordă cu substantivul masculin.
  ru.a1.unit07.lesson01.teach.da_saditites:
    title: Да, садитесь, пожалуйста.
    gloss: Da, luați loc, vă rog.
    note: садитесь este imperativul de politețe/plural al verbului садиться („a se așeza”), folosit cu вы.
  ru.a1.unit07.lesson01.teach.chto_budete_zakazyvat:
    title: Что будете заказывать?
    gloss: Ce veți comanda?
    note: будете заказывать este o formă de viitor („veți comanda”) pe care chelnerul o folosește ca să întrebe ce dorește clientul.
  ru.a1.unit07.lesson02.teach.ya_khochu:
    title: Я хочу ...
    gloss: Vreau ...
    note: хочу este persoana I singular a verbului хотеть („a vrea”), folosit pentru a comanda mâncare și băuturi.
  ru.a1.unit07.lesson02.teach.chay_kofe:
    title: чай, кофе
    gloss: ceai, cafea
    note: Și чай, și кофе sunt băuturi comandate frecvent; кофе este nedeclinabil și masculin din punct de vedere gramatical, deși se termină în -е.
    example_gloss:
    - Vreau ceai.
    - Vreau cafea.
  ru.a1.unit07.lesson02.teach.khleb_borshch:
    title: хлеб, борщ
    gloss: pâine, borș (supă de sfeclă roșie)
    note: борщ este clasica supă rusească de sfeclă roșie; ambele substantive sunt masculine.
    example_gloss:
    - Aveți pâine?
    - Vreau borș.
  ru.a1.unit07.lesson02.teach.salat:
    title: салат
    gloss: salată
    note: и („și”) leagă aici două feluri comandate, ca în борщ и салат.
    example_gloss: Vreau borș și salată.
  ru.a1.unit07.lesson03.teach.morozhenoe:
    title: мороженое
    gloss: înghețată
    note: мороженое este un substantiv neutru care arată ca un adjectiv („[lucru] înghețat”), un tipar frecvent la substantivele rusești pentru mâncare.
    example_gloss: La desert, aduceți înghețată.
  ru.a1.unit07.lesson03.teach.prinesite:
    title: Принесите, пожалуйста, ...
    gloss: Aduceți, vă rog, ...
    note: Принесите este imperativul de politețe/plural al verbului принести („a aduce”), folosit cu вы.
  ru.a1.unit07.lesson03.teach.spasibo:
    title: Спасибо.
    gloss: Mulțumesc.
    note: Спасибо este modul obișnuit de a mulțumi în orice schimb politicos de replici.
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_budete:
    title: Chelnerița întreabă ce doriți să comandați
    gloss: 'Chelnerița: Ce veți comanda?'
    note: Chelnerița începe întrebând Что будете заказывать?
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_borshch:
    title: Turistul comandă mâncare
    gloss: 'Turistul: Vreau borș și salată.'
    note: Турист („turist”) răspunde cu Я хочу борщ и салат.
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_pit:
    title: Chelnerița întreabă despre băuturi
    gloss: 'Chelnerița: Ce veți bea?'
    note: пить („a bea”) se asociază cu будете, ca în întrebarea anterioară cu заказывать.
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_chay:
    title: Turistul comandă o băutură
    gloss: 'Turistul: Vreau ceai.'
    note: 'Turistul răspunde simplu: Я хочу чай.'
  ru.a1.unit07.lesson03.teach.ofitsiantka_a_na_sladkoe:
    title: Chelnerița întreabă despre desert
    gloss: 'Chelnerița: Și la desert?'
    note: 'А на сладкое? este o întrebare scurtă de continuare: „și pentru dulce?”'
  ru.a1.unit07.lesson03.teach.turist_na_sladkoe:
    title: Turistul comandă desertul
    gloss: 'Turistul: La desert, aduceți înghețată, vă rog.'
    note: Turistul răspunde cu На сладкое принесите мороженое, пожалуйста.
  ru.a1.unit07.lesson03.teach.ofitsiantka_khorosho:
    title: Chelnerița confirmă comanda
    gloss: 'Chelnerița: Bine. Mulțumesc.'
    note: Хорошо („bine, în regulă”) confirmă comanda, iar Спасибо încheie politicos schimbul de replici.
