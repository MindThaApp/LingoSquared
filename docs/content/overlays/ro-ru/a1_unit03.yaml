teaching:
  ru.a1.unit03.lesson01.teach.u_menya:
    title: У меня ...
    gloss: Eu am ...
    note: Literal „la mine (este) ...” — modul obișnuit de a spune „am” în rusă, fără un verb „a avea”.
  ru.a1.unit03.lesson01.teach.odin_dva:
    title: один, два
    gloss: unu, doi
    note: 'După два („doi”), substantivul ia o formă specială de genitiv singular: брат („frate”) devine брата, nu forma de plural obișnuită.'
    example_gloss:
    - Am un frate.
    - Am doi frați.
  ru.a1.unit03.lesson01.teach.tri_chetyre:
    title: три, четыре
    gloss: trei, patru
    note: 'Три și четыре cer aceeași formă de genitiv singular ca два: книга („carte”) devine книги după два, три sau четыре.'
    example_gloss:
    - Am trei cărți.
    - Am patru cărți.
  ru.a1.unit03.lesson01.teach.pyat:
    title: пять
    gloss: cinci
    note: 'De la пять („cinci”) în sus, substantivul trece la genitivul plural: рубль („rublă”) devine рублей, nu рубли.'
    example_gloss: Am cinci ruble.
  ru.a1.unit03.lesson01.teach.brat_bratya:
    title: брат, брата
    gloss: frate; frați (după 2–4)
    note: брата este forma de genitiv singular folosită anume după два, три și четыре, nu pluralul obișnuit.
    example_gloss: Am doi frați.
  ru.a1.unit03.lesson01.teach.kniga_knigi:
    title: книга, книги
    gloss: carte; cărți (după 2–4)
    note: книги urmează același model de genitiv singular ca брата, folosit după два, три și четыре.
    example_gloss: Am trei cărți.
  ru.a1.unit03.lesson01.teach.rubl_rubley:
    title: рубль, рублей
    gloss: rublă; ruble (de la 5 în sus)
    note: рублей este forma de genitiv plural folosită de la пять („cinci”) în sus.
    example_gloss: Am cinci ruble.
  ru.a1.unit03.lesson02.teach.shest_sem:
    title: шесть, семь
    gloss: șase, șapte
    note: Ca și пять, atât шесть, cât și семь cer substantivul la genitivul plural.
    example_gloss:
    - Este ora șase.
    - Am șapte ruble.
  ru.a1.unit03.lesson02.teach.vosem_devyat:
    title: восемь, девять
    gloss: opt, nouă
    note: 'Amândouă continuă modelul genitivului plural: книга devine книг, iar рубль devine рублей.'
    example_gloss:
    - Am opt cărți.
    - Am nouă ruble.
  ru.a1.unit03.lesson02.teach.desyat:
    title: десять
    gloss: zece
    note: Se folosește și pentru vârstă, ca în Мне десять лет („Am zece ani”).
    example_gloss: Am zece ani.
  ru.a1.unit03.lesson02.teach.kniga_genitive_plural:
    title: книг
    gloss: cărți (genitiv plural, de la 5 în sus)
    note: Forma de genitiv plural a lui книга, folosită de la пять în sus — observă că pierde complet vocala finală, spre deosebire de книги, folosit după два/три/четыре.
    example_gloss: Am nouă cărți.
  ru.a1.unit03.lesson02.teach.mne_let:
    title: Мне десять лет.
    gloss: Am zece ani.
    note: În rusă, vârsta se exprimă cu dativul „mie” (мне), un număr și лет (genitivul plural al lui „ani”), fără un verb corespunzător lui „a avea”.
  ru.a1.unit03.lesson02.teach.skolko_vam_let:
    title: Сколько вам лет?
    gloss: Câți ani aveți? (formal)
    note: Folosește dativul formal вам, în acord cu registrul вы din Unitatea 2.
  ru.a1.unit03.lesson03.teach.skolko_stoit:
    title: Сколько это стоит?
    gloss: Cât costă asta?
    note: Modul obișnuit de a întreba prețul unui singur obiect, cu стоит („costă”, singular).
  ru.a1.unit03.lesson03.teach.skolko_stoyat:
    title: Сколько стоят яблоки?
    gloss: Cât costă merele?
    note: Se folosește стоят (forma de plural a verbului „a costa”) pentru că яблоки („mere”) este la plural, spre deosebire de singularul стоит din Сколько это стоит?
  ru.a1.unit03.lesson03.teach.rubley:
    title: рубль, рубля, рублей
    gloss: rublă (1); ruble (2–4); ruble (5+)
    note: 'Cuvântul pentru „rublă” își schimbă forma după numărul dinaintea lui: рубль după unu, рубля după два/три/четыре și рублей de la пять în sus.'
    example_gloss:
    - Aceasta costă o rublă.
    - Aceasta costă două ruble.
    - Aceasta costă cinci ruble.
  ru.a1.unit03.lesson03.teach.pokupatel_greeting:
    title: Clientul îl salută pe vânzător
    gloss: 'Cumpărătorul: Bună ziua! Cât costă merele?'
    note: Un cumpărător la o tarabă din piață începe politicos cu Здравствуйте, înainte de a întreba prețul.
  ru.a1.unit03.lesson03.teach.prodavets_apples:
    title: Vânzătorul răspunde
    gloss: 'Vânzătorul: Trei ruble.'
    note: Три рубля folosește forma de genitiv singular a cuvântului „rublă”, specifică numerelor 2–4, potrivită după три.
  ru.a1.unit03.lesson03.teach.pokupatel_bread:
    title: Cumpărătorul întreabă de pâine
    gloss: 'Cumpărătorul: Și pâinea cât costă?'
    note: Cumpărătorul folosește А („și”) ca să pună firesc o a doua întrebare, despre alt produs.
  ru.a1.unit03.lesson03.teach.prodavets_bread:
    title: Vânzătorul răspunde din nou
    gloss: 'Vânzătorul: Șase ruble.'
    note: Шесть рублей folosește forma de genitiv plural, specifică numerelor de la 5 în sus, potrivită după шесть.
  ru.a1.unit03.lesson03.teach.pokupatel_close:
    title: Cumpărătorul încheie politicos
    gloss: 'Cumpărătorul: Bine, mulțumesc!'
    note: Хорошо, спасибо! încheie schimbul din piață pe un ton prietenos, cu vocabular din unitatea despre saluturi.
