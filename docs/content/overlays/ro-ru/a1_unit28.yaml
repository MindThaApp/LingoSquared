    gloss: Dima joacă adesea fotbal.
    note: '*Часто* (adesea) stă înaintea verbului: *Дима часто играет в футбол*. Nu își schimbă niciodată forma.'
  ru.a1.unit28.lesson03.teach.zanimatsya_sportom_govoryat:
    title: Спортом sau un sport anume
    gloss: '*Заниматься спортом* vorbește despre sport în general, iar *заниматься йогой* numește un sport anume.'
    note: 'Ambele sunt corecte: *Я занимаюсь спортом по субботам* (în general) și *Я занимаюсь йогой* (un sport anume).'
  ru.a1.unit28.lesson03.teach.zanimatsya_sportom:
