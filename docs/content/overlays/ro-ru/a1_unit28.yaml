  ru.a1.unit28.lesson04.teach.begat_eto_odin:
    title: Бегать este un singur verb
    gloss: '*Бегать* este un verb cu terminații regulate: *я бегаю*, *ты бегаешь*, *он бегает*.'
    note: '*Бегать* se folosește pentru alergatul ca obicei; în această unitate ai nevoie doar de această formă. Terminațiile sunt *-аю*, *-аешь*, *-ает*.'
  ru.a1.unit28.lesson04.teach.dima_kak_zdorovo:
    title: Reacția lui Dima
    gloss: 'Dima: Ce bine, joc des fotbal acolo.'
  ru.a1.unit28.lesson05.teach.nastya_zanimaetsya_yogoy:
    title: Nastya și Lena despre sport
    gloss: Nastya face yoga de două ori pe săptămână. Îi place să se miște liniștit. Lena nu face yoga, dar îi place să înoate. Lena înoată des, aproape în fiecare săptămână. Ce sport practici tu?
    note: 'Un text scurt care pune față în față două sporturi și două frecvențe: *два раза в неделю* și *почти каждую неделю*.'
    glosses:
      занимается: face
      два: două
      раза: ori
      неделю: săptămână
      йогой: yoga
      любит: iubește
      спокойно: liniștit
      двигаться: mișcare
      плавать: înot
      плавает: înoată
      часто: des
      почти: aproape
      Каким: ce fel de
      спортом: sport
  ru.a1.unit28.lesson05.teach.lena_chasto_plavaet:
    title: Lena înoată des, aproape în fiecare săptămână
    gloss: Lena înoată des, aproape în fiecare săptămână.
