    title: Joc fotbal
    gloss: Joc fotbal.
    note: 'La sporturile de echipă și la jocuri, rusa folosește *играть в* + acuzativ: *Я играю в футбол*.'
  ru.a1.unit28.lesson01.teach.posle_zanimatsya_slovo:
    title: Заниматься + instrumental
    gloss: 'După *заниматься*, sportul stă la instrumental: *заниматься йогой*, *заниматься бегом*, *заниматься плаванием*.'
    note: O singură construcție acoperă toate sporturile -- la acest nivel nu trebuie să înveți un verb separat pentru fiecare sport.
  ru.a1.unit28.lesson02.teach.raz_v_nedelyu:
    title: Ori pe săptămână
    gloss: ori pe săptămână
    example_gloss: Fac yoga de două ori pe săptămână.
  ru.a1.unit28.lesson02.teach.posle_dva_stoit:
    title: 'Numărăm de câte ori: раз și раза'
    gloss: 'După *два* (doi) substantivul este *раза*, iar după *пять* (cinci) este *раз*: *два раза в неделю*, *пять раз в неделю*.'
    note: Completează vocabularul de frecvență învățat deja în unitatea despre hobby-uri.
  ru.a1.unit28.lesson02.teach.ya_zanimayus_yogoy:
    title: Fac yoga de două ori pe săptămână
