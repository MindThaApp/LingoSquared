    title: Joc fotbal. Iubesc fotbalul.
    gloss: Joc fotbal. Iubesc fotbalul.
    note: Un răspuns model din două propoziții, bun de reutilizat la sarcina de scriere a unității.
  ru.a1.unit28.lesson06.teach.nastya_davay_vmeste:
    title: Nastya propune
    gloss: 'Nastya: Facem sport împreună?'
  ru.a1.unit28.lesson06.teach.davay_govoryat_drugu:
    title: Давай și давайте
    gloss: '*Давай* se spune unui singur prieten (informal, cu *ты*); *давайте* se spune mai multor persoane sau politicos, cu *Вы*.'
    note: Reia exact construcția pentru propuneri din lecția despre planuri.
  ru.a1.unit28.lesson06.teach.lena_da_zdorovo:
    title: Lena acceptă
    gloss: 'Lena: Da, cu plăcere! Îmi place foarte mult să înot.'
  ru.a1.unit28.lesson06.teach.dima_ya_by:
    title: Dima preferă fotbalul
    gloss: 'Dima: Aș prefera să joc fotbal.'
  ru.a1.unit28.lesson06.teach.igor_a_ya:
    title: Igor iubește alergatul
    gloss: 'Igor: Iar mie îmi place să alerg.'
  ru.a1.unit28.lesson06.teach.nastya_togda_na:
    title: Nastya încheie conversația
    gloss: 'Nastya: Atunci, săptămâna aceasta, noi patru vom face sport împreună!'
    note: Încheie cercul preferințelor sportive ale celor patru personaje din această unitate.
