course:
  title: Rusă A1
  description: 'Rusă pentru începători despre animale de companie și animale obișnuite: cum se numesc, îngrijirea de bază (plimbare, hrănire, joacă), cum spui ce animale iubești chiar dacă nu ai niciunul și pluralul regulat în rusă.'
