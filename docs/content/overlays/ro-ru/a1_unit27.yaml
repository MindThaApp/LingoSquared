teaching:
  ru.a1.unit27.lesson01.teach.zhivotnoe_domashnee_zhivotnoe:
    title: Animal, un animal de companie
    gloss: animalul / un animal de companie
    note: '*Животное* este cuvântul general pentru animal. *Домашнее животное* (literal „animal domestic”) înseamnă anume animal de companie.'
    example_gloss:
    - Câinele este un animal.
    - Câinele este și un animal de companie.
  ru.a1.unit27.lesson01.teach.sobaka_koshka:
    title: Câinele și pisica
    gloss: câinele / pisica
    example_gloss:
    - Nastya are un câine.
    - Igor are o pisică.
  ru.a1.unit27.lesson01.teach.ryba_ptitsa:
    title: Peștele și pasărea
    gloss: peștele / pasărea
    example_gloss:
    - Bunicul are un pește.
    - Nina are o pasăre.
  ru.a1.unit27.lesson01.teach.u_tebya_est:
    title: Ai un animal de companie?
    gloss: Ai un animal de companie?
    note: '*У тебя есть ...?* este întrebarea pentru „ai”: *у тебя* („la tine”) + *есть* + lucrul respectiv.'
  ru.a1.unit27.lesson01.teach.da_u_menya:
    title: Da, am un câine
    gloss: Da, am un câine.
    note: Un răspuns afirmativ simplu, cu vocabularul nou al acestei unități.
  ru.a1.unit27.lesson01.teach.net_u_menya:
    title: Nu, nu am niciun animal de companie
    gloss: Nu, nu am niciun animal de companie.
    note: '*Нет* + genitiv arată că nu ai ceva: *у меня нет домашнего животного*. Vezi nota de gramatică.'
  ru.a1.unit27.lesson01.teach.posle_net_slovo:
    title: Нет + genitiv
    gloss: 'După *нет*, lucrul care lipsește stă la genitiv: *у меня нет времени*, *у меня нет домашнего животного*.'
    note: 'Compară cu afirmativul: *у меня есть собака* (nominativ), dar *у меня нет собаки* (genitiv).'
  ru.a1.unit27.lesson02.teach.gulyat_s_sobakoy:
    title: A scoate la plimbare (un animal)
    gloss: a scoate la plimbare (un animal)
    note: '*Гулять с собакой* folosește *с* + instrumental, *собакой*. Vezi nota de gramatică.'
    example_gloss: Scot câinele la plimbare în fiecare zi.
  ru.a1.unit27.lesson02.teach.posle_s_slovo:
    title: С + instrumental
    gloss: 'După *с* (cu) substantivul stă la instrumental: *гулять с собакой*, *играть с кошкой*.'
    note: 'Instrumentalul substantivelor feminine se termină în *-ой* sau *-ей*: *собакой*, *кошкой*.'
  ru.a1.unit27.lesson02.teach.kormit:
    title: A da de mâncare
    gloss: a da de mâncare
    example_gloss: Dau de mâncare pisicii în fiecare zi.
  ru.a1.unit27.lesson02.teach.igrat_s:
    title: A se juca cu
    gloss: a se juca cu
    example_gloss: Igor se joacă cu pisica lui.
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den:
    title: Scot câinele la plimbare în fiecare zi
    gloss: Scot câinele la plimbare în fiecare zi.
    note: '*Каждый день* (în fiecare zi) este o expresie de timp fără prepoziție: *Я каждый день гуляю с собакой*.'
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den_2:
    title: Dau de mâncare pisicii în fiecare zi
    gloss: Dau de mâncare pisicii în fiecare zi.
    note: '*Кормить* cere animalul ca complement direct la acuzativ: *кошка* devine *кошку*.'
  ru.a1.unit27.lesson03.teach.posle_lyubit_zhivotnoe:
    title: Animale după любить
    gloss: 'După *любить*, numele de animal stă la acuzativ, care la substantivele animate este identic cu genitivul plural: *собак*, *кошек*, *птиц*, *рыб*.'
    note: Modelul obișnuit al pluralului rusesc, prezentat aici pentru prima dată, cu numele de animale ca exemple.
  ru.a1.unit27.lesson03.teach.sobak_koshek:
    title: Câini și pisici
    gloss: câini / pisici
    example_gloss:
    - Dima iubește câinii.
    - Lena iubește pisicile.
  ru.a1.unit27.lesson03.teach.ryb_ptits:
    title: Pești și păsări (plural)
    gloss: pești / păsări
    example_gloss:
    - Iubesc peștii.
    - Bunicul iubește păsările.
  ru.a1.unit27.lesson03.teach.ya_lyublyu_zhivotnykh:
    title: Iubesc animalele
    gloss: Iubesc animalele.
    note: '*Люблю* + acuzativ: *Я люблю животных*. La substantivele animate la plural, acuzativul arată ca genitivul.'
  ru.a1.unit27.lesson03.teach.lena_lyubit_koshek:
    title: Lena iubește pisicile, dar nu are animal de companie
    gloss: Lena iubește pisicile, dar nu are animal de companie.
    note: Pregătește contrastul pe care se construiește textul de citit al lecției.
  ru.a1.unit27.lesson04.teach.dima_u_tebya:
    title: Dima o întreabă despre animalul de companie
    gloss: 'Dima: Ai un animal de companie, Nastia?'
  ru.a1.unit27.lesson04.teach.nastya_da_u:
    title: Nastia are un câine
    gloss: 'Nastia: Da, am un câine.'
  ru.a1.unit27.lesson04.teach.dima_kak_on:
    title: Dima întreabă cum arată
    gloss: 'Dima: Cum arată?'
    note: Întrebarea *Как он выглядит?* se poate folosi și pentru animale. *Он* se folosește pentru un animal de sex masculin.
  ru.a1.unit27.lesson04.teach.nastya_u_nego:
    title: Nastia îți descrie câinele
    gloss: 'Nastia: Are blană maro și este mic.'
    note: Reia vocabularul culorilor și al mărimii din unitatea despre aspect, acum pentru blana unui animal, nu pentru părul unei persoane.
  ru.a1.unit27.lesson04.teach.o_zhivotnom_mozhno:
    title: Он și она pentru animale
    gloss: 'Despre un animal de companie se poate spune *он* sau *она*, ca despre o persoană: *У меня собака, он маленький*.'
    note: Gramatical, *собака* este feminin, dar rușii spun adesea *он* când știu că animalul este mascul.
  ru.a1.unit27.lesson04.teach.dima_ty_gulyaesh:
    title: Dima întreabă despre plimbări
    gloss: 'Dima: Te plimbi cu el în fiecare zi?'
  ru.a1.unit27.lesson04.teach.nastya_da_ya:
    title: Nastia își descrie programul zilnic
    gloss: 'Nastia: Da, mă plimb cu el în fiecare zi și îi dau de mâncare.'
  ru.a1.unit27.lesson05.teach.dima_i_lena:
    title: Dima, Lena și Igor despre animale
    gloss: 'Dima și Lena iubesc amândoi animalele, dar niciunul dintre ei nu are un animal de companie. Dima iubește câinii, iar Lena iubește pisicile. Igor, în schimb, are un animal de companie: o pisică. Se joacă adesea cu pisica lui și îi dă mâncare în fiecare zi. Tu ai un animal de companie?'
    note: Contrastează a iubi un animal cu a avea cu adevărat unul -- chiar scopul comunicativ al unității.
    glosses:
      любят: iubesc
      оба: amândoi
      животных: animale
      обоих: amândoi
      домашнего: animal de companie
      собак: câini
      кошек: pisici
      кошка: pisică
      играет: se joacă
      даёт: dă
      каждый: fiecare
      корм: mâncare
  ru.a1.unit27.lesson05.teach.igor_chasto_igraet:
    title: Igor se joacă adesea cu pisica lui
    gloss: Igor se joacă adesea cu pisica lui.
    note: '*Со своей кошкой*: *со* este forma lui *с* înaintea unui grup de consoane, iar *своей* înseamnă „al lui însuși”, referindu-se la subiect.'
  ru.a1.unit27.lesson05.teach.ya_lyublyu_sobak:
    title: Iubesc câinii. Nu am animal de companie.
    gloss: Iubesc câinii. Nu am animal de companie.
    note: Un răspuns model din două propoziții, bun de reutilizat la sarcina de scriere a unității.
  ru.a1.unit27.lesson06.teach.nastya_nina_u:
    title: Nastia o întreabă pe Nina
    gloss: 'Nastia: Nina, ai și tu un animal de companie?'
  ru.a1.unit27.lesson06.teach.nina_da_u:
    title: Nina are o pasăre pe nume Pico
    gloss: 'Nina: Da, am o pasăre. Se numește Pico.'
    note: '*Его зовут Пико* înseamnă literal „îl cheamă Pico”. Așa se spune numele în rusă.'
  ru.a1.unit27.lesson06.teach.dima_kak_zdorovo:
    title: Reacția lui Dima
    gloss: 'Dima: Ce frumos! Ce faci cu el în fiecare zi?'
  ru.a1.unit27.lesson06.teach.nina_ya_kazhdyy:
    title: Nina îi dă de mâncare în fiecare zi
    gloss: 'Nina: Îi dau de mâncare în fiecare zi.'
  ru.a1.unit27.lesson06.teach.dima_ya_tozhe:
    title: Dima iubește și el păsările
    gloss: 'Dima: Și eu iubesc păsările.'
  ru.a1.unit27.lesson06.teach.nastya_kak_khorosho:
    title: Nastia încheie conversația
    gloss: 'Nastia: Ce bine că ne plac animalele tuturor celor trei!'
    note: Închide cercul faptelor despre animale ale celor trei personaje din această unitate.
