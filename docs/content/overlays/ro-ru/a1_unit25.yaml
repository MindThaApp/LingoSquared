course:
  title: Rusă A1
  description: 'Rusă pentru începători despre activitățile din timpul liber: vocabular pentru hobby-uri, expresii de frecvență, cum întrebi și cum răspunzi ce face cineva în timpul liber și cum compari hobby-urile a două persoane.'
