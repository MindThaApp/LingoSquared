    title: Nastia și Dima vorbesc despre hobby-uri
  ru.a1.unit25.lesson05.dima_i_nastya_sravnivayut:
    title: Dima și Nastia își compară hobby-urile
  ru.a1.unit25.lesson06.planiruem_vykhodnye_vmeste:
    title: Planuri pentru un weekend împreună
teaching:
  ru.a1.unit25.lesson01.teach.chitat_zanimatsya_sportom:
    title: Citit, sport, gătit
    gloss: a citi, a face sport, a găti
    note: 'Trei verbe frecvente pentru hobby-uri: *читать* (a citi), *заниматься спортом* (a face sport) și *готовить* (a găti).'
    example_gloss:
    - Îmi place să citesc o carte.
    - Fac sport sâmbăta.
    - Îmi place să gătesc pentru prieteni.
  ru.a1.unit25.lesson01.teach.svobodnoe_vremya:
    title: Timpul liber
    gloss: timpul liber
    note: '*Свободное время* este expresia-cheie pentru a vorbi despre hobby-uri. Adjectivul *свободное* se termină în *-ое* pentru a se acorda cu *время*.'
    example_gloss: În timpul liber, îmi place să citesc.
  ru.a1.unit25.lesson01.teach.v_svobodnoe_vremya:
    title: Spui ce faci în timpul liber
    gloss: În timpul liber, îmi place să citesc.
    note: '*Люблю* este forma pentru *я* a verbului *любить* (a-i plăcea, a iubi). După el, al doilea verb rămâne la infinitiv: *люблю читать*.'
  ru.a1.unit25.lesson02.teach.slushat_muzyku_risovat:
    title: Muzică, desen, jocuri video
    gloss: a asculta muzică, a desena, a juca jocuri video
    note: 'Încă trei hobby-uri: *слушать музыку* (a asculta muzică), *рисовать* (a desena) și *играть в игры* (a juca jocuri video).'
    example_gloss:
    - Îmi place să ascult muzică.
    - Desenez des.
    - Îmi place să joc jocuri video cu prietenii.
  ru.a1.unit25.lesson02.teach.ya_lyublyu_slushat:
    title: Spui că îți place să asculți muzică
    gloss: Îmi place să ascult muzică.
    note: '*Слушать* se leagă direct de complement: *музыку* este acuzativul lui *музыка*, cu terminația *-у*.'
  ru.a1.unit25.lesson02.teach.ya_lyublyu_igrat:
    title: Spui că îți place să joci jocuri video cu prietenii
    gloss: Îmi place să joc jocuri video cu prietenii.
    note: '*С друзьями* (cu prietenii): după prepoziția *с* urmează cazul instrumental, de aceea *друзьями*.'
  ru.a1.unit25.lesson03.teach.vsegda_chasto_inogda:
    title: Mereu, des, uneori, niciodată
    gloss: mereu, des, uneori, niciodată
    note: 'Cele patru adverbe de frecvență de bază: *всегда*, *часто*, *иногда*, *никогда*. Ele nu își schimbă niciodată forma.'
    example_gloss:
    - Fac mereu sport sâmbăta.
    - Citesc des o carte.
    - Desenez uneori.
    - Nu joc niciodată jocuri video.
  ru.a1.unit25.lesson03.teach.kazhduyu_nedelyu_kazhdye:
    title: În fiecare săptămână, în fiecare weekend
    gloss: în fiecare săptămână, în fiecare weekend
    note: '*Каждую неделю* și *каждые выходные* înseamnă amândouă „în fiecare”, dar terminația se schimbă după substantiv: vezi cardul următor.'
    example_gloss:
    - Gătesc pentru prieteni în fiecare săptămână.
    - Fac sport în fiecare weekend.
  ru.a1.unit25.lesson03.teach.nedelya_zhenskogo_roda:
    title: 'Каждый: feminin și plural'
    gloss: '*Неделя* este de genul feminin, deci se spune *каждую неделю*. *Выходные* este la plural, deci se spune *каждые выходные*.'
    note: '*Каждый* se acordă cu substantivul, ca orice adjectiv: *каждый день* (masculin), *каждую неделю* (feminin, acuzativ), *каждые выходные* (plural).'
  ru.a1.unit25.lesson03.teach.chto_ty_delaesh:
    title: Întrebi despre timpul liber
    gloss: Ce faci în timpul liber?
    note: Aceasta este întrebarea de bază a unității -- folosește-o ca să întrebi pe oricine despre hobby-uri.
  ru.a1.unit25.lesson04.teach.nastya_my_chasto:
    title: Nastia aduce vorba despre hobby-uri
    gloss: 'Nastia: Ne plimbăm des împreună. Dar ce mai faci tu în timpul liber, Dima?'
    note: '*Мы часто гуляем вместе*: la *мы* (noi) verbul primește terminația *-ем*, iar *гулять* înseamnă a te plimba de plăcere.'
  ru.a1.unit25.lesson04.teach.dima_ya_lyublyu:
    title: Hobby-urile lui Dima
    gloss: 'Dima: Îmi place să gătesc, și acasă la fel. Și, în plus, fac des sport.'
    note: '*И дома тоже* (și acasă la fel): *и ... тоже* arată că Dima gătește de plăcere, nu doar la serviciu.'
  ru.a1.unit25.lesson04.teach.nastya_ty_i:
    title: Nastia este surprinsă
    gloss: 'Nastia: Gătești și acasă? Doar gătești toată ziua la serviciu!'
    note: '*Весь день* (toată ziua) subliniază cât de mult gătește Dima deja la serviciu. *Весь* se acordă cu *день*, de genul masculin.'
  ru.a1.unit25.lesson04.teach.dima_da_no:
    title: Dima explică
    gloss: 'Dima: Da, dar gătitul mă relaxează. Și tu, ce îți place să faci?'
    note: '*Готовить меня расслабляет* pune activitatea pe primul loc: literal „gătitul mă relaxează”, cu *меня* în acuzativ.'
  ru.a1.unit25.lesson04.teach.nastya_ya_lyublyu:
    title: Hobby-urile Nastiei
    gloss: 'Nastia: Îmi place să citesc și ascult des muzică.'
    note: 'Două verbe de hobby din lecțiile anterioare sunt legate prin *и* (și): *люблю читать и часто слушаю музыку*.'
  ru.a1.unit25.lesson04.teach.dima_ty_tozhe:
    title: Dima întreabă despre jocuri
    gloss: 'Dima: Joci și tu jocuri video?'
    note: 'O întrebare scurtă cu da/nu: în rusă ordinea cuvintelor rămâne aceeași, se schimbă doar intonația: *Ты тоже играешь в игры?*'
  ru.a1.unit25.lesson04.teach.nastya_net_ya:
    title: Nastia răspunde
    gloss: 'Nastia: Nu, nu joc niciodată jocuri video. În schimb, desenez uneori!'
    note: '*Никогда не* (niciodată) cere încă un *не* înaintea verbului, ca în română. *Иногда* (uneori) face contrastul.'
  ru.a1.unit25.lesson05.teach.my_s_dimoy:
    title: Comparăm hobby-urile
    gloss: Eu și Dima ne plimbăm des împreună. Dar avem și alte hobby-uri. Lui Dima îi place să gătească, și acasă la fel, și face des sport. Mie îmi place să citesc și ascult des muzică. Desenez uneori, dar nu joc niciodată jocuri video. Ce îți place ție să faci în timpul liber?
    note: Mesajul Nastiei reia fapte din lecția anterioară și se încheie cu întrebarea de bază a unității, adresată cititorului.
    glosses:
      гуляем: a se plimba
      часто: des
      вместе: împreună
      другие: alte
      готовить: gătește
      любит: cu plăcere
      дома: acasă
      занимается: face sport
      читать: citesc
      слушаю: ascult
      музыку: muzică
      рисую: desenez
      иногда: uneori
      играю: joc jocuri video
      никогда: niciodată
      свободное: liber
      время: timp
  ru.a1.unit25.lesson06.teach.dima_chto_ty:
    title: Dima întreabă despre weekend
    gloss: 'Dima: Ce faci în weekendul acesta?'
    note: '*В эти выходные* (în weekendul acesta): *выходные* este la plural, deci și *эти* este la plural, iar *в* pentru timp cere acuzativul.'
  ru.a1.unit25.lesson06.teach.nastya_poka_ne:
    title: Nastia nu s-a decis
    gloss: 'Nastia: Încă nu știu. Îmi place să citesc, dar vreau și să ies afară.'
    note: '*Хочу ещё выйти на улицу* înseamnă „vreau și să ies afară”. *Хочу* este forma pentru *я* a verbului *хотеть*.'
  ru.a1.unit25.lesson06.teach.dima_davay_pogulyaem:
    title: Dima propune un plan
    gloss: 'Dima: Hai să ne plimbăm împreună? Apoi gătesc eu pentru noi.'
    note: '*Давай погуляем* este modul obișnuit de a propune să faceți ceva împreună, iar *потом* (apoi) așază următorul pas în ordine.'
  ru.a1.unit25.lesson06.teach.nastya_khoroshaya_ideya:
    title: Nastia acceptă
    gloss: 'Nastia: Idee bună! Îmi place și să mă plimb, și să gătesc.'
    note: '*Мне нравится* înseamnă literal „mie îmi este plăcut”: persoana este la dativ (*мне*), iar lucrul care place urmează după.'
  ru.a1.unit25.lesson06.teach.dima_otlichno_togda:
    title: Dima confirmă
    gloss: 'Dima: Perfect. Atunci ne vedem sâmbătă!'
    note: '*Увидимся в субботу* (ne vedem sâmbătă): *в* cu o zi a săptămânii cere acuzativul, deci *суббота* devine *субботу*.'
