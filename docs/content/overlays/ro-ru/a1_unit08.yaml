teaching:
  ru.a1.unit08.lesson01.teach.magazin:
    title: магазин
    gloss: magazin
    note: магазин este un substantiv masculin care înseamnă „magazin”.
    example_gloss: Mergem la magazin.
  ru.a1.unit08.lesson01.teach.skolko:
    title: сколько
    gloss: cât / câți
    note: сколько întreabă despre cantitate sau preț și apare adesea împreună cu стоит.
    example_gloss: Cât costă pâinea?
  ru.a1.unit08.lesson01.teach.stoit:
    title: стоит
    gloss: costă
    note: стоит este persoana a III-a singular a verbului стоить („a costa”), folosit cu un subiect la singular precum хлеб.
    example_gloss: Pâinea costă o sută de ruble.
  ru.a1.unit08.lesson01.teach.rubl:
    title: рубль
    gloss: rublă
    note: рубль este moneda Rusiei; сто („o sută”) cere genitivul plural рублей.
    example_gloss: Pâinea costă o sută de ruble.
  ru.a1.unit08.lesson01.teach.khleb_moloko:
    title: хлеб, молоко
    gloss: pâine, lapte
    note: хлеб este masculin, iar молоко este neutru; amândouă sunt produse obișnuite de zi cu zi.
    example_gloss:
    - Cât costă pâinea?
    - Cât costă laptele?
  ru.a1.unit08.lesson02.teach.dayte_pozhaluysta:
    title: Дайте, пожалуйста, ...
    gloss: Dați-mi, vă rog ...
    note: Дайте este imperativul de politețe/plural al verbului дать („a da”), folosit cu вы.
  ru.a1.unit08.lesson02.teach.kilogramm:
    title: килограмм
    gloss: kilogram
    note: килограмм este unitatea obișnuită pentru cumpărarea legumelor, fructelor sau a pâinii după greutate.
    example_gloss: Dați-mi un kilogram, vă rog.
  ru.a1.unit08.lesson02.teach.polkilo:
    title: полкило
    gloss: jumătate de kilogram
    note: полкило este un compus din пол- („jumătate”) și кило (forma scurtă, informală, a lui килограмм).
    example_gloss: Dați-mi o jumătate de kilogram, vă rog.
  ru.a1.unit08.lesson02.teach.shtuka:
    title: штука
    gloss: bucată
    note: штука denumește obiecte numărate individual; пять штук folosește genitivul plural după numărul пять.
    example_gloss:
    - Vă rog, dați-mi o bucată.
    - Vă rog, dați-mi cinci bucăți.
  ru.a1.unit08.lesson03.teach.pomidory_ogurtsy:
    title: помидоры, огурцы
    gloss: roșii, castraveți
    note: Ambele sunt substantive la plural pentru legume; помидоры este masculin, iar огурцы este tot masculin.
    example_gloss:
    - Aveți roșii?
    - Aveți castraveți?
  ru.a1.unit08.lesson03.teach.kartofel_kapusta:
    title: картофель, капуста
    gloss: cartofi, varză
    note: картофель este un substantiv colectiv masculin (folosit ca un nenumărabil), iar капуста este feminin.
    example_gloss:
    - Aveți cartofi?
    - Aveți varză?
  ru.a1.unit08.lesson03.teach.yabloki_apelsiny:
    title: яблоки, апельсины
    gloss: mere, portocale
    note: кило яблок folosește genitivul plural яблок după кило („un kilogram de mere”), la fel ca кило апельсинов.
    example_gloss:
    - Cât costă un kilogram de mere?
    - Cât costă un kilogram de portocale?
  ru.a1.unit08.lesson03.teach.u_vas_est:
    title: У вас есть ...?
    gloss: Aveți ...? (formal)
    note: Folosește forma de politețe вас, modul obișnuit de a întreba un vânzător dacă are un produs.
  ru.a1.unit08.lesson03.teach.da_u_menya_est:
    title: Да, у меня есть ...
    gloss: Da, am ...
    note: У меня есть („la mine este”) este modul obișnuit de a spune „am”, răspunsul vânzătorului.
  ru.a1.unit08.lesson03.teach.pokupatel_pomidory:
    title: Cumpărătorul întreabă de roșii
    gloss: 'Cumpărător: Aveți roșii?'
    note: Cumpărătorul începe cu întrebarea politicoasă У вас есть ...?
  ru.a1.unit08.lesson03.teach.prodavets_da_est:
    title: Vânzătorul răspunde afirmativ
    gloss: 'Vânzător: Da, avem.'
    note: Да, есть este răspunsul scurt, obișnuit — literal „da, există” — fără a repeta produsul.
  ru.a1.unit08.lesson03.teach.pokupatel_kilo_yablok:
    title: Cumpărătorul întreabă prețul
    gloss: 'Cumpărător: Cât costă un kilogram de mere?'
    note: кило яблок folosește genitivul plural яблок după кило.
  ru.a1.unit08.lesson03.teach.prodavets_dvesti:
    title: Vânzătorul spune prețul
    gloss: 'Vânzător: Două sute de ruble.'
    note: Двести înseamnă „două sute”; ca și сто, este urmat de genitivul plural рублей.
  ru.a1.unit08.lesson03.teach.pokupatel_dayte_kilogramm:
    title: Cumpărătorul cumpără un kilogram
    gloss: 'Cumpărător: Un kilogram de mere, vă rog.'
    note: Дайте ..., пожалуйста din lecția 2, acum cu килограмм яблок („un kilogram de mere”).
  ru.a1.unit08.lesson03.teach.prodavets_khorosho:
    title: Vânzătorul dă marfa
    gloss: 'Vânzător: Bine, poftiți.'
    note: Пожалуйста înseamnă aici „poftiți”, când vânzătorul întinde cumpărătura, nu „vă rog”.
