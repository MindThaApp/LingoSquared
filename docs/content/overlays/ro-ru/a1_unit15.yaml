teaching:
  ru.a1.unit15.lesson01.teach.kofe_luchshe_chem_chay:
    title: Кофе лучше, чем чай.
    gloss: Cafeaua este mai bună decât ceaiul.
    note: лучше („mai bine”) împreună cu чем („decât”) formează comparativul de bază.
  ru.a1.unit15.lesson01.teach.huzhe:
    title: хуже
    gloss: mai rău
    note: хуже („mai rău”) este comparativul opus lui лучше și se folosește la fel, cu чем.
    example_gloss: Ceaiul este mai rău decât cafeaua.
  ru.a1.unit15.lesson01.teach.kakoy:
    title: какой / какое
    gloss: care / ce fel de
    note: какой (masculin) și какое (neutru) întreabă „care dintre două”, acordându-se în gen cu substantivul.
    example_gloss: Care cafea este mai bună?
  ru.a1.unit15.lesson02.teach.eto_kafe_bolshe:
    title: Это кафе больше, чем то.
    gloss: Cafeneaua aceasta este mai mare decât aceea.
    note: больше („mai mare / mai mult”) împreună cu чем formează un comparativ de mărime; это/то („acesta/acela”) arată cele două cafenele.
  ru.a1.unit15.lesson02.teach.menshe:
    title: меньше
    gloss: mai mic / mai puțin
    note: меньше („mai mic / mai puțin”) este comparativul opus lui больше.
    example_gloss: Cafeneaua aceea este mai mică decât aceasta.
  ru.a1.unit15.lesson02.teach.dom:
    title: дом
    gloss: casă
    note: дом („casă”) împreună cu этот/тот („acest/acel”) îți permite să compari mărimea a două case.
    example_gloss: Casa aceasta este mai mare decât aceea.
  ru.a1.unit15.lesson03.teach.nastya_kakoye_kafe_luchshe:
    title: Nastya întreabă care cafenea este mai bună
    gloss: 'Nastya: Care cafenea este mai bună?'
    note: Настя începe cu Какое кафе лучше?
  ru.a1.unit15.lesson03.teach.dima_eto_kafe_luchshe:
    title: Dima răspunde
    gloss: 'Dima: Cafeneaua aceasta este mai bună decât aceea.'
    note: Дима răspunde Это кафе лучше, чем то.
  ru.a1.unit15.lesson03.teach.nastya_a_bolshe:
    title: Nastya întreabă despre mărime, Dima confirmă
    gloss: 'Nastya: Și cafeneaua aceasta este mai mare? Dima: Da, cafeneaua aceasta este mai mare decât aceea.'
    note: 'Настя întreabă А это кафе больше?, iar Дима confirmă: Да, это кафе больше, чем то.'
