teaching:
  ru.a1.unit09.lesson01.teach.gde:
    title: где
    gloss: unde
    note: где întreabă despre locul în care se află ceva și apare adesea împreună cu находится.
    example_gloss: Unde este magazinul?
  ru.a1.unit09.lesson01.teach.nakhoditsya:
    title: находится
    gloss: se află
    note: находится este persoana a treia singular a verbului находиться („a se afla”) și se folosește cu un subiect la singular, ca магазин.
    example_gloss: Unde se află magazinul?
  ru.a1.unit09.lesson01.teach.ulitsa:
    title: улица
    gloss: stradă
    note: улица este de genul feminin; în на Тверской улице („pe strada Tverskaia”) apare cazul prepozițional după на.
    example_gloss: Magazinul este pe strada Tverskaia.
  ru.a1.unit09.lesson01.teach.gde_nakhoditsya_magazin:
    title: Где находится магазин?
    gloss: Unde se află magazinul?
    note: Modelul obișnuit de întrebare pentru a afla unde se află orice loc.
  ru.a1.unit09.lesson02.teach.bank_apteka:
    title: банк, аптека
    gloss: bancă, farmacie
    note: банк este de genul masculin, iar аптека este de genul feminin; ambele sunt locuri frecvente în oraș.
    example_gloss:
    - Unde se află banca?
    - Unde se află farmacia?
  ru.a1.unit09.lesson02.teach.vokzal_gostinitsa:
    title: вокзал, гостиница
    gloss: gară, hotel
    note: вокзал este de genul masculin, iar гостиница este de genul feminin.
    example_gloss:
    - Unde se află gara?
    - Unde se află hotelul?
  ru.a1.unit09.lesson02.teach.restoran_biblioteka:
    title: ресторан, библиотека
    gloss: restaurant, bibliotecă
    note: ресторан este de genul masculin, iar библиотека este de genul feminin; numele de străzi ca Чайковского și Пушкина apar la genitiv după улица.
    example_gloss:
    - Unde se află restaurantul?
    - Unde se află biblioteca?
  ru.a1.unit09.lesson03.teach.chto_est_na_vashey_ulitse:
    title: Что есть на вашей улице?
    gloss: Ce este pe strada dumneavoastră?
    note: вашей este posesivul de politețe „dumneavoastră”, care se acordă cu substantivul feminin улице la cazul prepozițional.
  ru.a1.unit09.lesson03.teach.anna_chto_est:
    title: Anna întreabă despre stradă
    gloss: 'Anna: Ce este pe strada dumneavoastră?'
    note: Anna începe dialogul cu Что есть на вашей улице?
  ru.a1.unit09.lesson03.teach.viktor_na_moey_ulitse:
    title: Viktor enumeră trei locuri
    gloss: 'Viktor: Pe strada mea este un magazin, o bibliotecă și o bancă.'
    note: На моей улице есть enumeră lucrurile folosind есть („este/sunt”), legate prin и.
  ru.a1.unit09.lesson03.teach.anna_a_gde_bank:
    title: Anna întreabă unde este banca
    gloss: 'Anna: Și unde se află banca?'
    note: А introduce firesc a doua întrebare a Annei, despre unul dintre locurile numite de Viktor.
  ru.a1.unit09.lesson03.teach.viktor_bank_na_pushkina:
    title: Viktor spune pe ce stradă este banca
    gloss: 'Viktor: Banca este pe strada Pușkin.'
    note: Viktor răspunde cu Банк на улице Пушкина, folosind genitivul Пушкина după улице.
  ru.a1.unit09.lesson03.teach.anna_spasibo_bolshoe:
    title: Anna îi mulțumește lui Viktor
    gloss: 'Anna: Mulțumesc mult.'
    note: Спасибо большое întărește спасибо cu большое („mare”) și este o formulă obișnuită pentru „mulțumesc mult”.
  ru.a1.unit09.lesson03.teach.viktor_pozhaluysta:
    title: Viktor răspunde
    gloss: 'Viktor: Cu plăcere.'
    note: Пожалуйста este răspunsul la спасибо, adică „cu plăcere”.
