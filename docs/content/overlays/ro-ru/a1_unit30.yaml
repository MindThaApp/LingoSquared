      звонит: sună
      каждый: fiecare
      день: zi
      пользуется: folosește
      телефоном: telefon
      приложением: aplicație
      компьютера: computer
      дома: acasă
      интернетом: internet
      ищет: verifică
      утро: dimineață
      прогноз: prognoza meteo
      идёт: merge
      бегать: la alergat
      отправляет: trimite
      часто: des
      сообщение: mesaj
      пользуешься: folosești
  ru.a1.unit30.lesson05.teach.igor_kazhdoe_utro:
    title: Igor caută prognoza în fiecare dimineață
    gloss: Igor caută prognoza meteo în fiecare dimineață.
  ru.a1.unit30.lesson05.teach.lena_chasto_otpravlyaet:
    title: Lena îi scrie des Nastiei
    gloss: Lena îi trimite des Nastiei un mesaj.
  ru.a1.unit30.lesson06.teach.nastya_ya_vizhu:
    title: Nastia confirmă planul
    gloss: 'Nastia: Văd mesajul. Hai să facem sport sâmbătă la zece în parc?'
  ru.a1.unit30.lesson06.teach.dima_da_i:
    title: Dima confirmă vremea
    gloss: 'Dima: Da, și sâmbătă este senin!'
  ru.a1.unit30.lesson06.teach.igor_ya_togda:
    title: Planul lui Igor
    gloss: 'Igor: Atunci eu alerg puțin. După aceea joc și fotbal.'
    note: '*Потом* (după aceea) pune al doilea plan după primul, iar *побегаю* este perfectiv: „voi alerga puțin”.'
  ru.a1.unit30.lesson06.teach.lena_ya_luchshe:
    title: Planul Lenei
    gloss: 'Lena: Prefer să înot, dar vin și eu în parc.'
    note: '*Я лучше поплаваю* înseamnă „mai bine înot”. *Лучше* înaintea verbului exprimă o preferință.'
  ru.a1.unit30.lesson06.teach.nastya_zdorovo_do:
    title: Nastia încheie conversația
    gloss: 'Nastia: Grozav! Ne vedem sâmbătă în parc!'
    note: Încheie într-o singură replică atât firul de mesaje din această unitate, cât și planul din unitatea despre sport.
