    note: '*Каждый день* (în fiecare zi) apare din nou: *Я каждый день пользуюсь телефоном*. După *пользоваться* obiectul este la instrumental.'
  ru.a1.unit30.lesson02.teach.prilozhenie:
    title: Aplicația
    gloss: aplicația
