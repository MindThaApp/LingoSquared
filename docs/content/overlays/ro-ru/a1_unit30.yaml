    title: Mesajul
    gloss: mesajul
    example_gloss: Trimit un mesaj prin aplicație.
  ru.a1.unit30.lesson02.teach.prognoz_pogody_slovo:
    title: Прогноз погоды și сообщение
    gloss: '*Прогноз погоды* are două cuvinte, iar al doilea, *погоды*, este la genitiv. *Сообщение* este un mesaj pe care îl poți trimite sau citi.'
    note: Leagă cuvântul nou de substantivul compus învățat deja în unitatea despre vreme.
  ru.a1.unit30.lesson02.teach.nastya_otpravlyaet_soobshchenie:
    title: Nastya trimite un mesaj prin aplicație
    gloss: Nastya trimite un mesaj prin aplicație.
    note: '*Отправляет* (trimite) este un verb regulat. Mesajul este complement direct la acuzativ, iar *через приложение* înseamnă „prin aplicație”.'
  ru.a1.unit30.lesson02.teach.dima_chitaet_soobshchenie:
    title: Dima citește mesajul
    gloss: Dima citește mesajul.
  ru.a1.unit30.lesson03.teach.iskat:
    title: A căuta (o informație)
    gloss: a verifica, a căuta o informație
    example_gloss: Verific prognoza meteo.
  ru.a1.unit30.lesson03.teach.posle_polzovatsya_slovo:
    title: Пользоваться și искать
    gloss: '*Пользоваться* se construiește cu instrumentalul (*пользоваться телефоном*), iar *искать* cu acuzativul (*искать прогноз*).'
    note: 'Ambele verbe sunt regulate: *я пользуюсь, ты пользуешься*; *я ищу, ты ищешь*.'
  ru.a1.unit30.lesson03.teach.igor_ishchet_prognoz:
    title: Igor caută prognoza meteo
    gloss: Igor caută prognoza meteo.
  ru.a1.unit30.lesson03.teach.potom_on_idyot:
    title: Apoi merge la alergat
    gloss: Apoi merge la alergat.
    note: '*Идёт бегать* înseamnă „merge să alerge”: *идёт* este un verb de mișcare, urmat de infinitivul acțiunii pentru care se duce.'
  ru.a1.unit30.lesson04.teach.nastya_davay_v:
    title: Nastia face o propunere
    gloss: 'Nastia: Hai să facem sport sâmbătă la zece?'
  ru.a1.unit30.lesson04.teach.dima_khoroshaya_ideya:
    title: Dima este de acord
    gloss: 'Dima: Bună idee! Caut prognoza meteo.'
    note: '*Хорошая идея* este un adjectiv feminin însoțit de un substantiv feminin. *Поищу* este viitorul perfectiv: „voi căuta”.'
  ru.a1.unit30.lesson04.teach.dima_v_subbotu:
    title: Dima verifică vremea
    gloss: 'Dima: Sâmbătă este senin!'
    note: '*Солнечно* este un cuvânt pentru vreme. Nu este nevoie de verbul „a fi”: *В субботу солнечно*.'
  ru.a1.unit30.lesson04.teach.igor_ya_vizhu:
    title: Igor vede mesajul
    gloss: 'Igor: Văd mesajul. Pe sâmbătă!'
  ru.a1.unit30.lesson04.teach.ty_uzhe_znaesh:
    title: До + genitiv
    gloss: 'Știi deja *До свидания!* Poți numi și o zi: *До субботы!*, *До завтра!* După *до* substantivul este la genitiv.'
    note: Extinde formula de rămas-bun din unitatea despre saluturi la o zi anume.
  ru.a1.unit30.lesson05.teach.nastya_kazhdyy_den:
    title: Cine ce folosește?
    gloss: Nastia îl sună pe Dima în fiecare zi. Ea folosește telefonul, nu aplicația. Dima nu are computer acasă, dar folosește internetul de pe telefon. Igor caută prognoza meteo în fiecare dimineață. Apoi merge să alerge. Lena îi trimite des Nastiei mesaje. Și tu folosești telefonul în fiecare zi?
    note: Compară obiceiurile celor patru personaje legate de dispozitive, la fel ca textul comparativ din unitatea despre sport.
