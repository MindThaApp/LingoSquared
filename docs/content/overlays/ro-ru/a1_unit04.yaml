teaching:
  ru.a1.unit04.lesson01.teach.kakoy_den:
    title: Какой сегодня день?
    gloss: Ce zi este azi?
    note: Какой se acordă cu substantivul masculin день („zi”).
  ru.a1.unit04.lesson01.teach.ponedelnik_vtornik:
    title: понедельник, вторник
    gloss: luni, marți
    note: Zilele săptămânii se scriu cu literă mică în rusă, ca și în română.
    example_gloss:
    - Astăzi este luni.
    - Astăzi este marți.
  ru.a1.unit04.lesson01.teach.sreda_chetverg:
    title: среда, четверг
    gloss: miercuri, joi
    note: Ca toate numele zilelor săptămânii în rusă, среда și четверг se scriu cu literă mică; majusculă apare doar la începutul propoziției.
    example_gloss:
    - Astăzi este miercuri.
    - Astăzi este joi.
  ru.a1.unit04.lesson01.teach.pyatnitsa_subbota:
    title: пятница, суббота
    gloss: vineri, sâmbătă
    note: În суббота apare un dublu б -- o capcană frecventă de ortografie.
    example_gloss:
    - Astăzi este vineri.
    - Astăzi este sâmbătă.
  ru.a1.unit04.lesson01.teach.voskresenye:
    title: воскресенье
    gloss: duminică
    note: Ultima zi din lista zilelor săptămânii în rusă.
    example_gloss: Astăzi este duminică.
  ru.a1.unit04.lesson01.teach.segodnya:
    title: Сегодня ...
    gloss: Astăzi este ...
    note: După Сегодня urmează direct numele zilei, fără verb de legătură; în rusă nu se folosește „este” la prezent, spre deosebire de română.
  ru.a1.unit04.lesson02.teach.kakoe_chislo:
    title: Какое сегодня число?
    gloss: Ce dată este astăzi?
    note: Какое se acordă cu substantivul neutru число („dată/număr”), spre deosebire de какой день de mai sus.
  ru.a1.unit04.lesson02.teach.pervoe_tretye:
    title: первое, третье
    gloss: întâi (1), al treilea (3)
    note: Numeralele ordinale din dată au terminația de neutru (-ое/-ье), pentru că se acordă cu substantivul subînțeles число.
    example_gloss:
    - Astăzi este 1 ianuarie.
    - Astăzi este 3 ianuarie.
  ru.a1.unit04.lesson02.teach.pyatoe_desyatoe:
    title: пятое, десятое
    gloss: al cincilea (5), al zecelea (10)
    note: Același model de ordinal la neutru ca la первое/третье.
    example_gloss:
    - Astăzi este 5 octombrie.
    - Astăzi este 10 aprilie.
  ru.a1.unit04.lesson02.teach.yanvar_aprel:
    title: января, апреля
    gloss: ianuarie (în dată), aprilie (în dată)
    note: 'După dată, numele lunii trece la genitiv: январь devine января, iar апрель devine апреля.'
    example_gloss:
    - Astăzi este 3 ianuarie.
    - Astăzi este 10 aprilie.
  ru.a1.unit04.lesson02.teach.oktyabrya:
    title: октября
    gloss: octombrie (în dată)
    note: Forma de genitiv a lui октябрь, după același model ca января/апреля, după o dată.
    example_gloss: Astăzi este 5 octombrie.
  ru.a1.unit04.lesson03.teach.kakoe_segodnya_chislo:
    title: Какое сегодня число?
    gloss: Ce dată este astăzi?
    note: Modul standard de a întreba data calendaristică.
  ru.a1.unit04.lesson03.teach.vo_vtornik:
    title: во вторник
    gloss: marți
    note: 'Prepoziția в devine во înaintea lui вторник, pentru o pronunțare mai ușoară; вторник în sine nu se schimbă aici (zilele feminine se schimbă: в среду, в пятницу, в субботу).'
  ru.a1.unit04.lesson03.teach.vstrecha:
    title: встреча
    gloss: întâlnire
    note: Substantiv uzual pentru o întâlnire sau o programare stabilită.
    example_gloss: Întâlnirea este marți.
  ru.a1.unit04.lesson03.teach.anna_kakoy_den:
    title: Anna întreabă ce zi este
    gloss: 'Anna: Ce zi este astăzi?'
    note: Anna începe dialogul cu întrebarea despre день, din lecția 1.
  ru.a1.unit04.lesson03.teach.viktor_sreda:
    title: Viktor răspunde cu ziua și data
    gloss: 'Viktor: Astăzi este miercuri, 3 ianuarie.'
    note: Viktor spune împreună ziua săptămânii și data cu ordinal, folosind luna la genitiv, января.
  ru.a1.unit04.lesson03.teach.anna_khorosho:
    title: Anna propune marțea
    gloss: 'Anna: Bine. Întâlnirea este marți?'
    note: Хорошо confirmă că a înțeles răspunsul lui Viktor, înainte ca Anna să pună următoarea întrebare.
  ru.a1.unit04.lesson03.teach.viktor_da:
    title: Viktor confirmă data
    gloss: 'Viktor: Da, marți, 9 ianuarie.'
    note: 'Да confirmă, apoi Viktor repetă ziua și data. Pentru a spune ÎN ce dată are loc ceva, ordinalul însuși trece la genitiv: девятого января („pe 9 ianuarie”), comparați cu Сегодня девятое января („Astăzi este 9 ianuarie”).'
