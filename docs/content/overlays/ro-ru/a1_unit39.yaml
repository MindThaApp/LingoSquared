  ru.a1.unit39.lesson06.teach.nastya_mne_nravitsya:
    title: Nastia răspunde
    gloss: 'Nastia: Îmi place iarna. Iarna patinăm.'
  ru.a1.unit39.lesson06.teach.igor_po_moemu:
    title: Igor răspunde
    gloss: 'Igor: După părerea mea, toamna este frumoasă. Toamna este liniștită.'
