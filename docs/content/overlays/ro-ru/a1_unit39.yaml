    title: O conversație despre anotimpuri
    gloss: 'Acum este primăvară. Lalelele sunt frumoase. Nina întreabă: Ce anotimp consideri frumos? Dima spune: Îmi place vara. Vara înotăm. Nastia spune: Îmi place iarna. Iarna patinăm.'
