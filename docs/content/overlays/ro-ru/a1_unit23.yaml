teaching:
  ru.a1.unit23.lesson01.teach.allo_eto_dima:
    title: Алло, это Дима.
    gloss: Alo, sunt Dima.
    note: Алло se folosește când răspunzi sau începi o convorbire telefonică.
    example_gloss: Alo, Nastia? Sunt Dima.
  ru.a1.unit23.lesson01.teach.govori:
    title: говори
    gloss: vorbește
    note: говори este o cerere informală adresată unei singure persoane.
    example_gloss: Vorbește rar.
  ru.a1.unit23.lesson01.teach.medlenno:
    title: медленно
    gloss: încet
    note: медленно înseamnă „încet”, „rar”.
    example_gloss: Vorbește rar, te rog.
  ru.a1.unit23.lesson02.teach.povtori:
    title: Повтори, пожалуйста.
    gloss: Repetă, te rog.
    note: Повтори este informal, potrivit pentru un prieten.
    example_gloss: Dima, repetă, te rog.
  ru.a1.unit23.lesson02.teach.napishi:
    title: напиши
    gloss: scrie / trimite mesaj
    note: напиши poate însemna „scrie” sau „trimite un mesaj cuiva”, în acest context.
    example_gloss: Trimite-mi mesaj.
  ru.a1.unit23.lesson02.teach.soobshchenie:
    title: сообщение
    gloss: mesaj
    note: сообщение înseamnă „mesaj”.
    example_gloss: Trimite-mi un mesaj.
  ru.a1.unit23.lesson03.teach.dima_allo_nastya:
    title: Dima începe convorbirea
    gloss: 'Dima: Alo, Nastia? Sunt Dima.'
    note: Dima se prezintă clar la telefon.
  ru.a1.unit23.lesson03.teach.nastya_govori_medlenno:
    title: Nastia îl roagă să vorbească rar
    gloss: 'Nastia: Salut, Dima. Vorbește rar, te rog.'
    note: Говори медленно, пожалуйста îi cere cuiva să vorbească rar; Привет este un salut informal pentru un prieten.
  ru.a1.unit23.lesson03.teach.dima_vstrecha_sem:
    title: Dima dă detaliul
    gloss: 'Dima: Întâlnirea e la ora șapte.'
    note: Detaliul important este ora.
  ru.a1.unit23.lesson03.teach.nastya_povtori:
    title: Nastia cere să repete
    gloss: 'Nastia: Repetă, te rog.'
    note: Повтори, пожалуйста este a doua strategie pentru a cere o clarificare.
  ru.a1.unit23.lesson03.teach.dima_v_sem_u_kino:
    title: Dima repetă și spune locul
    gloss: 'Dima: La ora șapte, lângă cinematograf.'
    note: El repetă și adaugă locul întâlnirii.
