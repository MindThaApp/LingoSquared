teaching:
  ru.a1.unit06.lesson01.teach.u_menya_est:
    title: У меня есть ...
    gloss: Eu am ...
    note: 'Literal: „la mine (este) ...” – modul obișnuit de a spune „am” în rusă. În Unitatea 3, У меня два брата folosea același tipar У меня; есть se omite de obicei când vorbești despre câți ai.'
  ru.a1.unit06.lesson01.teach.eto:
    title: Это ...
    gloss: Aceasta este ... / Acesta este ...
    note: Это se folosește pentru a prezenta sau a arăta o persoană ori un lucru, indiferent de genul gramatical.
  ru.a1.unit06.lesson01.teach.mat_otets:
    title: мать, отец
    gloss: mamă, tată
    note: мать face parte dintr-un mic grup de substantive feminine care se termină în semnul moale (-ь).
    example_gloss:
    - Aceasta este mama mea.
    - Acesta este tatăl meu.
  ru.a1.unit06.lesson01.teach.brat_sestra:
    title: брат, сестра
    gloss: frate, soră
    note: брат este cuvântul cu care ai numărat deja în Unitatea 3 („У меня два брата”); сестра este corespondentul lui feminin.
    example_gloss:
    - Acesta este fratele meu.
    - Am o soră.
  ru.a1.unit06.lesson01.teach.moy_moya:
    title: мой, моя
    gloss: al meu (masculin), a mea (feminin)
    note: мой se folosește cu substantive masculine precum отец și брат; моя se folosește cu substantive feminine precum мать și сестра.
  ru.a1.unit06.lesson02.teach.babushka_dedushka:
    title: бабушка, дедушка
    gloss: bunică, bunic
    note: 'Ambele se termină în -а, dar дедушка desemnează un bărbat și se acordă la masculin: мой дедушка, dar моя бабушка.'
    example_gloss:
    - Aceasta este bunica mea.
    - Acesta este bunicul meu.
  ru.a1.unit06.lesson02.teach.muzh_zhena:
    title: муж, жена
    gloss: soț, soție
    note: муж este masculin, iar жена este feminin, după tiparul obișnuit al terminațiilor.
    example_gloss:
    - Acesta este soțul meu.
    - Aceasta este soția mea.
  ru.a1.unit06.lesson02.teach.syn_doch:
    title: сын, дочь
    gloss: fiu, fiică
    note: дочь, ca și мать, este un substantiv feminin care se termină în semnul moale (-ь).
    example_gloss: Am un fiu și o fiică.
  ru.a1.unit06.lesson02.teach.deti:
    title: дети
    gloss: copii
    note: дети este pluralul neregulat al lui ребёнок („copil”) – singularul și pluralul sunt cuvinte complet diferite.
    example_gloss: Aveți copii?
  ru.a1.unit06.lesson02.teach.u_vas_est:
    title: У вас есть ...?
    gloss: Aveți ...? (formal)
    note: Folosește forma de politețe вас, în acord cu registrul вы din Unitatea 2.
  ru.a1.unit06.lesson03.teach.kto_eto:
    title: Кто это?
    gloss: Cine este acesta? / Cine este aceasta?
    note: Modul obișnuit de a întreba cine este cineva, de exemplu când te uiți la o fotografie.
  ru.a1.unit06.lesson03.teach.eyo_zovut:
    title: Её зовут Анна.
    gloss: O cheamă Anna.
    note: 'Literal: „o strigă Anna” – Её („pe ea”) este complementul verbului зовут, nu subiectul.'
  ru.a1.unit06.lesson03.teach.maksim_kto_eto:
    title: Maksim întreabă despre fotografie
    gloss: 'Maksim: Cine este în fotografie?'
    note: Maksim începe arătând spre fotografie și întrebând Кто это на фото?
  ru.a1.unit06.lesson03.teach.olga_moya_semya:
    title: Olga își prezintă familia
    gloss: 'Olga: Aceasta este familia mea.'
    note: Это моя семья folosește семья („familie”), un substantiv feminin, deci моя se acordă cu el.
  ru.a1.unit06.lesson03.teach.olga_vot_otets:
    title: Olga numește trei membri ai familiei
    gloss: 'Olga: Iată-l pe tatăl meu, pe mama mea și pe fratele meu.'
    note: Вот („iată”) introduce enumerarea; fiecare posesiv (мой/моя) se acordă cu substantivul care urmează.
  ru.a1.unit06.lesson03.teach.maksim_a_kto_devochka:
    title: Maksim întreabă despre fetiță
    gloss: 'Maksim: Și cine este fetița aceea?'
    note: А leagă firesc întrebarea următoare a lui Maksim, despre a patra persoană din fotografie.
  ru.a1.unit06.lesson03.teach.olga_eto_moya_doch:
    title: Olga își numește fiica
    gloss: 'Olga: Aceasta este fiica mea. O cheamă Anna.'
    note: Olga răspunde cu моя дочь și apoi spune numele cu Её зовут Анна.
