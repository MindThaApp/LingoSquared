teaching:
  ru.a1.unit13.lesson01.teach.vchera_byl:
    title: Вчера я был дома.
    gloss: Ieri am fost acasă.
    note: вчера înseamnă „ieri”; был este forma de trecut masculin a verbului „a fi”, folosită de un bărbat.
  ru.a1.unit13.lesson01.teach.byla:
    title: была
    gloss: a fost (spus de o femeie)
    note: была este forma de trecut feminin a verbului „a fi”; verbul se acordă cu genul subiectului.
    example_gloss: Ieri ea a fost acasă.
  ru.a1.unit13.lesson01.teach.vecherom:
    title: вечером
    gloss: seara
    note: вечером înseamnă „seara” și precizează când a avut loc o acțiune din trecut.
    example_gloss: Ieri seară am fost acasă.
  ru.a1.unit13.lesson02.teach.hodil_v_kino:
    title: Вчера я ходил в кино.
    gloss: Ieri am fost la cinema.
    note: ходил (masculin) este trecutul verbului „a merge (pe jos)”, folosit pentru o deplasare dus-întors încheiată.
  ru.a1.unit13.lesson02.teach.hodila:
    title: ходила
    gloss: a mers (spus de o femeie)
    note: ходила este forma de trecut feminin a verbului „a merge (pe jos)”.
    example_gloss: Ieri ea a fost la cinema.
  ru.a1.unit13.lesson02.teach.smotrel_film:
    title: смотрел фильм
    gloss: s-a uitat la un film
    note: смотрел (masculin) / смотрела (feminin) este trecutul verbului „a se uita, a privi”; фильм înseamnă „film”.
    example_gloss: M-am uitat la un film.
  ru.a1.unit13.lesson03.teach.nastya_chto_ty_delal:
    title: Nastia îl întreabă pe Dima ce a făcut
    gloss: 'Nastia: Ce ai făcut ieri?'
    note: Настя începe cu Что ты делал вчера?
  ru.a1.unit13.lesson03.teach.dima_hodil_smotrel:
    title: Dima răspunde și întreabă la rândul lui
    gloss: 'Dima: Am fost la cinema. M-am uitat la un film bun. Și tu?'
    note: Дима răspunde Я ходил в кино. Смотрел хороший фильм. А ты?
  ru.a1.unit13.lesson03.teach.nastya_byla_otdyhala:
    title: Nastia răspunde
    gloss: 'Nastia: Am fost acasă. M-am odihnit.'
    note: Настя încheie cu Я была дома. Отдыхала.
