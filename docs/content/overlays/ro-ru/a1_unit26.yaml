  ru.a1.unit26.lesson01.vysokiy_nevysokiy_staryy_i:
    title: Înalt, scund, bătrân și tânăr
  ru.a1.unit26.lesson02.opisyvaem_volosy:
    title: Descrierea părului
  ru.a1.unit26.lesson03.glaza_i_kak_vyglyadit:
    title: Ochii și cum arată cineva?
  ru.a1.unit26.lesson04.nastya_opisyvaet_ninu:
    title: Nastia o descrie pe Nina
  ru.a1.unit26.lesson05.sravnivaem_igorya_i_lenu:
    title: Igor și Lena, comparați
  ru.a1.unit26.lesson06.dima_uznayot_ninu:
    title: Dima o recunoaște pe Nina
teaching:
  ru.a1.unit26.lesson01.teach.vysokiy_nevysokiy:
    title: Înalt și scund
    gloss: înalt / scund
    note: '*Высокий* descrie o persoană înaltă, iar *невысокий* una scundă (literal „neînalt”). Terminația se schimbă după gen: *высокая*, *невысокая*.'
    example_gloss:
    - Lena este înaltă.
    - Igor este scund.
  ru.a1.unit26.lesson01.teach.staryy_molodoy:
    title: Bătrân și tânăr
    gloss: bătrân / tânăr
    note: '*Старый* și *молодой* descriu aici o impresie generală despre vârstă, nu un număr exact de ani.'
    example_gloss:
    - Bunicul este bătrân.
    - Dima este tânăr.
  ru.a1.unit26.lesson01.teach.prilagatelnoe_menyaetsya_po:
    title: Adjectivul se schimbă după gen
    gloss: 'Adjectivul se acordă cu persoana: *он высокий, она высокая*; *он старый, она старая*.'
    note: Adjectivele masculine se termină în *-ый*, *-ий* sau *-ой* (*высокий*, *молодой*); cele feminine se termină în *-ая* (*высокая*, *молодая*).
  ru.a1.unit26.lesson01.teach.lena_vysokaya_a:
    title: Lena este înaltă, iar Igor este scund
    gloss: Lena este înaltă, iar Igor este scund.
    note: 'Două afirmații sunt puse în contrast cu *а* („iar”): *Лена высокая, а Игорь невысокий*.'
  ru.a1.unit26.lesson02.teach.volosy:
    title: Părul
    gloss: părul
    note: '*Волосы* („părul”) este la plural în rusă: *У Насти светлые волосы*, niciodată un substantiv la singular.'
    example_gloss: Dima are părul scurt și negru.
  ru.a1.unit26.lesson02.teach.svetlye_kashtanovye_sedye:
    title: Blond, șaten și cărunt
    gloss: blond / șaten / cărunt
    note: 'Trei culori de păr la plural, acordate cu *волосы*: *светлые*, *каштановые*, *седые*.'
    example_gloss:
    - Nastia are părul blond.
    - Igor are părul șaten.
    - Bunicul are părul cărunt.
  ru.a1.unit26.lesson02.teach.dlinnye_korotkie:
    title: Lung și scurt (părul)
    gloss: lung / scurt (părul)
    note: '*Длинные* („lungi”) și *короткие* („scurte”) se acordă și ele cu pluralul *волосы*.'
    example_gloss:
    - Lena are părul lung.
    - Igor are părul scurt.
  ru.a1.unit26.lesson02.teach.volosy_stoyat_vo:
    title: Adjectivele se acordă cu волосы
    gloss: '*Волосы* este la plural, deci și adjectivul este la plural: *длинные волосы*, *короткие волосы*, *светлые волосы*, *чёрные волосы*.'
    note: Adjectivele la plural se termină în *-ые* sau *-ие*. Aceeași terminație o vei vedea cu *глаза* în lecția următoare.
  ru.a1.unit26.lesson02.teach.posle_u_imya:
    title: У + genitiv
    gloss: 'După *у*, posesorul este la genitiv: *у Насти* (Nastia are), *у Димы* (Dima are), *у неё* (ea are).'
    note: 'Așa spune rusa „a avea”: *у* + genitiv + lucrul posedat. Nu există verbul „a avea”.'
  ru.a1.unit26.lesson02.teach.u_dimy_korotkie:
    title: Dima are părul scurt și negru
    gloss: Dima are părul scurt și negru.
    note: '*Чёрные* („negre”) se acordă cu pluralul *волосы*. Litera *ё* este scrisă mereu în acest curs.'
  ru.a1.unit26.lesson02.teach.u_nasti_dlinnye:
    title: Nastia are părul lung și blond
    gloss: Nastia are părul lung și blond.
    note: Combină într-o propoziție naturală vocabularul lecției despre lungime și culoare.
  ru.a1.unit26.lesson03.teach.glaza:
    title: Ochii
    gloss: ochii
    note: '*Глаза* („ochii”) este pluralul lui *глаз*; terminația de plural este *-а*.'
    example_gloss: Dima are ochi căprui.
  ru.a1.unit26.lesson03.teach.golubye_karie_zelyonye:
    title: Albastru, căprui și verde
    gloss: albastru / căprui / verde
    note: '*Голубые* înseamnă albastru deschis, *карие* înseamnă căprui (doar pentru ochi), iar *зелёные* înseamnă verzi. Toate trei sunt la plural.'
    example_gloss:
    - Nastia are ochi albaștri.
    - Igor are ochi căprui.
    - Lena are ochi verzi.
  ru.a1.unit26.lesson03.teach.glaza_stoyat_vo:
    title: Adjectivele se acordă cu глаза
    gloss: '*Глаза* este la plural, deci și adjectivul este la plural: *голубые глаза*, *карие глаза*, *зелёные глаза*.'
    note: 'Ochii căprui sunt *карие*, nu *коричневые*, iar părul șaten este *каштановые*: rusa folosește cuvinte diferite pentru ochi și pentru păr.'
  ru.a1.unit26.lesson03.teach.kak_vyglyadit_nastya:
    title: Cum arată Nastia?
    gloss: Cum arată Nastia?
    note: '*Как выглядит ...?* este întrebarea de bază a acestei unități. Verbul *выглядит* se acordă cu un subiect la singular.'
  ru.a1.unit26.lesson03.teach.u_nasti_dlinnye:
    title: Nastia are părul lung și blond și ochi albaștri
    gloss: Nastia are părul lung și blond și ochi albaștri.
    note: 'Un răspuns model leagă părul și ochii cu *и*: *У Насти длинные светлые волосы и голубые глаза*.'
  ru.a1.unit26.lesson04.teach.nastya_v_yazykovoe:
    title: Nastia o prezintă pe Nina
    gloss: 'Nastia: La cafeneaua lingvistică va veni o fată nouă. O cheamă Nina.'
    note: '*Придёт* („va veni”) este viitorul perfectiv. *Её зовут Нина* înseamnă literal „o strigă Nina”.'
  ru.a1.unit26.lesson04.teach.dima_khorosho_kak:
    title: Dima întreabă cum arată
    gloss: 'Dima: Bine! Cum arată?'
    note: Aceeași întrebare de bază, acum cu *она* („ea”) în loc de un nume.
  ru.a1.unit26.lesson04.teach.nastya_ona_nevysokaya:
    title: Nastia descrie înălțimea și părul Ninei
    gloss: 'Nastia: Este scundă și are părul scurt și blond.'
    note: Combină *невысокая* din lecția 1 cu cuvintele despre păr din lecția 2. *И у неё* adaugă a doua informație.
  ru.a1.unit26.lesson04.teach.dima_a_kakie:
    title: Dima întreabă despre ochii ei
    gloss: 'Dima: Dar ce ochi are?'
    note: '*Какие у неё глаза?* folosește *у неё* („ea are”). *Неё* este forma lui *она* după prepoziția *у*.'
  ru.a1.unit26.lesson04.teach.nastya_u_neyo:
    title: Nastia descrie ochii Ninei
    gloss: 'Nastia: Are ochi verzi.'
    note: Reia *зелёные глаза* din lecția 3, cu *у неё* pentru „ea are”.
  ru.a1.unit26.lesson04.teach.dima_spasibo_togda:
    title: Dima o va recunoaște
    gloss: 'Dima: Mulțumesc! Atunci o voi recunoaște.'
    note: '*Я её узнаю* („o voi recunoaște”): *её* este acuzativul lui *она*, pentru că Nina este complementul direct.'
  ru.a1.unit26.lesson05.teach.igor_i_lena:
    title: Igor și Lena, comparați
    gloss: Igor și Lena sunt frate și soră, dar arată diferit. Igor este scund și are părul scurt și șaten și ochi căprui. Lena este mai înaltă decât Igor și are părul lung și șaten și ochi verzi. Tu cum arăți?
    note: O scurtă comparație care reia toate cuvintele pentru culori și lungime învățate până acum și se încheie cu întrebarea centrală a unității, adresată cititorului.
    glosses:
      брат: frate
      сестра: soră
      выглядят: a arăta
      по-разному: diferit
      невысокий: scund
      короткие: scund
      каштановые: castaniu
      волосы: păr
      карие: castaniu
      глаза: ochi
      выше: mai înalt
      длинные: lung
      зелёные: verde
      выглядишь: arăți / ai aspectul (ca în как ты выглядишь?)
  ru.a1.unit26.lesson05.teach.posle_vyshe_stoit:
    title: Comparația cu выше
    gloss: 'După *выше* („mai înalt”), persoana cu care se compară este la genitiv: *Лена выше Игоря*.'
    note: Comparativul *выше* nu se schimbă după gen. Persoana cu care se compară este la genitiv sau vine după *чем*.
  ru.a1.unit26.lesson05.teach.u_leny_volosy:
    title: Lena are părul mai lung decât Igor
    gloss: Lena are părul mai lung decât Igor.
    note: '*У Лены волосы длиннее, чем у Игоря*: *длиннее* nu se schimbă niciodată, iar *чем* („decât”) introduce a doua parte.'
  ru.a1.unit26.lesson05.teach.u_menya_korotkie:
    title: Am părul scurt și castaniu
    gloss: Am părul scurt și castaniu.
    note: 'O propoziție model despre aspectul tău: *У меня* („eu am”) + adjectiv + substantiv.'
  ru.a1.unit26.lesson06.teach.dima_smotri_eto:
    title: Dima o observă pe Nina
    gloss: 'Dima: Uite, aceea e Nina? Are părul scurt și blond și ochi verzi.'
    note: '*Смотри* („uită-te”) este imperativul informal, folosit la fel în dialogurile anterioare.'
  ru.a1.unit26.lesson06.teach.nastya_da_eto:
    title: Nastia confirmă
    gloss: 'Nastia: Da, e Nina!'
    note: O confirmare scurtă și naturală.
  ru.a1.unit26.lesson06.teach.nina_privet_ty:
    title: Nina îl salută pe Dima
    gloss: 'Nina: Salut, tu ești Dima?'
    note: 'O întrebare simplă, informală: rusa nu folosește verbul „a fi” aici, doar *Ты Дима?*'
  ru.a1.unit26.lesson06.teach.dima_da_priyatno:
    title: Dima o salută la rândul lui pe Nina
    gloss: 'Dima: Da! Îmi pare bine să te cunosc, Nina.'
    note: '*Приятно познакомиться* este formula obișnuită pentru prima întâlnire cu cineva. *Познакомиться* înseamnă „a face cunoștință”.'
  ru.a1.unit26.lesson06.teach.nina_mne_tozhe:
    title: Nina răspunde la salut
    gloss: 'Nina: Și mie îmi pare bine!'
    note: 'Încheie dialogul: Dima a recunoscut-o pe Nina după descrierea făcută mai devreme de Nastia.'
