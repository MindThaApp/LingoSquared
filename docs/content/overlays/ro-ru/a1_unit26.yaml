course:
  title: Rusă A1
  description: 'Rusă pentru începători: descrierea aspectului fizic de bază al unei persoane: impresia despre înălțime și vârstă, culoarea părului și a ochilor, întrebarea de bază Как ты выглядишь? și compararea aspectului a două persoane.'
