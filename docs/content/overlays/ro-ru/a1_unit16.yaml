course:
  title: Rusă A1
  description: Învață rusa de nivel A1 pentru a spune o problemă de sănătate simplă, a înțelege sfaturi imediate scurte și a purta o scurtă conversație la cabinetul medical, cu explicații detaliate în română despre vocabular, expresii și dialoguri.
