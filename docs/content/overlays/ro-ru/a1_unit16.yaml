teaching:
  ru.a1.unit16.lesson01.teach.u_menya_bolit_golova:
    title: У меня болит голова.
    gloss: Mă doare capul.
    note: у меня înseamnă „eu am” (literal „la mine”); болит înseamnă „doare” și se acordă cu un subiect la singular, ca голова (cap).
  ru.a1.unit16.lesson01.teach.zhivot:
    title: живот
    gloss: stomac
    note: живот înseamnă „stomac/burtă”. Folosește același tipar у меня болит... cu orice parte a corpului.
    example_gloss: Mă doare burta.
  ru.a1.unit16.lesson01.teach.gorlo:
    title: горло
    gloss: gât
    note: горло înseamnă „gât”.
    example_gloss: Mă doare gâtul.
  ru.a1.unit16.lesson02.teach.u_menya_temperatura:
    title: У меня температура.
    gloss: Am febră.
    note: температура înseamnă literal „temperatură”, dar în rusă este modul obișnuit de a spune „febră”.
  ru.a1.unit16.lesson02.teach.prostuda:
    title: простуда
    gloss: răceală
    note: простуда înseamnă „răceală” (boala). Spune у меня простуда pentru „Am o răceală”.
    example_gloss: Sunt răcit.
  ru.a1.unit16.lesson02.teach.mne_ploho:
    title: Мне плохо.
    gloss: Mă simt rău.
    note: Мне плохо este un mod general de a spune că nu te simți bine, fără a numi un simptom anume.
  ru.a1.unit16.lesson03.teach.dima_zdravstvuyte_bolit:
    title: Dima îl salută pe medic
    gloss: 'Dima: Bună ziua! Mă doare capul și gâtul.'
    note: Дима începe cu formula de politețe Здравствуйте!, deoarece medicul este o persoană necunoscută.
  ru.a1.unit16.lesson03.teach.doktor_chto_u_vas_bolit:
    title: Medicul întreabă ce doare
    gloss: 'Medicul: Ce vă doare? Capul și gâtul?'
    note: Medicul folosește formula de politețe вас („dumneavoastră”/„voi”) în loc de forma familiară тебя.
  ru.a1.unit16.lesson03.teach.dima_da_i_eshchyo_temperatura:
    title: Dima mai adaugă un simptom
    gloss: 'Dima: Da, și încă febră.'
    note: ещё înseamnă „încă / în plus” — и ещё... adaugă un element la ce ai spus deja.
  ru.a1.unit16.lesson03.teach.doktor_vam_nuzhno_otdyhat:
    title: Medicul dă un sfat
    gloss: 'Medicul: Trebuie să vă odihniți și să beți multă apă.'
    note: Вам нужно + infinitiv înseamnă „trebuie să...”; вам este dativul de politețe al lui „dumneavoastră”.
