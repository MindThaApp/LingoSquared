  ru.a1.unit17.lesson01.teach.ya_vrach_rabotayu_v_bolnitse:
    title: Я врач. Я работаю в больнице.
    gloss: Sunt medic. Lucrez la un spital.
    note: врач înseamnă „medic” (profesia); работаю в + cazul prepozițional înseamnă „lucrez la/în”.
  ru.a1.unit17.lesson01.teach.uchitel:
    title: учитель
    gloss: profesor
    note: учитель înseamnă „profesor” sau „învățător”. работает este forma „el/ea lucrează” a verbului работать.
    example_gloss: Ea este profesoară. Lucrează la o școală.
  ru.a1.unit17.lesson01.teach.inzhener:
    title: инженер
    gloss: inginer
    note: инженер înseamnă „inginer”. офис înseamnă „birou”; в офисе este forma de prepozitiv, „în birou”.
    example_gloss: El este inginer. Lucrează într-un birou.
  ru.a1.unit17.lesson02.teach.kem_ty_rabotayesh:
    title: Кем ты работаешь?
    gloss: Ce meserie ai?
    note: Кем ты работаешь? este modul obișnuit de a întreba cineva ce meserie are; кем este cazul instrumental al lui „cine”, folosit cu работать.
