    title: продавец
    gloss: vânzător / vânzătoare
    note: продавец înseamnă „vânzător” (lucrează într-un magazin). магазин înseamnă „magazin”; в магазине este forma de prepozitiv.
    example_gloss: El este vânzător. Lucrează la un magazin.
  ru.a1.unit17.lesson02.teach.povar:
    title: повар
    gloss: bucătar
    note: повар înseamnă „bucătar”. ресторан înseamnă „restaurant”; в ресторане este forma de prepozitiv.
    example_gloss: Ea este bucătăreasă. Lucrează la un restaurant.
  ru.a1.unit17.lesson03.teach.nastya_kem_ty_rabotayesh:
    title: Nastia îl întreabă pe Dima ce meserie are
    gloss: 'Nastia: Ce meserie ai, Dima?'
    note: Настя începe cu Кем ты работаешь, Дима?
  ru.a1.unit17.lesson03.teach.dima_inzhener_ofise:
