teaching:
  ru.a1.unit10.lesson01.teach.kak_doyti:
    title: Как дойти до...?
    gloss: Cum ajung la...?
    note: Как дойти до...? este modul politicos obișnuit de a cere unui necunoscut indicații spre un loc; destinația urmează la genitiv.
  ru.a1.unit10.lesson01.teach.muzeya:
    title: музей
    gloss: muzeu
    note: музей este de genul masculin; музея este forma lui de genitiv, folosită după до („până la”).
    example_gloss: Cum ajung la muzeu?
  ru.a1.unit10.lesson01.teach.pryamo:
    title: прямо
    gloss: drept înainte
    note: прямо descrie mersul drept înainte; Идите este forma de politețe a imperativului verbului „a merge”.
    example_gloss: Mergeți drept înainte.
  ru.a1.unit10.lesson01.teach.napravo:
    title: направо
    gloss: la dreapta
    note: направо indică direcția mișcării (viraj la dreapta); потом înseamnă „apoi”.
    example_gloss: Mergeți drept înainte, apoi la dreapta.
  ru.a1.unit10.lesson02.teach.nalevo:
    title: налево
    gloss: la stânga
    note: налево indică direcția mișcării, opusul lui направо.
    example_gloss: Virați la stânga.
  ru.a1.unit10.lesson02.teach.povernite:
    title: поверните
    gloss: virați (la politicos)
    note: поверните este imperativul de politețe al verbului повернуть („a vira”); за углом înseamnă „după colț”.
    example_gloss: Virați la stânga după colț.
  ru.a1.unit10.lesson02.teach.kvartal_daleko:
    title: квартал, далеко
    gloss: cvartal, departe
    note: квартал este un cvartal de oraș (квартала după два); далеко înseamnă „departe”, iar отсюда înseamnă „de aici”.
    example_gloss:
    - Mergeți două cvartale.
    - Este departe de aici?
  ru.a1.unit10.lesson03.teach.tourist_prostite:
    title: Turistul cere indicații
    gloss: 'Turist: Scuzați-mă, cum ajung la muzeu?'
    note: Турист începe cu Простите („scuzați-mă”) înainte de a întreba Как дойти до музея?
  ru.a1.unit10.lesson03.teach.prokhozhiy_eto_prosto:
    title: Trecătorul dă indicații
    gloss: 'Trecător: Este foarte simplu. Mergeți drept două cvartale, apoi virați la dreapta.'
    note: Прохожий răspunde cu Это очень просто, apoi dă o indicație în doi pași, cu Идите și поверните.
  ru.a1.unit10.lesson03.teach.tourist_daleko:
    title: Turistul întreabă dacă este departe
    gloss: 'Turist: Este departe de aici?'
    note: Это далеко отсюда? este o întrebare de continuare, pentru a afla cât de lung este drumul pe jos.
  ru.a1.unit10.lesson03.teach.prokhozhiy_pyat_minut:
    title: Trecătorul estimează timpul
    gloss: 'Trecător: Nu, cinci minute pe jos.'
    note: Прохожий răspunde cu Нет, пять минут пешком („pe jos”).
  ru.a1.unit10.lesson03.teach.tourist_spasibo:
    title: Turistul îi mulțumește trecătorului
    gloss: 'Turist: Vă mulțumesc mult.'
    note: Спасибо большое încheie politicos schimbul de replici.
  ru.a1.unit10.lesson03.teach.prokhozhiy_pozhaluysta:
    title: Trecătorul răspunde
    gloss: 'Trecător: Cu plăcere.'
    note: Пожалуйста răspunde la спасибо cu „cu plăcere”.
