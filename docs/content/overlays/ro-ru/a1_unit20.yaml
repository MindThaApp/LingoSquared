teaching:
  ru.a1.unit20.lesson01.teach.segodnya_holodno:
    title: Сегодня холодно.
    gloss: Astăzi este frig.
    note: 'În rusă se folosește adesea un cuvânt impersonal pentru vreme: холодно, literal „friguros”.'
    example_gloss: Astăzi este frig, Dima.
  ru.a1.unit20.lesson01.teach.teplo:
    title: тепло
    gloss: cald
    note: тепло se folosește ca холодно pentru vreme sau temperatură.
    example_gloss: Acasă este cald.
  ru.a1.unit20.lesson01.teach.pogoda:
    title: погода
    gloss: vremea
    note: погода înseamnă „vremea”.
    example_gloss: 'Vremea: astăzi este frig.'
  ru.a1.unit20.lesson02.teach.idet_dozhd:
    title: Идёт дождь.
    gloss: Plouă.
    note: În rusă se spune дождь идёт, literal „ploaia merge”. Spre deosebire de unele limbi, rusa nu are aici niciun subiect gramatical impersonal; verbul идёт se acordă cu дождь.
    example_gloss: Astăzi plouă.
  ru.a1.unit20.lesson02.teach.solntse:
    title: солнце
    gloss: soare
    note: Сегодня солнце este o modalitate simplă de a spune că astăzi este soare. Rusa numește vremea fără verb.
    example_gloss: Astăzi este soare.
  ru.a1.unit20.lesson02.teach.veter:
    title: ветер
    gloss: vânt
    note: На улице ветер este o formulă firească pentru a spune că afară bate vântul.
    example_gloss: Afară bate vântul.
  ru.a1.unit20.lesson03.teach.nastya_kakaya_pogoda:
    title: Nastea întreabă despre vreme
    gloss: 'Nastea: Cum e vremea astăzi?'
    note: Какая сегодня погода? este întrebarea obișnuită.
  ru.a1.unit20.lesson03.teach.dima_holodno_dozhd:
    title: Dima descrie vremea
    gloss: 'Dima: Astăzi este frig și plouă.'
    note: Dima leagă două aspecte ale vremii cu и.
  ru.a1.unit20.lesson03.teach.nastya_ostanemsya_doma:
    title: Nastea propune un plan
    gloss: 'Nastea: Atunci hai să rămânem acasă.'
    note: Давай останемся дома este o propunere informală.
  ru.a1.unit20.lesson03.teach.dima_doma_teplo:
    title: Dima este de acord
    gloss: 'Dima: Bine, acasă este cald.'
    note: Дома тепло oferă un motiv pentru plan.
