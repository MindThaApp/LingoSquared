teaching:
  ru.a1.unit05.lesson01.teach.kotoryy_chas:
    title: Который час?
    gloss: Cât este ceasul?
    note: Modul obișnuit de a întreba ora; literal, „care oră”.
  ru.a1.unit05.lesson01.teach.seychas_chas:
    title: Сейчас час.
    gloss: Acum este ora unu.
    note: Doar „Час” înseamnă „ora unu”; în rusă nu se spune „один час” aici, spre deosebire de modelul numeralelor de la 2 în sus.
    example_gloss: Cât este ceasul? — Este ora unu.
  ru.a1.unit05.lesson01.teach.dva_tri_chasa:
    title: два часа, три часа
    gloss: ora două, ora trei
    note: După два și три, час ia forma de genitiv singular часа, conform modelului numeral-substantiv din Unitatea 3.
    example_gloss:
    - Acum este ora două.
    - Acum este ora trei.
  ru.a1.unit05.lesson01.teach.pyat_desyat_chasov:
    title: пять часов, десять часов
    gloss: ora cinci, ora zece
    note: De la пять în sus, час trece la forma de genitiv plural часов, tot după modelul de la 5 în sus din Unitatea 3.
    example_gloss:
    - Acum este ora cinci.
    - Acum este ora zece.
  ru.a1.unit05.lesson02.teach.v_kotorom_chasu:
    title: В котором часу?
    gloss: La ce oră?
    note: Se folosește pentru a întreba când are loc ceva, spre deosebire de Который час?, care întreabă doar ora actuală.
  ru.a1.unit05.lesson02.teach.utrom_dnem:
    title: утром, днём
    gloss: dimineața, ziua
    note: Sunt forme adverbiale (cazul instrumental) de la утро și день, folosite fără prepoziție.
    example_gloss:
    - Dimineața beau cafea.
    - Ziua lucrez.
  ru.a1.unit05.lesson02.teach.vecherom_nochyu:
    title: вечером, ночью
    gloss: seara, noaptea
    note: Același model adverbial de instrumental ca la утром/днём.
    example_gloss:
    - Seara sunt acasă.
    - Noaptea dorm.
  ru.a1.unit05.lesson02.teach.v_dva_chasa_dnya:
    title: В два часа дня.
    gloss: La ora două după-amiaza.
    note: дня (genitivul lui день), adăugat după oră, precizează că e ora două după-amiaza, nu două noaptea.
    example_gloss: La ce oră este întâlnirea? — La ora două după-amiaza.
  ru.a1.unit05.lesson02.teach.v_sem_chasov_vechera:
    title: В семь часов вечера.
    gloss: La ora șapte seara.
    note: вечера (genitivul lui вечер) precizează că ora șapte este seara.
    example_gloss: Magazinul se închide la ora șapte seara.
  ru.a1.unit05.lesson03.teach.skazhite_pozhaluysta:
    title: Скажите, пожалуйста, который час?
    gloss: Scuzați-mă, puteți să-mi spuneți cât este ceasul?
    note: Скажите, пожалуйста îmblânzește întrebarea și se potrivește când te adresezi unui necunoscut.
  ru.a1.unit05.lesson03.teach.kogda_otkhodit:
    title: Когда отходит поезд?
    gloss: Când pleacă trenul?
    note: Отходит („pleacă”) este verbul obișnuit pentru un tren sau un autobuz care părăsește stația.
  ru.a1.unit05.lesson03.teach.passazhir_vopros:
    title: Pasagerul întreabă ora
    gloss: 'Pasager: Scuzați-mă, puteți să-mi spuneți cât este ceasul?'
    note: Pasagerul începe politicos cu Скажите, пожалуйста, potrivit când te adresezi personalului din gară.
  ru.a1.unit05.lesson03.teach.kassir_sem:
    title: Casierul răspunde
    gloss: 'Casier: Este ora șapte dimineața.'
    note: Сейчас семь часов утра spune ora actuală, cu утра („dimineața”) pentru precizie.
  ru.a1.unit05.lesson03.teach.passazhir_kogda:
    title: Pasagerul întreabă despre tren
    gloss: 'Pasager: Și când pleacă trenul?'
    note: А introduce firesc a doua întrebare a pasagerului.
  ru.a1.unit05.lesson03.teach.kassir_vosem:
    title: Casierul spune ora plecării
    gloss: 'Casier: La ora opt dimineața.'
    note: В восемь часов утра răspunde cu prepoziția в, urmată de oră și de momentul zilei.
