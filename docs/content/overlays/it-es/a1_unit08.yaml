teaching:
  es.a1.unit08.lesson01.teach.banco_farmacia:
    title: Banca, farmacia
    gloss: banca, farmacia
    note: '*Banco* è maschile; *farmacia* è femminile.'
    example_gloss:
    - Vado in banca.
    - La farmacia apre alle nove.
  es.a1.unit08.lesson01.teach.parque_restaurante:
    title: Parco, ristorante
    gloss: parco, ristorante
    note: Entrambi i nomi sono maschili.
    example_gloss:
    - Il parco è molto bello.
    - Mangiamo al ristorante.
  es.a1.unit08.lesson01.teach.biblioteca:
    title: Biblioteca
    gloss: biblioteca
    note: '*Biblioteca* è femminile.'
    example_gloss: Studio in biblioteca.
  es.a1.unit08.lesson02.teach.cerca_de:
    title: Vicino
    gloss: Il ristorante è vicino al mercato.
    note: '*Cerca de* (vicino a) vuole sempre *de* davanti al luogo di riferimento.'
  es.a1.unit08.lesson02.teach.lejos_de:
    title: Lontano da
    gloss: Il parco è lontano dal mercato.
    note: '*Lejos de* (lontano da) è il contrario di *cerca de*.'
  es.a1.unit08.lesson02.teach.al_lado_de:
    title: Accanto a
    gloss: La banca è accanto al mercato.
    note: '*Al lado de* (accanto a) è un''espressione fissa (*al* = *a* + *el lado*). Davanti a un nome maschile come *mercado*, *de* + *el* si contrae in *del*: *al lado del mercado*.'
  es.a1.unit08.lesson02.teach.enfrente_de:
    title: Di fronte a
    gloss: La farmacia è di fronte al mercato.
    note: '*Enfrente de* (di fronte a) indica due luoghi che stanno uno dalla parte opposta all''altro, per esempio ai lati di una strada.'
  es.a1.unit08.lesson02.teach.entre:
    title: Tra
    gloss: La biblioteca è tra la banca e il parco.
    note: '*Entre* (tra) richiede due punti di riferimento, qui uniti da *y* (e).'
  es.a1.unit08.lesson03.teach.donde_esta_el_banco:
    title: Chiedere dov'è la banca
    gloss: Dov'è la banca?
    note: '*Dónde está* (dov''è) è la struttura abituale per chiedere dove si trova un luogo.'
  es.a1.unit08.lesson03.teach.esta_al_lado_del_mercado:
    title: Rispondere indicando un luogo
    gloss: È accanto al mercato.
    note: '*Del* è la contrazione di *de* + *el*, obbligatoria davanti al nome maschile *mercado*.'
  es.a1.unit08.lesson03.teach.donde_esta_la_farmacia:
    title: Chiedere dov'è la farmacia
    gloss: Dov'è la farmacia?
    note: 'Stessa struttura di domanda, qui con un nome femminile: la domanda non cambia in base al genere.'
  es.a1.unit08.lesson03.teach.esta_enfrente_del_mercado:
    title: 'Risposta: di fronte a'
    gloss: È di fronte al mercato.
    note: '*Enfrente de* + *el mercado* diventa *enfrente del mercado*, la stessa contrazione *del* di *al lado del mercado*.'
  es.a1.unit08.lesson04.teach.esta_lejos:
    title: Chiedere se è lontano
    gloss: È lontano?
    note: Una breve domanda di seguito, in cui il soggetto non si esprime perché è già chiaro dal contesto.
  es.a1.unit08.lesson04.teach.no_esta_cerca:
    title: 'Risposta: no, è vicino'
    gloss: No, è vicino.
    note: '*Cerca* da solo (senza *de*) funziona come risposta breve, a differenza dell''espressione completa *cerca de* usata con un luogo preciso.'
  es.a1.unit08.lesson04.teach.si_esta_lejos:
    title: 'Risposta: sì, piuttosto lontano'
    gloss: Sì, è piuttosto lontano.
    note: '*Bastante* (piuttosto, abbastanza) rafforza *lejos*, ma meno di *muy* (molto).'
  es.a1.unit08.lesson05.teach.barrio_reading:
    title: Leggere del quartiere
    gloss: In questo quartiere ci sono molti luoghi utili. La banca è accanto al mercato. La farmacia è di fronte al mercato. Il parco è lontano, ma la biblioteca è tra la banca e il parco. Il ristorante è molto vicino al mercato.
    note: Questo breve testo riunisce in un'unica descrizione del quartiere le espressioni di luogo di questa unità.
    glosses:
      barrio: quartiere
      hay: ci sono (dal verbo haber)
      muchos: molti
      lugares: luoghi
      útiles: utili
      banco: banca
      está: si trova (dal verbo estar)
      lado: lato
      mercado: mercato
      farmacia: farmacia
      enfrente: di fronte / dirimpetto
      parque: parco
      lejos: lontano
      biblioteca: biblioteca
      entre: tra
      restaurante: ristorante
      cerca: vicino
  es.a1.unit08.lesson05.teach.hay_note:
    title: Hay (c'è / ci sono)
    gloss: Perché hay non cambia al singolare e al plurale.
    note: Vedi il testo della scheda.
    target_text: '*Hay* (c''è / ci sono) non cambia al singolare e al plurale: *hay un banco* e *hay muchos lugares* usano la stessa parola.'
  es.a1.unit08.lesson06.teach.line01:
    title: Chiedere dov'è la banca
    gloss: Mateo chiede a Elena dov'è la banca.
    note: La stessa domanda *¿Dónde está...?* vista prima in questa unità, introdotta dal nome di Elena per attirare la sua attenzione.
  es.a1.unit08.lesson06.teach.line02:
    title: Rispondere facendo riferimento al mercato
    gloss: Elena dice che è accanto al mercato, dove hanno comprato le uova.
    note: '*Donde compramos los huevos* (dove abbiamo comprato le uova) richiama la loro spesa nell''Unità 7.'
  es.a1.unit08.lesson06.teach.line03:
    title: Chiedere della farmacia
    gloss: Mateo prende atto e chiede della farmacia.
    note: '*Ah, sí* (ah, già / ah, sì) è un breve modo naturale di far capire di aver capito prima della domanda successiva.'
  es.a1.unit08.lesson06.teach.line04:
    title: 'Risposta: di fronte a'
    gloss: Elena dice che è di fronte al mercato.
    note: 'Una risposta breve: il soggetto (*la farmacia*) si omette perché è chiaro dalla domanda.'
  es.a1.unit08.lesson06.teach.line05:
    title: Chiedere del parco
    gloss: Mateo chiede del parco e se è vicino.
    note: Unisce due domande in un solo intervento, cosa naturale nella conversazione informale.
  es.a1.unit08.lesson06.teach.line06:
    title: 'Risposta: lontano, poi si parla della biblioteca'
    gloss: Elena dice che il parco è lontano, ma la biblioteca è tra la banca e il parco.
    note: '*Pero* (ma) contrappone la distanza del parco alla posizione più comoda della biblioteca.'
  es.a1.unit08.lesson06.teach.line07:
    title: Ringraziare e chiedere del ristorante
    gloss: Mateo ringrazia Elena e chiede del ristorante dove hanno mangiato.
    note: '*El restaurante donde comimos* (il ristorante dove abbiamo mangiato) rimanda al loro pranzo nell''Unità 6.'
  es.a1.unit08.lesson06.teach.line08:
    title: Confermare che è molto vicino
    gloss: Elena conferma che è molto vicino al mercato.
    note: '*Muy cerca* (molto vicino): *muy* (molto) è più forte di *bastante* (abbastanza), come in *bastante lejos* (abbastanza lontano).'
