teaching:
  es.a1.unit49.lesson01.teach.levantarse_me_levanto:
    title: Alzarsi
    gloss: alzarsi → mi alzo
    note: '*Levantarse* è riflessivo: il pronome *me* va prima del verbo, *Me levanto*.'
  es.a1.unit49.lesson01.teach.vestirse_me_visto:
    title: Vestirsi
    gloss: vestirsi → mi vesto
    note: 'Anche *vestirse* è riflessivo: *Me visto*. Qui *me* significa "mi".'
  es.a1.unit49.lesson01.teach.desayunar_desayuno:
    title: Fare colazione
    gloss: fare colazione → faccio colazione
    note: '*Desayunar* non è riflessivo: *Desayuno*, senza *me*.'
  es.a1.unit49.lesson01.teach.trabajar_trabajo:
    title: Lavorare
    gloss: lavorare → lavoro
    note: '*Trabajar* è un verbo regolare in -ar: la forma *yo* termina in -o, *trabajo*.'
  es.a1.unit49.lesson01.teach.comer_como:
    title: Mangiare
    gloss: mangiare → mangio
    note: '*Comer* è un verbo regolare in -er: la forma *yo* termina in -o, *como*.'
  es.a1.unit49.lesson01.teach.lavar_los_platos:
    title: Lavare i piatti
    gloss: lavare i piatti → lavo i piatti
    note: '*Lavar los platos* non è riflessivo: *Lavo los platos*. Il complemento *los platos* resta dopo il verbo.'
  es.a1.unit49.lesson01.teach.dormir_duermo:
    title: Dormire
    gloss: dormire → dormo
    note: '*Dormir* cambia la vocale della radice nella forma *yo*: *duermo* (o diventa ue).'
  es.a1.unit49.lesson02.teach.con_levantarse_y:
    title: Lo schema riflessivo
    gloss: 'Con levantarse e vestirse, il pronome va prima del verbo: levantarse → Me levanto.'
    note: 'Con i verbi riflessivi, metti *me* prima del verbo coniugato: di'' *Me levanto*, non *Levanto me*.'
  es.a1.unit49.lesson02.teach.levantarse_me_levanto:
    title: Levantarse in una frase
    gloss: 'alzarsi: mi alzo alle sette.'
    note: 'L''indicazione dell''ora viene dopo il verbo: *Me levanto a las siete*.'
  es.a1.unit49.lesson02.teach.vestirse_me_visto:
    title: Vestirse in una frase
    gloss: 'vestirsi: mi vesto.'
    note: 'Lo schema è *me* + *visto*: il pronome sta subito davanti al verbo.'
  es.a1.unit49.lesson02.teach.lavar_los_platos:
    title: Lavar los platos in una frase
    gloss: 'lavare i piatti: lavo i piatti dopo aver mangiato.'
    note: '*Después de comer* ("dopo aver mangiato") usa *de* più un infinito e può stare alla fine.'
  es.a1.unit49.lesson02.teach.sin_pronombre_desayuno:
    title: Verbi senza me
    gloss: 'Senza pronome: faccio colazione. Lavoro. Dormo. Questi verbi non sono riflessivi.'
    note: '*Desayuno*, *trabajo* e *duermo* non hanno *me*: questi verbi non sono riflessivi.'
  es.a1.unit49.lesson03.teach.me_levanto_a:
    title: Alzarsi alle sette e mezza
    gloss: Mi alzo alle 7:30.
    note: 'Come in italiano, lo spagnolo dice "e mezza" con *y media*: *las siete y media* sono le 07:30. Usa *a las* davanti all''ora.'
  es.a1.unit49.lesson03.teach.me_visto_a:
    title: Vestirsi alle otto meno un quarto
    gloss: Mi vesto alle 7:45.
    note: '*Las ocho menos cuarto* si conta all''indietro a partire dall''ora successiva: 07:45.'
  es.a1.unit49.lesson03.teach.desayuno_a_las:
    title: Fare colazione alle otto
    gloss: Faccio colazione alle otto.
    note: 'Usa *a las* davanti all''ora: *a las ocho*. Per l''una si dice invece *a la una*.'
  es.a1.unit49.lesson03.teach.trabajo_de_nueve:
    title: Lavorare dalle nove alle cinque
    gloss: Lavoro dalle nove alle cinque.
    note: '*De ... a ...* indica un orario di inizio e uno di fine: *de nueve a cinco*.'
  es.a1.unit49.lesson03.teach.como_a_las:
    title: Mangiare alle sei e mezza
    gloss: Mangio alle 18:30.
    note: '*De la tarde* chiarisce che è pomeriggio/sera, quindi qui *las seis y media* sono le 18:30.'
  es.a1.unit49.lesson03.teach.duermo_a_las:
    title: Dormire alle undici
    gloss: Dormo alle undici.
    note: 'Usa *a las* davanti all''ora: *a las once*.'
  es.a1.unit49.lesson04.teach.primero_luego_despues:
    title: Prima, poi, dopo
    gloss: prima, poi, dopo
    note: '*Primero* indica la prima attività, *luego* la successiva e *después* quella che segue.'
    example_gloss:
    - Prima mi alzo.
    - Poi mi vesto.
    - Dopo faccio colazione.
  es.a1.unit49.lesson04.teach.primero_me_levanto:
    title: Una mattina in tre passi
    gloss: Prima mi alzo. Poi mi vesto. Dopo faccio colazione.
    note: 'I verbi riflessivi mantengono *me* davanti al verbo: *me levanto*, *me visto*.'
  es.a1.unit49.lesson04.teach.primero_luego_y:
    title: Parole per ordinare le azioni
    gloss: 'Primero, luego e después mettono in ordine ciò che fai; il verbo non cambia: Después desayuno.'
    note: 'Le parole di sequenza aprono la frase e la forma del verbo non cambia: *Después desayuno*.'
  es.a1.unit49.lesson05.teach.mi_dia_me:
    title: La mia giornata
    gloss: La mia giornata — Mi alzo alle 7:30. Dopo mi vesto e alle otto faccio colazione. Lavoro dalle nove alle cinque. Alle 18:30 mangio. Dopo lavo i piatti. Alle undici dormo.
    note: Leggi facendo attenzione sia all'ordine delle attività sia agli orari. Nota *me levanto* e *me visto* con *me*.
    glosses:
      Mi: mio
      día: giorno
      levanto: mi alzo
      media: e mezza (y media = e mezza)
      ocho: otto
      Después: dopo
      visto: vestirsi
      las: 'le (davanti all''ora: las ocho)'
      desayuno: fare colazione
      Trabajo: lavorare
      nueve: nove
      cinco: cinque
      siete: sette
      tarde: di sera, del pomeriggio
      como: mangiare
      lavo: lavare (lavo los platos)
      once: undici
      duermo: dormire
  es.a1.unit49.lesson06.teach.elena_como_es:
    title: Chiedere della giornata
    gloss: 'Elena: Com''è la tua giornata, Mateo?'
    note: '*¿Cómo es tu día?* è un modo informale per chiedere a qualcuno di descrivere la sua giornata; *tu* è il possessivo informale "tuo/tua".'
  es.a1.unit49.lesson06.teach.mateo_me_levanto:
    title: La mattina di Mateo
    gloss: 'Mateo: Mi alzo alle sette e mezza. Dopo mi vesto e alle otto faccio colazione.'
    note: Mateo collega tre attività del mattino con *después* e *y*.
  es.a1.unit49.lesson06.teach.elena_cuando_trabajas:
    title: La giornata di lavoro di Mateo
    gloss: 'Elena: Quando lavori? Mateo: Lavoro dalle nove alle cinque.'
    note: 'Elena e Mateo si danno del *tú*, la forma informale: *¿Cuándo trabajas?*'
  es.a1.unit49.lesson06.teach.mateo_a_las:
    title: La sera di Mateo
    gloss: 'Mateo: Alle sei e mezza del pomeriggio mangio. Dopo lavo i piatti. Alle undici dormo.'
    note: '*Después* apre la frase, ma la forma del verbo non cambia: *después lavo*.'
  es.a1.unit49.lesson06.teach.elena_me_levanto:
    title: La mattina di Elena
    gloss: 'Elena: Mi alzo alle sei, ma non faccio colazione fino alle sei e mezza.'
    note: '*No ... hasta* significa "non prima di", "fino a". Elena mette a confronto l''ora in cui si alza con quella della colazione.'
