    title: Elena e Mateo organizzano il pranzo
teaching:
  es.a1.unit05.lesson01.teach.que_hora_es:
    title: Chiedere l'ora
    gloss: Che ore sono?
    note: '*Qué hora* («che ora») chiede l''ora dell''orologio, diversa da *qué fecha* («che data»).'
  es.a1.unit05.lesson01.teach.es_la_una:
    title: È l'una
    gloss: È l'una.
    note: Vedi la nota di grammatica seguente sul perché si usa *es* (e non *son*) solo per l'una.
  es.a1.unit05.lesson01.teach.es_vs_son_note:
    title: Es e son nell'ora
    gloss: Perché l'una è diversa da tutte le altre ore.
    note: '*Es la una* (singolare), ma *son las dos, son las tres...* (plurale).'
    target_text: L'una usa il verbo singolare *es* (Es la una), mentre tutte le altre ore usano il plurale *son* (Son las dos, Son las tres...) perché *la una* è singolare («l'una») mentre *las dos*, *las tres* ecc. sono plurali.
  es.a1.unit05.lesson01.teach.son_las_horas:
    title: Le due, le quattro, le cinque, le sette
    gloss: Sono le due, sono le quattro, sono le cinque, sono le sette.
    note: '*Son las...* (plurale) si usa per tutte le ore tranne l''una, come nella nota di grammatica precedente.'
    example_gloss:
    - Sono le due.
    - Sono le quattro.
    - Sono le cinque.
    - Sono le sette.
  es.a1.unit05.lesson02.teach.y_cuarto:
    title: E un quarto
    gloss: Sono le quattro e un quarto.
    note: '*Y cuarto* (e un quarto) aggiunge quindici minuti all''ora indicata.'
  es.a1.unit05.lesson02.teach.y_media:
    title: E mezza
    gloss: Sono le sette e mezza (le sette e trenta).
    note: '*Y media* (e mezza) aggiunge trenta minuti all''ora indicata.'
  es.a1.unit05.lesson02.teach.menos_cuarto:
    title: Meno un quarto
    gloss: Sono le cinque meno un quarto (le quattro e quarantacinque).
    note: Vedi la nota di grammatica seguente su come *menos* conta i minuti che mancano all'ora successiva.
  es.a1.unit05.lesson02.teach.menos_note:
    title: 'Menos (meno: minuti che mancano all''ora)'
    gloss: Come si contano in spagnolo i minuti che mancano all'ora successiva, in modo simile all'italiano.
    note: '*Las cinco menos cuarto* = le cinque meno un quarto (4:45).'
    target_text: '*Menos* («meno») conta alla rovescia fino all''ora successiva: *las cinco menos cuarto* sono le 4:45, cioè «le cinque meno un quarto», come in italiano.'
  es.a1.unit05.lesson03.teach.partes_del_dia:
    title: Mattina, pomeriggio, sera/notte
    gloss: della mattina, del pomeriggio, della sera/della notte
    note: '*De la mañana/tarde/noche* chiarisce se l''ora è AM o PM, un po'' come in italiano si aggiunge «di mattina» o «di sera» dopo l''orario.'
    example_gloss:
    - Sono le otto del mattino.
    - Il laboratorio inizia alle quattro del pomeriggio.
    - Sono le dieci di sera.
  es.a1.unit05.lesson03.teach.taller_empieza_cuatro_tarde:
    title: Il laboratorio inizia alle quattro
    gloss: Il laboratorio inizia alle quattro del pomeriggio.
    note: '*Empieza* (inizia) è la terza persona di *empezar*, un verbo nuovo di questa unità.'
  es.a1.unit05.lesson03.teach.a_que_hora_empieza:
    title: Chiedere a che ora inizia qualcosa
    gloss: A che ora inizia il laboratorio?
    note: '*A qué hora* (a che ora) è il modo standard per chiedere quando avviene un evento preciso, diverso dal generico *qué hora es* (che ora è adesso).'
  es.a1.unit05.lesson04.teach.nos_vemos_a_que_hora:
    title: Chiedere quando incontrarsi
    gloss: A che ora ci vediamo?
    note: '*Nos vemos* (ci vediamo) è una costruzione riflessiva usata per darsi appuntamento con qualcuno.'
  es.a1.unit05.lesson04.teach.nos_vemos_tres_y_media:
    title: Proporre un orario per incontrarsi
    gloss: Ci vediamo alle tre e mezza?
    note: Unisce *y media* e *nos vemos* per proporre un orario preciso.
  es.a1.unit05.lesson04.teach.antes_del_taller:
    title: Prima del laboratorio
    gloss: È prima del laboratorio.
    note: '*Antes de* (prima di) è il contrario di *después* (dopo).'
  es.a1.unit05.lesson04.teach.de_acuerdo:
    title: D'accordo / Va bene
    gloss: D'accordo / Va bene
    note: '*De acuerdo* è un modo naturale e breve per confermare un piano, simile nella funzione a *Muy bien*.'
    example_gloss: D'accordo, ci vediamo alle tre e mezza.
  es.a1.unit05.lesson05.teach.horario_dia_reading:
    title: Leggere il programma della giornata
    gloss: Il laboratorio inizia alle quattro del pomeriggio. Prima, Elena e Mateo si vedono alle tre e mezza. Il laboratorio finisce alle sei. Il giorno dopo si vedono all'una per pranzare.
    note: 'Un breve programma della giornata: incontro, laboratorio e pranzo il giorno dopo.'
    glosses:
      taller: laboratorio
      empieza: inizia (da empezar)
      cuatro: quattro
      tarde: pomeriggio
      Antes: prima
      ven: si vedono (da verse)
      tres: tre
      media: mezza
      termina: finisce (da terminar)
      seis: sei
      día: giorno
      siguiente: successivo
      almorzar: pranzare
  es.a1.unit05.lesson05.teach.al_dia_siguiente:
    title: Il giorno dopo
    gloss: il giorno dopo / il giorno successivo
    note: '*Al día siguiente* (il giorno dopo) è un modo comune per far avanzare un racconto a un nuovo giorno, diverso da *la próxima clase* (la prossima lezione, un evento preciso e non un giorno del calendario).'
  es.a1.unit05.lesson06.teach.line01:
    title: Chiedere di mangiare dopo il laboratorio
    gloss: Mateo dice che il laboratorio finisce alle sei e chiede a Elena se poi ha fame.
    note: '*Tienes hambre* (hai fame) è un''espressione nuova, con la stessa costruzione con «avere» di *tener ... años* e *tener hermanos*.'
  es.a1.unit05.lesson06.teach.line02:
    title: Accettare e proporre il giorno dopo
    gloss: Elena dice di sì, un po', e propone invece di mangiare il giorno dopo.
    note: '*¿Comemos mañana?* propone domani invece di subito dopo il laboratorio e prepara lo scambio successivo su un orario preciso.'
  es.a1.unit05.lesson06.teach.line03:
    title: Accettare e chiedere l'ora
    gloss: Mateo dice che è una buona idea e chiede a che ora.
    note: '*Buena idea* (bell''idea) è un modo naturale e breve per essere d''accordo con una proposta.'
  es.a1.unit05.lesson06.teach.line04:
    title: Proporre l'una
    gloss: Elena propone di vedersi all'una.
    note: '*A la una* (all''una) usa il singolare *la una*, come in *Es la una*.'
  es.a1.unit05.lesson06.teach.line05:
    title: Confermare e parlare di un ristorante
    gloss: Mateo conferma che l'una va bene e dice che c'è un ristorante lì vicino.
    note: '*Hay un restaurante cerca de aquí*: *cerca de* (vicino a), come in *cerca de tus padres*, qui riferito a un luogo.'
  es.a1.unit05.lesson06.teach.line06:
    title: Chiudere con calore
    gloss: Elena reagisce con gioia e dice a domani.
    note: '*¡Genial!* (fantastico!) chiude lo scambio con entusiasmo, simile nella funzione a *¡Qué bien!*.'
