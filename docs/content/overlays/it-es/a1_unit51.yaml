teaching:
  es.a1.unit51.lesson01.teach.el_billete:
    title: Il biglietto
    gloss: il biglietto
    note: '*El billete* è maschile, quindi si dice *un billete*, non *una*.'
    example_gloss: Vorrei un biglietto per Toledo.
  es.a1.unit51.lesson01.teach.quisiera_un_billete:
    title: Chiedere un biglietto
    gloss: Vorrei un biglietto per Toledo.
    note: '*Quisiera* ("vorrei") attenua la richiesta ed è più cortese di *quiero* ("voglio").'
  es.a1.unit51.lesson01.teach.quiere_un_billete:
    title: L'addetto chiede che tipo di biglietto
    gloss: Desidera un biglietto di sola andata o di andata e ritorno?
    note: '*Quiere* è la forma di cortesia *usted* di *querer*, usata qui con un impiegato della stazione che non conosci.'
  es.a1.unit51.lesson01.teach.ida_y_vuelta:
    title: Rispondere con cortesia
    gloss: Andata e ritorno, per favore.
    note: '*Por favor* è il modo di dire "per favore"; la richiesta resta cortese e breve.'
  es.a1.unit51.lesson01.teach.en_la_taquilla:
    title: Il registro allo sportello
    gloss: Allo sportello di solito si usa la forma di cortesia usted.
    note: Alle persone sconosciute che svolgono un servizio ci si rivolge con *usted*, non con *tú*.
  es.a1.unit51.lesson02.teach.el_anden:
    title: Il binario
    gloss: il binario
    note: '*El andén* è maschile: *un andén*, *el andén*.'
    example_gloss: Da quale binario parte il treno per Toledo?
  es.a1.unit51.lesson02.teach.de_que_anden:
    title: Chiedere quale binario
    gloss: Da quale binario parte il treno per Toledo?
    note: '*¿De qué andén ...?* chiede in modo specifico il binario, non un luogo generico.'
  es.a1.unit51.lesson02.teach.el_tren_sale:
    title: Indicare i dettagli della partenza
    gloss: Il treno parte alle dieci meno un quarto dal binario cinque.
    note: '*Las diez menos cuarto* riprende lo schema «meno un quarto» della lezione sull''ora.'
  es.a1.unit51.lesson02.teach.a_que_hora:
    title: Chiedere l'orario di arrivo
    gloss: A che ora arriva il treno?
    note: '*¿A qué hora llega ...?* chiede l''orario di arrivo; *llegar* è regolare e davanti all''ora si usa *a las*.'
  es.a1.unit51.lesson02.teach.el_tren_llega:
    title: Indicare l'orario di arrivo
    gloss: Il treno arriva alle undici.
    note: '*Llega a las once* usa *llegar* (arrivare) con *a las* davanti all''ora.'
  es.a1.unit51.lesson03.teach.a_tiempo_el:
    title: In orario / il ritardo
    gloss: in orario; il ritardo
    note: '*A tiempo* è un''espressione fissa per qualcosa che avviene come previsto. *El retraso* (il ritardo) è maschile.'
    example_gloss:
    - Il treno non parte in orario.
    - 'Attenzione: il treno per Toledo è in ritardo.'
  es.a1.unit51.lesson03.teach.atencion_el_tren:
    title: Un annuncio
    gloss: 'Attenzione: il treno per Toledo è in ritardo.'
    note: '*Atención* apre un annuncio in stazione, come in italiano «Attenzione, viaggiatori».'
  es.a1.unit51.lesson03.teach.el_tren_no:
    title: Negare «in orario»
    gloss: Il treno non parte in orario.
    note: '*No* sta subito prima del verbo e nega tutta la frase: *no sale a tiempo*.'
  es.a1.unit51.lesson03.teach.el_tren_sale:
    title: Un cambio di binario
    gloss: Il treno parte dal binario tre invece che dal binario cinque.
    note: '*En lugar de* significa «invece di».'
  es.a1.unit51.lesson03.teach.el_tren_lleva:
    title: Indicare la durata del ritardo
    gloss: Il treno ha dieci minuti di ritardo.
    note: '*Lleva retraso* (letteralmente «porta ritardo») è il modo naturale per dire che qualcosa è in ritardo.'
  es.a1.unit51.lesson04.teach.la_entrada_la:
    title: Ingresso, uscita, sala d'attesa
    gloss: l'ingresso; l'uscita; la sala d'attesa
    note: '*La entrada*, *la salida* e *la sala de espera* sono tutti sostantivi femminili.'
    example_gloss:
    - Dov'è l'ingresso?
    - Dov'è l'uscita?
    - Dov'è la sala d'attesa?
  es.a1.unit51.lesson04.teach.donde_esta_el:
    title: Chiedere dov'è un binario
    gloss: Dov'è il binario sette?
    note: Riprende lo schema *¿Dónde está ...?* delle lezioni sulle indicazioni stradali.
  es.a1.unit51.lesson04.teach.todo_recto_y:
    title: Dare indicazioni
    gloss: Dritto e poi a destra.
    note: '*Todo recto* e *a la derecha* sono le espressioni di direzione delle lezioni sulle indicazioni, qui usate in una stazione.'
  es.a1.unit51.lesson04.teach.donde_esta_la:
    title: Chiedere della sala d'attesa
    gloss: Dov'è la sala d'attesa?
    note: Lo stesso schema di domanda applicato a un nuovo luogo.
  es.a1.unit51.lesson05.teach.billete_madrid_atocha:
    title: Leggere un biglietto stampato
    gloss: 'Biglietto: Madrid Atocha - Toledo. Partenza: dieci e dieci, binario sette. Arrivo: undici meno dieci. Andata e ritorno. Prezzo: dodici euro e quaranta.'
    note: Individua l'orario di partenza e il binario, l'orario di arrivo, il tipo di biglietto e il prezzo.
    glosses:
      Billete: biglietto
      Salida: partenza
      diez: dieci
      andén: binario
      siete: sette
      Llegada: arrivo
      once: undici
      vuelta: biglietto di andata e ritorno
      Precio: prezzo
      doce: dodici
      euros: euro
      cuarenta: quaranta
  es.a1.unit51.lesson06.teach.mateo_tenemos_que:
    title: Mateo espone il piano
    gloss: 'Mateo: Dobbiamo andare al binario sette. Il treno parte alle dieci e dieci.'
    note: '*Tenemos que* + infinito («dobbiamo») esprime una necessità pratica.'
  es.a1.unit51.lesson06.teach.elena_mira_ahi:
    title: Elena legge il tabellone
    gloss: 'Elena: Guarda, ecco il tabellone: ritardo, dieci minuti.'
    note: '*Ahí está* («eccolo») indica il tabellone; *el panel* è il pannello informativo.'
  es.a1.unit51.lesson06.teach.mateo_no_hay:
    title: Mateo resta calmo
    gloss: 'Mateo: Nessun problema, abbiamo ancora tempo per un caffè.'
    note: '*No hay problema* è una rassicurazione comune e informale.'
  es.a1.unit51.lesson06.teach.elena_buena_idea:
    title: Arriva il treno
    gloss: 'Elena: Buona idea. Ah, il treno è già qui! Binario sette, preciso!'
    note: '*Ya* («già») indica che il treno è arrivato prima del previsto, dato il ritardo appena annunciato.'
  es.a1.unit51.lesson06.teach.mateo_vamos_que:
    title: Salgono sul treno
    gloss: 'Mateo: Andiamo, salgono tutti! Toledo, arriviamo!'
    note: '*Suben* («salgono») viene da *subir*, salire a bordo; *¡Allá vamos!* è il modo naturale per dire «si parte!», o «eccoci!».'
