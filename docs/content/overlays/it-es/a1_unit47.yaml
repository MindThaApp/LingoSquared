teaching:
  es.a1.unit47.lesson01.teach.llamar:
    title: Chiamare
    gloss: chiamare
    note: L'infinito del verbo per fare una telefonata.
    example_gloss: Devo chiamarti.
  es.a1.unit47.lesson01.teach.te_llamo:
    title: Dire che chiamerai
    gloss: Ti chiamo io.
    note: '*Llamo* è la forma di *yo* di *llamar*; con *te* significa "ti chiamo". Come spesso in italiano, per parlare di un''azione imminente lo spagnolo usa il presente.'
  es.a1.unit47.lesson01.teach.hola_soy_elena:
    title: Rispondere al telefono
    gloss: Pronto, sono Elena.
    note: Come in italiano, al telefono lo spagnolo si presenta con *soy* + nome (letteralmente "sono").
  es.a1.unit47.lesson01.teach.hola_soy_mateo:
    title: Mateo risponde allo stesso modo
    gloss: Pronto, sono Mateo.
    note: Stessa struttura *soy* + nome di *Hola, soy Elena*.
  es.a1.unit47.lesson02.teach.con_quien_hablo:
    title: Chiedere chi sta chiamando
    gloss: Con chi parlo?
    note: '*¿Con quién hablo?* è la frase standard quando non sai chi sta chiamando.'
  es.a1.unit47.lesson02.teach.habla_con_elena:
    title: Presentarsi in modo formale
    gloss: Sta parlando con Elena.
    note: '*Habla con* + nome usa la forma di cortesia *usted* di *hablar*: è l''equivalente formale di *soy* + nome.'
  es.a1.unit47.lesson03.teach.puedes_repetir_eso:
    title: Chiedere di ripetere
    gloss: Puoi ripetere?
    note: '*¿Puedes...?* (Puoi...?) più *repetir* (ripetere) più *eso* (quello).'
  es.a1.unit47.lesson03.teach.no_hables_tan:
    title: Chiedere a qualcuno di rallentare
    gloss: Non parlare così in fretta, per favore.
    note: '*No hables* è l''imperativo negativo informale di *hablar*; *tan rápido* (così in fretta) indica il grado.'
  es.a1.unit47.lesson03.teach.no_te_oigo:
    title: Dire che non senti bene
    gloss: Non ti sento bene.
    note: '*Oír* (sentire, percepire con l''udito) con *no ... bien* (non bene) indica un problema di udito, diverso da *entender* (capire); *te oigo* significa «ti sento».'
  es.a1.unit47.lesson04.teach.el_mensaje:
    title: Messaggio
    gloss: il messaggio
    note: 'Un sostantivo maschile: *el mensaje*. In spagnolo si dice anche *el SMS* o *el texto*, ma *mensaje* è la scelta neutra.'
    example_gloss: Il messaggio è di Elena.
  es.a1.unit47.lesson04.teach.te_envio_un:
    title: Dire che manderai un messaggio
    gloss: Ti mando un messaggio.
    note: 'In spagnolo il pronome *te* (a te) precede il verbo *enviar* (mandare): *te envío un mensaje*.'
  es.a1.unit47.lesson04.teach.te_llamo_mas:
    title: Dire che richiamerai
    gloss: Ti chiamo più tardi.
    note: '*Más tarde* (più tardi) chiude la frase: *te llamo más tarde*.'
  es.a1.unit47.lesson05.teach.mateo_hola_elena:
    title: Leggi uno scambio di messaggi
    gloss: 'Mateo: Ciao Elena, puoi chiamarmi? Devo dirti una cosa. Elena: Sì, certo, ti richiamo tra cinque minuti.'
    note: Individua cosa chiede Mateo, perché lo chiede e quando Elena dice che richiamerà.
    glosses:
      Hola: ciao
      puedes: puoi
      llamarme: chiamare
      Tengo: devo
      algo: qualcosa
      contarte: raccontare
      claro: certo
      llamada: chiamare
      cinco: cinque
      minutos: minuti
      devuelvo: restituire
  es.a1.unit47.lesson06.teach.mateo_hola_soy:
    title: Mateo risponde alla chiamata
    gloss: 'Mateo: Pronto, sono Mateo.'
    note: 'Lo stesso schema *soy* + nome della prima lezione, ora usato in una vera telefonata: chi risponde parla per primo e dice il proprio nome.'
  es.a1.unit47.lesson06.teach.elena_hola_mateo:
    title: Elena si presenta
    gloss: 'Elena: Ciao Mateo, sono Elena. Mateo: Grazie della chiamata!'
    note: '*Gracias por llamar* (grazie di aver chiamato) è formato da *gracias por* + infinito.'
  es.a1.unit47.lesson06.teach.elena_como_ha:
    title: Elena chiede del turno
    gloss: 'Elena: Com''è andato il tuo primo turno?'
    note: '*Ha ido* è il passato prossimo di *ir* (qui «andare», nel senso di svolgersi): *ha* + il participio *ido*.'
  es.a1.unit47.lesson06.teach.mateo_ha_ido:
    title: Mateo dà una bella notizia
    gloss: 'Mateo: È andato molto bene, meglio del previsto.'
    note: '*Ha ido muy bien* riprende il passato prossimo della domanda; *mejor de lo esperado* (meglio del previsto) fa il confronto con *de lo*.'
  es.a1.unit47.lesson06.teach.ha_ido_ir:
    title: Ha ido, es, esperado con i loro infiniti
    gloss: ha ido → ir (andare), es → ser (essere), esperado → esperar (aspettarsi)
    note: '*Ha ido*, *es* ed *esperado* sono mostrati con i loro infiniti: *ir*, *ser*, *esperar*. Per ora considera *ha ido muy bien* un''espressione fissa; il passato prossimo lo studierai bene più avanti.'
  es.a1.unit47.lesson06.teach.elena_que_bien:
    title: Elena è orgogliosa
    gloss: 'Elena: Che bello sentirlo! Sono orgogliosa di te.'
    note: '*Orgulloso/a de* (orgoglioso di) è una combinazione fissa con *de*; l''aggettivo concorda con chi parla (*orgullosa* per Elena).'
  es.a1.unit47.lesson06.teach.mateo_muchas_gracias:
    title: Mateo è commosso
    gloss: 'Mateo: Grazie mille, per me significa molto.'
    note: '*Significa* è la terza persona di *significar* (significare); *para mí* (per me) dice a chi importa.'
  es.a1.unit47.lesson06.teach.su_primer_turno:
    title: Il suo
    gloss: Il suo primo turno è andato molto bene.
    note: '*Su* qui è il possessivo «suo» (anche «di lei» o «Suo» con *usted*); il contesto ti dice di chi si tratta.'
