teaching:
  es.a1.unit48.lesson01.teach.leer_hacer_deporte:
    title: Leggere, fare sport, cucinare
    gloss: leggere, fare sport, cucinare
    note: 'Tre verbi comuni per gli hobby: *leer* (leggere), *hacer deporte* (fare sport) e *cocinar* (cucinare).'
    example_gloss:
    - Mi piace leggere un libro.
    - Faccio sport il sabato.
    - Mi piace cucinare per gli amici.
  es.a1.unit48.lesson01.teach.el_tiempo_libre:
    title: Tempo libero
    gloss: tempo libero
    note: '*El tiempo libre* è un''espressione nominale maschile ed è la chiave per parlare degli hobby.'
    example_gloss: Nel mio tempo libero mi piace leggere.
  es.a1.unit48.lesson01.teach.en_mi_tiempo:
    title: Dire che cosa fai nel tempo libero
    gloss: Nel mio tempo libero mi piace leggere.
    note: '*Me gusta leer* (mi piace leggere) usa *gustar* + infinito; *me gusta* resta uguale per qualsiasi attività.'
  es.a1.unit48.lesson02.teach.escuchar_musica_dibujar:
    title: Musica, disegno, videogiochi
    gloss: ascoltare musica, disegnare, giocare ai videogiochi
    note: 'Altri tre verbi per gli hobby: *escuchar música* (ascoltare musica), *dibujar* (disegnare) e *jugar videojuegos* (giocare ai videogiochi).'
    example_gloss:
    - Mi piace ascoltare musica.
    - Disegno spesso.
    - Mi piace giocare ai videogiochi con gli amici.
  es.a1.unit48.lesson02.teach.me_gusta_escuchar:
    title: Dire che ti piace ascoltare musica
    gloss: Mi piace ascoltare musica.
    note: 'In spagnolo *escuchar* vuole il complemento oggetto diretto, senza preposizione: *escuchar música*; in italiano invece si dice «ascoltare» (anch''esso senza preposizione), mentre in spagnolo non esiste nulla come «a».'
  es.a1.unit48.lesson02.teach.me_gusta_jugar:
    title: Dire che ti piace giocare ai videogiochi con gli amici
    gloss: Mi piace giocare ai videogiochi con gli amici.
    note: '*Con amigos* (con gli amici) riprende la preposizione *con* delle lezioni precedenti.'
  es.a1.unit48.lesson03.teach.siempre_a_menudo:
    title: Sempre, spesso, a volte, mai
    gloss: sempre, spesso, a volte, mai
    note: 'I quattro avverbi di frequenza fondamentali: *siempre* (sempre), *a menudo* (spesso), *a veces* (a volte), *nunca* (mai). Di solito si trovano prima del verbo o all''inizio della frase.'
    example_gloss:
    - Faccio sempre sport il sabato.
    - Leggo spesso un libro.
    - A volte disegno.
    - Non gioco mai ai videogiochi.
  es.a1.unit48.lesson03.teach.cada_semana_cada:
    title: Ogni settimana, ogni fine settimana
    gloss: ogni settimana, ogni fine settimana
    note: '*Cada semana* e *cada fin de semana* significano entrambi «ogni»; *cada* non cambia mai forma.'
    example_gloss:
    - Cucino per gli amici ogni settimana.
    - Faccio sport ogni fine settimana.
  es.a1.unit48.lesson03.teach.con_palabras_femeninas:
    title: Cada non cambia mai
    gloss: 'Cada resta invariato: cada semana, cada fin de semana.'
    note: '*Cada* non cambia mai: è uguale davanti a nomi femminili (*semana*) e maschili (*fin de semana*).'
  es.a1.unit48.lesson03.teach.que_haces_en:
    title: Chiedere del tempo libero
    gloss: Che cosa fai nel tempo libero?
    note: 'Questa è la domanda chiave dell''unità: usala per chiedere a chiunque dei suoi hobby.'
  es.a1.unit48.lesson04.teach.elena_a_menudo:
    title: Elena parla degli hobby
    gloss: 'Elena: Spesso facciamo una passeggiata insieme. Ma tu, Mateo, che altro fai nel tuo tempo libero?'
    note: '*A menudo paseamos juntos* (spesso facciamo una passeggiata insieme): *paseamos* è la forma di *nosotros* di *pasear*.'
  es.a1.unit48.lesson04.teach.mateo_me_gusta:
    title: Gli hobby di Mateo
    gloss: 'Mateo: Mi piace cucinare, anche a casa. E faccio sport spesso.'
    note: '*También en casa* (anche a casa) mostra che Mateo cucina per piacere, non solo nel suo lavoro al ristorante.'
  es.a1.unit48.lesson04.teach.elena_cocinas_tambien:
    title: Elena è sorpresa
    gloss: 'Elena: Cucini anche a casa? Cucini già tutto il giorno al lavoro!'
    note: '*Todo el día* (tutto il giorno) sottolinea quanto Mateo cucini già al lavoro.'
  es.a1.unit48.lesson04.teach.mateo_si_pero:
    title: Mateo spiega
    gloss: 'Mateo: Sì, ma per me cucinare è rilassante. E tu, che cosa ti piace fare?'
    note: '*Cocinar me parece relajante* significa letteralmente «cucinare mi sembra rilassante»: *me parece* + aggettivo è un modo naturale per esprimere un''opinione.'
  es.a1.unit48.lesson04.teach.elena_me_gusta:
    title: Gli hobby di Elena
    gloss: 'Elena: Mi piace leggere e ascolto spesso musica.'
    note: Unisce in una frase due verbi di hobby delle lezioni precedenti con *y* (e).
  es.a1.unit48.lesson04.teach.mateo_tu_tambien:
    title: Mateo chiede dei videogiochi
    gloss: 'Mateo: Anche tu giochi ai videogiochi?'
    note: Una breve domanda sì/no con *jugar videojuegos* della lezione 2; *tú también* (anche tu) usa il *tú* informale.
  es.a1.unit48.lesson04.teach.elena_no_nunca:
    title: La risposta di Elena
    gloss: 'Elena: No, non gioco mai ai videogiochi. Però a volte disegno!'
    note: '*Nunca* (mai) e *a veces* (a volte) della lezione 3, messi a confronto in un''unica risposta.'
  es.a1.unit48.lesson05.teach.mateo_y_yo:
    title: Confronto tra hobby
    gloss: Mateo e io facciamo spesso una passeggiata insieme. Ma abbiamo anche altri hobby. A Mateo piace cucinare, anche a casa, e fa sport spesso. A me piace leggere e ascolto spesso musica. A volte disegno, ma non gioco mai ai videogiochi. Che cosa ti piace fare nel tuo tempo libero?
    note: Il messaggio di Elena riassume quanto visto nella lezione 4 e termina ponendo al lettore la domanda chiave dell'unità.
    glosses:
      paseamos: passeggiamo
      menudo: spesso
      juntos: insieme
      otras: altri
      cocinar: cucina
      gusta: piace
      casa: a casa
      deporte: fa sport
      leer: leggere
      escucho: ascolto
      música: musica
      dibujo: disegno
      veces: a volte
      videojuegos: gioco ai videogiochi
      nunca: mai
      libre: libero
      tiempo: tempo
  es.a1.unit48.lesson06.teach.mateo_que_haces:
    title: Mateo chiede del fine settimana
    gloss: 'Mateo: Che fai questo fine settimana?'
    note: '*Este fin de semana* (questo fine settimana) usa *este* con il nome maschile *fin de semana*.'
  es.a1.unit48.lesson06.teach.elena_todavia_no:
    title: Elena è indecisa
    gloss: 'Elena: Non lo so ancora. Mi piace leggere, ma voglio anche uscire.'
    note: '*Quiero salir* (voglio uscire) è un modo comune per dire che vuoi uscire di casa.'
  es.a1.unit48.lesson06.teach.mateo_paseamos_juntos:
    title: Mateo propone un piano
    gloss: 'Mateo: Facciamo una passeggiata insieme? Dopo cucino per noi.'
    note: '*Después* (dopo) è una parola per ordinare le azioni: *primero*, *luego*, *después*.'
  es.a1.unit48.lesson06.teach.elena_buena_idea:
    title: Elena accetta
    gloss: 'Elena: Buona idea! Mi piacciono entrambe le cose: passeggiare e cucinare.'
    note: '*Las dos cosas* (entrambe le cose) mostra che a Elena piacciono allo stesso modo due cose, non una più dell''altra.'
  es.a1.unit48.lesson06.teach.mateo_perfecto_entonces:
    title: Mateo conferma
    gloss: 'Mateo: Perfetto! Allora ci vediamo sabato!'
    note: 'Una frase di chiusura amichevole che conferma il piano per *el sábado* (sabato): in spagnolo davanti a un giorno preciso si usa *el*, mentre in italiano di solito non si mette l''articolo.'
