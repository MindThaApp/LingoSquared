answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spagnolo A1
  description: Chiedere prezzi e quantità al mercato, continuando la storia di Elena e Mateo con la spesa per la prossima lezione del laboratorio. Particolare attenzione a docena, kilo e medio kilo, parole di quantità con una loro grammatica.
units:
  es.a1.unit07.shopping:
    title: La spesa al mercato
lessons:
  es.a1.unit07.lesson01.el_mercado:
    title: Il mercato
  es.a1.unit07.lesson02.preguntar_el_precio:
    title: Chiedere il prezzo
  es.a1.unit07.lesson03.cantidades:
    title: 'Quantità: dozzina, chilo, un po'' di'
  es.a1.unit07.lesson04.una_compra_sencilla:
    title: Un semplice acquisto
  es.a1.unit07.lesson05.leer_las_etiquetas_de_precio:
    title: Leggere i cartellini dei prezzi
  es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue:
    title: Elena e Mateo vanno al mercato
teaching:
  es.a1.unit07.lesson01.teach.el_mercado:
    title: Il mercato
    gloss: il mercato
    note: '*Mercado* è maschile.'
    example_gloss: Andiamo al mercato.
  es.a1.unit07.lesson01.teach.fruta_verdura:
    title: Frutta, verdura
    gloss: frutta, verdura
    note: '*Verdura* indica la verdura in generale (spesso quella verde); è un sostantivo femminile singolare usato anche in senso collettivo, come in italiano «la verdura».'
    example_gloss:
    - Voglio comprare della frutta.
    - La verdura è fresca.
  es.a1.unit07.lesson01.teach.huevos_pan:
    title: Uova, pane
    gloss: uova, pane
    note: '*Huevos* è già plurale (il singolare è *huevo*); *pan* è un nome non numerabile e nel senso comune non ha un plurale naturale.'
    example_gloss:
    - Ho bisogno di uova.
    - Il pane è di stamattina.
  es.a1.unit07.lesson02.teach.cuanto_cuesta:
    title: Chiedere il prezzo
    gloss: Quanto costa?
    note: '*Cuesta* è la terza persona di *costar* (costare), un verbo nuovo di questa unità.'
  es.a1.unit07.lesson02.teach.cuanto_es:
    title: Chiedere il prezzo, forma alternativa
    gloss: Quanto viene?
    note: Vedi la nota di grammatica successiva, che la confronta con *¿Cuánto cuesta?*.
  es.a1.unit07.lesson02.teach.cuesta_dos:
    title: Dire un prezzo
    gloss: Costa due.
    note: 'Una risposta breve e completa sul prezzo: la valuta o l''unità si capisce dal contesto, come in italiano quando si dice solo un numero durante un acquisto.'
  es.a1.unit07.lesson02.teach.cuanto_cuesta_vs_es_note:
    title: Cuánto cuesta e Cuánto es
    gloss: Due modi ugualmente naturali per chiedere il prezzo.
    note: Vedi il testo della scheda.
    target_text: '*¿Cuánto cuesta?* (quanto costa?) e *¿Cuánto es?* (quanto viene?) sono due modi naturali per chiedere un prezzo: in questo contesto di acquisti quotidiani si equivalgono.'
  es.a1.unit07.lesson03.teach.una_docena_de_huevos:
    title: Chiedere una dozzina di uova
    gloss: Una dozzina di uova, per favore.
    note: '*Docena* (dozzina) è un sostantivo e in spagnolo è sempre seguito da *de* più l''elemento, come in italiano «una dozzina di uova».'
  es.a1.unit07.lesson03.teach.un_kilo_de_tomates:
    title: Chiedere un chilo di pomodori
    gloss: Un chilo di pomodori, per favore.
    note: '*Kilo* segue lo stesso schema di *docena*: *de* più l''elemento.'
  es.a1.unit07.lesson03.teach.medio_kilo:
    title: Mezzo chilo
    gloss: mezzo chilo
    note: '*Medio* (mezzo) precede il nome a cui si riferisce e concorda in genere (*medio kilo*, maschile; *media docena* sarebbe femminile).'
    example_gloss: Mezzo chilo di pane, per favore.
  es.a1.unit07.lesson03.teach.un_poco_de:
    title: Un po' di
    gloss: un po' di
    note: '*Un poco de* si usa per una piccola quantità non precisata, quando non serve una misura esatta.'
    example_gloss: Voglio un po' di frutta.
  es.a1.unit07.lesson04.teach.necesita_algo_mas:
    title: Chiedere se serve altro
    gloss: Ha bisogno di altro?
    note: '*Necesita* è la forma di *usted* di *necesitar*, il registro di cortesia che di solito un venditore usa con il cliente.'
  es.a1.unit07.lesson04.teach.no_creo_que_ya_tenemos_todo:
    title: Dire che si ha tutto
    gloss: No, credo che abbiamo già tutto.
    note: '*Creo que* (credo che) è un modo comune per attenuare un''affermazione; qui conferma che la lista della spesa è completa.'
  es.a1.unit07.lesson04.teach.gracias_vendedor:
    title: Ringraziare il venditore
    gloss: Perfetto, grazie.
    note: Una chiusura breve e naturale per concludere un acquisto.
  es.a1.unit07.lesson05.teach.etiquetas_reading:
    title: Leggere i cartellini dei prezzi
    gloss: 'Bancarella di Rosa: pomodori, due al chilo. Uova, quattro la dozzina. Pane, sei. Frutta fresca tutti i giorni.'
    note: 'Un tipico cartellino di una bancarella al mercato: il prodotto, il prezzo e poi l''unità a cui si riferisce il prezzo (*el kilo*, *la docena*). *Puesto* è una bancarella del mercato; questa è gestita da Rosa.'
    glosses:
      Puesto: bancarella
      tomates: pomodori
      kilo: chilo
      Huevos: uova
      docena: dozzina
      Pan: pane
      Fruta: frutta
      fresca: fresca
      todos: ogni / tutti
      días: giorni
  es.a1.unit07.lesson05.teach.el_kilo_note:
    title: El kilo come «al chilo»
    gloss: Come un'unità di misura dopo un prezzo significa «al» o «la» per quell'unità.
    note: Vedi il testo della scheda.
    target_text: '*El kilo* dopo un prezzo ("tomates, dos el kilo") significa «al chilo»: il prezzo vale per ogni chilo che compri.'
  es.a1.unit07.lesson06.teach.line01:
    title: Proporre di andare al mercato
    gloss: Elena propone di andare al mercato a comprare gli ingredienti per la prossima lezione.
    note: '*Para la próxima clase* significa «per la prossima lezione», cioè il prossimo incontro del laboratorio di cucina.'
  es.a1.unit07.lesson06.teach.line02:
    title: Essere d'accordo e chiedere cosa serve
    gloss: Mateo è d'accordo e chiede cosa serve loro.
    note: '*¿Qué necesitamos?* usa la forma *nosotros* di *necesitar*, che corrisponde a «ci serve / abbiamo bisogno di» con il «noi» incluso nel verbo.'
  es.a1.unit07.lesson06.teach.line03:
    title: Far notare dei pomodori freschi
    gloss: Elena dice che prima serve la verdura fresca e fa notare quanto sono freschi i pomodori.
    note: '*¡Qué tomates tan frescos!* (che pomodori freschi!) è un''esclamazione con *qué*, come *¡Qué bonito!* dell''Unità 3, ma costruita con un nome: *qué* + nome + *tan* + aggettivo.'
  es.a1.unit07.lesson06.teach.line04:
    title: Il venditore chiede la quantità
    gloss: Il venditore chiede a Elena quanto ne vuole.
    note: '*Señorita* è un modo cortese di rivolgersi a una giovane donna, in linea con il registro di *usted* del venditore verso una cliente (oggi alcuni parlanti lo trovano un po'' antiquato).'
  es.a1.unit07.lesson06.teach.line05:
    title: Ordinare un chilo e chiedere il prezzo
    gloss: Elena chiede un chilo e chiede il prezzo.
    note: Unisce *un kilo* e *¿Cuánto cuesta?*, visti prima in questa unità, in uno scambio naturale.
  es.a1.unit07.lesson06.teach.line06:
    title: Dire il prezzo
    gloss: Il venditore dice che costa due.
    note: '*Cuesta dos*: una breve risposta sul prezzo, con la valuta sottintesa dal contesto.'
  es.a1.unit07.lesson06.teach.line07:
    title: Mateo ordina uova e pane
    gloss: Mateo dice che gli servono una dozzina di uova e del pane.
    note: Unisce *huevos*/*pan* a *una docena de*, visto prima in questa unità; *yo* è facoltativo e aggiunge un po' di enfasi («io ho bisogno di...»).
  es.a1.unit07.lesson06.teach.line08:
    title: Il venditore dice entrambi i prezzi
    gloss: Il venditore dice che le uova costano quattro e il pane sei.
    note: '*Cuestan* (plurale, «costano») concorda con il soggetto plurale *los huevos*, a differenza del singolare *cuesta* usato per i pomodori.'
  es.a1.unit07.lesson06.teach.line09:
    title: Ringraziare il venditore
    gloss: Mateo dice che va benissimo, grazie.
    note: La stessa breve formula di chiusura vista prima in questa unità.
  es.a1.unit07.lesson06.teach.line10:
    title: Chiedere a un amico se serve altro
    gloss: Elena chiede a Mateo se gli serve altro.
    note: '*¿Necesitas...?* è la forma del *tú*, per un amico; il *¿Necesita...?* del venditore è la forma di *usted*.'
  es.a1.unit07.lesson06.teach.line11:
    title: Dire che si ha tutto
    gloss: Mateo dice di no, che pensa che abbiano già tutto.
    note: '*Creo que* («credo che») attenua la risposta; *ya* significa «già».'
