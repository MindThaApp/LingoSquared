teaching:
  es.a1.unit46.lesson01.teach.no_me_siento:
    title: Non sentirsi bene
    gloss: Non mi sento bene.
    note: '*Sentirse* è riflessivo (*me siento*, *te sientes*), come in italiano «sentirsi»; *no me siento bien* è il modo generico e leggero per dire che qualcosa non va.'
  es.a1.unit46.lesson01.teach.enfermo:
    title: Malato
    gloss: malato
    note: 'Un aggettivo di base, usato con *estar* (per gli stati): *estoy enfermo*.'
    example_gloss: Sono malato.
  es.a1.unit46.lesson01.teach.estoy_enfermo:
    title: Essere malati
    gloss: Sono malato.
    note: '*Enfermo* indica uno stato più generale e più forte di *no me siento bien*; cambia secondo il genere di chi parla (*enferma*).'
  es.a1.unit46.lesson01.teach.dolor_de_cabeza:
    title: Mal di testa
    gloss: un mal di testa
    note: 'In spagnolo si usa *dolor de cabeza* con *tener* e senza articolo: *tengo dolor de cabeza*. In italiano invece si dice «ho mal di testa» ma anche «ho un mal di testa».'
    example_gloss: Ho mal di testa.
  es.a1.unit46.lesson01.teach.tengo_dolor_de:
    title: Avere mal di testa
    gloss: Ho mal di testa.
    note: 'I sintomi si combinano con *tener* (avere), come in italiano: *tengo dolor de cabeza*, «ho mal di testa».'
  es.a1.unit46.lesson01.teach.dolor_de_estomago:
    title: Mal di stomaco
    gloss: un mal di stomaco
    note: 'Stesso schema senza articolo di *dolor de cabeza*: *dolor de estómago*.'
    example_gloss: Ho mal di stomaco.
  es.a1.unit46.lesson01.teach.tengo_dolor_de_2:
    title: Avere mal di stomaco
    gloss: Ho mal di stomaco.
    note: Segue lo stesso schema con *tener* di *dolor de cabeza*.
  es.a1.unit46.lesson02.teach.que_pasa:
    title: Chiedere in generale
    gloss: Che cos'hai?
    note: Un modo generico, valido in ogni situazione, per chiedere se c'è qualche problema.
  es.a1.unit46.lesson02.teach.que_te_pasa:
    title: Un'espressione comune
    gloss: Che cos'hai?
    note: '*¿Qué te pasa?* è il modo naturale per chiedere cosa non va (letteralmente «che cosa ti succede?»); non va tradotto parola per parola.'
  es.a1.unit46.lesson02.teach.dolor_de_garganta:
    title: Mal di gola
    gloss: un mal di gola
    note: 'Stesso schema di *dolor de cabeza* e *dolor de estómago*: *dolor de garganta*.'
    example_gloss: Ho mal di gola.
  es.a1.unit46.lesson02.teach.tengo_dolor_de:
    title: Avere mal di gola
    gloss: Ho mal di gola.
    note: Segue lo stesso schema con *tener* degli altri sintomi.
  es.a1.unit46.lesson02.teach.estas_bien_no:
    title: Chiedere a qualcuno come sta
    gloss: Stai bene? No, non mi sento bene.
    note: '*¿Estás bien?* è una domanda molto comune e informale tra amici; con una persona a cui dai del *usted* diventa *¿Está bien?*.'
  es.a1.unit46.lesson03.teach.fiebre:
    title: Febbre
    gloss: una febbre
    note: 'Si usa senza articolo dopo *tener*, come gli altri sintomi: *tengo fiebre*.'
    example_gloss: Ho la febbre.
  es.a1.unit46.lesson03.teach.tengo_fiebre:
    title: Avere la febbre
    gloss: Ho la febbre.
    note: Segue lo schema con *tener*.
  es.a1.unit46.lesson03.teach.resfriado:
    title: Essere raffreddato
    gloss: raffreddato / avere il raffreddore
    note: '*Resfriado* è un aggettivo usato con *estar*; si può dire anche *tengo un resfriado*, con il sostantivo *resfriado*.'
    example_gloss: Ho il raffreddore.
  es.a1.unit46.lesson03.teach.estoy_resfriado:
    title: Dire che hai il raffreddore
    gloss: Ho il raffreddore.
    note: Lo spagnolo può dire *estoy resfriado* (aggettivo), mentre in italiano di solito si dice «ho il raffreddore»; l'aggettivo cambia secondo il genere di chi parla (*resfriada*).
  es.a1.unit46.lesson03.teach.enfermo_y_resfriado:
    title: Estar o tener dipende dal tipo di parola
    gloss: 'Enfermo e resfriado sono aggettivi e si usano con estar: sono malato, sono raffreddato. Fiebre e dolor de cabeza sono sostantivi e si usano con tener: ho la febbre, ho mal di testa.'
    note: 'La scelta tra *estar* e *tener* dipende dal tipo di parola: gli aggettivi (*enfermo*, *resfriado*) vogliono *estar*, i sostantivi che indicano sintomi (*fiebre*, *dolor de cabeza*) vogliono *tener*.'
  es.a1.unit46.lesson04.teach.la_farmacia:
    title: La farmacia
    gloss: la farmacia
    note: 'Un sostantivo femminile: *la farmacia*.'
    example_gloss: Vado in farmacia.
  es.a1.unit46.lesson04.teach.en_que_puedo:
    title: Il saluto del farmacista
    gloss: Come posso aiutarla?
    note: '*¿En qué puedo ayudarle?* è una domanda di servizio formale standard; *ayudarle* usa il pronome complemento formale *le*, corrispondente al *usted*.'
  es.a1.unit46.lesson04.teach.tiene_algo_para:
    title: Chiedere qualcosa per un sintomo
    gloss: Ha qualcosa per il mal di testa?
    note: '*Algo para* + sintomo è il modo naturale per chiedere un rimedio: *algo para el dolor de cabeza*.'
  es.a1.unit46.lesson04.teach.una_pastilla:
    title: Una pastiglia
    gloss: una pastiglia / compressa
    note: 'Un sostantivo femminile: *la pastilla*; *una pastilla* è una pastiglia o compressa.'
    example_gloss: Prendo una pastiglia.
  es.a1.unit46.lesson04.teach.toma_una_pastilla:
    title: Istruzioni per la dose
    gloss: Prendi una pastiglia due volte al giorno.
    note: '*Toma* è l''imperativo informale di *tomar* (prendere), usato per le istruzioni.'
  es.a1.unit46.lesson04.teach.en_la_farmacia:
    title: Il registro in farmacia
    gloss: In farmacia si usa la forma di cortesia usted.
    note: 'Il farmacista è un adulto sconosciuto che lavora a contatto con il pubblico, quindi si usa *usted*: *¿Tiene algo...?* invece di *¿Tienes algo...?*.'
  es.a1.unit46.lesson05.teach.consejo_toma_una:
    title: Leggi un consiglio della farmacia
    gloss: 'Consiglio: prendi una pastiglia due volte al giorno con acqua. Riposa bene e bevi molta acqua. Dopo tre giorni continui a non sentirti bene? Allora vai dal medico.'
    note: Individua la posologia, i due consigli che non riguardano il farmaco e quando andare dal medico.
    glosses:
      Consejo: consiglio
      toma: prendi
      veces: volte
      día: giorno
      pastilla: pastiglia
      Descansa: riposa
      bebe: bevi
      sentirte: sentirsi
      sigues: ancora
      bien: bene
      médico: medico
  es.a1.unit46.lesson06.teach.elena_hola_mateo:
    title: Elena chiede come sta
    gloss: 'Elena: Ciao Mateo, come stai? Ti senti già meglio?'
    note: '*Ya* (già) mostra che Elena vuole sapere se Mateo sta meglio dall''ultima volta che si sono sentiti; *te sientes* è la forma informale con *tú* di *sentirse*.'
  es.a1.unit46.lesson06.teach.mateo_todavia_no:
    title: Mateo non sta ancora bene
    gloss: 'Mateo: Non ancora molto bene. Ho ancora mal di testa e sono stanco.'
    note: '*Sigo con* (ho ancora) indica che il mal di testa non è passato; *cansado* (stanco) è un aggettivo nuovo e utile che cambia con il genere (*cansada*).'
  es.a1.unit46.lesson06.teach.elena_has_tomado:
    title: Elena chiede della medicina
    gloss: 'Elena: Hai preso una pastiglia?'
    note: '*Has tomado* è il passato prossimo: *has* + il participio *tomado*, lo stesso schema di *me has ayudado*.'
  es.a1.unit46.lesson06.teach.mateo_si_he:
    title: Mateo conferma
    gloss: 'Mateo: Sì, ho preso una pastiglia. Ora vado a riposare.'
    note: '*Voy a descansar* (vado a riposare) usa lo schema del futuro prossimo *ir a* + infinito.'
  es.a1.unit46.lesson06.teach.elena_buena_idea:
    title: Elena gli fa gli auguri
    gloss: 'Elena: Buona idea. Riposati bene. Guarisci presto!'
    note: '*¡Que te mejores!* è l''espressione fissa per augurare a qualcuno una pronta guarigione; usa il congiuntivo *mejores*.'
  es.a1.unit46.lesson06.teach.mateo_gracias_hasta:
    title: Mateo saluta
    gloss: 'Mateo: Grazie, a domani!'
    note: '*Hasta mañana* segue lo schema *hasta* + tempo, come il saluto *hasta luego*.'
