answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spagnolo A1
  description: Numeri da 0 a 100, età, numeri di telefono e quantità delle ricette, in continuità con Elena e Mateo al laboratorio di cucina dell'unità 1. Si mettono in evidenza le espressioni dell'età con tener e la concordanza di genere nelle espressioni di quantità.
