  es.a1.unit02.lesson01.numbers_zero_to_ten:
    title: I numeri da zero a dieci
  es.a1.unit02.lesson02.numbers_eleven_to_hundred:
    title: Da undici a cento
  es.a1.unit02.lesson03.asking_age:
    title: Chiedere l'età a qualcuno
  es.a1.unit02.lesson04.phone_numbers:
    title: I numeri di telefono
  es.a1.unit02.lesson05.recipe_quantities:
    title: Le quantità delle ricette
  es.a1.unit02.lesson06.recipe_count_dialogue:
    title: Contare gli ingredienti con Elena e Mateo
teaching:
  es.a1.unit02.lesson01.teach.cero:
    title: Zero
    gloss: zero
    note: '*Cero* si usa sia come numero a sé sia come cifra quando si leggono ad alta voce sequenze di cifre.'
  es.a1.unit02.lesson01.teach.uno:
    title: Uno
    gloss: uno
    note: '*Uno* diventa *un* davanti a un sostantivo maschile singolare (*un huevo*, un uovo) e *una* davanti a uno femminile (*una taza*, una tazza). Da solo, quando si conta, resta *uno*.'
  es.a1.unit02.lesson01.teach.dos:
    title: Due
    gloss: due
    note: '*Dos* non cambia mai forma, qualunque sia il genere del sostantivo.'
  es.a1.unit02.lesson01.teach.tres:
    title: Tre
    gloss: tre
    note: '*Tres*, come *dos*, è invariabile.'
  es.a1.unit02.lesson01.teach.cuatro:
    title: Quattro
    gloss: quattro
    note: '*Cuatro* è invariabile.'
  es.a1.unit02.lesson01.teach.cinco:
    title: Cinque
    gloss: cinque
    note: '*Cinco* è invariabile.'
  es.a1.unit02.lesson01.teach.seis:
    title: Sei
    gloss: sei
    note: '*Seis* è invariabile.'
  es.a1.unit02.lesson01.teach.siete:
    title: Sette
    gloss: sette
    note: '*Siete* è invariabile.'
  es.a1.unit02.lesson01.teach.ocho:
    title: Otto
    gloss: otto
    note: '*Ocho* è invariabile.'
  es.a1.unit02.lesson01.teach.nueve:
    title: Nove
    gloss: nove
    note: '*Nueve* è invariabile.'
  es.a1.unit02.lesson01.teach.diez:
    title: Dieci
    gloss: dieci
    note: '*Diez* è invariabile.'
  es.a1.unit02.lesson02.teach.once:
    title: Undici
    gloss: undici
    note: Da *once* a *quince* (11-15) sono parole singole da imparare come serie; da sedici a diciannove i numeri si formano a partire da *diez* (*dieciséis*, *diecisiete*...).
  es.a1.unit02.lesson02.teach.doce:
    title: Dodici
    gloss: dodici
    note: '*Doce* è una parola a sé; assomiglia a *dos*, ma ha una forma propria.'
  es.a1.unit02.lesson02.teach.trece:
    title: Tredici
    gloss: tredici
    note: '*Trece* è una parola a sé; assomiglia a *tres*, ma ha una forma propria.'
  es.a1.unit02.lesson02.teach.catorce:
    title: Quattordici
    gloss: quattordici
    note: '*Catorce* è una parola a sé; assomiglia a *cuatro*, ma ha una forma propria.'
  es.a1.unit02.lesson02.teach.quince:
    title: Quindici
    gloss: quindici
    note: '*Quince* è l''ultimo dei numeri a parola unica prima che lo schema cambi con il sedici.'
  es.a1.unit02.lesson02.teach.veinte:
    title: Venti
    gloss: venti
    note: '*Veinte* è una parola a sé. Da *veintiuno* (21) fino a ventinove, decine e unità si fondono in un''unica parola scritta, uno schema che il corso riprende con *veintiocho* nella lezione 3.'
  es.a1.unit02.lesson02.teach.treinta:
    title: Trenta
    gloss: trenta
    note: 'Da trenta in poi, decine e unità si uniscono con *y* (e) in tre parole separate, senza fondersi come nei numeri tra venti e ventinove. In italiano invece si scrive una parola sola: trentaquattro.'
  es.a1.unit02.lesson02.teach.treinta_y_cuatro:
    title: Trentaquattro
    gloss: trentaquattro
    note: '*Treinta y cuatro* si scrive in tre parole separate: la decina, *y* e l''unità.'
  es.a1.unit02.lesson02.teach.cien:
    title: Cento
    gloss: cento
    note: '*Cien* è la forma usata per 100 esatto, da solo; quando il numero continua si usa *ciento* (*ciento uno*, 101), che in questa unità non si studia ancora.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tienes:
    title: Chiedere l'età (informale)
    gloss: Quanti anni hai?
    note: 'Come in italiano, lo spagnolo usa *tener* (avere) per l''età: letteralmente chiede quanti anni hai, senza usare *ser* o *estar*.'
  es.a1.unit02.lesson03.teach.tengo_veintiocho:
    title: Dire la propria età
    gloss: Ho ventotto anni.
    note: '*Tengo* è la forma di *tener* per «yo». Una risposta completa di solito include *años* (anni); quando l''età è già l''argomento, si può omettere, come in *Tengo treinta y uno*.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tiene_usted:
    title: Chiedere l'età (formale)
    gloss: Quanti anni hai?
    note: '*Tiene* è la forma di *usted* di *tener*, in linea con il registro formale introdotto nell''unità 1.'
  es.a1.unit02.lesson03.teach.tengo_treinta_y_uno:
    title: Dire un'età con un numero composto
    gloss: Ho trentun anni.
    note: '*Treinta y uno* mantiene *uno* (non *un*) perché in questa risposta nessun sostantivo lo segue direttamente.'
  es.a1.unit02.lesson03.teach.y_tu_cuantos:
    title: Restituire la domanda sull'età
    gloss: E tu, quanti anni hai?
    note: '*Tienes* senza ripetere *años* è un''abbreviazione naturale e molto comune quando l''argomento è già chiaro.'
  es.a1.unit02.lesson04.teach.cual_es_tu_numero:
    title: Chiedere il numero di telefono
    gloss: Qual è il tuo numero di telefono?
    note: '*Cuál*, e non *qué*, è la scelta naturale quando si chiede di indicare un elemento specifico tra tanti possibili, come un numero di telefono.'
  es.a1.unit02.lesson04.teach.numero_elena:
    title: Un numero letto cifra per cifra
    gloss: Sei, uno, cinque, zero, due, nove, sette, tre
    note: Un numero di telefono si può leggere una cifra alla volta, come qui. Molti ispanofoni raggruppano anche le cifre a due a due, quindi fai attenzione a entrambi gli stili.
  es.a1.unit02.lesson04.teach.es_el:
    title: Introdurre il numero
    gloss: È il...
    note: Si usa *el* (articolo maschile) perché *número* è un sostantivo maschile.
  es.a1.unit02.lesson04.teach.puedes_repetir:
    title: Chiedere di ripetere
    gloss: Puoi ripetere, per favore?
    note: '*Puedes* è la forma di *tú* di *poder* (potere); è utile quando un numero detto ad alta voce passa troppo in fretta.'
  es.a1.unit02.lesson04.teach.claro:
    title: Accettare volentieri
    gloss: Certo; sicuro
    note: '*Claro* è un modo comune e cordiale per accettare una richiesta.'
  es.a1.unit02.lesson05.teach.necesito_tres_huevos:
    title: Dire una quantità necessaria
    gloss: Mi servono tre uova.
    note: '*Necesito* è la forma di prima persona singolare (yo) di *necesitar* (avere bisogno di). *Huevos* (uova) resta al plurale dopo qualsiasi numero maggiore di uno.'
  es.a1.unit02.lesson05.teach.cuantos_huevos_necesitas:
    title: Chiedere quante ne servono
    gloss: Quante uova ti servono?
    note: '*Cuántos* concorda in genere e numero con il sostantivo su cui si chiede; *huevos* è maschile plurale, quindi si usa *cuántos* (non *cuántas*).'
  es.a1.unit02.lesson05.teach.dos_tazas_harina:
    title: Dire una quantità misurata
    gloss: Due tazze di farina
    note: '*De* collega l''unità di misura (*tazas*, tazze) a ciò che viene misurato (*harina*, farina), come il «di» italiano.'
  es.a1.unit02.lesson05.teach.media_taza:
    title: Dire una mezza quantità
    gloss: Mezza tazza di zucchero
    note: '*Media* concorda con il sostantivo femminile *taza*; la forma maschile *medio* si usa invece con i sostantivi maschili.'
  es.a1.unit02.lesson05.teach.tengo_cuatro_huevos:
    title: Dire cosa si ha a disposizione
    gloss: Ho quattro uova sul tavolo.
    note: '*Tengo* (ho) indica ciò che è già disponibile, diversamente da *necesito* (mi serve), che indica ciò che ancora manca.'
  es.a1.unit02.lesson06.teach.line01:
    title: Chiedere quante uova
    gloss: Elena chiede a Mateo quante uova gli servono per la ricetta.
    note: Prosegue il registro del *tú* dell'Unità 1 tra i due coetanei.
  es.a1.unit02.lesson06.teach.line02:
    title: Dire gli ingredienti
    gloss: Mateo dice che gli servono tre uova e due tazze di farina.
    note: '*Necesito* indica ciò che serve ancora per la ricetta.'
  es.a1.unit02.lesson06.teach.line03:
    title: Offrire ciò che si ha
    gloss: Elena dice che ha quattro uova sul tavolo e chiede se gli serve anche lo zucchero.
    note: '*Tengo* indica ciò che Elena ha già a disposizione, a differenza di ciò che Mateo ha detto di aver bisogno.'
  es.a1.unit02.lesson06.teach.line04:
    title: Confermare una piccola quantità
    gloss: 'Mateo dice di sì, un po'': circa mezza tazza.'
    note: Qui *como* significa «circa» o «più o meno», non il suo senso più comune di «come».
  es.a1.unit02.lesson06.teach.line05:
    title: Chiedere il numero di telefono
    gloss: Elena dice che va benissimo, poi chiede a Mateo il numero di telefono per scrivergli riguardo alla prossima lezione.
    note: '*Así te escribo* («così ti scrivo») spiega perché lo chiede, un''abitudine conversazionale naturale prima di chiedere un contatto.'
  es.a1.unit02.lesson06.teach.line06:
    title: Dare il numero di telefono
    gloss: Mateo legge il suo numero cifra per cifra.
    note: '*Es el* introduce il numero, con l''articolo maschile come *número*.'
  es.a1.unit02.lesson06.teach.line07:
    title: Ringraziare e chiedere l'età
    gloss: 'Elena lo ringrazia, poi fa un''altra domanda: quanti anni ha.'
    note: '*Una pregunta más* («un''altra domanda») segnala un naturale cambio di argomento nella stessa conversazione.'
  es.a1.unit02.lesson06.teach.line08:
    title: Dire la sua età
    gloss: Mateo dice che ha ventotto anni e fa la stessa domanda a Elena.
    note: '*Tengo veintiocho años* usa la forma unita dei numeri in venti, secondo lo schema della lezione 2.'
  es.a1.unit02.lesson06.teach.line09:
    title: Dire la sua età
    gloss: Elena dice che ha trentun anni.
    note: '*Tengo treinta y uno* omette *años* perché l''argomento (l''età) è già chiaro dal contesto: un''abbreviazione naturale, come nella lezione 3, dove si restituisce la domanda senza ripetere *años*.'
