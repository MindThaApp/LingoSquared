teaching:
  es.a1.unit10.lesson01.teach.el_tiempo:
    title: Il tempo
    gloss: il tempo (meteorologico)
    note: '*Tiempo* significa anche "tempo" in senso cronologico: il contesto distingue i due significati.'
    example_gloss: Che tempo fa oggi?
  es.a1.unit10.lesson01.teach.el_sol:
    title: Il sole
    gloss: il sole
    note: '*Sol* è maschile.'
    example_gloss: Oggi c'è un bel sole.
  es.a1.unit10.lesson01.teach.la_lluvia:
    title: La pioggia
    gloss: la pioggia
    note: '*Lluvia* è femminile.'
    example_gloss: Non mi piace la pioggia.
  es.a1.unit10.lesson01.teach.el_viento:
    title: Il vento
    gloss: il vento
    note: '*Viento* è maschile.'
    example_gloss: Oggi c'è molto vento.
  es.a1.unit10.lesson01.teach.la_nube:
    title: La nuvola
    gloss: la nuvola
    note: '*Nube* è femminile.'
    example_gloss: Non c'è nemmeno una nuvola.
  es.a1.unit10.lesson02.teach.hace_calor:
    title: Fa caldo
    gloss: Fa caldo.
    note: '*Hace calor* (letteralmente "fa caldo") è l''espressione abituale per descrivere il tempo caldo.'
    example_gloss: A luglio fa molto caldo.
  es.a1.unit10.lesson02.teach.hace_frio:
    title: Fa freddo
    gloss: Fa freddo.
    note: '*Hace frío* segue la stessa struttura *hace* + nome di *hace calor*.'
    example_gloss: A dicembre fa freddo.
  es.a1.unit10.lesson02.teach.hace_sol:
    title: C'è il sole
    gloss: C'è il sole.
    note: '*Hace sol* usa *el sol* (il sole) all''interno dello stesso schema idiomatico.'
  es.a1.unit10.lesson02.teach.llueve:
    title: Piove
    gloss: Piove.
    note: '*Llueve* è una forma verbale a sé (da *llover*), non segue lo schema di *hace*: vedi la nota di grammatica successiva.'
  es.a1.unit10.lesson02.teach.esta_nublado:
    title: È nuvoloso
    gloss: È nuvoloso.
    note: '*Está nublado* usa *estar* + aggettivo, un terzo schema diverso per parlare del tempo.'
  es.a1.unit10.lesson02.teach.hace_vs_esta_note:
    title: 'Hace, llueve, está: tre schemi'
    gloss: Tre schemi grammaticali diversi per descrivere il tempo atmosferico.
    note: Vedi il testo della scheda.
    target_text: 'Le espressioni del tempo con *hace* (hace calor, hace frío, hace sol) sono formule fisse, letteralmente "fa caldo/freddo/sole". *Llueve* (piove) è una forma verbale a sé, e *está nublado* (è nuvoloso) usa *estar* + aggettivo: tre strutture diverse per la stessa idea, descrivere il tempo.'
  es.a1.unit10.lesson03.teach.que_tiempo_hace_hoy:
    title: Chiedere del tempo
    gloss: Che tempo fa oggi?
    note: '*¿Qué tiempo hace hoy?* è il modo standard per chiedere che tempo fa, con *el tiempo* (il tempo atmosferico).'
  es.a1.unit10.lesson03.teach.hace_mucho_calor_y_sol:
    title: Descrivere un tempo caldo e soleggiato
    gloss: Fa molto caldo e c'è il sole.
    note: Unisce due espressioni con *hace* tramite *y* (e).
  es.a1.unit10.lesson03.teach.hace_calor_pero_hay_viento:
    title: Descrivere un tempo caldo e ventoso
    gloss: Fa caldo, ma c'è vento.
    note: '*Pero* (ma) contrappone due fatti meteorologici: caldo e vento, con *hay* + nome come in *hay mucho viento*.'
  es.a1.unit10.lesson04.teach.en_invierno_hace_frio_en_madrid:
    title: Parlare dell'inverno a Madrid
    gloss: In inverno a Madrid fa molto freddo.
    note: '*En invierno* (in inverno) introduce il nome di una stagione, in contrasto con *en julio* qui sotto.'
  es.a1.unit10.lesson04.teach.en_julio_hace_demasiado_calor:
    title: Parlare del caldo di luglio
    gloss: A luglio fa troppo caldo.
    note: '*Demasiado* (troppo) rafforza *calor* più del semplice *mucho* (molto).'
  es.a1.unit10.lesson04.teach.necesitamos_agua:
    title: Spiegare perché serve l'acqua
    gloss: Abbiamo bisogno di acqua perché fa caldo.
    note: '*Porque* (perché) collega un bisogno alla sua causa meteorologica: una frase pratica, utile per il laboratorio.'
  es.a1.unit10.lesson05.teach.pronostico_reading:
    title: Leggere le previsioni del tempo
    gloss: Oggi, 22 luglio, fa molto caldo e c'è il sole. Non c'è nemmeno una nuvola. C'è anche un po' di vento. È una bella giornata per andare al laboratorio di cucina, ma è importante portare l'acqua.
    note: Una breve previsione per il 22 luglio, il giorno del corso di cucina.
    glosses:
      Hoy: oggi
      veintidós: ventidue (ventiduesimo)
      julio: luglio
      hace: fa / c'è (da hacer)
      calor: caldo
      sol: sole
      hay: c'è / ci sono (da haber)
      nube: nuvola
      También: anche
      poco: poco
      viento: vento
      buen: buono
      día: giorno
      ir: andare
      taller: laboratorio
      cocina: cucina
      importante: importante
      llevar: portare
      agua: acqua
  es.a1.unit10.lesson05.teach.un_poco_de_note:
    title: Un poco de (un po' di)
    gloss: Come un poco de indica una piccola quantità.
    note: Vedi il testo della scheda.
    target_text: '*Un poco de* (un po'' di) si usa con le quantità di cibo, e qui indica una piccola quantità di vento: la stessa struttura con un nome nuovo.'
  es.a1.unit10.lesson06.teach.line01:
    title: Commentare il caldo
    gloss: Elena commenta quanto fa caldo oggi.
    note: '*¡Qué calor hace hoy!* (che caldo fa oggi!) è un uso esclamativo dell''espressione *hace calor*.'
  es.a1.unit10.lesson06.teach.line02:
    title: Essere d'accordo e aggiungere un dettaglio
    gloss: Mateo è d'accordo e nota che non c'è nemmeno una nuvola.
    note: Unisce *hace mucho calor y hace sol* a *no hay ni una nube*.
  es.a1.unit10.lesson06.teach.line03:
    title: Proporre di portare l'acqua
    gloss: Elena dice che serve l'acqua per la strada.
    note: '*El camino* (la strada) indica il tragitto a piedi verso il laboratorio.'
  es.a1.unit10.lesson06.teach.line04:
    title: Essere d'accordo e indicare un negozio
    gloss: Mateo è d'accordo e dice che c'è un negozio vicino.
    note: '*Cerca de aquí* (qui vicino) usa l''espressione di luogo *cerca de* (vicino a).'
  es.a1.unit10.lesson06.teach.line05:
    title: Confrontare inverno ed estate
    gloss: Elena confronta gli inverni freddi di Madrid con il caldo eccessivo di luglio.
    note: Unisce le due frasi sulle stagioni *en invierno hace mucho frío* e *en julio hace demasiado calor*.
  es.a1.unit10.lesson06.teach.line06:
    title: Esprimere una preferenza
    gloss: 'Mateo dice che preferisce il caldo: a Londra piove quasi ogni giorno.'
    note: '*Prefiero* (preferisco) è una nuova forma verbale della prima persona; *casi todos los días* (quasi ogni giorno) è un''utile espressione di frequenza.'
  es.a1.unit10.lesson06.teach.line07:
    title: Essere d'accordo e dare fretta
    gloss: Elena è d'accordo e dice che devono andare, altrimenti arrivano tardi a lezione.
    note: '*Es verdad* significa «è vero»; qui *o* (o) indica una conseguenza («altrimenti»).'
  es.a1.unit10.lesson06.teach.line08:
    title: Essere d'accordo e partire
    gloss: Mateo riconosce che lei ha ragione e vanno.
    note: '*Tienes razón* (hai ragione) è un''espressione comune per dare ragione a qualcuno.'
