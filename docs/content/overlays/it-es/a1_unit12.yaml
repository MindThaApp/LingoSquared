    title: La torta rischia di bruciarsi
teaching:
  es.a1.unit12.lesson01.teach.nervioso:
    title: Nervoso
    gloss: nervoso
    note: '*Nervioso* (maschile) / *nerviosa* (femminile): una coppia regolare di aggettivi in -o/-a.'
    example_gloss:
    - Mateo è nervoso.
    - Elena è nervosa.
  es.a1.unit12.lesson01.teach.contento:
    title: Contento
    gloss: contento / soddisfatto
    note: '*Contento/contenta* descrive il sentirsi felice o soddisfatto, non una caratteristica stabile.'
    example_gloss:
    - Mateo è contento.
    - Elena è contenta.
  es.a1.unit12.lesson01.teach.cansado:
    title: Stanco
    gloss: stanco
    note: '*Cansado/cansada*, da *cansar* (stancare).'
    example_gloss:
    - Dopo il laboratorio, sono stanco. (maschile)
    - Dopo il laboratorio, sono stanca. (femminile)
  es.a1.unit12.lesson01.teach.preocupado:
    title: Preoccupato
    gloss: preoccupato
    note: '*Preocupado/preocupada*, da *preocupar* (preoccupare).'
    example_gloss:
    - Mateo è preoccupato.
    - Elena è preoccupata.
  es.a1.unit12.lesson01.teach.orgulloso:
    title: Orgoglioso
    gloss: orgoglioso
    note: '*Orgulloso/orgullosa*: *estoy orgulloso/a de...* (sono orgoglioso/a di...) vuole *de* prima di ciò di cui si è orgogliosi.'
    example_gloss:
    - Sono orgoglioso di te. (maschile)
    - Sono orgogliosa di te. (femminile)
  es.a1.unit12.lesson02.teach.estoy_nervioso:
    title: Sono nervoso (maschile)
    gloss: Sono nervoso.
    note: '*Estoy* (io sono, da *estar*) + l''aggettivo al maschile.'
  es.a1.unit12.lesson02.teach.estoy_nerviosa:
    title: Sono nervosa (femminile)
    gloss: Sono nervoso.
    note: Stessa costruzione, con l'aggettivo al femminile.
  es.a1.unit12.lesson02.teach.estoy_contento:
    title: Sono contento (maschile)
    gloss: Sono contento.
    note: '*Estoy contento*: stessa struttura *estar* + aggettivo.'
  es.a1.unit12.lesson02.teach.estar_vs_ser_note:
    title: Estar o ser per i sentimenti
    gloss: Perché per i sentimenti si usa normalmente estar e non ser.
    note: Vedi il testo della scheda.
    target_text: '*Estar* + aggettivo descrive uno stato o un sentimento temporaneo (estoy nervioso: sono nervoso in questo momento), a differenza di *ser* + aggettivo, che indica una caratteristica stabile. Per i sentimenti si usa normalmente *estar*.'
  es.a1.unit12.lesson03.teach.como_te_sientes:
    title: Chiedere come si sente qualcuno
    gloss: Come ti senti?
    note: '*¿Cómo te sientes?* usa *sentirse* (sentirsi), un verbo riflessivo, diverso da *estar* + aggettivo.'
  es.a1.unit12.lesson03.teach.me_siento_nervioso_pero_contento:
    title: Descrivere un sentimento misto
    gloss: Mi sento un po' nervoso, ma contento.
    note: '*Me siento* (mi sento) + aggettivo, con *pero* (ma) che contrappone due sentimenti: è la risposta naturale a *¿Cómo te sientes?*.'
  es.a1.unit12.lesson04.teach.algo_se_quema:
    title: Qualcosa si sta bruciando
    gloss: Qualcosa si sta bruciando!
    note: '*Se quema* è la forma riflessiva di *quemar* (bruciare): letteralmente "si brucia", il modo naturale di dire che qualcosa brucia senza indicare chi lo fa.'
  es.a1.unit12.lesson04.teach.estoy_preocupado:
    title: Sono preoccupato (maschile)
    gloss: Sono preoccupato.
    note: '*Preocupado* nella struttura *estoy* + aggettivo.'
  es.a1.unit12.lesson04.teach.no_te_preocupes:
    title: Non ti preoccupare
    gloss: Non ti preoccupare.
    note: Vedi la scheda di grammatica successiva.
  es.a1.unit12.lesson04.teach.podemos_empezar_de_nuevo:
    title: Proporre di ricominciare
    gloss: Possiamo ricominciare.
    note: '*Podemos* (possiamo) + infinito; *de nuevo* (di nuovo) è un''espressione comune per rifare qualcosa.'
  es.a1.unit12.lesson04.teach.no_te_preocupes_note:
    title: No te preocupes
    gloss: La struttura dell'imperativo negativo di "non ti preoccupare".
    note: Vedi il testo della scheda.
    target_text: '*No te preocupes* (non ti preoccupare) è un imperativo negativo informale, formato da *no* + pronome riflessivo (*te*) + verbo.'
  es.a1.unit12.lesson05.teach.reflexion_reading:
    title: Una riflessione sulla lezione
    gloss: Prima della lezione, Elena e Mateo erano un po' nervosi. Durante la lezione qualcosa si è bruciato ed erano entrambi preoccupati. Ma hanno ricominciato e alla fine la torta è venuta perfetta. Ora sono tutti e due molto orgogliosi e contenti.
    note: '*Estaban* (erano) descrive come si sentivano allora; *están* (sono) descrive come si sentono adesso.'
    glosses:
      Antes: prima
      clase: lezione
      estaban: erano (da estar)
      poco: un po'
      nerviosos: nervoso
      Durante: durante
      algo: qualcosa
      quemó: bruciato/a (da quemarse)
      dos: entrambi / due
      preocupados: preoccupato
      Pero: ma
      empezaron: iniziato (da empezar)
      nuevo: di nuovo / da capo
      final: fine
      pastel: torta
      salió: è venuto / è uscito (da salir)
      perfecto: perfetto
      Ahora: adesso
      están: sono (da estar)
      orgullosos: orgoglioso
      contentos: contento
  es.a1.unit12.lesson05.teach.plural_adjective_note:
    title: La concordanza dell'aggettivo al plurale
    gloss: Perché un gruppo misto vuole l'aggettivo al maschile plurale.
    note: Vedi il testo della scheda.
    target_text: 'Quando si parla di Elena e Mateo insieme, gli aggettivi vanno al maschile plurale (nerviosos, preocupados, orgullosos, contentos): è la regola normale dello spagnolo, come in italiano, quando il gruppo comprende almeno un maschile.'
  es.a1.unit12.lesson06.teach.line01:
    title: Chiedi a Mateo come si sente
    gloss: Elena chiede a Mateo come si sente prima della lezione.
    note: '*¿Cómo te sientes?* serve a chiedere come si sente una persona.'
  es.a1.unit12.lesson06.teach.line02:
    title: Rispondi con un sentimento misto
    gloss: Mateo dice che si sente un po' nervoso, ma contento.
    note: Mateo usa le forme maschili *nervioso* e *contento*.
  es.a1.unit12.lesson06.teach.line03:
    title: Reagisci all'incidente
    gloss: Elena è d'accordo, poi si accorge che qualcosa sta bruciando.
    note: '*¡Ay, no!* (oh no!) è un''esclamazione comune per esprimere allarme.'
  es.a1.unit12.lesson06.teach.line04:
    title: Esprimi preoccupazione
    gloss: Mateo dice di essere preoccupato e chiede cosa fare.
    note: '*¿Qué hacemos?* (cosa facciamo?) è una domanda pratica.'
  es.a1.unit12.lesson06.teach.line05:
    title: Rassicura e proponi una soluzione
    gloss: 'Elena gli dice di non preoccuparsi: possono ricominciare.'
    note: Unisce *no te preocupes* e *podemos empezar de nuevo*.
  es.a1.unit12.lesson06.teach.line06:
    title: Accetta e riprova
    gloss: Mateo è d'accordo e propone di riprovare.
    note: '*Vamos a intentarlo otra vez* (proviamoci di nuovo) riprende la costruzione *vamos a* + infinito delle unità precedenti, ora con il pronome complemento *lo*.'
  es.a1.unit12.lesson06.teach.line07:
    title: Annuncia il successo
    gloss: Elena annuncia che adesso la torta è perfetta.
    note: '*¡Mira!* (guarda!) è un''interiezione per attirare l''attenzione; *el pastel* (la torta) è il dolce al centro dell''incidente.'
  es.a1.unit12.lesson06.teach.line08:
    title: Festeggia ed esprimi orgoglio
    gloss: Mateo esulta e dice di essere orgoglioso di entrambi.
    note: '*¡Qué bien!* (che bello!) usa la struttura esclamativa *¡Qué...!*, come in *¡Qué calor!*; *de nosotros* (di noi) estende *estoy orgulloso de ti* a un gruppo.'
  es.a1.unit12.lesson06.teach.line09:
    title: Condividi l'orgoglio
    gloss: 'Elena è d''accordo, è orgogliosa anche lei: ce l''hanno fatta insieme.'
    note: '*Lo logramos juntos* (ce l''abbiamo fatta insieme) è una naturale frase di chiusura e introduce per la prima volta *lograr* (riuscire a ottenere).'
