answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spagnolo A1
  description: Spagnolo base per proporre, accettare, rifiutare, fissare, leggere e scrivere semplici programmi.
units:
  es.a1.unit50.plans:
    title: Fare programmi semplici
lessons:
  es.a1.unit50.lesson01.proponer_una_actividad:
    title: Proporre un'attività
  es.a1.unit50.lesson02.aceptar_o_rechazar_un:
    title: Accettare o rifiutare un programma
  es.a1.unit50.lesson03.quedar_un_dia_y:
    title: Mettersi d'accordo su giorno e ora
  es.a1.unit50.lesson04.leer_una_invitacion:
    title: Leggere un invito
  es.a1.unit50.lesson05.escribir_y_confirmar_un:
    title: Scrivere e confermare un programma
  es.a1.unit50.lesson06.elena_y_mateo_hacen:
    title: Elena e Mateo fanno un programma
teaching:
  es.a1.unit50.lesson01.teach.juntos:
    title: Insieme
    gloss: insieme
    note: '*Juntos* chiarisce che le persone fanno l''attività insieme; concorda con le persone (*juntas* se sono tutte donne).'
    example_gloss: Prendiamo un caffè insieme?
  es.a1.unit50.lesson01.teach.tomar_un_cafe:
    title: Prendere un caffè
    gloss: prendere un caffè
    note: Come in italiano si «prende» un caffè, in spagnolo si dice *tomar un café*, letteralmente «prendere un caffè».
  es.a1.unit50.lesson01.teach.ir_al_cine:
    title: Andare al cinema
    gloss: andare al cinema
    note: '*Ir al cine* è il modo abituale per dire che si va a vedere un film; *al* è *a* + *el*.'
  es.a1.unit50.lesson01.teach.tomamos_un_cafe:
    title: Prendiamo un caffè?
    gloss: Prendiamo un caffè?
    note: '*¿Tomamos ...?* usa il presente di *nosotros* per proporre qualcosa insieme.'
  es.a1.unit50.lesson01.teach.tomamos_algo_es:
    title: Usare ¿Tomamos ...?
    gloss: ¿Tomamos + qualcosa? è il modo abituale per proporre di fare qualcosa insieme.
    note: 'Come in italiano, la forma *nosotros* (*tomamos*) serve a proporre qualcosa insieme: *¿Tomamos un café?* ("Prendiamo un caffè?")'
  es.a1.unit50.lesson01.teach.tienes_ganas_de:
    title: Hai voglia di andare al cinema?
    gloss: Hai voglia di andare al cinema?
    note: '*¿Tienes ganas de ...?* chiede in modo informale se qualcuno ha voglia di fare qualcosa; dopo *de* segue un infinito.'
  es.a1.unit50.lesson02.teach.si_que_bien:
    title: Sì, che bello!
    gloss: Sì, che bello!
    note: '*¡Sí, qué bien!* è un''accettazione breve ed entusiasta.'
  es.a1.unit50.lesson02.teach.buena_idea:
    title: Buona idea
    gloss: Buona idea!
    note: '*¡Buena idea!* accetta la proposta elogiandola.'
  es.a1.unit50.lesson02.teach.es_un_buen:
    title: È un bel programma
    gloss: È un bel programma.
    note: È una risposta positiva un po' più completa.
  es.a1.unit50.lesson02.teach.lo_siento_no:
    title: Rifiutare con un motivo
    gloss: Mi dispiace, non posso, perché lavoro.
    note: '*Lo siento* attenua il rifiuto, e *porque* introduce il breve motivo.'
  es.a1.unit50.lesson02.teach.no_tengo_tiempo:
    title: Non ho tempo
    gloss: Non ho tempo.
    note: '*No tengo tiempo* è un motivo diretto ma normale per rifiutare; *no* va prima del verbo.'
  es.a1.unit50.lesson02.teach.lo_siento_no_2:
    title: Un rifiuto gentile
    gloss: Lo siento + no puedo + un breve motivo rende gentile un rifiuto.
    note: In conversazione il motivo è facoltativo, ma rende la risposta più utile e cortese.
  es.a1.unit50.lesson03.teach.quedar:
    title: Darsi appuntamento
    gloss: darsi appuntamento
    note: '*Quedar* significa darsi appuntamento: *¿Quedamos el viernes?* Molti ispanoamericani dicono invece *¿Nos vemos el viernes?*'
    example_gloss: Ci vediamo venerdì alle 2:30?
  es.a1.unit50.lesson03.teach.quedamos_el_viernes:
    title: Appuntamento venerdì alle due e mezza
    gloss: Ci vediamo venerdì alle 2:30?
    note: Unisce il giorno della settimana *el viernes* con *a las* più l'ora.
  es.a1.unit50.lesson03.teach.las_dos_y:
    title: Y media significa e mezza
    gloss: las dos y media = 2:30; a las dos y media indica l'ora dell'appuntamento.
    note: 'Come in italiano, si parte dall''ora appena passata: *las dos y media* è 2:30, letteralmente "le due e mezza".'
  es.a1.unit50.lesson03.teach.el_viernes_17:
    title: Una data e un'ora
    gloss: venerdì 17 aprile alle 3:15
    note: 'Come in italiano, giorni della settimana e mesi si scrivono in minuscolo, e nelle date si usa *de*: *el viernes 17 de abril*.'
  es.a1.unit50.lesson03.teach.si_el_viernes:
    title: Confermare l'orario
    gloss: Sì, venerdì alle 2:30 va bene.
    note: '*Me viene bien* ("mi va bene") conferma che l''orario proposto va bene.'
  es.a1.unit50.lesson04.teach.el_mensaje_la:
    title: Messaggio, invito, caffè delle lingue
    gloss: il messaggio, l'invito, il caffè delle lingue
    note: '*Un mensaje* è un breve messaggio scritto o digitale, *una invitación* chiede a qualcuno di unirsi a un''attività, e *el café de idiomas* è il luogo d''incontro del gruppo.'
    example_gloss:
    - Ho un messaggio di Elena.
    - Questo è un invito al caffè delle lingue.
    - Prendiamo un caffè al caffè delle lingue.
  es.a1.unit50.lesson04.teach.hola_mateo_tienes:
    title: L'invito di Elena
    gloss: Ciao Mateo, hai voglia di prendere un caffè al caffè delle lingue sabato 18 aprile alle 2:30? Un saluto, Elena.
    note: 'Leggi cercando quattro dettagli: attività, data, ora e luogo.'
    glosses:
      Hola: ciao
      ganas: voglia (tener ganas de = avere voglia di)
      sábado: sabato
      abril: aprile
      media: e mezza (y media = e mezza)
      dos: due
      café: caffè
      tomar: bere / prendere
      idiomas: caffè delle lingue
      saludo: un saluto
  es.a1.unit50.lesson05.teach.hola_mateo_vamos:
    title: Un messaggio di proposta
    gloss: Ciao Mateo, prendiamo un caffè venerdì alle 2:30? Un saluto, Elena.
    note: Il messaggio contiene un saluto, un'attività, un giorno, un orario e una chiusura.
    glosses:
      Hola: ciao
      vamos: '(proposta: «prendiamo?»)'
      viernes: venerdì
      media: e mezza (y media = e mezza)
      dos: due
      café: caffè
      tomar: bere / prendere
      saludo: un saluto
  es.a1.unit50.lesson05.teach.hola_elena_si:
    title: Un messaggio di conferma
    gloss: Ciao Elena, sì, che bello! Venerdì alle 2:30 per me va bene. A venerdì! Mateo.
    note: La risposta accetta l'attività e ripete l'orario per confermarlo.
    glosses:
      Hola: ciao
      bien: che bello / che bella idea
      viernes: venerdì
      media: e mezza (y media = e mezza)
      dos: due
      viene: va bene / è comodo
      Hasta: fino a / a presto
  es.a1.unit50.lesson05.teach.un_mensaje_corto:
    title: Cosa contiene un messaggio
    gloss: Un messaggio breve indica l'attività, il giorno o la data e l'ora.
    note: Il saluto e la chiusura sono utili, ma i dettagli importanti sono l'attività e il momento in cui si svolge.
  es.a1.unit50.lesson06.teach.elena_tomamos_un:
    title: Elena propone un caffè
    gloss: 'Elena: Prendiamo un caffè venerdì? Mateo: Sì, che bello! A che ora?'
    note: Mateo accetta l'attività prima di chiedere l'orario.
  es.a1.unit50.lesson06.teach.elena_a_las:
    title: Il primo orario di Elena
    gloss: 'Elena: Alle 2:30.'
    note: '*Las dos y media* significa le 2:30, come nella lezione sull''ora.'
  es.a1.unit50.lesson06.teach.mateo_lo_siento:
    title: Mateo propone un altro orario
    gloss: 'Mateo: Mi dispiace, alle 2:30 non posso. Può andare alle 3:15?'
    note: '*¿Puede ser a ...?* è un modo breve per chiedere se un altro orario va bene.'
  es.a1.unit50.lesson06.teach.elena_si_a:
    title: Confermano il programma finale
    gloss: 'Elena: Sì, le 3:15 vanno bene. Mateo: Buon piano. Allora ci vediamo venerdì alle 3:15.'
    note: Qui *quedamos* è di nuovo la forma di *nosotros*, ora usata per confermare il programma.
