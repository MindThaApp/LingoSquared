teaching:
  es.a1.unit45.lesson01.teach.cuanto_cuesta_en:
    title: Chiedere il prezzo totale
    gloss: Quanto costa in totale?
    note: '*En total* chiarisce che vuoi sapere il prezzo complessivo, non quello di un solo articolo.'
  es.a1.unit45.lesson01.teach.cuesta_veinticinco_euros:
    title: Dire il prezzo totale
    gloss: Costa venticinque euro in totale.
    note: '*Cuesta* è la terza persona singolare di *costar*; la vocale della radice passa da *o* a *ue* quando è accentata.'
  es.a1.unit45.lesson02.teach.pagar_con_tarjeta:
    title: Pagare con la carta o in contanti
    gloss: pagare con la carta, pagare in contanti
    note: '*Pagar con tarjeta* e *pagar en efectivo* usano preposizioni diverse: *con* per lo strumento, *en* per la forma del denaro.'
    example_gloss:
    - Posso pagare con la carta qui?
    - Pago in contanti.
  es.a1.unit45.lesson02.teach.puedo_pagar_con:
    title: Chiedere se si può pagare con la carta
    gloss: Posso pagare con la carta qui?
    note: '*Puedo* è la forma di *yo* di *poder*; *aquí* indica che la domanda riguarda il luogo in cui ti trovi.'
  es.a1.unit45.lesson02.teach.quiere_pagar_en:
    title: Chiedere come si preferisce pagare
    gloss: Preferisce pagare in contanti o con la carta?
    note: '*Quiere* è la forma di cortesia (*usted*) di *querer*, usata qui da un cassiere sconosciuto; con un amico diresti *¿quieres pagar...?*'
  es.a1.unit45.lesson03.teach.la_cuenta:
    title: Il conto
    gloss: il conto
    note: 'Sostantivo femminile: *la cuenta*. Al ristorante è il conto; in banca è il conto corrente.'
    example_gloss: Dividiamo il conto?
  es.a1.unit45.lesson03.teach.dividimos_la_cuenta:
    title: Proporre di dividere il conto
    gloss: Dividiamo il conto?
    note: '*¿Dividimos...?* usa la forma di *nosotros* per fare una proposta, come in italiano «dividiamo...?».'
  es.a1.unit45.lesson03.teach.puedo_pagar_por:
    title: Chiedere di pagare separatamente
    gloss: Posso pagare separatamente?
    note: '*Por separado* indica il modo in cui si paga; *pagar* è il verbo di uso quotidiano per farlo.'
  es.a1.unit45.lesson04.teach.el_cambio:
    title: Il resto
    gloss: il resto
    note: 'Sostantivo maschile: *el cambio*. Significa anche cambiamento in generale, come in *un cambio de planes*.'
    example_gloss: Ecco il suo resto.
  es.a1.unit45.lesson04.teach.aqui_tiene_su:
    title: Dare il resto
    gloss: Ecco il suo resto.
    note: '*Su* è il possessivo che corrisponde a *usted* (forma di cortesia); *Aquí tiene* è il modo cortese abituale per consegnare qualcosa.'
  es.a1.unit45.lesson04.teach.no_necesito_cambio:
    title: Rifiutare il resto
    gloss: Non mi serve il resto.
    note: '*Necesitar* regge direttamente il complemento oggetto, senza preposizione: *necesito cambio*; *no* nega il verbo.'
  es.a1.unit45.lesson05.teach.treinta_y_cinco:
    title: Trentacinque
    gloss: trentacinque
    note: '*Treinta y cinco*: dal 31 al 99 lo spagnolo unisce decine e unità con *y*, scritta come parola separata (in italiano invece si scrive tutto attaccato: trentacinque).'
    example_gloss: Costa trentacinque euro.
  es.a1.unit45.lesson05.teach.cuenta_dos_platos:
    title: Leggere un conto del ristorante
    gloss: 'Conto: due piatti principali e due caffè. Totale: trentacinque euro. Pagato con carta.'
    note: Individua che cosa è stato ordinato, il totale e come è stato pagato.
    glosses:
      Cuenta: conto
      dos: due
      platos: piatti principali
      cafés: caffè
      Total: totale
      treinta: trentacinque
      euros: euro
      Pagado: pagato
      tarjeta: carta
  es.a1.unit45.lesson06.teach.elena_pedimos_la:
    title: Elena chiede il conto
    gloss: 'Elena: Chiediamo il conto?'
    note: '*Pedir* (chiedere, ordinare) ha *la cuenta* come complemento oggetto diretto: *pedimos la cuenta* (chiediamo il conto).'
  es.a1.unit45.lesson06.teach.mateo_si_buena:
    title: Mateo chiede il totale
    gloss: 'Mateo: Sì, buona idea. Quanto costa in totale?'
    note: Riprende la domanda *¿cuánto cuesta en total?* della lezione 1.
  es.a1.unit45.lesson06.teach.elena_son_treinta:
    title: Elena dice il totale
    gloss: 'Elena: Sono trentacinque euro. Dividiamo?'
    note: 'Con le somme di denaro si usa *son*: *son treinta y cinco euros* vuole il verbo al plurale perché la quantità è plurale.'
  es.a1.unit45.lesson06.teach.mateo_no_deja:
    title: Mateo insiste per pagare
    gloss: 'Mateo: No, oggi lascia pagare me. Mi hai aiutato tanto.'
    note: '*Deja que pague yo* (lascia che paghi io) usa il congiuntivo *pague* dopo *que*; per ora impàralo come offerta fissa. *Me has ayudado* è il passato prossimo (mi hai aiutato).'
  es.a1.unit45.lesson06.teach.elena_que_amable:
    title: Elena è commossa
    gloss: 'Elena: Che gentile che sei! Grazie mille.'
    note: '*¡Qué amable eres!* (che gentile che sei!) usa *qué* + aggettivo per reagire con calore a un gesto generoso; *muchas gracias* è un *grazie* più intenso.'
  es.a1.unit45.lesson06.teach.mateo_puedo_pagar:
    title: Mateo chiede se può pagare con la carta
    gloss: 'Mateo: Posso pagare con la carta qui?'
    note: Riprende la domanda *¿puedo pagar con tarjeta aquí?* della lezione 2, ora nel ristorante vero e proprio.
  es.a1.unit45.lesson06.teach.mateo_paga_la:
    title: 'Paga: la forma di lui/lei'
    gloss: Mateo paga il conto.
    note: '*Paga* è la terza persona singolare di *pagar*: *Mateo paga la cuenta*.'
