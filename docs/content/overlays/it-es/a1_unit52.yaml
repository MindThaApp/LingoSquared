answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spagnolo A1
  description: 'Spagnolo per principianti per descrivere l''aspetto fisico di una persona: altezza ed età approssimativa, colore di capelli e occhi, la domanda chiave ¿Cómo es ...? e il confronto tra l''aspetto di due persone.'
units:
  es.a1.unit52.appearance:
    title: Descrivere l'aspetto
lessons:
  es.a1.unit52.lesson01.alto_bajo_mayor_y:
    title: Alto, basso, anziano e giovane
  es.a1.unit52.lesson02.describir_el_pelo:
    title: Descrivere i capelli
  es.a1.unit52.lesson03.los_ojos_y_como:
    title: Gli occhi e «Com'è?»
  es.a1.unit52.lesson04.elena_describe_a_nina:
    title: Elena descrive Nina
  es.a1.unit52.lesson05.comparar_a_diego_y:
    title: Confrontare Diego e Lucía
  es.a1.unit52.lesson06.mateo_reconoce_a_nina:
    title: Mateo riconosce Nina
teaching:
  es.a1.unit52.lesson01.teach.alto_bajo:
    title: Alto e basso
    gloss: alto / basso
    note: '*Alto* descrive una persona alta e *bajo* una persona bassa; entrambi concordano con la persona: *alta*, *baja*.'
    example_gloss:
    - Lucía è alta.
    - Diego è basso.
  es.a1.unit52.lesson01.teach.mayor_joven:
    title: Anziano e giovane
    gloss: anziano / giovane
    note: '*Mayor* e *joven* danno un''impressione generale dell''età, non un numero preciso di anni.'
    example_gloss:
    - Il nonno è anziano.
    - Mateo è giovane.
  es.a1.unit52.lesson01.teach.para_dar_la:
    title: 'Mayor: un''impressione, non un numero'
    gloss: Per l'età esatta si usa tener años, come in ¿Cuántos años tienes?; mayor dà un'impressione generale senza un numero, come in El abuelo es mayor.
    note: 'Per l''età esatta si usa *tener años*: *¿Cuántos años tienes?* *Mayor* dà solo un''impressione generale, senza numero.'
  es.a1.unit52.lesson01.teach.lucia_es_alta:
    title: Lucía è alta e Diego è basso
    gloss: Lucía è alta e Diego è basso.
    note: Una semplice frase unita con *y* («e»), che prepara il confronto diretto di una lezione successiva.
  es.a1.unit52.lesson02.teach.el_pelo:
    title: I capelli
    gloss: i capelli
    note: '*El pelo* è maschile e resta al singolare quando si parla dei capelli di una persona in generale.'
    example_gloss: Mateo ha i capelli corti e neri.
  es.a1.unit52.lesson02.teach.rubio_castano_gris:
    title: Biondo, castano e grigio
    gloss: biondo / castano / grigio
    note: 'Tre colori di capelli: *rubio* (biondo), *castaño* (castano) e *gris* (grigio). *Rubio* concorda con il nome: *pelo rubio*, *melena rubia*.'
    example_gloss:
    - Elena ha i capelli biondi.
    - Diego ha i capelli castani.
    - Il nonno ha i capelli grigi.
  es.a1.unit52.lesson02.teach.largo_corto:
    title: Lunghi e corti (capelli)
    gloss: lungo / corto (capelli)
    note: '*Largo* (lungo) già visto nella lezione sull''altezza, ora si usa per la lunghezza dei capelli; *corto* è nuovo: *el pelo largo*, *el pelo corto*.'
    example_gloss:
    - Lucía ha i capelli lunghi.
    - Diego ha i capelli corti.
  es.a1.unit52.lesson02.teach.el_adjetivo_va:
    title: L'aggettivo segue il nome
    gloss: 'L''aggettivo va dopo il nome: el pelo corto, el pelo largo, el pelo rubio, el pelo castaño, el pelo gris, el pelo negro.'
    note: 'In spagnolo l''aggettivo si mette dopo il sostantivo e concorda con esso: *el pelo corto*, *el pelo rubio*.'
  es.a1.unit52.lesson02.teach.pelo_y_cabello:
    title: Pelo e cabello
    gloss: 'Pelo e cabello significano la stessa cosa. In questo corso usiamo pelo: el pelo largo.'
    note: '*Pelo* e *cabello* significano entrambi «capelli» nello spagnolo di tutti i giorni; in questo corso si usa *pelo*.'
  es.a1.unit52.lesson02.teach.mateo_tiene_el:
    title: Mateo ha i capelli corti e neri
    gloss: Mateo ha i capelli corti e neri.
    note: Riprende *negro* (nero) dall'unità sui vestiti.
  es.a1.unit52.lesson02.teach.elena_tiene_el:
    title: Elena ha i capelli lunghi e biondi
    gloss: Elena ha i capelli lunghi e biondi.
    note: Unisce in un'unica frase naturale il lessico di lunghezza e colore di questa lezione.
  es.a1.unit52.lesson03.teach.los_ojos:
    title: Gli occhi
    gloss: gli occhi
    note: '*Los ojos* è il plurale di *el ojo*; entrambi sono maschili.'
    example_gloss: Mateo ha gli occhi marroni.
  es.a1.unit52.lesson03.teach.azul_marron_verde:
    title: Azzurro, marrone e verde
    gloss: azzurro / marrone / verde
    note: '*Azul* (azzurro, blu) e *verde* hanno un''unica forma per maschile e femminile; *marrón* (marrone) è la parola usuale per il colore degli occhi, mentre per i capelli si dice *castaño*.'
    example_gloss:
    - Elena ha gli occhi azzurri.
    - Diego ha gli occhi marroni.
    - Lucía ha gli occhi verdi.
  es.a1.unit52.lesson03.teach.con_ojos_plural:
    title: Ojos vuole l'aggettivo al plurale
    gloss: 'Con ojos (plurale), anche l''aggettivo va al plurale: ojos azules, ojos marrones, ojos verdes.'
    note: 'Gli aggettivi concordano in numero: *ojos* è plurale, quindi *azules*, *marrones*, *verdes*.'
  es.a1.unit52.lesson03.teach.como_es_elena:
    title: Com'è Elena?
    gloss: Com'è Elena?
    note: '*¿Cómo es ...?* è la domanda chiave di questa unità: usala per chiedere dell''aspetto di chiunque.'
  es.a1.unit52.lesson03.teach.elena_tiene_el:
    title: Elena ha i capelli lunghi e biondi e gli occhi azzurri
    gloss: Elena ha i capelli lunghi e biondi e gli occhi azzurri.
    note: Una risposta modello che unisce capelli e occhi in una sola frase con *y*.
  es.a1.unit52.lesson04.teach.elena_viene_una:
    title: Elena presenta Nina
    gloss: 'Elena: Al caffè delle lingue viene una ragazza nuova. Si chiama Nina.'
    note: '*Viene* («viene») introduce una persona nuova; *se llama* significa «si chiama».'
  es.a1.unit52.lesson04.teach.mateo_genial_como:
    title: Mateo chiede com'è
    gloss: 'Mateo: Bene! Com''è?'
    note: 'Riprende la domanda chiave dell''unità senza il nome: *¿Cómo es?*'
  es.a1.unit52.lesson04.teach.elena_es_baja:
    title: Elena descrive altezza e capelli di Nina
    gloss: 'Elena: È bassa e ha i capelli corti e biondi.'
    note: Unisce *baja* della prima lezione al lessico dei capelli; *baja* è femminile perché Nina è una ragazza.
  es.a1.unit52.lesson04.teach.mateo_y_los:
    title: Mateo chiede degli occhi
    gloss: 'Mateo: E gli occhi?'
    note: '*¿Y los ojos?* riprende l''argomento con l''articolo determinativo, come in italiano («gli occhi»): lo spagnolo non usa qui un possessivo come *sus*.'
  es.a1.unit52.lesson04.teach.elena_tiene_los:
    title: Elena descrive gli occhi di Nina
    gloss: 'Elena: Ha gli occhi verdi.'
    note: Riprende *los ojos verdes* dalla lezione sugli occhi.
  es.a1.unit52.lesson04.teach.mateo_gracias_entonces:
    title: Mateo la riconoscerà
    gloss: 'Mateo: Grazie! Allora la riconoscerò.'
    note: '*La reconoceré* («la riconoscerò») è una forma di futuro; *la* significa «la» e va prima del verbo.'
  es.a1.unit52.lesson05.teach.diego_es_el:
    title: Confrontare Diego e Lucía
    gloss: Diego e Lucía sono fratello e sorella, ma sono diversi. Diego è basso e ha i capelli corti e castani e gli occhi marroni. Lucía è più alta di Diego e ha i capelli lunghi e castani e gli occhi verdi. E tu, come sei?
    note: Un breve confronto che riprende tutte le parole di colore e lunghezza viste finora e termina con la domanda chiave dell'unità rivolta a chi legge.
    glosses:
      hermano: fratello
      hermana: sorella
      eres: essere (di aspetto)
      diferentes: diverso
      bajo: basso
      corto: basso
      castaño: castano
      pelo: i capelli
      marrones: castano
      ojos: gli occhi
      alta: più alto
      largo: lungo
      verdes: verde
      cómo: (com'è, che aspetto ha)
  es.a1.unit52.lesson05.teach.ya_conoces_el:
    title: Riusare la struttura del comparativo
    gloss: 'Conosci già la struttura del comparativo: más + aggettivo + que. Qui la usi per le persone: Lucía è più alta di Diego.'
    note: La struttura *más + adjective + que* dell'unità sui comparativi, ora applicata alle persone invece che agli oggetti.
  es.a1.unit52.lesson05.teach.lucia_tiene_el:
    title: Lucía ha i capelli più lunghi di Diego
    gloss: Lucía ha i capelli più lunghi di Diego.
    note: '*Más largo que* mette a confronto due cose: *el pelo más largo que Diego*; *largo* resta maschile perché *pelo* è maschile.'
  es.a1.unit52.lesson05.teach.tengo_el_pelo:
    title: Ho i capelli corti e castani
    gloss: Ho i capelli corti e castani.
    note: Una frase modello alla prima persona con *tengo*, da riusare quando descrivi te stesso.
  es.a1.unit52.lesson06.teach.mateo_mira_es:
    title: Mateo nota Nina
    gloss: 'Mateo: Guarda, è quella Nina? Ha i capelli corti e biondi e gli occhi verdi.'
    note: '*Mira* («guarda») è l''imperativo informale di *mirar*, usato qui per indicare qualcosa.'
  es.a1.unit52.lesson06.teach.elena_si_esa:
    title: Elena conferma
    gloss: 'Elena: Sì, quella è Nina!'
    note: Una conferma breve e naturale.
  es.a1.unit52.lesson06.teach.nina_hola_eres:
    title: Nina saluta Mateo
    gloss: 'Nina: Ciao, sei Mateo?'
    note: 'Una semplice domanda informale per salutare: *¿Eres ...?*'
  es.a1.unit52.lesson06.teach.mateo_si_encantado:
    title: Mateo risponde al saluto di Nina
    gloss: 'Mateo: Sì! Piacere di conoscerti, Nina.'
    note: '*Encantado de conocerte* è la formula abituale per una prima presentazione; una donna dice *Encantada*.'
  es.a1.unit52.lesson06.teach.nina_encantada_de:
    title: Nina ricambia il saluto
    gloss: 'Nina: Piacere di conoscerti anch''io!'
    note: 'Chiude il dialogo: Mateo ha riconosciuto Nina grazie alla descrizione di Elena.'
