answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spagnolo A1
  description: Il lessico della famiglia stretta e allargata, gli aggettivi possessivi e la descrizione di una casa, con la storia del laboratorio di cucina di Elena e Mateo che continua dalle unità 01-02. Particolare attenzione ai possessivi (mi/tu/su), che non variano in base al genere del possessore, e ai nomi di parentela marcati per genere.
units:
  es.a1.unit03.family:
    title: Le famiglie di Elena e Mateo
lessons:
  es.a1.unit03.lesson01.immediate_family:
    title: La famiglia stretta
  es.a1.unit03.lesson02.possessives_and_asking:
    title: 'I possessivi: mi, tu, su'
  es.a1.unit03.lesson03.extended_family:
    title: La famiglia allargata
  es.a1.unit03.lesson04.describing_family_size:
    title: Quanti siamo a casa
  es.a1.unit03.lesson05.reading_a_family_profile:
    title: Leggere il profilo di una famiglia
  es.a1.unit03.lesson06.family_photos_dialogue:
    title: Foto di famiglia con Elena e Mateo
teaching:
  es.a1.unit03.lesson01.teach.madre:
    title: Madre
    gloss: madre
    note: '*Madre* è femminile. *Mamá* è la parola più comune in famiglia, mentre *madre* è neutra e si usa negli elenchi di vocabolario di questo corso.'
  es.a1.unit03.lesson01.teach.padre:
    title: Padre
    gloss: padre
    note: '*Padre* è maschile. *Papá* è l''equivalente di uso quotidiano, in parallelo a *madre*/*mamá*.'
  es.a1.unit03.lesson01.teach.hermano:
    title: Fratello
    gloss: fratello
    note: '*Hermano* è maschile singolare.'
  es.a1.unit03.lesson01.teach.hermana:
    title: Sorella
    gloss: sorella
    note: '*Hermana* è femminile singolare.'
  es.a1.unit03.lesson01.teach.hijo:
    title: Figlio
    gloss: figlio
    note: '*Hijo* è maschile singolare.'
  es.a1.unit03.lesson01.teach.hija:
    title: Figlia
    gloss: figlia
    note: '*Hija* è femminile singolare.'
  es.a1.unit03.lesson01.teach.padres:
    title: Genitori
    gloss: genitori
    note: '*Padres* (maschile plurale) indica anche la coppia madre e padre insieme: in spagnolo, come in italiano, il maschile plurale vale per un gruppo che comprende almeno un uomo.'
  es.a1.unit03.lesson01.teach.hermanos:
    title: Fratelli e sorelle
    gloss: fratelli e sorelle; fratelli
    note: '*Hermanos* può significare «fratelli» (tutti maschi) o «fratelli e sorelle» (gruppo misto), con la stessa regola del maschile plurale per i gruppi misti vista in *padres*.'
  es.a1.unit03.lesson02.teach.mi_familia:
    title: La mia famiglia
    gloss: la mia famiglia
    note: '*Mi* (senza accento) è l''aggettivo possessivo «mio/mia»; non cambia col genere, ma solo col numero (*mis* per i nomi plurali).'
  es.a1.unit03.lesson02.teach.tu_familia:
    title: La tua famiglia (tu)
    gloss: la tua famiglia
    note: '*Tu* (senza accento, a differenza del pronome *tú*) è il possessivo informale, coerente con il registro del *tú* dell''Unità 1.'
  es.a1.unit03.lesson02.teach.su_familia:
    title: La sua famiglia (di lui, di lei o Lei)
    gloss: la sua famiglia
    note: '*Su* significa «suo» (di lui), «suo» (di lei) E anche il «Suo» di cortesia (*usted*): in italiano come in spagnolo il possessivo da solo non li distingue; li chiarisce il contesto.'
  es.a1.unit03.lesson02.teach.tienes_hermanos:
    title: Chiedere dei fratelli
    gloss: Hai fratelli o sorelle?
    note: '*Tienes* è la forma di *tener* per il *tú*, lo stesso verbo usato per l''età nell''Unità 2.'
  es.a1.unit03.lesson02.teach.tengo_dos_hermanas:
    title: Dire quanti fratelli si hanno
    gloss: Ho due sorelle.
    note: '*Tengo* (ho) seguito da un numero e dal nome di parentela è il modo normale per parlare dei fratelli.'
  es.a1.unit03.lesson02.teach.tu_familia_es_grande:
    title: Chiedere se una famiglia è numerosa
    gloss: La tua famiglia è grande?
    note: '*Grande* non cambia al femminile, ma solo al plurale (*grandes*).'
  es.a1.unit03.lesson02.teach.mi_familia_es_pequena:
    title: Descrivere una famiglia piccola
    gloss: La mia famiglia è piccola.
    note: '*Pequeña* concorda con il nome femminile *familia*; la forma maschile *pequeño* compare invece con un nome maschile.'
  es.a1.unit03.lesson03.teach.abuelo:
    title: Nonno
    gloss: nonno
    note: '*Abuelo* è maschile singolare.'
  es.a1.unit03.lesson03.teach.abuela:
    title: Nonna
    gloss: nonna
    note: '*Abuela* è femminile singolare.'
  es.a1.unit03.lesson03.teach.abuelos:
    title: I nonni
    gloss: i nonni
    note: '*Abuelos* (maschile plurale) indica una coppia mista, come *padres* e *hermanos*.'
  es.a1.unit03.lesson03.teach.tio:
    title: Zio
    gloss: zio
    note: '*Tío* ha l''accento scritto perché l''accento tonico cade sulla *í*, che spezza quello che altrimenti sarebbe un dittongo.'
  es.a1.unit03.lesson03.teach.tia:
    title: Zia
    gloss: zia
    note: '*Tía* ha lo stesso accento di *tío*, per lo stesso motivo.'
  es.a1.unit03.lesson03.teach.primo:
    title: Cugino
    gloss: cugino
    note: '*Primo* è maschile singolare; come in italiano (cugino/cugina), lo spagnolo distingue il genere del cugino.'
  es.a1.unit03.lesson03.teach.prima:
    title: Cugina
    gloss: cugina
    note: '*Prima* è femminile singolare.'
  es.a1.unit03.lesson03.teach.mis_abuelos:
    title: I miei nonni
    gloss: i miei nonni
    note: '*Mis* è il plurale di *mi* e serve ogni volta che il nome a cui si riferisce è plurale, sia maschile sia femminile.'
  es.a1.unit03.lesson04.teach.cuantos_hermanos_tienes:
    title: Chiedere quanti fratelli ha qualcuno
    gloss: Quanti fratelli hai?
    note: '*Cuántos* (maschile plurale, perché *hermanos* comprende anche gruppi misti) concorda con il nome a cui si riferisce.'
  es.a1.unit03.lesson04.teach.somos_cinco:
    title: Dire quante persone siete in casa
    gloss: Siamo in cinque in casa.
    note: '*Somos* (siamo) è il modo naturale per dire quante persone vivono in casa, e in spagnolo si usa il verbo «essere» alla prima persona plurale, non una costruzione come «ci sono».'
  es.a1.unit03.lesson04.teach.mi_familia_es_grande:
    title: Descrivere una famiglia numerosa
    gloss: La mia famiglia è grande.
    note: '*Grande* si riferisce a *familia* (femminile), ma mantiene la stessa forma che *grande* ha con i nomi maschili, perché gli aggettivi in -e come *grande* non cambiano con il genere.'
  es.a1.unit03.lesson04.teach.tengo_muchos_primos:
    title: Dire che hai molti cugini
    gloss: Ho molti cugini.
    note: '*Muchos* (maschile plurale) si usa perché *primos*, come *hermanos* e *padres*, può indicare un gruppo misto.'
  es.a1.unit03.lesson04.teach.vives_cerca_de_tus_padres:
    title: Chiedere se si vive vicino ai genitori
    gloss: Vivi vicino ai tuoi genitori?
    note: '*Tus* è il plurale di *tu* e serve perché *padres* è plurale.'
  es.a1.unit03.lesson04.teach.vivo_con_mis_abuelos:
    title: Dire con chi vivi
    gloss: Vivo con i miei nonni.
    note: '*Con* introduce le persone con cui si vive; *vivo* è la forma di *yo* di *vivir*, già vista nell''Unità 1 con *vivo en Londres*.'
  es.a1.unit03.lesson05.teach.profile_reading:
    title: Il profilo della famiglia di Elena
    gloss: 'Mi chiamo Elena. Ho trentuno anni e vivo con i miei nonni in Spagna. Mia madre e mio padre vivono a Barcellona. Ho una sorella e un fratello: siamo in cinque in casa. Mia sorella minore si chiama Sofía e ha vent''anni.'
    note: 'Questo profilo riprende il lessico e le strutture delle lezioni 1-4 in un breve testo coerente, non in frasi isolate: è la stessa abilità di lettura (capire chi è chi) su cui si concentra la verifica di lettura di questa unità.'
    glosses:
      llamo: mi chiamo (da llamarse)
      Tengo: ho (da tener)
      treinta: trenta
      años: anni
      vivo: vivono (da vivir)
      abuelos: i nonni
      madre: madre
      padre: padre
      viven: vivono (da vivir)
      hermana: sorella
      hermano: fratello
      somos: siamo (da ser)
      cinco: cinque
      casa: casa
      menor: minore
      tiene: si chiama / ha (da llamarse / tener)
      veinte: venti
  es.a1.unit03.lesson05.teach.hermana_menor:
    title: Sorella minore
    gloss: sorella minore
    note: '*Menor* (minore) si mette dopo il nome a cui si riferisce e non cambia forma al femminile.'
  es.a1.unit03.lesson05.teach.vive_third_person:
    title: Vive (terza persona)
    gloss: vive
    note: '*Vive* è la terza persona singolare di *vivir* e si usa per parlare DI qualcuno (*Elena vive*...) e non di sé (*vivo*, visto nella lezione 4 dell''Unità 1 e di nuovo nella lezione 4 di questa unità).'
  es.a1.unit03.lesson05.teach.sus_third_person_plural:
    title: Suoi / loro (nome plurale)
    gloss: suoi / loro
    note: '*Sus* è il plurale di *su*: come *su* vale "suo/sua/Suo (formale)" con un nome singolare, così con un nome plurale si usa il plurale. *Sus abuelos* significa "i suoi nonni" parlando di Elena alla terza persona.'
  es.a1.unit03.lesson06.teach.line01:
    title: Mostrare le foto di famiglia
    gloss: Elena mostra una foto a Mateo e presenta i suoi genitori e la sorella minore.
    note: '*Estos son* (questi sono, maschile/misto plurale) presenta i genitori; *esta es* (questa è, femminile singolare) presenta la sorella.'
  es.a1.unit03.lesson06.teach.line02:
    title: Reagire e chiedere dei fratelli
    gloss: Mateo reagisce con calore e chiede se ha altri fratelli.
    note: '*Qué bonito* è una reazione naturale e calorosa davanti a una foto, simile per funzione a *Qué bien* dell''Unità 1.'
  es.a1.unit03.lesson06.teach.line03:
    title: Dire quanti siete in casa e ricambiare la domanda
    gloss: Elena dice che ha una sorella e un fratello, in cinque in casa, poi chiede della famiglia di Mateo.
    note: '*Somos cinco en casa* indica quante persone siete in casa, proseguendo lo schema della lezione 4.'
  es.a1.unit03.lesson06.teach.line04:
    title: Descrivere una famiglia più piccola
    gloss: 'Mateo dice che la sua famiglia è più piccola, solo tre persone: i suoi genitori e lui, ma ha molti cugini.'
    note: '*Pero* (ma) segnala il contrasto tra una famiglia stretta piccola e tanti parenti più lontani.'
  es.a1.unit03.lesson06.teach.line05:
    title: Chiedere della vicinanza ai genitori
    gloss: Elena chiede a Mateo se vive vicino ai suoi genitori.
    note: '*Cerca de* (vicino a) è un modo comune per descrivere la vicinanza fisica.'
  es.a1.unit03.lesson06.teach.line06:
    title: Spiegare la distanza e come restare in contatto
    gloss: Mateo dice di no, che vivono in Colombia e che si sentono al telefono ogni settimana.
    note: 'Continua il dato dell''Unità 1: Mateo viene dalla Colombia ma vive a Londra; i suoi genitori restano in Colombia.'
  es.a1.unit03.lesson06.teach.line07:
    title: Mostrare comprensione e parlare della propria situazione
    gloss: Elena dice che capisce e che lei vive con i suoi nonni qui in Spagna.
    note: '*Entiendo* (capisco) è un modo breve e naturale per riconoscere ciò che l''altro ha appena detto, prima di aggiungere un proprio dettaglio.'
  es.a1.unit03.lesson06.teach.line08:
    title: Chiudere con un commento caloroso
    gloss: Mateo dice che è bello avere la famiglia vicino.
    note: '*Qué bien tener a la familia cerca* chiude lo scambio con un tono caloroso e riflessivo, riprendendo lo schema *qué bien*/*qué bonito* di questo dialogo.'
