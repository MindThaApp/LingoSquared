teaching:
  es.a1.unit04.lesson01.teach.dias_entre_semana:
    title: Da lunedì a venerdì
    gloss: lunedì, martedì, mercoledì, giovedì, venerdì
    note: Come in italiano, i nomi dei giorni della settimana in spagnolo si scrivono con la minuscola, tranne a inizio frase.
    example_gloss:
    - Il laboratorio di cucina è il martedì.
    - Il giovedì studio spagnolo.
  es.a1.unit04.lesson01.teach.fin_de_semana:
    title: Sabato, domenica
    gloss: Sabato, domenica
    note: '*Sábado* e *domingo* sono gli unici due giorni della settimana che prendono la -s al plurale (*los sábados*, *los domingos*); gli altri nomi dei giorni restano uguali al singolare e al plurale.'
    example_gloss:
    - Il sabato vado al mercato.
    - La domenica mi riposo.
  es.a1.unit04.lesson01.teach.hoy_es_viernes:
    title: Oggi è venerdì
    gloss: Oggi è venerdì.
    note: '*Hoy* (oggi) + *es* (è) + il nome del giorno indica direttamente che giorno è oggi, senza articolo.'
  es.a1.unit04.lesson01.teach.el_taller_es_los_martes:
    title: Il laboratorio è il martedì
    gloss: Il laboratorio di cucina è il martedì.
    note: '*Los martes* (con l''articolo plurale *los*) significa "il martedì" come appuntamento che si ripete, non un martedì specifico.'
  es.a1.unit04.lesson02.teach.meses_primer_semestre:
    title: Gennaio-giugno
    gloss: gennaio, febbraio, marzo, aprile, maggio, giugno
    note: Come in italiano, i nomi dei mesi in spagnolo si scrivono con la minuscola, a meno che non inizino una frase.
    example_gloss:
    - Il mio compleanno è a marzo.
    - A giugno fa caldo.
  es.a1.unit04.lesson02.teach.meses_segundo_semestre:
    title: Luglio-dicembre
    gloss: luglio, agosto, settembre, ottobre, novembre, dicembre
    note: '*Septiembre* è molto simile all''italiano "settembre": la maggior parte dei nomi dei mesi in spagnolo è molto vicina a quella italiana.'
    example_gloss:
    - Il laboratorio di cucina inizia a luglio.
    - A dicembre vado a trovare la mia famiglia.
  es.a1.unit04.lesson02.teach.mi_cumpleanos_es_en_marzo:
    title: Il mio compleanno è a marzo
    gloss: Il mio compleanno è a marzo.
    note: '*En* (in) si usa con il solo nome del mese, senza un giorno preciso.'
  es.a1.unit04.lesson03.teach.que_fecha_es_hoy:
    title: Chiedere la data di oggi
    gloss: Che data è oggi?
    note: '*Qué fecha* (che data) è il modo standard per chiedere la data del calendario, diverso da *qué hora* (che ora), che vedrai in una prossima unità.'
  es.a1.unit04.lesson03.teach.hoy_es_el_veintidos_de_julio:
    title: Dire una data
    gloss: Oggi è il ventidue luglio.
    note: '*El veintidós de julio* corrisponde letteralmente a «il ventidue di luglio»: in spagnolo la data si dice con un numero cardinale, non con un ordinale.'
  es.a1.unit04.lesson03.teach.formato_fecha_note:
    title: Il formato della data in spagnolo
    gloss: Come si dicono le date in spagnolo.
    note: Numero cardinale + de + mese. Per il primo del mese è comune *el primero* (soprattutto in America Latina); si usa anche *el uno*, soprattutto in Spagna.
    target_text: 'In spagnolo la data si dice con numero cardinale + de + mese: el veintidós de julio si legge letteralmente «il ventidue di luglio». Per il primo giorno del mese molti parlanti (soprattutto in America Latina) dicono *el primero*; anche *el uno* è comune, specialmente in Spagna.'
  es.a1.unit04.lesson03.teach.cuando_es_el_taller:
    title: Chiedere quando è il laboratorio
    gloss: Quando è il laboratorio?
    note: '*Cuándo* (quando) chiede in generale il momento; *qué fecha* (l''altra domanda di questa lezione) chiede in particolare la data del calendario: qui sono naturali entrambe.'
  es.a1.unit04.lesson03.teach.el_taller_es_el_veintidos_de_julio:
    title: Dire la data del laboratorio
    gloss: Il laboratorio è il ventidue luglio.
    note: Riprende lo stesso schema della data di *hoy es el veintidós de julio*, solo con un soggetto diverso (*el taller*).
  es.a1.unit04.lesson04.teach.cuando_es_tu_cumpleanos:
    title: Chiedere il compleanno di qualcuno
    gloss: Quando è il tuo compleanno?
    note: '*Tu cumpleaños* (il tuo compleanno) usa il registro informale del *tú*, quello degli amici.'
  es.a1.unit04.lesson04.teach.mi_cumpleanos_es_el_diez_de_marzo:
    title: Dire il proprio compleanno
    gloss: Il mio compleanno è il dieci marzo.
    note: A differenza di *en marzo* (a marzo, solo il mese), per la data completa del compleanno si usa *el* + il numero del giorno, come in *el veintidós de julio*.
  es.a1.unit04.lesson04.teach.el_de_mateo_es_el_veintidos_de_agosto:
    title: Dire il compleanno di una terza persona
    gloss: Il compleanno di Mateo è il ventidue agosto.
    note: '*El cumpleaños de Mateo* (il compleanno di Mateo) usa *de* per indicare il possesso, come in *la familia de Elena*.'
  es.a1.unit04.lesson04.teach.felicidades:
    title: Auguri!
    gloss: Congratulazioni! / Auguri!
    note: '*¡Felicidades!* è la parola generica per congratularsi: si usa per i compleanni, ma anche per altre buone notizie.'
    example_gloss: Auguri, Elena! Oggi è il tuo compleanno.
  es.a1.unit04.lesson05.teach.horario_reading:
    title: Leggere il programma del laboratorio
    gloss: Il laboratorio di cucina è il martedì. La prossima lezione è il ventidue luglio. Dopo, c'è una lezione il ventinove luglio. Il laboratorio finisce il dodici agosto.
    note: Questo breve calendario usa in un unico testo i nomi dei giorni e lo schema delle date che hai imparato.
    glosses:
      taller: laboratorio
      cocina: di cucina
      martes: il martedì
      próxima: prossima
      clase: lezione
      veintidós: ventidue
      julio: luglio
      Después: dopo
      hay: c'è (da haber)
      veintinueve: ventinove
      termina: finisce (da terminar)
      doce: dodici
      agosto: agosto
  es.a1.unit04.lesson05.teach.la_proxima_clase:
    title: La prossima lezione
    gloss: la prossima lezione
    note: '*Próxima* (prossima) concorda con il sostantivo femminile *clase*; al maschile sarebbe *próximo*.'
  es.a1.unit04.lesson05.teach.despues_note:
    title: Después (dopo)
    gloss: Come *después* collega gli eventi in sequenza.
    note: '*Después* = dopo, in seguito.'
    target_text: '*Después* (dopo, poi) collega due eventi in sequenza: prima una cosa, poi l''altra.'
  es.a1.unit04.lesson06.teach.line01:
    title: Chiedere della prossima lezione
    gloss: Mateo chiede a Elena quando è la prossima lezione del laboratorio.
    note: '*La próxima clase del taller* = la prossima lezione del laboratorio.'
  es.a1.unit04.lesson06.teach.line02:
    title: Dire la data
    gloss: Elena conferma che è il ventidue luglio, un martedì.
    note: Elena aggiunge *un martes* (un martedì) dopo la data, a conferma che la lezione cade nel giorno abituale del laboratorio, il martedì.
  es.a1.unit04.lesson06.teach.line03:
    title: Chiedere quando finisce il laboratorio
    gloss: Mateo chiede quando finisce il laboratorio.
    note: '*Perfecto* (perfetto) è un modo naturale per rispondere brevemente prima di fare un''altra domanda.'
  es.a1.unit04.lesson06.teach.line04:
    title: Dire la data di fine
    gloss: Elena dice che finisce il dodici agosto.
    note: La stessa data di fine del calendario stampato.
  es.a1.unit04.lesson06.teach.line05:
    title: Chiedere del compleanno durante la conversazione
    gloss: Mateo dice "a proposito" e chiede a Elena quand'è il suo compleanno.
    note: '*Por cierto* (a proposito) introduce in modo naturale un cambio di argomento durante una conversazione.'
  es.a1.unit04.lesson06.teach.line06:
    title: Dire la data e rilanciare la domanda
    gloss: Elena dice il dieci marzo, poi chiede "e il tuo?"
    note: '*¿Y el tuyo?* (e il tuo?) usa il pronome possessivo *tuyo*, una nuova forma breve per rilanciare una domanda su qualcosa già nominato (*cumpleaños*, maschile, quindi *tuyo* e non *tuya*).'
  es.a1.unit04.lesson06.teach.line07:
    title: Dire il compleanno di Mateo
    gloss: Mateo dice il ventidue agosto.
    note: 'Una risposta breve e completa che riprende lo schema della data senza ripetere "mi cumpleaños es": è naturale in uno scambio parlato rapido.'
  es.a1.unit04.lesson06.teach.line08:
    title: Reagire e notare il momento
    gloss: Elena reagisce con calore, notando che il suo compleanno cade dopo la fine del laboratorio.
    note: '*Es después del taller* (è dopo il laboratorio): il 22 agosto viene dopo la fine del laboratorio, il 12 agosto.'
