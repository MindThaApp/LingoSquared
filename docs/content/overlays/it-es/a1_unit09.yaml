teaching:
  es.a1.unit09.lesson01.teach.la_calle:
    title: La strada
    gloss: la strada
    note: '*Calle* è femminile.'
    example_gloss: Abito in questa strada.
  es.a1.unit09.lesson01.teach.la_esquina:
    title: L'angolo
    gloss: l'angolo
    note: '*Esquina* è femminile.'
    example_gloss: La banca è all'angolo.
  es.a1.unit09.lesson02.teach.seguir_derecho:
    title: Andare dritto
    gloss: Vai dritto.
    note: '*Sigue* è l''imperativo informale (tu) di *seguir* (seguire, proseguire), che ritorna in tutte le indicazioni di questa unità.'
  es.a1.unit09.lesson02.teach.doblar_izquierda:
    title: Girare a sinistra
    gloss: Gira a sinistra.
    note: '*Dobla* è l''imperativo informale (tu) di *doblar* (girare, piegare). Vedi la nota di grammatica successiva su *doblar* e *girar*.'
  es.a1.unit09.lesson02.teach.girar_derecha:
    title: Girare a destra
    gloss: Gira a destra.
    note: '*Gira* è l''imperativo informale (tu) di *girar* (girare), del tutto intercambiabile con *doblar*.'
  es.a1.unit09.lesson02.teach.cruzar_la_calle:
    title: Attraversare la strada
    gloss: Attraversa la strada.
    note: '*Cruza* è l''imperativo informale (tu) di *cruzar* (attraversare).'
  es.a1.unit09.lesson02.teach.doblar_vs_girar_note:
    title: Doblar o girar
    gloss: Due verbi ugualmente naturali per dire "girare".
    note: Vedi il testo della scheda.
    target_text: '*Doblar* e *girar* significano entrambi «girare» e qui sono del tutto intercambiabili: è una preferenza regionale, non una differenza di registro o di significato. In questa unità si usano entrambi.'
  es.a1.unit09.lesson03.teach.como_llego_a_la_biblioteca:
    title: Chiedere come arrivare in un posto
    gloss: Come arrivo alla biblioteca?
    note: '*Cómo llego a* (come arrivo a) è il modo standard per chiedere indicazioni per raggiungere un luogo preciso.'
  es.a1.unit09.lesson03.teach.es_facil:
    title: Dire che è facile
    gloss: È facile.
    note: Una frase comune e rassicurante che si dice prima di dare indicazioni.
  es.a1.unit09.lesson03.teach.sigue_derecho_por_esta_calle:
    title: Vai dritto per questa strada
    gloss: Vai dritto per questa strada.
    note: '*Por esta calle* (lungo questa strada) indica quale strada seguire.'
  es.a1.unit09.lesson03.teach.dobla_a_la_izquierda_en_la_esquina:
    title: Girare a sinistra all'angolo
    gloss: Gira a sinistra all'angolo.
    note: '*En la esquina* (all''angolo) indica dove si gira.'
  es.a1.unit09.lesson04.teach.esta_bien_asi:
    title: Chiedere conferma
    gloss: Va bene così?
    note: '*¿Está bien así?* (va bene così?) serve a controllare di aver capito dopo aver ripetuto le indicazioni, il passo naturale dopo aver ricevuto un percorso.'
  es.a1.unit09.lesson04.teach.si_asi_es:
    title: Confermare
    gloss: Sì, è giusto.
    note: '*Así es* (è così) è una conferma breve e naturale.'
  es.a1.unit09.lesson04.teach.no_te_pierdas:
    title: Non perderti
    gloss: Non perderti!
    note: '*No te pierdas* è l''imperativo negativo informale di *perderse* (perdersi), un saluto caloroso e informale.'
  es.a1.unit09.lesson05.teach.direcciones_reading:
    title: Leggere indicazioni scritte
    gloss: 'Per arrivare alla biblioteca dal mercato: vai dritto per questa strada. Gira a sinistra all''angolo. Poi attraversa la strada. La biblioteca è sulla destra.'
    note: 'Le indicazioni scritte elencano i passi in ordine: *Para llegar a...* (per arrivare a...) indica la destinazione, poi ogni passo è un imperativo di *tú* (*sigue*, *dobla*, *cruza*) e *después* (poi) collega i passi.'
    glosses:
      llegar: arrivare
      biblioteca: biblioteca
      desde: da
      mercado: mercato
      sigue: prosegui / vai (da seguir)
      derecho: dritto
      calle: strada
      Dobla: gira (da doblar)
      izquierda: sinistra
      esquina: angolo
      Después: poi / dopo
      cruza: attraversa (da cruzar)
      está: si trova (da estar)
      derecha: destra
  es.a1.unit09.lesson05.teach.desde_note:
    title: Desde (da)
    gloss: Come desde indica il punto di partenza di un percorso.
    note: Vedi il testo della scheda.
    target_text: '*Desde* (da) indica il punto di partenza di un percorso, abbinato ad *a* (a) per la destinazione: *desde el mercado* ... *a la biblioteca*.'
  es.a1.unit09.lesson06.teach.line01:
    title: Chiedere indicazioni
    gloss: Mateo chiede a Elena come arrivare alla biblioteca dal mercato.
    note: 'La stessa domanda *¿Cómo llego a...?* vista prima in questa unità, ora con un punto di partenza: *desde el mercado* (dal mercato).'
  es.a1.unit09.lesson06.teach.line02:
    title: Dare il primo passo
    gloss: Elena dice che è facile e dà la prima indicazione.
    note: '*Es fácil* (è facile) rassicura prima di dare il primo passo.'
  es.a1.unit09.lesson06.teach.line03:
    title: Ripetere e chiedere il seguito
    gloss: Mateo ripete l'indicazione e chiede cosa viene dopo.
    note: '*Sigo derecho* (vado dritto) è la prima persona di *seguir*: Mateo conferma mentre segue le indicazioni.'
  es.a1.unit09.lesson06.teach.line04:
    title: Dare il secondo passo
    gloss: Elena gli dice di girare a sinistra all'angolo.
    note: '*Dobla* (gira): anche *gira* avrebbe lo stesso significato qui.'
  es.a1.unit09.lesson06.teach.line05:
    title: Ripetere e chiedere conferma
    gloss: Mateo ripete la svolta e chiede se va bene.
    note: '*Doblo* (giro) riprende il suo *Sigo derecho* di prima: Mateo ripete ogni passo alla forma di *yo* per verificarlo.'
  es.a1.unit09.lesson06.teach.line06:
    title: Confermare e dare gli ultimi passi
    gloss: 'Elena conferma, poi gli dice di attraversare la strada: la biblioteca sarà sulla destra.'
    note: '*Sí, así es* (sì, esatto) conferma, poi *después* (poi) introduce gli ultimi passi del percorso.'
  es.a1.unit09.lesson06.teach.line07:
    title: Ringraziare Elena
    gloss: Mateo ringrazia Elena con calore.
    note: '*Muchas gracias* (grazie mille) è una versione più calorosa del semplice *gracias*.'
  es.a1.unit09.lesson06.teach.line08:
    title: Rispondere e salutare
    gloss: Elena risponde prego e gli dice di non perdersi.
    note: '*De nada* (prego) è la risposta standard a *gracias*.'
