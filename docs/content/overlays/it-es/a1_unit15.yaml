teaching:
  es.a1.unit15.lesson01.teach.mas_que:
    title: Più...di
    gloss: più... di/che
    note: '*Más...que* confronta due quantità o due cose diverse: vedi la nota grammaticale qui sotto.'
    example_gloss: Il nuovo appartamento è più grande di quello vecchio.
  es.a1.unit15.lesson01.teach.menos_que:
    title: Meno...di
    gloss: meno...di
    note: '*Menos...que*, il contrario di *más...que*.'
    example_gloss: L'appartamento vecchio è meno grande di quello nuovo.
  es.a1.unit15.lesson01.teach.tan_como:
    title: Tanto...quanto
    gloss: tanto... quanto
    note: '*Tan...como* confronta due cose UGUALI: è una costruzione davvero diversa da *más/menos*, non un altro modo per dire la stessa cosa.'
    example_gloss: Mateo cucina bene quanto Elena.
  es.a1.unit15.lesson01.teach.mas_menos_tan_note:
    title: Disuguaglianza e uguaglianza
    gloss: La differenza tra más/menos...que e tan...como.
    note: Vedi il testo della scheda.
    target_text: '*Más...que* (più...di) e *menos...que* (meno...di) confrontano due cose o quantità DIVERSE. *Tan...como* (tanto...quanto) confronta due cose UGUALI: è una costruzione diversa, non un semplice sinonimo di *más/menos*.'
  es.a1.unit15.lesson02.teach.el_nuevo_es_mas_grande:
    title: Confronta il nuovo appartamento
    gloss: Il nuovo appartamento è più grande di quello vecchio.
    note: '*Más grande que* (più grande di) inserisce *grande* (grande) nello schema *más...que*.'
  es.a1.unit15.lesson02.teach.el_viejo_es_mas_pequeno:
    title: Confronta il vecchio appartamento
    gloss: L'appartamento vecchio è più piccolo di quello nuovo.
    note: '*Más pequeño que* (più piccolo di) usa *pequeño* (piccolo) ed esprime il confronto nella direzione opposta.'
  es.a1.unit15.lesson03.teach.cual_apartamento_es_mas_grande:
    title: Chiedi quale è più grande
    gloss: Quale appartamento è più grande?
    note: '*¿Cuál...?* (quale...?) + aggettivo comparativo è il modo normale di chiedere un confronto.'
  es.a1.unit15.lesson03.teach.el_nuevo_es_mas_grande_reply:
    title: Rispondi quale è più grande
    gloss: Quello nuovo è più grande di quello vecchio.
    note: Lo stesso confronto, ora come risposta diretta alla domanda con *¿cuál...?*; con *el nuevo* (quello nuovo) non si ripete il nome.
  es.a1.unit15.lesson04.teach.mateo_cocina_tan_bien_como_elena:
    title: Confronta in parità l'abilità in cucina
    gloss: Mateo cucina bene quanto Elena.
    note: '*Tan bien como* (bene come) usa *tan* + avverbio + *como*, lo schema dell''uguaglianza applicato al modo in cui si fa un''azione e non alla dimensione di un nome.'
  es.a1.unit15.lesson04.teach.somos_un_buen_equipo:
    title: Dire che siete una bella squadra
    gloss: Siamo una bella squadra.
    note: '*Somos* (siamo) + *un buen equipo* (una bella squadra) è una frase conclusiva naturale dopo un confronto di uguaglianza.'
  es.a1.unit15.lesson05.teach.comparacion_reading:
    title: Confrontiamo i due appartamenti
    gloss: Il vecchio appartamento di Mateo ha una cucina piccola. Il nuovo appartamento è più grande, e anche la cucina è più grande. Quello vecchio è più piccolo di quello nuovo, ed è per questo che Mateo vuole traslocare. Quello nuovo ha più spazio per cucinare.
    note: Un riassunto realistico che confronta i due appartamenti.
    glosses:
      viejo: vecchio
      tiene: ha (di tener)
      pequeña: piccolo
      nuevo: nuovo
      grande: grande
      también: anche
      pequeño: piccolo
      eso: che
      quiere: vuole (di querer)
      mudarse: traslocare
      espacio: spazio
      cocinar: cucinare
  es.a1.unit15.lesson05.teach.por_eso_note:
    title: Por eso (per questo)
    gloss: Come por eso collega una causa a una conseguenza.
    note: Vedi il testo della scheda.
    target_text: '*Por eso* (per questo) collega una causa al suo effetto: la cucina piccola è il motivo per cui Mateo vuole traslocare, la stessa logica di causa ed effetto che hai già visto con *porque*.'
  es.a1.unit15.lesson06.teach.line01:
    title: Chiedere se l'ha già visto
    gloss: Elena chiede a Mateo se ha già visto il nuovo appartamento.
    note: '*¿Ya viste...?* (hai già visto...?) è una nuova forma interrogativa al passato.'
  es.a1.unit15.lesson06.teach.line02:
    title: Confermare che è più grande
    gloss: Mateo conferma che è più grande di quello vecchio, cucina compresa.
    note: Un confronto con *más...que*, ampliato con *la cocina también* (anche la cucina).
  es.a1.unit15.lesson06.teach.line03:
    title: Chiedere quale è più piccolo
    gloss: Elena chiede quale appartamento è più piccolo, allora.
    note: '*Entonces* (allora) è un connettore logico che hai già visto; la domanda segue lo schema *¿Cuál...?* con *pequeño* al posto di *grande*.'
  es.a1.unit15.lesson06.teach.line04:
    title: Rispondere e spiegare
    gloss: Mateo dice che quello vecchio è più piccolo, ed è per questo che vuole traslocare.
    note: '*El viejo es más pequeño que el nuevo* più *por eso quiero mudarme* (per questo voglio traslocare).'
  es.a1.unit15.lesson06.teach.line05:
    title: Essere d'accordo
    gloss: 'Elena dice che ha molto senso: quello nuovo ha più spazio per cucinare.'
    note: '*Tiene mucho sentido* (ha molto senso) è una nuova espressione per dirsi d''accordo; *más espacio para cocinar* significa più spazio per cucinare.'
  es.a1.unit15.lesson06.teach.line06:
    title: Proseguire il ragionamento
    gloss: Mateo è d'accordo e aggiunge che, dato che Elena cucina bene quanto lui, serve spazio per due.
    note: '*Tan bien como* (bene come), qui usato in una conversazione con *tú cocinas* (tu cucini).'
  es.a1.unit15.lesson06.teach.line07:
    title: Ricambiare il complimento
    gloss: Elena è entusiasta e dice che lui cucina bene quanto lei.
    note: '*¡Es verdad!* (è vero!) + *tú cocinas tan bien como yo* (tu cucini bene quanto me): lo stesso confronto con *tan bien como*, rivolto a Mateo.'
  es.a1.unit15.lesson06.teach.line08:
    title: Concludere con spirito di squadra
    gloss: Mateo conclude che sono una bella squadra.
    note: '*Somos un buen equipo* (siamo una bella squadra) chiude il dialogo.'
