teaching:
  es.a1.unit11.lesson01.teach.la_camisa:
    title: La camicia
    gloss: la camicia
    note: '*Camisa* è femminile.'
    example_gloss: Mi piace questa camicia.
  es.a1.unit11.lesson01.teach.el_pantalon:
    title: I pantaloni
    gloss: i pantaloni
    note: '*Pantalón* in spagnolo è singolare, mentre in italiano «pantaloni» di solito è plurale.'
    example_gloss: I pantaloni costano venti.
  es.a1.unit11.lesson01.teach.la_chaqueta:
    title: La giacca
    gloss: la giacca
    note: '*Chaqueta* è femminile.'
    example_gloss: Mi serve una giacca per l'inverno.
  es.a1.unit11.lesson01.teach.los_zapatos:
    title: Le scarpe
    gloss: le scarpe
    note: '*Zapatos* è plurale, come «scarpe» in italiano.'
    example_gloss: Queste scarpe sono comode.
  es.a1.unit11.lesson01.teach.el_delantal:
    title: Il grembiule
    gloss: il grembiule
    note: '*Delantal* è maschile: è proprio l''indumento che serve a Elena e Mateo per il laboratorio.'
    example_gloss: Ci serve un grembiule per il laboratorio.
  es.a1.unit11.lesson02.teach.que_talla_usas:
    title: Chiedere la taglia
    gloss: Che taglia porti?
    note: '*¿Qué talla usas?* è il modo standard per chiedere la taglia di un capo a qualcuno.'
  es.a1.unit11.lesson02.teach.uso_la_talla_mediana:
    title: Dire la propria taglia
    gloss: Porto la taglia media.
    note: '*Uso* (uso/porto) + *la talla* (la taglia) + la parola della taglia.'
  es.a1.unit11.lesson02.teach.me_queda_bien:
    title: Dire che veste bene
    gloss: Mi sta bene.
    note: '*Me queda bien* usa *quedar* («stare», di un capo che veste): vedi la scheda di grammatica seguente.'
  es.a1.unit11.lesson02.teach.me_queda_mal:
    title: Dire che veste male
    gloss: Mi sta male.
    note: È il contrario di *me queda bien*, con *mal* al posto di *bien*.
  es.a1.unit11.lesson02.teach.queda_note:
    title: Quedar bien/mal
    gloss: Come quedar descrive la vestibilità, non la qualità in generale.
    note: Vedi il testo della scheda.
    target_text: '*Me queda bien* («mi sta bene») usa *quedar* («stare», di un capo che veste), un verbo diverso da *ser* o *estar*; letteralmente «mi rimane bene». Qui *bien* e *mal* descrivono la vestibilità, non la qualità.'
  es.a1.unit11.lesson03.teach.cuanto_cuesta_este_delantal:
    title: Chiedere il prezzo del grembiule
    gloss: Quanto costa questo grembiule?
    note: Usa la struttura *¿Cuánto cuesta?* con un articolo preciso indicato da *este* (questo).
  es.a1.unit11.lesson03.teach.cuesta_doce:
    title: Dire il prezzo
    gloss: Costa dodici.
    note: '*Cuesta* + numero indica il prezzo.'
  es.a1.unit11.lesson03.teach.este_vs_esta_note:
    title: Este e esta
    gloss: Come il dimostrativo concorda con il genere del nome.
    note: Vedi il testo della scheda.
    target_text: '*Este* (questo, maschile) concorda con *el delantal*; *esta* (questa, femminile) va con *esta camisa*: il dimostrativo cambia con il genere del nome, come in italiano.'
  es.a1.unit11.lesson04.teach.me_gusta_este:
    title: Dire che ti piace questo
    gloss: Mi piace questo.
    note: '*Este* qui è usato da solo, come pronome ("questo"), e riprende l''oggetto appena nominato.'
  es.a1.unit11.lesson04.teach.voy_a_comprarlo:
    title: Dì che lo comprerai
    gloss: Lo comprerò.
    note: '*Voy a* + infinito è la costruzione del futuro prossimo; in *comprarlo* il pronome oggetto *lo* è attaccato all''infinito *comprar*.'
  es.a1.unit11.lesson04.teach.compramos_dos:
    title: Dì che ne comprate due
    gloss: Ne compriamo due.
    note: '*Compramos* (compriamo) è la forma di *nosotros*, usata quando Elena e Mateo decidono insieme.'
  es.a1.unit11.lesson05.teach.precios_reading:
    title: Leggere un listino prezzi
    gloss: 'In questo negozio la camicia costa quindici, i pantaloni costano venti, la giacca costa trenta e le scarpe costano venticinque. Il grembiule è il più economico: costa solo dodici.'
    note: 'Un listino prezzi di un negozio: *cuesta* (costa) per un solo articolo, *cuestan* (costano) per i plurali come *los zapatos*.'
    glosses:
      tienda: negozio
      camisa: camicia
      cuesta: costa (da costar)
      quince: quindici
      pantalón: pantaloni
      veinte: venti
      chaqueta: giacca
      treinta: trenta
      zapatos: scarpe
      cuestan: costano (da costar)
      veinticinco: venticinque
      delantal: grembiule
      barato: economico
      solo: solo
      doce: dodici
  es.a1.unit11.lesson05.teach.el_mas_barato_note:
    title: El más barato (il più economico)
    gloss: Come si forma il superlativo con el/la + más + aggettivo.
    note: Vedi il testo della scheda.
    target_text: '*El más barato* («il più economico») è un superlativo: *el/la* + *más* + aggettivo, con *de/en* per indicare il gruppo di confronto. In questa unità non si studia ancora tutto il sistema dei comparativi, solo questa espressione comune quando si fanno acquisti.'
  es.a1.unit11.lesson06.teach.line01:
    title: Esprimere un bisogno
    gloss: Elena dice che hanno bisogno di grembiuli per il laboratorio.
    note: '*Delantales* è il plurale di *el delantal*.'
  es.a1.unit11.lesson06.teach.line02:
    title: Essere d'accordo e proporre un negozio
    gloss: Mateo è d'accordo e propone di andare in quel negozio.
    note: '*Tienes razón* significa "hai ragione"; *esa tienda* significa "quel negozio".'
  es.a1.unit11.lesson06.teach.line03:
    title: Il commesso li saluta
    gloss: Il commesso li saluta e offre il suo aiuto.
    note: '*¿Los ayudo?* (vi aiuto?) è un saluto tipico del commesso, rivolto a Elena e Mateo insieme.'
  es.a1.unit11.lesson06.teach.line04:
    title: Dire che cosa cercano
    gloss: Elena risponde di sì, cercano dei grembiuli.
    note: '*Buscamos* (cerchiamo) è la forma di *nosotros* del verbo *buscar*.'
  es.a1.unit11.lesson06.teach.line05:
    title: Il commesso mostra delle opzioni e chiede la taglia
    gloss: Il commesso mostra alcuni grembiuli e chiede la loro taglia.
    note: '*¿Qué talla usan?* usa il plurale *usan* (portate), rivolto a entrambi, a differenza del singolare *usas*.'
  es.a1.unit11.lesson06.teach.line06:
    title: Dire la propria taglia
    gloss: Mateo dice che porta la taglia media.
    note: '*Uso la talla mediana* risponde per lui a *¿Qué talla usan?*.'
  es.a1.unit11.lesson06.teach.line06b:
    title: Elena è d'accordo
    gloss: Elena dice che ha la stessa taglia.
    note: '*Yo también* significa "anch''io".'
  es.a1.unit11.lesson06.teach.line07:
    title: Chiedere il prezzo
    gloss: Mateo chiede quanto costa il grembiule.
    note: '*Este* (questo) indica il grembiule che ha davanti.'
  es.a1.unit11.lesson06.teach.line07b:
    title: Dire il prezzo
    gloss: Il commesso dice che costa dodici.
    note: '*Cuesta* + numero indica il prezzo.'
  es.a1.unit11.lesson06.teach.line08:
    title: Confermare la vestibilità e decidere di comprare
    gloss: Elena dice che le sta bene, che le piace e che lo comprerà.
    note: Unisce in sequenza *me queda bien*, *me gusta este* e *voy a comprarlo*.
  es.a1.unit11.lesson06.teach.line09:
    title: Essere d'accordo e comprarne due
    gloss: Mateo dice che sta bene anche a lui e che ne comprano due.
    note: '*A mí también* (anche a me, in forma enfatica) riprende lo schema di accordo con *también* aggiungendo un pronome enfatico; *compramos dos* chiude la scena.'
