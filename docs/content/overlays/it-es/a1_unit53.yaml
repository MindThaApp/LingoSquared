answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spagnolo A1
  description: 'Spagnolo per principianti per parlare di animali domestici e animali comuni: come chiamarli, le cure di base (portare a spasso, dare da mangiare, giocare), come dire quali animali ami anche se non ne hai uno, e il plurale regolare in spagnolo.'
units:
  es.a1.unit53.animals:
    title: Animali e animali domestici
lessons:
  es.a1.unit53.lesson01.perro_gato_pez_y:
    title: Cane, gatto, pesce e uccello
  es.a1.unit53.lesson02.cuidar_de_una_mascota:
    title: Prendersi cura di un animale
  es.a1.unit53.lesson03.amar_a_los_animales:
    title: Amare gli animali
  es.a1.unit53.lesson04.mateo_pregunta_por_el:
    title: Mateo chiede del cane di Elena
  es.a1.unit53.lesson05.mateo_lucia_y_diego:
    title: Mateo, Lucía e Diego parlano di animali
  es.a1.unit53.lesson06.el_pajaro_de_nina:
    title: L'uccellino di Nina
teaching:
  es.a1.unit53.lesson01.teach.el_animal_la:
    title: Animale, animale domestico
    gloss: l'animale / un animale domestico
    note: '*Animal* è la parola generica, mentre *mascota* indica in particolare un animale domestico; *mascota* è femminile, anche se l''animale è maschio.'
    example_gloss:
    - Il cane è un animale.
    - Il cane è anche un animale domestico.
  es.a1.unit53.lesson01.teach.el_perro_el:
    title: Cane e gatto
    gloss: il cane / il gatto
    example_gloss:
    - Elena ha un cane.
    - Diego ha un gatto.
  es.a1.unit53.lesson01.teach.el_pez_el:
    title: Pesce e uccello
    gloss: il pesce / l'uccello
    example_gloss:
    - Il nonno ha un pesce.
    - Nina ha un uccellino.
  es.a1.unit53.lesson01.teach.tienes_mascota:
    title: Hai un animale domestico?
    gloss: Hai un animale domestico?
    note: È lo stesso schema di domanda *¿Tienes ...?* che conosci già dalle unità precedenti.
  es.a1.unit53.lesson01.teach.si_tengo_un:
    title: Sì, ho un cane
    gloss: Sì, ho un cane.
    note: Una semplice risposta affermativa con il lessico nuovo di questa unità.
  es.a1.unit53.lesson01.teach.no_no_tengo:
    title: No, non ho un animale domestico
    gloss: No, non ho un animale domestico.
    note: '*No tengo mascota* si forma semplicemente con *no* davanti al verbo; vedi la nota di grammatica.'
  es.a1.unit53.lesson01.teach.para_decir_que:
    title: 'No tengo: dire che non hai qualcosa'
    gloss: 'Per dire che non hai qualcosa, metti no davanti a tengo: No tengo tiempo, no tengo mascota.'
    note: Riprende la struttura *no tengo* già vista con *No tengo tiempo*; cambia solo il nome.
  es.a1.unit53.lesson02.teach.sacar_a_pasear:
    title: Portare a spasso (un animale)
    gloss: portare a spasso (un animale)
    note: '*Sacar a pasear* è un''espressione fissa: *sacar* ("portare fuori") + *a pasear* ("a passeggio").'
    example_gloss: Porto a spasso il cane ogni giorno.
  es.a1.unit53.lesson02.teach.cuando_el_objeto:
    title: Sacar a pasear e la a personale
    gloss: 'Quando l''oggetto è un animale o una persona, davanti va la a: saco al perro a pasear.'
    note: Riprende *saco al perro* dalla scheda precedente; la *a* personale compare davanti ad animali o persone a cui si tiene.
  es.a1.unit53.lesson02.teach.dar_de_comer:
    title: Dare da mangiare
    gloss: dare da mangiare
    example_gloss: Do da mangiare al gatto ogni giorno.
  es.a1.unit53.lesson02.teach.jugar_con:
    title: Giocare con
    gloss: giocare con
    example_gloss: Diego gioca con il suo gatto.
  es.a1.unit53.lesson02.teach.saco_al_perro:
    title: Porto a spasso il cane ogni giorno
    gloss: Porto a spasso il cane ogni giorno.
    note: '*Sacar a pasear* si combina con *todos los días* (ogni giorno), già visto in un''unità precedente; *a* + *el* diventa *al*.'
  es.a1.unit53.lesson02.teach.le_doy_de:
    title: Do da mangiare al gatto ogni giorno
    gloss: Do da mangiare al gatto ogni giorno.
    note: '*Dar de comer* ("dare da mangiare") significa nutrire; *le* si riferisce all''animale: *le doy de comer al gato*.'
  es.a1.unit53.lesson03.teach.el_plural_termina:
    title: 'Plural: perro → perros'
    gloss: 'Il plurale termina in -s: perro → perros, gato → gatos. Dopo una consonante si aggiunge -es: animal → animales.'
    note: Il plurale regolare spagnolo, presentato qui per la prima volta con i nomi di animali come esempio. A differenza dell'italiano, che cambia la vocale finale, lo spagnolo aggiunge -s o -es.
  es.a1.unit53.lesson03.teach.perros_gatos:
    title: Cani e gatti
    gloss: cani / gatti
    example_gloss:
    - Mateo adora i cani.
    - Lucía adora i gatti.
  es.a1.unit53.lesson03.teach.peces_pajaros:
    title: Pesci e uccelli (plurale)
    gloss: pesci / uccelli
    example_gloss:
    - Adoro i pesci.
    - Il nonno adora gli uccelli.
  es.a1.unit53.lesson03.teach.me_encantan_los:
    title: Adoro gli animali
    gloss: Adoro gli animali.
    note: '*Me encantan* è plurale perché *los animales* è plurale: il verbo concorda con ciò che ti piace.'
  es.a1.unit53.lesson03.teach.a_lucia_le:
    title: Lucía adora i gatti, ma non ha un animale domestico
    gloss: Lucía adora i gatti, ma non ha un animale domestico.
    note: Prepara il contrasto su cui è costruita la lettura della lezione 5.
  es.a1.unit53.lesson04.teach.mateo_tienes_mascota:
    title: Mateo chiede degli animali domestici
    gloss: 'Mateo: Hai un animale domestico, Elena?'
  es.a1.unit53.lesson04.teach.elena_si_tengo:
    title: Elena ha un cane
    gloss: 'Elena: Sì, ho un cane.'
  es.a1.unit53.lesson04.teach.mateo_como_es:
    title: Mateo chiede com'è
    gloss: 'Mateo: Com''è?'
    note: Riprende *¿Cómo es?* dall'unità sull'aspetto fisico, ora riferito a un animale.
  es.a1.unit53.lesson04.teach.elena_tiene_el:
    title: Elena descrive il suo cane
    gloss: 'Elena: Ha il pelo castano ed è piccolo.'
    note: Riprende il lessico dei colori dei capelli e delle dimensioni dell'unità sull'aspetto fisico, ora per descrivere il pelo di un animale invece dei capelli di una persona.
  es.a1.unit53.lesson04.teach.el_y_lo:
    title: Él e lo per gli animali
    gloss: Él e lo possono riferirsi anche a un animale, non solo a una persona.
    note: Finora *él* nel corso si riferiva sempre a una persona; qui si segnala l'estensione agli animali, insieme a *lo* ("lo") come pronome complemento.
  es.a1.unit53.lesson04.teach.mateo_lo_sacas:
    title: Mateo chiede delle passeggiate
    gloss: 'Mateo: Lo porti a spasso ogni giorno?'
  es.a1.unit53.lesson04.teach.elena_si_lo:
    title: Elena descrive la sua routine
    gloss: 'Elena: Sì, lo porto a spasso ogni giorno e gli do da mangiare.'
  es.a1.unit53.lesson05.teach.a_mateo_y:
    title: Mateo, Lucía e Diego parlano di animali
    gloss: 'A Mateo e a Lucía piacciono moltissimo gli animali, ma nessuno dei due ha un animale domestico. A Mateo piacciono moltissimo i cani e a Lucía i gatti. Diego invece ha un animale domestico: un gatto. Gioca spesso con il suo gatto e gli dà da mangiare ogni giorno. E tu hai un animale domestico?'
    note: 'Contrappone l''amare gli animali all''averne davvero uno: è lo scopo comunicativo dell''obiettivo.'
    glosses:
      encantan: adorare / piacere molto
      dos: entrambi
      animales: animali
      ninguno: entrambi
      mascota: animale domestico
      perros: cani
      gatos: gatti
      gato: gatto
      juega: gioca
      da: dà
      todos: ogni
      comer: cibo
  es.a1.unit53.lesson05.teach.diego_juega_a:
    title: Diego gioca spesso con il suo gatto
    gloss: Diego gioca spesso con il suo gatto.
    note: Riprende *a menudo* (spesso), già visto in unità precedenti.
  es.a1.unit53.lesson05.teach.me_encantan_los:
    title: Adoro i cani. Non ho un animale domestico.
    gloss: Adoro i cani. Non ho un animale domestico.
    note: Una risposta modello di due frasi, da riutilizzare per l'esercizio di scrittura dell'unità.
  es.a1.unit53.lesson06.teach.elena_nina_tu:
    title: Elena chiede a Nina
    gloss: 'Elena: Nina, anche tu hai un animale domestico?'
  es.a1.unit53.lesson06.teach.nina_si_tengo:
    title: Nina ha un uccellino di nome Pico
    gloss: 'Nina: Sì, ho un uccellino. Si chiama Pico.'
    note: '*Se llama* ("si chiama") riprende l''espressione per il nome della primissima unità.'
  es.a1.unit53.lesson06.teach.mateo_que_bien:
    title: Reazione di Mateo
    gloss: 'Mateo: Che bello! Che cosa fai con lui ogni giorno?'
  es.a1.unit53.lesson06.teach.nina_le_doy:
    title: Nina gli dà da mangiare ogni giorno
    gloss: 'Nina: Gli do da mangiare ogni giorno.'
  es.a1.unit53.lesson06.teach.mateo_a_mi:
    title: Anche a Mateo piacciono gli uccelli
    gloss: 'Mateo: Anch''io adoro gli uccelli.'
  es.a1.unit53.lesson06.teach.elena_que_bien:
    title: Elena chiude la conversazione
    gloss: 'Elena: Che bello! A tutti e tre noi piacciono moltissimo gli animali!'
    note: Chiude il cerchio sulle informazioni sugli animali dei tre personaggi di questa unità.
