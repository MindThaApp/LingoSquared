  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Spagnolo A1
  description: 'Parlare del proprio lavoro: la storia di Elena e Mateo continua durante una pausa della lezione del laboratorio del 22 luglio. I due parlano dei loro lavori, Mateo contabile ed Elena insegnante, e si accorgono di preferire entrambi cucinare insieme.'
