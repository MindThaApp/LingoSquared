teaching:
  es.a1.unit13.lesson01.teach.el_trabajo:
    title: Il lavoro
    gloss: il lavoro
    note: '*Trabajo* è maschile ed è anche la forma verbale "io lavoro".'
    example_gloss: Mi piace il mio lavoro.
  es.a1.unit13.lesson01.teach.la_oficina:
    title: L'ufficio
    gloss: l'ufficio
    note: '*Oficina* è femminile.'
    example_gloss: Lavoro in un ufficio.
  es.a1.unit13.lesson01.teach.el_escritorio:
    title: La scrivania
    gloss: la scrivania
    note: '*Escritorio* è maschile.'
    example_gloss: Questa è la mia scrivania.
  es.a1.unit13.lesson01.teach.la_escuela:
    title: La scuola
    gloss: la scuola
    note: '*Escuela* è femminile.'
    example_gloss: Insegno in una scuola.
  es.a1.unit13.lesson01.teach.los_estudiantes:
    title: Gli studenti
    gloss: gli studenti
    note: '*Estudiante* ha la stessa forma per un uomo e per una donna; il plurale *los estudiantes* vale anche per un gruppo misto.'
    example_gloss: Ho venti studenti.
  es.a1.unit13.lesson02.teach.trabajar:
    title: Lavorare
    gloss: lavorare
    note: L'infinito del verbo, usato in costruzioni come *me gusta trabajar* (mi piace lavorare).
  es.a1.unit13.lesson02.teach.soy_contador:
    title: Dire che sei contabile
    gloss: Sono un contabile.
    note: 'Per i mestieri si usa *ser* + professione, senza articolo: vedi la nota di grammatica qui sotto.'
  es.a1.unit13.lesson02.teach.soy_profesora:
    title: Dire che sei insegnante (femminile)
    gloss: Sono un'insegnante.
    note: '*Profesora* è il femminile di *profesor*.'
  es.a1.unit13.lesson02.teach.enseno_en_una_escuela:
    title: Dire dove insegni
    gloss: Insegno in una scuola.
    note: '*Enseño* (insegno) è la prima persona singolare di *enseñar*, qui con *escuela* (scuola).'
  es.a1.unit13.lesson02.teach.contador_vs_profesora_note:
    title: I mestieri con ser
    gloss: Come lo spagnolo indica una professione senza articolo.
    note: Vedi il testo della scheda.
    target_text: 'Per i mestieri si usa *ser* + professione, senza articolo: *soy contador* (sono contabile), non *soy un contador*. *Contador* ha il femminile *contadora*; *profesor/profesora* è una coppia maschile/femminile dello stesso tipo per "insegnante" (si aggiunge *-a* per una donna).'
  es.a1.unit13.lesson03.teach.en_que_trabajas:
    title: Chiedere il lavoro a qualcuno
    gloss: Che lavoro fai?
    note: '*¿En qué trabajas?* (letteralmente "in che cosa lavori?") è il modo abituale di chiedere a qualcuno che lavoro fa.'
  es.a1.unit13.lesson03.teach.trabajo_en_una_oficina_soy_contador:
    title: Rispondere con il tuo lavoro
    gloss: Lavoro in un ufficio. Sono un contabile.
    note: Unisce *oficina* e *soy contador* in una risposta naturale di due frasi.
  es.a1.unit13.lesson04.teach.me_gusta_mi_trabajo:
    title: Dire che ti piace il tuo lavoro
    gloss: Mi piace il mio lavoro.
    note: Riprende la costruzione di *gustar* con *mi trabajo* (il mio lavoro).
  es.a1.unit13.lesson04.teach.pero_prefiero_cocinar:
    title: Esprimere una preferenza
    gloss: Ma preferisco cucinare.
    note: '*Prefiero* (preferisco) è una forma che hai già incontrato; *cocinar* (cucinare) è l''infinito dell''attività al centro di tutta questa storia.'
  es.a1.unit13.lesson04.teach.los_dos_preferimos_esto:
    title: Dire che preferite entrambi questo
    gloss: Preferiamo entrambi questo.
    note: '*Preferimos* è la forma di *nosotros* di *preferir*, usata quando Elena e Mateo sono d''accordo.'
  es.a1.unit13.lesson05.teach.trabajos_reading:
    title: Leggere dei loro lavori
    gloss: Mateo lavora in un ufficio a Londra. È contabile. Elena insegna in una scuola. È insegnante e ha venti studenti. A entrambi piace il proprio lavoro, ma preferiscono cucinare insieme il martedì.
    note: Un breve riassunto dei lavori di Mateo ed Elena.
    glosses:
      trabaja: lavora (da trabajar)
      oficina: ufficio
      contador: contabile
      enseña: insegna (da enseñar)
      escuela: scuola
      profesora: insegnante
      tiene: ha (da tener)
      veinte: venti
      estudiantes: studenti
      gusta: piace (da gustar)
      trabajo: lavoro
      prefieren: preferiscono (da preferir)
      cocinar: cucinare
      juntos: insieme
      martes: i martedì
  es.a1.unit13.lesson05.teach.a_los_dos_les_gusta_note:
    title: A los dos les gusta
    gloss: Come gustar si estende a un complemento indiretto plurale.
    note: Vedi il testo della scheda.
    target_text: '*A los dos les gusta* (a entrambi piace) estende la costruzione di *gustar* (che già conosci) a un complemento indiretto plurale: *les* (a loro) invece di *me/te* (a me/a te).'
  es.a1.unit13.lesson06.teach.line01:
    title: Chiedere a Mateo del suo lavoro
    gloss: Elena chiede a Mateo che lavoro fa.
    note: La domanda che hai imparato prima, ora rivolta a Mateo per nome.
  es.a1.unit13.lesson06.teach.line02:
    title: Rispondere con il suo lavoro
    gloss: Mateo dice che lavora in un ufficio come contabile.
    note: 'La risposta completa che hai imparato prima: dove lavora, poi che lavoro fa.'
  es.a1.unit13.lesson06.teach.line03:
    title: Reagire e dire il proprio lavoro
    gloss: Elena trova la cosa interessante e racconta di essere insegnante.
    note: '*Interesante* (interessante) è un nuovo cognato trasparente; il resto, *soy profesora* e *enseño en una escuela*, lo conosci già.'
  es.a1.unit13.lesson06.teach.line04:
    title: Chiedile se le piace insegnare
    gloss: Mateo le chiede se le piace insegnare.
    note: '*¿Te gusta enseñar?* unisce la struttura già vista della domanda con *gustar* all''infinito *enseñar*.'
  es.a1.unit13.lesson06.teach.line05:
    title: Conferma e aggiungi una preferenza
    gloss: Elena dice che le piace molto, ma che preferisce cucinare con lui il martedì.
    note: '*Contigo* (con te) è una nuova forma in cui preposizione e pronome si fondono; *los martes* (il martedì) usa l''articolo plurale per un giorno che torna ogni settimana.'
  es.a1.unit13.lesson06.teach.line06:
    title: Dì che la pensi allo stesso modo
    gloss: Mateo dice che anche a lui piace il suo lavoro, ma preferisce cucinare.
    note: '*A mí también* (anche a me) è la struttura per dire che si è d''accordo con *gustar*: *a mí* mette in rilievo chi prova il gusto.'
  es.a1.unit13.lesson06.teach.line07:
    title: Trai la conclusione
    gloss: Elena conclude che entrambi preferiscono questo (cucinare insieme).
    note: '*Entonces* (quindi, allora) è un nuovo connettore logico; il resto è *los dos preferimos esto* (preferiamo questo, tutti e due).'
  es.a1.unit13.lesson06.teach.line08:
    title: Conferma con entusiasmo
    gloss: 'Mateo è d''accordo: assolutamente.'
    note: '*Definitivamente* (assolutamente, decisamente) è un nuovo avverbio trasparente che chiude la scena.'
