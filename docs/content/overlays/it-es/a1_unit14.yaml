    example_gloss: L'appartamento ha un bagno.
  es.a1.unit14.lesson01.teach.la_sala:
    title: Il soggiorno
    gloss: il soggiorno
    note: '*Sala* è femminile.'
    example_gloss: Guardiamo la televisione in soggiorno.
  es.a1.unit14.lesson01.teach.cocina_ambiguity_note:
    title: 'Cocina: stanza o cucinare'
    gloss: Che differenza c'è tra la cocina (la cucina come stanza) e cocinar (cucinare).
    note: Vedi il testo della scheda.
    target_text: '*La cocina* qui significa «la cucina» (la stanza), un senso diverso da *cocina*/*cocinar* (il cucinare / cucinare) usati finora in tutta la storia per il laboratorio. Il contesto aiuta a distinguerli: in *taller de cocina* indica l''arte del cucinare; *la cocina* di una casa o di un appartamento è la stanza; *cocinar* è il verbo «cucinare».'
  es.a1.unit14.lesson02.teach.alquilar:
    title: Affittare
    gloss: affittare
    note: Il verbo all'infinito, usato in *quiero alquilar* (voglio affittare).
  es.a1.unit14.lesson02.teach.el_edificio:
    title: L'edificio
    gloss: il palazzo
    note: '*Edificio* è maschile.'
    example_gloss: Il palazzo è vicino al parco.
  es.a1.unit14.lesson02.teach.desocupado:
    title: Libero / disponibile
    gloss: libero / disponibile
    note: '*Desocupado* si dice di un immobile in affitto che al momento è vuoto e disponibile.'
  es.a1.unit14.lesson02.teach.grande:
    title: Grande
    gloss: grande
    note: '*Grande* non cambia al femminile: ha un''unica forma per maschile e femminile (a differenza degli aggettivi in -o/-a).'
  es.a1.unit14.lesson02.teach.pequeno:
    title: Piccolo
    gloss: piccolo
    note: '*Pequeño/pequeña*, il contrario di *grande*.'
  es.a1.unit14.lesson03.teach.cuantos_dormitorios_tiene:
    title: Chiedere quante camere da letto ci sono
    gloss: Quante camere da letto ha?
    note: '*¿Cuántos...tiene?* (quante... ha?) è una struttura abituale per chiedere le caratteristiche di un luogo.'
  es.a1.unit14.lesson03.teach.tiene_dos_dormitorios_y_una_cocina_grande:
    title: Descrivere le camere da letto e la cucina
    gloss: Ha due camere da letto e una cucina grande.
    note: '*Tiene* (ha) + quantità + sostantivo, qui con *dormitorio*, *cocina* e *grande*.'
  es.a1.unit14.lesson04.teach.quiero_alquilar_un_apartamento_con_una_cocina_grande:
    title: Dire cosa cerchi in una casa
    gloss: Voglio affittare un appartamento con una cucina grande.
    note: '*Quiero* (voglio) + infinito *alquilar*, con *con* (con) per introdurre la caratteristica desiderata.'
  es.a1.unit14.lesson04.teach.asi_puedes_cocinar_en_casa:
    title: Spiegare il vantaggio
    gloss: Così puoi cucinare anche a casa.
    note: '*Así* (così) + *puedes* (puoi) + infinito collega l''obiettivo della casa al tema della cucina presente in tutta la storia.'
  es.a1.unit14.lesson05.teach.anuncio_reading:
    title: Leggere un annuncio di appartamento
    gloss: Appartamento libero in un edificio vicino al parco. Ha due camere da letto, un bagno, un soggiorno e una cucina grande. È perfetto per chi vuole cucinare a casa.
    note: Un annuncio realistico, come quelli dei giornali.
    glosses:
      desocupado: libero / disponibile
      edificio: edificio
      cerca: vicino
      parque: parco
      Tiene: ha (da tener)
      dormitorios: camere da letto
      baño: bagno
      sala: soggiorno
      grande: grande
      perfecto: perfetto
      quiere: vuole (da querer)
      cocinar: cucinare
  es.a1.unit14.lesson05.teach.para_alguien_que_note:
    title: Para alguien que...
    gloss: Come una frase relativa descrive l'inquilino ideale.
    note: Vedi il testo della scheda.
    target_text: '*Para alguien que quiere* (per qualcuno che vuole) usa *alguien* (qualcuno) + *que* (che) per introdurre una relativa: uno schema frequente negli annunci che descrivono l''inquilino ideale.'
  es.a1.unit14.lesson06.teach.line01:
    title: Esporre il problema e l'obiettivo
    gloss: Mateo dice che la sua cucina è molto piccola e che vuole affittare un appartamento con una cucina grande.
    note: Unisce *mi cocina es muy pequeña* (la mia cucina è molto piccola) all'obiettivo *quiero alquilar un apartamento con una cocina grande* (voglio affittare un appartamento con una cucina grande).
  es.a1.unit14.lesson06.teach.line02:
    title: Proporre di guardare gli annunci
    gloss: 'Elena propone di guardare il giornale: ci sono molti annunci.'
    note: '*El periódico* (il giornale) e *anuncios* (annunci) sono parole nuove, tipiche degli annunci economici.'
  es.a1.unit14.lesson06.teach.line03:
    title: Trovare un annuncio
    gloss: Mateo trova un edificio con un appartamento libero.
    note: '*Este edificio* (questo edificio) e *desocupado* (libero, disponibile).'
  es.a1.unit14.lesson06.teach.line04:
    title: Chiedere delle camere da letto
    gloss: Elena chiede quante camere da letto ha.
    note: La domanda abituale per chiedere le caratteristiche di un luogo.
  es.a1.unit14.lesson06.teach.line05:
    title: Rispondere con i dettagli
    gloss: Mateo dice che ha due camere da letto e una cucina grande.
    note: '*Tiene* (ha) + quantità + sostantivo.'
  es.a1.unit14.lesson06.teach.line06:
    title: Confermare altre caratteristiche
    gloss: Elena è entusiasta e osserva che ha anche un bagno e un soggiorno.
    note: '*Baño* (bagno) e *sala* (soggiorno) completano l''elenco delle stanze; *también* (anche) va alla fine.'
  es.a1.unit14.lesson06.teach.line07:
    title: Decidere di chiamare
    gloss: Mateo decide di chiamare l'agenzia oggi stesso.
    note: '*Voy a llamar* (sto per chiamare) + *hoy mismo* (oggi stesso); *la agencia* è l''agenzia immobiliare.'
  es.a1.unit14.lesson06.teach.line08:
    title: Approvare e chiudere la scena
    gloss: Elena approva e fa notare che potrà cucinare anche a casa.
    note: '*Así puedes cocinar en casa también* (così puoi cucinare anche a casa) chiude la scena.'
