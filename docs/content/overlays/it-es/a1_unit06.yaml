teaching:
  es.a1.unit06.lesson01.teach.sandwich_ensalada:
    title: Panino, insalata
    gloss: panino, insalata
    note: '*Sándwich* è un prestito dall''inglese, scritto con l''accento per indicare la sillaba tonica.'
    example_gloss:
    - Voglio un panino.
    - L'insalata ha il pomodoro.
  es.a1.unit06.lesson01.teach.sopa:
    title: Zuppa
    gloss: zuppa
    note: '*Sopa* è femminile, come la maggior parte dei nomi spagnoli che terminano in -a.'
    example_gloss: La zuppa è molto buona.
  es.a1.unit06.lesson01.teach.agua_cafe:
    title: Acqua, caffè
    gloss: acqua, caffè
    note: '*Agua* è femminile, ma al singolare prende l''articolo maschile *el* (non *la*) perché inizia con una *a* tonica: è una vera irregolarità dello spagnolo, non un errore.'
    example_gloss:
    - Vorrei dell'acqua, per favore.
    - Per me, un caffè.
  es.a1.unit06.lesson02.teach.quiero_un_sandwich:
    title: Voglio un panino
    gloss: Voglio un panino.
    note: '*Quiero* (voglio) è la prima persona singolare di *querer*, un verbo nuovo di questa unità.'
  es.a1.unit06.lesson02.teach.para_mi_un_cafe:
    title: Per me, un caffè
    gloss: Per me, un caffè.
    note: '*Para mí* (per me) è un''altra espressione comune per ordinare: nomina ciò che si vuole senza ripetere il verbo. Vedi la nota di grammatica seguente.'
  es.a1.unit06.lesson02.teach.que_quieres_comer:
    title: Chiedere cosa vuole mangiare qualcuno
    gloss: Che cosa vuoi mangiare?
    note: '*Quieres* è la forma di *tú* di *querer*, il registro informale che si usa con gli amici.'
  es.a1.unit06.lesson02.teach.quiero_vs_para_mi_note:
    title: Quiero o Para mí
    gloss: Due modi ugualmente naturali di ordinare.
    note: '*Quiero un café* e *Para mí, un café* vanno entrambi bene per ordinare.'
    target_text: '*Quiero* ("voglio") e *Para mí* ("per me", detto prima di nominare ciò che si ordina) sono entrambi modi naturali e ugualmente cortesi di ordinare in un contesto informale: nessuno dei due è più corretto dell''altro.'
  es.a1.unit06.lesson03.teach.el_menu:
    title: Il menù
    gloss: il menù
    note: '*Menú* ha l''accento scritto perché la sillaba tonica è l''ultima.'
    example_gloss: Possiamo vedere il menù?
  es.a1.unit06.lesson03.teach.podemos_ver_el_menu:
    title: Chiedere di vedere il menù
    gloss: Possiamo vedere il menù?
    note: '*Podemos* (possiamo) è la prima persona plurale di *poder*, un verbo nuovo di questa unità.'
  es.a1.unit06.lesson03.teach.aqui_tiene:
    title: Ecco a Lei
    gloss: Ecco a Lei.
    note: '*Aquí tiene* è la formula standard con cui il cameriere porge qualcosa al cliente, con la forma di cortesia *usted* anche in uno scambio altrimenti informale: è una formula di cortesia fissa, non un cambio di registro.'
  es.a1.unit06.lesson03.teach.buen_provecho:
    title: Buon appetito
    gloss: Buon appetito
    note: '*Buen provecho* è ciò che si dice prima che qualcuno inizi a mangiare, e corrisponde all''italiano "buon appetito".'
    example_gloss: Ecco qui. Buon appetito.
  es.a1.unit06.lesson04.teach.el_postre:
    title: Il dessert
    gloss: dolce
    note: '*Postre* è maschile.'
    example_gloss: Come dolce, voglio la torta.
  es.a1.unit06.lesson04.teach.de_postre_quiero_pastel:
    title: Ordinare il dessert
    gloss: Come dolce, voglio la torta.
    note: '*De postre* (come dessert) introduce ciò che si ordina come ultima portata, con lo stesso schema di *para mí*, che introduce l''ordinazione del piatto principale.'
  es.a1.unit06.lesson04.teach.la_cuenta_por_favor:
    title: Chiedere il conto
    gloss: Il conto, per favore.
    note: '*La cuenta* (il conto) è il modo standard per chiedere di pagare alla fine del pasto.'
  es.a1.unit06.lesson05.teach.menu_reading:
    title: Leggere il menu
    gloss: 'Menu: panino, cinque. Insalata, otto. Zuppa, tre. Caffè o acqua, incluso. Dessert: torta.'
    note: Un menu stampato realistico, che riprende il lessico del cibo di questa unità con i prezzi.
    glosses:
      Menú: menu
      sándwich: panino
      Ensalada: insalata
      Sopa: zuppa
      Café: caffè
      agua: acqua
      incluido: incluso
      Postre: dolce
      pastel: torta
  es.a1.unit06.lesson05.teach.incluido_note:
    title: Incluido (incluso)
    gloss: Che cosa significa quando una bevanda è indicata come inclusa.
    note: '*Incluido* = incluso, senza costi aggiuntivi.'
    target_text: '*Incluido* (compreso) indica che una bevanda è inclusa nel pasto, senza costi aggiuntivi.'
  es.a1.unit06.lesson06.teach.line01:
    title: Salutare e chiedere l'ordinazione
    gloss: Il cameriere saluta Elena e Mateo e chiede che cosa vogliono mangiare.
    note: '*Buenas tardes* (buon pomeriggio) si usa da mezzogiorno in poi, quindi va bene all''ora di pranzo.'
  es.a1.unit06.lesson06.teach.line02:
    title: Elena ordina
    gloss: Elena ordina un'insalata e dell'acqua, per favore.
    note: '*Una ensalada y agua* = un''insalata e acqua.'
  es.a1.unit06.lesson06.teach.line03:
    title: Mateo ordina
    gloss: Mateo ordina un panino e un caffè per sé.
    note: Usa *Para mí* invece di ripetere *Quiero*.
  es.a1.unit06.lesson06.teach.line04:
    title: Chiedere del dessert
    gloss: Il cameriere approva e chiede se vogliono un dessert.
    note: '*¿Algo de postre?* (qualcosa come dessert?) è un modo naturale e breve di proporre il dessert.'
  es.a1.unit06.lesson06.teach.line05:
    title: Ordinare un dessert da dividere
    gloss: Elena dice di sì, una torta per tutti e due.
    note: '*Para los dos* (per tutti e due) indica un solo dessert da dividere, una scelta molto naturale nella vita reale.'
  es.a1.unit06.lesson06.teach.line06:
    title: Essere d'accordo e chiedere il conto
    gloss: Mateo è d'accordo e chiede il conto.
    note: '*La cuenta, por favor* = il conto, per favore.'
  es.a1.unit06.lesson06.teach.line07:
    title: Portare il conto
    gloss: Il cameriere porta loro il conto.
    note: '*Aquí tiene* si dice quando si porge qualcosa.'
  es.a1.unit06.lesson06.teach.line08:
    title: Concludere con calore
    gloss: Elena ringrazia il cameriere e dice che si è mangiato molto bene.
    note: '*¡Qué buena comida!* usa lo stesso schema esclamativo *¡Qué ...!* di *¡Qué bien!* e *¡Qué bonito!*.'
