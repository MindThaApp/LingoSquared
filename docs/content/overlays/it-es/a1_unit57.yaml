    title: Chi studia cosa?
    gloss: Diego non lavora soltanto, studia anche. Segue un corso di spagnolo alla scuola di lingue. Ogni settimana impara parole nuove. Lucía fa una formazione alla scuola superiore. Lì studia scienze della salute. A tutti e due piace studiare. E tu, cosa studi o cosa ti piacerebbe imparare?
