    correct_option: Buonasera.
    distractors:
    - Buongiorno.
    - A più tardi.
    accepted_answers:
    - Buonasera.
  es.a1.unit01.lesson02.exercise05.listen_night:
    instruction: Ascolta e seleziona l'espressione che senti.
    correct_option: Buenas noches
    distractors:
    - Buenos días
    - Buenas tardes
    accepted_answers:
