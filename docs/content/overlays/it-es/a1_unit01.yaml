teaching:
  es.a1.unit01.lesson01.teach.usted:
    title: Il «Lei» di cortesia
    gloss: Lei (forma di cortesia)
    note: 'Come l''italiano, lo spagnolo distingue tra forma informale e forma di cortesia, ma con un pronome diverso: usted corrisponde al «Lei» italiano. È utile con un adulto che non conosci o quando serve un tono rispettoso. Anche se significa «Lei», il verbo ha la stessa forma di él o ella, come in italiano il «Lei» richiede la terza persona.'
  es.a1.unit01.lesson01.teach.tu:
    title: Il «tu» informale
    gloss: tu (singolare, informale)
    note: Tú si usa con un amico, un coetaneo, un bambino o un'altra persona quando il rapporto è informale. L'accento distingue il pronome tú dal possessivo tu, che significa «tuo/tua».
  es.a1.unit01.lesson01.teach.como_esta_usted:
    title: Domanda di cortesia sul benessere
    gloss: Come sta?
    note: Está è la forma di usted del verbo estar. Qui lo spagnolo usa estar per lo stato del momento. Cómo ha l'accento perché è una parola interrogativa.
  es.a1.unit01.lesson01.teach.como_estas:
    title: Domanda informale sul benessere
    gloss: Come sta?
    note: 'Estás è la forma di tú del verbo estar. Come in italiano (stai / sta), il verbo cambia a seconda della persona a cui ti rivolgi: lo spagnolo passa da está a estás.'
  es.a1.unit01.lesson01.teach.bien_gracias:
    title: Una risposta breve
    gloss: Bene, grazie.
    note: In spagnolo si può rispondere solo con bien, senza ripetere soggetto o verbo.
  es.a1.unit01.lesson01.teach.muy_bien:
    title: Una risposta positiva
    gloss: Molto bene, grazie.
    note: Muy rafforza bien e non cambia forma.
  es.a1.unit01.lesson01.teach.and_usted:
    title: Restituire la domanda di cortesia
    gloss: E Lei?
    note: Mantieni usted quando restituisci una domanda posta in modo rispettoso.
  es.a1.unit01.lesson01.teach.and_tu:
    title: Restituire la domanda informale
    gloss: E Lei?
    note: Usa tú quando lo scambio è informale. L'accento scritto è importante perché tu senza accento significa «tuo/tua».
  es.a1.unit01.lesson02.teach.hola:
    title: Saluto per tutte le occasioni
    gloss: ciao; salve
    note: Hola va bene a qualsiasi ora del giorno, sia in situazioni formali sia informali.
  es.a1.unit01.lesson02.teach.buenos_dias:
    title: Saluto del mattino
    gloss: buongiorno
    note: Come in italiano, i nomi spagnoli hanno un genere grammaticale. Días è maschile plurale, quindi l'aggettivo è buenos.
  es.a1.unit01.lesson02.teach.buenas_tardes:
    title: Saluto del pomeriggio
    gloss: buon pomeriggio
    note: Tardes è femminile plurale, quindi buenas concorda con esso. Il passaggio da buenos a buenas è una concordanza grammaticale, non un cambio di cortesia.
  es.a1.unit01.lesson02.teach.buenas_noches:
    title: Saluto della sera o della notte
    gloss: buonasera; buonanotte
    note: Noches è femminile plurale e quindi richiede buenas. L'espressione può servire per salutare di sera o per congedarsi prima di dormire.
  es.a1.unit01.lesson02.teach.adios:
    title: Congedo diretto
    gloss: arrivederci; addio
    note: Adiós è neutro, ma può suonare più definitivo di un'espressione come «a dopo».
  es.a1.unit01.lesson02.teach.hasta_luego:
    title: A più tardi
    gloss: a dopo; a più tardi
    note: Hasta luego è un congedo convenzionale e non va letto parola per parola.
  es.a1.unit01.lesson02.teach.nos_vemos:
    title: Congedo amichevole
    gloss: ci vediamo
    note: Letteralmente, nos vemos equivale a «ci vediamo».
  es.a1.unit01.lesson02.teach.good_day:
    title: Augurio di congedo cortese
    gloss: Le auguro una buona giornata.
    note: Tenga è la forma di usted usata in questo augurio cortese. Buen è la forma abbreviata del maschile singolare di bueno davanti a día.
  es.a1.unit01.lesson03.teach.formal_name_question:
    title: Chiedere il nome in modo formale
    gloss: Come si chiama?
    note: Lo spagnolo lo esprime più o meno come «come si chiama Lei», con un verbo riflessivo come in italiano. Se si abbina alla forma di cortesia usted, con il verbo llama.
  es.a1.unit01.lesson03.teach.my_name_lucia:
    title: Dire il proprio nome
    gloss: Mi chiamo Lucía.
    note: Me llamo significa letteralmente «mi chiamo», come in italiano. La desinenza del verbo indica già chi parla, quindi lo spagnolo di norma omette yo, proprio come l'italiano omette «io».
  es.a1.unit01.lesson03.teach.informal_name_question:
    title: Chiedere il nome in modo informale
    gloss: Come si chiama?
    note: Te si usa con il tú informale e llamas ha la desinenza -as della seconda persona. Confronta se llama (formale) con te llamas (informale).
  es.a1.unit01.lesson03.teach.i_am_diego:
    title: Presentarsi con ser
    gloss: Sono Diego.
    note: Soy è la prima persona singolare di ser. Lo spagnolo usa ser per l'identità. A differenza dell'italiano, che ha un solo verbo «essere» (e «stare» per altri usi), lo spagnolo distribuisce gli usi di «essere» tra ser e estar.
  es.a1.unit01.lesson03.teach.mucho_gusto:
    title: Piacere di conoscere qualcuno
    gloss: Piacere.
    note: Mucho gusto è un'espressione fissa e molto diffusa. A differenza di aggettivi come encantado o encantada, non cambia in base al genere di chi parla.
  es.a1.unit01.lesson03.teach.igualmente:
    title: Ricambiare il sentimento
    gloss: Altrettanto.
    note: Igualmente è una risposta breve a Mucho gusto.
  es.a1.unit01.lesson03.teach.este_carlos:
    title: Presentare un uomo
    gloss: Questo è Carlos.
    note: 'Come in italiano («questo/questa»), lo spagnolo distingue il genere: este si usa quando la persona o il nome indicato è grammaticalmente maschile.'
  es.a1.unit01.lesson03.teach.esta_ana:
    title: Presentare una donna
    gloss: Questa è Ana.
    note: Usa esta per un referente femminile. Qui esta non ha accento; está con l'accento è una forma di estar e significa «è» o «si trova».
  es.a1.unit01.lesson04.teach.formal_origin_question:
    title: Chiedere la provenienza in modo formale
    gloss: Di dov'è Lei?
    note: Es è la forma di usted di ser. Lo spagnolo usa ser, non estar, per la provenienza. Dónde ha l'accento in una domanda diretta.
  es.a1.unit01.lesson04.teach.from_mexico:
    title: Dire la propria provenienza
    gloss: Sono del Messico.
    note: Soy è la forma di yo di ser. Il soggetto yo non serve perché soy identifica già chi parla.
  es.a1.unit01.lesson04.teach.informal_origin_question:
    title: Chiedere la provenienza in modo informale
    gloss: Di dov'è Lei?
    note: Eres è la forma di tú di ser. Confronta la forma di cortesia es (usted) con quella informale eres, come in italiano «è» e «sei».
  es.a1.unit01.lesson04.teach.from_colombia:
    title: Un'altra indicazione di provenienza
    gloss: Sono della Colombia.
    note: Usa soy de seguito da un luogo per indicare la provenienza.
  es.a1.unit01.lesson04.teach.live_london:
    title: Dire dove si vive
    gloss: Vivo a Londra.
    note: Vivo è la forma di yo di vivir. Lo spagnolo non ha bisogno di yo perché la desinenza -o indica chi parla, come in italiano.
  es.a1.unit01.lesson04.teach.speak_spanish:
    title: Chiedere in modo formale se parla spagnolo
    gloss: Parla spagnolo?
    note: Come in italiano, questa domanda sì/no non richiede un ausiliare. Habla è la forma di usted; a segnalare la domanda sono l'intonazione e i punti interrogativi.
  es.a1.unit01.lesson04.teach.yes_a_little:
    title: Capacità limitata
    gloss: Sì, un po'.
    note: Sí con l'accento significa «sì». Si senza accento significa «se», anche se qui la grafia senza accento è accettata come variante di digitazione a livello A1.
  es.a1.unit01.lesson04.teach.still_learning:
    title: Descrivere una situazione in corso
    gloss: Sto ancora imparando.
    note: Estoy è la forma di yo di estar. Qui estar esprime un'azione in corso, mentre soy in Soy de Colombia esprime provenienza o identità. L'italiano usa «sto» per l'azione in corso e «sono» per la provenienza, in modo simile.
  es.a1.unit01.lesson05.teach.formal_first_time:
    title: Chiedere in modo formale di una prima visita
    gloss: È la sua prima volta qui?
    note: Su significa «Suo/Sua» quando ti rivolgi a qualcuno con usted. Come in italiano («tuo» e «Suo»), su e tu mantengono la distinzione tra forma di cortesia e forma informale.
  es.a1.unit01.lesson05.teach.informal_first_time:
    title: Chiedere in modo informale di una prima visita
    gloss: È la sua prima volta qui?
    note: Tu senza accento è il possessivo informale «tuo/tua». Confrontalo con il pronome tú, che ha l'accento.
  es.a1.unit01.lesson05.teach.first_time_answer:
    title: Confermare che è la prima visita
    gloss: Sì, è la mia prima volta.
    note: Primera è femminile perché concorda con vez, come in italiano «prima» concorda con «volta».
  es.a1.unit01.lesson05.teach.cooking_workshop:
    title: Indicare la propria destinazione
    gloss: Sono qui per il laboratorio di cucina.
    note: Vengo è la forma di yo di venir e significa «vengo». Al è la contrazione obbligatoria di a + el.
  es.a1.unit01.lesson05.teach.me_too:
    title: Condividere la stessa situazione
    gloss: Anch'io.
    note: Yo también è utile quando ciò che dice l'altra persona vale anche per te.
  es.a1.unit01.lesson05.teach.like_cooking:
    title: Chiedere di un interesse
    gloss: Ti piace cucinare?
    note: 'Gustar funziona come «piacere»: te indica la persona a cui piace qualcosa, mentre cocinar è ciò che piace. Il verbo resta gusta perché l''azione è trattata come singolare.'
  es.a1.unit01.lesson05.teach.yes_very_much:
    title: Esprimere grande interesse
    gloss: Sì, molto.
    note: Mucho risponde alla domanda sul grado e qui non cambia forma.
  es.a1.unit01.lesson05.teach.thats_good:
    title: Reazione positiva
    gloss: Che bello!
    note: In questa esclamazione Qué porta l'accento. Introduce una reazione positiva e non una domanda.
  es.a1.unit01.lesson06.teach.line01:
    title: L'inizio dell'incontro
    gloss: Elena saluta Mateo e gli chiede se è la prima volta che viene qui.
    note: Entrambi usano il tú informale perché si incontrano da pari nella stessa attività.
  es.a1.unit01.lesson06.teach.line02:
    title: L'inizio dell'incontro, risposta
    gloss: Mateo dice di sì, è la sua prima volta, e spiega che è qui per il laboratorio di cucina.
    note: Vengo al taller indica il motivo per cui si è lì, usando il presente per una situazione in corso.
  es.a1.unit01.lesson06.teach.line03:
    title: Scambiarsi i nomi
    gloss: Elena dice che anche per lei è la prima volta, si presenta e chiede il nome di Mateo.
    note: Me llamo è un modo naturale per dire il proprio nome; come in italiano, in spagnolo di norma si omette yo perché la forma del verbo indica già chi parla.
  es.a1.unit01.lesson06.teach.line04:
    title: Scambiarsi i nomi, risposta
    gloss: Mateo dice il suo nome e dice che è lieto di conoscerla.
    note: Soy è un altro modo naturale per dire il proprio nome, con ser al posto del riflessivo llamarse.
  es.a1.unit01.lesson06.teach.line05:
    title: Chiedere la provenienza
    gloss: Elena ricambia la cortesia (altrettanto) e chiede a Mateo di dove è.
    note: De dónde eres chiede la provenienza usando il tú informale.
  es.a1.unit01.lesson06.teach.line06:
    title: Chiedere la provenienza, risposta
    gloss: Mateo è colombiano ma vive a Londra, poi fa la stessa domanda a Elena.
    note: Soy de esprime la provenienza, mentre vivo en esprime dove si abita ora. Pero collega il contrasto tra queste due informazioni.
  es.a1.unit01.lesson06.teach.line07:
    title: Parlare di un interesse
    gloss: Elena dice di essere spagnola e chiede a Mateo se gli piace cucinare.
    note: Soy indica la provenienza, con lo stesso schema che Mateo ha appena usato.
  es.a1.unit01.lesson06.teach.line08:
    title: Parlare di un interesse, risposta
    gloss: Mateo dice che gli piace molto cucinare ma che sta ancora imparando.
    note: 'Estoy aprendiendo descrive un''azione in corso, come «sto imparando» in italiano: estar + gerundio.'
  es.a1.unit01.lesson06.teach.line09:
    title: Chiudere la conversazione
    gloss: Elena dice che anche lei sta imparando e che si vedono dentro.
    note: Nos vemos indica un incontro previsto più tardi, e dentro specifica dove.
  es.a1.unit01.lesson06.teach.line10:
    title: Chiudere la conversazione, risposta
    gloss: Mateo è d'accordo e conferma che si vedono.
    note: Sí conferma semplicemente la proposta di Elena prima di ripetere nos vemos.
exercises:
  es.a1.unit01.lesson01.exercise01.select_formal_pronoun:
    instruction: Quale forma corrisponde al «Lei» di cortesia?
    correct_option: usted
    distractors:
    - tú
    - tu
    accepted_answers:
    - usted
    feedback: Usted è la forma singolare di cortesia e richiede il verbo alla terza persona.
  es.a1.unit01.lesson01.exercise02.select_informal_pronoun:
    instruction: Quale forma si usa per rivolgersi in modo informale a un amico o a un pari?
    correct_option: tú
    distractors:
    - usted
    - tu
    accepted_answers:
    - tú
    feedback: Il pronome si scrive tú; tu senza accento significa «il tuo / la tua».
  es.a1.unit01.lesson01.exercise03.listen_formal_question:
    instruction: Ascolta e seleziona la frase che senti.
    correct_option: ¿Cómo está usted?
    distractors:
    - ¿Cómo estás?
    - ¿Y usted?
    accepted_answers:
    - ¿Cómo está usted?
    - Como esta usted
  es.a1.unit01.lesson01.exercise04.listen_informal_question:
    instruction: Scrivi la domanda informale che senti.
    accepted_answers:
    - ¿Cómo estás?
    - Cómo estás
    - Como estas
  es.a1.unit01.lesson01.exercise05.order_formal_question:
    instruction: Metti in ordine la domanda formale.
    correct_response:
    - Cómo
    - está
    - usted
  es.a1.unit01.lesson01.exercise06_choose_formal_return:
    instruction: Seleziona la domanda di ritorno che mantiene il registro di cortesia.
    correct_option: ¿Y usted?
    distractors:
    - ¿Y tú?
    - ¿Cómo estás?
    accepted_answers:
    - ¿Y usted?
    - Y usted
  es.a1.unit01.lesson01.exercise07_choose_informal_return:
    instruction: Seleziona la domanda di ritorno adatta a un amico o a un pari.
    correct_option: ¿Y tú?
    distractors:
    - ¿Y usted?
    - ¿Cómo está usted?
    accepted_answers:
    - ¿Y tú?
    - Y tú
    - Y tu
  es.a1.unit01.lesson01.exercise08.check_informal_agreement:
    instruction: Correggi la domanda informale.
    accepted_answers:
    - ¿Cómo estás?
    - Cómo estás
    - Como estas
    - ¿Cómo estás tú?
    - Como estas tu
    feedback: Con tú serve estás; está si usa con usted.
  es.a1.unit01.lesson01.exercise09.reply_formally:
