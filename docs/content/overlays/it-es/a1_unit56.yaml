    title: Il programma di Diego
    gloss: 'Diego: Allora io corro. Dopo gioco anche a calcio.'
    note: Riprende *después* (dopo), già visto nell'unità sulla routine quotidiana.
  es.a1.unit56.lesson06.teach.lucia_prefiero_nadar:
    title: Il programma di Lucía
    gloss: 'Lucía: Preferisco nuotare, ma vengo anch''io al parco.'
    note: 'Riprende *prefiero* (preferisco): *Prefiero nadar* ha un infinito dopo il verbo.'
  es.a1.unit56.lesson06.teach.elena_que_bien:
