    gloss: Conosci già el pronóstico del tiempo. Mensaje è qualcosa che puoi inviare (yo envío, él envía) o leggere (yo leo, él lee).
    note: Collega la parola nuova al sostantivo composto già visto nell'unità sul tempo atmosferico.
