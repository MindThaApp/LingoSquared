    title: Buscar e usar vogliono il complemento oggetto diretto
    gloss: 'Buscar e usar prendono l''oggetto direttamente, senza preposizione: busco el pronóstico, uso el móvil.'
    note: '*Buscar* e *usar* prendono entrambi l''oggetto direttamente; la *a* serve solo davanti a persone.'
