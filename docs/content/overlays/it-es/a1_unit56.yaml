    title: Mateo accetta
    gloss: 'Mateo: Buona idea! Cerco le previsioni del tempo.'
    note: Riprende *¡Buena idea!*, già visto nell'unità sui programmi.
  es.a1.unit56.lesson04.teach.mateo_el_sabado:
    title: Mateo controlla il tempo
    gloss: 'Mateo: Sabato c''è il sole!'
    note: '*Hace sol* usa *hacer* per il tempo atmosferico, come nell''unità sul meteo.'
  es.a1.unit56.lesson04.teach.diego_veo_el:
    title: Diego vede il messaggio
    gloss: 'Diego: Vedo il messaggio. A sabato!'
  es.a1.unit56.lesson04.teach.ya_conoces_hasta:
    title: Hasta luego e Hasta + un giorno
    gloss: 'Conosci già ¡Hasta luego! Puoi anche nominare un giorno: ¡Hasta el sábado!, ¡Hasta mañana!'
    note: Estende lo schema di saluto dell'unità sui saluti a un giorno preciso.
  es.a1.unit56.lesson05.teach.elena_llama_a:
    title: Chi usa cosa?
    gloss: Elena chiama Mateo ogni giorno. Usa il cellulare, non un'app. Mateo non ha un computer a casa, ma usa internet sul cellulare. Diego cerca le previsioni del tempo ogni mattina. Poi va a correre. Lucía manda spesso un messaggio a Elena. E tu, usi il cellulare tutti i giorni?
    note: Confronta le abitudini dei quattro personaggi con i dispositivi, come la lettura di confronto dell'unità sullo sport.
