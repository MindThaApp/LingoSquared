course:
  title: 波斯语（伊朗）A1
  description: 波斯语（伊朗）入门：学习庆祝和生日相关词汇（生日、派对、蛋糕、礼物），用已学过的月份和序数词询问并说出自己的生日（*تولدت کِیه؟*），邀请别人参加派对并接受邀请（*میای به مهمونی؟* / *آره، حتماً میام*），通过尼马和萨拉的生日对话学习 *تولدت مبارک*（“生日快乐”），阅读关于尼马生日的短文，最后总结自己喜欢的庆祝活动，并写一条自己的邀请或祝贺信息。
