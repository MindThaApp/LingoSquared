course:
  title: 波斯语（伊朗）A1
  description: 波斯语（伊朗）入门：说出常见宠物和动物（狗、猫、鸟、鱼），询问“你有宠物吗？”，说出宠物的名字并喂养它，描述宠物的颜色和大小，阅读一篇关于 سارا 的猫 پشمک 的短文，以及 سارا 和 نیما 夸赞 پشمک 的结课对话。
