teaching:
  fa.a1.unit23.lesson01.teach.khoshhal_word:
    title: 开心
    gloss: 开心的
    note: خوشحال 的意思是“高兴”。
    example_gloss: 我很开心。
  fa.a1.unit23.lesson01.teach.narahat_word:
    title: 难过
    gloss: 难过
    note: ناراحت 的意思是“难过”。
    example_gloss: 我很伤心。
  fa.a1.unit23.lesson01.teach.hastam_contraction:
    title: 我是（缩略形式）
    gloss: 我是（与形容词缩合）
    note: '*خوشحالم* 是 *خوشحال* + *هستم* 缩合成 *-م*。如果词尾是不发音的 *-ه*，同样的词尾写作 *-ام*，例如 *خسته‌ام*。'
    target_text: خوشحالم = خوشحال + هستم（我很高兴，缩略形式）
  fa.a1.unit23.lesson01.teach.khaste_word:
    title: 累的
    gloss: 疲倦
    note: خسته 的意思是“累”。
    example_gloss: 我累了。
  fa.a1.unit23.lesson02.teach.khoob_nistam_phrase:
    title: 我不好
    gloss: 我不好
    note: خوب نیستم 用 نیستم（هستم 的否定形式）否定了已学过的 خوبم（我很好）。
  fa.a1.unit23.lesson02.teach.goshne_word:
    title: 饿
    gloss: 饿
    note: '*گشنه* 的意思是“饿”。它是 *گرسنه* 的日常口语形式，گرسنه 你在第4单元见过。'
    example_gloss: 我饿了。
  fa.a1.unit23.lesson02.teach.yekam_word:
    title: 有点
    gloss: 有点
    note: یکم 能缓和感受的程度，类似汉语的“有点”“一点儿”。
    example_gloss: 我有点累。
  fa.a1.unit23.lesson03.teach.asabani_word:
    title: 生气
    gloss: 生气
    note: عصبانی 的意思是“生气”。
    example_gloss: 你为什么生气？
  fa.a1.unit23.lesson03.teach.negaran_word:
    title: 担心
    gloss: 担心
    note: نگران 的意思是“担心”。
    example_gloss: 我很担心。
  fa.a1.unit23.lesson03.teach.chera_word:
    title: 为什么
    gloss: 为什么
    note: '*چرا* 的意思是“为什么”；*هستی* 是非正式的“你是”，可以缩合为 *-ی*：*نگران هستی* 变成 *نگرانی*。'
    target_text: چرا（为什么）
  fa.a1.unit23.lesson04.teach.kar_kardam_phrase:
    title: 我工作了
    gloss: 我工作了
    note: کار کردم 字面意思是“工作 我做了”。
  fa.a1.unit23.lesson04.teach.tatile_word:
    title: 放假
    gloss: 放假
    note: تعطیله 的意思是“休息日／假日”。
    example_gloss: 今天放假。
  fa.a1.unit23.lesson04.teach.emrooz_word:
    title: 今天
    gloss: 今天
    note: امروز 的意思是“今天”。
    example_gloss: 我今天很累。
  fa.a1.unit23.lesson04.teach.ziad_word:
    title: 很多
    gloss: 很多
    note: زیاد 的意思是“很多／太多”。
    example_gloss: 我工作了很久。
  fa.a1.unit23.lesson05.teach.sara_name_review:
    title: 萨拉
    gloss: 萨拉
    note: سارا 在第14单元作为角色出现过，这里再次登场。
    example_gloss: 萨拉累了。
  fa.a1.unit23.lesson05.teach.reading_text:
    title: 阅读：萨拉的一天
    gloss: 萨拉今天有点累，因为她工作了很久。萨拉不难过，只是累了。
    note: '*خسته‌ست* 和 *کرده* 是 *خسته‌ام* 和 *کردم* 的第三人称口语形式；*نیست* 是 *هست* 的否定形式；*فقط* 的意思是“只、仅仅”。'
  fa.a1.unit23.lesson06.teach.che_khoob_phrase:
    title: 太好了！
    gloss: 太好了！
    note: چه خوب! 是常见的积极回应，相当于“真好！”“太棒了！”。
  fa.a1.unit23.lesson06.teach.dialogue_line1:
    title: 尼玛：萨拉，你好吗？
    gloss: 萨拉，你好吗？
  fa.a1.unit23.lesson06.teach.dialogue_line2:
    title: 萨拉：我有点累……
    gloss: 我今天有点累，因为我工作了很久。你呢？
  fa.a1.unit23.lesson06.teach.dialogue_line3:
    title: 尼玛：我很开心……
    gloss: 我很开心，因为今天放假。
  fa.a1.unit23.lesson06.teach.dialogue_line4:
    title: 萨拉：太好了！
    gloss: 太好了！
