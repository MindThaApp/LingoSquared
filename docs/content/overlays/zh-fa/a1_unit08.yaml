  fa.a1.unit08.lesson02.teach.how_much_this:
    title: 询问价格
    gloss: 这个多少钱？
    note: این چنده؟ 是日常口语中询问价格的方式，由 این چند است 缩略而来。
  fa.a1.unit08.lesson02.teach.per_kilo_price:
    title: 说出每公斤的价格
    gloss: 每公斤30土曼。
    note: کیلویی سی تومنه 用口语缩略形式 -e 表示每公斤的价格(تومنه = تومن است)。
  fa.a1.unit08.lesson02.teach.contraction_note:
    title: 口语中的 -e 缩略形式(复习)
    gloss: تومنه 是 تومن است 在日常口语中的缩略形式。
    note: 这与之前在 آفتابیه 等天气词中见过的缩略方式相同。
  fa.a1.unit08.lesson03.teach.one_kilo:
    title: 要一公斤苹果
    gloss: 我要一公斤苹果。
    note: یک کیلو سیب می‌خوام 用 کیلو(公斤)作计量单位。
  fa.a1.unit08.lesson03.teach.half_kilo:
    title: 要半公斤
    gloss: 我要半公斤。
    note: نصف کیلو می‌خوام 用 نصف(一半)代替整整一公斤。
  fa.a1.unit08.lesson04.teach.discount_question:
    title: 请求折扣
    gloss: 可以打折吗？
    note: تخفیف می‌دید؟ 是伊朗集市和商店里自然又常见的问法——讨价还价是购物文化中正常且常见的一部分，并不失礼，也不奇怪。
  fa.a1.unit08.lesson04.teach.discount_offer:
    title: 店主给出更低的价格
    gloss: 给你算28土曼。
    note: برات بیست و هشت تومن حساب می‌کنم 是在原价30土曼的基础上稍微优惠了一点。
  fa.a1.unit08.lesson05.teach.pay_cash:
    title: 说明付现金
    gloss: 我付现金。
    note: نقدی حساب می‌کنم 用 نقدی(现金)来说明付款方式。
  fa.a1.unit08.lesson05.teach.card_question:
    title: 询问能否刷卡
    gloss: 可以刷卡吗？
    note: کارت می‌گیرید؟ 用来询问是否接受刷卡付款。
  fa.a1.unit08.lesson06.teach.please_review:
    title: 请/请便(复习)
    gloss: 请 / 给您
    note: بفرمایید 在问候单元中学过；这里店主用它来招呼顾客。
  fa.a1.unit08.lesson06.teach.thanks_review:
    title: 谢谢(复习)
    gloss: 谢谢
    note: ممنون 在问候单元中学过。
  fa.a1.unit08.lesson06.teach.no_worries_review:
    title: 不客气(复习)
    gloss: 不客气/没什么
    note: قابلی نداره 是谦虚地回应感谢的常用说法，前面的单元中已经见过。
  fa.a1.unit08.lesson06.teach.turn01:
    title: 店主招呼顾客
    gloss: 店主向顾客问好，并请顾客随意看看。
    note: بفرمایید 请顾客随便看看或有什么需要尽管说。
  fa.a1.unit08.lesson06.teach.turn02:
    title: 顾客询问价格
    gloss: 顾客向店主问好，并询问苹果的价格。
    note: این چنده؟ 出自第2课，这里用于 سیب‌ها(这些苹果)。
  fa.a1.unit08.lesson06.teach.turn03:
    title: 店主说出价格
    gloss: 店主说每公斤30土曼。
    note: کیلویی سی تومنه 出自第2课。
  fa.a1.unit08.lesson06.teach.turn04:
    title: 顾客下单并请求折扣
    gloss: 顾客说要一公斤，并问能否优惠。
    note: 这句结合了第3课的数量表达和第4课的询问折扣。
  fa.a1.unit08.lesson06.teach.turn05:
    title: 店主同意降价
    gloss: 店主同意了，并给出28土曼的价格。
    note: باشه(好的)表示同意，然后再说出优惠后的价格。
  fa.a1.unit08.lesson06.teach.turn06:
    title: 顾客道谢并付款
    gloss: 顾客向店主道谢，并说付现金。
    note: 这句结合了第5课的付款词汇和简单的道谢。
  fa.a1.unit08.lesson06.teach.turn07:
    title: 店主结束交易
    gloss: 店主回应谢意，并请顾客慢走。
    note: قابلی نداره، بفرمایید 礼貌地结束了这次交易。
