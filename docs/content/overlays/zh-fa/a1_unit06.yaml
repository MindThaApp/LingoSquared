      status: correct
    - value: قهوه
      status: correct
    feedback: چای 和 قهوه 都可以。
  fa.a1.unit06.lesson02.exercise01.recognize_polite_order:
    instruction: 这个短语是什么意思?
    correct_option: 我想要一杯茶。（礼貌）
    distractors:
    - 我要一杯茶。（随意）
    - 你们有茶吗？
    - 这茶不错。
