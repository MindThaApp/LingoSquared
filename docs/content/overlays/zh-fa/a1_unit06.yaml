      status: correct
    feedback: می‌خوام 是随意的口语说法，只用于亲密、熟悉的场合。
  fa.a1.unit06.lesson02.exercise03.recognize_polite_order_reading:
    instruction: 这个短语是什么意思?
    correct_option: 麻烦给我一杯茶。（礼貌）
    distractors:
    - 我要一杯茶。（随意）
    - 你们有菜单吗？
    - 你推荐什么？
    accepted_answers:
    - value: 麻烦给我一杯茶。（礼貌）
      status: correct
    feedback: یک چای می‌خواستم، لطفاً 的意思是“麻烦给我一杯茶”（礼貌）。
  fa.a1.unit06.lesson02.exercise04.match_register:
    instruction: 把每个点餐动词形式与它的使用场合配对。
    accepted_answers:
