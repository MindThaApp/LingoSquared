    feedback: 这两种形式只有语体不同，点的东西没有区别。
    pairs:
    - left: می‌خواستم
      right: 我想要（礼貌）
    - left: می‌خوام
      right: 我要（随意）
  fa.a1.unit06.lesson02.exercise05.order_polite_naan:
