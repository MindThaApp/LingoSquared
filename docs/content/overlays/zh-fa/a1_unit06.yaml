course:
  title: 波斯语（伊朗）A1
  description: 伊朗波斯语入门：食物和饮品词汇、在餐厅礼貌点餐、询问菜单和推荐、数量表达，以及包括买单在内的餐厅礼仪。
units:
  fa.a1.unit06.food:
    title: 食物与点餐
lessons:
  fa.a1.unit06.lesson01.food_and_drink_vocabulary:
    title: 饮食
  fa.a1.unit06.lesson02.polite_ordering_register:
    title: 礼貌点餐
  fa.a1.unit06.lesson03.menu_and_recommendation:
    title: 询问菜单并请对方推荐
  fa.a1.unit06.lesson04.quantities:
    title: 点指定数量
  fa.a1.unit06.lesson05.restaurant_etiquette:
    title: 餐厅礼仪与买单
  fa.a1.unit06.lesson06.restaurant_dialogue:
    title: 完整的餐厅对话
teaching:
  fa.a1.unit06.lesson01.teach.naan:
    title: 面包
    gloss: 面包
    note: نان 是伊朗每顿饭的主食，通常是几乎什么菜都能搭配的薄饼。
    example_gloss: 我喜欢面包。
  fa.a1.unit06.lesson01.teach.berenj:
    title: 米饭
    gloss: 米饭
    note: برنج 是大多数伊朗主菜的核心部分。
    example_gloss: 米饭配鸡肉很好吃。
  fa.a1.unit06.lesson01.teach.morgh:
    title: 鸡肉
    gloss: 鸡肉
    note: مرغ 既指鸡这种鸟，也指鸡肉。
    example_gloss: 我吃鸡肉。
  fa.a1.unit06.lesson01.teach.ab:
    title: 水
    gloss: 水
    note: آب 是“水”的普通说法。
    example_gloss: 我想要水。
  fa.a1.unit06.lesson01.teach.chai:
    title: 茶
    gloss: 茶
    note: چای 是在伊朗几乎随处都会招待的默认饮品，第1单元的客套（taarof）一课已经出现过。
    example_gloss: 请来一杯茶。
  fa.a1.unit06.lesson01.teach.ghahve:
    title: 咖啡
    gloss: 咖啡
    note: 在伊朗的城市里，قهوه 和茶一样越来越常见。
    example_gloss: 咖啡很烫。
  fa.a1.unit06.lesson01.teach.mive:
    title: 水果
    gloss: 水果
    note: میوه 是泛指各种水果的通称。
    example_gloss: 我喜欢水果。
  fa.a1.unit06.lesson01.teach.va_ya:
    title: 和 / 或
    gloss: و（和）、یا（或者）
    note: 这两个都是常用的连接词，点餐时用来连接食物和饮品。
    target_text: و（和）、یا（或者）
  fa.a1.unit06.lesson02.teach.mikhastam_chai:
    title: 礼貌地点茶
    gloss: 我想要一杯茶。
    note: می‌خواستم 字面上是“想要”的过去时形式，但用作礼貌、语气稍缓和的请求，是对不熟悉的服务员或店员说话时很自然的语体。
  fa.a1.unit06.lesson02.teach.lotfan:
    title: 请
    gloss: 请
    note: لطفاً 可以加在几乎任何请求里，使语气更委婉。
    example_gloss: 请帮帮我。
  fa.a1.unit06.lesson02.teach.mikham_informal:
    title: 随意地点茶
    gloss: 我要一杯茶。
    note: یه چای می‌خوام 使用口语化的 یه（一个）和 می‌خوام（我要），只适用于亲近的朋友或家人，不适合对刚认识的服务员说。
  fa.a1.unit06.lesson02.teach.register_note:
    title: 选对点餐动词
    gloss: 对陌生人或服务员用 می‌خواستم；只有对亲近的朋友才用 می‌خوام。
    note: 这是第1单元问候语中已出现的语体区分在点餐时的具体用法。
  fa.a1.unit06.lesson02.teach.mikhastam_naan:
    title: 礼貌地点面包
    gloss: 我想要一些面包。
    note: 同样的 می‌خواستم 句型适用于任何食物或饮品名词。
  fa.a1.unit06.lesson03.teach.menu_word:
    title: 菜单
    gloss: 菜单
    note: منو 是外来词，意思和用法都与“菜单”一样，读音接近外语词 menu。
    example_gloss: 请给我菜单。
  fa.a1.unit06.lesson03.teach.menu_question:
    title: 要菜单
    gloss: 你们有菜单吗？
    note: منو دارید؟ 字面意思是“你们有菜单吗”，是索要菜单的常用说法。
  fa.a1.unit06.lesson03.teach.recommend_question:
    title: 请对方推荐
    gloss: 你推荐什么？
    note: چی توصیه می‌کنید؟ 是问服务员时很自然、很常用的问句。
  fa.a1.unit06.lesson03.teach.waiter_question:
    title: 服务员问你的话
    gloss: 您想要什么?
    note: چی میل دارید؟ 是服务员开始点餐时礼貌、标准的问法。
  fa.a1.unit06.lesson03.teach.jooje_kabab:
    title: 烤鸡肉串
    gloss: 烤鸡肉串
    note: جوجه‌کباب（腌制后烤的鸡肉）是伊朗菜单上最常见的菜之一。
    example_gloss: 我点烤鸡肉串。
  fa.a1.unit06.lesson03.teach.khoobe:
    title: 服务员推荐菜品
    gloss: 今天的烤鸡肉串特别好吃。
    note: خوبه 是 خوب است 的口语缩略形式，适合服务员随意地推荐菜品。
  fa.a1.unit06.lesson03.teach.bale_befarmaeed:
    title: 好的，给您
    gloss: 好的，给您。
    note: بله 是“是的”；بفرمایید（第1单元客套一课已出现）在这里再次使用，用于把菜单之类的东西递给别人时。
  fa.a1.unit06.lesson04.teach.yek_livan:
    title: 一杯茶
    gloss: 一杯茶
    note: لیوان（玻璃杯）是用玻璃杯盛的饮品所用的量词。
  fa.a1.unit06.lesson04.teach.do_ta_naan:
    title: 两块馕
    gloss: 两块馕
    note: تا 是量词，放在数字后面，用于数大多数普通的可数物品，这里指两块面包。
  fa.a1.unit06.lesson04.teach.yek_boshghab:
    title: 一盘米饭
    gloss: 一盘米饭
    note: بشقاب（盘子）是用盘子盛的食物所用的量词。
  fa.a1.unit06.lesson04.teach.combined_order:
    title: 合起来点完整的一餐
    gloss: 请来一盘米饭和两块馕。
    note: 点餐时可以用 و（和）把多个数量短语连在一起。
  fa.a1.unit06.lesson04.teach.se_ta:
    title: 量词 تا
    gloss: تا 放在数字后面，用于可数的物品：دو تا（两个）、سه تا（三个）。
    note: 这与第3单元讲数字时的计数方式相同，这里用在点餐上。
  fa.a1.unit06.lesson05.teach.hesab_word:
    title: 账单
    gloss: 账单
    note: صورت‌حساب 是餐厅账单的标准说法。
    example_gloss: 请买单。
  fa.a1.unit06.lesson05.teach.bill_request:
    title: 要求买单
    gloss: 麻烦您把账单拿来好吗？
    note: صورت‌حساب رو لطف می‌کنید؟ 是在餐厅要求买单时礼貌又自然的说法。
  fa.a1.unit06.lesson05.teach.khoshmaze:
    title: 称赞食物好吃
    gloss: 非常好吃。
    note: خیلی خوشمزه بود 是饭后对服务员或主人说的自然的称赞。
  fa.a1.unit06.lesson05.teach.nooshe_jan:
    title: 请慢用
    gloss: 请慢用／祝您好胃口
    note: نوش جان 是对正在吃饭或即将吃饭的人说的，相当于“请慢用”；吃饭的人不会用它来说自己的饭菜。
  fa.a1.unit06.lesson05.teach.chashm:
    title: 服务员的礼貌回应
    gloss: 马上就来。
    note: چشم، الان میارم 是店员恭敬地回应请求、表示马上送来的说法。
  fa.a1.unit06.lesson06.teach.restaurant_word:
    title: 餐厅
    gloss: 餐厅
    note: رستوران 是“餐厅”的普通说法，也是本单元对话的场景。
    example_gloss: 这家餐厅不错。
  fa.a1.unit06.lesson06.teach.turn01:
    title: 服务员迎接顾客
    gloss: 服务员欢迎顾客，并问他们想吃什么。
    note: چی میل دارید؟ 就是第3课出现过的那句礼貌的开场问句。
  fa.a1.unit06.lesson06.teach.turn02:
    title: 顾客要菜单
    gloss: 顾客向服务员问好，并要菜单。
    note: منو دارید؟ 用来开始点餐。
  fa.a1.unit06.lesson06.teach.turn03:
    title: 服务员递上菜单
    gloss: 服务员答应并递上菜单。
    note: بفرمایید 就是第1单元学过的礼貌递物用语，这里用于把东西递给别人。
  fa.a1.unit06.lesson06.teach.turn04:
    title: 顾客请服务员推荐
    gloss: 顾客问服务员推荐什么。
    note: چی توصیه می‌کنید؟ 出自第3课。
  fa.a1.unit06.lesson06.teach.turn05:
    title: 服务员推荐一道菜
    gloss: 服务员说今天的烤鸡肉串特别好吃。
    note: جوجه‌کباب امروز خیلی خوبه 用了口语中推荐菜品时自然的非正式形式 خوبه。
  fa.a1.unit06.lesson06.teach.turn06:
    title: 顾客点完整的一餐
    gloss: 顾客同意了，点了鸡肉串配米饭，还要一杯茶。
    note: 这里用 می‌خواستم，适合对不熟悉的服务员说话。
  fa.a1.unit06.lesson06.teach.turn07:
    title: 服务员确认点单
    gloss: 服务员说马上就送来。
    note: چشم، الان میارم 出自第5课。
  fa.a1.unit06.lesson06.teach.turn08:
    title: 顾客夸赞食物好吃，并要求结账
    gloss: 顾客说很好吃，并请服务员拿账单。
    note: 这两句话都直接用到了第5课的词汇。
  fa.a1.unit06.lesson06.teach.turn09:
    title: 服务员送来账单
    gloss: 服务员答应了，并说马上拿来。
    note: البته（当然）在这里是自然又礼貌的肯定回答。
