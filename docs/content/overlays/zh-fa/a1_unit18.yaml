teaching:
  fa.a1.unit18.lesson01.teach.shoghl_word:
    title: 职业
    gloss: 职业
    note: شغل 的意思是“职业”。
    example_gloss: 你的职业是什么？
  fa.a1.unit18.lesson01.teach.mohandesam_word:
    title: 我是工程师
    gloss: 我是工程师
    note: مهندسم 是 مهندس هستم（我是工程师）的口语缩略形式。
    example_gloss: 我是工程师。
  fa.a1.unit18.lesson01.teach.moallemam_word:
    title: 我是老师
    gloss: 我是老师
    note: معلمم 是 معلم هستم（我是老师）的口语缩略形式。
    example_gloss: 我是老师。
  fa.a1.unit18.lesson01.teach.doctoram_word:
    title: 我是医生
    gloss: 我是医生
    note: دکترم 是 دکتر هستم（我是医生）的口语缩略形式。
    example_gloss: 我是医生。
  fa.a1.unit18.lesson01.teach.man_word:
    title: 我
    gloss: 我
    note: '*من* 的意思是“我”（复习）。可以把它放在 *مهندسم*、*معلمم* 或 *دکترم* 前面，让句子更完整：*من مهندسم*。'
    example_gloss: 我很好。
  fa.a1.unit18.lesson02.teach.shoghlet_word:
    title: 你的职业
    gloss: 你的职业
    note: شغلت 由 شغل（职业）加上非正式的所属后缀 -ت（你的）构成。
    target_text: شغلت（你的职业）
  fa.a1.unit18.lesson02.teach.chie_word:
    title: 是什么
    gloss: 是什么
    note: چیه 是 چی است（是什么）的口语缩略形式。
    target_text: چیه（是什么，口语）
  fa.a1.unit18.lesson02.teach.shoghlet_chie_question:
    title: 你的职业是什么？
    gloss: 你的职业是什么？
    note: شغلت چیه؟ 把本课的两个新词组合在一起，是询问别人职业的标准口语说法。
  fa.a1.unit18.lesson03.teach.sherkat_word:
    title: 公司
    gloss: 公司
    note: شرکت 的意思是公司。
    example_gloss: 我在一家公司工作。
  fa.a1.unit18.lesson03.teach.madrese_word:
