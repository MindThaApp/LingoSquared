course:
  title: 波斯语（伊朗）A1
  description: 伊朗波斯语入门：表达喜欢和不喜欢、询问偏好、在选项之间做选择、说出简单的理由，以及一段关于两个人偏好的简短阅读和对话。
units:
  fa.a1.unit14.preferences:
    title: 偏好
    description: 表达和询问基本的喜好、厌恶以及简单的理由。
lessons:
  fa.a1.unit14.lesson01.basic_likes:
    title: 简单的喜欢与不喜欢
  fa.a1.unit14.lesson02.asking_preferences:
    title: 询问偏好
  fa.a1.unit14.lesson03.choosing_between_options:
    title: 在两样东西之间选择
  fa.a1.unit14.lesson04.giving_reasons:
    title: 说明原因
  fa.a1.unit14.lesson05.reading_about_preferences:
    title: 阅读：偏好
  fa.a1.unit14.lesson06.preferences_dialogue:
    title: 关于偏好的对话
teaching:
  fa.a1.unit14.lesson01.teach.doost_daram_phrase:
    title: 我喜欢
    gloss: 我喜欢
    note: دوست دارم 字面意思是“我有（对它的）友情”，是表达“我喜欢”的标准说法。
  fa.a1.unit14.lesson01.teach.ghahve_word:
    title: 咖啡
    gloss: 咖啡
    note: قهوه 的意思是“咖啡”。
    example_gloss: 我喜欢咖啡。
  fa.a1.unit14.lesson01.teach.chay_word:
    title: 茶
    gloss: 茶
    note: چای 的意思是“茶”。
    example_gloss: 我不喜欢茶。
  fa.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: 我不喜欢
    gloss: 我不喜欢
    note: دوست ندارم 是 دوست دارم 的否定形式。
  fa.a1.unit14.lesson01.teach.man_word:
    title: 我
    gloss: 我
    note: من 的意思是“我”——动词词尾已经表明了主语，所以常常可以省略，需要强调时可以加上。
    example_gloss: 我喜欢音乐。
  fa.a1.unit14.lesson02.teach.kodum_word:
    title: 哪个
    gloss: 哪个
    note: کدوم 的意思是“哪个”。
    example_gloss: 你喜欢哪一个？
  fa.a1.unit14.lesson02.teach.moosighi_word:
    title: 音乐
    gloss: 音乐
    note: موسیقی 的意思是“音乐”。
    example_gloss: 我喜欢音乐。
  fa.a1.unit14.lesson02.teach.mikhay_word:
    title: 你想要
    gloss: 你想要
    note: می‌خوای 是 می‌خواهی（你想要）的口语、非正式的第二人称形式。
    target_text: می‌خوای（你想要，非正式）
  fa.a1.unit14.lesson02.teach.kodum_ro_question:
    title: 你喜欢哪一个？
    gloss: 你喜欢哪一个？
    note: کدوم رو دوست داری؟——رو 标记宾语（口语，书面为 را），داری 是 داشتن（有）的第二人称形式。
  fa.a1.unit14.lesson03.teach.bishtar_word:
    title: 更
    gloss: 更
    note: بیشتر 的意思是“更”“更多”。
    example_gloss: 我更喜欢咖啡。
  fa.a1.unit14.lesson03.teach.ya_word:
    title: 或
    gloss: 或者
    note: یا 的意思是“或者”，用来在两样东西之间提供选择。
    target_text: یا（或者）
  fa.a1.unit14.lesson03.teach.ghahve_ya_chay_question:
    title: 咖啡还是茶？
    gloss: 咖啡还是茶？
    note: قهوه یا چای؟ 是在第一课学过的两种饮品之间做选择。
  fa.a1.unit14.lesson04.teach.choon_word:
    title: 因为
    gloss: 因为
    note: چون 用来引出理由。
    target_text: چون（因为）
  fa.a1.unit14.lesson04.teach.khoshmaze_word:
    title: 很好吃
    gloss: 很好吃
    note: خوشمزه‌ست 是 خوشمزه است（很好吃）的口语缩略形式。
    example_gloss: 咖啡很好吃。
  fa.a1.unit14.lesson04.teach.jaleb_word:
    title: 很有趣
    gloss: 很有趣
    note: جالبه 是 جالب است（很有趣）的口语缩略形式。
    example_gloss: 这首音乐很有趣。
  fa.a1.unit14.lesson04.teach.va_word:
    title: 和
    gloss: 和
    note: '*و* 的意思是“和”，可以连接两个简短的陈述，例如表达喜欢某物并描述它。它比直接给出理由的 *چون*（因为）更松散。'
    target_text: و（和）
  fa.a1.unit14.lesson05.teach.sara_name:
    title: 萨拉
    gloss: 萨拉
    note: 伊朗常见的女性名字。
    example_gloss: 萨拉喜欢茶。
  fa.a1.unit14.lesson05.teach.dareh_grammar:
    title: 他/她喜欢
    gloss: 他/她喜欢
    note: داره 是 دارد（有）的口语第三人称形式——دوست داره 的意思是“他/她喜欢”，与第一人称的 دوست دارم 对应。
    target_text: دوست داره（他/她喜欢，口语第三人称）
  fa.a1.unit14.lesson05.teach.nadareh_grammar:
    title: 他/她不喜欢
    gloss: 他/她不喜欢
    note: نداره 是口语的第三人称否定形式——دوست نداره 的意思是“他/她不喜欢”。
    target_text: دوست نداره（他/她不喜欢，口语第三人称）
  fa.a1.unit14.lesson05.teach.garme_word:
    title: 是热的
    gloss: 是热的
    note: گرمه 是 گرم است（是热的）的口语缩略形式。
    example_gloss: 茶是热的。
  fa.a1.unit14.lesson05.teach.reading_text:
    title: 偏好短文示例
    gloss: 萨拉喜欢茶，因为它是热的。萨拉不喜欢音乐。
    note: 一段简短的第三人称叙述，综合运用了本单元的偏好词汇。
  fa.a1.unit14.lesson06.teach.names:
    title: 尼马和萨拉
    gloss: 尼马，萨拉
    note: 本课程中通篇使用的伊朗常见人名。
    example_gloss:
    - 尼玛喜欢茶。
    - 萨拉喜欢咖啡。
  fa.a1.unit14.lesson06.teach.to_chi_phrase:
    title: 你呢?
    gloss: 你呢?
    note: تو چی؟ 是把问题抛回给对方的简短常用说法。
  fa.a1.unit14.lesson06.teach.aalie_word:
    title: 太棒了
    gloss: 太棒了
    note: عالیه 是 عالی است(它很棒)的口语缩略形式。
    example_gloss: 这太棒了。
  fa.a1.unit14.lesson06.teach.dialogue_line1:
    title: 尼玛问
    gloss: 茶还是咖啡,你更喜欢哪个?
  fa.a1.unit14.lesson06.teach.dialogue_line2:
    title: 萨拉回答
    gloss: 我更喜欢咖啡,因为很好喝。你呢?
  fa.a1.unit14.lesson06.teach.dialogue_line3:
    title: 尼玛回答
    gloss: 我喜欢茶,因为它是热的。
  fa.a1.unit14.lesson06.teach.dialogue_line4:
    title: 萨拉回应
    gloss: 太棒了!
