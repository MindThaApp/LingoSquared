teaching:
  fa.a1.unit09.lesson01.teach.hour_word:
    title: 小时／钟表
    gloss: 小时／钟表
    note: ساعت 既表示“小时”，也表示“钟表”，是报时的基本词。
    example_gloss: 现在几点？
  fa.a1.unit09.lesson01.teach.minute_word:
    title: 分钟
    gloss: 分钟
    note: دقیقه 是“分钟”的意思。
    example_gloss: 等五分钟。
  fa.a1.unit09.lesson01.teach.half_word:
    title: 一半
    gloss: 一半
    note: نیم 表示“一半”，用来说半小时。
    example_gloss: 七点半。
  fa.a1.unit09.lesson01.teach.quarter_word:
    title: 一刻钟
    gloss: 一刻钟
    note: ربع 表示“四分之一”，用来说一刻钟。
    example_gloss: 差一刻八点。
  fa.a1.unit09.lesson01.teach.va_word:
    title: 和
    gloss: 和
    note: و 是本单元中常用的连接词。
    target_text: و（和）
  fa.a1.unit09.lesson02.teach.what_time_question:
    title: 询问现在几点
    gloss: 现在几点？
    note: ساعت چنده؟ 是日常口语中询问时间的说法。
  fa.a1.unit09.lesson02.teach.contraction_note:
    title: 口语中的 -e 缩略（复习）
    gloss: چنده 是 چند است 在日常口语中的缩略形式。
    note: 这与之前在天气和购物词汇（如 آفتابیه 和 تومنه）中见过的缩略规律相同。
  fa.a1.unit09.lesson03.teach.three_oclock_half:
    title: 说现在是三点半
    gloss: 三点半。
    note: ساعت سه و نیمه 由小时、و（和）以及缩略形式 نیمه（半）组成。
  fa.a1.unit09.lesson03.teach.contraction_note2:
    title: 口语中的 -e 缩略，用在 نیم 上
    gloss: نیمه 是 نیم است 在日常口语中的缩略形式。
    note: 规律与 چنده 相同，只是用在 نیم 上，而不是 چند。
  fa.a1.unit09.lesson04.teach.sobh:
    title: 早晨
    gloss: 早上
    note: صبح 指一天中的早晨。
    example_gloss: 我早上很早起床。
  fa.a1.unit09.lesson04.teach.zohr:
    title: 中午
    gloss: 中午
    note: ظهر 指中午。
    example_gloss: 我中午吃午饭。
  fa.a1.unit09.lesson04.teach.asr:
    title: 下午
    gloss: 下午
    note: عصر 指下午到傍晚前的时段。
    example_gloss: 我下午工作。
  fa.a1.unit09.lesson04.teach.shab:
    title: 夜晚
    gloss: 夜晚
    note: شب 指夜晚。
    example_gloss: 我晚上很早睡觉。
  fa.a1.unit09.lesson05.teach.appointment_word:
    title: 约定
    gloss: 预约
    note: قرار 是表示“约定”或“约好的见面”的通用词。
    example_gloss: 我有个约会。
  fa.a1.unit09.lesson05.teach.appointment_question:
    title: 询问约定的时间
    gloss: 约好的时间是几点？
    note: قرار ساعت چنده؟ 把第2课的问时间句型用在具体的约定上。
  fa.a1.unit09.lesson05.teach.four_oclock:
    title: 用一天中的时段说时间
    gloss: 下午四点
    note: ساعت چهار عصر 把钟点和 عصر 连用，以区分上午和下午。
  fa.a1.unit09.lesson06.teach.tomorrow_review:
    title: 明天（复习）
    gloss: 明天
    note: فردا 在前面的单元已学过，这里用它来引出约定。
    example_gloss: 我明天有个约会。
  fa.a1.unit09.lesson06.teach.late_word:
    title: 说自己会晚一点
    gloss: 我会晚一点。
    note: '*یکم دیر می‌شه* 用了口语词 *یکم*（一点）和 *دیر*（晚）。'
  fa.a1.unit09.lesson06.teach.turn01:
    title: 内加尔问明天约定的时间
    gloss: 内加尔问明天的约定是几点。
    note: قرار فردا ساعت چنده؟ 把第5课的约定问句和 فردا（明天）结合起来。
  fa.a1.unit09.lesson06.teach.turn02:
    title: 阿拉什不太确定地回答
    gloss: 阿拉什说他想应该是四点。
    note: فکر کنم（我想）使语气委婉，因为他并不完全确定。
  fa.a1.unit09.lesson06.teach.turn03:
    title: 内加尔问是上午还是下午
    gloss: 内加尔问四点是下午还是上午。
    note: 这是为了澄清歧义，因为只说 ساعت چهار 并不能确定是哪个四点。
  fa.a1.unit09.lesson06.teach.turn04:
    title: 阿拉什作出澄清
    gloss: 阿拉什说是下午。
    note: 问题已经确定了语境，用一个词回答就很自然。
  fa.a1.unit09.lesson06.teach.turn05:
    title: 内加尔同意并调整到达时间
    gloss: 内加尔答应了，并说她四点一刻到。
    note: ساعت چهار و ربع 把钟点和 ربع（一刻钟）结合在一起。
  fa.a1.unit09.lesson06.teach.turn06:
    title: 阿拉什问为什么要多一刻钟
    gloss: 阿拉什问她为什么说过一刻。
    note: '*چرا ربع؟* 是“为什么要一刻钟？”的简短问法。'
  fa.a1.unit09.lesson06.teach.turn07:
    title: 内加尔解释自己会晚一点
    gloss: 内加尔解释说她下班会晚一点。
    note: '*چون*（因为）引出原因，并用了本课刚学的 *یکم دیر می‌شه*（我会晚一点）。'
  fa.a1.unit09.lesson06.teach.turn08:
    title: 阿拉什让她放心
    gloss: 阿拉什说好的，没问题。
    note: مشکلی نیست（没问题）让内加尔放心，稍微晚一点没关系。
