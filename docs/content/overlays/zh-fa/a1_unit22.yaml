teaching:
  fa.a1.unit22.lesson01.teach.phone_word:
    title: 电话
    gloss: 手机
    note: تلفن 是“电话”的通用说法。
    example_gloss: 我的手机在哪儿？
  fa.a1.unit22.lesson01.teach.message_word:
    title: 消息
    gloss: 消息
    note: پیام 指书面的/文字的消息。
    example_gloss: 我有一条消息。
  fa.a1.unit22.lesson01.teach.call_word:
    title: 打电话
    gloss: 打电话
    note: زنگ زدن(字面意思是“响铃”)是日常说“给某人打电话”的动词。
    example_gloss: 给我打电话。
  fa.a1.unit22.lesson01.teach.voice_word:
    title: 声音
    gloss: 声音
    note: صدا 的意思是声音，用来形容通话时某人听起来怎么样。
    example_gloss: 你的声音很好听。
  fa.a1.unit22.lesson01.teach.va_word:
    title: 和
    gloss: 和
    note: و 是常用的连接词，在前面的单元中已学过。
    target_text: و(和)
  fa.a1.unit22.lesson02.teach.hello_phone:
    title: 喂(接电话时)
    gloss: 喂，请说
    note: الو 是电话中专用的问候语(当面不用);这里的 بفرمایید 大致表示“请说，我在听”。
  fa.a1.unit22.lesson02.teach.its_me:
    title: 是我，纳尔吉斯
    gloss: 你好，是我，纳尔吉斯
    note: '*منم* 是 *من*(我)加动词词尾 -م(“是”),意思是“是我”——打电话时表明身份的常见说法。(同样的拼写也可以表示“我也”,即 *من هم*;这里根据语境可以看出不是这个意思。)'
  fa.a1.unit22.lesson03.teach.can_you_repeat:
    title: 你能重复一遍吗？
    gloss: 能请您重复一遍吗？
    note: می‌شه(口语，相当于 می‌شود,“可不可以”)加上 تکرار کنید(请重复),是礼貌请求的标准说法。
  fa.a1.unit22.lesson03.teach.speak_slower:
    title: 请说慢一点
    gloss: 请说慢一点
    note: آهسته‌تر 是 آهسته（慢）的比较级，意思是“更慢地”。
  fa.a1.unit22.lesson04.teach.message_for_you:
    title: 我有一条消息要告诉你
    gloss: 我有一条消息要告诉你
    note: برات 是 برای（为、给）+ ت（非正式的“你”）的缩略形式。
  fa.a1.unit22.lesson04.teach.tomorrow_four:
    title: 明天四点来咖啡馆
    gloss: 明天四点来咖啡馆
    note: بیا 是 آمدن（来）的非正式命令式，直接用词干构成，和 A1 中已学过的其他命令式规律相同。
  fa.a1.unit22.lesson05.teach.goodbye_call:
    title: 再见，我们回头再聊
    gloss: 再见，我们回头再聊
    note: بعداً 意思是“以后、稍后”；صحبت می‌کنیم 是现在时，表示“我们聊／会聊”。
  fa.a1.unit22.lesson05.teach.better_now:
    title: 现在好一点了吗？
    gloss: 现在好点了吗？
    note: الان 意思是“现在”；بهتر شد 字面是“变好了”，用的是过去时。波斯语询问对方情况时自然地这样说，而汉语常说“好点了吗”，也带有变化的意味。
  fa.a1.unit22.lesson06.teach.how_are_you:
    title: 你好，纳尔吉斯，你好吗？
    gloss: 嗨，纳尔盖斯，你好吗？
    note: '*چطوری* 是非正式的“你好吗”，这里用它是因为阿里和纳尔盖斯是朋友。'
  fa.a1.unit22.lesson06.teach.cutting_out:
    title: 你的声音断断续续的
    gloss: 你的声音断断续续的
    note: قطع و وصل می‌شه 字面是“断开又接通”，是波斯语中形容电话信号时断时续的自然说法。
  fa.a1.unit22.lesson06.teach.turn01:
    title: 阿里接电话
    gloss: 阿里：喂，请说。
  fa.a1.unit22.lesson06.teach.turn02:
    title: 纳尔盖斯自报身份
    gloss: 纳尔盖斯：嗨，阿里，是我，纳尔盖斯。
  fa.a1.unit22.lesson06.teach.turn03:
    title: 阿里回应问候
    gloss: 阿里：嗨，纳尔盖斯，你好吗？
  fa.a1.unit22.lesson06.teach.turn04:
    title: 纳尔盖斯请他说慢一点
    gloss: 纳尔盖斯：我很好，谢谢。你能说慢一点吗？你的声音断断续续的。
  fa.a1.unit22.lesson06.teach.turn05:
    title: 阿里确认一下
    gloss: 阿里：好的，现在好点了吗？
  fa.a1.unit22.lesson06.teach.turn06:
    title: 纳尔盖斯传达消息
    gloss: 纳尔盖斯：嗯，好多了。我有一条消息要告诉你，明天四点来咖啡馆。
  fa.a1.unit22.lesson06.teach.they_go:
    title: 他们去（口语）
    gloss: 他们去（口语形式）
    note: '*می‌رن* 是 *می‌روند*（他们去）的非正式口语形式，与本课程其余部分的口语风格一致。'
    target_text: می‌رن(他们去，口语)
  fa.a1.unit22.lesson06.teach.turn07:
    title: 阿里答应
    gloss: 阿里：好的，我一定来。
  fa.a1.unit22.lesson06.teach.turn08:
    title: 纳尔盖斯结束通话
    gloss: 纳尔盖斯：再见，我们回头再聊。
  fa.a1.unit22.lesson06.teach.turn09:
    title: 阿里道别
    gloss: 阿里：再见。
