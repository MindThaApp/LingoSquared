teaching:
  fa.a1.unit10.lesson01.teach.shanbe_yekshanbe:
    title: 星期六、星期日
    gloss: 星期六、星期日
    note: شنبه 和 یکشنبه 是伊朗一周的前两天，伊朗的一周从星期六开始。
    example_gloss:
    - 今天是星期六。
    - 明天是星期天。
  fa.a1.unit10.lesson01.teach.doshanbe_seshanbe:
    title: 星期一、星期二
    gloss: 星期一、星期二
    note: دوشنبه 和 سه‌شنبه 紧接在 شنبه 和 یکشنبه 之后。
    example_gloss:
    - 我星期一有课。
    - 我星期二有个约会。
  fa.a1.unit10.lesson01.teach.chaharshanbe_panjshanbe:
    title: 星期三、星期四
    gloss: 星期三、星期四
    note: چهارشنبه 和 پنجشنبه 是一周中偏后的日子。
    example_gloss:
    - 我星期三上班。
    - 星期四见。
  fa.a1.unit10.lesson01.teach.jome:
    title: 星期五
    gloss: 星期五
    note: جمعه 是一周的最后一天，也是伊朗传统的每周休息日。
    example_gloss: 星期五是假日。
  fa.a1.unit10.lesson01.teach.weekend_note:
    title: 每周的休息日
    gloss: 星期五是每周的休息日。
    note: جمعه（星期五）是伊朗传统的每周休息日，不过现在一些现代化的单位星期四下午也会休息。
  fa.a1.unit10.lesson02.teach.farvardin:
    title: 法尔瓦丁月（第1个月）
    gloss: 法尔瓦丁月，伊朗太阳历一年的第一个月
    note: فروردین 是伊朗太阳历新年的开始，大约在3月下旬（春分／诺鲁孜节前后）。
    example_gloss: 法尔瓦丁月是一年的第一个月。
  fa.a1.unit10.lesson02.teach.ordibehesht:
    title: 阿迪贝赫什特月（第2个月）
    gloss: 阿迪贝赫什特月，第二个月
    note: اردیبهشت 紧接在 فروردین 之后，大约在4月至5月。
    example_gloss: 阿迪贝赫什特月天气很好。
  fa.a1.unit10.lesson02.teach.khordad:
    title: 霍尔达德月（第3个月）
    gloss: 霍尔达德月，第三个月
    note: خرداد 紧接在 اردیبهشت 之后，大约在5月至6月。
    example_gloss: 我出生在霍尔达德月。
  fa.a1.unit10.lesson02.teach.calendar_note:
    title: 伊朗太阳历
    gloss: 伊朗使用伊朗太阳历（波斯历）。
    note: '*ایران از تقویم هجری شمسی استفاده می‌کنه* 说明伊朗在日常日期中使用这种历法——阿富汗也使用同一种历法，但月份名称不同：伊朗用的是源自波斯语的月份名，而阿富汗用的是源自阿拉伯语的名称。'
  fa.a1.unit10.lesson03.teach.what_day_today:
    title: 今天星期几？
    gloss: 今天星期几？
    note: امروز چندشنبه‌ست؟ 字面意思是“今天是一周中的第几天？”——这是 چندشنبه است 的口语缩略形式 -e。
  fa.a1.unit10.lesson03.teach.today_word:
    title: 今天
    gloss: 今天
    note: امروز 的意思是今天。
    example_gloss: 今天几号？
  fa.a1.unit10.lesson04.teach.give_full_date:
    title: 今天是星期四，阿迪贝赫什特月10日。
    gloss: 今天是星期四，阿迪贝赫什特月10日。
    note: امروز پنجشنبه، دهم اردیبهشته 在一个句子中结合了星期名称、序数日期和月份名称，并使用了口语的 -e 缩略形式（اردیبهشته = اردیبهشت است）。
  fa.a1.unit10.lesson04.teach.tarikh_word:
    title: 日期
    gloss: 日期
    note: '*تاریخ* 的意思是“日期”——指日历上日期的通用词，例如 *تاریخ جلسه*（会议的日期）。'
    example_gloss: 今天几号？
  fa.a1.unit10.lesson05.teach.which_day_meeting:
    title: 会议是星期几？
    gloss: 会议是星期几？
    note: جلسه کدوم روزه؟ 询问某个活动是在一周中的哪一天。
  fa.a1.unit10.lesson05.teach.which_date:
    title: 阿迪贝赫什特月的星期二是几号？
    gloss: 阿迪贝赫什特月的星期二是几号？
    note: سه‌شنبه چندم اردیبهشته؟ 用来询问某个星期几具体是几号。
  fa.a1.unit10.lesson06.teach.hashtom:
    title: 第八
    gloss: 第八
    note: '*هشتم* 表示（某月的）8日。'
    example_gloss: 今天是8号。
  fa.a1.unit10.lesson06.teach.turn01:
    title: 礼萨，会议是星期几？
    gloss: 礼萨，会议是星期几？
    note: 玛丽亚姆直接叫着礼萨的名字开始提问。
  fa.a1.unit10.lesson06.teach.turn02:
    title: 我想是星期二。
    gloss: 我想是星期二。
    note: فکر کنم（我想／我觉得）让礼萨的回答显得不那么确定。
  fa.a1.unit10.lesson06.teach.turn03:
    title: 阿迪贝赫什特月的星期二是几号？
    gloss: 阿迪贝赫什特月的星期二是几号？
    note: 玛丽亚姆接着问具体的日期。
  fa.a1.unit10.lesson06.teach.turn04:
    title: 星期二是阿尔迪贝赫什特月8日。
    gloss: 星期二是阿尔迪贝赫什特月8日。
    note: 礼萨说出了具体的日期。
  fa.a1.unit10.lesson06.teach.turn05:
    title: 好的，行。那星期五呢，你有空吗？
    gloss: 好的，行。那星期五呢，你有空吗？
    note: 玛丽亚姆先确认了日期，然后问了另一天。
  fa.a1.unit10.lesson06.teach.turn06:
    title: 不行，我星期五很忙。
    gloss: 不行，我星期五很忙。
    note: سرم شلوغه（字面意思是“我的头很忙／很挤”）是伊朗人口语中表示“很忙”的自然说法。
  fa.a1.unit10.lesson06.teach.turn07:
    title: 没问题，星期二见。
    gloss: 没问题，星期二见。
    note: مشکلی نیست（没问题）是礼貌地接受礼萨的拒绝；می‌بینمت 表示“我会见到你”，确认会议定在星期二，与前面的对话一致。
  fa.a1.unit10.lesson06.teach.va_and:
    title: 和
    gloss: 和
    note: '*و* 表示“和”。它可以连接两个星期几，如 *دوشنبه و سه‌شنبه*，也可以连接两个相关的问题，如 *جلسه کدوم روزه و چندم اردیبهشته؟*'
    example_gloss: 我星期一和星期二有课。
