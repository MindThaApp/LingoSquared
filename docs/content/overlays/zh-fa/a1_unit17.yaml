    gloss: 头痛
    note: سردرد 的意思是头痛。
    example_gloss: 我头痛。
  fa.a1.unit17.lesson01.teach.daram_word:
    title: 我有
    gloss: 我有
    note: دارم 的意思是“我有”,与表示症状的名词连用(سردرد دارم = 我头痛)。
    target_text: دارم（我有）
  fa.a1.unit17.lesson01.teach.tab_word:
    title: 发烧
    gloss: 发烧
    note: تب 的意思是发烧。
    example_gloss: 我发烧了。
  fa.a1.unit17.lesson02.teach.delam_dard_mikone_phrase:
    title: 我肚子疼
    gloss: 我肚子疼
    note: دلم درد می‌کنه 字面意思是“我的肚子在疼”,是口语中表示肚子疼的说法。
  fa.a1.unit17.lesson02.teach.khastam_word:
    title: 我累了
    gloss: 我累了
    note: '*خسته‌ام* 的意思是“我累了”:词尾 *-ام* 是 *هستم*(我是)的缩略形式，接在 *خسته*(累)后面。'
    example_gloss: 我今天很累。
  fa.a1.unit17.lesson03.teach.komak_word:
    title: 帮助
    gloss: 帮助
    note: کمک 的意思是帮助。
    example_gloss: 你能帮我吗？
  fa.a1.unit17.lesson03.teach.mitooni_word:
    title: 你可以
    gloss: 你能
    note: می‌تونی 是 می‌توانی(你能)的口语缩略形式，用于非正式的第二人称。
    target_text: می‌تونی（你能，非正式）
  fa.a1.unit17.lesson03.teach.komakam_koni_phrase:
    title: 你能帮我吗？
    gloss: 你能帮我吗？
    note: '*می‌تونی کمکم کنی؟* 由 *می‌تونی*(你能)和 *کمکم کنی*(字面意思是“做我的帮助”,即帮我)组成。'
  fa.a1.unit17.lesson04.teach.doctor_word:
    title: 医生
    gloss: 医生
    note: دکتر 的意思是医生。
    example_gloss: 医生说要休息。
  fa.a1.unit17.lesson04.teach.daroo_word:
    title: 药
    gloss: 药
    note: دارو 的意思是药。
    example_gloss: 吃这个药。
