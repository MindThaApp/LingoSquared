    - 萨拉帮助尼马。
  fa.a1.unit17.lesson06.teach.ham_word:
    title: 也
    gloss: 也
    note: هم 的意思是“也”,放在它所修饰的词后面(آب هم بخور = 也喝点水)。
    target_text: هم（也）
  fa.a1.unit17.lesson06.teach.bashe_word:
    title: 还好
    gloss: 还好
    note: باشه 是 باشد 的口语缩略形式(好的/同意)。
    example_gloss: 好的，我去休息。
  fa.a1.unit17.lesson06.teach.mamnoon_word:
    title: 道谢
    gloss: 谢谢
    note: ممنون 的意思是谢谢。
    example_gloss: 谢谢你的帮助。
  fa.a1.unit17.lesson06.teach.dareh_grammar:
    title: 他/她有
    gloss: 他/她有
    note: داره 是 دارد(有)的口语第三人称形式，与第一人称的 دارم 规律相同。
    target_text: داره（他／她有，口语第三人称）
  fa.a1.unit17.lesson06.teach.dialogue_line1:
    title: 尼马说
    gloss: 我不舒服。我头痛，还发烧。
  fa.a1.unit17.lesson06.teach.dialogue_line2:
    title: 萨拉给建议
    gloss: 休息吧。也喝点水。
  fa.a1.unit17.lesson06.teach.dialogue_line3:
    title: 尼马回答
    gloss: 好的，谢谢。
