    gloss: 休息
    note: استراحت کن 是非正式的命令式，意思是“休息吧！”
  fa.a1.unit17.lesson04.teach.ab_bokhor_phrase:
    title: 喝水(命令)
    gloss: 喝水
    note: آب بخور 是非正式的命令式，意思是“喝水！”
  fa.a1.unit17.lesson04.teach.va_word:
    title: 和
    gloss: 和
    note: و 的意思是“和”,用来连接两个分句或两个事物。
    target_text: و（和）
  fa.a1.unit17.lesson05.teach.reading_text:
    title: 症状便条示例
    gloss: 我头痛，还发烧。我很累。
