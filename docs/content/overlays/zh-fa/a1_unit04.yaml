teaching:
  fa.a1.unit04.lesson01.teach.madar:
    title: 母亲
    gloss: 母亲
    note: مادر 是表示“母亲”的中性词，书面和正式场合使用。
    example_gloss: 我的母亲很善良。
  fa.a1.unit04.lesson01.teach.maman:
    title: 妈妈
    gloss: 妈妈
    note: مامان 是大多数家庭日常口语中实际使用的说法。
    example_gloss: 妈妈，我饿了。
  fa.a1.unit04.lesson01.teach.pedar:
    title: 父亲
    gloss: 父亲
    note: پدر 是书面语/正式场合中表示“父亲”的中性词。
    example_gloss: 我的父亲是医生。
  fa.a1.unit04.lesson01.teach.baba:
    title: 爸爸
    gloss: 爸爸
    note: بابا 是大多数家庭日常口语中实际使用的说法。
    example_gloss: 爸爸，你在哪儿？
  fa.a1.unit04.lesson01.teach.baradar:
    title: 哥哥／弟弟
    gloss: 兄弟
    note: برادر 是“兄弟”的一般说法；口语中带亲昵色彩的 داداش 会在本单元稍后出现。
    example_gloss: 我有一个兄弟。
  fa.a1.unit04.lesson01.teach.khahar:
    title: 姐姐／妹妹
    gloss: 姐妹
    note: خواهر 是“姐妹”的标准说法。
    example_gloss: 我的姐妹是大学生。
  fa.a1.unit04.lesson01.teach.register_note:
    title: 正式说法与日常说法
    gloss: مامان 和 بابا 就像“母亲”和“父亲”，只是更口语、更亲切。
    note: 波斯语称呼父母有两种真实的语体，但并不是严格的正式/非正式之分——大多数人称呼自己的父母时用的就是 مامان/بابا，即使在礼貌的场合也是如此。
  fa.a1.unit04.lesson02.teach.daram:
    title: 我有
    gloss: 我有
    note: '*دارم* 是 *داشتن*（“有”）的第一人称形式，是描述家庭时最核心的动词。'
  fa.a1.unit04.lesson02.teach.yek:
    title: 一
    gloss: 一
    note: یک 用在被计数的名词前，例如 یک برادر（一个兄弟）。
    example_gloss: 我有一个姐妹。
  fa.a1.unit04.lesson02.teach.one_brother:
    title: 我有一个兄弟。
    gloss: 我有一个兄弟。
    note: 语序：主语、数量+名词、动词——这是典型的波斯语主宾谓（SOV）语序。
  fa.a1.unit04.lesson02.teach.no_sister:
    title: 我没有姐妹。
    gloss: 我没有姐妹。
    note: ندارم 是 دارم 的否定形式；不需要另外加表示“一个”的词。
  fa.a1.unit04.lesson02.teach.family_big:
    title: 我的家庭很大。
    gloss: 我的家庭很大。
    note: بزرگه 是口语中 “بزرگ است”（很大）的缩略形式。
  fa.a1.unit04.lesson02.teach.family_small:
    title: 我们的家庭很小。
    gloss: 我们的家庭很小。
    note: کوچیکه 是口语中 “کوچک است”（很小）的缩略形式，并且使用口语读音 کوچیک，而不是书面的 کوچک。
  fa.a1.unit04.lesson03.teach.pedarbozorg:
    title: 祖父
    gloss: 祖父；外祖父
    note: پدربزرگ 字面意思是“大父亲”，父亲一方和母亲一方的祖父都可以这样称呼。
    example_gloss: 我的祖父年纪大了。
  fa.a1.unit04.lesson03.teach.madarbozorg:
    title: 祖母
    gloss: 祖母；外祖母
    note: مادربزرگ 字面意思是“大母亲”，父亲一方和母亲一方的祖母都可以这样称呼。
    example_gloss: 我的祖母很和蔼。
  fa.a1.unit04.lesson03.teach.amoo:
    title: 伯父/叔父（父亲的兄弟）
    gloss: 伯父/叔父（父亲的兄弟）
    note: عمو 专指父亲的兄弟，不是泛指的“叔叔”。
    example_gloss: 我的叔叔住在德黑兰。
  fa.a1.unit04.lesson03.teach.amme:
    title: 姑姑（父亲的姐妹）
    gloss: 姑姑（父亲的姐妹）
    note: عمه 专指父亲的姐妹。
    example_gloss: 我的姑姑是老师。
  fa.a1.unit04.lesson03.teach.dayi:
    title: 舅舅（母亲的兄弟）
    gloss: 舅舅（母亲的兄弟）
    note: دایی 专指母亲的兄弟——和汉语一样，波斯语也区分亲戚属于父系还是母系，每一位叔伯姑姨舅都有对应的称呼。
    example_gloss: 我的舅舅是工程师。
  fa.a1.unit04.lesson03.teach.khale:
    title: 姨妈（母亲的姐妹）
    gloss: 姨妈（母亲的姐妹）
    note: خاله 专指母亲的姐妹。
    example_gloss: 我的姨妈住在伊斯法罕。
  fa.a1.unit04.lesson03.teach.register_note:
    title: 父系与母系
    gloss: 伯父/叔父和姑姑属于父亲一方；舅舅和姨妈属于母亲一方。
    note: 这四种称呼的区分（عمو/عمه 与 دایی/خاله）和汉语的“伯叔姑舅姨”类似：每个称呼都说明了亲戚属于父亲一方还是母亲一方。
  fa.a1.unit04.lesson04.teach.chand_ta:
    title: 多少个
    gloss: 多少个
    note: چند تا 在日常口语中用于询问人或物的数量。
    example_gloss: 您有几个姐妹？
  fa.a1.unit04.lesson04.teach.polite_question:
    title: 您有几个兄弟姐妹？（礼貌）
    gloss: 你有几个兄弟姐妹？
    note: دارید 是“有”的礼貌/复数形式，与 شما 搭配。
  fa.a1.unit04.lesson04.teach.spoken_question:
    title: 你有几个兄弟姐妹？（非正式）
    gloss: 你有几个兄弟姐妹？
    note: داری 是非正式的单数形式，用于同辈或比自己年幼的人。
  fa.a1.unit04.lesson04.teach.family_size_question:
    title: 您家有几口人？
    gloss: 您家有几口人？
    note: نفر 是计数人的量词；نفرن 是口语中 “نفر هستند”（有……个人）的缩略形式。
  fa.a1.unit04.lesson04.teach.answer_example:
    title: 我们一家四口：我、我妈妈、我爸爸和我哥哥/弟弟。
    gloss: 我们一家四口：我、我妈妈、我爸爸和我哥哥/弟弟。
    note: نفریم = “نفر هستیم”（我们有……个人）的缩略形式，属于口语。
  fa.a1.unit04.lesson05.teach.showhar:
    title: 丈夫
    gloss: 丈夫
    note: شوهر 是“丈夫”的标准说法。
    example_gloss: 我的丈夫是工程师。
  fa.a1.unit04.lesson05.teach.zan:
    title: 妻子
    gloss: 妻子
    note: زن 也泛指“女人”，具体意思要看上下文。
    example_gloss: 我的妻子是老师。
  fa.a1.unit04.lesson05.teach.motahel:
    title: 已婚
    gloss: 已婚
    note: متأهل 是表示婚姻状况的中性常用形容词。
    example_gloss: 他/她已婚。
  fa.a1.unit04.lesson05.teach.mojarad:
    title: 单身
    gloss: 单身（未婚）
    note: مجرد 是“未婚”的标准说法。
    example_gloss: 我是单身。
  fa.a1.unit04.lesson05.teach.i_am_single:
    title: 我是单身。
    gloss: 我是单身。
    note: مجردم = مجرد + م（“我是”），与 خوبم（“我很好”）的第一人称后缀构成方式相同。
  fa.a1.unit04.lesson05.teach.i_am_married:
    title: 我已婚。
    gloss: 我已婚。
    note: متأهلم = متأهل + م（“我是”），构成方式与 مجردم 相同。
  fa.a1.unit04.lesson05.teach.nave:
    title: 孙辈
    gloss: 孙子/孙女
    note: نوه 既可指孙子也可指孙女，也可指外孙/外孙女——波斯语在这里不需要区分性别。
    example_gloss: 他/她有一个孙辈。
  fa.a1.unit04.lesson05.teach.example:
    title: 我哥哥/弟弟已婚，有一个儿子。
    gloss: 我哥哥/弟弟已婚，有一个儿子。
    note: متأهله 是口语中 “متأهل است”（已婚）的缩略形式；داره 是 “دارد”（有）的口语形式。
  fa.a1.unit04.lesson06.teach.in_photo:
    title: 这是你的全家福吗？
    gloss: 这是你的全家福吗？
    note: خانواده‌ته = “خانواده‌ی تو است”（是你的家庭……）的缩略形式，是非常常见的口语构词方式。
  fa.a1.unit04.lesson06.teach.yes_mom_dad:
    title: 是啊。这是我妈妈，这是我爸爸。
    gloss: 是啊。这是我妈妈，这是我爸爸。
    note: '*آره* 是口语中的“是”（正式说法为 *بله*）。*مامانمه* 是 *مامانم*（“我妈妈”）加上口语中表示“是”的词尾。'
  fa.a1.unit04.lesson06.teach.who_is_he:
    title: 这位先生是谁？
    gloss: 这位先生是谁？
    note: کیه = “کی است”（是谁）的缩略形式，属于口语。
  fa.a1.unit04.lesson06.teach.brother_answer:
    title: 那是我哥哥/弟弟。我有一个兄弟，没有姐妹。
    gloss: 那是我哥哥/弟弟。我有一个兄弟，没有姐妹。
    note: داداش 是亲昵的日常说法，在这里用来代替第一课中较中性的 برادر。
  fa.a1.unit04.lesson06.teach.opposite_family:
    title: 我家正好相反；我有两个姐妹，没有兄弟。
    gloss: 我家正好相反；我有两个姐妹，没有兄弟。
    note: برعکسه = “برعکس است”（是相反的）的缩略形式。
  fa.a1.unit04.lesson06.teach.closing:
    title: 那你家也很热闹啊！
    gloss: 那你家也很热闹啊！
    note: شلوغه = “شلوغ است”（拥挤/热闹）的缩略形式——用来形容孩子多的家庭，亲切而常见。
  fa.a1.unit04.lesson06.teach.formal_register_note:
    title: 正式语体：有／没有／是
    gloss: 口语：有、没有。正式书面语：有、没有；他是我的兄弟。
    note: دارد/ندارد/است 是本对话中所用口语形式 داره/نداره 的正式书面对应形式——另外，正式书面语中也会用中性的 برادر 代替亲昵的 داداش。
