teaching:
  fa.a1.unit25.lesson01.teach.oo_review:
    title: 他／她
    gloss: 他／她
    note: '*او* 在这里再次出现，作为外貌描述的主语。'
  fa.a1.unit25.lesson01.teach.ghad_review:
    title: 身高
    gloss: 身高
    note: '*قد* 在这里再次出现。*قدش* 加上了所有格后缀 *-ش*(他/她的身高),和第20单元的 *امتحانش* 构成方式相同。'
    example_gloss: 尼玛个子高。
  fa.a1.unit25.lesson01.teach.boland_word:
    title: 高
    gloss: 高的
    note: '*بلند* 意思是“高”(也可以指“长”)。*قدش بلنده* 字面意思是“他/她的身高高”,是口语中说某人个子高的自然说法。'
    example_gloss: 他个子高。
  fa.a1.unit25.lesson01.teach.kotah_word:
    title: 矮
    gloss: 矮的
    note: '*کوتاه* 意思是“矮”或“短”。'
    example_gloss: 他个子矮。
  fa.a1.unit25.lesson02.teach.mo_word:
    title: 头发
    gloss: 头发
    note: '*مو* 意思是“头发”。*موی* 是用在形容词前的埃扎菲(连接)形式,例如 *موی بلند*(长发)。'
    example_gloss: 他留着长发。
  fa.a1.unit25.lesson02.teach.moohash_word:
    title: 他/她的头发
    gloss: 他/她的头发
    note: '*موهاش* 由复数 *موها*(头发)加上所有格后缀 *-ش* 构成,意思是“他/她的头发”。'
  fa.a1.unit25.lesson02.teach.meshki_word:
    title: 黑色
    gloss: 黑色的
    note: '*مشکی* 是形容头发、眼睛黑色的日常口语词,在这里比第20单元的 *سیاه* 更自然;سیاه 更适合用来形容衣服。'
    example_gloss: 她的头发是黑色的。
  fa.a1.unit25.lesson02.teach.bolond_word:
    title: 金发的
    gloss: 金色的
    note: '*بلوند*(外来词)意思是“金色的、金发的”。'
    example_gloss: 她的头发是金色的。
  fa.a1.unit25.lesson03.teach.cheshm_word:
    title: 眼睛
    gloss: 眼睛
    note: '*چشم* 意思是“眼睛”。*چشمای* 是口语中的复数加埃扎菲形式(……的眼睛),例如 *چشمای آبی*(蓝色的眼睛)。'
    example_gloss: 他有一双棕色的眼睛。
  fa.a1.unit25.lesson03.teach.cheshmash_word:
    title: 他/她的眼睛
    gloss: 他/她的眼睛
    note: '*چشماش* 由口语复数 *چشما* 加上所有格后缀 *-ش* 构成,意思是“他/她的眼睛”。注意 *چشماش آبیه* 虽然 *چشما* 是复数,却用单数词尾 *-ه*,这在波斯语中很正常:非人的复数名词通常搭配单数动词。'
  fa.a1.unit25.lesson03.teach.ghahveei_word:
    title: 棕色
    gloss: 棕色的
    note: '*قهوه‌ای*(字面意思是“咖啡色”)意思是“棕色”。'
    example_gloss: 她的眼睛是棕色的。
  fa.a1.unit25.lesson03.teach.sabz_word:
    title: 绿色
    gloss: 绿色的
    note: '*سبز* 意思是“绿色”。'
    example_gloss: 她的眼睛是绿色的。
  fa.a1.unit25.lesson03.teach.abi_review:
    title: 蓝色
    gloss: 蓝色的
    note: '*آبی* 在这里再次出现,用来说眼睛的颜色。'
    example_gloss: 她的眼睛是蓝色的。
  fa.a1.unit25.lesson04.teach.man_review:
    title: 我
    gloss: 我
    note: '*من* 早已学过,在这里再次出现,用于描述自己。'
    example_gloss: 我的头发是棕色的。
  fa.a1.unit25.lesson04.teach.daram_review:
    title: 我有/他(她)有
    gloss: 我有/他(她)有
    note: '*دارم*/*داره* 用于身体特征时用法相同:*موی مشکی دارم* 意思是“我有黑头发”。'
  fa.a1.unit25.lesson04.teach.eynak_word:
    title: 眼镜
    gloss: 眼镜
    note: '*عینک* 意思是“眼镜”。'
    example_gloss: 他戴眼镜。
  fa.a1.unit25.lesson04.teach.mizane_word:
    title: 他/她戴
    gloss: 他／她戴
    note: '*می‌زنه*(字面意思是“打、击”)是表示戴眼镜时自然使用的动词:*عینک می‌زنه* 意思是“戴眼镜”,与第8单元、第24单元的 *می‌کنم*(做)是不同的动词。'
  fa.a1.unit25.lesson04.teach.che_shekliye_phrase:
    title: 他/她长什么样?
    gloss: 他/她长什么样?
    note: '*چه شکلیه؟* 字面意思是“是什么形状?”,是口语中询问某人长相的标准说法。'
  fa.a1.unit25.lesson04.teach.va_review:
    title: 和
    gloss: 和
    note: '*و* 意思是“和”,在第14单元和第24单元已经这样用过。'
    example_gloss: 他个子高,头发是黑色的。
  fa.a1.unit25.lesson05.teach.nima_review:
    title: 尼玛
    gloss: 尼玛
    note: '*نیما* 在第11单元就作为人物出现过,在这里再次出现。'
    example_gloss: 尼玛是萨拉的朋友。
  fa.a1.unit25.lesson05.teach.reading_text:
    title: 阅读:尼玛的外貌
    gloss: 尼玛个子高。他的头发是黑色的,眼睛是棕色的。他戴眼镜。
    note: 这篇阅读复用了第1到4课的所有句式,几乎没有新词汇,只需要在连贯的文章中认出它们。
  fa.a1.unit25.lesson06.teach.maryam_name:
    title: 玛丽亚姆
    gloss: 玛丽亚姆
    note: '*مریم* 是一个新人物,是 سارا 的朋友,نیما 还没见过她。'
    example_gloss: 玛丽亚姆是萨拉的朋友。
  fa.a1.unit25.lesson06.teach.alan_review:
    title: 现在
    gloss: 现在
    note: '*الان* 在这里再次出现。'
    example_gloss: 玛丽亚姆现在就来。
  fa.a1.unit25.lesson06.teach.miad_word:
    title: 来
    gloss: 正在来
    note: '*میاد* 是 *آمدن*(来)的口语现在时形式。'
    example_gloss: 玛丽亚姆现在就来。
  fa.a1.unit25.lesson06.teach.rangiye_phrase:
    title: 是什么颜色?
    gloss: 是什么颜色?
    note: '*چه رنگیه؟* 由 *چه*(什么,出自第4课)、*رنگی*(有颜色的,由 *رنگ* + *-ی* 构成)和 *-ه*(是)组成,意思是“是什么颜色?”'
  fa.a1.unit25.lesson06.teach.bashe_mamnoon_review:
    title: 好的,谢谢
    gloss: 好的,谢谢
    note: '*باشه* 和 *ممنون* 之前都学过,在这里组合成一句自然的结束语。'
  fa.a1.unit25.lesson06.teach.dialogue_line1:
    title: 萨拉:玛丽亚姆现在就来。
    gloss: 玛丽亚姆现在就来。
  fa.a1.unit25.lesson06.teach.dialogue_line2:
    title: 尼玛:玛丽亚姆长什么样?
    gloss: 玛丽亚姆长什么样?
  fa.a1.unit25.lesson06.teach.dialogue_line3:
    title: 萨拉:她个子高,头发是黑色的。
    gloss: 她个子高,头发是黑色的。
  fa.a1.unit25.lesson06.teach.dialogue_line4:
    title: 尼玛:她的眼睛是什么颜色?
    gloss: 她的眼睛是什么颜色?
  fa.a1.unit25.lesson06.teach.dialogue_line5:
    title: 萨拉:她的眼睛是棕色的。
    gloss: 她的眼睛是棕色的。
  fa.a1.unit25.lesson06.teach.dialogue_line6:
    title: 尼玛:好的,谢谢。
    gloss: 好的,谢谢。
