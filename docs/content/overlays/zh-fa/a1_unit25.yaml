course:
  title: 波斯语（伊朗）A1
  description: 伊朗波斯语入门：描述一个人的身高（高／矮）、头发（长短和颜色：黑色、金色）、眼睛颜色（棕色、绿色、蓝色）以及是否戴眼镜，询问“他／她长什么样？”，一篇关于 نیما 自己外貌的短文，以及 نیما 和 سارا 之间关于认出 سارا 的朋友 مریم 的结束对话。
