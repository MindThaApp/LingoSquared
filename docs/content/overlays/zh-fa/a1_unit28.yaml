    title: 对话：哪个更好？
teaching:
  fa.a1.unit28.lesson01.teach.man_review:
    title: 我
    gloss: 我
    note: '*من*（我）你已经很熟悉了，这里再次出现，用来说明自己怎么出行。'
  fa.a1.unit28.lesson01.teach.ba_word:
    title: 用 / 和
    gloss: 乘／坐；和
    note: '*با* 是搭配交通工具使用的介词：*با* + 交通工具名称 + *می‌رم* 表示“我坐/骑……去”。'
    target_text: با（乘／坐；和）
  fa.a1.unit28.lesson01.teach.otobus_review:
    title: 公共汽车
    gloss: 公共汽车
    note: '*اتوبوس* 是“公交车”的日常说法。'
    example_gloss: 我坐公交车去。
  fa.a1.unit28.lesson01.teach.ba_otobus_phrase:
    title: 我坐公交车去
    gloss: 我坐公交车去
    note: '*با اتوبوس می‌رم* 由 *با* + *اتوبوس* + *می‌رم*（我去）组成。'
  fa.a1.unit28.lesson01.teach.metro_word:
    title: 地铁
    gloss: 地铁
    note: '*مترو* 是日常直接借用的外来词，德黑兰的地铁系统就叫 *مترو*。'
    example_gloss: 我坐地铁去。
  fa.a1.unit28.lesson01.teach.ba_metro_phrase:
    title: 我坐地铁去
    gloss: 我坐地铁去
    note: '*با مترو می‌رم* 与公交车的 *با* + 交通工具 + *می‌رم* 句型完全相同。'
  fa.a1.unit28.lesson02.teach.mashin_word:
    title: 汽车
    gloss: 汽车
    note: '*ماشین* 是“汽车”的日常说法。'
    example_gloss: 我开车去。
  fa.a1.unit28.lesson02.teach.ba_mashin_phrase:
    title: 我开车去
    gloss: 我开车去
    note: '*با ماشین می‌رم* 遵循同样的 *با* + 交通工具 + *می‌رم* 句型。'
  fa.a1.unit28.lesson02.teach.docharkhe_word:
    title: 自行车
    gloss: 自行车
    note: '*دوچرخه* 意思是“自行车”，字面意思是“两个轮子”。'
    example_gloss: 我骑自行车去。
  fa.a1.unit28.lesson02.teach.ba_docharkhe_phrase:
    title: 我骑自行车去
    gloss: 我骑自行车去
    note: '*با دوچرخه می‌رم* 再次使用同一个句型。'
  fa.a1.unit28.lesson02.teach.har_rooz_review:
    title: 每天
    gloss: 每天
    note: '*هر روز*（每天）在这里再次出现，用来描述日常通勤。'
  fa.a1.unit28.lesson02.teach.sarkar_review:
    title: 工作
    gloss: 工作
    note: '*سر کار* 表示“去上班”，不需要介词，直接说 *می‌رم* + *سر کار* 即可。'
  fa.a1.unit28.lesson02.teach.har_rooz_sarkar_phrase:
    title: 我每天开车去上班
    gloss: 我每天开车去上班
    note: '*هر روز با ماشین می‌رم سر کار* 把本课内容串在一起：频率、交通工具和目的地。'
  fa.a1.unit28.lesson03.teach.piyade_word:
    title: 步行
    gloss: 步行
    note: '*پیاده* 意思是“步行”。它和前面的交通工具不同，不需要 *با*：直接说 *پیاده می‌رم*，不能说 *با پیاده می‌رم*。'
    example_gloss: 我走路去。
  fa.a1.unit28.lesson03.teach.piyade_phrase:
    title: 我走路去（不用 با）
    gloss: 我走路去
    note: '*پیاده می‌رم*：这里的 *پیاده* 起副词的作用，和汉语的“步行去”“走着去”类似，前面不需要介词。'
    target_text: پیاده می‌رم（不用 با）
  fa.a1.unit28.lesson03.teach.taxi_word:
    title: 出租车
    gloss: 出租车
    note: '*تاکسی* 是日常直接借用的外来词，意思是出租车，和其他交通工具一样需要搭配 *با*。'
    example_gloss: 我坐出租车去。
  fa.a1.unit28.lesson03.teach.ba_taxi_phrase:
    title: 我坐出租车去
    gloss: 我坐出租车去
    note: '*با تاکسی می‌رم* 遵循常规的 *با* + 交通工具句型。'
  fa.a1.unit28.lesson03.teach.kodoom_word:
    title: 哪一个
    gloss: 哪个
    note: '*کدوم* 意思是“哪个”，这里用来询问哪种交通工具更好。'
    target_text: کدوم（哪个）
  fa.a1.unit28.lesson03.teach.behtare_review:
    title: 更好
    gloss: 更好
    note: '*بهتره* 的意思是“更好”。'
  fa.a1.unit28.lesson03.teach.ya_review:
    title: 或
    gloss: 或者
    note: '*یا* 在这里连接两个交通工具选项，意思是“或者”。'
    target_text: یا（或者）
  fa.a1.unit28.lesson03.teach.kodoom_behtare_phrase:
    title: 公交车还是地铁，哪个更好？
    gloss: 公交车还是地铁，哪个更好？
    note: '*اتوبوس یا مترو، کدوم بهتره؟* 用 *یا* 列出选项，再用 *کدوم بهتره؟* 请对方推荐。'
  fa.a1.unit28.lesson04.teach.belit_review:
    title: 票
    gloss: 车票
    note: '*بلیط*（票）在这里再次出现，指日常的本地公交车票。'
    example_gloss: 公交车票在哪里？
  fa.a1.unit28.lesson04.teach.gheymat_review:
    title: 价格
    gloss: 价格
    note: '*قیمت* 意思是“价格”。'
  fa.a1.unit28.lesson04.teach.cheghadr_review:
