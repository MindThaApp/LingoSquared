  fa.a1.unit28.lesson05.teach.reading_text:
    title: 阅读：尼玛和萨拉的通勤
    gloss: 尼玛每天坐公交车去上班。有时他也走路去。萨拉每天骑自行车去上学。
    note: 这篇短文用到了前四课的所有句型，以及本课自己的 *می‌ره* 和 *مدرسه*，几乎没有新词，重点是在连贯的文章中认出它们。
  fa.a1.unit28.lesson06.teach.tochi_review:
    title: 你呢？
    gloss: 你呢？
