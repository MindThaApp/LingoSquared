course:
  title: 波斯语（伊朗）A1
  description: 伊朗波斯语入门：说出各种出行方式（公交车、地铁、汽车、自行车、步行、出租车），表达日常通勤方式（每天坐公交车上班），询问哪种交通工具更好（اتوبوس یا مترو، کدوم بهتره؟），询问当地票价并读懂简短的交通时刻表句子，阅读关于 نیما 和 سارا 日常通勤的短文，以及 نیما 和 سارا 比较各自出行方式的结尾对话。
