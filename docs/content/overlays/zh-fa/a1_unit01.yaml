teaching:
  fa.a1.unit01.lesson01.teach.rtl:
    title: 波斯语从右往左书写
    gloss: 波斯语从右往左书写。
    note: 阅读波斯语时，从右边开始向左读。
  fa.a1.unit01.lesson01.teach.seen:
    title: 字母 س
    gloss: s
    note: س 通常表示 s 的发音。
  fa.a1.unit01.lesson01.teach.lam:
    title: 字母 ل
    gloss: l
    note: ل 表示 l 的发音，并且可以与前后的字母连写。
  fa.a1.unit01.lesson01.teach.alef:
    title: 字母 ا
    gloss: ā / a
    note: ا 通常表示长元音 ā，并且不与后面的字母连写。
  fa.a1.unit01.lesson01.teach.mim:
    title: 字母 م
    gloss: m
    note: م 表示 m 的发音，连写时字形会变化。
  fa.a1.unit01.lesson01.teach.salam_shape:
    title: 拼写 سلام
    gloss: 你好
    note: سلام 读作 salâm。波斯语书写中通常省略短元音。
    example_gloss: 你好！我是尼玛。
  fa.a1.unit01.lesson02.teach.salam:
    title: 你好
    gloss: 你好
    note: سلام 在正式和非正式场合都可以使用。
    example_gloss: 嗨，你好吗？
  fa.a1.unit01.lesson02.teach.sobh_bekheyr:
    title: 早上好
    gloss: 早上好
    note: صبح بخیر 是一种礼貌而中性的早晨问候语。
  fa.a1.unit01.lesson02.teach.asr_bekheyr:
    title: 下午好或晚上好
    gloss: 下午好 / 晚上好
    note: عصر بخیر 从下午晚些时候到晚上都可以使用。
  fa.a1.unit01.lesson02.teach.khodahafez:
    title: 再见
    gloss: 再见
    note: خداحافظ 读作 khodâhâfez，是最通用的标准告别语。
    example_gloss: 再见，回头见！
  fa.a1.unit01.lesson02.teach.mamnoon:
    title: 谢谢
    gloss: 谢谢
    note: ممنون 常用且自然；متشکرم 则稍微正式一些。
    example_gloss: 非常感谢。
  fa.a1.unit01.lesson02.teach.khahesh_mikonam:
    title: 不客气
    gloss: 不客气
    note: خواهش می‌کنم 是回应感谢的惯用说法。
  fa.a1.unit01.lesson02.teach.hale_shoma:
    title: 你好吗？礼貌的口语说法
    gloss: 您好吗?
    note: حالتون چطوره؟ 是礼貌而中性的伊朗波斯语口语说法。حال شما چطور است؟ 则是更正式或书面的对应说法。
  fa.a1.unit01.lesson02.teach.khoobam:
    title: 我很好
    gloss: 我很好
    note: خوبم 由 خوب 加第一人称词尾 ـم 构成。
  fa.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: 日安
    gloss: 日安
    note: روز بخیر 很礼貌，但在随意的口语中不如 سلام 常用。
  fa.a1.unit01.lesson03.teach.shab_bekheyr:
    title: 晚安
    gloss: 晚安
    note: شب بخیر 通常用作告别语或睡前祝福，而不是开场问候。
  fa.a1.unit01.lesson03.teach.khosh_amadeed:
    title: 欢迎
    gloss: 欢迎
    note: خوش آمدید 是对一位或多位客人使用的礼貌说法。
  fa.a1.unit01.lesson03.teach.be_omide_didar:
    title: 期待再见
    gloss: 期待再见／后会有期
    note: به امید دیدار 是一种文雅、礼貌而中性的告别语。
  fa.a1.unit01.lesson03.teach.fealan:
    title: 回头见
    gloss: 回头见
    note: فعلاً 偏口语，比 خداحافظ 随意。
  fa.a1.unit01.lesson03.teach.rooze_khoobi:
    title: 祝您今天愉快
    gloss: 祝您今天愉快
    note: 在这句固定的告别语中，باشید 表示礼貌的形式。
  fa.a1.unit01.lesson04.teach.formal_question:
    title: 中性礼貌的口语说法
    gloss: 您好吗?
    note: 对不熟悉的成年人，或在普通的礼貌交谈中，使用 حالتون چطوره؟。明确的正式或书面说法是 حال شما چطور است؟
  fa.a1.unit01.lesson04.teach.informal_question:
    title: 非正式
    gloss: 您好吗?
    note: چطوری؟ 偏口语，在关系允许时，适用于朋友、家人和同辈之间。
  fa.a1.unit01.lesson04.teach.to:
    title: 非正式的“你”
    gloss: 你
    note: تو 是单数且不正式的说法；对不熟悉的成年人不要默认使用。
  fa.a1.unit01.lesson04.teach.very_well:
    title: 非常好
    gloss: 我非常好
    note: خیلی 加强了 خوبم 的程度。
  fa.a1.unit01.lesson04.teach.not_bad:
    title: 不错
    gloss: 我还不错，谢谢
    note: بد نیستم 是一种自然而适度的回答，并不是抱怨。
  fa.a1.unit01.lesson04.teach.and_you_formal:
    title: 您呢？礼貌说法
    gloss: 您呢?
    note: 用 شما چطور؟ 礼貌地把问题反问回去。
  fa.a1.unit01.lesson04.teach.and_you_informal:
    title: 你呢?非正式
    gloss: 您呢?
    note: تو چطور؟ 适用于关系随意的人之间。
  fa.a1.unit01.lesson05.teach.chai:
    title: 茶
    gloss: 茶
    note: '*چای* 指茶这种饮品。你会在招待用语 *چای بفرمایید*（请喝茶）中听到它。'
    example_gloss: 请问您要喝点茶吗？
  fa.a1.unit01.lesson05.teach.befarmaeed:
    title: 请，请便
    gloss: 请／请便／给您
    note: '*بفرمایید* 会随情境而变化：可以表示“给您”（递茶时）、“请进”（在门口）或“您先请”。'
  fa.a1.unit01.lesson05.teach.lotf_dareed:
    title: 您过奖了
    gloss: 您太客气了
    note: لطف دارید 用来礼貌地回应夸奖。
  fa.a1.unit01.lesson05.teach.zahmat_nakeshid:
    title: 请不要麻烦了
    gloss: 请不必费心
    note: زحمت نکشید 可以是真心的拒绝，也可以是对具体邀请或招待的礼貌的初次回应。
  fa.a1.unit01.lesson05.teach.mamnoon_lotf:
    title: 感谢您的好意
    gloss: 感谢您的好意
    note: 这比单说 ممنون 更温暖、更明确。
  fa.a1.unit01.lesson05.teach.cultural_pattern:
    title: 塔罗夫
    gloss: 因情境而异的伊朗礼仪习惯
    note: 塔罗夫（taarof）指在招待、推辞、致谢和表示敬意时，因情境而异的一套习惯。具体做法会因关系、年龄层、地区和场合而不同；并没有固定的推辞次数或重复次数，可以用来判断一个邀请是否出于真心。
  fa.a1.unit01.lesson06.teach.line01:
    title: 欢迎
    gloss: 阿里欢迎纳尔吉斯。
    note: 对话先问候，再做自我介绍。
  fa.a1.unit01.lesson06.teach.line02:
    title: 欢迎，回应
    gloss: 纳尔吉斯回应他的问候并向他道谢。
    note: ممنون（谢谢）是回应欢迎时很自然的说法。
  fa.a1.unit01.lesson06.teach.line03:
    title: 互相介绍姓名
    gloss: 阿里介绍自己是谁。
    note: '*من علی هستم* 的意思是“我是阿里”。*هستم*（是）放在句子末尾。'
  fa.a1.unit01.lesson06.teach.line04:
    title: 互相介绍姓名，回答
    gloss: 纳尔吉斯介绍自己是谁。
    note: 和阿里刚才用的 *من ... هستم* 句型相同。
  fa.a1.unit01.lesson06.teach.line05:
    title: 幸会
    gloss: 阿里说很高兴认识她。
    note: '*خوشوقتم* 的意思是“我很高兴”。与 *از آشنایی با شما* 连用，就是初次见面时标准的礼貌用语。'
  fa.a1.unit01.lesson06.teach.line06:
    title: 很高兴认识你，回应
    gloss: 纳尔吉斯作出同样的回应。
    note: 在这句回答中，همین‌طور 表示“同样”“彼此彼此”。
  fa.a1.unit01.lesson06.teach.line07:
    title: 询问对方好不好
    gloss: 阿里礼貌地问她好不好。
    note: 因为这是礼貌的初次见面，阿里使用了中性礼貌的口语形式 ـتون。
  fa.a1.unit01.lesson06.teach.line08:
    title: 询问对方好不好，回应
    gloss: 纳尔吉斯作答，并把问题反问回去。
    note: شما چطور؟ 沿用同一个问题反问对方，是一种常见的简便说法。
  fa.a1.unit01.lesson06.teach.line09:
    title: 邀请
    gloss: 阿里说自己也很好，并请纳尔吉斯进去。
    note: '*بفرمایید داخل* 的意思是“请进”。*داخل*（里面）表明所邀请的内容。'
  fa.a1.unit01.lesson06.teach.line10:
    title: 礼貌地拒绝
    gloss: 纳尔吉斯向他道谢，但解释说自己得走了。
    note: 礼貌的拒绝也要先道谢，再说推辞的话。*ولی باید برم* 的意思是“但我得走了”。
  fa.a1.unit01.lesson06.teach.line11:
    title: 结束对话
    gloss: 阿里接受了她的回答，并希望再见面。
    note: 邀请被婉拒后，自然就转入了告别。
  fa.a1.unit01.lesson06.teach.line12:
    title: 结束对话，回答
    gloss: 纳尔吉斯说再见。
    note: '*خداحافظ* 是标准的通用告别语。'
