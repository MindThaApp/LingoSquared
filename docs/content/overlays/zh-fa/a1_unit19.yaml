course:
  title: 波斯语（伊朗）A1
  description: 伊朗波斯语入门：基础房间词汇、用数字描述住房、家居用品、家中的位置、阅读简短的住房介绍，以及关于某人家的对话。
units:
  fa.a1.unit19.housing:
    title: 住房
    description: 描述一个基本的家：房间、家居用品和位置。
lessons:
  fa.a1.unit19.lesson01.basic_room_vocab:
    title: 基础房间词汇
  fa.a1.unit19.lesson02.describing_with_numbers:
    title: 用数字描述住房
  fa.a1.unit19.lesson03.household_objects:
    title: 家居用品
  fa.a1.unit19.lesson04.location_in_home:
    title: 家中的位置
  fa.a1.unit19.lesson05.reading_a_housing_description:
    title: 阅读住房介绍
  fa.a1.unit19.lesson06.housing_dialogue:
    title: 关于家的对话
teaching:
  fa.a1.unit19.lesson01.teach.khoone_word:
    title: 房子
    gloss: 房子
    note: خونه 的意思是房子／家（是 خانه 的口语形式）。
    example_gloss: 我的房子很大。
  fa.a1.unit19.lesson01.teach.otagh_khab_word:
    title: 卧室
    gloss: 卧室
    note: اتاق خواب 字面意思是“睡觉的房间”，即卧室。
    example_gloss: 它有两间卧室。
  fa.a1.unit19.lesson01.teach.ashpazkhone_word:
    title: 厨房
    gloss: 厨房
    note: آشپزخانه 的意思是厨房。
    example_gloss: 厨房很大。
  fa.a1.unit19.lesson01.teach.hamoom_word:
    title: 浴室
    gloss: 浴室
    note: حموم 的意思是浴室（是 حمام 的口语形式）。
    example_gloss: 浴室很干净。
  fa.a1.unit19.lesson02.teach.chand_ta_word:
    title: 多少个
    gloss: 多少
    note: چند تا 的意思是“多少个”，用于可数名词。
    target_text: چند تا（多少个）
  fa.a1.unit19.lesson02.teach.do_ta_word:
    title: 二
    gloss: 二
    note: دو تا 的意思是“两个”（可数的东西）。
    example_gloss: 它有两个浴室。
  fa.a1.unit19.lesson02.teach.dare_word:
    title: 它有
    gloss: 它有
    note: داره 是 دارد（有）的口语缩略形式，用于描述家里有什么。
    target_text: داره（它有，口语）
  fa.a1.unit19.lesson03.teach.takht_word:
    title: 床
    gloss: 床
    note: تخت 的意思是床。
    example_gloss: 床在卧室里。
  fa.a1.unit19.lesson03.teach.miz_word:
    title: 桌子
    gloss: 桌子
    note: میز 的意思是桌子。
    example_gloss: 桌子在窗户旁边。
  fa.a1.unit19.lesson03.teach.sandali_word:
    title: 椅子
    gloss: 椅子
    note: صندلی 的意思是椅子。
    example_gloss: 桌子旁边有一把椅子。
  fa.a1.unit19.lesson03.teach.ye_word:
    title: 一个
    gloss: 一个
    note: یه 是 یک（一个）的口语缩略形式。
    target_text: یه（一个，口语）
  fa.a1.unit19.lesson03.teach.va_word:
    title: 和
    gloss: 和
    note: و 的意思是“和”，连接两个分句或两个事物。
    target_text: و（和）
  fa.a1.unit19.lesson04.teach.too_word:
    title: 在……里
    gloss: 在……里
    note: تو 的意思是“在……里”，表示在房间内的位置。
    target_text: تو（在……里）
  fa.a1.unit19.lesson04.teach.kenar_word:
    title: 在……旁边
    gloss: 在旁边
    note: کنار 的意思是“在……旁边”。
    target_text: کنار（在……旁边）
  fa.a1.unit19.lesson04.teach.balaye_word:
    title: 在……上面
    gloss: 在……上面
    note: بالای 的意思是“在……上面”。
    target_text: بالای（在……上面）
  fa.a1.unit19.lesson04.teach.takhte_word:
    title: 这是床
    gloss: 是床
    note: '*تخته* 是 *تخت*（床）加上口语中表示“是”的 -e（来自 *است*）。在 *میز کنار تخته* 中，末尾的 -e 使这个短语成为一个句子：桌子［是］在床旁边。'
    target_text: تخته（是床，口语）
  fa.a1.unit19.lesson04.teach.ashpazkhones_word:
    title: 这是厨房
    gloss: 是厨房
    note: '*آشپزخانه‌س* 是 *آشپزخانه*（厨房）加上元音之后口语中表示“是”的形式（来自 *است*）。在 *صندلی تو آشپزخانه‌س* 中它位于句末：椅子［是］在厨房里。'
    target_text: آشپزخانه‌س（是厨房，口语）
  fa.a1.unit19.lesson05.teach.ham_word:
    title: 也
    gloss: 也
    note: هم 的意思是“也”，放在它所修饰的词之后。
    target_text: هم（也）
  fa.a1.unit19.lesson05.teach.man_word:
    title: 我
    gloss: 我
    note: من 的意思是“我”。
    example_gloss: 我家有两间卧室。
  fa.a1.unit19.lesson05.teach.khoonye_word:
    title: ……的家 / 我的家
    gloss: ……的房子／我的房子
    note: خونه‌ی 是 خونه 的 ezafe 形式，用在所有者之前（خونه‌ی من = 我的房子）。
    target_text: خونه‌ی（……的房子／我的房子，ezafe 形式）
  fa.a1.unit19.lesson05.teach.reading_text:
    title: 住房介绍示例
    gloss: 我家有两间卧室，还有一个厨房和一个浴室。
    note: 一段简短的第一人称描述，综合运用了本单元的住房词汇。
  fa.a1.unit19.lesson06.teach.names:
    title: 尼马和萨拉
    gloss: 尼马，萨拉
    note: 本课程中常用的伊朗人名。
    example_gloss:
    - 尼马的房子很大。
    - 萨拉的房子很小。
  fa.a1.unit19.lesson06.teach.khoonet_chetore_phrase:
    title: 你家怎么样？
    gloss: 你家怎么样？
    note: خونه‌ت چطوره؟ 由 خونه‌ت（你的家）和 چطوره؟（怎么样？）组成。
  fa.a1.unit19.lesson06.teach.khoobe_word:
    title: 很好
    gloss: 很好
    note: خوبه 是 خوب است（很好）的口语缩略形式。
    example_gloss: 这个房子很好。
  fa.a1.unit19.lesson06.teach.aare_word:
    title: 嗯
    gloss: 嗯
    note: آره 是 بله（是的）的口语形式。
    example_gloss: 嗯，很好。
  fa.a1.unit19.lesson06.teach.dialogue_line1:
    title: 尼马问
    gloss: 你家怎么样？
  fa.a1.unit19.lesson06.teach.dialogue_line2:
    title: 萨拉回答
    gloss: 很好。有两间卧室和一个厨房。
  fa.a1.unit19.lesson06.teach.dialogue_line3:
    title: 尼马问
    gloss: 也有浴室吗？
  fa.a1.unit19.lesson06.teach.dialogue_line4:
    title: 萨拉回答
    gloss: 嗯，也有一个浴室。
