teaching:
  fa.a1.unit02.lesson01.teach.noon_te:
    title: 字母 ن 和 ت
    gloss: n 和 t
    note: ن 表示 n。ت 表示 t；两者左右两边都可以连写。
  fa.a1.unit02.lesson01.teach.sheen_che:
    title: 字母 ش 和 چ
    gloss: sh 和 ch
    note: ش 表示 sh，چ 表示 ch。
  fa.a1.unit02.lesson01.teach.ye_he:
    title: 字母 ی 和 ه
    gloss: y／长音 i 和 h
    note: ی 读作 y 或长音 ī。ه 是 h，连写时字形会变化。
  fa.a1.unit02.lesson01.teach.ke_gaf:
    title: 字母 ک 和 گ
    gloss: k 和 g
    note: ک 表示 k；打字时请使用波斯语的 ک，而不是外形相似的阿拉伯语字母。گ 是在 ک 上多加一笔，表示 g。
  fa.a1.unit02.lesson01.teach.jim_dal:
    title: 字母 ج 和 د
    gloss: j 和 d
    note: ج 表示 j。د 表示 d，且不与左边的字母相连。
  fa.a1.unit02.lesson01.teach.re_fe:
    title: 字母 ر 和 ف
    gloss: r 和 f
    note: ر 表示 r，不与左边的字母相连；ف 表示 f。
  fa.a1.unit02.lesson01.teach.vav_be:
    title: 字母 و 和 ب
    gloss: v／o／u 和 b
    note: و 可以表示 v，也可以表示元音，且不与左边的字母相连。ب 表示 b。
  fa.a1.unit02.lesson01.teach.khe_ze:
    title: 字母 خ 和 ز
    gloss: kh 和 z
    note: خ 就是通常写作 kh 的音；ز 表示 z。
  fa.a1.unit02.lesson02.teach.esm:
    title: 名字
    gloss: 名字
    note: 在伊朗的日常波斯语中，اسم 读作 esm。
    example_gloss: 我叫萨拉。
  fa.a1.unit02.lesson02.teach.man:
    title: 我
    gloss: 我
    note: من 是第一人称单数代词。
  fa.a1.unit02.lesson02.teach.sara:
    title: 萨拉
    gloss: 萨拉
    note: سارا 是伊朗常见的人名。
    example_gloss: 萨拉是我的朋友。
  fa.a1.unit02.lesson02.teach.formal_name:
    title: 正式或书面的自我介绍
    gloss: 我叫萨拉。
    note: '*اسم من سارا است* 是正确的，但比较正式；多见于书面。'
  fa.a1.unit02.lesson02.teach.spoken_name:
    title: 自然的口语自我介绍
    gloss: 我叫萨拉。
    note: اسمم 是 اسم من 的缩略形式，而 ساراست 是 سارا 和 است 连在一起。
  fa.a1.unit02.lesson02.teach.polite_question:
    title: 礼貌地询问姓名
    gloss: 你叫什么名字？
    note: اسم شما چیه؟ 是伊朗波斯语中普通的、中性礼貌的口语说法。
  fa.a1.unit02.lesson02.teach.informal_question:
    title: 非正式地询问姓名
    gloss: 你叫什么名字？
    note: اسمت چیه؟ 是单数的非正式说法；只在关系允许时使用。
  fa.a1.unit02.lesson03.teach.man:
    title: 我
    gloss: 我
    note: من 没有语法上的性。
  fa.a1.unit02.lesson03.teach.to:
    title: 你（非正式单数）
    gloss: 你
    note: تو 是非正式的单数，礼貌称呼通常用 شما。
  fa.a1.unit02.lesson03.teach.oo:
    title: 他或她
    gloss: 他／她
    note: او 不分性别，可以指“他”，也可以指“她”。
  fa.a1.unit02.lesson03.teach.man_hastam:
    title: 我是
    gloss: 我是
    note: هستم 是 بودن 的第一人称单数完整形式。
  fa.a1.unit02.lesson03.teach.to_hasti:
    title: 你是
    gloss: 您是；你们是
    note: هستی 与非正式单数的 تو 搭配。
  fa.a1.unit02.lesson03.teach.oo_hast:
    title: 他或她是
    gloss: 他／她是；他／她在
    note: هست 是第三人称单数的完整形式，常表示存在或带有强调。
  fa.a1.unit02.lesson03.teach.oo_ast:
    title: 正式的身份表述
    gloss: 他或她是伊朗人。
    note: 在中性的正式书面语判断句中，است 是普通的第三人称系动词。
  fa.a1.unit02.lesson03.teach.spoken_copula:
    title: 口语中的判断谓语
    gloss: 他/她是伊朗人。
    note: ایرانیه 是 ایرانی است 自然的口语缩读形式。
  fa.a1.unit02.lesson04.teach.iran:
    title: 伊朗
    gloss: 伊朗
    note: ایران 是一个国家的名称。
    example_gloss: 我是伊朗人。
  fa.a1.unit02.lesson04.teach.iranian:
    title: 伊朗人
    gloss: 伊朗的；伊朗人
    note: ایرانی 可以表示国籍或出身。
    example_gloss: 我是伊朗人。
  fa.a1.unit02.lesson04.teach.england:
    title: 英格兰
    gloss: 英格兰
    note: '*انگلیس* 通常指英格兰；在日常口语中，伊朗人常用它指整个英国。'
    example_gloss: 我来自英国。
  fa.a1.unit02.lesson04.teach.english:
    title: 英国的；英语
    gloss: 英国的；英语
    note: انگلیسی 可以表示国籍、语言，或与英国相关的事物，具体含义要看上下文。
    example_gloss: 我是英国人。
  fa.a1.unit02.lesson04.teach.france:
    title: 法国
    gloss: 法国
    note: فرانسه 是国家名称“法国”。
    example_gloss: 我来自法国。
  fa.a1.unit02.lesson04.teach.french:
    title: 法国的；法语
    gloss: 法国的；法语
    note: فرانسوی 可以表示国籍，或与法国相关的事物。
    example_gloss: 我是法国人。
  fa.a1.unit02.lesson04.teach.country:
    title: 国家
    gloss: 国家
    note: کشور 是表示“国家”的通用词。
    example_gloss: 伊朗是一个国家。
  fa.a1.unit02.lesson04.teach.nationality:
    title: 国籍
    gloss: 国籍
    note: ملیت 是表示“国籍”的正式名词。
    example_gloss: 您的国籍是什么？
  fa.a1.unit02.lesson05.teach.ahl:
    title: 来自或原籍
    gloss: 来自／原籍
    note: اهل 把人与其籍贯或出身地联系起来，并不单纯表示目前住在某地。
    example_gloss: 他/她来自英国。
  fa.a1.unit02.lesson05.teach.koja:
    title: 哪里
    gloss: 哪里
    note: کجا 用来询问地点。
    example_gloss: 您是哪里人？
  fa.a1.unit02.lesson05.teach.formal_question:
    title: 正式的标准问法
    gloss: 您是哪里人?
    note: اهل کجا هستید؟ 是礼貌的标准波斯语，适用于正式场合或认真的书面阅读。
  fa.a1.unit02.lesson05.teach.polite_spoken_question:
    title: 中性礼貌的口语问法
    gloss: 您是哪里人?
    note: اهل کجا هستین؟ 是伊朗波斯语中普通的礼貌口语形式。
  fa.a1.unit02.lesson05.teach.informal_question:
    title: 非正式问法
    gloss: 您是哪里人?
    note: اهل کجایی؟ 是非正式的单数（对一个人）说法。
  fa.a1.unit02.lesson05.teach.origin_answer:
    title: 说明自己的出身地
    gloss: 我来自伊朗。
    note: من اهل ایران هستم 说明的是出身地，而不是目前的居住地。
  fa.a1.unit02.lesson05.teach.nationality_answer:
    title: 简短的国籍回答
    gloss: 我是伊朗人。
    note: '*ایرانی‌ام* 是在 *ایرانی* 后加上词尾 *ـام*（我是），词尾前要写一个小的半空格。'
  fa.a1.unit02.lesson06.teach.arrival:
    title: 确认地点
    gloss: 萨拉问这里是不是波斯语班。
    note: ببخشید 用来在提出实际问题之前礼貌地引起对方注意。
  fa.a1.unit02.lesson06.teach.yes:
    title: 是
    gloss: 是
    note: بله 是中性礼貌的“是”。
    example_gloss: 是的，当然。
  fa.a1.unit02.lesson06.teach.meet_mina:
    title: 米娜自我介绍
    gloss: 米娜确认了地点，介绍了自己，并问萨拉叫什么名字。
    note: 这种礼貌的口语问法适合两位成年人在课堂上初次见面。
  fa.a1.unit02.lesson06.teach.sara_name:
    title: 萨拉说出自己的名字
    gloss: 我叫萨拉。
    note: 萨拉使用了之前学过的简洁口语句式。
  fa.a1.unit02.lesson06.teach.ask_origin:
    title: 米娜询问对方的籍贯
    gloss: 您是哪里人?
    note: هستین 让对话既礼貌又带有口语色彩。
  fa.a1.unit02.lesson06.teach.exchange_origins_sara:
    title: 交流各自的来历
    gloss: 萨拉说她来自英国，并问米娜是不是伊朗人。
    note: 两人刚认识，所以都保持使用礼貌的形式。
  fa.a1.unit02.lesson06.teach.exchange_origins_mina:
    title: 交流来自哪里，回应
    gloss: 米娜确认自己是伊朗人。
    note: '*ایرانی‌ام* 是 *ایرانی هستم*（我是伊朗人）的简短形式。'
  fa.a1.unit02.lesson06.teach.pleased:
    title: 回应自我介绍
    gloss: 萨拉说很高兴认识米娜。
    note: از آشنایی با شما خوشوقتم 为两人的交谈画上了自然的句号。
  fa.a1.unit02.lesson06.teach.pleased_and_enter:
    title: 回应问候并进入教室
    gloss: 米娜说她也很高兴，并请萨拉进去。
    note: من هم همین‌طور 回应了萨拉礼貌的问候，随后 بفرمایید داخل 推进了课堂的情景。
