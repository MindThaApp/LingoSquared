course:
  title: 波斯语（伊朗）A1
  description: 伊朗波斯语入门：学习“爱好/空闲时间”的概念，四种日常活动（读书、听音乐、看电影、运动/足球），谈论做这些事的频率，询问别人空闲时间做什么，一篇关于 نیما 爱好的短文阅读，以及 نیما 和 سارا 的结束对话。
