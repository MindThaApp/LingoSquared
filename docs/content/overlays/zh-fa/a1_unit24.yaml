teaching:
  fa.a1.unit24.lesson01.teach.vaght_azad_phrase:
    title: 空闲时间
    gloss: 空闲时间
    note: '*وقت آزاد* 意思是空闲时间，字面意思是“空闲的/空着的时间”。'
  fa.a1.unit24.lesson01.teach.sargarmi_word:
    title: 爱好
    gloss: 爱好
    note: '*سرگرمی* 意思是爱好或消遣。'
    example_gloss: 读书是一种爱好。
  fa.a1.unit24.lesson01.teach.ketab_khoondan_phrase:
    title: 读书
    gloss: 读书
    note: '*کتاب خوندن* 字面意思是“书-读”：*کتاب*（书）之前学过，*خوندن*（读）是这里的新词。'
  fa.a1.unit24.lesson01.teach.doost_daram_review:
    title: 我喜欢……
    gloss: 我喜欢
    note: '*دوست دارم* 后面接活动和接事物的用法一样：*کتاب خوندن دوست دارم* 意思是“我喜欢读书”。'
  fa.a1.unit24.lesson02.teach.musiqi_review:
    title: 音乐
    gloss: 音乐
    note: '*موسیقی* 在这里再次出现。'
    example_gloss: 我听音乐。
  fa.a1.unit24.lesson02.teach.goosh_midam_phrase:
    title: 我听
    gloss: 我听
    note: '*گوش می‌دم* 字面意思是“我给耳朵”，是波斯语中表达“我听”的自然说法。'
  fa.a1.unit24.lesson02.teach.film_review:
    title: 电影
    gloss: 电影
    note: '*فیلم* 在这里再次出现。'
    example_gloss: 我看电影。
  fa.a1.unit24.lesson02.teach.mibinam_word:
    title: 我看 / 我见
    gloss: 我看 / 我见
    note: '*می‌بینم* 是这个动词的现在时形式，其过去时（*دیدم*，“我看见了”）之前已经学过。'
  fa.a1.unit24.lesson03.teach.varzesh_word:
    title: 运动
    gloss: 运动
    note: '*ورزش* 既可指“体育运动”，也可泛指“锻炼”。'
    example_gloss: 我锻炼身体。
  fa.a1.unit24.lesson03.teach.mikonam_review:
    title: 我做
    gloss: 我做
    note: '*می‌کنم* 是通用的“我做”动词，用于复合动词，例如 *ورزش می‌کنم*（我运动）。'
  fa.a1.unit24.lesson03.teach.footbal_word:
    title: 足球
    gloss: 足球
    note: '*فوتبال* 意思是足球。'
    example_gloss: 我喜欢足球。
  fa.a1.unit24.lesson03.teach.bazi_phrase:
    title: 我踢足球
    gloss: 我踢足球
    note: '*بازی* 意思是玩/比赛：*فوتبال بازی می‌کنم* 字面意思是“我做足球游戏”。'
  fa.a1.unit24.lesson04.teach.hafte_word:
    title: 周
    gloss: 周、星期
    note: '*هفته* 意思是周。'
    example_gloss: 我每周都运动。
  fa.a1.unit24.lesson04.teach.har_hafte_phrase:
    title: 每周
    gloss: 每周
    note: '*هر* 同样可以和 *هفته* 组合成 *هر هفته*（每周）。'
  fa.a1.unit24.lesson04.teach.gahi_word:
    title: 有时
    gloss: 有时
    note: '*گاهی* 意思是有时。'
    example_gloss: 我有时读书。
  fa.a1.unit24.lesson04.teach.free_time_question:
    title: 你空闲时做什么？
    gloss: 你空闲时做什么？
    note: '*چیکار می‌کنی* 之前学过，这里用它来专门询问空闲时间做什么。'
  fa.a1.unit24.lesson05.teach.nima_review:
    title: 尼马
    gloss: 尼马
    note: '*نیما* 在第11单元就已作为人物出现，这里再次出现。'
    example_gloss: 尼马喜欢读书。
  fa.a1.unit24.lesson05.teach.chand_ta_phrase:
    title: 几个 / 多少个
    gloss: 几个 / 多少个
    note: '*چند*（多少/几）与量词 *تا* 组合，放在可数名词前，表示“几个”或“多少个”。'
  fa.a1.unit24.lesson05.teach.mikhone_word:
    title: 他/她读
    gloss: 他/她读
    note: '*می‌خونه* 是 *خوندن*（读）的第三人称口语形式。'
  fa.a1.unit24.lesson05.teach.ham_word:
    title: 也
    gloss: 也
    note: '*هم* 意思是“也”，在第11单元就已这样使用过。'
    example_gloss: 尼马也踢足球。
  fa.a1.unit24.lesson05.teach.mikone_word:
    title: 他/她做
    gloss: 他/她做
    note: '*می‌کنه* 是 *می‌کنم*（我做）的第三人称口语形式。'
  fa.a1.unit24.lesson05.teach.reading_text:
    title: 阅读：尼马的空闲时间
    gloss: 尼马喜欢读书。他每周读几本书。有时他也踢足球。
    note: '*کتاب* 前面的 *چند تا* 意思是“几本书”；*می‌خونه* 和 *می‌کنه* 是谈论别人时用的第三人称口语形式。'
  fa.a1.unit24.lesson06.teach.sara_review:
    title: 萨拉
    gloss: 萨拉
    note: '*سارا* 在第14单元就已作为人物出现，这里再次出现。'
    example_gloss: 萨拉喜欢看电影。
  fa.a1.unit24.lesson06.teach.didan_word:
    title: 看 / 观看
    gloss: 看 / 观看
    note: '*دیدن* 是这个动词的不定式形式，其现在时（*می‌بینم*）在第2课学过，过去时（*دیدم*）在第13单元学过。'
    example_gloss: 我喜欢看电影。
  fa.a1.unit24.lesson06.teach.sinama_miram_phrase:
    title: 我去电影院
    gloss: 我去电影院
    note: '*سینما*（电影院）之前学过；*می‌رم*（我去）出现在之前学过的 *می‌رم سر کار*（我去上班）中。'
  fa.a1.unit24.lesson06.teach.chi_word:
    title: 什么
    gloss: 什么
    note: '*چی* 意思是“什么”，第14单元的 *تو چی؟*（你呢？）中已经这样用过。'
    example_gloss: 你呢？
  fa.a1.unit24.lesson06.teach.va_word:
    title: 和
    gloss: 和
    note: '*و* 意思是“和”，第14单元就已这样使用过。'
    example_gloss: 我喜欢读书，也喜欢足球。
  fa.a1.unit24.lesson06.teach.che_khoob_phrase:
    title: 真好！
    gloss: 真好！
    note: '*چه خوب!* 之前学过，是常见的积极回应，类似“太棒了！”。'
  fa.a1.unit24.lesson06.teach.dialogue_line1:
    title: 尼马：萨拉，你空闲时间做什么？
    gloss: 萨拉，你空闲时间做什么？
  fa.a1.unit24.lesson06.teach.dialogue_line2:
    title: 萨拉：我喜欢看电影……
    gloss: 我喜欢看电影。我每周去电影院。你呢？
  fa.a1.unit24.lesson06.teach.dialogue_line3:
    title: 尼马：我喜欢读书……
    gloss: 我喜欢读书。有时我也踢足球。
  fa.a1.unit24.lesson06.teach.dialogue_line4:
    title: 萨拉：真好！
    gloss: 真好！
