teaching:
  fa.a1.unit13.lesson01.teach.diruz_word:
    title: 昨天
    gloss: 昨天
    note: دیروز 的意思是“昨天”。
    example_gloss: 昨天我去了电影院。
  fa.a1.unit13.lesson01.teach.raftam_word:
    title: 我去了
    gloss: 我去了
    note: رفتم 是 رفتن（去）的简单过去时，第一人称。
    example_gloss: 我去了餐厅。
  fa.a1.unit13.lesson01.teach.khordam_word:
    title: 我吃了
    gloss: 我吃了
    note: خوردم 是 خوردن（吃）的简单过去时，第一人称。
    example_gloss: 我吃了午饭。
  fa.a1.unit13.lesson01.teach.didam_word:
    title: 我看了
    gloss: 我看了
    note: دیدم 是 دیدن（看）的简单过去时，第一人称。
    example_gloss: 我看了一部好电影。
  fa.a1.unit13.lesson02.teach.sinama_word:
    title: 电影院／电影
    gloss: 电影院／电影
    note: سینما 的意思是“电影院”或“电影”。
    example_gloss: 昨天我去了电影院。
  fa.a1.unit13.lesson02.teach.be_word:
    title: 到 / 去
    gloss: 到；去（某地）
    note: به 的意思是“到、向”，用在目的地前面。
    target_text: به（到）
  fa.a1.unit13.lesson02.teach.diruz_sinama_raftam:
    title: 昨天我去了电影院。
    gloss: 昨天我去了电影院。
    note: دیروز به سینما رفتم 把本课的词语组合成了一个完整的句子。
  fa.a1.unit13.lesson03.teach.chikar_word:
    title: 做什么（活动）
    gloss: 做什么
    note: چیکار（什么事／做什么）用来询问某人做了什么。
    example_gloss: 你昨天做了什么？
  fa.a1.unit13.lesson03.teach.kardi_word:
    title: 你做了
    gloss: 你做了
    note: کردی 是 کردن（做）的简单过去时，口语第二人称。
    example_gloss: 你做了什么？
  fa.a1.unit13.lesson03.teach.question_phrase:
    title: 你昨天做了什么？
    gloss: 您昨天做了什么？
    note: دیروز چیکار کردی؟ 是询问某人昨天做了什么的常见口语说法。
  fa.a1.unit13.lesson04.teach.film_word:
    title: 电影
    gloss: 电影
    note: فیلم 的意思是“电影”。
    example_gloss: 我看了一部好电影。
  fa.a1.unit13.lesson04.teach.khoob_word:
    title: 好
    gloss: 好的
    note: خوب 的意思是“好”。
    example_gloss: 这部电影很好看。
  fa.a1.unit13.lesson04.teach.recent_event_text:
    title: 最近发生的事的示例短文
    gloss: 昨天我去了电影院。我看了一部好电影。然后我吃了午饭。
    note: 一段简短的第一人称叙述，综合运用了本单元的过去时词汇。
  fa.a1.unit13.lesson04.teach.va_word:
    title: 和
    gloss: 和
    note: و 的意思是“和”，用来连接两个分句或两个事物。
    target_text: و（和）
  fa.a1.unit13.lesson05.teach.ketab_word:
    title: 书
    gloss: 书
    note: کتاب 的意思是“书”。
    example_gloss: 我读了一本书。
  fa.a1.unit13.lesson05.teach.khoondam_word:
    title: 我读
    gloss: 我读
    note: خوندم 是 خواندن（读）的口语简单过去时，第一人称。
    example_gloss: 昨天我读了一本书。
  fa.a1.unit13.lesson06.teach.man_word:
    title: 我
    gloss: 我
    note: من 是独立的第一人称代词，这里用来强调（من خونه موندم——至于我，我待在家里）。
    example_gloss: 我待在家里。
  fa.a1.unit13.lesson06.teach.names:
    title: 尼玛和萨拉
    gloss: 尼玛，萨拉
    note: نیما 和 سارا 是本课对话中的两位说话人。
    example_gloss:
    - 尼玛待在家里读了一本书。
    - 萨拉昨天去了电影院。
  fa.a1.unit13.lesson06.teach.khooneh_moondam_word:
    title: 我待在家里
    gloss: 我待在家里
    note: خونه موندم 的意思是“我待在家里”，其中用到口语词 خونه（家）。
  fa.a1.unit13.lesson06.teach.to_chi_word:
    title: 你呢？
    gloss: 你呢？
    note: تو چی؟ 字面意思是“你，什么”，是把问题抛回给对方的自然说法。
  fa.a1.unit13.lesson06.teach.alie_word:
    title: 很棒
    gloss: 太棒了
    note: عالیه 采用了已学过的 -e 缩略规律（عالی است → عالیه）。
    example_gloss: 太棒了，怎么样？
  fa.a1.unit13.lesson06.teach.dialogue_line1:
    title: 你昨天做了什么？
    gloss: 您昨天做了什么？
    note: 尼玛一开始问萨拉昨天做了什么。
  fa.a1.unit13.lesson06.teach.dialogue_line2:
    title: 我去了电影院，看了一部好电影。你呢？
    gloss: 我去了电影院，看了一部好电影。你呢？
    note: 萨拉回答后，把问题抛回给对方。
  fa.a1.unit13.lesson06.teach.dialogue_line3:
    title: 我待在家里，读了一本书。
    gloss: 我待在家里，读了一本书。
    note: 尼玛讲述自己的一天。
  fa.a1.unit13.lesson06.teach.dialogue_line4:
    title: 太棒了！
    gloss: 太棒了！
    note: 萨拉做出积极的回应，结束这段对话。
  fa.a1.unit13.lesson06.teach.third_person_past:
    title: 他/她去了、看了、做了、留了、读了（第三人称）
    gloss: 他／她去了、看了、做了、待了、读了（第三人称）
    note: رفت، دید، کرد، موند، خوند 是第三人称的简单过去时形式，用来比较萨拉和尼玛各自做了什么。
    target_text: رفت، دید، کرد، موند، خوند（他/她去了、看了、做了、留下了、读了——第三人称）
