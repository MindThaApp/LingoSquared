teaching:
  fa.a1.unit36.lesson01.teach.mehrabun:
    title: 友善
    gloss: 善良／友善
    note: '*مهربون* 用来形容善良、热心的人。'
    example_gloss: 萨拉非常善良。
  fa.a1.unit36.lesson01.teach.bamaze:
    title: 有趣
    gloss: 有趣的
    note: '*بامزه* 用来形容有趣、逗人开心的人。'
    example_gloss: 尼玛很有趣。
  fa.a1.unit36.lesson01.teach.khejalati:
    title: 害羞
    gloss: 害羞的
    note: '*خجالتی* 用来形容害羞的人。'
    example_gloss: 他/她有点害羞。
  fa.a1.unit36.lesson01.teach.jeddi:
    title: 严肃
    gloss: 严肃
    note: '*جدی* 用来形容严肃的人。'
    example_gloss: 我们的老师很严肃。
  fa.a1.unit36.lesson01.teach.review_copula_fusion:
    title: 融合的“是”如何接在性格词后面
    gloss: 他/她很善良／很有趣／很害羞（合并式系动词）
    note: '*مهربونه* 是 *مهربون* 和 *است* 直接合并而成，因为 *مهربون* 以辅音结尾。*بامزه‌ست* 在 *ست* 前写了一个零宽不连字符（ZWNJ），因为 *بامزه* 已经以元音 *ه* 结尾。*خجالتیه* 则是把 *ه* 直接接在以 *ی* 结尾的词后面，和外貌单元里的 *قهوه‌ایه* 是同一种模式。'
    target_text: مهربونه = مهربون + است（融合的“是”，接在以辅音结尾的词后）/ بامزه‌ست = بامزه + است（接在以元音结尾的词后，带零宽不连字符）/ خجالتیه = خجالتی + ه（接在以 ی 结尾的词后）
  fa.a1.unit36.lesson02.teach.zerang:
    title: 聪明
    gloss: 聪明
    note: '*زرنگ* 形容人聪明、机灵，尤其指做事灵活、很会想办法。'
    example_gloss: 玛丽亚姆非常聪明。
  fa.a1.unit36.lesson02.teach.tanbal:
    title: 懒
    gloss: 懒
    note: '*تنبل* 形容人懒惰。'
    example_gloss: 我今天有点懒。
  fa.a1.unit36.lesson02.teach.zahmatkesh:
    title: 勤劳
    gloss: 勤奋
    note: '*زحمت‌کش* 形容人工作努力、肯下苦功。'
    example_gloss: 我爸爸非常勤奋。
  fa.a1.unit36.lesson02.teach.sabur:
    title: 有耐心
    gloss: 有耐心的
    note: '*صبور* 形容人有耐心。'
    example_gloss: 我们的老师非常有耐心。
  fa.a1.unit36.lesson02.teach.review_negation:
    title: 否定性格特点
    gloss: 他/她不懒
    note: '*نیست* 否定合并式系动词：*تنبل نیست* 意为“他/她不懒”，这个 *نیست* 和之前学过的否定感受时用的是同一个。'
    target_text: تنبل نیست（他/她不懒）
  fa.a1.unit36.lesson03.teach.shakhsiat_word:
    title: 性格
    gloss: 性格
    note: '*شخصیت* 意为“性格”或“个性”。'
    example_gloss: 他/她的性格很好。
  fa.a1.unit36.lesson03.teach.ask_shakhsiat:
    title: 他/她的性格怎么样？
    gloss: 他/她的性格怎么样？
    note: '*چطوره؟*（“……怎么样？”）在问候单元已经学过；*ش* 是表示“他/她的”的所有格后缀，接在 *شخصیت*（“性格”）后面。'
  fa.a1.unit36.lesson03.teach.answer_mehrabun_zerang:
    title: 他/她非常善良，也很聪明
    gloss: 他/她非常善良，也很聪明
    note: '*و* 意为“和”，用来连接两个描述性格的词。'
  fa.a1.unit36.lesson03.teach.che_joriye:
    title: 他/她是什么样的人？
    gloss: 他/她是什么样的人？
    note: '*چه جوریه؟* 是询问“他/她是个什么样的人”的常用口语说法，可以替代 *شخصیتش چطوره؟*。'
  fa.a1.unit36.lesson03.teach.review_shakhsiat_words:
    title: 性格 / ……怎么样？ / ……是什么样的？
    gloss: 性格／……怎么样？／……是什么样的？
    note: 这三个表达可以用来询问并描述某人的性格。
    target_text: شخصیت（性格）/ چطوره؟（……怎么样？）/ چه جوریه؟（……是什么样的？）
  fa.a1.unit36.lesson04.teach.review_dialogue_words:
    title: 尼玛／萨拉／玛丽亚姆／根本（不）／只／很酷
    gloss: 尼玛／萨拉／玛丽亚姆／根本（不）／只／很酷
    note: '*مریم* 是 *سارا* 的朋友，已在外貌单元中出现过。*اصلاً* 意为“根本（不）”。*فقط* 意为“只”。*باحال* 意为“很酷／不错”。'
  fa.a1.unit36.lesson04.teach.get_to_know:
    title: 我想更多地了解她
    gloss: 我想更多地了解她
    note: '*بیشتر* 意为“更多”。*باهاش* 意为“和他/她一起”。*آشنا بشم* 意为“我（去）熟悉／认识”。'
  fa.a1.unit36.lesson04.teach.dialogue_line1:
    title: 尼玛：萨拉，玛丽亚姆是个什么样的人？
    gloss: 萨拉，玛丽亚姆是个什么样的人？
  fa.a1.unit36.lesson04.teach.dialogue_line2:
    title: 萨拉：她非常善良，也很聪明。
    gloss: 她非常善良，也很聪明。
  fa.a1.unit36.lesson04.teach.dialogue_line3:
    title: 尼玛：她不懒吗？
    gloss: 她不懒吗？
  fa.a1.unit36.lesson04.teach.dialogue_line4:
    title: 萨拉：不，一点也不，她还很勤劳。只是有点害羞。
    gloss: 不，一点也不，她还很勤劳。只是有点害羞。
  fa.a1.unit36.lesson04.teach.dialogue_line5:
    title: 尼玛：真不错，我想更多地了解她。
    gloss: 真不错，我想更多地了解她。
  fa.a1.unit36.lesson05.teach.reading_text:
    title: 阅读：玛丽亚姆的性格
    gloss: 玛丽亚姆是萨拉的朋友。她非常善良，也很聪明。她工作也很勤奋，从不偷懒。只是有点害羞，所以在大型聚会上不怎么说话。
    note: 这篇短文用第三人称描述玛丽亚姆的性格，用到的特点和对话中的一样。
  fa.a1.unit36.lesson05.teach.reading_note:
    title: 从不（搭配否定动词）
    gloss: 从不
    note: '*هیچ‌وقت* 与否定动词（*نیست*、*نمی‌زنه*）连用，表示“从不”。汉语的“从不”“从来不”也是与否定搭配，这一点很相似。'
  fa.a1.unit36.lesson06.teach.self_description:
    title: 我觉得我很勤劳，但也有点懒
    gloss: 我觉得我很勤劳，但也有点懒
    note: '*فکر می‌کنم* 意为“我觉得／我认为”。*زحمت‌کشم* 是 *زحمت‌کش* 和 *هستم*（“我是”）合并而成。*هستم* 是“我是”的完整、未合并形式，这里用在 *هم*（“也”）之后起强调作用。'
  fa.a1.unit36.lesson06.teach.friend_request:
    title: 你的性格怎么样？
    gloss: 你的性格怎么样？
    note: '*شخصیتت* 是在 *شخصیت* 后接口语所有格后缀 *ت*（“你的”），是 *شخصیتش* 的 *تو* 称呼（“你”）版本。'
  fa.a1.unit36.lesson06.teach.review_trait_words:
    title: 善良／有趣／害羞／严肃／聪明／懒／勤劳／有耐心
    gloss: 善良／有趣／害羞／严肃／聪明／懒／勤劳／有耐心
    note: 这是本单元的八个核心性格词。
