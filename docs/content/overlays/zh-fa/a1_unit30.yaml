course:
  title: 波斯语（伊朗）A1
  description: 伊朗波斯语入门：说出大学和学习相关的词（大学、学生、课程／科目、语言），谈论你学什么科目或正在学什么（数学、专业、作为一门科目的英语），询问并回答在哪里学习（*کجا درس می‌خونی؟*）以及多久去一次，阅读一篇关于*نیما*和*سارا*学习情况的短文，最后是*نیما*和*سارا*之间的一段对话，谈他们的科目以及感受（难但有趣）。
