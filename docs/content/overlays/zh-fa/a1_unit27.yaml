course:
  title: 波斯语（伊朗）A1
  description: 波斯语（伊朗）初级：说出各项运动的名称（足球、篮球、排球、游泳），询问“你喜欢什么运动？”，说明在哪里运动（健身房、游泳池、公园），谈论运动的频率（每天、每周、有时、几次），阅读一篇关于 نیما 运动日常的短文，并通过 نیما 和 سارا 之间的结尾对话，比较他们各自做什么运动、多久一次、在哪里运动。
