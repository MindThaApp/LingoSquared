    note: '*می‌کنم*是动词“做”，在本单元中用于表示进行某项运动。'
  fa.a1.unit27.lesson01.teach.footbal_review:
    title: 足球
    gloss: 足球
    note: '*فوتبال*在这里再次出现，是本单元第一个出现的运动名称。'
    example_gloss: 足球是一项运动。
  fa.a1.unit27.lesson01.teach.bazi_mikonam_review:
    title: 我踢足球
    gloss: 我踢足球
    note: '*فوتبال بازی می‌کنم*的意思是“我踢足球”，其中*بازی*的意思是“玩／比赛”。'
  fa.a1.unit27.lesson01.teach.basketball_word:
    title: 篮球
    gloss: 篮球
    note: '*بسکتبال*是日常使用的外来词，意思是篮球。'
    example_gloss: 我喜欢篮球。
  fa.a1.unit27.lesson01.teach.basketball_bazi_mikonam_phrase:
    title: 我打篮球
    gloss: 我打篮球
