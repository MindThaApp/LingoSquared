teaching:
  fa.a1.unit20.lesson01.teach.shirt_word:
    title: 衬衫
    gloss: 衬衫
    note: پیراهن 是衬衫的通称。
    example_gloss: 我想要一件衬衫。
  fa.a1.unit20.lesson01.teach.pants_word:
    title: 裤子
    gloss: 裤子
    note: شلوار 的意思是“裤子”。
    example_gloss: 这条裤子多少钱？
  fa.a1.unit20.lesson01.teach.shoes_word:
    title: 鞋子
    gloss: 鞋子
    note: کفش 的意思是“鞋子”。
    example_gloss: 你们有鞋子吗？
  fa.a1.unit20.lesson01.teach.jacket_word:
    title: 外套
    gloss: 夹克
    note: کت 指西装外套或休闲西装外套；厚重的冬季大衣通常用另一个词来说。
    example_gloss: 我想要一件外套。
  fa.a1.unit20.lesson01.teach.nice_word:
    title: 好看／漂亮
    gloss: 好的；美好的
    note: قشنگ 是日常常用的“好看／漂亮”，常带口语缩合的 -e（قشنگه）。
    example_gloss: 这件外套很好看。
  fa.a1.unit20.lesson01.teach.want_word:
    title: 我想要（复习）
    gloss: 我想要
    note: '*می‌خوام* 是 *می‌خواهم* 的日常口语形式。你在前面的单元学过它；本单元用它来表示想要某件衣服。'
    target_text: می‌خوام（我想要）
  fa.a1.unit20.lesson01.teach.va_word:
    title: 和（复习）
    gloss: 和
    note: '*و* 是表示“和”的常用连接词，前面的单元已学过。'
    target_text: و（和）
  fa.a1.unit20.lesson02.teach.color_word:
    title: 颜色
    gloss: 颜色
    note: رنگ 是“颜色”的通称。
    example_gloss: 你想要什么颜色？
  fa.a1.unit20.lesson02.teach.red_word:
    title: 红色
    gloss: 红色
    note: قرمز 的意思是“红色”。
    example_gloss: 这件衬衫是红色的。
  fa.a1.unit20.lesson02.teach.blue_word:
    title: 蓝色
    gloss: 蓝色的
    note: آبی 的意思是“蓝色”，用缩合的 -e（آبیه）表示“是蓝色的”。
    example_gloss: 我的裤子是蓝色的。
  fa.a1.unit20.lesson02.teach.black_word:
    title: 黑色
    gloss: 黑色的
    note: سیاه 的意思是“黑色”。
    example_gloss: 黑鞋子很好看。
  fa.a1.unit20.lesson02.teach.white_word:
    title: 白色
    gloss: 白色
    note: سفید 的意思是“白色”。
    example_gloss: 我想要一件白色外套。
  fa.a1.unit20.lesson03.teach.size_word:
    title: 尺码
    gloss: 尺码
    note: سایز 是日常用来表示衣服尺码的词。
    example_gloss: 您要什么尺码？
  fa.a1.unit20.lesson03.teach.big_word:
    title: 大
    gloss: 大的
    note: بزرگ 的意思是“大”。
    example_gloss: 我要大号。
  fa.a1.unit20.lesson03.teach.small_word:
    title: 小
    gloss: 小的
    note: کوچیک 的意思是“小”；کوچیکه 是加了口语缩略形式 -e 的“是小的”。
    example_gloss: 这双鞋太小了。
  fa.a1.unit20.lesson03.teach.medium_word:
    title: 中号
    gloss: 中等的
    note: متوسط 的意思是“中等的、中号的”。
    example_gloss: 你们有中号吗？
  fa.a1.unit20.lesson04.teach.try_on_question:
    title: 请求试穿
    gloss: 我可以试穿吗？
    note: می‌تونم امتحانش کنم؟ 是请求试穿衣服时日常口语中的说法。
  fa.a1.unit20.lesson04.teach.yes_go_ahead:
    title: 好的，请便
    gloss: 可以，请。
    note: '*بله، بفرمایید* 是店主表示同意时的礼貌说法，其中的 *بفرمایید* 在之前的单元里学过。'
  fa.a1.unit20.lesson04.teach.contraction_note:
    title: 口语中的 می‌تونم 缩略形式（复习）
    gloss: 我能（口语形式）
    note: 日常口语中，书面语的 -ان- 常常变成 -ون-：*می‌توانم* 变成 *می‌تونم*（我能）。你已经见过同样的变化：*تومن* 就是 *تومان* 的口语形式。
  fa.a1.unit20.lesson05.teach.label_text:
    title: 衣服标签
    gloss: 尺码：大号。颜色：红色。
    note: 一张简短的衣服标签，格式和真实衣服上的一样。
  fa.a1.unit20.lesson06.teach.please_review:
    title: 请／请便（复习）
    gloss: 请／请便
    note: 在之前的单元里学过，现在复习。
  fa.a1.unit20.lesson06.teach.thanks_review:
    title: 谢谢（复习）
    gloss: 谢谢
    note: 在之前的单元里学过，现在复习。
  fa.a1.unit20.lesson06.teach.ok_review:
    title: 好的（复习）
    gloss: 还好
    note: 在之前的单元里学过，现在复习。
  fa.a1.unit20.lesson06.teach.turn01:
    title: 店主招呼顾客
    gloss: 您好，请进。
  fa.a1.unit20.lesson06.teach.turn02:
    title: 尼玛想要一件蓝衬衫
    gloss: 你好，我想要一件蓝衬衫。
  fa.a1.unit20.lesson06.teach.turn03:
    title: 店主询问尺码
    gloss: 您要什么尺码？
  fa.a1.unit20.lesson06.teach.turn04:
    title: 尼玛说出尺码并请求试穿
    gloss: 中号。我可以试穿一下吗？
  fa.a1.unit20.lesson06.teach.turn05:
    title: 店主同意
    gloss: 可以，请。
  fa.a1.unit20.lesson06.teach.turn06:
    title: 尼玛很喜欢并询问价格
    gloss: 真好看。这个多少钱？
  fa.a1.unit20.lesson06.teach.turn07:
    title: 店主说出价格
    gloss: 三万土曼。
  fa.a1.unit20.lesson06.teach.turn08:
    title: 尼玛同意付现金
    gloss: 好的，我付现金。谢谢。
