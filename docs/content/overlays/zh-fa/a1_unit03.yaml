teaching:
  fa.a1.unit03.lesson01.teach.adad:
    title: 数字；号码
    gloss: 数字；号码
    note: عدد 是表示“数字”的通用词。
    example_gloss: 这是一个数字。
  fa.a1.unit03.lesson01.teach.zero:
    title: 零
    gloss: 0——零
    note: صفر 用来表示零，也可以作为较长数字（如电话号码）中的一位数字。
    example_gloss: 零是一个数字。
  fa.a1.unit03.lesson01.teach.one:
    title: 一
    gloss: 1——一
    note: یک 是“一”。
    example_gloss: 我有一本书。
  fa.a1.unit03.lesson01.teach.two:
    title: 二
    gloss: 2——二
    note: دو 是“二”。
    example_gloss: 我有两个苹果。
  fa.a1.unit03.lesson01.teach.three:
    title: 三
    gloss: 3——三
    note: سه 是“三”。
    example_gloss: 他有三个兄弟。
  fa.a1.unit03.lesson01.teach.four:
    title: 四
    gloss: 4——四
    note: چهار 是“四”。
    example_gloss: 四点钟。
  fa.a1.unit03.lesson01.teach.five:
    title: 五
    gloss: 5——五
    note: پنج 是“五”。
    example_gloss: 请等五分钟。
  fa.a1.unit03.lesson01.teach.six:
    title: 六
    gloss: 6——六
    note: شش 是“六”。
    example_gloss: 有六把椅子。
  fa.a1.unit03.lesson01.teach.seven:
    title: 七
    gloss: 7——七
    note: هفت 是“七”。
    example_gloss: 一周有七天。
  fa.a1.unit03.lesson01.teach.eight:
    title: 八
    gloss: 8——八
    note: هشت 是“八”。
    example_gloss: 八点见。
  fa.a1.unit03.lesson01.teach.nine:
    title: 九
    gloss: 9——九
    note: نه 是“九”，同时也是表示“不”的常用词——听到它出现在计数或数字中时，根据语境就能判断是哪个意思。
    example_gloss: 这里有九个学生。
  fa.a1.unit03.lesson01.teach.ten:
    title: 十
    gloss: 10——十
    note: ده 是“十”。
    example_gloss: 我有十根手指。
  fa.a1.unit03.lesson02.teach.eleven:
    title: 十一
    gloss: 11——十一
    note: یازده 是“十一”。
    example_gloss: 我十一点有课。
  fa.a1.unit03.lesson02.teach.twelve:
    title: 十二
    gloss: 12——十二
    note: دوازده 是“十二”。
    example_gloss: 一年有十二个月。
  fa.a1.unit03.lesson02.teach.thirteen:
    title: 十三
    gloss: 13——十三
    note: سیزده 是“十三”。
    example_gloss: 他/她十三岁。
  fa.a1.unit03.lesson02.teach.fourteen:
    title: 十四
    gloss: 14——十四
    note: چهارده 是“十四”。
    example_gloss: 我十四天后来。
  fa.a1.unit03.lesson02.teach.fifteen:
    title: 十五
    gloss: 15——十五
    note: پانزده 是“十五”。
    example_gloss: 他/她有十五本书。
  fa.a1.unit03.lesson02.teach.sixteen:
    title: 十六
    gloss: 16——十六
    note: شانزده 是“十六”——它不能由 شش（六）+ ده（十）推出来，所以要当作一个单独的词来记。
    example_gloss: 他/她十六岁。
  fa.a1.unit03.lesson02.teach.seventeen:
    title: 十七
    gloss: 17——十七
    note: هفده 是“十七”。
    example_gloss: 来了十七个人。
  fa.a1.unit03.lesson02.teach.eighteen:
    title: 十八
    gloss: 18——十八
    note: هجده 是“十八”。
    example_gloss: 他/她十八岁。
  fa.a1.unit03.lesson02.teach.nineteen:
    title: 十九
    gloss: 19——十九
    note: نوزده 是“十九”。
    example_gloss: 还剩十九天。
  fa.a1.unit03.lesson02.teach.twenty:
    title: 二十
    gloss: 20——二十
    note: بیست 是“二十”。
    example_gloss: 我有二十本书。
  fa.a1.unit03.lesson02.teach.thirty:
    title: 三十
    gloss: 30——三十
    note: سی 是“三十”。
    example_gloss: 这个月有三十天。
  fa.a1.unit03.lesson02.teach.forty_to_ninety:
    title: 四十到九十
    gloss: 40, 50, 60, 70, 80, 90
    note: چهل، پنجاه، شصت، هفتاد، هشتاد، نود 是其余的整十数。
    example_gloss:
    - 他/她四十岁。
    - 有五十把椅子。
    - 六十分钟是一小时。
    - 这本书有七十页。
    - 他/她有八十本书。
    - 他/她九十岁。
  fa.a1.unit03.lesson02.teach.combining:
    title: 整十数与个位数的组合
    gloss: 二十五
    note: بیست و پنج 字面意思是“二十和五”——整十数、و、个位数。
  fa.a1.unit03.lesson03.teach.shomare:
    title: 号码
    gloss: 数字；号码
    note: شماره 用于表示电话号码、门牌号等用来识别的编号，不同于 عدد 泛指的“数字”。
    example_gloss: 这是我的电话号码。
  fa.a1.unit03.lesson03.teach.telefon:
    title: 电话
    gloss: 电话
    note: تلفن泛指各种电话，也包括手机。
    example_gloss: 我没有电话。
  fa.a1.unit03.lesson03.teach.digit_by_digit:
    title: 询问电话号码
    gloss: 你的电话号码是多少？
    note: شماره تلفنتون چنده؟ 是询问电话号码时常用的礼貌说法。逐个数字读号码，对方总能听懂，对初学者最稳妥；实际口语中把数字连在一起读也很常见，但本课先练习较简单的逐位读法。
  fa.a1.unit03.lesson03.teach.chande:
    title: 是多少／是什么？
    gloss: 是多少？／多少钱？
    note: چنده؟ 是 چند است 的口语缩读，根据语境询问号码、数量或价格。
  fa.a1.unit03.lesson03.teach.read_number:
    title: 逐位读数字
    gloss: 零、九、一、二、三、四、五、六、七、八、八
    note: 本课练习逐位读数字。伊朗真实的手机号码有11位，以0开头，例如 0912 345 6788。
  fa.a1.unit03.lesson04.teach.sal:
    title: 年
    gloss: 年；岁
    note: سال 既可指日历上的年份，也可用来表示年龄。
    example_gloss: 我二十岁。
  fa.a1.unit03.lesson04.teach.man_recap:
    title: 我（复习）
    gloss: 我
    note: 简单复习一下 من（我），这里要用它来完整地说出自己的年龄。
  fa.a1.unit03.lesson04.teach.chand_saale:
    title: 询问年龄（非正式）
    gloss: 你多大了？
    note: چند سالته؟ 是对单个对方的非正式问法；چند سالتونه؟ 是对应的礼貌说法。
  fa.a1.unit03.lesson04.teach.salame:
    title: 说出你的年龄
    gloss: 我25岁。
    note: سالمه 是把表示“我的”的后缀 ـم 直接加在 سال 上，再加口语中的系词 ـه（是）——字面意思是“我的年龄是”。
  fa.a1.unit03.lesson04.teach.ta:
    title: 计数量词
    gloss: （量词，汉语中有类似的量词用法）
    note: تا 是数东西时最通用的量词：数字 + تا + 名词。
  fa.a1.unit03.lesson04.teach.sib:
    title: 苹果
    gloss: 苹果
    note: سیب 是苹果。
    example_gloss: 我喜欢苹果。
  fa.a1.unit03.lesson04.teach.ketab:
    title: 书
    gloss: 书
    note: کتاب 是书。
    example_gloss: 这是一本好书。
  fa.a1.unit03.lesson04.teach.do_ta_sib:
    title: 提出数量要求
    gloss: 我想要两个苹果。
    note: دو تا سیب می‌خوام 把数量放在名词之前，这是 تا 的常规用法。
  fa.a1.unit03.lesson05.teach.gheymat:
    title: 价格
    gloss: 价格
    note: قیمت 是表示“价格”的通用词。
    example_gloss: 这个的价格是多少？
  fa.a1.unit03.lesson05.teach.toman:
    title: 土曼
    gloss: 土曼（伊朗日常使用的货币单位）
    note: 伊朗的官方货币是里亚尔，但日常口语中报价几乎都用土曼（1土曼 = 10里亚尔）。
    example_gloss: 这个一万土曼。
  fa.a1.unit03.lesson05.teach.hezar:
    title: 千
    gloss: 千
    note: هزار 是“千”；价格通常以几千土曼来说。
    example_gloss: 我有一千土曼。
  fa.a1.unit03.lesson05.teach.ask_price:
    title: 询问价格
    gloss: 这个多少钱？
    note: این چنده؟ 是询问眼前某样东西价格的常用说法。
  fa.a1.unit03.lesson05.teach.price_answer:
    title: 说出价格
    gloss: 三万土曼。
    note: تومنه 是 تومن است 的缩读；完整结构是：数字 + هزار + تومنه。
  fa.a1.unit03.lesson06.teach.practice_together:
    title: 萨拉提议一起练习
    gloss: 萨拉说她想和米娜一起练习波斯语，并询问米娜的电话号码。
    note: باهم 意思是“一起”；می‌خوام ... تمرین کنیم 意思是“我想我们一起练习”。单独的 تمرین کنیم 用作疑问句时，也可以表示“我们练习吧？”
  fa.a1.unit03.lesson06.teach.mina_gives_number:
    title: 米娜说出她的号码
    gloss: 米娜答应了，并逐位读出她的11位号码。
    note: شماره‌ام 是 شماره من 的缩读；هشته 是 هشت است 的缩读，用来结束数字的朗读。
  fa.a1.unit03.lesson06.teach.sara_confirms:
    title: 萨拉确认自己记对了
    gloss: 萨拉请米娜等一下，她来记号码，然后复述一遍以确认。
    note: درسته؟（“对吗？”）是核对刚听到的号码或信息时的常用说法。
  fa.a1.unit03.lesson06.teach.mina_confirms_asks:
    title: 米娜确认并反过来询问
    gloss: 米娜确认号码没错，并询问萨拉的号码。
    note: آره 是非正式的“是”，比 بله 更随意。
  fa.a1.unit03.lesson06.teach.sara_gives_number:
    title: 萨拉说出她的号码
    gloss: 萨拉逐位读出她自己的11位号码。
    note: یکه 是 یک است 的缩读，用来结束数字的朗读，和米娜号码结尾的 هشته 一样。
  fa.a1.unit03.lesson06.teach.mina_will_call:
    title: 米娜答应打电话
    gloss: 米娜说她明天会给萨拉打电话。
    note: زنگ می‌زنم بهت 意思是“我会给你打电话”——字面意思是“我对你敲铃”。
