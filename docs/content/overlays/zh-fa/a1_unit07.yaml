teaching:
  fa.a1.unit07.lesson01.teach.sunny:
    title: 晴天
    gloss: 晴朗的
    note: آفتابی 用来形容晴天。
    example_gloss: 今天天气晴朗。
  fa.a1.unit07.lesson01.teach.rainy:
    title: 下雨的
    gloss: 下雨的
    note: بارونی 是 بارانی（下雨的）在日常口语中的写法和读音。
    example_gloss: 明天会下雨。
  fa.a1.unit07.lesson01.teach.cloudy:
    title: 多云
    gloss: 多云的
    note: ابری 用来形容多云的天气。
    example_gloss: 天气多云。
  fa.a1.unit07.lesson01.teach.snowy:
    title: 下雪的
    gloss: 下雪的
    note: برفی 用来形容下雪的天气。
    example_gloss: 冬天会下雪。
  fa.a1.unit07.lesson01.teach.or_word:
    title: 或
    gloss: 或者
    note: یا 连接两种可选的天气状况。
    target_text: یا（或者）
  fa.a1.unit07.lesson02.teach.hot:
    title: 热
    gloss: 热
    note: گرم 泛指炎热的天气或温度。
    example_gloss: 今天天气很热。
  fa.a1.unit07.lesson02.teach.cold:
    title: 寒冷
    gloss: 寒冷的
    note: سرد 泛指寒冷的天气或温度。
    example_gloss: 冬天天气很冷。
  fa.a1.unit07.lesson02.teach.cool:
    title: 凉爽
    gloss: 凉爽的
    note: خنک 用来形容温和凉爽的天气，介于 گرم 和 سرد 之间。
    example_gloss: 傍晚很凉爽。
  fa.a1.unit07.lesson03.teach.weather_word:
    title: 天气
    gloss: 天气
    note: هوا 是“天气”的通用词（也有“空气”的意思）。
    example_gloss: 今天天气怎么样？
  fa.a1.unit07.lesson03.teach.weather_question:
    title: 询问天气如何
    gloss: 天气怎么样？
    note: هوا چطوره؟ 再次用到 چطوره，这是口语中“怎么样”的疑问词，在第1单元的 حالتون چطوره؟ 中已经见过。
  fa.a1.unit07.lesson03.teach.today_word:
    title: 今天
    gloss: 今天
    note: امروز 指当天。
    example_gloss: 今天天气很好。
  fa.a1.unit07.lesson03.teach.tomorrow_word:
    title: 明天
    gloss: 明天
    note: فردا 指次日。
    example_gloss: 明天见。
  fa.a1.unit07.lesson04.teach.today_sunny:
    title: 说今天天气晴朗
    gloss: 今天天气晴朗。
    note: امروز هوا آفتابیه 使用了本课程已讲过的口语缩略形式 -e（آفتابیه = آفتابی است）。
  fa.a1.unit07.lesson04.teach.today_cold:
    title: 说今天很冷
    gloss: 今天很冷。
    note: امروز سرده 遵循同样的缩略规律。
  fa.a1.unit07.lesson04.teach.contraction_note:
    title: 口语中的 -e 缩略形式
    gloss: آفتابیه 是 آفتابی است 在日常口语中的缩略形式。
    note: 这个规律（形容词 + ه）适用于任何天气词：سرده、گرمه、بارونیه、ابریه、برفیه。
  fa.a1.unit07.lesson04.teach.today_rainy:
    title: 说今天下雨
    gloss: 今天下雨。
    note: امروز بارونیه 把同样的 -e 缩略用在 بارونی 上。
  fa.a1.unit07.lesson05.teach.because_word:
    title: 因为 / 由于
    gloss: 因为 / 由于
    note: چون 用来引出提出建议的理由。
    example_gloss: 我穿外套，因为天气冷。
  fa.a1.unit07.lesson05.teach.better_to:
    title: 建议带伞
    gloss: 我们最好带把伞。
    note: بهتره چتر ببریم 使用口语中的 بهتره（最好）来委婉地提出建议。
  fa.a1.unit07.lesson05.teach.full_suggestion:
    title: 把理由和建议连在一起说
    gloss: 因为下雨，我们最好带把伞。
    note: چون بارونیه، بهتره چتر ببریم 把天气方面的理由和建议连在一起。
  fa.a1.unit07.lesson05.teach.coat_suggestion:
    title: 建议穿外套
    gloss: 因为很冷，我们最好穿外套。
    note: چون سرده، بهتره کت بپوشیم 采用同样的“理由＋建议”句式，用在冷天。
  fa.a1.unit07.lesson06.teach.coat_review:
    title: 建议穿外套
    gloss: 我们最好穿外套
    note: کت بپوشیم 与 چتر ببریم 一样，用的是 بهتره＋动词 的句式，这里用在冷天。
    example_gloss: 天气冷，我们穿外套吧。
  fa.a1.unit07.lesson06.teach.turn01:
    title: 萨拉问今天天气怎么样
    gloss: 萨拉问今天天气怎么样。
    note: هوا چطوره؟ 沿用了第三课的问句。
  fa.a1.unit07.lesson06.teach.turn02:
    title: 礼萨说下雨了
    gloss: 礼萨说他觉得在下雨。
    note: فکر کنم（我想／我觉得）使语气委婉，因为他只是猜测，并不确定。
  fa.a1.unit07.lesson06.teach.turn03:
    title: 萨拉建议带伞
    gloss: 萨拉说那他们最好带把伞。
    note: پس（那么／所以）把天气情况和建议连接起来。
  fa.a1.unit07.lesson06.teach.turn04:
    title: 礼萨表示同意，并问明天怎么样
    gloss: 礼萨表示同意，并问明天呢。
    note: فردا چی؟ 是询问第二天情况的简洁自然的说法。
  fa.a1.unit07.lesson06.teach.turn05:
    title: 萨拉描述明天的天气
    gloss: 萨拉说明天晴天，很热。
    note: آفتابیه و گرمه 用 و 连接了两个带口语缩合形式的天气描述。
  fa.a1.unit07.lesson06.teach.turn06:
    title: 礼萨建议去公园
    gloss: 礼萨说太好了，那我们去公园吧。
    note: عالیه（太好了）先表达积极的反应，再提出计划。
  fa.a1.unit07.lesson06.teach.turn07:
    title: 萨拉同意并道别
    gloss: 萨拉同意了，并说明天见。
    note: باشه（好的）是口语中同意某个计划的常用说法。
