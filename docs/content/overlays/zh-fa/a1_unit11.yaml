    title: 晚一点
    gloss: 晚一点
    note: یه‌کم دیرتر 的意思是晚一点，用来比较两个人的作息。
  fa.a1.unit11.lesson06.teach.turn01:
    title: 你每天几点起床？
    gloss: 你每天几点起床？
    note: 萨拉一开口就问尼马几点起床。
