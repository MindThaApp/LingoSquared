    title: 我晚一点，八点。
    gloss: 我晚一点，八点。
    note: 萨拉把自己的起床时间和尼马的作比较。
  fa.a1.unit11.lesson06.teach.turn04:
    title: 起床以后你做什么？
    gloss: 起床以后你做什么？
    note: 尼马询问萨拉作息中的下一步。
  fa.a1.unit11.lesson06.teach.turn05:
    title: 我吃早饭，然后去上班。晚上我通常十一点睡觉。
    gloss: 我吃早饭，然后去上班。晚上我通常十一点睡觉。
    note: 萨拉用一段连贯的回答说出了作息的其余部分，与本单元前面用到的起床和睡觉时间一致。
