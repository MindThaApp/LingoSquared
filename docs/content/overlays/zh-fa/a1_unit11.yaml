teaching:
  fa.a1.unit11.lesson01.teach.bidar_misham:
    title: 我起床
    gloss: 我起床
    note: بیدار می‌شم 是 بیدار می‌شوم 的德黑兰口语形式。
    example_gloss: 我每天七点起床。
  fa.a1.unit11.lesson01.teach.sobhune_mikhoram:
    title: 我吃早饭
    gloss: 我吃早饭
    note: صبحونه می‌خورم 用的是口语词 صبحونه（早饭），而不是较正式的 صبحانه。
    example_gloss: 我吃完早饭就去上班。
  fa.a1.unit11.lesson01.teach.miram_sarkar:
    title: 我去上班
    gloss: 我去上班
    note: میرم سر کار 是 می‌روم سر کار 的口语说法。
    example_gloss: 然后我去上班。
  fa.a1.unit11.lesson01.teach.mikhabam:
    title: 我去睡觉
    gloss: 我去睡觉
    note: می‌خوابم 的意思是我睡觉／我去睡觉。
    example_gloss: 我晚上很早就睡觉。
  fa.a1.unit11.lesson01.teach.va_word:
    title: 和
    gloss: 和；而且
    note: '*و* 是常用的连接词，用来连接作息中的各个活动，第9单元已经介绍过。'
    example_gloss: 我起床，然后吃早饭。
  fa.a1.unit11.lesson02.teach.che_saat_bidar:
    title: 你几点起床？
    gloss: 你几点起床？
    note: '*ساعت چند بیدار می‌شی؟* 沿用了第9单元报时课中的 *ساعت چند*（几点）。'
  fa.a1.unit11.lesson02.teach.saat_haft_bidar:
    title: 我七点起床。
    gloss: 我七点起床。
    note: ساعت هفت بیدار می‌شم 说出了具体的起床时间。
  fa.a1.unit11.lesson02.teach.har_ruz:
    title: 每天
    gloss: 每天
    note: هر روز 的意思是每天，用来表示作息是一种习惯。
    example_gloss: 我每天七点起床。
  fa.a1.unit11.lesson03.teach.bad:
    title: 之后
    gloss: 之后
    note: بعدش 的意思是“之后”，用来按先后顺序叙述作息中的活动。
    example_gloss: 我起床，然后吃早饭。
  fa.a1.unit11.lesson03.teach.parts_of_day:
    title: 早晨、中午、下午、晚上
    gloss: 早晨、中午、下午、晚上
    note: '*صبح*、*ظهر*、*عصر* 和 *شب* 是一天的四个时段，在第9单元学过，这里复习。'
    example_gloss:
    - 我早上起床。
    - 我中午吃午饭。
    - 我下午工作。
    - 我夜里睡觉。
  fa.a1.unit11.lesson03.teach.night_routine:
    title: 我晚上十一点睡觉。
    gloss: 我晚上十一点睡觉。
    note: '*شب‌ها ساعت یازده می‌خوابم* 建立在第9单元一天时段词汇 *شب*（晚上）的基础上；*شب‌ها* 表示习惯上“每到晚上”。'
  fa.a1.unit11.lesson04.teach.routine_text:
    title: 作息短文
    gloss: 我每天七点起床。然后吃早饭，去上班。
    note: 这是一段连贯的真实早晨作息描述，用 هر روز 和 بعدش 来安排活动的先后顺序。
  fa.a1.unit11.lesson05.teach.tow_chi:
    title: 你呢？
    gloss: 你呢？
    note: تو چی؟ 用来把问题反问给对方。
