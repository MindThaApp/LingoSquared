teaching:
  fa.a1.unit21.lesson01.teach.money_word:
    title: 钱
    gloss: 钱
    note: پول 是“钱”的通用说法。
    example_gloss: 我的钱在哪里?
  fa.a1.unit21.lesson01.teach.bank_word:
    title: 银行
    gloss: 银行
    note: بانک 是“银行”的通用说法。
    example_gloss: 银行就在附近。
  fa.a1.unit21.lesson01.teach.dollar_word:
    title: 美元
    gloss: 美元
    note: دلار 指(美)元,是日常兑换对话中最常提到的外币。
    example_gloss: 我有美元。
  fa.a1.unit21.lesson01.teach.exchange_word:
    title: 兑换
    gloss: 兑换
    note: تبدیل 意为“兑换、转换”,与 کردن(做)连用,构成 تبدیل کردن。
    example_gloss: 我想兑换(钱)。
  fa.a1.unit21.lesson01.teach.va_word:
    title: 和
    gloss: 和
    note: و 是常用的连接词,在前面的单元中已学过。
    target_text: و(和)
  fa.a1.unit21.lesson02.teach.want_exchange:
    title: 表达想兑换货币
    gloss: 我想把美元兑换成土曼。
    note: می‌خوام دلار به تومن تبدیل کنم 中用 به（成、到）来表示目标货币。
  fa.a1.unit21.lesson02.teach.how_much_dollar:
    title: 询问有多少美元
    gloss: 您有多少美元?
    note: '*چقدر دلار دارید؟* 中的 *چقدر*（多少）在之前的数量提问里你已经见过。'
  fa.a1.unit21.lesson03.teach.atm_word:
    title: 自动取款机
    gloss: 自动取款机
    note: خودپرداز 字面意思是“自助支付者”，是表示自动取款机的标准词。
    example_gloss: 自动取款机在那边。
  fa.a1.unit21.lesson03.teach.withdraw_phrase:
    title: 表达想取钱
    gloss: 我想从自动取款机取钱。
    note: می‌خوام از خودپرداز پول بردارم 中用了 از（从）和 بردارم（我取出）。
  fa.a1.unit21.lesson04.teach.change_question:
    title: 询问有没有零钱
    gloss: 您有零钱吗?
    note: پول خرد دارید؟ 中，خرد（零碎的、零散的）放在 پول（钱）之后。
  fa.a1.unit21.lesson04.teach.here_you_are:
    title: 给您（复习）
    gloss: 给您／请
    note: '*بفرمایید* 在之前的单元已学过；这里用于把东西递给对方时。'
  fa.a1.unit21.lesson05.teach.rate_word:
    title: 汇率
    gloss: 汇率
    note: نرخ 是表示（兑换）汇率的词。
    example_gloss: 今天的汇率是多少?
  fa.a1.unit21.lesson05.teach.per_dollar_rate:
    title: 说出每美元的汇率
    gloss: 每美元30土曼。
    note: هر دلار سی تومنه 中用了 هر（每）以及你已经学过的口语缩读 -e（*تومنه* = *تومن است*）。
  fa.a1.unit21.lesson06.teach.hundred_word:
    title: 一百
    gloss: 一百
    note: صد 是数字100。
    example_gloss: 我有一百美元。
  fa.a1.unit21.lesson06.teach.please_do:
    title: 请办理
    gloss: 请兑换
    note: لطفاً تبدیل کنید 是 تبدیل کردن（兑换）的礼貌祈使形式。
  fa.a1.unit21.lesson06.teach.turn01:
    title: 萨拉要求兑换货币
    gloss: 萨拉向店员问好，说她想把美元兑换成土曼。
    note: 沿用第2课的 می‌خوام دلار به تومن تبدیل کنم。
  fa.a1.unit21.lesson06.teach.turn02:
    title: 店员询问有多少美元
    gloss: 店员向萨拉问好，并问她有多少美元。
    note: 沿用第2课的 چقدر دلار دارید؟
  fa.a1.unit21.lesson06.teach.turn03:
    title: 萨拉说出金额并询问汇率
    gloss: 萨拉说她有一百美元，并问今天的汇率。
    note: صد（一百）是新词；نرخ امروز چنده؟ 沿用第5课的汇率提问。
  fa.a1.unit21.lesson06.teach.turn04:
    title: 店员说出汇率
    gloss: 店员说每美元30土曼。
    note: 沿用第5课的 هر دلار سی تومنه。
  fa.a1.unit21.lesson06.teach.turn05:
    title: 萨拉同意并请店员办理
    gloss: 萨拉表示同意，并请店员兑换。
    note: لطفاً تبدیل کنید，本课前面已学过。
  fa.a1.unit21.lesson06.teach.turn06:
    title: 店员递上总额
    gloss: 给您，三千土曼。
    note: '*سه هزار تومن* = 100美元 × 每美元30土曼。*هزار*（千）在数字单元中已复习过。'
  fa.a1.unit21.lesson06.teach.turn07:
    title: 萨拉道谢，并问有没有零钱
    gloss: 谢谢。您也有零钱吗?
    note: 沿用第4课的 پول خرد دارید؟，并加上 هم（也）。
  fa.a1.unit21.lesson06.teach.turn08:
    title: 店员确认并递上
    gloss: 有，给您。
    note: بله（是的）是复习词；بفرمایید 用来结束这次兑换。
